<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leçon 3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
var DAY = {
  num: 3,
  title: "Le premier modèle : models.Model et les champs",
  subtitle: "Une classe Python, des attributs typés : models.py devient le plan de ta table ludotheque_jeu.",
  theory: `
<h3>1. La classe Jeu : chaque attribut est une future colonne</h3>
<p>Voici le premier habitant de notre couche de persistance. Un <strong>modèle</strong>, en Django, est une classe Python qui décrit une table : c'est le plan qui dit quelles colonnes existent et de quel type. Dans le fichier <em>ludotheque/models.py</em>, on écrit une classe qui <strong>hérite de models.Model</strong>. <strong>Hériter</strong>, c'est « recevoir en cadeau » tout le savoir-faire d'une classe existante : en héritant de <code>models.Model</code>, notre classe <code>Jeu</code> gagne d'un coup tous ses pouvoirs Active Record vus à la leçon 1 (savoir se sauvegarder, se filtrer…). Chaque attribut de classe est un <strong>champ</strong> (en anglais <em>Field</em> : la description d'une donnée), et chaque champ deviendra une <strong>colonne</strong> de la table :</p>
<pre class="pseudo"># ludotheque/models.py  -- le fichier ou vivent tous les modeles de l'app "ludotheque"
from django.db import models          # on importe le module models : il contient models.Model et tous les types de champs

class Jeu(models.Model):              # on declare la classe Jeu ; (models.Model) = elle HERITE de Model (pouvoirs ORM)
    titre = models.CharField(max_length=120)   # champ texte court, 120 caracteres maxi -> colonne varchar(120)
    editeur = models.CharField(max_length=80)  # autre texte court -> varchar(80)
    prix = models.DecimalField(max_digits=6, decimal_places=2)  # nombre decimal exact : 6 chiffres dont 2 apres la virgule
    stock = models.PositiveIntegerField(default=0)  # entier positif ; default=0 = vaut 0 si on ne precise rien
    date_sortie = models.DateField(null=True, blank=True)  # une date ; null=True (NULL en base) et blank=True (facultatif en formulaire)
    disponible = models.BooleanField(default=True)  # vrai/faux ; default=True = disponible par defaut</pre>
<p>Tu connais déjà les colonnes correspondantes, tu les as tapées au Niveau 4 : CharField(max_length=120) → <em>varchar(120)</em>, DecimalField(max_digits=6, decimal_places=2) → <em>numeric(6, 2)</em>, PositiveIntegerField → <em>integer UNSIGNED</em>, DateField → <em>date</em>, BooleanField → <em>bool</em>. Le mapping de la leçon 1 devient concret : une classe, une table ; un attribut, une colonne.</p>

<h3>2. La clé primaire id et le nom de la table</h3>
<p>Relis la classe Jeu : aucune <strong>clé primaire</strong> déclarée. La clé primaire est la colonne qui identifie chaque ligne de façon unique (comme un numéro de dossier). Normal qu'on ne la voie pas — Django en ajoute une <strong>automatiquement</strong> : un champ <strong>id</strong> de type BigAutoField, qui deviendra <em>id bigint AUTO_INCREMENT PRIMARY KEY</em> côté MySQL (<em>AUTO_INCREMENT</em> = la base attribue toute seule le numéro suivant). Tu ne la déclares pas, tu ne la remplis pas : la base l'incrémente à chaque insertion, exactement comme tes AUTO_INCREMENT du Niveau 4. Quant au nom de la table, Django applique la convention <strong>app_modele</strong> (nom de l'application + nom du modèle), tout en minuscules :</p>
<pre class="pseudo">app "ludotheque" + class Jeu     →  table ludotheque_jeu      # nom de l'app + nom de la classe, en minuscules
app "ludotheque" + class Membre  →  table ludotheque_membre   # meme regle pour chaque modele

# Personnalisable si besoin (base héritée, conventions maison) :
class Jeu(models.Model):             # on reprend la classe Jeu...
    ...                              # ... (ses champs, ici resumes par ...)
    class Meta:                      # classe interne Meta : reglages "meta" du modele (comportements d'ensemble)
        db_table = 'jeu'   # force le nom de table   # ici on impose le nom 'jeu' au lieu de ludotheque_jeu</pre>
<p>Dans ce cours, on garde la convention : nos tables s'appelleront <em>ludotheque_jeu</em> et <em>ludotheque_membre</em>.</p>

<h3>3. Les options de champ : max_length, default, unique, null, blank</h3>
<p>Les <strong>options</strong> sont les réglages passés entre parenthèses à un champ ; elles affinent chaque colonne — et l'une des distinctions les plus importantes du cours se joue ici. <strong>null=True</strong> concerne la <strong>base</strong> : la colonne accepte la valeur spéciale NULL (« aucune valeur »). <strong>blank=True</strong> concerne la <strong>validation des formulaires</strong> Django (Niveau 3) : le champ peut rester vide au moment de la saisie. Deux mondes différents : <em>date_sortie = models.DateField(null=True, blank=True)</em> dit « NULL autorisé en base ET champ facultatif dans les formulaires ». Voici le second modèle canonique de la Ludothèque :</p>
<pre class="pseudo">class Membre(models.Model):              # deuxieme modele : un membre de la ludotheque
    pseudo = models.CharField(max_length=30, unique=True)  # texte 30 max ; unique=True = jamais deux memes pseudos
    email = models.EmailField(unique=True)   # EmailField = CharField qui verifie le format d'email ; unique aussi
    date_inscription = models.DateField(auto_now_add=True)  # auto_now_add = date figee automatiquement a la creation</pre>
<p><strong>unique=True</strong> deviendra une contrainte UNIQUE en base (deux membres ne partageront jamais un pseudo) ; <strong>default=0</strong> fournit la valeur quand on n'en donne pas ; <strong>auto_now_add=True</strong> fige la date à la création de la ligne, une fois pour toutes — parfait pour une date d'inscription.</p>

<h3>4. __str__ et class Meta : rendre le modèle civilisé</h3>
<p>Sans rien faire, un objet Jeu s'affiche <em>&lt;Jeu: Jeu object (1)&gt;</em> — illisible dans le shell comme dans l'admin du Niveau 3. Une <strong>méthode</strong> est une fonction attachée à une classe ; la méthode spéciale <strong>__str__</strong> (avec deux tirets bas de chaque côté, prononcé « dunder str ») définit comment un objet se transforme en texte. La classe interne <strong>Meta</strong> règle les comportements d'ensemble :</p>
<pre class="pseudo">class Jeu(models.Model):                 # la classe Jeu, version "civilisee"
    titre = models.CharField(max_length=120)   # champ titre (les autres champs sont resumes ci-dessous)
    # ... les autres champs ...            # editeur, prix, stock... (identiques a plus haut)

    class Meta:                          # reglages d'ensemble du modele
        ordering = ['titre']            # tri par défaut des requêtes   # tout QuerySet sortira trie par titre
        verbose_name = 'jeu de société' # nom humain (admin, messages)  # etiquette lisible dans l'admin Django

    def __str__(self):                   # methode appelee quand on veut afficher l'objet en texte
        return self.titre                # on renvoie le titre : l'objet s'affichera par son titre

# Dans le shell, dès la leçon 5 :
# &lt;QuerySet [&lt;Jeu: 7 Wonders&gt;, &lt;Jeu: Azul&gt;, &lt;Jeu: Catan&gt;]&gt;   # resultat affiche...
#            lisible ET trié par titre grâce à __str__ et ordering   # ... grace a __str__ (lisible) + ordering (trie)</pre>

<h3>5. Panorama des champs courants</h3>
<p>Tu croiseras vite d'autres types : <strong>TextField</strong> (texte long sans max_length, → <em>longtext</em>), <strong>EmailField</strong> (un CharField qui valide le format d'adresse), <strong>PositiveSmallIntegerField</strong> (petits entiers positifs — une note de 1 à 5), <strong>DateTimeField</strong> (date et heure, avec auto_now_add ou auto_now), <strong>URLField</strong>, <strong>FloatField</strong>… La règle de choix vient de ton Niveau 4 : le type le plus précis et le plus contraint possible — DecimalField pour l'argent, jamais FloatField (nombre « flottant » approximatif) et ses arrondis. Une ligne pour les voisins : chez Hibernate/JPA on annote la classe avec @Entity et les attributs avec @Column, chez EF Core ce sont des propriétés C# affinées par DataAnnotations ou la Fluent API, chez Eloquent le modèle reste maigre ($fillable) et les colonnes se décrivent dans des migrations séparées.</p>
<div class="warn">Évite <strong>null=True sur les champs texte</strong> (CharField, TextField) : tu obtiendrais <em>deux</em> représentations du « vide » — NULL et la chaîne '' — et tes filtres du Niveau 4 comme tes filter() à venir devraient tester les deux. Convention Django : un texte vide se stocke '', avec blank=True si la saisie est facultative.</div>
<div class="tip">Écris <strong>__str__ dès la création</strong> de chaque modèle, avant même la première migration : le shell (leçon 5), l'admin (Niveau 3) et tous tes futurs &lt;QuerySet [...]&gt; te le rendront au centuple.</div>`,
  exercises: [
    { type: "qcm", q: "Pour qu'une classe devienne un modèle Django, elle doit…", opts: ["S'appeler comme la table", "Hériter de models.Model", "Être déclarée dans settings.py", "Implémenter save() elle-même"], a: 1, exp: "L'héritage de models.Model apporte les champs, le manager objects et la persistance Active Record." },
    { type: "qcm", q: "CharField(max_length=120) devient en MySQL…", opts: ["varchar(120)", "text(120)", "char(120) obligatoire", "longtext"], a: 0, exp: "Le mapping exact que sqlmigrate te montrera à la leçon 4." },
    { type: "qcm", q: "prix = models.DecimalField(max_digits=6, decimal_places=2) donne la colonne…", opts: ["float(6)", "int(6,2)", "numeric(6, 2)", "varchar(6)"], a: 2, exp: "Six chiffres au total dont deux décimales : le bon type pour des prix en euros, sans arrondis flottants." },
    { type: "input", q: "Le nom de la table générée pour le modèle Jeu de l'app ludotheque :", a: ["ludotheque_jeu"], ph: "app_modele…", exp: "Convention app_modele en minuscules, personnalisable via Meta.db_table." },
    { type: "qcm", q: "La clé primaire du modèle Jeu…", opts: ["Doit être déclarée à la main", "Est créée automatiquement : un champ id (BigAutoField, AUTO_INCREMENT)", "Est le champ titre", "N'existe pas tant qu'on ne la demande pas"], a: 1, exp: "Tu ne la déclares pas, tu ne la remplis pas : la base l'incrémente à chaque INSERT." },
    { type: "vf", q: "Il faut écrire id = models.BigAutoField(primary_key=True) dans chaque modèle.", a: false, exp: "Django l'ajoute tout seul si aucun champ ne porte primary_key=True." },
    { type: "qcm", q: "La différence entre null=True et blank=True :", opts: ["null concerne la base (NULL autorisé), blank la validation des formulaires", "Ce sont deux synonymes", "blank concerne la base, null les formulaires", "null est réservé aux nombres"], a: 0, exp: "Deux mondes : la colonne MySQL d'un côté, la saisie utilisateur du Niveau 3 de l'autre." },
    { type: "qcm", q: "pseudo = models.CharField(max_length=30, unique=True) produit côté MySQL…", opts: ["Une clé primaire", "Une contrainte UNIQUE sur la colonne pseudo", "Un index sans contrainte", "Rien de particulier"], a: 1, exp: "Deux membres ne pourront jamais partager le même pseudo : la base le garantit." },
    { type: "input", q: "La méthode à définir pour qu'un objet s'affiche lisiblement dans le shell et l'admin :", a: ["__str__", "__str__()", "str"], ph: "def …(self):", exp: "return self.titre — et tes QuerySets deviennent lisibles." },
    { type: "qcm", q: "date_inscription = models.DateField(auto_now_add=True) signifie…", opts: ["La date est modifiée à chaque save()", "La date est demandée à l'utilisateur", "La date est figée automatiquement à la création de la ligne", "La colonne accepte NULL"], a: 2, exp: "auto_now_add fige à la création ; auto_now (sur DateTimeField) se met à jour à chaque sauvegarde." },
    { type: "vf", q: "null=True est recommandé sur les CharField pour représenter l'absence de texte.", a: false, exp: "Tu aurais deux « vides » possibles, NULL et '' : convention Django, un texte vide se stocke ''." },
    { type: "qcm", q: "L'option Meta.db_table sert à…", opts: ["Forcer le nom de la table au lieu de la convention app_modele", "Choisir le moteur MySQL", "Chiffrer la table", "Créer un index"], a: 0, exp: "Utile pour une base héritée ; dans ce cours on garde ludotheque_jeu." },
    { type: "qcm", q: "Dans class Meta, ordering = ['titre'] provoque…", opts: ["Une erreur si titre est NULL", "Un tri par défaut de toutes les requêtes sur ce modèle", "Un index unique sur titre", "Le renommage de la colonne"], a: 1, exp: "Les QuerySets sortiront triés par titre sans order_by explicite." },
    { type: "qcm", q: "L'équivalent Hibernate/JPA de la déclaration d'un modèle et de ses champs :", opts: ["$fillable", "DbContext", "Le fichier .env", "@Entity sur la classe et @Column sur les attributs"], a: 3, exp: "Chez EF Core : propriétés + DataAnnotations/Fluent API ; chez Eloquent : $fillable et migrations séparées." },
    { type: "qcm", q: "Pour stocker l'adresse électronique d'un membre avec validation du format :", opts: ["TextField", "CharField(max_length=5)", "EmailField", "BooleanField"], a: 2, exp: "EmailField est un CharField spécialisé qui valide la forme de l'adresse." }
  ],
  final: {
    title: "Exercice final — Du modèle à la colonne",
    intro: `<p>Jeu et Membre sont écrits dans models.py : vérifions que chaque ligne de ces classes a un sens précis pour toi, jusqu'à la colonne MySQL.</p>`,
    questions: [
      { type: "qcm", q: "stock = models.PositiveIntegerField(default=0) donne en MySQL…", opts: ["integer UNSIGNED, avec 0 si aucune valeur fournie", "varchar(10)", "numeric(6, 2)", "bigint PRIMARY KEY"], a: 0, exp: "Entier positif côté base, valeur par défaut côté Django : un stock ne peut pas être négatif." },
      { type: "input", q: "Le nom de la table générée pour le modèle Membre :", a: ["ludotheque_membre"], ph: "app_modele…", exp: "Même convention que ludotheque_jeu : app_modele." },
      { type: "vf", q: "date_sortie = models.DateField(null=True, blank=True) : la colonne accepte NULL et le champ est facultatif dans les formulaires.", a: true, exp: "null pour la base, blank pour la validation — les deux options se complètent ici légitimement (une date, pas un texte)." },
      { type: "qcm", q: "Sans __str__, un objet Jeu s'affiche…", opts: ["Pas du tout", "&lt;Jeu: Jeu object (1)&gt; — illisible", "Par son titre quand même", "En JSON"], a: 1, exp: "D'où la règle : __str__ dès la création du modèle." },
      { type: "qcm", q: "Pour un prix en euros, on choisit DecimalField plutôt que FloatField parce que…", opts: ["FloatField est plus lent", "DecimalField évite les erreurs d'arrondi des flottants sur l'argent", "FloatField n'existe pas", "DecimalField prend moins de place"], a: 1, exp: "Règle héritée du Niveau 4 : jamais de flottants pour la monnaie." }
    ],
    solution: `<pre class="pseudo">class Jeu(models.Model)          → table ludotheque_jeu (convention app_modele)   # 1 classe = 1 table
  titre     CharField(120)        → varchar(120) NOT NULL          # texte court obligatoire
  editeur   CharField(80)         → varchar(80) NOT NULL           # texte court obligatoire
  prix      DecimalField(6,2)     → numeric(6, 2)   (jamais Float pour l'argent)   # decimal exact pour la monnaie
  stock     PositiveIntegerField  → integer UNSIGNED, default=0    # entier positif, 0 par defaut
  date_sortie DateField(null=True, blank=True) → date NULL         # date facultative (base + formulaire)
  disponible BooleanField         → bool, default=True             # vrai/faux, disponible par defaut
  id        (automatique)         → bigint AUTO_INCREMENT PRIMARY KEY   # cle primaire ajoutee par Django

Membre : pseudo unique, email unique, date_inscription auto_now_add   # 2e modele
Options : null = base | blank = formulaires | unique | default        # les 4 reglages cles
Civiliser : __str__ (affichage) + Meta (ordering, verbose_name, db_table)   # rendre le modele lisible</pre>
<p>Le plan est dessiné… mais MySQL n'en sait rien encore : aucune table n'existe. Leçon 4 : <strong>Les migrations : makemigrations et migrate</strong> — le pont entre models.py et le CREATE TABLE.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "djangoorm-l3", title: "Du CREATE TABLE au modèle", level: 1,
    statement: "Au Niveau 4, tu avais écrit à la main : CREATE TABLE membre (id INT AUTO_INCREMENT PRIMARY KEY, pseudo VARCHAR(30) NOT NULL UNIQUE, email VARCHAR(254) NOT NULL UNIQUE, date_inscription DATE NOT NULL, credit DECIMAL(6,2) NOT NULL DEFAULT 0, bio TEXT NULL). Traduis cette table en modèle Django complet, colonne par colonne : pour chacune, donne le champ choisi et justifie le type ET chaque option (unique, default, null/blank, auto_now_add…). Signale les colonnes qu'il ne faut PAS traduire et pourquoi. Traite le cas épineux de bio TEXT NULL : que recommande la convention Django, et que changerais-tu ? Termine par la classe complète, __str__ et Meta compris.",
    hints: [
      "Une colonne de la table n'a pas besoin d'exister dans le modèle : Django la génère tout seul — laquelle ?",
      "email VARCHAR(254) UNIQUE : un CharField ferait l'affaire, mais un champ plus spécialisé valide en plus le format ; credit DECIMAL(6,2) DEFAULT 0 combine deux options vues dans la leçon.",
      "bio TEXT NULL : rappelle-toi le warn de la leçon — deux « vides » possibles. Quelle paire d'options Django exprime « texte long facultatif » proprement ?"
    ],
    solution: "Colonne par colonne\n- id INT AUTO_INCREMENT PRIMARY KEY : NE PAS traduire.\n  Django crée automatiquement id (BigAutoField, AUTO_INCREMENT).\n- pseudo VARCHAR(30) NOT NULL UNIQUE :\n  pseudo = models.CharField(max_length=30, unique=True)\n  → varchar(30) + contrainte UNIQUE ; NOT NULL est le défaut Django.\n- email VARCHAR(254) NOT NULL UNIQUE :\n  email = models.EmailField(unique=True)\n  → EmailField = CharField(254) + validation du format d'adresse.\n- date_inscription DATE NOT NULL :\n  date_inscription = models.DateField(auto_now_add=True)\n  → figée automatiquement à la création : personne ne la saisit.\n- credit DECIMAL(6,2) NOT NULL DEFAULT 0 :\n  credit = models.DecimalField(max_digits=6, decimal_places=2, default=0)\n  → numeric(6, 2), jamais FloatField pour l'argent ; default=0 traduit le DEFAULT.\n- bio TEXT NULL : la convention Django refuse null=True sur du texte\n  (deux vides : NULL et ''). Traduction propre :\n  bio = models.TextField(blank=True)\n  → colonne NOT NULL, chaîne vide autorisée, champ facultatif en formulaire.\n  Je change donc le schéma : le « vide » devient '', plus simple à filtrer.\n\nClasse complète :\nclass Membre(models.Model):\n    pseudo = models.CharField(max_length=30, unique=True)\n    email = models.EmailField(unique=True)\n    date_inscription = models.DateField(auto_now_add=True)\n    credit = models.DecimalField(max_digits=6, decimal_places=2, default=0)\n    bio = models.TextField(blank=True)\n\n    class Meta:\n        ordering = ['pseudo']\n\n    def __str__(self):\n        return self.pseudo",
    note: "Cet exercice de traduction est le pivot entre tes deux niveaux précédents : le CREATE TABLE vient de ton Niveau 4, la classe part vers l'admin et les formulaires du Niveau 3 — et c'est désormais le modèle Python, pas Workbench, qui fait foi (leçon 4). Au Niveau 6, tu feras ce travail dans l'autre sens : concevoir directement en modèles Django, en pensant SQL sans plus l'écrire. Hibernate/JPA, EF Core et Eloquent te demanderont exactement la même gymnastique type par type." }
  ]
};
</script>
