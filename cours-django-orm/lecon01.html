<script>
var DAY = {
  num: 1,
  title: "Pourquoi un ORM ? Du SQL aux objets",
  subtitle: "Ton code Python pense en objets, ta base MySQL pense en tables. L'ORM est le traducteur.",
  theory: `
<h3>1. Deux mondes qui ne parlent pas la même langue</h3>
<p>Commençons par les mots de base, car tout le cours repose dessus. Une <strong>base de données</strong> est un immense classeur électronique où une application range ses informations pour les retrouver plus tard. À l'intérieur, une <strong>table</strong> est comme une feuille de tableur : elle a un nom (par exemple <em>jeu</em>) et elle stocke des données du même genre. Chaque <strong>ligne</strong> de la table est une fiche (un jeu précis, par exemple « Catan »), et chaque <strong>colonne</strong> est une caractéristique commune à toutes les fiches (le titre, le prix…). <strong>MySQL</strong> est le logiciel (on dit le <em>SGBD</em>, système de gestion de base de données) qui gère ce classeur, et <strong>SQL</strong> est la langue qu'on lui parle pour lire ou modifier les données.</p>
<p>De l'autre côté, ton programme <strong>Python</strong> ne pense pas en tableaux mais en <strong>objets</strong>. Un objet est comme une petite fiche vivante en mémoire : un jeu représenté par une variable <code>jeu</code> qui possède des <strong>attributs</strong> (<code>jeu.titre</code>, <code>jeu.prix</code>) — les attributs sont les « cases » de l'objet. Le plan qui décrit à quoi ressemblent tous les objets d'un même genre s'appelle une <strong>classe</strong> (la classe <code>Jeu</code> est le moule, chaque objet en est un exemplaire).</p>
<p>Au Niveau 4, tu as conçu le <strong>schéma</strong> MySQL de la <strong>Ludothèque</strong> (le schéma = le plan des tables) : des tables <em>jeu</em>, <em>membre</em>, <em>location</em>, <em>avis</em>, avec des lignes et des colonnes. Au Niveau 3, ton application Django manipulait des <strong>classes</strong>, des <strong>objets</strong> et des <strong>attributs</strong>. Ces deux mondes ne se ressemblent pas : une table n'est pas une classe, une ligne n'est pas un objet, une <strong>clé étrangère</strong> (une colonne qui pointe vers la ligne d'une autre table, comme un renvoi « voir fiche n° 7 ») n'est pas une référence Python. Ce fossé porte un nom : le <strong>décalage objet-relationnel</strong> (en anglais <em>impedance mismatch</em>, littéralement « désaccord d'impédance », image empruntée à l'électronique où deux circuits mal accordés communiquent mal).</p>
<pre class="pseudo">Monde relationnel (MySQL)      Monde objet (Python)          # a gauche la base de donnees, a droite ton code
--------------------------     --------------------------    # ligne de separation (decorative)
table jeu                      class Jeu                     # une TABLE correspond a une CLASSE (le moule)
ligne (id=3, 'Catan', ...)     objet jeu (jeu.titre == 'Catan')  # une LIGNE (une fiche) correspond a un OBJET
colonne prix DECIMAL(6,2)      attribut jeu.prix (Decimal)   # une COLONNE correspond a un ATTRIBUT de l'objet
clé étrangère membre_id        référence location.membre     # une CLE ETRANGERE correspond a un lien entre objets</pre>

<h3>2. Ce qu'un ORM fait pour toi</h3>
<p>Un <strong>ORM</strong> (<em>Object-Relational Mapping</em>, « correspondance objet-relationnel ») est une bibliothèque — un ensemble d'outils tout prêts — qui fait le pont entre ces deux mondes. Imagine un <strong>interprète</strong> bilingue : tu lui parles en objets Python, il traduit en SQL pour MySQL, écoute la réponse en lignes, et te la retraduit en objets. Trois missions : <strong>1) le mapping</strong> (la « correspondance ») — il associe une classe à une table, un attribut à une colonne, un objet à une ligne ; <strong>2) la génération du SQL</strong> — tu écris du Python, il écrit pour toi les <em>SELECT</em> (lire), <em>INSERT</em> (ajouter), <em>UPDATE</em> (modifier), <em>DELETE</em> (supprimer) ; <strong>3) l'hydratation</strong> — il transforme les lignes brutes du résultat en objets Python prêts à l'emploi (comme si on « remplissait » des fiches vides avec l'eau des données).</p>
<pre class="pseudo"># Toi, tu écris (une seule ligne de Python) :
jeux = Jeu.objects.filter(disponible=True)   # "donne-moi tous les Jeu dont l'attribut disponible vaut True (vrai)"

# L'ORM génère et exécute tout seul cette requête SQL :
# SELECT ... FROM jeu WHERE disponible = 1   -- il traduit filter(...) en une clause WHERE

# Et il t'hydrate des objets (il te rend une liste d'objets Jeu, pas des lignes brutes) :
# &lt;QuerySet [&lt;Jeu: Catan&gt;, &lt;Jeu: Azul&gt;, ...]&gt;   # QuerySet = la collection de resultats renvoyee
for jeu in jeux:                 # pour chaque objet jeu dans le resultat...
    print(jeu.titre, jeu.prix)   # ...on lit des ATTRIBUTS Python (jeu.titre), pas des colonnes SQL</pre>

<h3>3. Avantages… et limites</h3>
<p><strong>Productivité</strong> : plus de SQL à assembler à la main (à « concaténer », c'est-à-dire coller des bouts de texte), plus de conversion manuelle ligne → objet. <strong>Portabilité</strong> : le même code Python tourne sur MySQL, PostgreSQL ou SQLite (trois SGBD différents) en changeant surtout la <em>configuration</em>. <strong>Sécurité</strong> : l'ORM passe toutes les valeurs en <em>paramètres échappés</em> — au lieu de coller la valeur dans le texte de la requête, il l'envoie à part, ce qui bloque l'<strong>injection SQL</strong> (une attaque où un pirate glisse du SQL malveillant dans un champ de formulaire). Mais il y a un prix : le SQL devient <strong>caché</strong> (tu peux déclencher dix requêtes sans t'en apercevoir), et un ORM <strong>mal utilisé</strong> peut être lent — le fameux problème <strong>N+1</strong> (une requête qui en déclenche N autres en cascade) t'attend à la leçon 18. Un bon développeur ORM reste un développeur SQL.</p>

<h3>4. Active Record contre Data Mapper</h3>
<p>Il existe deux grandes familles d'ORM (deux <strong>patrons de conception</strong>, c'est-à-dire deux façons classiques d'organiser le code). Dans le patron <strong>Active Record</strong> (« enregistrement actif »), l'objet <em>sait se sauvegarder lui-même</em> : la classe <code>Jeu</code> porte à la fois les données ET les méthodes de <strong>persistance</strong> (persister = enregistrer durablement dans la base) — d'où <code>jeu.save()</code> et <code>Jeu.objects.filter(...)</code>. C'est le choix de <strong>Django</strong> et d'<strong>Eloquent</strong> (l'ORM de PHP/Laravel). Dans le patron <strong>Data Mapper</strong> (« cartographe de données »), l'objet est un simple conteneur passif et un composant séparé (une « session », un « contexte ») gère la base : c'est le choix d'<strong>Hibernate/JPA</strong> (Java/Spring, via l'<em>EntityManager</em>) et d'<strong>EF Core</strong> (C#/ASP.NET Core, via le <em>DbContext</em>).</p>
<pre class="pseudo">Active Record (Django, Eloquent) : jeu.save()      # l'objet lui-meme sait s'enregistrer
    → l'objet contient données + persistance        # donnees ET methodes de sauvegarde dans la meme classe

Data Mapper (Hibernate/JPA, EF Core) : em.persist(jeu)   # un composant externe (em) enregistre l'objet
    → un composant externe sauvegarde l'objet          # l'objet reste "passif", il ne contient que des donnees</pre>

<h3>5. Le fil rouge : la Ludothèque, version objets</h3>
<p>Tout ce cours reconstruit la <strong>couche de persistance</strong> de la Ludothèque (la partie du programme qui parle à la base) au-dessus de ta base MySQL du Niveau 4. Compare une <strong>requête</strong> (une question posée à la base) que tu écrivais alors avec son équivalent ORM :</p>
<pre class="pseudo">-- Niveau 4 (SQL brut) :
SELECT * FROM jeu                     -- SELECT * = "prends toutes les colonnes", FROM jeu = "de la table jeu"
WHERE disponible = 1 AND prix &lt;= 30.00;   -- WHERE = condition ; garde les lignes disponibles ET a 30 max

# Niveau 5 (ORM Django) :
Jeu.objects.filter(disponible=True, prix__lte=30)   # meme question : filter() = WHERE ; prix__lte = "prix <= 30" (lte = less than or equal)</pre>
<p>Même question, deux langues. Nous coderons d'abord <strong>Jeu</strong> et <strong>Membre</strong> (leçon 3), puis <strong>Location</strong> et <strong>Avis</strong> arriveront avec les relations ForeignKey (leçon 8). À la fin, la Ludothèque sera prête pour ton projet full-stack du Niveau 6.</p>
<div class="warn">Un ORM ne te dispense <strong>jamais</strong> de comprendre le SQL : il le génère à ta place, mais c'est toi qui répondras du SQL produit (lenteurs, index, N+1). Ton Niveau 4 reste ton meilleur atout ici.</div>
<div class="tip">Les concepts de ce cours se transfèrent tels quels : mapping, requêtes objets et pièges de performance existent aussi chez Hibernate/JPA (Java), EF Core (C#) et Eloquent (PHP). Apprends-en un à fond, tu les liras tous.</div>`,
  exercises: [
    { type: "qcm", q: "ORM signifie…", opts: ["Object-Relational Mapping", "Online Request Manager", "Object Runtime Module", "Ordered Relational Model"], a: 0, exp: "Le mapping objet-relationnel : le pont entre classes et tables." },
    { type: "qcm", q: "Le décalage objet-relationnel oppose…", opts: ["Python et JavaScript", "tables/lignes/colonnes et classes/objets/attributs", "Le front-end et le back-end", "MySQL et PostgreSQL"], a: 1, exp: "Deux modèles de données qui ne se correspondent pas naturellement." },
    { type: "input", q: "Le sigle de l'outil qui fait le pont entre le monde objet et le monde relationnel :", a: ["ORM", "orm"], ph: "Trois lettres…", exp: "Object-Relational Mapping." },
    { type: "qcm", q: "Dans le mapping, une ligne de la table jeu correspond côté Python à…", opts: ["Une classe", "Un objet", "Un module", "Une colonne"], a: 1, exp: "Classe ↔ table, objet ↔ ligne, attribut ↔ colonne." },
    { type: "vf", q: "Avec l'ORM de Django, c'est toi qui écris les SELECT, INSERT et UPDATE à la main.", a: false, exp: "L'ORM génère le SQL à partir de ton code Python." },
    { type: "qcm", q: "L'« hydratation », c'est…", opts: ["Sauvegarder un objet en base", "Transformer les lignes du résultat SQL en objets Python", "Vider une table", "Sérialiser un objet Python en JSON"], a: 1, exp: "L'ORM te rend des objets Jeu, pas des tuples bruts." },
    { type: "qcm", q: "Côté sécurité, l'ORM protège surtout contre…", opts: ["Le vol de mot de passe", "L'injection SQL, grâce aux paramètres échappés", "Les accès concurrents non synchronisés", "La saturation du disque"], a: 1, exp: "Les valeurs ne sont jamais concaténées dans la requête." },
    { type: "vf", q: "Puisque l'ORM écrit le SQL, il devient inutile de connaître le SQL.", a: false, exp: "Le SQL généré doit rester lisible pour toi : perfs, index, débogage." },
    { type: "qcm", q: "Django suit le patron…", opts: ["Data Mapper", "Active Record", "Singleton", "MVC-Mapper"], a: 1, exp: "L'objet Django sait se sauvegarder lui-même : jeu.save()." },
    { type: "qcm", q: "Dans Active Record, qui porte les méthodes de persistance ?", opts: ["Un composant externe (session, contexte)", "Le modèle lui-même (jeu.save())", "Le serveur web", "Le navigateur"], a: 1, exp: "Données + persistance dans la même classe." },
    { type: "qcm", q: "Hibernate/JPA (Java) et EF Core (C#) suivent plutôt…", opts: ["Active Record", "Data Mapper", "Aucun patron", "Le patron Eloquent"], a: 1, exp: "EntityManager et DbContext sauvegardent des objets « passifs »." },
    { type: "input", q: "L'ORM du framework PHP Laravel s'appelle…", a: ["Eloquent", "eloquent"], ph: "Nom de l'ORM…", exp: "Eloquent, un Active Record comme Django." },
    { type: "qcm", q: "La « portabilité » d'un ORM signifie que…", opts: ["Les requêtes s'exécutent automatiquement plus vite", "On peut changer de SGBD en changeant surtout la configuration", "On n'a plus besoin de définir de modèles", "Le SQL généré est toujours plus court"], a: 1, exp: "Le même code ORM parle MySQL, PostgreSQL ou SQLite." },
    { type: "vf", q: "Un ORM mal utilisé peut déclencher beaucoup plus de requêtes que prévu.", a: true, exp: "C'est le problème N+1, que nous traiterons à la leçon 18." },
    { type: "qcm", q: "Jeu.objects.filter(disponible=True) correspond en gros au SQL…", opts: ["DELETE FROM jeu", "SELECT ... FROM jeu WHERE disponible = 1", "UPDATE jeu SET disponible = 1", "CREATE TABLE jeu"], a: 1, exp: "filter() génère un SELECT avec une clause WHERE." }
  ],
  final: {
    title: "Exercice final — Le pont entre deux mondes",
    intro: `<p>Avant de configurer quoi que ce soit, on vérifie que le rôle de l'ORM est clair.</p>`,
    questions: [
      { type: "qcm", q: "Les trois missions d'un ORM :", opts: ["Mapping, génération du SQL, hydratation d'objets", "Compilation, exécution, affichage", "Sauvegarde, chiffrement, compression", "Routage, template, session"], a: 0, exp: "Associer, traduire, transformer en objets." },
      { type: "qcm", q: "Dans la Ludothèque, la classe Jeu sera mappée sur…", opts: ["Une colonne", "Une table", "Une ligne", "Un index"], a: 1, exp: "Classe ↔ table ; chaque objet Jeu ↔ une ligne." },
      { type: "vf", q: "Django est un ORM de type Active Record : l'objet sait se sauver lui-même.", a: true, exp: "Comme Eloquent ; à l'inverse d'Hibernate/JPA et EF Core (Data Mapper)." },
      { type: "qcm", q: "Le principal danger d'un ORM :", opts: ["Il supprime des tables au hasard", "Le SQL est caché : sans vigilance, requêtes nombreuses ou lentes", "Il ne gère pas MySQL", "Il impose PostgreSQL"], a: 1, exp: "D'où le réflexe, dès la leçon 2 : regarder le SQL généré." },
      { type: "qcm", q: "L'équivalent ORM de SELECT * FROM jeu WHERE disponible = 1 :", opts: ["Jeu.objects.filter(disponible=True)", "Jeu.select(disponible)", "SELECT Jeu WHERE True", "Jeu.objects.delete()"], a: 0, exp: "filter() = le WHERE du monde objet." }
    ],
    solution: `<pre class="pseudo">Décalage   : tables/lignes/colonnes ≠ classes/objets/attributs   # le fosse entre les deux mondes
ORM        : mapping + génération du SQL + hydratation d'objets   # les 3 missions de l'interprete
Avantages  : productivité, portabilité, anti-injection SQL        # ce qu'on gagne
Limites    : SQL caché, perfs si mal utilisé (N+1, leçon 18)      # ce a quoi rester vigilant
Patrons    : Active Record (Django, Eloquent) — l'objet se sauve   # jeu.save()
             Data Mapper (Hibernate/JPA, EF Core) — un composant le sauve   # em.persist(jeu)

Fil rouge  : la Ludothèque du Niveau 4, réécrite en objets        # le projet suivi tout le cours
   SQL     : SELECT * FROM jeu WHERE disponible = 1               -- l'ancienne facon (Niveau 4)
   ORM     : Jeu.objects.filter(disponible=True)                 # la nouvelle facon (Niveau 5)</pre>
<p>Les concepts sont posés. Prochaine étape : brancher Django sur ta base MySQL et regarder le SQL qu'il génère — leçon 2, « Configuration MySQL, le shell et le SQL généré ».</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "djangoorm-l1", title: "Traducteur SQL ↔ objets", level: 1,
    statement: "Reprends trois requêtes SQL que tu as réellement écrites pour la Ludothèque au Niveau 4 (par exemple : lister les jeux disponibles, chercher un membre par pseudo, trouver les jeux à moins de 25 euros). Pour chacune : recopie le SQL, propose l'équivalent en style ORM Django (même approximatif, du type Jeu.objects.filter(...)), puis indique en une phrase ce que l'ORM t'apporte sur cette requête (lisibilité, sécurité, portabilité) et un risque possible (SQL caché, performance). Termine par deux ou trois phrases : dans quels cas préférerais-tu quand même écrire le SQL à la main ?",
    hints: [
      "Repars du mapping : la table devient la classe (jeu → Jeu), la clause WHERE devient filter(...), les colonnes deviennent des arguments nommés.",
      "Pour chaque requête, la question sécurité : que se passait-il au Niveau 4 si tu concaténais une valeur saisie par l'utilisateur dans ta chaîne SQL ?",
      "Pour les cas « SQL à la main » : pense aux requêtes de reporting très complexes ou aux optimisations fines — l'ORM prévoit d'ailleurs une porte de sortie (raw, leçon 19)."
    ],
    solution: "Requête 1 — jeux disponibles\n  SQL : SELECT * FROM jeu WHERE disponible = 1;\n  ORM : Jeu.objects.filter(disponible=True)\n  Apport : lisible, valeurs échappées automatiquement.\n  Risque : je ne vois plus le SQL exécuté sans le demander.\n\nRequête 2 — membre par pseudo\n  SQL : SELECT * FROM membre WHERE pseudo = 'zelda42';\n  ORM : Membre.objects.get(pseudo='zelda42')\n  Apport : anti-injection (le pseudo vient souvent d'un formulaire).\n  Risque : get() lève une exception si le membre n'existe pas (leçon 5).\n\nRequête 3 — jeux à moins de 25 euros\n  SQL : SELECT * FROM jeu WHERE prix < 25;\n  ORM : Jeu.objects.filter(prix__lt=25)\n  Apport : portable (MySQL, PostgreSQL, SQLite sans changer le code).\n  Risque : mal chaîné, un ORM peut multiplier les requêtes (N+1).\n\nSQL à la main : reporting complexe multi-tables, tuning fin d'une\nrequête critique — l'ORM offre raw() et values() pour ces cas (leçon 19).",
    note: "Cet aller-retour SQL ↔ ORM est exactement la compétence visée par ce Niveau 5 : ton SQL du Niveau 4 devient la « langue de contrôle » pour vérifier ce que l'ORM fabrique, et les vues Django du Niveau 3 en seront les consommatrices. Au Niveau 6, ton projet full-stack utilisera cette couche sans réécrire une seule requête à la main." , atoi: { cmd: "# python manage.py shell\n>>> from ludotheque.models import Jeu\n>>> print(Jeu.objects.filter(disponible=True).query)\n>>> print(Jeu.objects.filter(prix__lt=25).query)", expected: "SELECT `ludotheque_jeu`.`id`, `ludotheque_jeu`.`titre`, ... FROM `ludotheque_jeu` WHERE `ludotheque_jeu`.`disponible`\nSELECT ... FROM `ludotheque_jeu` WHERE `ludotheque_jeu`.`prix` < 25\nChaque filter() devient une clause WHERE ; la valeur (25) part comme paramètre lié, jamais concaténée dans la chaîne : c'est l'anti-injection dont tu parles. print(qs.query) n'envoie AUCUNE requête, il lit seulement le SQL prévu." }, checklist: ["Pour chaque requête, j'ai bien : le SQL d'origine, l'équivalent ORM (Jeu.objects.filter(...)), l'apport et le risque.", "Mon mapping est cohérent : table → classe, WHERE → filter(), colonne → argument nommé.", "J'ai cité au moins un cas où le SQL à la main reste préférable (reporting complexe, tuning fin), et la porte de sortie raw() (leçon 19)."] }
