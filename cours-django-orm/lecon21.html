<h3>1. Le tour du propriétaire avant l'épreuve</h3>
<p>Dernière leçon, et elle ne t'apprend rien de neuf : elle vérifie <strong>tout</strong>. L'examen qui suit balaie les leçons 1 à 20, dans le désordre, comme le fera la vraie vie — un problème N+1 (une page qui explose en requêtes) ne prévient pas qu'il relève de la leçon 18. Avant de plonger, redéroule la carte du cours :</p>
<pre class="pseudo">Semaine 1 (leçons 1-7)   : MAPPER — du SQL aux objets, modèles,          # les fondations

<p>Méthode d'examen : pour chaque question, commence par identifier la semaine — mapper, relier ou produire — et la moitié du chemin est faite.</p>

<h3>2. Semaine 1 — mapper : les fondations</h3>
<p>Tout le cours repose sur une équivalence : <strong>une classe = une table, un attribut = une colonne, un objet = une ligne</strong>. Ce qu'il faut savoir sur le bout des doigts :</p>
<pre class="pseudo">Classe Jeu → table ludotheque_jeu · id BigAutoField automatique         # 1 classe = 1 table ; id ajoute par Django

CRUD : create() / save() · get() — DoesNotExist, MultipleObjectsReturned  # creer, lire (exceptions de get)
       all(), filter() · update() / delete() en masse · get_or_create()   # lire une liste, modifier/supprimer en masse
QuerySet : PARESSEUX — construit gratuitement, évalué à l'itération        # rien n'est execute avant le besoin
           chaînable · print(qs.query) montre le SQL prévu                 # empilable ; lire le SQL prevu</pre>

<h3>3. Semaine 2 — relier : le schéma vivant</h3>
<p>Les relations du schéma Merise du Niveau 4, devenues champs Python — avec, à chaque fois, une décision à justifier :</p>
<pre class="pseudo">ForeignKey côté N · on_delete OBLIGATOIRE :                              # la FK vit du cote "plusieurs"
    CASCADE (la suppression se propage) · PROTECT (refusée)              # 3 politiques de suppression
    · SET_NULL (la clé passe à NULL, exige null=True)                   # coupe le lien, garde la ligne
related_name → managers inverses : catan.locations, zelda.avis          # nommer le sens inverse
ManyToManyField → table de jointure AUTOMATIQUE · add/remove/set/clear   # N-N ; l'API d'ecriture de la jointure
OneToOneField = ForeignKey + UNIQUE → zelda.profil                      # 1-1 : au plus un objet en face
Lookups : __gte, __lte, __icontains, __range, __in, __isnull            # les operateurs de filtre
          jeu__prix traverse les relations (JOIN généré)                # __ traverse une relation
F('champ') : colonne contre colonne · update(stock=F('stock') - 1)      # comparer/calculer cote base
             atomique, puis refresh_from_db()                           # sur en concurrence
Q : | = OU · &amp; = ET · ~ = NON · les Q AVANT les kwargs · parenthéser   # composer des conditions</pre>

<h3>4. Semaine 3 — produire : calculer, protéger, accélérer</h3>
<p>La semaine des questions de production — celles qu'on te posera en entretien comme en revue de code :</p>
<pre class="pseudo">aggregate() → UN dict, immédiat · annotate() → un attribut PAR objet     # global vs par objet
              (LEFT JOIN + GROUP BY) · filtre sur annotation = HAVING     # annotate genere GROUP BY ; HAVING
values('col') + annotate → GROUP BY par colonne                          # grouper par colonne
Paginator(qs ORDONNÉ, 20) → COUNT + LIMIT/OFFSET · get_page() tolérant    # pagination sur un tri stable
transaction.atomic : COMMIT en sortie normale, ROLLBACK sur exception     # tout ou rien
              try/except AUTOUR du bloc · select_for_update DANS l'atomic  # attraper dehors ; verrou dedans
N+1 : select_related (vers le 1, INNER JOIN, 1 requête)                   # relations vers-le-1
      prefetch_related (vers le N, IN, 2 requêtes)                        # relations vers-le-N
      → nombre de requêtes CONSTANT, jamais proportionnel                 # la regle d'or
raw(sql, params) · connection.cursor() · values / values_list(flat=True)  # SQL brut + allegement
      → %s + params, JAMAIS de concaténation                             # contre l'injection SQL</pre>

<h3>5. Et après : le Niveau 6</h3>
<p>Réussis cet examen, et le Niveau 5 est derrière toi. Devant toi : le <strong>projet full-stack du Niveau 6</strong> (« full-stack » = de la base de données jusqu'à l'écran), où cette couche de persistance rencontre enfin ses utilisateurs — les vues et templates du Niveau 3 branchés sur TES modèles, l'authentification, les formulaires, le déploiement. Concrètement :</p>
<pre class="pseudo">Niveau 6 — ce que tu apportes du Niveau 5 :                              # ton bagage acquis
  ta couche de persistance (modèles, relations, migrations)              # les fondations de donnees

Et pour la suite de ta carrière :
  Hibernate/JPA, EF Core, Eloquent = les MÊMES concepts,                 # d'autres ORM, memes idees
  seule la syntaxe change — tu ne repartiras jamais de zéro.             # tu transferes tes acquis</pre>
<div class="warn">Les cinq pièges qui font perdre le plus de points à cet examen : 1) confondre makemigrations (le plan) et migrate (l'exécution) ; 2) croire que filter().filter() ou filter(a, b) disent OU — c'est AND, le OU exige Q et son pipe ; 3) confondre aggregate (un dict pour toute la table) et annotate (par objet) ; 4) oublier qu'en autocommit, deux save() ne sont PAS liés sans atomic ; 5) le N+1 « qui marche » avec 10 lignes de test. Relis-les avant de commencer.</div>
<div class="tip">Passe l'examen sans notes, corrige-toi, puis rejoue-le dans une semaine : la répétition espacée transforme un score en réflexes. Et garde le shell ouvert — print(qs.query) reste ton arbitre à vie, ici comme au Niveau 6.</div>`,

    { type: "vf", q: "Leçon 5 — Jeu.objects.get(pk=999) renvoie None si le jeu n'existe pas.", a: false, exp: "get() lève DoesNotExist (et MultipleObjectsReturned si plusieurs lignes correspondent)." },
    { type: "qcm", q: "Leçon 7 — qs = Jeu.objects.filter(prix__lt=20) : la requête SQL part…", opts: ["À la ligne du filter", "Au moment où le QuerySet est évalué (itération, list, len…)", "Jamais", "Au prochain migrate"], a: 1, exp: "La paresse du QuerySet : construire ne coûte rien, évaluer déclenche le SQL." },
    { type: "qcm", q: "Leçon 8 — on_delete=models.PROTECT signifie :", opts: ["La suppression se propage aux lignes liées", "La suppression est refusée tant que des lignes pointent dessus", "La clé étrangère passe à NULL", "La ligne est archivée"], a: 1, exp: "ProtectedError : le choix de Location.jeu, pour protéger l'historique facturé." },

    { type: "qcm", q: "Leçon 11 — Un OneToOneField est techniquement…", opts: ["Une ForeignKey assortie d'une contrainte UNIQUE", "Un ManyToMany limité à deux lignes", "Une clé primaire partagée obligatoire", "Un champ calculé"], a: 0, exp: "FK + UNIQUE : au plus un profil par membre, garanti par la base." },

    { type: "qcm", q: "Leçon 14 — Le OU entre deux conditions s'écrit…", opts: ["filter(a).filter(b)", "filter(a, b)", "filter(Q(a) | Q(b))", "exclude(a)"], a: 2, exp: "Chaîner ou séparer par une virgule = AND ; seul Q et son pipe | disent OR." },

lated('jeu', 'membre') pour rester à un nombre de requêtes constant.\n\nLes cinq règles d'or pour le Niveau 6 :\n1. Le nombre de requêtes d'une page est CONSTANT, jamais proportionnel\n   (select_related / prefetch_related, debug-toolbar).\n2. Une action métier qui s'énonce avec un « et » = un transaction.atomic().\n3. Tout compteur se modifie côté base : update(F('stock') - 1),\n   jamais lire-modifier-écrire.\n4. Toute valeur externe passe par l'ORM ou par %s + params —\n   jamais de concaténation dans du SQL.\n5. Au moindre doute, print(qs.query) : lis le SQL que l'ORM écrit pour toi.",
