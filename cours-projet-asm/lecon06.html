<script>
var DAY = {
  num: 6,
  title: "Convertir entier → ASCII (itoa) et afficher",
  subtitle: "Le chemin inverse d'atoi : transformer un nombre en chiffres-caractères, puis l'écrire.",
  theory: `
<h3>1. Le problème inverse d'atoi</h3>
<p>À la leçon 4, on transformait du texte en nombre (<code>atoi</code>). Ici, c'est l'inverse. On a un nombre (disons 115) rangé dans un registre, et on veut l'afficher. Mais <code>write</code> n'envoie que des <strong>octets ASCII</strong> (rappel : des caractères) ; il faut donc fabriquer les caractères <code>'1'</code>, <code>'1'</code>, <code>'5'</code>. Cette conversion « entier vers texte » s'appelle <strong>itoa</strong> (de l'anglais <em>integer to ASCII</em>). C'est le miroir exact d'atoi.</p>

<h3>2. Extraire les chiffres… mais à l'envers</h3>
<pre class="pseudo">; on divise repetitivement par 10 ; le RESTE donne le chiffre des unites
; 115 / 10 = 11 reste 5   -> dernier chiffre '5'
; 11  / 10 = 1  reste 1   -> chiffre '1'
; 1   / 10 = 0  reste 1   -> chiffre '1'   (on s'arrete quand le quotient vaut 0)</pre>
<p>La <strong>division</strong> d'un nombre par 10 sépare son dernier chiffre : le <strong>reste</strong> (ce qui « ne rentre pas » dans la division) est justement le chiffre des unités, et le <strong>quotient</strong> (le résultat de la division) est le nombre privé de ce dernier chiffre. En répétant, on obtient tous les chiffres — mais du <strong>dernier au premier</strong>. On les écrira donc <strong>de la fin vers le début</strong> d'un petit tampon, pour les remettre dans le bon ordre.</p>

<h3>3. La division sur x86-64</h3>
<pre class="pseudo">    mov r10, 10           ; on veut diviser par 10 (le diviseur va dans un registre)
    xor rdx, rdx          ; IMPORTANT : rdx doit valoir 0 avant div (voir ci-dessous)
    div r10               ; divise ; resultat : rax = quotient, rdx = reste (ici 0..9)
    add dl, 48            ; transforme le reste (0..9) en chiffre ASCII ('0'..'9')</pre>
<div class="warn"><code>div r10</code> ne divise pas seulement <code>rax</code> : il divise le <strong>couple</strong> <code>rdx:rax</code> (un très grand nombre formé des deux registres collés, rdx pour la partie haute) par <code>r10</code>. Il faut donc <strong>impérativement mettre <code>rdx</code> à zéro</strong> avant chaque division, sinon le dividende serait faux et le résultat n'importe quoi (voire un plantage). Après <code>div</code>, le quotient atterrit dans <code>rax</code> et le reste dans <code>rdx</code>. <code>dl</code> est l'octet de poids faible de <code>rdx</code> : comme le reste d'une division par 10 tient sur un chiffre, on peut le manipuler par ce petit bout, et <code>add dl, 48</code> le convertit en caractère.</div>

<h3>4. La routine print_num</h3>
<pre class="pseudo">; entree : rax = valeur a afficher (non signee, c'est-a-dire toujours positive)
print_num:
    lea r9, [numbuf + 31]     ; r9 pointe sur la DERNIERE case du petit tampon numbuf (on ecrira a reculons)
    mov r10, 10               ; diviseur = 10
    test rax, rax             ; test = compare rax a 0 sans le modifier
    jnz .boucle               ; jnz = "jump if not zero" : si rax != 0, on va extraire les chiffres
    dec r9                    ; cas particulier de la valeur 0 : on recule d'une case...
    mov byte [r9], 48         ; ...et on ecrit directement le caractere '0' (code 48)
    jmp .ecrire               ; puis on va afficher
.boucle:
    test rax, rax             ; reste-t-il des chiffres a extraire ?
    jz .ecrire                ; jz = "jump if zero" : si rax == 0, on a fini l'extraction
    xor rdx, rdx              ; nettoie rdx avant la division
    div r10                   ; rax = quotient, rdx = reste (le chiffre des unites)
    add dl, 48                ; reste -> chiffre ASCII
    dec r9                    ; recule d'une case dans numbuf
    mov [r9], dl              ; ecrit le chiffre courant a cette position
    jmp .boucle               ; recommence avec le quotient
.ecrire:
    lea rdx, [numbuf + 31]    ; adresse de la fin du tampon
    sub rdx, r9               ; longueur = (fin) - (debut ecrit) = nombre de chiffres produits
    mov rsi, r9               ; adresse du premier chiffre a afficher
    mov rax, 1                ; write
    mov rdi, 1                ; stdout
    syscall                   ; affiche le nombre
    ret                       ; retour a l'appelant</pre>

<h3>5. Le cas particulier du zéro</h3>
<div class="tip">Si la valeur vaut 0, la boucle « tant que le quotient est différent de 0 » ne s'exécuterait <strong>jamais</strong> (le quotient est déjà 0 au départ) : aucun chiffre ne serait écrit, et <code>write</code> afficherait… rien du tout. On traite donc le 0 à part, en déposant directement le caractère <code>'0'</code>. Petit détail, mais indispensable : sans lui, afficher « 0 jeu » ou une moyenne de 0 produirait un vide. On verra en leçon 7 que ce cas arrive vraiment, sur une entrée vide.</div>`,
  exercises: [
    { type: "qcm", q: "itoa transforme…", opts: ["du texte en entier", "un entier en chiffres-caractères", "un octet en bit", "rien"], a: 1, exp: "Integer to ASCII." },
    { type: "qcm", q: "Pour afficher 115, write a besoin…", opts: ["de la valeur binaire", "des octets '1','1','5'", "d'un float", "de rien"], a: 1, exp: "ASCII." },
    { type: "qcm", q: "Le chiffre des unités s'obtient par…", opts: ["le quotient", "le reste de la division par 10", "×10", "-48"], a: 1, exp: "reste = unités." },
    { type: "qcm", q: "Les chiffres sortent…", opts: ["du premier au dernier", "du dernier au premier (à l'envers)", "triés", "au hasard"], a: 1, exp: "D'où l'écriture depuis la fin." },
    { type: "qcm", q: "Avant div r10, il faut…", opts: ["mettre rax à 0", "mettre rdx à 0", "mettre r10 à 0", "rien"], a: 1, exp: "rdx:rax est le dividende." },
    { type: "qcm", q: "Après div r10, le reste est dans…", opts: ["rax", "rdx", "r10", "rbx"], a: 1, exp: "Reste = rdx." },
    { type: "qcm", q: "Le quotient après div r10 est dans…", opts: ["rdx", "rax", "r9", "rbx"], a: 1, exp: "Quotient = rax." },
    { type: "qcm", q: "reste (0..9) → chiffre ASCII :", opts: ["reste - 48", "reste + 48", "reste × 10", "reste"], a: 1, exp: "add dl, 48." },
    { type: "qcm", q: "On écrit les chiffres dans numbuf…", opts: ["depuis le début", "depuis la fin, en reculant", "au milieu", "n'importe où"], a: 1, exp: "Ordre inversé compensé." },
    { type: "qcm", q: "La longueur à écrire =", opts: ["toujours 3", "(fin du tampon) - (adresse du premier chiffre)", "0", "10"], a: 1, exp: "Nombre de chiffres." },
    { type: "vf", q: "Sans traitement spécial, afficher la valeur 0 n'écrirait aucun chiffre.", a: true, exp: "La boucle ne tourne pas." },
    { type: "qcm", q: "La boucle s'arrête quand…", opts: ["le reste = 0", "le quotient (rax) = 0", "rdx = 10", "jamais"], a: 1, exp: "Plus de chiffres." },
    { type: "qcm", q: "itoa est l'inverse de…", opts: ["write", "atoi", "read", "exit"], a: 1, exp: "Texte ↔ entier." },
    { type: "qcm", q: "On affiche ensuite le nombre avec…", opts: ["read", "write (rsi = 1er chiffre, rdx = longueur)", "div", "exit"], a: 1, exp: "Sortie standard." },
    { type: "qcm", q: "Pour 40 : les restes successifs sont…", opts: ["4 puis 0", "0 puis 4", "40", "0 seulement"], a: 1, exp: "40/10=4 r0, 4/10=0 r4 → '4''0'." }
  ],
  final: {
    title: "Exercice final — Afficher le nombre 7",
    intro: `<p>On veut afficher la valeur 7 (un seul chiffre) via print_num. On suit le déroulé.</p>`,
    questions: [
      { type: "qcm", q: "7 / 10 donne quotient et reste :", opts: ["0 et 7", "7 et 0", "1 et 7", "0 et 0"], a: 0, exp: "quotient 0, reste 7." },
      { type: "qcm", q: "Le reste 7 devient le caractère :", opts: ["'0'", "'7' (7 + 48)", "7", "'A'"], a: 1, exp: "add dl, 48." },
      { type: "qcm", q: "Après ce chiffre, le quotient est 0, donc la boucle…", opts: ["continue", "s'arrête (plus de chiffres)", "recommence", "plante"], a: 1, exp: "Fini." },
      { type: "qcm", q: "Nombre de chiffres écrits :", opts: ["0", "1", "2", "3"], a: 1, exp: "Un seul." },
      { type: "qcm", q: "La longueur passée à write vaut :", opts: ["0", "1", "7", "10"], a: 1, exp: "Un chiffre." }
    ],
    solution: `<pre class="pseudo">; afficher 7 avec print_num
    mov rax, 7
    call print_num        ; -> écrit "7"
; déroulé interne :
;   test rax,rax -> non nul, on entre dans la boucle
;   xor rdx,rdx ; div 10 -> rax=0, rdx=7
;   add dl,48   -> '7' ; dec r9 ; [r9]='7'
;   quotient rax=0 -> on sort ; longueur = 1 ; write "7"</pre>
<p>Un seul tour de boucle suffit : reste 7 → caractère <code>'7'</code>, quotient 0 → fin. print_num affiche « 7 ». Demain : assembler le rapport complet (total, moyenne, cas limite).</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton assembleur ici…",
  items: [
  { id: "projasm-l06", title: "La routine print_num (itoa + write)", level: 3,
    statement: "Écris print_num : elle reçoit une valeur non signée dans rax, la convertit en chiffres décimaux dans numbuf (écrits depuis la fin), traite le cas 0, puis écrit le résultat sur la sortie standard. Réserve numbuf (32 octets) en .bss.",
    hints: [
      "Écris depuis r9 = numbuf+31 en reculant (dec r9).",
      "Boucle : xor rdx,rdx ; div r10(=10) ; add dl,48 ; [--r9]=dl ; jusqu'à rax=0.",
      "Cas 0 : écrire directement '0'. Longueur = (numbuf+31) - r9."
    ],
    solution: "section .bss\n    numbuf resb 32\nsection .text\n; entree : rax = valeur non signee\nprint_num:\n    lea r9, [numbuf + 31]     ; on ecrit depuis la fin\n    mov r10, 10\n    test rax, rax\n    jnz .boucle\n    dec r9                    ; cas particulier : 0\n    mov byte [r9], 48\n    jmp .ecrire\n.boucle:\n    test rax, rax\n    jz .ecrire\n    xor rdx, rdx              ; indispensable avant div\n    div r10                   ; rax = quotient, rdx = reste\n    add dl, 48                ; reste -> chiffre ASCII\n    dec r9\n    mov [r9], dl\n    jmp .boucle\n.ecrire:\n    lea rdx, [numbuf + 31]\n    sub rdx, r9               ; longueur = nombre de chiffres\n    mov rsi, r9               ; adresse du premier chiffre\n    mov rax, 1                ; write\n    mov rdi, 1\n    syscall\n    ret",
    note: "print_num est l'inverse d'atoi : la division répétée par 10 donne les chiffres du dernier au premier, d'où l'écriture à reculons dans numbuf. Deux pièges classiques : mettre rdx à zéro avant chaque div (le dividende est rdx:rax), et traiter la valeur 0 à part car la boucle « tant que quotient ≠ 0 » ne s'exécuterait jamais." }
  ]
};
