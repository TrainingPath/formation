<script>
var DAY = {
  num: 7,
  title: "Le rapport complet : total, moyenne, cas limite",
  subtitle: "Assembler libellés et valeurs, calculer la moyenne, et gérer l'entrée vide sans planter.",
  theory: `
<h3>1. La structure du rapport</h3>
<p>On a maintenant toutes les briques : lire, parcourir, convertir dans les deux sens, afficher. Il s'agit de les <strong>assembler</strong> pour produire le rapport final, trois lignes lisibles :</p>
<pre class="pseudo">Jeux    : 4
Total   : 115
Moyenne : 28</pre>
<p>Chaque ligne suit le même moule : un <strong>libellé</strong> (affiché par <code>write_str</code>), suivi d'une <strong>valeur</strong> (affichée par <code>print_num</code>), suivie d'un <strong>saut de ligne</strong>. On ne réécrit rien : on enchaîne les routines déjà construites. C'est tout l'intérêt d'avoir avancé « brique par brique ».</p>

<h3>2. Les libellés dans .data</h3>
<pre class="pseudo">section .data
    lbl_jeux  db "Jeux    : "        ; le texte de la 1re ligne
    lbl_jeux_len equ $ - lbl_jeux    ; sa longueur, calculee automatiquement ($ = adresse courante)
    lbl_total db "Total   : "        ; texte de la 2e ligne
    lbl_total_len equ $ - lbl_total  ; sa longueur
    lbl_moy   db "Moyenne : "        ; texte de la 3e ligne
    lbl_moy_len equ $ - lbl_moy      ; sa longueur
    nl        db 10                  ; un seul octet : 10 = code ASCII du saut de ligne</pre>
<p>Rappel des leçons 2 et 4 : <code>db</code> dépose des octets, <code>equ $ - etiquette</code> calcule une longueur à l'assemblage, et l'octet <strong>10</strong> est le code ASCII du saut de ligne (en anglais <em>line feed</em>, LF).</p>

<h3>3. Afficher une ligne complète</h3>
<pre class="pseudo">    lea rsi, [lbl_jeux]        ; adresse du libelle "Jeux    : "
    mov rdx, lbl_jeux_len      ; sa longueur
    call write_str            ; affiche le libelle
    mov rax, r14              ; met la valeur (nombre de jeux) dans rax
    call print_num            ; affiche cette valeur (conversion itoa + write)
    call print_nl             ; termine par un saut de ligne</pre>
<p>Où <code>print_nl</code> est une mini-routine qui écrit simplement l'octet <code>nl</code> (le saut de ligne). On répète ensuite ce schéma pour la ligne <code>Total</code> (valeur dans <code>r12</code>) puis <code>Moyenne</code>.</p>

<h3>4. La moyenne… et le piège de la division par zéro</h3>
<pre class="pseudo">    xor rax, rax             ; moyenne = 0 par defaut (valeur sure si aucun jeu)
    cmp r14, 0               ; y a-t-il au moins un jeu ?
    je .afficher_moy         ; si r14 == 0 (zero jeu), NE PAS diviser -> on saute directement a l'affichage
    mov rax, r12             ; sinon : dividende = total
    xor rdx, rdx             ; nettoie rdx (partie haute du dividende) avant div
    div r14                  ; moyenne = total / nombre de jeux ; resultat dans rax
.afficher_moy:
    call print_num           ; affiche la moyenne (0, ou le quotient calcule)</pre>
<div class="warn">Danger réel. Sur un processeur, diviser par zéro n'est pas « juste faux » : c'est une <strong>exception matérielle</strong>. Le noyau tue aussitôt le programme avec le signal <strong>SIGFPE</strong> (<em>floating point exception</em>, malgré son nom c'est bien l'erreur des divisions entières interdites). Or si l'entrée est vide, il n'y a aucun jeu : <code>r14 = 0</code>. Il faut donc <strong>tester avant de diviser</strong> et, dans ce cas, afficher une moyenne de 0. Règle d'or du programmeur système : <strong>ne jamais faire confiance à l'entrée</strong>.</div>

<h3>5. Un cas limite qui fait la différence</h3>
<div class="tip">Gérer proprement l'entrée vide (0 jeu → total 0, moyenne 0, <strong>sans planter</strong>) est la marque d'un programme <strong>robuste</strong> (fiable même face à des données inhabituelles). On l'a d'ailleurs anticipé sans le dire : <code>print_num</code> sait déjà afficher 0 (leçon 6, le cas particulier), et le test <code>cmp r14, 0</code> protège la division. Un utilitaire digne de confiance ne suppose jamais que ses données sont « bien formées » — il prévoit le vide, les espaces multiples, l'inattendu.</div>`,
  exercises: [
    { type: "qcm", q: "Chaque ligne du rapport enchaîne…", opts: ["une seule valeur brute", "libellé (write_str) + valeur (print_num) + saut de ligne", "la valeur puis le libellé", "un seul appel write"], a: 1, exp: "Trois briques." },
    { type: "qcm", q: "La valeur du nombre de jeux est dans…", opts: ["r12", "r14", "rax", "rbx"], a: 1, exp: "Compteur." },
    { type: "qcm", q: "La valeur du total est dans…", opts: ["r14", "r12", "rsi", "r8"], a: 1, exp: "Somme." },
    { type: "qcm", q: "print_nl écrit…", opts: ["un espace", "l'octet 10 (saut de ligne)", "un retour chariot (octet 13)", "le caractère nul (octet 0)"], a: 1, exp: "Fin de ligne." },
    { type: "qcm", q: "La moyenne se calcule par…", opts: ["total × nombre", "total / nombre (div)", "total + nombre", "nombre / total"], a: 1, exp: "Division." },
    { type: "qcm", q: "Diviser par zéro provoque…", opts: ["un résultat 0", "une exception matérielle (SIGFPE), le programme est tué", "un warning", "rien"], a: 1, exp: "Danger réel." },
    { type: "qcm", q: "Si l'entrée est vide, r14 vaut…", opts: ["1", "0 (aucun jeu)", "115", "la taille du tampon"], a: 1, exp: "Zéro." },
    { type: "qcm", q: "Avant de diviser, on…", opts: ["divise directement", "teste cmp r14, 0 et on saute la division si 0", "affiche", "quitte"], a: 1, exp: "Protéger la division." },
    { type: "qcm", q: "En cas de 0 jeu, la moyenne affichée est…", opts: ["une erreur", "0", "le total", "1"], a: 1, exp: "Valeur par défaut sûre." },
    { type: "qcm", q: "Avant div r14, rdx doit être…", opts: ["10", "0", "r12", "1"], a: 1, exp: "Dividende = rdx:rax." },
    { type: "vf", q: "Un utilitaire robuste ne suppose jamais que son entrée est bien formée.", a: true, exp: "Gérer les cas limites." },
    { type: "qcm", q: "print_num sait déjà afficher…", opts: ["seulement les grands nombres", "aussi la valeur 0", "uniquement du texte déjà prêt", "aussi les nombres négatifs"], a: 1, exp: "Cas 0 traité leçon 6." },
    { type: "qcm", q: "Le libellé et sa longueur se déclarent avec…", opts: ["resb", "db \"...\" et equ $ - lbl", "div", "syscall"], a: 1, exp: "Données + constante." },
    { type: "qcm", q: "Pour {44,12,39,20}, la moyenne (entière) est…", opts: ["29", "28 (115/4)", "30", "27"], a: 1, exp: "Division entière." },
    { type: "qcm", q: "L'ordre des trois lignes est…", opts: ["Total, Jeux, Moyenne", "Jeux, Total, Moyenne", "Moyenne, Jeux, Total", "Moyenne en premier"], a: 1, exp: "Rapport lisible." }
  ],
  final: {
    title: "Exercice final — Protéger la moyenne",
    intro: `<p>Un premier jet calcule toujours la moyenne, même quand il n'y a aucun jeu :</p>
<pre class="pseudo">    mov rax, r12       ; total (0 si entrée vide)
    xor rdx, rdx
    div r14            ; r14 = 0 si entrée vide  ← ?
    call print_num</pre>`,
    questions: [
      { type: "qcm", q: "Le danger si r14 = 0 :", opts: ["rien", "division par zéro → le programme est tué (SIGFPE)", "moyenne fausse mais OK", "boucle infinie"], a: 1, exp: "Exception matérielle." },
      { type: "qcm", q: "La protection :", opts: ["ignorer", "cmp r14, 0 et sauter la division si nul", "diviser deux fois", "changer read"], a: 1, exp: "Tester avant de diviser." },
      { type: "qcm", q: "La moyenne par défaut (0 jeu) :", opts: ["1", "0", "le total", "égale au nombre d'octets lus"], a: 1, exp: "Valeur sûre." },
      { type: "qcm", q: "Avant div, rdx doit valoir :", opts: ["10", "0", "r12", "r14"], a: 1, exp: "Nettoyer le dividende haut." },
      { type: "qcm", q: "Gérer ce cas rend le programme :", opts: ["plus lent", "robuste face à l'entrée vide", "incorrect", "plus gros"], a: 1, exp: "Fiabilité." }
    ],
    solution: `<pre class="pseudo">    lea rsi, [lbl_moy]
    mov rdx, lbl_moy_len
    call write_str
    xor rax, rax             ; moyenne = 0 par défaut
    cmp r14, 0
    je .afficher_moy         ; 0 jeu : on NE divise pas
    mov rax, r12             ; total
    xor rdx, rdx
    div r14                  ; moyenne = total / nombre
.afficher_moy:
    call print_num
    call print_nl</pre>
<p>Un simple <code>cmp r14, 0</code> avant la division évite le plantage sur entrée vide et affiche une moyenne de 0. Le programme complet est prêt : demain, on l'assemble et on le teste pour de vrai.</p>`
  }
};
</script>

  { id: "projasm-l07", title: "Afficher une ligne « libellé : valeur »", level: 2,
    statement: "Écris le code qui affiche la ligne « Total   : » suivie de la valeur contenue dans r12, puis d'un saut de ligne. Suppose write_str (rsi/rdx), print_num (rax) et print_nl déjà écrits, et les libellés déclarés en .data.",

    ] }
  ]
};
