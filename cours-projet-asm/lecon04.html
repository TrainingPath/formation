<script>
var DAY = {
  num: 4,
  title: "Convertir ASCII → entier (atoi)",
  subtitle: "Transformer une suite de chiffres-caractères en une valeur numérique manipulable.",
  theory: `
<h3>1. Le problème : un « nombre » lu n'est pas un nombre</h3>
<p>Dans le tampon rempli par <code>read</code>, un prix comme <code>44</code> n'est PAS rangé comme la valeur numérique quarante-quatre. Il est stocké sous forme de <strong>caractères</strong> : l'octet du caractère <code>'4'</code>, suivi de l'octet du caractère <code>'4'</code>. Or ces octets ne valent pas 4 : ils valent le <strong>code</strong> du caractère '4'. Le processeur ne peut donc pas additionner ces caractères tels quels ; il faut d'abord les <strong>convertir</strong> en la vraie valeur entière 44. Cette opération porte un nom historique : <strong>atoi</strong> (de l'anglais <em>ASCII to integer</em>, « de l'ASCII vers l'entier »).</p>
<p>Un mot sur l'<strong>ASCII</strong> (prononcer « aski ») : c'est une <strong>table</strong> universelle qui associe à chaque caractère un numéro (son <strong>code</strong>), pour que les ordinateurs, qui ne manipulent que des nombres, puissent représenter du texte. Par convention, <code>'A'</code> vaut 65, l'espace vaut 32, le saut de ligne vaut 10, et surtout les dix chiffres <code>'0'</code> à <code>'9'</code> occupent les codes <strong>48 à 57</strong>, dans l'ordre.</p>

<h3>2. D'un chiffre-caractère à sa valeur</h3>
<pre class="pseudo">; les chiffres '0'..'9' sont les codes ASCII 48..57, dans l'ordre
; donc : valeur d'un chiffre = son code - 48
movzx rax, byte [buf + rbx]   ; charge dans rax l'octet situe a l'adresse buf+rbx, complete par des zeros
sub al, 48                    ; retranche 48 : exemple '7' (code 55) -> 55 - 48 = 7</pre>
<div class="tip"><code>movzx</code> (« <em>move with zero-extend</em> », copier en complétant de zéros) charge un octet (8 bits) dans un registre 64 bits en remplissant les 56 bits restants par des zéros. C'est indispensable : sans cela, le haut du registre garderait des bits laissés par une opération précédente, et la valeur serait fausse. <code>al</code> est le nom de l'octet de poids faible du registre <code>rax</code> (on peut viser juste le petit bout d'un grand registre). Une fois l'octet chargé, soustraire 48 donne la valeur du chiffre.</p></div>

<h3>3. Reconnaître un chiffre parmi d'autres caractères</h3>
<pre class="pseudo">    cmp al, 48        ; compare l'octet a 48 (le code de '0')
    jb pas_un_chiffre ; jb = "jump if below" : si code < '0', ce n'est pas un chiffre
    cmp al, 57        ; compare l'octet a 57 (le code de '9')
    ja pas_un_chiffre ; ja = "jump if above" : si code > '9', ce n'est pas un chiffre
    ; si on arrive ici : le code est entre 48 et 57 -> c'est bien un chiffre</pre>
<p>Un octet représente un chiffre si son code est compris entre 48 (<code>'0'</code>) et 57 (<code>'9'</code>) inclus. Les sauts <code>jb</code> (« <em>below</em> », en dessous) et <code>ja</code> (« <em>above</em> », au dessus) comparent en <strong>non signé</strong>, c'est-à-dire en considérant les valeurs comme toujours positives (0 à 255 pour un octet). C'est exactement ce qu'il faut pour des codes ASCII, qui ne sont jamais négatifs. Tout ce qui n'est pas un chiffre (espace, saut de ligne…) est un <strong>séparateur</strong>.</p>

<h3>4. Accumuler les chiffres : le schéma de Horner</h3>
<pre class="pseudo">; pour lire "447" de gauche a droite, l'accumulateur passe par : 0 -> 4 -> 44 -> 447
    imul r15, r15, 10       ; imul = multiplication : accumulateur x 10 (decale d'un rang decimal)
    add r15, rax            ; puis on ajoute la valeur du nouveau chiffre</pre>
<p>À chaque nouveau chiffre, on multiplie l'accumulateur par 10 (ce qui « pousse » les chiffres déjà présents d'un cran vers la gauche), puis on ajoute le nouveau chiffre. C'est exactement lire un nombre à voix haute, de gauche à droite : <code>447 = ((0×10 + 4)×10 + 4)×10 + 7</code>. Cette astuce s'appelle le <strong>schéma de Horner</strong>. <code>imul</code> est la multiplication entière ; <code>r15</code> nous servira d'<strong>accumulateur</strong> (la case où l'on construit le nombre en cours).</p>

<h3>5. Où s'arrête un nombre ?</h3>
<div class="warn">Un nombre se termine dès qu'on rencontre un <strong>séparateur</strong> (un espace, un saut de ligne, ou la fin des données). À cet instant précis, l'accumulateur contient la valeur complète du nombre : on peut alors l'utiliser (l'ajouter à un total, par exemple), puis le <strong>remettre à zéro</strong> pour être prêt à lire le nombre suivant. Oublier cette remise à zéro collerait deux nombres ensemble. C'est la leçon 5 qui orchestrera ce parcours complet du tampon.</div>`,
  exercises: [
    { type: "qcm", q: "Dans le tampon, '44' est stocké comme…", opts: ["la valeur 44", "deux caractères '4' (code 52)", "un entier binaire", "rien"], a: 1, exp: "Des octets ASCII." },
    { type: "qcm", q: "Le code ASCII de '0' est…", opts: ["0", "48", "30", "10"], a: 1, exp: "'0' = 48." },
    { type: "qcm", q: "La valeur d'un chiffre-caractère =", opts: ["code + 48", "code - 48", "code × 10", "code"], a: 1, exp: "'7'(55) - 48 = 7." },
    { type: "qcm", q: "movzx sert à…", opts: ["multiplier", "charger un octet en complétant de zéros (64 bits)", "afficher", "comparer"], a: 1, exp: "Zero-extend." },
    { type: "qcm", q: "Un octet est un chiffre s'il est…", opts: ["entre 0 et 9", "entre 48 et 57", "négatif", "> 100"], a: 1, exp: "Codes ASCII des chiffres." },
    { type: "qcm", q: "jb / ja comparent en…", opts: ["signé", "non signé", "flottant", "hexadécimal"], a: 1, exp: "Adapté aux codes ASCII." },
    { type: "qcm", q: "Le schéma d'accumulation :", opts: ["acc + chiffre", "acc = acc×10 + chiffre", "acc × chiffre", "acc - 48"], a: 1, exp: "Horner." },
    { type: "qcm", q: "Pour \"447\", la suite d'accumulateur est…", opts: ["4,4,7", "0,4,44,447", "447,44,4", "7,44,447"], a: 1, exp: "De gauche à droite." },
    { type: "qcm", q: "imul r15, r15, 10 fait…", opts: ["ajoute 10", "multiplie l'accumulateur par 10", "divise", "compare"], a: 1, exp: "Décalage décimal." },
    { type: "qcm", q: "Un nombre se termine à…", opts: ["chaque chiffre", "un séparateur (espace, saut de ligne, fin)", "jamais", "la première lettre seulement"], a: 1, exp: "Frontière de nombre." },
    { type: "vf", q: "On ne peut pas additionner directement les caractères '4' et '4' pour obtenir 8.", a: true, exp: "Il faut convertir d'abord." },
    { type: "qcm", q: "Après un séparateur, l'accumulateur doit être…", opts: ["laissé tel quel", "utilisé puis remis à zéro", "doublé", "ignoré"], a: 1, exp: "Prêt pour le nombre suivant." },
    { type: "qcm", q: "atoi signifie…", opts: ["add to integer", "ASCII to integer", "array of int", "atomic int"], a: 1, exp: "Texte → entier." },
    { type: "qcm", q: "sub al, 48 sur '9' (57) donne…", opts: ["9", "57", "48", "0"], a: 0, exp: "57 - 48 = 9." },
    { type: "qcm", q: "Charger un octet sans movzx laisserait…", opts: ["le registre propre", "des bits de poids fort indéterminés", "une erreur d'assemblage", "un zéro"], a: 1, exp: "D'où le zero-extend." }
  ],
  final: {
    title: "Exercice final — Convertir une chaîne de 3 chiffres",
    intro: `<p>On a en mémoire les trois octets <code>'1'</code>, <code>'2'</code>, <code>'3'</code> (une chaîne « 123 » sans séparateur). On veut obtenir la valeur 123 dans un registre.</p>`,
    questions: [
      { type: "qcm", q: "Valeur du premier chiffre '1' :", opts: ["1 (49 - 48)", "49", "0", "12"], a: 0, exp: "code - 48." },
      { type: "qcm", q: "Après le 2e chiffre, l'accumulateur vaut :", opts: ["3", "12 (1×10 + 2)", "2", "120"], a: 1, exp: "Horner." },
      { type: "qcm", q: "Après le 3e chiffre :", opts: ["23", "123 (12×10 + 3)", "6", "1230"], a: 1, exp: "Résultat." },
      { type: "qcm", q: "L'opération répétée est :", opts: ["add puis sub", "imul par 10 puis add du chiffre", "div", "cmp"], a: 1, exp: "×10 + chiffre." },
      { type: "qcm", q: "Chaque octet est chargé avec :", opts: ["mov (32 bits)", "movzx (zero-extend)", "lea", "push"], a: 1, exp: "Octet → 64 bits." }
    ],
    solution: `<pre class="pseudo">; s pointe sur "123" (3 octets), rcx = 3
    xor r15, r15               ; accumulateur = 0
    xor rbx, rbx               ; index
.conv:
    movzx rax, byte [s + rbx]  ; charge le chiffre-caractère
    sub al, 48                 ; -> valeur 0..9
    imul r15, r15, 10          ; décale d'un rang décimal
    add r15, rax               ; ajoute le chiffre
    inc rbx
    dec rcx
    jnz .conv
    ; r15 = 123</pre>
<p>À chaque tour : charger l'octet, retrancher 48, multiplier l'accumulateur par 10, ajouter. On obtient 123. Demain : parcourir tout le tampon pour compter et sommer les nombres.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton assembleur ici…",
  items: [
  { id: "projasm-l04", title: "Tester si un octet est un chiffre", level: 2,
    statement: "Écris une routine est_chiffre qui reçoit un octet dans al et met rax à 1 s'il s'agit d'un chiffre ('0'..'9', codes 48..57) et à 0 sinon. Utilise des comparaisons non signées.",
    hints: [
      "cmp al, 48 ; jb non (below = plus petit que '0').",
      "cmp al, 57 ; ja non (above = plus grand que '9').",
      "Sinon : mov rax, 1 ; ret. Cas non : xor eax, eax ; ret."
    ],
    solution: "; entree : al = octet ; sortie : rax = 1 si chiffre, 0 sinon\nest_chiffre:\n    cmp al, 48            ; < '0' ?\n    jb .non\n    cmp al, 57            ; > '9' ?\n    ja .non\n    mov rax, 1            ; c'est un chiffre\n    ret\n.non:\n    xor eax, eax          ; ce n'est pas un chiffre\n    ret",
    note: "Un octet est un chiffre s'il tombe dans l'intervalle 48..57. Les sauts non signés jb (below) et ja (above) sont corrects pour des codes ASCII, qui sont toujours positifs. Cette brique sert à distinguer, dans le tampon, les chiffres à accumuler des séparateurs (espaces, sauts de ligne) qui terminent un nombre." }
  ]
};
</script>
