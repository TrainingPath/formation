<script>
var DAY = {
  num: 1,
  title: "Cahier des charges et squelette (_start, exit)",
  subtitle: "Définir l'utilitaire, poser le squelette d'un programme système et le terminer proprement.",
  theory: `
<h3>1. À quoi sert ce projet, et pourquoi l'assembleur ?</h3>
<p>Pendant ce projet nous allons écrire, de A à Z, un vrai petit programme nommé <code>ludostat</code>. Il lit une liste de prix de jeux vidéo et affiche un mini-rapport : combien de jeux, le total, la moyenne. Rien d'extraordinaire… sauf qu'on l'écrit en <strong>assembleur</strong>. L'<strong>assembleur</strong> est le langage le plus proche de la machine : chaque ligne correspond à UNE instruction que le processeur exécute réellement. C'est comme passer de « conduire une voiture » (un langage haut niveau comme Python) à « actionner soi-même chaque piston du moteur ». On voit tout, on ne cache rien : chaque octet lu, chaque calcul, chaque échange avec le système d'exploitation.</p>
<p>Quelques mots de vocabulaire de base, à garder en tête pour tout le projet. Un <strong>bit</strong> est la plus petite information possible : un interrupteur qui vaut 0 ou 1. Un <strong>octet</strong> (en anglais <em>byte</em>) est un paquet de 8 bits ; il peut donc représenter un nombre de 0 à 255, ou un caractère. La <strong>mémoire</strong> (la RAM) est une immense étagère de cases numérotées, chaque case contenant un octet ; le numéro d'une case s'appelle son <strong>adresse</strong> (comme le numéro d'une boîte aux lettres). Le <strong>processeur</strong> (CPU) est l'ouvrier qui exécute les instructions ; pour travailler très vite, il garde quelques valeurs sous la main dans des <strong>registres</strong> — de minuscules cases ultra-rapides situées À L'INTÉRIEUR du processeur (comme les quelques outils qu'un artisan tient dans les mains, par opposition à tout l'atelier qu'est la mémoire).</p>

<h3>2. Le cahier des charges de ludostat</h3>
<p><code>ludostat</code> sera un <strong>filtre</strong> à la manière d'Unix. Un <strong>filtre</strong> est un programme qui reçoit des données par un « robinet d'entrée », les transforme, et les recrache par un « robinet de sortie ». Ces deux robinets ont un nom : l'<strong>entrée standard</strong> (en anglais <em>stdin</em>) est le canal par défaut d'où un programme lit ce qu'on lui donne (souvent le clavier) ; la <strong>sortie standard</strong> (<em>stdout</em>) est le canal par défaut où il écrit ses résultats (souvent l'écran). Concrètement, <code>ludostat</code> lira des prix (un nombre par ligne, ou séparés par des espaces) sur l'entrée standard, et écrira son rapport (nombre de jeux, total, moyenne) sur la sortie standard.</p>
<p>Comme <code>wc</code> (qui compte des mots) ou <code>sort</code> (qui trie), on pourra donc l'enchaîner dans un <strong>tube</strong> (en anglais <em>pipe</em>, le symbole <code>|</code>). Un <strong>tube</strong> branche la sortie d'un programme sur l'entrée du suivant, comme des tuyaux qu'on raccorde bout à bout : <code>cat prix.txt | ludostat</code> fait couler le contenu du fichier <code>prix.txt</code> directement dans <code>ludostat</code>.</p>

<h3>3. Un vrai programme « système », sans bibliothèque</h3>
<p>Habituellement, pour afficher du texte on écrit <code>printf</code> (en C) ou <code>print</code> (en Python). Ces commodités viennent d'une <strong>bibliothèque</strong> : un ensemble de fonctions déjà écrites qu'on réutilise. La grande bibliothèque du C s'appelle la <strong>libc</strong>. Ici, on s'en passe TOTALEMENT. On ne parlera qu'au <strong>noyau</strong> (en anglais <em>kernel</em>), le cœur du système d'exploitation qui contrôle le matériel (écran, clavier, disque, mémoire).</p>
<p>Pour demander un service au noyau, on utilise un <strong>appel système</strong> (en anglais <em>syscall</em>). Un <strong>appel système</strong>, c'est comme sonner à un guichet administratif : on remplit un formulaire (on met des valeurs précises dans certains registres), on sonne (l'instruction <code>syscall</code>), et le noyau fait le travail à notre place. Trois appels nous suffiront pour tout le projet, chacun désigné par un <strong>numéro</strong> : <code>read</code> (numéro 0, pour lire), <code>write</code> (numéro 1, pour écrire) et <code>exit</code> (numéro 60, pour s'arrêter).</p>
<div class="tip">Pas de <code>printf</code>, pas de libc : uniquement les appels système <code>read</code> (0), <code>write</code> (1) et <code>exit</code> (60). C'est le programme le plus proche du noyau possible — parfait pour rassembler tout ce qu'on a appris en assembleur.</div>

<h3>4. Le squelette d'un programme</h3>
<p>Un programme assembleur est rangé en <strong>sections</strong>, comme les rayons d'un magasin. La section <code>.data</code> contient les données connues d'avance (nos libellés de texte, par exemple « Total : »). La section <code>.bss</code> réserve de la mémoire vierge, non initialisée (nos <strong>tampons</strong> — on y reviendra). La section <code>.text</code> contient le <strong>code</strong>, c'est-à-dire les instructions à exécuter. Voici le squelette minimal :</p>
<pre class="pseudo">section .data
    ; nos libelles et donnees viendront ici        ; texte connu d'avance
section .bss
    ; nos tampons (memoire non initialisee) ici     ; zones de travail vides
section .text
    global _start                                    ; rend l'etiquette _start visible de l'exterieur
_start:                                              ; point d'entree : la 1re instruction executee
    ; ... le programme ...                            ; le coeur du travail viendra ici
    mov rax, 60         ; on met 60 dans le registre rax = numero de l'appel exit
    xor rdi, rdi        ; met rdi a 0 (xor d'un registre avec lui-meme = 0) : code de retour 0
    syscall             ; sonne au guichet : le noyau execute exit(0) et arrete le programme</pre>
<p>On utilise l'étiquette <code>_start</code> comme <strong>point d'entrée</strong> (l'endroit où le programme commence), et non <code>main</code> : sans la libc, il n'y a personne pour préparer le décor avant <code>main</code> ; c'est directement le noyau qui donne la main à <code>_start</code>. Le mot-clé <code>global</code> rend cette étiquette visible pour l'outil qui assemble le programme. Petit rappel de deux instructions : <code>mov destination, source</code> copie une valeur (« <em>move</em> ») dans un registre ; <code>xor rdi, rdi</code> est l'astuce classique pour mettre un registre à zéro (un nombre « ou-exclusif » avec lui-même donne toujours 0), plus courte et rapide que <code>mov rdi, 0</code>.</p>
<p>On termine <strong>obligatoirement</strong> par l'appel système <code>exit</code>. Le <strong>code de retour</strong> (le petit nombre qu'un programme laisse en partant, 0 = « tout s'est bien passé », autre = un problème) se place dans <code>rdi</code>, le premier registre d'argument.</p>

<h3>5. Assembler et lier, sans libc</h3>
<p>Transformer notre fichier texte en programme exécutable se fait en deux temps. <strong>Assembler</strong> traduit les instructions en code machine (un fichier <code>.o</code>, dit « objet »). <strong>Lier</strong> (avec l'outil <code>ld</code>, le <em>linker</em> ou « éditeur de liens ») recolle les morceaux en un exécutable final. Comme il n'y a aucune libc à raccorder, on lie directement avec <code>ld</code>, et non avec <code>gcc</code>.</p>
<pre class="pseudo"># version GNU as (assemblable directement) :
as ludostat.s -o ludostat.o &amp;&amp; ld ludostat.o -o ludostat   # assemble puis lie
./ludostat ; echo $?      # lance le programme, puis affiche son code de retour -> 0
# version NASM (autre assembleur, meme syntaxe Intel) :
nasm -f elf64 ludostat.asm -o ludostat.o &amp;&amp; ld ludostat.o -o ludostat</pre>
<p>La commande <code>echo $?</code> affiche <code>$?</code>, une variable spéciale du terminal qui contient le code de retour du DERNIER programme lancé : un moyen simple de vérifier avec quoi notre programme s'est terminé.</p>
<div class="warn">Sans libc, on <strong>lie avec <code>ld</code></strong> (pas avec <code>gcc</code>) et le point d'entrée est <code>_start</code>. Oublier l'appel <code>exit</code> ferait « tomber » l'exécution dans les octets suivants, non prévus comme du code → plantage immédiat (une <strong>erreur de segmentation</strong>, ou <em>segfault</em> : le programme touche une zone mémoire interdite et le noyau le tue).</div>

<h3>6. La méthode : brique par brique</h3>
<p>On construira <code>ludostat</code> en 8 étapes, chacune ajoutant une « brique » testable : afficher du texte (<code>write</code>), lire l'entrée (<code>read</code>), convertir le texte en nombres (<code>atoi</code>), parcourir les données pour les compter et les additionner, reconvertir un nombre en texte (<code>itoa</code>), assembler le rapport, puis tout réunir et tester les cas limites. À la fin de chaque leçon, une partie de plus fonctionne pour de vrai.</p>
<div class="tip">Réflexe du bon programmeur système : on avance par petites briques qui marchent, plutôt que d'écrire 200 lignes d'un coup avant de tester. Chaque étape se vérifie seule — c'est ainsi qu'on garde le contrôle d'un programme aussi bas niveau.</div>`,
  exercises: [
    { type: "qcm", q: "ludostat est…", opts: ["une bibliothèque de fonctions à lier", "un filtre : lit l'entrée standard, écrit sur la sortie standard", "un langage de programmation", "un compilateur vers du code machine"], a: 1, exp: "Un utilitaire Unix." },
    { type: "qcm", q: "Il affiche…", opts: ["un seul nombre", "le nombre de jeux, le total et la moyenne", "la liste triée des prix", "chaque prix lu, un par ligne"], a: 1, exp: "Un petit rapport." },
    { type: "qcm", q: "Quels appels système utilise-t-il ?", opts: ["printf/scanf", "read (0), write (1), exit (60)", "malloc/free", "open/socket"], a: 1, exp: "Programme système, sans libc." },
    { type: "qcm", q: "Le point d'entrée sans libc est…", opts: ["main", "_start", "_libc_start_main", "start()"], a: 1, exp: "Le noyau appelle _start." },
    { type: "qcm", q: "Comment un programme système se termine-t-il ?", opts: ["ret", "par l'appel système exit (rax=60)", "par l'instruction hlt", "close"], a: 1, exp: "exit explicite." },
    { type: "qcm", q: "Le code de retour se met dans…", opts: ["rax", "rdi (avant syscall exit)", "rsi", "rbx"], a: 1, exp: "1er argument de exit." },
    { type: "qcm", q: "On lie ce programme avec…", opts: ["gcc", "ld (pas de libc)", "make", "nasm seul"], a: 1, exp: "Liaison sans libc." },
    { type: "qcm", q: "Oublier exit provoque…", opts: ["un arrêt propre en fin de section", "un plantage (l'exécution continue dans du code non prévu)", "un retour 0", "un avertissement de l'éditeur de liens"], a: 1, exp: "Segfault." },
    { type: "qcm", q: "La section du code exécutable est…", opts: [".data", ".bss", ".text", ".rodata"], a: 2, exp: "Instructions." },
    { type: "qcm", q: "La section des tampons non initialisés est…", opts: [".text", ".bss", ".data", ".code"], a: 1, exp: "Mémoire réservée." },
    { type: "vf", q: "Un filtre Unix s'enchaîne dans un pipe (cat fichier | ludostat).", a: true, exp: "Entrée/sortie standard." },
    { type: "qcm", q: "read porte le numéro…", opts: ["1", "0", "60", "10"], a: 1, exp: "sys_read = 0." },
    { type: "qcm", q: "write porte le numéro…", opts: ["0", "1", "60", "2"], a: 1, exp: "sys_write = 1." },
    { type: "qcm", q: "exit porte le numéro…", opts: ["0", "1", "60", "127"], a: 2, exp: "sys_exit = 60." },
    { type: "qcm", q: "Pourquoi construire brique par brique ?", opts: ["par obligation", "pour qu'une partie de plus fonctionne à chaque étape", "pour réduire la taille du binaire final", "parce que l'assembleur l'impose"], a: 1, exp: "Progressif et testable." }
  ],
  final: {
    title: "Exercice final — Le squelette qui quitte avec un code",
    intro: `<p>On veut le plus petit programme qui compile, tourne et renvoie le code de sortie <strong>3</strong>.</p>`,
    questions: [
      { type: "qcm", q: "Le point d'entrée :", opts: ["main:", "_start:", "_init:", "run:"], a: 1, exp: "Sans libc." },
      { type: "qcm", q: "Le numéro de exit :", opts: ["1", "60", "0", "3"], a: 1, exp: "rax = 60." },
      { type: "qcm", q: "Où mettre le code 3 ?", opts: ["rax", "rdi", "rsi", "rbx"], a: 1, exp: "1er argument." },
      { type: "qcm", q: "L'instruction qui déclenche l'appel :", opts: ["call", "syscall", "int 3", "ret"], a: 1, exp: "syscall." },
      { type: "qcm", q: "On vérifie le code retour avec…", opts: ["cat", "echo $? après ./prog", "ls", "grep"], a: 1, exp: "$? = dernier code." }
    ],
    solution: `<pre class="pseudo">section .text
    global _start
_start:
    mov rax, 60         ; exit
    mov rdi, 3          ; code de retour 3
    syscall
; as skel.s -o skel.o &amp;&amp; ld skel.o -o skel ; ./skel ; echo $?   -> 3</pre>
<p>Trois instructions : charger le numéro d'appel (60), l'argument (3), déclencher <code>syscall</code>. C'est le squelette de tout programme système. Demain : afficher du texte avec <code>write</code>.</p>`
  }
};
</script>

  ]
