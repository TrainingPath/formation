<script>
var DAY = {
  num: 13,
  title: "Classes abstraites et interfaces",
  subtitle: "Définir un contrat que les classes dérivées doivent remplir, avec les méthodes virtuelles pures.",
  theory: `
<h3>1. La méthode virtuelle pure</h3>
<p>Rappel (leçon 12) : une méthode <code>virtual</code> peut être redéfinie par une classe dérivée. Une méthode <strong>virtuelle pure</strong> va plus loin : elle déclare qu'une action existe, mais <strong>sans écrire son code</strong>. On l'écrit en ajoutant <code>= 0</code> à la fin.</p>
<pre class="pseudo">class Payable {
public:
    virtual double montant() const = 0;   // = 0 = méthode virtuelle PURE : déclarée mais SANS corps (aucun { })
    virtual ~Payable() = default;          // destructeur virtuel (toujours nécessaire pour une classe de base)
};</pre>
<p>Une méthode <strong>virtuelle pure</strong> (<code>= 0</code>) déclare un comportement <strong>sans l'implémenter</strong>. Toute classe qui en contient au moins une est dite <strong>abstraite</strong> : on ne peut pas créer d'objet directement à partir d'elle (elle est incomplète, il lui manque du code).</p>

<h3>2. La classe abstraite = une interface</h3>
<pre class="pseudo">class Location : public Payable {                 // Location hérite de Payable (le contrat)
    double prixJour_; int jours_;                 // attributs : prix par jour et nombre de jours
public:
    Location(double p, int j) : prixJour_(p), jours_(j) {}   // constructeur : initialise les deux attributs
    double montant() const override { return prixJour_ * jours_; }  // FOURNIT le code de montant() : ici prix × jours
};</pre>
<div class="warn">Une classe abstraite définit un <strong>contrat</strong> : chaque classe dérivée <strong>doit</strong> fournir le code de toutes les méthodes virtuelles pures, sinon elle reste abstraite à son tour. C'est l'équivalent C++ d'une <strong>interface</strong> (la notion connue en Java ou C#) : une liste d'actions à respecter.</div>

<h3>3. Manipuler par l'interface</h3>
<pre class="pseudo">double totalAPayer(const std::vector&lt;std::unique_ptr&lt;Payable&gt;&gt;&amp; items) {  // reçoit une liste de Payable (via smart pointers, leçon 14)
    double s = 0;                          // accumulateur du total
    for (const auto&amp; item : items)         // pour chaque élément de la liste (sans copie)
        s += item-&gt;montant();              // -&gt; appelle montant() sur l'objet pointé ; peu importe son type réel
    return s;                              // renvoie la somme de tous les montants
}</pre>
<p>On traite ainsi <code>Location</code>, <code>Vente</code>… de façon uniforme via <code>Payable</code> : le code ne connaît que le contrat, pas les détails de chaque type. Ajouter un nouveau type de <code>Payable</code> plus tard ne change rien à ce code.</p>

<h3>4. On ne peut pas instancier une classe abstraite</h3>
<pre class="pseudo">Payable p;                            // ERREUR : Payable est abstraite (montant() n'a pas de code) → impossible d'en créer un objet
Payable* p = new Location(5.0, 3);    // OK : on manipule via un POINTEUR (ou une référence) de la classe de base</pre>

<h3>5. Interface pure</h3>
<div class="tip">Une « interface » en C++ est une classe abstraite ne contenant <strong>que</strong> des méthodes virtuelles pures (plus un destructeur virtuel), et <strong>aucun attribut</strong>. Elle décrit ce qu'un objet <em>sait faire</em>, sans dire comment il le fait. C'est un outil puissant pour <strong>découpler</strong> (séparer proprement) les différentes parties d'un programme.</div>`,
  exercises: [
    { type: "qcm", q: "Une méthode virtuelle pure se déclare avec…", opts: ["virtual ... { }", "virtual ... = 0;", "static", "final"], a: 1, exp: "= 0 : pas de corps." },
    { type: "qcm", q: "Une classe avec une méthode virtuelle pure est…", opts: ["concrète", "abstraite (non instanciable)", "finale", "un template"], a: 1, exp: "On ne peut pas l'instancier." },
    { type: "qcm", q: "Une classe abstraite définit…", opts: ["une implémentation complète", "un contrat que les dérivées doivent remplir", "une copie", "une boucle"], a: 1, exp: "Comme une interface." },
    { type: "qcm", q: "Peut-on écrire <code>Payable p;</code> si Payable est abstraite ?", opts: ["oui", "non : erreur, elle n'est pas instanciable", "parfois", "avec new seulement"], a: 1, exp: "On manipule via pointeur/référence de base." },
    { type: "qcm", q: "Une dérivée qui n'implémente pas la virtuelle pure…", opts: ["compile quand même", "reste abstraite à son tour", "plante", "est concrète"], a: 1, exp: "Elle doit fournir la méthode." },
    { type: "qcm", q: "L'équivalent C++ d'une interface Java/C# est…", opts: ["un struct", "une classe abstraite avec méthodes virtuelles pures", "un template", "une fonction"], a: 1, exp: "Que des virtuelles pures + destructeur virtuel." },
    { type: "qcm", q: "On manipule des objets abstraits via…", opts: ["copie par valeur", "pointeur ou référence de base", "un int", "une macro"], a: 1, exp: "Le polymorphisme l'exige." },
    { type: "qcm", q: "<code>item->montant()</code> sur un Payable appelle…", opts: ["Payable::montant (vide)", "la version du type réel (Location, Vente…)", "une erreur", "rien"], a: 1, exp: "Polymorphisme via l'interface." },
    { type: "qcm", q: "Ajouter un nouveau type de Payable…", opts: ["casse tout le code", "ne change rien au code qui utilise l'interface", "supprime les autres", "impose de tout recompiler à la main"], a: 1, exp: "Découplage par l'interface." },
    { type: "qcm", q: "Une interface pure ne contient…", opts: ["que des attributs", "que des méthodes virtuelles pures (+ destructeur virtuel)", "un main", "des boucles"], a: 1, exp: "Aucun attribut, que le contrat." },
    { type: "vf", q: "Une classe abstraite peut avoir des méthodes non virtuelles avec implémentation.", a: true, exp: "Oui : elle est abstraite dès qu'elle a UNE virtuelle pure, mais peut avoir d'autres méthodes." },
    { type: "qcm", q: "Le = 0 signifie…", opts: ["la méthode renvoie 0", "méthode virtuelle pure (à implémenter dans les dérivées)", "un compteur", "une erreur"], a: 1, exp: "Pas de corps dans la base." },
    { type: "qcm", q: "L'intérêt d'une interface :", opts: ["plus de code", "découpler : le code dépend du contrat, pas de l'implémentation", "supprimer virtual", "copier"], a: 1, exp: "Souplesse et extensibilité." },
    { type: "qcm", q: "Location et Vente peuvent être traitées…", opts: ["séparément seulement", "uniformément via Payable", "sans héritage", "en int"], a: 1, exp: "Interface commune." },
    { type: "qcm", q: "Le destructeur d'une interface doit être…", opts: ["absent", "virtuel", "privé", "supprimé"], a: 1, exp: "virtual ~I() = default;." }
  ],
  final: {
    title: "Exercice final — Le contrat Affichable",
    intro: `<p>On veut une interface Affichable. Analyse :</p>
<pre class="pseudo">class Affichable {
public:
    virtual void afficher() const;   // PROBLÈME : virtual "normale" sans corps ni = 0 ; pour un contrat il faut = 0 (virtuelle pure)
};
class Jeu : public Affichable {      // Jeu hérite d'Affichable
    std::string nom_;                // ... mais ne fournit PAS afficher() → Jeu reste abstraite
};
Affichable a;                        // PROBLÈME : Affichable est abstraite → on ne peut pas l'instancier</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — <code>virtual void afficher() const;</code> :", opts: ["correct", "pour une interface, ce doit être une virtuelle pure : = 0", "il faut static", "rien"], a: 1, exp: "= 0 pour imposer l'implémentation." },
      { type: "qcm", q: "Erreur n°2 — <code>class Jeu</code> n'implémente pas afficher() :", opts: ["ok", "Jeu reste abstraite s'il ne fournit pas afficher()", "compile", "trie"], a: 1, exp: "La dérivée doit remplir le contrat." },
      { type: "qcm", q: "Erreur n°3 — <code>Affichable a;</code> :", opts: ["correct", "Affichable est abstraite : non instanciable", "il faut new", "rien"], a: 1, exp: "On manipule via pointeur/référence." },
      { type: "qcm", q: "Que manque-t-il à Affichable ?", opts: ["rien", "un destructeur virtuel", "un attribut", "un main"], a: 1, exp: "virtual ~Affichable() = default;." },
      { type: "qcm", q: "Une fois corrigé, Jeu doit fournir…", opts: ["rien", "afficher() const override", "un constructeur privé", "un template"], a: 1, exp: "L'implémentation du contrat." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                       // pour std::cout (afficher)
#include &lt;string&gt;                         // pour std::string (le texte)

class Affichable {                        // interface Affichable
public:
    virtual void afficher() const = 0;    // virtuelle PURE (= 0) : chaque dérivée DOIT la fournir
    virtual ~Affichable() = default;      // destructeur virtuel
};
class Jeu : public Affichable {           // Jeu hérite d'Affichable et remplit le contrat
    std::string nom_;                     // attribut : le nom
public:
    Jeu(std::string nom) : nom_(nom) {}   // constructeur : initialise le nom
    void afficher() const override {      // override : FOURNIT le code de afficher()
        std::cout &lt;&lt; nom_ &lt;&lt; "\\n";        // affiche le nom puis va à la ligne
    }
};
int main() {                              // point d'entrée du programme
    Jeu j("Catan");                       // on crée un Jeu concret
    Affichable&amp; ref = j;                  // ref est une référence de base vers j (manipulation par l'interface)
    ref.afficher();                       // appelle la version de Jeu (polymorphisme) → affiche Catan
    return 0;                             // 0 = fin sans erreur
}</pre>
<p>Une interface = des virtuelles pures + un destructeur virtuel ; chaque dérivée remplit le contrat. On manipule via une référence/pointeur de base. Demain : les templates.</p>`
  }
};
