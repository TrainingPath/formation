  subtitle: "Compilé, orienté objet et générique : le C++ ajoute au C la puissance des abstractions.",
  theory: `
<h3>1. Le C++, c'est quoi ?</h3>
<p>Un <strong>langage de programmation</strong> est une façon d'écrire, dans un simple fichier texte, des <strong>ordres</strong> (on dit des <strong>instructions</strong>) que l'ordinateur va exécuter. Ce texte s'appelle le <strong>code source</strong>. Le C++ est un langage <strong>compilé</strong> : avant de pouvoir tourner, ton texte est traduit <em>en une seule fois</em>, par un programme appelé <strong>compilateur</strong>, en « langage machine » (les 0 et 1 que le processeur comprend directement). C'est un peu comme faire traduire un livre entier avant de le vendre : à la lecture, tout est déjà prêt, donc c'est très <strong>rapide</strong>. À l'inverse, un langage <em>interprété</em> comme Python est traduit ligne par ligne pendant qu'il s'exécute (comme un interprète qui traduit en direct).</p>
<p>Le C++ est aussi <strong>à typage statique</strong> : chaque donnée possède un <strong>type</strong> (son genre : nombre entier, texte, nombre à virgule…) qui est fixé et vérifié <em>avant</em> l'exécution. Cela permet d'attraper beaucoup d'erreurs très tôt. Enfin, il est <strong>multi-paradigme</strong> : un « paradigme » est une manière de penser un programme, et le C++ en accepte plusieurs — <em>procédural</em> (une suite d'étapes), <em>orienté objet</em> (des « objets » qui regroupent des données et les actions qui vont avec), et <em>générique</em> (du code qui fonctionne pour n'importe quel type). Il a été créé par Bjarne Stroustrup dans les années 1980 comme « un C avec des classes ». On l'emploie là où la <strong>performance</strong> compte : jeux vidéo, moteurs, systèmes embarqués, calcul scientifique, navigateurs, bases de données.</p>
<p>Ce cours enseigne le <strong>C++ moderne</strong> (les versions C++11 et C++17 du langage). On y privilégie la <strong>STL</strong> — la <em>Standard Template Library</em>, c'est-à-dire la « boîte à outils » fournie avec le langage (listes, textes, tris… déjà tout prêts) —, les objets et une gestion automatique de la mémoire, plutôt que le style bas niveau hérité du C.</p>

<h3>2. Le programme minimal</h3>
<p>Avant de lire le code, quelques mots-clés. <code>#include</code> est un ordre qui dit « colle ici le contenu d'un autre fichier ». Une <strong>fonction</strong> est un bloc d'instructions qui porte un nom ; <code>main</code> est la fonction spéciale par laquelle le programme <strong>démarre</strong>. Les accolades <code>{ }</code> délimitent un <strong>bloc</strong> (le contenu de la fonction). Le point-virgule <code>;</code> marque la <strong>fin d'une instruction</strong>, comme le point d'une phrase.</p>
<pre class="pseudo">#include &lt;iostream&gt;      // # = ordre donné au préprocesseur ; include = "colle ici" le fichier iostream (outils d'affichage et de saisie)

int main() {              // int = la fonction renvoie un entier ; main = point de DÉPART du programme ; () = ne reçoit aucune donnée ; { ouvre le bloc
    std::cout &lt;&lt; "Bonjour le monde !" &lt;&lt; "\\n";   // envoie vers l'écran (std::cout) le texte puis "\\n" (un retour à la ligne)
    return 0;             // return = rend une valeur au système ; 0 = "le programme s'est terminé sans erreur"
}                         // } ferme le bloc de la fonction main</pre>
<p>Comme en C, tout démarre dans <code>main</code>. Mais l'affichage passe par <strong><code>std::cout</code></strong> — un objet qui représente l'<strong>écran</strong> (la « sortie standard », <em>cout</em> = <em>character output</em>) — et par l'opérateur <strong><code>&lt;&lt;</code></strong> qui signifie « envoyer vers ». On n'utilise donc pas <code>printf</code> du C. Les guillemets <code>"..."</code> entourent un <strong>texte</strong> (une « chaîne de caractères »), et <code>\\n</code> est le caractère spécial « aller à la ligne » (comme la touche Entrée).</p>

<h3>3. std::cout et les espaces de noms</h3>
<pre class="pseudo">std::cout &lt;&lt; "A" &lt;&lt; "B" &lt;&lt; "\\n";        // on enchaîne trois envois vers l'écran : "A", puis "B", puis un retour à la ligne → affiche AB
std::cout &lt;&lt; 42 &lt;&lt; " " &lt;&lt; 3.14 &lt;&lt; "\\n";  // ici on envoie un entier (42), une espace, un nombre à virgule (3.14) : cout gère chaque type tout seul</pre>
<p><code>std::</code> désigne l'<strong>espace de noms standard</strong> (en anglais <em>namespace</em>) : c'est comme un « nom de famille » qui regroupe les outils de la bibliothèque standard. <code>cout</code>, <code>string</code>, <code>vector</code>… vivent tous dans <code>std</code>, d'où <code>std::cout</code>. Le <code>::</code> se lit « de » (le <code>cout</code> de <code>std</code>). Remarque : contrairement à <code>printf</code>, l'opérateur <code>&lt;&lt;</code> <strong>déduit le type</strong> automatiquement — plus besoin des codes <code>%d</code> (entier) ou <code>%f</code> (flottant).</p>
<div class="warn">On écrit <code>std::cout</code> avec le préfixe <code>std::</code>. Écrire <code>using namespace std;</code> permettrait de l'omettre, mais c'est déconseillé dans les gros fichiers (risque de <strong>collisions de noms</strong> : deux outils différents portant le même nom court). Ce cours garde <code>std::</code> explicite.</div>

<h3>4. Compiler du C++</h3>
<p><strong>Compiler</strong>, c'est demander au compilateur de transformer ton fichier <code>.cpp</code> en un programme exécutable. Voici la commande à taper dans un terminal :</p>
<pre class="pseudo">g++ -std=c++17 -Wall -Wextra prog.cpp -o prog   // g++ = le compilateur ; -std=c++17 = utiliser la norme C++17 ; -Wall -Wextra = activer tous les avertissements ; prog.cpp = ton fichier ; -o prog = nommer le résultat "prog"
./prog                                          // ./ = "dans le dossier courant" ; on lance ainsi le programme fabriqué</pre>
<p>On précise la <strong>norme</strong> (<code>-std=c++17</code>) pour disposer des fonctionnalités modernes, et on active les <strong>avertissements</strong> (<code>-Wall -Wextra</code>) qui signalent le code douteux. L'extension d'un fichier source C++ est <code>.cpp</code>.</p>

<h3>5. Commentaires et point-virgule</h3>
<p>Un <strong>commentaire</strong> est un texte ignoré par le compilateur : il ne sert qu'à toi (et aux autres humains) pour expliquer le code.</p>
<pre class="pseudo">// commentaire d'une ligne : tout ce qui suit // jusqu'à la fin de la ligne est ignoré
/* commentaire                                 // /* ouvre un commentaire...
   sur plusieurs lignes */                     // ...qui se termine par */ (il peut couvrir plusieurs lignes)</pre>
<div class="tip">Comme en C, chaque instruction finit par <code>;</code> et les blocs sont délimités par <code>{ }</code>. Le C++ est un « sur-ensemble » du C : presque tout code C valide est aussi du C++, mais le C++ moderne s'écrit très différemment.</div>`,
  exercises: [
    { type: "qcm", q: "Le C++ est un langage…", opts: ["interprété comme Python", "compilé, à typage statique, multi-paradigme", "sans types", "uniquement objet"], a: 1, exp: "Compilé et multi-paradigme (procédural, objet, générique)." },
    { type: "qcm", q: "Quel objet affiche du texte en C++ ?", opts: ["printf", "std::cout", "Console.Write", "System.out"], a: 1, exp: "std::cout avec l'opérateur <<." },
    { type: "qcm", q: "Quel opérateur envoie vers std::cout ?", opts: ["<<", ">>", "->", "::"], a: 0, exp: "<< « envoie vers » le flux de sortie." },
    { type: "qcm", q: "Que signifie <code>std::</code> ?", opts: ["une variable", "l'espace de noms standard", "un type", "une erreur"], a: 1, exp: "cout, string, vector… y vivent." },
    { type: "qcm", q: "Faut-il des %d / %f avec std::cout ?", opts: ["oui", "non : << déduit le type automatiquement", "seulement pour les entiers", "toujours"], a: 1, exp: "Pas de spécificateurs de format." },

    { type: "qcm", q: "Où démarre l'exécution ?", opts: ["première ligne", "la fonction main", "std::cout", "l'include"], a: 1, exp: "int main() est le point d'entrée." },
    { type: "qcm", q: "<code>std::cout << \"A\" << \"B\";</code> affiche…", opts: ["A B", "AB", "A puis B sur deux lignes", "une erreur"], a: 1, exp: "Les envois s'enchaînent : AB." },

    { type: "vf", q: "Le C++ moderne privilégie la STL et une gestion mémoire automatique.", a: true, exp: "Plutôt que le style bas niveau du C." },
    { type: "qcm", q: "Quelle extension pour un fichier source C++ ?", opts: [".c", ".cpp", ".cxx uniquement", ".java"], a: 1, exp: ".cpp (aussi .cc, .cxx)." },
    { type: "qcm", q: "Chaque instruction C++ se termine par…", opts: ["un saut de ligne", "un point-virgule ;", "une virgule", "rien"], a: 1, exp: "Comme en C." },
    { type: "qcm", q: "Le C++ a été créé par…", opts: ["Dennis Ritchie", "Bjarne Stroustrup", "Guido van Rossum", "James Gosling"], a: 1, exp: "« Un C avec des classes »." },
    { type: "qcm", q: "À quoi sert <code>-std=c++17</code> ?", opts: ["accélérer", "activer les fonctionnalités du C++17", "lier une lib", "créer une fenêtre"], a: 1, exp: "On choisit la norme du langage." }
  ],
  final: {
    title: "Exercice final — Ta carte de visite (C++)",
    intro: `<p>Un programme avec des erreurs à corriger :</p>
<pre class="pseudo">include &lt;iostream&gt;                               // ERREUR : il manque le # devant include (le préprocesseur ne reconnaît pas la ligne)
int main() {                                      // début de la fonction de départ
    std::Cout &lt;&lt; "Aurelia" &lt;&lt; "\\n"                // ERREUR : "Cout" avec un C majuscule (il faut "cout"), et il manque le ; à la fin
    std::cout &lt;&lt; "Bachelier en informatique\\n";   // cette ligne-ci est correcte : envoie le texte + retour à la ligne
    return 0                                      // ERREUR : il manque le point-virgule après le 0
}                                                 // fin du bloc de main</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — <code>include &lt;iostream&gt;</code> :", opts: ["correct", "il manque le # : #include", "il faut import", "il faut using"], a: 1, exp: "Directive du préprocesseur : #include." },
      { type: "qcm", q: "Erreur n°2 — <code>std::Cout</code> :", opts: ["correct", "c'est std::cout (minuscule) ; et il manque le ; final", "il faut Console", "il faut println"], a: 1, exp: "Casse : cout ; instruction terminée par ;." },
      { type: "qcm", q: "Erreur n°3 — <code>return 0</code> :", opts: ["correct", "il manque le point-virgule : return 0;", "il faut return 1", "return interdit"], a: 1, exp: "Toute instruction finit par ;." },
      { type: "qcm", q: "Quel opérateur pour afficher ?", opts: [">>", "<<", "->", "::"], a: 1, exp: "<< vers std::cout." },
      { type: "qcm", q: "Une fois corrigé, combien de lignes s'affichent ?", opts: ["1", "2", "3", "0"], a: 1, exp: "Deux cout avec \\n = deux lignes." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                              // le # est ajouté : on colle iostream pour disposer de std::cout

int main() {                                     // point d'entrée du programme
    std::cout &lt;&lt; "Aurelia" &lt;&lt; "\\n";              // "cout" en minuscules, ; ajouté : affiche Aurelia puis va à la ligne
    std::cout &lt;&lt; "Bachelier en informatique\\n";  // affiche la formation puis va à la ligne
    return 0;                                    // ; ajouté : rend 0 = fin sans erreur
}                                                // fin du bloc de main
// Compiler : g++ -std=c++17 -Wall carte.cpp -o carte  puis  ./carte   // la commande de compilation puis de lancement</pre>
<p>Trois corrections : le <code>#</code> de #include, la casse de <code>cout</code>, les <code>;</code> manquants. Le C++ démarre comme le C mais s'écrit avec les flux. Demain : les variables et <code>auto</code>.</p>`
  }
