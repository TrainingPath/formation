  title: "Classes et encapsulation",
  subtitle: "Regrouper données et comportements dans une classe, et protéger l'état avec private.",
  theory: `
<h3>1. Une classe = données + méthodes</h3>
<p>Une <strong>classe</strong> est un « plan de fabrication » (un moule) qui décrit un type d'objet créé par toi. Elle rassemble des <strong>attributs</strong> (les données que possède l'objet) et des <strong>méthodes</strong> (les actions que l'objet sait faire). Un <strong>objet</strong> (ou « instance ») est un exemplaire concret fabriqué à partir de ce plan. Analogie : la classe est le plan d'une maison, l'objet est une maison réellement construite.</p>
<pre class="pseudo">class Jeu {                  // on déclare une classe nommée Jeu (le plan)
private:                     // private = section CACHÉE : accessible uniquement depuis l'intérieur de la classe
    std::string nom_;        // attribut : le nom du jeu (le _ final est une convention pour "attribut privé")
    double prix_;            // attribut : le prix
    int stock_;              // attribut : la quantité en stock
public:                      // public = section VISIBLE de l'extérieur (l'interface)
    void afficher() const {  // méthode publique afficher ; const = elle ne modifie pas l'objet (lecture seule)
        std::cout &lt;&lt; nom_ &lt;&lt; " : " &lt;&lt; prix_ &lt;&lt; "\\n";  // affiche le nom et le prix de CET objet, puis va à la ligne
    }
};        // ATTENTION : une classe se termine par un point-virgule ; (ne pas l'oublier !)</pre>
<p>Une <strong>classe</strong> regroupe donc des <strong>attributs</strong> (les données) et des <strong>méthodes</strong> (les comportements). Convention courante : les attributs privés portent un suffixe <code>_</code> pour les distinguer d'un coup d'œil.</p>

<h3>2. public vs private : l'encapsulation</h3>
<div class="warn">Les membres <code>private</code> ne sont accessibles que <strong>depuis l'intérieur de la classe</strong> ; les membres <code>public</code> forment l'<strong>interface</strong> visible de l'extérieur. On cache les données (private) et on n'expose que des méthodes contrôlées (public) : c'est l'<strong>encapsulation</strong>. Grâce à elle, personne ne peut mettre l'objet dans un état incohérent en trafiquant directement ses données ; l'objet reste toujours valide.</div>

<h3>3. Créer et utiliser un objet</h3>
<pre class="pseudo">Jeu catan;                   // on fabrique un objet (une "instance") de la classe Jeu, nommé catan
catan.afficher();            // on appelle la méthode afficher() DE cet objet, avec le point .</pre>
<p>Chaque objet possède sa <strong>propre</strong> copie des attributs (deux jeux ont chacun leur nom, leur prix…). On accède aux membres publics avec le point <code>.</code> (ou la flèche <code>-&gt;</code> quand on passe par un pointeur sur l'objet).</p>

<h3>4. Getters et méthodes const</h3>
<pre class="pseudo">const std::string&amp; nom() const { return nom_; }   // getter : renvoie le nom en lecture ; const = ne modifie pas l'objet ; const& = sans copie
bool estDisponible() const { return stock_ &gt; 0; } // renvoie true si le stock est &gt; 0 ; const car simple lecture
void reapprovisionner(int n) { stock_ += n; }     // ajoute n au stock : cette méthode MODIFIE l'objet → PAS de const</pre>
<p>Un <strong>getter</strong> est une méthode qui expose une donnée en lecture. Le mot-clé <code>const</code> placé après une méthode <strong>promet</strong> qu'elle ne modifie pas l'objet — à mettre sur toute méthode qui ne fait que lire.</p>

<h3>5. struct vs class</h3>
<pre class="pseudo">struct Point { int x, y; };   // struct : les membres sont PUBLICS par défaut
class  Jeu   { /* ... */ };    // class : les membres sont PRIVÉS par défaut</pre>
<div class="tip">En C++, <code>struct</code> et <code>class</code> sont presque identiques : la seule différence est le niveau d'accès par défaut (public pour <code>struct</code>, private pour <code>class</code>). On utilise <code>struct</code> pour de simples regroupements de données, et <code>class</code> dès qu'il y a de l'encapsulation.</div>`,

    intro: `<p>On modélise un jeu. Analyse :</p>
<pre class="pseudo">class Jeu {                              // déclaration de la classe Jeu
    std::string nom;                     // attribut PRIVÉ par défaut (class = private par défaut)
    int stock;                           // attribut privé lui aussi
public:                                  // début de l'interface publique
    void afficher() { std::cout &lt;&lt; nom; } // devrait être const (ne modifie rien)

}                                        // ERREUR : il manque le ; après l'accolade fermante de la classe

int main() {                             // programme principal
    Jeu j;                               // on crée un objet Jeu
    j.stock = 3;                         // ERREUR : stock est PRIVÉ, inaccessible depuis main
}</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — après <code>}</code> de la classe :", opts: ["rien", "il manque le ; (class Jeu { ... };)", "il faut struct", "une virgule"], a: 1, exp: "Point-virgule obligatoire." },
      { type: "qcm", q: "Erreur n°2 — <code>j.stock = 3;</code> dans main :", opts: ["correct", "stock est privé : inaccessible de l'extérieur", "il faut ->", "rien"], a: 1, exp: "Encapsulation : passer par une méthode." },
      { type: "qcm", q: "afficher() et getStock() devraient être…", opts: ["non-const", "const (elles ne modifient rien)", "private", "supprimées"], a: 1, exp: "Méthodes de lecture." },
      { type: "qcm", q: "Comment initialiser correctement le stock ?", opts: ["j.stock = 3", "via un constructeur ou une méthode publique", "impossible", "en global"], a: 1, exp: "L'état privé se règle par l'interface." },
      { type: "qcm", q: "Le rôle de getStock() :", opts: ["modifier le stock", "exposer le stock en lecture", "supprimer le jeu", "trier"], a: 1, exp: "Getter." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                    // pour std::cout (afficher)
#include &lt;string&gt;                      // pour std::string (le texte)

class Jeu {                            // classe Jeu
    std::string nom_;                  // attribut privé : le nom
    int stock_;                        // attribut privé : le stock
public:                                // interface publique
    Jeu(std::string nom, int stock) : nom_(nom), stock_(stock) {}  // constructeur : initialise les attributs (détaillé leçon 10)
    void afficher() const { std::cout &lt;&lt; nom_ &lt;&lt; " (stock " &lt;&lt; stock_ &lt;&lt; ")\\n"; }  // const : lecture seule
    int stock() const { return stock_; }   // getter const : renvoie le stock
};                                     // ; final de la classe (bien présent)

int main() {                           // point d'entrée du programme
    Jeu catan("Catan", 3);             // on crée l'objet en réglant son état à la construction
    catan.afficher();                  // appelle la méthode afficher() de l'objet
    std::cout &lt;&lt; catan.stock() &lt;&lt; "\\n"; // lit le stock via le getter (pas d'accès direct)
    return 0;                          // 0 = fin sans erreur
}</pre>
<p>Attributs privés, méthodes const pour lire, et un constructeur pour initialiser proprement (demain). L'encapsulation garantit un objet toujours valide. Demain : constructeurs, RAII et destructeur.</p>`
  }
