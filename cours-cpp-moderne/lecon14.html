  num: 14,
  title: "Les templates",
  subtitle: "Écrire du code générique qui marche pour n'importe quel type — le fondement de la STL.",
  theory: `
<h3>1. La fonction template</h3>
<p>Un <strong>template</strong> (« patron » ou « modèle ») est du code écrit une seule fois mais qui fonctionne pour <strong>n'importe quel type</strong>. Au lieu d'écrire un nom de type précis (comme <code>int</code>), on écrit un <strong>type paramétré</strong> noté <code>T</code> : c'est un emplacement que le compilateur remplira par le vrai type au moment de l'utilisation. On introduit le template par <code>template &lt;typename T&gt;</code> (« pour un certain type T »).</p>
<pre class="pseudo">template &lt;typename T&gt;              // annonce un template avec un type paramétré nommé T
T maximum(T a, T b) {              // fonction qui reçoit deux valeurs de type T et renvoie une valeur de type T
    return (a &gt; b) ? a : b;        // renvoie a si a > b, sinon b (opérateur ternaire "condition ? siVrai : siFaux")
}
maximum(3, 5);                     // ici T vaut int (les arguments sont des entiers)
maximum(2.5, 1.0);                // ici T vaut double (arguments à virgule)
maximum(std::string("a"), std::string("b"));  // ici T vaut std::string (arguments texte)</pre>
<p>Un <strong>template</strong> est donc un patron : <code>T</code> est un type paramétré. Le compilateur <strong>génère automatiquement</strong> une version de la fonction pour chaque type réellement utilisé. Une seule écriture couvre tous les types.</p>

<h3>2. La classe template</h3>
<pre class="pseudo">template &lt;typename T&gt;              // template de CLASSE, paramétré par le type T
class Boite {                     // une "boîte" pouvant contenir une valeur de type T
    T contenu_;                   // attribut : le contenu, de type T
public:
    Boite(T v) : contenu_(v) {}   // constructeur : range la valeur v dans contenu_
    T get() const { return contenu_; }  // getter const : renvoie le contenu
};
Boite&lt;int&gt; b(42);                 // crée une Boite d'int contenant 42 (T = int)
Boite&lt;std::string&gt; s("Catan");    // crée une Boite de texte contenant "Catan" (T = std::string)</pre>
<p>Une classe template se paramètre par un ou plusieurs types. <code>std::vector&lt;T&gt;</code> (liste) et <code>std::map&lt;K, V&gt;</code> (table d'association) sont exactement cela : des classes templates.</p>

<h3>3. Pourquoi c'est puissant</h3>
<div class="warn">Sans template, il faudrait écrire <code>maximum</code> une fois pour <code>int</code>, une autre pour <code>double</code>, etc. : de la duplication pénible et source d'erreurs. Le template écrit le code <strong>une seule fois</strong> et le compilateur le spécialise pour chaque type. Toute la STL (les conteneurs et les algorithmes) est bâtie sur les templates.</div>

<h3>4. Plusieurs paramètres et contraintes</h3>
<pre class="pseudo">template &lt;typename K, typename V&gt;     // deux types paramétrés : K (clé) et V (valeur)
struct Paire { K cle; V valeur; };    // une structure qui associe une clé et une valeur
Paire&lt;int, std::string&gt; p{1, "Catan"};  // crée une paire (K = int, V = std::string) : cle = 1, valeur = "Catan"</pre>
<p>On peut avoir plusieurs paramètres de type. Attention : le type fourni doit <strong>supporter les opérations utilisées</strong> dans le template (par exemple l'opérateur <code>&gt;</code> pour <code>maximum</code>) ; sinon, le compilateur signale une erreur.</p>

<h3>5. Templates et en-têtes</h3>
<div class="tip">Comme le compilateur doit voir le code complet du template pour le spécialiser, on écrit généralement les templates <strong>entièrement dans les fichiers d'en-tête .h</strong> (on ne sépare pas .h/.cpp comme d'habitude). Les templates sont spécialisés à la <strong>compilation</strong>, pas à l'exécution : ils n'ajoutent donc aucun coût quand le programme tourne.</div>`,
  exercises: [
    { type: "qcm", q: "Un template permet…", opts: ["d'accélérer l'exécution", "d'écrire du code générique valable pour plusieurs types", "de trier", "de compiler moins"], a: 1, exp: "Un patron paramétré par un type." },
    { type: "qcm", q: "Comment déclare-t-on une fonction template ?", opts: ["generic T f()", "template <typename T> T f(...)", "auto f()", "T::f()"], a: 1, exp: "template <typename T>." },
    { type: "qcm", q: "Que fait le compilateur avec <code>maximum(3, 5)</code> ?", opts: ["rien", "génère une version int de maximum", "l'exécute deux fois", "une erreur"], a: 1, exp: "Instanciation pour T = int." },
    { type: "qcm", q: "std::vector<T> est…", opts: ["une fonction", "une classe template", "un int", "une macro"], a: 1, exp: "Conteneur générique." },

    { type: "qcm", q: "Si T ne supporte pas l'opération utilisée (ex. >)…", opts: ["ça marche quand même", "erreur de compilation", "ça plante à l'exécution", "T devient int"], a: 1, exp: "Le type doit supporter les opérations." },
    { type: "vf", q: "Toute la STL (conteneurs, algorithmes) repose sur les templates.", a: true, exp: "vector, map, sort… sont génériques." },
    { type: "qcm", q: "typename T désigne…", opts: ["une variable", "un paramètre de type", "une classe fixe", "une fonction"], a: 1, exp: "Le type est fourni à l'usage." },

    { type: "qcm", q: "Un template de classe se paramètre par…", opts: ["rien", "un ou plusieurs types", "un int obligatoire", "une macro"], a: 1, exp: "template <typename T> class ..." },
    { type: "qcm", q: "L'avantage principal des templates :", opts: ["moins de sécurité", "réutilisation générique sans duplication ni surcoût", "plus lent", "plus de fichiers"], a: 1, exp: "Écrire une fois, utiliser partout." }
  ],
  final: {
    title: "Exercice final — Une fonction générique",
    intro: `<p>On veut une fonction <code>afficherTout</code> pour n'importe quel vector. Analyse :</p>
<pre class="pseudo">void afficherTout(std::vector&lt;int&gt; v) {         // PROBLÈME : figée sur vector&lt;int&gt; ET copiée par valeur
    for (int x : v) std::cout &lt;&lt; x &lt;&lt; " ";       // affiche chaque entier suivi d'une espace
}
// mais on veut aussi l'utiliser pour vector&lt;double&gt;, vector&lt;string&gt;... → il faut un template</pre>`,
    questions: [
      { type: "qcm", q: "Le problème :", opts: ["aucun", "la fonction ne marche que pour vector<int> : il faut la rendre générique", "trop rapide", "rien"], a: 1, exp: "Un template évite d'écrire une version par type." },
      { type: "qcm", q: "Comment la rendre générique ?", opts: ["copier-coller pour chaque type", "template <typename T> void afficherTout(const std::vector<T>& v)", "auto", "un cast"], a: 1, exp: "Paramétrer par T." },
      { type: "qcm", q: "Pourquoi passer le vector en const& ?", opts: ["c'est imposé par la syntaxe des templates", "éviter de copier tout le vector (lecture seule)", "pour pouvoir trier le vector", "pour autoriser sa modification"], a: 1, exp: "Efficacité." },
      { type: "qcm", q: "Où mettre ce template ?", opts: ["dans un .cpp", "dans un .h (visible à la compilation)", "dans le Makefile", "nulle part"], a: 1, exp: "Le compilateur doit voir le code." },
      { type: "qcm", q: "Le coût à l'exécution du template :", opts: ["élevé", "nul", "double", "imprévisible"], a: 1, exp: "Spécialisation à la compilation." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                            // pour std::cout (afficher)
#include &lt;vector&gt;                              // pour std::vector (le tableau dynamique)
#include &lt;string&gt;                              // pour std::string (le texte)

template &lt;typename T&gt;                          // rend la fonction générique (type paramétré T)
void afficherTout(const std::vector&lt;T&gt;&amp; v) {   // const& : le vector n'est pas copié (lecture seule)
    for (const auto&amp; x : v) std::cout &lt;&lt; x &lt;&lt; " ";  // affiche chaque élément suivi d'une espace
    std::cout &lt;&lt; "\\n";                         // va à la ligne à la fin
}

int main() {                                   // point d'entrée du programme
    afficherTout(std::vector&lt;int&gt;{1, 2, 3});               // instancie la version int
    afficherTout(std::vector&lt;std::string&gt;{"Catan", "Uno"}); // instancie la version std::string
    return 0;                                  // 0 = fin sans erreur
}</pre>
<p>Un seul template couvre <code>int</code>, <code>double</code>, <code>string</code>… sans duplication ni coût à l'exécution. Demain : la STL — <code>map</code>, <code>set</code> et itérateurs.</p>`
  }
};
