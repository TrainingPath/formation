<script>
var DAY = {
  num: 10,
  title: "Constructeurs, RAII et destructeur",
  subtitle: "Garantir qu'un objet naît valide et se nettoie tout seul : le cœur de la sûreté du C++.",
  theory: `
<h3>1. Le constructeur</h3>
<p>Un <strong>constructeur</strong> est une méthode spéciale qui s'exécute <strong>automatiquement à la naissance de l'objet</strong> pour remplir ses attributs. Il porte exactement le nom de la classe et n'a pas de type de retour.</p>
<pre class="pseudo">class Jeu {                      // classe Jeu
    std::string nom_;            // attribut privé : le nom
    double prix_;                // attribut privé : le prix
    int stock_;                  // attribut privé : le stock
public:                          // interface publique
    Jeu(std::string nom, double prix, int stock)      // constructeur : même nom que la classe ; reçoit les valeurs de départ
        : nom_(nom), prix_(prix), stock_(stock) {}    // liste d'initialisation (après :) : copie chaque paramètre dans l'attribut correspondant
};                               // ; final de la classe</pre>
<p>Le <strong>constructeur</strong> porte le nom de la classe et s'exécute à la création de l'objet. La <strong>liste d'initialisation</strong> (la partie après le <code>:</code>) donne sa valeur de départ à chaque attribut. Un objet correctement construit est <strong>toujours valide</strong> dès le premier instant.</p>

<h3>2. Créer un objet</h3>
<pre class="pseudo">Jeu catan("Catan", 44.90, 3);   // crée l'objet catan en appelant le constructeur avec ces 3 valeurs
Jeu uno{"Uno", 12.50, 10};      // même chose avec l'initialisation moderne par accolades { }</pre>

<h3>3. RAII : la ressource suit la vie de l'objet</h3>
<p>Une <strong>ressource</strong> est quelque chose que le programme emprunte au système et doit rendre : de la mémoire, un fichier ouvert, une connexion réseau… <strong>RAII</strong> (<em>Resource Acquisition Is Initialization</em>, « acquérir la ressource, c'est initialiser ») est le grand principe du C++ : un objet <strong>acquiert</strong> sa ressource dans son constructeur et la <strong>libère</strong> automatiquement quand il est détruit. Un <code>std::vector</code>, une <code>std::string</code>, un <code>std::ifstream</code> (fichier) se nettoient donc tout seuls dès qu'on sort de leur <strong>portée</strong> (le bloc <code>{ }</code> où ils vivent).</p>

<h3>4. Le destructeur</h3>
<p>Le <strong>destructeur</strong> est la méthode symétrique du constructeur : elle s'exécute automatiquement à la <strong>mort</strong> de l'objet, pour faire le ménage. Son nom est le tilde <code>~</code> suivi du nom de la classe.</p>
<pre class="pseudo">class Fichier {                  // classe qui gère un fichier
    std::ofstream f_;            // attribut : un flux de fichier en écriture (ressource)
public:
    Fichier(std::string nom) : f_(nom) {}          // constructeur : OUVRE le fichier nommé "nom"
    ~Fichier() { std::cout &lt;&lt; "fermeture\\n"; }     // destructeur (~ + nom) : appelé à la mort de l'objet pour nettoyer
};
// à la fin de la portée { }, ~Fichier() est appelé AUTOMATIQUEMENT (on n'a rien à écrire)</pre>
<div class="warn">Le <strong>destructeur</strong> (<code>~Classe()</code>) s'exécute quand l'objet est détruit (fin de sa portée, ou lors d'un <code>delete</code>). Grâce au RAII, on n'oublie jamais de libérer une ressource : plus besoin des <code>free</code> (mémoire) et <code>fclose</code> (fichiers) manuels du C, source classique de bugs.</div>

<h3>5. Constructeur par défaut</h3>
<p>Le <strong>constructeur par défaut</strong> est celui qu'on peut appeler sans lui donner aucun argument.</p>
<pre class="pseudo">class Jeu {
public:
    Jeu() = default;                       // = default : demande au compilateur de générer le constructeur sans argument
    Jeu(std::string nom) : nom_(nom) {}    // un autre constructeur, qui reçoit un nom
};</pre>
<div class="tip">Si tu ne définis aucun constructeur, le compilateur en fournit un par défaut gratuitement. Mais dès que tu en écris un toi-même, tu dois fournir explicitement les autres dont tu as besoin (par exemple avec <code>= default</code>). RAII + constructeur/destructeur = gestion automatique et sûre des ressources : c'est LA force du C++ moderne.</div>`,
  exercises: [
    { type: "qcm", q: "Le constructeur porte…", opts: ["un nom libre", "le nom de la classe", "toujours init()", "le nom main"], a: 1, exp: "Il s'appelle comme la classe." },
    { type: "qcm", q: "Quand s'exécute le constructeur ?", opts: ["à la destruction", "à la création de l'objet", "jamais", "à l'affichage"], a: 1, exp: "Il initialise l'objet." },
    { type: "qcm", q: "La liste d'initialisation se place…", opts: ["dans le corps", "après : avant le { }", "après le }", "nulle part"], a: 1, exp: "Jeu(...) : a_(x), b_(y) {}." },
    { type: "qcm", q: "Que signifie RAII ?", opts: ["une boucle", "Resource Acquisition Is Initialization", "un type", "une erreur"], a: 1, exp: "La ressource suit la vie de l'objet." },
    { type: "qcm", q: "Le destructeur s'écrit…", opts: ["!Classe()", "~Classe()", "delete Classe()", "end()"], a: 1, exp: "Le tilde ~ + nom de classe." },
    { type: "qcm", q: "Quand s'exécute le destructeur ?", opts: ["jamais", "à la destruction de l'objet (fin de portée, delete)", "à la création", "au compile"], a: 1, exp: "Nettoyage automatique." },
    { type: "qcm", q: "Grâce au RAII, on n'oublie jamais…", opts: ["de compiler", "de libérer une ressource", "d'afficher", "le main"], a: 1, exp: "free/fclose deviennent inutiles." },
    { type: "qcm", q: "Un objet correctement construit est…", opts: ["toujours vide", "toujours dans un état valide", "toujours const", "global"], a: 1, exp: "Le constructeur le garantit." },
    { type: "qcm", q: "std::vector et std::string se nettoient…", opts: ["à la main", "automatiquement (RAII) en fin de portée", "jamais", "avec free"], a: 1, exp: "Destructeur automatique." },
    { type: "qcm", q: "<code>Jeu() = default;</code> fournit…", opts: ["un destructeur", "un constructeur par défaut sans argument", "une méthode", "une erreur"], a: 1, exp: "Constructeur généré." },
    { type: "vf", q: "En C++ moderne, on doit appeler free/fclose manuellement comme en C.", a: false, exp: "Faux : le RAII s'en charge automatiquement." },
    { type: "qcm", q: "Si tu ne définis aucun constructeur…", opts: ["erreur", "le compilateur en fournit un par défaut", "l'objet est invalide", "il faut delete"], a: 1, exp: "Constructeur par défaut implicite." },
    { type: "qcm", q: "<code>Jeu uno{\"Uno\", 12.5, 10};</code> utilise…", opts: ["l'affectation", "l'initialisation par accolades (moderne)", "un cast", "une erreur"], a: 1, exp: "Appelle le constructeur." },
    { type: "qcm", q: "La force du C++ moderne pour les ressources :", opts: ["free manuel", "RAII : acquisition/libération automatiques", "variables globales", "aucune"], a: 1, exp: "Gestion sûre et automatique." },
    { type: "qcm", q: "Le destructeur permet de…", opts: ["créer l'objet", "libérer les ressources à la destruction", "copier", "trier"], a: 1, exp: "Nettoyage garanti." }
  ],
  final: {
    title: "Exercice final — Construire un Jeu",
    intro: `<p>On donne un constructeur à Jeu. Analyse :</p>
<pre class="pseudo">class Jeu {                              // classe Jeu
    std::string nom_;                    // attribut privé : le nom
    int stock_;                          // attribut privé : le stock
public:
    Jeu(std::string nom, int stock) {    // constructeur
        nom = nom_;                      // ERREUR : affectation INVERSÉE — on écrit dans le paramètre nom, pas dans l'attribut nom_
        stock = stock_;                  // ERREUR : même inversion (et nom_/stock_ ne sont jamais initialisés)
    }
};</pre>`,
    questions: [
      { type: "qcm", q: "Erreur — <code>nom = nom_;</code> :", opts: ["correct", "affectation inversée : on écrit dans le paramètre, pas l'attribut", "il faut ->", "rien"], a: 1, exp: "Il faudrait nom_ = nom; (ou mieux, la liste d'init)." },
      { type: "qcm", q: "Meilleure façon d'initialiser les attributs :", opts: ["dans le corps par affectation", "la liste d'initialisation : Jeu(...) : nom_(nom), stock_(stock) {}", "en global", "impossible"], a: 1, exp: "Plus efficace et clair." },
      { type: "qcm", q: "Le constructeur garantit que Jeu…", opts: ["est vide", "naît dans un état valide", "est const", "n'existe pas"], a: 1, exp: "Objet toujours cohérent." },
      { type: "qcm", q: "Un std::string membre se libère…", opts: ["à la main", "automatiquement (RAII) à la destruction du Jeu", "jamais", "avec free"], a: 1, exp: "Destructeur automatique." },
      { type: "qcm", q: "Comment créer un Jeu ensuite ?", opts: ["Jeu j;", "Jeu j(\"Catan\", 3);", "Jeu j = 3;", "new Jeu"], a: 1, exp: "Appel du constructeur." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                        // pour std::cout (afficher)
#include &lt;string&gt;                          // pour std::string (le texte)

class Jeu {                                // classe Jeu
    std::string nom_;                      // attribut privé : le nom
    int stock_;                            // attribut privé : le stock
public:
    Jeu(std::string nom, int stock)        // constructeur : reçoit les valeurs de départ
        : nom_(nom), stock_(stock) {}      // liste d'initialisation : remplit nom_ et stock_ dans le bon sens
    void afficher() const {                // méthode de lecture (const)
        std::cout &lt;&lt; nom_ &lt;&lt; " (stock " &lt;&lt; stock_ &lt;&lt; ")\\n";  // affiche le nom et le stock
    }
};                                         // ; final de la classe

int main() {                               // point d'entrée du programme
    Jeu catan("Catan", 3);                 // crée un Jeu via le constructeur
    catan.afficher();                      // affiche : Catan (stock 3)
    return 0;                              // à ce return : ~Jeu() et ~string() sont appelés AUTOMATIQUEMENT (RAII)
}</pre>
<p>La liste d'initialisation remplit les attributs proprement, et le RAII libère tout à la fin sans un seul <code>free</code>. Demain : la copie et le passage par référence.</p>`
  }
};
</script>

    hints: [
      "Jeu(std::string nom, double prix, int stock) : nom_(nom), prix_(prix), stock_(stock) {}",

    ],
    solution: "#include <iostream>                            // pour std::cout (afficher)\n#include <string>                              // pour std::string (le texte)\n\nclass Jeu {                                    // classe Jeu\n    std::string nom_;                          // attribut prive : le nom\n    double prix_;                              // attribut prive : le prix\n    int stock_;                                // attribut prive : le stock\npublic:                                        // interface publique\n    Jeu(std::string nom, double prix, int stock)   // constructeur\n        : nom_(nom), prix_(prix), stock_(stock) {} // liste d'initialisation : remplit les 3 attributs\n    void reapprovisionner(int n) { stock_ += n; }  // ajoute n au stock (modifie -> pas const)\n    void afficher() const {                    // methode de lecture (const)\n        std::cout << nom_ << \" : \" << prix_ << \" (stock \" << stock_ << \")\\n\";  // affiche nom, prix, stock\n    }\n};                                             // ; final de la classe\n\nint main() {                                   // point d'entree du programme\n    Jeu catan(\"Catan\", 44.90, 3);              // cree un Jeu via le constructeur\n    catan.reapprovisionner(5);                 // stock passe de 3 a 8\n    catan.afficher();                          // affiche Catan : 44.9 (stock 8)\n    return 0;                                  // 0 = fin ; ~Jeu() appele automatiquement (RAII)\n}",
    note: "La liste d'initialisation (: nom_(nom), ...) remplit les attributs à la construction : le Jeu naît valide. reapprovisionner modifie donc n'est pas const ; afficher lit donc l'est. Le RAII libère tout à la fin." }
  ]
};
