<h3>Récapitulatif du parcours</h3>
<p>Avant l'épreuve, voici la carte des 20 leçons franchies. Chaque ligne rappelle un concept-clé déjà défini : par exemple <code>cout</code> (l'écran), <code>auto</code> (le type deviné), le <strong>for-range</strong> (parcourir une collection), la <strong>STL</strong> (la boîte à outils standard), le <strong>RAII</strong> (le nettoyage automatique des ressources), les <strong>templates</strong> (le code générique), etc. Relis chaque terme dont le sens ne te revient pas immédiatement.</p>
<pre class="pseudo">Semaine 1 — Bases et STL
  1 cout, compilation      2 types, auto      3 références, const

Semaine 2 — Objets et généricité

Semaine 3 — STL avancée et vrais programmes

<div class="warn">Après cet examen, compare avec le cours <strong>C++ bas niveau</strong> pour voir ce que la STL et le RAII t'épargnent — puis attaque la suite du parcours : bases de données, projet full-stack et projet outillé, où tu réutiliseras ces classes.</div>`,
  exercises: [

  final: {
    title: "Épreuve finale — Lire et comprendre",
    intro: `<p>Analyse ce programme qui calcule la moyenne de prix saisis :</p>
<pre class="pseudo">#include &lt;iostream&gt;                                   // pour std::cin et std::cout
#include &lt;vector&gt;                                     // pour std::vector (la liste des prix)
#include &lt;numeric&gt;                                    // pour std::accumulate (la somme)

int main() {                                          // point d'entrée du programme
    int n;                                            // nombre de prix à saisir
    std::cout &lt;&lt; "Combien de prix ? ";                // invite
    std::cin &gt;&gt; n;                                    // lit n (ATTENTION : aucune vérification de la saisie)
    std::vector&lt;double&gt; prix(n);                      // crée un vector de n doubles, tous à 0 au départ
    for (auto&amp; p : prix) std::cin &gt;&gt; p;              // auto& : remplit CHAQUE élément avec une valeur lue au clavier
    double somme = std::accumulate(prix.begin(), prix.end(), 0.0);  // additionne tous les prix (départ 0.0 → résultat double)
    std::cout &lt;&lt; "Moyenne : " &lt;&lt; somme / prix.size() &lt;&lt; "\\n";  // affiche la moyenne = somme / nombre d'éléments

}</pre>`,

    solution: `<pre class="pseudo">#include &lt;iostream&gt;                                   // pour std::cin et std::cout
#include &lt;vector&gt;                                     // pour std::vector (la liste des prix)
#include &lt;numeric&gt;                                    // pour std::accumulate (la somme)

int main() {                                          // point d'entrée du programme
    int n;                                            // nombre de prix à saisir
    std::cout &lt;&lt; "Combien de prix ? ";                // invite
    if (!(std::cin &gt;&gt; n) || n &lt;= 0) return 1;         // saisie VALIDÉE : échec de lecture OU n non positif → on quitte (évite la division par 0)
    std::vector&lt;double&gt; prix(n);                      // crée un vector de n doubles (à 0)
    for (auto&amp; p : prix)                             // auto& : parcourt chaque élément par référence pour le remplir
        if (!(std::cin &gt;&gt; p)) return 1;               // lit ET vérifie chaque prix ; saisie invalide → on quitte
    double somme = std::accumulate(prix.begin(), prix.end(), 0.0);  // additionne tous les prix (départ 0.0)
    std::cout &lt;&lt; "Moyenne : " &lt;&lt; somme / prix.size() &lt;&lt; "\\n";  // affiche la moyenne
    return 0;                                         // 0 = fin sans erreur
}</pre>
<p>Presque juste : il manquait la validation des saisies (et <code>n &gt; 0</code>). Le programme illustre le style moderne — <code>vector</code>, <code>accumulate</code>, aucune gestion mémoire manuelle. Félicitations, tu maîtrises le C++ moderne ! Bon courage pour la suite du parcours.</p>`

var ECRITURE = {

  { id: "cppm-l21", title: "Synthèse — statistiques du catalogue", level: 3,
    statement: "Écris une classe Jeu (nom, prix) et une fonction libre qui, à partir d'un std::vector<Jeu>, affiche le prix moyen (std::accumulate) et le nom du jeu le plus cher (std::max_element avec une lambda). Programme complet et compilable.",
    hints: [
      "std::accumulate(v.begin(), v.end(), 0.0, [](double s, const Jeu& j){ return s + j.prix(); }).",
      "std::max_element(v.begin(), v.end(), [](const Jeu& a, const Jeu& b){ return a.prix() < b.prix(); }).",
      "max_element renvoie un itérateur : ->nom()."
    ],
    solution: "#include <iostream>                            // pour std::cout (afficher)\n#include <vector>                              // pour std::vector (le catalogue)\n#include <string>                              // pour std::string (le nom)\n#include <numeric>                             // pour std::accumulate (la somme)\n#include <algorithm>                           // pour std::max_element (le plus grand)\n\nclass Jeu {                                    // classe representant un jeu\n    std::string nom_; double prix_;            // attributs prives : nom et prix\npublic:                                        // interface publique\n    Jeu(std::string n, double p) : nom_(n), prix_(p) {}  // constructeur : initialise nom et prix\n    const std::string& nom() const { return nom_; }      // getter const : nom sans copie\n    double prix() const { return prix_; }      // getter const : renvoie le prix\n};                                             // ; final de la classe\n\nvoid stats(const std::vector<Jeu>& cat) {      // cat en const& : pas de copie\n    if (cat.empty()) return;                   // securite : rien a calculer si le catalogue est vide\n    double somme = std::accumulate(cat.begin(), cat.end(), 0.0,   // additionne les prix en partant de 0.0...\n                     [](double s, const Jeu& j) { return s + j.prix(); });  // ...la lambda ajoute le prix de chaque jeu\n    std::cout << \"Moyenne : \" << somme / cat.size() << \"\\n\";      // moyenne = somme / nombre de jeux\n    auto cher = std::max_element(cat.begin(), cat.end(),          // cherche le jeu de prix maximal...\n                  [](const Jeu& a, const Jeu& b) { return a.prix() < b.prix(); });  // ...critere : compare les prix\n    std::cout << \"Le plus cher : \" << cher->nom() << \"\\n\";        // cher est un iterateur : ->nom() donne le nom du plus cher\n}\n\nint main() {                                   // point d'entree du programme\n    std::vector<Jeu> cat = { {\"Catan\",44.90}, {\"Uno\",12.50}, {\"Risk\",39.0} };  // catalogue de 3 jeux\n    stats(cat);                                // affiche moyenne et jeu le plus cher\n    return 0;                                  // 0 = fin sans erreur\n}",
    note: "Cette synthèse réunit classe encapsulée, std::vector, passage en const&, et les algorithmes STL (accumulate, max_element) avec lambdas. Aucun new/delete : c'est le C++ moderne dans toute son expressivité. Bravo d'être arrivée au bout !" }
  ]
