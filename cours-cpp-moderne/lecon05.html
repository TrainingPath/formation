  theory: `
<h3>1. Qu'est-ce qu'une « condition » ?</h3>
<p>Un <strong>programme</strong> est une liste d'<strong>instructions</strong> (des ordres) que l'ordinateur exécute une par une, de haut en bas. Une <strong>condition</strong> permet de <strong>choisir</strong> quelles instructions exécuter selon la situation : « <em>si</em> le stock est vide, <em>alors</em> afficher Rupture, <em>sinon</em> afficher autre chose ». C'est un aiguillage : selon la réponse (vrai ou faux) à une question, le programme prend un chemin ou un autre.</p>
<p>Avant de lire le code, définissons les mots qui reviennent tout le temps. <code>std::cout</code> représente l'<strong>écran</strong> (la « sortie standard », <em>cout</em> = <em>character output</em>) : écrire dedans, c'est afficher. L'opérateur <code>&lt;&lt;</code> signifie « envoyer vers » : <code>std::cout &lt;&lt; "Bonjour"</code> se lit « envoie le texte Bonjour vers l'écran ». Les guillemets <code>"..."</code> délimitent un <strong>texte</strong> (une « chaîne de caractères »). <code>\\n</code> est un caractère spécial voulant dire « aller à la ligne » (comme la touche Entrée). Enfin, le point-virgule <code>;</code> marque la <strong>fin d'une instruction</strong>, comme le point à la fin d'une phrase.</p>

<h4>a) if / else if / else</h4>
<pre class="pseudo">if (stock == 0)      std::cout &lt;&lt; "Rupture\\n";   // SI la variable stock vaut 0 : afficher "Rupture" puis aller à la ligne
else if (stock &lt; 5)  std::cout &lt;&lt; "Faible\\n";    // SINON SI stock est plus petit que 5 : afficher "Faible"
else                 std::cout &lt;&lt; "Ok\\n";        // SINON (tous les autres cas) : afficher "Ok"</pre>
<p><code>if</code> veut dire « si ». Entre parenthèses se trouve la <strong>question</strong> (la condition), qui vaut soit <em>vrai</em> soit <em>faux</em>. <code>stock == 0</code> demande « la variable <code>stock</code> est-elle égale à 0 ? » — une <strong>variable</strong> étant une case mémoire nommée qui contient une valeur. Si la réponse est vraie, la ligne s'exécute. <code>else if</code> (« sinon si ») pose une seconde question, uniquement si la première était fausse. <code>else</code> (« sinon ») attrape tout le reste. Au final, <strong>une seule</strong> des trois lignes s'exécute.</p>
<div class="warn">Piège classique : <code>==</code> (deux signes égal) <strong>compare</strong> deux valeurs, alors que <code>=</code> (un seul) <strong>affecte</strong> (range une valeur dans une variable). Écrire <code>if (stock = 0)</code> est un bug : on rangerait 0 dans <code>stock</code> au lieu de le comparer.</div>

<h4>b) switch : choisir parmi plusieurs valeurs</h4>
<pre class="pseudo">switch (choix) {                                 // examine la valeur de la variable "choix"
    case 1: std::cout &lt;&lt; "Acheter\\n"; break;   // CAS où choix vaut 1 : afficher "Acheter", puis SORTIR du switch
    case 2: std::cout &lt;&lt; "Louer\\n";   break;   // CAS où choix vaut 2 : afficher "Louer", puis sortir
    default: std::cout &lt;&lt; "Inconnu\\n";         // AUCUN cas ne correspond : afficher "Inconnu"
}</pre>
<p><code>switch</code> compare une variable à plusieurs valeurs possibles, une par <code>case</code> (« cas ») : <code>case 1:</code> signifie « dans le cas où choix vaut 1 ». <code>break</code> veut dire « sortir du switch maintenant » ; sans lui, l'exécution « déborde » sur le cas suivant (un piège appelé <em>fall-through</em>). <code>default</code> est le cas par défaut, exécuté quand aucune valeur ne correspond. Les accolades <code>{ }</code> regroupent le contenu du switch en un bloc.</p>
<p>Les <strong>opérateurs logiques</strong> combinent des conditions : <code>&amp;&amp;</code> = « ET » (les deux doivent être vraies), <code>||</code> = « OU » (au moins une vraie), <code>!</code> = « NON » (inverse vrai et faux). Tout ceci est identique au langage C.</p>

<h3>2. Les boucles : répéter des instructions</h3>
<p>Une <strong>boucle</strong> répète un bloc d'instructions plusieurs fois sans avoir à le recopier. La boucle <code>for</code> réunit sur une seule ligne trois éléments séparés par <code>;</code> : la préparation, la condition de continuation, et l'évolution du compteur.</p>
<pre class="pseudo">for (int i = 0; i &lt; 5; ++i)          // i démarre à 0 ; on continue TANT QUE i < 5 ; après chaque tour ++i ajoute 1 à i
    std::cout &lt;&lt; i &lt;&lt; " ";           // afficher i puis une espace   →   0 1 2 3 4</pre>
<p><code>int i = 0</code> crée un <strong>compteur</strong> <code>i</code> (un entier, <em>int</em> = <em>integer</em>) valant 0 au départ. <code>i &lt; 5</code> est la condition testée avant chaque tour (« i est-il plus petit que 5 ? »). <code>++i</code> ajoute 1 à <code>i</code> à la fin de chaque tour. Quand la condition devient fausse (i atteint 5), la boucle s'arrête. Elle tourne donc 5 fois : i = 0, 1, 2, 3, 4.</p>
<pre class="pseudo">int i = 0;                            // on crée le compteur AVANT la boucle
while (i &lt; 5) {                       // TANT QUE i est plus petit que 5, répéter le bloc entre { }
    std::cout &lt;&lt; i;                   // afficher i
    ++i;                             // ajouter 1 à i (sinon la boucle ne s'arrêterait JAMAIS)
}</pre>
<p><code>while</code> (« tant que ») répète tant que sa condition reste vraie. Il faut penser à faire évoluer cette condition (ici <code>++i</code>), sinon la boucle tourne à l'infini et le programme se fige. <code>++i</code> veut dire « augmenter i de 1 » ; en C++ on le préfère souvent à <code>i++</code> : les deux ajoutent 1, mais <code>++i</code> évite une copie inutile — un détail sans effet sur un simple entier, mais utile pour des objets plus lourds (les « itérateurs », vus plus tard).</p>

<h3>3. La boucle for-range : parcourir une collection</h3>
<p>Un <code>std::vector</code> est une <strong>liste</strong> de valeurs rangées les unes à la suite des autres. Le mot <code>double</code> désigne un nombre <strong>à virgule</strong> (comme 44.90). Ainsi <code>std::vector&lt;double&gt;</code> se lit « une liste de nombres à virgule ».</p>
<pre class="pseudo">std::vector&lt;double&gt; prix = {44.90, 12.50, 39.0};  // crée une liste nommée "prix" contenant 3 nombres
for (double p : prix)                             // POUR CHAQUE élément (appelé p) DANS la liste prix…
    std::cout &lt;&lt; p &lt;&lt; " ";                        // …afficher ce prix suivi d'une espace</pre>
<p>Cette forme se lit « pour chaque <code>p</code> dans <code>prix</code> ». À chaque tour, <code>p</code> prend la valeur d'un élément de la liste, du premier au dernier. On ne manipule aucun numéro de case : impossible de se tromper de position ou de « déborder » (sortir de la liste). C'est la <strong>boucle for-range</strong> (apparue avec la version C++11), la façon recommandée — on dit « idiomatique » — de parcourir un <code>vector</code>, une chaîne de caractères, une table d'association, etc.</p>

<h3>4. Copier ou agir sur l'original ? (la référence &amp;)</h3>
<pre class="pseudo">for (auto&amp; p : prix)       p *= 1.05;             // auto& = RÉFÉRENCE : p EST l'élément original → on le MODIFIE (+5 %)
for (const auto&amp; p : prix) std::cout &lt;&lt; p;       // const auto& = référence en LECTURE seule (aucune copie)</pre>
<p>Par défaut, <code>for (double p : prix)</code> travaille sur une <strong>copie</strong> de chaque élément : modifier <code>p</code> ne change pas la liste d'origine. Le symbole <code>&amp;</code> transforme <code>p</code> en <strong>référence</strong>, c'est-à-dire un autre nom pour l'élément original — le modifier modifie donc la vraie liste. Le mot <code>auto</code> demande au compilateur de <strong>deviner le type tout seul</strong> (ici <code>double</code>). <code>const</code> veut dire « constant » : on promet de seulement <em>lire</em>, pas de modifier — idéal pour parcourir de gros objets sans les recopier. Enfin, <code>p *= 1.05</code> est un raccourci pour <code>p = p * 1.05</code> (multiplier par 1,05, soit +5 %).</p>
<div class="warn">Règle simple : <code>auto&amp;</code> quand tu veux <strong>modifier</strong> les éléments ; <code>const auto&amp;</code> quand tu veux seulement <strong>lire</strong> de gros objets sans les copier. Pour de petits types comme <code>int</code> ou <code>double</code>, copier ne coûte rien.</div>

<h3>5. Interrompre une boucle : break et continue</h3>
<pre class="pseudo">for (double p : prix) {          // pour chaque prix p de la liste
    if (p &gt; 100) continue;       // s'il dépasse 100 : IGNORER ce tour et passer directement au prix suivant
    if (p &lt; 0)   break;          // s'il est négatif : SORTIR complètement de la boucle
    std::cout &lt;&lt; p;              // sinon : afficher le prix
}</pre>
<p><code>continue</code> saute le reste du tour courant et passe à l'élément suivant ; <code>break</code> arrête complètement la boucle. Pour choisir sa boucle : le <code>for</code> classique quand on a besoin d'un numéro de case, la <strong>for-range</strong> pour parcourir une collection (le cas le plus fréquent), et <code>while</code>/<code>do-while</code> quand on répète selon une condition dont on ignore le nombre de tours.</p>
<h3>Aller plus loin — pré-incrément (++i) et post-incrément (i++)</h3>
<p>Les deux écritures ajoutent 1 à la variable ; la différence n'apparaît que lorsqu'on <strong>lit la valeur au moment même</strong> de l'incrémentation. La formule à retenir : <code>i++</code> « donne sa valeur, PUIS grandit » ; <code>++i</code> « grandit, PUIS donne sa valeur ».</p>
<pre class="pseudo">int a = 5;        // a vaut 5
int b = a++;      // POST-increment : b prend l'ANCIENNE valeur -> b = 5, et ENSUITE a passe a 6
int c = 5;        // c vaut 5
int d = ++c;      // PRE-increment : c passe d'abord a 6, PUIS d prend la NOUVELLE valeur -> d = 6</pre>
<p>Dans une boucle <code>for (i = 0; i &lt; 5; i++)</code>, on ne lit pas le résultat de <code>i++</code> : on veut seulement « ajouter 1 ». C'est pourquoi <code>i++</code> et <code>++i</code> y donnent exactement la même boucle et sont interchangeables.</p>
<h3>Inverser une condition proprement — les lois de De Morgan</h3>
<p>Pour obtenir le CONTRAIRE d'une condition composée, on ne peut pas juste coller un <code>!</code> devant sans réfléchir. Les <strong>lois de De Morgan</strong> disent comment le NON « rentre » dans la parenthèse : il inverse chaque morceau ET échange <code>&amp;&amp;</code> (ET) avec <code>||</code> (OU).</p>
<pre class="pseudo">!(a &amp;&amp; b)      // NON (A ET B)...
  =  !a || !b     // ...devient (NON A) OU (NON B)
!(a || b)      // NON (A OU B)...
  =  !a &amp;&amp; !b     // ...devient (NON A) ET (NON B)</pre>
<p>Exemple : l'inverse de « la note est valide » <code>note &gt;= 0 &amp;&amp; note &lt;= 20</code> n'est PAS <code>note &gt;= 0 || note &lt;= 20</code>, mais <code>note &lt; 0 || note &gt; 20</code> (« en dessous de 0 OU au-dessus de 20 »). Chaque comparaison s'inverse, et le ET devient OU.</p>`,

<p>Le for-range copie par défaut : <code>auto&amp;</code> pour modifier, <code>const auto&amp;</code> pour lire. Demain : <code>std::string</code> en détail.</p>`
