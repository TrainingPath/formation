  title: "Les exceptions",
  subtitle: "Signaler une erreur et la traiter là où on sait réagir, sans polluer le code normal.",
  theory: `
<h3>1. Lancer une exception</h3>
<p>Une <strong>exception</strong> est un signal d'erreur : au lieu de continuer avec des données fausses, une fonction peut <strong>lancer</strong> (en anglais <em>throw</em>) une exception pour dire « stop, quelque chose ne va pas ». L'exécution normale s'interrompt aussitôt.</p>
<pre class="pseudo">#include &lt;stdexcept&gt;                     // pour les types d'exception standard (invalid_argument, runtime_error...)

double tarif(double prixJour, int jours) {   // calcule un tarif
    if (jours &lt; 1)                            // SI la durée est absurde (moins d'un jour)...
        throw std::invalid_argument("jours doit etre >= 1");  // ...on LANCE une exception avec un message explicatif
    return prixJour * jours;                  // sinon (durée valide) : calcul normal
}</pre>
<p><code>throw</code> lance une <strong>exception</strong> : l'exécution s'interrompt et « remonte » la pile des appels jusqu'à un endroit qui sait la traiter (un <em>gestionnaire</em>). On lance des objets typés, le plus souvent de la famille <code>std::exception</code>.</p>

<h3>2. Attraper avec try / catch</h3>
<pre class="pseudo">try {                                   // bloc "try" : on tente du code qui PEUT échouer
    double t = tarif(5.0, 0);           // 0 jour → cette ligne va lancer une exception
    std::cout &lt;&lt; t;                     // (non atteint si l'exception est lancée au-dessus)
} catch (const std::exception&amp; e) {     // bloc "catch" : attrape l'exception ; e = l'objet exception (par const& = sans copie)
    std::cout &lt;&lt; "Erreur : " &lt;&lt; e.what() &lt;&lt; "\\n";  // e.what() = le message de l'erreur
}</pre>
<p>Le bloc <code>try</code> contient le code susceptible d'échouer ; le bloc <code>catch</code> réagit à l'échec. La méthode <code>e.what()</code> renvoie le message. On attrape par <code>const&amp;</code> pour éviter une copie de l'objet exception.</p>

<h3>3. Les exceptions standard</h3>
<pre class="pseudo">std::invalid_argument   // un argument fourni est invalide
std::out_of_range       // accès hors des bornes (ex. std::vector::at avec un mauvais indice)
std::runtime_error      // une erreur survenue pendant l'exécution
std::logic_error        // une erreur de logique dans le programme lui-même</pre>
<div class="warn">Toutes ces exceptions dérivent (par héritage) de <code>std::exception</code> : attraper <code>const std::exception&amp;</code> capture donc toute la famille d'un coup. On peut aussi définir ses propres classes d'exception en héritant de <code>std::exception</code>.</div>

<h3>4. Exceptions et RAII</h3>
<pre class="pseudo">void f() {                                 // une fonction
    auto j = std::make_unique&lt;Jeu&gt;(/*...*/);  // un objet local géré par un smart pointer (leçon 17)
    risque();                              // si cette fonction lance une exception...
}   // ...en remontant l'exception, j est QUAND MÊME libéré : son destructeur est appelé (RAII)</pre>
<p>C'est l'un des grands atouts du C++ : quand une exception remonte, tous les objets locaux sont <strong>correctement détruits</strong> (leurs destructeurs s'exécutent, leurs ressources sont libérées). Le RAII rend ainsi le code <em>exception-safe</em> (sûr face aux exceptions) sans effort particulier.</p>

<h3>5. Quand les utiliser ?</h3>
<div class="tip">Les exceptions conviennent aux erreurs <strong>exceptionnelles</strong> (un contrat rompu, une ressource indisponible), pas au flux normal du programme. Pour une saisie utilisateur banale, un simple test <code>if</code> suffit souvent. Bien utilisées, elles séparent nettement le code correct du code de gestion d'erreur.</div>`,
  exercises: [
    { type: "qcm", q: "Comment lance-t-on une exception ?", opts: ["raise", "throw", "error", "return"], a: 1, exp: "throw objet;." },

    { type: "qcm", q: "Toutes les exceptions standard dérivent de…", opts: ["std::error", "std::exception", "std::throw", "int"], a: 1, exp: "Attraper const std::exception& capture tout." },

    { type: "qcm", q: "Quel en-tête pour std::invalid_argument, runtime_error ?", opts: ["<exception>", "<stdexcept>", "<error>", "<throw>"], a: 1, exp: "#include <stdexcept>." },

    { type: "vf", q: "Grâce au RAII, une exception qui remonte libère les objets locaux.", a: true, exp: "Le C++ est exception-safe par le RAII." },
    { type: "qcm", q: "Les exceptions conviennent surtout…", opts: ["au flux normal", "aux erreurs exceptionnelles (contrat rompu, ressource absente)", "à l'affichage", "aux boucles"], a: 1, exp: "Pas pour une saisie banale." },
    { type: "qcm", q: "Le bloc try contient…", opts: ["la gestion d'erreur", "le code susceptible d'échouer", "les includes", "le main"], a: 1, exp: "catch gère l'échec." },
    { type: "qcm", q: "throw interrompt…", opts: ["rien", "l'exécution normale et remonte jusqu'à un catch", "le compilateur", "le fichier"], a: 1, exp: "Propagation de l'exception." },
    { type: "qcm", q: "Bien utilisées, les exceptions…", opts: ["mélangent tout", "séparent le code correct du code d'erreur", "ralentissent toujours", "sont inutiles"], a: 1, exp: "Clarté du flux." }
  ],
  final: {
    title: "Exercice final — Valider une durée",
    intro: `<p>On valide une durée. Analyse :</p>
<pre class="pseudo">double louer(double prixJour, int jours) {   // calcule le prix d'une location
    return prixJour * jours;                  // PROBLÈME : aucune validation de "jours"
}
int main() {                                  // programme principal
    louer(5.0, -3);                           // -3 jours n'a aucun sens : devrait être REFUSÉ, mais passe sans erreur
}</pre>`,
    questions: [
      { type: "qcm", q: "Le manque :", opts: ["aucun manque", "aucune validation : une durée négative passe", "il manque un return", "il manque un bloc catch"], a: 1, exp: "Il faut rejeter les valeurs invalides." },
      { type: "qcm", q: "Comment signaler l'erreur ?", opts: ["return -1 seulement", "throw std::invalid_argument(...)", "printf", "ignorer"], a: 1, exp: "Une exception typée." },
      { type: "qcm", q: "Où attraper cette exception ?", opts: ["nulle part", "dans un try/catch autour de l'appel", "dans louer", "au compile"], a: 1, exp: "Là où on sait réagir." },
      { type: "qcm", q: "On attrape avec…", opts: ["catch (std::exception e)", "catch (const std::exception& e)", "catch (int)", "if"], a: 1, exp: "const référence." },
      { type: "qcm", q: "e.what() sert à…", opts: ["relancer", "afficher le message d'erreur", "corriger", "trier"], a: 1, exp: "Description de l'erreur." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                             // pour std::cout (afficher)
#include &lt;stdexcept&gt;                            // pour std::invalid_argument

double louer(double prixJour, int jours) {      // calcule le prix d'une location
    if (jours &lt; 1)                              // validation : SI la durée est invalide...
        throw std::invalid_argument("jours doit etre >= 1");  // ...on lance une exception typée
    return prixJour * jours;                    // sinon : calcul normal
}

int main() {                                    // point d'entrée du programme
    try {                                       // on tente l'appel qui peut échouer
        std::cout &lt;&lt; louer(5.0, -3) &lt;&lt; "\\n";    // -3 jours → lance l'exception
    } catch (const std::exception&amp; e) {         // on l'attrape ici (par const&)
        std::cout &lt;&lt; "Erreur : " &lt;&lt; e.what() &lt;&lt; "\\n";  // affiche le message d'erreur
    }
    return 0;                                   // 0 = fin sans erreur
}</pre>
<p>On lance une exception typée quand le contrat est rompu, et on l'attrape là où on peut réagir. Le RAII garantit qu'aucune ressource ne fuit en chemin. Demain : lire et écrire des fichiers.</p>`
  }
};

    solution: "#include <iostream>                          // pour std::cout (afficher)\n#include <stdexcept>                         // pour invalid_argument et runtime_error\n\nvoid retirer(double& solde, double montant) {  // solde en reference : on le modifie\n    if (montant <= 0)                        // montant nul ou negatif : invalide\n        throw std::invalid_argument(\"montant invalide\");  // lance une exception d'argument\n    if (montant > solde)                     // pas assez d'argent\n        throw std::runtime_error(\"solde insuffisant\");    // lance une exception d'execution\n    solde -= montant;                        // tout est valide : on effectue le retrait\n}\n\nint main() {                                 // point d'entree du programme\n    double solde = 50.0;                     // solde de depart\n    try {                                    // on tente un retrait qui peut echouer\n        retirer(solde, 100.0);               // 100 > 50 -> lance runtime_error\n    } catch (const std::exception& e) {      // attrape toute la famille std::exception\n        std::cout << \"Erreur : \" << e.what() << \"\\n\";  // affiche le message\n    }\n    std::cout << \"Solde : \" << solde << \"\\n\";  // 50 : le retrait a ete refuse\n    return 0;                                // 0 = fin sans erreur\n}",
    note: "Deux types d'exception distinguent deux causes d'erreur ; toutes deux se rattrapent via const std::exception&. Le solde n'est modifié que si tout est valide : la fonction préserve la cohérence même en cas d'erreur." }
