<script>
var DAY = {
  num: 12,
  title: "Héritage et polymorphisme",
  subtitle: "Une classe qui en spécialise une autre, et des méthodes qui s'adaptent au type réel.",
  theory: `
<h3>1. L'héritage</h3>
<p>L'<strong>héritage</strong> permet de créer une nouvelle classe (dite <strong>dérivée</strong> ou « fille ») à partir d'une classe existante (dite <strong>de base</strong> ou « parente ») : la dérivée récupère automatiquement les attributs et méthodes de la base, et peut en ajouter. Analogie : « un Client EST UN Utilisateur, avec des spécificités en plus ».</p>
<pre class="pseudo">class Utilisateur {                              // classe de BASE (parente)
protected:                                       // protected = accessible à la classe ET à ses dérivées (mais pas au public)
    std::string nom_;                            // attribut : le nom
public:
    Utilisateur(std::string nom) : nom_(nom) {}  // constructeur de la base
    std::string nom() const { return nom_; }     // getter du nom (const : lecture seule)
};

class Client : public Utilisateur {              // Client HÉRITE de Utilisateur (: public Utilisateur)
public:
    Client(std::string nom) : Utilisateur(nom) {}   // le constructeur de Client appelle celui de la base pour initialiser nom_
};</pre>
<p><code>Client</code> <strong>hérite</strong> de <code>Utilisateur</code> : il reçoit ses attributs et méthodes. <code>protected</code> signifie « accessible aux classes dérivées, mais pas au code extérieur ». Le constructeur de la dérivée appelle celui de la base dans sa liste d'initialisation.</p>

<h3>2. Le polymorphisme et virtual</h3>
<p>Le <strong>polymorphisme</strong> (« plusieurs formes ») permet d'appeler, à travers une même interface, la version adaptée au <strong>type réel</strong> de l'objet. Il repose sur le mot-clé <code>virtual</code>.</p>
<pre class="pseudo">class Utilisateur {
public:
    virtual double remise() const { return 0.0; }   // virtual = cette méthode PEUT être redéfinie par une classe dérivée
    virtual ~Utilisateur() = default;               // destructeur VIRTUEL (indispensable, voir plus bas)
};
class Vendeur : public Utilisateur {
public:
    double remise() const override { return 0.10; } // override = Vendeur REDÉFINIT remise() (renvoie 10 % au lieu de 0 %)
};</pre>
<p>Une méthode <code>virtual</code> peut être <strong>redéfinie</strong> dans une classe dérivée. Quand on l'appelle à travers une <strong>référence ou un pointeur de la classe de base</strong>, c'est la version du <strong>type réel</strong> de l'objet qui s'exécute : c'est le <strong>polymorphisme</strong>.</p>

<h3>3. override et le destructeur virtuel</h3>
<pre class="pseudo">double remise() const override { /* ... */ }   // override : indique "je redéfinis une méthode virtuelle de la base"
virtual ~Utilisateur() = default;              // destructeur virtuel : OBLIGATOIRE dans une classe destinée à l'héritage</pre>
<div class="warn"><code>override</code> demande au compilateur de <strong>vérifier</strong> qu'on redéfinit bien une méthode virtuelle existante (il attrape ainsi les fautes de signature, comme un mauvais <code>const</code>). Une classe de base destinée à l'héritage <strong>doit</strong> avoir un <strong>destructeur virtuel</strong> : sinon, détruire un objet dérivé via un pointeur de base ne nettoierait pas correctement la partie dérivée (fuite de ressources).</div>

<h3>4. Le polymorphisme en action</h3>
<pre class="pseudo">void afficherRemise(const Utilisateur&amp; u) {        // reçoit N'IMPORTE quel Utilisateur (ou dérivé) par référence de base
    std::cout &lt;&lt; u.remise() * 100 &lt;&lt; " %\\n";       // appelle la BONNE version de remise() selon le type réel de u
}
Vendeur v("Ana");     // v est un Vendeur
afficherRemise(v);    // affiche 10 % : c'est bien la version de Vendeur qui est appelée (polymorphisme)</pre>

<h3>5. Redéfinir vs surcharger</h3>
<div class="tip">Ne pas confondre : <strong>surcharger</strong> = écrire plusieurs fonctions de même nom mais de signatures différentes (leçon 8) ; <strong>redéfinir</strong> (override) = une classe dérivée fournit sa propre version d'une méthode <code>virtual</code> de la base, avec la même signature. Le polymorphisme repose sur la redéfinition, pas sur la surcharge.</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce que l'héritage ?", opts: ["copier du code", "une classe qui reçoit attributs et méthodes d'une autre", "une boucle", "un template"], a: 1, exp: "Client : public Utilisateur." },
    { type: "qcm", q: "Le mot-clé pour une méthode redéfinissable :", opts: ["static", "virtual", "const", "final"], a: 1, exp: "virtual autorise la redéfinition." },
    { type: "qcm", q: "Qu'est-ce que le polymorphisme ?", opts: ["copier un objet", "appeler la version du type réel via une référence/pointeur de base", "trier", "compiler"], a: 1, exp: "La bonne méthode selon le type réel." },
    { type: "qcm", q: "À quoi sert <code>override</code> ?", opts: ["à accélérer", "à vérifier qu'on redéfinit bien une méthode virtuelle", "à supprimer", "à copier"], a: 1, exp: "Sécurité de redéfinition." },
    { type: "qcm", q: "protected signifie…", opts: ["accessible de partout", "accessible à la classe et à ses dérivées", "privé strict", "public"], a: 1, exp: "Pour l'héritage." },
    { type: "qcm", q: "Une classe de base à hériter doit avoir…", opts: ["un constructeur privé", "un destructeur virtuel", "aucune méthode", "un template"], a: 1, exp: "virtual ~Base() sinon fuite/nettoyage partiel." },
    { type: "qcm", q: "Le constructeur d'une dérivée…", opts: ["ignore la base", "appelle le constructeur de la base", "est interdit", "est virtuel"], a: 1, exp: "Client(nom) : Utilisateur(nom)." },
    { type: "qcm", q: "Le polymorphisme fonctionne via…", opts: ["une copie", "une référence ou un pointeur de base", "un int", "un template"], a: 1, exp: "Pas via une copie par valeur." },
    { type: "qcm", q: "<code>afficherRemise(const Utilisateur& u)</code> avec un Vendeur appelle…", opts: ["Utilisateur::remise", "Vendeur::remise (type réel)", "les deux", "aucune"], a: 1, exp: "Polymorphisme." },
    { type: "qcm", q: "Redéfinir (override) diffère de surcharger car…", opts: ["c'est pareil", "override = même signature dans une dérivée d'une méthode virtuelle", "override change le nom", "surcharger est virtuel"], a: 1, exp: "Deux notions distinctes." },
    { type: "vf", q: "Oublier le destructeur virtuel d'une classe de base peut causer un nettoyage incomplet.", a: true, exp: "Détruire via un pointeur de base ne libère pas la partie dérivée." },
    { type: "qcm", q: "Une méthode NON virtuelle, redéfinie dans une dérivée…", opts: ["est polymorphe", "n'est pas choisie par le type réel (pas de polymorphisme)", "cause une erreur", "est virtuelle"], a: 1, exp: "Il faut virtual pour le polymorphisme." },
    { type: "qcm", q: "public dans <code>class Vendeur : public Utilisateur</code> signifie…", opts: ["héritage public (l'interface reste publique)", "tout est privé", "aucun héritage", "amitié"], a: 0, exp: "Héritage public, le cas courant." },
    { type: "qcm", q: "override attrape notamment…", opts: ["les fuites", "une faute de signature qui empêcherait la redéfinition", "les injections", "rien"], a: 1, exp: "Vérification à la compilation." },
    { type: "qcm", q: "Le polymorphisme permet…", opts: ["moins de classes", "traiter des types dérivés via une interface commune", "supprimer virtual", "copier"], a: 1, exp: "Code générique sur la base." }
  ],
  final: {
    title: "Exercice final — Une hiérarchie de rôles",
    intro: `<p>On modélise les rôles. Analyse :</p>
<pre class="pseudo">class Utilisateur {
public:
    double remise() { return 0.0; }             // PROBLÈME : pas virtual → aucune redéfinition polymorphe possible
};
class Admin : public Utilisateur {
public:
    double remise() { return 0.20; }            // "redéfinit" mais sans virtual : ne sera pas choisie via une référence de base
};
void afficher(Utilisateur u) { std::cout &lt;&lt; u.remise(); }  // PROBLÈME : passage par VALEUR → "slicing" (la partie Admin est tronquée)
// afficher(Admin{}) affiche 0 au lieu de 0.20</pre>`,
    questions: [
      { type: "qcm", q: "Problème n°1 — <code>remise()</code> non virtuelle :", opts: ["correct", "sans virtual, pas de polymorphisme : il faut virtual + override", "trop lent", "rien"], a: 1, exp: "virtual dans la base, override dans Admin." },
      { type: "qcm", q: "Problème n°2 — <code>afficher(Utilisateur u)</code> par valeur :", opts: ["correct", "copie par valeur → « slicing » : passer const Utilisateur&", "trie", "rien"], a: 1, exp: "Le passage par valeur tronque la partie dérivée (slicing)." },
      { type: "qcm", q: "Que manque-t-il à la classe de base ?", opts: ["rien", "un destructeur virtuel (virtual ~Utilisateur())", "un template", "un cout"], a: 1, exp: "Indispensable pour l'héritage." },
      { type: "qcm", q: "Après corrections, afficher(Admin) donne…", opts: ["0", "0.20 (polymorphisme)", "erreur", "0.10"], a: 1, exp: "La version d'Admin." },
      { type: "qcm", q: "Le « slicing » se produit quand…", opts: ["on passe par référence", "on copie un objet dérivé dans un objet de base (par valeur)", "on utilise override", "jamais"], a: 1, exp: "D'où le passage par référence." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                                // pour std::cout (afficher)

class Utilisateur {                                // classe de base
public:
    virtual double remise() const { return 0.0; }  // virtual : redéfinissable ; const : lecture seule
    virtual ~Utilisateur() = default;              // destructeur virtuel : nettoyage correct des dérivés
};
class Admin : public Utilisateur {                 // Admin hérite d'Utilisateur
public:
    double remise() const override { return 0.20; } // override : redéfinit remise() (20 %)
};

void afficher(const Utilisateur&amp; u) {              // const& (référence) : PAS de copie, donc pas de slicing
    std::cout &lt;&lt; u.remise() * 100 &lt;&lt; " %\\n";       // appelle la bonne version selon le type réel de u
}
int main() {                                       // point d'entrée du programme
    Admin a;                                       // a est un Admin
    afficher(a);                                   // affiche 20 % : la version d'Admin (polymorphisme)
    return 0;                                      // 0 = fin sans erreur
}</pre>
<p><code>virtual</code> + <code>override</code> + destructeur virtuel + passage par référence : le polymorphisme fonctionne. Demain : les classes abstraites et les interfaces.</p>`
  }
};
</script>

  { id: "cppm-l12", title: "Client, Vendeur, Admin", level: 3,
    statement: "Crée une classe de base Utilisateur avec une méthode virtuelle remise() const (0 %) et un destructeur virtuel. Fais-en dériver Vendeur (10 %) et Admin (20 %) avec override. Écris une fonction qui affiche la remise via const Utilisateur& et teste-la sur un Vendeur et un Admin.",

    ],
    solution: "#include <iostream>                              // pour std::cout (afficher)\n\nclass Utilisateur {                              // classe de base\npublic:\n    virtual double remise() const { return 0.0; }  // methode virtuelle : redefinissable (0 % par defaut)\n    virtual ~Utilisateur() = default;            // destructeur virtuel (indispensable pour l'heritage)\n};\nclass Vendeur : public Utilisateur {             // Vendeur herite d'Utilisateur\npublic:\n    double remise() const override { return 0.10; }  // override : redefinit remise() a 10 %\n};\nclass Admin : public Utilisateur {               // Admin herite d'Utilisateur\npublic:\n    double remise() const override { return 0.20; }  // override : redefinit remise() a 20 %\n};\n\nvoid afficher(const Utilisateur& u) {            // reference de base : pas de copie, pas de slicing\n    std::cout << u.remise() * 100 << \" %\\n\";     // appelle la bonne version selon le type reel\n}\n\nint main() {                                     // point d'entree du programme\n    Vendeur v; Admin a;                          // un Vendeur et un Admin\n    afficher(v);                                 // affiche 10 % (version de Vendeur)\n    afficher(a);                                 // affiche 20 % (version d'Admin)\n    return 0;                                    // 0 = fin sans erreur\n}",
    note: "virtual + override rendent remise() polymorphe : afficher() appelle la bonne version selon le type réel, via une référence de base (const Utilisateur&). Le destructeur virtuel est indispensable dès qu'une classe est destinée à l'héritage." }
  ]
};
