<script>
var DAY = {
  num: 4,
  title: "Entrées/sorties : cin et getline",
  subtitle: "Lire au clavier avec std::cin — sans le & du scanf — et lire des lignes entières.",
  theory: `
<h3>1. Lire une valeur avec std::cin</h3>
<p>Jusqu'ici on <em>affichait</em> avec <code>std::cout</code> (l'écran). Pour <em>lire</em> ce que l'utilisateur tape au clavier, on utilise <code>std::cin</code> — un objet qui représente l'<strong>entrée standard</strong> (le clavier ; <em>cin</em> = <em>character input</em>). L'opérateur associé est <code>&gt;&gt;</code>, qui veut dire « extraire depuis » (l'inverse visuel de <code>&lt;&lt;</code> « envoyer vers »).</p>
<pre class="pseudo">#include &lt;iostream&gt;             // pour std::cin (lire) et std::cout (afficher)

int age;                        // on crée une variable entière "age" (vide pour l'instant)
std::cout &lt;&lt; "Ton age ? ";      // on affiche une invite pour demander la valeur (un "prompt")
std::cin &gt;&gt; age;                // on lit un nombre tapé au clavier et on le range dans age ; PAS besoin de & devant age
std::cout &lt;&lt; "Tu as " &lt;&lt; age &lt;&lt; " ans\\n";  // on affiche le résultat puis on va à la ligne</pre>
<p><code>std::cin</code> avec l'opérateur <strong><code>&gt;&gt;</code></strong> (« extraire depuis ») lit une valeur au clavier. Contrairement à <code>scanf</code> du C, il n'y a ni <code>&amp;</code> ni spécificateur de format (<code>%d</code>, <code>%f</code>…) : le <strong>type</strong> de la variable réceptrice suffit à savoir comment lire.</p>

<h3>2. Vérifier que la lecture a réussi</h3>
<p>Un <strong>flux</strong> (comme <code>std::cin</code>) est un « tuyau » de données. Si l'utilisateur tape n'importe quoi (des lettres là où on attend un nombre), la lecture <strong>échoue</strong>. On peut le détecter.</p>
<pre class="pseudo">int n;                              // variable entière à remplir
if (!(std::cin &gt;&gt; n)) {             // on tente la lecture ; le ! (NON) rend la condition vraie si la lecture a ÉCHOUÉ
    std::cout &lt;&lt; "Saisie invalide\\n";  // message d'erreur affiché en cas d'échec
    return 1;                       // return 1 = on quitte main avec un code d'erreur (différent de 0)
}</pre>
<p>Un flux (<code>std::cin</code>) peut être testé comme un <strong>booléen</strong> (vrai/faux) : <code>if (std::cin &gt;&gt; n)</code> vaut vrai si la lecture a réussi, faux sinon.</p>

<h3>3. Lire un mot vs une ligne</h3>
<pre class="pseudo">std::string mot;                    // une variable texte
std::cin &gt;&gt; mot;                    // &gt;&gt; s'arrête au premier espace : ne lit donc qu'UN SEUL mot

std::string ligne;                  // une autre variable texte
std::getline(std::cin, ligne);     // getline lit TOUTE la ligne (espaces compris) jusqu'au retour à la ligne</pre>
<div class="warn"><code>&gt;&gt;</code> sur un <code>std::string</code> ne lit qu'un mot (il s'arrête au premier espace). Pour un nom composé comme « Les Aventuriers du Rail », on utilise <code>std::getline</code>, qui lit une ligne entière.</div>

<h3>4. Le piège cin >> puis getline</h3>
<pre class="pseudo">int n;                              // un nombre à lire
std::cin &gt;&gt; n;                      // &gt;&gt; lit le nombre mais laisse le retour à la ligne ('\\n') dans le tampon
std::cin.ignore();                 // .ignore() jette ce '\\n' resté en attente dans le tampon
std::string ligne;                 // la ligne de texte à lire ensuite
std::getline(std::cin, ligne);     // maintenant getline lit la vraie ligne (sinon il aurait lu une ligne vide)</pre>
<div class="tip">Après un <code>&gt;&gt;</code>, un retour à la ligne reste dans le <strong>tampon</strong> (la zone d'attente des caractères tapés). Avant un <code>getline</code>, on appelle <code>std::cin.ignore()</code> pour le jeter. Sinon, <code>getline</code> croit que la ligne est déjà finie et lit une ligne vide.</div>`,
  exercises: [
    { type: "qcm", q: "Quel objet lit au clavier en C++ ?", opts: ["scanf", "std::cin", "read", "input"], a: 1, exp: "std::cin avec >>." },
    { type: "qcm", q: "Quel opérateur extrait depuis std::cin ?", opts: ["<<", ">>", "->", "::"], a: 1, exp: ">> « extrait depuis » le flux." },
    { type: "qcm", q: "Faut-il un & devant la variable avec cin ?", opts: ["oui", "non : cin >> age suffit", "toujours", "seulement pour les int"], a: 1, exp: "Pas de & (contrairement à scanf)." },
    { type: "qcm", q: "Comment vérifier qu'une lecture a réussi ?", opts: ["cin.ok()", "if (std::cin >> n) ...", "cin.error", "impossible"], a: 1, exp: "Le flux se teste comme un booléen." },
    { type: "qcm", q: "<code>std::cin >> mot</code> sur un string lit…", opts: ["toute la ligne", "un seul mot (jusqu'au premier espace)", "un caractère", "rien"], a: 1, exp: "Pour une ligne, il faut getline." },
    { type: "qcm", q: "Comment lire une ligne entière avec espaces ?", opts: ["cin >> ligne", "std::getline(std::cin, ligne)", "cin.line()", "readline"], a: 1, exp: "std::getline lit jusqu'au \\n." },
    { type: "qcm", q: "Pourquoi cin.ignore() avant getline après un >> ?", opts: ["pour accélérer la lecture", "jeter le '\\n' resté dans le tampon", "vider l'écran", "pour convertir la saisie en entier"], a: 1, exp: "Sinon getline lit une ligne vide." },
    { type: "qcm", q: "std::cin >> age remplace…", opts: ["printf", "scanf(\"%d\", &age)", "getline", "cout"], a: 1, exp: "Mais sans & ni format." },
    { type: "qcm", q: "Un flux std::cin peut être testé comme…", opts: ["un int", "un booléen (succès/échec)", "une chaîne", "un pointeur"], a: 1, exp: "if (cin >> x)." },
    { type: "qcm", q: "Le type lu par >> est déterminé par…", opts: ["un format %d", "le type de la variable réceptrice", "le hasard", "cout"], a: 1, exp: "Pas de spécificateur." },
    { type: "vf", q: "cin >> nom lit un nom composé avec espaces d'un coup.", a: false, exp: "Faux : >> s'arrête au premier espace ; getline pour une ligne." },
    { type: "qcm", q: "Un prompt (message avant la saisie) se fait avec…", opts: ["cin", "std::cout avant le std::cin", "getline", "rien"], a: 1, exp: "On invite avant de lire." },
    { type: "qcm", q: "getline prend en paramètres…", opts: ["juste la variable", "le flux (std::cin) et la string cible", "un format", "un int"], a: 1, exp: "std::getline(std::cin, ligne)." },
    { type: "qcm", q: "Après <code>if (!(std::cin >> n))</code>, on entre dans le if si…", opts: ["n vaut 0", "la lecture a échoué (saisie non numérique)", "n est positif", "toujours"], a: 1, exp: "Le ! inverse le succès." },
    { type: "qcm", q: "L'en-tête pour cin/cout est…", opts: ["<string>", "<iostream>", "<fstream>", "<cin>"], a: 1, exp: "#include <iostream>." }
  ],
  final: {
    title: "Exercice final — Lire un jeu et une durée",
    intro: `<p>On lit le nom d'un jeu (composé) et un nombre de jours. Analyse :</p>
<pre class="pseudo">std::string nom;                // le nom du jeu à lire
int jours;                      // le nombre de jours à lire
std::cout &lt;&lt; "Jeu ? ";          // invite pour le jeu
std::cin &gt;&gt; nom;                // PROBLÈME : &gt;&gt; ne lit qu'un mot (pas un nom composé avec espaces)
std::cout &lt;&lt; "Jours ? ";        // invite pour la durée
std::cin &gt;&gt; jours;              // lit le nombre, mais laisse un '\\n' dans le tampon
std::getline(std::cin, nom);   // PROBLÈME : sans cin.ignore() avant, getline lit une ligne vide</pre>`,
    questions: [
      { type: "qcm", q: "Problème n°1 — <code>std::cin >> nom</code> pour un nom composé :", opts: ["correct", "ne lit qu'un mot : il faut std::getline pour un nom avec espaces", "trop lent", "rien"], a: 1, exp: ">> s'arrête au premier espace." },
      { type: "qcm", q: "Problème n°2 — getline juste après <code>cin >> jours</code> :", opts: ["correct", "il lira une ligne vide : il faut cin.ignore() avant", "il faut un &", "rien"], a: 1, exp: "Le '\\n' résiduel doit être jeté." },
      { type: "qcm", q: "Comment lire jours de façon robuste ?", opts: ["cin >> jours sans vérif", "tester if (!(std::cin >> jours)) ...", "getline(jours)", "scanf"], a: 1, exp: "Valider la saisie numérique." },
      { type: "qcm", q: "std::cin >> jours écrit-il dans jours avec un & ?", opts: ["oui", "non : sans &", "avec *", "impossible"], a: 1, exp: "Pas de & en C++." },
      { type: "qcm", q: "Le bon ordre pour lire un nombre puis une ligne :", opts: ["getline puis >>", ">> nombre, cin.ignore(), getline ligne", "deux getline", ">> deux fois"], a: 1, exp: "Vider le tampon entre les deux." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                       // pour std::cin et std::cout
#include &lt;string&gt;                         // pour std::string et std::getline

int main() {                              // point d'entrée du programme
    int jours;                            // le nombre de jours
    std::cout &lt;&lt; "Jours ? ";              // invite
    if (!(std::cin &gt;&gt; jours)) return 1;   // on lit ET on vérifie ; échec → on quitte avec le code 1
    std::cin.ignore();                    // jette le '\\n' resté dans le tampon après le &gt;&gt;

    std::string nom;                      // le nom complet du jeu
    std::cout &lt;&lt; "Jeu (nom complet) ? ";  // invite
    std::getline(std::cin, nom);          // lit toute la ligne, espaces compris

    std::cout &lt;&lt; nom &lt;&lt; " pour " &lt;&lt; jours &lt;&lt; " jours\\n";  // affiche le résultat puis va à la ligne
    return 0;                             // 0 = fin sans erreur
}</pre>
<p>On lit le nombre, on vide le tampon, puis on lit la ligne entière. <code>&gt;&gt;</code> pour un mot ou un nombre, <code>getline</code> pour une ligne. Demain : conditions et boucles.</p>`
  }
};
</script>

    atoi: { cmd: "g++ -std=c++17 prog.cpp -o prog && ./prog", expected: "Prix/jour ? Jours ? Total : 15.00 euros" },
    checklist: ["Chaque saisie est lue puis testée avec if (!(std::cin >> x)) return 1;.", "Le fichier inclut <iomanip> pour std::setprecision.", "Le total est affiché à 2 décimales via std::fixed << std::setprecision(2).", "Le programme compile en C++17 et s'exécute sans erreur."],
    solution: "#include <iostream>                       // pour std::cin et std::cout\n#include <iomanip>                        // pour std::fixed et std::setprecision (formatage)\n\nint main() {                              // point d'entree du programme\n    double prix;                          // prix par jour (nombre a virgule)\n    int jours;                            // nombre de jours (entier)\n    std::cout << \"Prix/jour ? \";          // invite pour le prix\n    if (!(std::cin >> prix)) return 1;    // lit et verifie : echec -> quitte avec le code 1\n    std::cout << \"Jours ? \";              // invite pour les jours\n    if (!(std::cin >> jours)) return 1;   // lit et verifie la seconde saisie\n    std::cout << std::fixed << std::setprecision(2)   // affiche avec 2 decimales fixes\n              << \"Total : \" << prix * jours << \" euros\\n\";  // total = prix * jours, puis va a la ligne\n    return 0;                             // 0 = fin sans erreur\n}",

  ]
};
