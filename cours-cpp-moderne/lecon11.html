<script>
var DAY = {
  num: 11,
  title: "Copie, passage par référence",
  subtitle: "Comprendre quand un objet est copié, et éviter les copies inutiles avec const&.",
  theory: `
<h3>1. Les objets se copient</h3>
<p><strong>Copier</strong> un objet, c'est fabriquer un second objet indépendant qui contient les mêmes valeurs. Rappel : un <strong>objet</strong> est un exemplaire d'une classe, avec ses propres <strong>attributs</strong> (ses données).</p>
<pre class="pseudo">Jeu a("Catan", 44.90, 3);   // crée un objet a
Jeu b = a;                  // COPIE : b est un NOUVEL objet, indépendant, avec les mêmes valeurs que a
b.reapprovisionner(10);     // on modifie b... ce qui ne change PAS a (ce sont deux objets séparés)</pre>
<p>Par défaut, copier un objet copie tous ses attributs un à un (copie « membre à membre »). Pour un <code>Jeu</code> (une string + un double + un int), ce comportement automatique est correct.</p>

<h3>2. La copie peut coûter cher</h3>
<pre class="pseudo">void afficher(Jeu j);          // paramètre par VALEUR → COPIE le Jeu entier à chaque appel (du gaspillage)
void afficher(const Jeu&amp; j);   // const Jeu& = référence en lecture seule → AUCUNE copie (à préférer)</pre>
<div class="warn">Passer un objet <strong>par valeur</strong> le copie entièrement. Pour un gros objet (ou un <code>std::vector</code> de milliers d'éléments), c'est du gaspillage de temps et de mémoire. On passe donc par <strong><code>const Jeu&amp;</code></strong> (une référence, un simple « autre nom ») quand on veut seulement le lire.</div>

<h3>3. Renvoyer un objet</h3>
<pre class="pseudo">Jeu creerJeu() {                  // fonction qui fabrique et renvoie un Jeu
    Jeu j("Nouveau", 0.0, 0);     // on crée un objet local j
    return j;                     // on le renvoie ; le compilateur évite la copie inutile (optimisation appelée RVO)
}</pre>
<p>Renvoyer un objet par valeur est efficace : le compilateur applique des optimisations (RVO, <em>Return Value Optimization</em>) et le <strong>déplacement</strong> (<em>move</em> : transférer le contenu au lieu de le recopier). En revanche, ne renvoie <strong>jamais</strong> une référence vers une variable locale : celle-ci disparaît dès la fin de la fonction, la référence pointerait alors dans le vide.</p>

<h3>4. Le récapitulatif des passages</h3>
<pre class="pseudo">const T&amp;   // lire un objet sans le copier      (le cas le plus fréquent)
T&amp;         // modifier l'objet de l'appelant
T          // copie (petits types, ou copie réellement voulue)
T&amp;&amp;        // référence "rvalue" : sert au déplacement (move) — notion avancée</pre>

<h3>5. La classe qui gère une ressource</h3>
<div class="tip">Si une classe possède une <strong>ressource brute</strong> (un pointeur alloué à la main, un fichier ouvert…), la copie « membre à membre » peut devenir dangereuse : deux objets se retrouveraient à pointer vers la même ressource, et tous deux essaieraient de la libérer. C'est ce qu'encadre la <strong>règle de trois/cinq</strong> (traitée dans le cours bas niveau). En C++ moderne, on évite le problème en utilisant des membres qui gèrent déjà leur propre copie (<code>std::string</code>, <code>std::vector</code>, les <em>smart pointers</em>) : la copie de la classe « juste marche » toute seule.</div>`,
  exercises: [
    { type: "qcm", q: "Par défaut, copier un objet…", opts: ["ne copie rien", "copie tous ses attributs (membre à membre)", "le déplace", "le supprime"], a: 1, exp: "Copie automatique des membres." },
    { type: "qcm", q: "<code>Jeu b = a;</code> crée…", opts: ["une référence à a", "une copie indépendante", "un pointeur", "une erreur"], a: 1, exp: "b est un nouvel objet." },
    { type: "qcm", q: "Passer un objet par valeur…", opts: ["est gratuit", "le copie entièrement (coûteux pour un gros objet)", "le modifie", "le déplace"], a: 1, exp: "D'où const& pour lire." },
    { type: "qcm", q: "Pour LIRE un objet sans le copier :", opts: ["T j", "const T& j", "T& j", "T* j"], a: 1, exp: "Référence const." },
    { type: "qcm", q: "Pour MODIFIER l'objet de l'appelant :", opts: ["T j", "T& j", "const T& j", "copie"], a: 1, exp: "Référence non-const." },
    { type: "qcm", q: "Renvoyer un objet par valeur est…", opts: ["toujours lent", "efficace (le compilateur optimise, RVO/move)", "interdit", "impossible"], a: 1, exp: "Pas de copie inutile." },
    { type: "qcm", q: "Renvoyer une référence à une variable locale…", opts: ["est recommandé", "est un bug : la variable disparaît", "copie l'objet", "accélère"], a: 1, exp: "Référence pendante (dangling)." },
    { type: "qcm", q: "Le passage le plus fréquent pour lire un objet :", opts: ["T par valeur", "const T&", "T&", "T*"], a: 1, exp: "Zéro copie, lecture seule." },
    { type: "qcm", q: "Après <code>Jeu b = a; b.reapprovisionner(10);</code>, a est…", opts: ["modifié aussi", "inchangé (b est une copie indépendante)", "détruit", "une référence"], a: 1, exp: "Copie = objets séparés." },
    { type: "qcm", q: "Copier un std::vector de milliers d'éléments…", opts: ["est gratuit", "peut coûter cher (d'où const&)", "le déplace", "l'efface"], a: 1, exp: "On évite les copies inutiles." },
    { type: "vf", q: "En C++ moderne, les membres std::string/std::vector gèrent leur propre copie correctement.", a: true, exp: "La copie de la classe « juste marche »." },
    { type: "qcm", q: "La règle de trois/cinq concerne surtout…", opts: ["tous les objets", "les classes qui gèrent une ressource brute (pointeur nu)", "les int", "les string"], a: 1, exp: "Évitée avec la STL et smart pointers." },
    { type: "qcm", q: "Pour un int, on passe…", opts: ["const&", "par valeur (copie triviale)", "par pointeur", "en &"], a: 1, exp: "Copier un int est trivial." },
    { type: "qcm", q: "const T& combine…", opts: ["copie + modif", "pas de copie + lecture seule", "déplacement + null", "rien"], a: 1, exp: "Efficace et sûr." },
    { type: "qcm", q: "Le déplacement (move) sert à…", opts: ["copier deux fois", "transférer une ressource sans la copier", "supprimer", "trier"], a: 1, exp: "Optimisation avancée (T&&)." }
  ],
  final: {
    title: "Exercice final — Éviter les copies",
    intro: `<p>Une fonction qui reçoit un catalogue. Analyse :</p>
<pre class="pseudo">double total(std::vector&lt;Jeu&gt; cat) {   // PROBLÈME : par valeur → copie TOUT le catalogue à chaque appel
    double s = 0;                       // accumulateur du total
    for (Jeu j : cat) s += j.prix();    // PROBLÈME : "Jeu j" copie CHAQUE jeu à chaque tour (utiliser const auto&)
    return s;                           // renvoie la somme des prix
}</pre>`,
    questions: [
      { type: "qcm", q: "Problème n°1 — <code>std::vector<Jeu> cat</code> par valeur :", opts: ["correct", "copie tout le catalogue à chaque appel : passer const&", "il faudrait le passer par pointeur", "il manque le mot-clé const sur la fonction"], a: 1, exp: "const std::vector<Jeu>&." },
      { type: "qcm", q: "Problème n°2 — <code>for (Jeu j : cat)</code> :", opts: ["correct", "copie chaque Jeu : utiliser const auto& j", "trie", "rien"], a: 1, exp: "Lecture sans copie." },
      { type: "qcm", q: "La fonction modifie-t-elle le catalogue ?", opts: ["oui", "non : elle ne fait que lire, donc const& partout", "parfois", "elle le vide"], a: 1, exp: "Lecture seule." },
      { type: "qcm", q: "Bonne signature :", opts: ["double total(std::vector<Jeu> cat)", "double total(const std::vector<Jeu>& cat)", "double total(std::vector<Jeu>& cat)", "double total(Jeu cat)"], a: 1, exp: "Référence const." },
      { type: "qcm", q: "Bénéfice de const& ici :", opts: ["aucun", "zéro copie inutile, et lecture garantie", "plus lent", "moins sûr"], a: 1, exp: "Efficacité + sûreté." }
    ],
    solution: `<pre class="pseudo">double total(const std::vector&lt;Jeu&gt;&amp; cat) {   // const& : le catalogue n'est PAS copié (juste référencé)
    double s = 0;                              // accumulateur du total
    for (const auto&amp; j : cat)                  // const auto& : chaque Jeu est lu SANS copie
        s += j.prix();                         // ajoute le prix de chaque jeu à la somme
    return s;                                  // renvoie le total
}</pre>
<p>Le catalogue et chaque Jeu sont passés/parcourus en <code>const&amp;</code> : aucune copie inutile, et le compilateur garantit qu'on ne les modifie pas. Réflexe : <code>const&amp;</code> pour lire un objet. Demain : l'héritage et le polymorphisme.</p>`
  }
};
</script>
