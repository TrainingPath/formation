  title: "std::vector",
  subtitle: "Le tableau qui gère sa taille tout seul : ajouter, parcourir, mesurer — sans débordement.",
  theory: `
<h3>1. Créer un vector</h3>
<p>Un <strong>tableau</strong> est une suite de valeurs rangées les unes derrière les autres. En C++ moderne, on utilise <code>std::vector</code> : un tableau <strong>dynamique</strong>, c'est-à-dire dont la taille peut changer pendant l'exécution du programme. On écrit le type des éléments entre chevrons <code>&lt; &gt;</code> : <code>std::vector&lt;int&gt;</code> se lit « un vector d'entiers ». Ces chevrons font de <code>vector</code> un <strong>template</strong> (un modèle) : le même outil fonctionne pour n'importe quel type d'éléments. Il faut <code>#include &lt;vector&gt;</code>.</p>
<pre class="pseudo">#include &lt;vector&gt;                        // pour disposer du type std::vector
std::vector&lt;int&gt; stocks = {3, 0, 5, 2};  // un vector de 4 entiers, avec des valeurs de départ entre accolades
std::vector&lt;double&gt; prix;                // un vector de nombres à virgule, VIDE au départ (0 élément)
std::vector&lt;std::string&gt; noms(3, "?");   // un vector de 3 chaînes, toutes initialisées à "?"</pre>
<p>Un <code>std::vector&lt;T&gt;</code> est donc un tableau dynamique d'éléments de type <code>T</code> (le <code>T</code> désigne « n'importe quel type »). Contrairement au tableau du C, sa taille peut <strong>grandir</strong> à l'exécution.</p>

<h3>2. Ajouter et accéder</h3>
<p>On accède à un élément par son <strong>indice</strong> (sa position), en comptant à partir de 0.</p>
<pre class="pseudo">prix.push_back(44.90);        // push_back = "pousse à la fin" : ajoute 44.90 comme dernier élément
prix.push_back(12.50);        // ajoute un deuxième prix à la fin
std::cout &lt;&lt; prix[0];         // prix[0] = l'élément d'indice 0 (le premier) : affiche 44.90
std::cout &lt;&lt; prix.size();     // .size() = le nombre d'éléments actuellement dans le vector : ici 2
std::cout &lt;&lt; prix.front() &lt;&lt; prix.back();  // .front() = premier élément ; .back() = dernier élément</pre>
<div class="warn"><code>prix[i]</code> ne vérifie pas les <strong>bornes</strong> (comme en C) : demander un indice qui n'existe pas provoque un comportement imprévisible. <code>prix.at(i)</code>, lui, vérifie et lance une <strong>exception</strong> (une erreur signalée proprement) si l'indice est invalide. En cas de doute, <code>at()</code> est plus sûr.</div>

<h3>3. Parcourir (for-range)</h3>
<p>La boucle <strong>for-range</strong> parcourt chaque élément sans manipuler d'indice (« pour chaque élément dans la collection »).</p>
<pre class="pseudo">double somme = 0;                          // accumulateur : contiendra le total, part de 0
for (double p : prix) somme += p;          // POUR CHAQUE prix p (copie), l'ajouter à somme (somme += p signifie somme = somme + p)
for (auto&amp; p : prix) p *= 1.05;            // auto& = référence : ici on MODIFIE chaque prix d'origine (+5 %)
std::cout &lt;&lt; "Moyenne : " &lt;&lt; somme / prix.size();  // affiche la moyenne = somme divisée par le nombre d'éléments</pre>

<h3>4. Modifier la taille</h3>
<pre class="pseudo">prix.pop_back();               // pop_back = retire le DERNIER élément
prix.clear();                  // clear = vide entièrement le vector (0 élément ensuite)
prix.empty();                  // renvoie true (vrai) si le vector est vide, false sinon
prix.resize(5);                // redimensionne le vector à 5 éléments (ajoute ou retire au besoin)</pre>

<h3>5. Un vector de tout</h3>
<pre class="pseudo">std::vector&lt;std::string&gt; catalogue = {"Catan", "Uno", "Risk"};  // un vector de 3 chaînes de caractères
for (const auto&amp; nom : catalogue)          // const auto& = lecture seule sans copie ; parcourt chaque nom
    std::cout &lt;&lt; nom &lt;&lt; "\\n";              // affiche chaque nom sur sa propre ligne</pre>
<div class="tip">Le <code>std::vector</code> est le conteneur STL le plus utilisé : il remplace le tableau C dans 90 % des cas. Il gère sa mémoire, connaît sa taille, s'agrandit tout seul, et se parcourt sans risque de débordement avec le for-range.</div>`,
  exercises: [
    { type: "qcm", q: "Un std::vector est…", opts: ["un tableau de taille fixe", "un tableau dynamique qui gère sa taille", "une chaîne", "une map"], a: 1, exp: "Il peut grandir à l'exécution." },
    { type: "qcm", q: "Comment ajouter un élément à la fin ?", opts: ["v.add()", "v.push_back(x)", "v.append(x)", "v += x"], a: 1, exp: "push_back." },
    { type: "qcm", q: "Comment connaître le nombre d'éléments ?", opts: ["v.length", "v.size()", "sizeof(v)", "v.count"], a: 1, exp: "Méthode .size()." },
    { type: "qcm", q: "Quelle différence entre v[i] et v.at(i) ?", opts: ["aucune", "at() vérifie les bornes (exception si invalide), [] non", "at() est plus lent toujours", "[] vérifie, at() non"], a: 1, exp: "at() est plus sûr." },
    { type: "qcm", q: "Comment parcourir un vector idiomatiquement ?", opts: ["for classique obligatoire", "for-range : for (auto& x : v)", "while(v)", "goto"], a: 1, exp: "for-range." },
    { type: "qcm", q: "v.front() et v.back() donnent…", opts: ["la taille", "le premier et le dernier élément", "des copies", "des erreurs"], a: 1, exp: "Extrémités du vector." },
    { type: "qcm", q: "v.pop_back() fait…", opts: ["ajoute", "retire le dernier élément", "vide tout", "trie"], a: 1, exp: "Retire à la fin." },
    { type: "qcm", q: "v.clear() fait…", opts: ["ajoute", "vide le vector", "retire un élément", "double la taille"], a: 1, exp: "Supprime tous les éléments." },
    { type: "qcm", q: "Le vector remplace, en C++…", opts: ["la string", "le tableau C dans la plupart des cas", "la map", "le pointeur"], a: 1, exp: "Conteneur STL le plus courant." },
    { type: "qcm", q: "std::vector<double> prix; crée…", opts: ["un vector de 10 doubles", "un vector vide de doubles", "une erreur", "un double"], a: 1, exp: "Vide au départ, on push_back." },
    { type: "vf", q: "v[i] vérifie automatiquement que i est dans les bornes.", a: false, exp: "Faux : [] ne vérifie pas ; at() oui." },
    { type: "qcm", q: "std::vector<std::string> noms(3, \"?\") crée…", opts: ["un vector vide", "3 éléments valant \"?\"", "3 vector", "une erreur"], a: 1, exp: "Constructeur (taille, valeur)." },
    { type: "qcm", q: "Pour lire de gros éléments sans copie dans un for-range :", opts: ["auto x", "const auto& x", "int x", "auto& x"], a: 1, exp: "const auto& : lecture sans copie." },
    { type: "qcm", q: "Quel en-tête pour std::vector ?", opts: ["<array>", "<vector>", "<list>", "<vec>"], a: 1, exp: "#include <vector>." },
    { type: "qcm", q: "v.empty() renvoie true si…", opts: ["v contient des 0", "v n'a aucun élément", "v[0]==0", "jamais"], a: 1, exp: "Vector sans élément." }
  ],
  final: {
    title: "Exercice final — Le plus grand stock",
    intro: `<p>On cherche le plus grand stock. Analyse :</p>
<pre class="pseudo">std::vector&lt;int&gt; stocks = {3, 8, 5, 2};       // 4 stocks ; les indices valides vont de 0 à 3
int max = 0;                                  // on part de 0 (attention : problématique si tous négatifs)
for (int i = 0; i &lt;= stocks.size(); ++i)      // ERREUR : i &lt;= size() atteint l'indice 4, qui N'EXISTE PAS (débordement)
    if (stocks[i] &gt; max) max = stocks[i];      // garde la plus grande valeur rencontrée</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — <code>i <= stocks.size()</code> :", opts: ["correct", "débordement : indices 0..size-1, donc i < size()", "il faut i <= size-1 avec ++", "rien"], a: 1, exp: "stocks[size()] est hors bornes." },
      { type: "qcm", q: "Pourquoi préférer un for-range ici ?", opts: ["c'est plus lent", "il évite la gestion d'indices et le débordement", "il trie les éléments au passage", "il libère la mémoire du vector"], a: 1, exp: "for (int s : stocks)." },
      { type: "qcm", q: "Risque de <code>max = 0</code> au départ :", opts: ["aucun", "si tous les stocks étaient négatifs, max resterait 0", "0 interdit", "trop grand"], a: 1, exp: "Mieux : partir de stocks[0]." },
      { type: "qcm", q: "Une alternative STL au max manuel :", opts: ["std::sort", "std::max_element(v.begin(), v.end())", "std::find", "v.max()"], a: 1, exp: "max_element renvoie un itérateur." },
      { type: "qcm", q: "Avec {3,8,5,2}, max vaut…", opts: ["3", "8", "5", "2"], a: 1, exp: "8 est le maximum." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                          // pour std::cout (afficher)
#include &lt;vector&gt;                            // pour std::vector (le tableau dynamique)
#include &lt;algorithm&gt;                         // pour std::max_element (algorithme STL)

int main() {                                 // point d'entrée du programme
    std::vector&lt;int&gt; stocks = {3, 8, 5, 2};  // les 4 stocks
    // version for-range :
    int maxi = stocks[0];                    // on part du PREMIER élément (et non de 0) pour éviter le piège des négatifs
    for (int s : stocks) if (s &gt; maxi) maxi = s;  // pour chaque stock s, garder le plus grand rencontré
    std::cout &lt;&lt; "Max : " &lt;&lt; maxi &lt;&lt; "\\n";    // affiche le maximum trouvé

    // version STL :
    auto it = std::max_element(stocks.begin(), stocks.end());  // max_element renvoie un ITÉRATEUR vers le plus grand
    std::cout &lt;&lt; "Max (STL) : " &lt;&lt; *it &lt;&lt; "\\n";  // *it = la valeur pointée par l'itérateur
    return 0;                                // 0 = fin sans erreur
}</pre>
<p>Le for-range évite le débordement ; <code>std::max_element</code> fait même le travail à ta place. On revient sur les algorithmes STL en leçon 16. Demain : les fonctions et la surcharge.</p>`
  }
};
