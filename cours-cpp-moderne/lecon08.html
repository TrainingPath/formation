<script>
var DAY = {
  num: 8,
  title: "Fonctions : surcharge et valeurs par défaut",
  subtitle: "Découper le code, avec deux atouts du C++ : plusieurs fonctions de même nom et des paramètres par défaut.",
  theory: `
<h3>1. Définir et déclarer</h3>
<p>Une <strong>fonction</strong> est un bloc d'instructions réutilisable, avec un nom. Elle reçoit des <strong>paramètres</strong> (ses données d'entrée) et peut <strong>renvoyer</strong> un résultat (avec <code>return</code>). On écrit d'abord son <em>type de retour</em> (le genre de valeur qu'elle rend), puis son nom, puis ses paramètres entre parenthèses.</p>
<pre class="pseudo">double tarif(double prixJour, int jours) {  // renvoie un double ; reçoit un prix par jour (double) et un nombre de jours (int)
    double t = prixJour * jours;            // t = prix total avant remise = prix par jour × nombre de jours
    if (jours &gt;= 3) t *= 0.9;               // SI on loue au moins 3 jours : appliquer -10 % (t *= 0.9 signifie t = t * 0.9)
    return t;                               // renvoie le total calculé à l'appelant
}</pre>
<p>Comme en C : type de retour, nom, paramètres. Si la fonction est définie <em>après</em> <code>main</code>, on place sa <strong>déclaration</strong> (son « prototype », qui annonce sa signature) avant : <code>double tarif(double, int);</code>. Cela prévient le compilateur qu'elle existe.</p>

<h3>2. La surcharge : même nom, signatures différentes</h3>
<p><strong>Surcharger</strong> une fonction, c'est écrire plusieurs fonctions qui portent le même nom mais reçoivent des paramètres différents. La <strong>signature</strong> d'une fonction, c'est son nom + la liste des types de ses paramètres.</p>
<pre class="pseudo">int    maximum(int a, int b)        { return a &gt; b ? a : b; }  // version pour deux entiers ; a > b ? a : b = "si a>b alors a sinon b"
double maximum(double a, double b) { return a &gt; b ? a : b; }  // version pour deux nombres à virgule
maximum(3, 5);      // 3 et 5 sont des entiers → le compilateur appelle la version int
maximum(2.5, 1.0);  // 2.5 et 1.0 ont une virgule → il appelle la version double</pre>
<p>Le C++ autorise plusieurs fonctions de <strong>même nom</strong> tant que leurs <strong>paramètres diffèrent</strong>. Le compilateur choisit la bonne selon les arguments fournis. (Le C, lui, l'interdit.)</p>

<h3>3. Les valeurs par défaut</h3>
<p>Une <strong>valeur par défaut</strong> est une valeur automatiquement utilisée pour un paramètre quand l'appelant ne le fournit pas.</p>
<pre class="pseudo">double tarif(double prixJour, int jours = 1) {   // jours = 1 : si on ne précise pas "jours", il vaudra 1 par défaut
    // ...                                       // (corps de la fonction)
}
tarif(5.0);       // on ne donne pas jours → il prend sa valeur par défaut : jours = 1
tarif(5.0, 4);    // on précise jours → jours = 4 (la valeur par défaut est ignorée)</pre>
<div class="warn">Les paramètres par défaut se placent <strong>à la fin</strong> de la liste. Ils permettent souvent d'éviter une surcharge : une seule fonction couvre alors plusieurs usages.</div>

<h3>4. Passage : valeur, référence, const&amp;</h3>
<pre class="pseudo">void afficher(const std::string&amp; nom);   // gros objet qu'on LIT → const& (aucune copie, lecture seule)
void reappro(int&amp; stock, int n);         // paramètre à MODIFIER → & (référence : agit sur l'original)
int  carre(int x);                       // petit type → par valeur (copier un int ne coûte rien)</pre>

<h3>5. auto en retour (C++14)</h3>
<pre class="pseudo">auto tarif(double p, int j) { return p * j; }   // auto en retour : le compilateur DÉDUIT le type (ici double) de la valeur renvoyée</pre>
<div class="tip">Une bonne fonction fait une seule chose et porte un nom clair. La surcharge et les valeurs par défaut réduisent la duplication. Choisis le bon mode de passage : <code>const&amp;</code> pour lire un objet, <code>&amp;</code> pour le modifier, valeur pour les petits types.</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce que la surcharge de fonction ?", opts: ["une fonction lente", "plusieurs fonctions de même nom, paramètres différents", "une fonction récursive", "une erreur"], a: 1, exp: "Le compilateur choisit selon les arguments." },
    { type: "qcm", q: "Le C autorise-t-il la surcharge ?", opts: ["oui", "non (c'est propre au C++)", "parfois", "seulement les int"], a: 1, exp: "Nouveauté du C++." },
    { type: "qcm", q: "Où placer un paramètre par défaut ?", opts: ["au début", "à la fin de la liste", "au milieu", "n'importe où"], a: 1, exp: "Les défauts sont en fin." },
    { type: "qcm", q: "<code>double tarif(double p, int j = 1)</code> appelé <code>tarif(5.0)</code> donne j =", opts: ["0", "1 (valeur par défaut)", "5", "erreur"], a: 1, exp: "j prend la valeur par défaut." },
    { type: "qcm", q: "Comment le compilateur choisit entre deux surcharges ?", opts: ["au hasard", "selon les types des arguments", "la première déclarée", "la plus courte"], a: 1, exp: "Résolution de surcharge." },
    { type: "qcm", q: "Un gros objet à LIRE se passe…", opts: ["par valeur", "en const&", "en &", "en pointeur"], a: 1, exp: "Zéro copie, lecture seule." },
    { type: "qcm", q: "Un paramètre à MODIFIER se passe…", opts: ["par valeur", "en const&", "en & (référence)", "en copie"], a: 1, exp: "Référence non-const." },
    { type: "qcm", q: "Un int se passe idéalement…", opts: ["en const&", "par valeur", "en pointeur", "en &"], a: 1, exp: "Copier un int est trivial." },
    { type: "qcm", q: "Si tarif est défini après main, il faut…", opts: ["rien", "un prototype avant main", "le supprimer", "un template"], a: 1, exp: "Déclaration préalable." },
    { type: "qcm", q: "Les valeurs par défaut permettent souvent…", opts: ["d'aller plus vite", "d'éviter une surcharge (une fonction, plusieurs usages)", "de trier", "de compiler"], a: 1, exp: "Moins de duplication." },
    { type: "vf", q: "Deux fonctions de même nom et mêmes paramètres sont une surcharge valide.", a: false, exp: "Faux : les paramètres doivent différer." },
    { type: "qcm", q: "<code>maximum(3, 5)</code> avec deux surcharges (int/double) appelle…", opts: ["la version double", "la version int", "les deux", "erreur"], a: 1, exp: "Arguments int → version int." },
    { type: "qcm", q: "auto en type de retour (C++14) fait…", opts: ["rien", "déduire le type de retour de la valeur renvoyée", "une erreur", "un template"], a: 1, exp: "Type de retour déduit." },
    { type: "qcm", q: "Une bonne fonction…", opts: ["fait tout", "fait une seule chose, nom clair", "n'a pas de nom", "est la plus longue"], a: 1, exp: "Responsabilité unique." },
    { type: "qcm", q: "Le retour d'une fonction se fait avec…", opts: ["print valeur", "return valeur;", "yield valeur", "output valeur"], a: 1, exp: "return interrompt et renvoie." }
  ],
  final: {
    title: "Exercice final — La fonction tarif",
    intro: `<p>On veut une fonction tarif avec un défaut. Analyse :</p>
<pre class="pseudo">int tarif(int jours = 1, double prixJour) {  // ERREURS : un paramètre par défaut (jours) précède un paramètre sans défaut (prixJour) ; et le retour "int" tronquerait les décimales
    double t = prixJour * jours;             // total avant remise
    if (jours &gt;= 3) t *= 0.9;                // -10 % si au moins 3 jours
}                                            // ERREUR : aucun return t; → la fonction ne renvoie rien</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — l'ordre des paramètres :", opts: ["correct", "un paramètre par défaut ne peut précéder un paramètre sans défaut", "il faut const", "rien"], a: 1, exp: "Les défauts vont à la fin." },
      { type: "qcm", q: "Erreur n°2 — le type de retour <code>int</code> :", opts: ["correct", "le total est un double : renvoyer un double", "il faut void", "il faut auto obligatoire"], a: 1, exp: "int tronquerait les prix." },
      { type: "qcm", q: "Erreur n°3 — dans le corps :", opts: ["rien", "il manque return t;", "il manque un printf", "un cin"], a: 1, exp: "Sans return, pas de résultat." },
      { type: "qcm", q: "Bonne signature avec défaut :", opts: ["double tarif(double prixJour, int jours = 1)", "int tarif(int jours = 1, double p)", "void tarif(...)", "auto tarif(int = 1)"], a: 0, exp: "Défaut en fin, retour double." },
      { type: "qcm", q: "tarif(5.0) renvoie alors (jours=1)…", opts: ["4.5", "5.0", "18.0", "0"], a: 1, exp: "1 jour, pas de remise." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                              // pour std::cout (afficher)

double tarif(double prixJour, int jours = 1) {   // retour double ; le paramètre par défaut (jours=1) est bien EN FIN
    double t = prixJour * jours;                 // total avant remise
    if (jours &gt;= 3) t *= 0.9;                    // -10 % à partir de 3 jours
    return t;                                    // return AJOUTÉ : renvoie le total
}

int main() {                                     // point d'entrée du programme
    std::cout &lt;&lt; tarif(5.0)    &lt;&lt; "\\n";          // jours prend sa valeur par défaut 1 → affiche 5.0
    std::cout &lt;&lt; tarif(5.0, 4) &lt;&lt; "\\n";          // 4 jours → remise appliquée → affiche 18.0
    return 0;                                    // 0 = fin sans erreur
}</pre>
<p>Type de retour correct, <code>return</code>, et un paramètre par défaut en fin de liste. Demain : les classes et l'encapsulation.</p>`
  }
};
</script>

    solution: "#include <iostream>                              // pour std::cout (afficher)\n#include <iomanip>                               // pour std::fixed et std::setprecision (formatage)\n\ndouble prixFinal(double prix) {                  // version a 1 parametre : renvoie le prix tel quel\n    return prix;                                 // aucun changement\n}\ndouble prixFinal(double prix, double remise) {   // version a 2 parametres : applique une remise\n    return prix * (1.0 - remise);                // prix reduit du pourcentage remise\n}\n\nint main() {                                     // point d'entree du programme\n    std::cout << std::fixed << std::setprecision(2);  // 2 decimales fixes pour tout l'affichage\n    std::cout << prixFinal(50.0) << \"\\n\";        // appelle la version a 1 parametre -> 50.00\n    std::cout << prixFinal(50.0, 0.20) << \"\\n\";  // appelle la version a 2 parametres -> 40.00\n    return 0;                                    // 0 = fin sans erreur\n}",

  ]
