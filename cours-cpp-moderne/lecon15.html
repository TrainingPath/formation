<script>
var DAY = {
  num: 15,
  title: "La STL : map, set et itérateurs",
  subtitle: "Associer des clés à des valeurs, gérer des ensembles uniques, et parcourir avec des itérateurs.",
  theory: `
<h3>1. std::map : clé → valeur</h3>
<p>La <strong>STL</strong> est la boîte à outils standard du C++. Un <strong>conteneur</strong> est un objet qui range d'autres données. On connaît déjà <code>std::vector</code> (une liste). Voici <code>std::map</code> : une <strong>table d'association</strong> qui relie une <strong>clé</strong> (par exemple un numéro) à une <strong>valeur</strong> (par exemple un nom). Analogie : un dictionnaire, où chaque mot (la clé) mène à sa définition (la valeur).</p>
<pre class="pseudo">#include &lt;map&gt;                              // pour disposer du conteneur std::map
std::map&lt;int, std::string&gt; catalogue;      // une map : clé de type int, valeur de type std::string (vide au départ)
catalogue[1] = "Catan";                    // catalogue[1] désigne la valeur de la clé 1 ; on y range "Catan" (insère l'entrée)
catalogue[2] = "Uno";                      // range "Uno" à la clé 2
std::cout &lt;&lt; catalogue[1];                 // lit la valeur associée à la clé 1 : affiche "Catan"</pre>
<p>Une <code>std::map&lt;K, V&gt;</code> associe des <strong>clés</strong> (type <code>K</code>) à des <strong>valeurs</strong> (type <code>V</code>). Elle garde les entrées triées par clé et permet une recherche efficace. Ici : identifiant du jeu → nom du jeu.</p>

<h3>2. Tester la présence</h3>
<pre class="pseudo">if (catalogue.count(2)) { }                 // .count(clé) renvoie 1 si la clé existe, 0 sinon
auto it = catalogue.find(2);                // .find(clé) renvoie un ITÉRATEUR (voir §5) vers l'entrée, ou end() si absente
if (it != catalogue.end())                  // end() = "au-delà du dernier" : si it n'est pas end(), la clé existe
    std::cout &lt;&lt; it-&gt;second;                // it-&gt;second = la VALEUR de l'entrée trouvée (-&gt; car it est un pointeur généralisé)</pre>
<div class="warn">Attention : <code>catalogue[42]</code> <strong>crée</strong> l'entrée si elle n'existe pas encore (avec une valeur par défaut) ! Pour seulement <em>vérifier</em> l'existence d'une clé, utilise <code>count</code> ou <code>find</code>, jamais <code>[]</code>.</div>

<h3>3. Parcourir une map (C++17)</h3>
<pre class="pseudo">for (const auto&amp; [id, nom] : catalogue)     // structured bindings : déballe chaque entrée en deux variables id (clé) et nom (valeur)
    std::cout &lt;&lt; id &lt;&lt; " -&gt; " &lt;&lt; nom &lt;&lt; "\\n"; // affiche "clé -> valeur" pour chaque entrée, puis va à la ligne</pre>
<p>Chaque élément d'une map est une <strong>paire</strong> (<code>.first</code> = la clé, <code>.second</code> = la valeur). Les <em>structured bindings</em> (la syntaxe <code>[id, nom]</code>, apparue en C++17) déballent cette paire en deux variables nommées, bien plus lisibles que <code>.first</code>/<code>.second</code>.</p>

<h3>4. std::set : des éléments uniques</h3>
<pre class="pseudo">#include &lt;set&gt;                              // pour disposer du conteneur std::set
std::set&lt;std::string&gt; categories = {"Strategie", "Famille"};  // un ensemble de textes uniques, triés
categories.insert("Strategie");            // .insert ajoute un élément... mais "Strategie" existe déjà → ignoré
std::cout &lt;&lt; categories.size();            // .size() = 2 : aucun doublon n'a été ajouté</pre>
<p>Un <code>std::set</code> stocke des éléments <strong>uniques</strong> et triés. Insérer un doublon est sans effet. Idéal pour une liste de choses sans répétition (des catégories, des identifiants distincts…).</p>

<h3>5. Les itérateurs</h3>
<pre class="pseudo">auto it = catalogue.begin();     // begin() renvoie un itérateur pointant vers le PREMIER élément
++it;                            // ++it fait AVANCER l'itérateur vers l'élément suivant
std::cout &lt;&lt; it-&gt;first;          // it-&gt;first = la clé de l'élément pointé (accès via la flèche -&gt;)</pre>
<div class="tip">Un <strong>itérateur</strong> est un « pointeur généralisé » vers un élément d'un conteneur : un objet qui sait où l'on est dans la collection et comment avancer. <code>begin()</code> pointe sur le début, <code>end()</code> juste après le dernier élément (une sentinelle de fin). Le for-range et les algorithmes STL s'appuient sur les itérateurs — tu les utilises souvent sans même les voir.</div>`,
  exercises: [
    { type: "qcm", q: "std::map associe…", opts: ["des indices à des valeurs", "des clés à des valeurs (triées par clé)", "que des int", "des fichiers"], a: 1, exp: "K → V, recherche efficace." },
    { type: "qcm", q: "<code>catalogue[1] = \"Catan\";</code> fait…", opts: ["lire seulement", "insère ou modifie l'entrée de clé 1", "supprime", "trie"], a: 1, exp: "[] insère/modifie." },
    { type: "qcm", q: "Pour tester la présence d'une clé sans la créer :", opts: ["catalogue[k]", "catalogue.count(k) ou find(k)", "catalogue.size()", "catalogue.at() toujours"], a: 1, exp: "[] créerait l'entrée." },
    { type: "qcm", q: "<code>catalogue[42]</code> sur une clé absente…", opts: ["renvoie une erreur", "crée l'entrée avec une valeur par défaut", "renvoie -1", "plante"], a: 1, exp: "D'où count/find pour vérifier." },
    { type: "qcm", q: "Un élément de map est…", opts: ["un int", "une paire (.first = clé, .second = valeur)", "une chaîne", "un vector"], a: 1, exp: "std::pair<K,V>." },
    { type: "qcm", q: "Les structured bindings <code>[id, nom]</code> servent à…", opts: ["trier", "déballer une paire clé/valeur proprement", "copier", "compiler"], a: 1, exp: "C++17, très lisible." },
    { type: "qcm", q: "std::set stocke…", opts: ["des doublons", "des éléments uniques, triés", "des paires", "des indices"], a: 1, exp: "Pas de répétition." },
    { type: "qcm", q: "Insérer un élément déjà présent dans un set…", opts: ["le duplique", "est sans effet", "plante", "le supprime"], a: 1, exp: "Unicité garantie." },
    { type: "qcm", q: "Qu'est-ce qu'un itérateur ?", opts: ["un entier", "un « pointeur généralisé » vers un élément d'un conteneur", "une classe", "une boucle"], a: 1, exp: "begin()/end()." },
    { type: "qcm", q: "end() pointe…", opts: ["vers le dernier élément", "juste APRÈS le dernier élément", "vers le premier", "vers NULL"], a: 1, exp: "Sentinelle de fin." },
    { type: "vf", q: "Le for-range et les algorithmes STL reposent sur les itérateurs.", a: true, exp: "Souvent utilisés sans les voir." },
    { type: "qcm", q: "it->second sur une map donne…", opts: ["la clé", "la valeur associée", "la taille", "une erreur"], a: 1, exp: ".first = clé, .second = valeur." },
    { type: "qcm", q: "find renvoie, si absent…", opts: ["nullptr", "un itérateur égal à end()", "0", "une exception"], a: 1, exp: "On compare à end()." },
    { type: "qcm", q: "Une map est triée par…", opts: ["valeur", "clé", "ordre d'insertion", "hasard"], a: 1, exp: "Clés ordonnées." },
    { type: "qcm", q: "Pour un id → nom, on utilise…", opts: ["un vector", "une std::map<int, std::string>", "un set", "une string"], a: 1, exp: "Association clé/valeur." }
  ],
  final: {
    title: "Exercice final — Le catalogue par id",
    intro: `<p>On gère un catalogue par identifiant. Analyse :</p>
<pre class="pseudo">std::map&lt;int, std::string&gt; cat;   // map : id → nom
cat[1] = "Catan";                 // ajoute le jeu 1
if (cat[2] == "")                 // PROBLÈME : cat[2] CRÉE l'entrée 2 (avec "") au lieu de juste tester sa présence
    std::cout &lt;&lt; "absent";
for (auto p : cat)                // p est une PAIRE (clé, valeur) ; de plus "auto p" copie chaque paire
    std::cout &lt;&lt; p;               // PROBLÈME : on ne peut pas afficher une paire directement (il faut p.first / p.second)</pre>`,
    questions: [
      { type: "qcm", q: "Problème n°1 — <code>cat[2]</code> pour tester la présence :", opts: ["correct", "cat[2] CRÉE l'entrée 2 : utiliser count(2) ou find(2)", "trop lent", "rien"], a: 1, exp: "[] insère l'entrée absente." },
      { type: "qcm", q: "Problème n°2 — <code>std::cout << p;</code> où p est une paire :", opts: ["correct", "on ne peut pas afficher une paire directement : p.first / p.second", "il faut un cast", "rien"], a: 1, exp: "Déballer la paire." },
      { type: "qcm", q: "Meilleur parcours :", opts: ["for (auto p : cat)", "for (const auto& [id, nom] : cat)", "for (int i)", "while(cat)"], a: 1, exp: "Structured bindings + const&." },
      { type: "qcm", q: "Pour tester la présence proprement :", opts: ["cat[2]", "if (cat.count(2))", "cat.size()", "cat.at(2)"], a: 1, exp: "count ne crée rien." },
      { type: "qcm", q: "Une map garantit que les clés sont…", opts: ["dupliquées", "uniques et triées", "aléatoires", "négatives"], a: 1, exp: "Une clé, une entrée." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                            // pour std::cout (afficher)
#include &lt;map&gt;                                 // pour std::map (table d'association)
#include &lt;string&gt;                              // pour std::string (le texte)

int main() {                                   // point d'entrée du programme
    std::map&lt;int, std::string&gt; cat;            // map : id → nom
    cat[1] = "Catan";                          // ajoute le jeu 1

    if (cat.count(2) == 0)                      // count : teste la présence SANS créer d'entrée
        std::cout &lt;&lt; "Jeu 2 absent\\n";         // affiché si la clé 2 n'existe pas

    for (const auto&amp; [id, nom] : cat)          // structured bindings + const& : déballe chaque entrée sans copie
        std::cout &lt;&lt; id &lt;&lt; " -&gt; " &lt;&lt; nom &lt;&lt; "\\n"; // affiche "clé -> valeur"
    return 0;                                  // 0 = fin sans erreur
}</pre>
<p><code>count</code>/<code>find</code> pour tester sans créer, structured bindings pour parcourir. Demain : les algorithmes STL et les lambdas.</p>`
  }
};

    note: "compte[c]++ exploite le fait que [] crée l'entrée (à 0) si absente : idiome classique de comptage. La map trie les catégories par ordre alphabétique, et les structured bindings rendent le parcours limpide." }
