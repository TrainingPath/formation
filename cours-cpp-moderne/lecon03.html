<script>
var DAY = {
  num: 3,
  title: "Références et const",
  subtitle: "La référence : un autre nom pour une variable — plus simple et plus sûre que le pointeur.",
  theory: `
<h3>1. La référence : un alias</h3>
<p>Rappel : une <strong>variable</strong> est une boîte nommée en mémoire. Une <strong>référence</strong> est simplement un <strong>second nom</strong> (un « alias », un surnom) pour une variable qui existe déjà. Il n'y a pas de nouvelle boîte : la référence désigne exactement la même case mémoire. Donc modifier la référence, c'est modifier la variable d'origine. On la déclare en collant le symbole <code>&amp;</code> au type.</p>
<pre class="pseudo">int age = 25;         // une variable classique nommée "age" contenant 25
int&amp; ref = age;       // int& = référence à un int ; "ref" devient un AUTRE nom pour la même boîte que age
ref = 30;             // on écrit 30 via ref... mais c'est la boîte de age qu'on modifie
std::cout &lt;&lt; age;     // affiche 30 : age a bel et bien changé, car ref ET age sont la même case</pre>
<div class="warn">Contrairement au <strong>pointeur</strong> du C (une variable qui contient l'adresse d'une autre), une référence <strong>doit</strong> être initialisée tout de suite et ne peut plus jamais désigner une autre variable ensuite. Elle ne peut pas non plus être « nulle » (vide). C'est plus sûr et plus simple : à l'usage, pas d'étoile <code>*</code> ni d'esperluette <code>&amp;</code> à manipuler.</div>

<h3>2. Modifier un argument via une référence</h3>
<p>Une <strong>fonction</strong> est un bloc d'instructions réutilisable. Ses <strong>paramètres</strong> sont les données qu'elle reçoit. Par défaut, un paramètre est une <em>copie</em> de la valeur donnée : la fonction ne touche donc pas l'original. Avec une référence, la fonction agit directement sur la variable d'origine.</p>
<pre class="pseudo">void doubler(int&amp; x) {   // void = ne renvoie rien ; int& x = x est une RÉFÉRENCE à la variable passée par l'appelant
    x *= 2;              // x *= 2 signifie x = x * 2 : on double la variable d'origine (pas une copie)
}
int n = 5;               // une variable n valant 5
doubler(n);              // on appelle la fonction : pas besoin d'écrire &n, la référence s'occupe de tout
std::cout &lt;&lt; n;          // affiche 10 : n a été doublé à l'intérieur de la fonction</pre>
<p>Là où le C exigeait un pointeur (<code>doubler(&amp;n)</code>), le C++ utilise une référence : la fonction modifie directement la variable, sans la syntaxe des pointeurs.</p>

<h3>3. La référence const : lire sans copier</h3>
<p>En collant <code>const</code> devant, on obtient une référence en <strong>lecture seule</strong> : on peut regarder l'objet mais pas le modifier.</p>
<pre class="pseudo">void afficher(const std::string&amp; s) {   // const std::string& s = référence en LECTURE SEULE vers un texte (aucune copie)
    std::cout &lt;&lt; s &lt;&lt; "\\n";              // on lit s pour l'afficher, puis on va à la ligne
}</pre>
<p>Passer un gros objet <strong>par valeur</strong> le copie entièrement, ce qui coûte du temps et de la mémoire. Le passer par <strong><code>const&amp;</code></strong> évite la copie <em>et</em> garantit qu'on ne le modifie pas. C'est le passage « idiomatique » (la façon standard) du C++ pour les objets.</p>

<h3>4. Quand passer par valeur, référence, const&amp; ?</h3>
<pre class="pseudo">int, double, bool …   → par valeur      // petits types : les copier ne coûte quasiment rien
gros objet à lire     → const T&amp;        // on lit sans copier ni modifier (T = le type de l'objet)
gros objet à modifier → T&amp;              // référence non-const : on veut changer l'original</pre>
<div class="tip">Règle simple : les types fondamentaux (int, double…) se passent par valeur ; les objets (string, vector, classes) se passent par <code>const&amp;</code> si on les lit, par <code>&amp;</code> si on les modifie. Cela évite des copies inutiles.</div>`,
  exercises: [
    { type: "qcm", q: "Une référence est…", opts: ["une copie", "un autre nom (alias) pour une variable existante", "un pointeur nul", "un entier"], a: 1, exp: "Modifier la référence modifie l'original." },
    { type: "qcm", q: "Comment déclare-t-on une référence à un int ?", opts: ["int *r = ...", "int& r = age;", "ref int r;", "int r&;"], a: 1, exp: "int& r = age;." },
    { type: "qcm", q: "Une référence peut-elle ne pas être initialisée ?", opts: ["oui", "non : elle doit référencer quelque chose dès sa déclaration", "parfois", "seulement les const"], a: 1, exp: "Pas de référence « vide » ni nulle." },
    { type: "qcm", q: "Une référence peut-elle changer de cible ?", opts: ["oui à volonté", "non : elle reste liée à sa variable d'origine", "une fois", "seulement en const"], a: 1, exp: "Contrairement au pointeur." },
    { type: "qcm", q: "Pour qu'une fonction modifie un int de l'appelant, on passe…", opts: ["par valeur", "par référence (int&)", "par copie", "par const&"], a: 1, exp: "void f(int& x)." },
    { type: "qcm", q: "À l'appel de <code>doubler(int& x)</code>, écrit-on &n ?", opts: ["oui", "non : doubler(n) suffit", "toujours", "*n"], a: 1, exp: "Pas de syntaxe de pointeur." },
    { type: "qcm", q: "À quoi sert <code>const std::string&</code> en paramètre ?", opts: ["copier", "lire un gros objet sans le copier ni le modifier", "le vider", "le trier"], a: 1, exp: "Référence const = zéro copie, lecture seule." },
    { type: "qcm", q: "Passer un gros objet par valeur…", opts: ["est gratuit", "le copie entièrement (coûteux)", "le modifie", "est interdit"], a: 1, exp: "D'où l'usage de const&." },
    { type: "qcm", q: "Un int (petit type) se passe idéalement…", opts: ["par const&", "par valeur", "par pointeur", "par référence toujours"], a: 1, exp: "Copier un int est trivial." },
    { type: "qcm", q: "Une référence peut-elle être nulle ?", opts: ["oui comme un pointeur", "non", "parfois", "en mode const"], a: 1, exp: "Pas de référence nulle en C++." },
    { type: "vf", q: "La référence remplace avantageusement le pointeur du C pour modifier un argument.", a: true, exp: "Plus simple et plus sûre." },
    { type: "qcm", q: "Un gros objet qu'on veut MODIFIER se passe…", opts: ["par valeur", "par T& (référence non-const)", "par const&", "par copie"], a: 1, exp: "Référence modifiable." },
    { type: "qcm", q: "Après <code>int& r = a; r = 9;</code>, que vaut a ?", opts: ["inchangé", "9", "0", "l'adresse de r"], a: 1, exp: "r EST a." },
    { type: "qcm", q: "const& combine…", opts: ["copie + modification", "pas de copie + lecture seule", "pointeur + entier", "rien"], a: 1, exp: "Efficace et sûr." },
    { type: "qcm", q: "La référence évite, par rapport au pointeur…", opts: ["le typage", "les * et & à l'usage, et le risque de nullité", "la compilation", "les classes"], a: 1, exp: "Syntaxe plus simple, plus sûre." }
  ],
  final: {
    title: "Exercice final — Échanger deux valeurs",
    intro: `<p>On veut une fonction qui échange deux entiers. Analyse :</p>
<pre class="pseudo">void echanger(int a, int b) {      // ATTENTION : a et b sont des COPIES (passage par valeur)
    int tmp = a; a = b; b = tmp;   // on échange bien... mais seulement les copies locales
}
int main() {                       // programme principal
    int x = 1, y = 2;              // deux variables : x vaut 1, y vaut 2
    echanger(x, y);                // on appelle la fonction sur x et y
    std::cout &lt;&lt; x &lt;&lt; " " &lt;&lt; y;     // affiche 1 2 : x et y n'ont PAS bougé (on a échangé des copies)
}</pre>`,
    questions: [
      { type: "qcm", q: "Pourquoi x et y ne changent-ils pas ?", opts: ["erreur de syntaxe", "les paramètres sont passés par valeur (copies)", "tmp est faux", "cout est faux"], a: 1, exp: "La fonction modifie des copies." },
      { type: "qcm", q: "La signature qui corrige :", opts: ["void echanger(int a, int b)", "void echanger(int& a, int& b)", "void echanger(const int& a, const int& b)", "int echanger(int a)"], a: 1, exp: "Références non-const pour modifier." },
      { type: "qcm", q: "Faut-il écrire <code>echanger(&x, &y)</code> ?", opts: ["oui", "non : echanger(x, y) suffit avec des références", "toujours", "*x, *y"], a: 1, exp: "Pas de syntaxe de pointeur." },
      { type: "qcm", q: "Pourquoi PAS const& ici ?", opts: ["const& serait préférable", "on doit MODIFIER x et y : const l'interdirait", "const& empêcherait la lecture", "const& provoquerait une copie"], a: 1, exp: "const empêcherait l'échange." },
      { type: "qcm", q: "Après correction, l'affichage est…", opts: ["1 2", "2 1", "1 1", "2 2"], a: 1, exp: "Les valeurs sont interverties." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                     // pour std::cout (afficher)

void echanger(int&amp; a, int&amp; b) {        // int& a et int& b : RÉFÉRENCES → on agit sur les variables d'origine
    int tmp = a; a = b; b = tmp;       // tmp garde a ; a reçoit b ; b reçoit l'ancien a → échange réel
}
int main() {                           // programme principal
    int x = 1, y = 2;                  // x vaut 1, y vaut 2
    echanger(x, y);                    // appel : pas de &, les références suffisent
    std::cout &lt;&lt; x &lt;&lt; " " &lt;&lt; y &lt;&lt; "\\n"; // affiche 2 1 : x et y ont bien été échangés
    return 0;                          // 0 = fin sans erreur
}
// (la STL fournit d'ailleurs std::swap(x, y) qui fait exactement cela)</pre>
<p>Des références non-const pour modifier, sans la lourdeur des pointeurs. Retiens : <code>const&amp;</code> pour lire, <code>&amp;</code> pour modifier. Demain : les entrées/sorties au clavier.</p>`
  }
};
</script>

var ECRITURE = {
  placeholder: "Écris ton code C++ ici…",
  items: [
  { id: "cppm-l03", title: "Appliquer une remise par référence", level: 2,
    statement: "Écris une fonction void appliquerRemise(double& prix, double taux) qui réduit le prix (référence) du pourcentage donné. Écris aussi void afficher(const std::string& nom, double prix) qui affiche sans copier. Teste dans main.",
    hints: [
      "appliquerRemise reçoit une référence non-const : prix *= (1 - taux);",
      "afficher reçoit le nom en const& (lecture seule, pas de copie).",
      "Appelle appliquerRemise(prix, 0.20); (sans &)."
    ],
    lang: "cpp",
    atoi: { cmd: "g++ -std=c++17 prog.cpp -o prog && ./prog", expected: "Catan : 40 euros" },
    checklist: ["appliquerRemise prend le prix en référence non-const (double&) et le modifie via *=.", "afficher prend le nom en const std::string& (lecture seule, sans copie).", "L'appel appliquerRemise(prix, 0.20) se fait sans & et ramène 50 à 40.", "Le programme compile en C++17 et s'exécute sans erreur."],
    solution: "#include <iostream>                      // pour std::cout (afficher)\n#include <string>                        // pour std::string (le texte)\n\nvoid appliquerRemise(double& prix, double taux) {  // prix en reference : on modifie l'original\n    prix *= (1.0 - taux);               // multiplie le prix par (1 - taux) : applique la remise\n}\nvoid afficher(const std::string& nom, double prix) {  // nom en const& : lu sans copie\n    std::cout << nom << \" : \" << prix << \" euros\\n\";  // affiche le nom, le prix, puis va a la ligne\n}\n\nint main() {                             // point d'entree du programme\n    double prix = 50.0;                  // prix de depart : 50\n    appliquerRemise(prix, 0.20);         // applique -20 % : prix devient 40\n    afficher(\"Catan\", prix);             // affiche Catan : 40 euros\n    return 0;                            // 0 = fin sans erreur\n}",
    note: "double& permet de modifier le prix d'origine (sans pointeur). const std::string& lit le nom sans le copier. Ce sont les deux passages idiomatiques du C++ : & pour modifier, const& pour lire." }
  ]
};
