  title: "Variables, types et auto",
  subtitle: "Le typage statique du C++, plus le mot-clé auto qui déduit le type pour toi.",
  theory: `
<h3>1. Déclarer une variable</h3>
<p>Une <strong>variable</strong> est une <strong>boîte nommée</strong> dans la mémoire de l'ordinateur : elle porte un nom (comme <code>age</code>) et contient une valeur (comme 25). <em>Déclarer</em> une variable, c'est la créer en annonçant son <strong>type</strong> (le genre de valeur qu'elle peut contenir) puis, souvent, sa valeur de départ. Le signe <code>=</code> ici veut dire « range la valeur de droite dans la boîte de gauche » (on dit « affecter »).</p>
<pre class="pseudo">int age = 25;                 // int = nombre entier ; on crée la variable "age" et on y range 25
double prix = 44.90;          // double = nombre à virgule ; "prix" vaut 44.90
char lettre = 'A';            // char = un seul caractère ; les apostrophes ' ' entourent UN caractère
bool disponible = true;       // bool = booléen (vrai/faux) ; ici "disponible" vaut true (vrai)
std::string nom = "Catan";    // std::string = texte (chaîne de caractères) ; nécessite #include &lt;string&gt;</pre>
<p>Comme en C, le type est déclaré et fixe (c'est le <strong>typage statique</strong> : une fois qu'une boîte est « int », elle reste « int »). Nouveauté par rapport au C : <code>bool</code> (valeurs <code>true</code> = vrai / <code>false</code> = faux) et <code>std::string</code> (un vrai type texte, bien plus pratique que les tableaux de caractères du C) font partie du langage et de la STL.</p>

<h3>2. Les types de base</h3>
<pre class="pseudo">int          // un entier, par exemple -3, 0, 42
double       // un nombre réel à virgule en "double précision" (le type flottant préféré)
bool         // une valeur logique : true (vrai) ou false (faux)
char         // un unique caractère, écrit entre apostrophes : 'A', '?', '7'
std::string  // une chaîne de caractères, c'est-à-dire un texte (fournie par la STL)</pre>
<p>Le mot « double » vient de <em>double precision</em> : il stocke les décimales avec beaucoup de finesse. Pour un débutant, retiens surtout : <code>int</code> pour compter, <code>double</code> pour les prix et mesures, <code>bool</code> pour oui/non, <code>std::string</code> pour du texte.</p>

<h3>3. auto : laisser le compilateur déduire</h3>
<p><code>auto</code> est un mot-clé qui dit au compilateur : « <strong>devine le type tout seul</strong> à partir de la valeur que je te donne ». C'est comme ne pas préciser l'étiquette de la boîte parce que son contenu la rend évidente.</p>
<pre class="pseudo">auto age = 25;                    // 25 est un entier → le compilateur déduit le type int
auto prix = 44.90;                // 44.90 a une virgule → il déduit le type double
auto nom = std::string("Catan");  // la valeur est un std::string → il déduit std::string</pre>
<div class="warn"><code>auto</code> ne veut PAS dire « sans type » : le type est <strong>déduit de la valeur</strong> à la compilation, puis reste fixe (donc toujours statique). On l'utilise surtout quand le type est évident ou très long à écrire (les « itérateurs », vus à la leçon 15). Pour un débutant, préfère les types explicites tant que tu apprends.</div>

<h3>4. Initialisation moderne avec accolades</h3>
<p><strong>Initialiser</strong>, c'est donner la valeur de départ au moment où l'on crée la variable. Le C++ moderne propose une écriture avec des <strong>accolades</strong> <code>{ }</code>, appelée « initialisation uniforme ».</p>
<pre class="pseudo">int stock{3};              // initialisation "uniforme" (apparue en C++11) : stock vaut 3
double prix{44.90};        // prix vaut 44.90, écrit avec des accolades
std::string nom{"Uno"};    // nom contient le texte "Uno"</pre>
<p>Les accolades <code>{ }</code> sont l'initialisation moderne : elles <strong>interdisent les conversions dangereuses</strong>. Par exemple <code>int x{3.9};</code> est refusé par le compilateur (on perdrait les décimales), alors que l'ancienne écriture <code>int x = 3.9;</code> tronque silencieusement en 3 sans prévenir. Les accolades te protègent donc des pertes de données involontaires (on parle de « rétrécissement »).</p>

<h3>5. const et constexpr</h3>
<p><code>const</code> (abréviation de « constant ») marque une variable comme <strong>non modifiable</strong> : une fois sa valeur donnée, le compilateur refuse toute tentative de la changer.</p>
<pre class="pseudo">const double TVA = 0.20;      // const = valeur qui ne changera JAMAIS ; toute modification sera refusée
constexpr int MAX = 100;      // constexpr = constante dont la valeur est déjà connue à la compilation</pre>
<div class="tip">Utilise <code>const</code> dès qu'une variable ne doit pas changer : le compilateur t'empêche alors de la modifier par erreur, et le code devient plus clair pour qui le lit. <code>constexpr</code> va plus loin : la valeur est calculée dès la compilation (avant même que le programme tourne), ce qui peut accélérer l'exécution.</div>`,

    { type: "qcm", q: "Que garantit <code>constexpr</code> ?", opts: ["rien", "une valeur calculée à la compilation", "un type dynamique", "une chaîne"], a: 1, exp: "Constante connue dès la compilation." },
    { type: "qcm", q: "auto est-il recommandé pour un débutant partout ?", opts: ["oui, partout", "non : préférer les types explicites en apprenant", "jamais utile", "seulement pour les bool"], a: 1, exp: "auto brille surtout pour les types longs (itérateurs)." },
    { type: "vf", q: "auto rend la variable de type dynamique.", a: false, exp: "Faux : le type est déduit puis figé (statique)." },
    { type: "qcm", q: "L'initialisation moderne utilise…", opts: ["des parenthèses seules", "des accolades { }", "des crochets", "le signe =looking"], a: 1, exp: "int x{3}; (C++11)." },
    { type: "qcm", q: "std::string nécessite…", opts: ["<iostream> seul", "#include <string>", "rien", "<vector>"], a: 1, exp: "L'en-tête <string>." },
    { type: "qcm", q: "Quel type pour un prix (décimales) ?", opts: ["int", "double", "bool", "char"], a: 1, exp: "double." },
    { type: "qcm", q: "Modifier une variable const…", opts: ["est permis", "est refusé par le compilateur", "la double", "l'affiche"], a: 1, exp: "const = lecture seule." }
  ],
  final: {
    title: "Exercice final — La fiche d'un jeu",
    intro: `<p>On décrit un jeu. Analyse :</p>
<pre class="pseudo">int nom = "Catan";        // ERREUR : "Catan" est un texte ; un int ne peut pas contenir du texte
auto prix = 44.90;        // OK : 44.90 a une virgule → le type déduit est double
const double tva = 0.20;  // OK : tva est une constante (ne doit pas changer)
tva = 0.21;               // ERREUR : tva est const, on ne peut pas la modifier
int stock{3.5};           // ERREUR : les accolades refusent 3.5 dans un int (rétrécissement double→int)</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — <code>int nom = \"Catan\"</code> :", opts: ["correct", "un texte va dans un std::string, pas un int", "il faut double", "rien"], a: 1, exp: "std::string nom = \"Catan\";." },
      { type: "qcm", q: "<code>auto prix = 44.90;</code> déduit…", opts: ["int", "double (correct)", "string", "erreur"], a: 1, exp: "Type déduit du littéral réel." },
      { type: "qcm", q: "Erreur n°2 — <code>tva = 0.21;</code> :", opts: ["correct", "tva est const : modification interdite", "il faut auto", "rien"], a: 1, exp: "Une const ne se réaffecte pas." },
      { type: "qcm", q: "Erreur n°3 — <code>int stock{3.5}</code> :", opts: ["correct (donne 3)", "refusé : rétrécissement double→int interdit par {}", "donne 4", "rien"], a: 1, exp: "L'init par accolades refuse la conversion." },
      { type: "qcm", q: "Comment stocker 3 jeux en int proprement ?", opts: ["int stock{3};", "int stock = 3.5;", "auto stock = \"3\";", "double stock{3};"], a: 0, exp: "Un entier initialisé par une valeur entière." }
    ],
    solution: `<pre class="pseudo">#include &lt;string&gt;                // pour disposer du type std::string (texte)

std::string nom = "Catan";     // le texte "Catan" est rangé dans un std::string (le bon type)
double prix = 44.90;           // un nombre à virgule → double (ou auto prix = 44.90;)
const double tva = 0.20;       // const : cette valeur ne sera jamais modifiée
int stock{3};                  // init moderne par accolades, avec une valeur entière (3)</pre>
<p>Le bon type pour chaque donnée, <code>const</code> pour ce qui ne bouge pas, l'init par accolades pour éviter les conversions silencieuses. Demain : les références et <code>const</code>.</p>`
  }
};
