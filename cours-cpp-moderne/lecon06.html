  title: "std::string",
  subtitle: "Un vrai type chaîne : comparaison, concaténation et méthodes — fini le char[] du C.",
  theory: `
<h3>1. Créer et afficher</h3>
<p>Un <strong>texte</strong> en informatique s'appelle une <strong>chaîne de caractères</strong> (une suite de lettres, chiffres, espaces…). En C++, le type qui représente un texte est <code>std::string</code> : c'est un <strong>objet</strong> — c'est-à-dire une donnée qui regroupe à la fois un contenu (les caractères) et des <strong>méthodes</strong> (des fonctions attachées à l'objet, qu'on appelle avec un point : <code>nom.size()</code>). Il faut <code>#include &lt;string&gt;</code> pour l'utiliser.</p>
<pre class="pseudo">#include &lt;string&gt;                  // pour disposer du type std::string
std::string nom = "Catan";        // crée une chaîne "nom" contenant le texte Catan
std::string vide;                 // une chaîne vide "" (aucun caractère) tant qu'on n'y met rien
std::cout &lt;&lt; nom &lt;&lt; " (" &lt;&lt; nom.size() &lt;&lt; " lettres)\\n";  // affiche le nom, puis, entre parenthèses, son nombre de lettres, puis va à la ligne</pre>
<p><code>std::string</code> gère sa mémoire tout seul : pas de taille à prévoir à l'avance, pas de caractère de fin <code>'\\0'</code> à gérer (comme l'exigeait le C). La <strong>méthode</strong> <code>.size()</code> (ou son synonyme <code>.length()</code>) donne le nombre de caractères. Le point <code>.</code> signifie « demande à cet objet d'exécuter cette action ».</p>

<h3>2. Comparer et concaténer</h3>
<p><strong>Concaténer</strong> veut dire « mettre bout à bout » deux textes.</p>
<pre class="pseudo">if (nom == "Catan") { }               // == compare ici le CONTENU des deux textes (vrai si identiques) — impossible ainsi en C !
std::string titre = nom + " (dispo)"; // + colle deux chaînes : titre devient "Catan (dispo)"
titre += "!";                         // += ajoute "!" à la FIN de titre (titre devient "Catan (dispo)!")</pre>
<div class="warn">En C, comparer deux chaînes exigeait la fonction <code>strcmp</code>, et les copier <code>strcpy</code>. En C++, <code>==</code> compare directement le contenu et <code>+</code> concatène : la <code>std::string</code> se comporte comme une valeur ordinaire, simple à manipuler.</div>

<h3>3. Accéder aux caractères et parcourir</h3>
<p>On accède à un caractère par sa <strong>position</strong> (son « indice »), en comptant à partir de 0 : le premier caractère est à l'indice 0.</p>
<pre class="pseudo">char premier = nom[0];             // nom[0] = le caractère à la position 0 (le 1er) : ici 'C'
nom[0] = 'K';                      // on remplace le 1er caractère : "Catan" devient "Katan"
for (char c : nom) std::cout &lt;&lt; c &lt;&lt; "-";  // boucle for-range : POUR CHAQUE caractère c de nom, l'afficher suivi d'un tiret</pre>

<h3>4. Quelques méthodes utiles</h3>
<pre class="pseudo">nom.empty();                       // renvoie true (vrai) si la chaîne est vide, false sinon
nom.substr(0, 3);                  // sous-chaîne : 3 caractères à partir de l'indice 0 → "Cat"
nom.find("ta");                    // cherche "ta" : renvoie sa position, ou std::string::npos s'il est absent
std::to_string(42);                // convertit le NOMBRE 42 en TEXTE "42"
std::stoi("42");                   // convertit le TEXTE "42" en NOMBRE 42 (stoi = string to int)</pre>

<h3>5. string et lecture</h3>
<pre class="pseudo">std::string mot;                   // une chaîne pour recevoir un mot
std::cin &gt;&gt; mot;                    // &gt;&gt; lit un seul mot (il s'arrête au premier espace)
std::getline(std::cin, ligne);     // getline lit une ligne entière, espaces compris</pre>
<div class="tip">La <code>std::string</code> est l'un des grands conforts du C++ par rapport au C : sûre (pas de débordement de mémoire), expressive (<code>+</code>, <code>==</code>), et pleine de méthodes toutes prêtes. Utilise-la partout pour du texte.</div>`,
  exercises: [
    { type: "qcm", q: "Comment obtenir la longueur d'une std::string ?", opts: ["strlen(s)", "s.size() ou s.length()", "sizeof(s)", "s.count()"], a: 1, exp: "Méthode .size()." },
    { type: "qcm", q: "Comment compare-t-on deux std::string ?", opts: ["strcmp", "avec == (compare le contenu)", "s.equals", "impossible"], a: 1, exp: "== fonctionne en C++ (pas en C)." },
    { type: "qcm", q: "Comment concatène-t-on deux std::string ?", opts: ["strcat", "avec + (ou +=)", "concat()", "&"], a: 1, exp: "titre = a + b;." },
    { type: "qcm", q: "std::string gère sa mémoire…", opts: ["à la main", "automatiquement (pas de taille, pas de '\\0')", "jamais", "avec malloc"], a: 1, exp: "Confort par rapport au char[]." },
    { type: "qcm", q: "Comment accéder au 1er caractère ?", opts: ["s.first", "s[0]", "s(0)", "s.char(0)"], a: 1, exp: "Indexation comme un tableau." },
    { type: "qcm", q: "Que renvoie find quand le motif est absent ?", opts: ["-1", "std::string::npos", "0", "une exception"], a: 1, exp: "npos = « pas trouvé »." },
    { type: "qcm", q: "Comment convertir un int en string ?", opts: ["(string)42", "std::to_string(42)", "itoa", "str(42)"], a: 1, exp: "std::to_string." },
    { type: "qcm", q: "Comment convertir \"42\" en int ?", opts: ["atoi obligatoire", "std::stoi(\"42\")", "(int)\"42\"", "parse"], a: 1, exp: "std::stoi (string to int)." },
    { type: "qcm", q: "s.substr(0, 3) sur \"Catan\" donne…", opts: ["\"Catan\"", "\"Cat\"", "\"tan\"", "\"C\""], a: 1, exp: "3 caractères à partir de 0." },
    { type: "qcm", q: "s.empty() renvoie true si…", opts: ["s vaut \"0\"", "s est vide (\"\")", "s a des espaces", "jamais"], a: 1, exp: "Chaîne sans caractère." },
    { type: "vf", q: "En C++, on peut comparer deux std::string avec ==.", a: true, exp: "== compare le contenu, contrairement au C." },
    { type: "qcm", q: "Comment parcourir une string caractère par caractère ?", opts: ["for (int i)", "for (char c : s)", "while(s)", "impossible"], a: 1, exp: "for-range sur la string." },
    { type: "qcm", q: "Quel en-tête pour std::string ?", opts: ["<iostream> seul", "<string>", "<cstring>", "<str>"], a: 1, exp: "#include <string>." },
    { type: "qcm", q: "titre += \"!\" fait…", opts: ["remplace titre", "ajoute \"!\" à la fin de titre", "compare", "efface"], a: 1, exp: "Concaténation en place." },
    { type: "qcm", q: "std::cin >> mot lit…", opts: ["une ligne", "un mot (jusqu'à l'espace)", "un caractère", "rien"], a: 1, exp: "getline pour une ligne." }
  ],
  final: {
    title: "Exercice final — L'étiquette d'un jeu",
    intro: `<p>On construit une étiquette. Analyse ce code (style C dans un fichier C++) :</p>
<pre class="pseudo">char nom[5] = "Catan";     // style C : tableau de char de taille fixe (fragile ; "Catan" a même besoin de 6 cases avec le '\\0')
if (nom == "Catan") { }    // PROBLÈME : sur un char[], == compare des ADRESSES mémoire, pas le contenu
int n = strlen(nom);       // strlen = fonction du C pour la longueur (nécessite &lt;cstring&gt;)</pre>`,
    questions: [
      { type: "qcm", q: "Problème n°1 — <code>char nom[5]</code> :", opts: ["correct", "style C fragile : préférer std::string (pas de taille à gérer)", "il faut char[4]", "il faut inclure <cstring>"], a: 1, exp: "std::string est plus sûre." },
      { type: "qcm", q: "Problème n°2 — <code>nom == \"Catan\"</code> sur un char[] :", opts: ["compare le contenu", "compare des adresses (faux) ; avec std::string, == marcherait", "toujours vrai", "erreur de compilation"], a: 1, exp: "En C++, on utilise std::string pour ==." },
      { type: "qcm", q: "Version C++ idiomatique du nom :", opts: ["char nom[5]", "std::string nom = \"Catan\";", "int nom", "char* nom"], a: 1, exp: "std::string." },
      { type: "qcm", q: "Longueur en C++ :", opts: ["strlen", "nom.size()", "sizeof", "count"], a: 1, exp: "Méthode .size()." },
      { type: "qcm", q: "Avantage de std::string ici :", opts: ["plus lent", "sûre, comparable avec ==, sans gestion mémoire", "moins de méthodes", "aucun"], a: 1, exp: "Confort et sécurité." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                      // pour std::cout (afficher)
#include &lt;string&gt;                        // pour std::string (le texte)

int main() {                             // point d'entrée du programme
    std::string nom = "Catan";           // un vrai objet texte (gère sa mémoire seul)
    if (nom == "Catan")                  // == compare bien le CONTENU des deux textes
        std::cout &lt;&lt; "C'est bien Catan\\n"; // affiché si les deux textes sont identiques
    std::string titre = nom + " (dispo)"; // + concatène : titre = "Catan (dispo)"
    std::cout &lt;&lt; titre &lt;&lt; " — " &lt;&lt; titre.size() &lt;&lt; " caracteres\\n";  // affiche le titre et sa longueur
    return 0;                            // 0 = fin sans erreur
}</pre>
<p>La <code>std::string</code> remplace avantageusement le <code>char[]</code> : <code>==</code>, <code>+</code>, <code>.size()</code>, sans gérer la mémoire. Demain : <code>std::vector</code>.</p>`
  }
};
