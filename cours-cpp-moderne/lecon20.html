<script>
var DAY = {
  num: 20,
  title: "Projet guidé : le gestionnaire de tâches",
  subtitle: "Assembler le C++ moderne : une classe, un std::vector, la STL et un menu.",
  theory: `
<h3>1. Le cahier des charges</h3>
<p>Un <strong>cahier des charges</strong> décrit ce que le programme doit faire. Ici : un <strong>gestionnaire de tâches</strong> en console (une application au clavier/écran, sans fenêtres) qui permet d'ajouter une tâche, de les lister, et d'en marquer une comme faite. On va réunir tout le C++ moderne : une <strong>classe</strong> (leçon 9), un <code>std::vector</code> (leçon 7), la STL et une boucle de menu.</p>

<h3>2. La classe Tache</h3>
<pre class="pseudo">#include &lt;string&gt;                                    // pour std::string (le titre de la tâche)
class Tache {                                         // une classe représentant UNE tâche
    std::string titre_;                               // attribut privé : le libellé de la tâche
    bool faite_ = false;                              // attribut privé : est-elle terminée ? (false = non, par défaut)
public:                                               // interface publique
    Tache(std::string titre) : titre_(titre) {}       // constructeur : reçoit le titre et l'initialise
    const std::string&amp; titre() const { return titre_; }  // getter const : renvoie le titre sans copie (const&)
    bool faite() const { return faite_; }             // getter const : renvoie l'état (true si faite)
    void terminer() { faite_ = true; }                // passe la tâche à "faite" : MODIFIE l'objet → pas const
};                                                    // ; final de la classe</pre>

<h3>3. La classe GestionnaireTaches</h3>
<pre class="pseudo">#include &lt;vector&gt;                                    // pour std::vector (la liste des tâches)
class Gestionnaire {                                  // classe qui gère l'ensemble des tâches
    std::vector&lt;Tache&gt; taches_;                        // attribut privé : la liste de toutes les tâches
public:                                               // interface publique
    void ajouter(const std::string&amp; titre) { taches_.emplace_back(titre); }  // crée une Tache DIRECTEMENT dans le vector (emplace_back)
    void lister() const {                             // affiche toutes les tâches (const : ne modifie rien)
        for (std::size_t i = 0; i &lt; taches_.size(); ++i)  // parcourt les indices 0..size-1 (std::size_t = type entier des tailles)
            std::cout &lt;&lt; i + 1 &lt;&lt; ". [" &lt;&lt; (taches_[i].faite() ? 'X' : ' ')  // numéro (i+1) et état : 'X' si faite, ' ' sinon (ternaire)
                      &lt;&lt; "] " &lt;&lt; taches_[i].titre() &lt;&lt; "\\n";  // puis le titre, puis un retour à la ligne
    }
    void terminer(std::size_t index) {                // marque comme faite la tâche numéro "index" (numéro affiché, à partir de 1)
        if (index &gt;= 1 &amp;&amp; index &lt;= taches_.size())     // vérifie que l'index est valide (dans les bornes) avant d'y toucher
            taches_[index - 1].terminer();            // index - 1 car le vector est indexé à partir de 0
    }
};                                                    // ; final de la classe</pre>
<p><code>emplace_back</code> construit la tâche directement dans le vector (sans créer d'objet temporaire à copier). L'affichage numérote à partir de 1 pour l'utilisateur, alors qu'en interne le vector commence à l'indice 0.</p>

<h3>4. La boucle de menu</h3>
<pre class="pseudo">int choix;                                            // le numéro d'action choisi par l'utilisateur
do {                                                  // do-while : exécute le corps AU MOINS une fois, puis répète tant que la condition est vraie
    std::cout &lt;&lt; "\\n1) Ajouter 2) Lister 3) Terminer 0) Quitter : ";  // affiche le menu
    if (!(std::cin &gt;&gt; choix)) break;                  // lit le choix ; si la saisie échoue, on sort de la boucle (break)
    std::cin.ignore();                                // jette le '\\n' resté après le &gt;&gt; (sinon getline lira une ligne vide)
    if (choix == 1) {                                 // action 1 : ajouter
        std::string t; std::getline(std::cin, t);     // lit le titre complet (une ligne entière, espaces compris)
        g.ajouter(t);                                 // ajoute la tâche au gestionnaire g
    } else if (choix == 2) {                          // action 2 : lister
        g.lister();                                   // affiche toutes les tâches
    } else if (choix == 3) {                          // action 3 : terminer
        std::size_t n; std::cin &gt;&gt; n; g.terminer(n);   // lit un numéro et marque la tâche correspondante comme faite
    }
} while (choix != 0);                                 // on répète tant que l'utilisateur ne tape pas 0 (Quitter)</pre>

<h3>5. Ce qu'on a mobilisé</h3>
<div class="tip">Classe encapsulée (Tache), conteneur STL (<code>std::vector&lt;Tache&gt;</code>), méthodes const, <code>emplace_back</code>, boucle de menu et saisie : c'est le squelette de presque toute petite application C++. On pourrait y ajouter la sauvegarde dans un fichier (leçon 19) et la recherche par algorithme STL (leçon 16).</div>`,
  exercises: [
    { type: "qcm", q: "Quelle classe représente une tâche ?", opts: ["un int", "une classe Tache (titre + état)", "une map", "un fichier"], a: 1, exp: "Encapsule titre et état." },
    { type: "qcm", q: "Le gestionnaire stocke les tâches dans…", opts: ["un tableau C", "un std::vector<Tache>", "une string", "un fichier"], a: 1, exp: "Conteneur STL." },
    { type: "qcm", q: "Que fait emplace_back ?", opts: ["retire", "construit l'élément directement dans le vector (sans copie)", "trie", "vide"], a: 1, exp: "Plus efficace que push_back d'un objet temporaire." },
    { type: "qcm", q: "faite_ = false; à la déclaration est…", opts: ["une erreur", "une initialisation par défaut du membre", "un getter", "un setter"], a: 1, exp: "Valeur initiale du membre." },
    { type: "qcm", q: "terminer() n'est pas const car…", opts: ["elle lit", "elle modifie l'objet (faite_ = true)", "elle est privée", "aucune raison"], a: 1, exp: "Méthode de modification." },
    { type: "qcm", q: "Pourquoi numéroter à partir de 1 à l'affichage ?", opts: ["obligation", "confort utilisateur (le vector reste indexé à 0)", "vitesse", "hasard"], a: 1, exp: "index - 1 en interne." },
    { type: "qcm", q: "titre() renvoie const std::string& pour…", opts: ["copier", "exposer le titre sans copie, en lecture seule", "le modifier", "trier"], a: 1, exp: "Getter efficace." },
    { type: "qcm", q: "Quelle boucle pour le menu ?", opts: ["for figé", "do-while (affiche au moins une fois)", "while sans corps", "aucune"], a: 1, exp: "Répète jusqu'à Quitter." },
    { type: "qcm", q: "Pourquoi std::cin.ignore() après >> avant getline ?", opts: ["pour trier", "jeter le '\\n' résiduel", "vider l'écran", "aucune raison"], a: 1, exp: "Sinon getline lit une ligne vide." },
    { type: "qcm", q: "L'affichage de l'état utilise…", opts: ["un int", "un ternaire : faite() ? 'X' : ' '", "un vector", "une map"], a: 1, exp: "Choisit le caractère d'état." },
    { type: "vf", q: "Encapsuler les tâches dans une classe rend le code plus lisible et sûr.", a: true, exp: "Données protégées, opérations claires." },
    { type: "qcm", q: "terminer(index) vérifie les bornes pour…", opts: ["accélérer", "éviter d'accéder hors du vector", "trier", "rien"], a: 1, exp: "Sécurité." },
    { type: "qcm", q: "Ce projet mobilise notamment…", opts: ["uniquement cout", "classe, vector, méthodes const, menu", "un seul if", "aucune STL"], a: 1, exp: "Synthèse du C++ moderne." },
    { type: "qcm", q: "Une amélioration possible :", opts: ["supprimer les classes", "ajouter la sauvegarde fichier (fstream)", "tout mettre en global", "retirer le vector"], a: 1, exp: "Persistance (leçon 19)." },
    { type: "qcm", q: "Le gestionnaire expose…", opts: ["ses attributs privés", "des méthodes claires (ajouter, lister, terminer)", "rien", "un pointeur brut"], a: 1, exp: "Interface propre." }
  ],
  final: {
    title: "Exercice final — Compléter le gestionnaire",
    intro: `<p>Voici la méthode lister avec des erreurs. Corrige :</p>
<pre class="pseudo">void lister() {                              // PROBLÈME : devrait être const (elle ne fait que lire)
    for (int i = 0; i &lt;= taches_.size(); ++i)  // PROBLÈME : i &lt;= size() déborde (indice size() n'existe pas) ; et int au lieu de std::size_t
        std::cout &lt;&lt; i &lt;&lt; ". " &lt;&lt; taches_[i].titre();  // numéro à partir de 0 (peu lisible) et pas d'état affiché
}</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — <code>i <= taches_.size()</code> :", opts: ["correct", "débordement : i < taches_.size()", "il faut i <= size-1 avec ++", "rien"], a: 1, exp: "Indices 0..size-1." },
      { type: "qcm", q: "La méthode devrait être…", opts: ["non-const", "const (elle ne modifie rien)", "private", "supprimée"], a: 1, exp: "Lecture seule." },
      { type: "qcm", q: "Le numéro affiché serait mieux en…", opts: ["i", "i + 1 (lisibilité utilisateur)", "i - 1", "size()"], a: 1, exp: "Numérotation à partir de 1." },
      { type: "qcm", q: "Comment afficher l'état (fait/à faire) ?", opts: ["impossible", "un ternaire : taches_[i].faite() ? 'X' : ' '", "un vector", "un fichier"], a: 1, exp: "Caractère d'état." },
      { type: "qcm", q: "Le type de l'indice d'un vector est idéalement…", opts: ["int", "std::size_t (non signé)", "double", "char"], a: 1, exp: "size() renvoie un size_t." }
    ],
    solution: `<pre class="pseudo">void lister() const {                                  // const AJOUTÉ : la méthode ne fait que lire
    for (std::size_t i = 0; i &lt; taches_.size(); ++i)   // std::size_t et i &lt; size() : parcours correct, sans débordement
        std::cout &lt;&lt; i + 1 &lt;&lt; ". ["                     // i + 1 : numéro lisible (à partir de 1)
                  &lt;&lt; (taches_[i].faite() ? 'X' : ' ')  // état affiché via un ternaire : 'X' si faite, ' ' sinon
                  &lt;&lt; "] " &lt;&lt; taches_[i].titre() &lt;&lt; "\\n";  // puis le titre, puis un retour à la ligne
}</pre>
<p>Une méthode <code>const</code>, des indices dans les bornes, une numérotation lisible et l'état affiché. Tu as un vrai programme C++ moderne : classes, vector, méthodes const, menu. Demain : l'examen final.</p>`
  }
};
</script>

  { id: "cppm-l20", title: "La classe Tache", level: 3,
    statement: "Écris la classe Tache : membre privé titre_ (std::string) et faite_ (bool, false par défaut), un constructeur prenant le titre, des getters const titre() et faite(), et une méthode terminer() qui passe faite_ à true. Crée une Tache, termine-la, affiche son état.",
    hints: [
      "bool faite_ = false; initialise le membre.",
      "const std::string& titre() const { return titre_; }",
      "void terminer() { faite_ = true; }  (non-const : modifie)."
    ],
    solution: "#include <iostream>                            // pour std::cout (afficher)\n#include <string>                              // pour std::string (le titre)\n\nclass Tache {                                  // classe representant une tache\n    std::string titre_;                        // attribut prive : le titre\n    bool faite_ = false;                       // attribut prive : etat (false par defaut)\npublic:                                        // interface publique\n    Tache(std::string titre) : titre_(titre) {}  // constructeur : initialise le titre\n    const std::string& titre() const { return titre_; }  // getter const : titre sans copie\n    bool faite() const { return faite_; }      // getter const : renvoie l'etat\n    void terminer() { faite_ = true; }         // passe la tache a \"faite\" (modifie -> pas const)\n};                                             // ; final de la classe\n\nint main() {                                   // point d'entree du programme\n    Tache t(\"Ranger les jeux\");                // cree une tache\n    t.terminer();                              // la marque comme faite\n    std::cout << t.titre() << \" : \" << (t.faite() ? \"faite\" : \"a faire\") << \"\\n\";  // affiche titre + etat (ternaire)\n    return 0;                                  // 0 = fin sans erreur\n}",
    note: "Encapsulation complète : titre_ et faite_ sont privés, exposés en lecture par des getters const, et terminer() est la seule façon de changer l'état. faite_ = false initialise le membre à la déclaration. C'est la brique de base du gestionnaire." }
  ]
};
