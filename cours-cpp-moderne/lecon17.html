<script>
var DAY = {
  num: 17,
  title: "Smart pointers (unique_ptr, shared_ptr)",
  subtitle: "Posséder un objet alloué dynamiquement sans jamais oublier de le libérer.",
  theory: `
<h3>1. Le problème du new/delete manuel</h3>
<p>Parfois, on veut créer un objet dont la durée de vie n'est pas liée à un simple bloc : on l'<strong>alloue dynamiquement</strong> (dans une zone mémoire appelée le « tas »). En C, cela se faisait avec <code>new</code> (réserver) et <code>delete</code> (libérer). Un <strong>pointeur</strong> (<code>Jeu*</code>) est une variable qui contient l'<em>adresse</em> de cet objet.</p>
<pre class="pseudo">Jeu* j = new Jeu("Catan", 44.90, 3);   // new alloue un Jeu sur le tas ; j = pointeur (adresse) vers cet objet
// ... si on oublie "delete j;" ici → l'objet reste en mémoire pour toujours : c'est une FUITE mémoire
delete j;                              // delete libère l'objet ; à ne PAS oublier, sur TOUS les chemins possibles</pre>
<p>En C++ moderne, on évite <code>new</code>/<code>delete</code> à la main : on confie la <strong>possession</strong> de l'objet à un <strong>smart pointer</strong> (« pointeur intelligent »), qui le libère automatiquement grâce au principe RAII (leçon 10).</p>

<h3>2. std::unique_ptr : possession exclusive</h3>
<p>Un <code>std::unique_ptr</code> est un objet qui « possède » un objet alloué et le détruit tout seul quand lui-même disparaît.</p>
<pre class="pseudo">#include &lt;memory&gt;                                       // pour les smart pointers (unique_ptr, shared_ptr, make_unique...)
auto j = std::make_unique&lt;Jeu&gt;("Catan", 44.90, 3);      // make_unique crée le Jeu ET le confie à un unique_ptr nommé j
j-&gt;afficher();                                          // on utilise j comme un pointeur : -&gt; appelle une méthode de l'objet possédé
// pas de delete à écrire : l'objet est libéré AUTOMATIQUEMENT quand j sort de sa portée</pre>
<div class="warn">Un <code>unique_ptr</code> a un <strong>seul</strong> propriétaire : il ne se copie pas (deux propriétaires libéreraient deux fois le même objet). Pour transférer la possession à un autre, on utilise <code>std::move</code>. Préfère toujours <code>std::make_unique</code> à <code>new</code>.</div>

<h3>3. Un conteneur de unique_ptr</h3>
<pre class="pseudo">std::vector&lt;std::unique_ptr&lt;Jeu&gt;&gt; catalogue;                    // un vector qui POSSÈDE des Jeu via des unique_ptr
catalogue.push_back(std::make_unique&lt;Jeu&gt;("Uno", 12.50, 10));  // crée un Jeu et l'ajoute au vector (qui en devient propriétaire)
for (const auto&amp; j : catalogue)                                // parcourt chaque unique_ptr sans le copier (const&)
    j-&gt;afficher();                                             // -&gt; accède au Jeu possédé ; tout sera libéré à la fin, automatiquement</pre>
<p>C'est le motif idiomatique quand un objet possède une collection d'objets <strong>polymorphes</strong> : on stocke des <code>unique_ptr&lt;Base&gt;</code>, ce qui permet le polymorphisme (leçon 12) tout en gérant la mémoire automatiquement.</p>

<h3>4. std::shared_ptr : possession partagée</h3>
<pre class="pseudo">auto a = std::make_shared&lt;Jeu&gt;("Risk", 39.0, 2);   // crée un Jeu possédé par un shared_ptr a (compteur de propriétaires = 1)
auto b = a;                                        // b COPIE a : a et b possèdent MAINTENANT le même objet (compteur = 2)
// l'objet n'est libéré que lorsque le DERNIER shared_ptr (a ou b) disparaît (compteur revenu à 0)</pre>
<p>Un <code>shared_ptr</code> peut être <strong>copié</strong> : plusieurs propriétaires se partagent le même objet, qui n'est libéré que lorsque le dernier disparaît (mécanisme de <strong>comptage de références</strong>). À réserver aux cas où le partage est réel et nécessaire.</p>

<h3>5. Lequel choisir ?</h3>
<div class="tip">Règle : <strong>par défaut, un objet local</strong> (aucun pointeur) ; s'il faut vraiment une possession dynamique, <strong><code>unique_ptr</code></strong> (un seul propriétaire) ; <strong><code>shared_ptr</code></strong> seulement si l'objet est réellement partagé entre plusieurs propriétaires. En C++ moderne, on n'écrit <code>new</code>/<code>delete</code> quasiment jamais.</div>`,
  exercises: [
    { type: "qcm", q: "Un smart pointer sert à…", opts: ["accélérer", "posséder un objet et le libérer automatiquement", "trier", "compiler"], a: 1, exp: "RAII pour la mémoire dynamique." },
    { type: "qcm", q: "std::unique_ptr a…", opts: ["plusieurs propriétaires", "un seul propriétaire (possession exclusive)", "aucun", "un compteur"], a: 1, exp: "Ne se copie pas." },
    { type: "qcm", q: "Comment créer un unique_ptr<Jeu> ?", opts: ["new Jeu()", "std::make_unique<Jeu>(...)", "malloc", "Jeu()"], a: 1, exp: "make_unique." },
    { type: "qcm", q: "Faut-il delete un unique_ptr ?", opts: ["oui", "non : libéré automatiquement", "parfois", "toujours deux fois"], a: 1, exp: "RAII s'en charge." },
    { type: "qcm", q: "Pour transférer la possession d'un unique_ptr :", opts: ["le copier", "std::move", "le delete", "impossible"], a: 1, exp: "unique_ptr ne se copie pas." },
    { type: "qcm", q: "std::shared_ptr…", opts: ["ne se copie pas", "peut être copié (possession partagée, comptage)", "est plus rapide toujours", "n'existe pas"], a: 1, exp: "Plusieurs propriétaires." },
    { type: "qcm", q: "Un shared_ptr libère l'objet quand…", opts: ["le premier disparaît", "le DERNIER shared_ptr disparaît (compteur = 0)", "jamais", "on appelle delete"], a: 1, exp: "Comptage de références." },
    { type: "qcm", q: "Quel en-tête pour les smart pointers ?", opts: ["<pointer>", "<memory>", "<smart>", "<ptr>"], a: 1, exp: "#include <memory>." },
    { type: "qcm", q: "Par défaut, pour un objet local, on utilise…", opts: ["un unique_ptr", "aucun pointeur (l'objet lui-même)", "un shared_ptr", "new"], a: 1, exp: "Pas de pointeur si inutile." },
    { type: "qcm", q: "Quand utiliser shared_ptr ?", opts: ["toujours", "seulement en cas de partage réel de possession", "jamais", "pour tout objet local"], a: 1, exp: "Sinon unique_ptr." },
    { type: "vf", q: "En C++ moderne, on utilise new/delete quasiment tout le temps.", a: false, exp: "Faux : on préfère les smart pointers et les objets locaux." },
    { type: "qcm", q: "Un vector<unique_ptr<Jeu>> convient pour…", opts: ["des int", "posséder une collection d'objets (polymorphes)", "trier des chaînes", "rien"], a: 1, exp: "Le vector possède les jeux." },
    { type: "qcm", q: "j->afficher() sur un unique_ptr…", opts: ["est interdit", "accède à l'objet comme un pointeur", "copie l'objet", "le libère"], a: 1, exp: "-> comme un pointeur brut." },
    { type: "qcm", q: "Oublier delete avec new manuel cause…", opts: ["rien", "une fuite mémoire", "une injection", "un tri"], a: 1, exp: "D'où les smart pointers." },
    { type: "qcm", q: "make_unique est préférable à new car…", opts: ["il est plus lent que new", "plus sûr (exception-safe, pas de delete oublié)", "il est moins lisible que new", "il permet le partage de possession"], a: 1, exp: "Sécurité et clarté." }
  ],
  final: {
    title: "Exercice final — Moderniser une allocation",
    intro: `<p>Du code style C dans un fichier C++. Analyse :</p>
<pre class="pseudo">Jeu* j = new Jeu("Catan", 44.90, 3);   // allocation manuelle : j pointe vers un Jeu sur le tas
j-&gt;afficher();                          // utilise l'objet via -&gt;
if (probleme) return 1;                 // BUG : on quitte AVANT le delete → l'objet fuit (jamais libéré)
delete j;                               // ce delete n'est atteint que si "probleme" est faux</pre>`,
    questions: [
      { type: "qcm", q: "Le bug :", opts: ["aucun", "si on return avant delete, l'objet fuit", "trop lent", "rien"], a: 1, exp: "delete non atteint sur le chemin d'erreur." },
      { type: "qcm", q: "La solution moderne :", opts: ["ajouter des delete partout", "utiliser std::make_unique<Jeu>(...)", "malloc", "une variable globale"], a: 1, exp: "unique_ptr libère automatiquement." },
      { type: "qcm", q: "Avec un unique_ptr, le return anticipé…", opts: ["fuit encore", "libère quand même l'objet (RAII)", "plante", "double free"], a: 1, exp: "Destruction garantie en fin de portée." },
      { type: "qcm", q: "On accède à l'objet via…", opts: ["j.afficher()", "j->afficher()", "*j.afficher", "afficher(j)"], a: 1, exp: "-> comme un pointeur." },
      { type: "qcm", q: "Encore mieux si l'objet n'a pas besoin d'être dynamique :", opts: ["garder new", "un simple objet local : Jeu j(\"Catan\", 44.90, 3);", "un shared_ptr", "malloc"], a: 1, exp: "Pas de pointeur du tout." }
    ],
    solution: `<pre class="pseudo">#include &lt;memory&gt;                                     // pour std::make_unique et unique_ptr

auto j = std::make_unique&lt;Jeu&gt;("Catan", 44.90, 3);   // le Jeu est possédé par un unique_ptr
j-&gt;afficher();                                        // utilisation via -&gt; comme un pointeur
if (probleme) return 1;                               // même si on quitte ici, l'objet est libéré AUTOMATIQUEMENT
// pas de delete à écrire : le unique_ptr s'en charge en fin de portée, sur TOUS les chemins

// ... ou, si l'allocation dynamique n'est pas nécessaire :
Jeu local("Catan", 44.90, 3);                         // un simple objet local : encore plus simple et sûr</pre>
<p>Le <code>unique_ptr</code> supprime les fuites et les <code>delete</code> oubliés, même sur les chemins d'erreur. Et souvent, un simple objet local suffit. Demain : les exceptions.</p>`
  }
};
</script>

    checklist: ["Le conteneur est un std::vector<std::unique_ptr<Jeu>>.", "Les jeux sont créés avec std::make_unique, sans aucun new ni delete.", "Le parcours se fait en const auto& et appelle j->afficher().", "Le programme compile en C++17 et affiche les deux jeux."],
    solution: "#include <iostream>                          // pour std::cout (afficher)\n#include <memory>                            // pour std::unique_ptr et std::make_unique\n#include <vector>                            // pour std::vector (la collection)\n#include <string>                            // pour std::string (le texte)\n\nclass Jeu {                                  // classe Jeu\n    std::string nom_; double prix_;          // attributs : nom et prix\npublic:\n    Jeu(std::string n, double p) : nom_(n), prix_(p) {}  // constructeur\n    void afficher() const { std::cout << nom_ << \" : \" << prix_ << \"\\n\"; }  // affiche nom et prix\n};\n\nint main() {                                 // point d'entree du programme\n    std::vector<std::unique_ptr<Jeu>> cat;   // le vector possede les Jeu via des unique_ptr\n    cat.push_back(std::make_unique<Jeu>(\"Catan\", 44.90));  // cree et ajoute un Jeu\n    cat.push_back(std::make_unique<Jeu>(\"Uno\", 12.50));    // cree et ajoute un second Jeu\n    for (const auto& j : cat)                // parcourt chaque unique_ptr sans copie\n        j->afficher();                       // -> accede au Jeu possede et l'affiche\n    return 0;                                // tout est libere automatiquement (RAII)\n}",
    note: "Le vector possède les jeux via des unique_ptr : à la fin, chaque objet est libéré automatiquement (RAII), sans un seul delete. C'est le motif standard pour posséder une collection d'objets en C++ moderne." }
