<script>
var DAY = {
  num: 16,
  title: "Algorithmes STL et lambdas",
  subtitle: "Trier, chercher, transformer — sans écrire de boucles, grâce aux algorithmes et aux fonctions anonymes.",
  theory: `
<h3>1. La lambda : une fonction anonyme</h3>
<p>Une <strong>lambda</strong> est une petite <strong>fonction sans nom</strong> (« anonyme ») que l'on écrit directement là où on en a besoin. Sa forme est <code>[](paramètres){ corps }</code> : les crochets <code>[]</code> ouvrent la lambda (et servent à la « capture », voir plus bas), les parenthèses listent les paramètres, les accolades contiennent le code.</p>
<pre class="pseudo">auto estCher = [](double prix) { return prix &gt; 30; };  // crée une fonction anonyme rangée dans estCher : "prix est-il > 30 ?"
std::cout &lt;&lt; estCher(44.90);   // on l'appelle comme une fonction normale : 44.90 > 30 est vrai → affiche 1 (true)</pre>
<p>Une <strong>lambda</strong> <code>[](params){ corps }</code> est donc une petite fonction créée sur place. On la passe aux algorithmes de la STL pour leur définir un <strong>critère</strong> « à la volée » (par exemple : comment comparer, quoi chercher).</p>

<h3>2. std::sort avec un critère</h3>
<p>Un <strong>algorithme</strong> de la STL est une fonction toute prête qui agit sur une plage d'éléments, délimitée par deux itérateurs : <code>begin()</code> (début) et <code>end()</code> (juste après la fin).</p>
<pre class="pseudo">#include &lt;algorithm&gt;                                     // pour std::sort, find_if, count_if...
std::vector&lt;double&gt; prix = {44.90, 12.50, 39.0};         // une liste de prix
std::sort(prix.begin(), prix.end());                     // trie la plage dans l'ordre CROISSANT (par défaut)
std::sort(prix.begin(), prix.end(),                      // trie à nouveau...
          [](double a, double b) { return a &gt; b; });     // ...mais avec un critère : a AVANT b si a > b → ordre DÉCROISSANT</pre>

<h3>3. Chercher : find_if, count_if</h3>
<pre class="pseudo">auto it = std::find_if(prix.begin(), prix.end(),         // find_if cherche le PREMIER élément qui satisfait le critère...
                       [](double p) { return p &gt; 30; }); // ...ici : le premier prix > 30 ; renvoie un itérateur
if (it != prix.end()) std::cout &lt;&lt; *it;                  // si trouvé (it n'est pas end()), *it = la valeur pointée

int n = std::count_if(prix.begin(), prix.end(),          // count_if COMPTE les éléments qui satisfont le critère...
                      [](double p) { return p &lt; 20; });   // ...ici : combien de prix sont < 20</pre>

<h3>4. Capturer des variables</h3>
<p><strong>Capturer</strong>, c'est permettre à la lambda d'utiliser une variable qui existe autour d'elle. On liste ces variables entre les crochets <code>[]</code>.</p>
<pre class="pseudo">double seuil = 30;                                        // une variable locale
auto chers = std::count_if(prix.begin(), prix.end(),      // compte les prix satisfaisant le critère...
             [seuil](double p) { return p &gt; seuil; });    // [seuil] : la lambda CAPTURE seuil (par copie) pour l'utiliser dedans</pre>
<div class="warn">Les crochets <code>[]</code> d'une lambda capturent les variables du contexte : <code>[seuil]</code> par copie (une photo de la valeur), <code>[&amp;seuil]</code> par référence (la variable elle-même), <code>[=]</code> tout par copie, <code>[&amp;]</code> tout par référence. Utilise la capture minimale nécessaire pour garder le code clair.</div>

<h3>5. Transformer : for_each, accumulate</h3>
<pre class="pseudo">std::for_each(prix.begin(), prix.end(),                  // for_each applique une action à chaque élément...
              [](double&amp; p) { p *= 1.05; });             // ...ici : double& p (référence) → augmente CHAQUE prix de 5 %
#include &lt;numeric&gt;                                        // pour std::accumulate
double total = std::accumulate(prix.begin(), prix.end(), 0.0);  // accumulate ADDITIONNE tous les éléments en partant de 0.0</pre>
<div class="tip">Préfère les algorithmes STL aux boucles écrites à la main : ils sont clairs (le nom dit l'intention : <code>sort</code> = trier, <code>find_if</code> = trouver, <code>count_if</code> = compter), corrects (pas de risque de débordement d'indice) et souvent optimisés. La lambda, elle, exprime le critère localement, au plus près de l'usage.</div>`,
  exercises: [
    { type: "qcm", q: "Une lambda est…", opts: ["une classe", "une fonction anonyme définie sur place", "un template", "un itérateur"], a: 1, exp: "[](params){ corps }." },
    { type: "qcm", q: "Quel algorithme trie un vector ?", opts: ["std::order", "std::sort", "std::arrange", "v.sort()"], a: 1, exp: "std::sort(begin, end)." },
    { type: "qcm", q: "Comment trier en ordre décroissant ?", opts: ["std::sort seul", "std::sort avec une lambda [](a,b){return a>b;}", "impossible", "std::reverse_sort"], a: 1, exp: "Un comparateur en lambda." },
    { type: "qcm", q: "std::find_if renvoie…", opts: ["un booléen", "un itérateur vers le premier élément satisfaisant le critère", "un int", "rien"], a: 1, exp: "== end() si aucun." },
    { type: "qcm", q: "std::count_if compte…", opts: ["tous les éléments", "les éléments satisfaisant un critère (lambda)", "les doublons", "les clés"], a: 1, exp: "Selon le prédicat." },
    { type: "qcm", q: "Dans <code>[seuil](double p){...}</code>, [seuil] fait…", opts: ["rien", "capturer seuil par copie", "trier", "supprimer seuil"], a: 1, exp: "Capture par valeur." },
    { type: "qcm", q: "[&x] capture x…", opts: ["par copie", "par référence", "pas du tout", "en const"], a: 1, exp: "& = référence." },
    { type: "qcm", q: "Que fait std::accumulate ?", opts: ["trie", "somme (ou réduit) les éléments", "cherche", "compte"], a: 1, exp: "Réduction, de <numeric>." },
    { type: "qcm", q: "std::for_each avec [](double& p){ p*=1.05; } fait…", opts: ["lit", "modifie chaque élément (+5 %)", "trie", "compte"], a: 1, exp: "Référence → modification." },
    { type: "qcm", q: "Pourquoi préférer les algorithmes STL aux boucles ?", opts: ["ils sont plus lents", "plus clairs, corrects (pas de débordement) et optimisés", "ils sont moins lisibles", "ils utilisent moins de mémoire"], a: 1, exp: "Intention explicite." },
    { type: "vf", q: "Une lambda peut capturer des variables du contexte via les crochets [].", a: true, exp: "[x], [&x], [=], [&]." },
    { type: "qcm", q: "std::find_if != end() signifie…", opts: ["rien trouvé", "un élément a été trouvé", "erreur", "vector vide"], a: 1, exp: "L'itérateur pointe l'élément." },
    { type: "qcm", q: "Quel en-tête pour sort, find_if, count_if ?", opts: ["<vector>", "<algorithm>", "<numeric>", "<map>"], a: 1, exp: "#include <algorithm>." },
    { type: "qcm", q: "accumulate est dans…", opts: ["<algorithm>", "<numeric>", "<vector>", "<string>"], a: 1, exp: "#include <numeric>." },
    { type: "qcm", q: "La capture minimale est préférable car…", opts: ["c'est imposé par le compilateur", "elle limite les effets de bord et clarifie les dépendances", "une capture large est plus rapide", "cela réduit la taille du binaire"], a: 1, exp: "On capture ce dont on a besoin." }
  ],
  final: {
    title: "Exercice final — Trier et filtrer",
    intro: `<p>On veut trier les prix décroissant puis compter ceux au-dessus d'un seuil. Analyse :</p>
<pre class="pseudo">std::vector&lt;double&gt; prix = {44.90, 12.50, 39.0, 5.0};   // une liste de 4 prix
std::sort(prix);                       // ERREUR : std::sort attend DEUX itérateurs, pas le vector entier
int n = 0;                             // compteur des prix > 30
for (double p : prix) if (p &gt; 30) n++;  // fonctionne, mais std::count_if serait plus clair</pre>`,
    questions: [
      { type: "qcm", q: "Erreur — <code>std::sort(prix)</code> :", opts: ["correct", "std::sort prend deux itérateurs : sort(prix.begin(), prix.end())", "il faut prix.sort()", "rien"], a: 1, exp: "sort(begin, end[, comp])." },
      { type: "qcm", q: "Pour trier décroissant :", opts: ["sort(begin,end)", "sort(begin, end, [](double a,double b){return a>b;})", "reverse", "impossible"], a: 1, exp: "Comparateur en lambda." },
      { type: "qcm", q: "La boucle de comptage peut être remplacée par…", opts: ["rien", "std::count_if avec une lambda p>30", "std::sort", "std::find"], a: 1, exp: "Plus clair et concis." },
      { type: "qcm", q: "Une lambda pour « > 30 » s'écrit…", opts: ["[](double p){ return p > 30; }", "double p > 30", "{ p > 30 }", "lambda(p)"], a: 0, exp: "[](params){ corps }." },
      { type: "qcm", q: "L'intérêt des algorithmes STL :", opts: ["plus de lignes", "exprimer l'intention (sort, count_if) sans boucle manuelle", "moins sûr", "plus lent"], a: 1, exp: "Clarté et correction." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                                    // pour std::cout (afficher)
#include &lt;vector&gt;                                      // pour std::vector (la liste)
#include &lt;algorithm&gt;                                   // pour std::sort et std::count_if

int main() {                                           // point d'entrée du programme
    std::vector&lt;double&gt; prix = {44.90, 12.50, 39.0, 5.0};  // les 4 prix
    std::sort(prix.begin(), prix.end(),                // trie la plage begin..end...
              [](double a, double b) { return a &gt; b; });     // ...avec un critère décroissant (a avant b si a > b)

    int n = std::count_if(prix.begin(), prix.end(),    // compte les éléments...
                          [](double p) { return p &gt; 30; });  // ...dont le prix dépasse 30
    std::cout &lt;&lt; n &lt;&lt; " jeu(x) au-dessus de 30\\n";     // affiche le nombre trouvé
    for (double p : prix) std::cout &lt;&lt; p &lt;&lt; " ";        // affiche la liste triée
    std::cout &lt;&lt; "\\n";                                 // va à la ligne
    return 0;                                          // 0 = fin sans erreur
}</pre>
<p>Les algorithmes STL (avec lambdas) remplacent avantageusement les boucles : intention claire, code sûr. Demain : les smart pointers.</p>`
  }
};
</script>

    statement: "À partir d'un std::vector<double> de prix, utilise std::max_element (avec une lambda si besoin) pour trouver le prix maximal, et std::count_if pour compter les prix > 20. Affiche les deux résultats.",

    ],
    lang: "cpp",
    atoi: { cmd: "g++ -std=c++17 prog.cpp -o prog && ./prog", expected: "Prix max : 55\n3 prix > 20" },
    checklist: ["std::max_element renvoie un itérateur qui est déréférencé (*it) pour obtenir le prix max.", "std::count_if reçoit une lambda [](double p){ return p > 20; }.", "Le fichier inclut <algorithm>.", "Le programme compile en C++17 et affiche 55 puis 3 prix > 20."],
    solution: "#include <iostream>                          // pour std::cout (afficher)\n#include <vector>                            // pour std::vector (la liste)\n#include <algorithm>                         // pour std::max_element et std::count_if\n\nint main() {                                 // point d'entree du programme\n    std::vector<double> prix = {44.90, 12.50, 39.0, 5.0, 55.0};  // les prix\n    auto it = std::max_element(prix.begin(), prix.end());  // iterateur vers le plus grand prix\n    int n = std::count_if(prix.begin(), prix.end(),        // compte les prix...\n                          [](double p) { return p > 20; });  // ...superieurs a 20\n    std::cout << \"Prix max : \" << *it << \"\\n\";  // *it = la valeur maximale\n    std::cout << n << \" prix > 20\\n\";           // affiche le nombre de prix > 20\n    return 0;                                // 0 = fin sans erreur\n}",

  ]
};
