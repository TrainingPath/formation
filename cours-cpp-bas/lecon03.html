  "subtitle": "Une variable qui contient une adresse mémoire : le mécanisme fondamental du C et du C++.",
  "theory": "\n<h3>1. La mémoire, l'adresse et le pointeur</h3>\n<p>La <strong>mémoire</strong> (la RAM) de l'ordinateur est comme une immense rue de casiers numérotés. Chaque casier a un <strong>numéro unique</strong> : c'est son <strong>adresse</strong>. Quand tu crées une variable, l'ordinateur lui attribue un (ou plusieurs) casier(s) à une certaine adresse, et y range sa valeur. Une variable a donc deux choses : une <strong>valeur</strong> (ce qu'il y a dedans) et une <strong>adresse</strong> (où elle se trouve).</p>\n<p>Un <strong>pointeur</strong> est une variable spéciale dont la valeur est… une adresse. Autrement dit, un pointeur ne contient pas un nombre « normal », il contient <strong>l'emplacement</strong> d'une autre variable — comme un bout de papier sur lequel tu as noté le numéro d'un casier. C'est le mécanisme fondamental du C et du C++.</p>\n<pre class=\"pseudo\">int age = 25;          // variable normale : le casier \"age\" contient la valeur 25\nint* p = &amp;age;         // p est un POINTEUR vers int ; on y range l'ADRESSE de age (&amp;age)\nstd::cout &lt;&lt; p;         // affiche l'ADRESSE contenue dans p (ex. 0x7ffe...), pas 25\nstd::cout &lt;&lt; *p;        // affiche 25 : *p va LIRE la valeur À l'adresse pointée (déréférencement)</pre>\n<p>Trois symboles à bien distinguer. L'opérateur <code>&amp;</code> placé <em>devant une variable</em> signifie « <strong>adresse de</strong> » : <code>&amp;age</code> donne l'adresse du casier de <code>age</code>. L'étoile <code>*</code> <em>dans un type</em> (<code>int*</code>) veut dire « pointeur vers » : <code>int* p</code> se lit « <code>p</code> est un pointeur vers un <code>int</code> ». La même étoile <code>*</code> <em>devant un pointeur</em> (<code>*p</code>) est le <strong>déréférencement</strong> : « va voir la valeur rangée à l'adresse que contient <code>p</code> ». Tout ceci fonctionne exactement comme en C.</p>\n\n<h3>2. Modifier à travers un pointeur</h3>\n<pre class=\"pseudo\">*p = 30;               // *p désigne le casier de age ; on y range 30 → on modifie age À TRAVERS le pointeur\nstd::cout &lt;&lt; age;      // affiche 30 : age a bien changé, car p pointait sur lui</pre>\n<p>Comme <code>*p</code> désigne le casier pointé, écrire <code>*p = 30</code> range 30 dans ce casier : puisque <code>p</code> pointe sur <code>age</code>, c'est <code>age</code> qui devient 30. C'est ainsi qu'une fonction peut modifier une variable qui vit ailleurs : on lui donne l'adresse.</p>\n\n<h3>3. Le pointeur nul : nullptr</h3>\n<pre class=\"pseudo\">int* q = nullptr;                      // q ne pointe vers RIEN (nullptr = « pointeur nul », préféré à NULL en C++)\nif (q != nullptr) std::cout &lt;&lt; *q;    // on ne déréférence *q QUE si q pointe réellement quelque part</pre>\n<p>Un pointeur doit toujours pointer quelque part de valide avant qu'on utilise <code>*</code>. Pour dire « ce pointeur ne pointe encore vers rien », on lui donne la valeur spéciale <code>nullptr</code> (le <strong>pointeur nul</strong>). Avant tout déréférencement, on vérifie qu'il n'est pas nul avec <code>!=</code> (« différent de »).</p>\n<div class=\"warn\">En C++, on utilise <code>nullptr</code> (qui est un <em>vrai</em> type de pointeur) plutôt que l'ancien <code>NULL</code> du C (qui n'était qu'un 0 déguisé). Déréférencer un pointeur <code>nullptr</code> ou <strong>non initialisé</strong> (qui contient une adresse au hasard) provoque un plantage appelé <em>segfault</em> (erreur de segmentation) : toujours initialiser un pointeur et vérifier avant <code>*p</code>.</div>\n\n<h3>4. Le type du pointeur compte</h3>\n<pre class=\"pseudo\">int*    pi;    // pi est un pointeur vers un int    (casier de 4 octets, en général)\ndouble* pd;    // pd est un pointeur vers un double (casier de 8 octets)\nchar*   pc;    // pc est un pointeur vers un char   (casier de 1 octet)</pre>\n<p>Même si toutes les adresses se ressemblent, le <strong>type</strong> du pointeur indique la <strong>taille</strong> de la case pointée (un <strong>octet</strong> est l'unité de base de la mémoire, soit 8 bits). Cette taille est essentielle pour l'<strong>arithmétique de pointeurs</strong> — avancer d'une case à l'autre — que l'on verra en leçon 5.</p>\n\n<h3>5. Pointeur vs référence (aperçu)</h3>\n<pre class=\"pseudo\">int&amp; r = age;   // RÉFÉRENCE : r devient un autre nom (alias) de age ; ne peut être nulle ; s'utilise sans *\nint* p = &amp;age;  // POINTEUR : contient l'adresse de age ; peut être nul ; réassignable ; nécessite * et &amp;</pre>\n<p>Une <strong>référence</strong> (notée <code>&amp;</code> dans le type, à ne pas confondre avec l'opérateur « adresse de ») est simplement un <strong>autre nom</strong> pour une variable qui existe déjà : un alias. Contrairement au pointeur, elle ne peut pas être nulle, ne peut pas changer de cible, et s'utilise directement (sans étoile). On l'étudie en détail demain.</p>\n<div class=\"tip\">Le C++ ajoute la <strong>référence</strong> (leçon 4), plus sûre. Mais le pointeur reste indispensable pour l'allocation dynamique (<code>new</code>), les tableaux et les structures qui se réfèrent entre elles. Comprendre le pointeur, c'est comprendre la mémoire.</div>",

    "title": "Exercice final — Échanger via pointeurs",
    "intro": "<p>On veut échanger deux entiers via des pointeurs. Analyse :</p>\n<pre class=\"pseudo\">void echanger(int a, int b) {   // ATTENTION : a et b sont des COPIES (passage par valeur)\n    int tmp = a; a = b; b = tmp; // on échange les copies locales… sans effet sur l'extérieur\n}\nint main() {                     // point d'entrée\n    int x = 1, y = 2;            // deux entiers à échanger\n    echanger(x, y);             // on passe les VALEURS de x et y (donc des copies)\n    std::cout &lt;&lt; x &lt;&lt; \" \" &lt;&lt; y;  // affiche 1 2 : x et y n'ont pas bougé\n}</pre>",

    "solution": "<pre class=\"pseudo\">#include &lt;iostream&gt;                     // pour std::cout\n                                        // ligne vide pour aérer\nvoid echanger(int* a, int* b) {         // reçoit deux ADRESSES d'entiers (pointeurs)\n    int tmp = *a; *a = *b; *b = tmp;    // échange les VALEURS pointées : tmp garde *a, *a reçoit *b, *b reçoit tmp\n}                                       // fin de la fonction echanger\nint main() {                            // point d'entrée\n    int x = 1, y = 2;                   // deux entiers à échanger\n    echanger(&amp;x, &amp;y);                  // on passe les ADRESSES de x et y (&amp;x, &amp;y)\n    std::cout &lt;&lt; x &lt;&lt; \" \" &lt;&lt; y &lt;&lt; \"\\n\"; // affiche 2 1 : l'échange a réussi\n    return 0;                           // 0 = programme terminé sans erreur\n}                                       // fin de main\n// En C++ moderne : std::swap(x, y);  (ou une version par référence)</pre>\n<p>Le pointeur permet de modifier les variables de l'appelant, comme en C. La référence (demain) rendra ce code plus simple et plus sûr. Demain : références et pointeurs.</p>"
