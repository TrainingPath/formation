<script>
var DAY = {
  num: 15,
  title: "Organisation : .h/.cpp, compilation séparée",
  subtitle: "Découper un projet en en-têtes et fichiers d'implémentation, comme en C.",
  theory: `
<h3>1. Déclaration vs définition</h3>
<p>Deux mots à distinguer. <strong>Déclarer</strong>, c'est <em>annoncer</em> qu'une fonction ou une classe existe, en donnant juste son nom et sa forme (sans dire comment elle marche). <strong>Définir</strong>, c'est écrire son <em>vrai code</em>. On sépare donc l'<strong>interface</strong> (ce qu'une classe/fonction offre : ses déclarations) de l'<strong>implémentation</strong> (comment elle le fait : ses définitions). L'interface va dans un fichier <strong>.h</strong> (<em>header</em>, en-tête), l'implémentation dans un fichier <strong>.cpp</strong>. Cela rend le projet lisible et permet de recompiler seulement ce qui change.</p>

<h3>2. Le fichier d'en-tête (.h)</h3>
<pre class="pseudo">// jeu.h                                    // les // en début de ligne sont des COMMENTAIRES (ignorés par le compilateur)
#ifndef JEU_H                               // « si JEU_H n'est PAS encore défini » → on entre dans le bloc (garde d'inclusion)
#define JEU_H                               // on définit JEU_H, pour ne pas réinclure ce fichier une 2e fois
#include &lt;string&gt;                           // on a besoin de std::string ici

class Jeu {                                 // DÉCLARATION de la classe (son interface)
    std::string nom_;                       // attribut privé : le nom
    double prix_;                           // attribut privé : le prix
public:                                     // interface publique
    Jeu(std::string nom, double prix);      // DÉCLARATION seule du constructeur (pas de corps ici, juste le ;)
    double prix() const;                    // DÉCLARATION seule de la méthode prix()
};                                          // ; final obligatoire
#endif                                      // ferme le #ifndef ouvert plus haut</pre>
<p>Le <strong>garde d'inclusion</strong> (<code>#ifndef</code> / <code>#define</code> / <code>#endif</code>, ou la version courte <code>#pragma once</code>) empêche qu'un même en-tête soit inclus deux fois dans un fichier — ce qui provoquerait une erreur de « double définition ». Dans le <code>.h</code>, on écrit surtout des <strong>déclarations</strong> (les méthodes finissent par <code>;</code>, sans corps).</p>

<h3>3. Le fichier d'implémentation (.cpp)</h3>
<pre class="pseudo">// jeu.cpp
#include "jeu.h"                            // on inclut NOTRE en-tête (guillemets) pour connaître la classe Jeu

Jeu::Jeu(std::string nom, double prix) : nom_(nom), prix_(prix) {}   // DÉFINITION du constructeur ; Jeu:: = « appartient à la classe Jeu »
double Jeu::prix() const { return prix_; }  // DÉFINITION de la méthode prix() de la classe Jeu</pre>
<p>On définit (écrit le vrai code de) les méthodes hors de la classe avec la syntaxe <code>Classe::methode</code>. Le double deux-points <code>::</code> est l'<strong>opérateur de résolution de portée</strong> : il indique à quelle classe la méthode appartient (ici <code>Jeu::prix</code> = « la méthode <code>prix</code> de la classe <code>Jeu</code> »).</p>

<h3>4. Inclure et compiler</h3>
<pre class="pseudo">// main.cpp
#include &lt;iostream&gt;                         // en-tête de la bibliothèque standard (chevrons &lt; &gt;)
#include "jeu.h"                            // NOTRE en-tête (guillemets " ") pour utiliser la classe Jeu
int main() { Jeu j("Catan", 44.90); std::cout &lt;&lt; j.prix(); }   // crée un Jeu et affiche son prix</pre>
<pre class="pseudo">g++ -std=c++17 -Wall main.cpp jeu.cpp -o app   // compile ENSEMBLE tous les .cpp ; -o app nomme l'exécutable "app"</pre>
<div class="warn">On compile <strong>tous les .cpp</strong> ensemble ; les <code>.h</code> ne se compilent <strong>pas</strong> directement (ils sont recopiés dans les .cpp par <code>#include</code>). Règle des includes : <code>#include "..."</code> (guillemets) pour <strong>tes</strong> fichiers, <code>#include &lt;...&gt;</code> (chevrons) pour la <strong>bibliothèque</strong> standard.</div>

<h3>5. Cas particulier : les templates</h3>
<div class="tip">Les <strong>templates</strong> (du code générique valable pour plusieurs types, leçon suivante) font exception : le compilateur doit voir <strong>tout</strong> leur code pour les fabriquer, donc on les écrit <strong>entièrement dans le .h</strong> (pas de séparation .h/.cpp). Pour les classes et fonctions ordinaires, la séparation .h/.cpp reste la règle — exactement comme en C.</div>`,
  exercises: [
    { type: "qcm", q: "Que contient un fichier .h ?", opts: ["l'implémentation", "l'interface : déclarations (prototypes, classe)", "le main", "rien"], a: 1, exp: "Ce que la classe offre." },
    { type: "qcm", q: "Que contient un fichier .cpp ?", opts: ["les déclarations", "les définitions (implémentation)", "les includes seuls", "des tests"], a: 1, exp: "Comment ça marche." },
    { type: "qcm", q: "À quoi sert le garde d'inclusion ?", opts: ["accélérer", "éviter la double inclusion d'un en-tête", "compiler", "trier"], a: 1, exp: "#ifndef/#define/#endif ou #pragma once." },
    { type: "qcm", q: "Comment définir une méthode hors de la classe ?", opts: ["methode()", "Classe::methode() { ... }", "class.methode", "methode::Classe"], a: 1, exp: "Résolution de portée ::." },
    { type: "qcm", q: "Quelle forme d'include pour TES fichiers ?", opts: ["#include <jeu.h>", "#include \"jeu.h\"", "#import jeu.h", "include jeu.h"], a: 1, exp: "Guillemets pour tes fichiers." },
    { type: "qcm", q: "Compile-t-on les fichiers .h directement ?", opts: ["oui", "non : ils sont inclus dans les .cpp", "toujours en premier", "avec -h"], a: 1, exp: "On compile les .cpp." },
    { type: "qcm", q: "Comment compiler main.cpp et jeu.cpp ?", opts: ["g++ main.cpp", "g++ -std=c++17 main.cpp jeu.cpp -o app", "g++ *.h", "g++ jeu.h"], a: 1, exp: "Tous les .cpp." },
    { type: "qcm", q: "#pragma once fait…", opts: ["compiler une fois", "comme un garde d'inclusion (évite la double inclusion)", "exécuter", "trier"], a: 1, exp: "Alternative moderne." },
    { type: "qcm", q: "Les templates s'écrivent…", opts: ["dans un .cpp", "entièrement dans le .h (le compilateur doit voir le code)", "dans le Makefile", "dans main"], a: 1, exp: "Exception à la règle." },
    { type: "qcm", q: "Séparer .h/.cpp permet…", opts: ["moins de sécurité", "de séparer interface et implémentation (lisibilité, compilation séparée)", "plus de bugs", "rien"], a: 1, exp: "Structure du projet." },
    { type: "vf", q: "Un fichier .h contient les déclarations, un .cpp les définitions.", a: true, exp: "Interface / implémentation." },
    { type: "qcm", q: "Jeu::prix() const { ... } signifie…", opts: ["une nouvelle classe", "la définition de la méthode prix() de la classe Jeu", "un template", "une erreur"], a: 1, exp: "Classe::methode." },
    { type: "qcm", q: "L'en-tête <string> s'inclut avec…", opts: ["\"string\"", "<string> (chevrons, bibliothèque)", "import", "rien"], a: 1, exp: "Chevrons pour la STL." },
    { type: "qcm", q: "Le garde d'inclusion évite les erreurs de…", opts: ["vitesse", "redéfinition (double inclusion)", "type", "réseau"], a: 1, exp: "Une classe définie deux fois = erreur." },
    { type: "qcm", q: "La séparation .h/.cpp en C++ est…", opts: ["nouvelle", "héritée du C (même principe)", "impossible", "réservée aux templates"], a: 1, exp: "Continuité avec le C." }
  ],
  final: {
    title: "Exercice final — Découper un module",
    intro: `<p>Un développeur met tout dans le .h. Analyse ce jeu.h :</p>
<pre class="pseudo">// jeu.h                                 // MANQUE : garde d'inclusion et #include &lt;string&gt;
class Jeu {                              // déclaration de la classe
    std::string nom_;                    // attribut privé (mais &lt;string&gt; n'est pas inclus !)
public:                                  // interface publique
    Jeu(std::string n) : nom_(n) {}      // constructeur défini directement dans le .h
    std::string nom() { return nom_; }   // méthode ; devrait être const (elle ne modifie rien)
};</pre>`,
    questions: [
      { type: "qcm", q: "Manque n°1 — au début du .h :", opts: ["rien", "un garde d'inclusion (#ifndef.../#pragma once) et #include <string>", "un main", "un delete"], a: 1, exp: "Éviter la double inclusion." },
      { type: "qcm", q: "<code>nom()</code> devrait être…", opts: ["non-const", "const (elle ne modifie rien)", "private", "supprimée"], a: 1, exp: "Méthode de lecture." },
      { type: "qcm", q: "Pour un vrai projet, où mettre l'implémentation des méthodes longues ?", opts: ["dans le .h", "dans un jeu.cpp (déclaration en .h, définition en .cpp)", "dans main", "nulle part"], a: 1, exp: "Séparation .h/.cpp." },
      { type: "qcm", q: "#include pour tes fichiers utilise…", opts: ["<jeu.h>", "\"jeu.h\"", "import", "rien"], a: 1, exp: "Guillemets." },
      { type: "qcm", q: "Commande de compilation avec main.cpp et jeu.cpp :", opts: ["g++ jeu.h", "g++ -std=c++17 main.cpp jeu.cpp -o app", "g++ main.cpp", "g++ *.h"], a: 1, exp: "Tous les .cpp." }
    ],
    solution: `<pre class="pseudo">// jeu.h
#ifndef JEU_H                           // garde d'inclusion : « si JEU_H pas défini… »
#define JEU_H                           // …on le définit pour ne pas réinclure ce fichier
#include &lt;string&gt;                       // nécessaire pour std::string
class Jeu {                             // déclaration (interface)
    std::string nom_;                  // attribut privé
public:                                // interface publique
    Jeu(std::string nom);              // DÉCLARATION seule du constructeur (le ; suffit)
    std::string nom() const;           // DÉCLARATION seule ; const car ne modifie rien
};                                     // ; final obligatoire
#endif                                 // ferme le garde d'inclusion
                                        // ligne vide pour aérer
// jeu.cpp
#include "jeu.h"                        // inclut notre en-tête (guillemets)
Jeu::Jeu(std::string nom) : nom_(nom) {}          // DÉFINITION du constructeur (Jeu::)
std::string Jeu::nom() const { return nom_; }     // DÉFINITION de la méthode nom()
                                        // ligne vide pour aérer
// Compiler : g++ -std=c++17 -Wall main.cpp jeu.cpp -o app   // compile tous les .cpp ensemble</pre>
<p>Garde d'inclusion, déclarations en <code>.h</code>, définitions en <code>.cpp</code>, méthode <code>const</code> : le module est bien structuré. Demain : lire et écrire des fichiers.</p>`
  }
};
</script>

  { id: "cppb-l15", title: "Un module Tarif", level: 3,
    statement: "Écris tarif.h (avec garde d'inclusion) déclarant une fonction double tarif(double prixJour, int jours), et tarif.cpp qui la définit (−10 % dès 3 jours). Donne la commande de compilation avec un main.cpp.",
    hints: [
      "tarif.h : #ifndef TARIF_H / #define TARIF_H / la déclaration ; / #endif.",
      "tarif.cpp : #include \"tarif.h\" puis la définition.",
      "g++ -std=c++17 main.cpp tarif.cpp -o app"
    ],
    solution: "// tarif.h\n#ifndef TARIF_H              // garde d'inclusion : si TARIF_H pas defini...\n#define TARIF_H              // ...on le definit (evite la double inclusion)\ndouble tarif(double prixJour, int jours);   // DECLARATION seule (interface)\n#endif                       // ferme le garde d'inclusion\n\n// tarif.cpp\n#include \"tarif.h\"           // inclut notre en-tete (guillemets)\ndouble tarif(double prixJour, int jours) {   // DEFINITION (implementation)\n    double t = prixJour * jours;   // total = prix par jour x nombre de jours\n    if (jours >= 3) t *= 0.9;       // -10 % des 3 jours\n    return t;                       // renvoie le tarif calcule\n}\n\n// Compiler avec main.cpp :\n//   g++ -std=c++17 -Wall main.cpp tarif.cpp -o app",
    note: "La déclaration (interface) va dans le .h protégé par un garde d'inclusion ; la définition (implémentation) dans le .cpp. On compile tous les .cpp ensemble. C'est exactement le découpage du C, appliqué au C++." }
  ]
};
