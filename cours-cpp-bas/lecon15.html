  "title": "Organisation : .h/.cpp, compilation séparée",
  "subtitle": "Découper un projet en en-têtes et fichiers d'implémentation, comme en C.",
  "theory": "\n<h3>1. Déclaration vs définition</h3>\n<p>Deux mots à distinguer. <strong>Déclarer</strong>, c'est <em>annoncer</em> qu'une fonction ou une classe existe, en donnant juste son nom et sa forme (sans dire comment elle marche). <strong>Définir</strong>, c'est écrire son <em>vrai code</em>. On sépare donc l'<strong>interface</strong> (ce qu'une classe/fonction offre : ses déclarations) de l'<strong>implémentation</strong> (comment elle le fait : ses définitions). L'interface va dans un fichier <strong>.h</strong> (<em>header</em>, en-tête), l'implémentation dans un fichier <strong>.cpp</strong>. Cela rend le projet lisible et permet de recompiler seulement ce qui change.</p>\n\n<h3>2. Le fichier d'en-tête (.h)</h3>\n<pre class=\"pseudo\">// jeu.h                                    // les // en début de ligne sont des COMMENTAIRES (ignorés par le compilateur)\n#ifndef JEU_H                               // « si JEU_H n'est PAS encore défini » → on entre dans le bloc (garde d'inclusion)\n#define JEU_H                               // on définit JEU_H, pour ne pas réinclure ce fichier une 2e fois\n#include &lt;string&gt;                           // on a besoin de std::string ici\n\nclass Jeu {                                 // DÉCLARATION de la classe (son interface)\n    std::string nom_;                       // attribut privé : le nom\n    double prix_;                           // attribut privé : le prix\npublic:                                     // interface publique\n    Jeu(std::string nom, double prix);      // DÉCLARATION seule du constructeur (pas de corps ici, juste le ;)\n    double prix() const;                    // DÉCLARATION seule de la méthode prix()\n};                                          // ; final obligatoire\n#endif                                      // ferme le #ifndef ouvert plus haut</pre>\n<p>Le <strong>garde d'inclusion</strong> (<code>#ifndef</code> / <code>#define</code> / <code>#endif</code>, ou la version courte <code>#pragma once</code>) empêche qu'un même en-tête soit inclus deux fois dans un fichier — ce qui provoquerait une erreur de « double définition ». Dans le <code>.h</code>, on écrit surtout des <strong>déclarations</strong> (les méthodes finissent par <code>;</code>, sans corps).</p>\n\n<h3>3. Le fichier d'implémentation (.cpp)</h3>\n<pre class=\"pseudo\">// jeu.cpp\n#include \"jeu.h\"                            // on inclut NOTRE en-tête (guillemets) pour connaître la classe Jeu\n\nJeu::Jeu(std::string nom, double prix) : nom_(nom), prix_(prix) {}   // DÉFINITION du constructeur ; Jeu:: = « appartient à la classe Jeu »\ndouble Jeu::prix() const { return prix_; }  // DÉFINITION de la méthode prix() de la classe Jeu</pre>\n<p>On définit (écrit le vrai code de) les méthodes hors de la classe avec la syntaxe <code>Classe::methode</code>. Le double deux-points <code>::</code> est l'<strong>opérateur de résolution de portée</strong> : il indique à quelle classe la méthode appartient (ici <code>Jeu::prix</code> = « la méthode <code>prix</code> de la classe <code>Jeu</code> »).</p>\n\n<h3>4. Inclure et compiler</h3>\n<pre class=\"pseudo\">// main.cpp\n#include &lt;iostream&gt;                         // en-tête de la bibliothèque standard (chevrons &lt; &gt;)\n#include \"jeu.h\"                            // NOTRE en-tête (guillemets \" \") pour utiliser la classe Jeu\nint main() { Jeu j(\"Catan\", 44.90); std::cout &lt;&lt; j.prix(); }   // crée un Jeu et affiche son prix</pre>\n<pre class=\"pseudo\">g++ -std=c++17 -Wall main.cpp jeu.cpp -o app   // compile ENSEMBLE tous les .cpp ; -o app nomme l'exécutable \"app\"</pre>\n<div class=\"warn\">On compile <strong>tous les .cpp</strong> ensemble ; les <code>.h</code> ne se compilent <strong>pas</strong> directement (ils sont recopiés dans les .cpp par <code>#include</code>). Règle des includes : <code>#include \"...\"</code> (guillemets) pour <strong>tes</strong> fichiers, <code>#include &lt;...&gt;</code> (chevrons) pour la <strong>bibliothèque</strong> standard.</div>\n\n<h3>5. Cas particulier : les templates</h3>\n<div class=\"tip\">Les <strong>templates</strong> (du code générique valable pour plusieurs types, leçon suivante) font exception : le compilateur doit voir <strong>tout</strong> leur code pour les fabriquer, donc on les écrit <strong>entièrement dans le .h</strong> (pas de séparation .h/.cpp). Pour les classes et fonctions ordinaires, la séparation .h/.cpp reste la règle — exactement comme en C.</div>",
