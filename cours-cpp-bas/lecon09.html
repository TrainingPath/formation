  "title": "Allocation dynamique : new et delete",
  "subtitle": "Réserver de la mémoire à l'exécution — et la libérer soi-même, sans rien oublier.",
  "theory": "\n<h3>1. Pile vs tas</h3>\n<p>La mémoire d'un programme se divise en deux grandes zones. La <strong>pile</strong> (en anglais <em>stack</em>) est une zone <strong>automatique</strong> : chaque variable locale (déclarée dans une fonction) y est créée quand on entre dans son bloc et <strong>détruite automatiquement</strong> quand on en sort (à l'accolade fermante). C'est rapide, mais la variable ne survit pas à sa fonction, et sa taille doit être connue d'avance.</p>\n<p>Le <strong>tas</strong> (en anglais <em>heap</em>) est une zone <strong>manuelle</strong> et bien plus grande : on y <strong>réserve</strong> de la mémoire quand on veut (« allouer »), et elle reste réservée jusqu'à ce qu'on la <strong>libère</strong> soi-même. On l'utilise pour un objet qui doit <strong>survivre</strong> au-delà du bloc où il est créé, ou dont la <strong>taille dépend de l'exécution</strong> (connue seulement au moment où le programme tourne). On y accède via <code>new</code>.</p>\n\n<h3>2. new et delete</h3>\n<pre class=\"pseudo\">Jeu* j = new Jeu{\"Catan\", 44.90, 3};   // new alloue un Jeu sur le TAS et renvoie un POINTEUR vers lui ; j garde ce pointeur\nstd::cout &lt;&lt; j-&gt;nom;                   // accès à un champ via un pointeur : la flèche -> (équivaut à (*j).nom)\ndelete j;                             // delete LIBÈRE la mémoire allouée par new (indispensable, sinon elle est perdue)\nj = nullptr;                          // bonne habitude : j ne pointe plus vers rien de valide → on le met à nullptr</pre>\n<p><code>new</code> réserve la place d'un objet sur le tas, l'initialise, et renvoie un <strong>pointeur</strong> vers cet objet. <code>delete</code> rend cette mémoire au système. Règle d'or : <strong>à chaque <code>new</code> doit correspondre exactement un <code>delete</code></strong>, sinon la mémoire n'est jamais rendue.</p>\n\n<h3>3. Les fautes graves</h3>\n<div class=\"warn\">Trois erreurs classiques. <strong>Fuite mémoire</strong> (<em>memory leak</em>) : oublier <code>delete</code> — la mémoire reste réservée pour rien, et le programme en consomme de plus en plus. <strong>Use-after-free</strong> : utiliser l'objet <em>après</em> l'avoir <code>delete</code> — le pointeur désigne une zone libérée, le résultat est imprévisible. <strong>Double free</strong> : faire <code>delete</code> deux fois sur le même pointeur — erreur grave (comportement indéfini). Règle : un <code>new</code> = un <code>delete</code>, puis remettre le pointeur à <code>nullptr</code>.</div>\n\n<h3>4. new pour un type simple</h3>\n<pre class=\"pseudo\">int* n = new int(42);    // alloue UN entier sur le tas, initialisé à 42, et renvoie son adresse dans n\nstd::cout &lt;&lt; *n;         // *n déréférence : affiche 42 (la valeur pointée)\ndelete n;               // libère cet entier ; on écrit delete (PAS delete[]) car c'est un objet UNIQUE, pas un tableau</pre>\n<p>On peut allouer n'importe quel type sur le tas, pas seulement des objets complexes. Ici <code>new int(42)</code> réserve un entier valant 42. Attention : pour un objet unique on écrit <code>delete</code> ; pour un tableau alloué par <code>new[]</code> on écrit <code>delete[]</code> (leçon 10).</p>\n\n<h3>5. Pourquoi le C++ moderne évite new/delete</h3>\n<pre class=\"pseudo\">// bas niveau (ce cours) :\nJeu* j = new Jeu{...}; ... delete j;      // on doit penser au delete soi-même, sur TOUS les chemins de sortie\n// moderne :\nauto j = std::make_unique&lt;Jeu&gt;(...);      // un « smart pointer » : il fait le delete TOUT SEUL quand j disparaît (RAII)</pre>\n<div class=\"tip\">Gérer <code>new</code>/<code>delete</code> à la main est source d'erreurs (fuites, use-after-free). Le C++ moderne confie la <strong>possession</strong> de l'objet à un <strong>pointeur intelligent</strong> (<em>smart pointer</em>, comme <code>unique_ptr</code>) qui appelle <code>delete</code> automatiquement. Ce principe s'appelle <strong>RAII</strong> (la libération est liée à la fin de vie de l'objet gardien). Ici, on le fait manuellement pour <strong>comprendre</strong> ce que le smart pointer automatise.</div>",

    "solution": "<pre class=\"pseudo\">#include &lt;iostream&gt;                     // pour std::cout\n                                        // ligne vide pour aérer\n// version bas niveau corrigée :\nJeu* j = new Jeu{\"Catan\", 44.90, 3};    // alloue le Jeu sur le tas\nj-&gt;reappro(5);                          // utilise l'objet (via ->)\nstd::cout &lt;&lt; j-&gt;nom &lt;&lt; \"\\n\";            // on l'utilise AVANT delete (jamais après)\ndelete j;                               // libère la mémoire une SEULE fois\nj = nullptr;                            // neutralise le pointeur (plus de use-after-free possible)\n// (le return 1 anticipé devrait faire delete j; AVANT de partir, pour éviter la fuite)\n                                        // ligne vide pour aérer\n// version moderne (aucune fuite possible) :\nauto k = std::make_unique&lt;Jeu&gt;(\"Uno\", 12.50, 10);   // smart pointer : il libérera l'objet tout seul\n// libéré automatiquement, même sur un return anticipé</pre>\n<p>Utiliser avant <code>delete</code>, libérer une fois, neutraliser. Ces pièges expliquent pourquoi le C++ moderne préfère <code>unique_ptr</code>. Demain : les tableaux dynamiques (<code>new[]</code>/<code>delete[]</code>).</p>"
