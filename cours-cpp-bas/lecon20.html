  "title": "Projet guidé : le gestionnaire de tâches",
  "subtitle": "Assembler le bas niveau : une classe à tableau dynamique, la règle de trois, un menu.",
  "theory": "\n<h3>1. Le cahier des charges</h3>\n<p>Un <strong>gestionnaire de tâches</strong> (une petite « to-do list ») en <strong>console</strong> (dans le terminal, sans interface graphique), mais en <strong>gérant la mémoire à la main</strong> : un tableau dynamique de tâches qui s'<strong>agrandit</strong> quand il est plein, avec <code>new[]</code>/<code>delete[]</code>. Ce projet mobilise tout ce qu'on a vu : classe, constructeur/destructeur, règle de trois et boucle de menu. Un <strong>cahier des charges</strong> est la liste de ce que le programme doit faire.</p>\n\n<h3>2. La classe Tache</h3>\n<pre class=\"pseudo\">struct Tache {               // une fiche représentant une tâche\n    std::string titre;       // le libellé de la tâche (texte)\n    bool faite = false;      // vrai si la tâche est terminée ; = false donne une valeur PAR DÉFAUT (non faite au départ)\n};                           // ; final obligatoire</pre>\n<p>On commence par le type de donnée le plus simple : une <code>struct</code> qui regroupe un titre et un état « faite / pas faite ». <code>= false</code> après le champ est un <strong>initialiseur par défaut</strong> : toute nouvelle tâche démarre non faite.</p>\n\n<h3>3. La classe Gestionnaire (mémoire manuelle)</h3>\n<pre class=\"pseudo\">class Gestionnaire {                        // classe qui possède et gère un tableau dynamique de tâches\n    Tache* taches_;                         // pointeur vers le tableau de tâches (sur le tas)\n    int taille_, capacite_;                 // taille_ = nombre de tâches utilisées ; capacite_ = place réservée\npublic:\n    Gestionnaire() : taches_(new Tache[2]), taille_(0), capacite_(2) {}   // constructeur : réserve 2 cases au départ, 0 utilisée\n    ~Gestionnaire() { delete[] taches_; }   // destructeur : libère le tableau (delete[] car new[])\n    // règle de trois : il faudrait AUSSI écrire le constructeur de copie et l'opérateur= (la classe possède un pointeur) !\n\n    void ajouter(const std::string&amp; titre) {          // ajoute une tâche (titre passé en const& : lu sans copie)\n        if (taille_ == capacite_) agrandir();         // si le tableau est PLEIN (toutes les cases utilisées), on l'agrandit\n        taches_[taille_].titre = titre;               // range le titre dans la première case libre\n        taches_[taille_].faite = false;               // la nouvelle tâche n'est pas faite\n        taille_++;                                    // une case de plus est utilisée\n    }\nprivate:                                    // méthode interne (non publique)\n    void agrandir() {                       // double la capacité du tableau\n        capacite_ *= 2;                     // on double la place réservée\n        Tache* neuf = new Tache[capacite_]; // alloue un NOUVEAU tableau plus grand\n        for (int i = 0; i &lt; taille_; i++) neuf[i] = taches_[i];   // recopie les tâches existantes dans le neuf\n        delete[] taches_;                   // LIBÈRE l'ancien tableau (sinon fuite mémoire)\n        taches_ = neuf;                     // le pointeur désigne désormais le nouveau tableau\n    }\n};                                          // ; final obligatoire</pre>\n<div class=\"warn\">C'est exactement ce que <code>std::vector</code> fait tout seul : gérer une capacité, s'agrandir (<code>new[]</code> + copie + <code>delete[]</code>), libérer à la fin. On le réécrit à la main pour <strong>comprendre</strong> — et pour mesurer le confort de la STL.</div>\n\n<h3>4. Le menu</h3>\n<pre class=\"pseudo\">int choix;                                             // le numéro d'action choisi par l'utilisateur\ndo {                                                   // do-while : on exécute le bloc AU MOINS une fois, puis on répète tant que la condition est vraie\n    std::cout &lt;&lt; \"1) Ajouter 2) Lister 0) Quitter : \"; // affiche le menu\n    std::cin &gt;&gt; choix; std::cin.ignore();              // lit le choix ; cin.ignore() jette le '\\n' restant (sinon getline lirait une ligne vide)\n    if (choix == 1) { std::string t; std::getline(std::cin, t); g.ajouter(t); }   // si 1 : lire un titre (ligne entière) et l'ajouter\n    else if (choix == 2) g.lister();                  // si 2 : afficher toutes les tâches\n} while (choix != 0);                                  // on recommence tant que l'utilisateur n'a pas tapé 0 (Quitter)</pre>\n<p>La boucle <code>do { ... } while (condition)</code> répète un bloc <strong>au moins une fois</strong>, puis tant que la condition reste vraie : idéale pour un menu, qu'on veut afficher au moins une fois. <code>std::cin.ignore()</code> vide le saut de ligne laissé par <code>cin &gt;&gt; choix</code>, pour que le <code>getline</code> suivant lise bien le titre et non une ligne vide.</p>\n\n<h3>5. Bilan</h3>\n<div class=\"tip\">Ce projet réimplémente <code>std::vector</code> à la main : tu maîtrises maintenant la capacité, l'agrandissement et la libération. La <strong>règle de trois</strong> (copie/affectation) est indispensable ici car la classe possède un pointeur brut. Compare avec un simple <code>std::vector&lt;Tache&gt;</code> : c'est tout ce que la STL t'épargne.</div>",

  "final": {
    "title": "Exercice final — Compléter agrandir",
    "intro": "<p>La méthode agrandir a un bug. Analyse :</p>\n<pre class=\"pseudo\">void agrandir() {\n    capacite_ *= 2;                         // on double la capacité\n    Tache* neuf = new Tache[capacite_];     // alloue le nouveau tableau, plus grand\n    for (int i = 0; i &lt; taille_; i++) neuf[i] = taches_[i];   // recopie les tâches existantes\n    taches_ = neuf;                         // BUG : l'ancien tableau taches_ n'est PAS libéré → fuite mémoire\n}</pre>",
    "questions": [
      {
        "type": "qcm",
        "q": "Le bug principal :",
        "opts": [
          "le menu boucle à l'infini",
          "l'ancien taches_ n'est pas libéré (delete[]) → fuite",

      },
      {

        "q": "Que faut-il ajouter avant <code>taches_ = neuf;</code> ?",
        "opts": [

        ],

      },
      {

      },

      },
      {

        ],
        "a": 1,
        "exp": "std::vector gère tout."

    ],
    "solution": "<pre class=\"pseudo\">void agrandir() {                       // double la capacité du tableau\n    capacite_ *= 2;                     // on double la place réservée\n    Tache* neuf = new Tache[capacite_]; // alloue le nouveau tableau, plus grand\n    for (int i = 0; i &lt; taille_; i++)   // parcourt les tâches utilisées\n        neuf[i] = taches_[i];           // copier les éléments utilisés dans le neuf\n    delete[] taches_;                   // LIBÉRER l'ancien tableau (correction du bug : évite la fuite)\n    taches_ = neuf;                     // le pointeur désigne le nouveau tableau\n}                                       // fin de agrandir\n// Avec la STL, tout ceci disparaît :\n//   std::vector&lt;Tache&gt; taches_;   taches_.push_back(...);   // push_back gère capacité + agrandissement + libération</pre>\n<p>Il manquait le <code>delete[]</code> de l'ancien tableau. Réimplémenter <code>std::vector</code> à la main éclaire son fonctionnement — et son intérêt. Demain : l'examen final.</p>"
