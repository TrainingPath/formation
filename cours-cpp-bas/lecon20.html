<script>
var DAY = {
  num: 20,
  title: "Projet guidé : le gestionnaire de tâches",
  subtitle: "Assembler le bas niveau : une classe à tableau dynamique, la règle de trois, un menu.",
  theory: `
<h3>1. Le cahier des charges</h3>
<p>Un <strong>gestionnaire de tâches</strong> (une petite « to-do list ») en <strong>console</strong> (dans le terminal, sans interface graphique), mais en <strong>gérant la mémoire à la main</strong> : un tableau dynamique de tâches qui s'<strong>agrandit</strong> quand il est plein, avec <code>new[]</code>/<code>delete[]</code>. Ce projet mobilise tout ce qu'on a vu : classe, constructeur/destructeur, règle de trois et boucle de menu. Un <strong>cahier des charges</strong> est la liste de ce que le programme doit faire.</p>

<h3>2. La classe Tache</h3>
<pre class="pseudo">struct Tache {               // une fiche représentant une tâche
    std::string titre;       // le libellé de la tâche (texte)
    bool faite = false;      // vrai si la tâche est terminée ; = false donne une valeur PAR DÉFAUT (non faite au départ)
};                           // ; final obligatoire</pre>
<p>On commence par le type de donnée le plus simple : une <code>struct</code> qui regroupe un titre et un état « faite / pas faite ». <code>= false</code> après le champ est un <strong>initialiseur par défaut</strong> : toute nouvelle tâche démarre non faite.</p>

<h3>3. La classe Gestionnaire (mémoire manuelle)</h3>
<pre class="pseudo">class Gestionnaire {                        // classe qui possède et gère un tableau dynamique de tâches
    Tache* taches_;                         // pointeur vers le tableau de tâches (sur le tas)
    int taille_, capacite_;                 // taille_ = nombre de tâches utilisées ; capacite_ = place réservée
public:
    Gestionnaire() : taches_(new Tache[2]), taille_(0), capacite_(2) {}   // constructeur : réserve 2 cases au départ, 0 utilisée
    ~Gestionnaire() { delete[] taches_; }   // destructeur : libère le tableau (delete[] car new[])
    // règle de trois : il faudrait AUSSI écrire le constructeur de copie et l'opérateur= (la classe possède un pointeur) !

    void ajouter(const std::string&amp; titre) {          // ajoute une tâche (titre passé en const& : lu sans copie)
        if (taille_ == capacite_) agrandir();         // si le tableau est PLEIN (toutes les cases utilisées), on l'agrandit
        taches_[taille_].titre = titre;               // range le titre dans la première case libre
        taches_[taille_].faite = false;               // la nouvelle tâche n'est pas faite
        taille_++;                                    // une case de plus est utilisée
    }
private:                                    // méthode interne (non publique)
    void agrandir() {                       // double la capacité du tableau
        capacite_ *= 2;                     // on double la place réservée
        Tache* neuf = new Tache[capacite_]; // alloue un NOUVEAU tableau plus grand
        for (int i = 0; i &lt; taille_; i++) neuf[i] = taches_[i];   // recopie les tâches existantes dans le neuf
        delete[] taches_;                   // LIBÈRE l'ancien tableau (sinon fuite mémoire)
        taches_ = neuf;                     // le pointeur désigne désormais le nouveau tableau
    }
};                                          // ; final obligatoire</pre>
<div class="warn">C'est exactement ce que <code>std::vector</code> fait tout seul : gérer une capacité, s'agrandir (<code>new[]</code> + copie + <code>delete[]</code>), libérer à la fin. On le réécrit à la main pour <strong>comprendre</strong> — et pour mesurer le confort de la STL.</div>

<h3>4. Le menu</h3>
<pre class="pseudo">int choix;                                             // le numéro d'action choisi par l'utilisateur
do {                                                   // do-while : on exécute le bloc AU MOINS une fois, puis on répète tant que la condition est vraie
    std::cout &lt;&lt; "1) Ajouter 2) Lister 0) Quitter : "; // affiche le menu
    std::cin &gt;&gt; choix; std::cin.ignore();              // lit le choix ; cin.ignore() jette le '\\n' restant (sinon getline lirait une ligne vide)
    if (choix == 1) { std::string t; std::getline(std::cin, t); g.ajouter(t); }   // si 1 : lire un titre (ligne entière) et l'ajouter
    else if (choix == 2) g.lister();                  // si 2 : afficher toutes les tâches
} while (choix != 0);                                  // on recommence tant que l'utilisateur n'a pas tapé 0 (Quitter)</pre>
<p>La boucle <code>do { ... } while (condition)</code> répète un bloc <strong>au moins une fois</strong>, puis tant que la condition reste vraie : idéale pour un menu, qu'on veut afficher au moins une fois. <code>std::cin.ignore()</code> vide le saut de ligne laissé par <code>cin &gt;&gt; choix</code>, pour que le <code>getline</code> suivant lise bien le titre et non une ligne vide.</p>

<h3>5. Bilan</h3>
<div class="tip">Ce projet réimplémente <code>std::vector</code> à la main : tu maîtrises maintenant la capacité, l'agrandissement et la libération. La <strong>règle de trois</strong> (copie/affectation) est indispensable ici car la classe possède un pointeur brut. Compare avec un simple <code>std::vector&lt;Tache&gt;</code> : c'est tout ce que la STL t'épargne.</div>`,
  exercises: [
    { type: "qcm", q: "Le Gestionnaire stocke les tâches dans…", opts: ["un std::vector", "un tableau dynamique (Tache*) géré à la main", "un fichier", "une map"], a: 1, exp: "new[]/delete[]." },
    { type: "qcm", q: "Quand agrandir le tableau ?", opts: ["jamais", "quand taille_ == capacite_", "à chaque ajout", "au démarrage"], a: 1, exp: "Réallocation." },
    { type: "qcm", q: "agrandir() fait…", opts: ["supprimer", "allouer plus grand, copier, delete[] l'ancien", "trier", "afficher"], a: 1, exp: "new[]/copie/delete[]." },
    { type: "qcm", q: "Le destructeur du Gestionnaire…", opts: ["crée les tâches", "fait delete[] taches_", "trie", "copie"], a: 1, exp: "Libère le tableau." },
    { type: "qcm", q: "Cette classe possède un pointeur : elle doit aussi…", opts: ["rien", "gérer sa copie et son affectation (règle de trois)", "être globale", "éviter les méthodes"], a: 1, exp: "Sinon double delete." },
    { type: "qcm", q: "Que réimplémente ce Gestionnaire ?", opts: ["une string", "std::vector (à la main)", "une map", "un fichier"], a: 1, exp: "Capacité, agrandissement, libération." },
    { type: "qcm", q: "Pourquoi cin.ignore() après cin >> choix ?", opts: ["accélérer", "jeter le '\\n' avant getline", "trier", "aucune raison"], a: 1, exp: "Éviter une ligne vide." },
    { type: "qcm", q: "Quelle boucle pour le menu ?", opts: ["for figé", "do-while", "while sans corps", "aucune"], a: 1, exp: "Répète jusqu'à Quitter." },
    { type: "qcm", q: "capacite_ *= 2 double…", opts: ["la taille utilisée", "la capacité (place réservée)", "le nombre de tâches faites", "rien"], a: 1, exp: "Stratégie d'agrandissement." },
    { type: "qcm", q: "taille_ vs capacite_ :", opts: ["identiques", "taille_ = éléments utilisés, capacite_ = place réservée", "inversés", "sans lien"], a: 1, exp: "Deux compteurs distincts." },
    { type: "vf", q: "std::vector<Tache> ferait tout ce travail automatiquement.", a: true, exp: "D'où sa préférence." },
    { type: "qcm", q: "Après agrandir, l'ancien tableau est…", opts: ["gardé", "libéré (delete[])", "trié", "dupliqué"], a: 1, exp: "Sinon fuite." },
    { type: "qcm", q: "Ce projet mobilise…", opts: ["uniquement cout", "classe, constructeur/destructeur, règle de trois, menu", "un seul if", "aucune classe"], a: 1, exp: "Synthèse du bas niveau." },
    { type: "qcm", q: "L'agrandissement copie…", opts: ["rien", "les taille_ éléments existants vers le neuf", "toute la capacité", "un seul"], a: 1, exp: "Préserver les données." },
    { type: "qcm", q: "Comparer avec std::vector montre…", opts: ["rien", "tout ce que la STL automatise pour toi", "que le manuel est mieux", "que vector est lent"], a: 1, exp: "Le confort du RAII." }
  ],
  final: {
    title: "Exercice final — Compléter agrandir",
    intro: `<p>La méthode agrandir a un bug. Analyse :</p>
<pre class="pseudo">void agrandir() {
    capacite_ *= 2;                         // on double la capacité
    Tache* neuf = new Tache[capacite_];     // alloue le nouveau tableau, plus grand
    for (int i = 0; i &lt; taille_; i++) neuf[i] = taches_[i];   // recopie les tâches existantes
    taches_ = neuf;                         // BUG : l'ancien tableau taches_ n'est PAS libéré → fuite mémoire
}</pre>`,
    questions: [
      { type: "qcm", q: "Le bug principal :", opts: ["aucun", "l'ancien taches_ n'est pas libéré (delete[]) → fuite", "capacite_ mal doublée", "la copie est fausse"], a: 1, exp: "Fuite à chaque agrandissement." },
      { type: "qcm", q: "Que faut-il ajouter avant <code>taches_ = neuf;</code> ?", opts: ["rien", "delete[] taches_;", "un new", "un return"], a: 1, exp: "Libérer l'ancien tableau." },
      { type: "qcm", q: "On copie combien d'éléments ?", opts: ["capacite_", "taille_ (les éléments réellement utilisés)", "0", "1"], a: 1, exp: "Les données existantes." },
      { type: "qcm", q: "Cette classe (pointeur brut) exige aussi…", opts: ["rien", "la règle de trois (copie + affectation)", "un template", "un main"], a: 1, exp: "Sinon copie dangereuse." },
      { type: "qcm", q: "L'alternative sans ce bug :", opts: ["garder new[]", "un std::vector<Tache>", "un tableau fixe", "un pointeur global"], a: 1, exp: "std::vector gère tout." }
    ],
    solution: `<pre class="pseudo">void agrandir() {                       // double la capacité du tableau
    capacite_ *= 2;                     // on double la place réservée
    Tache* neuf = new Tache[capacite_]; // alloue le nouveau tableau, plus grand
    for (int i = 0; i &lt; taille_; i++)   // parcourt les tâches utilisées
        neuf[i] = taches_[i];           // copier les éléments utilisés dans le neuf
    delete[] taches_;                   // LIBÉRER l'ancien tableau (correction du bug : évite la fuite)
    taches_ = neuf;                     // le pointeur désigne le nouveau tableau
}                                       // fin de agrandir
// Avec la STL, tout ceci disparaît :
//   std::vector&lt;Tache&gt; taches_;   taches_.push_back(...);   // push_back gère capacité + agrandissement + libération</pre>
<p>Il manquait le <code>delete[]</code> de l'ancien tableau. Réimplémenter <code>std::vector</code> à la main éclaire son fonctionnement — et son intérêt. Demain : l'examen final.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code C++ ici…",
  items: [
  { id: "cppb-l20", title: "ajouter avec agrandissement", level: 3,
    statement: "Écris la méthode void ajouter(const std::string& titre) d'un Gestionnaire à tableau dynamique (Tache* taches_, int taille_, int capacite_) : si taille_ == capacite_, double la capacité (new[], copie, delete[]), puis ajoute la tâche et incrémente taille_.",
    hints: [
      "if (taille_ == capacite_) { capacite_ *= 2; Tache* neuf = new Tache[capacite_]; ... delete[] taches_; taches_ = neuf; }",
      "Copie les taille_ éléments existants vers neuf.",
      "Puis taches_[taille_].titre = titre; taches_[taille_].faite = false; taille_++;"
    ],
    solution: "void ajouter(const std::string& titre) {   // ajoute une tache (titre lu sans copie)\n    if (taille_ == capacite_) {           // plus de place : agrandir\n        capacite_ *= 2;                   // double la capacite\n        Tache* neuf = new Tache[capacite_];   // nouveau tableau plus grand\n        for (int i = 0; i < taille_; i++)\n            neuf[i] = taches_[i];         // copier l'existant vers le neuf\n        delete[] taches_;                 // liberer l'ancien tableau (sinon fuite)\n        taches_ = neuf;                   // pointer vers le nouveau tableau\n    }\n    taches_[taille_].titre = titre;       // ranger le titre dans la 1re case libre\n    taches_[taille_].faite = false;       // nouvelle tache : pas faite\n    taille_++;                            // une case de plus utilisee\n}",
    note: "C'est le cœur de std::vector::push_back réécrit à la main : quand la capacité est atteinte, on double, on copie, on libère l'ancien tableau (sinon fuite). Comprendre ce mécanisme fait apprécier ce que la STL automatise." }
  ]
};
