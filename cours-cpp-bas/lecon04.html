<script>
var DAY = {
  num: 4,
  title: "Références et pointeurs",
  subtitle: "La référence : l'apport du C++ pour manipuler une variable simplement, sans les pièges du pointeur.",
  theory: `
<h3>1. La référence : un alias</h3>
<p>Rappel : une <strong>variable</strong> est une case mémoire nommée. Une <strong>référence</strong> est un <strong>second nom</strong> (un <strong>alias</strong>) pour une variable qui existe déjà. Imagine une personne avec un surnom : « Alex » et « Alexandre » désignent la même personne. Modifier via la référence, c'est modifier la variable d'origine, car ce sont deux étiquettes sur le <em>même</em> casier.</p>
<pre class="pseudo">int age = 25;          // variable normale contenant 25
int&amp; r = age;          // r est une RÉFÉRENCE : un autre nom pour age (le &amp; est ici dans le TYPE)
r = 30;                // on écrit dans r… donc dans age (même casier), sans * ni &amp;
std::cout &lt;&lt; age;      // affiche 30 : age a changé, car r et age sont la même case</pre>
<p>Attention à ne pas confondre : le <code>&amp;</code> <strong>collé au type</strong> (<code>int&amp; r</code>) crée une référence ; le <code>&amp;</code> <strong>devant une variable</strong> (<code>&amp;age</code>) donne son adresse. Une fois la référence créée, on l'utilise <strong>exactement comme la variable</strong> : pas d'étoile <code>*</code>, pas d'esperluette <code>&amp;</code> à l'usage. On écrit <code>r</code> comme on écrirait <code>age</code>.</p>

<h3>2. Référence vs pointeur</h3>
<pre class="pseudo">int&amp; r = age;   // référence : DOIT être initialisée tout de suite ; ne peut pas être nulle ; ne change jamais de cible
int* p = &amp;age;  // pointeur : peut valoir nullptr ; réassignable ; nécessite * (valeur) et &amp; (adresse)</pre>
<table style="width:100%;border-collapse:collapse;font-size:.92em">
<tr><th style="text-align:left">Référence</th><th style="text-align:left">Pointeur</th></tr>
<tr><td>toujours liée à une variable</td><td>peut être nullptr</td></tr>
<tr><td>ne change jamais de cible</td><td>réassignable</td></tr>
<tr><td>syntaxe simple (comme la variable)</td><td>* pour la valeur, &amp; pour l'adresse</td></tr>
</table>
<p>En résumé : la référence est plus <strong>simple et sûre</strong> (jamais nulle, jamais « perdue »), le pointeur est plus <strong>souple</strong> (il peut ne rien pointer, changer de cible, servir à réserver de la mémoire).</p>

<h3>3. Modifier un argument</h3>
<pre class="pseudo">void doublerPtr(int* x) { *x *= 2; }   // via POINTEUR : on déréférence (*x) pour atteindre la valeur ; *x *= 2 signifie *x = *x * 2
void doublerRef(int&amp; x) { x *= 2; }    // via RÉFÉRENCE : x EST l'original ; x *= 2 le double directement (plus simple)
doublerPtr(&amp;n);                        // à l'appel, il faut passer l'ADRESSE : &amp;n
doublerRef(n);                         // à l'appel, on passe juste n : pas de &amp;, plus lisible</pre>
<p>Une fonction reçoit normalement des <strong>copies</strong> de ses arguments (« passage par valeur ») : elle ne peut donc pas modifier les variables de l'appelant. Pour qu'elle le puisse, on lui donne soit l'<strong>adresse</strong> (pointeur), soit un <strong>alias</strong> (référence). <code>*x *= 2</code> est un raccourci pour <code>*x = *x * 2</code> (l'opérateur <code>*=</code> multiplie et range le résultat).</p>
<div class="warn">Quand une fonction doit juste <strong>modifier</strong> un argument, la référence est préférable : plus lisible, jamais nulle. On garde le pointeur quand on a besoin de sa souplesse (<code>nullptr</code> autorisé, réassignation, arithmétique, allocation dynamique).</div>

<h3>4. La référence const</h3>
<pre class="pseudo">void afficher(const std::string&amp; s);   // const = lecture seule ; &amp; = pas de copie → on lit un gros objet sans le recopier</pre>
<p>Passer un gros objet <em>par valeur</em> le <strong>recopie</strong> entièrement, ce qui coûte du temps. Une <strong>référence const</strong> (<code>const ... &amp;</code>) résout ça : le <code>&amp;</code> évite la copie (on travaille sur l'original) et le <code>const</code> promet de seulement <strong>lire</strong>, jamais modifier. C'est le passage idiomatique (recommandé) pour lire un objet volumineux — on l'utilisera partout. Ici <code>std::string</code> est le type texte du C++ (leçon 6).</p>

<h3>5. Quand utiliser quoi ?</h3>
<div class="tip">Règle pratique : <strong>référence</strong> pour modifier/lire un argument existant ; <strong>pointeur</strong> quand « pas d'objet » (<code>nullptr</code>) est une possibilité, ou pour la mémoire dynamique (<code>new</code>). En doute, préfère la référence : elle évite toute une classe de bugs (déréférencement de nul, <em>pointeur pendant</em> — un pointeur dont la cible a disparu).</div>`,
  exercises: [
    { type: "qcm", q: "Une référence est…", opts: ["une copie", "un autre nom (alias) pour une variable", "un pointeur nul", "un type"], a: 1, exp: "Modifier la référence modifie l'original." },
    { type: "qcm", q: "Une référence peut-elle être nulle ?", opts: ["oui", "non", "parfois", "en const"], a: 1, exp: "Contrairement au pointeur." },
    { type: "qcm", q: "Une référence peut-elle changer de cible ?", opts: ["oui", "non : liée à sa variable d'origine", "une fois", "en const"], a: 1, exp: "Non réassignable." },
    { type: "qcm", q: "Pour modifier via une référence, à l'appel écrit-on & ?", opts: ["oui", "non : doublerRef(n)", "toujours", "*n"], a: 1, exp: "Pas de syntaxe de pointeur." },
    { type: "qcm", q: "Un pointeur, lui, peut être…", opts: ["jamais nul", "nullptr, réassignable", "un alias fixe", "sans type"], a: 1, exp: "Plus souple, moins sûr." },
    { type: "qcm", q: "const std::string& sert à…", opts: ["copier", "lire un gros objet sans copie ni modification", "le vider", "trier"], a: 1, exp: "Passage idiomatique." },
    { type: "qcm", q: "Quand préférer la référence au pointeur ?", opts: ["jamais", "pour modifier/lire un argument existant", "toujours pour la mémoire dynamique", "pour nullptr"], a: 1, exp: "Plus sûre et lisible." },
    { type: "qcm", q: "Quand garder le pointeur ?", opts: ["jamais", "quand « aucun objet » (nullptr) est possible, ou pour new/tableaux", "pour lire", "toujours"], a: 1, exp: "Sa souplesse est parfois nécessaire." },
    { type: "qcm", q: "int& r = age; puis r = 9; donne age =", opts: ["inchangé", "9", "0", "adresse"], a: 1, exp: "r EST age." },
    { type: "qcm", q: "La référence nécessite-t-elle un * pour la valeur ?", opts: ["oui", "non : on l'utilise comme la variable", "parfois", "toujours"], a: 1, exp: "Syntaxe simple." },
    { type: "vf", q: "En cas de doute, on préfère la référence au pointeur.", a: true, exp: "Évite les bugs de nullité/pointeur pendant." },
    { type: "qcm", q: "Une référence doit être…", opts: ["laissée vide", "initialisée à sa déclaration", "un int", "réassignée"], a: 1, exp: "Pas de référence « vide »." },
    { type: "qcm", q: "doublerRef(int& x){ x*=2; } appelé doublerRef(n)…", opts: ["ne change rien", "double n (l'original)", "copie n", "plante"], a: 1, exp: "Agit sur l'original." },
    { type: "qcm", q: "Le pointeur pendant (dangling) est un risque…", opts: ["de la référence const", "du pointeur (adresse devenue invalide)", "des int", "de cout"], a: 1, exp: "La référence en évite certains." },
    { type: "qcm", q: "Pour l'allocation dynamique (new), on utilise…", opts: ["une référence", "un pointeur", "un int", "rien"], a: 1, exp: "new renvoie un pointeur." }
  ],
  final: {
    title: "Exercice final — Choisir référence ou pointeur",
    intro: `<p>Deux fonctions doivent réapprovisionner un stock. Analyse :</p>
<pre class="pseudo">void reapproA(int stock, int n) { stock += n; }    // stock est une COPIE (passage par valeur) → sans effet dehors
void reapproB(int* stock, int n) { stock += n; }   // BUG : stock += n déplace le POINTEUR, il faudrait *stock += n</pre>`,
    questions: [
      { type: "qcm", q: "reapproA (par valeur) :", opts: ["marche", "ne modifie qu'une copie : sans effet", "plante", "trie"], a: 1, exp: "Passage par valeur." },
      { type: "qcm", q: "reapproB — <code>stock += n;</code> où stock est un int* :", opts: ["correct", "faux : ça modifie le POINTEUR, pas la valeur ; il faut *stock += n", "trie", "rien"], a: 1, exp: "Déréférencer d'abord." },
      { type: "qcm", q: "Version référence idéale :", opts: ["void reappro(int stock, int n)", "void reappro(int& stock, int n) { stock += n; }", "void reappro(int* stock)", "int reappro()"], a: 1, exp: "Simple et sûre." },
      { type: "qcm", q: "Avec la référence, l'appel est…", opts: ["reappro(&stock, 5)", "reappro(stock, 5)", "reappro(*stock, 5)", "reappro(stock*, 5)"], a: 1, exp: "Pas de &." },
      { type: "qcm", q: "Pour ce cas (modifier un int existant), on préfère…", opts: ["le pointeur", "la référence", "une macro", "une globale"], a: 1, exp: "Plus lisible, jamais nulle." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                     // pour std::cout
                                        // ligne vide pour aérer
void reappro(int&amp; stock, int n) {       // référence : stock EST la variable de l'appelant (simple et sûre)
    stock += n;                         // ajoute n au stock d'origine (stock = stock + n)
}                                       // fin de reappro
// (version pointeur correcte, si on tient au pointeur :)
void reapproPtr(int* stock, int n) { *stock += n; }   // *stock (la valeur pointée) += n, PAS stock (le pointeur)
                                        // ligne vide pour aérer
int main() {                            // point d'entrée
    int stock = 3;                      // stock initial
    reappro(stock, 5);                  // pas de &amp; : on passe stock directement (la référence s'en charge)
    std::cout &lt;&lt; stock &lt;&lt; "\\n";         // affiche 8 (3 + 5)
    return 0;                           // 0 = programme terminé sans erreur
}                                       // fin de main</pre>
<p>Pour modifier un argument existant, la référence est la plus claire. Le pointeur reste utile pour la mémoire dynamique — demain, les tableaux et l'arithmétique de pointeurs. </p>`
  }
};
</script>

  { id: "cppb-l04", title: "Deux versions de doubler", level: 2,
    statement: "Écris void doublerPtr(int* x) et void doublerRef(int& x) qui doublent la valeur. Dans main, applique chacune à une variable et affiche le résultat. Souligne en commentaire quelle est la plus simple à appeler.",
    hints: [
      "doublerPtr : *x *= 2; appelé doublerPtr(&n).",
      "doublerRef : x *= 2; appelé doublerRef(n).",
      "La référence évite le & à l'appel et le * dans le corps."
    ],
    solution: "#include <iostream>          // pour std::cout\n\nvoid doublerPtr(int* x) { *x *= 2; }   // pointeur : on dereference (*x) pour doubler la valeur\nvoid doublerRef(int& x) { x *= 2; }    // reference : x EST l'original, plus simple\n\nint main() {                 // point d'entree\n    int a = 5, b = 5;               // deux entiers de depart\n    doublerPtr(&a);                 // il faut passer l'ADRESSE : &a\n    doublerRef(b);                  // pas de & : plus lisible\n    std::cout << a << \" \" << b << \"\\n\";   // affiche 10 10\n    return 0;                // 0 = programme termine sans erreur\n}",
    note: "Les deux modifient l'original, mais la référence est plus simple : pas de & à l'appel, pas de * dans le corps, et jamais nulle. On garde le pointeur pour les cas où sa souplesse (nullptr, new) est nécessaire." }
  ]
};
