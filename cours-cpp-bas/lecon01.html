  title: "Du C au C++ : premier programme",
  subtitle: "Le C++ comme « un C amélioré » : mêmes fondations, nouveaux outils. On part du plus proche du C.",
  theory: `
<h3>1. De quoi parle-t-on ? Les mots de base</h3>
<p>Avant tout, posons le vocabulaire. Un <strong>ordinateur</strong> ne comprend que des 0 et des 1. Un <strong>programme</strong> est une liste d'<strong>instructions</strong> (des ordres) que la machine exécute une par une, de haut en bas. Nous, humains, écrivons ces ordres dans un <strong>langage de programmation</strong> lisible (ici le C++) : c'est le <strong>code source</strong>. Un outil appelé <strong>compilateur</strong> traduit ensuite ce code source en langage machine (les 0 et 1) : on appelle ça <strong>compiler</strong>. Le résultat est un fichier <strong>exécutable</strong> que l'on peut lancer.</p>
<p>Le <strong>C</strong> et le <strong>C++</strong> sont deux langages proches. Le C est ancien et très « bas niveau » : il te fait manipuler directement la mémoire de la machine. Le C++ reprend tout le C et ajoute des outils plus modernes par-dessus.</p>

<h3>2. Le C++ englobe le C</h3>
<p>Le C++ a été conçu comme une <strong>extension</strong> du C : presque tout programme C valide compile aussi en C++. « Bas niveau » veut dire qu'on reste <strong>proche de la machine</strong> (on voit la mémoire, les adresses…), par opposition au « haut niveau » qui cache ces détails. Ce cours prend cet angle <strong>bas niveau</strong> : on garde les pointeurs, la mémoire manuelle et la logique du C, puis on introduit progressivement les apports du C++ (classes, références, virtual). Objectif : comprendre ce qui se passe <strong>sous le capot</strong>, c'est-à-dire ce que la machine fait réellement.</p>

<h3>3. Le programme minimal</h3>
<pre class="pseudo">#include &lt;iostream&gt;                              // demande d'inclure la « boîte à outils » iostream (pour afficher/lire du texte)
                                                 // ligne vide : ignorée, elle sert seulement à aérer le code
int main() {                                     // main = la fonction où le programme DÉMARRE ; int = elle rend un entier ; { ouvre le bloc
    std::cout &lt;&lt; "Bonjour le monde !" &lt;&lt; "\\n";  // envoie le texte, puis un passage à la ligne, vers l'écran
    return 0;                                     // rend la valeur 0 = « tout s'est bien passé » ; termine main
}                                                // } ferme le bloc de main</pre>
<p>Décortiquons chaque mot. <code>#include</code> est une <strong>directive</strong> (un ordre donné avant la compilation) qui veut dire « colle ici le contenu d'un autre fichier ». <code>&lt;iostream&gt;</code> est un <strong>en-tête</strong> (en anglais <em>header</em>) : un fichier de la bibliothèque standard qui contient les outils d'<em>input/output stream</em> (flux d'entrée/sortie), c'est-à-dire de quoi lire au clavier et écrire à l'écran. Une <strong>bibliothèque</strong> est une collection de code déjà écrit et réutilisable.</p>
<p><code>main</code> est une <strong>fonction</strong> : un bloc d'instructions qui porte un nom. <code>main</code> est spéciale, c'est le <strong>point d'entrée</strong> : l'endroit exact où l'ordinateur commence à exécuter le programme. Le mot <code>int</code> (abréviation d'<em>integer</em>, entier) devant indique que la fonction renvoie un nombre entier à la fin. Les parenthèses <code>()</code> contiennent ses éventuels paramètres (ici, aucun). Les accolades <code>{ }</code> délimitent le <strong>bloc</strong>, c'est-à-dire le corps de la fonction — tout ce qu'elle fait.</p>
<p><code>std::cout</code> représente l'<strong>écran</strong> (la « sortie standard » ; <em>cout</em> = <em>character output</em>). Le préfixe <code>std::</code> signifie que <code>cout</code> vit dans l'<strong>espace de noms</strong> (en anglais <em>namespace</em>) nommé <code>std</code>, l'espace de la bibliothèque standard : c'est comme un nom de famille qui évite de confondre deux outils portant le même prénom. L'opérateur <code>&lt;&lt;</code> signifie « envoyer vers » : <code>std::cout &lt;&lt; "..."</code> se lit « envoie ce texte vers l'écran ». Les guillemets <code>"..."</code> délimitent une <strong>chaîne de caractères</strong>, c'est-à-dire du texte. <code>\\n</code> est un caractère spécial qui veut dire « aller à la ligne » (comme la touche Entrée). Le point-virgule <code>;</code> marque la <strong>fin d'une instruction</strong>, comme le point à la fin d'une phrase. Enfin <code>return 0;</code> <strong>renvoie</strong> la valeur 0 au système : par convention, 0 signifie « le programme s'est terminé sans erreur ».</p>

<h3>4. cout ou printf ?</h3>
<pre class="pseudo">std::cout &lt;&lt; "age = " &lt;&lt; 25 &lt;&lt; "\\n";   // C++ : on enchaîne texte + nombre + saut de ligne ; le type est deviné tout seul
printf("age = %d\\n", 25);            // C : %d est un « trou » à remplir par le nombre 25 (encore valide en C++ via &lt;cstdio&gt;)</pre>
<p><code>printf</code> est l'ancienne fonction du C pour afficher : elle utilise des <strong>spécificateurs de format</strong> (comme <code>%d</code> pour un entier) que tu dois faire correspondre, dans le bon ordre, aux valeurs. <code>printf</code> fonctionne toujours en C++ (en incluant l'en-tête <code>&lt;cstdio&gt;</code>), mais <code>std::cout</code> est plus <strong>sûr</strong> : pas de <code>%d</code>/<code>%f</code> à accorder au type — si tu te trompes de spécificateur avec <code>printf</code>, l'affichage est faux ; avec <code>cout</code>, le type est <strong>déduit</strong> (deviné) automatiquement.</p>

<h3>5. Compiler du C++</h3>
<pre class="pseudo">g++ -std=c++17 -Wall -Wextra prog.cpp -o prog   // g++ = compilateur ; norme C++17 ; -Wall/-Wextra = tous les avertissements ; prog.cpp = source ; -o prog = nomme l'exécutable "prog"
./prog                                           // lance l'exécutable "prog" que l'on vient de créer</pre>
<p>Ces deux lignes se tapent dans un <strong>terminal</strong> (une fenêtre où l'on écrit des commandes texte), pas dans le code. <code>g++</code> est le compilateur C++ (on utilise <code>g++</code> plutôt que <code>gcc</code>, qui est la version C). <code>-std=c++17</code> choisit la <strong>norme</strong> du langage : la version officielle des règles du C++ (ici celle de 2017). <code>-Wall</code> et <code>-Wextra</code> activent les <strong>avertissements</strong> (en anglais <em>warnings</em>) : des messages du compilateur qui signalent le code douteux avant qu'il ne pose problème. <code>prog.cpp</code> est ton fichier source (extension <code>.cpp</code> pour le C++). <code>-o prog</code> demande de nommer <code>prog</code> le fichier exécutable produit. <code>./prog</code> lance ce programme.</p>

<h3>6. Ce que le C++ ajoute (aperçu)</h3>
<pre class="pseudo">références (&amp;)   classes/objets   surcharge   new/delete   // outils ajoutés par le C++ par rapport au C (vus dans les prochaines leçons)
templates       std::string      la STL       exceptions    // idem : code générique, texte facile, grande bibliothèque, gestion d'erreurs</pre>
<p>Ne t'inquiète pas de ces mots : chacun sera défini le moment venu. En bref : une <strong>référence</strong> (<code>&amp;</code>) est un autre nom pour une variable existante ; une <strong>classe</strong> est un plan pour fabriquer des objets ; la <strong>surcharge</strong> permet plusieurs fonctions de même nom ; <code>new</code>/<code>delete</code> réservent et libèrent de la mémoire à la main ; les <strong>templates</strong> écrivent du code valable pour plusieurs types ; <code>std::string</code> est un texte facile à manipuler ; la <strong>STL</strong> est la grande boîte à outils standard ; les <strong>exceptions</strong> gèrent les erreurs.</p>
<div class="tip">Dans ce parcours, on découvre ces outils <strong>en partant des mécanismes bas niveau</strong> : pointeurs bruts, gestion mémoire manuelle, table des fonctions virtuelles. En comprenant le « comment », tu utiliseras ensuite le C++ moderne (STL, RAII) en connaissance de cause.</div>`,
  exercises: [
    { type: "qcm", q: "Le C++ est, par rapport au C…", opts: ["totalement différent", "une extension : presque tout code C compile en C++", "plus ancien", "sans pointeurs"], a: 1, exp: "Un « C amélioré »." },
    { type: "qcm", q: "Quel objet affiche du texte en C++ ?", opts: ["printf seul", "std::cout (avec <<)", "System.out", "echo"], a: 1, exp: "cout et l'opérateur <<." },
    { type: "qcm", q: "printf est-il utilisable en C++ ?", opts: ["non", "oui (via <cstdio>), mais cout est plus sûr", "seulement pour les int", "jamais"], a: 1, exp: "Le C reste largement compatible." },
    { type: "qcm", q: "Quel compilateur pour le C++ ?", opts: ["gcc", "g++ (ou clang++)", "python", "javac"], a: 1, exp: "g++." },
    { type: "qcm", q: "Quelle extension pour un source C++ ?", opts: [".c", ".cpp", ".h", ".exe"], a: 1, exp: ".cpp (aussi .cc, .cxx)." },
    { type: "qcm", q: "Où démarre le programme ?", opts: ["première ligne", "la fonction main", "cout", "l'include"], a: 1, exp: "int main()." },
    { type: "qcm", q: "Chaque instruction se termine par…", opts: ["un saut de ligne", "un point-virgule ;", "une virgule", "rien"], a: 1, exp: "Comme en C." },
    { type: "qcm", q: "Avantage de std::cout sur printf :", opts: ["plus lent", "pas de spécificateur de format à faire correspondre au type", "moins de types", "aucun"], a: 1, exp: "Le type est déduit." },
    { type: "qcm", q: "L'angle de ce cours est…", opts: ["la STL d'abord", "bas niveau : pointeurs et mémoire manuelle d'abord", "sans code", "graphique"], a: 1, exp: "Comprendre sous le capot." },
    { type: "qcm", q: "Quel en-tête pour std::cout ?", opts: ["<stdio.h>", "<iostream>", "<string>", "<cout>"], a: 1, exp: "#include <iostream>." },
    { type: "vf", q: "Comprendre la mémoire manuelle aide à mieux utiliser le C++ moderne ensuite.", a: true, exp: "On sait ce que la STL/RAII automatisent." },
    { type: "qcm", q: "-std=c++17 sert à…", opts: ["accélérer", "choisir la norme du langage", "lier une lib", "déboguer"], a: 1, exp: "Active les fonctionnalités de la norme." },
    { type: "qcm", q: "Les blocs sont délimités par…", opts: ["l'indentation", "des accolades { }", "begin/end", "des parenthèses"], a: 1, exp: "Comme en C." },
    { type: "qcm", q: "Parmi les apports du C++ :", opts: ["les références et les classes", "le point-virgule", "printf", "les commentaires"], a: 0, exp: "&, classes, templates, STL…" },
    { type: "qcm", q: "-Wall -Wextra active…", opts: ["l'optimisation", "les avertissements du compilateur", "les templates", "la STL"], a: 1, exp: "Détecte les erreurs discrètes." }
  ],
  final: {
    title: "Exercice final — Du C au C++",
    intro: `<p>Un programme mêlant styles, avec des erreurs :</p>
<pre class="pseudo">include &lt;iostream&gt;                     // ERREUR : il manque le # devant include (la directive est invalide)
int main() {                            // point d'entrée du programme ; { ouvre le bloc
    std::cout &lt;&lt; "Aurelia" &lt;&lt; "\\n"      // ERREUR : il manque le point-virgule ; à la fin de l'instruction
    printf("Bachelier\\n");              // affiche Bachelier + saut de ligne (style C, valide si &lt;cstdio&gt; est inclus)
    return 0                             // ERREUR : il manque le point-virgule ; après return 0
}                                       // } ferme le bloc de main</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — <code>include</code> :", opts: ["correct", "il manque le # : #include", "il faut import", "rien"], a: 1, exp: "#include." },
      { type: "qcm", q: "Erreur n°2 — la ligne cout :", opts: ["correct", "il manque le ; final", "il faut printf", "il faut cin"], a: 1, exp: "Instruction terminée par ;." },
      { type: "qcm", q: "Le <code>printf</code> compile-t-il en C++ ?", opts: ["jamais", "oui si on inclut <cstdio> (mais cout est préféré)", "seulement en C", "erreur toujours"], a: 1, exp: "Compatibilité C." },
      { type: "qcm", q: "Erreur n°3 — <code>return 0</code> :", opts: ["correct", "il manque le ;", "il faut return 1", "return interdit"], a: 1, exp: "; obligatoire." },
      { type: "qcm", q: "Compilation correcte :", opts: ["gcc prog.cpp", "g++ -std=c++17 -Wall prog.cpp -o prog", "python prog.cpp", "cpp prog"], a: 1, exp: "g++ avec la norme." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                     // # ajouté : la directive inclut l'en-tête iostream (pour std::cout)
#include &lt;cstdio&gt;                       // pour printf, si on y tient (en-tête C des entrées/sorties)
                                        // ligne vide pour aérer le code
int main() {                            // point d'entrée du programme ; { ouvre le bloc
    std::cout &lt;&lt; "Aurelia" &lt;&lt; "\\n";     // style C++ : envoie "Aurelia" + saut de ligne ; le ; final est bien présent
    printf("Bachelier\\n");              // style C, encore valide : affiche Bachelier + saut de ligne
    return 0;                            // rend 0 (= aucune erreur) et termine main ; le ; est bien présent
}                                       // } ferme le bloc de main
// g++ -std=c++17 -Wall prog.cpp -o prog  // commande (dans le terminal) pour compiler ce fichier</pre>
<p>Le C++ accepte les deux styles, mais <code>std::cout</code> est plus sûr. Ce cours part du C pour aller vers les abstractions. Demain : les types, <code>cout</code> et <code>cin</code>.</p>`
  }
};
