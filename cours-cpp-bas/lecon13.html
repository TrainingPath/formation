<script>
var DAY = {
  num: 13,
  title: "L'opérateur d'affectation",
  subtitle: "Le troisième pilier de la règle de trois : affecter un objet à un autre déjà existant.",
  theory: `
<h3>1. Copie vs affectation</h3>
<p>Deux situations se ressemblent mais sont différentes. <strong>Construire par copie</strong> = créer un objet <em>tout neuf</em> à partir d'un autre. <strong>Affecter</strong> = écraser le contenu d'un objet qui <em>existe déjà</em> avec celui d'un autre. Le C++ appelle une fonction différente dans chaque cas.</p>
<pre class="pseudo">Tableau b = a;   // b n'existe pas encore → on le CONSTRUIT à partir de a → appelle le CONSTRUCTEUR DE COPIE
b = a;           // b existe déjà → on REMPLACE son contenu par celui de a → appelle l'OPÉRATEUR D'AFFECTATION</pre>
<p>Distinction subtile mais essentielle : créer un objet <em>à partir d'</em>un autre appelle le <strong>constructeur de copie</strong> (leçon 12) ; affecter à un objet <strong>déjà existant</strong> appelle l'<strong>opérateur d'affectation</strong>, écrit <code>operator=</code> (la fonction qui définit le comportement du signe <code>=</code> pour ta classe).</p>

<h3>2. Écrire operator=</h3>
<pre class="pseudo">Tableau&amp; operator=(const Tableau&amp; o) {   // renvoie une référence à l'objet ; o = source (lue en const&)
    if (this == &amp;o) return *this;        // 1. AUTO-AFFECTATION : si on écrit a = a, ne rien détruire, renvoyer l'objet tel quel
    delete[] data_;                      // 2. libérer l'ANCIENNE ressource de cet objet (sinon elle fuit)
    n_ = o.n_;                           //    copier la taille
    data_ = new double[n_];              // 3. allouer une NOUVELLE ressource (nouveau tableau)
    for (int i = 0; i &lt; n_; i++) data_[i] = o.data_[i];   // 4. copier les données une à une (copie profonde)
    return *this;                        // 5. renvoyer l'objet courant, pour permettre l'enchaînement a = b = c
}</pre>
<p><code>this</code> est un pointeur spécial vers <strong>l'objet courant</strong> (celui sur lequel la méthode s'exécute) ; <code>*this</code> est donc cet objet lui-même, et <code>&amp;o</code> est l'adresse de la source. Comparer <code>this == &amp;o</code> revient à demander « suis-je en train de m'affecter à moi-même ? ».</p>

<h3>3. Les deux pièges</h3>
<div class="warn"><strong>Auto-affectation</strong> : <code>a = a</code>. Sans le test <code>this == &amp;o</code>, on ferait <code>delete[] data_</code> puis on tenterait de copier depuis… ce même tableau qu'on vient de libérer → catastrophe. <strong>Fuite</strong> : oublier le <code>delete[]</code> de l'ancien tableau avant d'en allouer un nouveau laisse l'ancien perdu en mémoire (fuite mémoire).</div>

<h3>4. La règle de trois, complète</h3>
<pre class="pseudo">Pour une classe à ressource brute (pointeur), écrire les TROIS :
  ~Tableau()                     // destructeur : libère la ressource
  Tableau(const Tableau&amp;)        // constructeur de copie : copie profonde à la CONSTRUCTION
  operator=(const Tableau&amp;)      // opérateur d'affectation : copie profonde à l'AFFECTATION</pre>
<p>Les trois ensemble garantissent que copie et affectation ne partagent jamais de mémoire (pas de double free) et ne fuient pas. C'est la <strong>règle de trois</strong> au complet.</p>

<h3>5. Règle de zéro (rappel)</h3>
<div class="tip">Si tes membres sont des types STL (<code>std::vector</code>, <code>std::string</code>, <code>unique_ptr</code>), le compilateur génère <strong>correctement</strong> ces trois fonctions tout seul : tu n'écris <strong>rien</strong>. C'est la règle de zéro, largement préférée. On maîtrise la règle de trois pour les rares cas de ressource brute — et pour comprendre.</div>`,
  exercises: [
    { type: "qcm", q: "<code>Tableau b = a;</code> appelle…", opts: ["operator=", "le constructeur de copie (b n'existe pas encore)", "le destructeur", "rien"], a: 1, exp: "Construction par copie." },
    { type: "qcm", q: "<code>b = a;</code> (b existe déjà) appelle…", opts: ["le constructeur de copie", "l'opérateur d'affectation (operator=)", "le destructeur", "new"], a: 1, exp: "Affectation." },
    { type: "qcm", q: "Le test <code>this == &o</code> gère…", opts: ["la vitesse", "l'auto-affectation (a = a)", "le tri", "les bornes"], a: 1, exp: "Sinon on se détruit soi-même." },
    { type: "qcm", q: "Avant d'allouer la nouvelle ressource, operator= doit…", opts: ["rien", "libérer l'ancienne (delete[]) pour ne pas fuir", "copier", "trier"], a: 1, exp: "Éviter la fuite." },
    { type: "qcm", q: "operator= renvoie…", opts: ["void", "*this (référence), pour permettre a = b = c", "un int", "un pointeur"], a: 1, exp: "Chaînage." },
    { type: "qcm", q: "La règle de trois : destructeur, constructeur de copie et…", opts: ["un getter", "l'opérateur d'affectation", "un template", "un constructeur par défaut"], a: 1, exp: "Les trois vont ensemble." },
    { type: "qcm", q: "Sans le test d'auto-affectation, <code>a = a</code>…", opts: ["marche", "libère data_ puis tente de le copier → catastrophe", "trie", "compile juste"], a: 1, exp: "Bug grave." },
    { type: "qcm", q: "Oublier delete[] de l'ancien tableau dans operator= cause…", opts: ["rien", "une fuite mémoire", "un tri", "une injection"], a: 1, exp: "L'ancien tableau fuit." },
    { type: "qcm", q: "Avec des membres std::vector, écrit-on operator= ?", opts: ["oui, toujours", "non : le compilateur le génère correctement (règle de zéro)", "un seul des trois", "impossible"], a: 1, exp: "La STL gère." },
    { type: "qcm", q: "operator= fait une copie…", opts: ["superficielle", "profonde (nouveau tableau, copie des données)", "nulle", "partagée"], a: 1, exp: "Comme le constructeur de copie." },
    { type: "vf", q: "La règle de zéro (membres STL) est préférée à la règle de trois quand c'est possible.", a: true, exp: "Moins de code, moins de bugs." },
    { type: "qcm", q: "Le paramètre d'operator= est…", opts: ["Tableau o", "const Tableau& o", "Tableau* o", "int"], a: 1, exp: "Référence const." },
    { type: "qcm", q: "operator= est nécessaire dès qu'on a écrit…", opts: ["un getter", "un destructeur/constructeur de copie (ressource brute)", "un main", "un cout"], a: 1, exp: "Règle de trois." },
    { type: "qcm", q: "Renvoyer *this permet…", opts: ["rien", "l'affectation chaînée a = b = c", "de trier", "de compiler"], a: 1, exp: "Cohérence avec les types intégrés." },
    { type: "qcm", q: "Les 5 étapes d'un operator= correct :", opts: ["copier seulement", "test auto-affectation, libérer, allouer, copier, return *this", "delete deux fois", "rien"], a: 1, exp: "Ordre sûr." }
  ],
  final: {
    title: "Exercice final — Compléter operator=",
    intro: `<p>Un operator= incomplet. Analyse :</p>
<pre class="pseudo">Tableau&amp; operator=(const Tableau&amp; o) {   // opérateur d'affectation ; o = source
    n_ = o.n_;                           // copie la taille
    data_ = new double[n_];              // MANQUE avant : delete[] data_ (l'ancien tableau fuit) ET le test d'auto-affectation
    for (int i = 0; i &lt; n_; i++) data_[i] = o.data_[i];   // copie les données
    return *this;                        // renvoie l'objet (chaînage)
}</pre>`,
    questions: [
      { type: "qcm", q: "Manque n°1 — au début :", opts: ["rien", "le test d'auto-affectation (if (this == &o) return *this;)", "un cout", "un delete"], a: 1, exp: "a = a doit être géré." },
      { type: "qcm", q: "Manque n°2 — avant <code>data_ = new double[n_]</code> :", opts: ["rien", "delete[] data_ de l'ancien tableau (sinon fuite)", "un return", "un template"], a: 1, exp: "Libérer l'ancien." },
      { type: "qcm", q: "Sans le test, <code>a = a</code> :", opts: ["marche", "on libérerait data_ avant de le copier → corruption", "trie", "compile juste"], a: 1, exp: "Bug d'auto-affectation." },
      { type: "qcm", q: "L'ordre correct est :", opts: ["copier puis libérer", "test → libérer → allouer → copier → return *this", "allouer deux fois", "return d'abord"], a: 1, exp: "Sûr." },
      { type: "qcm", q: "Cette classe, ayant operator=, doit aussi avoir…", opts: ["rien", "un destructeur et un constructeur de copie (règle de trois)", "un template", "un main"], a: 1, exp: "Les trois." }
    ],
    solution: `<pre class="pseudo">Tableau&amp; operator=(const Tableau&amp; o) {   // opérateur d'affectation ; renvoie une référence, o = source (const&)
    if (this == &amp;o) return *this;        // 1. auto-affectation : a = a → ne rien faire de destructeur
    delete[] data_;                      // 2. libérer l'ancien tableau (évite la fuite)
    n_ = o.n_;                           //    reprendre la taille de la source
    data_ = new double[n_];              // 3. allouer le nouveau tableau
    for (int i = 0; i &lt; n_; i++)         // 4. copier les données une à une (copie profonde)
        data_[i] = o.data_[i];
    return *this;                        // 5. renvoyer l'objet courant → autorise a = b = c
}</pre>
<p>Test d'auto-affectation, libération de l'ancien, allocation, copie, <code>return *this</code> : la règle de trois est complète. En pratique, préfère des membres STL (règle de zéro). Demain : héritage et fonctions virtuelles.</p>`
  }
};
</script>
