<script>
var DAY = {
  num: 7,
  title: "Fonctions : pointeur et référence",
  subtitle: "Découper le code, et choisir le bon mode de passage : valeur, pointeur, référence, const&.",
  theory: `
<h3>1. Définition et prototype</h3>
<p>Une <strong>fonction</strong> est un bloc d'instructions qui porte un nom, prend éventuellement des <strong>paramètres</strong> (des valeurs qu'on lui donne à l'entrée) et renvoie un résultat. Elle sert à <strong>découper</strong> le code en morceaux réutilisables. Un <strong>argument</strong> est la valeur concrète qu'on passe à l'appel ; le <strong>paramètre</strong> est la variable qui la reçoit dans la fonction.</p>
<pre class="pseudo">double tarif(double prixJour, int jours) {   // double = type de retour ; tarif = nom ; entre () = les paramètres reçus
    double t = prixJour * jours;             // calcule le total = prix par jour × nombre de jours
    if (jours &gt;= 3) t *= 0.9;                // SI au moins 3 jours : appliquer -10 % (t = t × 0,9)
    return t;                                // renvoie le tarif calculé à celui qui a appelé la fonction
}</pre>
<p>La première ligne est l'<strong>en-tête</strong> de la fonction : le <strong>type de retour</strong> (ici <code>double</code>) dit quelle sorte de valeur elle rend, le <strong>nom</strong> (<code>tarif</code>) sert à l'appeler, et les <strong>paramètres</strong> entre parenthèses sont ses entrées. Un <strong>prototype</strong> est cette en-tête écrite seule (suivie d'un <code>;</code>) avant <code>main</code>, pour <em>annoncer</em> une fonction définie plus bas (ou dans un fichier <code>.h</code>, leçon 15).</p>

<h3>2. Les quatre modes de passage</h3>
<p>Passer un argument à une fonction peut se faire de quatre manières, selon qu'on veut copier, modifier ou juste lire l'original.</p>
<pre class="pseudo">void f(int x);                  // par VALEUR : la fonction reçoit une COPIE de x (idéal pour les petits types)
void f(int* x);                 // par POINTEUR : reçoit l'adresse ; on utilise *x pour la valeur ; appel avec &amp;x
void f(int&amp; x);                 // par RÉFÉRENCE : x est un alias de l'original → on le modifie ; appel simple, sans &amp;
void f(const std::string&amp; s);  // par const& : on LIT un gros objet sans le copier (const = pas de modification)</pre>
<p><code>void</code> comme type de retour signifie « ne renvoie rien ». Le choix du mode change ce que la fonction peut faire à l'original : rien (valeur, c'est une copie), ou le modifier (pointeur/référence), ou seulement le lire efficacement (<code>const&amp;</code>).</p>

<h3>3. Modifier un argument</h3>
<pre class="pseudo">void reappro(int&amp; stock, int n) { stock += n; }    // RÉFÉRENCE : stock EST la variable de l'appelant ; stock += n l'augmente (le plus simple)
void reapproP(int* stock, int n) { *stock += n; }  // POINTEUR : *stock est la valeur pointée ; *stock += n l'augmente</pre>
<div class="warn">Erreur classique avec le pointeur : écrire <code>stock += n;</code> au lieu de <code>*stock += n;</code>. Sans l'étoile, on déplace le <em>pointeur</em> (son adresse) au lieu de modifier la valeur ! La référence évite complètement ce piège, car il n'y a pas d'étoile à oublier.</div>

<h3>4. Lire un gros objet sans copie</h3>
<pre class="pseudo">double total(const std::vector&lt;double&gt;&amp; prix) {   // const& : on reçoit le vector SANS le copier, en lecture seule
    double s = 0;                                 // accumulateur de la somme, démarre à 0
    for (double p : prix) s += p;                 // pour chaque prix p de la liste, l'ajouter à s (for-range, leçon dédiée)
    return s;                                     // renvoie la somme totale
}</pre>
<p>Un <code>std::vector&lt;double&gt;</code> est une <strong>liste</strong> de nombres à virgule (un tableau qui gère sa taille tout seul). Le passer <em>par valeur</em> le <strong>recopierait</strong> entièrement à chaque appel — coûteux s'il est gros. La <code>const&amp;</code> (référence constante) évite la copie (on travaille sur l'original) et garantit qu'on ne fait que le <strong>lire</strong>.</p>

<h3>5. Choisir le mode</h3>
<pre class="pseudo">int, double, bool    → par valeur                          // petits types : copier ne coûte rien
modifier un argument → référence (int&amp;)  ou pointeur si nullptr possible   // & pour agir sur l'original
lire un gros objet   → const T&amp;                            // référence constante : pas de copie, lecture seule</pre>
<div class="tip">Règle : petits types par valeur, objets à lire en <code>const&amp;</code>, arguments à modifier par référence. Le pointeur reste pour la mémoire dynamique et les cas « pas d'objet » (<code>nullptr</code>). Ce sont les fondations d'un code C++ efficace.</div>`,
  exercises: [
    { type: "qcm", q: "Un int se passe idéalement…", opts: ["par const&", "par valeur", "par pointeur", "par référence toujours"], a: 1, exp: "Copier un int est trivial." },
    { type: "qcm", q: "Pour modifier un argument simplement :", opts: ["par valeur", "par référence (int&)", "par copie", "par const&"], a: 1, exp: "Appel simple, jamais nul." },
    { type: "qcm", q: "Pour lire un gros objet sans copie :", opts: ["par valeur", "en const T&", "en T&", "en T*"], a: 1, exp: "Référence const." },
    { type: "qcm", q: "Erreur avec un int* : <code>stock += n;</code> :", opts: ["correct", "modifie le pointeur, pas la valeur (il faut *stock += n)", "plante", "trie"], a: 1, exp: "Déréférencer d'abord." },
    { type: "qcm", q: "Passer un gros objet par valeur…", opts: ["est gratuit", "le copie (coûteux)", "le modifie", "le déplace"], a: 1, exp: "D'où const&." },
    { type: "qcm", q: "reappro(int& stock, int n) s'appelle…", opts: ["reappro(&stock, 5)", "reappro(stock, 5)", "reappro(*stock, 5)", "reappro(stock*, 5)"], a: 1, exp: "Pas de & avec la référence." },
    { type: "qcm", q: "Un prototype avant main sert à…", opts: ["exécuter", "déclarer la fonction avant son appel", "compiler moins", "trier"], a: 1, exp: "Si définie plus bas." },
    { type: "qcm", q: "const std::string& en paramètre :", opts: ["copie la string", "la lit sans copie ni modification", "la vide", "la trie"], a: 1, exp: "Efficace et sûr." },
    { type: "qcm", q: "Quand garder le pointeur ?", opts: ["jamais", "pour nullptr possible ou la mémoire dynamique", "toujours", "pour lire"], a: 1, exp: "Sa souplesse est parfois nécessaire." },
    { type: "qcm", q: "Le retour d'une fonction se fait avec…", opts: ["print", "return valeur;", "out", "give"], a: 1, exp: "return." },
    { type: "vf", q: "La référence évite le piège du * oublié qu'on a avec les pointeurs.", a: true, exp: "Appel et corps plus simples." },
    { type: "qcm", q: "double total(const std::vector<double>& v) évite…", opts: ["le tri", "la copie du vector à chaque appel", "les exceptions", "rien"], a: 1, exp: "const& = pas de copie." },
    { type: "qcm", q: "reapproP(int* stock, int n) modifie via…", opts: ["stock", "*stock", "&stock", "stock[0] seulement"], a: 1, exp: "Déréférencement." },
    { type: "qcm", q: "Le mode par défaut pour un bool :", opts: ["const&", "par valeur", "pointeur", "référence"], a: 1, exp: "Petit type." },
    { type: "qcm", q: "Une bonne fonction…", opts: ["fait tout", "fait une chose, nom clair, bon passage", "n'a pas de nom", "est globale"], a: 1, exp: "Responsabilité unique." }
  ],
  final: {
    title: "Exercice final — Choisir le bon passage",
    intro: `<p>Une fonction qui affiche un catalogue et met à jour un compteur. Analyse :</p>
<pre class="pseudo">void bilan(std::vector&lt;double&gt; prix, int compteur) {   // 2 PROBLÈMES : prix par valeur (copie), compteur par valeur (modif perdue)
    for (double p : prix) std::cout &lt;&lt; p;              // affiche chaque prix (lecture seule → const& suffirait)
    compteur = prix.size();                            // met à jour une COPIE : l'appelant ne verra rien
}</pre>`,
    questions: [
      { type: "qcm", q: "Problème n°1 — <code>std::vector<double> prix</code> par valeur :", opts: ["correct", "copie tout le vector : passer const&", "trie", "rien"], a: 1, exp: "const std::vector<double>&." },
      { type: "qcm", q: "Problème n°2 — <code>compteur</code> par valeur :", opts: ["correct", "la mise à jour est perdue : passer int& pour modifier l'appelant", "trie", "rien"], a: 1, exp: "Référence pour modifier." },
      { type: "qcm", q: "Le vector est-il modifié ici ?", opts: ["oui", "non, seulement lu → const&", "parfois", "vidé"], a: 1, exp: "Lecture seule." },
      { type: "qcm", q: "Bonne signature :", opts: ["void bilan(std::vector<double> prix, int compteur)", "void bilan(const std::vector<double>& prix, int& compteur)", "void bilan(int& prix)", "void bilan()"], a: 1, exp: "const& pour lire, & pour modifier." },
      { type: "qcm", q: "Le mode « lire sans copier » :", opts: ["par valeur", "const T&", "T&", "T*"], a: 1, exp: "Référence const." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                 // pour std::cout
#include &lt;vector&gt;                   // pour std::vector
                                    // ligne vide pour aérer
void bilan(const std::vector&lt;double&gt;&amp; prix, int&amp; compteur) {  // const& = lire sans copier ; int& = modifier l'appelant
    for (double p : prix) std::cout &lt;&lt; p &lt;&lt; " ";              // affiche chaque prix suivi d'une espace
    std::cout &lt;&lt; "\\n";                                        // saut de ligne à la fin
    compteur = static_cast&lt;int&gt;(prix.size());                // static_cast<int> : convertit proprement la taille (size_t) en int
}                                                             // fin de bilan
int main() {                            // point d'entrée
    std::vector&lt;double&gt; prix = {44.90, 12.50};   // liste de 2 prix
    int compteur = 0;                            // compteur, encore à 0
    bilan(prix, compteur);                       // prix passé sans copie, compteur passé pour être modifié
    std::cout &lt;&lt; "Compteur : " &lt;&lt; compteur &lt;&lt; "\\n";  // affiche 2 : la modification est bien remontée
    return 0;                           // 0 = programme terminé sans erreur
}                                       // fin de main</pre>
<p>Le vector lu passe en <code>const&amp;</code> (pas de copie), le compteur à modifier en <code>int&amp;</code>. Bon passage = code efficace et correct. Demain : <code>struct</code> et <code>class</code>.</p>`
  }
};

    hints: [
      "reappro : référence non-const (modifie) : stock += n;",

      "Appelle reappro(stock, 5); sans &."
    ],
    solution: "#include <iostream>          // pour std::cout\n#include <string>            // pour std::string\n\nvoid reappro(int& stock, int n) { stock += n; }   // reference : augmente le stock de l'appelant\nvoid afficher(const std::string& nom, int stock) {   // const& : lit le nom sans le copier\n    std::cout << nom << \" : stock \" << stock << \"\\n\";   // affiche le nom et le stock\n}\n\nint main() {                 // point d'entree\n    std::string nom = \"Catan\";      // nom du jeu\n    int stock = 3;                  // stock de depart\n    reappro(stock, 5);              // stock devient 8 (3 + 5)\n    afficher(nom, stock);           // affiche Catan : stock 8\n    return 0;                // 0 = programme termine sans erreur\n}",
    note: "int& pour modifier le stock (appel simple, sans &), const std::string& pour lire le nom sans le copier. Ce sont les deux passages idiomatiques du C++ : & pour modifier, const& pour lire un objet." }
  ]
};
