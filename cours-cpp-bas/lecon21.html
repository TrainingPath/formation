<h3>Récapitulatif du parcours</h3>
<p>Avant l'épreuve, voici la carte de tout ce que tu as appris. Rappels express des termes-clés : un <strong>pointeur</strong> contient une adresse mémoire ; une <strong>référence</strong> est un autre nom pour une variable ; le <strong>tas</strong> est la mémoire réservée à la main (via <code>new</code>) ; la <strong>règle de trois</strong> impose destructeur + constructeur de copie + <code>operator=</code> pour toute classe à pointeur brut ; <code>virtual</code> active le <strong>polymorphisme</strong> (bonne méthode choisie au type réel).</p>
<pre class="pseudo">Semaine 1 — Du C au C++
  1 cout, compilation g++    2 types, cin        3 pointeurs bruts
  4 références vs pointeurs  5 tableaux, arithmétique de pointeurs
  6 char[] vs std::string    7 passage pointeur/référence

Semaine 2 — Objets et mémoire manuelle
  8 struct/class            9 new/delete         10 new[]/delete[]
  11 constructeur/destructeur (RAII manuel)      12 règle de trois (copie)
  13 operator=             14 héritage, virtual, vtable

Semaine 3 — Organisation et vrais programmes
  15 .h/.cpp               16 fstream            17 fuites, valgrind
  18 pointeurs de fonctions, foncteurs          19 macros vs const/constexpr
  20 projet (gestionnaire à mémoire manuelle)</pre>
<div class="tip">Les réflexes du bas niveau : un <code>new</code> = un <code>delete</code> (et <code>new[]</code> = <code>delete[]</code>), rester dans les bornes, la <strong>règle de trois</strong> pour toute classe à pointeur brut, un <strong>destructeur virtuel</strong> pour l'héritage, et compiler avec <code>-Wall -Wextra</code> + tester avec <code>valgrind</code>/sanitizer.</div>
<div class="warn">La grande leçon : tout ce que tu as fait à la main (mémoire, copie, tableaux dynamiques), le <strong>C++ moderne</strong> l'automatise avec la STL et le RAII (<code>std::vector</code>, <code>std::string</code>, smart pointers). Tu comprends maintenant <em>pourquoi</em> — et tu peux descendre au bas niveau quand c'est nécessaire.</div>`,
  exercises: [
    { type: "qcm", q: "Que fait <code>&x</code> ?", opts: ["la valeur de x", "l'adresse de x", "le double", "rien"], a: 1, exp: "& = adresse." },

    { type: "vf", q: "Le C++ moderne automatise avec la STL et le RAII ce qu'on a fait à la main.", a: true, exp: "vector, string, smart pointers." },

  final: {
    title: "Épreuve finale — Relire une classe à ressource",
    intro: `<p>Analyse cette classe qui gère un tableau d'entiers :</p>
<pre class="pseudo">class Serie {                              // classe possédant un tableau dynamique d'int
    int* data_; int n_;                    // data_ = pointeur vers le tableau ; n_ = taille
public:                                    // interface publique
    Serie(int n) : data_(new int[n]), n_(n) {}   // constructeur : alloue le tableau (new[])
    ~Serie() { delete[] data_; }           // destructeur : libère (delete[])
    int&amp; operator[](int i) { return data_[i]; }   // operator[] : accès a[i] ; renvoie une référence (donc modifiable) ; PAS de contrôle de bornes
};                                         // MANQUE : constructeur de copie et operator= (règle de trois)
Serie a(3);                                // a possède son tableau
a[0] = 42;                                 // range 42 en position 0 (via operator[])
Serie b = a;                               // ? copie superficielle : b partage le tableau de a → double free plus tard</pre>`,
    questions: [
      { type: "qcm", q: "<code>Serie b = a;</code> ici :", opts: ["copie profonde", "copie superficielle (b.data_ == a.data_) → double free à la destruction", "erreur de compilation", "rien"], a: 1, exp: "Pas de constructeur de copie." },
      { type: "qcm", q: "Ce qui manque à la classe :", opts: ["un getter", "le constructeur de copie et l'operator= (règle de trois)", "un template", "un main"], a: 1, exp: "Classe à pointeur brut." },
      { type: "qcm", q: "operator[] sans vérification de bornes…", opts: ["est sûr", "peut déborder (comme un tableau brut)", "trie", "plante toujours"], a: 1, exp: "Pas de contrôle." },
      { type: "qcm", q: "La solution moderne à toute cette classe :", opts: ["plus de delete", "un membre std::vector<int> (règle de zéro)", "un pointeur global", "malloc"], a: 1, exp: "Copie/affectation gérées automatiquement." },
      { type: "qcm", q: "Un destructeur virtuel serait nécessaire si…", opts: ["jamais", "la classe était destinée à l'héritage polymorphe", "elle a un operator[]", "toujours"], a: 1, exp: "Pour l'héritage." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                     // pour std::cout
                                        // ligne vide pour aérer
class Serie {                           // classe à ressource, règle de trois complète
    int* data_; int n_;                 // pointeur vers le tableau + taille
public:                                 // interface publique
    Serie(int n) : data_(new int[n]), n_(n) {         // constructeur : alloue (new[])
        for (int i = 0; i &lt; n_; i++) data_[i] = 0;    // initialise tout à 0
    }
    Serie(const Serie&amp; o) : data_(new int[o.n_]), n_(o.n_) {   // 1) constructeur de COPIE : copie profonde (nouveau tableau)
        for (int i = 0; i &lt; n_; i++) data_[i] = o.data_[i];   // recopie les valeurs une à une
    }
    Serie&amp; operator=(const Serie&amp; o) {                 // 2) opérateur d'AFFECTATION
        if (this == &amp;o) return *this;                 //   auto-affectation (a = a) : ne rien détruire
        delete[] data_; n_ = o.n_; data_ = new int[n_];   //   libérer l'ancien, reprendre la taille, allouer le neuf
        for (int i = 0; i &lt; n_; i++) data_[i] = o.data_[i];   //   copie profonde des données
        return *this;                                 //   renvoyer *this (chaînage a = b = c)
    }
    ~Serie() { delete[] data_; }        // 3) DESTRUCTEUR : libère (delete[])
    int&amp; operator[](int i) { return data_[i]; }   // accès a[i] (idéalement, vérifier que i est dans les bornes)
};                                      // ; final obligatoire
// … ou, tout simplement : class Serie { std::vector&lt;int&gt; data_; };   // la STL gère copie/affectation/libération (règle de zéro)</pre>
<p>La règle de trois complète évite le double free ; un membre <code>std::vector</code> l'aurait rendue inutile (règle de zéro). Tu maîtrises le bas niveau <em>et</em> tu sais pourquoi le C++ moderne préfère la STL. Félicitations, et bon courage pour la suite du parcours C++ !</p>`
  }
};

    ],
    solution: "#include <iostream>          // pour std::cout\n\nclass Tableau {              // classe a ressource (regle de trois complete)\n    int* data_;              // pointeur vers le tableau (tas)\n    int n_;                  // nombre d'elements\npublic:                      // interface publique\n    Tableau(int n) : data_(new int[n]), n_(n) {   // constructeur : alloue (new[])\n        for (int i = 0; i < n_; i++) data_[i] = 0;   // initialise a 0\n    }\n    Tableau(const Tableau& o) : data_(new int[o.n_]), n_(o.n_) {   // constructeur de COPIE : copie profonde\n        for (int i = 0; i < n_; i++) data_[i] = o.data_[i];   // recopie les valeurs\n    }\n    Tableau& operator=(const Tableau& o) {   // operateur d'AFFECTATION\n        if (this == &o) return *this;        // auto-affectation (a = a)\n        delete[] data_;                      // liberer l'ancien tableau\n        n_ = o.n_;                           // reprendre la taille\n        data_ = new int[n_];                 // allouer le nouveau\n        for (int i = 0; i < n_; i++) data_[i] = o.data_[i];   // copie profonde\n        return *this;                        // chainage a = b = c\n    }\n    ~Tableau() { delete[] data_; }           // DESTRUCTEUR : libere (delete[])\n    void set(int i, int v) { if (i >= 0 && i < n_) data_[i] = v; }   // ecrit v en i (si dans les bornes)\n    int get(int i) const { return data_[i]; }   // lit l'element i\n};\n\nint main() {                 // point d'entree\n    Tableau a(2);           // a possede son tableau\n    a.set(0, 42);           // a[0] = 42\n    Tableau b = a;          // copie PROFONDE : b a son propre tableau\n    b.set(0, 99);           // on modifie seulement b\n    std::cout << a.get(0) << \" \" << b.get(0) << \"\\n\";   // affiche 42 99 (independants)\n    return 0;                // chacun libere SON tableau : pas de double free\n}",
    note: "La règle de trois complète (destructeur, constructeur de copie, operator=) garantit que a et b ont chacun leur tableau : copie indépendante (42 vs 99), aucune fuite, aucun double free. Un membre std::vector<int> rendrait ces trois fonctions inutiles (règle de zéro) — c'est tout l'apport du C++ moderne. Bravo d'être arrivée au bout !" }
