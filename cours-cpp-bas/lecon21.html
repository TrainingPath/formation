 <em>pourquoi</em> — et tu peux descendre au bas niveau quand c'est nécessaire.</div>",

    "solution": "<pre class=\"pseudo\">#include &lt;iostream&gt;                     // pour std::cout\n                                        // ligne vide pour aérer\nclass Serie {                           // classe à ressource, règle de trois complète\n    int* data_; int n_;                 // pointeur vers le tableau + taille\npublic:                                 // interface publique\n    Serie(int n) : data_(new int[n]), n_(n) {         // constructeur : alloue (new[])\n        for (int i = 0; i &lt; n_; i++) data_[i] = 0;    // initialise tout à 0\n    }\n    Serie(const Serie&amp; o) : data_(new int[o.n_]), n_(o.n_) {   // 1) constructeur de COPIE : copie profonde (nouveau tableau)\n        for (int i = 0; i &lt; n_; i++) data_[i] = o.data_[i];   // recopie les valeurs une à une\n    }\n    Serie&amp; operator=(const Serie&amp; o) {                 // 2) opérateur d'AFFECTATION\n        if (this == &amp;o) return *this;                 //   auto-affectation (a = a) : ne rien détruire\n        delete[] data_; n_ = o.n_; data_ = new int[n_];   //   libérer l'ancien, reprendre la taille, allouer le neuf\n        for (int i = 0; i &lt; n_; i++) data_[i] = o.data_[i];   //   copie profonde des données\n        return *this;                                 //   renvoyer *this (chaînage a = b = c)\n    }\n    ~Serie() { delete[] data_; }        // 3) DESTRUCTEUR : libère (delete[])\n    int&amp; operator[](int i) { return data_[i]; }   // accès a[i] (idéalement, vérifier que i est dans les bornes)\n};                                      // ; final obligatoire\n// … ou, tout simplement : class Serie { std::vector&lt;int&gt; data_; };   // la STL gère copie/affectation/libération (règle de zéro)</pre>\n<p>La règle de trois complète évite le double free ; un membre <code>std::vector</code> l'aurait rendue inutile (règle de zéro). Tu maîtrises le bas niveau <em>et</em> tu sais pourquoi le C++ moderne préfère la STL. Félicitations, et bon courage pour la suite du parcours C++ !</p>"

      "solution": "#include <iostream>          // pour std::cout\n\nclass Tableau {              // classe a ressource (regle de trois complete)\n    int* data_;              // pointeur vers le tableau (tas)\n    int n_;                  // nombre d'elements\npublic:                      // interface publique\n    Tableau(int n) : data_(new int[n]), n_(n) {   // constructeur : alloue (new[])\n        for (int i = 0; i < n_; i++) data_[i] = 0;   // initialise a 0\n    }\n    Tableau(const Tableau& o) : data_(new int[o.n_]), n_(o.n_) {   // constructeur de COPIE : copie profonde\n        for (int i = 0; i < n_; i++) data_[i] = o.data_[i];   // recopie les valeurs\n    }\n    Tableau& operator=(const Tableau& o) {   // operateur d'AFFECTATION\n        if (this == &o) return *this;        // auto-affectation (a = a)\n        delete[] data_;                      // liberer l'ancien tableau\n        n_ = o.n_;                           // reprendre la taille\n        data_ = new int[n_];                 // allouer le nouveau\n        for (int i = 0; i < n_; i++) data_[i] = o.data_[i];   // copie profonde\n        return *this;                        // chainage a = b = c\n    }\n    ~Tableau() { delete[] data_; }           // DESTRUCTEUR : libere (delete[])\n    void set(int i, int v) { if (i >= 0 && i < n_) data_[i] = v; }   // ecrit v en i (si dans les bornes)\n    int get(int i) const { return data_[i]; }   // lit l'element i\n};\n\nint main() {                 // point d'entree\n    Tableau a(2);           // a possede son tableau\n    a.set(0, 42);           // a[0] = 42\n    Tableau b = a;          // copie PROFONDE : b a son propre tableau\n    b.set(0, 99);           // on modifie seulement b\n    std::cout << a.get(0) << \" \" << b.get(0) << \"\\n\";   // affiche 42 99 (independants)\n    return 0;                // chacun libere SON tableau : pas de double free\n}",
