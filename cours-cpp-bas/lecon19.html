var DAY = {
  num: 19,
  title: "Préprocesseur, macros, const et constexpr",
  subtitle: "Le préprocesseur hérité du C, et pourquoi le C++ lui préfère const/constexpr.",
  theory: `
<h3>1. Le préprocesseur</h3>
<p>Avant même de compiler, un premier outil appelé <strong>préprocesseur</strong> (« pré » = avant) parcourt ton fichier et traite toutes les lignes commençant par un <strong>dièse</strong> <code>#</code>. Son travail est purement du <strong>copier-coller de texte</strong> : il ne comprend rien au C++, il manipule juste des caractères. Une <strong>macro</strong> est une règle de remplacement de texte qu'il applique.</p>
<pre class="pseudo">#include &lt;iostream&gt;   // INCLUSION : copie ici le contenu de l'en-tête iostream
#define PI 3.14159    // MACRO : remplace partout le mot PI par le texte 3.14159 (substitution)
#ifndef X_H           // COMPILATION CONDITIONNELLE : « si X_H n'est pas défini… » (base des gardes d'inclusion)
#define X_H           // …alors on le définit
#endif                // fin du bloc conditionnel</pre>
<p>Les lignes qui commencent par <code>#</code> sont donc traitées <strong>avant</strong> la compilation, par le préprocesseur — exactement comme en C. <code>#include</code> insère un fichier, <code>#define</code> crée une macro, <code>#ifndef</code>/<code>#endif</code> incluent ou non un bloc selon une condition.</p>

<h3>2. Le piège des macros</h3>
<pre class="pseudo">#define CARRE(x) x * x   // macro-fonction : CARRE(quelque chose) sera remplacé par le texte  quelque chose * quelque chose
CARRE(2 + 3)             // le préprocesseur écrit littéralement : 2 + 3 * 2 + 3 = 2 + 6 + 3 = 11, PAS 25 !</pre>
<div class="warn">Une macro est une <strong>substitution de texte aveugle</strong> : elle ne connaît ni les types, ni les priorités des opérateurs, ni la portée des variables. Ici <code>CARRE(2 + 3)</code> devient <code>2 + 3 * 2 + 3</code> car le texte est collé tel quel — la multiplication est prioritaire, d'où 11 au lieu de 25. C'est une source de bugs subtils. En C++, on évite les macros pour les constantes et les « petites fonctions ».</div>

<h3>3. const et constexpr (préférés)</h3>
<pre class="pseudo">const double TVA = 0.20;                        // CONSTANTE typée (un double), qui respecte la portée du code
constexpr int MAX = 100;                        // constexpr : constante dont la valeur est connue DÈS LA COMPILATION
constexpr int carre(int x) { return x * x; }    // fonction constexpr : peut être calculée à la compilation</pre>
<p><code>const</code> et <code>constexpr</code> sont de <strong>vraies variables typées</strong> et respectent les règles de portée : le compilateur les vérifie (leur type, leur bon usage), contrairement à <code>#define</code> qui n'est qu'un texte. <code>constexpr</code> (<em>constant expression</em>) va plus loin : il garantit que la valeur ou le calcul est fait <strong>à la compilation</strong> (avant l'exécution), ce qui est plus rapide.</p>

<h3>4. inline plutôt qu'une macro-fonction</h3>
<pre class="pseudo">inline int carre(int x) { return x * x; }   // une VRAIE fonction, typée et sûre (pas de piège de priorité)
// bien mieux que : #define CARRE(x) ((x)*(x))   // la macro doit multiplier les parenthèses pour éviter les bugs</pre>
<p>Pour remplacer une macro-fonction, on écrit une vraie fonction. Le mot-clé <code>inline</code> suggère au compilateur d'insérer le code de la fonction directement à l'endroit de l'appel (comme le ferait une macro, mais sans les pièges) : on garde la performance tout en profitant du typage et de la sécurité.</p>

<h3>5. Ce qui reste au préprocesseur</h3>
<pre class="pseudo">#include                      inclusion d'en-têtes         → indispensable, on le garde
#ifndef / #pragma once        gardes d'inclusion           → indispensable, on le garde
#define constante/fonction    → à REMPLACER par const / constexpr / inline (plus sûrs)</pre>
<div class="tip">Le préprocesseur reste nécessaire pour les inclusions et les gardes d'inclusion. Mais pour les <strong>constantes</strong> et les <strong>petites fonctions</strong>, le C++ offre mieux : <code>const</code>, <code>constexpr</code>, <code>inline</code> — typés et sûrs. Connaître les deux, c'est savoir quand utiliser quoi.</div>`,
  exercises: [
    { type: "qcm", q: "Quand agit le préprocesseur ?", opts: ["après l'exécution", "avant la compilation", "pendant l'exécution", "jamais"], a: 1, exp: "Il transforme le texte source." },
    { type: "qcm", q: "Une macro #define est…", opts: ["typée", "une substitution de texte aveugle (sans type ni portée)", "une fonction", "un const"], a: 1, exp: "Source de bugs subtils." },
    { type: "qcm", q: "<code>#define CARRE(x) x*x</code> pour CARRE(2+3) donne…", opts: ["25", "11 (2+3*2+3)", "10", "6"], a: 1, exp: "Piège de priorité." },
    { type: "qcm", q: "Pour une constante, le C++ préfère…", opts: ["#define", "const / constexpr (typés)", "une macro", "une globale"], a: 1, exp: "Vérifiés par le compilateur." },
    { type: "qcm", q: "constexpr garantit…", opts: ["rien", "un calcul/valeur à la compilation", "un type dynamique", "une macro"], a: 1, exp: "Connu dès la compilation." },
    { type: "qcm", q: "Pour remplacer une macro-fonction, on utilise…", opts: ["une autre macro", "une vraie fonction (inline si besoin)", "un #define", "un goto"], a: 1, exp: "Typée, sans piège." },
    { type: "qcm", q: "Le préprocesseur reste indispensable pour…", opts: ["les constantes", "#include et les gardes d'inclusion", "les boucles", "les classes"], a: 1, exp: "Inclusions." },
    { type: "qcm", q: "const respecte…", opts: ["rien", "le type et la portée (contrairement à #define)", "que la vitesse", "les macros"], a: 1, exp: "Vérifié par le compilateur." },
    { type: "qcm", q: "#pragma once sert de…", opts: ["constante", "garde d'inclusion (évite la double inclusion)", "fonction", "type"], a: 1, exp: "Alternative à #ifndef." },
    { type: "qcm", q: "inline int carre(int x) est…", opts: ["une macro", "une vraie fonction (sûre, typée)", "un const", "une erreur"], a: 1, exp: "Remplace CARRE." },
    { type: "vf", q: "En C++, on préfère const/constexpr à #define pour les constantes.", a: true, exp: "Typés et sûrs." },
    { type: "qcm", q: "Le danger d'une macro-fonction sans parenthèses :", opts: ["aucun", "erreurs de priorité lors de la substitution", "trop lente", "typée"], a: 1, exp: "CARRE(2+3) = 11." },
    { type: "qcm", q: "constexpr int carre(int x) { return x*x; } peut être évaluée…", opts: ["à l'exécution seulement", "à la compilation (si l'argument est constant)", "jamais", "au lancement"], a: 1, exp: "Calcul à la compilation." },
    { type: "qcm", q: "Le préprocesseur traite les lignes commençant par…", opts: ["//", "#", ";", "$"], a: 1, exp: "#include, #define…" },
    { type: "qcm", q: "Connaître préprocesseur ET const/constexpr permet…", opts: ["de tout mettre en #define", "de savoir quand utiliser quoi", "d'éviter les includes", "rien"], a: 1, exp: "Bon outil au bon endroit." }
  ],
  final: {
    title: "Exercice final — Moderniser des constantes",
    intro: `<p>Du code style C. Analyse :</p>
<pre class="pseudo">#define TVA 0.20              // constante non typée (simple texte)
#define MAX 100               // constante non typée (simple texte)
#define DOUBLE(x) x + x       // macro-fonction SANS parenthèses → dangereuse
int y = DOUBLE(3) * 2;        // attendu 12 ? En réalité : 3 + 3 * 2 = 9 (piège de substitution)</pre>`,
    questions: [
      { type: "qcm", q: "<code>DOUBLE(3) * 2</code> donne…", opts: ["12", "3 + 3 * 2 = 9 (piège de substitution)", "6", "erreur"], a: 1, exp: "Macro sans parenthèses." },
      { type: "qcm", q: "Version C++ de TVA :", opts: ["#define TVA 0.20", "const double TVA = 0.20;", "int TVA", "un pointeur"], a: 1, exp: "Constante typée." },
      { type: "qcm", q: "Version C++ de MAX :", opts: ["#define MAX 100", "constexpr int MAX = 100;", "double MAX", "une macro"], a: 1, exp: "constexpr." },
      { type: "qcm", q: "Version C++ de DOUBLE :", opts: ["une autre macro", "une fonction : inline int doubler(int x){ return 2*x; }", "un #define", "rien"], a: 1, exp: "Sûre, typée." },
      { type: "qcm", q: "Ce qui reste légitimement au préprocesseur :", opts: ["les constantes", "#include et les gardes d'inclusion", "les fonctions", "tout"], a: 1, exp: "Inclusions seulement." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                 // pour std::cout
                                    // ligne vide pour aérer
const double TVA = 0.20;            // constante TYPÉE (double), vérifiée par le compilateur
constexpr int MAX = 100;           // constante connue à la compilation
inline int doubler(int x) { return 2 * x; }   // VRAIE fonction (remplace la macro DOUBLE), sûre et typée
                                    // ligne vide pour aérer
int main() {                        // point d'entrée
    int y = doubler(3) * 2;        // doubler(3) = 6, puis * 2 = 12 : plus aucun piège de substitution
    std::cout &lt;&lt; y &lt;&lt; " " &lt;&lt; MAX &lt;&lt; " " &lt;&lt; TVA &lt;&lt; "\\n";   // affiche 12 100 0.2
    return 0;                       // 0 = programme terminé sans erreur
}                                   // fin de main</pre>
<p>Les constantes deviennent <code>const</code>/<code>constexpr</code> (typées), la macro-fonction une vraie fonction : plus de piège de substitution. Le préprocesseur ne sert plus qu'aux inclusions. Demain : le projet guidé.</p>`
  }
};
