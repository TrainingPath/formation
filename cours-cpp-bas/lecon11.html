  "title": "Constructeur et destructeur (ressource)",
  "subtitle": "Une classe qui alloue et libère elle-même sa mémoire : le RAII, écrit à la main.",
  "theory": "\n<h3>1. Le constructeur acquiert, le destructeur libère</h3>\n<p>Rappels : une <strong>classe</strong> est un plan pour fabriquer des <strong>objets</strong> (leçon 8) ; ses <strong>membres</strong> privés sont ses données internes. Deux méthodes spéciales encadrent la vie d'un objet. Le <strong>constructeur</strong> porte le nom de la classe et s'exécute automatiquement à la <strong>création</strong> de l'objet : il l'initialise. Le <strong>destructeur</strong> porte le nom de la classe précédé d'un tilde <code>~</code> et s'exécute automatiquement à la <strong>destruction</strong> de l'objet : il fait le ménage. Une <strong>ressource</strong> est quelque chose qu'on réserve puis qu'on doit rendre (mémoire du tas, fichier ouvert, verrou…).</p>\n<pre class=\"pseudo\">class Tableau {                  // une classe qui possède un tableau alloué dynamiquement\n    double* data_;               // membre privé : pointeur vers le tableau (sur le tas)\n    int n_;                      // membre privé : nombre d'éléments\npublic:                          // début de l'interface publique\n    Tableau(int n) : data_(new double[n]), n_(n) {   // CONSTRUCTEUR : la liste après ':' initialise data_ (new[]) et n_ ; il ACQUIERT\n        for (int i = 0; i &lt; n_; i++) data_[i] = 0.0; // remplit le tableau de zéros\n    }                            // fin du constructeur\n    ~Tableau() { delete[] data_; }                   // DESTRUCTEUR (~) : libère le tableau (delete[]) ; il LIBÈRE\n};                               // ; final obligatoire</pre>\n<p>La partie <code>: data_(new double[n]), n_(n)</code> après l'en-tête du constructeur s'appelle la <strong>liste d'initialisation</strong> : elle donne leur valeur de départ aux membres (ici, <code>data_</code> reçoit un tableau tout neuf, <code>n_</code> reçoit <code>n</code>). Le <strong>constructeur</strong> réserve la ressource (<code>new[]</code>) à la création ; le <strong>destructeur</strong> (<code>~Classe()</code>) la libère à la destruction. C'est le principe <strong>RAII</strong> (<em>Resource Acquisition Is Initialization</em>) : la ressource suit la vie de l'objet.</p>\n\n<h3>2. La destruction est automatique</h3>\n<pre class=\"pseudo\">void f() {                       // une fonction quelconque\n    Tableau t(5);                // création de t → le CONSTRUCTEUR s'exécute → new double[5]\n    /* ... on utilise t ... */   // t est utilisable ici\n}   // accolade fermante = fin de portée de t → le DESTRUCTEUR ~Tableau() s'exécute TOUT SEUL → delete[]</pre>\n<div class=\"warn\">On n'appelle jamais le destructeur soi-même : il s'exécute <strong>tout seul</strong> quand l'objet sort de <strong>portée</strong> (la portée est la zone de code où la variable existe : entre sa déclaration et l'accolade fermante de son bloc), ou lors d'un <code>delete</code>. Résultat : impossible d'oublier le <code>delete[]</code> — c'est la grande force du RAII.</div>\n\n<h3>3. Le destructeur nettoie tout</h3>\n<pre class=\"pseudo\">~Tableau() {                     // destructeur\n    delete[] data_;              // libère la mémoire allouée par le constructeur (new[] → delete[])\n    // (des fichiers ouverts, des verrous, etc. se libéreraient aussi ICI, au même endroit)\n}                                // fin du destructeur</pre>\n<p>Le destructeur est l'endroit unique où l'on rend <strong>toutes</strong> les ressources de l'objet. Pour ce <code>Tableau</code>, c'est juste le <code>delete[]</code> ; pour d'autres classes, ce serait fermer un fichier ou relâcher un verrou.</p>\n\n<h3>4. Attention : une classe à pointeur DOIT gérer sa copie</h3>\n<div class=\"warn\">Si une classe possède un pointeur brut (<code>data_</code>), sa <strong>copie par défaut</strong> (fournie gratuitement par le C++) copie l'<em>adresse</em> contenue dans le pointeur, pas les données pointées : les deux objets pointent alors vers le <strong>même</strong> tableau → à leur destruction, double <code>delete[]</code> et corruption de la mémoire. Il faut définir soi-même la copie (leçon 12) : c'est la <strong>règle de trois</strong> (si tu écris un destructeur, tu dois aussi écrire le constructeur de copie et l'opérateur d'affectation).</div>\n\n<h3>5. Le RAII, manuel ici, automatique avec la STL</h3>\n<pre class=\"pseudo\">// ici, on écrit new[]/delete[] nous-mêmes dans le constructeur/destructeur\n// avec un membre std::vector, tout serait automatique :\nclass Tableau { std::vector&lt;double&gt; data_; ... };   // le vector gère sa mémoire → plus AUCUN delete[] à écrire</pre>\n<div class=\"tip\">Écrire soi-même le RAII (constructeur qui alloue, destructeur qui libère) fait comprendre ce que <code>std::vector</code>, <code>std::string</code> et les smart pointers font pour toi. En pratique, on utilise ces types tout faits.</div>",

  "final": {
    "title": "Exercice final — Une classe RAII",
    "intro": "<p>Analyse cette classe qui gère un tableau :</p>\n<pre class=\"pseudo\">class Tableau {                          // classe possédant un tableau dynamique\n    double* data_;                       // pointeur vers le tableau (sur le tas)\n    int n_;                              // nombre d'éléments\npublic:                                  // interface publique\n    Tableau(int n) { data_ = new double[n]; n_ = n; }   // constructeur : alloue le tableau (dans le corps)\n    // pas de destructeur                // PROBLÈME : rien ne fera le delete[] → fuite mémoire\n};</pre>",
    "questions": [
      {

        "opts": [

      {

      {

        ],
        "a": 1,

      },
      {

        "q": "La liste d'initialisation serait préférable au corps car…",

    ],
    "solution": "<pre class=\"pseudo\">#include &lt;iostream&gt;                     // pour std::cout\n                                        // ligne vide pour aérer\nclass Tableau {                         // classe RAII possédant un tableau\n    double* data_;                     // pointeur vers le tableau (tas)\n    int n_;                            // nombre d'éléments\npublic:                                // interface publique\n    Tableau(int n) : data_(new double[n]), n_(n) {   // constructeur : acquiert via la liste d'init (new[])\n        for (int i = 0; i &lt; n_; i++) data_[i] = 0.0; // initialise tout à 0\n    }                                  // fin du constructeur\n    ~Tableau() { delete[] data_; }                   // destructeur : libère (delete[])\n    void set(int i, double v) { if (i &gt;= 0 &amp;&amp; i &lt; n_) data_[i] = v; }   // écrit v en position i, si i est dans les bornes\n    double get(int i) const { return data_[i]; }     // lit l'élément i (const : ne modifie pas l'objet)\n};                                     // ; final obligatoire\n                                        // ligne vide pour aérer\nint main() {                            // point d'entrée\n    Tableau t(3);                      // crée un Tableau de 3 → constructeur (new[])\n    t.set(0, 44.90);                   // range 44.90 en position 0\n    std::cout &lt;&lt; t.get(0) &lt;&lt; \"\\n\";      // affiche 44.9\n    return 0;                          // fin : ~Tableau() libère automatiquement la mémoire\n}                                      // fin de main</pre>\n<p>Constructeur qui alloue, destructeur qui libère : le RAII manuel. Mais cette classe possède un pointeur — demain, la <strong>règle de trois</strong> pour gérer sa copie sans catastrophe.</p>"
