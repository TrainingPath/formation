<script>
var DAY = {
  num: 5,
  title: "Tableaux et arithmétique de pointeurs",
  subtitle: "Le tableau C, sa relation intime avec les pointeurs, et l'absence de vérification des bornes.",
  theory: `
<h3>1. Le tableau C</h3>
<p>Un <strong>tableau</strong> est une <strong>suite de cases mémoire</strong> de même type, rangées <strong>côte à côte</strong> (on dit « contiguës »). Au lieu de créer 4 variables séparées, on crée une seule variable qui en contient 4, numérotées. Chaque case s'appelle un <strong>élément</strong>, et son numéro s'appelle un <strong>indice</strong> (ou <em>index</em>). Point crucial : les indices <strong>commencent à 0</strong>, donc un tableau de 4 cases a les indices 0, 1, 2, 3 (jamais 4).</p>
<pre class="pseudo">int stocks[4] = {3, 0, 5, 2};   // crée un tableau de 4 int ; [4] = taille fixe ; { } = valeurs initiales
std::cout &lt;&lt; stocks[0];         // affiche 3 : les crochets [0] lisent l'élément d'indice 0 (le premier)
stocks[1] = 7;                  // range 7 dans l'élément d'indice 1 (le deuxième) : {3, 7, 5, 2}</pre>
<p><code>int stocks[4]</code> déclare le tableau : <code>int</code> est le type des éléments, <code>stocks</code> le nom, <code>[4]</code> le nombre <strong>fixe</strong> de cases. Les crochets <code>[i]</code> servent à <strong>accéder</strong> à l'élément d'indice <code>i</code>, en lecture (<code>stocks[0]</code>) comme en écriture (<code>stocks[1] = 7</code>).</p>

<h3>2. Le nom du tableau est un pointeur</h3>
<pre class="pseudo">int* p = stocks;                          // le nom "stocks" se transforme en pointeur vers stocks[0] (on dit qu'il « décay »)
std::cout &lt;&lt; *p;                          // affiche 3 : *p = valeur pointée = stocks[0]
std::cout &lt;&lt; *(p + 1);                    // affiche 0 : p + 1 pointe l'élément SUIVANT, * en lit la valeur
std::cout &lt;&lt; (stocks[2] == *(stocks + 2)); // affiche 1 (vrai) : stocks[2] est EXACTEMENT *(stocks + 2)</pre>
<p>Dans la plupart des contextes, le nom du tableau se <strong>convertit automatiquement</strong> en un pointeur vers son premier élément — ce phénomène s'appelle le <em>decay</em> (« dégradation ») en anglais. C'est pourquoi <code>stocks[i]</code> est <strong>équivalent</strong> à <code>*(stocks + i)</code> : les crochets ne sont qu'une écriture agréable de l'<strong>arithmétique de pointeurs</strong> (additionner un nombre à un pointeur pour se déplacer).</p>

<h3>3. +1 avance d'un élément, pas d'un octet</h3>
<pre class="pseudo">double prix[3] = {44.90, 12.50, 39.0};   // tableau de 3 double
double* q = prix;                        // q pointe sur prix[0] (le premier)
q++;                                     // q++ avance q d'UN élément (= sizeof(double) octets, souvent 8), pas d'un seul octet
std::cout &lt;&lt; *q;                         // affiche 12.50 : q pointe maintenant sur prix[1]</pre>
<p>Quand on ajoute 1 à un pointeur, il n'avance pas d'un octet mais d'<strong>un élément entier</strong>. C'est le <strong>type</strong> du pointeur qui fixe ce « pas » : pour un <code>double*</code>, <code>+1</code> saute <code>sizeof(double)</code> octets (l'opérateur <code>sizeof</code> donne la taille d'un type en octets). Ainsi le pointeur tombe toujours pile sur l'élément suivant.</p>

<h3>4. Aucune vérification des bornes</h3>
<div class="warn">Comme en C, écrire <code>stocks[10]</code> sur un tableau de 4 est un <strong>débordement</strong> (accès hors des limites) : le C++ ne vérifie <strong>rien</strong>. Il lit ou écrit dans la mémoire voisine — c'est un <strong>comportement indéfini</strong> (le programme peut sembler marcher, donner un résultat faux, ou planter). Rester dans l'intervalle <code>0..n-1</code> est <strong>ta</strong> responsabilité. (En C++ moderne, <code>std::vector::at</code> vérifie les bornes pour toi.)</div>

<h3>5. Passer un tableau à une fonction</h3>
<pre class="pseudo">double moyenne(const double* t, int n) {   // t = pointeur vers le tableau ; n = sa taille (le tableau a « oublié » la sienne)
    double s = 0;                          // s = accumulateur de la somme, démarre à 0
    for (int i = 0; i &lt; n; i++)            // parcourt les indices 0..n-1 (i < n, jamais i <= n)
        s += t[i];                         // ajoute chaque élément t[i] à la somme (s = s + t[i])
    return s / n;                          // renvoie la somme divisée par le nombre d'éléments = la moyenne
}</pre>
<div class="tip">Passé à une fonction, un tableau devient un simple <strong>pointeur qui a perdu sa taille</strong> : on transmet donc toujours <code>n</code> en paramètre séparé. <code>const</code> devant <code>double*</code> promet que la fonction ne modifiera pas les éléments. Ce sont exactement les règles du C — que <code>std::vector</code> et <code>std::array</code> corrigent dans la version moderne.</div>
<h3>Aller plus loin — pré-incrément (++i) et post-incrément (i++)</h3>
<p>Les deux écritures ajoutent 1 à la variable ; la différence n'apparaît que lorsqu'on <strong>lit la valeur au moment même</strong> de l'incrémentation. La formule à retenir : <code>i++</code> « donne sa valeur, PUIS grandit » ; <code>++i</code> « grandit, PUIS donne sa valeur ».</p>
<pre class="pseudo">int a = 5;        // a vaut 5
int b = a++;      // POST-increment : b prend l'ANCIENNE valeur -> b = 5, et ENSUITE a passe a 6
int c = 5;        // c vaut 5
int d = ++c;      // PRE-increment : c passe d'abord a 6, PUIS d prend la NOUVELLE valeur -> d = 6</pre>
<p>Dans une boucle <code>for (i = 0; i &lt; 5; i++)</code>, on ne lit pas le résultat de <code>i++</code> : on veut seulement « ajouter 1 ». C'est pourquoi <code>i++</code> et <code>++i</code> y donnent exactement la même boucle et sont interchangeables.</p>`,
  exercises: [
    { type: "qcm", q: "Le premier indice d'un tableau est…", opts: ["1", "0", "-1", "selon la déclaration"], a: 1, exp: "Indices 0 à n-1." },
    { type: "qcm", q: "Le nom d'un tableau se convertit en…", opts: ["sa taille", "un pointeur vers son premier élément", "sa dernière case", "nullptr"], a: 1, exp: "Array-to-pointer decay." },
    { type: "qcm", q: "<code>stocks[i]</code> équivaut à…", opts: ["*(stocks + i)", "stocks + i", "&stocks[i]", "*stocks + i"], a: 0, exp: "Arithmétique de pointeurs." },
    { type: "qcm", q: "<code>q + 1</code> (double* q) avance de…", opts: ["1 octet", "sizeof(double) octets = 1 élément", "8 toujours", "0"], a: 1, exp: "Le type détermine le pas." },
    { type: "qcm", q: "Le C++ vérifie-t-il les bornes de stocks[i] ?", opts: ["oui", "non : débordement possible (comportement indéfini)", "parfois", "seulement les double"], a: 1, exp: "À toi d'y veiller." },
    { type: "qcm", q: "Passé à une fonction, un tableau…", opts: ["garde sa taille", "devient un pointeur qui a perdu sa taille", "est copié", "est trié"], a: 1, exp: "On passe n à part." },
    { type: "qcm", q: "Comment obtenir la taille d'un tableau local ?", opts: ["t.size()", "sizeof(t)/sizeof(t[0])", "strlen(t)", "count(t)"], a: 1, exp: "Marche là où il est déclaré." },
    { type: "qcm", q: "Les éléments d'un tableau sont…", opts: ["dispersés", "contigus en mémoire", "des pointeurs", "triés"], a: 1, exp: "Bloc contigu : accès rapide." },
    { type: "qcm", q: "<code>int* p = stocks;</code> fait pointer p vers…", opts: ["la fin", "stocks[0]", "la taille", "nullptr"], a: 1, exp: "Premier élément." },
    { type: "qcm", q: "Accéder à stocks[4] dans un tableau de 4 :", opts: ["renvoie 0", "débordement (hors bornes)", "renvoie le dernier", "erreur détectée"], a: 1, exp: "Comportement indéfini." },
    { type: "vf", q: "En C++ moderne, std::vector::at vérifie les bornes.", a: true, exp: "Contrairement au tableau brut." },
    { type: "qcm", q: "Pourquoi parcourir avec i < n et non i <= n ?", opts: ["style", "pour ne pas déborder (dernier indice n-1)", "vitesse", "aucune"], a: 1, exp: "i <= n lirait t[n]." },
    { type: "qcm", q: "Après <code>q++</code> (q = prix), q pointe vers…", opts: ["prix[0]", "prix[1]", "la fin", "nullptr"], a: 1, exp: "Élément suivant." },
    { type: "qcm", q: "Une fonction manipulant un tableau reçoit typiquement…", opts: ["le tableau seul", "le pointeur ET la taille n", "sa moyenne", "rien"], a: 1, exp: "Convention du C." },
    { type: "qcm", q: "const double* t en paramètre signifie…", opts: ["tableau modifiable", "la fonction ne modifiera pas les éléments", "un seul double", "un vector"], a: 1, exp: "Lecture seule." }
  ],
  final: {
    title: "Exercice final — Somme d'un tableau",
    intro: `<p>On somme un tableau via une fonction. Analyse :</p>
<pre class="pseudo">int somme(int* t) {                        // BUG : t est un pointeur, il ne connaît pas la taille du tableau
    int s = 0;                             // accumulateur de la somme
    int n = sizeof(t) / sizeof(t[0]);      // FAUX : sizeof(t) = taille d'un pointeur (≈ 8), pas celle du tableau
    for (int i = 0; i &lt;= n; i++) s += t[i]; // BUG : i <= n déborde (lit t[n], hors bornes)
    return s;                              // renvoie une somme fausse
}</pre>`,
    questions: [
      { type: "qcm", q: "Bug n°1 — <code>sizeof(t)</code> dans la fonction :", opts: ["correct", "t est un pointeur : sizeof(t) ≈ 8, pas la taille du tableau", "donne 4", "rien"], a: 1, exp: "Le tableau a perdu sa taille." },
      { type: "qcm", q: "Correction de la signature :", opts: ["int somme(int* t)", "int somme(const int* t, int n)", "int somme(int t[])", "int somme()"], a: 1, exp: "Passer n en paramètre." },
      { type: "qcm", q: "Bug n°2 — <code>i <= n</code> :", opts: ["correct", "débordement : i < n", "il faut i <= n-1 avec ++", "rien"], a: 1, exp: "Indices 0..n-1." },
      { type: "qcm", q: "Où calculer la taille correctement ?", opts: ["dans la fonction", "dans main, où le tableau est déclaré", "nulle part", "avec strlen"], a: 1, exp: "sizeof marche là." },
      { type: "qcm", q: "Un mot-clé pour marquer la lecture seule :", opts: ["static", "const (const int* t)", "volatile", "extern"], a: 1, exp: "Protège les éléments." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                     // pour std::cout
                                        // ligne vide pour aérer
int somme(const int* t, int n) {        // taille n passée à part ; const = la fonction ne modifie pas les éléments
    int s = 0;                          // accumulateur, démarre à 0
    for (int i = 0; i &lt; n; i++)         // i < n : on reste dans les bornes 0..n-1
        s += t[i];                      // ajoute l'élément t[i] à la somme
    return s;                           // renvoie la somme totale
}                                       // fin de somme
int main() {                            // point d'entrée
    int stocks[4] = {3, 8, 5, 2};       // tableau de 4 entiers
    int n = sizeof(stocks) / sizeof(stocks[0]);   // 4 : ici stocks est un vrai tableau, sizeof marche (taille totale / taille d'un élément)
    std::cout &lt;&lt; somme(stocks, n) &lt;&lt; "\\n";        // affiche 18 (3+8+5+2)
    return 0;                           // 0 = programme terminé sans erreur
}                                       // fin de main</pre>
<p>Dans une fonction, un tableau est un pointeur sans taille : passe toujours <code>n</code>, et reste dans les bornes. Demain : les chaînes, du <code>char[]</code> à <code>std::string</code>.</p>`
  }
};
