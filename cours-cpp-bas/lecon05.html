  "subtitle": "Le tableau C, sa relation intime avec les pointeurs, et l'absence de vérification des bornes.",
  "theory": "\n<h3>1. Le tableau C</h3>\n<p>Un <strong>tableau</strong> est une <strong>suite de cases mémoire</strong> de même type, rangées <strong>côte à côte</strong> (on dit « contiguës »). Au lieu de créer 4 variables séparées, on crée une seule variable qui en contient 4, numérotées. Chaque case s'appelle un <strong>élément</strong>, et son numéro s'appelle un <strong>indice</strong> (ou <em>index</em>). Point crucial : les indices <strong>commencent à 0</strong>, donc un tableau de 4 cases a les indices 0, 1, 2, 3 (jamais 4).</p>\n<pre class=\"pseudo\">int stocks[4] = {3, 0, 5, 2};   // crée un tableau de 4 int ; [4] = taille fixe ; { } = valeurs initiales\nstd::cout &lt;&lt; stocks[0];         // affiche 3 : les crochets [0] lisent l'élément d'indice 0 (le premier)\nstocks[1] = 7;                  // range 7 dans l'élément d'indice 1 (le deuxième) : {3, 7, 5, 2}</pre>\n<p><code>int stocks[4]</code> déclare le tableau : <code>int</code> est le type des éléments, <code>stocks</code> le nom, <code>[4]</code> le nombre <strong>fixe</strong> de cases. Les crochets <code>[i]</code> servent à <strong>accéder</strong> à l'élément d'indice <code>i</code>, en lecture (<code>stocks[0]</code>) comme en écriture (<code>stocks[1] = 7</code>).</p>\n\n<h3>2. Le nom du tableau est un pointeur</h3>\n<pre class=\"pseudo\">int* p = stocks;                          // le nom \"stocks\" se transforme en pointeur vers stocks[0] (on dit qu'il « décay »)\nstd::cout &lt;&lt; *p;                          // affiche 3 : *p = valeur pointée = stocks[0]\nstd::cout &lt;&lt; *(p + 1);                    // affiche 0 : p + 1 pointe l'élément SUIVANT, * en lit la valeur\nstd::cout &lt;&lt; (stocks[2] == *(stocks + 2)); // affiche 1 (vrai) : stocks[2] est EXACTEMENT *(stocks + 2)</pre>\n<p>Dans la plupart des contextes, le nom du tableau se <strong>convertit automatiquement</strong> en un pointeur vers son premier élément — ce phénomène s'appelle le <em>decay</em> (« dégradation ») en anglais. C'est pourquoi <code>stocks[i]</code> est <strong>équivalent</strong> à <code>*(stocks + i)</code> : les crochets ne sont qu'une écriture agréable de l'<strong>arithmétique de pointeurs</strong> (additionner un nombre à un pointeur pour se déplacer).</p>\n\n<h3>3. +1 avance d'un élément, pas d'un octet</h3>\n<pre class=\"pseudo\">double prix[3] = {44.90, 12.50, 39.0};   // tableau de 3 double\ndouble* q = prix;                        // q pointe sur prix[0] (le premier)\nq++;                                     // q++ avance q d'UN élément (= sizeof(double) octets, souvent 8), pas d'un seul octet\nstd::cout &lt;&lt; *q;                         // affiche 12.50 : q pointe maintenant sur prix[1]</pre>\n<p>Quand on ajoute 1 à un pointeur, il n'avance pas d'un octet mais d'<strong>un élément entier</strong>. C'est le <strong>type</strong> du pointeur qui fixe ce « pas » : pour un <code>double*</code>, <code>+1</code> saute <code>sizeof(double)</code> octets (l'opérateur <code>sizeof</code> donne la taille d'un type en octets). Ainsi le pointeur tombe toujours pile sur l'élément suivant.</p>\n\n<h3>4. Aucune vérification des bornes</h3>\n<div class=\"warn\">Comme en C, écrire <code>stocks[10]</code> sur un tableau de 4 est un <strong>débordement</strong> (accès hors des limites) : le C++ ne vérifie <strong>rien</strong>. Il lit ou écrit dans la mémoire voisine — c'est un <strong>comportement indéfini</strong> (le programme peut sembler marcher, donner un résultat faux, ou planter). Rester dans l'intervalle <code>0..n-1</code> est <strong>ta</strong> responsabilité. (En C++ moderne, <code>std::vector::at</code> vérifie les bornes pour toi.)</div>\n\n<h3>5. Passer un tableau à une fonction</h3>\n<pre class=\"pseudo\">double moyenne(const double* t, int n) {   // t = pointeur vers le tableau ; n = sa taille (le tableau a « oublié » la sienne)\n    double s = 0;                          // s = accumulateur de la somme, démarre à 0\n    for (int i = 0; i &lt; n; i++)            // parcourt les indices 0..n-1 (i < n, jamais i <= n)\n        s += t[i];                         // ajoute chaque élément t[i] à la somme (s = s + t[i])\n    return s / n;                          // renvoie la somme divisée par le nombre d'éléments = la moyenne\n}</pre>\n<div class=\"tip\">Passé à une fonction, un tableau devient un simple <strong>pointeur qui a perdu sa taille</strong> : on transmet donc toujours <code>n</code> en paramètre séparé. <code>const</code> devant <code>double*</code> promet que la fonction ne modifiera pas les éléments. Ce sont exactement les règles du C — que <code>std::vector</code> et <code>std::array</code> corrigent dans la version moderne.</div>\n<h3>Aller plus loin — pré-incrément (++i) et post-incrément (i++)</h3>\n<p>Les deux écritures ajoutent 1 à la variable ; la différence n'apparaît que lorsqu'on <strong>lit la valeur au moment même</strong> de l'incrémentation. La formule à retenir : <code>i++</code> « donne sa valeur, PUIS grandit » ; <code>++i</code> « grandit, PUIS donne sa valeur ».</p>\n<pre class=\"pseudo\">int a = 5;        // a vaut 5\nint b = a++;      // POST-increment : b prend l'ANCIENNE valeur -> b = 5, et ENSUITE a passe a 6\nint c = 5;        // c vaut 5\nint d = ++c;      // PRE-increment : c passe d'abord a 6, PUIS d prend la NOUVELLE valeur -> d = 6</pre>\n<p>Dans une boucle <code>for (i = 0; i &lt; 5; i++)</code>, on ne lit pas le résultat de <code>i++</code> : on veut seulement « ajouter 1 ». C'est pourquoi <code>i++</code> et <code>++i</code> y donnent exactement la même boucle et sont interchangeables.</p>",
