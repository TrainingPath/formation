var DAY = {
  num: 16,
  title: "Fichiers : fstream et binaire",
  subtitle: "Écrire et lire des fichiers texte, et un aperçu de l'écriture binaire brute.",
  theory: `
<h3>1. Écrire (ofstream)</h3>
<p>Un <strong>fichier</strong> est un ensemble de données stockées sur le disque, qui <strong>survit</strong> à la fin du programme (contrairement à la mémoire, effacée à la fermeture). Pour dialoguer avec un fichier, le C++ utilise un <strong>flux</strong> (en anglais <em>stream</em>) : un « tuyau » par lequel les données circulent, exactement comme <code>std::cout</code> (écran) et <code>std::cin</code> (clavier). Un <code>std::ofstream</code> est un flux de <strong>sortie vers un fichier</strong> (<em>output file stream</em> : pour écrire).</p>
<pre class="pseudo">#include &lt;fstream&gt;                                   // en-tête des flux de fichiers (ofstream, ifstream)
std::ofstream f("catalogue.txt");                    // ouvre (ou crée) le fichier catalogue.txt en ÉCRITURE ; f est le flux
if (!f) { std::cerr &lt;&lt; "Ouverture impossible\\n"; return 1; }   // si l'ouverture a échoué (!f est vrai), afficher une erreur et quitter
f &lt;&lt; "Catan;44.90\\n";                                // on écrit avec le MÊME opérateur << que std::cout
// à la fin de sa portée, f se ferme AUTOMATIQUEMENT (RAII) : pas de fclose à écrire</pre>
<p>Un <code>std::ofstream</code> écrit avec l'opérateur <code>&lt;&lt;</code> (déjà connu). On teste si l'ouverture a réussi avec <code>if (!f)</code> (le flux se comporte comme un booléen : faux s'il y a un problème). <code>std::cerr</code> est le flux des <strong>messages d'erreur</strong> (comme <code>cout</code>, mais dédié aux erreurs). Grâce au RAII (leçon 11), le fichier se ferme tout seul — pas de <code>fclose</code> à la main comme en C.</p>

<h3>2. Lire (ifstream)</h3>
<pre class="pseudo">std::ifstream f("catalogue.txt");     // ouvre le fichier en LECTURE (input file stream)
std::string ligne;                    // variable qui recevra chaque ligne lue
while (std::getline(f, ligne))        // getline lit UNE ligne dans "ligne" ; la boucle s'arrête à la fin du fichier (getline devient faux)
    std::cout &lt;&lt; ligne &lt;&lt; "\\n";        // affiche la ligne lue, puis un saut de ligne</pre>
<p>Un <code>std::ifstream</code> (<em>input file stream</em>) lit un fichier. <code>std::getline(f, ligne)</code> lit une <strong>ligne entière</strong> (jusqu'au saut de ligne) et la range dans <code>ligne</code> ; utilisée comme condition de <code>while</code>, elle renvoie « faux » quand il n'y a plus rien à lire, ce qui arrête proprement la boucle à la fin du fichier.</p>

<h3>3. Découper une ligne (istringstream)</h3>
<pre class="pseudo">#include &lt;sstream&gt;                            // en-tête des flux « sur une chaîne » (stringstream)
std::istringstream flux("Catan;44.90");      // istringstream traite une CHAÎNE comme un flux qu'on peut lire morceau par morceau
std::string nom, prixTxt;                     // deux morceaux à extraire
std::getline(flux, nom, ';');                 // lit jusqu'au séparateur ';' → nom = "Catan"
std::getline(flux, prixTxt, ';');             // lit le morceau suivant → prixTxt = "44.90" (encore du TEXTE)
double prix = std::stod(prixTxt);             // std::stod (string to double) convertit le texte "44.90" en vrai nombre 44.90</pre>
<p>Un fichier « CSV » range plusieurs valeurs par ligne, séparées par un caractère (ici <code>;</code>). Pour découper une telle ligne, on la transforme en <code>std::istringstream</code> (un flux basé sur une chaîne), puis on extrait chaque morceau avec <code>getline</code> et son troisième paramètre : le <strong>séparateur</strong>. Les morceaux sont du texte ; <code>std::stod</code> convertit un texte en <code>double</code>.</p>

<h3>4. L'écriture binaire brute</h3>
<pre class="pseudo">std::ofstream f("data.bin", std::ios::binary);                         // ouvre en mode BINAIRE (std::ios::binary), pas texte
int stock = 3;                                                         // la valeur à écrire
f.write(reinterpret_cast&lt;const char*&gt;(&amp;stock), sizeof(stock));        // écrit les OCTETS BRUTS de stock : write(adresse en octets, nombre d'octets)</pre>
<div class="warn">Le mode <code>std::ios::binary</code> écrit les <strong>octets bruts</strong> de la mémoire (via <code>write</code>/<code>read</code>). <code>reinterpret_cast&lt;const char*&gt;(&amp;stock)</code> réinterprète l'adresse de <code>stock</code> comme une suite d'octets, et <code>sizeof(stock)</code> dit combien il y en a. C'est compact et rapide, mais <strong>non portable</strong> : le résultat dépend de la machine (taille des types, ordre des octets). À réserver à des cas précis.</div>

<h3>5. Le schéma général</h3>
<pre class="pseudo">ouvrir (ofstream/ifstream) → vérifier (if (!f)) → lire/écrire (&lt;&lt; ou getline) → fermeture AUTOMATIQUE (RAII)</pre>
<div class="tip">Les flux C++ (<code>&lt;&lt;</code>, <code>&gt;&gt;</code>, <code>getline</code>) reprennent tout ce que tu connais de <code>cout</code>/<code>cin</code>, appliqué aux fichiers, avec la fermeture automatique en prime. Le texte (CSV) est le plus courant ; le binaire, plus délicat, sert aux formats compacts.</div>`,
  exercises: [
    { type: "qcm", q: "Quel type écrit dans un fichier ?", opts: ["std::ifstream", "std::ofstream", "FILE*", "std::ostream seul"], a: 1, exp: "ofstream." },
    { type: "qcm", q: "Quel type lit un fichier ?", opts: ["std::ofstream", "std::ifstream", "FILE*", "std::istream seul"], a: 1, exp: "ifstream." },
    { type: "qcm", q: "Comment écrit-on dans un ofstream ?", opts: ["fprintf", "avec << (comme cout)", "write() seul", "put()"], a: 1, exp: "Même opérateur que cout." },
    { type: "qcm", q: "Comment vérifier l'ouverture ?", opts: ["f.open()", "if (!f) { ... }", "f == NULL", "f.error"], a: 1, exp: "Le flux se teste comme booléen." },
    { type: "qcm", q: "Faut-il fermer les flux à la main ?", opts: ["oui", "non : RAII (fermeture automatique)", "toujours", "jamais possible"], a: 1, exp: "Confort du C++." },
    { type: "qcm", q: "std::getline(f, ligne) lit…", opts: ["un mot", "une ligne entière (jusqu'au \\n)", "un caractère", "tout le fichier"], a: 1, exp: "Ligne par ligne." },
    { type: "qcm", q: "std::istringstream sert à…", opts: ["ouvrir un fichier", "traiter une chaîne comme un flux (découper)", "trier", "afficher"], a: 1, exp: "Parser une ligne CSV." },
    { type: "qcm", q: "Le mode std::ios::binary écrit…", opts: ["du texte", "des octets bruts", "du JSON", "des lignes"], a: 1, exp: "Format compact." },
    { type: "qcm", q: "L'écriture binaire est…", opts: ["portable", "non portable (dépend de la représentation mémoire)", "toujours préférable", "impossible"], a: 1, exp: "Attention à la portabilité." },
    { type: "qcm", q: "Quel en-tête pour les flux de fichiers ?", opts: ["<iostream>", "<fstream>", "<file>", "<stdio.h>"], a: 1, exp: "#include <fstream>." },
    { type: "vf", q: "Les flux de fichiers C++ se ferment automatiquement (RAII).", a: true, exp: "Pas de fclose." },
    { type: "qcm", q: "std::stod convertit…", opts: ["double → string", "string → double", "int → string", "un fichier"], a: 1, exp: "string to double." },
    { type: "qcm", q: "f.write(...) avec reinterpret_cast écrit…", opts: ["du texte formaté", "les octets bruts d'une variable", "une ligne", "rien"], a: 1, exp: "Binaire brut." },
    { type: "qcm", q: "while (std::getline(f, ligne)) s'arrête…", opts: ["jamais", "à la fin du fichier", "au 1er espace", "à la 10e ligne"], a: 1, exp: "Le flux devient faux." },
    { type: "qcm", q: "Le format le plus courant/simple est…", opts: ["le binaire", "le texte (CSV)", "aucun", "le XML seul"], a: 1, exp: "Lisible et portable." }
  ],
  final: {
    title: "Exercice final — Sauver et relire",
    intro: `<p>Analyse :</p>
<pre class="pseudo">std::ifstream f("jeu.txt");        // ERREUR : ifstream = LECTURE, on ne peut pas y écrire
f &lt;&lt; "Catan;44.90\\n";             // on tente d'écrire dans un flux de lecture → ne marche pas
std::ofstream g("jeu.txt");        // ERREUR : ofstream = ÉCRITURE, on ne peut pas y lire
std::string ligne;                 // variable pour la ligne
std::getline(g, ligne);            // on tente de lire depuis un flux d'écriture → ne marche pas</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — écrire dans un <code>ifstream</code> :", opts: ["correct", "ifstream = lecture : pour écrire, un ofstream", "il faut close", "rien"], a: 1, exp: "Mauvais flux." },
      { type: "qcm", q: "Erreur n°2 — lire dans un <code>ofstream</code> :", opts: ["correct", "ofstream = écriture : pour lire, un ifstream", "il faut binary", "rien"], a: 1, exp: "Inversé." },
      { type: "qcm", q: "Que manque-t-il après chaque ouverture ?", opts: ["rien", "un test if (!f)", "un close", "un printf"], a: 1, exp: "Vérifier l'ouverture." },
      { type: "qcm", q: "Faut-il fermer à la main ?", opts: ["oui", "non : RAII", "toujours", "jamais possible"], a: 1, exp: "Automatique." },
      { type: "qcm", q: "Ordre correct :", opts: ["lire puis écrire", "ofstream (écrire) puis ifstream (relire)", "deux ifstream", "un seul flux"], a: 1, exp: "Écrire, puis relire." }
    ],
    solution: `<pre class="pseudo">#include &lt;fstream&gt;                     // pour ofstream / ifstream
#include &lt;iostream&gt;                    // pour std::cout
#include &lt;string&gt;                      // pour std::string
                                       // ligne vide pour aérer
int main() {                           // point d'entrée
    { std::ofstream f("jeu.txt");      // bloc { } : ÉCRITURE, avec un ofstream
      if (!f) return 1;                // vérifie l'ouverture
      f &lt;&lt; "Catan;44.90\\n"; }          // écrit une ligne ; à l'accolade, f se ferme (RAII)
    { std::ifstream g("jeu.txt");      // nouveau bloc : LECTURE, avec un ifstream
      if (!g) return 1;                // vérifie l'ouverture
      std::string ligne;               // variable pour la ligne lue
      if (std::getline(g, ligne))      // lit la première ligne
          std::cout &lt;&lt; ligne &lt;&lt; "\\n"; } // l'affiche ; à l'accolade, g se ferme (RAII)
    return 0;                          // 0 = programme terminé sans erreur
}                                      // fin de main</pre>
<p>Le bon flux pour chaque sens, un test après ouverture, et la fermeture automatique. Demain : traquer les fuites mémoire avec les outils.</p>`
  }
};
