<script>
var DAY = {
  num: 6,
  title: "Chaînes : char[], char* et std::string",
  subtitle: "La chaîne « à la C » et ses pièges, puis std::string qui les résout.",
  theory: `
<h3>1. La chaîne C : un tableau de char + '\\0'</h3>
<pre class="pseudo">#include &lt;cstring&gt;
char nom[] = "Catan";         // 6 cases : 'C','a','t','a','n','\\0'
std::cout &lt;&lt; strlen(nom);     // 5 (sans le '\\0')
strcmp(nom, "Catan");         // 0 si égales
strcpy(nom, "Uno");           // copie (attention à la taille !)</pre>
<p>En C, une chaîne est un tableau de <code>char</code> terminé par <code>'\\0'</code>. Les fonctions de <code>&lt;cstring&gt;</code> (<code>strlen</code>, <code>strcmp</code>, <code>strcpy</code>) la manipulent.</p>

<h3>2. Les pièges du char[]</h3>
<div class="warn">On ne compare PAS deux <code>char*</code> avec <code>==</code> (ça compare des adresses). <code>strcpy</code> sans vérifier la taille cible provoque un <strong>débordement</strong>. Oublier le <code>'\\0'</code> casse tout. Ce sont les failles historiques du C.</div>

<h3>3. std::string : la solution</h3>
<pre class="pseudo">#include &lt;string&gt;
std::string nom = "Catan";
nom == "Catan";               // compare le CONTENU
std::string t = nom + " (dispo)";  // concatène
nom.size();                   // longueur
// gère sa mémoire, pas de '\\0' à gérer, pas de débordement</pre>

<h3>4. Convertir entre les deux</h3>
<pre class="pseudo">std::string s = "Catan";
const char* c = s.c_str();    // vue « à la C » (pour une API C)
std::string s2 = c;           // char* → std::string</pre>
<p><code>.c_str()</code> donne un <code>const char*</code> compatible avec les fonctions C (utile pour appeler une API en C).</p>

<h3>5. Quand utiliser quoi ?</h3>
<div class="tip">Retiens : le <code>char[]</code>/<code>char*</code> existe pour comprendre le C et dialoguer avec des API C ; mais pour <strong>tout le reste</strong>, utilise <code>std::string</code> — elle est sûre, expressive et gère la mémoire. Voir les deux, c'est mesurer l'apport du C++.</div>`,
  exercises: [
    { type: "qcm", q: "Une chaîne C est…", opts: ["un std::string", "un tableau de char terminé par '\\0'", "un int", "un pointeur nul"], a: 1, exp: "char[] + '\\0'." },
    { type: "qcm", q: "Comment obtenir la longueur d'un char[] ?", opts: ["s.size()", "strlen(s)", "sizeof(s)", "count"], a: 1, exp: "strlen, de <cstring>." },
    { type: "qcm", q: "Comment comparer deux char* ?", opts: ["==", "strcmp(a, b) == 0", "a.equals(b)", "compare"], a: 1, exp: "== compare des adresses." },
    { type: "qcm", q: "strcpy sans vérifier la taille cible…", opts: ["est sûr", "peut déborder le tampon", "compare", "trie"], a: 1, exp: "Faille classique du C." },
    { type: "qcm", q: "Comment comparer deux std::string ?", opts: ["strcmp", "avec ==", "s.equals", "impossible"], a: 1, exp: "== compare le contenu." },
    { type: "qcm", q: "std::string gère sa mémoire…", opts: ["à la main", "automatiquement (pas de '\\0', pas de débordement)", "jamais", "avec new"], a: 1, exp: "Sûre et pratique." },
    { type: "qcm", q: "Comment concaténer deux std::string ?", opts: ["strcat", "avec +", "concat()", "&"], a: 1, exp: "a + b." },
    { type: "qcm", q: "À quoi sert .c_str() ?", opts: ["trier", "obtenir un const char* pour une API C", "copier", "compter"], a: 1, exp: "Vue « à la C »." },
    { type: "qcm", q: "Quel en-tête pour strlen/strcmp/strcpy ?", opts: ["<string>", "<cstring>", "<iostream>", "<str>"], a: 1, exp: "#include <cstring>." },
    { type: "qcm", q: "Quel en-tête pour std::string ?", opts: ["<cstring>", "<string>", "<iostream> seul", "<str>"], a: 1, exp: "#include <string>." },
    { type: "vf", q: "Pour tout usage courant, std::string est préférable au char[].", a: true, exp: "Sûre et expressive." },
    { type: "qcm", q: "char nom[] = \"Catan\" occupe combien de cases ?", opts: ["5", "6 (avec '\\0')", "4", "10"], a: 1, exp: "Le '\\0' compte." },
    { type: "qcm", q: "s.size() sur std::string donne…", opts: ["la capacité", "le nombre de caractères", "l'adresse", "0"], a: 1, exp: "Longueur du contenu." },
    { type: "qcm", q: "Le char[] est utile surtout pour…", opts: ["tout", "comprendre le C et dialoguer avec des API C", "trier", "les exceptions"], a: 1, exp: "Sinon std::string." },
    { type: "qcm", q: "Oublier le '\\0' d'une chaîne C…", opts: ["sans effet", "casse strlen/l'affichage (comportement indéfini)", "trie", "compile"], a: 1, exp: "Le marqueur de fin est vital." }
  ],
  final: {
    title: "Exercice final — Du char[] à std::string",
    intro: `<p>Du code style C. Analyse :</p>
<pre class="pseudo">char nom[5] = "Catan";
if (nom == "Catan") std::cout &lt;&lt; "ok";
int n = sizeof(nom);</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — <code>char nom[5]</code> :", opts: ["correct", "trop petit : \"Catan\" a besoin de 6 cases (avec '\\0')", "il faut [4]", "rien"], a: 1, exp: "5 lettres + '\\0'." },
      { type: "qcm", q: "Erreur n°2 — <code>nom == \"Catan\"</code> :", opts: ["compare le contenu", "compare des adresses ; avec std::string, == marcherait", "toujours vrai", "erreur"], a: 1, exp: "Utiliser std::string." },
      { type: "qcm", q: "Erreur n°3 — <code>sizeof(nom)</code> pour la longueur :", opts: ["correct", "sizeof donne la taille du tableau, pas la longueur du texte (strlen)", "donne 5", "rien"], a: 1, exp: "strlen ou .size()." },
      { type: "qcm", q: "Version C++ recommandée du nom :", opts: ["char nom[5]", "std::string nom = \"Catan\";", "int nom", "char* nom"], a: 1, exp: "std::string." },
      { type: "qcm", q: "Longueur en C++ :", opts: ["sizeof", "nom.size()", "count", "length()"], a: 1, exp: ".size() (ou .length())." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;
#include &lt;string&gt;

int main() {
    std::string nom = "Catan";        // sûre, gère sa mémoire
    if (nom == "Catan")               // compare le contenu
        std::cout &lt;&lt; "ok\\n";
    std::cout &lt;&lt; nom.size() &lt;&lt; "\\n";   // 5
    return 0;
}
// Pour une API C : nom.c_str() donne un const char*</pre>
<p>Le <code>char[]</code> éclaire le C, mais <code>std::string</code> est le bon choix : <code>==</code>, <code>+</code>, <code>.size()</code>, sans gestion mémoire ni débordement. Demain : les fonctions par pointeur et par référence.</p>`
  }
};
</script>

<script>

  { id: "cppb-l06", title: "Comparer deux façons", level: 2,
    statement: "Écris un programme qui déclare le nom d'un jeu à la fois en char[] (avec strlen et strcmp de <cstring>) et en std::string (avec .size() et ==), et affiche la longueur et le résultat de la comparaison à \"Catan\" dans les deux styles.",
    hints: [
      "#include <cstring> et <string>.",
      "char c[] = \"Catan\"; strlen(c); strcmp(c, \"Catan\") == 0.",
      "std::string s = \"Catan\"; s.size(); s == \"Catan\"."
    ],
    solution: "#include <iostream>\n#include <cstring>\n#include <string>\n\nint main() {\n    // style C\n    char c[] = \"Catan\";\n    std::cout << \"C   : len=\" << strlen(c)\n              << \" egal=\" << (strcmp(c, \"Catan\") == 0) << \"\\n\";\n    // C++ : plus sur\n    std::string s = \"Catan\";\n    std::cout << \"C++ : len=\" << s.size()\n              << \" egal=\" << (s == \"Catan\") << \"\\n\";\n    return 0;\n}",
    note: "Le même besoin (longueur, comparaison) exige strlen/strcmp en C, mais juste .size() et == en C++. std::string évite le '\\0', les débordements et la lourdeur : voir les deux montre concrètement l'apport du C++." }
  ]
};
