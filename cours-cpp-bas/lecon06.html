  "title": "Chaînes : char[], char* et std::string",
  "subtitle": "La chaîne « à la C » et ses pièges, puis std::string qui les résout.",
  "theory": "\n<h3>1. La chaîne C : un tableau de char + '\\0'</h3>\n<pre class=\"pseudo\">#include &lt;cstring&gt;\nchar nom[] = \"Catan\";         // 6 cases : 'C','a','t','a','n','\\0'\nstd::cout &lt;&lt; strlen(nom);     // 5 (sans le '\\0')\nstrcmp(nom, \"Catan\");         // 0 si égales\nstrcpy(nom, \"Uno\");           // copie (attention à la taille !)</pre>\n<p>En C, une chaîne est un tableau de <code>char</code> terminé par <code>'\\0'</code>. Les fonctions de <code>&lt;cstring&gt;</code> (<code>strlen</code>, <code>strcmp</code>, <code>strcpy</code>) la manipulent.</p>\n\n<h3>2. Les pièges du char[]</h3>\n<div class=\"warn\">On ne compare PAS deux <code>char*</code> avec <code>==</code> (ça compare des adresses). <code>strcpy</code> sans vérifier la taille cible provoque un <strong>débordement</strong>. Oublier le <code>'\\0'</code> casse tout. Ce sont les failles historiques du C.</div>\n\n<h3>3. std::string : la solution</h3>\n<pre class=\"pseudo\">#include &lt;string&gt;\nstd::string nom = \"Catan\";\nnom == \"Catan\";               // compare le CONTENU\nstd::string t = nom + \" (dispo)\";  // concatène\nnom.size();                   // longueur\n// gère sa mémoire, pas de '\\0' à gérer, pas de débordement</pre>\n\n<h3>4. Convertir entre les deux</h3>\n<pre class=\"pseudo\">std::string s = \"Catan\";\nconst char* c = s.c_str();    // vue « à la C » (pour une API C)\nstd::string s2 = c;           // char* → std::string</pre>\n<p><code>.c_str()</code> donne un <code>const char*</code> compatible avec les fonctions C (utile pour appeler une API en C).</p>\n\n<h3>5. Quand utiliser quoi ?</h3>\n<div class=\"tip\">Retiens : le <code>char[]</code>/<code>char*</code> existe pour comprendre le C et dialoguer avec des API C ; mais pour <strong>tout le reste</strong>, utilise <code>std::string</code> — elle est sûre, expressive et gère la mémoire. Voir les deux, c'est mesurer l'apport du C++.</div>",

      {

        "opts": [

        "opts": [

    ],
    "solution": "<pre class=\"pseudo\">#include &lt;iostream&gt;\n#include &lt;string&gt;\n\nint main() {\n    std::string nom = \"Catan\";        // sûre, gère sa mémoire\n    if (nom == \"Catan\")               // compare le contenu\n        std::cout &lt;&lt; \"ok\\n\";\n    std::cout &lt;&lt; nom.size() &lt;&lt; \"\\n\";   // 5\n    return 0;\n}\n// Pour une API C : nom.c_str() donne un const char*</pre>\n<p>Le <code>char[]</code> éclaire le C, mais <code>std::string</code> est le bon choix : <code>==</code>, <code>+</code>, <code>.size()</code>, sans gestion mémoire ni débordement. Demain : les fonctions par pointeur et par référence.</p>"
  }
