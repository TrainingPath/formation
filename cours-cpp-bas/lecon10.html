<script>
var DAY = {
  num: 10,
  title: "Tableaux dynamiques : new[] / delete[]",
  subtitle: "Réserver un tableau dont la taille n'est connue qu'à l'exécution — et le libérer correctement.",
  theory: `
<h3>1. Allouer un tableau</h3>
<p>Rappel (leçon 5) : un <strong>tableau</strong> fixe (<code>int t[4]</code>) a une taille <strong>écrite dans le code</strong>, décidée d'avance. Mais souvent on ne connaît le nombre d'éléments qu'<strong>à l'exécution</strong> (l'utilisateur le saisit, un fichier le donne…). Rappel aussi (leçon 9) : le <strong>tas</strong> (<em>heap</em>) est la zone où l'on réserve de la mémoire à la demande. On combine les deux avec <code>new[]</code> : réserver, sur le tas, un tableau dont la taille est calculée pendant que le programme tourne.</p>
<pre class="pseudo">int n;                           // on va décider la taille pendant l'exécution
std::cin &gt;&gt; n;                   // l'utilisateur saisit n au clavier
double* prix = new double[n];    // new double[n] : réserve un tableau de n double sur le TAS ; renvoie un pointeur vers le 1er élément
for (int i = 0; i &lt; n; i++)      // parcourt les indices 0..n-1
    prix[i] = 10.0 + i;         // prix[i] s'utilise EXACTEMENT comme un tableau normal (crochets)</pre>
<p><code>new double[n]</code> réserve un tableau de <code>n</code> éléments et renvoie un <strong>pointeur</strong> vers le premier. La grande différence avec le tableau fixe : la <strong>taille</strong> peut être une variable décidée à l'exécution — impossible avec <code>int t[4]</code>.</p>

<h3>2. Libérer : delete[]</h3>
<pre class="pseudo">delete[] prix;      // delete[] AVEC crochets : libère un TABLEAU alloué par new[] (rend toute la mémoire au système)
prix = nullptr;     // bonne habitude : le pointeur ne désigne plus rien de valide</pre>
<div class="warn">Règle absolue : ce qui vient de <code>new[]</code> se libère avec <code>delete[]</code> (<strong>avec</strong> crochets), jamais <code>delete</code> seul. Mélanger les deux (<code>new[]</code> avec <code>delete</code>, ou <code>new</code> avec <code>delete[]</code>) est un <strong>comportement indéfini</strong>. Un <code>new[]</code> = un <code>delete[]</code>.</div>

<h3>3. Rester dans les bornes</h3>
<pre class="pseudo">for (int i = 0; i &lt; n; i++) prix[i] = ...;   // i &lt; n : correct, on ne touche que les indices 0..n-1
// prix[n] serait un débordement : l'indice n n'existe pas (le dernier valide est n-1), et le C++ ne vérifie RIEN</pre>
<p>Comme pour tout tableau en C++, il n'y a <strong>aucune vérification des bornes</strong> : c'est à toi de rester dans l'intervalle <code>0..n-1</code>. Écrire <code>prix[n]</code> sort du tableau (comportement indéfini).</p>

<h3>4. Le cycle de vie complet</h3>
<pre class="pseudo">double* t = new double[n];   // 1. RÉSERVER le tableau sur le tas
if (!t) return 1;            // (garde-fou ; en réalité new lance l'exception std::bad_alloc s'il échoue)
/* ... utiliser t[i] avec i &lt; n ... */   // 2. UTILISER, en restant dans les bornes
delete[] t;                  // 3. LIBÉRER avec delete[] (crochets)
t = nullptr;                 // 4. NEUTRALISER le pointeur</pre>
<p>Ces quatre étapes — réserver, utiliser, libérer, neutraliser — forment le cycle de vie complet d'une allocation dynamique. Une <strong>exception</strong> (comme <code>std::bad_alloc</code>) est un signal d'erreur lancé quand quelque chose échoue (ici, plus assez de mémoire) ; on les étudiera plus tard.</p>

<h3>5. Ce que std::vector fait à ta place</h3>
<pre class="pseudo">// bas niveau :
double* t = new double[n]; ... delete[] t;   // tu gères toi-même l'allocation ET la libération
// moderne :
std::vector&lt;double&gt; t(n);    // un vector de n double : taille dynamique, libéré AUTOMATIQUEMENT, et redimensionnable</pre>
<div class="tip"><code>std::vector</code> encapsule exactement ce <code>new[]</code>/<code>delete[]</code> : il gère la taille, l'agrandissement et la libération pour toi. On code ici la version manuelle pour <strong>comprendre</strong> ce qui se passe dessous — puis on préfère <code>vector</code> dans la vraie vie.</div>`,
  exercises: [
    { type: "qcm", q: "Comment allouer un tableau de n double ?", opts: ["new double(n)", "new double[n]", "malloc(n)", "double[n]"], a: 1, exp: "new avec crochets." },
    { type: "qcm", q: "Comment libérer un tableau alloué par new[] ?", opts: ["delete t", "delete[] t", "free(t)", "clear"], a: 1, exp: "delete[] avec crochets." },
    { type: "qcm", q: "Mélanger new[] et delete (sans crochets)…", opts: ["est correct", "est un comportement indéfini", "libère mieux", "recommandé"], a: 1, exp: "Toujours les mêmes crochets." },
    { type: "qcm", q: "L'avantage de new[] sur un tableau fixe :", opts: ["plus rapide", "la taille peut être décidée à l'exécution", "plus sûr", "aucun"], a: 1, exp: "Taille dynamique." },
    { type: "qcm", q: "prix[n] sur un tableau de n éléments :", opts: ["renvoie 0", "débordement (hors bornes)", "le dernier", "erreur détectée"], a: 1, exp: "Indices 0..n-1." },
    { type: "qcm", q: "Un new[] doit être suivi d'un…", opts: ["delete", "delete[]", "free", "printf"], a: 1, exp: "Correspondance stricte." },
    { type: "qcm", q: "Après delete[] t, bonne habitude :", opts: ["delete[] t encore", "t = nullptr;", "new[] t", "afficher t"], a: 1, exp: "Neutraliser." },
    { type: "qcm", q: "std::vector encapsule…", opts: ["les exceptions", "new[]/delete[] (taille, agrandissement, libération)", "les fichiers", "les templates"], a: 1, exp: "Le tableau dynamique moderne." },
    { type: "qcm", q: "En cas d'échec d'allocation, new lance…", opts: ["nullptr", "std::bad_alloc (exception)", "-1", "rien"], a: 1, exp: "Contrairement à malloc." },
    { type: "qcm", q: "prix[i] avec new double[n] s'utilise…", opts: ["différemment", "comme un tableau normal", "avec un *", "impossible"], a: 1, exp: "Indexation classique." },
    { type: "vf", q: "std::vector<double> t(n) remplace avantageusement new double[n].", a: true, exp: "Il gère tout automatiquement." },
    { type: "qcm", q: "Le cycle correct :", opts: ["libérer → réserver", "réserver → utiliser (bornes) → libérer → neutraliser", "utiliser sans réserver", "delete deux fois"], a: 1, exp: "Ordre logique." },
    { type: "qcm", q: "new double[n] renvoie…", opts: ["un double", "un pointeur vers le premier élément (double*)", "n", "rien"], a: 1, exp: "Pointeur sur le tableau." },
    { type: "qcm", q: "Un tableau dynamique vit sur…", opts: ["la pile", "le tas (heap)", "un fichier", "le CPU"], a: 1, exp: "Persiste jusqu'à delete[]." },
    { type: "qcm", q: "On code la version manuelle pour…", opts: ["l'utiliser toujours", "comprendre ce que std::vector automatise", "éviter la STL", "aller plus vite"], a: 1, exp: "Comprendre sous le capot." }
  ],
  final: {
    title: "Exercice final — Un catalogue de taille choisie",
    intro: `<p>Analyse ce code :</p>
<pre class="pseudo">int n; std::cin &gt;&gt; n;                     // lit la taille voulue (mais sans vérifier qu'elle est valide)
double* prix = new double[n];            // alloue un tableau de n double sur le tas
for (int i = 0; i &lt;= n; i++) prix[i] = i; // BUG : i <= n déborde (prix[n] est hors bornes)
delete prix;                            // BUG : tableau alloué par new[], il faut delete[] (avec crochets)</pre>`,
    questions: [
      { type: "qcm", q: "Bug n°1 — <code>i <= n</code> :", opts: ["correct", "débordement : i < n", "il faut i <= n-1 avec ++", "rien"], a: 1, exp: "prix[n] hors bornes." },
      { type: "qcm", q: "Bug n°2 — <code>delete prix</code> :", opts: ["correct", "tableau alloué par new[] : il faut delete[] prix", "il faut free", "rien"], a: 1, exp: "delete[] pour un tableau." },
      { type: "qcm", q: "Que manque-t-il après la libération ?", opts: ["rien", "prix = nullptr;", "un new", "un printf"], a: 1, exp: "Neutraliser." },
      { type: "qcm", q: "Que valider avant d'allouer ?", opts: ["rien", "que n a bien été lu et n > 0", "la vitesse", "le tri"], a: 1, exp: "Robustesse de la saisie." },
      { type: "qcm", q: "Alternative moderne :", opts: ["garder new[]", "std::vector<double> prix(n);", "malloc", "un tableau fixe"], a: 1, exp: "Gère tout." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                     // pour std::cin et std::cout
                                        // ligne vide pour aérer
int main() {                            // point d'entrée
    int n;                              // la taille voulue
    if (!(std::cin &gt;&gt; n) || n &lt;= 0) return 1;   // valide la saisie : échec de lecture OU n non positif → on quitte
    double* prix = new double[n];       // réserve un tableau de n double (new[])
    for (int i = 0; i &lt; n; i++)         // i < n : on reste dans les bornes 0..n-1
        prix[i] = i;                    // remplit chaque case avec la valeur i
    std::cout &lt;&lt; prix[0] &lt;&lt; "\\n";        // affiche le premier élément (0)
    delete[] prix;                      // libère le tableau avec delete[] (crochets, comme new[])
    prix = nullptr;                     // neutralise le pointeur
    return 0;                           // 0 = programme terminé sans erreur
}                                       // fin de main
// Moderne : std::vector&lt;double&gt; prix(n);  // et c'est tout (libération automatique)</pre>
<p>Bornes respectées, <code>delete[]</code> assorti à <code>new[]</code>, neutralisation. La version <code>std::vector</code> ferait tout cela sans effort. Demain : une classe qui possède sa mémoire (constructeur/destructeur).</p>`
  }
};
