<script>
var DAY = {
  num: 12,
  title: "Le constructeur de copie et la règle de trois",
  subtitle: "Pourquoi copier une classe à pointeur est dangereux, et comment faire une copie profonde.",
  theory: `
<h3>1. Le danger de la copie par défaut</h3>
<p><strong>Copier</strong> un objet, c'est en fabriquer un second identique — par exemple avec <code>Tableau b = a;</code> (b devient une copie de a). Si tu n'écris rien, le C++ fournit une <strong>copie par défaut</strong> gratuite : elle recopie chaque membre <strong>tel quel</strong>. Pour des membres simples (int, double) c'est parfait. Mais pour un <strong>pointeur</strong>, elle recopie l'<em>adresse</em>, pas ce qui est pointé — d'où le danger.</p>
<pre class="pseudo">class Tableau {                  // rappel : classe possédant un tableau alloué (leçon 11)
    double* data_; int n_;       // data_ = pointeur vers le tableau ; n_ = taille
    // ... constructeur (new[]), destructeur (delete[]) ...
};
Tableau a(3);                    // a possède son propre tableau (créé par new[])
Tableau b = a;                   // COPIE PAR DÉFAUT : recopie data_ (l'ADRESSE du tableau, pas le tableau lui-même)
// résultat : a.data_ et b.data_ contiennent la MÊME adresse → ils pointent le MÊME tableau</pre>
<div class="warn">La copie par défaut copie les membres <strong>tels quels</strong> : le pointeur <code>data_</code> est copié, mais pas le tableau qu'il désigne. Résultat : <code>a</code> et <code>b</code> partagent le même tableau. À leur destruction, tous deux exécutent <code>delete[]</code> sur la <strong>même</strong> zone → <strong>double free</strong> (libérer deux fois) et corruption de la mémoire.</div>

<h3>2. Le constructeur de copie (copie profonde)</h3>
<pre class="pseudo">Tableau(const Tableau&amp; o) : data_(new double[o.n_]), n_(o.n_) {   // constructeur de COPIE : o est l'objet source (const& = lu sans copie) ; on alloue un NOUVEAU tableau
    for (int i = 0; i &lt; n_; i++) data_[i] = o.data_[i];          // recopie les DONNÉES une à une (pas l'adresse)
}                                                                // maintenant b a son propre tableau</pre>
<p>Le <strong>constructeur de copie</strong> est un constructeur spécial qui prend en paramètre un autre objet de la même classe (<code>const Tableau&amp; o</code> : une référence constante vers la source). Au lieu de copier l'adresse, il alloue un <strong>nouveau</strong> tableau avec <code>new[]</code> et recopie les valeurs une par une : <code>a</code> et <code>b</code> deviennent totalement <strong>indépendants</strong>. C'est une <strong>copie profonde</strong> (<em>deep copy</em>).</p>

<h3>3. La règle de trois</h3>
<pre class="pseudo">Si une classe gère une ressource (pointeur brut), elle a besoin des TROIS :
  1. le destructeur              ~Tableau()               // libère la ressource
  2. le constructeur de copie    Tableau(const Tableau&amp;)  // copie profonde à la création
  3. l'opérateur d'affectation   operator= (leçon 13)     // copie profonde lors d'un b = a ultérieur</pre>
<div class="warn">C'est la <strong>règle de trois</strong> : ces trois fonctions vont ensemble. Si tu dois écrire l'une d'elles (parce que la version par défaut est dangereuse pour ta ressource), tu dois écrire les <strong>deux autres</strong> aussi.</div>

<h3>4. Copie profonde vs copie superficielle</h3>
<pre class="pseudo">superficielle : copie le pointeur   → deux objets, UN seul tableau partagé → DANGER (double free)
profonde      : copie les données   → deux objets, DEUX tableaux distincts → OK (indépendants)</pre>
<p>La copie <strong>superficielle</strong> (<em>shallow</em>) est celle par défaut : rapide mais dangereuse pour une ressource. La copie <strong>profonde</strong> (<em>deep</em>) duplique réellement les données : c'est celle qu'on veut pour une classe à pointeur.</p>

<h3>5. La STL évite tout ça</h3>
<div class="tip">Un membre <code>std::vector&lt;double&gt;</code> se copie <strong>profondément tout seul</strong> : si tes membres sont des types STL (<code>vector</code>, <code>string</code>, <code>unique_ptr</code>), tu n'as souvent besoin d'<strong>aucun</strong> des trois — c'est la <strong>règle de zéro</strong>. On écrit la règle de trois ici pour comprendre pourquoi la STL est si pratique.</div>`,
  exercises: [
    { type: "qcm", q: "La copie par défaut d'une classe à pointeur copie…", opts: ["les données", "le pointeur (pas les données) : copie superficielle", "rien", "la taille seule"], a: 1, exp: "Deux objets, un seul tableau." },
    { type: "qcm", q: "Le danger : deux objets pointant le même tableau…", opts: ["aucun", "double delete[] à la destruction (double free)", "plus rapide", "trie"], a: 1, exp: "Corruption mémoire." },
    { type: "qcm", q: "Un constructeur de copie a pour paramètre…", opts: ["Tableau o", "const Tableau& o", "Tableau* o", "int o"], a: 1, exp: "Référence const à l'objet source." },
    { type: "qcm", q: "Une copie profonde…", opts: ["copie le pointeur", "alloue un nouveau tableau et copie les données", "ne copie rien", "partage la mémoire"], a: 1, exp: "Objets indépendants." },
    { type: "qcm", q: "La règle de trois concerne…", opts: ["destructeur, copie, affectation", "trois attributs", "trois classes", "trois fichiers"], a: 0, exp: "Ces trois fonctions vont ensemble." },
    { type: "qcm", q: "Si tu écris le destructeur d'une classe à pointeur, tu dois aussi écrire…", opts: ["rien", "le constructeur de copie et l'opérateur=", "un template", "un getter"], a: 1, exp: "Règle de trois." },
    { type: "qcm", q: "Une copie superficielle copie…", opts: ["les données", "le pointeur (partage)", "rien", "un int"], a: 1, exp: "Dangereuse pour une ressource." },
    { type: "qcm", q: "Avec des membres std::vector/string, combien des trois faut-il écrire ?", opts: ["les trois", "souvent aucun (règle de zéro)", "un seul", "deux"], a: 1, exp: "La STL gère la copie." },
    { type: "qcm", q: "Le constructeur de copie s'exécute quand…", opts: ["jamais", "on crée un objet à partir d'un autre (Tableau b = a;)", "au delete", "au new"], a: 1, exp: "Initialisation par copie." },
    { type: "qcm", q: "Copie profonde de data_ :", opts: ["data_ = o.data_", "data_ = new double[o.n_]; puis copier o.data_[i]", "rien", "delete o.data_"], a: 1, exp: "Nouvelle allocation + copie." },
    { type: "vf", q: "Un membre std::vector se copie profondément automatiquement.", a: true, exp: "D'où la règle de zéro." },
    { type: "qcm", q: "Pourquoi const dans const Tableau& o ?", opts: ["obligatoire au hasard", "on lit l'objet source sans le modifier, sans le copier", "pour trier", "aucune raison"], a: 1, exp: "Lecture seule, efficace." },
    { type: "qcm", q: "La règle de trois s'applique surtout aux classes qui…", opts: ["n'ont pas de membres", "gèrent une ressource brute (pointeur, fichier)", "affichent", "sont des int"], a: 1, exp: "Sinon règle de zéro." },
    { type: "qcm", q: "Sans constructeur de copie, <code>Tableau b = a;</code>…", opts: ["copie proprement", "partage le tableau de a (superficielle)", "plante à la compilation", "trie"], a: 1, exp: "Danger de double free." },
    { type: "qcm", q: "On écrit la règle de trois ici pour…", opts: ["l'appliquer toujours", "comprendre pourquoi la STL (règle de zéro) est préférable", "éviter les classes", "aller plus vite"], a: 1, exp: "Comprendre sous le capot." }
  ],
  final: {
    title: "Exercice final — Réparer la copie",
    intro: `<p>Cette classe fuit et corrompt à la copie. Analyse :</p>
<pre class="pseudo">class Tableau {                          // classe possédant un tableau dynamique
    double* data_; int n_;               // pointeur vers le tableau + taille
public:                                  // interface publique
    Tableau(int n) : data_(new double[n]), n_(n) {}   // constructeur : alloue le tableau (new[])
    ~Tableau() { delete[] data_; }       // destructeur : libère (delete[])
    // pas de constructeur de copie       // PROBLÈME : la copie par défaut copiera le POINTEUR
};
Tableau a(3);                            // a possède son tableau
Tableau b = a;                           // ? copie superficielle : b partage le tableau de a</pre>`,
    questions: [
      { type: "qcm", q: "Que fait <code>Tableau b = a;</code> ici ?", opts: ["copie profonde", "copie superficielle : b.data_ == a.data_", "erreur de compilation", "rien"], a: 1, exp: "Copie par défaut du pointeur." },
      { type: "qcm", q: "Que se passe-t-il à la destruction de a et b ?", opts: ["rien", "double delete[] sur le même tableau (double free)", "fuite seule", "tri"], a: 1, exp: "Corruption." },
      { type: "qcm", q: "La correction :", opts: ["supprimer le destructeur", "ajouter un constructeur de copie (copie profonde)", "rendre data_ public", "un template"], a: 1, exp: "Copie profonde." },
      { type: "qcm", q: "Ce constructeur de copie doit…", opts: ["copier le pointeur", "allouer un nouveau tableau et copier les données", "ne rien faire", "partager"], a: 1, exp: "Objets indépendants." },
      { type: "qcm", q: "La règle de trois impose aussi…", opts: ["rien de plus", "l'opérateur= (leçon 13)", "un getter", "un main"], a: 1, exp: "Les trois vont ensemble." }
    ],
    solution: `<pre class="pseudo">class Tableau {                         // classe RAII à copie profonde
    double* data_; int n_;             // pointeur vers le tableau + taille
public:                                // interface publique
    Tableau(int n) : data_(new double[n]), n_(n) {   // constructeur : alloue (new[])
        for (int i = 0; i &lt; n_; i++) data_[i] = 0.0; // initialise à 0
    }
    // constructeur de COPIE : copie profonde
    Tableau(const Tableau&amp; o) : data_(new double[o.n_]), n_(o.n_) {   // alloue un NOUVEAU tableau (o = source, lue en const&)
        for (int i = 0; i &lt; n_; i++) data_[i] = o.data_[i];          // recopie les valeurs une à une
    }
    ~Tableau() { delete[] data_; }     // destructeur : libère (delete[])
    // + operator= (leçon 13) pour compléter la règle de trois
};</pre>
<p>Le constructeur de copie fait une copie profonde : <code>a</code> et <code>b</code> ont chacun leur tableau, plus de double free. Il manque encore l'opérateur d'affectation — demain, pour compléter la règle de trois.</p>`
  }
};
</script>

var ECRITURE = {
  placeholder: "Écris ton code C++ ici…",
  items: [
  { id: "cppb-l12", title: "Copie profonde", level: 3,
    statement: "À une classe Buffer (int* data_, int n_, constructeur new[], destructeur delete[]), ajoute un constructeur de copie qui fait une copie PROFONDE (nouveau tableau, copie des valeurs). Montre dans main que modifier la copie ne change pas l'original.",
    hints: [
      "Buffer(const Buffer& o) : data_(new int[o.n_]), n_(o.n_) { copier o.data_[i] }",
      "Sans lui, b = a partagerait le tableau (double free).",
      "Teste : Buffer b = a; b.set(0, 99); a.get(0) doit rester inchangé."
    ],
    solution: "#include <iostream>          // pour std::cout\n\nclass Buffer {               // classe possedant un tableau d'int\n    int* data_;              // pointeur vers le tableau (tas)\n    int n_;                  // nombre d'elements\npublic:                      // interface publique\n    Buffer(int n) : data_(new int[n]), n_(n) {   // constructeur : alloue (new[])\n        for (int i = 0; i < n_; i++) data_[i] = 0;   // initialise a 0\n    }\n    Buffer(const Buffer& o) : data_(new int[o.n_]), n_(o.n_) {   // constructeur de COPIE : copie PROFONDE (nouveau tableau)\n        for (int i = 0; i < n_; i++) data_[i] = o.data_[i];   // recopie les valeurs une a une\n    }\n    ~Buffer() { delete[] data_; }                // destructeur : libere (delete[])\n    void set(int i, int v) { if (i >= 0 && i < n_) data_[i] = v; }   // ecrit v en i (si dans les bornes)\n    int get(int i) const { return data_[i]; }    // lit l'element i\n};\n\nint main() {                 // point d'entree\n    Buffer a(2);            // a possede son tableau\n    a.set(0, 42);           // a[0] = 42\n    Buffer b = a;           // copie PROFONDE : b a son propre tableau\n    b.set(0, 99);           // on modifie seulement b\n    std::cout << a.get(0) << \" \" << b.get(0) << \"\\n\";  // affiche 42 99 (independants)\n    return 0;                // chacun libere SON tableau : pas de double free\n}",
    note: "Le constructeur de copie alloue un nouveau tableau et copie les valeurs : a et b sont indépendants (42 vs 99), et chacun libère SON tableau (pas de double free). Il reste à écrire operator= pour compléter la règle de trois." }
  ]
};
