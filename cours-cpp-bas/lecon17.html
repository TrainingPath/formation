  title: "Gérer la mémoire : fuites et outils",
  subtitle: "Le catalogue des bugs mémoire du style bas niveau, et comment les traquer.",
  theory: `
<h3>1. Le catalogue des bugs mémoire</h3>
<p>Cette leçon récapitule les erreurs vues séparément. Petit rappel du vocabulaire : <code>new</code>/<code>new[]</code> réservent de la mémoire sur le tas, <code>delete</code>/<code>delete[]</code> la rendent, un <strong>pointeur</strong> contient une adresse, le <strong>tas</strong> est la zone de mémoire réservée à la main. Voici les six fautes classiques.</p>
<pre class="pseudo">1. Fuite : new/new[] sans delete/delete[]                        // la mémoire n'est jamais rendue
2. Use-after-free : utiliser un objet APRÈS l'avoir delete       // le pointeur désigne une zone libérée
3. Double free : delete deux fois le même pointeur               // on rend deux fois la même mémoire
4. Mauvais delete : delete sur du new[] (ou delete[] sur du new) // les crochets doivent correspondre
5. Débordement : accès hors des bornes d'un tableau (t[n])       // on lit/écrit à côté du tableau
6. Pointeur non initialisé : Jeu* p; p-&gt;...  (p pointe n'importe où)  // adresse aléatoire → plantage</pre>
<p>La gestion manuelle (<code>new</code>/<code>delete</code>, pointeurs bruts) ouvre la porte à ces erreurs — souvent <strong>silencieuses</strong> (le programme semble marcher), parfois fatales (le <em>segfault</em>, plantage brutal).</p>

<h3>2. Les avertissements du compilateur</h3>
<pre class="pseudo">g++ -std=c++17 -Wall -Wextra prog.cpp -o prog   // -Wall et -Wextra activent TOUS les avertissements utiles du compilateur</pre>
<p>Première défense, gratuite : les options <code>-Wall</code> et <code>-Wextra</code> demandent au compilateur de <strong>signaler le code douteux</strong> — une variable non initialisée, un <code>=</code> écrit à la place d'un <code>==</code>, une valeur de retour ignorée… Un <strong>avertissement</strong> (<em>warning</em>) n'empêche pas de compiler, mais pointe souvent un vrai bug.</p>

<h3>3. valgrind : le détecteur de fuites</h3>
<pre class="pseudo">g++ -g prog.cpp -o prog                             // -g ajoute les infos de débogage (numéros de ligne dans les rapports)
valgrind --leak-check=full ./prog     // valgrind exécute le programme et surveille la mémoire ; objectif : « definitely lost: 0 bytes »</pre>
<p><code>valgrind</code> est un <strong>outil externe</strong> qui lance ton programme dans un environnement surveillé : il signale précisément les fuites, les accès hors zone et les use-after-free, avec le <strong>numéro de ligne</strong> exact. L'option <code>-g</code> à la compilation rend ces rapports lisibles.</p>

<h3>4. Le sanitizer</h3>
<pre class="pseudo">g++ -g -fsanitize=address,undefined prog.cpp -o prog   // -fsanitize=address,undefined : le compilateur INSTRUMENTE le code pour détecter les fautes
./prog     // à l'exécution, le programme s'arrête NET à la première faute, en indiquant la ligne exacte</pre>
<div class="warn">L'<strong>AddressSanitizer</strong> (activé par <code>-fsanitize=address</code>) transforme un bug mémoire silencieux (qui « marchait par chance ») en <strong>échec franc</strong>, à la ligne près. C'est intégré au compilateur (pas d'outil séparé) et idéal pendant le développement.</div>

<h3>5. La meilleure parade : les types RAII</h3>
<pre class="pseudo">// au lieu de : double* t = new double[n]; ... delete[] t;   // gestion manuelle, risquée
std::vector&lt;double&gt; t(n);              // un vector : AUCUNE fuite possible (il libère tout seul)
// au lieu de : Jeu* j = new Jeu(...); ... delete j;         // gestion manuelle, risquée
auto j = std::make_unique&lt;Jeu&gt;(...);   // un smart pointer : l'objet est libéré AUTOMATIQUEMENT</pre>
<div class="tip">Le meilleur bug mémoire est celui qu'on ne peut pas écrire. En C++ moderne, <code>std::vector</code>, <code>std::string</code> et les smart pointers (RAII, leçon 11) <strong>éliminent par construction</strong> la plupart de ces erreurs. On maîtrise le manuel pour comprendre — et pour les rares cas où il est inévitable.</div>`,
  exercises: [
    { type: "qcm", q: "Une fuite mémoire, c'est…", opts: ["un delete en trop", "new sans delete correspondant", "un pointeur nul", "un débordement"], a: 1, exp: "Mémoire jamais rendue." },
    { type: "qcm", q: "Utiliser après delete s'appelle…", opts: ["fuite", "use-after-free", "double free", "recyclage"], a: 1, exp: "Pointeur invalide." },
    { type: "qcm", q: "delete sur un tableau créé par new[]…", opts: ["est correct", "est un mauvais delete (il faut delete[])", "libère mieux", "recommandé"], a: 1, exp: "Correspondance stricte." },

    { type: "qcm", q: "À quoi sert -g ?", opts: ["accélérer", "ajouter les infos de débogage (lignes)", "lier une lib", "optimiser"], a: 1, exp: "Rapports lisibles." },

    { type: "qcm", q: "std::vector<double> t(n) remplace…", opts: ["une string", "new double[n] ... delete[] t (sans fuite possible)", "une map", "un fichier"], a: 1, exp: "RAII." },
    { type: "qcm", q: "Un double free, c'est…", opts: ["deux new", "delete deux fois sur le même pointeur", "une fuite", "un débordement"], a: 1, exp: "Erreur grave." },
    { type: "vf", q: "En C++ moderne, la plupart de ces bugs deviennent impossibles à écrire.", a: true, exp: "Grâce à la STL et au RAII." },
    { type: "qcm", q: "Un pointeur non initialisé pointe vers…", opts: ["nullptr", "n'importe quelle adresse (danger)", "0", "le tableau"], a: 1, exp: "Initialise-le (à nullptr)." },
    { type: "qcm", q: "valgrind vise l'objectif…", opts: ["vitesse maximale", "definitely lost: 0 (aucune fuite)", "0 warning", "0 test"], a: 1, exp: "Pas de fuite." },
    { type: "qcm", q: "On teste la mémoire…", opts: ["à la fin seulement", "régulièrement pendant le développement", "jamais", "une seule fois"], a: 1, exp: "Tôt et souvent." },
    { type: "qcm", q: "On apprend la gestion manuelle pour…", opts: ["l'utiliser partout", "comprendre les bugs et les rares cas inévitables", "éviter la STL", "aller plus vite"], a: 1, exp: "Puis préférer le RAII." }
  ],
  final: {
    title: "Exercice final — Chasse aux bugs",
    intro: `<p>Analyse ce code :</p>
<pre class="pseudo">double* t = new double[3];              // tableau de 3 double (indices 0..2)
for (int i = 0; i &lt;= 3; i++) t[i] = i;  // BUG : i <= 3 écrit t[3], hors bornes (débordement)
delete t;                              // BUG : tableau new[], il faut delete[]
std::cout &lt;&lt; t[0];                      // BUG : use-after-free, on lit t APRÈS delete</pre>`,
    questions: [
      { type: "qcm", q: "Bug n°1 — <code>i <= 3</code> :", opts: ["correct", "débordement : t a 3 cases (0..2), i < 3", "il faut i <= 2 avec ++", "rien"], a: 1, exp: "t[3] hors bornes." },
      { type: "qcm", q: "Bug n°2 — <code>delete t</code> :", opts: ["correct", "tableau new[] : il faut delete[] t", "il faut free", "rien"], a: 1, exp: "delete[] pour new[]." },
      { type: "qcm", q: "Bug n°3 — <code>t[0]</code> après delete :", opts: ["correct", "use-after-free : mémoire libérée", "trie", "rien"], a: 1, exp: "Utiliser avant delete." },
      { type: "qcm", q: "Quel outil aurait pointé ces erreurs ?", opts: ["make", "valgrind ou -fsanitize=address", "g++ -o", "un éditeur"], a: 1, exp: "Détection à l'exécution." },
      { type: "qcm", q: "La meilleure façon d'éviter tout ça :", opts: ["plus de commentaires", "utiliser std::vector<double>", "un pointeur global", "ignorer les bornes"], a: 1, exp: "RAII : pas de bug possible." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                 // pour std::cout
#include &lt;vector&gt;                   // pour std::vector
                                    // ligne vide pour aérer
int main() {                        // point d'entrée
    // version bas niveau corrigée :
    double* t = new double[3];      // tableau de 3 double
    for (int i = 0; i &lt; 3; i++) t[i] = i;   // i < 3 : on reste dans les bornes 0..2
    std::cout &lt;&lt; t[0] &lt;&lt; "\\n";       // on l'utilise AVANT delete
    delete[] t;                     // delete[] assorti à new[]
    t = nullptr;                    // neutralise le pointeur
                                    // ligne vide pour aérer
    // version moderne (aucun bug possible) :
    std::vector&lt;double&gt; v(3);        // vector de 3 double : géré automatiquement
    for (int i = 0; i &lt; 3; i++) v[i] = i;   // remplissage, toujours dans les bornes
    return 0;                       // 0 = programme terminé sans erreur
}                                   // fin de main
// Tester : g++ -g -fsanitize=address prog.cpp -o prog ; ./prog</pre>
<p>Bornes, <code>delete[]</code> assorti, usage avant libération — et surtout <code>std::vector</code> qui rend ces bugs impossibles. Demain : les pointeurs de fonctions et les foncteurs.</p>`
  }
