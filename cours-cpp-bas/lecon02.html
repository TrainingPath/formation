  "subtitle": "Les types fondamentaux du C, l'affichage et la lecture par flux — la base commune.",
  "theory": "\n<h3>1. Variable et type : les fondations</h3>\n<p>Une <strong>variable</strong> est une <strong>case de mémoire nommée</strong> qui contient une valeur : imagine une petite boîte étiquetée (par exemple <code>age</code>) dans laquelle tu ranges un nombre. Le <strong>type</strong> décrit <em>quelle sorte</em> de valeur la boîte peut contenir (un entier, un nombre à virgule, une lettre…) et donc la taille de la boîte. <strong>Déclarer</strong> une variable, c'est écrire son type puis son nom pour la créer.</p>\n<pre class=\"pseudo\">int    age = 25;        // int = nombre entier ; on crée la variable age et on y range 25\ndouble prix = 44.90;    // double = nombre à virgule (réel) ; prix contient 44.90\nchar   lettre = 'A';    // char = un seul caractère ; guillemets SIMPLES pour un caractère : 'A'\nbool   dispo = true;    // bool = booléen : ne peut valoir que true (vrai) ou false (faux)</pre>\n<p><code>int</code> (<em>integer</em>) stocke un <strong>entier</strong> (sans virgule). <code>double</code> stocke un nombre <strong>à virgule</strong> (dit « réel » ou « flottant »), comme un prix. <code>char</code> (<em>character</em>) stocke <strong>un seul caractère</strong> ; attention, un caractère s'écrit entre guillemets <em>simples</em> (<code>'A'</code>), alors qu'un texte s'écrit entre guillemets <em>doubles</em> (<code>\"Aurelia\"</code>). <code>bool</code> (booléen) ne peut valoir que <code>true</code> ou <code>false</code>. Le signe <code>=</code> ici <strong>affecte</strong> (range) la valeur dans la variable. Ce sont les mêmes types qu'en C (le C++ rend <code>bool</code> natif). Le C++ ajoute <code>std::string</code> (leçon 6), mais on commence par les types de base pour rester proche de la machine.</p>\n\n<h3>2. Afficher : std::cout</h3>\n<pre class=\"pseudo\">std::cout &lt;&lt; \"age = \" &lt;&lt; age &lt;&lt; \", prix = \" &lt;&lt; prix &lt;&lt; \"\\n\";  // enchaîne : texte, valeur de age, texte, valeur de prix, puis saut de ligne</pre>\n<p><code>std::cout</code> désigne l'<strong>écran</strong> (la sortie standard). L'opérateur <code>&lt;&lt;</code> (« envoyer vers ») s'<strong>enchaîne</strong> : on peut coller plusieurs valeurs à la suite, et le C++ <strong>déduit</strong> (devine) le type de chacune tout seul — pas besoin de <code>%d</code> pour un entier ni de <code>%f</code> pour un réel comme avec l'ancien <code>printf</code>. Remarque : <code>\"age = \"</code> (entre guillemets) est le <em>texte littéral</em> affiché tel quel, tandis que <code>age</code> (sans guillemets) affiche le <em>contenu</em> de la variable.</p>\n\n<h3>3. Lire : std::cin</h3>\n<pre class=\"pseudo\">int age;                    // on déclare age SANS valeur : la boîte existe mais est vide\nstd::cout &lt;&lt; \"Ton age ? \";  // affiche une question pour l'utilisateur (sans saut de ligne)\nstd::cin &gt;&gt; age;            // lit ce que l'utilisateur tape au clavier et le range dans age (pas de &amp;, contrairement à scanf)</pre>\n<p><code>std::cin</code> représente le <strong>clavier</strong> (l'entrée standard ; <em>cin</em> = <em>character input</em>). L'opérateur <code>&gt;&gt;</code> (« extraire vers ») lit une valeur saisie et la range dans la variable indiquée à droite.</p>\n<div class=\"warn\">Là où le C exigeait <code>scanf(\"%d\", &amp;age)</code> (avec l'esperluette <code>&amp;</code> qui donne l'<em>adresse</em> de la variable), le C++ écrit simplement <code>std::cin &gt;&gt; age</code> : plus court, sans <code>&amp;</code> ni format. On peut tester la réussite de la lecture : <code>if (std::cin &gt;&gt; age) { ... }</code> — le flux se comporte alors comme un booléen (vrai si la lecture a marché).</div>\n\n<h3>4. Formater les décimales</h3>\n<pre class=\"pseudo\">#include &lt;iomanip&gt;                                          // en-tête qui contient les « manipulateurs » de format (setprecision…)\nstd::cout &lt;&lt; std::fixed &lt;&lt; std::setprecision(2) &lt;&lt; prix;  // std::fixed = notation à virgule fixe ; setprecision(2) = 2 chiffres après la virgule → 44.90</pre>\n<p>Par défaut, <code>std::cout</code> affiche les nombres à virgule de façon parfois imprécise. <code>std::fixed</code> force la <strong>notation décimale classique</strong> (avec une virgule fixe, pas de notation scientifique), et <code>std::setprecision(2)</code> demande <strong>2 chiffres après la virgule</strong>. C'est l'équivalent du <code>%.2f</code> du C : indispensable pour afficher de l'argent proprement. Ces outils viennent de l'en-tête <code>&lt;iomanip&gt;</code> (<em>input/output manipulators</em>).</p>\n\n<h3>5. Constantes</h3>\n<pre class=\"pseudo\">const double TVA = 0.20;    // const = valeur CONSTANTE : interdiction de la modifier ensuite\nint stock = 3;             // variable normale, modifiable ; attention : Stock ≠ stock (sensible à la casse)</pre>\n<p>Le mot-clé <code>const</code> (« constant ») placé devant un type crée une valeur <strong>qu'on s'interdit de modifier</strong> : toute tentative de la changer provoque une erreur de compilation. C'est utile pour les valeurs fixes (un taux de TVA, un maximum…) car ça protège contre les erreurs. Le C++ est <strong>sensible à la casse</strong> : <code>Stock</code> et <code>stock</code> sont deux noms différents.</p>\n<div class=\"tip\">Comme en C : typage statique (le type est fixé à la déclaration), sensibilité à la casse, <code>const</code> pour les valeurs fixes. Le C++ recommande <code>const</code> et <code>constexpr</code> plutôt que <code>#define</code> (leçon 19), car ils sont typés et plus sûrs. On reste ici sur des fondations solides et familières.</div>",

  "final": {
    "title": "Exercice final — Lire et calculer",
    "intro": "<p>On lit un prix et une quantité. Analyse :</p>\n<pre class=\"pseudo\">double prix;              // variable réelle, encore vide, pour le prix\nint qte;                  // variable entière, encore vide, pour la quantité\nscanf(\"%lf\", &prix);      // style C : lit un double (%lf) à l'adresse de prix (&prix) — mélange de styles déconseillé\nstd::cin &gt;&gt; qte;         // style C++ : lit la quantité, sans &amp; ni format\nstd::cout &lt;&lt; prix * qte; // affiche le produit prix × quantité (l'astérisque * = multiplication)</pre>",

    "solution": "<pre class=\"pseudo\">#include &lt;iostream&gt;                     // pour std::cout et std::cin\n#include &lt;iomanip&gt;                      // pour std::fixed et std::setprecision\n                                        // ligne vide pour aérer\nint main() {                            // point d'entrée du programme\n    double prix; int qte;               // on déclare le prix (réel) et la quantité (entier), encore vides\n    std::cout &lt;&lt; \"Prix ? \";             // affiche l'invite pour le prix\n    if (!(std::cin &gt;&gt; prix)) return 1;  // lit le prix ; si la lecture échoue (! = non), on quitte avec le code 1 (erreur)\n    std::cout &lt;&lt; \"Quantite ? \";         // affiche l'invite pour la quantité\n    if (!(std::cin &gt;&gt; qte)) return 1;   // lit la quantité ; en cas d'échec, on quitte avec le code d'erreur 1\n    std::cout &lt;&lt; std::fixed &lt;&lt; std::setprecision(2)   // active l'affichage à 2 décimales fixes\n              &lt;&lt; \"Total : \" &lt;&lt; prix * qte &lt;&lt; \"\\n\"; // affiche \"Total : \" puis le produit prix × quantité, puis saut de ligne\n    return 0;                           // 0 = programme terminé sans erreur\n}                                       // fin de main</pre>\n<p>On uniformise en <code>std::cin</code>/<code>std::cout</code>, on valide les saisies et on formate le montant. Demain : les pointeurs bruts — le cœur du bas niveau.</p>"
