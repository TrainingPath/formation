var DAY = {
  num: 14,
  title: "Héritage et fonctions virtuelles",
  subtitle: "Le polymorphisme et son mécanisme : la table des fonctions virtuelles (vtable).",
  theory: `
<h3>1. L'héritage</h3>
<p>L'<strong>héritage</strong> permet de créer une classe à partir d'une autre : la nouvelle (dite <strong>dérivée</strong> ou « fille ») <strong>récupère automatiquement</strong> les attributs et méthodes de l'ancienne (dite <strong>base</strong> ou « mère »), puis peut en ajouter. Idée : « un <code>Client</code> <em>est un</em> <code>Utilisateur</code>, avec des choses en plus ». Cela évite de réécrire ce qui est commun.</p>
<pre class="pseudo">class Utilisateur {                          // classe de BASE (mère)
protected:                                   // protected = accessible ICI ET dans les classes dérivées (mais pas de l'extérieur)
    std::string nom_;                        // attribut commun à tous les utilisateurs
public:                                      // interface publique
    Utilisateur(std::string nom) : nom_(nom) {}   // constructeur de la base : range le nom
};
class Client : public Utilisateur {          // Client DÉRIVE de Utilisateur (: public = héritage public)
public:
    Client(std::string nom) : Utilisateur(nom) {}   // le constructeur de la dérivée appelle celui de la BASE pour initialiser la partie héritée
};</pre>
<p><code>Client</code> hérite de <code>Utilisateur</code> : il possède ses attributs et méthodes. <code>protected</code> est un troisième niveau d'accès (après <code>public</code> et <code>private</code>) : accessible à la classe <strong>et</strong> à ses dérivées, mais pas de l'extérieur. Le constructeur de la dérivée doit appeler celui de la base (<code>: Utilisateur(nom)</code>) pour construire correctement la partie héritée.</p>

<h3>2. Les fonctions virtuelles et la vtable</h3>
<pre class="pseudo">class Utilisateur {
public:
    virtual double remise() const { return 0.0; }   // virtual = cette méthode peut être REDÉFINIE par une dérivée, et choisie au type réel
    virtual ~Utilisateur() = default;               // destructeur virtuel (= default : version générée par le compilateur)
};
class Vendeur : public Utilisateur {
public:
    double remise() const override { return 0.10; } // override = « je redéfinis bien la méthode virtuelle de la base » (le compilateur vérifie)
};</pre>
<p>Une méthode <code>virtual</code> (« virtuelle ») est résolue au <strong>type réel</strong> de l'objet, pas au type déclaré. Le mécanisme : le compilateur associe à chaque classe polymorphe une <strong>table de pointeurs de fonctions</strong> appelée <strong>vtable</strong> (<em>virtual table</em>) ; chaque objet sait pointer vers la vtable de sa vraie classe. Ainsi, appelée via un pointeur ou une référence de base, c'est la <strong>bonne version</strong> qui s'exécute. C'est le <strong>polymorphisme</strong> : un même appel (<code>u-&gt;remise()</code>) se comporte différemment selon le vrai type de l'objet. Le mot <code>override</code> n'est pas obligatoire mais recommandé : il fait vérifier au compilateur que tu redéfinis bien une méthode virtuelle existante (sinon erreur, ce qui évite les fautes de frappe).</p>

<h3>3. Le destructeur virtuel est vital</h3>
<pre class="pseudo">Utilisateur* u = new Vendeur();   // un pointeur de BASE qui pointe un objet DÉRIVÉ (Vendeur)
delete u;    // sans destructeur virtuel : SEUL ~Utilisateur() serait appelé → la partie Vendeur n'est pas nettoyée → FUITE</pre>
<div class="warn">Détruire un objet dérivé via un pointeur de base <strong>exige</strong> un destructeur virtuel : sinon seule la partie base est détruite (fuite ou comportement indéfini). Règle : toute classe destinée à servir de base à l'héritage doit avoir un <code>virtual ~Base()</code>.</div>

<h3>4. Attention au slicing</h3>
<pre class="pseudo">Vendeur v("Ana");                 // un vrai Vendeur
Utilisateur u = v;                // SLICING (« tranchage ») : on copie v dans un objet de base PAR VALEUR → la partie Vendeur est TRONQUÉE
// u n'est plus qu'un Utilisateur : le polymorphisme est PERDU ! Il faut un pointeur (Utilisateur*) ou une référence (Utilisateur&amp;) de base</pre>
<p>Le <strong>slicing</strong> (« découpage ») se produit quand on copie un objet dérivé dans une variable de type base <em>par valeur</em> : seule la partie « base » est conservée, le reste est perdu. Pour garder le polymorphisme, il faut manipuler l'objet via un <strong>pointeur</strong> ou une <strong>référence</strong> de base, jamais par valeur.</p>

<h3>5. Le coût du polymorphisme</h3>
<div class="tip">La vtable ajoute une petite <strong>indirection</strong> à l'appel virtuel (un pointeur de plus à suivre pour trouver la bonne fonction) : négligeable dans la plupart des cas, mais réel — c'est pourquoi on ne met <code>virtual</code> que là où le polymorphisme est nécessaire. Comprendre la vtable, c'est comprendre pourquoi <code>virtual</code>, <code>override</code> et le destructeur virtuel existent.</div>`,
  exercises: [
    { type: "qcm", q: "Le mot-clé pour une méthode redéfinissable :", opts: ["static", "virtual", "const", "final"], a: 1, exp: "virtual." },
    { type: "qcm", q: "La vtable est…", opts: ["un tableau de données", "une table de pointeurs de fonctions par classe polymorphe", "un int", "une string"], a: 1, exp: "Résout l'appel au type réel." },
    { type: "qcm", q: "Le polymorphisme fonctionne via…", opts: ["une copie par valeur", "un pointeur ou une référence de base", "un int", "un template"], a: 1, exp: "Pas par valeur (slicing)." },
    { type: "qcm", q: "protected signifie…", opts: ["public", "accessible à la classe et à ses dérivées", "privé strict", "global"], a: 1, exp: "Pour l'héritage." },
    { type: "qcm", q: "Une classe destinée à l'héritage doit avoir…", opts: ["un constructeur privé", "un destructeur virtuel", "aucune méthode", "un template"], a: 1, exp: "virtual ~Base()." },
    { type: "qcm", q: "Sans destructeur virtuel, <code>delete u;</code> (u = base*, objet dérivé)…", opts: ["détruit tout", "ne détruit que la partie base (fuite)", "plante toujours", "trie"], a: 1, exp: "Comportement indéfini." },
    { type: "qcm", q: "Le slicing survient quand…", opts: ["on passe par référence", "on copie un dérivé dans un objet de base par valeur", "on utilise override", "jamais"], a: 1, exp: "La partie dérivée est tronquée." },
    { type: "qcm", q: "override sert à…", opts: ["accélérer", "vérifier qu'on redéfinit bien une méthode virtuelle", "supprimer", "copier"], a: 1, exp: "Sécurité." },
    { type: "qcm", q: "Le constructeur d'une dérivée…", opts: ["ignore la base", "appelle le constructeur de la base", "est interdit", "est virtuel"], a: 1, exp: "Client(nom) : Utilisateur(nom)." },
    { type: "qcm", q: "Le coût d'un appel virtuel :", opts: ["énorme", "une petite indirection (pointeur de la vtable), souvent négligeable", "nul et gratuit toujours", "imprévisible"], a: 1, exp: "D'où virtual seulement si nécessaire." },
    { type: "vf", q: "Détruire un objet dérivé via un pointeur de base sans destructeur virtuel est dangereux.", a: true, exp: "Nettoyage incomplet." },
    { type: "qcm", q: "Une méthode NON virtuelle redéfinie dans une dérivée…", opts: ["est polymorphe", "n'est pas choisie par le type réel (pas de polymorphisme)", "plante", "est virtuelle"], a: 1, exp: "Il faut virtual." },
    { type: "qcm", q: "<code>u->remise()</code> (u = Vendeur* stocké en Utilisateur*) appelle…", opts: ["Utilisateur::remise", "Vendeur::remise (type réel, via vtable)", "les deux", "aucune"], a: 1, exp: "Polymorphisme." },
    { type: "qcm", q: "public dans <code>class Vendeur : public Utilisateur</code> :", opts: ["héritage public (interface préservée)", "tout privé", "aucun héritage", "amitié"], a: 0, exp: "Cas courant." },
    { type: "qcm", q: "Comprendre la vtable explique pourquoi existent…", opts: ["les int", "virtual, override et le destructeur virtuel", "les macros", "les fichiers"], a: 1, exp: "Le mécanisme du polymorphisme." }
  ],
  final: {
    title: "Exercice final — Hiérarchie de rôles",
    intro: `<p>Analyse :</p>
<pre class="pseudo">class Utilisateur {
public:
    double remise() { return 0.0; }      // BUG : pas de virtual → aucun polymorphisme
    // pas de destructeur                 // BUG : pas de destructeur virtuel
};
class Admin : public Utilisateur {       // Admin dérive d'Utilisateur
public:
    double remise() { return 0.20; }     // redéfinit remise, mais sans virtual dans la base ça ne suffit pas
};
Utilisateur* u = new Admin();            // pointeur de base vers un objet Admin
std::cout &lt;&lt; u-&gt;remise();               // affiche 0 (la version de base) au lieu de 0.20 : polymorphisme manquant
delete u;                               // ne détruit que la partie Utilisateur (destructeur non virtuel)</pre>`,
    questions: [
      { type: "qcm", q: "Bug n°1 — <code>remise()</code> non virtuelle :", opts: ["correct", "sans virtual, u->remise() appelle la version de base (0) : pas de polymorphisme", "trop lent", "rien"], a: 1, exp: "virtual + override nécessaires." },
      { type: "qcm", q: "Bug n°2 — pas de destructeur virtuel :", opts: ["ok", "delete u ne détruit que la partie Utilisateur (fuite/UB)", "trie", "rien"], a: 1, exp: "virtual ~Utilisateur()." },
      { type: "qcm", q: "Après corrections, <code>u->remise()</code> donne…", opts: ["0", "0.20 (type réel Admin, via vtable)", "erreur", "0.10"], a: 1, exp: "Polymorphisme." },
      { type: "qcm", q: "Quelle annotation sur Admin::remise ?", opts: ["static", "override", "final", "aucune"], a: 1, exp: "Vérifie la redéfinition." },
      { type: "qcm", q: "Passer par un objet de base par valeur causerait…", opts: ["rien", "du slicing (partie Admin perdue)", "un tri", "une fuite"], a: 1, exp: "D'où pointeur/référence." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                     // pour std::cout
                                        // ligne vide pour aérer
class Utilisateur {                     // classe de base
public:
    virtual double remise() const { return 0.0; }   // virtual : redéfinissable, choisie au type réel (0 % par défaut)
    virtual ~Utilisateur() = default;               // destructeur virtuel : destruction complète des dérivées
};
class Admin : public Utilisateur {      // Admin dérive d'Utilisateur
public:
    double remise() const override { return 0.20; } // override : redéfinit remise (20 %) ; le compilateur vérifie
};
                                        // ligne vide pour aérer
int main() {                            // point d'entrée
    Utilisateur* u = new Admin();       // pointeur de base vers un objet Admin réel
    std::cout &lt;&lt; u-&gt;remise() * 100 &lt;&lt; " %\\n";  // affiche 20 % : la vtable choisit Admin::remise
    delete u;                           // grâce au destructeur virtuel : ~Admin() PUIS ~Utilisateur()
    return 0;                           // 0 = programme terminé sans erreur
}                                       // fin de main</pre>
<p><code>virtual</code> active la vtable, <code>override</code> sécurise, le destructeur virtuel garantit une destruction complète. Demain : organiser le projet en fichiers .h/.cpp.</p>`
  }
};
