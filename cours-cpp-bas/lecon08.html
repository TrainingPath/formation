<script>
var DAY = {
  num: 8,
  title: "struct et class : la continuité",
  subtitle: "Du struct du C au class du C++ : regrouper des données, puis y ajouter des méthodes.",
  theory: `
<h3>1. La struct, comme en C</h3>
<p>Une <strong>struct</strong> (structure) est un moyen de <strong>regrouper plusieurs variables</strong> sous un seul nom, comme une fiche. Au lieu de gérer séparément un nom, un prix et un stock, on les réunit dans un type <code>Jeu</code>. Chaque variable regroupée s'appelle un <strong>champ</strong> (ou <strong>membre</strong>). Un <strong>objet</strong> est un exemplaire concret créé à partir de ce plan.</p>
<pre class="pseudo">struct Jeu {                 // on définit un nouveau TYPE nommé Jeu (une fiche qui regroupe 3 champs)
    std::string nom;         // champ nom : le titre du jeu (texte)
    double prix;             // champ prix : nombre à virgule
    int stock;               // champ stock : nombre d'exemplaires (entier)
};                           // le point-virgule ; final est OBLIGATOIRE après une struct

Jeu j{"Catan", 44.90, 3};    // crée un objet j de type Jeu ; { } remplit les champs dans l'ordre : nom, prix, stock
std::cout &lt;&lt; j.nom &lt;&lt; " " &lt;&lt; j.prix;   // le POINT (.) accède à un champ : j.nom, j.prix</pre>
<p>La <code>struct</code> regroupe des données. En C++, ses membres sont <strong>publics par défaut</strong> (accessibles de partout). On accède aux champs avec le <strong>point</strong> <code>.</code> quand on a un objet (ou avec la flèche <code>-&gt;</code> quand on a un pointeur vers l'objet, voir plus bas).</p>

<h3>2. Ajouter des méthodes</h3>
<pre class="pseudo">struct Jeu {                 // même fiche Jeu…
    std::string nom;         // champ nom
    double prix;             // champ prix
    int stock;               // champ stock
    bool disponible() const { return stock &gt; 0; }   // MÉTHODE : renvoie true si stock > 0 ; const = ne modifie pas l'objet
    void reappro(int n) { stock += n; }             // MÉTHODE : augmente le stock de n (elle modifie l'objet, donc pas de const)
};                           // ; final obligatoire</pre>
<p>Nouveauté du C++ : une <code>struct</code> (ou une <code>class</code>) peut contenir des <strong>fonctions membres</strong>, aussi appelées <strong>méthodes</strong> — des fonctions qui « appartiennent » à l'objet et agissent sur ses propres champs. Le mot <code>const</code> placé <em>après</em> l'en-tête d'une méthode promet qu'elle ne <strong>modifie pas</strong> l'objet (méthode de lecture).</p>

<h3>3. struct vs class : l'accès par défaut</h3>
<pre class="pseudo">struct Point { int x, y; };        // struct : membres PUBLICS par défaut (accessibles depuis l'extérieur)
class  Jeu   { std::string n; };   // class : membres PRIVÉS par défaut (accessibles seulement depuis l'intérieur)</pre>
<div class="warn">La seule différence entre <code>struct</code> et <code>class</code> est le niveau d'accès <strong>par défaut</strong> : <strong>public</strong> pour <code>struct</code> (tout le monde peut lire/écrire les membres), <strong>private</strong> pour <code>class</code> (seules les méthodes de la classe le peuvent). On utilise <code>struct</code> pour un simple agrégat de données, <code>class</code> quand on veut de l'<em>encapsulation</em> (leçon 11).</div>

<h3>4. Encapsuler avec private</h3>
<pre class="pseudo">class Jeu {                          // class : par défaut tout est privé
    std::string nom_;               // champ privé (le _ final est une convention pour « membre privé »)
    int stock_;                     // champ privé
public:                             // à partir d'ici, tout est PUBLIC (l'interface offerte à l'extérieur)
    Jeu(std::string n, int s) : nom_(n), stock_(s) {}   // CONSTRUCTEUR : initialise nom_ et stock_ à la création
    bool disponible() const { return stock_ &gt; 0; }      // méthode publique de lecture
};                                  // ; final obligatoire</pre>
<p>En passant en <code>class</code>, on <strong>cache</strong> les données derrière <code>private</code> et on n'expose que des méthodes contrôlées après <code>public:</code> — c'est l'<strong>encapsulation</strong> : protéger l'état interne pour qu'il ne soit modifié que de façon maîtrisée. Le <strong>constructeur</strong> est une méthode spéciale, portant le nom de la classe, appelée automatiquement à la création d'un objet pour l'initialiser (détaillé en leçon 11).</p>

<h3>5. Pointeur vers struct/objet</h3>
<pre class="pseudo">Jeu* p = &amp;j;                 // p est un pointeur vers l'objet j (il contient l'adresse de j)
std::cout &lt;&lt; p-&gt;nom;         // la FLÈCHE -> accède à un champ via un pointeur ; p->nom équivaut à (*p).nom</pre>
<p>Quand on a un <em>pointeur</em> vers un objet (au lieu de l'objet lui-même), on utilise la <strong>flèche</strong> <code>-&gt;</code> au lieu du point. <code>p-&gt;nom</code> est simplement un raccourci pour <code>(*p).nom</code> : déréférencer le pointeur, puis accéder au champ.</p>
<div class="tip">La <code>struct</code> C++ est la <code>struct</code> du C, augmentée de méthodes. En ajoutant l'encapsulation (<code>class</code> + <code>private</code>) et, plus tard, l'héritage et les fonctions virtuelles, on obtient la vraie programmation objet — construite sur des fondations que tu connais déjà.</div>`,
  exercises: [
    { type: "qcm", q: "Une struct C++ peut contenir…", opts: ["que des données", "des données ET des méthodes", "que des méthodes", "des fichiers"], a: 1, exp: "Fonctions membres autorisées." },
    { type: "qcm", q: "Différence struct / class en C++ ?", opts: ["énorme", "l'accès par défaut : public (struct) vs private (class)", "struct sans méthodes", "class plus lent"], a: 1, exp: "Sinon quasi identiques." },
    { type: "qcm", q: "Comment accède-t-on à un champ via un objet ?", opts: ["j->champ", "j.champ (le point)", "j[champ]", "champ(j)"], a: 1, exp: "Le point pour un objet." },
    { type: "qcm", q: "Via un pointeur vers objet, on accède avec…", opts: ["p.champ", "p->champ", "*p.champ", "&p"], a: 1, exp: "-> équiv. (*p).champ." },
    { type: "qcm", q: "Qu'oublie-t-on souvent après <code>}</code> d'une struct/class ?", opts: ["une virgule", "le point-virgule ;", "un return", "un cout"], a: 1, exp: "struct X { ... };." },
    { type: "qcm", q: "const après une méthode signifie…", opts: ["elle est rapide", "elle ne modifie pas l'objet", "elle est privée", "rien"], a: 1, exp: "Méthode de lecture." },
    { type: "qcm", q: "Les membres d'une struct sont, par défaut…", opts: ["privés", "publics", "protégés", "cachés"], a: 1, exp: "Public par défaut." },
    { type: "qcm", q: "Les membres d'une class sont, par défaut…", opts: ["publics", "privés", "protégés", "globaux"], a: 1, exp: "Private par défaut." },
    { type: "qcm", q: "L'encapsulation consiste à…", opts: ["tout rendre public", "cacher les données (private), exposer des méthodes", "supprimer les classes", "copier"], a: 1, exp: "Protège l'état." },
    { type: "qcm", q: "Quand préférer struct à class ?", opts: ["jamais", "pour un simple agrégat de données", "toujours", "pour l'héritage"], a: 1, exp: "Données publiques." },
    { type: "vf", q: "La struct C++ est la struct du C, augmentée de méthodes.", a: true, exp: "Continuité avec le C." },
    { type: "qcm", q: "bool disponible() const { return stock_ > 0; } est…", opts: ["un setter", "une méthode de lecture (const)", "un constructeur", "une erreur"], a: 1, exp: "Ne modifie rien." },
    { type: "qcm", q: "Pour créer un objet Jeu avec un constructeur (n, s) :", opts: ["Jeu j;", "Jeu j(\"Catan\", 3);", "Jeu j = 3;", "new Jeu"], a: 1, exp: "Appel du constructeur." },
    { type: "qcm", q: "Passer de struct à class + private apporte…", opts: ["rien", "l'encapsulation", "de la vitesse", "des templates"], a: 1, exp: "État protégé." },
    { type: "qcm", q: "La vraie POO ajoute ensuite…", opts: ["des int", "l'héritage et les fonctions virtuelles", "des macros", "des fichiers"], a: 1, exp: "Sur ces fondations." }
  ],
  final: {
    title: "Exercice final — De struct à class",
    intro: `<p>On modélise un jeu. Analyse :</p>
<pre class="pseudo">struct Jeu {                          // définition d'une struct Jeu
    std::string nom;                  // champ nom
    int stock;                        // champ stock
    bool disponible() { return stock &gt; 0; }   // méthode ; devrait être const (elle ne modifie rien)
}                                     // ERREUR : il manque le point-virgule ; après l'accolade
int main() {                          // point d'entrée
    Jeu j;                            // crée un jeu (champs non initialisés)
    j.stock = 3;                      // fonctionne : stock est public par défaut (struct)
}</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — après <code>}</code> de la struct :", opts: ["rien", "il manque le ; (struct Jeu { ... };)", "il faut class", "une virgule"], a: 1, exp: "Point-virgule." },
      { type: "qcm", q: "<code>disponible()</code> devrait être…", opts: ["non-const", "const (ne modifie rien)", "private", "supprimée"], a: 1, exp: "Méthode de lecture." },
      { type: "qcm", q: "<code>j.stock = 3;</code> fonctionne car…", opts: ["stock est privé", "struct rend les membres publics par défaut", "c'est interdit", "il faut ->"], a: 1, exp: "Public par défaut." },
      { type: "qcm", q: "Pour cacher stock, on passerait à…", opts: ["struct", "class + private (encapsulation)", "un int global", "un pointeur"], a: 1, exp: "class Jeu { int stock_; ... };." },
      { type: "qcm", q: "Avec l'encapsulation, on modifierait stock via…", opts: ["j.stock = 3", "une méthode publique (constructeur, reappro)", "une globale", "impossible"], a: 1, exp: "L'interface contrôlée." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                 // pour std::cout
#include &lt;string&gt;                   // pour std::string
                                    // ligne vide pour aérer
// version encapsulée (class) :
class Jeu {                         // class : membres privés par défaut
    std::string nom_;              // champ privé : le nom
    int stock_;                    // champ privé : le stock
public:                            // début de la partie publique (interface)
    Jeu(std::string nom, int stock) : nom_(nom), stock_(stock) {}   // constructeur : initialise les champs à la création
    bool disponible() const { return stock_ &gt; 0; }   // méthode de lecture (const) : true si stock > 0
    void reappro(int n) { stock_ += n; }             // méthode : augmente le stock de n
};                                 // ; final obligatoire
                                    // ligne vide pour aérer
int main() {                        // point d'entrée
    Jeu j("Catan", 3);             // crée un jeu ; le constructeur règle l'état (nom + stock)
    j.reappro(5);                  // stock passe de 3 à 8
    std::cout &lt;&lt; j.disponible() &lt;&lt; "\\n";  // affiche 1 (true) : le stock est > 0
    return 0;                      // 0 = programme terminé sans erreur
}                                  // fin de main</pre>
<p>Le <code>;</code> final, une méthode <code>const</code>, et le passage à <code>class</code> + <code>private</code> pour encapsuler. Demain : l'allocation dynamique avec <code>new</code> et <code>delete</code>.</p>`
  }
};
</script>

  { id: "cppb-l08", title: "Une struct Jeu avec méthode", level: 2,
    statement: "Définis un struct Jeu avec nom (std::string), prix (double), stock (int), et une méthode double valeur() const qui renvoie prix × stock. Crée un Jeu et affiche sa valeur.",
    hints: [
      "struct Jeu { std::string nom; double prix; int stock; double valeur() const { ... } };",
      "valeur() est const car elle ne modifie rien.",
      "Jeu j{\"Catan\", 44.90, 3}; puis j.valeur()."
    ],
    solution: "#include <iostream>          // pour std::cout\n#include <string>            // pour std::string\n\nstruct Jeu {                 // fiche regroupant les donnees d'un jeu\n    std::string nom;         // champ nom (texte)\n    double prix;             // champ prix (nombre a virgule)\n    int stock;               // champ stock (entier)\n    double valeur() const { return prix * stock; }   // methode const : valeur totale du stock (prix x stock)\n};                           // ; final obligatoire\n\nint main() {                 // point d'entree\n    Jeu j{\"Catan\", 44.90, 3};   // cree un jeu et remplit ses champs\n    std::cout << j.nom << \" : valeur du stock = \" << j.valeur() << \"\\n\";   // affiche le nom et la valeur\n    return 0;                // 0 = programme termine sans erreur\n}",
    note: "Une struct C++ peut porter des méthodes (ici valeur()), pas seulement des données : c'est le premier pas vers l'objet. const signale que valeur() ne modifie pas le jeu. On passerait à class + private pour encapsuler." }
  ]
};
