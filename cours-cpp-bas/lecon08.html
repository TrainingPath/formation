  "title": "struct et class : la continuité",
  "subtitle": "Du struct du C au class du C++ : regrouper des données, puis y ajouter des méthodes.",
  "theory": "\n<h3>1. La struct, comme en C</h3>\n<p>Une <strong>struct</strong> (structure) est un moyen de <strong>regrouper plusieurs variables</strong> sous un seul nom, comme une fiche. Au lieu de gérer séparément un nom, un prix et un stock, on les réunit dans un type <code>Jeu</code>. Chaque variable regroupée s'appelle un <strong>champ</strong> (ou <strong>membre</strong>). Un <strong>objet</strong> est un exemplaire concret créé à partir de ce plan.</p>\n<pre class=\"pseudo\">struct Jeu {                 // on définit un nouveau TYPE nommé Jeu (une fiche qui regroupe 3 champs)\n    std::string nom;         // champ nom : le titre du jeu (texte)\n    double prix;             // champ prix : nombre à virgule\n    int stock;               // champ stock : nombre d'exemplaires (entier)\n};                           // le point-virgule ; final est OBLIGATOIRE après une struct\n\nJeu j{\"Catan\", 44.90, 3};    // crée un objet j de type Jeu ; { } remplit les champs dans l'ordre : nom, prix, stock\nstd::cout &lt;&lt; j.nom &lt;&lt; \" \" &lt;&lt; j.prix;   // le POINT (.) accède à un champ : j.nom, j.prix</pre>\n<p>La <code>struct</code> regroupe des données. En C++, ses membres sont <strong>publics par défaut</strong> (accessibles de partout). On accède aux champs avec le <strong>point</strong> <code>.</code> quand on a un objet (ou avec la flèche <code>-&gt;</code> quand on a un pointeur vers l'objet, voir plus bas).</p>\n\n<h3>2. Ajouter des méthodes</h3>\n<pre class=\"pseudo\">struct Jeu {                 // même fiche Jeu…\n    std::string nom;         // champ nom\n    double prix;             // champ prix\n    int stock;               // champ stock\n    bool disponible() const { return stock &gt; 0; }   // MÉTHODE : renvoie true si stock > 0 ; const = ne modifie pas l'objet\n    void reappro(int n) { stock += n; }             // MÉTHODE : augmente le stock de n (elle modifie l'objet, donc pas de const)\n};                           // ; final obligatoire</pre>\n<p>Nouveauté du C++ : une <code>struct</code> (ou une <code>class</code>) peut contenir des <strong>fonctions membres</strong>, aussi appelées <strong>méthodes</strong> — des fonctions qui « appartiennent » à l'objet et agissent sur ses propres champs. Le mot <code>const</code> placé <em>après</em> l'en-tête d'une méthode promet qu'elle ne <strong>modifie pas</strong> l'objet (méthode de lecture).</p>\n\n<h3>3. struct vs class : l'accès par défaut</h3>\n<pre class=\"pseudo\">struct Point { int x, y; };        // struct : membres PUBLICS par défaut (accessibles depuis l'extérieur)\nclass  Jeu   { std::string n; };   // class : membres PRIVÉS par défaut (accessibles seulement depuis l'intérieur)</pre>\n<div class=\"warn\">La seule différence entre <code>struct</code> et <code>class</code> est le niveau d'accès <strong>par défaut</strong> : <strong>public</strong> pour <code>struct</code> (tout le monde peut lire/écrire les membres), <strong>private</strong> pour <code>class</code> (seules les méthodes de la classe le peuvent). On utilise <code>struct</code> pour un simple agrégat de données, <code>class</code> quand on veut de l'<em>encapsulation</em> (leçon 11).</div>\n\n<h3>4. Encapsuler avec private</h3>\n<pre class=\"pseudo\">class Jeu {                          // class : par défaut tout est privé\n    std::string nom_;               // champ privé (le _ final est une convention pour « membre privé »)\n    int stock_;                     // champ privé\npublic:                             // à partir d'ici, tout est PUBLIC (l'interface offerte à l'extérieur)\n    Jeu(std::string n, int s) : nom_(n), stock_(s) {}   // CONSTRUCTEUR : initialise nom_ et stock_ à la création\n    bool disponible() const { return stock_ &gt; 0; }      // méthode publique de lecture\n};                                  // ; final obligatoire</pre>\n<p>En passant en <code>class</code>, on <strong>cache</strong> les données derrière <code>private</code> et on n'expose que des méthodes contrôlées après <code>public:</code> — c'est l'<strong>encapsulation</strong> : protéger l'état interne pour qu'il ne soit modifié que de façon maîtrisée. Le <strong>constructeur</strong> est une méthode spéciale, portant le nom de la classe, appelée automatiquement à la création d'un objet pour l'initialiser (détaillé en leçon 11).</p>\n\n<h3>5. Pointeur vers struct/objet</h3>\n<pre class=\"pseudo\">Jeu* p = &amp;j;                 // p est un pointeur vers l'objet j (il contient l'adresse de j)\nstd::cout &lt;&lt; p-&gt;nom;         // la FLÈCHE -> accède à un champ via un pointeur ; p->nom équivaut à (*p).nom</pre>\n<p>Quand on a un <em>pointeur</em> vers un objet (au lieu de l'objet lui-même), on utilise la <strong>flèche</strong> <code>-&gt;</code> au lieu du point. <code>p-&gt;nom</code> est simplement un raccourci pour <code>(*p).nom</code> : déréférencer le pointeur, puis accéder au champ.</p>\n<div class=\"tip\">La <code>struct</code> C++ est la <code>struct</code> du C, augmentée de méthodes. En ajoutant l'encapsulation (<code>class</code> + <code>private</code>) et, plus tard, l'héritage et les fonctions virtuelles, on obtient la vraie programmation objet — construite sur des fondations que tu connais déjà.</div>",

    "solution": "<pre class=\"pseudo\">#include &lt;iostream&gt;                 // pour std::cout\n#include &lt;string&gt;                   // pour std::string\n                                    // ligne vide pour aérer\n// version encapsulée (class) :\nclass Jeu {                         // class : membres privés par défaut\n    std::string nom_;              // champ privé : le nom\n    int stock_;                    // champ privé : le stock\npublic:                            // début de la partie publique (interface)\n    Jeu(std::string nom, int stock) : nom_(nom), stock_(stock) {}   // constructeur : initialise les champs à la création\n    bool disponible() const { return stock_ &gt; 0; }   // méthode de lecture (const) : true si stock > 0\n    void reappro(int n) { stock_ += n; }             // méthode : augmente le stock de n\n};                                 // ; final obligatoire\n                                    // ligne vide pour aérer\nint main() {                        // point d'entrée\n    Jeu j(\"Catan\", 3);             // crée un jeu ; le constructeur règle l'état (nom + stock)\n    j.reappro(5);                  // stock passe de 3 à 8\n    std::cout &lt;&lt; j.disponible() &lt;&lt; \"\\n\";  // affiche 1 (true) : le stock est > 0\n    return 0;                      // 0 = programme terminé sans erreur\n}                                  // fin de main</pre>\n<p>Le <code>;</code> final, une méthode <code>const</code>, et le passage à <code>class</code> + <code>private</code> pour encapsuler. Demain : l'allocation dynamique avec <code>new</code> et <code>delete</code>.</p>"
