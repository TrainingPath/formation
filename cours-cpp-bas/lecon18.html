<script>
var DAY = {
  num: 18,
  title: "Pointeurs de fonctions et foncteurs",
  subtitle: "Passer un comportement en paramètre : du pointeur de fonction du C au foncteur et à la lambda.",
  theory: `
<h3>1. Le pointeur de fonction (style C)</h3>
<p>Jusqu'ici on passait des <em>données</em> aux fonctions. On peut aussi passer un <strong>comportement</strong> : « voici quoi faire ». En effet, une fonction, comme une variable, occupe une place en mémoire et possède donc une <strong>adresse</strong>. Un <strong>pointeur de fonction</strong> est une variable qui stocke l'adresse d'une fonction, ce qui permet de l'appeler indirectement.</p>
<pre class="pseudo">int addition(int a, int b) { return a + b; }   // une fonction ordinaire qui additionne
int (*op)(int, int) = addition;                // op = POINTEUR de fonction ; se lit : op pointe une fonction (int,int)->int ; on y met addition
std::cout &lt;&lt; op(2, 3);                          // appelle la fonction pointée par op → addition(2,3) → affiche 5</pre>
<p>La syntaxe <code>int (*op)(int, int)</code> se décode ainsi : les parenthèses autour de <code>*op</code> disent « <code>op</code> est un pointeur », le <code>(int, int)</code> ses paramètres, le <code>int</code> de gauche son type de retour. On peut ainsi passer un <strong>comportement</strong> en paramètre — comme la fonction <code>qsort</code> du C, à qui l'on fournit une fonction de comparaison (leçon 18 du cours C).</p>

<h3>2. Passer une fonction en paramètre</h3>
<pre class="pseudo">int appliquer(int x, int y, int (*f)(int, int)) {   // appliquer reçoit 2 entiers ET une fonction f (via pointeur)
    return f(x, y);                                 // elle appelle la fonction reçue avec x et y
}
appliquer(2, 3, addition);   // on passe la fonction addition comme argument → renvoie 5</pre>
<p>Le troisième paramètre <code>int (*f)(int, int)</code> est un pointeur de fonction : <code>appliquer</code> ne sait pas à l'avance <em>quoi</em> faire, c'est l'appelant qui le décide en fournissant la fonction. C'est le principe du <strong>callback</strong> (fonction de rappel).</p>

<h3>3. Le foncteur : un objet appelable</h3>
<pre class="pseudo">struct Multiplier {                                        // une petite structure…
    int facteur;                                          // …qui porte un ÉTAT : le facteur de multiplication
    int operator()(int x) const { return x * facteur; }   // operator() : rend l'objet APPELABLE comme une fonction
};
Multiplier fois3{3};                                       // crée un objet fois3 dont le facteur vaut 3
std::cout &lt;&lt; fois3(10);                                    // fois3(10) appelle operator()(10) → 10 * 3 → affiche 30</pre>
<p>Un <strong>foncteur</strong> (ou « objet-fonction ») est une classe/struct qui définit l'opérateur spécial <code>operator()</code> (l'opérateur d'appel). Ses instances s'utilisent <strong>comme des fonctions</strong> (<code>fois3(10)</code>), mais, étant des objets, elles peuvent porter un <strong>état</strong> (ici la donnée <code>facteur</code>) — ce qu'un simple pointeur de fonction ne peut pas faire.</p>

<h3>4. La lambda (le C++ moderne)</h3>
<pre class="pseudo">auto fois3 = [](int x) { return x * 3; };               // LAMBDA : une fonction ANONYME (sans nom) ; [] = liste de capture (vide) ; (int x) = paramètre ; { } = corps
int facteur = 3;                                        // une variable locale
auto foisN = [facteur](int x) { return x * facteur; };  // ici [facteur] CAPTURE la variable : la lambda garde une copie de facteur (son état)</pre>
<div class="warn">La <strong>lambda</strong> est la façon moderne d'écrire une petite fonction sur place : le compilateur la transforme en fait en un foncteur. Les crochets <code>[ ]</code> au début forment la <strong>liste de capture</strong> : ce qu'on y met (ex. <code>[facteur]</code>) devient accessible dans le corps. <code>auto</code> laisse le compilateur deviner le type. La lambda remplace avantageusement le pointeur de fonction (plus lisible, peut capturer des variables) dans le code C++ récent.</div>

<h3>5. std::function : le type qui les unifie</h3>
<pre class="pseudo">#include &lt;functional&gt;                    // en-tête de std::function
std::function&lt;int(int)&gt; f = fois3;      // std::function&lt;int(int)&gt; = « quelque chose d'appelable qui prend un int et rend un int »
// f peut recevoir une lambda, un foncteur OU un pointeur de fonction : elle les accepte tous les trois</pre>
<div class="tip">Trois façons de « passer un comportement » : pointeur de fonction (C), foncteur (objet avec <code>operator()</code>, porte un état), lambda (moderne, concise). <code>std::function</code> est un type « boîte » capable de stocker les trois. Comprendre le pointeur de fonction éclaire d'où viennent les lambdas.</div>`,
  exercises: [
    { type: "qcm", q: "Un pointeur de fonction stocke…", opts: ["une valeur", "l'adresse d'une fonction", "un objet", "un fichier"], a: 1, exp: "Comme une variable, une fonction a une adresse." },
    { type: "qcm", q: "Comment déclarer un pointeur vers int(int,int) ?", opts: ["int* f", "int (*f)(int, int)", "int f*", "func f"], a: 1, exp: "Parenthèses autour de *f." },
    { type: "qcm", q: "L'intérêt d'un pointeur de fonction :", opts: ["aucun", "passer un comportement en paramètre", "trier plus vite", "compiler"], a: 1, exp: "Callbacks, tris génériques." },
    { type: "qcm", q: "Un foncteur est…", opts: ["une fonction", "une classe qui surcharge operator() (objet appelable)", "un pointeur", "un int"], a: 1, exp: "S'appelle comme une fonction." },
    { type: "qcm", q: "Avantage du foncteur sur le pointeur de fonction :", opts: ["plus rapide toujours", "il peut porter un état (des données)", "moins de code", "aucun"], a: 1, exp: "Ex. un facteur." },
    { type: "qcm", q: "Une lambda est…", opts: ["une classe", "une fonction anonyme (transformée en foncteur par le compilateur)", "un pointeur nul", "un int"], a: 1, exp: "[](params){ corps }." },
    { type: "qcm", q: "Une lambda peut capturer…", opts: ["rien", "des variables du contexte ([facteur])", "que des int", "des fichiers"], a: 1, exp: "État via les crochets." },
    { type: "qcm", q: "operator() dans un foncteur rend l'objet…", opts: ["copiable", "appelable comme une fonction", "trié", "const"], a: 1, exp: "obj(x)." },
    { type: "qcm", q: "std::function<int(int)> peut stocker…", opts: ["que des lambdas", "lambda, foncteur ET pointeur de fonction", "que des pointeurs", "rien"], a: 1, exp: "Type unificateur." },
    { type: "qcm", q: "En C++ moderne, on préfère souvent…", opts: ["le pointeur de fonction", "la lambda (concise, capture l'état)", "les macros", "les globales"], a: 1, exp: "Plus lisible." },
    { type: "vf", q: "Le compilateur transforme une lambda en foncteur.", a: true, exp: "Une classe avec operator()." },
    { type: "qcm", q: "qsort (du C) utilise pour comparer…", opts: ["une lambda", "un pointeur de fonction", "un foncteur", "std::function"], a: 1, exp: "Callback à la C." },
    { type: "qcm", q: "Quel en-tête pour std::function ?", opts: ["<function>", "<functional>", "<memory>", "<algorithm>"], a: 1, exp: "#include <functional>." },
    { type: "qcm", q: "Un foncteur <code>Multiplier{3}</code> appelé fois3(10) donne…", opts: ["13", "30", "3", "10"], a: 1, exp: "10 * 3." },
    { type: "qcm", q: "Comprendre le pointeur de fonction aide à…", opts: ["éviter les lambdas", "comprendre d'où viennent les lambdas et callbacks", "trier", "compiler"], a: 1, exp: "Le mécanisme sous-jacent." }
  ],
  final: {
    title: "Exercice final — Passer un comportement",
    intro: `<p>On veut appliquer une opération à deux entiers. Analyse :</p>
<pre class="pseudo">int appliquer(int x, int y, int f(int, int)) {   // f(int,int) en paramètre = un pointeur de fonction (décay automatique)
    return f(x, y);                              // appelle la fonction reçue
}
int somme(int a, int b) { return a + b; }        // une fonction concrète à passer
// appliquer(2, 3, somme) → renvoie somme(2,3) = 5</pre>`,
    questions: [
      { type: "qcm", q: "<code>int f(int, int)</code> en paramètre est…", opts: ["invalide", "un pointeur de fonction (équivaut à int (*f)(int,int))", "un foncteur", "un int"], a: 1, exp: "Décay en pointeur de fonction." },
      { type: "qcm", q: "appliquer(2, 3, somme) renvoie…", opts: ["erreur", "5", "6", "23"], a: 1, exp: "somme(2,3)." },
      { type: "qcm", q: "Pour porter un état (ex. un facteur), on utilise…", opts: ["un pointeur de fonction seul", "un foncteur ou une lambda avec capture", "un int global", "rien"], a: 1, exp: "Un état associé." },
      { type: "qcm", q: "La version moderne de <code>somme</code> à la volée :", opts: ["#define", "une lambda [](int a, int b){ return a+b; }", "une macro", "un pointeur nul"], a: 1, exp: "Fonction anonyme." },
      { type: "qcm", q: "Le type qui accepte les trois formes :", opts: ["int", "std::function<int(int,int)>", "void*", "auto seul"], a: 1, exp: "Unificateur." }
    ],
    solution: `<pre class="pseudo">#include &lt;iostream&gt;                     // pour std::cout
#include &lt;functional&gt;                   // pour std::function
                                        // ligne vide pour aérer
int appliquer(int x, int y, std::function&lt;int(int,int)&gt; f) {   // f accepte lambda, foncteur OU pointeur de fonction
    return f(x, y);                     // appelle le comportement reçu avec x et y
}                                       // fin de appliquer
int somme(int a, int b) { return a + b; }   // une fonction concrète
                                        // ligne vide pour aérer
int main() {                            // point d'entrée
    std::cout &lt;&lt; appliquer(2, 3, somme) &lt;&lt; "\\n";                        // passe un POINTEUR de fonction → 5
    std::cout &lt;&lt; appliquer(2, 3, [](int a, int b){ return a*b; }) &lt;&lt; "\\n"; // passe une LAMBDA (multiplication) → 6
    return 0;                           // 0 = programme terminé sans erreur
}                                       // fin de main</pre>
<p>Pointeur de fonction, foncteur, lambda : trois façons de passer un comportement, unifiées par <code>std::function</code>. En moderne, la lambda est reine. Demain : préprocesseur, macros, const et constexpr.</p>`
  }
};

    ],
    solution: "#include <iostream>          // pour std::cout\n\nstruct Remise {              // FONCTEUR : un objet appelable qui porte un etat\n    double taux;             // etat : le taux de remise\n    double operator()(double prix) const {   // operator() : rend l'objet appelable comme une fonction\n        return prix * (1.0 - taux);          // prix apres remise\n    }\n};\n\nint main() {                 // point d'entree\n    Remise moins20{0.20};    // cree une remise de 20 %\n    std::cout << moins20(50.0) << \"\\n\";   // appelle l'OBJET comme une fonction -> 40\n    return 0;                // 0 = programme termine sans erreur\n}\n// Lambda equivalente (moderne) :\n//   double t = 0.20;\n//   auto moins20 = [t](double p){ return p * (1 - t); };",

  ]
