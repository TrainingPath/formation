  "subtitle": "Passer un comportement en paramètre : du pointeur de fonction du C au foncteur et à la lambda.",
  "theory": "\n<h3>1. Le pointeur de fonction (style C)</h3>\n<p>Jusqu'ici on passait des <em>données</em> aux fonctions. On peut aussi passer un <strong>comportement</strong> : « voici quoi faire ». En effet, une fonction, comme une variable, occupe une place en mémoire et possède donc une <strong>adresse</strong>. Un <strong>pointeur de fonction</strong> est une variable qui stocke l'adresse d'une fonction, ce qui permet de l'appeler indirectement.</p>\n<pre class=\"pseudo\">int addition(int a, int b) { return a + b; }   // une fonction ordinaire qui additionne\nint (*op)(int, int) = addition;                // op = POINTEUR de fonction ; se lit : op pointe une fonction (int,int)->int ; on y met addition\nstd::cout &lt;&lt; op(2, 3);                          // appelle la fonction pointée par op → addition(2,3) → affiche 5</pre>\n<p>La syntaxe <code>int (*op)(int, int)</code> se décode ainsi : les parenthèses autour de <code>*op</code> disent « <code>op</code> est un pointeur », le <code>(int, int)</code> ses paramètres, le <code>int</code> de gauche son type de retour. On peut ainsi passer un <strong>comportement</strong> en paramètre — comme la fonction <code>qsort</code> du C, à qui l'on fournit une fonction de comparaison (leçon 18 du cours C).</p>\n\n<h3>2. Passer une fonction en paramètre</h3>\n<pre class=\"pseudo\">int appliquer(int x, int y, int (*f)(int, int)) {   // appliquer reçoit 2 entiers ET une fonction f (via pointeur)\n    return f(x, y);                                 // elle appelle la fonction reçue avec x et y\n}\nappliquer(2, 3, addition);   // on passe la fonction addition comme argument → renvoie 5</pre>\n<p>Le troisième paramètre <code>int (*f)(int, int)</code> est un pointeur de fonction : <code>appliquer</code> ne sait pas à l'avance <em>quoi</em> faire, c'est l'appelant qui le décide en fournissant la fonction. C'est le principe du <strong>callback</strong> (fonction de rappel).</p>\n\n<h3>3. Le foncteur : un objet appelable</h3>\n<pre class=\"pseudo\">struct Multiplier {                                        // une petite structure…\n    int facteur;                                          // …qui porte un ÉTAT : le facteur de multiplication\n    int operator()(int x) const { return x * facteur; }   // operator() : rend l'objet APPELABLE comme une fonction\n};\nMultiplier fois3{3};                                       // crée un objet fois3 dont le facteur vaut 3\nstd::cout &lt;&lt; fois3(10);                                    // fois3(10) appelle operator()(10) → 10 * 3 → affiche 30</pre>\n<p>Un <strong>foncteur</strong> (ou « objet-fonction ») est une classe/struct qui définit l'opérateur spécial <code>operator()</code> (l'opérateur d'appel). Ses instances s'utilisent <strong>comme des fonctions</strong> (<code>fois3(10)</code>), mais, étant des objets, elles peuvent porter un <strong>état</strong> (ici la donnée <code>facteur</code>) — ce qu'un simple pointeur de fonction ne peut pas faire.</p>\n\n<h3>4. La lambda (le C++ moderne)</h3>\n<pre class=\"pseudo\">auto fois3 = [](int x) { return x * 3; };               // LAMBDA : une fonction ANONYME (sans nom) ; [] = liste de capture (vide) ; (int x) = paramètre ; { } = corps\nint facteur = 3;                                        // une variable locale\nauto foisN = [facteur](int x) { return x * facteur; };  // ici [facteur] CAPTURE la variable : la lambda garde une copie de facteur (son état)</pre>\n<div class=\"warn\">La <strong>lambda</strong> est la façon moderne d'écrire une petite fonction sur place : le compilateur la transforme en fait en un foncteur. Les crochets <code>[ ]</code> au début forment la <strong>liste de capture</strong> : ce qu'on y met (ex. <code>[facteur]</code>) devient accessible dans le corps. <code>auto</code> laisse le compilateur deviner le type. La lambda remplace avantageusement le pointeur de fonction (plus lisible, peut capturer des variables) dans le code C++ récent.</div>\n\n<h3>5. std::function : le type qui les unifie</h3>\n<pre class=\"pseudo\">#include &lt;functional&gt;                    // en-tête de std::function\nstd::function&lt;int(int)&gt; f = fois3;      // std::function&lt;int(int)&gt; = « quelque chose d'appelable qui prend un int et rend un int »\n// f peut recevoir une lambda, un foncteur OU un pointeur de fonction : elle les accepte tous les trois</pre>\n<div class=\"tip\">Trois façons de « passer un comportement » : pointeur de fonction (C), foncteur (objet avec <code>operator()</code>, porte un état), lambda (moderne, concise). <code>std::function</code> est un type « boîte » capable de stocker les trois. Comprendre le pointeur de fonction éclaire d'où viennent les lambdas.</div>",

    "intro": "<p>On veut appliquer une opération à deux entiers. Analyse :</p>\n<pre class=\"pseudo\">int appliquer(int x, int y, int f(int, int)) {   // f(int,int) en paramètre = un pointeur de fonction (décay automatique)\n    return f(x, y);                              // appelle la fonction reçue\n}\nint somme(int a, int b) { return a + b; }        // une fonction concrète à passer\n// appliquer(2, 3, somme) → renvoie somme(2,3) = 5</pre>",
