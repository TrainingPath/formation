<script>
var DAY = {
  num: 3,
  title: "Insérer des données : INSERT et LAST_INSERT_ID",
  subtitle: "Ajouter des lignes et récupérer l'identifiant généré.",
  theory: `
<h3>1. Ajouter une ligne : INSERT</h3>
<p>Nos tables sont créées mais VIDES. Pour y ranger des données, on ajoute des <strong>lignes</strong> (des fiches) avec la commande <code>INSERT</code> (« insérer » en anglais). C'est le geste de base pour <strong>remplir</strong> une table. Sa forme la plus simple : on dit dans QUELLE table (<code>INTO</code> = « dans »), pour QUELLES colonnes, et avec QUELLES valeurs (<code>VALUES</code> = « valeurs »).</p>
<pre class="pseudo">INSERT INTO CATEGORIE (libelle) VALUES ('Stratégie');  -- INSERT INTO CATEGORIE = ajoute une ligne dans la table CATEGORIE ; (libelle) = la colonne qu'on remplit ; VALUES ('Stratégie') = la valeur à y mettre ; le ; termine la commande</pre>
<p>Deux règles d'écriture importantes. D'abord, on <strong>n'écrit PAS</strong> la colonne <code>AUTO_INCREMENT</code> (l'identifiant) : MySQL la remplit tout seul, on la laisse de côté. Ensuite, le <strong>texte</strong> (les chaînes de caractères) s'écrit entre <strong>apostrophes</strong> : <code>'Stratégie'</code> ; les <strong>nombres</strong>, eux, s'écrivent sans apostrophes : <code>5.00</code>.</p>

<h3>2. Insérer plusieurs lignes d'un coup</h3>
<p>Plutôt que d'écrire un <code>INSERT</code> par ligne, on peut en ajouter plusieurs en une seule commande : on enchaîne plusieurs groupes <code>VALUES</code> séparés par des virgules. C'est plus court à écrire et plus rapide à exécuter.</p>
<pre class="pseudo">INSERT INTO CATEGORIE (libelle) VALUES   -- une seule commande INSERT pour la colonne libelle…
  ('Stratégie'),                         -- …première ligne : la virgule annonce qu'il y en a d'autres
  ('Famille'),                           -- deuxième ligne
  ('Ambiance');                          -- troisième ligne ; le point-virgule final termine toute la commande</pre>

<h3>3. Récupérer l'id généré : LAST_INSERT_ID()</h3>
<p>Comme MySQL a fabriqué l'identifiant tout seul, on ne le connaît pas d'avance. Souvent on en a besoin juste après (par exemple pour relier ce jeu à autre chose). La fonction <code>LAST_INSERT_ID()</code> nous donne le DERNIER identifiant AUTO_INCREMENT que MySQL vient de générer.</p>
<pre class="pseudo">INSERT INTO JEU (titre, prixLocation, idCategorie)   -- on insère un jeu en remplissant ces trois colonnes…
VALUES ('Catan', 5.00, 1);                           -- …avec ces valeurs (dans le MÊME ordre que les colonnes)

SELECT LAST_INSERT_ID();   -- SELECT = affiche un résultat ; LAST_INSERT_ID() = renvoie l'id du jeu qu'on vient d'insérer</pre>
<p><code>LAST_INSERT_ID()</code> renvoie ce dernier identifiant <strong>dans la session courante</strong>. Une <strong>session</strong> est ta connexion personnelle au serveur (comme ton « fil de discussion » à toi) : ainsi, même si dix personnes insèrent en même temps, chacune récupère SON propre id, pas celui du voisin. C'est l'équivalent MySQL de la fonction <code>SCOPE_IDENTITY()</code> en T-SQL (SQL Server).</p>

<h3>4. Insérer depuis un SELECT</h3>
<p>On peut aussi remplir une table à partir des données d'une AUTRE table : au lieu d'écrire les valeurs à la main, on branche un <code>SELECT</code> (une lecture) qui va les chercher. Ici, on recopie dans JEU_ARCHIVE les jeux qui ne sont plus en location :</p>
<pre class="pseudo">INSERT INTO JEU_ARCHIVE (titre, prixLocation)   -- on va remplir ces deux colonnes de la table JEU_ARCHIVE…
SELECT titre, prixLocation FROM JEU WHERE stockLocation = 0;  -- …avec le résultat de cette lecture : titre et prixLocation des jeux dont le stockLocation vaut 0 (WHERE = condition)</pre>

<h3>5. Gérer les doublons et les valeurs par défaut</h3>
<p>Parfois on tente d'insérer une ligne qui existe déjà. Une <strong>clé unique</strong> (ou la clé primaire) interdit deux fois la même valeur ; l'insertion échouerait alors avec une erreur. MySQL offre deux façons d'éviter le blocage :</p>
<pre class="pseudo">-- ignorer une ligne qui violerait une clé unique
INSERT IGNORE INTO CATEGORIE (idCategorie, libelle) VALUES (1, 'Stratégie');  -- INSERT IGNORE = "insère, et si ça crée un doublon, ne fais rien au lieu de planter"

-- insérer ou mettre à jour si la clé existe déjà (upsert MySQL)
INSERT INTO STOCK (idJeu, quantite) VALUES (1, 5)          -- on essaie d'insérer le stock 5 pour le jeu 1…
ON DUPLICATE KEY UPDATE quantite = quantite + 5;           -- ON DUPLICATE KEY UPDATE = "si la clé existe DÉJÀ, ne crée pas de doublon mais mets à jour" ; ici on ajoute 5 à la quantité existante</pre>
<div class="tip"><code>INSERT ... ON DUPLICATE KEY UPDATE</code> est la façon MySQL de faire un « upsert » — un mot-valise de UPDATE + INSERT : « mettre à jour si ça existe, sinon insérer ». <code>INSERT IGNORE</code>, lui, se contente de passer outre l'erreur de doublon sans rien modifier.</div>`,
  exercises: [
    { type: "qcm", q: "Une colonne AUTO_INCREMENT dans un INSERT…", opts: ["Doit être fournie", "Est omise : MySQL la génère", "Vaut toujours 0", "Est un texte"], a: 1, exp: "Auto-générée." },
    { type: "qcm", q: "Les chaînes s'écrivent…", opts: ["Sans guillemets", "Entre apostrophes 'texte'", "Entre crochets", "Entre accolades"], a: 1, exp: "'Catan'." },
    { type: "qcm", q: "Récupérer l'id généré :", opts: ["SCOPE_IDENTITY()", "LAST_INSERT_ID()", "GET_ID()", "@@IDENTITY"], a: 1, exp: "Fonction MySQL." },
    { type: "qcm", q: "LAST_INSERT_ID() renvoie l'id…", opts: ["De toute la base", "Du dernier INSERT de la session courante", "Le plus grand id", "Toujours 1"], a: 1, exp: "Dernier généré, par session." },
    { type: "qcm", q: "Insérer plusieurs lignes d'un coup :", opts: ["Impossible", "Plusieurs VALUES séparés par des virgules", "Un INSERT par ligne obligatoire", "Avec UNION"], a: 1, exp: "VALUES (...),(...),(...)." },
    { type: "qcm", q: "Alimenter une table depuis une autre :", opts: ["COPY", "INSERT INTO ... SELECT ...", "IMPORT", "MERGE"], a: 1, exp: "INSERT ... SELECT." },
    { type: "qcm", q: "L'upsert MySQL s'écrit…", opts: ["MERGE", "INSERT ... ON DUPLICATE KEY UPDATE", "UPSERT", "INSERT OR UPDATE"], a: 1, exp: "Propre à MySQL." },
    { type: "qcm", q: "Ignorer une erreur de doublon :", opts: ["INSERT IGNORE", "INSERT SKIP", "INSERT SILENT", "INSERT NULL"], a: 0, exp: "INSERT IGNORE." },
    { type: "qcm", q: "Insérer un JEU avec un idCategorie inexistant (InnoDB)…", opts: ["Réussit", "Échoue (clé étrangère)", "Crée la catégorie", "Met NULL"], a: 1, exp: "Intégrité référentielle." },
    { type: "qcm", q: "Un nombre décimal s'écrit dans un INSERT…", opts: ["'5.00'", "5.00 (sans guillemets)", "[5.00]", "5,00"], a: 1, exp: "Sans guillemets, point décimal." },
    { type: "vf", q: "On peut omettre la colonne AUTO_INCREMENT dans la liste des colonnes.", a: true, exp: "MySQL la remplit." },
    { type: "qcm", q: "ON DUPLICATE KEY UPDATE agit quand…", opts: ["Toujours", "La clé (primaire/unique) existe déjà", "Jamais", "La table est vide"], a: 1, exp: "Conflit de clé." },
    { type: "vf", q: "LAST_INSERT_ID() est l'équivalent MySQL de SCOPE_IDENTITY().", a: true, exp: "Récupère l'id généré." },
    { type: "qcm", q: "L'ordre des valeurs dans VALUES…", opts: ["Est libre", "Suit l'ordre des colonnes citées", "Est alphabétique", "Suit la clé"], a: 1, exp: "Correspondance colonne/valeur." },
    { type: "qcm", q: "Insérer 3 catégories en une commande :", opts: ["3 INSERT obligatoires", "Un INSERT avec 3 groupes VALUES", "Un SELECT", "Un UPDATE"], a: 1, exp: "Multi-lignes." }
  ],
  final: {
    title: "Exercice final — Peupler le catalogue",
    intro: `<p>Les tables CATEGORIE (idCategorie AUTO_INCREMENT) et JEU existent. On les remplit.</p>`,
    questions: [
      { type: "qcm", q: "Insérer « Stratégie » sans donner l'id :", opts: ["INSERT INTO CATEGORIE (libelle) VALUES ('Stratégie')", "INSERT (1,'Stratégie')", "ADD 'Stratégie'", "SET libelle"], a: 0, exp: "On omet la colonne AUTO_INCREMENT." },
      { type: "qcm", q: "Récupérer l'id de la catégorie créée :", opts: ["SELECT MAX(id)", "SELECT LAST_INSERT_ID()", "SELECT SCOPE_IDENTITY()", "SELECT @@ID"], a: 1, exp: "LAST_INSERT_ID()." },
      { type: "qcm", q: "Insérer 3 jeux d'un coup :", opts: ["3 commandes", "Un INSERT avec 3 VALUES", "Un MERGE", "Un UPDATE"], a: 1, exp: "Multi-lignes." },
      { type: "qcm", q: "Ajouter du stock si le jeu existe déjà :", opts: ["INSERT ... ON DUPLICATE KEY UPDATE", "MERGE", "REPLACE ALL", "UPDATE seul"], a: 0, exp: "Upsert MySQL." },
      { type: "vf", q: "MAX(idJeu) n'est pas fiable pour récupérer SON id en accès concurrents.", a: true, exp: "LAST_INSERT_ID est sûr." }
    ],
    solution: `<pre class="pseudo">INSERT INTO CATEGORIE (libelle) VALUES ('Stratégie'), ('Famille');  -- deux catégories ajoutées en une commande (colonne libelle, ids générés tout seuls)

INSERT INTO JEU (titre, prixAchat, prixLocation, idCategorie) VALUES  -- on remplit ces 4 colonnes de JEU…
  ('Catan', 44.90, 5.00, 1),   -- jeu 1 : titre, prix d'achat, prix de location, catégorie 1
  ('Azul',  39.90, 4.00, 1),   -- jeu 2
  ('Dixit', 29.90, 3.50, 2);   -- jeu 3 (catégorie 2) ; le ; termine tout

SELECT LAST_INSERT_ID();   -- affiche l'id du DERNIER jeu inséré (Dixit) dans cette session</pre>
<p>Ton catalogue est rempli. Demain : SELECT, alias et CONCAT.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris tes INSERT MySQL…",
  items: [
  { id: "mysql-l3", title: "Remplir et tracer l'id", level: 2,
    statement: "La table JEU a idJeu en AUTO_INCREMENT. (1) Insère « Azul » (achat 39.90, location 4.00, catégorie 1) sans fournir idJeu. (2) Récupère l'identifiant généré. (3) Insère deux catégories 'Ambiance' et 'Enfants' en une seule commande.",
    hints: [
      "Omets idJeu : INSERT INTO JEU (titre, prixAchat, prixLocation, idCategorie) VALUES (...).",
      "SELECT LAST_INSERT_ID(); juste après.",
      "INSERT INTO CATEGORIE (libelle) VALUES ('Ambiance'), ('Enfants');"
    ],
    solution: "INSERT INTO JEU (titre, prixAchat, prixLocation, idCategorie)\nVALUES ('Azul', 39.90, 4.00, 1);\n\nSELECT LAST_INSERT_ID();\n\nINSERT INTO CATEGORIE (libelle) VALUES ('Ambiance'), ('Enfants');",
    atoi: { cmd: "INSERT INTO JEU (titre, prixAchat, prixLocation, idCategorie) VALUES ('Azul', 39.90, 4.00, 1);\nSELECT LAST_INSERT_ID();\nINSERT INTO CATEGORIE (libelle) VALUES ('Ambiance'), ('Enfants');",
      expected: "Query OK, 1 row affected\n+------------------+\n| LAST_INSERT_ID() |\n+------------------+\n|                7 |\n+------------------+\nQuery OK, 2 rows affected" },
    sqlnote: "LAST_INSERT_ID() est une fonction propre à MySQL (SQLite expose la même idée via last_insert_rowid()). Comme elle dépend de la session serveur, on vérifie cet exercice sur MySQL, pas dans le navigateur.",
    checklist: [
      "As-tu OMIS idJeu dans la liste des colonnes (il est AUTO_INCREMENT) ?",
      "SELECT LAST_INSERT_ID(); suit-il l'INSERT dans la même session ?",
      "Les deux catégories sont-elles insérées en UNE seule commande VALUES (…),(…) ?"
    ],
    note: "On n'insère pas la colonne AUTO_INCREMENT. LAST_INSERT_ID() récupère l'id du dernier INSERT de la session, de façon fiable même en accès concurrents. L'insertion multi-lignes en une commande est plus rapide qu'un INSERT par ligne." }
  ]
};
</script>
