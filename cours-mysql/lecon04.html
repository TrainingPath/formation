var DAY = {

  title: "Interroger : SELECT, alias et CONCAT",
  subtitle: "Projeter, renommer, assembler des colonnes.",
  theory: `
<h3>1. Lire des données : SELECT et projection</h3>
<p>Maintenant que nos tables contiennent des lignes, on veut les LIRE. La commande <code>SELECT</code> (« sélectionner » en anglais) sert à interroger une table et à afficher un résultat, <strong>sans jamais rien modifier</strong> : c'est de la lecture pure. On indique les colonnes voulues, puis <code>FROM</code> (« depuis ») suivi du nom de la table. Choisir quelles colonnes on affiche s'appelle la <strong>projection</strong> (on « projette » certaines colonnes à l'écran, comme on braque un projecteur sur une partie du tableau).</p>
<pre class="pseudo">SELECT titre, prixLocation FROM JEU;   -- SELECT titre, prixLocation = affiche ces DEUX colonnes ; FROM JEU = en les prenant dans la table JEU
SELECT * FROM JEU;                     -- l'étoile * = raccourci pour "TOUTES les colonnes" de la table</pre>
<p>L'étoile <code>*</code> prend tout, ce qui est pratique pour explorer ; mais dans un vrai programme on préfère <strong>nommer</strong> les colonnes utiles (c'est plus clair et plus rapide, on ne rapatrie que ce dont on a besoin).</p>

<h3>2. Les alias (AS)</h3>
<p>Un <strong>alias</strong> est un <strong>nom de remplacement</strong> qu'on donne le temps de la requête, comme un surnom. On l'introduit avec le mot <code>AS</code> (« en tant que »). Un alias de <strong>colonne</strong> change juste l'intitulé affiché ; un alias de <strong>table</strong> donne un nom court à la table pour la citer plus vite. Rien n'est modifié dans la vraie table : c'est purement de l'affichage.</p>
<pre class="pseudo">SELECT titre AS Jeu, prixLocation AS Tarif FROM JEU;  -- la colonne titre s'affichera sous le titre "Jeu", et prixLocation sous "Tarif"
-- alias de table
SELECT j.titre FROM JEU AS j;   -- JEU AS j : on surnomme la table "j" ; ensuite j.titre = la colonne titre de cette table j</pre>

<h3>3. Concaténer avec CONCAT</h3>
<p><strong>Concaténer</strong> veut dire « coller des morceaux de texte bout à bout » (par exemple coller un titre, un tiret et un prix pour fabriquer une petite fiche). Attention à un piège : en MySQL, l'opérateur <code>+</code> sert à <strong>additionner</strong> des nombres, il ne colle PAS du texte. Pour assembler du texte, on utilise la fonction <code>CONCAT</code>.</p>
<pre class="pseudo">SELECT CONCAT(titre, ' — ', prixLocation, ' €') AS fiche FROM JEU;  -- CONCAT(...) colle bout à bout : le titre, puis " — ", puis le prix, puis " €" ; AS fiche = on nomme le résultat "fiche"
-- CONCAT_WS met un séparateur entre chaque élément
SELECT CONCAT_WS(' / ', titre, prixLocation) AS resume FROM JEU;  -- CONCAT_WS = "Concat With Separator" : le 1er argument (' / ') est glissé automatiquement ENTRE chaque valeur suivante</pre>
<div class="warn">Piège classique : <code>SELECT titre + ' €'</code> ne concatène pas en MySQL — il tente une <strong>addition</strong> (il essaie de transformer le texte en nombre) et renvoie souvent 0. Utilise toujours <code>CONCAT</code> pour coller du texte.</div>

<h3>4. Colonnes calculées</h3>
<p>Une <strong>colonne calculée</strong> est une colonne qui n'existe pas dans la table : elle est <strong>calculée à la volée</strong> au moment de l'affichage, à partir d'autres colonnes. La vraie table n'est pas touchée. Exemple avec un prix TTC (toutes taxes comprises), obtenu en multipliant par 1,2 (soit +20 % de TVA) :</p>
<pre class="pseudo">SELECT titre, prixLocation * 1.2 AS ttc FROM JEU;   -- prixLocation * 1.2 = calcul (le prix + 20% de TVA) fait à l'affichage ; AS ttc = on nomme cette colonne calculée "ttc"</pre>

<h3>5. DISTINCT</h3>
<p>Un <strong>doublon</strong> est une ligne identique qui apparaît plusieurs fois dans un résultat. Le mot-clé <code>DISTINCT</code> (« distinct », « différent ») supprime ces répétitions : il ne garde qu'un exemplaire de chaque valeur. Utile, par exemple, pour lister les catégories réellement utilisées sans les répéter :</p>
<pre class="pseudo">SELECT DISTINCT idCategorie FROM JEU;   -- DISTINCT = enlève les répétitions ; on obtient la liste des idCategorie utilisés, chacun UNE seule fois</pre>`,
  exercises: [

    { type: "qcm", q: "titre + ' €' en MySQL…", opts: ["Concatène", "Tente une addition (souvent 0)", "Trie", "Erreur fatale"], a: 1, exp: "Le + n'est pas la concaténation." },
    { type: "qcm", q: "CONCAT_WS sert à…", opts: ["Compter", "Concaténer avec un séparateur entre chaque élément", "Trier", "Découper une chaîne en morceaux"], a: 1, exp: "WS = With Separator." },

    { type: "qcm", q: "DISTINCT sert à…", opts: ["Trier", "Éliminer les doublons du résultat", "Compter", "Joindre"], a: 1, exp: "Déduplication." },
    { type: "qcm", q: "Afficher seulement titre et prix :", opts: ["SELECT * FROM JEU", "SELECT titre, prixLocation FROM JEU", "SELECT JEU", "GET titre"], a: 1, exp: "Projection ciblée." },
    { type: "qcm", q: "CONCAT gère plusieurs arguments :", opts: ["Non, deux max", "Oui, autant qu'on veut", "Un seul", "Zéro"], a: 1, exp: "CONCAT(a, b, c, ...)." },
    { type: "vf", q: "SELECT ne modifie jamais la table, il ne fait que lire.", a: true, exp: "Lecture seule." },
    { type: "qcm", q: "prixLocation * 1.2 …", opts: ["Modifie la colonne", "Est calculé à l'affichage, sans changer la table", "Supprime", "Trie"], a: 1, exp: "Calcul en lecture." },
    { type: "vf", q: "L'opérateur + concatène le texte en SQL Server mais pas en MySQL.", a: true, exp: "En MySQL : CONCAT." },
    { type: "qcm", q: "Les catégories utilisées sans doublon :", opts: ["SELECT idCategorie", "SELECT DISTINCT idCategorie", "GROUP idCategorie", "TOP idCategorie"], a: 1, exp: "DISTINCT." },
    { type: "qcm", q: "Une fiche « titre / prix » avec séparateur :", opts: ["CONCAT_WS(' / ', titre, prixLocation)", "titre / prix", "SPLIT()", "JOIN()"], a: 0, exp: "CONCAT_WS." }
  ],
  final: {
    title: "Exercice final — Vitrine MySQL",
    intro: `<p>Table JEU(idJeu, titre, prixLocation, idCategorie).</p>`,
    questions: [
      { type: "qcm", q: "Renommer prixLocation en Tarif :", opts: ["prixLocation Tarif", "prixLocation AS Tarif", "AS Tarif", "Tarif = prixLocation"], a: 1, exp: "colonne AS alias." },
      { type: "qcm", q: "Une fiche « Titre — prix € » :", opts: ["titre + ' — ' + prix", "CONCAT(titre, ' — ', prixLocation, ' €')", "titre & prix", "MERGE"], a: 1, exp: "CONCAT." },
      { type: "qcm", q: "Catégories sans doublon :", opts: ["SELECT idCategorie", "SELECT DISTINCT idCategorie", "TOP idCategorie", "GROUP"], a: 1, exp: "DISTINCT." },
      { type: "qcm", q: "Prix TTC affiché :", opts: ["prixLocation * 1.2 AS ttc", "TTC()", "prix.ttc", "CALC"], a: 0, exp: "Colonne calculée." },
      { type: "vf", q: "En MySQL, écrire titre + ' €' ne produit pas la concaténation attendue.", a: true, exp: "Utiliser CONCAT." }
    ],
    solution: `<pre class="pseudo">SELECT titre AS Jeu, prixLocation AS Tarif FROM JEU;  -- affiche titre (sous le nom "Jeu") et prixLocation (sous le nom "Tarif")

SELECT CONCAT(titre, ' — ', prixLocation, ' €') AS fiche FROM JEU;  -- colle titre + " — " + prix + " €" en une seule colonne nommée "fiche"

SELECT DISTINCT idCategorie FROM JEU;  -- liste des catégories utilisées, sans répétition (DISTINCT)</pre>
<p>Tu façonnes l'affichage. Demain : filtrer avec WHERE.</p>`
  }
};
