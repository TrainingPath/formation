var DAY = {
  num: 17,
  title: "Les transactions MySQL (InnoDB, ACID)",
  subtitle: "Tout ou rien : garantir la cohérence des écritures.",
  theory: `
<h3>1. Le problème</h3>
<p>Certaines actions demandent PLUSIEURS écritures qui vont ensemble. Exemple : louer un jeu = insérer une ligne dans LOUER ET diminuer le stock du jeu. Que se passe-t-il si la première écriture réussit mais la seconde échoue (coupure, erreur…) ? On se retrouve avec une location enregistrée sans stock décrémenté : les données sont <strong>incohérentes</strong>. La solution est la <strong>transaction</strong> : un groupe d'opérations traité comme un TOUT INDIVISIBLE — soit tout réussit, soit tout est annulé, jamais « à moitié ». Pense à un virement bancaire : débiter un compte et créditer l'autre doivent se faire ensemble, ou pas du tout.</p>

<h3>2. START TRANSACTION / COMMIT / ROLLBACK</h3>
<p>On ouvre une transaction avec <code>START TRANSACTION</code>, on écrit nos opérations, puis on décide : <code>COMMIT</code> (« valider ») rend le tout définitif, ou <code>ROLLBACK</code> (« annuler », littéralement « rembobiner ») remet tout comme avant.</p>
<pre class="pseudo">START TRANSACTION;   -- START TRANSACTION = ouvre la transaction : à partir d'ici, rien n'est définitif tant qu'on n'a pas validé
  INSERT INTO LOUER (idClient, idJeu, dateDebut) VALUES (1, 5, CURDATE());  -- 1re écriture : on enregistre la location
  UPDATE JEU SET stockLocation = stockLocation - 1 WHERE idJeu = 5;         -- 2e écriture : on retire 1 du stock du jeu loué
COMMIT;               -- COMMIT = VALIDE : les deux écritures deviennent définitives EN MÊME TEMPS</pre>
<pre class="pseudo">ROLLBACK;             -- ROLLBACK = ANNULE tout : retour exact à l'état d'AVANT le START TRANSACTION (comme si rien ne s'était passé)</pre>

<h3>3. Les propriétés ACID</h3>
<p>Une vraie transaction respecte quatre garanties, résumées par l'acronyme <strong>ACID</strong> :</p>
<pre class="pseudo">Atomicité    -- "tout ou rien" : soit toutes les opérations passent, soit aucune (comme un atome, insécable)
Cohérence    -- la base reste valide : toutes les contraintes (clés, CHECK…) restent respectées avant et après
Isolation    -- les transactions simultanées ne se marchent pas dessus : chacune agit comme si elle était seule
Durabilité   -- une fois le COMMIT fait, c'est PERMANENT : même une panne juste après ne l'efface pas</pre>

<h3>4. InnoDB et autocommit</h3>
<p>Par défaut, MySQL est en mode <code>autocommit</code> (« validation automatique ») : chaque instruction est validée toute seule, immédiatement, comme une mini-transaction. Écrire <code>START TRANSACTION</code> <strong>suspend</strong> ce comportement : rien n'est validé jusqu'à ton <code>COMMIT</code> (ou annulé par <code>ROLLBACK</code>).</p>
<div class="warn">Seul le moteur <strong>InnoDB</strong> gère les transactions. Avec MyISAM, <code>START TRANSACTION</code> est sans effet : chaque écriture est immédiate et un <code>ROLLBACK</code> n'annule RIEN. C'est une raison de plus de toujours utiliser InnoDB.</div>

<h3>5. SAVEPOINT</h3>
<p>Un <strong>SAVEPOINT</strong> (« point de sauvegarde ») pose un jalon À L'INTÉRIEUR d'une transaction. On peut ensuite annuler PARTIELLEMENT, jusqu'à ce jalon seulement, sans tout perdre :</p>
<pre class="pseudo">START TRANSACTION;
  INSERT INTO ...;    -- une première écriture
  SAVEPOINT s1;       -- SAVEPOINT s1 = on pose un jalon nommé "s1" ici
  UPDATE ...;         -- une seconde écriture, après le jalon
  ROLLBACK TO s1;     -- ROLLBACK TO s1 = annule seulement ce qui suit s1 (le UPDATE) ; l'INSERT du début est CONSERVÉ
COMMIT;               -- on valide ce qui reste (l'INSERT)</pre>
<div class="tip">Un <code>SAVEPOINT</code> pose un jalon dans la transaction : on peut annuler partiellement jusqu'à lui (<code>ROLLBACK TO</code>) sans perdre tout le travail déjà fait avant le jalon.</div>`,
  exercises: [
    { type: "qcm", q: "Une transaction sert à…", opts: ["Trier", "Regrouper des écritures en un tout indivisible", "Créer un index", "Accélérer"], a: 1, exp: "Tout ou rien." },
    { type: "qcm", q: "Démarrer une transaction :", opts: ["BEGIN TRAN", "START TRANSACTION", "OPEN TRAN", "TRAN ON"], a: 1, exp: "START TRANSACTION (ou BEGIN)." },
    { type: "qcm", q: "Valider :", opts: ["SAVE", "COMMIT", "END", "OK"], a: 1, exp: "COMMIT." },
    { type: "qcm", q: "Annuler :", opts: ["CANCEL", "ROLLBACK", "UNDO", "RESET"], a: 1, exp: "ROLLBACK." },
    { type: "qcm", q: "Le moteur qui gère les transactions :", opts: ["MyISAM", "InnoDB", "MEMORY", "CSV"], a: 1, exp: "InnoDB." },
    { type: "qcm", q: "Le A de ACID :", opts: ["Accès", "Atomicité (tout ou rien)", "Alias", "Agrégat"], a: 1, exp: "Atomicité." },
    { type: "qcm", q: "Le D de ACID :", opts: ["Doublon", "Durabilité (un COMMIT est permanent)", "Delete", "Distinct"], a: 1, exp: "Durabilité." },
    { type: "qcm", q: "L'autocommit par défaut signifie…", opts: ["Rien n'est validé", "Chaque instruction est validée immédiatement", "Tout est en transaction", "Les writes échouent"], a: 1, exp: "Validation immédiate." },
    { type: "qcm", q: "Un SAVEPOINT permet…", opts: ["De trier", "D'annuler partiellement jusqu'à un jalon", "D'indexer", "De compter"], a: 1, exp: "Annulation partielle." },
    { type: "qcm", q: "Avec MyISAM, ROLLBACK…", opts: ["Annule tout", "N'annule rien (pas de transactions)", "Trie", "Supprime la table"], a: 1, exp: "Pas de transactions." },
    { type: "vf", q: "Sans transaction, un échec à mi-chemin peut laisser des données incohérentes.", a: true, exp: "D'où les transactions." },
    { type: "qcm", q: "Le I de ACID :", opts: ["Index", "Isolation (les transactions concurrentes ne se mélangent pas)", "Insert", "Identity"], a: 1, exp: "Isolation." },
    { type: "vf", q: "Une fois le COMMIT effectué, les modifications sont permanentes.", a: true, exp: "Durabilité." },
    { type: "qcm", q: "ROLLBACK TO s1 …", opts: ["Valide tout", "Annule jusqu'au savepoint s1", "Supprime la table", "Trie"], a: 1, exp: "Annulation partielle." },
    { type: "qcm", q: "Louer un jeu implique idéalement…", opts: ["Une seule écriture", "INSERT + UPDATE dans une même transaction", "Aucune écriture", "Deux transactions séparées"], a: 1, exp: "Opérations liées." }
  ],
  final: {
    title: "Exercice final — Une location atomique",
    intro: `<p>Louer = insérer dans LOUER et décrémenter le stock, de façon indivisible (InnoDB).</p>`,
    questions: [
      { type: "qcm", q: "Ouvrir la transaction :", opts: ["OPEN", "START TRANSACTION", "TRAN", "AUTOCOMMIT"], a: 1, exp: "START TRANSACTION." },
      { type: "qcm", q: "En cas de succès :", opts: ["ROLLBACK", "COMMIT", "END", "SAVE"], a: 1, exp: "COMMIT." },
      { type: "qcm", q: "En cas d'erreur :", opts: ["COMMIT", "ROLLBACK", "END", "SAVE"], a: 1, exp: "ROLLBACK." },
      { type: "qcm", q: "Le moteur requis :", opts: ["MyISAM", "InnoDB", "MEMORY", "CSV"], a: 1, exp: "InnoDB." },
      { type: "vf", q: "La transaction garantit qu'on n'aura jamais une location enregistrée sans stock décrémenté.", a: true, exp: "Atomicité." }
    ],
    solution: `<pre class="pseudo">START TRANSACTION;   -- ouvre la transaction (rien n'est définitif pour l'instant)
  INSERT INTO LOUER (idClient, idJeu, dateDebut)   -- enregistre la location…
  VALUES (1, 5, CURDATE());
  UPDATE JEU SET stockLocation = stockLocation - 1  -- …et décrémente le stock du jeu
  WHERE idJeu = 5;
COMMIT;   -- valide les DEUX écritures ensemble ; ou ROLLBACK; pour tout annuler en cas de problème</pre>
<p>Tes écritures sont cohérentes. Demain : les procédures stockées.</p>`
  }
};
