<script>
var DAY = {
  num: 16,
  title: "ALTER TABLE, vues et index",
  subtitle: "Faire évoluer le schéma et accélérer les requêtes.",
  theory: `
<h3>1. Faire évoluer une table : ALTER TABLE</h3>
<p>Une table créée n'est pas figée pour toujours : on peut avoir besoin d'AJOUTER une colonne, d'en supprimer une, ou de changer son type. La commande <code>ALTER TABLE</code> (« modifier la table ») fait évoluer la STRUCTURE d'une table existante (son <strong>schéma</strong>, c'est-à-dire la définition de ses colonnes). Attention : cela agit sur la forme de la table, pas sur son contenu ligne par ligne (ça c'était UPDATE).</p>
<pre class="pseudo">ALTER TABLE JEU ADD COLUMN dateAjout DATE;             -- ADD COLUMN = ajoute une nouvelle colonne "dateAjout" de type DATE
ALTER TABLE JEU DROP COLUMN dateAjout;                 -- DROP COLUMN = supprime la colonne "dateAjout" (et toutes ses données !)
ALTER TABLE JEU MODIFY COLUMN titre VARCHAR(200);      -- MODIFY COLUMN = change le TYPE de la colonne "titre" (ici on l'agrandit à 200 caractères)
ALTER TABLE JEU CHANGE COLUMN titre nom VARCHAR(200);  -- CHANGE COLUMN = RENOMME "titre" en "nom" et fixe son type (le nouveau nom vient après l'ancien)
ALTER TABLE JEU ADD CONSTRAINT ck_prix CHECK (prixLocation &gt; 0);  -- ADD CONSTRAINT = ajoute une contrainte nommée (ici un CHECK sur le prix)</pre>
<div class="warn">En MySQL, on écrit <code>MODIFY COLUMN</code> pour changer le type (et NON ALTER COLUMN comme SQL Server), et <code>CHANGE COLUMN</code> pour renommer une colonne. Supprimer une colonne (<code>DROP COLUMN</code>) DÉTRUIT ses données définitivement.</div>

<h3>2. Les vues</h3>
<p>Une <strong>vue</strong> (<code>VIEW</code>) est une <strong>requête enregistrée sous un nom</strong>, qu'on interroge ensuite comme si c'était une vraie table. C'est comme un raccourci vers une requête compliquée : au lieu de la réécrire à chaque fois, on lui donne un nom une bonne fois pour toutes. La vue ne stocke PAS les données ; elle relit les tables réelles à chaque appel.</p>
<pre class="pseudo">CREATE VIEW v_JeuxDisponibles AS   -- CREATE VIEW … AS = on enregistre la requête suivante sous le nom "v_JeuxDisponibles"
SELECT j.titre, c.libelle, j.prixLocation
FROM JEU j
JOIN CATEGORIE c ON j.idCategorie = c.idCategorie
WHERE j.stockLocation &gt; 0;         -- la vue = les jeux encore disponibles à la location, avec leur catégorie

SELECT * FROM v_JeuxDisponibles;   -- on interroge la vue exactement COMME une table (sans réécrire toute la jointure)</pre>
<p>Intérêt : une vue simplifie l'écriture (on cache la complexité) et sécurise l'accès (on ne montre que certaines colonnes), sans jamais dupliquer les données.</p>

<h3>3. Les index</h3>
<p>Un <strong>index</strong> est une structure qui accélère la RECHERCHE dans une colonne, un peu comme l'index alphabétique à la fin d'un livre : au lieu de lire toutes les pages, on va directement au bon endroit. On le crée avec <code>CREATE INDEX</code>. Un index <strong>composite</strong> porte sur plusieurs colonnes à la fois.</p>
<pre class="pseudo">CREATE INDEX idx_titre ON JEU(titre);              -- crée un index nommé idx_titre sur la colonne titre : les recherches par titre deviennent rapides
CREATE UNIQUE INDEX idx_lib ON CATEGORIE(libelle); -- index UNIQUE : accélère ET garantit qu'aucun libellé n'est en double
-- index composite (plusieurs colonnes)
CREATE INDEX idx_cat_prix ON JEU(idCategorie, prixLocation);  -- index sur DEUX colonnes ensemble : utile pour filtrer par catégorie puis prix</pre>
<p>Un index accélère les <code>WHERE</code>, <code>JOIN</code> et <code>ORDER BY</code> portant sur sa colonne, au prix d'un léger surcoût à chaque écriture (il faut aussi mettre l'index à jour).</p>

<h3>4. Vérifier avec EXPLAIN</h3>
<p>Comment savoir si MySQL utilise vraiment un index ? Avec <code>EXPLAIN</code>, qu'on place devant une requête : il n'exécute pas la requête, il affiche le <strong>plan d'exécution</strong> (la stratégie que MySQL compte suivre).</p>
<pre class="pseudo">EXPLAIN SELECT * FROM JEU WHERE titre = 'Catan';  -- EXPLAIN = montre COMMENT MySQL exécuterait cette requête, sans la lancer réellement</pre>
<p>Dans le résultat, la colonne <code>key</code> indique l'index réellement utilisé (ou vide si aucun), et <code>rows</code> le nombre estimé de lignes examinées (plus il est bas, mieux c'est).</p>

<h3>5. Bien indexer</h3>
<div class="tip">On indexe les colonnes SOUVENT filtrées ou jointes, pas toutes. Un index composite <code>(a, b)</code> sert les recherches sur <code>a</code> ou sur <code>a, b</code>, mais PAS sur <code>b</code> seul (c'est la règle du « préfixe gauche » : on lit les colonnes de gauche à droite). Trop d'index ralentit les écritures et gaspille de l'espace.</div>`,
  exercises: [
    { type: "qcm", q: "Ajouter une colonne :", opts: ["ALTER TABLE JEU ADD COLUMN col TYPE", "ADD col", "NEW COLUMN", "INSERT COLUMN"], a: 0, exp: "ALTER TABLE ... ADD COLUMN." },
    { type: "qcm", q: "Changer le type d'une colonne en MySQL :", opts: ["ALTER COLUMN", "MODIFY COLUMN", "SET TYPE", "RETYPE"], a: 1, exp: "MODIFY (pas ALTER COLUMN)." },
    { type: "qcm", q: "Renommer une colonne :", opts: ["RENAME", "CHANGE COLUMN ancien nouveau TYPE", "MODIFY", "ALTER NAME"], a: 1, exp: "CHANGE COLUMN." },
    { type: "qcm", q: "Une vue est…", opts: ["Une copie des données", "Une requête enregistrée, manipulée comme une table", "Un index", "Une contrainte"], a: 1, exp: "Table virtuelle." },
    { type: "qcm", q: "Créer une vue :", opts: ["CREATE VIEW nom AS SELECT ...", "NEW VIEW", "MAKE VIEW", "DECLARE VIEW"], a: 0, exp: "CREATE VIEW." },
    { type: "qcm", q: "Une vue duplique-t-elle les données ?", opts: ["Oui", "Non, elle lit les tables réelles", "Parfois", "Toujours"], a: 1, exp: "Pas de duplication." },
    { type: "qcm", q: "Un index sert à…", opts: ["Stocker des doublons", "Accélérer WHERE, JOIN, ORDER BY", "Trier l'affichage final", "Supprimer"], a: 1, exp: "Recherche rapide." },
    { type: "qcm", q: "Le plan d'exécution s'affiche avec…", opts: ["SHOW PLAN", "EXPLAIN", "ANALYZE ONLY", "DESCRIBE"], a: 1, exp: "EXPLAIN." },
    { type: "qcm", q: "Un index composite (a, b) sert les recherches sur…", opts: ["b seul", "a, ou a et b", "rien", "toutes les colonnes"], a: 1, exp: "Préfixe gauche." },
    { type: "qcm", q: "Le coût d'un index :", opts: ["Aucun", "Un léger surcoût en écriture et en espace", "Il casse les requêtes", "Il duplique la table"], a: 1, exp: "Compromis." },
    { type: "vf", q: "Trop d'index ralentit les écritures.", a: true, exp: "Indexer avec parcimonie." },
    { type: "qcm", q: "Supprimer une colonne…", opts: ["Ne change rien", "Détruit ses données", "Trie", "Crée un index"], a: 1, exp: "À manier avec soin." },
    { type: "vf", q: "Une vue s'interroge avec SELECT comme une table.", a: true, exp: "SELECT * FROM v_..." },
    { type: "qcm", q: "Dans EXPLAIN, la colonne qui indique l'index utilisé :", opts: ["rows", "key", "type", "id"], a: 1, exp: "key." },
    { type: "qcm", q: "Un index UNIQUE…", opts: ["Autorise les doublons", "Interdit les doublons ET accélère", "Trie", "Supprime"], a: 1, exp: "Unicité + rapidité." }
  ],
  final: {
    title: "Exercice final — Simplifier et accélérer",
    intro: `<p>On veut une vue des jeux louables et un index de recherche.</p>`,
    questions: [
      { type: "qcm", q: "Vue des jeux disponibles à la location :", opts: ["CREATE VIEW v_dispo AS SELECT ... WHERE stockLocation > 0", "CREATE INDEX", "ALTER TABLE", "NEW VIEW"], a: 0, exp: "CREATE VIEW." },
      { type: "qcm", q: "L'interroger :", opts: ["EXEC v_dispo", "SELECT * FROM v_dispo", "CALL v_dispo", "RUN"], a: 1, exp: "Comme une table." },
      { type: "qcm", q: "Accélérer la recherche par titre :", opts: ["CREATE INDEX idx_titre ON JEU(titre)", "CREATE VIEW", "ALTER titre", "CHECK titre"], a: 0, exp: "Index." },
      { type: "qcm", q: "Ajouter une colonne dateAjout :", opts: ["ALTER TABLE JEU ADD COLUMN dateAjout DATE", "MODIFY", "NEW COLUMN", "INSERT COLUMN"], a: 0, exp: "ADD COLUMN." },
      { type: "vf", q: "EXPLAIN permet de vérifier qu'une requête utilise bien un index.", a: true, exp: "Plan d'exécution." }
    ],
    solution: `<pre class="pseudo">CREATE VIEW v_JeuxDisponibles AS   -- enregistre la requête sous ce nom
SELECT j.titre, c.libelle, j.prixLocation
FROM JEU j JOIN CATEGORIE c ON j.idCategorie = c.idCategorie
WHERE j.stockLocation &gt; 0;         -- seulement les jeux encore louables

CREATE INDEX idx_titre ON JEU(titre);  -- index pour accélérer les recherches par titre

EXPLAIN SELECT * FROM JEU WHERE titre = 'Catan';  -- vérifie que la recherche utilise bien l'index (colonne key)</pre>
<p>Ton schéma évolue et tes requêtes accélèrent. Demain : les transactions.</p>`
  }
};
</script>
