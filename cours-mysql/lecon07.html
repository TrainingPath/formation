<script>
var DAY = {
  num: 7,
  title: "Fonctions MySQL : chaînes, dates, IFNULL",
  subtitle: "Transformer et calculer les valeurs à la volée.",
  theory: `
<h3>1. C'est quoi une « fonction » ?</h3>
<p>Une <strong>fonction</strong> en SQL est un petit outil tout prêt qui prend une ou plusieurs valeurs entre parenthèses (ses <strong>arguments</strong>) et renvoie un résultat. On l'utilise dans un <code>SELECT</code> pour <strong>transformer</strong> les données au moment de l'affichage, sans modifier la table. Par exemple <code>UPPER(titre)</code> prend le titre et renvoie sa version en majuscules. On distingue surtout les fonctions de <strong>chaînes</strong> (texte), de <strong>dates</strong>, et celles qui gèrent le <strong>NULL</strong>.</p>

<h3>2. Fonctions de chaînes (texte)</h3>
<p>Elles manipulent du texte. À gauche l'appel, à droite ce qu'il fait :</p>
<pre class="pseudo">CHAR_LENGTH(s)     -- renvoie le NOMBRE de caractères de la chaîne s (en MySQL ; l'équivalent du LEN de SQL Server)
UPPER(s) LOWER(s)  -- change la CASSE : UPPER met tout en MAJUSCULES, LOWER tout en minuscules
LEFT(s,n) RIGHT(s,n)   -- extrait les n premiers caractères (LEFT) ou les n derniers (RIGHT) de s
SUBSTRING(s,d,n)   -- extrait n caractères de s À PARTIR de la position d (les positions commencent à 1)
TRIM(s)            -- enlève les espaces inutiles au DÉBUT et à la FIN de s
REPLACE(s,a,b)     -- dans s, remplace chaque occurrence du texte a par le texte b
CONCAT(a,b,...)    -- colle bout à bout tous les arguments (la concaténation vue en leçon 4)</pre>

<h3>3. Fonctions de dates</h3>
<p>Elles servent à obtenir la date/heure actuelle, à calculer des durées ou à mettre en forme une date :</p>
<pre class="pseudo">NOW()                       -- renvoie la date ET l'heure actuelles (ex. 2026-07-13 14:30:00)
CURDATE()                   -- renvoie seulement la date du jour, sans l'heure (ex. 2026-07-13)
DATE_ADD(d, INTERVAL 7 DAY) -- ajoute une durée à la date d : ici 7 jours (INTERVAL … DAY = "un intervalle de … jours")
DATEDIFF(d1, d2)            -- renvoie l'ÉCART en nombre de jours entre les dates d1 et d2
YEAR(d) MONTH(d) DAY(d)     -- extraient une PARTIE de la date d : l'année, le mois, le jour
DATE_FORMAT(d, '%d/%m/%Y')  -- met la date d en forme selon un modèle : ici jour/mois/année (%d=jour, %m=mois, %Y=année sur 4 chiffres)</pre>
<pre class="pseudo">-- date de retour prévue d'une location
SELECT DATE_ADD(dateDebut, INTERVAL nbJours DAY) AS retour FROM LOUER;  -- pour chaque location, calcule dateDebut + nbJours jours, résultat nommé "retour"</pre>

<h3>4. Gérer les NULL : IFNULL et COALESCE</h3>
<p>Rappel : <code>NULL</code> est l'absence de valeur (« non renseigné »). Souvent on veut afficher un texte de remplacement à la place d'un vide. Deux fonctions pour cela :</p>
<pre class="pseudo">IFNULL(x, y)       -- si x est NULL, renvoie y (la valeur de secours) ; sinon renvoie x. Prend 2 arguments, propre à MySQL
COALESCE(a, b, c)  -- renvoie le PREMIER argument non-NULL de la liste (standard SQL, accepte plusieurs valeurs de secours)</pre>
<pre class="pseudo">SELECT IFNULL(telephone, 'non renseigné') FROM FOURNISSEUR;  -- affiche le téléphone, ou le texte "non renseigné" quand la case est vide (NULL)</pre>

<h3>5. Conditionnel : IF et CASE</h3>
<p>Pour afficher une valeur différente SELON une condition (comme un « si… alors… sinon… »), MySQL propose <code>IF</code> (raccourci) et <code>CASE</code> (forme standard, plus riche) :</p>
<pre class="pseudo">-- IF de ligne, propre à MySQL
SELECT titre, IF(stockLocation &gt; 0, 'dispo', 'épuisé') AS etat FROM JEU;  -- IF(condition, valeurSiVrai, valeurSiFaux) : si le stock est &gt; 0 affiche 'dispo', sinon 'épuisé'

-- CASE, standard
SELECT titre,
  CASE WHEN stockLocation &gt; 0 THEN 'dispo' ELSE 'épuisé' END AS etat  -- CASE WHEN condition THEN résultat ELSE autre END : même logique, écriture standard (extensible à plusieurs WHEN)
FROM JEU;</pre>
<div class="tip"><code>IF(cond, a, b)</code> est le raccourci MySQL (équivalent du <code>IIF</code> de SQL Server) ; <code>CASE</code> est l'expression conditionnelle standard, plus riche quand il y a plusieurs cas à distinguer.</div>

<h3>6. Conversion : CAST</h3>
<p><strong>Convertir</strong>, c'est changer le TYPE d'une valeur (par exemple transformer un nombre en texte). La fonction <code>CAST</code> fait cela : <code>CAST(valeur AS type)</code>.</p>
<pre class="pseudo">CAST(prixLocation AS DECIMAL(6,2))  -- convertit prixLocation en nombre décimal à 2 chiffres après la virgule
CAST(idJeu AS CHAR)      -- convertit le nombre idJeu en TEXTE. En MySQL on cible CHAR (et non VARCHAR) pour ce genre de conversion</pre>`,
  exercises: [
    { type: "qcm", q: "La longueur d'un titre :", opts: ["LEN(titre)", "CHAR_LENGTH(titre)", "SIZE(titre)", "COUNT(titre)"], a: 1, exp: "CHAR_LENGTH (LEN n'existe pas en MySQL)." },
    { type: "qcm", q: "Mettre en majuscules :", opts: ["UPPER(titre)", "MAJ(titre)", "CAPS(titre)", "BIG(titre)"], a: 0, exp: "UPPER." },
    { type: "qcm", q: "La date et l'heure courantes :", opts: ["GETDATE()", "NOW()", "TODAY()", "SYSDATE"], a: 1, exp: "NOW() (GETDATE = SQL Server)." },
    { type: "qcm", q: "La date du jour seule :", opts: ["CURDATE()", "NOW()", "DATE()", "TODAY"], a: 0, exp: "CURDATE()." },
    { type: "qcm", q: "Ajouter 7 jours :", opts: ["DATEADD(day, 7, d)", "DATE_ADD(d, INTERVAL 7 DAY)", "d + 7", "ADD 7 d"], a: 1, exp: "DATE_ADD ... INTERVAL." },
    { type: "qcm", q: "Écart en jours entre deux dates :", opts: ["DATEDIFF(d1, d2)", "DIFF(d1,d2)", "d1 - d2", "SUB()"], a: 0, exp: "DATEDIFF." },
    { type: "qcm", q: "Remplacer un NULL (2 arguments) :", opts: ["ISNULL(x,y)", "IFNULL(x, y)", "NVL(x,y)", "NULLIF"], a: 1, exp: "IFNULL en MySQL." },
    { type: "qcm", q: "COALESCE(a, b, c) renvoie…", opts: ["a toujours", "Le premier non-NULL", "La somme", "NULL"], a: 1, exp: "Premier non nul." },
    { type: "qcm", q: "Le raccourci conditionnel MySQL :", opts: ["IIF(cond, a, b)", "IF(cond, a, b)", "WHEN", "TEST"], a: 1, exp: "IF de ligne." },
    { type: "qcm", q: "Formater une date jj/mm/aaaa :", opts: ["CONVERT(103)", "DATE_FORMAT(d, '%d/%m/%Y')", "FORMAT(d)", "TO_CHAR"], a: 1, exp: "DATE_FORMAT." },
    { type: "vf", q: "CHAR_LENGTH remplace le LEN de SQL Server en MySQL.", a: true, exp: "Dialecte MySQL." },
    { type: "qcm", q: "Convertir en texte en MySQL :", opts: ["CAST(x AS VARCHAR)", "CAST(x AS CHAR)", "TO_TEXT(x)", "STR(x)"], a: 1, exp: "CAST(... AS CHAR)." },
    { type: "vf", q: "IF(stock > 0, 'dispo', 'épuisé') est l'équivalent MySQL du IIF de T-SQL.", a: true, exp: "Conditionnel à deux issues." },
    { type: "qcm", q: "Date de retour = début + durée :", opts: ["dateDebut + nbJours", "DATE_ADD(dateDebut, INTERVAL nbJours DAY)", "nbJours + NOW()", "DATEDIFF"], a: 1, exp: "DATE_ADD." },
    { type: "qcm", q: "Extraire l'année d'une date :", opts: ["YEAR(d)", "GETYEAR(d)", "d.year", "PART('year', d)"], a: 0, exp: "YEAR()." }
  ],
  final: {
    title: "Exercice final — Fonctions à l'œuvre",
    intro: `<p>Tables JEU(idJeu, titre, prixLocation, stockLocation) et LOUER(idJeu, dateDebut, nbJours).</p>`,
    questions: [
      { type: "qcm", q: "Titre en majuscules + longueur :", opts: ["UPPER(titre), CHAR_LENGTH(titre)", "MAJ(titre), LEN(titre)", "BIG, SIZE", "CAPS, COUNT"], a: 0, exp: "UPPER et CHAR_LENGTH." },
      { type: "qcm", q: "État « dispo »/« épuisé » :", opts: ["IF(stockLocation > 0, 'dispo', 'épuisé')", "STOCK()", "WHERE stock", "IIF()"], a: 0, exp: "IF de ligne MySQL." },
      { type: "qcm", q: "Date de retour d'une location :", opts: ["dateDebut + nbJours", "DATE_ADD(dateDebut, INTERVAL nbJours DAY)", "DATEDIFF", "NOW(nbJours)"], a: 1, exp: "DATE_ADD." },
      { type: "qcm", q: "Remplacer un téléphone NULL par « - » :", opts: ["IFNULL(telephone, '-')", "telephone = '-'", "ISNULL()", "NVL"], a: 0, exp: "IFNULL." },
      { type: "vf", q: "DATE_ADD avec INTERVAL est la façon MySQL d'ajouter une durée à une date.", a: true, exp: "Syntaxe MySQL." }
    ],
    solution: `<pre class="pseudo">SELECT UPPER(titre)        AS titre_maj,   -- titre en majuscules
       CHAR_LENGTH(titre)  AS longueur,    -- nombre de caractères du titre
       IF(stockLocation &gt; 0, 'dispo', 'épuisé') AS etat  -- état selon le stock : dispo si &gt; 0, sinon épuisé
FROM JEU;

-- date de retour prévue
SELECT idJeu, DATE_ADD(dateDebut, INTERVAL nbJours DAY) AS retour  -- pour chaque location, date de début + durée = date de retour
FROM LOUER;</pre>
<p>Tu transformes les données à la volée. Demain : agrégats et regroupements.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta requête avec fonctions MySQL…",
  items: [
  { id: "mysql-l7", title: "Fiche enrichie d'un jeu", level: 3,
    statement: "À partir de JEU(idJeu, titre, prixLocation, stockLocation, idFournisseur), écris une requête affichant : le titre en majuscules, le prix TTC (prixLocation * 1.2), un état 'dispo'/'épuisé' selon le stock de location, et le fournisseur (idFournisseur) ou 'aucun' s'il est NULL.",
    hints: [
      "UPPER(titre) ; ROUND(prixLocation * 1.2, 2) pour le TTC.",
      "IF(stockLocation > 0, 'dispo', 'épuisé').",
      "IFNULL(idFournisseur, 'aucun')."
    ],
    solution: "SELECT UPPER(titre) AS titre,\n       ROUND(prixLocation * 1.2, 2) AS ttc,\n       IF(stockLocation > 0, 'dispo', 'épuisé') AS etat,\n       IFNULL(idFournisseur, 'aucun') AS fournisseur\nFROM JEU;",
    note: "Une seule requête mobilise plusieurs fonctions MySQL : UPPER (chaîne), ROUND (arrondi), IF (conditionnel de ligne), IFNULL (gestion du NULL). C'est le quotidien du développeur MySQL pour produire des affichages propres." }
  ]
};
