<script>
var DAY = {
  num: 6,
  title: "Trier et paginer : ORDER BY, LIMIT / OFFSET",
  subtitle: "Classer les résultats et les découper en pages.",
  theory: `
<h3>1. Trier les résultats : ORDER BY</h3>
<p>Sans consigne, MySQL affiche les lignes dans un ordre quelconque (celui qui l'arrange). Pour les <strong>classer</strong>, on ajoute la clause <code>ORDER BY</code> (« trier par ») suivie de la ou des colonnes qui servent de critère. Chaque critère peut être croissant ou décroissant : <code>ASC</code> (<em>ascending</em>, du plus petit au plus grand — c'est le défaut) ou <code>DESC</code> (<em>descending</em>, du plus grand au plus petit).</p>
<pre class="pseudo">SELECT titre, prixLocation       -- on affiche titre et prix…
FROM JEU
ORDER BY prixLocation DESC, titre ASC;  -- ORDER BY = trie le résultat : d'abord par prixLocation du plus cher au moins cher (DESC), et à prix ÉGAL, par titre de A à Z (ASC)</pre>
<p>Quand on donne plusieurs colonnes, la deuxième sert à <strong>départager</strong> les lignes qui ont la même valeur sur la première (comme un classement à égalité qu'on tranche avec un second critère).</p>

<h3>2. LIMIT : borner le nombre de lignes</h3>
<p>Souvent on ne veut que les premières lignes (« le top 3 des plus chers »). Le mot-clé <code>LIMIT n</code> (« limiter à n ») ne garde que les <strong>n premières</strong> lignes du résultat. C'est la façon MySQL de faire ; SQL Server, lui, utilise le mot <code>TOP</code>. <code>LIMIT</code> se place tout à la fin de la requête.</p>
<pre class="pseudo">SELECT titre FROM JEU ORDER BY prixLocation DESC LIMIT 3;   -- on trie du plus cher au moins cher, puis LIMIT 3 ne garde que les 3 premières lignes = les 3 jeux les plus chers</pre>

<h3>3. La pagination avec OFFSET</h3>
<p>La <strong>pagination</strong> consiste à découper un long résultat en <strong>pages</strong> (comme les pages « 1, 2, 3… » d'un site). Pour afficher la page 2, il faut SAUTER les lignes de la page 1 : c'est le rôle de <code>OFFSET</code> (« décalage »), qui indique combien de lignes ignorer avant de commencer à prendre.</p>
<pre class="pseudo">-- page 1 (10 lignes)
ORDER BY titre LIMIT 10 OFFSET 0;   -- OFFSET 0 = ne saute rien ; LIMIT 10 = prend les 10 premières lignes
-- page 2
ORDER BY titre LIMIT 10 OFFSET 10;  -- OFFSET 10 = saute les 10 premières (la page 1) ; LIMIT 10 = prend les 10 suivantes
-- forme abrégée : LIMIT offset, nombre
ORDER BY titre LIMIT 10, 10;   -- forme courte : le PREMIER nombre (10) est l'OFFSET, le SECOND (10) la quantité → saute 10, prend 10</pre>
<p>Formule générale pour la page <strong>p</strong> avec une taille de page <strong>t</strong> : <code>LIMIT t OFFSET (p-1)*t</code> (page 1 → décalage 0, page 2 → décalage t, page 3 → décalage 2t…).</p>
<div class="warn">Attention à la forme abrégée <code>LIMIT 10, 10</code> : le PREMIER nombre est l'OFFSET, le SECOND la quantité. C'est l'inverse de l'intuition — beaucoup s'y trompent.</div>

<h3>4. Trier sur un alias</h3>
<p>Bonne surprise : MySQL accepte de trier sur un <strong>alias</strong> (le surnom de colonne vu en leçon 4), y compris sur une colonne calculée. Pratique pour trier sur un résultat qu'on vient de calculer :</p>
<pre class="pseudo">SELECT titre, prixLocation * 1.2 AS ttc   -- on calcule un prix TTC et on le nomme "ttc"…
FROM JEU
ORDER BY ttc DESC;   -- …puis on trie directement sur cet alias "ttc", du plus grand au plus petit (MySQL l'autorise)</pre>

<h3>5. NULL au tri</h3>
<p>En MySQL, les valeurs <code>NULL</code> (les cases vides) sont considérées comme les <strong>plus petites</strong> de toutes : elles apparaissent donc <strong>en premier</strong> en ordre croissant (ASC) et <strong>en dernier</strong> en ordre décroissant (DESC). Bon à savoir pour ne pas être surpris de voir les lignes vides remonter en tête d'un tri croissant.</p>`,
  exercises: [
    { type: "qcm", q: "Trier décroissant :", opts: ["ORDER BY col UP", "ORDER BY col DESC", "SORT col", "ORDER col -"], a: 1, exp: "DESC." },
    { type: "qcm", q: "Limiter le nombre de lignes en MySQL :", opts: ["TOP n", "LIMIT n", "FETCH n", "ROWNUM n"], a: 1, exp: "LIMIT (pas TOP)." },
    { type: "qcm", q: "LIMIT se place…", opts: ["Après SELECT", "En fin de requête", "Après FROM", "Avant WHERE"], a: 1, exp: "Tout à la fin." },
    { type: "qcm", q: "Page 2 de 10 (forme explicite) :", opts: ["LIMIT 10 OFFSET 10", "LIMIT 20", "OFFSET 10 seul", "TOP 10"], a: 0, exp: "Sauter 10, prendre 10." },
    { type: "qcm", q: "LIMIT 10, 10 signifie…", opts: ["10 pages", "OFFSET 10, prendre 10", "prendre 10, sauter 10", "20 lignes"], a: 1, exp: "1er = offset, 2e = nombre." },
    { type: "qcm", q: "Formule page p, taille t :", opts: ["LIMIT p OFFSET t", "LIMIT t OFFSET (p-1)*t", "TOP p*t", "OFFSET p"], a: 1, exp: "Décalage = (p-1)*t." },
    { type: "qcm", q: "Les 3 jeux les plus chers :", opts: ["LIMIT 3 sans tri", "ORDER BY prixLocation DESC LIMIT 3", "TOP 3", "MAX 3"], a: 1, exp: "Tri + LIMIT." },
    { type: "qcm", q: "Trier sur une colonne calculée :", opts: ["Impossible", "ORDER BY ttc (l'alias)", "Interdit", "Clé seulement"], a: 1, exp: "MySQL accepte l'alias." },
    { type: "qcm", q: "En MySQL, les NULL au tri sont…", opts: ["Les plus grands", "Les plus petits (en premier en ASC)", "Ignorés", "Une erreur"], a: 1, exp: "NULL = plus petit." },
    { type: "qcm", q: "ORDER BY prixLocation DESC, titre trie…", opts: ["Que par prix", "Par prix décroissant, puis titre pour départager", "Au hasard", "Par id"], a: 1, exp: "Tri à deux niveaux." },
    { type: "vf", q: "LIMIT est la façon MySQL de limiter les lignes, là où SQL Server utilise TOP.", a: true, exp: "Dialectes différents." },
    { type: "qcm", q: "Sans ORDER BY, la pagination…", opts: ["Est fiable", "N'a pas de sens (ordre non garanti)", "Trie par clé", "Est plus rapide"], a: 1, exp: "Toujours trier pour paginer." },
    { type: "vf", q: "Dans LIMIT 5, 10, le 5 est l'OFFSET et 10 la quantité.", a: true, exp: "Forme abrégée trompeuse." },
    { type: "qcm", q: "Les 5 premiers jeux triés par titre :", opts: ["LIMIT 5", "ORDER BY titre LIMIT 5", "TOP 5", "FETCH 5"], a: 1, exp: "Tri + LIMIT." },
    { type: "qcm", q: "La 3e page de 5 jeux :", opts: ["LIMIT 5 OFFSET 15", "LIMIT 5 OFFSET 10", "LIMIT 15", "OFFSET 5"], a: 1, exp: "(3-1)*5 = 10." }
  ],
  final: {
    title: "Exercice final — Paginer le catalogue",
    intro: `<p>Table JEU(idJeu, titre, prixLocation).</p>`,
    questions: [
      { type: "qcm", q: "Trier par prix décroissant :", opts: ["ORDER BY prixLocation", "ORDER BY prixLocation DESC", "TOP prix", "SORT prix"], a: 1, exp: "DESC." },
      { type: "qcm", q: "Les 5 premiers (par titre) :", opts: ["ORDER BY titre LIMIT 5", "LIMIT 5 sans tri", "TOP 5", "FETCH 5"], a: 0, exp: "Tri + LIMIT." },
      { type: "qcm", q: "La 3e page de 5 jeux :", opts: ["LIMIT 5 OFFSET 15", "LIMIT 5 OFFSET 10", "LIMIT 15", "OFFSET 5"], a: 1, exp: "(3-1)*5." },
      { type: "qcm", q: "Forme abrégée équivalente à LIMIT 5 OFFSET 10 :", opts: ["LIMIT 5, 10", "LIMIT 10, 5", "LIMIT 10 5", "OFFSET 10 LIMIT 5"], a: 1, exp: "LIMIT offset, nombre." },
      { type: "vf", q: "Paginer exige un ORDER BY pour que les pages soient stables.", a: true, exp: "Ordre garanti." }
    ],
    solution: `<pre class="pseudo">SELECT titre, prixLocation FROM JEU ORDER BY prixLocation DESC;  -- catalogue trié du plus cher au moins cher

-- 3e page de 5 jeux (triée par titre)
SELECT titre, prixLocation
FROM JEU
ORDER BY titre           -- tri obligatoire pour que "page" ait un sens
LIMIT 5 OFFSET 10;   -- saute 10 lignes (pages 1 et 2), prend 5 lignes (page 3) ; équivaut à LIMIT 10, 5</pre>
<p>Tu paginate proprement. Demain : les fonctions MySQL.</p>`
  }
};

    statement: "À partir de JEU(idJeu, titre, prixLocation, stockLocation), écris une requête affichant la 2e page de 4 jeux DISPONIBLES à la location (stock positif), triés par prix de location croissant. Utilise LIMIT et OFFSET.",
    hints: [
      "Filtre : WHERE stockLocation > 0.",
      "Tri : ORDER BY prixLocation.",
      "Page 2 de 4 : LIMIT 4 OFFSET 4 (ou LIMIT 4, 4)."

    note: "LIMIT t OFFSET (p-1)*t saute les pages précédentes et prend la page voulue. Un ORDER BY est obligatoire pour que la notion de « page » soit stable. La forme abrégée LIMIT 4, 4 est équivalente, mais le premier nombre y est l'offset." }
  ]
