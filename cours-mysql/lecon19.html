  title: "Les déclencheurs (TRIGGER)",
  subtitle: "Réagir automatiquement à une modification des données.",
  theory: `
<h3>1. Qu'est-ce qu'un trigger ?</h3>
<p>Un <strong>déclencheur</strong> (en anglais <strong>trigger</strong>, « gâchette ») est un bloc de code qui s'exécute <strong>tout seul, automatiquement</strong>, quand un événement précis survient sur une table : un <code>INSERT</code>, un <code>UPDATE</code> ou un <code>DELETE</code>. Contrairement à une procédure (leçon 18), on ne l'appelle JAMAIS avec <code>CALL</code> : il se déclenche de lui-même dès que l'événement se produit, comme une alarme qui sonne automatiquement quand on ouvre une porte. On s'en sert pour réagir à un changement (tenir un journal, mettre à jour un total, vérifier une valeur…).</p>

<h3>2. NEW et OLD</h3>
<p>Dans un trigger, on a besoin de connaître la ligne concernée. MySQL fournit deux mots spéciaux : <code>NEW</code> pour la nouvelle version d'une ligne, <code>OLD</code> pour l'ancienne.</p>
<pre class="pseudo">NEW.colonne   -- la NOUVELLE valeur de la colonne (disponible lors d'un INSERT ou d'un UPDATE)
OLD.colonne   -- l'ANCIENNE valeur de la colonne (disponible lors d'un DELETE ou d'un UPDATE)</pre>
<p>MySQL traite les triggers <strong>ligne par ligne</strong> : le mot-clé <code>FOR EACH ROW</code> (« pour chaque ligne ») le précise, et <code>NEW</code>/<code>OLD</code> désignent la ligne en cours de traitement.</p>

<h3>3. Un trigger AFTER INSERT (journalisation)</h3>
<p><strong>Journaliser</strong>, c'est garder une trace écrite de ce qui se passe. Ce trigger écrit une ligne dans une table JOURNAL après CHAQUE nouvelle location, automatiquement :</p>
<pre class="pseudo">DELIMITER $$                              -- on change le délimiteur (le corps contient des ;)
CREATE TRIGGER trg_louer_log             -- CREATE TRIGGER = crée un déclencheur nommé trg_louer_log
AFTER INSERT ON LOUER                     -- AFTER INSERT ON LOUER = à exécuter APRÈS chaque insertion dans la table LOUER
FOR EACH ROW                              -- FOR EACH ROW = une exécution PAR ligne insérée
BEGIN
    INSERT INTO JOURNAL (action, idJeu, quand)   -- on ajoute une trace dans la table JOURNAL…
    VALUES ('location', NEW.idJeu, NOW());       -- …avec le texte 'location', l'idJeu de la ligne insérée (NEW.idJeu) et l'instant présent (NOW())
END$$
DELIMITER ;                               -- on rétablit le délimiteur normal</pre>

<h3>4. Maintenir une cohérence (décrémenter le stock)</h3>
<p>Un trigger peut aussi mettre à jour une autre table pour garder les données cohérentes. Ici, dès qu'une location est enregistrée, le stock du jeu baisse automatiquement de 1 :</p>
<pre class="pseudo">DELIMITER $$
CREATE TRIGGER trg_louer_stock
AFTER INSERT ON LOUER                     -- se déclenche après une insertion dans LOUER
FOR EACH ROW
BEGIN
    UPDATE JEU SET stockLocation = stockLocation - 1  -- diminue le stock de location de 1…
    WHERE idJeu = NEW.idJeu;              -- …pour le jeu concerné par la location (NEW.idJeu)
END$$
DELIMITER ;</pre>
<div class="tip">Contrairement à SQL Server (qui expose des tables <code>inserted</code>/<code>deleted</code> pour tout un lot), MySQL travaille <strong>ligne par ligne</strong> avec <code>NEW</code>/<code>OLD</code> et <code>FOR EACH ROW</code> : c'est plus simple à raisonner.</div>

<h3>5. BEFORE, et suppression</h3>
<p>Un trigger peut aussi agir AVANT l'écriture (<code>BEFORE</code>) pour corriger ou valider la donnée. Ici, il nettoie les espaces autour du titre avant l'enregistrement :</p>
<pre class="pseudo">-- BEFORE INSERT : valider/corriger AVANT l'écriture
CREATE TRIGGER trg_check BEFORE INSERT ON JEU FOR EACH ROW  -- BEFORE INSERT = juste AVANT d'insérer dans JEU
  SET NEW.titre = TRIM(NEW.titre);        -- SET NEW.titre = … modifie la valeur qui sera enregistrée ; TRIM enlève les espaces autour du titre

DROP TRIGGER IF EXISTS trg_louer_log;   -- DROP TRIGGER = supprime le déclencheur ; IF EXISTS = seulement s'il existe (pas d'erreur sinon)</pre>
<p>Un trigger <code>BEFORE</code> peut MODIFIER <code>NEW</code> avant l'enregistrement (corriger la donnée). Un trigger <code>AFTER</code> agit une fois la ligne déjà écrite (réagir à l'événement).</p>`,

  ],

      { type: "vf", q: "Un trigger AFTER INSERT s'exécute sans qu'on l'appelle explicitement.", a: true, exp: "Automatique." }

END$$

<p>Ta base réagit toute seule. Demain : le projet guidé, la Ludothèque en MySQL.</p>`
