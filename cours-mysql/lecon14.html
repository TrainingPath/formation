var DAY = {
  num: 14,
  title: "Modifier et supprimer : UPDATE, DELETE",
  subtitle: "Changer et retirer des données — avec prudence.",
  theory: `
<h3>1. Modifier des lignes : UPDATE</h3>
<p>On sait créer (INSERT) et lire (SELECT) ; il faut aussi pouvoir CHANGER des données existantes. La commande <code>UPDATE</code> (« mettre à jour ») modifie une ou plusieurs colonnes de lignes déjà présentes. Sa structure : <code>UPDATE</code> la table, <code>SET</code> (« mettre à ») les nouvelles valeurs, et surtout <code>WHERE</code> pour dire QUELLES lignes changer.</p>
<pre class="pseudo">UPDATE JEU                          -- UPDATE JEU = on va modifier des lignes de la table JEU
SET prixLocation = prixLocation * 1.10  -- SET = nouvelle valeur : le prix actuel multiplié par 1,10 (une hausse de 10 %)
WHERE idJeu = 1;                    -- WHERE = uniquement pour le jeu dont l'idJeu vaut 1 (les autres ne bougent pas)</pre>
<p>Seules les lignes qui satisfont le <code>WHERE</code> sont modifiées. Remarque : <code>SET prixLocation = prixLocation * 1.10</code> utilise l'ancienne valeur pour calculer la nouvelle.</p>

<h3>2. Supprimer des lignes : DELETE</h3>
<p>La commande <code>DELETE</code> (« supprimer ») retire des lignes de la table. Là aussi, le <code>WHERE</code> précise lesquelles :</p>
<pre class="pseudo">DELETE FROM JEU WHERE idJeu = 3;   -- DELETE FROM JEU = supprime des lignes de JEU ; WHERE idJeu = 3 = seulement la ligne du jeu n°3</pre>
<div class="warn">Le <code>WHERE</code> est VITAL : <code>UPDATE JEU SET prixLocation = 0;</code> ou <code>DELETE FROM JEU;</code> SANS WHERE affectent TOUTES les lignes de la table ! MySQL Workbench a un mode « safe updates » qui refuse un UPDATE/DELETE sans condition sur une clé — garde-le activé pour éviter la catastrophe.</div>

<h3>3. Mettre à jour plusieurs colonnes</h3>
<p>Un seul <code>UPDATE</code> peut changer plusieurs colonnes à la fois : on sépare les affectations par des virgules après <code>SET</code>.</p>
<pre class="pseudo">UPDATE JEU
SET prixLocation = 4.50, stockLocation = stockLocation + 2  -- deux modifications d'un coup : fixer le prix à 4.50 ET ajouter 2 au stock actuel
WHERE idJeu = 1;                    -- toujours ciblé sur le jeu 1</pre>

<h3>4. UPDATE / DELETE avec LIMIT et ORDER BY</h3>
<p>MySQL permet d'ajouter <code>ORDER BY</code> et <code>LIMIT</code> (leçon 6) à un UPDATE/DELETE, pour ne toucher qu'un nombre limité de lignes, choisies selon un tri :</p>
<pre class="pseudo">-- ne modifier qu'une ligne, la plus ancienne
UPDATE LOUER SET rendu = 1 ORDER BY dateDebut LIMIT 1;  -- ORDER BY dateDebut = trie par date ; LIMIT 1 = ne modifie QUE la première (la location la plus ancienne)</pre>

<h3>5. TRUNCATE vs DELETE</h3>
<p>Pour VIDER complètement une table, deux options aux comportements différents :</p>
<pre class="pseudo">DELETE FROM LOUER;      -- supprime les lignes UNE PAR UNE ; opération journalisée, donc annulable par ROLLBACK (voir leçon transactions)
TRUNCATE TABLE LOUER;   -- vide la table d'un seul coup et remet le compteur AUTO_INCREMENT à 1 ; plus rapide, mais NON annulable</pre>
<div class="tip"><code>TRUNCATE</code> vide entièrement une table plus vite que <code>DELETE</code> et réinitialise le compteur AUTO_INCREMENT, mais il ne peut PAS être annulé par ROLLBACK et ignore le WHERE (tout ou rien). <code>DELETE</code> est plus souple et réversible.</div>`,
  exercises: [
    { type: "qcm", q: "UPDATE sert à…", opts: ["Supprimer", "Modifier des lignes existantes", "Créer", "Trier"], a: 1, exp: "Modification." },
    { type: "qcm", q: "DELETE sert à…", opts: ["Modifier", "Supprimer des lignes", "Créer", "Compter"], a: 1, exp: "Suppression." },
    { type: "qcm", q: "Sans WHERE, un UPDATE…", opts: ["Ne fait rien", "Modifie TOUTES les lignes", "Erreur systématique", "N'affecte que la première ligne"], a: 1, exp: "Danger !" },
    { type: "qcm", q: "Augmenter le prix du jeu 1 de 10 % :", opts: ["UPDATE JEU SET prixLocation = prixLocation * 1.10 WHERE idJeu = 1", "SET prix +10%", "ALTER prix", "DELETE prix"], a: 0, exp: "UPDATE ... SET ... WHERE." },
    { type: "qcm", q: "Supprimer le jeu 3 :", opts: ["DELETE FROM JEU WHERE idJeu = 3", "DROP JEU 3", "REMOVE 3", "UPDATE JEU"], a: 0, exp: "DELETE ... WHERE." },
    { type: "qcm", q: "Le mode « safe updates » de Workbench…", opts: ["Accélère", "Refuse un UPDATE/DELETE sans clause sur une clé", "Trie", "Chiffre"], a: 1, exp: "Sécurité." },
    { type: "qcm", q: "Modifier deux colonnes en une fois :", opts: ["Deux UPDATE", "SET col1 = ..., col2 = ...", "Impossible", "ALTER"], a: 1, exp: "SET séparé par des virgules." },
    { type: "qcm", q: "TRUNCATE TABLE …", opts: ["Modifie une ligne", "Vide toute la table et réinitialise AUTO_INCREMENT", "Trie", "Ajoute"], a: 1, exp: "Vidage rapide." },
    { type: "qcm", q: "TRUNCATE peut-il être annulé par ROLLBACK ?", opts: ["Oui", "Non", "Toujours", "Selon le moteur"], a: 1, exp: "Non annulable." },
    { type: "qcm", q: "MySQL autorise sur UPDATE/DELETE…", opts: ["GROUP BY", "ORDER BY + LIMIT", "HAVING", "JOIN obligatoire"], a: 1, exp: "Limiter les lignes touchées." },
    { type: "vf", q: "DELETE FROM table sans WHERE supprime toutes les lignes.", a: true, exp: "Prudence." },
    { type: "qcm", q: "stockLocation = stockLocation + 2 …", opts: ["Fixe à 2", "Ajoute 2 à la valeur actuelle", "Supprime", "Trie"], a: 1, exp: "Incrément relatif." },
    { type: "vf", q: "TRUNCATE est plus rapide que DELETE pour vider une table.", a: true, exp: "Opération globale." },
    { type: "qcm", q: "Ne modifier qu'une ligne, la plus ancienne :", opts: ["UPDATE ... ORDER BY dateDebut LIMIT 1", "UPDATE ... TOP 1", "UPDATE ... FIRST", "impossible"], a: 0, exp: "ORDER BY + LIMIT." },
    { type: "qcm", q: "DELETE peut être annulé par ROLLBACK (InnoDB) car…", opts: ["Il est global", "Il s'exécute ligne par ligne dans une transaction", "Il est plus lent toujours", "Il ignore le WHERE"], a: 1, exp: "Journalisé, réversible." }
  ],
  final: {
    title: "Exercice final — Corriger le catalogue",
    intro: `<p>Table JEU(idJeu, titre, prixLocation, stockLocation).</p>`,
    questions: [
      { type: "qcm", q: "Passer le prix du jeu 2 à 4.50 :", opts: ["UPDATE JEU SET prixLocation = 4.50 WHERE idJeu = 2", "SET prix 4.50", "ALTER prix", "DELETE"], a: 0, exp: "UPDATE ciblé." },
      { type: "qcm", q: "Ajouter 3 au stock du jeu 1 :", opts: ["SET stockLocation = 3", "SET stockLocation = stockLocation + 3 WHERE idJeu = 1", "ADD 3", "INSERT 3"], a: 1, exp: "Incrément relatif." },
      { type: "qcm", q: "Supprimer les jeux sans stock :", opts: ["DELETE FROM JEU WHERE stockLocation = 0 AND stockVente = 0", "DROP JEU", "TRUNCATE", "REMOVE 0"], a: 0, exp: "DELETE conditionnel." },
      { type: "qcm", q: "Vider entièrement LOUER et remettre le compteur à 1 :", opts: ["DELETE FROM LOUER", "TRUNCATE TABLE LOUER", "DROP LOUER", "UPDATE LOUER"], a: 1, exp: "TRUNCATE." },
      { type: "vf", q: "Oublier le WHERE dans un UPDATE peut corrompre toute la table.", a: true, exp: "Toujours cibler." }
    ],
    solution: `<pre class="pseudo">UPDATE JEU SET prixLocation = 4.50 WHERE idJeu = 2;  -- fixe le prix du jeu 2 à 4.50

UPDATE JEU
SET stockLocation = stockLocation + 3   -- ajoute 3 au stock actuel…
WHERE idJeu = 1;                         -- …du jeu 1 uniquement

DELETE FROM JEU WHERE stockLocation = 0 AND stockVente = 0;  -- supprime les jeux totalement épuisés (aucun stock)</pre>
<p>Tu corriges les données en sécurité. Demain : contraintes, clés et moteurs.</p>`
  }
};
