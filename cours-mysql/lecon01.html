<script>
var DAY = {
  num: 1,
  title: "MySQL, MariaDB et l'écosystème",
  subtitle: "Découvrir le SGBD open source le plus déployé au monde.",
  theory: `
<h3>1. D'abord : qu'est-ce qu'une base de données ?</h3>
<p>Avant même de parler de MySQL, il faut comprendre l'expression <strong>base de données</strong>. Une <strong>base de données</strong>, c'est simplement un <strong>ensemble d'informations rangées de façon organisée</strong> pour qu'on puisse les retrouver et les modifier facilement. Imagine un immense <strong>classeur</strong> avec plein de fiches bien triées, ou le <strong>carnet d'adresses</strong> de ton téléphone où chaque contact a un nom, un numéro, un e-mail. C'est ça, une base de données : des données (des « faits » : des noms, des prix, des dates…) et une organisation pour ne pas s'y perdre.</p>
<p>Mais un classeur tout seul ne fait rien : il faut quelqu'un (ou quelque chose) pour y ajouter des fiches, les corriger, les chercher, les protéger. Ce « quelque chose » est un logiciel qu'on appelle un <strong>SGBD</strong> : <strong>S</strong>ystème de <strong>G</strong>estion de <strong>B</strong>ase de <strong>D</strong>onnées. Pense à un <strong>bibliothécaire</strong> qui connaît l'emplacement exact de chaque livre et va te le chercher en un instant : le SGBD est le bibliothécaire, la base de données est la bibliothèque. Quand ce logiciel range les informations sous forme de <strong>tableaux</strong> (des lignes et des colonnes, exactement comme dans un tableur type Excel), on précise qu'il est <strong>relationnel</strong>, d'où le sigle <strong>SGBDR</strong> (le « R » = relationnel).</p>

<h3>2. Alors, qu'est-ce que MySQL ?</h3>
<p><strong>MySQL</strong> est l'un de ces SGBDR : un logiciel qui gère des bases de données organisées en tableaux. Il est <strong>open source</strong>, ce qui veut dire que son <strong>code source</strong> (le texte du programme, écrit par les développeurs) est <strong>public et modifiable librement</strong> — n'importe qui peut le lire, l'améliorer, le réutiliser, gratuitement. MySQL a été créé en 1995 et appartient aujourd'hui à l'entreprise <strong>Oracle</strong>. Il est extrêmement répandu : il fait tourner une énorme partie des sites web de la planète. C'est d'ailleurs le « M » de la pile <strong>LAMP</strong> (<strong>L</strong>inux, <strong>A</strong>pache, <strong>M</strong>ySQL, <strong>P</strong>HP) — une « pile » (stack en anglais) étant simplement la combinaison de logiciels qu'on empile pour héberger un site web complet.</p>

<h3>3. MySQL et MariaDB : deux jumeaux</h3>
<p>Tu entendras souvent parler de <strong>MariaDB</strong> à côté de MySQL. Un <strong>fork</strong> (mot anglais qui veut dire « fourchette », « embranchement ») désigne en informatique une <strong>copie d'un logiciel qui part vivre sa propre vie</strong>, développée par une autre équipe. MariaDB est un fork <strong>libre</strong> de MySQL, créé par les auteurs d'origine de MySQL quand Oracle a racheté le projet ; il reste très proche et <strong>compatible</strong>. En clair : presque tout ce que tu apprends ici pour MySQL fonctionne aussi sur MariaDB. On parle aussi de « <strong>dialecte</strong> » MySQL : de même qu'une langue a des accents régionaux, chaque SGBD parle le SQL avec de petites variantes (le T-SQL pour SQL Server, le PL/pgSQL pour PostgreSQL…). Le <strong>SQL</strong> (prononcé « esse-cu-elle » ou « sequel ») est le langage qu'on utilise pour parler à une base de données : donner des ordres comme « montre-moi », « ajoute », « supprime ».</p>

<h3>4. Le vocabulaire de base : table, colonne, ligne</h3>
<p>Puisque tout est rangé en tableaux, voici les trois mots essentiels, avec l'image d'un tableur. Une <strong>table</strong> est UN tableau (par exemple la table JEU qui liste tous les jeux) — c'est comme une feuille de calcul. Une <strong>colonne</strong> est une catégorie d'information, la même pour toutes les fiches (par exemple la colonne « titre », la colonne « prix ») — c'est un intitulé de colonne du tableur. Une <strong>ligne</strong> (aussi appelée <strong>enregistrement</strong>) est UNE fiche complète, un seul élément (par exemple UN jeu précis avec son titre, son prix, sa date). Enfin, le <strong>type</strong> d'une colonne indique la <strong>nature</strong> des valeurs qu'elle contient : du texte, un nombre entier, une date… (on approfondira demain).</p>

<h3>5. Serveur, base et client : qui parle à qui ?</h3>
<p>Le <strong>serveur</strong> MySQL est le programme qui tourne en permanence et qui garde les données ; il peut héberger <strong>plusieurs bases</strong> à la fois, chacune contenant ses propres tables (imagine un immeuble — le serveur — avec plusieurs appartements — les bases). Pour lui donner des ordres, on utilise un <strong>client</strong> : un autre programme qui se connecte au serveur et lui envoie nos commandes. Le client peut être la <strong>console</strong> <code>mysql</code> (une fenêtre où l'on tape des commandes au clavier, en mode texte) ou une <strong>interface graphique</strong> avec des boutons et des menus comme <strong>MySQL Workbench</strong>. Une commande qu'on envoie s'appelle une <strong>requête</strong> (en anglais <em>query</em>) : c'est une demande adressée à la base.</p>
<pre class="pseudo">mysql -u root -p          # commande tapée dans le TERMINAL : lance le client mysql. -u root = se connecter en tant qu'utilisateur "root" (l'administrateur) ; -p = demande le mot de passe
-- une fois connecté, on tape des requêtes SQL, toujours terminées par un point-virgule ;
SHOW DATABASES;           -- SHOW DATABASES = mot-clé MySQL qui affiche la LISTE de toutes les bases présentes sur le serveur
CREATE DATABASE ludotheque;  -- CREATE DATABASE = créer une nouvelle base vide ; ludotheque = le nom qu'on choisit de lui donner
USE ludotheque;           -- USE = CHOISIR la base sur laquelle on va travailler ; toutes les requêtes suivantes viseront celle-ci</pre>

<h3>6. Explorer une base</h3>
<pre class="pseudo">SHOW TABLES;              -- SHOW TABLES = affiche la liste des tables (les tableaux) contenues dans la base courante
DESCRIBE JEU;             -- DESCRIBE (raccourci : DESC) = montre la STRUCTURE de la table JEU : ses colonnes et le type de chacune
SHOW COLUMNS FROM JEU;    -- SHOW COLUMNS FROM = même idée en plus détaillé : liste les colonnes de la table JEU une par une</pre>
<div class="tip">Les commandes <code>SHOW</code> et <code>DESCRIBE</code> sont propres à MySQL : elles servent à explorer le serveur, les bases et les tables. Ce sont les tout premiers réflexes en console, comme allumer la lumière avant de fouiller une pièce.</div>

<h3>7. Les grandes familles de commandes SQL</h3>
<p>On classe les commandes SQL en cinq grandes <strong>familles</strong>, selon ce qu'elles font. Retiens surtout les trois premières :</p>
<pre class="pseudo">DDL  définir la structure : CREATE, ALTER, DROP           -- DDL (Data Definition Language) = commandes qui DÉFINISSENT la structure : créer/modifier/supprimer des tables
DML  manipuler les données : INSERT, UPDATE, DELETE       -- DML (Data Manipulation Language) = commandes qui CHANGENT le contenu : ajouter/modifier/effacer des lignes
DQL  interroger : SELECT                                  -- DQL (Data Query Language) = la commande qui LIT et interroge les données, sans jamais les modifier
DCL  droits : GRANT, REVOKE                               -- DCL (Data Control Language) = commandes qui gèrent les DROITS : donner ou retirer l'autorisation de faire quelque chose
TCL  transactions : START TRANSACTION, COMMIT, ROLLBACK   -- TCL (Transaction Control Language) = commandes qui groupent plusieurs actions en un bloc "tout ou rien"</pre>
<p>MySQL parle le SQL standard, avec ses particularités bien à lui (AUTO_INCREMENT, LIMIT, IFNULL…) qu'on découvrira tout au long du cours.</p>`,
  exercises: [
    { type: "qcm", q: "MySQL est un…", opts: ["Tableur", "SGBD relationnel open source", "Langage web", "Éditeur de texte"], a: 1, exp: "Système de gestion de bases de données." },
    { type: "qcm", q: "Le « M » de la pile LAMP désigne…", opts: ["Microsoft", "MySQL", "MongoDB", "Maven"], a: 1, exp: "Linux, Apache, MySQL, PHP." },
    { type: "qcm", q: "MariaDB est…", opts: ["Un tableur", "Un fork libre et compatible de MySQL", "Une extension de PHP", "Un client seulement"], a: 1, exp: "Créé par les auteurs d'origine." },
    { type: "qcm", q: "Lister les bases :", opts: ["LIST DB", "SHOW DATABASES", "GET BASES", "DESCRIBE ALL"], a: 1, exp: "SHOW DATABASES." },
    { type: "qcm", q: "Choisir la base de travail :", opts: ["OPEN base", "USE base", "SET base", "GO base"], a: 1, exp: "USE." },
    { type: "qcm", q: "Voir la structure d'une table :", opts: ["SHOW STRUCT", "DESCRIBE table (ou DESC)", "TABLE INFO", "LIST table"], a: 1, exp: "DESCRIBE / DESC." },
    { type: "qcm", q: "Lister les tables de la base :", opts: ["SHOW TABLES", "LIST TABLES", "GET TABLES", "TABLES;"], a: 0, exp: "SHOW TABLES." },
    { type: "qcm", q: "Une interface graphique courante pour MySQL :", opts: ["SSMS", "MySQL Workbench", "pgAdmin", "Excel"], a: 1, exp: "Workbench (SSMS = SQL Server)." },
    { type: "qcm", q: "SELECT appartient à la famille…", opts: ["DDL", "DQL (interrogation)", "TCL", "DCL"], a: 1, exp: "Data Query Language." },
    { type: "qcm", q: "CREATE, ALTER, DROP relèvent du…", opts: ["DML", "DDL (structure)", "DQL", "TCL"], a: 1, exp: "Data Definition Language." },
    { type: "vf", q: "Ce qu'on apprend en MySQL vaut en grande partie pour MariaDB.", a: true, exp: "Fork compatible." },
    { type: "qcm", q: "Le serveur MySQL peut héberger…", opts: ["Une seule base", "Plusieurs bases", "Aucune base", "Seulement des tables"], a: 1, exp: "Plusieurs bases." },
    { type: "vf", q: "SHOW et DESCRIBE sont des commandes propres à MySQL pour explorer.", a: true, exp: "Exploration du serveur." },
    { type: "qcm", q: "Se connecter en ligne de commande :", opts: ["mysql -u root -p", "connect mysql", "open db", "login sql"], a: 0, exp: "Client mysql." },
    { type: "qcm", q: "COMMIT et ROLLBACK relèvent du…", opts: ["DDL", "TCL (transactions)", "DQL", "DCL"], a: 1, exp: "Transaction Control Language." }
  ],
  final: {
    title: "Exercice final — Premiers pas en console",
    intro: `<p>Tu viens de te connecter au serveur MySQL. Réponds :</p>`,
    questions: [
      { type: "qcm", q: "Créer une base ludotheque :", opts: ["NEW DATABASE ludotheque", "CREATE DATABASE ludotheque", "MAKE DB ludotheque", "ADD DATABASE"], a: 1, exp: "CREATE DATABASE." },
      { type: "qcm", q: "S'y placer :", opts: ["USE ludotheque", "OPEN ludotheque", "GOTO ludotheque", "SET ludotheque"], a: 0, exp: "USE." },
      { type: "qcm", q: "Voir ses tables :", opts: ["SHOW TABLES", "LIST TABLES", "TABLES", "GET TABLES"], a: 0, exp: "SHOW TABLES." },
      { type: "qcm", q: "Voir les colonnes de JEU :", opts: ["DESC JEU", "COLUMNS JEU", "INFO JEU", "READ JEU"], a: 0, exp: "DESC / DESCRIBE." },
      { type: "vf", q: "MySQL et MariaDB partagent l'essentiel de leur syntaxe.", a: true, exp: "Compatibles." }
    ],
    solution: `<pre class="pseudo">CREATE DATABASE ludotheque;   -- crée la base vide nommée ludotheque
USE ludotheque;               -- se place dedans : c'est désormais la base de travail
SHOW TABLES;                  -- affiche la liste de ses tables
DESC JEU;                     -- montre la structure (colonnes + types) de la table JEU</pre>
<p>Tu sais explorer un serveur MySQL. Demain : créer des tables avec les types MySQL et AUTO_INCREMENT.</p>`
  }
};
