<script>
var DAY = {
  num: 9,
  title: "Regrouper : GROUP BY et HAVING",
  subtitle: "Un résultat par groupe, puis filtrer les groupes.",
  theory: `
<h3>1. Regrouper les lignes : GROUP BY</h3>
<p>Hier, un agrégat (COUNT, AVG…) résumait TOUTE la table en une seule ligne. Souvent on veut plutôt un résumé <strong>par groupe</strong> : non pas « le prix moyen de tous les jeux », mais « le prix moyen POUR CHAQUE catégorie ». La clause <code>GROUP BY</code> (« regrouper par ») rassemble les lignes qui partagent la même valeur, puis applique l'agrégat à chaque paquet séparément. Imagine qu'on trie des cartes en tas selon leur couleur, puis qu'on compte chaque tas : chaque tas donne une ligne de résultat.</p>
<pre class="pseudo">SELECT idCategorie, COUNT(*) AS nb, AVG(prixLocation) AS moyenne  -- pour chaque groupe : son idCategorie, le nombre de jeux (nb), le prix moyen
FROM JEU
GROUP BY idCategorie;   -- GROUP BY idCategorie = fais un groupe par catégorie ; les agrégats se calculent DANS chaque groupe</pre>
<p>Règle d'or : chaque colonne du <code>SELECT</code> doit être soit citée dans le <code>GROUP BY</code>, soit enfermée dans une fonction d'agrégation. Sinon MySQL ne saurait pas quelle valeur choisir pour le groupe.</p>

<h3>2. HAVING : filtrer les groupes</h3>
<p>On veut parfois ne garder que certains GROUPES (ex. « les catégories qui ont au moins 3 jeux »). Mais <code>WHERE</code> ne peut pas : il agit avant que les groupes existent. On utilise alors <code>HAVING</code> (« ayant », « à condition d'avoir »), qui est comme un <code>WHERE</code> mais qui s'applique APRÈS le regroupement, sur les agrégats :</p>
<pre class="pseudo">SELECT idCategorie, COUNT(*) AS nb
FROM JEU
GROUP BY idCategorie              -- on forme un groupe par catégorie…
HAVING COUNT(*) &gt;= 3;   -- HAVING = ne garde que les GROUPES dont le nombre de jeux est &gt;= 3 (catégories d'au moins 3 jeux)</pre>
<p>À retenir : <code>WHERE</code> filtre les <strong>lignes AVANT</strong> le regroupement ; <code>HAVING</code> filtre les <strong>groupes APRÈS</strong>. On les combine souvent : WHERE pour écarter des lignes, puis HAVING pour écarter des groupes.</p>

<h3>3. L'ordre logique</h3>
<p>MySQL exécute une requête dans un ordre bien précis (même si on l'écrit dans un autre ordre). Le connaître explique pourquoi WHERE vient avant HAVING :</p>
<pre class="pseudo">FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT   -- on part de la table (FROM), on filtre les lignes (WHERE), on regroupe (GROUP BY), on filtre les groupes (HAVING), on choisit les colonnes (SELECT), on trie (ORDER BY), on limite (LIMIT)</pre>

<h3>4. Le mode ONLY_FULL_GROUP_BY</h3>
<p>Depuis MySQL 5.7, le mode <code>ONLY_FULL_GROUP_BY</code> (activé par défaut) <strong>interdit</strong> de sélectionner une colonne qui n'est ni agrégée, ni présente dans le <code>GROUP BY</code>. C'est une bonne pratique : chaque colonne affichée doit être définie sans ambiguïté (une seule valeur claire par groupe).</p>
<div class="warn">Avant MySQL 5.7, on pouvait écrire <code>SELECT idCategorie, titre, COUNT(*) ... GROUP BY idCategorie</code> : MySQL renvoyait alors un titre « au hasard » parmi ceux du groupe. C'était dangereux (résultat imprévisible) ; le mode strict l'interdit désormais.</div>

<h3>5. Regrouper + trier + limiter</h3>
<p>On peut enchaîner regroupement, tri et limite pour obtenir un « top » : ici, les 3 catégories qui contiennent le plus de jeux.</p>
<pre class="pseudo">SELECT idCategorie, COUNT(*) AS nb
FROM JEU
GROUP BY idCategorie       -- un groupe par catégorie, avec son nombre de jeux
ORDER BY nb DESC           -- on trie ces groupes du plus fourni au moins fourni
LIMIT 3;   -- on ne garde que les 3 premiers = le top 3 des catégories les plus fournies</pre>`,
  exercises: [
    { type: "qcm", q: "GROUP BY sert à…", opts: ["Trier", "Produire un résultat par groupe", "Filtrer les lignes", "Joindre"], a: 1, exp: "Un agrégat par groupe." },
    { type: "qcm", q: "HAVING filtre…", opts: ["Les lignes avant regroupement", "Les groupes après regroupement", "Les colonnes", "Les index"], a: 1, exp: "Après GROUP BY." },
    { type: "qcm", q: "WHERE vs HAVING :", opts: ["Identiques", "WHERE avant le regroupement, HAVING après", "HAVING avant", "WHERE ne marche pas ici"], a: 1, exp: "Ordre logique." },
    { type: "qcm", q: "Chaque colonne du SELECT doit être…", opts: ["Une constante", "Dans le GROUP BY ou dans un agrégat", "Un alias", "Un index"], a: 1, exp: "Règle du regroupement." },
    { type: "qcm", q: "Catégories d'au moins 3 jeux :", opts: ["WHERE COUNT(*) >= 3", "GROUP BY idCategorie HAVING COUNT(*) >= 3", "LIMIT 3", "ORDER BY COUNT"], a: 1, exp: "HAVING sur l'agrégat." },
    { type: "qcm", q: "ONLY_FULL_GROUP_BY (MySQL 5.7+) …", opts: ["Autorise tout", "Interdit une colonne non agrégée hors du GROUP BY", "Trie", "Désactive GROUP BY"], a: 1, exp: "Mode strict." },
    { type: "qcm", q: "L'ordre logique est…", opts: ["SELECT → FROM → WHERE", "FROM → WHERE → GROUP BY → HAVING → SELECT", "WHERE → SELECT", "GROUP BY d'abord"], a: 1, exp: "FROM en premier." },
    { type: "qcm", q: "Nombre de jeux par catégorie :", opts: ["COUNT(*) sans GROUP BY", "SELECT idCategorie, COUNT(*) ... GROUP BY idCategorie", "SUM(idCategorie)", "TOP"], a: 1, exp: "Regroupement." },
    { type: "qcm", q: "Le top 3 des catégories les plus fournies :", opts: ["HAVING 3", "GROUP BY ... ORDER BY COUNT(*) DESC LIMIT 3", "TOP 3", "WHERE 3"], a: 1, exp: "GROUP BY + tri + LIMIT." },
    { type: "qcm", q: "Filtrer les lignes AVANT de regrouper :", opts: ["HAVING", "WHERE", "LIMIT", "ORDER BY"], a: 1, exp: "WHERE avant GROUP BY." },
    { type: "vf", q: "HAVING peut utiliser une fonction d'agrégation comme COUNT(*).", a: true, exp: "C'est son rôle." },
    { type: "qcm", q: "Avant 5.7, sélectionner un titre non agrégé donnait…", opts: ["Une erreur", "Un titre pris au hasard du groupe", "NULL", "Zéro"], a: 1, exp: "Comportement dangereux." },
    { type: "vf", q: "Le mode strict ONLY_FULL_GROUP_BY est une bonne pratique.", a: true, exp: "Évite l'ambiguïté." },
    { type: "qcm", q: "Prix moyen par catégorie :", opts: ["AVG sans GROUP BY", "SELECT idCategorie, AVG(prixLocation) ... GROUP BY idCategorie", "SUM", "LIMIT"], a: 1, exp: "Agrégat par groupe." },
    { type: "qcm", q: "Un alias du SELECT utilisable dans…", opts: ["WHERE", "ORDER BY (évalué en dernier)", "GROUP BY seul", "FROM"], a: 1, exp: "ORDER BY accepte l'alias." }
  ],
  final: {
    title: "Exercice final — Bilan par catégorie",
    intro: `<p>Table JEU(idJeu, titre, prixLocation, idCategorie).</p>`,
    questions: [
      { type: "qcm", q: "Nombre de jeux par catégorie :", opts: ["COUNT(*) GROUP BY idCategorie", "SELECT idCategorie, COUNT(*) FROM JEU GROUP BY idCategorie", "SUM(idCategorie)", "TOP"], a: 1, exp: "GROUP BY + COUNT." },
      { type: "qcm", q: "Catégories dont la moyenne dépasse 4 :", opts: ["WHERE AVG > 4", "GROUP BY idCategorie HAVING AVG(prixLocation) > 4", "HAVING sans GROUP BY", "LIMIT 4"], a: 1, exp: "HAVING." },
      { type: "qcm", q: "Le top 2 des catégories les plus fournies :", opts: ["GROUP BY ... ORDER BY COUNT(*) DESC LIMIT 2", "HAVING 2", "TOP 2", "WHERE 2"], a: 0, exp: "GROUP BY + tri + LIMIT." },
      { type: "qcm", q: "Filtrer les lignes avant le regroupement :", opts: ["HAVING", "WHERE", "LIMIT", "ORDER BY"], a: 1, exp: "WHERE." },
      { type: "vf", q: "HAVING agit après le GROUP BY, WHERE avant.", a: true, exp: "Ordre logique." }
    ],
    solution: `<pre class="pseudo">SELECT idCategorie,
       COUNT(*)          AS nb,         -- nombre de jeux dans la catégorie
       AVG(prixLocation) AS moyenne     -- prix de location moyen de la catégorie
FROM JEU
GROUP BY idCategorie          -- un groupe par catégorie
HAVING AVG(prixLocation) &gt; 4  -- on ne garde que les catégories dont la moyenne dépasse 4
ORDER BY moyenne DESC;        -- triées de la plus chère à la moins chère</pre>
<p>Tu résumes par groupe. Demain : les jointures.</p>`
  }
};
</script>
