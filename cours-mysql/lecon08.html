<script>
var DAY = {
  num: 8,
  title: "Les fonctions d'agrégation",
  subtitle: "Compter, additionner, moyenner sur des ensembles de lignes.",
  theory: `
<h3>1. C'est quoi « agréger » ?</h3>
<p>Jusqu'ici, chaque ligne du résultat correspondait à une ligne de la table. Parfois on veut au contraire un <strong>résumé</strong> : « combien de jeux ? », « quel prix moyen ? », « quel est le plus cher ? ». <strong>Agréger</strong>, c'est justement <strong>combiner plusieurs lignes en une seule valeur de synthèse</strong> (comme faire le total d'un ticket de caisse à partir de tous ses articles). Les fonctions qui font cela s'appellent les <strong>fonctions d'agrégation</strong> :</p>
<pre class="pseudo">COUNT(*)          -- COMPTE le nombre de lignes (l'étoile = "peu importe le contenu, compte les lignes")
COUNT(col)        -- compte seulement les valeurs NON NULL de la colonne col (les cases remplies)
SUM(col)          -- fait la SOMME (l'addition) de toutes les valeurs de la colonne col
AVG(col)          -- calcule la MOYENNE (average) des valeurs de la colonne col
MIN(col) MAX(col) -- renvoient la plus PETITE (MIN) et la plus GRANDE (MAX) valeur de la colonne</pre>
<pre class="pseudo">SELECT COUNT(*) AS nb, AVG(prixLocation) AS moyenne FROM JEU;  -- en une ligne : le nombre total de jeux (nb) et leur prix de location moyen</pre>

<h3>2. COUNT et les NULL</h3>
<p>Petite subtilité importante : <code>COUNT(*)</code> compte TOUTES les lignes, tandis que <code>COUNT(uneColonne)</code> ne compte que les lignes où cette colonne a une valeur (les <code>NULL</code>, les cases vides, sont ignorés). C'est très pratique pour savoir « sur combien de lignes cette information est renseignée ».</p>
<pre class="pseudo">SELECT COUNT(*)             AS total,            -- nombre total de jeux (toutes les lignes)
       COUNT(idFournisseur) AS avec_fournisseur  -- nombre de jeux qui ONT un fournisseur (les NULL sont ignorés)
FROM JEU;</pre>

<h3>3. Arrondir un agrégat</h3>
<p>Une moyenne donne souvent un nombre à rallonge (4,3333…). La fonction <code>ROUND(x, n)</code> arrondit le nombre x à n chiffres après la virgule, pour un affichage propre :</p>
<pre class="pseudo">SELECT ROUND(AVG(prixLocation), 2) AS prix_moyen FROM JEU;  -- AVG calcule la moyenne, puis ROUND(…, 2) l'arrondit à 2 décimales (ex. 4.33)</pre>

<h3>4. COUNT(DISTINCT ...)</h3>
<p>On peut combiner <code>COUNT</code> avec <code>DISTINCT</code> (vu en leçon 4 : « sans doublon ») pour compter le nombre de valeurs DIFFÉRENTES, et non le nombre de lignes :</p>
<pre class="pseudo">SELECT COUNT(DISTINCT idCategorie) AS nb_categories_utilisees FROM JEU;  -- COUNT(DISTINCT …) = combien de catégories DIFFÉRENTES apparaissent (chaque catégorie comptée une seule fois)</pre>

<h3>5. GROUP_CONCAT, une spécialité MySQL</h3>
<div class="tip"><code>GROUP_CONCAT(titre)</code> est une fonction d'agrégation particulière : au lieu de compter ou d'additionner, elle <strong>colle en une seule chaîne</strong> toutes les valeurs d'un groupe. Exemple : <code>SELECT idCategorie, GROUP_CONCAT(titre) FROM JEU GROUP BY idCategorie</code> liste, sur une seule ligne par catégorie, tous les titres qu'elle contient. C'est propre à MySQL (on verra <code>GROUP BY</code> demain).</div>`,
  exercises: [
    { type: "qcm", q: "COUNT(*) compte…", opts: ["Les colonnes", "Le nombre de lignes", "Les NULL", "Les tables"], a: 1, exp: "Toutes les lignes." },
    { type: "qcm", q: "COUNT(idFournisseur) compte…", opts: ["Toutes les lignes", "Les lignes où la valeur n'est pas NULL", "Les NULL", "Les doublons"], a: 1, exp: "Ignore les NULL." },
    { type: "qcm", q: "La moyenne :", opts: ["MEAN(col)", "AVG(col)", "MOY(col)", "MEDIAN(col)"], a: 1, exp: "AVG." },
    { type: "qcm", q: "La somme d'une colonne :", opts: ["ADD(col)", "SUM(col)", "TOTAL(col)", "PLUS(col)"], a: 1, exp: "SUM." },
    { type: "qcm", q: "Arrondir à 2 décimales :", opts: ["ROUND(x, 2)", "TRUNC(x)", "FIX(x)", "DEC(x, 2)"], a: 0, exp: "ROUND." },
    { type: "qcm", q: "Compter les catégories distinctes utilisées :", opts: ["COUNT(idCategorie)", "COUNT(DISTINCT idCategorie)", "DISTINCT COUNT", "SUM(idCategorie)"], a: 1, exp: "COUNT(DISTINCT ...)." },
    { type: "qcm", q: "Le plus grand prix :", opts: ["TOP(prix)", "MAX(prix)", "HIGH(prix)", "BIG(prix)"], a: 1, exp: "MAX." },
    { type: "qcm", q: "GROUP_CONCAT(titre) …", opts: ["Compte", "Regroupe les valeurs d'un groupe en une chaîne", "Trie", "Supprime"], a: 1, exp: "Spécialité MySQL." },
    { type: "qcm", q: "Sans GROUP BY, un agrégat porte sur…", opts: ["Une ligne", "Toute la table", "Rien", "La clé"], a: 1, exp: "L'ensemble." },
    { type: "vf", q: "COUNT(*) et COUNT(col) diffèrent s'il y a des NULL.", a: true, exp: "COUNT(col) ignore les NULL." },
    { type: "qcm", q: "Le stock de location total :", opts: ["COUNT(stockLocation)", "SUM(stockLocation)", "AVG(stockLocation)", "MAX(stockLocation)"], a: 1, exp: "SUM." },
    { type: "qcm", q: "Le prix minimum :", opts: ["MIN(prix)", "LOW(prix)", "SMALL(prix)", "FIRST(prix)"], a: 0, exp: "MIN." },
    { type: "vf", q: "GROUP_CONCAT est propre à MySQL.", a: true, exp: "Peu de SGBD l'ont." },
    { type: "qcm", q: "Le nombre de jeux ET le prix moyen :", opts: ["Deux requêtes", "SELECT COUNT(*), AVG(prixLocation) FROM JEU", "TOP", "GROUP_CONCAT"], a: 1, exp: "Plusieurs agrégats." },
    { type: "qcm", q: "ROUND(AVG(prix), 1) …", opts: ["Compte", "Moyenne arrondie à 1 décimale", "Trie", "Somme"], a: 1, exp: "Agrégat arrondi." }
  ],
  final: {
    title: "Exercice final — Statistiques du catalogue",
    intro: `<p>Table JEU(idJeu, titre, prixLocation, idCategorie, idFournisseur).</p>`,
    questions: [
      { type: "qcm", q: "Nombre total de jeux :", opts: ["COUNT(*)", "SUM(*)", "TOTAL()", "NB()"], a: 0, exp: "COUNT(*)." },
      { type: "qcm", q: "Prix de location moyen arrondi :", opts: ["AVG(prix)", "ROUND(AVG(prixLocation), 2)", "SUM(prix)", "MAX(prix)"], a: 1, exp: "ROUND + AVG." },
      { type: "qcm", q: "Combien de jeux ont un fournisseur :", opts: ["COUNT(*)", "COUNT(idFournisseur)", "SUM(idFournisseur)", "COUNT(NULL)"], a: 1, exp: "Ignore les NULL." },
      { type: "qcm", q: "Nombre de catégories différentes :", opts: ["COUNT(idCategorie)", "COUNT(DISTINCT idCategorie)", "DISTINCT()", "SUM"], a: 1, exp: "COUNT(DISTINCT ...)." },
      { type: "vf", q: "Un agrégat sans GROUP BY résume toute la table en une ligne.", a: true, exp: "Résumé global." }
    ],
    solution: `<pre class="pseudo">SELECT COUNT(*)                        AS nb_jeux,          -- nombre total de jeux
       ROUND(AVG(prixLocation), 2)     AS prix_moyen,       -- prix de location moyen, arrondi à 2 décimales
       COUNT(idFournisseur)            AS avec_fournisseur,  -- jeux ayant un fournisseur (NULL ignorés)
       COUNT(DISTINCT idCategorie)     AS nb_categories      -- nombre de catégories différentes utilisées
FROM JEU;</pre>
<p>Tu résumes les données. Demain : regrouper par catégorie.</p>`
  }
};
