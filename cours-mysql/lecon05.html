<script>
var DAY = {
  num: 5,
  title: "Filtrer : WHERE et les opérateurs MySQL",
  subtitle: "Cibler les lignes voulues, avec les finesses de MySQL.",
  theory: `
<h3>1. Filtrer les lignes : WHERE</h3>
<p>Jusqu'ici, <code>SELECT</code> affichait TOUTES les lignes de la table. Le plus souvent, on ne veut que CERTAINES lignes : les jeux pas chers, les clients d'une ville, etc. On ajoute alors une clause <code>WHERE</code> (« là où », « à condition que ») suivie d'une <strong>condition</strong> : une phrase qui est vraie ou fausse pour chaque ligne. Seules les lignes pour lesquelles la condition est VRAIE sont gardées. C'est comme un tamis qui ne laisse passer que ce qui correspond.</p>
<pre class="pseudo">SELECT titre, prixLocation      -- on veut afficher le titre et le prix de location…
FROM JEU                        -- …de la table JEU…
WHERE prixLocation &lt; 5 AND stockLocation &gt; 0;  -- …mais SEULEMENT les lignes où le prix est inférieur à 5 ET (AND) le stock est supérieur à 0</pre>
<p>Les <strong>opérateurs de comparaison</strong> disponibles : <code>=</code> (égal), <code>&lt;&gt;</code> ou <code>!=</code> (différent), <code>&lt;</code> (inférieur), <code>&gt;</code> (supérieur), <code>&lt;=</code> (inférieur ou égal), <code>&gt;=</code> (supérieur ou égal). On relie plusieurs conditions avec <code>AND</code> (« et » : les deux doivent être vraies), <code>OR</code> (« ou » : au moins une vraie) et <code>NOT</code> (« non » : inverse la condition).</p>

<h3>2. LIKE, IN, BETWEEN, IS NULL</h3>
<p>Quatre outils très pratiques pour écrire des conditions plus riches. <code>LIKE</code> cherche un <strong>motif</strong> dans du texte ; <code>IN</code> teste l'appartenance à une liste ; <code>BETWEEN</code> teste un intervalle ; <code>IS NULL</code> teste l'absence de valeur.</p>
<pre class="pseudo">WHERE titre LIKE 'C%'              -- LIKE = "ressemble à" ; le motif 'C%' veut dire "commence par C, suivi de n'importe quoi"
WHERE idCategorie IN (1, 2)        -- IN (…) = la valeur est l'une de celles de la liste : ici idCategorie vaut 1 OU 2
WHERE prixLocation BETWEEN 3 AND 5 -- BETWEEN a AND b = compris dans l'intervalle [3 ; 5], BORNES INCLUSES (3 et 5 comptent)
WHERE idFournisseur IS NULL        -- IS NULL = la case est VIDE (aucune valeur renseignée)</pre>
<p>Dans un motif <code>LIKE</code>, deux caractères spéciaux (des « jokers ») : <code>%</code> remplace une <strong>suite quelconque</strong> de caractères (y compris aucun), et <code>_</code> (le tiret bas) remplace <strong>exactement un</strong> caractère. Le <strong>NULL</strong>, lui, est une notion importante : c'est l'absence totale de valeur (« on ne sait pas », « non renseigné »), à ne pas confondre avec 0 ou avec du texte vide.</p>

<h3>3. La casse : collation</h3>
<p>La <strong>casse</strong> désigne la différence entre majuscules et minuscules. La <strong>collation</strong> est la règle qui dit COMMENT MySQL compare et trie le texte. Par défaut, MySQL compare de façon <strong>insensible à la casse</strong> (collation <code>utf8mb4_general_ci</code>, où le suffixe « ci » signifie <em>case insensitive</em>) : pour lui, <code>'catan'</code> et <code>'CATAN'</code> sont égaux. Une collation en <code>_cs</code> (case sensitive) ou <code>_bin</code> (binaire), au contraire, distingue les majuscules des minuscules.</p>
<pre class="pseudo">WHERE titre LIKE 'c%'   -- avec la collation "ci" par défaut, ce motif en minuscule trouve AUSSI « Catan » (le C majuscule est traité comme un c)</pre>

<h3>4. Comparaison sûre du NULL</h3>
<p>Piège fréquent : on ne teste JAMAIS le NULL avec <code>=</code>. En effet, NULL signifie « valeur inconnue », donc « inconnu = inconnu » ne peut pas être déclaré vrai. Il faut utiliser <code>IS NULL</code>.</p>
<pre class="pseudo">WHERE idFournisseur = NULL      -- ✗ FAUX PIÈGE : ne renvoie JAMAIS de ligne (on ne compare pas NULL avec =)
WHERE idFournisseur IS NULL     -- ✓ la bonne façon de tester l'absence de valeur</pre>
<p>MySQL offre en plus l'opérateur <code>&lt;=&gt;</code> (« comparaison sûre du NULL ») : <code>a &lt;=&gt; NULL</code> vaut vrai si a est NULL, sans le piège du <code>=</code>.</p>

<h3>5. Expressions régulières</h3>
<div class="tip">Une <strong>expression régulière</strong> est une mini-formule décrivant un motif de texte. MySQL propose le mot-clé <code>REGEXP</code> pour filtrer ainsi : <code>WHERE titre REGEXP '^[A-D]'</code> trouve les titres commençant (le <code>^</code> = « début ») par une lettre de A à D (<code>[A-D]</code>). Plus puissant que <code>LIKE</code>, mais réservé aux motifs vraiment complexes.</div>`,
  exercises: [
    { type: "qcm", q: "WHERE sert à…", opts: ["Trier", "Filtrer les lignes selon une condition", "Compter", "Joindre"], a: 1, exp: "Filtre les lignes." },
    { type: "qcm", q: "« différent de » s'écrit…", opts: ["==", "&lt;&gt; ou !=", "=!", "NOT="], a: 1, exp: "&lt;&gt; / !=." },
    { type: "qcm", q: "Le joker % signifie…", opts: ["Un caractère", "Une suite quelconque de caractères", "Un chiffre", "Le début de la chaîne"], a: 1, exp: "% = suite quelconque." },
    { type: "qcm", q: "Le joker _ signifie…", opts: ["Une suite", "Exactement un caractère", "Un chiffre", "Rien"], a: 1, exp: "_ = un caractère." },
    { type: "qcm", q: "IN (1, 2) teste…", opts: ["Un intervalle", "L'appartenance à une liste", "Un motif", "Une absence"], a: 1, exp: "Valeur dans la liste." },
    { type: "qcm", q: "BETWEEN 3 AND 5 inclut…", opts: ["3 et 5 exclus", "3 et 5 compris", "Seulement 4", "Rien"], a: 1, exp: "Bornes comprises." },
    { type: "qcm", q: "Tester l'absence de fournisseur :", opts: ["= NULL", "IS NULL", "== NULL", "LIKE NULL"], a: 1, exp: "IS NULL." },
    { type: "qcm", q: "La sensibilité à la casse dépend…", opts: ["Du type", "De la collation (ci = insensible)", "Du LIMIT", "De l'index"], a: 1, exp: "utf8mb4_general_ci." },
    { type: "vf", q: "Avec la collation par défaut, 'catan' = 'CATAN' est vrai.", a: true, exp: "Insensible à la casse." },
    { type: "qcm", q: "L'opérateur de comparaison sûre du NULL :", opts: ["==", "&lt;=&gt;", "!=", "IS"], a: 1, exp: "a &lt;=&gt; NULL." },
    { type: "qcm", q: "Filtrer par expression régulière :", opts: ["LIKE", "REGEXP", "MATCH()", "SEARCH"], a: 1, exp: "REGEXP." },
    { type: "qcm", q: "WHERE idFournisseur = NULL renvoie…", opts: ["Les sans-fournisseur", "Jamais de ligne (piège du NULL)", "Tous", "Une erreur"], a: 1, exp: "Comparaison = NULL invalide." },
    { type: "vf", q: "WHERE peut filtrer sur une colonne non affichée dans le SELECT.", a: true, exp: "Filtre avant projection." },
    { type: "qcm", q: "« pas les catégories 1 ni 2 » :", opts: ["IN (1,2)", "NOT IN (1, 2)", "&lt;&gt; 1", "= 1 OR 2"], a: 1, exp: "NOT IN." },
    { type: "qcm", q: "Titres commençant par C :", opts: ["LIKE '%C'", "LIKE 'C%'", "= 'C'", "IN ('C')"], a: 1, exp: "'C%'." }
  ],
  final: {
    title: "Exercice final — Filtres MySQL",
    intro: `<p>Table JEU(idJeu, titre, prixLocation, stockLocation, idCategorie, idFournisseur).</p>`,
    questions: [
      { type: "qcm", q: "Jeux disponibles à moins de 5 :", opts: ["WHERE prixLocation &lt; 5 AND stockLocation &gt; 0", "LIMIT 5", "WHERE prixLocation = 5", "WHERE stock"], a: 0, exp: "Deux conditions AND." },
      { type: "qcm", q: "Titres commençant par « Ca » :", opts: ["LIKE 'Ca%'", "= 'Ca'", "IN ('Ca')", "BETWEEN"], a: 0, exp: "Motif LIKE." },
      { type: "qcm", q: "Jeux sans fournisseur :", opts: ["idFournisseur = NULL", "idFournisseur IS NULL", "idFournisseur = 0", "NOT idFournisseur"], a: 1, exp: "IS NULL." },
      { type: "qcm", q: "Catégories 1 ou 3 :", opts: ["idCategorie IN (1, 3)", "idCategorie = 1 AND 3", "BETWEEN 1 AND 3", "LIKE 13"], a: 0, exp: "IN." },
      { type: "vf", q: "Avec la collation par défaut, LIKE 'c%' trouve aussi « Catan ».", a: true, exp: "Insensible à la casse." }
    ],
    solution: `<pre class="pseudo">SELECT titre, prixLocation       -- affiche titre et prix…
FROM JEU
WHERE prixLocation &lt; 5 AND stockLocation &gt; 0;  -- …des jeux à moins de 5 ET encore en stock

SELECT titre FROM JEU WHERE titre LIKE 'Ca%';  -- titres commençant par "Ca"

SELECT titre FROM JEU WHERE idFournisseur IS NULL;  -- jeux sans fournisseur renseigné (case vide)

SELECT titre FROM JEU WHERE idCategorie IN (1, 3);  -- jeux des catégories 1 ou 3</pre>
<p>Tu filtres finement. Demain : trier et paginer avec LIMIT / OFFSET.</p>`
  }
};
</script>

  ]
