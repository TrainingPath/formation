  title: "Les procédures stockées",
  subtitle: "Enregistrer un traitement réutilisable dans la base.",
  theory: `
<h3>1. Qu'est-ce qu'une procédure stockée ?</h3>
<p>Une <strong>procédure stockée</strong> est un <strong>bloc de code SQL nommé, enregistré dans la base</strong>, qu'on peut rappeler quand on veut en lui passant des <strong>paramètres</strong> (des valeurs d'entrée). C'est comme une « recette » enregistrée une fois pour toutes côté serveur : au lieu de réécrire les mêmes requêtes dans chaque programme, on les range dans une procédure et on l'appelle par son nom. Cela centralise la <strong>logique métier</strong> (les règles de fonctionnement de l'application) directement dans la base.</p>

<h3>2. Le DELIMITER</h3>
<p>Petit obstacle technique : le corps d'une procédure contient plusieurs instructions, donc plusieurs <code>;</code>. Or MySQL croit qu'une commande se termine au premier <code>;</code>. Le mot <code>DELIMITER</code> (« délimiteur ») change temporairement ce symbole de fin (souvent en <code>$$</code>), le temps de définir la procédure, puis on le remet à <code>;</code>.</p>
<pre class="pseudo">DELIMITER $$                              -- DELIMITER $$ = à partir d'ici, la fin d'une commande est marquée par $$ (plus par ;)
CREATE PROCEDURE JeuxParCategorie(IN p_idCat INT)  -- CREATE PROCEDURE nom(paramètres) = définit une procédure ; IN p_idCat INT = un paramètre d'ENTRÉE nommé p_idCat, de type entier
BEGIN                                     -- BEGIN = début du corps (le contenu) de la procédure
    SELECT titre, prixLocation           -- l'instruction exécutée quand on appellera la procédure…
    FROM JEU
    WHERE idCategorie = p_idCat          -- …filtrée avec la valeur reçue dans p_idCat
    ORDER BY prixLocation;
END$$                                     -- END = fin du corps ; le $$ marque la fin de la commande CREATE PROCEDURE
DELIMITER ;                               -- DELIMITER ; = on rétablit le point-virgule comme délimiteur normal</pre>

<h3>3. L'appeler</h3>
<p>Une procédure ne s'exécute pas toute seule : on la déclenche avec <code>CALL</code> (« appeler »), en fournissant les valeurs des paramètres.</p>
<pre class="pseudo">CALL JeuxParCategorie(1);   -- CALL = exécute la procédure ; ici on passe 1 comme valeur de p_idCat (les jeux de la catégorie 1)</pre>
<p>On exécute une procédure avec <code>CALL</code> (et non <code>EXEC</code> comme SQL Server : encore une différence de dialecte).</p>

<h3>4. Paramètres IN, OUT, INOUT</h3>
<p>Un paramètre peut servir à faire ENTRER une valeur, à en faire SORTIR une, ou les deux : <code>IN</code> (entrée), <code>OUT</code> (sortie), <code>INOUT</code> (les deux). Pour renvoyer un résultat par un paramètre <code>OUT</code>, on range une valeur dans une variable avec <code>SELECT … INTO</code>.</p>
<pre class="pseudo">DELIMITER $$
CREATE PROCEDURE CompterJeux(IN p_idCat INT, OUT p_total INT)  -- p_idCat = entrée (la catégorie) ; p_total = SORTIE (le résultat renvoyé)
BEGIN
    SELECT COUNT(*) INTO p_total FROM JEU WHERE idCategorie = p_idCat;  -- SELECT COUNT(*) INTO p_total = range le nombre de jeux dans le paramètre de sortie p_total
END$$
DELIMITER ;

CALL CompterJeux(1, @n);   -- on appelle avec la catégorie 1 ; @n est une variable de session qui recevra le résultat
SELECT @n;                 -- on lit @n : le nombre de jeux de la catégorie 1</pre>
<p><code>IN</code> = entrée, <code>OUT</code> = sortie, <code>INOUT</code> = les deux. <code>@n</code> est une <strong>variable de session</strong> (un tiroir temporaire, préfixé par @, propre à ta connexion). <code>SELECT … INTO var</code> affecte une valeur à une variable.</p>

<h3>5. Modifier / supprimer</h3>
<pre class="pseudo">DROP PROCEDURE IF EXISTS JeuxParCategorie;   -- DROP PROCEDURE = supprime la procédure ; IF EXISTS = "seulement si elle existe" (évite une erreur sinon). On la recrée ensuite avec CREATE</pre>
<div class="tip">En MySQL, on ne peut PAS modifier (« ALTER ») le corps d'une procédure : on la <code>DROP</code> (supprime) puis on la recrée. Une procédure est <strong>précompilée</strong> (préparée d'avance, donc rapide), réduit le trafic réseau (une seule commande CALL au lieu de plusieurs requêtes) et permet d'accorder des droits sur la procédure plutôt que directement sur les tables.</div>`,
  exercises: [
    { type: "qcm", q: "Une procédure stockée est…", opts: ["Une table", "Un bloc de code SQL nommé, enregistré dans la base", "Un index", "Une vue"], a: 1, exp: "Code réutilisable côté serveur." },
    { type: "qcm", q: "Pourquoi changer le DELIMITER ?", opts: ["Pour trier", "Car le corps contient des ; que MySQL prendrait pour la fin", "Pour chiffrer", "Pour indexer"], a: 1, exp: "Éviter la coupure prématurée." },
    { type: "qcm", q: "La créer :", opts: ["MAKE PROC", "CREATE PROCEDURE nom(...) BEGIN ... END", "NEW PROCEDURE", "DECLARE PROC"], a: 1, exp: "CREATE PROCEDURE." },
    { type: "qcm", q: "L'appeler :", opts: ["EXEC nom", "CALL nom(...)", "RUN nom", "DO nom"], a: 1, exp: "CALL (pas EXEC)." },
    { type: "qcm", q: "Un paramètre d'entrée se déclare…", opts: ["OUT p_x INT", "IN p_x INT", "sans mot-clé", "@x"], a: 1, exp: "IN." },
    { type: "qcm", q: "Un paramètre de sortie :", opts: ["IN", "OUT", "SET", "RETURN"], a: 1, exp: "OUT." },
    { type: "qcm", q: "Affecter une variable depuis une requête :", opts: ["SET x = SELECT", "SELECT COUNT(*) INTO p_total FROM ...", "ASSIGN", "LET"], a: 1, exp: "SELECT ... INTO." },
    { type: "qcm", q: "Modifier le corps d'une procédure MySQL :", opts: ["ALTER PROCEDURE le corps", "DROP puis CREATE", "CHANGE", "MODIFY"], a: 1, exp: "DROP + recréer." },
    { type: "qcm", q: "Le délimiteur souvent utilisé :", opts: [";", "$$", "//", "@@"], a: 1, exp: "$$ (ou //)." },
    { type: "qcm", q: "Un avantage d'une procédure :", opts: ["Elle ralentit", "Elle est précompilée et réutilisable", "Elle expose le SQL brut", "Elle double les données"], a: 1, exp: "Performance et centralisation." },
    { type: "vf", q: "Une procédure peut avoir des paramètres IN et OUT.", a: true, exp: "Entrée et sortie." },
    { type: "qcm", q: "Après avoir défini la procédure, on remet…", opts: ["Rien", "DELIMITER ; pour revenir au point-virgule", "COMMIT", "un index"], a: 1, exp: "Restaurer le délimiteur." },
    { type: "vf", q: "Une procédure réduit le code répété dans l'application.", a: true, exp: "Logique centralisée." },
    { type: "qcm", q: "Le corps de la procédure est entre…", opts: ["( )", "BEGIN ... END", "{ }", "DO ... DONE"], a: 1, exp: "Bloc BEGIN/END." },
    { type: "qcm", q: "CALL JeuxParCategorie(1) …", opts: ["Crée la procédure", "L'exécute avec p_idCat = 1", "La supprime", "La modifie"], a: 1, exp: "Appel." }
  ],
  final: {
    title: "Exercice final — Une procédure utile",
    intro: `<p>On veut une procédure listant les jeux d'une catégorie disponibles à la location.</p>`,
    questions: [
      { type: "qcm", q: "Déclarer le paramètre d'entrée :", opts: ["IN p_idCat INT", "OUT p_idCat", "sans mot-clé", "@idCat"], a: 0, exp: "IN." },
      { type: "qcm", q: "Encadrer la définition :", opts: ["Rien", "DELIMITER $$ ... END$$ DELIMITER ;", "COMMIT", "BEGIN seul"], a: 1, exp: "DELIMITER." },
      { type: "qcm", q: "L'appeler pour la catégorie 2 :", opts: ["EXEC ... 2", "CALL JeuxDispo(2)", "RUN 2", "DO 2"], a: 1, exp: "CALL." },
      { type: "qcm", q: "Renvoyer aussi le nombre trouvé :", opts: ["Un paramètre OUT", "Un PRINT", "Un index", "Impossible"], a: 0, exp: "OUT + SELECT INTO." },
      { type: "vf", q: "On appelle une procédure MySQL avec CALL, pas EXEC.", a: true, exp: "Dialecte MySQL." }
    ],
    solution: `<pre class="pseudo">DELIMITER $$                              -- on passe le délimiteur à $$
CREATE PROCEDURE JeuxDispo(IN p_idCat INT)  -- procédure avec un paramètre d'entrée p_idCat
BEGIN
    SELECT titre, prixLocation
    FROM JEU
    WHERE idCategorie = p_idCat AND stockLocation &gt; 0  -- jeux de la catégorie demandée ET encore en stock
    ORDER BY prixLocation;
END$$                                     -- fin de la procédure (marquée par $$)
DELIMITER ;                               -- on rétablit le ;

CALL JeuxDispo(2);   -- exécute la procédure pour la catégorie 2</pre>
<p>Tu centralises la logique métier. Demain : les déclencheurs.</p>`
  }
};

    checklist: [

    note: "La procédure encapsule l'opération métier complète (louer = enregistrer + décrémenter le stock), rendue indivisible par la transaction. Le DELIMITER $$ permet d'écrire un corps contenant des ; sans que MySQL ne coupe la commande. On l'appelle ensuite par CALL louer_jeu(1, 5)." }
  ]
