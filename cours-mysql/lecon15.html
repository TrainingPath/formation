<script>
var DAY = {
  num: 15,
  title: "Contraintes, clés et moteurs (InnoDB)",
  subtitle: "Garantir l'intégrité des données au niveau de la base.",
  theory: `
<h3>1. Les contraintes</h3>
<p>Une <strong>contrainte</strong> est une <strong>règle imposée par la base elle-même</strong> : dès qu'une donnée la viole, la base la REFUSE, indépendamment du programme qui l'envoie. C'est un garde-fou définitif : même si l'application oublie de vérifier, la base, elle, ne laisse pas passer. On parle d'<strong>intégrité</strong> des données : la garantie qu'elles restent cohérentes et valides. Voyons les principales contraintes.</p>

<h3>2. PRIMARY KEY et AUTO_INCREMENT</h3>
<p>La <strong>clé primaire</strong> (<code>PRIMARY KEY</code>) identifie chaque ligne de façon unique (leçon 2) ; <code>AUTO_INCREMENT</code> la remplit automatiquement. <code>UNIQUE</code> garantit qu'aucun doublon n'existe sur une colonne.</p>
<pre class="pseudo">CREATE TABLE CATEGORIE (
  idCategorie INT AUTO_INCREMENT PRIMARY KEY,   -- clé primaire numérotée automatiquement (identifiant unique de chaque catégorie)
  libelle     VARCHAR(60) NOT NULL UNIQUE       -- NOT NULL = obligatoire ; UNIQUE = deux catégories ne peuvent pas avoir le même libellé
) ENGINE=InnoDB;                                -- moteur InnoDB (indispensable pour les clés étrangères, voir plus bas)</pre>

<h3>3. FOREIGN KEY (InnoDB requis)</h3>
<p>La <strong>clé étrangère</strong> (<code>FOREIGN KEY</code>) garantit qu'une valeur pointe vers une ligne QUI EXISTE dans une autre table (leçon 2). On peut lui donner un nom avec <code>CONSTRAINT</code>, ce qui facilite les messages d'erreur et les modifications futures.</p>
<pre class="pseudo">CREATE TABLE JEU (
  idJeu       INT AUTO_INCREMENT PRIMARY KEY,   -- clé primaire du jeu
  titre       VARCHAR(120) NOT NULL,            -- titre obligatoire
  idCategorie INT NOT NULL,                     -- la catégorie du jeu (obligatoire)
  CONSTRAINT fk_jeu_cat FOREIGN KEY (idCategorie)  -- CONSTRAINT fk_jeu_cat = on NOMME cette contrainte ; FOREIGN KEY (idCategorie) = la colonne concernée…
    REFERENCES CATEGORIE(idCategorie)           -- …doit correspondre à un idCategorie EXISTANT dans la table CATEGORIE
) ENGINE=InnoDB;</pre>
<div class="warn">Seul le moteur <strong>InnoDB</strong> applique réellement les clés étrangères. Une table MyISAM accepte la syntaxe FOREIGN KEY mais l'IGNORE silencieusement (aucune erreur, mais aucune protection) : vérifie toujours <code>ENGINE=InnoDB</code>.</div>

<h3>4. Les autres contraintes</h3>
<p>Quatre règles très utilisées pour verrouiller le contenu d'une colonne :</p>
<pre class="pseudo">NOT NULL              -- la valeur est OBLIGATOIRE (interdit de laisser la case vide)
UNIQUE                -- interdit deux fois la même valeur dans la colonne (pas de doublon)
CHECK (prix &gt;= 0)     -- règle personnalisée : la valeur doit respecter la condition (ici prix positif ou nul). Réellement appliquée depuis MySQL 8.0.16
DEFAULT 0             -- valeur PAR DÉFAUT : mise automatiquement si on ne fournit rien</pre>
<div class="tip">La contrainte <code>CHECK</code> n'est réellement appliquée que depuis <strong>MySQL 8.0.16</strong>. Avant, MySQL l'acceptait mais l'ignorait : on validait alors côté application ou par un déclencheur (trigger).</div>

<h3>5. Actions référentielles</h3>
<p>Que faire quand on supprime une catégorie encore utilisée par des jeux ? Les <strong>actions référentielles</strong> le décident, avec <code>ON DELETE</code> / <code>ON UPDATE</code> :</p>
<pre class="pseudo">FOREIGN KEY (idCategorie) REFERENCES CATEGORIE(idCategorie)
  ON DELETE CASCADE      -- ON DELETE CASCADE = si on supprime une catégorie, ses jeux sont supprimés AVEC elle (l'action "en cascade")
  ON UPDATE CASCADE      -- ON UPDATE CASCADE = si l'id d'une catégorie change, le changement se propage aux jeux liés</pre>
<p>Par défaut (comportement <code>RESTRICT</code>), MySQL <strong>refuse</strong> de supprimer une catégorie encore référencée par un jeu : c'est une protection contre les « orphelins » (des jeux qui pointeraient vers une catégorie disparue).</p>`,
  exercises: [
    { type: "qcm", q: "Une contrainte…", opts: ["Trie", "Impose une règle et refuse les données invalides", "Accélère", "Supprime"], a: 1, exp: "Gardienne de l'intégrité." },
    { type: "qcm", q: "AUTO_INCREMENT génère…", opts: ["Des dates", "Les identifiants automatiquement", "Des doublons", "Du texte"], a: 1, exp: "1, 2, 3…" },
    { type: "qcm", q: "PRIMARY KEY impose…", opts: ["Un doublon", "Unique ET non NULL", "Rien", "Une valeur par défaut"], a: 1, exp: "Identifie chaque ligne." },
    { type: "qcm", q: "FOREIGN KEY garantit…", opts: ["L'unicité", "Que la valeur existe dans la table référencée", "Le tri", "La rapidité"], a: 1, exp: "Intégrité référentielle." },
    { type: "qcm", q: "Les clés étrangères sont appliquées par…", opts: ["MyISAM", "InnoDB", "MEMORY", "CSV"], a: 1, exp: "InnoDB seulement." },
    { type: "qcm", q: "MyISAM avec une FOREIGN KEY…", opts: ["L'applique", "L'accepte mais l'ignore", "Erreur", "Trie"], a: 1, exp: "Ignorée silencieusement." },
    { type: "qcm", q: "CHECK est réellement appliqué depuis…", opts: ["MySQL 5.5", "MySQL 8.0.16", "Toujours", "Jamais"], a: 1, exp: "Récent en MySQL." },
    { type: "qcm", q: "UNIQUE interdit…", opts: ["Les NULL toujours", "Les doublons sur la colonne", "Les clés", "Les jointures"], a: 1, exp: "Valeurs distinctes." },
    { type: "qcm", q: "DEFAULT 0 …", opts: ["Interdit 0", "Fournit 0 si aucune valeur", "Trie", "Supprime"], a: 1, exp: "Valeur par défaut." },
    { type: "qcm", q: "ON DELETE CASCADE …", opts: ["Refuse la suppression", "Supprime les lignes filles avec la mère", "Trie", "Ajoute"], a: 1, exp: "Propagation." },
    { type: "vf", q: "Par défaut, MySQL refuse de supprimer une catégorie référencée par un jeu.", a: true, exp: "RESTRICT." },
    { type: "qcm", q: "Une PRIMARY KEY peut contenir NULL ?", opts: ["Oui", "Non, jamais", "Une fois", "Selon le moteur"], a: 1, exp: "PK = non NULL." },
    { type: "vf", q: "Une contrainte agit même si l'application oublie de vérifier.", a: true, exp: "Défense au niveau base." },
    { type: "qcm", q: "Empêcher un stock négatif (MySQL 8.0.16+) :", opts: ["NOT NULL", "CHECK (stockLocation >= 0)", "UNIQUE", "DEFAULT"], a: 1, exp: "CHECK." },
    { type: "qcm", q: "AUTO_INCREMENT se combine souvent avec…", opts: ["FOREIGN KEY", "PRIMARY KEY", "CHECK", "DEFAULT"], a: 1, exp: "Clé auto-générée." }
  ],
  final: {
    title: "Exercice final — Une table blindée",
    intro: `<p>On crée JEU avec toutes les protections utiles, en InnoDB.</p>`,
    questions: [
      { type: "qcm", q: "Clé auto-incrémentée :", opts: ["idJeu INT UNIQUE", "idJeu INT AUTO_INCREMENT PRIMARY KEY", "idJeu TEXT", "idJeu DEFAULT 1"], a: 1, exp: "AUTO_INCREMENT + PK." },
      { type: "qcm", q: "Titre obligatoire :", opts: ["titre VARCHAR(120) NOT NULL", "titre INT", "titre UNIQUE seul", "titre DEFAULT"], a: 0, exp: "NOT NULL." },
      { type: "qcm", q: "Prix positif (MySQL 8.0.16+) :", opts: ["prix DECIMAL CHECK (prix > 0)", "prix NOT NULL seul", "prix UNIQUE", "prix DEFAULT 0"], a: 0, exp: "CHECK." },
      { type: "qcm", q: "Lier à CATEGORIE :", opts: ["FOREIGN KEY (idCategorie) REFERENCES CATEGORIE(idCategorie)", "UNIQUE idCategorie", "CHECK", "DEFAULT"], a: 0, exp: "Clé étrangère." },
      { type: "vf", q: "Sans ENGINE=InnoDB, la clé étrangère pourrait être ignorée.", a: true, exp: "InnoDB applique les FK." }
    ],
    solution: `<pre class="pseudo">CREATE TABLE JEU (
  idJeu         INT AUTO_INCREMENT PRIMARY KEY,          -- identité auto-générée
  titre         VARCHAR(120) NOT NULL,                   -- titre obligatoire
  prixLocation  DECIMAL(6,2) CHECK (prixLocation &gt; 0),   -- prix exact, forcé strictement positif (MySQL 8.0.16+)
  stockLocation INT NOT NULL DEFAULT 0 CHECK (stockLocation &gt;= 0),  -- stock obligatoire, 0 par défaut, jamais négatif
  idCategorie   INT NOT NULL,                            -- catégorie obligatoire
  CONSTRAINT fk_jeu_cat FOREIGN KEY (idCategorie)        -- clé étrangère nommée…
    REFERENCES CATEGORIE(idCategorie)                    -- …vers une catégorie existante
) ENGINE=InnoDB;                                         -- InnoDB : les clés étrangères sont réellement appliquées</pre>
<p>Tes données sont protégées. Demain : ALTER TABLE, vues et index.</p>`
  }
};
</script>

var ECRITURE = {
  placeholder: "Écris ton CREATE TABLE avec contraintes…",
  items: [
  { id: "mysql-l15", title: "La table LOUER protégée", level: 3,
    statement: "Écris le CREATE TABLE de LOUER en InnoDB : idLocation (clé auto-incrémentée), idClient et idJeu (obligatoires, clés étrangères vers CLIENT et JEU), dateDebut (obligatoire, par défaut la date du jour), nbJours (obligatoire, contraint entre 1 et 30). Nomme tes clés étrangères.",
    hints: [
      "idLocation INT AUTO_INCREMENT PRIMARY KEY.",
      "dateDebut DATE NOT NULL DEFAULT (CURDATE()) ; nbJours INT NOT NULL CHECK (nbJours BETWEEN 1 AND 30).",
      "CONSTRAINT fk_louer_client FOREIGN KEY (idClient) REFERENCES CLIENT(idClient), idem pour JEU ; ) ENGINE=InnoDB;"
    ],
    solution: "CREATE TABLE LOUER (\n  idLocation INT AUTO_INCREMENT PRIMARY KEY,\n  idClient   INT NOT NULL,\n  idJeu      INT NOT NULL,\n  dateDebut  DATE NOT NULL DEFAULT (CURDATE()),\n  nbJours    INT NOT NULL CHECK (nbJours BETWEEN 1 AND 30),\n  CONSTRAINT fk_louer_client FOREIGN KEY (idClient) REFERENCES CLIENT(idClient),\n  CONSTRAINT fk_louer_jeu    FOREIGN KEY (idJeu)    REFERENCES JEU(idJeu)\n) ENGINE=InnoDB;",
    note: "Chaque colonne porte sa règle : AUTO_INCREMENT+PK pour l'identité, NOT NULL pour l'obligation, DEFAULT (CURDATE()) pour la date automatique (les valeurs par défaut expression exigent des parenthèses en MySQL 8), CHECK BETWEEN pour borner la durée, et deux clés étrangères nommées, appliquées grâce à InnoDB." }
  ]
};
</script>
