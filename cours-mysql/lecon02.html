<script>
var DAY = {
  num: 2,
  title: "Types MySQL et CREATE TABLE (AUTO_INCREMENT)",
  subtitle: "Choisir les bons types et créer des tables en InnoDB.",
  theory: `
<h3>1. D'abord : c'est quoi un « type » ?</h3>
<p>Hier, on a vu qu'une <strong>table</strong> est un tableau, avec des <strong>colonnes</strong> (les catégories d'information) et des <strong>lignes</strong> (les fiches). Aujourd'hui on va CRÉER une table nous-mêmes. Mais avant, une notion essentielle : le <strong>type</strong>. Le <strong>type</strong> d'une colonne, c'est la <strong>nature</strong> des valeurs qu'elle a le droit de contenir. Pense à un formulaire papier : la case « âge » attend un <strong>nombre</strong>, la case « nom » attend du <strong>texte</strong>, la case « date de naissance » attend une <strong>date</strong>. Interdire de mettre du texte dans une case « âge », c'est exactement le rôle du type : il <strong>protège</strong> la table en refusant les valeurs qui n'ont pas de sens. Quand on crée une table, on doit donc annoncer, pour chaque colonne, quel type de valeur elle contiendra.</p>

<h3>2. Les grands types MySQL</h3>
<p>Voici les types les plus courants. À gauche le nom du type (le mot-clé qu'on écrit), à droite ce qu'il sert à ranger :</p>
<pre class="pseudo">INT, BIGINT, TINYINT      -- des nombres ENTIERS (sans virgule) : INT pour l'usage courant, BIGINT pour de très grands nombres, TINYINT pour de tout petits. TINYINT(1) sert souvent de "oui/non"
DECIMAL(p,s)              -- un nombre à virgule EXACT : p = nombre total de chiffres, s = chiffres après la virgule. DECIMAL(6,2) = jusqu'à 9999.99 (parfait pour un prix)
FLOAT, DOUBLE             -- des nombres à virgule APPROCHÉS (arrondis par la machine) : bien pour des mesures scientifiques, à éviter pour de l'argent
VARCHAR(n)                -- du TEXTE de longueur VARIABLE, au maximum n caractères. VARCHAR(60) = un texte d'au plus 60 caractères
CHAR(n)                   -- du texte de longueur FIXE : toujours n caractères exactement (utile pour un code de taille connue, ex. un pays sur 2 lettres)
TEXT                      -- du texte LONG (un commentaire, une description) qui dépasse ce qu'un VARCHAR peut stocker
DATE, DATETIME, TIMESTAMP -- des dates : DATE = juste une date (2026-07-13) ; DATETIME et TIMESTAMP = une date AVEC l'heure (2026-07-13 14:30:00)
BOOLEAN                   -- un vrai/faux : en réalité un simple alias (autre nom) de TINYINT(1), où 0 = faux et 1 = vrai</pre>
<p>Règle d'or : pour un <strong>prix</strong>, on utilise <code>DECIMAL</code> (exact), <strong>jamais</strong> FLOAT (approché) — sinon 10,10 € pourrait devenir 10,0999999… Pour du <strong>texte court</strong> (un nom, un titre), on utilise <code>VARCHAR(n)</code> en choisissant un n confortable.</p>

<h3>3. Créer une table avec CREATE TABLE et AUTO_INCREMENT</h3>
<p>La commande <code>CREATE TABLE</code> (« créer une table » en anglais) fabrique un nouveau tableau vide. On lui donne un nom, puis, entre parenthèses, la liste de ses colonnes avec le type de chacune. Voici une première table, CATEGORIE, qui rangera les catégories de jeux :</p>
<pre class="pseudo">CREATE TABLE CATEGORIE (            -- CREATE TABLE = crée une nouvelle table ; CATEGORIE = le nom qu'on lui donne ; la parenthèse ouvre la liste des colonnes
  idCategorie INT AUTO_INCREMENT PRIMARY KEY,  -- colonne idCategorie de type INT (entier). AUTO_INCREMENT = MySQL numérote tout seul 1,2,3… PRIMARY KEY = c'est la CLÉ PRIMAIRE (l'identifiant unique de chaque ligne)
  libelle     VARCHAR(60) NOT NULL   -- colonne libelle : du texte d'au plus 60 caractères. NOT NULL = interdit de laisser cette case VIDE (une catégorie doit avoir un nom)
) ENGINE=InnoDB;                     -- la parenthèse referme la liste ; ENGINE=InnoDB = on précise le MOTEUR de stockage (voir plus bas) ; le ; termine la commande</pre>
<p>Le mot <code>AUTO_INCREMENT</code> demande à MySQL de <strong>générer automatiquement</strong> les identifiants : la première ligne reçoit 1, la deuxième 2, la troisième 3… On n'a jamais à s'en occuper. C'est l'équivalent MySQL de l'<code>IDENTITY</code> de SQL Server (un autre SGBD). Une <strong>clé primaire</strong> (<code>PRIMARY KEY</code>) est la colonne qui identifie chaque ligne de façon UNIQUE, comme un numéro de sécurité sociale identifie une personne : deux lignes ne peuvent jamais avoir la même, et elle n'est jamais vide.</p>

<h3>4. Le moteur de stockage : InnoDB</h3>
<p>Sous le capot, MySQL peut ranger les données de plusieurs façons différentes : ce sont les <strong>moteurs de stockage</strong> (storage engines). Un <strong>moteur</strong>, c'est la « mécanique interne » qui décide comment les lignes sont écrites sur le disque et quelles fonctionnalités sont disponibles. Le moteur <code>InnoDB</code> (celui par défaut aujourd'hui) sait gérer deux choses très importantes : les <strong>transactions</strong> (grouper plusieurs actions en un bloc « tout ou rien », qu'on verra plus tard) et les <strong>clés étrangères</strong> (des liens entre tables). L'ancien moteur <code>MyISAM</code>, lui, ne sait PAS faire ça. C'est pourquoi on écrit <code>ENGINE=InnoDB</code> à la fin de nos créations, par sécurité.</p>

<h3>5. Une table avec clé étrangère</h3>
<p>Une <strong>clé étrangère</strong> (<code>FOREIGN KEY</code>, « clé venue d'ailleurs ») est une colonne qui pointe vers la clé primaire d'une AUTRE table, pour créer un lien. Ici, chaque jeu appartient à une catégorie : la table JEU garde donc un idCategorie qui « désigne » une ligne de la table CATEGORIE (comme un renvoi « voir fiche n°3 »). On approfondira les liens plus tard ; voici déjà la table JEU :</p>
<pre class="pseudo">CREATE TABLE JEU (                   -- crée la table JEU (elle listera tous les jeux)
  idJeu         INT AUTO_INCREMENT PRIMARY KEY,  -- identifiant unique du jeu, numéroté automatiquement, c'est la clé primaire
  titre         VARCHAR(120) NOT NULL,           -- le titre du jeu : texte d'au plus 120 caractères, obligatoire (NOT NULL)
  prixLocation  DECIMAL(6,2) NOT NULL,           -- le prix de location : nombre exact à 2 décimales, obligatoire
  stockVente    INT NOT NULL DEFAULT 0,          -- combien d'exemplaires en vente : entier ; DEFAULT 0 = vaut 0 si on ne précise rien
  stockLocation INT NOT NULL DEFAULT 0,          -- combien d'exemplaires en location : entier, 0 par défaut
  idCategorie   INT NOT NULL,                    -- l'identifiant de la catégorie du jeu : ce sera le lien vers la table CATEGORIE
  FOREIGN KEY (idCategorie) REFERENCES CATEGORIE(idCategorie)  -- FOREIGN KEY (…) = déclare la clé étrangère ; REFERENCES CATEGORIE(idCategorie) = elle doit correspondre à un idCategorie EXISTANT dans la table CATEGORIE
) ENGINE=InnoDB;                    -- moteur InnoDB : indispensable pour que la clé étrangère soit réellement appliquée</pre>

<h3>6. L'encodage : utf8mb4</h3>
<p>L'<strong>encodage</strong> (charset) est la façon dont le texte est enregistré sous forme de nombres dans l'ordinateur. Certains encodages anciens ne connaissent pas les accents ou les emojis et les remplacent par des caractères bizarres. Pour tout gérer correctement (é, à, ç, mais aussi 😀), on choisit <code>utf8mb4</code>, qui est le « vrai » UTF-8 de MySQL.</p>
<div class="tip">On peut fixer l'encodage par table en l'ajoutant à la fin : <code>) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;</code>. Attention : l'ancien « utf8 » de MySQL est INCOMPLET (il ne gère pas les emojis) — préfère toujours <strong>utf8mb4</strong>.</div>`,
  exercises: [
    { type: "qcm", q: "Pour un prix, le bon type est…", opts: ["FLOAT", "DECIMAL(6,2)", "INT", "TEXT"], a: 1, exp: "DECIMAL = exact." },
    { type: "qcm", q: "Un texte court de longueur variable :", opts: ["TEXT", "VARCHAR(n)", "CHAR(1000)", "BLOB"], a: 1, exp: "VARCHAR." },
    { type: "qcm", q: "AUTO_INCREMENT sert à…", opts: ["Trier", "Générer automatiquement les identifiants", "Chiffrer", "Indexer le texte"], a: 1, exp: "1, 2, 3…" },
    { type: "qcm", q: "AUTO_INCREMENT est l'équivalent MySQL de…", opts: ["SERIAL de PostgreSQL", "IDENTITY de SQL Server", "SEQUENCE Oracle", "ROWID"], a: 1, exp: "IDENTITY en T-SQL." },
    { type: "qcm", q: "Le moteur qui gère transactions et clés étrangères :", opts: ["MyISAM", "InnoDB", "MEMORY", "CSV"], a: 1, exp: "InnoDB." },
    { type: "qcm", q: "MyISAM, contrairement à InnoDB…", opts: ["Gère les transactions", "Ne gère ni transactions ni clés étrangères", "Est plus récent", "Chiffre les données"], a: 1, exp: "Ancien moteur limité." },
    { type: "qcm", q: "Un booléen en MySQL, c'est souvent…", opts: ["BIT", "TINYINT(1) / BOOLEAN", "CHAR(1)", "TEXT"], a: 1, exp: "BOOLEAN = alias TINYINT(1)." },
    { type: "qcm", q: "L'encodage recommandé :", opts: ["latin1", "utf8mb4", "ascii", "utf16"], a: 1, exp: "utf8mb4 (vrai UTF-8)." },
    { type: "qcm", q: "Un horodatage date + heure :", opts: ["DATE", "DATETIME", "YEAR", "TIME"], a: 1, exp: "DATETIME." },
    { type: "qcm", q: "Préciser le moteur à la création :", opts: ["ENGINE=InnoDB", "MOTEUR InnoDB", "USE InnoDB", "SET InnoDB"], a: 0, exp: ") ENGINE=InnoDB;" },
    { type: "vf", q: "On évite FLOAT pour un prix car il est approché.", a: true, exp: "DECIMAL est exact." },
    { type: "qcm", q: "PRIMARY KEY impose…", opts: ["Un doublon", "Unicité et non NULL", "Rien", "Une valeur par défaut"], a: 1, exp: "Identifie chaque ligne." },
    { type: "vf", q: "InnoDB est le moteur par défaut des versions récentes de MySQL.", a: true, exp: "Depuis MySQL 5.5." },
    { type: "qcm", q: "DEFAULT 0 sur stockVente…", opts: ["Interdit 0", "Donne 0 si aucune valeur n'est fournie", "Trie", "Chiffre"], a: 1, exp: "Valeur par défaut." },
    { type: "qcm", q: "CHAR(n) diffère de VARCHAR(n) car…", opts: ["Il est plus lent", "Il est de longueur fixe", "Il stocke des nombres", "Il chiffre"], a: 1, exp: "Longueur fixe." }
  ],
  final: {
    title: "Exercice final — Créer FOURNISSEUR",
    intro: `<p>On veut une table FOURNISSEUR bien typée, en InnoDB.</p>`,
    questions: [
      { type: "qcm", q: "Clé auto-générée :", opts: ["idFournisseur INT AUTO_INCREMENT PRIMARY KEY", "idFournisseur TEXT", "idFournisseur UNIQUE", "idFournisseur FLOAT"], a: 0, exp: "AUTO_INCREMENT + PK." },
      { type: "qcm", q: "Nom obligatoire :", opts: ["nom VARCHAR(80) NOT NULL", "nom INT", "nom TEXT UNIQUE", "nom DEFAULT"], a: 0, exp: "VARCHAR NOT NULL." },
      { type: "qcm", q: "Le moteur à préciser :", opts: ["ENGINE=MyISAM", "ENGINE=InnoDB", "ENGINE=MEMORY", "aucun"], a: 1, exp: "InnoDB." },
      { type: "qcm", q: "Un téléphone (peut manquer) :", opts: ["telephone VARCHAR(20)", "telephone INT NOT NULL", "telephone DECIMAL", "telephone DATE"], a: 0, exp: "VARCHAR, nullable." },
      { type: "vf", q: "Choisir InnoDB permettra à JEU d'avoir une vraie clé étrangère vers FOURNISSEUR.", a: true, exp: "InnoDB applique les FK." }
    ],
    solution: `<pre class="pseudo">CREATE TABLE FOURNISSEUR (            -- crée la table FOURNISSEUR
  idFournisseur INT AUTO_INCREMENT PRIMARY KEY,  -- identifiant unique auto-numéroté : la clé primaire
  nom           VARCHAR(80) NOT NULL,            -- nom du fournisseur : texte d'au plus 80 caractères, obligatoire
  telephone     VARCHAR(20)                      -- téléphone : texte d'au plus 20 caractères ; PAS de NOT NULL, donc il peut manquer (rester vide)
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;         -- moteur InnoDB (pour les clés étrangères) + encodage utf8mb4 (accents et emojis)</pre>
<p>Tes tables sont bien typées. Demain : les remplir avec INSERT.</p>`
  }
};
</script>

    ],
    solution: "CREATE TABLE JEU (\n  idJeu         INT AUTO_INCREMENT PRIMARY KEY,\n  titre         VARCHAR(120) NOT NULL,\n  prixAchat     DECIMAL(6,2) NOT NULL,\n  prixLocation  DECIMAL(6,2) NOT NULL,\n  stockVente    INT NOT NULL DEFAULT 0,\n  stockLocation INT NOT NULL DEFAULT 0,\n  idCategorie   INT NOT NULL,\n  FOREIGN KEY (idCategorie) REFERENCES CATEGORIE(idCategorie)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;",
