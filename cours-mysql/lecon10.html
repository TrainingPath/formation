<script>
var DAY = {
  num: 10,
  title: "Les jointures en MySQL",
  subtitle: "Relier les tables reliées par des clés étrangères.",
  theory: `
<h3>1. Pourquoi joindre ?</h3>
<p>Nos données sont réparties dans plusieurs tables reliées par des clés étrangères (leçon 2). Par exemple, la table JEU ne stocke que l'<code>idCategorie</code> (un numéro), pas le nom de la catégorie ; le nom (« Stratégie ») est dans la table CATEGORIE. Pour afficher « Catan — Stratégie », il faut aller chercher l'information dans les DEUX tables et les rapprocher. C'est exactement le rôle d'une <strong>jointure</strong> (<code>JOIN</code> en anglais) : <strong>relier deux tables</strong> en faisant correspondre une colonne de l'une avec une colonne de l'autre (ici, l'idCategorie de JEU avec l'idCategorie de CATEGORIE). C'est comme rapprocher deux listes grâce à un numéro commun.</p>

<h3>2. INNER JOIN</h3>
<p>Le <code>INNER JOIN</code> (« jointure interne ») relie les deux tables et ne garde QUE les lignes qui ont une correspondance des deux côtés. La condition de rapprochement se met après le mot-clé <code>ON</code> (« sur »). On donne aussi des alias courts aux tables (leçon 4) pour préfixer les colonnes et éviter toute confusion.</p>
<pre class="pseudo">SELECT j.titre, c.libelle          -- on veut le titre (table j) et le libellé de catégorie (table c)
FROM JEU AS j                      -- table JEU, surnommée j
INNER JOIN CATEGORIE AS c ON j.idCategorie = c.idCategorie;  -- INNER JOIN CATEGORIE (surnommée c) ON … = rapproche chaque jeu de sa catégorie là où les idCategorie sont ÉGAUX</pre>
<p>Résultat : seules les lignes ayant une correspondance dans les deux tables apparaissent (un jeu sans catégorie valable serait exclu).</p>

<h3>3. LEFT JOIN</h3>
<p>Le <code>LEFT JOIN</code> (« jointure externe gauche ») garde TOUTES les lignes de la table de GAUCHE (celle du FROM), même celles qui n'ont pas de correspondance à droite. Quand il n'y a pas de correspondance, les colonnes de la table de droite valent <code>NULL</code> (vides). Idéal quand une relation est facultative.</p>
<pre class="pseudo">SELECT j.titre, f.nom
FROM JEU AS j
LEFT JOIN FOURNISSEUR AS f ON j.idFournisseur = f.idFournisseur;  -- LEFT JOIN = garde TOUS les jeux, avec le nom du fournisseur quand il existe
-- les jeux sans fournisseur : f.nom = NULL   -- pour un jeu sans fournisseur, il n'y a pas de correspondance, donc f.nom vaut NULL</pre>

<h3>4. Joindre plusieurs tables et agréger</h3>
<p>On peut enchaîner jointures et agrégation. Ici, on compte les locations de CHAQUE jeu, y compris ceux jamais loués (grâce au LEFT JOIN qui les conserve) :</p>
<pre class="pseudo">-- nombre de locations par jeu, 0 compris
SELECT j.titre, COUNT(l.idJeu) AS nb_locations  -- pour chaque jeu, on compte les lignes de location associées
FROM JEU AS j
LEFT JOIN LOUER AS l ON j.idJeu = l.idJeu   -- LEFT JOIN garde les jeux même sans location (l.idJeu sera NULL)
GROUP BY j.titre                            -- un groupe par jeu
ORDER BY nb_locations DESC;                 -- du plus loué au moins loué. COUNT(l.idJeu) ignore les NULL → 0 pour un jeu jamais loué</pre>

<h3>5. MySQL n'a pas de FULL OUTER JOIN</h3>
<div class="tip">Un <code>FULL OUTER JOIN</code> garderait les lignes non appariées des DEUX côtés à la fois. MySQL ne le propose pas (ni un <code>RIGHT JOIN</code> vraiment indispensable) : on le reconstitue en combinant un <code>LEFT JOIN</code> et un <code>RIGHT JOIN</code> reliés par <code>UNION</code> (qui empile deux résultats). En pratique, <code>INNER</code> et <code>LEFT</code> couvrent l'immense majorité des besoins.</div>`,
  exercises: [
    { type: "qcm", q: "Une jointure sert à…", opts: ["Trier", "Relier des tables sur une clé", "Compter", "Supprimer"], a: 1, exp: "Rassembler des données liées." },
    { type: "qcm", q: "INNER JOIN garde…", opts: ["Tout à gauche", "Les lignes avec correspondance des deux côtés", "Les NULL", "Rien"], a: 1, exp: "Intersection." },
    { type: "qcm", q: "LEFT JOIN garde…", opts: ["Rien à gauche", "Toutes les lignes de gauche, même sans correspondance", "La droite seule", "Les doublons"], a: 1, exp: "Tout à gauche." },
    { type: "qcm", q: "La condition de jointure va après…", opts: ["WHERE", "ON", "HAVING", "GROUP"], a: 1, exp: "JOIN ... ON ..." },
    { type: "qcm", q: "Afficher titre + libellé :", opts: ["Deux SELECT", "JOIN JEU et CATEGORIE sur idCategorie", "GROUP BY", "LIMIT"], a: 1, exp: "Jointure sur la clé." },
    { type: "qcm", q: "Jeux sans fournisseur (LEFT JOIN) : f.nom =", opts: ["0", "NULL", "''", "-1"], a: 1, exp: "Pas de correspondance." },
    { type: "qcm", q: "Un alias de table (j) sert à…", opts: ["Trier", "Raccourcir et lever l'ambiguïté des colonnes", "Compter", "Filtrer"], a: 1, exp: "JEU AS j." },
    { type: "qcm", q: "Compter les locations par jeu, 0 compris :", opts: ["INNER JOIN + COUNT(*)", "LEFT JOIN + COUNT(l.idJeu)", "WHERE", "LIMIT"], a: 1, exp: "LEFT JOIN garde les non-loués." },
    { type: "qcm", q: "COUNT(l.idJeu) sur un LEFT JOIN non apparié donne…", opts: ["1", "0 (le NULL n'est pas compté)", "NULL", "une erreur"], a: 1, exp: "COUNT ignore le NULL." },
    { type: "qcm", q: "MySQL propose-t-il FULL OUTER JOIN ?", opts: ["Oui", "Non (on le simule par LEFT UNION RIGHT)", "Toujours", "Seulement en 8"], a: 1, exp: "Absent nativement." },
    { type: "vf", q: "La syntaxe INNER/LEFT JOIN ... ON est standard en MySQL.", a: true, exp: "Comme partout." },
    { type: "qcm", q: "j.idCategorie = c.idCategorie est…", opts: ["Un tri", "La condition de correspondance", "Un agrégat", "Un index"], a: 1, exp: "Égalité des clés." },
    { type: "vf", q: "Un INNER JOIN élimine les jeux sans catégorie correspondante.", a: true, exp: "Pas de correspondance = exclu." },
    { type: "qcm", q: "Simuler un FULL OUTER JOIN en MySQL :", opts: ["FULL JOIN", "LEFT JOIN UNION RIGHT JOIN", "CROSS JOIN", "DOUBLE JOIN"], a: 1, exp: "Combinaison + UNION." },
    { type: "qcm", q: "Locations d'un client avec son nom :", opts: ["JOIN LOUER, CLIENT, JEU", "Un seul SELECT sur LOUER", "GROUP BY seul", "LIMIT"], a: 0, exp: "Chaîner les jointures." }
  ],
  final: {
    title: "Exercice final — Relier les tables",
    intro: `<p>JEU(idJeu, titre, idCategorie, idFournisseur), CATEGORIE(idCategorie, libelle), FOURNISSEUR(idFournisseur, nom), LOUER(idJeu, idClient).</p>`,
    questions: [
      { type: "qcm", q: "Titre + libellé de catégorie :", opts: ["INNER JOIN CATEGORIE ON j.idCategorie = c.idCategorie", "Deux requêtes", "GROUP BY", "LIMIT"], a: 0, exp: "Jointure." },
      { type: "qcm", q: "Tous les jeux, fournisseur si présent :", opts: ["INNER JOIN FOURNISSEUR", "LEFT JOIN FOURNISSEUR", "CROSS JOIN", "WHERE"], a: 1, exp: "LEFT JOIN." },
      { type: "qcm", q: "Nombre de locations par jeu (0 compris) :", opts: ["INNER JOIN + COUNT(*)", "LEFT JOIN LOUER + COUNT(l.idJeu) GROUP BY j.titre", "WHERE", "LIMIT"], a: 1, exp: "LEFT JOIN + COUNT colonne." },
      { type: "qcm", q: "La condition de jointure va après…", opts: ["WHERE", "ON", "SET", "AS"], a: 1, exp: "JOIN ... ON." },
      { type: "vf", q: "Un jeu sans fournisseur disparaît avec INNER JOIN mais reste avec LEFT JOIN.", a: true, exp: "Différence clé." }
    ],
    solution: `<pre class="pseudo">SELECT j.titre, c.libelle, f.nom
FROM JEU AS j
INNER JOIN CATEGORIE AS c ON j.idCategorie = c.idCategorie   -- catégorie obligatoire : INNER
LEFT  JOIN FOURNISSEUR AS f ON j.idFournisseur = f.idFournisseur;  -- fournisseur facultatif : LEFT (f.nom peut être NULL)

SELECT j.titre, COUNT(l.idJeu) AS nb_locations   -- nombre de locations par jeu
FROM JEU AS j
LEFT JOIN LOUER AS l ON j.idJeu = l.idJeu   -- LEFT : garde aussi les jeux jamais loués
GROUP BY j.titre;                           -- un total par jeu (0 pour les non-loués)</pre>
<p>Tu relies tout le modèle. Demain : sous-requêtes et CTE.</p>`
  }
};
</script>
