  num: 13,
  title: "UNION et opérateurs d'ensemble",
  subtitle: "Combiner les résultats de plusieurs requêtes.",
  theory: `
<h3>1. Empiler deux résultats : UNION</h3>
<p>Jusqu'ici on écrivait une seule requête. Parfois on veut RÉUNIR les résultats de DEUX requêtes en une seule liste (par exemple : les clients qui ont loué, PLUS ceux qui ont acheté). Les <strong>opérateurs d'ensemble</strong> servent à cela : ils combinent des résultats comme on combine des ensembles en mathématiques. Le plus courant est <code>UNION</code> (« réunion »), qui empile les lignes des deux requêtes et <strong>supprime les doublons</strong> :</p>
<pre class="pseudo">SELECT idClient FROM LOUER      -- première liste : les clients qui ont loué
UNION                           -- UNION = réunit les deux listes en une seule, SANS doublon
SELECT idClient FROM ACHETER;   -- seconde liste : les clients qui ont acheté ; résultat = clients ayant loué OU acheté, chacun une seule fois</pre>
<p>Condition indispensable : les deux <code>SELECT</code> doivent avoir le <strong>même nombre de colonnes</strong>, dans le même ordre, avec des <strong>types compatibles</strong> (on ne peut pas empiler du texte sous des nombres).</p>

<h3>2. UNION vs UNION ALL</h3>
<p>Deux variantes, selon qu'on veut ou non éliminer les doublons :</p>
<pre class="pseudo">UNION       -- réunion SANS doublon : MySQL trie et retire les répétitions (donc un peu plus lent)
UNION ALL   -- réunion AVEC doublons : garde tout tel quel, sans dédoublonner (donc plus rapide)</pre>
<p>Si tu es sûr qu'il n'y a pas de doublon (ou que les doublons ne te gênent pas), <code>UNION ALL</code> est plus efficace car il évite le travail de déduplication.</p>

<h3>3. INTERSECT et EXCEPT (MySQL 8.0.31+)</h3>
<p>Deux autres opérateurs d'ensemble : <code>INTERSECT</code> (« intersection ») ne garde que les lignes présentes dans LES DEUX requêtes ; <code>EXCEPT</code> (« sauf ») garde les lignes de la première qui ne sont PAS dans la seconde.</p>
<pre class="pseudo">-- clients ayant loué ET acheté
SELECT idClient FROM LOUER
INTERSECT                        -- INTERSECT = seulement ce qui est dans LES DEUX listes (le commun)
SELECT idClient FROM ACHETER;

-- clients ayant loué mais jamais acheté
SELECT idClient FROM LOUER
EXCEPT                           -- EXCEPT = ce qui est dans la 1re liste MAIS PAS dans la 2e
SELECT idClient FROM ACHETER;</pre>
<div class="warn"><code>INTERSECT</code> et <code>EXCEPT</code> ne sont arrivés qu'avec <strong>MySQL 8.0.31</strong>. Sur une version antérieure, on les simule : INTERSECT par un <code>IN</code> (ou un JOIN), EXCEPT par un <code>NOT IN</code> (ou un LEFT JOIN … IS NULL).</div>

<h3>4. Ordonner un résultat combiné</h3>
<p>Pour trier le résultat GLOBAL (et pas chaque requête séparément), on place un seul <code>ORDER BY</code> à la toute fin. On met souvent chaque SELECT entre parenthèses pour bien montrer que le tri porte sur l'ensemble :</p>
<pre class="pseudo">(SELECT titre FROM JEU WHERE idCategorie = 1)   -- première liste (entre parenthèses)
UNION
(SELECT titre FROM JEU WHERE prixLocation &lt; 3)  -- seconde liste
ORDER BY titre;   -- ce ORDER BY final s'applique au résultat combiné des deux SELECT</pre>

<h3>5. Colonnes compatibles</h3>
<p>Rappel important : les colonnes des SELECT combinés doivent correspondre en <strong>nombre</strong> et en <strong>type</strong>. Les noms de colonnes affichés dans le résultat final sont toujours ceux du <strong>premier</strong> SELECT (les alias du second sont ignorés).</p>`,
  exercises: [
    { type: "qcm", q: "UNION combine deux résultats…", opts: ["Avec doublons", "Sans doublon (réunion)", "En colonnes", "En les multipliant"], a: 1, exp: "Réunion dédupliquée." },
    { type: "qcm", q: "UNION ALL …", opts: ["Supprime les doublons", "Garde les doublons (plus rapide)", "Trie", "Intersecte"], a: 1, exp: "Conserve tout." },
    { type: "qcm", q: "INTERSECT renvoie…", opts: ["Tout", "Les lignes communes aux deux", "La différence", "Les doublons"], a: 1, exp: "Intersection." },
    { type: "qcm", q: "EXCEPT renvoie…", opts: ["L'union", "Les lignes du 1er absentes du 2nd", "Le commun", "Rien"], a: 1, exp: "Différence." },
    { type: "qcm", q: "INTERSECT/EXCEPT existent depuis…", opts: ["MySQL 5.7", "MySQL 8.0.31", "Toujours", "Jamais"], a: 1, exp: "Récents en MySQL." },
    { type: "qcm", q: "Pour combiner deux SELECT, il faut…", opts: ["Des colonnes différentes", "Le même nombre de colonnes, types compatibles", "Un JOIN", "Un index"], a: 1, exp: "Compatibilité." },
    { type: "qcm", q: "Simuler INTERSECT avant 8.0.31 :", opts: ["Un IN (ou JOIN)", "Un LIMIT", "Un GROUP BY", "Impossible"], a: 0, exp: "IN sur la sous-requête." },
    { type: "qcm", q: "Simuler EXCEPT avant 8.0.31 :", opts: ["Un NOT IN (ou LEFT JOIN ... IS NULL)", "Un UNION", "Un LIMIT", "Un HAVING"], a: 0, exp: "NOT IN." },
    { type: "qcm", q: "Les noms de colonnes du résultat viennent…", opts: ["Du dernier SELECT", "Du premier SELECT", "Au hasard", "De la table"], a: 1, exp: "Premier SELECT." },
    { type: "qcm", q: "UNION ALL est préféré quand…", opts: ["On veut dédupliquer", "On sait qu'il n'y a pas de doublon (perf)", "On trie", "On supprime"], a: 1, exp: "Plus rapide." },
    { type: "vf", q: "UNION supprime les doublons, UNION ALL les garde.", a: true, exp: "Différence clé." },
    { type: "qcm", q: "Ordonner un résultat combiné :", opts: ["Un ORDER BY par SELECT", "Un ORDER BY global après le dernier SELECT", "Impossible", "LIMIT"], a: 1, exp: "Tri sur l'ensemble." },
    { type: "vf", q: "Les colonnes combinées doivent correspondre en nombre et en type.", a: true, exp: "Compatibilité requise." },
    { type: "qcm", q: "Clients ayant loué OU acheté :", opts: ["INTERSECT", "UNION", "EXCEPT", "JOIN"], a: 1, exp: "UNION." },
    { type: "qcm", q: "Clients ayant loué ET acheté (MySQL 8.0.31) :", opts: ["UNION", "INTERSECT", "EXCEPT", "UNION ALL"], a: 1, exp: "INTERSECT." }
  ],
  final: {
    title: "Exercice final — Combiner des listes",
    intro: `<p>LOUER(idClient, idJeu), ACHETER(idClient, idJeu).</p>`,
    questions: [
      { type: "qcm", q: "Clients actifs (loué ou acheté), sans doublon :", opts: ["UNION", "UNION ALL", "JOIN", "INTERSECT"], a: 0, exp: "UNION." },
      { type: "qcm", q: "Clients ayant loué ET acheté :", opts: ["UNION", "INTERSECT", "EXCEPT", "LEFT JOIN"], a: 1, exp: "INTERSECT." },
      { type: "qcm", q: "Clients ayant loué mais jamais acheté :", opts: ["UNION", "EXCEPT", "INTERSECT", "UNION ALL"], a: 1, exp: "EXCEPT." },
      { type: "qcm", q: "Si INTERSECT n'est pas disponible, on utilise…", opts: ["IN (SELECT ...)", "LIMIT", "GROUP BY", "ORDER BY"], a: 0, exp: "IN." },
      { type: "vf", q: "UNION ALL est plus rapide car il ne dédoublonne pas.", a: true, exp: "Pas de tri de déduplication." }
    ],
    solution: `<pre class="pseudo">-- actifs (union)
SELECT idClient FROM LOUER
UNION                            -- réunit les deux listes sans doublon
SELECT idClient FROM ACHETER;

-- ayant loué ET acheté (MySQL 8.0.31+)
SELECT idClient FROM LOUER
INTERSECT                        -- ne garde que le commun aux deux listes
SELECT idClient FROM ACHETER;

-- équivalent portable de l'INTERSECT (marche sur toutes les versions)
SELECT DISTINCT idClient FROM LOUER
WHERE idClient IN (SELECT idClient FROM ACHETER);  -- clients de LOUER qui sont AUSSI dans ACHETER</pre>
<p>Tu combines des ensembles. Demain : modifier et supprimer.</p>`
  }
