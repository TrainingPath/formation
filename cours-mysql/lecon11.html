  title: "Sous-requêtes et CTE (WITH)",
  subtitle: "Une requête dans la requête, et les tables temporaires nommées.",
  theory: `
<h3>1. C'est quoi une sous-requête ?</h3>
<p>Une <strong>sous-requête</strong> est simplement une requête <code>SELECT</code> placée À L'INTÉRIEUR d'une autre requête (entre parenthèses). La requête du dessus s'appelle la <strong>requête externe</strong> ; celle du dedans, la sous-requête, calcule d'abord un résultat que la requête externe réutilise. C'est comme faire un calcul intermédiaire au brouillon avant de s'en servir. Ici, la sous-requête calcule le prix moyen, et la requête externe s'en sert pour ne garder que les jeux plus chers que cette moyenne :</p>
<pre class="pseudo">SELECT titre, prixLocation
FROM JEU
WHERE prixLocation &gt; (SELECT AVG(prixLocation) FROM JEU);  -- entre parenthèses : la sous-requête calcule le prix moyen ; la requête externe garde les jeux dont le prix DÉPASSE cette moyenne</pre>
<p>Ici la sous-requête renvoie UNE seule valeur (le prix moyen) : on parle de sous-requête <strong>scalaire</strong> (« scalaire » = une valeur unique).</p>

<h3>2. Sous-requête avec IN</h3>
<p>Une sous-requête peut aussi renvoyer une LISTE de valeurs. On la combine alors avec <code>IN</code> (leçon 5) pour tester l'appartenance à cette liste :</p>
<pre class="pseudo">SELECT titre FROM JEU
WHERE idCategorie IN (SELECT idCategorie FROM CATEGORIE WHERE libelle LIKE 'Famille%');  -- la sous-requête renvoie la liste des idCategorie dont le libellé commence par "Famille" ; on garde les jeux dont l'idCategorie EST DANS cette liste</pre>

<h3>3. EXISTS</h3>
<p><code>EXISTS</code> (« existe ») teste s'il existe AU MOINS UNE ligne correspondant à la sous-requête. Il renvoie vrai/faux, sans se soucier du contenu. Souvent la sous-requête est <strong>corrélée</strong> : elle dépend de la ligne en cours d'examen dans la requête externe (ici <code>l.idJeu = j.idJeu</code> relie les deux).</p>
<pre class="pseudo">SELECT titre FROM JEU AS j
WHERE EXISTS (SELECT 1 FROM LOUER AS l WHERE l.idJeu = j.idJeu);  -- EXISTS = "y a-t-il au moins une location pour CE jeu ?" ; le SELECT 1 est arbitraire, seule compte la présence d'une ligne</pre>
<p>Le <code>1</code> dans <code>SELECT 1</code> n'a aucune importance : on aurait pu écrire n'importe quoi. Ce qui compte, c'est UNIQUEMENT de savoir si la sous-requête ramène ou non une ligne.</p>

<h3>4. La CTE : WITH ... AS (MySQL 8)</h3>
<p>Une <strong>CTE</strong> (Common Table Expression, « expression de table commune ») est une sous-requête à laquelle on donne un NOM, déclarée en tête avec <code>WITH</code>. C'est comme un résultat intermédiaire nommé, réutilisable ensuite comme s'il s'agissait d'une table. Ça rend le code bien plus lisible que des sous-requêtes emboîtées. Disponible depuis <strong>MySQL 8.0</strong> :</p>
<pre class="pseudo">WITH stats AS (                          -- WITH stats AS (…) = on définit une CTE nommée "stats"…
  SELECT idCategorie, AVG(prixLocation) AS moyenne  -- …dont le contenu est : le prix moyen par catégorie
  FROM JEU GROUP BY idCategorie
)
SELECT c.libelle, s.moyenne              -- ensuite, la requête principale utilise "stats" comme une table…
FROM stats AS s
INNER JOIN CATEGORIE AS c ON c.idCategorie = s.idCategorie;  -- …qu'on joint à CATEGORIE pour afficher le libellé à côté de la moyenne</pre>

<h3>5. CTE récursive</h3>
<div class="tip"><strong>Récursif</strong> signifie « qui se rappelle lui-même », étape après étape. MySQL 8 gère les <strong>CTE récursives</strong> (<code>WITH RECURSIVE</code>), utiles pour parcourir des <strong>hiérarchies</strong> (des arbres : un salarié et son chef, une catégorie et ses sous-catégories…). Avant MySQL 8, ni <code>WITH</code> ni la récursivité n'existaient : on devait imbriquer des sous-requêtes, moins lisibles.</div>`,

    { type: "qcm", q: "La récursivité en MySQL 8 :", opts: ["WITH RECURSIVE", "LOOP", "GOTO", "REPEAT"], a: 0, exp: "CTE récursive." },
    { type: "qcm", q: "EXISTS (SELECT 1 ...) : le « 1 » …", opts: ["Compte les lignes", "Est arbitraire, seule compte la présence d'une ligne", "Trie", "Additionne"], a: 1, exp: "La valeur importe peu." },
    { type: "qcm", q: "Un avantage de la CTE :", opts: ["Elle est stockée", "Elle rend le code lisible et réutilisable", "Elle trie", "Elle indexe"], a: 1, exp: "Lisibilité." },
    { type: "vf", q: "Une CTE n'est pas une table stockée en base.", a: true, exp: "Temporaire." },
    { type: "qcm", q: "Corréler une sous-requête (l.idJeu = j.idJeu) :", opts: ["Elle est indépendante", "Elle dépend de la ligne courante externe", "Elle trie", "Elle est fausse"], a: 1, exp: "Sous-requête corrélée." },
    { type: "vf", q: "Avant MySQL 8, WITH n'existait pas.", a: true, exp: "Nouveauté de la 8." },
    { type: "qcm", q: "Catégories dont le libellé commence par « Famille » :", opts: ["JOIN obligatoire", "IN (SELECT idCategorie FROM CATEGORIE WHERE libelle LIKE 'Famille%')", "LIMIT", "HAVING"], a: 1, exp: "Sous-requête IN." },
    { type: "qcm", q: "Une CTE se lit…", opts: ["De bas en haut", "Comme une étape nommée avant la requête principale", "En parallèle", "Après le LIMIT"], a: 1, exp: "Étape lisible." }
  ],
  final: {
    title: "Exercice final — Requêtes imbriquées",
    intro: `<p>JEU(idJeu, titre, prixLocation, idCategorie), LOUER(idJeu, idClient), CATEGORIE(idCategorie, libelle). MySQL 8.</p>`,
    questions: [

      { type: "qcm", q: "Moyenne par catégorie via une CTE :", opts: ["WITH stats AS (SELECT idCategorie, AVG(prixLocation)... GROUP BY idCategorie)", "DECLARE stats", "TEMP stats", "SET stats"], a: 0, exp: "WITH ... AS." },

      { type: "vf", q: "WITH RECURSIVE permet de parcourir une hiérarchie en MySQL 8.", a: true, exp: "CTE récursive." }
    ],
    solution: `<pre class="pseudo">SELECT titre FROM JEU
WHERE prixLocation &gt; (SELECT AVG(prixLocation) FROM JEU);  -- jeux plus chers que le prix moyen (sous-requête scalaire)

WITH stats AS (                          -- CTE "stats" : le prix moyen par catégorie
  SELECT idCategorie, AVG(prixLocation) AS moyenne
  FROM JEU GROUP BY idCategorie
)
SELECT c.libelle, s.moyenne              -- on affiche le libellé et sa moyenne…
FROM stats s JOIN CATEGORIE c ON c.idCategorie = s.idCategorie;  -- …en joignant la CTE à CATEGORIE</pre>
<p>Tu structures des requêtes complexes. Demain : les fonctions de fenêtrage.</p>`
  }
};
