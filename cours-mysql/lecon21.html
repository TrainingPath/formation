<script>
var DAY = {
  num: 21,
  title: "Examen final MySQL",
  subtitle: "Tout MySQL en une épreuve : du SELECT aux triggers.",
  theory: `
<h3>Récapitulatif avant l'épreuve</h3>
<p>Vingt leçons, une Ludothèque complète en MySQL. Prends deux minutes pour te remémorer les grandes idées, puis lance-toi dans les 20 questions. Rappel du vocabulaire de base : un <strong>SGBD</strong> (Système de Gestion de Base de Données) est le logiciel qui range et retrouve les données ; une <strong>base de données</strong> est l'ensemble organisé de ces données ; une <strong>table</strong> est un tableau à <strong>colonnes</strong> (catégories d'info) et <strong>lignes</strong> (fiches) ; une <strong>requête</strong> est un ordre qu'on adresse à la base.</p>

<h3>1. Le socle</h3>
<p>MySQL s'explore avec <code>SHOW</code>/<code>DESCRIBE</code> (afficher les bases, les tables, la structure) et se pilote via la console ou l'interface graphique Workbench. Les tables se créent en <code>InnoDB</code> (le moteur qui gère clés étrangères et transactions) avec une clé <code>AUTO_INCREMENT PRIMARY KEY</code> (identifiant unique auto-numéroté), des <strong>types</strong> (<code>INT</code> pour un entier, <code>VARCHAR</code> pour du texte court, <code>DECIMAL</code> pour un nombre exact, <code>DATE</code> pour une date) et des <strong>contraintes</strong> — des règles imposées par la base : <code>NOT NULL</code> (obligatoire), <code>UNIQUE</code> (pas de doublon), <code>CHECK</code> (condition), <code>FOREIGN KEY</code> (lien valide vers une autre table).</p>

<h3>2. Interroger</h3>
<p><code>SELECT</code> (lire), <code>WHERE</code> (filtrer les lignes), <code>LIMIT</code>/<code>OFFSET</code> (paginer), les <strong>fonctions</strong> (<code>CONCAT</code> pour coller du texte, <code>IFNULL</code> pour remplacer un vide, <code>DATE_ADD</code> pour ajouter une durée, <code>IF</code> pour un choix), les <strong>agrégats</strong> (résumés) avec <code>GROUP BY</code>/<code>HAVING</code>, les <code>JOIN</code> (relier des tables), les <strong>sous-requêtes</strong> (requête dans la requête), les <strong>CTE</strong> (sous-requêtes nommées avec <code>WITH</code>) et le <strong>fenêtrage</strong> (<code>ROW_NUMBER OVER</code>, MySQL 8, pour classer sans fusionner), <code>UNION</code> (réunir deux résultats).</p>

<h3>3. Modifier et automatiser</h3>
<p><code>UPDATE</code>/<code>DELETE</code> (modifier/supprimer — toujours avec un <code>WHERE</code> !), les <strong>transactions</strong> <code>START TRANSACTION</code>/<code>COMMIT</code>/<code>ROLLBACK</code> (groupe d'écritures « tout ou rien », propriétés ACID, moteur InnoDB), les <strong>vues</strong> (requêtes enregistrées), les <strong>index</strong> (accélérer les recherches, vérifiés par <code>EXPLAIN</code>), les <strong>procédures stockées</strong> (traitements réutilisables : <code>DELIMITER</code>, <code>CALL</code>) et les <strong>triggers</strong> (déclencheurs automatiques : <code>NEW</code>/<code>OLD</code>, <code>FOR EACH ROW</code>).</p>
<div class="tip">Conseil d'examen : repère les mots-clés propres à MySQL (AUTO_INCREMENT, LIMIT, IFNULL, CONCAT, LAST_INSERT_ID, DELIMITER, CALL, InnoDB), et souviens-toi que la bonne réponse n'est pas la plus longue. Bonne chance !</div>`,
  exercises: [
    { type: "qcm", q: "Explorer la structure d'une table :", opts: ["SHOW STRUCT", "DESCRIBE table", "TABLE INFO", "READ table"], a: 1, exp: "DESCRIBE / DESC." },
    { type: "qcm", q: "Une clé auto-incrémentée :", opts: ["IDENTITY(1,1)", "AUTO_INCREMENT", "SERIAL Oracle", "SEQUENCE"], a: 1, exp: "AUTO_INCREMENT." },
    { type: "qcm", q: "Le moteur pour FK et transactions :", opts: ["MyISAM", "InnoDB", "MEMORY", "CSV"], a: 1, exp: "InnoDB." },
    { type: "qcm", q: "Limiter à 5 lignes :", opts: ["TOP 5", "LIMIT 5", "FETCH 5", "ROWNUM 5"], a: 1, exp: "LIMIT." },
    { type: "qcm", q: "Paginer :", opts: ["OFFSET/FETCH", "LIMIT n OFFSET p", "TOP page", "SKIP"], a: 1, exp: "LIMIT/OFFSET." },
    { type: "qcm", q: "Concaténer du texte :", opts: ["titre + ' €'", "CONCAT(titre, ' €')", "titre . ' €'", "titre & ' €'"], a: 1, exp: "CONCAT." },
    { type: "qcm", q: "Remplacer un NULL (2 arguments) :", opts: ["ISNULL", "IFNULL(x, y)", "NVL", "NULLIF"], a: 1, exp: "IFNULL." },
    { type: "qcm", q: "Récupérer l'id généré :", opts: ["SCOPE_IDENTITY()", "LAST_INSERT_ID()", "@@IDENTITY", "GET_ID"], a: 1, exp: "LAST_INSERT_ID()." },
    { type: "qcm", q: "Filtrer les groupes :", opts: ["WHERE", "HAVING", "LIMIT", "ORDER BY"], a: 1, exp: "HAVING." },
    { type: "qcm", q: "Garder toutes les lignes de gauche :", opts: ["INNER JOIN", "LEFT JOIN", "CROSS JOIN", "FULL seul"], a: 1, exp: "LEFT JOIN." },
    { type: "qcm", q: "Numéroter par groupe (MySQL 8) :", opts: ["GROUP BY", "ROW_NUMBER() OVER (PARTITION BY ...)", "LIMIT", "RANK sans OVER"], a: 1, exp: "Fenêtrage." },
    { type: "qcm", q: "Une sous-requête nommée (MySQL 8) :", opts: ["un index", "une CTE (WITH)", "une vue matérialisée", "un trigger"], a: 1, exp: "CTE." },
    { type: "qcm", q: "Rendre deux écritures indivisibles :", opts: ["un index", "une transaction (START TRANSACTION/COMMIT)", "un LIMIT", "une vue"], a: 1, exp: "Transaction." },
    { type: "qcm", q: "Ajouter une durée à une date :", opts: ["date + 7", "DATE_ADD(date, INTERVAL 7 DAY)", "ADDDATE only", "date.plus"], a: 1, exp: "DATE_ADD." },
    { type: "qcm", q: "Un traitement réutilisable stocké :", opts: ["une vue", "une procédure stockée", "un index", "un CHECK"], a: 1, exp: "Procédure." },
    { type: "qcm", q: "Appeler une procédure :", opts: ["EXEC", "CALL", "RUN", "DO"], a: 1, exp: "CALL." },
    { type: "qcm", q: "Définir procédure/trigger sans couper sur ; :", opts: ["SET ;", "DELIMITER $$", "ESCAPE", "QUOTE"], a: 1, exp: "DELIMITER." },
    { type: "qcm", q: "Dans un trigger, la nouvelle ligne :", opts: ["OLD", "NEW", "inserted", "rows"], a: 1, exp: "NEW." },
    { type: "qcm", q: "Réunir deux résultats sans doublon :", opts: ["JOIN", "UNION", "INTERSECT", "EXCEPT"], a: 1, exp: "UNION." },
    { type: "qcm", q: "Le modèle Ludothèque a deux stocks :", opts: ["neuf et occasion", "stockVente et stockLocation", "achat et retour", "un seul"], a: 1, exp: "Vente et location." }
  ],
  final: {
    title: "Épreuve pratique — Piloter la Ludothèque",
    intro: `<p>Schéma : JEU(idJeu, titre, prixLocation, stockLocation, idCategorie, idFournisseur), CATEGORIE(idCategorie, libelle), LOUER(idClient, idJeu, dateDebut). Réponds :</p>`,
    questions: [
      { type: "qcm", q: "Les 3 jeux les plus chers à louer :", opts: ["ORDER BY prixLocation DESC LIMIT 3", "TOP 3", "LIMIT 3 sans tri", "MAX 3"], a: 0, exp: "Tri + LIMIT." },
      { type: "qcm", q: "Titre + libellé de catégorie :", opts: ["INNER JOIN CATEGORIE ON j.idCategorie = c.idCategorie", "Deux requêtes", "UNION", "LIMIT"], a: 0, exp: "Jointure." },
      { type: "qcm", q: "Nombre de locations par jeu (0 compris) :", opts: ["INNER JOIN + COUNT(*)", "LEFT JOIN LOUER + COUNT(l.idJeu) GROUP BY j.titre", "LIMIT", "MERGE"], a: 1, exp: "LEFT JOIN + COUNT colonne." },
      { type: "qcm", q: "Jeux sans fournisseur :", opts: ["idFournisseur = NULL", "idFournisseur IS NULL", "idFournisseur = 0", "NOT idFournisseur"], a: 1, exp: "IS NULL." },
      { type: "vf", q: "Louer un jeu devrait insérer dans LOUER ET décrémenter stockLocation dans une même transaction.", a: true, exp: "Atomicité métier." }
    ],
    solution: `<pre class="pseudo">SELECT titre, prixLocation FROM JEU     -- affiche titre et prix…
ORDER BY prixLocation DESC LIMIT 3;     -- …trié du plus cher au moins cher, LIMIT 3 = les 3 plus chers

SELECT j.titre, c.libelle                -- titre du jeu + libellé de sa catégorie
FROM JEU j INNER JOIN CATEGORIE c ON j.idCategorie = c.idCategorie;  -- jointure sur la clé commune idCategorie

SELECT j.titre, COUNT(l.idJeu) AS nb     -- pour chaque jeu, son nombre de locations
FROM JEU j LEFT JOIN LOUER l ON j.idJeu = l.idJeu  -- LEFT JOIN = garde aussi les jeux jamais loués (nb = 0)
GROUP BY j.titre;                        -- un total par jeu

SELECT titre FROM JEU WHERE idFournisseur IS NULL;  -- jeux sans fournisseur (IS NULL = case vide, jamais = NULL)</pre>
<p>Félicitations : tu maîtrises MySQL, de la création des tables en InnoDB à l'automatisation par procédures et triggers. La Ludothèque n'a plus de secret pour toi — et tu peux comparer, langage par langage et SGBD par SGBD, la même application d'un bout à l'autre de la formation !</p>`
  }
};

<script>
var ECRITURE = {
  placeholder: "Écris ta requête finale…",
  items: [
  { id: "mysql-l21", title: "Synthèse : la requête du gérant", level: 3,
    statement: "Requête de synthèse : affiche, pour chaque catégorie ayant au moins un jeu, le libellé, le nombre de jeux, le prix de location moyen (arrondi) et le titre du jeu le plus cher de la catégorie. Combine jointures, agrégats et une CTE avec fenêtrage (MySQL 8).",
    hints: [
      "GROUP BY sur la catégorie pour le compte et la moyenne (ROUND(AVG(...), 2)).",
      "Pour le jeu le plus cher par catégorie : une CTE avec ROW_NUMBER() OVER (PARTITION BY idCategorie ORDER BY prixLocation DESC), r = 1.",
      "Joins la CTE aux agrégats sur idCategorie."
    ],
    solution: "WITH plus_cher AS (\n    SELECT idCategorie, titre,\n           ROW_NUMBER() OVER (PARTITION BY idCategorie\n                              ORDER BY prixLocation DESC) AS r\n    FROM JEU\n)\nSELECT c.libelle,\n       COUNT(j.idJeu)               AS nb_jeux,\n       ROUND(AVG(j.prixLocation),2) AS prix_moyen,\n       pc.titre                     AS plus_cher\nFROM CATEGORIE c\nINNER JOIN JEU j        ON j.idCategorie = c.idCategorie\nINNER JOIN plus_cher pc ON pc.idCategorie = c.idCategorie AND pc.r = 1\nGROUP BY c.libelle, pc.titre\nORDER BY nb_jeux DESC;",
    note: "Cette requête finale réunit l'essentiel du cours : une CTE avec fonction de fenêtrage (MySQL 8) pour isoler le jeu le plus cher de chaque catégorie, des agrégats (COUNT, AVG arrondi) et des jointures pour tout relier. C'est exactement le type d'analyse qu'un gérant demanderait sur la vraie Ludothèque." }
  ]
};
