<script>
var DAY = {
  num: 9,
  title: "Les chaînes de caractères",
  subtitle: "En C, un texte est un tableau de char terminé par un zéro invisible : le fameux '\\0'.",
  theory: `
<h3>1. Une chaîne = un tableau de char + '\\0'</h3>
<p>Le C n'a pas de type <code>string</code> tout prêt. Une <strong>chaîne de caractères</strong> (un texte) est simplement un <strong>tableau de <code>char</code></strong> (une rangée de cases contenant chacune une lettre) terminé par un caractère spécial invisible : le <strong>caractère nul <code>'\\0'</code></strong> (de valeur 0). Ce marqueur signale « ici finit le texte ». Il est ajouté automatiquement quand on écrit un texte entre guillemets doubles.</p>
<pre class="pseudo">char nom[] = "Catan";   // tableau de char ; en réalité 6 cases : 'C','a','t','a','n','\\0'
printf("%s\\n", nom);    // %s = afficher une CHAÎNE ; printf affiche lettre par lettre jusqu'au '\\0'</pre>
<div class="warn">Prévois toujours <strong>une case de plus</strong> pour le <code>'\\0'</code>. Un texte de 5 lettres a besoin d'un tableau d'au moins 6 char. Oublier ce zéro final est la cause de nombreux bugs.</div>

<h3>2. Déclarer avec une taille fixe</h3>
<pre class="pseudo">char titre[50];              // réserve 50 cases : peut contenir jusqu'à 49 caractères + le '\\0'
char ville[] = "Bruxelles";  // taille DÉDUITE du texte : 10 (9 lettres + '\\0')</pre>

<h3>3. Lire une chaîne au clavier</h3>
<pre class="pseudo">char nom[50];           // réserve 50 cases pour le mot à saisir
scanf("%49s", nom);     // %s = lire une chaîne ; PAS de & (le nom du tableau vaut déjà son adresse)
                        // le 49 limite la saisie à 49 caractères pour ne pas déborder du tableau</pre>
<div class="warn"><code>%s</code> avec scanf s'arrête au premier espace et ne vérifie pas la taille : borne-le (<code>%49s</code>). Pour lire une ligne entière avec espaces, on utilisera <code>fgets</code> (leçon 16). Noter : pas de <code>&amp;</code> devant un tableau, car son nom vaut déjà son adresse.</div>

<h3>4. La bibliothèque string.h</h3>
<p><code>string.h</code> est la bibliothèque des fonctions qui manipulent les chaînes. Il faut l'inclure pour y accéder :</p>
<pre class="pseudo">#include &lt;string.h&gt;      // importe strlen, strcpy, strcat, strcmp…
char a[50] = "Cat";      // un tableau de 50 cases contenant "Cat"
strlen(a);               // strlen = LONGUEUR : 3 (le '\\0' n'est PAS compté)
strcpy(a, "Uno");        // strcpy = COPIER "Uno" dans a → a vaut maintenant "Uno" (plus "Cat")
strcat(a, "!");          // strcat = CONCATÉNER (coller) "!" à la fin → a devient "Uno!"
strcmp(a, "Uno!");       // strcmp = COMPARER : renvoie 0 si les deux chaînes sont identiques</pre>
<div class="warn">On ne compare PAS deux chaînes avec <code>==</code> (cela compare des adresses, pas le contenu). On utilise <code>strcmp</code>, qui renvoie <strong>0</strong> quand les chaînes sont identiques.</div>

<h3>5. Parcourir une chaîne caractère par caractère</h3>
<pre class="pseudo">char mot[] = "Catan";                     // le mot à parcourir
for (int i = 0; mot[i] != '\\0'; i++) {    // avancer tant qu'on n'a pas atteint le '\\0' (la fin)
    printf("%c-", mot[i]);                // %c = afficher UN caractère (mot[i]) suivi d'un tiret
}                                         // à l'écran : C-a-t-a-n-</pre>
<div class="tip">Un <code>char</code> est aussi un petit entier (son code ASCII, un numéro attribué à chaque caractère) : <code>'A'</code> vaut 65, <code>'a'</code> vaut 97. On peut donc faire <code>mot[i] - 'a'</code> ou passer d'une majuscule à une minuscule en jouant sur ces codes.</div>`,
  exercises: [
    { type: "qcm", q: "En C, une chaîne de caractères est…", opts: ["Le type string", "Un tableau de char terminé par '\\0'", "Un int", "Un double"], a: 1, exp: "Tableau de char + marqueur de fin '\\0'." },
    { type: "qcm", q: "Que marque le caractère '\\0' ?", opts: ["Le début de la chaîne", "La fin de la chaîne", "Un espace", "Un saut de ligne"], a: 1, exp: "'\\0' (valeur 0) signale la fin." },
    { type: "qcm", q: "Combien de cases pour stocker \"Catan\" (5 lettres) ?", opts: ["5", "6 (les lettres + '\\0')", "4", "10"], a: 1, exp: "Toujours une case de plus pour '\\0'." },
    { type: "qcm", q: "Quel spécificateur affiche une chaîne ?", opts: ["%c", "%s", "%d", "%t"], a: 1, exp: "%s affiche jusqu'au '\\0'." },
    { type: "qcm", q: "Comment obtenir la longueur d'une chaîne ?", opts: ["length(s)", "strlen(s)", "sizeof(s)", "count(s)"], a: 1, exp: "strlen de string.h (sans compter '\\0')." },
    { type: "qcm", q: "Comment comparer deux chaînes ?", opts: ["a == b", "strcmp(a, b) == 0", "a.equals(b)", "compare(a,b)"], a: 1, exp: "strcmp renvoie 0 si elles sont identiques ; == compare des adresses." },
    { type: "qcm", q: "Que fait <code>strcpy(a, \"Uno\")</code> ?", opts: ["Compare a et \"Uno\"", "Copie \"Uno\" dans a", "Concatène", "Affiche a"], a: 1, exp: "strcpy copie la 2e chaîne dans la 1re." },
    { type: "qcm", q: "Que fait <code>strcat(a, \"!\")</code> ?", opts: ["Remplace a", "Ajoute \"!\" à la fin de a", "Compare", "Compte"], a: 1, exp: "strcat concatène à la suite." },
    { type: "qcm", q: "Faut-il un & devant un tableau char dans scanf(\"%s\", nom) ?", opts: ["Oui", "Non : le nom du tableau vaut déjà son adresse", "Seulement pour les longs mots", "Toujours"], a: 1, exp: "Un tableau se comporte comme une adresse : pas de &." },
    { type: "qcm", q: "Pourquoi écrire <code>scanf(\"%49s\", nom)</code> plutôt que <code>%s</code> ?", opts: ["Pour aller plus vite", "Pour limiter la saisie et éviter un débordement du tableau", "Pour lire 49 mots", "Aucune raison"], a: 1, exp: "Borner la taille protège contre le buffer overflow." },
    { type: "vf", q: "On peut comparer deux chaînes avec l'opérateur ==.", a: false, exp: "Faux : == compare des adresses. Il faut strcmp." },
    { type: "qcm", q: "Que vaut <code>strlen(\"Uno\")</code> ?", opts: ["4", "3", "2", "0"], a: 1, exp: "3 lettres ; le '\\0' n'est pas compté." },
    { type: "qcm", q: "Un char comme 'A' est en réalité…", opts: ["une chaîne", "un petit entier (son code ASCII, 65)", "un double", "un pointeur"], a: 1, exp: "'A' == 65 : les char sont des entiers." },
    { type: "qcm", q: "Comment détecter la fin d'une chaîne en la parcourant ?", opts: ["mot[i] == ' '", "mot[i] != '\\0'", "i == 100", "mot[i] == 0.0"], a: 1, exp: "On boucle tant que mot[i] n'est pas '\\0'." },
    { type: "qcm", q: "Quel en-tête fournit strlen, strcpy, strcmp ?", opts: ["stdio.h", "string.h", "stdlib.h", "math.h"], a: 1, exp: "#include <string.h>." }
  ],
  final: {
    title: "Exercice final — Le nom du jeu",
    intro: `<p>On manipule le nom d'un jeu. Corrige ce code :</p>
<pre class="pseudo">char nom[5] = "Catan";                 // ERREUR : 5 cases pour "Catan" (5 lettres) → pas de place pour le '\\0'
if (nom == "Catan")                    // ERREUR : == compare des ADRESSES, pas le texte → il faut strcmp
    printf("C'est Catan\\n");           // ne s'exécutera pas comme prévu
printf("Longueur : %d\\n", sizeof(nom));  // ERREUR : sizeof = taille du tableau, pas la longueur du texte → strlen</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — <code>char nom[5] = \"Catan\"</code> :", opts: ["Correct", "Trop petit : \"Catan\" a besoin de 6 cases (avec '\\0')", "Il faut char nom[4]", "Il faut double"], a: 1, exp: "5 lettres + '\\0' = 6 cases minimum." },
      { type: "qcm", q: "Erreur n°2 — <code>nom == \"Catan\"</code> :", opts: ["Correct", "On ne compare pas des chaînes avec == : il faut strcmp(nom, \"Catan\") == 0", "Il faut un seul =", "nom est réservé"], a: 1, exp: "== compare des adresses, pas le texte." },
      { type: "qcm", q: "Erreur n°3 — pour la longueur du texte, on utilise…", opts: ["sizeof", "strlen(nom)", "count(nom)", "length"], a: 1, exp: "strlen donne le nombre de lettres ; sizeof donne la taille du tableau." },
      { type: "qcm", q: "strcmp(a, b) renvoie 0 quand…", opts: ["a > b", "les deux chaînes sont identiques", "a est vide", "jamais"], a: 1, exp: "0 = égalité." },
      { type: "qcm", q: "Bonne déclaration pour \"Catan\" ?", opts: ["char nom[5]", "char nom[] = \"Catan\"; (taille déduite = 6)", "int nom", "char nom = \"Catan\""], a: 1, exp: "Taille déduite : 6, dont le '\\0'." }
    ],
    solution: `<pre class="pseudo">#include &lt;stdio.h&gt;                          // pour printf
#include &lt;string.h&gt;                         // pour strcmp et strlen
                                           // (ligne vide)
int main(void) {                           // point d'entrée du programme
    char nom[] = "Catan";                  // taille DÉDUITE : 6 cases (avec le '\\0')
    if (strcmp(nom, "Catan") == 0)         // strcmp == 0 : compare le CONTENU des chaînes
        printf("C'est Catan\\n");           // s'affiche car le contenu correspond
    printf("Longueur : %zu\\n", strlen(nom));  // strlen = 5 lettres ; %zu = spécificateur adapté
    return 0;                              // 0 = fin sans erreur
}                                          // fin de main</pre>
<p>Trois corrections : une taille suffisante pour le <code>'\\0'</code>, <code>strcmp</code> pour comparer, <code>strlen</code> pour la longueur. Le <code>'\\0'</code> invisible et la comparaison par <code>strcmp</code> sont deux réflexes essentiels en C. Demain : les pointeurs — le cœur du langage.</p>`
  }
};
