<script>
var DAY = {
  num: 5,
  title: "Conditions : if, else, switch",
  subtitle: "Faire des choix : comparaisons, opérateurs logiques, et le piège du = contre ==.",
  theory: `
<h3>1. if / else if / else</h3>
<p>Une <strong>condition</strong> permet au programme de <strong>choisir</strong> quelles instructions exécuter selon la situation. C'est un aiguillage : « <em>si</em> le stock est vide, <em>alors</em> afficher Rupture, <em>sinon</em>… ». Le mot <code>if</code> veut dire « si » ; entre parenthèses on écrit la <strong>question</strong> (la condition), et entre accolades les instructions à exécuter quand elle est vraie. <code>else if</code> (« sinon si ») pose une autre question si la précédente était fausse ; <code>else</code> (« sinon ») attrape tous les autres cas.</p>
<pre class="pseudo">int stock = 3;                     // on part d'un stock valant 3
if (stock == 0) {                  // SI stock est égal à 0 (== = comparaison) …
    printf("Rupture\\n");           // … afficher Rupture
} else if (stock &lt; 5) {            // SINON SI stock est plus petit que 5 …
    printf("Stock faible\\n");      // … afficher Stock faible (c'est ce cas-ci : 3 &lt; 5)
} else {                           // SINON (tous les autres cas) …
    printf("Stock ok\\n");          // … afficher Stock ok
}                                  // fin du if : UNE seule des trois branches s'exécute</pre>
<p>La condition entre parenthèses est considérée <strong>vraie</strong> si elle vaut une valeur <em>non nulle</em>, <strong>fausse</strong> si elle vaut 0. En C, pas besoin d'un type booléen spécial : un simple entier suffit (0 = faux, tout le reste = vrai).</p>

<h3>2. Les opérateurs de comparaison</h3>
<p>Un <strong>opérateur de comparaison</strong> compare deux valeurs et donne un résultat vrai (1) ou faux (0) :</p>
<pre class="pseudo">==  égal à          !=  différent de     // == teste l'égalité ; != teste l'inégalité
&lt;   inférieur       &gt;   supérieur        // strictement plus petit / plus grand
&lt;=  inf. ou égal    &gt;=  sup. ou égal     // avec le "ou égal" en plus</pre>
<div class="warn">Le piège majeur du C : <code>=</code> est l'<strong>affectation</strong> (ranger une valeur), <code>==</code> est la <strong>comparaison</strong>. <code>if (stock = 0)</code> <em>affecte</em> 0 à stock et vaut toujours faux — un bug silencieux. Compile avec <code>-Wall</code> : le compilateur t'avertit.</div>

<h3>3. Les opérateurs logiques</h3>
<p>Les <strong>opérateurs logiques</strong> combinent plusieurs conditions en une seule :</p>
<pre class="pseudo">&amp;&amp;   ET   (vrai seulement si les DEUX sont vraies)   // "et"
||   OU   (vrai si AU MOINS UNE est vraie)          // "ou"
!    NON  (inverse : vrai devient faux, faux devient vrai)  // "non"</pre>
<pre class="pseudo">if (stock &gt; 0 &amp;&amp; prix &lt; 50) { ... }      // vrai si en stock (stock&gt;0) ET pas cher (prix&lt;50)
if (role == 'A' || role == 'V') { ... }  // vrai si role vaut 'A' (admin) OU 'V' (vendeur)
if (!disponible) { ... }                 // vrai si NON disponible (disponible est faux)</pre>

<h3>4. switch : choisir parmi des cas</h3>
<p><code>switch</code> compare une variable à plusieurs valeurs possibles, une par <code>case</code> (« cas »). C'est plus lisible qu'une longue chaîne de <code>if/else if</code> quand on teste UNE variable contre plein de valeurs.</p>
<pre class="pseudo">int choix = 2;                     // la valeur à examiner
switch (choix) {                   // examine la valeur de choix
    case 1:                        // CAS où choix vaut 1 :
        printf("Acheter\\n");       // afficher Acheter
        break;                     // break = sortir du switch maintenant
    case 2:                        // CAS où choix vaut 2 (c'est le nôtre) :
        printf("Louer\\n");         // afficher Louer
        break;                     // sortir du switch
    default:                       // AUCUN case ne correspond :
        printf("Choix inconnu\\n"); // afficher Choix inconnu (pas de break nécessaire, c'est le dernier)
}                                  // fin du switch</pre>
<div class="warn">Sans <code>break</code>, l'exécution « tombe » dans le cas suivant (<em>fall-through</em>). C'est parfois voulu, mais le plus souvent un oubli. <code>switch</code> ne fonctionne qu'avec des entiers (ou des char), pas avec des chaînes.</div>

<h3>5. L'opérateur ternaire</h3>
<p>L'<strong>opérateur ternaire</strong> (« ternaire » = à trois parties) condense un if/else qui choisit une valeur. Il s'écrit <code>condition ? valeurSiVrai : valeurSiFaux</code>.</p>
<pre class="pseudo">char *etat = (stock &gt; 0) ? "dispo" : "épuisé";   // si stock&gt;0 → etat = "dispo", sinon → etat = "épuisé"</pre>
<div class="tip">Le ternaire condense un if/else qui choisit une valeur. Pratique pour les cas courts, à éviter s'il nuit à la lisibilité.</div>
<h3>Inverser une condition proprement — les lois de De Morgan</h3>
<p>Pour obtenir le CONTRAIRE d'une condition composée, on ne peut pas juste coller un <code>!</code> devant sans réfléchir. Les <strong>lois de De Morgan</strong> disent comment le NON « rentre » dans la parenthèse : il inverse chaque morceau ET échange <code>&amp;&amp;</code> (ET) avec <code>||</code> (OU).</p>
<pre class="pseudo">!(a &amp;&amp; b)      // NON (A ET B)...
  =  !a || !b     // ...devient (NON A) OU (NON B)
!(a || b)      // NON (A OU B)...
  =  !a &amp;&amp; !b     // ...devient (NON A) ET (NON B)</pre>
<p>Exemple : l'inverse de « la note est valide » <code>note &gt;= 0 &amp;&amp; note &lt;= 20</code> n'est PAS <code>note &gt;= 0 || note &lt;= 20</code>, mais <code>note &lt; 0 || note &gt; 20</code> (« en dessous de 0 OU au-dessus de 20 »). Chaque comparaison s'inverse, et le ET devient OU.</p>`,
  exercises: [
    { type: "qcm", q: "Quel opérateur teste l'égalité ?", opts: ["=", "==", "!=", "==="], a: 1, exp: "== compare ; = affecte." },
    { type: "qcm", q: "Que fait <code>if (stock = 0)</code> (avec un seul =) ?", opts: ["Teste si stock vaut 0", "Affecte 0 à stock et la condition est toujours fausse", "Erreur de compilation garantie", "Teste si stock est positif"], a: 1, exp: "= est une affectation : bug silencieux classique." },
    { type: "qcm", q: "Quel opérateur signifie « ET logique » ?", opts: ["&", "&&", "AND", "+"], a: 1, exp: "&& : les deux conditions doivent être vraies." },
    { type: "qcm", q: "Quel opérateur signifie « OU logique » ?", opts: ["|", "||", "OR", "//"], a: 1, exp: "|| : au moins une condition vraie." },
    { type: "qcm", q: "Que fait <code>!disponible</code> ?", opts: ["Renvoie toujours faux","Inverse la valeur (vrai↔faux)","Affiche la variable disponible","Incrémente disponible de 1"], a: 1, exp: "! est le NON logique." },
    { type: "qcm", q: "En C, une condition est fausse quand elle vaut…", opts: ["1", "0", "-1", "'F'"], a: 1, exp: "0 = faux ; toute valeur non nulle = vrai." },
    { type: "qcm", q: "À quoi sert <code>break</code> dans un switch ?", opts: ["À arrêter le programme", "À sortir du switch après le cas traité", "À recommencer", "À rien"], a: 1, exp: "Sans break, on tombe dans le cas suivant (fall-through)." },
    { type: "qcm", q: "switch fonctionne avec…", opts: ["Des chaînes de caractères","Des entiers ou des char","Des nombres à virgule (double)","Des tableaux de valeurs"], a: 1, exp: "Uniquement des valeurs entières (int, char, enum)." },
    { type: "qcm", q: "À quoi sert <code>default</code> dans un switch ?", opts: ["À définir le tout premier cas testé","Au cas où aucune valeur ne correspond","À sortir immédiatement du switch","À déclarer la variable testée"], a: 1, exp: "default = le « sinon » du switch." },
    { type: "qcm", q: "<code>(stock > 0) ? \"dispo\" : \"épuisé\"</code> s'appelle…", opts: ["un switch", "l'opérateur ternaire", "une boucle", "un cast"], a: 1, exp: "condition ? valeurSiVrai : valeurSiFaux." },
    { type: "vf", q: "En C, if a besoin d'un type booléen : un int ne suffit pas.", a: false, exp: "Faux : un entier suffit (0 = faux, non nul = vrai)." },
    { type: "qcm", q: "<code>if (stock > 0 && prix < 50)</code> est vrai si…", opts: ["stock > 0 seulement", "les DEUX conditions sont vraies", "au moins une est vraie", "jamais"], a: 1, exp: "&& exige les deux." },
    { type: "qcm", q: "Que se passe-t-il si on oublie break dans un case ?", opts: ["Erreur", "L'exécution continue dans le case suivant (fall-through)", "Le switch s'arrête", "Rien"], a: 1, exp: "C'est le fall-through, souvent un bug." },
    { type: "qcm", q: "Comment tester « role est A ou V » ?", opts: ["role == 'A' || role == 'V'", "role == 'A' == 'V'", "role == 'A' && 'V'", "role = 'A' || 'V'"], a: 0, exp: "On compare role séparément à chaque valeur, reliées par ||." },
    { type: "qcm", q: "Le compilateur -Wall aide à repérer…", opts: ["Les fautes d'orthographe", "Le = utilisé par erreur à la place de ==", "Les mauvais prix", "Rien"], a: 1, exp: "-Wall signale l'affectation suspecte dans une condition." }
  ],
  final: {
    title: "Exercice final — Classer un stock",
    intro: `<p>On veut classer le stock d'un jeu. Corrige ce code :</p>
<pre class="pseudo">int stock = 4;                     // stock à classer
if (stock = 0)                     // ERREUR : un seul = ⇒ affecte 0 à stock (au lieu de comparer avec ==)
    printf("Rupture\\n");           // afficherait Rupture si la condition était vraie
else if (stock < 5)                // sinon si stock plus petit que 5
    printf("Faible\\n")             // ERREUR : il manque le ; à la fin de cette instruction
else                               // sinon
    printf("Ok\\n");                // afficher Ok</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — <code>if (stock = 0)</code> :", opts: ["Correct", "Il faut == : ici on affecte 0 à stock (toujours faux)", "Il faut <", "stock est réservé"], a: 1, exp: "Comparaison = ==, pas =." },
      { type: "qcm", q: "Erreur n°2 — <code>printf(\"Faible\\n\")</code> :", opts: ["Correct", "Il manque le point-virgule final", "Il faut un break", "Il faut des accolades"], a: 1, exp: "Toute instruction se termine par ;." },
      { type: "qcm", q: "Une fois corrigé, avec stock = 4, qu'affiche-t-il ?", opts: ["Rupture", "Faible", "Ok", "Rien"], a: 1, exp: "4 n'est pas 0, mais < 5 : « Faible »." },
      { type: "qcm", q: "Pour être plus lisible, on pourrait…", opts: ["Tout supprimer", "Mettre des accolades { } autour de chaque branche", "Enlever else", "Utiliser un double"], a: 1, exp: "Des accolades systématiques évitent bien des bugs." },
      { type: "qcm", q: "Avec stock = 0 (après correction), qu'affiche-t-il ?", opts: ["Rupture", "Faible", "Ok", "Erreur"], a: 0, exp: "stock == 0 est vrai : « Rupture »." }
    ],
    solution: `<pre class="pseudo">#include &lt;stdio.h&gt;                  // pour printf
                                   // (ligne vide)
int main(void) {                   // point d'entrée du programme
    int stock = 4;                 // stock à classer
    if (stock == 0) {              // == : on COMPARE stock à 0
        printf("Rupture\\n");       // cas stock vide
    } else if (stock &lt; 5) {        // sinon si stock &lt; 5 (le cas de 4)
        printf("Faible\\n");        // ; bien présent maintenant
    } else {                       // sinon
        printf("Ok\\n");            // stock suffisant
    }                              // fin du if
    return 0;                      // 0 = fin sans erreur
}                                  // fin de main</pre>
<p>Deux corrections : <code>==</code> pour comparer et le <code>;</code> manquant. Le <code>=</code> au lieu de <code>==</code> est LE bug classique du C — active toujours <code>-Wall</code>. Demain : les boucles.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code C ici…",
  items: [
  { id: "c-l05", title: "Tarif selon le rôle", level: 2,
    statement: "Lis un caractère de rôle ('C' client, 'V' vendeur, 'A' admin) et un prix de base (double). Avec un switch, applique une remise : client 0 %, vendeur 10 %, admin 20 %. Affiche le prix final à 2 décimales, et un message d'erreur pour un rôle inconnu.",
    hints: [
      "Lis le char avec scanf(\" %c\", &role); (espace avant %c).",
      "switch (role) { case 'V': ... break; case 'A': ... break; ... default: ... }",
      "Applique la remise sur une copie du prix, puis affiche avec %.2f."
    ],
    solution: "#include <stdio.h>                    // pour printf et scanf\n\nint main(void) {                     // point d'entree du programme\n    char role;                       // case caractere pour le role\n    double prix, final;              // prix de base et prix final (reels)\n    printf(\"Role (C/V/A) ? \");       // prompt\n    scanf(\" %c\", &role);             // l'espace avant %c ignore les blancs ; & = adresse\n    printf(\"Prix de base ? \");       // prompt\n    scanf(\"%lf\", &prix);             // %lf lit un double\n    final = prix;                    // on part du prix de base\n    switch (role) {                  // examine le role\n        case 'C': break;                 // client : 0 % de remise, on sort\n        case 'V': final *= 0.90; break;  // vendeur : -10 %, puis on sort\n        case 'A': final *= 0.80; break;  // admin : -20 %, puis on sort\n        default:                         // role non prevu :\n            printf(\"Role inconnu\\n\");    // message d'erreur\n            return 1;                    // on quitte en erreur\n    }                                // fin du switch\n    printf(\"Prix final : %.2f euros\\n\", final);  // %.2f = 2 decimales\n    return 0;                        // 0 = fin sans erreur\n}                                    // fin de main",
    atoi: {"cmd":"gcc prog.c -o prog && ./prog","expected":"Role (C/V/A) ? Prix de base ? Prix final : 45.00 euros"},
    checklist: ["Le char est lu avec un espace avant %c : \" %c\".","Chaque case du switch se termine par break.","default gère le rôle inconnu.","Le prix final est affiché avec %.2f."],
    lang: "c",
    stdin: ["V","50"],
    note: "switch sur un char, chaque case terminé par break, et default gère l'erreur. On lit le double avec %lf." }
  ]
};
