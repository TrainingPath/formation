<script>
var DAY = {
  num: 3,
  title: "Opérateurs, conversions et math.h",
  subtitle: "Calculer en C : arithmétique, division entière, transtypage et la bibliothèque mathématique.",
  theory: `
<h3>1. Les opérateurs arithmétiques</h3>
<p>Un <strong>opérateur</strong> est un symbole qui effectue un calcul entre deux valeurs. Ces valeurs, celles sur lesquelles il travaille, s'appellent les <strong>opérandes</strong> (dans <code>a + b</code>, les opérandes sont <code>a</code> et <code>b</code>). Le C fournit cinq opérateurs de base :</p>
<pre class="pseudo">+   addition          -   soustraction     // les deux opérations classiques
*   multiplication    /   division         // * remplace le signe × ; / remplace le ÷
%   modulo (reste de la division entière)  // % donne ce qui RESTE après une division entière</pre>
<p>Le <strong>modulo</strong> <code>%</code> mérite une explication : il donne le <em>reste</em> d'une division entière. 17 divisé par 5 fait 3 (il rentre 3 fois) et il reste 2, donc <code>17 % 5</code> vaut 2. C'est très utile, par exemple pour tester si un nombre est pair (<code>n % 2 == 0</code>).</p>
<pre class="pseudo">int a = 17, b = 5;         // deux entiers : a vaut 17, b vaut 5 (déclaration groupée)
printf("%d\\n", a + b);     // %d = trou pour un entier ; a+b = 22 → affiche 22 puis saute la ligne
printf("%d\\n", a % b);     // a % b = reste de 17 divisé par 5 = 2 → affiche 2</pre>

<h3>2. Le piège de la division entière</h3>
<p>Quand les <strong>deux</strong> opérandes de <code>/</code> sont des entiers, le C fait une <strong>division entière</strong> : le résultat est <em>tronqué</em> (on coupe), la partie décimale disparaît purement et simplement.</p>
<pre class="pseudo">printf("%d\\n", 7 / 2);          // 7 et 2 sont entiers → division entière → 3 (le .5 est PERDU), pas 3.5 !
printf("%f\\n", 7.0 / 2);        // 7.0 est un réel → le calcul se fait en réel → 3.500000 (%f = trou réel)
printf("%f\\n", (double)7 / 2);  // (double)7 force 7 en réel AVANT de diviser → 3.500000</pre>
<div class="warn">C'est l'erreur de calcul la plus fréquente en C. Pour obtenir un résultat décimal, il faut qu'au moins un des deux opérandes soit un réel.</div>

<h3>3. Le transtypage (cast)</h3>
<p><strong>Transtyper</strong> (ou faire un <strong>cast</strong>, mot anglais) signifie <strong>convertir de force</strong> une valeur d'un type vers un autre. On écrit le type cible entre parenthèses juste devant la valeur : <code>(double)x</code> dit « prends <code>x</code> et traite-le comme un réel ».</p>
<pre class="pseudo">int total = 7, n = 2;                 // deux entiers
double moyenne = (double)total / n;   // (double)total → 7.0 ; on convertit AVANT de diviser → 3.5
int arrondi = (int)3.9;               // (int)3.9 → 3 : le cast vers int TRONQUE (il coupe, il n'arrondit PAS)</pre>

<h3>4. Raccourcis et incrémentation</h3>
<p>Ces raccourcis évitent de réécrire le nom de la variable. Ils sont très courants :</p>
<pre class="pseudo">x += 5;   // raccourci de : x = x + 5;   (il existe aussi -=, *=, /=, %=)
x++;      // INCRÉMENTER : ajouter 1 à x (équivaut à x = x + 1)
x--;      // DÉCRÉMENTER : retirer 1 à x (équivaut à x = x - 1)</pre>

<h3>5. La bibliothèque math.h</h3>
<p><code>math.h</code> est une <strong>bibliothèque</strong> (une boîte à outils fournie avec le C) qui apporte les fonctions mathématiques avancées. Il faut l'inclure pour y accéder :</p>
<pre class="pseudo">#include &lt;math.h&gt;             // importe les fonctions mathématiques (sqrt, pow, fabs, floor, ceil…)
double r = sqrt(2.0);         // sqrt = racine carrée (square root) ; r reçoit √2 ≈ 1.414
double p = pow(2.0, 10);      // pow(base, exposant) = puissance ; ici 2^10 = 1024
double a = fabs(-3.5);        // fabs = valeur absolue d'un réel (float abs) ; a reçoit 3.5
double f = floor(3.9);        // floor = arrondi vers le BAS → 3.0 ; ceil(3.1) arrondirait vers le HAUT → 4.0</pre>
<div class="warn">Avec <code>math.h</code>, il faut parfois <strong>lier</strong> (relier) la bibliothèque mathématique au moment de compiler : <code>gcc prog.c -o prog -lm</code> (le <code>-lm</code> final, pour <em>link math</em>).</div>
<div class="tip">Priorité des opérateurs : <code>*</code>, <code>/</code>, <code>%</code> passent avant <code>+</code> et <code>-</code> (comme en maths). En cas de doute, mets des parenthèses : elles clarifient et ne coûtent rien.</div>
<h3>Aller plus loin — pré-incrément (++i) et post-incrément (i++)</h3>
<p>Les deux écritures ajoutent 1 à la variable ; la différence n'apparaît que lorsqu'on <strong>lit la valeur au moment même</strong> de l'incrémentation. La formule à retenir : <code>i++</code> « donne sa valeur, PUIS grandit » ; <code>++i</code> « grandit, PUIS donne sa valeur ».</p>
<pre class="pseudo">int a = 5;        // a vaut 5
int b = a++;      // POST-increment : b prend l'ANCIENNE valeur -> b = 5, et ENSUITE a passe a 6
int c = 5;        // c vaut 5
int d = ++c;      // PRE-increment : c passe d'abord a 6, PUIS d prend la NOUVELLE valeur -> d = 6</pre>
<p>Dans une boucle <code>for (i = 0; i &lt; 5; i++)</code>, on ne lit pas le résultat de <code>i++</code> : on veut seulement « ajouter 1 ». C'est pourquoi <code>i++</code> et <code>++i</code> y donnent exactement la même boucle et sont interchangeables.</p>`,
  exercises: [
    { type: "qcm", q: "Que vaut <code>17 % 5</code> ?", opts: ["3","2","5","7"], a: 1, exp: "% donne le reste : 17 = 3×5 + 2." },
    { type: "qcm", q: "Que vaut <code>7 / 2</code> en C (deux entiers) ?", opts: ["3.5", "3 (division entière)", "4", "3.0"], a: 1, exp: "Deux entiers → division entière, partie décimale perdue." },
    { type: "qcm", q: "Comment obtenir 3.5 à partir de 7 et 2 ?", opts: ["7 / 2", "7.0 / 2", "(int)7 / 2", "7 % 2"], a: 1, exp: "Un opérande réel suffit : 7.0/2 ou (double)7/2." },
    { type: "qcm", q: "Que fait <code>(double)total / n</code> avec total et n entiers ?", opts: ["Une division entière", "Convertit total en double d'abord, puis divise : résultat décimal", "Une erreur", "Arrondit"], a: 1, exp: "Le cast s'applique avant la division." },
    { type: "qcm", q: "<code>x += 5;</code> équivaut à…", opts: ["x = 5", "x = x + 5", "x = x * 5", "x++"], a: 1, exp: "+= est un raccourci d'affectation." },
    { type: "qcm", q: "Que fait <code>x++;</code> ?", opts: ["Rien", "Augmente x de 1", "Double x", "Affiche x"], a: 1, exp: "++ incrémente de 1." },
    { type: "qcm", q: "Que vaut <code>(int)3.9</code> ?", opts: ["4", "3 (troncature, pas arrondi)", "3.9", "0"], a: 1, exp: "Le cast vers int coupe la partie décimale." },
    { type: "qcm", q: "Quelle fonction donne la racine carrée ?", opts: ["root()","sqrt()","pow()","square()"], a: 1, exp: "sqrt() de math.h." },
    { type: "qcm", q: "Comment calculer 2 puissance 10 ?", opts: ["2 ^ 10", "pow(2.0, 10)", "2 ** 10", "exp(2,10)"], a: 1, exp: "pow(base, exposant) de math.h ; ^ est le XOR bit à bit en C." },
    { type: "qcm", q: "À la compilation avec math.h, que faut-il souvent ajouter ?", opts: ["-Wall", "-lm (lier la bibliothèque math)", "-o", "-std=c99"], a: 1, exp: "-lm relie la libm : gcc prog.c -o prog -lm." },
    { type: "vf", q: "En C, <code>^</code> signifie « élever à la puissance ».", a: false, exp: "Non : ^ est le OU exclusif bit à bit. La puissance, c'est pow()." },
    { type: "qcm", q: "Que vaut <code>2 + 3 * 4</code> ?", opts: ["20", "14 (× avant +)", "24", "9"], a: 1, exp: "* est prioritaire : 3*4=12, +2 = 14." },
    { type: "qcm", q: "Que vaut <code>floor(3.9)</code> ?", opts: ["4.0", "3.0", "3.9", "4"], a: 1, exp: "floor arrondit vers le bas : 3.0." },
    { type: "qcm", q: "Que vaut <code>10 % 2</code> ?", opts: ["5", "0", "1", "2"], a: 1, exp: "10 est pair : reste 0. (Utile pour tester la parité.)" },
    { type: "qcm", q: "Que vaut <code>x</code> après <code>int x = 10; x -= 3; x++;</code> ?", opts: ["7", "8", "6", "13"], a: 1, exp: "10-3=7, puis +1 = 8." }
  ],
  final: {
    title: "Exercice final — Le tarif de location",
    intro: `<p>On veut le prix moyen par jour d'une location. Ce code se trompe :</p>
<pre class="pseudo">int total = 45;                        // total à répartir : 45 euros (entier)
int jours = 4;                         // nombre de jours : 4 (entier)
double moyenne = total / jours;        // ERREUR : total et jours entiers → division entière = 11 (le .25 est perdu)
printf("Moyenne : %d\\n", moyenne);     // ERREUR : moyenne est un double, %d attend un entier → il faut %f</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — <code>total / jours</code> (deux int) :", opts: ["Correct", "Division entière : 45/4 = 11, la décimale est perdue AVANT l'affectation", "Donne 11.25", "Plante"], a: 1, exp: "La division se fait en entier, puis 11.0 est rangé dans moyenne." },
      { type: "qcm", q: "Comment corriger pour obtenir 11.25 ?", opts: ["Rien à faire", "(double)total / jours", "total / (double)jours aussi", "Les deux corrections précédentes marchent"], a: 3, exp: "Il suffit qu'un opérande soit réel : les deux formes fonctionnent." },
      { type: "qcm", q: "Erreur n°2 — <code>printf(\"%d\", moyenne)</code> avec moyenne double :", opts: ["Correct", "Mauvais spécificateur : un double s'affiche avec %f", "Il faut %c", "Il faut %s"], a: 1, exp: "%.2f afficherait 11.25." },
      { type: "qcm", q: "Que vaut <code>45 % 4</code> ?", opts: ["1", "11", "0", "4"], a: 0, exp: "45 = 11×4 + 1 : reste 1." },
      { type: "qcm", q: "Valeur correcte finalement affichée (à 2 décimales) ?", opts: ["11.00", "11.25", "11.50", "12.00"], a: 1, exp: "45.0 / 4 = 11.25." }
    ],
    solution: `<pre class="pseudo">#include &lt;stdio.h&gt;                           // pour printf (afficher)
                                            // (ligne vide)
int main(void) {                            // point d'entrée du programme
    int total = 45, jours = 4;              // total = 45, jours = 4 (deux entiers)
    double moyenne = (double)total / jours; // (double)total = 45.0 → division en réel → 11.25
    printf("Moyenne : %.2f euros/jour\\n", moyenne);  // %.2f = réel à 2 décimales → 11.25
    return 0;                               // 0 = fin sans erreur
}                                           // fin de main</pre>
<p>Deux corrections : forcer la division en réel avec un cast, et afficher avec <code>%.2f</code>. La division entière est le piège classique — pense-y dès qu'un calcul « tombe faux ». Demain : lire au clavier avec scanf.</p>`
  }
};
</script>

  { id: "c-l03", title: "Coût total d'une location", level: 2,
    statement: "Un jeu se loue 5.0 € par jour. Pour une location de 4 jours avec 10 % de remise à partir de 3 jours, calcule et affiche le total à 2 décimales. Utilise une variable double pour le total et applique la remise avec un raccourci d'affectation.",
    hints: [
      "double total = prix_jour * jours;",
      "La remise : total *= 0.9;  (soit -10 %).",

    ],
    solution: "#include <stdio.h>                    // pour printf (afficher)\n\nint main(void) {                     // point d'entree du programme\n    double prix_jour = 5.0;          // prix par jour a virgule → double\n    int jours = 4;                   // nombre de jours → int\n    double total = prix_jour * jours;   // 5.0 * 4 = 20.0 (calcul en reel)\n    if (jours >= 3)                  // si la location dure au moins 3 jours\n        total *= 0.9;                // -10 % => total = 20.0 * 0.9 = 18.0\n    printf(\"Location %d jours : %.2f euros\\n\", jours, total);  // %d entier, %.2f reel 2 dec.\n    return 0;                        // 0 = fin sans erreur\n}                                    // fin de main",

};
