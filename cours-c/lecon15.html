<script>
var DAY = {
  num: 15,
  title: "Préprocesseur et compilation séparée",
  subtitle: "#include, #define, fichiers .h et .c : structurer un vrai projet en plusieurs fichiers.",
  theory: `
<h3>1. Le préprocesseur agit avant la compilation</h3>
<p>Le <strong>préprocesseur</strong> est un outil qui s'exécute <em>avant</em> le compilateur : il prépare le texte du fichier (il copie des morceaux, remplace des mots…) avant que le vrai code C ne soit traduit. Toutes les lignes qui commencent par <code>#</code> lui sont adressées : ce ne sont pas des instructions C, mais des <strong>directives</strong> (des ordres) pour le préprocesseur.</p>
<pre class="pseudo">#include &lt;stdio.h&gt;   // directive : RECOPIE ici tout le contenu de l'en-tête stdio.h (pour avoir printf)
#define PI 3.14159   // directive : REMPLACE le mot PI par 3.14159 partout dans le code, avant compilation
#define MAX 100      // même chose : MAX devient 100 (une « constante » de préprocesseur)</pre>

<h3>2. #define : macros</h3>
<p>Une <strong>macro</strong> est un remplacement de texte défini par <code>#define</code>. Elle peut être une simple constante, ou prendre un paramètre entre parenthèses.</p>
<pre class="pseudo">#define TVA 0.20                // constante : TVA sera remplacé par 0.20 partout
#define CARRE(x) ((x) * (x))    // MACRO avec paramètre : CARRE(quelque chose) devient ((quelque chose)*(quelque chose))
                                // (ligne vide)
double ttc = ht * (1 + TVA);    // après remplacement : ht * (1 + 0.20)
int s = CARRE(5);               // après remplacement : ((5) * (5)) = 25</pre>
<div class="warn">Les parenthèses dans une macro sont vitales : <code>#define CARRE(x) x*x</code> donnerait pour <code>CARRE(2+3)</code> le résultat <code>2+3*2+3 = 11</code> au lieu de 25. Pour de vraies constantes typées, <code>const</code> est souvent préférable à <code>#define</code>.</div>

<h3>3. Séparer déclaration et définition : .h et .c</h3>
<p>Un gros projet se découpe en plusieurs fichiers. Un fichier <strong>.h</strong> (en-tête, <em>header</em>) <em>annonce</em> les fonctions (leurs prototypes) ; un fichier <strong>.c</strong> les <em>définit</em> (leur corps). Les autres fichiers incluent le <code>.h</code> pour savoir que ces fonctions existent.</p>
<pre class="pseudo">/* tarif.h — les déclarations */                  // ce fichier ne contient que des annonces
#ifndef TARIF_H                                   // début du garde d'inclusion (voir §4)
#define TARIF_H                                   // on marque "TARIF_H déjà vu"
double tarif(double prixJour, int jours);         // PROTOTYPE : on annonce la fonction (pas de corps, juste ;)
#endif                                            // fin du garde d'inclusion</pre>
<pre class="pseudo">/* tarif.c — les définitions */                    // ce fichier contient le vrai code
#include "tarif.h"                                 // inclut sa propre déclaration (cohérence)
double tarif(double prixJour, int jours) {         // DÉFINITION complète de la fonction
    double t = prixJour * jours;                   // calcule le total
    if (jours &gt;= 3) t *= 0.9;                      // remise -10 % dès 3 jours
    return t;                                      // renvoie le résultat
}                                                  // fin de la fonction</pre>
<pre class="pseudo">/* main.c — l'utilisation */                       // le programme principal
#include &lt;stdio.h&gt;                                 // chevrons &lt; &gt; : en-tête du SYSTÈME
#include "tarif.h"                                 // guillemets "..." : NOTRE fichier
int main(void) { printf("%.2f\\n", tarif(5.0, 4)); return 0; }   // appelle tarif, affiche 18.00</pre>

<h3>4. Le garde d'inclusion (include guard)</h3>
<p>Le trio <code>#ifndef / #define / #endif</code> (« si non défini / définir / fin du si ») empêche qu'un même en-tête soit inclus <strong>deux fois</strong> (ce qui provoquerait des erreurs de redéfinition). La première inclusion définit le nom (<code>TARIF_H</code>) ; à la seconde, le <code>#ifndef</code> voit qu'il est déjà défini et saute le contenu. Chaque <code>.h</code> doit en avoir un.</p>

<h3>5. Compiler plusieurs fichiers</h3>
<pre class="pseudo">gcc -Wall main.c tarif.c -o app     # on liste TOUS les .c ; gcc les compile puis les relie ("lie") en un seul exécutable app
./app                               # on lance l'exécutable produit</pre>
<div class="tip">Sur les gros projets, on automatise avec un <strong>Makefile</strong> (commande <code>make</code>) qui ne recompile que les fichiers modifiés. Idée clé : <code>#include &lt;...&gt;</code> pour les en-têtes du système, <code>#include "..."</code> pour les tiens.</div>`,
  exercises: [
    { type: "qcm", q: "Quand agit le préprocesseur ?", opts: ["Après l'exécution", "Avant la compilation", "Pendant l'exécution", "Jamais"], a: 1, exp: "Il transforme le texte source avant la compilation." },
    { type: "qcm", q: "Que fait <code>#define MAX 100</code> ?", opts: ["Crée une variable", "Remplace MAX par 100 partout dans le code", "Alloue 100 octets", "Affiche 100"], a: 1, exp: "Substitution de texte par le préprocesseur." },
    { type: "qcm", q: "Que contient typiquement un fichier .h ?", opts: ["Les définitions complètes", "Les déclarations : prototypes, types, macros", "Le main", "Rien"], a: 1, exp: "L'en-tête annonce ; le .c définit." },
    { type: "qcm", q: "Quelle forme d'include pour TES fichiers ?", opts: ["#include <mon.h>", "#include \"mon.h\"", "#import mon.h", "include mon.h"], a: 1, exp: "Guillemets pour tes fichiers, chevrons pour le système." },
    { type: "qcm", q: "À quoi sert <code>#ifndef / #define / #endif</code> dans un .h ?", opts: ["À accélérer", "À éviter la double inclusion (include guard)", "À définir main", "À compiler"], a: 1, exp: "Le garde d'inclusion protège contre les redéfinitions." },
    { type: "qcm", q: "Pourquoi les parenthèses dans <code>#define CARRE(x) ((x)*(x))</code> ?", opts: ["Décoration", "Éviter les erreurs de priorité lors de la substitution", "Accélérer", "Inutiles"], a: 1, exp: "Sans elles, CARRE(2+3) donnerait 2+3*2+3." },
    { type: "qcm", q: "Comment compiler main.c et tarif.c ensemble ?", opts: ["gcc main.c", "gcc main.c tarif.c -o app", "gcc *.h -o app", "gcc -c only"], a: 1, exp: "On liste tous les .c ; les .h ne se compilent pas." },
    { type: "qcm", q: "Un fichier .h se compile-t-il directement ?", opts: ["Oui", "Non : il est inclus dans les .c", "Seulement avec -h", "Toujours en premier"], a: 1, exp: "On compile les .c ; les .h y sont recopiés par #include." },
    { type: "qcm", q: "Pour une vraie constante typée, on préfère souvent…", opts: ["#define", "const", "une macro", "une variable globale"], a: 1, exp: "const est typé et respecte les règles de portée." },
    { type: "qcm", q: "À quoi sert un Makefile ?", opts: ["À écrire du C", "À automatiser la compilation (ne recompiler que le nécessaire)", "À exécuter", "À déboguer"], a: 1, exp: "make gère la compilation des gros projets." },
    { type: "vf", q: "Les lignes commençant par # sont du code C classique.", a: false, exp: "Faux : ce sont des directives du préprocesseur, traitées avant la compilation." },
    { type: "qcm", q: "Où mettre le prototype d'une fonction partagée entre fichiers ?", opts: ["Dans chaque .c", "Dans le .h inclus par tous", "Dans main uniquement", "Nulle part"], a: 1, exp: "Le .h centralise les déclarations partagées." },
    { type: "qcm", q: "<code>CARRE(2+3)</code> avec <code>#define CARRE(x) x*x</code> donne…", opts: ["25", "11 (2+3*2+3)", "10", "6"], a: 1, exp: "Substitution brute sans parenthèses : bug de priorité." },
    { type: "qcm", q: "<code>#include \"tarif.h\"</code> a pour effet de…", opts: ["Exécuter tarif.h", "Recopier le contenu de tarif.h à cet endroit", "Compiler tarif.h", "Rien"], a: 1, exp: "#include = inclusion textuelle." },
    { type: "qcm", q: "Bonne séparation d'un projet :", opts: ["Tout dans main.c", "Déclarations en .h, définitions en .c, includes croisés", "Un seul gros fichier", "Que des .h"], a: 1, exp: "Découpage .h/.c : lisibilité et compilation séparée." }
  ],
  final: {
    title: "Exercice final — Découper un projet",
    intro: `<p>On répartit une fonction dans deux fichiers. Repère les problèmes de ce tarif.h :</p>
<pre class="pseudo">/* tarif.h */                          // ce fichier .h ...
double tarif(double prixJour, int jours) {   // ERREUR : un .h ne doit contenir que le PROTOTYPE, pas le corps
    return prixJour * jours;           // ... ce corps n'a rien à faire dans un en-tête
}                                      // (et il manque un include guard #ifndef/#define/#endif)</pre>
<pre class="pseudo">/* main.c */                           // le programme principal
#include <tarif.h>                     // ERREUR : pour un fichier À TOI, il faut des guillemets "tarif.h"
int main(void){ return 0; }            // main vide</pre>`,
    questions: [
      { type: "qcm", q: "Problème n°1 — le .h contient la DÉFINITION complète :", opts: ["Correct", "Un .h doit contenir la déclaration (prototype), pas le corps", "Il faut void", "Rien"], a: 1, exp: "Définir dans un .h inclus par plusieurs .c cause des erreurs de duplication." },
      { type: "qcm", q: "Problème n°2 — <code>#include &lt;tarif.h&gt;</code> :", opts: ["Correct", "Pour un fichier à toi, on utilise des guillemets : \"tarif.h\"", "Il faut #import", "Rien"], a: 1, exp: "Chevrons = système ; guillemets = tes fichiers." },
      { type: "qcm", q: "Que manque-t-il dans tarif.h pour éviter la double inclusion ?", opts: ["Rien", "Un include guard : #ifndef / #define / #endif", "Un printf", "Un return"], a: 1, exp: "Le garde protège des inclusions multiples." },
      { type: "qcm", q: "Où mettre le corps de tarif ?", opts: ["Dans tarif.h", "Dans tarif.c, qui inclut tarif.h", "Dans main seulement", "Nulle part"], a: 1, exp: "Déclaration en .h, définition en .c." },
      { type: "qcm", q: "Commande de compilation correcte ?", opts: ["gcc tarif.h -o app", "gcc main.c tarif.c -o app", "gcc *.h", "gcc main.c -o app (sans tarif.c)"], a: 1, exp: "On compile les deux .c ensemble." }
    ],
    solution: `<pre class="pseudo">/* tarif.h — déclaration seule, avec garde */   // en-tête : que des annonces
#ifndef TARIF_H                                 // si TARIF_H pas encore défini...
#define TARIF_H                                 // ...on le définit (empêche la double inclusion)
double tarif(double prixJour, int jours);       // PROTOTYPE seul (se termine par ;)
#endif                                          // fin du garde
                                                // (ligne vide)
/* tarif.c — définition */                       // fichier des définitions
#include "tarif.h"                               // inclut sa déclaration
double tarif(double prixJour, int jours) {       // corps complet de la fonction
    double t = prixJour * jours;                 // total de base
    if (jours &gt;= 3) t *= 0.9;                    // remise -10 % dès 3 jours
    return t;                                    // renvoie le résultat
}                                                // fin de la fonction
                                                // (ligne vide)
/* main.c — utilisation */                       // programme principal
#include &lt;stdio.h&gt;                               // en-tête système (chevrons)
#include "tarif.h"                               // notre en-tête (guillemets)
int main(void) { printf("%.2f\\n", tarif(5.0, 4)); return 0; }   // appelle tarif → 18.00
                                                // (ligne vide)
/* Compiler : gcc -Wall main.c tarif.c -o app */ // on lie les deux .c en un exécutable</pre>
<p>La bonne organisation : prototype gardé dans le <code>.h</code>, corps dans le <code>.c</code>, guillemets pour tes en-têtes. C'est ainsi qu'on structure tout projet C sérieux. Demain : lire et écrire des fichiers.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code C ici…",
  items: [
  { id: "c-l15", title: "Un module « remise »", level: 3,
    statement: "Écris le contenu d'un fichier d'en-tête <code>remise.h</code> déclarant une fonction <code>double prix_remise(double prix, double taux)</code>, avec un include guard correct. Puis écris le <code>remise.c</code> qui la définit (prix × (1 - taux)).",
    hints: [
      "Le .h : #ifndef REMISE_H / #define REMISE_H / le prototype ; / #endif",
      "Le prototype se termine par un ; (pas de corps dans le .h).",
      "Le .c commence par #include \"remise.h\" puis définit la fonction."
    ],
    solution: "/* remise.h */                       // fichier d'en-tete : declarations seulement\n#ifndef REMISE_H                     // si REMISE_H pas encore defini...\n#define REMISE_H                     // ...on le definit (garde d'inclusion)\n\ndouble prix_remise(double prix, double taux);   // PROTOTYPE : annonce, se termine par ;\n\n#endif                               // fin du garde d'inclusion\n\n/* remise.c */                       // fichier des definitions\n#include \"remise.h\"                   // guillemets : notre propre en-tete\n\ndouble prix_remise(double prix, double taux) {  // DEFINITION complete de la fonction\n    return prix * (1.0 - taux);      // renvoie le prix reduit du taux (ex. taux 0.2 → *0.8)\n}                                    // fin de la fonction\n\n/* Compiler avec main : gcc -Wall main.c remise.c -o app */   // on lie les .c ensemble",
    note: "Le garde d'inclusion empêche la double définition, la déclaration reste dans le .h et la définition dans le .c. C'est le patron de tout module C réutilisable." }
  ]
};
