  theory: `
<h3>1. Le C, c'est quoi ?</h3>
<p>Un <strong>langage de programmation</strong> est une façon d'écrire des <strong>ordres</strong> (on dit des <em>instructions</em>) que l'ordinateur va exécuter. Comme une langue humaine, il a un vocabulaire et une grammaire précis : c'est ce qu'on appelle la <strong>syntaxe</strong> (les règles d'écriture à respecter à la lettre).</p>
<p>Le C est un langage <strong>compilé</strong>, <strong>à typage statique</strong> et <strong>procédural</strong>, créé en 1972 par Dennis Ritchie. Décortiquons ces trois mots. <strong>Compilé</strong> : ton texte (le <em>code source</em>) est d'abord entièrement traduit en langage machine avant de tourner (on détaille juste après). <strong>À typage statique</strong> : chaque donnée a une nature fixée d'avance (un entier, un caractère…) — le <em>type</em> — et cette nature ne change pas ; on verra ça leçon 2. <strong>Procédural</strong> : on organise le programme en <em>procédures</em>, c'est-à-dire en petits blocs d'instructions réutilisables appelés <strong>fonctions</strong>. C'est le langage des <strong>systèmes</strong> : noyau Linux, pilotes de matériel, moteurs de bases de données, objets embarqués (micro-ondes, voitures…). Presque tous les autres langages (Python, PHP, Java…) sont eux-mêmes écrits en C. Il est réputé pour sa <strong>vitesse</strong> et son <strong>contrôle de la mémoire</strong>, au prix d'une grande rigueur.</p>
<p><strong>Compilé</strong>, en détail : un logiciel appelé le <strong>compilateur</strong> (ici <em>GCC</em>, un compilateur C très répandu et gratuit) lit tout ton code source et le traduit en un <strong>exécutable binaire</strong> — un fichier rempli de 0 et de 1 que le processeur comprend directement. Il y a donc deux étapes : on <strong>compile</strong> (commande <code>gcc prog.c -o prog</code>), puis on <strong>exécute</strong> le fichier produit (commande <code>./prog</code>). Si le code contient une <strong>erreur de syntaxe</strong> (une faute de grammaire), la compilation échoue et rien ne s'exécute : le compilateur refuse de traduire un texte incorrect.</p>

<h3>2. Le programme minimal</h3>
<p>Une <strong>fonction</strong> est un bloc d'instructions portant un nom, qu'on peut lancer (« appeler ») quand on veut. Le C exige une fonction très spéciale nommée <code>main</code> (« principal » en anglais) : c'est le <strong>point d'entrée</strong>, l'endroit exact où l'ordinateur commence à exécuter le programme.</p>
<pre class="pseudo">#include &lt;stdio.h&gt;                    // # = ordre donné AVANT compilation ; include = "colle ici" le fichier stdio.h (qui contient printf)
                                       // (ligne vide : ignorée, elle sert juste à aérer le code)
int main(void) {                       // int = renvoie un entier ; main = point d'entrée ; (void) = ne reçoit rien ; { ouvre le bloc
    printf("Bonjour le monde !\\n");    // printf = affiche le texte entre "..." ; \\n = passe à la ligne ; ; = fin d'instruction
    return 0;                          // return = "je rends cette valeur au système" ; 0 = tout s'est bien passé
}                                      // } ferme le bloc de la fonction main</pre>
<p>Contrairement à Python, le C <strong>exige</strong> cette fonction <code>main</code> : c'est là que l'exécution démarre. La ligne <code>#include &lt;stdio.h&gt;</code> est une <strong>directive</strong> (un ordre destiné au compilateur, reconnaissable au <code>#</code>) qui importe une <strong>bibliothèque</strong> — un ensemble d'outils tout prêts fournis avec le langage. Ici <code>stdio.h</code> (pour <em>standard input/output</em>, entrées/sorties standard) contient <code>printf</code> : sans elle, <code>printf</code> n'existerait pas et le programme ne compilerait pas.</p>

<h3>3. printf et le saut de ligne</h3>
<p><code>printf</code> (pour <em>print formatted</em>, « afficher en mettant en forme ») est la fonction qui <strong>affiche du texte à l'écran</strong>. Le texte à afficher se met entre <strong>guillemets doubles</strong> <code>"..."</code> : on appelle ça une <strong>chaîne de caractères</strong> (une suite de lettres, chiffres et symboles). Contrairement au <code>println</code> d'autres langages, <code>printf</code> <strong>ne saute pas de ligne tout seul</strong> : c'est à toi d'ajouter <code>\\n</code> (le caractère « saut de ligne », comme appuyer sur Entrée) quand tu veux passer à la ligne suivante.</p>
<pre class="pseudo">printf("A");        // affiche la lettre A et RESTE sur la même ligne (aucun \\n)
printf("B\\n");      // affiche B puis \\n fait passer à la ligne suivante
printf("C\\n");      // affiche C sur cette nouvelle ligne, puis saute encore ; à l'écran on lit "AB" puis "C" en dessous</pre>

<h3>4. Point-virgule, accolades, indentation</h3>
<p>En C, chaque <strong>instruction</strong> (chaque ordre) se termine par un <strong>point-virgule <code>;</code></strong>, comme un point à la fin d'une phrase (l'oublier est l'erreur n°1 du débutant). Les <strong>blocs</strong> — des groupes d'instructions — sont entourés par des <strong>accolades <code>{ }</code></strong> : <code>{</code> ouvre, <code>}</code> ferme. L'<strong>indentation</strong> (le décalage vers la droite de quelques espaces au début des lignes) n'est <em>pas</em> obligatoire pour le compilateur, mais elle est indispensable pour la lisibilité : 4 espaces par niveau.</p>
<div class="warn">Le C est sensible à la <strong>casse</strong> (la distinction majuscules/minuscules) : <code>Printf</code> ≠ <code>printf</code>, <code>Main</code> ≠ <code>main</code>. Et n'oublie jamais le <code>;</code> en fin d'instruction.</div>

<h3>5. Les commentaires</h3>
<p>Un <strong>commentaire</strong> est un texte que le compilateur <strong>ignore</strong> totalement : il ne sert qu'à toi et aux autres humains, pour expliquer le code. Il existe deux façons de commenter :</p>
<pre class="pseudo">// commentaire sur une seule ligne (tout ce qui suit // est ignoré, depuis la norme C99)
/* commentaire                        // /* ouvre un commentaire...
   sur plusieurs lignes */            // ...et */ le ferme : tout ce qui est entre les deux est ignoré</pre>
<div class="tip">Compile toujours avec les avertissements : <code>gcc -Wall -Wextra prog.c -o prog</code>. Les options <code>-Wall</code> et <code>-Wextra</code> (de l'anglais <em>Warning all/extra</em>) demandent au compilateur de signaler tout ce qui lui semble louche. Il devient alors ton meilleur relecteur et repère les erreurs discrètes avant qu'elles ne deviennent des bugs.</div>`,
  exercises: [
    { type: "qcm", q: "Quel est le point d'entrée obligatoire d'un programme C ?", opts: ["La fonction start()", "La fonction main", "La première ligne du fichier", "La fonction printf"], a: 1, exp: "Tout programme C démarre par la fonction main." },
    { type: "qcm", q: "À quoi sert <code>#include &lt;stdio.h&gt;</code> ?", opts: ["À compiler le programme","À donner accès aux fonctions d'entrée/sortie comme printf","À déclarer main","À définir les types de base du langage"], a: 1, exp: "stdio.h = standard input/output : sans elle, pas de printf." },

    { type: "qcm", q: "Comment se termine chaque instruction en C ?", opts: ["Par un saut de ligne", "Par un point-virgule ;", "Par une virgule", "Par rien"], a: 1, exp: "Le ; termine l'instruction : l'oublier est l'erreur n°1." },

    { type: "qcm", q: "Après <code>gcc prog.c -o prog</code>, comment lance-t-on le programme ?", opts: ["gcc prog", "./prog", "run prog.c", "prog.c"], a: 1, exp: "./prog exécute le binaire produit." },
    { type: "qcm", q: "Quel commentaire est valide en C ?", opts: ["# commentaire", "// commentaire", "-- commentaire", "; commentaire"], a: 1, exp: "// (une ligne) et /* */ (plusieurs lignes)." },
    { type: "qcm", q: "L'option <code>-Wall</code> de gcc sert à…", opts: ["Compiler plus vite","Activer tous les avertissements utiles","Réduire la taille de l'exécutable produit","Lier automatiquement la bibliothèque mathématique"], a: 1, exp: "-Wall (et -Wextra) affichent les avertissements : très recommandé." },
    { type: "qcm", q: "Quelle extension pour un fichier source C ?", opts: [".c", ".cpp", ".py", ".exe"], a: 0, exp: "Le source est en .c ; l'exécutable produit n'a pas d'extension sous Linux." }
  ],

<pre class="pseudo">include &lt;stdio.h&gt;                        // ERREUR : le # manque devant include (ce doit être #include)

      { type: "qcm", q: "Erreur n°2 — <code>Printf(\"Aurelia\\n\")</code> :", opts: ["Correct", "printf avec p minuscule, et il manque le ; final", "Il faut println", "Il faut deux \\n"], a: 1, exp: "Casse : printf ; et l'instruction doit finir par ;." },
      { type: "qcm", q: "Erreur n°3 — la ligne <code>return 0</code> :", opts: ["Correcte", "Il manque le point-virgule : return 0;", "Il faut return 1", "return est interdit"], a: 1, exp: "Toute instruction se termine par ;." },
      { type: "qcm", q: "<code>int main()</code> renvoie une valeur de type…", opts: ["texte", "int (entier)", "rien", "double"], a: 1, exp: "main renvoie un int : d'où return 0; (fin normale)." },
      { type: "qcm", q: "Une fois corrigé, combien de lignes s'affichent à l'écran ?", opts: ["1", "2, une par printf", "3", "0"], a: 1, exp: "Deux printf corrects, chacun avec \\n = deux lignes." }

    printf("Bachelier en informatique\\n");  // deuxième ligne affichée
    return 0;                           // ; ajouté ; 0 = fin sans erreur
}                                       // fin de main
/* Compiler : gcc -Wall carte.c -o carte    // # aurait servi pour du code ; ici c'est un commentaire multi-lignes
   Lancer   : ./carte */                // ./carte exécute le binaire produit</pre>
<p>Quatre corrections : le <code>#</code> de #include, la casse de printf, les <code>;</code> manquants. Le C récompense la rigueur : le compilateur ne pardonne rien, mais c'est ainsi qu'on écrit du code fiable. Demain : les variables et les types.</p>`
