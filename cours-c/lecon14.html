<script>
var DAY = {
  num: 14,
  title: "Traduire ses algorithmes en C",
  subtitle: "Faire le pont entre le pseudocode du mois d'algorithmique et le C : la table de traduction complète.",
  theory: `
<h3>1. La table de traduction</h3>
<p>Le <strong>pseudocode</strong> est une façon d'écrire un algorithme en français structuré, sans langage précis. Voici comment traduire chaque élément du pseudocode vers du vrai code C (à gauche le pseudocode, à droite le C) :</p>
<pre class="pseudo">PSEUDOCODE                  C
Écrire(x)                   printf(...) avec le bon %d/%f/%s   // afficher : choisir %d entier, %f réel, %s chaîne
Lire(x)                     scanf("%d", &amp;x)                     // lire au clavier : ne pas oublier le &amp; (adresse)
Variable entière n          int n;                              // un entier
Variable réelle x           double x;                           // un nombre à virgule
DÉBUT ... FIN               { ... }                             // un bloc se délimite par des accolades
Si cond Alors ... FinSi     if (cond) { ... }                   // condition entre ( ), corps entre { }
Sinon                       else { ... }                        // la branche "sinon"
Tant que cond               while (cond) { ... }                // répéter tant que la condition tient
Pour i de 1 à n             for (int i = 1; i &lt;= n; i++) { ... } // boucle compteur
Tableau T[10]               int T[10];  (indices 0 à 9 !)       // ATTENTION : les cases vont de 0 à 9, pas 1 à 10
Fonction f(...) : retour    type f(...) { return ...; }         // le type de retour porte la nature du résultat</pre>

<h3>2. Le piège des indices</h3>
<p>En algorithmique, les tableaux commencent souvent à <strong>1</strong>. En C, ils commencent à <strong>0</strong>. « Pour i de 1 à n » se traduit en <code>for (int i = 0; i &lt; n; i++)</code> si on parcourt les cases, ou en <code>for (int i = 1; i &lt;= n; i++)</code> si on compte vraiment de 1 à n (attention alors à ne pas lire T[n], qui n'existe pas).</p>

<h3>3. Exemple : la moyenne d'une série</h3>
<pre class="pseudo">// Pseudocode :                            // version algorithmique
// somme ← 0                               // ← signifie "reçoit la valeur" (affectation)
// Pour i de 1 à n : somme ← somme + T[i]  // additionner tous les éléments
// moyenne ← somme / n                     // diviser par le nombre d'éléments
                                           // (ligne vide)
double somme = 0;                          // somme est un DOUBLE (important pour la division)
for (int i = 0; i &lt; n; i++)                // en C : parcours des cases 0 à n-1
    somme += T[i];                         // ajouter la case i à la somme
double moyenne = somme / n;                // somme est un double → division RÉELLE (pas entière)</pre>

<h3>4. Exemple : recherche du maximum</h3>
<pre class="pseudo">int max = T[0];                            // on part du PREMIER élément réel (robuste même si négatifs)
for (int i = 1; i &lt; n; i++) {              // parcourir à partir de l'indice 1
    if (T[i] &gt; max)                        // si la case i dépasse le max connu...
        max = T[i];                        // ...elle devient le nouveau max
}                                          // fin de la boucle</pre>

<h3>5. Exemple : recherche linéaire</h3>
<pre class="pseudo">int trouve = -1;                           // -1 = valeur "sentinelle" signifiant « pas trouvé »
for (int i = 0; i &lt; n; i++) {              // parcourir toutes les cases
    if (T[i] == cible) {                   // si la case i est égale à ce qu'on cherche...
        trouve = i;                        // ...on mémorise sa POSITION (l'indice)
        break;                             // inutile de continuer : on sort de la boucle
    }                                      // fin du if
}                                          // fin de la boucle</pre>
<div class="tip">La logique algorithmique est identique dans tous les langages : ce qui change, c'est la syntaxe et deux détails propres au C — les indices à partir de 0 et la vigilance sur les types (division entière, débordement). Maîtrise la table et tu traduis n'importe quel algorithme.</div>`,
  exercises: [
    { type: "qcm", q: "« Écrire(x) » se traduit en C par…", opts: ["write(x)", "printf avec le bon spécificateur", "echo x", "cout << x"], a: 1, exp: "printf(\"%d\", x) selon le type." },
    { type: "qcm", q: "« Lire(x) » (x entier) devient…", opts: ["scanf(\"%d\", x)", "scanf(\"%d\", &x)", "read(x)", "input(x)"], a: 1, exp: "scanf avec l'adresse : &x." },
    { type: "qcm", q: "« Pour i de 1 à n » (parcours des n cases d'un tableau C) :", opts: ["for (i=1; i<=n; i++)", "for (int i=0; i<n; i++)", "for (i=0; i<=n; i++)", "while(n)"], a: 1, exp: "En C, les cases vont de 0 à n-1." },
    { type: "qcm", q: "En algorithmique les tableaux commencent souvent à 1 ; en C ils commencent à…", opts: ["1", "0", "-1", "n"], a: 1, exp: "Indice 0 : le grand piège de traduction." },
    { type: "qcm", q: "« Tant que cond » devient…", opts: ["for(cond)", "while (cond) { ... }", "do { } ", "if(cond)"], a: 1, exp: "while (cond)." },
    { type: "qcm", q: "« Si cond Alors ... FinSi » devient…", opts: ["if cond then", "if (cond) { ... }", "when (cond)", "case cond"], a: 1, exp: "Condition entre parenthèses, corps entre accolades." },
    { type: "qcm", q: "Pour initialiser la recherche du maximum, on part de…", opts: ["max = 0", "max = T[0]", "max = -1", "max = n"], a: 1, exp: "Le premier élément réel : robuste même avec des négatifs." },
    { type: "qcm", q: "Pour une moyenne juste, il faut que la somme soit…", opts: ["un int", "un double (sinon division entière)", "un char", "un pointeur"], a: 1, exp: "double somme → division réelle." },
    { type: "qcm", q: "Dans une recherche linéaire, que fait break après avoir trouvé ?", opts: ["Rien d'utile", "Arrête la boucle : inutile de continuer", "Recommence", "Renvoie -1"], a: 1, exp: "On sort dès que la cible est trouvée." },
    { type: "qcm", q: "Une valeur sentinelle « pas trouvé » courante :", opts: ["0", "-1", "n", "NULL"], a: 1, exp: "-1 n'est pas un indice valide : bon marqueur d'absence." },
    { type: "vf", q: "La logique d'un algorithme change complètement selon le langage.", a: false, exp: "Faux : la logique est identique ; seule la syntaxe change." },
    { type: "qcm", q: "« Fonction f() : retourne un réel » devient…", opts: ["void f()", "double f(...) { return ...; }", "int f()", "f() : real"], a: 1, exp: "Le type de retour porte le type de la valeur renvoyée." },
    { type: "qcm", q: "Combien de cases parcourt <code>for (int i = 0; i < n; i++)</code> ?", opts: ["n-1", "n", "n+1", "1"], a: 1, exp: "Exactement n itérations (0 à n-1)." },
    { type: "qcm", q: "Le principal piège du C par rapport au pseudocode, côté tableaux :", opts: ["Les accolades", "Les indices commençant à 0", "Le point-virgule", "printf"], a: 1, exp: "Décalage d'indice : source d'erreurs off-by-one." },
    { type: "qcm", q: "« DÉBUT ... FIN » d'un bloc se traduit par…", opts: ["begin ... end", "{ ... }", "( ... )", "do ... done"], a: 1, exp: "Les accolades délimitent un bloc en C." }
  ],
  final: {
    title: "Exercice final — Compter les jeux en rupture",
    intro: `<p>Algorithme : compter les jeux dont le stock vaut 0. On veut le traduire en C. Corrige :</p>
<pre class="pseudo">int stocks[5] = {3, 0, 5, 0, 2};   // 5 stocks (indices 0 à 4)
int rupture = 0;                   // compteur de jeux en rupture
for (int i = 1; i <= 5; i++) {     // ERREUR : indices C = 0 à 4 → il faut i de 0 à n-1 (i <= 5 déborde)
    if (stocks[i] = 0)             // ERREUR : un seul = affecte au lieu de comparer → il faut ==
        rupture++;                 // compter ce jeu en rupture
}                                  // fin de la boucle
printf("%d en rupture\\n", rupture);  // afficher le total</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — la boucle <code>for (i = 1; i <= 5; i++)</code> :", opts: ["Correct", "Indices C de 0 à 4 : il faut for (i = 0; i < 5; i++)", "Il faut i <= 4", "Rien"], a: 1, exp: "En C on parcourt de 0 à n-1." },
      { type: "qcm", q: "Erreur n°2 — <code>if (stocks[i] = 0)</code> :", opts: ["Correct", "Comparaison : il faut == (le simple = affecte)", "Il faut <", "stocks est réservé"], a: 1, exp: "== compare, = affecte : bug classique." },
      { type: "qcm", q: "Avec le code corrigé, combien de jeux en rupture ?", opts: ["1", "2", "3", "0"], a: 1, exp: "Deux stocks à 0 (indices 1 et 3)." },
      { type: "qcm", q: "Pourquoi <code>i <= 5</code> serait dangereux ici ?", opts: ["Trop lent", "Accès à stocks[5], hors du tableau (débordement)", "Rien", "Affiche mal"], a: 1, exp: "Le tableau n'a que les indices 0 à 4." },
      { type: "qcm", q: "Le décalage d'indice pseudocode(1..n) → C(0..n-1) s'appelle une erreur…", opts: ["de type", "off-by-one (erreur d'un cran)", "de segmentation", "de compilation"], a: 1, exp: "L'erreur « à un près » est le grand classique de traduction." }
    ],
    solution: `<pre class="pseudo">#include &lt;stdio.h&gt;                            // pour printf
                                             // (ligne vide)
int main(void) {                             // point d'entrée du programme
    int stocks[5] = {3, 0, 5, 0, 2};         // 5 stocks
    int n = sizeof(stocks) / sizeof(stocks[0]);  // nombre d'éléments = 5
    int rupture = 0;                         // compteur de ruptures
    for (int i = 0; i &lt; n; i++) {            // indices 0 à n-1 (corrigé)
        if (stocks[i] == 0)                  // == pour comparer (corrigé)
            rupture++;                        // compter ce jeu en rupture
    }                                        // fin de la boucle
    printf("%d en rupture\\n", rupture);       // affiche 2
    return 0;                                // 0 = fin sans erreur
}                                            // fin de main</pre>
<p>Deux réflexes de traduction : indices à partir de 0 et <code>==</code> pour comparer. Ta première moitié de cours est complète : tu sais traduire n'importe quel algorithme en C. Demain : organiser un projet en plusieurs fichiers.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code C ici…",
  items: [
  { id: "c-l14", title: "Recherche d'un jeu par son stock", level: 3,
    statement: "On a un tableau de 5 stocks. Écris une recherche linéaire qui renvoie l'indice du premier jeu dont le stock dépasse un seuil donné (par exemple 4), ou -1 si aucun. Affiche le résultat.",
    hints: [
      "Initialise trouve = -1.",
      "Boucle de 0 à n-1 : if (stocks[i] > seuil) { trouve = i; break; }",
      "Affiche selon trouve : soit l'indice, soit « aucun »."
    ],
    solution: "#include <stdio.h>                    // pour printf\n\nint main(void) {                     // point d'entree du programme\n    int stocks[5] = {3, 0, 5, 8, 2}; // 5 stocks (indices 0 a 4)\n    int n = sizeof(stocks) / sizeof(stocks[0]);  // nombre d'elements = 5\n    int seuil = 4;                   // seuil a depasser\n    int trouve = -1;                 // sentinelle : -1 = pas encore trouve\n    for (int i = 0; i < n; i++) {    // parcourt les cases 0 a n-1\n        if (stocks[i] > seuil) {     // si ce stock depasse le seuil...\n            trouve = i;              // ...on memorise sa position\n            break;                   // premier trouve : on s'arrete\n        }                            // fin du if\n    }                                // fin de la boucle\n    if (trouve != -1)                // si on a trouve quelque chose...\n        printf(\"Premier jeu > %d : indice %d (stock %d)\\n\", seuil, trouve, stocks[trouve]);  // ...on l'affiche\n    else                             // sinon (trouve vaut toujours -1)...\n        printf(\"Aucun jeu au-dessus de %d\\n\", seuil);  // ...aucun resultat\n    return 0;                        // 0 = fin sans erreur\n}                                    // fin de main",
    note: "Recherche linéaire classique : sentinelle -1, parcours de 0 à n-1, break dès le premier résultat. La logique est la même qu'en pseudocode, seule la syntaxe change." }
  ]
};
