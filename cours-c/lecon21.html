<h3>Récapitulatif du parcours</h3>

    title: "Épreuve finale — Lire, corriger, comprendre",
    intro: `<p>Un programme qui calcule la moyenne de n notes saisies. Analyse-le :</p>
<pre class="pseudo">#include &lt;stdio.h&gt;                          // pour printf et scanf
#include &lt;stdlib.h&gt;                         // pour malloc et free
                                           // (ligne vide)
int main(void) {                           // point d'entrée du programme
    int n;                                 // nombre de notes
    printf("Combien de notes ? ");         // prompt
    scanf("%d", &n);                       // lire n (sans vérifier la saisie : à améliorer)
    double *notes = malloc(n * sizeof(double));  // réserver n réels ; MANQUE le test == NULL
    double somme = 0;                      // accumulateur
    for (int i = 0; i < n; i++) {          // parcourir les n notes
        scanf("%lf", &notes[i]);           // %lf pour lire un double ; & = adresse de la case
        somme += notes[i];                 // additionner
    }                                      // fin de la boucle
    printf("Moyenne : %.2f\\n", somme / n); // somme est un double → division réelle correcte
    free(notes);                           // libérer (idéalement suivi de notes = NULL)
    return 0;                              // 0 = fin sans erreur
}                                          // fin de main</pre>`,

    ],
    solution: `<pre class="pseudo">#include &lt;stdio.h&gt;                            // pour printf et scanf
#include &lt;stdlib.h&gt;                           // pour malloc et free
                                             // (ligne vide)
int main(void) {                             // point d'entrée du programme
    int n;                                   // nombre de notes
    printf("Combien de notes ? ");           // prompt
    if (scanf("%d", &amp;n) != 1 || n &lt;= 0) return 1;  // lire n ET vérifier qu'il est valide
                                             // (ligne vide)
    double *notes = malloc(n * sizeof(double));   // réserver n réels
    if (notes == NULL) return 1;             // vérifier l'allocation
                                             // (ligne vide)
    double somme = 0.0;                      // accumulateur réel
    for (int i = 0; i &lt; n; i++) {            // parcourir les n notes
        if (scanf("%lf", &amp;notes[i]) != 1) { free(notes); return 1; }  // lire ET vérifier chaque saisie
        somme += notes[i];                   // additionner la note lue
    }                                        // fin de la boucle
    printf("Moyenne : %.2f\\n", somme / n);    // division réelle (somme est un double)
                                             // (ligne vide)
    free(notes);                             // libérer la mémoire
    notes = NULL;                            // neutraliser le pointeur
    return 0;                                // 0 = fin sans erreur
}                                            // fin de main</pre>
<p>Le programme d'origine était presque juste : il manquait surtout la vérification de <code>malloc</code> et des saisies. Tu maîtrises maintenant les fondamentaux du C — types, pointeurs, mémoire, structures, fichiers. Félicitations, et bon courage pour la suite du parcours C !</p>`
