<script>
var DAY = {
  num: 11,
  title: "Pointeurs, tableaux et passage par adresse",
  subtitle: "Un tableau EST une adresse : c'est pourquoi une fonction peut le modifier — mais oublie sa taille.",
  theory: `
<h3>1. Le nom d'un tableau est l'adresse du premier élément</h3>
<p>Souvenir de la leçon 10 : une <strong>adresse</strong> est le numéro d'une case mémoire, et un <strong>pointeur</strong> stocke une adresse. Fait essentiel en C : écrire le <strong>nom</strong> d'un tableau, c'est écrire l'<strong>adresse de sa première case</strong>. Autrement dit, <code>t</code> équivaut à <code>&amp;t[0]</code>.</p>
<pre class="pseudo">int t[3] = {10, 20, 30};   // un tableau de 3 entiers
// t équivaut à &amp;t[0]      // le nom t vaut l'adresse de la 1re case
int *p = t;                // légal : p (pointeur vers int) reçoit l'adresse du début de t
printf("%d\\n", *p);        // *p = valeur à cette adresse = t[0] → 10
printf("%d\\n", t[0]);      // même chose écrite avec des crochets → 10</pre>
<p>C'est la clé : passer un tableau à une fonction, c'est lui passer une <strong>adresse</strong>. La fonction accède donc au vrai tableau (pas à une copie) et peut le modifier.</p>

<h3>2. Un tableau en paramètre « oublie » sa taille</h3>
<pre class="pseudo">// ces deux signatures sont EXACTEMENT équivalentes :
double moyenne(int t[], int n) { ... }   // écriture "tableau"
double moyenne(int *t, int n) { ... }    // écriture "pointeur" : c'est la même chose</pre>
<div class="warn">Dans une fonction, <code>sizeof(t)</code> ne donne PAS la taille du tableau (il donne la taille d'un pointeur !). Il faut donc <strong>toujours passer la taille en paramètre</strong> à part. C'est la convention universelle en C.</div>

<h3>3. Une fonction qui remplit un tableau</h3>
<pre class="pseudo">void mettre_a_zero(int t[], int n) {   // t = adresse du tableau ; n = son nombre d'éléments
    for (int i = 0; i &lt; n; i++)         // parcourir les indices 0 à n-1
        t[i] = 0;                       // ranger 0 dans la case i du VRAI tableau de l'appelant
}                                       // fin de la fonction
int stocks[4] = {3, 8, 5, 2};          // un tableau à remettre à zéro
mettre_a_zero(stocks, 4);              // on passe l'adresse et la taille → stocks devient {0,0,0,0}</pre>

<h3>4. Arithmétique de pointeurs</h3>
<p>L'<strong>arithmétique de pointeurs</strong> consiste à ajouter/retirer un nombre à un pointeur. Ajouter 1 avance vers l'<strong>élément suivant</strong> (et non l'octet suivant) : le type du pointeur connaît la taille d'un élément et s'en occupe.</p>
<pre class="pseudo">int t[3] = {10, 20, 30};   // tableau de 3 entiers
int *p = t;                // p pointe vers t[0]
printf("%d\\n", *p);        // *p = t[0] → 10
printf("%d\\n", *(p + 1));  // p+1 = adresse de l'élément SUIVANT ; *(p+1) = t[1] → 20
p++;                       // on avance p d'un élément → p pointe maintenant vers t[1]
printf("%d\\n", *p);        // *p = t[1] → 20</pre>
<p>Ainsi <code>t[i]</code> est exactement équivalent à <code>*(t + i)</code> : les crochets sont un raccourci d'arithmétique de pointeurs.</p>

<h3>5. const pour protéger un tableau</h3>
<pre class="pseudo">double somme(const double t[], int n) {   // const = la fonction PROMET de ne pas modifier t (lecture seule)
    double s = 0;                          // accumulateur
    for (int i = 0; i &lt; n; i++) s += t[i]; // additionner chaque élément
    return s;                              // renvoyer la somme
}                                          // fin de la fonction</pre>
<div class="tip">Mettre <code>const</code> sur un paramètre tableau quand la fonction ne fait que le lire : ça documente l'intention et le compilateur t'empêche de le modifier par erreur.</div>`,
  exercises: [
    { type: "qcm", q: "Le nom d'un tableau t équivaut à…", opts: ["sa taille", "l'adresse de son premier élément (&t[0])", "sa dernière case", "NULL"], a: 1, exp: "t == &t[0] : un tableau se comporte comme une adresse." },
    { type: "qcm", q: "Passer un tableau à une fonction, c'est passer…", opts: ["une copie complète", "son adresse", "sa taille", "sa moyenne"], a: 1, exp: "On passe l'adresse : la fonction accède au vrai tableau." },
    { type: "qcm", q: "Que donne <code>sizeof(t)</code> dans une fonction où t est un paramètre tableau ?", opts: ["La taille du tableau", "La taille d'un pointeur (pas du tableau !)", "Le nombre d'éléments", "0"], a: 1, exp: "Le tableau y est un pointeur : d'où l'obligation de passer n." },
    { type: "qcm", q: "Comment connaître le nombre d'éléments dans une fonction ?", opts: ["sizeof(t)/sizeof(t[0])", "Le recevoir en paramètre (int n)", "strlen(t)", "count(t)"], a: 1, exp: "On passe toujours la taille à part." },
    { type: "qcm", q: "Une fonction peut-elle modifier le tableau qu'on lui passe ?", opts: ["Non, c'est une copie", "Oui : elle reçoit l'adresse du vrai tableau", "Seulement les int", "Jamais"], a: 1, exp: "C'est le passage par adresse : très utile." },
    { type: "qcm", q: "<code>t[i]</code> est équivalent à…", opts: ["*(t + i)", "t + i", "*t + i", "&t[i]"], a: 0, exp: "Les crochets = arithmétique de pointeurs : *(t+i)." },
    { type: "qcm", q: "Que vaut <code>*(p + 1)</code> si p pointe vers t[0] ?", opts: ["t[0]", "t[1] (l'élément suivant)", "l'octet suivant", "NULL"], a: 1, exp: "+1 avance d'un élément, pas d'un octet : le type gère la taille." },
    { type: "qcm", q: "Après <code>int *p = t; p++;</code>, p pointe vers…", opts: ["t[0]", "t[1]", "la fin de t", "NULL"], a: 1, exp: "p++ avance vers l'élément suivant." },
    { type: "qcm", q: "<code>void f(int t[], int n)</code> et <code>void f(int *t, int n)</code> sont…", opts: ["différentes", "équivalentes", "invalides", "réservées"], a: 1, exp: "Un paramètre tableau est en réalité un pointeur." },
    { type: "qcm", q: "À quoi sert <code>const</code> sur <code>const double t[]</code> ?", opts: ["À accélérer", "À garantir que la fonction ne modifiera pas le tableau", "À le copier", "À le vider"], a: 1, exp: "const documente et protège : lecture seule." },
    { type: "vf", q: "Passer un tableau à une fonction en fait une copie complète.", a: false, exp: "Faux : on passe une adresse. La fonction agit sur l'original." },
    { type: "qcm", q: "Pourquoi <code>p + 1</code> n'avance pas d'un seul octet ?", opts: ["C'est un bug", "L'arithmétique de pointeurs tient compte du type pointé (taille de l'élément)", "Elle avance de 4 toujours", "Elle recule"], a: 1, exp: "Pour un int (4 octets), +1 avance de 4 octets = 1 élément." },
    { type: "qcm", q: "Une fonction <code>mettre_a_zero(stocks, 4)</code> sur stocks={3,8,5,2} donne…", opts: ["stocks inchangé", "stocks = {0,0,0,0}", "une copie à zéro", "une erreur"], a: 1, exp: "Elle modifie le vrai tableau via son adresse." },
    { type: "qcm", q: "Pour lire t[2] via un pointeur p = t :", opts: ["*(p + 2)", "p + 2", "*p + 2", "&p[2]"], a: 0, exp: "*(p+2) == t[2]." },
    { type: "qcm", q: "La convention C pour les fonctions manipulant des tableaux :", opts: ["Deviner la taille", "Passer le tableau ET sa taille (int n)", "Utiliser une variable globale", "Ne jamais les modifier"], a: 1, exp: "Tableau + taille : partout dans la bibliothèque standard." }
  ],
  final: {
    title: "Exercice final — Somme d'un tableau via fonction",
    intro: `<p>Cette fonction devine mal la taille du tableau. Corrige :</p>
<pre class="pseudo">int somme(int t[]) {                   // ERREUR : la taille manque (t est un pointeur ici)
    int s = 0;                         // accumulateur
    int n = sizeof(t) / sizeof(t[0]);  // ERREUR : sizeof(t) = taille d'un POINTEUR, pas du tableau → n faux
    for (int i = 0; i < n; i++) s += t[i];  // on n'additionne donc pas tous les éléments
    return s;                          // renvoie une somme incorrecte
}                                      // fin de la fonction
int main(void) {                       // point d'entrée
    int stocks[4] = {3, 8, 5, 2};      // le vrai tableau
    printf("%d\\n", somme(stocks));     // affiche un résultat faux
    return 0;                          // 0 = fin sans erreur
}                                      // fin de main</pre>`,
    questions: [
      { type: "qcm", q: "Où est le bug ?", opts: ["s mal initialisé", "sizeof(t) dans la fonction donne la taille d'un pointeur, pas du tableau", "La boucle est fausse", "printf est faux"], a: 1, exp: "t est un pointeur ici : sizeof(t) ≈ 8, sizeof(t[0])=4 → n=2, faux." },
      { type: "qcm", q: "Comment corriger la signature ?", opts: ["int somme(int t[])", "int somme(int t[], int n)", "int somme(int *t)", "int somme(void)"], a: 1, exp: "Passer la taille en paramètre." },
      { type: "qcm", q: "Où calcule-t-on correctement la taille ?", opts: ["Dans la fonction", "Dans main, où stocks est un vrai tableau : sizeof(stocks)/sizeof(stocks[0])", "Nulle part", "Avec strlen"], a: 1, exp: "sizeof ne marche que là où le tableau est déclaré." },
      { type: "qcm", q: "Que vaut somme(stocks, 4) corrigé ?", opts: ["18", "13", "8", "4"], a: 0, exp: "3+8+5+2 = 18." },
      { type: "qcm", q: "En bonus, quel mot-clé indiquerait que somme ne modifie pas t ?", opts: ["static", "const : int somme(const int t[], int n)", "volatile", "extern"], a: 1, exp: "const protège le tableau en lecture seule." }
    ],
    solution: `<pre class="pseudo">#include &lt;stdio.h&gt;                            // pour printf
                                             // (ligne vide)
int somme(const int t[], int n) {            // taille passée à part ; const = lecture seule
    int s = 0;                               // accumulateur
    for (int i = 0; i &lt; n; i++) s += t[i];   // additionner chaque élément
    return s;                                // renvoyer la somme
}                                            // fin de la fonction
                                             // (ligne vide)
int main(void) {                             // point d'entrée
    int stocks[4] = {3, 8, 5, 2};            // le vrai tableau
    int n = sizeof(stocks) / sizeof(stocks[0]);  // 4, calculé ICI où le tableau existe vraiment
    printf("%d\\n", somme(stocks, n));        // 18
    return 0;                                // 0 = fin sans erreur
}                                            // fin de main</pre>
<p>Retiens la règle d'or : dans une fonction, un tableau est un pointeur qui a oublié sa taille — passe-la toujours en paramètre. Demain : l'allocation dynamique, pour des tableaux de taille décidée à l'exécution.</p>`
  }
};
</script>
