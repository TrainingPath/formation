<script>
var DAY = {
  num: 12,
  title: "Allocation dynamique : malloc et free",
  subtitle: "Réserver de la mémoire à l'exécution, quand on ne connaît la taille qu'au dernier moment.",
  theory: `
<h3>1. Pourquoi allouer dynamiquement ?</h3>
<p>Un tableau classique a une taille <strong>fixée à la compilation</strong> (au moment où on traduit le code). Mais souvent, le nombre d'éléments n'est connu qu'au <strong>lancement du programme</strong> : « combien de jeux voulez-vous saisir ? ». Il faut alors <strong>réserver</strong> (« allouer ») la mémoire à l'exécution, pendant que le programme tourne. C'est l'<strong>allocation dynamique</strong>, faite dans une grande réserve de mémoire appelée le <strong>tas</strong> (en anglais <em>heap</em>).</p>

<h3>2. malloc : réserver</h3>
<p><code>malloc</code> (pour <em>memory allocation</em>) demande au système un bloc de mémoire de la taille voulue. La taille se donne en <strong>octets</strong>, calculée par <code>nombre × sizeof(type)</code>.</p>
<pre class="pseudo">#include &lt;stdlib.h&gt;                  // pour malloc, free, calloc, realloc
                                     // (ligne vide)
int n = 5;                           // on veut 5 entiers
int *t = malloc(n * sizeof(int));    // réserve 5 × 4 = 20 octets ; t pointe vers le début de la zone
if (t == NULL) {                     // TOUJOURS vérifier : malloc peut échouer (mémoire pleine)
    printf("Memoire insuffisante\\n"); // on prévient en cas d'échec
    return 1;                        // et on quitte en erreur
}                                    // fin du if
for (int i = 0; i &lt; n; i++) t[i] = i * 10;   // la zone s'utilise EXACTEMENT comme un tableau</pre>
<p><code>malloc</code> renvoie un <strong>pointeur</strong> vers la zone réservée, ou <code>NULL</code> en cas d'échec. On calcule la taille en octets avec <code>n * sizeof(type)</code>.</p>

<h3>3. free : libérer</h3>
<p>La mémoire du tas n'est <strong>PAS</strong> libérée automatiquement. À chaque <code>malloc</code> doit correspondre un <code>free</code> (« libérer »), sinon la mémoire reste réservée pour rien : c'est une <strong>fuite mémoire</strong> (<em>memory leak</em>).</p>
<pre class="pseudo">free(t);      // rend la mémoire réservée au système (t ne doit plus être utilisé pour lire/écrire)
t = NULL;     // bonne habitude : on remet le pointeur à NULL pour éviter un pointeur « fou » (dangling)</pre>
<div class="warn">Trois fautes graves : oublier <code>free</code> (fuite), utiliser la mémoire <strong>après</strong> <code>free</code> (<em>use-after-free</em>), ou faire <code>free</code> deux fois (<em>double free</em>). La règle : un malloc = un free, puis on remet le pointeur à NULL.</div>

<h3>4. calloc et realloc</h3>
<pre class="pseudo">int *t = calloc(n, sizeof(int));      // calloc = comme malloc, mais initialise TOUTES les cases à 0
t = realloc(t, 2 * n * sizeof(int));  // realloc = REDIMENSIONNER une zone déjà allouée (ici on double)</pre>
<div class="warn">Avec <code>realloc</code>, récupère le résultat dans une variable temporaire : s'il renvoie NULL, tu perds sinon le pointeur d'origine (et donc la mémoire).</div>

<h3>5. Le cycle de vie</h3>
<pre class="pseudo">int *t = malloc(n * sizeof(int));   // 1. RÉSERVER la mémoire
if (!t) return 1;                   // 2. VÉRIFIER l'échec (!t signifie t == NULL)
/* ... utiliser t[i] ... */          // 3. UTILISER la zone comme un tableau
free(t);                            // 4. LIBÉRER la mémoire
t = NULL;                           // 5. NEUTRALISER le pointeur</pre>
<div class="tip">Pile (<em>stack</em>) vs tas (<em>heap</em>) : les variables locales vivent sur la pile et disparaissent à la fin de la fonction. La mémoire <code>malloc</code> vit sur le tas et persiste jusqu'au <code>free</code> — c'est ce qui permet à une fonction de renvoyer un tableau qui « survit ».</div>`,
  exercises: [
    { type: "qcm", q: "Quand utilise-t-on l'allocation dynamique ?", opts: ["Uniquement pour les petits tableaux","Quand la taille n'est connue qu'à l'exécution","Seulement pour les variables constantes","Pour rendre le programme plus rapide"], a: 1, exp: "malloc réserve une taille décidée pendant l'exécution." },
    { type: "qcm", q: "Quelle fonction réserve de la mémoire ?", opts: ["new", "malloc", "alloc", "reserve"], a: 1, exp: "malloc, de stdlib.h." },
    { type: "qcm", q: "Que renvoie malloc ?", opts: ["Un entier", "Un pointeur vers la zone réservée (ou NULL)", "La taille", "Rien"], a: 1, exp: "Un pointeur, ou NULL si échec." },
    { type: "qcm", q: "Comment réserver de quoi stocker n int ?", opts: ["malloc(n)", "malloc(n * sizeof(int))", "malloc(int * n)", "malloc(sizeof(n))"], a: 1, exp: "n éléments × taille d'un élément." },
    { type: "qcm", q: "Que faut-il toujours faire après malloc ?", opts: ["free immédiatement", "Vérifier si le pointeur est NULL", "L'afficher", "Le caster en int"], a: 1, exp: "malloc peut échouer : vérifie != NULL." },
    { type: "qcm", q: "Quelle fonction libère la mémoire ?", opts: ["delete", "free", "release", "clear"], a: 1, exp: "free rend la mémoire au système." },
    { type: "qcm", q: "Qu'est-ce qu'une fuite mémoire ?", opts: ["Un free en trop", "De la mémoire allouée jamais libérée", "Un pointeur NULL", "Un tableau trop grand"], a: 1, exp: "malloc sans free correspondant = fuite." },
    { type: "qcm", q: "Utiliser la mémoire après un free s'appelle…", opts: ["double free", "use-after-free (dangereux)", "fuite", "recyclage"], a: 1, exp: "Le pointeur est devenu invalide : comportement indéfini." },
    { type: "qcm", q: "En quoi calloc diffère-t-il de malloc ?", opts: ["Il libère", "Il initialise la mémoire à 0", "Il est plus rapide toujours", "Il ne renvoie rien"], a: 1, exp: "calloc met tout à zéro." },
    { type: "qcm", q: "À quoi sert realloc ?", opts: ["À libérer", "À redimensionner une zone déjà allouée", "À copier une chaîne", "À vérifier NULL"], a: 1, exp: "realloc agrandit/réduit une allocation existante." },
    { type: "vf", q: "La mémoire allouée par malloc est libérée automatiquement en fin de fonction.", a: false, exp: "Faux : contrairement aux variables locales, il faut free explicitement." },
    { type: "qcm", q: "Bonne pratique juste après free(t) ?", opts: ["Rien", "t = NULL; pour éviter un pointeur fou", "free(t) encore", "Afficher t"], a: 1, exp: "Remettre à NULL évite l'use-after-free et le double free." },
    { type: "qcm", q: "Où vit la mémoire allouée par malloc ?", opts: ["Sur la pile (stack)", "Sur le tas (heap)", "Dans un fichier", "Dans le CPU"], a: 1, exp: "Le tas : elle persiste jusqu'au free." },
    { type: "qcm", q: "Faire free deux fois sur le même pointeur…", opts: ["est sans effet", "est une erreur grave (double free)", "libère plus vite", "est recommandé"], a: 1, exp: "Double free : comportement indéfini." },
    { type: "qcm", q: "Quel en-tête pour malloc/free ?", opts: ["stdio.h", "stdlib.h", "string.h", "malloc.h"], a: 1, exp: "#include <stdlib.h>." }
  ],
  final: {
    title: "Exercice final — Un tableau de taille choisie",
    intro: `<p>On veut un tableau de n entiers saisis. Trouve les fautes :</p>
<pre class="pseudo">int n;                             // nombre d'éléments voulu
scanf("%d", &n);                   // on lit n (sans vérifier la saisie ici)
int *t = malloc(n);                // ERREUR : malloc(n) réserve n OCTETS, pas n entiers → il faut n*sizeof(int)
for (int i = 0; i <= n; i++)       // ERREUR : i <= n atteint t[n], hors de la zone (débordement)
    t[i] = i;                      // range i dans chaque case
printf("%d\\n", t[0]);              // affiche le premier élément
// (pas de free)                   // ERREUR : aucun free → fuite mémoire</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — <code>malloc(n)</code> :", opts: ["Correct", "Il faut malloc(n * sizeof(int)) : n octets ≠ n entiers", "Il faut malloc(int)", "malloc n'existe pas"], a: 1, exp: "n octets ne suffisent pas pour n entiers (4 octets chacun)." },
      { type: "qcm", q: "Erreur n°2 — la boucle <code>i <= n</code> :", opts: ["Correct", "Débordement : indices 0 à n-1, donc i < n", "Il faut i <= n-1 seulement", "Rien"], a: 1, exp: "t[n] est hors de la zone allouée." },
      { type: "qcm", q: "Erreur n°3 — que manque-t-il après utilisation ?", opts: ["Rien", "free(t); (sinon fuite mémoire)", "un scanf", "un return"], a: 1, exp: "Chaque malloc appelle un free." },
      { type: "qcm", q: "Que faut-il vérifier juste après malloc ?", opts: ["Que n > 0 seulement", "Que t != NULL (échec possible)", "La vitesse", "Rien"], a: 1, exp: "malloc peut renvoyer NULL." },
      { type: "qcm", q: "Bonne habitude après free(t) ?", opts: ["t = NULL;", "malloc(t)", "free(t) encore", "return t"], a: 0, exp: "Neutraliser le pointeur évite les erreurs." }
    ],
    solution: `<pre class="pseudo">#include &lt;stdio.h&gt;                            // pour printf et scanf
#include &lt;stdlib.h&gt;                           // pour malloc et free
                                             // (ligne vide)
int main(void) {                             // point d'entrée du programme
    int n;                                   // nombre d'éléments voulu
    if (scanf("%d", &amp;n) != 1 || n &lt;= 0) return 1;  // lire n ET vérifier qu'il est valide (&gt; 0)
                                             // (ligne vide)
    int *t = malloc(n * sizeof(int));        // taille en OCTETS correcte : n × 4
    if (t == NULL) return 1;                 // vérifier l'échec d'allocation
                                             // (ligne vide)
    for (int i = 0; i &lt; n; i++)              // i &lt; n : on reste dans les bornes
        t[i] = i;                            // ranger i dans la case i
                                             // (ligne vide)
    printf("%d\\n", t[0]);                    // afficher le premier élément
                                             // (ligne vide)
    free(t);                                 // 4. libérer la mémoire
    t = NULL;                                // 5. neutraliser le pointeur
    return 0;                                // 0 = fin sans erreur
}                                            // fin de main</pre>
<p>Quatre réflexes : <code>n * sizeof(type)</code>, vérifier <code>NULL</code>, rester dans les bornes, et <code>free</code> + <code>NULL</code>. La gestion manuelle de la mémoire est la grande responsabilité — et la grande puissance — du C. Demain : les structures.</p>`
  }
};

var ECRITURE = {

  items: [
  { id: "c-l12", title: "Catalogue de taille dynamique", level: 3,
    statement: "Demande à l'utilisateur combien de jeux (n), alloue dynamiquement un tableau de n double pour leurs prix, remplis-le (par exemple prix[i] = 10 + i), affiche la somme, puis libère proprement la mémoire.",
    hints: [
      "double *prix = malloc(n * sizeof(double)); puis vérifie != NULL.",
      "Boucle for de 0 à n-1 : prix[i] = 10.0 + i; et somme += prix[i];",
      "N'oublie pas free(prix); prix = NULL; à la fin."
    ],
    solution: "#include <stdio.h>                    // pour printf et scanf\n#include <stdlib.h>                   // pour malloc et free\n\nint main(void) {                     // point d'entree du programme\n    int n;                           // nombre de jeux voulu\n    printf(\"Combien de jeux ? \");    // prompt\n    if (scanf(\"%d\", &n) != 1 || n <= 0) return 1;  // lire n et verifier qu'il est valide\n\n    double *prix = malloc(n * sizeof(double));  // reserve n reels (taille en octets correcte)\n    if (prix == NULL) return 1;      // verifier l'echec d'allocation\n\n    double somme = 0.0;              // accumulateur reel\n    for (int i = 0; i < n; i++) {    // parcourt les indices 0 a n-1\n        prix[i] = 10.0 + i;          // remplit chaque case (10, 11, 12, ...)\n        somme += prix[i];            // additionne au fur et a mesure\n    }                                // fin de la boucle\n    printf(\"Somme : %.2f euros\\n\", somme);  // %.2f = 2 decimales\n\n    free(prix);                      // libere la memoire reservee\n    prix = NULL;                     // neutralise le pointeur\n    return 0;                        // 0 = fin sans erreur\n}                                    // fin de main",
    atoi: {"cmd":"gcc prog.c -o prog && ./prog","expected":"Combien de jeux ? Somme : 33.00 euros"},
    checklist: ["malloc(n * sizeof(double)) réserve la bonne taille.","Le retour de malloc est vérifié contre NULL.","La boucle remplit et additionne les prix.","free(prix) libère la mémoire, prix = NULL neutralise le pointeur."],
    lang: "c",
    stdin: ["3"],
    note: "La taille du catalogue est décidée à l'exécution : impossible avec un tableau fixe. Le cycle réserver → vérifier → utiliser → libérer est complet et sans fuite." }
  ]
};
