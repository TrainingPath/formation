<script>
var DAY = {
  num: 16,
  title: "Lire et écrire des fichiers",
  subtitle: "Rendre les données persistantes : ouvrir, écrire, lire, et surtout fermer un fichier.",
  theory: `
<h3>1. Ouvrir un fichier : fopen</h3>
<p>Jusqu'ici, les données disparaissaient à la fin du programme (elles vivaient en mémoire). Un <strong>fichier</strong> stocke des données sur le disque : elles sont <strong>persistantes</strong> (elles survivent à l'arrêt du programme). Pour manipuler un fichier, on passe par un <strong>pointeur de fichier</strong> de type <code>FILE *</code> (une « poignée » vers le fichier ouvert) qu'on obtient avec <code>fopen(nom, mode)</code>. Le <strong>mode</strong> dit ce qu'on veut faire : lire, écrire…</p>
<pre class="pseudo">FILE *f = fopen("catalogue.txt", "w");   // ouvre le fichier en mode "w" (écriture) ; f = poignée vers ce fichier
if (f == NULL) {                         // TOUJOURS vérifier : fopen renvoie NULL si l'ouverture a échoué
    printf("Impossible d'ouvrir le fichier\\n");   // message d'erreur
    return 1;                            // on quitte en erreur
}                                        // fin du if</pre>
<pre class="pseudo">Modes principaux :
"r"  lecture       (le fichier doit exister)        // read : lire un fichier existant
"w"  écriture      (crée / ÉCRASE le contenu)        // write : crée le fichier ou EFFACE l'ancien contenu
"a"  ajout         (écrit à la fin, sans effacer)    // append : ajoute à la suite sans rien perdre</pre>

<h3>2. Écrire : fprintf</h3>
<p><code>fprintf</code> est le jumeau de <code>printf</code>, mais il écrit dans un fichier au lieu de l'écran. Son premier argument est la poignée <code>FILE *</code>.</p>
<pre class="pseudo">FILE *f = fopen("catalogue.txt", "w");   // ouvre en écriture (écrase l'ancien contenu)
fprintf(f, "Catan;44.90;3\\n");           // écrit cette ligne DANS f (comme printf, mais vers le fichier)
fprintf(f, "Uno;12.50;10\\n");            // deuxième ligne écrite
fclose(f);                               // FERMER le fichier : sinon des données peuvent être perdues !</pre>
<div class="warn">Un <strong>tampon</strong> (<em>buffer</em>) garde temporairement en mémoire ce qu'on écrit avant de l'envoyer sur le disque. Oublier <code>fclose</code> peut laisser des données non écrites (restées dans le tampon) et gaspiller une ressource. À chaque <code>fopen</code> réussi correspond un <code>fclose</code>.</div>

<h3>3. Lire ligne par ligne : fgets</h3>
<pre class="pseudo">FILE *f = fopen("catalogue.txt", "r");             // ouvre en lecture (le fichier doit exister)
if (f == NULL) return 1;                           // vérifier l'ouverture
char ligne[128];                                   // tampon pour recevoir une ligne (127 caractères max + '\\0')
while (fgets(ligne, sizeof(ligne), f) != NULL) {   // lire une ligne ; fgets renvoie NULL à la FIN du fichier
    printf("%s", ligne);                           // afficher la ligne (elle contient déjà son \\n)
}                                                  // fin de la boucle
fclose(f);                                         // fermer le fichier</pre>
<p><code>fgets</code> lit une ligne entière (espaces compris), sans dépasser la taille du tampon : c'est la façon <strong>sûre</strong> de lire du texte, contrairement à <code>scanf("%s")</code> qui s'arrête aux espaces et peut déborder.</p>

<h3>4. Lire des champs formatés : fscanf</h3>
<pre class="pseudo">FILE *f = fopen("catalogue.txt", "r");    // ouvre en lecture
char nom[50];                             // pour le nom du jeu
double prix;                              // pour le prix
int stock;                                // pour le stock
while (fscanf(f, "%49[^;];%lf;%d\\n", nom, &amp;prix, &amp;stock) == 3) {  // lit 3 champs séparés par ; ; == 3 = les 3 sont lus
    printf("%s coute %.2f (stock %d)\\n", nom, prix, stock);       // afficher les champs lus
}                                         // la boucle s'arrête quand fscanf ne lit plus 3 champs
fclose(f);                                // fermer le fichier</pre>
<p><code>%49[^;]</code> lit jusqu'au prochain <code>;</code> (au plus 49 caractères). On teste que <code>fscanf</code> a bien lu les <strong>3</strong> champs attendus : c'est la condition d'arrêt propre.</p>

<h3>5. Le schéma général</h3>
<pre class="pseudo">FILE *f = fopen(...);            // 1. OUVRIR le fichier
if (!f) return 1;                // 2. VÉRIFIER (!f signifie f == NULL)
/* fprintf / fgets / fscanf */   // 3. LIRE ou ÉCRIRE
fclose(f);                       // 4. FERMER le fichier</pre>
<div class="tip">Un fichier texte simple avec des champs séparés (ici par <code>;</code>) est un mini-format « CSV » (<em>Comma-Separated Values</em>). C'est exactement ainsi qu'on sauvegardera le catalogue de la Ludothèque avant d'utiliser une vraie base de données.</div>

<h3>6. Sérialiser une struct : écriture binaire (fwrite / fread)</h3>
<p><strong>Sérialiser</strong> = transformer une donnée en mémoire en une suite d'octets stockable dans un fichier. Le CSV texte est lisible mais oblige à formater puis à re-analyser (<em>parser</em>) chaque champ. Pour sauvegarder une <strong>struct</strong> entière d'un coup, on écrit ses <strong>octets bruts</strong> dans un fichier ouvert en mode <strong>binaire</strong> (<code>"wb"</code> / <code>"rb"</code>, le <code>b</code> pour <em>binary</em>) : c'est la sérialisation la plus directe en C.</p>
<pre class="pseudo">typedef struct { char nom[32]; double prix; int stock; } Jeu;   // un type Jeu à 3 champs
                                                               // (ligne vide)
Jeu j = {"Catan", 44.90, 3};              // une structure à sauvegarder
FILE *f = fopen("jeux.dat", "wb");        // ouvre en écriture BINAIRE ("b")
fwrite(&amp;j, sizeof(Jeu), 1, f);            // écrit les octets de la struct : &amp;j (adresse), taille d'un Jeu, 1 élément, vers f (SÉRIALISE)
fclose(f);                                // ferme le fichier
                                          // (ligne vide)
Jeu lu;                                   // structure vide qui va recevoir les données relues
FILE *g = fopen("jeux.dat", "rb");        // ouvre en lecture BINAIRE
fread(&amp;lu, sizeof(Jeu), 1, g);            // relit les mêmes octets dans lu (DÉSÉRIALISE)
fclose(g);                                // ferme le fichier</pre>
<div class="warn">Direct et rapide, mais <strong>non portable</strong> : le format binaire dépend de la machine — l'ordre des octets (<em>endianness</em>), le remplissage de la struct (<em>padding</em>) et la taille des types. Un fichier écrit sur une machine peut être illisible sur une autre. Et surtout : ne jamais sérialiser ainsi une struct contenant un <strong>pointeur</strong> — on sauvegarderait une <em>adresse mémoire</em> (invalide au rechargement), pas la donnée pointée. Pour un format portable et lisible, on préfère le texte (CSV, et plus tard JSON).</div>`,
  exercises: [
    { type: "qcm", q: "Quel type représente un fichier ouvert ?", opts: ["int", "FILE *", "char[]", "struct file"], a: 1, exp: "fopen renvoie un FILE *." },
    { type: "qcm", q: "Quel mode ouvre un fichier en écriture (en écrasant) ?", opts: ["\"r\"", "\"w\"", "\"a\"", "\"x\""], a: 1, exp: "\"w\" crée ou écrase." },
    { type: "qcm", q: "Que faut-il vérifier après fopen ?", opts: ["La taille", "Si le pointeur est NULL (ouverture échouée)", "La vitesse", "Rien"], a: 1, exp: "fopen peut échouer (fichier absent, droits…)." },
    { type: "qcm", q: "Quelle fonction écrit du texte formaté dans un fichier ?", opts: ["printf", "fprintf", "fputs seulement", "write"], a: 1, exp: "fprintf(f, ...) comme printf mais vers f." },
    { type: "qcm", q: "Que faut-il faire à la fin de tout fichier ouvert ?", opts: ["free", "fclose", "delete", "rien"], a: 1, exp: "fclose ferme et vide le tampon." },
    { type: "qcm", q: "Quel mode ajoute à la fin sans effacer ?", opts: ["\"w\"", "\"a\"", "\"r\"", "\"n\""], a: 1, exp: "\"a\" = append (ajout)." },
    { type: "qcm", q: "Quelle fonction lit une ligne entière de façon sûre ?", opts: ["scanf", "fgets", "getchar seul", "gets"], a: 1, exp: "fgets lit une ligne bornée par la taille du tampon." },
    { type: "qcm", q: "Comment fgets signale-t-il la fin du fichier ?", opts: ["Renvoie 0", "Renvoie NULL", "Plante", "Renvoie -1"], a: 1, exp: "On boucle tant que fgets != NULL." },
    { type: "qcm", q: "Le mode \"r\" exige que le fichier…", opts: ["soit vide", "existe déjà", "soit créé", "soit binaire"], a: 1, exp: "En lecture, le fichier doit exister (sinon NULL)." },
    { type: "qcm", q: "Comment vérifier que fscanf a lu 3 champs ?", opts: ["fscanf(...) == NULL", "fscanf(...) == 3", "if (fscanf)", "impossible"], a: 1, exp: "fscanf renvoie le nombre de champs lus." },
    { type: "vf", q: "Le mode \"w\" conserve le contenu existant du fichier.", a: false, exp: "Faux : \"w\" écrase. Pour conserver, c'est \"a\"." },
    { type: "qcm", q: "Pourquoi préférer fgets à scanf(\"%s\") pour du texte ?", opts: ["Plus rapide", "fgets lit la ligne entière (espaces compris) et borne la taille", "Plus court", "Aucune raison"], a: 1, exp: "scanf %s s'arrête au premier espace et peut déborder." },
    { type: "qcm", q: "fprintf(f, \"%d\\n\", n) écrit…", opts: ["à l'écran", "dans le fichier f", "dans une variable", "rien"], a: 1, exp: "La sortie va vers f, pas vers l'écran." },
    { type: "qcm", q: "Que risque-t-on en oubliant fclose après écriture ?", opts: ["Rien", "Des données non écrites (restées dans le tampon)", "Le fichier double de taille", "Une erreur de compilation"], a: 1, exp: "fclose vide le tampon : indispensable." },
    { type: "qcm", q: "Le schéma correct est…", opts: ["ouvrir → fermer → écrire", "ouvrir → vérifier → lire/écrire → fermer", "écrire → ouvrir", "lire sans ouvrir"], a: 1, exp: "fopen, test NULL, opérations, fclose." },
    { type: "qcm", q: "Pour sauvegarder une struct entière d'un coup, on utilise…", opts: ["fprintf champ par champ seulement", "fwrite en mode binaire (\"wb\")", "printf", "malloc"], a: 1, exp: "fwrite écrit les octets bruts de la struct : c'est la sérialisation binaire." },
    { type: "qcm", q: "<code>fwrite(&j, sizeof(Jeu), 1, f)</code> écrit…", opts: ["le nom seulement", "les octets bruts de la struct entière", "l'adresse de j", "rien"], a: 1, exp: "sizeof(Jeu) octets copiés tels quels dans le fichier." },
    { type: "qcm", q: "L'écriture binaire d'une struct est…", opts: ["portable partout", "rapide mais non portable (endianness, padding, tailles)", "toujours lisible", "chiffrée"], a: 1, exp: "Le format dépend de la machine : illisible ailleurs sans précautions." },
    { type: "vf", q: "On peut sérialiser avec fwrite une struct contenant un pointeur sans problème.", a: false, exp: "Faux : on sauvegarderait une adresse mémoire, invalide au rechargement — pas la donnée pointée." }
  ],
  final: {
    title: "Exercice final — Sauver puis relire",
    intro: `<p>On écrit un jeu dans un fichier puis on le relit. Corrige :</p>
<pre class="pseudo">FILE *f = fopen("jeu.txt", "r");       // ERREUR : "r" = LECTURE, on ne peut pas y écrire → il faut "w"
fprintf(f, "Catan;44.90\\n");           // écrire dans un fichier ouvert en lecture échoue
fclose(f);                             // ferme le fichier (aucun test d'ouverture avant : autre défaut)
                                       // (ligne vide)
FILE *g = fopen("jeu.txt", "w");       // ERREUR : "w" ÉCRASE et ouvre en écriture → pour relire il faut "r"
char ligne[100];                       // tampon pour la ligne à lire
fgets(ligne, sizeof(ligne), g);        // tente de lire (mais g est en écriture, et le fichier vient d'être vidé)
printf("%s", ligne);                   // affiche la ligne... et il manque fclose(g)</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — écrire avec le mode <code>\"r\"</code> :", opts: ["Correct", "\"r\" est la lecture : pour écrire il faut \"w\"", "Il faut \"a\" seulement", "Rien"], a: 1, exp: "On ne peut pas fprintf dans un fichier ouvert en lecture." },
      { type: "qcm", q: "Erreur n°2 — lire avec le mode <code>\"w\"</code> :", opts: ["Correct", "\"w\" écrase et ouvre en écriture : pour lire il faut \"r\"", "Il faut \"a\"", "Rien"], a: 1, exp: "En plus, \"w\" aurait vidé le fichier avant lecture." },
      { type: "qcm", q: "Que manque-t-il systématiquement après chaque fopen ?", opts: ["Un free", "Un test if (f == NULL)", "Un printf", "Un scanf"], a: 1, exp: "Toujours vérifier l'ouverture." },
      { type: "qcm", q: "Que manque-t-il après le second fichier ?", opts: ["Rien", "fclose(g);", "un malloc", "un return"], a: 1, exp: "Chaque fopen réussi = un fclose." },
      { type: "qcm", q: "Ordre correct des modes pour ce scénario :", opts: ["lire puis écrire", "d'abord \"w\" pour écrire, puis \"r\" pour relire", "\"a\" partout", "\"r\" partout"], a: 1, exp: "On écrit en \"w\", on relit en \"r\"." }
    ],
    solution: `<pre class="pseudo">#include &lt;stdio.h&gt;                            // pour FILE, fopen, fprintf, fgets, fclose
                                             // (ligne vide)
int main(void) {                             // point d'entrée du programme
    FILE *f = fopen("jeu.txt", "w");         // ouvre en ÉCRITURE ("w")
    if (f == NULL) return 1;                 // vérifier l'ouverture
    fprintf(f, "Catan;44.90\\n");             // écrire une ligne dans le fichier
    fclose(f);                               // fermer (vide le tampon sur le disque)
                                             // (ligne vide)
    FILE *g = fopen("jeu.txt", "r");         // rouvre en LECTURE ("r")
    if (g == NULL) return 1;                 // vérifier l'ouverture
    char ligne[100];                         // tampon pour la ligne lue
    if (fgets(ligne, sizeof(ligne), g) != NULL)  // lire une ligne (NULL = rien à lire)
        printf("%s", ligne);                 // afficher la ligne lue
    fclose(g);                               // fermer le second fichier
    return 0;                                // 0 = fin sans erreur
}                                            // fin de main</pre>
<p>Les bons modes (<code>"w"</code> puis <code>"r"</code>), un test après chaque <code>fopen</code>, et un <code>fclose</code> à chaque fois. La persistance dans un fichier est la première étape avant les vraies bases de données. Demain : enum, union et typedef.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code C ici…",
  items: [
  { id: "c-l16", title: "Journal des locations", level: 3,
    statement: "Écris un programme qui ouvre (en mode ajout) un fichier <code>locations.txt</code> et y écrit une ligne « nom;jours;total » pour une location de Catan, 4 jours, 18.00 €. Vérifie l'ouverture et ferme le fichier.",
    hints: [
      "Mode \"a\" pour ajouter à la fin sans effacer l'historique.",
      "Vérifie if (f == NULL) return 1;",
      "fprintf(f, \"%s;%d;%.2f\\n\", \"Catan\", 4, 18.0); puis fclose(f);"
    ],
    solution: "#include <stdio.h>                    // pour FILE, fopen, fprintf, fclose\n\nint main(void) {                     // point d'entree du programme\n    FILE *f = fopen(\"locations.txt\", \"a\");   // ouvre en mode AJOUT (\"a\") : preserve l'historique\n    if (f == NULL) {                 // verifier que l'ouverture a reussi\n        printf(\"Ouverture impossible\\n\");    // message d'erreur\n        return 1;                    // quitter en erreur\n    }                                // fin du if\n    fprintf(f, \"%s;%d;%.2f\\n\", \"Catan\", 4, 18.00);  // ecrit \"Catan;4;18.00\" dans le fichier\n    fclose(f);                       // fermer le fichier (ecrit vraiment sur le disque)\n    printf(\"Location enregistree.\\n\");   // confirmation a l'ecran\n    return 0;                        // 0 = fin sans erreur\n}                                    // fin de main",
    note: "Le mode \"a\" préserve les enregistrements précédents : parfait pour un journal. Le test d'ouverture et le fclose garantissent une écriture fiable, sans perte de données." }
  ]
};
