var DAY = {
  num: 13,
  title: "Les structures (struct)",
  subtitle: "Regrouper des données de types différents sous un même nom : le « type objet » du C.",
  theory: `
<h3>1. Définir une structure</h3>
<p>Un tableau regroupe des valeurs de <em>même</em> type. Une <strong>structure</strong> (mot-clé <code>struct</code>) regroupe au contraire des valeurs de <strong>types différents</strong> qui décrivent une même entité — par exemple un jeu (son nom, son prix, son stock). Chaque valeur porte un nom : on l'appelle un <strong>champ</strong> (ou membre).</p>
<pre class="pseudo">struct Jeu {          // on DÉFINIT un nouveau type nommé "struct Jeu"
    char nom[50];      // champ 1 : le nom (un tableau de char = une chaîne)
    double prix;       // champ 2 : le prix (un réel)
    int stock;         // champ 3 : le stock (un entier)
};                     // ne pas oublier le ; après l'accolade fermante !</pre>

<h3>2. Créer et utiliser une variable de structure</h3>
<pre class="pseudo">struct Jeu j;                 // j est une variable de type struct Jeu (elle contient les 3 champs)
strcpy(j.nom, "Catan");       // on ACCÈDE à un champ avec le point . ; strcpy copie le texte dans nom
j.prix = 44.90;               // on range 44.90 dans le champ prix
j.stock = 3;                  // on range 3 dans le champ stock
printf("%s : %.2f (%d)\\n", j.nom, j.prix, j.stock);  // afficher les 3 champs (%s chaîne, %.2f réel, %d entier)</pre>
<pre class="pseudo">// initialisation directe (les valeurs dans l'ordre des champs) :
struct Jeu k = {"Uno", 12.5, 10};   // k.nom="Uno", k.prix=12.5, k.stock=10</pre>

<h3>3. typedef : un nom plus court</h3>
<p>Répéter <code>struct Jeu</code> à chaque fois est lourd. <code>typedef</code> (« définir un type ») crée un <strong>alias</strong> (un surnom) pour écrire simplement <code>Jeu</code>.</p>
<pre class="pseudo">typedef struct {       // typedef = on crée un alias pour cette structure anonyme
    char nom[50];       // champ nom
    double prix;        // champ prix
    int stock;          // champ stock
} Jeu;                  // le nom de l'alias : Jeu
                        // (ligne vide)
Jeu j = {"Catan", 44.90, 3};   // on écrit juste "Jeu" (plus besoin du mot « struct »)</pre>

<h3>4. Structures et fonctions : passer par pointeur</h3>
<p>Passer une structure par valeur la <strong>copie</strong> entièrement (coûteux si elle est grosse). On passe donc souvent un <strong>pointeur</strong> vers la structure (son adresse). Avec un pointeur, on accède aux champs avec la <strong>flèche <code>-&gt;</code></strong> au lieu du point.</p>
<pre class="pseudo">void reapprovisionner(Jeu *j, int ajout) {   // j = pointeur vers un Jeu ; ajout = quantité à ajouter
    j-&gt;stock += ajout;                        // j-&gt;stock : le champ stock via le pointeur ; += ajoute
}                                             // équivaut à (*j).stock += ajout
Jeu c = {"Catan", 44.90, 3};                  // un jeu avec 3 en stock
reapprovisionner(&amp;c, 5);                      // on passe l'ADRESSE de c → c.stock devient 8</pre>
<div class="warn">Avec une variable structure, on écrit <code>j.champ</code> (le point). Avec un <strong>pointeur</strong> vers structure, on écrit <code>p-&gt;champ</code> (la flèche). La flèche est un raccourci de <code>(*p).champ</code>.</div>

<h3>5. Tableau de structures</h3>
<pre class="pseudo">Jeu catalogue[3] = {              // un tableau de 3 structures Jeu
    {"Catan", 44.90, 3},          // catalogue[0]
    {"Uno",   12.50, 10},         // catalogue[1]
    {"Risk",  39.00, 0}           // catalogue[2]
};                                // fin du tableau
for (int i = 0; i &lt; 3; i++)       // parcourir les 3 jeux
    printf("%s : %.2f\\n", catalogue[i].nom, catalogue[i].prix);  // catalogue[i] est une structure ; .nom / .prix ses champs</pre>
<div class="tip">La structure est l'ancêtre de l'« objet ». Le C n'a pas de classes, mais struct + fonctions qui prennent un <code>struct *</code> en premier paramètre reproduisent l'idée : des données groupées et des opérations qui agissent dessus.</div>`,
  exercises: [
    { type: "qcm", q: "Que regroupe une structure ?", opts: ["Des valeurs toutes du même type","Des valeurs de types différents décrivant une entité","Uniquement des nombres entiers","Une liste de fonctions liées"], a: 1, exp: "struct = champs de types variés sous un même nom." },
    { type: "qcm", q: "Comment accède-t-on à un champ d'une variable structure ?", opts: ["j->champ", "j.champ (le point)", "j[champ]", "champ(j)"], a: 1, exp: "Le point pour une variable structure." },
    { type: "qcm", q: "Qu'oublie-t-on souvent après <code>}</code> qui ferme un struct ?", opts: ["Une virgule", "Le point-virgule ;", "un return", "un printf"], a: 1, exp: "struct Jeu { ... }; — le ; est obligatoire." },
    { type: "qcm", q: "À quoi sert typedef sur une structure ?", opts: ["À l'initialiser", "À créer un alias pour ne plus écrire « struct »", "À la copier", "À la libérer"], a: 1, exp: "typedef struct {...} Jeu; → on écrit Jeu." },
    { type: "qcm", q: "Avec un POINTEUR p vers structure, comment accède-t-on à un champ ?", opts: ["p.champ", "p->champ", "*p.champ", "&p.champ"], a: 1, exp: "La flèche -> ; équivaut à (*p).champ." },
    { type: "qcm", q: "<code>j->stock</code> équivaut à…", opts: ["j.stock", "(*j).stock", "*j.stock", "&j.stock"], a: 1, exp: "-> déréférence puis accède au champ." },
    { type: "qcm", q: "Passer une structure par valeur à une fonction…", opts: ["la modifie", "la COPIE entièrement (coûteux)", "est interdit", "la libère"], a: 1, exp: "D'où l'usage fréquent du pointeur vers structure." },
    { type: "qcm", q: "Comment initialiser <code>Jeu j</code> directement ?", opts: ["Jeu j = (Catan, 44.90, 3);", "Jeu j = {\"Catan\", 44.90, 3};", "Jeu j = [Catan];", "Jeu j = new Jeu();"], a: 1, exp: "Accolades, dans l'ordre des champs." },
    { type: "qcm", q: "Pour qu'une fonction modifie une structure de l'appelant, on passe…", opts: ["la structure par valeur", "un pointeur vers la structure (Jeu *)", "sa taille", "son nom"], a: 1, exp: "Comme pour les variables simples : par adresse." },
    { type: "qcm", q: "Un tableau de structures se déclare…", opts: ["struct Jeu impossible", "Jeu catalogue[3];", "Jeu[3] catalogue;", "array Jeu 3;"], a: 1, exp: "Comme tout tableau : type nom[taille]." },
    { type: "vf", q: "Le C possède des classes comme Java ou C#.", a: false, exp: "Faux : pas de classes. On utilise struct + fonctions." },
    { type: "qcm", q: "Comment accéder au prix du 2e jeu de <code>Jeu cat[3]</code> ?", opts: ["cat.prix[1]", "cat[1].prix", "cat->prix", "cat(1).prix"], a: 1, exp: "cat[1] est une structure, .prix son champ." },
    { type: "qcm", q: "Pourquoi préférer passer un <code>struct *</code> plutôt que la structure ?", opts: ["C'est obligatoire", "Éviter une copie coûteuse et pouvoir modifier l'original", "Pour la vitesse d'affichage", "Aucune raison"], a: 1, exp: "Pas de copie, et modification possible." },
    { type: "qcm", q: "Comment remplir le champ nom (une chaîne) d'une structure ?", opts: ["j.nom = \"Catan\";", "strcpy(j.nom, \"Catan\");", "j->nom = Catan;", "nom = j;"], a: 1, exp: "Un tableau char ne s'affecte pas avec = : on copie avec strcpy." },
    { type: "qcm", q: "struct + fonctions prenant un struct* rappellent…", opts: ["les fichiers", "l'idée d'objet (données + opérations)", "les boucles", "les pointeurs NULL"], a: 1, exp: "C'est la POO « à la main » du C." }
  ],
  final: {
    title: "Exercice final — La fiche d'un jeu",
    intro: `<p>On modélise un jeu. Corrige ce code :</p>
<pre class="pseudo">struct Jeu {                       // définition du type
    char nom[50];                  // champ nom (chaîne)
    double prix;                   // champ prix (réel)
    int stock;                     // champ stock (entier)
}                                  // ERREUR : il manque le ; après l'accolade fermante
int main(void) {                   // point d'entrée
    struct Jeu j;                  // j est une VARIABLE structure
    j.nom = "Catan";               // ERREUR : nom est un tableau char → il faut strcpy, pas =
    j->prix = 44.90;               // ERREUR : j est une variable, pas un pointeur → il faut le point j.prix
    return 0;                      // 0 = fin sans erreur
}                                  // fin de main</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — après <code>}</code> qui ferme struct Jeu :", opts: ["Rien", "Il manque le ; : struct Jeu { ... };", "Il faut typedef", "Il faut une virgule"], a: 1, exp: "La définition d'un struct se termine par ;." },
      { type: "qcm", q: "Erreur n°2 — <code>j.nom = \"Catan\";</code> :", opts: ["Correct", "nom est un tableau char : on copie avec strcpy(j.nom, \"Catan\")", "Il faut j->nom", "Il faut des apostrophes"], a: 1, exp: "On n'affecte pas un tableau char avec = ; strcpy." },
      { type: "qcm", q: "Erreur n°3 — <code>j->prix</code> où j est une variable (pas un pointeur) :", opts: ["Correct", "j est une variable structure : c'est j.prix (le point)", "Il faut *j.prix", "prix est réservé"], a: 1, exp: "-> est pour les pointeurs ; ici on utilise le point." },
      { type: "qcm", q: "Si j était un pointeur (Jeu *j), quel accès au prix ?", opts: ["j.prix", "j->prix", "*j.prix", "&j.prix"], a: 1, exp: "Pour un pointeur : la flèche ->." },
      { type: "qcm", q: "Quel en-tête faut-il pour strcpy ?", opts: ["stdio.h", "string.h", "stdlib.h", "struct.h"], a: 1, exp: "#include <string.h>." }
    ],
    solution: `<pre class="pseudo">#include &lt;stdio.h&gt;                    // pour printf
#include &lt;string.h&gt;                   // pour strcpy
                                     // (ligne vide)
struct Jeu {                         // définition du type struct Jeu
    char nom[50];                    // champ nom (chaîne)
    double prix;                     // champ prix (réel)
    int stock;                       // champ stock (entier)
};                                   // ; obligatoire après la définition
                                     // (ligne vide)
int main(void) {                     // point d'entrée
    struct Jeu j;                    // j est une variable structure
    strcpy(j.nom, "Catan");          // copie de chaîne dans le champ nom
    j.prix = 44.90;                  // variable → point . pour le champ prix
    j.stock = 3;                     // idem pour stock
    printf("%s : %.2f (%d)\\n", j.nom, j.prix, j.stock);  // afficher les 3 champs
    return 0;                        // 0 = fin sans erreur
}                                    // fin de main</pre>
<p>Trois corrections : le <code>;</code> final du struct, <code>strcpy</code> pour le nom, et le point (pas la flèche) sur une variable. Retiens : variable → <code>.</code>, pointeur → <code>-&gt;</code>. Demain : traduire ses algorithmes en C.</p>`
  }
};

  ]
};
