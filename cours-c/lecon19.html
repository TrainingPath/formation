<script>
var DAY = {
  num: 19,
  title: "Gérer la mémoire : erreurs et outils",
  subtitle: "Les bugs mémoire classiques du C et comment les traquer : avertissements, valgrind, bonnes pratiques.",
  theory: `
<h3>1. Le catalogue des bugs mémoire</h3>
<p>Le C te laisse manipuler la mémoire directement, sans filet. Voici les six erreurs les plus courantes (un <strong>bug</strong> est un défaut du programme) :</p>
<pre class="pseudo">1. Débordement de tableau : t[n] sur un tableau de n cases   // on accède hors des indices 0..n-1
2. Pointeur non initialisé : int *p; *p = 5;   (p pointe n'importe où)   // p contient une adresse au hasard
3. Déréférencement de NULL : p = NULL; *p;      (segfault)              // lire *NULL fait planter le programme
4. Fuite mémoire : malloc sans free                                     // mémoire réservée jamais rendue
5. Use-after-free : free(p); puis on utilise *p                         // on lit une zone déjà libérée
6. Double free : free(p); free(p);                                      // on libère deux fois la même zone</pre>
<p>La plupart provoquent une <strong>erreur de segmentation</strong> (<em>segmentation fault</em>, ou « segfault ») — le système arrête le programme qui a touché une zone interdite — ou pire, un bug <strong>silencieux</strong> qui corrompt les données sans planter tout de suite.</p>

<h3>2. Première ligne de défense : les avertissements</h3>
<pre class="pseudo">gcc -Wall -Wextra prog.c -o prog     # -Wall -Wextra = activer TOUS les avertissements ; le compilateur relit ton code</pre>
<p>Un <strong>avertissement</strong> (<em>warning</em>) est une remarque du compilateur sur un code suspect. Il détecte gratuitement une variable non initialisée, un <code>=</code> au lieu de <code>==</code>, une valeur de retour ignorée… Compile toujours avec <code>-Wall -Wextra</code> et corrige chaque avertissement.</p>

<h3>3. valgrind : le détecteur de fuites</h3>
<pre class="pseudo">gcc -g prog.c -o prog        # -g = ajoute les infos de débogage (les numéros de ligne dans les rapports)
valgrind ./prog              # lance le programme en SURVEILLANT chaque accès mémoire</pre>
<p><code>valgrind</code> est un outil qui exécute ton programme en surveillant la mémoire. Il signale précisément les fuites (« <em>definitely lost</em> »), les accès hors zone et les use-after-free, avec le numéro de ligne. C'est l'outil de référence sous Linux.</p>

<h3>4. Le sanitizer (encore plus simple)</h3>
<pre class="pseudo">gcc -fsanitize=address -g prog.c -o prog   # -fsanitize=address = ajoute une surveillance mémoire DANS le programme
./prog     # le programme s'arrête net à la première faute mémoire, avec la ligne exacte</pre>
<div class="tip">L'AddressSanitizer (<code>-fsanitize=address</code>) « instrumente » le programme (il y insère des vérifications) et pointe l'erreur exacte dès qu'elle se produit. Idéal pendant le développement.</div>

<h3>5. Les bonnes habitudes</h3>
<pre class="pseudo">• Initialise chaque variable et chaque pointeur (à NULL si besoin).   // jamais de valeur au hasard
• Un malloc = un free ; remets le pointeur à NULL après free.        // équilibre allouer/libérer
• Vérifie le retour de malloc et fopen (!= NULL).                    // ils peuvent échouer
• Reste dans les bornes : boucle avec i &lt; n, jamais i &lt;= n.          // indices 0..n-1
• Prévois la place du '\\0' pour les chaînes.                         // une case de plus pour le zéro final
• Compile avec -Wall -Wextra ; teste avec valgrind ou le sanitizer.  // outils = filet de sécurité</pre>
<div class="warn">Le C ne te protège pas : cette rigueur n'est pas optionnelle. La bonne nouvelle, c'est que ces règles sont peu nombreuses et deviennent des réflexes. Les respecter, c'est écrire du C fiable.</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'une erreur de segmentation ?", opts: ["Une simple faute de syntaxe","L'arrêt du programme qui a touché une zone mémoire interdite","Uniquement une division par zéro","Un avertissement sans gravité"], a: 1, exp: "Segfault : accès mémoire illégal détecté par le système." },
    { type: "qcm", q: "Qu'est-ce qu'une fuite mémoire ?", opts: ["Un free en trop", "De la mémoire allouée jamais libérée", "Un pointeur NULL", "Un débordement"], a: 1, exp: "malloc sans free correspondant." },
    { type: "qcm", q: "Quelle option gcc active les avertissements utiles ?", opts: ["-o", "-Wall -Wextra", "-g", "-lm"], a: 1, exp: "Ta première défense, gratuite." },
    { type: "qcm", q: "Quel outil détecte les fuites et accès mémoire invalides sous Linux ?", opts: ["gdb seul", "valgrind", "make", "gcc -o"], a: 1, exp: "valgrind ./prog surveille la mémoire." },
    { type: "qcm", q: "À quoi sert l'option <code>-g</code> de gcc ?", opts: ["À aller plus vite", "À ajouter les infos de débogage (numéros de ligne)", "À lier math", "À optimiser"], a: 1, exp: "-g rend les rapports d'outils lisibles (lignes)." },
    { type: "qcm", q: "Que fait <code>-fsanitize=address</code> ?", opts: ["Rien", "Arrête le programme à la première faute mémoire, en indiquant la ligne", "Compile plus vite", "Supprime les fuites"], a: 1, exp: "L'AddressSanitizer pointe l'erreur exacte à l'exécution." },
    { type: "qcm", q: "Utiliser un pointeur après free s'appelle…", opts: ["fuite", "use-after-free", "double free", "segfault garanti"], a: 1, exp: "Le pointeur est devenu invalide." },
    { type: "qcm", q: "Bonne habitude juste après free(p) ?", opts: ["free(p) encore", "p = NULL;", "malloc(p)", "afficher p"], a: 1, exp: "Neutraliser évite use-after-free et double free." },
    { type: "qcm", q: "Comment éviter un débordement de tableau dans une boucle ?", opts: ["i <= n", "i < n", "i <= n+1", "sans condition"], a: 1, exp: "Les indices vont de 0 à n-1." },
    { type: "qcm", q: "Un pointeur déclaré sans initialisation pointe vers…", opts: ["NULL", "n'importe quelle adresse (valeur indéterminée)", "0", "le tableau"], a: 1, exp: "Le déréférencer est dangereux : initialise-le." },
    { type: "vf", q: "Le C vérifie automatiquement les accès mémoire à l'exécution.", a: false, exp: "Faux : aucune protection intégrée. D'où les outils et la rigueur." },
    { type: "qcm", q: "Que faut-il vérifier après malloc ET fopen ?", opts: ["La taille", "Que le retour n'est pas NULL", "La vitesse", "Rien"], a: 1, exp: "Les deux peuvent échouer : test != NULL." },
    { type: "qcm", q: "Un bug « silencieux » est dangereux car…", opts: ["il plante tout de suite", "il corrompt les données sans planter immédiatement", "il est visible", "il est rare"], a: 1, exp: "Sans crash immédiat, il est difficile à localiser." },
    { type: "qcm", q: "Faire free deux fois sur le même pointeur…", opts: ["est sans effet", "est un double free : comportement indéfini", "libère mieux", "est recommandé"], a: 1, exp: "Erreur grave à éviter (remise à NULL aide)." },
    { type: "qcm", q: "La meilleure attitude face à la gestion mémoire en C :", opts: ["Espérer que ça marche", "Appliquer systématiquement quelques règles simples et utiliser les outils", "Éviter malloc", "Ignorer les avertissements"], a: 1, exp: "Réflexes + outils = C fiable." }
  ],
  final: {
    title: "Exercice final — Chasse aux bugs mémoire",
    intro: `<p>Ce code cumule les fautes. Identifie-les :</p>
<pre class="pseudo">int *t = malloc(3 * sizeof(int));  // réserve 3 entiers (indices 0 à 2) ; manque le test t == NULL
for (int i = 0; i <= 3; i++)       // ERREUR : i <= 3 atteint t[3], hors de la zone (débordement)
    t[i] = i;                      // range i dans chaque case
free(t);                           // libère la mémoire
printf("%d\\n", t[0]);              // ERREUR : use-after-free → on lit t APRÈS l'avoir libéré</pre>`,
    questions: [
      { type: "qcm", q: "Bug n°1 — la boucle <code>i <= 3</code> :", opts: ["Correct", "Débordement : t a 3 cases (indices 0 à 2), i doit être < 3", "Il faut i <= 2 puis i++", "Rien"], a: 1, exp: "t[3] est hors de la zone allouée." },
      { type: "qcm", q: "Bug n°2 — <code>printf(\"%d\", t[0])</code> après <code>free(t)</code> :", opts: ["Correct", "Use-after-free : on lit une mémoire déjà libérée", "Il faut %f", "Rien"], a: 1, exp: "Le pointeur n'est plus valide après free." },
      { type: "qcm", q: "Que manque-t-il juste après malloc ?", opts: ["Rien", "Un test if (t == NULL)", "Un free", "Un printf"], a: 1, exp: "Toujours vérifier l'allocation." },
      { type: "qcm", q: "Quel outil aurait pointé ces erreurs à l'exécution ?", opts: ["make", "valgrind ou -fsanitize=address", "gcc -o", "un éditeur"], a: 1, exp: "Ces outils détectent débordement et use-after-free." },
      { type: "qcm", q: "Ordre correct des opérations ?", opts: ["free puis utiliser", "allouer → vérifier → utiliser (dans les bornes) → free → NULL", "utiliser sans allouer", "free deux fois"], a: 1, exp: "Le cycle de vie mémoire propre." }
    ],
    solution: `<pre class="pseudo">#include &lt;stdio.h&gt;                            // pour printf
#include &lt;stdlib.h&gt;                           // pour malloc et free
                                             // (ligne vide)
int main(void) {                             // point d'entrée du programme
    int *t = malloc(3 * sizeof(int));         // réserve 3 entiers (taille en octets correcte)
    if (t == NULL) return 1;                 // vérifier l'échec d'allocation
                                             // (ligne vide)
    for (int i = 0; i &lt; 3; i++)              // i &lt; 3 : on reste dans les bornes (indices 0 à 2)
        t[i] = i;                            // ranger i dans la case i
                                             // (ligne vide)
    printf("%d\\n", t[0]);                    // on LIT avant de libérer (encore valide)
                                             // (ligne vide)
    free(t);                                 // libérer la mémoire
    t = NULL;                                // neutraliser le pointeur
    return 0;                                // 0 = fin sans erreur
}                                            // fin de main
/* Tester : gcc -g -fsanitize=address final.c -o final ; ./final   // surveillance mémoire à l'exécution
   ou : valgrind ./final */                                        // autre outil de détection</pre>
<p>Rester dans les bornes, utiliser avant de libérer, vérifier et neutraliser : les réflexes mémoire du C. Avec <code>-Wall</code>, <code>valgrind</code> et le sanitizer, tu écris du code robuste. Demain : le projet guidé — un gestionnaire de tâches complet.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code C ici…",
  items: [
  { id: "c-l19", title: "Un malloc propre du début à la fin", level: 3,
    statement: "Écris un programme qui alloue dynamiquement un tableau de 4 int, le vérifie, le remplit (i*i), affiche le tout, puis le libère proprement et remet le pointeur à NULL. Ajoute en commentaire la commande pour le tester avec le sanitizer.",
    hints: [
      "int *t = malloc(4 * sizeof(int)); if (t == NULL) return 1;",
      "Boucle for (int i = 0; i < 4; i++) t[i] = i*i; puis un autre for pour afficher.",
      "free(t); t = NULL; — et en commentaire : gcc -g -fsanitize=address prog.c -o prog"
    ],
    solution: "#include <stdio.h>                    // pour printf\n#include <stdlib.h>                   // pour malloc et free\n\nint main(void) {                     // point d'entree du programme\n    int n = 4;                       // nombre d'elements voulu\n    int *t = malloc(n * sizeof(int)); // reserve n entiers (taille en octets correcte)\n    if (t == NULL) return 1;         // verifier l'echec d'allocation\n\n    for (int i = 0; i < n; i++)      // i < n : dans les bornes\n        t[i] = i * i;                // remplit chaque case avec i au carre\n    for (int i = 0; i < n; i++)      // reparcourt le tableau...\n        printf(\"%d \", t[i]);         // ...affiche chaque valeur\n    printf(\"\\n\");                     // saut de ligne final\n\n    free(t);                         // libere la memoire reservee\n    t = NULL;                        // neutralise le pointeur\n    return 0;                        // 0 = fin sans erreur\n}                                    // fin de main\n// Tester : gcc -g -fsanitize=address prog.c -o prog  puis  ./prog\n// ou : valgrind ./prog",
    atoi: {"cmd":"gcc prog.c -o prog && ./prog","expected":"0 1 4 9"},
    checklist: ["malloc(n * sizeof(int)) réserve la bonne taille.","Le retour de malloc est vérifié contre NULL.","Les boucles restent dans les bornes (i < n).","free(t) puis t = NULL terminent proprement."],
    lang: "c",
    note: "Le cycle complet sans faille : réserver, vérifier, rester dans les bornes (i < n), libérer, neutraliser. Testé avec le sanitizer, ce code ne signale aucune erreur mémoire." }
  ]
};
