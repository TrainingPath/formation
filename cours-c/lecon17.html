<script>
var DAY = {
  num: 17,
  title: "enum, union et typedef",
  subtitle: "Des types plus expressifs : énumérations lisibles, unions économes, alias clairs.",
  theory: `
<h3>1. enum : des constantes nommées</h3>
<p>Une <strong>énumération</strong> (<code>enum</code>) associe des noms lisibles à des entiers. Une <strong>constante</strong> est une valeur fixe qui ne change pas. Plutôt que de retenir « 0 = client, 1 = vendeur, 2 = admin », on donne un nom à chaque valeur : le code devient parlant.</p>
<pre class="pseudo">enum Role { CLIENT, VENDEUR, ADMIN };   // définit 3 constantes ; par défaut CLIENT=0, VENDEUR=1, ADMIN=2
                                        // (ligne vide)
enum Role r = VENDEUR;                   // r est une variable de type enum Role ; VENDEUR est plus clair que « 1 »
if (r == ADMIN) { ... }                 // on compare avec le nom (== = comparaison), pas avec un chiffre mystérieux</pre>
<pre class="pseudo">enum Statut { DISPO = 1, LOUE = 2, VENDU = 5 };  // on PEUT fixer soi-même les valeurs (ici 1, 2, 5)</pre>

<h3>2. enum avec switch : un duo naturel</h3>
<pre class="pseudo">switch (r) {                              // examine la valeur de r
    case CLIENT:  printf("Client\\n");  break;   // cas r == CLIENT : afficher Client, puis sortir
    case VENDEUR: printf("Vendeur\\n"); break;   // cas r == VENDEUR : afficher Vendeur, puis sortir
    case ADMIN:   printf("Admin\\n");   break;   // cas r == ADMIN : afficher Admin, puis sortir
}                                         // fin du switch</pre>
<div class="tip">Un <code>enum</code> reste un entier sous le capot, mais rend le code <strong>lisible</strong> et limite les erreurs (on écrit <code>ADMIN</code>, pas un « 2 » mystérieux). Idéal avec <code>switch</code>.</div>

<h3>3. typedef : donner un nom court</h3>
<p>On l'a déjà vu pour les structures. <code>typedef</code> crée un <strong>alias</strong> (un surnom) pour n'importe quel type, ce qui évite de répéter des mots longs.</p>
<pre class="pseudo">typedef enum { CLIENT, VENDEUR, ADMIN } Role;   // alias : on écrit "Role" au lieu de "enum Role"
typedef unsigned int uint;                       // alias : uint remplace "unsigned int" (entier non signé)
                                                 // (ligne vide)
Role r = ADMIN;                                  // grâce à l'alias, plus besoin du mot « enum »
uint compteur = 0;                               // uint = unsigned int (un entier toujours ≥ 0)</pre>

<h3>4. union : plusieurs types, un seul espace</h3>
<p>Une <strong>union</strong> ressemble à une structure, mais tous ses champs <strong>partagent la même case mémoire</strong> : elle ne contient qu'<em>une</em> valeur à la fois. Utile pour économiser la mémoire quand une donnée peut prendre plusieurs formes.</p>
<pre class="pseudo">union Valeur {         // définit une union : ses champs se SUPERPOSENT au même endroit
    int entier;         // forme possible 1 : un entier
    double reel;        // forme possible 2 : un réel
    char texte[20];     // forme possible 3 : un petit texte
};                      // taille = celle du PLUS GRAND champ, pas la somme
                        // (ligne vide)
union Valeur v;         // une variable union
v.entier = 42;          // on utilise UN champ à la fois (ici l'entier)
printf("%d\\n", v.entier);   // on relit le MÊME champ qu'on a écrit → 42</pre>
<div class="warn">Dans une union, écrire un champ « écrase » les autres : lire un champ différent de celui écrit donne un résultat sans signification. À réserver à des cas précis (souvent avec un enum qui indique quel champ est actif).</div>

<h3>5. Récapitulatif des types construits</h3>
<pre class="pseudo">struct   : champs côte à côte  (nom ET prix ET stock)   → un jeu                // toutes les données ensemble
union    : champs superposés   (nom OU prix OU stock)   → une valeur polymorphe // une seule donnée à la fois
enum     : constantes nommées  (CLIENT, VENDEUR, ADMIN) → un ensemble de choix  // des noms au lieu de nombres
typedef  : un alias de type    (Role, Jeu, uint)        → du code lisible       // juste un surnom, aucune donnée</pre>
<div class="tip">Retiens la nuance : <strong>struct = ET</strong> (toutes les données ensemble), <strong>union = OU</strong> (une seule à la fois). <code>enum</code> et <code>typedef</code> ne créent pas de données, ils rendent le code clair.</div>`,
  exercises: [
    { type: "qcm", q: "À quoi sert un enum ?", opts: ["À allouer de la mémoire", "À nommer des constantes entières lisibles", "À lire un fichier", "À créer un pointeur"], a: 1, exp: "enum associe des noms à des entiers." },
    { type: "qcm", q: "Dans <code>enum Role { CLIENT, VENDEUR, ADMIN };</code>, ADMIN vaut…", opts: ["1", "2", "3", "un texte"], a: 1, exp: "Numérotation à partir de 0 : 0,1,2 → ADMIN = 2." },
    { type: "qcm", q: "Un enum est en réalité, sous le capot…", opts: ["un double", "un entier", "une chaîne", "un pointeur"], a: 1, exp: "Les valeurs d'enum sont des entiers." },
    { type: "qcm", q: "Avec quelle structure de contrôle l'enum s'associe-t-il bien ?", opts: ["while", "switch", "do-while", "for"], a: 1, exp: "switch (role) { case ADMIN: ... }." },
    { type: "qcm", q: "Que fait typedef ?", opts: ["Alloue de la mémoire", "Crée un alias pour un type", "Affiche un type", "Compile"], a: 1, exp: "typedef donne un nom plus court/clair à un type." },
    { type: "qcm", q: "Dans une union, les champs…", opts: ["sont côte à côte", "partagent la même case mémoire (une valeur à la fois)", "sont tous des int", "n'existent pas"], a: 1, exp: "union = champs superposés." },
    { type: "qcm", q: "La taille d'une union est…", opts: ["la somme des champs", "celle de son plus grand champ", "toujours 4", "0"], a: 1, exp: "Un seul espace, dimensionné sur le plus grand champ." },
    { type: "qcm", q: "Différence clé struct / union ?", opts: ["Aucune", "struct = ET (tous les champs), union = OU (un seul à la fois)", "union est plus grande", "struct n'a qu'un champ"], a: 1, exp: "struct additionne, union superpose." },
    { type: "qcm", q: "Après <code>v.entier = 42;</code> dans une union, lire v.reel donne…", opts: ["42.0", "un résultat sans signification", "0", "une erreur de compilation"], a: 1, exp: "Écrire un champ écrase les autres : lecture incohérente." },
    { type: "qcm", q: "Comment fixer des valeurs précises dans un enum ?", opts: ["Impossible", "enum S { DISPO = 1, LOUE = 2, VENDU = 5 };", "enum S = 1;", "avec typedef"], a: 1, exp: "On peut assigner explicitement chaque valeur." },
    { type: "vf", q: "typedef alloue de la mémoire à l'exécution.", a: false, exp: "Faux : typedef ne fait que créer un alias de type, sans mémoire." },
    { type: "qcm", q: "<code>typedef enum { CLIENT, VENDEUR } Role;</code> permet d'écrire…", opts: ["enum Role r;", "Role r;", "int Role;", "Role()"], a: 1, exp: "Grâce à typedef, on écrit Role sans « enum »." },
    { type: "qcm", q: "Pourquoi préférer ADMIN à la valeur 2 en dur ?", opts: ["C'est plus rapide", "C'est plus lisible et moins source d'erreurs", "Ça prend moins de mémoire", "Aucune raison"], a: 1, exp: "Le nom documente l'intention." },
    { type: "qcm", q: "Quand une union est-elle vraiment utile ?", opts: ["Toujours", "Quand une donnée peut prendre plusieurs formes mais une seule à la fois", "Pour additionner", "Jamais"], a: 1, exp: "Économie mémoire pour une valeur « polymorphe », souvent avec un enum de type." },
    { type: "qcm", q: "enum, union, struct, typedef : lequel ne stocke PAS de données propres ?", opts: ["struct", "union", "typedef (c'est juste un alias)", "enum"], a: 2, exp: "typedef nomme un type existant ; il ne crée pas de stockage." }
  ],
  final: {
    title: "Exercice final — Le statut d'un jeu",
    intro: `<p>On représente le statut d'un exemplaire. Corrige et complète :</p>
<pre class="pseudo">enum Statut { DISPO, LOUE, VENDU }     // ERREUR : il manque le ; après l'accolade fermante
                                       // (ligne vide)
int main(void) {                       // point d'entrée
    enum Statut s = 1;                 // fonctionne mais peu lisible : mieux vaut écrire LOUE que 1
    if (s = LOUE)                      // ERREUR : un seul = affecte ; pour comparer il faut ==
        printf("En location\\n");      // ne s'exécute pas comme prévu à cause du bug ci-dessus
    return 0;                          // 0 = fin sans erreur
}                                      // fin de main</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — après la définition de l'enum :", opts: ["Rien", "Il manque le ; : enum Statut { ... };", "Il faut typedef", "Il faut une virgule"], a: 1, exp: "Comme struct, la définition d'enum se termine par ;." },
      { type: "qcm", q: "Que vaut <code>LOUE</code> dans <code>enum Statut { DISPO, LOUE, VENDU }</code> ?", opts: ["0", "1", "2", "indéfini"], a: 1, exp: "DISPO=0, LOUE=1, VENDU=2." },
      { type: "qcm", q: "Erreur n°2 — <code>if (s = LOUE)</code> :", opts: ["Correct", "Comparaison : il faut == (le simple = affecte)", "Il faut <", "s est réservé"], a: 1, exp: "Encore le piège = / == !" },
      { type: "qcm", q: "Écriture plus lisible que <code>enum Statut s = 1;</code> :", opts: ["s = 1", "enum Statut s = LOUE;", "s = LOUE()", "int s = 1"], a: 1, exp: "Utiliser le nom LOUE plutôt que la valeur brute." },
      { type: "qcm", q: "Comment traiter tous les statuts proprement ?", opts: ["Une suite de if", "Un switch (s) avec un case par statut", "Un while", "Un malloc"], a: 1, exp: "switch + enum : le duo idéal." }
    ],
    solution: `<pre class="pseudo">#include &lt;stdio.h&gt;                              // pour printf
                                               // (ligne vide)
typedef enum { DISPO, LOUE, VENDU } Statut;     // ; obligatoire ; typedef crée l'alias Statut
                                               // (ligne vide)
int main(void) {                                // point d'entrée
    Statut s = LOUE;                            // nom lisible plutôt que 1
    switch (s) {                                // examine la valeur de s
        case DISPO: printf("Disponible\\n"); break;   // cas DISPO
        case LOUE:  printf("En location\\n"); break;  // cas LOUE (le nôtre)
        case VENDU: printf("Vendu\\n");       break;  // cas VENDU
    }                                           // fin du switch
    return 0;                                   // 0 = fin sans erreur
}                                               // fin de main</pre>
<p>Un enum bien nommé, un <code>switch</code> qui couvre chaque cas, et le rappel éternel du <code>==</code>. Ces types construits rendent le code parlant. Demain : les pointeurs de fonctions et le tri générique.</p>`
  }
};
</script>

  { id: "c-l17", title: "Rôles d'utilisateur", level: 2,
    statement: "Définis un type <code>Role</code> (typedef enum) avec CLIENT, VENDEUR, ADMIN. Écris une fonction <code>void afficher_role(Role r)</code> qui, avec un switch, affiche le libellé du rôle. Teste-la sur ADMIN.",
    hints: [
      "typedef enum { CLIENT, VENDEUR, ADMIN } Role;",

    solution: "#include <stdio.h>                    // pour printf\n\ntypedef enum { CLIENT, VENDEUR, ADMIN } Role;   // alias Role ; CLIENT=0, VENDEUR=1, ADMIN=2\n\nvoid afficher_role(Role r) {         // recoit un Role\n    switch (r) {                     // examine la valeur de r\n        case CLIENT:  printf(\"Client\\n\");  break;   // cas CLIENT\n        case VENDEUR: printf(\"Vendeur\\n\"); break;   // cas VENDEUR\n        case ADMIN:   printf(\"Admin\\n\");   break;   // cas ADMIN\n        default:      printf(\"Inconnu\\n\"); break;   // valeur imprevue : par prudence\n    }                                // fin du switch\n}                                    // fin de la fonction\n\nint main(void) {                     // point d'entree du programme\n    Role r = ADMIN;                  // on teste avec ADMIN\n    afficher_role(r);                // affiche Admin\n    return 0;                        // 0 = fin sans erreur\n}                                    // fin de main",
    note: "L'enum rend le code lisible (ADMIN plutôt que 2) et se marie naturellement avec switch. typedef évite de répéter « enum ». Le default protège des valeurs imprévues." }
  ]
};
