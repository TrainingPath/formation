<script>
var DAY = {
  num: 18,
  title: "Pointeurs de fonctions et qsort",
  subtitle: "Passer une fonction en paramètre : le mécanisme derrière le tri générique de la bibliothèque standard.",
  theory: `
<h3>1. Une fonction a une adresse</h3>
<p>On a vu qu'une variable a une <strong>adresse</strong> (un numéro de case mémoire) et qu'un <strong>pointeur</strong> stocke une adresse. Une fonction aussi occupe la mémoire et possède une adresse. On peut donc la ranger dans un <strong>pointeur de fonction</strong> et l'appeler à travers lui.</p>
<pre class="pseudo">int addition(int a, int b) { return a + b; }   // une fonction ordinaire qui additionne
                                               // (ligne vide)
int (*op)(int, int) = addition;                // op = pointeur vers une fonction (int,int)→int ; reçoit l'adresse d'addition
printf("%d\\n", op(2, 3));                       // on appelle addition À TRAVERS op → 5</pre>
<p>La déclaration <code>int (*op)(int, int)</code> se lit : « <code>op</code> est un pointeur vers une fonction qui prend deux int et renvoie un int ». Les parenthèses autour de <code>*op</code> sont indispensables.</p>

<h3>2. Passer une fonction en paramètre</h3>
<p>C'est l'intérêt principal : écrire une fonction <strong>générique</strong> (valable dans plein de cas) dont le <strong>comportement</strong> précis est fourni par une autre fonction qu'on lui passe.</p>
<pre class="pseudo">int appliquer(int x, int y, int (*f)(int, int)) {   // f = paramètre pointeur de fonction
    return f(x, y);                                  // on exécute la fonction REÇUE sur x et y
}                                                   // fin de la fonction
appliquer(2, 3, addition);                          // on passe addition comme comportement → 5</pre>

<h3>3. qsort : le tri générique de la bibliothèque</h3>
<p><code>qsort</code> (de <code>stdlib.h</code>) trie n'importe quel tableau. Comme il ignore le type des éléments, on lui fournit une <strong>fonction de comparaison</strong> qui lui dit comment ordonner deux éléments. Le type <code>void *</code> est un pointeur « générique » qui peut désigner n'importe quel type.</p>
<pre class="pseudo">#include &lt;stdlib.h&gt;                        // pour qsort
                                          // (ligne vide)
int cmp_int(const void *a, const void *b) {   // reçoit les adresses génériques de 2 éléments
    int x = *(const int *)a;               // (const int *)a = "traite a comme un pointeur vers int" ; * = sa valeur
    int y = *(const int *)b;               // idem pour b
    return x - y;                          // &lt;0 si x avant y, 0 si égaux, &gt;0 si x après y
}                                          // fin de la fonction de comparaison
                                          // (ligne vide)
int t[5] = {5, 2, 8, 1, 9};               // tableau à trier
qsort(t, 5, sizeof(int), cmp_int);        // trie : tableau, nb d'éléments, taille d'un élément, comparaison → {1,2,5,8,9}</pre>

<h3>4. Le contrat de la fonction de comparaison</h3>
<pre class="pseudo">Elle reçoit deux const void* (adresses des éléments à comparer)   // deux pointeurs génériques
et renvoie un int :                                              // le signe du résultat décide de l'ordre
  &lt; 0  → le premier vient AVANT le second                        // négatif : a avant b
   0   → ils sont équivalents                                    // zéro : même position
  &gt; 0  → le premier vient APRÈS le second                        // positif : a après b</pre>
<div class="warn">Pour trier en ordre décroissant, on inverse : <code>return y - x;</code>. Pour des chaînes, on compare avec <code>strcmp</code>. Attention : pour des <code>double</code>, ne pas renvoyer une soustraction (elle peut mal se convertir en int) — utiliser des comparaisons explicites.</div>

<h3>5. À quoi ça sert vraiment ?</h3>
<p>Les pointeurs de fonctions permettent des programmes <strong>configurables</strong> : callbacks (une fonction rappelée quand un événement survient), tables d'actions (un menu qui associe chaque choix à une fonction), et tout tri ou recherche générique. C'est la porte d'entrée vers la programmation modulaire.</p>
<div class="tip"><code>typedef</code> allège la syntaxe : <code>typedef int (*Operation)(int, int);</code> permet ensuite d'écrire simplement <code>Operation op = addition;</code>.</div>`,
  exercises: [
    { type: "qcm", q: "Un pointeur de fonction stocke…", opts: ["la valeur renvoyée par une fonction","l'adresse d'une fonction","un tableau de paramètres","le code source d'une fonction"], a: 1, exp: "Comme une variable, une fonction a une adresse." },
    { type: "qcm", q: "Comment déclarer un pointeur vers une fonction (int, int) → int ?", opts: ["int *op(int,int);", "int (*op)(int, int);", "int op*(int,int);", "func op;"], a: 1, exp: "Les parenthèses autour de *op sont obligatoires." },
    { type: "qcm", q: "Pourquoi les parenthèses dans <code>(*op)</code> ?", opts: ["Un simple choix esthétique","Sans elles, on déclarerait une fonction qui renvoie un pointeur","Pour accélérer l'appel","Elles sont optionnelles ici"], a: 1, exp: "int *op(...) est une fonction ; int (*op)(...) est un pointeur." },
    { type: "qcm", q: "Quel est l'intérêt de passer une fonction en paramètre ?", opts: ["Aucun", "Rendre une fonction générique / configurable (callbacks, tris)", "Aller plus vite toujours", "Éviter les boucles"], a: 1, exp: "Le comportement est fourni de l'extérieur." },
    { type: "qcm", q: "Quelle fonction standard trie un tableau générique ?", opts: ["sort", "qsort", "bsort", "arrange"], a: 1, exp: "qsort de stdlib.h." },
    { type: "qcm", q: "Que fournit-on à qsort pour savoir comment ordonner ?", opts: ["Rien", "Une fonction de comparaison", "Un enum", "Un fichier"], a: 1, exp: "qsort ignore le type : la comparaison le renseigne." },
    { type: "qcm", q: "Une fonction de comparaison renvoie un nombre < 0 quand…", opts: ["les éléments sont égaux", "le premier doit venir avant le second", "le premier vient après", "erreur"], a: 1, exp: "<0 → premier avant ; 0 → égaux ; >0 → premier après." },
    { type: "qcm", q: "Pourquoi les paramètres de comparaison sont-ils des <code>const void *</code> ?", opts: ["Par style", "Pour être génériques : qsort ignore le type réel", "Pour aller plus vite", "Une erreur"], a: 1, exp: "void* accepte n'importe quel type ; on reconvertit dedans." },
    { type: "qcm", q: "Comment récupérer l'int pointé par <code>const void *a</code> ?", opts: ["*a", "*(const int *)a", "(int)a", "a[0]"], a: 1, exp: "On caste en int* puis on déréférence." },
    { type: "qcm", q: "Pour trier en ordre DÉCROISSANT, la comparaison renvoie…", opts: ["x - y", "y - x", "0", "toujours 1"], a: 1, exp: "Inverser la soustraction inverse l'ordre." },
    { type: "vf", q: "qsort ne peut trier que des tableaux d'entiers.", a: false, exp: "Faux : il trie n'importe quel type grâce à la fonction de comparaison." },
    { type: "qcm", q: "Que passe-t-on à qsort en plus du tableau ?", opts: ["Seulement la taille", "nombre d'éléments, taille d'un élément, et la fonction de comparaison", "Rien", "Un pointeur NULL"], a: 1, exp: "qsort(t, n, sizeof(elem), cmp)." },
    { type: "qcm", q: "Pour comparer des chaînes dans qsort, on utilise souvent…", opts: ["==", "strcmp", "sizeof", "un enum"], a: 1, exp: "strcmp respecte déjà le contrat <0/0/>0." },
    { type: "qcm", q: "Un « callback » est…", opts: ["un retour de fonction", "une fonction passée pour être appelée au bon moment", "une boucle", "un fichier"], a: 1, exp: "On rappelle la fonction fournie quand c'est nécessaire." },
    { type: "qcm", q: "<code>typedef int (*Operation)(int, int);</code> permet d'écrire ensuite…", opts: ["Operation op = addition;", "int Operation;", "op Operation;", "rien"], a: 0, exp: "L'alias simplifie la déclaration du pointeur de fonction." }
  ],
  final: {
    title: "Exercice final — Trier les prix",
    intro: `<p>On veut trier un tableau d'entiers croissant avec qsort. Corrige la comparaison :</p>
<pre class="pseudo">int cmp(int a, int b) {                // ERREUR : qsort attend une comparaison (const void *, const void *)
    return a - b;                      // la logique (croissant) est bonne, mais la signature est fausse
}                                      // fin de la fonction
int t[4] = {30, 10, 20, 5};            // tableau à trier
qsort(t, 4, sizeof(int), cmp);         // qsort appellera cmp avec des void*, pas des int → incompatible</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — la signature <code>int cmp(int a, int b)</code> :", opts: ["Correcte", "qsort attend une comparaison (const void *, const void *)", "Il faut void cmp", "Il faut 3 paramètres"], a: 1, exp: "Le contrat de qsort impose des const void*." },
      { type: "qcm", q: "Comment obtenir les entiers depuis les void* a et b ?", opts: ["a et b directement", "*(const int *)a et *(const int *)b", "(int)a", "a[0]"], a: 1, exp: "Cast en int* puis déréférencement." },
      { type: "qcm", q: "Une fois corrigée, que renvoie la comparaison pour trier croissant ?", opts: ["y - x", "x - y", "0 toujours", "1 toujours"], a: 1, exp: "x - y : ordre croissant." },
      { type: "qcm", q: "Quel en-tête faut-il pour qsort ?", opts: ["stdio.h", "stdlib.h", "string.h", "sort.h"], a: 1, exp: "#include <stdlib.h>." },
      { type: "qcm", q: "Après tri croissant, t vaut…", opts: ["{30,20,10,5}", "{5,10,20,30}", "{10,20,30,5}", "inchangé"], a: 1, exp: "Trié en ordre croissant." }
    ],
    solution: `<pre class="pseudo">#include &lt;stdio.h&gt;                            // pour printf
#include &lt;stdlib.h&gt;                           // pour qsort
                                             // (ligne vide)
int cmp(const void *a, const void *b) {       // signature corrigée : deux const void*
    int x = *(const int *)a;                  // reconvertir a en int* puis déréférencer
    int y = *(const int *)b;                  // idem pour b
    return x - y;                             // x - y : ordre croissant
}                                             // fin de la fonction de comparaison
                                             // (ligne vide)
int main(void) {                              // point d'entrée
    int t[4] = {30, 10, 20, 5};               // tableau à trier
    qsort(t, 4, sizeof(int), cmp);            // trie t sur place
    for (int i = 0; i &lt; 4; i++) printf("%d ", t[i]);  // affiche 5 10 20 30
    printf("\\n");                             // saut de ligne final
    return 0;                                 // 0 = fin sans erreur
}                                             // fin de main</pre>
<p>La fonction de comparaison respecte le contrat <code>const void*</code> → <code>int</code>, et qsort s'occupe du reste. Les pointeurs de fonctions rendent le code réutilisable et modulaire. Demain : gérer la mémoire et traquer les bugs.</p>`
  }
};

  { id: "c-l18", title: "Trier les prix décroissant", level: 3,
    statement: "Trie un tableau de 5 double représentant des prix, du plus cher au moins cher, avec qsort. Écris une fonction de comparaison adaptée aux double (attention : ne renvoie pas une simple soustraction). Affiche le tableau trié.",
    hints: [
      "Signature : int cmp(const void *a, const void *b).",
      "Récupère les valeurs : double x = *(const double *)a; ... puis compare.",
      "Décroissant : if (x < y) return 1; if (x > y) return -1; return 0;"
    ],
    solution: "#include <stdio.h>                    // pour printf\n#include <stdlib.h>                   // pour qsort\n\nint cmp_desc(const void *a, const void *b) {  // deux const void* (contrat qsort)\n    double x = *(const double *)a;   // reconvertir a en double* puis lire la valeur\n    double y = *(const double *)b;   // idem pour b\n    if (x < y) return 1;             // x plus petit → x APRES y (ordre decroissant)\n    if (x > y) return -1;            // x plus grand → x AVANT y\n    return 0;                        // egaux\n}                                    // fin de la comparaison\n\nint main(void) {                     // point d'entree du programme\n    double prix[5] = {44.90, 12.50, 39.0, 5.0, 19.90};  // tableau a trier\n    qsort(prix, 5, sizeof(double), cmp_desc);  // trie du plus cher au moins cher\n    for (int i = 0; i < 5; i++)      // parcourt le tableau trie\n        printf(\"%.2f \", prix[i]);    // affiche chaque prix a 2 decimales\n    printf(\"\\n\");                     // saut de ligne final\n    return 0;                        // 0 = fin sans erreur\n}                                    // fin de main",
    atoi: {"cmd":"gcc prog.c -o prog && ./prog","expected":"44.90 39.00 19.90 12.50 5.00"},
    checklist: ["La comparaison a la signature int cmp(const void *a, const void *b).","Les valeurs sont relues via *(const double *)a.","On compare avec x<y / x>y, pas avec x-y.","Les retours sont inversés pour l'ordre décroissant."],
    lang: "c",
    note: "Pour les double, on compare explicitement (x<y, x>y) plutôt que de renvoyer x-y, car la soustraction convertie en int perdrait les décimales et fausserait le tri. Inverser les retours donne l'ordre décroissant." }
  ]
};
