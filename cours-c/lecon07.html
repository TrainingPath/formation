<script>
var DAY = {
  num: 7,
  title: "Les tableaux",
  subtitle: "Ranger plusieurs valeurs de même type — et pourquoi le C ne surveille pas les débordements.",
  theory: `
<h3>1. Déclarer et initialiser un tableau</h3>
<p>Un <strong>tableau</strong> est une <strong>suite de cases</strong> de <em>même type</em> rangées les unes à la suite des autres en mémoire, portant toutes le même nom. Image : une rangée de casiers numérotés. Plutôt que de créer 4 variables séparées, on crée un seul tableau de 4 cases. Entre crochets <code>[ ]</code> on écrit le nombre de cases ; entre accolades <code>{ }</code> les valeurs de départ.</p>
<pre class="pseudo">int stocks[4] = {3, 0, 5, 2};        // tableau de 4 entiers ; cases numérotées de 0 à 3
double prix[3] = {44.90, 29.50, 19.0}; // tableau de 3 réels
int zeros[5] = {0};                   // 5 entiers ; {0} met TOUT à 0
int suite[] = {1, 2, 3};              // [] vide : la taille est DÉDUITE du contenu → 3 cases</pre>
<p>Un tableau contient un nombre <strong>fixe</strong> d'éléments de <strong>même type</strong>, décidé à la déclaration et qui ne change plus.</p>

<h3>2. Accéder aux éléments : l'indice commence à 0</h3>
<p>L'<strong>indice</strong> est le numéro d'une case, écrit entre crochets. Point crucial : la numérotation commence à <strong>0</strong>, pas à 1. La première case est donc <code>stocks[0]</code>.</p>
<pre class="pseudo">int stocks[4] = {3, 0, 5, 2};        // 4 cases : indices 0,1,2,3
printf("%d\\n", stocks[0]);           // stocks[0] = la PREMIÈRE case → 3
printf("%d\\n", stocks[3]);           // stocks[3] = la DERNIÈRE case (d'un tableau de 4) → 2
stocks[1] = 7;                       // on RANGE 7 dans la case d'indice 1 (elle valait 0)</pre>
<div class="warn">Un tableau de taille n a ses indices de <strong>0 à n-1</strong>. Accéder à <code>stocks[4]</code> ici est un <strong>débordement</strong> : le C ne vérifie PAS les bornes. Il lit/écrit hors du tableau — comportement indéfini, bug ou plantage. C'est à toi de rester dans les limites.</div>

<h3>3. Parcourir un tableau avec for</h3>
<p><strong>Parcourir</strong> un tableau, c'est visiter ses cases une par une. Le compteur <code>i</code> de la boucle sert d'indice.</p>
<pre class="pseudo">int stocks[4] = {3, 0, 5, 2};        // le tableau à parcourir
int total = 0;                       // accumulateur pour la somme (démarre à 0)
for (int i = 0; i &lt; 4; i++) {        // i prend les valeurs 0,1,2,3 (i &lt; 4 = jusqu'au dernier indice)
    total += stocks[i];              // ajouter la case n°i à total
}                                    // fin de la boucle
printf("Total : %d\\n", total);       // 3+0+5+2 = 10</pre>

<h3>4. Taille d'un tableau : sizeof</h3>
<p>Pour éviter d'écrire « 4 » en dur (source d'erreurs si on change le tableau), on calcule le nombre d'éléments : taille totale du tableau divisée par la taille d'une case.</p>
<pre class="pseudo">int t[4] = {3, 0, 5, 2};             // tableau de 4 entiers
int n = sizeof(t) / sizeof(t[0]);    // sizeof(t)=16 octets ; sizeof(t[0])=4 → n = 16/4 = 4
for (int i = 0; i &lt; n; i++) { ... }  // on parcourt de 0 à n-1 sans écrire 4 en dur</pre>
<div class="warn">Cette astuce ne marche que <strong>là où le tableau est déclaré</strong>. Passé à une fonction, un tableau « oublie » sa taille (leçon 11) : on transmet alors la taille en paramètre à part.</div>

<h3>5. Tableaux à deux dimensions</h3>
<p>Un tableau à <strong>deux dimensions</strong> est un tableau de tableaux : une grille avec des lignes et des colonnes. On l'indexe avec deux crochets : <code>[ligne][colonne]</code>.</p>
<pre class="pseudo">int grille[2][3] = {                 // 2 lignes, 3 colonnes
    {1, 2, 3},                       // ligne 0
    {4, 5, 6}                        // ligne 1
};                                   // fin de la grille
printf("%d\\n", grille[1][2]);        // ligne 1, colonne 2 → 6</pre>
<div class="tip">Le tableau est la structure de données de base du C. Combiné aux boucles, il permet de traiter des séries entières : stocks, prix, notes… On l'utilisera partout.</div>`,
  exercises: [
    { type: "qcm", q: "Quel est l'indice du premier élément d'un tableau ?", opts: ["1", "0", "-1", "Selon la déclaration"], a: 1, exp: "Les indices commencent à 0." },
    { type: "qcm", q: "Pour un tableau <code>int t[5]</code>, quel est le dernier indice valide ?", opts: ["5", "4", "6", "0"], a: 1, exp: "Indices 0 à 4 (n-1)." },
    { type: "qcm", q: "Les éléments d'un tableau sont…", opts: ["de types variés", "tous du même type", "toujours des int", "sans type"], a: 1, exp: "Un tableau regroupe des valeurs de même type." },
    { type: "qcm", q: "Que se passe-t-il si on lit <code>t[10]</code> dans un tableau de 5 cases ?", opts: ["Erreur détectée par le C", "Débordement : comportement indéfini (le C ne vérifie pas)", "Renvoie 0", "Renvoie le dernier élément"], a: 1, exp: "Aucune vérification des bornes en C : à toi d'y veiller." },
    { type: "qcm", q: "Comment initialiser tout un tableau à 0 ?", opts: ["int t[5];", "int t[5] = {0};", "int t[5] = 0;", "zero(t);"], a: 1, exp: "{0} met le premier à 0 et le reste est complété à 0." },
    { type: "qcm", q: "Comment obtenir le nombre d'éléments d'un tableau t local ?", opts: ["t.length", "sizeof(t) / sizeof(t[0])", "count(t)", "len(t)"], a: 1, exp: "Taille totale / taille d'un élément." },
    { type: "qcm", q: "Comment modifier la 2e case de t ?", opts: ["t(1) = 7;", "t[1] = 7;", "t.1 = 7;", "t{1} = 7;"], a: 1, exp: "t[1] : indice 1 = 2e case." },
    { type: "qcm", q: "La taille d'un tableau (nombre de cases) est-elle modifiable après déclaration ?", opts: ["Oui, librement", "Non : elle est fixe (allocation dynamique = leçon 12)", "Oui avec resize()", "Seulement pour les int"], a: 1, exp: "Taille fixe ; pour une taille variable, il faudra malloc." },
    { type: "qcm", q: "<code>int auto[] = {1,2,3};</code> a une taille de…", opts: ["0", "3 (déduite du contenu)", "1", "indéterminée"], a: 1, exp: "Sans taille explicite, elle est déduite : 3." },
    { type: "qcm", q: "Comment accéder à la ligne 0, colonne 2 de <code>int g[2][3]</code> ?", opts: ["g[0,2]", "g[0][2]", "g(0)(2)", "g[2][0]"], a: 1, exp: "g[ligne][colonne]." },
    { type: "vf", q: "Le C vérifie automatiquement qu'on ne sort pas des bornes d'un tableau.", a: false, exp: "Faux : aucune vérification. C'est une source majeure de bugs." },
    { type: "qcm", q: "Que vaut total après <code>for(i=0;i<3;i++) total += t[i];</code> avec t = {2,4,6} ?", opts: ["6", "12", "246", "8"], a: 1, exp: "2+4+6 = 12." },
    { type: "qcm", q: "Pourquoi parcourt-on avec <code>i < n</code> et non <code>i <= n</code> ?", opts: ["Question de style", "Pour ne pas dépasser le dernier indice (n-1) et déborder", "Pour aller plus vite", "Aucune raison"], a: 1, exp: "i <= n lirait t[n], hors du tableau." },
    { type: "qcm", q: "Les cases d'un tableau sont rangées en mémoire…", opts: ["au hasard", "les unes à la suite des autres (contigües)", "dans des fichiers", "jamais ensemble"], a: 1, exp: "Contigüité : c'est ce qui rend l'accès par indice si rapide." },
    { type: "qcm", q: "Combien d'éléments dans <code>double p[3] = {1.0, 2.0}</code> ?", opts: ["2", "3 (le 3e vaut 0.0)", "1", "Erreur"], a: 1, exp: "Taille 3 : les cases non fournies sont mises à 0." }
  ],
  final: {
    title: "Exercice final — Le plus grand stock",
    intro: `<p>On cherche le plus grand stock du catalogue. Corrige :</p>
<pre class="pseudo">int stocks[4] = {3, 8, 5, 2};      // 4 stocks (indices 0 à 3)
int max = 0;                       // max provisoire (risqué : et si tout était négatif ?)
for (int i = 0; i <= 4; i++) {     // ERREUR : i <= 4 atteint stocks[4], hors du tableau (débordement)
    if (stocks[i] > max)           // si la case courante dépasse le max connu...
        max = stocks[i];           // ...elle devient le nouveau max
}                                  // fin de la boucle
printf("Max : %d\\n", max);         // affiche le plus grand stock</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — <code>i <= 4</code> :", opts: ["Correct", "Débordement : il faut i < 4 (indices 0 à 3)", "Il faut i <= 3", "Rien"], a: 1, exp: "i <= 4 accède à stocks[4], hors du tableau." },
      { type: "qcm", q: "Pourquoi initialiser max à 0 est-il risqué en général ?", opts: ["Ce n'est pas risqué", "Si toutes les valeurs étaient négatives, max resterait 0 (faux)", "0 est interdit", "Il faut max = 100"], a: 1, exp: "Mieux : initialiser max avec stocks[0]." },
      { type: "qcm", q: "Meilleure initialisation de max ?", opts: ["max = 0", "max = stocks[0], puis parcourir à partir de i = 1", "max = 9999", "max = -1"], a: 1, exp: "On part du premier élément réel du tableau." },
      { type: "qcm", q: "Avec {3, 8, 5, 2}, que vaut max (code corrigé) ?", opts: ["3", "8", "5", "2"], a: 1, exp: "8 est le maximum." },
      { type: "qcm", q: "Combien d'itérations pour parcourir 4 éléments correctement ?", opts: ["3", "4", "5", "0"], a: 1, exp: "i de 0 à 3 : 4 tours." }
    ],
    solution: `<pre class="pseudo">#include &lt;stdio.h&gt;                            // pour printf
                                             // (ligne vide)
int main(void) {                             // point d'entrée du programme
    int stocks[4] = {3, 8, 5, 2};            // les 4 stocks
    int n = sizeof(stocks) / sizeof(stocks[0]);  // nombre d'éléments = 4
    int max = stocks[0];                     // on part du PREMIER élément réel
    for (int i = 1; i &lt; n; i++) {            // i de 1 à n-1 (on a déjà pris l'indice 0)
        if (stocks[i] &gt; max)                 // si la case i dépasse le max connu...
            max = stocks[i];                 // ...elle devient le nouveau max
    }                                        // fin de la boucle
    printf("Max : %d\\n", max);               // 8
    return 0;                                // 0 = fin sans erreur
}                                            // fin de main</pre>
<p>Deux corrections : rester dans les bornes (<code>i &lt; n</code>) et initialiser <code>max</code> avec le premier élément réel. Le débordement de tableau est la faille de sécurité n°1 en C — on y reviendra. Demain : les fonctions.</p>`
  }
};

    solution: "#include <stdio.h>                    // pour printf\n\nint main(void) {                     // point d'entree du programme\n    double prix[5] = {44.90, 29.50, 19.0, 12.5, 55.0};  // tableau de 5 prix\n    int n = sizeof(prix) / sizeof(prix[0]);  // nombre d'elements = 5\n    double somme = 0.0;              // accumulateur reel (demarre a 0.0)\n    for (int i = 0; i < n; i++) {    // parcourt les indices 0 a n-1\n        somme += prix[i];            // ajoute chaque prix a la somme\n    }                                // fin de la boucle\n    printf(\"Moyenne : %.2f euros\\n\", somme / n);  // somme reelle → division reelle ; %.2f = 2 dec.\n    return 0;                        // 0 = fin sans erreur\n}                                    // fin de main",
    note: "somme est un double, donc somme / n est une division réelle. sizeof évite de coder la taille en dur (moins d'erreurs si on change le tableau)." }
  ]
};
