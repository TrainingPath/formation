<script>
var DAY = {
  num: 6,
  title: "Boucles : while, do-while, for",
  subtitle: "Répéter sans se répéter : les trois boucles du C, et comment éviter la boucle infinie.",
  theory: `
<h3>1. while : tant que…</h3>
<p>Une <strong>boucle</strong> répète un bloc d'instructions plusieurs fois, sans avoir à le recopier. La boucle <code>while</code> (« tant que ») répète son corps <strong>tant que</strong> sa condition reste vraie. À chaque tour (on dit une <strong>itération</strong>), la condition est retestée avant de recommencer.</p>
<pre class="pseudo">int i = 1;               // i = "compteur" : on part de 1
while (i &lt;= 5) {          // TANT QUE i est inférieur ou égal à 5, répéter le bloc { }
    printf("%d ", i);     // afficher i suivi d'une espace
    i++;                  // AJOUTER 1 à i — sans ça, la boucle ne s'arrêterait jamais
}                         // fin du bloc ; à l'écran : 1 2 3 4 5</pre>
<div class="warn">Si la condition ne devient jamais fausse (ici, si on oublie <code>i++</code>), c'est une <strong>boucle infinie</strong> : le programme tourne sans fin et se fige. Assure-toi toujours que la boucle progresse vers sa sortie.</div>

<h3>2. for : la boucle compteur</h3>
<p>La boucle <code>for</code> regroupe sur une seule ligne trois éléments séparés par <code>;</code> : l'<strong>initialisation</strong> (préparer le compteur), la <strong>condition</strong> (quand continuer), et l'<strong>incrément</strong> (le « pas », comment faire évoluer le compteur). C'est la boucle la plus utilisée pour répéter un nombre connu de fois.</p>
<pre class="pseudo">for (int i = 0; i &lt; 5; i++) {   // (1) i=0 au départ ; (2) continuer tant que i&lt;5 ; (3) i++ après chaque tour
    printf("%d ", i);           // corps : afficher i → 0 1 2 3 4
}                               // fin de la boucle
//    (1)init    (2)test  (3)pas    // rappel de l'ordre des trois parties</pre>
<p>Ordre d'exécution : init une seule fois au début, puis à chaque tour : test → corps → pas → test… jusqu'à ce que le test devienne faux.</p>

<h3>3. do-while : au moins une fois</h3>
<p>Dans la boucle <code>do-while</code>, la condition est testée <strong>à la fin</strong> : le corps s'exécute donc <em>toujours au moins une fois</em>. Idéal pour un menu qu'on répète jusqu'à ce que l'utilisateur donne une saisie valide.</p>
<pre class="pseudo">int choix;                          // case entière pour le choix
do {                                // FAIRE (au moins une fois) :
    printf("Choix (1-3) ? ");       // afficher le menu / le prompt
    scanf("%d", &amp;choix);            // lire le choix (& = adresse)
} while (choix &lt; 1 || choix &gt; 3);   // TANT QUE le choix est hors de 1..3, recommencer</pre>

<h3>4. break et continue</h3>
<pre class="pseudo">for (int i = 1; i &lt;= 10; i++) {      // i de 1 à 10
    if (i == 5) break;               // si i vaut 5 : SORTIR complètement de la boucle
    if (i % 2 == 0) continue;        // si i est pair (reste 0) : PASSER au tour suivant sans afficher
    printf("%d ", i);                // sinon afficher i → à l'écran : 1 3
}                                    // fin de la boucle</pre>

<h3>5. Boucles imbriquées</h3>
<p>Des <strong>boucles imbriquées</strong> sont des boucles emboîtées l'une dans l'autre : la boucle intérieure refait tout son parcours à chaque tour de la boucle extérieure.</p>
<pre class="pseudo">for (int l = 1; l &lt;= 3; l++) {           // boucle EXTÉRIEURE : les lignes (l = 1, 2, 3)
    for (int c = 1; c &lt;= 3; c++) {       // boucle INTÉRIEURE : les colonnes (c = 1, 2, 3)
        printf("* ");                    // afficher une étoile + une espace
    }                                    // fin de la ligne courante
    printf("\\n");                        // aller à la ligne après chaque rangée
}                                        // résultat : un carré 3×3 d'étoiles</pre>
<div class="tip">Choisir sa boucle : <code>for</code> quand on connaît le nombre de tours, <code>while</code> quand on répète « tant qu'une condition tient », <code>do-while</code> quand il faut exécuter au moins une fois (menus, saisies).</div>`,
  exercises: [
    { type: "qcm", q: "Quelle boucle regroupe init, condition et incrément sur une ligne ?", opts: ["while", "for", "do-while", "repeat"], a: 1, exp: "for (init; test; pas)." },
    { type: "qcm", q: "Qu'est-ce qu'une boucle infinie ?", opts: ["Une boucle qui tourne très vite","Une boucle dont la condition ne devient jamais fausse","Une boucle sans instructions à l'intérieur","Une boucle refusée par le compilateur"], a: 1, exp: "Elle ne s'arrête jamais : souvent un oubli d'incrément." },
    { type: "qcm", q: "Quelle boucle exécute son corps au moins une fois ?", opts: ["while", "for", "do-while", "aucune"], a: 2, exp: "do-while teste la condition à la fin." },
    { type: "qcm", q: "Que fait <code>break</code> dans une boucle ?", opts: ["Passe directement au tour suivant","Sort complètement de la boucle","Redémarre la boucle au début","Met la condition à faux sans sortir"], a: 1, exp: "break interrompt la boucle." },
    { type: "qcm", q: "Que fait <code>continue</code> ?", opts: ["Sort de la boucle", "Passe directement au tour suivant", "Arrête le programme", "Double le compteur"], a: 1, exp: "continue saute le reste du corps et passe à l'itération suivante." },
    { type: "qcm", q: "Combien de fois s'exécute <code>for (int i = 0; i < 5; i++)</code> ?", opts: ["4", "5", "6", "Infini"], a: 1, exp: "i = 0,1,2,3,4 : 5 tours." },
    { type: "qcm", q: "Dans un for, quand s'exécute la partie « init » ?", opts: ["À chaque tour", "Une seule fois, au début", "À la fin", "Jamais"], a: 1, exp: "L'initialisation ne s'exécute qu'une fois." },
    { type: "qcm", q: "Qu'affiche <code>for (int i = 1; i <= 3; i++) printf(\"%d\", i);</code> ?", opts: ["123", "0123", "12", "1 2 3 "], a: 0, exp: "1, 2, 3 collés : 123." },
    { type: "qcm", q: "Quelle boucle pour répéter « tant que le stock > 0 » ?", opts: ["for figé", "while (stock > 0)", "do sans while", "switch"], a: 1, exp: "while teste une condition à chaque tour." },
    { type: "qcm", q: "Que manque-t-il pour éviter la boucle infinie dans <code>while (i <= 5) { printf(\"%d\", i); }</code> ?", opts: ["Ajouter un break après le premier tour","Faire progresser i (i++)","Un point-virgule après le while","Déclarer i en dehors de la boucle"], a: 1, exp: "Sans i++, i reste ≤ 5 pour toujours." },
    { type: "vf", q: "Un do-while peut ne jamais exécuter son corps.", a: false, exp: "Faux : le corps s'exécute toujours au moins une fois." },
    { type: "qcm", q: "Deux for l'un dans l'autre s'appellent…", opts: ["des boucles parallèles", "des boucles imbriquées", "une récursion", "un switch"], a: 1, exp: "Boucles imbriquées : utile pour les grilles/tables." },
    { type: "qcm", q: "Qu'affiche <code>for(i=1;i<=4;i++){ if(i==3) continue; printf(\"%d\",i);}</code> ?", opts: ["1234", "124", "123", "134"], a: 1, exp: "Le 3 est sauté par continue : 1,2,4." },
    { type: "qcm", q: "Qu'affiche <code>for(i=1;i<=4;i++){ if(i==3) break; printf(\"%d\",i);}</code> ?", opts: ["1234", "124", "12", "34"], a: 2, exp: "break arrête à i=3 : reste 1,2." },
    { type: "qcm", q: "Pour un menu répété jusqu'à saisie valide, quelle boucle ?", opts: ["for", "do-while", "while inversé", "aucune"], a: 1, exp: "do-while : afficher le menu au moins une fois puis redemander." }
  ],
  final: {
    title: "Exercice final — La somme des stocks",
    intro: `<p>On veut la somme de 1 à n. Corrige ce code qui boucle mal :</p>
<pre class="pseudo">int n = 5, somme = 0;              // n = borne ; somme = accumulateur (démarre à 0)
int i = 1;                        // compteur qui devrait aller de 1 à n
while (i <= n)                    // ERREUR : pas d'accolades → seule la ligne suivante est dans la boucle
    somme += i;                   // on ajoute i à somme… mais i ne change JAMAIS → boucle infinie
printf("Somme : %d\\n", somme);    // jamais atteint tant que la boucle tourne à l'infini</pre>`,
    questions: [
      { type: "qcm", q: "Quel est le problème principal ?", opts: ["somme mal initialisée", "i n'est jamais incrémenté : boucle infinie", "n vaut 5", "printf est faux"], a: 1, exp: "Sans i++, i reste 1 ≤ 5 pour toujours." },
      { type: "qcm", q: "Pourquoi les accolades sont-elles nécessaires ici ?", opts: ["Elles ne le sont pas", "Le corps a plusieurs instructions (somme += i; ET i++;)", "Pour la vitesse", "Pour printf"], a: 1, exp: "Sans { }, seule la première instruction est dans le while." },
      { type: "qcm", q: "Après correction, que vaut somme pour n = 5 ?", opts: ["10", "15", "25", "5"], a: 1, exp: "1+2+3+4+5 = 15." },
      { type: "qcm", q: "Comment écrire la même chose avec un for ?", opts: ["for (i = 1; i <= n; i++) somme += i;", "for (i = 1; i < n; i++) somme += i;", "for (somme = 1; ...)", "impossible"], a: 0, exp: "Le for regroupe init, test et pas — plus compact." },
      { type: "qcm", q: "Où déclarer i dans un for moderne ?", opts: ["Avant le for obligatoirement", "Directement dans le for : for (int i = 1; ...)", "Après la boucle", "Nulle part"], a: 1, exp: "Depuis C99, on peut déclarer i dans le for : sa portée se limite à la boucle." }
    ],
    solution: `<pre class="pseudo">#include &lt;stdio.h&gt;                    // pour printf
                                     // (ligne vide)
int main(void) {                     // point d'entrée du programme
    int n = 5, somme = 0;            // n = borne ; somme = accumulateur à 0
    for (int i = 1; i &lt;= n; i++) {   // i de 1 à n ; i++ garantit la progression
        somme += i;                  // ajouter i à somme à chaque tour
    }                                // fin de la boucle
    printf("Somme de 1 a %d : %d\\n", n, somme);  // affiche 15
    return 0;                        // 0 = fin sans erreur
}                                    // fin de main</pre>
<p>La clé : faire progresser le compteur vers la sortie. Le <code>for</code> rend cette progression impossible à oublier — c'est pourquoi on le préfère quand le nombre de tours est connu. Demain : les tableaux.</p>`
  }
};
