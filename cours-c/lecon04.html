<script>
var DAY = {
  num: 4,
  title: "Lire au clavier avec scanf",
  subtitle: "Rendre un programme interactif : lire un nombre saisi par l'utilisateur — et son fameux &.",
  theory: `
<h3>1. scanf : lire une valeur</h3>
<p>Jusqu'ici le programme parlait tout seul. Pour le rendre <strong>interactif</strong> (dialoguer avec l'utilisateur), on lit ce qu'il tape au clavier avec la fonction <code>scanf</code> (pour <em>scan formatted</em>, « lire en interprétant »). Comme <code>printf</code>, elle prend un <strong>spécificateur de format</strong> (<code>%d</code>, <code>%lf</code>…) ; mais surtout, elle a besoin de savoir <em>où</em> ranger la valeur lue. Pour cela on lui donne l'<strong>adresse</strong> de la variable — le « numéro de la case mémoire » — grâce à l'opérateur <strong><code>&amp;</code></strong> (« l'adresse de ») placé devant le nom.</p>
<pre class="pseudo">int age;                        // on crée une case entière vide nommée age
printf("Ton age ? ");           // on AFFICHE une question (le "prompt") ; pas de \\n pour rester sur la ligne
scanf("%d", &amp;age);              // %d = on attend un entier ; &amp;age = "range-le à l'adresse de age"
printf("Tu as %d ans\\n", age);  // on réutilise age, désormais rempli par la saisie</pre>
<div class="warn">Le <code>&amp;</code> devant la variable est <strong>obligatoire</strong> pour les types simples (int, double, char). L'oublier est l'erreur classique : le programme plantera ou écrira n'importe où en mémoire. (On comprendra pourquoi en leçon 10, avec les pointeurs.)</div>

<h3>2. Les bons spécificateurs pour scanf</h3>
<pre class="pseudo">int n;      scanf("%d", &amp;n);     // %d = lire un ENTIER dans n
double x;   scanf("%lf", &amp;x);    // %lf (L puis F) = lire un DOUBLE dans x — attention, PAS %f !
char c;     scanf(" %c", &amp;c);    // %c = lire UN caractère ; l'espace avant %c ignore les blancs qui traînent</pre>
<div class="warn">Piège fréquent : pour lire un <strong>double</strong>, scanf veut <code>%lf</code> (et non <code>%f</code>, qui est réservé au type float). Pour <em>afficher</em> un double, printf accepte <code>%f</code>. Deux fonctions, deux conventions.</div>

<h3>3. Lire plusieurs valeurs</h3>
<pre class="pseudo">int a, b;                       // deux entiers vides
printf("Deux entiers ? ");      // on invite à saisir
scanf("%d %d", &amp;a, &amp;b);         // deux %d, deux adresses ; l'utilisateur tape par ex. : 3 7
printf("Somme : %d\\n", a + b);  // on affiche a+b = 10</pre>

<h3>4. Vérifier que la lecture a réussi</h3>
<p><code>scanf</code> <strong>renvoie</strong> (rend comme résultat) le <strong>nombre de valeurs</strong> correctement lues. On peut tester ce nombre pour détecter une saisie invalide (l'utilisateur tape une lettre au lieu d'un nombre).</p>
<pre class="pseudo">int n;                              // case entière vide
if (scanf("%d", &amp;n) != 1) {         // si scanf n'a PAS lu exactement 1 valeur (!= 1 = "différent de 1")…
    printf("Saisie invalide.\\n");   // …on prévient l'utilisateur
    return 1;                       // return 1 = on quitte main avec un code d'ERREUR (non nul)
}                                   // fin du bloc if</pre>

<h3>5. Le rôle du prompt</h3>
<p>Un <strong>prompt</strong> est le petit message affiché <em>avant</em> le <code>scanf</code> pour indiquer à l'utilisateur ce qu'on attend de lui. Sans prompt, le programme semble « figé » alors qu'il attend simplement une saisie.</p>
<div class="tip">En C, l'entrée standard (ce qui arrive du clavier) fonctionne par « flux ». Les subtilités (buffer, caractères restants) se maîtrisent avec la pratique ; pour l'instant, retiens le trio : prompt → scanf avec &amp; → utilisation.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle fonction lit une valeur au clavier ?", opts: ["printf", "scanf", "readln", "input"], a: 1, exp: "scanf lit une saisie formatée." },
    { type: "qcm", q: "Que met-on devant le nom de la variable dans scanf (types simples) ?", opts: ["Rien", "&", "*", "@"], a: 1, exp: "& donne l'adresse où ranger la valeur." },
    { type: "qcm", q: "Comment lire un entier n ?", opts: ["scanf(\"%d\", n);", "scanf(\"%d\", &n);", "scanf(n);", "n = scanf(%d);"], a: 1, exp: "scanf(\"%d\", &n); — spécificateur + adresse." },
    { type: "qcm", q: "Quel spécificateur pour LIRE un double avec scanf ?", opts: ["%f", "%lf", "%d", "%g"], a: 1, exp: "%lf pour scanf (double) ; %f est pour float." },
    { type: "qcm", q: "Que renvoie scanf ?", opts: ["La valeur lue", "Le nombre de valeurs correctement lues", "Toujours 0", "Rien"], a: 1, exp: "On peut tester ce retour pour valider la saisie." },
    { type: "qcm", q: "Qu'arrive-t-il si on oublie le & dans <code>scanf(\"%d\", age)</code> ?", opts: ["Rien de grave", "Comportement indéfini : plantage probable ou écriture mémoire sauvage", "Ça affiche age", "Erreur toujours détectée à la compilation"], a: 1, exp: "scanf a besoin de l'adresse ; sans &, il reçoit une valeur prise pour une adresse." },
    { type: "qcm", q: "Comment lire deux entiers a et b d'un coup ?", opts: ["scanf(\"%d\", &a, &b);", "scanf(\"%d %d\", &a, &b);", "scanf(\"%d\"); scanf(\"%d\");", "scanf(a, b);"], a: 1, exp: "Un spécificateur par valeur, une adresse par valeur." },
    { type: "qcm", q: "Pourquoi afficher un message avant scanf ?", opts: ["C'est obligatoire", "Pour indiquer à l'utilisateur ce qu'on attend (le prompt)", "Pour accélérer", "Ça ne sert à rien"], a: 1, exp: "Sans prompt, le programme paraît figé." },
    { type: "qcm", q: "Pour AFFICHER un double, printf utilise…", opts: ["%lf obligatoire", "%f (ou %.2f)", "%d", "%s"], a: 1, exp: "printf accepte %f pour un double ; c'est scanf qui exige %lf." },
    { type: "qcm", q: "Comment ignorer les espaces avant de lire un char ?", opts: ["scanf(\"%c\", &c);", "scanf(\" %c\", &c);", "scanf(\"%s\", &c);", "impossible"], a: 1, exp: "L'espace avant %c saute les blancs (espaces, retours ligne)." },
    { type: "vf", q: "Pour lire un double, scanf attend le spécificateur %lf.", a: true, exp: "Oui : %lf pour scanf. C'est un piège très courant." },
    { type: "qcm", q: "<code>if (scanf(\"%d\", &n) != 1)</code> teste…", opts: ["Si n vaut 1", "Si la lecture d'un entier a échoué", "Si n est positif", "Rien d'utile"], a: 1, exp: "scanf renvoie 1 s'il a lu 1 valeur ; sinon la saisie est invalide." },
    { type: "qcm", q: "Le & est-il nécessaire pour lire un caractère avec %c ?", opts: ["Non", "Oui : scanf(\" %c\", &c);", "Seulement sous Windows", "Jamais"], a: 1, exp: "Comme pour int et double, un type simple se lit avec son adresse." },
    { type: "qcm", q: "Que fait <code>return 1;</code> dans main ?", opts: ["Renvoie 1 comme résultat de calcul", "Signale au système une fin en erreur", "Recommence main", "Rien"], a: 1, exp: "Un code de retour non nul signale un problème." },
    { type: "qcm", q: "L'ordre logique d'une interaction est…", opts: ["scanf puis printf du prompt", "prompt (printf) → scanf avec & → utilisation", "scanf seul suffit", "printf seul suffit"], a: 1, exp: "On invite, on lit, on utilise." }
  ],
  final: {
    title: "Exercice final — La caisse de la ludothèque",
    intro: `<p>On veut lire un nombre de jours et un prix par jour, puis afficher le total. Corrige :</p>
<pre class="pseudo">int jours;                             // case entière
double prix;                           // case réelle
printf("Jours ? ");                    // prompt : on demande le nombre de jours
scanf("%d", jours);                    // ERREUR : il manque le & → doit être &jours
printf("Prix/jour ? ");                // prompt : on demande le prix par jour
scanf("%f", &prix);                    // ERREUR : lire un double veut %lf, pas %f
printf("Total : %.2f\\n", jours * prix);  // affiche le total (int × double = double)</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — <code>scanf(\"%d\", jours)</code> :", opts: ["Correct", "Il manque le & : scanf(\"%d\", &jours)", "Il faut %f", "jours est réservé"], a: 1, exp: "scanf a besoin de l'adresse : &jours." },
      { type: "qcm", q: "Erreur n°2 — <code>scanf(\"%f\", &prix)</code> avec prix double :", opts: ["Correct", "Pour lire un double, c'est %lf", "Il faut %d", "Il faut enlever le &"], a: 1, exp: "scanf lit un double avec %lf, pas %f." },
      { type: "qcm", q: "La ligne <code>jours * prix</code> (int × double) donne un…", opts: ["int", "double (int converti automatiquement)", "char", "erreur"], a: 1, exp: "int × double → double : conversion implicite, pas de piège ici." },
      { type: "qcm", q: "Le <code>%.2f</code> du printf final est-il correct pour un double ?", opts: ["Non, il faut %.2lf", "Oui : printf affiche un double avec %f", "Non, il faut %d", "Non, il faut %e"], a: 1, exp: "printf accepte %f/%.2f pour un double." },
      { type: "qcm", q: "Bonne pratique en plus des corrections :", opts: ["Supprimer les prompts", "Tester le retour de scanf pour valider les saisies", "Enlever return 0", "Mettre tout sur une ligne"], a: 1, exp: "Vérifier scanf(...)==... rend le programme robuste." }
    ],
    solution: `<pre class="pseudo">#include &lt;stdio.h&gt;                        // pour printf et scanf
                                         // (ligne vide)
int main(void) {                         // point d'entrée du programme
    int jours;                           // case entière pour le nombre de jours
    double prix;                         // case réelle pour le prix par jour
    printf("Jours ? ");                  // prompt
    if (scanf("%d", &amp;jours) != 1) return 1;   // & ajouté ; si pas 1 valeur lue, on quitte en erreur
    printf("Prix/jour ? ");              // prompt
    if (scanf("%lf", &amp;prix) != 1) return 1;   // %lf pour lire un double ; test de la saisie
    printf("Total : %.2f euros\\n", jours * prix);  // int × double = double ; %.2f = 2 décimales
    return 0;                            // 0 = fin sans erreur
}                                        // fin de main</pre>
<p>Trois points clés : le <code>&amp;</code> devant chaque variable, <code>%lf</code> pour lire un double, et un test du retour de scanf. Le <code>&amp;</code> est ta première rencontre avec les <em>adresses</em> — le cœur du C, qu'on approfondira avec les pointeurs. Demain : les conditions.</p>`
  }
};
</script>

var ECRITURE = {
  placeholder: "Écris ton code C ici…",
  items: [
  { id: "c-l04", title: "Convertir un prix", level: 2,
    statement: "Écris un programme qui demande un prix en euros (un double) et un nombre d'exemplaires (un int), puis affiche le prix total. Pense au prompt, au & et au bon spécificateur de lecture pour le double.",
    hints: [
      "double prix; int n; — déclare-les d'abord.",
      "Lecture : scanf(\"%lf\", &prix); puis scanf(\"%d\", &n);",
      "Total = prix * n, affiché avec %.2f."
    ],
    solution: "#include <stdio.h>                    // pour printf et scanf\n\nint main(void) {                     // point d'entree du programme\n    double prix;                     // case reelle pour le prix unitaire\n    int n;                           // case entiere pour le nombre d'exemplaires\n    printf(\"Prix unitaire (euros) ? \");  // prompt : on demande le prix\n    if (scanf(\"%lf\", &prix) != 1) return 1;  // %lf lit un double ; test de la saisie\n    printf(\"Combien d'exemplaires ? \");  // prompt : on demande la quantite\n    if (scanf(\"%d\", &n) != 1) return 1;  // %d lit un entier ; test de la saisie\n    printf(\"Total : %.2f euros\\n\", prix * n);  // prix * n = double ; %.2f = 2 decimales\n    return 0;                        // 0 = fin sans erreur\n}                                    // fin de main",
    note: "%lf pour lire le double, %d pour l'entier, & partout. Le test de retour de scanf protège contre une saisie non numérique." }
  ]
};
