<script>
var DAY = {
  num: 2,
  title: "Variables et types",
  subtitle: "En C, chaque variable a un type fixe, déclaré à l'avance. Le compilateur y veille.",
  theory: `
<h3>1. Déclarer une variable</h3>
<p>Une <strong>variable</strong> est une <strong>case en mémoire</strong> (la mémoire est l'espace de travail temporaire de l'ordinateur) à laquelle on donne un <strong>nom</strong> pour y ranger une valeur et la retrouver plus tard. Image : une boîte étiquetée dans laquelle on pose quelque chose. Le <strong>type</strong> d'une variable dit quelle <em>sorte</em> de valeur la boîte peut contenir (un entier, un nombre à virgule, un caractère…) et donc quelle taille elle occupe. En C, on <strong>déclare</strong> une variable (on la crée) en écrivant son <strong>type</strong> puis son <strong>nom</strong>. Le type est obligatoire et ne change plus jamais : c'est le <strong>typage statique</strong>.</p>
<pre class="pseudo">int age = 25;          // int = type ENTIER ; age = nom de la variable ; = 25 range la valeur 25 dedans
double prix = 44.90;   // double = nombre À VIRGULE (double précision) ; prix reçoit 44.90
char lettre = 'A';     // char = UN seul caractère ; entre apostrophes simples '...'
int stock;             // déclarée SANS valeur : la case existe mais son contenu est indéterminé !</pre>
<div class="warn">Une variable non initialisée (à laquelle on n'a pas donné de valeur) ne vaut pas 0 : elle contient une valeur <strong>indéterminée</strong> (ce qui traînait déjà dans cette case mémoire). Initialise toujours tes variables.</div>

<h3>2. Les types de base</h3>
<p>Un <strong>octet</strong> est la plus petite unité de mémoire pratique (8 bits, soit 8 chiffres 0/1). Chaque type occupe un certain nombre d'octets. Voici les types de base du C :</p>
<pre class="pseudo">int      // entier (nombre sans virgule)      ex. -3, 0, 42
double   // réel double précision (à virgule) ex. 3.14, 44.90   (le préféré pour les calculs)
float    // réel simple précision             ex. 3.14f          (moins précis, moins utilisé)
char     // un seul caractère                 ex. 'A', '9', '\\n' (en réalité un petit entier : le code du caractère)
_Bool    // booléen : vrai/faux (0 ou 1)      // avec #include &lt;stdbool.h&gt; on écrit bool, true, false</pre>
<p>Il n'y a <strong>pas de type chaîne natif</strong> en C : un texte (une suite de caractères) est un <strong>tableau de <code>char</code></strong>, notion vue en leçon 9. Retiens la différence : un <code>char</code> se met entre <strong>apostrophes simples</strong> (<code>'A'</code>, un seul caractère) ; un texte se met entre <strong>guillemets doubles</strong> (<code>"Salut"</code>, une chaîne).</p>

<h3>3. Afficher une variable : les spécificateurs de format</h3>
<p><code>printf</code> ne devine pas le type de ce qu'on lui donne : on place un <strong>marqueur</strong> (un « spécificateur de format », toujours commençant par <code>%</code>) à l'endroit voulu dans le texte, puis on fournit la variable après la virgule. <code>printf</code> remplace le marqueur par la valeur.</p>
<pre class="pseudo">int age = 25;                                  // un entier
double prix = 44.90;                           // un réel
char c = 'A';                                  // un caractère
printf("age = %d\\n", age);                     // %d = trou pour un ENTIER ; il est rempli par age → "age = 25"
printf("prix = %.2f\\n", prix);                 // %f = trou pour un RÉEL ; .2 = garder 2 décimales → "prix = 44.90"
printf("lettre = %c\\n", c);                    // %c = trou pour un CARACTÈRE → "lettre = A"
printf("%d ans, %.2f euros\\n", age, prix);     // plusieurs trous d'affilée, remplis dans l'ordre par age puis prix</pre>
<div class="warn">Un mauvais spécificateur (ex. <code>%d</code> pour un double) donne un résultat faux, pas forcément une erreur. Retiens : <code>%d</code> entier, <code>%f</code> réel, <code>%c</code> caractère, <code>%s</code> chaîne.</div>

<h3>4. Constantes et taille mémoire</h3>
<pre class="pseudo">const double TVA = 0.20;                        // const = valeur qui ne changera JAMAIS après ; TVA vaut 0.20 pour toujours
printf("%zu octets\\n", sizeof(int));           // sizeof(int) = taille d'un int en octets ; %zu = spécificateur pour cette taille</pre>
<p><code>const</code> (pour « constant ») protège une valeur contre toute modification : si tu essaies de la changer plus loin, le compilateur refuse. <code>sizeof</code> est un opérateur qui renvoie la <strong>taille en octets</strong> qu'un type occupe en mémoire (souvent 4 octets pour un <code>int</code>) — une notion très concrète en C. Le <code>%zu</code> est le spécificateur adapté au résultat de <code>sizeof</code>.</p>

<h3>5. Nommage</h3>
<p>Un nom de variable (un <strong>identificateur</strong>) commence par une lettre ou <code>_</code>, sans espace ni accent, et la <strong>casse</strong> (majuscules/minuscules) compte : <code>stock</code> ≠ <code>Stock</code>. Convention courante : <code>snake_case</code> (mots séparés par des <code>_</code>) ou <code>camelCase</code> (majuscule à chaque nouveau mot), avec des noms parlants (<code>prix_location</code> plutôt que <code>p</code>).</p>
<div class="tip">Une déclaration groupée est possible : <code>int a = 1, b = 2, c = 3;</code> — même type <code>int</code>, plusieurs variables séparées par des virgules.</div>`,
  exercises: [
    { type: "qcm", q: "Comment déclare-t-on un entier nommé age valant 30 ?", opts: ["age = 30", "int age = 30;", "var age = 30;", "integer age := 30"], a: 1, exp: "type nom = valeur ; — le type est obligatoire." },
    { type: "qcm", q: "Quel type pour un prix comme 44.90 ?", opts: ["int", "double", "char", "bool"], a: 1, exp: "double : un réel en double précision, idéal pour les calculs." },
    { type: "qcm", q: "Comment écrit-on le caractère A ?", opts: ["\"A\"", "'A'", "A", "char(A)"], a: 1, exp: "Un char va entre apostrophes simples ; les guillemets doubles sont pour les chaînes." },
    { type: "qcm", q: "Quel spécificateur affiche un entier avec printf ?", opts: ["%f", "%d", "%c", "%s"], a: 1, exp: "%d pour un int (decimal)." },
    { type: "qcm", q: "Que fait <code>%.2f</code> ?", opts: ["Affiche un entier", "Affiche un réel avec 2 décimales", "Affiche 2 caractères", "Rien"], a: 1, exp: ".2 fixe le nombre de décimales du réel." },
    { type: "qcm", q: "Que vaut une variable <code>int x;</code> non initialisée ?", opts: ["0 automatiquement","Une valeur indéterminée","La dernière valeur écrite à cet emplacement","Une erreur signalée à la compilation"], a: 1, exp: "En C, le contenu est indéterminé : initialise toujours." },
    { type: "qcm", q: "À quoi sert le mot-clé <code>const</code> ?", opts: ["À accélérer le programme","À rendre une valeur non modifiable","À réserver de la mémoire dynamique","À convertir un type en un autre"], a: 1, exp: "const empêche toute modification ultérieure." },
    { type: "qcm", q: "Le C possède-t-il un type chaîne de caractères natif ?", opts: ["Oui, le type string", "Non : une chaîne est un tableau de char", "Oui, le type text", "Non, il n'y a pas de texte"], a: 1, exp: "Pas de string natif ; on utilise char[] (leçon 9)." },
    { type: "qcm", q: "Que renvoie <code>sizeof(int)</code> ?", opts: ["La valeur de l'entier","Sa taille en octets (souvent 4)","Le nombre de bits, soit 32","La valeur maximale d'un int"], a: 1, exp: "sizeof donne la taille mémoire du type." },
    { type: "qcm", q: "Quel spécificateur pour un char ?", opts: ["%d", "%c", "%f", "%char"], a: 1, exp: "%c affiche un caractère." },
    { type: "vf", q: "En C, une variable peut changer de type au cours du programme.", a: false, exp: "Non : typage statique, le type est fixé à la déclaration." },
    { type: "qcm", q: "<code>double prix = 5;</code> — que vaut prix ?", opts: ["5 (entier)", "5.0 (converti en double)", "Une erreur", "'5'"], a: 1, exp: "L'entier 5 est converti dans le type de la variable, double." },
    { type: "qcm", q: "Que se passe-t-il avec <code>printf(\"%d\", 3.14)</code> ?", opts: ["Affiche 3", "Résultat incorrect : mauvais spécificateur pour un double", "Affiche 3.14", "Erreur de compilation garantie"], a: 1, exp: "%d attend un int : afficher un double avec %d donne un résultat faux." },
    { type: "qcm", q: "Quel nom de variable est valide ?", opts: ["2prix", "prix location", "prix_location", "prix-location"], a: 2, exp: "Pas de chiffre en tête, pas d'espace, pas de tiret : _ est autorisé." },
    { type: "qcm", q: "Comment inclure le type booléen bool, true, false ?", opts: ["Il est natif", "#include <stdbool.h>", "#include <bool.h>", "using bool;"], a: 1, exp: "stdbool.h fournit bool, true et false (sinon on utilise int 0/1)." }
  ],
  final: {
    title: "Exercice final — La fiche d'un jeu",
    intro: `<p>On décrit un jeu de société avec les bons types. Repère les erreurs :</p>
<pre class="pseudo">int nom = "Catan";                     // ERREUR : "Catan" est un TEXTE, il ne rentre pas dans un int (entier)
double prix = 44.90;                   // correct : un prix à virgule dans un double
char dispo = 'oui';                    // ERREUR : un char = UN seul caractère, or 'oui' en contient trois
printf("Prix : %d euros\\n", prix);     // ERREUR : %d attend un entier, mais prix est un double → il faut %f</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — <code>int nom = \"Catan\"</code> :", opts: ["Correct", "Un nom est du texte : pas un int (ce sera char nom[] plus tard)", "Il faut double", "Il faut des apostrophes"], a: 1, exp: "Un texte ne rentre pas dans un int." },
      { type: "qcm", q: "Erreur n°2 — <code>char dispo = 'oui'</code> :", opts: ["Correct", "Un char ne contient qu'UN caractère : 'oui' en a trois", "Il faut des guillemets doubles pour un char", "dispo est réservé"], a: 1, exp: "Un char = un seul caractère. Pour un oui/non, un bool ou un int 0/1 convient." },
      { type: "qcm", q: "Erreur n°3 — <code>printf(\"%d\", prix)</code> avec prix double :", opts: ["Correct", "Mauvais spécificateur : pour un double c'est %f", "Il faut %c", "Il faut %s"], a: 1, exp: "%f (souvent %.2f) affiche un double correctement." },
      { type: "qcm", q: "Quel type conviendrait pour prix ?", opts: ["int", "double", "char", "bool"], a: 1, exp: "double : un prix a des décimales." },
      { type: "qcm", q: "Quel type conviendrait pour le stock (un nombre entier de jeux) ?", opts: ["double", "int", "char", "float"], a: 1, exp: "int : un stock est un entier." }
    ],
    solution: `<pre class="pseudo">#include &lt;stdio.h&gt;                      // pour printf (afficher)
#include &lt;stdbool.h&gt;                   // pour le type bool, true, false
                                       // (ligne vide)
int main(void) {                       // point d'entrée du programme
    // le nom sera vu en leçon 9 (char nom[] = "Catan";)   // commentaire : on n'a pas encore les chaînes
    double prix = 44.90;               // prix à virgule → double
    int stock = 3;                     // stock = nombre entier de jeux → int
    bool disponible = stock &gt; 0;       // disponible = vrai si stock &gt; 0, faux sinon (un booléen)
    printf("Prix : %.2f euros | stock : %d | dispo : %d\\n", prix, stock, disponible);  // %.2f réel 2 déc., %d entiers
    return 0;                          // 0 = fin sans erreur
}                                      // fin de main</pre>
<p>Chaque donnée a son type juste : réel pour le prix, entier pour le stock, booléen pour la disponibilité, et le bon spécificateur pour chacun. Demain : les opérateurs et les conversions.</p>`
  }
};
</script>

  { id: "c-l02", title: "La carte d'identité d'un jeu", level: 1,
    statement: "Dans un main complet, déclare les variables d'un jeu : son prix d'achat (double, 44.90), son prix de location par jour (double, 5.0), son stock (int, 3) et une constante TVA (const double, 0.20). Affiche le tout avec les bons spécificateurs, les prix à 2 décimales.",

    ],
    solution: "#include <stdio.h>                        // pour printf (afficher)\n\nint main(void) {                         // point d'entree du programme\n    double prix_achat = 44.90;           // prix d'achat a virgule → double\n    double prix_location = 5.0;          // prix de location par jour → double\n    int stock = 3;                       // stock = entier → int\n    const double TVA = 0.20;             // const = la TVA ne changera jamais\n    printf(\"Achat : %.2f euros\\n\", prix_achat);       // %.2f = reel a 2 decimales\n    printf(\"Location/jour : %.2f euros\\n\", prix_location);  // idem pour la location\n    printf(\"Stock : %d\\n\", stock);       // %d = entier\n    printf(\"TVA : %.0f%%\\n\", TVA * 100); // TVA*100 = 20 ; %.0f = 0 decimale ; %% affiche un vrai signe %\n    return 0;                            // 0 = fin sans erreur\n}                                        // fin de main",
