<script>
var DAY = {
  num: 20,
  title: "Projet guidé : le gestionnaire de tâches",
  subtitle: "Assembler tout le cours : structures, tableau, fonctions, menu et fichier — un vrai programme.",
  theory: `
<h3>1. Le cahier des charges</h3>
<p>On construit un <strong>gestionnaire de tâches</strong> en console (une application qui fonctionne au clavier, sans fenêtres) : ajouter une tâche, les lister, en marquer une comme faite, et sauvegarder dans un fichier. Toutes les notions du cours s'y retrouvent : structures, tableaux, fonctions, boucles, fichiers.</p>

<h3>2. La structure de données</h3>
<pre class="pseudo">#include &lt;stdio.h&gt;          // pour printf, scanf, les fichiers
#include &lt;string.h&gt;         // pour strcpy
                           // (ligne vide)
#define MAX 100            // constante de préprocesseur : capacité maximale (100 tâches)
                           // (ligne vide)
typedef struct {           // on définit un type Tache (typedef pour l'écrire sans « struct »)
    char titre[80];         // champ titre : le texte de la tâche (chaîne)
    int faite;              // champ faite : 0 = à faire, 1 = faite (un booléen)
} Tache;                   // nom de l'alias
                           // (ligne vide)
Tache taches[MAX];         // tableau global de MAX tâches
int nb = 0;                // nombre de tâches réellement présentes (démarre à 0)</pre>

<h3>3. Les fonctions du métier</h3>
<pre class="pseudo">void ajouter(const char *titre) {    // titre = texte reçu (const = lecture seule)
    if (nb &gt;= MAX) return;            // sécurité : si le tableau est plein, ne rien faire
    strcpy(taches[nb].titre, titre);  // copier le titre dans la case n°nb
    taches[nb].faite = 0;             // nouvelle tâche : pas encore faite
    nb++;                             // une tâche de plus
}                                    // fin de ajouter
                                    // (ligne vide)
void lister(void) {                  // affiche toutes les tâches ; ne prend rien, ne renvoie rien
    for (int i = 0; i &lt; nb; i++) {   // parcourt les tâches existantes (0 à nb-1)
        printf("%d. [%c] %s\\n", i + 1,          // numéro affiché à partir de 1
               taches[i].faite ? 'X' : ' ',      // ternaire : 'X' si faite, espace sinon
               taches[i].titre);                 // le titre de la tâche
    }                                // fin de la boucle
}                                    // fin de lister
                                    // (ligne vide)
void terminer(int index) {           // index = numéro AFFICHÉ (de 1 à nb)
    if (index &gt;= 1 &amp;&amp; index &lt;= nb)   // vérifier que le numéro est valide
        taches[index - 1].faite = 1;  // index-1 : convertir numéro affiché → indice du tableau ; marquer faite
}                                    // fin de terminer</pre>

<h3>4. La boucle de menu</h3>
<pre class="pseudo">int main(void) {                                       // point d'entrée du programme
    int choix;                                         // choix de l'utilisateur
    do {                                               // FAIRE (au moins une fois) :
        printf("\\n1) Ajouter  2) Lister  3) Terminer  0) Quitter : ");  // afficher le menu
        if (scanf("%d", &amp;choix) != 1) break;           // lire le choix ; saisie invalide → sortir
                                                       // (ligne vide)
        if (choix == 1) {                              // option Ajouter
            char t[80];                                // tampon pour le titre
            scanf(" %79[^\\n]", t);                     // lire une ligne entière (avec espaces), bornée à 79
            ajouter(t);                                // ajouter la tâche
        } else if (choix == 2) {                       // option Lister
            lister();                                  // afficher toutes les tâches
        } else if (choix == 3) {                       // option Terminer
            int n;                                     // numéro de la tâche à terminer
            scanf("%d", &amp;n);                           // lire ce numéro
            terminer(n);                               // la marquer faite
        }                                              // fin des options
    } while (choix != 0);                              // TANT QUE le choix n'est pas 0 (Quitter)
    return 0;                                          // 0 = fin sans erreur
}                                                      // fin de main</pre>

<h3>5. La persistance dans un fichier</h3>
<pre class="pseudo">void sauver(const char *fichier) {                    // fichier = nom du fichier de sauvegarde
    FILE *f = fopen(fichier, "w");                     // ouvrir en écriture ("w")
    if (f == NULL) return;                             // si échec d'ouverture, abandonner
    for (int i = 0; i &lt; nb; i++)                       // parcourir les tâches
        fprintf(f, "%d;%s\\n", taches[i].faite, taches[i].titre);  // écrire "faite;titre" par ligne
    fclose(f);                                         // fermer le fichier
}                                                      // fin de sauver</pre>
<div class="tip">Chaque brique fait une seule chose et porte un nom clair : <code>ajouter</code>, <code>lister</code>, <code>terminer</code>, <code>sauver</code>. Ce découpage — données groupées en <code>struct</code>, opérations en fonctions, boucle de menu, sauvegarde fichier — est le squelette de presque toutes les petites applications C. Prochaine étape naturelle : découper ce projet en <code>.h</code>/<code>.c</code> (leçon 15) et remplacer le tableau fixe par de l'allocation dynamique (leçon 12).</div>`,
  exercises: [
    { type: "qcm", q: "Quelle structure regroupe le titre et l'état d'une tâche ?", opts: ["un enum de deux valeurs","une struct (typedef Tache)","une union de champs superposés","un simple tableau d'entiers"], a: 1, exp: "struct : des champs de types différents décrivant une tâche." },
    { type: "qcm", q: "À quoi sert <code>#define MAX 100</code> ?", opts: ["À allouer 100 octets", "À fixer la capacité du tableau de tâches (constante)", "À afficher 100", "À rien"], a: 1, exp: "Une constante de préprocesseur pour la taille." },
    { type: "qcm", q: "Pourquoi tester <code>if (nb >= MAX) return;</code> dans ajouter ?", opts: ["Par style", "Pour ne pas déborder le tableau taches", "Pour aller plus vite", "Inutile"], a: 1, exp: "Sécurité : rester dans les bornes du tableau." },
    { type: "qcm", q: "Comment copie-t-on le titre dans la structure ?", opts: ["taches[nb].titre = titre;", "strcpy(taches[nb].titre, titre);", "titre = taches[nb];", "copy(titre)"], a: 1, exp: "Un tableau char se remplit avec strcpy, pas avec =." },
    { type: "qcm", q: "Le champ <code>faite</code> vaut 0 ou 1 : il représente…", opts: ["le prix", "un booléen (à faire / faite)", "l'index", "une erreur"], a: 1, exp: "0 = à faire, 1 = faite." },
    { type: "qcm", q: "Quelle boucle convient pour un menu répété jusqu'à « Quitter » ?", opts: ["for", "do-while", "while sans corps", "aucune"], a: 1, exp: "do-while : afficher le menu au moins une fois." },
    { type: "qcm", q: "Pourquoi <code>index - 1</code> dans terminer ?", opts: ["Erreur", "L'affichage compte de 1, le tableau de 0 : on convertit", "Pour aller plus vite", "Sans raison"], a: 1, exp: "Décalage entre numéro affiché (1..nb) et indice (0..nb-1)." },
    { type: "qcm", q: "Que fait <code>taches[i].faite ? 'X' : ' '</code> ?", opts: ["Une boucle", "Affiche 'X' si faite, un espace sinon (ternaire)", "Une erreur", "Compare"], a: 1, exp: "L'opérateur ternaire choisit le caractère d'état." },
    { type: "qcm", q: "Pourquoi <code>scanf(\" %79[^\\n]\", t)</code> pour lire un titre ?", opts: ["Pour un seul mot", "Pour lire une ligne avec espaces, en bornant la taille", "Pour un nombre", "Pour un char"], a: 1, exp: "%[^\\n] lit jusqu'au saut de ligne ; 79 borne la saisie." },
    { type: "qcm", q: "Comment sauver les tâches dans un fichier ?", opts: ["printf", "fopen en \"w\" puis fprintf pour chaque tâche, puis fclose", "malloc", "strcpy"], a: 1, exp: "Écriture ligne par ligne dans un fichier." },
    { type: "vf", q: "Découper le programme en petites fonctions nommées le rend plus lisible et testable.", a: true, exp: "Oui : une responsabilité par fonction." },
    { type: "qcm", q: "Que faut-il vérifier après <code>fopen(fichier, \"w\")</code> ?", opts: ["Rien", "Que le retour n'est pas NULL", "La taille", "La vitesse"], a: 1, exp: "fopen peut échouer." },
    { type: "qcm", q: "Quelle amélioration permettrait un nombre illimité de tâches ?", opts: ["Un plus grand #define", "L'allocation dynamique (malloc/realloc) au lieu d'un tableau fixe", "Un enum", "Un union"], a: 1, exp: "malloc/realloc pour une capacité extensible." },
    { type: "qcm", q: "Comment organiser ce projet quand il grossit ?", opts: ["Tout dans main", "Le découper en fichiers .h/.c", "Le mettre dans un seul printf", "Supprimer les fonctions"], a: 1, exp: "Compilation séparée : déclarations en .h, définitions en .c." },
    { type: "qcm", q: "Ce projet mobilise notamment…", opts: ["uniquement printf", "struct, tableau, fonctions, boucle de menu et fichiers", "seulement des pointeurs", "aucune notion du cours"], a: 1, exp: "C'est une synthèse de tout le cours." }
  ],
  final: {
    title: "Exercice final — Compléter le gestionnaire",
    intro: `<p>Voici la fonction <code>lister</code> avec des erreurs. Corrige :</p>
<pre class="pseudo">void lister() {                        // (mieux : void lister(void) pour dire « aucun paramètre »)
    for (int i = 0; i <= nb; i++) {     // ERREUR : i <= nb atteint taches[nb], hors des tâches remplies
        printf("%d. %s\\n", i, taches[i].titre);  // numéro peu lisible (i part de 0) et l'état n'est pas montré
    }                                  // fin de la boucle
}                                      // fin de lister</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — <code>i <= nb</code> :", opts: ["Correct", "Débordement : il faut i < nb (indices 0 à nb-1)", "Il faut i <= nb-1 avec i++", "Rien"], a: 1, exp: "taches[nb] est hors des éléments remplis." },
      { type: "qcm", q: "Erreur n°2 — le numéro affiché <code>%d ... i</code> :", opts: ["Correct", "Mieux vaut i + 1 pour numéroter à partir de 1 (lisibilité utilisateur)", "Il faut i - 1", "Sans importance"], a: 1, exp: "L'utilisateur préfère 1..nb ; le tableau reste en 0..nb-1." },
      { type: "qcm", q: "Comment afficher l'état (faite ou non) ?", opts: ["Impossible", "Avec un ternaire : taches[i].faite ? 'X' : ' '", "Avec malloc", "Avec un enum obligatoire"], a: 1, exp: "Le ternaire choisit le caractère d'état." },
      { type: "qcm", q: "La signature <code>void lister()</code> devrait idéalement s'écrire…", opts: ["void lister()", "void lister(void)", "int lister()", "lister(void)"], a: 1, exp: "En C, (void) précise explicitement « aucun paramètre »." },
      { type: "qcm", q: "Pourquoi préférer beaucoup de petites fonctions ?", opts: ["Pour faire long", "Lisibilité, réutilisation et test de chaque brique", "Pour ralentir", "Aucune raison"], a: 1, exp: "Une responsabilité par fonction : code maintenable." }
    ],
    solution: `<pre class="pseudo">void lister(void) {                            // (void) = aucun paramètre
    for (int i = 0; i &lt; nb; i++) {             // i &lt; nb : on reste dans les bornes
        printf("%d. [%c] %s\\n",
               i + 1,                          // numéro lisible (1..nb)
               taches[i].faite ? 'X' : ' ',    // état via ternaire ('X' ou espace)
               taches[i].titre);               // le titre de la tâche
    }                                          // fin de la boucle
}                                              // fin de lister</pre>
<p>Tu viens d'assembler un vrai programme : données en <code>struct</code>, logique en fonctions, interaction par menu, persistance en fichier. C'est le modèle de la Ludothèque et de tout projet C. Demain : l'examen final pour tout valider.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code C ici…",
  items: [
  { id: "c-l20", title: "La fonction ajouter", level: 3,
    statement: "Écris la fonction <code>int ajouter(Tache taches[], int *nb, const char *titre)</code> qui ajoute une tâche (titre copié, faite = 0) si la capacité MAX n'est pas atteinte, incrémente le compteur via son pointeur, et renvoie 1 en cas de succès, 0 si le tableau est plein. On suppose le type Tache et MAX déjà définis.",
    hints: [
      "Vérifie d'abord : if (*nb >= MAX) return 0;",
      "strcpy(taches[*nb].titre, titre); taches[*nb].faite = 0;",
      "Incrémente le compteur pointé : (*nb)++; puis return 1;"
    ],
    solution: "#include <string.h>                   // pour strcpy\n#define MAX 100                      // capacite maximale du tableau\n\ntypedef struct {                     // type Tache\n    char titre[80];                  // champ titre (chaine)\n    int faite;                       // champ faite (0 = a faire, 1 = faite)\n} Tache;                             // nom de l'alias\n\nint ajouter(Tache taches[], int *nb, const char *titre) {  // taches = tableau ; nb = pointeur vers le compteur ; titre = texte\n    if (*nb >= MAX)                  // *nb = valeur du compteur ; si le tableau est plein...\n        return 0;                    // ...echec : on renvoie 0\n    strcpy(taches[*nb].titre, titre);   // copier le titre dans la case *nb\n    taches[*nb].faite = 0;           // nouvelle tache : pas encore faite\n    (*nb)++;                         // incremente le compteur de l'appelant (parentheses importantes)\n    return 1;                        // succes\n}                                    // fin de la fonction",
    atoi: {"cmd":"gcc -Wall -c taches.c -o taches.o","expected":"Compile sans avertissement ; appelée depuis un main, ajouter renvoie 1 et incrémente *nb tant que *nb < MAX, sinon renvoie 0."},
    checklist: ["La capacité est vérifiée en premier : if (*nb >= MAX) return 0;.","strcpy copie le titre dans taches[*nb].titre.","faite est initialisé à 0 pour la nouvelle tâche.","(*nb)++ incrémente le compteur de l'appelant (parenthèses !)."],
    note: "nb est passé par pointeur pour que l'incrément soit visible dans l'appelant. On protège la capacité (MAX) et on renvoie un code de succès : une fonction robuste et réutilisable. Les parenthèses de (*nb)++ sont importantes." }
  ]
};
