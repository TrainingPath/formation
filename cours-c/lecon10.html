<script>
var DAY = {
  num: 10,
  title: "Les pointeurs",
  subtitle: "Le cœur du C : une variable qui contient l'adresse d'une autre. & pour l'adresse, * pour le contenu.",
  theory: `
<h3>1. Adresse et pointeur</h3>
<p>La <strong>mémoire</strong> de l'ordinateur est une longue suite de cases numérotées. Chaque variable occupe une <strong>case</strong> repérée par un numéro : son <strong>adresse</strong> (comme un numéro de rue). L'opérateur <code>&amp;</code> (« adresse de ») donne l'adresse d'une variable. Un <strong>pointeur</strong> est une variable un peu spéciale : au lieu de contenir un nombre, elle <strong>contient une adresse</strong> — elle « pointe vers » une autre variable.</p>
<pre class="pseudo">int age = 25;         // une variable entière normale : la case "age" contient 25
int *p = &amp;age;        // p est un POINTEUR vers int ; il reçoit &amp;age = l'adresse de age
//  ^ le * dans la déclaration se lit « pointeur vers int »  // p ne contient PAS 25, mais l'adresse de age</pre>

<h3>2. Déréférencer avec *</h3>
<p><strong>Déréférencer</strong> un pointeur, c'est aller voir la valeur rangée à l'adresse qu'il contient. On utilise l'opérateur <code>*</code> devant le pointeur.</p>
<pre class="pseudo">int age = 25;          // la variable
int *p = &amp;age;         // p pointe vers age
printf("%d\\n", *p);    // *p = « la valeur À l'adresse contenue dans p » → 25
*p = 30;               // on ÉCRIT 30 à cette adresse → on modifie age À TRAVERS le pointeur
printf("%d\\n", age);   // age vaut maintenant 30 !</pre>
<div class="warn">Le <code>*</code> a deux emplois : à la <strong>déclaration</strong> (<code>int *p</code>) il annonce un pointeur ; à l'<strong>utilisation</strong> (<code>*p</code>) il accède à la valeur pointée. <code>&amp;</code> est l'inverse de <code>*</code>.</div>

<h3>3. Modifier une variable dans une fonction</h3>
<p>C'est l'usage n°1 des pointeurs : permettre à une fonction de modifier une variable de l'appelant (ce que le passage par valeur, vu leçon 8, interdit).</p>
<pre class="pseudo">void doubler(int *x) {     // le paramètre x est un pointeur : il reçoit une ADRESSE
    *x = *x * 2;           // *x = la valeur à cette adresse ; on la double sur place
}                          // fin de la fonction
int n = 5;                 // n vaut 5
doubler(&amp;n);               // on passe l'ADRESSE de n (pas une copie)
printf("%d\\n", n);         // n vaut 10 : il a bien changé !</pre>
<p>Voilà pourquoi <code>scanf("%d", &amp;age)</code> a besoin du <code>&amp;</code> : scanf reçoit l'adresse de <code>age</code> pour y écrire la saisie.</p>

<h3>4. Le pointeur nul</h3>
<p><code>NULL</code> est une valeur spéciale signifiant « ce pointeur ne pointe vers rien ». On l'utilise pour marquer un pointeur pas encore valide.</p>
<pre class="pseudo">int *p = NULL;             // p ne pointe vers rien pour l'instant
if (p != NULL) {           // TOUJOURS vérifier avant de déréférencer
    printf("%d\\n", *p);    // (ne s'exécute pas ici, car p est NULL)
}                          // fin du if</pre>
<div class="warn">Déréférencer un pointeur <code>NULL</code> ou non initialisé provoque un plantage (<em>segmentation fault</em>). Initialise tes pointeurs et vérifie-les avant de faire <code>*p</code>.</div>

<h3>5. Le type du pointeur compte</h3>
<pre class="pseudo">int    *pi;   // pointeur vers un int
double *pd;   // pointeur vers un double
char   *pc;   // pointeur vers un char</pre>
<p>Le type indique au compilateur la <strong>taille</strong> de ce qui est pointé — indispensable pour la leçon 11 (arithmétique de pointeurs).</p>
<div class="tip">Image mentale : une variable est une maison, sa valeur est ce qu'il y a dedans, son adresse est le numéro de rue. Un pointeur, c'est un papier où tu as noté ce numéro. <code>&amp;</code> = « quel est le numéro ? », <code>*</code> = « va voir ce qu'il y a à ce numéro ».</p></div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'un pointeur ?", opts: ["Un grand entier", "Une variable qui contient une adresse mémoire", "Un tableau", "Une fonction"], a: 1, exp: "Un pointeur stocke l'adresse d'une autre variable." },
    { type: "qcm", q: "Que fait l'opérateur <code>&</code> devant une variable ?", opts: ["Donne sa valeur", "Donne son adresse", "La double", "La supprime"], a: 1, exp: "& = « adresse de »." },
    { type: "qcm", q: "Que fait <code>*p</code> sur un pointeur p ?", opts: ["Multiplie p", "Donne la valeur à l'adresse pointée (déréférencement)", "Donne l'adresse de p", "Rien"], a: 1, exp: "* accède à la valeur pointée." },
    { type: "qcm", q: "Comment déclarer un pointeur vers un int ?", opts: ["int p;", "int *p;", "int &p;", "pointer p;"], a: 1, exp: "int *p; — l'étoile indique un pointeur." },
    { type: "qcm", q: "Après <code>int a = 5; int *p = &a; *p = 9;</code>, que vaut a ?", opts: ["5", "9", "0", "l'adresse de a"], a: 1, exp: "*p = 9 modifie a à travers le pointeur." },
    { type: "qcm", q: "Pourquoi scanf a-t-il besoin de <code>&age</code> ?", opts: ["Par tradition", "Pour recevoir l'adresse de age et y écrire la saisie", "Pour aller plus vite", "Ce n'est pas nécessaire"], a: 1, exp: "scanf modifie ta variable via son adresse : un pointeur." },
    { type: "qcm", q: "Que vaut un pointeur qui ne pointe vers rien ?", opts: ["0.0", "NULL", "-1", "vide"], a: 1, exp: "NULL représente « aucune adresse valide »." },
    { type: "qcm", q: "Que provoque le déréférencement d'un pointeur NULL ?", opts: ["Renvoie 0", "Un plantage (segmentation fault)", "Rien", "Un avertissement seulement"], a: 1, exp: "Accéder à *NULL est un comportement fatal : vérifie avant." },
    { type: "qcm", q: "Comment une fonction peut-elle modifier une variable de l'appelant ?", opts: ["Impossible", "En recevant un pointeur (son adresse) et en déréférençant", "En la renvoyant seulement", "Avec un cast"], a: 1, exp: "void f(int *x){ *x = ...; } appelé f(&n)." },
    { type: "qcm", q: "Dans <code>int *p</code>, le <code>*</code> signifie…", opts: ["multiplication", "« p est un pointeur vers int »", "déréférencement immédiat", "une erreur"], a: 1, exp: "À la déclaration, * annonce un pointeur." },
    { type: "vf", q: "& et * sont des opérations inverses l'une de l'autre.", a: true, exp: "Oui : & prend l'adresse, * revient à la valeur. *(&x) vaut x." },
    { type: "qcm", q: "Un pointeur vers double se déclare…", opts: ["double p;", "double *p;", "*double p;", "ptr double p;"], a: 1, exp: "double *p; — le type indique ce qui est pointé." },
    { type: "qcm", q: "Bonne pratique avant de faire <code>*p</code> :", opts: ["Rien", "Vérifier que p != NULL", "Multiplier p par 2", "Afficher p"], a: 1, exp: "On ne déréférence jamais un pointeur non valide." },
    { type: "qcm", q: "<code>printf(\"%d\", *(&age))</code> affiche…", opts: ["l'adresse de age", "la valeur de age", "0", "une erreur"], a: 1, exp: "&age puis * annulent leurs effets : on retrouve age." },
    { type: "qcm", q: "L'image « numéro de rue » correspond à…", opts: ["la valeur", "l'adresse", "le type", "le nom"], a: 1, exp: "L'adresse repère la case, comme un numéro repère une maison." }
  ],
  final: {
    title: "Exercice final — Échanger deux valeurs",
    intro: `<p>La fonction echanger doit intervertir deux entiers. Pourquoi ce code échoue-t-il ?</p>
<pre class="pseudo">void echanger(int a, int b) {      // ERREUR : a et b sont des COPIES (passage par valeur)
    int tmp = a;                   // on sauvegarde a dans tmp
    a = b;                         // on met b dans a … mais ce ne sont que des copies locales
    b = tmp;                       // on met tmp dans b … l'original de main n'est pas touché
}                                  // fin de la fonction
int main(void) {                   // point d'entrée
    int x = 1, y = 2;              // deux variables à échanger
    echanger(x, y);                // on passe des copies → l'échange reste interne à la fonction
    printf("%d %d\\n", x, y);       // affiche 1 2 : x et y n'ont PAS bougé
    return 0;                      // 0 = fin sans erreur
}                                  // fin de main</pre>`,
    questions: [
      { type: "qcm", q: "Pourquoi x et y ne sont-ils pas échangés ?", opts: ["Erreur de syntaxe", "echanger travaille sur des COPIES (passage par valeur)", "tmp est mal placé", "printf est faux"], a: 1, exp: "Sans pointeurs, la fonction ne modifie que ses copies locales." },
      { type: "qcm", q: "Quelle signature corrige le problème ?", opts: ["void echanger(int a, int b)", "void echanger(int *a, int *b)", "int echanger(int a, int b)", "void echanger(int &a)"], a: 1, exp: "On passe les adresses : int *a, int *b." },
      { type: "qcm", q: "Comment appeler la version corrigée ?", opts: ["echanger(x, y)", "echanger(&x, &y)", "echanger(*x, *y)", "echanger(x*, y*)"], a: 1, exp: "On transmet les adresses : &x, &y." },
      { type: "qcm", q: "Dans le corps corrigé, comment lire la valeur pointée par a ?", opts: ["a", "*a", "&a", "a[0] seulement"], a: 1, exp: "*a déréférence le pointeur." },
      { type: "qcm", q: "Après correction, qu'affiche le programme ?", opts: ["1 2", "2 1", "1 1", "2 2"], a: 1, exp: "Les valeurs sont bien interverties : 2 1." }
    ],
    solution: `<pre class="pseudo">#include &lt;stdio.h&gt;                    // pour printf
                                     // (ligne vide)
void echanger(int *a, int *b) {      // a et b sont des POINTEURS : ils reçoivent des adresses
    int tmp = *a;                    // tmp = la valeur pointée par a
    *a = *b;                         // on écrit dans la case de a la valeur pointée par b
    *b = tmp;                        // on écrit tmp dans la case de b
}                                    // fin de la fonction
                                     // (ligne vide)
int main(void) {                     // point d'entrée
    int x = 1, y = 2;                // deux variables à échanger
    echanger(&amp;x, &amp;y);               // on passe les ADRESSES de x et y
    printf("%d %d\\n", x, y);         // affiche 2 1 : l'échange a réussi
    return 0;                        // 0 = fin sans erreur
}                                    // fin de main</pre>
<p>La leçon fondamentale : pour qu'une fonction modifie tes variables, donne-lui leurs adresses. Les pointeurs sont ce qui rend le C si puissant — et si exigeant. Demain : pointeurs et tableaux.</p>`
  }
};
</script>

var ECRITURE = {

  { id: "c-l10", title: "Appliquer une remise via pointeur", level: 3,
    statement: "Écris une fonction <code>void appliquer_remise(double *prix, double taux)</code> qui réduit le prix pointé du pourcentage donné (ex. taux 0.10 = -10 %). Dans main, applique -20 % à un prix de 50.0 et affiche le résultat modifié.",
    hints: [
      "La fonction reçoit l'adresse du prix : double *prix.",
      "Corps : *prix = *prix * (1 - taux);",

    ],
    solution: "#include <stdio.h>                    // pour printf\n\nvoid appliquer_remise(double *prix, double taux) {  // prix = pointeur (adresse) ; taux = valeur\n    *prix = *prix * (1.0 - taux);    // *prix = valeur pointee ; on la reduit du taux, sur place\n}                                    // fin de la fonction\n\nint main(void) {                     // point d'entree du programme\n    double prix = 50.0;              // prix de depart\n    appliquer_remise(&prix, 0.20);   // on passe l'ADRESSE de prix ; -20 %\n    printf(\"Prix apres remise : %.2f euros\\n\", prix);  // 40.00 : prix a bien change\n    return 0;                        // 0 = fin sans erreur\n}                                    // fin de main",
    note: "La fonction agit directement sur la variable de main grâce à son adresse. Sans pointeur, prix resterait à 50.0. C'est exactement le mécanisme du & de scanf." }
  ]
};
