  title: "Les fonctions",
  subtitle: "Découper son code en briques réutilisables : type de retour, paramètres, prototype.",
  theory: `
<h3>1. Définir une fonction</h3>
<p>Une <strong>fonction</strong> est un bloc d'instructions portant un nom, qu'on peut lancer (« appeler ») autant de fois qu'on veut. Elle a quatre parties : un <strong>type de retour</strong> (la nature de la valeur qu'elle rend), un <strong>nom</strong>, une liste de <strong>paramètres</strong> (les valeurs qu'on lui fournit, chacune avec son type), et un <strong>corps</strong> (les instructions entre accolades). Le mot <code>return</code> renvoie le résultat à celui qui a appelé la fonction.</p>
<pre class="pseudo">// type_retour nom(paramètres) { corps ; return valeur; }   // le schéma général
double tarif(double prixJour, int jours) {   // renvoie un double ; reçoit un double et un entier
    double total = prixJour * jours;          // calcule le total (variable locale à la fonction)
    if (jours &gt;= 3) total *= 0.9;             // remise de 10 % à partir de 3 jours
    return total;                             // RENVOIE le total (un double) à l'appelant
}                                             // fin de la fonction tarif</pre>
<pre class="pseudo">int main(void) {                              // le programme démarre ici
    double t = tarif(5.0, 4);                 // APPEL : on fournit 5.0 et 4 ; t reçoit le résultat 18.00
    printf("%.2f\\n", t);                       // afficher t avec 2 décimales
    return 0;                                 // 0 = fin sans erreur
}                                             // fin de main</pre>

<h3>2. Le prototype : déclarer avant d'utiliser</h3>
<p>Le C lit le fichier de haut en bas : une fonction doit être <strong>connue avant</strong> d'être appelée. Deux options : la définir avant <code>main</code>, ou placer son <strong>prototype</strong> en haut du fichier. Un prototype est l'<em>annonce</em> de la fonction (son type de retour, son nom, ses types de paramètres) suivie d'un <code>;</code>, sans le corps.</p>
<pre class="pseudo">double tarif(double prixJour, int jours);   // PROTOTYPE : on annonce la fonction (sans corps, juste ;)
                                            // (ligne vide)
int main(void) { ... }                      // main peut appeler tarif car elle est déjà annoncée
                                            // (ligne vide)
double tarif(double prixJour, int jours) {  // DÉFINITION complète, placée plus bas
    ...                                     // le corps de la fonction
}                                           // fin de la définition</pre>

<h3>3. void : fonction sans retour, sans paramètre</h3>
<p><code>void</code> veut dire « vide / rien ». Comme type de retour, il signale que la fonction ne renvoie aucune valeur ; entre parenthèses, qu'elle ne prend aucun paramètre.</p>
<pre class="pseudo">void afficherBanniere(void) {               // void (retour) = ne renvoie rien ; (void) = ne prend rien
    printf("=== La Ludotheque ===\\n");       // son seul rôle est d'afficher
}                                           // fin de la fonction
afficherBanniere();                         // APPEL : on l'exécute pour son effet (l'affichage)</pre>
<p><code>void</code> comme type de retour = « ne renvoie rien ». <code>void</code> entre parenthèses = « aucun paramètre ».</p>

<h3>4. Passage par valeur : une copie</h3>
<p>Un <strong>argument</strong> est la valeur concrète qu'on donne lors de l'appel. Par défaut, en C, les arguments sont <strong>copiés</strong> dans les paramètres : la fonction travaille sur une <em>copie</em>, l'original de l'appelant n'est pas modifié. C'est le <strong>passage par valeur</strong>.</p>
<pre class="pseudo">void doubler(int x) { x = x * 2; }          // x est une COPIE ; on double la copie, pas l'original
int n = 5;                                  // n vaut 5
doubler(n);                                 // on passe une copie de n ; l'original n n'est pas touché
printf("%d\\n", n);                          // affiche 5, INCHANGÉ !</pre>
<div class="warn">Pour qu'une fonction modifie une variable de l'appelant, il faudra lui passer son <strong>adresse</strong> (un pointeur) — c'est la leçon 10. Le <code>&amp;</code> de scanf, c'était déjà ça.</div>

<h3>5. Pourquoi des fonctions ?</h3>
<p>Elles évitent la répétition, donnent un nom clair à une opération, et permettent de tester chaque brique séparément. Une bonne fonction fait <strong>une seule chose</strong> et porte un nom qui la décrit.</p>
<div class="tip">Le retour interrompt la fonction : dès qu'un <code>return</code> est atteint, la fonction s'arrête et renvoie la valeur. On peut avoir plusieurs return (ex. cas d'erreur en début de fonction).</div>`,
  exercises: [

    { type: "qcm", q: "Où doit être connue une fonction avant d'être appelée ?", opts: ["Nulle part", "Définie ou prototypée avant l'appel", "Après main", "Dans un autre fichier obligatoirement"], a: 1, exp: "Le C lit de haut en bas : il faut connaître la fonction avant." },
    { type: "qcm", q: "Une bonne fonction devrait…", opts: ["Faire beaucoup de choses", "Faire une seule chose, avec un nom clair", "Ne jamais renvoyer", "Être la plus longue possible"], a: 1, exp: "Une responsabilité, un nom parlant : plus facile à tester." },

    { type: "qcm", q: "Le lien entre le & de scanf et les fonctions :", opts: ["Aucun", "scanf reçoit une adresse pour modifier ta variable : c'est le passage par adresse", "scanf est plus lent", "& sert à additionner"], a: 1, exp: "scanf modifie ta variable via son adresse — un avant-goût des pointeurs." },
    { type: "qcm", q: "<code>double tarif(double p, int j)</code> renvoie un…", opts: ["int", "double", "void", "char"], a: 1, exp: "Le type de retour annoncé est double." },
    { type: "qcm", q: "Appeler <code>afficherBanniere()</code> déclarée <code>void afficherBanniere(void)</code> :", opts: ["Renvoie une valeur à stocker", "Exécute la fonction sans renvoyer de valeur", "Est interdit", "Affiche void"], a: 1, exp: "Une fonction void s'appelle pour son effet, pas pour un résultat." }
  ],

    title: "Exercice final — La fonction tarif",
    intro: `<p>On veut une fonction qui calcule un tarif de location. Corrige :</p>
<pre class="pseudo">int tarif(double prixJour, int jours) {   // ERREUR : le total est un double, renvoyer un int le tronquerait
    double total = prixJour * jours;      // calcule le total
    if (jours >= 3) total *= 0.9;         // remise -10 % dès 3 jours
}                                         // ERREUR : aucun return → le résultat n'est pas renvoyé
                                          // (ligne vide)
int main(void) {                          // point d'entrée
    printf("%.2f\\n", tarif(5.0, 4));      // affiche le tarif calculé (devrait valoir 18.00)
    return 0;                             // 0 = fin sans erreur
}                                         // fin de main</pre>`,
    questions: [
      { type: "qcm", q: "Erreur n°1 — le type de retour <code>int tarif(...)</code> :", opts: ["Correct", "Le total est un double : la fonction devrait renvoyer un double", "Il faut void", "Il faut char"], a: 1, exp: "Renvoyer un int tronquerait 18.0 et fausserait les prix." },
      { type: "qcm", q: "Erreur n°2 — dans le corps de tarif :", opts: ["Rien", "Il manque return total;", "Il manque un printf", "Il faut un scanf"], a: 1, exp: "Sans return, la fonction ne renvoie pas le résultat calculé." },
      { type: "qcm", q: "Où faudrait-il un prototype si tarif était défini APRÈS main ?", opts: ["Nulle part", "En haut du fichier : double tarif(double, int);", "Dans main", "Après return 0"], a: 1, exp: "Le prototype annonce la fonction avant son appel." },
      { type: "qcm", q: "Que renvoie <code>tarif(5.0, 4)</code> corrigé ?", opts: ["20.00", "18.00 (remise -10 % dès 3 jours)", "15.00", "5.00"], a: 1, exp: "5×4=20, puis ×0.9 = 18." },
      { type: "qcm", q: "Les paramètres prixJour et jours sont passés…", opts: ["par adresse", "par valeur (copies)", "par référence", "globalement"], a: 1, exp: "Par valeur : la fonction lit des copies, ce qui convient ici." }
    ],
    solution: `<pre class="pseudo">#include &lt;stdio.h&gt;                            // pour printf
                                             // (ligne vide)
double tarif(double prixJour, int jours) {   // type corrigé : renvoie un double
    double total = prixJour * jours;         // calcule le total
    if (jours &gt;= 3) total *= 0.9;            // remise -10 % dès 3 jours
    return total;                            // return ajouté : on renvoie le résultat
}                                            // fin de la fonction
                                             // (ligne vide)
int main(void) {                             // point d'entrée
    printf("%.2f\\n", tarif(5.0, 4));         // affiche 18.00
    return 0;                                // 0 = fin sans erreur
}                                            // fin de main</pre>
<p>Deux corrections : le bon type de retour (<code>double</code>) et le <code>return</code>. Une fonction bien nommée, au bon type, testable seule : la base d'un code propre. Demain : les chaînes de caractères.</p>`
  }
