<script>
var DAY = {
  num: 18,
  title: "Bases de données : PDO et SELECT",
  subtitle: "Fini le JSON artisanal : place au stockage professionnel.",
  theory: `
<h3>1. Pourquoi une base de données ?</h3>
<p>Le JSON de la leçon 15 montre ses limites : 10 000 enregistrements = tout relire à chaque requête, pas d'accès concurrent, pas de recherche efficace. Une <strong>base de données</strong> (MySQL/MariaDB, fournie avec XAMPP) résout tout : stockage structuré en <strong>tables</strong> (des grilles), langage d'interrogation <strong>SQL</strong>, et indexation (une recherche rapide, comme la dichotomie, mais industrialisée).</p>
<pre class="pseudo">Table membres :                                 -- une TABLE = une grille de données
id | nom    | email           | age            -- chaque COLONNE = un champ (une info)
1  | Ana    | ana@mail.be     | 20             -- chaque LIGNE = un enregistrement (un membre)
2  | Bob    | bob@mail.be     | 17             -- 2e membre
3  | Zoé    | zoe@mail.be     | 22             -- 3e membre</pre>

<h3>2. SQL : les 4 verbes</h3>
<p><strong>SQL</strong> est le langage pour parler à la base. En SQL, un commentaire commence par <code>--</code>.</p>
<pre class="pseudo">SELECT * FROM membres                    -- LIRE toutes les colonnes (*) de toutes les lignes
SELECT nom, age FROM membres WHERE age &gt;= 18   -- LIRE en filtrant (WHERE = la condition, le « si »)
SELECT * FROM membres ORDER BY nom       -- LIRE en triant par nom (ORDER BY = trier)
INSERT INTO membres (nom, email, age) VALUES (...)   -- CRÉER une ligne (détaillé leçon 19)
UPDATE membres SET age = 21 WHERE id = 1 -- MODIFIER (le WHERE cible LA ligne à changer !)
DELETE FROM membres WHERE id = 3         -- SUPPRIMER (sans le WHERE, on efface TOUT !)</pre>
<p>Retenir les quatre opérations de base (souvent notées CRUD) : <code>SELECT</code> (lire), <code>INSERT</code> (créer), <code>UPDATE</code> (modifier), <code>DELETE</code> (supprimer).</p>

<h3>3. PDO : le connecteur PHP</h3>
<p><strong>PDO</strong> (PHP Data Objects) est l'outil PHP pour dialoguer avec la base. C'est une classe : on en crée un objet, puis on l'utilise.</p>
<pre class="pseudo">try {                                                     // try : on tente une opération qui peut échouer
    $pdo = new PDO(                                        // PDO est une CLASSE : on en crée un objet
        "mysql:host=localhost;dbname=club;charset=utf8mb4", // le DSN : type, hôte, nom de la base, encodage
        "root",                     // l'utilisateur de la base
        "",                         // son mot de passe (vide par défaut en local avec XAMPP)
        [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]        // option : faire lever des EXCEPTIONS en cas d'erreur
    );                                                    // fin de l'appel à new PDO
} catch (PDOException $e) {                                // catch : si la connexion échoue (serveur éteint…)
    die("Connexion impossible : " . $e->getMessage());    // on arrête proprement avec le message d'erreur
}                                                         // fin du try/catch</pre>
<p>PDO est une CLASSE (leçon 16 !) : <code>new</code>, méthodes, exceptions. Tout ton savoir POO s'applique. Le try/catch est indispensable car la connexion dépend d'un service externe.</p>

<h3>4. Lire des données : query + fetchAll</h3>
<pre class="pseudo">$stmt = $pdo->query("SELECT nom, age FROM membres WHERE age &gt;= 18");  // exécute la requête ; $stmt = le résultat
$membres = $stmt->fetchAll(PDO::FETCH_ASSOC);                        // récupère TOUTES les lignes en tableau associatif
// $membres = [["nom" => "Ana", "age" => 20], ["nom" => "Zoé", "age" => 22]]  ← liste d'enregistrements !
foreach ($membres as $m) {                                          // on parcourt chaque ligne
    echo htmlspecialchars($m["nom"]) . " (" . $m["age"] . ")&lt;br&gt;"; // échappement OBLIGATOIRE à l'affichage
}                                                                   // fin du parcours</pre>
<div class="tip"><code>fetchAll(PDO::FETCH_ASSOC)</code> retourne… la LISTE D'ENREGISTREMENTS de la leçon 8 ! Un tableau indexé de tableaux associatifs : tu connais déjà la structure par cœur. Et l'échappement <code>htmlspecialchars</code> reste OBLIGATOIRE : les données de la base ont pu, à l'origine, être saisies par des utilisateurs (leçon 13).</div>

<h3>5. Qui fait quoi ? SQL ou PHP ?</h3>
<pre class="pseudo">Filtrer   → WHERE (SQL) plutôt que array_filter (PHP)     // la base filtre mieux
Trier     → ORDER BY plutôt que sort                      // la base trie mieux
Compter   → SELECT COUNT(*) plutôt que count              // la base compte mieux
Limiter   → LIMIT 10 plutôt que array_slice               // la base ne renvoie que le nécessaire</pre>
<p>La base est OPTIMISÉE pour ces opérations (ses index permettent une recherche très rapide) : demande-lui directement le résultat final, ne rapatrie pas 10 000 lignes en PHP pour n'en garder que 3.</p>`,
  exercises: [
    { type: "qcm", q: "Pourquoi une base de données plutôt que le JSON de la leçon 15 ?", opts: ["C'est la mode", "Recherche indexée, accès concurrent, requêtes puissantes : le JSON relit TOUT à chaque fois", "JSON est payant", "Aucune raison"], a: 1, exp: "À petite échelle, JSON suffit ; à 10 000 lignes, la BDD s'impose (jour 28 !)." },
    { type: "qcm", q: "Une table de base de données ressemble à…", opts: ["Un fichier binaire", "Une grille lignes/colonnes : chaque ligne = un enregistrement, chaque colonne = un champ", "Une image", "Un cookie"], a: 1, exp: "Le tableau 2D à colonnes nommées du jour 18 d'algo, persistant." },
    { type: "qcm", q: "Le verbe SQL pour LIRE des données :", opts: ["READ", "SELECT", "GET", "FETCH"], a: 1, exp: "SELECT colonnes FROM table." },
    { type: "qcm", q: "Filtrer les majeurs en SQL :", opts: ["SELECT * FROM membres IF age >= 18", "SELECT * FROM membres WHERE age >= 18", "FILTER age", "age >= 18 SELECT"], a: 1, exp: "WHERE = le if de SQL." },
    { type: "qcm", q: "Trier par nom en SQL :", opts: ["sort(nom)", "ORDER BY nom", "SORT nom", "TRIER PAR nom"], a: 1, exp: "ORDER BY nom DESC pour l'ordre inverse : le tri (jour 24), délégué à la base." },
    { type: "qcm", q: "PDO est…", opts: ["Un langage", "Une CLASSE PHP de connexion aux bases : new PDO(...), méthodes, exceptions — la POO en action", "Un serveur", "Un fichier"], a: 1, exp: "Tes leçons 16-17 rendent PDO naturel : c'est un objet comme les autres." },
    { type: "qcm", q: "La chaîne \"mysql:host=localhost;dbname=club\" s'appelle…", opts: ["Une requête", "Le DSN : l'adresse complète de la base (type, hôte, nom)", "Un mot de passe", "Une table"], a: 1, exp: "Data Source Name : où et comment se connecter." },
    { type: "qcm", q: "Pourquoi le try/catch autour de new PDO ?", opts: ["Décoration", "La connexion peut échouer (serveur éteint, mauvais mot de passe) : PDOException à attraper", "PDO l'exige", "Pour la vitesse"], a: 1, exp: "L'imprévisible externe = exception : le réflexe de la leçon 16 Java s'applique." },
    { type: "qcm", q: "fetchAll(PDO::FETCH_ASSOC) retourne…", opts: ["Une chaîne SQL", "La liste d'enregistrements de la leçon 8 : tableau de tableaux associatifs", "Un objet PDO", "true"], a: 1, exp: "$resultats[0][\"nom\"] : structure connue, zéro surprise." },
    { type: "qcm", q: "Pourquoi htmlspecialchars sur des données venant de la BASE ?", opts: ["Inutile, la base est sûre", "Ces données ont pu être SAISIES par des utilisateurs : l'origine compte, pas le stockage (leçon 13 !)", "La base corrompt", "Pour le SQL"], a: 1, exp: "Un pseudo malveillant stocké hier attaque à l'affichage d'aujourd'hui." },
    { type: "qcm", q: "Garder les 10 premiers résultats : LIMIT 10 (SQL) ou array_slice (PHP) ?", opts: ["array_slice", "LIMIT 10 : la base ne transmet QUE le nécessaire — jamais rapatrier 10 000 lignes pour 10", "Pareil", "Les deux ensemble"], a: 1, exp: "Le travail au plus près des données : réflexe de performance." },
    { type: "qcm", q: "Compter les membres : quelle requête ?", opts: ["count(SELECT *)", "SELECT COUNT(*) FROM membres : la base compte, PHP reçoit UN nombre", "SELECT ALL", "SUM(membres)"], a: 1, exp: "COUNT, SUM, AVG, MAX, MIN : tes motifs du jour 12/17… en SQL natif !" },
    { type: "qcm", q: "SELECT AVG(age) FROM membres correspond à quel algorithme du mois d'algo ?", opts: ["Le tri", "La MOYENNE (somme/compteur, jour 12) : la base l'exécute pour toi", "La dichotomie", "Le palindrome"], a: 1, exp: "Chaque agrégat SQL encapsule un de tes motifs." },
    { type: "qcm", q: "L'index d'une base rend les recherches en ~log n. Quel algorithme du cours retrouve-t-on ?", opts: ["Le tri à bulles", "La DICHOTOMIE (jour 23) : les index sont des arbres de recherche — ton savoir explique la magie", "La factorielle", "Le hasard"], a: 1, exp: "Comprendre les algos = comprendre POURQUOI la base est rapide." },
    { type: "qcm", q: "ORDER BY age DESC LIMIT 1 retourne…", opts: ["Le plus jeune", "Le membre le PLUS ÂGÉ : tri décroissant + première ligne = le MAX (jour 17, version SQL)", "Une erreur", "Tous triés"], a: 1, exp: "Trois façons de trouver un max : boucle (jour 17), max() (leçon 7), SQL (aujourd'hui)." }
  ],
  final: {
    title: "Exercice final — La page des membres",
    intro: `<p>Le club affiche ses membres majeurs, triés :</p>
<pre class="pseudo">$stmt = $pdo->query(                                  // exécute la requête SQL, résultat dans $stmt
    "SELECT nom, age FROM membres WHERE age >= 18 ORDER BY nom"   -- majeurs (WHERE), triés par nom (ORDER BY)
);                                                    // fin de l'appel query
$membres = $stmt->fetchAll(PDO::FETCH_ASSOC);         // récupère toutes les lignes en liste d'enregistrements
if (count($membres) === 0) {                          // (1) aucune ligne trouvée ?
    echo "Aucun membre majeur.";                      // message pour le cas « liste vide »
} else {                                              // sinon : au moins un membre
    echo "&lt;ul&gt;";                                     // ouvre la liste HTML
    foreach ($membres as $m) {                        // (2) $m = un enregistrement (un membre) par tour
        echo "&lt;li&gt;" . htmlspecialchars($m["nom"]) . " — " . $m["age"] . " ans&lt;/li&gt;";  // un &lt;li&gt; par membre, nom ÉCHAPPÉ
    }                                                 // fin du parcours
    echo "&lt;/ul&gt;";                                    // ferme la liste HTML
}                                                     // fin du if/else</pre>
<p>Table : Ana (20), Bob (17), Zoé (22).</p>`,
    questions: [
      { type: "qcm", q: "Que contient $membres ?", opts: ["Les trois membres", "[[\"nom\"=>\"Ana\",\"age\"=>20], [\"nom\"=>\"Zoé\",\"age\"=>22]] : Bob (17) filtré par WHERE, Ana avant Zoé par ORDER BY", "Bob seul", "Une chaîne"], a: 1, exp: "Filtre + tri exécutés PAR LA BASE : PHP reçoit le résultat prêt." },
      { type: "input", q: "Combien de <code>&lt;li&gt;</code> la page affiche-t-elle ?", a: "2", ph: "nombre", exp: "Ana et Zoé : la boucle-fabrique de HTML (leçon 6) sur données SQL." },
      { type: "qcm", q: "(1) Le test count === 0 gère…", opts: ["Une erreur SQL", "Le cas limite « aucun résultat » : afficher un message plutôt qu'une liste vide (jour 30 !)", "La connexion", "Le tri"], a: 1, exp: "La check-list vide/unité/extrêmes suit les données partout." },
      { type: "qcm", q: "(2) La chaîne complète des données est :", opts: ["PHP → HTML", "Table MySQL → SQL (filtre+tri) → PDO → liste d'enregistrements → foreach → HTML échappé", "Cookie → session", "JSON → echo"], a: 1, exp: "Le pipeline du web dynamique, de bout en bout — chaque maillon vient d'une leçon." },
      { type: "qcm", q: "Demain on INSÉRERA des données du formulaire dans la base. Quel danger majeur anticipe la leçon 19 ?", opts: ["Le disque plein", "L'INJECTION SQL : un attaquant écrit du SQL dans le formulaire — les requêtes préparées seront le bouclier", "Les doublons", "La lenteur"], a: 1, exp: "Le XSS avait htmlspecialchars ; l'injection SQL aura les requêtes préparées. Suite au prochain épisode !" }
    ],
    solution: `<pre class="pseudo">SQL : WHERE age >= 18 (filtre) + ORDER BY nom (tri)        -- la base fait le travail algorithmique
→ la base fait le travail algorithmique                    -- filtre + tri exécutés côté base
PDO : fetchAll → [["nom"=>"Ana","age"=>20],["nom"=>"Zoé","age"=>22]]   // liste d'enregistrements reçue
PHP : cas limite (vide) + foreach + htmlspecialchars       // affichage sécurisé
HTML: &lt;li&gt;Ana — 20 ans&lt;/li&gt;&lt;li&gt;Zoé — 22 ans&lt;/li&gt;         // le HTML final envoyé au navigateur</pre>
<p>Lire une base proprement : fait. Demain, on ÉCRIT dedans — avec le bouclier anti-injection le plus important de ta carrière PHP.</p>`
  }
};
