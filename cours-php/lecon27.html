<script>
var DAY = {
  num: 27,
  title: "Construire une mini-API REST JSON",
  subtitle: "Exposer des données pour qu'un autre programme (ou un JavaScript) les consomme.",
  theory: `
<h3>1. Qu'est-ce qu'une API ?</h3>
<p>Une <strong>API</strong> (Application Programming Interface) est une porte d'entrée par laquelle un PROGRAMME parle à un autre programme, sans page HTML ni humain. Analogie : un guichet automatisé — tu passes une demande dans un format convenu, on te répond dans le même format. Une API <strong>REST</strong> suit des conventions simples fondées sur les URL et les méthodes HTTP.</p>
<div class="tip">Différence clé avec une page web : une page renvoie du HTML pour un HUMAIN ; une API renvoie des DONNÉES (souvent JSON) pour une MACHINE.</div>

<h3>2. JSON : le langage d'échange</h3>
<p><strong>JSON</strong> (JavaScript Object Notation) est un format texte universel pour représenter des données : objets entre <code>{ }</code>, listes entre <code>[ ]</code>. Tous les langages savent le lire. On convertit un tableau PHP en JSON avec <code>json_encode()</code>, et l'inverse avec <code>json_decode()</code>.</p>
<pre class="pseudo">\$jeu = ["titre" =&gt; "Catan", "joueurs" =&gt; 4];   // un tableau associatif PHP
echo json_encode(\$jeu);                        // produit le texte JSON : {"titre":"Catan","joueurs":4}
\$data = json_decode(\$texteJson, true);        // JSON → tableau PHP (le « true » = tableau associatif)
// sans true, json_decode renvoie un objet ; avec true, un tableau : préfère true ici</pre>

<h3>3. Les méthodes HTTP : le VERBE de la demande</h3>
<p>Chaque requête HTTP porte une MÉTHODE qui dit l'INTENTION. REST les fait correspondre au CRUD (leçon 19) :</p>
<pre class="pseudo">// GET    → LIRE       (Read)   : « donne-moi les jeux »
// POST   → CRÉER      (Create) : « ajoute ce jeu »
// PUT    → MODIFIER   (Update) : « remplace le jeu 3 »
// DELETE → SUPPRIMER  (Delete) : « supprime le jeu 3 »
\$methode = \$_SERVER["REQUEST_METHOD"];         // PHP lit la méthode de la requête entrante
// même URL /jeux, mais un GET LIT et un POST CRÉE : le verbe change le sens</pre>

<h3>4. Le code de statut HTTP : le résultat en un nombre</h3>
<p>La réponse porte un <strong>code de statut</strong> qui résume l'issue. On le fixe avec <code>http_response_code()</code>.</p>
<pre class="pseudo">// 200 OK           → succès de lecture              // tout va bien
// 201 Created      → ressource créée (après un POST) // création réussie
// 400 Bad Request  → la demande est mal formée       // faute du client
// 404 Not Found    → ressource inexistante            // l'id demandé n'existe pas
// 405 Method Not Allowed → méthode non gérée          // ex : PATCH non prévu
// 500 Internal Server Error → plantage côté serveur   // faute du serveur
http_response_code(404);                        // annonce « non trouvé » au client</pre>

<h3>5. Le squelette d'une API : l'en-tête JSON et le routage</h3>
<p>Une API commence par ANNONCER qu'elle répond en JSON (l'<strong>en-tête</strong> <code>Content-Type</code>), puis AIGUILLE selon la méthode : c'est le <strong>routage</strong>.</p>
<pre class="pseudo">header("Content-Type: application/json; charset=utf-8"); // annonce : « ma réponse est du JSON »
\$methode = \$_SERVER["REQUEST_METHOD"];              // récupère le verbe HTTP
switch (\$methode) {                                 // aiguille selon la méthode (routage)
    case "GET":                                     // demande de LECTURE
        echo json_encode(\$jeux);                    // renvoie la liste en JSON
        break;                                      // fin du cas GET
    case "POST":                                    // demande de CRÉATION
        \$corps = json_decode(file_get_contents("php://input"), true); // lit le CORPS JSON envoyé
        // (php://input = le flux brut du corps de la requête, là où arrive le JSON d'un POST)
        http_response_code(201);                    // annonce « créé »
        echo json_encode(["cree" =&gt; true]);         // confirme en JSON
        break;                                      // fin du cas POST
    default:                                        // toute autre méthode
        http_response_code(405);                    // « méthode non autorisée »
        echo json_encode(["erreur" =&gt; "Méthode non gérée"]); // message d'erreur en JSON
}                                                   // fin du switch</pre>
<div class="warn">Sécurité : les données reçues (corps JSON) sont des ENTRÉES utilisateur comme les autres. On les VALIDE (leçon 13) et on utilise des requêtes PRÉPARÉES (leçon 19) avant tout accès base. Une API n'échappe à aucune règle de sécurité.</div>

<h3>6. Exemple complet : GET /jeux avec la base</h3>
<pre class="pseudo">header("Content-Type: application/json; charset=utf-8"); // réponse JSON
try {                                                // zone surveillée
    \$stmt = \$pdo->query("SELECT id, titre, joueurs FROM jeux ORDER BY titre"); // lit les jeux
    \$jeux = \$stmt->fetchAll(PDO::FETCH_ASSOC);       // liste de tableaux associatifs
    http_response_code(200);                         // succès
    echo json_encode(\$jeux, JSON_UNESCAPED_UNICODE); // JSON lisible (accents non échappés)
} catch (PDOException \$e) {                          // en cas d'échec base
    error_log(\$e->getMessage());                      // détail dans le journal (jamais au client)
    http_response_code(500);                         // erreur serveur
    echo json_encode(["erreur" =&gt; "Service indisponible"]); // message neutre en JSON
}                                                   // fin</pre>
<p>Un client (JavaScript avec <code>fetch</code>, une appli mobile, un autre serveur) appelle cette URL et reçoit un tableau JSON prêt à l'emploi. Tu viens de séparer le « moteur de données » de l'« affichage » : c'est le principe des applications modernes.</p>`,
  exercises: [
    { type: "qcm", q: "Une API est…", opts: ["Une page HTML destinée à un humain", "Une porte par laquelle un PROGRAMME parle à un autre, dans un format convenu (souvent JSON)", "Un moteur de base de données", "Un navigateur web classique"], a: 1, exp: "Données pour une machine, pas HTML pour un humain." },
    { type: "qcm", q: "JSON est…", opts: ["Un langage de programmation complet", "Un FORMAT texte d'échange de données, universel : objets { }, listes [ ]", "Un type de base de données SQL", "Un serveur web spécialisé"], a: 1, exp: "Tous les langages savent lire et écrire du JSON." },
    { type: "qcm", q: "<code>json_encode($tableau)</code> …", opts: ["Lit un fichier JSON existant", "CONVERTIT un tableau PHP en texte JSON", "Ouvre une connexion à la base", "Trie les clés d'un tableau"], a: 1, exp: "PHP → JSON pour la réponse de l'API." },
    { type: "qcm", q: "<code>json_decode($texte, true)</code> …", opts: ["Convertit un tableau PHP en JSON", "JSON → tableau PHP (le true demande un tableau associatif)", "Chiffre les données échangées", "Supprime le texte JSON reçu"], a: 1, exp: "Le sens inverse d'encode ; true pour un tableau." },
    { type: "qcm", q: "En REST, la méthode GET correspond à…", opts: ["Créer", "LIRE (Read) : récupérer des données", "Supprimer", "Modifier"], a: 1, exp: "GET lit, POST crée, PUT modifie, DELETE supprime." },
    { type: "qcm", q: "La méthode pour CRÉER une ressource est…", opts: ["GET", "POST", "DELETE", "HEAD"], a: 1, exp: "POST → Create dans la correspondance REST/CRUD." },
    { type: "qcm", q: "<code>$_SERVER[\"REQUEST_METHOD\"]</code> contient…", opts: ["L'URL", "La MÉTHODE HTTP de la requête (GET, POST…)", "Le corps JSON", "Le code de statut"], a: 1, exp: "On l'utilise pour aiguiller (routage)." },
    { type: "qcm", q: "Le code de statut 201 signifie…", opts: ["Erreur", "Created : une ressource a été CRÉÉE (réponse typique d'un POST réussi)", "Non trouvé", "Interdit"], a: 1, exp: "201 après une création réussie." },
    { type: "qcm", q: "Le code 404 signifie…", opts: ["Succès", "Not Found : la ressource demandée n'existe pas", "Créé", "Erreur serveur"], a: 1, exp: "L'id demandé est introuvable." },
    { type: "qcm", q: "Le code 500 signifie…", opts: ["Succès", "Internal Server Error : un plantage côté SERVEUR", "Non trouvé", "Mauvaise requête"], a: 1, exp: "500 = faute du serveur ; 400 = faute du client." },
    { type: "qcm", q: "L'en-tête <code>Content-Type: application/json</code> sert à…", opts: ["Trier les champs de la réponse", "ANNONCER au client que la réponse est du JSON, pour qu'il l'interprète correctement", "Chiffrer la réponse envoyée", "Compter les octets envoyés"], a: 1, exp: "On le pose avec header() avant tout echo." },
    { type: "qcm", q: "Pour lire le corps JSON d'un POST, on utilise…", opts: ["$_GET", "json_decode(file_get_contents(\"php://input\"), true) : php://input est le flux brut du corps", "$_SERVER", "echo"], a: 1, exp: "Le corps d'une requête API n'arrive pas dans $_POST classique." },
    { type: "qcm", q: "Le routage d'une API consiste à…", opts: ["Trier les données renvoyées", "AIGUILLER le traitement selon la méthode (et l'URL) : GET → lire, POST → créer…", "Chiffrer les données échangées", "Formater la réponse en JSON"], a: 1, exp: "Un switch sur REQUEST_METHOD est un routage minimal." },
    { type: "qcm", q: "Les données JSON reçues par l'API…", opts: ["Sont fiables", "Sont des ENTRÉES utilisateur : à VALIDER et à traiter en requêtes PRÉPARÉES, comme un formulaire", "N'ont pas besoin de sécurité", "Sont déjà échappées"], a: 1, exp: "Une API applique toutes les règles de sécurité habituelles." },
    { type: "vf", q: "Une même URL /jeux peut LIRE avec GET et CRÉER avec POST : c'est le verbe HTTP qui change le sens.", a: true, exp: "REST distingue les intentions par la méthode, pas par l'URL." }
  ],
  final: {
    title: "Exercice final — L'endpoint /jeux de la Ludothèque",
    intro: `<p>Un seul fichier gère la liste des jeux : GET renvoie tout, POST ajoute, le reste est refusé.</p>
<pre class="pseudo">header("Content-Type: application/json; charset=utf-8"); // (1) la réponse sera du JSON
\$methode = \$_SERVER["REQUEST_METHOD"];              // le verbe HTTP entrant

try {                                               // zone surveillée
    if (\$methode === "GET") {                        // (2) LECTURE
        \$stmt = \$pdo->query("SELECT id, titre FROM jeux ORDER BY titre"); // lit les jeux
        echo json_encode(\$stmt->fetchAll(PDO::FETCH_ASSOC)); // renvoie la liste en JSON (200 par défaut)
    } elseif (\$methode === "POST") {                 // (3) CRÉATION
        \$corps = json_decode(file_get_contents("php://input"), true); // lit le corps JSON
        \$titre = trim(\$corps["titre"] ?? "");        // récupère le titre, chaîne vide si absent
        if (\$titre === "") {                          // (4) validation minimale
            http_response_code(400);                 // demande mal formée
            echo json_encode(["erreur" =&gt; "titre requis"]); // message d'erreur JSON
        } else {                                     // titre valide
            \$stmt = \$pdo->prepare("INSERT INTO jeux (titre) VALUES (?)"); // requête PRÉPARÉE
            \$stmt->execute([\$titre]);                // insère en sécurité
            http_response_code(201);                 // créé
            echo json_encode(["id" =&gt; \$pdo->lastInsertId(), "titre" =&gt; \$titre]); // renvoie la ressource créée
        }                                            // fin validation
    } else {                                         // (5) toute autre méthode
        http_response_code(405);                     // méthode non gérée
        echo json_encode(["erreur" =&gt; "Méthode non autorisée"]); // refus en JSON
    }                                                // fin du routage
} catch (PDOException \$e) {                          // panne base
    error_log(\$e->getMessage());                      // détail au journal
    http_response_code(500);                         // erreur serveur
    echo json_encode(["erreur" =&gt; "Service indisponible"]); // message neutre
}                                                   // fin</pre>`,
    questions: [
      { type: "qcm", q: "(1) Pourquoi poser <code>header(\"Content-Type: application/json\")</code> en premier ?", opts: ["C'est purement décoratif", "Pour annoncer au client que la réponse est du JSON, AVANT tout echo (un en-tête doit précéder le corps)", "Pour trier la réponse", "Pour chiffrer la réponse"], a: 1, exp: "Les en-têtes se posent avant toute sortie." },
      { type: "qcm", q: "(2)(3) Comment le code distingue-t-il lire et créer ?", opts: ["Par l'URL demandée", "Par la MÉTHODE HTTP : GET déclenche la lecture, POST la création (routage sur REQUEST_METHOD)", "De manière aléatoire", "Par un cookie de session"], a: 1, exp: "Même endpoint, verbe différent, traitement différent." },
      { type: "qcm", q: "(4) Que renvoie l'API si le titre est vide ?", opts: ["Le code 201 et insère quand même", "Le code 400 (Bad Request) et un message d'erreur JSON, sans rien insérer", "Le code 500 (erreur serveur)", "Rien, la page reste vide"], a: 1, exp: "Validation : une entrée invalide donne un 400 explicite." },
      { type: "qcm", q: "Pourquoi l'INSERT utilise-t-il une requête PRÉPARÉE ?", opts: ["Par simple habitude de code", "Parce que le titre vient du client : la préparation neutralise toute injection SQL (leçon 19)", "Pour accélérer l'insertion", "Ce n'est pas vraiment nécessaire ici"], a: 1, exp: "Une API traite les entrées comme n'importe quel formulaire." },
      { type: "qcm", q: "(5) Un client envoie une requête DELETE. Que se passe-t-il ?", opts: ["La liste est renvoyée", "Le code 405 (Method Not Allowed) et un message JSON : la méthode n'est pas gérée par cet endpoint", "Une insertion", "Erreur 500"], a: 1, exp: "Le else final refuse proprement les méthodes non prévues." }
    ],
    solution: `<pre class="pseudo">// Réponse au POST { "titre": "Catan" } → statut 201 et corps :
// {"id":7,"titre":"Catan"}                          // la ressource créée, renvoyée au client

// Réponse au GET → statut 200 et corps :
// [{"id":1,"titre":"7 Wonders"},{"id":7,"titre":"Catan"}]  // la liste en JSON

// Réponse à un PUT non géré → statut 405 :
// {"erreur":"Méthode non autorisée"}                // refus explicite

// Les principes d'une API REST :
// · JSON pour échanger (json_encode / json_decode)         // format universel
// · le VERBE HTTP porte l'intention (GET/POST/PUT/DELETE)  // routage
// · le CODE de statut résume l'issue (200/201/400/404/500) // résultat lisible
// · sécurité identique : validation + requêtes préparées   // aucune exception</pre>
<p>Tu sais exposer des données à d'autres programmes proprement. Demain, on renforce le tout : sécurité web (mots de passe, XSS, CSRF).</p>`
  }
};
</script>

<script>
var ECRITURE = {

  { id: "php-api", title: "Un endpoint GET /membres en JSON", level: 3,
    statement: "Écris le code d'un endpoint qui répond en JSON. Sur un <strong>GET</strong>, il renvoie la liste des membres (id, nom) depuis la base avec un statut 200. Sur toute autre méthode, il renvoie un statut 405 et un message d'erreur JSON. Gère aussi une panne base (500).",

      "Enveloppe dans try/catch (PDOException) : dans le catch, http_response_code(500) + message neutre ; sinon http_response_code(405) pour les autres méthodes."
    ],
    atoi: { cmd: "curl -s -X POST http://localhost:8000/membres.php", expected: "{\"erreur\":\"Methode non autorisee\"}" },
    checklist: [
      "header(\"Content-Type: application/json; charset=utf-8\") est posé AVANT tout echo (l'en-tête précède le corps).",
      "Sur GET : $pdo->query(\"SELECT id, nom FROM membres ORDER BY nom\")->fetchAll(PDO::FETCH_ASSOC) puis json_encode, avec http_response_code(200).",
      "Toute autre méthode → http_response_code(405) + JSON d'erreur, sans toucher la base.",
      "Le catch (PDOException) renvoie 500 avec un message NEUTRE et error_log() garde le détail côté serveur."
    ],
    solution: "<?php                                          // ouverture PHP\nheader(\"Content-Type: application/json; charset=utf-8\"); // annonce une réponse JSON\n$methode = $_SERVER[\"REQUEST_METHOD\"];        // récupère le verbe HTTP entrant\n\ntry {                                          // zone surveillée\n    if ($methode === \"GET\") {                   // demande de LECTURE\n        $stmt = $pdo->query(\"SELECT id, nom FROM membres ORDER BY nom\"); // lit les membres\n        $membres = $stmt->fetchAll(PDO::FETCH_ASSOC); // liste de tableaux associatifs\n        http_response_code(200);                // succès\n        echo json_encode($membres, JSON_UNESCAPED_UNICODE); // renvoie la liste (accents lisibles)\n    } else {                                    // toute autre méthode (POST, PUT, DELETE...)\n        http_response_code(405);                // Method Not Allowed\n        echo json_encode([\"erreur\" => \"Methode non autorisee\"]); // refus explicite en JSON\n    }                                          // fin du routage\n} catch (PDOException $e) {                     // panne de la base\n    error_log($e->getMessage());                // detail dans le journal serveur (jamais au client)\n    http_response_code(500);                    // Internal Server Error\n    echo json_encode([\"erreur\" => \"Service indisponible\"]); // message NEUTRE pour le client\n}                                              // fin try/catch\n?>",

  ]
};
