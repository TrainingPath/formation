  title: "Tests unitaires avec PHPUnit",
  subtitle: "Prouver automatiquement que ton code fait ce qu'il doit, et le garder fiable.",
  theory: `
<h3>1. Pourquoi tester ?</h3>
<p>Tu vérifies souvent ton code « à la main » : tu lances la page, tu regardes le résultat. Problème : c'est lent, on oublie des cas, et une correction peut CASSER quelque chose d'autre sans qu'on le voie. Un <strong>test unitaire</strong> est un petit programme qui VÉRIFIE AUTOMATIQUEMENT qu'une fonction renvoie bien le résultat attendu. Analogie : un banc d'essai qui rejoue toujours les mêmes contrôles, en une seconde, sans rien oublier.</p>
<div class="tip">« Unitaire » = qui teste une UNITÉ isolée (une fonction, une méthode), pas tout le site à la fois. On teste chaque brique séparément.</div>

<h3>2. PHPUnit : l'outil standard</h3>
<p><strong>PHPUnit</strong> est la bibliothèque de tests de référence en PHP. On l'installe avec Composer (leçon 20) en dépendance de DÉVELOPPEMENT (utile pour coder, pas en production).</p>
<pre class="pseudo">-- en ligne de commande :
composer require --dev phpunit/phpunit   # --dev : dépendance réservée au développement
./vendor/bin/phpunit                     # lance TOUS les tests du projet</pre>

<h3>3. Anatomie d'un test</h3>
<p>Un test est une CLASSE qui hérite de <code>TestCase</code>, contenant des MÉTHODES dont le nom commence par <code>test</code>. Chaque méthode vérifie un cas avec une <strong>assertion</strong> : une affirmation qui doit être vraie, sinon le test ÉCHOUE.</p>
<pre class="pseudo">use PHPUnit\\Framework\\TestCase;         // importe la classe de base des tests

class CalculTest extends TestCase {       // une classe de test (nom en …Test par convention)
    public function testAdditionSimple(): void { // une méthode de test (préfixe « test »)
        \$resultat = additionner(2, 3);    // ACT : on exécute le code à tester
        \$this->assertEquals(5, \$resultat); // ASSERT : on AFFIRME que le résultat vaut 5
    }                                     // si 2+3 ne donne pas 5, le test échoue (rouge)
}                                         // fin de la classe de test</pre>
<p><code>assertEquals(attendu, obtenu)</code> compare la valeur ATTENDUE (à gauche) et la valeur OBTENUE (à droite). Si elles diffèrent, PHPUnit signale l'échec avec les deux valeurs.</p>

<h3>4. Le schéma AAA : Arrange, Act, Assert</h3>
<pre class="pseudo">public function testPrixTTC(): void {     // teste un calcul de prix TTC
    // ARRANGE : préparer les données de départ
    \$prixHT = 100;                        // le prix hors taxe
    // ACT : exécuter ce qu'on teste
    \$ttc = calculerTTC(\$prixHT);          // appelle la fonction cible
    // ASSERT : vérifier le résultat
    \$this->assertEquals(120, \$ttc);       // 100 + 20% = 120 attendu
}                                         // fin du test</pre>
<div class="tip">Trois temps clairs : je PRÉPARE, j'AGIS, je VÉRIFIE. Un bon test se lit d'un coup d'œil et ne vérifie QU'UNE chose.</div>

<h3>5. Les assertions courantes</h3>
<pre class="pseudo">\$this->assertEquals(5, \$x);            // \$x doit ÉGALER 5
\$this->assertTrue(\$estValide);        // \$estValide doit être vrai
\$this->assertFalse(\$estVide);         // \$estVide doit être faux
\$this->assertNull(\$resultat);         // \$resultat doit être null
\$this->assertCount(3, \$liste);        // \$liste doit contenir exactement 3 éléments
\$this->assertContains("Catan", \$jeux); // le tableau \$jeux doit contenir « Catan »
// Tester qu'une exception est bien lancée :
\$this->expectException(InvalidArgumentException::class); // on ATTEND cette exception…
diviser(10, 0);                       // …que cet appel doit provoquer (sinon le test échoue)</pre>

<h3>6. Le cycle rouge-vert et la non-régression</h3>
<p>La démarche : on écrit un test qui ÉCHOUE (rouge) car le code n'existe pas encore, puis on écrit le code jusqu'à ce que le test PASSE (vert). Chaque test devient un FILET : si plus tard une modification casse le comportement, le test repasse au rouge et t'avertit AVANT la mise en ligne. C'est la <strong>non-régression</strong> : on garantit que ce qui marchait marche toujours.</p>
<pre class="pseudo">// Exemple : tester une méthode de la classe Jeu (POO, leçon 16)
public function testJeuEstPourEnfants(): void { // vérifie une règle métier
    \$jeu = new Jeu("Uno", 6);            // ARRANGE : un jeu à partir de 6 ans
    \$this->assertTrue(\$jeu->convientA(8)); // ASSERT : un enfant de 8 ans peut y jouer
    \$this->assertFalse(\$jeu->convientA(4)); // ASSERT : un enfant de 4 ans, non
}                                         // deux vérifications d'une même règle</pre>
<div class="warn">Un test doit être RÉPÉTABLE et INDÉPENDANT : pas de dépendance à l'ordre d'exécution, ni à une vraie base de données (on teste la LOGIQUE, pas MySQL). Pour tester du code base, on isole avec des données factices.</div>
<div class="tip">Bilan : les tests transforment « je crois que ça marche » en « je PROUVE que ça marche, automatiquement, à chaque changement ». C'est la marque d'un code professionnel et durable.</div>`,
  exercises: [

    { type: "qcm", q: "« Unitaire » signifie qu'on teste…", opts: ["Tout le site d'un coup", "Une UNITÉ isolée (une fonction, une méthode) séparément", "La base seulement", "Le serveur"], a: 1, exp: "Chaque brique est testée à part." },
    { type: "qcm", q: "PHPUnit est…", opts: ["Un serveur", "La bibliothèque de tests de référence en PHP, installée via Composer", "Un éditeur", "Une base"], a: 1, exp: "L'outil standard pour les tests PHP." },
    { type: "qcm", q: "Que signifie <code>--dev</code> dans <code>composer require --dev phpunit/phpunit</code> ?", opts: ["Version bêta", "Dépendance de DÉVELOPPEMENT : utile pour coder/tester, pas embarquée en production", "Développeur unique", "Rien"], a: 1, exp: "Les outils de test ne partent pas en production." },
    { type: "qcm", q: "Une classe de test…", opts: ["Hérite de PDO", "Hérite de TestCase et contient des méthodes dont le nom commence par « test »", "N'a pas de méthodes", "Est abstraite"], a: 1, exp: "extends TestCase + méthodes testXxx()." },
    { type: "qcm", q: "Une assertion est…", opts: ["Un commentaire", "Une AFFIRMATION qui doit être vraie ; si elle est fausse, le test échoue", "Une variable", "Une boucle"], a: 1, exp: "assertEquals, assertTrue… vérifient le résultat." },
    { type: "qcm", q: "<code>assertEquals(5, $x)</code> vérifie que…", opts: ["$x vaut 6", "$x ÉGALE la valeur attendue 5 (attendu à gauche, obtenu à droite)", "$x est vrai", "$x existe"], a: 1, exp: "Si $x n'est pas 5, PHPUnit signale l'écart." },
    { type: "qcm", q: "Le schéma AAA désigne…", opts: ["Trois assertions", "Arrange (préparer), Act (exécuter), Assert (vérifier) : les trois temps d'un bon test", "Trois classes", "Un algorithme de tri"], a: 1, exp: "Je prépare, j'agis, je vérifie : lisible d'un coup d'œil." },
    { type: "qcm", q: "<code>assertTrue($x)</code> échoue si…", opts: ["$x vaut true", "$x n'est PAS vrai", "$x existe", "jamais"], a: 1, exp: "L'assertion exige une valeur vraie." },
    { type: "qcm", q: "Pour vérifier qu'un tableau a 3 éléments, on utilise…", opts: ["assertEquals(3)", "assertCount(3, $liste)", "assertTrue(3)", "count()"], a: 1, exp: "assertCount vérifie le nombre d'éléments." },
    { type: "qcm", q: "Pour tester qu'un appel LANCE bien une exception, on écrit…", opts: ["assertTrue", "$this->expectException(NomException::class); AVANT l'appel qui doit la déclencher", "assertNull", "try sans catch"], a: 1, exp: "expectException affirme qu'une exception surviendra." },
    { type: "qcm", q: "Le cycle « rouge-vert » consiste à…", opts: ["Colorer le code", "Écrire un test qui ÉCHOUE (rouge), puis le code jusqu'à ce qu'il PASSE (vert)", "Supprimer les tests", "Tester deux fois"], a: 1, exp: "Rouge d'abord, vert ensuite : le test guide le code." },
    { type: "qcm", q: "La « non-régression » signifie…", opts: ["Le code recule", "Garantir que ce qui MARCHAIT marche toujours : un test repasse au rouge si une modif casse le comportement", "Supprimer des fonctions", "Ralentir le site"], a: 1, exp: "Les tests avertissent AVANT la mise en ligne." },
    { type: "qcm", q: "Un bon test unitaire doit être…", opts: ["Dépendant de l'ordre et de MySQL", "RÉPÉTABLE et INDÉPENDANT : il teste la LOGIQUE, sans dépendre d'une vraie base ni de l'ordre d'exécution", "Très long", "Manuel"], a: 1, exp: "On isole l'unité testée pour un résultat fiable et rapide." },
    { type: "vf", q: "Les tests transforment « je crois que ça marche » en « je prouve que ça marche, automatiquement, à chaque changement ».", a: true, exp: "C'est la marque d'un code professionnel et durable." }
  ],
  final: {
    title: "Exercice final — Tester le calcul de pénalité de retard",
    intro: `<p>La Ludothèque facture 0,50 € par jour de retard, plafonné à 10 €. On teste cette règle métier :</p>
<pre class="pseudo">// Le code à tester (fonction métier) :
function penalite(int \$joursRetard): float {   // calcule la pénalité en euros
    if (\$joursRetard &lt;= 0) return 0.0;          // pas de retard → 0
    \$montant = \$joursRetard * 0.5;              // 0,50 € par jour
    return min(\$montant, 10.0);                 // plafonné à 10 €
}                                              // fin de la fonction

// La classe de test :
use PHPUnit\\Framework\\TestCase;               // importe TestCase
class PenaliteTest extends TestCase {          // classe de test (…Test)
    public function testAucunRetard(): void {   // (1) cas « pas de retard »
        \$this->assertEquals(0.0, penalite(0));  // 0 jour → 0 €
    }                                          // fin du test
    public function testRetardNormal(): void {  // (2) cas courant
        \$this->assertEquals(2.5, penalite(5));  // 5 jours × 0,50 = 2,50 €
    }                                          // fin du test
    public function testPlafond(): void {       // (3) cas limite : le plafond
        \$this->assertEquals(10.0, penalite(40)); // 40 × 0,50 = 20 € → plafonné à 10 €
    }                                          // fin du test
}                                              // fin de la classe de test</pre>`,
    questions: [
      { type: "qcm", q: "(1) Que vérifie <code>testAucunRetard</code> ?", opts: ["Que le code plante", "Le cas limite « 0 jour » : la pénalité doit valoir 0 € (assertEquals(0.0, penalite(0)))", "Le plafond", "La base"], a: 1, exp: "On teste explicitement le cas sans retard." },
      { type: "qcm", q: "(2) Pourquoi tester aussi un cas « normal » (5 jours) ?", opts: ["Inutile", "Pour vérifier le calcul standard (5 × 0,50 = 2,50), pas seulement les cas limites", "Pour ralentir", "Pour la base"], a: 1, exp: "On couvre le comportement courant ET les cas limites." },
      { type: "qcm", q: "(3) Que valide <code>testPlafond</code> ?", opts: ["Que 40 jours = 20 €", "Que le PLAFOND s'applique : 40 jours donneraient 20 €, mais le résultat doit être plafonné à 10 €", "Que la fonction plante", "Rien"], a: 1, exp: "Le cas limite du plafonnement, facile à oublier à la main." },
      { type: "qcm", q: "Si quelqu'un modifie <code>penalite</code> et retire le <code>min(..., 10.0)</code>, que se passe-t-il ?", opts: ["Rien", "testPlafond ÉCHOUE (rouge) : le test détecte la régression AVANT toute mise en ligne", "Les trois tests passent", "La base est corrompue"], a: 1, exp: "C'est la non-régression : le filet de sécurité se déclenche." },
      { type: "qcm", q: "Pourquoi ces tests sont-ils fiables et rapides ?", opts: ["Ils utilisent MySQL", "Ils testent une LOGIQUE pure (une fonction), sans base ni réseau : répétables, indépendants, instantanés", "Ils sont manuels", "Ils dépendent de l'ordre"], a: 1, exp: "Un test unitaire isole la logique de toute dépendance externe." }
    ],
    solution: `<pre class="pseudo">use PHPUnit\\Framework\\TestCase;                 // importe la classe de base
class PenaliteTest extends TestCase {            // classe de test

    public function testAucunRetard(): void {     // ARRANGE/ACT/ASSERT en une ligne
        \$this->assertEquals(0.0, penalite(0));    // 0 jour → 0 € (cas limite bas)
    }                                            // fin

    public function testRetardNormal(): void {    // cas courant
        \$this->assertEquals(2.5, penalite(5));    // 5 × 0,50 = 2,50 €
    }                                            // fin

    public function testPlafond(): void {         // cas limite haut
        \$this->assertEquals(10.0, penalite(40));  // 20 € ramené au plafond de 10 €
    }                                            // fin

    public function testRetardNegatifIgnore(): void { // robustesse : entrée absurde
        \$this->assertEquals(0.0, penalite(-3));   // un retard négatif → 0 €, pas d'erreur
    }                                            // fin
}                                                // fin de la classe

// On lance : ./vendor/bin/phpunit
// 4 tests, 4 assertions → OK (vert). Une régression future les ferait passer au rouge.

// À retenir :
// · test = classe extends TestCase, méthodes testXxx, assertions   // structure
// · schéma AAA : Arrange, Act, Assert                              // lisibilité
// · couvrir cas courant ET cas limites (0, plafond, négatif)       // exhaustivité
// · non-régression : le filet qui protège tes futures modifications</pre>
<p>Félicitations : tu sais prouver que ton code marche et le garder fiable dans le temps. Tu as terminé les 10 approfondissements — place au projet guidé, puis à l'examen final.</p>`
  }
};
