<script>
var DAY = {
  num: 23,
  title: "Expressions régulières (PCRE)",
  subtitle: "Décrire un motif de texte pour le chercher, le valider ou le remplacer.",
  theory: `
<h3>1. Qu'est-ce qu'une expression régulière ?</h3>
<p>Une <strong>expression régulière</strong> (regex, ou motif) est une petite langue qui DÉCRIT une forme de texte : « 5 chiffres », « un mot suivi d'un @ », « une date jj/mm/aaaa ». Analogie : un POCHOIR — au lieu de chercher un texte exact, on cherche tout ce qui a la bonne forme. PHP utilise la variante PCRE (« Perl Compatible Regular Expressions »).</p>
<pre class="pseudo">// Un motif s'écrit entre DÉLIMITEURS (souvent des /) :
"/chat/"        // cherche la suite de lettres c-h-a-t n'importe où dans le texte
"/^chat\$/"     // ^ = début, \$ = fin → le texte doit être EXACTEMENT « chat »</pre>

<h3>2. preg_match : est-ce que ça correspond ?</h3>
<p><code>preg_match(motif, texte)</code> renvoie <code>1</code> si le motif est trouvé, <code>0</code> sinon. C'est le test de base.</p>
<pre class="pseudo">\$ok = preg_match("/chat/", "un chaton mignon"); // cherche « chat » dans la chaîne
// \$ok vaut 1 : « chat » est présent (dans « chaton »)
if (preg_match("/^\\d+\$/", \$saisie)) {          // \\d = un chiffre, + = un ou plus, ^…\$ = tout le texte
    echo "Que des chiffres !";                   // ne s'affiche que si la saisie est 100 % chiffres
}                                               // fin du test</pre>
<div class="warn">preg_match renvoie <code>1</code>/<code>0</code> (trouvé/pas trouvé) et <code>false</code> en cas d'ERREUR de motif. Teste avec <code>===</code> si tu dois distinguer l'erreur.</div>

<h3>3. Les classes de caractères prédéfinies</h3>
<pre class="pseudo">// Chaque symbole représente UN caractère d'une certaine catégorie :
\\d    // un CHIFFRE (0-9)              — « d » comme digit
\\w    // un caractère de MOT (lettre, chiffre, _)   — « w » comme word
\\s    // un ESPACE (espace, tab, saut de ligne)     — « s » comme space
.     // N'IMPORTE quel caractère (sauf saut de ligne)
[abc] // exactement a, OU b, OU c      — une classe sur mesure
[a-z] // une lettre minuscule de a à z  — un intervalle
[^0-9]// TOUT SAUF un chiffre           — le ^ en tête d'une classe = négation</pre>

<h3>4. Les quantificateurs : combien de fois ?</h3>
<pre class="pseudo">// Placés APRÈS un motif, ils indiquent la répétition :
*      // 0, 1 ou PLUSIEURS fois
+      // 1 ou plusieurs fois (au moins une)
?      // 0 ou 1 fois (facultatif)
{3}    // exactement 3 fois
{2,4}  // entre 2 et 4 fois
{2,}   // au moins 2 fois
// Exemple : "/^\\d{5}\$/" = exactement 5 chiffres → un code postal français</pre>
<div class="tip">Lire un motif = le décomposer symbole par symbole. <code>^\\d{5}\$</code> se lit : début, cinq chiffres, fin. Rien d'autre n'est accepté.</div>

<h3>5. Les ancres et les groupes</h3>
<pre class="pseudo">^      // ANCRE de début de chaîne
\$      // ANCRE de fin de chaîne
|      // OU logique : "/chat|chien/" = « chat » OU « chien »
(...)  // un GROUPE : rassemble et CAPTURE une partie du motif
// Exemple date : "/^(\\d{2})\\/(\\d{2})\\/(\\d{4})\$/"
//   deux chiffres / deux chiffres / quatre chiffres, chaque bloc CAPTURÉ dans un groupe</pre>
<p>Le <code>/</code> à l'intérieur du motif doit être ÉCHAPPÉ en <code>\\/</code> car <code>/</code> sert de délimiteur. Plus généralement, un caractère spécial (<code>. + * ? ( )</code>…) qu'on veut prendre au sens LITTÉRAL se précède d'un <code>\\</code> : <code>\\.</code> = un vrai point.</p>

<h3>6. Récupérer les morceaux et remplacer</h3>
<pre class="pseudo">// preg_match avec un 3e argument REMPLIT un tableau de captures :
if (preg_match("/^(\\d{2})\\/(\\d{2})\\/(\\d{4})\$/", "14/07/2026", \$m)) { // \$m reçoit les captures
    // \$m[0] = « 14/07/2026 » (tout), \$m[1] = « 14 », \$m[2] = « 07 », \$m[3] = « 2026 »
    echo "Année : " . \$m[3];                     // affiche 2026
}                                               // fin du test

// preg_replace REMPLACE tout ce qui correspond :
\$propre = preg_replace("/\\s+/", " ", \$texte);   // remplace toute suite d'espaces par UN seul espace</pre>
<div class="warn">Ne réinvente pas la roue : pour un e-mail, préfère <code>filter_var(\$mail, FILTER_VALIDATE_EMAIL)</code> (leçon 13), plus fiable qu'un regex maison. La regex brille pour les formats SUR MESURE (référence de jeu, code interne, nettoyage de texte).</div>`,
  exercises: [
    { type: "qcm", q: "Une expression régulière sert à…", opts: ["Calculer", "DÉCRIRE une forme de texte pour la chercher, la valider ou la remplacer", "Se connecter à la base", "Trier un tableau"], a: 1, exp: "Un « pochoir » : on cherche la forme, pas un texte exact." },
    { type: "qcm", q: "Le motif s'écrit entre…", opts: ["Des guillemets seulement", "des DÉLIMITEURS, souvent des / : /motif/", "des { }", "des [ ]"], a: 1, exp: "Le / de début et de fin encadre le motif." },
    { type: "qcm", q: "<code>preg_match(\"/chat/\", \"chaton\")</code> renvoie…", opts: ["0", "1 : « chat » est présent dans « chaton »", "false", "« chat »"], a: 1, exp: "Sans ancres, le motif est cherché n'importe où dans le texte." },
    { type: "qcm", q: "Que représente <code>\\d</code> ?", opts: ["Une lettre", "UN chiffre (digit, 0-9)", "Un espace", "N'importe quoi"], a: 1, exp: "\\d = digit ; \\w = word ; \\s = space." },
    { type: "qcm", q: "Que représente <code>\\w</code> ?", opts: ["Un espace", "Un caractère de MOT : lettre, chiffre ou _", "Un chiffre uniquement", "La fin de ligne"], a: 1, exp: "« w » comme word." },
    { type: "qcm", q: "Que fait le quantificateur <code>+</code> ?", opts: ["0 ou 1 fois", "1 ou PLUSIEURS fois (au moins une)", "Exactement une", "0 ou plusieurs"], a: 1, exp: "+ = au moins un ; * = zéro ou plus ; ? = facultatif." },
    { type: "qcm", q: "<code>\\d{5}</code> signifie…", opts: ["5 caractères quelconques", "EXACTEMENT 5 chiffres", "au moins 5 chiffres", "un chiffre 5"], a: 1, exp: "{n} = exactement n répétitions." },
    { type: "qcm", q: "Le rôle de <code>^</code> et <code>$</code> dans un motif ?", opts: ["Des chiffres", "ANCRES : ^ = début du texte, $ = fin ; ensemble ils forcent une correspondance TOTALE", "Des OU logiques", "Des groupes"], a: 1, exp: "^\\d{5}$ = tout le texte doit être 5 chiffres." },
    { type: "qcm", q: "La classe <code>[a-z]</code> correspond à…", opts: ["Le texte « a-z »", "UNE lettre minuscule de a à z", "3 caractères", "Un chiffre"], a: 1, exp: "Les crochets = une classe ; le tiret = un intervalle." },
    { type: "qcm", q: "Que fait <code>[^0-9]</code> ?", opts: ["Un chiffre", "TOUT SAUF un chiffre — le ^ en tête de classe = négation", "Le caractère ^", "Rien"], a: 1, exp: "^ juste après [ inverse la classe." },
    { type: "qcm", q: "Pour matcher un vrai point (.), on écrit…", opts: [".", "\\. car . seul signifie « n'importe quel caractère »", "[.]interdit", "point"], a: 1, exp: "Le \\ prend un caractère spécial au sens littéral." },
    { type: "qcm", q: "Le <code>|</code> dans <code>/chat|chien/</code> signifie…", opts: ["ET", "OU : « chat » OU « chien »", "SAUF", "un tuyau"], a: 1, exp: "L'alternative logique." },
    { type: "qcm", q: "Un groupe <code>(...)</code> sert à…", opts: ["Commenter", "rassembler ET CAPTURER une partie du motif, récupérable ensuite", "diviser", "ancrer"], a: 1, exp: "Les captures atterrissent dans le tableau $m de preg_match." },
    { type: "qcm", q: "Pour valider un e-mail, mieux vaut…", opts: ["Un long regex maison", "filter_var($m, FILTER_VALIDATE_EMAIL), plus fiable ; la regex sert aux formats SUR MESURE", "preg_match(\"/@/\")", "Ne rien valider"], a: 1, exp: "Ne réinvente pas la roue quand un outil dédié existe." },
    { type: "vf", q: "<code>preg_replace(\"/\\s+/\", \" \", $t)</code> réduit toute suite d'espaces à un seul espace.", a: true, exp: "\\s+ = une ou plusieurs espaces, remplacées par un espace unique." }
  ],
  final: {
    title: "Exercice final — Valider une référence de jeu",
    intro: `<p>La Ludothèque code ses jeux avec une référence stricte : 2 lettres MAJUSCULES, un tiret, puis 4 chiffres (ex : <code>CA-2026</code>). On valide et on extrait :</p>
<pre class="pseudo">\$ref = "CA-2026";                                       // la référence à contrôler
\$motif = "/^([A-Z]{2})-(\\d{4})\$/";                     // (1) le pochoir exact
// décomposé : ^ début · [A-Z]{2} deux majuscules (groupe 1) · - un tiret ·
//             \\d{4} quatre chiffres (groupe 2) · \$ fin

if (preg_match(\$motif, \$ref, \$m)) {                     // (2) teste ET capture dans \$m
    \$prefixe = \$m[1];                                    // « CA »
    \$annee   = \$m[2];                                    // « 2026 »
    echo "Valide — préfixe \$prefixe, année \$annee";      // référence correcte
} else {                                                 // (3) le motif n'a pas matché
    echo "Référence invalide";                            // format refusé
}                                                        // fin

// Nettoyage d'une saisie avant contrôle :
\$saisie = preg_replace("/\\s+/", "", " ca - 2026 ");     // (4) retire TOUS les espaces
\$saisie = strtoupper(\$saisie);                          // met en majuscules → « CA-2026 »</pre>`,
    questions: [
      { type: "qcm", q: "(1) Que refuse le motif <code>/^([A-Z]{2})-(\\d{4})$/</code> ?", opts: ["Rien", "Tout ce qui n'est pas EXACTEMENT 2 majuscules, un tiret, 4 chiffres — ex : « ca-2026 », « CAT-26 », « CA-2026 » avec un espace", "Seulement les chiffres", "Les tirets"], a: 1, exp: "Les ancres ^ et $ imposent une correspondance totale et stricte." },
      { type: "qcm", q: "(2) Après un match, que contient <code>$m</code> ?", opts: ["Juste true", "$m[0] = « CA-2026 » (tout), $m[1] = « CA » (groupe 1), $m[2] = « 2026 » (groupe 2)", "Le motif", "Un nombre"], a: 1, exp: "L'indice 0 = correspondance entière, puis un indice par groupe capturant." },
      { type: "qcm", q: "(3) Quand exécute-t-on le <code>else</code> ?", opts: ["Toujours", "Quand preg_match renvoie 0 : la saisie ne respecte pas le format", "Jamais", "En cas d'erreur SQL"], a: 1, exp: "0 = pas de correspondance → format invalide." },
      { type: "qcm", q: "(4) À quoi sert <code>preg_replace(\"/\\s+/\", \"\", ...)</code> ici ?", opts: ["À valider", "À NETTOYER la saisie en supprimant tous les espaces avant de la contrôler (tolérance à l'utilisateur)", "À ajouter des espaces", "À couper le texte"], a: 1, exp: "On normalise l'entrée avant la validation stricte." },
      { type: "qcm", q: "Pourquoi ne PAS utiliser cette regex pour valider un e-mail ?", opts: ["Trop rapide", "Un e-mail a des règles complexes : filter_var(FILTER_VALIDATE_EMAIL) est plus fiable ; la regex sert aux formats maison comme cette référence", "La regex ne marche pas sur les mails", "Il faut la base"], a: 1, exp: "Outil dédié pour l'e-mail, regex pour les formats sur mesure." }
    ],
    solution: `<pre class="pseudo">function validerRef(string \$saisie): ?array {          // renvoie les captures ou null
    \$s = preg_replace("/\\s+/", "", \$saisie);           // 1) retire tous les espaces
    \$s = strtoupper(\$s);                                // 2) uniformise en majuscules
    if (preg_match("/^([A-Z]{2})-(\\d{4})\$/", \$s, \$m)) { // 3) teste le format strict + capture
        return ["prefixe" => \$m[1], "annee" => \$m[2]];    // 4) renvoie les deux morceaux
    }                                                   // fin du if
    return null;                                        // 5) format invalide → null
}                                                       // fin de la fonction

\$r = validerRef(" ca - 2026 ");                         // saisie « sale »
if (\$r !== null) {                                      // null = invalide
    echo "OK : " . \$r["prefixe"] . " / " . \$r["annee"]; // affiche « CA / 2026 »
}                                                       // fin

// À retenir :
// · \\d \\w \\s = classes prédéfinies    // catégories de caractères
// · + * ? {n} = quantificateurs         // combien de fois
// · ^ \$ = ancres, (...) = captures      // délimiter et récupérer</pre>
<p>Tu sais décrire, valider et extraire des formats de texte. Demain, un domaine où les erreurs sont classiques : les dates et les heures.</p>`
  }
};
</script>
