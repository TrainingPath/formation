<script>
var DAY = {
  num: 21,
  title: "POO avancée : interfaces et traits",
  subtitle: "Promettre des méthodes (interfaces) et partager du code sans hériter (traits).",
  theory: `
<h3>1. Rappel : la classe abstraite</h3>
<p>Une <strong>classe abstraite</strong> est un MODÈLE incomplet : on ne peut pas en créer d'objet directement, elle sert de base à des classes filles. Elle peut contenir des méthodes déjà écrites ET des méthodes <em>abstraites</em> (juste annoncées, à écrire par les filles).</p>
<pre class="pseudo">abstract class Jeu {                    // « abstract » = classe modèle, non instanciable
    abstract public function regles(): string;  // méthode PROMISE : chaque fille devra l'écrire
    public function presenter(): string {        // méthode déjà écrite, héritée telle quelle
        return "Voici les règles : " . \$this->regles();  // appelle la méthode que la fille fournira
    }                                    // fin de la méthode concrète
}                                        // fin de la classe abstraite</pre>
<div class="warn"><code>new Jeu()</code> est INTERDIT : une classe abstraite est un plan, pas un objet fini. On instancie ses filles.</div>

<h3>2. L'interface : un CONTRAT de méthodes</h3>
<p>Une <strong>interface</strong> est une liste de méthodes qu'une classe PROMET de fournir, sans en écrire le corps. C'est un CONTRAT : « si tu dis implémenter <code>Affichable</code>, tu DOIS avoir une méthode <code>afficher()</code> ». Analogie : une prise électrique normalisée — peu importe l'appareil, s'il a la bonne fiche, il se branche.</p>
<pre class="pseudo">interface Affichable {                  // un contrat nommé « Affichable »
    public function afficher(): string;  // toute classe qui signe DOIT fournir cette méthode
}                                        // (pas de corps : juste la promesse)

class Jeu implements Affichable {        // « implements » = je signe le contrat Affichable
    public function __construct(public string \$titre) {}  // un titre
    public function afficher(): string {  // OBLIGATOIRE, sinon erreur fatale
        return "Jeu : " . \$this->titre;   // le corps, écrit par la classe
    }                                    // fin de la méthode
}                                        // fin de la classe</pre>
<p>Différence clé avec l'héritage : une classe n'hérite que d'UNE seule classe parente, mais peut implémenter PLUSIEURS interfaces (contrats). On sépare les virgules :</p>
<pre class="pseudo">class Jeu implements Affichable, JsonSerializable { … }  // deux contrats signés à la fois</pre>

<h3>3. Pourquoi des interfaces ? Le polymorphisme</h3>
<p>Le <strong>polymorphisme</strong> (« plusieurs formes ») : du code qui manipule un CONTRAT fonctionne avec N'IMPORTE quelle classe qui le respecte, sans connaître son type exact.</p>
<pre class="pseudo">function montrer(Affichable \$element) {   // accepte TOUT objet qui signe Affichable
    echo \$element->afficher();            // sûr : le contrat GARANTIT que afficher() existe
}                                        // peu importe si c'est un Jeu, un Membre, une Carte…
montrer(new Jeu("Catan"));               // marche
montrer(new Membre("Léa"));              // marche aussi, si Membre implements Affichable</pre>
<div class="tip">On programme « vers un contrat, pas vers une classe » : le code devient interchangeable et testable. C'est un pilier du code professionnel.</div>

<h3>4. Le trait : partager du code SANS hériter</h3>
<p>Problème : PHP interdit l'héritage multiple (une classe = un seul parent). Mais parfois plusieurs classes sans lien de parenté ont besoin du MÊME bout de code. Un <strong>trait</strong> est un BLOC de méthodes réutilisable qu'on « colle » dans n'importe quelle classe avec <code>use</code>. Analogie : un tampon encreur — le même motif appliqué sur des feuilles différentes.</p>
<pre class="pseudo">trait Horodatable {                     // un bloc de code réutilisable
    public function maintenant(): string {  // une méthode toute prête
        return date("Y-m-d H:i:s");      // renvoie la date/heure courante
    }                                    // fin de la méthode
}                                        // fin du trait

class Jeu {                             // une classe quelconque
    use Horodatable;                     // COLLE les méthodes du trait dans cette classe
}                                        // Jeu possède maintenant maintenant()
class Membre {                          // une autre classe, sans lien avec Jeu
    use Horodatable;                     // le MÊME code, réutilisé sans héritage
}                                        // Membre a aussi maintenant()</pre>

<h3>5. Interface + trait : le duo gagnant</h3>
<p>Une interface DÉCLARE l'obligation (le quoi), un trait FOURNIT une implémentation par défaut (le comment). Ensemble, ils évitent la copie-colle.</p>
<pre class="pseudo">interface Loggable {                    // contrat : savoir se journaliser
    public function journal(): string;   // méthode promise
}                                        // fin du contrat
trait JournalSimple {                   // implémentation partageable
    public function journal(): string {  // remplit le contrat
        return "[LOG] " . static::class; // renvoie le nom de la classe courante
    }                                    // fin de la méthode
}                                        // fin du trait
class Jeu implements Loggable {         // signe le contrat…
    use JournalSimple;                   // …et récupère l'implémentation toute faite
}                                        // Jeu respecte Loggable sans écrire de code</pre>
<div class="warn">Quand choisir ? INTERFACE pour imposer un contrat sans code. TRAIT pour partager du code concret. HÉRITAGE pour une vraie relation « est un(e) ». Ne pas tout mettre dans l'héritage.</div>`,
  exercises: [
    { type: "qcm", q: "Une classe abstraite…", opts: ["Se crée avec new normalement", "Est un MODÈLE non instanciable : on ne peut pas faire new dessus, elle sert de base aux filles", "N'a pas de méthodes", "Remplace les interfaces"], a: 1, exp: "abstract = plan incomplet, on instancie ses filles." },
    { type: "qcm", q: "Une méthode abstraite…", opts: ["A toujours un corps", "Est ANNONCÉE sans corps : chaque classe fille DOIT l'écrire", "Est privée", "Ne peut pas exister"], a: 1, exp: "La fille fournit l'implémentation promise par le parent." },
    { type: "qcm", q: "Une interface est…", opts: ["Une classe normale", "Un CONTRAT : la liste des méthodes qu'une classe promet de fournir, sans corps", "Un tableau", "Une variable"], a: 1, exp: "Comme une prise normalisée : signe le contrat, fournis les méthodes." },
    { type: "qcm", q: "Le mot-clé pour signer une interface est…", opts: ["extends", "implements", "use", "new"], a: 1, exp: "class X implements Affichable { … }." },
    { type: "qcm", q: "Que se passe-t-il si une classe implements Affichable mais oublie afficher() ?", opts: ["Rien", "ERREUR FATALE : le contrat oblige à fournir toutes ses méthodes", "afficher() est créée vide", "Un warning ignoré"], a: 1, exp: "Le contrat est vérifié par PHP : signer oblige à remplir." },
    { type: "qcm", q: "Combien d'interfaces une classe peut-elle implémenter ?", opts: ["Une seule", "PLUSIEURS, séparées par des virgules — contrairement à l'héritage (un seul parent)", "Zéro", "Deux au maximum"], a: 1, exp: "implements A, B, C : c'est autorisé et courant." },
    { type: "qcm", q: "Le polymorphisme permet…", opts: ["De copier des classes", "D'écrire du code qui manipule un CONTRAT et fonctionne avec toute classe le respectant, sans connaître son type", "De supprimer des objets", "D'accélérer PHP"], a: 1, exp: "function montrer(Affichable $x) accepte Jeu, Membre, Carte…" },
    { type: "qcm", q: "« Programmer vers un contrat, pas vers une classe » signifie…", opts: ["Ne jamais créer de classe", "Dépendre de l'interface (ce qui est promis) plutôt que d'une implémentation précise : code interchangeable", "Éviter la POO", "Tout mettre en abstract"], a: 1, exp: "Souplesse et testabilité : un pilier du code pro." },
    { type: "qcm", q: "Un trait sert à…", opts: ["Créer un objet", "PARTAGER un bloc de méthodes entre des classes sans lien de parenté, sans héritage", "Déclarer un contrat", "Se connecter à la base"], a: 1, exp: "Un « tampon encreur » de code réutilisable." },
    { type: "qcm", q: "On insère un trait dans une classe avec…", opts: ["implements", "use NomDuTrait; à l'intérieur de la classe", "extends", "include"], a: 1, exp: "use colle les méthodes du trait dans la classe." },
    { type: "qcm", q: "Pourquoi les traits existent-ils en PHP ?", opts: ["Pour remplacer les fonctions", "Parce que l'héritage multiple est INTERDIT : le trait partage du code entre classes non apparentées", "Pour créer des interfaces", "Par décoration"], a: 1, exp: "Une classe n'a qu'un parent, mais peut cumuler des traits." },
    { type: "qcm", q: "Différence interface vs trait ?", opts: ["Aucune", "L'interface DÉCLARE l'obligation (sans code) ; le trait FOURNIT du code concret partageable", "Le trait est plus lent", "L'interface a un corps"], a: 1, exp: "Le quoi (interface) vs le comment (trait)." },
    { type: "qcm", q: "Quand privilégier l'héritage plutôt qu'une interface ou un trait ?", opts: ["Toujours", "Pour une vraie relation « est un(e) » avec du code et un état partagés par une lignée de classes", "Jamais", "Pour partager entre classes non liées"], a: 1, exp: "Héritage = filiation ; interface = contrat ; trait = code partagé." },
    { type: "qcm", q: "<code>static::class</code> dans un trait renvoie…", opts: ["Le nom du trait", "Le nom de la CLASSE qui utilise le trait à l'exécution", "toujours « self »", "une erreur"], a: 1, exp: "Pratique pour un log générique du nom de classe réel." },
    { type: "vf", q: "Une classe peut hériter d'UN seul parent mais implémenter PLUSIEURS interfaces et utiliser PLUSIEURS traits.", a: true, exp: "Un seul extends, mais implements et use se cumulent." }
  ],
  final: {
    title: "Exercice final — Le contrat Exportable de la Ludothèque",
    intro: `<p>On veut que jeux ET membres sachent s'exporter en ligne de texte. Un contrat + un trait font le travail :</p>
<pre class="pseudo">interface Exportable {                   // (1) le contrat
    public function exporter(): string;   // méthode promise : produire une ligne de texte
}                                         // fin du contrat

trait ExportCsv {                         // (2) implémentation partageable
    public function exporter(): string {   // remplit le contrat
        return implode(";", get_object_vars(\$this)); // colle toutes les propriétés séparées par ;
    }                                     // fin de la méthode
}                                         // fin du trait

class Jeu implements Exportable {         // signe le contrat
    use ExportCsv;                         // (3) récupère l'implémentation
    public function __construct(public string \$titre, public int \$joueurs) {}  // deux propriétés
}                                         // fin de la classe
class Membre implements Exportable {      // même contrat, classe SANS lien avec Jeu
    use ExportCsv;                         // même code réutilisé
    public function __construct(public string \$nom) {}  // une propriété
}                                         // fin de la classe

function ligne(Exportable \$e): void {     // (4) accepte TOUT Exportable
    echo \$e->exporter() . "\\n";           // sûr : le contrat garantit exporter()
}                                         // fin de la fonction
ligne(new Jeu("Catan", 4));               // affiche « Catan;4 »
ligne(new Membre("Léa"));                 // affiche « Léa »</pre>`,
    questions: [
      { type: "qcm", q: "(1) Rôle de l'interface Exportable ?", opts: ["Fournir du code", "IMPOSER que toute classe signataire possède une méthode exporter() — un contrat vérifié par PHP", "Créer des objets", "Se connecter à la base"], a: 1, exp: "L'interface déclare l'obligation, sans corps." },
      { type: "qcm", q: "(2) Pourquoi un TRAIT et pas de l'héritage pour ExportCsv ?", opts: ["Par hasard", "Jeu et Membre n'ont AUCUN lien de parenté : le trait partage le code sans les forcer dans une même lignée", "Le trait est plus rapide", "L'héritage est interdit ici"], a: 1, exp: "Traits = partage entre classes non apparentées." },
      { type: "qcm", q: "(3) Grâce à <code>use ExportCsv;</code>, la classe Jeu…", opts: ["Reste incomplète", "Possède exporter() sans l'écrire, ce qui satisfait le contrat Exportable", "Devient abstraite", "Perd ses propriétés"], a: 1, exp: "Le trait fournit l'implémentation, l'interface est satisfaite." },
      { type: "qcm", q: "(4) Pourquoi <code>ligne()</code> accepte-t-elle Jeu ET Membre ?", opts: ["Elle teste le type", "Polymorphisme : elle attend un Exportable, et les deux signent ce contrat — leur type exact importe peu", "Par chance", "Elle les convertit"], a: 1, exp: "On programme vers le contrat, pas vers la classe." },
      { type: "qcm", q: "On ajoute une classe Editeur qui doit aussi s'exporter. Le minimum à écrire ?", opts: ["Recopier exporter()", "class Editeur implements Exportable { use ExportCsv; … } : deux mots, zéro copie de code", "Une classe abstraite", "Rien, c'est automatique"], a: 1, exp: "implements + use : le contrat signé, le code réutilisé." }
    ],
    solution: `<pre class="pseudo">// Une 3e classe, sans copier une seule ligne de logique :
class Editeur implements Exportable {     // signe le contrat Exportable
    use ExportCsv;                         // récupère exporter() du trait
    public function __construct(            // constructeur
        public string \$nom,                 // nom de l'éditeur
        public string \$pays                 // pays
    ) {}                                   // corps vide (propriétés promues)
}                                         // fin de la classe
ligne(new Editeur("Kosmos", "Allemagne")); // affiche « Kosmos;Allemagne »

// Récapitulatif des 3 outils :
// · interface → le CONTRAT (le quoi), vérifié par PHP        // impose sans coder
// · trait     → le CODE partagé (le comment), sans héritage  // évite la copie
// · polymorphisme → un même code manipule tous les signataires</pre>
<p>Interface pour le contrat, trait pour le code, polymorphisme pour la souplesse : la POO devient un jeu de briques. Demain : gérer proprement les erreurs avec les exceptions.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code PHP ici…",
  items: [
  { id: "php-traits", title: "Contrat Affichable + trait partagé", level: 3,
    statement: "Crée une interface <code>Affichable</code> (méthode <code>afficher(): string</code>) et un trait <code>AffichageTitre</code> qui l'implémente en renvoyant le titre en majuscules. Fais-en profiter une classe <code>Jeu</code> et une classe <code>Editeur</code>. Écris une fonction qui prend un <code>Affichable</code> et l'affiche (polymorphisme).",
    hints: [
      "interface Affichable { public function afficher(): string; } — juste la promesse, pas de corps.",
      "trait AffichageTitre { public function afficher(): string { return strtoupper($this->titre); } } — les deux classes devront avoir une propriété $titre.",
      "class Jeu implements Affichable { use AffichageTitre; … } puis une fonction montrer(Affichable $x) { echo $x->afficher(); }"
    ],
    solution: "<?php                                          // ouverture PHP\ninterface Affichable {                         // le CONTRAT\n    public function afficher(): string;         // méthode promise (aucun corps)\n}                                              // fin de l'interface\n\ntrait AffichageTitre {                         // implémentation partageable\n    public function afficher(): string {        // remplit le contrat\n        return strtoupper($this->titre);        // renvoie le titre en MAJUSCULES\n    }                                          // fin de la méthode\n}                                              // fin du trait\n\nclass Jeu implements Affichable {              // signe le contrat\n    use AffichageTitre;                         // récupère afficher() du trait\n    public function __construct(public string $titre) {} // propriété $titre promue\n}                                              // fin de la classe\n\nclass Editeur implements Affichable {          // classe SANS lien avec Jeu\n    use AffichageTitre;                         // même code réutilisé, zéro copie\n    public function __construct(public string $titre) {} // ici $titre = le nom de l'éditeur\n}                                              // fin de la classe\n\nfunction montrer(Affichable $element): void {  // accepte TOUT Affichable (polymorphisme)\n    echo $element->afficher() . \"\\n\";          // sûr : le contrat garantit afficher()\n}                                              // fin de la fonction\n\nmontrer(new Jeu(\"Catan\"));                     // affiche « CATAN »\nmontrer(new Editeur(\"Kosmos\"));                // affiche « KOSMOS »\n?>",
    note: "L'interface impose la méthode, le trait la fournit une seule fois, et la fonction montrer() marche pour toute classe signataire : c'est le polymorphisme, un pilier du code réutilisable." }
  ]
};
