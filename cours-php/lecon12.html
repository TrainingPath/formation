<body>
<script>
var DAY = {
  num: 12,
  title: "Formulaires : $_GET et $_POST",
  subtitle: "Le Lire(...) du web : recevoir des données du visiteur.",
  theory: `
<h3>1. Le Lire() du web</h3>
<p>En console, <code>Lire(n)</code> attendait une saisie au clavier. Sur le web, l'utilisateur remplit un <strong>formulaire HTML</strong> (une série de champs à remplir) et l'envoie au serveur. PHP récupère alors les données dans deux tableaux associatifs « magiques » appelés <strong>superglobales</strong> — « super » car accessibles partout, même dans les fonctions, sans rien déclarer : <code>$_GET</code> et <code>$_POST</code>.</p>

<h3>2. Le formulaire HTML</h3>
<pre class="pseudo">&lt;form action="traitement.php" method="post"&gt;   // &lt;form&gt; = un formulaire ; action = où envoyer ; method = comment (post ici)
    &lt;input type="text" name="prenom"&gt;           // un champ texte ; name = la CLÉ sous laquelle PHP recevra la valeur
    &lt;input type="number" name="age"&gt;            // un champ nombre ; sa clé sera "age"
    &lt;input type="submit" value="Envoyer"&gt;       // le bouton qui déclenche l'envoi du formulaire
&lt;/form&gt;                                         // ferme le formulaire</pre>
<ul>
<li><code>action</code> : le script PHP qui recevra les données.</li>
<li><code>method</code> : <code>get</code> ou <code>post</code> (voir section 4).</li>
<li><code>name</code> : la CLÉ sous laquelle PHP recevra la valeur — capital ! Sans <code>name</code>, le champ n'est pas envoyé.</li>
</ul>

<h3>3. Réception côté PHP</h3>
<pre class="pseudo">// traitement.php                       // le fichier qui reçoit les données envoyées
$prenom = $_POST["prenom"] ?? "";        // récupère le champ "prenom" ; ?? "" évite un warning si absent
$age = (int) ($_POST["age"] ?? 0);       // (int) = CAST : tout arrive en string, il faut convertir en entier pour calculer
echo "Bonjour $prenom, tu as $age ans";  // on peut maintenant utiliser les valeurs reçues</pre>
<div class="warn">TOUT ce qui vient d'un formulaire est une <strong>string</strong>, même les nombres ! <code>$_POST["age"]</code> vaut <code>"15"</code> (texte), pas 15. Caste avec <code>(int)</code> ou <code>(float)</code> avant de calculer. Et une clé absente déclenche un warning : le <code>??</code> est ton réflexe systématique.</div>

<h3>4. GET ou POST ?</h3>
<pre class="pseudo">GET  : données DANS L'URL → page.php?prenom=Ana&amp;age=15     // les valeurs sont écrites dans l'adresse
       visible, partageable, longueur limitée   → recherches, filtres, pagination   // usage : consulter
POST : données dans le CORPS de la requête, invisibles dans l'URL   // les valeurs voyagent cachées
       → mots de passe, inscriptions, tout ce qui MODIFIE ou est sensible   // usage : envoyer du sensible</pre>
<p>Règle simple : <code>GET</code> pour consulter/partager (l'URL décrit l'état), <code>POST</code> pour envoyer du sensible ou modifier des données.</p>

<h3>5. Détecter la soumission</h3>
<p>Motif classique : un seul fichier affiche le formulaire ET le traite selon le cas.</p>
<pre class="pseudo">if ($_SERVER["REQUEST_METHOD"] === "POST") {   // la page a-t-elle été appelée par une SOUMISSION de formulaire ?
    // oui : on traite les données envoyées
    $prenom = $_POST["prenom"] ?? "";          // on récupère le prénom envoyé (?? "" par sécurité)
    // ...                                     // (suite du traitement)
}                                              // fin du if
// non (simple visite) : on affiche le formulaire</pre>

<h3>6. Toujours vérifier avant d'utiliser</h3>
<pre class="pseudo">if (isset($_POST["prenom"]) &amp;&amp; trim($_POST["prenom"]) !== "") {   // le champ existe ET n'est pas vide (espaces retirés par trim)
    // OK : on peut utiliser le prénom
} else {                                       // sinon (absent ou vide)
    echo "Le prénom est obligatoire !";        // message d'erreur
}                                              // fin du if/else</pre>
<div class="warn">Piège : un champ vide envoyé vaut <code>""</code>, et <code>isset</code> renvoie alors <code>true</code> ! Il faut donc combiner <code>isset</code> (la clé existe) ET <code>trim(...) !== ""</code> (elle n'est pas vide).</div>
<div class="tip">Règle d'or du web : ne fais JAMAIS confiance à ce qui vient du navigateur. L'utilisateur peut envoyer n'importe quoi (champ vide, texte au lieu d'un nombre, HTML malveillant — leçon 13 !). Valide TOUT, côté serveur, toujours.</div>`,
  exercises: [
    { type: "qcm", q: "$_GET et $_POST sont…", opts: ["Des fonctions", "Des TABLEAUX ASSOCIATIFS remplis par PHP avec les données du formulaire", "Des classes", "Des fichiers"], a: 1, exp: "Les superglobales : la leçon 8 t'y avait préparé." },
    { type: "qcm", q: "La clé dans $_POST correspond à quel attribut HTML ?", opts: ["id", "name : name=\"prenom\" → $_POST[\"prenom\"]", "class", "value"], a: 1, exp: "Sans name, le champ n'est PAS envoyé : le bug silencieux classique." },
    { type: "qcm", q: "$_POST[\"age\"] après saisie de 15 contient…", opts: ["15 (int)", "\"15\" (string !) : TOUT arrive en texte", "15.0", "true"], a: 1, exp: "Le web transporte du texte : caster avant de calculer." },
    { type: "qcm", q: "Le cast correct pour calculer avec l'âge :", opts: ["$age = $_POST[\"age\"] + \"\";", "$age = (int) ($_POST[\"age\"] ?? 0);", "$age = int($_POST);", "Pas besoin"], a: 1, exp: "Cast + valeur par défaut : le duo blindé." },
    { type: "qcm", q: "Une recherche de produits (filtres partageables par URL) : GET ou POST ?", opts: ["POST", "GET : les critères dans l'URL, copiables et partageables", "Les deux", "Aucun"], a: 1, exp: "?q=clavier&max=50 : l'URL EST l'état de la recherche." },
    { type: "qcm", q: "Un formulaire de mot de passe : GET ou POST ?", opts: ["GET", "POST : jamais un secret dans une URL (historique, logs, épaule du voisin…)", "Peu importe", "GET chiffré"], a: 1, exp: "L'URL se retrouve partout : POST pour le sensible." },
    { type: "qcm", q: "page.php?ville=Liège&tri=prix : que vaut $_GET[\"tri\"] ?", opts: ["\"Liège\"", "\"prix\"", "null", "1"], a: 1, exp: "Chaque paire clé=valeur de l'URL atterrit dans $_GET." },
    { type: "qcm", q: "L'utilisateur ouvre traitement.php DIRECTEMENT (sans envoyer le formulaire). $_POST[\"prenom\"] est…", opts: ["\"\"", "Inexistant : warning sans le ?? — d'où $_POST[\"prenom\"] ?? \"\"", "null propre", "0"], a: 1, exp: "Le cas limite du jour 30 : toujours prévoir l'accès direct." },
    { type: "qcm", q: "<code>$_SERVER[\"REQUEST_METHOD\"] === \"POST\"</code> teste…", opts: ["Le navigateur", "Si la page a été appelée par SOUMISSION du formulaire (et non par simple visite)", "La vitesse", "L'URL"], a: 1, exp: "Le portier du motif « afficher OU traiter » dans un seul fichier." },
    { type: "qcm", q: "Pourquoi valider CÔTÉ SERVEUR même si le HTML a required et type=number ?", opts: ["Doublon inutile", "Le navigateur est contournable (curl, dev tools…) : seul le serveur est digne de confiance", "Pour ralentir", "C'est la loi"], a: 1, exp: "La validation HTML est du confort ; la validation PHP est la sécurité." },
    { type: "qcm", q: "Champ vide envoyé : $_POST[\"prenom\"] vaut \"\" — isset() dit true ! Le test complet :", opts: ["isset seul", "isset(...) && trim(...) !== \"\" : existe ET non vide (espaces compris)", "empty toujours", "== null"], a: 1, exp: "isset ≠ non-vide : le trim attrape aussi les « espaces seuls »." },
    { type: "qcm", q: "Un <code>&lt;select name=\"taille\"&gt;</code> envoie sa valeur dans…", opts: ["$_SELECT", "$_POST[\"taille\"] (ou $_GET selon method) : tous les champs passent par name", "$_OPTION", "L'URL toujours"], a: 1, exp: "input, select, textarea : même mécanique, même tableau." },
    { type: "qcm", q: "Le formulaire du jour 5 d'algo (Invite → Lire → Traiter → Écrire) devient sur le web :", opts: ["Identique", "Formulaire HTML (invite) → $_POST (lire) → PHP (traiter) → echo (écrire)", "Impossible", "Un fichier"], a: 1, exp: "Le schéma universel a juste changé de costume." },
    { type: "qcm", q: "method=\"get\" sur le formulaire, mais tu lis $_POST : résultat ?", opts: ["Ça marche", "Tableau vide : les données sont dans $_GET — la cohérence method/tableau est vitale", "Erreur fatale", "Doublé"], a: 1, exp: "Bug fréquent et silencieux : vérifie toujours le couple method/superglobale." },
    { type: "qcm", q: "Pour déboguer « je ne reçois rien », le premier réflexe :", opts: ["Tout réécrire", "var_dump($_POST); en haut du script : voir EXACTEMENT ce qui arrive", "Vider le cache", "Changer de navigateur"], a: 1, exp: "var_dump, le microscope de la leçon 2, appliqué aux superglobales." }
  ],
  final: {
    title: "Exercice final — La calculatrice de cantine",
    intro: `<p>L'école facture les repas : formulaire (nombre de repas, régime) → calcul du mois.</p>
<pre class="pseudo">&lt;form action="cantine.php" method="post"&gt;   // formulaire envoyé en POST vers cantine.php
    &lt;input type="number" name="repas"&gt;      // champ nombre → clé "repas"
    &lt;select name="regime"&gt;                  // menu déroulant → clé "regime"
        &lt;option value="normal"&gt;Normal (4 €)&lt;/option&gt;    // choix 1 : valeur envoyée = "normal"
        &lt;option value="vege"&gt;Végétarien (3.5 €)&lt;/option&gt; // choix 2 : valeur envoyée = "vege"
    &lt;/select&gt;                               // fin du menu
    &lt;input type="submit"&gt;                   // bouton d'envoi
&lt;/form&gt;                                     // fin du formulaire

// cantine.php                            // le script qui reçoit les données
$repas = (int) ($_POST["repas"] ?? 0);    // récupère et caste en entier (?? 0 si absent)
$regime = $_POST["regime"] ?? "normal";   // récupère le régime (?? "normal" par défaut)
$prix = match($regime) {                  // choisit le tarif selon le régime
    "vege" => 3.5,                        // végétarien : 3,5 €
    default => 4.0                        // sinon : 4,0 €
};                                        // fin du match
if ($repas < 1 || $repas > 31) {          // garde-fou : entre 1 et 31 repas (encadrement du jour 8)
    echo "Nombre de repas invalide !";    // valeur hors bornes → message d'erreur
} else {                                  // sinon (valeur valide)
    echo "Total : " . ($repas * $prix) . " €";   // calcule et affiche le total
}                                         // fin du if/else</pre>
<p>Le parent envoie : repas = 20, regime = vege.</p>`,
    questions: [
      { type: "qcm", q: "Avant le cast, $_POST[\"repas\"] vaut…", opts: ["20 (int)", "\"20\" (string) : le web ne transporte que du texte", "20.0", "vege"], a: 1, exp: "D'où le (int) systématique." },
      { type: "input", q: "Que vaut $prix pour le régime vege ?", a: ["3.5", "3,5"], ph: "nombre", exp: "Le match de la leçon 5 route le tarif." },
      { type: "input", q: "Qu'affiche la page ? Total : … €", a: "70", ph: "nombre", exp: "20 × 3.5 = 70 €." },
      { type: "qcm", q: "Un farceur envoie repas = 999. Que se passe-t-il ?", opts: ["Total : 3996 €", "« Nombre de repas invalide ! » : la validation 1..31 (l'encadrement du jour 8 !) le bloque", "Erreur PHP", "Rien"], a: 1, exp: "Ne jamais faire confiance au client : la règle d'or en action." },
      { type: "qcm", q: "Un curieux ouvre cantine.php sans formulaire. Grâce aux ?? :", opts: ["Warning et plantage", "repas = 0 → « invalide » propre : le cas limite est géré, pas d'erreur affichée", "Total : 0 €", "Redirection"], a: 1, exp: "?? 0 + validation = accès direct inoffensif. Jour 30, pour toujours." }
    ],
    solution: `<pre class="pseudo">Flux : formulaire POST → $_POST["repas"]="20", ["regime"]="vege"   // ce que le serveur reçoit
Cast  : (int)"20" → 20                              // conversion texte → entier
Match : vege → 3.5                                  // tarif choisi
Garde : 1 <= 20 <= 31 ✓                             // validation OK
Sortie: Total : 70 €                                // 20 × 3.5 = 70

Blindages : ?? (accès direct) · cast (string→int)          // les protections mises en place
· encadrement (999 refusé) · match default (régime inconnu)</pre>
<p>Ton premier vrai traitement web sécurisé. Demain, on monte d'un cran : les attaques par injection HTML et comment les neutraliser.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton code PHP ici…",
  items: [
  { id: "php-calculatrice", title: "La calculatrice en GET", level: 2,
    statement: "Une URL du type <code>calc.php?a=12&amp;b=4&amp;op=plus</code> doit afficher le résultat de l'opération (<code>plus</code>, <code>moins</code>, <code>fois</code>, <code>div</code>). Valide les paramètres et gère la division par zéro.",
    hints: [
      "Les paramètres d'URL arrivent dans $_GET : $_GET[\"a\"], $_GET[\"b\"], $_GET[\"op\"].",
      "Vérifie leur présence avec isset() et convertis les nombres avec (float).",
      "Un match (ou switch) sur $op est idéal ; pour div, teste $b == 0 AVANT de diviser."
    ],
    solution: "<?php                                        // ouvre la zone PHP\nif (!isset($_GET[\"a\"], $_GET[\"b\"], $_GET[\"op\"])) { // isset accepte plusieurs arguments : tous doivent exister\n    die(\"Paramètres manquants ! Exemple : calc.php?a=12&b=4&op=plus\"); // stoppe tout avec un message\n}                                            // fin du contrôle de présence\n\n$a = (float) $_GET[\"a\"];                     // (float) force la conversion : \"12\" → 12.0 (sécurité)\n$b = (float) $_GET[\"b\"];                     // idem pour b\n$op = $_GET[\"op\"];                           // l'opération demandée (chaîne)\n\n$resultat = match ($op) {                    // match : aiguillage moderne avec comparaison stricte\n    \"plus\" => $a + $b,                       // addition\n    \"moins\" => $a - $b,                      // soustraction\n    \"fois\" => $a * $b,                       // multiplication\n    \"div\" => $b == 0 ? \"division par zéro !\" : $a / $b, // ternaire : refuse si $b vaut 0\n    default => \"opération inconnue\",         // toute autre valeur de op\n};                                           // fin du match\n\necho \"Résultat : $resultat\";                 // affiche le résultat (ou le message d'erreur)\n?>",
    note: "Tout ce qui vient de l'URL est une CHAÎNE non fiable : isset + cast = le duo de validation minimal." }
  ]
};
</script>
