<script>
var DAY = {
  num: 14,
  title: "Sessions et cookies",
  subtitle: "HTTP oublie tout : voici comment donner une mémoire à ton site.",
  theory: `
<h3>1. Le problème : HTTP est amnésique</h3>
<p><strong>HTTP</strong> est le langage par lequel navigateur et serveur se parlent. Chaque requête HTTP est <strong>indépendante</strong> : le serveur ne sait pas que la page 2 est demandée par le MÊME visiteur que la page 1. Sans mécanisme de mémoire, impossible d'avoir un panier, une connexion, des préférences qui persistent d'une page à l'autre.</p>

<h3>2. Le cookie : une note collée sur le navigateur</h3>
<p>Un <strong>cookie</strong> est une petite étiquette (un nom + une valeur) que le serveur demande au navigateur de conserver et de lui représenter à chaque visite.</p>
<pre class="pseudo">setcookie("theme", "sombre", time() + 30*24*3600);   // pose un cookie nommé "theme" valant "sombre", valable 30 jours
// À placer AVANT tout echo/HTML : les cookies voyagent dans les EN-TÊTES, envoyés en premier !
$theme = $_COOKIE["theme"] ?? "clair";       // lit le cookie "theme" (?? "clair" par défaut) ; dispo dès la requête SUIVANTE</pre>
<p>Le cookie est stocké CHEZ LE CLIENT (le navigateur) et renvoyé au serveur à chaque requête. Il est visible et modifiable par l'utilisateur → on n'y met JAMAIS de donnée sensible !</p>

<h3>3. La session : le coffre côté serveur</h3>
<p>Une <strong>session</strong> est un espace mémoire réservé à un visiteur, gardé SUR LE SERVEUR le temps de sa visite.</p>
<pre class="pseudo">session_start();                      // à mettre en 1re ligne, AVANT tout HTML — active/reprend la session
$_SESSION["pseudo"] = "Ana";          // ÉCRIT une donnée en session (stockée SUR LE SERVEUR)
$_SESSION["panier"][] = "clavier";    // on peut même stocker un tableau en session (ajout en fin)
echo $_SESSION["pseudo"];             // LIT la donnée, depuis n'importe quelle page du site
unset($_SESSION["panier"]);           // efface une clé précise de la session
session_destroy();                    // détruit TOUTE la session (utilisé pour la déconnexion)</pre>
<p>Mécanique : PHP pose UN seul cookie (l'identifiant de session) ; les DONNÉES, elles, restent sur le serveur. C'est le meilleur des deux mondes : le client ne transporte qu'un jeton, le contenu reste sûr.</p>

<h3>4. Cookie ou session ?</h3>
<pre class="pseudo">COOKIE  : préférences non sensibles, longue durée (thème, langue)   // stocké chez le client
          → chez le client, falsifiable, limité en taille           // avantages/limites du cookie
SESSION : connexion, panier, tout ce qui est sensible ou temporaire // stocké sur le serveur
          → chez le serveur, sûr, expire à la fin de la visite      // avantages/limites de la session</pre>

<h3>5. Le motif « page protégée »</h3>
<pre class="pseudo">// login.php : après avoir vérifié le mot de passe
session_start();                       // active la session pour pouvoir y écrire
$_SESSION["connecte"] = true;          // on marque l'utilisateur comme connecté
$_SESSION["pseudo"] = $pseudo;         // on mémorise son pseudo en session

// admin.php : le « portier » qui garde la page
session_start();                       // reprend la session existante
if (!isset($_SESSION["connecte"]) || $_SESSION["connecte"] !== true) {  // pas de clé "connecte" OU pas true → pas connecté
    header("Location: login.php");     // on demande au navigateur d'aller sur login.php
    exit;                              // ← CRUCIAL : stoppe immédiatement le script !
}                                      // fin du contrôle d'accès
// … contenu réservé, atteint seulement si connecté …</pre>
<div class="warn">Sans le <code>exit</code> après <code>header()</code>, le script CONTINUE et envoie le contenu protégé quand même (la redirection n'est qu'une suggestion au navigateur, qu'un outil comme curl peut ignorer !). Le duo <code>header</code> + <code>exit</code> est indissociable.</div>
<div class="tip"><code>session_start()</code> doit précéder TOUT envoi de HTML (même un espace avant <code>&lt;?php</code> !) : les sessions s'installent dans les en-têtes HTTP, qui partent avant le contenu. L'erreur « headers already sent » vient presque toujours de là.</div>`,
  exercises: [
    { type: "qcm", q: "HTTP est dit « sans état » (stateless) car…", opts: ["Il est lent", "Chaque requête est indépendante : le serveur ne reconnaît pas le visiteur d'une page à l'autre", "Il n'a pas d'erreurs", "Il est chiffré"], a: 1, exp: "D'où l'invention des cookies et sessions." },
    { type: "qcm", q: "Un cookie est stocké…", opts: ["Sur le serveur", "Chez le CLIENT (navigateur), renvoyé à chaque requête", "Dans la base de données", "Dans l'URL"], a: 1, exp: "Une note collée sur le navigateur." },
    { type: "qcm", q: "Les données de $_SESSION sont stockées…", opts: ["Chez le client", "Sur le SERVEUR : seul l'identifiant voyage en cookie", "Dans l'URL", "Nulle part"], a: 1, exp: "Le coffre côté serveur : le visiteur ne peut pas les falsifier." },
    { type: "qcm", q: "Quelle instruction obligatoire avant d'utiliser $_SESSION ?", opts: ["session_open()", "session_start(); en tout début de script", "start_session()", "$_SESSION = []"], a: 1, exp: "Sur CHAQUE page qui touche à la session." },
    { type: "qcm", q: "Pourquoi session_start() doit-il précéder tout HTML ?", opts: ["Esthétique", "La session s'installe dans les EN-TÊTES HTTP, envoyés avant le contenu : trop tard après le premier echo", "Pour la vitesse", "Convention"], a: 1, exp: "« Headers already sent » : l'erreur classique du débutant — souvent causée par un simple espace." },
    { type: "qcm", q: "Un mot de passe peut-il être stocké en cookie ?", opts: ["Oui, pratique", "JAMAIS : le cookie est lisible et modifiable chez le client", "Oui si court", "Oui en POST"], a: 1, exp: "Sensible → session (serveur). Cookie → confort non sensible." },
    { type: "qcm", q: "Le thème sombre choisi pour 6 mois : cookie ou session ?", opts: ["Session", "COOKIE : préférence non sensible, longue durée — la session meurt avec la visite", "Base de données obligatoire", "URL"], a: 1, exp: "Chaque outil sa mission : durable+anodin = cookie." },
    { type: "qcm", q: "Le panier d'achat en cours : cookie ou session ?", opts: ["Cookie", "SESSION : données de visite, potentiellement sensibles, côté serveur", "Fichier texte public", "GET"], a: 1, exp: "$_SESSION[\"panier\"][] = $produit : le tableau en session." },
    { type: "qcm", q: "$_SESSION[\"panier\"][] = \"clavier\"; — cette syntaxe montre que…", opts: ["Les sessions sont limitées aux strings", "Une session stocke aussi des TABLEAUX : toute la leçon 7-8 s'applique", "C'est une erreur", "Le panier est un cookie"], a: 1, exp: "La session est un tableau associatif persistant : tes structures y vivent." },
    { type: "qcm", q: "La déconnexion s'implémente par…", opts: ["Fermer le navigateur", "session_destroy() (après session_start) : le coffre est vidé", "unset($_GET)", "Un cookie \"bye\""], a: 1, exp: "Souvent complété par $_SESSION = []; pour nettoyer immédiatement." },
    { type: "qcm", q: "Dans le portier d'admin.php, à quoi sert le <code>exit;</code> après header() ?", opts: ["À rien", "À STOPPER le script : sans lui, le contenu protégé est envoyé malgré la redirection !", "À fermer la session", "À vider le cache"], a: 1, exp: "La faille classique : un curl ignore la redirection et lit la suite. header+exit, toujours." },
    { type: "qcm", q: "isset($_SESSION[\"connecte\"]) teste…", opts: ["Le mot de passe", "Si la clé existe : un visiteur jamais connecté ne l'a simplement pas", "La vitesse", "Le cookie theme"], a: 1, exp: "L'isset de la leçon 2, au cœur du contrôle d'accès." },
    { type: "qcm", q: "setcookie(\"theme\", \"sombre\", time() + 3600) : que représente le 3ᵉ argument ?", opts: ["La taille", "La date d'EXPIRATION (timestamp) : ici dans 1 heure", "Le domaine", "La version"], a: 1, exp: "time() + durée en secondes : le cookie s'auto-détruit ensuite." },
    { type: "qcm", q: "Juste après setcookie(), $_COOKIE[\"theme\"] contient…", opts: ["\"sombre\"", "RIEN encore : le cookie ne revient qu'à la requête SUIVANTE (il fait l'aller-retour navigateur)", "null pour toujours", "\"clair\""], a: 1, exp: "Piège temporel : écrire et lire un cookie = deux requêtes distinctes." },
    { type: "qcm", q: "Un visiteur modifie son cookie « theme » en « pirate ». Gravité ?", opts: ["Catastrophe", "Aucune si le code fait $_COOKIE[\"theme\"] ?? \"clair\" et n'affiche qu'après validation/échappement : donnée client = donnée suspecte (leçon 13 !)", "Le serveur plante", "Session détruite"], a: 1, exp: "Le cookie est une ENTRÉE utilisateur comme une autre : valider, échapper." }
  ],
  final: {
    title: "Exercice final — L'espace membre",
    intro: `<p>Le club met en place son espace membre :</p>
<pre class="pseudo">// login.php (après vérification du mot de passe)
session_start();                                          // active la session
$_SESSION["connecte"] = true;                             // marque l'utilisateur comme connecté
$_SESSION["pseudo"] = "Ana";                              // mémorise son pseudo
$_SESSION["visites"] = ($_SESSION["visites"] ?? 0) + 1;    // (1) compteur : 0 si première fois, puis +1
header("Location: membre.php");                           // redirige vers l'espace membre
exit;                                                     // stoppe le script après la redirection

// membre.php
session_start();                                          // reprend la session
if (!isset($_SESSION["connecte"])) {                        // (2) pas de clé "connecte" → visiteur non connecté
    header("Location: login.php");                        // on le renvoie vers la page de connexion
    exit;                                                 // et on stoppe (indispensable)
}                                                         // fin du portier
echo "Bienvenue " . htmlspecialchars($_SESSION["pseudo"]);  // (3) affiche le pseudo, ÉCHAPPÉ (anti-XSS)
echo "Visite n°" . $_SESSION["visites"];                  // affiche le compteur de visites

// logout.php
session_start();                                          // reprend la session
session_destroy();                                        // (4) détruit toute la session → déconnexion</pre>`,
    questions: [
      { type: "qcm", q: "(1) Le motif <code>($_SESSION[\"visites\"] ?? 0) + 1</code> est…", opts: ["Un cookie", "Le COMPTEUR (jour 12) persistant entre les pages grâce à la session", "Une erreur", "Un mot de passe"], a: 1, exp: "?? 0 pour la première visite, +1 ensuite : le compteur d'occurrences (leçon 8), en session." },
      { type: "qcm", q: "(2) Un anonyme tape membre.php directement. Que voit-il ?", opts: ["La page membre", "Rien : redirection vers login.php et exit — le portier fonctionne", "Une erreur", "Le pseudo d'Ana"], a: 1, exp: "Pas de clé « connecte » → dehors." },
      { type: "qcm", q: "(3) Pourquoi htmlspecialchars sur le pseudo qui vient… de NOTRE session ?", opts: ["Réflexe inutile", "Le pseudo a été SAISI par l'utilisateur au départ : donnée utilisateur un jour, suspecte toujours (leçon 13)", "La session corrompt", "Pour le style"], a: 1, exp: "L'origine de la donnée compte, pas son lieu de stockage." },
      { type: "qcm", q: "(4) Après logout.php, retour sur membre.php :", opts: ["Bienvenue Ana", "Redirection login : session détruite, la clé connecte n'existe plus", "Visite n°0", "Erreur"], a: 1, exp: "Le cycle complet : login → espace → logout → porte fermée." },
      { type: "qcm", q: "Ana se connecte 3 fois (login → logout à chaque fois). Qu'affiche « Visite n°… » à la 3ᵉ ?", opts: ["3", "1 : session_destroy a TOUT effacé, y compris le compteur — pour persister ENTRE sessions, il faudrait un cookie ou un fichier (leçon 15 !)", "0", "2"], a: 1, exp: "Session = mémoire de visite. Mémoire longue = cookie/fichier/BDD : chaque durée son outil." }
    ],
    solution: `<pre class="pseudo">Architecture mémoire du site :                     // à chaque durée son outil
$_POST     → l'instant (un envoi de formulaire)    // vit le temps d'une requête
$_SESSION  → la visite (connexion, panier, compteur)   // vit le temps de la visite
$_COOKIE   → les mois (préférences anodines)       // survit à la fermeture du navigateur
Fichier/BDD → pour toujours (leçons 15 et 18 !)    // stockage permanent

Portier : session_start → isset → header+exit      // le contrôle d'accès
Sortie : session_destroy</pre>
<p>Ton site a maintenant une mémoire à quatre étages. Demain : la persistance éternelle — les fichiers et JSON.</p>`
  }
};

    ],
    solution: "<?php                                        // ouvre la zone PHP\nsession_start();                             // TOUJOURS en premier : active la session avant tout affichage\n\nif (isset($_GET[\"reset\"])) {                 // l'URL contient-elle ?reset=… ?\n    $_SESSION[\"visites\"] = 0;                // oui → remise à zéro du compteur\n}                                            // fin du reset\n\nif (!isset($_SESSION[\"visites\"])) {          // première visite : la clé n'existe pas encore\n    $_SESSION[\"visites\"] = 0;                // on la crée à zéro\n}                                            // fin de l'initialisation\n\n$_SESSION[\"visites\"]++;                      // incrémente le compteur (persiste entre les pages !)\n\necho \"<p>Visite n° \" . $_SESSION[\"visites\"] . \"</p>\"; // affiche le compteur\necho '<a href=\"?reset=1\">Remettre à zéro</a>';        // lien qui recharge la page avec ?reset=1\n?>",
    note: "Sans session, HTTP est amnésique : chaque rechargement repartirait de zéro." }
  ]
};
