  title: "Examen final PHP",
  subtitle: "21 leçons en une page : prouve que le web dynamique est à toi.",
  theory: `
<p>Cette dernière leçon est un <strong>examen de synthèse</strong> : chaque question porte un repère [L1], [L2]… qui renvoie à la leçon d'origine. Avant de te lancer, voici la carte complète du cours.</p>
<h3>Le cours en une carte</h3>
<pre class="pseudo">SEMAINE 1 — LE LANGAGE                                          // apprendre à parler PHP
  &lt;?php echo · $variables · types dynamiques · == vs ===        // les bases et le piège du jonglage
  chaînes (strpos, explode) · if/match · while/for/foreach     // texte, décisions, boucles
  tableaux indexés &amp; associatifs · fonctions · natives          // structures et réutilisation

SEMAINE 2 — LE WEB DYNAMIQUE                                    // fabriquer des pages qui reçoivent des données
  algorithmes traduits · $_GET/$_POST · valider (filter_var)   // recevoir et contrôler les données
  échapper (htmlspecialchars) · sessions &amp; cookies · fichiers &amp; JSON  // sécuriser, mémoriser, persister

SEMAINE 3 — OBJETS &amp; DONNÉES                                    // structurer et stocker durablement
  POO (class, ->, __construct) · héritage (extends, parent::)  // modéliser en objets
  PDO SELECT · requêtes préparées · PROJET livre d'or          // bases de données, en sécurité</pre>
<h3>Les réflexes PHP à vie</h3>
<ul>
<li><code>===</code> par défaut (le trio piégeux 0 / false / \"0\").</li>
<li>Le <code>.</code> concatène, le <code>+</code> additionne (jamais l'inverse — différence avec Java/JS).</li>
<li>Guillemets doubles interpolent les <code>$variables</code>, apostrophes non.</li>
<li>Tout ce qui vient du client (<code>$_POST</code>, <code>$_GET</code>, <code>$_COOKIE</code>) est du texte SUSPECT : valider + échapper.</li>
<li>Requête PRÉPARÉE vers la base (anti-injection), <code>htmlspecialchars</code> vers la page (anti-XSS).</li>
<li>La flèche <code>-&gt;</code> pour les objets ; <code>$this-&gt;attribut</code> (le <code>$</code> est sur <code>this</code>, pas sur l'attribut).</li>
<li>Les tableaux sont passés par COPIE aux fonctions (≠ Java, qui passe la référence).</li>
</ul>
<div class="tip">L'examen pioche dans les 20 leçons précédentes. Chaque erreur te renvoie, grâce à son repère [L…], à la leçon exacte à revoir : c'est ton mode d'emploi de révision ciblée.</div>`,

    { type: "qcm", q: "[L3] L'opérateur qui CONCATÈNE :", opts: ["+", ". (le point)", "&", ","], a: 1, exp: "Le + additionne toujours en PHP." },
    { type: "input", q: "[L4] Que vaut <code>strrev(\"code\")</code> ?", a: ["edoc"], ph: "texte", exp: "Le miroir natif." },
    { type: "qcm", q: "[L5] Le successeur moderne de switch :", opts: ["case", "match (strict, sans break, retourne une valeur)", "if", "when"], a: 1, exp: "match(x) { … }." },
    { type: "qcm", q: "[L6] La boucle reine de PHP :", opts: ["for", "foreach ($t as $v)", "do-while", "loop"], a: 1, exp: "Parcourt les tableaux sans indice." },
    { type: "input", q: "[L7] $t = [4, 7, 1]; echo count($t); affiche… ?", a: "3", ph: "nombre", exp: "count = la taille." },
    { type: "qcm", q: "[L8] Un tableau associatif utilise…", opts: ["Des indices numériques seulement", "Des clés : [\"nom\" => \"Ana\"]", "Des objets comme valeurs", "Des fichiers externes"], a: 1, exp: "La flèche => associe clé et valeur." },
    { type: "qcm", q: "[L9] Déclarer une fonction :", opts: ["def f()", "function f($x) { return … }", "func f", "fn f()"], a: 1, exp: "function + return." },
    { type: "input", q: "[L10] Que vaut <code>array_sum(range(1, 5))</code> ?", a: "15", ph: "nombre", exp: "1+2+3+4+5, deux natives composées." },
    { type: "qcm", q: "[L11] La dichotomie exige un tableau…", opts: ["associatif", "TRIÉ", "vide", "d'objets"], a: 1, exp: "Le prérequis éternel." },
    { type: "qcm", q: "[L12] Les données d'un formulaire POST arrivent dans…", opts: ["$_SESSION", "$_POST (des STRINGS !)", "$_FILES", "une variable globale"], a: 1, exp: "Tout en texte : caster avant de calculer." },
    { type: "qcm", q: "[L13] Contre le XSS, on utilise…", opts: ["filter_var", "htmlspecialchars à l'affichage", "session_start", "trim"], a: 1, exp: "Neutralise le HTML injecté." },
    { type: "qcm", q: "[L14] Avant $_SESSION, il faut appeler…", opts: ["session_open", "session_start();", "start()", "rien"], a: 1, exp: "En tout début de script." },
    { type: "qcm", q: "[L15] json_decode($j, true) retourne…", opts: ["des objets", "des tableaux associatifs", "une string", "false"], a: 1, exp: "Le true force le format tableau." },
    { type: "qcm", q: "[L16] En PHP, on appelle une méthode avec…", opts: ["le point", "la flèche -> : $obj->methode()", "::", "les crochets"], a: 1, exp: "Le point est réservé à la concaténation." },
    { type: "qcm", q: "[L17] Le super de Java devient en PHP…", opts: ["super::", "parent::", "base", "this"], a: 1, exp: "parent::__construct()." },

    { type: "qcm", q: "[L19] Contre l'injection SQL :", opts: ["Concaténer", "Les requêtes PRÉPARÉES (prepare + execute avec marqueurs)", "htmlspecialchars", "trim"], a: 1, exp: "Données et requête séparées." }
  ],
  final: {
    title: "Épreuve de synthèse — La mini-API de sondage",
    intro: `<p>Dernière épreuve ! Un endpoint (un point d'accès du serveur) enregistre un vote et renvoie les résultats :</p>
<pre class="pseudo">session_start();                                      // active la session (leçon 14)
$options = ["php", "java", "csharp"];                 // liste blanche : les seuls choix autorisés
$choix = $_POST["langage"] ?? "";                     // récupère le vote posté (?? "" si absent)
$erreurs = [];                                        // collecteur d'erreurs (leçon 13)
if (!in_array($choix, $options, true)) {              // (1) le choix est-il dans la liste blanche ? (true = strict)
    $erreurs[] = "Choix invalide";                    // sinon : erreur
}                                                     // fin de la validation
if (count($erreurs) === 0) {                          // aucune erreur ?
    $stmt = $pdo->prepare("INSERT INTO votes (langage) VALUES (:l)");  // requête préparée (leçon 19)
    $stmt->execute([":l" => $choix]);                 // (2) enregistre le vote (anti-injection)
}                                                     // fin de l'insertion
$stats = $pdo->query(                                 // lit les résultats
    "SELECT langage, COUNT(*) as n FROM votes GROUP BY langage ORDER BY n DESC"   -- compte les votes par langage
)->fetchAll(PDO::FETCH_ASSOC);                         // (3) → liste d'enregistrements [langage, n]
foreach ($stats as $s) {                              // parcourt chaque ligne de résultat
    echo htmlspecialchars($s["langage"]) . " : " . $s["n"] . "&lt;br&gt;";   // (4) affiche « langage : nombre » (échappé)
}                                                     // fin du parcours</pre>`,
    questions: [
      { type: "qcm", q: "(1) Pourquoi <code>in_array($choix, $options, true)</code> avec le 3ᵉ argument true ?", opts: ["C'est purement décoratif", "Comparaison STRICTE (===) : évite qu'une valeur piégeuse (0, \"\") matche par jonglage — et limite le vote aux 3 options prévues", "C'est simplement plus rapide", "C'est obligatoire avec in_array"], a: 1, exp: "Valider par liste blanche + comparaison stricte : double sécurité (leçons 3 et 13)." },
      { type: "qcm", q: "(2) L'INSERT préparé protège contre…", opts: ["Les attaques XSS à l'affichage", "L'injection SQL (leçon 19) : même si $choix contenait du SQL, il resterait une donnée", "Les votes enregistrés en double", "La lenteur des requêtes"], a: 1, exp: "Le bouclier base, systématique." },
      { type: "qcm", q: "(3) <code>COUNT(*) ... GROUP BY langage</code> réalise…", opts: ["Un simple tri des votes", "Le COMPTEUR D'OCCURRENCES (leçon 8 / jour 12) exécuté par la base : un compte par langage", "Le calcul d'une moyenne", "Une suppression de lignes"], a: 1, exp: "Ton motif favori, en SQL natif : la base dépouille le sondage." },
      { type: "qcm", q: "(4) htmlspecialchars sur $s[\"langage\"] qui vient de la base : justifié ?", opts: ["Non, la base est une source sûre", "Oui : ces valeurs ont été postées par des utilisateurs — échappement systématique à l'affichage", "Seulement pour la colonne n", "Non, c'est superflu ici"], a: 1, exp: "L'origine (utilisateur) prime sur le lieu (base) : XSS toujours possible." },
      { type: "qcm", q: "BILAN — Cette mini-API mobilise :", opts: ["Un seul concept isolé", "Session + validation par liste blanche + === + requête préparée + agrégat SQL (compteur) + échappement : trois semaines en 15 lignes", "Uniquement des notions de SQL", "Rien de vraiment sécurisé"], a: 1, exp: "Si tu as tout suivi : PHP et le web dynamique sont devenus des automatismes. 🎓" }
    ],
    solution: `<pre class="pseudo">Flux : POST langage → validation liste blanche (in_array strict)   // 1. recevoir et contrôler
→ INSERT préparé (anti-injection) → SELECT COUNT GROUP BY (compteur SQL)   // 2. enregistrer, 3. dépouiller
→ foreach + htmlspecialchars (anti-XSS)                            // 4. afficher en sécurité

Vote "php" avec votes existants [php×5, java×3, csharp×2] :        // exemple de trace
→ INSERT → php×6                                                   // le vote php s'ajoute
→ résultats : php : 6 / java : 3 / csharp : 2                      // triés par nombre décroissant

Le même sondage en pseudocode aurait tenu au jour 30              // la logique est identique à l'algo
d'algorithmique (compteur + validation). Le web n'a ajouté        // le web n'ajoute que la plomberie
que : $_POST, la base, la sécurité. La PENSÉE est intacte.</pre>
<p><strong>Bravo !</strong> Tu as terminé le cours PHP. Le web dynamique — formulaires, sécurité, bases de données — n'a plus de secret. Suite logique : enrichir le livre d'or (édition, pagination, comptes utilisateurs), ou attaquer le cours C# pour un troisième point de vue sur les mêmes idées.</p>`
  }
