<body>
<script>
var DAY = {
  num: 20,
  title: "Namespaces, Composer et autoload",
  subtitle: "Organiser un vrai projet : ranger ses classes et installer des bibliothèques d'un clic.",
  theory: `
<h3>1. Le problème : deux classes, un même nom</h3>
<p>Dans un petit script, tu nommes une classe <code>Jeu</code>. Plus tard tu ajoutes une bibliothèque de cartes à jouer qui, elle aussi, a une classe <code>Jeu</code>. PHP ne sait plus de laquelle tu parles : c'est une <strong>collision de noms</strong>. Un <strong>namespace</strong> (espace de noms) est le NOM DE FAMILLE d'une classe : comme deux « Camille » se distinguent par leur nom de famille, <code>Ludotheque\\Jeu</code> et <code>Cartes\\Jeu</code> ne se confondent plus.</p>
<div class="tip">Analogie : un namespace est un DOSSIER pour tes classes. Deux fichiers « photo.jpg » peuvent coexister s'ils sont dans deux dossiers différents.</div>

<h3>2. Déclarer un namespace</h3>
<p>La déclaration <code>namespace</code> doit être la TOUTE PREMIÈRE instruction du fichier (juste après <code>&lt;?php</code>).</p>
<pre class="pseudo">&lt;?php                              // ouverture PHP
namespace Ludotheque;              // toutes les classes de ce fichier vivent dans l'espace « Ludotheque »
class Jeu {                        // son nom complet devient Ludotheque\\Jeu
    public string \$titre;          // une propriété (le \$ est échappé ici juste pour l'affichage)
}                                  // fin de la classe</pre>
<p>Le <strong>nom pleinement qualifié</strong> (Fully Qualified Name) de cette classe est <code>\\Ludotheque\\Jeu</code> : le chemin complet depuis la racine, comme une adresse postale complète.</p>

<h3>3. Utiliser une classe d'un autre namespace : <code>use</code></h3>
<p>Pour ne pas réécrire le chemin complet partout, on l'IMPORTE une fois en haut avec <code>use</code>.</p>
<pre class="pseudo">&lt;?php                              // ouverture PHP
namespace App;                     // le code applicatif vit dans « App »
use Ludotheque\\Jeu;                // j'importe Ludotheque\\Jeu → je pourrai écrire juste « Jeu »
\$catan = new Jeu();                // grâce au use, pas besoin d'écrire Ludotheque\\Jeu en entier
\$carte = new \\Cartes\\Jeu();        // sans use, on écrit le nom complet avec un \\ initial</pre>
<div class="warn">Sans <code>use</code> ni <code>\\</code> initial, PHP cherche la classe DANS le namespace courant. <code>new Jeu()</code> dans <code>namespace App</code> chercherait <code>App\\Jeu</code> — pas ce qu'on veut.</div>

<h3>4. Les alias : renommer à l'import</h3>
<p>Si deux <code>Jeu</code> doivent cohabiter dans le même fichier, on donne un ALIAS avec <code>as</code>.</p>
<pre class="pseudo">use Ludotheque\\Jeu as JeuSociete;   // Ludotheque\\Jeu s'appellera JeuSociete ici
use Cartes\\Jeu as JeuCartes;        // Cartes\\Jeu s'appellera JeuCartes ici
\$a = new JeuSociete();              // aucune ambiguïté possible
\$b = new JeuCartes();               // les deux « Jeu » cohabitent enfin</pre>

<h3>5. Composer : le gestionnaire de dépendances</h3>
<p><strong>Composer</strong> est à PHP ce qu'un magasin d'applications est à ton téléphone : un outil qui TÉLÉCHARGE et INSTALLE des bibliothèques (du code écrit par d'autres) et gère leurs versions. Une <strong>dépendance</strong> est une bibliothèque dont ton projet a besoin pour fonctionner.</p>
<pre class="pseudo">-- en ligne de commande (terminal), pas dans le code :
composer init          # crée le fichier composer.json (la carte d'identité du projet)
composer require ramsey/uuid   # télécharge la bibliothèque « ramsey/uuid » et l'ajoute au projet</pre>
<p>Composer crée un dossier <code>vendor/</code> (le « fournisseur ») où atterrit tout le code téléchargé, et un fichier <code>composer.json</code> qui LISTE tes dépendances.</p>
<pre class="pseudo">// composer.json (extrait) — décrit le projet en JSON :
{
  "require": {                     // la liste des dépendances
    "ramsey/uuid": "^4.7"          // nom de la lib : version minimale acceptée
  },
  "autoload": {                    // règles de chargement automatique (voir §6)
    "psr-4": { "App\\\\": "src/" }   // le namespace App\\ correspond au dossier src/
  }
}</pre>
<div class="warn">Le dossier <code>vendor/</code> ne se met JAMAIS dans Git : on partage <code>composer.json</code>, et chacun refait <code>composer install</code> pour reconstruire <code>vendor/</code>.</div>

<h3>6. L'autoload : plus jamais de <code>require</code> manuel</h3>
<p>Avant, il fallait un <code>require "Jeu.php";</code> pour chaque fichier de classe. L'<strong>autoload</strong> (chargement automatique) est un BIBLIOTHÉCAIRE qui va chercher le bon fichier tout seul dès que tu nommes une classe. Composer le génère pour toi selon la norme <strong>PSR-4</strong>, qui fait correspondre un namespace à un dossier.</p>
<pre class="pseudo">&lt;?php                                  // ouverture PHP
require "vendor/autoload.php";         // UNE seule ligne : branche l'autoloader de Composer
use App\\Ludotheque\\Jeu;               // je nomme la classe…
\$j = new Jeu();                        // …Composer charge tout seul src/Ludotheque/Jeu.php</pre>
<p>Règle PSR-4 : le namespace <code>App\\Ludotheque\\Jeu</code> avec la base <code>"App\\\\": "src/"</code> pointe vers le fichier <code>src/Ludotheque/Jeu.php</code>. Le namespace décrit le chemin du dossier ; le nom de la classe = le nom du fichier.</p>
<div class="tip">Bilan : namespaces = ranger, Composer = installer, autoload = charger tout seul. C'est ainsi que sont bâtis TOUS les projets PHP modernes (Symfony, Laravel…).</div>`,
  exercises: [
    { type: "qcm", q: "Un namespace sert à…", opts: ["Accélérer l'exécution du code", "Éviter les COLLISIONS de noms : deux classes peuvent s'appeler Jeu si elles sont dans des namespaces différents", "Masquer le code source d'une classe", "Remplacer les fonctions globales"], a: 1, exp: "Le namespace est le « nom de famille » d'une classe." },
    { type: "qcm", q: "La déclaration namespace doit être…", opts: ["Placée n'importe où dans le fichier", "La TOUTE PREMIÈRE instruction du fichier, juste après <?php", "Placée tout à la fin du fichier", "À l'intérieur d'une fonction"], a: 1, exp: "Rien (sauf declare) ne peut la précéder." },
    { type: "qcm", q: "Le nom pleinement qualifié de la classe Jeu dans namespace Ludotheque est…", opts: ["Jeu, sans aucun préfixe", "\\Ludotheque\\Jeu : le chemin complet depuis la racine", "Ludotheque, le nom du namespace seul", "App\\Jeu, avec le namespace applicatif"], a: 1, exp: "Comme une adresse postale complète." },
    { type: "qcm", q: "À quoi sert <code>use Ludotheque\\Jeu;</code> ?", opts: ["Créer un objet de la classe", "IMPORTER la classe pour pouvoir écrire juste « Jeu » ensuite au lieu du chemin complet", "Supprimer la classe importée", "Copier la classe dans le fichier"], a: 1, exp: "use importe un nom une fois pour tout le fichier." },
    { type: "qcm", q: "Dans <code>namespace App;</code>, écrire <code>new Jeu()</code> (sans use) cherche…", opts: ["Ludotheque\\Jeu, dans l'autre namespace", "App\\Jeu, car PHP cherche dans le namespace COURANT à défaut d'import", "N'importe quelle classe Jeu existante", "Une erreur fatale systématique"], a: 1, exp: "Sans use ni \\ initial, la recherche est relative au namespace courant." },
    { type: "qcm", q: "Pour utiliser deux classes Jeu (Ludotheque et Cartes) dans un fichier, on emploie…", opts: ["C'est tout simplement impossible", "un ALIAS : use Cartes\\Jeu as JeuCartes;", "un require du second fichier", "un simple echo du nom de classe"], a: 1, exp: "as renomme l'import et lève l'ambiguïté." },
    { type: "qcm", q: "Composer est…", opts: ["Un éditeur de texte", "Le gestionnaire de DÉPENDANCES de PHP : il télécharge et installe des bibliothèques", "Une base de données", "Un serveur web"], a: 1, exp: "Comme un magasin d'applications pour du code PHP." },
    { type: "qcm", q: "Le fichier composer.json contient…", opts: ["Le code source de l'application", "La LISTE des dépendances et les règles d'autoload, au format JSON", "Les identifiants de connexion à la base", "Les gabarits HTML du site"], a: 1, exp: "C'est la carte d'identité du projet." },
    { type: "qcm", q: "La commande pour ajouter une bibliothèque est…", opts: ["composer delete nom/lib", "composer require nom/lib", "php install nom/lib", "composer new nom/lib"], a: 1, exp: "composer require télécharge la lib et met à jour composer.json." },
    { type: "qcm", q: "Le dossier vendor/ …", opts: ["Contient ton propre code applicatif", "Contient le code TÉLÉCHARGÉ par Composer, et ne se met PAS dans Git", "Doit toujours être commité dans Git", "Ne sert strictement à rien"], a: 1, exp: "On partage composer.json ; chacun refait composer install." },
    { type: "qcm", q: "L'autoload (PSR-4) évite de…", opts: ["Nommer correctement les classes", "Faire un require manuel pour chaque fichier de classe : il charge le bon fichier tout seul quand on nomme la classe", "Déclarer des namespaces", "Écrire du JSON à la main"], a: 1, exp: "Le « bibliothécaire » va chercher le fichier automatiquement." },
    { type: "qcm", q: "Avec <code>\"App\\\\\": \"src/\"</code>, la classe App\\Model\\Jeu se trouve dans…", opts: ["src/Jeu.php", "src/Model/Jeu.php : le namespace décrit le chemin, le nom de classe = le nom du fichier", "App/Jeu.php", "vendor/Jeu.php"], a: 1, exp: "PSR-4 fait correspondre namespace et arborescence de dossiers." },
    { type: "qcm", q: "La ligne qui branche l'autoloader de Composer est…", opts: ["use autoload;", "require \"vendor/autoload.php\"; en haut du script", "composer autoload", "include Composer"], a: 1, exp: "Une seule ligne suffit pour tout charger automatiquement." },
    { type: "qcm", q: "Pourquoi préfère-t-on installer une lib plutôt que la recoder ?", opts: ["Parce qu'une bibliothèque externe s'exécute toujours plus vite", "Gain de temps, code TESTÉ par une communauté, mises à jour de sécurité : ne réinvente pas la roue", "Parce que coder soi-même est interdit", "Pour remplir le dossier vendor/"], a: 1, exp: "Réutiliser du code éprouvé est un réflexe professionnel." },
    { type: "vf", q: "On partage composer.json dans Git mais pas le dossier vendor/, que chacun reconstruit avec composer install.", a: true, exp: "vendor/ est reconstructible à volonté depuis composer.json." }
  ],
  final: {
    title: "Exercice final — Structurer la Ludothèque",
    intro: `<p>On range enfin le projet Ludothèque proprement. Voici l'arborescence et le point d'entrée :</p>
<pre class="pseudo">// Arborescence :
//   composer.json
//   src/Jeu.php
//   public/index.php

// src/Jeu.php :
&lt;?php                                  // ouverture PHP
namespace App;                         // (1) la classe vit dans le namespace App
class Jeu {                            // nom complet : App\\Jeu
    public function __construct(        // constructeur
        public string \$titre,           // titre du jeu
        public int \$joueursMax          // nombre maxi de joueurs
    ) {}                               // corps vide (propriétés promues)
}                                      // fin de la classe

// public/index.php :
&lt;?php                                  // ouverture PHP
require "../vendor/autoload.php";      // (2) branche l'autoloader
use App\\Jeu;                           // importe App\\Jeu
\$catan = new Jeu("Catan", 4);          // (3) créé SANS require manuel de Jeu.php
echo \$catan->titre;                    // affiche « Catan »</pre>`,
    questions: [
      { type: "qcm", q: "(1) Pourquoi déclarer <code>namespace App;</code> dans Jeu.php ?", opts: ["Pour accélérer le chargement", "Pour donner à la classe le nom complet App\\Jeu et permettre l'autoload PSR-4 vers src/", "C'est purement décoratif", "Pour chiffrer le contenu de la classe"], a: 1, exp: "Le namespace + PSR-4 lie App\\Jeu au fichier src/Jeu.php." },
      { type: "qcm", q: "(2) Que fait la ligne require vendor/autoload.php ?", opts: ["Charge Jeu.php manuellement", "Branche l'autoloader : désormais nommer une classe suffit à charger son fichier", "Installe Composer sur la machine", "Absolument rien d'utile"], a: 1, exp: "Une ligne, et tout le chargement devient automatique." },
      { type: "qcm", q: "(3) Pourquoi <code>new Jeu(...)</code> fonctionne sans <code>require \"src/Jeu.php\"</code> ?", opts: ["Le fichier src/Jeu.php est inclus automatiquement au démarrage", "L'autoloader traduit App\\Jeu en src/Jeu.php et le charge à la volée", "Jeu est une classe native de PHP", "index.php contient déjà la classe Jeu"], a: 1, exp: "C'est tout l'intérêt de l'autoload PSR-4." },
      { type: "qcm", q: "Où placer la règle <code>\"App\\\\\": \"src/\"</code> ?", opts: ["Directement dans index.php", "Dans la section autoload.psr-4 de composer.json", "Dans le fichier Jeu.php", "Dans le dossier vendor/"], a: 1, exp: "composer.json déclare la correspondance namespace ↔ dossier." },
      { type: "qcm", q: "Un collègue clone le projet mais vendor/ est absent. Que fait-il ?", opts: ["Recoder les bibliothèques manquantes", "Lancer composer install : Composer relit composer.json et reconstruit vendor/", "Copier le dossier vendor/ par mail", "Renoncer à cloner le projet"], a: 1, exp: "vendor/ se régénère toujours depuis composer.json." }
    ],
    solution: `<pre class="pseudo">// public/index.php complet et commenté :
&lt;?php                                  // ouverture PHP
require "../vendor/autoload.php";      // branche l'autoloader Composer (chargement auto des classes)
use App\\Jeu;                           // importe App\\Jeu : on écrira juste « Jeu »
\$jeux = [                              // un petit catalogue
    new Jeu("Catan", 4),               // autoload charge src/Jeu.php à la première mention
    new Jeu("7 Wonders", 7)            // réutilise la classe déjà chargée
];                                     // fin du tableau
foreach (\$jeux as \$j) {                // parcourt chaque jeu
    echo \$j->titre . " (" . \$j->joueursMax . " j.)\\n"; // affiche titre + nb de joueurs
}                                      // fin de boucle
?&gt;</pre>
<p>Namespaces pour ranger, Composer pour installer, autoload pour charger : le squelette de tout projet PHP moderne. Demain, on approfondit la POO avec interfaces et traits.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton code PHP ici…",
  items: [
  { id: "php-namespaces", title: "Une classe rangée dans un namespace", level: 2,
    statement: "Crée une classe <code>Jeu</code> dans le namespace <code>App\\Model</code>, avec un titre et un nombre de joueurs (constructeur). Dans un second bloc, <strong>importe-la</strong> avec <code>use</code> et crée un objet. Explique en commentaire où PSR-4 irait chercher le fichier.",
    hints: [
      "La 1re instruction du fichier de classe doit être : namespace App\\Model;",
      "Le constructeur peut utiliser les propriétés promues : public function __construct(public string $titre, public int $joueurs) {}",
      "Pour l'utiliser : use App\\Model\\Jeu; puis $j = new Jeu(\"Catan\", 4);"
    ],
    solution: "<?php                                          // ouverture PHP\nnamespace App\\Model;                          // 1re instruction : la classe vit dans App\\Model\n\nclass Jeu {                                    // nom complet : App\\Model\\Jeu\n    public function __construct(                // constructeur\n        public string $titre,                   // propriété promue : le titre du jeu\n        public int $joueurs                     // propriété promue : nb de joueurs\n    ) {}                                        // corps vide (promotion suffit)\n\n    public function resume(): string {          // méthode d'affichage\n        return $this->titre . \" (\" . $this->joueurs . \" joueurs)\"; // ligne descriptive\n    }                                           // fin de la méthode\n}                                              // fin de la classe\n\n// --- Ailleurs, dans public/index.php ---\n// require \"../vendor/autoload.php\";           // branche l'autoloader Composer\n// use App\\Model\\Jeu;                          // importe la classe\n// $catan = new Jeu(\"Catan\", 4);               // PSR-4 charge src/Model/Jeu.php tout seul\n// echo $catan->resume();                      // affiche « Catan (4 joueurs) »\n?>",
    note: "Avec la règle PSR-4 \"App\\\\\": \"src/\", la classe App\\Model\\Jeu correspond au fichier src/Model/Jeu.php : le namespace décrit le chemin, le nom de classe = le nom du fichier.",
    atoi: { cmd: "php -l src/Model/Jeu.php", expected: "No syntax errors detected in src/Model/Jeu.php" },
    checklist: [
      "La TOUTE PREMIÈRE instruction après <?php est namespace App\\Model; (rien ne la précède).",
      "La classe Jeu utilise des propriétés promues dans le constructeur : public string $titre et public int $joueurs.",
      "Le second bloc importe la classe avec use App\\Model\\Jeu; avant de faire new Jeu(...).",
      "Un commentaire explique que PSR-4 (\"App\\\\\": \"src/\") fait pointer App\\Model\\Jeu vers src/Model/Jeu.php."
    ] }
  ]
};
</script>
