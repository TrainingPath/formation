<script>
var DAY = {
  num: 17,
  title: "Constructeurs, visibilité, héritage",
  subtitle: "extends, protected, parent:: — l'arbre de familles PHP.",
  theory: `
<h3>1. L'héritage PHP : extends (comme Java !)</h3>
<p>L'<strong>héritage</strong> permet à une classe (la fille) de réutiliser tout ce qu'une autre classe (la mère) possède déjà, puis d'ajouter ou de modifier des comportements. On dit « une fille EST une sorte de mère ».</p>
<pre class="pseudo">class Animal {                             // classe MÈRE
    protected string $nom;                 // protected : accessible dans la classe ET ses filles
    public function __construct(string $nom) {   // constructeur : reçoit le nom
        $this->nom = $nom;                 // range le nom dans l'attribut
    }                                      // fin du constructeur
    public function manger(): void {       // comportement commun à tous les animaux
        echo $this->nom . " mange&lt;br&gt;";    // affiche « <nom> mange »
    }                                      // fin de manger
    public function crier(): void {        // cri générique…
        echo "...&lt;br&gt;";                    // …à préciser dans les classes filles
    }                                      // fin de crier
}                                          // fin de la classe Animal
class Chien extends Animal {               // « extends Animal » = Chien HÉRITE d'Animal
    public function crier(): void {        // REDÉFINITION du cri (même nom que chez la mère)
        echo $this->nom . " : Wouf !&lt;br&gt;"; // le chien aboie
    }                                      // fin de crier
    public function rapporter(): void {    // méthode PROPRE au chien (la mère ne l'a pas)
        echo $this->nom . " rapporte&lt;br&gt;"; // comportement spécifique
    }                                      // fin de rapporter
}                                          // fin de la classe Chien</pre>

<h3>2. parent:: — le super de PHP</h3>
<pre class="pseudo">class Chiot extends Chien {                // Chiot hérite de Chien (petit-enfant d'Animal)
    public function __construct(string $nom, private int $mois) {  // « private int $mois » crée AUSSI l'attribut (promotion)
        parent::__construct($nom);         // appelle le constructeur de la classe MÈRE (Chien → Animal)
    }                                      // fin du constructeur
    public function crier(): void {        // on redéfinit crier
        parent::crier();                   // exécute d'abord la version du parent…
        echo "(petit wouf)&lt;br&gt;";           // …puis ajoute son propre comportement
    }                                      // fin de crier
}                                          // fin de la classe Chiot</pre>

<h3>3. La visibilité en trois niveaux (identique à Java)</h3>
<pre class="pseudo">private    → la classe seule            // accessible uniquement à l'intérieur de la classe
protected  → la classe + ses descendantes   // la classe et ses filles y ont accès
public     → tout le monde              // accessible de partout</pre>
<p>On met les attributs en <code>private</code> (ou <code>protected</code>) et on expose des méthodes publiques choisies : c'est l'encapsulation, comme en Java.</p>

<h3>4. Polymorphisme : le zoo, version PHP</h3>
<pre class="pseudo">$zoo = [new Chien("Rex"), new Chat("Mia"), new Chien("Fido")];  // un tableau d'objets de classes différentes
foreach ($zoo as $animal) {                // $animal = un objet à chaque tour
    $animal->crier();          // chacun exécute SA version de crier — sans aucun if sur le type !
}                                          // fin du parcours
// affiche : Rex : Wouf ! / Mia : Miaou ! / Fido : Wouf !</pre>
<p>Même appel <code>$animal->crier()</code>, comportement différent selon l'objet réel : c'est le <strong>polymorphisme</strong>, choisi à l'exécution.</p>

<h3>5. abstract et interface : les contrats PHP</h3>
<pre class="pseudo">abstract class Animal {                        // abstract : on ne peut PAS faire new Animal(...)
    abstract public function crier(): void;    // méthode abstraite (sans corps) : chaque fille DOIT la définir
    public function manger(): void { /* ... */ } // méthode concrète : code partagé par toutes les filles
}                                              // fin de la classe abstraite
interface Exportable {                         // une interface = un contrat de capacités
    public function toJson(): string;          // juste la signature (une promesse à tenir)
}                                              // fin de l'interface
class Chien extends Animal implements Exportable {  // UNE classe mère (extends) + une interface (implements)
    public function crier(): void { /* ... */ }     // remplit l'obligation abstract (crier)
    public function toJson(): string {              // remplit l'obligation de l'interface (toJson)
        return json_encode(["nom" => $this->nom]);  // renvoie l'objet en JSON
    }                                               // fin de toJson
}                                                   // fin de la classe Chien</pre>
<div class="tip">Tout le chapitre POO de Java (leçons 14-15) se transpose : <code>extends</code> (1 seule classe mère), <code>implements</code> (plusieurs interfaces), <code>abstract</code> (moule inachevé). Seuls changent : <code>parent::</code> au lieu de <code>super</code>, et la flèche <code>-&gt;</code> au lieu du point.</div>

<h3>6. instanceof : tester le type d'un objet</h3>
<pre class="pseudo">if ($animal instanceof Chien) { $animal->rapporter(); }      // « $animal est-il un Chien ? » avant d'appeler une méthode propre
if ($produit instanceof Exportable) { echo $produit->toJson(); }  // respecte-t-il le contrat Exportable ?</pre>`,
  exercises: [
    { type: "qcm", q: "L'héritage PHP se déclare avec…", opts: ["inherits", "extends, exactement comme Java", ":", "use"], a: 1, exp: "class Chien extends Animal — terrain connu." },
    { type: "qcm", q: "Le super de Java devient en PHP…", opts: ["super::", "parent:: (parent::__construct, parent::crier)", "base::", "mother::"], a: 1, exp: "Même rôle : invoquer la version de la classe mère." },
    { type: "qcm", q: "protected rend un membre visible…", opts: ["Partout", "Dans la classe ET ses descendantes (identique à Java)", "Nulle part", "Au fichier"], a: 1, exp: "Le niveau intermédiaire : les filles héritent de l'accès." },
    { type: "qcm", q: "$zoo = [Chien, Chat, Chien] ; foreach + crier() : chacun crie à sa façon. C'est…", opts: ["Un bug", "Le POLYMORPHISME : le type réel de l'objet choisit la méthode", "Du hasard", "L'interface"], a: 1, exp: "Le zoo de Java leçon 14, flèche comprise." },
    { type: "qcm", q: "Dans Chiot::crier(), parent::crier() PUIS un echo supplémentaire montre que…", opts: ["C'est interdit", "On peut ÉTENDRE un comportement hérité au lieu de le remplacer entièrement", "PHP est lent", "Le chiot est muet"], a: 1, exp: "Redéfinir n'oblige pas à tout réécrire : on complète." },
    { type: "qcm", q: "new Animal(\"X\") avec Animal abstraite :", opts: ["Un animal générique", "Erreur fatale : une classe abstraite ne s'instancie pas (Java leçon 15 !)", "null", "Un Chien"], a: 1, exp: "Le moule inachevé, règle universelle." },
    { type: "qcm", q: "Une classe PHP peut étendre … et implémenter … :", opts: ["Plusieurs classes, une interface", "UNE classe, PLUSIEURS interfaces — la règle Java, identique", "Deux classes max", "Tout ce qu'elle veut"], a: 1, exp: "Héritage simple + contrats multiples : le standard des deux langages." },
    { type: "qcm", q: "Une classe implements Exportable sans écrire toJson() :", opts: ["Ça marche", "Erreur fatale : le contrat doit être tenu (ou la classe déclarée abstraite)", "toJson vaut null", "Warning"], a: 1, exp: "Une promesse signée est vérifiée par l'interpréteur." },
    { type: "qcm", q: "$animal instanceof Chien teste…", opts: ["Le nom de l'animal", "Si l'objet EST un Chien (ou une sous-classe de Chien)", "La taille", "L'existence de la classe"], a: 1, exp: "Le même instanceof que Java : tester avant les méthodes spécifiques." },
    { type: "qcm", q: "Pourquoi $this->nom est-il accessible dans Chien alors qu'il est déclaré dans Animal ?", opts: ["$this rend tout attribut accessible partout", "Il est PROTECTED : l'héritage transmet l'accès aux descendantes", "Il est public", "Erreur du cours"], a: 1, exp: "private l'aurait caché même aux filles : protected est le choix délibéré." },
    { type: "qcm", q: "« Un CompteEpargne est un Compte avec un taux » se modélise par…", opts: ["Une interface", "class CompteEpargne extends Compte + attribut $taux : le test « est un » sonne juste", "Une session", "Un tableau"], a: 1, exp: "L'héritage quand la phrase « est un » fonctionne (Java leçon 14)." },
    { type: "qcm", q: "« Une Facture et un Produit sont tous deux exportables en JSON » (aucun lien de famille) :", opts: ["Héritage forcé", "interface Exportable : le CONTRAT traverse les familles", "Copier-coller", "Impossible"], a: 1, exp: "Capacité commune sans parenté = interface." },
    { type: "qcm", q: "abstract public function crier(): void; (sans corps) impose…", opts: ["Le silence", "Que chaque fille CONCRÈTE définisse crier() — vérifié par PHP", "Un cri par défaut", "private"], a: 1, exp: "L'exigence du moule : plus de « ... » silencieux oublié." },
    { type: "qcm", q: "Ajouter une classe Vache au zoo exige de modifier la boucle foreach ?", opts: ["Oui, un if", "NON : elle crie déjà à sa façon via le polymorphisme — extension sans modification", "Oui, le tableau", "La boucle plante"], a: 1, exp: "L'« ouvert/fermé » : le graal de conception, valable dans chaque langage." },
    { type: "vf", q: "Conceptuellement, ce chapitre est une révision : seule la syntaxe (parent::, ->) est nouvelle.", a: true, exp: "Troisième langage, même POO : la preuve que les concepts priment." }
  ],
  final: {
    title: "Exercice final — Les utilisateurs du site",
    intro: `<p>Le site modélise ses comptes :</p>
<pre class="pseudo">abstract class Utilisateur {                        // classe abstraite : pas de new Utilisateur direct
    public function __construct(protected string $pseudo) {}   // promotion : crée et affecte l'attribut $pseudo
    public function sePresenter(): string {         // méthode PARTAGÉE par toutes les filles
        return $this->pseudo . " (" . $this->role() . ")";   // utilise role() défini par la fille
    }                                               // fin de sePresenter
    abstract public function role(): string;        // méthode abstraite : chaque fille DOIT la fournir
}                                                   // fin de la classe abstraite
class Membre extends Utilisateur {                  // un Membre EST un Utilisateur
    public function role(): string { return "membre"; }   // sa version de role()
}                                                   // fin de Membre
class Admin extends Utilisateur {                   // un Admin EST un Utilisateur
    public function role(): string { return "ADMIN"; }    // sa version de role()
    public function bannir(Membre $m): string {     // méthode propre à Admin ; n'accepte QU'un Membre
        return $this->pseudo . " bannit " . $m->sePresenter();  // renvoie le message de bannissement
    }                                               // fin de bannir
}                                                   // fin d'Admin
$users = [new Membre("ana"), new Admin("root"), new Membre("bob")];  // tableau d'utilisateurs variés
foreach ($users as $u) {                            // $u = un utilisateur à chaque tour
    echo $u->sePresenter() . "&lt;br&gt;";              // (1) chacun se présente avec SON rôle
}                                                   // fin du parcours</pre>`,
    questions: [
      { type: "qcm", q: "(1) Qu'affiche la boucle ?", opts: ["Trois fois « membre »", "ana (membre) / root (ADMIN) / bob (membre) : sePresenter est PARTAGÉE, role() est POLYMORPHE", "Erreur", "ana root bob"], a: 1, exp: "La méthode commune appelle la méthode abstraite : le patron « template method » sans le savoir !" },
      { type: "qcm", q: "sePresenter() est écrite UNE fois dans Utilisateur mais affiche un rôle différent par classe. Comment ?", opts: ["Trois copies cachées", "Elle appelle $this->role() : à l'exécution, la version de l'objet RÉEL répond", "if instanceof partout", "PHP choisit une version au hasard à l'exécution"], a: 1, exp: "Le polymorphisme travaille même À L'INTÉRIEUR de la classe mère." },
      { type: "qcm", q: "new Utilisateur(\"x\") produit…", opts: ["Un utilisateur neutre", "Une erreur : la classe est abstraite — seuls Membre et Admin existent en vrai", "Un membre", "null"], a: 1, exp: "Le « rôle générique » n'a pas de sens : l'abstraction l'encode." },
      { type: "qcm", q: "bannir(Membre $m) : le TYPE du paramètre garantit…", opts: ["Rien", "Qu'on ne peut bannir QUE des Membres : bannir un Admin est refusé PAR PHP (TypeError)", "La vitesse", "La casse"], a: 1, exp: "Le typage des paramètres (leçon 9) + la hiérarchie = des règles métier gratuites." },
      { type: "qcm", q: "Pour trouver tous les admins du tableau $users :", opts: ["Par pseudo", "array_filter($users, fn($u) => $u instanceof Admin) : le filtre (leçon 9) + le test de type", "Impossible", "sort"], a: 1, exp: "Fonctions fléchées + POO : les chapitres se composent, comme tes algorithmes." }
    ],
    solution: `<pre class="pseudo">Affichage :                                    // ce que produit la boucle
ana (membre)                                   // Membre → role() = "membre"
root (ADMIN)                                   // Admin → role() = "ADMIN"
bob (membre)                                   // Membre → role() = "membre"

Mécanique remarquable :                        // pourquoi ça marche
sePresenter (mère) → $this->role() → version de l'objet réel.   // polymorphisme depuis la mère
Une méthode partagée + une abstraite = un patron extensible :   // le patron « template method »
ajouter class Moderateur { role() } suffit, RIEN d'autre ne bouge.</pre>
<p>La POO PHP est complète : classes, héritage, abstraction, contrats. Demain : le grand saut du web — les bases de données avec PDO.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code PHP ici…",
  items: [
  { id: "php-heritage", title: "Héritage : ProduitNumerique", level: 3,
    statement: "Reprends la classe <code>Produit</code> (leçon 16) et crée une classe <code>ProduitNumerique</code> qui en <strong>hérite</strong>, ajoute une propriété <code>$tailleMo</code> et <strong>redéfinit</strong> <code>afficher()</code> pour montrer aussi la taille. Le prix doit passer en visibilité <code>protected</code>.",
    hints: [
      "class ProduitNumerique extends Produit — extends établit l'héritage.",
      "private dans le parent = INVISIBLE pour l'enfant. Passe $nom et $prix en protected pour que la fille puisse les lire.",
      "Le constructeur de la fille appelle celui du parent : parent::__construct($nom, $prix); puis initialise $tailleMo."
    ],
    atoi: { cmd: "php heritage.php",
      expected: "Deux lignes : « Livre papier : 15 €<br> » (objet Produit, affichage de base) puis « E-book : 8 € (2.5 Mo)<br> » (objet ProduitNumerique). La version redéfinie d'afficher() dans la classe fille ajoute la taille en Mo ; le constructeur de la fille délègue nom et prix au parent via parent::__construct()." },
    checklist: [
      "ProduitNumerique extends Produit hérite de tout le parent et ajoute la propriété $tailleMo.",
      "$prix est en protected (et non private) pour rester accessible dans la classe fille.",
      "parent::__construct($nom, $prix) délègue l'initialisation commune au constructeur du parent.",
      "afficher() est REDÉFINIE dans la fille : c'est sa version qui s'exécute sur un ProduitNumerique."
    ],
    solution: "<?php                                        // ouvre la zone PHP\nclass Produit {                              // classe PARENT\n    protected string $nom;                   // protected : visible ici ET dans les classes filles\n    protected float $prix;                   // private aurait caché $prix à la fille !\n\n    public function __construct(string $nom, float $prix) { // constructeur du parent\n        $this->nom = $nom;                   // initialise le nom\n        $this->prix = $prix;                 // initialise le prix\n    }                                        // fin du constructeur\n\n    public function afficher(): void {       // méthode qui sera redéfinie\n        echo \"$this->nom : $this->prix €<br>\"; // affichage de base\n    }                                        // fin d'afficher\n}                                            // fin de Produit\n\nclass ProduitNumerique extends Produit {     // HÉRITE de tout ce que Produit possède\n    private float $tailleMo;                 // propriété SUPPLÉMENTAIRE propre à la fille\n\n    public function __construct(string $nom, float $prix, float $tailleMo) { // 3 paramètres\n        parent::__construct($nom, $prix);    // délègue nom et prix au constructeur du PARENT\n        $this->tailleMo = $tailleMo;         // initialise la nouveauté\n    }                                        // fin du constructeur\n\n    public function afficher(): void {       // REDÉFINITION : remplace la version du parent\n        echo \"$this->nom : $this->prix € ($this->tailleMo Mo)<br>\"; // version enrichie\n    }                                        // fin d'afficher\n}                                            // fin de ProduitNumerique\n\n$livre = new Produit(\"Livre papier\", 15);    // objet du parent\n$ebook = new ProduitNumerique(\"E-book\", 8, 2.5); // objet de la fille\n\n$livre->afficher();                          // Livre papier : 15 €\n$ebook->afficher();                          // E-book : 8 € (2.5 Mo) ← la version redéfinie s'exécute\n?>",
    note: "private cache même aux enfants ; protected partage avec la descendance : le choix de visibilité est stratégique." }
  ]
};
