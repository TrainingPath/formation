var DAY = {
  num: 9,
  title: "Les fonctions",
  subtitle: "Les jours 20-21 d'algorithmique : function, return, et les types optionnels.",
  theory: `
<h3>1. Déclarer et appeler</h3>
<p>Une <strong>fonction</strong> est un mini-programme réutilisable : on lui donne un nom, elle reçoit éventuellement des données (les <strong>paramètres</strong>), effectue un travail, et peut <strong>renvoyer</strong> un résultat. C'est comme une recette : on l'écrit une fois, on l'utilise autant de fois qu'on veut.</p>
<pre class="pseudo">PSEUDOCODE                         PHP                        // à gauche le pseudocode, à droite le PHP
FONCTION carre(x) : ENTIER          function carre($x) {   // function + nom + paramètre ($x) entre parenthèses
    RETOURNER x * x                     return $x * $x;     // return renvoie le résultat à celui qui a appelé
FIN                                 }                      // accolade fermante : fin de la fonction
carre(4) → 16                       echo carre(4);    // APPELLE la fonction avec 4 → renvoie 16 → echo l'affiche</pre>
<p>Pas de type obligatoire, pas de <code>void</code>/<code>int</code> à choisir : le mot-clé <code>function</code>, des paramètres avec <code>$</code>, et <code>return</code> si on a quelque chose à renvoyer.</p>

<h3>2. Typer quand même : la rigueur volontaire</h3>
<pre class="pseudo">function carre(int $x): int {          // int $x = paramètre entier ; : int = type de la valeur RETOURNÉE
    return $x * $x;                    // renvoie le carré de $x
}                                      // fin de la fonction
carre("abc");     // TypeError : le contrat de type est vérifié à l'exécution (une chaîne est refusée) !
function moyenne(array $t): float { /* ... */ }   // reçoit un tableau (array), renvoie un float
function journaliser(string $msg): void { /* ... */ }  // : void = ne renvoie rien (juste une action)</pre>
<div class="tip">Les déclarations de types sont OPTIONNELLES en PHP mais fortement conseillées : elles ramènent une partie de la sécurité du typage Java. Un développeur moderne type tout, pour attraper les erreurs plus tôt.</div>

<h3>3. Paramètres par défaut</h3>
<pre class="pseudo">function saluer($nom, $politesse = "Bonjour") {   // $politesse a une valeur PAR DÉFAUT si on ne la fournit pas
    return "$politesse $nom !";                   // interpolation des variables dans la chaîne
}                                                 // fin de la fonction
saluer("Ana")           → "Bonjour Ana !"          // 2e argument absent : $politesse prend "Bonjour"
saluer("Ana", "Salut")  → "Salut Ana !"            // on fournit explicitement la 2e valeur</pre>

<h3>4. Portée : les variables ne traversent pas les murs</h3>
<p>La <strong>portée</strong> d'une variable, c'est la zone du code où elle est visible.</p>
<pre class="pseudo">$tva = 0.21;                        // variable définie À L'EXTÉRIEUR de toute fonction
function prixTTC($ht) {             // début d'une fonction : elle a sa propre « bulle »
    return $ht * (1 + $tva);        // ERREUR : $tva est INVISIBLE à l'intérieur de la fonction !
}                                   // fin de la fonction
// Solution propre : passer la valeur en PARAMÈTRE
function prixTTC($ht, $tva) { return $ht * (1 + $tva); }   // $tva arrive maintenant proprement comme paramètre</pre>
<div class="warn">En PHP, une fonction ne voit PAS les variables du dehors (chaque fonction a sa « bulle »). Le mot-clé <code>global</code> existe mais est déconseillé : passe plutôt des PARAMÈTRES — c'est de toute façon la bonne pratique. Les constantes (<code>const</code>), elles, restent visibles partout.</div>

<h3>5. Le passage par valeur… et la référence &amp;</h3>
<pre class="pseudo">function doubler($n) { $n *= 2; }        // $n est une COPIE : l'original du dehors reste intact
function vraiDoubler(&amp;$n) { $n *= 2; }   // le &amp; passe la RÉFÉRENCE : l'original EST modifié
// Note : sort($t) modifie ton tableau justement parce que sort est déclarée avec un &amp;</pre>
<p>Par défaut, un argument est copié (la fonction ne touche pas la variable d'origine). Le <code>&amp;</code> devant le paramètre demande au contraire de travailler directement sur la variable passée.</p>

<h3>6. Fonctions fléchées et callbacks</h3>
<p>Un <strong>callback</strong> est une fonction qu'on passe en argument à une autre fonction, pour lui dire quoi faire.</p>
<pre class="pseudo">$carre = fn($x) => $x * $x;               // fonction FLÉCHÉE (anonyme, compacte, depuis PHP 7.4)
$doubles = array_map(fn($x) => $x * 2, [1, 2, 3]);    // TRANSFORME chaque élément → [2, 4, 6]
$grands = array_filter($notes, fn($n) => $n &gt;= 10);   // GARDE les éléments qui passent le test (filtre)
usort($classe, fn($a, $b) => $a["note"] - $b["note"]); // TRIE selon ta règle de comparaison</pre>
<p><code>array_map</code> (transformer chaque élément) et <code>array_filter</code> (garder sous condition) sont tes boucles-motifs, condensés en une ligne grâce à une petite fonction passée en argument (un « callback »).</p>`,
  exercises: [
    { type: "qcm", q: "Déclarer la fonction carre :", opts: ["def carre($x):", "function carre($x) { return $x * $x; }", "public static int carre", "fn carre = x"], a: 1, exp: "function + paramètres $ + return." },
    { type: "input", q: "function f($x) { return $x * $x + 1; } Que vaut f(f(2)) ?", a: "26", ph: "nombre", exp: "5 puis 26 : la composition du jour 21, troisième langue." },
    { type: "qcm", q: "<code>function carre(int $x): int</code> — les types ici sont…", opts: ["Obligatoires en PHP", "OPTIONNELS mais recommandés : ils vérifient le contrat à l'exécution (TypeError sinon)", "Décoratifs", "Interdits"], a: 1, exp: "La rigueur Java, en option consciente." },
    { type: "qcm", q: "saluer(\"Ana\") avec $politesse = \"Bonjour\" par défaut retourne…", opts: ["Erreur : argument manquant", "\"Bonjour Ana !\" : le défaut comble l'absence", "\"Ana\"", "null"], a: 1, exp: "Les paramètres par défaut évitent les surcharges à la Java." },
    { type: "qcm", q: "Une fonction PHP peut-elle lire $tva déclarée dehors ?", opts: ["Oui, naturellement", "NON : portée isolée — il faut la passer en paramètre (ou global, déconseillé)", "Oui si $ devant", "Seulement les constantes"], a: 1, exp: "La bulle du jour 21, version stricte. Les constantes (const), elles, sont visibles partout." },
    { type: "qcm", q: "$x = 5; doubler($x); (corps : $n *= 2). Que vaut $x ?", opts: ["10", "5 : passage par VALEUR, la copie meurt avec la fonction", "0", "Erreur"], a: 1, exp: "Le grand classique du jour 21, confirmé en PHP." },
    { type: "qcm", q: "Comment doubler l'original SANS return ?", opts: ["Impossible", "function vraiDoubler(&$n) : le & passe la RÉFÉRENCE", "global $n", "Deux fois doubler"], a: 1, exp: "Le & explicite — c'est ainsi que sort($t) modifie ton tableau !" },
    { type: "qcm", q: "Pourquoi préférer <code>return</code> à la référence & en général ?", opts: ["& est plus lent", "$x = doubler($x) rend le flux de données VISIBLE ; le & cache la modification", "return est obligatoire", "Aucune raison"], a: 1, exp: "La transparence du jour 21 : on voit qui modifie quoi." },
    { type: "qcm", q: "<code>fn($x) => $x * 2</code> est…", opts: ["Une erreur", "Une fonction FLÉCHÉE : anonyme, compacte, idéale en argument", "Un commentaire", "Un tableau"], a: 1, exp: "La lambda de PHP." },
    { type: "input", q: "array_map(fn($x) => $x + 10, [1, 2, 3]) retourne [11, 12, ?]. Complète.", a: "13", ph: "nombre", exp: "map transforme CHAQUE élément : la boucle de transformation du jour 15, en une ligne." },
    { type: "qcm", q: "array_filter($notes, fn($n) => $n >= 10) retourne…", opts: ["La somme", "Les éléments qui PASSENT le test : le motif « garder sous condition »", "true", "Le premier"], a: 1, exp: "Ton compteur conditionnel avait un cousin collectionneur." },
    { type: "qcm", q: "function f(): void { … } — void signifie…", opts: ["Fonction vide", "La fonction ne retourne RIEN : la procédure des jours 20 (et de Java)", "Fonction privée", "Erreur"], a: 1, exp: "Rien à renvoyer, tout à faire." },
    { type: "qcm", q: "usort($t, fn($a, $b) => $a - $b) fait quoi ?", opts: ["Une somme", "Trie $t selon TON comparateur : négatif = a avant b", "Filtre", "Mélange"], a: 1, exp: "Le tri à comparateur : tu fournis la règle, PHP fournit l'algorithme (n log n, jour 28 !)." },
    { type: "qcm", q: "Une fonction sans return explicite retourne…", opts: ["0", "null", "false", "\"\""], a: 1, exp: "Le « rien » de PHP. À savoir pour déboguer les oublis de return." },
    { type: "qcm", q: "« Valider un email » utilisée 8 fois dans le site. La bonne pratique :", opts: ["Copier-coller 8 fois", "UNE fonction estEmailValide($email): bool, appelée 8 fois (jour 20 : écrire une fois)", "Un commentaire", "8 variantes"], a: 1, exp: "Le copier-coller est l'ennemi ; la fonction est l'arme." }
  ],
  final: {
    title: "Exercice final — La boîte à outils du site",
    intro: `<p>Le site e-commerce assemble ses fonctions typées :</p>
<pre class="pseudo">function prixTTC(float $ht, float $tva = 0.21): float {   // reçoit un prix HT et un taux (0.21 par défaut), renvoie un float
    return $ht * (1 + $tva);                             // applique la TVA et renvoie le prix TTC
}                                                        // fin de la fonction
function enStock(array $stock, string $produit): bool {  // reçoit le stock et un nom, renvoie vrai/faux
    return ($stock[$produit] ?? 0) > 0;                  // ?? 0 : si la clé manque on lit 0 ; disponible si > 0
}                                                        // fin de la fonction
function formatPrix(float $p): string {                  // reçoit un prix, renvoie un texte formaté
    return number_format($p, 2, ",", " ") . " €";        // 2 décimales, virgule décimale, espace des milliers, + " €"
}                                                        // fin de la fonction
$stock = ["clavier" => 4, "souris" => 0];                // stock : clavier=4, souris=0 (épuisée)
echo formatPrix(prixTTC(100));               // (1) prixTTC(100) puis formatPrix : on emboîte les fonctions
var_dump(enStock($stock, "souris"));         // (2) la souris est-elle en stock ? (var_dump montre le résultat)
var_dump(enStock($stock, "webcam"));         // (3) la webcam (clé absente) est-elle en stock ?</pre>`,
    questions: [
      { type: "input", q: "(1) prixTTC(100) sans second argument : quel montant (avant formatage) ?", a: "121", ph: "nombre", exp: "100 × 1.21 : la TVA par défaut joue son rôle." },
      { type: "qcm", q: "(1) formatPrix(121) affiche…", opts: ["121", "121,00 € : deux décimales, virgule française", "121.00", "Erreur"], a: 1, exp: "number_format : le String.format de PHP, localisé." },
      { type: "qcm", q: "(2) enStock($stock, \"souris\") retourne…", opts: ["true", "false : la souris existe mais son stock est 0 — le > 0 tranche", "0", "null"], a: 1, exp: "Exister ≠ être disponible : la fonction encode la nuance." },
      { type: "qcm", q: "(3) Pour \"webcam\" (clé absente), le <code>?? 0</code> évite…", opts: ["Un tri", "Le warning « Undefined array key » : la clé absente devient un 0 propre, donc false", "La TVA", "Le return"], a: 1, exp: "Le cas limite (jour 30) traité DANS la fonction : les appelants sont sereins." },
      { type: "qcm", q: "prixTTC(\"cent\") provoque…", opts: ["\"cent\" × 1.21", "TypeError : le type float $ht déclaré REFUSE la chaîne — la rigueur volontaire paie", "121", "null"], a: 1, exp: "Sans le type, PHP aurait jonglé ou explosé plus loin : le contrat attrape l'erreur À LA SOURCE." }
    ],
    solution: `<pre class="pseudo">prixTTC(100)        → 121.0 (défaut 0.21)          // TVA par défaut appliquée
formatPrix(121.0)   → "121,00 €"                   // formaté en euros
enStock souris      → 0 > 0 → false                // stock 0 → indisponible
enStock webcam      → (?? 0) > 0 → false, sans warning   // clé absente → 0 → false, proprement
prixTTC("cent")     → TypeError (contrat float)    // le type refuse la chaîne

Trois fonctions : chacune UNE mission, typée, testable,     // le principe : une fonction = une tâche
avec ses cas limites intégrés. Le jour 22 en PHP.</pre>
<p>Fonctions + types optionnels + fléchées : l'arsenal est complet. Demain, un tour des fonctions natives qui t'éviteront de réinventer la roue.</p>`
  }
};
