<script>
var DAY = {
  num: 10,
  title: "Fonctions natives incontournables",
  subtitle: "PHP livre des milliers d'outils : voici la trousse de survie.",
  theory: `
<h3>1. Philosophie : chercher avant d'écrire</h3>
<p>Une <strong>fonction native</strong> est un outil déjà fourni par PHP, prêt à l'emploi. PHP en possède environ 8000. Avant de coder un traitement, demande-toi : « n'existe-t-il pas déjà ? ». Réflexe professionnel : consulter <strong>php.net</strong> (le site officiel) — chaque fonction y a sa fiche avec des exemples. Connaître l'EXISTENCE des outils compte plus que les mémoriser tous.</p>

<h3>2. Chaînes : le best-of (rappels + nouveautés)</h3>
<pre class="pseudo">strlen · strtoupper · strtolower · trim · substr           // longueur, casse (maj/min), nettoyage, extraction de morceau
str_replace · str_contains · strrev · explode · implode    // remplacer, chercher, inverser, découper, recoller
ucfirst("bonjour")     → "Bonjour"                          // 1re lettre en majuscule
ucwords("jean dupont") → "Jean Dupont"                      // 1re lettre de CHAQUE mot en majuscule
str_pad("7", 3, "0", STR_PAD_LEFT) → "007"                  // complète à GAUCHE avec des "0" jusqu'à 3 caractères
sprintf("%05.2f", 3.1) → "03.10"      // formate un nombre : 5 caractères au total, 2 décimales, complété de zéros
number_format(1234.5, 2, ",", " ") → "1 234,50"            // format financier : 2 décimales, virgule décimale, espace des milliers</pre>

<h3>3. Tableaux : la seconde vague</h3>
<pre class="pseudo">array_unique([1,2,2,3])       → [1,2,3]      // supprime les doublons (garde une seule copie de chaque valeur)
array_merge($a, $b)           → fusion       // colle deux tableaux bout à bout
array_slice($t, 0, 3)         → les 3 premiers  // extrait un sous-tableau (départ, longueur)
in_array · array_search · sort · rsort · usort   // chercher une valeur, trouver sa position, trier
array_map(fn, $t)             → transformer chaque élément   // applique une fonction à chaque valeur
array_filter($t, fn)          → garder les éléments qui passent un test   // filtre selon une condition
array_keys · array_values · count · array_sum    // les clés, les valeurs, le nombre d'éléments, la somme
range(1, 10)                  → [1,2,…,10]   // GÉNÈRE une séquence d'entiers de 1 à 10
array_rand($t)                → une CLÉ au hasard   // pioche une position au hasard
shuffle($t)                   → mélange le tableau SUR PLACE   // rebat les cartes dans $t directement</pre>

<h3>4. Nombres et hasard</h3>
<pre class="pseudo">round(3.456, 2) → 3.46 · floor · ceil · abs · intdiv   // arrondir, plancher (bas), plafond (haut), valeur absolue, division entière
rand(1, 6)      → un dé (bornes incluses)              // entier aléatoire de 1 à 6, les deux bornes comprises
random_int(1, 6) → même chose mais cryptographiquement sûr (à préférer)   // version sécurisée, recommandée</pre>

<h3>5. Dates : time() et date()</h3>
<pre class="pseudo">time()                        → timestamp    // nombre de secondes écoulées depuis le 1er janvier 1970
date("d/m/Y")                 → "03/07/2026"          // formate le timestamp courant en jour/mois/année
date("H:i")                   → "14:30"               // heures:minutes
date("d/m/Y", time() + 7*24*3600)  → dans une semaine // on décale le timestamp de 7 jours (exprimés en secondes)
strtotime("2026-09-15")       → un timestamp  // convertit une date écrite en texte en timestamp (nombre de secondes)
// Moderne : new DateTime("2026-09-15") — la POO arrive à la leçon 16 !</pre>

<h3>6. Le réflexe documentation</h3>
<div class="tip">Tu ne peux PAS tout retenir — personne ne le fait. Retiens l'EXISTENCE des familles (<code>str_*</code>, <code>array_*</code>, <code>date</code>) et la façon de lire une signature sur php.net : <code>implode(string $separator, array $array): string</code> te donne les types des paramètres ET le type de retour. C'est ta carte au trésor.</div>
<div class="warn">Attention aux incohérences historiques de PHP : l'ordre « aiguille / botte de foin » change selon les fonctions (<code>in_array($aiguille, $botte)</code> mais <code>strpos($botte, $aiguille)</code> !). En cas de doute : php.net, pas la mémoire.</div>`,
  exercises: [
    { type: "input", q: "Que vaut <code>ucwords(\"jean dupont\")</code> ?", a: ["Jean Dupont"], ph: "texte", exp: "Majuscule à chaque mot : parfait pour les noms." },
    { type: "input", q: "Que vaut <code>str_pad(\"42\", 5, \"0\", STR_PAD_LEFT)</code> ?", a: ["00042"], ph: "texte", exp: "Complété à gauche : les numéros de facture (comme %05d en Java !)." },
    { type: "input", q: "Que vaut <code>array_unique([3, 1, 3, 2, 1])</code> ? (liste les valeurs restantes dans l'ordre, séparées par des virgules)", a: ["3,1,2", "3, 1, 2"], ph: "x,y,z", exp: "Chaque valeur ne garde que sa première apparition." },
    { type: "qcm", q: "range(1, 5) retourne…", opts: ["\"12345\"", "[1, 2, 3, 4, 5] : le générateur de séquences", "5", "[1, 5]"], a: 1, exp: "Combiné à array_sum : la somme de 1 à n en une ligne !" },
    { type: "input", q: "Que vaut <code>array_sum(range(1, 10))</code> ?", a: "55", ph: "nombre", exp: "1+2+…+10 = 55 : deux natives composées." },
    { type: "qcm", q: "Mélanger un tableau (jeu de cartes) :", opts: ["sort($t)", "shuffle($t) : mélange SUR PLACE", "array_rand", "reverse"], a: 1, exp: "shuffle mélange le tableau ; array_rand tire une clé au hasard sans toucher au tableau." },
    { type: "qcm", q: "Pour le hasard, la fonction moderne recommandée :", opts: ["rand()", "random_int(min, max) : cryptographiquement sûr, bornes incluses", "mt_seed", "hasard()"], a: 1, exp: "rand() convient aux jeux ; random_int partout où la sécurité compte." },
    { type: "input", q: "Que vaut <code>round(3.14159, 2)</code> ?", a: ["3.14", "3,14"], ph: "nombre", exp: "Arrondi à 2 décimales." },
    { type: "qcm", q: "time() retourne…", opts: ["\"14:30\"", "Le TIMESTAMP : nombre de secondes écoulées depuis le 1ᵉʳ janvier 1970", "La date formatée", "L'heure du visiteur"], a: 1, exp: "L'horloge universelle d'Unix : tout calcul de temps part de là." },
    { type: "qcm", q: "Afficher la date de demain :", opts: ["date(\"d/m/Y\") + 1", "date(\"d/m/Y\", time() + 24*3600) : timestamp décalé de 86400 secondes", "tomorrow()", "date + 1 jour"], a: 1, exp: "On calcule en secondes, on formate ensuite." },
    { type: "input", q: "Que vaut <code>number_format(1234.5, 2, \",\", \" \")</code> ?", a: ["1 234,50"], ph: "texte", exp: "Milliers espacés, virgule décimale : l'affichage financier français." },
    { type: "qcm", q: "in_array($aiguille, $botte) mais strpos($botte, $aiguille) : la leçon ?", opts: ["PHP est parfait", "L'ordre des arguments varie selon les familles : VÉRIFIER sur php.net plutôt que deviner", "in_array est bogué", "Toujours aiguille d'abord"], a: 1, exp: "L'héritage historique de PHP : la doc est ton amie." },
    { type: "qcm", q: "Sur php.net, <code>implode(string $separator, array $array): string</code> t'apprend…", opts: ["Rien", "Les types attendus et le type retourné : le contrat complet de la fonction", "Le prix", "La version"], a: 1, exp: "Lire une signature = savoir utiliser la fonction sans tutoriel." },
    { type: "qcm", q: "Extraire les 3 premiers éléments d'un tableau :", opts: ["$t[0..3]", "array_slice($t, 0, 3)", "substr($t, 3)", "top3($t)"], a: 1, exp: "slice : départ, longueur — le substr des tableaux." },
    { type: "qcm", q: "Avant de coder un dédoublonnage maison, le réflexe pro :", opts: ["Coder direct", "Chercher : array_unique existe — 5 secondes de doc économisent 20 lignes", "Demander au client", "Utiliser sort"], a: 1, exp: "Connaître l'existence des outils vaut mieux que les mémoriser tous." }
  ],
  final: {
    title: "Exercice final — Le générateur de loterie",
    intro: `<p>Le comité des fêtes tire 3 numéros uniques entre 1 et 20 et affiche un ticket daté :</p>
<pre class="pseudo">$boules = range(1, 20);                    // (1) fabrique le tableau [1, 2, …, 20]
shuffle($boules);                          // (2) mélange les 20 boules dans un ordre aléatoire
$tirage = array_slice($boules, 0, 3);      // (3) prend les 3 premières boules du tableau mélangé
sort($tirage);                             // (4) trie ces 3 numéros dans l'ordre croissant
$ticket = "Tirage du " . date("d/m/Y") . " : " . implode(" - ", $tirage);  // assemble le texte : date + numéros joints par " - "
echo $ticket;   // ex : Tirage du 03/07/2026 : 4 - 11 - 19   // affiche le ticket final</pre>`,
    questions: [
      { type: "input", q: "(1) Combien d'éléments dans $boules ?", a: "20", ph: "nombre", exp: "range(1, 20) : les 20 boules." },
      { type: "qcm", q: "(2)+(3) Pourquoi shuffle PUIS slice garantit-il 3 numéros UNIQUES ?", opts: ["Par chance", "On mélange les 20 boules puis on prend les 3 premières : aucun doublon possible, contrairement à 3 random_int !", "sort dédoublonne", "PHP interdit les doublons"], a: 1, exp: "Trois random_int pourraient tirer deux fois le même numéro. Le mélange-découpe, jamais." },
      { type: "qcm", q: "(4) Pourquoi trier le tirage ?", opts: ["Obligatoire", "Lisibilité : « 4 - 11 - 19 » se lit mieux que « 19 - 4 - 11 » — un choix d'ergonomie", "Sinon erreur", "Pour dédoublonner"], a: 1, exp: "La technique au service de l'humain." },
      { type: "qcm", q: "implode(\" - \", [4, 11, 19]) retourne…", opts: ["[4-11-19]", "\"4 - 11 - 19\" : le tableau devient une chaîne jointe", "3", "\"41119\""], a: 1, exp: "Le recolleur en action." },
      { type: "qcm", q: "Ce programme de 6 lignes aurait demandé combien de code « manuel » ?", opts: ["6 lignes aussi", "Des dizaines : générer, mélanger (algorithme !), dédoublonner, trier, formater — les natives condensent des algorithmes entiers", "Plus de 1000", "Impossible à la main"], a: 1, exp: "Chaque native encapsule un algorithme que tu SAIS écrire (mois d'algo) : tu utilises en connaissance de cause." }
    ],
    solution: `<pre class="pseudo">range(1,20)   → [1..20]                              // génère les 20 numéros
shuffle       → ordre aléatoire (algorithme de mélange)   // rebat les boules
slice(0,3)    → 3 premiers = 3 uniques garantis      // pas de doublon possible
sort          → ordre croissant                      // pour la lisibilité
implode+date  → "Tirage du 03/07/2026 : 4 - 11 - 19" // assemble le ticket

Le pipeline : générer → mélanger → découper → trier → formater.   // 5 étapes enchaînées
Six natives, zéro boucle écrite… mais tu sais ce que chacune fait.</pre>
<p>La semaine 1 PHP s'achève : bases + outils. Demain, le grand pont — tes algorithmes du mois dernier, traduits en PHP.</p>`
  }
};

<script>
var ECRITURE = {
  placeholder: "Écris ton code PHP ici…",
  items: [
  { id: "php-pseudo", title: "Le nettoyeur de pseudo", level: 2,
    statement: "Une variable <code>$pseudo</code> contient <code>\"   aUrÉlia   \"</code>. Nettoie-la avec les fonctions natives : sans espaces autour, en minuscules puis première lettre en majuscule, et affiche aussi sa longueur.",
    hints: [
      "trim() enlève les espaces au début et à la fin.",
      "Pour les accents, préfère mb_strtolower() à strtolower() ; ucfirst() met la 1re lettre en majuscule.",
      "Enchaîne les appels de l'intérieur vers l'extérieur, et mesure avec mb_strlen()."
    ],
    solution: "<?php                                        // ouvre la zone PHP\n$pseudo = \"   aUrÉlia   \";                   // la chaîne sale à nettoyer\n\n$propre = ucfirst(                           // 3) enfin : première lettre en majuscule\n    mb_strtolower(                           // 2) puis : tout en minuscules (mb_ gère les accents)\n        trim($pseudo)                        // 1) d'abord : retire les espaces autour\n    )                                        // les appels s'évaluent de l'INTÉRIEUR vers l'extérieur\n);                                           // résultat : \"Aurélia\"\n\necho \"Pseudo : $propre<br>\";                 // affiche la version nettoyée\necho \"Longueur : \" . mb_strlen($propre);     // mb_strlen compte les caractères (accents compris)\n?>",
    note: "Les fonctions mb_* (multibyte) gèrent correctement les accents — réflexe à prendre." },
  { id: "php-palindrome", title: "Le palindrome", level: 2,
    statement: "Écris une fonction <code>estPalindrome($mot)</code> qui renvoie <code>true</code> si le mot se lit dans les deux sens (radar, kayak…), en ignorant majuscules et espaces. Teste-la sur trois mots.",
    hints: [
      "Nettoie d'abord : str_replace(\" \", \"\", …) enlève les espaces, mb_strtolower met en minuscules.",
      "strrev($mot) renvoie la chaîne inversée.",
      "Il suffit de comparer : return $propre === strrev($propre); — le === strict est le bon réflexe PHP."
    ],
    solution: "<?php                                        // ouvre la zone PHP\nfunction estPalindrome($mot) {               // la fonction renvoie true ou false\n    $propre = mb_strtolower(                 // 2) puis : tout en minuscules\n        str_replace(\" \", \"\", $mot)           // 1) d'abord : supprime tous les espaces\n    );                                       // \"a b a\" → \"aba\"\n    return $propre === strrev($propre);      // compare la chaîne à son inverse (=== : comparaison STRICTE)\n}                                            // fin de la fonction\n\nvar_dump(estPalindrome(\"radar\"));            // bool(true)  — var_dump montre le type ET la valeur\nvar_dump(estPalindrome(\"kayak\"));            // bool(true)\nvar_dump(estPalindrome(\"bonjour\"));          // bool(false)\n?>",
    note: "strrev ne gère pas bien les accents (multi-octets) — pour un mot accentué il faudrait découper avec mb_str_split." }
  ]
};
