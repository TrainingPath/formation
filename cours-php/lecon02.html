<script>
var DAY = {
  num: 2,
  title: "Variables et types dynamiques",
  subtitle: "Le $ partout, et des types qui se devinent tout seuls.",
  theory: `
<h3>1. Le dollar obligatoire</h3>
<p>Une <strong>variable</strong> est une petite boîte étiquetée dans la mémoire de l'ordinateur : elle porte un <em>nom</em> et contient une <em>valeur</em> qu'on peut lire ou remplacer. En PHP, le nom de toute variable commence <strong>obligatoirement</strong> par le signe <code>$</code> (dollar) — c'est le panneau qui dit « ceci est une variable ». Autre particularité : pas besoin de déclarer le <em>type</em> (la nature) de la valeur ; on <strong>affecte</strong> (on range) une valeur avec le signe <code>=</code>, et la variable existe aussitôt.</p>
<pre class="pseudo">PSEUDOCODE            PHP                            // à gauche le pseudocode appris en algo, à droite l'écriture PHP
age ← 15              $age = 15;              // le $ précède TOUJOURS le nom ; le = range la valeur 15 dans la boîte $age
prenom ← "Léa"        $prenom = "Léa";        // du texte (une « chaîne »), toujours entre guillemets
prix ← 19.99          $prix = 19.99;          // un nombre à virgule : on écrit un POINT décimal, jamais une virgule
estMajeur ← FAUX      $estMajeur = false;     // un booléen : une valeur qui vaut seulement true (vrai) ou false (faux)</pre>

<h3>2. Typage DYNAMIQUE : le type suit la valeur</h3>
<p>Le <strong>type</strong> d'une variable, c'est la nature de ce qu'elle contient (un entier, du texte, un nombre à virgule…). <strong>Dynamique</strong> veut dire que ce type n'est pas figé : une même boîte peut changer de contenu, et donc de type, au fil du programme.</p>
<pre class="pseudo">$x = 15;         // $x contient un int (un entier)
$x = "quinze";   // $x devient une string (du texte) : PHP l'accepte sans broncher !
$x = 3.14;       // puis un float (nombre à virgule)… la même variable a changé trois fois de type</pre>
<div class="warn">Contrairement à Java (typage <em>fort</em>, où le type est verrouillé), PHP laisse une variable changer de type en cours de route. Liberté agréable… et source de bugs sournois : une fonction qui renvoie parfois un nombre, parfois <code>false</code>, par exemple. Reste rigoureux même quand le langage ne l'exige pas.</div>

<h3>3. Les types principaux (ils existent, même invisibles)</h3>
<pre class="pseudo">int      15          // entier : un nombre sans virgule
float    19.99       // réel : un nombre à virgule (float = « flottant »)
string   "Léa"       // chaîne de caractères : du texte entre guillemets
bool     true/false  // booléen : vrai ou faux, rien d'autre
array    [1, 2, 3]   // tableau : une liste de plusieurs valeurs (détaillé leçon 7 !)
null     null        // « rien » : l'absence totale de valeur</pre>
<p><code>var_dump($x)</code> est une <strong>fonction</strong> (un outil tout prêt) qui révèle le type ET la valeur d'une variable : elle affiche par exemple <code>int(15)</code> ou <code>string(3) "Léa"</code>. C'est ton meilleur ami pour <em>déboguer</em> (traquer les erreurs), car en PHP le type n'est jamais écrit dans le code.</p>

<h3>4. Affichage des variables : echo et l'interpolation</h3>
<p><strong>Interpoler</strong> une variable, c'est demander à PHP de la remplacer par sa valeur à l'intérieur d'un texte.</p>
<pre class="pseudo">$prenom = "Léa";                     // on range le texte Léa dans la variable $prenom
echo $prenom;                        // affiche : Léa   (echo envoie la valeur vers la page)
echo "Bonjour $prenom !";            // affiche : Bonjour Léa !   ← guillemets DOUBLES : la variable est REMPLACÉE (interpolation)
echo 'Bonjour $prenom !';            // affiche : Bonjour $prenom !  ← apostrophes : texte LITTÉRAL, aucun remplacement
echo "Total : " . $prix . " €";      // le POINT . concatène (colle bout à bout) plusieurs chaînes</pre>
<div class="tip">Guillemets doubles = les <code>$variables</code> sont REMPLACÉES par leur valeur (interpolation). Apostrophes = texte brut, sans remplacement. Le point <code>.</code> est le <code>&amp;</code> du pseudocode (et le <code>+</code> de Java) : il colle les chaînes. Attention, en PHP le <code>+</code> ADDITIONNE toujours (leçon 3).</div>

<h3>5. Constantes</h3>
<p>Une <strong>constante</strong> est une variable spéciale dont la valeur est fixée une fois pour toutes : impossible de la changer ensuite (un taux de TVA, une année de référence…).</p>
<pre class="pseudo">const TVA = 0.21;            // déclare une constante nommée TVA valant 0.21 (autre écriture : define("TVA", 0.21);)
echo TVA;                    // on l'utilise SANS le $ — c'est ce qui la distingue visuellement d'une variable</pre>
<p>Une constante ne peut pas être réaffectée : elle protège une valeur fixe (un taux, une clé…).</p>

<h3>6. Vérifier l'existence : isset</h3>
<pre class="pseudo">$a = 5;                    // on crée la variable $a avec la valeur 5
isset($a)      // → true : $a existe et n'est pas null (« isset » = « is set » = « est définie »)
isset($b)      // → false : $b n'a JAMAIS été définie (crucial pour les formulaires, leçon 12 !)</pre>
<p><code>isset</code> teste si une variable existe avant de l'utiliser : indispensable pour les données venues de l'extérieur (formulaires, URL…), qui peuvent être absentes.</p>`,
  exercises: [
    { type: "qcm", q: "Traduire <code>age ← 15</code> en PHP :", opts: ["int age = 15;", "$age = 15;", "age := 15", "var age = 15;"], a: 1, exp: "$ + nom + = + valeur + ; — pas de type à écrire." },
    { type: "qcm", q: "Que signifie « typage dynamique » ?", opts: ["Les variables sont rapides", "Le type d'une variable suit sa valeur et peut CHANGER en cours de route", "Il n'y a pas de types", "Les types sont déclarés"], a: 1, exp: "Le type existe (var_dump le montre) mais n'est pas verrouillé." },
    { type: "qcm", q: "$x = 15; $x = \"bonjour\"; est…", opts: ["Une erreur comme en Java", "Légal en PHP : $x change de type — pratique ET dangereux", "Un mélange interdit", "Un tableau"], a: 1, exp: "La grande différence avec Java : aucune barrière de type." },
    { type: "qcm", q: "Quel outil révèle le type exact d'une variable ?", opts: ["echo", "var_dump($x)", "typeof", "print"], a: 1, exp: "int(15), string(3) \"Léa\"… le microscope du débogueur PHP." },
    { type: "qcm", q: "$prenom = \"Léa\"; echo \"Salut $prenom\"; affiche…", opts: ["Salut $prenom", "Salut Léa : guillemets doubles = interpolation", "Erreur", "$prenom"], a: 1, exp: "La variable est remplacée par sa valeur dans la chaîne." },
    { type: "qcm", q: "echo 'Salut $prenom'; (apostrophes) affiche…", opts: ["Salut Léa", "Salut $prenom : les apostrophes n'interpolent PAS", "Erreur", "Salut"], a: 1, exp: "LE piège guillemets/apostrophes : à maîtriser absolument." },
    { type: "qcm", q: "L'opérateur de concaténation PHP est…", opts: ["+", ". (le point)", "&", ","], a: 1, exp: "\"a\" . \"b\" → \"ab\". Le + de PHP ADDITIONNE toujours (leçon 3) !" },
    { type: "input", q: "$a = \"al\"; $b = \"go\"; echo $a . $b; affiche… ?", a: ["algo"], ph: "texte", exp: "Le point colle : algo." },
    { type: "input", q: "Trace : $x = 4; $y = $x + 3; $x = $y * 2; Que vaut $x ?", a: "14", ph: "nombre", exp: "y = 7, x = 14 : la trace du jour 2 d'algo, avec des $." },
    { type: "qcm", q: "Une constante se déclare…", opts: ["$TVA = 0.21 pour toujours", "const TVA = 0.21; et s'utilise SANS $", "constant TVA;", "final TVA"], a: 1, exp: "Le sans-$ la distingue visuellement des variables." },
    { type: "qcm", q: "isset($x) retourne…", opts: ["La valeur de $x", "true si $x existe (a reçu une valeur non-null), false sinon", "Le type", "0"], a: 1, exp: "Le détecteur d'existence — vital pour les formulaires (leçon 12)." },
    { type: "qcm", q: "Utiliser une variable JAMAIS affectée : <code>echo $fantome;</code>", opts: ["Affiche 0", "Warning « Undefined variable » : PHP continue mais signale — un bug en devenir", "Erreur fatale", "Affiche fantome"], a: 1, exp: "PHP est tolérant… trop : lis les warnings comme des erreurs." },
    { type: "qcm", q: "Quel type PHP pour VRAI/FAUX ?", opts: ["boolean64", "bool : true / false", "bit", "vf"], a: 1, exp: "Comme partout : le booléen du jour 3 d'algo." },
    { type: "input", q: "Trace : $a = 8; $b = 3; $c = $a - $b; $a = $c * 2; Que vaut $a ?", a: "10", ph: "nombre", exp: "c = 5, a = 10." },
    { type: "qcm", q: "echo \"J'ai $age ans\" avec $age = 15 ET des apostrophes autour : <code>echo 'J\\'ai 15 ans';</code>. Pourquoi le \\ ?", opts: ["Décoration", "L'apostrophe du texte doit être ÉCHAPPÉE pour ne pas fermer la chaîne", "Erreur", "Pour interpoler"], a: 1, exp: "\\' = apostrophe littérale. Ou plus simple : utiliser des guillemets doubles autour." }
  ],
  final: {
    title: "Exercice final — La fiche membre (version PHP)",
    intro: `<p>La fiche du club, troisième traduction (après le pseudocode et Java !) :</p>
<pre class="pseudo">&lt;?php                            // ouvre la zone de code PHP
$nom = "Martin";                 // une chaîne : le nom du membre
$age = 15;                       // un entier : son âge
$cotisation = 25.50;             // un float : le montant à payer (point décimal)
$aPaye = true;                   // un booléen : a-t-il payé ? oui (true)
const ANNEE = 2026;              // une constante : l'année, utilisée SANS $
$numero = ANNEE * 10 + 4;        // calcul : 2026 × 10 + 4 rangé dans $numero
echo "Membre : $nom, numéro $numero";  // guillemets DOUBLES : $nom et $numero sont interpolés (remplacés)
echo 'Cotisation : $cotisation €';     // apostrophes : $cotisation N'EST PAS interpolé (texte littéral) — le piège !
?&gt;                               // ferme la zone PHP</pre>`,
    questions: [
      { type: "input", q: "Que vaut $numero ?", a: "20264", ph: "nombre", exp: "2026 × 10 + 4 : le calcul du jour 3 d'algo, troisième langue." },
      { type: "qcm", q: "Le premier echo affiche…", opts: ["Membre : $nom, numéro $numero", "Membre : Martin, numéro 20264 — guillemets doubles = interpolation", "Erreur", "Martin 20264 seulement"], a: 1, exp: "Les deux variables sont remplacées." },
      { type: "qcm", q: "Le second echo affiche…", opts: ["Cotisation : 25.5 €", "Cotisation : $cotisation € — apostrophes : AUCUNE interpolation !", "Erreur", "25.50"], a: 1, exp: "Le piège du jour, en situation. Il fallait des guillemets doubles." },
      { type: "qcm", q: "Corrigé avec le point : <code>echo 'Cotisation : ' . $cotisation . ' €';</code> affiche…", opts: ["Cotisation : 25.5 €", "Cotisation : $cotisation €", "Erreur", "25,50"], a: 0, exp: "La concaténation sort les variables des apostrophes : autre solution valide." },
      { type: "qcm", q: "En Java il fallait déclarer int, double, boolean, String. En PHP ?", opts: ["Pareil", "Aucune déclaration : le $ suffit, le type se déduit de la valeur — mais il EXISTE (var_dump le prouve)", "Il faut var", "PHP n'a pas de types"], a: 1, exp: "Dynamique ≠ sans types : les types sont là, juste implicites." }
    ],
    solution: `<pre class="pseudo">$numero = 2026 * 10 + 4 → 20264               // le calcul donne 20264
echo "..."  → Membre : Martin, numéro 20264   // guillemets doubles : variables interpolées
echo '...'  → Cotisation : $cotisation €      // apostrophes : texte littéral, aucune interpolation !
Correctif   → guillemets doubles, ou concaténation avec le point .   // deux solutions valides

Table de traduction enrichie :                // récap des équivalences pseudocode → PHP
ENTIER/REEL/BOOLEEN/CHAINE → $variable (type déduit)   // pas de type à écrire, le $ suffit
&amp; (concaténation)          → .                        // le point colle les chaînes
Écrire                      → echo                     // echo affiche dans la page</pre>
<p>Même fiche, troisième syntaxe : ta table de traduction mentale se consolide. Demain, les opérateurs — et le fameux == contre ===.</p>`
  }
};
