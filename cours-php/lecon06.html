  theory: `
<h3>1. while et do-while : du déjà-vu</h3>
<p>Une <strong>boucle</strong> répète un bloc d'instructions plusieurs fois sans le recopier. <code>while</code> (« tant que ») répète tant que sa condition reste vraie.</p>
<pre class="pseudo">$i = 1;                         // initialisation du compteur AVANT la boucle
while ($i &lt;= 5) {              // TANT QUE $i <= 5, on refait un tour
    echo $i;                    // affiche la valeur courante de $i
    $i++;                       // PROGRESSION : ajoute 1 à $i ; sans elle, boucle infinie !
}                               // fin du while : on remonte tester la condition
do {                            // RÉPÉTER : le corps s'exécute AU MOINS une fois…
    $note = /* ... */;          // on lit une note (par exemple depuis un formulaire)
} while ($note &lt; 0 || $note &gt; 20);  // …puis on teste : on recommence tant que la note est invalide</pre>

<h3>2. for : le compteur intégré</h3>
<p>La boucle <code>for</code> réunit sur une ligne trois éléments : l'initialisation, la condition, et la progression du compteur.</p>
<pre class="pseudo">for ($i = 1; $i &lt;= 10; $i++) {       // POUR i DE 1 À 10 : (init ; condition ; progression)
    echo $i;                         // affiche $i à chaque tour (1, 2, … 10)
}                                    // fin de la boucle
for ($i = 10; $i &gt;= 1; $i--) { }     // compte à REBOURS : $i-- décroît de 10 à 1
for ($i = 0; $i &lt;= 100; $i += 5) { } // PAS de 5 : $i += 5 → 0, 5, 10 … 100</pre>

<h3>3. foreach : LA boucle PHP</h3>
<p>PHP vit entouré de tableaux (résultats de base de données, formulaires…). Un <strong>tableau</strong> est une liste de valeurs. <code>foreach</code> les parcourt sans gérer d'indice :</p>
<pre class="pseudo">$notes = [12, 8, 15];                    // un tableau de 3 notes
foreach ($notes as $note) {              // POUR CHAQUE valeur du tableau, appelée $note
    echo $note;                          // $note prend 12, puis 8, puis 15
}                                        // fin de la boucle
foreach ($notes as $i =&gt; $note) {        // indice ($i) ET valeur ($note) à chaque tour
    echo "Case $i : $note";              // ex. « Case 0 : 12 »
}                                        // fin de la boucle</pre>
<div class="tip">La forme <code>$tableau as $cle =&gt; $valeur</code> donne position et contenu d'un coup — le « for indice + accès » condensé en une ligne. C'est la boucle que tu écriras le plus souvent en PHP.</div>

<h3>4. break et continue</h3>
<pre class="pseudo">foreach ($produits as $p) {              // pour chaque produit $p
    if ($p === "stop") { break; }        // break : SORT complètement de la boucle
    if ($p === "") { continue; }         // continue : ABANDONNE ce tour, passe au suivant (ignore les vides)
    echo $p;                             // atteint seulement pour un $p non vide et différent de "stop"
}                                        // fin de la boucle</pre>

<h3>5. Les motifs classiques (accumulateur, compteur)</h3>
<pre class="pseudo">// ACCUMULATEUR : additionner une série
$total = 0;                              // on part de 0
foreach ($prix as $p) { $total += $p; }  // on ajoute chaque prix au total courant
// COMPTEUR CONDITIONNEL : compter selon une condition
$nb = 0;                                 // le compteur démarre à 0
foreach ($notes as $n) { if ($n &gt;= 10) { $nb++; } }  // +1 pour chaque note >= 10</pre>

<h3>6. Boucles et HTML : générer des listes</h3>
<pre class="pseudo">&lt;ul&gt;                                     // ouvre une liste HTML à puces
&lt;?php foreach ($produits as $p): ?&gt;      // la boucle s'ouvre en PHP (syntaxe alternative avec : )
    &lt;li&gt;&lt;?php echo $p; ?&gt;&lt;/li&gt;           // …et fabrique un &lt;li&gt; (élément de liste) par produit
&lt;?php endforeach; ?&gt;                     // endforeach; ferme la boucle (remplace l'accolade })
&lt;/ul&gt;                                    // ferme la liste HTML</pre>
<p>La syntaxe alternative (<code>: … endforeach;</code>) tisse la boucle dans le HTML : chaque produit devient un <code>&lt;li&gt;</code>. C'est LE geste fondamental des pages dynamiques : une boucle qui FABRIQUE du HTML à partir de données.</p>`,

    { type: "qcm", q: "Générer un <code>&lt;li&gt;</code> par produit d'un tableau :", opts: ["Impossible", "foreach qui echo un <li>…</li> à chaque tour : la boucle FABRIQUE le HTML", "Un <li> suffit", "Du CSS"], a: 1, exp: "Le geste central du web dynamique : données → boucle → balises." },
    { type: "qcm", q: "Dans le HTML mêlé, la boucle se ferme par…", opts: ["}", "endforeach; (syntaxe alternative, comme endif hier)", "break", "end"], a: 1, exp: "Nos FINPOUR du pseudocode ressuscitent dans les templates PHP !" },
    { type: "input", q: "$s = \"\"; for ($i = 3; $i >= 1; $i--) { $s .= $i; } Que vaut $s ?", a: "321", ph: "nombre", exp: "Compte à rebours + accumulateur de chaîne (.=) : \"321\"." },
    { type: "qcm", q: "« Redemander le mot de passe jusqu'à ce qu'il soit correct » :", opts: ["for", "do { … } while ($mdp !== $secret);", "foreach", "match"], a: 1, exp: "Au moins un essai + condition d'arrêt inversée : le guide du jour 11." },
    { type: "qcm", q: "« Afficher chaque ligne d'un panier de taille inconnue » :", opts: ["for ($i=1; $i<=100…)", "foreach ($panier as $article) : la taille n'importe même pas", "while (true)", "do-while"], a: 1, exp: "foreach s'adapte : vide → zéro tour, 1000 articles → 1000 tours." },
    { type: "input", q: "Combien de fois « X » ? <code>foreach ([1,2,3] as $a) { foreach ([1,2] as $b) { echo \"X\"; } }</code>", a: "6", ph: "nombre", exp: "3 × 2 : les boucles imbriquées du jour 13 fonctionnent aussi en foreach." }
  ],
  final: {
    title: "Exercice final — La page catalogue",
    intro: `<p>La boutique génère sa page produits :</p>
<pre class="pseudo">$produits = ["Clavier" => 45, "Souris" => 20, "Écran" => 180];  // tableau associatif : nom => prix
$total = 0;                              // accumulateur du prix total (démarre à 0)
$nbChers = 0;                            // compteur de produits chers (démarre à 0)
echo "&lt;ul&gt;";                             // ouvre la liste HTML
foreach ($produits as $nom => $prix) {   // pour chaque paire clé/valeur : $nom = clé, $prix = valeur
    echo "&lt;li&gt;$nom : $prix €&lt;/li&gt;";      // fabrique un &lt;li&gt; par produit (variables interpolées)
    $total += $prix;                     // ajoute ce prix au total
    if ($prix >= 50) { $nbChers++; }     // si le produit coûte 50 € ou plus : +1 au compteur
}                                        // fin de la boucle
echo "&lt;/ul&gt;";                            // ferme la liste HTML
echo "Total : $total € — $nbChers produit(s) à 50 € ou plus";  // affiche le bilan</pre>`,
    questions: [
      { type: "qcm", q: "Dans ce foreach, $nom et $prix reçoivent…", opts: ["Deux prix", "La CLÉ (\"Clavier\"…) et la VALEUR (45…) de chaque paire", "Le même contenu", "Des indices 0,1,2"], a: 1, exp: "Le tableau associatif (aperçu de la leçon 8 !) se déplie clé => valeur." },

      { type: "qcm", q: "Ce programme combine…", opts: ["foreach clé=>valeur + accumulateur + compteur conditionnel + génération HTML", "Que du HTML", "Des fonctions", "Du CSS"], a: 0, exp: "Jours 12 et 15 d'algo + la magie du web : ton premier vrai composant de page dynamique." }
    ],
