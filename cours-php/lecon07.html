<script>
var DAY = {
  num: 7,
  title: "Tableaux indexés",
  subtitle: "Les jours 14-15 d'algorithmique avec les tableaux les plus souples du marché.",
  theory: `
<h3>1. Créer un tableau</h3>
<p>Un <strong>tableau indexé</strong> est une liste de valeurs rangées les unes à la suite des autres, chacune repérée par un numéro de position appelé <strong>indice</strong>. En PHP, on compte à partir de 0 : la première case porte l'indice 0.</p>
<pre class="pseudo">$notes = [12, 8, 15, 10, 14];        // syntaxe moderne : les valeurs entre crochets [ ]
$vide = [];                           // un tableau vide (aucune valeur pour l'instant)
$notes[0]  → 12                       // accès par indice avec les crochets : la case 0 contient 12
$notes[4]  → 14                       // 5 valeurs → indices 0 à 4 ; la case 4 contient 14
count($notes) → 5                     // count() = le nombre d'éléments (le « length » de PHP)</pre>

<h3>2. Un tableau qui GRANDIT tout seul</h3>
<pre class="pseudo">$panier = [];               // on part d'un tableau vide
$panier[] = "pomme";        // crochets VIDES = ajout en FIN → [pomme]
$panier[] = "poire";        // encore un ajout en fin → [pomme, poire]
$panier[0] = "kiwi";        // un indice précis = remplacement de la case 0 → [kiwi, poire]</pre>
<div class="tip">Le tableau PHP cumule le tableau ET l'ArrayList de Java : accès par indice ET taille variable. <code>$t[] = valeur</code> est ton <code>add()</code>.</div>

<h3>3. La boîte à outils native</h3>
<pre class="pseudo">count($t)              → taille                                     // nombre d'éléments du tableau
array_sum($t)          → somme (l'accumulateur, offert !)           // additionne toutes les valeurs
max($t) · min($t)      → extrêmes (offerts !)                        // plus grande / plus petite valeur
in_array(15, $t)       → true/false (la recherche, offerte !)        // la valeur 15 est-elle présente ?
array_search(15, $t)   → l'indice, ou false (⚠ piège strpos : ===)   // position de la valeur, false si absente
sort($t)               → trie SUR PLACE, croissant (offert !)        // modifie $t directement (ordre croissant)
rsort($t)              → trie décroissant                            // comme sort, mais du plus grand au plus petit
array_push($t, $x)     → ajoute en fin (comme $t[] = $x)             // empile une valeur à la fin
array_pop($t)          → retire et renvoie le DERNIER (une PILE)     // LIFO : dernier arrivé, premier sorti
array_shift($t)        → retire et renvoie le PREMIER (une FILE)     // FIFO : premier arrivé, premier sorti
array_reverse($t)      → renvoie une COPIE inversée                  // ne modifie pas $t, renvoie une nouvelle liste
array_slice($t, 1, 2)  → sous-tableau (à partir de l'indice 1, 2 éléments)   // découpe un morceau
implode(", ", $t)      → recolle le tableau en une chaîne            // liste → texte séparé par ", "</pre>

<h3>4. Fonctions natives OU boucle manuelle ?</h3>
<pre class="pseudo">// array_sum($notes) fait la même chose que :
$somme = 0;                              // accumulateur à 0
foreach ($notes as $n) { $somme += $n; } // on additionne chaque valeur au fur et à mesure</pre>
<p>Les fonctions natives sont plus courtes et optimisées. Mais tu DOIS savoir écrire la version boucle : les examens la demandent, et surtout les cas non standards (« somme des notes paires seulement ») n'ont pas de native toute faite.</p>

<h3>5. Le parcours de référence (position du maximum)</h3>
<pre class="pseudo">// max maison : quand il faut la POSITION du maximum, max() ne la donne pas !
$posMax = 0;                                       // on suppose le max en case 0
for ($i = 1; $i &lt; count($notes); $i++) {          // on compare à partir de la case 1
    if ($notes[$i] &gt; $notes[$posMax]) { $posMax = $i; }  // nouveau champion → on mémorise sa position
}                                                  // fin de la boucle : $posMax contient l'indice du plus grand</pre>
<div class="warn">Accéder à un indice inexistant (<code>$notes[99]</code>) → Warning « Undefined array key » et valeur <code>null</code>. Moins brutal que l'exception Java, mais tout aussi bogué : vérifie avec <code>isset($notes[99])</code> ou <code>count()</code>.</div>`,
  exercises: [
    { type: "qcm", q: "Créer le tableau 5, 2, 8 :", opts: ["$t = array{5,2,8}", "$t = [5, 2, 8];", "int[] t = {5,2,8};", "$t = (5,2,8);"], a: 1, exp: "Crochets : la syntaxe moderne." },
    { type: "input", q: "$t = [7, 3, 9, 1]; echo $t[2]; affiche… ?", a: "9", ph: "nombre", exp: "0-indexé comme Java : t[2] = 3ᵉ élément." },
    { type: "qcm", q: "La taille d'un tableau PHP :", opts: ["$t.length", "count($t)", "$t.size()", "strlen($t), comme pour les chaînes"], a: 1, exp: "count : LE compteur de cases." },
    { type: "qcm", q: "Ajouter \"kiwi\" en fin de $panier :", opts: ["$panier.add(\"kiwi\")", "$panier[] = \"kiwi\";", "$panier + \"kiwi\"", "push($panier, \"kiwi\")"], a: 1, exp: "Les crochets vides : l'add() de PHP." },
    { type: "input", q: "Que vaut <code>array_sum([12, 8, 15])</code> ?", a: "35", ph: "nombre", exp: "L'accumulateur du jour 12, en une fonction." },
    { type: "input", q: "Que vaut <code>max([3, 11, 7])</code> ?", a: "11", ph: "nombre", exp: "Le champion du jour 17, natif." },
    { type: "qcm", q: "<code>in_array(15, $t)</code> correspond à quel algorithme ?", opts: ["Le tri à bulles", "La recherche séquentielle avec drapeau (jour 16)", "La recherche dichotomique", "La recherche du maximum"], a: 1, exp: "Présent/absent : true/false." },
    { type: "qcm", q: "<code>array_search(0, [0, 5, 9])</code> retourne 0 (l'indice). Quel test d'échec correct ensuite ?", opts: ["== false", "=== false : sinon l'indice 0 passe pour un échec (le piège strpos, bis !)", "!= 0", "> 0"], a: 1, exp: "Position 0 vs false : SEUL === les distingue. Troisième rappel — c'est dire son importance." },
    { type: "qcm", q: "<code>sort($t)</code>…", opts: ["Retourne un tableau trié", "Trie $t SUR PLACE (comme notre triBulles Java) et retourne true", "Crée une copie triée sans modifier $t", "Trie $t du plus grand au plus petit"], a: 1, exp: "Le tableau original est modifié : pas de réaffectation nécessaire." },
    { type: "qcm", q: "<code>array_pop($t)</code> retire le dernier élément. Quelle structure du jour 29 ?", opts: ["La file (premier arrivé, premier sorti)", "La PILE : dernier arrivé, premier sorti (avec $t[] = x pour empiler)", "L'arbre binaire de recherche", "La liste doublement chaînée"], a: 1, exp: "push/pop en fin = LIFO. array_shift en tête = FIFO : PHP livre pile ET file." },
    { type: "input", q: "$t = [4, 9, 2]; sort($t); echo $t[0]; affiche… ?", a: "2", ph: "nombre", exp: "Trié : [2, 4, 9], première case 2." },
    { type: "qcm", q: "Pourquoi savoir écrire le max en boucle alors que max() existe ?", opts: ["Parce que max() est plus lent qu'une boucle manuelle", "max() ne donne pas la POSITION, et les variantes (max des pairs…) n'ont pas de native : la boucle reste ton couteau suisse", "max() ne fonctionne pas sur les tableaux associatifs", "max() est dépréciée depuis PHP 8"], a: 1, exp: "Natives pour le standard, boucle pour le sur-mesure." },
    { type: "input", q: "$t = [5, 2, 8, 3]; combien de valeurs > 4 (boucle + compteur) ?", a: "2", ph: "nombre", exp: "5 et 8 : le motif compteur, indéboulonnable." },
    { type: "qcm", q: "echo $t[99] sur un tableau de 3 cases :", opts: ["Exception fatale comme Java", "Warning « Undefined array key 99 » + null : plus doux mais tout aussi bogué", "La valeur 0 par défaut, sans avertissement", "La dernière valeur du tableau (bouclage automatique)"], a: 1, exp: "isset($t[99]) pour tester avant : le réflexe anti-débordement PHP." },
    { type: "input", q: "Que vaut <code>implode(\"-\", [\"a\", \"b\", \"c\"])</code> ?", a: ["a-b-c"], ph: "texte", exp: "Le recolleur : tableau → chaîne." }
  ],
  final: {
    title: "Exercice final — L'audit de la boutique (version PHP)",
    intro: `<p>QUATRIÈME version de l'audit (jour 15, leçon 7 Java…) — compare les styles :</p>
<pre class="pseudo">$ventes = [120, 80, 150, 60, 90, 100];            // tableau des ventes (indices 0 à 5)
// Style natif :
$total = array_sum($ventes);                      // (1) somme de toutes les ventes, en une fonction
$meilleure = max($ventes);                        // (2) la plus grande vente
// Style boucle (pas de native pour ces cas !) :
$nbBons = 0;                                      // compteur de ventes >= 100 (démarre à 0)
$baisses = 0;                                     // compteur de baisses par rapport à la veille (démarre à 0)
for ($i = 0; $i < count($ventes); $i++) {         // parcourt chaque indice de 0 à count-1
    if ($ventes[$i] >= 100) { $nbBons++; }        // (3) vente >= 100 → +1 bon jour
    if ($i > 0 && $ventes[$i] < $ventes[$i-1]) { $baisses++; }   // (4) $i>0 évite de sortir du tableau ; si la vente baisse, +1
}                                                 // fin de la boucle
$moyenne = $total / count($ventes);               // (5) moyenne : total divisé par le nombre de ventes</pre>`,
    questions: [
      { type: "input", q: "(1) Que vaut $total ?", a: "600", ph: "nombre", exp: "array_sum : une ligne au lieu de quatre." },
      { type: "input", q: "(2) Que vaut $meilleure ?", a: "150", ph: "nombre", exp: "max() natif." },
      { type: "input", q: "(3) Que vaut $nbBons ?", a: "3", ph: "nombre", exp: "120, 150, 100 : pas de native pour « compter sous condition » → boucle." },
      { type: "input", q: "(4) Que vaut $baisses ?", a: "2", ph: "nombre", exp: "80<120 et 60<150. Le garde-fou $i > 0 remplace le départ à 1 : anti-débordement." },
      { type: "qcm", q: "(5) $moyenne vaut 100. En Java il fallait un cast (double). En PHP ?", opts: ["(float) obligatoire", "Rien : la division PHP est réelle par nature — un piège de moins", "intdiv() pour forcer un résultat entier", "round() est indispensable pour la moyenne"], a: 1, exp: "600/6 = 100 direct. Chaque langage a ses pièges… et ses cadeaux." }
    ],
    solution: `<pre class="pseudo">Natif  : array_sum → 600 · max → 150           // les fonctions toutes faites
Boucle : nbBons 3 (>= 100) · baisses 2 (comparaison voisins)   // les cas sur-mesure
Moyenne : 600 / 6 = 100 (division réelle native)   // pas de cast nécessaire en PHP

Règle de partage :                             // quand utiliser quoi
standard (somme, max, tri, recherche) → fonction native   // cas classiques
sur-mesure (condition, voisins, position) → TA boucle     // cas particuliers</pre>
<p>Quatrième traduction du même audit : le pseudocode du jour 15 est devenu ta langue maternelle, les langages de simples accents. Demain : les tableaux ASSOCIATIFS, la spécialité PHP.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code PHP ici…",
  items: [
  { id: "php-courses", title: "Le ticket de courses", level: 2,
    statement: "À partir de <code>$prix = [2.50, 1.20, 3.80, 0.99];</code> affiche chaque prix sur une ligne, puis le <strong>total</strong> et le <strong>prix moyen</strong> arrondi à 2 décimales.",
    hints: [
      "foreach ($prix as $p) parcourt le tableau sans se soucier des indices.",
      "Accumule : $total = 0; avant la boucle, $total += $p; dedans.",
      "count($prix) donne le nombre d'éléments, round($x, 2) arrondit. (array_sum($prix) existe aussi !)"
    ],
    solution: "<?php                                        // ouvre la zone PHP\n$prix = [2.50, 1.20, 3.80, 0.99];            // tableau indexé : indices automatiques 0,1,2,3\n\n$total = 0;                                  // accumulateur : démarre à zéro\nforeach ($prix as $p) {                      // $p reçoit chaque valeur du tableau, une par tour\n    echo \"Article : $p €<br>\";               // affiche la valeur courante (<br> = saut de ligne HTML)\n    $total += $p;                            // ajoute la valeur au total\n}                                            // fin du parcours\n\n$moyenne = round($total / count($prix), 2);  // count = nombre d'éléments ; round(…, 2) = 2 décimales\necho \"Total : $total €<br>\";                 // affiche le total\necho \"Prix moyen : $moyenne €\";              // affiche la moyenne arrondie\n?>",
    atoi: { cmd: "php script.php", expected: "Article : 2.5 €<br>Article : 1.2 €<br>Article : 3.8 €<br>Article : 0.99 €<br>Total : 8.49 €<br>Prix moyen : 2.12 €" },
    checklist: ["$total est initialisé à 0 AVANT le foreach, jamais dans la boucle.", "round($total / count($prix), 2) : division par count($prix) et bien 2 décimales.", "Chaque prix est suivi de <br> pour obtenir un article par ligne.", "Un float comme 2.50 s'affiche « 2.5 » : PHP retire le zéro final."],
    note: "Version experte : $total = array_sum($prix); — PHP a une fonction native pour presque tout." }
  ]
};
