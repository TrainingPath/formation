<script>
var DAY = {
  num: 8,
  title: "Tableaux associatifs",
  subtitle: "Des clés textuelles : la HashMap intégrée au langage.",
  theory: `
<h3>1. Des clés qui parlent</h3>
<p>Jusqu'ici, chaque case d'un tableau était repérée par un numéro (0, 1, 2…). Un <strong>tableau associatif</strong> permet d'utiliser à la place une <strong>clé</strong> TEXTUELLE, comme un mot-étiquette. Pense à un dictionnaire : à chaque mot (la clé) correspond une définition (la valeur). C'est un tableau indexé et une HashMap (Java leçon 18) fusionnés en une seule structure. La flèche <code>=&gt;</code> associe une clé à sa valeur.</p>
<pre class="pseudo">$membre = [                         // ouvre le tableau associatif $membre
    "nom" => "Martin",              // clé "nom" → valeur "Martin"
    "age" => 15,                    // clé "age" → valeur 15
    "cotisation" => 25.50,          // clé "cotisation" → valeur 25.50
    "aPaye" => true                 // clé "aPaye" → valeur true
];                                  // ferme le tableau
$membre["nom"]          → "Martin"           // accès par la clé (au lieu d'un indice numérique)
$membre["age"] = 16;    // modification de la valeur associée à la clé "age"
$membre["email"] = "m@mail.be";   // AJOUT d'une nouvelle paire clé→valeur à la volée</pre>

<h3>2. Parcourir : le foreach clé => valeur</h3>
<pre class="pseudo">foreach ($membre as $cle => $valeur) {   // à chaque tour : la clé dans $cle, la valeur dans $valeur
    echo "$cle : $valeur&lt;br&gt;";           // ex. « nom : Martin » suivi d'un saut de ligne HTML
}                                        // fin du parcours
// affiche : nom : Martin / age : 16 / ...</pre>

<h3>3. La boîte à outils associative</h3>
<pre class="pseudo">array_keys($membre)         → ["nom", "age", ...]        // la liste des CLÉS
array_values($membre)       → ["Martin", 16, ...]        // la liste des VALEURS
array_key_exists("age", $membre) → true                  // la clé "age" existe-t-elle ?
isset($membre["age"])       → true                        // existe ET non null (false si la valeur est null !)
$membre["tel"] ?? "inconnu" → valeur par défaut           // le ?? de la leçon 5 : le getOrDefault de PHP
unset($membre["email"]);    → supprime la paire "email"   // retire complètement la clé et sa valeur
ksort($t) / asort($t)       → tri par clés / par valeurs (les associations sont conservées)</pre>

<h3>4. Le motif compteur d'occurrences</h3>
<pre class="pseudo">$votes = ["A", "B", "A", "A", "C"];          // les votes bruts à compter
$compte = [];                                // tableau associatif vide : valeur → nombre d'apparitions
foreach ($votes as $v) {                     // pour chaque vote $v
    $compte[$v] = ($compte[$v] ?? 0) + 1;    // lit le compte actuel (0 si nouveau grâce à ??) et ajoute 1
}                                            // fin du parcours
// résultat : ["A" => 3, "B" => 1, "C" => 1]</pre>
<p>Le <code>?? 0</code> gère élégamment la première apparition d'une clé : c'est le compteur de la leçon 6, un par clé.</p>

<h3>5. Tableaux de tableaux : les enregistrements</h3>
<p>Un <strong>enregistrement</strong> regroupe plusieurs champs décrivant une même chose (un élève : son nom, sa note…). C'est la structure REINE du web PHP — chaque ligne d'une base de données arrivera sous cette forme :</p>
<pre class="pseudo">$classe = [                                  // un tableau indexé…
    ["nom" => "Ana", "note" => 14],          // …dont chaque case est un tableau associatif (un enregistrement)
    ["nom" => "Bob", "note" => 9],           // 2e enregistrement (indice 1)
    ["nom" => "Zoé", "note" => 16]           // 3e enregistrement (indice 2)
];                                           // fin de la liste
$classe[1]["nom"]     → "Bob"       // $classe[1] = la 2e ligne ; ["nom"] = son champ nom
foreach ($classe as $eleve) {                // $eleve = un enregistrement (un tableau associatif) à chaque tour
    echo $eleve["nom"] . " : " . $eleve["note"];   // accès aux champs par leur clé, collés par le point .
}                                            // fin du parcours</pre>
<div class="tip">Liste d'enregistrements = tableau indexé DE tableaux associatifs. L'indice dit QUELLE ligne ; la clé dit QUEL champ. C'est un tableau à deux dimensions, mais avec des colonnes nommées — bien plus lisible.</div>`,
  exercises: [
    { type: "qcm", q: "Un tableau associatif utilise…", opts: ["Des indices 0,1,2 uniquement", "Des CLÉS choisies (souvent textuelles) : \"nom\" => \"Martin\"", "Des booléens", "Des fichiers"], a: 1, exp: "La flèche => associe clé et valeur." },
    { type: "input", q: "$m = [\"nom\" => \"Ana\", \"age\" => 20]; echo $m[\"age\"]; affiche… ?", a: "20", ph: "nombre", exp: "L'accès par clé : direct, lisible." },
    { type: "qcm", q: "$m[\"ville\"] = \"Liège\"; sur un tableau sans clé \"ville\" :", opts: ["Erreur", "AJOUTE la paire à la volée : le tableau PHP grandit librement", "Écrase \"nom\"", "Rien"], a: 1, exp: "Pas de put/get : les crochets font tout." },
    { type: "qcm", q: "À quelle structure Java correspond le tableau associatif ?", opts: ["int[]", "La HashMap (leçon 18 Java) — mais intégrée au langage, sans import", "ArrayList", "String"], a: 1, exp: "Même concept clé→valeur, ergonomie maximale." },
    { type: "qcm", q: "Parcourir clés ET valeurs :", opts: ["for avec count", "foreach ($t as $cle => $valeur)", "while (key())", "array_keys seul"], a: 1, exp: "LE foreach associatif, déjà croisé leçon 6." },
    { type: "qcm", q: "Tester l'existence de la clé \"age\" :", opts: ["$t[\"age\"] == true", "isset($t[\"age\"]) ou array_key_exists(\"age\", $t)", "count($t) > 0", "in_array(\"age\")"], a: 1, exp: "Nuance : isset dit false si la valeur est null ; array_key_exists regarde la clé seule." },
    { type: "qcm", q: "<code>$t[\"tel\"] ?? \"inconnu\"</code> :", opts: ["Erreur si tel absent", "La valeur si la clé existe, sinon \"inconnu\" : le getOrDefault de PHP", "Toujours inconnu", "Supprime tel"], a: 1, exp: "Le null coalescing, parfait pour les données optionnelles." },
    { type: "qcm", q: "Supprimer la paire \"email\" :", opts: ["$t[\"email\"] = \"\";", "unset($t[\"email\"]);", "delete $t[\"email\"];", "remove()"], a: 1, exp: "unset retire la clé ; la vider (\"\") la laisserait exister." },
    { type: "input", q: "Compteur : $votes = [\"oui\",\"non\",\"oui\",\"oui\"]; après la boucle du §4, que vaut $compte[\"oui\"] ?", a: "3", ph: "nombre", exp: "Un compteur PAR clé, créé à la volée grâce au ?? 0." },
    { type: "qcm", q: "Dans <code>($compte[$v] ?? 0) + 1</code>, le ?? 0 gère…", opts: ["Les doublons", "La PREMIÈRE occurrence : la clé n'existe pas encore, on part de 0 au lieu d'un warning", "Le tri", "La casse"], a: 1, exp: "Exactement le getOrDefault du compteur Java (leçon 18)." },
    { type: "input", q: "$classe (du §5) : que vaut $classe[2][\"note\"] ?", a: "16", ph: "nombre", exp: "Ligne 2 (Zoé), champ note : la double adresse ligne+champ." },
    { type: "qcm", q: "La liste d'enregistrements ($classe) correspond à quoi dans le monde réel ?", opts: ["Un fichier CSS", "Le format des résultats de base de données : une ligne = un tableau associatif (leçon 18 PHP !)", "Une image", "Un cookie"], a: 1, exp: "Apprends-la à fond : PDO te la servira à chaque requête." },
    { type: "input", q: "Moyenne de la classe : somme des notes (14+9+16) / count. Résultat ?", a: "13", ph: "nombre", exp: "39/3 : l'accumulateur sur champ d'enregistrement." },
    { type: "qcm", q: "array_keys($membre) retourne…", opts: ["Les valeurs", "Le tableau des CLÉS : [\"nom\", \"age\", …]", "true", "La taille"], a: 1, exp: "Et array_values l'inverse : les deux moitiés du tableau." },
    { type: "qcm", q: "Différence entre sort($t) et asort($t) sur un associatif ?", opts: ["Aucune", "sort DÉTRUIT les clés (réindexe 0,1,2…) ; asort trie les valeurs en GARDANT les associations", "asort trie les clés", "sort est plus lent"], a: 1, exp: "Sur un associatif, sort() perd l'information clé : asort/ksort la préservent." }
  ],
  final: {
    title: "Exercice final — Le bulletin de la classe",
    intro: `<p>Le professeur traite sa liste d'enregistrements :</p>
<pre class="pseudo">$classe = [                                  // liste d'enregistrements (tableau de tableaux associatifs)
    ["nom" => "Ana", "note" => 14],          // élève 0
    ["nom" => "Bob", "note" => 9],           // élève 1
    ["nom" => "Zoé", "note" => 16]           // élève 2
];                                           // fin de la liste
$somme = 0;                                  // accumulateur des notes (démarre à 0)
$meilleur = $classe[0];                      // (1) champion provisoire : le 1er élève
foreach ($classe as $eleve) {                // $eleve = un enregistrement à chaque tour
    $somme += $eleve["note"];                // ajoute la note de l'élève à la somme
    if ($eleve["note"] > $meilleur["note"]) {// cet élève dépasse-t-il le champion actuel ?
        $meilleur = $eleve;                  // (2) oui → il devient le nouveau champion (enregistrement entier)
    }                                        // fin du test
}                                            // fin du parcours
$moyenne = $somme / count($classe);          // moyenne : somme divisée par le nombre d'élèves
echo $meilleur["nom"] . " est premier avec " . $meilleur["note"];  // affiche le vainqueur (nom + note)</pre>`,
    questions: [
      { type: "qcm", q: "(1) Le champion provisoire est initialisé à $classe[0]. Quel algorithme du mois d'algo ?", opts: ["Le tri", "Le MAX du jour 17 : premier élément comme champion, jamais 0 arbitraire", "La dichotomie", "Le drapeau"], a: 1, exp: "L'initialisation prudente, appliquée à un enregistrement entier." },
      { type: "qcm", q: "(2) On mémorise $eleve ENTIER, pas juste la note. Avantage ?", opts: ["Aucun", "On garde nom ET note d'un coup : l'enregistrement complet du vainqueur", "C'est plus lent", "Erreur"], a: 1, exp: "Mieux que posMax : la ligne entière suit le champion." },
      { type: "input", q: "Que vaut $moyenne ?", a: "13", ph: "nombre", exp: "39 / 3 = 13." },
      { type: "qcm", q: "Qu'affiche le programme ?", opts: ["Ana est premier avec 14", "Zoé est premier avec 16", "Bob est premier avec 9", "Erreur"], a: 1, exp: "16 détrône 14 au 3ᵉ tour." },
      { type: "qcm", q: "Pour afficher le CLASSEMENT complet (trié par note décroissante), quelle fonction en une ligne ?", opts: ["sort($classe)", "usort($classe, fn($a, $b) => $b[\"note\"] - $a[\"note\"]); — un tri avec comparateur personnalisé", "rsort simple", "ksort"], a: 1, exp: "usort trie des enregistrements selon TA règle : le tri du jour 24, paramétrable. (fn = fonction fléchée, leçon 9 !)" }
    ],
    solution: `<pre class="pseudo">Trace :                                        // on suit l'évolution des variables tour par tour
$eleve      somme   meilleur                    // en-tête du tableau de trace
Ana(14)     14      Ana(14)                      // 1er tour : Ana championne provisoire
Bob(9)      23      Ana(14)                      // 2e tour : 9 < 14, Ana reste championne
Zoé(16)     39      Zoé(16)                      // 3e tour : 16 > 14, Zoé prend la tête
moyenne = 13 · affiche : Zoé est premier avec 16   // 39/3 = 13 ; vainqueur : Zoé

La liste d'enregistrements + foreach + champion :   // le trio à retenir
le trio que tu réutiliseras avec chaque résultat SQL.</pre>
<p>Tableau indexé + associatif + enregistrements : la boîte à données PHP est complète. Demain : les fonctions.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code PHP ici…",
  items: [
  { id: "php-produit", title: "La fiche produit", level: 2,
    statement: "Crée un tableau <strong>associatif</strong> <code>$produit</code> (nom, prix, stock, categorie), affiche la fiche complète avec une boucle, puis ajoute la clé <code>\"promo\"</code> à <code>true</code> et baisse le prix de 20 %.",
    hints: [
      "Tableau associatif : $produit = [\"nom\" => \"Clavier\", \"prix\" => 45.0, …];",

      "Ajouter une clé : $produit[\"promo\"] = true; — modifier : $produit[\"prix\"] *= 0.8;"
    ],
    solution: "<?php                                        // ouvre la zone PHP\n$produit = [                                 // tableau ASSOCIATIF : clé => valeur\n    \"nom\" => \"Clavier\",                      // clé \"nom\", valeur chaîne\n    \"prix\" => 45.0,                          // clé \"prix\", valeur réelle\n    \"stock\" => 12,                           // clé \"stock\", valeur entière\n    \"categorie\" => \"informatique\"            // clé \"categorie\"\n];                                           // fin du tableau\n\nforeach ($produit as $cle => $valeur) {      // récupère la clé ET la valeur à chaque tour\n    echo \"$cle : $valeur<br>\";               // affiche la paire (ex. : prix : 45)\n}                                            // fin du parcours\n\n$produit[\"promo\"] = true;                    // AJOUTE une nouvelle clé au tableau existant\n$produit[\"prix\"] *= 0.8;                     // MODIFIE la valeur : prix × 0,8 = -20 %\n\necho \"Nouveau prix : \" . $produit[\"prix\"] . \" €\"; // le point . concatène les morceaux de texte\n?>",
    note: "Dans une chaîne, $produit[\"prix\"] demande des accolades : \"{$produit['prix']}\" — la concaténation avec . évite le souci." },
  { id: "php-podium", title: "Le podium (tri de tableau)", level: 2,
    statement: "À partir de <code>$scores = [\"Léa\" => 91, \"Max\" => 78, \"Zoé\" => 95, \"Tom\" => 64];</code> affiche le classement du meilleur au moins bon, en <strong>conservant les prénoms</strong>, puis le nom du vainqueur.",
    hints: [
      "sort() détruit les clés ! Pour trier par valeur EN GARDANT les clés : arsort() (décroissant) / asort() (croissant).",
      "Après arsort(), un foreach $prenom => $score affiche le classement dans l'ordre.",
      "Le vainqueur après arsort : array_key_first($scores)."
    ],
    solution: "<?php                                        // ouvre la zone PHP\n$scores = [                                  // tableau associatif : prénom => score\n    \"Léa\" => 91,                             // paire 1\n    \"Max\" => 78,                             // paire 2\n    \"Zoé\" => 95,                             // paire 3\n    \"Tom\" => 64                              // paire 4\n];                                           // fin du tableau\n\narsort($scores);                             // trie par VALEUR décroissante en GARDANT les clés (a = associatif, r = reverse)\n\n$rang = 1;                                   // compteur de position\nforeach ($scores as $prenom => $score) {     // parcourt dans l'ordre du tri\n    echo \"$rang. $prenom — $score points<br>\"; // affiche : 1. Zoé — 95 points, etc.\n    $rang++;                                 // position suivante\n}                                            // fin du classement\n\necho \"Vainqueur : \" . array_key_first($scores); // la 1re clé après le tri = le meilleur\n?>",
    note: "sort() aurait remplacé les prénoms par 0,1,2,3 ! Le choix de la fonction de tri fait partie de la solution." }
  ]
};
