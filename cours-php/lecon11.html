<script>
var DAY = {
  num: 11,
  title: "Traduire ses algorithmes en PHP",
  subtitle: "Recherche, max, tri à bulles, dichotomie : le grand pont, version PHP.",
  theory: `
<p>Un <strong>algorithme</strong> est une suite précise d'étapes pour résoudre un problème (chercher une valeur, trier une liste…). Cette leçon traduit en PHP les grands algorithmes du cours. Les motifs de raisonnement sont identiques ; seule la syntaxe (les <code>$</code>, <code>===</code>…) change.</p>
<h3>1. Recherche séquentielle : parcourir jusqu'à trouver</h3>
<pre class="pseudo">function chercher(array $t, $cible): int {     // reçoit un tableau et une valeur ; renvoie l'indice de $cible, ou -1 si absente
    for ($i = 0; $i &lt; count($t); $i++) {       // on parcourt chaque case, de 0 à la fin
        if ($t[$i] === $cible) {               // === strict : la case $i contient-elle exactement $cible ?
            return $i;                         // trouvé ! on renvoie tout de suite l'indice (et on quitte la fonction)
        }                                      // fin du if
    }                                          // fin de la boucle
    return -1;                                 // rien trouvé après tout le parcours : convention -1 = « absent »
}                                              // fin de la fonction</pre>

<h3>2. Position du maximum</h3>
<pre class="pseudo">function posMax(array $t): int {               // renvoie l'INDICE de la plus grande valeur
    $pos = 0;                                  // on suppose le max en case 0
    for ($i = 1; $i &lt; count($t); $i++) {       // on compare à partir de la case 1
        if ($t[$i] &gt; $t[$pos]) { $pos = $i; }  // nouveau champion → on mémorise sa position
    }                                          // fin de la boucle
    return $pos;                               // on renvoie l'INDICE du plus grand
}                                              // fin de la fonction</pre>

<h3>3. Tri à bulles</h3>
<pre class="pseudo">function triBulles(array $t): array {          // en PHP, on RETOURNE le tableau trié (voir la nuance ci-dessous)
    $n = count($t);                            // $n = nombre d'éléments à trier
    for ($passage = 1; $passage &lt; $n; $passage++) {      // on refait plusieurs passages sur le tableau
        for ($i = 0; $i &lt; $n - $passage; $i++) {          // la zone à trier rétrécit à chaque passage
            if ($t[$i] &gt; $t[$i + 1]) {                    // deux voisins mal ordonnés (le gauche > le droit) ?
                $aux = $t[$i];                  // on les ÉCHANGE via une variable temporaire (leçon 2)
                $t[$i] = $t[$i + 1];            // le droit passe à gauche
                $t[$i + 1] = $aux;              // l'ancien gauche (sauvé dans $aux) passe à droite
                // Bonus PHP : [$t[$i], $t[$i+1]] = [$t[$i+1], $t[$i]];  // échange en une ligne
            }                                   // fin du if
        }                                       // fin de la boucle interne
    }                                           // fin de la boucle externe
    return $t;                                  // renvoie le tableau trié
}                                               // fin de la fonction</pre>
<div class="tip">Nuance PHP : les tableaux passent par COPIE aux fonctions (contrairement à Java, qui passe la référence !). Le tri travaille donc sur sa copie, d'où le <code>return $t</code>. Pour trier l'original : <code>$notes = triBulles($notes);</code> — ou déclarer le paramètre <code>&amp;$t</code> (référence).</div>

<h3>4. Dichotomie (tableau TRIÉ)</h3>
<pre class="pseudo">function dichotomie(array $t, $cible): int {   // recherche RAPIDE dans un tableau déjà trié ; renvoie l'indice ou -1
    $gauche = 0;                                // borne gauche de la zone de recherche
    $droite = count($t) - 1;                    // borne droite (dernier indice)
    while ($gauche &lt;= $droite) {                // tant que la zone de recherche n'est pas vide
        $milieu = intdiv($gauche + $droite, 2); // indice du milieu — intdiv obligatoire (voir avertissement)
        if ($t[$milieu] === $cible) { return $milieu; }         // trouvé au milieu → on renvoie l'indice
        if ($t[$milieu] &lt; $cible) { $gauche = $milieu + 1; }    // cible plus grande → chercher à DROITE
        else { $droite = $milieu - 1; }                         // cible plus petite → chercher à GAUCHE
    }                                           // fin du while
    return -1;                                  // zone épuisée : valeur absente
}                                               // fin de la fonction</pre>
<div class="warn">Le milieu DOIT être entier : <code>($g + $d) / 2</code> donnerait par exemple 5.5 en PHP (division réelle !), et un indice non entier pose problème. <code>intdiv</code> est donc obligatoire ici — le « cadeau » de la division réelle a son revers.</div>

<h3>5. Les natives équivalentes</h3>
<pre class="pseudo">chercher     ⇔ array_search($cible, $t)      // (attention : === false pour tester l'échec !)
max/posMax   ⇔ max($t) / array_search(max($t), $t)   // max() donne la valeur ; array_search retrouve sa position
triBulles    ⇔ sort($t)                       // tri optimisé, sur place
dichotomie   ⇔ (pas de native : ta version fait foi !)   // aucun équivalent tout prêt</pre>
<p>Comme en Java : les fonctions natives pour produire vite, TES versions pour comprendre, déboguer et réussir les examens.</p>`,
  exercises: [
    { type: "input", q: "chercher([8, 3, 15, 6], 15) retourne… ?", a: "2", ph: "nombre", exp: "Indice 2 (0-indexé) : le jour 16 en PHP." },
    { type: "input", q: "chercher([8, 3, 15, 6], 7) retourne… ?", a: "-1", ph: "nombre", exp: "Absent → -1, même convention qu'en Java." },
    { type: "qcm", q: "Pourquoi === dans chercher($t, $cible) plutôt que == ?", opts: ["Style", "chercher(\"0\") dans [0, 5] : avec ==, l'int 0 matcherait la string \"0\" — résultat surprise. === compare types compris", "C'est plus rapide", "Aucune différence"], a: 1, exp: "Le jonglage de la leçon 3 frapperait en silence : strict par défaut." },
    { type: "input", q: "posMax([14, 9, 17, 11]) retourne… ?", a: "2", ph: "nombre", exp: "17 en indice 2 : le champion du jour 17." },
    { type: "qcm", q: "En PHP, passer un tableau à une fonction transmet…", opts: ["Sa référence comme Java", "Une COPIE : les modifications restent locales (d'où le return $t du tri)", "Un pointeur", "Rien"], a: 1, exp: "L'INVERSE de Java ! Chaque langage a sa convention : à vérifier avant de coder." },
    { type: "qcm", q: "Donc pour trier l'original avec triBulles :", opts: ["triBulles($notes); suffit", "$notes = triBulles($notes); — récupérer le résultat", "Impossible", "sort après"], a: 1, exp: "Ou paramètre par référence &$t. Le flux visible est préférable (leçon 9)." },
    { type: "qcm", q: "[$a, $b] = [$b, $a]; réalise…", opts: ["Une erreur", "L'ÉCHANGE sans variable auxiliaire : la destructuration PHP — élégant !", "Une copie", "Un tri"], a: 1, exp: "Le temp du jour 2 devient optionnel en PHP moderne. (Mais comprends le temp d'abord !)" },
    { type: "qcm", q: "Pourquoi <code>intdiv($g + $d, 2)</code> et pas <code>($g + $d) / 2</code> ?", opts: ["Pareil", "La division PHP est RÉELLE : (0+5)/2 = 2.5, indice invalide ! intdiv garantit l'entier", "intdiv est plus joli", "Pour éviter le zéro"], a: 1, exp: "Le cadeau de la leçon 3 (division réelle) devient piège ici : contexte roi." },
    { type: "input", q: "Dichotomie de 31 dans [3, 8, 12, 17, 25, 31, 40] : milieu 1 = intdiv(0+6,2) = 3, t[3] = 17 < 31 → gauche = 4. Milieu 2 = intdiv(4+6,2) = ?", a: "5", ph: "nombre", exp: "t[5] = 31 : trouvé en 2 comparaisons — la trace du jour 23, troisième langage." },
    { type: "qcm", q: "La dichotomie PHP exige toujours…", opts: ["Un tableau associatif", "Un tableau TRIÉ (à indices continus 0..n-1)", "count pair", "PHP 8"], a: 1, exp: "Le prérequis éternel — et gare aux tableaux troués par unset !" },
    { type: "qcm", q: "array_search équivaut à chercher(), mais son échec se teste par…", opts: ["== -1", "=== false (position 0 ≠ false : le piège récurrent !)", "== 0", "isset"], a: 1, exp: "Quatrième rappel du cours — c'est LE piège PHP par excellence." },
    { type: "qcm", q: "sort($t) contre triBulles($t) sur 100 000 éléments :", opts: ["Pareil", "sort (n log n) écrase le tri à bulles (n²) : ~1,7 million d'opérations contre 10 milliards (jour 28)", "Bulles gagne", "Les deux échouent"], a: 1, exp: "L'analyse de complexité guide le choix : native en production." },
    { type: "qcm", q: "Pourquoi écrire triBulles si sort existe ?", opts: ["Pour rien", "Comprendre ce qu'on paie, déboguer, examens, et variantes sans native (tri par note d'enregistrement → usort avec TON comparateur)", "sort est payant", "Tradition"], a: 1, exp: "Le musicien fait ses gammes." },
    { type: "input", q: "posMax renvoie l'indice. Comment obtenir la VALEUR du max avec ? (écris l'expression : $t[...])", a: ["$t[posMax($t)]", "t[posMax(t)]"], ph: "$t[…]", exp: "L'indice sert de clé : $t[posMax($t)]." },
    { type: "qcm", q: "Un tableau PHP « troué » ([0=>5, 2=>9], le 1 supprimé par unset) casse le for de chercher(). Remède ?", opts: ["Rien à faire", "array_values($t) réindexe 0..n-1 avant le parcours", "sort", "count"], a: 1, exp: "Spécificité PHP : les clés survivent aux suppressions — réindexer avant les algos à indices." }
  ],
  final: {
    title: "Exercice final — Le service des inscriptions (version PHP)",
    intro: `<p>Le final Java leçon 11, traduit — compare-les ligne à ligne !</p>
<pre class="pseudo">$nums = [205, 118, 342, 217, 460];            // les numéros d'étudiants (non triés)
$posEtudiant = chercher($nums, 342);          // (1) recherche séquentielle de 342 → son indice
$posGrand = posMax($nums);                    // (2) indice du plus grand numéro
$nums = triBulles($nums);                     // (3) réaffectation ! (tableau passé par copie)
$posApresTri = dichotomie($nums, 342);        // (4) recherche rapide de 342 dans le tableau trié</pre>`,
    questions: [
      { type: "input", q: "(1) Que vaut $posEtudiant ?", a: "2", ph: "nombre", exp: "342 en indice 2 : trois comparaisons séquentielles." },
      { type: "input", q: "(2) Que vaut $posGrand ?", a: "4", ph: "nombre", exp: "460, dernier élément : indice 4." },
      { type: "qcm", q: "(3) Pourquoi la réaffectation $nums = triBulles($nums) est-elle INDISPENSABLE en PHP (pas en Java) ?", opts: ["Style", "PHP passe les tableaux par COPIE : sans réaffectation, $nums resterait désordonné", "Java aussi l'exigeait", "sort le fait"], a: 1, exp: "LA différence Java/PHP du jour : référence contre copie." },
      { type: "input", q: "(4) $nums trié = [118, 205, 217, 342, 460]. Que vaut $posApresTri ? (milieu 2 : 217<342 → g=3 ; milieu 3 : trouvé)", a: "3", ph: "nombre", exp: "Deux comparaisons : le log n du jour 28." },
      { type: "qcm", q: "Bilan des trois traductions (pseudocode → Java → PHP) :", opts: ["Trois algorithmes différents", "MÊMES algorithmes, mêmes traces, mêmes complexités — seuls changent : types, $, passage copie/référence, intdiv", "PHP est incompatible", "Java était inutile"], a: 1, exp: "La preuve est faite : l'algorithmique est LA compétence transférable. Semaine 2 : le web dynamique !" }
    ],
    solution: `<pre class="pseudo">chercher 342   → 2 (séquentiel)                      // trouvé par parcours
posMax         → 4 (460)                             // le plus grand est le dernier
triBulles      → [118, 205, 217, 342, 460] (copie retournée !)   // tri croissant
dichotomie 342 → 3 (2 comparaisons)                  // recherche rapide dans le trié

Différences PHP mémorisées :                         // les 4 pièges/spécificités du jour
· tableaux passés par COPIE → return + réaffectation // sinon l'original ne change pas
· intdiv pour le milieu (division réelle sinon)      // garantir un indice entier
· === dans les comparaisons de recherche             // éviter le jonglage de types
· array_values si le tableau est troué</pre>
<p>Le pont est traversé pour la troisième fois. Dès demain, PHP révèle sa vraie nature : les FORMULAIRES web — là où aucun autre langage du cours ne t'emmènera.</p>`
  }
};
</script>

  { id: "php-factorielle", title: "La factorielle", level: 2,
    statement: "Écris une fonction <code>factorielle($n)</code> qui renvoie <code>$n! = 1 × 2 × … × n</code>, puis affiche les factorielles de 0 à 10.",
    hints: [
      "Accumulateur de produit : $fact = 1; (départ à 1, pas 0).",
      "Dans la fonction : for ($i = 1; $i <= $n; $i++) { $fact *= $i; } puis return $fact;",
      "Pour l'affichage : une boucle de 0 à 10 qui appelle factorielle($i) à chaque tour."
    ],
    solution: "<?php                                        // ouvre la zone PHP\nfunction factorielle($n) {                   // la fonction reçoit $n et renverra $n!\n    $fact = 1;                               // accumulateur de PRODUIT : départ à 1 (pas 0 !)\n    for ($i = 1; $i <= $n; $i++) {           // $i parcourt 1, 2, 3, …, $n\n        $fact *= $i;                         // équivaut à $fact = $fact * $i\n    }                                        // si $n = 0 : zéro tour, $fact reste 1 → 0! = 1 correct\n    return $fact;                            // renvoie le résultat à l'appelant\n}                                            // fin de la fonction\n\nfor ($i = 0; $i <= 10; $i++) {               // les rangs 0 à 10\n    echo \"$i! = \" . factorielle($i) . \"<br>\"; // appelle la fonction et affiche le résultat\n}                                            // fin de l'affichage\n?>",
    note: "Accumulateur de somme → départ 0 ; de produit → départ 1 (jour 12 d'algorithmique)." }
  ]
};
