<script>
var DAY = {
  num: 22,
  title: "Exceptions et gestion d'erreurs",
  subtitle: "Attraper les incidents proprement plutôt que de laisser le site planter.",
  theory: `
<h3>1. Deux familles d'incidents</h3>
<p>Une <strong>erreur</strong> est un problème que PHP signale. On distingue :</p>
<pre class="pseudo">// · l'erreur de PROGRAMMATION (bug) : parenthèse manquante, fonction inconnue
//   → elle se corrige dans le code, pas à l'exécution
// · l'exception (incident PRÉVISIBLE) : fichier absent, âge négatif, base injoignable
//   → elle se GÈRE à l'exécution, sans planter tout le site</pre>
<p>Une <strong>exception</strong> est un OBJET « incident » que le code LANCE quand quelque chose d'anormal mais prévisible arrive. Analogie : le signal d'alarme d'un train — on le tire pour signaler un problème, quelqu'un doit y répondre.</p>

<h3>2. try / catch : tenter puis rattraper</h3>
<p>Le bloc <code>try</code> (« essayer ») entoure le code risqué ; le bloc <code>catch</code> (« attraper ») s'exécute UNIQUEMENT si une exception a été lancée dedans.</p>
<pre class="pseudo">try {                                          // zone surveillée : « j'essaie »
    \$pdo = new PDO("mysql:host=localhost;dbname=ludo", "root", ""); // peut échouer
    echo "Connexion réussie";                   // ne s'exécute que si tout va bien
} catch (PDOException \$e) {                     // « si une PDOException surgit, attrape-la »
    echo "Base injoignable : " . \$e->getMessage(); // \$e = l'objet incident ; getMessage() = le texte
}                                              // le site continue de vivre après</pre>
<p>La variable <code>\$e</code> est l'objet exception attrapé. Ses méthodes utiles : <code>getMessage()</code> (le message), <code>getCode()</code> (un code numérique), <code>getLine()</code>/<code>getFile()</code> (où c'est arrivé).</p>
<div class="tip">Sans try/catch, une exception non attrapée = « Fatal error » et page blanche pour l'utilisateur. Avec, tu contrôles le message et la suite.</div>

<h3>3. Lancer sa propre exception : <code>throw</code></h3>
<p>Le mot-clé <code>throw</code> (« lancer ») déclenche une exception. On l'utilise pour REFUSER une donnée invalide et forcer l'appelant à réagir.</p>
<pre class="pseudo">function definirAge(int \$age): int {           // vérifie un âge
    if (\$age &lt; 0) {                             // un âge négatif est absurde
        throw new InvalidArgumentException("Âge négatif interdit"); // lance l'incident + message
    }                                          // fin du test
    return \$age;                               // sinon, valeur acceptée
}                                              // fin de la fonction</pre>
<p><code>InvalidArgumentException</code> est une exception STANDARD de PHP pour « mauvais argument ». Il en existe d'autres : <code>RuntimeException</code> (problème à l'exécution), <code>LengthException</code>, etc. Toutes héritent de la classe de base <code>Exception</code>.</p>

<h3>4. Attraper plusieurs types, et <code>finally</code></h3>
<pre class="pseudo">try {                                          // zone surveillée
    traiter(\$donnee);                          // peut lancer différents incidents
} catch (InvalidArgumentException \$e) {        // 1er filet : mauvaise donnée
    echo "Donnée refusée : " . \$e->getMessage(); // message spécifique
} catch (RuntimeException \$e) {                // 2e filet : autre problème d'exécution
    echo "Souci technique : " . \$e->getMessage(); // autre message
} finally {                                    // « quoi qu'il arrive » : erreur OU succès
    echo "Traitement terminé.";                 // idéal pour fermer un fichier, libérer une ressource
}                                              // fin de la structure</pre>
<div class="warn">L'ORDRE des catch compte : PHP prend le PREMIER qui correspond. Mets les exceptions les plus PRÉCISES avant les plus GÉNÉRALES (Exception attrape tout, donc en dernier).</div>

<h3>5. Créer sa propre classe d'exception</h3>
<p>Pour un incident métier précis, on crée une exception sur mesure en héritant de <code>Exception</code>. Le nom devient auto-documenté.</p>
<pre class="pseudo">class JeuIntrouvableException extends Exception {}  // une exception métier, nom parlant

function chercherJeu(string \$titre): array {   // cherche un jeu
    \$jeu = trouver(\$titre);                    // renvoie null si absent
    if (\$jeu === null) {                        // pas trouvé ?
        throw new JeuIntrouvableException("Aucun jeu : \$titre"); // incident métier explicite
    }                                          // fin du test
    return \$jeu;                               // sinon on retourne le jeu
}                                              // fin de la fonction</pre>

<h3>6. Ne jamais montrer un message technique à l'utilisateur</h3>
<pre class="pseudo">try {                                          // opération sensible
    \$pdo = new PDO(\$dsn, \$user, \$pass);        // connexion à la base
} catch (PDOException \$e) {                     // en cas d'échec
    error_log(\$e->getMessage());                // JOURNALISE le détail technique (fichier de logs)
    http_response_code(500);                    // code d'erreur serveur
    echo "Service momentanément indisponible.";  // message NEUTRE pour l'utilisateur
}                                              // fin</pre>
<div class="warn">Un message d'erreur brut peut RÉVÉLER des infos sensibles (chemins, requêtes, identifiants). Journalise le détail côté serveur (<code>error_log</code>), affiche un message neutre côté visiteur. Réflexe sécurité.</div>`,
  exercises: [
    { type: "qcm", q: "Une exception représente…", opts: ["Un bug de syntaxe dans le code", "Un incident PRÉVISIBLE (fichier absent, base injoignable) qu'on gère à l'exécution sans planter le site", "Une ligne de commentaire du code", "Une variable spéciale de PHP"], a: 1, exp: "L'exception se gère ; le bug de syntaxe se corrige dans le code." },
    { type: "qcm", q: "Le bloc try contient…", opts: ["Le code de secours de rattrapage", "Le code RISQUÉ qu'on tente d'exécuter", "Les messages d'erreur à afficher", "Rien, il reste toujours vide"], a: 1, exp: "try = « j'essaie » la zone surveillée." },
    { type: "qcm", q: "Le bloc catch s'exécute…", opts: ["À chaque exécution du script", "UNIQUEMENT si une exception a été lancée dans le try", "Juste avant le bloc try", "Jamais, en réalité"], a: 1, exp: "Pas d'incident = catch ignoré." },
    { type: "qcm", q: "Dans <code>catch (PDOException $e)</code>, que contient $e ?", opts: ["Le message texte seulement", "L'OBJET exception, avec getMessage(), getCode(), getLine()…", "Le résultat de la requête SQL", "La valeur booléenne true"], a: 1, exp: "$e est l'objet incident, riche en informations." },
    { type: "qcm", q: "<code>$e->getMessage()</code> renvoie…", opts: ["Le numéro de ligne", "Le TEXTE explicatif de l'exception", "Le nom du fichier", "Le code HTTP"], a: 1, exp: "Le message lisible passé au throw." },
    { type: "qcm", q: "Le mot-clé pour LANCER une exception est…", opts: ["catch", "throw", "try", "raise"], a: 1, exp: "throw new Exception(\"...\") déclenche l'incident." },
    { type: "qcm", q: "Pourquoi <code>throw</code> pour un âge négatif ?", opts: ["Pour faire planter le script", "Pour REFUSER la donnée invalide et forcer l'appelant à réagir plutôt que continuer avec une valeur absurde", "Pour afficher l'âge saisi", "Par simple habitude de code"], a: 1, exp: "throw signale un état anormal que l'appelant doit gérer." },
    { type: "qcm", q: "InvalidArgumentException est…", opts: ["Une fonction native de PHP", "Une exception STANDARD de PHP pour « mauvais argument reçu »", "Un trait réutilisable", "Une variable globale de PHP"], a: 1, exp: "PHP fournit une famille d'exceptions prêtes à l'emploi." },
    { type: "qcm", q: "Dans quel ordre placer plusieurs catch ?", opts: ["L'ordre n'a aucune importance", "Du plus PRÉCIS au plus GÉNÉRAL : PHP prend le premier qui correspond, et Exception attrape tout", "Par ordre alphabétique des noms", "Du plus général au plus précis"], a: 1, exp: "Sinon un catch général capturerait tout avant les précis." },
    { type: "qcm", q: "Le bloc finally s'exécute…", opts: ["Seulement en cas d'erreur", "QUOI QU'IL ARRIVE (succès ou exception) : idéal pour libérer une ressource", "Seulement en cas de succès", "Jamais, il est ignoré"], a: 1, exp: "finally = nettoyage garanti (fermer un fichier, etc.)." },
    { type: "qcm", q: "Créer sa propre exception se fait en…", opts: ["En copiant le code de la classe Exception", "héritant : class JeuIntrouvableException extends Exception {}", "En écrivant un trait dédié", "En créant une interface d'exception"], a: 1, exp: "Un nom métier parlant, hérité de Exception." },
    { type: "qcm", q: "Faut-il afficher <code>$e->getMessage()</code> d'une PDOException à l'utilisateur ?", opts: ["Oui, le message est clair", "NON : le détail technique peut révéler des infos sensibles ; on journalise (error_log) et on affiche un message NEUTRE", "Oui, pour aider l'utilisateur", "Seulement si le site est en HTTPS"], a: 1, exp: "Détail côté serveur, message neutre côté visiteur : réflexe sécurité." },
    { type: "qcm", q: "<code>error_log($e->getMessage())</code> …", opts: ["Affiche le message à l'écran", "Écrit le message dans le JOURNAL du serveur (invisible pour le visiteur), pour le développeur", "Supprime l'erreur définitivement", "Envoie un email à l'administrateur"], a: 1, exp: "Le développeur enquête via les logs, pas via la page." },
    { type: "qcm", q: "Toutes les exceptions PHP héritent de…", opts: ["la classe PDO", "la classe de base Exception (ou Throwable, plus haut encore)", "la classe Array", "le type de base string"], a: 1, exp: "catch (Exception $e) attrape donc toute exception classique." },
    { type: "vf", q: "Une exception NON attrapée provoque une « Fatal error » et interrompt le script.", a: true, exp: "D'où l'intérêt d'entourer le code risqué d'un try/catch." }
  ],
  final: {
    title: "Exercice final — Inscription robuste à la Ludothèque",
    intro: `<p>La fonction d'inscription vérifie l'âge et enregistre en base, en gérant chaque incident :</p>
<pre class="pseudo">class AgeInvalideException extends Exception {}   // (1) exception métier sur mesure

function inscrire(PDO \$pdo, string \$nom, int \$age): int {  // renvoie l'id créé
    if (\$age &lt; 12) {                                       // (2) règle métier : 12 ans mini
        throw new AgeInvalideException("Âge minimum : 12 ans"); // refuse proprement
    }                                                      // fin du test
    \$stmt = \$pdo->prepare("INSERT INTO membres (nom, age) VALUES (?, ?)"); // requête préparée
    \$stmt->execute([\$nom, \$age]);                          // insère en sécurité
    return (int) \$pdo->lastInsertId();                      // id du nouveau membre
}                                                          // fin de la fonction

try {                                                      // (3) zone surveillée
    \$id = inscrire(\$pdo, "Léa", 9);                        // 9 ans → lèvera l'exception
    echo "Inscrit sous l'id \$id";                          // ne s'exécute pas ici
} catch (AgeInvalideException \$e) {                        // (4) filet « âge »
    echo "Refusé : " . \$e->getMessage();                   // message clair et sûr
} catch (PDOException \$e) {                                // filet « base »
    error_log(\$e->getMessage());                            // journalise le détail
    echo "Service indisponible, réessayez.";                // message neutre
}                                                          // fin</pre>`,
    questions: [
      { type: "qcm", q: "(1) Pourquoi créer <code>AgeInvalideException</code> plutôt qu'un simple <code>return false</code> ?", opts: ["Uniquement pour faire propre", "Un incident nommé est explicite, se propage jusqu'à un catch dédié et ne peut pas être ignoré par erreur", "Parce que c'est plus rapide à exécuter", "Parce que return false est interdit"], a: 1, exp: "L'exception force la gestion et documente l'incident." },
      { type: "qcm", q: "(2) Que fait <code>throw new AgeInvalideException(...)</code> avec un âge de 9 ?", opts: ["Continue l'insertion", "Interrompt la fonction et remonte l'incident jusqu'au catch correspondant", "Affiche un warning ignoré", "Insère quand même"], a: 1, exp: "throw stoppe net et cherche un catch en remontant." },
      { type: "qcm", q: "(3) Pourquoi la ligne <code>echo \"Inscrit...\"</code> ne s'affiche PAS ici ?", opts: ["C'est un bug du script", "Parce que inscrire() a lancé une exception avant d'atteindre le return : le flux saute directement au catch", "La fonction echo est cassée", "L'id renvoyé est resté vide"], a: 1, exp: "Dès le throw, le reste du try est abandonné." },
      { type: "qcm", q: "(4) Pourquoi DEUX catch distincts ?", opts: ["Une redondance parfaitement inutile", "Chaque type d'incident (âge invalide vs base injoignable) mérite un message et un traitement différents", "Pour gagner en rapidité d'exécution", "Un seul catch suffirait toujours"], a: 1, exp: "On réagit spécifiquement selon la nature du problème." },
      { type: "qcm", q: "Pourquoi la PDOException affiche un message neutre alors que l'AgeInvalideException affiche son détail ?", opts: ["Sans raison particulière", "Le message métier « Âge minimum » est sûr à montrer ; le détail technique d'une PDOException pourrait révéler des infos sensibles → journalisé, message neutre", "Parce que PDO est plus lent", "Les deux devraient tout afficher pareil"], a: 1, exp: "Détail métier public OK, détail technique privé : réflexe sécurité." }
    ],
    solution: `<pre class="pseudo">// Ajout d'un finally pour un journal systématique :
try {                                                    // zone surveillée
    \$id = inscrire(\$pdo, \$nom, \$age);                     // tente l'inscription
    echo "Bienvenue, inscrit sous l'id \$id";              // succès
} catch (AgeInvalideException \$e) {                      // incident métier
    echo "Refusé : " . \$e->getMessage();                  // message clair (sûr à montrer)
} catch (PDOException \$e) {                              // incident technique
    error_log("BDD: " . \$e->getMessage());                // détail dans le journal serveur
    echo "Service indisponible, réessayez.";              // message neutre pour l'utilisateur
} finally {                                              // exécuté dans TOUS les cas
    error_log("Tentative d'inscription pour \$nom");       // trace systématique
}                                                        // fin

// Les 3 réflexes :
// · throw pour refuser une donnée invalide       // signaler l'anormal
// · catch précis puis catch général              // réagir selon le type
// · message neutre + error_log pour le technique // sécurité + traçabilité</pre>
<p>Ton code ne plante plus : il attrape, réagit et trace. Demain, un outil taillé pour analyser du texte : les expressions régulières.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code PHP ici…",
  items: [
  { id: "php-exceptions", title: "Diviser en sécurité avec une exception", level: 2,
    statement: "Écris une fonction <code>diviser(int $a, int $b): float</code> qui <strong>lance</strong> une <code>InvalidArgumentException</code> si le diviseur est 0, sinon renvoie le quotient. Appelle-la dans un <code>try/catch</code> pour tester une division normale ET une division par zéro, avec un <code>finally</code>.",
    hints: [
      "Dans la fonction : if ($b === 0) { throw new InvalidArgumentException(\"Division par zéro interdite\"); }",
      "Sinon : return $a / $b; (le résultat est un float).",
      "Autour de l'appel : try { echo diviser(10, 0); } catch (InvalidArgumentException $e) { echo $e->getMessage(); } finally { echo \"Fini\"; }"
    ],
    solution: "<?php                                          // ouverture PHP\nfunction diviser(int $a, int $b): float {      // divise $a par $b\n    if ($b === 0) {                             // diviser par zéro est impossible\n        throw new InvalidArgumentException(\"Division par zéro interdite\"); // lance l'incident + message\n    }                                          // fin du test\n    return $a / $b;                             // sinon renvoie le quotient (float)\n}                                              // fin de la fonction\n\ntry {                                          // zone surveillée : « j'essaie »\n    echo diviser(10, 2) . \"\\n\";                // affiche 5 (cas normal)\n    echo diviser(10, 0) . \"\\n\";                // lève l'exception : la suite du try est abandonnée\n    echo \"Cette ligne ne s'affichera pas\\n\";   // jamais atteinte à cause du throw\n} catch (InvalidArgumentException $e) {         // attrape l'incident « mauvais argument »\n    echo \"Erreur : \" . $e->getMessage() . \"\\n\"; // message clair et sûr à montrer\n} finally {                                    // exécuté QUOI QU'IL ARRIVE\n    echo \"Calcul terminé.\\n\";                  // idéal pour clôturer proprement\n}                                              // fin de la structure\n?>",
    note: "throw signale un état impossible, catch le rattrape sans planter le script, finally garantit une clôture propre : le trio de la gestion d'erreurs.",
    atoi: { cmd: "php diviser.php", expected: "5\nErreur : Division par zéro interdite\nCalcul terminé.\n" },
    checklist: [
      "diviser() teste if ($b === 0) puis throw new InvalidArgumentException(\"Division par zéro interdite\").",
      "Le message passé au throw est exactement celui réaffiché par $e->getMessage() dans le catch.",
      "L'appel diviser(10, 0) lève l'exception : la ligne suivante du try n'est jamais exécutée.",
      "Le bloc finally s'exécute dans tous les cas et affiche « Calcul terminé. » à la fin."
    ] }
  ]
};
