  theory: `
<h3>1. PHP, c'est quoi ?</h3>
<p>Un <strong>langage de programmation</strong> est une façon d'écrire des ordres qu'un ordinateur sait exécuter, un peu comme une recette écrite qu'un cuisinier suit à la lettre. <strong>PHP</strong> est l'un de ces langages, spécialisé dans la fabrication de <strong>pages web</strong>. Sa grande particularité : il est <strong>interprété côté serveur</strong>. Décortiquons chacun de ces mots, car ils reviendront tout le cours.</p>
<p>Un <strong>serveur</strong> est un ordinateur allumé en permanence, quelque part, qui attend qu'on lui réclame des pages — imagine la <em>cuisine</em> d'un restaurant. Le <strong>navigateur</strong> (Chrome, Firefox, Edge) est le logiciel du visiteur : c'est le <em>client attablé</em> qui passe commande. Une <strong>requête</strong> est cette commande : « envoie-moi la page panier.php ». Le <strong>HTML</strong> est le langage qui décrit à quoi ressemble une page (titres, paragraphes, boutons) : c'est le <em>plat dressé dans l'assiette</em> que le client reçoit.</p>
<p><strong>Côté serveur</strong> signifie donc que PHP travaille dans la cuisine, hors de la vue du client : quand une requête arrive, le serveur EXÉCUTE ton script PHP et n'envoie au navigateur que le <strong>HTML produit</strong>. Le visiteur ne voit jamais ton code PHP — seulement son résultat, comme il voit le plat mais jamais la recette. WordPress, Wikipédia, Facebook (à ses débuts) : PHP fait tourner une énorme partie du web.</p>
<pre class="pseudo">NAVIGATEUR ── demande page.php ──► SERVEUR (exécute le PHP)     // 1. le visiteur (client) réclame une page : c'est la « requête »
NAVIGATEUR ◄── reçoit du HTML ───── SERVEUR                     // 2. le serveur (cuisine) renvoie SEULEMENT le résultat (du HTML), jamais le code PHP</pre>
<p><strong>Interprété</strong> signifie qu'il n'y a pas d'étape de <em>compilation</em>. Comparons : un langage <em>compilé</em> se traduit une fois pour toutes en un fichier prêt à lancer (comme un livre imprimé à l'avance) ; un langage <em>interprété</em> comme PHP est lu et exécuté à la volée, à chaque requête (comme un interprète qui traduit une phrase en direct, à voix haute). Avantage : on modifie le fichier, on rafraîchit la page, on voit tout de suite le résultat. Inconvénient : les erreurs n'apparaissent qu'au moment de l'exécution. Pour travailler chez toi : installe <strong>XAMPP</strong> ou <strong>WAMP</strong> (un paquet contenant Apache + PHP + MySQL), ou lance <code>php -S localhost:8000</code> dans un terminal (une fenêtre où l'on tape des commandes).</p>

<h3>2. Le premier script, ligne par ligne</h3>
<pre class="pseudo">&lt;?php                              // ouvre une zone de code PHP : à partir d'ici, tout est du code exécuté par le serveur
    echo "Bonjour le monde !";     // echo ENVOIE le texte entre guillemets vers la page ; le ; (point-virgule) termine l'instruction
?&gt;                                 // ferme la zone PHP : on repasse en HTML normal (envoyé tel quel au navigateur)</pre>
<ul>
<li>Le code PHP vit entre la balise d'ouverture <code>&lt;?php</code> et la balise de fermeture <code>?&gt;</code> ; tout le reste du fichier est du HTML envoyé tel quel.</li>
<li><code>echo</code> est le mot-clé qui <strong>affiche</strong> : il envoie vers la page le texte qu'on lui donne. C'est l'équivalent du <code>Écrire(...)</code> du pseudocode.</li>
<li>Les <strong>guillemets</strong> <code>"..."</code> délimitent un <strong>texte</strong> (une « chaîne de caractères ») : PHP affiche exactement ce qu'il y a entre eux.</li>
<li>Chaque instruction se termine par un <strong>point-virgule</strong> <code>;</code>, comme le point à la fin d'une phrase.</li>
<li>Le fichier porte l'extension <code>.php</code> (ex : <code>index.php</code>) et doit être servi par un serveur : pas de compilation, PHP est interprété !</li>
</ul>

<h3>3. Mélanger HTML et PHP</h3>
<pre class="pseudo">&lt;h1&gt;Ma boutique&lt;/h1&gt;                              // du HTML pur (&lt;h1&gt; = un grand titre) : envoyé tel quel au navigateur
&lt;p&gt;Nous sommes le &lt;?php echo date("d/m/Y"); ?&gt;&lt;/p&gt;  // &lt;p&gt; = un paragraphe ; à l'intérieur, une mini-zone PHP calcule la date du jour à CHAQUE visite
&lt;p&gt;Texte HTML normal…&lt;/p&gt;                          // encore du HTML statique (toujours identique)</pre>
<p>C'est LA force de PHP : le HTML statique reste tel quel, et les zones <code>&lt;?php ?&gt;</code> sont recalculées à chaque visite. <code>date("d/m/Y")</code> est une <strong>fonction</strong> (un outil tout prêt) qui retourne la date du jour au format jour/mois/année. Résultat : une page est un document dynamique, dont le squelette est fixe mais dont le contenu est vivant.</p>

<h3>4. Commentaires et affichage</h3>
<p>Un <strong>commentaire</strong> est une note pour les humains que PHP <em>ignore</em> complètement : il n'est jamais exécuté ni envoyé au navigateur.</p>
<pre class="pseudo">// ceci est un commentaire d'une ligne : PHP ignore tout ce qui suit les deux barres //
# ceci aussi est un commentaire d'une ligne : le dièse # est un second style, équivalent à //
/* ceci est un commentaire
   qui s'étend sur plusieurs lignes, entre /* et */
echo "Un", " ", "seul", " echo peut tout coller";  // echo accepte plusieurs morceaux séparés par des virgules : il les affiche à la suite
print "Cousin de echo";                            // print fait presque la même chose qu'echo (il affiche un texte)</pre>
<div class="warn">N'utilise PAS le commentaire HTML <code>&lt;!-- --&gt;</code> pour du PHP : il serait ENVOYÉ au navigateur et resterait visible dans le code source de la page. Les commentaires <code>//</code>, <code>#</code>, <code>/* */</code> restent, eux, sur le serveur.</div>

<h3>5. La table de traduction (à compléter tout le cours)</h3>
<pre class="pseudo">PSEUDOCODE            PHP                        // ligne d'en-tête : à gauche le pseudocode, à droite l'équivalent PHP
Écrire(x)             echo x;              // afficher une valeur dans la page
commentaire //        // ou #             // deux styles de commentaire d'une ligne
DEBUT...FIN           &lt;?php ... ?&gt;         // le code PHP s'écrit entre ces balises</pre>
<div class="warn">Erreur classique n°1 : oublier le point-virgule → « Parse error: syntax error » avec un numéro de ligne. Erreur n°2 : ouvrir le fichier SANS serveur (file://) → le navigateur affiche le code au lieu de l'exécuter !</div>
<div class="tip">PHP est interprété : pas de <code>javac</code>, on rafraîchit la page et le nouveau code s'exécute. Rapide pour apprendre — mais les erreurs n'apparaissent qu'à l'exécution : teste tout, tout le temps.</div>`,

    { type: "qcm", q: "PHP est un langage…", opts: ["Compilé comme Java", "INTERPRÉTÉ : le serveur lit et exécute le script à chaque requête", "Graphique", "Binaire"], a: 1, exp: "Pas de compilation : modifier → rafraîchir → voir." },

    { type: "qcm", q: "Qu'affiche <code>echo \"5\" ; echo \"3\";</code> dans la page ?", opts: ["5 3", "53 : echo ne saute pas de ligne, les sorties se collent", "8", "Erreur"], a: 1, exp: "Pour un saut de ligne HTML : echo \"5&lt;br&gt;\"; — c'est du HTML qu'on fabrique !" },
    { type: "qcm", q: "Que reçoit le NAVIGATEUR quand le serveur exécute <code>&lt;?php echo 2 + 3; ?&gt;</code> ?", opts: ["Le code PHP", "Le caractère « 5 » : seul le RÉSULTAT est envoyé", "2 + 3", "Une erreur"], a: 1, exp: "Le visiteur ne voit jamais la formule, juste le produit fini." },

<pre class="pseudo">&lt;h1&gt;Bienvenue chez Aryaa&lt;/h1&gt;        // HTML correct : un grand titre, envoyé tel quel
