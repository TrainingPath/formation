var DAY = {
  num: 16,
  title: "POO : classes et objets",
  subtitle: "La programmation orientée objet, dialecte PHP : -> au lieu du point.",
  theory: `
<h3>1. La classe PHP</h3>
<p>Une <strong>classe</strong> est un moule ; un <strong>objet</strong> est un exemplaire fabriqué avec ce moule. Une classe regroupe des <strong>attributs</strong> (les données de l'objet, comme son solde) et des <strong>méthodes</strong> (ses comportements, comme déposer de l'argent). Même concept qu'en Java, avec une syntaxe adaptée.</p>
<pre class="pseudo">class Compte {                             // déclaration de la classe Compte (le moule)
    private string $titulaire;         // attribut privé et typé : inaccessible de l'extérieur (private)
    private float $solde;              // second attribut : le solde du compte

    public function __construct(string $titulaire, float $solde = 0) {  // __construct = le CONSTRUCTEUR (appelé par new)
        $this->titulaire = $titulaire;         // $this = l'objet courant ; la FLÈCHE -> accède à son attribut
        $this->solde = max(0, $solde);         // validation dès la naissance : jamais de solde négatif
    }                                          // fin du constructeur
    public function getSolde(): float {        // getter : lecture contrôlée du solde
        return $this->solde;                   // renvoie la valeur de l'attribut solde
    }                                          // fin du getter
    public function deposer(float $m): void {  // méthode qui modifie l'objet (ne renvoie rien : void)
        if ($m > 0) { $this->solde += $m; }    // on n'accepte qu'un dépôt positif
    }                                          // fin de deposer
    public function retirer(float $m): bool {  // renvoie true/false selon le succès
        if ($m > 0 &amp;&amp; $m &lt;= $this->solde) {    // montant positif ET solde suffisant ?
            $this->solde -= $m;                // on débite le compte
            return true;                       // retrait réussi
        }                                      // fin du if
        return false;                          // sinon : échec
    }                                          // fin de retirer
}                                              // fin de la classe</pre>

<h3>2. Les différences avec Java, en 5 points</h3>
<pre class="pseudo">JAVA                        PHP                          // à gauche Java, à droite PHP
new Compte("Ana", 100)      new Compte("Ana", 100)      // création d'un objet : identique !
c.deposer(30)               $c->deposer(30)              // accès aux membres : la FLÈCHE -> (pas le point)
this.solde                  $this->solde                 // $this->attribut, SANS $ devant l'attribut
public Compte(...)          public function __construct(...)   // le constructeur s'appelle __construct
toString()                  __toString()                 // la méthode d'affichage s'appelle __toString</pre>
<div class="warn">La flèche <code>-&gt;</code> remplace le point de Java (le point, en PHP, sert à concaténer). Et note bien : <code>$this-&gt;solde</code> — le <code>$</code> est sur <code>this</code>, PAS sur <code>solde</code>. Écrire <code>$this-&gt;$solde</code> est une erreur subtile et classique.</div>

<h3>3. Utilisation</h3>
<pre class="pseudo">$c1 = new Compte("Ana", 100);       // crée un compte avec 100 de solde (new appelle __construct)
$c2 = new Compte("Bob");            // solde 0 par défaut (paramètre optionnel)
$c1->deposer(30);                   // le solde de $c1 passe à 130
$ok = $c2->retirer(50);             // false : $c2 n'a que 0, retrait refusé
echo $c1->getSolde();               // affiche 130</pre>

<h3>4. __toString : l'affichage de l'objet</h3>
<pre class="pseudo">public function __toString(): string {                  // définit comment l'objet se présente en texte
    return $this->titulaire . " : " . $this->solde . " €";  // construit la chaîne à afficher
}                                                       // fin de __toString
echo $c1;        // affiche « Ana : 130 € » : __toString est appelé AUTOMATIQUEMENT par echo</pre>

<h3>5. Objets et tableaux : le duo web</h3>
<pre class="pseudo">$comptes = [                        // un tableau d'objets
    new Compte("Ana", 100),         // 1er objet Compte
    new Compte("Bob", 50)           // 2e objet Compte
];                                  // fin du tableau
foreach ($comptes as $c) {          // $c = un objet Compte à chaque tour
    echo $c . "&lt;br&gt;";              // __toString s'applique à chacun (l'objet devient du texte)
}                                   // fin du parcours</pre>
<div class="tip">Tout ce que tu sais de la POO Java (encapsulation, constructeur validant, <code>private</code>, méthodes qui servent de portes d'entrée) s'applique tel quel : seule la flèche change. La POO est un CONCEPT, pas une syntaxe.</div>`,
  exercises: [
    { type: "qcm", q: "En PHP, on accède aux membres d'un objet avec…", opts: ["le point .", "la flèche -> : $c->deposer(30)", "les crochets", "::"], a: 1, exp: "Le point PHP concatène (leçon 2) : il fallait un autre symbole !" },
    { type: "qcm", q: "Le constructeur PHP s'appelle…", opts: ["Compte() comme la classe", "__construct (deux underscores)", "init", "new"], a: 1, exp: "Un nom unique quel que soit le nom de la classe — différent de Java." },
    { type: "qcm", q: "Dans une méthode, l'attribut solde s'écrit…", opts: ["$solde", "$this->solde (le $ sur this, pas sur solde !)", "$this->$solde", "this.solde"], a: 1, exp: "$this->$solde chercherait un attribut au nom VARIABLE : bug sournois." },
    { type: "input", q: "$c = new Compte(\"Ana\", 100); $c->deposer(30); $c->retirer(60); echo $c->getSolde(); Affiche… ?", a: "70", ph: "nombre", exp: "100 + 30 − 60 : la trace du compte, dialecte PHP." },
    { type: "qcm", q: "$c->solde = 9999; avec solde private :", opts: ["Ça marche", "Erreur fatale « Cannot access private property » : la forteresse tient (Java leçon 13 !)", "Warning seulement", "Crée un attribut"], a: 1, exp: "private = même protection qu'en Java." },
    { type: "qcm", q: "new Compte(\"Bob\") sans deuxième argument fonctionne car…", opts: ["PHP devine", "Le paramètre a une valeur PAR DÉFAUT : float $solde = 0 (leçon 9 !)", "Bob est spécial", "Erreur en fait"], a: 1, exp: "Les défauts remplacent les constructeurs multiples de Java." },
    { type: "qcm", q: "new Compte(\"Ana\", -500) : que vaut le solde initial ?", opts: ["-500", "0 : max(0, $solde) valide à la naissance — l'objet naît cohérent", "500", "Erreur"], a: 1, exp: "Le constructeur validant : un invariant posé pour la vie." },
    { type: "qcm", q: "__toString permet…", opts: ["De trier", "Que echo $objet; affiche un texte choisi par TOI", "De cloner", "De supprimer"], a: 1, exp: "Comme le toString Java : la carte d'identité affichable." },
    { type: "qcm", q: "$comptes = [new Compte(\"Ana\"), new Compte(\"Bob\")]; est…", opts: ["Interdit", "Un tableau D'OBJETS : structures + classes, le duo de toute application", "Un objet double", "Une erreur de type"], a: 1, exp: "foreach + méthodes : la gestion de collection d'objets." },
    { type: "qcm", q: "Pourquoi retirer() retourne un bool ?", opts: ["PHP oblige toute méthode à retourner un bool", "L'appelant sait si l'opération a réussi : la fonction-test du jour 21 d'algo", "Pour le style", "bool est plus rapide"], a: 1, exp: "if ($c->retirer(50)) { … } else { « solde insuffisant » }." },
    { type: "qcm", q: "private string $titulaire; — le type string ici est…", opts: ["Obligatoire", "Optionnel mais recommandé : PHP vérifie chaque affectation de l'attribut (rigueur volontaire, leçon 9)", "Purement indicatif : PHP ne vérifie jamais le type d'un attribut", "Une erreur"], a: 1, exp: "Les propriétés typées : la robustesse Java, adoptée par PHP moderne." },
    { type: "qcm", q: "Où placer la classe Compte dans un projet propre ?", opts: ["Dans chaque page", "Dans son fichier Compte.php, inclus par require_once \"Compte.php\";", "En session", "Dans le CSS"], a: 1, exp: "Un fichier par classe (comme Java) ; require_once l'importe sans doublon." },
    { type: "qcm", q: "Quelle différence de PHILOSOPHIE entre $membre[\"solde\"] (tableau, leçon 8) et $compte->getSolde() ?", opts: ["Aucune", "Le tableau expose des données brutes modifiables ; l'objet PROTÈGE ses données derrière des règles", "Le tableau est plus sûr", "L'objet est plus lent donc pire"], a: 1, exp: "Tableau = sac ouvert ; objet = coffre à règles. Complexité croissante → objets." },
    { type: "qcm", q: "echo $c1; sans __toString défini :", opts: ["Affiche les attributs", "Erreur « Object of class Compte could not be converted to string »", "Affiche Compte", "null"], a: 1, exp: "PHP est plus strict que Java ici (qui affichait l'adresse) : __toString requis pour echo." },
    { type: "vf", q: "Tout ce qui a été appris sur la POO Java (encapsulation, constructeur, invariants) s'applique conceptuellement à PHP.", a: true, exp: "Concepts universels, syntaxes locales : le message du cours entier." }
  ],
  final: {
    title: "Exercice final — La classe Produit du catalogue",
    intro: `<p>La boutique se professionnalise :</p>
<pre class="pseudo">class Produit {                             // déclaration de la classe Produit
    public function __construct(            // constructeur avec PROMOTION de propriétés (PHP 8)
        private string $nom,                // « private » ici déclare ET affecte l'attribut $nom
        private float $prix,                // idem : l'attribut $prix
        private int $stock = 0              // attribut $stock, 0 par défaut
    ) {}                                    // corps vide : PHP fait les affectations tout seul !

    public function vendre(int $qte): bool {   // vend $qte unités ; renvoie true/false
        if ($qte > 0 &amp;&amp; $qte <= $this->stock) {  // quantité positive ET stock suffisant ?
            $this->stock -= $qte;              // on décrémente le stock
            return true;                       // vente réussie
        }                                      // fin du if
        return false;                          // sinon : vente refusée
    }                                          // fin de vendre
    public function getStock(): int { return $this->stock; }   // getter : renvoie le stock actuel
    public function __toString(): string {     // texte affiché par echo
        return $this->nom . " (" . $this->prix . " €) — stock : " . $this->stock;  // construit la chaîne
    }                                          // fin de __toString
}                                              // fin de la classe
$p = new Produit("Clavier", 45.0, 10);         // crée un produit : stock initial 10
$p->vendre(3);                              // (1) vend 3 unités
$ok = $p->vendre(20);                       // (2) tente d'en vendre 20 (plus que le stock)
echo $p;                                    // (3) affiche l'état du produit via __toString</pre>`,
    questions: [
      { type: "qcm", q: "Le constructeur « promu » (private string $nom dans les parenthèses) fait quoi ?", opts: ["Une erreur", "Déclare ET affecte les attributs en une fois : le boilerplate Java (déclaration + this.x = x) condensé", "Rend tout public", "Interdit les défauts"], a: 1, exp: "PHP 8 : la promotion de propriétés — même résultat, trois fois moins de lignes." },
      { type: "input", q: "(1) Après vendre(3), que vaut getStock() ?", a: "7", ph: "nombre", exp: "10 − 3 = 7." },
      { type: "qcm", q: "(2) Que vaut $ok ?", opts: ["true", "false : 20 > 7, la vente est refusée et le stock intact", "20", "null"], a: 1, exp: "La règle métier dans l'objet : pas de stock négatif possible." },
      { type: "qcm", q: "(3) Qu'affiche echo $p; ?", opts: ["Produit", "Clavier (45 €) — stock : 7", "Une erreur", "45"], a: 1, exp: "__toString reflète l'état réel après les opérations." },
      { type: "qcm", q: "Le site gère 200 produits chargés depuis un JSON (leçon 15). L'architecture propre :", opts: ["200 variables", "json_decode → boucle qui construit des new Produit(...) → tableau d'objets → foreach : fichiers + POO mariés", "Tout en session", "Un gros string"], a: 1, exp: "Le pont données↔objets : exactement ce que fera ton livre d'or (leçon 20) et ce que PDO automatise (leçon 18)." }
    ],
    solution: `<pre class="pseudo">new Produit("Clavier", 45.0, 10)   → stock 10        // création
vendre(3)  → true,  stock 7                          // 10 - 3
vendre(20) → false, stock 7 (protégé)                // 20 > 7 → refusé, stock inchangé
echo       → "Clavier (45 €) — stock : 7"            // __toString

PHP 8 en cadeau : la promotion de propriétés         // constructeur ultra-court
(constructeur = déclaration + affectation + validation).</pre>
<p>La POO PHP est en place. Demain : héritage et visibilité — la ménagerie du cours Java, revisitée.</p>`
  }
};

    solution: "<?php                                        // ouvre la zone PHP\nclass Produit {                              // déclaration de la classe\n    private string $nom;                     // propriété PRIVÉE typée : inaccessible de l'extérieur\n    private float $prix;                     // idem pour le prix\n\n    public function __construct(string $nom, float $prix) { // constructeur : appelé par new\n        $this->nom = $nom;                   // $this->nom = la propriété ; $nom = le paramètre\n        $this->prix = $prix;                 // range le second paramètre\n    }                                        // fin du constructeur\n\n    public function afficher(): void {       // méthode publique ; : void = ne renvoie rien\n        echo \"$this->nom : $this->prix €<br>\"; // les propriétés s'interpolent dans la chaîne\n    }                                        // fin d'afficher\n\n    public function appliquerRemise(float $pourcent): void { // méthode de remise\n        $this->prix *= (1 - $pourcent / 100); // 10 % → prix × 0,9\n    }                                        // fin d'appliquerRemise\n}                                            // fin de la classe\n\n$clavier = new Produit(\"Clavier\", 45);       // crée un 1er objet (appelle __construct)\n$souris = new Produit(\"Souris\", 20);         // crée un 2e objet indépendant\n\n$clavier->appliquerRemise(10);               // la flèche -> appelle une méthode de l'objet\n\n$clavier->afficher();                        // Clavier : 40.5 €\n$souris->afficher();                         // Souris : 20 € (non touchée par la remise)\n?>",
