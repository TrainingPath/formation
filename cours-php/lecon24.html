<script>
var DAY = {
  num: 24,
  title: "Dates et heures avec DateTime",
  subtitle: "Calculer des durées, formater et comparer des dates sans se tromper.",
  theory: `
<h3>1. Le timestamp : le temps en un seul nombre</h3>
<p>L'ordinateur ne stocke pas « 14 juillet 2026 » mais un <strong>timestamp Unix</strong> : le nombre de SECONDES écoulées depuis le 1er janvier 1970 à minuit (UTC). Analogie : un très long chronomètre lancé en 1970 et jamais arrêté. <code>time()</code> renvoie ce nombre pour l'instant présent.</p>
<pre class="pseudo">\$maintenant = time();          // ex : 1789000000 → un GRAND entier (secondes depuis 1970)
// avantage : comparer deux dates = comparer deux nombres. Simple pour la machine, illisible pour nous.</pre>

<h3>2. date() : formater un timestamp en texte</h3>
<p><code>date(format, timestamp)</code> traduit un timestamp en texte lisible. Le <strong>format</strong> est une suite de LETTRES-CODES, chacune remplacée par une partie de la date.</p>
<pre class="pseudo">echo date("d/m/Y");            // ex : 14/07/2026  → d=jour, m=mois, Y=année sur 4 chiffres
echo date("H:i:s");            // ex : 09:30:05    → H=heures 24h, i=minutes, s=secondes
echo date("l");                // ex : Tuesday     → l (L minuscule) = nom du jour (en anglais)
// sans 2e argument, date() utilise l'instant présent (time())</pre>
<div class="tip">Retenir quelques codes : <code>d</code> jour, <code>m</code> mois, <code>Y</code> année, <code>H</code> heure, <code>i</code> minute, <code>s</code> seconde. Tout caractère non-code (/, :, espace) s'affiche tel quel.</div>

<h3>3. L'objet DateTime : plus puissant que date()</h3>
<p>La classe <strong>DateTime</strong> représente une date comme un OBJET qu'on peut manipuler (ajouter des jours, comparer…). On la crée avec <code>new DateTime()</code>.</p>
<pre class="pseudo">\$d = new DateTime();                       // maintenant, sous forme d'objet
\$d = new DateTime("2026-07-14");           // une date précise (format AAAA-MM-JJ)
\$d = new DateTime("2026-07-14 09:30:00");  // date + heure
echo \$d->format("d/m/Y");                  // on FORMATE l'objet en texte : « 14/07/2026 »</pre>
<p>La méthode <code>format()</code> d'un DateTime utilise les MÊMES codes que <code>date()</code>. On garde l'objet pour calculer, on appelle <code>format()</code> pour afficher.</p>

<h3>4. Ajouter ou retirer une durée : DateInterval</h3>
<p>Un <strong>DateInterval</strong> décrit une DURÉE (« 7 jours », « 2 mois »). On l'écrit avec la norme ISO 8601 : <code>P</code> (période) puis un nombre + une lettre d'unité.</p>
<pre class="pseudo">\$d = new DateTime("2026-07-14");           // point de départ
\$d->add(new DateInterval("P7D"));          // + 7 jours  → P=période, 7D = 7 Days
echo \$d->format("d/m/Y");                  // « 21/07/2026 »
\$d->sub(new DateInterval("P1M"));          // - 1 mois   → P1M = 1 Month
// codes : Y année, M mois, D jour ; après un T : H heure, M minute, S seconde
\$d->add(new DateInterval("PT2H30M"));      // + 2 h 30  → T sépare la partie « heure »</pre>
<div class="warn">Attention au piège : dans un DateInterval, <code>M</code> AVANT le <code>T</code> = mois, <code>M</code> APRÈS le <code>T</code> = minutes. « P1M » = un mois, « PT1M » = une minute.</div>

<h3>5. Comparer deux dates et mesurer un écart</h3>
<p>On compare deux DateTime directement avec <code>&lt;</code>, <code>&gt;</code>, <code>==</code>. Pour la DURÉE entre deux dates, <code>diff()</code> renvoie un DateInterval.</p>
<pre class="pseudo">\$debut = new DateTime("2026-07-14");        // date d'emprunt
\$fin   = new DateTime("2026-07-28");        // date de retour
if (\$fin &gt; \$debut) {                        // comparaison directe d'objets DateTime
    \$ecart = \$debut->diff(\$fin);            // \$ecart = un DateInterval (la durée entre les deux)
    echo \$ecart->days . " jours";           // ->days = nombre TOTAL de jours : 14
    echo \$ecart->format("%m mois %d jours"); // format lisible : « 0 mois 14 jours »
}                                          // fin du test</pre>

<h3>6. Immuabilité, fuseaux et lecture d'une saisie</h3>
<pre class="pseudo">// DateTimeImmutable : comme DateTime mais NON modifiable sur place —
// add() renvoie une NOUVELLE date au lieu de changer l'originale. Plus sûr.
\$d = new DateTimeImmutable("2026-07-14");   // objet immuable
\$plus7 = \$d->add(new DateInterval("P7D"));  // \$d reste au 14, \$plus7 = 21 → aucune surprise

// Lire une date au format utilisateur (jj/mm/aaaa) :
\$d = DateTime::createFromFormat("d/m/Y", "14/07/2026"); // dit à PHP le format d'ENTRÉE
if (\$d === false) {                          // createFromFormat renvoie false si le texte ne colle pas
    echo "Date invalide";                     // saisie rejetée
}                                            // fin du test

// Fuseau horaire (pour éviter les décalages) :
\$d = new DateTime("now", new DateTimeZone("Europe/Paris")); // date « à l'heure de Paris »</pre>
<div class="tip">Pour un stockage en base, garde le format ISO <code>Y-m-d H:i:s</code> (triable, universel). Formate en <code>d/m/Y</code> seulement À L'AFFICHAGE.</div>`,
  exercises: [
    { type: "qcm", q: "Un timestamp Unix est…", opts: ["Une date en texte", "Le NOMBRE de secondes écoulées depuis le 1er janvier 1970 (UTC)", "Un fuseau horaire", "Le nom du jour"], a: 1, exp: "Un « chronomètre » démarré en 1970 : un grand entier." },
    { type: "qcm", q: "<code>time()</code> renvoie…", opts: ["La date en texte", "Le timestamp de l'instant présent (un grand entier)", "L'heure formatée", "Une chaîne « now »"], a: 1, exp: "L'instant courant sous forme de secondes depuis 1970." },
    { type: "qcm", q: "<code>date(\"d/m/Y\")</code> produit par exemple…", opts: ["Un timestamp", "« 14/07/2026 » : d=jour, m=mois, Y=année sur 4 chiffres", "L'heure", "Tuesday"], a: 1, exp: "Chaque lettre-code est remplacée ; les / restent tels quels." },
    { type: "qcm", q: "Dans un format date(), <code>Y</code> et <code>H</code> désignent…", opts: ["Année et heure", "Y = année (4 chiffres), H = heure sur 24h", "Deux fois l'année", "Rien"], a: 1, exp: "d/m/Y pour la date, H:i:s pour l'heure." },
    { type: "qcm", q: "On crée une date précise avec…", opts: ["date(2026)", "new DateTime(\"2026-07-14\")", "time(\"2026\")", "DateInterval"], a: 1, exp: "Le constructeur accepte une chaîne au format AAAA-MM-JJ." },
    { type: "qcm", q: "La méthode <code>format()</code> d'un DateTime…", opts: ["Modifie la date", "TRADUIT l'objet en texte avec les mêmes codes que date()", "Supprime la date", "Ajoute des jours"], a: 1, exp: "On calcule sur l'objet, on formate pour afficher." },
    { type: "qcm", q: "Un DateInterval décrit…", opts: ["Une date", "Une DURÉE (« 7 jours », « 2 mois »), écrite en ISO 8601 : P7D, P2M…", "Un fuseau", "Un timestamp"], a: 1, exp: "P = période ; nombre + lettre d'unité." },
    { type: "qcm", q: "<code>$d->add(new DateInterval(\"P7D\"))</code> fait…", opts: ["Retire 7 jours", "AJOUTE 7 jours à la date $d", "Ajoute 7 mois", "Rien"], a: 1, exp: "P7D = période de 7 Days ; add() avance la date." },
    { type: "qcm", q: "Dans un DateInterval, <code>P1M</code> vs <code>PT1M</code> ?", opts: ["Identiques", "P1M = un MOIS ; PT1M = une MINUTE (le T sépare la partie horaire)", "Deux minutes", "Deux mois"], a: 1, exp: "M avant T = mois, M après T = minutes : piège classique." },
    { type: "qcm", q: "Pour connaître le nombre de jours entre deux dates, on utilise…", opts: ["time()", "$d1->diff($d2), qui renvoie un DateInterval dont ->days donne le total", "date()", "add()"], a: 1, exp: "diff mesure l'écart entre deux DateTime." },
    { type: "qcm", q: "Peut-on comparer deux DateTime avec <code>&gt;</code> ?", opts: ["Non", "OUI : $fin > $debut compare directement les deux instants", "Seulement avec ==", "Il faut diff()"], a: 1, exp: "Les objets DateTime se comparent avec <, >, ==." },
    { type: "qcm", q: "L'intérêt de <code>DateTimeImmutable</code> ?", opts: ["Plus rapide", "Il ne se modifie PAS sur place : add() renvoie une NOUVELLE date, évitant les surprises", "Il n'a pas de format()", "Il stocke le fuseau"], a: 1, exp: "L'original reste intact : moins de bugs difficiles." },
    { type: "qcm", q: "<code>DateTime::createFromFormat(\"d/m/Y\", \"14/07/2026\")</code> sert à…", opts: ["Formater", "LIRE une date en précisant son format d'ENTRÉE (utile pour une saisie utilisateur)", "Ajouter un jour", "Comparer"], a: 1, exp: "On indique à PHP comment interpréter le texte reçu." },
    { type: "qcm", q: "Pour STOCKER une date en base, quel format privilégier ?", opts: ["d/m/Y", "Le format ISO Y-m-d H:i:s : triable et universel ; on formate en d/m/Y seulement à l'affichage", "Le timestamp brut toujours", "Le nom du jour"], a: 1, exp: "ISO en base, format local pour l'humain." },
    { type: "vf", q: "Dans <code>new DateTime(\"now\", new DateTimeZone(\"Europe/Paris\"))</code>, on fixe le fuseau horaire pour éviter les décalages.", a: true, exp: "Préciser le fuseau évite les surprises d'une heure en plus ou en moins." }
  ],
  final: {
    title: "Exercice final — Emprunt et retard à la Ludothèque",
    intro: `<p>Un jeu s'emprunte pour 14 jours. On calcule la date de retour et on détecte un éventuel retard :</p>
<pre class="pseudo">\$emprunt = new DateTime("2026-07-01");                 // (1) date d'emprunt
\$retour  = (clone \$emprunt)->add(new DateInterval("P14D")); // (2) +14 jours (sur une COPIE)
echo "Retour prévu : " . \$retour->format("d/m/Y");     // « 15/07/2026 »

\$aujourdhui = new DateTime("2026-07-20");              // date du jour (simulée)
if (\$aujourdhui &gt; \$retour) {                           // (3) le jour dépasse la date de retour ?
    \$retard = \$retour->diff(\$aujourdhui);              // (4) écart entre retour prévu et aujourd'hui
    echo "EN RETARD de " . \$retard->days . " jours";    // ->days = 5
} else {                                                // sinon
    echo "Dans les temps";                               // pas de retard
}                                                        // fin</pre>`,
    questions: [
      { type: "qcm", q: "(1)(2) Pourquoi <code>clone $emprunt</code> avant le <code>add()</code> ?", opts: ["Décoratif", "add() MODIFIE l'objet sur place : sans clone, la date d'emprunt serait elle-même décalée de 14 jours", "Pour la vitesse", "clone est obligatoire partout"], a: 1, exp: "On travaille sur une copie pour préserver la date d'origine." },
      { type: "qcm", q: "(2) Que représente <code>P14D</code> ?", opts: ["14 mois", "Une période de 14 jours (P = période, 14D = 14 Days)", "14 minutes", "1400 secondes"], a: 1, exp: "D = Days ; la lettre donne l'unité." },
      { type: "qcm", q: "(3) La comparaison <code>$aujourdhui &gt; $retour</code> …", opts: ["Compare des timestamps à la main", "Compare directement deux objets DateTime : vrai si aujourd'hui est APRÈS la date de retour", "Ne marche pas sur les objets", "Renvoie une durée"], a: 1, exp: "Les DateTime se comparent nativement." },
      { type: "qcm", q: "(4) <code>$retour->diff($aujourdhui)->days</code> vaut…", opts: ["14", "5 : le nombre total de jours entre le 15/07 et le 20/07", "0", "20"], a: 1, exp: "diff mesure l'écart ; ->days donne le total en jours." },
      { type: "qcm", q: "Comment stocker <code>$retour</code> en base proprement ?", opts: ["En texte « 15/07/2026 »", "Avec $retour->format(\"Y-m-d\") : format ISO triable et universel", "Le nom du jour", "Le timestamp seul, jamais formaté"], a: 1, exp: "ISO en base ; d/m/Y réservé à l'affichage." }
    ],
    solution: `<pre class="pseudo">function calculerRetour(string \$dateEmprunt, int \$jours): string { // renvoie la date de retour (ISO)
    \$d = new DateTimeImmutable(\$dateEmprunt);           // objet IMMUABLE (pas de clone nécessaire)
    \$retour = \$d->add(new DateInterval("P{\$jours}D"));   // ajoute N jours → NOUVELLE date
    return \$retour->format("Y-m-d");                     // format ISO pour la base
}                                                       // fin de la fonction

function joursDeRetard(string \$retourPrevu): int {      // 0 si dans les temps, sinon le retard
    \$prevu = new DateTime(\$retourPrevu);                // date limite
    \$today = new DateTime("today");                     // aujourd'hui (minuit)
    if (\$today &lt;= \$prevu) {                             // pas encore dépassé ?
        return 0;                                       // aucun retard
    }                                                   // fin du if
    return \$prevu->diff(\$today)->days;                  // nombre de jours de dépassement
}                                                       // fin de la fonction

echo calculerRetour("2026-07-01", 14);                  // « 2026-07-15 »
echo joursDeRetard("2026-07-15");                       // dépend du jour courant

// À retenir :
// · DateTime pour manipuler, format() pour afficher     // objet vs texte
// · DateInterval (P..D / T..M) pour ajouter des durées   // attention M avant/après T
// · diff() pour mesurer un écart, ISO Y-m-d pour la base // stocker proprement</pre>
<p>Tu manipules le temps sans te tromper. Demain, on traite des LISTES de données avec élégance : map, filter, reduce.</p>`
  }
};
