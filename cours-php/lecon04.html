<script>
var DAY = {
  num: 4,
  title: "Les chaînes et l'interpolation",
  subtitle: "Le jour 19 d'algorithmique, avec l'arsenal des fonctions PHP.",
  theory: `
<h3>1. Les fonctions de base</h3>
<p>Une <strong>chaîne</strong> (string) est un texte : une suite de caractères. En PHP, les opérations sur les chaînes passent par des <strong>fonctions</strong> (des outils tout prêts, pas des méthodes) : on écrit le nom de la fonction, puis, entre parenthèses, la chaîne à traiter — ce qu'on lui donne s'appelle un <strong>argument</strong>.</p>
<pre class="pseudo">PSEUDOCODE (jour 19)     PHP                        // à gauche le pseudocode, à droite la fonction PHP
LONGUEUR(mot)            strlen($mot)          // strlen = « string length » : nombre d'OCTETS (attention aux accents multi-octets)
mot[i]                   $mot[0]               // accès à un caractère par les crochets, en comptant à partir de 0 !
MAJUSCULE                strtoupper($mot)      // renvoie une COPIE tout en majuscules (upper = haut)
MINUSCULE                strtolower($mot)      // renvoie une COPIE tout en minuscules (lower = bas)
a &amp; b                    $a . $b               // le point . concatène (colle) deux chaînes</pre>
<p>Note : contrairement à Java, PHP garde les <strong>crochets</strong> pour accéder à un caractère : <code>$mot[0]</code>, comme pour un tableau.</p>

<h3>2. L'arsenal indispensable</h3>
<pre class="pseudo">strlen("bonjour")             → 7            // longueur : 7 caractères
str_contains("bonjour","jou") → true         // contient-il « jou » ? (fonction ajoutée en PHP 8)
str_starts_with("bonjour","bon") → true      // commence-t-il par « bon » ?
strpos("bonjour", "o")        → 1            // position de la 1re occurrence de « o », ou FALSE si absent !
substr("bonjour", 3)          → "jour"       // sous-chaîne (morceau) À PARTIR de l'indice 3 jusqu'au bout
substr("bonjour", 0, 3)       → "bon"        // sous-chaîne : début à l'indice 0, sur une LONGUEUR de 3 (pas un indice de fin !)
trim("  hey  ")               → "hey"        // enlève les espaces aux deux bords
str_replace("a", "o", "chat") → "chot"       // remplace TOUTES les occurrences de « a » par « o »
strrev("chat")                → "tahc"       // renverse la chaîne (le miroir du jour 19, natif !)
str_repeat("ab", 3)           → "ababab"     // répète la chaîne 3 fois
ucfirst("bonjour")            → "Bonjour"    // met la 1re lettre en majuscule (upper-case first)
explode("-", "a-b-c")         → ["a","b","c"] // DÉCOUPE la chaîne sur un séparateur → un tableau (le split de Java)
implode(", ", ["a","b"])      → "a, b"        // opération INVERSE : recolle un tableau en une chaîne</pre>

<h3>3. LE piège de strpos</h3>
<pre class="pseudo">$pos = strpos("chat", "c");        // → 0 : « c » est trouvé en position ZÉRO (le tout premier caractère) !
if ($pos == false)  { /* ... */ }  // BUG : 0 == false vaut TRUE → « trouvé » passe pour « absent » (leçon 3 !)
if ($pos === false) { /* ... */ }  // CORRECT : === distingue le 0 (une position) du false (vraiment absent)</pre>
<div class="warn"><code>strpos</code> renvoie 0 (position valide) ou <code>false</code> (absent). Avec <code>==</code>, les deux se confondent à cause du jonglage de types ! C'est LE cas d'école qui justifie le <code>===</code> appris à la leçon 3. Grave-le.</div>

<h3>4. Interpolation avancée</h3>
<pre class="pseudo">$prix = 20;                        // on range 20 dans la variable $prix
echo "Prix : {$prix} €";           // les accolades { } délimitent clairement le nom de la variable → affiche « Prix : 20 € »
echo "Prix : \${prix}0 €";          // sans accolades, "$prix0" chercherait une variable nommée $prix0 (qui n'existe pas) !</pre>
<p>Les accolades <code>{$variable}</code> sont utiles quand le nom de la variable touche d'autres caractères, pour lever toute ambiguïté.</p>

<h3>5. Parcourir une chaîne caractère par caractère</h3>
<pre class="pseudo">$nb = 0;                                  // compteur du nombre de « a » (démarre à 0)
for ($i = 0; $i &lt; strlen($mot); $i++) {   // boucle : $i va de 0 jusqu'à la longueur-1 (chaque indice)
    if ($mot[$i] === "a") { $nb++; }      // si le caractère à l'indice $i vaut « a » (=== strict) : +1
}                                         // fin de la boucle : $nb contient le total de « a »</pre>

<h3>6. Nettoyer les saisies : le duo trim + strtolower</h3>
<pre class="pseudo">$reponse = strtolower(trim($saisie));   // trim enlève les espaces, strtolower met en minuscules : "  OUI " devient "oui"
if ($reponse === "oui") { /* ... */ }   // comparaison fiable, quels que soient les espaces et la casse tapés par l'utilisateur</pre>
<p>Ce nettoyage avant comparaison est un réflexe essentiel : l'utilisateur tape « OUI », « oui », «  Oui  »… on ramène tout à une forme canonique (une forme de référence unique).</p>
<h3>Aller plus loin — pré-incrément (++i) et post-incrément (i++)</h3>
<p>Les deux écritures ajoutent 1 à la variable ; la différence n'apparaît que lorsqu'on <strong>lit la valeur au moment même</strong> de l'incrémentation. La formule à retenir : <code>\$i++</code> « donne sa valeur, PUIS grandit » ; <code>++\$i</code> « grandit, PUIS donne sa valeur ».</p>
<pre class="pseudo">\$a = 5;        // \$a vaut 5
\$b = \$a++;      // POST-increment : \$b prend l'ANCIENNE valeur -> \$b = 5, et ENSUITE \$a passe a 6
\$c = 5;        // \$c vaut 5
\$d = ++\$c;      // PRE-increment : \$c passe d'abord a 6, PUIS \$d prend la NOUVELLE valeur -> \$d = 6</pre>
<p>Dans une boucle <code>for (\$i = 0; \$i &lt; 5; \$i++)</code>, on ne lit pas le résultat de <code>\$i++</code> : on veut seulement « ajouter 1 ». C'est pourquoi <code>\$i++</code> et <code>++\$i</code> y donnent exactement la même boucle.</p>`,
  exercises: [
    { type: "input", q: "Que vaut <code>strlen(\"algorithme\")</code> ?", a: "10", ph: "nombre", exp: "10 caractères ASCII = 10 octets." },
    { type: "qcm", q: "Le premier caractère de $mot s'obtient par…", opts: ["$mot.charAt(0)", "$mot[0] : PHP garde les crochets, 0-indexé", "$mot(0)", "first($mot)"], a: 1, exp: "Plus proche du tableau que Java." },
    { type: "input", q: "Que vaut <code>substr(\"bonjour\", 0, 3)</code> ?", a: ["bon"], ph: "texte", exp: "Départ 0, LONGUEUR 3 (≠ Java où le 2ᵉ paramètre est l'indice de fin !)." },
    { type: "input", q: "Que vaut <code>strrev(\"ROMA\")</code> ?", a: ["AMOR", "amor"], ph: "texte", exp: "Le miroir du jour 19, offert par le langage." },
    { type: "input", q: "Que vaut <code>str_replace(\"o\", \"0\", \"bonjour\")</code> ?", a: ["b0nj0ur"], ph: "texte", exp: "Chaque o devient 0." },
    { type: "qcm", q: "<code>strpos(\"chat\", \"z\")</code> retourne…", opts: ["-1 comme en Java", "false : le code « absent » de PHP", "0", "null"], a: 1, exp: "Et c'est là que le piège commence…" },
    { type: "qcm", q: "<code>strpos(\"chat\", \"c\")</code> retourne 0. Pourquoi <code>if (strpos(...) == false)</code> est-il un bug ?", opts: ["strpos est lent", "0 == false vaut TRUE (jonglage !) : le « trouvé en position 0 » passe pour un « absent »", "Il faut un else", "Aucun bug"], a: 1, exp: "LA démonstration vivante du === : if (strpos(...) === false)." },
    { type: "qcm", q: "Le test moderne d'inclusion (PHP 8+) :", opts: ["strpos obligatoire", "str_contains($phrase, $mot) : true/false, zéro piège", "contains()", "in()"], a: 1, exp: "Créée précisément pour éviter le piège strpos." },
    { type: "input", q: "Que vaut <code>str_repeat(\"na\", 4)</code> ? (suivi de « Batman ! »)", a: ["nananana"], ph: "texte", exp: "4 répétitions : nananana." },
    { type: "qcm", q: "<code>explode(\";\", \"Ana;14\")</code> retourne…", opts: ["La chaîne \"Ana14\" recollée", "Le tableau [\"Ana\", \"14\"] : le split de Java, nom PHP", "Le nombre de morceaux : 2", "Seulement le premier morceau \"Ana\""], a: 1, exp: "Le découpeur de CSV — il resservira leçon 15 (fichiers)." },
    { type: "qcm", q: "L'inverse d'explode est…", opts: ["unexplode", "implode(\", \", $tableau) : recolle les morceaux avec un séparateur", "join uniquement", "concat"], a: 1, exp: "Tableau → chaîne : pratique pour l'affichage de listes." },
    { type: "input", q: "echo strtolower(trim(\"  OUI  \")); affiche… ?", a: ["oui"], ph: "texte", exp: "Le duo nettoyeur de saisies : espaces dehors, casse normalisée." },
    { type: "qcm", q: "$n = 5; echo \"J'ai $n0 euros\"; affiche…", opts: ["J'ai 50 euros", "Warning : PHP cherche la variable $n0 qui n'existe pas ! Il fallait {$n}0", "J'ai 5 0 euros", "J'ai $n0 euros"], a: 1, exp: "Les accolades {$n} délimitent le nom : réflexe d'interpolation propre." },
    { type: "input", q: "Combien de \"s\" dans \"mississippi\" (boucle du jour 19) ?", a: "4", ph: "nombre", exp: "Le comptage éternel, troisième syntaxe." },
    { type: "qcm", q: "ucfirst(\"bonjour\") retourne…", opts: ["BONJOUR", "Bonjour : première lettre en majuscule", "bONJOUR", "bonjour"], a: 1, exp: "Pratique pour les prénoms saisis en minuscules." }
  ],
  final: {
    title: "Exercice final — Le validateur d'email",
    intro: `<p>Un site nettoie et analyse l'email saisi : <code>$saisie = "  Jean.DUPONT@Mail.BE  "</code></p>
<pre class="pseudo">$email = strtolower(trim($saisie));            // (1) nettoie : enlève les espaces (trim) puis met en minuscules (strtolower)
$aArobase = str_contains($email, "@");          // (2) test true/false : l'email contient-il un @ ?
$posArobase = strpos($email, "@");              // (3) position du @ dans la chaîne (un nombre)
$domaine = substr($email, $posArobase + 1);     // (4) tout ce qui suit le @ (le domaine) : substr à partir de posArobase+1
$valide = $aArobase &amp;&amp; str_contains($domaine, ".");  // valide si : il y a un @ ET le domaine contient un point
echo $valide ? "OK : $email" : "Invalide";      // opérateur ternaire : affiche « OK … » si valide, sinon « Invalide »</pre>`,
    questions: [
      { type: "input", q: "(1) Que vaut $email ?", a: ["jean.dupont@mail.be"], ph: "texte", exp: "trim retire les espaces, strtolower normalise : jean.dupont@mail.be." },
      { type: "qcm", q: "(2) Que vaut $aArobase ?", opts: ["true", "false (aucun @ détecté)", "1 (le nombre de @ trouvés)", "\"@\" (le caractère renvoyé)"], a: 0, exp: "L'@ est bien présent." },
      { type: "input", q: "(3) Que vaut $posArobase ? (compte les caractères de jean.dupont)", a: "11", ph: "nombre", exp: "j-e-a-n-.-d-u-p-o-n-t = 11 caractères (indices 0-10), l'@ est en 11." },
      { type: "input", q: "(4) Que vaut $domaine ?", a: ["mail.be"], ph: "texte", exp: "substr depuis posArobase+1 : tout ce qui suit l'@." },
      { type: "qcm", q: "Si la saisie était \"@mail.be\" (l'@ en position 0), pourquoi le code tiendrait-il quand même ?", opts: ["Le script planterait avec une erreur", "On utilise strpos pour la POSITION mais str_contains pour le TEST : le 0 piégeux ne passe jamais dans un if", "Le @ ne peut jamais se trouver en position 0", "PHP corrige seul la position piégeuse"], a: 1, exp: "Architecture anti-piège : chaque fonction à sa place. (Pro tip : filter_var($email, FILTER_VALIDATE_EMAIL) fait tout ça — leçon 13 !)" }
    ],
    solution: `<pre class="pseudo">"  Jean.DUPONT@Mail.BE  "                  // la saisie de départ (avec espaces et majuscules)
→ trim + strtolower → "jean.dupont@mail.be"  // nettoyée : sans espaces, en minuscules
→ str_contains "@"  → true                   // contient bien un @
→ strpos "@"        → 11                      // le @ est à la position 11
→ substr(12…)       → "mail.be"               // le domaine : tout ce qui suit le @ (à partir de 11+1)
→ contient "."      → true → "OK : jean.dupont@mail.be"   // domaine avec point → email valide

Le ? : final est l'opérateur ternaire (condition ? siVrai : siFaux),   // raccourci d'un if/else
déjà croisé en Java leçon 8.</pre>
<p>Nettoyer, tester, découper : le traitement de texte est le pain quotidien du web. Demain, les conditions PHP — avec match, l'élégant successeur du switch.</p>`
  }
};
