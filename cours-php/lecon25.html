<script>
var DAY = {
  num: 25,
  title: "Fonctions de tableau : map, filter, reduce",
  subtitle: "Transformer, trier et résumer des listes sans écrire de boucle à la main.",
  theory: `
<h3>1. L'idée : décrire QUOI faire, pas COMMENT boucler</h3>
<p>Jusqu'ici, pour transformer une liste, tu écrivais un <code>foreach</code>. PHP offre des fonctions qui font la boucle POUR toi : tu fournis juste la RÈGLE à appliquer. Analogie : au lieu d'expliquer chaque geste pour éplucher 10 pommes, tu donnes la consigne « épluche » et une machine s'occupe des 10.</p>
<p>La règle est une <strong>fonction anonyme</strong> (sans nom, écrite sur place). Version courte, la <strong>fonction fléchée</strong> : <code>fn(\$x) =&gt; \$x * 2</code> — « pour un \$x, renvoie \$x fois 2 ».</p>
<pre class="pseudo">\$doubler = fn(\$x) =&gt; \$x * 2;    // une fonction fléchée : entrée \$x, sortie \$x*2
echo \$doubler(5);              // affiche 10 — on l'appelle comme une fonction normale</pre>

<h3>2. array_map : TRANSFORMER chaque élément</h3>
<p><code>array_map(règle, tableau)</code> applique la règle à CHAQUE élément et renvoie un NOUVEAU tableau de même taille. Analogie : une chaîne de montage qui repeint chaque pièce.</p>
<pre class="pseudo">\$prix = [10, 20, 30];                          // prix hors taxe
\$ttc = array_map(fn(\$p) =&gt; \$p * 1.2, \$prix);  // applique « x1.2 » à chaque prix
// \$ttc vaut [12, 24, 36] — MÊME nombre d'éléments, chacun transformé
\$titres = ["catan", "uno"];                    // titres en minuscules
\$maj = array_map("ucfirst", \$titres);          // on peut passer le NOM d'une fonction existante
// \$maj vaut ["Catan", "Uno"]</pre>
<div class="tip">array_map ne CHANGE pas le tableau d'origine : il en RENVOIE un nouveau. Pense « transformer », pas « modifier ».</div>

<h3>3. array_filter : GARDER certains éléments</h3>
<p><code>array_filter(tableau, test)</code> garde uniquement les éléments pour lesquels le test renvoie <code>true</code>. Analogie : un tamis qui ne laisse passer que ce qui répond au critère.</p>
<pre class="pseudo">\$ages = [8, 15, 12, 6, 20];                    // âges des joueurs
\$adultes = array_filter(\$ages, fn(\$a) =&gt; \$a &gt;= 12); // garde ceux &gt;= 12
// \$adultes vaut [15, 12, 20] — MAIS les clés d'origine sont conservées (1, 2, 4) !
\$reindex = array_values(\$adultes);            // array_values REMET des clés 0,1,2 propres</pre>
<div class="warn">Piège classique : array_filter garde les CLÉS d'origine (trous dans la numérotation). Si tu veux une liste bien réindexée 0,1,2…, enchaîne <code>array_values()</code>.</div>

<h3>4. array_reduce : RÉSUMER en une seule valeur</h3>
<p><code>array_reduce(tableau, règle, valeurInitiale)</code> combine tous les éléments en UNE valeur (une somme, un total, une concaténation). La règle reçoit l'accumulateur (le total en cours) et l'élément courant.</p>
<pre class="pseudo">\$prix = [10, 20, 30];                                   // des prix
\$total = array_reduce(                                  // réduit la liste à un seul nombre
    \$prix,                                              // le tableau à parcourir
    fn(\$cumul, \$p) =&gt; \$cumul + \$p,                      // règle : total en cours + prix courant
    0                                                   // valeur de départ de l'accumulateur
);                                                      // fin de array_reduce
// \$total vaut 60 — la liste s'est « repliée » en une somme
\$phrase = array_reduce(["a", "b", "c"], fn(\$acc, \$l) =&gt; \$acc . \$l, ""); // concatène → « abc »</pre>

<h3>5. Trier : sort, usort et compagnie</h3>
<pre class="pseudo">\$n = [3, 1, 2];         sort(\$n);              // trie sur place en ORDRE croissant → [1,2,3]
\$n = [3, 1, 2];         rsort(\$n);             // ordre DÉCROISSANT → [3,2,1]
\$assoc = ["b"=&gt;2, "a"=&gt;1]; asort(\$assoc);      // trie par VALEUR en gardant les clés
ksort(\$assoc);                                 // trie par CLÉ
// Tri SUR MESURE avec usort : la règle renvoie négatif / 0 / positif
\$jeux = [["t"=&gt;"Uno","j"=&gt;2], ["t"=&gt;"Risk","j"=&gt;6]]; // liste de jeux
usort(\$jeux, fn(\$a, \$b) =&gt; \$a["j"] &lt;=&gt; \$b["j"]); // trie par nb de joueurs (croissant)
// l'opérateur &lt;=&gt; (« spaceship ») renvoie -1, 0 ou 1 : parfait pour comparer</pre>

<h3>6. Enchaîner et retenir les autres outils</h3>
<pre class="pseudo">\$membres = [ ["nom"=&gt;"Léa","age"=&gt;15], ["nom"=&gt;"Tom","age"=&gt;9], ["nom"=&gt;"Zoé","age"=&gt;20] ];
\$nomsAdultes = array_map(                       // 3) puis on extrait leur nom
    fn(\$m) =&gt; \$m["nom"],                        //    règle : garder le nom
    array_filter(                               // 1) on filtre d'abord
        \$membres,                               //    la liste des membres
        fn(\$m) =&gt; \$m["age"] &gt;= 12               // 2) critère : au moins 12 ans
    )                                           //    fin du filtre
);                                              // \$nomsAdultes = ["Léa", "Zoé"]
// autres utiles : in_array (présence), array_sum (somme), count (taille),
//                 array_keys / array_column (extraire une colonne d'un tableau de tableaux)</pre>
<div class="tip">map = transformer, filter = garder, reduce = résumer. Ce trio (issu de la programmation fonctionnelle) rend le code court, lisible et sans variable temporaire. On le retrouve dans presque tous les langages.</div>`,
  exercises: [
    { type: "qcm", q: "Une fonction fléchée <code>fn($x) =&gt; $x * 2</code> …", opts: ["Déclare une variable", "Est une fonction ANONYME courte : elle prend $x et renvoie $x*2", "Est une boucle", "Ne renvoie rien"], a: 1, exp: "On la passe comme « règle » aux fonctions de tableau." },
    { type: "qcm", q: "<code>array_map</code> sert à…", opts: ["Filtrer", "TRANSFORMER chaque élément et renvoyer un nouveau tableau de MÊME taille", "Additionner", "Trier"], a: 1, exp: "Une chaîne de montage : chaque pièce transformée." },
    { type: "qcm", q: "<code>array_map(fn($p) =&gt; $p*1.2, [10,20])</code> donne…", opts: ["[10,20]", "[12,24] : chaque élément multiplié par 1.2", "60", "[10,20,12,24]"], a: 1, exp: "Même nombre d'éléments, chacun transformé." },
    { type: "qcm", q: "array_map modifie-t-il le tableau d'origine ?", opts: ["Oui", "NON : il RENVOIE un nouveau tableau, l'original est intact", "Il le vide", "Parfois"], a: 1, exp: "Penser « transformer », pas « modifier »." },
    { type: "qcm", q: "<code>array_filter</code> garde…", opts: ["Tout", "Uniquement les éléments pour lesquels le test renvoie true", "Le premier", "Rien"], a: 1, exp: "Un tamis : seul ce qui répond au critère passe." },
    { type: "qcm", q: "Quel piège avec array_filter ?", opts: ["Il trie", "Il CONSERVE les clés d'origine (trous dans la numérotation) : utiliser array_values pour réindexer", "Il double les éléments", "Il renvoie un nombre"], a: 1, exp: "array_values() remet des clés 0,1,2 propres." },
    { type: "qcm", q: "<code>array_reduce</code> sert à…", opts: ["Transformer", "RÉSUMER une liste en UNE seule valeur (somme, total, concaténation)", "Filtrer", "Trier"], a: 1, exp: "La liste se « replie » sur un accumulateur." },
    { type: "qcm", q: "Dans array_reduce, le 3e argument est…", opts: ["La règle", "La VALEUR INITIALE de l'accumulateur (0 pour une somme, \"\" pour une concaténation)", "Le tableau", "Le résultat"], a: 1, exp: "Le point de départ du repliement." },
    { type: "qcm", q: "<code>array_reduce([10,20,30], fn($c,$p)=&gt;$c+$p, 0)</code> vaut…", opts: ["[10,20,30]", "60 : la somme des éléments", "3", "0"], a: 1, exp: "L'accumulateur cumule 0+10+20+30." },
    { type: "qcm", q: "<code>sort($n)</code> …", opts: ["Renvoie un nouveau tableau", "Trie le tableau SUR PLACE en ordre croissant (modifie $n directement)", "Trie par clé", "Additionne"], a: 1, exp: "sort modifie la variable ; il ne renvoie pas la liste triée." },
    { type: "qcm", q: "Pour trier un tableau ASSOCIATIF par valeur en gardant les clés, on utilise…", opts: ["sort", "asort", "ksort", "rsort"], a: 1, exp: "asort = par valeur ; ksort = par clé." },
    { type: "qcm", q: "L'opérateur <code>&lt;=&gt;</code> (spaceship) renvoie…", opts: ["true/false", "-1, 0 ou 1 selon que le gauche est inférieur, égal ou supérieur au droit — idéal pour usort", "la somme", "le maximum"], a: 1, exp: "Parfait pour écrire une règle de comparaison." },
    { type: "qcm", q: "<code>usort</code> sert à…", opts: ["Trier alphabétiquement seulement", "Trier SUR MESURE avec une règle de comparaison qu'on fournit (ex : par nombre de joueurs)", "Filtrer", "Additionner"], a: 1, exp: "u = user : le critère de tri est le tien." },
    { type: "qcm", q: "Filtrer les membres ≥ 12 ans puis extraire leurs noms se fait en…", opts: ["Une seule fonction", "enchaînant array_filter (garder) puis array_map (transformer)", "un array_reduce", "un sort"], a: 1, exp: "map(filter(...)) : filtrer d'abord, transformer ensuite." },
    { type: "vf", q: "map transforme, filter garde, reduce résume : ce trio évite d'écrire des boucles foreach à la main.", a: true, exp: "Code plus court et plus lisible, sans variable temporaire." }
  ],
  final: {
    title: "Exercice final — Statistiques du catalogue Ludothèque",
    intro: `<p>À partir du catalogue, on veut le nom des jeux « famille » (≤ 4 joueurs) et le total des exemplaires en stock :</p>
<pre class="pseudo">\$catalogue = [                                          // liste de jeux (tableaux associatifs)
    ["titre"=&gt;"Uno",   "joueurs"=&gt;10, "stock"=&gt;3],       // beaucoup de joueurs
    ["titre"=&gt;"Catan", "joueurs"=&gt;4,  "stock"=&gt;2],       // jeu famille
    ["titre"=&gt;"Jungle","joueurs"=&gt;2,  "stock"=&gt;5]        // jeu famille
];                                                      // fin du catalogue

\$famille = array_filter(                                // (1) garder les jeux famille
    \$catalogue,                                         //   dans le catalogue
    fn(\$j) =&gt; \$j["joueurs"] &lt;= 4                        //   critère : 4 joueurs ou moins
);                                                      // \$famille = Catan, Jungle
\$noms = array_map(fn(\$j) =&gt; \$j["titre"], \$famille);    // (2) extraire leurs titres
\$noms = array_values(\$noms);                           // (3) réindexer proprement (0,1)

\$stockTotal = array_reduce(                             // (4) somme des stocks
    \$catalogue,                                         //   sur tout le catalogue
    fn(\$cumul, \$j) =&gt; \$cumul + \$j["stock"],            //   total en cours + stock du jeu
    0                                                   //   départ à 0
);                                                      // \$stockTotal = 10
echo implode(", ", \$noms) . " — " . \$stockTotal . " boîtes"; // « Catan, Jungle — 10 boîtes »</pre>`,
    questions: [
      { type: "qcm", q: "(1) Que contient <code>$famille</code> après le array_filter ?", opts: ["Tout le catalogue", "Uniquement Catan et Jungle (≤ 4 joueurs), MAIS avec les clés d'origine 1 et 2", "Les titres", "Un nombre"], a: 1, exp: "filter garde les éléments retenus et leurs clés d'origine." },
      { type: "qcm", q: "(2) Rôle du <code>array_map(fn($j) =&gt; $j[\"titre\"], ...)</code> ?", opts: ["Filtrer encore", "TRANSFORMER chaque jeu en son seul titre : on passe de tableaux à une liste de chaînes", "Additionner les stocks", "Trier"], a: 1, exp: "map extrait le champ titre de chaque élément." },
      { type: "qcm", q: "(3) Pourquoi <code>array_values($noms)</code> ?", opts: ["Inutile", "Parce que filter a laissé des clés 1,2 : array_values réindexe en 0,1 pour une liste propre", "Pour trier", "Pour additionner"], a: 1, exp: "On remet une numérotation continue après un filtre." },
      { type: "qcm", q: "(4) Comment array_reduce arrive-t-il à 10 ?", opts: ["Il compte les jeux", "Il cumule : 0 + 3 + 2 + 5 = 10, en repliant tous les stocks sur l'accumulateur", "Il prend le max", "Il multiplie"], a: 1, exp: "L'accumulateur additionne chaque stock, départ à 0." },
      { type: "qcm", q: "Pour trier ensuite $catalogue par stock décroissant, on utiliserait…", opts: ["sort($catalogue)", "usort($catalogue, fn($a,$b) =&gt; $b[\"stock\"] &lt;=&gt; $a[\"stock\"]) — règle sur mesure avec le spaceship", "array_filter", "array_map"], a: 1, exp: "usort avec $b<=>$a inverse l'ordre (décroissant)." }
    ],
    solution: `<pre class="pseudo">// Pipeline complet, lisible et sans foreach :
\$famille = array_values(                               // 3) réindexer le résultat
    array_filter(\$catalogue, fn(\$j) =&gt; \$j["joueurs"] &lt;= 4) // 1) garder les jeux ≤ 4 joueurs
);                                                     // fin filter+values
\$noms = array_map(fn(\$j) =&gt; \$j["titre"], \$famille);   // 2) extraire les titres → ["Catan","Jungle"]

\$stockTotal = array_reduce(                            // 4) résumer les stocks
    \$catalogue,                                        //    tout le catalogue
    fn(\$c, \$j) =&gt; \$c + \$j["stock"],                   //    accumulateur + stock courant
    0                                                  //    départ à 0
);                                                     // \$stockTotal = 10

usort(\$catalogue, fn(\$a, \$b) =&gt; \$b["stock"] &lt;=&gt; \$a["stock"]); // trier par stock décroissant

echo implode(", ", \$noms);                            // « Catan, Jungle »
echo " — " . \$stockTotal . " boîtes";                 // « — 10 boîtes »

// À retenir : map (transformer) · filter (garder) · reduce (résumer) · usort (trier sur mesure)</pre>
<p>Tu manipules des listes comme un pro, sans boucle à la main. Demain, on revient à la base de données pour des opérations avancées : transactions et jointures.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton code PHP ici…",
  items: [
  { id: "php-arrayfn", title: "Filtrer, transformer, totaliser un panier", level: 3,
    statement: "Un panier est une liste d'articles (titre, prix). Écris un code qui, avec <code>array_filter</code>, <code>array_map</code> et <code>array_reduce</code> : garde les articles à moins de 30 €, met leurs titres en majuscules, et calcule le total du panier ENTIER.",
    hints: [
      "Filtrer : array_filter($panier, fn($a) => $a[\"prix\"] < 30) — attention, les clés d'origine sont gardées.",
      "Transformer les titres : array_map(fn($a) => strtoupper($a[\"titre\"]), $abordables).",
      "Totaliser : array_reduce($panier, fn($cumul, $a) => $cumul + $a[\"prix\"], 0)."
    ],
    solution: "<?php                                          // ouverture PHP\n$panier = [                                    // liste d'articles (tableaux associatifs)\n    [\"titre\" => \"Catan\",  \"prix\" => 42],       // article cher\n    [\"titre\" => \"Uno\",    \"prix\" => 9],        // article abordable\n    [\"titre\" => \"Jungle\", \"prix\" => 15]        // article abordable\n];                                             // fin du panier\n\n$abordables = array_filter(                    // GARDER les articles < 30 EUR\n    $panier,                                    // dans le panier\n    fn($a) => $a[\"prix\"] < 30                   // critère : prix inférieur à 30\n);                                             // (les clés d'origine sont conservées)\n\n$titres = array_map(                           // TRANSFORMER en titres majuscules\n    fn($a) => strtoupper($a[\"titre\"]),          // règle : titre en MAJUSCULES\n    $abordables                                 // sur les articles retenus\n);                                             // $titres = [\"UNO\", \"JUNGLE\"]\n\n$total = array_reduce(                         // RESUMER le panier entier en un total\n    $panier,                                    // tout le panier\n    fn($cumul, $a) => $cumul + $a[\"prix\"],      // accumulateur + prix courant\n    0                                           // départ à 0\n);                                             // $total = 66\n\necho implode(\", \", array_values($titres)) . \"\\n\"; // « UNO, JUNGLE » (réindexé)\necho \"Total : \" . $total . \" EUR\\n\";           // « Total : 66 EUR »\n?>",
    note: "filter garde (avec les clés d'origine, d'où array_values pour réindexer), map transforme, reduce résume : trois outils qui remplacent trois boucles foreach en restant lisibles." }
  ]
};
</script>
