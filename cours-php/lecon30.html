<body>
<script>
var DAY = {
  num: 30,
  title: "Projet guidé : le livre d'or",
  subtitle: "Une vraie application web complète, sécurisée, conçue au jour 30.",
  theory: `
<h3>1. Le cahier des charges</h3>
<p>Un <strong>livre d'or</strong> est une page où les visiteurs laissent un message (nom + texte), tous les messages s'affichent, et l'admin peut supprimer. Un seul fichier <code>livre.php</code>. On applique la méthode éprouvée : comprendre → découper → écrire chaque brique → vérifier. Ce projet réunit presque tout le cours web.</p>

<h3>2. La table</h3>
<p>On crée d'abord la table qui stockera les messages (commentaires SQL avec <code>--</code>).</p>
<pre class="pseudo">CREATE TABLE messages (                              -- crée la table « messages »
    id INT AUTO_INCREMENT PRIMARY KEY,               -- clé unique, générée automatiquement à chaque ligne
    auteur VARCHAR(50),                               -- texte court (max 50 caractères) : le nom
    contenu TEXT,                                     -- texte long : le message
    date_pub DATETIME DEFAULT CURRENT_TIMESTAMP       -- date/heure remplie automatiquement à l'insertion
);                                                   -- fin de la définition de la table</pre>

<h3>3. Le découpage</h3>
<pre class="pseudo">1. Connexion PDO (dans un fichier db.php inclus)            // ouvrir la base une fois
2. SI POST → valider → INSÉRER (requête préparée)          // traiter un nouveau message
3. SI suppression demandée (ET admin) → DELETE préparé     // supprimer (réservé à l'admin)
4. LIRE tous les messages (SELECT ... ORDER BY date DESC)  // récupérer la liste
5. AFFICHER : formulaire + liste (HTML échappé)            // dessiner la page</pre>
<p>Chaque étape a un rôle unique : c'est plus clair que tout mélanger, et on repère où intervient chaque notion du cours.</p>

<h3>4. Le traitement du formulaire (leçons 12-13-19)</h3>
<pre class="pseudo">if ($_SERVER["REQUEST_METHOD"] === "POST") {          // la page a-t-elle reçu une soumission de formulaire ?
    $auteur = trim($_POST["auteur"] ?? "");           // récupère et nettoie le nom
    $contenu = trim($_POST["contenu"] ?? "");         // récupère et nettoie le message
    $erreurs = [];                                    // collecteur d'erreurs (leçon 13)
    if ($auteur === "" || strlen($auteur) &gt; 50) { $erreurs[] = "Nom invalide"; }   // nom vide ou trop long ?
    if ($contenu === "") { $erreurs[] = "Message vide"; }   // message vide ?
    if (count($erreurs) === 0) {                      // aucune erreur → on enregistre
        $stmt = $pdo->prepare(                        // prépare l'insertion
            "INSERT INTO messages (auteur, contenu) VALUES (:a, :c)"  // requête PRÉPARÉE (leçon 19)
        );                                            // fin de prepare
        $stmt->execute([":a" => $auteur, ":c" => $contenu]);   // fournit les valeurs à part (anti-injection)
        header("Location: livre.php");     // redirection après enregistrement…
        exit;                              // …et on stoppe le script (leçon 14)
    }                                      // fin du bloc « aucune erreur »
}                                          // fin du traitement POST</pre>
<div class="tip">Le motif PRG (Post-Redirect-Get) : après un INSERT, on redirige. Sinon, un F5 (recharger la page) renverrait le formulaire et créerait un message en double. Le duo <code>header</code> + <code>exit</code>, comme au portier de la leçon 14.</div>

<h3>5. L'affichage sécurisé (leçons 6-13-18)</h3>
<pre class="pseudo">$messages = $pdo->query(                              // exécute la requête de lecture
    "SELECT auteur, contenu, date_pub FROM messages ORDER BY date_pub DESC"  -- du plus récent au plus ancien
)->fetchAll(PDO::FETCH_ASSOC);            // → liste d'enregistrements (leçon 8)

foreach ($messages as $m): ?&gt;            // boucle qui génère du HTML (syntaxe alternative avec : )
    &lt;div class="message"&gt;                // conteneur d'un message
        &lt;strong&gt;&lt;?= htmlspecialchars($m["auteur"]) ?&gt;&lt;/strong&gt;   // auteur échappé : anti-XSS
        &lt;p&gt;&lt;?= htmlspecialchars($m["contenu"]) ?&gt;&lt;/p&gt;             // contenu échappé aussi
        &lt;small&gt;&lt;?= $m["date_pub"] ?&gt;&lt;/small&gt;                     // la date vient de la base, pas de l'utilisateur
    &lt;/div&gt;                               // fin du conteneur
&lt;?php endforeach;                        // endforeach : ferme la boucle d'affichage</pre>
<p><code>&lt;?= ?&gt;</code> est le raccourci de <code>&lt;?php echo ?&gt;</code>. Chaque donnée d'origine utilisateur (auteur, contenu) passe par <code>htmlspecialchars</code> : anti-XSS systématique.</p>

<h3>6. La carte du cours dans un projet</h3>
<div class="tip">Repère chaque leçon à l'œuvre : PDO préparé (19), validation (13), échappement (13), sessions pour l'admin (14), <code>foreach</code> générateur de HTML (6), cas limites, liste d'enregistrements (8). Le projet EST la révision vivante : chaque brique, vue isolément, collabore ici.</div>`,
  exercises: [
    { type: "qcm", q: "Pourquoi découper le livre d'or en 5 étapes avant de coder ?", opts: ["Pour allonger inutilement le code", "La méthode du jour 22/30 : comprendre la structure évite de coder au hasard", "Parce que la syntaxe PHP l'impose", "Pour gérer les imports de fichiers"], a: 1, exp: "Connexion, traiter POST, supprimer, lire, afficher : chaque bloc a sa mission." },
    { type: "qcm", q: "L'INSERT du message utilise…", opts: ["De la concaténation", "Une requête PRÉPARÉE (:a, :c) : anti-injection SQL obligatoire (leçon 19)", "file_put_contents", "$_SESSION"], a: 1, exp: "Toute donnée utilisateur → marqueur préparé. Non négociable." },
    { type: "qcm", q: "Le motif Post-Redirect-Get (header + exit après INSERT) évite…", opts: ["Les injections", "Le DOUBLE envoi : sans lui, F5 réinsère le message", "Le XSS", "La lenteur"], a: 1, exp: "Rediriger transforme le POST en GET : F5 recharge sans réenvoyer." },
    { type: "qcm", q: "<code>&lt;?= $x ?&gt;</code> est le raccourci de…", opts: ["<?php if", "<?php echo $x ?>", "<?php $x", "un commentaire"], a: 1, exp: "Le echo court, roi des templates PHP." },
    { type: "qcm", q: "Chaque auteur et contenu s'affiche via htmlspecialchars parce que…", opts: ["Parce que c'est plus joli à lire", "Ce sont des données utilisateur : anti-XSS systématique (leçon 13)", "Parce que la base de données l'exige", "Pour trier l'affichage des messages"], a: 1, exp: "Un visiteur malveillant a pu injecter du script dans son message." },
    { type: "qcm", q: "ORDER BY date_pub DESC affiche les messages…", opts: ["Par ordre alphabétique", "Du plus RÉCENT au plus ancien : le tri délégué à la base (leçon 18)", "Au hasard", "Par id croissant"], a: 1, exp: "DESC = décroissant : les nouveautés en haut." },
    { type: "qcm", q: "La validation (auteur non vide, < 50, contenu non vide) intervient…", opts: ["Juste après l'INSERT", "AVANT l'INSERT : on n'enregistre que du valide (leçon 13)", "Jamais, ce n'est pas nécessaire", "Au moment du SELECT de lecture"], a: 1, exp: "Le tableau $erreurs garde-fou : count === 0 avant d'écrire." },
    { type: "qcm", q: "La suppression admin exige…", opts: ["Aucun contrôle particulier", "Vérifier $_SESSION[\"admin\"] AVANT le DELETE préparé : contrôle d'accès (leçon 14)", "Un simple cookie de session", "Un lien GET accessible à tous"], a: 1, exp: "Sans contrôle, n'importe qui viderait le livre d'or." },
    { type: "qcm", q: "Le DELETE de suppression doit impérativement…", opts: ["Être un query()", "Avoir un WHERE id = :id préparé : sans WHERE, TOUT est supprimé (leçon 19 !)", "Être en GET", "Utiliser fetchAll"], a: 1, exp: "Le WHERE oublié = catastrophe. Marqueur + WHERE, toujours." },
    { type: "qcm", q: "$messages = $pdo->query(...)->fetchAll(...) retourne…", opts: ["Un seul message", "La liste d'enregistrements (leçon 8) : tableau d'associatifs prêt pour foreach", "Une simple chaîne de texte", "La valeur booléenne true"], a: 1, exp: "La structure que tu connais depuis la leçon 8." },
    { type: "qcm", q: "Où mettre la connexion PDO pour l'utiliser dans plusieurs pages ?", opts: ["La recopier dans chaque page", "Dans db.php, inclus par require_once \"db.php\"; — écrire une fois (jour 20/22)", "La stocker dans la session", "Dans la feuille de style CSS"], a: 1, exp: "Le principe « écrire une fois » appliqué à la config." },
    { type: "qcm", q: "Un visiteur poste un message vide. Grâce à la validation :", opts: ["Il est enregistré tel quel", "$erreurs se remplit, l'INSERT est sauté, un message d'erreur s'affiche : cas limite géré (jour 30)", "Une erreur SQL est levée", "La page plante avec une erreur fatale"], a: 1, exp: "Vide/unité/extrêmes : la check-list veille." },
    { type: "qcm", q: "Le livre d'or réalise quelles lettres de CRUD ?", opts: ["Read seul", "Create (poster) + Read (afficher) + Delete (admin) : trois des quatre", "Update seul", "Aucune"], a: 1, exp: "C, R, D ici ; ajouter l'édition (U) serait l'évolution naturelle." },
    { type: "qcm", q: "Pour tester le livre d'or AVANT d'avoir l'admin, on peut…", opts: ["Attendre d'avoir tout terminé", "Coder et tester le POST + affichage d'abord, ajouter la suppression ensuite : brique par brique (jour 22)", "Tout coder d'un seul bloc", "Sauter l'étape des tests"], a: 1, exp: "Le développement incrémental : un bloc testé, puis le suivant." },
    { type: "qcm", q: "Évolution : « paginer par 10 messages ». Où intervenir ?", opts: ["Un peu partout dans le code", "Dans la requête SELECT : ajouter LIMIT 10 OFFSET … — la base pagine (leçon 18), le reste ne bouge pas", "Dans le formulaire de saisie", "Dans la feuille de style CSS"], a: 1, exp: "Le bon découpage : une évolution = un point touché." }
  ],
  final: {
    title: "Exercice final — Trace d'une session livre d'or",
    intro: `<p>Scénario complet sur le livre d'or déployé :</p>
<pre class="pseudo">1. Ana poste : auteur="Ana", contenu="Super site !"              // cas normal : message valide
2. Un pirate poste : contenu="&lt;script&gt;alert(1)&lt;/script&gt;", auteur=""   // attaque : XSS + auteur vide
3. Ana rafraîchit (F5) après son post                           // test du Post-Redirect-Get
4. L'admin (connecté) supprime le message id=1                  // suppression autorisée
5. Un visiteur non-admin bricole ?delete=2 dans l'URL           // tentative de suppression non autorisée</pre>`,
    questions: [
      { type: "qcm", q: "(1) Le message d'Ana est-il enregistré ?", opts: ["Non, il est rejeté", "Oui : validation OK → INSERT préparé → redirection", "Non, une erreur survient", "Oui, mais enregistré en double"], a: 1, exp: "Le chemin nominal : valider, insérer, rediriger." },
      { type: "qcm", q: "(2) Le message du pirate (auteur vide) :", opts: ["Est enregistré et le script s'exécute", "Est REFUSÉ : auteur vide → $erreurs → pas d'INSERT. Et même enregistré, htmlspecialchars neutraliserait le script à l'affichage", "Détruit toute la base de données", "Contourne le contrôle admin"], a: 1, exp: "Double filet : validation (entrée) + échappement (sortie)." },
      { type: "qcm", q: "(3) Ana fait F5 après son post. Combien de fois son message apparaît-il ?", opts: ["Deux fois", "Une seule : le Post-Redirect-Get a transformé le POST en GET, F5 ne réenvoie rien", "Zéro", "Autant que de F5"], a: 1, exp: "Le PRG protège contre les doublons — un vrai réflexe pro." },
      { type: "qcm", q: "(4) L'admin connecté supprime id=1. Ça marche car…", opts: ["Tout le monde peut", "$_SESSION[\"admin\"] est vrai → DELETE préparé WHERE id = :id exécuté", "Un cookie l'autorise", "Le GET est public"], a: 1, exp: "Contrôle d'accès (leçon 14) + suppression sûre (leçon 19)." },
      { type: "qcm", q: "(5) Le visiteur non-admin met ?delete=2 dans l'URL. Résultat ?", opts: ["Le message 2 est supprimé", "RIEN : le code vérifie $_SESSION[\"admin\"] AVANT tout DELETE — l'URL bricolée est sans effet", "La base est vidée", "Erreur 500"], a: 1, exp: "Ne jamais faire confiance au client : le contrôle est CÔTÉ SERVEUR. La leçon centrale du web." }
    ],
    solution: `<pre class="pseudo">ARCHITECTURE                                       // comment le projet est organisé
db.php     : connexion PDO (require_once)          // la config, écrite une fois
livre.php  : POST→valider→INSERT préparé→redirect (PRG)   // le traitement du formulaire
             + admin?→DELETE préparé WHERE id      // la suppression protégée
             + SELECT DESC→foreach→htmlspecialchars // la lecture et l'affichage sûr

SCÉNARIO                                           // résultat de chaque étape
Ana        → validé, inséré, affiché               // cas normal
Pirate     → refusé (auteur vide) ; script neutralisé de toute façon   // double protection
F5         → PRG : pas de doublon                  // Post-Redirect-Get
Admin      → suppression autorisée                 // session admin OK
?delete=2  → ignoré (contrôle serveur)             // pas admin → refusé

Sept leçons dans une page. Code-le en vrai : c'est ton   // synthèse du cours web
premier logiciel web complet.</pre>
<p>Un livre d'or fonctionnel et sécurisé : bravo. Demain, l'examen final PHP scelle les trois semaines.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton code PHP ici…",
  items: [
  { id: "php-recherche", title: "La recherche dans le livre d'or (PDO + LIKE)", level: 3,
    statement: "Complète le livre d'or : un formulaire GET avec un champ <code>recherche</code>, et l'affichage des seuls messages dont le texte contient le mot cherché — avec une requête <strong>préparée</strong> et <code>LIKE</code>.",
    hints: [
      "Le motif LIKE s'écrit \"%mot%\" : les % remplacent n'importe quoi avant/après.",
      "Le % se place dans la VALEUR, pas dans le SQL : prepare(\"… WHERE texte LIKE ?\") puis execute([\"%\" . $mot . \"%\"]).",
      "Utilise fetchAll() pour compter les résultats avec count() avant de les afficher."
    ],
    atoi: { cmd: "php -l recherche.php", expected: "No syntax errors detected in recherche.php" },
    checklist: [
      "$mot = trim($_GET[\"recherche\"] ?? \"\") et on ne lance la requête que si $mot !== \"\".",
      "Le motif LIKE contient les % dans la VALEUR : execute([\"%\" . $mot . \"%\"]), jamais dans le SQL.",
      "prepare(\"... WHERE texte LIKE ?\") : la saisie ne touche jamais la requête (anti-injection).",
      "Chaque auteur et texte affiché passe par htmlspecialchars (anti-XSS) ; count() donne le nombre de résultats."
    ],
    solution: "<?php                                        // ouvre la zone PHP\n$pdo = new PDO(                              // connexion à la base (voir leçon 19 pour le try/catch)\n    \"mysql:host=localhost;dbname=livredor;charset=utf8mb4\", // serveur + base + encodage\n    \"root\",                                  // utilisateur\n    \"\"                                       // mot de passe\n);                                           // fin de la connexion\n\n$mot = trim($_GET[\"recherche\"] ?? \"\");       // le mot cherché, ou chaîne vide si absent\n\nif ($mot !== \"\") {                           // ne cherche que si un mot a été saisi\n    $stmt = $pdo->prepare(                   // requête PRÉPARÉE : le SQL ne contient jamais la saisie\n        \"SELECT auteur, texte FROM messages WHERE texte LIKE ?\" // ? = emplacement du motif\n    );                                       // fin du prepare\n    $stmt->execute([\"%\" . $mot . \"%\"]);      // les % entourent le mot DANS LA VALEUR, pas dans le SQL\n    $resultats = $stmt->fetchAll();          // récupère toutes les lignes dans un tableau\n\n    echo \"<p>\" . count($resultats) . \" résultat(s)</p>\"; // compte les lignes trouvées\n    foreach ($resultats as $ligne) {         // parcourt les résultats\n        $a = htmlspecialchars($ligne[\"auteur\"]); // sécurise l'auteur (anti-XSS)\n        $t = htmlspecialchars($ligne[\"texte\"]);  // sécurise le texte\n        echo \"<p><strong>$a</strong> : $t</p>\";  // affichage sécurisé\n    }                                        // fin du parcours\n}                                            // fin du bloc de recherche\n?>\n<form method=\"get\">                          <!-- GET : le mot apparaît dans l'URL (partageable) -->\n    <input type=\"text\" name=\"recherche\" placeholder=\"Mot à chercher\"> <!-- name = clé dans $_GET -->\n    <button type=\"submit\">Chercher</button>  <!-- déclenche la recherche -->\n</form>",
    note: "Mettre les % dans le SQL avec la variable serait une injection SQL ouverte — toujours via execute()." }
  ]
};
</script>
