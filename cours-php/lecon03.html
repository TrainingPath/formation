<script>
var DAY = {
  num: 3,
  title: "Opérateurs : == contre ===",
  subtitle: "Calculs, comparaisons, et le jonglage de types à apprivoiser.",
  theory: `
<h3>1. Arithmétique : presque comme partout</h3>
<p>Un <strong>opérateur</strong> est un symbole qui effectue une opération sur des valeurs (les additionner, les comparer…). Commençons par les opérateurs de calcul.</p>
<pre class="pseudo">PSEUDOCODE      PHP                                // à gauche le pseudocode, à droite l'écriture PHP
+ - *           + - *                          // addition, soustraction, multiplication
/               /            // 7 / 2 → 3.5    // VRAIE division : rend un float (nombre à virgule) si besoin, contrairement à Java !
DIV             intdiv(7,2)  // → 3            // division ENTIÈRE explicite : on jette la partie après la virgule
MOD             %            // 7 % 2 → 1      // modulo : le RESTE d'une division (7 = 3×2 + 1, reste 1)
puissance       2 ** 10      // → 1024         // ** = puissance (2 à la puissance 10)</pre>
<p>Bonne nouvelle : <code>/</code> rend un float si nécessaire — pas de piège de division entière comme en Java. Raccourcis identiques : <code>+=</code>, <code>-=</code>, <code>*=</code>, <code>++</code>, <code>--</code>, et <code>.=</code> pour concaténer-accumuler du texte (coller à la suite).</p>

<h3>2. Le jonglage de types (type juggling)</h3>
<p>Comme les variables PHP n'ont pas de type fixe, PHP <strong>convertit automatiquement</strong> une valeur selon le contexte de l'opérateur — on appelle ça le « jonglage de types ».</p>
<pre class="pseudo">"5" + 3        → 8       // le + veut des nombres : la string "5" est convertie en nombre 5, donc 5 + 3 = 8
"5" . 3        → "53"    // le . veut du texte : le nombre 3 est converti en string "3", collé après "5"
"abc" + 3      → ERREUR  // "abc" n'est pas convertible en nombre → TypeError depuis PHP 8</pre>
<div class="warn">Le <code>+</code> de PHP additionne TOUJOURS (jamais de concaténation, contrairement à Java/JS). Le <code>.</code> concatène toujours. Deux opérateurs, deux métiers : aucune ambiguïté… si tu ne les confonds pas !</div>

<h3>3. == contre === : LA leçon du jour</h3>
<pre class="pseudo">==   égalité SOUPLE  : convertit les types avant de comparer   // deux signes égal : compare « à peu près »
===  égalité STRICTE : exige valeurs ET types identiques       // trois signes égal : compare « exactement »

5 == "5"       → true    // souple : la string "5" devient le nombre 5, donc 5 == 5
5 === "5"      → false   // strict : types différents (int vs string) → refusé
0 == false     → true    // souple : 0 et false sont jugés « équivalents » (!)
0 === false    → false   // strict : types différents (int vs bool)
"" == false    → true    // souple : la chaîne vide vaut « faux » (!)</pre>
<div class="tip">Règle d'or professionnelle : utilise <strong>===</strong> (et <code>!==</code>) par défaut. Le <code>==</code> souple crée des bugs légendaires (« pourquoi 0 est-il égal à false ?! »). Le <code>===</code> dit exactement ce qu'il compare : même valeur ET même type.</div>

<h3>4. Le « truthy / falsy »</h3>
<p>Dans un <code>if</code> (un test), PHP convertit toute valeur en booléen (vrai/faux). Sont considérés comme FAUX (« falsy ») : <code>false</code>, <code>0</code>, <code>0.0</code>, <code>""</code> (chaîne vide), <code>"0"</code>, <code>[]</code> (tableau vide), <code>null</code>. Tout le reste est VRAI (« truthy ») — même la chaîne <code>"false"</code> (non vide) ou <code>-1</code> ! Connaître cette liste évite bien des surprises.</p>

<h3>5. Logique : identique au pseudocode</h3>
<p>Les <strong>opérateurs logiques</strong> combinent des conditions vraies/fausses.</p>
<pre class="pseudo">ET  →  &amp;&amp;      OU  →  ||      NON  →  !          // ET = les deux vraies ; OU = au moins une vraie ; NON = inverse
$ok = ($age &gt;= 18) &amp;&amp; $aPermis;   // $ok est vrai seulement si $age ≥ 18 ET $aPermis est vrai</pre>

<h3>6. Les fonctions maths natives</h3>
<p>Une <strong>fonction native</strong> est un outil déjà fourni par PHP, prêt à l'emploi.</p>
<pre class="pseudo">abs(-5) → 5 · max(3, 8) → 8 · min(3, 8) → 3            // abs = valeur absolue ; max = le plus grand ; min = le plus petit
round(5.7) → 6 · floor(5.9) → 5 · ceil(5.1) → 6        // round = arrondi au plus proche ; floor = vers le bas ; ceil = vers le haut
sqrt(16) → 4 · rand(1, 6) → un dé ! (bornes INCLUSES)  // sqrt = racine carrée ; rand = entier aléatoire de 1 à 6 inclus</pre>
<p>Remarque : <code>rand(1, 6)</code> inclut les DEUX bornes — plus simple que le <code>nextInt(6)+1</code> de Java !</p>
<h3>Inverser une condition proprement — les lois de De Morgan</h3>
<p>Pour obtenir le CONTRAIRE d'une condition composée, on ne peut pas juste coller un <code>!</code> devant sans réfléchir. Les <strong>lois de De Morgan</strong> disent comment le NON « rentre » dans la parenthèse : il inverse chaque morceau ET échange <code>&amp;&amp;</code> (ET) avec <code>||</code> (OU).</p>
<pre class="pseudo">!(\$a &amp;&amp; \$b)      // NON (A ET B)...
  =  !\$a || !\$b     // ...devient (NON A) OU (NON B)
!(\$a || \$b)      // NON (A OU B)...
  =  !\$a &amp;&amp; !\$b     // ...devient (NON A) ET (NON B)</pre>
<p>Exemple : l'inverse de « la note est valide » <code>\$note &gt;= 0 &amp;&amp; \$note &lt;= 20</code> n'est PAS <code>\$note &gt;= 0 || \$note &lt;= 20</code>, mais <code>\$note &lt; 0 || \$note &gt; 20</code> (« en dessous de 0 OU au-dessus de 20 »). Chaque comparaison s'inverse, et le ET devient OU.</p>`,
  exercises: [
    { type: "qcm", q: "Que vaut <code>7 / 2</code> en PHP ?", opts: ["3 comme en Java", "3.5 : la division PHP est une VRAIE division", "4", "Erreur"], a: 1, exp: "Différence majeure avec Java : pas de piège de division entière." },
    { type: "qcm", q: "Comment obtenir le quotient ENTIER de 7 par 2 ?", opts: ["7 / 2", "intdiv(7, 2) → 3", "7 % 2", "7 // 2"], a: 1, exp: "intdiv = le DIV du pseudocode." },
    { type: "input", q: "Que vaut <code>17 % 5</code> ?", a: "2", ph: "nombre", exp: "Le MOD : reste 2, comme partout." },
    { type: "qcm", q: "Que vaut <code>\"5\" + 3</code> ?", opts: ["\"53\"", "8 : le + PHP additionne TOUJOURS, la string est convertie", "Erreur", "53"], a: 1, exp: "En Java, \"5\" + 3 donnait \"53\" ! En PHP, la concaténation c'est le point." },
    { type: "qcm", q: "Que vaut <code>\"5\" . 3</code> ?", opts: ["8 (comme une addition)", "\"53\" : le point concatène toujours", "Une erreur de type", "\"5.3\" (avec le point conservé)"], a: 1, exp: "Deux opérateurs, deux métiers, zéro ambiguïté." },
    { type: "qcm", q: "Que vaut <code>5 == \"5\"</code> ?", opts: ["true : le == convertit les types avant de comparer", "false"], a: 0, exp: "L'égalité SOUPLE ignore la différence int/string." },
    { type: "qcm", q: "Que vaut <code>5 === \"5\"</code> ?", opts: ["true", "false : types différents, le === est STRICT"], a: 1, exp: "Valeur ET type doivent coïncider." },
    { type: "qcm", q: "Que vaut <code>0 == false</code> ?", opts: ["true — et c'est exactement pourquoi les pros préfèrent ===", "false"], a: 0, exp: "Le jonglage rend 0 « équivalent » à false : source de bugs célèbres." },
    { type: "qcm", q: "Quelle comparaison utiliser par défaut ?", opts: ["==, plus tolérante", "=== (et !==) : stricte, prévisible, professionnelle", "=", "<>"], a: 1, exp: "La règle d'or PHP." },
    { type: "qcm", q: "Dans un if, la string <code>\"0\"</code> est considérée…", opts: ["Vraie", "FAUSSE : \"0\" fait partie des valeurs falsy de PHP (piège unique à PHP !)", "Erreur", "Nulle"], a: 1, exp: "false, 0, \"\", \"0\", [], null : la liste falsy à connaître." },
    { type: "qcm", q: "Et la string <code>\"false\"</code> dans un if ?", opts: ["Fausse évidemment", "VRAIE : c'est une chaîne non vide (et différente de \"0\") !", "Erreur", "Nulle"], a: 1, exp: "Le mot « false » n'est pas le booléen false : vicieux mais logique." },
    { type: "input", q: "$x = 5; $x += 3; $x **= 2; Que vaut $x ? (** = puissance)", a: "64", ph: "nombre", exp: "8 puis 8² = 64." },
    { type: "input", q: "Que vaut <code>max(4, abs(-9))</code> ?", a: "9", ph: "nombre", exp: "abs(-9) = 9, max(4, 9) = 9 : composition, comme en Java." },
    { type: "qcm", q: "<code>rand(1, 6)</code> tire…", opts: ["0 à 5", "1 à 6, bornes INCLUSES : plus simple que Java !", "1 à 5", "0 à 6"], a: 1, exp: "PHP inclut les deux bornes : le dé s'écrit naturellement." },
    { type: "qcm", q: "$s = \"total : \"; $s .= 42; Que contient $s ?", opts: ["42 seulement (l'ancien texte est perdu)", "\"total : 42\" : .= est l'accumulateur de chaîne (jour 19 d'algo !)", "\"total : \" (inchangé, le 42 est ignoré)", "Une erreur car on colle un nombre à du texte"], a: 1, exp: "Le .= concatène-affecte : le motif d'accumulation textuelle." }
  ],
  final: {
    title: "Exercice final — La caisse du cinéma (version PHP)",
    intro: `<p>Troisième traduction de la caisse (jour 4 d'algo, leçon 3 Java) :</p>
<pre class="pseudo">&lt;?php                                    // ouvre la zone PHP
$budget = 45;                            // argent disponible, en euros
$prix = 8;                               // prix d'une place
$nbPlaces = intdiv($budget, $prix);      // division ENTIÈRE : combien de places entières on peut payer
$reste = $budget % $prix;                // modulo : l'argent qui reste après l'achat
$complet = ($reste === 0);               // === strict : $complet est vrai seulement si le reste vaut exactement 0
$moyenne = $budget / $prix;              // vraie division : peut donner un nombre à virgule
echo "$nbPlaces places, reste $reste €"; // guillemets doubles : les variables sont interpolées
?&gt;                                       // ferme la zone PHP</pre>`,
    questions: [
      { type: "input", q: "Que vaut $nbPlaces ?", a: "5", ph: "nombre", exp: "intdiv(45, 8) = 5 : en PHP il faut DEMANDER la division entière." },
      { type: "input", q: "Que vaut $reste ?", a: "5", ph: "nombre", exp: "45 % 8 = 5." },
      { type: "qcm", q: "Que vaut $complet ?", opts: ["true (le reste est bien nul)", "false : 5 === 0 est faux", "null, car le reste n'est pas défini", "la chaîne \"false\""], a: 1, exp: "Comparaison stricte, résultat net." },
      { type: "input", q: "Que vaut $moyenne ? (contrairement à Java, PAS de cast nécessaire !)", a: ["5.625", "5,625"], ph: "nombre", exp: "45 / 8 = 5.625 directement : la division PHP est réelle." },
      { type: "qcm", q: "Si on avait testé <code>$reste == \"0\"</code> avec $reste = 0 :", opts: ["false", "true : le == convertit \"0\" en 0 — ça « marche » mais par accident ; === aurait exigé les bons types", "Erreur", "null"], a: 1, exp: "Le == qui marche par accident aujourd'hui casse demain : ===, toujours." }
    ],
    solution: `<pre class="pseudo">intdiv(45, 8) → 5        // le DIV explicite (division entière)
45 % 8        → 5        // le modulo : le reste
5 === 0       → false    // strict : compare types + valeurs
45 / 8        → 5.625    // vraie division, aucun cast nécessaire

Différences mémorisées vs Java :          // ce que PHP fait différemment de Java
/ réel natif · intdiv pour DIV · . pour concaténer   // division, division entière, concaténation
· === par défaut · rand(min, max) bornes incluses    // comparaison stricte, aléatoire bornes incluses</pre>
<p>Même algorithme, troisième dialecte. Les différences tiennent sur une fiche — la logique, elle, n'a pas bougé d'un iota.</p>`
  }
