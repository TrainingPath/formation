<script>
var DAY = {
  num: 5,
  title: "Conditions : if, elseif, match",
  subtitle: "Les jours 6-7 d'algorithmique, saveur PHP.",
  theory: `
<h3>1. if / else : comme partout (ou presque)</h3>
<p>Une <strong>condition</strong> permet de CHOISIR quelles instructions exécuter selon la situation : « si… alors… sinon… ». C'est un aiguillage : selon la réponse (vrai ou faux) à une question, le programme prend un chemin ou un autre.</p>
<pre class="pseudo">if ($note &gt;= 10) {          // SI : la question (condition) est entre parenthèses ; ici « $note est-elle ≥ 10 ? »
    echo "Réussi";          // exécuté SEULEMENT si la condition est vraie
} else {                    // SINON (accolade fermante du if, puis else)
    echo "Échoué";          // exécuté seulement si la condition est fausse
}                           // accolade fermante du else : fin de la structure</pre>
<p>Parenthèses + accolades : identique à Java. La cascade s'écrit <code>elseif</code> (en un mot) ou <code>else if</code> :</p>
<pre class="pseudo">if ($note &gt;= 16) {          // 1er test ; si vrai, on exécute cette branche et on s'arrête là
    echo "Très bien";       // affiché si $note ≥ 16
} elseif ($note &gt;= 12) {    // SINON SI : testé seulement si le test précédent était faux
    echo "Bien";            // affiché si 12 ≤ $note < 16
} else {                    // SINON : aucun seuil atteint
    echo "Peut mieux faire";// affiché si $note < 12
}                           // fin de la cascade</pre>
<p>Dès qu'un test est vrai, sa branche s'exécute et les autres sont ignorées : l'ordre des seuils compte (du plus haut au plus bas).</p>

<h3>2. Le réflexe === dans les conditions</h3>
<pre class="pseudo">if ($choix === "oui")     // STRICT : compare valeur ET type — le réflexe professionnel
if ($_GET["page"] == 0)   // SOUPLE : dangereux, "abc" == 0 pouvait valoir true en vieux PHP !</pre>
<p>Comme vu à la leçon 3, préfère <code>===</code> dans tes conditions : il évite les surprises du jonglage de types.</p>

<h3>3. L'opérateur ternaire et le null coalescing</h3>
<pre class="pseudo">$statut = ($age &gt;= 18) ? "majeur" : "mineur";   // ternaire : (condition) ? valeur_si_vrai : valeur_si_faux
$pseudo = $saisie ?? "invité";     // ?? : prend $saisie si elle existe et n'est pas null,
                                    //      sinon "invité" — parfait pour les valeurs de formulaire absentes !</pre>
<p>Le <strong>ternaire</strong> condense un if/else en une expression qui produit une valeur. Le <strong>null coalescing</strong> <code>??</code> (« fusion de nul ») fournit une valeur de repli sans planter si la variable n'existe pas.</p>

<h3>4. match : le switch moderne (PHP 8)</h3>
<pre class="pseudo">// Ancien switch (comme Java, avec break) :
switch ($jour) {                    // examine la valeur de $jour
    case 1: echo "Lundi"; break;    // CAS où $jour vaut 1 : affiche « Lundi » ; break SORT du switch
    case 2: echo "Mardi"; break;    // CAS où $jour vaut 2 : sans break, on déborderait sur le case suivant
    default: echo "?";              // cas par défaut : aucune valeur ci-dessus ne correspond
}                                   // fin du switch
// match : plus court, STRICT (===), sans break, et RETOURNE une valeur !
$nom = match($jour) {               // match(...) produit directement une valeur rangée dans $nom
    1 =&gt; "Lundi",                   // si $jour vaut 1 (comparaison ===) → "Lundi"
    2 =&gt; "Mardi",                   // si $jour vaut 2 → "Mardi"
    6, 7 =&gt; "Week-end !",           // plusieurs valeurs (6 OU 7) pour une même branche
    default =&gt; "?"                  // le cas par défaut, si rien d'autre ne correspond
};                                  // le ; termine l'affectation de $nom</pre>
<div class="tip"><code>match</code> compare en <code>===</code> (le <code>switch</code> en <code>==</code>), n'a pas de fall-through (aucun break oublié possible) et RETOURNE une valeur directement affectable. Préfère <code>match</code> dès que possible.</div>

<h3>5. Piège falsy dans les if (rappel leçon 3)</h3>
<pre class="pseudo">$panier = "0";                    // une string contenant le caractère "0"
if ($panier) { /* ... */ }        // FAUX ! "0" fait partie des valeurs falsy de PHP → le bloc NE s'exécute PAS
if ($panier !== "") { /* ... */ } // explicite : on teste précisément « non vide » → plus sûr</pre>

<h3>6. Condition dans le HTML : la syntaxe alternative</h3>
<pre class="pseudo">&lt;?php if ($connecte): ?&gt;         // le deux-points : remplace l'accolade ouvrante {
    &lt;p&gt;Bienvenue !&lt;/p&gt;            // du HTML pur, affiché seulement si $connecte est vrai
&lt;?php else: ?&gt;                    // le sinon, toujours avec un deux-points
    &lt;p&gt;Connecte-toi.&lt;/p&gt;          // HTML affiché sinon
&lt;?php endif; ?&gt;                   // endif; ferme le bloc (remplace l'accolade fermante })</pre>
<p>Les <code>: … endif;</code> remplacent les accolades quand on tisse PHP et HTML : c'est plus lisible dans une page web que des accolades noyées dans le HTML — et on retrouve nos FINSI du pseudocode !</p>`,
  exercises: [
    { type: "qcm", q: "La cascade PHP s'écrit…", opts: ["elif", "elseif (ou else if) { … }", "case", "sinon si"], a: 1, exp: "La cascade du jour 7, en un mot." },
    { type: "qcm", q: "$note = 14 dans la cascade 16/12 de la théorie : affichage ?", opts: ["Très bien", "Bien", "Peut mieux faire", "Rien"], a: 1, exp: "14 >= 16 faux, 14 >= 12 vrai : la logique du jour 7, inchangée." },
    { type: "qcm", q: "Quelle comparaison privilégier dans un if PHP ?", opts: ["==", "=== : stricte et prévisible (leçon 3)", "=", "<>"], a: 1, exp: "Le réflexe qui évite le club des bugs de jonglage." },
    { type: "qcm", q: "$statut = ($age >= 18) ? \"majeur\" : \"mineur\"; est…", opts: ["Une boucle", "L'opérateur TERNAIRE : un if/else qui produit une valeur", "Un match", "Une erreur"], a: 1, exp: "condition ? siVrai : siFaux — comme en Java." },
    { type: "qcm", q: "Que fait <code>$pseudo = $saisie ?? \"invité\";</code> ?", opts: ["Compare deux fois", "Prend $saisie si elle existe (non-null), sinon \"invité\" : le null coalescing", "Concatène", "Erreur"], a: 1, exp: "L'ami des formulaires : une valeur par défaut en un clin d'œil." },
    { type: "qcm", q: "match compare avec…", opts: ["== comme switch", "=== : strict, un avantage majeur sur switch", "<=>", "="], a: 1, exp: "match(0) ne matchera jamais \"0\" : prévisible." },
    { type: "qcm", q: "Dans un match, le break est…", opts: ["Obligatoire", "INEXISTANT : chaque branche est isolée, aucun fall-through possible", "Optionnel", "Remplacé par continue"], a: 1, exp: "Le piège du switch Java (leçon 5 Java !) est aboli par conception." },
    { type: "qcm", q: "$n = match(7) { 6, 7 => \"week-end\", default => \"semaine\" }; Que vaut $n ?", opts: ["semaine", "week-end : 7 figure dans la branche à valeurs multiples", "7", "Erreur"], a: 1, exp: "Plusieurs valeurs par branche : compact et lisible." },
    { type: "qcm", q: "match SANS default reçoit une valeur non prévue :", opts: ["Retourne null", "UnhandledMatchError : match exige l'exhaustivité — encore une sécurité", "Retourne 0", "Passe"], a: 1, exp: "switch laissait passer en silence ; match t'oblige à tout couvrir." },
    { type: "qcm", q: "$panier = \"0\"; if ($panier) { … } : le bloc s'exécute-t-il ?", opts: ["Oui, \"0\" est une chaîne non vide", "Non : \"0\" est falsy en PHP — le piège de la leçon 3 en embuscade", "Il déclenche une erreur de type", "Seulement si $panier vaut \"1\""], a: 1, exp: "Toujours expliciter : if ($panier !== \"\")." },
    { type: "qcm", q: "La syntaxe <code>if (…): … endif;</code> sert surtout…", opts: ["À masquer le code PHP au visiteur", "À tisser PHP et HTML lisiblement dans les pages (le retour de nos FINSI !)", "À exécuter le PHP plus rapidement", "Aux boucles uniquement, jamais aux conditions"], a: 1, exp: "Dans un template mêlé de HTML, les accolades se perdent ; endif se voit." },
    { type: "qcm", q: "Traduire « age entre 12 et 17 inclus » :", opts: ["12 <= $age <= 17", "$age >= 12 && $age <= 17", "$age == 12-17", "$age in 12..17"], a: 1, exp: "L'encadrement éternel du jour 8 : deux comparaisons, un &&." },
    { type: "qcm", q: "$x = 0; if ($x > 0) {A} elseif ($x < 0) {B} else {C} → quel bloc ?", opts: ["A", "B", "C : zéro, le cas restant", "Les trois blocs à la suite"], a: 2, exp: "Le SINON attrape-tout du jour 7." },
    { type: "qcm", q: "Avantage de match sur switch pour affecter une variable :", opts: ["Il n'y a aucun avantage particulier", "match RETOURNE une valeur : $x = match(...) — le switch obligeait à affecter dans chaque case", "match s'écrit toujours en plus de lignes", "switch retourne aussi une valeur directement"], a: 1, exp: "Une expression plutôt qu'une suite d'instructions : moins de répétition." },
    { type: "qcm", q: "if ($age >= 18): … endif; — que remplace le duo : / endif ?", opts: ["Les parenthèses de la condition", "Les accolades { } de la syntaxe classique", "Le point-virgule final", "Le mot-clé if lui-même"], a: 1, exp: "Deux styles pour le même bloc ; en fichier mêlé de HTML, endif gagne en clarté." }
  ],
  final: {
    title: "Exercice final — Le tarif du musée (version PHP + match)",
    intro: `<p>Le grand final du jour 7, TROISIÈME traduction — avec un bonus match :</p>
<pre class="pseudo">$age = 15;                        // l'âge du visiteur
$mercredi = true;                 // est-on mercredi ? (tarif réduit ce jour-là)
if ($age < 6) {                   // moins de 6 ans
    $prix = 0;                    // gratuit
} elseif ($age < 18) {            // sinon, de 6 à 17 ans
    $prix = $mercredi ? 3 : 5;    // ternaire : 3 € le mercredi, sinon 5 €
} elseif ($age < 65) {            // sinon, de 18 à 64 ans
    $prix = 12;                   // plein tarif
} else {                          // sinon, 65 ans et plus
    $prix = 8;                    // tarif senior
}                                 // fin de la cascade de prix
$categorie = match(true) {        // match(true) : la 1re branche dont la condition est vraie gagne
    $age < 6  => "petit",         // si $age < 6
    $age < 18 => "jeune",         // sinon si $age < 18
    $age < 65 => "adulte",        // sinon si $age < 65
    default   => "senior"         // sinon (65 et +)
};                                // le ; termine l'affectation de $categorie
echo "$categorie : $prix €";      // affiche la catégorie et le prix (variables interpolées)</pre>`,
    questions: [
      { type: "input", q: "age = 15, mercredi = true : quel $prix ?", a: "3", ph: "nombre", exp: "Tranche 6-17 + ternaire mercredi : 3 €. Le if imbriqué du jour 7 tient en UNE ligne de ternaire." },
      { type: "qcm", q: "Le ternaire <code>$mercredi ? 3 : 5</code> remplace…", opts: ["Un match", "Le if/else IMBRIQUÉ de la version pseudocode et Java : même logique, format expression", "Une boucle", "Un « ou »"], a: 1, exp: "Trois langages, trois formes, une seule idée." },
      { type: "qcm", q: "L'astuce <code>match(true)</code> compare true à chaque condition. Elle permet…", opts: ["De comparer uniquement des chaînes de texte", "Des INTERVALLES dans un match (normalement limité aux égalités) : chaque branche est un test booléen", "D'éviter d'écrire une branche default", "De trier les branches automatiquement"], a: 1, exp: "La branche dont la condition vaut true gagne : une cascade déguisée en match." },
      { type: "input", q: "Que vaut $categorie pour age = 15 ?", a: ["jeune"], ph: "texte", exp: "6 <= 15 < 18 : jeune. L'ordre des branches = l'ordre de la cascade (jour 7 !)." },
      { type: "qcm", q: "Dans match(true), on inverse les deux premières branches ($age < 18 avant $age < 6). Conséquence pour un enfant de 4 ans ?", opts: ["Aucune", "Il devient « jeune » : 4 < 18 gagne en premier — l'ordre des seuils, LA leçon du jour 7, vaut aussi pour match", "Erreur", "petit quand même"], a: 1, exp: "Peu importe le langage ou la structure : du plus exigeant au moins exigeant." }
    ],
    solution: `<pre class="pseudo">age=15, mercredi=true                          // les données de départ
Cascade : 15<6 non → 15<18 OUI → ternaire → prix = 3   // 2e palier atteint, mercredi → 3 €
match(true) : 15<6 non → 15<18 OUI → "jeune"           // même ordre, 2e branche vraie → "jeune"
Affiche : jeune : 3 €                          // résultat final

Bilan des trois versions du musée :            // la même logique dans 3 syntaxes
Pseudocode (j7)  : SI/SINON SI + SI imbriqué   // version algo
Java (l5)        : if/else if + if imbriqué    // version Java
PHP (l5)         : if/elseif + ternaire + match(true)   // version PHP</pre>
<p>Le même algorithme respire dans trois syntaxes. Demain : les boucles PHP, et l'irremplaçable foreach.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  items: [
  { id: "php-cinema", title: "Le tarif du cinéma", level: 1,
    statement: "Une variable <code>$age</code> contient un âge. Affiche le tarif : <strong>&lt; 12 ans</strong> → 5 €, <strong>12–17</strong> → 7 €, <strong>18–64</strong> → 10 €, <strong>65 et +</strong> → 8 €.",
    hints: [
      "Quatre cas exclusifs → if / elseif / elseif / else.",

    atoi: { cmd: "php script.php", expected: "Tarif : 10 €" },
    checklist: [
      "Les paliers sont testés dans l'ordre croissant (< 12, puis < 18, puis < 65, puis else).",

      "Avec $age = 30, la branche $age < 65 est atteinte, donc $tarif vaut 10."
    ],
    note: "En PHP, elseif s'écrit en un mot." },
  { id: "php-plusgrand3", title: "Le plus grand de trois", level: 1,
    statement: "Trois variables <code>$a</code>, <code>$b</code>, <code>$c</code> contiennent des nombres. Affiche le plus grand des trois.",
    hints: [
      "Pars du principe que le premier est le plus grand, puis remets l'hypothèse en question avec deux if.",
      "$max = $a; if ($b > $max) $max = $b; if ($c > $max) $max = $c;",
      "Version experte : max($a, $b, $c) — la fonction native accepte plusieurs arguments !"
    ],
    solution: "<?php                            // ouvre la zone PHP\n$a = 14;                         // première valeur\n$b = 27;                         // deuxième valeur\n$c = 9;                          // troisième valeur\n\n$max = $a;                       // hypothèse : $a est le plus grand\nif ($b > $max) {                 // $b dépasse-t-il le max actuel ?\n    $max = $b;                   // oui → $b devient le nouveau max\n}                                // fin du test sur $b\nif ($c > $max) {                 // $c dépasse-t-il le max actuel ?\n    $max = $c;                   // oui → $c devient le nouveau max\n}                                // fin du test sur $c\n\necho \"Le plus grand : $max\";     // affiche : 27\n?>",
    atoi: { cmd: "php script.php", expected: "Le plus grand : 27" },
    checklist: [
      "$max part de $a, puis deux if le remettent en question (avec $b puis $c).",
      "Chaque comparaison utilise > pour ne remplacer $max que si c'est réellement plus grand.",
      "Le résultat affiché est bien le maximum des trois (27 avec 14, 27, 9).",
      "Un seul echo final affiche $max, pas un affichage dans chaque if."

    note: "max($a, $b, $c) fait pareil en une ligne (leçon 10), mais il faut savoir l'écrire soi-même d'abord." }
  ]
};
