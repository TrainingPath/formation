<script>
var DAY = {
  num: 25,
  title: "Le réseau en ligne de commande (ping, curl, ssh)",
  subtitle: "Tester une connexion, télécharger une ressource, se connecter à distance.",
  theory: `
<h3>1. Trois besoins réseau très courants</h3>
<p>En ligne de commande, on croise sans cesse trois questions. « Est-ce que ça répond ? » -> <strong>ping</strong>. « Récupère-moi cette page/ce fichier » -> <strong>curl</strong> (ou <strong>wget</strong>). « Ouvre-moi un terminal sur une machine distante » -> <strong>ssh</strong>. Ce sont les outils de base pour diagnostiquer et travailler à distance.</p>
<div class="tip">Une adresse comme <code>exemple.com</code> est un <strong>nom de domaine</strong>. Le réseau le traduit en <strong>adresse IP</strong> (ex. 93.184.x.x) pour joindre la machine. Beaucoup d'outils réseau acceptent l'un ou l'autre.</div>

<h3>2. ping : est-ce que ça répond ?</h3>
<p><code>ping</code> envoie de petits paquets et mesure le temps de réponse. C'est le premier réflexe de diagnostic : si ça « pingue », la machine est joignable.</p>
<pre class="pseudo"># --- Bash (Linux / macOS) ---
ping google.com          # envoie des paquets EN CONTINU (Ctrl+C pour arreter)
ping -c 4 google.com     # -c 4 = seulement 4 essais puis stop</pre>
<pre class="pseudo"># --- PowerShell (Windows) ---
ping google.com          # sous Windows, ping envoie 4 paquets PUIS s'arrete
Test-Connection google.com   # equivalent PowerShell, renvoie des objets</pre>
<pre class="pseudo"># --- CMD (Windows) ---
ping google.com          REM 4 paquets par defaut
ping -t google.com       REM -t = en continu (Ctrl+C pour arreter)</pre>
<div class="warn">Différence de comportement : sous Linux <code>ping</code> tourne <strong>en continu</strong> (on ajoute <code>-c 4</code> pour limiter) ; sous Windows il s'arrête après <strong>4 paquets</strong> (on ajoute <code>-t</code> pour le continu). Même nom, réglage inverse.</div>

<h3>3. curl : récupérer une ressource web</h3>
<pre class="pseudo"># --- Bash / PowerShell / CMD (curl est present partout de nos jours) ---
curl https://exemple.com               # affiche le contenu de la page a l'ecran
curl -o page.html https://exemple.com  # -o : ENREGISTRE dans un fichier
curl -O https://exemple.com/fichier.zip # -O : garde le nom d'origine du fichier
curl -I https://exemple.com            # -I : seulement les EN-TETES (statut, type...)</pre>
<pre class="pseudo"># --- Alternative Bash : wget ---
wget https://exemple.com/fichier.zip   # telecharge directement dans un fichier</pre>
<div class="tip"><code>curl</code> est un couteau suisse du web en ligne de commande : tester une API, télécharger un fichier, vérifier qu'un site répond. Il est aujourd'hui inclus dans Windows, macOS et Linux. Attention : en PowerShell, <code>curl</code> peut être un alias de <code>Invoke-WebRequest</code> ; on écrit <code>curl.exe</code> pour le vrai curl.</div>

<h3>4. ssh : un terminal sur une machine distante</h3>
<p><strong>ssh</strong> (Secure SHell) ouvre une session de terminal <strong>chiffrée</strong> sur un serveur distant : tu tapes tes commandes chez toi, elles s'exécutent là-bas.</p>
<pre class="pseudo"># --- Bash / PowerShell / CMD (ssh est integre partout) ---
ssh alice@serveur.com          # se connecter comme "alice" sur serveur.com
ssh -p 2222 alice@serveur.com  # -p : port different du 22 par defaut
# une fois connecte, on tape ses commandes ; "exit" pour se deconnecter</pre>
<pre class="pseudo"># --- Copier un fichier a distance : scp (base sur ssh) ---
scp fichier.txt alice@serveur.com:/home/alice/   # envoyer un fichier vers le serveur
scp alice@serveur.com:/home/alice/log.txt .      # recuperer un fichier depuis le serveur</pre>
<div class="warn">La première connexion ssh demande de confirmer l'empreinte du serveur (« Are you sure... yes »). C'est normal : le client mémorise l'identité du serveur pour détecter une usurpation future. Ne réponds « yes » que si tu es sûr de te connecter à la bonne machine.</div>

<h3>5. Deux commandes d'inspection utiles</h3>
<pre class="pseudo"># --- Voir sa configuration reseau ---
ip addr        # Linux : adresses IP des interfaces (ancien : ifconfig)
ipconfig       # Windows (CMD/PowerShell) : configuration IP

# --- Resoudre un nom de domaine en IP ---
nslookup exemple.com    # (Linux et Windows) traduit un nom en adresse IP</pre>

<h3>6. Récapitulatif</h3>
<pre class="pseudo"># Tester une connexion  : ping -c 4 host (Unix) | ping host (Windows, 4 par defaut)
# Telecharger           : curl -O url  |  curl -o fichier url  |  wget url
# En-tetes / statut     : curl -I url
# Terminal distant      : ssh user@host
# Copier a distance      : scp fichier user@host:/chemin
# Config reseau locale   : ip addr (Linux) | ipconfig (Windows)</pre>`,
  exercises: [
    { type: "qcm", q: "À quoi sert <code>ping</code> ?", opts: ["À télécharger un fichier", "À tester si une machine répond et mesurer le temps de réponse", "À ouvrir un terminal distant", "À compresser des données"], a: 1, exp: "ping vérifie la joignabilité d'une machine et mesure la latence." },
    { type: "input", q: "Bash : envoie exactement 4 paquets ping vers google.com puis arrête (option -c).", a: ["ping -c 4 google.com"], ph: "ping -c 4 …", exp: "-c 4 limite ping à 4 paquets sous Linux/macOS." },
    { type: "vf", q: "Sous Linux, <code>ping</code> s'arrête tout seul après 4 paquets, comme sous Windows.", a: false, exp: "Faux : sous Linux ping tourne en continu (Ctrl+C ou -c pour limiter) ; sous Windows il s'arrête après 4." },
    { type: "qcm", q: "Sous CMD, quelle option fait pinguer EN CONTINU ?", opts: ["-c", "-t", "-loop", "-f"], a: 1, exp: "ping -t (Windows) envoie des paquets en continu jusqu'à Ctrl+C." },
    { type: "qcm", q: "À quoi sert <code>curl</code> ?", opts: ["À supprimer des fichiers", "À récupérer/transférer des ressources web (pages, fichiers, API)", "À gérer les processus", "À compresser"], a: 1, exp: "curl télécharge et transfère des données depuis/vers une URL." },
    { type: "input", q: "Ligne de commande : télécharge https://exemple.com/data.zip en gardant son nom d'origine (option -O majuscule).", a: ["curl -O https://exemple.com/data.zip"], ph: "curl -O …", exp: "-O (majuscule) enregistre le fichier sous son nom d'origine." },
    { type: "qcm", q: "Que fait <code>curl -o page.html https://exemple.com</code> ?", opts: ["Affiche la page à l'écran", "Enregistre le contenu dans le fichier page.html", "Supprime la page", "Ouvre un navigateur"], a: 1, exp: "-o (minuscule) enregistre dans le fichier nommé." },
    { type: "qcm", q: "Que renvoie <code>curl -I https://exemple.com</code> ?", opts: ["Le contenu complet", "Seulement les en-têtes (statut, type de contenu...)", "Une image", "Rien"], a: 1, exp: "-I ne récupère que les en-têtes HTTP." },
    { type: "qcm", q: "Que signifie SSH ?", opts: ["Simple System Host", "Secure SHell : session de terminal chiffrée à distance", "Server Side HTML", "System Shutdown Helper"], a: 1, exp: "SSH ouvre un shell distant chiffré." },
    { type: "input", q: "Connecte-toi en ssh comme utilisateur <code>alice</code> sur <code>serveur.com</code>.", a: ["ssh alice@serveur.com"], ph: "ssh alice@…", exp: "ssh utilisateur@hôte ouvre la session distante." },
    { type: "qcm", q: "Dans <code>ssh -p 2222 alice@serveur.com</code>, que fait <code>-p 2222</code> ?", opts: ["Envoie 2222 paquets", "Utilise le port 2222 au lieu du 22 par défaut", "Attend 2222 secondes", "Rien"], a: 1, exp: "-p précise le port de connexion (22 par défaut)." },
    { type: "input", q: "Envoie le fichier <code>fichier.txt</code> vers /home/alice/ sur serveur.com, en tant qu'alice (commande basée sur ssh).", a: ["scp fichier.txt alice@serveur.com:/home/alice/", "scp fichier.txt alice@serveur.com:/home/alice"], ph: "scp fichier.txt alice@serveur.com:…", exp: "scp copie un fichier via ssh vers la machine distante." },
    { type: "vf", q: "La toute première connexion ssh à un serveur demande de confirmer son empreinte (« yes »).", a: true, exp: "Vrai : le client mémorise l'identité du serveur pour détecter une usurpation ultérieure." },
    { type: "qcm", q: "Quelle commande affiche la configuration IP sous Windows ?", opts: ["ip addr", "ipconfig", "netstat", "ping"], a: 1, exp: "ipconfig affiche la config réseau sous Windows ; ip addr sous Linux." },
    { type: "input", q: "Ligne de commande : quelle commande traduit le nom de domaine exemple.com en adresse IP ?", a: ["nslookup exemple.com"], ph: "nslookup …", exp: "nslookup exemple.com résout un nom de domaine en adresse IP." }
  ],
  final: {
    title: "Exercice final — Diagnostiquer et récupérer à distance",
    intro: `<p>Un service web semble en panne. Tu veux d'abord tester la connexion, puis vérifier le statut du site, télécharger un fichier de logs, et enfin te connecter au serveur pour investiguer.</p>`,
    questions: [
      { type: "input", q: "Bash : teste la joignabilité de serveur.com avec 4 paquets.", a: ["ping -c 4 serveur.com"], ph: "ping -c 4 …", exp: "ping -c 4 serveur.com vérifie si la machine répond." },
      { type: "qcm", q: "Le ping répond. Comment vérifier ensuite juste le STATUT HTTP du site ?", opts: ["curl -I https://serveur.com", "ping serveur.com", "ssh serveur.com", "ipconfig"], a: 0, exp: "curl -I renvoie les en-têtes, dont le code de statut HTTP." },
      { type: "input", q: "Ligne de commande : télécharge https://serveur.com/app.log dans un fichier local nommé app.log (option -o).", a: ["curl -o app.log https://serveur.com/app.log", "curl -O https://serveur.com/app.log"], ph: "curl -o app.log …", exp: "-o app.log enregistre la ressource sous ce nom." },
      { type: "input", q: "Connecte-toi en ssh comme <code>admin</code> sur serveur.com pour investiguer.", a: ["ssh admin@serveur.com"], ph: "ssh admin@…", exp: "ssh admin@serveur.com ouvre un terminal sur le serveur." },
      { type: "qcm", q: "Une fois connecté en ssh, comment se déconnecter proprement ?", opts: ["Fermer l'ordinateur", "Taper exit", "Ctrl+Z", "ping stop"], a: 1, exp: "exit ferme la session ssh et rend la main au terminal local." }
    ],
    solution: `<pre class="pseudo"># --- Bash / lignes de commande ---
ping -c 4 serveur.com                 # 1. la machine repond-elle ?
curl -I https://serveur.com           # 2. statut HTTP (en-tetes seuls)
curl -o app.log https://serveur.com/app.log   # 3. recuperer le log
ssh admin@serveur.com                 # 4. se connecter pour investiguer
# ... puis "exit" pour quitter la session distante

# --- Cote PowerShell (equivalents) ---
Test-Connection serveur.com           # ping
Invoke-WebRequest -Method Head https://serveur.com   # en-tetes
# ssh et curl.exe fonctionnent aussi tels quels</pre>
<p>Tu diagnostiques et travailles à distance depuis le terminal. À partir de demain : écrire ses premiers scripts pour automatiser tout cela.</p>`
  }
};
</script>

<script>

    statement: "Écris les commandes pour : (1) tester en <strong>Bash</strong> si <code>github.com</code> répond avec 3 paquets, (2) télécharger <code>https://exemple.com/data.json</code> dans un fichier <code>data.json</code>, (3) te connecter en ssh comme <code>deploy</code> sur <code>prod.exemple.com</code>. Puis indique la variante <strong>Windows/CMD</strong> du test de connexion en continu.",

    ],
    solution: "# --- Bash ---\nping -c 3 github.com                       # 1. 3 paquets puis stop\ncurl -o data.json https://exemple.com/data.json  # 2. telecharger dans data.json\nssh deploy@prod.exemple.com                # 3. session distante\n\n# --- Windows / CMD : test en continu ---\nping -t github.com                         REM en continu (Ctrl+C pour arreter)",

  ]
};
</script>
