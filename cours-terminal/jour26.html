<script>
var DAY = {
  num: 26,
  title: "Premiers pas en script (Bash vs PowerShell)",
  subtitle: "Passer de commandes tapées une à une à un fichier qu'on exécute.",
  theory: `
<h3>1. Qu'est-ce qu'un script ?</h3>
<p>Un <strong>script</strong> est un simple fichier texte qui contient une <strong>suite de commandes</strong>, exécutées les unes après les autres quand on lance le fichier. Au lieu de retaper dix commandes chaque matin, on les écrit une fois, on enregistre, et on relance à volonté. C'est le début de l'<strong>automatisation</strong>.</p>
<div class="tip">Script = recette écrite. Le shell lit chaque ligne et l'exécute comme si tu la tapais toi-même. Un script Bash porte souvent l'extension <code>.sh</code> ; un script PowerShell, l'extension <code>.ps1</code>.</div>

<h3>2. Le premier script Bash</h3>
<pre class="pseudo"># --- Fichier bonjour.sh (Bash) ---
#!/bin/bash
# La 1ere ligne (le "shebang") indique QUEL interpreteur utiliser
echo "Bonjour !"          # affiche du texte
echo "Nous sommes le :"
date                      # affiche la date</pre>
<pre class="pseudo"># --- Rendre executable puis lancer (Bash) ---
chmod +x bonjour.sh       # donne le droit d'execution (jour 22)
./bonjour.sh              # lance le script (./ = dans le dossier courant)
# ou, sans le rendre executable :
bash bonjour.sh           # on passe le fichier a l'interpreteur bash</pre>
<div class="warn">La toute première ligne <code>#!/bin/bash</code> s'appelle le <strong>shebang</strong>. Elle dit au système quel programme doit lire le script. Sans elle, on peut quand même lancer le script avec <code>bash bonjour.sh</code>, mais le shebang est la bonne habitude.</div>

<h3>3. Le premier script PowerShell</h3>
<pre class="pseudo"># --- Fichier bonjour.ps1 (PowerShell) ---
# Pas de shebang : l'extension .ps1 suffit
Write-Output "Bonjour !"       # equivalent de echo
Write-Output "Nous sommes le :"
Get-Date                       # equivalent de date</pre>
<pre class="pseudo"># --- Lancer un script PowerShell ---
.\bonjour.ps1                  # .\ = dans le dossier courant
# Si la politique d'execution bloque, on l'autorise (une fois) :
Set-ExecutionPolicy -Scope CurrentUser RemoteSigned</pre>
<div class="warn">PowerShell protège par défaut : lancer un <code>.ps1</code> peut être <strong>bloqué</strong> par la « politique d'exécution ». On l'assouplit une fois avec <code>Set-ExecutionPolicy</code>. C'est une sécurité contre les scripts malveillants, pas un bug.</div>

<h3>4. Les commentaires et l'affichage</h3>
<pre class="pseudo"># --- Bash --- le # commence un commentaire
echo "texte"          # afficher
# ceci est un commentaire ignore par le shell</pre>
<pre class="pseudo"># --- PowerShell --- le # commente aussi
Write-Output "texte"  # afficher (Write-Host affiche directement a l'ecran)
# commentaire ignore</pre>
<pre class="pseudo"># --- CMD (fichier .bat) --- tres limite pour scripter
@echo off             REM masque l'affichage des commandes elles-memes
echo texte            REM REM: ou :: commence un commentaire</pre>
<div class="tip">Les trois utilisent <code>#</code> pour commenter, sauf CMD qui emploie <code>REM</code> ou <code>::</code>. CMD reste très limité pour de vrais scripts : pour automatiser sérieusement sous Windows, on privilégie <strong>PowerShell</strong>.</div>

<h3>5. Bash vs PowerShell : la philosophie</h3>
<p>Différence de fond. Bash manipule surtout du <strong>texte</strong> (des lignes qui circulent d'une commande à l'autre). PowerShell manipule des <strong>objets</strong> (des données structurées avec des propriétés). D'où des styles différents, mais la même idée : enchaîner des étapes.</p>
<pre class="pseudo"># --- Bash : du texte ---
ls -l | grep ".txt"                 # on filtre des LIGNES de texte
# --- PowerShell : des objets ---
Get-ChildItem | Where-Object Name -like "*.txt"   # on filtre des OBJETS fichiers</pre>
<div class="tip">Retiens la nuance : en PowerShell, chaque « résultat » est un objet avec des propriétés (<code>.Name</code>, <code>.Length</code>...). En Bash, on découpe et filtre du texte. Deux mondes, deux forces.</div>

<h3>6. Récapitulatif</h3>
<pre class="pseudo"># Script Bash      : fichier .sh, 1ere ligne #!/bin/bash, chmod +x, puis ./script.sh
# Script PowerShell: fichier .ps1, lancer avec .\script.ps1 (politique d'execution)
# Script CMD       : fichier .bat, @echo off, REM pour commenter (limite)
# Afficher         : echo / Write-Output / echo
# Commenter        : #  /  #  /  REM
# Philosophie      : Bash = texte  |  PowerShell = objets</pre>`,
  exercises: [
    { type: "qcm", q: "Un script est…", opts: ["Un type de terminal", "Un fichier texte contenant une suite de commandes exécutées à la suite", "Une variable d'environnement", "Un processus"], a: 1, exp: "Le script regroupe des commandes dans un fichier qu'on exécute." },
    { type: "qcm", q: "Quelle extension porte typiquement un script Bash ?", opts: [".ps1", ".sh", ".bat", ".exe"], a: 1, exp: ".sh pour Bash, .ps1 pour PowerShell, .bat pour CMD." },
    { type: "input", q: "Bash : écris la première ligne (le shebang) d'un script destiné à l'interpréteur bash.", a: ["#!/bin/bash"], ph: "#!/…", exp: "#!/bin/bash indique au système d'utiliser bash." },
    { type: "qcm", q: "À quoi sert le shebang <code>#!/bin/bash</code> ?", opts: ["À commenter le script", "À indiquer quel interpréteur doit exécuter le script", "À rendre le script exécutable", "À afficher du texte"], a: 1, exp: "Le shebang désigne l'interpréteur à utiliser." },
    { type: "input", q: "Bash : rends le script <code>bonjour.sh</code> exécutable.", a: ["chmod +x bonjour.sh", "chmod u+x bonjour.sh"], ph: "chmod +x …", exp: "chmod +x ajoute le droit d'exécution." },
    { type: "input", q: "Bash : lance le script bonjour.sh situé dans le dossier courant.", a: ["./bonjour.sh", "bash bonjour.sh"], ph: "./…", exp: "./bonjour.sh lance le script du dossier courant (ou bash bonjour.sh)." },
    { type: "qcm", q: "Quelle extension porte un script PowerShell ?", opts: [".sh", ".ps1", ".psh", ".cmd"], a: 1, exp: ".ps1 est l'extension des scripts PowerShell." },
    { type: "qcm", q: "En PowerShell, quel est l'équivalent le plus proche de <code>echo</code> ?", opts: ["Print", "Write-Output", "Say", "Log"], a: 1, exp: "Write-Output (et Write-Host) affichent du texte." },
    { type: "qcm", q: "Pourquoi un script .ps1 peut-il être bloqué au premier lancement ?", opts: ["Un bug de PowerShell", "La politique d'exécution (sécurité) l'interdit par défaut", "Le fichier est trop gros", "L'extension est incorrecte"], a: 1, exp: "La politique d'exécution protège contre les scripts non approuvés." },
    { type: "input", q: "PowerShell : lance le script bonjour.ps1 du dossier courant (préfixe requis).", a: [".\\bonjour.ps1", ".\\bonjour.ps1"], ph: ".\\bonjour.ps1", exp: "On préfixe par .\\ pour exécuter un script du dossier courant." },
    { type: "qcm", q: "Quel caractère commence un commentaire en Bash ET en PowerShell ?", opts: ["//", "#", "--", "REM"], a: 1, exp: "Le # commente dans les deux ; CMD utilise REM ou ::." },
    { type: "qcm", q: "Dans un fichier .bat (CMD), comment écrit-on un commentaire ?", opts: ["#", "//", "REM (ou ::)", "/* */"], a: 2, exp: "CMD commente avec REM ou ::." },
    { type: "vf", q: "CMD est aussi puissant que PowerShell pour écrire de vrais scripts d'automatisation.", a: false, exp: "Faux : CMD est très limité. Sous Windows, on privilégie PowerShell pour scripter sérieusement." },
    { type: "qcm", q: "Quelle est la différence de philosophie entre Bash et PowerShell ?", opts: ["Aucune", "Bash manipule du texte ; PowerShell manipule des objets structurés", "PowerShell est plus lent", "Bash n'existe que sur Windows"], a: 1, exp: "Bash = flux de texte ; PowerShell = objets avec propriétés." },
    { type: "input", q: "PowerShell : quel cmdlet affiche la date (équivalent de la commande <code>date</code>) ?", a: ["Get-Date", "get-date"], ph: "Get-…", exp: "Get-Date affiche la date et l'heure en PowerShell." }
  ],
  final: {
    title: "Exercice final — Écrire et lancer son tout premier script",
    intro: `<p>Objectif : un mini-script qui affiche un message d'accueil et la date. Tu vas l'écrire en Bash, le rendre exécutable et le lancer ; puis noter l'équivalent PowerShell.</p>`,
    questions: [
      { type: "input", q: "Bash : quelle première ligne (shebang) place-t-on en tête du script ?", a: ["#!/bin/bash"], ph: "#!/…", exp: "#!/bin/bash désigne l'interpréteur bash." },
      { type: "qcm", q: "Quelle ligne affiche « Bonjour ! » en Bash ?", opts: ["print Bonjour", "echo \"Bonjour !\"", "Write-Output Bonjour", "say Bonjour"], a: 1, exp: "echo affiche du texte en Bash." },
      { type: "input", q: "Bash : rends le script accueil.sh exécutable.", a: ["chmod +x accueil.sh", "chmod u+x accueil.sh"], ph: "chmod +x …", exp: "chmod +x autorise l'exécution." },
      { type: "input", q: "Bash : lance-le depuis le dossier courant.", a: ["./accueil.sh", "bash accueil.sh"], ph: "./…", exp: "./accueil.sh exécute le script." },
      { type: "qcm", q: "En PowerShell, les deux lignes équivalentes seraient…", opts: ["echo Bonjour ; date", "Write-Output \"Bonjour !\" ; Get-Date", "print ; time", "say ; now"], a: 1, exp: "Write-Output affiche, Get-Date donne la date." }
    ],
    solution: `<pre class="pseudo"># --- Bash : fichier accueil.sh ---
#!/bin/bash
echo "Bonjour !"
echo "Nous sommes le :"
date

# lancer :
chmod +x accueil.sh
./accueil.sh

# --- PowerShell : fichier accueil.ps1 ---
Write-Output "Bonjour !"
Write-Output "Nous sommes le :"
Get-Date

# lancer :  .\accueil.ps1  (autoriser une fois : Set-ExecutionPolicy -Scope CurrentUser RemoteSigned)</pre>
<p>Tu as écrit ton premier vrai script. Demain, on lui donne de l'intelligence : variables, conditions et boucles.</p>`
  }
};
</script>
