<script>
var DAY = {
  num: 14,
  title: "Les tubes (pipes) : chaîner des commandes",
  subtitle: "Brancher la sortie d'une commande sur l'entrée d'une autre.",
  theory: `
<h3>1. L'idée du tuyau</h3>
<p>Hier, on envoyait la sortie d'une commande vers un FICHIER. Aujourd'hui, on l'envoie directement vers UNE AUTRE COMMANDE. Ce branchement s'appelle un <strong>tube</strong> (en anglais <em>pipe</em>) et s'écrit avec la <strong>barre verticale</strong> <code>|</code>. Imagine une chaîne de montage : chaque poste reçoit le travail du précédent, le transforme, et le passe au suivant.</p>
<pre class="pseudo"># Le symbole du tube est la barre verticale : |
commandeA | commandeB     # la sortie de A devient l'entree de B</pre>
<div class="tip">La barre verticale <code>|</code> s'obtient souvent avec AltGr+6 sur un clavier français (ou Maj+la touche du -). Ne la confonds pas avec la barre oblique <code>/</code> ni la barre inverse <code>\</code>.</div>
<h3>2. Un exemple qui parle : compter</h3>
<p>Combien de fichiers dans ce dossier ? On liste, puis on compte, en branchant les deux :</p>
<pre class="pseudo"># Bash (Linux/macOS)
ls | wc -l               # ls produit la liste → wc -l compte les lignes
# PowerShell (Windows)
Get-ChildItem | Measure-Object   # compte les elements (voir la propriete Count)
# CMD (Windows)
dir | find /c "/"        # astuce de comptage sous CMD (approximative)</pre>
<div class="tip">Le principe est universel : le tube <code>|</code> existe dans les trois shells. Ce sont surtout les commandes de traitement (wc, Measure-Object, find) qui changent de nom.</div>
<h3>3. Filtrer : ne garder que certaines lignes</h3>
<p>On combine souvent une commande qui produit beaucoup de texte avec un filtre qui ne retient que l'intéressant (recherche de texte, vue au jour 15).</p>
<pre class="pseudo"># Bash (Linux/macOS)
ls | grep ".txt"         # ne garde que les lignes contenant « .txt »
# PowerShell (Windows)
Get-ChildItem | Select-String ".txt"   # filtre les lignes contenant « .txt »
# CMD (Windows)
dir | find ".txt"        # ne garde que les lignes contenant « .txt »</pre>
<h3>4. Enchaîner plusieurs tubes</h3>
<p>On peut brancher autant d'étapes qu'on veut : chaque <code>|</code> passe le relais.</p>
<pre class="pseudo"># Bash (Linux/macOS) : lister, filtrer, puis compter
ls | grep ".txt" | wc -l   # combien de fichiers contenant « .txt » ?
# lister, trier, garder les 5 premiers :
cat noms.txt | sort | head -n 5
# PowerShell (Windows)
Get-ChildItem | Sort-Object Length | Select-Object -First 5</pre>
<h3>5. Paginer une longue sortie</h3>
<pre class="pseudo"># Bash (Linux/macOS)
ls -l /usr/bin | less     # envoie une longue liste dans le pageur (q pour sortir)
# CMD (Windows)
dir C:\Windows\System32 | more   # page par page (Espace, q pour sortir)</pre>
<div class="warn">Différence de fond à retenir : sous Bash et CMD, un tube transporte du <strong>texte</strong> (des lignes de caractères). Sous PowerShell, il transporte des <strong>objets</strong> (avec des propriétés). C'est pourquoi côté PowerShell on manipule des propriétés (Length, Count…) plutôt que de découper du texte.</div>
<h3>6. Redirection vs tube : ne pas confondre</h3>
<pre class="pseudo"># &gt; fichier   : envoie la sortie vers un FICHIER (jour 13)
# | commande  : envoie la sortie vers une autre COMMANDE (aujourd'hui)
# Exemple combine :
ls | grep ".txt" &gt; resultat.txt   # filtre PUIS enregistre dans un fichier</pre>`,
  exercises: [
    { type: "qcm", q: "Que fait un tube (pipe) <code>|</code> ?", opts: ["Envoie la sortie vers un fichier", "Branche la sortie d'une commande sur l'entrée d'une autre", "Exécute la commande suivante seulement si la première réussit", "Met la première commande en arrière-plan"], a: 1, exp: "Le tube relie deux commandes : sortie de A → entrée de B." },
    { type: "input", q: "Quel caractère représente le tube (pipe) ?", a: ["|", "barre verticale", "pipe"], ph: "un caractère", exp: "La barre verticale | est le symbole du tube." },
    { type: "vf", q: "Le tube <code>|</code> existe dans les trois shells (Bash, PowerShell, CMD).", a: true, exp: "Oui : seul le nom des commandes de traitement change." },
    { type: "input", q: "Sous Bash, écris la commande qui compte le nombre de lignes produites par ls (ls branché sur wc -l).", a: ["ls | wc -l", "ls|wc -l"], ph: "ls … wc …", exp: "ls | wc -l compte les lignes." },
    { type: "qcm", q: "Sous PowerShell, quelle commande compte les éléments reçus par un tube ?", opts: ["wc -l", "Measure-Object", "find /c", "Count-Item"], a: 1, exp: "Get-ChildItem | Measure-Object compte les objets." },
    { type: "qcm", q: "Sous Bash, <code>ls | grep \".txt\"</code> sert à…", opts: ["Compter les fichiers", "Ne garder que les lignes contenant « .txt »", "Supprimer les .txt", "Trier"], a: 1, exp: "grep filtre les lignes contenant le motif." },
    { type: "qcm", q: "Sous PowerShell, quelle commande filtre les lignes contenant un texte ?", opts: ["grep", "Select-String", "find", "wc"], a: 1, exp: "Select-String est le filtre de texte de PowerShell." },
    { type: "input", q: "Sous Bash, écris la chaîne qui liste, garde les lignes avec « .txt », puis les compte (ls, grep, wc -l).", a: ["ls | grep \".txt\" | wc -l", "ls | grep .txt | wc -l"], ph: "ls | … | …", exp: "ls | grep \".txt\" | wc -l enchaîne trois étapes." },
    { type: "vf", q: "On peut enchaîner plusieurs tubes, chaque | passant le relais au suivant.", a: true, exp: "Oui : A | B | C fait circuler les données d'étape en étape." },
    { type: "qcm", q: "Sous Bash, que fait <code>cat noms.txt | sort | head -n 5</code> ?", opts: ["Affiche le fichier et n'en garde que les 5 dernières lignes", "Affiche le contenu, le trie, et n'en garde que les 5 premières lignes", "Compte les lignes", "Trie le fichier et écrase noms.txt avec le résultat"], a: 1, exp: "On lit, on trie, on garde les 5 premières lignes." },
    { type: "qcm", q: "Sous Bash, une différence de fond avec PowerShell est que le tube Bash transporte…", opts: ["Des objets", "Du texte (des lignes de caractères)", "Des numéros de ligne uniquement", "Des fichiers entiers"], a: 1, exp: "Bash/CMD : le tube transporte du texte ; PowerShell : des objets." },
    { type: "qcm", q: "Sous PowerShell, le tube transporte…", opts: ["Du texte brut uniquement", "Des objets avec des propriétés (Length, Count…)", "Des lignes de texte découpées en colonnes", "Uniquement des nombres"], a: 1, exp: "PowerShell fait circuler des objets structurés." },
    { type: "qcm", q: "Quelle est la différence entre <code>&gt;</code> et <code>|</code> ?", opts: ["Aucune", "&gt; envoie vers un FICHIER, | envoie vers une COMMANDE", "| écrase, &gt; ajoute", "Les deux envoient toujours vers un fichier"], a: 1, exp: "&gt; = vers un fichier ; | = vers une autre commande." },
    { type: "input", q: "Sous Bash, comment paginer une longue sortie de <code>ls -l /usr/bin</code> avec le pageur less ?", a: ["ls -l /usr/bin | less", "ls -l /usr/bin|less"], ph: "… | less", exp: "On branche la sortie sur less (q pour sortir)." },
    { type: "vf", q: "On peut combiner tube et redirection, par exemple <code>ls | grep \".txt\" &gt; resultat.txt</code>.", a: true, exp: "Oui : on filtre avec le tube, puis on enregistre le résultat avec &gt;." }
  ],
  final: {
    title: "Exercice final — Une petite chaîne de traitement",
    intro: `<p>Tu veux savoir combien de fichiers « .log » se trouvent dans le dossier, puis enregistrer la liste filtrée. Compose les tubes.</p>`,
    questions: [
      { type: "input", q: "Bash : liste le dossier et compte le total de lignes (ls branché sur wc -l).", a: ["ls | wc -l", "ls|wc -l"], ph: "ls | …", exp: "ls | wc -l." },
      { type: "input", q: "Bash : ne garde que les lignes contenant « .log » (ls branché sur grep).", a: ["ls | grep \".log\"", "ls | grep .log", "ls|grep .log"], ph: "ls | grep …", exp: "ls | grep \".log\"." },
      { type: "input", q: "Bash : combien de fichiers « .log » ? (ls, grep .log, wc -l)", a: ["ls | grep \".log\" | wc -l", "ls | grep .log | wc -l"], ph: "ls | … | …", exp: "ls | grep \".log\" | wc -l." },
      { type: "qcm", q: "PowerShell : quelle commande compterait les éléments reçus par un tube ?", opts: ["wc -l", "Measure-Object", "find /c", "Count"], a: 1, exp: "Get-ChildItem | Measure-Object." },
      { type: "input", q: "Bash : enregistre la liste filtrée des .log dans logs.txt (tube + redirection).", a: ["ls | grep \".log\" > logs.txt", "ls | grep .log > logs.txt"], ph: "ls | grep … &gt; …", exp: "ls | grep \".log\" &gt; logs.txt." }
    ],
    solution: `<pre class="pseudo"># Une chaine de traitement — les trois shells
# Bash (Linux/macOS)
ls | wc -l                        # compter tout
ls | grep ".log"                  # filtrer les .log
ls | grep ".log" | wc -l          # compter les .log
ls | grep ".log" &gt; logs.txt       # filtrer PUIS enregistrer (tube + redirection)
# PowerShell (Windows)
Get-ChildItem | Measure-Object                    # compter
Get-ChildItem | Select-String ".log"              # filtrer
# CMD (Windows)
dir | find ".log"                 # filtrer les lignes contenant .log
# Rappel : |  vers une COMMANDE ,  &gt;  vers un FICHIER.</pre>
<p>Tu sais assembler des commandes comme des briques. Demain : le filtre roi, la recherche de texte (grep et ses cousins).</p>`
  }
};
</script>
