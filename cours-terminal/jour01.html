<script>
var DAY = {
  num: 1,
  title: "Qu'est-ce que le terminal ?",
  subtitle: "Parler à la machine avec des mots plutôt qu'avec la souris.",
  theory: `
<h3>1. Deux façons de commander un ordinateur</h3>
<p>Quand tu double-cliques sur une icône, tu utilises une <strong>interface graphique</strong> (en anglais <em>GUI</em>, « Graphical User Interface ») : des fenêtres, des boutons, une souris. C'est visuel et rassurant, mais lent pour les tâches répétitives. Il existe une autre porte d'entrée : l'<strong>interface en ligne de commande</strong> (en anglais <em>CLI</em>, « Command Line Interface »), où tu écris des ordres en toutes lettres et où l'ordinateur répond par du texte.</p>
<p>Imagine un restaurant. Le menu illustré avec photos, c'est la GUI : tu pointes du doigt. Dicter précisément ta commande au serveur — « une pizza, sans oignon, extra fromage » — c'est la CLI : plus direct, plus précis, et tu peux tout demander d'un coup.</p>
<h3>2. Terminal, console, shell : trois mots à distinguer</h3>
<p>On confond souvent trois choses. Le <strong>terminal</strong> est la <em>fenêtre</em> dans laquelle tu tapes : c'est l'écran et le clavier, le guichet. La <strong>console</strong> est un synonyme courant de terminal. Le <strong>shell</strong> (mot anglais qui signifie « coquille ») est le vrai cerveau : c'est le <strong>programme qui lit ta commande, la comprend et la fait exécuter</strong>. Le terminal est la vitrine ; le shell est l'employé derrière le comptoir qui traite ta demande.</p>
<div class="tip">Résumé : le <strong>terminal</strong> affiche et récupère le texte ; le <strong>shell</strong> interprète tes commandes. Sur Windows, les shells s'appellent <strong>PowerShell</strong> et <strong>CMD</strong> ; sur Linux et macOS, le plus répandu s'appelle <strong>Bash</strong>. Tout ce cours te montre chaque notion dans ces trois shells en parallèle.</div>
<h3>3. L'invite de commande (le prompt)</h3>
<p>Dès que le terminal est prêt, il affiche une petite marque qui signifie « à toi de jouer, j'attends un ordre ». On l'appelle l'<strong>invite</strong> ou, en anglais, le <strong>prompt</strong> (« invitation »). Sa forme change selon le shell :</p>
<pre class="pseudo"># Bash (Linux/macOS) : se termine souvent par un dollar
utilisateur@machine:~$          # le $ signale que le shell attend ta commande
# PowerShell (Windows) : commence par PS et le chemin
PS C:\Users\Alex&gt;              # le &gt; marque la fin de l'invite
# CMD (Windows) : le chemin puis un chevron
C:\Users\Alex&gt;                 # invite historique de Windows</pre>
<p>Tu n'écris jamais l'invite toi-même : elle est affichée <em>par</em> le shell. Tu tapes seulement la commande qui vient après, puis tu appuies sur <strong>Entrée</strong> pour l'envoyer.</p>
<h3>4. À quoi ça sert, concrètement ?</h3>
<p>Le terminal permet d'aller vite, d'automatiser, et de faire des choses impossibles à la souris : renommer mille fichiers d'un coup, chercher un mot dans des milliers de documents, piloter un serveur à distance qui n'a aucun écran. Beaucoup d'outils de développement ne s'utilisent QUE par le terminal. C'est aussi la façon la plus fiable de décrire une manipulation : une commande écrite est exacte et reproductible, alors que « clique en haut à droite » dépend de la version du logiciel.</p>
<div class="warn">Le terminal fait EXACTEMENT ce que tu écris, sans confirmation par défaut. C'est sa force (rapidité) et son danger (une faute de frappe s'exécute aussi). Tout au long de ce cours, tu apprendras les réflexes de prudence.</div>
<h3>5. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># Terminal / console = la fenêtre (l'affichage + le clavier)
# Shell             = le programme qui interprete tes commandes
# Prompt / invite   = la marque qui signale que le shell t'attend
# GUI = souris et fenetres   |   CLI = texte et commandes</pre>`,

    { type: "qcm", q: "Que désigne le mot « terminal » ?", opts: ["Le programme qui interprète les commandes", "La fenêtre (affichage + clavier) où l'on tape", "Un type de fichier", "Un bouton de la souris"], a: 1, exp: "Le terminal est la vitrine : l'écran et le clavier. Le shell, lui, interprète." },
    { type: "qcm", q: "Que désigne le mot « shell » ?", opts: ["La fenêtre d'affichage", "Le programme qui lit et exécute tes commandes", "Le câble réseau", "L'écran de veille"], a: 1, exp: "Shell = « coquille » : l'interprète de commandes derrière le terminal." },
    { type: "input", q: "Comment appelle-t-on (en français) la petite marque affichée par le shell qui signale qu'il attend une commande ?", a: ["l'invite", "invite", "l'invite de commande", "invite de commande", "le prompt", "prompt"], ph: "un mot", exp: "L'invite (ou prompt) : le shell l'affiche pour t'inviter à taper." },
    { type: "qcm", q: "Sigle de l'interface où l'on tape des commandes texte ?", opts: ["GUI", "CLI", "USB", "PDF"], a: 1, exp: "CLI = Command Line Interface. GUI = interface graphique (souris/fenêtres)." },
    { type: "vf", q: "Le terminal et le shell sont exactement la même chose.", a: false, exp: "Non : le terminal est la fenêtre ; le shell est le programme qui interprète les commandes." },
    { type: "input", q: "Cite un shell utilisé par défaut sur Linux et macOS (réponds par son nom).", a: ["bash"], ph: "un nom", exp: "Bash est le shell le plus répandu sous Linux/macOS." },
    { type: "qcm", q: "Sur Windows, quels sont les deux shells classiques ?", opts: ["Bash et Zsh", "PowerShell et CMD", "Finder et Explorer", "Word et Excel"], a: 1, exp: "Windows fournit PowerShell (moderne) et CMD (invite historique)." },
    { type: "vf", q: "L'invite (prompt) est quelque chose que l'utilisateur doit taper lui-même à chaque fois.", a: false, exp: "Non : c'est le shell qui l'affiche. Tu tapes seulement la commande qui suit." },
    { type: "qcm", q: "Quel symbole termine souvent l'invite Bash ?", opts: ["#", "$", "%", "@"], a: 1, exp: "Bash affiche fréquemment un $ en fin d'invite pour un utilisateur normal." },
    { type: "qcm", q: "Un avantage majeur de la ligne de commande ?", opts: ["Elle est toujours plus jolie", "Elle permet d'automatiser et de reproduire exactement une tâche", "Elle ne peut jamais se tromper", "Elle remplace la souris pour dessiner"], a: 1, exp: "Une commande écrite est précise, rapide et reproductible." },
    { type: "input", q: "Quel sigle (3 lettres) désigne l'interface graphique à base de fenêtres et de souris ?", a: ["gui"], ph: "3 lettres", exp: "GUI = Graphical User Interface." },
    { type: "vf", q: "Le terminal exécute la commande telle qu'elle est écrite, y compris une faute de frappe.", a: true, exp: "Oui : c'est sa force et son risque. D'où l'importance de la prudence." },
    { type: "qcm", q: "Après avoir tapé une commande, quelle touche l'envoie au shell ?", opts: ["Échap", "Tabulation", "Entrée", "Verr. Maj"], a: 2, exp: "On valide (envoie) une commande avec Entrée." },
    { type: "qcm", q: "Pourquoi piloter un serveur distant se fait-il souvent au terminal ?", opts: ["Parce que c'est plus joli", "Parce qu'un serveur n'a souvent ni écran ni souris : seul le texte passe", "Parce que la souris est interdite", "Parce que les serveurs n'ont pas de shell"], a: 1, exp: "Un serveur distant se commande par du texte, sans interface graphique." },
    { type: "input", q: "Autre mot (synonyme de « terminal ») pour désigner la fenêtre où l'on tape des commandes ?", a: ["console", "la console"], ph: "un mot", exp: "Console est un synonyme courant de terminal." }
  ],
  final: {
    title: "Exercice final — Remettre les mots à leur place",
    intro: `<p>Léa ouvre pour la première fois une fenêtre noire où s'affiche <code>C:\\Users\\Lea&gt;</code>. Aidons-la à nommer correctement ce qu'elle voit.</p>`,
    questions: [
      { type: "qcm", q: "La fenêtre elle-même s'appelle…", opts: ["Le shell", "Le terminal (ou console)", "Le prompt", "Le GUI"], a: 1, exp: "La fenêtre = terminal/console." },
      { type: "input", q: "La marque <code>C:\\Users\\Lea&gt;</code> qui l'attend porte quel nom (en français) ?", a: ["l'invite", "invite", "le prompt", "prompt", "l'invite de commande"], ph: "un mot", exp: "C'est l'invite (prompt), affichée par le shell." },
      { type: "qcm", q: "Ici, le programme qui va interpréter sa commande est un…", opts: ["Terminal", "Shell (CMD ou PowerShell)", "Fichier", "Prompt"], a: 1, exp: "Sous Windows, ce shell est CMD ou PowerShell." },
      { type: "vf", q: "Léa doit retaper elle-même <code>C:\\Users\\Lea&gt;</code> avant sa commande.", a: false, exp: "Non : l'invite est affichée par le shell ; elle tape seulement la commande." },
      { type: "qcm", q: "Elle tape une commande puis appuie sur Entrée. Que se passe-t-il ?", opts: ["Rien tant qu'elle ne clique pas", "Le shell lit, interprète et exécute la commande", "Le terminal se ferme", "La souris se désactive"], a: 1, exp: "Entrée envoie la commande au shell, qui l'exécute." }
    ],
    solution: `<pre class="pseudo"># Le vocabulaire de base, une fois pour toutes :
Terminal / console  → la fenetre (affichage + clavier)
Shell               → le programme qui interprete (Bash, PowerShell, CMD)
Invite / prompt     → la marque affichee par le shell ($  ou  &gt;)
On tape la commande APRES l'invite, puis Entree pour l'executer.</pre>
<p>Tu sais désormais nommer ce que tu vois. Demain : comment ouvrir concrètement un terminal sur chaque système.</p>`
  }
};
