<script>
var DAY = {
  num: 12,
  title: "Les raccourcis clavier essentiels",
  subtitle: "Éditer, interrompre, nettoyer : piloter le terminal du bout des doigts.",
  theory: `
<h3>1. Pourquoi des raccourcis ?</h3>
<p>En ligne de commande, tes mains restent sur le clavier : viser un bouton à la souris casserait le rythme. Quelques <strong>raccourcis clavier</strong> te permettent de te déplacer dans la ligne, de corriger, d'interrompre un programme ou de nettoyer l'écran instantanément. Beaucoup viennent du monde Unix mais fonctionnent aussi, en grande partie, sous PowerShell.</p>
<h3>2. Interrompre et signaler : Ctrl+C, Ctrl+D</h3>
<p>Le raccourci le plus vital : <strong>Ctrl+C</strong> <strong>interrompt</strong> le programme en cours (il l'arrête net). Indispensable quand une commande tourne trop longtemps ou s'affole.</p>
<pre class="pseudo"># Les trois shells
# Ctrl+C : INTERROMPRE la commande en cours (l'arrete immediatement)
# Bash / macOS :
# Ctrl+D : envoie « fin de saisie » ; sur une ligne vide, ferme le shell (deconnexion)
# PowerShell / CMD :
# pour fermer le shell, on tape la commande  exit</pre>
<div class="warn">Ne confonds pas <strong>Ctrl+C</strong> (interrompre le programme) avec le copier de Windows. Dans un terminal, Ctrl+C sert d'abord à STOPPER. Pour copier/coller, les terminaux modernes utilisent souvent Ctrl+Maj+C / Ctrl+Maj+V, ou le clic droit.</div>
<h3>3. Nettoyer l'écran : Ctrl+L</h3>
<pre class="pseudo"># Les trois shells
# Ctrl+L : efface l'ecran (l'historique des commandes reste intact)
# Equivalent en commande :
clear                # Bash / PowerShell : efface l'ecran
cls                  # CMD / PowerShell  : efface l'ecran</pre>
<h3>4. Se déplacer dans la ligne</h3>
<p>Ces raccourcis, hérités d'Unix, marchent sous Bash et, pour la plupart, sous PowerShell :</p>
<pre class="pseudo"># Ctrl+A : aller au DEBUT de la ligne
# Ctrl+E : aller a la FIN de la ligne
# Fleche Gauche / Droite : deplacer le curseur d'un caractere
# (Ctrl + Fleche : se deplacer mot par mot, dans la plupart des terminaux)</pre>
<h3>5. Effacer efficacement</h3>
<pre class="pseudo"># Ctrl+U : efface du curseur jusqu'au DEBUT de la ligne
# Ctrl+K : efface du curseur jusqu'a la FIN de la ligne
# Ctrl+W : efface le MOT precedent (pratique pour corriger vite)
# (ces raccourcis viennent de Bash ; PowerShell en reprend plusieurs)</pre>
<div class="tip">Petit moyen mnémotechnique Bash : <strong>A</strong> comme « au début », <strong>E</strong> comme « End » (fin) ; <strong>U</strong> efface vers le début (up), <strong>K</strong> efface vers la fin (kill jusqu'au bout). <strong>W</strong> = un « word » (mot) effacé.</div>
<h3>6. Mettre en pause : Ctrl+Z (Bash)</h3>
<pre class="pseudo"># Bash (Linux/macOS)
# Ctrl+Z : SUSPEND le programme en cours (le met en pause en arriere-plan)
# On le reprend ensuite avec la commande  fg  (foreground)
# ⚠️ Sous Windows, Ctrl+Z a un autre role (marque une fin de fichier en saisie).</pre>
<div class="warn">Attention au faux ami : sous Bash, <strong>Ctrl+Z</strong> met un programme EN PAUSE (il n'est pas fermé, on le relance avec <code>fg</code>). Sous Windows, Ctrl+Z n'a pas ce rôle : pour ANNULER une frappe, on utilise plutôt les fonctions d'édition classiques. Ne t'attends donc pas au même effet partout.</div>
<h3>7. Les indispensables</h3>
<pre class="pseudo"># Interrompre le programme   : Ctrl+C   (les trois shells)
# Effacer l'ecran            : Ctrl+L   (ou clear / cls)
# Debut / fin de ligne       : Ctrl+A / Ctrl+E   (Bash, souvent PowerShell)
# Effacer mot / debut / fin  : Ctrl+W / Ctrl+U / Ctrl+K   (Bash)
# Suspendre (Bash)           : Ctrl+Z  puis  fg  pour reprendre</pre>`,
  exercises: [
    { type: "qcm", q: "Quel raccourci INTERROMPT (arrête) le programme en cours ?", opts: ["Ctrl+L", "Ctrl+C", "Ctrl+A", "Ctrl+E"], a: 1, exp: "Ctrl+C interrompt la commande en cours." },
    { type: "vf", q: "Dans un terminal, Ctrl+C sert d'abord à interrompre, pas forcément à copier.", a: true, exp: "Oui : Ctrl+C stoppe le programme. Le copier utilise souvent Ctrl+Maj+C." },
    { type: "qcm", q: "Quel raccourci efface l'écran (sans effacer l'historique) ?", opts: ["Ctrl+C", "Ctrl+L", "Ctrl+Z", "Ctrl+W"], a: 1, exp: "Ctrl+L nettoie l'affichage ; l'historique reste." },
    { type: "input", q: "Quelle commande Bash (un mot) efface l'écran ?", a: ["clear"], ph: "une commande", exp: "clear efface l'écran sous Bash (et PowerShell)." },
    { type: "input", q: "Quelle commande CMD (un mot) efface l'écran ?", a: ["cls"], ph: "une commande", exp: "cls efface l'écran sous CMD (et PowerShell)." },
    { type: "qcm", q: "Sous Bash, quel raccourci amène le curseur au DÉBUT de la ligne ?", opts: ["Ctrl+E", "Ctrl+A", "Ctrl+K", "Ctrl+C"], a: 1, exp: "Ctrl+A = début de ligne (A comme « au début »)." },
    { type: "qcm", q: "Sous Bash, quel raccourci amène le curseur à la FIN de la ligne ?", opts: ["Ctrl+A", "Ctrl+E", "Ctrl+U", "Ctrl+L"], a: 1, exp: "Ctrl+E = fin de ligne (E comme « End »)." },
    { type: "qcm", q: "Sous Bash, quel raccourci efface le MOT précédent ?", opts: ["Ctrl+W", "Ctrl+L", "Ctrl+A", "Ctrl+C"], a: 0, exp: "Ctrl+W efface le mot précédent (W comme « word »)." },
    { type: "qcm", q: "Sous Bash, Ctrl+U efface…", opts: ["Toute la ligne vers la fin", "Du curseur jusqu'au début de la ligne", "L'écran entier", "Le mot suivant"], a: 1, exp: "Ctrl+U efface du curseur vers le début." },
    { type: "qcm", q: "Sous Bash, Ctrl+K efface…", opts: ["Du curseur jusqu'à la fin de la ligne", "Tout l'historique", "Le mot précédent", "Toute la ligne, du début à la fin"], a: 0, exp: "Ctrl+K efface du curseur jusqu'à la fin." },
    { type: "qcm", q: "Sous Bash, que fait Ctrl+Z sur un programme en cours ?", opts: ["Il le supprime définitivement", "Il le SUSPEND (le met en pause), on le reprend avec fg", "Il efface l'écran", "Il ferme le terminal"], a: 1, exp: "Ctrl+Z suspend ; fg le ramène au premier plan." },
    { type: "input", q: "Sous Bash, quelle commande (deux lettres) reprend au premier plan un programme suspendu par Ctrl+Z ?", a: ["fg"], ph: "deux lettres", exp: "fg (foreground) reprend le programme suspendu." },
    { type: "vf", q: "Sous Windows, Ctrl+Z a exactement le même rôle « mettre en pause » que sous Bash.", a: false, exp: "Non : sous Windows, Ctrl+Z marque une fin de fichier en saisie, ce n'est pas la pause de Bash." },
    { type: "qcm", q: "Pour fermer un shell PowerShell ou CMD, on tape…", opts: ["Ctrl+D", "exit", "logout", "close"], a: 1, exp: "exit ferme PowerShell et CMD (Bash accepte aussi Ctrl+D sur ligne vide)." },
    { type: "vf", q: "Ctrl+L (effacer l'écran) supprime aussi l'historique des commandes.", a: false, exp: "Non : Ctrl+L nettoie l'affichage mais l'historique reste intact." }
  ],
  final: {
    title: "Exercice final — Piloter au clavier",
    intro: `<p>Une commande s'emballe, ta ligne est pleine de fautes, et l'écran est encombré. Utilise les bons raccourcis.</p>`,
    questions: [
      { type: "qcm", q: "La commande tourne sans fin. Comment l'arrêter ?", opts: ["Ctrl+L", "Ctrl+C", "Ctrl+A", "exit"], a: 1, exp: "Ctrl+C interrompt le programme en cours." },
      { type: "qcm", q: "L'écran est encombré. Quel raccourci le nettoie ?", opts: ["Ctrl+C", "Ctrl+L", "Ctrl+Z", "Ctrl+W"], a: 1, exp: "Ctrl+L efface l'écran (ou clear / cls)." },
      { type: "qcm", q: "Bash : tu veux remonter au tout début de ta ligne pour corriger. Quel raccourci ?", opts: ["Ctrl+E", "Ctrl+A", "Ctrl+K", "Ctrl+C"], a: 1, exp: "Ctrl+A place le curseur au début de la ligne." },
      { type: "qcm", q: "Bash : tu as tapé un mauvais dernier mot. Comment l'effacer vite ?", opts: ["Ctrl+W", "Ctrl+L", "Ctrl+C", "Ctrl+A"], a: 0, exp: "Ctrl+W efface le mot précédent." },
      { type: "input", q: "Quelle commande (un mot) efface l'écran sous Bash ?", a: ["clear"], ph: "une commande", exp: "clear (Bash/PowerShell) ; cls (CMD/PowerShell)." }
    ],
    solution: `<pre class="pseudo"># Piloter au clavier — l'essentiel
# Interrompre un programme :  Ctrl+C            (les trois shells)
# Effacer l'ecran :          Ctrl+L   ou  clear (Bash/PS) / cls (CMD/PS)
# Debut / fin de ligne :     Ctrl+A / Ctrl+E    (Bash, souvent PowerShell)
# Effacer mot / debut / fin: Ctrl+W / Ctrl+U / Ctrl+K   (Bash)
# Suspendre (Bash) :         Ctrl+Z  puis  fg  pour reprendre
# Fermer le shell :          Bash Ctrl+D  |  PowerShell/CMD : exit</pre>
<p>Tes doigts pilotent maintenant le terminal. Demain : diriger la sortie des commandes avec les redirections.</p>`
  }
};
</script>
