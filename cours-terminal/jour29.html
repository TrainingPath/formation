<script>
var DAY = {
  num: 29,
  title: "Enchaîner et automatiser (&amp;&amp;, ||, ;)",
  subtitle: "Relier plusieurs commandes sur une ligne, et selon leur réussite.",
  theory: `
<h3>1. Trois façons de relier des commandes</h3>
<p>On peut mettre plusieurs commandes sur une même ligne, mais la manière de les <strong>séparer</strong> change tout. Trois opérateurs, trois logiques : <strong>toujours</strong> enchaîner (<code>;</code>), enchaîner <strong>si succès</strong> (<code>&amp;&amp;</code>), enchaîner <strong>si échec</strong> (<code>||</code>). C'est la base de tout automatisme robuste.</p>
<div class="tip">Idée centrale : chaque commande renvoie un <strong>code de retour</strong>. 0 = succès, tout autre = échec. Les opérateurs <code>&amp;&amp;</code> et <code>||</code> lisent ce code pour décider s'ils lancent la commande suivante.</div>

<h3>2. Le point-virgule : toujours, l'un après l'autre</h3>
<pre class="pseudo"># --- Bash / PowerShell / CMD (avec & sous CMD) ---
cd projet ; ls           # Bash : va dans projet, PUIS liste (quoi qu'il arrive)
cd projet; ls            # PowerShell : idem, ; sequentiel
cd projet & dir          REM CMD : un seul & = sequentiel</pre>
<div class="warn">Avec <code>;</code>, la deuxième commande s'exécute <strong>même si la première a échoué</strong>. Si <code>cd projet</code> échoue (dossier inexistant), le <code>ls</code> se fera... dans le mauvais dossier. Ce n'est pas toujours ce qu'on veut.</div>

<h3>3. Le ET logique : &amp;&amp; (seulement si succès)</h3>
<p><code>&amp;&amp;</code> ne lance la commande suivante <strong>que si la précédente a réussi</strong>. C'est l'enchaînement le plus utile : on ne continue que si tout va bien.</p>
<pre class="pseudo"># --- Bash ---
cd projet &amp;&amp; ls           # ls SEULEMENT si le cd a reussi
mkdir sauve &amp;&amp; cp *.txt sauve/   # copie UNIQUEMENT si le dossier a bien ete cree
make &amp;&amp; ./programme     # lance le programme seulement si la compilation reussit</pre>
<pre class="pseudo"># --- PowerShell 7+ / CMD : meme operateur ---
cd projet &amp;&amp; ls           # PowerShell 7 et CMD comprennent aussi &amp;&amp;</pre>
<div class="tip">Lis <code>&amp;&amp;</code> comme « ET ALORS » : « crée le dossier ET ALORS copie dedans ». Si l'étape 1 rate, l'étape 2 est annulée : on évite les catastrophes en chaîne.</div>

<h3>4. Le OU logique : || (seulement si échec)</h3>
<p><code>||</code> lance la commande suivante <strong>seulement si la précédente a échoué</strong>. Parfait pour un plan B ou un message d'erreur.</p>
<pre class="pseudo"># --- Bash ---
cd projet || echo "Dossier introuvable"   # message SEULEMENT si le cd echoue
ping -c1 site.com || echo "Site injoignable"
mkdir sauve || cd sauve   # cree le dossier, ou (s'il existe deja) va dedans</pre>
<div class="tip">Lis <code>||</code> comme « SINON » : « va dans le dossier SINON affiche une erreur ». On combine souvent les deux : <code>commande &amp;&amp; echo OK || echo ECHEC</code>.</div>

<h3>5. Le cas de PowerShell avant la version 7</h3>
<pre class="pseudo"># --- PowerShell (toutes versions) --- $? = la derniere commande a-t-elle reussi ?
cd projet
if ($?) { ls }            # equivalent de "cd projet &amp;&amp; ls"
# En Bash aussi, $? contient le code de retour de la derniere commande :
cd projet
echo $?                   # 0 = succes, autre = echec</pre>
<div class="warn">Nuance historique : les opérateurs <code>&amp;&amp;</code> et <code>||</code> n'existent en PowerShell qu'à partir de la <strong>version 7</strong>. Sur d'anciennes versions Windows, on passe par <code>if ($?)</code>. En Bash et en CMD, ils fonctionnent depuis toujours.</div>

<h3>6. Récapitulatif</h3>
<pre class="pseudo"># cmd1 ; cmd2      -> cmd2 s'execute TOUJOURS apres cmd1
# cmd1 &amp;&amp; cmd2     -> cmd2 seulement si cmd1 a REUSSI (code 0)
# cmd1 || cmd2     -> cmd2 seulement si cmd1 a ECHOUE (code != 0)
# cmd1 &amp;&amp; cmd2 || cmd3  -> cmd2 si succes, cmd3 si echec
# Code de retour   : $? (Bash) | $? (PowerShell) ; 0 = succes
# CMD : & (sequentiel), &amp;&amp; et || comme ailleurs</pre>`,
  exercises: [
    { type: "qcm", q: "Que fait l'opérateur <code>;</code> entre deux commandes ?", opts: ["Lance la 2e seulement si la 1re réussit", "Lance la 2e TOUJOURS, après la 1re", "Lance la 2e seulement si la 1re échoue", "Annule les deux"], a: 1, exp: "Le point-virgule enchaîne quoi qu'il arrive." },
    { type: "qcm", q: "Quel code de retour signifie « succès » ?", opts: ["1", "0", "-1", "100"], a: 1, exp: "0 = succès ; toute autre valeur = échec." },
    { type: "qcm", q: "Que fait <code>cmd1 &amp;&amp; cmd2</code> ?", opts: ["cmd2 toujours", "cmd2 seulement si cmd1 a réussi", "cmd2 seulement si cmd1 a échoué", "les deux en parallèle"], a: 1, exp: "&& n'enchaîne que si la première commande réussit (code 0)." },
    { type: "input", q: "Bash : crée le dossier <code>sauve</code>, et copie <code>*.txt</code> dedans UNIQUEMENT si la création a réussi (opérateur adapté).", a: ["mkdir sauve && cp *.txt sauve/", "mkdir sauve && cp *.txt sauve"], ph: "mkdir sauve … cp *.txt sauve/", exp: "mkdir sauve && cp ... : la copie n'a lieu que si le dossier est bien créé." },
    { type: "qcm", q: "Que fait <code>cmd1 || cmd2</code> ?", opts: ["cmd2 seulement si cmd1 a réussi", "cmd2 seulement si cmd1 a échoué", "cmd2 toujours", "cmd1 deux fois"], a: 1, exp: "|| n'enchaîne que si la première commande échoue." },
    { type: "input", q: "Bash : va dans le dossier <code>projet</code>, SINON affiche « Dossier introuvable » (opérateur adapté et echo).", a: ["cd projet || echo \"Dossier introuvable\"", "cd projet || echo 'Dossier introuvable'"], ph: "cd projet … echo \"Dossier introuvable\"", exp: "cd projet || echo ... : le message ne s'affiche que si le cd échoue." },
    { type: "vf", q: "Avec <code>;</code>, la seconde commande ne s'exécute pas si la première échoue.", a: false, exp: "Faux : avec ; la seconde s'exécute toujours. C'est && qui dépend du succès." },
    { type: "input", q: "Bash : compile avec <code>make</code> puis lance <code>./programme</code> SEULEMENT si la compilation a réussi.", a: ["make && ./programme"], ph: "make … ./programme", exp: "make && ./programme : on ne lance le programme que si make réussit." },
    { type: "qcm", q: "Comment lit-on facilement <code>&amp;&amp;</code> et <code>||</code> en langage courant ?", opts: ["&& = SINON, || = ET ALORS", "&& = ET ALORS (si succès), || = SINON (si échec)", "Les deux veulent dire « toujours »", "&& = pause, || = stop"], a: 1, exp: "&& = « et alors » (si succès), || = « sinon » (si échec)." },
    { type: "qcm", q: "En Bash, que contient la variable spéciale <code>$?</code> ?", opts: ["Le nom du dossier", "Le code de retour de la DERNIÈRE commande", "Le PID courant", "L'heure"], a: 1, exp: "$? donne le code de retour de la dernière commande (0 = succès)." },
    { type: "input", q: "Bash : affiche le code de retour de la dernière commande exécutée.", a: ["echo $?"], ph: "echo …", exp: "echo $? montre le code de retour (0 = succès)." },
    { type: "qcm", q: "Depuis quelle version PowerShell dispose-t-il des opérateurs <code>&amp;&amp;</code> et <code>||</code> ?", opts: ["Depuis toujours", "Depuis la version 7", "Il ne les a jamais eus", "Depuis Windows XP"], a: 1, exp: "PowerShell 7 a introduit && et || ; avant, on utilisait if ($?)." },
    { type: "qcm", q: "En PowerShell ancien, quel équivalent de <code>cd projet &amp;&amp; ls</code> ?", opts: ["cd projet ; if ($?) { ls }", "cd projet + ls", "cd projet ! ls", "ls && cd projet"], a: 0, exp: "if ($?) teste si la commande précédente a réussi." },
    { type: "vf", q: "Sous CMD, un simple <code>&</code> enchaîne deux commandes de façon séquentielle.", a: true, exp: "Vrai : en CMD, & sépare deux commandes séquentielles (&& = si succès)." },
    { type: "input", q: "Bash : en une ligne, lance <code>./deploy.sh</code>, affiche « OK » si succès, « ECHEC » si échec (combine && et ||).", a: ["./deploy.sh && echo OK || echo ECHEC", "./deploy.sh && echo \"OK\" || echo \"ECHEC\""], ph: "./deploy.sh && echo OK || echo ECHEC", exp: "&& echo OK s'exécute si succès, || echo ECHEC si échec." }
  ],
  final: {
    title: "Exercice final — Une chaîne de déploiement robuste",
    intro: `<p>Tu veux : entrer dans le dossier <code>site</code>, y récupérer les mises à jour, reconstruire le projet, et n'annoncer « Déployé » que si tout s'est bien passé — sinon prévenir de l'échec.</p>`,
    questions: [
      { type: "qcm", q: "Pour entrer dans <code>site</code> puis continuer SEULEMENT si le dossier existe, on relie par…", opts: [";", "&&", "||", "&"], a: 1, exp: "&& ne poursuit que si le cd a réussi." },
      { type: "input", q: "Bash : entre dans <code>site</code> et lance <code>git pull</code> uniquement si le cd réussit.", a: ["cd site && git pull"], ph: "cd site … git pull", exp: "cd site && git pull : la mise à jour n'a lieu que dans le bon dossier." },
      { type: "input", q: "Bash : enchaîne <code>git pull</code> puis <code>make</code>, chaque étape ne se faisant que si la précédente a réussi.", a: ["git pull && make"], ph: "git pull … make", exp: "git pull && make : on ne reconstruit que si la récupération réussit." },
      { type: "qcm", q: "Pour n'afficher un message d'erreur que si une étape échoue, on utilise…", opts: ["&&", "||", ";", "&"], a: 1, exp: "|| déclenche la commande suivante en cas d'échec." },
      { type: "input", q: "Bash : en une ligne complète, enchaîne cd/pull/make, affiche « Déployé » si tout réussit, sinon « Échec ». (utilise && entre les étapes puis && echo Déployé || echo Échec)", a: ["cd site && git pull && make && echo Déployé || echo Échec", "cd site && git pull && make && echo \"Déployé\" || echo \"Échec\""], ph: "cd site && git pull && make && echo Déployé || echo Échec", exp: "Chaque && exige le succès du précédent ; le || final gère l'échec global." }
    ],
    solution: `<pre class="pseudo"># --- Bash ---
cd site && git pull && make && echo "Déployé" || echo "Échec"
# cd site      : on entre dans le dossier
# && git pull  : maj SEULEMENT si le cd a reussi
# && make      : reconstruction SEULEMENT si le pull a reussi
# && echo OK   : message de succes SEULEMENT si make a reussi
# || echo Echec: message d'erreur si une etape quelconque a echoue

# --- PowerShell 7+ : meme syntaxe ---
cd site && git pull && make && Write-Output "Déployé" || Write-Output "Échec"

# --- PowerShell ancien : via if ($?) ---
cd site; if ($?) { git pull; if ($?) { make } }</pre>
<p>Tu construis des enchaînements sûrs, qui s'arrêtent au premier problème. Demain : les bonnes pratiques et la productivité au quotidien.</p>`
  }
};
</script>

    note: "&& = ET ALORS (si succes), || = SINON (si echec). En les combinant, on obtient un enchainement qui s'arrete des le premier probleme." }
