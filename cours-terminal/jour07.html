<script>
var DAY = {
  num: 7,
  title: "Créer et supprimer dossiers et fichiers",
  subtitle: "Fabriquer des dossiers, des fichiers vides, et faire le ménage sans se blesser.",
  theory: `
<h3>1. Créer un dossier</h3>
<p>La commande de création de dossier s'appelle <strong>mkdir</strong> (« make directory », fabriquer un répertoire) dans les trois shells — un bel exemple de mot commun.</p>
<pre class="pseudo"># Bash (Linux/macOS)
mkdir Projets              # cree un dossier nomme Projets
mkdir -p a/b/c            # -p : cree toute la chaine a, puis b, puis c d'un coup
# PowerShell (Windows)
mkdir Projets              # fonctionne (alias de New-Item -ItemType Directory)
New-Item -ItemType Directory a\b\c    # le vrai nom, cree l'arborescence
# CMD (Windows)
mkdir Projets              # ou l'abreviation md
mkdir a\b\c               # CMD cree aussi les niveaux intermediaires</pre>
<div class="tip">Sous Bash, il faut <code>-p</code> pour créer plusieurs niveaux d'un coup (sinon erreur si le parent manque). CMD le fait naturellement. C'est une petite différence qui surprend souvent.</div>
<h3>2. Créer un fichier vide</h3>
<p>Créer un fichier vide (ou mettre à jour sa date) se fait avec <strong>touch</strong> sous Bash. Windows n'a pas de <code>touch</code> natif : on utilise d'autres tournures.</p>
<pre class="pseudo"># Bash (Linux/macOS)
touch notes.txt            # cree notes.txt s'il n'existe pas (sinon met a jour sa date)
# PowerShell (Windows)
New-Item notes.txt         # cree un fichier vide notes.txt
# CMD (Windows)
type nul &gt; notes.txt      # astuce : redirige « rien » (nul) vers un nouveau fichier</pre>
<div class="tip">Le <code>&gt;</code> de la ligne CMD est une <strong>redirection</strong> : on l'étudiera au jour 13. Retiens juste que <code>type nul &gt; notes.txt</code> est l'équivalent CMD de <code>touch</code>.</div>
<h3>3. Supprimer un fichier</h3>
<p>Attention, on entre dans la zone dangereuse. La suppression est <strong>définitive</strong> : pas de corbeille en ligne de commande.</p>
<pre class="pseudo"># Bash (Linux/macOS)
rm notes.txt               # « remove » : supprime le fichier (definitif !)
# PowerShell (Windows)
Remove-Item notes.txt      # (alias : rm, del) supprime le fichier
# CMD (Windows)
del notes.txt              # supprime le fichier</pre>
<h3>4. Supprimer un dossier</h3>
<p>Un dossier VIDE se retire simplement ; un dossier PLEIN exige une option « récursive » qui supprime aussi tout ce qu'il contient.</p>
<pre class="pseudo"># Bash (Linux/macOS)
rmdir DossierVide          # supprime un dossier VIDE seulement
rm -r Projets              # -r (recursif) : supprime Projets ET tout son contenu
# PowerShell (Windows)
Remove-Item Projets -Recurse    # -Recurse : dossier et tout son contenu
# CMD (Windows)
rmdir /s Projets           # /s : supprime le dossier et son contenu</pre>
<div class="warn">DANGER absolu : <code>rm -r</code> (Bash), <code>Remove-Item -Recurse</code> (PowerShell) et <code>rmdir /s</code> (CMD) suppriment TOUT le contenu, sans confirmation et sans corbeille. Vérifie DEUX fois le chemin avant d'appuyer sur Entrée. Ne combine jamais à la légère <code>rm -rf /</code> ou similaire : tu pourrais effacer des données irremplaçables.</div>
<h3>5. Tableau de correspondance</h3>
<pre class="pseudo"># Action            Bash            PowerShell               CMD
# Creer dossier     mkdir X         mkdir X / New-Item -ItemType Directory X   mkdir X (md X)
# Creer fichier     touch f.txt     New-Item f.txt           type nul &gt; f.txt
# Supprimer fichier rm f.txt        Remove-Item f.txt        del f.txt
# Dossier vide      rmdir X         Remove-Item X            rmdir X
# Dossier plein     rm -r X         Remove-Item X -Recurse   rmdir /s X</pre>`,
  exercises: [
    { type: "input", q: "Quelle commande (commune aux 3 shells) crée un dossier nommé Projets ?", a: ["mkdir projets", "mkdir Projets", "mkdir"], ph: "une commande", exp: "mkdir crée un dossier dans Bash, PowerShell et CMD." },
    { type: "input", q: "Sous Bash, quelle option de mkdir crée d'un coup toute une chaîne a/b/c ?", a: ["-p", "p"], ph: "-…", exp: "mkdir -p a/b/c crée les niveaux intermédiaires." },
    { type: "input", q: "Quelle commande Bash crée un fichier vide notes.txt (ou met à jour sa date) ?", a: ["touch notes.txt", "touch"], ph: "une commande", exp: "touch crée un fichier vide s'il n'existe pas." },
    { type: "qcm", q: "Sous PowerShell, quelle commande crée un fichier vide notes.txt ?", opts: ["touch notes.txt", "New-Item notes.txt", "del notes.txt", "mkdir notes.txt"], a: 1, exp: "New-Item notes.txt crée le fichier ; touch n'existe pas nativement." },
    { type: "qcm", q: "Sous CMD, quelle astuce crée un fichier vide notes.txt ?", opts: ["touch notes.txt", "type nul &gt; notes.txt", "New-Item notes.txt", "make notes.txt"], a: 1, exp: "type nul &gt; notes.txt redirige « rien » vers un nouveau fichier." },
    { type: "input", q: "Quelle commande Bash supprime le fichier notes.txt ?", a: ["rm notes.txt", "rm"], ph: "une commande", exp: "rm (remove) supprime le fichier, définitivement." },
    { type: "qcm", q: "Sous CMD, quelle commande supprime un fichier ?", opts: ["rm", "del", "rmdir", "erase-item"], a: 1, exp: "del supprime un fichier sous CMD (rm n'existe pas nativement)." },
    { type: "input", q: "Quelle est la vraie commande PowerShell (Verbe-Nom) pour supprimer un fichier ?", a: ["remove-item", "remove-item notes.txt"], ph: "Verbe-Nom", exp: "Remove-Item ; alias rm et del." },
    { type: "qcm", q: "Sous Bash, comment supprimer un dossier VIDE (et seulement vide) ?", opts: ["rm -r", "rmdir", "del", "touch"], a: 1, exp: "rmdir ne retire qu'un dossier vide." },
    { type: "input", q: "Sous Bash, quelle option de rm supprime un dossier ET tout son contenu (récursif) ?", a: ["-r", "r"], ph: "-…", exp: "rm -r supprime récursivement le dossier et son contenu." },
    { type: "qcm", q: "Sous PowerShell, quel paramètre supprime un dossier et tout son contenu ?", opts: ["-r", "-Recurse", "/s", "-All"], a: 1, exp: "Remove-Item Projets -Recurse." },
    { type: "qcm", q: "Sous CMD, quelle option de rmdir supprime le dossier et son contenu ?", opts: ["/r", "/s", "-Recurse", "-p"], a: 1, exp: "rmdir /s Projets supprime le dossier plein." },
    { type: "vf", q: "En ligne de commande, une suppression passe généralement par la corbeille et se récupère facilement.", a: false, exp: "Non : rm, del, Remove-Item suppriment définitivement, sans corbeille." },
    { type: "vf", q: "Sous Bash, mkdir a/b/c échoue si a et b n'existent pas, sauf si on ajoute -p.", a: true, exp: "Oui : sans -p, mkdir ne crée pas les niveaux parents manquants." },
    { type: "qcm", q: "Quel réflexe adopter avant une suppression récursive ?", opts: ["Supprimer d'abord, réfléchir ensuite", "Vérifier deux fois le chemin visé avant d'appuyer sur Entrée", "Lancer la commande sans relire le chemin", "Toujours ajouter -f"], a: 1, exp: "Une suppression récursive est irréversible : on vérifie le chemin." }
  ],
  final: {
    title: "Exercice final — Ranger puis nettoyer",
    intro: `<p>Tu dois créer un dossier <code>Atelier</code>, y placer un fichier vide <code>liste.txt</code>, puis, à la fin, tout supprimer. Donne les commandes dans le shell demandé.</p>`,
    questions: [
      { type: "input", q: "Bash : crée le dossier Atelier.", a: ["mkdir atelier", "mkdir Atelier"], ph: "une commande", exp: "mkdir Atelier." },
      { type: "input", q: "Bash : crée le fichier vide liste.txt (après être entré dans Atelier).", a: ["touch liste.txt", "touch"], ph: "une commande", exp: "touch liste.txt crée le fichier vide." },
      { type: "qcm", q: "PowerShell : quelle commande crée le même fichier vide liste.txt ?", opts: ["touch liste.txt", "New-Item liste.txt", "del liste.txt", "md liste.txt"], a: 1, exp: "New-Item liste.txt sous PowerShell." },
      { type: "input", q: "Bash : supprime le fichier liste.txt.", a: ["rm liste.txt", "rm"], ph: "une commande", exp: "rm liste.txt." },
      { type: "qcm", q: "Bash : le dossier Atelier n'est plus vide au départ. Comment le supprimer entièrement ?", opts: ["rmdir Atelier", "rm -r Atelier", "del Atelier", "touch Atelier"], a: 1, exp: "rm -r Atelier supprime le dossier et tout son contenu." }
    ],
    solution: `<pre class="pseudo"># Creer, remplir, puis nettoyer — les trois shells
# Bash (Linux/macOS)
mkdir Atelier            # creer le dossier
touch Atelier/liste.txt  # creer le fichier vide dedans
rm Atelier/liste.txt     # supprimer le fichier
rm -r Atelier            # supprimer le dossier (recursif)
# PowerShell (Windows)
mkdir Atelier
New-Item Atelier\liste.txt
Remove-Item Atelier\liste.txt
Remove-Item Atelier -Recurse
# CMD (Windows)
mkdir Atelier
type nul &gt; Atelier\liste.txt
del Atelier\liste.txt
rmdir /s Atelier
# Rappel : suppression = DEFINITIVE. Verifie le chemin.</pre>
<p>Tu sais créer et détruire proprement. Demain : copier, déplacer et renommer.</p>`
  }
};
</script>
