<script>
var DAY = {
  num: 17,
  title: "Trier, compter, filtrer (sort, uniq, wc)",
  subtitle: "Transformer une liste brute en information exploitable, sous les trois shells.",
  theory: `
<h3>1. Pourquoi trier, compter, filtrer ?</h3>
<p>Une commande produit souvent une longue liste de lignes : des noms, des adresses IP, des chemins de fichiers. Pour en tirer une information, on a trois gestes de base : <strong>trier</strong> (mettre en ordre), <strong>dédupliquer</strong> (supprimer les répétitions), et <strong>compter</strong> (combien de lignes, de mots, d'occurrences). Ces outils se branchent au bout d'un tube (le tube <code>|</code> vu au jour 14) pour construire de vraies analyses.</p>
<div class="tip"><strong>Trier</strong> = réordonner les lignes. <strong>Dédupliquer</strong> = enlever les lignes identiques. <strong>Compter</strong> = obtenir un nombre. Ces trois verbes reviennent sans cesse en ligne de commande.</div>

<h3>2. Trier des lignes : sort</h3>
<p>Par défaut, on trie dans l'ordre <strong>lexicographique</strong> (l'ordre du dictionnaire, caractère par caractère).</p>
<pre class="pseudo"># --- Bash (Linux / macOS) ---
sort noms.txt          # trie les lignes par ordre alphabetique
sort -r noms.txt       # -r = reverse : ordre decroissant
sort -n nombres.txt    # -n = tri NUMERIQUE (2 avant 10, pas l'inverse)
sort -nr nombres.txt   # numerique et decroissant</pre>
<pre class="pseudo"># --- PowerShell (Windows) ---
Get-Content noms.txt | Sort-Object            # tri alphabetique
Get-Content noms.txt | Sort-Object -Descending # ordre decroissant
Get-Content nombres.txt | Sort-Object {[int]$_} # tri numerique</pre>
<pre class="pseudo"># --- CMD (Windows) ---
sort noms.txt          # tri alphabetique
sort /R noms.txt       # /R = ordre decroissant
REM CMD n'a pas de tri numerique dedie : il trie comme du texte</pre>
<div class="warn">Piège classique du tri texte : sans l'option numérique, <code>10</code> arrive AVANT <code>2</code>, parce que le caractère 1 vient avant le caractère 2. Pour des nombres, pense toujours au tri numérique (<code>sort -n</code> en Bash).</div>

<h3>3. Compter : wc et Measure-Object</h3>
<p><code>wc</code> signifie « word count ». Il compte lignes, mots et octets.</p>
<pre class="pseudo"># --- Bash ---
wc notes.txt           # 3 nombres : lignes, mots, octets
wc -l notes.txt        # -l = seulement le nombre de LIGNES
wc -w notes.txt        # -w = seulement le nombre de MOTS</pre>
<pre class="pseudo"># --- PowerShell ---
Get-Content notes.txt | Measure-Object -Line   # nombre de lignes
Get-Content notes.txt | Measure-Object -Word   # nombre de mots
(Get-Content notes.txt).Count                  # autre facon : compte les lignes</pre>
<pre class="pseudo"># --- CMD ---
find /c /v "" notes.txt   REM compte les lignes (astuce : compte celles qui ne sont PAS vides d'une chaine impossible)</pre>
<div class="tip">L'équivalent le plus courant de <code>wc -l</code> est <code>Measure-Object -Line</code> en PowerShell. Sous CMD, la fameuse astuce <code>find /c /v ""</code> compte les lignes (elle demande « compte les lignes qui ne contiennent PAS la chaîne vide », c'est-à-dire toutes).</div>

<h3>4. Dédupliquer : uniq et Get-Unique</h3>
<p><code>uniq</code> supprime les lignes en double... mais <strong>uniquement si elles se suivent</strong>. D'où l'habitude de trier AVANT.</p>
<pre class="pseudo"># --- Bash ---
sort noms.txt | uniq        # trie PUIS supprime les doublons adjacents
sort noms.txt | uniq -c     # -c = compte les occurrences de chaque ligne
sort -u noms.txt            # -u = trie ET deduplique en une fois</pre>
<pre class="pseudo"># --- PowerShell ---
Get-Content noms.txt | Sort-Object | Get-Unique     # trie puis deduplique
Get-Content noms.txt | Select-Object -Unique        # deduplique (sans trier)
Get-Content noms.txt | Group-Object | Select-Object Count, Name  # compte les occurrences</pre>
<pre class="pseudo"># --- CMD ---
REM CMD n'a PAS de commande uniq. On passe par sort puis un traitement manuel,
REM ou on utilise PowerShell. C'est une limite de l'Invite de commandes.</pre>
<div class="warn"><code>uniq</code> seul ne voit que les doublons <strong>consécutifs</strong> : <code>a b a</code> restera <code>a b a</code>. Trie d'abord (<code>sort | uniq</code>) pour regrouper les identiques.</div>

<h3>5. Le combo gagnant : trier + compter les occurrences</h3>
<p>Une des recettes les plus utiles en pratique : établir un <strong>palmarès</strong> (les valeurs les plus fréquentes).</p>
<pre class="pseudo"># --- Bash --- palmares des lignes les plus frequentes
sort acces.log | uniq -c | sort -nr | head
# 1. sort   : regroupe les lignes identiques
# 2. uniq -c: compte chaque groupe
# 3. sort -nr: classe du plus frequent au moins frequent
# 4. head   : garde le haut du classement</pre>
<pre class="pseudo"># --- PowerShell --- meme idee
Get-Content acces.log | Group-Object | Sort-Object Count -Descending | Select-Object -First 10 Count, Name</pre>

<h3>6. Choisir le bon outil</h3>
<pre class="pseudo"># Mettre en ordre                 -> sort / Sort-Object / sort
# Compter les lignes              -> wc -l / Measure-Object -Line / find /c /v ""
# Enlever les doublons            -> sort | uniq / Sort-Object | Get-Unique
# Compter les occurrences         -> uniq -c / Group-Object
# Palmares (top des frequences)   -> sort | uniq -c | sort -nr | head</pre>`,
  exercises: [
    { type: "qcm", q: "Par défaut, <code>sort</code> classe les lignes…", opts: ["Dans un ordre aléatoire", "Dans l'ordre lexicographique (alphabétique, caractère par caractère)", "Par taille de fichier", "Par date"], a: 1, exp: "Le tri par défaut est lexicographique." },
    { type: "input", q: "Bash : quelle commande trie alphabétiquement les lignes du fichier noms.txt ?", a: "sort noms.txt", ph: "sort …", exp: "sort noms.txt classe les lignes par ordre alphabétique." },
    { type: "qcm", q: "Que fait l'option <code>-n</code> de <code>sort</code> en Bash ?", opts: ["Un tri par nom de fichier", "Un tri NUMÉRIQUE (2 avant 10)", "Elle numérote les lignes", "Un tri en ordre inverse"], a: 1, exp: "-n active le tri numérique : 2 vient avant 10." },
    { type: "input", q: "Bash : trie le fichier scores.txt par valeur numérique DÉCROISSANTE (options combinées).", a: ["sort -nr scores.txt", "sort -rn scores.txt"], ph: "sort … scores.txt", exp: "sort -nr : numérique (-n) et décroissant (-r)." },
    { type: "vf", q: "En Bash, <code>uniq</code> supprime toutes les lignes en double, même si elles ne se suivent pas.", a: false, exp: "Faux : uniq ne voit que les doublons ADJACENTS. On trie avant (sort | uniq)." },
    { type: "qcm", q: "Pour compter combien de fois chaque ligne apparaît, on utilise…", opts: ["uniq -c (après un sort)", "wc -w", "sort -r", "head"], a: 0, exp: "sort | uniq -c compte les occurrences de chaque ligne." },
    { type: "input", q: "Bash : quelle commande affiche le nombre de LIGNES du fichier data.txt ?", a: ["wc -l data.txt", "wc -l"], ph: "wc …", exp: "wc -l compte les lignes." },
    { type: "qcm", q: "En PowerShell, quel équivalent proche de <code>wc -l</code> ?", opts: ["Count-Lines", "Measure-Object -Line", "Sort-Object", "Get-Help"], a: 1, exp: "Measure-Object -Line compte les lignes ; (Get-Content x).Count marche aussi." },
    { type: "input", q: "PowerShell : quel cmdlet trie les objets (l'équivalent de sort) ? Donne juste son nom.", a: ["Sort-Object", "sort-object"], ph: "un cmdlet", exp: "Sort-Object est le cmdlet de tri de PowerShell." },
    { type: "qcm", q: "Sous CMD, quelle commande trie un fichier texte ?", opts: ["order", "sort", "arrange", "trier"], a: 1, exp: "CMD dispose aussi d'une commande sort (tri texte, /R pour décroissant)." },
    { type: "vf", q: "CMD (Invite de commandes) possède une commande <code>uniq</code> native pour dédupliquer.", a: false, exp: "Faux : CMD n'a pas de uniq. On passe par PowerShell (Get-Unique) pour cela." },
    { type: "input", q: "Bash : trie noms.txt puis affiche chaque ligne précédée de son nombre d'occurrences (deux commandes reliées par un tube).", a: ["sort noms.txt | uniq -c", "sort noms.txt|uniq -c"], ph: "sort … | uniq …", exp: "sort noms.txt | uniq -c : on trie pour regrouper, puis on compte." },
    { type: "qcm", q: "En PowerShell, quel cmdlet regroupe les valeurs identiques et donne leur nombre ?", opts: ["Sort-Object", "Group-Object", "Measure-Object -Word", "Get-Content"], a: 1, exp: "Group-Object crée un groupe par valeur, avec un champ Count." },
    { type: "qcm", q: "Que fait <code>sort -u fichier.txt</code> en Bash ?", opts: ["Il trie uniquement", "Il trie ET supprime les doublons en une seule commande", "Il compte les lignes uniques", "Il inverse l'ordre"], a: 1, exp: "-u (unique) : sort trie et déduplique d'un coup." },
    { type: "input", q: "Bash : établis le palmarès des lignes les plus fréquentes de acces.log (trier, compter, reclasser du plus fréquent au moins fréquent). Écris la chaîne de commandes.", a: ["sort acces.log | uniq -c | sort -nr", "sort acces.log | uniq -c | sort -rn"], ph: "sort … | uniq -c | sort …", exp: "sort | uniq -c | sort -nr : le classique du top des occurrences." }
  ],
  final: {
    title: "Exercice final — Le palmarès des visiteurs",
    intro: `<p>Un fichier <code>ips.txt</code> contient une adresse IP par ligne, une par visite (avec beaucoup de répétitions). On veut savoir qui vient le plus souvent.</p>`,
    questions: [
      { type: "input", q: "Bash : combien de visites au total (nombre de lignes) ?", a: ["wc -l ips.txt", "wc -l"], ph: "wc …", exp: "wc -l ips.txt donne le total de lignes, donc de visites." },
      { type: "qcm", q: "Pourquoi trie-t-on AVANT d'utiliser uniq ?", opts: ["Pour aller plus vite", "Parce que uniq ne détecte que les doublons qui se suivent", "Parce que uniq l'exige sinon il plante", "Ce n'est pas nécessaire"], a: 1, exp: "uniq ne voit que les doublons adjacents : trier les regroupe." },
      { type: "input", q: "Bash : affiche chaque IP unique précédée de son nombre de visites.", a: ["sort ips.txt | uniq -c", "sort ips.txt|uniq -c"], ph: "sort … | uniq -c", exp: "sort ips.txt | uniq -c compte les occurrences de chaque IP." },
      { type: "input", q: "Bash : complète pour ne garder que les 3 IP les plus fréquentes.", a: ["sort ips.txt | uniq -c | sort -nr | head -n 3", "sort ips.txt | uniq -c | sort -nr | head -3"], ph: "… | sort -nr | head …", exp: "sort -nr classe par fréquence décroissante ; head -n 3 garde le top 3." },
      { type: "qcm", q: "En PowerShell, quelle approche donne le même palmarès ?", opts: ["Get-Content ips.txt | Group-Object | Sort-Object Count -Descending", "Get-Content ips.txt | Measure-Object", "Sort-Object ips.txt", "Get-Unique ips.txt"], a: 0, exp: "Group-Object compte, Sort-Object Count -Descending classe le palmarès." }
    ],
    solution: `<pre class="pseudo"># --- Bash ---
wc -l ips.txt                              # total des visites
sort ips.txt | uniq -c                     # chaque IP + son nombre de visites
sort ips.txt | uniq -c | sort -nr | head -n 3   # top 3 des IP

# --- PowerShell ---
(Get-Content ips.txt).Count                # total des visites
Get-Content ips.txt | Group-Object | Sort-Object Count -Descending | Select-Object -First 3 Count, Name

Trier regroupe, uniq -c compte, sort -nr classe : c'est LA recette du palmares.</pre>
<p>Tu sais transformer une liste brute en classement. Demain : les variables d'environnement et le fameux PATH.</p>`
  }
};
</script>

  ]
};
