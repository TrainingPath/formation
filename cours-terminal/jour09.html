<script>
var DAY = {
  num: 9,
  title: "Lire un fichier (cat, type, less, head, tail)",
  subtitle: "Afficher le contenu d'un fichier texte sans ouvrir d'éditeur.",
  theory: `
<h3>1. Tout afficher d'un coup</h3>
<p>Pour déverser le contenu entier d'un fichier à l'écran, chaque shell a sa commande. Sous Bash c'est <strong>cat</strong> (« concatenate », car elle peut aussi coller plusieurs fichiers bout à bout) ; sous CMD c'est <strong>type</strong> ; sous PowerShell c'est <strong>Get-Content</strong>.</p>
<pre class="pseudo"># Bash (Linux/macOS)
cat notes.txt            # affiche tout le contenu du fichier
# PowerShell (Windows)
Get-Content notes.txt    # (alias : cat, type, gc) affiche le contenu
# CMD (Windows)
type notes.txt           # affiche le contenu du fichier</pre>
<div class="tip">Joli clin d'oeil : sous PowerShell, les alias <code>cat</code> ET <code>type</code> pointent tous les deux vers <code>Get-Content</code>. PowerShell fait ainsi le pont entre le monde Unix et le monde Windows.</div>
<h3>2. Pour un GROS fichier : lire page par page</h3>
<p>Un long fichier affiché d'un coup défile trop vite. On utilise alors un <strong>pageur</strong> (afficheur page par page). Sous Bash c'est <strong>less</strong>.</p>
<pre class="pseudo"># Bash (Linux/macOS)
less journal.log         # ouvre un afficheur navigable (fleches, Espace)
# Dans less :  Espace = page suivante ,  /mot = rechercher ,  q = QUITTER
# PowerShell (Windows)
Get-Content journal.log | more   # « more » comme pageur (Espace, q pour sortir)
# CMD (Windows)
more journal.log         # affiche page par page (Espace pour avancer)</pre>
<div class="warn">Beaucoup de débutants se sentent « bloqués » dans <code>less</code> ou <code>more</code> : la touche <strong>q</strong> permet toujours d'en sortir et de revenir à l'invite.</div>
<h3>3. Juste le début : head</h3>
<p><strong>head</strong> (« tête ») montre les premières lignes seulement — pratique pour jeter un oeil sans tout charger.</p>
<pre class="pseudo"># Bash (Linux/macOS)
head notes.txt           # les 10 PREMIERES lignes (par defaut)
head -n 5 notes.txt      # les 5 premieres lignes
# PowerShell (Windows)
Get-Content notes.txt -Head 5    # -Head 5 : les 5 premieres lignes
# CMD (Windows) : pas de « head » natif — on utilise PowerShell ci-dessus,
# ou une astuce plus avancee. Retiens surtout la version Bash/PowerShell.</pre>
<h3>4. Juste la fin : tail</h3>
<p><strong>tail</strong> (« queue ») montre les dernières lignes — idéal pour voir les entrées les plus récentes d'un journal.</p>
<pre class="pseudo"># Bash (Linux/macOS)
tail notes.txt           # les 10 DERNIERES lignes
tail -n 20 notes.txt     # les 20 dernieres lignes
tail -f journal.log      # -f (follow) : SUIT le fichier en direct (Ctrl+C pour sortir)
# PowerShell (Windows)
Get-Content notes.txt -Tail 20        # -Tail 20 : les 20 dernieres lignes
Get-Content journal.log -Wait         # -Wait : suit le fichier en direct (comme tail -f)</pre>
<div class="tip">Correspondance à retenir : Bash <code>tail -f</code> ≈ PowerShell <code>Get-Content -Wait</code>. Les deux affichent chaque nouvelle ligne au fur et à mesure : l'outil n°1 pour surveiller un journal en temps réel.</div>
<h3>5. La bonne commande selon le besoin</h3>
<pre class="pseudo"># Petit fichier, tout voir     Bash cat | PS Get-Content | CMD type
# Gros fichier, naviguer       Bash less (q pour sortir) | CMD more
# Juste le debut               Bash head | PS Get-Content -Head N
# Juste la fin                 Bash tail | PS Get-Content -Tail N
# Suivre un log en direct      Bash tail -f | PS Get-Content -Wait</pre>`,
  exercises: [
    { type: "input", q: "Quelle commande Bash affiche TOUT le contenu de notes.txt d'un coup ?", a: ["cat notes.txt", "cat"], ph: "une commande", exp: "cat déverse tout le fichier à l'écran." },
    { type: "qcm", q: "Sous CMD, quelle commande affiche le contenu d'un fichier ?", opts: ["cat", "type", "less", "Get-Content"], a: 1, exp: "type affiche le contenu sous CMD." },
    { type: "input", q: "Quelle est la vraie commande PowerShell (Verbe-Nom) pour afficher le contenu d'un fichier ?", a: ["get-content", "gc"], ph: "Verbe-Nom", exp: "Get-Content ; alias cat, type, gc." },
    { type: "qcm", q: "Pour lire un GROS fichier page par page sous Bash, on utilise…", opts: ["cat", "less", "touch", "rm"], a: 1, exp: "less est un pageur : navigation confortable." },
    { type: "input", q: "Dans less (ou more), quelle touche permet de QUITTER ?", a: ["q"], ph: "une touche", exp: "q ferme le pageur et revient à l'invite." },
    { type: "qcm", q: "<code>head notes.txt</code> (sans option) affiche…", opts: ["Tout le fichier", "Les 10 premières lignes", "La dernière ligne", "Le nombre de lignes"], a: 1, exp: "head = les 10 premières lignes par défaut." },
    { type: "input", q: "Quelle commande Bash affiche les 10 DERNIÈRES lignes d'un fichier ?", a: ["tail", "tail notes.txt"], ph: "une commande", exp: "tail montre la fin du fichier." },
    { type: "qcm", q: "À quoi sert <code>tail -f journal.log</code> ?", opts: ["À le supprimer", "À SUIVRE le fichier en direct (chaque nouvelle ligne s'affiche)", "À compter les lignes", "À le copier"], a: 1, exp: "-f (follow) : surveillance temps réel, Ctrl+C pour sortir." },
    { type: "input", q: "Sous PowerShell, quel paramètre de Get-Content affiche les 5 PREMIÈRES lignes (comme head) ?", a: ["-head", "-head 5", "head"], ph: "-…", exp: "Get-Content fichier -Head 5." },
    { type: "qcm", q: "Sous PowerShell, quel paramètre affiche les DERNIÈRES lignes (comme tail) ?", opts: ["-Head", "-Tail", "-f", "-End"], a: 1, exp: "Get-Content fichier -Tail N." },
    { type: "qcm", q: "L'équivalent PowerShell de <code>tail -f</code> (suivi en direct) est…", opts: ["Get-Content -Head", "Get-Content -Wait", "Get-Content -Tail 0", "more"], a: 1, exp: "Get-Content -Wait suit le fichier comme tail -f." },
    { type: "vf", q: "Sous PowerShell, les alias cat et type pointent tous deux vers Get-Content.", a: true, exp: "Oui : PowerShell relie les mondes Unix (cat) et Windows (type)." },
    { type: "qcm", q: "Pourquoi cat s'appelle « cat » (concatenate) ?", opts: ["Il compresse", "Il peut afficher plusieurs fichiers à la suite (les concaténer)", "Il chiffre", "Il compte"], a: 1, exp: "cat a.txt b.txt affiche a puis b, bout à bout." },
    { type: "input", q: "Sous Bash, quelle commande affiche les 5 premières lignes (avec option -n) ?", a: ["head -n 5", "head -5", "head -n 5 notes.txt", "head -5 notes.txt"], ph: "head …", exp: "head -n 5 limite aux 5 premières lignes." },
    { type: "qcm", q: "Tu ouvres un log de 50 000 lignes sous Bash. Le meilleur choix ?", opts: ["cat (tout défile)", "less (navigation, recherche, q pour sortir)", "touch", "rm"], a: 1, exp: "less permet d'explorer sans tout faire défiler." }
  ],
  final: {
    title: "Exercice final — Explorer un journal",
    intro: `<p>Le fichier <code>acces.log</code> contient 1 000 lignes. Tu veux l'examiner de plusieurs façons, dans le bon shell.</p>`,
    questions: [
      { type: "input", q: "Bash : affiche les 3 premières lignes.", a: ["head -n 3 acces.log", "head -3 acces.log", "head -n 3", "head -3"], ph: "head …", exp: "head -n 3 acces.log." },
      { type: "input", q: "Bash : affiche les 10 dernières lignes.", a: ["tail acces.log", "tail", "tail -n 10 acces.log"], ph: "une commande", exp: "tail montre les 10 dernières lignes par défaut." },
      { type: "qcm", q: "Bash : le fichier grossit en direct ; comment suivre les nouvelles lignes ?", opts: ["cat acces.log", "tail -f acces.log", "head acces.log", "rm acces.log"], a: 1, exp: "tail -f suit le fichier en temps réel." },
      { type: "input", q: "PowerShell : affiche les 20 dernières lignes de acces.log.", a: ["get-content acces.log -tail 20", "gc acces.log -tail 20"], ph: "Get-Content …", exp: "Get-Content acces.log -Tail 20." },
      { type: "qcm", q: "CMD : quelle commande affiche le fichier page par page ?", opts: ["type acces.log", "more acces.log", "less acces.log", "cat acces.log"], a: 1, exp: "more affiche page par page sous CMD (q pour sortir)." }
    ],
    solution: `<pre class="pseudo"># Explorer acces.log — les trois shells
# Bash (Linux/macOS)
head -n 3 acces.log       # 3 premieres lignes
tail acces.log            # 10 dernieres lignes
tail -f acces.log         # suivi en direct (Ctrl+C pour sortir)
less acces.log            # navigation + /mot pour chercher (q pour quitter)
# PowerShell (Windows)
Get-Content acces.log -Head 3     # 3 premieres lignes
Get-Content acces.log -Tail 20    # 20 dernieres lignes
Get-Content acces.log -Wait       # suivi en direct
# CMD (Windows)
type acces.log            # tout d'un coup
more acces.log            # page par page (q pour sortir)</pre>
<p>Tu explores n'importe quel fichier avec le bon outil. Demain : trouver de l'aide sur toutes ces commandes.</p>`
  }
};
</script>

};
