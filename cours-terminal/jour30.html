<script>
var DAY = {
  num: 30,
  title: "Bonnes pratiques et productivité au quotidien",
  subtitle: "Les réflexes qui rendent rapide, efficace et sûr dans le terminal.",
  theory: `
<h3>1. Aller vite sans se tromper</h3>
<p>Maîtriser le terminal, ce n'est pas connaître mille commandes : c'est avoir de <strong>bons réflexes</strong>. Ce jour rassemble les habitudes des utilisateurs expérimentés : gagner du temps, éviter les erreurs, garder un environnement propre. Rien de nouveau techniquement, mais l'art de bien s'en servir.</p>

<h3>2. Les raccourcis qui changent la vie</h3>
<pre class="pseudo"># --- Communs aux trois shells (ou tres proches) ---
# Fleche Haut / Bas : rappeler les commandes precedentes
# Tab               : AUTOCOMPLETION (noms de fichiers, commandes)
# Ctrl + C          : interrompre la commande en cours
# Ctrl + L          : effacer l'ecran (equivalent de clear / cls)
# Ctrl + A / Ctrl + E : debut / fin de ligne (Bash, PowerShell)
# Ctrl + R          : RECHERCHER dans l'historique (Bash) - tres puissant</pre>
<div class="tip">La touche <strong>Tab</strong> et la <strong>flèche Haut</strong> sont tes deux meilleures amies : elles évitent de retaper et de se tromper dans les noms. <code>Ctrl+R</code> (Bash) retrouve une vieille commande en tapant quelques lettres.</div>

<h3>3. Consulter et réutiliser l'historique</h3>
<pre class="pseudo"># --- Bash ---
history            # liste les commandes deja tapees (numerotees)
history | grep git # retrouver toutes les commandes git passees
!!                 # rejoue la DERNIERE commande
sudo !!            # rejoue la derniere commande, cette fois en sudo</pre>
<pre class="pseudo"># --- PowerShell ---
Get-History        # historique de la session
h                  # alias de Get-History
# (fleche Haut et Ctrl+R fonctionnent aussi)</pre>
<div class="tip">L'astuce <code>sudo !!</code> est un grand classique : tu tapes une commande, elle échoue faute de droits, tu relances la même en administrateur d'un seul geste.</div>

<h3>4. Les filets de sécurité</h3>
<pre class="pseudo"># --- Bash --- rendre les commandes destructrices moins dangereuses
alias rm='rm -i'   # -i = demande confirmation avant chaque suppression
alias cp='cp -i'   # confirmation avant d'ecraser un fichier
alias mv='mv -i'
# a placer dans ~/.bashrc pour un effet permanent</pre>
<div class="warn">Règles d'or de la sécurité : (1) réfléchis à deux fois avant <code>rm -rf</code> ; (2) teste une commande destructrice avec <code>ls</code> ou <code>echo</code> AVANT de l'exécuter pour de vrai ; (3) méfie-toi des jokers (<code>*</code>) : <code>rm * .txt</code> avec une espace de trop efface TOUT. La lenteur prudente bat la vitesse imprudente.</div>

<h3>5. Écrire des scripts et des noms propres</h3>
<pre class="pseudo"># --- Bonnes habitudes de scripting ---
#!/bin/bash                  # toujours le shebang
# commenter ce que fait le script et pourquoi
set -e                       # Bash : stoppe le script des la 1ere erreur
d=$(date +%Y-%m-%d)          # horodater : noms de fichiers dates et triables
# noms clairs : sauvegarde-documents-2026-07-26.tar.gz  (pas "truc2.tar.gz")</pre>
<div class="tip">Trois habitudes en or : <strong>commenter</strong> (le futur toi lira ton script), <strong>horodater</strong> les fichiers générés (année-mois-jour se trie tout seul), et <strong>nommer clairement</strong> (un nom parlant vaut mille souvenirs). En Bash, <code>set -e</code> arrête le script à la première erreur : plus sûr.</div>

<h3>6. Trouver de l'aide, garder un mémo</h3>
<pre class="pseudo"># --- Se documenter (rappel des jours precedents) ---
man commande       # Bash : manuel complet (q pour quitter)
commande --help    # aide rapide (marche presque partout)
Get-Help cmdlet    # PowerShell : aide detaillee (-Examples pour des exemples)
# --- Se faire un fichier d'antiseches ---
# note tes commandes utiles dans un ~/aide-memoire.txt : gain de temps enorme</pre>
<div class="tip">Personne ne retient tout : les pros gardent un <strong>aide-mémoire</strong> personnel (un simple fichier texte) avec leurs commandes favorites. C'est la marque des gens efficaces, pas des débutants.</div>

<h3>7. Récapitulatif des réflexes</h3>
<pre class="pseudo"># Vitesse   : Tab (completer), fleche Haut (rappeler), Ctrl+R (chercher)
# Historique: history / Get-History, !! (rejouer), sudo !!
# Securite  : alias rm='rm -i', tester avec ls/echo avant, attention aux *
# Scripts   : shebang, commentaires, set -e, noms dates et clairs
# Aide      : man / --help / Get-Help, et un aide-memoire perso</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle touche complète automatiquement un nom de fichier ou de commande ?", opts: ["Entrée", "Tab", "Échap", "Ctrl"], a: 1, exp: "Tab déclenche l'autocomplétion : moins de frappe, moins d'erreurs." },
    { type: "qcm", q: "Que fait la flèche Haut dans le terminal ?", opts: ["Efface l'écran", "Rappelle les commandes précédemment tapées", "Ferme le terminal", "Change de dossier"], a: 1, exp: "La flèche Haut parcourt l'historique des commandes." },
    { type: "input", q: "Bash : quelle commande affiche l'historique des commandes tapées ?", a: ["history"], ph: "une commande", exp: "history liste les commandes déjà exécutées (numérotées)." },
    { type: "qcm", q: "Que fait <code>!!</code> en Bash ?", opts: ["Efface l'historique", "Rejoue la dernière commande", "Ouvre l'aide", "Quitte le shell"], a: 1, exp: "!! rejoue la dernière commande ; sudo !! la relance en administrateur." },
    { type: "input", q: "Bash : retrouve dans l'historique toutes les commandes contenant « git » (history relié à grep).", a: ["history | grep git", "history|grep git"], ph: "history | grep …", exp: "history | grep git filtre l'historique." },
    { type: "qcm", q: "À quoi sert <code>Ctrl + R</code> en Bash ?", opts: ["À redémarrer", "À rechercher interactivement dans l'historique", "À rafraîchir l'écran", "À supprimer une ligne"], a: 1, exp: "Ctrl+R lance une recherche incrémentale dans l'historique." },
    { type: "qcm", q: "Pourquoi créer l'alias <code>rm='rm -i'</code> ?", opts: ["Pour supprimer plus vite", "Pour demander une confirmation avant chaque suppression (filet de sécurité)", "Pour chiffrer les fichiers", "Pour les compresser"], a: 1, exp: "-i demande confirmation : on évite les effacements accidentels." },
    { type: "vf", q: "Il est prudent de tester une commande destructrice avec <code>ls</code> ou <code>echo</code> avant de l'exécuter vraiment.", a: true, exp: "Vrai : voir ce que la commande viserait AVANT d'agir évite les catastrophes." },
    { type: "qcm", q: "Pourquoi se méfier de <code>rm * .txt</code> (avec une espace de trop) ?", opts: ["Ça ne fait rien", "L'espace transforme la commande : <code>*</code> vise TOUT, effacement massif", "C'est plus rapide", "Ça compresse les .txt"], a: 1, exp: "Une espace mal placée avec un joker peut tout effacer : vigilance." },
    { type: "input", q: "Bash : quelle ligne, en tête de script, arrête l'exécution dès la première erreur ?", a: ["set -e"], ph: "set …", exp: "set -e stoppe le script à la première commande qui échoue." },
    { type: "qcm", q: "Pourquoi horodater les fichiers générés (ex. rapport-2026-07-26.txt) ?", opts: ["Pour les chiffrer", "Pour qu'ils soient uniques et se trient chronologiquement tout seuls", "Pour aller plus vite", "C'est obligatoire"], a: 1, exp: "Un nom en année-mois-jour se trie naturellement et n'écrase rien." },
    { type: "qcm", q: "Quelle est une bonne habitude de scripting ?", opts: ["Ne jamais commenter", "Commenter, nommer clairement, mettre un shebang", "Utiliser des noms comme truc2.sh", "Éviter les tests"], a: 1, exp: "Commentaires, noms clairs et shebang rendent un script lisible et fiable." },
    { type: "input", q: "PowerShell : quel cmdlet affiche l'historique de la session ? (donne son nom)", a: ["Get-History", "get-history"], ph: "Get-…", exp: "Get-History (alias h) liste les commandes de la session." },
    { type: "input", q: "Quel raccourci clavier interrompt une commande en cours d'exécution ? (écris-le, ex. Ctrl+X)", a: ["Ctrl+C", "ctrl+c", "Ctrl + C"], ph: "Ctrl+…", exp: "Ctrl+C interrompt la commande active." },
    { type: "qcm", q: "Quelle est la marque d'un utilisateur efficace du terminal ?", opts: ["Tout retenir par cœur", "Garder un aide-mémoire personnel de ses commandes favorites", "Ne jamais utiliser l'aide", "Taper le plus vite possible sans réfléchir"], a: 1, exp: "Un aide-mémoire perso fait gagner un temps précieux : personne ne retient tout." }
  ],
  final: {
    title: "Exercice final — Rendre son terminal sûr et rapide",
    intro: `<p>Tu veux configurer ton environnement pour travailler vite ET sans danger : des filets de sécurité, de bons réflexes d'historique, et des habitudes de scripting propres.</p>`,
    questions: [
      { type: "input", q: "Bash : quel alias ajouter dans ~/.bashrc pour que rm demande confirmation ?", a: ["alias rm='rm -i'", "alias rm=\"rm -i\""], ph: "alias rm=…", exp: "alias rm='rm -i' active la confirmation avant suppression." },
      { type: "qcm", q: "Avant de lancer <code>rm *.log</code>, quel réflexe prudent ?", opts: ["Rien", "Faire d'abord <code>ls *.log</code> pour voir ce qui serait supprimé", "Doubler la commande", "Éteindre l'écran"], a: 1, exp: "ls *.log montre la liste visée avant d'effacer pour de vrai." },
      { type: "input", q: "Bash : retrouve dans l'historique toutes tes commandes tar (history + grep).", a: ["history | grep tar", "history|grep tar"], ph: "history | grep …", exp: "history | grep tar filtre l'historique sur tar." },
      { type: "input", q: "Bash : quelle ligne en tête de script le fait s'arrêter à la première erreur ?", a: ["set -e"], ph: "set …", exp: "set -e = arrêt immédiat en cas d'échec d'une commande." },
      { type: "qcm", q: "Pour nommer un fichier de sauvegarde généré par script, le mieux est…", opts: ["backup.tar.gz (toujours le même nom)", "sauvegarde-2026-07-26.tar.gz (horodaté, clair)", "truc.tar.gz", "s.tar.gz"], a: 1, exp: "Un nom daté et parlant est unique, triable et compréhensible plus tard." }
    ],
    solution: `<pre class="pseudo"># --- Dans ~/.bashrc : filets de securite ---
alias rm='rm -i'      # confirmation avant suppression
alias cp='cp -i'
alias mv='mv -i'

# --- Reflexes au quotidien ---
ls *.log              # VOIR avant de supprimer  rm *.log
history | grep tar    # retrouver une commande passee
Ctrl+R                # rechercher dans l'historique (Bash)
sudo !!               # relancer la derniere commande en admin

# --- Habitudes de scripting ---
#!/bin/bash
set -e                # stoppe des la premiere erreur
d=$(date +%Y-%m-%d)   # horodater
# nom clair : sauvegarde-documents-$d.tar.gz</pre>
<p>Tu as les réflexes des utilisateurs aguerris : rapide, propre, prudent. Demain, le grand jour : le projet final qui met tout en musique.</p>`
  }
};
</script>
