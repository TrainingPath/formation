<script>
var DAY = {
  num: 8,
  title: "Copier, déplacer, renommer",
  subtitle: "Dupliquer un fichier, le ranger ailleurs, ou changer son nom.",
  theory: `
<h3>1. Trois actions, une même logique : source puis destination</h3>
<p>Copier, déplacer et renommer suivent tous le même schéma : on indique d'abord la <strong>source</strong> (ce qu'on prend), puis la <strong>destination</strong> (où on le met ou comment on le nomme). Comme un déménageur : « prends CE carton, mets-le DANS cette pièce ».</p>
<pre class="pseudo"># Schema commun :   commande   SOURCE   DESTINATION</pre>
<h3>2. Copier (dupliquer)</h3>
<p>Copier crée un <strong>double</strong> : l'original reste en place.</p>
<pre class="pseudo"># Bash (Linux/macOS)
cp notes.txt copie.txt          # « copy » : duplique le fichier
cp notes.txt Documents/         # copie notes.txt DANS le dossier Documents
cp -r Projets Sauvegarde        # -r : copie un DOSSIER et tout son contenu
# PowerShell (Windows)
Copy-Item notes.txt copie.txt   # (alias : cp, copy)
Copy-Item Projets Sauvegarde -Recurse   # -Recurse pour un dossier
# CMD (Windows)
copy notes.txt copie.txt        # copie un fichier
xcopy /e /i Projets Sauvegarde  # xcopy pour copier un dossier et son contenu</pre>
<h3>3. Déplacer (ranger ailleurs)</h3>
<p>Déplacer <strong>transfère</strong> le fichier : il disparaît de l'endroit d'origine et réapparaît à destination. L'original ne reste PAS.</p>
<pre class="pseudo"># Bash (Linux/macOS)
mv notes.txt Documents/         # « move » : deplace notes.txt vers Documents
# PowerShell (Windows)
Move-Item notes.txt Documents\  # (alias : mv, move)
# CMD (Windows)
move notes.txt Documents\       # deplace le fichier</pre>
<h3>4. Renommer : un déplacement « sur place »</h3>
<p>Subtilité élégante : <strong>renommer, c'est déplacer vers un nouveau nom</strong> au même endroit. La même commande sert donc aux deux usages.</p>
<pre class="pseudo"># Bash (Linux/macOS)
mv ancien.txt nouveau.txt       # renomme : meme dossier, nouveau nom
# PowerShell (Windows)
Rename-Item ancien.txt nouveau.txt   # commande dediee (ou Move-Item)
# CMD (Windows)
ren ancien.txt nouveau.txt      # « rename » : renomme le fichier</pre>
<div class="tip">Sous Bash, il n'existe pas de commande « rename » de base : on renomme avec <code>mv</code>. Sous PowerShell et CMD, il existe en plus une commande dédiée (<code>Rename-Item</code>, <code>ren</code>), mais <code>Move-Item</code>/<code>move</code> peuvent aussi renommer.</div>
<h3>5. Le grand piège : écraser sans prévenir</h3>
<p>Si la destination existe déjà, elle peut être <strong>écrasée silencieusement</strong> (remplacée sans avertissement).</p>
<pre class="pseudo"># Bash : demander confirmation avant d'ecraser
cp -i notes.txt copie.txt       # -i (interactif) : demande avant d'ecraser
mv -i a.txt b.txt               # idem pour deplacer/renommer
# PowerShell : par defaut, previent souvent ; -Force force sans question
Copy-Item a.txt b.txt -Force    # -Force ecrase sans demander (attention !)
# CMD : copy demande souvent ; /y force l'ecrasement sans question
copy /y a.txt b.txt             # /y : ecrase sans confirmation</pre>
<div class="warn">Écraser un fichier est irréversible. Sous Bash, prends l'habitude de <code>-i</code> (interactif) pour les opérations risquées. Ne mets <code>-Force</code> (PowerShell) ou <code>/y</code> (CMD) que si tu es certain de vouloir remplacer.</div>
<h3>6. Récapitulatif</h3>
<pre class="pseudo"># Action     Bash        PowerShell     CMD
# Copier     cp          Copy-Item      copy   (dossier : xcopy)
# Deplacer   mv          Move-Item      move
# Renommer   mv          Rename-Item    ren
# Dossier    ajouter -r  ajouter -Recurse   xcopy /e /i (copie)</pre>`,
  exercises: [
    { type: "input", q: "Quelle commande Bash copie notes.txt en copie.txt ?", a: ["cp notes.txt copie.txt", "cp"], ph: "cp …", exp: "cp source destination duplique le fichier." },
    { type: "qcm", q: "Que fait la copie à l'original ?", opts: ["Elle le supprime", "Elle le laisse en place et crée un double", "Elle le renomme", "Elle le cache"], a: 1, exp: "Copier crée un double ; l'original reste." },
    { type: "input", q: "Quelle commande Bash déplace notes.txt dans le dossier Documents ?", a: ["mv notes.txt documents/", "mv notes.txt documents", "mv notes.txt Documents/", "mv notes.txt Documents"], ph: "mv …", exp: "mv notes.txt Documents/ transfère le fichier." },
    { type: "qcm", q: "Que fait le déplacement à l'original ?", opts: ["Il le laisse en double", "Il le transfère : l'original disparaît de l'endroit de départ", "Il le copie deux fois", "Il le laisse intact à sa place de départ"], a: 1, exp: "mv transfère : le fichier n'est plus à l'emplacement d'origine." },
    { type: "input", q: "Sous Bash, avec quelle commande renomme-t-on ancien.txt en nouveau.txt ?", a: ["mv ancien.txt nouveau.txt", "mv"], ph: "une commande", exp: "Sous Bash, on renomme avec mv (déplacement sur place)." },
    { type: "vf", q: "Sous Bash, renommer un fichier revient à le déplacer vers un nouveau nom avec mv.", a: true, exp: "Oui : renommer = déplacer au même endroit sous un autre nom." },
    { type: "qcm", q: "Sous CMD, quelle commande renomme un fichier ?", opts: ["mv", "ren", "Rename-Item", "cp"], a: 1, exp: "ren (rename) renomme sous CMD." },
    { type: "input", q: "Quelle est la vraie commande PowerShell (Verbe-Nom) pour renommer un fichier ?", a: ["rename-item", "rename-item ancien.txt nouveau.txt"], ph: "Verbe-Nom", exp: "Rename-Item est la commande dédiée." },
    { type: "input", q: "Sous Bash, quelle option de cp permet de copier un DOSSIER et tout son contenu ?", a: ["-r", "r"], ph: "-…", exp: "cp -r copie récursivement un dossier." },
    { type: "qcm", q: "Sous PowerShell, quel paramètre copie un dossier et son contenu ?", opts: ["-r", "-Recurse", "/e", "-All"], a: 1, exp: "Copy-Item ... -Recurse." },
    { type: "qcm", q: "Sous CMD, quelle commande copie un dossier entier avec son contenu ?", opts: ["copy", "xcopy /e /i", "move", "ren"], a: 1, exp: "xcopy /e /i copie l'arborescence complète." },
    { type: "qcm", q: "Sous Bash, quelle option demande confirmation avant d'écraser un fichier existant ?", opts: ["-f", "-i (interactif)", "-r", "-y"], a: 1, exp: "cp -i / mv -i demandent avant d'écraser." },
    { type: "qcm", q: "Sous CMD, quelle option de copy écrase sans poser de question ?", opts: ["/i", "/y", "/e", "-Force"], a: 1, exp: "copy /y force l'écrasement sans confirmation." },
    { type: "vf", q: "Si la destination existe déjà, l'écrasement peut se faire silencieusement et est irréversible.", a: true, exp: "Oui : d'où l'intérêt de -i (Bash) et la prudence avec -Force / /y." },
    { type: "input", q: "Quelle est la vraie commande PowerShell (Verbe-Nom) pour déplacer un fichier ?", a: ["move-item", "move-item notes.txt documents"], ph: "Verbe-Nom", exp: "Move-Item ; alias mv et move." }
  ],
  final: {
    title: "Exercice final — Copier, ranger, renommer",
    intro: `<p>Tu as un fichier <code>rapport.txt</code>. Objectifs : en garder une copie de sauvegarde, ranger l'original dans <code>Archive</code>, puis renommer la copie. Donne les commandes.</p>`,
    questions: [
      { type: "input", q: "Bash : crée une copie de sauvegarde nommée rapport-sauve.txt.", a: ["cp rapport.txt rapport-sauve.txt", "cp"], ph: "cp …", exp: "cp rapport.txt rapport-sauve.txt." },
      { type: "input", q: "Bash : déplace l'original rapport.txt dans le dossier Archive.", a: ["mv rapport.txt archive/", "mv rapport.txt archive", "mv rapport.txt Archive/", "mv rapport.txt Archive"], ph: "mv …", exp: "mv rapport.txt Archive/." },
      { type: "input", q: "Bash : renomme rapport-sauve.txt en backup.txt.", a: ["mv rapport-sauve.txt backup.txt", "mv"], ph: "mv …", exp: "Renommer = mv vers un nouveau nom." },
      { type: "qcm", q: "PowerShell : quelle commande dédiée renomme un fichier ?", opts: ["ren", "Rename-Item", "mv", "cp"], a: 1, exp: "Rename-Item sous PowerShell." },
      { type: "qcm", q: "Pour éviter d'écraser une sauvegarde existante sous Bash, on ajoute…", opts: ["-f", "-i (confirmation)", "/y", "-Recurse"], a: 1, exp: "-i demande confirmation avant d'écraser." }
    ],
    solution: `<pre class="pseudo"># Copier, ranger, renommer — les trois shells
# Bash (Linux/macOS)
cp rapport.txt rapport-sauve.txt   # copie de sauvegarde
mv rapport.txt Archive/            # ranger l'original dans Archive
mv rapport-sauve.txt backup.txt    # renommer la copie
# PowerShell (Windows)
Copy-Item rapport.txt rapport-sauve.txt
Move-Item rapport.txt Archive\
Rename-Item rapport-sauve.txt backup.txt
# CMD (Windows)
copy rapport.txt rapport-sauve.txt
move rapport.txt Archive\
ren rapport-sauve.txt backup.txt
# Schema partout : commande  SOURCE  DESTINATION. Gare a l'ecrasement.</pre>
<p>Tu manipules les fichiers avec aisance. Demain : lire leur contenu sans les ouvrir dans un éditeur.</p>`
  }
};
</script>
