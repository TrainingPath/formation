<script>
var DAY = {
  num: 27,
  title: "Variables, conditions et boucles dans un script",
  subtitle: "Donner de l'intelligence à un script : mémoriser, décider, répéter.",
  theory: `
<h3>1. Les trois briques de tout script</h3>
<p>Un script utile sait faire trois choses : <strong>mémoriser</strong> une valeur (variable), <strong>décider</strong> selon une condition (if), et <strong>répéter</strong> une action (boucle). Ces briques existent dans Bash comme dans PowerShell, mais avec une <strong>syntaxe différente</strong> : c'est tout l'enjeu du jour. CMD, lui, est trop limité : on se concentre sur Bash et PowerShell.</p>

<h3>2. Les variables : attention aux espaces</h3>
<pre class="pseudo"># --- Bash --- PAS d'espaces autour du =
nom="Alice"                # affectation : nom vaut "Alice"
age=30
echo "Bonjour $nom"        # lecture : $nom (guillemets doubles pour interpoler)
echo "Age : $age ans"</pre>
<pre class="pseudo"># --- PowerShell --- le nom commence par $, espaces autorises
$nom = "Alice"             # $nom = valeur (espaces autour du = acceptes)
$age = 30
Write-Output "Bonjour $nom"
Write-Output "Age : $age ans"</pre>
<div class="warn">Différence à graver : en <strong>Bash</strong>, on écrit <code>nom=valeur</code> <strong>sans espace</strong> autour du <code>=</code> (un espace casse tout). En <strong>PowerShell</strong>, la variable porte un <code>$</code> jusque dans l'affectation (<code>$nom = valeur</code>) et les espaces sont permis.</div>

<h3>3. Capturer le résultat d'une commande</h3>
<pre class="pseudo"># --- Bash --- $(...) execute une commande et recupere sa sortie
aujourdhui=$(date +%Y-%m-%d)     # aujourdhui = "2026-07-26"
echo "Nous sommes le $aujourdhui"</pre>
<pre class="pseudo"># --- PowerShell --- $(...) aussi, ou affectation directe
$aujourdhui = Get-Date -Format "yyyy-MM-dd"
Write-Output "Nous sommes le $aujourdhui"</pre>
<div class="tip">La construction <code>$(...)</code> (substitution de commande) est commune aux deux : elle « injecte » le résultat d'une commande dans une variable ou une chaîne. Très pratique pour horodater un nom de fichier (projet final !).</div>

<h3>4. Les conditions : if</h3>
<pre class="pseudo"># --- Bash --- crochets [ ] et mots-cles then / fi
if [ "$age" -ge 18 ]; then       # -ge = greater or equal (superieur ou egal)
  echo "Majeur"
else
  echo "Mineur"
fi                                # "fi" ferme le if (if a l'envers)</pre>
<pre class="pseudo"># --- PowerShell --- parentheses ( ) et accolades { }
if ($age -ge 18) {               # memes operateurs -ge, -lt, -eq...
  Write-Output "Majeur"
} else {
  Write-Output "Mineur"
}</pre>
<div class="tip">Bonne surprise : les deux partagent des opérateurs comme <code>-ge</code> (&gt;=), <code>-lt</code> (&lt;), <code>-eq</code> (=). Mais la structure diffère : Bash utilise <code>[ ]</code> + <code>then</code> + <code>fi</code> ; PowerShell utilise <code>( )</code> + accolades <code>{ }</code>. En Bash, garde les guillemets autour des variables dans le test.</div>

<h3>5. Tester un fichier, et les boucles</h3>
<pre class="pseudo"># --- Bash --- tester l'existence d'un fichier
if [ -f "rapport.txt" ]; then echo "Le fichier existe"; fi   # -f = fichier existe
# boucle FOR sur des fichiers
for f in *.txt; do
  echo "Traitement de $f"
done                              # "done" ferme le for</pre>
<pre class="pseudo"># --- PowerShell --- tester l'existence
if (Test-Path "rapport.txt") { Write-Output "Le fichier existe" }
# boucle foreach sur des fichiers
foreach ($f in Get-ChildItem *.txt) {
  Write-Output "Traitement de $($f.Name)"
}</pre>
<div class="warn">Piège Bash : la boucle se ferme avec <code>done</code>, le if avec <code>fi</code> (le mot à l'envers). Oublier ces mots de fermeture est l'erreur n°1 du débutant. En PowerShell, tout se ferme par des accolades <code>{ }</code>, plus familières.</div>

<h3>6. Récapitulatif Bash vs PowerShell</h3>
<pre class="pseudo"># Variable   : nom="val"           |  $nom = "val"
# Lire       : $nom                |  $nom
# Commande   : var=$(commande)     |  $var = (commande)
# Condition  : if [ ... ]; then ... fi  |  if (...) { ... }
# Operateurs : -eq -ge -lt (communs aux deux)
# Boucle     : for x in ...; do ... done |  foreach ($x in ...) { ... }
# Fermeture  : then/fi, do/done    |  accolades { }</pre>`,
  exercises: [
    { type: "qcm", q: "Quelles sont les trois briques de base d'un script ?", opts: ["Copier, coller, supprimer", "Mémoriser (variable), décider (condition), répéter (boucle)", "Lire, écrire, imprimer", "Ping, curl, ssh"], a: 1, exp: "Variable, condition et boucle sont les fondations d'un script." },
    { type: "input", q: "Bash : affecte la valeur Alice à la variable nom (respecte la règle des espaces).", a: ["nom=\"Alice\"", "nom=Alice", "nom='Alice'"], ph: "nom=…", exp: "En Bash, pas d'espace autour du = : nom=\"Alice\"." },
    { type: "vf", q: "En Bash, on peut mettre des espaces autour du = dans une affectation (ex. <code>nom = Alice</code>).", a: false, exp: "Faux : en Bash, aucun espace autour du =. C'est nom=Alice, sinon erreur." },
    { type: "input", q: "PowerShell : affecte la valeur Alice à la variable nom.", a: ["$nom = \"Alice\"", "$nom=\"Alice\"", "$nom = 'Alice'", "$nom='Alice'"], ph: "$nom = …", exp: "En PowerShell : $nom = \"Alice\" (le $ fait partie du nom, espaces permis)." },
    { type: "qcm", q: "En Bash, comment lit-on la valeur de la variable nom ?", opts: ["nom", "$nom", "%nom%", "&nom"], a: 1, exp: "On lit une variable Bash avec $nom." },
    { type: "qcm", q: "Que fait la construction <code>$(date)</code> ?", opts: ["Affiche le mot date", "Exécute la commande date et récupère son résultat", "Crée un fichier date", "Rien"], a: 1, exp: "$(...) exécute une commande et injecte sa sortie." },
    { type: "input", q: "Bash : stocke la date du jour (format AAAA-MM-JJ) dans une variable <code>d</code> via une substitution de commande.", a: ["d=$(date +%Y-%m-%d)", "d=$(date +\"%Y-%m-%d\")"], ph: "d=$(date +%Y-%m-%d)", exp: "d=$(date +%Y-%m-%d) capture la date formatée." },
    { type: "qcm", q: "En Bash, quel opérateur signifie « supérieur ou égal » dans un test ?", opts: ["-gt", "-ge", "-eq", "-lt"], a: 1, exp: "-ge = greater or equal (&gt;=). -gt = strictement supérieur." },
    { type: "qcm", q: "Comment se ferme un bloc <code>if</code> en Bash ?", opts: ["end", "endif", "fi", "}"], a: 2, exp: "Le if Bash se ferme par fi (le mot à l'envers)." },
    { type: "qcm", q: "Comment se ferme une boucle <code>for</code> en Bash ?", opts: ["done", "end", "next", "}"], a: 0, exp: "La boucle for Bash se ferme par done." },
    { type: "input", q: "Bash : écris le test qui vérifie que le fichier rapport.txt existe (option -f, entre crochets, avec guillemets).", a: ["[ -f \"rapport.txt\" ]", "[ -f rapport.txt ]"], ph: "[ -f \"…\" ]", exp: "[ -f \"rapport.txt\" ] est vrai si le fichier existe." },
    { type: "qcm", q: "En PowerShell, comment teste-t-on l'existence d'un fichier ?", opts: ["[ -f fichier ]", "Test-Path \"fichier\"", "if exist", "File-Exists"], a: 1, exp: "Test-Path renvoie True si le chemin existe." },
    { type: "qcm", q: "En PowerShell, une condition if s'écrit…", opts: ["if [ ... ]; then ... fi", "if (...) { ... }", "if ... endif", "if : ... :"], a: 1, exp: "PowerShell : parenthèses pour la condition, accolades pour le bloc." },
    { type: "input", q: "PowerShell : écris l'en-tête d'une boucle qui parcourt les fichiers .txt (foreach avec Get-ChildItem). Donne juste la ligne foreach(...).", a: ["foreach ($f in Get-ChildItem *.txt)", "foreach($f in Get-ChildItem *.txt)"], ph: "foreach ($f in Get-ChildItem *.txt)", exp: "foreach ($f in Get-ChildItem *.txt) itère sur chaque fichier." },
    { type: "qcm", q: "Différence clé entre if Bash et if PowerShell ?", opts: ["Aucune", "Bash : [ ] + then + fi ; PowerShell : ( ) + accolades { }", "PowerShell n'a pas de if", "Bash utilise des accolades"], a: 1, exp: "Structure différente ; les opérateurs -ge, -lt, -eq sont communs." }
  ],
  final: {
    title: "Exercice final — Un script qui décide et répète",
    intro: `<p>On veut un script qui, pour chaque fichier .log du dossier, affiche son nom, et qui prévient si le fichier journal.log est absent. On le pense d'abord en Bash, puis en PowerShell.</p>`,
    questions: [
      { type: "input", q: "Bash : mémorise la date du jour (AAAA-MM-JJ) dans la variable <code>d</code>.", a: ["d=$(date +%Y-%m-%d)", "d=$(date +\"%Y-%m-%d\")"], ph: "d=$(date +%Y-%m-%d)", exp: "Substitution de commande pour capturer la date." },
      { type: "qcm", q: "Quelle est la bonne en-tête de boucle Bash sur les .log ?", opts: ["for f in *.log; do", "foreach f in *.log {", "loop *.log", "for (*.log)"], a: 0, exp: "for f in *.log; do ... done est la forme Bash." },
      { type: "input", q: "Bash : dans la boucle, affiche le nom du fichier courant contenu dans <code>f</code>.", a: ["echo \"$f\"", "echo $f"], ph: "echo …", exp: "echo \"$f\" affiche le fichier en cours de traitement." },
      { type: "qcm", q: "Comment tester en Bash que journal.log N'existe PAS ?", opts: ["if [ ! -f \"journal.log\" ]; then", "if exist journal.log", "Test-Path journal.log", "if journal.log = 0"], a: 0, exp: "Le ! inverse le test : vrai si le fichier n'existe pas." },
      { type: "qcm", q: "Comment se ferment la boucle et le if en Bash ?", opts: ["end et endif", "done et fi", "} et }", "next et exit"], a: 1, exp: "La boucle par done, le if par fi." }
    ],
    solution: `<pre class="pseudo"># --- Bash ---
#!/bin/bash
d=$(date +%Y-%m-%d)
echo "Rapport du $d"
for f in *.log; do
  echo "Fichier trouve : $f"
done
if [ ! -f "journal.log" ]; then
  echo "ATTENTION : journal.log est absent"
fi

# --- PowerShell ---
$d = Get-Date -Format "yyyy-MM-dd"
Write-Output "Rapport du $d"
foreach ($f in Get-ChildItem *.log) {
  Write-Output "Fichier trouve : $($f.Name)"
}
if (-not (Test-Path "journal.log")) {
  Write-Output "ATTENTION : journal.log est absent"
}</pre>
<p>Ton script sait désormais mémoriser, décider et répéter. Demain : le faire tourner tout seul avec les tâches planifiées.</p>`
  }
};
</script>
