<script>
var DAY = {
  num: 23,
  title: "Rechercher des fichiers (find, where)",
  subtitle: "Retrouver un fichier n'importe où dans l'arborescence, par nom, taille ou date.",
  theory: `
<h3>1. Deux questions différentes</h3>
<p>« Où est un fichier ? » cache en réalité deux besoins distincts. Retrouver un <strong>document</strong> (par nom, taille, date) quelque part dans mes dossiers : c'est le rôle de <code>find</code>. Retrouver l'<strong>exécutable</strong> d'une commande dans le PATH : c'est <code>which</code> / <code>where</code> (revu du jour 18). Ne pas confondre les deux.</p>
<div class="tip"><code>find</code> = chercher des fichiers dans une arborescence, selon des critères. <code>where</code>/<code>which</code> = localiser un programme installé. On parle ici surtout du premier.</div>

<h3>2. find : la recherche par excellence (Unix)</h3>
<p>Structure : <code>find OÙ CRITÈRE</code>. On indique le dossier de départ, puis ce qu'on cherche.</p>
<pre class="pseudo"># --- Bash (Linux / macOS) ---
find . -name "rapport.txt"      # dans le dossier courant (.) et ses sous-dossiers
find /home -name "*.pdf"        # tous les PDF sous /home (joker *)
find . -iname "*.JPG"           # -iname : insensible a la casse (JPG = jpg)
find . -type d -name "images"   # -type d : uniquement les DOSSIERS nommes images
find . -type f -name "*.log"    # -type f : uniquement les FICHIERS</pre>
<div class="warn"><code>find</code> parcourt aussi tous les <strong>sous-dossiers</strong> (récursif). Sur un très gros dossier, cela peut prendre du temps : cible le bon point de départ (pas toujours <code>/</code>).</div>

<h3>3. Chercher par taille, par date</h3>
<pre class="pseudo"># --- Bash ---
find . -size +100M              # fichiers de PLUS de 100 Mo (le + = "plus grand que")
find . -size -1k                # fichiers de MOINS de 1 Ko
find . -mtime -7                # modifies il y a MOINS de 7 jours (mtime = modif time)
find . -name "*.tmp" -mtime +30 # .tmp vieux de plus de 30 jours</pre>
<div class="tip">Combiner les critères affine la recherche : nom + type + date + taille. C'est ce qui rend <code>find</code> si puissant pour le ménage (repérer les gros fichiers, les vieux temporaires...).</div>

<h3>4. Agir sur les résultats</h3>
<pre class="pseudo"># --- Bash --- -exec lance une commande sur chaque fichier trouve
find . -name "*.tmp" -delete             # supprime tous les .tmp trouves (prudence !)
find . -name "*.log" -exec ls -lh {} \;  # {} = chaque fichier trouve, \; termine
find . -name "*.txt" -exec grep "erreur" {} \;  # cherche "erreur" dans chaque .txt</pre>
<div class="warn"><code>-delete</code> efface sans confirmation ni corbeille. Lance TOUJOURS d'abord le <code>find</code> seul pour VOIR la liste, et seulement ensuite ajoute <code>-delete</code>. C'est la règle de sécurité n°1.</div>

<h3>5. Côté Windows : where et PowerShell</h3>
<pre class="pseudo"># --- CMD (Windows) ---
where /R C:\Users notes.txt     REM /R = recursif a partir de C:\Users
where python                    REM localiser un executable du PATH</pre>
<pre class="pseudo"># --- PowerShell (Windows) --- l'equivalent riche de find
Get-ChildItem -Path C:\Users -Recurse -Filter "*.pdf"   # tous les PDF, recursif
Get-ChildItem -Recurse -Filter "*.log" | Where-Object Length -gt 1MB  # .log de plus de 1 Mo
gci -Recurse -Include *.tmp     # gci = alias de Get-ChildItem</pre>
<div class="tip">En PowerShell, <code>Get-ChildItem -Recurse</code> est le vrai équivalent de <code>find</code> : on filtre par nom (<code>-Filter</code>), puis on affine avec <code>Where-Object</code> (taille, date...). <code>where</code> (CMD) est plus limité, surtout utile pour les exécutables.</div>

<h3>6. Récapitulatif</h3>
<pre class="pseudo"># Chercher un fichier   : find . -name "*.pdf"  |  Get-ChildItem -Recurse -Filter *.pdf  |  where /R . *.pdf
# Par taille            : find . -size +100M    |  ... | Where-Object Length -gt 100MB
# Par date              : find . -mtime -7      |  ... | Where-Object LastWriteTime -gt (Get-Date).AddDays(-7)
# Localiser une commande: which / where python
# Regle de securite     : VOIR la liste avant tout -delete</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle commande cherche des FICHIERS par nom, taille ou date sous Unix ?", opts: ["which", "find", "grep", "ls"], a: 1, exp: "find parcourt l'arborescence selon des critères." },
    { type: "input", q: "Bash : cherche tous les fichiers nommés rapport.txt à partir du dossier courant.", a: ["find . -name \"rapport.txt\"", "find . -name rapport.txt"], ph: "find . -name …", exp: "find . -name \"rapport.txt\" démarre au dossier courant (.) et descend." },
    { type: "qcm", q: "Que fait <code>find /home -name \"*.pdf\"</code> ?", opts: ["Crée des PDF", "Trouve tous les fichiers .pdf sous /home", "Supprime les PDF", "Ouvre les PDF"], a: 1, exp: "Il liste tous les .pdf de l'arborescence /home." },
    { type: "input", q: "Bash : trouve les .JPG sans tenir compte de la casse (majuscules/minuscules). Utilise l'option adaptée.", a: ["find . -iname \"*.jpg\"", "find . -iname \"*.JPG\"", "find . -iname *.jpg"], ph: "find . -iname …", exp: "-iname rend la recherche insensible à la casse." },
    { type: "qcm", q: "Comment ne chercher que les DOSSIERS avec find ?", opts: ["-type f", "-type d", "-dir", "-folder"], a: 1, exp: "-type d cible les dossiers ; -type f les fichiers." },
    { type: "vf", q: "find ne cherche que dans le dossier indiqué, sans descendre dans les sous-dossiers.", a: false, exp: "Faux : find est récursif, il descend dans toute l'arborescence." },
    { type: "input", q: "Bash : trouve les fichiers de PLUS de 100 méga-octets sous le dossier courant.", a: ["find . -size +100M", "find . -size +100m"], ph: "find . -size …", exp: "-size +100M : le + signifie « plus grand que » 100 Mo." },
    { type: "qcm", q: "Que trouve <code>find . -mtime -7</code> ?", opts: ["Les fichiers modifiés il y a moins de 7 jours", "Les 7 plus gros fichiers", "Les fichiers créés il y a exactement 7 heures", "Les fichiers de 7 Ko"], a: 0, exp: "-mtime -7 : modifiés il y a moins de 7 jours." },
    { type: "qcm", q: "Dans <code>find . -name \"*.log\" -exec ls -lh {} \\;</code>, que représente <code>{}</code> ?", opts: ["Le dossier racine", "Chaque fichier trouvé, passé à la commande", "La commande à exécuter", "Le nombre de résultats"], a: 1, exp: "{} est remplacé par chaque fichier trouvé ; \\; termine la commande -exec." },
    { type: "vf", q: "L'option <code>-delete</code> de find demande une confirmation avant d'effacer.", a: false, exp: "Faux : -delete efface sans confirmation ni corbeille. On liste d'abord pour vérifier." },
    { type: "qcm", q: "Quelle est la règle de sécurité avant d'utiliser find ... -delete ?", opts: ["Éteindre le PC", "Lancer d'abord le find SEUL pour voir la liste des fichiers visés", "Doubler la commande", "Rien de spécial"], a: 1, exp: "On vérifie toujours la liste avant de supprimer." },
    { type: "input", q: "CMD : cherche récursivement le fichier notes.txt à partir de C:\\Users (option de récursivité).", a: ["where /R C:\\Users notes.txt", "where /r C:\\Users notes.txt"], ph: "where /R C:\\Users …", exp: "where /R C:\\Users notes.txt cherche dans toute l'arborescence." },
    { type: "qcm", q: "En PowerShell, quel équivalent riche de find ?", opts: ["Find-File", "Get-ChildItem -Recurse", "Search-Item", "Locate"], a: 1, exp: "Get-ChildItem -Recurse (alias gci) parcourt récursivement." },
    { type: "input", q: "PowerShell : liste récursivement tous les fichiers .pdf sous C:\\Docs (utilise -Recurse et -Filter).", a: ["Get-ChildItem -Path C:\\Docs -Recurse -Filter \"*.pdf\"", "Get-ChildItem -Path C:\\Docs -Recurse -Filter *.pdf", "gci C:\\Docs -Recurse -Filter *.pdf"], ph: "Get-ChildItem -Path C:\\Docs -Recurse -Filter …", exp: "-Recurse descend dans les sous-dossiers ; -Filter *.pdf cible les PDF." },
    { type: "qcm", q: "Quelle est la différence entre <code>find</code> et <code>where</code>/<code>which</code> ?", opts: ["Aucune", "find cherche des fichiers dans l'arborescence ; where/which localisent un exécutable du PATH", "which ne fonctionne que sous macOS", "find est réservé à Windows"], a: 1, exp: "Deux besoins distincts : trouver un document vs localiser un programme." }
  ],
  final: {
    title: "Exercice final — Faire le ménage intelligemment",
    intro: `<p>Un projet contient plein de fichiers temporaires <code>.tmp</code> et de gros logs. Tu veux repérer les gros fichiers, puis nettoyer les vieux temporaires — sans rien casser.</p>`,
    questions: [
      { type: "input", q: "Bash : trouve tous les fichiers .tmp à partir du dossier courant.", a: ["find . -name \"*.tmp\"", "find . -name *.tmp"], ph: "find . -name …", exp: "find . -name \"*.tmp\" liste les temporaires (sans encore les toucher)." },
      { type: "input", q: "Bash : parmi eux, ne garde que ceux modifiés il y a plus de 30 jours.", a: ["find . -name \"*.tmp\" -mtime +30", "find . -name *.tmp -mtime +30"], ph: "find . -name \"*.tmp\" -mtime …", exp: "-mtime +30 : plus vieux que 30 jours." },
      { type: "qcm", q: "Avant d'ajouter -delete, quel réflexe ?", opts: ["Rien, on fait confiance", "Lancer la commande sans -delete pour VOIR la liste exacte", "Vider la corbeille d'abord", "Compresser les fichiers visés"], a: 1, exp: "On vérifie toujours la liste avant de supprimer." },
      { type: "input", q: "Bash : maintenant, supprime ces vieux .tmp (ajoute l'option d'effacement).", a: ["find . -name \"*.tmp\" -mtime +30 -delete", "find . -name *.tmp -mtime +30 -delete"], ph: "… -mtime +30 -delete", exp: "-delete efface les fichiers correspondant aux critères vérifiés." },
      { type: "qcm", q: "Pour repérer les fichiers de plus de 500 Mo à archiver, on utilise…", opts: ["find . -size +500M", "find . -name big", "find . -mtime -1", "which big"], a: 0, exp: "-size +500M cible les fichiers volumineux." }
    ],
    solution: `<pre class="pseudo"># --- Bash ---
find . -name "*.tmp"                    # 1. voir tous les temporaires
find . -name "*.tmp" -mtime +30        # 2. seulement les vieux (plus de 30 jours)
# 3. on VERIFIE la liste ci-dessus, puis :
find . -name "*.tmp" -mtime +30 -delete  # 4. suppression ciblee
find . -size +500M                      # reperer les gros fichiers a archiver

# --- PowerShell (equivalent) ---
Get-ChildItem -Recurse -Filter *.tmp | Where-Object LastWriteTime -lt (Get-Date).AddDays(-30) | Remove-Item</pre>
<p>Tu retrouves et tries n'importe quel fichier, sans risque. Demain : archiver et compresser (tar, zip).</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris tes commandes ici, une par ligne…",
  items: [
  { id: "term-j23", title: "Chasse au fichier", level: 2,
    statement: "Dans ton dossier personnel, écris en <strong>Bash</strong> les commandes pour : (1) trouver tous les fichiers <code>.mp3</code> (peu importe la casse), (2) trouver les fichiers de plus de 200 Mo, (3) trouver les <code>.log</code> modifiés il y a moins de 2 jours. Donne ensuite l'équivalent <strong>PowerShell</strong> de la recherche des .mp3.",
    hints: [
      "Insensible à la casse = option -iname. Le point de départ peut être ~ (dossier personnel).",
      "Par taille : -size +200M. Par date récente : -mtime -2.",
      "En PowerShell : Get-ChildItem -Recurse -Filter *.mp3 (le filtre n'est pas sensible à la casse)."
    ],
    atoi: { cmd: "mkdir -p demo23/sous && touch demo23/chanson.MP3 demo23/sous/mix.mp3 demo23/recent.log\nfind demo23 -iname \"*.mp3\"\nfind demo23 -size +200M\nfind demo23 -name \"*.log\" -mtime -2", expected: "On crée une arborescence de démo. find -iname \"*.mp3\" liste chanson.MP3 ET sous/mix.mp3 (la casse est ignorée). find -size +200M ne renvoie rien ici (aucun fichier volumineux) : c'est normal, il ne cible que les fichiers de plus de 200 Mo. find -name \"*.log\" -mtime -2 liste recent.log (créé à l'instant, donc modifié il y a moins de 2 jours)." },
    checklist: [
      "(1) Recherche insensible à la casse : find ~ -iname \"*.mp3\" (point de départ = dossier personnel).",
      "(2) Recherche par taille : find ~ -size +200M (le + = « plus grand que »).",
      "(3) Recherche par date récente : find ~ -name \"*.log\" -mtime -2 (modifiés il y a moins de 2 jours).",
      "PowerShell des .mp3 : Get-ChildItem -Path $HOME -Recurse -Filter \"*.mp3\"."
    ],
    solution: "# --- Bash ---\nfind ~ -iname \"*.mp3\"          # 1. tous les mp3 (casse ignoree)\nfind ~ -size +200M             # 2. fichiers de plus de 200 Mo\nfind ~ -name \"*.log\" -mtime -2 # 3. .log modifies il y a moins de 2 jours\n\n# --- PowerShell ---\nGet-ChildItem -Path $HOME -Recurse -Filter \"*.mp3\"",
    note: "On combine librement les criteres (-iname, -size, -mtime) ; toujours regarder la liste AVANT toute action destructrice." }
  ]
};
