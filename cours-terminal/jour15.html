<script>
var DAY = {
  num: 15,
  title: "Rechercher du texte (grep, Select-String, findstr)",
  subtitle: "Retrouver une aiguille dans une botte de foin : filtrer les lignes qui contiennent un mot.",
  theory: `
<h3>1. Le besoin : filtrer par contenu</h3>
<p>Trouver toutes les lignes qui contiennent un mot précis, dans un fichier ou dans un flux, est l'une des actions les plus fréquentes au terminal. L'outil s'appelle <strong>grep</strong> sous Bash, <strong>Select-String</strong> sous PowerShell, et <strong>findstr</strong> sous CMD. Tous répondent à la même question : « montre-moi seulement les lignes où apparaît ce texte ».</p>
<pre class="pseudo"># Bash (Linux/macOS)
grep "erreur" journal.log        # affiche les lignes contenant « erreur »
# PowerShell (Windows)
Select-String "erreur" journal.log   # (alias : sls) memes lignes
# CMD (Windows)
findstr "erreur" journal.log     # meme idee sous CMD</pre>
<div class="tip">Le nom <strong>grep</strong> vient d'une vieille commande d'éditeur signifiant « chercher globalement une expression et l'imprimer ». Retiens-le comme « le chercheur de texte » du monde Unix.</div>
<h3>2. Chercher dans un flux (avec un tube)</h3>
<p>Ces outils brillent surtout branchés en bout de tube (jour 14) : on filtre la sortie d'une autre commande.</p>
<pre class="pseudo"># Bash (Linux/macOS)
ls | grep ".txt"                 # ne garde que les lignes contenant « .txt »
# PowerShell (Windows)
Get-ChildItem | Select-String ".txt"
# CMD (Windows)
dir | findstr ".txt"</pre>
<h3>3. Ignorer la casse (majuscules/minuscules)</h3>
<p>Par défaut, <code>grep</code> distingue « Erreur » de « erreur ». Une option rend la recherche insensible à la casse.</p>
<pre class="pseudo"># Bash (Linux/macOS)
grep -i "erreur" journal.log     # -i : ignore la casse (Erreur, ERREUR, erreur…)
# PowerShell (Windows)
Select-String "erreur" journal.log   # insensible a la casse PAR DEFAUT
Select-String "erreur" journal.log -CaseSensitive   # forcer la sensibilite
# CMD (Windows)
findstr /i "erreur" journal.log  # /i : ignore la casse</pre>
<div class="warn">Piège inversé : <strong>grep</strong> est sensible à la casse par défaut (il faut <code>-i</code> pour ignorer), alors que <strong>Select-String</strong> est INSENSIBLE par défaut (il faut <code>-CaseSensitive</code> pour distinguer). Deux réglages opposés à ne pas confondre.</div>
<h3>4. Options très utiles de grep</h3>
<pre class="pseudo"># Bash (Linux/macOS)
grep -n "erreur" fichier.log     # -n : affiche le NUMERO de ligne
grep -c "erreur" fichier.log     # -c : COMPTE les lignes correspondantes
grep -v "erreur" fichier.log     # -v : INVERSE (lignes qui NE contiennent PAS « erreur »)
grep -r "erreur" dossier/        # -r : recherche RECURSIVE dans tout un dossier</pre>
<div class="tip">Correspondances : <code>-n</code> (numéro de ligne) ↔ PowerShell affiche déjà le numéro ; <code>-c</code> (compter) ↔ on peut faire <code>| Measure-Object</code> ; <code>-r</code> (récursif) ↔ <code>Select-String -Path dossier\* </code> ou l'option <code>/s</code> de findstr.</div>
<h3>5. Recherche récursive et numéro de ligne côté Windows</h3>
<pre class="pseudo"># PowerShell (Windows)
Select-String "TODO" -Path Projets\*.txt   # cherche dans plusieurs fichiers
# (Select-String affiche fichier:ligne:contenu, comme grep -n)
# CMD (Windows)
findstr /s /i "TODO" *.txt       # /s : parcourt aussi les sous-dossiers ; /i : casse ignoree</pre>
<h3>6. Récapitulatif</h3>
<pre class="pseudo"># Action                Bash          PowerShell              CMD
# Chercher un mot       grep MOT      Select-String MOT       findstr MOT
# Ignorer la casse      grep -i       (defaut) / -CaseSensitive   findstr /i
# Numero de ligne       grep -n       (affiche par defaut)    findstr /n
# Compter               grep -c       | Measure-Object        (—)
# Inverser (NE PAS)     grep -v       Select-String -NotMatch findstr /v
# Recursif              grep -r       -Path dossier\*         findstr /s</pre>`,
  exercises: [
    { type: "input", q: "Quelle commande Bash affiche les lignes de journal.log contenant « erreur » ?", a: ["grep \"erreur\" journal.log", "grep erreur journal.log", "grep 'erreur' journal.log"], ph: "grep …", exp: "grep \"erreur\" journal.log filtre les lignes correspondantes." },
    { type: "qcm", q: "Quelle commande joue le rôle de grep sous CMD ?", opts: ["grep", "findstr", "Select-String", "find /c"], a: 1, exp: "findstr est le chercheur de texte de CMD." },
    { type: "input", q: "Quelle est la commande PowerShell (Verbe-Nom) équivalente à grep ?", a: ["select-string", "sls"], ph: "Verbe-Nom", exp: "Select-String ; alias sls." },
    { type: "input", q: "Sous Bash, quelle option de grep IGNORE la casse (majuscules/minuscules) ?", a: ["-i", "i"], ph: "-…", exp: "grep -i ignore la casse." },
    { type: "vf", q: "grep est sensible à la casse par défaut, alors que Select-String est insensible par défaut.", a: true, exp: "Oui : réglages opposés. grep -i pour ignorer ; Select-String -CaseSensitive pour distinguer." },
    { type: "qcm", q: "Sous CMD, quelle option de findstr ignore la casse ?", opts: ["/n", "/i", "/v", "/s"], a: 1, exp: "findstr /i ignore la casse." },
    { type: "input", q: "Sous Bash, quelle option de grep affiche le NUMÉRO de ligne ?", a: ["-n", "n"], ph: "-…", exp: "grep -n préfixe chaque résultat de son numéro de ligne." },
    { type: "qcm", q: "Sous Bash, que fait <code>grep -v \"erreur\" fichier</code> ?", opts: ["Affiche les lignes contenant « erreur »", "Affiche les lignes qui NE contiennent PAS « erreur »", "Compte les lignes", "Supprime les lignes"], a: 1, exp: "grep -v inverse : garde les lignes SANS le motif." },
    { type: "input", q: "Sous Bash, quelle option de grep COMPTE les lignes correspondantes ?", a: ["-c", "c"], ph: "-…", exp: "grep -c compte le nombre de lignes qui correspondent." },
    { type: "qcm", q: "Sous Bash, quelle option de grep cherche RÉCURSIVEMENT dans un dossier ?", opts: ["-i", "-n", "-r", "-c"], a: 2, exp: "grep -r parcourt le dossier et ses sous-dossiers." },
    { type: "qcm", q: "Sous CMD, quelle option de findstr parcourt aussi les sous-dossiers ?", opts: ["/i", "/s", "/v", "/n"], a: 1, exp: "findstr /s cherche récursivement." },
    { type: "input", q: "Sous Bash, écris la chaîne qui liste le dossier et ne garde que les lignes contenant « .txt » (ls + grep).", a: ["ls | grep \".txt\"", "ls | grep .txt", "ls|grep .txt"], ph: "ls | grep …", exp: "ls | grep \".txt\" filtre la sortie de ls." },
    { type: "qcm", q: "Sous PowerShell, comment forcer une recherche SENSIBLE à la casse ?", opts: ["-i", "-CaseSensitive", "/i", "-v"], a: 1, exp: "Select-String ... -CaseSensitive distingue majuscules et minuscules." },
    { type: "qcm", q: "Sous PowerShell, quel paramètre garde les lignes qui NE correspondent PAS ?", opts: ["-NotMatch", "-v", "/v", "-Invert"], a: 0, exp: "Select-String -NotMatch inverse, comme grep -v." },
    { type: "vf", q: "grep, Select-String et findstr répondent tous à la même question : quelles lignes contiennent ce texte ?", a: true, exp: "Oui : même besoin, trois outils selon le shell." }
  ],
  final: {
    title: "Exercice final — Traquer les erreurs dans un journal",
    intro: `<p>Le fichier <code>app.log</code> contient des milliers de lignes. Tu cherches celles qui parlent d'« erreur », sans te soucier de la casse, puis tu veux les compter.</p>`,
    questions: [
      { type: "input", q: "Bash : affiche les lignes de app.log contenant « erreur » en ignorant la casse.", a: ["grep -i \"erreur\" app.log", "grep -i erreur app.log", "grep -i 'erreur' app.log"], ph: "grep …", exp: "grep -i \"erreur\" app.log." },
      { type: "input", q: "Bash : ajoute l'affichage du numéro de ligne à cette recherche.", a: ["grep -in \"erreur\" app.log", "grep -ni \"erreur\" app.log", "grep -in erreur app.log", "grep -ni erreur app.log"], ph: "grep …", exp: "grep -in \"erreur\" app.log combine -i et -n." },
      { type: "input", q: "Bash : compte combien de lignes contiennent « erreur » (option de comptage).", a: ["grep -c \"erreur\" app.log", "grep -c erreur app.log"], ph: "grep -c …", exp: "grep -c \"erreur\" app.log." },
      { type: "qcm", q: "CMD : quelle commande cherche « erreur » sans tenir compte de la casse ?", opts: ["grep -i erreur app.log", "findstr /i erreur app.log", "Select-String erreur app.log", "find erreur"], a: 1, exp: "findstr /i erreur app.log." },
      { type: "qcm", q: "PowerShell : par défaut, <code>Select-String \"erreur\" app.log</code> tient-il compte de la casse ?", opts: ["Oui, il est sensible par défaut", "Non, il est insensible par défaut", "Il refuse de chercher", "Seulement avec un tube"], a: 1, exp: "Select-String est insensible à la casse par défaut." }
    ],
    solution: `<pre class="pseudo"># Traquer « erreur » — les trois shells
# Bash (Linux/macOS)
grep -i "erreur" app.log        # lignes contenant erreur (casse ignoree)
grep -in "erreur" app.log       # + numero de ligne
grep -c "erreur" app.log        # compter les lignes
grep -v "erreur" app.log        # au contraire : lignes SANS erreur
# PowerShell (Windows)
Select-String "erreur" app.log             # insensible a la casse par defaut
Select-String "erreur" app.log -NotMatch   # lignes sans « erreur »
# CMD (Windows)
findstr /i "erreur" app.log     # /i = casse ignoree ; /s = recursif ; /n = numero
# Meme besoin partout : grep / Select-String / findstr.</pre>
<p>Tu sais retrouver n'importe quel texte dans n'importe quel volume. Demain : les jokers et le globbing, pour désigner plusieurs fichiers d'un coup.</p>`
  }
};
</script>

<script>

  { id: "term-j15", title: "Filtrer un journal", level: 2,
    statement: "Un fichier <code>serveur.log</code> est dans le dossier courant. En <strong>Bash</strong> : (1) affiche les lignes contenant <code>WARNING</code> en ignorant la casse et avec le numéro de ligne, (2) compte les lignes contenant <code>WARNING</code>. En commentaire, donne l'équivalent de la recherche (sans compter) sous <strong>PowerShell</strong> et sous <strong>CMD</strong>.",

      "Ignorer la casse = -i ; numéro de ligne = -n (on peut coller -in).",

      "PowerShell : Select-String (insensible par défaut) ; CMD : findstr /i."
    ],
    solution: "grep -in \"WARNING\" serveur.log   # 1) lignes + numero, casse ignoree (Bash)\ngrep -c \"WARNING\" serveur.log     # 2) compter les lignes correspondantes\n# Equivalents (recherche simple) :\n# PowerShell : Select-String \"WARNING\" serveur.log      # insensible par defaut\n# CMD        : findstr /i \"WARNING\" serveur.log          # /i = casse ignoree",
    note: "grep est sensible à la casse par défaut (d'où -i) ; Select-String est insensible par défaut. Les options grep se combinent (-in) ; findstr utilise /i, /n, /s, /v." }
  ]
};
</script>
