<script>
var DAY = {
  num: 6,
  title: "L'arborescence et les chemins",
  subtitle: "Comprendre l'arbre des dossiers et écrire l'adresse d'un fichier.",
  theory: `
<h3>1. Le système de fichiers est un arbre</h3>
<p>Tous les dossiers et fichiers sont organisés en <strong>arborescence</strong> : un arbre qui part d'un tronc unique, la <strong>racine</strong>, et se ramifie en dossiers, sous-dossiers, fichiers. Un dossier peut en contenir d'autres, à l'infini. C'est exactement comme des poupées russes ou des classeurs rangés dans des tiroirs.</p>
<pre class="pseudo"># Bash (Linux/macOS) : la racine unique est «  /  »
# /
# └── home
#     └── alex
#         └── Documents
#             └── notes.txt
# CMD / PowerShell (Windows) : une racine PAR disque (C:\, D:\ …)
# C:\
# └── Users
#     └── Alex
#         └── Documents
#             └── notes.txt</pre>
<div class="warn">Différence fondamentale : sous Linux/macOS il existe UNE seule racine, <code>/</code>, et tout s'y rattache. Sous Windows, chaque disque a sa propre racine (<code>C:\</code>, <code>D:\</code>…). C'est pourquoi les chemins Windows commencent souvent par une lettre de lecteur.</div>
<h3>2. Un chemin, c'est une adresse</h3>
<p>Un <strong>chemin</strong> (en anglais <em>path</em>) est l'adresse d'un fichier ou d'un dossier : la suite des dossiers à traverser pour l'atteindre, séparés par le caractère de séparation du système. Comme une adresse postale : pays, ville, rue, numéro.</p>
<h3>3. Chemin absolu : depuis la racine</h3>
<p>Un chemin <strong>absolu</strong> part de la racine et décrit tout le trajet. Il est complet et sans ambiguïté : il désigne le même fichier quel que soit l'endroit où tu te trouves.</p>
<pre class="pseudo"># Bash (Linux/macOS) : commence par /
/home/alex/Documents/notes.txt
# Windows (PowerShell/CMD) : commence par une lettre de lecteur
C:\Users\Alex\Documents\notes.txt</pre>
<h3>4. Chemin relatif : depuis le dossier courant</h3>
<p>Un chemin <strong>relatif</strong> part de là où tu te trouves maintenant (le dossier courant). Il ne commence PAS par la racine. Plus court, mais son sens dépend de ta position — comme dire « la deuxième porte à droite » : cela n'a de sens que si l'on sait d'où l'on part.</p>
<pre class="pseudo"># Si je suis dans /home/alex (Bash) :
Documents/notes.txt      # chemin relatif → /home/alex/Documents/notes.txt
# Deux raccourcis utiles dans les chemins relatifs :
.                        # le dossier COURANT
..                       # le dossier PARENT (un cran au-dessus)
../Photos/chat.jpg       # remonter d'un cran puis descendre dans Photos</pre>
<div class="tip">Repère simple : un chemin qui <strong>commence par</strong> <code>/</code> (Bash) ou <code>C:\</code> (Windows) est ABSOLU. Sinon, il est RELATIF et dépend du dossier courant.</div>
<h3>5. Le tilde et les dossiers spéciaux</h3>
<pre class="pseudo"># Bash / PowerShell : ~ = dossier personnel
~/Documents/notes.txt          # equivaut a /home/alex/Documents/notes.txt
# CMD : pas de ~, on utilise une variable
%USERPROFILE%\Documents\notes.txt</pre>
<h3>6. Les séparateurs, encore et toujours</h3>
<pre class="pseudo"># Bash (Linux/macOS) : separateur = /
cd /home/alex/Documents
# Windows (PowerShell/CMD) : separateur = \
cd C:\Users\Alex\Documents
# PowerShell accepte souvent les deux, mais garde le bon reflexe :
#   /  pour le monde Unix   |   \  pour le monde Windows</pre>
<div class="warn">Ne confonds pas la racine <code>/</code> de Bash avec le séparateur <code>/</code> : sous Bash, le MÊME caractère sert de racine (en tête) ET de séparateur (entre les dossiers). Sous Windows, la racine inclut la lettre du lecteur (<code>C:\</code>) et le séparateur est <code>\</code>.</div>`,
  exercises: [
    { type: "qcm", q: "Comment est organisé le système de fichiers ?", opts: ["En liste plate sans hiérarchie", "En arborescence (un arbre de dossiers et sous-dossiers)", "En cercle", "Au hasard"], a: 1, exp: "C'est une arborescence partant d'une racine." },
    { type: "input", q: "Sous Linux/macOS, quel caractère unique désigne la racine du système de fichiers ?", a: ["/", "slash", "barre oblique"], ph: "un caractère", exp: "La racine unique sous Unix est /." },
    { type: "qcm", q: "Sous Windows, à quoi ressemble une racine ?", opts: ["/", "Une lettre de lecteur suivie de :\\ (ex. C:\\)", "~", ".."], a: 1, exp: "Chaque disque a sa racine : C:\\, D:\\…" },
    { type: "vf", q: "Sous Linux/macOS, il n'existe qu'une seule racine, tandis que Windows a une racine par disque.", a: true, exp: "Oui : / unique côté Unix ; C:\\, D:\\… côté Windows." },
    { type: "qcm", q: "Un chemin ABSOLU se caractérise par…", opts: ["Il dépend du dossier courant", "Il part de la racine et est complet", "Il commence toujours par ..", "Il n'a pas de séparateur"], a: 1, exp: "Un chemin absolu part de la racine ; il est sans ambiguïté." },
    { type: "input", q: "Un chemin qui commence par <code>/</code> (Bash) est-il absolu ou relatif ? (réponds par un mot)", a: ["absolu"], ph: "un mot", exp: "Commencer par / (ou C:\\) = chemin absolu." },
    { type: "qcm", q: "Un chemin RELATIF part…", opts: ["De la racine", "Du dossier courant (là où tu es)", "Du bureau uniquement", "D'internet"], a: 1, exp: "Un chemin relatif est interprété depuis le dossier courant." },
    { type: "input", q: "Dans un chemin, quels deux caractères désignent le dossier PARENT ?", a: ["..", "deux points"], ph: "des caractères", exp: ".. = le dossier parent (un cran au-dessus)." },
    { type: "qcm", q: "À quoi correspond <code>.</code> (un seul point) dans un chemin ?", opts: ["La racine", "Le dossier courant", "Le dossier personnel", "Un fichier caché"], a: 1, exp: ". désigne le dossier courant." },
    { type: "qcm", q: "<code>../Photos/chat.jpg</code> signifie…", opts: ["Aller à la racine puis Photos", "Remonter d'un cran, puis descendre dans Photos vers chat.jpg", "Rester ici", "Un chemin absolu"], a: 1, exp: ".. remonte d'un cran, puis on descend dans Photos." },
    { type: "input", q: "Sous Bash et PowerShell, quel caractère est un raccourci vers le dossier personnel ?", a: ["~", "tilde"], ph: "un caractère", exp: "~ = dossier personnel (Bash et PowerShell)." },
    { type: "vf", q: "<code>C:\\Users\\Alex\\Documents\\notes.txt</code> est un chemin absolu Windows.", a: true, exp: "Oui : il part d'une racine de lecteur (C:\\), donc absolu." },
    { type: "qcm", q: "Sous Bash, le caractère <code>/</code> sert à…", opts: ["Uniquement la racine", "Uniquement séparer les dossiers", "À la fois de racine (en tête) et de séparateur (entre dossiers)", "À rien"], a: 2, exp: "Sous Unix, / est la racine ET le séparateur." },
    { type: "input", q: "Sous Windows, quel caractère sépare les dossiers dans un chemin ?", a: ["\\", "barre inverse", "antislash", "backslash"], ph: "un caractère", exp: "Windows utilise la barre inverse \\ comme séparateur." },
    { type: "qcm", q: "CMD ne connaît pas ~. Que met-on à la place pour le dossier personnel ?", opts: ["%HOME%", "%USERPROFILE%", "$HOME", "~user"], a: 1, exp: "Sous CMD, %USERPROFILE% pointe vers le dossier personnel." }
  ],
  final: {
    title: "Exercice final — Lire et écrire des adresses",
    intro: `<p>Alex est positionné dans <code>/home/alex</code> (Bash). Son fichier cible est <code>/home/alex/Documents/notes.txt</code>. Analysons les chemins.</p>`,
    questions: [
      { type: "qcm", q: "<code>/home/alex/Documents/notes.txt</code> est un chemin…", opts: ["Relatif", "Absolu (part de la racine /)", "Caché", "Invalide"], a: 1, exp: "Il commence par / : c'est un chemin absolu." },
      { type: "input", q: "Depuis /home/alex, écris le chemin RELATIF vers notes.txt.", a: ["documents/notes.txt", "Documents/notes.txt"], ph: "chemin relatif", exp: "Documents/notes.txt (pas de / au début)." },
      { type: "input", q: "Toujours depuis /home/alex, écris le chemin de notes.txt en utilisant le raccourci du dossier personnel.", a: ["~/documents/notes.txt", "~/Documents/notes.txt"], ph: "avec ~", exp: "~/Documents/notes.txt : ~ vaut /home/alex." },
      { type: "qcm", q: "Sur Windows, le même fichier pourrait s'écrire…", opts: ["/Users/Alex/Documents/notes.txt", "C:\\Users\\Alex\\Documents\\notes.txt", "~Users~Alex", "notes.txt seulement"], a: 1, exp: "Chemin Windows : lettre de lecteur + séparateurs \\." },
      { type: "qcm", q: "Depuis /home/alex/Documents, comment atteindre <code>../Photos/chat.jpg</code> ?", opts: ["Ce fichier est dans Documents", "Remonter dans /home/alex puis descendre dans Photos", "Aller à la racine", "C'est impossible"], a: 1, exp: ".. remonte vers /home/alex, puis on descend dans Photos." }
    ],
    solution: `<pre class="pseudo"># Meme fichier, plusieurs adresses (depuis /home/alex sous Bash) :
/home/alex/Documents/notes.txt     # ABSOLU (part de la racine /)
Documents/notes.txt                # RELATIF (depuis le dossier courant)
~/Documents/notes.txt              # via ~ (dossier personnel)

# Equivalent Windows (absolu) :
C:\Users\Alex\Documents\notes.txt  # racine de lecteur + separateur \

# Regle : commence par / ou C:\  → ABSOLU ; sinon → RELATIF.</pre>
<p>Tu sais lire et écrire l'adresse de n'importe quel fichier. Demain : créer et supprimer des dossiers et des fichiers.</p>`
  }
};
</script>
