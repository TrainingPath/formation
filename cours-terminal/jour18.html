<script>
var DAY = {
  num: 18,
  title: "Les variables d'environnement (PATH...)",
  subtitle: "Comprendre ces réglages invisibles qui pilotent le comportement du shell.",
  theory: `
<h3>1. Qu'est-ce qu'une variable d'environnement ?</h3>
<p>Une <strong>variable d'environnement</strong> est un petit réglage nommé, mémorisé par le système, du type <code>NOM = valeur</code>. Les programmes la consultent pour savoir comment se comporter : où trouver les commandes, quel éditeur utiliser, quelle langue afficher. C'est une sorte de « mémoire partagée » entre le shell et les applications qu'il lance.</p>
<div class="tip">Exemples célèbres : <code>PATH</code> (liste des dossiers où chercher les commandes), <code>HOME</code> (ton dossier personnel), <code>USER</code> (ton nom d'utilisateur), <code>LANG</code> (langue). Sous Windows on retrouve <code>USERPROFILE</code>, <code>TEMP</code>, etc.</div>

<h3>2. Afficher une variable</h3>
<pre class="pseudo"># --- Bash (Linux / macOS) ---
echo $PATH        # $NOM lit la valeur ; echo l'affiche
echo $HOME        # ton dossier personnel
printenv          # liste TOUTES les variables d'environnement
printenv PATH     # une seule</pre>
<pre class="pseudo"># --- PowerShell (Windows) ---
$env:PATH         # $env:NOM lit une variable d'environnement
$env:USERPROFILE  # equivalent du HOME
Get-ChildItem Env: # liste TOUTES les variables (le "lecteur" Env:)</pre>
<pre class="pseudo"># --- CMD (Windows) ---
echo %PATH%       REM %NOM% lit la valeur (les pourcents encadrent le nom)
echo %USERPROFILE%
set               REM liste TOUTES les variables</pre>
<div class="warn">La syntaxe de lecture change selon le shell : <code>$NOM</code> en Bash, <code>$env:NOM</code> en PowerShell, <code>%NOM%</code> en CMD. C'est la source de confusion n°1 quand on passe d'un système à l'autre.</div>

<h3>3. Le PATH : le carnet d'adresses des commandes</h3>
<p>Quand tu tapes <code>git</code>, le shell ne devine pas où se trouve le programme : il parcourt, un par un, les dossiers listés dans <code>PATH</code>, et lance le premier <code>git</code> qu'il trouve. Le <code>PATH</code> est donc une <strong>liste de dossiers séparés</strong> — par <code>:</code> sous Linux/macOS, par <code>;</code> sous Windows.</p>
<pre class="pseudo"># --- Bash --- ou est reellement la commande lancee ?
which git         # affiche le chemin du git qui sera execute
type git          # dit si c'est une commande, un alias, une fonction...</pre>
<pre class="pseudo"># --- PowerShell ---
Get-Command git   # affiche le chemin et le type de la commande git</pre>
<pre class="pseudo"># --- CMD ---
where git          REM affiche le(s) emplacement(s) de git dans le PATH</pre>
<div class="tip">Message « command not found » / « n'est pas reconnu » ? Neuf fois sur dix, le programme existe mais son dossier n'est pas dans le <code>PATH</code>. Ajouter ce dossier au PATH résout le problème.</div>

<h3>4. Définir une variable (pour la session en cours)</h3>
<pre class="pseudo"># --- Bash ---
export EDITEUR=nano      # cree/modifie une variable ET la rend disponible aux programmes
echo $EDITEUR            # nano
# sans export, la variable reste "locale" au shell et n'est pas transmise</pre>
<pre class="pseudo"># --- PowerShell ---
$env:EDITEUR = "nano"    # cree/modifie une variable d'environnement
echo $env:EDITEUR</pre>
<pre class="pseudo"># --- CMD ---
set EDITEUR=nano         REM cree/modifie la variable (attention : pas d'espaces autour du =)
echo %EDITEUR%</pre>
<div class="warn">Ces définitions sont <strong>temporaires</strong> : elles disparaissent à la fermeture du terminal. Pour qu'un réglage survive, il faut l'écrire dans un fichier de configuration (jour 20) ou, sous Windows, dans les variables système. Sous CMD, attention : <code>set NOM = valeur</code> avec espaces crée une variable nommée « NOM » avec un espace !</div>

<h3>5. Ajouter un dossier au PATH (session en cours)</h3>
<pre class="pseudo"># --- Bash --- on ajoute ~/mesoutils en tete du PATH existant
export PATH="$HOME/mesoutils:$PATH"
# on garde l'ancien PATH ($PATH) et on prefixe le nouveau dossier</pre>
<pre class="pseudo"># --- PowerShell ---
$env:PATH = "C:\mesoutils;" + $env:PATH</pre>
<div class="tip">On réutilise toujours l'ancienne valeur (<code>$PATH</code> / <code>$env:PATH</code>) pour ne pas l'écraser. Oublier cela « casse » toutes les commandes de la session, car le shell ne les trouve plus.</div>

<h3>6. Récapitulatif des syntaxes</h3>
<pre class="pseudo"># Lire         : $NOM   (Bash) | $env:NOM (PowerShell) | %NOM% (CMD)
# Tout lister  : printenv | Get-ChildItem Env: | set
# Localiser cmd: which/type | Get-Command | where
# Definir      : export NOM=val | $env:NOM="val" | set NOM=val
# Separateur du PATH : ":" (Unix)  vs  ";" (Windows)</pre>`,
  exercises: [
    { type: "qcm", q: "Une variable d'environnement est…", opts: ["Un fichier caché", "Un réglage nommé (NOM = valeur) que les programmes consultent", "Une commande spéciale", "Un type de terminal"], a: 1, exp: "C'est une paire nom/valeur mémorisée par le système." },
    { type: "input", q: "Bash : quelle commande affiche le contenu de la variable PATH ?", a: ["echo $PATH", "printenv PATH"], ph: "echo …", exp: "echo $PATH affiche la valeur de PATH." },
    { type: "qcm", q: "À quoi sert la variable <code>PATH</code> ?", opts: ["À stocker l'historique des commandes", "À lister les dossiers où le shell cherche les commandes", "À définir la langue", "À indiquer le dossier personnel"], a: 1, exp: "PATH est la liste des dossiers de recherche des exécutables." },
    { type: "input", q: "PowerShell : comment lit-on la variable d'environnement PATH ? (écris l'expression)", a: ["$env:PATH", "$env:Path"], ph: "$env:…", exp: "En PowerShell, on lit une variable d'environnement avec $env:NOM." },
    { type: "qcm", q: "En CMD, comment lit-on la variable USERPROFILE ?", opts: ["$USERPROFILE", "$env:USERPROFILE", "%USERPROFILE%", "echo USERPROFILE"], a: 2, exp: "Sous CMD, on encadre le nom de pourcents : %USERPROFILE%." },
    { type: "vf", q: "Le séparateur des dossiers du PATH est le même sous Linux et sous Windows.", a: false, exp: "Faux : deux-points (:) sous Unix, point-virgule (;) sous Windows." },
    { type: "qcm", q: "Le message « command not found / n'est pas reconnu » signifie souvent que…", opts: ["Le disque est plein", "Le dossier du programme n'est pas dans le PATH", "Le fichier est en lecture seule", "La commande a été désinstallée du système"], a: 1, exp: "Le shell ne trouve pas l'exécutable dans les dossiers du PATH." },
    { type: "input", q: "Bash : quelle commande indique le chemin du programme git qui sera exécuté ?", a: ["which git", "type git"], ph: "which …", exp: "which git affiche le chemin du git trouvé dans le PATH." },
    { type: "qcm", q: "En PowerShell, quel cmdlet localise une commande (comme which) ?", opts: ["Find-Command", "Get-Command", "Where-Object", "Locate"], a: 1, exp: "Get-Command git affiche le type et le chemin de la commande." },
    { type: "input", q: "CMD : quelle commande affiche l'emplacement du programme git dans le PATH ?", a: ["where git"], ph: "where …", exp: "where git liste les emplacements de git (équivalent de which)." },
    { type: "qcm", q: "En Bash, quel mot-clé rend une variable disponible aux programmes lancés ?", opts: ["set", "export", "global", "public"], a: 1, exp: "export transmet la variable à l'environnement des processus enfants." },
    { type: "input", q: "PowerShell : définis la variable d'environnement EDITEUR avec la valeur nano.", a: ["$env:EDITEUR = \"nano\"", "$env:EDITEUR=\"nano\"", "$env:EDITEUR = 'nano'", "$env:EDITEUR='nano'"], ph: "$env:EDITEUR = …", exp: "$env:EDITEUR = \"nano\" crée/modifie la variable." },
    { type: "vf", q: "Une variable définie avec export dans le terminal reste active après la fermeture de celui-ci.", a: false, exp: "Faux : c'est temporaire. Pour la garder, il faut l'écrire dans un fichier de configuration." },
    { type: "qcm", q: "Pour ajouter un dossier au PATH sans perdre l'ancien, en Bash on écrit…", opts: ["export PATH=/mon/dossier", "export PATH=\"/mon/dossier:$PATH\"", "PATH=/mon/dossier (sans export)", "unset PATH"], a: 1, exp: "On réutilise $PATH pour conserver les dossiers existants." },
    { type: "qcm", q: "Sous CMD, <code>set NOM = valeur</code> (avec espaces autour du =) …", opts: ["Fonctionne parfaitement", "Crée une variable au nom bancal (avec un espace) — piège classique", "Est interdit", "Efface la variable"], a: 1, exp: "En CMD il ne faut pas d'espaces autour du = : set NOM=valeur." }
  ],
  final: {
    title: "Exercice final — Diagnostiquer un PATH",
    intro: `<p>Tu viens d'installer un outil <code>monoutil</code> dans <code>~/bin</code> (Linux) mais taper <code>monoutil</code> répond « command not found ». Menons l'enquête.</p>`,
    questions: [
      { type: "input", q: "Bash : affiche d'abord le contenu actuel du PATH pour voir s'il contient ~/bin.", a: ["echo $PATH", "printenv PATH"], ph: "echo …", exp: "echo $PATH montre les dossiers de recherche actuels." },
      { type: "qcm", q: "Le dossier ~/bin n'apparaît pas dans le PATH. Conclusion ?", opts: ["L'outil est corrompu", "Le shell ne cherche pas dans ~/bin, il ne trouve donc pas monoutil", "Le fichier monoutil n'est pas exécutable", "PATH est en lecture seule"], a: 1, exp: "Sans ~/bin dans le PATH, la commande reste introuvable." },
      { type: "input", q: "Bash : ajoute ~/bin au PATH pour la session, sans écraser l'existant.", a: ["export PATH=\"$HOME/bin:$PATH\"", "export PATH=$HOME/bin:$PATH", "export PATH=\"~/bin:$PATH\""], ph: "export PATH=\"…:$PATH\"", exp: "On préfixe $HOME/bin et on garde $PATH." },
      { type: "input", q: "Bash : vérifie maintenant que le shell trouve bien la commande.", a: ["which monoutil", "type monoutil"], ph: "which …", exp: "which monoutil doit désormais afficher ~/bin/monoutil." },
      { type: "qcm", q: "Cet ajout au PATH disparaîtra à la fermeture du terminal. Pour le rendre permanent, il faut…", opts: ["Relancer la commande export à chaque fois", "L'écrire dans le fichier de configuration du shell (jour 20)", "Rien, c'est déjà permanent", "Copier le PATH dans un fichier texte"], a: 1, exp: "Un réglage permanent se met dans le fichier de config (~/.bashrc, profil PowerShell...)." }
    ],
    solution: `<pre class="pseudo"># --- Bash ---
echo $PATH                        # ~/bin est-il present ?
export PATH="$HOME/bin:$PATH"     # on l'ajoute pour la session
which monoutil                    # -> /home/moi/bin/monoutil : trouve !

# Pour rendre permanent : ajouter la ligne export dans ~/.bashrc (jour 20)

# --- PowerShell (equivalent) ---
$env:PATH                                  # inspecter
$env:PATH = "C:\Users\moi\bin;" + $env:PATH  # ajouter un dossier
Get-Command monoutil                       # verifier</pre>
<p>Le PATH n'a plus de secret : tu sais diagnostiquer et corriger un « command not found ». Demain : les alias pour se créer des raccourcis de commandes.</p>`
  }
};
</script>
