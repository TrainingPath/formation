  title: "L'autocomplétion et l'historique",

  theory: `
<h3>1. L'autocomplétion : la touche Tab</h3>
<p>L'<strong>autocomplétion</strong> (ou complétion automatique) consiste à laisser le shell <strong>finir le mot à ta place</strong>. Tu tapes les premières lettres d'une commande ou d'un fichier, tu appuies sur la touche <strong>Tab</strong> (Tabulation), et le shell complète. C'est comme les suggestions de ton téléphone : tu écris moins et tu te trompes moins.</p>
<pre class="pseudo"># Les trois shells : la touche Tab complete
cd Doc[Tab]          # devient  cd Documents/  si c'est le seul choix possible
cat rap[Tab]         # complete en  cat rapport.txt  si un seul fichier correspond</pre>
<div class="tip">La touche <strong>Tab</strong> fonctionne dans Bash, PowerShell ET CMD. C'est peut-être le raccourci le plus rentable de tout ce cours : prends l'habitude de l'utiliser sans arrêt.</div>
<h3>2. Quand plusieurs choix sont possibles</h3>
<p>Si plusieurs noms commencent pareil, le comportement diffère légèrement selon le shell :</p>
<pre class="pseudo"># Bash (Linux/macOS)
# 1er Tab : complete jusqu'a la partie commune ; 2e Tab : LISTE toutes les possibilites
cat no[Tab][Tab]     # affiche notes.txt, notif.log, nouveau.md ...
# PowerShell (Windows)
# Tab fait DEFILER les possibilites une par une (re-Tab pour la suivante)
cat no[Tab]          # propose notes.txt, re-Tab → notif.log ...
# CMD (Windows)
# Tab fait aussi DEFILER les choix un a un
cd Doc[Tab]          # passe d'un dossier correspondant au suivant</pre>
<h3>3. L'historique : retrouver les commandes passées</h3>
<p>Le shell <strong>mémorise</strong> les commandes que tu tapes : c'est l'<strong>historique</strong>. Inutile de retaper une longue commande : on la rappelle. Le moyen le plus simple est la <strong>flèche Haut</strong> (commande précédente) et la <strong>flèche Bas</strong> (suivante).</p>
<pre class="pseudo"># Les trois shells : les fleches parcourent l'historique
# Fleche Haut  → commande precedente
# Fleche Bas   → commande suivante
# On peut alors modifier la ligne rappelee avant d'appuyer sur Entree.</pre>
<h3>4. Voir et rejouer l'historique</h3>
<pre class="pseudo"># Bash (Linux/macOS)
history              # affiche la liste numerotee des commandes passees
!42                  # rejoue la commande numero 42 de l'historique
!!                   # rejoue la TOUTE DERNIERE commande
# PowerShell (Windows)
Get-History          # (alias : history, h) liste les commandes de la session
Invoke-History 42    # (alias : r 42) rejoue la commande numero 42
# CMD (Windows)
doskey /history      # affiche l'historique de la session
# (touche F7 : ouvre une petite fenetre de choix de l'historique)</pre>
<div class="warn">Sous CMD, l'historique n'est conservé que pour la session en cours (il disparaît quand tu fermes la fenêtre). Bash et PowerShell, eux, gardent souvent l'historique d'une session à l'autre dans un fichier.</div>
<h3>5. La recherche dans l'historique (Bash/PowerShell)</h3>
<pre class="pseudo"># Bash (Linux/macOS)
# Ctrl+R : recherche INTERACTIVE dans l'historique. Tape quelques lettres
#          d'une ancienne commande, le shell la retrouve. Entree pour l'executer.
# PowerShell (Windows)
# Ctrl+R fonctionne aussi (recherche arriere dans l'historique).</pre>
<div class="tip">Retiens deux gestes qui feront de toi quelqu'un de rapide : <strong>Tab</strong> pour compléter, <strong>Flèche Haut</strong> (ou <strong>Ctrl+R</strong>) pour rappeler. Ce sont les réflexes qui séparent le débutant de l'utilisateur aguerri.</div>
<h3>6. Résumé</h3>
<pre class="pseudo"># Completer un mot        : Tab                (Bash, PowerShell, CMD)
# Commande precedente     : Fleche Haut        (les trois shells)
# Lister l'historique     : Bash history | PS Get-History | CMD doskey /history
# Rejouer la n-ieme       : Bash !42 | PS Invoke-History 42 | CMD F7 (menu)
# Rechercher (interactif) : Ctrl+R             (Bash et PowerShell)</pre>`,

    { type: "vf", q: "Sous CMD, l'historique disparaît quand on ferme la fenêtre (il ne survit pas à la session).", a: true, exp: "Oui : CMD ne conserve l'historique que pour la session en cours." },

    { type: "qcm", q: "Sous CMD, quelle touche ouvre une fenêtre de choix de l'historique ?", opts: ["F1", "F7", "F12", "Échap"], a: 1, exp: "F7 affiche un menu de l'historique sous CMD." }
  ],

    ],
    solution: `<pre class="pseudo"># Vitesse : completer et rappeler — les trois shells
# Completer un mot :  taper le debut puis  Tab   (Bash, PowerShell, CMD)
# Rappeler la precedente :  Fleche Haut         (les trois shells)

doskey /history      # CMD (ou touche F7 pour un menu)

!42                  # Bash          (!! = derniere commande)
Invoke-History 42    # PowerShell    (alias r 42)
# Rechercher (interactif) :  Ctrl+R   (Bash et PowerShell)</pre>
<p>Tu tapes désormais deux fois plus vite. Demain : les raccourcis clavier qui rendent l'édition de ligne fluide.</p>`
