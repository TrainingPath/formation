<script>
var DAY = {
  num: 13,
  title: "Les redirections (&gt;, &gt;&gt;, 2&gt;)",
  subtitle: "Envoyer la sortie d'une commande dans un fichier au lieu de l'écran.",
  theory: `
<h3>1. D'où viennent et où vont les données ?</h3>
<p>Par défaut, une commande écrit son résultat à l'écran. Mais on peut détourner ce flux : c'est la <strong>redirection</strong>. Rediriger, c'est <strong>changer la destination</strong> du texte produit, comme dévier un tuyau d'eau vers un autre bassin. Trois canaux existent :</p>
<pre class="pseudo"># entree standard   (stdin,  canal 0) : ce qui ENTRE dans la commande
# sortie standard   (stdout, canal 1) : le resultat NORMAL (ce qu'on voit)
# sortie d'erreur    (stderr, canal 2) : les messages d'ERREUR (separes)</pre>
<div class="tip">Idée-clé : le résultat normal et les erreurs voyagent sur DEUX canaux différents (1 et 2). C'est ce qui permet, par exemple, de sauver les erreurs dans un fichier tout en laissant le reste à l'écran.</div>
<h3>2. Rediriger la sortie vers un fichier : &gt;</h3>
<p>Le chevron <strong>&gt;</strong> envoie la sortie normale dans un fichier. S'il existe déjà, son contenu est <strong>ÉCRASÉ</strong> (remplacé).</p>
<pre class="pseudo"># Bash (Linux/macOS)
ls &gt; liste.txt              # ecrit la liste du dossier dans liste.txt (ecrase !)
echo Bonjour &gt; salut.txt    # met « Bonjour » dans salut.txt
# PowerShell (Windows)
Get-ChildItem &gt; liste.txt   # meme principe : &gt; ecrase le fichier
# CMD (Windows)
dir &gt; liste.txt             # redirige la sortie de dir dans liste.txt</pre>
<div class="warn">Le simple <code>&gt;</code> ÉCRASE sans prévenir tout fichier existant. Une commande anodine <code>echo x &gt; important.txt</code> peut détruire le contenu de important.txt. Vérifie toujours le nom du fichier de destination.</div>
<h3>3. Ajouter à la fin sans écraser : &gt;&gt;</h3>
<p>Le double chevron <strong>&gt;&gt;</strong> <strong>ajoute</strong> à la fin du fichier au lieu de l'écraser. Parfait pour un journal qui grandit ligne après ligne.</p>
<pre class="pseudo"># Bash (Linux/macOS)
echo "ligne 1" &gt; notes.txt   # cree (ou ecrase) avec « ligne 1 »
echo "ligne 2" &gt;&gt; notes.txt  # AJOUTE « ligne 2 » a la fin
# PowerShell (Windows)
echo "ligne 2" &gt;&gt; notes.txt  # &gt;&gt; ajoute a la fin
# CMD (Windows)
echo ligne 2 &gt;&gt; notes.txt    # idem</pre>
<h3>4. Rediriger les ERREURS : 2&gt;</h3>
<p>Le canal des erreurs porte le numéro 2. On le redirige avec <strong>2&gt;</strong>. Utile pour mettre de côté les messages d'erreur.</p>
<pre class="pseudo"># Bash (Linux/macOS)
ls dossier_inexistant 2&gt; erreurs.log   # l'ERREUR va dans erreurs.log, pas a l'ecran
ls * 2&gt; /dev/null                       # 2&gt; /dev/null : JETER les erreurs (poubelle)
# PowerShell (Windows)
Get-ChildItem xxx 2&gt; erreurs.log        # rediriger le canal d'erreur
# CMD (Windows)
dir xxx 2&gt; erreurs.log                   # idem sous CMD</pre>
<div class="tip">Sous Bash, <code>/dev/null</code> est une « poubelle » spéciale : tout ce qu'on y envoie disparaît. <code>2&gt; /dev/null</code> signifie donc « ignore les erreurs ». Sous Windows, l'équivalent poubelle s'écrit <code>NUL</code>.</div>
<h3>5. Tout envoyer au même endroit : &gt; fichier 2&gt;&amp;1</h3>
<p>Pour capturer À LA FOIS la sortie normale et les erreurs dans un même fichier :</p>
<pre class="pseudo"># Bash (Linux/macOS)
commande &gt; tout.log 2&gt;&amp;1     # 2&gt;&amp;1 : « envoie aussi le canal 2 la ou va le canal 1 »
# PowerShell (Windows)
commande *&gt; tout.log          # *&gt; capture tous les canaux d'un coup
# CMD (Windows)
commande &gt; tout.log 2&gt;&amp;1     # meme syntaxe qu'en Bash</pre>
<h3>6. Fournir une entrée depuis un fichier : &lt;</h3>
<pre class="pseudo"># Bash (Linux/macOS)
tri &lt; donnees.txt            # &lt; : lit l'ENTREE de la commande depuis donnees.txt
# (le chevron « rentrant » &lt; alimente la commande au lieu du clavier)</pre>
<h3>7. Récapitulatif des symboles</h3>
<pre class="pseudo"># &gt;    rediriger la sortie normale (ECRASE le fichier)
# &gt;&gt;   rediriger la sortie normale (AJOUTE a la fin)
# 2&gt;   rediriger les ERREURS
# &lt;    lire l'entree depuis un fichier
# 2&gt;&amp;1 fusionner erreurs avec la sortie normale (Bash/CMD ; PowerShell : *&gt;)</pre>`,
  exercises: [
    { type: "qcm", q: "Que fait le symbole <code>&gt;</code> dans <code>ls &gt; liste.txt</code> ?", opts: ["Lit liste.txt", "Envoie la sortie de ls dans liste.txt (en écrasant)", "Supprime liste.txt", "Compte les lignes"], a: 1, exp: "&gt; redirige la sortie normale vers le fichier, en écrasant." },
    { type: "vf", q: "Le simple <code>&gt;</code> écrase le contenu du fichier de destination s'il existe déjà.", a: true, exp: "Oui : &gt; remplace tout le contenu existant." },
    { type: "qcm", q: "Quel symbole AJOUTE à la fin d'un fichier sans l'écraser ?", opts: ["&gt;", "&gt;&gt;", "2&gt;", "&lt;"], a: 1, exp: "&gt;&gt; ajoute à la fin (append)." },
    { type: "input", q: "Sous Bash, écris la commande qui met le mot Bonjour dans salut.txt (en écrasant). Utilise echo.", a: ["echo bonjour > salut.txt", "echo Bonjour > salut.txt", "echo bonjour>salut.txt"], ph: "echo …", exp: "echo Bonjour &gt; salut.txt." },
    { type: "qcm", q: "Quel numéro de canal correspond à la sortie d'ERREUR (stderr) ?", opts: ["0", "1", "2", "3"], a: 2, exp: "stderr = canal 2 ; stdout = 1 ; stdin = 0." },
    { type: "input", q: "Sous Bash, quel symbole (avec le numéro) redirige uniquement les ERREURS vers un fichier ?", a: ["2>", "2 >"], ph: "…&gt;", exp: "2&gt; redirige le canal d'erreur." },
    { type: "qcm", q: "Que fait <code>ls * 2&gt; /dev/null</code> sous Bash ?", opts: ["Affiche les erreurs à l'écran", "Jette les messages d'erreur (les envoie à la poubelle)", "Supprime les fichiers", "Compte les erreurs"], a: 1, exp: "/dev/null est une poubelle : 2&gt; /dev/null ignore les erreurs." },
    { type: "input", q: "Sous Windows, quel mot joue le rôle de « poubelle » (équivalent de /dev/null) ?", a: ["nul", "NUL"], ph: "un mot", exp: "Sous Windows, NUL est la destination-poubelle." },
    { type: "qcm", q: "Que représentent les canaux 0, 1 et 2 ?", opts: ["Trois fichiers", "Entrée standard, sortie standard, sortie d'erreur", "Trois commandes", "Trois dossiers"], a: 1, exp: "0 = stdin, 1 = stdout, 2 = stderr." },
    { type: "input", q: "Sous Bash, quel symbole lit l'ENTRÉE d'une commande depuis un fichier ?", a: ["<", "&lt;"], ph: "un symbole", exp: "&lt; alimente la commande depuis un fichier." },
    { type: "qcm", q: "Sous Bash, que signifie <code>commande &gt; tout.log 2&gt;&amp;1</code> ?", opts: ["Écraser deux fichiers", "Envoyer la sortie ET les erreurs dans tout.log", "Supprimer tout.log", "Lire tout.log"], a: 1, exp: "2&gt;&amp;1 fait aussi partir les erreurs là où va la sortie normale." },
    { type: "qcm", q: "Sous PowerShell, quel opérateur capture TOUS les canaux dans un fichier ?", opts: ["2&gt;", "*&gt;", "&gt;&gt;", "&lt;"], a: 1, exp: "*&gt; capture tous les flux d'un coup sous PowerShell." },
    { type: "vf", q: "<code>echo \"a\" &gt; f.txt</code> puis <code>echo \"b\" &gt;&gt; f.txt</code> laisse f.txt contenant a puis b.", a: true, exp: "Oui : &gt; crée avec a, &gt;&gt; ajoute b à la fin." },
    { type: "qcm", q: "Pourquoi séparer sortie normale et erreurs sur deux canaux ?", opts: ["Pour économiser la mémoire du terminal", "Pour pouvoir sauver les erreurs à part tout en gardant le reste", "Parce que c'est obligatoire pour toute commande", "Pour cacher le résultat"], a: 1, exp: "Deux canaux = on traite résultat et erreurs indépendamment." },
    { type: "input", q: "Sous CMD, écris la commande qui met la liste du dossier (dir) dans liste.txt.", a: ["dir > liste.txt", "dir>liste.txt"], ph: "dir …", exp: "dir &gt; liste.txt redirige la sortie de dir." }
  ],
  final: {
    title: "Exercice final — Journaliser proprement",
    intro: `<p>Tu veux enregistrer des informations et des erreurs dans des fichiers plutôt qu'à l'écran. Compose les bonnes redirections.</p>`,
    questions: [
      { type: "input", q: "Bash : écris la liste du dossier courant dans inventaire.txt (en écrasant).", a: ["ls > inventaire.txt", "ls>inventaire.txt"], ph: "ls …", exp: "ls &gt; inventaire.txt." },
      { type: "input", q: "Bash : ajoute la ligne « fin » à la fin de inventaire.txt sans l'écraser.", a: ["echo fin >> inventaire.txt", "echo \"fin\" >> inventaire.txt", "echo fin>>inventaire.txt"], ph: "echo …", exp: "echo fin &gt;&gt; inventaire.txt (double chevron = ajout)." },
      { type: "input", q: "Bash : lance <code>ls dossier_absent</code> en envoyant l'erreur dans erreurs.log.", a: ["ls dossier_absent 2> erreurs.log", "ls dossier_absent 2>erreurs.log"], ph: "…2&gt;…", exp: "ls dossier_absent 2&gt; erreurs.log." },
      { type: "qcm", q: "Bash : comment JETER les erreurs d'une commande ?", opts: ["2&gt; /dev/null", "&gt; erreurs", "&lt; /dev/null", "&gt;&gt; ecran"], a: 0, exp: "2&gt; /dev/null envoie les erreurs à la poubelle." },
      { type: "qcm", q: "Bash : comment mettre sortie ET erreurs dans un seul fichier tout.log ?", opts: ["tout.log 2&gt;", "&gt; tout.log 2&gt;&amp;1", "2&gt; tout.log", "&lt; tout.log"], a: 1, exp: "&gt; tout.log 2&gt;&amp;1 fusionne les deux canaux." }
    ],
    solution: `<pre class="pseudo"># Journaliser proprement — les trois shells
# Bash (Linux/macOS)
ls &gt; inventaire.txt              # ECRASE avec la liste du dossier
echo fin &gt;&gt; inventaire.txt       # AJOUTE une ligne a la fin
ls dossier_absent 2&gt; erreurs.log # rediriger seulement les ERREURS
ls * 2&gt; /dev/null                # jeter les erreurs (poubelle)
commande &gt; tout.log 2&gt;&amp;1         # sortie + erreurs dans un seul fichier
# PowerShell (Windows)
Get-ChildItem &gt; inventaire.txt
Get-ChildItem xxx 2&gt; erreurs.log
commande *&gt; tout.log             # *&gt; capture tous les canaux
# CMD (Windows)
dir &gt; inventaire.txt
dir xxx 2&gt; erreurs.log           # NUL sert de poubelle sous Windows</pre>
<p>Tu maîtrises la direction des flux. Demain : chaîner les commandes entre elles avec les tubes.</p>`
  }
};
</script>
