<script>
var DAY = {
  num: 5,
  title: "Naviguer dans les dossiers (cd, ls, dir)",
  subtitle: "Savoir où l'on est, voir ce qu'il y a, et se déplacer.",
  theory: `
<h3>1. Le dossier courant : « où suis-je ? »</h3>
<p>À tout instant, le shell se trouve « dans » un dossier précis : le <strong>dossier courant</strong> (ou <strong>répertoire de travail</strong>, en anglais <em>working directory</em>). C'est le point de départ implicite de tes commandes, comme la pièce où tu te tiens dans une maison. La première question à se poser est donc : où suis-je ?</p>
<pre class="pseudo"># Bash (Linux/macOS)
pwd              # « print working directory » : affiche le dossier courant
# PowerShell (Windows)
Get-Location     # (alias : pwd, gl) affiche le dossier courant
# CMD (Windows)
cd               # tape seul, sans argument : affiche le dossier courant</pre>
<div class="tip">Astuce mnémotechnique : <code>pwd</code> = « Print Working Directory ». Sous CMD, <code>cd</code> tapé seul (sans destination) affiche simplement où tu es.</div>
<h3>2. Voir le contenu : lister</h3>
<p>Une fois localisé, on veut voir ce que contient le dossier : ses fichiers et sous-dossiers. C'est le rôle de la commande de listing, déjà croisée.</p>
<pre class="pseudo"># Bash (Linux/macOS)
ls               # liste simple
ls -l            # format detaille (droits, taille, date)
ls -a            # -a : affiche AUSSI les fichiers caches (ceux qui commencent par un point)
# PowerShell (Windows)
Get-ChildItem    # (alias : ls, dir) liste le dossier courant
Get-ChildItem -Force   # -Force : inclut les elements caches
# CMD (Windows)
dir              # liste le dossier courant
dir /a           # /a : inclut les fichiers caches et systeme</pre>
<h3>3. Se déplacer : cd</h3>
<p>Pour changer de pièce, on utilise <strong>cd</strong> (« change directory », changer de répertoire) — et, bonne nouvelle, c'est le <strong>même mot dans les trois shells</strong>.</p>
<pre class="pseudo"># Les trois shells : entrer dans un sous-dossier nomme Documents
cd Documents          # Bash / PowerShell / CMD : identique !
# Remonter d'un cran (vers le dossier parent) :
cd ..                 # « .. » designe le dossier parent (le cran au-dessus)
# Le point « . » designe le dossier COURANT (utile plus tard) :
cd .                  # reste au meme endroit</pre>
<div class="warn">Attention aux séparateurs quand tu enchaînes des dossiers : sous Bash <code>cd Documents/Projets</code> (barre oblique <code>/</code>), sous Windows <code>cd Documents\Projets</code> (barre inverse <code>\</code>). PowerShell tolère souvent les deux, mais garde le réflexe <code>/</code> Bash, <code>\</code> Windows.</div>
<h3>4. Retour rapide à la maison</h3>
<p>Le <strong>dossier personnel</strong> (ta « maison ») a des raccourcis pratiques :</p>
<pre class="pseudo"># Bash (Linux/macOS)
cd ~             # ~ (tilde) = ton dossier personnel
cd               # cd tout seul y ramene aussi
# PowerShell (Windows)
cd ~             # ~ fonctionne aussi
# CMD (Windows)
cd %USERPROFILE% # CMD n'a pas ~ : on utilise la variable %USERPROFILE%</pre>
<h3>5. Le trio du quotidien</h3>
<pre class="pseudo"># 1) Ou suis-je ?   pwd        (CMD : cd seul ; PowerShell : Get-Location)
# 2) Qu'y a-t-il ?  ls         (CMD : dir ; PowerShell : Get-ChildItem)
# 3) J'y vais :     cd DOSSIER (identique partout ; cd .. pour remonter)
# Boucle typique : pwd → ls → cd sous-dossier → ls → cd .. …</pre>`,
  exercises: [
    { type: "input", q: "Quelle commande Bash affiche le dossier courant (où l'on se trouve) ?", a: ["pwd"], ph: "une commande", exp: "pwd = print working directory." },
    { type: "qcm", q: "Sous CMD, comment afficher le dossier courant ?", opts: ["pwd", "cd tapé seul (sans argument)", "ls", "where"], a: 1, exp: "Sous CMD, cd sans argument affiche le dossier courant." },
    { type: "input", q: "Quelle est la vraie commande PowerShell (Verbe-Nom) qui affiche le dossier courant ?", a: ["get-location", "gl"], ph: "Verbe-Nom", exp: "Get-Location ; alias pwd et gl." },
    { type: "qcm", q: "Quelle commande sert à CHANGER de dossier dans les trois shells ?", opts: ["ls", "cd", "pwd", "dir"], a: 1, exp: "cd (change directory) est identique en Bash, PowerShell et CMD." },
    { type: "input", q: "Quelle commande fait remonter d'un cran vers le dossier parent (dans les trois shells) ?", a: ["cd ..", ".."], ph: "cd …", exp: "cd .. remonte au dossier parent." },
    { type: "vf", q: "<code>..</code> désigne le dossier parent, et <code>.</code> désigne le dossier courant.", a: true, exp: "Oui : .. = parent, . = dossier courant." },
    { type: "input", q: "Sous Bash, quelle option de ls affiche AUSSI les fichiers cachés ?", a: ["-a", "a"], ph: "-…", exp: "ls -a montre les fichiers cachés (ceux commençant par un point)." },
    { type: "qcm", q: "Sous CMD, quelle option de dir montre aussi les fichiers cachés ?", opts: ["dir -a", "dir /a", "dir --all", "dir hidden"], a: 1, exp: "dir /a inclut les fichiers cachés et système." },
    { type: "qcm", q: "Sous PowerShell, quel paramètre de Get-ChildItem inclut les éléments cachés ?", opts: ["-a", "/a", "-Force", "--hidden"], a: 2, exp: "Get-ChildItem -Force montre les éléments cachés." },
    { type: "input", q: "Sous Bash, quel caractère (tilde) est un raccourci vers ton dossier personnel ?", a: ["~", "tilde"], ph: "un caractère", exp: "~ désigne le dossier personnel sous Bash (et PowerShell)." },
    { type: "qcm", q: "Sous Bash, <code>cd Documents/Projets</code> utilise quel séparateur ?", opts: ["\\ (barre inverse)", "/ (barre oblique)", "| (barre verticale)", ": (deux-points)"], a: 1, exp: "Bash utilise la barre oblique / dans les chemins." },
    { type: "vf", q: "Sous CMD, on enchaîne les dossiers avec la barre inverse, ex. <code>cd Documents\\Projets</code>.", a: true, exp: "Oui : Windows utilise \\ comme séparateur de chemin." },
    { type: "qcm", q: "CMD ne connaît pas le raccourci ~. Comment atteindre le dossier personnel ?", opts: ["cd ~", "cd %USERPROFILE%", "cd home", "pwd"], a: 1, exp: "Sous CMD, on utilise la variable %USERPROFILE%." },
    { type: "input", q: "Quelle option de ls (Bash) donne le format détaillé (droits, taille, date) ?", a: ["-l", "l"], ph: "-…", exp: "ls -l affiche le format long/détaillé." },
    { type: "qcm", q: "Boucle de navigation typique ?", opts: ["cd, cd, cd sans jamais regarder", "pwd (où suis-je) → ls (quoi) → cd (j'y vais) → ls …", "se déplacer au hasard sans jamais se localiser", "pwd uniquement"], a: 1, exp: "On alterne se localiser, lister, puis se déplacer." }
  ],
  final: {
    title: "Exercice final — Une petite balade dans l'arborescence",
    intro: `<p>Tu ouvres un terminal dans ton dossier personnel, qui contient un dossier <code>Documents</code>, lui-même contenant <code>Projets</code>. Guide-toi jusqu'à <code>Projets</code> et reviens.</p>`,
    questions: [
      { type: "input", q: "D'abord, quelle commande Bash confirme où tu es ?", a: ["pwd"], ph: "une commande", exp: "pwd affiche le dossier courant." },
      { type: "input", q: "Quelle commande Bash liste le contenu pour vérifier que Documents existe ?", a: ["ls"], ph: "une commande", exp: "ls liste le dossier courant." },
      { type: "input", q: "Quelle commande (identique dans les 3 shells) entre dans Documents ?", a: ["cd documents", "cd Documents"], ph: "cd …", exp: "cd Documents entre dans le sous-dossier." },
      { type: "input", q: "Depuis Documents, quelle commande Bash descend directement dans Projets ?", a: ["cd projets", "cd Projets"], ph: "cd …", exp: "cd Projets descend d'un cran." },
      { type: "input", q: "Enfin, quelle commande remonte d'un cran vers Documents ?", a: ["cd .."], ph: "cd …", exp: "cd .. remonte au dossier parent." }
    ],
    solution: `<pre class="pseudo"># Balade complete (les separateurs : / sous Bash, \\ sous Windows)
pwd                     # 1) ou suis-je ? (CMD : cd seul ; PS : Get-Location)
ls                      # 2) qu'y a-t-il ? (CMD : dir ; PS : Get-ChildItem)
cd Documents            # 3) entrer dans Documents  (identique partout)
cd Projets              # 4) descendre dans Projets
cd ..                   # 5) remonter vers Documents
cd ~                    # (bonus Bash/PS) revenir a la maison ; CMD : cd %USERPROFILE%</pre>
<p>Tu sais te repérer et te déplacer. Demain : comprendre l'arborescence complète et les chemins absolus/relatifs.</p>`
  }
};
</script>
