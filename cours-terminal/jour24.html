<script>
var DAY = {
  num: 24,
  title: "Archiver et compresser (tar, zip)",
  subtitle: "Regrouper des fichiers en un seul, et réduire leur poids.",
  theory: `
<h3>1. Archiver n'est pas compresser</h3>
<p>Deux idées voisines mais distinctes. <strong>Archiver</strong> = regrouper plusieurs fichiers/dossiers en un <strong>seul fichier</strong> (plus facile à envoyer ou sauvegarder). <strong>Compresser</strong> = <strong>réduire le poids</strong> en éliminant les redondances. On fait souvent les deux ensemble : un dossier entier devient un unique fichier, et plus léger.</p>
<div class="tip">Sous Unix, <code>tar</code> archive et <code>gzip</code> compresse ; les deux se combinent en un <code>.tar.gz</code>. Sous Windows, le format <code>.zip</code> fait les deux à la fois. C'est la principale différence de culture.</div>

<h3>2. tar : l'archiveur d'Unix</h3>
<p>Les options se lisent comme des lettres à assembler : <strong>c</strong>=create, <strong>x</strong>=extract, <strong>t</strong>=list (tester le contenu), <strong>v</strong>=verbose (bavard), <strong>f</strong>=file (nom de l'archive), <strong>z</strong>=gzip (compresser).</p>
<pre class="pseudo"># --- Bash (Linux / macOS) ---
tar -cf archive.tar dossier/       # CREER une archive (sans compression)
tar -czf archive.tar.gz dossier/   # creer ET compresser (z = gzip)
tar -tzf archive.tar.gz            # LISTER le contenu sans extraire (t)
tar -xzf archive.tar.gz            # EXTRAIRE (x) une archive compressee
tar -xzf archive.tar.gz -C /tmp   # extraire vers un dossier precis (-C)</pre>
<div class="tip">Moyen mnémotechnique : « <strong>c</strong>reate <strong>z</strong>ip <strong>f</strong>ile » -> <code>-czf</code> pour fabriquer, « e<strong>x</strong>tract <strong>z</strong>ip <strong>f</strong>ile » -> <code>-xzf</code> pour ouvrir. Le <code>f</code> est toujours suivi du nom de l'archive.</div>
<div class="warn">L'ordre compte : le <code>-f</code> doit être <strong>juste avant</strong> le nom du fichier archive. <code>tar -czf mon.tar.gz dossier/</code> est correct ; intervertir mène à des erreurs déroutantes.</div>

<h3>3. zip / unzip : le format universel</h3>
<pre class="pseudo"># --- Bash --- (paquets zip/unzip souvent a installer)
zip -r archive.zip dossier/    # -r = recursif (inclut les sous-dossiers)
unzip archive.zip              # extrait dans le dossier courant
unzip -l archive.zip           # -l = lister le contenu sans extraire</pre>
<pre class="pseudo"># --- PowerShell (Windows) ---
Compress-Archive -Path dossier\* -DestinationPath archive.zip   # creer un zip
Expand-Archive -Path archive.zip -DestinationPath .\sortie      # extraire</pre>
<pre class="pseudo"># --- CMD (Windows) ---
tar -a -c -f archive.zip dossier   REM tar est present sur Windows recent (-a = auto par extension)
REM sinon on passe par l'Explorateur ou PowerShell</pre>
<div class="tip">Bonne nouvelle : Windows récent embarque une commande <code>tar</code> ! Et <code>.zip</code> se lit partout. Pour l'échange multi-plateforme, le <code>.zip</code> reste le plus universel ; entre machines Unix, le <code>.tar.gz</code> domine.</div>

<h3>4. Vérifier avant d'extraire</h3>
<p>Réflexe de prudence : <strong>lister</strong> le contenu d'une archive avant de l'extraire, pour ne pas déverser des dizaines de fichiers en vrac dans le dossier courant.</p>
<pre class="pseudo"># Lister d'abord
tar -tzf archive.tar.gz          # Unix
unzip -l archive.zip             # zip
# Puis extraire dans un dossier dedie
mkdir sortie && tar -xzf archive.tar.gz -C sortie</pre>

<h3>5. Un cas concret : sauvegarde datée</h3>
<pre class="pseudo"># --- Bash --- archiver un dossier avec la date dans le nom
tar -czf sauvegarde-2026-07-26.tar.gz ~/Documents
# le nom horodate evite d'ecraser les sauvegardes precedentes</pre>
<div class="tip">Nommer l'archive avec une date (année-mois-jour) est une habitude en or : chaque sauvegarde est distincte et se trie toute seule par ordre chronologique. On automatisera cela au projet final (jour 31).</div>

<h3>6. Récapitulatif</h3>
<pre class="pseudo"># Creer+compresser : tar -czf a.tar.gz dossier/ | Compress-Archive ... a.zip | zip -r a.zip dossier/
# Lister           : tar -tzf a.tar.gz | unzip -l a.zip | Get-... (ouvrir)
# Extraire         : tar -xzf a.tar.gz | Expand-Archive a.zip | unzip a.zip
# Formats          : .tar.gz (Unix)   vs   .zip (universel)
# Prudence         : toujours LISTER avant d'extraire</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle est la différence entre archiver et compresser ?", opts: ["Aucune", "Archiver regroupe en un seul fichier ; compresser réduit le poids", "Archiver chiffre ; compresser copie", "Compresser renomme les fichiers un par un"], a: 1, exp: "Archiver = regrouper ; compresser = alléger. On combine souvent les deux." },
    { type: "qcm", q: "Sous Unix, quel outil archive plusieurs fichiers en un seul ?", opts: ["zip seulement", "tar", "grep", "cat"], a: 1, exp: "tar est l'archiveur historique d'Unix." },
    { type: "input", q: "Bash : crée une archive COMPRESSÉE archive.tar.gz du dossier <code>dossier/</code> (options c, z, f).", a: ["tar -czf archive.tar.gz dossier/", "tar -czf archive.tar.gz dossier", "tar czf archive.tar.gz dossier/"], ph: "tar -czf …", exp: "c = créer, z = gzip, f = fichier : tar -czf archive.tar.gz dossier/." },
    { type: "qcm", q: "Dans les options de tar, que signifie <code>x</code> ?", opts: ["compresser", "extraire (extract)", "supprimer", "lister"], a: 1, exp: "x = extract : extraire une archive." },
    { type: "input", q: "Bash : extrais l'archive compressée archive.tar.gz (options x, z, f).", a: ["tar -xzf archive.tar.gz", "tar xzf archive.tar.gz"], ph: "tar -xzf …", exp: "x = extraire, z = gzip, f = fichier." },
    { type: "qcm", q: "Que fait <code>tar -tzf archive.tar.gz</code> ?", opts: ["Extrait l'archive", "LISTE le contenu sans extraire (t = list)", "Supprime l'archive", "La compresse à nouveau"], a: 1, exp: "t liste le contenu de l'archive sans rien extraire." },
    { type: "vf", q: "Dans tar, l'option <code>f</code> doit être suivie du nom du fichier archive.", a: true, exp: "Vrai : f = file, toujours suivi du nom de l'archive (ex. -czf mon.tar.gz)." },
    { type: "input", q: "Bash : crée un fichier ZIP archive.zip du dossier <code>dossier/</code> en incluant les sous-dossiers (option récursive).", a: ["zip -r archive.zip dossier/", "zip -r archive.zip dossier"], ph: "zip -r …", exp: "-r rend zip récursif (inclut les sous-dossiers)." },
    { type: "qcm", q: "Quel cmdlet PowerShell crée une archive ZIP ?", opts: ["New-Zip", "Compress-Archive", "Make-Archive", "Zip-Item"], a: 1, exp: "Compress-Archive crée un .zip ; Expand-Archive l'extrait." },
    { type: "input", q: "PowerShell : extrais archive.zip vers le dossier <code>.\\sortie</code> (cmdlet dédié).", a: ["Expand-Archive -Path archive.zip -DestinationPath .\\sortie", "Expand-Archive archive.zip -DestinationPath .\\sortie", "Expand-Archive archive.zip .\\sortie"], ph: "Expand-Archive -Path archive.zip -DestinationPath …", exp: "Expand-Archive extrait vers le dossier indiqué." },
    { type: "qcm", q: "Quel format est le plus universel pour échanger entre Windows, macOS et Linux ?", opts: [".tar.gz", ".zip", ".rar", ".7z"], a: 1, exp: "Le .zip se lit nativement partout." },
    { type: "vf", q: "Windows récent inclut désormais une commande <code>tar</code> utilisable en ligne de commande.", a: true, exp: "Vrai : tar est fourni avec les versions récentes de Windows." },
    { type: "qcm", q: "Quel réflexe de prudence AVANT d'extraire une archive ?", opts: ["La supprimer", "Lister son contenu (tar -tzf / unzip -l) pour ne pas polluer le dossier", "La compresser encore", "La renommer"], a: 1, exp: "Lister évite de déverser des dizaines de fichiers en vrac." },
    { type: "input", q: "Bash : liste le contenu de archive.zip sans l'extraire (unzip avec l'option de listage).", a: ["unzip -l archive.zip"], ph: "unzip -l …", exp: "unzip -l affiche le contenu sans extraire." },
    { type: "qcm", q: "Pourquoi horodater le nom d'une archive de sauvegarde (ex. sauvegarde-2026-07-26.tar.gz) ?", opts: ["Pour la compresser davantage", "Pour ne pas écraser les sauvegardes précédentes et les trier par date", "Pour la chiffrer", "C'est obligatoire"], a: 1, exp: "Le nom daté garde chaque sauvegarde distincte et triable chronologiquement." }
  ],
  final: {
    title: "Exercice final — Sauvegarder puis restaurer un dossier",
    intro: `<p>Tu veux sauvegarder ton dossier <code>~/projet</code> dans une archive compressée datée, vérifier son contenu, puis apprendre à la restaurer ailleurs.</p>`,
    questions: [
      { type: "input", q: "Bash : crée une archive compressée nommée projet-2026-07-26.tar.gz du dossier ~/projet.", a: ["tar -czf projet-2026-07-26.tar.gz ~/projet", "tar -czf projet-2026-07-26.tar.gz ~/projet/"], ph: "tar -czf projet-2026-07-26.tar.gz …", exp: "c z f : créer, compresser, nommer l'archive." },
      { type: "input", q: "Bash : vérifie le contenu de l'archive sans l'extraire.", a: ["tar -tzf projet-2026-07-26.tar.gz", "tar tzf projet-2026-07-26.tar.gz"], ph: "tar -tzf …", exp: "t liste le contenu pour contrôle." },
      { type: "qcm", q: "Pourquoi la date dans le nom de l'archive est-elle une bonne idée ?", opts: ["Pour compresser plus", "Pour distinguer chaque sauvegarde et éviter d'écraser la précédente", "Pour la chiffrer", "Aucune raison"], a: 1, exp: "Chaque sauvegarde datée est unique et se trie chronologiquement." },
      { type: "input", q: "Bash : extrais l'archive dans le dossier /tmp (option de destination).", a: ["tar -xzf projet-2026-07-26.tar.gz -C /tmp", "tar xzf projet-2026-07-26.tar.gz -C /tmp"], ph: "tar -xzf … -C /tmp", exp: "-C /tmp choisit le dossier de destination de l'extraction." },
      { type: "qcm", q: "En PowerShell, quel duo de cmdlets fait créer puis extraire un zip ?", opts: ["Compress-Archive et Expand-Archive", "New-Zip et Open-Zip", "tar et untar", "Get-Archive seul"], a: 0, exp: "Compress-Archive crée le zip, Expand-Archive l'extrait." }
    ],
    solution: `<pre class="pseudo"># --- Bash ---
tar -czf projet-2026-07-26.tar.gz ~/projet   # 1. archiver + compresser (nom date)
tar -tzf projet-2026-07-26.tar.gz            # 2. verifier le contenu
tar -xzf projet-2026-07-26.tar.gz -C /tmp    # 3. restaurer dans /tmp

# --- PowerShell (equivalent) ---
Compress-Archive -Path $HOME\projet\* -DestinationPath projet-2026-07-26.zip
Expand-Archive  -Path projet-2026-07-26.zip -DestinationPath C:\Temp\projet</pre>
<p>Tu sais empaqueter, vérifier et restaurer. Cette brique servira au projet final. Demain : le réseau en ligne de commande (ping, curl, ssh).</p>`
  }
};
