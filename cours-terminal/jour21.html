<script>
var DAY = {
  num: 21,
  title: "Gérer les processus (ps, top, Get-Process, kill)",
  subtitle: "Voir ce qui tourne, repérer un gourmand, et l'arrêter proprement.",
  theory: `
<h3>1. Qu'est-ce qu'un processus ?</h3>
<p>Un <strong>processus</strong> est un programme <strong>en cours d'exécution</strong>. Chaque application ouverte, chaque commande longue, chaque service en tâche de fond est un processus. Le système lui attribue un numéro unique, le <strong>PID</strong> (Process IDentifier), qui sert à l'identifier et à agir dessus.</p>
<div class="tip">Programme = fichier sur le disque (au repos). Processus = ce même programme une fois <strong>lancé</strong> et vivant en mémoire. Le PID est sa « plaque d'immatriculation ».</div>

<h3>2. Lister les processus</h3>
<pre class="pseudo"># --- Bash (Linux / macOS) ---
ps               # les processus de TON terminal
ps aux           # TOUS les processus, avec details (utilisateur, %CPU, %MEM...)
ps aux | grep firefox   # filtrer pour ne garder que firefox</pre>
<pre class="pseudo"># --- PowerShell (Windows) ---
Get-Process              # tous les processus
Get-Process firefox      # filtre par nom
gps                      # alias court de Get-Process</pre>
<pre class="pseudo"># --- CMD (Windows) ---
tasklist                 REM liste tous les processus (nom, PID, memoire)
tasklist | findstr firefox   REM filtrer</pre>
<div class="warn">Le PID change à chaque lancement : le firefox d'hier n'a pas le même PID qu'aujourd'hui. On repère donc d'abord le processus (par son nom), on lit son PID, puis on agit.</div>

<h3>3. Voir l'activité en direct : le moniteur temps réel</h3>
<pre class="pseudo"># --- Bash ---
top              # tableau de bord vivant : CPU, memoire, tri par gourmandise (q pour quitter)
htop             # version plus lisible et coloree (si installee)</pre>
<pre class="pseudo"># --- PowerShell ---
Get-Process | Sort-Object CPU -Descending | Select-Object -First 5   # top 5 CPU
# (pas de "top" vivant integre ; on peut relancer la commande ou ouvrir le Gestionnaire des taches)</pre>
<div class="tip"><code>top</code> est le tableau de bord vivant d'Unix : il se rafraîchit sans arrêt et classe les processus par consommation. On le quitte avec <strong>q</strong>. Sous Windows, le Gestionnaire des tâches graphique joue ce rôle.</div>

<h3>4. Arrêter un processus : kill / Stop-Process</h3>
<p>Arrêter un processus, c'est lui envoyer un <strong>signal</strong>. Le plus courant demande poliment de se terminer ; un autre force l'arrêt immédiat.</p>
<pre class="pseudo"># --- Bash --- on agit par PID ou par nom
kill 4321          # demande au processus PID 4321 de se terminer (signal TERM, poli)
kill -9 4321       # force l'arret immediat (signal KILL) - dernier recours
pkill firefox      # tue par NOM plutot que par PID</pre>
<pre class="pseudo"># --- PowerShell ---
Stop-Process -Id 4321          # arrete le processus PID 4321
Stop-Process -Name firefox     # arrete par nom
Stop-Process -Id 4321 -Force   # force l'arret</pre>
<pre class="pseudo"># --- CMD ---
taskkill /PID 4321             REM arrete par PID
taskkill /IM firefox.exe       REM /IM = par nom d'image (executable)
taskkill /F /IM firefox.exe    REM /F = force</pre>
<div class="warn"><code>kill -9</code> (ou <code>/F</code>) coupe brutalement : le programme n'a pas le temps de sauvegarder. On l'utilise en <strong>dernier recours</strong>, quand l'arrêt poli ne suffit pas. Toujours essayer l'arrêt normal d'abord.</div>

<h3>5. Arrêter la commande du terminal : Ctrl+C</h3>
<p>Pour une commande lancée dans <strong>ton</strong> terminal et qui tourne devant toi, pas besoin de PID :</p>
<pre class="pseudo"># Ctrl + C : interrompt la commande en cours (envoie le signal d'interruption)
# Ctrl + Z : la met en PAUSE (arriere-plan) - Bash : "fg" pour la reprendre
# Ces raccourcis marchent dans les trois terminaux.</pre>

<h3>6. Récapitulatif</h3>
<pre class="pseudo"># Lister      : ps aux | Get-Process | tasklist
# Filtrer     : ps aux | grep X | Get-Process X | tasklist | findstr X
# Temps reel  : top / htop | (Gestionnaire des taches)
# Arreter/PID : kill PID | Stop-Process -Id PID | taskkill /PID PID
# Arreter/nom : pkill X  | Stop-Process -Name X | taskkill /IM X.exe
# Forcer      : kill -9  | -Force              | /F
# Commande active : Ctrl+C</pre>`,
  exercises: [
    { type: "qcm", q: "Un processus, c'est…", opts: ["Un fichier sur le disque", "Un programme EN COURS d'exécution", "Un dossier système", "Un type de terminal"], a: 1, exp: "Le processus est le programme une fois lancé et vivant en mémoire." },
    { type: "qcm", q: "Que signifie PID ?", opts: ["Program Install Directory", "Process IDentifier (numéro unique du processus)", "Public Internet Data", "Primary Input Device"], a: 1, exp: "Le PID identifie de façon unique un processus." },
    { type: "input", q: "Bash : quelle commande liste TOUS les processus avec leurs détails (utilisateur, CPU, mémoire) ?", a: ["ps aux", "ps -aux", "ps -ef"], ph: "ps …", exp: "ps aux affiche tous les processus avec le détail." },
    { type: "qcm", q: "En PowerShell, quel cmdlet liste les processus ?", opts: ["List-Process", "Get-Process", "Show-Tasks", "ps"], a: 1, exp: "Get-Process (alias gps) liste les processus." },
    { type: "input", q: "CMD : quelle commande liste les processus en cours ?", a: "tasklist", ph: "une commande", exp: "tasklist affiche les processus sous CMD." },
    { type: "qcm", q: "À quoi sert <code>top</code> sous Linux ?", opts: ["À trier des fichiers", "À afficher un tableau de bord VIVANT des processus (CPU, mémoire)", "À supprimer un processus", "À ouvrir un fichier"], a: 1, exp: "top est un moniteur temps réel des processus." },
    { type: "input", q: "Dans <code>top</code>, quelle touche permet de quitter ?", a: "q", ph: "une touche", exp: "q ferme top et rend la main au shell." },
    { type: "qcm", q: "Pour filtrer les processus contenant « firefox » en Bash, on écrit…", opts: ["ps aux | grep firefox", "ps aux firefox", "top firefox", "kill firefox"], a: 0, exp: "ps aux | grep firefox filtre la liste avec grep." },
    { type: "input", q: "Bash : demande poliment au processus de PID 4321 de se terminer.", a: ["kill 4321"], ph: "kill …", exp: "kill 4321 envoie le signal TERM (arrêt normal)." },
    { type: "qcm", q: "Que fait <code>kill -9 4321</code> ?", opts: ["Redémarre le processus", "Force l'arrêt immédiat du processus (dernier recours)", "Met en pause", "Abaisse sa priorité CPU"], a: 1, exp: "-9 envoie KILL : arrêt brutal, sans sauvegarde." },
    { type: "vf", q: "<code>kill -9</code> est la première chose à essayer pour arrêter un programme.", a: false, exp: "Faux : on essaie d'abord l'arrêt normal (kill sans -9). Le -9 est un dernier recours." },
    { type: "input", q: "PowerShell : arrête le processus dont le nom est firefox.", a: ["Stop-Process -Name firefox", "Stop-Process -Name \"firefox\""], ph: "Stop-Process -Name …", exp: "Stop-Process -Name firefox arrête par nom." },
    { type: "qcm", q: "Sous CMD, quelle commande arrête un processus par son nom d'exécutable ?", opts: ["kill firefox.exe", "taskkill /IM firefox.exe", "Stop-Process firefox", "taskkill /NAME firefox.exe"], a: 1, exp: "taskkill /IM firefox.exe arrête par nom d'image ; /F pour forcer." },
    { type: "qcm", q: "Une commande tourne dans ton terminal devant toi. Comment l'interrompre sans chercher son PID ?", opts: ["Fermer la fenêtre du terminal", "Ctrl + C", "kill 0", "Attendre qu'elle se termine seule"], a: 1, exp: "Ctrl+C interrompt la commande active du terminal." },
    { type: "vf", q: "Le PID d'une application reste le même à chaque fois qu'on la relance.", a: false, exp: "Faux : un nouveau PID est attribué à chaque lancement." }
  ],
  final: {
    title: "Exercice final — Maîtriser un processus gourmand",
    intro: `<p>Ton ventilateur s'emballe : un processus <code>encodeur</code> consomme tout le CPU. Objectif : le repérer, lire son PID, puis l'arrêter proprement.</p>`,
    questions: [
      { type: "input", q: "Bash : liste tous les processus et filtre ceux nommés « encodeur ».", a: ["ps aux | grep encodeur", "ps aux|grep encodeur"], ph: "ps aux | grep …", exp: "ps aux | grep encodeur isole le processus recherché (et son PID)." },
      { type: "qcm", q: "Dans la sortie, quelle information sert à agir sur le processus ?", opts: ["Le nom d'utilisateur", "Le PID (son numéro)", "La date du fichier", "Le pourcentage de mémoire"], a: 1, exp: "Le PID identifie le processus à arrêter." },
      { type: "input", q: "Bash : le PID est 7788. Demande-lui d'abord de se terminer normalement.", a: ["kill 7788"], ph: "kill …", exp: "kill 7788 envoie le signal d'arrêt normal (TERM)." },
      { type: "qcm", q: "Il ne répond pas au bout de quelques secondes. Que faire ?", opts: ["kill -9 7788 (forcer, en dernier recours)", "Attendre encore dix minutes", "Le relancer", "Réduire la fenêtre du terminal"], a: 0, exp: "kill -9 force l'arrêt quand le TERM poli échoue." },
      { type: "qcm", q: "En PowerShell, l'équivalent de forcer l'arrêt du PID 7788 est…", opts: ["Stop-Process -Id 7788 -Force", "Get-Process 7788", "taskkill 7788", "kill 7788"], a: 0, exp: "Stop-Process -Id 7788 -Force force l'arrêt sous PowerShell." }
    ],
    solution: `<pre class="pseudo"># --- Bash ---
ps aux | grep encodeur     # repere le processus et lit son PID (ex : 7788)
kill 7788                  # 1er essai : arret normal (poli)
kill -9 7788               # s'il resiste : arret force (dernier recours)

# --- PowerShell ---
Get-Process encodeur                 # repere par nom, lit l'Id
Stop-Process -Name encodeur          # arret normal
Stop-Process -Id 7788 -Force         # arret force

# --- CMD ---
tasklist | findstr encodeur
taskkill /IM encodeur.exe            REM normal
taskkill /F /IM encodeur.exe         REM force</pre>
<p>Tu sais observer et reprendre la main sur ce qui tourne. Demain : les permissions et l'élévation de privilèges (sudo, administrateur).</p>`
  }
};
</script>
