<script>
var DAY = {
  num: 22,
  title: "Les permissions et l'élévation (sudo, admin)",
  subtitle: "Qui a le droit de faire quoi, et comment obtenir les droits nécessaires sans danger.",
  theory: `
<h3>1. Pourquoi des permissions ?</h3>
<p>Un système multi-utilisateurs doit empêcher n'importe qui de tout modifier. Chaque fichier a donc un <strong>propriétaire</strong> et des <strong>permissions</strong> : qui peut le lire, le modifier, l'exécuter. C'est une protection : elle évite les catastrophes (effacer un fichier système) et sépare les utilisateurs.</p>
<div class="tip">Trois droits fondamentaux sous Unix : <strong>r</strong> (read, lire), <strong>w</strong> (write, modifier), <strong>x</strong> (execute, lancer). Ils s'appliquent à trois catégories : le <strong>propriétaire</strong>, le <strong>groupe</strong>, et les <strong>autres</strong>.</p></div>

<h3>2. Lire les permissions (Unix)</h3>
<pre class="pseudo"># --- Bash (Linux / macOS) ---
ls -l fichier.txt
# -rw-r--r--  1 alice  staff  1024 ... fichier.txt
#  |  |  |  |
#  |  |  |  autres : r-- (lecture seule)
#  |  |  groupe : r-- (lecture seule)
#  |  proprietaire : rw- (lecture + ecriture)
#  type : - (fichier) ou d (dossier)</pre>
<div class="warn">Le premier caractère n'est pas une permission : <code>-</code> signale un fichier, <code>d</code> un dossier. Ensuite les 9 caractères vont par blocs de 3 : propriétaire, groupe, autres.</div>

<h3>3. Modifier les permissions : chmod (Unix)</h3>
<pre class="pseudo"># --- Bash --- forme symbolique (lisible)
chmod u+x script.sh     # u=proprietaire (user), +x = ajoute le droit d'execution
chmod go-w fichier.txt  # g=groupe, o=autres (others), -w = retire l'ecriture
chmod +x script.sh      # rend le script executable pour tous</pre>
<pre class="pseudo"># --- Bash --- forme numerique (octale) : r=4, w=2, x=1
chmod 644 fichier.txt   # 6=rw- (proprio), 4=r-- (groupe), 4=r-- (autres)
chmod 755 script.sh     # 7=rwx (proprio), 5=r-x, 5=r-x : executable partout</pre>
<div class="tip">Astuce octale : additionne r(4) + w(2) + x(1). Ainsi 7 = rwx, 6 = rw-, 5 = r-x, 4 = r--. Trois chiffres = propriétaire, groupe, autres. <code>644</code> et <code>755</code> sont les deux valeurs qu'on croise le plus.</div>

<h3>4. Changer de propriétaire : chown (Unix)</h3>
<pre class="pseudo"># --- Bash ---
chown alice fichier.txt        # donne le fichier a l'utilisateur alice
chown alice:equipe fichier.txt # change proprietaire ET groupe
# (necessite en general les droits administrateur - voir plus bas)</pre>

<h3>5. L'élévation : sudo (Unix) et Administrateur (Windows)</h3>
<p>Certaines actions (installer un logiciel, modifier un fichier système) exigent des <strong>droits élevés</strong>. On ne travaille PAS en permanence en administrateur : on élève ponctuellement, le temps d'une commande.</p>
<pre class="pseudo"># --- Bash (Linux / macOS) ---
sudo apt update          # "SuperUser DO" : execute CETTE commande en administrateur
sudo nano /etc/hosts     # editer un fichier systeme protege
# sudo demande ton mot de passe, puis n'eleve que cette commande</pre>
<pre class="pseudo"># --- PowerShell (Windows) ---
# On ouvre un terminal "en tant qu'administrateur" (clic droit -> Executer en administrateur)
Start-Process powershell -Verb RunAs   # relance PowerShell avec elevation (UAC)</pre>
<pre class="pseudo"># --- CMD (Windows) ---
REM Idem : lancer l'Invite de commandes "en tant qu'administrateur".
REM Le controle UAC (fenetre de confirmation) protege l'elevation.</pre>
<div class="warn">Règle d'or : <strong>n'utilise sudo / l'élévation que lorsque c'est vraiment nécessaire</strong>, et relis la commande avant de valider. Une commande destructrice lancée en administrateur peut abîmer le système entier. Le privilège élevé retire les garde-fous.</div>

<h3>6. Récapitulatif</h3>
<pre class="pseudo"># Voir droits (Unix)   : ls -l
# Changer droits       : chmod u+x / chmod 755
# Changer proprietaire : chown alice fichier
# Elever une commande  : sudo commande     (Unix)
# Elever la session    : "Executer en tant qu'administrateur" (Windows) / Start-Process -Verb RunAs
# Principe             : elever le moins possible, relire avant de valider</pre>`,
  exercises: [
    { type: "qcm", q: "À quoi servent les permissions de fichiers ?", opts: ["À masquer les fichiers importants", "À définir qui peut lire, modifier ou exécuter un fichier", "À compresser les fichiers", "À trier les fichiers par date"], a: 1, exp: "Elles contrôlent l'accès : lecture, écriture, exécution, par catégorie d'utilisateur." },
    { type: "qcm", q: "Que signifient les lettres r, w, x sous Unix ?", opts: ["run, wait, exit", "read (lire), write (modifier), execute (exécuter)", "ready, work, extend", "receive, write, transfer"], a: 1, exp: "r = lire, w = écrire/modifier, x = exécuter." },
    { type: "input", q: "Bash : quelle commande affiche les permissions détaillées de fichier.txt ?", a: ["ls -l fichier.txt", "ls -l"], ph: "ls -l …", exp: "ls -l montre le type, les droits, le propriétaire..." },
    { type: "qcm", q: "Dans <code>-rw-r--r--</code>, que représente le tout premier caractère (le tiret) ?", opts: ["Une permission de lecture", "Le TYPE : - pour un fichier, d pour un dossier", "Le propriétaire", "Le nombre de liens du fichier"], a: 1, exp: "Le premier caractère indique le type (fichier ou dossier), pas un droit." },
    { type: "input", q: "Bash : rends le script <code>script.sh</code> exécutable (forme symbolique, pour tous).", a: ["chmod +x script.sh", "chmod u+x script.sh", "chmod a+x script.sh"], ph: "chmod +x …", exp: "chmod +x script.sh ajoute le droit d'exécution." },
    { type: "qcm", q: "En notation octale, que vaut <code>rwx</code> ?", opts: ["3", "5", "7", "9"], a: 2, exp: "r(4) + w(2) + x(1) = 7." },
    { type: "qcm", q: "Que fait <code>chmod 644 fichier.txt</code> ?", opts: ["rwx pour tous", "rw- propriétaire, r-- groupe, r-- autres", "Aucun droit", "Rend exécutable"], a: 1, exp: "6 = rw-, 4 = r--, 4 = r-- : lecture/écriture pour le propriétaire, lecture pour les autres." },
    { type: "input", q: "Bash : donne les droits 755 au script deploy.sh.", a: ["chmod 755 deploy.sh"], ph: "chmod 755 …", exp: "755 = rwx / r-x / r-x : exécutable partout, modifiable par le propriétaire." },
    { type: "qcm", q: "Quelle commande change le PROPRIÉTAIRE d'un fichier sous Unix ?", opts: ["chmod", "chown", "chgrp seulement", "owner"], a: 1, exp: "chown (change owner) modifie le propriétaire." },
    { type: "qcm", q: "Que veut dire <code>sudo</code> ?", opts: ["Super Undo", "SuperUser DO : exécuter une commande avec les droits administrateur", "Sudden Operation", "Safe Do"], a: 1, exp: "sudo exécute la commande qui suit avec les privilèges d'administrateur." },
    { type: "input", q: "Bash : mets à jour les paquets système (apt update) en tant qu'administrateur.", a: ["sudo apt update"], ph: "sudo …", exp: "sudo apt update élève juste cette commande." },
    { type: "vf", q: "Il est recommandé de travailler en permanence en tant qu'administrateur pour éviter de retaper sudo.", a: false, exp: "Faux : on élève seulement quand c'est nécessaire. Travailler en admin en continu est dangereux." },
    { type: "qcm", q: "Sous Windows, comment obtenir un terminal avec droits élevés ?", opts: ["Taper sudo", "Le lancer « en tant qu'administrateur » (clic droit / RunAs, confirmation UAC)", "Changer le PATH", "Redémarrer"], a: 1, exp: "On ouvre PowerShell/CMD « en tant qu'administrateur » ; l'UAC confirme l'élévation." },
    { type: "input", q: "PowerShell : quelle commande relance PowerShell avec élévation (UAC) ? (avec le verbe RunAs)", a: ["Start-Process powershell -Verb RunAs", "Start-Process powershell -Verb runas"], ph: "Start-Process powershell -Verb …", exp: "Start-Process powershell -Verb RunAs demande l'élévation via l'UAC." },
    { type: "qcm", q: "Avant de valider une commande lancée avec sudo, il faut…", opts: ["La lancer sans la vérifier", "La relire attentivement, car les garde-fous sont retirés", "L'exécuter en tâche de fond", "Désactiver le mot de passe"], a: 1, exp: "En élévation, une erreur peut abîmer le système : on relit toujours." }
  ],
  final: {
    title: "Exercice final — Rendre un script exécutable et l'installer",
    intro: `<p>Tu as écrit <code>sauvegarde.sh</code>. Il faut le rendre exécutable, puis le copier dans <code>/usr/local/bin</code> (un dossier système protégé) pour l'appeler de partout.</p>`,
    questions: [
      { type: "input", q: "Bash : vérifie d'abord les permissions actuelles du script.", a: ["ls -l sauvegarde.sh", "ls -l"], ph: "ls -l …", exp: "ls -l sauvegarde.sh montre s'il a déjà le droit x." },
      { type: "input", q: "Bash : rends-le exécutable (forme numérique classique d'un script).", a: ["chmod 755 sauvegarde.sh", "chmod +x sauvegarde.sh", "chmod u+x sauvegarde.sh"], ph: "chmod …", exp: "chmod 755 (ou +x) ajoute le droit d'exécution." },
      { type: "qcm", q: "Copier dans /usr/local/bin échoue avec « Permission refusée ». Pourquoi ?", opts: ["Le fichier est trop gros", "C'est un dossier système protégé : il faut des droits élevés", "Le PATH est vide", "Le script est corrompu"], a: 1, exp: "Écrire dans un dossier système exige l'élévation." },
      { type: "input", q: "Bash : copie le script dans /usr/local/bin avec les droits administrateur.", a: ["sudo cp sauvegarde.sh /usr/local/bin", "sudo cp sauvegarde.sh /usr/local/bin/"], ph: "sudo cp …", exp: "sudo cp élève la copie vers le dossier système." },
      { type: "qcm", q: "Bon réflexe juste avant de valider cette commande sudo ?", opts: ["La valider immédiatement", "Relire la commande pour vérifier le chemin de destination", "Ignorer le chemin de destination", "Désactiver le mot de passe sudo"], a: 1, exp: "En élévation, on relit toujours : une erreur de chemin peut faire des dégâts." }
    ],
    solution: `<pre class="pseudo"># --- Bash ---
ls -l sauvegarde.sh                 # voir les droits actuels
chmod 755 sauvegarde.sh             # rendre executable (rwx / r-x / r-x)
sudo cp sauvegarde.sh /usr/local/bin  # installer (dossier systeme -> sudo)
# on relit la commande AVANT de valider le mot de passe sudo

# --- Windows (equivalent d'esprit) ---
# Ouvrir PowerShell "en tant qu'administrateur", puis :
Copy-Item .\sauvegarde.ps1 C:\Windows\System32\   # ecrire dans un dossier protege exige l'elevation</pre>
<p>Tu maîtrises droits et élévation : la clé pour agir sans casser. Demain : retrouver n'importe quel fichier avec find et where.</p>`
  }
};
</script>
