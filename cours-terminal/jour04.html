<script>
var DAY = {
  num: 4,
  title: "L'anatomie d'une commande",
  subtitle: "Nom, options, arguments : décortiquer chaque ordre qu'on donne au shell.",
  theory: `
<h3>1. Une phrase que le shell sait lire</h3>
<p>Une commande ressemble à une petite phrase à l'impératif. Elle comporte presque toujours trois parties : le <strong>nom de la commande</strong> (le verbe : quoi faire), des <strong>options</strong> (comment le faire) et des <strong>arguments</strong> (sur quoi le faire). Le shell découpe ta ligne aux <strong>espaces</strong> pour identifier ces morceaux.</p>
<pre class="pseudo"># Bash : exemple type
ls -l /home
# └┬┘ └┬┘ └─┬─┘
#  |   |   └── argument : SUR QUOI (le dossier /home)
#  |   └────── option   : COMMENT (-l = format detaille)
#  └────────── commande : QUOI FAIRE (lister)</pre>
<h3>2. Le nom de la commande</h3>
<p>C'est le premier mot : le <strong>verbe</strong> d'action. <code>ls</code>, <code>cd</code>, <code>copy</code>, <code>Get-ChildItem</code>… C'est lui qui décide de tout le reste. Sans nom valide, le shell répond « commande introuvable ».</p>
<h3>3. Les options (aussi appelées drapeaux/flags)</h3>
<p>Une <strong>option</strong> modifie le comportement de la commande : c'est un « comment ». Les conventions diffèrent selon le shell :</p>
<pre class="pseudo"># Bash / macOS
ls -l               # option courte : un seul tiret + une lettre
ls -la              # on peut coller plusieurs options courtes : -l et -a
ls --all            # option longue : deux tirets + un mot entier
# PowerShell
Get-ChildItem -Force        # option (« parametre ») : un tiret + un mot
Get-ChildItem -Recurse      # convention : un seul tiret, nom complet
# CMD
dir /a              # option : une barre oblique /  + une lettre
dir /s              # /s = parcourt aussi les sous-dossiers</pre>
<div class="tip">Piège classique des débutants : sous Bash l'option commence par <code>-</code> (tiret), sous CMD par <code>/</code> (barre oblique), et sous PowerShell par <code>-</code> mais suivi d'un <strong>mot</strong> complet (<code>-Force</code>, <code>-Recurse</code>). Trois conventions à ne pas mélanger.</div>
<h3>4. Les arguments</h3>
<p>Un <strong>argument</strong> est la cible : le « sur quoi » agit la commande — un fichier, un dossier, un texte. Beaucoup de commandes en acceptent plusieurs, séparés par des espaces.</p>
<pre class="pseudo"># Bash : deux arguments (deux fichiers a afficher)
cat notes.txt resume.txt
# PowerShell : l'argument est nomme apres -Path
Get-Content -Path notes.txt
# CMD : l'argument suit directement la commande
type notes.txt</pre>
<h3>5. Le piège des espaces dans les noms</h3>
<p>Comme le shell découpe aux espaces, un nom de fichier contenant une espace (« mon fichier.txt ») serait lu comme <strong>deux</strong> arguments. Solution universelle : les <strong>guillemets</strong>.</p>
<pre class="pseudo"># Les trois shells : proteger un nom qui contient une espace
cat "mon fichier.txt"            # Bash : sans guillemets → deux arguments !
Get-Content "mon fichier.txt"   # PowerShell
type "mon fichier.txt"          # CMD</pre>
<div class="warn">Sans guillemets, <code>cat mon fichier.txt</code> demande d'afficher DEUX fichiers (<code>mon</code> et <code>fichier.txt</code>) et provoque une erreur. Entoure toujours de guillemets un nom contenant une espace.</div>
<h3>6. L'ordre général à retenir</h3>
<pre class="pseudo"># Schema quasi universel :
#   commande  [options]  [arguments]
# Bash        : ls        -l         /home
# PowerShell  : Get-ChildItem -Force  C:\Users
# CMD         : dir       /a         C:\Users
# Le shell decoupe aux ESPACES : proteger les noms espaces par des guillemets.</pre>`,
  exercises: [
    { type: "qcm", q: "Dans <code>ls -l /home</code>, que représente <code>ls</code> ?", opts: ["Une option", "Un argument", "Le nom de la commande (le verbe)", "Un guillemet"], a: 2, exp: "ls est le nom de la commande : quoi faire." },
    { type: "qcm", q: "Dans <code>ls -l /home</code>, que représente <code>-l</code> ?", opts: ["La commande", "Une option (comment le faire)", "Un argument (sur quoi)", "Un séparateur"], a: 1, exp: "-l est une option : elle demande le format détaillé." },
    { type: "input", q: "Dans <code>ls -l /home</code> (Bash), quel mot est l'argument (la cible) ?", a: ["/home", "home"], ph: "un mot", exp: "/home est l'argument : le dossier sur lequel agit la commande." },
    { type: "qcm", q: "Le shell découpe la ligne de commande en morceaux d'après…", opts: ["Les virgules", "Les espaces", "Les majuscules", "Les points"], a: 1, exp: "Le découpage se fait aux espaces." },
    { type: "qcm", q: "Sous Bash, une option courte commence par…", opts: ["/ (barre oblique)", "- (un tiret)", "-- toujours obligatoirement", ". (un point)"], a: 1, exp: "Option courte Bash : un tiret + une lettre (ex. -l)." },
    { type: "input", q: "Sous CMD, par quel caractère commence une option comme dans <code>dir /a</code> ?", a: ["/", "barre oblique", "slash"], ph: "un caractère", exp: "Sous CMD, les options commencent par / (ex. /a, /s)." },
    { type: "vf", q: "Sous Bash, on peut regrouper plusieurs options courtes, par exemple <code>-la</code> pour -l et -a.", a: true, exp: "Oui : ls -la combine -l et -a en une seule écriture." },
    { type: "qcm", q: "Une option PowerShell ressemble typiquement à…", opts: ["/Force", "-Force (tiret + mot complet)", "--force--", "Force:"], a: 1, exp: "PowerShell : un tiret suivi d'un mot, ex. -Force, -Recurse." },
    { type: "input", q: "Comment protéger le nom <code>mon fichier.txt</code> (avec une espace) pour qu'il compte comme UN seul argument ? Écris-le tel qu'on l'entoure.", a: ["\"mon fichier.txt\"", "'mon fichier.txt'"], ph: "…mon fichier.txt…", exp: "On l'entoure de guillemets : \"mon fichier.txt\"." },
    { type: "vf", q: "<code>cat mon fichier.txt</code> sans guillemets est lu comme deux arguments.", a: true, exp: "Oui : le shell coupe à l'espace et cherche deux fichiers, mon et fichier.txt." },
    { type: "qcm", q: "L'ordre général quasi universel d'une commande est…", opts: ["arguments, options, commande", "commande, options, arguments", "options, commande, arguments", "peu importe, tout est mélangé"], a: 1, exp: "commande [options] [arguments]." },
    { type: "qcm", q: "Une option longue sous Bash s'écrit généralement…", opts: ["Avec un seul tiret et une lettre", "Avec deux tirets et un mot (ex. --all)", "Avec une barre oblique", "Sans aucun symbole"], a: 1, exp: "Option longue Bash : deux tirets + un mot, ex. --all." },
    { type: "input", q: "Dans <code>cat notes.txt resume.txt</code>, combien d'arguments la commande reçoit-elle ?", a: ["2", "deux"], ph: "un nombre", exp: "Deux arguments : notes.txt et resume.txt." },
    { type: "vf", q: "Le nom de la commande peut être placé n'importe où dans la ligne, même à la fin.", a: false, exp: "Non : le nom de la commande est le premier mot de la ligne." },
    { type: "qcm", q: "Que fait le shell si le premier mot n'est pas une commande connue ?", opts: ["Il devine ce que tu voulais dire", "Il répond « commande introuvable » (ou équivalent)", "Il redémarre", "Il exécute quand même au hasard"], a: 1, exp: "Un nom inconnu déclenche une erreur « commande introuvable »." }
  ],
  final: {
    title: "Exercice final — Disséquer une commande",
    intro: `<p>On te présente la commande Bash <code>ls -la "Mes Documents"</code>. Analyse chacune de ses parties.</p>`,
    questions: [
      { type: "input", q: "Quel est le NOM de la commande ?", a: ["ls"], ph: "un mot", exp: "ls : le verbe d'action (lister)." },
      { type: "qcm", q: "Que représente <code>-la</code> ?", opts: ["Un argument", "Deux options courtes regroupées (-l et -a)", "Un nom de fichier", "Une erreur"], a: 1, exp: "-la combine les options -l (détaillé) et -a (tout, y compris les cachés)." },
      { type: "input", q: "Quel est l'argument (la cible) de la commande ?", a: ["\"mes documents\"", "mes documents", "Mes Documents", "\"Mes Documents\""], ph: "la cible", exp: "« Mes Documents » : le dossier visé (entre guillemets à cause de l'espace)." },
      { type: "vf", q: "Les guillemets autour de « Mes Documents » sont là parce que le nom contient une espace.", a: true, exp: "Oui : sans eux, le shell lirait deux arguments." },
      { type: "qcm", q: "Sous CMD, comment écrirait-on l'équivalent avec l'option « tout afficher » ?", opts: ["dir -a \"Mes Documents\"", "dir /a \"Mes Documents\"", "Get-ChildItem -Force \"Mes Documents\"", "ls -a \"Mes Documents\""], a: 1, exp: "Sous CMD, l'option commence par / : dir /a." }
    ],
    solution: `<pre class="pseudo"># ls -la "Mes Documents"  decortique :
# ls                 → NOM de la commande (verbe : lister)
# -la                → OPTIONS regroupees (-l detaille + -a tout afficher)
# "Mes Documents"    → ARGUMENT (la cible), entre guillemets car il contient une espace

# La meme idee dans les trois shells (tout afficher, format detaille) :
ls -la "Mes Documents"                       # Bash
Get-ChildItem -Force "Mes Documents"         # PowerShell (option = -Mot)
dir /a "Mes Documents"                        # CMD (option = /lettre)</pre>
<p>Tu sais maintenant lire n'importe quelle commande comme une phrase. Demain : se déplacer dans les dossiers.</p>`
  }
};
</script>
