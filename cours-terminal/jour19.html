<script>
var DAY = {
  num: 19,
  title: "Les alias et la personnalisation du shell",
  subtitle: "Se fabriquer des raccourcis de commandes pour taper moins et aller plus vite.",
  theory: `
<h3>1. Qu'est-ce qu'un alias ?</h3>
<p>Un <strong>alias</strong> est un <strong>surnom</strong> que tu donnes à une commande (souvent longue) pour la déclencher avec un mot court. Au lieu de retaper <code>git status</code> vingt fois par jour, tu crées l'alias <code>gs</code>. C'est de la pure productivité : moins de frappe, moins d'erreurs, moins de fatigue.</p>
<div class="tip">Pense à l'alias comme à un <strong>raccourci clavier textuel</strong>. Il ne crée pas de nouvelle fonctionnalité : il rebaptise une commande existante.</div>

<h3>2. Créer un alias (session en cours)</h3>
<pre class="pseudo"># --- Bash (Linux / macOS) ---
alias gs='git status'        # gs devient un surnom de "git status"
alias ll='ls -la'            # ll = liste detaillee, fichiers caches inclus
alias ..='cd ..'            # .. remonte d'un dossier
gs                           # execute git status</pre>
<pre class="pseudo"># --- PowerShell (Windows) ---
Set-Alias gs git             # gs devient un surnom de git (commande simple)
New-Alias ll Get-ChildItem   # ll = Get-ChildItem
# Pour un alias AVEC arguments, PowerShell utilise plutot une fonction (voir plus bas)</pre>
<pre class="pseudo"># --- CMD (Windows) ---
doskey gs=git status $*      REM doskey cree une "macro" ; $* passe les arguments
doskey ll=dir /a             REM ll = dir en montrant tout</pre>
<div class="warn">Nuance importante : l'alias PowerShell (<code>Set-Alias</code>) ne peut renommer qu'une <strong>commande</strong>, pas y ajouter des arguments fixes. Pour <code>ll = ls -la</code>, PowerShell demande une petite <strong>fonction</strong>. Sous CMD, ce sont des « macros » <code>doskey</code>, qui ne survivent pas non plus à la fermeture par défaut.</div>

<h3>3. Un alias avec arguments : la fonction (PowerShell)</h3>
<pre class="pseudo"># --- PowerShell --- fonction = alias enrichi, avec options fixes
function ll { Get-ChildItem -Force }      # -Force affiche aussi les elements caches
function gp { git pull }
ll                                        # appelle la fonction
# En Bash, l'alias suffit ; en PowerShell la fonction remplace souvent l'alias.</pre>

<h3>4. Voir et supprimer les alias</h3>
<pre class="pseudo"># --- Bash ---
alias                # liste TOUS les alias definis
alias gs             # montre a quoi correspond gs
unalias gs           # supprime l'alias gs</pre>
<pre class="pseudo"># --- PowerShell ---
Get-Alias            # liste tous les alias
Get-Alias gs         # detaille l'alias gs
Remove-Item Alias:gs # supprime l'alias gs</pre>
<pre class="pseudo"># --- CMD ---
doskey /macros       REM liste les macros doskey definies
doskey gs=           REM une definition vide supprime la macro gs</pre>

<h3>5. Rendre les alias permanents</h3>
<p>Comme les variables, un alias tapé au clavier disparaît à la fermeture du terminal. Pour le garder, on l'écrit dans le <strong>fichier de configuration</strong> du shell (le sujet de demain).</p>
<pre class="pseudo"># --- Bash --- on ajoute la ligne alias dans ~/.bashrc
echo "alias gs='git status'" &gt;&gt; ~/.bashrc   # &gt;&gt; ajoute a la fin du fichier
source ~/.bashrc                             # recharge la config sans rouvrir le terminal</pre>
<pre class="pseudo"># --- PowerShell --- on ajoute la ligne au fichier de profil
notepad $PROFILE     # $PROFILE contient le chemin du fichier de config PowerShell
# on y ecrit : Set-Alias gs git  (ou une function)</pre>
<div class="tip">Un bon alias est <strong>court, mémorisable et sans conflit</strong> avec une commande existante. Évite d'écraser des commandes courantes (ne redéfinis pas <code>ls</code> ou <code>cd</code> de façon surprenante) : le futur toi te remerciera.</div>

<h3>6. Récapitulatif</h3>
<pre class="pseudo"># Creer  : alias x='...' | Set-Alias x cmd (ou function) | doskey x=cmd $*
# Lister : alias       | Get-Alias            | doskey /macros
# Retirer: unalias x   | Remove-Item Alias:x  | doskey x=
# Garder : ~/.bashrc   | $PROFILE             | script doskey lance au demarrage</pre>`,
  exercises: [
    { type: "qcm", q: "Un alias sert à…", opts: ["Créer une nouvelle commande système", "Donner un surnom court à une commande existante", "Exécuter une commande à distance", "Supprimer une commande"], a: 1, exp: "Un alias est un raccourci vers une commande déjà existante." },
    { type: "input", q: "Bash : crée un alias <code>gs</code> pour la commande <code>git status</code>.", a: ["alias gs='git status'", "alias gs=\"git status\""], ph: "alias gs=…", exp: "alias gs='git status' définit le raccourci." },
    { type: "qcm", q: "En Bash, comment lister TOUS les alias définis ?", opts: ["ls alias", "alias", "get-alias", "aliases -all"], a: 1, exp: "La commande alias sans argument liste tous les alias." },
    { type: "input", q: "Bash : supprime l'alias <code>gs</code>.", a: "unalias gs", ph: "unalias …", exp: "unalias gs retire l'alias." },
    { type: "qcm", q: "Quel cmdlet crée un alias en PowerShell ?", opts: ["New-Item", "Set-Alias", "Add-Alias", "Make-Alias"], a: 1, exp: "Set-Alias (ou New-Alias) crée un alias." },
    { type: "vf", q: "En PowerShell, <code>Set-Alias</code> permet d'inclure des arguments fixes (ex. <code>ls -la</code>).", a: false, exp: "Faux : Set-Alias ne renomme qu'une commande. Pour des arguments fixes, on écrit une fonction." },
    { type: "input", q: "PowerShell : écris une fonction nommée <code>ll</code> qui appelle <code>Get-ChildItem</code>.", a: ["function ll { Get-ChildItem }", "function ll {Get-ChildItem}", "function ll { Get-ChildItem -Force }"], ph: "function ll { … }", exp: "En PowerShell, une fonction remplace l'alias quand il faut des options." },
    { type: "qcm", q: "Sous CMD, quel outil crée des « macros » (alias) ?", opts: ["alias", "macro", "doskey", "setlocal"], a: 2, exp: "doskey crée des macros de commandes sous CMD." },
    { type: "qcm", q: "Dans une macro doskey, <code>$*</code> sert à…", opts: ["Ignorer les arguments tapés", "Passer tous les arguments à la commande", "Répéter la commande", "Compter les arguments"], a: 1, exp: "$* transmet les arguments tapés à la commande de la macro." },
    { type: "input", q: "PowerShell : liste tous les alias définis (un seul cmdlet).", a: "Get-Alias", ph: "Get-…", exp: "Get-Alias liste tous les alias." },
    { type: "vf", q: "Un alias tapé directement dans le terminal reste actif après fermeture de celui-ci.", a: false, exp: "Faux : il est temporaire. Il faut l'écrire dans le fichier de configuration pour le conserver." },
    { type: "qcm", q: "Pour rendre un alias Bash permanent, on l'écrit dans…", opts: ["/etc/hosts", "~/.bashrc (fichier de config du shell)", "le PATH", "~/.ssh/config"], a: 1, exp: "~/.bashrc est lu à chaque ouverture de shell : l'alias y devient permanent." },
    { type: "input", q: "Bash : après avoir modifié ~/.bashrc, quelle commande recharge la configuration sans rouvrir le terminal ?", a: ["source ~/.bashrc", ". ~/.bashrc"], ph: "source …", exp: "source ~/.bashrc relit le fichier dans le shell courant." },
    { type: "qcm", q: "En PowerShell, la variable <code>$PROFILE</code> contient…", opts: ["La liste des variables d'environnement", "Le chemin du fichier de configuration de PowerShell", "La liste des alias", "Le dossier de travail courant"], a: 1, exp: "$PROFILE indique le fichier de profil où placer alias et réglages permanents." },
    { type: "qcm", q: "Quel est un bon principe pour nommer un alias ?", opts: ["Le plus long possible", "Court, mémorisable, sans écraser une commande courante", "Toujours en majuscules", "Identique à une commande existante"], a: 1, exp: "Un alias utile est court et n'entre pas en conflit avec l'existant." }
  ],
  final: {
    title: "Exercice final — Se fabriquer une trousse de raccourcis",
    intro: `<p>Tu veux trois raccourcis pour le quotidien : <code>ll</code> (liste détaillée), <code>gs</code> (git status), et <code>..</code> (remonter d'un dossier). On les construit sous chaque shell, puis on les rend permanents.</p>`,
    questions: [
      { type: "input", q: "Bash : crée l'alias <code>ll</code> pour <code>ls -la</code>.", a: ["alias ll='ls -la'", "alias ll=\"ls -la\""], ph: "alias ll=…", exp: "alias ll='ls -la' : liste détaillée avec fichiers cachés." },
      { type: "qcm", q: "En PowerShell, pour un <code>ll</code> équivalent à <code>ls -la</code>, mieux vaut…", opts: ["Set-Alias ll (impossible avec option)", "Écrire une fonction : function ll { Get-ChildItem -Force }", "Utiliser doskey", "Renommer directement la commande ls"], a: 1, exp: "Il faut une fonction car l'alias ne porte pas d'arguments." },
      { type: "input", q: "Bash : crée l'alias <code>gs</code> pour <code>git status</code>.", a: ["alias gs='git status'", "alias gs=\"git status\""], ph: "alias gs=…", exp: "alias gs='git status'." },
      { type: "qcm", q: "Pour que ces alias reviennent à chaque ouverture de terminal Bash, on les place dans…", opts: ["~/.bashrc", "/tmp", "le PATH", "~/.gitconfig"], a: 0, exp: "~/.bashrc est exécuté à chaque nouveau shell." },
      { type: "input", q: "Bash : recharge ~/.bashrc pour activer tout de suite les nouveaux alias.", a: ["source ~/.bashrc", ". ~/.bashrc"], ph: "source …", exp: "source ~/.bashrc applique les changements immédiatement." }
    ],
    solution: `<pre class="pseudo"># --- Bash --- dans le terminal, puis on copie ces lignes dans ~/.bashrc
alias ll='ls -la'
alias gs='git status'
alias ..='cd ..'
source ~/.bashrc            # active tout de suite

# --- PowerShell --- a placer dans le fichier $PROFILE
function ll { Get-ChildItem -Force }
Set-Alias gs git            # gs = git (on tape gs status)
function .. { Set-Location .. }

# --- CMD --- macros doskey
doskey ll=dir /a
doskey gs=git status $*</pre>
<p>Tu as ta première trousse de raccourcis. Demain, on ouvre en grand le fichier de configuration du shell : le lieu où toutes ces personnalisations deviennent permanentes.</p>`
  }
};
</script>

    ],
    atoi: { cmd: "alias c='clear'\nalias gl='git log --oneline'\nalias h='history'\nalias c gl h", expected: "Crée les trois alias puis les affiche : c → clear, gl → git log --oneline, h → history." },
    checklist: [
      "Les trois alias Bash sont créés avec la syntaxe alias nom='commande'.",
      "gl embarque bien l'argument --oneline dans sa définition.",
