<script>
var DAY = {
  num: 16,
  title: "Les jokers et le globbing (*, ?, [])",
  subtitle: "Désigner plusieurs fichiers d'un coup grâce à des motifs.",
  theory: `
<h3>1. Le principe : un motif au lieu d'une liste</h3>
<p>Plutôt que de nommer chaque fichier un par un, on décrit un <strong>motif</strong> que plusieurs noms respectent. Ces caractères spéciaux s'appellent des <strong>jokers</strong> (en anglais <em>wildcards</em>), et le mécanisme qui les développe en une liste de noms réels s'appelle le <strong>globbing</strong>. C'est comme dire « tous les livres dont le titre commence par Harry » au lieu de les citer un par un.</p>
<div class="tip">Point crucial sous Bash : c'est le SHELL qui remplace le motif par la liste des fichiers correspondants AVANT d'exécuter la commande. La commande, elle, ne voit jamais l'étoile : elle reçoit déjà la liste développée.</div>
<h3>2. L'étoile * : « n'importe quoi, même rien »</h3>
<p>Le joker <strong>*</strong> remplace <strong>n'importe quelle suite de caractères</strong> (y compris aucune). C'est le plus utilisé.</p>
<pre class="pseudo"># Bash (Linux/macOS)
ls *.txt             # tous les fichiers se terminant par .txt
ls photo*            # tous les noms commencant par « photo »
rm *.tmp             # supprime tous les fichiers .tmp (attention !)
# PowerShell (Windows)
Get-ChildItem *.txt  # meme motif : * developpe les .txt
# CMD (Windows)
dir *.txt            # meme idee sous CMD</pre>
<div class="warn">DANGER : <code>rm *.tmp</code> supprime TOUS les fichiers .tmp d'un coup, sans confirmation. Pire, <code>rm *</code> supprimerait tout le dossier. Avant une suppression avec joker, remplace mentalement <code>rm</code> par <code>ls</code> pour VOIR d'abord ce que le motif désigne.</div>
<h3>3. Le point d'interrogation ? : « exactement un caractère »</h3>
<p>Le joker <strong>?</strong> remplace <strong>un seul</strong> caractère, quel qu'il soit (ni zéro, ni deux).</p>
<pre class="pseudo"># Bash (Linux/macOS)
ls photo?.jpg        # photo1.jpg, photoA.jpg … MAIS PAS photo12.jpg (deux caracteres)
ls page?.md          # page1.md, pageX.md … un seul caractere a la place du ?
# PowerShell / CMD
Get-ChildItem photo?.jpg     # PowerShell
dir photo?.jpg               # CMD</pre>
<h3>4. Les crochets [] : « un caractère parmi un choix »</h3>
<p>Les <strong>crochets</strong> désignent <strong>un caractère pris dans un ensemble</strong> précis. On peut lister (<code>[aeiou]</code>) ou donner un intervalle (<code>[0-9]</code>, <code>[a-z]</code>).</p>
<pre class="pseudo"># Bash (Linux/macOS)
ls fichier[123].txt  # fichier1.txt, fichier2.txt, fichier3.txt (et rien d'autre)
ls page[0-9].md      # page0.md … page9.md (un chiffre)
ls [A-Z]*            # tous les noms commencant par une MAJUSCULE
# PowerShell (Windows)
Get-ChildItem page[0-9].md   # les crochets fonctionnent aussi
# CMD (Windows)
# ⚠️ CMD ne gere PAS les crochets [] comme joker : il ne connait que * et ?</pre>
<div class="warn">Grande différence : les crochets <code>[]</code> marchent sous Bash ET PowerShell, mais <strong>PAS sous CMD</strong>, qui ne comprend que <code>*</code> et <code>?</code>. C'est une limite classique de l'ancien shell de Windows.</div>
<h3>5. Combiner les jokers</h3>
<pre class="pseudo"># Bash (Linux/macOS)
ls img_*.png         # tout ce qui commence par img_ et finit par .png
ls rapport_2023-??.pdf   # rapport_2023- + deux caracteres + .pdf (les mois)
cp *.txt Sauvegarde/     # copier d'un coup tous les .txt vers Sauvegarde</pre>
<h3>6. Quand aucun fichier ne correspond</h3>
<pre class="pseudo"># Bash : si AUCUN fichier ne correspond, le motif reste tel quel (le * n'est pas remplace)
# → la commande recoit litteralement « *.xyz », d'ou parfois une erreur « fichier introuvable ».
# Reflexe de securite universel : tester le motif avec ls (ou dir) AVANT rm/del.
ls *.tmp             # VERIFIER ce que le motif attrape
rm *.tmp             # ... puis seulement supprimer</pre>
<h3>7. Récapitulatif</h3>
<pre class="pseudo"># *      n'importe quelle suite (meme vide)   → Bash, PowerShell, CMD
# ?      exactement un caractere              → Bash, PowerShell, CMD
# []     un caractere parmi un ensemble       → Bash, PowerShell (PAS CMD)
# [0-9]  un caractere dans un intervalle       → Bash, PowerShell
# Toujours : verifier avec ls/dir avant de supprimer avec un joker.</pre>`,
  exercises: [
    { type: "qcm", q: "Que remplace le joker <code>*</code> ?", opts: ["Exactement un caractère", "N'importe quelle suite de caractères, même vide", "Un chiffre uniquement", "Uniquement les fichiers cachés"], a: 1, exp: "* = n'importe quelle suite (y compris aucune)." },
    { type: "input", q: "Sous Bash, écris le motif qui désigne tous les fichiers se terminant par .txt.", a: ["*.txt"], ph: "un motif", exp: "*.txt correspond à tous les fichiers finissant par .txt." },
    { type: "qcm", q: "Que remplace le joker <code>?</code> ?", opts: ["N'importe quelle suite", "Exactement un caractère", "Zéro ou plusieurs caractères", "Un mot entier"], a: 1, exp: "? = un seul caractère, quel qu'il soit." },
    { type: "qcm", q: "Sous Bash, <code>photo?.jpg</code> correspond à…", opts: ["photo12.jpg", "photo1.jpg mais pas photo12.jpg", "tous les .jpg", "photo.jpg uniquement"], a: 1, exp: "? = un seul caractère : photo1.jpg oui, photo12.jpg non." },

    { type: "input", q: "Sous Bash, écris le motif désignant page0.md, page1.md … page9.md (un chiffre après « page »).", a: ["page[0-9].md"], ph: "page…md", exp: "page[0-9].md : un chiffre de 0 à 9." },
    { type: "vf", q: "Les crochets [] fonctionnent sous Bash et PowerShell, mais pas sous CMD.", a: true, exp: "Oui : CMD ne connaît que * et ? ; les crochets sont ignorés comme joker." },
    { type: "input", q: "Comment appelle-t-on le mécanisme qui développe un motif (*, ?, []) en une liste de fichiers réels ?", a: ["globbing", "le globbing"], ph: "un mot", exp: "C'est le globbing (développement des jokers)." },
    { type: "qcm", q: "Sous Bash, qui remplace le motif par la liste des fichiers avant l'exécution ?", opts: ["La commande elle-même", "Le SHELL, avant d'exécuter la commande", "Le système de fichiers, après l'exécution", "Personne, le * reste toujours"], a: 1, exp: "Le shell fait le globbing ; la commande reçoit déjà la liste développée." },
    { type: "qcm", q: "Sous Bash, que fait <code>rm *.tmp</code> ?", opts: ["Supprime un seul fichier", "Supprime TOUS les fichiers .tmp d'un coup, sans confirmation", "Renomme les .tmp", "Les affiche"], a: 1, exp: "Danger : rm *.tmp efface tous les .tmp sans demander." },
    { type: "input", q: "Quel réflexe de sécurité adopter avant <code>rm *.tmp</code> ? (donne la commande qui montre d'abord ce que le motif désigne)", a: ["ls *.tmp", "ls"], ph: "une commande", exp: "ls *.tmp montre d'abord ce que le motif attrape." },
    { type: "qcm", q: "Sous Bash, à quoi correspond <code>[A-Z]*</code> ?", opts: ["Tous les fichiers", "Les noms commençant par une majuscule", "Les fichiers .txt", "Un caractère unique"], a: 1, exp: "[A-Z] = une majuscule au début, * = la suite." },
    { type: "qcm", q: "Sous Bash, si AUCUN fichier ne correspond au motif, que se passe-t-il souvent ?", opts: ["Le shell supprime tout", "Le motif reste littéral (ex. *.xyz) et la commande peut renvoyer une erreur", "Le shell choisit un fichier au hasard", "La commande s'exécute sur tous les fichiers du dossier"], a: 1, exp: "Sans correspondance, Bash laisse le motif tel quel, d'où une erreur possible." },
    { type: "input", q: "Sous Bash, écris le motif pour tous les fichiers commençant par « img_ » et finissant par « .png ».", a: ["img_*.png"], ph: "un motif", exp: "img_*.png : préfixe img_, n'importe quoi, puis .png." },
    { type: "vf", q: "<code>*</code> et <code>?</code> fonctionnent dans les trois shells (Bash, PowerShell, CMD).", a: true, exp: "Oui : seuls les crochets [] manquent à CMD." }
  ],
  final: {
    title: "Exercice final — Désigner les bons fichiers",
    intro: `<p>Un dossier contient <code>note1.txt</code>, <code>note2.txt</code>, <code>note10.txt</code>, <code>photo.png</code>, <code>Rapport.pdf</code>. Écris les motifs Bash demandés (et vérifie mentalement ce qu'ils attrapent).</p>`,
    questions: [
      { type: "input", q: "Motif Bash pour tous les fichiers .txt.", a: ["*.txt"], ph: "un motif", exp: "*.txt attrape note1.txt, note2.txt, note10.txt." },
      { type: "input", q: "Motif Bash désignant note1.txt et note2.txt mais PAS note10.txt (un seul caractère après « note »).", a: ["note?.txt"], ph: "note?…", exp: "note?.txt : un seul caractère, donc pas note10.txt." },
      { type: "input", q: "Motif Bash avec crochets pour note1.txt et note2.txt seulement (le chiffre 1 ou 2).", a: ["note[12].txt"], ph: "note[…].txt", exp: "note[12].txt : le caractère est 1 ou 2." },
      { type: "qcm", q: "Avant de faire <code>rm *.txt</code>, quel geste de sécurité ?", opts: ["Supprimer directement, c'est plus rapide", "Faire d'abord ls *.txt pour voir ce qui sera supprimé", "Ajouter -f", "Renommer les fichiers avant de les supprimer"], a: 1, exp: "ls *.txt montre la cible avant la suppression irréversible." },
      { type: "qcm", q: "Sous CMD, lequel de ces motifs NE fonctionnerait PAS comme joker ?", opts: ["*.txt", "note?.txt", "note[12].txt", "photo.png"], a: 2, exp: "CMD ne gère pas les crochets [] : note[12].txt ne serait pas développé." }
    ],
    solution: `<pre class="pseudo"># Designer plusieurs fichiers avec des motifs
# Bash (Linux/macOS)
ls *.txt             # tous les .txt (note1, note2, note10)
ls note?.txt         # note1.txt, note2.txt (un seul caractere → pas note10)
ls note[12].txt      # note1.txt et note2.txt (1 ou 2)
ls note[0-9].txt     # un chiffre : note1.txt, note2.txt (pas note10.txt)
# PowerShell (Windows)
Get-ChildItem *.txt          # * et ? et [] fonctionnent
Get-ChildItem note[12].txt
# CMD (Windows)
dir *.txt            # * et ? OK
dir note?.txt        # ⚠️ mais PAS les crochets [] sous CMD
# Reflexe : ls/dir le motif AVANT de supprimer.</pre>
<p>Bravo : tu sais désigner des fichiers par lots avec des motifs. Tu as bouclé les 16 premiers jours et tu tiens désormais le terminal en main, quel que soit ton système.</p>`
  }
};
