<script>
var DAY = {

  title: "Projet final : automatiser une tâche du quotidien",
  subtitle: "Assembler tout le cours en un vrai script : sauvegarde datée et journalisée.",
  theory: `
<h3>1. L'énoncé du projet</h3>
<p>Voici la mission : écrire un script qui <strong>sauvegarde automatiquement un dossier</strong> dans une <strong>archive compressée datée</strong>, puis <strong>journalise</strong> le résultat (succès ou échec) dans un fichier de log. Enfin, on le <strong>planifie</strong> pour qu'il tourne chaque nuit tout seul. Ce projet réunit presque tout le cours : variables, dates, archivage, redirections, conditions, planification.</p>
<div class="tip">On le fait DEUX fois : en <strong>Bash</strong> (Linux/macOS) et en <strong>PowerShell</strong> (Windows). Même logique, deux dialectes. À la fin, tu auras un outil réellement utile.</div>

<h3>2. Réfléchir avant de coder : le plan</h3>
<pre class="pseudo"># Pseudo-code (independant du shell)
# 1. definir le dossier SOURCE a sauvegarder
# 2. definir le dossier DESTINATION des archives
# 3. calculer la DATE du jour (pour un nom unique)
# 4. creer le dossier destination s'il n'existe pas
# 5. fabriquer l'archive compressee  source -> destination/nom-DATE
# 6. selon le succes, ecrire une ligne dans le fichier JOURNAL (log)</pre>
<div class="tip">Toujours poser le plan en français avant d'écrire une seule commande. Un script clair est un script pensé d'abord, tapé ensuite.</div>

<h3>3. La version Bash, commentée</h3>
<pre class="pseudo">#!/bin/bash
# sauvegarde.sh - archive datee de Documents + journalisation

set -e                                   # stoppe le script a la 1ere erreur grave
SOURCE="$HOME/Documents"                 # 1. dossier a sauvegarder
DEST="$HOME/sauvegardes"                 # 2. ou ranger les archives
DATE=$(date +%Y-%m-%d)                   # 3. ex : 2026-07-26 (substitution de commande)
LOG="$DEST/sauvegarde.log"               #    fichier journal
mkdir -p "$DEST"                         # 4. cree DEST (et parents) sans erreur s'il existe

ARCHIVE="$DEST/documents-$DATE.tar.gz"   # 5. nom d'archive horodate et unique

if tar -czf "$ARCHIVE" "$SOURCE"; then   # 6. si l'archivage REUSSIT...
  echo "$(date) OK   $ARCHIVE" &gt;&gt; "$LOG"   #    trace le succes dans le journal
else
  echo "$(date) ECHEC sauvegarde" &gt;&gt; "$LOG" #  sinon trace l'echec
fi</pre>
<div class="warn">Points-clés : les variables sont <strong>entre guillemets</strong> (<code>"$SOURCE"</code>) pour supporter les espaces dans les chemins ; le <code>&gt;&gt;</code> <strong>ajoute</strong> au journal sans l'écraser ; le <code>if tar ...; then</code> teste directement le succès de la commande d'archivage.</div>

<h3>4. La version PowerShell, commentée</h3>
<pre class="pseudo"># sauvegarde.ps1 - archive datee de Documents + journalisation

$Source = "$HOME\Documents"                    # 1. dossier a sauvegarder
$Dest   = "$HOME\sauvegardes"                  # 2. dossier des archives
$Date   = Get-Date -Format "yyyy-MM-dd"        # 3. ex : 2026-07-26
$Log    = "$Dest\sauvegarde.log"               #    fichier journal
if (-not (Test-Path $Dest)) {                  # 4. cree DEST s'il manque
  New-Item -ItemType Directory $Dest | Out-Null
}
$Archive = "$Dest\documents-$Date.zip"         # 5. nom d'archive horodate

try {                                          # 6. tente l'archivage
  Compress-Archive -Path "$Source\*" -DestinationPath $Archive -Force
  Add-Content $Log "$(Get-Date) OK   $Archive" #    succes -&gt; journal
} catch {
  Add-Content $Log "$(Get-Date) ECHEC sauvegarde"  # echec -&gt; journal
}</pre>
<div class="tip">Correspondances : <code>date +%Y-%m-%d</code> devient <code>Get-Date -Format "yyyy-MM-dd"</code> ; <code>tar -czf</code> devient <code>Compress-Archive</code> ; le <code>if tar; then/else</code> devient un bloc <code>try/catch</code> ; <code>&gt;&gt; log</code> devient <code>Add-Content</code>. Même scénario, autre grammaire.</div>

<h3>5. Tester puis automatiser</h3>
<pre class="pseudo"># --- D'abord tester A LA MAIN ---
chmod +x sauvegarde.sh &amp;&amp; ./sauvegarde.sh   # Bash : rendre executable puis lancer
cat "$HOME/sauvegardes/sauvegarde.log"        # verifier la ligne du journal

# --- Puis planifier (jour 28) ---
# Unix - crontab -e :  chaque jour a 2h30
30 2 * * * /home/moi/sauvegarde.sh &gt;&gt; /home/moi/sauvegardes/cron.log 2&gt;&amp;1
# Windows - schtasks :
schtasks /Create /SC DAILY /ST 02:30 /TN "Sauvegarde" /TR "C:\scripts\sauvegarde.ps1"</pre>
<div class="warn">On teste TOUJOURS le script à la main avant de le planifier : une tâche automatique qui échoue en silence est un faux filet de sécurité. On vérifie le journal, on s'assure que l'archive existe, PUIS on planifie.</div>

<h3>6. Aller plus loin : la rotation</h3>
<pre class="pseudo"># --- Bash : supprimer les sauvegardes de plus de 30 jours (jour 23) ---
find "$DEST" -name "documents-*.tar.gz" -mtime +30 -delete
# on VERIFIE d'abord sans -delete, puis on l'ajoute (regle de securite)</pre>
<div class="tip">Une vraie sauvegarde ne s'accumule pas à l'infini : on garde une fenêtre (ex. 30 jours) et on supprime le reste. C'est la « rotation ». Tu viens de construire, brique par brique, un outil que des professionnels utilisent au quotidien.</div>

<h3>7. Récapitulatif du projet</h3>
<pre class="pseudo"># 1. Plan en francais  -> 2. variables (source, dest, date)
# 3. mkdir destination -> 4. archive datee (tar -czf / Compress-Archive)

    { type: "qcm", q: "Quelle est la première étape d'un bon projet de script ?", opts: ["Compresser le dossier immédiatement", "Poser le plan (pseudo-code) en français avant de coder", "Planifier tout de suite", "Supprimer d'anciens fichiers"], a: 1, exp: "On réfléchit au plan avant d'écrire la moindre commande." },
    { type: "input", q: "Bash : stocke la date du jour (AAAA-MM-JJ) dans la variable DATE (substitution de commande).", a: ["DATE=$(date +%Y-%m-%d)", "DATE=$(date +\"%Y-%m-%d\")"], ph: "DATE=$(date +%Y-%m-%d)", exp: "DATE=$(date +%Y-%m-%d) donne un nom d'archive unique et triable." },
    { type: "qcm", q: "Pourquoi horodater le nom de l'archive (documents-2026-07-26.tar.gz) ?", opts: ["Pour accélérer l'archivage", "Pour un nom unique qui n'écrase pas la sauvegarde précédente et se trie par date", "Pour la protéger par mot de passe", "Pour occuper moins d'espace disque"], a: 1, exp: "Chaque sauvegarde datée est distincte et se classe chronologiquement." },
    { type: "input", q: "Bash : crée le dossier de destination <code>$DEST</code> sans erreur s'il existe déjà (mkdir avec l'option adaptée).", a: ["mkdir -p \"$DEST\"", "mkdir -p $DEST"], ph: "mkdir -p …", exp: "mkdir -p crée le dossier (et ses parents) sans échouer s'il existe." },
    { type: "input", q: "Bash : crée l'archive compressée <code>$ARCHIVE</code> à partir de <code>$SOURCE</code> (options c, z, f, avec guillemets).", a: ["tar -czf \"$ARCHIVE\" \"$SOURCE\"", "tar -czf $ARCHIVE $SOURCE"], ph: "tar -czf \"$ARCHIVE\" \"$SOURCE\"", exp: "tar -czf crée l'archive compressée ; les guillemets gèrent les espaces." },
    { type: "qcm", q: "Pourquoi mettre les variables entre guillemets (<code>\"$SOURCE\"</code>) ?", opts: ["Pour afficher les variables en majuscules", "Pour supporter les chemins contenant des espaces", "Pour aller plus vite", "C'est interdit"], a: 1, exp: "Sans guillemets, un chemin avec espace serait coupé en plusieurs arguments." },
    { type: "qcm", q: "Que fait l'opérateur <code>&gt;&gt;</code> vers le fichier journal ?", opts: ["Il écrase le journal", "Il AJOUTE une ligne à la fin sans effacer l'existant", "Il supprime le journal", "Il crée un nouveau journal à chaque fois"], a: 1, exp: ">> ajoute au fichier ; > l'écraserait." },
    { type: "input", q: "Bash : ajoute la ligne « OK » horodatée au fichier journal <code>$LOG</code> (echo avec la date et une redirection d'ajout).", a: ["echo \"$(date) OK\" >> \"$LOG\"", "echo \"$(date) OK\" >> $LOG"], ph: "echo \"$(date) OK\" >> \"$LOG\"", exp: "echo ... >> \"$LOG\" journalise sans écraser." },
    { type: "qcm", q: "En Bash, comment teste-t-on directement le succès de l'archivage ?", opts: ["if tar -czf ...; then ... else ... fi", "tar || tar", "while tar", "tar & echo"], a: 0, exp: "if tar ...; then exécute selon le code de retour de tar." },
    { type: "qcm", q: "Quel équivalent PowerShell du <code>if tar; then ... else</code> gère succès/échec ?", opts: ["for/next", "try/catch", "switch", "do/while"], a: 1, exp: "try/catch : le catch se déclenche si l'archivage lève une erreur." },
    { type: "input", q: "PowerShell : calcule la date du jour (AAAA-MM-JJ) dans la variable <code>$Date</code> (Get-Date avec -Format).", a: ["$Date = Get-Date -Format \"yyyy-MM-dd\"", "$Date=Get-Date -Format \"yyyy-MM-dd\"", "$Date = Get-Date -Format 'yyyy-MM-dd'"], ph: "$Date = Get-Date -Format \"yyyy-MM-dd\"", exp: "Get-Date -Format \"yyyy-MM-dd\" produit 2026-07-26." },
    { type: "qcm", q: "Quel cmdlet PowerShell crée l'archive .zip ?", opts: ["New-Zip", "Compress-Archive", "tar", "Make-Backup"], a: 1, exp: "Compress-Archive crée le .zip (équivalent de tar -czf)." },
    { type: "vf", q: "Il faut planifier le script AVANT de l'avoir testé à la main.", a: false, exp: "Faux : on teste d'abord manuellement, on vérifie le journal et l'archive, PUIS on planifie." },
    { type: "input", q: "Bash : supprime les archives <code>documents-*.tar.gz</code> de <code>$DEST</code> vieilles de plus de 30 jours (find avec -mtime et -delete).", a: ["find \"$DEST\" -name \"documents-*.tar.gz\" -mtime +30 -delete", "find $DEST -name \"documents-*.tar.gz\" -mtime +30 -delete"], ph: "find \"$DEST\" -name \"documents-*.tar.gz\" -mtime +30 -delete", exp: "-mtime +30 -delete effectue la rotation (après vérification sans -delete)." }
  ],
  final: {
    title: "Exercice final — Construire le script pas à pas",
    intro: `<p>On assemble le script de sauvegarde Bash, ligne après ligne. Réponds dans l'ordre du plan : variables, dossier, archive, journal.</p>`,

      { type: "input", q: "Bash : calcule la date du jour (AAAA-MM-JJ) dans DATE.", a: ["DATE=$(date +%Y-%m-%d)", "DATE=$(date +\"%Y-%m-%d\")"], ph: "DATE=$(date +%Y-%m-%d)", exp: "Substitution de commande pour un nom d'archive daté." },
      { type: "input", q: "Bash : crée le dossier de destination $DEST sans erreur s'il existe.", a: ["mkdir -p \"$DEST\"", "mkdir -p $DEST"], ph: "mkdir -p …", exp: "mkdir -p est idempotent : pas d'erreur si le dossier existe déjà." },
      { type: "input", q: "Bash : crée l'archive compressée $ARCHIVE à partir de $SOURCE.", a: ["tar -czf \"$ARCHIVE\" \"$SOURCE\"", "tar -czf $ARCHIVE $SOURCE"], ph: "tar -czf \"$ARCHIVE\" \"$SOURCE\"", exp: "tar -czf produit l'archive .tar.gz compressée." },
      { type: "input", q: "Bash : ajoute une ligne « OK » horodatée au journal $LOG.", a: ["echo \"$(date) OK\" >> \"$LOG\"", "echo \"$(date) OK\" >> $LOG"], ph: "echo \"$(date) OK\" >> \"$LOG\"", exp: ">> ajoute au journal la trace du succès, avec l'heure." }
    ],
    solution: `<pre class="pseudo">#!/bin/bash
# sauvegarde.sh - projet final
set -e
SOURCE="$HOME/Documents"
DEST="$HOME/sauvegardes"
DATE=$(date +%Y-%m-%d)
LOG="$DEST/sauvegarde.log"
mkdir -p "$DEST"
ARCHIVE="$DEST/documents-$DATE.tar.gz"

if tar -czf "$ARCHIVE" "$SOURCE"; then
  echo "$(date) OK   $ARCHIVE" >> "$LOG"
else
  echo "$(date) ECHEC sauvegarde" >> "$LOG"
fi

# tester :  chmod +x sauvegarde.sh && ./sauvegarde.sh
# planifier (crontab -e) :
#   30 2 * * * /home/moi/sauvegarde.sh >> /home/moi/sauvegardes/cron.log 2>&1</pre>
<p><strong>Félicitations !</strong> Tu as terminé les 31 jours. Tu navigues, manipules, filtres, scriptes et automatises — sous Bash, PowerShell et CMD. Le terminal n'est plus une boîte noire : c'est ton outil le plus puissant.</p>`
  }
};
