<title>Jour 10</title><link rel="stylesheet" href="style.css"></head><body>
<script>
var DAY = {
  num: 10,
  title: "Obtenir de l'aide (man, --help, Get-Help)",
  subtitle: "Apprendre à se débrouiller seul : le manuel est toujours à portée de main.",
  theory: `
<h3>1. Personne ne retient tout — et c'est normal</h3>
<p>Aucun expert ne connaît par coeur toutes les options de toutes les commandes. La vraie compétence, c'est de savoir <strong>trouver l'aide</strong> par soi-même. Chaque shell fournit un manuel intégré : apprends à l'ouvrir et tu deviens autonome.</p>
<h3>2. Le manuel complet</h3>
<p>Sous Bash, le grand classique est <strong>man</strong> (« manual », manuel) : il ouvre une page détaillée décrivant la commande, ses options et des exemples. Sous PowerShell, l'équivalent est <strong>Get-Help</strong>. CMD, lui, propose une aide plus sommaire.</p>
<pre class="pseudo"># Bash (Linux/macOS)
man ls               # ouvre le manuel complet de ls (q pour QUITTER)
# PowerShell (Windows)
Get-Help Get-ChildItem           # aide de la commande
Get-Help Get-ChildItem -Examples # affiche uniquement des exemples
# CMD (Windows)
help                 # liste des commandes integrees
help dir             # aide de la commande dir</pre>
<div class="warn">Le manuel <code>man</code> s'affiche dans un pageur (comme <code>less</code>) : on se déplace avec les flèches et on QUITTE avec la touche <strong>q</strong>. Beaucoup de débutants restent « coincés » faute de connaître cette touche.</div>
<h3>3. L'aide rapide : --help</h3>
<p>Souvent plus court que le manuel, l'option <strong>--help</strong> affiche un résumé directement dans le terminal. C'est le réflexe le plus rapide sous Bash. Sous CMD, l'équivalent est <strong>/?</strong> ; sous PowerShell, on peut aussi ajouter <strong>-?</strong>.</p>
<pre class="pseudo"># Bash (Linux/macOS)
ls --help            # resume des options de ls, directement a l'ecran
# PowerShell (Windows)
Get-ChildItem -?     # aide condensee de la commande
# CMD (Windows)
dir /?               # affiche l'aide de dir</pre>
<div class="tip">Récapitulatif des trois réflexes : Bash <code>commande --help</code>, PowerShell <code>Get-Help commande</code> (ou <code>-?</code>), CMD <code>commande /?</code>. Essaie toujours l'aide AVANT de chercher sur internet : elle est exacte, hors ligne, et adaptée à ta version.</div>
<h3>4. Chercher SANS connaître le nom de la commande</h3>
<p>Parfois tu ne connais même pas le nom de l'outil. Des commandes de recherche existent.</p>
<pre class="pseudo"># Bash (Linux/macOS)
apropos copie        # cherche « copie » dans les descriptions des manuels
man -k reseau        # -k (keyword) : idem, par mot-cle
# PowerShell (Windows)
Get-Help *file*      # cherche les rubriques d'aide contenant « file »
Get-Command *item*   # liste les commandes dont le nom contient « item »</pre>
<h3>5. Savoir OÙ est une commande, et ce qu'elle est</h3>
<pre class="pseudo"># Bash (Linux/macOS)
which ls             # affiche le chemin du programme execute pour « ls »
type cd              # indique si c'est un programme, un alias, un mot-cle du shell
# PowerShell (Windows)
Get-Command ls       # decrit « ls » (ici : alias de Get-ChildItem)
# CMD (Windows)
where dir            # localise une commande/un programme</pre>
<div class="tip">Sous PowerShell, <code>Get-Command ls</code> révèle que <code>ls</code> est un alias : très utile pour comprendre ce qui se cache derrière un raccourci. Ne confonds pas le <code>type</code> de Bash (« quelle sorte de commande ? ») avec le <code>type</code> de CMD (« afficher un fichier », vu au jour 9).</div>
<h3>6. Les trois réflexes à mémoriser</h3>
<pre class="pseudo"># Aide detaillee :  Bash man CMD | PS Get-Help CMD | CMD help CMD
# Aide rapide     : Bash CMD --help | PS CMD -? | CMD CMD /?
# Sortir du pageur (man/less) : la touche  q
# Trouver une commande : Bash apropos/man -k | PS Get-Command *mot*</pre>`,
  exercises: [
    { type: "input", q: "Quelle commande Bash ouvre le manuel complet de la commande ls ?", a: ["man ls"], ph: "une commande", exp: "man ls ouvre la page de manuel de ls." },
    { type: "qcm", q: "Le manuel man s'affiche dans un pageur. Quelle touche le QUITTE ?", opts: ["Échap", "q", "Entrée", "Ctrl+Z"], a: 1, exp: "q ferme man (comme less)." },
    { type: "input", q: "Sous Bash, quelle option ajoutée à une commande affiche un résumé rapide de son aide ?", a: ["--help", "help"], ph: "--…", exp: "commande --help affiche un résumé directement à l'écran." },
    { type: "qcm", q: "Sous CMD, comment obtenir l'aide de la commande dir ?", opts: ["man dir", "dir --help", "dir /?", "Get-Help dir"], a: 2, exp: "Sous CMD, l'aide s'obtient avec /? (ex. dir /?)." },
    { type: "input", q: "Quelle est la commande PowerShell (Verbe-Nom) qui affiche l'aide d'une commande ?", a: ["get-help"], ph: "Verbe-Nom", exp: "Get-Help commande affiche l'aide sous PowerShell." },
    { type: "qcm", q: "Sous PowerShell, comment afficher UNIQUEMENT des exemples d'utilisation ?", opts: ["Get-Help commande -Examples", "man commande", "commande /?", "help commande"], a: 0, exp: "Get-Help commande -Examples ne montre que des exemples." },
    { type: "vf", q: "L'aide intégrée (man, --help, Get-Help) fonctionne hors ligne et correspond à ta version installée.", a: true, exp: "Oui : c'est un avantage majeur par rapport à une recherche web." },
    { type: "input", q: "Sous Bash, quelle commande cherche un mot-clé (ex. reseau) dans les descriptions des manuels ? (donne la commande commençant par « apropos »)", a: ["apropos reseau", "apropos"], ph: "apropos …", exp: "apropos mot cherche par mot-clé dans les manuels." },
    { type: "qcm", q: "Sous Bash, <code>man -k</code> équivaut à…", opts: ["man complet d'une page", "une recherche par mot-clé (comme apropos)", "quitter man", "afficher un fichier"], a: 1, exp: "man -k (keyword) cherche par mot-clé, comme apropos." },
    { type: "qcm", q: "Sous PowerShell, quelle commande liste les commandes dont le nom contient « item » ?", opts: ["Get-Help item", "Get-Command *item*", "man item", "where item"], a: 1, exp: "Get-Command *item* liste les commandes correspondantes." },
    { type: "input", q: "Sous Bash, quelle commande affiche le CHEMIN du programme exécuté pour « ls » ?", a: ["which ls", "which"], ph: "une commande", exp: "which ls indique où se trouve le programme ls." },
    { type: "qcm", q: "Sous CMD, quelle commande localise un programme (comme which sous Bash) ?", opts: ["which", "where", "locate", "find"], a: 1, exp: "where localise une commande/un programme sous CMD." },
    { type: "vf", q: "Sous PowerShell, <code>Get-Command ls</code> peut révéler que « ls » est un alias de Get-ChildItem.", a: true, exp: "Oui : Get-Command décrit ce qui se cache derrière un nom." },
    { type: "qcm", q: "Quel est le bon réflexe face à une commande inconnue ?", opts: ["Abandonner", "Consulter l'aide intégrée (--help, man, Get-Help) avant de chercher ailleurs", "Deviner au hasard", "Redémarrer l'ordinateur"], a: 1, exp: "L'aide intégrée est exacte, rapide et hors ligne." },
    { type: "qcm", q: "Sous CMD, que fait <code>help</code> tapé seul ?", opts: ["Ferme le terminal", "Affiche la liste des commandes intégrées", "Ouvre man", "Supprime un fichier"], a: 1, exp: "help seul liste les commandes intégrées de CMD." }
  ],
  final: {
    title: "Exercice final — Se débrouiller seul",
    intro: `<p>Tu tombes sur une commande dont tu ignores les options. Montre comment obtenir de l'aide dans chaque shell, puis comment en sortir.</p>`,
    questions: [
      { type: "input", q: "Bash : ouvre le manuel complet de la commande cp.", a: ["man cp"], ph: "une commande", exp: "man cp ouvre le manuel de cp." },
      { type: "input", q: "Bash : obtiens le résumé rapide des options de cp.", a: ["cp --help", "--help"], ph: "cp …", exp: "cp --help affiche un résumé à l'écran." },
      { type: "input", q: "Après avoir ouvert man, quelle touche permet d'en sortir ?", a: ["q"], ph: "une touche", exp: "q quitte man." },
      { type: "qcm", q: "PowerShell : comment obtenir l'aide de Copy-Item avec des exemples ?", opts: ["man Copy-Item", "Get-Help Copy-Item -Examples", "Copy-Item /?", "help Copy-Item"], a: 1, exp: "Get-Help Copy-Item -Examples." },
      { type: "qcm", q: "CMD : comment obtenir l'aide de la commande copy ?", opts: ["man copy", "copy --help", "copy /?", "Get-Help copy"], a: 2, exp: "copy /? affiche l'aide sous CMD." }
    ],
    solution: `<pre class="pseudo"># Obtenir de l'aide — les trois shells
# Bash (Linux/macOS)
man cp               # manuel complet (q pour sortir)
cp --help            # resume rapide a l'ecran
apropos copie        # chercher une commande par mot-cle
# PowerShell (Windows)
Get-Help Copy-Item             # aide de la commande
Get-Help Copy-Item -Examples   # uniquement des exemples
Get-Command *copy*             # trouver les commandes liees
# CMD (Windows)
help                 # liste des commandes integrees
copy /?              # aide de la commande copy
# Reflexe : l'aide integree AVANT internet. Sortir du pageur : q.</pre>
<p>Tu es désormais autonome pour explorer n'importe quelle commande. Demain : gagner en vitesse avec l'autocomplétion et l'historique.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris tes commandes ici, une par ligne…",
  items: [
  { id: "term-j10", title: "Trois façons de demander de l'aide", level: 1,
    statement: "Tu veux connaître les options de la commande de listing. Écris comment obtenir son aide en <strong>Bash</strong> (aide rapide), en <strong>PowerShell</strong> et en <strong>CMD</strong>. Précise en commentaire quelle touche permet de sortir du manuel man.",
    hints: [
      "Bash : ajoute --help après la commande (ls).",
      "PowerShell : Get-Help suivi du nom de la commande.",
      "CMD : ajoute /? après la commande (dir)."
    ],
    solution: "# Bash (Linux/macOS)\nls --help                  # resume rapide des options\n# (man ls pour le manuel complet ; on en sort avec la touche q)\n# PowerShell (Windows)\nGet-Help Get-ChildItem     # aide de la commande\n# CMD (Windows)\ndir /?                     # aide de dir",

  ]
};
</script>
