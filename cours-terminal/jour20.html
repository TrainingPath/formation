  title: "Le fichier de configuration du shell",
  subtitle: "L'endroit unique où l'on grave ses réglages pour de bon.",
  theory: `
<h3>1. Pourquoi un fichier de configuration ?</h3>
<p>On a vu que variables (jour 18) et alias (jour 19) disparaissent à la fermeture du terminal. Le <strong>fichier de configuration</strong> résout cela : c'est un script que le shell <strong>lit automatiquement à chaque démarrage</strong>. Tout ce qu'on y écrit (alias, PATH, variables, réglages d'affichage) est donc rejoué à chaque nouvelle session : les personnalisations deviennent <strong>permanentes</strong>.</p>
<div class="tip">Idée clé : le shell « source » (exécute) ce fichier au lancement, comme si tu tapais toi-même chaque ligne. Un seul fichier à maintenir, et ton terminal est configuré partout pareil.</div>

<h3>2. Quel fichier selon le shell ?</h3>
<pre class="pseudo"># --- Bash (Linux / macOS) ---
~/.bashrc        # lu pour les shells interactifs (le plus courant)
~/.bash_profile  # lu a la connexion (login shells)
~/.profile       # commun a plusieurs shells</pre>
<pre class="pseudo"># --- Zsh (macOS moderne) ---
~/.zshrc         # equivalent du .bashrc pour le shell Zsh</pre>
<pre class="pseudo"># --- PowerShell (Windows) ---
$PROFILE         # variable contenant le CHEMIN du fichier de profil
# ex : Documents\PowerShell\Microsoft.PowerShell_profile.ps1</pre>
<pre class="pseudo"># --- CMD (Windows) ---
REM CMD n'a pas de vrai fichier de config utilisateur standard.
REM On charge des macros doskey via un script lance au demarrage (AutoRun).</pre>
<div class="warn">Le nom du fichier dépend du shell. Sur macOS récent, le shell par défaut est <strong>Zsh</strong> (fichier <code>~/.zshrc</code>), pas Bash. Vérifie ton shell avec <code>echo $SHELL</code> avant d'éditer le mauvais fichier.</div>

<h3>3. Ouvrir et éditer le fichier</h3>
<pre class="pseudo"># --- Bash ---
nano ~/.bashrc       # ouvre le fichier dans l'editeur nano
# on y ajoute par exemple :
#   alias ll='ls -la'
#   export EDITOR=nano
#   export PATH="$HOME/bin:$PATH"</pre>
<pre class="pseudo"># --- PowerShell ---
notepad $PROFILE     # ouvre le profil dans le Bloc-notes
# s'il n'existe pas encore, on le cree d'abord :
if (-not (Test-Path $PROFILE)) { New-Item -ItemType File -Path $PROFILE -Force }</pre>
<div class="tip">Le fichier commence souvent par un point (<code>.bashrc</code>) : c'est un fichier <strong>caché</strong>. Sous Linux, <code>ls -a</code> le révèle. Ce point n'a rien de magique, c'est juste la convention Unix des fichiers de configuration cachés.</div>

<h3>4. Recharger sans rouvrir le terminal</h3>
<p>Après modification, la config n'est pas encore active dans la session ouverte. On la <strong>recharge</strong> :</p>
<pre class="pseudo"># --- Bash ---
source ~/.bashrc     # relit le fichier dans le shell courant
. ~/.bashrc          # equivalent plus court (le point = source)</pre>
<pre class="pseudo"># --- PowerShell ---
. $PROFILE           # le point suivi d'un espace recharge le profil</pre>
<div class="warn">Le point suivi d'un espace (<code>. fichier</code>) veut dire « exécute ce script DANS le shell actuel » — à ne pas confondre avec le point tout collé (<code>./script</code>) qui lance un programme du dossier courant. Nuance discrète mais importante.</div>

<h3>5. Que met-on typiquement dedans ?</h3>
<pre class="pseudo"># --- Exemple de ~/.bashrc ---
export EDITOR=nano                    # editeur par defaut
export PATH="$HOME/bin:$PATH"         # ajoute ~/bin aux commandes trouvables
alias ll='ls -la'                     # raccourcis
alias gs='git status'
alias ..='cd ..'
# un prompt un peu plus lisible, l'historique plus long, etc.</pre>
<div class="tip">Bonne habitude : <strong>commente</strong> tes lignes avec <code>#</code> pour te rappeler leur rôle, et sauvegarde le fichier (une copie) avant de grosses modifications. Une erreur dans le fichier peut perturber l'ouverture du shell.</div>

<h3>6. Récapitulatif</h3>
<pre class="pseudo"># Fichier   : ~/.bashrc / ~/.zshrc  |  $PROFILE  |  (AutoRun doskey)
# Editer    : nano ~/.bashrc        |  notepad $PROFILE
# Recharger : source ~/.bashrc      |  . $PROFILE
# Contenu   : alias, variables (export), PATH, reglages d'affichage
# Toujours  : commenter, sauvegarder avant de gros changements</pre>`,
  exercises: [
    { type: "qcm", q: "Le fichier de configuration du shell sert à…", opts: ["Conserver la liste des paquets installés", "Rejouer automatiquement ses réglages à chaque ouverture de terminal", "Enregistrer l'historique complet des commandes", "Définir le terminal graphique par défaut"], a: 1, exp: "Il est lu au démarrage : les réglages deviennent permanents." },
    { type: "input", q: "Bash : quel est le nom du fichier de configuration le plus courant, dans le dossier personnel ? (chemin avec ~)", a: ["~/.bashrc", ".bashrc"], ph: "~/…", exp: "~/.bashrc est lu à chaque shell interactif." },

    { type: "input", q: "PowerShell : quelle variable contient le chemin du fichier de profil ?", a: ["$PROFILE", "$profile"], ph: "$…", exp: "$PROFILE pointe vers le fichier de configuration PowerShell." },

    { type: "qcm", q: "Quelle commande RÉVÈLE les fichiers cachés comme .bashrc en Bash ?", opts: ["ls", "ls -a", "ls -R", "cat"], a: 1, exp: "ls -a affiche aussi les fichiers cachés (commençant par un point)." },
    { type: "input", q: "Bash : après avoir modifié ~/.bashrc, recharge-le dans la session courante.", a: ["source ~/.bashrc", ". ~/.bashrc"], ph: "source …", exp: "source ~/.bashrc relit le fichier sans rouvrir le terminal." },
    { type: "vf", q: "Après modification du fichier de config, les changements sont immédiatement actifs dans les terminaux déjà ouverts.", a: false, exp: "Faux : il faut recharger (source) ou ouvrir un nouveau terminal." },
    { type: "qcm", q: "En PowerShell, comment recharger le profil dans la session courante ?", opts: [". $PROFILE", "reload $PROFILE", "Update-Profile $PROFILE", "source $PROFILE"], a: 0, exp: "Le point-espace suivi du chemin (. $PROFILE) recharge le profil." },
    { type: "input", q: "PowerShell : quel cmdlet teste si le fichier de profil existe déjà ? (avec son argument $PROFILE)", a: ["Test-Path $PROFILE", "test-path $PROFILE"], ph: "Test-Path …", exp: "Test-Path $PROFILE renvoie True si le fichier existe." },
    { type: "qcm", q: "En Bash, quelle est la différence entre <code>. fichier</code> et <code>./fichier</code> ?", opts: ["Aucune", "<code>. fichier</code> exécute dans le shell courant ; <code>./fichier</code> lance un programme du dossier courant", "Le premier cherche dans le PATH, le second dans le dossier courant", "Les deux lancent le fichier dans un nouveau shell séparé"], a: 1, exp: "Point-espace = source (exécute ici) ; point-slash = exécuter un fichier du dossier." },
    { type: "qcm", q: "Que met-on typiquement dans un fichier de configuration ?", opts: ["Les fichiers journaux du système", "Des alias, des variables (export), des ajouts au PATH", "Le code source du shell lui-même", "Des mots de passe en clair"], a: 1, exp: "Alias, variables, PATH et réglages d'affichage : les personnalisations du shell." },
    { type: "vf", q: "CMD (Invite de commandes) possède un fichier de configuration utilisateur standard équivalent à ~/.bashrc.", a: false, exp: "Faux : CMD n'a pas de vrai fichier de config ; on passe par des macros doskey chargées au démarrage." },
    { type: "input", q: "Bash : quelle commande affiche le nom du shell courant (pour savoir quel fichier éditer) ?", a: ["echo $SHELL", "echo $0"], ph: "echo …", exp: "echo $SHELL indique le shell (bash, zsh...)." },
    { type: "qcm", q: "Bonne pratique avant une grosse modification du fichier de config ?", opts: ["Le supprimer", "En faire une copie de sauvegarde et commenter ses lignes", "Le renommer avec une autre extension", "Le chiffrer"], a: 1, exp: "Une sauvegarde évite de casser l'ouverture du shell ; les commentaires aident à s'y retrouver." }
  ],
  final: {
    title: "Exercice final — Configurer son shell une bonne fois",
    intro: `<p>Tu veux qu'à chaque ouverture du terminal, l'alias <code>ll</code> existe, l'éditeur par défaut soit <code>nano</code>, et le dossier <code>~/bin</code> soit dans le PATH. On grave tout dans le fichier de config.</p>`,
    questions: [
      { type: "input", q: "Bash : quel fichier faut-il éditer pour rendre ces réglages permanents (chemin avec ~) ?", a: ["~/.bashrc", ".bashrc"], ph: "~/…", exp: "~/.bashrc est lu à chaque nouveau shell." },
      { type: "qcm", q: "Quelle ligne place l'alias ll dans le fichier ?", opts: ["ll = ls -la", "alias ll='ls -la'", "set ll=ls -la", "function ll ls -la"], a: 1, exp: "alias ll='ls -la' est la syntaxe Bash." },
      { type: "input", q: "Bash : quelle ligne définit l'éditeur par défaut sur nano (variable EDITOR, transmise aux programmes) ?", a: ["export EDITOR=nano", "export EDITOR=\"nano\""], ph: "export EDITOR=…", exp: "export EDITOR=nano rend la variable disponible aux programmes." },
      { type: "input", q: "Bash : quelle ligne ajoute ~/bin en tête du PATH sans écraser l'existant ?", a: ["export PATH=\"$HOME/bin:$PATH\"", "export PATH=$HOME/bin:$PATH"], ph: "export PATH=\"…:$PATH\"", exp: "On préfixe $HOME/bin et on conserve $PATH." },
      { type: "qcm", q: "Une fois le fichier enregistré, comment activer les réglages tout de suite ?", opts: ["Redémarrer l'ordinateur", "source ~/.bashrc (ou ouvrir un nouveau terminal)", "Rien à faire", "Renommer le fichier de configuration"], a: 1, exp: "source ~/.bashrc recharge la config immédiatement." }
    ],
    solution: `<pre class="pseudo"># --- On ajoute ces lignes a la fin de ~/.bashrc ---
alias ll='ls -la'                 # raccourci liste detaillee
export EDITOR=nano                # editeur par defaut
export PATH="$HOME/bin:$PATH"     # ~/bin devient trouvable

# --- Puis on recharge ---
source ~/.bashrc                  # active tout de suite

# --- Equivalent PowerShell, dans $PROFILE ---
function ll { Get-ChildItem -Force }
$env:PATH = "C:\Users\moi\bin;" + $env:PATH
# recharger : . $PROFILE</pre>
<p>Ton terminal est désormais configuré à ton image, de façon durable. Demain : voir et maîtriser les processus qui tournent sur la machine.</p>`
  }
};
