<script>
var DAY = {
  num: 2,
  title: "Ouvrir un terminal sur Linux, macOS et Windows",
  subtitle: "Trouver et lancer la fenêtre où l'on tape des commandes, sur chaque système.",
  theory: `
<h3>1. Le but : atteindre une invite</h3>
<p>Ouvrir un terminal, c'est simplement lancer un programme qui va afficher une <strong>invite</strong> (le prompt vu hier) et attendre tes commandes. Chaque système d'exploitation range cet outil à un endroit différent, mais le résultat est le même : une fenêtre prête à recevoir du texte.</p>
<h3>2. Sur Linux</h3>
<p>Presque toutes les distributions (Ubuntu, Debian, Fedora…) fournissent une application nommée <strong>Terminal</strong> (parfois « Console » ou « Konsole »). Le shell lancé est généralement <strong>Bash</strong>.</p>
<pre class="pseudo"># Comment l'ouvrir sous Linux :
# - Menu des applications, chercher : Terminal
# - Raccourci frequent : Ctrl + Alt + T
# Le shell obtenu est en general Bash, avec une invite du type :
utilisateur@machine:~$</pre>
<div class="tip">Le signe <code>~</code> (tilde) dans l'invite désigne ton <strong>dossier personnel</strong> (ta « maison »). On le reverra au jour 6 avec les chemins.</div>
<h3>3. Sur macOS</h3>
<p>macOS inclut une application <strong>Terminal</strong> (dans Applications ▸ Utilitaires). Le shell par défaut moderne est <strong>Zsh</strong>, très proche de Bash : les commandes de ce cours y fonctionnent presque toutes à l'identique.</p>
<pre class="pseudo"># Comment l'ouvrir sous macOS :
# - Spotlight : Cmd + Espace, taper « Terminal », Entree
# - Ou : Finder ▸ Applications ▸ Utilitaires ▸ Terminal
# Invite typique (Zsh) :
machine:~ utilisateur%</pre>
<div class="tip">Sur macOS, l'invite se termine souvent par <code>%</code> (Zsh) au lieu du <code>$</code> de Bash. C'est cosmétique : les commandes sont les mêmes.</div>
<h3>4. Sur Windows : trois options</h3>
<p>Windows propose historiquement deux shells, <strong>PowerShell</strong> (moderne, puissant) et <strong>CMD</strong> (l'« Invite de commandes » classique), et une application moderne, <strong>Windows Terminal</strong>, qui sert de fenêtre commune pour les deux.</p>
<pre class="pseudo"># Ouvrir PowerShell :
# - Menu Demarrer, taper : PowerShell, Entree
# Invite typique :
PS C:\Users\Alex&gt;

# Ouvrir l'Invite de commandes (CMD) :
# - Menu Demarrer, taper : cmd, Entree
# Invite typique :
C:\Users\Alex&gt;

# Windows Terminal (l'application moderne qui regroupe les deux) :
# - Menu Demarrer, taper : Terminal, Entree
# - Un menu deroulant permet de choisir PowerShell ou CMD</pre>
<div class="warn">Ne confonds pas la <strong>fenêtre</strong> (Windows Terminal) et le <strong>shell</strong> qu'elle héberge (PowerShell ou CMD). Une même fenêtre peut ouvrir un onglet PowerShell et un onglet CMD : le prompt te dit lequel tu utilises (<code>PS</code> devant = PowerShell).</div>
<h3>5. Reconnaître où l'on est</h3>
<p>Un réflexe essentiel : lire l'invite pour savoir quel shell répond.</p>
<pre class="pseudo"># Invite commence par « PS »           → PowerShell (Windows)
# Invite du type  C:\...&gt;             → CMD (Windows)
# Invite finissant par $  (…@…:~$)     → Bash (Linux/macOS)
# Invite finissant par %               → Zsh (macOS)</pre>
<div class="tip">En cas de doute, tape <code>echo $0</code> sous Bash/Zsh : il affiche le nom du shell. Sous PowerShell, tape <code>$PSVersionTable</code> ; sous CMD, il n'y a pas d'équivalent simple, mais l'invite <code>C:\...&gt;</code> sans « PS » suffit à le reconnaître.</div>`,
  exercises: [
    { type: "qcm", q: "Sur la plupart des distributions Linux, l'application à lancer s'appelle…", opts: ["Explorateur", "Terminal (ou Console/Konsole)", "PowerShell", "Finder"], a: 1, exp: "Sous Linux, on cherche « Terminal » dans le menu des applications." },
    { type: "input", q: "Sur beaucoup de Linux, quel raccourci clavier ouvre un terminal (Ctrl + Alt + … quelle lettre) ?", a: ["t", "ctrl+alt+t", "ctrl alt t"], ph: "une lettre ou le raccourci", exp: "Ctrl + Alt + T ouvre un terminal sur de nombreuses distributions." },
    { type: "qcm", q: "Le shell par défaut moderne de macOS est…", opts: ["CMD", "PowerShell", "Zsh", "findstr"], a: 2, exp: "macOS utilise Zsh par défaut, très proche de Bash." },
    { type: "input", q: "Sur macOS, quel raccourci ouvre Spotlight pour y taper « Terminal » (Cmd + … quelle touche) ?", a: ["espace", "space", "cmd+espace", "cmd espace"], ph: "une touche", exp: "Cmd + Espace ouvre Spotlight, où l'on tape « Terminal »." },
    { type: "qcm", q: "Sous Windows, laquelle est l'application moderne qui regroupe PowerShell et CMD ?", opts: ["Windows Terminal", "Word", "Bash", "Zsh"], a: 0, exp: "Windows Terminal héberge PowerShell et CMD dans des onglets." },
    { type: "input", q: "Dans le menu Démarrer, quel mot taper pour lancer l'Invite de commandes classique de Windows ?", a: ["cmd"], ph: "un mot", exp: "On tape « cmd » pour ouvrir l'Invite de commandes (CMD)." },
    { type: "vf", q: "Une invite qui commence par « PS » indique que le shell est PowerShell.", a: true, exp: "Oui : « PS » devant le chemin signale PowerShell." },
    { type: "qcm", q: "Une invite du type <code>C:\\Users\\Alex&gt;</code> SANS « PS » correspond plutôt à…", opts: ["Bash", "Zsh", "CMD", "Konsole"], a: 2, exp: "Le chemin Windows suivi de &gt; sans « PS » est l'invite de CMD." },
    { type: "vf", q: "Windows Terminal est un shell qui interprète les commandes.", a: false, exp: "Non : c'est une fenêtre (un terminal). Le shell qu'elle héberge est PowerShell ou CMD." },
    { type: "input", q: "Sous Windows, quel mot taper dans le menu Démarrer pour lancer le shell moderne (Power…) ?", a: ["powershell"], ph: "un mot", exp: "On tape « powershell » pour lancer PowerShell." },
    { type: "qcm", q: "Le tilde <code>~</code> visible dans une invite Bash désigne…", opts: ["La racine du disque", "Le dossier personnel de l'utilisateur", "Le bureau uniquement", "Un fichier caché"], a: 1, exp: "~ est un raccourci vers ton dossier personnel (ta « maison »)." },
    { type: "qcm", q: "Sur macOS, l'invite se termine souvent par quel symbole (Zsh) ?", opts: ["$", "%", "#", "&gt;"], a: 1, exp: "Zsh affiche fréquemment % en fin d'invite ; c'est cosmétique." },
    { type: "input", q: "Sous Bash ou Zsh, quelle commande affiche le nom du shell courant (echo suivi de quelle variable) ?", a: ["echo $0", "$0"], ph: "echo …", exp: "echo $0 affiche le nom du shell en cours." },
    { type: "vf", q: "Les commandes de ce cours en Bash fonctionnent presque toutes à l'identique sous Zsh (macOS).", a: true, exp: "Oui : Zsh est très proche de Bash pour l'usage courant." },
    { type: "qcm", q: "Quel est le point commun à « ouvrir un terminal » sur les trois systèmes ?", opts: ["On obtient une fenêtre affichant une invite prête à recevoir des commandes", "On installe un nouveau système", "On redémarre l'ordinateur", "On ouvre un navigateur web"], a: 0, exp: "But identique partout : atteindre une invite qui attend tes commandes." }
  ],
  final: {
    title: "Exercice final — Ouvrir le bon outil",
    intro: `<p>Trois personnes veulent une invite de commande. Aide chacune à ouvrir le bon programme et à reconnaître son shell.</p>`,
    questions: [
      { type: "input", q: "Karim est sous Ubuntu (Linux). Quel raccourci clavier fréquent ouvre un terminal ?", a: ["ctrl+alt+t", "ctrl alt t", "t"], ph: "un raccourci", exp: "Ctrl + Alt + T sur de nombreuses distributions Linux." },
      { type: "qcm", q: "Sur son macOS, Nadia ouvre Spotlight et tape « Terminal ». Quel shell obtient-elle par défaut ?", opts: ["CMD", "Zsh", "PowerShell", "findstr"], a: 1, exp: "macOS lance Zsh par défaut." },
      { type: "input", q: "Sous Windows, quel mot Théo tape-t-il dans le menu Démarrer pour ouvrir le shell moderne ?", a: ["powershell"], ph: "un mot", exp: "« powershell » lance PowerShell." },
      { type: "qcm", q: "Théo voit <code>PS C:\\Users\\Theo&gt;</code>. Quel shell est-ce ?", opts: ["CMD", "Bash", "PowerShell", "Zsh"], a: 2, exp: "Le préfixe « PS » identifie PowerShell." },
      { type: "vf", q: "Une invite <code>C:\\Users\\Theo&gt;</code> (sans « PS ») indiquerait plutôt CMD.", a: true, exp: "Sans « PS », c'est l'invite de CMD." }
    ],
    solution: `<pre class="pseudo"># Ouvrir un terminal, systeme par systeme :
# Linux   : menu ▸ Terminal   ou   Ctrl + Alt + T      → Bash  (…@…:~$)
# macOS   : Cmd + Espace ▸ « Terminal »                → Zsh   (…%)
# Windows : Demarrer ▸ « powershell »                 → PowerShell (PS C:\...&gt;)
#           Demarrer ▸ « cmd »                        → CMD        (C:\...&gt;)
#           Demarrer ▸ « Terminal »                   → Windows Terminal (choix du shell)
# Reflexe : LIRE l'invite pour savoir quel shell repond.</pre>
<p>Tu sais maintenant ouvrir une invite partout. Demain : comparer les trois familles de shells et comprendre leurs différences.</p>`
  }
};
</script>
