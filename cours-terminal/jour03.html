var DAY = {

  title: "Les familles de shells : Bash, PowerShell, CMD",
  subtitle: "Comprendre qui est qui, et pourquoi une même idée s'écrit différemment.",
  theory: `
<h3>1. Un shell, c'est un langage</h3>
<p>Un <strong>shell</strong> n'est pas qu'un exécuteur de commandes : c'est un véritable <strong>langage</strong>, avec sa grammaire, ses mots-clés et ses habitudes. Deux shells peuvent faire la même chose tout en l'écrivant autrement, comme « merci » et « thank you » expriment la même idée en deux langues. Ce cours te rend « trilingue ».</p>
<h3>2. Bash — le classique d'Unix</h3>
<p><strong>Bash</strong> (« Bourne Again SHell ») règne sur Linux et reste très présent sur macOS. Sa philosophie : de <strong>petits outils</strong> qui font une seule chose, qu'on relie ensuite entre eux. Tout y est vu comme du <strong>texte</strong>. Il est <strong>sensible à la casse</strong> : <code>Fichier.txt</code> et <code>fichier.txt</code> sont deux noms différents.</p>
<pre class="pseudo"># Bash : lister le dossier courant
ls</pre>
<h3>3. PowerShell — l'approche « objets »</h3>
<p><strong>PowerShell</strong> est le shell moderne de Windows (disponible aussi sur Linux/macOS). Sa grande originalité : il ne manipule pas du texte mais des <strong>objets</strong> (des données structurées, avec des propriétés nommées). Ses commandes suivent un schéma très régulier <strong>Verbe-Nom</strong> : <code>Get-ChildItem</code>, <code>Copy-Item</code>, <code>Remove-Item</code>. Pour rester accueillant, il fournit des <strong>alias</strong> qui imitent Bash et CMD.</p>
<pre class="pseudo"># PowerShell : lister le dossier courant
Get-ChildItem        # le vrai nom (Verbe-Nom)
ls                   # alias qui imite Bash
dir                  # alias qui imite CMD</pre>
<div class="tip">Les alias de PowerShell (comme <code>ls</code> ou <code>dir</code>) sont pratiques, mais ils n'ont pas TOUTES les options de leurs cousins Bash/CMD. En cas de comportement surprenant, reviens au vrai nom Verbe-Nom.</div>
<h3>4. CMD — l'héritage historique de Windows</h3>
<p><strong>CMD</strong> (l'« Invite de commandes ») est l'ancien shell de Windows, hérité de MS-DOS. Il est plus limité que les deux autres, mais toujours présent et utile pour de petites tâches. Ses commandes sont souvent en majuscules dans la doc, mais CMD n'est <strong>pas sensible à la casse</strong>.</p>
<pre class="pseudo"># CMD : lister le dossier courant
dir</pre>
<h3>5. La même idée, trois écritures</h3>
<p>Voici la démonstration centrale de ce cours : « lister le contenu du dossier courant », dans les trois shells.</p>
<pre class="pseudo"># Bash (Linux/macOS)
ls               # liste le dossier courant
# PowerShell (Windows)
Get-ChildItem    # (alias : ls, dir) liste le dossier courant
# CMD (Windows)
dir              # liste le dossier courant</pre>
<div class="warn">Deux différences majeures à garder en tête :<br>
1) Les <strong>chemins</strong> utilisent <code>/</code> (barre oblique) sous Bash et <code>\</code> (barre inverse) sous Windows.<br>
2) La <strong>sensibilité à la casse</strong> : Bash distingue majuscules et minuscules ; PowerShell et CMD, non (le plus souvent).</div>
<h3>6. Lequel choisir ?</h3>
<pre class="pseudo"># Tu es sur Linux ou un serveur          → Bash (incontournable)
# Tu administres Windows en profondeur    → PowerShell (objets, tres puissant)
# Petite tache rapide sous Windows        → CMD suffit souvent
# Le bon reflexe : reconnaitre le shell (jour 2) puis parler SA langue.</pre>`,

    { type: "qcm", q: "Bash suit quelle philosophie ?", opts: ["Un seul énorme programme qui fait tout", "De petits outils spécialisés qu'on relie entre eux", "Aucune commande, tout à la souris", "Uniquement des objets"], a: 1, exp: "Unix : petits outils composables, tout en texte." },
    { type: "input", q: "Quelle commande liste le dossier courant sous CMD (Windows) ?", a: ["dir"], ph: "une commande", exp: "dir liste le contenu du dossier sous CMD." },

    { type: "vf", q: "CMD et PowerShell sont, la plupart du temps, sensibles à la casse comme Bash.", a: false, exp: "Non : sous Windows, CMD et PowerShell ignorent généralement la casse." },
    { type: "input", q: "Quelle commande Bash liste le dossier courant ?", a: ["ls"], ph: "une commande", exp: "ls (list) liste le dossier courant sous Bash." },
    { type: "qcm", q: "Le schéma de nommage régulier des commandes PowerShell est…", opts: ["Nom-Verbe", "Verbe-Nom (Get-ChildItem, Copy-Item…)", "Des sigles de 2 lettres", "Que des majuscules"], a: 1, exp: "PowerShell suit le motif Verbe-Nom." },
    { type: "qcm", q: "Pourquoi <code>ls</code> et <code>dir</code> fonctionnent-ils sous PowerShell ?", opts: ["Ce sont des alias vers Get-ChildItem", "PowerShell est en réalité Bash", "C'est une coïncidence", "Ils ne fonctionnent pas"], a: 0, exp: "PowerShell fournit ls et dir comme alias de Get-ChildItem." },
    { type: "qcm", q: "Quel séparateur de chemin utilise Windows (PowerShell/CMD) ?", opts: ["/ (barre oblique)", "\\ (barre inverse)", "| (barre verticale)", "- (tiret)"], a: 1, exp: "Windows utilise \\ ; Bash utilise /." },
    { type: "input", q: "Quel caractère sépare les dossiers dans un chemin sous Bash (Linux/macOS) ?", a: ["/", "slash", "barre oblique"], ph: "un caractère", exp: "Bash utilise la barre oblique / dans les chemins." },
    { type: "vf", q: "Les alias PowerShell (ls, dir) possèdent exactement toutes les options de leurs cousins Bash et CMD.", a: false, exp: "Non : ce sont des raccourcis vers Get-ChildItem ; ils n'ont pas toutes les options d'origine." },
    { type: "qcm", q: "De quel ancien système CMD est-il l'héritier ?", opts: ["Unix", "MS-DOS", "macOS", "Linux"], a: 1, exp: "CMD descend de MS-DOS, l'ancien système de Windows." },
    { type: "vf", q: "Une même intention (lister un dossier) peut s'écrire ls, Get-ChildItem ou dir selon le shell.", a: true, exp: "Oui : même idée, trois écritures selon Bash, PowerShell, CMD." },
    { type: "qcm", q: "Que signifie l'acronyme Bash ?", opts: ["Basic Shell", "Bourne Again SHell", "Binary Application Shell", "Big Advanced Shell"], a: 1, exp: "Bash = Bourne Again SHell, successeur du shell de Bourne." }
  ],
  final: {

      { type: "vf", q: "En passant de Bash à Windows, il faut penser à changer / en \\ dans les chemins.", a: true, exp: "Oui : / sous Bash, \\ sous Windows." }
    ],
    solution: `<pre class="pseudo"># « Lister le dossier courant » dans les trois langues :

ls               # petits outils, tout en texte, sensible a la casse

# A retenir : /  vs  \  dans les chemins ; casse selon le shell.</pre>

  }
