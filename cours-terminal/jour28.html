<script>
var DAY = {
  num: 28,
  title: "Les tâches planifiées (cron, Planificateur)",
  subtitle: "Faire tourner un script tout seul, à l'heure et au rythme voulus.",
  theory: `
<h3>1. Pourquoi planifier ?</h3>
<p>Un script (jours 26-27) doit encore être lancé à la main. La <strong>planification</strong> permet au système de l'exécuter <strong>automatiquement</strong> : chaque nuit, tous les lundis, toutes les heures... Sauvegarde nocturne, nettoyage hebdomadaire, rapport quotidien : tout ce qui est répétitif peut être confié à la machine.</p>
<div class="tip">Sous Unix, l'outil historique s'appelle <strong>cron</strong> (le « chronométreur »). Sous Windows, c'est le <strong>Planificateur de tâches</strong>, pilotable en ligne de commande via <code>schtasks</code>.</div>

<h3>2. cron et le crontab (Unix)</h3>
<p><strong>cron</strong> est un service qui lit une table de tâches, le <strong>crontab</strong>, et exécute chaque ligne au bon moment.</p>
<pre class="pseudo"># --- Bash (Linux / macOS) ---
crontab -e        # EDITER sa table de taches personnelles
crontab -l        # LISTER ses taches planifiees
crontab -r        # SUPPRIMER toutes ses taches (prudence !)</pre>

<h3>3. Lire une ligne de crontab : les 5 champs</h3>
<p>Chaque ligne commence par <strong>5 champs de temps</strong>, puis la commande à lancer. L'ordre : <strong>minute, heure, jour du mois, mois, jour de la semaine</strong>. Une étoile <code>*</code> signifie « chaque ».</p>
<pre class="pseudo"># --- Structure ---
# min  heure  jour-mois  mois  jour-semaine   commande
#  *     *       *        *        *          (chaque minute)
   30    2       *        *        *          /home/moi/sauvegarde.sh
#  ^ a 2h30 CHAQUE nuit : lance sauvegarde.sh

   0     9       *        *        1          /home/moi/rapport.sh
#  ^ a 9h00, le jour 1 de la semaine (lundi) : rapport hebdomadaire

   */15  *       *        *        *          /home/moi/verifie.sh
#  ^ toutes les 15 minutes (*/15 = tous les 15)</pre>
<div class="warn">Le champ jour-de-semaine va de 0 à 6 (0 = dimanche). Piège classique : oublier que <code>30 2 * * *</code> veut dire « à 2h30 » et non « toutes les 2h30 ». Lis toujours les champs de gauche à droite : minute d'abord, heure ensuite.</div>
<div class="tip">Un site comme « crontab guru » aide à traduire ces 5 champs en français. Au début, garde un mémo : minute, heure, jour du mois, mois, jour de la semaine.</div>

<h3>4. Côté Windows : schtasks (CMD/PowerShell)</h3>
<pre class="pseudo"># --- CMD / PowerShell : creer une tache ---
schtasks /Create /SC DAILY /ST 02:30 /TN "Sauvegarde" /TR "C:\scripts\sauvegarde.bat"
# /SC = frequence (DAILY, WEEKLY, HOURLY...) ; /ST = heure de depart
# /TN = nom de la tache ; /TR = programme a lancer

schtasks /Query          REM lister les taches planifiees
schtasks /Delete /TN "Sauvegarde"   REM supprimer une tache</pre>
<pre class="pseudo"># --- PowerShell moderne (cmdlets dedies) ---
$action  = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "C:\scripts\backup.ps1"
$trigger = New-ScheduledTaskTrigger -Daily -At 2:30am
Register-ScheduledTask -TaskName "Sauvegarde" -Action $action -Trigger $trigger</pre>
<div class="tip">Correspondance des idées : le <code>/SC DAILY /ST 02:30</code> de <code>schtasks</code> joue le rôle des 5 champs de cron. PowerShell propose en plus des cmdlets lisibles (<code>New-ScheduledTaskTrigger -Daily -At 2:30am</code>).</div>

<h3>5. Deux pièges universels de la planification</h3>
<pre class="pseudo"># Piege 1 : les CHEMINS. Une tache planifiee ne connait pas tes alias ni
#           forcement ton PATH. Utilise des chemins ABSOLUS :
#   /home/moi/scripts/sauvegarde.sh   (et non  sauvegarde.sh)
# Piege 2 : journaliser. Rediriger la sortie pour savoir ce qui s'est passe :
   30 2 * * * /home/moi/sauvegarde.sh &gt;&gt; /home/moi/sauvegarde.log 2&gt;&amp;1</pre>
<div class="warn">Une tâche planifiée s'exécute « dans le noir », sans toi. Deux réflexes vitaux : <strong>chemins absolus</strong> (elle ne devine pas le dossier courant) et <strong>journalisation</strong> (rediriger la sortie vers un fichier log pour diagnostiquer en cas de souci).</div>

<h3>6. Récapitulatif</h3>
<pre class="pseudo"># Unix    : crontab -e (editer), -l (lister), -r (tout supprimer)
#           5 champs : min heure jour-mois mois jour-semaine  commande
#           ex : 30 2 * * *  = tous les jours a 2h30
# Windows : schtasks /Create /SC DAILY /ST 02:30 /TN nom /TR programme
#           schtasks /Query (lister), /Delete (supprimer)
# Toujours: chemins ABSOLUS + journaliser la sortie (&gt;&gt; log 2&gt;&amp;1)</pre>`,
  exercises: [
    { type: "qcm", q: "À quoi sert la planification de tâches ?", opts: ["À accélérer un script", "À exécuter automatiquement un script à des moments définis", "À compresser un script", "À déboguer un script"], a: 1, exp: "Elle lance le script tout seul, à l'heure et au rythme voulus." },
    { type: "qcm", q: "Quel est l'outil de planification historique sous Unix ?", opts: ["schtasks", "cron", "systemd-timer seulement", "at"], a: 1, exp: "cron lit le crontab et exécute les tâches planifiées." },
    { type: "input", q: "Bash : quelle commande ouvre l'éditeur de ta table de tâches cron ?", a: ["crontab -e"], ph: "crontab …", exp: "crontab -e édite tes tâches planifiées." },
    { type: "input", q: "Bash : quelle commande LISTE tes tâches cron sans les éditer ?", a: ["crontab -l"], ph: "crontab …", exp: "crontab -l affiche la liste de tes tâches." },
    { type: "qcm", q: "Combien de champs de temps précèdent la commande dans une ligne de crontab ?", opts: ["3", "4", "5", "6"], a: 2, exp: "5 champs : minute, heure, jour du mois, mois, jour de la semaine." },
    { type: "qcm", q: "Dans le crontab, que signifie une étoile <code>*</code> dans un champ ?", opts: ["Jamais", "Chaque valeur possible de ce champ", "Une erreur", "Minuit"], a: 1, exp: "* = « chaque » (chaque heure, chaque jour...)." },
    { type: "qcm", q: "Que fait la ligne <code>30 2 * * * script.sh</code> ?", opts: ["Toutes les 2h30", "Tous les jours à 2h30 du matin", "Le 30 de chaque mois à minuit", "Toutes les 30 minutes"], a: 1, exp: "minute=30, heure=2, le reste = chaque jour : donc tous les jours à 2h30." },
    { type: "input", q: "Crontab : complète les 5 champs pour lancer <code>verifie.sh</code> TOUTES les 15 minutes (utilise */15 pour le champ minute). Écris la ligne entière (champs + /home/moi/verifie.sh).", a: ["*/15 * * * * /home/moi/verifie.sh"], ph: "*/15 * * * * /home/moi/verifie.sh", exp: "*/15 dans le champ minute = toutes les 15 minutes." },
    { type: "vf", q: "La ligne <code>0 9 * * 1</code> planifie une tâche le lundi à 9h.", a: true, exp: "Vrai : minute 0, heure 9, jour de semaine 1 (lundi)." },
    { type: "qcm", q: "Sous Windows, quelle commande crée une tâche planifiée en ligne de commande ?", opts: ["crontab", "schtasks /Create", "task new", "at /make"], a: 1, exp: "schtasks /Create pilote le Planificateur de tâches Windows." },
    { type: "input", q: "Windows : quelle commande LISTE les tâches planifiées ? (schtasks avec l'option de requête)", a: ["schtasks /Query", "schtasks /query"], ph: "schtasks /…", exp: "schtasks /Query liste les tâches." },
    { type: "qcm", q: "Dans <code>schtasks /Create /SC DAILY /ST 02:30</code>, que règle <code>/ST 02:30</code> ?", opts: ["Le nom de la tâche", "L'heure de départ (Start Time) : 2h30", "La durée", "Le nombre de répétitions"], a: 1, exp: "/ST = Start Time, l'heure d'exécution." },
    { type: "qcm", q: "Pourquoi utiliser des chemins ABSOLUS dans une tâche planifiée ?", opts: ["Pour aller plus vite", "Parce qu'elle ne connaît pas ton dossier courant ni tes alias", "C'est interdit autrement", "Pour réduire la taille du crontab"], a: 1, exp: "La tâche s'exécute hors de ton contexte : le chemin relatif peut échouer." },
    { type: "vf", q: "Il est inutile de journaliser la sortie d'une tâche planifiée.", a: false, exp: "Faux : journaliser (rediriger vers un log) est vital pour diagnostiquer une tâche qui tourne « dans le noir »." },
    { type: "input", q: "Crontab : complète la ligne pour lancer sauvegarde.sh chaque jour à 2h30 en journalisant tout dans sauvegarde.log. Écris les 5 champs + la commande + la redirection.", a: ["30 2 * * * /home/moi/sauvegarde.sh >> /home/moi/sauvegarde.log 2>&1", "30 2 * * * /home/moi/sauvegarde.sh >> sauvegarde.log 2>&1"], ph: "30 2 * * * … >> …log 2>&1", exp: ">> ajoute au log et 2>&1 y joint aussi les erreurs." }
  ],
  final: {
    title: "Exercice final — Automatiser une sauvegarde nocturne",
    intro: `<p>Tu as un script <code>sauvegarde.sh</code> (chemin complet <code>/home/moi/sauvegarde.sh</code>). Tu veux qu'il tourne chaque nuit à 3h00, en gardant une trace de ce qui s'est passé.</p>`,
    questions: [
      { type: "input", q: "Bash : quelle commande ouvre l'éditeur du crontab pour ajouter la tâche ?", a: ["crontab -e"], ph: "crontab …", exp: "crontab -e ouvre ta table de tâches." },
      { type: "qcm", q: "Quels sont les 5 champs, dans l'ordre ?", opts: ["heure, minute, jour, mois, année", "minute, heure, jour du mois, mois, jour de la semaine", "jour, mois, année, heure, minute", "seconde, minute, heure, jour, mois"], a: 1, exp: "minute, heure, jour du mois, mois, jour de la semaine." },
      { type: "input", q: "Crontab : écris les 5 champs pour « chaque jour à 3h00 » (avant la commande).", a: ["0 3 * * *"], ph: "0 3 * * *", exp: "minute 0, heure 3, chaque jour du mois, chaque mois, chaque jour de semaine." },
      { type: "input", q: "Crontab : écris la ligne COMPLÈTE lançant /home/moi/sauvegarde.sh à 3h00 en journalisant dans /home/moi/sauvegarde.log (erreurs incluses).", a: ["0 3 * * * /home/moi/sauvegarde.sh >> /home/moi/sauvegarde.log 2>&1"], ph: "0 3 * * * /home/moi/sauvegarde.sh >> …log 2>&1", exp: "Chemin absolu + redirection >> ...log 2>&1 pour tout tracer." },
      { type: "qcm", q: "L'équivalent Windows de cette tâche quotidienne serait…", opts: ["schtasks /Create /SC DAILY /ST 03:00 /TN Sauvegarde /TR ...", "crontab -e", "task /new /daily 03:00", "at now"], a: 0, exp: "schtasks /Create /SC DAILY /ST 03:00 planifie la tâche sous Windows." }
    ],
    solution: `<pre class="pseudo"># --- Unix (crontab -e) ---
0 3 * * * /home/moi/sauvegarde.sh >> /home/moi/sauvegarde.log 2>&1
#  ^minute 0, ^heure 3 => tous les jours a 3h00
#  chemin ABSOLU + journalisation (sortie et erreurs dans le log)

# --- Windows (schtasks) ---
schtasks /Create /SC DAILY /ST 03:00 /TN "Sauvegarde" /TR "C:\scripts\sauvegarde.bat"

# --- Windows (PowerShell moderne) ---
$action  = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "C:\scripts\backup.ps1"
$trigger = New-ScheduledTaskTrigger -Daily -At 3:00am
Register-ScheduledTask -TaskName "Sauvegarde" -Action $action -Trigger $trigger</pre>
<p>Ta machine travaille désormais pendant que tu dors. Demain : enchaîner des commandes de façon conditionnelle.</p>`
  }
};
</script>
