<script>
var DAY = {
  num: 19,
  title: "Déploiement automatisé : staging, production, santé",
  subtitle: "Livrer sans intervention risquée : d'abord staging, vérifier la santé, puis promouvoir — sinon rollback.",
  theory: `
<h3>1. Déployer sur un tag de version</h3>
<p><strong>Déployer</strong>, c'est installer et lancer le programme sur le serveur où les utilisateurs s'en serviront. Un <strong>tag</strong> (« étiquette ») de version, comme <code>v1.4.0</code>, marque une version précise du code destinée à être livrée.</p>
<pre class="pseudo">deploy:                                        # le job de deploiement
  needs: [test, quality, scan]                 # ne se lance qu'apres ces 3 jobs reussis
  if: startsWith(github.ref, 'refs/tags/v')    # UNIQUEMENT si on a pousse un tag commencant par "v" (ex. v1.4.0)
  steps: [ ...pousser l'image, deployer... ]   # les etapes concretes du deploiement</pre>
<p>Le déploiement se déclenche sur une <strong>version taguée</strong> (<code>v1.4.0</code>), et non à chaque commit. <code>startsWith(github.ref, 'refs/tags/v')</code> teste que la référence poussée est bien un tag de version. On livre ainsi des versions identifiées, traçables jusqu'au code qui les a produites.</p>

<h3>2. Staging avant production</h3>
<div class="tip"><strong>Staging</strong> (« pré-production ») est un environnement identique à la production, mais sans utilisateurs réels — une sorte de répétition générale. On y déploie <em>d'abord</em> : si quelque chose casse, cela casse là, pas chez les clients. La <strong>production</strong> (l'environnement réel utilisé par les clients) ne reçoit que ce que staging a validé.</div>

<h3>3. Le contrôle de santé (healthcheck)</h3>
<pre class="pseudo">deploy staging                                          # 1) deployer en pre-production
if ! healthcheck staging;  then echo "KO"; exit 1; fi   # 2) si la sante est mauvaise -> stopper (bloque la promotion)
deploy production                                       # 3) sinon, deployer en production
if ! healthcheck production; then rollback; fi          # 4) si la prod est malade -> revenir en arriere (filet)</pre>
<p>Un <strong>healthcheck</strong> (contrôle de santé) vérifie que l'application démarrée répond correctement : un <em>endpoint de santé</em> (une adresse dédiée qui répond « je vais bien »), la connexion à la base OK, la version attendue. Le <code>!</code> signifie « si ce n'est PAS le cas ». Sans réponse saine, on ne <strong>promeut</strong> pas (on ne fait pas passer en production) — et on annule si la prod échoue.</p>

<h3>4. Le rollback</h3>
<div class="warn">Un <strong>rollback</strong> redéploie la version précédente, connue comme bonne. Comme chaque image est étiquetée (leçon 18), revenir en arrière est une simple commande, pas une reconstruction. La capacité à revenir vite est aussi importante que celle de déployer.</div>
<pre class="pseudo">rollback: docker service update --image registry/ludotheque:\${VERSION_PRECEDENTE} ... # remettre en service l'image de la version precedente</pre>

<h3>5. Zéro intervention manuelle risquée</h3>
<p>Tout le trajet — build, tests, scan, déploiement en staging, contrôle de santé, promotion, rollback éventuel — est <strong>automatisé</strong> et déclenché par un tag. On supprime les manipulations manuelles en production, sources classiques d'erreurs. Livrer devient sûr, répétable et fréquent.</p>
`,
  exercises: [
    { type: "qcm", q: "Le déploiement se déclenche…", opts: ["à chaque commit", "sur un tag de version (vX.Y.Z)", "à chaque pull request", "manuellement en prod"], a: 1, exp: "Versions identifiées." },
    { type: "qcm", q: "Staging est…", opts: ["la production", "un environnement identique sans utilisateurs réels", "un serveur de développement local", "une sauvegarde de la base"], a: 1, exp: "Pré-production." },
    { type: "qcm", q: "On déploie d'abord…", opts: ["en production", "en staging", "chez les clients", "sur les postes de dev"], a: 1, exp: "Casser là, pas chez les clients." },
    { type: "qcm", q: "Un healthcheck vérifie…", opts: ["la taille de l'image", "que l'app répond correctement (santé)", "les CVE de l'image", "la couverture de tests"], a: 1, exp: "État de service." },
    { type: "qcm", q: "Si le healthcheck staging échoue, on…", opts: ["promeut quand même", "bloque la promotion", "redéploie en production", "ignore l'erreur"], a: 1, exp: "Pas de promotion." },
    { type: "qcm", q: "Un rollback…", opts: ["reconstruit tout", "redéploie la version précédente connue bonne", "corrige le code en prod", "déploie une nouveauté"], a: 1, exp: "Retour arrière rapide." },
    { type: "qcm", q: "Le rollback est rapide parce que…", opts: ["on recompile", "chaque image est étiquetée (leçon 18)", "on restaure la base", "le cache est chaud"], a: 1, exp: "Image prête." },
    { type: "qcm", q: "La capacité à revenir vite est…", opts: ["secondaire", "aussi importante que celle de déployer", "inutile", "interdite"], a: 1, exp: "Résilience." },
    { type: "qcm", q: "L'automatisation supprime…", opts: ["les tests", "les manipulations manuelles risquées en prod", "les sauvegardes", "les healthchecks"], a: 1, exp: "Source d'erreurs." },
    { type: "qcm", q: "La production reçoit…", opts: ["chaque commit directement", "ce que staging a validé", "le code non testé", "la version de développement"], a: 1, exp: "Après validation." },
    { type: "vf", q: "On promeut en production sans vérifier la santé de staging.", a: false, exp: "Faux : healthcheck d'abord." },
    { type: "qcm", q: "Un tag v1.4.0 permet…", opts: ["de chiffrer l'image", "de tracer la version jusqu'au code", "de sauter les tests", "d'accélérer"], a: 1, exp: "Traçabilité." },
    { type: "qcm", q: "deploy needs: [test, quality, scan] signifie…", opts: ["on déploie sans vérif", "on ne déploie qu'après ces jobs verts", "on saute les tests", "on déploie en parallèle des tests"], a: 1, exp: "Prérequis." },
    { type: "qcm", q: "Livrer souvent devient possible car…", opts: ["c'est risqué", "c'est automatisé, répétable et réversible", "on supprime les tests", "on déploie à la main"], a: 1, exp: "Déploiement sûr." },
    { type: "qcm", q: "Le healthcheck production raté déclenche…", opts: ["une promotion", "un rollback", "un nouveau déploiement", "une simple alerte"], a: 1, exp: "Filet." }
  ],
  final: {
    title: "Exercice final — Un déploiement avec filet",
    intro: `<p>Un script déploie directement en production, sans étape intermédiaire :</p>
<pre class="pseudo">deploy production          # DANGER : on deploie direct chez les clients, sans staging
# fin                       # ni controle de sante, ni rollback prevu</pre>
`,
    questions: [
      { type: "qcm", q: "Défaut n°1 :", opts: ["aucun", "pas d'étape staging : on teste directement chez les clients", "trop de healthchecks", "pas de tag de version"], a: 1, exp: "Risque en prod." },
      { type: "qcm", q: "Défaut n°2 :", opts: ["aucun", "aucun contrôle de santé", "trop de rollbacks", "un staging inutile"], a: 1, exp: "On ne vérifie rien." },
      { type: "qcm", q: "Défaut n°3 :", opts: ["aucun", "aucun rollback prévu si ça casse", "pas de healthcheck", "un déploiement trop lent"], a: 1, exp: "Pas de retour arrière." },
      { type: "qcm", q: "L'ordre correct :", opts: ["directement en prod (sans staging)", "staging → healthcheck → prod → healthcheck (sinon rollback)", "prod puis staging", "staging seulement"], a: 1, exp: "Filet complet." },
      { type: "qcm", q: "Le déclencheur idéal :", opts: ["chaque commit", "un tag de version", "un clic manuel en prod", "une pull request"], a: 1, exp: "Version tracée." }
    ],
    solution: `<pre class="pseudo">deploy:                                          # le job de deploiement
  needs: [test, quality, scan]                   # apres les 3 jobs verts
  if: startsWith(github.ref, 'refs/tags/v')      # seulement sur un tag de version
  steps:                                         # etapes du deploiement
    - run: docker push registry/ludotheque:\${{ github.ref_name }}  # pousser l'image taguee (nom du tag)
    - run: deploy staging && healthcheck staging      # deployer en pre-prod ET verifier sa sante
    - run: deploy production && healthcheck production # deployer en prod ET verifier sa sante
    - run: |                                          # bloc multi-lignes : rollback si sante KO
        if ! healthcheck production; then             # si la prod ne repond pas correctement...
          deploy registry/ludotheque:\${VERSION_PRECEDENTE}  # ...redeployer la version precedente (rollback)
        fi                                            # fin du if</pre>
<p>Staging d'abord, santé vérifiée à chaque étape, rollback automatique en cas d'échec, le tout déclenché par un tag. Livrer devient sûr et réversible. Demain : observabilité, sauvegardes, RGPD et rollback.</p>
`
  }
};
</script>

  items: [
  { id: "projcpppro-l19", title: "Déploiement staging → prod avec rollback", level: 3,
    statement: "Écris un job de déploiement (pseudo-YAML/shell) déclenché sur un tag vX.Y.Z : pousse l'image, déploie en staging et vérifie sa santé (stop si KO), déploie en production, et en cas de healthcheck production KO, redéploie la version précédente.",
    hints: [
      "if: startsWith(github.ref, 'refs/tags/v').",
      "healthcheck staging bloque la promotion s'il échoue.",
      "En cas d'échec prod : redéployer la version précédente (rollback)."
    ],
    solution: "deploy:                                          # job de deploiement\n  needs: [test, quality, scan]                   # apres les 3 jobs verts\n  if: startsWith(github.ref, 'refs/tags/v')      # seulement sur un tag de version (ex. v1.4.0)\n  runs-on: ubuntu-latest                         # machine Ubuntu fournie par GitHub\n  steps:                                         # etapes du job\n    - run: docker push registry/ludotheque:${{ github.ref_name }}  # pousser l'image taguee\n    - run: |                                     # etape pre-production :\n        deploy staging                           # deployer en staging\n        healthcheck staging || { echo 'staging KO'; exit 1; }   # bloque la promotion si la sante est KO\n    - run: |                                     # etape production :\n        deploy production                        # deployer en production\n        if ! healthcheck production; then        # si la prod ne repond pas correctement...\n          deploy registry/ludotheque:$VERSION_PRECEDENTE          # ROLLBACK : redeployer la version precedente\n        fi                                       # fin du if",
    note: "Le déploiement suit staging → healthcheck → production, déclenché par un tag traçable. Le contrôle de santé conditionne chaque promotion, et un échec en production redéploie automatiquement la version précédente connue bonne. Automatiser ce trajet supprime les manipulations manuelles risquées : livrer devient sûr, répétable et réversible." }
  ]
};
