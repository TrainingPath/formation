<script>
var DAY = {
  num: 21,
  title: "Récapitulatif : le projet professionnel de bout en bout (examen)",
  subtitle: "Du premier commit à la production surveillée : construire, industrialiser et sécuriser d'un même geste.",
  theory: `
<h3>1. Ce que le « pro » ajoute</h3>
<p>Le domaine (le sujet : la ludothèque) est le même que le projet « à la main », mais on y a ajouté les <strong>garanties</strong> qui rendent le logiciel livrable : versionnement (l'historique du code tenu par Git), conteneurs (les boîtes reproductibles de Docker), CI/CD (les vérifications et le déploiement automatiques), tests continus, sécurité durcie, image de production, déploiement automatisé et observabilité (la capacité de voir ce qui se passe). Le « pro », ce ne sont pas plus de fonctionnalités — c'est plus de rigueur.</p>

<h3>2. Construire (objet, sûr)</h3>
<p>Une architecture <strong>en couches</strong> (modèle, DAO qui parle à la base, service qui décide, UI qui affiche), des <strong>requêtes préparées</strong> partout (des requêtes à trous qui empêchent l'injection SQL), des <strong>transactions</strong> pour l'atomicité (tout ou rien), le <strong>RAII et les smart pointers</strong> pour zéro fuite mémoire (les ressources se libèrent d'elles-mêmes), des <strong>exceptions</strong> typées (des signaux d'erreur précis). Le C++ moderne au service d'un code expressif et robuste.</p>

<h3>3. Industrialiser (reproductible, testé)</h3>
<p><strong>Git + PR</strong> (branches et demandes de fusion relues), un environnement <strong>conteneurisé</strong>, une <strong>CI</strong> qui compile, teste (tests unitaires isolés + tests d'intégration avec la vraie base), passe le <em>lint</em> et les <em>sanitizers</em> (analyses statique et dynamique du code), puis scanne l'image (recherche de failles connues) ; la <strong>protection de branche</strong> (le garde-fou qui bloque la fusion sans feu vert) ; une <strong>image multi-stage non-root</strong> (minimale et sans privilèges) ; un <strong>déploiement automatisé</strong> staging → production avec healthcheck (contrôle de santé) et rollback (retour en arrière).</p>

<h3>4. Sécuriser (en profondeur)</h3>
<p>Le <strong>hash</strong> des mots de passe (jamais stockés en clair), l'<strong>autorisation</strong> par rôle et par ressource (<strong>anti-IDOR</strong> : impossible d'accéder aux données d'autrui), les <strong>secrets</strong> injectés par l'environnement (jamais versionnés), des <strong>logs</strong> sans donnée sensible, un <strong>scan</strong> de vulnérabilités. Plusieurs barrières se cumulent : si l'une cède, les autres tiennent — c'est la défense en profondeur.</p>

<h3>5. Exploiter (observable, réversible, conforme)</h3>
<div class="tip"><strong>Observabilité</strong> (logs, métriques, endpoint de santé), <strong>sauvegardes testées</strong> (dont la restauration est vérifiée), <strong>RGPD</strong> (minimisation, chiffrement, effacement, rétention limitée des données personnelles), <strong>rollback documenté</strong>. Tu sais désormais mener une application C++ du premier commit à une production surveillée et durable. Bravo, tu as terminé le parcours ! 🎉</div>
`,
  exercises: [
    { type: "qcm", q: "Le « pro » ajoute surtout…", opts: ["des fonctionnalités", "des garanties (rigueur : repro, tests, sécurité, livraison)", "du code", "des rôles"], a: 1, exp: "Livrabilité." },
    { type: "qcm", q: "Les couches sont…", opts: ["une seule", "modèle, DAO, service, UI", "UI seule", "SQL seul"], a: 1, exp: "Responsabilités séparées." },
    { type: "qcm", q: "Toute donnée externe passe par…", opts: ["la concaténation", "des requêtes préparées", "l'UI", "un fichier"], a: 1, exp: "Anti-injection." },
    { type: "qcm", q: "L'atomicité vient…", opts: ["du hasard", "des transactions", "des logs", "de l'UI"], a: 1, exp: "Tout ou rien." },
    { type: "qcm", q: "Zéro fuite mémoire grâce…", opts: ["au new/delete manuel", "au RAII et aux smart pointers", "aux goto", "aux globales"], a: 1, exp: "Garantie du langage." },
    { type: "qcm", q: "L'environnement reproductible vient…", opts: ["du code seul", "des conteneurs (Docker)", "des logs", "du hasard"], a: 1, exp: "Fin du « ça marche chez moi »." },
    { type: "qcm", q: "La CI vérifie…", opts: ["rien", "build, tests, lint/sanitizers, scan", "l'UI seule", "les secrets"], a: 1, exp: "Qualité continue." },
    { type: "qcm", q: "L'autorisation contrôle…", opts: ["le rôle seulement", "le rôle ET la ressource (anti-IDOR)", "la vitesse", "l'affichage"], a: 1, exp: "Deux niveaux." },
    { type: "qcm", q: "Les secrets viennent…", opts: ["du code", "de l'environnement", "des logs", "du binaire"], a: 1, exp: "Jamais versionnés." },
    { type: "qcm", q: "L'image de production est…", opts: ["tout-en-un root", "multi-stage, non-root, scannée", "sans build", "en latest"], a: 1, exp: "Durcie." },
    { type: "vf", q: "La protection de branche transforme la CI en exigence, pas en simple indicateur.", a: true, exp: "Garde-fou." },
    { type: "qcm", q: "Le déploiement automatisé suit…", opts: ["prod直接", "staging → healthcheck → prod (rollback si KO)", "au hasard", "manuel"], a: 1, exp: "Avec filet." },
    { type: "qcm", q: "Une sauvegarde ne vaut que si…", opts: ["elle est grosse", "sa restauration est testée", "elle est en clair", "elle est rare"], a: 1, exp: "Restaurable." },
    { type: "qcm", q: "Le RGPD impose notamment…", opts: ["tout garder", "minimisation, chiffrement, effacement, rétention limitée", "logger les gens", "rien"], a: 1, exp: "Conformité." },
    { type: "qcm", q: "Exploitable = observable + sauvegardé +…", opts: ["gros + joli", "conforme + réversible", "root + latest", "rapide seulement"], a: 1, exp: "Service durable." }
  ],
  final: {
    title: "Examen final — Le trajet d'un commit vers la production",
    intro: `<p>Un développeur corrige un bug de tarif, sur une branche. Retrace le trajet complet jusqu'à la production surveillée, avec les garanties à chaque étape.</p>`,
    questions: [
      { type: "qcm", q: "1) Le travail se fait…", opts: ["sur main", "sur une branche, avec un test qui reproduit le bug", "sans Git", "en prod"], a: 1, exp: "Branche + test." },
      { type: "qcm", q: "2) La PR déclenche…", opts: ["un déploiement direct", "la CI : build, tests, lint/sanitizers, scan", "rien", "un rollback"], a: 1, exp: "Vérifications." },
      { type: "qcm", q: "3) Le merge sur main est…", opts: ["libre", "bloqué tant que la CI n'est pas verte et revue (protection)", "automatique sans revue", "manuel en prod"], a: 1, exp: "Garde-fou." },
      { type: "qcm", q: "4) Un tag de version déclenche…", opts: ["rien", "le déploiement staging → healthcheck → production", "un log", "un secret"], a: 1, exp: "Livraison automatisée." },
      { type: "qcm", q: "5) Si la prod répond mal…", opts: ["on laisse", "rollback vers la version précédente étiquetée", "on redémarre le PC", "on ignore"], a: 1, exp: "Réversibilité." },
      { type: "qcm", q: "6) Ensuite, on surveille via…", opts: ["rien", "logs, métriques, santé (observabilité)", "l'UI seule", "les secrets"], a: 1, exp: "Exploitation." }
    ],
    solution: `<pre class="pseudo">1. Branche fix/tarif + test qui reproduit le bug (rouge), puis correction (vert).
2. Pull request → CI : build, tests (unit + intégration), lint, sanitizers, scan image.
3. Protection de main : merge autorisé seulement si tous les checks verts + 1 revue.
4. Tag v1.4.1 → déploiement : push image étiquetée, staging + healthcheck,
   puis production + healthcheck.
5. Healthcheck production KO ? → rollback automatique vers l'image précédente.
6. Production surveillée : logs structurés, métriques, endpoint de santé ;
   sauvegardes testées, conformité RGPD, rollback documenté en réserve.
// Construire + industrialiser + sécuriser + exploiter : la Ludothèque pro, livrée.</pre>
<p>Du commit à la production surveillée, chaque étape est outillée, testée, sécurisée et réversible. Tu sais désormais industrialiser une application C++ de bout en bout. Félicitations — parcours terminé ! 🎉</p>`
  }
};
</script>
