<script>
var DAY = {
  num: 5,
  title: "Le modèle en classes et le DAO, testés dès l'écriture",
  subtitle: "Coder une classe du domaine et son mapping — avec un test qui les accompagne aussitôt.",
  theory: `
<h3>1. La classe du domaine</h3>
<p>Une <strong>classe</strong> est un moule qui décrit à quoi ressemble un type d'objet : quelles informations il contient (ses <strong>champs</strong>, ou attributs) et ce qu'il sait faire (ses <strong>méthodes</strong>, ou fonctions). Ici, la classe <code>Jeu</code> est le moule à partir duquel on fabrique chaque jeu du catalogue. Une <strong>chaîne de caractères</strong> (<code>std::string</code>) est simplement du texte.</p>
<pre class="pseudo">class Jeu {                              // DEFINIR une classe "Jeu" : le moule d'un objet Jeu
    int id_;                             // champ prive : l'identifiant du jeu (entier)
    std::string nom_;                    // champ prive : le nom (chaine de caracteres)
    double prixLocation_, prixAchat_;    // champs prives : les deux prix (nombres a virgule)
    int stockLocation_, stockVente_;     // champs prives : les deux stocks (entiers)
public:                                  // a partir d'ici : ce qui est accessible de l'exterieur
    Jeu(int id, std::string nom, double pl, double pa, int sl, int sv)   // CONSTRUCTEUR : recoit les valeurs de depart
      : id_(id), nom_(std::move(nom)), prixLocation_(pl), prixAchat_(pa),// liste d'initialisation : remplir chaque champ
        stockLocation_(sl), stockVente_(sv) {}                           // (suite) ; le corps {} est vide, tout est deja fait
    int id() const { return id_; }                     // getter : renvoie l'id sans modifier l'objet (const)
    const std::string&amp; nom() const { return nom_; }    // getter du nom, en reference const (aucune copie)
    bool disponibleLocation() const { return stockLocation_ &gt; 0; } // regle : vrai si au moins 1 exemplaire louable
};                                       // fin de la classe (le point-virgule est obligatoire)</pre>
<p>Les champs se terminent ici par un tiret bas (<code>id_</code>) par convention, pour les distinguer d'un coup d'œil. Ils sont <strong>privés</strong> : accessibles seulement depuis l'intérieur de la classe — c'est l'<strong>encapsulation</strong>, qui protège les données comme le coffre d'une machine cache ses rouages. Après <code>public:</code> viennent les éléments visibles de l'extérieur. Le <strong>constructeur</strong> (la méthode qui porte le nom de la classe) fabrique un objet cohérent en une fois ; la <strong>liste d'initialisation</strong> (après les <code>:</code>) remplit chaque champ. <code>std::move(nom)</code> <em>déplace</em> le texte au lieu de le recopier (plus rapide). Un <strong>getter</strong> est une petite méthode qui donne accès en lecture à un champ ; le mot <code>const</code> promet qu'elle ne modifie pas l'objet. <code>disponibleLocation</code> porte déjà une petite règle métier. L'objet est cohérent dès sa construction.</p>

<h3>2. Le DAO : mapper un ResultSet</h3>
<p>Quand on interroge la base, MySQL renvoie un <strong>ResultSet</strong> : un tableau de résultats que l'on parcourt ligne par ligne. Le symbole <code>r-&gt;</code> (flèche) sert à lire une information à travers un <strong>pointeur</strong> <code>r</code> — un pointeur étant une adresse qui « désigne » un objet, comme un post-it indiquant où le trouver. <strong>Mapper</strong> (« faire correspondre »), c'est transformer une ligne brute de la base en objet du domaine.</p>
<pre class="pseudo">Jeu JeuRepository::mapper(sql::ResultSet* r) {         // fonction : transforme une ligne SQL (pointee par r) en objet Jeu
    return Jeu(r-&gt;getInt("id"), r-&gt;getString("nom"),   // construire un Jeu : lire les colonnes id et nom...
               r-&gt;getDouble("prix_location"), r-&gt;getDouble("prix_achat"), // ...puis les deux prix...
               r-&gt;getInt("stock_location"), r-&gt;getInt("stock_vente")); // ...puis les deux stocks, dans l'ordre du constructeur
}                                                     // fin de la fonction</pre>
<p>Le <strong>DAO</strong> (Data Access Object, « objet d'accès aux données ») traduit une ligne SQL en objet du domaine. <code>getInt</code>, <code>getString</code>, <code>getDouble</code> lisent une colonne dans le type voulu (entier, texte, nombre à virgule). C'est le <strong>seul</strong> endroit du programme qui connaît les noms de colonnes : tout le reste du code manipule des <code>Jeu</code>, jamais des <code>ResultSet</code>. Cela <em>découple</em> le métier de la base.</p>

<h3>3. Le test naît avec le code</h3>
<p>Un <strong>test automatisé</strong> est un petit programme qui vérifie qu'une partie du code se comporte comme prévu. On utilise <strong>GoogleTest</strong>, une bibliothèque dédiée : <code>TEST(Groupe, Nom)</code> déclare un test, et <code>EXPECT_TRUE</code> / <code>EXPECT_FALSE</code> affirment qu'un résultat doit être vrai ou faux (sinon le test échoue).</p>
<pre class="pseudo">TEST(Jeu, Disponibilite) {                        // declarer un test nomme "Disponibilite", groupe "Jeu"
    Jeu dispo(1, "A", 2, 20, /*stockLoc*/ 1, 0);  // un jeu avec 1 en stock de location -> devrait etre disponible
    Jeu vide (2, "B", 2, 20, /*stockLoc*/ 0, 0);  // un jeu avec 0 en stock de location -> devrait etre indisponible
    EXPECT_TRUE (dispo.disponibleLocation());     // on ATTEND vrai ; si c'est faux, le test rougit
    EXPECT_FALSE(vide.disponibleLocation());      // on ATTEND faux ; si c'est vrai, le test rougit
}                                                 // fin du test</pre>
<div class="tip">Le commentaire <code>/*stockLoc*/</code> (entre <code>/* */</code>, l'autre façon de commenter en C++) rappelle à quel argument correspond le nombre. Dès qu'une classe porte une règle, on écrit son test <strong>immédiatement</strong>, et il tourne en CI. Le test n'est pas une corvée finale : c'est un filet posé au moment même où la règle apparaît.</div>

<h3>4. Écrire pour être testable</h3>
<div class="warn">Une méthode <strong>pure</strong> (comme <code>disponibleLocation</code>) ne dépend ni de la base ni de l'écran : elle calcule seulement à partir de ses données, donc elle se teste en une ligne. Concevoir des méthodes pures pour les règles est un <strong>choix</strong> qui rend le code vérifiable. Le mapping du DAO, lui, se testera avec la base (leçon 11), car il a besoin d'une vraie connexion MySQL.</div>

<h3>5. Câbler les tests dans CMake et la CI</h3>
<p>Rappel : <strong>CMake</strong> décrit comment fabriquer le programme. On lui ajoute une deuxième cible : le programme de tests.</p>
<pre class="pseudo"># CMakeLists : cible de tests avec GoogleTest       # on ajoute la construction des tests
enable_testing()                                      # activer le systeme de tests de CMake
add_executable(tests tests/test_jeu.cpp src/Jeu.cpp)  # fabriquer un programme "tests" a partir de ces fichiers
target_link_libraries(tests PRIVATE GTest::gtest_main)# lui brancher la bibliotheque GoogleTest (qui fournit le main des tests)
add_test(NAME unit COMMAND tests)                     # enregistrer un test "unit" : lancer le programme tests
# CI : - run: ctest --test-dir build                  # dans la CI, la commande ctest execute tous les tests enregistres</pre>
<p><code>ctest</code> est l'outil de CMake qui lance les tests. La CI l'exécute désormais : un test rouge fait échouer le pipeline. Le modèle grandit toujours accompagné de ses vérifications.</p>
`,
  exercises: [
    { type: "qcm", q: "Les champs d'une classe du domaine sont…", opts: ["publics", "privés (encapsulation), accès par getters", "globaux", "absents"], a: 1, exp: "Encapsulation." },
    { type: "qcm", q: "Un getter const…", opts: ["modifie l'objet", "lit sans modifier (const)", "supprime l'objet", "fait du SQL"], a: 1, exp: "Lecture sûre." },
    { type: "qcm", q: "Le DAO sert à…", opts: ["afficher", "traduire une ligne SQL en objet du domaine", "déployer", "logger"], a: 1, exp: "Mapping." },
    { type: "qcm", q: "Qui connaît les noms de colonnes ?", opts: ["toute l'appli", "le DAO seulement", "l'UI", "les tests"], a: 1, exp: "Isolé dans le DAO." },
    { type: "qcm", q: "Quand écrit-on le test d'une règle ?", opts: ["à la fin du projet", "immédiatement, avec le code", "jamais", "au déploiement"], a: 1, exp: "Filet posé tôt." },
    { type: "qcm", q: "Une méthode pure…", opts: ["dépend de la base", "ne dépend ni de la base ni de l'écran (testable en 1 ligne)", "affiche", "fait du SQL"], a: 1, exp: "Facile à tester." },
    { type: "qcm", q: "disponibleLocation() est…", opts: ["une requête SQL", "une méthode pure (stock > 0)", "un getter d'écriture", "un DAO"], a: 1, exp: "Règle testable." },
    { type: "qcm", q: "Le mapping DAO se testera…", opts: ["jamais", "avec la base (test d'intégration, leçon 11)", "sans rien", "en prod"], a: 1, exp: "Nécessite MySQL." },
    { type: "qcm", q: "add_test / ctest servent à…", opts: ["compiler", "enregistrer et lancer les tests", "déployer", "logger"], a: 1, exp: "Tests automatisés." },
    { type: "qcm", q: "Un test rouge en CI…", opts: ["est ignoré", "fait échouer le pipeline", "déploie quand même", "compile"], a: 1, exp: "Bloquant." },
    { type: "vf", q: "Concevoir des méthodes pures est un choix qui rend les règles vérifiables.", a: true, exp: "Testabilité par conception." },
    { type: "qcm", q: "std::move(nom) dans le constructeur…", opts: ["copie le nom", "déplace la chaîne (évite une copie)", "efface le nom", "logge"], a: 1, exp: "Efficacité." },
    { type: "qcm", q: "Le reste du code manipule…", opts: ["des ResultSet", "des objets Jeu", "des colonnes brutes", "du YAML"], a: 1, exp: "Objets du domaine." },
    { type: "qcm", q: "GTest::gtest_main fournit…", opts: ["MySQL", "le point d'entrée des tests GoogleTest", "Docker", "le linter"], a: 1, exp: "Runner de tests." },
    { type: "qcm", q: "L'objet est cohérent…", opts: ["après plusieurs setters", "dès sa construction (constructeur complet)", "jamais", "en base"], a: 1, exp: "Invariant à la création." }
  ],
  final: {
    title: "Exercice final — Une classe et son test",
    intro: `<p>On ajoute au domaine une classe <code>Categorie</code> avec un id et un nom, et une méthode <code>estValide()</code> (nom non vide).</p>`,
    questions: [
      { type: "qcm", q: "Les champs id/nom sont…", opts: ["publics", "privés, avec getters const", "globaux", "statiques"], a: 1, exp: "Encapsulation." },
      { type: "qcm", q: "estValide() est…", opts: ["une requête SQL", "une méthode pure (nom non vide)", "un setter", "un DAO"], a: 1, exp: "Testable directement." },
      { type: "qcm", q: "Le test vérifie…", opts: ["la base", "un nom vide → false, un nom rempli → true", "le déploiement", "les logs"], a: 1, exp: "Deux cas." },
      { type: "qcm", q: "Quand écrit-on ce test ?", opts: ["plus tard", "en même temps que la classe", "jamais", "en prod"], a: 1, exp: "Ensemble." },
      { type: "qcm", q: "Ce test tourne…", opts: ["en prod", "en CI à chaque push", "manuellement une fois", "jamais"], a: 1, exp: "Automatisé." }
    ],
    solution: `<pre class="pseudo">class Categorie {                        // classe du domaine : une categorie de jeux
    int id_;                             // champ prive : identifiant
    std::string nom_;                    // champ prive : nom de la categorie
public:                                  // partie accessible de l'exterieur
    Categorie(int id, std::string nom) : id_(id), nom_(std::move(nom)) {} // constructeur : remplit id_ et nom_
    int id() const { return id_; }                  // getter const de l'id
    const std::string&amp; nom() const { return nom_; } // getter const du nom (reference, sans copie)
    bool estValide() const { return !nom_.empty(); }   // regle pure : valide si le nom n'est PAS vide (! = non, empty = vide)
};                                       // fin de la classe
TEST(Categorie, Validite) {                          // test de la regle estValide
    EXPECT_FALSE(Categorie(1, "").estValide());      // nom vide -> on attend faux
    EXPECT_TRUE (Categorie(2, "Famille").estValide()); // nom rempli -> on attend vrai
}                                        // fin du test</pre>
<p>La classe encapsule ses données ; sa règle pure est testée dès l'écriture, en CI. Demain : la couche service et les règles métier, sous CI.</p>
`
  }
};
