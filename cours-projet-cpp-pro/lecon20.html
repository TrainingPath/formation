<script>
var DAY = {
  num: 20,
  title: "Observabilité, sauvegardes, RGPD et rollback",
  subtitle: "Ce qui distingue « ça tourne » d'« exploitable » : voir, sauvegarder, se conformer, revenir en arrière.",
  theory: `
<h3>1. Observabilité : logs, métriques, santé</h3>
<p>L'<strong>observabilité</strong>, c'est la capacité de voir ce qui se passe à l'intérieur d'une application en marche, sans avoir à deviner. Elle repose sur trois piliers. Les <strong>logs</strong> (journaux) sont des messages datés que le programme écrit pour raconter ses actions ; <em>structurés</em> signifie rangés avec un niveau (Info, Error…) et un horodatage, afin d'être filtrables. Les <strong>métriques</strong> sont des mesures chiffrées (nombre d'opérations, taux d'erreurs). L'<strong>endpoint de santé</strong> est une adresse dédiée qui répond « je vais bien ». Les logs ne contiennent <strong>jamais</strong> de secret ni de donnée personnelle inutile.</p>
<pre class="pseudo">log(Info,  "location_creee user=42 jeu=7");     // journaliser un EVENEMENT (aucun secret, juste des identifiants)
log(Error, "db_indisponible tentative=3");      // journaliser une ERREUR, utile au diagnostic</pre>

<h3>2. Sauvegardes : et surtout, restauration</h3>
<div class="warn">Une sauvegarde régulière (avec <code>mysqldump</code>, l'outil qui exporte le contenu d'une base MySQL dans un fichier ; planifiée et stockée chiffrée) ne vaut que si l'on a <strong>testé la restauration</strong> (l'opération inverse : recharger la sauvegarde dans une base). Une sauvegarde jamais restaurée peut être corrompue sans qu'on le sache. La règle : « une sauvegarde non testée n'existe pas ».</div>
<pre class="pseudo">0 3 * * *  mysqldump ludotheque | chiffrer &gt; backup-$(date).sql.enc   # chaque nuit a 3h (planif "cron") : exporter la base, la chiffrer, l'enregistrer datee
# periodiquement : restaurer sur une base de test et verifier l'integrite    # RE-CHARGER la sauvegarde ailleurs pour prouver qu'elle est bonne</pre>
<p>La première ligne est une tâche <strong>cron</strong> (un planificateur) : les cinq champs <code>0 3 * * *</code> décrivent le moment (ici tous les jours à 3h00 du matin). Le symbole <code>|</code> (« pipe ») envoie le résultat de la sauvegarde vers l'outil de chiffrement.</p>

<h3>3. RGPD : minimiser, protéger, effacer</h3>
<div class="tip">Le <strong>RGPD</strong> (Règlement Général sur la Protection des Données) est la loi européenne qui encadre le traitement des données personnelles. Il impose : la <strong>minimisation</strong> (ne stocker que le nécessaire), la <strong>sécurité</strong> (chiffrement « au repos », c'est-à-dire des données stockées, et « en transit », pendant leur transport sur le réseau), le <strong>droit à l'effacement</strong> (supprimer ou anonymiser les données d'une personne sur demande) et la <strong>rétention limitée</strong> (ne pas conserver indéfiniment). La conformité se conçoit dès le schéma, pas après coup.</div>

<h3>4. Le rollback documenté</h3>
<p>Au-delà du rollback automatique (leçon 19), on <strong>documente</strong> la procédure : quelle commande lancer, quelle version viser, comment vérifier. En cas d'incident, on ne réfléchit pas dans l'urgence — on suit un plan écrit et testé. On prévoit aussi le rollback des <strong>migrations de base</strong> : une <strong>migration</strong> est un script qui fait évoluer la structure de la base, et une bonne migration possède toujours son inverse (de quoi défaire le changement).</p>

<h3>5. « Ça tourne » ≠ « exploitable »</h3>
<pre class="pseudo">Exploitable = observable + sauvegardé (et restaurable)
              + conforme (RGPD) + réversible (rollback documenté)</pre>
<p>Un logiciel qui démarre n'est pas encore un service. L'<strong>exploitabilité</strong> — voir, récupérer, se conformer, revenir en arrière — est ce qui permet de le faire vivre en production dans la durée. C'est l'aboutissement du projet pro.</p>
`,
  exercises: [
    { type: "qcm", q: "Une application observable a…", opts: ["aucun log", "logs structurés, métriques, endpoint de santé", "seulement l'UI", "des secrets visibles"], a: 1, exp: "On voit ce qui se passe." },
    { type: "qcm", q: "Les logs contiennent…", opts: ["des secrets", "des événements, jamais de secret ni de donnée perso inutile", "des mots de passe", "des hash"], a: 1, exp: "Traçable, pas indiscret." },
    { type: "qcm", q: "Une sauvegarde ne vaut que si…", opts: ["elle est grosse", "on a testé la restauration", "elle est en clair", "elle est quotidienne seulement"], a: 1, exp: "Restauration vérifiée." },
    { type: "qcm", q: "« Une sauvegarde non testée… »", opts: ["est suffisante", "n'existe pas", "est chiffrée", "est rapide"], a: 1, exp: "Peut être corrompue." },
    { type: "qcm", q: "Les sauvegardes sont stockées…", opts: ["en clair public", "chiffrées", "dans le code", "dans les logs"], a: 1, exp: "Protection des données." },
    { type: "qcm", q: "La minimisation RGPD :", opts: ["tout stocker", "ne stocker que le nécessaire", "garder à vie", "logger les personnes"], a: 1, exp: "Moins de données." },
    { type: "qcm", q: "Le droit à l'effacement impose…", opts: ["de tout garder", "de supprimer/anonymiser les données d'une personne sur demande", "de chiffrer seulement", "rien"], a: 1, exp: "RGPD." },
    { type: "qcm", q: "La conformité RGPD se conçoit…", opts: ["après le projet", "dès le schéma", "jamais", "en prod seulement"], a: 1, exp: "Par conception." },
    { type: "qcm", q: "Un rollback documenté sert à…", opts: ["improviser", "suivre un plan écrit et testé en incident", "supprimer la base", "logger"], a: 1, exp: "Pas d'improvisation." },
    { type: "qcm", q: "Une migration de base devrait avoir…", opts: ["rien", "son inverse (pour revenir en arrière)", "un secret", "un log seul"], a: 1, exp: "Réversibilité." },
    { type: "vf", q: "Un logiciel qui démarre est déjà exploitable en production.", a: false, exp: "Faux : il faut observabilité, sauvegardes, conformité, rollback." },
    { type: "qcm", q: "La rétention limitée signifie…", opts: ["garder indéfiniment", "ne pas conserver les données plus que nécessaire", "tout supprimer aussitôt", "chiffrer seulement"], a: 1, exp: "RGPD." },
    { type: "qcm", q: "Un endpoint de santé indique…", opts: ["les secrets", "que l'app répond et fonctionne", "le code source", "les logs bruts"], a: 1, exp: "État du service." },
    { type: "qcm", q: "Le chiffrement RGPD s'applique…", opts: ["nulle part", "au repos et en transit", "aux logs seulement", "à l'UI"], a: 1, exp: "Protection." },
    { type: "qcm", q: "Exploitable = observable + sauvegardé +…", opts: ["rapide + joli", "conforme (RGPD) + réversible (rollback)", "gros + complexe", "root + latest"], a: 1, exp: "Aboutissement pro." }
  ],
  final: {
    title: "Exercice final — Rendre un service exploitable",
    intro: `<p>Une équipe déploie son appli, qui « tourne ». On lui demande : est-elle exploitable ?</p>`,
    questions: [
      { type: "qcm", q: "Manque n°1 :", opts: ["rien", "observabilité (logs structurés, santé, métriques)", "plus de code", "un secret"], a: 1, exp: "Voir ce qui se passe." },
      { type: "qcm", q: "Manque n°2 :", opts: ["rien", "sauvegardes testées (restauration vérifiée)", "un log de plus", "un thread"], a: 1, exp: "Récupération." },
      { type: "qcm", q: "Manque n°3 :", opts: ["rien", "conformité RGPD (minimisation, effacement, chiffrement)", "un déploiement", "un scan"], a: 1, exp: "Légal et éthique." },
      { type: "qcm", q: "Manque n°4 :", opts: ["rien", "rollback documenté (et migrations réversibles)", "root", "latest"], a: 1, exp: "Revenir en arrière." },
      { type: "qcm", q: "Conclusion :", opts: ["« ça tourne » suffit", "exploitable = observable + sauvegardé + conforme + réversible", "il manque juste des fonctions", "rien à faire"], a: 1, exp: "Vivre en production." }
    ],
    solution: `<pre class="pseudo"># Observabilité : logs structurés (sans secret) + /health + métriques
# Sauvegardes : mysqldump planifié + stockage chiffré + TEST de restauration
# RGPD :
#   - minimisation (ne stocker que le nécessaire)
#   - chiffrement au repos et en transit ; rétention limitée
#   - droit à l'effacement : suppression / anonymisation sur demande
# Rollback : procédure écrite + version cible étiquetée + migrations réversibles
# => Exploitable = observable + sauvegardé (restaurable) + conforme + réversible</pre>
<p>Un service ne se résume pas à un binaire qui démarre : il se voit, se sauvegarde, se conforme et se répare. Demain : le récapitulatif — le projet professionnel de bout en bout.</p>`
  }
};
</script>
