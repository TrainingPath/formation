var DAY = {

  title: "L'image de production : multi-stage, non-root, scan",
  subtitle: "Fabriquer une image minimale : compiler dans une étape, ne livrer que le binaire, tourner sans privilèges.",
  theory: `
<h3>1. Le problème d'une image « tout-en-un »</h3>
<div class="warn">Rappel : une <strong>image</strong> est le modèle figé à partir duquel on crée un conteneur. Une image qui contient le compilateur, les sources et les outils de construction est <strong>énorme</strong> et expose une large <strong>surface d'attaque</strong> — l'ensemble des points par lesquels un attaquant pourrait entrer (chaque outil embarqué est une faille potentielle). En production, on ne veut que le strict nécessaire : le binaire et ses dépendances d'exécution.</div>

<h3>2. Le build multi-stage</h3>
<p>Un Dockerfile <strong>multi-stage</strong> (« à plusieurs étapes ») décrit deux images successives : la première compile, la seconde ne récupère que le résultat. Chaque étape s'ouvre par un <code>FROM</code> ; on nomme la première avec <code>AS build</code> pour pouvoir y puiser ensuite.</p>
<pre class="pseudo"># --- etape 1 : build (jetee a la fin) ---            # etape de fabrication, non conservee
FROM debian:stable AS build                           # base complete, nommee "build"
RUN apt-get update &amp;&amp; apt-get install -y g++ cmake libmysqlcppconn-dev # installer les outils de compilation
COPY . /src                                           # copier le code source dans l'image
RUN cmake -S /src -B /build -DCMAKE_BUILD_TYPE=Release &amp;&amp; cmake --build /build # compiler en mode Release (optimise)

# --- etape 2 : runtime (minimale) ---                # etape finale, celle qui sera livree
FROM debian:stable-slim                               # base "slim" (allegee) pour l'execution
RUN apt-get update &amp;&amp; apt-get install -y libmysqlcppconn7 &amp;&amp; useradd -m app # installer SEULEMENT la lib d'execution + creer l'utilisateur "app"
COPY --from=build /build/ludotheque /usr/local/bin/ludotheque # recuperer UNIQUEMENT le binaire depuis l'etape "build"
USER app                              # non-root : desormais on tourne sous l'utilisateur "app"
ENTRYPOINT ["ludotheque"]             # commande lancee au demarrage du conteneur</pre>
<p>La première étape compile ; la seconde ne <strong>copie que le binaire</strong> (<code>COPY --from=build</code> puise dans l'étape nommée). Le <strong>runtime</strong> (l'environnement d'exécution) n'embarque pas la chaîne de compilation : image plus petite, plus sûre. <code>Release</code> demande un binaire optimisé (par opposition à un binaire de débogage). <code>ENTRYPOINT</code> fixe la commande de lancement.</p>

<h3>3. Tourner en non-root</h3>
<div class="tip">Par défaut, un conteneur tourne en <code>root</code> (le super-utilisateur, qui a tous les droits) : si l'application est compromise, l'attaquant se retrouve root dans le conteneur. On crée donc un utilisateur dédié sans privilèges avec <code>useradd</code>, et l'on bascule dessus avec <code>USER app</code> : c'est le principe du <strong>moindre privilège</strong> (ne donner que les droits strictement nécessaires), qui limite les dégâts.</div>

<h3>4. Scanner l'image</h3>
<pre class="pseudo"># CI : chercher les vulnerabilites connues (CVE) dans l'image   # controle de securite avant livraison
trivy image ludotheque:latest --exit-code 1 --severity HIGH,CRITICAL # echouer (--exit-code 1) s'il trouve une faille grave</pre>
<p>Un <strong>scanner</strong> d'image (ici <strong>Trivy</strong>) compare les paquets contenus dans l'image à des bases de <strong>vulnérabilités connues</strong>, les <strong>CVE</strong> (<em>Common Vulnerabilities and Exposures</em> : des failles répertoriées publiquement, chacune avec un numéro). L'option <code>--severity HIGH,CRITICAL</code> ne retient que les failles graves ; <code>--exit-code 1</code> fait échouer la commande si l'une est trouvée. En CI, un CVE critique fait donc échouer le pipeline : on ne livre pas une image trouée.</p>

<h3>5. Épingler les versions</h3>
<div class="warn"><strong>Épingler</strong> une version, c'est fixer un numéro précis (<code>debian:stable-slim</code>, tags de bibliothèques) plutôt que l'étiquette mouvante <code>latest</code> (« la dernière »), qui peut changer sans prévenir. On obtient ainsi des builds reproductibles et des scans fiables. Reconstruire régulièrement l'image permet de récupérer les correctifs de sécurité récents.</div>
`,
  exercises: [
    { type: "qcm", q: "Une image « tout-en-un » (compilateur inclus) est…", opts: ["idéale", "grosse et à large surface d'attaque", "minimale", "sans risque"], a: 1, exp: "Trop d'outils = trop de failles." },

    { type: "qcm", q: "On épingle les versions plutôt que latest pour…", opts: ["la vitesse", "des builds reproductibles et des scans fiables", "un cache de build plus léger", "une image plus petite"], a: 1, exp: "Reproductibilité." },
    { type: "qcm", q: "Reconstruire régulièrement l'image permet…", opts: ["d'augmenter la surface d'attaque", "de récupérer les correctifs de sécurité", "de perdre le binaire", "de vider le cache de build"], a: 1, exp: "Patchs à jour." },
    { type: "qcm", q: "debian:stable-slim est…", opts: ["une image de build lourde", "une base runtime minimale", "un scanner de CVE", "un gestionnaire de paquets"], a: 1, exp: "Léger pour la prod." },
    { type: "vf", q: "Le multi-stage réduit la taille et la surface d'attaque de l'image finale.", a: true, exp: "On jette la chaîne de build." },
    { type: "qcm", q: "Si une app root est compromise, l'attaquant…", opts: ["est limité", "est root dans le conteneur", "reste confiné à /app", "perd tous ses droits"], a: 1, exp: "D'où non-root." },
    { type: "qcm", q: "Le CMAKE_BUILD_TYPE=Release produit…", opts: ["un binaire debug", "un binaire optimisé pour la prod", "un binaire avec symboles de debug", "une image Docker"], a: 1, exp: "Optimisé." },
    { type: "qcm", q: "L'étape build de l'image est…", opts: ["livrée en prod", "jetée (non embarquée dans le runtime)", "copiée telle quelle", "poussée au registre"], a: 1, exp: "Intermédiaire." },
    { type: "qcm", q: "Le principe appliqué au conteneur :", opts: ["tout permettre", "moindre privilège", "root partout", "aucune limite"], a: 1, exp: "Durcissement." }
  ],

    intro: `<p>Un Dockerfile de départ, non durci :</p>
<pre class="pseudo">FROM debian:stable                    # base complete (une seule etape)
RUN apt-get install -y g++ cmake libmysqlcppconn-dev # installe le compilateur ET les outils dans l'image finale

`,
    questions: [

      { type: "qcm", q: "Correction n°1 :", opts: ["ajouter des outils", "build multi-stage : ne copier que le binaire", "supprimer le binaire", "copier tout le système de fichiers"], a: 1, exp: "Runtime minimal." },
      { type: "qcm", q: "Défaut n°2 :", opts: ["aucun", "tourne en root", "utilise une image latest", "expose un port inutile"], a: 1, exp: "Pas de moindre privilège." },
      { type: "qcm", q: "Correction n°2 :", opts: ["exposer moins de ports", "useradd + USER app (non-root)", "root explicite", "chiffrer l'image"], a: 1, exp: "Durcissement." },
      { type: "qcm", q: "Ajout en CI :", opts: ["un job de lint seul", "un scan d'image (trivy) bloquant sur CVE critiques", "un déploiement direct", "un push en latest"], a: 1, exp: "Image sûre." }
    ],
    solution: `<pre class="pseudo">FROM debian:stable AS build                           # etape 1 : fabrication (nommee "build")
RUN apt-get update &amp;&amp; apt-get install -y g++ cmake libmysqlcppconn-dev # installer les outils de compilation
COPY . /src                                           # copier le code source
RUN cmake -S /src -B /build -DCMAKE_BUILD_TYPE=Release &amp;&amp; cmake --build /build # compiler en Release

FROM debian:stable-slim                               # etape 2 : image finale allegee (slim)
RUN apt-get update &amp;&amp; apt-get install -y libmysqlcppconn7 &amp;&amp; useradd -m app # lib d'execution + utilisateur "app"
COPY --from=build /build/ludotheque /usr/local/bin/ludotheque # copier UNIQUEMENT le binaire depuis l'etape build
USER app                              # non-root (moindre privilege)
ENTRYPOINT ["ludotheque"]             # commande de demarrage
# CI : - run: trivy image ludotheque:latest --exit-code 1 --severity HIGH,CRITICAL # scanner l'image (echoue sur CVE grave)</pre>
<p>Multi-stage (binaire seul), non-root, image scannée : une production minimale et durcie. Demain : le pipeline complet — build, test, scan, protection.</p>
`
  }
};
