<script>
var DAY = {

  title: "Git, branches et première CI (le pipeline dès le départ)",
  subtitle: "Un flux par branches et une intégration continue qui compile à chaque push.",
  theory: `
<h3>1. Un flux par branches</h3>
<p>Rappels : <strong>Git</strong> garde l'historique du code, et un <strong>commit</strong> est un instantané enregistré. <code>main</code> (« principale ») est la branche de référence, celle qui doit toujours fonctionner. Une <strong>branche</strong> est une copie de travail parallèle de l'historique : on y bricole une nouvelle fonctionnalité sans toucher à <code>main</code>, comme un brouillon à part avant de recopier au propre. On ne travaille donc jamais directement sur <code>main</code>.</p>
<p>Une <strong>pull request</strong> (PR, « demande de fusion ») est le moment où l'on propose officiellement d'intégrer sa branche dans <code>main</code>. Elle permet la <strong>revue</strong> (un collègue relit le code) et déclenche automatiquement la CI.</p>
<pre class="pseudo">git switch -c feature/catalogue      # CREER une branche nommee "feature/catalogue" et basculer dessus (-c = create)
# ... commits ...                     # (on enregistre ici son travail par petits commits)
git push -u origin feature/catalogue  # ENVOYER la branche vers le depot distant "origin" (-u = la relier pour la suite)
# ouvrir une PR vers main -> la CI s'execute  # sur GitHub, demander la fusion vers main : cela lance la CI</pre>
<p>Décortiquons. <code>git switch -c</code> crée une branche et s'y place (<em>switch</em> = « changer de branche », <code>-c</code> = <em>create</em>). <code>git push</code> (« pousser ») envoie les commits locaux vers <strong>origin</strong>, le nom habituel du dépôt distant hébergé sur un serveur (par exemple GitHub) ; l'option <code>-u</code> mémorise le lien pour que les prochains <code>push</code> se fassent sans tout retaper.</p>

<h3>2. La CI : GitHub Actions</h3>
<p><strong>GitHub Actions</strong> est le service de CI intégré à GitHub : un robot qui exécute des tâches automatiquement à chaque changement, selon une recette écrite dans un fichier YAML rangé sous <code>.github/workflows/</code>.</p>
<pre class="pseudo">name: CI                          # nom affiche du pipeline
on: [push, pull_request]          # QUAND le lancer : a chaque push ET a chaque pull request
jobs:                             # liste des travaux a executer
  build:                          # un job nomme "build" (compilation)
    runs-on: ubuntu-latest        # machine fournie par GitHub : la derniere version d'Ubuntu (Linux)
    steps:                        # etapes du job, dans l'ordre
      - uses: actions/checkout@v4 # 1) recuperer le code du depot dans la machine
      - run: cmake -S . -B build  # 2) configurer la compilation (preparer le dossier build)
      - run: cmake --build build  # 3) compiler ; le pipeline devient ROUGE si ca ne compile pas</pre>
<div class="tip">L'<strong>intégration continue</strong> (CI) exécute automatiquement des vérifications à chaque changement. Un <strong>job</strong> est un travail (ici « build ») effectué sur une machine neuve ; <code>runs-on</code> choisit cette machine ; les <strong>steps</strong> sont ses étapes ; <code>uses</code> réutilise une action toute prête (<code>checkout</code> récupère le code) et <code>run</code> lance une commande. Si quelqu'un casse la compilation, le pipeline vire au <strong>rouge</strong> immédiatement, avant toute fusion.</div>

<h3>3. Le pipeline dès la 3ᵉ leçon</h3>
<p>Un <strong>pipeline</strong> (« chaîne de montage ») est l'enchaînement automatique de ces vérifications. On l'installe <strong>maintenant</strong>, sur un squelette qui compile déjà. Ainsi, chaque brique ajoutée ensuite (modèle, DAO, services…) est vérifiée dès son arrivée. Une <strong>régression</strong> est un bug qui casse quelque chose qui fonctionnait auparavant ; ajouter la CI seulement à la fin obligerait à corriger des mois de régressions accumulées d'un coup.</p>

<h3>4. Des commits qui racontent</h3>
<div class="warn">Un commit = une intention claire, accompagnée d'un message utile (« ajoute le mapping Jeu », et non « fix »). Des petits commits cohérents rendent l'historique lisible et les revues faciles. On ne commite jamais de secret ni de fichier de build.</div>

<h3>5. La règle : main toujours vert</h3>
<p>La branche <code>main</code> doit rester <strong>déployable</strong> (installable en production) à tout instant : elle ne reçoit que du code qui compile — et bientôt qui passe les tests. La CI est le gardien de cette propriété. On enrichira le pipeline au fil des leçons avec des tests, du <strong>lint</strong> (un outil qui repère automatiquement les erreurs de style et les fautes probables dans le code) et du <strong>scan</strong> (une analyse de sécurité qui cherche des failles connues).</p>
`,
  exercises: [
    { type: "qcm", q: "On développe une évolution…", opts: ["sur main directement", "sur une branche, fusionnée par PR", "par commits poussés en force", "sur une copie locale non partagée"], a: 1, exp: "Flux par branches." },
    { type: "qcm", q: "Une pull request permet…", opts: ["de déployer directement en production", "la revue et déclenche la CI avant fusion", "de fusionner sans vérification", "de contourner la CI"], a: 1, exp: "Revue + CI." },
    { type: "qcm", q: "L'intégration continue…", opts: ["uniquement le soir en batch", "exécute des vérifications à chaque push/PR", "seulement à la création d'un tag", "déploie seule"], a: 1, exp: "Automatique." },
    { type: "qcm", q: "La première CI ici…", opts: ["déploie", "compile le projet (cmake build)", "publie l'image sur Docker Hub", "fusionne automatiquement la PR"], a: 1, exp: "Build automatique." },
    { type: "qcm", q: "Un pipeline « rouge » signifie…", opts: ["succès", "une vérification a échoué (ex. compilation cassée)", "les tests ont été ignorés", "déploiement fait"], a: 1, exp: "Échec visible." },
    { type: "qcm", q: "Pourquoi la CI dès le départ ?", opts: ["par obligation", "pour vérifier chaque brique dès son arrivée", "pour automatiser le déploiement", "pour remplacer la revue de code"], a: 1, exp: "Éviter d'accumuler des régressions." },
    { type: "qcm", q: "Un bon message de commit…", opts: ["« fix »", "décrit l'intention (« ajoute le mapping Jeu »)", "est vide", "contient le secret"], a: 1, exp: "Historique lisible." },
    { type: "qcm", q: "Que ne commite-t-on jamais ?", opts: ["le code", "les secrets et les fichiers de build", "les tests", "le README"], a: 1, exp: "Hygiène du dépôt." },
    { type: "qcm", q: "main doit rester…", opts: ["cassé", "toujours déployable (vert)", "figé sans nouveaux commits", "protégé sans historique"], a: 1, exp: "Propriété clé." },
    { type: "qcm", q: "on: [push, pull_request] déclenche la CI…", opts: ["au déploiement seulement", "à chaque push et chaque PR", "jamais", "manuellement"], a: 1, exp: "Sur tout changement." },
    { type: "vf", q: "Ajouter la CI à la fin du projet évite les régressions.", a: false, exp: "Faux : elles s'accumulent sans filet." },
    { type: "qcm", q: "actions/checkout@v4 sert à…", opts: ["compiler", "récupérer le code du dépôt dans le job", "déployer", "tester"], a: 1, exp: "Étape initiale." },
    { type: "qcm", q: "git switch -c feature/x …", opts: ["supprime x", "crée et bascule sur une branche", "fusionne", "push"], a: 1, exp: "Nouvelle branche." },
    { type: "qcm", q: "On enrichira le pipeline avec…", opts: ["rien de plus", "tests, lint, scan au fil des leçons", "moins d'étapes", "un déploiement manuel"], a: 1, exp: "Pipeline croissant." },
    { type: "qcm", q: "La CI est le gardien de…", opts: ["la vitesse", "la santé de main (compile/tests)", "l'UI", "la base"], a: 1, exp: "Qualité continue." }
  ],
  final: {
    title: "Exercice final — Un workflow CI minimal",
    intro: `<p>Tu veux qu'à chaque push le projet soit configuré puis compilé par CMake, sur Ubuntu.</p>`,
    questions: [
      { type: "qcm", q: "Le déclencheur :", opts: ["on: [push, pull_request]", "on: schedule (cron nocturne)", "on: deploy", "on: release"], a: 0, exp: "Sur chaque changement." },
      { type: "qcm", q: "La première étape :", opts: ["compiler", "actions/checkout (récupérer le code)", "déployer", "logger"], a: 1, exp: "Récupérer les sources." },
      { type: "qcm", q: "Configurer le build :", opts: ["cmake -S . -B build", "make deploy", "git push", "trivy"], a: 0, exp: "Génération." },
      { type: "qcm", q: "Compiler :", opts: ["cmake --build build", "cmake -S", "docker down", "make install"], a: 0, exp: "Construction." },
      { type: "qcm", q: "Si la compilation échoue, la CI…", opts: ["reste verte", "devient rouge et bloque la PR", "déploie", "ignore"], a: 1, exp: "Filet de sécurité." }
    ],
    solution: `<pre class="pseudo">name: CI                          # nom du pipeline
on: [push, pull_request]          # se declenche a chaque push et chaque pull request
jobs:                             # liste des travaux
  build:                          # job de compilation
    runs-on: ubuntu-latest        # sur une machine Ubuntu fournie par GitHub
    steps:                        # etapes dans l'ordre
      - uses: actions/checkout@v4 # recuperer le code du depot
      - run: cmake -S . -B build  # configurer la compilation
      - run: cmake --build build  # compiler (rouge si erreur)</pre>
<p>À chaque push, le code est récupéré, configuré puis compilé. Le pipeline existe avant le métier ; on l'enrichira (tests, lint, scan). Demain : du MCD Merise au schéma SQL, dans le conteneur.</p>
`
  }
};
