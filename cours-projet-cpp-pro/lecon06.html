<script>
var DAY = {
  num: 6,
  title: "La couche service et les règles métier, sous CI",
  subtitle: "Centraliser les décisions dans des services purs — et les couvrir de tests exécutés en continu.",
  theory: `
<h3>1. Le service, cœur des décisions</h3>
<p>Rappel de l'architecture en couches : le <strong>DAO</strong> parle à la base, l'<strong>UI</strong> (interface utilisateur, c'est-à-dire l'écran) affiche, et entre les deux le <strong>service</strong> prend les décisions. Le service porte les <strong>règles métier</strong> — les règles propres à l'activité : calcul du tarif, disponibilité, refus d'une opération. Il ne fait ni SQL (c'est le DAO) ni affichage (c'est l'UI). Comme ses méthodes sont <strong>pures</strong> (elles calculent uniquement à partir de leurs arguments, sans toucher la base ni l'écran), elles se testent sans base, en une ligne — idéal pour la CI.</p>

<h3>2. Des méthodes statiques et pures</h3>
<p>Une méthode <strong>statique</strong> (<code>static</code>) appartient à la classe elle-même, et non à un objet précis : on l'appelle sans fabriquer d'objet, en écrivant <code>CatalogueService::tarif(...)</code> (les deux-points <code>::</code> signifient « appartenant à »). <code>const Jeu&amp; j</code> reçoit le jeu par <strong>référence constante</strong> : « référence » = on travaille sur l'original sans le recopier ; « const » = on promet de ne pas le modifier (lecture seule).</p>
<pre class="pseudo">class CatalogueService {                 // classe qui regroupe les regles du catalogue
public:                                  // tout ce qui suit est accessible de l'exterieur
    static bool peutLouer(const Jeu&amp; j) { return j.disponibleLocation(); } // decision : ce jeu est-il louable ?
    static double tarif(const Jeu&amp; j, int jours) {   // calcule le prix d'une location de "jours" jours
        double t = j.prixLocation() * jours;         // prix de base = prix par jour x nombre de jours
        if (jours &gt;= 3) t *= 0.9;                     // remise -10% des 3 jours (t = t x 0,9)
        return t;                                     // renvoyer le tarif final
    }                                                 // fin de la methode tarif
};                                       // fin de la classe (point-virgule obligatoire)</pre>

<h3>3. Couvrir les cas et les bords</h3>
<pre class="pseudo">TEST(CatalogueService, Remise) {                          // test de la regle de remise
    Jeu j(1, "A", /*prixLoc*/ 5, 30, 3, 0);               // un jeu a 5 par jour en location
    EXPECT_DOUBLE_EQ(CatalogueService::tarif(j, 2), 10.0);   // 2 jours : 5x2 = 10, PAS de remise (avant le seuil)
    EXPECT_DOUBLE_EQ(CatalogueService::tarif(j, 3), 13.5);   // 3 jours : 5x3=15 puis -10% = 13,5 (AU seuil)
    EXPECT_DOUBLE_EQ(CatalogueService::tarif(j, 5), 22.5);   // 5 jours : 5x5=25 puis -10% = 22,5 (apres le seuil)
}                                                         // fin du test</pre>
<div class="tip"><code>EXPECT_DOUBLE_EQ</code> compare deux nombres à virgule (des <code>double</code>) en tolérant les minuscules imprécisions du calcul. On teste <strong>avant, au, et après</strong> le seuil (une <strong>borne</strong> = une valeur limite) : les bornes sont les cas les plus fragiles. Un test par intention, avec un nom parlant, documente la règle autant qu'il la vérifie.</div>

<h3>4. La CI exécute les tests à chaque push</h3>
<pre class="pseudo"># .github/workflows/ci.yml                             # on ajoute une etape au pipeline
      - run: cmake -S . -B build                       # configurer la compilation
      - run: cmake --build build                       # compiler le projet ET les tests
      - run: ctest --test-dir build --output-on-failure # lancer les tests ; --output-on-failure affiche le detail des echecs</pre>
<div class="warn">Désormais, casser une règle métier (par exemple modifier la remise par erreur) fait <strong>rougir</strong> le pipeline. La CI n'est plus seulement un compilateur : c'est un gardien du comportement.</div>

<h3>5. Une seule source de vérité</h3>
<p>La règle de tarif existe <strong>une seule fois</strong>, dans le service : c'est une <strong>source unique de vérité</strong> (le principe « ne te répète pas »). L'UI et une future API l'appellent — elles ne la recopient jamais. Ainsi, un changement de politique tarifaire se fait à un seul endroit, et le test le protège partout.</p>
`,
  exercises: [
    { type: "qcm", q: "Le service contient…", opts: ["le SQL", "les règles métier (décisions)", "l'affichage", "la connexion à la base"], a: 1, exp: "Il décide." },
    { type: "qcm", q: "Les méthodes de service sont…", opts: ["impures", "pures et souvent statiques (testables sans base)", "dépendantes du ResultSet", "liées à l'affichage console"], a: 1, exp: "Testables." },
    { type: "qcm", q: "On teste une règle à seuil…", opts: ["au hasard", "avant, au, et après le seuil", "seulement après", "jamais"], a: 1, exp: "Les bords." },
    { type: "qcm", q: "EXPECT_DOUBLE_EQ compare…", opts: ["des entiers", "des réels attendus", "des chaînes", "des exceptions"], a: 1, exp: "Doubles." },
    { type: "qcm", q: "ctest dans la CI…", opts: ["compile", "exécute les tests à chaque push", "déploie", "publie les résultats"], a: 1, exp: "Tests continus." },
    { type: "qcm", q: "Casser la remise par erreur…", opts: ["passe inaperçu", "fait rougir le pipeline (test échoue)", "déploie", "compile"], a: 1, exp: "Filet." },
    { type: "qcm", q: "La règle de tarif existe…", opts: ["dans chaque couche", "une seule fois, dans le service", "dans l'UI et l'API", "nulle part"], a: 1, exp: "Source unique." },
    { type: "qcm", q: "peutLouer renvoie…", opts: ["un tarif", "true/false selon la disponibilité", "un Jeu", "void"], a: 1, exp: "Décision." },
    { type: "qcm", q: "Un nom de test parlant…", opts: ["est inutile", "documente la règle en plus de la vérifier", "ralentit", "cache un bug"], a: 1, exp: "Lisibilité." },
    { type: "qcm", q: "La CI est devenue…", opts: ["un simple compilateur", "un gardien du comportement (build + tests)", "un simple linter", "un déployeur seul"], a: 1, exp: "Non-régression." },
    { type: "vf", q: "L'UI recopie la formule de tarif pour aller plus vite.", a: false, exp: "Faux : elle appelle le service." },
    { type: "qcm", q: "tarif(j,3) avec prixLoc=5 et -10 % =", opts: ["15", "13.5", "5", "10"], a: 1, exp: "15 × 0.9." },
    { type: "qcm", q: "--output-on-failure sert à…", opts: ["cacher les erreurs", "afficher les détails des tests échoués", "relancer les tests échoués", "ignorer les tests lents"], a: 1, exp: "Diagnostic." },
    { type: "qcm", q: "Le service reçoit/renvoie plutôt…", opts: ["des ResultSet", "des objets et des décisions", "des requêtes SQL", "des lignes de résultat"], a: 1, exp: "Le domaine." },
    { type: "qcm", q: "Changer la politique tarifaire demande…", opts: ["de modifier partout", "de changer un seul endroit (le service)", "de casser les tests", "un redéploiement manuel du code copié"], a: 1, exp: "Une source de vérité." }
  ],
  final: {
    title: "Exercice final — Protéger une règle par un test",
    intro: `<p>On veut verrouiller <code>peutLouer</code> : disponible si <code>stock_location &gt; 0</code>, indisponible sinon.</p>`,
    questions: [
      { type: "qcm", q: "peutLouer(jeu avec stockLoc=0) doit valoir…", opts: ["true", "false", "1", "erreur"], a: 1, exp: "Plus de stock." },
      { type: "qcm", q: "peutLouer(jeu avec stockLoc=2) doit valoir…", opts: ["false", "true", "0", "erreur"], a: 1, exp: "Disponible." },
      { type: "qcm", q: "L'assertion pour un booléen vrai :", opts: ["EXPECT_DOUBLE_EQ", "EXPECT_TRUE", "EXPECT_THROW", "ASSERT_EQ 0"], a: 1, exp: "Vrai." },
      { type: "qcm", q: "Ce test tourne…", opts: ["contre la base", "sans base (méthode pure), en CI", "en prod", "manuellement"], a: 1, exp: "Rapide." },
      { type: "qcm", q: "On teste aussi le bord (stock = 0) car…", opts: ["inutile", "les bornes sont les plus fragiles", "cela couvre tous les cas", "le compilateur l'exige"], a: 1, exp: "Cas limite." }
    ],
    solution: `<pre class="pseudo">static bool peutLouer(const Jeu&amp; j) { return j.disponibleLocation(); } // regle : louable si un exemplaire est dispo

TEST(CatalogueService, PeutLouer) {                      // test de la regle peutLouer
    Jeu dispo(1, "A", 2, 20, /*stockLoc*/ 2, 0);         // jeu avec 2 en stock de location
    Jeu vide (2, "B", 2, 20, /*stockLoc*/ 0, 0);         // jeu avec 0 en stock de location
    EXPECT_TRUE (CatalogueService::peutLouer(dispo));    // stock > 0 -> on attend vrai
    EXPECT_FALSE(CatalogueService::peutLouer(vide));     // bord : stock nul -> on attend faux
}                                                        // fin du test</pre>
<p>La règle est isolée dans le service et verrouillée par un test qui couvre les deux issues, exécuté en CI. Demain : requêtes préparées et le job de tests au vert.</p>
`
  }
};
</script>
