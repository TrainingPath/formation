  theory: `
<h3>1. Valider au plus tôt</h3>
<p><strong>Valider</strong> une donnée, c'est vérifier qu'elle est acceptable avant de s'en servir (comme un videur qui contrôle à l'entrée). Toute donnée qui entre dans le domaine est <strong>validée dès la frontière</strong> — ici la couche service, le premier point d'entrée du métier — avant tout accès à la base. Une durée hors bornes, une quantité négative : on refuse immédiatement, en lançant une <strong>exception typée</strong> (un signal d'erreur d'un type précis).</p>

<h3>2. Des exceptions métier dédiées</h3>
<p>Une <strong>exception</strong> est un objet lancé (mot-clé <code>throw</code>, « lancer ») pour signaler un problème ; il interrompt le déroulement normal jusqu'à ce qu'un bloc <code>catch</code> (« attraper ») le rattrape. On crée nos propres types d'exceptions en les faisant <strong>hériter</strong> de <code>std::runtime_error</code> — « hériter » signifiant réutiliser tout ce que fait une classe existante en la spécialisant, comme un modèle de voiture dérivé d'un modèle de base.</p>
<pre class="pseudo">#include &lt;stdexcept&gt;                                // apporte std::runtime_error (exceptions standard)
class SaisieInvalide   : public std::runtime_error {   // notre exception "saisie invalide", derivee de runtime_error
    using std::runtime_error::runtime_error; };        // reutiliser le constructeur du parent (qui prend un message texte)
class StockInsuffisant : public std::runtime_error {   // exception "stock insuffisant"
    using std::runtime_error::runtime_error; };        // meme constructeur herite
class AccesRefuse      : public std::runtime_error {   // exception "acces refuse" (droits insuffisants)
    using std::runtime_error::runtime_error; };        // meme constructeur herite</pre>
<p>Chaque cause d'échec a sa propre classe : l'UI peut réagir précisément (<code>catch (const StockInsuffisant&amp;)</code> n'attrape que ce type) ou globalement (<code>catch (const std::exception&amp;)</code> attrape n'importe quelle exception standard). La ligne <code>using ...::runtime_error;</code> hérite du constructeur du parent, qui accepte un message décrivant l'erreur.</p>

<h3>3. Valider en lançant</h3>
<pre class="pseudo">void validerDuree(int jours) {                    // verifie qu'une duree de location est acceptable
    if (jours &lt; 1 || jours &gt; 30)                   // SI moins de 1 jour OU plus de 30 jours (|| = OU)...
        throw SaisieInvalide("La duree doit etre entre 1 et 30 jours"); // ...refuser en lancant l'exception
}                                                 // si tout va bien, la fonction se termine sans rien lancer
void validerQuantite(int q) {                     // verifie qu'une quantite est acceptable
    if (q &lt;= 0) throw SaisieInvalide("Quantite invalide"); // 0 ou negatif : refuser
}                                                 // sinon : quantite valide, on continue</pre>

<h3>4. Tester le comportement d'erreur</h3>
<pre class="pseudo">TEST(Validation, Duree) {                          // test des bornes de validerDuree
    EXPECT_THROW(validerDuree(0),  SaisieInvalide);   // 0 jour : on ATTEND l'exception (borne basse)
    EXPECT_THROW(validerDuree(31), SaisieInvalide);   // 31 jours : on ATTEND l'exception (borne haute)
    EXPECT_NO_THROW(validerDuree(1));                 // 1 jour : limite VALIDE, aucune exception attendue
    EXPECT_NO_THROW(validerDuree(30));                // 30 jours : autre limite valide
}                                                 // fin du test</pre>
<div class="tip">Le comportement d'erreur fait partie du <strong>contrat</strong> de la fonction : <code>EXPECT_THROW</code> exige qu'une exception soit lancée, <code>EXPECT_NO_THROW</code> exige qu'il n'y en ait <strong>aucune</strong> pour une entrée valide, bornes comprises. Ces tests tournent en CI.</div>

<h3>5. Entrées sûres, par le langage</h3>
<div class="warn">En C++, <code>std::string</code> (texte de taille automatique) et les flux typés éliminent les <strong>débordements de tampon</strong> classiques du langage C — un <em>tampon</em> étant une zone mémoire de taille fixe, qu'on faisait « déborder » avec des fonctions dangereuses comme <code>gets</code> ou <code>strcpy</code>, ce qui ouvrait la porte à des attaques. On valide néanmoins toujours le <em>contenu</em> (bornes, format) : la sûreté mémoire offerte par le langage ne remplace pas la validation métier.</div>
`,

<pre class="pseudo">void louer(sql::Connection&amp; con, int uid, int jeuId, int jours) {  // loue le jeu jeuId a l'utilisateur uid pour "jours" jours
    LocationRepository::inserer(con, uid, jeuId, jours);   // insere direct en base : "jours" n'est JAMAIS valide (danger)

`,

    ],
    solution: `<pre class="pseudo">void LocationService::louer(sql::Connection&amp; con, int uid, int jeuId, int jours) { // version securisee
    validerDuree(jours);                          // 1) refuser (SaisieInvalide) si la duree est hors [1,30]

        throw StockInsuffisant("Plus de stock de location"); // sinon refuser avec l'exception dediee
    // ... suite sous transaction (lecon 11) ...  // l'ecriture reelle sera protegee par une transaction
    LocationRepository::inserer(con, uid, jeuId, jours);     // 4) tout est valide : enregistrer la location
}                                                 // fin de la methode
// TEST : EXPECT_THROW(validerDuree(0), SaisieInvalide);     // exemple de test du contrat d'erreur</pre>
<p>On valide la durée, on vérifie le stock, on lance des exceptions typées testées. Demain : utilisateurs, rôles et authentification durcie.</p>
`
  }
