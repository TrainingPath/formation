<script>
var DAY = {
  num: 15,
  title: "Recherche, pagination et qualité (lint, sanitizers)",
  subtitle: "Une recherche sûre et paginée, et des outils qui traquent bugs et défauts automatiquement.",
  theory: `
<h3>1. Recherche paginée, valeurs liées</h3>
<p>Rechercher, c'est retrouver les jeux dont le nom contient un mot-clé. <strong>Paginer</strong>, c'est découper les résultats en pages (comme un livre) pour ne pas tout afficher d'un coup.</p>
<pre class="pseudo">"SELECT * FROM jeu WHERE nom LIKE ? ORDER BY nom LIMIT ? OFFSET ?" // chercher par nom, trier, ne prendre qu'une page
p-&gt;setString(1, "%" + motCle + "%");     // 1er ? : le motif de recherche (% = "n'importe quoi autour du mot-cle")
p-&gt;setInt(2, taille);                     // 2e ? : LIMIT = nombre de resultats par page
p-&gt;setInt(3, (page - 1) * taille);        // 3e ? : OFFSET = combien de resultats sauter avant la page voulue</pre>
<p><code>LIKE</code> compare un texte à un <strong>motif</strong> ; le caractère <code>%</code> y remplace « n'importe quelle suite de caractères » (un <em>joker</em>). Le motif <code>%...%</code> est placé dans la valeur liée (anti-injection). <code>ORDER BY nom</code> impose un <strong>ordre stable</strong> (sinon deux pages pourraient se chevaucher). <code>LIMIT</code> limite le nombre de lignes renvoyées, <code>OFFSET</code> indique combien en sauter : ensemble, ils ne rapatrient qu'une seule page. Exemple : page 3 avec 10 par page → OFFSET = (3−1)×10 = 20.</p>

<h3>2. Le linter : détecter les défauts</h3>
<pre class="pseudo"># clang-tidy / cppcheck : analyse statique du code   # des outils qui LISENT le code sans l'executer
clang-tidy src/*.cpp -- -std=c++17                    # analyser tous les .cpp du dossier src (norme C++17)</pre>
<p>Un <strong>linter</strong> est un outil qui lit le code <strong>sans l'exécuter</strong> (on parle d'<strong>analyse statique</strong>, « statique » = à l'arrêt) et signale les défauts probables : variable non initialisée, conversion douteuse, ressource oubliée, mauvaise pratique. <code>clang-tidy</code> et <code>cppcheck</code> en sont deux exemples. On le branche dans la CI.</p>

<h3>3. Les sanitizers : traquer à l'exécution</h3>
<pre class="pseudo">cmake -B build -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined" # compiler en activant les detecteurs (sanitizers)
ctest --test-dir build           # lancer les tests, desormais surveilles par les sanitizers</pre>
<div class="warn">Un <strong>sanitizer</strong> est un « détecteur » ajouté au programme pendant la compilation, qui surveille son exécution. <strong>AddressSanitizer</strong> (ASan) détecte les accès mémoire invalides (débordements ; ou <em>use-after-free</em>, c'est-à-dire l'utilisation d'une zone mémoire déjà libérée). <strong>UBSan</strong> attrape les <strong>comportements indéfinis</strong> — des situations que le langage n'autorise pas et dont le résultat devient imprévisible : débordement d'entier, déréférencement d'un pointeur nul. Exécuter les tests sous sanitizers révèle des bugs qu'aucune relecture ne verrait.</div>

<h3>4. Lint + sanitizers = deux filets complémentaires</h3>
<div class="tip">Le linter analyse <strong>statiquement</strong> (sans exécuter) ; les sanitizers analysent <strong>dynamiquement</strong> (pendant l'exécution des tests). L'un peut repérer un problème dans du code jamais exécuté, l'autre voit des bugs qui n'apparaissent qu'au moment où le programme tourne (le <em>runtime</em>). Les deux, en CI, se complètent.</div>

<h3>5. Qualité automatisée, pas optionnelle</h3>
<pre class="pseudo"># CI : des jobs dedies                                 # on ajoute deux travaux au pipeline
  lint:       clang-tidy ...                            # 1er job : analyse statique du code
  test-asan:  build -fsanitize=address,undefined ; ctest # 2e job : compiler avec sanitizers puis lancer les tests</pre>
<p>Un défaut détecté par le linter ou un sanitizer <strong>rougit</strong> le pipeline. La qualité n'est plus une intention : c'est une porte que le code doit franchir à chaque push.</p>
`,
  exercises: [
    { type: "qcm", q: "Le motif de recherche %...% se met…", opts: ["dans le SQL concaténé", "dans la valeur liée (setString)", "dans le nom de la colonne", "dans la clause ORDER BY"], a: 1, exp: "Anti-injection." },
    { type: "qcm", q: "ORDER BY avant pagination sert à…", opts: ["éviter les doublons entre pages", "garantir un ordre stable (pages cohérentes)", "accélérer", "créer un index unique"], a: 1, exp: "Cohérence." },
    { type: "qcm", q: "LIMIT/OFFSET servent à…", opts: ["trier", "ne charger qu'une page", "filtrer par rôle", "supprimer"], a: 1, exp: "Pagination." },
    { type: "qcm", q: "Un linter…", opts: ["exécute le code", "analyse le code statiquement (sans l'exécuter)", "déploie", "compile en release"], a: 1, exp: "Analyse statique." },
    { type: "qcm", q: "clang-tidy/cppcheck détectent…", opts: ["la vitesse", "des défauts probables (variable non init, etc.)", "les secrets", "les erreurs mémoire à l'exécution"], a: 1, exp: "Défauts de code." },
    { type: "qcm", q: "AddressSanitizer détecte…", opts: ["les data races entre threads", "les accès mémoire invalides (débordements, use-after-free)", "les comportements arithmétiques indéfinis", "les secrets"], a: 1, exp: "Erreurs mémoire." },
    { type: "qcm", q: "UBSan attrape…", opts: ["les injections SQL", "les comportements indéfinis (overflow, null deref)", "les fuites mémoire non libérées", "les dépassements de tampon"], a: 1, exp: "Undefined behavior." },
    { type: "qcm", q: "Les sanitizers analysent…", opts: ["statiquement", "dynamiquement (à l'exécution des tests)", "à l'édition des liens", "seulement les en-têtes"], a: 1, exp: "Runtime." },
    { type: "qcm", q: "Lint et sanitizers sont…", opts: ["redondants", "complémentaires (statique + dynamique)", "identiques", "inutiles"], a: 1, exp: "Deux filets." },
    { type: "qcm", q: "Un défaut détecté en CI…", opts: ["est ignoré", "rougit le pipeline", "déploie quand même", "déclenche un rollback"], a: 1, exp: "Porte de qualité." },
    { type: "vf", q: "Un linter peut signaler un problème dans du code jamais exécuté par les tests.", a: true, exp: "Analyse statique." },
    { type: "qcm", q: "-fsanitize=address,undefined s'active…", opts: ["au déploiement", "à la compilation (options), pour les tests", "à l'édition des liens seulement", "au démarrage du conteneur"], a: 1, exp: "Instrumentation." },
    { type: "qcm", q: "Un mot-clé avec une apostrophe, lié, est…", opts: ["dangereux", "sans danger (donnée liée)", "rejeté", "tronqué"], a: 1, exp: "Requête préparée." },
    { type: "qcm", q: "Page 3, taille 10 → OFFSET =", opts: ["30", "20", "3", "0"], a: 1, exp: "(3-1)*10." },
    { type: "qcm", q: "La qualité automatisée est…", opts: ["optionnelle", "une porte que le code franchit à chaque push", "une revue manuelle du code", "une simple recommandation"], a: 1, exp: "Obligatoire en CI." }
  ],
  final: {
    title: "Exercice final — Recherche sûre + qualité en CI",
    intro: `<p>Recherche naïve et pipeline sans qualité :</p>
<pre class="pseudo">std::string sql = "SELECT * FROM jeu WHERE nom LIKE '%" + motCle + "%'"; // DANGER : motCle COLLE dans le SQL -> injection
// CI : seulement build + tests, pas de lint ni sanitizers               // aucune analyse statique ni detecteur memoire</pre>
`,
    questions: [
      { type: "qcm", q: "Faille de la recherche :", opts: ["aucune", "concaténation : injection SQL", "absence d'index sur la colonne", "pas de LIMIT/OFFSET"], a: 1, exp: "Donnée dans le code." },
      { type: "qcm", q: "Correction :", opts: ["échapper à la main", "requête préparée + setString(\"%\"+motCle+\"%\")", "supprimer LIKE", "filtrer côté interface"], a: 1, exp: "Valeur liée." },
      { type: "qcm", q: "Ajout qualité n°1 :", opts: ["une revue manuelle du code", "un job de lint (clang-tidy/cppcheck)", "un déploiement", "un job de scan d'image"], a: 1, exp: "Analyse statique." },
      { type: "qcm", q: "Ajout qualité n°2 :", opts: ["une analyse statique seule", "des tests sous -fsanitize=address,undefined", "des tests seulement en release", "un test manuel de l'UI"], a: 1, exp: "Analyse dynamique." },
      { type: "qcm", q: "Un problème détecté…", opts: ["est ignoré", "fait échouer la CI", "déclenche le déploiement", "est corrigé automatiquement"], a: 1, exp: "Porte de qualité." }
    ],
    solution: `<pre class="pseudo">// Recherche sûre et paginée
std::unique_ptr&lt;sql::PreparedStatement&gt; p(con.prepareStatement(  // requete preparee a trois trous
    "SELECT * FROM jeu WHERE nom LIKE ? ORDER BY nom LIMIT ? OFFSET ?")); // chercher, trier, paginer
p-&gt;setString(1, "%" + motCle + "%");              // 1er ? : motif de recherche (valeur liee, anti-injection)
p-&gt;setInt(2, taille); p-&gt;setInt(3, (page - 1) * taille); // 2e ? : LIMIT (taille de page) ; 3e ? : OFFSET (lignes a sauter)

# CI : deux jobs de qualité en plus                 # on complete le pipeline
  lint:      - run: clang-tidy src/*.cpp -- -std=c++17 # job 1 : analyse statique du code
  test-asan: - run: cmake -B build -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined" # job 2 : compiler avec sanitizers
             - run: ctest --test-dir build           # puis lancer les tests, surveilles par les sanitizers</pre>
<p>Recherche liée et paginée, plus lint (statique) et sanitizers (dynamique) en CI : les bugs sont attrapés automatiquement. Demain : les espaces client, vendeur et administrateur.</p>
`
  }
};
