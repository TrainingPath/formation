<script>
var DAY = {
  num: 16,
  title: "Les espaces client, vendeur et administrateur",
  subtitle: "Trois vues d'une même application — la sécurité reste dans les services, testée.",
  theory: `
<h3>1. Router selon le rôle</h3>
<p><strong>Router</strong> (« aiguiller »), c'est diriger l'utilisateur vers la bonne partie du programme. Selon son <strong>rôle</strong>, on l'envoie vers son <strong>espace</strong> (l'ensemble des menus qui le concernent).</p>
<pre class="pseudo">void lancerEspace(sql::Connection&amp; con, const Utilisateur&amp; u) { // dirige l'utilisateur vers son espace
    switch (u.role()) {                       // aiguiller selon le role de l'utilisateur
        case Role::Client:  espaceClient(con, u);  break; // role Client -> espace client, puis sortir du switch
        case Role::Vendeur: espaceVendeur(con, u); break; // role Vendeur -> espace vendeur
        case Role::Admin:   espaceAdmin(con, u);   break; // role Admin -> espace administrateur
    }                                         // fin du switch
}                                             // fin de la fonction</pre>
<p>Le rôle vient de la <strong>session</strong> (l'identité prouvée à la connexion, leçon 9), jamais d'une saisie. Chaque espace présente les choix adaptés — c'est de l'<strong>ergonomie</strong> (le confort d'utilisation), pas de la sécurité.</p>

<h3>2. La sécurité reste dans les services</h3>
<div class="warn">Le menu par rôle n'est que du <strong>confort</strong> : il évite d'afficher des options inutiles. La vraie sécurité vit dans les services : chaque opération sensible revérifie le rôle (leçon 10) et filtre les ressources (anti-IDOR). Si l'UI était contournée, les services tiendraient quand même.</div>

<h3>3. Réutiliser, ne jamais dupliquer</h3>
<pre class="pseudo">void espaceVendeur(sql::Connection&amp; con, const Utilisateur&amp; u) { // menus reserves au vendeur
    int jeuId = lireEntier("Jeu : ");         // demander l'identifiant du jeu
    int n     = lireEntier("Quantite : ");    // demander la quantite a rajouter
    StockService::reappro(u, con, jeuId, n);  // appeler le service ; c'est LUI qui reverifie u.role()
}                                             // fin de la fonction</pre>
<p>Les trois espaces appellent les <strong>mêmes services</strong> : aucune règle n'est recopiée. <code>reappro</code> abrège « réapprovisionner » (remettre du stock). La seule différence entre espaces est la présentation.</p>

<h3>4. Tester le routage et les gardes</h3>
<pre class="pseudo">TEST(Autorisation, ClientNePeutReappro) {          // un client NE DOIT PAS pouvoir reapprovisionner
    Utilisateur client(1, "c", Role::Client);      // fabriquer un utilisateur de role Client
    EXPECT_THROW(StockService::reappro(client, con, 1, 5), AccesRefuse); // on ATTEND un refus (AccesRefuse)
}                                                  // fin du test
TEST(Autorisation, VendeurPeutReappro) {           // un vendeur DOIT pouvoir reapprovisionner
    Utilisateur vendeur(2, "v", Role::Vendeur);    // fabriquer un utilisateur de role Vendeur
    EXPECT_NO_THROW(StockService::reappro(vendeur, con, 1, 5)); // on ATTEND aucune exception (autorise)
}                                                  // fin du test</pre>
<div class="tip">On teste que le service <strong>refuse</strong> un rôle insuffisant et <strong>accepte</strong> un rôle autorisé. La sécurité devient une propriété vérifiée par la CI, pas une simple intention.</div>

<h3>5. Une application, trois expériences</h3>
<p>Un seul binaire, trois parcours. Le client parcourt, loue et achète ; le vendeur gère le stock ; l'admin gère jeux, comptes et statistiques. Menus adaptés pour l'ergonomie, contrôles dans les services pour la sécurité : <strong>défense en profondeur</strong> (plusieurs barrières cumulées), de bout en bout.</p>
`,
  exercises: [
    { type: "qcm", q: "On route les espaces avec…", opts: ["des if partout", "switch (u.role())", "un fichier", "l'UI seule"], a: 1, exp: "Selon le rôle." },
    { type: "qcm", q: "Le rôle vient…", opts: ["d'une saisie", "de la session (utilisateur authentifié)", "du menu", "d'un fichier"], a: 1, exp: "Jamais demandé." },
    { type: "qcm", q: "Le menu par rôle est…", opts: ["de la sécurité", "de l'ergonomie/confort", "inutile", "dangereux"], a: 1, exp: "Pas une barrière." },
    { type: "qcm", q: "La sécurité vit…", opts: ["dans le menu", "dans les services (rôle + anti-IDOR)", "dans l'affichage", "nulle part"], a: 1, exp: "Côté service." },
    { type: "qcm", q: "Les trois espaces appellent…", opts: ["des règles dupliquées", "les mêmes services", "des SQL différents", "rien"], a: 1, exp: "Pas de duplication." },
    { type: "qcm", q: "Un client appelant reappro…", opts: ["réussit", "reçoit AccesRefuse", "plante la base", "voit le menu"], a: 1, exp: "Refus côté service." },
    { type: "qcm", q: "On teste la sécurité par…", opts: ["l'affichage", "des tests (refus d'un rôle, acceptation d'un autre)", "un log", "rien"], a: 1, exp: "Propriété vérifiée." },
    { type: "qcm", q: "EXPECT_THROW(..., AccesRefuse) vérifie…", opts: ["l'acceptation", "que le service refuse le rôle insuffisant", "un double", "l'UI"], a: 1, exp: "Garde testée." },
    { type: "qcm", q: "La différence entre espaces est…", opts: ["les règles métier", "la présentation des choix", "le SQL", "la base"], a: 1, exp: "UI seulement." },
    { type: "qcm", q: "Un seul binaire propose…", opts: ["un seul parcours", "trois expériences selon le rôle", "aucun menu", "un site web"], a: 1, exp: "Trois vues." },
    { type: "vf", q: "Cacher un menu suffit à sécuriser une action.", a: false, exp: "Faux : le service doit vérifier." },
    { type: "qcm", q: "espaceAdmin ajoute…", opts: ["rien", "gestion des comptes/jeux et statistiques", "louer seulement", "moins de choix"], a: 1, exp: "Droits étendus." },
    { type: "qcm", q: "Défense en profondeur ici :", opts: ["une barrière", "menu adapté + contrôle service + anti-IDOR", "aucune", "chiffrement seul"], a: 1, exp: "Barrières cumulées." },
    { type: "qcm", q: "La sécurité devient…", opts: ["une intention", "une propriété testée en CI", "un log", "un secret"], a: 1, exp: "Vérifiée automatiquement." },
    { type: "qcm", q: "Le vendeur autorisé…", opts: ["est refusé", "passe (EXPECT_NO_THROW)", "voit un client", "plante"], a: 1, exp: "Rôle suffisant." }
  ],
  final: {
    title: "Exercice final — Prouver une règle d'autorisation",
    intro: `<p>On veut garantir que seul un vendeur ou un admin peut réapprovisionner.</p>`,
    questions: [
      { type: "qcm", q: "Le contrôle est dans…", opts: ["le menu", "StockService::reappro (garde de rôle)", "l'affichage", "le CMake"], a: 1, exp: "Côté service." },
      { type: "qcm", q: "Un client déclenche…", opts: ["un succès", "AccesRefuse", "un commit", "un log"], a: 1, exp: "Refus." },
      { type: "qcm", q: "Un vendeur déclenche…", opts: ["AccesRefuse", "aucune exception (autorisé)", "un plantage", "un rollback"], a: 1, exp: "Autorisé." },
      { type: "qcm", q: "On prouve tout ça par…", opts: ["une relecture", "deux tests (client refusé, vendeur accepté)", "un log", "l'UI"], a: 1, exp: "Tests d'autorisation." },
      { type: "qcm", q: "Ces tests tournent…", opts: ["en prod", "en CI à chaque push", "jamais", "manuellement"], a: 1, exp: "Automatisés." }
    ],
    solution: `<pre class="pseudo">// Service : la garde
void StockService::reappro(const Utilisateur&amp; u, sql::Connection&amp; con, int id, int n) { // reapprovisionner le jeu id de n exemplaires
    if (!peutGererStock(u)) throw AccesRefuse("Reserve au vendeur/admin"); // refuser si le role n'a pas le droit
    if (n &lt;= 0) throw SaisieInvalide("Quantite invalide"); // refuser une quantite nulle ou negative
    JeuRepository::ajouterStock(con, id, n);  // sinon : ajouter n au stock du jeu
}                                             // fin du service
// Tests : la preuve
TEST(Autorisation, ClientRefuse) {            // un client doit etre refuse
    EXPECT_THROW(StockService::reappro(Utilisateur(1,"c",Role::Client),con,1,5), AccesRefuse); // on attend AccesRefuse
}                                             // fin du test
TEST(Autorisation, VendeurAccepte) {          // un vendeur doit etre accepte
    EXPECT_NO_THROW(StockService::reappro(Utilisateur(2,"v",Role::Vendeur),con,1,5)); // on attend aucune exception
}                                             // fin du test</pre>
<p>La règle d'autorisation est dans le service et prouvée par des tests en CI. Menu adapté pour l'ergonomie, garde testée pour la sécurité. Demain : l'image de production — multi-stage, non-root, scan.</p>
`
  }
};
</script>
