<script>
var DAY = {
  num: 1,
  title: "Cadrage : le projet pro et son environnement conteneurisé",
  subtitle: "On reconstruit la Ludothèque C++ comme en entreprise — outillage d'abord, code ensuite.",
  theory: `
<h3>1. Même application, autre exigence</h3>
<p>Commençons par poser les mots, car ils reviendront à chaque leçon. Un <strong>programme</strong> (aussi appelé « logiciel » ou « application ») est une suite d'ordres écrits que l'ordinateur exécute l'un après l'autre. Le <strong>code</strong> (ou <strong>code source</strong>) est le texte de ces ordres, écrit par un humain dans un langage de programmation — ici le C++.</p>
<p>Le <strong>domaine</strong> (le sujet traité) est le même que dans le projet « à la main » : une <strong>ludothèque</strong>, c'est-à-dire un commerce qui vend et loue des jeux, avec trois <strong>rôles</strong> d'utilisateurs (par exemple visiteur, employé, administrateur). Ce qui change, c'est <strong>l'ingénierie</strong> : la manière professionnelle de fabriquer et de livrer le logiciel. On s'appuiera sur un dépôt Git, des conteneurs, une chaîne CI/CD, des tests, une image de production durcie et un déploiement automatisé — tous ces termes sont expliqués ci-dessous. L'idée maîtresse : on ne rajoute pas ces éléments à la fin, on les <strong>met en place dès le tout premier enregistrement de code</strong>.</p>
<p>Définissons l'outil de base. <strong>Git</strong> est un logiciel qui conserve l'historique de toutes les versions du code : c'est comme un carnet qui note chaque modification et permet de revenir en arrière à tout moment. Le <strong>dépôt</strong> (en anglais <em>repository</em>) est le dossier suivi par Git — la mémoire complète du projet. Un <strong>commit</strong> est un instantané enregistré du projet à un moment précis, comme une photo datée qu'on pourra toujours retrouver ; <strong>pousser</strong> (<em>push</em>) ces instantanés, c'est les envoyer vers le dépôt partagé de l'équipe.</p>

<h3>2. Construire, industrialiser, sécuriser d'un même geste</h3>
<div class="tip">La différence entre un simple exercice et un logiciel professionnel n'est pas le nombre de fonctionnalités, mais les <strong>garanties</strong> apportées : reproductibilité (grâce aux conteneurs), non-régression (grâce aux tests lancés automatiquement), sécurité (requêtes préparées, secrets protégés, rôles), livrabilité (une image prête + un déploiement), exploitabilité (journaux d'activité, sauvegardes). Chacun de ces mots est défini plus bas.</div>

<h3>3. L'environnement conteneurisé</h3>
<pre class="pseudo">Poste de dev  ──►  Conteneur "app" (g++/CMake + Connector/C++)
                    Conteneur "db"  (MySQL)
                    orchestrés par docker-compose</pre>
<p>Ce schéma se lit ainsi : sur le poste du développeur, deux boîtes tournent côte à côte. Définissons-les. Un <strong>conteneur</strong> est une boîte logicielle qui emballe un programme avec tout ce dont il a besoin pour fonctionner (bibliothèques, réglages), un peu comme une valise déjà préparée et identique pour tout le monde ; l'outil qui fabrique et fait tourner ces boîtes s'appelle <strong>Docker</strong>. Le premier conteneur, « app », contient les outils pour fabriquer notre programme : le <strong>compilateur</strong> (le traducteur qui transforme le code source lisible par l'humain en programme exécutable par la machine ; <strong>g++</strong> est le compilateur du langage C++), <strong>CMake</strong> (un outil qui décrit et automatise cette fabrication) et <strong>Connector/C++</strong> (une <strong>bibliothèque</strong>, c'est-à-dire un ensemble de code déjà écrit et réutilisable — une boîte à outils prête à l'emploi — qui permet à notre programme de dialoguer avec la base de données). Le second conteneur, « db », contient <strong>MySQL</strong> : une <strong>base de données</strong> est un grand classeur électronique qui range et retrouve des informations (les jeux, les clients…), et MySQL est le logiciel qui gère ce classeur. Enfin <strong>docker-compose</strong> est le chef d'orchestre qui démarre ces conteneurs ensemble et les fait communiquer.</p>
<p>L'intérêt : le compilateur, les bibliothèques et la base vivent tous dans des conteneurs identiques d'une machine à l'autre. La fameuse phrase « Ça marche chez moi » (le bug qui n'apparaît que sur l'ordinateur d'un développeur) disparaît, car « chez moi » devient une <strong>image reproductible</strong> — une <strong>image</strong> étant le modèle figé à partir duquel on crée un conteneur, comme un moule à gâteau : un moule (l'image), autant de gâteaux identiques qu'on veut (les conteneurs).</p>

<h3>4. Le dépôt et ce qu'on n'y met pas</h3>
<pre class="pseudo"># .gitignore : liste des fichiers que Git doit ignorer (ne jamais enregistrer)
build/           # dossier des sorties de compilation (jetables : on peut les refabriquer)
ludotheque       # le binaire : le fichier programme final, produit par le compilateur
.env             # SECRETS (mots de passe, cles) : jamais versionnes
*.log            # journaux d'activite generes pendant l'execution (jetables)</pre>
<p>Le fichier <strong>.gitignore</strong> est une liste de fichiers que Git doit ignorer, c'est-à-dire ne pas enregistrer. On y met ce qui est soit sensible, soit jetable. Un <strong>secret</strong> est une information confidentielle (mot de passe, clé d'accès) qu'il ne faut jamais laisser traîner dans le code ni confier à Git ; « <strong>versionner</strong> » un fichier signifie justement le confier à Git. Le <strong>binaire</strong> est le fichier programme final prêt à être lancé, et les <strong>artefacts de build</strong> (« build » = construction) sont tous les fichiers produits par la compilation — jetables, car on peut toujours les refabriquer à partir du code source.</p>
<div class="warn">On versionne le code, la config d'exemple (<code>.env.example</code>, un modèle qui documente les réglages attendus sans divulguer de vraies valeurs), le Dockerfile, le docker-compose, le CMakeLists et le workflow CI. On ne versionne <strong>jamais</strong> les secrets ni les artefacts de build.</div>

<h3>5. La feuille de route</h3>
<p>Voici l'enchaînement des trois semaines. Semaine 1 : les fondations outillées (dépôt Git, conteneur, CI, base de données, modèle, services, DAO — un <strong>DAO</strong>, de l'anglais <em>Data Access Object</em>, étant la couche de code chargée de lire et d'écrire dans la base). Semaine 2 : le métier sécurisé et testé (validation des données, authentification, autorisation anti-IDOR, transactions, secrets). Semaine 3 : l'industrialisation (recherche et qualité, espaces, image durcie, pipeline, déploiement, observabilité). La <strong>CI</strong> (intégration continue) est un robot qui, à chaque envoi de code, reconstruit le projet et lance les tests tout seul pour repérer immédiatement les erreurs ; la partie <strong>CD</strong> (déploiement continu) installe ensuite automatiquement la nouvelle version sur le serveur où les utilisateurs s'en serviront. Chaque leçon fait grandir un seul et même projet.</p>
`,
  exercises: [
    { type: "qcm", q: "Par rapport au projet « à la main », le pro change surtout…", opts: ["le domaine", "l'ingénierie (Git, conteneurs, CI/CD, sécurité, livraison)", "le langage", "les rôles"], a: 1, exp: "Mêmes fonctionnalités, plus de garanties." },
    { type: "qcm", q: "Quand câble-t-on l'outillage ?", opts: ["à la fin", "dès le premier commit", "jamais", "après les tests"], a: 1, exp: "Outillage d'abord." },
    { type: "qcm", q: "Les conteneurs apportent…", opts: ["de la lenteur", "un environnement reproductible (fin du « ça marche chez moi »)", "des bugs", "des secrets"], a: 1, exp: "Reproductibilité." },
    { type: "qcm", q: "docker-compose orchestre ici…", opts: ["un seul service", "les conteneurs app et db", "le navigateur", "l'UI"], a: 1, exp: "App + base." },
    { type: "qcm", q: "Que ne versionne-t-on jamais ?", opts: ["le code", "les secrets (.env) et les artefacts de build", "le Dockerfile", "le CMakeLists"], a: 1, exp: "Rien de sensible ni de jetable." },
    { type: "qcm", q: ".env.example sert à…", opts: ["stocker les secrets", "documenter les variables attendues, sans valeurs réelles", "compiler", "déployer"], a: 1, exp: "Modèle de config." },
    { type: "qcm", q: "La qualité professionnelle se mesure surtout par…", opts: ["le nombre de fonctions", "les garanties (repro, tests, sécurité, livraison)", "la longueur du code", "le nombre de classes"], a: 1, exp: "Garanties." },
    { type: "qcm", q: "build/ est…", opts: ["versionné", "jetable et ignoré par Git", "un secret", "le code source"], a: 1, exp: "Sorties de compilation." },
    { type: "qcm", q: "Le domaine du projet est…", opts: ["nouveau", "la même ludothèque (achat/location, 3 rôles)", "un blog", "un jeu"], a: 1, exp: "Identique, pour comparer." },
    { type: "qcm", q: "La CI s'exécutera…", opts: ["une fois par an", "à chaque push", "jamais", "au déploiement seulement"], a: 1, exp: "Intégration continue." },
    { type: "vf", q: "On ajoute les tests et la CI seulement une fois l'application finie.", a: false, exp: "Faux : dès le départ." },
    { type: "qcm", q: "« Ça marche chez moi » disparaît grâce…", opts: ["au hasard", "aux conteneurs reproductibles", "aux logs", "au CMake seul"], a: 1, exp: "Environnement figé." },
    { type: "qcm", q: "Le Dockerfile et le workflow CI sont…", opts: ["ignorés", "versionnés avec le code", "des secrets", "jetables"], a: 1, exp: "Infra as code." },
    { type: "qcm", q: "La semaine 3 traite…", opts: ["les fondations", "l'industrialisation et la production", "l'algorithmique", "rien"], a: 1, exp: "Livraison et exploitation." },
    { type: "qcm", q: "Le fil rouge est…", opts: ["différent chaque jour", "un projet unique qui grandit leçon après leçon", "absent", "un QCM"], a: 1, exp: "Continuité." }
  ],
  final: {
    title: "Exercice final — Poser les fondations",
    intro: `<p>Tu démarres le dépôt du projet pro. On te propose ce début de plan :</p>
<pre class="pseudo">1. git init
2. écrire tout le code métier
3. ajouter Docker et la CI à la fin
4. gérer les secrets plus tard</pre>`,
    questions: [
      { type: "qcm", q: "Le défaut du plan :", opts: ["aucun", "l'outillage (Docker, CI, secrets) est repoussé à la fin", "trop de git", "trop rapide"], a: 1, exp: "Outillage d'abord." },
      { type: "qcm", q: "L'ordre pro serait plutôt :", opts: ["coder puis outiller", "dépôt + conteneur + CI, puis le code par petites étapes testées", "tout en même temps sans ordre", "sans Git"], a: 1, exp: "Fondations outillées." },
      { type: "qcm", q: "Les secrets se gèrent…", opts: ["plus tard", "dès le départ (jamais versionnés, via environnement)", "dans le code", "dans les logs"], a: 1, exp: "Sécurité dès le début." },
      { type: "qcm", q: "Le premier commit contient…", opts: ["toute l'appli", "le squelette + .gitignore + fichiers d'amorçage", "les secrets", "rien"], a: 1, exp: "Structure d'abord." },
      { type: "qcm", q: "Ajouter la CI à la fin est risqué car…", opts: ["ça va plus vite", "on accumule des régressions non détectées", "c'est interdit", "sans raison"], a: 1, exp: "Filet dès le début." }
    ],
    solution: `<pre class="pseudo"># Plan pro : outiller puis coder par petites étapes testées
1. git init + .gitignore (build/, .env, binaires)
2. Dockerfile + docker-compose.yml (app + db) + .env.example
3. .github/workflows/ci.yml (build à chaque push)
4. schéma SQL, puis modèle → DAO → services, chacun AVEC son test
5. sécurité (requêtes préparées, hash, rôles, secrets) intégrée au fil de l'eau
6. image de production durcie, pipeline complet, déploiement, observabilité</pre>
<p>On construit, on industrialise et on sécurise ensemble. Demain : le squelette C++ dans Docker Compose.</p>`
  }
};
</script>

<script>
var ECRITURE = {

    statement: "Écris un .gitignore pour ce projet : ignore le dossier de build, le binaire, les secrets (.env) et les logs. Ajoute en commentaire la liste des fichiers d'amorçage qui, eux, DOIVENT être versionnés.",

      "Ignore build/, le binaire, .env, *.log.",
      "Ne jamais ignorer le code ni la config d'exemple.",

    ],
    solution: "# --- ignores ---\nbuild/            # sorties de compilation (jetables)\nludotheque        # binaire\n.env              # SECRETS : jamais versionnes\n*.log\n\n# --- versionnes (a NE PAS ignorer) ---\n# Dockerfile, docker-compose.yml, CMakeLists.txt\n# .env.example (variables attendues, sans valeurs reelles)\n# .github/workflows/ci.yml, src/*.cpp, include/*.hpp, schema.sql",
