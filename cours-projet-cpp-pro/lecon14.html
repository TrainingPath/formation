  theory: `
<h3>1. Le principe des 12 facteurs</h3>
<p>Les « <strong>12 facteurs</strong> » sont une liste de bonnes pratiques reconnues pour bâtir des applications faciles à déployer. L'une d'elles : la <strong>configuration</strong> (tout ce qui change entre les environnements dev, test, production — adresses, identifiants, réglages) doit vivre dans l'<strong>environnement</strong>, pas dans le code. Un <strong>environnement</strong> est le contexte d'exécution (la machine et ses réglages) où tourne le programme. Résultat : le même <strong>binaire</strong> (le programme compilé) tourne partout ; seul l'environnement change.</p>

<h3>2. Config d'infrastructure vs secrets</h3>
<p>Une <code>struct</code> (structure) regroupe plusieurs valeurs liées sous un même nom, comme une fiche cartonnée à plusieurs cases. Ici, <code>Config</code> rassemble les réglages de connexion.</p>
<pre class="pseudo">struct Config { std::string hote; int port; std::string base; std::string user; }; // regroupe hote, port, base, utilisateur
Config chargerConfig() {                 // construit la config a partir de l'environnement
    return { getenvOr("LUDO_DB_HOST","localhost"),   // hote : variable LUDO_DB_HOST, ou "localhost" par defaut
             std::stoi(getenvOr("LUDO_DB_PORT","3306")), // port : variable convertie en entier (stoi = string-to-int), 3306 par defaut
             getenvOr("LUDO_DB_NAME","ludotheque"),  // nom de la base : variable, ou "ludotheque" par defaut
             getenvOr("LUDO_DB_USER","ludo") };      // utilisateur : variable, ou "ludo" par defaut
}                                        // fin de la fonction</pre>
<p><code>getenvOr(nom, defaut)</code> lit une <strong>variable d'environnement</strong> (un réglage nommé fourni par le système) ou renvoie une valeur par défaut si elle est absente. <code>std::stoi</code> convertit un texte en entier (« string to int »). L'hôte ou le port ne sont pas secrets mais varient : on les met en config. Le <strong>mot de passe</strong>, lui, est un secret à traiter à part.</p>

<h3>3. Les secrets, jamais dans le dépôt</h3>
<pre class="pseudo">std::string lireSecret(const std::string&amp; nom) {   // lit un secret depuis l'environnement
    const char* v = std::getenv(nom.c_str());      // recuperer la variable d'environnement nommee "nom"
    if (!v) throw std::runtime_error("Secret manquant : " + nom);   // si absente : ECHOUER (aucune valeur par defaut)
    return std::string(v);                         // sinon : renvoyer la valeur du secret
}                                                  // fin de la fonction
// usage : connect(cfg.hote, cfg.user, lireSecret("LUDO_DB_PASSWORD")); // se connecter en injectant le secret</pre>
<p><code>std::getenv</code> lit une variable d'environnement ; elle renvoie <code>nullptr</code> (« rien ») si la variable n'existe pas — c'est exactement ce que teste <code>if (!v)</code>. <code>c_str()</code> convertit la <code>std::string</code> en texte brut attendu par <code>getenv</code>.</p>
<div class="warn">Un secret absent doit faire <strong>échouer</strong> le démarrage, et non prendre une valeur par défaut (sinon on risque de démarrer en production avec un mot de passe factice). Le message d'erreur nomme la variable, jamais sa valeur. Aucun secret n'est journalisé.</div>

<h3>4. La chaîne d'injection</h3>
<pre class="pseudo">.env (local, ignoré par Git)  ─►  docker-compose env_file  ─►  variables du conteneur
Secret manager / CI secrets   ─►  variables d'environnement du job/déploiement</pre>
<div class="tip">Ce schéma montre d'où viennent les secrets à chaque étage : en local, un fichier <code>.env</code> non versionné ; en CI, les <em>secrets</em> configurés dans le dépôt ; en production, un <strong>gestionnaire de secrets</strong> (un coffre-fort logiciel dédié). À chaque étage, le code lit la <strong>même</strong> variable d'environnement — il ignore d'où elle vient.</div>

<h3>5. Documenter sans divulguer</h3>
<p>Le fichier <code>.env.example</code> (versionné, lui) liste les variables attendues <strong>sans valeurs réelles</strong>. Un nouvel arrivant sait ainsi quoi fournir ; aucun secret n'est exposé. C'est la frontière entre « reproductible » et « fuité ».</p>
`,

  ],

    ],

// .env (ignore par Git) : LUDO_DB_HOST=..., LUDO_DB_PASSWORD=...        // vraies valeurs, hors du depot

<p>Config externalisée, secret injecté et jamais loggé, <code>.env.example</code> pour documenter. Le même binaire tourne en dev, CI et prod. Demain : recherche, pagination et qualité (lint, sanitizers).</p>
`
