var DAY = {

  title: "L'interface et les entrées sûres (types et std::string)",
  subtitle: "Une UI mince qui valide tout — et un langage qui élimine les débordements de tampon du C.",
  theory: `
<h3>1. L'UI ne fait que présenter</h3>
<p>L'<strong>UI</strong> (interface utilisateur) est la couche qui parle à l'humain : ici une interface en mode texte (console). Elle lit les saisies, appelle les services (dans un bloc <code>try/catch</code>, qui « essaie » du code et « rattrape » les erreurs), puis affiche résultats et messages. Elle ne contient aucune règle métier ni aucun SQL. C'est la couche la plus fine et la plus facile à remplacer (console aujourd'hui, page web ou API demain).</p>

<h3>2. La sûreté mémoire par le langage</h3>
<div class="warn">En langage C, lire une saisie avec <code>gets</code> ou <code>scanf("%s")</code> dans un tableau de taille fixe provoque des <strong>débordements de tampon</strong> (<em>buffer overflow</em>) : si l'utilisateur tape plus de caractères que prévu, le surplus écrase la mémoire voisine — une classe de failles très graves. En C++, <code>std::string</code> (texte de taille automatique) et <code>std::getline</code> (lecture d'une ligne entière) gèrent la taille tout seuls : ce risque disparaît.</div>
<pre class="pseudo">std::string ligne;                   // une chaine de texte, sans taille fixe imposee
std::getline(std::cin, ligne);       // lire une ligne entiere au clavier -> aucun risque de debordement</pre>
<p><code>std::cin</code> représente le <strong>clavier</strong> (l'« entrée standard ») ; <code>std::getline</code> y lit tout jusqu'au passage à la ligne.</p>

<h3>3. Lire un entier robuste</h3>
<p><strong>Robuste</strong> = qui résiste aux saisies farfelues (des lettres au lieu d'un nombre) sans planter. On boucle tant que la saisie n'est pas un entier valide.</p>
<pre class="pseudo">int lireEntier(const std::string&amp; invite) {   // demande un entier jusqu'a en obtenir un valide
    while (true) {                            // boucle "infinie" : on ne sort que par return
        std::cout &lt;&lt; invite;                  // afficher le message d'invite (ex. "Votre choix : ")
        int x;                               // variable qui recevra le nombre
        if (std::cin &gt;&gt; x) return x;          // si la lecture reussit (c'est bien un nombre) -> renvoyer x
        std::cin.clear();                    // sinon : effacer l'etat d'erreur du flux clavier
        std::cin.ignore(std::numeric_limits&lt;std::streamsize&gt;::max(), '\\n'); // jeter le reste de la ligne fautive
        std::cout &lt;&lt; "Entrez un nombre.\\n";  // et redemander
    }                                        // on reboucle
}                                            // fin de la fonction</pre>
<p><code>std::cin &gt;&gt; x</code> tente de lire un entier ; s'il échoue (l'utilisateur a tapé du texte), le flux passe en état d'erreur. <code>clear()</code> efface cet état, et <code>ignore(...)</code> vide la ligne restée coincée (<code>numeric_limits&lt;streamsize&gt;::max()</code> veut dire « un très grand nombre » = « jusqu'à la fin de la ligne »). Sans ce nettoyage, la boucle tournerait indéfiniment.</p>

<h3>4. Valider le contenu, toujours</h3>
<div class="tip">La sûreté mémoire ne remplace pas la <strong>validation métier</strong> : on vérifie toujours les bornes et les formats (une durée dans [1,30], une quantité &gt; 0). Le service reste le juge ; l'UI empêche seulement les saisies mal formées d'aller plus loin.</div>

<h3>5. La boucle de menu sous filet</h3>
<pre class="pseudo">try {                                        // "essayer" ce bloc ; toute exception sera rattrapee plus bas
    switch (choix) {                         // aiguiller selon le choix de l'utilisateur
        case 1: catalogue(*con); break;      // choix 1 : afficher le catalogue, puis sortir du switch
        case 2: louer(*con, u);  break;      // choix 2 : lancer une location, puis sortir
        case 0: return;                      // choix 0 : quitter le menu
        default: std::cout &lt;&lt; "Choix inconnu\\n"; // tout autre choix : message d'erreur
    }                                        // fin du switch
} catch (const std::exception&amp; e) {          // rattraper n'importe quelle exception remontee par un service
    std::cout &lt;&lt; "Erreur : " &lt;&lt; e.what() &lt;&lt; "\\n";   // afficher son message lisible (e.what()) : l'UI traduit
}                                            // fin du try/catch</pre>
<p>Le service lance l'exception, l'UI l'attrape et la présente. <code>e.what()</code> fournit le message texte de l'erreur. Aucune exception ne fait planter le programme ; l'utilisateur voit un message clair.</p>
`,
  exercises: [
    { type: "qcm", q: "L'UI contient…", opts: ["les règles métier", "la présentation (lire, appeler, afficher)", "le SQL", "les transactions"], a: 1, exp: "Couche mince." },
    { type: "qcm", q: "En C, gets/scanf(\"%s\") risquent…", opts: ["aucun risque", "un débordement de tampon", "une injection SQL", "une fuite mémoire réseau"], a: 1, exp: "Buffer overflow." },
    { type: "qcm", q: "std::string et std::getline…", opts: ["gardent le même risque qu'en C", "gèrent la taille et évitent le débordement", "sont plus lents que scanf", "valident aussi le format"], a: 1, exp: "Sûreté mémoire." },
    { type: "qcm", q: "La sûreté mémoire du langage…", opts: ["remplace la validation métier", "ne remplace pas la validation du contenu", "rend les tests inutiles", "empêche les exceptions"], a: 1, exp: "Deux choses distinctes." },
    { type: "qcm", q: "Après une saisie invalide, std::cin doit être…", opts: ["fermé puis rouvert", "nettoyé (clear + ignore)", "recopié dans un buffer", "laissé en l'état"], a: 1, exp: "Sinon boucle folle." },
    { type: "qcm", q: "Le try/catch du menu…", opts: ["ralentit le menu", "attrape les exceptions des services et les affiche", "exécute les requêtes SQL", "valide les données métier"], a: 1, exp: "Traduction." },
    { type: "qcm", q: "Le service lance, l'UI…", opts: ["ignore l'exception", "attrape et présente le message", "relance sans la traiter", "termine le programme"], a: 1, exp: "Séparation." },
    { type: "qcm", q: "On valide le contenu…", opts: ["jamais côté serveur", "toujours (bornes, formats)", "en production uniquement", "seulement pour les admins"], a: 1, exp: "Frontière du domaine." },
    { type: "qcm", q: "L'UI est…", opts: ["la couche qui décide", "la plus fine et remplaçable", "irremplaçable", "celle du SQL"], a: 1, exp: "Console → API → GUI." },
    { type: "qcm", q: "e.what() donne…", opts: ["le nom du type d'exception", "le message à présenter", "le numéro de ligne", "la pile d'appels"], a: 1, exp: "Message lisible." },
    { type: "vf", q: "En C++, std::string élimine les débordements de tampon des lectures de chaînes.", a: true, exp: "Taille gérée." },
    { type: "qcm", q: "Une durée saisie doit être…", opts: ["acceptée sans contrôle", "validée (ex. [1,30]) par le service", "seulement affichée à l'écran", "convertie sans vérification"], a: 1, exp: "Validation métier." },
    { type: "qcm", q: "std::cin.ignore(max, '\\n') …", opts: ["lit un entier de plus", "vide la ligne fautive", "ferme le flux cin", "affiche le contenu ignoré"], a: 1, exp: "Nettoyage." },
    { type: "qcm", q: "Sans try/catch, une exception d'un service…", opts: ["serait traduite en message", "ferait planter le menu", "serait silencieusement ignorée", "se journaliserait toute seule"], a: 1, exp: "Filet nécessaire." },
    { type: "qcm", q: "L'UI accède aux données…", opts: ["par des requêtes SQL directes", "via les services", "en accédant au DAO", "jamais, elle est statique"], a: 1, exp: "Respect des couches." }
  ],
  final: {
    title: "Exercice final — Remplacer une lecture dangereuse",
    intro: `<p>Du code de style C dans une appli C++ :</p>
<pre class="pseudo">char nom[20];              // tableau FIXE de 20 caracteres (a la mode C)
scanf("%s", nom);          // (?) DANGER : lit sans limite -> deborde si la saisie depasse 20 caracteres
// ... utiliser nom ...     // la memoire voisine a peut-etre ete ecrasee</pre>
`,
    questions: [
      { type: "qcm", q: "Le risque :", opts: ["aucun risque", "débordement de tampon si la saisie dépasse 20 caractères", "une lecture trop lente", "un buffer trop petit sans risque"], a: 1, exp: "Buffer overflow." },
      { type: "qcm", q: "La solution C++ :", opts: ["agrandir le tableau char[]", "std::string + std::getline", "un scanf avec largeur limitée", "un fgets sur le buffer"], a: 1, exp: "Taille gérée." },
      { type: "qcm", q: "Faut-il quand même valider le contenu ?", opts: ["non, getline suffit", "oui : longueur/format selon la règle", "jamais, c'est déjà sûr", "seulement en production"], a: 1, exp: "Validation métier." },
      { type: "qcm", q: "std::getline lit…", opts: ["un seul entier", "une ligne entière, taille gérée", "un seul octet", "un mot jusqu'à l'espace"], a: 1, exp: "Chaîne sûre." },
      { type: "qcm", q: "La sûreté mémoire vient ici…", opts: ["d'un contrôle manuel", "du type std::string (langage)", "de l'isolation Docker", "des tests en CI"], a: 1, exp: "Par conception." }
    ],
    solution: `<pre class="pseudo">std::string nom;                      // chaine de taille automatique (pas de tableau fixe)
std::getline(std::cin, nom);          // lire une ligne entiere -> aucun risque de debordement
if (nom.empty() || nom.size() &gt; 100)  // validation METIER du contenu : ni vide, ni trop long
    throw SaisieInvalide("Nom invalide"); // sinon refuser
// ... utiliser nom en toute surete ...   // la chaine est sure ET validee</pre>
<p><code>std::string</code> supprime le risque de débordement ; on valide néanmoins le contenu. Sûreté mémoire (langage) + validation (métier) : deux protections complémentaires. Demain : secrets et configuration par environnement.</p>
`
  }
};
