  title: "Le publipostage : lettres personnalisées",
  subtitle: "Générer des centaines de lettres depuis une liste.",
  theory: `
<h3>1. Le principe du publipostage</h3>
<p>Le <strong>publipostage</strong> (mailing/fusion) combine un <strong>document principal</strong> (le texte type, identique pour tous) avec une <strong>source de données</strong> (une liste : noms, adresses…) pour produire un document personnalisé par destinataire. Chaque lettre reprend le texte type, mais les <strong>champs de fusion</strong> sont remplacés par les données de chaque ligne.</p>
<pre class="pseudo">Document principal + Source de données  ⟶  Documents fusionnés (1 par ligne)</pre>
<h3>2. La source de données</h3>
<p>La source est le plus souvent un tableau : une <strong>feuille Excel</strong>, un tableau Word, un carnet d'adresses Outlook, ou une liste tapée dans Word. La <strong>première ligne = les en-têtes de colonnes</strong> (Nom, Prénom, Ville…) : ce sont eux qui deviennent les champs de fusion.</p>
<div class="warn">Soignez les en-têtes de colonnes : pas d'accents/espaces problématiques, une ligne d'en-tête unique, pas de lignes vides. Une source Excel propre évite 90 % des soucis de fusion.</div>
<h3>3. L'assistant Publipostage</h3>
<pre class="pseudo">Ruban ▸ Publipostage ▸ Démarrer la fusion et le publipostage ▸ Assistant Fusion et publipostage pas à pas…</pre>
<p>L'assistant (volet à droite) déroule 6 étapes : type de document (Lettres), document de base, destinataires (la source), écriture de la lettre (insertion des champs), aperçu, fin de fusion.</p>
<h3>4. Sélectionner les destinataires</h3>
<pre class="pseudo">Publipostage ▸ Sélection des destinataires ▸ Utiliser une liste existante / Nouvelle liste / Contacts Outlook
Publipostage ▸ Modifier la liste de destinataires     // filtrer, trier, cocher/décocher</pre>
<h3>5. Insérer les champs de fusion</h3>
<pre class="pseudo">Publipostage ▸ Insérer un champ de fusion ▸ (Nom, Prénom, Ville…)
Publipostage ▸ Bloc d'adresse     // insère une adresse formatée
Publipostage ▸ Ligne de salutation // « Cher Monsieur Dupont, »</pre>
<p>Un champ inséré apparaît entre chevrons, par ex. «Prénom». Pour voir les codes de champ bruts, appuyez sur <code>Alt + F9</code>.</p>
<h3>6. Aperçu et règles</h3>
<pre class="pseudo">Publipostage ▸ Aperçu des résultats     // affiche les vraies données, destinataire par destinataire</pre>
<p>Les <strong>règles</strong> ajoutent de la logique : <em>Si… Alors… Sinon</em> (ex. « Cher » ou « Chère » selon le sexe), <em>Enregistrement suivant</em>, <em>Demander</em>, <em>Remplir</em>. On les trouve dans « Règles ».</p>
<h3>7. Terminer la fusion</h3>
<pre class="pseudo">Publipostage ▸ Terminer et fusionner :
  • Modifier des documents individuels   // crée un gros document (1 lettre par page)
  • Imprimer les documents               // imprime directement
  • Envoyer des messages électroniques   // envoi par e-mail (jour 14)</pre>
<div class="tip">« Modifier des documents individuels » crée un nouveau document contenant toutes les lettres fusionnées, que vous pouvez relire/retoucher avant impression. Le document principal, lui, garde ses champs pour une future réutilisation.</div>`,
  exercises: [
    { type: "qcm", q: "Que combine un publipostage ?", opts: ["Deux images", "Un document principal et une source de données", "Deux polices", "Un en-tête et un pied de page"], a: 1, exp: "Texte type + liste de destinataires = documents personnalisés." },
    { type: "qcm", q: "Qu'est-ce qu'un champ de fusion ?", opts: ["Une image", "Un emplacement remplacé par la donnée de chaque destinataire", "Un style", "Une marge"], a: 1, exp: "Le champ (ex. «Nom») prend la valeur de la ligne courante." },

    { type: "qcm", q: "Comment insérer le nom du destinataire dans la lettre ?", opts: ["Le taper à la main", "Publipostage ▸ Insérer un champ de fusion ▸ Nom", "Insertion ▸ Image", "Références ▸ Renvoi"], a: 1, exp: "Le champ de fusion Nom sera remplacé pour chaque destinataire." },
    { type: "vf", q: "L'Aperçu des résultats affiche les vraies données au lieu des champs.", a: true, exp: "Il permet de vérifier le rendu, destinataire par destinataire." },

    { type: "vf", q: "« Modifier des documents individuels » crée un document contenant toutes les lettres.", a: true, exp: "On obtient un fichier avec une lettre par destinataire, relisible avant impression." },
    { type: "qcm", q: "Le « Bloc d'adresse » sert à…", opts: ["Insérer une adresse formatée automatiquement", "Bloquer le document", "Changer les marges", "Insérer une image"], a: 0, exp: "Il compose une adresse propre à partir des champs de la source." },
    { type: "qcm", q: "Quel raccourci affiche les codes de champ bruts ?", opts: ["Alt + F9", "Ctrl + P", "F5", "Alt + F4"], a: 0, exp: "Alt + F9 bascule entre résultats et codes de champ." },
    { type: "qcm", q: "Une source Excel mal formée (lignes vides, doublons d'en-têtes) provoque…", opts: ["Rien", "Des erreurs et des champs manquants à la fusion", "Un PDF", "Un changement de police"], a: 1, exp: "Une source propre évite l'essentiel des problèmes de fusion." },
    { type: "vf", q: "Le document principal conserve ses champs après fusion, pour être réutilisé.", a: true, exp: "On peut relancer la fusion plus tard avec une autre liste." },
    { type: "qcm", q: "La « Ligne de salutation » produit typiquement…", opts: ["Un numéro de page", "« Cher Monsieur Dupont, » adapté au destinataire", "Une image", "Un tableau"], a: 1, exp: "Elle génère une formule d'appel personnalisée." }

<pre class="pseudo">Ruban ▸ Publipostage ▸ Sélection des destinataires / Insérer un champ de fusion / Règles</pre>`,
    questions: [

      { type: "qcm", q: "Comment insérer le nom du client dans le corps ?", opts: ["Le taper", "Insérer un champ de fusion ▸ Nom", "Une image", "Un renvoi"], a: 1, exp: "Le champ Nom sera personnalisé à chaque lettre." },
      { type: "qcm", q: "Pour « Cher/Chère » selon la civilité, on utilise…", opts: ["Un tableau", "La règle Si… Alors… Sinon", "Un commentaire", "Un saut de page"], a: 1, exp: "La règle conditionnelle choisit le texte selon la civilité." },
      { type: "vf", q: "L'Aperçu des résultats permet de vérifier quelques lettres avant de fusionner les 50.", a: true, exp: "On feuillette les destinataires pour contrôler le rendu." },
      { type: "qcm", q: "Pour obtenir un fichier avec les 50 lettres à relire avant impression…", opts: ["Terminer et fusionner ▸ Modifier des documents individuels", "Fichier ▸ Imprimer directement", "Insertion ▸ Objet", "Enregistrer en PDF le principal"], a: 0, exp: "« Modifier des documents individuels » génère toutes les lettres dans un document." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Publipostage ▸ Démarrer la fusion ▸ Lettres
2. Sélection des destinataires ▸ Utiliser une liste existante ▸ choisir le fichier Excel ▸ feuille
3. Rédiger la lettre type
4. Pour l'appel : Règles ▸ Si… Alors… Sinon ▸ Si Civilité = « M. » alors « Cher » sinon « Chère »
5. Insérer un champ de fusion ▸ Nom (et Ville où utile)
6. Aperçu des résultats ▸ feuilleter quelques destinataires
7. (Modifier la liste de destinataires pour filtrer/trier si besoin)
8. Terminer et fusionner ▸ Modifier des documents individuels ▸ Tous
9. Relire le document fusionné, puis imprimer</pre>
<p>Les 50 lettres sont personnalisées, avec la bonne formule d'appel.</p>`
  }
};
