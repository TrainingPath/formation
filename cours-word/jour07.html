<script>
var DAY = {
  num: 7,
  title: "La table des matières automatique",
  subtitle: "Un sommaire qui se construit et se met à jour tout seul.",
  theory: `
<h3>1. Le principe</h3>
<p>Une <strong>table des matières</strong> (TDM ou sommaire) automatique liste les titres du document avec leur numéro de page. Elle n'est PAS tapée à la main : Word la génère à partir des <strong>styles de titre</strong> (Titre 1, Titre 2, Titre 3…). C'est pourquoi le jour 2 insistait tant sur les styles.</p>
<div class="warn">Sans styles de titre appliqués, la table des matières sera vide. Le formatage manuel (gras + grande taille) ne compte pas : Word ne reconnaît que les styles de titre.</div>
<h3>2. Insérer une table des matières</h3>
<pre class="pseudo">Ruban ▸ Références ▸ Table des matières ▸ (choisir un modèle automatique)</pre>
<p>Placez d'abord le curseur là où le sommaire doit apparaître (souvent après la page de garde). Choisissez un modèle « Table automatique » : Word lit tous les Titre 1/2/3 et crée la liste avec les numéros de page.</p>
<h3>3. Mettre à jour la table</h3>
<p>La TDM est un <strong>champ</strong> : elle ne bouge pas toute seule pendant que vous tapez. Après avoir modifié le document, il faut la mettre à jour :</p>
<pre class="pseudo">Clic sur la table ▸ Mettre à jour la table…
  • Mettre à jour les numéros de page uniquement
  • Mettre à jour toute la table (titres + pages)
F9          // met à jour le champ sélectionné</pre>
<div class="tip">Réflexe avant impression/PDF : cliquez dans la table, appuyez sur F9, choisissez « Mettre à jour toute la table ». Sinon les numéros de page peuvent être faux.</div>
<h3>4. Personnaliser la table</h3>
<pre class="pseudo">Références ▸ Table des matières ▸ Table des matières personnalisée…</pre>
<p>On y règle le nombre de niveaux affichés, l'affichage ou non des numéros de page, les points de suite (les pointillés), et le style de chaque niveau (TM 1, TM 2…). Le bouton « Options » permet aussi de baser la table sur d'autres styles que les Titre 1/2/3.</p>
<h3>5. Ajouter un titre non standard à la table</h3>
<p>Pour inclure un paragraphe qui n'a pas de style de titre, on lui affecte un <strong>niveau hiérarchique</strong> :</p>
<pre class="pseudo">Références ▸ Ajouter le texte ▸ Niveau 1 / Niveau 2…     // ou via Paragraphe ▸ Niveau hiérarchique</pre>
<h3>6. Naviguer grâce aux titres</h3>
<p>Dans une table automatique, chaque ligne est un lien : <strong>Ctrl + clic</strong> saute au titre correspondant. Le volet de navigation (<code>Ctrl + F</code> ▸ onglet Titres) offre le même plan cliquable en permanence.</p>
<h3>7. Supprimer ou convertir</h3>
<p>« Table des matières ▸ Supprimer la table » l'enlève. Pour figer le sommaire en texte (par ex. avant d'envoyer un document qui ne doit plus se mettre à jour), sélectionnez-le et appuyez sur <code>Ctrl + Maj + F9</code> qui convertit le champ en texte statique.</p>`,
  exercises: [
    { type: "qcm", q: "À partir de quoi Word construit-il la table des matières ?", opts: ["Des couleurs", "Des styles de titre (Titre 1, 2, 3…)", "Des marges", "Des images"], a: 1, exp: "Seuls les styles de titre alimentent la TDM automatique." },
    { type: "vf", q: "Un titre mis en gras à la main apparaît automatiquement dans la table des matières.", a: false, exp: "Le gras manuel est ignoré : il faut un style de titre ou un niveau hiérarchique." },
    { type: "qcm", q: "Où insère-t-on une table des matières ?", opts: ["Insertion ▸ Tableau", "Références ▸ Table des matières", "Accueil ▸ Styles", "Révision ▸ Commentaires"], a: 1, exp: "L'onglet Références contient le bouton Table des matières." },
    { type: "qcm", q: "La table des matières est un…", opts: ["Texte figé", "Champ qui se met à jour sur demande", "Image", "Commentaire"], a: 1, exp: "C'est un champ : il faut demander sa mise à jour (F9)." },
    { type: "qcm", q: "Quel raccourci met à jour le champ sélectionné (dont la TDM) ?", opts: ["F9", "F5", "F1", "F12"], a: 0, exp: "F9 met à jour les champs sélectionnés." },
    { type: "qcm", q: "Après avoir ajouté des pages, que choisir pour un sommaire correct ?", opts: ["Mettre à jour les numéros de page uniquement", "Mettre à jour toute la table", "Rien", "Supprimer la table"], a: 1, exp: "« Toute la table » recalcule titres ET numéros de page." },
    { type: "vf", q: "Ctrl + clic sur une ligne de la table saute au titre correspondant.", a: true, exp: "Les lignes de la TDM automatique sont des liens internes." },
    { type: "qcm", q: "Comment inclure dans la table un paragraphe sans style de titre ?", opts: ["Le mettre en gras", "Lui affecter un niveau hiérarchique (Références ▸ Ajouter le texte)", "Changer sa couleur", "Le souligner"], a: 1, exp: "Le niveau hiérarchique fait entrer un paragraphe dans la TDM." },
    { type: "qcm", q: "Les « points de suite » d'une table des matières sont…", opts: ["Les numéros de page", "Les pointillés entre le titre et son numéro de page", "Les titres eux-mêmes", "Les marges"], a: 1, exp: "Ce sont les caractères de conduite (souvent des points) reliant titre et page." },
    { type: "vf", q: "On peut limiter la table des matières à 2 niveaux au lieu de 3.", a: true, exp: "La table personnalisée permet de choisir le nombre de niveaux affichés." },
    { type: "qcm", q: "Pour figer définitivement la table en texte statique, on utilise…", opts: ["Ctrl + Maj + F9", "Ctrl + S", "F5", "Ctrl + Z"], a: 0, exp: "Ctrl + Maj + F9 convertit un champ en texte non modifiable dynamiquement." },
    { type: "qcm", q: "Où règle-t-on l'affichage ou non des numéros de page dans la table ?", opts: ["Références ▸ Table des matières personnalisée", "Accueil ▸ Police", "Fichier ▸ Imprimer", "Affichage ▸ Zoom"], a: 0, exp: "La boîte de table personnalisée gère numéros de page, points de suite et niveaux." },
    { type: "vf", q: "La table des matières se met à jour automatiquement pendant qu'on tape.", a: false, exp: "Non : il faut la mettre à jour manuellement (F9) ou à l'ouverture selon les options." },
    { type: "qcm", q: "Le volet de navigation (Ctrl + F ▸ Titres) affiche…", opts: ["Les images", "Le plan cliquable des titres du document", "Les commentaires", "Les marges"], a: 1, exp: "Il liste les titres et permet de sauter à chacun." },
    { type: "qcm", q: "Réflexe recommandé juste avant de générer un PDF ?", opts: ["Changer la police", "Mettre à jour toute la table (F9)", "Supprimer les styles", "Réduire le zoom"], a: 1, exp: "On met à jour la table pour garantir des numéros de page exacts." }
  ],
  final: {
    title: "Exercice final — Sommaire d'un manuel",
    intro: `<p>Un manuel de 40 pages a bien ses styles Titre 1, Titre 2, Titre 3. On vous demande d'insérer un sommaire limité aux deux premiers niveaux, après la page de garde, et de le garder à jour après ajout d'un chapitre.</p>
<pre class="pseudo">Ruban ▸ Références ▸ Table des matières ▸ Table des matières personnalisée</pre>`,
    questions: [
      { type: "qcm", q: "Comment n'afficher que 2 niveaux de titres ?", opts: ["Supprimer les Titre 3", "Table des matières personnalisée ▸ régler « Afficher les niveaux » sur 2", "Changer les marges", "Mettre en gras"], a: 1, exp: "Le champ « Afficher les niveaux » limite la profondeur." },
      { type: "qcm", q: "Où placer le curseur avant d'insérer le sommaire ?", opts: ["À la fin du document", "Là où le sommaire doit apparaître, après la page de garde", "Dans l'en-tête", "Peu importe, il se place seul"], a: 1, exp: "La TDM s'insère à l'emplacement du curseur." },
      { type: "qcm", q: "Après ajout d'un chapitre, comment mettre le sommaire à jour ?", opts: ["Retaper le sommaire", "Clic sur la table ▸ Mettre à jour toute la table (ou F9)", "Redémarrer Word", "Changer la police"], a: 1, exp: "On met à jour toute la table pour intégrer le nouveau titre et repaginer." },
      { type: "vf", q: "Si un Titre 2 manque dans le sommaire, c'est probablement que son style n'est pas « Titre 2 ».", a: true, exp: "La TDM se base sur les styles : vérifier le style appliqué au paragraphe." },
      { type: "qcm", q: "Pour rendre les points de suite plus discrets, on agit dans…", opts: ["Références ▸ Table des matières personnalisée ▸ Caractères de suite", "Accueil ▸ Gras", "Insertion ▸ Image", "Révision ▸ Langue"], a: 0, exp: "Les caractères de suite se choisissent dans la boîte de personnalisation." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Vérifier que tous les titres ont bien les styles Titre 1/2/3
2. Placer le curseur après la page de garde
3. Références ▸ Table des matières ▸ Table des matières personnalisée
4. Régler « Afficher les niveaux » sur 2, choisir les caractères de suite ▸ OK
5. Le sommaire s'insère avec Titre 1 et Titre 2 seulement
6. Après ajout d'un chapitre : cliquer dans la table ▸ Mettre à jour la table
7. Choisir « Mettre à jour toute la table » ▸ OK (ou F9)
8. Avant l'export PDF : refaire une mise à jour complète</pre>
<p>Le sommaire reste fidèle à la structure et à la pagination.</p>`
  }
};
</script>
