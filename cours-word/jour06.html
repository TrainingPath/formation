<script>
var DAY = {
  num: 6,
  title: "En-têtes, pieds de page et numérotation",
  subtitle: "Habiller le haut et le bas de chaque page.",
  theory: `
<h3>1. Définitions</h3>
<ul>
<li>L'<strong>en-tête</strong> est la zone répétée en haut de chaque page (titre du document, logo…).</li>
<li>Le <strong>pied de page</strong> est la zone répétée en bas (numéro de page, mention légale…).</li>
</ul>
<p>Ces zones sont éditées à part du corps du texte. On y entre par un double-clic dans la marge haute ou basse, ou par le ruban :</p>
<pre class="pseudo">Ruban ▸ Insertion ▸ En-tête et pied de page ▸ En-tête (ou Pied de page)</pre>
<p>Une fois dedans, un onglet contextuel apparaît : <strong>En-tête et pied de page</strong> (dans les versions récentes) ou <strong>Création/Outils En-têtes et pieds de page</strong> (2019/2021).</p>
<h3>2. Numéroter les pages</h3>
<pre class="pseudo">Ruban ▸ Insertion ▸ Numéro de page ▸ Bas de page ▸ (choisir un modèle)</pre>
<p>Le numéro de page est un <strong>champ</strong> (jour 15) : il se met à jour tout seul quand la pagination change. Pour afficher « Page X sur Y », utilisez un modèle intégré ou insérez les champs <code>PAGE</code> et <code>NUMPAGES</code>.</p>
<h3>3. Choisir le format des numéros</h3>
<pre class="pseudo">Insertion ▸ Numéro de page ▸ Format des numéros de page…
  • Format : 1,2,3 / i,ii,iii / a,b,c / A,B,C
  • Commencer à : (valeur de départ)</pre>
<h3>4. Première page et pages paires/impaires différentes</h3>
<p>Dans l'onglet contextuel, deux cases essentielles :</p>
<ul>
<li><strong>Première page différente</strong> : masque l'en-tête/numéro sur la 1re page (page de garde).</li>
<li><strong>Pages paires et impaires différentes</strong> : permet un en-tête distinct à gauche et à droite (livres).</li>
</ul>
<div class="tip">Pour une page de garde sans numéro, cochez « Première page différente » et laissez son en-tête/pied vide : la numérotation continue quand même correctement sur les pages suivantes.</div>
<h3>5. En-têtes différents par chapitre : « Lier au précédent »</h3>
<p>Par défaut, chaque section recopie l'en-tête de la précédente : le bouton <strong>Lier au précédent</strong> (Outils En-têtes) est activé. Pour un en-tête ou une numérotation propre à une section (après un saut de section, jour 5), il faut <strong>désactiver Lier au précédent</strong> dans la nouvelle section, puis taper le nouvel en-tête.</p>
<pre class="pseudo">Onglet En-tête et pied de page ▸ Navigation ▸ Lier au précédent (désactiver)</pre>
<div class="warn">C'est l'erreur classique : on modifie l'en-tête d'un chapitre et tous les autres changent aussi, parce que « Lier au précédent » était encore actif. Rompez le lien AVANT de taper.</div>
<h3>6. Insérer des informations dynamiques</h3>
<p>L'onglet contextuel propose « Composants QuickPart » et « Informations sur le document » pour insérer titre, auteur, date, chemin du fichier… sous forme de champs qui se mettent à jour automatiquement.</p>`,
  exercises: [
    { type: "qcm", q: "L'en-tête est la zone répétée…", opts: ["En bas de chaque page", "En haut de chaque page", "Au centre", "Dans la marge de droite"], a: 1, exp: "En-tête = haut de page ; pied de page = bas de page." },
    { type: "qcm", q: "Comment entrer rapidement dans l'en-tête ?", opts: ["Un double-clic dans la marge haute", "Un clic sur Fichier", "Appuyer sur F5", "Un clic droit sur le texte"], a: 0, exp: "Le double-clic dans la marge haute ouvre l'en-tête." },
    { type: "vf", q: "Le numéro de page est un champ qui se met à jour automatiquement.", a: true, exp: "C'est le champ PAGE : la pagination suit les changements du document." },
    { type: "qcm", q: "Pour afficher « Page 3 sur 12 », quels champs combiner ?", opts: ["PAGE et NUMPAGES", "DATE et TIME", "AUTHOR et TITLE", "REF et SEQ"], a: 0, exp: "PAGE = page courante, NUMPAGES = nombre total de pages." },
    { type: "qcm", q: "Comment mettre une page de garde sans numéro tout en numérotant la suite ?", opts: ["Supprimer toutes les pages", "Cocher « Première page différente » et laisser son pied vide", "Changer la police", "Insérer un tableau"], a: 1, exp: "« Première page différente » masque le numéro sur la 1re page uniquement." },
    { type: "qcm", q: "Le bouton « Lier au précédent » sert à…", opts: ["Imprimer", "Lier ou délier l'en-tête d'une section à celui de la section précédente", "Insérer une image", "Changer les marges"], a: 1, exp: "Actif, il recopie l'en-tête précédent ; inactif, l'en-tête devient indépendant." },
    { type: "vf", q: "Après un saut de section, l'en-tête est indépendant par défaut.", a: false, exp: "Au contraire : il reste lié au précédent tant qu'on ne rompt pas le lien." },
    { type: "qcm", q: "Où change-t-on le format i, ii, iii des numéros ?", opts: ["Accueil ▸ Police", "Insertion ▸ Numéro de page ▸ Format des numéros de page", "Révision ▸ Langue", "Affichage ▸ Zoom"], a: 1, exp: "La boîte « Format des numéros » propose 1/2/3, i/ii/iii, a/b/c, etc." },
    { type: "qcm", q: "« Pages paires et impaires différentes » sert surtout pour…", opts: ["Les e-mails", "Les livres reliés avec en-têtes gauche/droite distincts", "Les tableaux", "Les images"], a: 1, exp: "Elle permet un en-tête différent selon page de gauche ou de droite." },
    { type: "vf", q: "On peut insérer la date, l'auteur ou le titre du document dans l'en-tête sous forme de champ.", a: true, exp: "Les Composants QuickPart / Informations du document offrent ces champs." },
    { type: "qcm", q: "Pour redémarrer la numérotation à 1 dans une nouvelle section…", opts: ["Insertion ▸ Numéro de page ▸ Format ▸ Commencer à 1", "Retaper les numéros à la main", "Changer les marges", "Ajouter un en-tête"], a: 0, exp: "« Commencer à 1 » dans le format s'applique à la section courante." },
    { type: "qcm", q: "Erreur classique : vous modifiez un en-tête et tous les chapitres changent. Pourquoi ?", opts: ["L'option « Première page différente » est cochée", "« Lier au précédent » était encore actif", "La police est trop grande", "Le zoom est mauvais"], a: 1, exp: "Le lien recopie les en-têtes entre sections : il faut le rompre d'abord." },
    { type: "qcm", q: "Le pied de page contient typiquement…", opts: ["Le corps du texte", "Le numéro de page ou une mention légale", "Les images principales", "La table des matières"], a: 1, exp: "Numéro de page, copyright, confidentialité… vont au pied de page." },
    { type: "vf", q: "Modifier l'en-tête modifie aussi le corps du texte de la page.", a: false, exp: "En-tête et corps sont des zones distinctes et indépendantes." },
    { type: "qcm", q: "Comment quitter la zone d'en-tête pour revenir au corps ?", opts: ["Fermer Word", "Double-cliquer dans le corps du texte ou cliquer « Fermer l'en-tête »", "Appuyer sur Suppr", "Changer d'onglet du ruban"], a: 1, exp: "Un double-clic dans le corps ou le bouton « Fermer » sort de l'en-tête." }
  ],
  final: {
    title: "Exercice final — Un rapport paginé proprement",
    intro: `<p>Vous devez livrer un rapport : page de garde sans numéro, en-tête « Rapport 2026 – Confidentiel » à partir de la page 2, et pieds de page au format « Page X sur Y ».</p>
<pre class="pseudo">Ruban ▸ Insertion ▸ En-tête et pied de page ▸ Numéro de page / En-tête</pre>`,
    questions: [
      { type: "qcm", q: "Comment éviter le numéro sur la page de garde ?", opts: ["Cocher « Première page différente »", "Supprimer la page", "Changer la police", "Insérer un tableau"], a: 0, exp: "« Première page différente » libère l'en-tête/pied de la 1re page." },
      { type: "qcm", q: "Pour « Page X sur Y », que faut-il insérer ?", opts: ["Un modèle de numéro ou les champs PAGE et NUMPAGES", "Une image", "Un commentaire", "Un saut de page"], a: 0, exp: "Les champs PAGE et NUMPAGES donnent page courante et total." },
      { type: "qcm", q: "L'en-tête « Rapport 2026 » doit apparaître dès la page 2. Où le taper ?", opts: ["Dans l'en-tête, après avoir décoché « Première page différente » sur la garde ou en tapant dans l'en-tête des pages suivantes", "Dans le corps de la page 1", "Dans un commentaire", "Dans les propriétés du fichier uniquement"], a: 0, exp: "Avec « Première page différente », l'en-tête tapé n'apparaît qu'à partir de la page 2." },
      { type: "vf", q: "Le numéro de page se recalcule tout seul si on ajoute des pages.", a: true, exp: "C'est un champ dynamique, pas un texte figé." },
      { type: "qcm", q: "Si le rapport a plusieurs chapitres avec en-têtes propres, quel réglage surveiller ?", opts: ["La couleur du texte", "Le bouton « Lier au précédent » de chaque section", "Le zoom", "La langue"], a: 1, exp: "Rompre le lien dans chaque nouvelle section rend les en-têtes indépendants." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Double-cliquer dans la marge haute pour ouvrir l'en-tête
2. Cocher « Première page différente » (onglet En-tête et pied de page)
3. Se placer dans l'en-tête d'une page ≥ 2 et taper : Rapport 2026 – Confidentiel
4. Aller dans le pied de page : Insertion ▸ Numéro de page ▸ Bas de page ▸ modèle « Page X sur Y »
5. (ou insérer manuellement le champ PAGE, taper « sur », insérer NUMPAGES)
6. Vérifier que la page de garde n'a ni en-tête ni numéro
7. Fermer l'en-tête (double-clic dans le corps)</pre>
<p>La numérotation reste correcte et l'en-tête n'apparaît qu'à partir de la page 2.</p>`
  }
};
</script>
