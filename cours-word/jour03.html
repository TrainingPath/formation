<script>
var DAY = {
  num: 3,
  title: "Créer et modifier un jeu de styles et un thème",
  subtitle: "Habiller tout un document d'un seul clic, de façon cohérente.",
  theory: `
<h3>1. Trois notions à ne pas confondre</h3>
<ul>
<li>Un <strong>style</strong> (vu au jour 2) met en forme un type d'élément (un titre, un paragraphe).</li>
<li>Un <strong>jeu de styles</strong> (ou « ensemble de styles ») est une combinaison cohérente de TOUS les styles (Titre 1, Titre 2, Normal…) : il change l'allure globale du texte.</li>
<li>Un <strong>thème</strong> définit les <strong>polices</strong> (une police de titres, une de corps) et une <strong>palette de couleurs</strong> réutilisées par tous les styles et objets du document.</li>
</ul>
<p>Autrement dit : le thème fournit les briques (couleurs + polices), le jeu de styles décide comment les assembler.</p>
<h3>2. Changer de jeu de styles</h3>
<pre class="pseudo">Ruban ▸ Création ▸ Mise en forme du document     // galerie de jeux de styles</pre>
<div class="warn">Attention au nom d'onglet : dans Word 365 et 2019/2021 en français, l'onglet s'appelle <strong>Création</strong> (dans de très anciennes versions il pouvait s'appeler « Conception »). C'est là que vivent jeux de styles, thèmes, couleurs, polices et filigrane.</div>
<h3>3. Changer le thème, les couleurs, les polices</h3>
<pre class="pseudo">Ruban ▸ Création ▸ Thèmes            // change polices + couleurs d'un coup
Ruban ▸ Création ▸ Couleurs          // change seulement la palette
Ruban ▸ Création ▸ Polices           // change seulement le couple de polices</pre>
<p>Un thème s'applique aussi à Excel et PowerPoint : c'est ce qui permet d'harmoniser un rapport, un tableau et une présentation.</p>
<h3>4. Créer son propre jeu de couleurs / polices</h3>
<p>Dans <code>Création ▸ Couleurs ▸ Personnaliser les couleurs…</code> vous choisissez chaque teinte (accentuation 1 à 6, etc.) et vous l'enregistrez sous un nom. Idem pour <code>Création ▸ Polices ▸ Personnaliser les polices…</code> (une police de titre, une de corps).</p>
<h3>5. Enregistrer son propre thème</h3>
<pre class="pseudo">Ruban ▸ Création ▸ Thèmes ▸ Enregistrer le thème actif…     // fichier .thmx</pre>
<p>Le thème est stocké en <code>.thmx</code> et devient disponible dans tous les documents Office.</p>
<h3>6. Enregistrer son propre jeu de styles</h3>
<pre class="pseudo">Ruban ▸ Création ▸ Mise en forme du document ▸ Enregistrer comme nouveau jeu de styles…</pre>
<div class="tip">Un thème et un jeu de styles maison enregistrés = votre charte graphique. Combinés à un modèle (.dotx, jour 12), ils donnent des documents impeccables sans reformater. C'est ce qui distingue un service com bien outillé.</div>
<h3>7. Définir le style par défaut d'un document</h3>
<p>Dans le volet Styles, « Gérer les styles » ▸ onglet « Par défaut » permet de fixer police et taille de départ. On peut cocher « Nouveaux documents basés sur ce modèle » pour rendre le choix permanent.</p>
<div class="warn">Ne confondez pas « ce document » et « tous les nouveaux documents » : cette dernière option modifie le modèle Normal.dotm et affecte tous vos futurs fichiers.</div>`,
  exercises: [
    { type: "qcm", q: "Que définit un thème ?", opts: ["Uniquement l'orientation de la page", "Un couple de polices et une palette de couleurs", "Le nombre de pages", "Les marges"], a: 1, exp: "Un thème = polices (titre + corps) + palette de couleurs, réutilisées partout." },
    { type: "qcm", q: "Qu'est-ce qu'un jeu de styles ?", opts: ["Une seule police", "Une combinaison cohérente de tous les styles du document", "Un dossier de documents", "Un raccourci clavier"], a: 1, exp: "Il fixe l'allure d'ensemble en coordonnant Titre 1, Titre 2, Normal, etc." },
    { type: "qcm", q: "Dans quel onglet du ruban trouve-t-on thèmes et jeux de styles ?", opts: ["Accueil", "Insertion", "Création", "Révision"], a: 2, exp: "L'onglet Création regroupe Mise en forme du document, Thèmes, Couleurs, Polices." },
    { type: "vf", q: "Un thème Office peut être partagé entre Word, Excel et PowerPoint.", a: true, exp: "Les thèmes sont communs à Office : d'où l'harmonisation possible." },
    { type: "qcm", q: "Sous quelle extension s'enregistre un thème personnalisé ?", opts: [".docx", ".thmx", ".dotx", ".txt"], a: 1, exp: "Un thème enregistré porte l'extension .thmx." },
    { type: "qcm", q: "Comment ne changer QUE la palette de couleurs sans toucher les polices ?", opts: ["Création ▸ Thèmes", "Création ▸ Couleurs", "Accueil ▸ Police", "Insertion ▸ Formes"], a: 1, exp: "Création ▸ Couleurs modifie seulement la palette." },
    { type: "vf", q: "Le thème fournit les couleurs et polices, le jeu de styles décide comment les assembler.", a: true, exp: "Bonne image : briques (thème) vs assemblage (jeu de styles)." },
    { type: "qcm", q: "Où enregistrer un jeu de styles personnalisé ?", opts: ["Fichier ▸ Imprimer", "Création ▸ Mise en forme du document ▸ Enregistrer comme nouveau jeu de styles", "Insertion ▸ En-tête", "Révision ▸ Langue"], a: 1, exp: "La galerie « Mise en forme du document » propose l'enregistrement." },
    { type: "qcm", q: "Personnaliser les couleurs permet de définir…", opts: ["Le zoom", "Chaque teinte d'accentuation et de fond, enregistrée sous un nom", "La langue du correcteur", "La taille du papier"], a: 1, exp: "On règle accentuations 1 à 6, hyperliens, arrière-plans, puis on nomme le jeu." },
    { type: "vf", q: "Modifier les polices du thème peut changer l'aspect de tous les styles qui héritent de ces polices.", a: true, exp: "Les styles référencent « police du thème » : changer le thème les met à jour." },
    { type: "qcm", q: "L'option « Définir par défaut » dans Gérer les styles avec « tous les nouveaux documents » modifie…", opts: ["Uniquement ce document", "Le modèle Normal.dotm, donc tous les futurs documents", "Rien du tout", "Le pied de page"], a: 1, exp: "Cette case touche Normal.dotm et donc l'ensemble des nouveaux fichiers." },
    { type: "qcm", q: "Pour harmoniser un rapport Word et une présentation PowerPoint, le plus efficace est…", opts: ["Recopier les couleurs à la main", "Appliquer le même thème dans les deux", "Changer la résolution de l'écran", "Rien, c'est impossible"], a: 1, exp: "Un thème commun garantit polices et couleurs identiques." },
    { type: "vf", q: "Changer de jeu de styles reformate à la main chaque paragraphe un par un.", a: false, exp: "C'est justement l'inverse : tout se met à jour d'un seul clic." },
    { type: "qcm", q: "Un couple de polices dans un thème comprend en général…", opts: ["Une seule police", "Une police pour les titres et une pour le corps du texte", "Quatre polices minimum", "Aucune police"], a: 1, exp: "Le thème définit une police de titres et une police de corps." },
    { type: "qcm", q: "Quel est l'intérêt pratique d'un thème + jeu de styles maison ?", opts: ["Réduire la taille du document", "Constituer une charte graphique réutilisable pour des documents cohérents sans reformater", "Accélérer la frappe au clavier", "Protéger le document en lecture seule"], a: 1, exp: "C'est une charte prête à l'emploi, gage de cohérence et de gain de temps." }
  ],
  final: {
    title: "Exercice final — La charte graphique du service",
    intro: `<p>Votre service veut une identité visuelle : titres en une police, corps en une autre, une couleur d'accent bordeaux, et un aspect global sobre. Vous devez pouvoir l'appliquer à tous vos futurs rapports.</p>
<pre class="pseudo">Ruban ▸ Création ▸ Polices / Couleurs / Thèmes / Mise en forme du document</pre>`,
    questions: [
      { type: "qcm", q: "Par quoi commencer pour fixer les deux polices ?", opts: ["Création ▸ Polices ▸ Personnaliser les polices", "Accueil ▸ Gras", "Insertion ▸ Zone de texte", "Révision ▸ Traduire"], a: 0, exp: "On définit d'abord le couple police de titres / police de corps." },
      { type: "qcm", q: "Comment obtenir l'accent bordeaux dans toute la palette ?", opts: ["Coloriser chaque titre à la main", "Création ▸ Couleurs ▸ Personnaliser les couleurs", "Changer la couleur de page du document", "Insérer une image bordeaux"], a: 1, exp: "On personnalise la palette et on la nomme." },
      { type: "qcm", q: "Comment conserver l'ensemble polices + couleurs pour d'autres logiciels Office ?", opts: ["L'imprimer", "Création ▸ Thèmes ▸ Enregistrer le thème actif (.thmx)", "Le copier dans un e-mail", "Faire une capture d'écran"], a: 1, exp: "Le thème .thmx est réutilisable dans tout Office." },
      { type: "vf", q: "Pour retrouver l'aspect global (assemblage des styles) sur d'autres documents, on enregistre aussi un jeu de styles.", a: true, exp: "Thème (briques) + jeu de styles (assemblage) forment la charte complète." },
      { type: "qcm", q: "Pour que chaque nouveau rapport démarre déjà avec cette charte, la meilleure approche est…", opts: ["Refaire la manip à chaque fois", "Enregistrer un modèle .dotx contenant thème et styles (jour 12)", "Envoyer un e-mail de rappel", "Rien"], a: 1, exp: "Un modèle .dotx fige la charte pour tout nouveau document basé dessus." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Création ▸ Polices ▸ Personnaliser les polices ▸ choisir police titres + corps ▸ Enregistrer
2. Création ▸ Couleurs ▸ Personnaliser les couleurs ▸ régler l'accentuation en bordeaux ▸ Enregistrer
3. Ajuster éventuellement Création ▸ Mise en forme du document (jeu de styles sobre)
4. Création ▸ Thèmes ▸ Enregistrer le thème actif ▸ nommer le fichier .thmx
5. Création ▸ Mise en forme du document ▸ Enregistrer comme nouveau jeu de styles
6. Pour l'automatiser : enregistrer le document vide comme modèle .dotx (voir jour 12)</pre>
<p>Résultat : une charte graphique cohérente, réutilisable et transférable à tout Office.</p>`
  }
};
</script>
