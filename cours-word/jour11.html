  title: "Images, habillage du texte et SmartArt",
  subtitle: "Placer et habiller des visuels sans casser la mise en page.",
  theory: `
<h3>1. Insérer une image</h3>
<pre class="pseudo">Ruban ▸ Insertion ▸ Illustrations ▸ Images (Cet appareil / Images en ligne / Images de stock)</pre>
<div class="tip">« Images de stock » et « Icônes » sont surtout disponibles dans Word 365 (banque intégrée d'images et pictos libres de droits). Dans Office 2019/2021, l'offre est plus limitée ; « Images en ligne » (recherche Bing) reste disponible.</div>
<h3>2. La notion clé : l'habillage du texte</h3>
<p>L'<strong>habillage</strong> décrit comment le texte se comporte autour de l'image. C'est LE réglage qui distingue une image bien intégrée d'une image qui saute partout.</p>
<pre class="pseudo">Clic sur l'image ▸ Format de l'image ▸ Habillage du texte :
  • Aligné sur le texte  // l'image se comporte comme une (grosse) lettre dans la ligne
  • Carré / Rapproché     // le texte contourne l'image
  • Au travers            // le texte épouse les contours
  • Haut et bas           // texte au-dessus et en dessous seulement
  • Derrière le texte     // image en filigrane sous le texte
  • Devant le texte       // image posée par-dessus</pre>
<p>Le petit bouton « Options de disposition » (icône en arc) qui apparaît près de l'image donne accès rapidement à ces choix.</p>
<h3>3. Ancré vs aligné : le piège des sauts d'image</h3>
<div class="warn">Une image « Aligné sur le texte » suit le flux comme un caractère : si vous ajoutez une ligne au-dessus, elle descend proprement. Une image avec habillage (Carré, etc.) est <strong>ancrée</strong> à un paragraphe (petite ancre visible) et « flotte » : mal réglée, elle semble sauter d'une page à l'autre. Pour la stabiliser : Options de disposition ▸ « Corriger la position sur la page » ou « Déplacer avec le texte ».</div>
<h3>4. Rogner, redimensionner, comprimer</h3>
<pre class="pseudo">Format de l'image ▸ Rogner          // couper les bords de l'image
Format de l'image ▸ Taille          // largeur/hauteur (garder les proportions)
Format de l'image ▸ Compresser les images     // réduit le poids du fichier</pre>
<p>Redimensionnez toujours par un coin (proportions conservées) plutôt que par un bord (déformation).</p>
<h3>5. Position et alignement</h3>
<pre class="pseudo">Format de l'image ▸ Position     // 9 positions prédéfinies (avec habillage carré)
Format de l'image ▸ Aligner      // aligner/centrer par rapport à la page ou à la marge</pre>
<h3>6. SmartArt : des schémas en un clic</h3>
<p>Un <strong>SmartArt</strong> est un diagramme prêt à l'emploi (liste, processus, cycle, hiérarchie/organigramme, relation…). On tape le texte, Word dessine et met en forme automatiquement.</p>
<pre class="pseudo">Ruban ▸ Insertion ▸ Illustrations ▸ SmartArt
  • Choisir une catégorie (Processus, Cycle, Hiérarchie…)
  • Saisir le texte dans le volet Texte ▸ Word met en forme</pre>
<p>On peut convertir une liste à puces en SmartArt, changer les couleurs (styles SmartArt), ajouter/supprimer des formes, et repasser au style du thème.</p>
<div class="tip">Pour un organigramme d'entreprise, choisissez la catégorie Hiérarchie ; pour des étapes, un Processus. Les SmartArt héritent des couleurs du thème (jour 3) : ils restent cohérents avec le reste du document.</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce que l'habillage du texte ?", opts: ["La couleur de l'image", "La façon dont le texte se comporte autour de l'image", "La taille du fichier", "Le titre de l'image"], a: 1, exp: "L'habillage définit le contournement du texte autour de l'image." },
    { type: "qcm", q: "Une image « Aligné sur le texte » se comporte comme…", opts: ["Un filigrane", "Un gros caractère dans la ligne", "Un en-tête", "Un tableau"], a: 1, exp: "Elle suit le flux du texte comme une lettre." },

    { type: "qcm", q: "Que fait « Rogner » ?", opts: ["Réduit le poids du fichier", "Coupe les bords visibles de l'image", "Change les couleurs", "Ajoute une légende"], a: 1, exp: "Le rognage masque une partie des bords de l'image." },

    { type: "qcm", q: "Qu'est-ce qu'un SmartArt ?", opts: ["Une police", "Un diagramme prêt à l'emploi (processus, cycle, hiérarchie…)", "Un style de tableau", "Un en-tête"], a: 1, exp: "SmartArt = schéma automatique alimenté par du texte." },
    { type: "qcm", q: "Pour un organigramme d'entreprise, quelle catégorie SmartArt ?", opts: ["Cycle", "Hiérarchie", "Processus", "Relation"], a: 1, exp: "La catégorie Hiérarchie produit des organigrammes." },
    { type: "vf", q: "Les couleurs d'un SmartArt suivent le thème du document.", a: true, exp: "SmartArt hérite de la palette du thème pour rester cohérent." },
    { type: "qcm", q: "Le bouton « Options de disposition » près d'une image sert à…", opts: ["Imprimer", "Choisir rapidement l'habillage et le comportement de position", "Changer la langue", "Insérer un tableau"], a: 1, exp: "Il regroupe habillage et options « déplacer/fixer avec le texte »." },
    { type: "qcm", q: "Différence 365 vs 2019/2021 pour les visuels ?", opts: ["Aucune", "Images de stock et Icônes sont surtout dans 365", "2019 a plus d'images", "365 n'insère pas d'images"], a: 1, exp: "La banque d'images de stock et d'icônes est riche surtout dans 365." },
    { type: "qcm", q: "Pour stabiliser une image flottante qui saute de page, on peut…", opts: ["La supprimer", "Options de disposition ▸ Corriger la position sur la page", "Changer la police", "Réduire le zoom"], a: 1, exp: "« Corriger la position » fixe l'image par rapport à la page." },
    { type: "vf", q: "On peut convertir une liste à puces en SmartArt.", a: true, exp: "Word propose de transformer une liste en diagramme SmartArt." },
    { type: "qcm", q: "Pour aligner une image au centre de la page…", opts: ["Format de l'image ▸ Aligner ▸ Centrer (par rapport à la page)", "Accueil ▸ Gras", "Insertion ▸ En-tête", "Fichier ▸ Imprimer"], a: 0, exp: "L'outil Aligner centre l'image sur la page ou la marge." }
  ],

<pre class="pseudo">Ruban ▸ Insertion ▸ Images / SmartArt  puis  Format de l'image ▸ Habillage</pre>`,
    questions: [

      { type: "qcm", q: "Pour la photo en filigrane derrière un paragraphe…", opts: ["Devant le texte", "Derrière le texte", "Haut et bas", "Aligné sur le texte"], a: 1, exp: "« Derrière le texte » place la photo sous le paragraphe." },
      { type: "qcm", q: "Le schéma en 4 étapes se fait avec…", opts: ["Un tableau", "Un SmartArt de catégorie Processus", "Un en-tête", "Une note de bas de page"], a: 1, exp: "La catégorie Processus enchaîne des étapes." },
      { type: "vf", q: "Pour éviter les sauts d'image, on fixe la position (Corriger la position sur la page).", a: true, exp: "Fixer la position stabilise l'image lors des modifications de texte." },
      { type: "qcm", q: "Pour réduire le poids de la plaquette avant envoi…", opts: ["Compresser les images", "Changer la police", "Supprimer le texte", "Ajouter un commentaire"], a: 0, exp: "La compression des images allège le fichier." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Insertion ▸ Images ▸ insérer le logo
2. Sélectionner le logo ▸ Options de disposition ▸ Carré ▸ le placer en haut à droite
3. Options de disposition ▸ Corriger la position sur la page (anti-saut)
4. Insertion ▸ Images ▸ insérer la photo ▸ Habillage ▸ Derrière le texte ▸ la placer sous le paragraphe

7. Ajuster couleurs (styles SmartArt) pour suivre le thème
8. Format de l'image ▸ Compresser les images avant l'envoi</pre>
<p>Visuels bien intégrés, stables et légers.</p>`
  }
