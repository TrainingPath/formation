  num: 8,
  title: "Notes de bas de page, citations et bibliographie",
  subtitle: "Sourcer un document de façon professionnelle.",
  theory: `
<h3>1. Notes de bas de page et notes de fin</h3>
<ul>
<li>Une <strong>note de bas de page</strong> place un commentaire ou une source en bas de la même page, appelé par un petit numéro en exposant.</li>
<li>Une <strong>note de fin</strong> regroupe ces notes à la fin du document (ou de la section).</li>
</ul>
<pre class="pseudo">Ruban ▸ Références ▸ Notes de bas de page ▸ Insérer une note de bas de page
Ctrl + Alt + B          // insérer une note de bas de page
Ctrl + Alt + F          // insérer une note de fin</pre>
<div class="tip">La numérotation est automatique : insérez une note entre deux autres, tout se renumérote. Le lanceur du groupe « Notes de bas de page » ouvre les options (format des numéros, emplacement, conversion note de bas ↔ note de fin).</div>
<h3>2. Le système de citations et bibliographie</h3>
<p>Word gère des <strong>sources</strong> (livres, articles, sites…) et peut insérer des <strong>citations</strong> dans le texte puis générer une <strong>bibliographie</strong> automatique, le tout dans un <strong>style bibliographique</strong> normalisé (APA, ISO 690, MLA…).</p>
<pre class="pseudo">Ruban ▸ Références ▸ Citations et bibliographie :
  • Style : APA / ISO 690 / MLA / Chicago…
  • Insérer une citation ▸ Ajouter une nouvelle source…
  • Gérer les sources (bibliothèque des références)
  • Bibliographie (insère la liste)</pre>
<h3>3. Ajouter une source</h3>
<p>« Insérer une citation ▸ Ajouter une nouvelle source » ouvre un formulaire : type (livre, article…), auteur, titre, année, éditeur… La source est stockée et réutilisable. La citation apparaît dans le texte selon le style choisi (par ex. « (Dupont, 2024) »).</p>
<h3>4. Gérer les sources</h3>
<p>Le <strong>Gestionnaire de sources</strong> distingue la <strong>liste principale</strong> (bibliothèque commune à tous vos documents) et la <strong>liste active</strong> (sources utilisées dans le document courant). On y copie, modifie, supprime les références.</p>
<pre class="pseudo">Références ▸ Gérer les sources     // liste principale ↔ liste active</pre>
<h3>5. Générer et mettre à jour la bibliographie</h3>
<pre class="pseudo">Références ▸ Bibliographie ▸ (choisir un modèle ou « Insérer la bibliographie »)</pre>
<p>Comme la TDM, la bibliographie est un champ : après avoir ajouté des citations, cliquez dessus et « Mettre à jour les citations et la bibliographie ».</p>
<h3>6. Changer de style bibliographique</h3>
<div class="warn">Changer le style (APA → ISO 690) reformate d'un coup TOUTES les citations et la bibliographie. Vérifiez toutefois le résultat : selon les versions de Word, certains styles (par ex. les variantes récentes d'APA 7) peuvent manquer ou différer légèrement. Word 365 est régulièrement mis à jour ; 2019/2021 dispose d'une liste plus figée.</div>
<h3>7. Note vs citation : que choisir ?</h3>
<p>Une <strong>note de bas de page</strong> convient pour un commentaire, une précision ou une source ponctuelle. Le <strong>système de citations</strong> convient dès qu'on a beaucoup de références et qu'on veut une bibliographie normalisée et cohérente. Les deux peuvent coexister.</p>`,

    { type: "qcm", q: "Quel raccourci insère une note de bas de page ?", opts: ["Ctrl + Alt + B", "Ctrl + B", "Alt + B", "Ctrl + Maj + B"], a: 0, exp: "Ctrl + Alt + B insère une note de bas de page." },

    { type: "vf", q: "La bibliographie est un champ qu'il faut mettre à jour après ajout de citations.", a: true, exp: "Comme la TDM, elle ne se recalcule pas seule pendant la frappe." },
    { type: "qcm", q: "La « liste principale » du gestionnaire de sources est…", opts: ["Les sources du seul document courant", "La bibliothèque commune à tous vos documents", "Les images", "Les commentaires"], a: 1, exp: "Liste principale = bibliothèque globale ; liste active = document courant." },
    { type: "qcm", q: "Changer le style APA en ISO 690…", opts: ["Ne change rien", "Reformate toutes les citations et la bibliographie d'un coup", "Supprime les sources", "Imprime le document"], a: 1, exp: "Le changement de style se répercute sur l'ensemble des références." },
    { type: "vf", q: "Notes de bas de page et système de citations peuvent coexister dans un même document.", a: true, exp: "On peut mêler notes explicatives et citations bibliographiques." },
    { type: "qcm", q: "Quel raccourci insère une note de fin ?", opts: ["Ctrl + Alt + F", "Ctrl + F", "Alt + F", "Ctrl + Maj + F"], a: 0, exp: "Ctrl + Alt + F insère une note de fin." },
    { type: "qcm", q: "Pour beaucoup de références et une bibliographie normalisée, on préfère…", opts: ["Uniquement des notes de bas de page", "Le système Citations et bibliographie", "Un tableau", "Des commentaires"], a: 1, exp: "Le système de citations gère un grand volume de sources de façon cohérente." },
    { type: "vf", q: "Une source ajoutée peut être réutilisée dans plusieurs documents via la liste principale.", a: true, exp: "La bibliothèque principale rend les sources réutilisables partout." },
    { type: "qcm", q: "Différence entre Word 365 et 2019/2021 sur les styles bibliographiques ?", opts: ["Aucune", "365 est régulièrement mis à jour ; 2019/2021 a une liste plus figée", "365 n'a pas de bibliographie", "2019 a plus de styles"], a: 1, exp: "Les styles disponibles évoluent avec les mises à jour de 365." },
    { type: "qcm", q: "Comment convertir toutes les notes de bas de page en notes de fin ?", opts: ["Impossible", "Lanceur du groupe Notes de bas de page ▸ Convertir", "Changer la police", "Supprimer puis retaper"], a: 1, exp: "La boîte d'options des notes propose la conversion en masse." }
  ],
  final: {
    title: "Exercice final — Un article sourcé",
    intro: `<p>Vous rédigez un article de 5 pages. Vous devez ajouter une note de bas de page explicative, insérer deux citations de sources (un livre, un article), choisir le style APA, puis générer une bibliographie à la fin.</p>
<pre class="pseudo">Ruban ▸ Références ▸ Notes de bas de page / Citations et bibliographie</pre>`,
    questions: [
      { type: "qcm", q: "Pour une simple précision au bas de la page, on insère…", opts: ["Une bibliographie", "Une note de bas de page (Ctrl + Alt + B)", "Un tableau", "Un en-tête"], a: 1, exp: "La note de bas de page convient aux commentaires ponctuels." },
      { type: "qcm", q: "Avant d'insérer les citations, que régler ?", opts: ["Le zoom", "Le style bibliographique (ex. APA)", "Les marges", "La langue de l'interface"], a: 1, exp: "Fixer le style d'abord évite de tout reformater ensuite." },
      { type: "qcm", q: "Comment saisir une nouvelle référence de livre ?", opts: ["Insérer une citation ▸ Ajouter une nouvelle source ▸ type Livre", "Insertion ▸ Image", "Accueil ▸ Gras", "Fichier ▸ Imprimer"], a: 0, exp: "Le formulaire de source permet de choisir le type Livre et ses champs." },
      { type: "vf", q: "Après avoir ajouté la deuxième citation, il faut mettre à jour la bibliographie.", a: true, exp: "La bibliographie est un champ : on la met à jour pour inclure la nouvelle source." },
      { type: "qcm", q: "Si vous devez finalement rendre le tout en ISO 690, que faire ?", opts: ["Retaper toutes les citations", "Changer le Style dans Références ▸ tout se reformate", "Supprimer la bibliographie", "Changer de police"], a: 1, exp: "Le changement de style reformate citations et bibliographie automatiquement." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Placer le curseur après le mot à annoter ▸ Ctrl + Alt + B ▸ taper la note
2. Références ▸ Style ▸ APA
3. Curseur après la 1re affirmation ▸ Insérer une citation ▸ Ajouter une nouvelle source ▸ type Livre ▸ remplir ▸ OK
4. Curseur après la 2e affirmation ▸ Insérer une citation ▸ Ajouter une nouvelle source ▸ type Article ▸ remplir ▸ OK
5. Aller à la fin ▸ Références ▸ Bibliographie ▸ Insérer la bibliographie
6. Après tout ajout : clic sur la bibliographie ▸ Mettre à jour les citations et la bibliographie
7. (Optionnel) Changer Style ▸ ISO 690 : tout se reformate</pre>
<p>L'article est sourcé, cohérent et conforme au style choisi.</p>`
  }
};
