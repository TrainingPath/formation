<script>
var DAY = {
  num: 16,
  title: "Formulaires à remplir : contrôles de contenu",
  subtitle: "Créer un document où l'on ne remplit que les zones prévues.",
  theory: `
<h3>1. À quoi sert un formulaire Word ?</h3>
<p>Un <strong>formulaire</strong> est un document dont certaines zones sont à compléter (texte, date, choix dans une liste, case à cocher) tandis que le reste est verrouillé. Idéal pour une fiche d'inscription, un contrat, une demande de congés : l'utilisateur ne peut modifier que les champs prévus.</p>
<h3>2. L'onglet Développeur</h3>
<p>Les outils de formulaire vivent dans l'onglet <strong>Développeur</strong>, masqué par défaut :</p>
<pre class="pseudo">Fichier ▸ Options ▸ Personnaliser le ruban ▸ cocher « Développeur » ▸ OK</pre>
<h3>3. Les contrôles de contenu</h3>
<p>Un <strong>contrôle de contenu</strong> est une zone interactive insérable dans le texte. Types principaux (groupe Contrôles de l'onglet Développeur) :</p>
<pre class="pseudo">Développeur ▸ Contrôles :
  • Texte enrichi / Texte brut     // zone de saisie
  • Sélecteur de dates             // calendrier
  • Liste déroulante               // choix dans une liste (valeurs figées)
  • Zone de liste modifiable       // liste + saisie libre possible
  • Case à cocher                  // oui/non
  • Contrôle d'image               // insérer une image
  • Liste de blocs de construction // insérer un contenu prédéfini</pre>
<div class="warn">Ne confondez pas les <strong>contrôles de contenu</strong> (modernes, recommandés) avec les vieux <strong>« champs de formulaire hérités »</strong> (Legacy) du même groupe : ces derniers subsistent pour compatibilité mais sont moins pratiques. Préférez les contrôles de contenu.</div>
<h3>4. Configurer un contrôle</h3>
<p>Sélectionnez le contrôle puis « Propriétés » (onglet Développeur) : titre, étiquette, texte d'espace réservé, et surtout, pour une liste, les <strong>éléments</strong> proposés. On peut aussi cocher « Le contrôle ne peut pas être supprimé » et « Le contenu ne peut pas être modifié ».</p>
<pre class="pseudo">Développeur ▸ Contrôles ▸ Propriétés     // règle titre, liste de choix, verrouillage</pre>
<h3>5. Le mode Création</h3>
<div class="tip">Le bouton « Mode Création » (onglet Développeur) permet de VOIR et éditer les contrôles (leurs balises, leur texte d'invite). Désactivez-le pour tester le formulaire comme le fera l'utilisateur. Un réflexe : concevoir en Mode Création ON, tester en Mode Création OFF.</div>
<h3>6. Protéger le formulaire</h3>
<p>Pour empêcher toute modification hors des contrôles, on <strong>restreint la modification</strong> :</p>
<pre class="pseudo">Développeur ▸ Restreindre la modification :
  • Cocher « Autoriser uniquement ce type de modifications »
  • Choisir « Remplissage de formulaires »
  • « Activer la protection » ▸ (mot de passe facultatif)</pre>
<p>Une fois protégé, l'utilisateur peut passer de champ en champ avec la touche Tab et ne remplir que les contrôles.</p>
<h3>7. Réutiliser via un modèle</h3>
<p>Un formulaire se distribue idéalement comme <strong>modèle .dotx</strong> (jour 12) : chaque utilisateur en ouvre une copie vierge à remplir. Combiné à des contrôles liés à des champs, on peut même préparer une base à exploiter ensuite.</p>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'un contrôle de contenu ?", opts: ["Une police", "Une zone interactive à remplir (texte, date, liste, case…)", "Une marge", "Un style"], a: 1, exp: "C'est un champ de saisie interactif inséré dans le document." },
    { type: "qcm", q: "Où se trouvent les outils de formulaire ?", opts: ["Onglet Développeur", "Onglet Accueil", "Onglet Références", "Fichier ▸ Imprimer"], a: 0, exp: "Le groupe Contrôles est dans l'onglet Développeur." },
    { type: "vf", q: "L'onglet Développeur est masqué par défaut et s'active dans les Options.", a: true, exp: "Fichier ▸ Options ▸ Personnaliser le ruban ▸ cocher Développeur." },
    { type: "qcm", q: "Pour proposer un choix dans une liste figée, quel contrôle ?", opts: ["Sélecteur de dates", "Liste déroulante", "Case à cocher", "Contrôle d'image"], a: 1, exp: "La liste déroulante impose un choix parmi des valeurs prédéfinies." },
    { type: "qcm", q: "Pour saisir une date via un calendrier…", opts: ["Texte brut", "Sélecteur de dates", "Case à cocher", "Liste déroulante"], a: 1, exp: "Le sélecteur de dates ouvre un calendrier." },
    { type: "qcm", q: "Où définit-on les éléments d'une liste déroulante ?", opts: ["Dans Propriétés du contrôle", "Dans Accueil ▸ Police", "Dans Fichier ▸ Imprimer", "Dans Affichage"], a: 0, exp: "Le bouton Propriétés permet d'ajouter les choix de la liste." },
    { type: "vf", q: "Le Mode Création sert à voir et éditer les contrôles pendant la conception.", a: true, exp: "On conçoit en Mode Création ON, on teste en OFF." },
    { type: "qcm", q: "Comment empêcher la modification hors des contrôles ?", opts: ["Développeur ▸ Restreindre la modification ▸ Remplissage de formulaires", "Changer la police", "Insérer un tableau", "Réduire le zoom"], a: 0, exp: "La restriction « Remplissage de formulaires » verrouille tout sauf les contrôles." },
    { type: "qcm", q: "Une fois le formulaire protégé, comment passer d'un champ à l'autre ?", opts: ["Avec la touche Tab", "En fermant Word", "Avec F5", "Impossible"], a: 0, exp: "Tab fait circuler d'un contrôle au suivant." },
    { type: "vf", q: "Les contrôles de contenu modernes sont préférables aux champs de formulaire hérités.", a: true, exp: "Les Legacy subsistent pour compatibilité, mais sont moins pratiques." },
    { type: "qcm", q: "Pour un oui/non, quel contrôle ?", opts: ["Case à cocher", "Sélecteur de dates", "Contrôle d'image", "Texte enrichi"], a: 0, exp: "La case à cocher gère un état coché/non coché." },
    { type: "qcm", q: "Le meilleur format pour distribuer un formulaire réutilisable est…", opts: ["Un .docx envoyé à tous", "Un modèle .dotx (chacun ouvre une copie vierge)", "Un PDF", "Une image"], a: 1, exp: "Le modèle garantit une copie vierge à chaque remplissage." },
    { type: "qcm", q: "Le « texte d'espace réservé » d'un contrôle est…", opts: ["Le texte d'invite affiché tant que le champ est vide", "La police", "Le mot de passe", "Le titre du document"], a: 0, exp: "C'est l'invite (ex. « Cliquez ici pour saisir ») remplacée à la saisie." },
    { type: "vf", q: "Un contrôle peut être configuré pour ne pas pouvoir être supprimé.", a: true, exp: "Ses Propriétés offrent « Le contrôle ne peut pas être supprimé »." },
    { type: "qcm", q: "La « Zone de liste modifiable » diffère de la liste déroulante car…", opts: ["Elle n'a pas de choix", "Elle autorise aussi une saisie libre en plus des choix", "Elle insère une image", "Elle coche une case"], a: 1, exp: "Elle combine liste prédéfinie et saisie libre." }
  ],
  final: {
    title: "Exercice final — Fiche de demande de congés",
    intro: `<p>Vous créez une fiche : Nom (texte), Service (liste : RH, Compta, IT), Date de début (calendrier), Congés payés (case à cocher). Seuls ces champs doivent être modifiables ; le reste est verrouillé. La fiche sera distribuée comme modèle.</p>
<pre class="pseudo">Développeur ▸ Contrôles  puis  Restreindre la modification</pre>`,
    questions: [
      { type: "qcm", q: "Pour le champ Service (RH/Compta/IT), quel contrôle ?", opts: ["Texte brut", "Liste déroulante", "Sélecteur de dates", "Contrôle d'image"], a: 1, exp: "La liste déroulante impose les trois services." },
      { type: "qcm", q: "Où saisir les trois valeurs RH, Compta, IT ?", opts: ["Dans Propriétés du contrôle liste", "Dans l'en-tête", "Dans un commentaire", "Dans Fichier ▸ Imprimer"], a: 0, exp: "Les éléments de la liste se définissent dans Propriétés." },
      { type: "qcm", q: "Pour la date de début…", opts: ["Case à cocher", "Sélecteur de dates", "Texte enrichi", "Liste déroulante"], a: 1, exp: "Le sélecteur de dates ouvre un calendrier." },
      { type: "vf", q: "Pour verrouiller tout sauf les champs, on active « Remplissage de formulaires » dans Restreindre la modification.", a: true, exp: "Cette restriction n'autorise que le remplissage des contrôles." },
      { type: "qcm", q: "Avant distribution, comment vérifier que le formulaire se remplit bien ?", opts: ["Désactiver le Mode Création et tester la saisie", "L'imprimer seulement", "Changer la police", "Supprimer les contrôles"], a: 0, exp: "Mode Création OFF simule l'expérience de l'utilisateur final." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Fichier ▸ Options ▸ Personnaliser le ruban ▸ cocher Développeur
2. Activer « Mode Création »
3. Nom : Développeur ▸ Contrôle Texte enrichi (ou brut)
4. Service : Contrôle Liste déroulante ▸ Propriétés ▸ ajouter RH, Compta, IT
5. Date de début : Contrôle Sélecteur de dates
6. Congés payés : Contrôle Case à cocher
7. Désactiver « Mode Création » et tester la saisie
8. Développeur ▸ Restreindre la modification ▸ « Remplissage de formulaires » ▸ Activer la protection
9. Fichier ▸ Enregistrer sous ▸ Modèle Word (*.dotx) pour la distribution</pre>
<p>La fiche ne laisse remplir que les champs prévus.</p>`
  }
};
</script>
