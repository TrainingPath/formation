  title: "Sections et sauts (de page, de section)",
  subtitle: "Découper un document pour en varier la mise en page.",
  theory: `
<h3>1. Deux familles de sauts</h3>
<p>Un <strong>saut</strong> force le texte à changer d'endroit. Il en existe deux catégories bien distinctes :</p>
<ul>
<li>Le <strong>saut de page</strong> : le texte continue sur la page suivante, mais reste dans la <strong>même section</strong> (même en-tête, mêmes marges…).</li>
<li>Le <strong>saut de section</strong> : il crée une nouvelle <strong>section</strong>, c'est-à-dire une zone du document qui peut avoir sa propre mise en page (orientation, colonnes, marges, en-têtes, numérotation).</li>
</ul>
<p>Une <strong>section</strong> est donc un « compartiment » indépendant du document. Tant qu'il n'y a pas de saut de section, tout le document est une seule et même section.</p>
<h3>2. Le saut de page</h3>
<pre class="pseudo">Ctrl + Entrée          // saut de page manuel
Ruban ▸ Insertion ▸ Pages ▸ Saut de page</pre>
<div class="warn">N'utilisez JAMAIS des Entrée répétés pour aller à la page suivante : dès que vous ajoutez du texte plus haut, tout se décale. Le saut de page (Ctrl + Entrée) reste solidaire du texte.</div>
<h3>3. Les quatre types de sauts de section</h3>
<pre class="pseudo">Ruban ▸ Mise en page ▸ Sauts ▸ Sauts de section :
  • Page suivante   // la nouvelle section démarre sur la page suivante
  • Continu         // nouvelle section sur la même page (ex. passer en 2 colonnes)
  • Page paire      // démarre sur la prochaine page paire
  • Page impaire    // démarre sur la prochaine page impaire (chapitres à droite)</pre>
<h3>4. À quoi servent les sections ?</h3>
<p>Dès que vous voulez qu'une PARTIE du document diffère du reste, il faut une section :</p>
<ul>
<li>une page en paysage au milieu (jour 4) ;</li>
<li>un en-tête ou une numérotation différente par chapitre (jour 6) ;</li>
<li>passer une zone en colonnes (saut continu) ;</li>
<li>redémarrer la numérotation des pages à 1.</li>
</ul>
<h3>5. Voir les sauts</h3>
<p>Activez les marques de mise en forme pour visualiser les sauts (ils apparaissent en pointillés avec leur type) :</p>
<pre class="pseudo">Ctrl + Maj + 8          // afficher/masquer les marques ¶ (pieds-de-mouche)
Ruban ▸ Accueil ▸ Paragraphe ▸ Afficher tout (¶)</pre>
<h3>6. Le lien caché entre sections : « Lier au précédent »</h3>
<div class="tip">Quand vous créez une section, ses en-têtes/pieds de page restent par défaut « Liés au précédent » : ils recopient la section d'avant. Pour vraiment les rendre indépendants (jour 6), il faudra désactiver ce lien. C'est LA source de confusion n°1 avec les sections.</div>
<h3>7. Supprimer un saut</h3>
<p>Placez le curseur juste avant le saut (marques affichées) et appuyez sur Suppr. Supprimer un saut de section fusionne les deux sections : la partie du haut prend alors la mise en page de la section du bas.</p>
<div class="warn">Piège : supprimer un saut de section peut faire disparaître une orientation ou une numérotation spécifique, car la zone fusionne avec la section suivante. Vérifiez la mise en page après suppression.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle est la différence entre saut de page et saut de section ?", opts: ["Aucune", "Le saut de section crée une zone à mise en page indépendante, pas le saut de page", "Le saut de page change les marges", "Le saut de section imprime la page"], a: 1, exp: "Le saut de section ouvre un compartiment à mise en page propre." },
    { type: "qcm", q: "Quel raccourci insère un saut de page ?", opts: ["Ctrl + Entrée", "Ctrl + Maj + Entrée", "Alt + Entrée", "Entrée"], a: 0, exp: "Ctrl + Entrée = saut de page." },
    { type: "vf", q: "Appuyer plusieurs fois sur Entrée est une bonne façon d'aller à la page suivante.", a: false, exp: "Le texte se décale dès qu'on modifie le contenu au-dessus : utilisez un saut de page." },
    { type: "qcm", q: "Quel type de saut de section garde la nouvelle section sur la même page ?", opts: ["Page suivante", "Continu", "Page paire", "Page impaire"], a: 1, exp: "Le saut « Continu » démarre la section sur la même page (ex. pour des colonnes)." },

    { type: "qcm", q: "Qu'est-ce qu'une section ?", opts: ["Un paragraphe", "Une zone du document avec sa propre mise en page possible", "Un style de titre", "Un commentaire"], a: 1, exp: "Une section est un compartiment indépendant (orientation, colonnes, en-têtes…)." },
    { type: "vf", q: "Sans aucun saut de section, tout le document forme une seule section.", a: true, exp: "Les sauts de section sont ce qui découpe le document en sections." },

    { type: "qcm", q: "Où insère-t-on un saut de section ?", opts: ["Accueil ▸ Police", "Mise en page ▸ Sauts", "Insertion ▸ Tableau", "Révision ▸ Commentaires"], a: 1, exp: "Le menu Sauts de l'onglet Mise en page contient page et section." },
    { type: "vf", q: "Les en-têtes d'une nouvelle section sont par défaut « Liés au précédent ».", a: true, exp: "Ils recopient la section d'avant tant qu'on ne rompt pas le lien." },
    { type: "qcm", q: "Supprimer un saut de section a pour effet…", opts: ["De rien changer", "De fusionner les deux sections, la zone du haut prenant la mise en page de la section du bas", "De supprimer une page de texte", "De changer la police"], a: 1, exp: "Les deux sections fusionnent ; attention à l'orientation/numérotation." },
    { type: "qcm", q: "Pour passer une zone de texte en deux colonnes au milieu d'une page, on utilise…", opts: ["Un saut de page", "Un saut de section continu", "Un saut de page impaire", "Un saut de colonne uniquement"], a: 1, exp: "Le saut continu isole la zone sans changer de page." },
    { type: "qcm", q: "Redémarrer la numérotation des pages à 1 pour une nouvelle partie nécessite…", opts: ["Un simple saut de page", "Un saut de section", "Un nouveau document", "Un tableau"], a: 1, exp: "La numérotation indépendante est une propriété de section." },
    { type: "vf", q: "Un saut de page peut changer l'orientation d'une seule page.", a: false, exp: "Seul un saut de section permet une orientation différente ; le saut de page ne change pas la mise en page." },
    { type: "qcm", q: "La source de confusion n°1 avec les sections est…", opts: ["La couleur du texte", "Le lien « Lier au précédent » des en-têtes/pieds de page", "Le zoom", "La police"], a: 1, exp: "Tant que le lien est actif, l'en-tête recopie la section précédente." }
  ],
  final: {
    title: "Exercice final — Un mémoire en trois parties",
    intro: `<p>Votre mémoire comprend une page de garde (sans numéro), un sommaire (numéroté i, ii, iii) et le corps (numéroté 1, 2, 3…). Vous devez découper le document pour que chaque zone ait sa propre numérotation.</p>
<pre class="pseudo">Ruban ▸ Mise en page ▸ Sauts ▸ Sauts de section ▸ Page suivante</pre>`,
    questions: [
      { type: "qcm", q: "Combien de sauts de section faut-il au minimum pour ces trois zones ?", opts: ["Zéro", "Deux", "Cinq", "Dix"], a: 1, exp: "Deux sauts de section séparent les trois zones (garde | sommaire | corps)." },
      { type: "qcm", q: "Quel type de saut placer entre la page de garde et le sommaire ?", opts: ["Continu", "Page suivante", "Saut de colonne", "Aucun"], a: 1, exp: "« Page suivante » démarre chaque zone sur une nouvelle page." },
      { type: "qcm", q: "Pour que le corps redémarre à la page 1, où se règle la numérotation ?", opts: ["Insertion ▸ Numéro de page ▸ Format ▸ À partir de 1, dans la section du corps", "Accueil ▸ Gras", "Fichier ▸ Imprimer", "Révision ▸ Langue"], a: 0, exp: "Le format de numérotation « Commencer à 1 » s'applique à la section active." },
      { type: "vf", q: "Il faudra rompre le lien « Lier au précédent » pour que la numérotation du corps soit indépendante.", a: true, exp: "Sinon la section recopie la numérotation de la précédente." },
      { type: "qcm", q: "Pour afficher où sont vos sauts de section, vous activez…", opts: ["Le zoom", "Les marques de mise en forme (Ctrl + Maj + 8)", "Le mode Lecture", "Le correcteur"], a: 1, exp: "Les marques ¶ montrent les sauts et leur type." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Activer les marques : Ctrl + Maj + 8
2. Fin de la page de garde ▸ Mise en page ▸ Sauts ▸ Page suivante (section 2 = sommaire)
3. Fin du sommaire ▸ Mise en page ▸ Sauts ▸ Page suivante (section 3 = corps)
4. Dans l'en-tête du sommaire : Outils En-têtes ▸ désactiver « Lier au précédent »
5. Insertion ▸ Numéro de page ▸ Format ▸ format i, ii, iii ▸ Commencer à i
6. Dans l'en-tête du corps : désactiver « Lier au précédent »
7. Insertion ▸ Numéro de page ▸ Format ▸ format 1, 2, 3 ▸ Commencer à 1
8. Sur la page de garde : supprimer le numéro (case « Première page différente » ou pas de champ)</pre>
<p>Chaque section a désormais sa numérotation propre.</p>`
  }
};
</script>
