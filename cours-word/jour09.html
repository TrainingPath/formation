<script>
var DAY = {
  num: 9,
  title: "Légendes, table des illustrations et index",
  subtitle: "Numéroter figures et tableaux, et bâtir un index.",
  theory: `
<h3>1. La légende</h3>
<p>Une <strong>légende</strong> est un texte numéroté attaché à une figure, un tableau ou une équation (« Figure 1 : … », « Tableau 3 : … »). La numérotation est automatique : insérez une figure au milieu, tout se renumérote.</p>
<pre class="pseudo">Ruban ▸ Références ▸ Légendes ▸ Insérer une légende
Ctrl + Alt + F… (non, c'est note de fin)     // pas de raccourci standard : passer par le ruban</pre>
<p>Dans la boîte « Légende », choisissez l'<strong>étiquette</strong> (Figure, Tableau, Équation, ou une étiquette maison via « Nouveau texte »), la position (au-dessus/au-dessous) et la numérotation.</p>
<div class="tip">Cochez « Ajouter une légende automatiquement » (bouton « Numérotation automatique… ») pour que chaque image ou tableau inséré reçoive sa légende sans y penser.</div>
<h3>2. Renvoi vers une légende</h3>
<p>Un <strong>renvoi</strong> (référence croisée) insère une mention dynamique du type « voir Figure 2 » qui pointe vers la vraie légende et se met à jour si la numérotation change.</p>
<pre class="pseudo">Ruban ▸ Références ▸ Légendes ▸ Renvoi
  • Catégorie : Figure / Tableau…
  • Insérer un renvoi à : Texte et numéro / Numéro seul / Numéro de page…</pre>
<h3>3. La table des illustrations</h3>
<p>Comme la table des matières le fait pour les titres, la <strong>table des illustrations</strong> liste toutes les légendes d'une catégorie avec leur page.</p>
<pre class="pseudo">Ruban ▸ Références ▸ Légendes ▸ Insérer une table des illustrations
  • Étiquette de légende : Figure / Tableau…</pre>
<p>C'est un champ : on la met à jour comme la TDM (F9 ▸ Mettre à jour toute la table).</p>
<h3>4. L'index</h3>
<p>Un <strong>index</strong> est la liste alphabétique des termes importants avec les pages où ils apparaissent, à la fin du document. Il se construit en deux temps : <strong>marquer les entrées</strong>, puis <strong>générer l'index</strong>.</p>
<pre class="pseudo">Ruban ▸ Références ▸ Index ▸ Marquer l'entrée
Alt + Maj + X          // marquer l'entrée d'index sélectionnée</pre>
<p>Marquer une entrée insère un champ masqué <code>XE</code> à côté du mot. Une fois toutes les entrées marquées :</p>
<pre class="pseudo">Références ▸ Index ▸ Insérer l'index     // génère la liste alphabétique</pre>
<div class="warn">Après avoir marqué des entrées, Word active l'affichage des marques de mise en forme (les champs XE deviennent visibles, ce qui décale la pagination à l'écran). Désactivez l'affichage des marques (Ctrl + Maj + 8) avant d'imprimer, sinon la pagination affichée est faussée.</div>
<h3>5. Sous-entrées et renvois d'index</h3>
<p>Dans « Marquer l'entrée » on peut définir une <strong>entrée principale</strong> et une <strong>sous-entrée</strong> (ex. « Word : styles »), ou un renvoi « Voir… » vers un autre terme. On peut aussi marquer toutes les occurrences d'un mot d'un coup (bouton « Marquer tout »).</p>
<h3>6. Mettre à jour</h3>
<p>Légendes, tables des illustrations et index sont des <strong>champs</strong> : après modification, sélectionnez-les et appuyez sur <code>F9</code>. Réflexe avant livraison : tout mettre à jour.</p>`,
  exercises: [
    { type: "qcm", q: "Une légende sert à…", opts: ["Numéroter et titrer une figure ou un tableau", "Changer les marges", "Insérer un en-tête", "Corriger l'orthographe"], a: 0, exp: "La légende attache un texte numéroté à une figure/tableau/équation." },
    { type: "vf", q: "La numérotation des légendes est automatique.", a: true, exp: "Insérer une figure au milieu renumérote les suivantes." },
    { type: "qcm", q: "Où insère-t-on une légende ?", opts: ["Accueil ▸ Police", "Références ▸ Insérer une légende", "Insertion ▸ En-tête", "Révision ▸ Langue"], a: 1, exp: "Le groupe Légendes de l'onglet Références contient « Insérer une légende »." },
    { type: "qcm", q: "Qu'est-ce qu'un renvoi (référence croisée) ?", opts: ["Une image", "Une mention dynamique du type « voir Figure 2 » qui se met à jour", "Un pied de page", "Un commentaire"], a: 1, exp: "Le renvoi pointe vers une légende/titre et suit la renumérotation." },
    { type: "qcm", q: "La table des illustrations liste…", opts: ["Les titres", "Les légendes d'une catégorie avec leur page", "Les commentaires", "Les marges"], a: 1, exp: "Elle fait pour les figures/tableaux ce que la TDM fait pour les titres." },
    { type: "qcm", q: "Quel raccourci marque une entrée d'index ?", opts: ["Alt + Maj + X", "Ctrl + X", "Alt + X", "Ctrl + Maj + X"], a: 0, exp: "Alt + Maj + X ouvre « Marquer l'entrée » pour le texte sélectionné." },
    { type: "vf", q: "Marquer une entrée d'index insère un champ masqué XE près du mot.", a: true, exp: "Le champ XE porte l'information d'indexation, invisible à l'impression." },
    { type: "qcm", q: "Un index est…", opts: ["Un sommaire des titres", "La liste alphabétique des termes importants avec leurs pages", "Une image", "Un en-tête"], a: 1, exp: "L'index se place à la fin et recense les termes par ordre alphabétique." },
    { type: "qcm", q: "Comment insérer une étiquette personnalisée (ex. « Schéma ») ?", opts: ["Impossible", "Dans la boîte Légende ▸ Nouveau texte", "Changer la police", "Insérer une image"], a: 1, exp: "« Nouveau texte » crée une étiquette maison en plus de Figure/Tableau." },
    { type: "vf", q: "La table des illustrations et l'index sont des champs à mettre à jour (F9).", a: true, exp: "Comme la TDM, il faut les recalculer après modification." },
    { type: "qcm", q: "« Marquer tout » dans l'index…", opts: ["Supprime toutes les entrées", "Marque toutes les occurrences du même mot d'un coup", "Imprime", "Change la police"], a: 1, exp: "Il indexe chaque occurrence du terme automatiquement." },
    { type: "qcm", q: "Après avoir marqué des entrées d'index, la pagination affichée semble décalée. Pourquoi ?", opts: ["Le fichier est corrompu", "Les champs XE visibles (marques de mise en forme) prennent de la place à l'écran", "Les marges ont changé", "L'index est faux"], a: 1, exp: "Il faut masquer les marques (Ctrl + Maj + 8) pour retrouver la vraie pagination." },
    { type: "qcm", q: "Pour numéroter automatiquement chaque nouvelle image insérée…", opts: ["Rien à faire", "Légende ▸ Numérotation automatique (ajout automatique)", "Changer les marges", "Insérer un tableau"], a: 1, exp: "« Numérotation automatique » attache une légende à chaque insertion du type choisi." },
    { type: "vf", q: "Un renvoi « voir Figure 2 » devient faux si on insère une figure avant et qu'on ne met pas à jour.", a: true, exp: "Le renvoi est un champ : F9 le remet à jour ; sinon il affiche l'ancien numéro." },
    { type: "qcm", q: "Une sous-entrée d'index sert à…", opts: ["Coloriser le texte", "Hiérarchiser un terme sous une entrée principale (ex. Word : styles)", "Imprimer", "Numéroter les pages"], a: 1, exp: "La sous-entrée regroupe des termes sous une entrée principale." }
  ],
  final: {
    title: "Exercice final — Un rapport illustré et indexé",
    intro: `<p>Un rapport contient 8 figures et 3 tableaux. On vous demande de légender chaque élément, d'insérer une table des figures, un renvoi « voir Figure 4 » dans le texte, et un petit index de 5 termes clés.</p>
<pre class="pseudo">Ruban ▸ Références ▸ Légendes / Index</pre>`,
    questions: [
      { type: "qcm", q: "Comment légender les figures ?", opts: ["Les taper à la main sous chaque image", "Références ▸ Insérer une légende ▸ étiquette Figure", "Changer la police", "Insérer un en-tête"], a: 1, exp: "L'étiquette Figure numérote automatiquement." },
      { type: "qcm", q: "Pour la liste des figures, on insère…", opts: ["Une table des matières", "Une table des illustrations (étiquette Figure)", "Un index", "Un sommaire de titres"], a: 1, exp: "La table des illustrations recense les légendes de catégorie Figure." },
      { type: "qcm", q: "Comment écrire « voir Figure 4 » qui suivra la renumérotation ?", opts: ["Le taper à la main", "Références ▸ Renvoi ▸ Figure ▸ Figure 4", "Un commentaire", "Un en-tête"], a: 1, exp: "Le renvoi crée une mention dynamique liée à la légende." },
      { type: "vf", q: "Pour l'index, il faut d'abord marquer les 5 termes (Alt + Maj + X) puis insérer l'index.", a: true, exp: "Marquage des entrées, puis génération de l'index." },
      { type: "qcm", q: "Avant l'export final, quel réflexe pour légendes, table et renvois ?", opts: ["Changer de police", "Tout sélectionner et mettre à jour les champs (F9)", "Supprimer l'index", "Réduire le zoom"], a: 1, exp: "On met à jour tous les champs pour des numéros et pages exacts." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Cliquer une figure ▸ Références ▸ Insérer une légende ▸ étiquette Figure ▸ OK (répéter)
2. Idem pour les tableaux avec l'étiquette Tableau
3. Placer le curseur pour la table des figures ▸ Références ▸ Insérer une table des illustrations ▸ étiquette Figure
4. Dans le texte : Références ▸ Renvoi ▸ catégorie Figure ▸ choisir Figure 4 ▸ Insérer
5. Sélectionner un terme clé ▸ Alt + Maj + X ▸ Marquer (ou Marquer tout) ; répéter pour 5 termes
6. Ctrl + Maj + 8 pour masquer les champs XE
7. Fin du document ▸ Références ▸ Insérer l'index
8. Avant livraison : Ctrl + A puis F9 pour tout mettre à jour</pre>
<p>Le rapport est légendé, sa table des figures et son index à jour.</p>`
  }
};
</script>
