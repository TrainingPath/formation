<script>
var DAY = {
  num: 15,
  title: "Les champs (field codes) et l'automatisation",
  subtitle: "Insérer des informations dynamiques qui se mettent à jour.",
  theory: `
<h3>1. Qu'est-ce qu'un champ ?</h3>
<p>Un <strong>champ</strong> (field) est un emplacement contenant une instruction plutôt qu'un texte figé. Word calcule le <strong>résultat</strong> à afficher. Vous en avez déjà utilisé sans le savoir : numéro de page, table des matières, date, champs de fusion, formules de tableau… tous sont des champs.</p>
<pre class="pseudo">{ PAGE }            // affiche le numéro de page courant
{ DATE }            // affiche la date du jour
{ NUMPAGES }        // nombre total de pages
{ REF signet }      // rappelle le contenu d'un signet</pre>
<p>Le texte entre accolades est le <strong>code de champ</strong> ; ce qui s'affiche est le <strong>résultat</strong>.</p>
<h3>2. Voir les codes et les résultats</h3>
<pre class="pseudo">Alt + F9          // bascule TOUS les champs entre code et résultat
Maj + F9          // bascule le champ sélectionné seulement</pre>
<div class="tip">Les vraies accolades d'un champ ne se tapent pas au clavier ! Elles s'insèrent avec Ctrl + F9 (une paire { } vide où l'on écrit ensuite le code). Taper { } au clavier ne crée qu'un texte inerte.</div>
<h3>3. Insérer un champ par le menu</h3>
<pre class="pseudo">Ruban ▸ Insertion ▸ Texte ▸ QuickPart ▸ Champ…
  • Catégories : Date et heure, Numérotation, Informations utilisateur, Publipostage…
  • Choisir le champ, régler ses options/format</pre>
<h3>4. Mettre à jour les champs</h3>
<pre class="pseudo">F9                  // met à jour le(s) champ(s) sélectionné(s)
Ctrl + A puis F9    // met à jour TOUS les champs du document</pre>
<div class="warn">Les champs ne se recalculent pas tout seuls. Réflexe avant impression/PDF : Ctrl + A puis F9. On peut aussi activer « Mettre à jour les champs avant l'impression » dans Fichier ▸ Options ▸ Affichage.</div>
<h3>5. Champs utiles au quotidien</h3>
<ul>
<li><code>DATE</code> / <code>TIME</code> : date/heure (attention : DATE se met à jour, une date « fixe » s'insère via une case à cocher).</li>
<li><code>FILENAME</code> : nom du fichier (avec <code>\\p</code> pour le chemin complet).</li>
<li><code>AUTHOR</code>, <code>TITLE</code> : métadonnées du document.</li>
<li><code>REF</code> et signets : rappeler ailleurs un texte saisi une seule fois.</li>
<li><code>IF</code> : afficher un texte selon une condition.</li>
<li><code>= (Formula)</code> : calcul (comme dans les tableaux).</li>
</ul>
<h3>6. Verrouiller ou figer un champ</h3>
<pre class="pseudo">Ctrl + F11          // verrouiller un champ (empêche sa mise à jour)
Ctrl + Maj + F11    // déverrouiller
Ctrl + Maj + F9     // convertir le champ en texte figé (irréversible)</pre>
<h3>7. Le commutateur de format</h3>
<p>Un <strong>commutateur</strong> (switch) affine l'affichage d'un champ, après une barre oblique inverse. Ex. <code>{ DATE \\@ "dddd d MMMM yyyy" }</code> affiche « lundi 3 mars 2026 » ; <code>\\* MERGEFORMAT</code> conserve la mise en forme lors des mises à jour ; <code>\\# 0,00 €</code> formate un nombre.</p>
<div class="tip">Comprendre les champs, c'est comprendre la mécanique cachée de Word : TDM, pagination, publipostage, légendes, renvois ne sont que des champs. Savoir faire Alt + F9 puis F9 vous dépanne dans 90 % des cas « ça ne se met pas à jour ».</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'un champ dans Word ?", opts: ["Un texte figé", "Un emplacement contenant une instruction dont Word calcule le résultat", "Une image", "Une police"], a: 1, exp: "Le champ affiche un résultat calculé à partir d'un code." },
    { type: "qcm", q: "Quel raccourci bascule tous les champs entre code et résultat ?", opts: ["Alt + F9", "Ctrl + P", "F5", "Alt + F4"], a: 0, exp: "Alt + F9 affiche/masque tous les codes de champ." },
    { type: "vf", q: "On peut taper les accolades d'un champ directement au clavier.", a: false, exp: "Il faut les insérer avec Ctrl + F9 ; tapées, elles sont inertes." },
    { type: "qcm", q: "Quel raccourci insère une paire d'accolades de champ vide ?", opts: ["Ctrl + F9", "Alt + F9", "F9", "Ctrl + A"], a: 0, exp: "Ctrl + F9 crée un champ { } vide à compléter." },
    { type: "qcm", q: "Comment mettre à jour TOUS les champs du document ?", opts: ["Ctrl + A puis F9", "Ctrl + S", "F5", "Alt + F4"], a: 0, exp: "Sélectionner tout (Ctrl + A) puis F9 recalcule chaque champ." },
    { type: "qcm", q: "Le champ PAGE affiche…", opts: ["La date", "Le numéro de page courant", "Le nom du fichier", "L'auteur"], a: 1, exp: "PAGE renvoie le numéro de la page où il se trouve." },
    { type: "vf", q: "La table des matières et le publipostage reposent sur des champs.", a: true, exp: "TDM, pagination, fusion, légendes : tout est champ." },
    { type: "qcm", q: "Quel champ affiche le nombre total de pages ?", opts: ["PAGE", "NUMPAGES", "DATE", "AUTHOR"], a: 1, exp: "NUMPAGES donne le total ; PAGE la page courante." },
    { type: "qcm", q: "À quoi sert un commutateur comme \\@ \"dddd d MMMM yyyy\" ?", opts: ["À imprimer", "À définir le format d'affichage (ici de la date)", "À supprimer le champ", "À changer les marges"], a: 1, exp: "Le commutateur \\@ précise le format d'un champ date/heure." },
    { type: "vf", q: "Ctrl + Maj + F9 convertit un champ en texte figé, de façon irréversible.", a: true, exp: "Le champ devient du texte statique non recalculable." },
    { type: "qcm", q: "Que fait Ctrl + F11 sur un champ ?", opts: ["Le supprime", "Le verrouille pour empêcher sa mise à jour", "L'imprime", "Change sa police"], a: 1, exp: "Ctrl + F11 verrouille ; Ctrl + Maj + F11 déverrouille." },
    { type: "qcm", q: "Le champ REF associé à un signet permet de…", opts: ["Insérer une image", "Rappeler ailleurs un texte saisi une seule fois", "Numéroter les pages", "Changer la langue"], a: 1, exp: "REF réaffiche le contenu d'un signet : saisir une fois, réutiliser partout." },
    { type: "qcm", q: "Pour insérer un champ via le menu…", opts: ["Insertion ▸ Texte ▸ QuickPart ▸ Champ", "Accueil ▸ Gras", "Révision ▸ Langue", "Fichier ▸ Imprimer"], a: 0, exp: "La boîte Champ liste toutes les catégories de champs." },
    { type: "vf", q: "Le commutateur \\* MERGEFORMAT conserve la mise en forme lors des mises à jour.", a: true, exp: "Il évite que la mise en forme se réinitialise à chaque F9." },
    { type: "qcm", q: "« Ça ne se met pas à jour » : quel réflexe adopter ?", opts: ["Réenregistrer le document en PDF", "Sélectionner le champ (ou Ctrl + A) et appuyer sur F9", "Changer la police", "Rétablir la mise en forme du champ"], a: 1, exp: "F9 force le recalcul du ou des champs." }
  ],
  final: {
    title: "Exercice final — Un en-tête intelligent",
    intro: `<p>Vous voulez un en-tête affichant « Fichier : nom du document — page X sur Y — imprimé le [date] ». Le nom, la pagination et la date doivent être des champs qui se mettent à jour.</p>
<pre class="pseudo">Insertion ▸ Texte ▸ QuickPart ▸ Champ   (ou Ctrl + F9 pour saisir un code)</pre>`,
    questions: [
      { type: "qcm", q: "Quel champ pour le nom du fichier ?", opts: ["FILENAME", "PAGE", "DATE", "AUTHOR"], a: 0, exp: "FILENAME affiche le nom (avec \\p pour le chemin complet)." },
      { type: "qcm", q: "Pour « page X sur Y », quels champs ?", opts: ["PAGE et NUMPAGES", "DATE et TIME", "REF et SEQ", "IF et ="], a: 0, exp: "PAGE = page courante, NUMPAGES = total." },
      { type: "qcm", q: "Pour la date d'impression, quel champ ?", opts: ["PRINTDATE (ou DATE)", "PAGE", "FILENAME", "AUTHOR"], a: 0, exp: "PRINTDATE donne la date d'impression ; DATE la date du jour." },
      { type: "vf", q: "Avant d'imprimer, il faut mettre à jour les champs (Ctrl + A puis F9) ou activer l'option correspondante.", a: true, exp: "Sinon les valeurs affichées peuvent être périmées." },
      { type: "qcm", q: "Pour vérifier les codes bruts de votre en-tête, vous appuyez sur…", opts: ["Alt + F9", "Ctrl + S", "F5", "Alt + F4"], a: 0, exp: "Alt + F9 révèle les codes de champ." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Double-cliquer dans l'en-tête
2. Taper « Fichier : », puis Insertion ▸ QuickPart ▸ Champ ▸ FILENAME ▸ OK
3. Taper « — page », insérer le champ PAGE, taper « sur », insérer NUMPAGES
4. Taper « — imprimé le », insérer le champ DATE (ou PRINTDATE) avec un format \\@ "d MMMM yyyy"
5. Vérifier les codes avec Alt + F9, puis revenir au résultat (Alt + F9)
6. Sélectionner tout l'en-tête et appuyer sur F9 pour actualiser
7. (Optionnel) Fichier ▸ Options ▸ Affichage ▸ Mettre à jour les champs avant l'impression</pre>
<p>L'en-tête devient dynamique et toujours exact.</p>`
  }
};
</script>
