var DAY = {
  num: 20,
  title: "Accessibilité, export PDF et co-édition",
  subtitle: "Rendre un document accessible, le diffuser et le partager.",
  theory: `
<h3>1. L'accessibilité, qu'est-ce que c'est ?</h3>
<p>Un document <strong>accessible</strong> peut être lu par tous, y compris par les personnes utilisant un <strong>lecteur d'écran</strong> (logiciel qui lit le contenu à voix haute pour les malvoyants). Cela impose quelques règles simples mais essentielles.</p>
<ul>
<li><strong>Texte de remplacement</strong> (texte alternatif) sur chaque image : une description que le lecteur d'écran énonce.</li>
<li>Des <strong>styles de titre</strong> (jour 2) pour donner une structure navigable.</li>
<li>Un <strong>contraste</strong> suffisant entre texte et fond.</li>
<li>Des <strong>tableaux simples</strong> avec ligne d'en-tête, pas de cellules fusionnées inutiles.</li>
<li>Des <strong>liens</strong> au texte explicite (« rapport annuel » plutôt que « cliquez ici »).</li>
</ul>
<h3>2. Ajouter un texte de remplacement</h3>
<pre class="pseudo">Clic droit sur l'image ▸ Modifier le texte de remplacement…
(ou Format de l'image ▸ Texte de remplacement)</pre>
<div class="tip">Dans Word 365, un texte alternatif peut être suggéré automatiquement par l'IA (à relire et corriger). Les images purement décoratives peuvent être cochées « décoratif » pour être ignorées par le lecteur d'écran.</div>
<h3>3. Le vérificateur d'accessibilité</h3>
<pre class="pseudo">Ruban ▸ Révision ▸ Vérifier l'accessibilité
(ou Fichier ▸ Informations ▸ Vérifier l'absence de problèmes ▸ Vérifier l'accessibilité)</pre>
<p>Il liste les problèmes (images sans alt, contraste faible, titres manquants…) avec des conseils de correction. Word 365 propose même de garder le vérificateur actif en continu.</p>
<h3>4. Exporter en PDF</h3>
<p>Le <strong>PDF</strong> est un format figé, lisible partout à l'identique, non modifiable facilement : idéal pour diffuser une version définitive.</p>
<pre class="pseudo">Fichier ▸ Exporter ▸ Créer PDF/XPS
(ou Fichier ▸ Enregistrer sous ▸ Type : PDF)</pre>
<pre class="pseudo">Bouton Options… (dans la boîte d'export) :
  • Créer des signets à partir des titres     // PDF navigable
  • Balises de structure pour l'accessibilité  // PDF accessible
  • Conforme ISO 19005 (PDF/A)                 // archivage long terme</pre>
<div class="warn">Cochez « Créer des signets » et « Balises de structure de document » pour un PDF navigable et accessible. Un PDF exporté d'un Word bien structuré (styles + alt) conserve la structure ; un Word bâclé donne un PDF illisible pour les lecteurs d'écran.</div>
<h3>5. La co-édition (édition simultanée)</h3>
<p>La <strong>co-édition</strong> permet à plusieurs personnes de modifier le MÊME document en même temps, chacune voyant les curseurs des autres en direct. Elle nécessite que le fichier soit stocké dans le <strong>cloud</strong> (OneDrive ou SharePoint) et se pilote via le bouton <strong>Partager</strong>.</p>
<pre class="pseudo">Bouton Partager (en haut à droite) ▸ inviter par e-mail / copier le lien
  • Droits : Modification / Lecture seule
  • Enregistrement automatique activé (nécessaire à la co-édition)</pre>
<div class="tip">La co-édition en temps réel est surtout une force de Word 365 (avec OneDrive/SharePoint et l'enregistrement automatique). Office 2019/2021 permet le partage de fichiers, mais la co-édition simultanée fluide dépend du stockage cloud et est bien plus limitée hors 365.</div>
<h3>6. Historique des versions</h3>
<pre class="pseudo">Fichier ▸ Informations ▸ Historique des versions     // fichiers cloud</pre>
<p>Pour un document dans le cloud, on peut consulter et restaurer les versions antérieures : filet de sécurité en cas d'erreur à plusieurs.</p>
<h3>7. Les commentaires et @mentions en partage</h3>
<p>En co-édition, les commentaires (jour 17) deviennent collaboratifs : on <strong>@mentionne</strong> une personne, qui reçoit une notification par e-mail avec un lien direct vers le passage. Très pratique pour répartir les relectures.</p>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'un document accessible ?", opts: ["Un document court", "Un document lisible par tous, y compris via un lecteur d'écran", "Un PDF", "Un fichier chiffré"], a: 1, exp: "L'accessibilité vise notamment les utilisateurs de lecteurs d'écran." },
    { type: "qcm", q: "Le texte de remplacement d'une image sert à…", opts: ["La colorer", "Fournir une description lue par le lecteur d'écran", "L'agrandir", "La compresser"], a: 1, exp: "Le texte alternatif décrit l'image pour les non-voyants." },
    { type: "vf", q: "Les styles de titre contribuent à l'accessibilité en structurant le document.", a: true, exp: "Une structure de titres rend la navigation possible au lecteur d'écran." },
    { type: "qcm", q: "Où lancer le vérificateur d'accessibilité ?", opts: ["Révision ▸ Vérifier l'accessibilité", "Accueil ▸ Police", "Insertion ▸ Tableau", "Fichier ▸ Imprimer"], a: 0, exp: "Le vérificateur est dans Révision (ou Fichier ▸ Informations)." },
    { type: "qcm", q: "Le PDF est un format…", opts: ["Facilement modifiable", "Figé, lisible partout à l'identique", "Réservé aux images", "Uniquement Word"], a: 1, exp: "Le PDF fige la présentation pour une diffusion fidèle." },
    { type: "qcm", q: "Comment exporter en PDF ?", opts: ["Fichier ▸ Exporter ▸ Créer PDF/XPS", "Accueil ▸ Gras", "Insertion ▸ Image", "Affichage ▸ Zoom"], a: 0, exp: "Exporter ▸ Créer PDF/XPS (ou Enregistrer sous ▸ PDF)." },
    { type: "vf", q: "Cocher « Créer des signets » rend le PDF navigable par titres.", a: true, exp: "Les signets PDF reprennent la structure des titres." },
    { type: "qcm", q: "Que faut-il pour la co-édition en temps réel ?", opts: ["Une imprimante", "Le fichier stocké dans le cloud (OneDrive/SharePoint)", "Un PDF", "Un mot de passe"], a: 1, exp: "Le cloud et l'enregistrement automatique permettent l'édition simultanée." },
    { type: "qcm", q: "Le bouton Partager permet de…", opts: ["Imprimer", "Inviter des personnes à modifier/lire le document", "Changer la police", "Créer un index"], a: 1, exp: "Partager gère invitations, liens et droits d'accès." },
    { type: "vf", q: "La co-édition simultanée fluide est surtout une force de Word 365.", a: true, exp: "Elle dépend du cloud ; 2019/2021 est bien plus limité hors 365." },
    { type: "qcm", q: "Une image purement décorative peut être…", opts: ["Supprimée obligatoirement", "Marquée « décoratif » pour être ignorée par le lecteur d'écran", "Agrandie", "Chiffrée"], a: 1, exp: "Le marquage décoratif évite une description inutile." },
    { type: "qcm", q: "Pour un PDF accessible, quelle option cocher ?", opts: ["Balises de structure de document", "Réduire les marges", "Changer la police", "Ajouter un filigrane"], a: 0, exp: "Les balises de structure transmettent la hiérarchie au PDF." },
    { type: "qcm", q: "Un lien accessible affiche…", opts: ["« cliquez ici »", "Un texte explicite décrivant la destination", "Une URL brute toujours", "Rien"], a: 1, exp: "Un libellé explicite (« rapport annuel ») aide tous les lecteurs." },
    { type: "vf", q: "L'historique des versions d'un fichier cloud permet de restaurer une version antérieure.", a: true, exp: "C'est un filet de sécurité pour le travail collaboratif." },
    { type: "qcm", q: "Le format PDF/A (ISO 19005) sert surtout à…", opts: ["L'impression rapide", "L'archivage à long terme", "La co-édition", "La compression d'images"], a: 1, exp: "PDF/A vise la conservation pérenne des documents." }
  ],
  final: {
    title: "Exercice final — Diffuser un rapport accessible",
    intro: `<p>Votre rapport doit être rendu accessible (images avec alt, structure de titres), exporté en PDF navigable et accessible, puis partagé pour relecture à deux collègues en co-édition.</p>
<pre class="pseudo">Ruban ▸ Révision ▸ Vérifier l'accessibilité  +  Fichier ▸ Exporter  +  bouton Partager</pre>`,
    questions: [
      { type: "qcm", q: "Première étape pour l'accessibilité des images ?", opts: ["Les supprimer", "Ajouter un texte de remplacement à chacune", "Les agrandir", "Les colorer"], a: 1, exp: "Le texte alternatif décrit chaque image pertinente." },
      { type: "qcm", q: "Comment repérer les problèmes restants ?", opts: ["Révision ▸ Vérifier l'accessibilité", "Changer la police", "Imprimer", "Réduire le zoom"], a: 0, exp: "Le vérificateur liste les problèmes et propose des corrections." },
      { type: "qcm", q: "Pour un PDF navigable et accessible, quelles options ?", opts: ["Créer des signets + Balises de structure", "Réduire les marges", "Filigrane", "Aucune"], a: 0, exp: "Signets = navigation ; balises = accessibilité." },
      { type: "vf", q: "La co-édition impose que le rapport soit dans OneDrive ou SharePoint.", a: true, exp: "Le stockage cloud est nécessaire à l'édition simultanée." },
      { type: "qcm", q: "Comment attirer l'attention d'un collègue sur un passage précis en co-édition ?", opts: ["Un commentaire avec @mention", "Un saut de page", "Changer la police", "Un tableau"], a: 0, exp: "La @mention notifie la personne avec un lien direct." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Clic droit sur chaque image ▸ Modifier le texte de remplacement ▸ décrire (ou marquer décoratif)
2. Vérifier que les titres portent les styles Titre 1/2/3
3. Révision ▸ Vérifier l'accessibilité ▸ corriger les points signalés
4. Fichier ▸ Exporter ▸ Créer PDF/XPS ▸ Options : cocher « Créer des signets » et « Balises de structure » ▸ Publier
5. Enregistrer le rapport dans OneDrive/SharePoint (nécessaire à la co-édition)
6. Bouton Partager ▸ inviter les deux collègues ▸ droit Modification
7. En relecture : commentaires avec @mention pour cibler les passages
8. Suivre l'Historique des versions au besoin</pre>
<p>Le rapport est accessible, diffusé en PDF propre et relu à plusieurs.</p>`
  }
};
