<script>
var DAY = {
  num: 4,
  title: "Mise en page : marges, orientation, colonnes",
  subtitle: "Maîtriser la géométrie de la page.",
  theory: `
<h3>1. Vocabulaire de la mise en page</h3>
<ul>
<li>Les <strong>marges</strong> sont les espaces blancs entre le bord du papier et le texte (haut, bas, gauche, droite).</li>
<li>L'<strong>orientation</strong> est le sens de la page : <strong>Portrait</strong> (verticale) ou <strong>Paysage</strong> (horizontale).</li>
<li>Le <strong>format</strong> (ou taille) est la dimension du papier : A4, Lettre US, A5…</li>
<li>Les <strong>colonnes</strong> découpent le texte en plusieurs bandes verticales, comme un journal.</li>
</ul>
<p>Tous ces réglages vivent dans l'onglet Mise en page (nommé <strong>Disposition</strong> dans certaines versions récentes) :</p>
<pre class="pseudo">Ruban ▸ Mise en page ▸ Mise en page          // groupe Marges / Orientation / Taille / Colonnes</pre>
<div class="warn">Le nom de l'onglet varie : « Mise en page » dans Office 2019/2021, souvent « Disposition » dans Word 365. Le contenu (Marges, Orientation, Taille, Colonnes, Sauts) est identique.</div>
<h3>2. Régler les marges</h3>
<pre class="pseudo">Mise en page ▸ Marges          // Normales, Étroites, Larges… ou Marges personnalisées</pre>
<p>« Marges personnalisées… » ouvre la boîte Mise en page où l'on saisit chaque valeur au millimètre. On y trouve aussi la <strong>reliure</strong> (marge supplémentaire pour l'agrafage) et les <strong>pages en vis-à-vis</strong> (marges intérieure/extérieure pour l'impression recto-verso).</p>
<h3>3. Orientation et format</h3>
<pre class="pseudo">Mise en page ▸ Orientation ▸ Portrait / Paysage
Mise en page ▸ Taille ▸ A4          // ou Lettre, A5, etc.</pre>
<div class="tip">Besoin d'UNE seule page en paysage (un grand tableau) au milieu d'un document en portrait ? Il faut l'isoler entre deux sauts de section (jour 5) : l'orientation est une propriété de section, pas du document entier.</div>
<h3>4. Les colonnes</h3>
<pre class="pseudo">Mise en page ▸ Colonnes ▸ Une / Deux / Trois…     // ou « Autres colonnes… »</pre>
<p>« Autres colonnes… » règle le nombre, la largeur, l'espacement et ajoute une <strong>ligne séparatrice</strong>. Pour forcer le passage à la colonne suivante à un endroit précis, on insère un <strong>saut de colonne</strong> :</p>
<pre class="pseudo">Ctrl + Maj + Entrée          // saut de colonne (passe à la colonne suivante)</pre>
<h3>5. Afficher les repères</h3>
<p>Pour visualiser la zone de texte, activez la règle et les limites de texte :</p>
<pre class="pseudo">Ruban ▸ Affichage ▸ Règle          // affiche la règle graduée
Fichier ▸ Options ▸ Options avancées ▸ Afficher les limites de texte</pre>
<h3>6. Le piège de l'« Appliquer à »</h3>
<div class="warn">Dans la boîte Mise en page, le menu « Appliquer à » propose « À tout le document » ou « À cette section » / « À partir de ce point ». Si vous voulez changer une seule partie, choisissez la bonne option, sinon vous reformatez tout le document par erreur.</div>`,
  exercises: [
    { type: "qcm", q: "Que sont les marges ?", opts: ["Les colonnes du texte", "Les espaces blancs entre le bord du papier et le texte", "Les numéros de page", "Les titres"], a: 1, exp: "Les marges séparent le texte des bords de la feuille." },
    { type: "qcm", q: "L'orientation Paysage signifie…", opts: ["Page verticale", "Page horizontale (plus large que haute)", "Deux colonnes", "Format A5"], a: 1, exp: "Paysage = horizontale ; Portrait = verticale." },
    { type: "qcm", q: "Où se règlent marges, orientation et colonnes ?", opts: ["Ruban ▸ Accueil", "Ruban ▸ Mise en page (Disposition)", "Ruban ▸ Insertion", "Fichier ▸ Imprimer"], a: 1, exp: "Tout est dans l'onglet Mise en page / Disposition." },
    { type: "vf", q: "L'orientation d'une page est une propriété de section, pas forcément du document entier.", a: true, exp: "Grâce aux sections, une seule page peut être en paysage." },
    { type: "qcm", q: "Quel raccourci insère un saut de colonne ?", opts: ["Ctrl + Entrée", "Ctrl + Maj + Entrée", "Alt + Entrée", "Maj + Entrée"], a: 1, exp: "Ctrl + Maj + Entrée passe à la colonne suivante." },
    { type: "qcm", q: "À quoi sert la « reliure » dans Marges personnalisées ?", opts: ["À ajouter une marge pour l'agrafage/reliure", "À colorer le fond", "À numéroter les pages", "À créer un tableau"], a: 0, exp: "La reliure réserve de l'espace côté agrafage." },
    { type: "vf", q: "Le format A4 et l'orientation Portrait désignent la même chose.", a: false, exp: "Le format est la taille du papier ; l'orientation est le sens. Ce sont deux réglages distincts." },
    { type: "qcm", q: "Pour couper le texte en deux bandes verticales style journal, on utilise…", opts: ["Un tableau", "Les colonnes", "Un saut de page", "Un en-tête"], a: 1, exp: "Les colonnes créent des bandes verticales de texte." },
    { type: "qcm", q: "Dans la boîte Mise en page, le menu « Appliquer à » sert à…", opts: ["Choisir la police", "Limiter le changement au document entier, à la section ou à partir de ce point", "Imprimer", "Changer la langue"], a: 1, exp: "Il définit l'étendue du changement : tout, section, ou à partir d'ici." },
    { type: "qcm", q: "Que fait l'option « Pages en vis-à-vis » ?", opts: ["Affiche deux pages côte à côte à l'écran seulement", "Utilise des marges intérieure/extérieure pour le recto-verso", "Numérote les pages", "Insère une image"], a: 1, exp: "Elle adapte les marges pour l'impression recto-verso reliée." },
    { type: "vf", q: "« Autres colonnes… » permet d'ajouter une ligne séparatrice entre les colonnes.", a: true, exp: "On y règle nombre, largeur, espacement et ligne séparatrice." },
    { type: "qcm", q: "Comment afficher la règle graduée ?", opts: ["Ruban ▸ Affichage ▸ Règle", "Ruban ▸ Accueil ▸ Gras", "Fichier ▸ Fermer", "Ctrl + P"], a: 0, exp: "La case Règle est dans l'onglet Affichage." },
    { type: "qcm", q: "Vous voulez une seule page paysage au milieu d'un document portrait. Il faut d'abord…", opts: ["Rien de particulier", "L'isoler entre deux sauts de section", "Changer la police", "Ajouter une colonne"], a: 1, exp: "L'orientation étant liée à la section, il faut délimiter la page par des sauts de section." },
    { type: "qcm", q: "Le format « Lettre US » mesure environ…", opts: ["21 x 29,7 cm (A4)", "21,6 x 27,9 cm", "14,8 x 21 cm (A5)", "10 x 15 cm"], a: 1, exp: "La Lettre US (216 x 279 mm) diffère légèrement de l'A4." },
    { type: "vf", q: "Modifier les marges peut changer le nombre de lignes par page et donc la pagination.", a: true, exp: "Plus de marge = moins de place pour le texte : la pagination bouge." }
  ],
  final: {
    title: "Exercice final — Une plaquette et son tableau",
    intro: `<p>Vous montez une plaquette A4 : le corps du texte doit être sur <strong>deux colonnes</strong>, avec ligne séparatrice, sauf une page centrale contenant un grand tableau qui doit être <strong>en paysage</strong>. Les marges doivent passer à 1,5 cm partout.</p>
<pre class="pseudo">Ruban ▸ Mise en page ▸ Colonnes / Orientation / Marges</pre>`,
    questions: [
      { type: "qcm", q: "Comment mettre 1,5 cm de marge partout ?", opts: ["Marges ▸ Normales", "Marges ▸ Marges personnalisées ▸ saisir 1,5 cm sur les 4 côtés", "Orientation ▸ Paysage", "Colonnes ▸ Deux"], a: 1, exp: "Les marges personnalisées permettent des valeurs précises." },
      { type: "qcm", q: "Comment obtenir deux colonnes avec un trait entre elles ?", opts: ["Colonnes ▸ Deux puis « Autres colonnes » ▸ cocher Ligne séparatrice", "Insertion ▸ Tableau", "Orientation ▸ Portrait", "Un saut de page"], a: 0, exp: "« Autres colonnes… » offre l'option Ligne séparatrice." },
      { type: "qcm", q: "Pour isoler la page paysage centrale, il faut…", opts: ["Un saut de page simple", "Un saut de section avant et après cette page", "Une nouvelle police", "Un commentaire"], a: 1, exp: "L'orientation étant liée à la section, on encadre la page de sauts de section." },
      { type: "vf", q: "Sur la page paysage, on peut revenir à une seule colonne indépendamment du reste.", a: true, exp: "Chaque section a ses propres réglages de colonnes et d'orientation." },
      { type: "qcm", q: "Pour forcer la deuxième colonne à démarrer à un endroit précis du texte, on insère…", opts: ["Un saut de page (Ctrl + Entrée)", "Un saut de colonne (Ctrl + Maj + Entrée)", "Une tabulation", "Un espace"], a: 1, exp: "Ctrl + Maj + Entrée envoie le texte vers la colonne suivante." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Mise en page ▸ Taille ▸ A4
2. Mise en page ▸ Marges ▸ Marges personnalisées ▸ 1,5 cm haut/bas/gauche/droite ▸ OK
3. Mise en page ▸ Colonnes ▸ Autres colonnes ▸ Deux ▸ cocher Ligne séparatrice ▸ OK
4. Au début de la future page paysage : Mise en page ▸ Sauts ▸ Page suivante (section)
5. À la fin de cette page : de nouveau Sauts ▸ Page suivante (section)
6. Curseur dans la section isolée ▸ Orientation ▸ Paysage
7. (Optionnel) Colonnes ▸ Une pour cette section, afin d'y loger le grand tableau
8. Ajuster avec un saut de colonne (Ctrl + Maj + Entrée) là où le texte doit basculer</pre>
<p>Vérifiez que « Appliquer à » vise bien la section et non tout le document.</p>`
  }
};
</script>

<script>

  { id: "word-j04", title: "Une page en paysage", level: 2,
    statement: "Créez un document de 3 pages en portrait (A4, marges normales). Faites en sorte que la <strong>page 2</strong> soit en <strong>orientation paysage</strong> tandis que les pages 1 et 3 restent en portrait.",
    hints: [
      "L'orientation est une propriété de section : il faut délimiter la page 2.",
      "Insérez un saut de section « Page suivante » à la fin de la page 1 et à la fin de la page 2.",

    ],
    solution: "1. Saisir assez de texte (ou appuyer sur Ctrl + Entrée) pour obtenir 3 pages.\n2. Placer le curseur tout en haut de la page 2.\n3. Mise en page ▸ Sauts ▸ Sauts de section ▸ Page suivante.\n4. Placer le curseur tout en haut de la page 3.\n5. De nouveau Mise en page ▸ Sauts ▸ Page suivante : la page 2 est désormais une section isolée.\n6. Cliquer n'importe où dans la page 2.\n7. Mise en page ▸ Orientation ▸ Paysage.\n8. Vérifier que seule la page 2 a basculé ; sinon contrôler la position des sauts de section.",
    note: "Si tout le document bascule, c'est qu'un des deux sauts de section manque : ce sont eux qui bornent la zone paysage." }
  ]
};
</script>
