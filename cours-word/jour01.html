<script>
var DAY = {
  num: 1,
  title: "Personnaliser Word : ruban et barre d'accès rapide",
  subtitle: "Aménager l'interface pour aller plus vite au quotidien.",
  theory: `
<h3>1. De quoi parle-t-on ?</h3>
<p>Le <strong>ruban</strong> est la grande bande de commandes en haut de la fenêtre, organisée en <strong>onglets</strong> (Accueil, Insertion, Mise en page…). Chaque onglet contient des <strong>groupes</strong> (par exemple le groupe « Police »), et chaque groupe contient des <strong>boutons</strong>. Quand on décrit un chemin, on l'écrit ainsi :</p>
<pre class="pseudo">Ruban ▸ Accueil ▸ Police ▸ Gras          // onglet Accueil, groupe Police, bouton Gras</pre>
<p>La <strong>barre d'accès rapide</strong> (BAR, en anglais QAT pour <em>Quick Access Toolbar</em>) est la mini-barre de boutons toujours visible, quel que soit l'onglet actif. Par défaut elle contient Enregistrer, Annuler et Rétablir. C'est l'endroit idéal pour poser les 4 ou 5 commandes que vous utilisez sans arrêt.</p>
<h3>2. Ajouter une commande à la barre d'accès rapide</h3>
<p>La méthode la plus rapide : faites un <strong>clic droit sur n'importe quel bouton du ruban</strong>, puis choisissez « Ajouter à la barre d'outils Accès rapide ». Pour un contrôle complet :</p>
<pre class="pseudo">Fichier ▸ Options ▸ Barre d'outils Accès rapide     // liste complète des commandes à gauche
// on sélectionne une commande, on clique « Ajouter » puis « OK »</pre>
<div class="tip">Depuis Word (365) vous pouvez masquer la barre d'accès rapide et, à l'inverse, l'afficher <strong>sous</strong> le ruban via le petit menu déroulant à droite de la barre. Dans Office 2019/2021, la barre est affichée par défaut au-dessus du ruban.</div>
<h3>3. Personnaliser le ruban lui-même</h3>
<p>On peut créer ses <strong>propres onglets</strong> et <strong>groupes</strong> pour y ranger ses commandes préférées. Attention : on ne peut pas modifier les groupes intégrés, mais on peut créer un groupe personnalisé à l'intérieur d'un onglet existant.</p>
<pre class="pseudo">Fichier ▸ Options ▸ Personnaliser le ruban
// bouton « Nouvel onglet » ou « Nouveau groupe », puis on y glisse des commandes</pre>
<h3>4. Réduire le ruban pour gagner de la place</h3>
<p>Un double-clic sur le nom d'un onglet <strong>replie</strong> le ruban ; un nouveau clic sur un onglet le fait réapparaître le temps d'une commande. Le raccourci clavier est :</p>
<pre class="pseudo">Ctrl + F1          // afficher / masquer (réduire) le ruban</pre>
<h3>5. Exporter et réutiliser sa configuration</h3>
<p>Dans « Personnaliser le ruban », le bouton <strong>Importer/Exporter</strong> enregistre toutes vos personnalisations (ruban + barre d'accès rapide) dans un fichier <code>.exportedUI</code>, que vous pouvez recharger sur un autre PC.</p>
<div class="warn">Le bouton « Réinitialiser » remet le ruban d'usine : il supprime TOUS vos onglets et groupes personnalisés d'un coup. Exportez votre configuration avant de réinitialiser.</div>
<h3>6. Quand l'utiliser ?</h3>
<p>Objectif : réduire le nombre de clics sur les actions répétitives. Si vous appliquez souvent un style, insérez un tableau ou collez sans mise en forme dix fois par jour, mettez ces commandes dans la barre d'accès rapide et gagnez du temps sur chaque document.</p>`,
  exercises: [
    { type: "qcm", q: "Comment nomme-t-on la mini-barre toujours visible qui contient Enregistrer et Annuler ?", opts: ["Le ruban", "La barre d'accès rapide", "La barre d'état", "Le volet de navigation"], a: 1, exp: "C'est la barre d'accès rapide (QAT), indépendante de l'onglet actif." },
    { type: "qcm", q: "Quel est le chemin correct pour personnaliser en détail la barre d'accès rapide ?", opts: ["Insertion ▸ Objet", "Fichier ▸ Options ▸ Barre d'outils Accès rapide", "Accueil ▸ Presse-papiers", "Affichage ▸ Zoom"], a: 1, exp: "Tout passe par Fichier ▸ Options, section « Barre d'outils Accès rapide »." },
    { type: "qcm", q: "Quel raccourci réduit ou réaffiche le ruban ?", opts: ["Ctrl + F1", "Ctrl + S", "F5", "Alt + F4"], a: 0, exp: "Ctrl + F1 replie/déplie le ruban." },
    { type: "vf", q: "On peut supprimer des boutons d'un groupe intégré du ruban (comme le groupe Police).", a: false, exp: "Les groupes intégrés ne sont pas modifiables ; il faut créer un groupe personnalisé." },
    { type: "qcm", q: "La façon la plus rapide d'ajouter un bouton du ruban à la barre d'accès rapide ?", opts: ["Clic droit sur le bouton ▸ Ajouter à la barre d'outils Accès rapide", "Le copier-coller dans la barre", "Le renommer dans les Options", "Double-cliquer sur l'onglet"], a: 0, exp: "Le clic droit sur n'importe quel bouton propose directement l'ajout." },
    { type: "qcm", q: "À quoi sert le bouton Importer/Exporter dans Personnaliser le ruban ?", opts: ["À imprimer le document", "À sauvegarder et transférer ses personnalisations dans un fichier .exportedUI", "À exporter en PDF", "À importer des images"], a: 1, exp: "Il enregistre ruban + barre d'accès rapide pour les réutiliser ailleurs." },
    { type: "vf", q: "Un double-clic sur le nom d'un onglet du ruban le replie.", a: true, exp: "Double-clic sur l'onglet = ruban réduit ; nouveau clic = affichage temporaire." },
    { type: "qcm", q: "Peut-on créer un onglet entièrement nouveau dans le ruban ?", opts: ["Non, jamais", "Oui, via Fichier ▸ Options ▸ Personnaliser le ruban ▸ Nouvel onglet", "Seulement dans Excel", "Uniquement avec du code VBA"], a: 1, exp: "Le bouton « Nouvel onglet » crée un onglet personnalisé." },
    { type: "qcm", q: "Où placer une commande utilisée 20 fois par jour pour la garder à portée quel que soit l'onglet ?", opts: ["Dans un pied de page", "Dans la barre d'accès rapide", "Dans un commentaire", "Dans les propriétés du document"], a: 1, exp: "La barre d'accès rapide reste visible en permanence." },
    { type: "vf", q: "Le bouton Réinitialiser supprime toutes les personnalisations du ruban.", a: true, exp: "Il remet la configuration d'usine : exportez avant !" },
    { type: "qcm", q: "Dans Word 365, où peut-on désormais afficher la barre d'accès rapide ?", opts: ["Uniquement au-dessus du ruban", "Au-dessus ou en dessous du ruban", "Seulement dans un volet latéral", "Nulle part, elle a disparu"], a: 1, exp: "365 permet de la placer sous le ruban ou de la masquer ; 2019/2021 l'affiche au-dessus par défaut." },
    { type: "qcm", q: "Un « groupe » du ruban, c'est…", opts: ["Un ensemble de documents", "Un ensemble de boutons apparentés au sein d'un onglet", "Un dossier de fichiers", "Une sélection de texte"], a: 1, exp: "Onglet ▸ groupe ▸ bouton : le groupe rassemble des commandes voisines." },
    { type: "qcm", q: "Comment afficher rapidement les info-bulles de raccourcis clavier sur le ruban ?", opts: ["Appuyer sur la touche Alt", "Appuyer sur Ctrl + P", "Cliquer sur Fichier", "Maintenir Maj"], a: 0, exp: "Alt affiche les lettres d'accès (les KeyTips) sur chaque commande du ruban." },
    { type: "vf", q: "On peut réorganiser l'ordre des commandes de la barre d'accès rapide avec les flèches Haut/Bas dans les Options.", a: true, exp: "Les flèches à droite de la liste montent ou descendent chaque commande." },
    { type: "qcm", q: "Quel est l'intérêt principal de personnaliser son interface ?", opts: ["Changer les couleurs pour le plaisir", "Réduire le nombre de clics sur les actions répétitives", "Ajouter des commandes au menu Fichier", "Verrouiller la mise en forme du document"], a: 1, exp: "Le but est l'efficacité : moins de clics sur ce qu'on fait souvent." }
  ],
  final: {
    title: "Exercice final — Un poste de travail sur mesure",
    intro: `<p>Vous préparez votre poste pour rédiger beaucoup de rapports. Vous voulez trois choses à portée de clic en permanence : <strong>Coller sans mise en forme</strong>, <strong>Nouveau commentaire</strong> et <strong>Enregistrer au format PDF</strong>. Vous voulez aussi un onglet personnalisé « Rapports » regroupant vos styles.</p>
<pre class="pseudo">Fichier ▸ Options ▸ Barre d'outils Accès rapide     // pour les 3 commandes rapides
Fichier ▸ Options ▸ Personnaliser le ruban          // pour l'onglet « Rapports »</pre>`,
    questions: [
      { type: "qcm", q: "Pour rendre « Coller sans mise en forme » toujours visible, où l'ajouter ?", opts: ["Dans un pied de page", "Dans la barre d'accès rapide", "Dans les commentaires", "Dans un nouvel e-mail"], a: 1, exp: "La barre d'accès rapide reste visible quel que soit l'onglet." },
      { type: "qcm", q: "Certaines commandes n'apparaissent pas dans la liste par défaut. Que choisir dans « Choisir les commandes » ?", opts: ["Onglet Accueil seulement", "Toutes les commandes", "Commandes non présentes sur le ruban ou Toutes les commandes", "Macros uniquement"], a: 2, exp: "« Toutes les commandes » (ou « Commandes non présentes sur le ruban ») expose les commandes cachées." },
      { type: "qcm", q: "Pour créer l'onglet « Rapports », quel bouton utiliser ?", opts: ["Nouvel onglet", "Nouveau document", "Nouveau groupe seulement", "Importer"], a: 0, exp: "« Nouvel onglet » crée l'onglet ; on y ajoute ensuite un ou des groupes." },
      { type: "vf", q: "On peut renommer l'onglet personnalisé « Rapports » et lui donner l'ordre voulu parmi les autres onglets.", a: true, exp: "Le bouton Renommer et les flèches Haut/Bas gèrent nom et position." },
      { type: "qcm", q: "Avant de réinitialiser le ruban pour dépanner un collègue, que faire pour ne pas perdre votre config ?", opts: ["Rien", "L'exporter via Importer/Exporter dans un fichier .exportedUI", "La recopier dans un nouveau document", "La verrouiller par mot de passe"], a: 1, exp: "L'export sauvegarde la configuration ; on pourra la réimporter ensuite." }
    ],
    solution: `<p>Marche à suivre complète :</p>
<pre class="pseudo">1. Fichier ▸ Options ▸ Barre d'outils Accès rapide
2. « Choisir les commandes » ▸ Toutes les commandes
3. Sélectionner « Coller en gardant uniquement le texte », cliquer Ajouter
4. Idem pour « Nouveau commentaire » et « Publier au format PDF ou XPS »
5. Réordonner avec les flèches Haut/Bas, puis OK
6. Fichier ▸ Options ▸ Personnaliser le ruban ▸ Nouvel onglet
7. Renommer l'onglet « Rapports », renommer son groupe « Styles »
8. Ajouter les commandes de style voulues, OK
9. (Optionnel) Importer/Exporter ▸ Exporter pour sauvegarder le tout</pre>
<p>Résultat : trois commandes clés toujours visibles et un onglet maison prêt à l'emploi.</p>`
  }
};
</script>
