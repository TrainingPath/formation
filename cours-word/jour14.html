<script>
var DAY = {
  num: 14,
  title: "Publipostage : étiquettes et e-mails",
  subtitle: "Fusionner vers des planches d'étiquettes et des envois d'e-mails.",
  theory: `
<h3>1. Deux nouvelles sorties de fusion</h3>
<p>Le jour 13 fusionnait vers des lettres. Le même moteur produit aussi des <strong>étiquettes</strong> (planches d'adresses, badges) et des <strong>e-mails personnalisés</strong>. La source de données et les champs de fusion fonctionnent exactement pareil.</p>
<h3>2. Le publipostage d'étiquettes</h3>
<pre class="pseudo">Ruban ▸ Publipostage ▸ Démarrer la fusion ▸ Étiquettes…</pre>
<p>Word demande le <strong>modèle d'étiquettes</strong> : un fournisseur (Avery, etc.) et une référence de planche (ex. « Avery 5160 »). Il crée alors une page découpée en cases, une par étiquette. Chaque case reçoit les mêmes champs.</p>
<pre class="pseudo">Dans la 1re case : Insérer le Bloc d'adresse (ou les champs voulus)
Publipostage ▸ Mettre à jour les étiquettes     // recopie la 1re case dans TOUTES les autres</pre>
<div class="warn">Étape que tout le monde oublie : après avoir composé la première étiquette, cliquez sur « <strong>Mettre à jour les étiquettes</strong> ». Sinon seule la première case contient vos champs et toutes les autres restent vides. Word ajoute automatiquement le champ «Enregistrement suivant» dans chaque case pour passer au destinataire suivant.</div>
<h3>3. Choisir la bonne référence d'étiquettes</h3>
<p>La référence doit correspondre à vos planches physiques (dimensions, nombre par page). Si aucune ne convient : « Nouvelle étiquette » permet de saisir les marges et dimensions exactes. Un mauvais choix décale l'impression.</p>
<h3>4. Les enveloppes</h3>
<pre class="pseudo">Ruban ▸ Publipostage ▸ Démarrer la fusion ▸ Enveloppes…</pre>
<p>Même logique, avec réglage de la taille d'enveloppe, de l'adresse d'expéditeur et de la position d'impression.</p>
<h3>5. Le publipostage vers e-mails</h3>
<pre class="pseudo">Ruban ▸ Publipostage ▸ Démarrer la fusion ▸ Messages électroniques…</pre>
<p>La source doit contenir une colonne <strong>adresse e-mail</strong>. On compose le message (avec champs de fusion), puis :</p>
<pre class="pseudo">Publipostage ▸ Terminer et fusionner ▸ Envoyer des messages électroniques :
  • À : (choisir la colonne e-mail)
  • Objet : (ligne d'objet)
  • Format : HTML / Texte brut / Pièce jointe</pre>
<div class="warn">L'envoi d'e-mails en fusion nécessite <strong>Outlook (client de bureau) installé et configuré</strong> comme application de messagerie par défaut. Sans Outlook classique, l'envoi direct ne fonctionne pas (Outlook web/nouvelle version ne prend pas toujours en charge cette fusion). Les messages partent alors via Outlook, un par destinataire.</div>
<h3>6. Bonnes pratiques d'envoi</h3>
<div class="tip">Testez toujours en vous envoyant d'abord la fusion à vous-même (mettez votre adresse dans quelques lignes de test). Vérifiez l'objet, les champs et surtout que chaque destinataire ne voit que son propre message (contrairement à un « Cci » massif). En HTML, la mise en forme est conservée ; en texte brut, elle est perdue.</div>
<h3>7. Réutiliser la même source</h3>
<p>Une seule et même liste (Excel) peut servir tour à tour aux lettres, aux étiquettes, aux enveloppes et aux e-mails : c'est tout l'intérêt d'avoir une source de données propre et unique.</p>`,
  exercises: [
    { type: "qcm", q: "Le publipostage d'étiquettes produit…", opts: ["Un seul long texte", "Une planche de cases, une par étiquette", "Un PDF unique", "Un e-mail"], a: 1, exp: "Word découpe la page en cases selon le modèle d'étiquettes." },
    { type: "qcm", q: "Après avoir composé la première étiquette, quelle étape est cruciale ?", opts: ["Imprimer", "Cliquer « Mettre à jour les étiquettes »", "Changer la police", "Fermer Word"], a: 1, exp: "Sans cela, seule la première case contient les champs." },

    { type: "qcm", q: "Pour un envoi d'e-mails en fusion, la source doit contenir…", opts: ["Une colonne adresse e-mail", "Une image", "Un numéro de page", "Un thème"], a: 0, exp: "L'adresse e-mail sert de destinataire à chaque message." },

    { type: "vf", q: "L'envoi d'e-mails en fusion nécessite généralement Outlook de bureau configuré.", a: true, exp: "La fusion e-mail s'appuie sur le client Outlook classique par défaut." },
    { type: "qcm", q: "En fusion e-mail, le format « Texte brut » a pour conséquence…", opts: ["De garder toute la mise en forme", "De perdre la mise en forme", "D'ajouter des images", "De chiffrer le message"], a: 1, exp: "Le texte brut supprime la mise en forme ; le HTML la conserve." },
    { type: "qcm", q: "Quel bon réflexe avant un envoi massif ?", opts: ["Ne rien tester", "S'envoyer d'abord un test à soi-même", "Supprimer la source", "Changer les marges"], a: 1, exp: "Un test personnel valide objet, champs et rendu." },
    { type: "vf", q: "Une même source Excel peut servir aux lettres, étiquettes et e-mails.", a: true, exp: "Le moteur de fusion est identique ; seule la sortie change." },
    { type: "qcm", q: "Pour composer l'adresse sur l'étiquette, on insère…", opts: ["Un tableau", "Le Bloc d'adresse ou les champs voulus", "Une image", "Un commentaire"], a: 1, exp: "Le Bloc d'adresse formate l'adresse à partir des champs." },
    { type: "qcm", q: "Si aucune référence d'étiquette ne convient…", opts: ["On abandonne", "On crée une « Nouvelle étiquette » avec les dimensions exactes", "On change la police", "On imprime en PDF"], a: 1, exp: "On saisit manuellement marges et dimensions de la planche." },
    { type: "qcm", q: "En fusion e-mail, où choisit-on la colonne contenant les adresses ?", opts: ["Dans Terminer et fusionner ▸ Envoyer des messages ▸ champ À", "Dans Accueil ▸ Police", "Dans Fichier ▸ Options", "Dans Affichage"], a: 0, exp: "La boîte d'envoi demande la colonne À, l'objet et le format." },
    { type: "vf", q: "Chaque destinataire d'une fusion e-mail reçoit un message individuel (pas un envoi groupé visible).", a: true, exp: "Contrairement à un Cci massif, chacun reçoit son propre message." },
    { type: "qcm", q: "Les enveloppes en publipostage permettent de régler…", opts: ["La taille d'enveloppe et l'adresse d'expéditeur", "La couleur du texte seulement", "Le zoom", "La langue de l'interface"], a: 0, exp: "On paramètre taille, expéditeur et position d'impression." }
  ],
  final: {

    intro: `<p>À partir d'un fichier Excel (Nom, Adresse, CP, Ville, Email), vous devez d'abord imprimer une planche d'étiquettes d'adresses (Avery 5160), puis envoyer à ces mêmes contacts un e-mail personnalisé de relance.</p>
<pre class="pseudo">Ruban ▸ Publipostage ▸ Démarrer la fusion ▸ Étiquettes… puis Messages électroniques…</pre>`,
    questions: [
      { type: "qcm", q: "Après composition de la 1re étiquette, quel bouton cliquer ?", opts: ["Imprimer", "Mettre à jour les étiquettes", "Aperçu", "Fermer"], a: 1, exp: "Il recopie les champs dans toutes les cases." },
      { type: "qcm", q: "Pour l'adresse formatée dans l'étiquette, on insère…", opts: ["Le Bloc d'adresse", "Une image", "Un renvoi", "Un commentaire"], a: 0, exp: "Le Bloc d'adresse compose l'adresse à partir des champs." },
      { type: "qcm", q: "Pour l'e-mail de relance, quel type de fusion démarrer ?", opts: ["Lettres", "Étiquettes", "Messages électroniques", "Enveloppes"], a: 2, exp: "Le type Messages électroniques prépare l'envoi e-mail." },
      { type: "vf", q: "La fusion e-mail utilisera la colonne Email comme champ À.", a: true, exp: "On désigne la colonne Email dans la boîte d'envoi." },
      { type: "qcm", q: "Prérequis technique pour l'envoi direct des e-mails ?", opts: ["Aucun", "Outlook de bureau installé et configuré par défaut", "Une imprimante", "Un PDF"], a: 1, exp: "La fusion e-mail passe par le client Outlook classique." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">ÉTIQUETTES
1. Publipostage ▸ Démarrer la fusion ▸ Étiquettes ▸ choisir Avery 5160 ▸ OK

E-MAIL

};
