var DAY = {
  num: 19,
  title: "Documents longs : mode plan et navigation",
  subtitle: "Organiser, réorganiser et parcourir un gros document.",
  theory: `
<h3>1. Le volet de navigation</h3>
<p>Le <strong>volet de navigation</strong> affiche le plan cliquable des titres (à condition d'avoir appliqué les styles Titre, jour 2). On y saute d'un chapitre à l'autre, et surtout on peut <strong>glisser-déposer</strong> un titre pour déplacer TOUTE sa section (titre + contenu + sous-titres) d'un coup.</p>
<pre class="pseudo">Ctrl + F          // ouvre le volet de navigation (recherche)
Ruban ▸ Affichage ▸ Afficher ▸ Volet de navigation
Onglet Titres     // plan cliquable ; glisser un titre pour réorganiser</pre>
<div class="tip">Glisser un Titre 1 dans le volet déplace tout le chapitre : c'est la façon la plus rapide de réorganiser un long document, bien plus sûre que couper/coller de gros blocs.</div>
<h3>2. Le mode Plan</h3>
<p>Le <strong>mode Plan</strong> (Outline) affiche le document réduit à sa structure hiérarchique. On peut replier/déplier les niveaux, promouvoir/abaisser un titre, et déplacer des blocs.</p>
<pre class="pseudo">Ruban ▸ Affichage ▸ Modes ▸ Plan
  • Tab / Maj+Tab        // abaisser / promouvoir un niveau
  • Flèches Monter/Descendre  // déplacer le bloc
  • Afficher le niveau : 1, 2, 3…  // ne montrer que les titres jusqu'à ce niveau</pre>
<div class="warn">En mode Plan, « abaisser » un Titre 1 en Titre 2 change son STYLE. Utile pour restructurer, mais vérifiez ensuite la table des matières. Pour revenir à l'écran normal : Affichage ▸ Modes ▸ Mode Page (ou « Fermer le mode Plan »).</div>
<h3>3. Replier les titres dans le mode Page</h3>
<p>Même hors mode Plan, on peut replier une section : survolez un titre, un petit triangle apparaît ; cliquez pour masquer/afficher son contenu. Pratique pour se concentrer sur un chapitre.</p>
<div class="tip">Cette fonction de repli des titres dans le mode Page normal est présente dans Word 365 et 2016+. Elle rend la navigation dans un long rapport bien plus confortable.</div>
<h3>4. Signets et renvois pour naviguer</h3>
<p>Un <strong>signet</strong> (bookmark) est un repère invisible nommé, posé à un endroit précis, vers lequel on peut créer un lien ou un renvoi.</p>
<pre class="pseudo">Insertion ▸ Liens ▸ Signet          // poser/atteindre un signet
Insertion ▸ Liens ▸ Lien hypertexte ▸ Emplacement dans ce document</pre>
<h3>5. Atteindre (Go To)</h3>
<pre class="pseudo">Ctrl + B… non : Ctrl + Alt + G ? — utilisez F5 (Atteindre)
F5          // boîte « Atteindre » : page, section, signet, commentaire…</pre>
<p><code>F5</code> ouvre « Atteindre » : sautez à une page, une section, un signet, une note ou un objet précis.</p>
<h3>6. Le document maître (subtile, à connaître)</h3>
<p>Le <strong>document maître</strong> relie plusieurs sous-documents (un fichier par chapitre) en un seul ensemble, géré depuis le mode Plan (groupe Document maître).</p>
<div class="warn">Le document maître est puissant mais réputé fragile (corruptions fréquentes sur de gros projets). Pour la plupart des rapports, préférez un seul fichier bien structuré par styles. Réservez le document maître aux très gros ouvrages collaboratifs, avec sauvegardes.</div>
<h3>7. Fractionner la fenêtre</h3>
<pre class="pseudo">Affichage ▸ Fenêtre ▸ Fractionner     // voir deux endroits du même document à la fois</pre>
<p>Le fractionnement affiche deux vues du même document : idéal pour recopier une info d'un chapitre à un autre sans perdre sa place.</p>`,
  exercises: [
    { type: "qcm", q: "Le volet de navigation affiche le plan des titres à condition que…", opts: ["Le document soit court", "Les styles de titre aient été appliqués", "Le fichier soit un PDF", "On soit en mode Plan"], a: 1, exp: "Sans styles de titre, le volet Titres reste vide." },

    { type: "vf", q: "Glisser un titre dans le volet de navigation déplace toute sa section.", a: true, exp: "Titre + contenu + sous-titres bougent ensemble." },

    { type: "qcm", q: "En mode Plan, Tab sur un titre…", opts: ["Insère une tabulation", "Abaisse le titre d'un niveau (change son style)", "Imprime", "Supprime le titre"], a: 1, exp: "Tab abaisse ; Maj+Tab promeut. Le style change en conséquence." },
    { type: "qcm", q: "Quel raccourci ouvre la boîte « Atteindre » ?", opts: ["F5", "F9", "F1", "F12"], a: 0, exp: "F5 permet d'aller à une page, section, signet…" },

    { type: "qcm", q: "Qu'est-ce qu'un signet ?", opts: ["Un commentaire", "Un repère invisible nommé vers lequel pointer un lien/renvoi", "Une image", "Un style"], a: 1, exp: "Le signet marque un emplacement précis, réutilisable en lien." },
    { type: "qcm", q: "Pour voir deux endroits du même document à la fois…", opts: ["Affichage ▸ Fractionner", "Fichier ▸ Imprimer", "Accueil ▸ Gras", "Insertion ▸ Tableau"], a: 0, exp: "Le fractionnement affiche deux vues simultanées." },
    { type: "vf", q: "Le document maître est réputé fragile et à réserver aux très gros projets.", a: true, exp: "Les corruptions sont fréquentes : un fichier bien structuré suffit souvent." },
    { type: "qcm", q: "Pour réorganiser un long rapport, le plus sûr est…", opts: ["Couper/coller de gros blocs", "Glisser les titres dans le volet de navigation ou le mode Plan", "Changer la police", "Imprimer"], a: 1, exp: "Déplacer par les titres évite les erreurs de sélection." },
    { type: "qcm", q: "Où affiche-t-on seulement les titres jusqu'au niveau 2 ?", opts: ["Mode Plan ▸ Afficher le niveau : 2", "Accueil ▸ Police", "Fichier ▸ Imprimer", "Affichage ▸ Zoom"], a: 0, exp: "« Afficher le niveau » limite la profondeur affichée." },
    { type: "qcm", q: "Un lien hypertexte interne pointe vers…", opts: ["Un autre logiciel", "Un emplacement dans ce document (titre, signet)", "Une imprimante", "Une police"], a: 1, exp: "« Emplacement dans ce document » crée un lien interne." },
    { type: "vf", q: "Abaisser un Titre 1 en mode Plan modifie la table des matières après mise à jour.", a: true, exp: "Le changement de niveau de titre se répercute sur la TDM." },
    { type: "qcm", q: "Pour quitter le mode Plan…", opts: ["Affichage ▸ Mode Page (ou Fermer le mode Plan)", "Fermer Word", "Ctrl + P", "Supprimer les titres"], a: 0, exp: "On revient au mode Page normal via le ruban." }
  ],
  final: {
    title: "Exercice final — Restructurer un mémoire",
    intro: `<p>Un mémoire de 60 pages a ses styles de titre en place, mais le chapitre 3 devrait passer avant le chapitre 2, et une sous-partie du chapitre 4 doit devenir un chapitre à part entière. Vous devez réorganiser sans casser la structure.</p>
<pre class="pseudo">Ruban ▸ Affichage ▸ Volet de navigation  /  Modes ▸ Plan</pre>`,
    questions: [
      { type: "qcm", q: "Comment placer le chapitre 3 avant le chapitre 2 rapidement ?", opts: ["Couper/coller manuellement", "Glisser le titre du chapitre 3 au-dessus du 2 dans le volet de navigation", "Changer la police", "Imprimer"], a: 1, exp: "Le glisser-déposer des titres déplace tout le chapitre." },
      { type: "qcm", q: "Pour transformer une sous-partie (Titre 2) en chapitre (Titre 1)…", opts: ["La mettre en gras", "En mode Plan, la promouvoir (Maj+Tab) d'un niveau", "L'imprimer", "La supprimer"], a: 1, exp: "Promouvoir change Titre 2 en Titre 1." },
      { type: "qcm", q: "Après restructuration, que faut-il mettre à jour ?", opts: ["La table des matières", "La police", "Les marges", "Rien"], a: 0, exp: "La TDM doit être recalculée (F9) après réorganisation." },
      { type: "vf", q: "Le volet de navigation ne fonctionne que si les styles de titre sont appliqués.", a: true, exp: "Il se base sur Titre 1/2/3." },
      { type: "qcm", q: "Pour sauter directement à la page 42…", opts: ["F5 (Atteindre) ▸ Page ▸ 42", "Changer la police", "Insérer un tableau", "Réduire le zoom"], a: 0, exp: "La boîte Atteindre (F5) va à une page précise." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Ctrl + F ▸ onglet Titres (volet de navigation)
2. Glisser le titre « Chapitre 3 » au-dessus de « Chapitre 2 » : tout le chapitre suit
3. Affichage ▸ Modes ▸ Plan
4. Sélectionner la sous-partie du chapitre 4 ▸ Maj+Tab pour la promouvoir en Titre 1
5. Ajuster ses éventuels sous-titres (abaisser si besoin)
6. Affichage ▸ Mode Page pour revenir à l'écran normal
7. Cliquer la table des matières ▸ Mettre à jour toute la table (F9)
8. Vérifier la cohérence des numéros de chapitres</pre>
<p>Le mémoire est réorganisé proprement, structure et sommaire à jour.</p>`
  }
};
