<script>
var DAY = {
  num: 10,
  title: "Tableaux avancés : formules et mise en forme",
  subtitle: "Des tableaux calculés et bien présentés.",
  theory: `
<h3>1. Rappel express : insérer un tableau</h3>
<pre class="pseudo">Ruban ▸ Insertion ▸ Tableau ▸ (glisser la grille ou « Insérer un tableau… »)</pre>
<p>Une fois le tableau créé, deux onglets contextuels apparaissent : <strong>Création de tableau</strong> (styles, bordures, trame) et <strong>Disposition</strong> (lignes, colonnes, fusion, alignement, formules).</p>
<h3>2. Les styles de tableau</h3>
<pre class="pseudo">Outils de tableau ▸ Création ▸ Styles de tableau     // galerie de styles prédéfinis</pre>
<p>Les cases « Ligne d'en-tête », « Ligne des totaux », « Lignes à bandes » modulent le style. Comme pour le texte, un style de tableau garantit une présentation homogène et modifiable d'un coup.</p>
<h3>3. Fusionner, fractionner, ajuster</h3>
<pre class="pseudo">Disposition ▸ Fusionner les cellules / Fractionner les cellules
Disposition ▸ Ajustement automatique ▸ Ajuster au contenu / à la fenêtre
Disposition ▸ Distribuer les lignes / colonnes     // largeurs/hauteurs égales</pre>
<h3>4. Les formules dans un tableau</h3>
<p>Word sait calculer dans un tableau, comme un mini-tableur. La cellule où placer le résultat, puis :</p>
<pre class="pseudo">Disposition ▸ Données ▸ Formule (fx)
  =SUM(ABOVE)     // somme des cellules au-dessus
  =SUM(LEFT)      // somme des cellules à gauche
  =AVERAGE(ABOVE) // moyenne
  =PRODUCT(LEFT)  // produit</pre>
<p>Les <strong>références de position</strong> ABOVE, BELOW, LEFT, RIGHT désignent les cellules voisines. On peut aussi utiliser des <strong>références type tableur</strong> : les colonnes sont A, B, C… et les lignes 1, 2, 3… donc <code>=B2*C2</code> ou <code>=SUM(A1:A5)</code>.</p>
<div class="warn">Une formule de tableau est un champ : si vous changez un chiffre, le résultat NE se recalcule PAS tout seul. Sélectionnez la formule et appuyez sur F9, ou sélectionnez tout le tableau et F9. Pour de vrais calculs vivants, un tableau Excel inséré (objet lié) est préférable.</div>
<h3>5. Le format des nombres</h3>
<p>Dans la boîte Formule, le champ « Format » applique une présentation : <code>0</code> (entier), <code>0,00</code> (deux décimales), <code># ##0,00 €</code> (monétaire avec séparateur de milliers). Le format ne change pas la valeur, seulement l'affichage.</p>
<h3>6. Répéter la ligne d'en-tête</h3>
<p>Pour un tableau qui s'étale sur plusieurs pages, faites répéter automatiquement la première ligne en haut de chaque page :</p>
<pre class="pseudo">Curseur dans la ligne d'en-tête ▸ Disposition ▸ Répéter les lignes d'en-tête</pre>
<h3>7. Trier</h3>
<pre class="pseudo">Disposition ▸ Données ▸ Trier     // trier par colonne, croissant/décroissant, texte/nombre/date</pre>
<div class="tip">Convertir texte ↔ tableau : « Insertion ▸ Tableau ▸ Convertir le texte en tableau » transforme des lignes séparées par des tabulations ou des points-virgules en tableau, et inversement via « Disposition ▸ Convertir en texte ».</div>`,
  exercises: [
    { type: "qcm", q: "Quels onglets contextuels apparaissent quand on clique dans un tableau ?", opts: ["Création et Disposition (Outils de tableau)", "Accueil et Insertion", "Références et Révision", "Affichage et Fichier"], a: 0, exp: "Création (styles/bordures) et Disposition (structure/formules)." },
    { type: "qcm", q: "Quelle formule additionne les cellules situées au-dessus ?", opts: ["=SUM(LEFT)", "=SUM(ABOVE)", "=AVERAGE(ABOVE)", "=PRODUCT(ABOVE)"], a: 1, exp: "=SUM(ABOVE) additionne la colonne au-dessus de la cellule." },
    { type: "vf", q: "Une formule de tableau se recalcule automatiquement quand on change un chiffre.", a: false, exp: "C'est un champ : il faut appuyer sur F9 pour recalculer." },
    { type: "qcm", q: "Comment recalculer une formule après avoir modifié une valeur ?", opts: ["F5", "Sélectionner la formule et appuyer sur F9", "Ctrl + S", "Alt + F4"], a: 1, exp: "F9 met à jour le champ de formule." },
    { type: "qcm", q: "En références type tableur, la 2e colonne 3e ligne se note…", opts: ["B3", "3B", "C2", "2C"], a: 0, exp: "Colonne = lettre (B), ligne = numéro (3) : B3." },
    { type: "qcm", q: "Comment faire répéter la ligne d'en-tête sur chaque page ?", opts: ["La recopier à la main", "Disposition ▸ Répéter les lignes d'en-tête", "Changer la police", "Insérer un saut de page"], a: 1, exp: "Cette option répète l'en-tête en haut de chaque page automatiquement." },
    { type: "vf", q: "Le champ Format d'une formule change l'affichage sans changer la valeur.", a: true, exp: "Ex. 0,00 affiche deux décimales, mais la valeur reste identique." },
    { type: "qcm", q: "Pour rendre toutes les colonnes de même largeur, on utilise…", opts: ["Fusionner", "Distribuer les colonnes", "Trier", "Fractionner"], a: 1, exp: "« Distribuer les colonnes » égalise les largeurs." },
    { type: "qcm", q: "=AVERAGE(ABOVE) calcule…", opts: ["La somme au-dessus", "La moyenne des cellules au-dessus", "Le produit", "Le maximum"], a: 1, exp: "AVERAGE renvoie la moyenne des cellules de la plage." },
    { type: "vf", q: "On peut convertir un texte séparé par des tabulations en tableau.", a: true, exp: "Insertion ▸ Tableau ▸ Convertir le texte en tableau le permet." },
    { type: "qcm", q: "Pour trier un tableau par la colonne Nom de A à Z…", opts: ["Disposition ▸ Trier ▸ colonne Nom, croissant", "Accueil ▸ Gras", "Insertion ▸ Image", "Fichier ▸ Imprimer"], a: 0, exp: "L'outil Trier gère colonne, ordre et type de données." },
    { type: "qcm", q: "Pour un tableau à calculs réellement dynamiques, mieux vaut…", opts: ["Un tableau Word avec F9 à chaque fois", "Insérer un tableau Excel (objet)", "Un simple texte", "Une image"], a: 1, exp: "Un objet Excel recalcule en direct, contrairement aux formules Word." },
    { type: "qcm", q: "=PRODUCT(LEFT) fait…", opts: ["La somme à gauche", "Le produit des cellules à gauche", "La moyenne à gauche", "Le compte à gauche"], a: 1, exp: "PRODUCT multiplie les cellules de la plage indiquée." },
    { type: "vf", q: "Les cases « Ligne d'en-tête » et « Lignes à bandes » modulent le style du tableau.", a: true, exp: "Ces options d'onglet Création activent des mises en forme du style choisi." },
    { type: "qcm", q: "Comment fusionner deux cellules voisines sélectionnées ?", opts: ["Disposition ▸ Fusionner les cellules", "Insertion ▸ Tableau", "Accueil ▸ Coller", "Ctrl + F"], a: 0, exp: "« Fusionner les cellules » réunit la sélection en une seule cellule." }
  ],
  final: {
    title: "Exercice final — Une facture calculée",
    intro: `<p>Vous montez une facture simple : colonnes Article, Qté, Prix unitaire, Montant. Le Montant de chaque ligne = Qté × Prix, et une dernière ligne Total additionne les montants. Vous voulez un affichage à deux décimales.</p>
<pre class="pseudo">Ruban ▸ Insertion ▸ Tableau  puis  Disposition ▸ Données ▸ Formule</pre>`,
    questions: [
      { type: "qcm", q: "Pour Montant = Qté × Prix sur la ligne 2 (Qté en B2, Prix en C2), quelle formule ?", opts: ["=SUM(ABOVE)", "=B2*C2", "=PRODUCT(ABOVE)", "=AVERAGE(LEFT)"], a: 1, exp: "Références type tableur : =B2*C2 multiplie quantité et prix." },
      { type: "qcm", q: "Pour le Total des montants (colonne D), quelle formule dans la cellule du bas ?", opts: ["=SUM(ABOVE)", "=B2*C2", "=AVERAGE(ABOVE)", "=PRODUCT(LEFT)"], a: 0, exp: "=SUM(ABOVE) additionne la colonne Montant au-dessus." },
      { type: "qcm", q: "Comment afficher deux décimales ?", opts: ["Changer la police", "Choisir le format 0,00 dans la boîte Formule", "Fusionner les cellules", "Trier"], a: 1, exp: "Le format 0,00 impose deux décimales à l'affichage." },
      { type: "vf", q: "Si vous changez une quantité, il faut sélectionner les formules et appuyer sur F9 pour recalculer.", a: true, exp: "Les formules Word sont des champs : F9 les met à jour." },
      { type: "qcm", q: "Pour que la facture reste propre sur deux pages, quel réglage ?", opts: ["Répéter les lignes d'en-tête", "Changer la couleur", "Réduire le zoom", "Ajouter un commentaire"], a: 0, exp: "L'en-tête se répète en haut de chaque page." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Insertion ▸ Tableau ▸ 4 colonnes (Article, Qté, Prix, Montant) + lignes voulues
2. Cellule Montant ligne 2 ▸ Disposition ▸ Formule ▸ =B2*C2 ▸ Format 0,00 ▸ OK
3. Répéter pour chaque ligne (=B3*C3, =B4*C4…)
4. Cellule Total (bas de la colonne Montant) ▸ Formule ▸ =SUM(ABOVE) ▸ Format 0,00 ▸ OK
5. Après tout changement de Qté/Prix : sélectionner le tableau ▸ F9 (recalcul)
6. Curseur dans la ligne d'en-tête ▸ Disposition ▸ Répéter les lignes d'en-tête
7. (Optionnel) Création ▸ appliquer un style de tableau propre</pre>
<p>La facture calcule ses montants et son total, avec un affichage soigné.</p>`
  }
};
</script>
<script src="engine.js"></script>

};
