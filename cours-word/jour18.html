<script>
var DAY = {
  num: 18,
  title: "Comparer, combiner et protéger un document",
  subtitle: "Confronter deux versions et sécuriser un fichier.",
  theory: `
<h3>1. Comparer deux versions</h3>
<p>La <strong>comparaison</strong> confronte deux fichiers (par ex. « original » et « version corrigée reçue ») et produit un troisième document montrant toutes les différences sous forme de modifications suivies. Pratique quand un relecteur a oublié d'activer le suivi.</p>
<pre class="pseudo">Ruban ▸ Révision ▸ Comparer ▸ Comparer…
  • Document original : (fichier A)
  • Document révisé : (fichier B)
  • Résultat : un nouveau document avec les différences en marques</pre>
<h3>2. Combiner (fusionner les révisions)</h3>
<p>La <strong>combinaison</strong> regroupe dans un seul document les modifications de PLUSIEURS relecteurs (chacun ayant renvoyé sa copie). On combine deux à deux jusqu'à tout réunir.</p>
<pre class="pseudo">Ruban ▸ Révision ▸ Comparer ▸ Combiner…</pre>
<div class="tip">Comparer = trouver les différences entre 2 versions. Combiner = agréger les corrections de plusieurs relecteurs. Dans les deux cas, on obtient des modifications suivies à accepter/refuser (jour 17).</div>
<h3>3. Marquer comme final</h3>
<p><strong>Marquer comme final</strong> passe le document en lecture seule et signale « version définitive ». Ce n'est PAS une vraie sécurité : un clic sur « Modifier quand même » la lève. C'est un simple garde-fou psychologique.</p>
<pre class="pseudo">Fichier ▸ Informations ▸ Protéger le document ▸ Marquer comme final</pre>
<h3>4. Chiffrer avec un mot de passe</h3>
<p>Le vrai verrouillage : <strong>Chiffrer avec mot de passe</strong> rend le fichier illisible sans le mot de passe (chiffrement réel).</p>
<pre class="pseudo">Fichier ▸ Informations ▸ Protéger le document ▸ Chiffrer avec mot de passe</pre>
<div class="warn">Un mot de passe de chiffrement perdu = fichier irrécupérable (pas de « mot de passe oublié »). Notez-le en lieu sûr. Distinguez aussi le mot de passe d'OUVERTURE (chiffrement) du mot de passe de MODIFICATION (accessible en lecture par tous, mais éditable seulement avec le mot de passe), réglable dans Enregistrer sous ▸ Outils ▸ Options générales.</div>
<h3>5. Restreindre la modification</h3>
<p>Comme pour les formulaires (jour 16), on peut limiter ce que les autres peuvent faire : autoriser seulement les commentaires, le suivi, le remplissage de formulaires, ou aucune modification ; on peut aussi accorder des exceptions à certaines personnes sur des zones précises.</p>
<pre class="pseudo">Ruban ▸ Révision ▸ Protéger ▸ Restreindre la modification
  • Restrictions de mise en forme (limiter les styles)
  • Restrictions de modification (Aucune / Commentaires / Suivi / Remplissage)</pre>
<h3>6. Inspecter le document</h3>
<p>L'<strong>Inspecteur de document</strong> repère et supprime les données cachées avant partage : commentaires, révisions, métadonnées (auteur), texte masqué, données personnelles.</p>
<pre class="pseudo">Fichier ▸ Informations ▸ Vérifier l'absence de problèmes ▸ Inspecter le document</pre>
<div class="tip">Réflexe avant diffusion externe : Inspecter le document pour retirer noms d'auteurs, commentaires et modifications suivies oubliées. On y vérifie aussi l'accessibilité et la compatibilité.</div>
<h3>7. Restreindre l'accès (IRM)</h3>
<p>Dans les environnements 365 avec droits gérés, « <strong>Restreindre l'accès</strong> » (Information Rights Management) permet d'autoriser lecture/modification par personne, voire d'empêcher l'impression ou le copier-coller. Nécessite un service de gestion des droits (souvent en entreprise).</p>`,
  exercises: [
    { type: "qcm", q: "À quoi sert la comparaison de documents ?", opts: ["À imprimer", "À montrer les différences entre deux versions sous forme de marques", "À changer la police", "À traduire"], a: 1, exp: "Elle produit un document tiers listant toutes les différences." },
    { type: "qcm", q: "La combinaison sert surtout à…", opts: ["Réunir les corrections de plusieurs relecteurs", "Imprimer plus vite", "Changer les marges", "Créer un tableau"], a: 0, exp: "On agrège les révisions de plusieurs copies en un document." },
    { type: "vf", q: "Comparer est utile même si un relecteur a oublié d'activer le suivi.", a: true, exp: "La comparaison retrouve les différences a posteriori." },
    { type: "qcm", q: "« Marquer comme final » constitue…", opts: ["Un chiffrement fort", "Un simple garde-fou (lecture seule levable en un clic)", "Une suppression", "Un mot de passe"], a: 1, exp: "Ce n'est pas une vraie sécurité : « Modifier quand même » la lève." },
    { type: "qcm", q: "Quel est le vrai verrouillage d'un fichier ?", opts: ["Marquer comme final", "Chiffrer avec mot de passe", "Réduire le zoom", "Changer l'auteur"], a: 1, exp: "Le chiffrement rend le fichier illisible sans mot de passe." },
    { type: "vf", q: "Un mot de passe de chiffrement perdu rend le fichier irrécupérable.", a: true, exp: "Aucune récupération : il faut le conserver en lieu sûr." },
    { type: "qcm", q: "Où trouver Comparer et Combiner ?", opts: ["Révision ▸ Comparer", "Accueil ▸ Police", "Insertion ▸ Objet", "Fichier ▸ Imprimer"], a: 0, exp: "Le groupe Comparer de l'onglet Révision." },
    { type: "qcm", q: "L'Inspecteur de document sert à…", opts: ["Imprimer", "Repérer et supprimer données cachées, commentaires, métadonnées", "Changer la police", "Créer un index"], a: 1, exp: "Il nettoie le fichier avant diffusion." },
    { type: "qcm", q: "Différence entre mot de passe d'ouverture et de modification ?", opts: ["Aucune", "Ouverture = chiffrement (lecture bloquée) ; modification = lecture libre mais édition protégée", "Les deux chiffrent", "Aucun ne protège"], a: 1, exp: "L'un bloque la lecture, l'autre seulement l'édition." },
    { type: "vf", q: "Restreindre la modification peut n'autoriser que les commentaires.", a: true, exp: "On choisit le niveau : Aucune, Commentaires, Suivi ou Remplissage." },
    { type: "qcm", q: "Après comparaison/combinaison, les différences apparaissent…", opts: ["En texte figé", "Comme des modifications suivies à accepter/refuser", "En image", "En PDF"], a: 1, exp: "On les traite comme un suivi des modifications classique." },
    { type: "qcm", q: "Réflexe avant d'envoyer un document à l'extérieur ?", opts: ["Changer la police", "Inspecter le document pour retirer métadonnées et révisions oubliées", "Réduire le zoom", "Ajouter un tableau"], a: 1, exp: "L'inspection évite de divulguer commentaires et données d'auteur." },
    { type: "qcm", q: "Où se trouve « Chiffrer avec mot de passe » ?", opts: ["Fichier ▸ Informations ▸ Protéger le document", "Accueil ▸ Gras", "Insertion ▸ Image", "Affichage ▸ Zoom"], a: 0, exp: "La protection du document est dans Fichier ▸ Informations." },
    { type: "vf", q: "« Restreindre l'accès » (IRM) nécessite en général un service de gestion des droits.", a: true, exp: "L'IRM s'appuie sur une infrastructure de droits, surtout en entreprise (365)." },
    { type: "qcm", q: "Pour combiner les révisions de 3 relecteurs, on procède…", opts: ["Tout d'un coup", "Deux à deux, en combinant successivement", "En imprimant", "En changeant la police"], a: 1, exp: "On combine par paires jusqu'à réunir toutes les révisions." }
  ],
  final: {
    title: "Exercice final — Finaliser un rapport confidentiel",
    intro: `<p>Deux relecteurs vous ont renvoyé leur version d'un rapport. Vous devez combiner leurs corrections, comparer le tout à l'original, nettoyer les données cachées, puis protéger le fichier par mot de passe avant envoi à la direction.</p>
<pre class="pseudo">Ruban ▸ Révision ▸ Comparer   +   Fichier ▸ Informations ▸ Protéger le document</pre>`,
    questions: [
      { type: "qcm", q: "Pour réunir les corrections des deux relecteurs…", opts: ["Comparer", "Combiner (deux à deux)", "Imprimer", "Chiffrer"], a: 1, exp: "Combiner agrège les révisions de plusieurs copies." },
      { type: "qcm", q: "Pour vérifier l'écart avec l'original…", opts: ["Combiner", "Comparer original / version combinée", "Marquer comme final", "Réduire le zoom"], a: 1, exp: "La comparaison montre toutes les différences." },
      { type: "qcm", q: "Avant envoi, comment retirer noms d'auteurs et commentaires oubliés ?", opts: ["Inspecter le document", "Changer la police", "Ajouter un tableau", "Imprimer"], a: 0, exp: "L'Inspecteur de document nettoie les données cachées." },
      { type: "vf", q: "Pour bloquer réellement l'ouverture, il faut Chiffrer avec mot de passe, pas Marquer comme final.", a: true, exp: "Seul le chiffrement empêche vraiment la lecture." },
      { type: "qcm", q: "Après combinaison, les corrections se présentent comme…", opts: ["Du texte définitif", "Des modifications suivies à accepter/refuser", "Une image", "Un PDF"], a: 1, exp: "On les valide via Accepter/Refuser comme un suivi classique." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Révision ▸ Comparer ▸ Combiner ▸ original + copie du relecteur 1 ▸ OK
2. Combiner de nouveau : résultat + copie du relecteur 2 ▸ OK
3. Révision ▸ Accepter/Refuser les modifications combinées
4. Révision ▸ Comparer ▸ Comparer : original vs version finale (contrôle)
5. Fichier ▸ Informations ▸ Vérifier l'absence de problèmes ▸ Inspecter le document ▸ supprimer commentaires/métadonnées
6. Fichier ▸ Informations ▸ Protéger le document ▸ Chiffrer avec mot de passe ▸ saisir et NOTER le mot de passe
7. Enregistrer et envoyer à la direction</pre>
<p>Le rapport est consolidé, nettoyé et chiffré.</p>`
  }
};
</script>
