var DAY = {
  num: 12,
  title: "Créer un modèle de document (.dotx)",
  subtitle: "Figer une structure réutilisable pour tous vos documents.",
  theory: `
<h3>1. Qu'est-ce qu'un modèle ?</h3>
<p>Un <strong>modèle</strong> (template) est un document « moule » : styles, thème, mise en page, textes fixes, en-têtes… déjà prêts. Quand on crée un document À PARTIR d'un modèle, on obtient une COPIE : on remplit le contenu sans risquer d'abîmer l'original. Extensions :</p>
<ul>
<li><code>.dotx</code> : modèle Word moderne (sans macros).</li>
<li><code>.dotm</code> : modèle avec macros VBA activées.</li>
<li><code>.docx</code> : document ordinaire (pas un modèle).</li>
</ul>
<h3>2. Enregistrer un document comme modèle</h3>
<pre class="pseudo">Fichier ▸ Enregistrer sous ▸ Type : Modèle Word (*.dotx)</pre>
<div class="tip">Quand vous choisissez le type « Modèle Word », Word bascule automatiquement vers le dossier des modèles personnalisés (souvent Documents\\Modèles Office personnalisés). Enregistrez-y votre modèle pour qu'il apparaisse dans Fichier ▸ Nouveau ▸ Personnel.</div>
<h3>3. Créer un document à partir du modèle</h3>
<pre class="pseudo">Fichier ▸ Nouveau ▸ Personnel (ou Personnalisé) ▸ (choisir votre modèle)</pre>
<p>Le nouveau document est un <code>.docx</code> tout neuf, copie conforme du modèle. Modifier ce document ne touche PAS le modèle.</p>
<div class="warn">Double-cliquer sur un fichier .dotx dans l'Explorateur crée aussi un nouveau document basé dessus (c'est le comportement voulu). Pour MODIFIER le modèle lui-même, ouvrez-le depuis Word par Fichier ▸ Ouvrir, sinon vous n'éditez qu'une copie.</div>
<h3>4. Le modèle Normal.dotm</h3>
<p><strong>Normal.dotm</strong> est le modèle par défaut : chaque document vierge en découle. Y enregistrer un style, une police par défaut ou une macro affecte TOUS vos futurs documents. C'est puissant mais à manier avec prudence.</p>
<h3>5. Que mettre dans un modèle ?</h3>
<ul>
<li>Le <strong>thème</strong> et le <strong>jeu de styles</strong> (jour 3).</li>
<li>La <strong>mise en page</strong> : marges, format, en-têtes/pieds, numérotation.</li>
<li>Des <strong>textes fixes</strong> (mentions légales, formule de politesse).</li>
<li>Des <strong>zones à remplir</strong> : contrôles de contenu (jour 16) ou texte d'espace réservé.</li>
<li>Des <strong>blocs de construction</strong> (QuickParts) : en-têtes, pages de garde, formules réutilisables.</li>
</ul>
<h3>6. Blocs de construction et insertions automatiques</h3>
<pre class="pseudo">Ruban ▸ Insertion ▸ Texte ▸ QuickPart ▸ Enregistrer la sélection dans la galerie…</pre>
<p>Un <strong>bloc de construction</strong> est un morceau de contenu réutilisable (paragraphe type, tableau, en-tête) enregistré sous un nom, réinsérable en deux clics. L'<strong>insertion automatique</strong> (AutoText) en est un cas particulier.</p>
<h3>7. Attacher un modèle à un document existant</h3>
<pre class="pseudo">Fichier ▸ Options ▸ Compléments ▸ Gérer : Modèles ▸ Atteindre… ▸ Joindre
(onglet Développeur ▸ Modèle de document)</pre>
<p>On peut relier un document à un modèle pour lui importer ses styles. L'onglet <strong>Développeur</strong> (à activer via Fichier ▸ Options ▸ Personnaliser le ruban) donne accès à ces outils avancés.</p>`,
  exercises: [
    { type: "qcm", q: "Quelle extension désigne un modèle Word sans macros ?", opts: [".docx", ".dotx", ".dotm", ".txt"], a: 1, exp: ".dotx = modèle sans macros ; .dotm = modèle avec macros." },
    { type: "qcm", q: "Créer un document à partir d'un modèle produit…", opts: ["Une modification du modèle", "Une copie indépendante (.docx)", "Un fichier PDF", "Un e-mail"], a: 1, exp: "On obtient une copie ; l'original reste intact." },
    { type: "vf", q: "Un fichier .dotm est un modèle qui peut contenir des macros.", a: true, exp: "Le « m » final indique la présence possible de macros VBA." },
    { type: "qcm", q: "Comment enregistrer un document comme modèle ?", opts: ["Fichier ▸ Imprimer", "Fichier ▸ Enregistrer sous ▸ Type : Modèle Word (.dotx)", "Insertion ▸ Objet", "Révision ▸ Protéger"], a: 1, exp: "Le type « Modèle Word » crée un .dotx." },
    { type: "qcm", q: "Où retrouver ses modèles personnels pour créer un document ?", opts: ["Fichier ▸ Nouveau ▸ Personnel", "Accueil ▸ Styles", "Insertion ▸ Tableau", "Affichage ▸ Zoom"], a: 0, exp: "L'onglet Personnel/Personnalisé de Fichier ▸ Nouveau liste vos modèles." },
    { type: "qcm", q: "Qu'est-ce que Normal.dotm ?", opts: ["Un document ordinaire", "Le modèle par défaut de tout document vierge", "Une police", "Un thème"], a: 1, exp: "Chaque document vierge dérive de Normal.dotm." },
    { type: "vf", q: "Modifier Normal.dotm affecte tous les futurs documents vierges.", a: true, exp: "C'est le modèle par défaut : prudence avec ses réglages." },
    { type: "qcm", q: "Double-cliquer sur un .dotx dans l'Explorateur…", opts: ["Modifie le modèle", "Crée un nouveau document basé dessus", "Imprime le modèle", "Le supprime"], a: 1, exp: "C'est le comportement normal : on obtient une copie à remplir." },
    { type: "qcm", q: "Pour VRAIMENT modifier le modèle lui-même, il faut…", opts: ["Double-cliquer dessus", "L'ouvrir via Fichier ▸ Ouvrir dans Word", "L'imprimer", "Le renommer"], a: 1, exp: "Fichier ▸ Ouvrir édite le modèle ; le double-clic n'ouvre qu'une copie." },
    { type: "vf", q: "Un modèle peut contenir thème, styles, mise en page et textes fixes.", a: true, exp: "Tout cela est figé dans le modèle pour être réutilisé." },
    { type: "qcm", q: "Qu'est-ce qu'un bloc de construction (QuickPart) ?", opts: ["Une police", "Un contenu réutilisable enregistré sous un nom, réinsérable en 2 clics", "Un raccourci clavier", "Une marge"], a: 1, exp: "Un morceau de contenu type (paragraphe, tableau, en-tête) réutilisable." },
    { type: "qcm", q: "Où enregistrer une sélection comme QuickPart ?", opts: ["Insertion ▸ Texte ▸ QuickPart ▸ Enregistrer la sélection dans la galerie", "Accueil ▸ Coller", "Références ▸ Index", "Fichier ▸ Imprimer"], a: 0, exp: "La galerie QuickPart stocke les blocs de construction." },
    { type: "vf", q: "L'onglet Développeur, utile pour les modèles avancés, s'active dans les Options.", a: true, exp: "Fichier ▸ Options ▸ Personnaliser le ruban ▸ cocher Développeur." },
    { type: "qcm", q: "Un .docx est-il un modèle ?", opts: ["Oui, toujours", "Non, c'est un document ordinaire", "Seulement s'il a des macros", "Uniquement en PDF"], a: 1, exp: "Le modèle est un .dotx/.dotm ; le .docx est un document classique." },
    { type: "qcm", q: "Principal intérêt d'un modèle pour une équipe ?", opts: ["Réduire le nombre de styles", "Garantir des documents cohérents et gagner du temps sans reformater", "Verrouiller les documents en lecture seule", "Numéroter automatiquement les pages"], a: 1, exp: "Cohérence et rapidité : la structure est prête pour tous." }
  ],
  final: {
    title: "Exercice final — Le modèle de lettre du service",
    intro: `<p>Votre service veut un modèle de lettre : logo et coordonnées en en-tête, thème maison, marges à 2 cm, une formule de politesse fixe en bas, et une zone « Objet : » à compléter. Il doit apparaître dans Fichier ▸ Nouveau ▸ Personnel.</p>
<pre class="pseudo">Fichier ▸ Enregistrer sous ▸ Type : Modèle Word (*.dotx)</pre>`,
    questions: [
      { type: "qcm", q: "Quel type de fichier choisir à l'enregistrement ?", opts: ["Document Word (.docx)", "Modèle Word (.dotx)", "PDF", "Page Web"], a: 1, exp: "Le modèle se sauve en .dotx." },
      { type: "qcm", q: "Où enregistrer le modèle pour qu'il apparaisse dans Nouveau ▸ Personnel ?", opts: ["Dans le dossier des Modèles Office personnalisés", "Sur le Bureau", "Dans la Corbeille", "Dans Téléchargements"], a: 0, exp: "Word y pointe automatiquement pour le type Modèle." },
      { type: "qcm", q: "Où placer logo et coordonnées pour qu'ils apparaissent sur chaque page ?", opts: ["Dans le corps", "Dans l'en-tête", "Dans un commentaire", "Dans les propriétés"], a: 1, exp: "L'en-tête se répète sur toutes les pages." },
      { type: "vf", q: "Créer un document depuis ce modèle ne modifiera pas le modèle d'origine.", a: true, exp: "On obtient une copie .docx indépendante." },
      { type: "qcm", q: "Pour modifier plus tard le modèle lui-même (changer le logo)…", opts: ["Double-cliquer dessus", "L'ouvrir via Fichier ▸ Ouvrir dans Word", "L'imprimer", "Le convertir en PDF"], a: 1, exp: "Fichier ▸ Ouvrir édite le .dotx ; le double-clic n'ouvre qu'une copie." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Créer un document : appliquer thème maison, marges 2 cm, en-tête (logo + coordonnées)
2. Taper la formule de politesse fixe en bas
3. Ajouter une ligne « Objet : » (avec éventuellement un contrôle de contenu, jour 16)
4. Fichier ▸ Enregistrer sous ▸ Type : Modèle Word (*.dotx)
5. Laisser Word pointer vers Modèles Office personnalisés ▸ nommer « Lettre-Service » ▸ Enregistrer
6. Tester : Fichier ▸ Nouveau ▸ Personnel ▸ Lettre-Service ▸ un nouveau .docx s'ouvre
7. Pour éditer le modèle plus tard : Fichier ▸ Ouvrir ▸ sélectionner le .dotx</pre>
<p>Le service dispose d'une lettre normalisée, prête et protégée.</p>`
  }
};
