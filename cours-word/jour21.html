  num: 21,
  title: "Projet final : un rapport professionnel complet",
  subtitle: "Assembler tout le cours en un document abouti.",
  theory: `
<h3>1. Objectif du projet</h3>
<p>Ce dernier jour n'introduit pas de nouvelle commande : il <strong>combine</strong> tout ce que vous avez appris pour produire un rapport professionnel de A à Z. On enchaîne styles, thème, sections, sommaire, sources, tableaux, images, champs, révision, accessibilité et export.</p>
<h3>2. La checklist du rapport pro</h3>
<pre class="pseudo">STRUCTURE
  [ ] Page de garde (sans numéro)                    // sauts de section, jour 5-6
  [ ] Sommaire automatique après la garde            // TDM, jour 7
  [ ] Titres stylés Titre 1/2/3                       // styles, jour 2
  [ ] Numérotation : garde sans n°, corps à partir de 1  // jour 6
IDENTITÉ VISUELLE
  [ ] Thème + jeu de styles cohérents                 // jour 3
  [ ] En-tête (titre) + pied (Page X sur Y)           // jour 6
CONTENU
  [ ] Tableaux avec calculs/formules                  // jour 10
  [ ] Images légendées + habillage propre             // jours 9 et 11
  [ ] Sources et bibliographie                        // jour 8
  [ ] Table des illustrations si beaucoup de figures  // jour 9
FINITION
  [ ] Champs à jour (Ctrl + A puis F9)                // jour 15
  [ ] Révision / commentaires traités                 // jour 17
  [ ] Vérificateur d'accessibilité au vert           // jour 20
  [ ] Inspecter le document (nettoyer)                // jour 18
  [ ] Export PDF avec signets + balises               // jour 20</pre>
<h3>3. Ordre de travail recommandé</h3>
<p>Un bon enchaînement évite les reprises :</p>
<ol>
<li>Écrire le contenu brut, puis appliquer les <strong>styles de titre</strong> (le squelette d'abord).</li>
<li>Régler <strong>thème, mise en page et sections</strong> (garde / corps).</li>
<li>Insérer <strong>tableaux, images, légendes, sources</strong>.</li>
<li>Ajouter <strong>en-têtes/pieds</strong> et la <strong>numérotation</strong> par section.</li>
<li>Générer <strong>sommaire, table des illustrations, bibliographie</strong> (les champs) en dernier.</li>
<li><strong>Réviser</strong>, mettre à jour tous les champs, vérifier l'accessibilité, inspecter, exporter en PDF.</li>
</ol>
<div class="tip">Le sommaire, la table des illustrations et la bibliographie se génèrent EN DERNIER, une fois le contenu stabilisé : ce sont des champs, et un simple F9 les remet à jour si le contenu bouge encore.</div>
<h3>4. Le piège du « tout à la main »</h3>
<div class="warn">La faute qui trahit l'amateur : titres en gras manuel (pas de sommaire possible), pages « suivantes » obtenues par des Entrée répétés, numéros de figures tapés à la main (faux dès qu'on insère une image). Le fil rouge de ce cours : laisser Word automatiser via styles, champs et sections. Vous gagnez du temps ET de la fiabilité.</div>
<h3>5. Réutiliser : en faire un modèle</h3>
<p>Une fois votre rapport type au point, enregistrez-le comme <strong>modèle .dotx</strong> (jour 12) : la prochaine fois, vous partez d'une base déjà stylée, sectionnée et paginée. C'est ainsi qu'un service produit des documents homogènes sans effort.</p>
<h3>6. Contrôle qualité final</h3>
<pre class="pseudo">AVANT DE LIVRER
  1. Ctrl + A puis F9         // mettre à jour TOUS les champs (TDM, figures, biblio, pagination)
  2. Relire le sommaire        // numéros de page corrects ?
  3. Révision ▸ Vérifier l'accessibilité
  4. Fichier ▸ Informations ▸ Inspecter le document
  5. Fichier ▸ Exporter ▸ PDF (signets + balises)</pre>
<div class="tip">Bravo : à ce stade, vous maîtrisez la chaîne complète de production d'un document Word professionnel. Les exercices d'écriture ci-dessous vous font assembler ces briques sur un cas concret.</div>`,
  exercises: [
    { type: "qcm", q: "Quand générer le sommaire, la table des illustrations et la bibliographie ?", opts: ["En tout premier", "En dernier, une fois le contenu stabilisé", "Jamais", "Avant d'écrire le texte"], a: 1, exp: "Ce sont des champs : on les génère à la fin et on les met à jour (F9)." },
    { type: "qcm", q: "Pour un sommaire automatique, le prérequis absolu est…", opts: ["Un thème coloré", "Des styles de titre appliqués", "Un PDF", "Un mot de passe"], a: 1, exp: "Sans styles Titre 1/2/3, pas de table des matières." },
    { type: "vf", q: "Avant de livrer, on met à jour tous les champs avec Ctrl + A puis F9.", a: true, exp: "Cela recalcule TDM, pagination, figures et bibliographie." },

    { type: "qcm", q: "Pour une identité visuelle cohérente sur tout le rapport, on s'appuie sur…", opts: ["Le formatage manuel", "Le thème et le jeu de styles", "Des captures d'écran", "Le zoom"], a: 1, exp: "Thème + jeu de styles garantissent la cohérence globale." },
    { type: "vf", q: "Un tableau de synthèse peut calculer un total avec =SUM(ABOVE) puis F9.", a: true, exp: "Les formules de tableau sont des champs recalculés par F9." },
    { type: "qcm", q: "Après avoir tout mis à jour, que relire en priorité dans le sommaire ?", opts: ["La couleur", "L'exactitude des numéros de page", "La police", "Les marges"], a: 1, exp: "On vérifie que la pagination du sommaire est juste." },
    { type: "qcm", q: "Le fil rouge de ce cours est…", opts: ["Tout faire à la main", "Laisser Word automatiser via styles, champs et sections", "Éviter les tableaux", "Ne jamais exporter"], a: 1, exp: "Automatisation = gain de temps et fiabilité, thème central du cours." }
  ],

<pre class="pseudo">Styles ▸ Thème ▸ Sections ▸ Contenu ▸ En-têtes ▸ Champs générés ▸ Révision ▸ PDF</pre>`,
    questions: [

      { type: "qcm", q: "Pour isoler la page de garde de la numérotation du corps…", opts: ["Un saut de section", "Un saut de colonne", "Un commentaire", "Une image"], a: 0, exp: "Le saut de section permet une numérotation propre au corps." },
      { type: "qcm", q: "Pour numéroter automatiquement les trois figures…", opts: ["Les taper à la main", "Insérer une légende (étiquette Figure) sur chacune", "Changer la police", "Un tableau"], a: 1, exp: "Les légendes se renumérotent toutes seules." },
      { type: "vf", q: "Le sommaire et la bibliographie se génèrent après avoir stabilisé le contenu, puis se mettent à jour par F9.", a: true, exp: "Ce sont des champs à générer en dernier et à actualiser." },
      { type: "qcm", q: "Dernières étapes avant livraison ?", opts: ["Mettre à jour les champs, vérifier l'accessibilité, inspecter, exporter en PDF", "Changer la police et fermer", "Réduire le zoom", "Supprimer les styles"], a: 0, exp: "Contrôle qualité complet puis export PDF signets + balises." }
    ],
    solution: `<p>Marche à suivre complète :</p>
<pre class="pseudo">1. Appliquer Titre 1/2/3 (Ctrl+Alt+1/2/3) à tout le plan
2. Création ▸ Thèmes + jeu de styles cohérents
3. Sauts de section : garde | (sommaire) | corps ; numérotation corps « Commencer à 1 »
4. Insérer les tableaux ▸ formules =SUM/=PRODUCT ▸ styles de tableau
5. Insérer les figures ▸ Références ▸ Insérer une légende (Figure) ▸ habillage propre
6. Références ▸ Style APA ▸ Insérer les citations ▸ sources
7. En-tête (titre du rapport) + pied (Page X sur Y), Première page différente
8. Sommaire (Références ▸ Table des matières), Table des illustrations, Bibliographie
9. Ctrl + A puis F9 : mise à jour de TOUS les champs
10. Révision : accepter/refuser, traiter les commentaires ; Vérifier l'accessibilité
11. Fichier ▸ Informations ▸ Inspecter le document (nettoyage)
12. Fichier ▸ Exporter ▸ PDF ▸ Options : signets + balises ▸ Publier
13. (Optionnel) Enregistrer en modèle .dotx pour réutiliser</pre>
<p>Vous obtenez un rapport structuré, calculé, sourcé, accessible et diffusable : la synthèse de tout le parcours.</p>`
  }
};
</script>
