  title: "Le suivi des modifications et les commentaires",
  subtitle: "Réviser un document à plusieurs, proprement.",
  theory: `
<h3>1. Le suivi des modifications</h3>
<p>Le <strong>suivi des modifications</strong> (Track Changes) enregistre chaque ajout, suppression et changement de mise en forme, en montrant qui a fait quoi. Rien n'est réellement appliqué tant qu'on n'a pas <strong>accepté</strong> les changements : on peut tout revoir, accepter ou refuser.</p>
<pre class="pseudo">Ruban ▸ Révision ▸ Suivi ▸ Suivi des modifications
Ctrl + Maj + E          // activer/désactiver le suivi</pre>
<div class="warn">Piège classique : envoyer un document en croyant qu'il est « propre » alors que le suivi est encore actif et des modifications non acceptées subsistent. Avant d'envoyer une version finale : acceptez/refusez tout et vérifiez que le suivi est désactivé.</div>
<h3>2. Les modes d'affichage des marques</h3>
<pre class="pseudo">Révision ▸ Suivi ▸ (menu d'affichage) :
  • Marques simples      // un trait dans la marge signale les zones modifiées
  • Toutes les marques   // détail des insertions/suppressions et bulles
  • Aucune marque        // aperçu du document « final » (les marques existent toujours !)
  • Original             // le document avant modifications</pre>
<div class="tip">« Aucune marque » NE supprime PAS les modifications : il les masque seulement. Le document envoyé les contient encore. Pour vraiment les intégrer, il faut Accepter.</div>
<h3>3. Accepter / refuser</h3>
<pre class="pseudo">Révision ▸ Modifications ▸ Accepter / Refuser (avec menu déroulant) :
  • Accepter cette modification / et passer à la suivante
  • Accepter toutes les modifications
  • Accepter toutes et arrêter le suivi</pre>
<h3>4. Les commentaires</h3>
<p>Un <strong>commentaire</strong> est une note attachée à une sélection, sans modifier le texte : il sert à poser une question, suggérer, expliquer. Il apparaît dans la marge ou un volet.</p>
<pre class="pseudo">Ruban ▸ Révision ▸ Commentaires ▸ Nouveau commentaire
Ctrl + Alt + M          // insérer un commentaire</pre>
<p>On peut <strong>répondre</strong> à un commentaire (fil de discussion) et le marquer <strong>Résolu</strong> une fois traité. Le volet Commentaires liste tout.</p>
<div class="tip">Dans Word 365, les commentaires sont « modernes » : fils de discussion, résolution, mentions @personne en co-édition. Dans Office 2019/2021, les commentaires existent mais sans certaines fonctions collaboratives récentes (mentions, résolution enrichie).</div>
<h3>5. Naviguer dans les révisions</h3>
<pre class="pseudo">Révision ▸ Modifications ▸ Précédent / Suivant     // parcourir les changements
Révision ▸ Commentaires ▸ Précédent / Suivant      // parcourir les commentaires</pre>
<h3>6. Qui a modifié quoi ? Le volet Révisions</h3>
<p>Le <strong>volet Vérifications/Révisions</strong> (Révision ▸ Suivi ▸ Volet Vérifications) liste chaque modification avec son auteur et l'heure. Le nom d'auteur vient de Fichier ▸ Options ▸ Général ▸ « Nom d'utilisateur ».</p>
<h3>7. Verrouiller le suivi</h3>
<p>Pour empêcher un relecteur de désactiver le suivi (utile en contexte juridique) :</p>
<pre class="pseudo">Révision ▸ Suivi ▸ Verrouiller le suivi     // demande un mot de passe</pre>`,

    { type: "qcm", q: "Quel raccourci active/désactive le suivi ?", opts: ["Ctrl + Maj + E", "Ctrl + E", "Alt + E", "Ctrl + S"], a: 0, exp: "Ctrl + Maj + E bascule le suivi des modifications." },

    { type: "qcm", q: "Qu'est-ce qu'un commentaire ?", opts: ["Une modification du texte", "Une note attachée à une sélection, sans modifier le texte", "Un style", "Une marge"], a: 1, exp: "Le commentaire annote sans changer le contenu." },
    { type: "qcm", q: "Quel raccourci insère un commentaire ?", opts: ["Ctrl + Alt + M", "Ctrl + M", "Alt + M", "Ctrl + Maj + M"], a: 0, exp: "Ctrl + Alt + M crée un nouveau commentaire." },
    { type: "vf", q: "On peut répondre à un commentaire et le marquer Résolu.", a: true, exp: "Les commentaires forment des fils de discussion résolubles." },
    { type: "qcm", q: "Avant d'envoyer une version finale, que vérifier ?", opts: ["La couleur du fond", "Que tout est accepté/refusé et le suivi désactivé", "Le zoom", "La langue"], a: 1, exp: "Sinon des modifications suivies restent visibles chez le destinataire." },
    { type: "qcm", q: "Où voit-on qui a modifié quoi, avec l'heure ?", opts: ["Le volet Vérifications/Révisions", "Le pied de page", "L'en-tête", "La table des matières"], a: 0, exp: "Le volet Révisions détaille chaque changement et son auteur." },
    { type: "vf", q: "Le nom d'auteur des révisions provient du « Nom d'utilisateur » dans les Options.", a: true, exp: "Fichier ▸ Options ▸ Général ▸ Nom d'utilisateur fixe l'auteur." },
    { type: "qcm", q: "« Accepter toutes les modifications » a pour effet…", opts: ["De les refuser", "D'appliquer d'un coup tous les changements suivis", "De les imprimer", "De changer la police"], a: 1, exp: "Toutes les modifications sont intégrées en une action." },
    { type: "qcm", q: "Comment empêcher un relecteur de couper le suivi ?", opts: ["Révision ▸ Suivi ▸ Verrouiller le suivi (mot de passe)", "Changer la police", "Insérer un tableau", "Réduire le zoom"], a: 0, exp: "Le verrouillage du suivi protège la traçabilité." },
    { type: "qcm", q: "Le mode « Original » affiche…", opts: ["Le document final", "Le document avant les modifications", "Les commentaires seuls", "Les marges"], a: 1, exp: "« Original » montre l'état antérieur aux changements." },
    { type: "vf", q: "Les mentions @personne dans les commentaires sont surtout une fonctionnalité de Word 365 en co-édition.", a: true, exp: "2019/2021 gèrent les commentaires mais sans toutes ces fonctions collaboratives." },
    { type: "qcm", q: "Pour parcourir les changements un par un, on utilise…", opts: ["Révision ▸ Modifications ▸ Suivant/Précédent", "Accueil ▸ Gras", "Fichier ▸ Imprimer", "Affichage ▸ Zoom"], a: 0, exp: "Suivant/Précédent navigue entre les révisions." }
  ],
  final: {

<pre class="pseudo">Ruban ▸ Révision ▸ Suivi / Commentaires / Modifications</pre>`,

      { type: "qcm", q: "Avant de corriger, qu'activer pour tracer vos changements ?", opts: ["Le suivi des modifications (Ctrl + Maj + E)", "Le zoom", "Un tableau", "Un en-tête"], a: 0, exp: "Le suivi enregistre chaque correction pour l'auteur." },
      { type: "qcm", q: "Pour poser une question sans modifier le texte…", opts: ["Un commentaire (Ctrl + Alt + M)", "Une image", "Un saut de page", "Un style"], a: 0, exp: "Le commentaire annote sans toucher au contenu." },
      { type: "qcm", q: "Vous voulez montrer le rendu final tout en gardant vos marques. Quel mode d'affichage ?", opts: ["Aucune marque (masque, ne supprime pas)", "Original", "Toutes les marques", "Impression"], a: 0, exp: "« Aucune marque » masque l'affichage sans effacer les changements." },
      { type: "vf", q: "L'auteur pourra accepter ou refuser chacune de vos modifications.", a: true, exp: "C'est tout l'intérêt du suivi : il décide au cas par cas." },
      { type: "qcm", q: "Pour garantir que vos corrections restent traçables (contexte juridique)…", opts: ["Verrouiller le suivi avec un mot de passe", "Changer la police", "Supprimer les commentaires", "Réduire les marges"], a: 0, exp: "Le verrouillage empêche de désactiver le suivi." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Vérifier son nom : Fichier ▸ Options ▸ Général ▸ Nom d'utilisateur
2. Révision ▸ Suivi des modifications (Ctrl + Maj + E) : ON
3. Corriger le texte : ajouts/suppressions apparaissent en marques
4. Sélectionner un passage ▸ Ctrl + Alt + M ▸ taper la question (x2)
5. (Optionnel) Suivi ▸ Verrouiller le suivi ▸ mot de passe
6. Affichage « Toutes les marques » pour montrer clairement les changements
7. Enregistrer et renvoyer
8. Côté auteur : Révision ▸ Accepter/Refuser au cas par cas, répondre aux commentaires, puis désactiver le suivi</pre>
<p>Le contrat revient avec des corrections traçables et des questions ciblées.</p>`
  }
};
