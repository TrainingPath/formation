  title: "Les styles de texte : la clé d'un document pro",
  subtitle: "Mettre en forme par le sens plutôt qu'à la main.",
  theory: `
<h3>1. Qu'est-ce qu'un style ?</h3>
<p>Un <strong>style</strong> est un ensemble de mises en forme (police, taille, couleur, espacement, alignement…) enregistré sous un nom. Au lieu de régler ces réglages un par un sur chaque paragraphe, on applique un style d'un clic. Modifier le style modifie <strong>d'un coup</strong> tout le texte qui l'utilise.</p>
<p>C'est LA différence entre un amateur (qui met « Arial 16 gras » à la main sur chaque titre) et un professionnel (qui applique le style « Titre 1 »). Le second peut changer l'apparence de tous ses titres en 3 secondes.</p>
<h3>2. Les deux grandes familles de styles</h3>
<ul>
<li><strong>Styles de paragraphe</strong> : s'appliquent au paragraphe entier (Titre 1, Normal, Citation…). Marqués d'un pied-de-mouche ¶.</li>
<li><strong>Styles de caractère</strong> : s'appliquent au texte sélectionné à l'intérieur d'un paragraphe (Emphase, Référence intense…). Marqués d'un « a ».</li>
</ul>
<p>La <strong>galerie des styles</strong> est le ruban de vignettes visible dans :</p>
<pre class="pseudo">Ruban ▸ Accueil ▸ Styles          // galerie des styles rapides</pre>
<h3>3. Appliquer un style</h3>
<p>Placez le curseur dans le paragraphe (pas besoin de tout sélectionner pour un style de paragraphe) puis cliquez sur la vignette. Raccourcis utiles :</p>
<pre class="pseudo">Ctrl + Alt + 1     // applique le style Titre 1
Ctrl + Alt + 2     // applique le style Titre 2
Ctrl + Alt + 3     // applique le style Titre 3
Ctrl + Maj + N     // applique le style Normal</pre>
<h3>4. Pourquoi c'est capital : les fonctions dépendent des styles</h3>
<div class="tip">La table des matières automatique, le volet de navigation, le mode plan et les renvois se construisent tous à partir des styles Titre 1, 2, 3… Sans styles de titre, pas de sommaire automatique. C'est la vraie raison d'utiliser les styles.</div>
<h3>5. Modifier un style existant</h3>
<p>Clic droit sur la vignette du style ▸ « Modifier… ». On y règle police, couleur, espacement, etc. Tout le texte portant ce style se met à jour automatiquement.</p>
<pre class="pseudo">Clic droit sur le style ▸ Modifier…     // boîte « Modifier le style »</pre>
<p>On peut aussi « Mettre à jour Titre 1 pour correspondre à la sélection » : on formate un titre à la main comme on le veut, puis clic droit sur le style ▸ « Mettre à jour … pour correspondre à la sélection ».</p>
<h3>6. Le volet Styles</h3>
<p>Le petit lanceur (la flèche en bas à droite du groupe Styles), ou le raccourci <code>Ctrl + Alt + Maj + S</code>, ouvre le <strong>volet Styles</strong> : liste complète, options d'affichage, et bouton « Gérer les styles ».</p>
<div class="warn">Piège fréquent : appliquer du gras à la main sur un titre au lieu d'utiliser un style. Ça marche à l'écran mais casse la table des matières et l'homogénéité. Prenez le réflexe « je choisis un style », pas « je formate à la main ».</div>`,
  exercises: [

    { type: "qcm", q: "Quel raccourci applique le style Normal ?", opts: ["Ctrl + Maj + N", "Ctrl + N", "Alt + N", "Ctrl + 0"], a: 0, exp: "Ctrl + Maj + N remet le paragraphe en style Normal." },
    { type: "vf", q: "On peut ouvrir le volet Styles avec Ctrl + Alt + Maj + S.", a: true, exp: "Ce raccourci affiche/masque le volet Styles complet." },
    { type: "qcm", q: "Où se trouve la galerie des styles rapides ?", opts: ["Ruban ▸ Insertion ▸ Symboles", "Ruban ▸ Accueil ▸ Styles", "Ruban ▸ Révision", "Fichier ▸ Options"], a: 1, exp: "La galerie de vignettes est dans l'onglet Accueil, groupe Styles." },
    { type: "qcm", q: "Un style de caractère « Emphase » appliqué à trois mots dans une phrase affecte…", opts: ["Tout le paragraphe", "Uniquement ces trois mots sélectionnés", "Toute la page", "Rien"], a: 1, exp: "Un style de caractère ne touche que le texte sélectionné." },
    { type: "vf", q: "Le style Normal est le style de base sur lequel reposent souvent les autres styles.", a: true, exp: "Beaucoup de styles héritent de Normal ; le modifier peut se propager." },
    { type: "qcm", q: "Pourquoi un pro préfère-t-il les styles au formatage manuel ?", opts: ["Pour réduire le nombre de pages", "Pour l'homogénéité, la maintenance rapide et les fonctions automatiques (sommaire, navigation)", "Pour empêcher toute modification", "Pour changer la langue du document"], a: 1, exp: "Cohérence, mise à jour globale et fonctions automatiques : c'est tout l'intérêt." }
  ],

<pre class="pseudo">Ruban ▸ Accueil ▸ Styles          // pour appliquer Titre 1, Titre 2…</pre>`,
    questions: [

      { type: "qcm", q: "Quel raccourci appliquer sur une sous-partie de deuxième niveau ?", opts: ["Ctrl + Alt + 2", "Ctrl + 2", "Alt + 2", "Ctrl + Maj + 2"], a: 0, exp: "Ctrl + Alt + 2 applique Titre 2." },
      { type: "qcm", q: "Le style Titre 1 est trop gros à votre goût. Que faire pour tous les réduire ?", opts: ["Les reformater un par un", "Clic droit sur Titre 1 ▸ Modifier ▸ réduire la taille", "Changer la police système", "Supprimer les titres"], a: 1, exp: "On modifie le style une fois, tous les Titre 1 suivent." },
      { type: "vf", q: "Après avoir appliqué les styles de titre, le volet de navigation (Ctrl + F ▸ onglet Titres) affichera le plan du document.", a: true, exp: "Les styles de titre alimentent le volet de navigation." },
      { type: "qcm", q: "Un mot important dans un paragraphe doit ressortir sans casser le paragraphe. Quel type de style ?", opts: ["Un style de paragraphe", "Un style de caractère (ex. Emphase intense)", "Un style de tableau", "Un style de liste"], a: 1, exp: "Un style de caractère ne touche que la sélection, pas tout le paragraphe." }
    ],
    solution: `<p>Marche à suivre :</p>
<pre class="pseudo">1. Placer le curseur sur le titre principal ▸ Ctrl + Alt + 1 (Titre 1) ou appliquer « Titre »
2. Sur chaque grande partie ▸ Ctrl + Alt + 1
3. Sur chaque sous-partie ▸ Ctrl + Alt + 2
4. Vérifier le plan : Ctrl + F ▸ onglet Titres (volet de navigation)
5. Clic droit sur le style Titre 1 ▸ Modifier ▸ ajuster taille/couleur ▸ OK
6. Pour un mot clé : le sélectionner ▸ appliquer un style de caractère (Emphase)</pre>
<p>En quelques minutes le document est structuré, navigable et prêt pour un sommaire automatique.</p>`
  }
