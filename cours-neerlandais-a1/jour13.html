<script>
var DAY = {
  num: 13,
  title: "Poser des questions",
  subtitle: "Les questions fermées (oui/non) et les mots interrogatifs.",
  theory: `
<h3>1. Deux types de questions</h3>
<p>Il existe deux grandes familles de questions : les <strong>questions fermées</strong> (réponse oui/non) et les <strong>questions ouvertes</strong> (avec un mot interrogatif).</p>
<h3>2. Les questions fermées : l'inversion</h3>
<p>Pour une question à laquelle on répond par <em>ja</em> (oui) ou <em>nee</em> (non), on place le <strong>verbe en premier</strong>, puis le sujet :</p>
<pre class="pseudo">Jij woont in Gent.  -> Woon je in Gent?   (Habites-tu a Gand ?)
Hij werkt hier.     -> Werkt hij hier?    (Travaille-t-il ici ?)
Zij hebben tijd.    -> Hebben zij tijd?   (Ont-ils du temps ?)</pre>
<div class="warn">Rappel : avec je/jij inversés, le -t du verbe tombe : Woon je? (et non Woont je?). Mais avec hij/zij/het, le -t reste : Werkt hij?</div>
<h3>3. Les mots interrogatifs (de vraagwoorden)</h3>
<p>Pour une question ouverte, on commence par un <strong>mot interrogatif</strong>, suivi du verbe, puis du sujet :</p>
<pre class="pseudo">wie    -> qui        Wie ben jij?         (Qui es-tu ?)
wat    -> quoi/que   Wat doe je?          (Que fais-tu ?)
waar   -> ou         Waar woon je?        (Ou habites-tu ?)
wanneer-> quand      Wanneer kom je?      (Quand viens-tu ?)
hoe    -> comment    Hoe heet je?         (Comment t'appelles-tu ?)
waarom -> pourquoi   Waarom leer je Nederlands? (Pourquoi apprends-tu le neerlandais ?)</pre>
<h3>4. Hoeveel et welke</h3>
<pre class="pseudo">hoeveel -> combien   Hoeveel kost het?    (Combien ca coute ?)
welke   -> quel/quelle Welke kleur?       (Quelle couleur ?)</pre>
<div class="tip">Structure d'une question ouverte : <strong>mot interrogatif + verbe + sujet + reste</strong>. Waar (1) woon (2) je (3)? Le verbe reste toujours en deuxieme position.</div>
<h3>5. Répondre à une question</h3>
<pre class="pseudo">Woon je in Gent?   -> Ja, ik woon in Gent. / Nee, ik woon in Brussel.
Waar woon je?      -> Ik woon in Antwerpen.</pre>`,
  exercises: [
    { type: "qcm", q: "Comment forme-t-on une question fermée (oui/non) ?", opts: ["On garde l'ordre normal", "On met le verbe en premier (inversion)", "On ajoute -t au sujet", "On met le mot interrogatif à la fin"], a: 1, exp: "Question fermee : verbe en premier -> Woon je in Gent?" },
    { type: "qcm", q: "Que signifie « waar » ?", opts: ["quand", "où", "qui", "comment"], a: 1, exp: "waar = ou : Waar woon je? (Ou habites-tu ?)" },
    { type: "qcm", q: "Que signifie « hoe » ?", opts: ["pourquoi", "combien", "comment", "quel"], a: 2, exp: "hoe = comment : Hoe heet je? (Comment t'appelles-tu ?)" },
    { type: "qcm", q: "Comment transformer « Jij werkt hier » en question fermée ?", opts: ["Jij werkt hier?", "Werk jij hier?", "Werkt jij hier?", "Hier werkt jij?"], a: 1, exp: "Inversion + le -t tombe avec jij : Werk jij hier?" },
    { type: "qcm", q: "Quel mot interrogatif pour « pourquoi » ?", opts: ["wanneer", "waarom", "welke", "hoeveel"], a: 1, exp: "waarom = pourquoi." },
    { type: "qcm", q: "Dans « Waar woon je? », le verbe est en quelle position ?", opts: ["Première", "Deuxième", "Dernière", "Il n'y a pas de verbe"], a: 1, exp: "Le verbe reste en deuxieme position : Waar (1) woon (2) je." },
    { type: "vf", q: "Avec hij, le -t reste dans une question : « Werkt hij? ».", a: true, exp: "Seul je/jij fait tomber le -t ; hij garde le -t." },
    { type: "vf", q: "« wanneer » signifie « combien ».", a: false, exp: "Faux : wanneer = quand ; combien = hoeveel." },
    { type: "vf", q: "Dans une question ouverte, on commence par le mot interrogatif.", a: true, exp: "mot interrogatif + verbe + sujet : Waar woon je?" },
    { type: "input", q: "Vul in : ___ woon je? (Où habites-tu ?)", a: ["waar"], ph: "un mot interrogatif", exp: "waar = ou." },
    { type: "input", q: "Vul in : ___ heet je? (Comment t'appelles-tu ?)", a: ["hoe"], ph: "un mot interrogatif", exp: "hoe = comment." },
    { type: "input", q: "Vul in : ___ doe je? (Que fais-tu ?)", a: ["wat"], ph: "un mot interrogatif", exp: "wat = quoi/que." },
    { type: "input", q: "Vul in : ___ ben jij? (Qui es-tu ?)", a: ["wie"], ph: "un mot interrogatif", exp: "wie = qui." },
    { type: "input", q: "Vul in : ___ je in Gent? (question fermée avec wonen)", a: ["woon"], ph: "un verbe", exp: "Woon je? : inversion, le -t tombe." },
    { type: "input", q: "Vul in : ___ kost het? (Combien ça coûte ?)", a: ["hoeveel"], ph: "un mot interrogatif", exp: "hoeveel = combien." }
  ],
  final: {
    title: "Exercice final — Poser des questions",
    intro: `<p>Lisez ce petit dialogue, puis répondez.</p>
<pre class="pseudo">- Hoe heet je?        - Ik heet Sara.
- Waar woon je?       - Ik woon in Antwerpen.
- Werk je in Gent?    - Ja, ik werk in Gent.</pre>
<p><em>Traduction : Comment t'appelles-tu ? — Je m'appelle Sara. Où habites-tu ? — J'habite à Anvers. Travailles-tu à Gand ? — Oui, je travaille à Gand.</em></p>`,
    questions: [
      { type: "input", q: "Vul in : ___ woon je? (Où habites-tu ?)", a: ["waar"], ph: "un mot interrogatif", exp: "waar = ou." },
      { type: "qcm", q: "Comment poser « Travailles-tu ici ? » (werken) ?", opts: ["Jij werkt hier?", "Werk je hier?", "Werkt je hier?", "Hier je werkt?"], a: 1, exp: "Inversion + le -t tombe : Werk je hier?" },
      { type: "input", q: "Vul in : ___ heet je? (Comment t'appelles-tu ?)", a: ["hoe"], ph: "un mot interrogatif", exp: "hoe = comment." },
      { type: "vf", q: "Dans « Waar woon je? », waar est un mot interrogatif qui signifie « où ».", a: true, exp: "waar = ou." },
      { type: "qcm", q: "Que signifie « wanneer » ?", opts: ["où", "quand", "pourquoi", "combien"], a: 1, exp: "wanneer = quand." }
    ],
    solution: `<p>Deux structures à retenir :</p>
<pre class="pseudo">Question fermee (oui/non) : VERBE + sujet
   Woon je in Gent?   Werkt hij hier?
Question ouverte : MOT INTERROGATIF + verbe + sujet
   Waar woon je?      Hoe heet je?</pre>
<p>Les mots interrogatifs clés : <strong>wie</strong> (qui), <strong>wat</strong> (quoi), <strong>waar</strong> (où), <strong>wanneer</strong> (quand), <strong>hoe</strong> (comment), <strong>waarom</strong> (pourquoi), <strong>hoeveel</strong> (combien).</p>`
  }
};
</script>
