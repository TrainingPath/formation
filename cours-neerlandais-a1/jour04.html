<script>
var DAY = {
  num: 4,
  title: "Le verbe zijn (être) au présent",
  subtitle: "Le verbe le plus important : conjuguer « être » à toutes les personnes.",
  theory: `
<h3>1. Un verbe irrégulier essentiel</h3>
<p>Le verbe <strong>zijn</strong> signifie « être ». C'est le verbe le plus fréquent de la langue, et il est <strong>irrégulier</strong> : ses formes ne se devinent pas, il faut les apprendre par cœur. Le mot <strong>zijn</strong> tout seul est l'<em>infinitif</em> (la forme non conjuguée, comme « être » en français).</p>
<h3>2. La conjugaison au présent</h3>
<pre class="pseudo">ik        ben        -> je suis
jij / je  bent       -> tu es
u         bent (of is) -> vous êtes (poli)
hij       is         -> il est
zij / ze  is         -> elle est
het       is         -> il/elle est (neutre)
wij / we  zijn       -> nous sommes
jullie    zijn       -> vous êtes (groupe)
zij / ze  zijn       -> ils / elles sont</pre>
<p>Trois formes seulement à retenir : <strong>ben</strong> (avec ik), <strong>bent</strong> (avec jij/u), <strong>is</strong> (avec hij/zij/het), et <strong>zijn</strong> au pluriel.</p>
<div class="tip">Petit truc de mémoire : au singulier, tout commence par « b » sauf la 3e personne (is). Au pluriel, tout est <strong>zijn</strong> — identique à l'infinitif.</div>
<h3>3. Des phrases utiles avec zijn</h3>
<pre class="pseudo">Ik ben moe.            -> Je suis fatigué(e).
Jij bent aardig.       -> Tu es gentil(le).
Hij is Belg.           -> Il est belge.
Wij zijn studenten.    -> Nous sommes étudiants.
Zij zijn thuis.        -> Ils sont à la maison.</pre>
<h3>4. L'inversion : quand jij devient je</h3>
<p>Quand le sujet <strong>jij</strong> passe APRÈS le verbe (dans une question), le verbe <strong>perd son -t</strong> :</p>
<pre class="pseudo">Jij bent moe.      -> Tu es fatigué.      (sujet avant : bent)
Ben je moe?        -> Es-tu fatigué ?     (sujet après : ben, sans -t !)</pre>
<div class="warn">Piège important : à la question, <em>Ben jij...?</em> ou <em>Ben je...?</em> — le verbe redevient <strong>ben</strong> (sans t) quand jij/je suit le verbe. On y reviendra au jour 13 (les questions).</div>
<h3>5. Nationalités et professions (sans article !)</h3>
<p>Après <strong>zijn</strong>, on donne souvent une nationalité ou une profession. En néerlandais, on <strong>n'emploie pas d'article</strong> devant :</p>
<pre class="pseudo">Ik ben student.        -> Je suis étudiant.   (pas « een student »)
Zij is lerares.        -> Elle est enseignante.
Wij zijn Nederlanders. -> Nous sommes néerlandais.</pre>
<p>Ce petit détail (pas d'article) est différent du français, qui dit lui aussi « je suis étudiant » sans article — bonne nouvelle, c'est pareil !</p>`,
  exercises: [
    { type: "qcm", q: "Quel est l'infinitif du verbe « être » en néerlandais ?", opts: ["hebben", "zijn", "heten", "wezen"], a: 1, exp: "zijn = être (infinitif)." },
    { type: "qcm", q: "Comment dit-on « je suis » ?", opts: ["ik bent", "ik is", "ik ben", "ik zijn"], a: 2, exp: "ik ben = je suis." },
    { type: "qcm", q: "Comment dit-on « il est » ?", opts: ["hij ben", "hij bent", "hij is", "hij zijn"], a: 2, exp: "hij is = il est." },
    { type: "qcm", q: "Comment dit-on « nous sommes » ?", opts: ["wij ben", "wij zijn", "wij is", "wij bent"], a: 1, exp: "wij zijn = nous sommes (identique à l'infinitif)." },
    { type: "qcm", q: "Dans <code>Ben je moe?</code>, pourquoi « ben » et non « bent » ?", opts: ["C'est une faute", "Parce que je suit le verbe (inversion), le -t disparaît", "Parce que je = pluriel", "Par hasard"], a: 1, exp: "Quand jij/je passe après le verbe, celui-ci perd son -t." },
    { type: "qcm", q: "Comment traduit-on « Je suis étudiant » ?", opts: ["Ik ben een student", "Ik ben student", "Ik is student", "Ik student ben"], a: 1, exp: "Pas d'article devant une profession : Ik ben student." },
    { type: "vf", q: "Au pluriel, zijn a toujours la forme <code>zijn</code>.", a: true, exp: "wij/jullie/zij zijn : identique à l'infinitif." },
    { type: "vf", q: "<code>Jij is aardig</code> est correct.", a: false, exp: "Faux : avec jij, on dit « jij bent aardig »." },
    { type: "vf", q: "Le verbe zijn est irrégulier.", a: true, exp: "Ses formes (ben, bent, is, zijn) ne suivent aucune règle simple : à apprendre par cœur." },
    { type: "input", q: "Vul in : Ik ___ (zijn) moe.", a: ["ben"], ph: "un verbe", exp: "Ik ben moe = je suis fatigué(e)." },
    { type: "input", q: "Vul in : Jij ___ (zijn) aardig.", a: ["bent"], ph: "un verbe", exp: "Jij bent = tu es." },
    { type: "input", q: "Vul in : Hij ___ (zijn) Belg.", a: ["is"], ph: "un verbe", exp: "Hij is = il est." },
    { type: "input", q: "Vul in : Wij ___ (zijn) studenten.", a: ["zijn"], ph: "un verbe", exp: "Wij zijn = nous sommes." },
    { type: "input", q: "Vul in : Zij ___ (zijn) thuis. (ils sont à la maison)", a: ["zijn"], ph: "un verbe", exp: "zij zijn = ils sont (pluriel)." },
    { type: "input", q: "Vul in : ___ je moe? (question : es-tu fatigué ?)", a: ["ben"], ph: "un verbe", exp: "Ben je moe ? — inversion, le -t disparaît." }
  ],
  final: {
    title: "Exercice final — Conjuguer zijn",
    intro: `<p>Complétez chaque phrase avec la bonne forme du verbe <strong>zijn</strong>. Rappel des formes : ben · bent · is · zijn.</p>
<pre class="pseudo">ik ben · jij bent · hij/zij/het is · wij/jullie/zij zijn</pre>`,
    questions: [
      { type: "input", q: "Vul in : Ik ___ Sara. (je suis Sara)", a: ["ben"], ph: "un verbe", exp: "Ik ben Sara." },
      { type: "input", q: "Vul in : Zij ___ lerares. (elle est enseignante, singulier)", a: ["is"], ph: "un verbe", exp: "Zij is lerares = elle est enseignante." },
      { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Wij is thuis", "Wij ben thuis", "Wij zijn thuis", "Wij bent thuis"], a: 2, exp: "wij zijn = nous sommes." },
      { type: "input", q: "Vul in : Jullie ___ aardig. (vous êtes gentils, groupe)", a: ["zijn"], ph: "un verbe", exp: "jullie zijn = vous êtes (pluriel)." },
      { type: "qcm", q: "Comment poser « Es-tu belge ? »", opts: ["Bent je Belg?", "Ben je Belg?", "Is je Belg?", "Zijn je Belg?"], a: 1, exp: "Inversion : Ben je Belg ? (le -t tombe quand je suit le verbe)." }
    ],
    solution: `<p>Le tableau complet à connaître par cœur :</p>
<pre class="pseudo">ik ben          wij zijn
jij bent        jullie zijn
hij/zij/het is  zij zijn</pre>
<p>Retenez : au singulier <strong>ben / bent / is</strong>, au pluriel toujours <strong>zijn</strong>. Et n'oubliez pas la règle d'inversion : <em>Ben je...?</em> perd le -t.</p>`
  }
};
</script>
