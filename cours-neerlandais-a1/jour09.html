  title: "Les adjectifs possessifs",
  subtitle: "Mon, ton, son, notre... : dire à qui appartient une chose.",
  theory: `
<h3>1. Qu'est-ce qu'un adjectif possessif ?</h3>
<p>Un <strong>adjectif possessif</strong> indique le propriétaire : « <strong>mon</strong> livre », « <strong>ta</strong> maison ». Chaque pronom personnel (jour 3) a son possessif correspondant. Voici la liste :</p>
<pre class="pseudo">Pronom     Possessif    Français
ik         mijn         mon / ma / mes
jij / je   jouw / je    ton / ta / tes
u          uw           votre (poli)
hij        zijn         son / sa / ses (à lui)
zij        haar         son / sa / ses (à elle)
wij        ons / onze   notre / nos
jullie     jullie       votre / vos (groupe)
zij        hun          leur / leurs</pre>
<h3>2. Une bonne nouvelle : presque tout est invariable</h3>
<p>Contrairement au français (mon / ma / mes), la plupart des possessifs néerlandais ont <strong>une seule forme</strong>, quel que soit le nombre ou le genre du nom :</p>
<pre class="pseudo">mijn boek     -> mon livre
mijn tafel    -> ma table
mijn boeken   -> mes livres     (toujours « mijn » !)
haar huis     -> sa maison (à elle)
zijn auto     -> sa voiture (à lui)</pre>
<div class="tip">Ne confondez pas <strong>zijn</strong> possessif (son, à lui) et <strong>zijn</strong> verbe (être / infinitif). Le contexte lève l'ambiguïté : <em>zijn boek</em> = son livre ; <em>wij zijn</em> = nous sommes.</div>
<h3>3. Le seul cas variable : ons / onze</h3>
<p>Le possessif « notre » a <strong>deux formes</strong> selon l'article du nom :</p>
<pre class="pseudo">ons  + het-woord   -> ons huis   (notre maison, car het huis)
onze + de-woord    -> onze auto  (notre voiture, car de auto)
onze + pluriel     -> onze boeken (nos livres, pluriel = de)</pre>
<div class="warn">Retenez : <strong>ons</strong> uniquement devant un het-woord au singulier ; <strong>onze</strong> partout ailleurs (de-woorden et tous les pluriels). C'est le seul possessif qui change de forme.</div>
<h3>4. Formes fortes et faibles</h3>
<p>Comme les pronoms, <strong>jouw</strong> (ton) a une forme faible <strong>je</strong> :</p>
<pre class="pseudo">jouw boek   =  je boek     -> ton livre
(jouw insiste : « TON livre à toi »)</pre>
<div class="warn">Le petit mot <strong>je</strong> a donc deux emplois : pronom sujet (« tu ») ET possessif (« ton/ta »). <em>Je bent</em> = tu es ; <em>je boek</em> = ton livre. Le contexte tranche.</div>
<h3>5. Exemples récapitulatifs</h3>
<pre class="pseudo">Mijn moeder is lerares.    -> Ma mère est enseignante.
Is dat jouw fiets?         -> Est-ce ton vélo ?
Haar broer is aardig.      -> Son frère (à elle) est gentil.
Ons huis is groot.         -> Notre maison est grande.
Hun kinderen zijn thuis.   -> Leurs enfants sont à la maison.</pre>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « mon / ma / mes » ?", opts: ["jouw", "mijn", "zijn", "haar"], a: 1, exp: "mijn = mon/ma/mes (invariable)." },
    { type: "qcm", q: "Comment dit-on « son / sa » (à ELLE) ?", opts: ["zijn", "haar", "hun", "uw"], a: 1, exp: "haar = son/sa/ses quand le possesseur est une femme." },
    { type: "qcm", q: "Comment dit-on « son / sa » (à LUI) ?", opts: ["haar", "hun", "zijn", "je"], a: 2, exp: "zijn = son/sa/ses quand le possesseur est un homme." },
    { type: "qcm", q: "Comment dit-on « leur / leurs » ?", opts: ["uw", "hun", "ons", "haar"], a: 1, exp: "hun = leur/leurs." },
    { type: "qcm", q: "Quelle forme de « notre » devant <code>huis</code> (het-woord) ?", opts: ["onze huis", "ons huis", "ons huis", "haar huis"], a: 1, exp: "ons + het-woord : ons huis." },
    { type: "qcm", q: "Quelle forme de « notre » devant <code>auto</code> (de-woord) ?", opts: ["ons auto", "onze auto", "onsze auto", "hun auto"], a: 1, exp: "onze + de-woord : onze auto." },
    { type: "vf", q: "<code>mijn</code> reste identique au singulier et au pluriel.", a: true, exp: "mijn boek / mijn boeken : la forme ne change pas." },
    { type: "vf", q: "<code>ons</code> s'emploie devant un de-woord.", a: false, exp: "Faux : ons devant un het-woord ; onze devant un de-woord et au pluriel." },
    { type: "vf", q: "Le mot <code>je</code> peut être un possessif (« ton / ta »).", a: true, exp: "je boek = ton livre (forme faible de jouw)." },
    { type: "input", q: "Vul in : « mon livre » : ___ boek.", a: ["mijn"], ph: "un possessif", exp: "mijn boek." },
    { type: "input", q: "Vul in : « ta maison » (forme forte) : ___ huis.", a: ["jouw"], ph: "un possessif", exp: "jouw huis (ou je huis)." },
    { type: "input", q: "Vul in : « sa voiture à elle » : ___ auto.", a: ["haar"], ph: "un possessif", exp: "haar auto." },
    { type: "input", q: "Vul in : « son frère à lui » : ___ broer.", a: ["zijn"], ph: "un possessif", exp: "zijn broer." },
    { type: "input", q: "Vul in : « notre maison » (het huis) : ___ huis.", a: ["ons"], ph: "un possessif", exp: "ons huis (het-woord)." },
    { type: "input", q: "Vul in : « leurs enfants » : ___ kinderen.", a: ["hun"], ph: "un possessif", exp: "hun kinderen." }
  ],
  final: {
    title: "Exercice final — À qui est-ce ?",
    intro: `<p>Lisez ce petit texte et repérez les possessifs.</p>
<pre class="pseudo">Dit is mijn familie. Mijn moeder heet Anna.
Haar auto is rood. Ons huis is groot.</pre>
<p><em>Traduction : Voici ma famille. Ma mère s'appelle Anna. Sa voiture (à elle) est rouge. Notre maison est grande.</em></p>`,
    questions: [
      { type: "qcm", q: "Que signifie <code>mijn moeder</code> ?", opts: ["ta mère", "ma mère", "sa mère", "leur mère"], a: 1, exp: "mijn = ma ; moeder = mère." },
      { type: "input", q: "Vul in : « sa voiture à elle est rouge » : ___ auto is rood.", a: ["haar"], ph: "un possessif", exp: "haar auto (possesseur féminin)." },
      { type: "qcm", q: "Pourquoi dit-on <code>ons huis</code> et non <code>onze huis</code> ?", opts: ["Par hasard", "Parce que huis est un het-woord", "Parce que huis est un pluriel", "C'est une faute"], a: 1, exp: "ons devant un het-woord : het huis -> ons huis." },
      { type: "vf", q: "Si Anna avait une voiture appartenant à un homme, on dirait <code>zijn auto</code>.", a: true, exp: "zijn = son (possesseur masculin)." },
      { type: "input", q: "Vul in : « notre voiture » (de auto) : ___ auto.", a: ["onze"], ph: "un possessif", exp: "onze auto (de-woord)." }
    ],
    solution: `<p>Le point crucial du jour, ons vs onze :</p>
<pre class="pseudo">ons  + het-woord (sing.) -> ons huis
onze + de-woord          -> onze auto
onze + pluriel           -> onze kinderen</pre>
<p>Les autres possessifs (mijn, jouw, zijn, haar, hun, uw) sont <strong>invariables</strong> : une seule forme à retenir. Seul « notre » se dédouble en ons / onze.</p>`
  }
};
