  theory: `
<h3>1. Demander son chemin</h3>
<pre class="pseudo">Waar is het station?           Où est la gare ?
Hoe kom ik bij de markt?       Comment vais-je au marché ?
Is het ver?                    Est-ce loin ?
Waar is de wc, alstublieft?    Où sont les toilettes, s'il vous plaît ?</pre>
<h3>2. Les directions</h3>
<pre class="pseudo">links        à gauche        rechts       à droite
rechtdoor    tout droit      terug        en arrière
de hoek      le coin         de straat    la rue
het plein    la place        het kruispunt  le carrefour
naast        à côté de       tegenover    en face de</pre>
<h3>3. Indiquer le chemin (impératif, jour 23)</h3>
<pre class="pseudo">Ga rechtdoor.               Va tout droit.
Ga links / Ga rechts.       Va à gauche / à droite.
Sla linksaf.                Tourne à gauche.
Neem de eerste straat rechts.  Prends la première rue à droite.
Het is naast de kerk.       C'est à côté de l'église.</pre>
<div class="tip">« linksaf slaan » = tourner à gauche, « rechtsaf slaan » = tourner à droite. À l'impératif : <code>Sla linksaf!</code> (la particule af reste avec sla ici en un mot d'ordre courant).</div>

<pre class="pseudo">het station    la gare       de kerk       l'église

de bakker      la boulangerie de apotheek  la pharmacie
de bank        la banque     het park      le parc</pre>

    solution: `<p>Pour aller à la gare : tout droit jusqu'à la place (rechtdoor tot het plein), puis à gauche (sla linksaf) ; la gare est à côté de l'église (naast de kerk), à cinq minutes.</p>
<pre class="pseudo">links à gauche · rechts à droite · rechtdoor tout droit
Ga ... / Sla ...af (impératif) pour indiquer
naast à côté de · tegenover en face de</pre>`
