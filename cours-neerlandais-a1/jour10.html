<script>
var DAY = {
  num: 10,
  title: "L'ordre des mots : le verbe en 2e position",
  subtitle: "La règle V2 : le verbe conjugué occupe toujours la deuxième place.",
  theory: `
<h3>1. La règle d'or : le verbe en position 2</h3>
<p>Dans une phrase déclarative néerlandaise (une phrase normale, qui affirme quelque chose), le <strong>verbe conjugué</strong> occupe TOUJOURS la <strong>deuxième position</strong>. On appelle cela la règle <strong>V2</strong> (V pour verbe, 2 pour deuxième place). C'est l'une des règles les plus importantes de tout le néerlandais.</p>
<pre class="pseudo">Position 1        Position 2 (verbe)   Reste
Ik                woon                in Gent.       -> J'habite à Gand.
Anna              is                  aardig.        -> Anna est gentille.
Wij               hebben              een auto.      -> Nous avons une voiture.</pre>
<div class="tip">« Position » ne veut pas dire « deuxième mot », mais « deuxième <strong>élément</strong> ». Un élément peut être un groupe de plusieurs mots (par exemple « mijn kleine broer » compte comme UN élément).</div>
<h3>2. Quand la phrase commence autrement : l'inversion</h3>
<p>Si la phrase commence par autre chose que le sujet (un complément de temps, de lieu...), le verbe RESTE en position 2, et le <strong>sujet passe juste après le verbe</strong>. C'est l'<strong>inversion</strong> :</p>
<pre class="pseudo">Vandaag    ben    ik    thuis.        -> Aujourd'hui je suis à la maison.
   (1)     (2)  (sujet)
In Gent    woont  hij.               -> À Gand, il habite.
Morgen     werk   ik.                -> Demain, je travaille.</pre>
<div class="warn">Comparez : <em>Ik ben vandaag thuis</em> (sujet en 1) et <em>Vandaag ben ik thuis</em> (complément en 1, sujet APRÈS le verbe). Dans les deux cas, le verbe <strong>ben</strong> reste en position 2. C'est non négociable.</div>
<h3>3. Pourquoi c'est un piège pour un francophone</h3>
<p>En français, on dit « Aujourd'hui je suis... » sans bouger le verbe. En néerlandais, dès qu'un élément passe devant, le sujet et le verbe s'inversent. L'erreur classique est de dire « Vandaag ik ben thuis » (faux !) au lieu de « Vandaag ben ik thuis ».</p>
<pre class="pseudo">FAUX : Vandaag ik ben thuis.
JUSTE : Vandaag ben ik thuis.        (verbe en 2, sujet après)</pre>
<h3>4. Rappel : l'inversion touche aussi le -t</h3>
<p>Vu aux jours 4 et 5 : quand <strong>je / jij</strong> passe après le verbe, le verbe perd son -t :</p>
<pre class="pseudo">Jij woont in Gent.      -> Tu habites à Gand.
Woon je in Gent?        -> Habites-tu à Gand ?   (woon, sans -t)
Waar woon je?           -> Où habites-tu ?</pre>
<h3>5. Résumé visuel</h3>
<pre class="pseudo">[élément 1] [VERBE] [sujet si inversion] [reste de la phrase]

Ik        woon              in Gent.
Vandaag   woon    ik        in Gent.
In Gent   woon    ik.</pre>
<p>Répétez-vous la règle comme un mantra : <strong>le verbe conjugué est toujours le deuxième élément</strong>.</p>`,
  exercises: [
    { type: "qcm", q: "Dans une phrase déclarative néerlandaise, le verbe conjugué est…", opts: ["en première position", "en deuxième position", "en dernière position", "n'importe où"], a: 1, exp: "Règle V2 : le verbe est toujours le 2e élément." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Vandaag ik ben thuis", "Vandaag ben ik thuis", "Ik vandaag ben thuis", "Ben vandaag ik thuis"], a: 1, exp: "Complément en 1, verbe en 2, sujet après : Vandaag ben ik thuis." },
    { type: "qcm", q: "Dans <code>Morgen werk ik</code>, où est le sujet <code>ik</code> ?", opts: ["Avant le verbe", "Juste après le verbe (inversion)", "À la fin, mais sans raison", "Il n'y en a pas"], a: 1, exp: "Quand un complément ouvre la phrase, le sujet passe après le verbe." },
    { type: "qcm", q: "Quel est l'ordre correct pour « Nous habitons à Gand » ?", opts: ["Wij in Gent wonen", "Wonen wij in Gent", "Wij wonen in Gent", "In Gent wij wonen"], a: 2, exp: "Sujet (Wij) en 1, verbe (wonen) en 2." },
    { type: "qcm", q: "Pourquoi « Vandaag ik ben thuis » est-il faux ?", opts: ["thuis est mal placé", "Le verbe ben doit être en 2e position, pas en 3e", "vandaag ne peut pas commencer une phrase", "Il manque un mot"], a: 1, exp: "Ici le verbe est en 3e position : il faut inverser -> Vandaag ben ik thuis." },
    { type: "qcm", q: "Un « élément » en position 1 peut être…", opts: ["un seul mot uniquement", "un groupe de plusieurs mots comptant pour un", "toujours le verbe", "toujours un complément"], a: 1, exp: "« mijn kleine broer » compte comme UN élément, par exemple." },
    { type: "vf", q: "En néerlandais, le verbe conjugué occupe toujours la 2e position dans une phrase déclarative.", a: true, exp: "C'est la règle V2, fondamentale." },
    { type: "vf", q: "Quand un complément ouvre la phrase, le sujet passe avant le verbe.", a: false, exp: "Faux : le sujet passe APRÈS le verbe (inversion), pour garder le verbe en 2e position." },
    { type: "vf", q: "<code>Waar woon je?</code> respecte l'inversion (le -t tombe).", a: true, exp: "je après le verbe : woon (sans -t)." },
    { type: "input", q: "Vul in : remets le verbe à la bonne place — « Aujourd'hui je travaille » : Vandaag ___ ik.", a: ["werk"], ph: "un verbe", exp: "Vandaag werk ik : verbe en 2, sujet après." },
    { type: "input", q: "Vul in : « À Gand, il habite » : In Gent ___ hij.", a: ["woont"], ph: "un verbe", exp: "In Gent woont hij : verbe en 2e position." },
    { type: "input", q: "Vul in : « Demain je suis à la maison » : Morgen ___ ik thuis.", a: ["ben"], ph: "un verbe", exp: "Morgen ben ik thuis." },
    { type: "input", q: "Vul in : « Nous avons une voiture » (ordre normal) : Wij ___ een auto.", a: ["hebben"], ph: "un verbe", exp: "Wij hebben een auto." },
    { type: "input", q: "Vul in : « Où habites-tu ? » : Waar ___ je?", a: ["woon"], ph: "un verbe", exp: "Waar woon je ? (inversion, -t tombe)." },
    { type: "input", q: "Vul in : « Anna est gentille » : Anna ___ aardig.", a: ["is"], ph: "un verbe", exp: "Anna is aardig." }
  ],
  final: {
    title: "Exercice final — Remettre les mots en ordre",
    intro: `<p>Lisez ce petit texte : observez comment le verbe reste toujours en 2e position, même quand la phrase commence par un complément.</p>
<pre class="pseudo">Ik woon in Amsterdam. Vandaag ben ik thuis.
Morgen werk ik. Wij hebben een grote hond.</pre>
<p><em>Traduction : J'habite à Amsterdam. Aujourd'hui je suis à la maison. Demain je travaille. Nous avons un grand chien.</em></p>`,
    questions: [
      { type: "qcm", q: "Dans <code>Vandaag ben ik thuis</code>, quel est le 2e élément ?", opts: ["ik", "ben", "thuis", "vandaag"], a: 1, exp: "Le verbe ben occupe la 2e position." },
      { type: "input", q: "Vul in : « Demain je travaille » : Morgen ___ ik.", a: ["werk"], ph: "un verbe", exp: "Morgen werk ik : inversion sujet-verbe." },
      { type: "qcm", q: "Quelle phrase respecte la règle V2 ?", opts: ["Morgen ik werk", "Morgen werk ik", "Ik morgen werk", "Werk morgen ik"], a: 1, exp: "Complément en 1, verbe en 2, sujet après." },
      { type: "vf", q: "Dans <code>Ik woon in Amsterdam</code>, le verbe woon est bien en 2e position.", a: true, exp: "Sujet (Ik) en 1, verbe (woon) en 2 : correct." },
      { type: "input", q: "Vul in : mets en ordre « à Amsterdam / habite / il » : In Amsterdam ___ hij.", a: ["woont"], ph: "un verbe", exp: "In Amsterdam woont hij." }
    ],
    solution: `<p>Le principe illustré sur une même phrase :</p>
<pre class="pseudo">Ik      woon   in Amsterdam.       (sujet en 1)
Vandaag ben    ik    thuis.        (complément en 1, sujet après le verbe)
Morgen  werk   ik.                 (idem)</pre>
<p>Une seule règle à ne jamais oublier : <strong>le verbe conjugué est le deuxième élément</strong>. Si vous commencez par un complément, inversez sujet et verbe. C'est le socle de toute phrase néerlandaise correcte.</p>`
  }
};
</script>
