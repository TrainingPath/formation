  title: "Les articles : de et het",
  subtitle: "« le / la » se dit de ou het : deux genres à apprivoiser.",
  theory: `
<h3>1. Deux articles définis : de et het</h3>
<p>Un <strong>article défini</strong> est le petit mot « le / la / les » qui précède un nom connu. En français il y a « le », « la », « les » ; en néerlandais, il n'y en a que deux au singulier : <strong>de</strong> et <strong>het</strong>. Tous les noms se répartissent en deux catégories :</p>
<pre class="pseudo">de-woord   -> article « de »   : de man (l'homme), de vrouw (la femme)
het-woord  -> article « het »  : het huis (la maison), het kind (l'enfant)</pre>
<p>On dit qu'un nom est un « <strong>de-woord</strong> » (mot en de) ou un « <strong>het-woord</strong> » (mot en het). Il faut apprendre l'article <strong>avec</strong> chaque mot, comme le genre en français.</p>
<h3>2. Quel article pour quel mot ?</h3>
<p>Environ deux tiers des noms prennent <strong>de</strong>, un tiers prennent <strong>het</strong>. Quelques repères utiles (avec des exceptions) :</p>
<pre class="pseudo">Prennent « de » :
- les personnes (généralement) : de man, de vrouw, de leraar
- les pluriels (TOUJOURS)       : de huizen, de kinderen

Prennent « het » :
- les diminutifs en -je         : het meisje (la fille), het boekje (le petit livre)
- beaucoup de mots « abstraits » : het weer (le temps qu'il fait)</pre>
<div class="warn">Règle en or : <strong>au pluriel, l'article est TOUJOURS « de »</strong>, quel que soit le genre du mot. het huis (la maison) -> de huizen (les maisons).</div>
<h3>3. L'article indéfini : een</h3>
<p>Pour dire « un / une », un seul mot pour tous les noms : <strong>een</strong>. Aucune distinction de genre !</p>
<pre class="pseudo">een man    -> un homme
een huis   -> une maison
een kind   -> un enfant</pre>
<div class="tip">Le mot <strong>een</strong> (un/une) se prononce « eune », de façon relâchée. Attention à ne pas le confondre avec <strong>één</strong> (avec accents), qui veut dire « un » le nombre (1).</div>
<h3>4. Pourquoi l'article compte tant</h3>
<p>Le choix de-woord ou het-woord influence d'autres règles que vous verrez plus tard, notamment l'<strong>accord de l'adjectif</strong> (jour 14) et les <strong>pronoms</strong>. Prendre l'habitude d'apprendre chaque mot avec son article vous évitera bien des erreurs.</p>
<pre class="pseudo">de tafel    -> la table
het raam    -> la fenêtre
de stoel    -> la chaise
het bord    -> l'assiette
de deur     -> la porte</pre>
<h3>5. Résumé</h3>
<pre class="pseudo">Défini    singulier : de OU het (selon le mot)
Défini    pluriel   : de (toujours)
Indéfini  singulier : een (toujours)</pre>
<p>Le plus sûr : mémoriser <em>de/het</em> collé à chaque nouveau mot de vocabulaire.</p>`,
  exercises: [
    { type: "qcm", q: "Combien d'articles définis (« le/la ») le néerlandais a-t-il au singulier ?", opts: ["Un seul", "Deux : de et het", "Trois", "Quatre"], a: 1, exp: "de et het : deux articles définis." },
    { type: "qcm", q: "Quel est l'article de <code>huis</code> (maison) ?", opts: ["de", "het", "een seulement", "aucun"], a: 1, exp: "het huis : c'est un het-woord." },
    { type: "qcm", q: "Quel est l'article de <code>man</code> (homme) ?", opts: ["het", "de", "een seulement", "aucun"], a: 1, exp: "de man : c'est un de-woord." },
    { type: "qcm", q: "Au PLURIEL, l'article défini est…", opts: ["toujours het", "toujours de", "een", "variable"], a: 1, exp: "Au pluriel, c'est toujours de : de huizen, de mannen." },
    { type: "qcm", q: "Comment dit-on « un / une » (indéfini) ?", opts: ["de", "het", "een", "un/une n'existe pas"], a: 2, exp: "een pour tous les noms, sans distinction de genre." },
    { type: "qcm", q: "Les diminutifs en <code>-je</code> (comme meisje) prennent…", opts: ["de", "het", "een obligatoirement", "les deux"], a: 1, exp: "Tous les diminutifs en -je sont des het-woorden : het meisje." },
    { type: "vf", q: "<code>het huis</code> devient <code>de huizen</code> au pluriel.", a: true, exp: "Le pluriel prend toujours de, même pour un het-woord." },
    { type: "vf", q: "Il faut apprendre chaque nom avec son article de ou het.", a: true, exp: "Comme le genre en français : à mémoriser mot par mot." },
    { type: "vf", q: "<code>een</code> change selon que le mot est de-woord ou het-woord.", a: false, exp: "Non : een est invariable pour tous les noms." },
    { type: "input", q: "Vul in : ___ man (l'homme, article défini).", a: ["de"], ph: "de ou het", exp: "de man." },
    { type: "input", q: "Vul in : ___ huis (la maison, article défini).", a: ["het"], ph: "de ou het", exp: "het huis." },
    { type: "input", q: "Vul in : ___ meisje (la fille, diminutif en -je).", a: ["het"], ph: "de ou het", exp: "het meisje : diminutif -> het." },
    { type: "input", q: "Vul in : ___ huizen (les maisons, pluriel).", a: ["de"], ph: "de ou het", exp: "Au pluriel : de huizen." },
    { type: "input", q: "Vul in : article indéfini devant kind : ___ kind (un enfant).", a: ["een"], ph: "un mot", exp: "een kind = un enfant." },
    { type: "input", q: "Vul in : ___ vrouw (la femme, article défini).", a: ["de"], ph: "de ou het", exp: "de vrouw." }
  ],
  final: {
    title: "Exercice final — de ou het ?",
    intro: `<p>Pour chaque mot, choisissez l'article correct. Rappelez-vous : les personnes prennent souvent <strong>de</strong>, les diminutifs en -je prennent <strong>het</strong>, et le pluriel prend toujours <strong>de</strong>.</p>
<pre class="pseudo">man · huis · meisje · kinderen · vrouw</pre>`,
    questions: [
      { type: "input", q: "Vul in : ___ vrouw (la femme).", a: ["de"], ph: "de ou het", exp: "de vrouw : personne -> de." },
      { type: "input", q: "Vul in : ___ meisje (la fille).", a: ["het"], ph: "de ou het", exp: "het meisje : diminutif en -je -> het." },
      { type: "qcm", q: "Quel article pour <code>kinderen</code> (les enfants, pluriel) ?", opts: ["het", "de", "een", "aucun"], a: 1, exp: "Pluriel -> toujours de : de kinderen." },
      { type: "vf", q: "On peut dire <code>een huis</code> (une maison) même si huis est un het-woord.", a: true, exp: "een est invariable : een huis est correct." },
      { type: "input", q: "Vul in : ___ man (l'homme).", a: ["de"], ph: "de ou het", exp: "de man." }
    ],
    solution: `<p>Les bonnes réponses :</p>
<pre class="pseudo">de man        (personne -> de)
het huis      (het-woord)
het meisje    (diminutif -je -> het)
de kinderen   (pluriel -> de)
de vrouw      (personne -> de)</pre>
<p>Deux réflexes à graver : <strong>pluriel = de</strong> (sans exception) et <strong>diminutif en -je = het</strong>. Pour le reste, mémorisez l'article avec chaque mot.</p>`
  }
};
