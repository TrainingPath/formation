  theory: `
<h3>1. Le vocabulaire de la famille — de familie</h3>
<p>Voici les mots essentiels. Chaque nom garde son article (de ou het) :</p>
<pre class="pseudo">de vader     le père        de moeder    la mère
de ouders    les parents    de zoon      le fils
de dochter   la fille       de broer     le frère
de zus       la soeur       de opa       le grand-père
de oma       la grand-mère  het kind     l'enfant
de man       le mari/l'homme de vrouw    la femme/l'épouse</pre>
<div class="tip">Deux mots pratiques : <code>de ouders</code> (les parents) et <code>de kinderen</code> (les enfants, pluriel irrégulier de het kind).</div>
<h3>2. Dire « mon », « ma », « mes »</h3>
<p>On réutilise les adjectifs possessifs (jour 9). Ils ne changent pas selon de/het :</p>
<pre class="pseudo">mijn vader    mon père        mijn moeder   ma mère
mijn broer    mon frère       mijn zus      ma soeur
jouw zoon     ton fils        zijn dochter  sa fille (à lui)
haar oma      sa grand-mère (à elle)        ons kind      notre enfant</pre>
<h3>3. Présenter sa famille</h3>
<p>Pour dire « J'ai un frère et deux soeurs », on utilise le verbe <strong>hebben</strong> (avoir, jour 5) :</p>
<pre class="pseudo">Ik heb een broer en twee zussen.   J'ai un frère et deux soeurs.
Dit is mijn vader.                 Voici mon père. (litt. « ceci est »)
Hoe heet je moeder?                Comment s'appelle ta mère ?
Mijn moeder heet Sofie.            Ma mère s'appelle Sofie.</pre>
<div class="warn">Le pluriel : de zus donne <strong>de zussen</strong>, de broer donne <strong>de broers</strong>. On ajoute -en ou -s selon le mot (jour 7).</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie « de moeder » ?", opts: ["la mère", "le père", "la soeur", "la fille"], a: 0, exp: "de moeder = la mère ; de vader = le père." },
    { type: "input", q: "« le père » se dit ___ en néerlandais.", a: ["de vader", "vader"], ph: "un membre", exp: "de vader = le père." },

    { type: "vf", q: "Le mot « de broer » signifie « le frère ».", a: true, exp: "Exact : de broer = le frère ; de zus = la soeur." },

    { type: "qcm", q: "Comment dit-on « les parents » ?", opts: ["de ouders", "de kinderen", "de broers", "de familie"], a: 0, exp: "de ouders = les parents." },
    { type: "input", q: "Complète : « J'ai une soeur » = Ik heb een ___.", a: ["zus"], ph: "un membre", exp: "Ik heb een zus = J'ai une soeur." },
    { type: "qcm", q: "Que signifie « het kind » ?", opts: ["l'enfant", "le fils", "la fille", "le petit-fils"], a: 0, exp: "het kind = l'enfant ; pluriel de kinderen." },
    { type: "vf", q: "« de dochter » veut dire « le fils ».", a: false, exp: "Non : de dochter = la fille. Le fils se dit de zoon." },
    { type: "input", q: "« mon frère » se dit ___ en néerlandais.", a: ["mijn broer"], ph: "possessif + membre", exp: "mijn broer = mon frère." },
    { type: "qcm", q: "Comment traduire « Dit is mijn vader » ?", opts: ["Voici mon père", "C'est ma mère", "Où est mon père ?", "J'aime mon père"], a: 0, exp: "Dit is = ceci est / voici." },
    { type: "input", q: "« le grand-père » se dit ___ en néerlandais.", a: ["de opa", "opa"], ph: "un membre", exp: "de opa = le grand-père." },
    { type: "qcm", q: "Quel est le pluriel de « de zus » (la soeur) ?", opts: ["de zussen", "de zusen", "de zussens", "de zus"], a: 0, exp: "de zus donne de zussen (on double le s)." },
    { type: "vf", q: "« haar oma » signifie « sa grand-mère (à elle) ».", a: true, exp: "haar = son/sa (à elle) ; oma = grand-mère." },
    { type: "input", q: "« la mère » se dit ___ en néerlandais.", a: ["de moeder", "moeder"], ph: "un membre", exp: "de moeder = la mère." }
  ],
  final: {
    title: "Exercice final — La famille de Tom",
    intro: `<p>Lis la présentation de Tom, puis réponds.</p>
<pre class="pseudo">Hallo, ik ben Tom.                 Bonjour, je suis Tom.
Ik heb een broer en een zus.       J'ai un frère et une soeur.
Mijn vader heet Jan.               Mon père s'appelle Jan.
Mijn moeder heet Els.              Ma mère s'appelle Els.
Mijn oma woont in Gent.            Ma grand-mère habite à Gand.</pre>`,
    questions: [
      { type: "qcm", q: "Combien de soeurs a Tom ?", opts: ["une", "deux", "aucune", "trois"], a: 0, exp: "« een broer en een zus » : un frère et une soeur." },

      { type: "vf", q: "La grand-mère de Tom habite à Gand (Gent).", a: true, exp: "« Mijn oma woont in Gent » : oui." },

    ],

<pre class="pseudo">mijn vader   mon père
mijn moeder  ma mère
mijn broer   mon frère
mijn zus     ma soeur</pre>`
  }
