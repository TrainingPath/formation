<script>
var DAY = {
  num: 16,
  title: "Les jours, les mois, les dates",
  subtitle: "Dire quel jour on est, nommer les mois et donner une date en néerlandais.",
  theory: `
<h3>1. Les jours de la semaine — de dagen van de week</h3>
<p>Voici les sept jours de la semaine. Attention : en néerlandais, on n'écrit <strong>jamais de majuscule</strong> aux jours ni aux mois (contrairement à l'anglais).</p>
<pre class="pseudo">maandag     lundi
dinsdag     mardi
woensdag    mercredi
donderdag   jeudi
vrijdag     vendredi
zaterdag    samedi
zondag      dimanche</pre>
<p>Pour dire « le lundi » (au sens de « chaque lundi »), on utilise <strong>op</strong> : <code>op maandag</code>. Pour demander le jour : <code>Welke dag is het vandaag?</code> (Quel jour sommes-nous ?) — on répond <code>Het is maandag.</code> (Nous sommes lundi.)</p>
<h3>2. Les mois — de maanden</h3>
<pre class="pseudo">januari   februari   maart      april
mei       juni       juli       augustus
september oktober    november   december</pre>
<p>Pour dire « en mai », on emploie <strong>in</strong> : <code>in mei</code> (en mai), <code>in december</code> (en décembre).</p>
<h3>3. La date — de datum</h3>
<p>On demande : <code>Welke datum is het vandaag?</code> (Quelle date sommes-nous ?). On répond avec le nombre suivi du mois : <code>Vandaag is het 18 juli.</code> (Aujourd'hui, nous sommes le 18 juillet.) Le « 1er » se dit <code>de eerste</code> : ainsi <code>1 mei</code> se lit <code>de eerste mei</code>.</p>
<div class="tip">L'ordre des mots : le verbe reste en 2e position. Dans « Vandaag is het maandag », on a vandaag (place 1), is (place 2, le verbe), puis het maandag.</div>
<div class="warn">Ne mets jamais de majuscule aux jours ni aux mois : on écrit « maandag » et « juli », jamais « Maandag » ni « Juli ».</div>
<h3>4. Les saisons — de seizoenen</h3>
<pre class="pseudo">de lente    le printemps
de zomer    l'été
de herfst   l'automne
de winter   l'hiver</pre>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « lundi » en néerlandais ?", opts: ["maandag", "dinsdag", "woensdag", "zondag"], a: 0, exp: "maandag = lundi. dinsdag = mardi." },
    { type: "input", q: "« mercredi » se dit ___ en néerlandais.", a: ["woensdag"], ph: "un jour", exp: "woensdag = mercredi." },
    { type: "qcm", q: "Que signifie le mois « mei » ?", opts: ["mai", "mars", "juin", "mercredi"], a: 0, exp: "mei = mai. mars se dit maart, juin se dit juni." },
    { type: "vf", q: "En néerlandais, on écrit « juli » sans majuscule.", a: true, exp: "Exact : jours et mois s'écrivent en minuscule." },
    { type: "input", q: "« juillet » se dit ___ en néerlandais.", a: ["juli"], ph: "un mois", exp: "juli = juillet, en minuscule." },
    { type: "qcm", q: "Comment dit-on « en mai » ?", opts: ["in mei", "op mei", "aan mei", "mei op"], a: 0, exp: "Pour un mois, on utilise in : in mei." },
    { type: "input", q: "« vendredi » se dit ___ en néerlandais.", a: ["vrijdag"], ph: "un jour", exp: "vrijdag = vendredi." },
    { type: "qcm", q: "Que veut dire « de winter » ?", opts: ["l'hiver", "l'été", "l'automne", "le printemps"], a: 0, exp: "de winter = l'hiver ; de zomer = l'été." },
    { type: "vf", q: "L'expression « op maandag » veut dire « le lundi ».", a: true, exp: "op + jour exprime la répétition : op maandag = le lundi." },
    { type: "input", q: "« septembre » se dit ___ en néerlandais.", a: ["september"], ph: "un mois", exp: "september = septembre." },
    { type: "qcm", q: "Que signifie la question « Welke dag is het vandaag? »", opts: ["Quel jour sommes-nous ?", "Quelle heure est-il ?", "Quel âge as-tu ?", "Où es-tu ?"], a: 0, exp: "Welke dag = quel jour ; vandaag = aujourd'hui." },
    { type: "input", q: "« samedi » se dit ___ en néerlandais.", a: ["zaterdag"], ph: "un jour", exp: "zaterdag = samedi." },
    { type: "qcm", q: "Que veut dire « de lente » ?", opts: ["le printemps", "l'été", "l'hiver", "l'automne"], a: 0, exp: "de lente = le printemps." },
    { type: "vf", q: "Le mot « zondag » signifie « samedi ».", a: false, exp: "Non : zondag = dimanche. Samedi se dit zaterdag." },
    { type: "input", q: "« dimanche » se dit ___ en néerlandais.", a: ["zondag"], ph: "un jour", exp: "zondag = dimanche." }
  ],
  final: {
    title: "Exercice final — L'agenda d'Anna",
    intro: `<p>Lis ce petit texte, puis réponds aux questions.</p>
<pre class="pseudo">Anna schrijft in haar agenda.        Anna écrit dans son agenda.
Vandaag is het vrijdag 18 juli.      Aujourd'hui, nous sommes vendredi 18 juillet.
Morgen is het zaterdag.              Demain, c'est samedi.
Anna is jarig in mei.                Anna a son anniversaire en mai.
In de zomer gaat ze naar zee.        En été, elle va à la mer.</pre>`,
    questions: [

      { type: "input", q: "Que signifie le mot « morgen » (en français) ?", a: ["demain"], ph: "en français", exp: "morgen = demain." },
      { type: "qcm", q: "En quel mois Anna a-t-elle son anniversaire ?", opts: ["mei", "juli", "december", "maart"], a: 0, exp: "« Anna is jarig in mei » : en mai." },
      { type: "vf", q: "D'après le texte, Anna va à la mer en hiver.", a: false, exp: "Non : « in de zomer », en été, pas en hiver." },
      { type: "input", q: "Comment dit-on « l'été » en néerlandais ? ___", a: ["de zomer", "zomer"], ph: "une saison", exp: "de zomer = l'été." }
    ],
    solution: `<p>Résumé du texte : nous sommes vendredi 18 juillet (vrijdag 18 juli), demain c'est samedi (morgen is het zaterdag). Anna fête son anniversaire en mai (in mei) et va à la mer en été (in de zomer).</p>
<pre class="pseudo">vandaag   aujourd'hui
morgen    demain
in mei    en mai
de zomer  l'été</pre>`
  }
