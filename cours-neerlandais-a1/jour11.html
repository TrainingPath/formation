<script>
var DAY = {
  num: 11,
  title: "Le présent des verbes réguliers",
  subtitle: "La règle stam / stam+t / stam+en : conjuguer presque tous les verbes.",
  theory: `
<h3>1. Le radical (de stam)</h3>
<p>Pour conjuguer un verbe régulier, on part de son <strong>radical</strong> (en néerlandais : <strong>de stam</strong>). On l'obtient en enlevant la terminaison <strong>-en</strong> de l'infinitif :</p>
<pre class="pseudo">Infinitif    - en    = radical (stam)
wonen        won             won      (habiter)
werken       werk            werk     (travailler)
spelen       spel            speel    (jouer)</pre>
<div class="warn">Attention à l'orthographe : le radical doit garder le bon SON. Pour <em>spelen</em>, on enlève -en (spel) mais on redouble la voyelle -> <strong>speel</strong>, car la voyelle est longue. De même <em>maken</em> -> <strong>maak</strong>.</div>
<h3>2. La règle : stam / stam+t / stam+en</h3>
<pre class="pseudo">ik         stam            -> ik werk       (je travaille)
jij / je   stam + t        -> jij werkt     (tu travailles)
u          stam + t        -> u werkt       (vous travaillez)
hij/zij/het stam + t       -> hij werkt     (il travaille)
wij / we   stam + en (infinitif) -> wij werken  (nous travaillons)
jullie     stam + en       -> jullie werken (vous travaillez)
zij / ze   stam + en       -> zij werken    (ils travaillent)</pre>
<p>À retenir : le SINGULIER (ik / jij / hij) prend le radical (avec +t sauf ik) ; le PLURIEL prend l'infinitif complet.</p>
<h3>3. L'inversion : le -t tombe avec je</h3>
<p>Comme pour zijn et hebben : quand <strong>je / jij</strong> passe après le verbe, le <strong>-t disparaît</strong> :</p>
<pre class="pseudo">Jij werkt.        -> Tu travailles.       (jij avant : werkt)
Werk je?          -> Travailles-tu ?      (je après : werk, sans -t)
Waar woon je?     -> Où habites-tu ?</pre>
<div class="warn">Le -t ne tombe QU'avec je/jij inversés. Avec hij/zij/het, on garde toujours le -t, même après inversion : <em>Werkt hij?</em> (garde le -t).</div>
<h3>4. Attention aux radicaux en -d ou -t</h3>
<pre class="pseudo">antwoorden (répondre) -> radical antwoord
   ik antwoord, jij antwoordt (d + t), hij antwoordt
zitten (être assis)   -> radical zit
   ik zit, jij zit... mais on n'ajoute pas un 2e t (zit + t = zit)</pre>
<div class="tip">Si le radical finit déjà par -t (zit), on n'ajoute PAS un second t : <em>jij zit</em>, <em>hij zit</em>. Si le radical finit par -d (antwoord), on ajoute bien le -t : <em>hij antwoordt</em>.</div>
<h3>5. Exemples complets</h3>
<pre class="pseudo">wonen  : ik woon, jij woont, hij woont, wij wonen
spelen : ik speel, jij speelt, hij speelt, wij spelen
maken  : ik maak, jij maakt, hij maakt, wij maken</pre>`,
  exercises: [
    { type: "qcm", q: "Comment obtient-on le radical (stam) d'un verbe ?", opts: ["En ajoutant -en à l'infinitif", "En enlevant -en de l'infinitif", "En doublant la première lettre", "Il n'y a pas de radical"], a: 1, exp: "Infinitif - en = radical : wonen -> won." },
    { type: "qcm", q: "Comment dit-on « je travaille » (werken) ?", opts: ["ik werkt", "ik werken", "ik werk", "ik werke"], a: 2, exp: "Avec ik : le radical seul -> ik werk." },
    { type: "qcm", q: "Comment dit-on « tu travailles » ?", opts: ["jij werk", "jij werkt", "jij werken", "jij werke"], a: 1, exp: "Avec jij : radical + t -> jij werkt." },
    { type: "qcm", q: "Comment dit-on « nous travaillons » ?", opts: ["wij werk", "wij werkt", "wij werken", "wij werke"], a: 2, exp: "Au pluriel : l'infinitif complet -> wij werken." },
    { type: "qcm", q: "Dans <code>Werk je?</code>, pourquoi pas de -t ?", opts: ["Faute d'orthographe", "Parce que je suit le verbe (inversion) : le -t tombe", "Parce que werken est irrégulier", "Parce que c'est le pluriel"], a: 1, exp: "Le -t disparaît quand je/jij passe après le verbe." },
    { type: "qcm", q: "Quel est le radical de <code>spelen</code> (jouer) ?", opts: ["spel", "speel", "spelen", "spele"], a: 1, exp: "spel -> speel : on redouble la voyelle pour garder le son long." },
    { type: "vf", q: "Au pluriel, le verbe régulier reprend la forme de l'infinitif.", a: true, exp: "wij/jullie/zij + infinitif : wij werken." },
    { type: "vf", q: "Avec <code>hij</code>, le -t reste même après inversion (<code>Werkt hij?</code>).", a: true, exp: "Seul je/jij fait tomber le -t ; hij garde le -t." },
    { type: "vf", q: "Le radical de <code>zitten</code> est <code>zitt</code>, donc on écrit <code>hij zitt</code>.", a: false, exp: "Faux : le radical est zit ; si le radical finit par t, on n'en ajoute pas un 2e -> hij zit." },
    { type: "input", q: "Vul in : Ik ___ (wonen) in Gent.", a: ["woon"], ph: "un verbe", exp: "ik woon : radical seul." },
    { type: "input", q: "Vul in : Jij ___ (werken) hard.", a: ["werkt"], ph: "un verbe", exp: "jij werkt : radical + t." },
    { type: "input", q: "Vul in : Hij ___ (spelen) voetbal.", a: ["speelt"], ph: "un verbe", exp: "hij speelt : radical speel + t." },
    { type: "input", q: "Vul in : Wij ___ (maken) huiswerk.", a: ["maken"], ph: "un verbe", exp: "wij maken : infinitif." },
    { type: "input", q: "Vul in : ___ je in Amsterdam? (wonen — question)", a: ["woon"], ph: "un verbe", exp: "Woon je ? : le -t tombe à l'inversion." },
    { type: "input", q: "Vul in : Zij ___ (werken) samen. (ils travaillent, pluriel)", a: ["werken"], ph: "un verbe", exp: "zij werken : infinitif au pluriel." }
  ],
  final: {
    title: "Exercice final — Conjuguer au présent",
    intro: `<p>Lisez ce petit texte, puis conjuguez les verbes demandés.</p>
<pre class="pseudo">Ik woon in Gent. Ik werk in een school.
Mijn broer speelt voetbal. Wij maken samen huiswerk.</pre>
<p><em>Traduction : J'habite à Gand. Je travaille dans une école. Mon frère joue au football. Nous faisons nos devoirs ensemble.</em></p>`,
    questions: [
      { type: "input", q: "Vul in : Ik ___ (werken) in een school.", a: ["werk"], ph: "un verbe", exp: "ik werk : radical seul." },
      { type: "input", q: "Vul in : Mijn broer ___ (spelen) voetbal. (il joue)", a: ["speelt"], ph: "un verbe", exp: "hij speelt : radical speel + t." },
      { type: "qcm", q: "Quelle forme pour « nous faisons » (maken) ?", opts: ["wij maak", "wij maakt", "wij maken", "wij make"], a: 2, exp: "Pluriel : infinitif -> wij maken." },
      { type: "input", q: "Vul in : ___ je in Gent? (wonen — question)", a: ["woon"], ph: "un verbe", exp: "Woon je ? : inversion, -t tombe." },
      { type: "vf", q: "Dans <code>Speelt hij voetbal?</code>, le -t reste car le sujet est hij.", a: true, exp: "Le -t ne tombe qu'avec je/jij ; hij garde le -t." }
    ],
    solution: `<p>La mécanique complète, sur le verbe werken :</p>
<pre class="pseudo">ik werk           wij werken
jij werkt         jullie werken
hij/zij/het werkt zij werken
Question avec je : Werk je? (le -t tombe)</pre>
<p>Trois formes à retenir : <strong>radical</strong> (ik), <strong>radical + t</strong> (jij/hij), <strong>infinitif</strong> (pluriel). Et toujours : le -t tombe quand je/jij suit le verbe.</p>`
  }
};
</script>
