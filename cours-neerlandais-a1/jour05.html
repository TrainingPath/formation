<script>
var DAY = {
  num: 5,
  title: "Le verbe hebben (avoir) au présent",
  subtitle: "Le deuxième verbe-clé : conjuguer « avoir » et parler de ce qu'on possède.",
  theory: `
<h3>1. hebben = avoir</h3>
<p>Après <strong>zijn</strong> (être), voici l'autre verbe indispensable : <strong>hebben</strong> = « avoir ». Lui aussi est <strong>irrégulier</strong>, il faut le mémoriser. L'infinitif est <strong>hebben</strong>.</p>
<h3>2. La conjugaison au présent</h3>
<pre class="pseudo">ik        heb        -> j'ai
jij / je  hebt       -> tu as
u         hebt (of heeft) -> vous avez (poli)
hij       heeft      -> il a
zij / ze  heeft      -> elle a
het       heeft      -> il/elle a (neutre)
wij / we  hebben     -> nous avons
jullie    hebben     -> vous avez (groupe)
zij / ze  hebben     -> ils / elles ont</pre>
<p>Quatre formes : <strong>heb</strong> (ik), <strong>hebt</strong> (jij), <strong>heeft</strong> (hij/zij/het), <strong>hebben</strong> (pluriel).</p>
<div class="tip">Astuce mémoire : à la 3e personne du singulier, le b devient <strong>heeft</strong> (avec ee long et un f). C'est la seule forme un peu surprenante.</div>
<h3>3. L'inversion : hebt devient heb</h3>
<p>Comme pour zijn, quand <strong>je</strong> passe après le verbe, le <strong>-t disparaît</strong> :</p>
<pre class="pseudo">Jij hebt een boek.   -> Tu as un livre.     (sujet avant : hebt)
Heb je een boek?     -> As-tu un livre ?    (sujet après : heb, sans -t !)</pre>
<div class="warn">Ne dites jamais « hebt je ? » : à la question avec je, c'est toujours <strong>heb je ?</strong> Le -t tombe dès que je suit le verbe.</div>
<h3>4. Des phrases utiles</h3>
<pre class="pseudo">Ik heb een auto.         -> J'ai une voiture.
Zij heeft een kat.       -> Elle a un chat.
Wij hebben tijd.         -> Nous avons le temps.
Heb je honger?           -> As-tu faim ?
Ik heb dorst.            -> J'ai soif.</pre>
<h3>5. hebben dans les expressions</h3>
<p>Comme en français, <strong>hebben</strong> sert dans beaucoup d'expressions où l'on « a » un état :</p>
<pre class="pseudo">honger hebben   -> avoir faim     : Ik heb honger.
dorst hebben    -> avoir soif     : Heb je dorst?
gelijk hebben   -> avoir raison   : Je hebt gelijk.
tijd hebben     -> avoir le temps : Wij hebben tijd.</pre>
<div class="tip">Notez que le néerlandais dit <em>honger hebben</em> comme le français dit « avoir faim » : dans les deux langues, on emploie « avoir », pas « être ».</div>`,
  exercises: [
    { type: "qcm", q: "Quel est l'infinitif du verbe « avoir » en néerlandais ?", opts: ["zijn", "heten", "hebben", "houden"], a: 2, exp: "hebben = avoir." },
    { type: "qcm", q: "Comment dit-on « j'ai » ?", opts: ["ik hebt", "ik heb", "ik heeft", "ik hebben"], a: 1, exp: "ik heb = j'ai." },
    { type: "qcm", q: "Comment dit-on « elle a » ?", opts: ["zij heb", "zij hebt", "zij heeft", "zij hebben"], a: 2, exp: "zij heeft = elle a." },
    { type: "qcm", q: "Comment dit-on « nous avons » ?", opts: ["wij heb", "wij heeft", "wij hebt", "wij hebben"], a: 3, exp: "wij hebben = nous avons." },
    { type: "qcm", q: "Que devient <code>hebt</code> dans la question <code>___ je honger?</code> ?", opts: ["hebt", "heb", "heeft", "hebben"], a: 1, exp: "Inversion : Heb je honger ? — le -t disparaît." },
    { type: "qcm", q: "Comment traduit-on « J'ai soif » ?", opts: ["Ik ben dorst", "Ik heb dorst", "Ik heeft dorst", "Ik hebt dorst"], a: 1, exp: "dorst hebben = avoir soif ; Ik heb dorst." },
    { type: "vf", q: "La 3e personne du singulier de hebben est <code>heeft</code>.", a: true, exp: "hij / zij / het heeft." },
    { type: "vf", q: "<code>Jij heeft een kat</code> est correct.", a: false, exp: "Faux : avec jij, on dit « jij hebt een kat »." },
    { type: "vf", q: "Le néerlandais dit <code>honger hebben</code> (avoir faim), avec « avoir ».", a: true, exp: "Comme en français : on « a » faim, on n'« est » pas faim." },
    { type: "input", q: "Vul in : Ik ___ (hebben) een auto.", a: ["heb"], ph: "un verbe", exp: "Ik heb = j'ai." },
    { type: "input", q: "Vul in : Jij ___ (hebben) een boek.", a: ["hebt"], ph: "un verbe", exp: "Jij hebt = tu as." },
    { type: "input", q: "Vul in : Zij ___ (hebben) een kat. (elle a un chat)", a: ["heeft"], ph: "un verbe", exp: "Zij heeft = elle a (singulier)." },
    { type: "input", q: "Vul in : Wij ___ (hebben) tijd.", a: ["hebben"], ph: "un verbe", exp: "Wij hebben = nous avons." },
    { type: "input", q: "Vul in : ___ je honger? (question : as-tu faim ?)", a: ["heb"], ph: "un verbe", exp: "Heb je honger ? — le -t tombe à l'inversion." },
    { type: "input", q: "Vul in : Je ___ gelijk. (tu as raison)", a: ["hebt"], ph: "un verbe", exp: "Je hebt gelijk = tu as raison." }
  ],
  final: {
    title: "Exercice final — Conjuguer hebben",
    intro: `<p>Complétez avec la bonne forme de <strong>hebben</strong>. Rappel : heb · hebt · heeft · hebben.</p>
<pre class="pseudo">ik heb · jij hebt · hij/zij/het heeft · wij/jullie/zij hebben</pre>`,
    questions: [
      { type: "input", q: "Vul in : Ik ___ een hond. (j'ai un chien)", a: ["heb"], ph: "un verbe", exp: "Ik heb een hond." },
      { type: "input", q: "Vul in : Hij ___ een fiets. (il a un vélo, singulier)", a: ["heeft"], ph: "un verbe", exp: "Hij heeft = il a." },
      { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Wij heeft tijd", "Wij hebt tijd", "Wij hebben tijd", "Wij heb tijd"], a: 2, exp: "wij hebben tijd = nous avons le temps." },
      { type: "input", q: "Vul in : Jullie ___ honger. (vous avez faim, groupe)", a: ["hebben"], ph: "un verbe", exp: "jullie hebben = vous avez (pluriel)." },
      { type: "qcm", q: "Comment demander « As-tu soif ? »", opts: ["Hebt je dorst?", "Heb je dorst?", "Heeft je dorst?", "Hebben je dorst?"], a: 1, exp: "Inversion : Heb je dorst ? (le -t tombe)." }
    ],
    solution: `<p>Le tableau à mémoriser :</p>
<pre class="pseudo">ik heb            wij hebben
jij hebt          jullie hebben
hij/zij/het heeft zij hebben</pre>
<p>Deux verbes irréguliers maîtrisés : <strong>zijn</strong> (jour 4) et <strong>hebben</strong> (jour 5). Ce sont les fondations de la conjugaison néerlandaise. Révisez-les jusqu'à les réciter sans hésiter.</p>`
  }
};
</script>
