<script>
var DAY = {
  num: 24,
  title: "La routine quotidienne",
  subtitle: "Raconter sa journée : se lever, manger, travailler, se coucher.",
  theory: `
<h3>1. Les verbes de la journée</h3>
<pre class="pseudo">opstaan      se lever        ontbijten    prendre le petit-déjeuner
douchen      se doucher      aankleden    s'habiller
werken       travailler      eten         manger
studeren     étudier         slapen       dormir
naar bed gaan  aller au lit  thuiskomen   rentrer à la maison</pre>
<h3>2. Les moments de la journée</h3>
<pre class="pseudo">'s morgens    le matin       's middags    l'après-midi
's avonds     le soir        's nachts     la nuit
eerst         d'abord        dan/daarna    ensuite
altijd        toujours       vaak          souvent</pre>
<h3>3. Raconter sa journée (attention aux verbes séparables !)</h3>
<pre class="pseudo">Ik sta om zeven uur op.        Je me lève à sept heures.
Dan ontbijt ik.                Ensuite je prends le petit-déjeuner.
's Morgens werk ik.            Le matin, je travaille.
's Avonds eet ik met mijn familie.   Le soir, je mange avec ma famille.
Ik ga om elf uur naar bed.     Je vais au lit à onze heures.</pre>
<div class="tip">Quand la phrase commence par un complément de temps ('s morgens, dan, om zeven uur), le verbe reste en 2e position et le sujet passe APRÈS le verbe : « 's Morgens <strong>werk ik</strong> » (et non « 's morgens ik werk »).</div>
<div class="warn">Rappel jour 22 : opstaan et thuiskomen sont séparables. « Ik sta op », « Ik kom thuis » : la particule va à la fin.</div>
<h3>4. Dire à quelle heure</h3>
<pre class="pseudo">om zeven uur       à sept heures
om half acht       à sept heures et demie
Hoe laat sta je op?   À quelle heure te lèves-tu ?</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie « opstaan » ?", opts: ["se lever", "se doucher", "manger", "dormir"], a: 0, exp: "opstaan = se lever." },
    { type: "input", q: "« se doucher » se dit ___ en néerlandais.", a: ["douchen"], ph: "un verbe", exp: "douchen = se doucher." },
    { type: "qcm", q: "Que veut dire « 's avonds » ?", opts: ["le soir", "le matin", "l'après-midi", "la nuit"], a: 0, exp: "'s avonds = le soir ; 's morgens = le matin." },
    { type: "vf", q: "« ontbijten » signifie « prendre le petit-déjeuner ».", a: true, exp: "ontbijten = déjeuner (petit-déjeuner) ; het ontbijt = le petit-déjeuner." },
    { type: "input", q: "Complète : « Ik sta om zeven uur ___ » (Je me lève à 7h, opstaan).", a: ["op"], ph: "la particule", exp: "opstaan séparable : Ik sta ... op." },
    { type: "qcm", q: "Quel est le bon ordre : « 's Morgens ___ ik » (Le matin je travaille) ?", opts: ["werk", "ik werk", "werken", "werkt"], a: 0, exp: "Le verbe en 2e position, sujet après : 's Morgens werk ik." },
    { type: "input", q: "« le matin » se dit ___ en néerlandais.", a: ["'s morgens", "s morgens", "'s ochtends"], ph: "un moment", exp: "'s morgens (ou 's ochtends) = le matin." },
    { type: "qcm", q: "Que signifie « naar bed gaan » ?", opts: ["aller au lit", "se lever", "rentrer à la maison", "s'habiller"], a: 0, exp: "naar bed gaan = aller se coucher." },
    { type: "vf", q: "Après « 's Avonds », on écrit « ik eet » sans changement (s'avonds ik eet).", a: false, exp: "Non : le verbe passe en 2e position : 's Avonds eet ik." },
    { type: "input", q: "« dormir » se dit ___ en néerlandais.", a: ["slapen"], ph: "un verbe", exp: "slapen = dormir." },
    { type: "qcm", q: "Comment dit-on « d'abord » ?", opts: ["eerst", "daarna", "altijd", "vaak"], a: 0, exp: "eerst = d'abord ; daarna = ensuite." },
    { type: "input", q: "Complète : « Ik kom om zes uur ___ » (Je rentre à 6h, thuiskomen).", a: ["thuis"], ph: "la particule", exp: "thuiskomen séparable : Ik kom ... thuis." },
    { type: "qcm", q: "Que veut dire « Hoe laat sta je op? »", opts: ["À quelle heure te lèves-tu ?", "Où travailles-tu ?", "Quand manges-tu ?", "Comment vas-tu ?"], a: 0, exp: "Hoe laat = à quelle heure ; opstaan = se lever." },
    { type: "vf", q: "« altijd » signifie « toujours ».", a: true, exp: "altijd = toujours ; vaak = souvent." },
    { type: "input", q: "« travailler » se dit ___ en néerlandais.", a: ["werken"], ph: "un verbe", exp: "werken = travailler." }
  ],
  final: {
    title: "Exercice final — La journée de Karel",
    intro: `<p>Lis la routine de Karel, puis réponds.</p>
<pre class="pseudo">Karel staat om half zeven op.        Karel se lève à six heures et demie.
Eerst doucht hij.                    D'abord il se douche.
Dan ontbijt hij met brood en koffie. Ensuite il déjeune avec du pain et du café.
's Morgens werkt hij op kantoor.     Le matin, il travaille au bureau.
's Avonds kijkt hij televisie en gaat om elf uur naar bed.  Le soir, il regarde la télé et va au lit à onze heures.</pre>`,
    questions: [
      { type: "input", q: "Verbe opstaan : « Karel staat om half zeven ___ ». Donne la particule.", a: ["op"], ph: "la particule", exp: "opstaan -> staat ... op." },
      { type: "qcm", q: "Que fait Karel d'abord (eerst) ?", opts: ["il se douche", "il déjeune", "il travaille", "il dort"], a: 0, exp: "« Eerst doucht hij » : il se douche." },
      { type: "qcm", q: "Où travaille Karel le matin ?", opts: ["au bureau (op kantoor)", "à la maison", "à l'école", "au magasin"], a: 0, exp: "« 's Morgens werkt hij op kantoor »." },
      { type: "vf", q: "Karel va au lit à onze heures.", a: true, exp: "« gaat om elf uur naar bed » : à onze heures." },
      { type: "input", q: "Comment dit-on « le soir » en néerlandais ? ___", a: ["'s avonds", "s avonds"], ph: "un moment", exp: "'s avonds = le soir." }
    ],
    solution: `<p>Karel se lève à 6h30 (staat ... op), se douche d'abord (eerst doucht hij), déjeune (ontbijt), travaille au bureau le matin (werkt op kantoor) et se couche à 23h (gaat naar bed). Remarque le verbe toujours en 2e position après un complément de temps.</p>
<pre class="pseudo">'s Morgens  werkt  hij ...   (temps 1 - verbe 2 - sujet 3)
Ik  sta  om zeven uur  op.   (verbe séparable : particule à la fin)</pre>`
  }
};
</script>
