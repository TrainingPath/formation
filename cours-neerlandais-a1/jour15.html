<script>
var DAY = {
  num: 15,
  title: "L'heure et les moments de la journée",
  subtitle: "Demander et dire l'heure, situer un moment dans la journée.",
  theory: `
<h3>1. Demander l'heure</h3>
<pre class="pseudo">Hoe laat is het?   -> Quelle heure est-il ?
Het is ...          -> Il est ...</pre>
<h3>2. Les heures pleines</h3>
<p>Pour une heure pleine, on utilise le nombre + <strong>uur</strong> :</p>
<pre class="pseudo">Het is een uur.    -> Il est une heure.
Het is drie uur.   -> Il est trois heures.
Het is twaalf uur. -> Il est midi (ou minuit).</pre>
<h3>3. Les demi-heures et les quarts</h3>
<p>Attention : en néerlandais, la demi-heure se dit <strong>« half »</strong> + l'heure <strong>suivante</strong> (comme en allemand) :</p>
<pre class="pseudo">half twee   -> une heure et demie (1h30, litt. la moitie vers deux)
half zeven  -> six heures et demie (6h30)
kwart over drie -> trois heures et quart (3h15)
kwart voor vier -> quatre heures moins le quart (3h45)</pre>
<div class="warn">Piege classique : half twee = 1h30 (et non 2h30). En neerlandais, half compte vers l'heure suivante.</div>
<h3>4. Les minutes : over et voor</h3>
<pre class="pseudo">tien over drie   -> trois heures dix (3h10, litt. dix apres trois)
vijf voor vier   -> quatre heures moins cinq (3h55, litt. cinq avant quatre)</pre>
<h3>5. Les moments de la journée</h3>
<pre class="pseudo">de ochtend / de morgen -> le matin        's morgens  -> le matin
de middag              -> le midi/l'apres-midi  's middags -> l'apres-midi
de avond               -> le soir        's avonds   -> le soir
de nacht               -> la nuit        's nachts   -> la nuit</pre>
<div class="tip">Pour dire « le matin » au sens habituel, on utilise 's morgens, 's middags, 's avonds, 's nachts. Exemple : Ik werk 's morgens (Je travaille le matin).</div>
<h3>6. Exemples utiles</h3>
<pre class="pseudo">Ik sta om zeven uur op.      -> Je me leve a sept heures.
De les begint om half negen. -> Le cours commence a huit heures et demie.
's Avonds kijk ik televisie. -> Le soir, je regarde la television.</pre>`,

    { type: "qcm", q: "Comment demande-t-on l'heure ?", opts: ["Waar is het?", "Hoe laat is het?", "Wat is het?", "Wanneer is het?"], a: 1, exp: "Hoe laat is het? = Quelle heure est-il ?" },
    { type: "qcm", q: "Que signifie « half twee » ?", opts: ["2h30", "1h30", "2h00", "1h15"], a: 1, exp: "half twee = 1h30 : half compte vers l'heure suivante." },
    { type: "qcm", q: "Comment dit-on « il est trois heures » ?", opts: ["Het is drie uur", "Het is half drie", "Het is drie", "Het drie uur is"], a: 0, exp: "Heure pleine : nombre + uur -> Het is drie uur." },
    { type: "qcm", q: "Que signifie « kwart voor vier » ?", opts: ["4h15", "4h45", "3h45", "3h15"], a: 2, exp: "kwart voor vier = 3h45 (quatre heures moins le quart)." },
    { type: "qcm", q: "Comment dit-on « le soir » (moment habituel) ?", opts: ["'s morgens", "'s middags", "'s avonds", "'s nachts"], a: 2, exp: "'s avonds = le soir." },
    { type: "qcm", q: "Que signifie « kwart over drie » ?", opts: ["3h15", "2h45", "3h45", "4h15"], a: 0, exp: "kwart over drie = 3h15 (trois heures et quart)." },
    { type: "vf", q: "« half zeven » signifie 6h30.", a: true, exp: "half zeven = 6h30 : half compte vers l'heure suivante (zeven = 7)." },
    { type: "vf", q: "Pour une heure pleine, on dit le nombre + « uur ».", a: true, exp: "Het is drie uur : nombre + uur." },
    { type: "vf", q: "« 's morgens » signifie « le soir ».", a: false, exp: "Faux : 's morgens = le matin ; le soir = 's avonds." },
    { type: "input", q: "Vul in : Hoe ___ is het? (Quelle heure est-il ?)", a: ["laat"], ph: "un mot", exp: "Hoe laat is het? = Quelle heure est-il ?" },
    { type: "input", q: "Vul in : Het is drie ___. (Il est trois heures)", a: ["uur"], ph: "un mot", exp: "Heure pleine : drie uur." },
    { type: "input", q: "Vul in : half ___ = 1h30 (l'heure suivante)", a: ["twee"], ph: "un nombre", exp: "half twee = 1h30 : half compte vers l'heure suivante." },
    { type: "input", q: "Vul in : ___ avonds kijk ik televisie. (le soir)", a: ["'s", "s"], ph: "deux caractères", exp: "'s avonds = le soir." },
    { type: "input", q: "Vul in : kwart ___ vier = 3h45 (moins le quart)", a: ["voor"], ph: "over ou voor", exp: "kwart voor vier = 3h45 (voor = avant)." },
    { type: "input", q: "Vul in : Ik sta om zeven ___ op. (à sept heures)", a: ["uur"], ph: "un mot", exp: "om zeven uur = a sept heures." }
  ],
  final: {
    title: "Exercice final — L'heure et les moments",
    intro: `<p>Lisez ce petit texte, puis répondez.</p>
<pre class="pseudo">Ik sta om zeven uur op. De les begint om half negen.
's Middags eet ik. 's Avonds kijk ik televisie.</pre>
<p><em>Traduction : Je me lève à sept heures. Le cours commence à huit heures et demie. L'après-midi, je mange. Le soir, je regarde la télévision.</em></p>`,
    questions: [
      { type: "input", q: "Vul in : Hoe ___ is het? (Quelle heure est-il ?)", a: ["laat"], ph: "un mot", exp: "Hoe laat is het?" },

      { type: "input", q: "Vul in : Het is vier ___. (Il est quatre heures)", a: ["uur"], ph: "un mot", exp: "Heure pleine : vier uur." },
      { type: "qcm", q: "Comment dit-on « l'après-midi » (moment habituel) ?", opts: ["'s morgens", "'s middags", "'s avonds", "'s nachts"], a: 1, exp: "'s middags = l'apres-midi." },
      { type: "vf", q: "« kwart over drie » signifie 3h15.", a: true, exp: "kwart over drie = 3h15 (trois heures et quart)." }
    ],
    solution: `<p>Les repères de l'heure :</p>
<pre class="pseudo">Hoe laat is het?  -> Quelle heure est-il ?
drie uur          -> heure pleine (3h00)
half twee         -> 1h30 (half compte vers l'heure suivante !)
kwart over drie   -> 3h15   kwart voor vier -> 3h45
tien over drie    -> 3h10   vijf voor vier  -> 3h55</pre>
<p>Moments de la journée : <strong>'s morgens</strong> (matin), <strong>'s middags</strong> (après-midi), <strong>'s avonds</strong> (soir), <strong>'s nachts</strong> (nuit).</p>`
  }
};
