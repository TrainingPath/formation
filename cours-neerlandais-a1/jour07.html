<script>
var DAY = {
  num: 7,
  title: "Le pluriel des noms",
  subtitle: "Passer d'un objet à plusieurs : les terminaisons -en et -s.",
  theory: `
<h3>1. Deux terminaisons principales</h3>
<p>Pour mettre un nom au <strong>pluriel</strong> (plusieurs), le néerlandais ajoute le plus souvent <strong>-en</strong>, parfois <strong>-s</strong>. Rappel du jour 6 : au pluriel, l'article est toujours <strong>de</strong>.</p>
<pre class="pseudo">Singulier        Pluriel          Sens
de boek          de boeken        les livres     (+ en)
de stoel         de stoelen       les chaises    (+ en)
de tafel         de tafels        les tables     (+ s)
de jongen        de jongens       les garçons    (+ s)</pre>
<h3>2. Quand -en, quand -s ?</h3>
<p>Règle générale : la plupart des noms prennent <strong>-en</strong>. On ajoute <strong>-s</strong> surtout aux mots qui se terminent par <strong>-el, -em, -en, -er, -je</strong> (et à beaucoup d'emprunts) :</p>
<pre class="pseudo">Prennent -s :
tafel  -> tafels     (finit par -el)
bezem  -> bezems     (finit par -em)
meisje -> meisjes    (diminutif -je)
auto   -> auto's      (voyelle -> apostrophe + s)</pre>
<div class="tip">Après une voyelle simple (a, o, u, i), on écrit <strong>apostrophe + s</strong> pour garder la voyelle longue : auto -> auto's, foto -> foto's, oma -> oma's.</div>
<h3>3. Les changements d'orthographe (voyelle courte)</h3>
<p>Quand un mot a une voyelle <strong>courte</strong> suivie d'une seule consonne, on <strong>double la consonne</strong> au pluriel, pour garder le son court :</p>
<pre class="pseudo">de man   -> de mannen    (on double le n : sinon « manen » = crinières)
de kat   -> de katten    (double t)
de bus   -> de bussen    (double s)
de pen   -> de pennen    (double n)</pre>
<div class="warn">À l'inverse, une voyelle <strong>longue doublée</strong> perd une lettre : het uur -> de uren, de maan -> de manen. La règle vise toujours à conserver le même SON entre singulier et pluriel.</div>
<h3>4. Le cas particulier -eren</h3>
<p>Quelques noms (peu nombreux) font leur pluriel en <strong>-eren</strong> :</p>
<pre class="pseudo">het kind   -> de kinderen    (les enfants)
het ei     -> de eieren      (les œufs)
het blad   -> de bladeren    (les feuilles)</pre>
<h3>5. Récapitulatif</h3>
<pre class="pseudo">Cas courant                  : + en   (boek -> boeken)
Fin en -el/-em/-en/-er/-je   : + s    (tafel -> tafels)
Après voyelle simple         : + 's   (auto -> auto's)
Voyelle courte + 1 consonne  : double la consonne + en (kat -> katten)
Quelques exceptions          : + eren (kind -> kinderen)</pre>
<p>Ne paniquez pas : dans le doute, ajoutez <strong>-en</strong>, c'est le cas le plus fréquent.</p>`,
  exercises: [
    { type: "qcm", q: "Quelle est la terminaison de pluriel la plus fréquente ?", opts: ["-s", "-en", "-eren", "-x"], a: 1, exp: "La majorité des noms prennent -en." },
    { type: "qcm", q: "Quel est le pluriel de <code>boek</code> (livre) ?", opts: ["boeks", "boeken", "boekeren", "boek's"], a: 1, exp: "boek -> boeken (+ en)." },
    { type: "qcm", q: "Quel est le pluriel de <code>tafel</code> (table) ?", opts: ["tafelen", "tafels", "tafellen", "tafel's"], a: 1, exp: "Fin en -el -> + s : tafels." },
    { type: "qcm", q: "Quel est le pluriel de <code>auto</code> (voiture) ?", opts: ["autoen", "autos", "auto's", "autoeren"], a: 2, exp: "Après voyelle simple : apostrophe + s -> auto's." },
    { type: "qcm", q: "Pourquoi <code>kat</code> devient-il <code>katten</code> et non <code>katen</code> ?", opts: ["Par hasard", "Pour garder la voyelle courte, on double la consonne", "Parce que kat est un het-woord", "C'est une faute"], a: 1, exp: "Voyelle courte + 1 consonne : on double la consonne (tt) pour conserver le son court." },
    { type: "qcm", q: "Quel est le pluriel de <code>kind</code> (enfant) ?", opts: ["kinds", "kinden", "kinderen", "kind's"], a: 2, exp: "Exception en -eren : de kinderen." },
    { type: "vf", q: "Au pluriel, l'article défini est toujours <code>de</code>.", a: true, exp: "Vu au jour 6 : het huis -> de huizen." },
    { type: "vf", q: "<code>man</code> fait <code>manen</code> au pluriel.", a: false, exp: "Faux : man -> mannen (double n). « manen » signifierait « crinières »." },
    { type: "vf", q: "<code>foto</code> fait <code>foto's</code> au pluriel.", a: true, exp: "Après voyelle simple, on ajoute apostrophe + s." },
    { type: "input", q: "Vul in : pluriel de <code>stoel</code> (chaise) : de ___.", a: ["stoelen"], ph: "un mot", exp: "stoel -> stoelen (+ en)." },
    { type: "input", q: "Vul in : pluriel de <code>kat</code> (chat) : de ___.", a: ["katten"], ph: "un mot", exp: "Voyelle courte : on double le t -> katten." },
    { type: "input", q: "Vul in : pluriel de <code>tafel</code> (table) : de ___.", a: ["tafels"], ph: "un mot", exp: "Fin -el -> + s : tafels." },
    { type: "input", q: "Vul in : pluriel de <code>auto</code> (voiture) : de ___.", a: ["auto's", "autos"], ph: "un mot", exp: "Après voyelle simple : auto's." },
    { type: "input", q: "Vul in : pluriel de <code>kind</code> (enfant) : de ___.", a: ["kinderen"], ph: "un mot", exp: "Exception : kind -> kinderen." },
    { type: "input", q: "Vul in : pluriel de <code>pen</code> (stylo) : de ___.", a: ["pennen"], ph: "un mot", exp: "Voyelle courte : on double le n -> pennen." }
  ],
  final: {
    title: "Exercice final — Mettre au pluriel",
    intro: `<p>Transformez chaque nom singulier en pluriel. Attention aux consonnes à doubler et aux apostrophes.</p>
<pre class="pseudo">boek · man · tafel · auto · kind</pre>`,
    questions: [
      { type: "input", q: "Vul in : pluriel de <code>boek</code> : de ___.", a: ["boeken"], ph: "un mot", exp: "boek -> boeken." },
      { type: "input", q: "Vul in : pluriel de <code>man</code> : de ___.", a: ["mannen"], ph: "un mot", exp: "man -> mannen (double n)." },
      { type: "qcm", q: "Quel est le pluriel correct de <code>tafel</code> ?", opts: ["tafelen", "tafels", "taffels", "tafel's"], a: 1, exp: "Fin -el -> + s." },
      { type: "input", q: "Vul in : pluriel de <code>auto</code> : de ___.", a: ["auto's", "autos"], ph: "un mot", exp: "auto -> auto's." },
      { type: "qcm", q: "Quel est le pluriel de <code>kind</code> ?", opts: ["kinden", "kinds", "kinderen", "kinds"], a: 2, exp: "Exception en -eren." }
    ],
    solution: `<p>Les pluriels corrects :</p>
<pre class="pseudo">boek  -> boeken   (+ en, cas standard)
man   -> mannen   (voyelle courte : double consonne)
tafel -> tafels   (fin -el : + s)
auto  -> auto's   (voyelle simple : apostrophe + s)
kind  -> kinderen (exception en -eren)</pre>
<p>Dans le doute, ajoutez <strong>-en</strong> : c'est le cas majoritaire. Et souvenez-vous de doubler la consonne après une voyelle courte pour garder le bon son.</p>`
  }
};
