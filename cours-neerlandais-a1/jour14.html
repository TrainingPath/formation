<script>
var DAY = {
  num: 14,
  title: "L'accord de l'adjectif (de/het)",
  subtitle: "Quand ajouter -e à l'adjectif : la règle de/het.",
  theory: `
<h3>1. Le principe</h3>
<p>En néerlandais, l'adjectif placé <strong>avant</strong> le nom prend souvent un <strong>-e</strong>. La règle dépend de l'article (<em>de</em> ou <em>het</em>) et de la présence de <em>een</em>.</p>
<pre class="pseudo">de-mot : de auto, de man, de vrouw (genre commun)
het-mot: het huis, het kind, het boek (genre neutre)</pre>
<h3>2. La règle de base : on ajoute -e</h3>
<p>Dans presque tous les cas, l'adjectif devant le nom prend un <strong>-e</strong> :</p>
<pre class="pseudo">de grote auto    (la grande voiture)   -> de-mot : + e
de mooie vrouw   (la belle femme)      -> de-mot : + e
het grote huis   (la grande maison)    -> het-mot defini : + e
een grote auto   (une grande voiture)  -> de-mot avec een : + e</pre>
<h3>3. L'exception : het-mot indéfini (een + het-mot)</h3>
<p>L'adjectif ne prend <strong>PAS</strong> de -e dans un seul cas précis : devant un <strong>het-mot indéfini</strong> (avec <em>een</em> ou sans article) :</p>
<pre class="pseudo">een groot huis   (une grande maison)  -> het-mot + een : PAS de e
een klein kind   (un petit enfant)    -> het-mot + een : PAS de e
het grote huis   (la grande maison)   -> het-mot DEFINI : + e</pre>
<div class="warn">La seule exception (pas de -e) : <strong>een + het-mot</strong>. Partout ailleurs, on ajoute -e.</div>
<h3>4. Tableau récapitulatif</h3>
<pre class="pseudo">                 de-mot (auto)      het-mot (huis)
de / het (defini) de grote auto     het grote huis     -> + e
een (indefini)    een grote auto    een groot huis     -> het + een = PAS de e
sans article      grote auto's      groot huis?        -> het indefini = pas de e</pre>
<h3>5. Adjectif après le verbe : jamais de -e</h3>
<p>Quand l'adjectif est <strong>après</strong> le nom (attribut, avec <em>zijn</em>), il ne prend <strong>jamais</strong> de -e :</p>
<pre class="pseudo">Het huis is groot.   (La maison est grande.)  -> pas de e
De auto is mooi.     (La voiture est belle.)  -> pas de e</pre>
<div class="tip">Réflexe : l'adjectif ne prend un -e que devant le nom. Après le verbe (Het is groot), jamais de -e.</div>`,
  exercises: [
    { type: "qcm", q: "Dans quel cas l'adjectif ne prend PAS de -e ?", opts: ["Devant un de-mot", "Devant un het-mot défini", "Devant un het-mot indéfini (een + het-mot)", "Toujours -e"], a: 2, exp: "Exception : een + het-mot -> een groot huis (pas de e)." },
    { type: "qcm", q: "Comment dit-on « la grande voiture » (de auto) ?", opts: ["de groot auto", "de grote auto", "de grootte auto", "grote de auto"], a: 1, exp: "de-mot -> + e : de grote auto." },
    { type: "qcm", q: "Comment dit-on « une grande maison » (het huis) ?", opts: ["een grote huis", "een groot huis", "een grootte huis", "de grote huis"], a: 1, exp: "een + het-mot -> pas de e : een groot huis." },
    { type: "qcm", q: "Comment dit-on « la grande maison » (het huis, défini) ?", opts: ["het groot huis", "het grote huis", "de groot huis", "een groot huis"], a: 1, exp: "het-mot DEFINI -> + e : het grote huis." },
    { type: "qcm", q: "Comment dit-on « une grande voiture » (de auto) ?", opts: ["een groot auto", "een grote auto", "de groot auto", "een grootte auto"], a: 1, exp: "de-mot avec een -> + e : een grote auto." },
    { type: "qcm", q: "Que devient l'adjectif dans « Het huis is ___ » (grand) ?", opts: ["grote", "groot", "grootte", "grooten"], a: 1, exp: "Apres le verbe : jamais de e -> Het huis is groot." },
    { type: "vf", q: "Devant un de-mot, l'adjectif prend toujours un -e.", a: true, exp: "de grote auto, een grote auto : de-mot -> + e." },
    { type: "vf", q: "« een groot huis » est correct (het-mot indéfini, pas de -e).", a: true, exp: "een + het-mot -> pas de e : een groot huis." },
    { type: "vf", q: "Après le verbe zijn, l'adjectif prend un -e (« Het is grote »).", a: false, exp: "Faux : apres le verbe, jamais de e -> Het is groot." },
    { type: "input", q: "Vul in : de ___ auto (grand — de-mot défini)", a: ["grote"], ph: "l'adjectif", exp: "de-mot -> + e : de grote auto." },
    { type: "input", q: "Vul in : een ___ huis (grand — het-mot avec een)", a: ["groot"], ph: "l'adjectif", exp: "een + het-mot -> pas de e : een groot huis." },
    { type: "input", q: "Vul in : het ___ boek (petit — het-mot défini)", a: ["kleine"], ph: "l'adjectif", exp: "het-mot defini -> + e : het kleine boek." },
    { type: "input", q: "Vul in : een ___ vrouw (beau — de-mot avec een)", a: ["mooie"], ph: "l'adjectif", exp: "de-mot avec een -> + e : een mooie vrouw." },
    { type: "input", q: "Vul in : Het huis is ___. (grand — après le verbe)", a: ["groot"], ph: "l'adjectif", exp: "Apres le verbe : pas de e -> groot." },
    { type: "input", q: "Vul in : een ___ kind (petit — het-mot avec een)", a: ["klein"], ph: "l'adjectif", exp: "een + het-mot -> pas de e : een klein kind." }
  ],
  final: {
    title: "Exercice final — Accorder l'adjectif",
    intro: `<p>Lisez ce petit texte, puis répondez.</p>
<pre class="pseudo">Ik heb een grote auto en een klein huis.
De mooie tuin is groot. Het oude boek is interessant.</pre>
<p><em>Traduction : J'ai une grande voiture et une petite maison. Le beau jardin est grand. Le vieux livre est intéressant.</em></p>`,
    questions: [
      { type: "input", q: "Vul in : de ___ tuin (beau — de-mot défini)", a: ["mooie"], ph: "l'adjectif", exp: "de-mot -> + e : de mooie tuin." },
      { type: "input", q: "Vul in : een ___ huis (petit — het-mot avec een)", a: ["klein"], ph: "l'adjectif", exp: "een + het-mot -> pas de e : een klein huis." },
      { type: "qcm", q: "Comment dit-on « la grande voiture » (de auto) ?", opts: ["de groot auto", "de grote auto", "een groot auto", "grote auto de"], a: 1, exp: "de-mot -> + e." },
      { type: "input", q: "Vul in : Het huis is ___. (grand — après le verbe)", a: ["groot"], ph: "l'adjectif", exp: "Apres le verbe : pas de e." },
      { type: "vf", q: "« een groot huis » est correct car huis est un het-mot indéfini.", a: true, exp: "een + het-mot -> pas de e." }
    ],
    solution: `<p>La règle en une image :</p>
<pre class="pseudo">Devant le nom : adjectif + e
   SAUF een + het-mot -> pas de e (een groot huis)
Apres le verbe (zijn) : jamais de e (Het is groot)</pre>
<p>Réflexe : un seul cas sans -e devant le nom, c'est <strong>een + het-mot</strong>. Partout ailleurs devant le nom, on ajoute <strong>-e</strong>.</p>`
  }
};
