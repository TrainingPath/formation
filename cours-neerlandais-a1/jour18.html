  title: "La nourriture ; lekker, ik lust",
  subtitle: "Nommer les aliments et dire ce qu'on aime manger.",
  theory: `
<h3>1. Le vocabulaire de la nourriture — het eten</h3>
<pre class="pseudo">het brood    le pain        de kaas      le fromage
het water    l'eau          de melk      le lait
het fruit    les fruits     de appel     la pomme
de aardappel la pomme de terre  de vis    le poisson
het vlees    la viande      de groente   le légume
het ei       l'oeuf         de koffie    le café</pre>
<h3>2. « lekker » : bon, délicieux</h3>
<p>Le mot <strong>lekker</strong> veut dire « bon / délicieux » et s'emploie tout le temps à table :</p>
<pre class="pseudo">De soep is lekker.        La soupe est bonne.
Dat is lekker!            C'est délicieux !
Eet smakelijk!            Bon appétit !</pre>
<h3>3. « ik lust » : j'aime (manger)</h3>
<p>Pour dire qu'on aime ou non un aliment, le néerlandais utilise le verbe <strong>lusten</strong> (aimer manger/boire). On l'emploie souvent à la forme négative avec <strong>niet</strong> ou <strong>geen</strong> :</p>
<pre class="pseudo">Ik lust vis.              J'aime le poisson.
Ik lust geen vis.        Je n'aime pas le poisson.
Lust je koffie?          Aimes-tu le café ?</pre>
<div class="tip">On peut aussi dire <code>Ik hou van chocolade</code> (J'aime le chocolat) avec <strong>houden van</strong>, ou <code>Ik eet graag fruit</code> (J'aime manger des fruits) avec <strong>graag</strong> + verbe.</div>
<h3>4. Avoir faim, avoir soif</h3>
<pre class="pseudo">Ik heb honger.           J'ai faim.
Ik heb dorst.            J'ai soif.
Ik wil brood.            Je veux du pain.</pre>
<div class="warn">Attention : on dit <strong>Ik heb honger</strong> (litt. « j'ai faim »), avec hebben, exactement comme en français.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie « het brood » ?", opts: ["le pain", "le fromage", "l'eau", "la viande"], a: 0, exp: "het brood = le pain ; de kaas = le fromage." },
    { type: "input", q: "« l'eau » se dit ___ en néerlandais.", a: ["het water", "water"], ph: "une boisson", exp: "het water = l'eau." },
    { type: "qcm", q: "Que veut dire « lekker » ?", opts: ["bon, délicieux", "cher", "chaud", "froid"], a: 0, exp: "lekker = bon/délicieux, très utilisé à table." },
    { type: "vf", q: "« Ik lust geen vis » signifie « Je n'aime pas le poisson ».", a: true, exp: "geen rend la phrase négative : je n'aime pas le poisson." },
    { type: "input", q: "« le fromage » se dit ___ en néerlandais.", a: ["de kaas", "kaas"], ph: "un aliment", exp: "de kaas = le fromage." },
    { type: "qcm", q: "Comment dit-on « Bon appétit ! » ?", opts: ["Eet smakelijk!", "Tot ziens!", "Dank je wel!", "Alsjeblieft!"], a: 0, exp: "Eet smakelijk = bon appétit." },
    { type: "input", q: "Complète : « J'ai faim » = Ik heb ___.", a: ["honger"], ph: "un mot", exp: "Ik heb honger = J'ai faim." },
    { type: "qcm", q: "Que signifie « de appel » ?", opts: ["la pomme", "la pomme de terre", "le poisson", "le lait"], a: 0, exp: "de appel = la pomme ; de aardappel = la pomme de terre." },
    { type: "vf", q: "« Ik heb dorst » veut dire « J'ai soif ».", a: true, exp: "dorst = la soif ; honger = la faim." },
    { type: "input", q: "« la viande » se dit ___ en néerlandais.", a: ["het vlees", "vlees"], ph: "un aliment", exp: "het vlees = la viande." },
    { type: "qcm", q: "Comment traduire « Lust je koffie? »", opts: ["Aimes-tu le café ?", "Veux-tu du thé ?", "Où est le café ?", "As-tu faim ?"], a: 0, exp: "lusten = aimer manger/boire ; koffie = café." },
    { type: "input", q: "« le lait » se dit ___ en néerlandais.", a: ["de melk", "melk"], ph: "une boisson", exp: "de melk = le lait." },
    { type: "qcm", q: "Que veut dire « Ik eet graag fruit » ?", opts: ["J'aime manger des fruits", "Je n'aime pas les fruits", "Je vends des fruits", "Je cherche des fruits"], a: 0, exp: "graag + verbe = faire volontiers : aimer manger." },
    { type: "vf", q: "Le mot « de groente » signifie « le fruit ».", a: false, exp: "Non : de groente = le légume. Le fruit se dit het fruit." },
    { type: "input", q: "« le poisson » se dit ___ en néerlandais.", a: ["de vis", "vis"], ph: "un aliment", exp: "de vis = le poisson." }
  ],
  final: {
    title: "Exercice final — Au restaurant",
    intro: `<p>Lis ce petit dialogue, puis réponds.</p>
<pre class="pseudo">Sara: Ik heb honger. Wat eet jij?     Sara : J'ai faim. Que manges-tu ?
Tom: Ik eet graag vis.               Tom : J'aime manger du poisson.
Sara: Ik lust geen vis.              Sara : Je n'aime pas le poisson.
Tom: De soep is hier lekker.         Tom : La soupe est bonne ici.
Sara: Oké, ik wil soep!              Sara : D'accord, je veux de la soupe !</pre>`,
    questions: [

      { type: "input", q: "Que signifie « Ik heb honger » (en français) ?", a: ["j'ai faim", "jai faim"], ph: "en français", exp: "Ik heb honger = J'ai faim." },
      { type: "qcm", q: "Sara aime-t-elle le poisson ?", opts: ["Non", "Oui", "Elle adore", "On ne sait pas"], a: 0, exp: "« Ik lust geen vis » : non, elle n'aime pas." },
      { type: "vf", q: "D'après Tom, la soupe est bonne (lekker) ici.", a: true, exp: "« De soep is hier lekker » : oui." },
      { type: "input", q: "Comment dit-on « bon, délicieux » en néerlandais ? ___", a: ["lekker"], ph: "un adjectif", exp: "lekker = bon/délicieux." }
    ],
    solution: `<p>Tom aime le poisson (Ik eet graag vis), mais Sara ne l'aime pas (Ik lust geen vis). Comme la soupe est délicieuse (lekker), Sara choisit la soupe.</p>
<pre class="pseudo">Ik lust ...        J'aime (manger) ...
Ik lust geen ...   Je n'aime pas ...
lekker             bon, délicieux
Ik heb honger      J'ai faim</pre>`
