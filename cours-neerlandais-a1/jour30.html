<script>
var DAY = {
  num: 30,
  title: "Bilan A1 : se présenter et échanger",
  subtitle: "Mettre en pratique tout le A1 : se présenter, poser des questions, échanger.",
  theory: `
<h3>1. Se présenter (zich voorstellen)</h3>
<pre class="pseudo">Hallo, ik heet ...        -> Bonjour, je m'appelle ...
Ik ben ... jaar oud.      -> J'ai ... ans.
Ik woon in ...            -> J'habite a ...
Ik kom uit ...            -> Je viens de ...
Ik werk / Ik studeer ...  -> Je travaille / J'etudie ...</pre>
<h3>2. Poser des questions à quelqu'un</h3>
<pre class="pseudo">Hoe heet je?       -> Comment t'appelles-tu ?
Hoe oud ben je?    -> Quel age as-tu ?
Waar woon je?      -> Ou habites-tu ?
Waar kom je vandaan? -> D'ou viens-tu ?
Wat doe je?        -> Que fais-tu (comme travail) ?</pre>
<h3>3. Un dialogue complet</h3>
<pre class="pseudo">- Hallo! Hoe heet je?        - Ik heet Sara. En jij?
- Ik heet Tom. Waar woon je? - Ik woon in Gent. En jij?
- Ik woon in Brussel.        - Wat doe je?
- Ik studeer. En jij?        - Ik werk in een winkel.</pre>
<p><em>Traduction : Bonjour ! Comment t'appelles-tu ? — Je m'appelle Sara. Et toi ? — Je m'appelle Tom. Où habites-tu ? — J'habite à Gand. Et toi ? — J'habite à Bruxelles. — Que fais-tu ? — J'étudie. Et toi ? — Je travaille dans un magasin.</em></p>
<h3>4. Les réflexes de grammaire à mobiliser</h3>
<pre class="pseudo">Conjugaison : ik heet, jij heet, hij heet (le -t tombe : Heet je?)
zijn/hebben : ik ben, ik heb
Negation : Ik heb geen broer. Ik werk niet.
Adjectif : een grote stad, het mooie huis
Questions : Waar woon je? Hoe heet je?</pre>
<div class="tip">Pour échanger, pensez à toujours renvoyer la question avec <strong>En jij?</strong> (Et toi ?) : c'est la clé d'une vraie conversation.</div>
<div class="warn">C'est le dernier jour du parcours A1 : ce bilan reprend tout. Si un point résiste, revoyez le jour correspondant (négation jour 12, questions jour 13, adjectif jour 14, heure jour 15).</div>`,
  exercises: [
    { type: "qcm", q: "Comment se présenter (dire son nom) ?", opts: ["Ik woon Sara", "Ik heet Sara", "Ik ben Sara jaar", "Ik kom Sara"], a: 1, exp: "Ik heet Sara : je m'appelle Sara." },
    { type: "qcm", q: "Comment demander l'âge de quelqu'un ?", opts: ["Waar oud ben je?", "Hoe oud ben je?", "Wat oud ben je?", "Wie oud ben je?"], a: 1, exp: "Hoe oud ben je? = Quel age as-tu ?" },
    { type: "qcm", q: "Comment dire « je viens de Belgique » ?", opts: ["Ik woon uit België", "Ik ben uit België", "Ik kom uit België", "Ik heet uit België"], a: 2, exp: "Ik kom uit België : je viens de Belgique." },
    { type: "qcm", q: "Que veut dire « En jij? » dans un dialogue ?", opts: ["Au revoir ?", "Et toi ?", "Merci ?", "Comment ?"], a: 1, exp: "En jij? = Et toi ? (pour renvoyer la question)." },
    { type: "qcm", q: "Comment demander « Où habites-tu ? »", opts: ["Wie woon je?", "Wat woon je?", "Waar woon je?", "Hoe woon je?"], a: 2, exp: "Waar woon je? = Ou habites-tu ?" },
    { type: "qcm", q: "Comment nier « J'ai un frère » (Ik heb een broer) ?", opts: ["Ik heb niet een broer", "Ik heb geen broer", "Ik heb broer niet", "Ik geen broer heb"], a: 1, exp: "een + nom -> geen : Ik heb geen broer." },
    { type: "vf", q: "« Ik kom uit ... » sert à dire d'où l'on vient.", a: true, exp: "Ik kom uit Frankrijk : je viens de France." },
    { type: "vf", q: "Dans « Heet je Tom? », le -t tombe car je suit le verbe.", a: true, exp: "Inversion avec je : le -t tombe (heet je)." },
    { type: "vf", q: "« Hoe oud ben je? » demande où l'on habite.", a: false, exp: "Faux : Hoe oud ben je? demande l'age ; ou = Waar woon je?" },
    { type: "input", q: "Vul in : Ik ___ Sara. (Je m'appelle Sara)", a: ["heet"], ph: "un verbe", exp: "Ik heet Sara : heten = s'appeler." },
    { type: "input", q: "Vul in : Ik ___ in Gent. (J'habite à Gand)", a: ["woon"], ph: "un verbe", exp: "Ik woon in Gent." },
    { type: "input", q: "Vul in : Ik ___ uit België. (Je viens de Belgique)", a: ["kom"], ph: "un verbe", exp: "Ik kom uit België." },
    { type: "input", q: "Vul in : Hoe ___ ben je? (Quel âge as-tu ?)", a: ["oud"], ph: "un mot", exp: "Hoe oud ben je? = Quel age as-tu ?" },
    { type: "input", q: "Vul in : ___ woon je? (Où habites-tu ?)", a: ["waar"], ph: "un mot interrogatif", exp: "waar = ou." },
    { type: "input", q: "Vul in : Ik heb ___ broer. (Je n'ai pas de frère)", a: ["geen"], ph: "geen ou niet", exp: "een + nom -> geen : geen broer." }
  ],
  final: {
    title: "Exercice final — Bilan A1",
    intro: `<p>Lisez ce petit dialogue de présentation, puis répondez.</p>
<pre class="pseudo">- Hallo! Hoe heet je?   - Ik heet Anna. Ik kom uit Nederland.
- Waar woon je nu?      - Ik woon nu in Antwerpen.
- Wat doe je?           - Ik studeer. Ik heb geen werk.</pre>
<p><em>Traduction : Bonjour ! Comment t'appelles-tu ? — Je m'appelle Anna. Je viens des Pays-Bas. Où habites-tu maintenant ? — J'habite maintenant à Anvers. Que fais-tu ? — J'étudie. Je n'ai pas de travail.</em></p>`,
    questions: [
      { type: "input", q: "Vul in : Ik ___ Anna. (Je m'appelle Anna)", a: ["heet"], ph: "un verbe", exp: "Ik heet Anna." },
      { type: "qcm", q: "D'où vient Anna ?", opts: ["De Belgique", "Des Pays-Bas", "De France", "d'Allemagne"], a: 1, exp: "Ik kom uit Nederland : des Pays-Bas." },
      { type: "input", q: "Vul in : Ik ___ uit Nederland. (Je viens de)", a: ["kom"], ph: "un verbe", exp: "Ik kom uit Nederland." },
      { type: "input", q: "Vul in : Ik heb ___ werk. (Je n'ai pas de travail)", a: ["geen"], ph: "geen ou niet", exp: "nom sans article -> geen werk." },
      { type: "vf", q: "« Wat doe je? » demande ce que l'on fait (travail/études).", a: true, exp: "Wat doe je? = Que fais-tu ?" }
    ],
    solution: `<p>Le bilan A1 en une carte :</p>
<pre class="pseudo">Se presenter : Ik heet... Ik ben ... jaar. Ik woon in... Ik kom uit...
Poser des questions : Hoe heet je? Hoe oud ben je? Waar woon je? Wat doe je?
Grammaire mobilisee : conjugaison, zijn/hebben, geen/niet, adjectif, questions
Echanger : renvoyer la question avec En jij?</pre>
<p>Félicitations : vous avez terminé le parcours A1 ! Vous savez vous présenter, poser des questions et échanger en néerlandais.</p>`
  }
};
</script>
