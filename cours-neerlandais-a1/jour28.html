<script>
var DAY = {
  num: 28,
  title: "Révisions de grammaire A1",
  subtitle: "Faire le point sur les grands points de grammaire du niveau A1.",
  theory: `
<h3>1. Les articles</h3>
<pre class="pseudo">de -> genre commun : de man, de vrouw, de auto
het -> genre neutre : het huis, het kind, het boek
een -> un/une (indefini) : een man, een huis</pre>
<h3>2. Le présent des verbes réguliers</h3>
<pre class="pseudo">ik werk           wij werken
jij werkt         jullie werken
hij/zij/het werkt zij werken</pre>
<p>Le -t tombe avec je/jij à l'inversion : <em>Werk je?</em> (mais <em>Werkt hij?</em>).</p>
<h3>3. Deux verbes essentiels : zijn et hebben</h3>
<pre class="pseudo">zijn (etre) : ik ben, jij bent, hij is, wij zijn, jullie zijn, zij zijn
hebben (avoir) : ik heb, jij hebt, hij heeft, wij hebben, jullie hebben, zij hebben</pre>
<h3>4. La négation</h3>
<pre class="pseudo">geen -> nie un nom indefini : Ik heb geen auto.
niet -> nie le reste (verbe, adjectif, lieu) : Ik werk niet.</pre>
<h3>5. Les questions</h3>
<pre class="pseudo">Fermee : verbe + sujet -> Woon je in Gent?
Ouverte : mot interrogatif + verbe + sujet -> Waar woon je?
Vraagwoorden : wie, wat, waar, wanneer, hoe, waarom, hoeveel</pre>
<h3>6. L'accord de l'adjectif</h3>
<pre class="pseudo">Devant le nom : + e (de grote auto, het grote huis, een grote auto)
Exception : een + het-mot -> pas de e (een groot huis)
Apres le verbe : jamais de e (Het huis is groot)</pre>
<div class="tip">L'ordre de base d'une phrase : SUJET + VERBE + reste. Le verbe conjugué reste toujours en deuxième position (Vandaag werk ik : le verbe reste 2e).</div>
<div class="warn">Pièges fréquents : half twee = 1h30 ; geen (pas niet een) ; le -t qui tombe avec je/jij inversés.</div>`,
  exercises: [
    { type: "qcm", q: "Quel est l'article de « huis » ?", opts: ["de", "het", "een uniquement", "aucun"], a: 1, exp: "huis est un het-mot : het huis." },
    { type: "qcm", q: "Comment dit-on « nous travaillons » (werken) ?", opts: ["wij werk", "wij werkt", "wij werken", "wij werke"], a: 2, exp: "Pluriel : infinitif -> wij werken." },
    { type: "qcm", q: "Comment nier « Ik heb een auto » ?", opts: ["Ik heb niet een auto", "Ik heb geen auto", "Ik heb auto niet", "Ik geen auto heb"], a: 1, exp: "een + nom -> geen : Ik heb geen auto." },
    { type: "qcm", q: "Comment dit-on « il est » (zijn) ?", opts: ["hij ben", "hij bent", "hij is", "hij zijn"], a: 2, exp: "zijn : hij is." },
    { type: "qcm", q: "Quel mot interrogatif signifie « où » ?", opts: ["wie", "wat", "waar", "hoe"], a: 2, exp: "waar = ou." },
    { type: "qcm", q: "Comment dit-on « une grande maison » (het huis) ?", opts: ["een grote huis", "een groot huis", "de groot huis", "een grootte huis"], a: 1, exp: "een + het-mot -> pas de e : een groot huis." },
    { type: "vf", q: "Avec ik, le verbe régulier prend le radical seul (ik werk).", a: true, exp: "ik + radical : ik werk." },
    { type: "vf", q: "« hebben » à la 3e personne du singulier est « hij heeft ».", a: true, exp: "hebben : hij heeft." },
    { type: "vf", q: "Devant un de-mot, l'adjectif ne prend jamais de -e.", a: false, exp: "Faux : devant un de-mot, l'adjectif prend + e : de grote auto." },
    { type: "input", q: "Vul in : ___ huis (l'article de huis)", a: ["het"], ph: "de ou het", exp: "huis est un het-mot : het huis." },
    { type: "input", q: "Vul in : Jij ___ (werken) hard.", a: ["werkt"], ph: "un verbe", exp: "jij werkt : radical + t." },
    { type: "input", q: "Vul in : Ik ___ (hebben) een fiets. (j'ai)", a: ["heb"], ph: "un verbe", exp: "hebben : ik heb." },
    { type: "input", q: "Vul in : Ik werk ___. (Je ne travaille pas)", a: ["niet"], ph: "geen ou niet", exp: "On nie le verbe avec niet." },
    { type: "input", q: "Vul in : ___ woon je? (Où habites-tu ?)", a: ["waar"], ph: "un mot interrogatif", exp: "waar = ou." },
    { type: "input", q: "Vul in : de ___ auto (grande — de-mot)", a: ["grote"], ph: "l'adjectif", exp: "de-mot -> + e : de grote auto." }
  ],
  final: {
    title: "Exercice final — Révisions A1",
    intro: `<p>Lisez ce petit texte, puis répondez aux questions de révision.</p>
<pre class="pseudo">Ik heet Tom. Ik woon in Gent. Ik heb geen auto,
maar ik heb een grote fiets. Ik werk niet vandaag.
Waar woon jij?</pre>
<p><em>Traduction : Je m'appelle Tom. J'habite à Gand. Je n'ai pas de voiture, mais j'ai un grand vélo. Je ne travaille pas aujourd'hui. Où habites-tu ?</em></p>`,
    questions: [
      { type: "input", q: "Vul in : Ik ___ (hebben) een fiets. (j'ai)", a: ["heb"], ph: "un verbe", exp: "hebben : ik heb." },
      { type: "input", q: "Vul in : Ik heb ___ auto. (Je n'ai pas de voiture)", a: ["geen"], ph: "geen ou niet", exp: "een + nom -> geen." },
      { type: "qcm", q: "Comment dit-on « nous sommes » (zijn) ?", opts: ["wij ben", "wij bent", "wij zijn", "wij is"], a: 2, exp: "zijn : wij zijn." },
      { type: "input", q: "Vul in : een ___ fiets (grand — de-mot avec een)", a: ["grote"], ph: "l'adjectif", exp: "de-mot avec een -> + e : een grote fiets." },
      { type: "vf", q: "Dans « Waar woon je? », waar est un mot interrogatif (où).", a: true, exp: "waar = ou ; le verbe reste en 2e position." }
    ],
    solution: `<p>Les points clés du A1 en un coup d'œil :</p>
<pre class="pseudo">Articles : de / het / een
Verbes : ik werk, jij werkt, wij werken (le -t tombe : Werk je?)
zijn/hebben : ik ben / ik heb ; hij is / hij heeft
Negation : geen (nom indefini) vs niet (le reste)
Questions : Woon je...? / Waar woon je?
Adjectif : + e devant le nom, sauf een + het-mot</pre>
<p>Si ces réflexes sont acquis, vous maîtrisez l'essentiel de la grammaire A1.</p>`
  }
};
