  title: "Les nombres et l'âge",
  subtitle: "Compter jusqu'à 100 et dire son âge.",
  theory: `
<h3>1. Les nombres de 0 à 20</h3>
<pre class="pseudo">0 nul      1 een      2 twee     3 drie     4 vier
5 vijf     6 zes      7 zeven    8 acht     9 negen
10 tien    11 elf     12 twaalf  13 dertien 14 veertien
15 vijftien 16 zestien 17 zeventien 18 achttien 19 negentien 20 twintig</pre>
<div class="tip">De 13 à 19, on ajoute <strong>-tien</strong> (comme « -ze » en français) : veertien (14), zestien (16). Attention : dertien (13) et veertien (14) modifient un peu drie et vier.</div>
<h3>2. Les dizaines</h3>
<pre class="pseudo">10 tien     20 twintig   30 dertig    40 veertig   50 vijftig
60 zestig   70 zeventig  80 tachtig   90 negentig  100 honderd</pre>
<div class="warn">Attention à <strong>tachtig</strong> (80) : il commence par « t » (pas « acht-tig »). Et <strong>veertig</strong> (40) s'écrit avec « veer », pas « vier ».</div>
<h3>3. Les nombres composés : l'unité AVANT la dizaine !</h3>
<p>Voici LA grande particularité néerlandaise. Pour 21, 34, 78..., on dit l'<strong>unité d'abord</strong>, puis <strong>en</strong> (« et »), puis la dizaine — l'inverse du français :</p>
<pre class="pseudo">21  eenentwintig     -> « un-et-vingt »  (een + en + twintig)
34  vierendertig     -> « quatre-et-trente »
56  zesenvijftig     -> « six-et-cinquante »
78  achtenzeventig   -> « huit-et-septante »</pre>
<div class="warn">Ne dites jamais « twintig-een » ! L'ordre néerlandais est : <strong>unité + en + dizaine</strong>, écrit en un seul mot. C'est déroutant au début, mais ça devient vite automatique.</div>
<h3>4. Demander et dire l'âge</h3>
<p>Pour l'âge, le néerlandais utilise le verbe <strong>zijn</strong> (être), suivi du nombre et du mot <strong>jaar</strong> (an) :</p>
<pre class="pseudo">Hoe oud ben je?        -> Quel âge as-tu ?      (littéralement « comme vieux es-tu ? »)
Ik ben twintig jaar.   -> J'ai vingt ans.       (« je suis vingt ans »)
Ik ben 20.             -> J'ai 20 ans.          (jaar peut être sous-entendu)
Hij is vijf jaar oud.  -> Il a cinq ans.</pre>
<div class="tip">Différence avec le français : on dit « je SUIS vingt ans » (Ik BEN twintig), avec le verbe être, pas avoir. Le mot <strong>oud</strong> signifie « vieux / âgé ».</div>
<h3>5. Quelques exemples</h3>
<pre class="pseudo">Ik ben eenentwintig jaar.   -> J'ai 21 ans.
Zij is negenentwintig.      -> Elle a 29 ans.
Wij zijn allebei dertig.    -> Nous avons tous les deux 30 ans.</pre>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « 7 » ?", opts: ["zes", "zeven", "acht", "negen"], a: 1, exp: "7 = zeven." },
    { type: "qcm", q: "Comment dit-on « 12 » ?", opts: ["twaalf", "twintig", "tien", "twee"], a: 0, exp: "12 = twaalf." },
    { type: "qcm", q: "Comment dit-on « 40 » ?", opts: ["vier", "viertig", "veertig", "veertien"], a: 2, exp: "40 = veertig (attention : veer, pas vier)." },
    { type: "qcm", q: "Comment dit-on « 21 » ?", opts: ["twintigeen", "eenentwintig", "twintig-een", "eentwintig"], a: 1, exp: "Unité d'abord : een + en + twintig = eenentwintig." },
    { type: "qcm", q: "Comment demande-t-on l'âge de quelqu'un ?", opts: ["Hoe heet je?", "Hoe oud ben je?", "Wie ben je?", "Hoeveel ben je?"], a: 1, exp: "Hoe oud ben je ? = Quel âge as-tu ?" },
    { type: "qcm", q: "Quel verbe utilise-t-on pour dire son âge ?", opts: ["hebben (avoir)", "zijn (être)", "heten", "wonen"], a: 1, exp: "On dit « ik ben 20 » (je suis 20), avec zijn." },
    { type: "vf", q: "En néerlandais, on dit l'unité AVANT la dizaine (eenentwintig = 21).", a: true, exp: "C'est l'ordre inverse du français : unité + en + dizaine." },
    { type: "vf", q: "Le mot <code>jaar</code> signifie « an / année ».", a: true, exp: "Ik ben twintig jaar = j'ai vingt ans." },
    { type: "vf", q: "« 80 » se dit <code>achttig</code>.", a: false, exp: "Faux : 80 = tachtig (avec un t initial)." },
    { type: "input", q: "Vul in : le nombre « 5 » s'écrit ___.", a: ["vijf"], ph: "un mot", exp: "5 = vijf." },
    { type: "input", q: "Vul in : le nombre « 10 » s'écrit ___.", a: ["tien"], ph: "un mot", exp: "10 = tien." },
    { type: "input", q: "Vul in : le nombre « 20 » s'écrit ___.", a: ["twintig"], ph: "un mot", exp: "20 = twintig." },
    { type: "input", q: "Vul in : le nombre « 34 » s'écrit ___.", a: ["vierendertig"], ph: "un mot", exp: "vier + en + dertig = vierendertig." },
    { type: "input", q: "Vul in : « J'ai vingt ans » : Ik ___ twintig jaar.", a: ["ben"], ph: "un verbe", exp: "On emploie zijn : Ik ben twintig jaar." },
    { type: "input", q: "Vul in : le nombre « 100 » s'écrit ___.", a: ["honderd"], ph: "un mot", exp: "100 = honderd." }
  ],
  final: {
    title: "Exercice final — Compter et donner son âge",
    intro: `<p>Lisez ce petit texte, puis répondez aux questions.</p>
<pre class="pseudo">Ik heet Bram. Ik ben vijfentwintig jaar.
Mijn zus is eenentwintig. Wij wonen in Gent.</pre>
<p><em>Traduction : Je m'appelle Bram. J'ai vingt-cinq ans. Ma sœur a vingt et un ans. Nous habitons à Gand.</em></p>`,
    questions: [
      { type: "qcm", q: "Quel âge a Bram ?", opts: ["21 ans", "25 ans", "35 ans", "52 ans"], a: 1, exp: "vijfentwintig = vijf + en + twintig = 25." },
      { type: "input", q: "Vul in : en chiffres, l'âge de la sœur (eenentwintig) est ___.", a: ["21"], ph: "un nombre", exp: "eenentwintig = 21." },
      { type: "qcm", q: "Comment est construit le mot <code>vijfentwintig</code> ?", opts: ["vingt puis cinq", "cinq + en + vingt (unité d'abord)", "cinq fois vingt", "un nombre au hasard"], a: 1, exp: "vijf (5) + en + twintig (20) = 25, unité en premier." },
      { type: "input", q: "Vul in : « J'ai 25 ans » : Ik ben ___ jaar.", a: ["vijfentwintig"], ph: "un nombre en lettres", exp: "Ik ben vijfentwintig jaar." },
      { type: "vf", q: "Pour dire son âge, Bram utilise le verbe zijn (ben).", a: true, exp: "Ik ben vijfentwintig jaar : on emploie zijn, pas hebben." }
    ],
    solution: `<p>Analyse des nombres composés :</p>
<pre class="pseudo">vijfentwintig  = vijf (5) + en + twintig (20)  = 25
eenentwintig   = een (1) + en + twintig (20)   = 21</pre>
<p>Retenez les deux réflexes du jour : <strong>l'unité se dit avant la dizaine</strong> (avec « en » au milieu), et <strong>on emploie zijn</strong> (être) pour l'âge : Ik ben ... jaar.</p>`
  }
};
