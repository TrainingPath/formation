<script>
var DAY = {
  num: 1,
  title: "L'alphabet et la prononciation",
  subtitle: "Écouter, reconnaître et prononcer les sons du néerlandais.",
  theory: `
<h3>1. Un alphabet connu, des sons nouveaux</h3>
<p>Le néerlandais s'écrit avec les <strong>mêmes 26 lettres</strong> que le français (de <em>a</em> à <em>z</em>). Bonne nouvelle : rien de nouveau à mémoriser pour l'écriture. La difficulté est ailleurs : plusieurs lettres se <strong>prononcent autrement</strong> qu'en français. Aujourd'hui, on apprend à reconnaître les sons, pas à parler parfaitement : cela viendra avec la pratique.</p>
<p>Un mot de vocabulaire utile tout de suite : <strong>een klinker</strong> = une voyelle (a, e, i, o, u), et <strong>een medeklinker</strong> = une consonne (b, c, d, f...). On dira souvent « voyelle longue » ou « voyelle courte » : gardez ces deux mots en tête.</p>
<h3>2. Voyelles courtes et voyelles longues</h3>
<p>En néerlandais, une même voyelle peut être <strong>courte</strong> (brève) ou <strong>longue</strong> (tenue plus longtemps). La voyelle <strong>doublée</strong> se prononce toujours longue :</p>
<pre class="pseudo">Courte              Longue (doublée)
man   (homme)       maan   (lune)      -> le aa dure plus longtemps
bel   (sonnette)    beel-...            -> ee comme dans « nez » tenu
bos   (bois)        boos   (fâché)      -> oo long et fermé
bus   (bus)         buur   (voisin)     -> uu, lèvres arrondies</pre>
<div class="tip">Astuce : dans <strong>aa, ee, oo, uu</strong>, la voyelle est toujours longue. Tenez le son un petit peu plus longtemps que d'habitude, comme si vous chantiez la note.</div>
<h3>3. Les sons vraiment nouveaux</h3>
<p>Voici les combinaisons qui n'existent pas ou peu en français. Répétez-les à voix haute :</p>
<pre class="pseudo">ij / ei   ->  proche de « eille » : mijn (mon), trein (train)
ui        ->  son unique, entre « eu » et « ui » : huis (maison)
oe        ->  se lit « ou » : boek (livre), goed (bien)
eu        ->  comme « eu » de « peu » : deur (porte)
ie        ->  se lit « i » long : niet (ne pas), vier (quatre)
au / ou   ->  se lit « aou » : koud (froid), gauw (vite)</pre>
<div class="warn">Piège classique pour un francophone : <strong>oe</strong> ne se lit PAS « eu » mais « ou ». Ainsi <em>boek</em> se dit « bouk » et signifie « livre ».</div>
<h3>4. Les consonnes qui surprennent</h3>
<pre class="pseudo">g / ch  ->  son raclé au fond de la gorge : goed (bien), acht (huit)
sch     ->  s + le son raclé : school (école), Scheveningen
w       ->  comme un v doux : water (eau), wonen (habiter)
v       ->  entre f et v : vader (père), vijf (cinq)
j       ->  se lit « y » : ja (oui), jij (tu), jaar (année)
r       ->  souvent roulé ou guttural selon les régions</pre>
<div class="tip">Le fameux <strong>g</strong> néerlandais se racle au fond de la gorge, comme la jota espagnole. Ne vous découragez pas : même approximatif, on vous comprendra.</div>
<h3>5. Premiers mots à lire à voix haute</h3>
<pre class="pseudo">ja      -> oui              nee     -> non
goed    -> bien / bon       dank je -> merci
huis    -> maison           school  -> école
water   -> eau              boek    -> livre</pre>
<p>Lire à voix haute chaque jour est le meilleur entraînement. Ne cherchez pas la perfection : cherchez la régularité.</p>`,
  exercises: [
    { type: "qcm", q: "Combien de lettres compte l'alphabet néerlandais ?", opts: ["24", "26", "28", "30"], a: 1, exp: "Les mêmes 26 lettres que le français, de a à z." },
    { type: "qcm", q: "Comment se prononce le mot <code>boek</code> (livre) ?", opts: ["« beuk »", "« bouk »", "« boëk »", "« buk »"], a: 1, exp: "La combinaison oe se lit « ou » : boek = « bouk »." },
    { type: "qcm", q: "Dans <code>maan</code> (lune), le son <code>aa</code> est…", opts: ["une voyelle courte", "une voyelle longue", "une consonne", "muet"], a: 1, exp: "Une voyelle doublée (aa) est toujours longue." },
    { type: "qcm", q: "Comment se lit la lettre <code>j</code> dans <code>ja</code> (oui) ?", opts: ["« j » comme dans jour", "« y » comme dans yaourt", "« g » dur", "elle est muette"], a: 1, exp: "En néerlandais, j se prononce « y » : ja = « ya »." },
    { type: "qcm", q: "Quel mot contient le son raclé au fond de la gorge ?", opts: ["water", "goed", "boek", "nee"], a: 1, exp: "Le g de goed est ce fameux son guttural néerlandais." },
    { type: "qcm", q: "Comment se prononce le <code>w</code> de <code>water</code> (eau) ?", opts: ["comme un v doux", "comme « ou »", "comme un f", "il est muet"], a: 0, exp: "Le w néerlandais ressemble à un v légèrement adouci." },
    { type: "vf", q: "En néerlandais, la combinaison <code>oe</code> se prononce « ou ».", a: true, exp: "Exactement : boek = « bouk », goed = « goud »." },
    { type: "vf", q: "Une voyelle doublée comme <code>oo</code> se prononce courte.", a: false, exp: "Au contraire : la voyelle doublée est toujours longue (boos = fâché)." },
    { type: "vf", q: "Le mot <code>ja</code> signifie « non » en néerlandais.", a: false, exp: "ja = oui ; nee = non. Ne les confondez pas !" },
    { type: "input", q: "Vul in : le mot néerlandais pour « oui » s'écrit ___.", a: ["ja"], ph: "un mot", exp: "ja = oui (prononcé « ya »)." },
    { type: "input", q: "Vul in : le mot néerlandais pour « non » s'écrit ___.", a: ["nee"], ph: "un mot", exp: "nee = non." },
    { type: "input", q: "Vul in : le mot pour « maison » (prononcé « heus ») s'écrit ___.", a: ["huis"], ph: "un mot", exp: "huis = maison ; la combinaison ui est un son typiquement néerlandais." },
    { type: "input", q: "Vul in : le mot pour « livre » (prononcé « bouk ») s'écrit ___.", a: ["boek"], ph: "un mot", exp: "boek = livre ; oe se lit « ou »." },
    { type: "input", q: "Vul in : le mot pour « eau » (prononcé « vateur ») s'écrit ___.", a: ["water"], ph: "un mot", exp: "water = eau ; le w se dit comme un v doux." },
    { type: "input", q: "Vul in : le mot pour « école » (prononcé « srool ») s'écrit ___.", a: ["school"], ph: "un mot", exp: "school = école ; sch = s + son raclé." }
  ],
  final: {
    title: "Exercice final — Lire ses premiers mots",
    intro: `<p>Voici huit mots courants. Pour chacun, retrouvez comment il se prononce ou ce qu'il signifie. Lisez-les d'abord à voix haute avant de répondre.</p>
<pre class="pseudo">ja = oui        nee = non        goed = bien
huis = maison   boek = livre     water = eau
vijf = cinq     school = école</pre>`,
    questions: [
      { type: "qcm", q: "Comment se prononce <code>huis</code> ?", opts: ["« uis » comme en français", "« heus », avec le son ui typique", "« ouis »", "« hi »"], a: 1, exp: "La combinaison ui est un son unique, proche de « eu-i » prononcé d'un coup." },
      { type: "qcm", q: "Le mot <code>vijf</code> (cinq) commence par un son…", opts: ["entre f et v", "« vi » clair", "« w »", "muet"], a: 0, exp: "Le v néerlandais est un son entre f et v ; ij se lit « eille »." },
      { type: "input", q: "Vul in : le mot pour « bien / bon » s'écrit ___.", a: ["goed"], ph: "un mot", exp: "goed, avec le fameux g raclé." },
      { type: "vf", q: "Le mot <code>school</code> se prononce « chool » avec le son raclé après le s.", a: true, exp: "sch = s suivi du son guttural : « s-rool »." },
      { type: "input", q: "Vul in : le mot pour « eau » s'écrit ___.", a: ["water"], ph: "un mot", exp: "water = eau." }
    ],
    solution: `<p>Récapitulatif des prononciations clés :</p>
<pre class="pseudo">huis   -> « heus »  (ui = son unique)
vijf   -> « veillf » (v doux, ij = « eille »)
goed   -> « goud »  (g raclé, oe = « ou »)
school -> « s-rool » (sch = s + son raclé)
water  -> « vateur » (w = v doux)</pre>
<p>Retenez surtout deux réflexes : <strong>oe = « ou »</strong> et <strong>la voyelle doublée est longue</strong>. Le reste s'installe avec la répétition à voix haute.</p>`
  }
};
</script>
