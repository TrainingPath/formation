<script>
var DAY = {
  num: 29,
  title: "Compréhension : un petit texte simple",
  subtitle: "Lire un court texte néerlandais et en comprendre l'essentiel.",
  theory: `
<h3>1. Le texte à lire</h3>
<p>Lisez ce petit texte plusieurs fois, puis regardez la traduction :</p>
<pre class="pseudo">Hallo! Ik heet Lisa. Ik ben negentien jaar oud.
Ik woon in Antwerpen met mijn familie.
Ik heb een broer en een zus.
Ik studeer aan de universiteit.
's Morgens ga ik naar de les.
's Avonds werk ik in een restaurant.
Ik hou van muziek en ik speel gitaar.
Ik heb geen auto, maar ik heb een fiets.</pre>
<h3>2. La traduction</h3>
<p><em>Bonjour ! Je m'appelle Lisa. J'ai dix-neuf ans. J'habite à Anvers avec ma famille. J'ai un frère et une sœur. J'étudie à l'université. Le matin, je vais en cours. Le soir, je travaille dans un restaurant. J'aime la musique et je joue de la guitare. Je n'ai pas de voiture, mais j'ai un vélo.</em></p>
<h3>3. Le vocabulaire clé</h3>
<pre class="pseudo">heten     -> s'appeler        jaar oud  -> ans (age)
wonen     -> habiter          familie   -> famille
broer     -> frere            zus       -> soeur
studeren  -> etudier          universiteit -> universite
de les    -> le cours         werken    -> travailler
houden van -> aimer           spelen    -> jouer</pre>
<div class="tip">Astuce de lecture : ne cherchez pas à comprendre chaque mot. Repérez d'abord les mots que vous connaissez (prénoms, chiffres, verbes) pour saisir l'idée générale.</div>
<h3>4. Les questions de compréhension</h3>
<p>Après une lecture, on se pose des questions simples : <em>Wie? Waar? Wat? Hoe oud?</em> (Qui ? Où ? Quoi ? Quel âge ?). Les exercices ci-dessous portent tous sur le texte de Lisa.</p>
<div class="warn">Attention aux détails : Lisa a un vélo mais PAS de voiture. Bien lire la négation (geen) est essentiel pour répondre juste.</div>`,
  exercises: [
    { type: "qcm", q: "Comment s'appelle la personne du texte ?", opts: ["Sara", "Lisa", "Tom", "Anna"], a: 1, exp: "Ik heet Lisa : elle s'appelle Lisa." },
    { type: "qcm", q: "Quel âge a Lisa ?", opts: ["16 ans", "18 ans", "19 ans", "20 ans"], a: 2, exp: "Ik ben negentien jaar oud : negentien = 19." },
    { type: "qcm", q: "Où habite Lisa ?", opts: ["Gent", "Brussel", "Antwerpen", "Amsterdam"], a: 2, exp: "Ik woon in Antwerpen." },
    { type: "qcm", q: "Que fait Lisa le soir ('s avonds) ?", opts: ["Elle va en cours", "Elle travaille dans un restaurant", "Elle dort", "Elle joue au football"], a: 1, exp: "'s Avonds werk ik in een restaurant." },
    { type: "qcm", q: "De quel instrument Lisa joue-t-elle ?", opts: ["Du piano", "De la guitare", "Du violon", "De la flûte"], a: 1, exp: "Ik speel gitaar : elle joue de la guitare." },
    { type: "qcm", q: "Combien de frères et sœurs a Lisa ?", opts: ["Un frère seulement", "Une sœur seulement", "Un frère et une sœur", "Deux frères"], a: 2, exp: "Ik heb een broer en een zus." },
    { type: "vf", q: "Lisa étudie à l'université.", a: true, exp: "Ik studeer aan de universiteit : c'est vrai." },
    { type: "vf", q: "Lisa a une voiture.", a: false, exp: "Faux : Ik heb geen auto (elle n'a PAS de voiture), mais elle a un vélo." },
    { type: "vf", q: "Le matin, Lisa va en cours.", a: true, exp: "'s Morgens ga ik naar de les : le matin, elle va en cours." },
    { type: "input", q: "Vul in : Lisa woont in ___. (la ville)", a: ["antwerpen"], ph: "une ville", exp: "Ik woon in Antwerpen." },
    { type: "input", q: "Vul in : Lisa is ___ jaar oud. (l'âge en néerlandais)", a: ["negentien"], ph: "un nombre", exp: "negentien = 19." },
    { type: "input", q: "Vul in : Lisa speelt ___. (l'instrument)", a: ["gitaar"], ph: "un instrument", exp: "Ik speel gitaar." },
    { type: "input", q: "Vul in : Lisa heeft geen ___, maar wel een fiets. (le véhicule)", a: ["auto"], ph: "un véhicule", exp: "Ik heb geen auto, maar ik heb een fiets." },
    { type: "input", q: "Vul in : 's Avonds ___ Lisa in een restaurant. (verbe travailler)", a: ["werkt"], ph: "un verbe", exp: "'s Avonds werkt zij : hij/zij werkt." },
    { type: "input", q: "Vul in : Lisa studeert aan de ___. (le lieu)", a: ["universiteit"], ph: "un lieu", exp: "Ik studeer aan de universiteit." }
  ],
  final: {
    title: "Exercice final — Bien comprendre le texte",
    intro: `<p>Relisez cet extrait du texte de Lisa, puis répondez.</p>
<pre class="pseudo">Ik hou van muziek en ik speel gitaar.
Ik heb geen auto, maar ik heb een fiets.
's Morgens ga ik naar de les.</pre>
<p><em>Traduction : J'aime la musique et je joue de la guitare. Je n'ai pas de voiture, mais j'ai un vélo. Le matin, je vais en cours.</em></p>`,
    questions: [
      { type: "qcm", q: "Qu'est-ce que Lisa aime ?", opts: ["Le sport", "La musique", "La cuisine", "Le cinéma"], a: 1, exp: "Ik hou van muziek : elle aime la musique." },
      { type: "input", q: "Vul in : Lisa heeft geen ___. (le véhicule qu'elle n'a pas)", a: ["auto"], ph: "un véhicule", exp: "Ik heb geen auto." },
      { type: "vf", q: "Lisa a un vélo.", a: true, exp: "maar ik heb een fiets : elle a un vélo." },
      { type: "qcm", q: "Quand Lisa va-t-elle en cours ?", opts: ["Le soir", "L'après-midi", "Le matin", "La nuit"], a: 2, exp: "'s Morgens ga ik naar de les : le matin." },
      { type: "input", q: "Vul in : Lisa speelt ___. (l'instrument)", a: ["gitaar"], ph: "un instrument", exp: "Ik speel gitaar." }
    ],
    solution: `<p>Ce qu'il fallait retenir du texte :</p>
<pre class="pseudo">Lisa, 19 jaar, woont in Antwerpen.
Familie : een broer + een zus.
Studeert aan de universiteit.
's Morgens : de les.  's Avonds : restaurant.
Muziek + gitaar.  Geen auto, wel een fiets.</pre>
<p>Stratégie de lecture : repérer <strong>qui</strong>, <strong>où</strong>, <strong>quoi</strong>, et bien lire les <strong>négations</strong> (geen auto = pas de voiture).</p>`
  }
