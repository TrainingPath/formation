<script>
var DAY = {
  num: 12,
  title: "La négation : niet et geen",
  subtitle: "Dire non, ne pas, aucun : choisir entre niet et geen.",
  theory: `
<h3>1. Deux mots pour la négation</h3>
<p>En néerlandais, il existe deux façons principales de nier : <strong>niet</strong> (ne... pas) et <strong>geen</strong> (ne... pas de / aucun). Le choix dépend de ce que l'on nie.</p>
<pre class="pseudo">niet  -> nie... pas (nie un verbe, un adjectif, un nom precis)
geen  -> pas de / aucun (nie un nom indefini, sans article)</pre>
<h3>2. Geen : devant un nom indéfini</h3>
<p>On utilise <strong>geen</strong> pour nier un nom introduit par <em>een</em> (un/une) ou sans article (pluriel indéfini) :</p>
<pre class="pseudo">Ik heb een auto.   -> Ik heb geen auto.   (Je n'ai pas de voiture.)
Ik drink koffie.   -> Ik drink geen koffie. (Je ne bois pas de cafe.)
Wij hebben kinderen -> Wij hebben geen kinderen. (Nous n'avons pas d'enfants.)</pre>
<div class="tip">Astuce : si la phrase positive contient <em>een</em> ou un nom sans article, la négation se fait avec <strong>geen</strong> (jamais niet een).</div>
<h3>3. Niet : dans tous les autres cas</h3>
<p>On utilise <strong>niet</strong> pour nier un verbe, un adjectif, un adverbe, ou un nom précis (avec <em>de</em>, <em>het</em>, un possessif, un nom propre) :</p>
<pre class="pseudo">Ik werk.          -> Ik werk niet.          (Je ne travaille pas.)
Het is mooi.      -> Het is niet mooi.      (Ce n'est pas beau.)
Ik ken de man.    -> Ik ken de man niet.    (Je ne connais pas l'homme.)
Ik woon in Gent.  -> Ik woon niet in Gent.  (Je n'habite pas a Gand.)</pre>
<h3>4. La place de niet</h3>
<p>En général, <strong>niet</strong> se place à la fin de la phrase, mais avant un adjectif, un complément de lieu ou une préposition :</p>
<pre class="pseudo">Ik ken hem niet.            (Je ne le connais pas.)  -> a la fin
Het huis is niet groot.     (La maison n'est pas grande.) -> avant l'adjectif
Ik ga niet naar school.     (Je ne vais pas a l'ecole.) -> avant le lieu</pre>
<div class="warn">Ne dites jamais niet een. Pour nier een + nom, on fusionne toujours en geen : Ik heb geen tijd (Je n'ai pas le temps).</div>
<h3>5. Résumé</h3>
<pre class="pseudo">geen -> nom indefini (een / sans article) : geen auto, geen koffie
niet -> verbe, adjectif, lieu, nom defini : werk niet, niet mooi, de man niet</pre>`,
  exercises: [
    { type: "qcm", q: "Quel mot nie un nom indéfini (avec een ou sans article) ?", opts: ["niet", "geen", "nee", "nooit"], a: 1, exp: "geen s'emploie devant un nom indefini : geen auto." },
    { type: "qcm", q: "Comment nier « Ik heb een fiets » (J'ai un vélo) ?", opts: ["Ik heb niet een fiets", "Ik heb niet fiets", "Ik heb geen fiets", "Ik geen heb fiets"], a: 2, exp: "een + nom -> geen : Ik heb geen fiets." },
    { type: "qcm", q: "Comment nier « Ik werk » (Je travaille) ?", opts: ["Ik werk geen", "Ik werk niet", "Ik geen werk", "Ik niet werk"], a: 1, exp: "On nie un verbe avec niet, place a la fin : Ik werk niet." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Ik heb niet een auto", "Ik heb geen auto", "Ik heb auto niet", "Ik geen auto heb"], a: 1, exp: "een auto -> geen auto ; jamais niet een." },
    { type: "qcm", q: "Comment nier « Het is mooi » (C'est beau) ?", opts: ["Het is geen mooi", "Het geen is mooi", "Het is niet mooi", "Het is mooi geen"], a: 2, exp: "On nie un adjectif avec niet, place avant l'adjectif : Het is niet mooi." },
    { type: "qcm", q: "Où place-t-on niet devant un adjectif ?", opts: ["Après l'adjectif", "Avant l'adjectif", "Au début de la phrase", "On ne peut pas"], a: 1, exp: "niet se place avant l'adjectif : niet groot, niet mooi." },
    { type: "vf", q: "On utilise geen pour nier un nom introduit par een.", a: true, exp: "een + nom -> geen : Ik heb geen tijd." },
    { type: "vf", q: "La forme « niet een auto » est correcte en néerlandais.", a: false, exp: "Faux : een + nom se nie toujours avec geen -> geen auto." },
    { type: "vf", q: "On nie un verbe avec niet.", a: true, exp: "Ik werk niet : le verbe se nie avec niet." },
    { type: "input", q: "Vul in : Ik heb ___ auto. (Je n'ai pas de voiture)", a: ["geen"], ph: "geen ou niet", exp: "een auto -> geen auto." },
    { type: "input", q: "Vul in : Ik werk ___. (Je ne travaille pas)", a: ["niet"], ph: "geen ou niet", exp: "On nie le verbe avec niet." },
    { type: "input", q: "Vul in : Wij hebben ___ kinderen. (pas d'enfants)", a: ["geen"], ph: "geen ou niet", exp: "Nom indefini au pluriel -> geen." },
    { type: "input", q: "Vul in : Het is ___ mooi. (Ce n'est pas beau)", a: ["niet"], ph: "geen ou niet", exp: "On nie l'adjectif avec niet." },
    { type: "input", q: "Vul in : Ik drink ___ koffie. (Je ne bois pas de café)", a: ["geen"], ph: "geen ou niet", exp: "Nom sans article -> geen koffie." },
    { type: "input", q: "Vul in : Ik ken de man ___. (Je ne connais pas l'homme)", a: ["niet"], ph: "geen ou niet", exp: "Nom defini (de man) -> niet, place a la fin." }
  ],
  final: {
    title: "Exercice final — Nier correctement",
    intro: `<p>Lisez ce petit texte, puis répondez.</p>
<pre class="pseudo">Ik heb geen auto. Ik werk niet vandaag.
Ik drink geen koffie, maar ik drink thee.
Het huis is niet groot.</pre>
<p><em>Traduction : Je n'ai pas de voiture. Je ne travaille pas aujourd'hui. Je ne bois pas de café, mais je bois du thé. La maison n'est pas grande.</em></p>`,
    questions: [
      { type: "input", q: "Vul in : Ik heb ___ tijd. (Je n'ai pas le temps)", a: ["geen"], ph: "geen ou niet", exp: "een tijd -> geen tijd." },
      { type: "input", q: "Vul in : Zij werkt ___. (Elle ne travaille pas)", a: ["niet"], ph: "geen ou niet", exp: "On nie le verbe avec niet." },
      { type: "qcm", q: "Comment nier « Ik ga naar school » ?", opts: ["Ik ga geen naar school", "Ik ga niet naar school", "Ik ga naar school geen", "Ik geen ga naar school"], a: 1, exp: "Complement de lieu -> niet, place avant le lieu." },
      { type: "input", q: "Vul in : Het is ___ koud. (Il ne fait pas froid)", a: ["niet"], ph: "geen ou niet", exp: "On nie l'adjectif avec niet." },
      { type: "vf", q: "Dans « Ik heb geen kinderen », geen est correct car kinderen est un nom indéfini.", a: true, exp: "Nom sans article -> geen." }
    ],
    solution: `<p>La règle en une image :</p>
<pre class="pseudo">geen -> nie un nom indefini : geen auto, geen koffie, geen tijd
niet -> nie le reste (verbe, adjectif, lieu, nom defini) :
        werk niet, niet mooi, niet naar school, de man niet</pre>
<p>Réflexe : y a-t-il un <strong>een</strong> ou un nom sans article ? Alors <strong>geen</strong>. Sinon, <strong>niet</strong>.</p>`
  }
};
</script>
