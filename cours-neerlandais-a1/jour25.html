<script>
var DAY = {
  num: 25,
  title: "Faire des courses, les prix",
  subtitle: "Acheter, demander le prix et payer en néerlandais.",
  theory: `
<h3>1. Le vocabulaire du magasin — de winkel</h3>
<pre class="pseudo">de winkel     le magasin      de markt      le marché
kopen         acheter         betalen       payer
de prijs      le prix         het geld      l'argent
duur          cher            goedkoop      bon marché
de euro       l'euro          de cent       le centime</pre>
<h3>2. Demander le prix</h3>
<pre class="pseudo">Hoeveel kost het?          Combien ça coûte ?
Wat kost dit brood?        Combien coûte ce pain ?
Dat kost twee euro.        Ça coûte deux euros.
Het is te duur.            C'est trop cher.</pre>
<div class="tip">Le verbe <strong>kosten</strong> (coûter) : « Wat kost het? » (Combien ça coûte ?), « Het kost drie euro. » (Ça coûte trois euros.)</div>
<h3>3. Dialogue type au magasin</h3>
<pre class="pseudo">Verkoper: Kan ik u helpen?        Vendeur : Puis-je vous aider ?
Klant: Ik wil graag een brood.    Client : Je voudrais un pain.
Verkoper: Anders nog iets?        Vendeur : Autre chose ?
Klant: Nee, dank u. Hoeveel is het?  Client : Non, merci. Combien ça fait ?
Verkoper: Dat is drie euro vijftig.  Vendeur : Ça fait trois euros cinquante.</pre>
<h3>4. Payer et les quantités</h3>
<pre class="pseudo">Ik betaal met de kaart.    Je paie par carte.
Ik betaal contant.         Je paie en espèces.
een kilo appels            un kilo de pommes
een fles melk              une bouteille de lait
Alstublieft.               Voici / S'il vous plaît (en tendant qqch)</pre>
<div class="warn">Poli : à un inconnu on utilise <strong>u</strong> (vous) et <strong>alstublieft</strong> ; à un ami, <strong>je/jij</strong> et <strong>alsjeblieft</strong>.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie « kopen » ?", opts: ["acheter", "payer", "vendre", "coûter"], a: 0, exp: "kopen = acheter ; betalen = payer." },
    { type: "input", q: "« le magasin » se dit ___ en néerlandais.", a: ["de winkel", "winkel"], ph: "un lieu", exp: "de winkel = le magasin." },
    { type: "qcm", q: "Comment demande-t-on « Combien ça coûte ? »", opts: ["Hoeveel kost het?", "Waar is het?", "Wie is het?", "Hoe gaat het?"], a: 0, exp: "Hoeveel kost het? = Combien ça coûte ?" },
    { type: "vf", q: "« duur » signifie « cher ».", a: true, exp: "duur = cher ; goedkoop = bon marché." },
    { type: "input", q: "« payer » se dit ___ en néerlandais.", a: ["betalen"], ph: "un verbe", exp: "betalen = payer." },
    { type: "qcm", q: "Que veut dire « Het is te duur » ?", opts: ["C'est trop cher", "C'est bon marché", "C'est gratuit", "C'est parfait"], a: 0, exp: "te duur = trop cher." },
    { type: "input", q: "Complète : « Dat ___ twee euro » (Ça coûte deux euros, verbe kosten).", a: ["kost"], ph: "verbe conjugué", exp: "kosten -> het/dat kost : Dat kost twee euro." },
    { type: "qcm", q: "Que signifie « goedkoop » ?", opts: ["bon marché", "cher", "cassé", "beau"], a: 0, exp: "goedkoop = bon marché, pas cher." },
    { type: "vf", q: "« Ik betaal met de kaart » veut dire « Je paie par carte ».", a: true, exp: "met de kaart = par carte ; contant = en espèces." },
    { type: "input", q: "« l'argent » se dit ___ en néerlandais.", a: ["het geld", "geld"], ph: "un nom", exp: "het geld = l'argent." },
    { type: "qcm", q: "Comment dit-on poliment « Je voudrais un pain » ?", opts: ["Ik wil graag een brood", "Ik heb een brood", "Waar is een brood?", "Een brood is duur"], a: 0, exp: "Ik wil graag = je voudrais (poli)." },
    { type: "input", q: "« le prix » se dit ___ en néerlandais.", a: ["de prijs", "prijs"], ph: "un nom", exp: "de prijs = le prix." },
    { type: "qcm", q: "Que veut dire « Kan ik u helpen? » ?", opts: ["Puis-je vous aider ?", "Voulez-vous payer ?", "Où est le magasin ?", "Combien ça coûte ?"], a: 0, exp: "Phrase type du vendeur : Puis-je vous aider ?" },
    { type: "vf", q: "Pour être poli avec un inconnu, on dit « alsjeblieft » plutôt que « alstublieft ».", a: false, exp: "Non : à un inconnu on dit alstublieft (avec u) ; alsjeblieft est familier." },
    { type: "input", q: "Complète : « Ik betaal ___ » (Je paie en espèces).", a: ["contant"], ph: "un mot", exp: "contant = en espèces." }
  ],
  final: {
    title: "Exercice final — À la boulangerie",
    intro: `<p>Lis le dialogue, puis réponds.</p>
<pre class="pseudo">Verkoper: Goedemorgen! Kan ik u helpen?   Vendeur : Bonjour ! Puis-je vous aider ?
Klant: Ik wil graag twee broden.          Client : Je voudrais deux pains.
Verkoper: Anders nog iets?                Vendeur : Autre chose ?
Klant: Nee, dank u. Hoeveel is het?       Client : Non, merci. Combien ça fait ?
Verkoper: Dat is vier euro. Contant of met de kaart?  Vendeur : Ça fait quatre euros. Espèces ou carte ?
Klant: Met de kaart, alstublieft.         Client : Par carte, s'il vous plaît.</pre>`,
    questions: [
      { type: "qcm", q: "Combien de pains le client veut-il ?", opts: ["deux", "un", "trois", "quatre"], a: 0, exp: "« twee broden » : deux pains." },
      { type: "input", q: "Que signifie « Hoeveel is het? » (en français) ?", a: ["combien ça fait", "combien ça coute", "combien ça coûte", "c'est combien"], ph: "en français", exp: "Hoeveel is het? = Combien ça fait ?" },
      { type: "qcm", q: "Combien coûtent les deux pains ?", opts: ["quatre euros", "deux euros", "trois euros cinquante", "cinq euros"], a: 0, exp: "« Dat is vier euro » : quatre euros." },
      { type: "vf", q: "Le client paie par carte (met de kaart).", a: true, exp: "« Met de kaart, alstublieft » : par carte." },
      { type: "input", q: "Comment dit-on « acheter » en néerlandais ? ___", a: ["kopen"], ph: "un verbe", exp: "kopen = acheter." }
    ],
    solution: `<p>Le client veut deux pains (twee broden), qui coûtent quatre euros (vier euro). Il paie par carte (met de kaart). Le vendeur emploie u et alstublieft, la forme polie.</p>
<pre class="pseudo">Hoeveel kost het?     Combien ça coûte ?
Dat kost ... euro.    Ça coûte ... euros.
Ik wil graag ...      Je voudrais ...
duur cher · goedkoop bon marché</pre>`
  }
};
</script>
