<script>
var DAY = {
  num: 21,
  title: "Les prépositions de lieu",
  subtitle: "Dire où se trouve quelque chose : op, in, onder, naast, voor, achter…",
  theory: `
<h3>1. Les principales prépositions de lieu</h3>
<pre class="pseudo">in       dans           op       sur
onder    sous           boven    au-dessus de
naast    à côté de      tussen   entre
voor     devant         achter   derrière
bij      près de/chez   tegen    contre</pre>
<pre class="pseudo">De kat zit op de tafel.       Le chat est sur la table.
Het boek ligt in de tas.      Le livre est dans le sac.
De schoenen staan onder het bed.  Les chaussures sont sous le lit.
De lamp hangt boven de tafel.  La lampe est au-dessus de la table.</pre>
<h3>2. Trois verbes pour « être posé » : staan, liggen, zitten</h3>
<p>Le néerlandais précise la position d'un objet. On les traduit tous par « être / se trouver » :</p>
<pre class="pseudo">staan    être debout (objets verticaux : une bouteille, une chaise)
liggen   être couché (objets horizontaux : un livre, un stylo)
zitten   être à l'intérieur / assis (dans une boîte, une personne assise)</pre>
<pre class="pseudo">De fles staat op de tafel.    La bouteille est (debout) sur la table.
Het boek ligt op de tafel.    Le livre est (posé à plat) sur la table.
De sleutel zit in mijn zak.   La clé est dans ma poche.</pre>
<h3>3. Poser la question « où ? » : waar?</h3>
<pre class="pseudo">Waar is de kat?               Où est le chat ?
Waar ligt mijn boek?          Où est mon livre ?
De kat is naast de stoel.     Le chat est à côté de la chaise.</pre>
<div class="tip">« naar » exprime le mouvement vers un lieu : <code>Ik ga naar huis</code> (Je vais à la maison). « in » sans mouvement = position : <code>Ik ben in huis</code> (Je suis dans la maison).</div>
<div class="warn">Ne confonds pas <strong>voor</strong> (devant) et <strong>voor</strong> (pour) : c'est le même mot ! Le contexte décide. « De auto staat voor het huis » = devant ; « een cadeau voor jou » = pour.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie « op » ?", opts: ["sur", "sous", "dans", "devant"], a: 0, exp: "op = sur ; onder = sous ; in = dans." },
    { type: "input", q: "« dans » se dit ___ en néerlandais.", a: ["in"], ph: "préposition", exp: "in = dans." },
    { type: "qcm", q: "Que veut dire « onder » ?", opts: ["sous", "au-dessus de", "à côté de", "entre"], a: 0, exp: "onder = sous ; boven = au-dessus de." },
    { type: "vf", q: "« naast » signifie « à côté de ».", a: true, exp: "naast = à côté de." },
    { type: "input", q: "« derrière » se dit ___ en néerlandais.", a: ["achter"], ph: "préposition", exp: "achter = derrière ; voor = devant." },
    { type: "qcm", q: "Quel verbe pour un livre posé à plat (horizontal) ?", opts: ["liggen", "staan", "zitten", "hangen"], a: 0, exp: "liggen = être couché/à plat, pour un livre." },
    { type: "input", q: "Complète : « De fles ___ op de tafel » (La bouteille est debout sur la table).", a: ["staat"], ph: "verbe", exp: "Une bouteille est verticale -> staan : de fles staat." },
    { type: "qcm", q: "Que signifie « tussen » ?", opts: ["entre", "près de", "contre", "sur"], a: 0, exp: "tussen = entre." },
    { type: "vf", q: "« De sleutel zit in mijn zak » veut dire « La clé est dans ma poche ».", a: true, exp: "zitten pour ce qui est à l'intérieur : la clé est dans la poche." },
    { type: "input", q: "« devant » se dit ___ en néerlandais.", a: ["voor"], ph: "préposition", exp: "voor = devant (et aussi pour, selon le contexte)." },
    { type: "qcm", q: "Comment demande-t-on « Où est le chat ? »", opts: ["Waar is de kat?", "Wie is de kat?", "Wat is de kat?", "Hoe is de kat?"], a: 0, exp: "Waar = où ; Waar is de kat?" },
    { type: "input", q: "« sur » se dit ___ en néerlandais.", a: ["op"], ph: "préposition", exp: "op = sur." },
    { type: "qcm", q: "Quel verbe pour une personne assise ou un objet à l'intérieur ?", opts: ["zitten", "staan", "liggen", "lopen"], a: 0, exp: "zitten = être assis / à l'intérieur." },
    { type: "vf", q: "« boven » signifie « sous ».", a: false, exp: "Non : boven = au-dessus de ; onder = sous." },
    { type: "input", q: "Complète : « Het boek ___ op de tafel » (Le livre est posé sur la table).", a: ["ligt"], ph: "verbe", exp: "Un livre est à plat -> liggen : het boek ligt." }
  ],
  final: {
    title: "Exercice final — Dans le salon",
    intro: `<p>Lis la description, puis réponds.</p>
<pre class="pseudo">De bank staat tegen de muur.         Le canapé est contre le mur.
De kat ligt op de bank.              Le chat est couché sur le canapé.
De tafel staat voor de bank.         La table est devant le canapé.
Onder de tafel ligt een tas.         Sous la table il y a un sac.
De lamp hangt boven de tafel.        La lampe est au-dessus de la table.</pre>`,
    questions: [
      { type: "qcm", q: "Où est le chat ?", opts: ["sur le canapé", "sous la table", "devant le canapé", "contre le mur"], a: 0, exp: "« De kat ligt op de bank » : sur le canapé." },
      { type: "input", q: "Que signifie « onder » (en français) ?", a: ["sous"], ph: "en français", exp: "onder = sous." },
      { type: "qcm", q: "Où est la table par rapport au canapé ?", opts: ["devant (voor)", "derrière (achter)", "sous (onder)", "à côté (naast)"], a: 0, exp: "« De tafel staat voor de bank » : devant." },
      { type: "vf", q: "La lampe est au-dessus de la table (boven de tafel).", a: true, exp: "« De lamp hangt boven de tafel » : oui." },
      { type: "input", q: "Comment dit-on « sur » en néerlandais ? ___", a: ["op"], ph: "préposition", exp: "op = sur." }
    ],
    solution: `<p>Le canapé est contre le mur (tegen de muur), le chat couché dessus (op de bank), la table devant (voor de bank), un sac sous la table (onder de tafel), la lampe au-dessus (boven de tafel).</p>
<pre class="pseudo">in dans · op sur · onder sous · boven au-dessus
naast à côté · tussen entre · voor devant · achter derrière
staan (debout) · liggen (à plat) · zitten (à l'intérieur)</pre>`
  }
};
