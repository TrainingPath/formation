<script>
var DAY = {
  num: 20,
  title: "Er is / er zijn",
  subtitle: "Dire « il y a » en néerlandais : singulier et pluriel.",
  theory: `
<h3>1. « il y a » = er is / er zijn</h3>
<p>Pour dire « il y a », le néerlandais utilise <strong>er</strong> + le verbe zijn (être). On accorde avec ce qui suit :</p>
<pre class="pseudo">er is    + singulier    il y a (un/une)
er zijn  + pluriel      il y a (des/plusieurs)</pre>
<pre class="pseudo">Er is een probleem.        Il y a un problème.
Er zijn twee kinderen.     Il y a deux enfants.
Er is een kat in de tuin.  Il y a un chat dans le jardin.
Er zijn veel mensen.       Il y a beaucoup de gens.</pre>
<h3>2. La forme négative : er is geen / er zijn geen</h3>
<pre class="pseudo">Er is geen brood.          Il n'y a pas de pain.
Er zijn geen appels.       Il n'y a pas de pommes.</pre>
<div class="tip">On emploie <strong>geen</strong> (et non niet) devant un nom : « er is geen … », « er zijn geen … ».</div>
<h3>3. Poser la question : is er…? / zijn er…?</h3>
<p>Pour poser une question, on inverse : le verbe passe devant <strong>er</strong>.</p>
<pre class="pseudo">Is er een winkel hier?     Y a-t-il un magasin ici ?
Zijn er nog vragen?        Y a-t-il encore des questions ?
Hoeveel mensen zijn er?    Combien de personnes y a-t-il ?</pre>
<h3>4. « er » peut aussi bouger dans la phrase</h3>
<p>Si la phrase commence par un autre élément (un lieu, un temps), <strong>er</strong> reste souvent, mais le verbe garde la 2e position :</p>
<pre class="pseudo">In de tuin zijn er bloemen.   Dans le jardin il y a des fleurs.
Vandaag is er een feest.      Aujourd'hui il y a une fête.</pre>
<div class="warn">Ne confonds pas : <strong>er is</strong> = il y a (existence) ; <strong>hij is</strong> = il est (une personne/chose précise).</div>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « il y a un problème » ?", opts: ["Er is een probleem", "Er zijn een probleem", "Hij is een probleem", "Er een probleem is"], a: 0, exp: "Singulier -> er is." },
    { type: "input", q: "Complète : « ___ twee kinderen » (Il y a deux enfants).", a: ["er zijn"], ph: "il y a (pluriel)", exp: "Pluriel -> er zijn." },
    { type: "qcm", q: "Quand utilise-t-on « er zijn » ?", opts: ["devant un pluriel", "devant un singulier", "seulement dans les questions", "jamais"], a: 0, exp: "er zijn s'emploie avec un pluriel." },
    { type: "vf", q: "« Er is een kat » signifie « Il y a un chat ».", a: true, exp: "Exact : er is + singulier = il y a un/une." },
    { type: "input", q: "Complète : « Er is ___ brood » (Il n'y a pas de pain).", a: ["geen"], ph: "négation", exp: "Devant un nom, on utilise geen : er is geen brood." },
    { type: "qcm", q: "Comment dit-on « Il n'y a pas de pommes » ?", opts: ["Er zijn geen appels", "Er is geen appels", "Er zijn niet appels", "Er is niet appel"], a: 0, exp: "Pluriel + geen : er zijn geen appels." },
    { type: "input", q: "Transforme en question : « Er is een winkel » devient « ___ er een winkel? »", a: ["is"], ph: "verbe", exp: "On inverse : Is er een winkel? (Y a-t-il un magasin ?)" },
    { type: "qcm", q: "Que veut dire « Zijn er nog vragen? »", opts: ["Y a-t-il encore des questions ?", "Où sont les questions ?", "Il y a une question", "Je n'ai pas de questions"], a: 0, exp: "Question au pluriel : Zijn er…? = Y a-t-il des…?" },
    { type: "vf", q: "Devant un nom, « il n'y a pas » se dit avec « niet » (er is niet brood).", a: false, exp: "Non : on utilise geen -> er is geen brood." },
    { type: "input", q: "Complète : « Er ___ veel mensen » (Il y a beaucoup de gens).", a: ["zijn"], ph: "verbe", exp: "mensen est pluriel -> er zijn." },
    { type: "qcm", q: "Quelle phrase signifie « Il y a un chat dans le jardin » ?", opts: ["Er is een kat in de tuin", "Hij is een kat in de tuin", "Er zijn een kat in de tuin", "Een kat er is in de tuin"], a: 0, exp: "Singulier -> er is een kat." },
    { type: "input", q: "Traduis « il y a » au singulier : ___ is.", a: ["er"], ph: "un mot", exp: "er is = il y a (singulier)." },
    { type: "qcm", q: "Quelle est la différence entre « er is » et « hij is » ?", opts: ["er is = il y a (existence), hij is = il est (une personne/chose précise)", "aucune différence", "er is est faux", "hij is veut dire il y a"], a: 0, exp: "er is exprime l'existence ; hij is renvoie à un sujet précis." },
    { type: "vf", q: "Dans « Vandaag is er een feest », le verbe « is » est bien en 2e position.", a: true, exp: "Vandaag (1), is (2), er een feest : la règle du verbe en 2e position tient." },
    { type: "input", q: "Complète la question : « Hoeveel mensen ___ er? » (Combien de personnes y a-t-il ?).", a: ["zijn"], ph: "verbe", exp: "mensen pluriel -> zijn : Hoeveel mensen zijn er?" }
  ],
  final: {
    title: "Exercice final — Dans la classe",
    intro: `<p>Lis la description, puis réponds.</p>
<pre class="pseudo">In de klas is er een bord.           Dans la classe il y a un tableau.
Er zijn twintig stoelen.             Il y a vingt chaises.
Er is geen computer.                 Il n'y a pas d'ordinateur.
Zijn er ramen? Ja, er zijn drie ramen.  Y a-t-il des fenêtres ? Oui, il y a trois fenêtres.</pre>`,
    questions: [
      { type: "qcm", q: "Combien de chaises y a-t-il ?", opts: ["vingt", "trois", "deux", "dix"], a: 0, exp: "« Er zijn twintig stoelen » : vingt." },
      { type: "input", q: "Complète : « Er is ___ computer » (Il n'y a pas d'ordinateur).", a: ["geen"], ph: "négation", exp: "er is geen computer." },
      { type: "qcm", q: "Comment dit-on « Il y a un tableau » ?", opts: ["Er is een bord", "Er zijn een bord", "Hij is een bord", "Er een bord is"], a: 0, exp: "Singulier -> er is een bord." },
      { type: "vf", q: "Il y a trois fenêtres (ramen) dans la classe.", a: true, exp: "« er zijn drie ramen » : trois fenêtres." },
      { type: "input", q: "Complète : « ___ er ramen? » (Y a-t-il des fenêtres ?).", a: ["zijn"], ph: "verbe", exp: "Pluriel + question : Zijn er ramen?" }
    ],
    solution: `<p>Dans la classe : un tableau (er is een bord), vingt chaises (er zijn twintig stoelen), pas d'ordinateur (er is geen computer), et trois fenêtres (er zijn drie ramen).</p>
<pre class="pseudo">er is    + singulier    il y a
er zijn  + pluriel      il y a
er is geen / er zijn geen   il n'y a pas de
Is er...? / Zijn er...?      Y a-t-il...?</pre>`
  }
};
</script>
