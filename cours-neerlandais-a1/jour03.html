<script>
var DAY = {
  num: 3,
  title: "Les pronoms personnels sujets",
  subtitle: "Je, tu, il, elle, nous, vous, ils : qui fait l'action ?",
  theory: `
<h3>1. Qu'est-ce qu'un pronom sujet ?</h3>
<p>Un <strong>pronom personnel sujet</strong> est le petit mot qui remplace la personne qui fait l'action : « <strong>je</strong> mange », « <strong>ils</strong> partent ». En néerlandais, ces pronoms sont indispensables : contrairement au français, on ne devine pas toujours le sujet dans la terminaison du verbe. Voici la liste complète :</p>
<pre class="pseudo">Néerlandais       Français              Remarque
ik                je                    -
jij  / je         tu                    forme familière
u                 vous (politesse)      1 personne, poli
hij               il
zij  / ze         elle
het               il / elle (neutre)    pour les objets neutres
wij  / we         nous
jullie            vous (pluriel)        on tutoie un groupe
zij  / ze         ils / elles</pre>
<h3>2. Formes accentuées et formes faibles</h3>
<p>Plusieurs pronoms ont <strong>deux formes</strong> : une forme forte (accentuée) et une forme faible (courante) :</p>
<pre class="pseudo">Forte     Faible    Sens
jij       je        tu
zij       ze        elle / ils / elles
wij       we        nous</pre>
<p>La forme <strong>faible</strong> (je, ze, we) est celle qu'on emploie le plus souvent. On garde la forme <strong>forte</strong> (jij, zij, wij) pour insister : <em>Jij bent student, maar ik niet</em> = <em>Toi</em> tu es étudiant, mais pas moi.</p>
<div class="warn">Attention au double sens de <strong>zij / ze</strong> : selon le contexte, cela veut dire « elle » (une femme) OU « ils / elles » (un groupe). Le verbe qui suit permet de trancher : <em>zij is</em> = elle est (singulier), <em>zij zijn</em> = ils sont (pluriel).</div>
<h3>3. Tutoyer ou vouvoyer ?</h3>
<pre class="pseudo">jij / je   -> tu     : ami, famille, jeune, collègue proche
u          -> vous   : inconnu, personne âgée, contexte formel
jullie     -> vous   : quand on parle à PLUSIEURS personnes (tutoiement de groupe)</pre>
<div class="tip">Ne confondez pas <strong>u</strong> (vous poli, à UNE personne) et <strong>jullie</strong> (vous, à PLUSIEURS personnes que l'on tutoie). Le français « vous » recouvre les deux ; le néerlandais les distingue.</div>
<h3>4. Le pronom neutre het</h3>
<p>Le pronom <strong>het</strong> (« il / elle » neutre) sert pour les choses désignées par un nom neutre, et dans des expressions impersonnelles :</p>
<pre class="pseudo">Het regent.        -> Il pleut.        (het impersonnel, comme « il » en français)
Het is koud.       -> Il fait froid.</pre>
<h3>5. Récapitulatif à mémoriser</h3>
<pre class="pseudo">ik       je
jij/je   tu
hij      il
zij/ze   elle
wij/we   nous
jullie   vous (groupe)
zij/ze   ils / elles</pre>
<p>Apprenez cette liste par cœur : c'est le squelette de toutes les phrases à venir.</p>`,
  exercises: [
    { type: "qcm", q: "Quel pronom signifie « je » ?", opts: ["jij", "ik", "hij", "wij"], a: 1, exp: "ik = je." },
    { type: "qcm", q: "Quel pronom signifie « nous » ?", opts: ["jullie", "zij", "wij", "u"], a: 2, exp: "wij (forme faible we) = nous." },
    { type: "qcm", q: "Comment dit-on « il » (une personne masculine) ?", opts: ["zij", "het", "hij", "jij"], a: 2, exp: "hij = il." },
    { type: "qcm", q: "Le pronom <code>jullie</code> désigne…", opts: ["une seule personne, poli", "un groupe à qui on dit « vous »", "elle", "nous"], a: 1, exp: "jullie = vous (à plusieurs personnes tutoyées)." },
    { type: "qcm", q: "Quelle est la forme FAIBLE (courante) de <code>jij</code> ?", opts: ["je", "ze", "we", "u"], a: 0, exp: "jij (forte) -> je (faible)." },
    { type: "qcm", q: "Dans <code>Het regent</code> (il pleut), <code>het</code> est…", opts: ["un sujet réel", "un « il » impersonnel", "le mot « le »", "une faute"], a: 1, exp: "het impersonnel, comme le « il » de « il pleut »." },
    { type: "vf", q: "<code>u</code> s'emploie pour vouvoyer une personne qu'on ne connaît pas.", a: true, exp: "u = vous de politesse, à une personne." },
    { type: "vf", q: "<code>we</code> est la forme faible de <code>wij</code> (nous).", a: true, exp: "wij / we = nous." },
    { type: "vf", q: "<code>zij</code> ne peut signifier que « elle », jamais « ils ».", a: false, exp: "zij / ze signifie « elle » OU « ils / elles » selon le contexte." },
    { type: "input", q: "Vul in : le pronom pour « tu » (forme forte) est ___.", a: ["jij"], ph: "un mot", exp: "jij = tu (forme forte) ; je = forme faible." },
    { type: "input", q: "Vul in : le pronom pour « nous » (forme forte) est ___.", a: ["wij"], ph: "un mot", exp: "wij = nous." },
    { type: "input", q: "Vul in : le pronom de politesse « vous » (à une personne) est ___.", a: ["u"], ph: "un mot", exp: "u = vous poli." },
    { type: "input", q: "Vul in : « vous » à plusieurs personnes tutoyées se dit ___.", a: ["jullie"], ph: "un mot", exp: "jullie = vous (groupe)." },
    { type: "input", q: "Vul in : le pronom pour « elle » (forme forte) est ___.", a: ["zij"], ph: "un mot", exp: "zij = elle (aussi ils/elles selon le contexte)." },
    { type: "input", q: "Vul in : le pronom pour « je » est ___.", a: ["ik"], ph: "un mot", exp: "ik = je." }
  ],
  final: {
    title: "Exercice final — Choisir le bon pronom",
    intro: `<p>Pour chaque situation, choisissez le pronom sujet néerlandais qui convient. Pensez au tutoiement, au vouvoiement, au singulier et au pluriel.</p>
<pre class="pseudo">ik · jij/je · u · hij · zij/ze · wij/we · jullie · zij/ze</pre>`,
    questions: [
      { type: "qcm", q: "Vous parlez à votre nouveau patron, une personne que vous respectez. Vous employez…", opts: ["jij", "u", "jullie", "het"], a: 1, exp: "u = vous de politesse, adapté à un supérieur qu'on ne tutoie pas." },
      { type: "input", q: "Vul in : Pour parler de vous et vos amis (« nous »), vous dites ___.", a: ["wij", "we"], ph: "un pronom", exp: "wij ou we = nous." },
      { type: "qcm", q: "Vous parlez à un groupe d'enfants (que vous tutoyez). Vous dites…", opts: ["u", "jij", "jullie", "hij"], a: 2, exp: "jullie = vous, à plusieurs personnes tutoyées." },
      { type: "vf", q: "Pour parler d'une seule amie (« elle »), on peut employer <code>ze</code>.", a: true, exp: "ze est la forme faible de zij = elle." },
      { type: "input", q: "Vul in : Pour dire « il » (un homme), on utilise le pronom ___.", a: ["hij"], ph: "un pronom", exp: "hij = il." }
    ],
    solution: `<p>Les réponses et la logique :</p>
<pre class="pseudo">Patron respecté      -> u        (vouvoiement, 1 personne)
Nous (mes amis+moi)  -> wij / we
Groupe d'enfants     -> jullie   (vous, tutoiement pluriel)
Une amie « elle »    -> zij / ze
Un homme « il »      -> hij</pre>
<p>La clé du jour : distinguer <strong>u</strong> (vous poli, singulier) de <strong>jullie</strong> (vous, pluriel), et se rappeler que <strong>zij / ze</strong> a deux sens (elle / ils) tranchés par le verbe.</p>`
  }
};
</script>
