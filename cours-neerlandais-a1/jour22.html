  title: "Les verbes à particule séparable",
  subtitle: "Ces verbes qui se coupent en deux : la particule part à la fin de la phrase.",
  theory: `
<h3>1. Qu'est-ce qu'un verbe à particule séparable ?</h3>
<p>Beaucoup de verbes néerlandais sont formés d'une <strong>particule</strong> + un verbe. Exemple : <code>opstaan</code> (se lever) = <strong>op</strong> (particule) + <strong>staan</strong> (verbe). Ce sont des <strong>scheidbare werkwoorden</strong> (verbes séparables).</p>
<pre class="pseudo">opstaan      se lever        aankomen     arriver
opbellen     téléphoner      meenemen     emporter
uitgaan      sortir          aandoen      allumer/enfiler
afwassen     faire la vaisselle  weggaan  partir</pre>
<h3>2. La règle clé : dans une phrase simple, la particule part à la FIN</h3>
<p>Quand on conjugue le verbe, la particule se détache et va tout à la fin de la phrase. C'est le point le plus important d'aujourd'hui.</p>
<pre class="pseudo">opstaan  ->  Ik sta om zeven uur op.     Je me lève à sept heures.
opbellen ->  Ik bel mijn moeder op.      Je téléphone à ma mère.
meenemen ->  Zij neemt een appel mee.    Elle emporte une pomme.
aankomen ->  De trein komt om acht uur aan.  Le train arrive à huit heures.</pre>
<div class="warn">La particule (op, aan, mee, uit…) quitte le verbe et se pose à la toute fin. Le verbe conjugué reste, lui, en 2e position. C'est la combinaison des deux règles vues jusqu'ici.</div>
<h3>3. Avec un verbe modal : le verbe reste entier à la fin</h3>
<p>Après kunnen, willen, moeten… (jour 19), le verbe séparable reste <strong>collé</strong> et part à la fin, à l'infinitif :</p>
<pre class="pseudo">Ik moet vroeg opstaan.       Je dois me lever tôt.
Ik wil je opbellen.          Je veux te téléphoner.</pre>
<h3>4. Reconnaître : où est l'accent ?</h3>
<p>Dans un verbe séparable, l'accent tombe sur la particule : <strong>OP</strong>staan, <strong>MEE</strong>nemen. Cela aide à les repérer.</p>
<div class="tip">Question et réponse : <code>Sta je vroeg op?</code> (Te lèves-tu tôt ?) — <code>Ja, ik sta vroeg op.</code> La particule « op » reste à la fin dans les deux cas.</div>`,
  exercises: [
    { type: "qcm", q: "De quoi est composé le verbe « opstaan » (se lever) ?", opts: ["particule op + verbe staan", "trois verbes", "un nom + un verbe", "op tout seul"], a: 0, exp: "op (particule) + staan (verbe) = opstaan." },
    { type: "input", q: "Conjugue et sépare : « Ik ___ om zeven uur ___ » (Je me lève à 7h, opstaan). Donne la PARTICULE finale.", a: ["op"], ph: "la particule", exp: "Ik sta ... op : la particule op va à la fin." },
    { type: "qcm", q: "Dans une phrase simple, où va la particule d'un verbe séparable ?", opts: ["à la fin de la phrase", "juste après le sujet", "en 1re position", "elle reste collée au verbe"], a: 0, exp: "La particule se détache et part à la fin." },
    { type: "vf", q: "Dans « Ik bel mijn moeder op », la particule « op » vient du verbe opbellen.", a: true, exp: "Exact : opbellen -> ik bel ... op." },
    { type: "input", q: "Complète : « Zij neemt een appel ___ » (Elle emporte une pomme, meenemen).", a: ["mee"], ph: "la particule", exp: "meenemen -> zij neemt ... mee." },
    { type: "qcm", q: "Que signifie « aankomen » ?", opts: ["arriver", "partir", "se lever", "téléphoner"], a: 0, exp: "aankomen = arriver ; weggaan = partir." },
    { type: "input", q: "Complète : « De trein komt om acht uur ___ » (Le train arrive à 8h, aankomen).", a: ["aan"], ph: "la particule", exp: "aankomen -> de trein komt ... aan." },
    { type: "qcm", q: "Avec un verbe modal, que devient le verbe séparable ?", opts: ["il reste entier et va à la fin à l'infinitif", "il se coupe quand même", "il disparaît", "il passe en 1re position"], a: 0, exp: "Ik moet vroeg opstaan : opstaan reste collé, à la fin." },
    { type: "vf", q: "Dans « Ik moet vroeg opstaan », le verbe « opstaan » reste en un seul mot.", a: true, exp: "Après un modal, le verbe séparable ne se coupe pas." },
    { type: "input", q: "Donne l'infinitif du verbe « se lever » en néerlandais (particule + staan).", a: ["opstaan"], ph: "l'infinitif", exp: "opstaan = se lever." },
    { type: "qcm", q: "Que veut dire « Zij neemt een appel mee » ?", opts: ["Elle emporte une pomme", "Elle mange une pomme", "Elle achète une pomme", "Elle donne une pomme"], a: 0, exp: "meenemen = emporter." },
    { type: "input", q: "Complète : « Ik ___ mijn moeder op » (Je téléphone à ma mère, opbellen).", a: ["bel"], ph: "verbe conjugué", exp: "opbellen -> ik bel ... op : le verbe conjugué est bel." },
    { type: "qcm", q: "Sur quelle syllabe tombe l'accent dans un verbe séparable ?", opts: ["sur la particule (OPstaan)", "sur la dernière syllabe", "il n'y a pas d'accent", "sur le sujet"], a: 0, exp: "L'accent est sur la particule : OPstaan, MEEnemen." },
    { type: "vf", q: "Dans « Sta je vroeg op? », la particule « op » reste bien à la fin.", a: true, exp: "Même en question, la particule va à la fin." },
    { type: "input", q: "Complète : « Ik ga vanavond ___ » (Je sors ce soir, uitgaan).", a: ["uit"], ph: "la particule", exp: "uitgaan -> ik ga ... uit." }
  ],
  final: {
    title: "Exercice final — La journée de Lisa",
    intro: `<p>Lis le texte, puis réponds. Repère bien les verbes séparables.</p>
<pre class="pseudo">Lisa staat om zeven uur op.          Lisa se lève à sept heures.
Ze belt haar vriendin op.            Elle téléphone à son amie.
Ze neemt haar tas mee.               Elle emporte son sac.
De bus komt om acht uur aan.         Le bus arrive à huit heures.
's Avonds gaat ze met vrienden uit.  Le soir, elle sort avec des amis.</pre>`,
    questions: [
      { type: "input", q: "Verbe opstaan : « Lisa staat om zeven uur ___ ». Donne la particule.", a: ["op"], ph: "la particule", exp: "opstaan -> staat ... op." },
      { type: "qcm", q: "Que fait Lisa avec son amie ?", opts: ["elle lui téléphone", "elle la voit", "elle mange", "elle part"], a: 0, exp: "« Ze belt haar vriendin op » : opbellen = téléphoner." },
      { type: "input", q: "Verbe meenemen : « Ze neemt haar tas ___ ». Donne la particule.", a: ["mee"], ph: "la particule", exp: "meenemen -> neemt ... mee." },
      { type: "qcm", q: "À quelle heure arrive le bus (aankomen) ?", opts: ["à huit heures", "à sept heures", "à neuf heures", "le soir"], a: 0, exp: "« De bus komt om acht uur aan » : à huit heures." },
      { type: "vf", q: "Dans « 's Avonds gaat ze met vrienden uit », la particule « uit » vient du verbe uitgaan.", a: true, exp: "uitgaan = sortir -> gaat ... uit." }
    ],
    solution: `<p>Chaque phrase contient un verbe séparable dont la particule part à la fin : opstaan (staat ... op), opbellen (belt ... op), meenemen (neemt ... mee), aankomen (komt ... aan), uitgaan (gaat ... uit).</p>
<pre class="pseudo">Verbe séparable en phrase simple :
  verbe conjugué (2e position) ......... particule (fin)
Ik    sta    om zeven uur ............... op.</pre>`
  }
};
