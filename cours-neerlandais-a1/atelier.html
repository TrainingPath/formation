<script>
var ATELIER = {
  prefix: "at-nl-a1",

  soustitre: "Trois dialogues, puis 30 types d'exercices (10 chacun) pour ancrer le niveau A1.",
  retour: "index.html",
  dialogues: [
    { num:"1", titre:"Kennismaking — Faire connaissance", perso:"Anna Peeters · Bram De Vos", lignes:[
      {qui:"A.P.", txt:"Goeiemorgen! Ik ben Anna Peeters.", fr:"Bonjour ! Je suis Anna Peeters."},
      {qui:"B.D.", txt:"Dag Anna, aangenaam. Ik heet Bram De Vos.", fr:"Bonjour Anna, enchanté. Je m'appelle Bram De Vos."},
      {qui:"A.P.", txt:"Aangenaam, Bram. Woon je hier in Antwerpen?", fr:"Enchantée, Bram. Tu habites ici à Anvers ?"},
      {qui:"B.D.", txt:"Nee, ik woon in Gent. Ik werk hier.", fr:"Non, j'habite à Gand. Je travaille ici."},
      {qui:"A.P.", txt:"Wat doe je precies?", fr:"Que fais-tu exactement ?"},
      {qui:"B.D.", txt:"Ik ben verpleger in het ziekenhuis. En jij?", fr:"Je suis infirmier à l'hôpital. Et toi ?"},
      {qui:"A.P.", txt:"Ik ben lerares. Ik geef Nederlands aan volwassenen.", fr:"Je suis enseignante. Je donne du néerlandais à des adultes."},
      {qui:"B.D.", txt:"Interessant! Heb je veel studenten?", fr:"Intéressant ! Est-ce que tu as beaucoup d'étudiants ?"},
      {qui:"A.P.", txt:"Ja, ik heb twintig studenten. Ze zijn heel gemotiveerd.", fr:"Oui, j'ai vingt étudiants. Ils sont très motivés."},
      {qui:"B.D.", txt:"Leuk je te ontmoeten. Tot ziens, Anna!", fr:"Content de te rencontrer. Au revoir, Anna !"}
    ]},
    { num:"2", titre:"In het café — Au café", perso:"Sofie Janssens · Tom (de ober)", lignes:[
      {qui:"Tom", txt:"Goeiemiddag mevrouw. Wat wilt u drinken?", fr:"Bonjour madame. Que voulez-vous boire ?"},
      {qui:"S.J.", txt:"Een koffie, alstublieft. Met melk.", fr:"Un café, s'il vous plaît. Avec du lait."},
      {qui:"Tom", txt:"Met suiker ook?", fr:"Avec du sucre aussi ?"},
      {qui:"S.J.", txt:"Nee, geen suiker, dank u.", fr:"Non, pas de sucre, merci."},
      {qui:"Tom", txt:"Wilt u iets eten? We hebben soep en broodjes.", fr:"Voulez-vous manger quelque chose ? Nous avons de la soupe et des petits pains."},
      {qui:"S.J.", txt:"Wat kost een broodje kaas?", fr:"Combien coûte un sandwich au fromage ?"},
      {qui:"Tom", txt:"Vier euro vijftig, mevrouw.", fr:"Quatre euros cinquante, madame."},
      {qui:"S.J.", txt:"Goed, dan neem ik een broodje kaas.", fr:"Bien, alors je prends un sandwich au fromage."},
      {qui:"Tom", txt:"Prima. Ik breng het meteen.", fr:"Parfait. Je l'apporte tout de suite."},
      {qui:"S.J.", txt:"Dank u wel. Mag ik ook de rekening?", fr:"Merci beaucoup. Puis-je avoir aussi l'addition ?"}
    ]},
    { num:"3", titre:"De weg vragen — Demander son chemin", perso:"Karim El Amrani · Lieve Maes", lignes:[
      {qui:"K.E.", txt:"Excuseer mevrouw, waar is het station?", fr:"Excusez-moi madame, où est la gare ?"},
      {qui:"L.M.", txt:"Het station? Ga rechtdoor tot de kerk.", fr:"La gare ? Allez tout droit jusqu'à l'église."},
      {qui:"K.E.", txt:"En dan? Links of rechts?", fr:"Et ensuite ? À gauche ou à droite ?"},
      {qui:"L.M.", txt:"Dan gaat u rechts, naast de bibliotheek.", fr:"Ensuite vous allez à droite, à côté de la bibliothèque."},
      {qui:"K.E.", txt:"Is het ver van hier?", fr:"Est-ce loin d'ici ?"},
      {qui:"L.M.", txt:"Nee, tien minuten te voet.", fr:"Non, dix minutes à pied."},
      {qui:"K.E.", txt:"Hoe laat is het nu, alstublieft?", fr:"Quelle heure est-il maintenant, s'il vous plaît ?"},
      {qui:"L.M.", txt:"Het is kwart voor drie.", fr:"Il est trois heures moins le quart."},
      {qui:"K.E.", txt:"Dan heb ik nog tijd. Mijn trein vertrekt om drie uur.", fr:"Alors j'ai encore le temps. Mon train part à trois heures."},
      {qui:"L.M.", txt:"Veel succes! Een goede reis.", fr:"Bonne chance ! Bon voyage."}
    ]}
  ],
  types: [
  {
    id:"vf", nom:"Vrai / Faux",
    consigne:"Lisez les trois dialogues, puis indiquez si chaque affirmation est vraie ou fausse.",
    exercices:[
      {type:"vf", q:"Anna Peeters woont in Gent.", a:false, exp:"Faux : c'est Bram qui habite à Gand (ik woon in Gent). Anna se trouve à Anvers."},
      {type:"vf", q:"Bram De Vos werkt in het ziekenhuis.", a:true, exp:"Vrai : il dit « Ik ben verpleger in het ziekenhuis » (het ziekenhuis = l'hôpital, mot neutre)."},
      {type:"vf", q:"Anna is lerares en geeft Nederlands.", a:true, exp:"Vrai : « Ik ben lerares. Ik geef Nederlands aan volwassenen. » Notez : de lerares (féminin de de leraar)."},
      {type:"vf", q:"Anna heeft dertig studenten.", a:false, exp:"Faux : elle a twintig studenten (20), pas dertig (30)."},
      {type:"vf", q:"Sofie wil koffie met melk.", a:true, exp:"Vrai : « Een koffie, alstublieft. Met melk. » La préposition met = avec."},
      {type:"vf", q:"Sofie neemt suiker in haar koffie.", a:false, exp:"Faux : « Nee, geen suiker. » On emploie geen devant un nom sans article défini."},
      {type:"vf", q:"Een broodje kaas kost vier euro vijftig.", a:true, exp:"Vrai : le serveur répond « Vier euro vijftig ». Het broodje est neutre (diminutif en -je)."},
      {type:"vf", q:"Karim zoekt de bibliotheek.", a:false, exp:"Faux : il cherche het station (la gare). La bibliothèque n'est qu'un point de repère."},
      {type:"vf", q:"Het station is tien minuten te voet.", a:true, exp:"Vrai : « Nee, tien minuten te voet » = dix minutes à pied."},
      {type:"vf", q:"De trein van Karim vertrekt om vier uur.", a:false, exp:"Faux : « Mijn trein vertrekt om drie uur » (à trois heures). La préposition om sert pour l'heure."}
    ]
  },
  {
    id:"qcmdial", nom:"QCM de compréhension",
    consigne:"Choisissez la bonne réponse d'après les dialogues.",
    exercices:[
      {type:"qcm", q:"Hoe heet de man in dialoog 1?", opts:["Tom Janssens","Bram De Vos","Karim El Amrani","Lieve Maes"], a:1, exp:"« Ik heet Bram De Vos. » Le verbe heten = s'appeler."},
      {type:"qcm", q:"Wat is het beroep van Bram?", opts:["Leraar","Ober","Verpleger","Student"], a:2, exp:"de verpleger = l'infirmier. En néerlandais on dit « ik ben verpleger », sans article."},
      {type:"qcm", q:"Waar werkt Bram?", opts:["In een school","In het ziekenhuis","In een café","In het station"], a:1, exp:"het ziekenhuis (neutre) = l'hôpital. La préposition in indique le lieu."},
      {type:"qcm", q:"Hoeveel studenten heeft Anna?", opts:["Tien","Twaalf","Twintig","Dertig"], a:2, exp:"twintig = 20. Attention à ne pas confondre twaalf (12) et twintig (20)."},
      {type:"qcm", q:"Wat drinkt Sofie?", opts:["Thee","Water","Koffie","Bier"], a:2, exp:"de koffie = le café (boisson). Le lieu s'appelle het café."},
      {type:"qcm", q:"Wat eet Sofie?", opts:["Soep","Een broodje kaas","Niets","Een broodje ham"], a:1, exp:"« Dan neem ik een broodje kaas. » het broodje = le petit pain (diminutif, donc neutre)."},
      {type:"qcm", q:"Wat vraagt Sofie op het einde?", opts:["De rekening","De kaart","De ober","Het menu"], a:0, exp:"de rekening = l'addition. « Mag ik de rekening? » est la formule usuelle."},
      {type:"qcm", q:"Wat zoekt Karim?", opts:["De kerk","Het station","De bibliotheek","Het café"], a:1, exp:"« Waar is het station? » Le mot interrogatif waar = où."},
      {type:"qcm", q:"Hoe laat is het in dialoog 3?", opts:["Kwart over drie","Half drie","Kwart voor drie","Drie uur"], a:2, exp:"kwart voor drie = 14 h 45 (trois heures moins le quart)."},
      {type:"qcm", q:"Waar moet Karim rechts gaan?", opts:["Naast de kerk","Naast de bibliotheek","Naast het station","Naast het café"], a:1, exp:"« Dan gaat u rechts, naast de bibliotheek. » naast = à côté de."}
    ]
  },
  {
    id:"rectif", nom:"Rectifier l'affirmation fausse",
    consigne:"Chaque phrase contient une erreur. Écrivez le mot correct en néerlandais.",
    exercices:[
      {type:"input", q:"Bram woont in Antwerpen. → Bram woont in …", a:["gent"], ph:"une ville", exp:"Bram dit : « ik woon in Gent ». Le verbe wonen + in + ville."},
      {type:"input", q:"Anna is verpleegster. → Anna is …", a:["lerares","leerkracht"], ph:"un métier", exp:"de lerares = l'enseignante. Pas d'article devant un métier après zijn."},
      {type:"input", q:"Anna heeft tien studenten. → Anna heeft … studenten.", a:["twintig"], ph:"un nombre", exp:"twintig = 20. Le verbe hebben est irrégulier : ik heb, jij hebt, hij heeft."},
      {type:"input", q:"Sofie drinkt thee. → Sofie drinkt …", a:["koffie","een koffie"], ph:"une boisson", exp:"de koffie = le café. Verbe drinken, régulier au présent : ik drink."},
      {type:"input", q:"Sofie neemt suiker. → Sofie neemt … suiker.", a:["geen"], ph:"un mot de négation", exp:"geen nie un nom indéterminé (sans article) : geen suiker = pas de sucre."},
      {type:"input", q:"Het broodje kost drie euro. → Het broodje kost … euro vijftig.", a:["vier"], ph:"un nombre", exp:"vier euro vijftig = 4,50 €. Après un chiffre, euro reste au singulier."},
      {type:"input", q:"Karim zoekt de kerk. → Karim zoekt het …", a:["station"], ph:"un lieu", exp:"het station (neutre) = la gare. La kerk n'est qu'un repère sur le chemin."},
      {type:"input", q:"Het station is een uur te voet. → Het is … minuten te voet.", a:["tien"], ph:"un nombre", exp:"tien minuten = dix minutes. de minuut, pluriel de minuten."},
      {type:"input", q:"Het is half drie. → Het is kwart … drie.", a:["voor"], ph:"voor of over", exp:"kwart voor drie = moins le quart ; kwart over drie = trois heures et quart."},
      {type:"input", q:"De trein vertrekt om twee uur. → De trein vertrekt om … uur.", a:["drie"], ph:"un nombre", exp:"« om drie uur » = à trois heures. On utilise toujours om pour une heure précise."}
    ]
  },
  {
    id:"texte", nom:"Texte + questions",
    consigne:"Lisez le texte, puis répondez aux questions.",
    exercices:[
      {type:"qcm", q:"TEKST : « Els woont in Brugge. Ze is bakker. Elke dag staat ze om vier uur op. Ze werkt met haar man Jan. Hun winkel is klein maar gezellig. Op zondag zijn ze gesloten. » — Waar woont Els?", opts:["In Brugge","In Gent","In Brussel","In Leuven"], a:0, exp:"« Els woont in Brugge. » Le verbe wonen se construit avec in + ville."},
      {type:"qcm", q:"Wat is het beroep van Els?", opts:["Lerares","Bakker","Verpleegster","Ober"], a:1, exp:"de bakker = le/la boulanger(-ère). Pas d'article : « ze is bakker »."},
      {type:"qcm", q:"Hoe laat staat Els op?", opts:["Om drie uur","Om vier uur","Om vijf uur","Om zes uur"], a:1, exp:"« om vier uur » = à quatre heures. Opstaan est un verbe séparable : ze staat op."},
      {type:"qcm", q:"Met wie werkt Els?", opts:["Met haar zus","Met haar man","Alleen","Met een vriendin"], a:1, exp:"« Ze werkt met haar man Jan. » met = avec ; de man = le mari."},
      {type:"vf", q:"De winkel van Els is groot.", a:false, exp:"Faux : « Hun winkel is klein » (de winkel = le magasin). klein = petit."},
      {type:"vf", q:"Op zondag is de winkel gesloten.", a:true, exp:"Vrai : « Op zondag zijn ze gesloten. » On dit op + jour de la semaine."},
      {type:"input", q:"Hoe heet de man van Els?", a:["jan"], ph:"un prénom", exp:"« haar man Jan ». Le possessif haar = son/sa (à elle)."},
      {type:"input", q:"Vul aan : Els … in Brugge.", a:["woont"], ph:"verbe", exp:"wonen → ik woon, jij woont, zij woont. Terminaison -t à la 3e personne."},
      {type:"qcm", q:"Welk woord betekent « accueillant, agréable »?", opts:["Klein","Gezellig","Gesloten","Elke"], a:1, exp:"gezellig est un adjectif typiquement néerlandais : convivial, agréable."},
      {type:"qcm", q:"Wat betekent « elke dag »?", opts:["Une fois par semaine","Chaque jour","Le dimanche","Jamais"], a:1, exp:"elke dag = chaque jour. de dag est un mot de genre commun (de)."}
    ]
  },
  {
    id:"doc", nom:"Document authentique",
    consigne:"Observez le document, puis répondez.",
    exercices:[
      {type:"qcm", q:"MENU : koffie 2,50 · thee 2,20 · water 2,00 · bier 3,00 · broodje kaas 4,50 · soep 5,00 — Wat is het goedkoopst?", opts:["Koffie","Thee","Water","Bier"], a:2, exp:"het water coûte 2,00 €, le prix le plus bas. goedkoop = bon marché."},
      {type:"qcm", q:"Wat kost een soep?", opts:["3,00","4,50","5,00","2,20"], a:2, exp:"de soep = la soupe, 5,00 €. On lit « vijf euro »."},
      {type:"input", q:"Hoeveel kosten een koffie en een thee samen? (in cijfers, bv. 4,70)", a:["4,70","4.70","470"], ph:"prix", exp:"2,50 + 2,20 = 4,70 €. samen = ensemble."},
      {type:"qcm", q:"OPENINGSUREN : maandag gesloten · dinsdag t/m vrijdag 9-18u · zaterdag 9-13u — Wanneer is de winkel gesloten?", opts:["Op dinsdag","Op maandag","Op zaterdag","Op vrijdag"], a:1, exp:"maandag = lundi. On dit op maandag pour « le lundi »."},
      {type:"vf", q:"Op zaterdag is de winkel open tot achttien uur.", a:false, exp:"Faux : le samedi c'est 9-13u, donc jusqu'à 13 h (tot dertien uur)."},
      {type:"qcm", q:"TREINKAARTJE : Gent-Sint-Pieters → Antwerpen-Centraal, vertrek 08:12, aankomst 09:05, spoor 7 — Van welk station vertrekt de trein?", opts:["Antwerpen-Centraal","Gent-Sint-Pieters","Brussel-Zuid","Leuven"], a:1, exp:"het vertrek = le départ ; le train part de Gand."},
      {type:"input", q:"Op welk spoor staat de trein? (cijfer)", a:["7","zeven"], ph:"nombre", exp:"het spoor = la voie, ici spoor 7 (zeven)."},
      {type:"qcm", q:"Hoe lang duurt de reis?", opts:["Ongeveer 30 minuten","Ongeveer 53 minuten","Ongeveer 2 uur","Ongeveer 15 minuten"], a:1, exp:"08:12 → 09:05 = 53 minutes. duren = durer."},
      {type:"qcm", q:"BRIEFJE : « Ik ben naar de winkel. Ik ben om 18u terug. Groetjes, Mia » — Waar is Mia?", opts:["Thuis","In de winkel","In het station","Op het werk"], a:1, exp:"naar de winkel = vers/au magasin. naar indique la direction."},
      {type:"input", q:"Hoe laat komt Mia terug? (bv. 18u)", a:["18u","18","om 18u","zes uur","18 uur"], ph:"heure", exp:"« om 18u terug » : terugkomen = revenir ; om + heure."}
    ]
  },
  {
    id:"syn", nom:"Synonymes",
    consigne:"Choisissez le mot de sens équivalent.",
    exercices:[
      {type:"qcm", q:"Synoniem van « dag! »", opts:["Hallo!","Sorry!","Alstublieft!","Misschien"], a:0, exp:"dag et hallo sont deux salutations informelles équivalentes."},
      {type:"qcm", q:"Synoniem van « fijn »", opts:["Leuk","Duur","Moeilijk","Ziek"], a:0, exp:"fijn et leuk = agréable, chouette. Deux adjectifs très courants."},
      {type:"qcm", q:"Synoniem van « spreken »", opts:["Praten","Lopen","Kopen","Slapen"], a:0, exp:"spreken et praten = parler. praten est plus familier."},
      {type:"qcm", q:"Synoniem van « beginnen »", opts:["Starten","Stoppen","Wachten","Vragen"], a:0, exp:"beginnen = starten (commencer). Le contraire est stoppen."},

      {type:"qcm", q:"Synoniem van « heel »", opts:["Erg","Nooit","Bijna","Weinig"], a:0, exp:"heel et erg = très, devant un adjectif : heel mooi / erg mooi."},
      {type:"qcm", q:"Synoniem van « meteen »", opts:["Direct","Later","Gisteren","Morgen"], a:0, exp:"meteen = direct = tout de suite."},
      {type:"qcm", q:"Synoniem van « de kinderen »", opts:["De kids","De ouders","De buren","De collega's"], a:0, exp:"het kind (neutre) fait de kinderen au pluriel ; kids est l'emprunt familier."},
      {type:"qcm", q:"Synoniem van « ik heet »", opts:["Mijn naam is","Ik woon","Ik werk","Ik kom"], a:0, exp:"« Ik heet Anna » = « Mijn naam is Anna ». de naam = le nom."},
      {type:"qcm", q:"Synoniem van « alstublieft »", opts:["Graag","Sorry","Dank u","Tot ziens"], a:0, exp:"Dans un service, alstublieft et graag expriment la politesse de la demande."}
    ]
  },
  {
    id:"ant", nom:"Antonymes",
    consigne:"Choisissez le contraire.",
    exercices:[
      {type:"qcm", q:"Tegenstelling van « groot »", opts:["Klein","Lang","Nieuw","Warm"], a:0, exp:"groot ≠ klein (grand ≠ petit)."},
      {type:"qcm", q:"Tegenstelling van « open »", opts:["Gesloten","Vrij","Vroeg","Ver"], a:0, exp:"open ≠ gesloten (ouvert ≠ fermé), utile pour les horaires."},
      {type:"qcm", q:"Tegenstelling van « duur »", opts:["Goedkoop","Mooi","Zwaar","Nieuw"], a:0, exp:"duur ≠ goedkoop (cher ≠ bon marché)."},
      {type:"qcm", q:"Tegenstelling van « altijd »", opts:["Nooit","Soms","Vaak","Meteen"], a:0, exp:"altijd ≠ nooit (toujours ≠ jamais)."},
      {type:"qcm", q:"Tegenstelling van « links »", opts:["Rechts","Rechtdoor","Ver","Naast"], a:0, exp:"links ≠ rechts, indispensable pour indiquer le chemin."},
      {type:"qcm", q:"Tegenstelling van « komen »", opts:["Gaan","Blijven","Wonen","Zitten"], a:0, exp:"komen ≠ gaan (venir ≠ aller). Deux verbes irréguliers fréquents."},
      {type:"qcm", q:"Tegenstelling van « vroeg »", opts:["Laat","Snel","Ver","Lang"], a:0, exp:"vroeg ≠ laat (tôt ≠ tard)."},
      {type:"qcm", q:"Tegenstelling van « veel »", opts:["Weinig","Genoeg","Alles","Meer"], a:0, exp:"veel ≠ weinig (beaucoup ≠ peu)."},
      {type:"qcm", q:"Tegenstelling van « moeilijk »", opts:["Gemakkelijk","Mogelijk","Nodig","Klaar"], a:0, exp:"moeilijk ≠ gemakkelijk (difficile ≠ facile), aussi écrit makkelijk."},
      {type:"qcm", q:"Tegenstelling van « ziek »", opts:["Gezond","Moe","Blij","Boos"], a:0, exp:"ziek ≠ gezond (malade ≠ en bonne santé)."}
    ]
  },
  {
    id:"motjuste", nom:"Le mot juste",
    consigne:"Complétez avec le mot qui convient.",
    exercices:[
      {type:"input", q:"Ik drink een kop … in het café.", a:["koffie","thee"], ph:"boisson", exp:"een kop koffie = une tasse de café. de kop = la tasse."},
      {type:"input", q:"Waar is het …? Ik moet de trein nemen.", a:["station"], ph:"lieu", exp:"het station (neutre) = la gare, lié à de trein."},
      {type:"qcm", q:"Ik koop brood bij de …", opts:["bakker","slager","dokter","kapper"], a:0, exp:"de bakker vend het brood ; de slager vend la viande."},
      {type:"qcm", q:"Ik ben ziek, ik ga naar de …", opts:["dokter","ober","leraar","buurman"], a:0, exp:"de dokter = le médecin. naar de dokter gaan = aller chez le médecin."},
      {type:"input", q:"Hoe … is het? Het is twee uur.", a:["laat"], ph:"mot", exp:"« Hoe laat is het? » est la question fixe pour demander l'heure."},
      {type:"qcm", q:"Ik betaal de … in het restaurant.", opts:["rekening","kaart","tafel","stoel"], a:0, exp:"de rekening = l'addition ; betalen = payer."},
      {type:"input", q:"Ik woon … Brussel.", a:["in"], ph:"préposition", exp:"wonen + in + nom de ville : ik woon in Brussel."},
      {type:"qcm", q:"Zij … Nederlands aan de school.", opts:["leert","eet","drinkt","slaapt"], a:0, exp:"leren = apprendre (ou enseigner). 3e pers. : zij leert."},
      {type:"input", q:"Mijn trein vertrekt … drie uur.", a:["om"], ph:"préposition", exp:"om + heure précise. in s'emploie pour les mois, op pour les jours."},
      {type:"qcm", q:"Het is koud. Ik draag een …", opts:["jas","glas","bord","boek"], a:0, exp:"de jas = le manteau ; dragen = porter."}
    ]
  },
  {
    id:"familles", nom:"Familles de mots",
    consigne:"Trouvez le mot de la même famille ou l'intrus.",
    exercices:[
      {type:"qcm", q:"Welk woord hoort NIET bij de familie van « werken »?", opts:["Werk","Werknemer","Werkdag","Wereld"], a:3, exp:"de wereld = le monde, sans lien avec werken. het werk = le travail."},
      {type:"qcm", q:"Iemand die leert op school is een …", opts:["leerling","leraar","leren","les"], a:0, exp:"de leerling = l'élève ; de leraar = l'enseignant. Même racine leer-."},
      {type:"qcm", q:"Bij « bakken » hoort …", opts:["de bakkerij","de bank","het bakje ijs","de baan"], a:0, exp:"de bakkerij = la boulangerie. Le suffixe -erij désigne le lieu."},
      {type:"qcm", q:"De vrouwelijke vorm van « de leraar » is …", opts:["de lerares","de leraarin","het leraar","de leraarster"], a:0, exp:"Le suffixe -es forme le féminin : leraar → lerares."},
      {type:"qcm", q:"Welke intrus? (familie)", opts:["Moeder","Vader","Zus","Straat"], a:3, exp:"de straat = la rue ; les trois autres sont des membres de la famille."},
      {type:"qcm", q:"Bij « wonen » hoort …", opts:["de woning","de wond","de wolk","het woord"], a:0, exp:"de woning = le logement, formé sur wonen + -ing."},
      {type:"qcm", q:"Welke intrus? (eten en drinken)", opts:["Brood","Kaas","Melk","Boek"], a:3, exp:"het boek = le livre ; les autres se mangent ou se boivent."},
