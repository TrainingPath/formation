<script>
var DAY = {
  num: 27,
  title: "Le passé : was/waren, had/hadden",
  subtitle: "Parler d'hier avec l'imparfait de zijn (être) et hebben (avoir).",
  theory: `
<h3>1. Le passé de « zijn » (être) : was / waren</h3>
<p>Pour dire « j'étais », « tu étais »…, on utilise le passé (imparfait) du verbe zijn :</p>
<pre class="pseudo">ik was          j'étais
jij was         tu étais
hij/zij was     il/elle était
wij waren       nous étions
jullie waren    vous étiez
zij waren       ils/elles étaient</pre>
<pre class="pseudo">Ik was gisteren thuis.        J'étais à la maison hier.
Wij waren op vakantie.        Nous étions en vacances.
Waar was je?                  Où étais-tu ?</pre>
<div class="tip">Retiens la logique : <strong>was</strong> au singulier, <strong>waren</strong> au pluriel. Comme au présent (is / zijn), il n'y a que deux formes.</div>
<h3>2. Le passé de « hebben » (avoir) : had / hadden</h3>
<pre class="pseudo">ik had          j'avais
jij had         tu avais
hij/zij had     il/elle avait
wij hadden      nous avions
jullie hadden   vous aviez
zij hadden      ils/elles avaient</pre>
<pre class="pseudo">Ik had honger.                J'avais faim.
Zij hadden een hond.          Ils avaient un chien.
Had je een goede dag?         As-tu passé une bonne journée ? (litt. avais-tu une bonne journée)</pre>
<div class="warn">Singulier <strong>had</strong>, pluriel <strong>hadden</strong>. Deux formes seulement, comme was / waren.</div>
<h3>3. Les mots du passé</h3>
<pre class="pseudo">gisteren      hier          eergisteren   avant-hier
vorige week   la semaine dernière   toen   alors, à ce moment-là
vroeger       autrefois     al           déjà</pre>
<h3>4. Exemples complets</h3>
<pre class="pseudo">Gisteren was ik ziek.          Hier, j'étais malade.
Wij waren gisteren in Brussel.  Nous étions à Bruxelles hier.
Ik had geen tijd.              Je n'avais pas le temps.</pre>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « j'étais » ?", opts: ["ik was", "ik waren", "ik ben", "ik had"], a: 0, exp: "Singulier de zijn au passé : ik was." },
    { type: "input", q: "Complète : « Wij ___ op vakantie » (Nous étions en vacances).", a: ["waren"], ph: "verbe", exp: "Pluriel -> waren : Wij waren." },
    { type: "qcm", q: "Que veut dire « waren » ?", opts: ["étaient/étions (pluriel)", "étais (singulier)", "avaient", "sont"], a: 0, exp: "waren = passé pluriel de zijn." },
    { type: "vf", q: "« Ik had honger » signifie « J'avais faim ».", a: true, exp: "had = passé de hebben ; honger = faim." },
    { type: "input", q: "Complète : « Ik ___ gisteren thuis » (J'étais à la maison hier).", a: ["was"], ph: "verbe", exp: "Singulier -> was : Ik was." },
    { type: "qcm", q: "Comment dit-on « nous avions » ?", opts: ["wij hadden", "wij had", "wij hebben", "wij waren"], a: 0, exp: "Pluriel de hebben au passé : wij hadden." },
    { type: "input", q: "Complète : « Zij ___ een hond » (Ils avaient un chien).", a: ["hadden"], ph: "verbe", exp: "Pluriel -> hadden : Zij hadden." },
    { type: "qcm", q: "Que signifie « gisteren » ?", opts: ["hier", "demain", "aujourd'hui", "avant-hier"], a: 0, exp: "gisteren = hier ; eergisteren = avant-hier." },
    { type: "vf", q: "Au passé de hebben, le singulier est « had » et le pluriel « hadden ».", a: true, exp: "Deux formes seulement : had / hadden." },
    { type: "input", q: "Traduis « il était » : hij ___.", a: ["was"], ph: "verbe", exp: "hij was = il était." },
    { type: "qcm", q: "Que veut dire « Waar was je? »", opts: ["Où étais-tu ?", "Qui es-tu ?", "Comment vas-tu ?", "As-tu faim ?"], a: 0, exp: "Waar = où ; was je = étais-tu." },
    { type: "input", q: "Complète : « Ik ___ geen tijd » (Je n'avais pas le temps).", a: ["had"], ph: "verbe", exp: "Singulier -> had : Ik had geen tijd." },
    { type: "qcm", q: "Comment dit-on « vous étiez » (jullie) ?", opts: ["jullie waren", "jullie was", "jullie hadden", "jullie zijn"], a: 0, exp: "Pluriel de zijn au passé : jullie waren." },
    { type: "vf", q: "« ik waren » est la forme correcte pour « j'étais ».", a: false, exp: "Non : au singulier c'est « ik was ». waren est le pluriel." },
    { type: "input", q: "Traduis « nous étions » : wij ___.", a: ["waren"], ph: "verbe", exp: "wij waren = nous étions." }
  ],
  final: {
    title: "Exercice final — Le week-end de Sara",
    intro: `<p>Sara raconte son week-end au passé. Lis, puis réponds.</p>
<pre class="pseudo">Gisteren was ik in Brugge.            Hier, j'étais à Bruges.
Het weer was mooi.                    Le temps était beau.
Ik had veel tijd.                     J'avais beaucoup de temps.
Mijn vrienden waren er ook.           Mes amis étaient là aussi.
We hadden een leuke dag.              Nous avons passé une belle journée.</pre>`,
    questions: [
      { type: "input", q: "Complète : « Gisteren ___ ik in Brugge » (verbe zijn, passé).", a: ["was"], ph: "verbe", exp: "Singulier -> was : Gisteren was ik." },
      { type: "qcm", q: "Comment était le temps (het weer) ?", opts: ["beau (mooi)", "mauvais", "froid", "pluvieux"], a: 0, exp: "« Het weer was mooi » : beau." },
      { type: "input", q: "Complète : « Ik ___ veel tijd » (verbe hebben, passé singulier).", a: ["had"], ph: "verbe", exp: "Singulier -> had : Ik had veel tijd." },
      { type: "vf", q: "Les amis de Sara étaient là aussi (waren er ook).", a: true, exp: "« Mijn vrienden waren er ook » : oui." },
      { type: "input", q: "Complète : « We ___ een leuke dag » (verbe hebben, passé pluriel).", a: ["hadden"], ph: "verbe", exp: "Pluriel -> hadden : We hadden een leuke dag." }
    ],
    solution: `<p>Sara était à Bruges (was in Brugge), le temps était beau (was mooi), elle avait du temps (had veel tijd), ses amis étaient là (waren er ook) et ils ont passé une belle journée (hadden een leuke dag).</p>
<pre class="pseudo">zijn (passé) :  was (singulier) / waren (pluriel)
hebben (passé): had (singulier) / hadden (pluriel)
gisteren hier · vorige week la semaine dernière</pre>`
  }
};
</script>
