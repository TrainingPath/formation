var DAY = {
  num: 2,
  title: "Se présenter : ik ben, ik heet",
  subtitle: "Dire son nom, saluer, et poser les premières questions.",
  theory: `
<h3>1. Deux façons de dire son nom</h3>
<p>Pour se présenter en néerlandais, on dispose de deux formules très courantes :</p>
<pre class="pseudo">Ik ben Anna.        -> Je suis Anna.       (ben = suis, du verbe zijn = être)
Ik heet Anna.       -> Je m'appelle Anna.  (heet = m'appelle, du verbe heten)</pre>
<p>Le mot <strong>ik</strong> signifie « je ». Les deux phrases veulent dire à peu près la même chose. <em>Ik ben...</em> est un peu plus général (on peut dire <em>ik ben student</em> = je suis étudiant), tandis que <em>ik heet...</em> sert surtout à donner son nom.</p>
<h3>2. Saluer et prendre congé</h3>
<pre class="pseudo">Hallo!          -> Salut !               (passe-partout)
Hoi!            -> Coucou !              (familier)
Goedemorgen     -> Bonjour (le matin)
Goedemiddag     -> Bonjour (l'apres-midi)
Goedenavond     -> Bonsoir
Dag!            -> Bonjour / Au revoir   (les deux !)
Tot ziens       -> Au revoir
Doei!           -> Salut ! (en partant, familier)</pre>
<div class="tip">Le petit mot <strong>dag</strong> est magique : il sert à la fois pour dire bonjour ET au revoir, comme « ciao » en italien.</div>
<h3>3. Demander le nom de l'autre</h3>
<p>Pour demander son nom à quelqu'un, on utilise le mot <strong>hoe</strong> (comment) :</p>
<pre class="pseudo">Hoe heet je?        -> Comment t'appelles-tu ?    (je = tu, familier)
Hoe heet u?         -> Comment vous appelez-vous ? (u = vous, poli)
Ik heet Tom.        -> Je m'appelle Tom.
Wie ben jij?        -> Qui es-tu ?                 (wie = qui)</pre>
<div class="warn">Attention : <strong>je / jij</strong> = tu (on tutoie), <strong>u</strong> = vous de politesse. On dit <em>u</em> à une personne qu'on ne connaît pas ou plus âgée. On verra ces pronoms en détail au jour 3.</div>
<h3>4. Les formules de politesse indispensables</h3>
<pre class="pseudo">Dank je wel     -> Merci beaucoup (tutoiement)
Dank u wel      -> Merci beaucoup (vouvoiement)
Alsjeblieft     -> S'il te plaît / Voici (tutoiement)
Alstublieft     -> S'il vous plaît / Voici (vouvoiement)
Sorry           -> Pardon / Désolé
Aangenaam       -> Enchanté(e)</pre>
<h3>5. Un mini-dialogue</h3>
<pre class="pseudo">- Hallo! Ik heet Sara. Hoe heet je?    (Salut ! Je m'appelle Sara. Comment t'appelles-tu ?)
- Hoi Sara! Ik ben Lucas.              (Coucou Sara ! Je suis Lucas.)
- Aangenaam!                           (Enchantée !)
- Tot ziens!                           (Au revoir !)</pre>
<p>Apprenez ce dialogue par cœur : il vous servira dès votre première conversation.</p>`,
  exercises: [
    { type: "qcm", q: "Que signifie <code>Ik heet Anna</code> ?", opts: ["Je suis fatigué", "Je m'appelle Anna", "J'ai chaud, Anna", "Voici Anna"], a: 1, exp: "heten = s'appeler ; ik heet Anna = je m'appelle Anna." },
    { type: "qcm", q: "Le mot <code>ik</code> signifie…", opts: ["tu", "je", "il", "nous"], a: 1, exp: "ik = je." },
    { type: "qcm", q: "Comment demande-t-on « Comment t'appelles-tu ? » (familier) ?", opts: ["Hoe heet u?", "Wie ben ik?", "Hoe heet je?", "Wat is dat?"], a: 2, exp: "Hoe heet je ? avec je = tu." },
    { type: "qcm", q: "Que veut dire <code>Dank je wel</code> ?", opts: ["S'il te plaît", "Au revoir", "Merci beaucoup", "Bonjour"], a: 2, exp: "Dank je wel = merci beaucoup (au tutoiement)." },
    { type: "qcm", q: "Le mot <code>dag</code> peut signifier…", opts: ["seulement bonjour", "seulement au revoir", "bonjour ET au revoir", "merci"], a: 2, exp: "dag sert pour saluer comme pour prendre congé." },
    { type: "qcm", q: "Comment dit-on « Bonsoir » ?", opts: ["Goedemorgen", "Goedemiddag", "Goedenavond", "Goedendag"], a: 2, exp: "Goedenavond = bonsoir (avond = soir)." },
    { type: "vf", q: "<code>u</code> est un pronom de politesse (vouvoiement).", a: true, exp: "u = vous poli ; je/jij = tu familier." },
    { type: "vf", q: "<code>Ik ben Tom</code> et <code>Ik heet Tom</code> permettent tous deux de donner son nom.", a: true, exp: "Les deux formules conviennent pour se présenter." },
    { type: "vf", q: "Le mot <code>hoe</code> signifie « qui ».", a: false, exp: "hoe = comment ; wie = qui." },
    { type: "input", q: "Vul in : Pour dire « Je m'appelle Sara » : Ik ___ Sara.", a: ["heet"], ph: "un verbe", exp: "Ik heet Sara = je m'appelle Sara." },
    { type: "input", q: "Vul in : Pour dire « Je suis Lucas » : Ik ___ Lucas.", a: ["ben"], ph: "un verbe", exp: "Ik ben Lucas = je suis Lucas (ben, du verbe zijn)." },
    { type: "input", q: "Vul in : Pour demander son nom (familier) : Hoe ___ je?", a: ["heet"], ph: "un verbe", exp: "Hoe heet je ? = Comment t'appelles-tu ?" },
    { type: "input", q: "Vul in : « Salut ! » se dit ___ (le plus passe-partout).", a: ["hallo"], ph: "un mot", exp: "Hallo ! est la salutation la plus courante." },
    { type: "input", q: "Vul in : « Au revoir » (en deux mots) : Tot ___.", a: ["ziens"], ph: "un mot", exp: "Tot ziens = au revoir." },
    { type: "input", q: "Vul in : « Enchanté(e) » se dit ___.", a: ["aangenaam"], ph: "un mot", exp: "Aangenaam = enchanté(e)." }
  ],
  final: {
    title: "Exercice final — Une première rencontre",
    intro: `<p>Deux personnes se rencontrent. Complétez et comprenez leur échange.</p>
<pre class="pseudo">- Hallo! Ik heet Emma. Hoe heet je?
- Hoi! Ik ben Daan. Aangenaam!
- Tot ziens, Daan!
- Doei!</pre>`,
    questions: [
      { type: "qcm", q: "Comment Emma se présente-t-elle ?", opts: ["Ik ben Emma", "Ik heet Emma", "Hoe heet Emma", "Dag Emma"], a: 1, exp: "Elle dit : Ik heet Emma = je m'appelle Emma." },
      { type: "input", q: "Vul in : Daan répond « Je suis Daan » : Ik ___ Daan.", a: ["ben"], ph: "un verbe", exp: "Ik ben Daan (verbe zijn)." },
      { type: "qcm", q: "Que signifie <code>Aangenaam</code> ?", opts: ["Au revoir", "Merci", "Enchanté(e)", "Comment vas-tu ?"], a: 2, exp: "Aangenaam = enchanté(e)." },
      { type: "vf", q: "<code>Doei!</code> est une façon familière de dire au revoir.", a: true, exp: "Doei ! = salut ! quand on part (familier)." },
      { type: "input", q: "Vul in : Emma demande le nom de Daan : Hoe ___ je?", a: ["heet"], ph: "un verbe", exp: "Hoe heet je ? = Comment t'appelles-tu ?" }
    ],
    solution: `<p>Le dialogue complet et sa traduction :</p>
<pre class="pseudo">- Hallo! Ik heet Emma. Hoe heet je?   (Salut ! Je m'appelle Emma. Comment t'appelles-tu ?)
- Hoi! Ik ben Daan. Aangenaam!        (Coucou ! Je suis Daan. Enchanté !)
- Tot ziens, Daan!                    (Au revoir, Daan !)
- Doei!                               (Salut !)</pre>
<p>Deux réflexes à garder : <strong>ik heet + nom</strong> ou <strong>ik ben + nom</strong> pour se présenter, et <strong>hoe heet je ?</strong> pour rendre la question. Vous savez déjà tenir une micro-conversation !</p>`
  }
};
</script>
