var DAY = {

  title: "L'impératif",
  subtitle: "Donner un ordre, un conseil ou une consigne en néerlandais.",
  theory: `
<h3>1. Former l'impératif : le radical du verbe, tout simplement</h3>
<p>Pour donner un ordre, on utilise le <strong>radical</strong> du verbe (l'infinitif sans -en). Pas de sujet !</p>
<pre class="pseudo">infinitif   radical   impératif
komen       kom       Kom!        Viens !
luisteren   luister   Luister!    Écoute !
werken      werk      Werk!       Travaille !
eten        eet       Eet!        Mange !</pre>
<div class="tip">L'impératif est identique pour « tu » et « vous » : la même forme sert à une ou plusieurs personnes.</div>
<h3>2. Avec un verbe séparable : la particule part à la fin</h3>
<p>Comme au jour 22, la particule se détache et va à la fin :</p>
<pre class="pseudo">opstaan   ->  Sta op!        Lève-toi !
meenemen  ->  Neem je jas mee!   Emporte ta veste !
opbellen  ->  Bel me op!     Téléphone-moi !</pre>
<h3>3. Adoucir l'ordre : « eens », « maar », « alsjeblieft »</h3>
<p>Pour rendre l'ordre plus poli ou amical, on ajoute de petits mots :</p>
<pre class="pseudo">Kom eens hier.            Viens donc ici.
Ga maar zitten.          Assieds-toi (donc).
Geef me het boek, alsjeblieft.   Donne-moi le livre, s'il te plaît.</pre>
<h3>4. Deux impératifs très courants</h3>
<pre class="pseudo">Wees voorzichtig!        Sois prudent ! (verbe zijn -> wees)
Heb geduld!              Aie de la patience ! (verbe hebben -> heb)</pre>
<div class="warn">Les verbes zijn et hebben ont un impératif irrégulier : <strong>wees</strong> (sois) et <strong>heb</strong> (aie). À retenir par coeur.</div>`,
  exercises: [
    { type: "qcm", q: "Comment forme-t-on l'impératif d'un verbe régulier ?", opts: ["avec le radical (infinitif sans -en)", "avec l'infinitif complet", "avec le sujet + verbe", "en ajoutant -t"], a: 0, exp: "L'impératif = le radical seul, sans sujet." },
    { type: "input", q: "Donne l'impératif de « komen » (venir).", a: ["kom", "kom!"], ph: "un ordre", exp: "komen -> radical kom -> Kom! (Viens !)" },
    { type: "qcm", q: "Que signifie « Luister! » ?", opts: ["Écoute !", "Regarde !", "Parle !", "Viens !"], a: 0, exp: "luisteren -> Luister! = Écoute !" },
    { type: "vf", q: "L'impératif est le même pour « tu » et « vous ».", a: true, exp: "Une seule forme sert pour une ou plusieurs personnes." },
    { type: "input", q: "Donne l'impératif de « eten » (manger).", a: ["eet", "eet!"], ph: "un ordre", exp: "eten -> radical eet -> Eet! (Mange !)" },
    { type: "qcm", q: "Impératif du verbe séparable « opstaan » (se lever) ?", opts: ["Sta op!", "Opstaan!", "Sta!", "Op sta!"], a: 0, exp: "La particule part à la fin : Sta op!" },
    { type: "input", q: "Complète : « Neem je jas ___ ! » (Emporte ta veste !, meenemen).", a: ["mee"], ph: "la particule", exp: "meenemen -> Neem ... mee : Neem je jas mee!" },
    { type: "qcm", q: "Que veut dire « Wees voorzichtig! » ?", opts: ["Sois prudent !", "Sois content !", "Viens vite !", "Attends ici !"], a: 0, exp: "wees = sois (impératif de zijn) ; voorzichtig = prudent." },
    { type: "vf", q: "L'impératif de « zijn » (être) est « wees ».", a: true, exp: "Impératif irrégulier : wees = sois." },
    { type: "input", q: "Donne l'impératif de « werken » (travailler).", a: ["werk", "werk!"], ph: "un ordre", exp: "werken -> Werk! = Travaille !" },
    { type: "qcm", q: "Quel petit mot adoucit un ordre pour dire « viens DONC ici » ?", opts: ["eens", "niet", "geen", "wel"], a: 0, exp: "Kom eens hier = viens donc ici (eens adoucit)." },
    { type: "input", q: "Complète : « Bel me ___ ! » (Téléphone-moi !, opbellen).", a: ["op"], ph: "la particule", exp: "opbellen -> Bel ... op : Bel me op!" },
    { type: "qcm", q: "Que signifie « Ga maar zitten » ?", opts: ["Assieds-toi (donc)", "Va-t'en !", "Lève-toi", "Reste debout"], a: 0, exp: "Ga zitten = assieds-toi ; maar adoucit." },
    { type: "vf", q: "Dans l'impératif, on écrit toujours le sujet (jij) devant le verbe.", a: false, exp: "Non : l'impératif n'a pas de sujet. On dit « Kom! », pas « Jij kom! »." },
    { type: "input", q: "Donne l'impératif de « hebben » au sens « aie » (verbe irrégulier).", a: ["heb", "heb!"], ph: "un ordre", exp: "Impératif de hebben : heb (Heb geduld! = Aie de la patience !)." }
  ],
  final: {
    title: "Exercice final — Les consignes du prof",
    intro: `<p>Le professeur donne des consignes. Lis, puis réponds.</p>
<pre class="pseudo">Kom binnen en ga zitten.             Entre et assieds-toi.
Neem je boek mee.                    Emporte ton livre.
Luister goed en schrijf.             Écoute bien et écris.
Wees stil, alsjeblieft.              Sois silencieux, s'il te plaît.
Bel me op als je een vraag hebt.     Téléphone-moi si tu as une question.</pre>`,
    questions: [
      { type: "qcm", q: "Que veut dire « ga zitten » ?", opts: ["assieds-toi", "lève-toi", "sors", "attends"], a: 0, exp: "ga zitten = assieds-toi." },
      { type: "input", q: "Verbe meenemen : « Neem je boek ___ ». Donne la particule.", a: ["mee"], ph: "la particule", exp: "meenemen -> Neem ... mee." },
      { type: "qcm", q: "Que signifie « Luister goed » ?", opts: ["Écoute bien", "Regarde bien", "Parle bien", "Travaille bien"], a: 0, exp: "luisteren -> Luister = Écoute." },
      { type: "vf", q: "« Wees stil » signifie « Sois silencieux ».", a: true, exp: "wees = sois (impératif de zijn) ; stil = silencieux." },
      { type: "input", q: "Verbe opbellen : « Bel me ___ als je een vraag hebt ». Donne la particule.", a: ["op"], ph: "la particule", exp: "opbellen -> Bel ... op." }
    ],
    solution: `<p>Toutes ces phrases sont des impératifs (radical du verbe, sans sujet) : Kom, ga zitten, Neem ... mee, Luister, schrijf, Wees stil, Bel ... op. Les verbes séparables gardent leur particule à la fin, et zijn devient wees.</p>
<pre class="pseudo">radical seul, pas de sujet :  Kom! Luister! Eet!
verbe séparable :             Sta op! Neem ... mee!
irréguliers :                 Wees! (sois)  Heb! (aie)</pre>`
  }
};
