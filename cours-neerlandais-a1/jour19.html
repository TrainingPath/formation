<script>
var DAY = {
  num: 19,
  title: "Kunnen, mogen, willen",
  subtitle: "Trois verbes modaux : pouvoir (capacité), pouvoir (permission), vouloir.",
  theory: `
<h3>1. Trois verbes très utiles</h3>
<pre class="pseudo">kunnen   pouvoir (être capable de)
mogen    pouvoir (avoir le droit de)
willen   vouloir</pre>
<p>Ce sont des <strong>verbes modaux</strong> : ils accompagnent un autre verbe pour exprimer la capacité, la permission ou l'envie.</p>
<h3>2. La conjugaison au présent</h3>
<pre class="pseudo">           kunnen      mogen      willen
ik         kan         mag        wil
jij        kunt/kan    mag        wilt/wil
hij/zij    kan         mag        wil
wij        kunnen      mogen      willen
jullie     kunnen      mogen      willen
zij        kunnen      mogen      willen</pre>
<div class="warn">Ces verbes sont irréguliers au singulier : ik <strong>kan</strong>, ik <strong>mag</strong>, ik <strong>wil</strong> (pas de -t à la 1re personne).</div>
<h3>3. Le 2e verbe part à la fin, à l'infinitif</h3>
<p>Règle d'or : le verbe modal se conjugue en 2e position, et l'autre verbe va <strong>à la fin</strong> de la phrase, à l'infinitif.</p>
<pre class="pseudo">Ik kan zwemmen.           Je sais nager.
Ik wil koffie drinken.    Je veux boire du café.
Mag ik hier parkeren?     Est-ce que je peux me garer ici ?
Wij kunnen goed koken.    Nous savons bien cuisiner.</pre>
<div class="tip">kunnen = capacité (« je sais / je suis capable »), mogen = permission (« j'ai le droit »). « Kan ik het doen ? » = en suis-je capable ; « Mag ik het doen ? » = en ai-je le droit.</div>
<h3>4. Poser une question polie</h3>
<pre class="pseudo">Wil je koffie?            Veux-tu du café ?
Kun je me helpen?        Peux-tu m'aider ?
Mag ik naar buiten?      Puis-je aller dehors ?</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie « willen » ?", opts: ["vouloir", "pouvoir (capacité)", "devoir", "savoir"], a: 0, exp: "willen = vouloir." },
    { type: "input", q: "Conjugue : « Ik ___ zwemmen » (Je sais nager), verbe kunnen.", a: ["kan"], ph: "verbe conjugué", exp: "ik kan (pas de -t) : Ik kan zwemmen." },
    { type: "qcm", q: "Quelle est la bonne place du 2e verbe avec un modal ?", opts: ["à la fin, à l'infinitif", "juste après le sujet", "en 1re position", "il disparaît"], a: 0, exp: "Le verbe modal en 2e position, l'autre verbe à la fin à l'infinitif." },
    { type: "vf", q: "« kunnen » exprime la capacité (savoir faire).", a: true, exp: "kunnen = pouvoir au sens de capacité ; mogen = permission." },
    { type: "input", q: "Conjugue : « Ik ___ koffie » (Je veux du café), verbe willen.", a: ["wil"], ph: "verbe conjugué", exp: "ik wil (sans -t)." },
    { type: "qcm", q: "Que veut dire « Mag ik hier parkeren? »", opts: ["Puis-je me garer ici ?", "Sais-tu te garer ?", "Où est le parking ?", "Je veux un parking"], a: 0, exp: "mogen = permission ; parkeren = se garer (à la fin)." },
    { type: "input", q: "Conjugue : « Ik ___ hier blijven » (J'ai le droit de rester ici), verbe mogen.", a: ["mag"], ph: "verbe conjugué", exp: "ik mag = j'ai le droit." },
    { type: "qcm", q: "Comment dit-on « Nous voulons » ?", opts: ["Wij willen", "Wij wil", "Wij wilt", "Wij willt"], a: 0, exp: "Au pluriel : wij willen (l'infinitif)." },
    { type: "vf", q: "Dans « Ik wil koffie drinken », le verbe « drinken » est à l'infinitif à la fin.", a: true, exp: "Exact : le 2e verbe part à la fin, à l'infinitif." },
    { type: "input", q: "Traduis « Je veux » (avec ik) : Ik ___.", a: ["wil"], ph: "verbe conjugué", exp: "Ik wil = Je veux." },
    { type: "qcm", q: "Quelle phrase demande une permission ?", opts: ["Mag ik naar buiten?", "Kan ik zwemmen?", "Wil je koffie?", "Ik ben moe."], a: 0, exp: "mogen = avoir le droit : Mag ik = Puis-je (permission)." },
    { type: "input", q: "Complète : « ___ je me helpen? » (Peux-tu m'aider ?), verbe kunnen (forme jij).", a: ["kun", "kan"], ph: "verbe conjugué", exp: "Kun je / Kan je me helpen ? : les deux formes existent." },
    { type: "qcm", q: "Que signifie « kunnen » ?", opts: ["pouvoir (être capable)", "vouloir", "avoir le droit", "aimer"], a: 0, exp: "kunnen = pouvoir au sens de capacité." },
    { type: "vf", q: "« Ik kan » et « ik wil » prennent un -t final à la 1re personne.", a: false, exp: "Non : ik kan, ik wil, ik mag n'ont pas de -t." },
    { type: "input", q: "Traduis « Nous pouvons » (capacité), verbe kunnen : Wij ___.", a: ["kunnen"], ph: "verbe conjugué", exp: "Wij kunnen = Nous pouvons." }
  ],
  final: {
    title: "Exercice final — Au parc",
    intro: `<p>Lis ce dialogue, puis réponds.</p>
<pre class="pseudo">Kind: Mama, mag ik naar het park?    Enfant : Maman, puis-je aller au parc ?
Mama: Ja, maar je moet voorzichtig zijn.  Maman : Oui, mais tu dois être prudent.
Kind: Kan ik daar voetballen?        Enfant : Est-ce que je peux y jouer au foot ?
Mama: Ja. Wil je een appel meenemen?  Maman : Oui. Veux-tu emporter une pomme ?
Kind: Ja, graag!                     Enfant : Oui, avec plaisir !</pre>`,
    questions: [
      { type: "qcm", q: "Que demande l'enfant avec « mag ik » ?", opts: ["une permission", "une capacité", "l'heure", "un prix"], a: 0, exp: "mogen = demander la permission." },
      { type: "input", q: "Conjugue « ik » avec willen dans « ___ je een appel meenemen? ».", a: ["wil"], ph: "verbe conjugué", exp: "Wil je = Veux-tu." },
      { type: "qcm", q: "Que veut dire « Kan ik daar voetballen? »", opts: ["Est-ce que je peux y jouer au foot ?", "Où est le foot ?", "Je veux du foot", "Je dois jouer au foot"], a: 0, exp: "kunnen = capacité/possibilité ; voetballen à la fin." },
      { type: "vf", q: "Le verbe « meenemen » (emporter) est placé à la fin de la phrase.", a: true, exp: "Avec un modal (wil), l'autre verbe va à la fin à l'infinitif." },
      { type: "input", q: "Comment dit-on « Puis-je... ? » (permission) avec ik ? ___ ik...?", a: ["mag"], ph: "verbe conjugué", exp: "Mag ik...? = Puis-je... ?" }
    ],
    solution: `<p>L'enfant demande la permission (Mag ik naar het park?), puis parle de sa capacité/possibilité (Kan ik daar voetballen?). La maman propose (Wil je een appel meenemen?). Dans chaque cas, le 2e verbe (voetballen, meenemen) va à la fin, à l'infinitif.</p>
<pre class="pseudo">ik kan / mag / wil    (singulier, sans -t)
2e verbe -> à la fin, à l'infinitif</pre>`
  }
};
</script>
