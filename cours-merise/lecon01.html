var DAY = {
  num: 1,
  title: "Modéliser : pourquoi et comment",
  subtitle: "La méthode Merise et ses trois niveaux d'abstraction.",
  theory: `
<h3>1. Pourquoi modéliser avant de créer une base ?</h3>
<p>D'abord, deux mots de vocabulaire de départ. Une <strong>base de données</strong> est un ensemble d'informations rangées de façon organisée par un ordinateur (par exemple : la liste des clients d'un magasin et les jeux qu'ils louent). Un <strong>SGBD</strong> (Système de Gestion de Base de Données, comme MySQL) est le logiciel qui range, protège et retrouve ces informations pour nous. Se jeter sur un tel logiciel sans réfléchir mène vite au chaos : mêmes informations recopiées à plusieurs endroits, incohérences, données introuvables. <strong>Modéliser</strong>, c'est décrire à l'avance, sur le papier, les informations à mémoriser et leurs liens. On conçoit d'abord, on code ensuite : le modèle est au programmeur ce que le plan de l'architecte est au maçon — on ne monte pas les murs avant d'avoir dessiné la maison.</p>
<div class="tip">Un bon modèle évite la <strong>redondance</strong> (une même donnée stockée plusieurs fois — comme noter l'adresse d'un ami dans trois carnets différents) et garantit la <strong>cohérence</strong> (pas de contradiction entre deux copies : si l'ami déménage, on ne risque pas de garder deux adresses différentes).</div>

<h3>2. Merise, une méthode française de conception</h3>
<p><strong>Merise</strong> est une méthode d'analyse et de conception de systèmes d'information, née en France dans les années 1970-80. Un <strong>système d'information</strong>, c'est l'ensemble des données et des actions qui font tourner une organisation (les inscriptions d'une école, les locations d'un magasin…). L'idée forte de Merise : <strong>séparer les données des traitements</strong>, et raisonner par <strong>niveaux d'abstraction</strong>. <strong>Abstraire</strong> veut dire ignorer volontairement les détails pour ne garder que l'essentiel : on regarde d'abord le problème de très loin (le sens, sans technique), puis de plus en plus près (jusqu'à la base réelle). Nous nous concentrons ici sur les <strong>données</strong>.</p>

<h3>3. Les trois niveaux pour les données</h3>
<p>Merise décrit les données à trois niveaux, du plus abstrait au plus concret. Dans le schéma ci-dessous, tout ce qui suit un <code>//</code> est un <strong>commentaire</strong> : une explication écrite pour l'humain, qui ne fait pas partie du modèle lui-même.</p>
<pre class="pseudo">NIVEAU CONCEPTUEL  ->  MCD  (Modèle Conceptuel de Données)    // niveau 1 : le SENS métier, le plus abstrait
    « QUOI ? »          entités, associations, cardinalités    // on décrit QUELLES choses et QUELS liens existent
    indépendant de toute technique                            // aucun logiciel n'est encore choisi à ce stade

NIVEAU LOGIQUE     ->  MLD  (Modèle Logique de Données)        // niveau 2 : l'ORGANISATION en tables
    « avec QUELLE organisation ? »                            // on adopte le modèle relationnel (des tableaux reliés)
    tables, clés primaires, clés étrangères (le relationnel)   // les entités deviennent des tables reliées par des clés

NIVEAU PHYSIQUE    ->  MPD  (Modèle Physique de Données)       // niveau 3 : le CONCRET, pour un logiciel précis
    « avec QUEL logiciel ? »                                   // MySQL ? SQL Server ? Oracle ?
    types SQL, index, contraintes propres au SGBD             // détails techniques qui dépendent du SGBD choisi</pre>
<p>Le <strong>MCD</strong> exprime le sens, sans se soucier de la technologie — comme dire « je veux une maison avec trois chambres et un jardin » sans préciser les matériaux. Le <strong>MLD</strong> traduit ce sens en <strong>tables</strong> (des tableaux à lignes et colonnes) reliées par des <strong>clés</strong>. Le <strong>MPD</strong> descend au niveau d'un SGBD précis (MySQL, SQL Server…) avec ses <strong>types</strong> (nombre, texte, date…) et ses optimisations.</p>
<div class="tip">On descend toujours dans le même ordre : MCD → MLD → MPD. Chaque niveau se déduit du précédent par des règles précises (que ce cours détaille), comme une recette qu'on suit étape par étape.</div>

<h3>4. Le vocabulaire de base du MCD</h3>
<p>Cinq mots clés à retenir dès aujourd'hui, détaillés dans les prochaines leçons. Chaque ligne est expliquée après le <code>//</code> :</p>
<pre class="pseudo">ENTITÉ      : une « chose » du métier dont on mémorise des infos (JEU, CLIENT)   // un type d'objet réel qu'on veut retenir
PROPRIÉTÉ   : une information élémentaire d'une entité (titre, email)            // un détail simple qui décrit l'entité
IDENTIFIANT : la propriété qui distingue chaque occurrence (idJeu)              // le « numéro unique » qui évite toute confusion
ASSOCIATION : un lien entre entités (un client LOUE un jeu)                     // le verbe qui relie deux entités
CARDINALITÉ : « combien de fois ? » sur chaque patte d'une association          // le nombre de liens possibles (1 ? plusieurs ?)</pre>

<h3>5. Données ou traitements ?</h3>
<p>Merise distingue le modèle des <strong>données</strong> (ce qu'on mémorise : les clients, les jeux…) et celui des <strong>traitements</strong> (ce qu'on FAIT avec : les processus et les règles de gestion, comme « un client ne peut pas louer plus de 3 jeux à la fois »). Concevoir une base de données concerne surtout les données : c'est notre fil conducteur, du MCD au MPD.</p>
<div class="warn">Ne confonds pas MODÈLE et BASE : le modèle est un schéma abstrait sur papier (le plan) ; la base de données est sa réalisation concrète dans un SGBD (la maison construite). On valide le modèle AVANT de créer la base.</div>`,
  exercises: [
    { type: "qcm", q: "Modéliser une base de données, c'est d'abord…", opts: ["Écrire du SQL directement", "Décrire sur le papier les informations à mémoriser et leurs liens", "Installer un SGBD", "Concevoir l'interface utilisateur"], a: 1, exp: "On conçoit le plan avant de construire." },
    { type: "qcm", q: "Merise est…", opts: ["Un logiciel de base de données", "Une méthode d'analyse et de conception de systèmes d'information", "Un langage de requêtes", "Une norme de stockage des fichiers"], a: 1, exp: "Une méthode, pas un outil." },
    { type: "qcm", q: "Une idée forte de Merise :", opts: ["Fusionner données et traitements", "Séparer les données des traitements et raisonner par niveaux", "Coder avant de concevoir", "Éviter tout schéma préalable"], a: 1, exp: "Séparation données/traitements + niveaux d'abstraction." },
    { type: "qcm", q: "Le MCD correspond au niveau…", opts: ["Physique", "Conceptuel (le sens, indépendant de la technique)", "Logique", "Fonctionnel"], a: 1, exp: "MCD = conceptuel." },
    { type: "qcm", q: "Le MLD correspond au niveau…", opts: ["Conceptuel", "Logique (tables, clés primaires et étrangères)", "Physique", "Organisationnel"], a: 1, exp: "MLD = logique, le relationnel." },
    { type: "qcm", q: "Le MPD correspond au niveau…", opts: ["Conceptuel", "Physique (types SQL, index, propre au SGBD)", "Logique", "Abstrait"], a: 1, exp: "MPD = physique, dépendant du SGBD." },
    { type: "qcm", q: "Dans quel ordre descend-on ?", opts: ["MPD → MLD → MCD", "MCD → MLD → MPD", "MLD → MCD → MPD", "N'importe lequel"], a: 1, exp: "Du plus abstrait au plus concret." },
    { type: "qcm", q: "Une ENTITÉ, c'est…", opts: ["Un lien", "Une « chose » du métier dont on mémorise des informations", "Un nombre", "Une requête"], a: 1, exp: "JEU, CLIENT… sont des entités." },
    { type: "qcm", q: "Une PROPRIÉTÉ, c'est…", opts: ["Une entité", "Une information élémentaire d'une entité (titre, email)", "Une table", "Un index"], a: 1, exp: "Une donnée atomique décrivant l'entité." },
    { type: "qcm", q: "Une ASSOCIATION, c'est…", opts: ["Une propriété", "Un lien entre entités (un client loue un jeu)", "Une clé primaire", "Un type SQL"], a: 1, exp: "Le lien métier entre entités." },
    { type: "qcm", q: "Le principal défaut qu'un bon modèle évite :", opts: ["La complexité du code applicatif", "La redondance et l'incohérence des données", "Le trop grand nombre de tables", "L'absence d'interface graphique"], a: 1, exp: "Une donnée à un seul endroit = pas de contradiction." },
    { type: "qcm", q: "Le MCD dépend-il du SGBD choisi (MySQL, SQL Server…) ?", opts: ["Oui, totalement", "Non : il est indépendant de toute technique", "Seulement pour les index", "Uniquement en physique"], a: 1, exp: "Le conceptuel ignore la technologie." },
    { type: "vf", q: "Un modèle de données est un schéma abstrait, distinct de la base réelle créée dans un SGBD.", a: true, exp: "Le modèle est le plan ; la base est la réalisation." },
    { type: "qcm", q: "Merise distingue le modèle des données de celui des…", opts: ["Interfaces", "Traitements (les processus et règles de gestion)", "Sauvegardes", "Rapports"], a: 1, exp: "Données vs traitements." },
    { type: "qcm", q: "La CARDINALITÉ répond à la question…", opts: ["« De quel type ? »", "« Combien de fois ? » sur une patte d'association", "« Où ? »", "« Avec quel logiciel ? »"], a: 1, exp: "Elle quantifie la participation à l'association." }
  ],
  final: {
    title: "Exercice final — Situer les niveaux",
    intro: `<p>On classe trois affirmations sur le bon niveau Merise (le texte après <code>//</code> est un indice) :</p>
<pre class="pseudo">A) « Un JEU est loué par plusieurs CLIENTS. »                               // parle du sens métier : des entités et un lien
B) « La table JEU a une colonne idCategorie, clé étrangère vers CATEGORIE. » // parle de tables et de clés
C) « La colonne titre est un VARCHAR(120) NOT NULL, avec un index. »        // parle de types SQL et d'optimisation</pre>`,
    questions: [
      { type: "qcm", q: "L'affirmation A relève du niveau…", opts: ["Physique", "Conceptuel (MCD)", "Logique", "Organisationnel"], a: 1, exp: "Sens métier, entités et association : conceptuel." },
      { type: "qcm", q: "L'affirmation B relève du niveau…", opts: ["Conceptuel", "Logique (MLD)", "Physique", "Fonctionnel"], a: 1, exp: "Tables et clés étrangères = logique." },
      { type: "qcm", q: "L'affirmation C relève du niveau…", opts: ["Conceptuel", "Physique (MPD)", "Logique", "Abstrait"], a: 1, exp: "Types SQL et index = physique, propre au SGBD." },
      { type: "qcm", q: "Dans quel ordre ont-elles été produites lors de la conception ?", opts: ["C puis B puis A", "A puis B puis C", "B puis A puis C", "Peu importe"], a: 1, exp: "Conceptuel → logique → physique." },
      { type: "vf", q: "L'affirmation A pourrait être écrite sans savoir si on utilisera MySQL ou SQL Server.", a: true, exp: "Le MCD est indépendant du SGBD." }
    ],
    solution: `<pre class="pseudo">A = CONCEPTUEL (MCD)  : le sens métier, sans technique          // QUOI ? des entités et une association
B = LOGIQUE   (MLD)  : tables + clés, le modèle relationnel     // QUELLE organisation ? des tables reliées par des clés
C = PHYSIQUE  (MPD)  : types, index, propres au SGBD            // QUEL logiciel ? les détails propres à MySQL/SQL Server

Ordre de conception : A -> B -> C                              // du plus abstrait au plus concret
Chaque niveau se déduit du précédent par des règles.           // MCD => MLD => MPD, jamais l'inverse</pre>
<p>Tu sais situer chaque décision. Demain : les entités et leurs propriétés.</p>`
  }
};
