  title: "Les entités et leurs propriétés",
  subtitle: "Les briques de base du modèle conceptuel.",
  theory: `
<h3>1. Qu'est-ce qu'une entité ?</h3>
<p>Reprenons depuis zéro. Une <strong>entité</strong> est une catégorie de « choses » du monde réel dont on veut mémoriser des informations : un JEU, un CLIENT, une CATEGORIE. Le mot fait savant, mais l'idée est simple : c'est un <em>type d'objet</em> qui reviendra plusieurs fois. Pense à un tiroir étiqueté « JEU » dans lequel on rangera une fiche par jeu. Dans un schéma Merise, on dessine une entité par un <strong>rectangle</strong>. Par convention, son nom s'écrit au <strong>singulier</strong> et en <strong>majuscules</strong> : on écrit <code>JEU</code> (une seule chose, en majuscules), jamais « jeux » ni « Jeux ».</p>
<p>Chaque exemplaire concret rangé dans ce tiroir s'appelle une <strong>occurrence</strong> (on dit aussi <strong>instance</strong>) : « Catan » et « Azul » sont deux occurrences de l'entité JEU, exactement comme « Marie Dupont » serait une occurrence de l'entité CLIENT. Retiens l'image : l'entité est le tiroir (le modèle général), l'occurrence est une fiche précise rangée dedans.</p>

<h3>2. Les propriétés</h3>
<p>Une <strong>propriété</strong> (on dit aussi <strong>attribut</strong> : les deux mots sont synonymes) est une information élémentaire attachée à une entité — un « petit renseignement » qu'on note sur la fiche. L'entité JEU a par exemple pour propriétés : titre, prixAchat, prixLocation, stock. Dans le schéma, on écrit ces propriétés à l'intérieur du rectangle, sous le nom de l'entité. Dans le bloc ci-dessous, le texte après <code>//</code> est un <strong>commentaire</strong> : une explication pour l'humain, qui ne fait pas partie du modèle.</p>
<pre class="pseudo">JEU                 // le nom de l'entité, au singulier et en MAJUSCULES
  titre             // propriété : le nom du jeu (ex. « Catan »)
  prixAchat         // propriété : combien le magasin a payé le jeu
  prixLocation      // propriété : le prix d'une location facturé au client
  stock             // propriété : combien d'exemplaires sont disponibles</pre>

<h3>3. Une propriété doit être atomique</h3>
<p><strong>Atomique</strong> veut dire « qu'on ne peut plus couper » (comme l'atome, qu'on croyait insécable). Une propriété atomique contient donc <strong>une seule</strong> information indivisible. Le contre-exemple classique : « adresse » qui regroupe la rue, le code postal ET la ville en un seul bloc n'est <strong>pas</strong> atomique — c'est trois informations collées ensemble. On la découpe en trois propriétés séparées. Ci-dessous, la notation <code>CLIENT( ... )</code> liste entre parenthèses les propriétés de l'entité CLIENT ; le texte après <code>--</code> est un commentaire.</p>
<pre class="pseudo">MAUVAIS :  CLIENT( adresse )                 -- « 12 rue Verte 5000 Namur » : 3 infos collées en une
BON     :  CLIENT( rue, codePostal, ville )  -- 3 propriétés atomiques, séparées et exploitables</pre>
<div class="tip">Découper les propriétés composites (composées de plusieurs morceaux) permet plus tard de rechercher, trier ou filtrer sur chaque partie séparément — par exemple retrouver tous les clients dont la ville est « Namur ». Avec une adresse en un seul bloc, ce tri deviendrait un casse-tête.</div>

<h3>4. Pas de propriété calculée ni répétitive</h3>
<p>Deux autres pièges à éviter. Premièrement, on ne mémorise jamais une information qu'on peut <strong>recalculer</strong> à partir d'une autre : l'âge d'une personne se déduit de sa date de naissance (âge = année actuelle − année de naissance). On stocke donc uniquement <code>dateNaissance</code>, et on recalcule l'âge au besoin. Sinon, l'âge stocké deviendrait faux dès le prochain anniversaire ! Deuxièmement, on évite les propriétés <strong>répétitives</strong> — la même idée numérotée plusieurs fois, comme téléphone1, téléphone2, téléphone3. Ce besoin de répéter est le signe qu'il faudra créer plus tard une entité ou une association dédiée.</p>
<pre class="pseudo">MAUVAIS :  CLIENT( age )                          -- calculable : deviendrait faux à chaque anniversaire
BON     :  CLIENT( dateNaissance )                -- on stocke la source, on recalcule l'âge au besoin

MAUVAIS :  CLIENT( tel1, tel2, tel3 )             -- répétitif : et s'il faut un 4e numéro ?
BON     :  une entité TELEPHONE reliée à CLIENT   -- structure souple (vue dans les leçons suivantes)</pre>

<h3>5. Une propriété n'apparaît qu'une fois</h3>
<p>Une même propriété ne doit figurer que dans <strong>une seule</strong> entité : celle où elle a vraiment du sens. Le <code>libelle</code> (le nom, l'intitulé) d'une catégorie appartient à l'entité CATEGORIE, pas à l'entité JEU. Recopier une propriété d'une entité dans une autre crée de la <strong>redondance</strong> (la même donnée stockée à deux endroits) — et la redondance est la source numéro un des <strong>incohérences</strong> (deux copies qui finissent par se contredire).</p>
<div class="warn">Règle d'or : « une donnée, un seul endroit ». Si tu es tenté de recopier une propriété d'une entité vers une autre, c'est presque toujours le signe qu'il faut plutôt créer une <strong>association</strong> entre ces deux entités (leçon 4).</div>`,
  exercises: [
    { type: "qcm", q: "Une entité représente…", opts: ["Un lien entre deux tables", "Une catégorie de « choses » dont on mémorise des infos", "Une couleur", "Une requête SQL"], a: 1, exp: "JEU, CLIENT… sont des entités." },
    { type: "qcm", q: "Le nom d'une entité s'écrit…", opts: ["Au pluriel (JEUX)", "Au singulier (JEU)", "En minuscules", "Avec un chiffre"], a: 1, exp: "Convention : singulier, majuscules." },
    { type: "qcm", q: "Une occurrence de l'entité JEU, c'est…", opts: ["La propriété titre", "Un jeu précis, comme « Catan »", "Une association", "Une table"], a: 1, exp: "Une occurrence = un exemplaire concret." },
    { type: "qcm", q: "Une propriété est…", opts: ["Un lien", "Une information élémentaire d'une entité", "Une entité", "Un index"], a: 1, exp: "titre, email… décrivent l'entité." },
    { type: "qcm", q: "Une propriété doit être…", opts: ["La plus longue possible", "Atomique (une seule information indivisible)", "Calculée", "Répétée"], a: 1, exp: "Atomique = non décomposable." },
    { type: "qcm", q: "« adresse » = rue + code postal + ville. On doit…", opts: ["La garder telle quelle", "La découper en rue, codePostal, ville", "La supprimer", "La calculer"], a: 1, exp: "Une propriété composite se découpe." },
    { type: "qcm", q: "Pour l'âge d'un client, on mémorise…", opts: ["age", "dateNaissance (l'âge se recalcule)", "les deux", "rien"], a: 1, exp: "Pas de propriété calculable." },
    { type: "qcm", q: "tel1, tel2, tel3 dans CLIENT est…", opts: ["Une bonne pratique", "Une propriété répétitive à éviter (future entité/association)", "Obligatoire", "Un identifiant"], a: 1, exp: "Le répétitif annonce une autre structure." },
    { type: "qcm", q: "Le libellé d'une catégorie doit se trouver dans…", opts: ["JEU", "CATEGORIE (là où il a du sens)", "Les deux", "Aucune"], a: 1, exp: "Une donnée, un seul endroit." },
    { type: "qcm", q: "Recopier une propriété d'une entité dans une autre…", opts: ["Améliore les performances", "Crée de la redondance, source d'incohérences", "Est recommandé", "Est obligatoire"], a: 1, exp: "On relie par association plutôt que recopier." },
    { type: "vf", q: "Une même propriété ne doit figurer que dans une seule entité.", a: true, exp: "Règle « une donnée, un seul endroit »." },
    { type: "qcm", q: "On dessine une entité par…", opts: ["Un ovale", "Un rectangle", "Une flèche", "Un losange"], a: 1, exp: "Rectangle pour l'entité ; l'association est un ovale." },
    { type: "qcm", q: "Parmi ces propriétés de JEU, laquelle est mal choisie ?", opts: ["titre", "prixLocation", "nomDuClient (appartient à CLIENT)", "stock"], a: 2, exp: "Le nom du client n'a rien à faire dans JEU." },
    { type: "vf", q: "« dateNaissance » est préférable à « age » car l'âge est calculable.", a: true, exp: "On ne stocke pas ce qui se recalcule." },
    { type: "qcm", q: "Une propriété composite comme « nomComplet » (nom + prénom)…", opts: ["Doit rester groupée", "Se découpe en nom et prenom", "Est un identifiant", "Est une entité"], a: 1, exp: "Atomicité : on sépare nom et prénom." }
  ],
  final: {
    title: "Exercice final — Nettoyer une entité",
    intro: `<p>Voici une entité CLIENT mal conçue. Chaque ligne cache un défaut ; le texte après <code>//</code> le pointe du doigt :</p>
<pre class="pseudo">CLIENT
  nomComplet                  // NON atomique : nom + prénom collés ensemble
  adresse                     // NON atomique : rue + code postal + ville en un bloc
  age                         // CALCULABLE : se déduit de la date de naissance
  tel1                        // RÉPÉTITIF : premier d'une série numérotée
  tel2                        // RÉPÉTITIF : deuxième numéro de la même série
  libelleCategoriePreferee    // MAL PLACÉ : ce libellé appartient à l'entité CATEGORIE</pre>`,
    questions: [
      { type: "qcm", q: "« nomComplet » pose problème car…", opts: ["Trop court", "Non atomique : à découper en nom et prenom", "Calculable", "Répétitif"], a: 1, exp: "Atomicité." },
      { type: "qcm", q: "« adresse » doit devenir…", opts: ["Un identifiant", "rue, codePostal, ville", "Une entité JEU", "age"], a: 1, exp: "Propriété composite à découper." },
      { type: "qcm", q: "« age » doit être…", opts: ["Gardé", "Remplacé par dateNaissance (calculable)", "Dupliqué", "Mis en majuscules"], a: 1, exp: "Pas de donnée calculable." },
      { type: "qcm", q: "« tel1, tel2 » révèle…", opts: ["Une bonne idée", "Une propriété répétitive (future entité TELEPHONE)", "Un identifiant", "Une clé étrangère"], a: 1, exp: "Le répétitif annonce une autre structure." },
      { type: "qcm", q: "« libelleCategoriePreferee » devrait…", opts: ["Rester dans CLIENT", "Provenir d'une entité CATEGORIE via une association", "Être un âge", "Disparaître totalement"], a: 1, exp: "Le libellé appartient à CATEGORIE." }
    ],
    solution: `<pre class="pseudo">CLIENT (corrigé)
  nom                 // découpé depuis nomComplet : atomique
  prenom              // découpé depuis nomComplet : atomique
  rue                 // découpé depuis adresse : atomique
  codePostal          // découpé depuis adresse : atomique
  ville               // découpé depuis adresse : atomique
  dateNaissance       // remplace age : on stocke la source, pas le calcul
  // tel1/tel2  -> entité TELEPHONE reliée à CLIENT   (fini le répétitif)
  // catégorie préférée -> association vers CATEGORIE (le libellé reste dans CATEGORIE)

Principes appliqués : atomicité, pas de calcul, pas de répétition,   // les 4 règles de la leçon
une donnée à un seul endroit.                                        // la règle d'or anti-redondance</pre>
<p>Tes entités sont propres. Demain : comment distinguer chaque occurrence avec un identifiant.</p>`
  }
};
