<script>
var DAY = {
  num: 8,
  title: "Associations porteuses de propriétés",
  subtitle: "Quand une donnée appartient au lien, pas aux entités.",
  theory: `
<h3>1. Le problème</h3>
<p>Voici une vraie colle de débutant. Où ranger la <strong>date de location</strong> ou le <strong>nombre de jours</strong> d'une location ? Cette information ne caractérise PAS le client tout seul (il loue à des dates différentes), ni le jeu tout seul (loué par plusieurs clients à des dates différentes). Elle dépend du <strong>couple</strong> (client, jeu) : autrement dit, elle appartient au <strong>lien</strong> entre eux, c'est-à-dire à l'<strong>association</strong>.</p>

<h3>2. Une association porteuse</h3>
<p>Une association peut posséder ses <em>propres</em> propriétés : on parle alors d'<strong>association porteuse</strong> (ou association-attribut, car elle « porte » des attributs). Dans le schéma, on liste ces propriétés à l'intérieur de l'ovale de l'association, sous son nom. Le texte après <code>//</code> ou <code>--</code> est un commentaire.</p>
<pre class="pseudo">CLIENT 0,n ----( LOUER )---- 0,n JEU   // association N:M entre client et jeu
                 LOUER                 // le nom de l'association...
                   dateDebut           // ...qui porte : la date de début de location
                   nbJours             // le nombre de jours loués
                   montant             // le montant facturé pour cette location</pre>
<div class="tip">Test simple pour trancher : « cette propriété dépend-elle des DEUX entités à la fois ? » Si oui, elle va sur l'association. Si elle ne dépend que d'une seule entité, elle reste dans cette entité.</div>

<h3>3. Surtout fréquent sur les N:M</h3>
<p>Les associations porteuses apparaissent presque toujours sur des associations <strong>N:M</strong> (plusieurs-à-plusieurs). C'est logique : un lien « plusieurs-à-plusieurs » représente des <em>couples</em>, et un couple peut avoir ses propres données (une date, une quantité, une note…).</p>
<pre class="pseudo">ETUDIANT 0,n ----( PASSER )---- 0,n EXAMEN   // N:M : chaque étudiant passe plusieurs examens
                    PASSER
                      note        -- la note dépend du COUPLE (étudiant, examen), de personne d'autre</pre>

<h3>4. Attention à l'identifiant du couple</h3>
<p>Sur un N:M, un même couple (client, jeu) pourrait se répéter : le client reloue le même jeu un autre jour. Dans ce cas, la date fait partie de ce qui <strong>distingue</strong> deux locations différentes ; elle entrera donc dans la clé (l'identifiant) au moment du passage au MLD.</p>
<pre class="pseudo">Si un client peut relouer le même jeu :
  la clé de LOUER au MLD = (idClient, idJeu, dateDebut)   // les 3 ensemble distinguent chaque location</pre>

<h3>5. Ne pas confondre avec une entité</h3>
<p>Si le « lien » devient <strong>riche</strong> (beaucoup de propriétés, un identifiant qui lui est propre, des liens vers encore d'autres entités), on le transforme souvent en <strong>entité</strong> à part entière. Une « LOCATION » avec son numéro, ses dates, son montant et son vendeur est bien plus claire modélisée en entité qu'en simple association porteuse.</p>
<div class="warn">Association porteuse (légère) vs entité (riche) : c'est un choix de conception. Peu de propriétés sur le lien → association porteuse. Beaucoup de propriétés ou des liens supplémentaires → entité dédiée.</div>`,
  exercises: [
    { type: "qcm", q: "Une association porteuse…", opts: ["N'a jamais de propriétés", "Possède ses propres propriétés", "Est une entité", "Est un identifiant"], a: 1, exp: "Elle porte des attributs propres au lien." },
    { type: "qcm", q: "La date de location dépend…", opts: ["Du client seul", "Du jeu seul", "Du couple (client, jeu) : elle va sur l'association", "De la catégorie"], a: 2, exp: "Propriété du lien." },
    { type: "qcm", q: "Le test pour placer une propriété sur l'association :", opts: ["Est-elle courte ?", "Dépend-elle des DEUX entités à la fois ?", "Est-elle un nombre ?", "Est-elle unique ?"], a: 1, exp: "Dépendance des deux entités." },
    { type: "qcm", q: "Les associations porteuses apparaissent surtout sur des…", opts: ["1:1", "1:N", "N:M", "réflexives seulement"], a: 2, exp: "Le N:M représente des couples." },
    { type: "qcm", q: "La note d'un étudiant à un examen se place…", opts: ["Dans ETUDIANT", "Dans EXAMEN", "Sur l'association PASSER", "Nulle part"], a: 2, exp: "Elle dépend de (étudiant, examen)." },
    { type: "qcm", q: "Une propriété qui ne dépend que d'une seule entité…", opts: ["Va sur l'association", "Reste dans cette entité", "Disparaît", "Devient un identifiant"], a: 1, exp: "Seule la dépendance aux deux entités justifie l'association." },
    { type: "qcm", q: "Sur un N:M, si un couple peut se répéter (relouer le même jeu), la date…", opts: ["Est inutile", "Entre dans la clé au MLD pour distinguer les locations", "Va dans le client", "Est calculée"], a: 1, exp: "La clé devient (idClient, idJeu, dateDebut)." },
    { type: "qcm", q: "Un « lien » très riche (identifiant propre, autres liens) devient plutôt…", opts: ["Une propriété", "Une entité à part entière", "Un index", "Une cardinalité"], a: 1, exp: "Ex. une entité LOCATION." },
    { type: "qcm", q: "On liste les propriétés d'une association porteuse…", opts: ["Dans un rectangle", "Dans l'ovale de l'association", "En dehors du schéma", "Dans l'identifiant"], a: 1, exp: "Dans l'ovale, avec le verbe." },
    { type: "vf", q: "Une propriété qui dépend des deux entités reliées se place sur l'association.", a: true, exp: "C'est le principe de l'association porteuse." },
    { type: "qcm", q: "« montant » d'une location est…", opts: ["Une propriété de CLIENT", "Une propriété de l'association LOUER", "Un identifiant de JEU", "Une catégorie"], a: 1, exp: "Il dépend du couple loué." },
    { type: "qcm", q: "Peu de propriétés sur le lien → on choisit…", opts: ["Une entité dédiée", "Une association porteuse (plus léger)", "Rien", "Un index"], a: 1, exp: "Association porteuse pour les cas simples." },
    { type: "qcm", q: "Beaucoup de propriétés + liens supplémentaires → on choisit…", opts: ["Une association porteuse", "Une entité à part entière", "Une cardinalité", "Une couleur"], a: 1, exp: "Entité dédiée, plus claire." },
    { type: "vf", q: "Association porteuse et entité dédiée sont deux façons de modéliser un lien riche.", a: true, exp: "C'est un arbitrage de conception." },
    { type: "qcm", q: "Une association porteuse est aussi appelée…", opts: ["Association-attribut", "Clé primaire", "Entité faible", "Index"], a: 0, exp: "Association-attribut : elle porte des attributs." }
  ],
  final: {
    title: "Exercice final — Placer les propriétés",
    intro: `<p>Une plateforme d'avis : un UTILISATEUR note des PRODUITS. Chaque avis a une note (1 à 5), un commentaire et une date. Le texte après <code>//</code> décrit chaque élément :</p>
<pre class="pseudo">UTILISATEUR( #idUser, pseudo )                    // qui donne l'avis
PRODUIT( #idProduit, nom, prix )                   // ce qui est noté
UTILISATEUR 0,n ----( NOTER )---- 0,n PRODUIT       // N:M : où ranger note, commentaire, date ?</pre>`,
    questions: [
      { type: "qcm", q: "La « note (1 à 5) » se place…", opts: ["Dans UTILISATEUR", "Dans PRODUIT", "Sur l'association NOTER", "Dans l'identifiant"], a: 2, exp: "Elle dépend du couple (user, produit)." },
      { type: "qcm", q: "Le « commentaire » se place…", opts: ["Dans PRODUIT", "Sur l'association NOTER", "Dans UTILISATEUR", "Nulle part"], a: 1, exp: "Propriété du lien également." },
      { type: "qcm", q: "Le « prix » du produit se place…", opts: ["Sur NOTER", "Dans PRODUIT (il ne dépend que du produit)", "Dans UTILISATEUR", "Sur l'identifiant"], a: 1, exp: "Ne dépend que du produit." },
      { type: "qcm", q: "L'association NOTER est de type…", opts: ["1:1", "1:N", "N:M (donc porteuse fréquente)", "réflexive"], a: 2, exp: "Maxi n des deux côtés." },
      { type: "vf", q: "Si un utilisateur ne peut noter un produit qu'une seule fois, la clé au MLD sera (idUser, idProduit).", a: true, exp: "Un couple unique = clé sur les deux identifiants." }
    ],
    solution: `<pre class="pseudo">UTILISATEUR 0,n ----( NOTER )---- 0,n PRODUIT
                       NOTER
                         note          // dépend du couple (user, produit)
                         commentaire   // dépend du couple aussi
                         dateAvis      // dépend du couple aussi

prix reste dans PRODUIT               // il ne dépend QUE du produit
Au MLD : NOTER(#idUser, #idProduit, note, commentaire, dateAvis)  // clé = les 2 identifiants</pre>
<p>Tu sais placer une propriété au bon endroit. Demain : les associations à trois entités.</p>`
  }
};
</script>
