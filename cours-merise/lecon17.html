<script>
var DAY = {
  num: 17,
  title: "Traduire les cas particuliers",
  subtitle: "Héritage, entité faible, ternaire, réflexive au MLD.",
  theory: `
<h3>1. L'entité faible</h3>
<p>Rappel (leçon 12) : une <strong>entité faible</strong> ne peut pas s'identifier seule. Au MLD, sa table reçoit donc une <strong>clé primaire composite</strong> (formée de plusieurs colonnes) : la clé étrangère vers l'entité forte, PLUS son identifiant relatif. Le texte après <code>//</code> est un commentaire.</p>
<pre class="pseudo">MCD :  JEU 1,n --( POSSEDER )-- 1,1 EXEMPLAIRE( #numExemplaire, etat )   // exemplaire = faible
MLD :  EXEMPLAIRE( #idJeu, #numExemplaire, etat )                        // table de l'entité faible
       clé primaire = (idJeu, numExemplaire) , idJeu -> JEU              // clé composite ; idJeu = FK vers JEU</pre>

<h3>2. L'association ternaire</h3>
<p>Rappel (leçon 9) : une ternaire relie trois entités. Au MLD, sa table reçoit les <strong>trois</strong> clés étrangères (la clé primaire est leur combinaison), plus les propriétés portées par l'association.</p>
<pre class="pseudo">MCD :  ( VENDRE: dateVente ) entre CLIENT, JEU, VENDEUR                   // ternaire porteuse
MLD :  VENDRE( #idClient, #idJeu, #idVendeur, dateVente )                // table à 3 FK + la propriété
       idClient -> CLIENT , idJeu -> JEU , idVendeur -> VENDEUR          // chaque FK vers son entité</pre>

<h3>3. L'association réflexive</h3>
<p>Rappel (leçon 10) : une réflexive relie une entité à elle-même. Une réflexive <strong>1:N</strong> ajoute une clé étrangère vers la <strong>même</strong> table (souvent nullable, car le sommet n'a pas de parent). Une réflexive <strong>N:M</strong> crée une table d'association reliant la table à elle-même : deux clés étrangères vers la même table, distinguées par des noms de rôle.</p>
<pre class="pseudo">Réflexive 1:N (hiérarchie) :
  EMPLOYE( #idEmploye, nom, #idChef )        -- idChef pointe vers EMPLOYE ; NULL pour le sommet

Réflexive N:M (nomenclature) :
  COMPOSER( #idComposant, #idCompose, quantite )   -- table de liaison de PIECE avec elle-même
    idComposant -> PIECE , idCompose -> PIECE       -- deux FK vers la même table, deux rôles</pre>

<h3>4. L'héritage : rappel des trois stratégies</h3>
<p>Rappel (leçon 13). Le texte après <code>//</code> commente chaque stratégie.</p>
<pre class="pseudo">A) TOUT dans la table mère (colonne « type » + colonnes nullables)
   UTILISATEUR( #id, nom, email, type, adresse, matricule, niveauAcces )   // une seule table, colonnes vides selon le type

B) MÈRE + FILLES  (le plus courant)
   UTILISATEUR( #id, nom, email, type )              // la mère porte le commun
   CLIENT( #id -> UTILISATEUR, adresse, points )     // fille : clé = FK vers la mère + spécifique
   VENDEUR( #id -> UTILISATEUR, matricule )          // idem

C) FILLES SEULES (commun recopié)
   CLIENT( #id, nom, email, adresse, points )        // le commun (nom, email)...
   VENDEUR( #id, nom, email, matricule )             // ...est RECOPIÉ dans chaque fille (redondance)</pre>
<div class="tip">En stratégie B, la clé primaire de chaque table fille EST aussi une clé étrangère vers la table mère : la même valeur d'identifiant relie l'utilisateur générique et sa spécialisation. Un client n° 7 dans CLIENT correspond à l'utilisateur n° 7 dans UTILISATEUR.</div>

<h3>5. Récapitulatif des recettes</h3>
<p>La première ligne est l'en-tête. Le texte de droite donne la recette de traduction.</p>
<pre class="pseudo">CAS PARTICULIER      TRADUCTION AU MLD                              // en-tête
entité faible        clé composite (FK entité forte + id relatif)    // clé sur 2 colonnes
ternaire             table à 3 clés étrangères                       // une FK par entité
réflexive 1:N        FK vers la même table (nullable)                // ex. idChef -> EMPLOYE
réflexive N:M        table d'association vers la même table           // 2 FK vers la même table
héritage             A (une table) / B (mère+filles) / C (filles seules)  // 3 stratégies au choix</pre>
<div class="warn">Ces recettes complètent les trois règles de base (leçon 15). Ensemble, elles permettent de traduire n'importe quel MCD, si complexe soit-il, en un MLD relationnel complet.</div>`,
  exercises: [
    { type: "qcm", q: "La table d'une entité faible reçoit…", opts: ["Une clé simple", "Une clé primaire composite (FK entité forte + id relatif)", "Aucune clé", "Un index seul"], a: 1, exp: "Ex. (idJeu, numExemplaire)." },
    { type: "qcm", q: "EXEMPLAIRE(#idJeu, #numExemplaire, etat) : idJeu est…", opts: ["Une simple colonne", "À la fois clé étrangère vers JEU et partie de la clé primaire", "Calculé", "Un index"], a: 1, exp: "Double rôle." },
    { type: "qcm", q: "Une ternaire donne une table avec…", opts: ["Une FK", "Trois clés étrangères", "Aucune FK", "Deux tables"], a: 1, exp: "Une FK par entité reliée." },
    { type: "qcm", q: "Une réflexive 1:N ajoute…", opts: ["Une table d'association", "Une clé étrangère vers la même table (souvent nullable)", "Trois FK", "Rien"], a: 1, exp: "Ex. idChef → EMPLOYE." },
    { type: "qcm", q: "Une réflexive N:M donne…", opts: ["Une simple FK", "Une table d'association reliant la table à elle-même", "Un index", "Une colonne calculée"], a: 1, exp: "Deux FK vers la même table." },
    { type: "qcm", q: "En stratégie B (héritage), la clé d'une table fille est aussi…", opts: ["Un index", "Une clé étrangère vers la table mère", "Une propriété calculée", "Une date"], a: 1, exp: "Même valeur d'identifiant." },
    { type: "qcm", q: "La stratégie A (héritage) met tout…", opts: ["Dans des tables séparées", "Dans une seule table (avec colonne type + colonnes nullables)", "Dans un index", "Nulle part"], a: 1, exp: "Table unique, colonnes vides selon le type." },
    { type: "qcm", q: "La stratégie C (héritage) a pour défaut…", opts: ["Trop d'index", "De recopier les propriétés communes", "Aucune clé", "Trop de FK"], a: 1, exp: "Redondance du commun." },
    { type: "qcm", q: "COMPOSER(#idComposant, #idCompose, quantite) traduit…", opts: ["Une ternaire", "Une réflexive N:M (nomenclature)", "Un héritage", "Une entité faible"], a: 1, exp: "Deux FK vers PIECE." },
    { type: "qcm", q: "idChef dans EMPLOYE est nullable pour…", opts: ["Tous les employés", "Le sommet de la hiérarchie (sans chef)", "Personne", "Les index"], a: 1, exp: "Le grand patron n'a pas de chef." },
    { type: "vf", q: "Une ternaire au MLD ressemble à un N:M mais avec trois clés étrangères.", a: true, exp: "Table d'association à 3 FK." },
    { type: "qcm", q: "La clé primaire d'une table de ternaire est…", opts: ["Une seule FK", "La combinaison des trois clés étrangères", "La date seule", "Absente"], a: 1, exp: "(idA, idB, idC)." },
    { type: "qcm", q: "En stratégie B, la colonne « type » de la table mère sert à…", opts: ["Générer la clé primaire", "Indiquer la sous-entité concernée", "Calculer", "Trier"], a: 1, exp: "Repérer le sous-type." },
    { type: "vf", q: "Les recettes des cas particuliers complètent les trois règles de base.", a: true, exp: "Ensemble, elles couvrent tout MCD." },
    { type: "qcm", q: "Pour une réflexive N:M avec rôles, les deux FK pointent…", opts: ["Vers deux tables différentes", "Vers la même table (avec noms de rôle distincts)", "Nulle part", "Vers un index"], a: 1, exp: "idComposant et idCompose → PIECE." }
  ],
  final: {
    title: "Exercice final — Traduire un modèle riche",
    intro: `<p>MCD à traduire. Le texte après <code>--</code> rappelle le cas particulier de chaque ligne :</p>
<pre class="pseudo">PERSONNE( #idPersonne, nom, email )       -- généralise (héritage)
   △ (partition)  CLIENT(points) / EMPLOYE(salaire)   -- deux sous-entités
COMMANDE( #idCommande, date )              -- entité normale
LIGNE( #numLigne, quantite )               -- entité FAIBLE / COMMANDE
COMMANDE 1,n --( CONTENIR )-- 1,1 LIGNE     -- la ligne dépend de sa commande
CLIENT 0,n --( PASSER )-- 1,1 COMMANDE      -- 1:N : FK côté COMMANDE</pre>`,
    questions: [
      { type: "qcm", q: "L'héritage PERSONNE (stratégie B) donne…", opts: ["Une seule table", "PERSONNE + CLIENT + EMPLOYE reliées par la clé", "Aucune table", "Trois tables sans lien"], a: 1, exp: "Mère + filles." },
      { type: "qcm", q: "La table LIGNE (faible) a pour clé primaire…", opts: ["numLigne", "(idCommande, numLigne)", "idCommande", "quantite"], a: 1, exp: "FK commande + numéro relatif." },
      { type: "qcm", q: "L'association PASSER (1:N) ajoute…", opts: ["Une table", "idClient dans COMMANDE", "idCommande dans CLIENT", "Rien"], a: 1, exp: "FK côté « n » (COMMANDE)." },
      { type: "qcm", q: "CLIENT.idPersonne est…", opts: ["Une simple colonne", "Clé primaire ET clé étrangère vers PERSONNE", "Calculé", "Un index"], a: 1, exp: "Stratégie B : clé fille = FK mère." },
      { type: "vf", q: "On obtient les tables PERSONNE, CLIENT, EMPLOYE, COMMANDE, LIGNE.", a: true, exp: "5 tables au total." }
    ],
    solution: `<pre class="pseudo">PERSONNE( #idPersonne, nom, email, type )      // mère de l'héritage
CLIENT( #idPersonne -> PERSONNE, points )       // fille : clé = FK vers la mère
EMPLOYE( #idPersonne -> PERSONNE, salaire )      // fille : clé = FK vers la mère
COMMANDE( #idCommande, date, #idClient )        -- idClient -> CLIENT (le 1:N PASSER)
LIGNE( #idCommande, #numLigne, quantite )       -- clé composite (idCommande, numLigne)
       idCommande -> COMMANDE                    // l'entité faible dépend de sa commande</pre>
<p>Tu traduis les modèles complexes. Demain : le MLD relationnel complet et l'intégrité référentielle.</p>`
  }
};
</script>
