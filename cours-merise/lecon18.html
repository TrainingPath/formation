<script>
var DAY = {
  num: 18,
  title: "Le MLD relationnel : clés primaires et étrangères",
  subtitle: "Assembler un MLD complet et garantir sa cohérence.",
  theory: `
<h3>1. La notation du MLD</h3>
<p>Un MLD s'écrit comme une simple liste de tables. Dans chaque table : la <strong>clé primaire</strong> (l'identifiant de la table) est soulignée — ici on la marque d'un <code>#</code> — et les <strong>clés étrangères</strong> (les colonnes qui pointent vers une autre table) sont signalées par une flèche <code>-&gt;</code> vers la table cible. Le texte après <code>//</code> serait un commentaire.</p>
<pre class="pseudo">CATEGORIE( #idCategorie, libelle )                        // table simple : une clé primaire
JEU( #idJeu, titre, prix, #idCategorie -> CATEGORIE )      // idCategorie = clé étrangère vers CATEGORIE
CLIENT( #idClient, nom )                                   // table simple
LOUER( #idClient -> CLIENT, #idJeu -> JEU, dateDebut )     // table d'association : 2 FK dans la clé</pre>

<h3>2. La clé primaire</h3>
<p>La <strong>clé primaire</strong> (en anglais <em>primary key</em>, d'où « PK ») identifie de façon unique chaque ligne d'une table. Elle est unique (deux lignes ne peuvent pas partager la même valeur), non nulle (jamais vide) et stable (elle ne change pas). Elle peut être <strong>simple</strong> (une seule colonne) ou <strong>composite</strong> (plusieurs colonnes réunies, comme dans les tables d'association).</p>

<h3>3. La clé étrangère</h3>
<p>Une <strong>clé étrangère</strong> (en anglais <em>foreign key</em>, d'où « FK ») est une colonne (ou un groupe de colonnes) qui référence la clé primaire d'une AUTRE table (ou de la même, pour une réflexive). C'est elle qui matérialise concrètement les associations du MCD et garantit la cohérence des liens.</p>
<pre class="pseudo">JEU.idCategorie  -> CATEGORIE.idCategorie                  // la colonne idCategorie de JEU pointe vers CATEGORIE
  chaque jeu pointe vers une catégorie qui EXISTE réellement   // pas de lien vers le vide</pre>

<h3>4. L'intégrité référentielle</h3>
<p>L'<strong>intégrité référentielle</strong> est la règle qui interdit une clé étrangère « dans le vide » : un jeu ne peut pas référencer une catégorie inexistante. Le SGBD la fait respecter grâce à la contrainte <code>FOREIGN KEY</code>. Elle protège aussi les suppressions, en répondant à la question : que devient un jeu si on supprime sa catégorie ? Le texte après <code>:</code> décrit chaque option.</p>
<pre class="pseudo">Options de suppression (détaillées en SQL) :
  RESTRICT : interdit de supprimer une catégorie encore utilisée   // on protège les jeux liés
  CASCADE  : supprime aussi les jeux de la catégorie                // la suppression se propage
  SET NULL : met idCategorie à NULL dans les jeux concernés          // le lien se vide, le jeu reste</pre>

<h3>5. Vérifier un MLD complet</h3>
<p>Avant de passer au SQL, on coche chaque point (☐ = case à cocher). Le texte après <code>//</code> précise.</p>
<pre class="pseudo">☐ chaque table a une clé primaire                          // sinon on ne distingue pas les lignes
☐ chaque clé étrangère référence une clé primaire EXISTANTE // pas de référence orpheline
☐ les types de la FK et de la PK référencée correspondent   // même type, sinon comparaison impossible
☐ les tables d'association ont une clé composée des FK       // ex. (idClient, idJeu)
☐ aucune information dupliquée entre tables (3FN)            // pas de redondance</pre>
<div class="tip">Le MLD est le dernier arrêt avant le SQL : bien fait, il se traduit presque ligne à ligne en instructions <code>CREATE TABLE</code> (vues dans les cours SQL, SQL Server, MySQL). Une erreur ici se paie cher plus tard.</div>`,
  exercises: [
    { type: "qcm", q: "Dans un MLD, la clé primaire est notée…", opts: ["En rouge", "Soulignée (ou #)", "Entre parenthèses", "Barrée"], a: 1, exp: "Convention d'écriture." },
    { type: "qcm", q: "La clé primaire identifie…", opts: ["Une colonne", "De façon unique chaque ligne d'une table", "Une base", "Un index"], a: 1, exp: "Unicité de la ligne." },
    { type: "qcm", q: "Une clé primaire composite…", opts: ["N'existe pas", "Regroupe plusieurs colonnes (tables d'association)", "Est toujours un idBanc", "Est calculée"], a: 1, exp: "Ex. (idClient, idJeu)." },
    { type: "qcm", q: "Une clé étrangère référence…", opts: ["Un index", "La clé primaire d'une autre table (ou de la même)", "Une propriété calculée", "Une couleur"], a: 1, exp: "Elle matérialise l'association." },
    { type: "qcm", q: "L'intégrité référentielle garantit que…", opts: ["Les couleurs sont cohérentes", "Une clé étrangère pointe toujours vers une clé primaire existante", "Les index sont rapides", "Les noms sont uniques"], a: 1, exp: "Pas de référence « dans le vide »." },
    { type: "qcm", q: "La contrainte qui fait respecter l'intégrité référentielle est…", opts: ["PRIMARY KEY", "FOREIGN KEY", "UNIQUE", "INDEX"], a: 1, exp: "FOREIGN KEY relie les tables." },
    { type: "qcm", q: "Supprimer une catégorie avec l'option CASCADE…", opts: ["Interdit la suppression", "Supprime aussi les jeux de cette catégorie", "Met les jeux à NULL", "Ne fait rien"], a: 1, exp: "Propagation de la suppression." },
    { type: "qcm", q: "L'option RESTRICT lors d'une suppression…", opts: ["Supprime tout", "Interdit de supprimer une ligne encore référencée", "Met à NULL", "Duplique"], a: 1, exp: "Protège les liens existants." },
    { type: "qcm", q: "L'option SET NULL…", opts: ["Supprime les jeux", "Met la clé étrangère à NULL dans les lignes concernées", "Interdit tout", "Recopie la catégorie"], a: 1, exp: "Le lien devient vide, la ligne reste." },
    { type: "qcm", q: "Les types de la clé étrangère et de la clé primaire référencée doivent…", opts: ["Être différents", "Correspondre", "Être des couleurs", "Être nuls"], a: 1, exp: "Sinon la référence est impossible." },
    { type: "vf", q: "Chaque table d'un MLD doit avoir une clé primaire.", a: true, exp: "Sinon on ne distingue pas les lignes." },
    { type: "qcm", q: "Une table d'association a une clé primaire…", opts: ["Simple toujours", "Composée des clés étrangères", "Absente", "Calculée"], a: 1, exp: "Ex. (idA, idB)." },
    { type: "qcm", q: "Le MLD bien fait se traduit presque ligne à ligne en…", opts: ["HTML", "CREATE TABLE (SQL)", "Python", "CSS"], a: 1, exp: "Dernier arrêt avant le SQL." },
    { type: "vf", q: "Une clé étrangère peut référencer la même table (cas réflexif).", a: true, exp: "Ex. idChef → EMPLOYE." },
    { type: "qcm", q: "Aucune information dupliquée entre tables correspond à…", opts: ["La 1FN", "La 3FN / bonne normalisation", "Un index", "Une couleur"], a: 1, exp: "Pas de redondance." }
  ],
  final: {
    title: "Exercice final — Contrôler un MLD",
    intro: `<p>On vous soumet ce MLD. Le texte après <code>//</code> attire l'attention sur les points à vérifier :</p>
<pre class="pseudo">CATEGORIE( #idCategorie, libelle )                    // OK : clé primaire présente
JEU( #idJeu, titre, #idCategorie -> CATEGORIE )        // OK : FK vers CATEGORIE
CLIENT( nom, email )                                   // suspect : où est la clé primaire ?
LOUER( #idClient, #idJeu, dateDebut )                  // les FK ciblent-elles des PK existantes ?</pre>`,
    questions: [
      { type: "qcm", q: "Quel est le défaut de la table CLIENT ?", opts: ["Trop de colonnes", "Aucune clé primaire", "Une clé étrangère en trop", "Un index manquant"], a: 1, exp: "Il faut #idClient." },
      { type: "qcm", q: "Dans LOUER, idClient devrait être…", opts: ["Une simple colonne", "Une clé étrangère vers CLIENT (et partie de la clé)", "Calculée", "Supprimée"], a: 1, exp: "FK + clé composite." },
      { type: "qcm", q: "La clé primaire de LOUER est…", opts: ["idClient seul", "(idClient, idJeu, dateDebut)", "dateDebut", "idJeu seul"], a: 1, exp: "Composite (avec date pour relouer)." },
      { type: "qcm", q: "JEU.idCategorie doit référencer…", opts: ["N'importe quoi", "Une clé primaire existante de CATEGORIE", "Un index", "Une couleur"], a: 1, exp: "Intégrité référentielle." },
      { type: "vf", q: "Sans clé primaire sur CLIENT, LOUER ne peut pas référencer un client de façon fiable.", a: true, exp: "La FK a besoin d'une PK cible." }
    ],
    solution: `<pre class="pseudo">CATEGORIE( #idCategorie, libelle )
CLIENT( #idClient, nom, email )                    -- clé primaire ajoutée
JEU( #idJeu, titre, #idCategorie -> CATEGORIE )
LOUER( #idClient -> CLIENT, #idJeu -> JEU, dateDebut )
  clé primaire = (idClient, idJeu, dateDebut)       // clé composite (date pour relouer)

Chaque table a une clé primaire ; chaque FK cible une PK existante.   // MLD cohérent</pre>
<p>Ton MLD est cohérent. Demain : descendre au physique (types, index, SQL).</p>`
  }
};
</script>

    ],
    solution: "SALLE( #idSalle, nom )\nFILM( #idFilm, titre )\nSEANCE( #idSeance, horaire, #idSalle -> SALLE, #idFilm -> FILM )\n  idSalle NOT NULL , idFilm NOT NULL\nSPECTATEUR( #idSpectateur, nom )\nRESERVER( #idSpectateur -> SPECTATEUR, #idSeance -> SEANCE, nbPlaces )\n  clé primaire = (idSpectateur, idSeance)\n\nContrôle : 5 tables, chaque table a une PK, chaque FK cible une PK existante,\nla table d'association a une clé composée de ses deux FK.",
    note: "Deux associations 1:N aboutissant à SEANCE y déposent deux clés étrangères (salle et film) ; la N:M porteuse RESERVER devient une table dont la clé combine ses deux FK et qui porte nbPlaces. Le contrôle final vérifie l'existence de chaque cible." }
  ]
