<script>
var DAY = {
  num: 3,
  title: "L'identifiant d'une entité",
  subtitle: "Ce qui distingue chaque occurrence, sans ambiguïté.",
  theory: `
<h3>1. Le rôle de l'identifiant</h3>
<p>Un <strong>identifiant</strong> est une propriété (ou un groupe de propriétés) dont la valeur est <strong>unique</strong> pour chaque occurrence de l'entité, et jamais vide. « Unique » veut dire que deux occurrences ne partagent jamais la même valeur ; c'est comme le numéro de sécurité sociale d'une personne ou le numéro d'un dossard à une course : il désigne une seule personne, sans confusion possible. L'identifiant sert à pointer sans ambiguïté « ce client-là » ou « ce jeu-là », même si deux clients ont le même nom. Dans un schéma, on le <strong>souligne</strong> ; dans ce cours, on le repère aussi par un <code>#</code> devant son nom. Le texte après <code>//</code> est un commentaire pour l'humain.</p>
<pre class="pseudo">JEU                              // l'entité
  #idJeu        (identifiant)    // le # signale l'identifiant : unique et jamais vide
  titre                          // propriété ordinaire : peut être partagée par deux jeux
  prixLocation                   // propriété ordinaire</pre>
<div class="warn">Toute entité DOIT posséder exactement un identifiant. Une entité sans identifiant n'en est pas une : c'est probablement une propriété mal placée qui aurait dû rester dans une autre entité.</div>

<h3>2. Deux valeurs identiques interdites</h3>
<p>Puisque l'identifiant est unique, deux occurrences différentes ne peuvent JAMAIS avoir le même identifiant. C'est pourquoi le titre d'un jeu ne fait pas un bon identifiant : deux éditions différentes peuvent porter exactement le même titre (« Monopoly » édition classique et édition de luxe). Si le titre servait d'identifiant, l'ordinateur croirait qu'il s'agit du même jeu. On préfère donc un identifiant dont on est certain qu'il ne se répétera jamais.</p>

<h3>3. Identifiant naturel ou artificiel ?</h3>
<p>Un identifiant <strong>naturel</strong> vient déjà du métier, il existe dans la vraie vie : le numéro ISBN d'un livre, le numéro de registre national d'une personne. Un identifiant <strong>artificiel</strong> (ou technique) est au contraire un numéro qu'on <em>invente</em> nous-mêmes pour la base : <code>idJeu</code>, <code>idClient</code>. Il est souvent <strong>auto-incrémenté</strong>, c'est-à-dire que le logiciel attribue automatiquement 1, puis 2, puis 3… à chaque nouvelle occurrence.</p>
<pre class="pseudo">Naturel    :  LIVRE( #isbn, titre )     -- l'ISBN existe déjà sur le livre : on le réutilise
Artificiel :  JEU(  #idJeu, titre )     -- numéro qu'on invente pour la base, stable et neutre</pre>
<div class="tip">On privilégie souvent un identifiant artificiel : il est court, <strong>stable</strong> (ne change jamais) et neutre (il ne « veut rien dire », donc rien ne pousse à le modifier). Un identifiant naturel « parlant » peut changer un jour — et un identifiant ne doit jamais changer.</div>

<h3>4. Un bon identifiant : les critères</h3>
<p>Un identifiant fiable respecte quatre critères. Le texte après <code>//</code> donne un exemple concret de ce qui arrive quand le critère n'est pas respecté.</p>
<pre class="pseudo">UNIQUE   : deux occurrences ne partagent jamais la même valeur   // sinon on confond deux clients
NON NUL  : chaque occurrence en a forcément une                  // sinon on ne peut pas la désigner
STABLE   : sa valeur ne change jamais durant la vie de l'occurrence  // un id qui change casse les liens
MINIMAL  : pas plus de propriétés que nécessaire pour être unique    // on n'ajoute rien d'inutile</pre>

<h3>5. Identifiant composé</h3>
<p>Parfois, une seule propriété ne suffit pas à garantir l'unicité : l'identifiant est alors <strong>composé</strong> de plusieurs propriétés qui, réunies, deviennent uniques. Exemple : une place de spectacle. La rangée « A » n'est pas unique (il y a plusieurs sièges en rangée A), et le numéro « 12 » non plus (il existe un siège 12 dans chaque rangée) ; mais le couple (rangée A, numéro 12) désigne un seul siège. On y reviendra avec les entités faibles et les tables d'association.</p>
<pre class="pseudo">PLACE
  #rangee     ┐ ensemble = identifiant composé   // ni la rangée seule...
  #numero     ┘                                   // ...ni le numéro seul ne suffisent
  (une seule des deux ne suffit pas à être unique)  // c'est le COUPLE qui identifie</pre>`,
  exercises: [
    { type: "qcm", q: "Un identifiant est une propriété…", opts: ["La plus longue", "Unique et non nulle pour chaque occurrence", "Toujours calculée", "Facultative"], a: 1, exp: "Unique + non nul = distingue chaque occurrence." },
    { type: "qcm", q: "Combien d'identifiants une entité doit-elle avoir ?", opts: ["Zéro", "Exactement un", "Au moins trois", "Autant que de propriétés"], a: 1, exp: "Toute entité a un identifiant, et un seul (principal)." },
    { type: "qcm", q: "Le titre d'un jeu est-il un bon identifiant ?", opts: ["Oui toujours", "Non : deux jeux peuvent partager le même titre", "Oui si court", "Oui si en majuscules"], a: 1, exp: "Risque de doublons : mauvais identifiant." },
    { type: "qcm", q: "Un identifiant NATUREL…", opts: ["Est inventé de toutes pièces", "Vient du métier (ISBN, n° de registre)", "Est toujours idJeu", "N'existe pas"], a: 1, exp: "Il préexiste dans le domaine." },
    { type: "qcm", q: "Un identifiant ARTIFICIEL…", opts: ["Vient du métier", "Est un numéro inventé (idJeu), souvent auto-incrémenté", "Change souvent", "Est le titre"], a: 1, exp: "Numéro technique, neutre et stable." },
    { type: "qcm", q: "Pourquoi préférer souvent un identifiant artificiel ?", opts: ["Il est plus joli", "Il est court, stable et neutre (ne change jamais)", "Il est obligatoire en SQL", "Il est calculé"], a: 1, exp: "Stabilité et neutralité." },
    { type: "qcm", q: "Un identifiant doit être STABLE, c'est-à-dire…", opts: ["Rapide", "Sa valeur ne change jamais durant la vie de l'occurrence", "Long", "Coloré"], a: 1, exp: "On ne modifie jamais un identifiant." },
    { type: "qcm", q: "Un identifiant MINIMAL…", opts: ["Contient toutes les propriétés", "Ne contient pas plus que nécessaire pour être unique", "Est toujours composé", "Est nul"], a: 1, exp: "Aucune propriété superflue." },
    { type: "qcm", q: "Un identifiant COMPOSÉ…", opts: ["Est interdit", "Regroupe plusieurs propriétés qui, ensemble, sont uniques", "Est toujours un âge", "N'a pas de valeur"], a: 1, exp: "Ex. (rangee, numero) pour une place." },
    { type: "qcm", q: "Dans PLACE(#rangee, #numero), la rangée seule…", opts: ["Suffit à identifier", "Ne suffit pas : il faut aussi le numéro", "Est calculée", "Est nulle"], a: 1, exp: "L'identifiant est l'ensemble des deux." },
    { type: "vf", q: "Un identifiant ne doit jamais être nul (vide).", a: true, exp: "Chaque occurrence en a forcément une valeur." },
    { type: "qcm", q: "On note l'identifiant en le…", opts: ["Barrant", "Soulignant (ou préfixant par #)", "Mettant en rouge", "Supprimant"], a: 1, exp: "Convention : souligné / #." },
    { type: "qcm", q: "Deux occurrences de CLIENT peuvent-elles avoir le même idClient ?", opts: ["Oui", "Non, jamais", "Si même nom", "Si même ville"], a: 1, exp: "L'unicité l'interdit." },
    { type: "qcm", q: "Un email peut-il servir d'identifiant naturel de CLIENT ?", opts: ["Jamais", "Oui s'il est unique et obligatoire, mais il peut changer", "Toujours sans réserve", "Seulement s'il est court"], a: 1, exp: "Possible, mais un email peut changer : moins stable qu'un id technique." },
    { type: "vf", q: "Une entité sans identifiant est probablement une propriété mal placée.", a: true, exp: "Toute entité a besoin d'un identifiant." }
  ],
  final: {
    title: "Exercice final — Choisir le bon identifiant",
    intro: `<p>Pour l'entité VOITURE, on hésite entre plusieurs identifiants. Le texte après <code>//</code> rappelle ce qu'est chaque candidat :</p>
<pre class="pseudo">VOITURE( marque, modele, couleur, plaque, numeroChassis )   // les propriétés disponibles
Candidats : (marque+modele) ? couleur ? plaque ? numeroChassis ?  // lequel identifie VRAIMENT une voiture ?</pre>`,
    questions: [
      { type: "qcm", q: "(marque + modèle) est-il un bon identifiant ?", opts: ["Oui", "Non : des milliers de voitures identiques existent", "Oui si récent", "Oui si rouge"], a: 1, exp: "Pas unique du tout." },
      { type: "qcm", q: "« couleur » comme identifiant ?", opts: ["Parfait", "Absurde : très nombreuses voitures de même couleur", "Correct si rare", "Oui"], a: 1, exp: "Aucune unicité." },
      { type: "qcm", q: "La plaque d'immatriculation…", opts: ["Est unique mais peut changer (revente, région)", "Ne change jamais", "N'est pas unique", "Est calculée"], a: 0, exp: "Unique mais pas totalement stable." },
      { type: "qcm", q: "Le numéro de châssis (VIN)…", opts: ["Change chaque année", "Est unique ET stable à vie : excellent identifiant naturel", "N'est pas unique", "Est la couleur"], a: 1, exp: "Le VIN identifie la voiture pour toujours." },
      { type: "vf", q: "On pourrait aussi ajouter un idVoiture artificiel auto-incrémenté comme identifiant.", a: true, exp: "Souvent le choix le plus simple et le plus stable." }
    ],
    solution: `<pre class="pseudo">Meilleur identifiant naturel : #numeroChassis   // unique ET stable à vie : idéal
Alternative fréquente        : #idVoiture        // artificiel, auto-incrémenté : simple et neutre

À éviter :
  marque+modèle   // non unique : des milliers de voitures identiques
  couleur         // non unique : d'innombrables voitures de la même couleur
  plaque          // unique mais peut changer (revente, région) -> pas assez stable</pre>
<p>Tu sais choisir un identifiant fiable. Demain : relier les entités entre elles avec des associations.</p>`
  }
};
</script>
