<script>
var DAY = {
  num: 14,
  title: "Vérifier et normaliser son MCD",
  subtitle: "Chasser la redondance avant de traduire en tables.",
  theory: `
<h3>1. Pourquoi normaliser ?</h3>
<p>Un modèle mal conçu stocke la même information à plusieurs endroits. Le danger : on met à jour un endroit et pas l'autre, et les deux copies se contredisent → <strong>incohérence</strong>. La <strong>normalisation</strong> est un ensemble de règles appelées <em>formes normales</em> (abrégées <strong>FN</strong>) qui éliminent ces redondances de façon systématique. Ces formes s'emboîtent : la 2FN suppose la 1FN, la 3FN suppose la 2FN. On les vérifie d'abord sur le MCD, puis sur le MLD.</p>

<h3>2. Première forme normale (1FN)</h3>
<p>Une table est en <strong>1FN</strong> si toutes ses propriétés sont <strong>atomiques</strong> (indivisibles) et s'il n'y a aucun <strong>groupe répétitif</strong> (pas de liste dans une seule case). C'est exactement ce qu'on a vu en leçon 2 : pas d'« adresse » composite, pas de « tel1, tel2, tel3 ». Dans le schéma, le texte après <code>--</code> ou <code>//</code> est un commentaire.</p>
<pre class="pseudo">NON 1FN : CLIENT( id, nom, telephones = "0470…, 081…" )        // plusieurs numéros dans une case = interdit
1FN     : CLIENT( id, nom )  +  TELEPHONE( #idTel, numero, #idClient )   // les numéros éclatés dans leur table</pre>

<h3>3. Deuxième forme normale (2FN)</h3>
<p>Une table est en <strong>2FN</strong> si elle est déjà en 1FN ET si chaque propriété non-clé dépend de la <strong>totalité</strong> de l'identifiant. Cette règle n'a d'intérêt que pour les <strong>clés composées</strong> (formées de plusieurs colonnes). « Non-clé » désigne une propriété qui ne fait pas partie de la clé. Si une telle propriété ne dépend que d'une PARTIE de la clé, elle est mal placée : on la déplace.</p>
<pre class="pseudo">Clé composée (idCommande, idProduit) :
  NON 2FN : nomProduit dans la table LIGNE
            // nomProduit ne dépend que d'idProduit, pas d'idCommande -> viole la 2FN
  2FN     : nomProduit reste dans PRODUIT ; LIGNE ne garde que quantite (qui dépend des DEUX)</pre>

<h3>4. Troisième forme normale (3FN)</h3>
<p>Une table est en <strong>3FN</strong> si elle est déjà en 2FN ET si aucune propriété non-clé ne dépend d'une <strong>autre propriété non-clé</strong>. On parle alors de dépendance <strong>transitive</strong> (« en passant par un intermédiaire »). Exemple : le libellé d'une catégorie ne doit pas être rangé dans JEU, car il dépend d'idCategorie (une autre non-clé), pas d'idJeu.</p>
<pre class="pseudo">NON 3FN : JEU( #idJeu, titre, idCategorie, libelleCategorie )
          // libelleCategorie dépend d'idCategorie (autre non-clé) -> dépendance transitive
3FN     : JEU( #idJeu, titre, #idCategorie )  +  CATEGORIE( #idCategorie, libelle )   // le libellé rejoint CATEGORIE</pre>
<div class="tip">Retenir la 3FN en une phrase : « chaque propriété dépend de la clé, de TOUTE la clé, et de RIEN d'autre que la clé ». Bonne nouvelle : un MCD bien construit avec des entités et des associations est le plus souvent naturellement en 3FN.</div>

<h3>5. La checklist de normalisation</h3>
<p>Le texte après <code>//</code> rappelle la forme normale concernée.</p>
<pre class="pseudo">☐ propriétés atomiques, aucun groupe répétitif          // (1FN)
☐ pas de dépendance sur une PARTIE d'une clé composée   // (2FN)
☐ aucune propriété non-clé qui en détermine une autre   // (3FN)
☐ aucune donnée calculable stockée                      // pas d'age, pas de total figé
☐ aucune information recopiée dans deux entités          // règle « une donnée, un seul endroit »</pre>
<div class="warn">La normalisation évite les anomalies de mise à jour, d'insertion et de suppression. On <strong>dénormalise</strong> parfois volontairement au niveau physique (MPD) pour gagner en performance — mais jamais sans raison, et jamais au niveau conceptuel (MCD).</div>`,
  exercises: [
    { type: "qcm", q: "La normalisation vise à…", opts: ["Accélérer l'affichage des pages", "Éliminer les redondances et les incohérences", "Réduire le nombre de colonnes", "Ajouter des entités"], a: 1, exp: "Des règles contre la redondance." },
    { type: "qcm", q: "La 1FN exige que les propriétés soient…", opts: ["Nombreuses", "Atomiques, sans groupe répétitif", "Calculées", "Recopiées"], a: 1, exp: "Atomicité + pas de répétition." },
    { type: "qcm", q: "« telephones = \"0470…, 081…\" » viole…", opts: ["La 3FN", "La 1FN (non atomique / répétitif)", "Rien", "La 2FN"], a: 1, exp: "À éclater en entité TELEPHONE." },
    { type: "qcm", q: "La 2FN concerne surtout les tables à…", opts: ["Clé simple", "Clé composée", "Aucune clé", "Un index"], a: 1, exp: "Dépendance sur une partie de la clé." },
    { type: "qcm", q: "Dans LIGNE(idCommande, idProduit, nomProduit), nomProduit…", opts: ["Dépend des deux", "Ne dépend que d'idProduit → viole la 2FN", "Est un identifiant", "Est calculé"], a: 1, exp: "Il appartient à PRODUIT." },
    { type: "qcm", q: "La 3FN interdit qu'une propriété non-clé…", opts: ["Existe", "En détermine une autre (dépendance transitive)", "Soit atomique", "Soit unique"], a: 1, exp: "Pas de dépendance entre non-clés." },
    { type: "qcm", q: "« libelleCategorie » dans JEU viole…", opts: ["La 1FN", "La 3FN (dépend d'idCategorie, autre non-clé)", "Rien", "La cardinalité"], a: 1, exp: "Dépendance transitive." },
    { type: "qcm", q: "La phrase-clé de la 3FN :", opts: ["« la clé et rien que la clé »", "« dépendre de la clé, de toute la clé, et de rien d'autre que la clé »", "« calculer si possible »", "« recopier partout »"], a: 1, exp: "Le résumé classique de la 3FN." },
    { type: "qcm", q: "Un MCD bien fait (entités + associations) est souvent…", opts: ["Non normalisé", "Naturellement en 3FN", "En 1FN seulement", "Impossible à normaliser"], a: 1, exp: "La bonne modélisation évite les redondances." },
    { type: "vf", q: "La normalisation évite les anomalies de mise à jour, d'insertion et de suppression.", a: true, exp: "C'est son but principal." },
    { type: "qcm", q: "Une donnée calculable stockée (ex. total)…", opts: ["Est recommandée", "Doit être évitée (redondance)", "Est un identifiant", "Améliore la 3FN"], a: 1, exp: "On recalcule au besoin." },
    { type: "qcm", q: "Dénormaliser au niveau physique…", opts: ["Est interdit", "Se fait parfois pour la performance, avec précaution", "Est le but du MCD", "Est automatique"], a: 1, exp: "Choix physique réfléchi, pas conceptuel." },
    { type: "qcm", q: "Recopier une info dans deux entités viole l'esprit de…", opts: ["La normalisation", "La coloration", "L'indexation", "La cardinalité"], a: 0, exp: "Redondance à proscrire." },
    { type: "vf", q: "On vérifie la normalisation d'abord sur le MCD, puis sur le MLD.", a: true, exp: "Les deux niveaux en bénéficient." },
    { type: "qcm", q: "L'ordre des formes normales est…", opts: ["3FN puis 2FN puis 1FN", "1FN puis 2FN puis 3FN (chacune suppose la précédente)", "Peu importe", "2FN puis 1FN"], a: 1, exp: "Elles s'emboîtent." }
  ],
  final: {
    title: "Exercice final — Normaliser une table",
    intro: `<p>Une table brute d'inscriptions. Le texte après <code>//</code> pointe les colonnes suspectes :</p>
<pre class="pseudo">INSCRIPTION( #idEtudiant, #idCours, nomEtudiant, intituleCours,   // nomEtudiant ? intituleCours ?
             nomProfesseur, note )                                 // nomProfesseur ? seule note dépend du couple
(clé composée : idEtudiant + idCours)                              // deux colonnes forment la clé</pre>`,
    questions: [
      { type: "qcm", q: "« nomEtudiant » dépend…", opts: ["Des deux clés", "Seulement d'idEtudiant → viole la 2FN", "De la note", "De rien"], a: 1, exp: "À remettre dans ETUDIANT." },
      { type: "qcm", q: "« intituleCours » et « nomProfesseur » dépendent…", opts: ["Des deux clés", "Seulement d'idCours → violent la 2FN", "De la note", "De l'étudiant"], a: 1, exp: "À remettre dans COURS." },
      { type: "qcm", q: "Quelle propriété dépend VRAIMENT du couple (étudiant, cours) ?", opts: ["nomEtudiant", "intituleCours", "note", "nomProfesseur"], a: 2, exp: "La note appartient à l'inscription." },
      { type: "qcm", q: "Après normalisation, INSCRIPTION garde…", opts: ["Tout", "idEtudiant, idCours et note", "Seulement la note", "Rien"], a: 1, exp: "Les clés + la propriété du couple." },
      { type: "vf", q: "On crée (ou réutilise) les tables ETUDIANT, COURS pour y loger les propriétés déplacées.", a: true, exp: "Chaque info rejoint son entité." }
    ],
    solution: `<pre class="pseudo">ETUDIANT( #idEtudiant, nomEtudiant )                    // nomEtudiant rejoint son entité
COURS( #idCours, intituleCours, #idProfesseur )          // intitulé + lien vers le prof
PROFESSEUR( #idProfesseur, nomProfesseur )               // le nom du prof dans sa table
INSCRIPTION( #idEtudiant, #idCours, note )               // ne garde que ce qui dépend du couple

La note dépend du couple (étudiant, cours) : elle reste dans INSCRIPTION.   // 2FN respectée
Les autres propriétés rejoignent l'entité dont elles dépendent.            // 2FN et 3FN</pre>
<p>Fin de la semaine 2 : ton MCD est normalisé. Demain : le passage au MLD.</p>`
  }
};
</script>
