<script>
var DAY = {
  num: 13,
  title: "Héritage : généralisation / spécialisation",
  subtitle: "Factoriser le commun, isoler le spécifique.",
  theory: `
<h3>1. L'idée</h3>
<p>Clients, vendeurs et administrateurs partagent des informations communes (nom, prénom, email) mais ont chacun des propriétés bien à eux. Plutôt que tout recopier dans chaque entité (redondance !), on crée une <strong>sur-entité</strong> générique UTILISATEUR qui rassemble le commun, et des <strong>sous-entités</strong> spécialisées (CLIENT, VENDEUR…) qui ajoutent le spécifique. C'est la <strong>généralisation / spécialisation</strong> : l'équivalent, en modélisation, de l'<em>héritage</em> en programmation objet. Dans le schéma, le triangle <code>△</code> symbolise le lien d'héritage.</p>
<pre class="pseudo">        UTILISATEUR( #idUtilisateur, nom, prenom, email )   // sur-entité : les propriétés COMMUNES
             △  (héritage)                                    // le triangle marque la spécialisation
    ┌────────┼────────────┐                                   // trois sous-entités en dessous
 CLIENT    VENDEUR    ADMINISTRATEUR                           // les sous-entités spécialisées
 (adresse, (matricule) (niveauAcces)                          // chacune ajoute SES propriétés
  points)</pre>

<h3>2. Le sens de l'héritage</h3>
<p>La sur-entité porte les propriétés <strong>communes</strong> ; chaque sous-entité ajoute ses propriétés <strong>spécifiques</strong>. On lit le lien avec « est un » : une occurrence de CLIENT « est un » UTILISATEUR. Concrètement, un client hérite de nom, prénom, email (venus du haut) et possède en plus adresse et points de fidélité (qui lui sont propres).</p>

<h3>3. Caractériser l'héritage : (X, T)</h3>
<p>On précise l'héritage avec les deux mêmes lettres que les contraintes de la leçon 11. Le texte après <code>//</code> traduit chacune.</p>
<pre class="pseudo">EXCLUSIF (X)   : un utilisateur appartient à AU PLUS une sous-entité   // pas client ET vendeur en même temps
TOTAL (T)      : un utilisateur appartient à AU MOINS une sous-entité   // pas d'utilisateur « sans type »
PARTITION (X,T): exactement une sous-entité                            // X et T réunies : le cas le plus courant</pre>
<p>Pour fixer (X, T), on interroge le métier : un utilisateur peut-il être client ET vendeur (alors non exclusif) ? Existe-t-il des utilisateurs qui ne sont d'aucun type (alors non total) ? Les réponses déterminent les lettres.</p>

<h3>4. Trois stratégies de traduction au MLD</h3>
<p>L'héritage n'existant pas tel quel en relationnel, on le traduit de l'une de ces trois façons. Le texte après <code>//</code> ou <code>--</code> commente chaque stratégie.</p>
<pre class="pseudo">A) TOUT dans la sur-entité (une seule table)
   UTILISATEUR(#id, nom, prenom, email, type, adresse, matricule, niveauAcces)   // une table unique
   // colonnes vides selon le type (un client n'a pas de matricule) -> simple mais gaspilleur

B) UNE table par sous-entité (+ table mère)   -- le plus courant
   UTILISATEUR(#id, nom, prenom, email, type)         // la mère porte le commun
   CLIENT(#id->UTILISATEUR, adresse, points)          // fille : clé = FK vers la mère + spécifique
   VENDEUR(#id->UTILISATEUR, matricule)               // idem pour chaque sous-type

C) UNE table par sous-entité SANS table mère
   CLIENT(#id, nom, prenom, email, adresse, points)       // tout dans la fille...
   VENDEUR(#id, nom, prenom, email, matricule)            // ...donc le commun est RECOPIÉ (redondance)</pre>
<div class="tip">La stratégie B (table mère + tables filles) est souvent le meilleur compromis : pas de redondance du commun, pas de colonnes vides massives. La clé des tables filles est aussi une clé étrangère vers la table mère (c'est ce que note <code>#id->UTILISATEUR</code>).</div>

<h3>5. Choisir la bonne stratégie</h3>
<p>Chaque situation penche vers une stratégie. Le texte après <code>//</code> justifie.</p>
<pre class="pseudo">Peu de propriétés spécifiques, peu de sous-types  -> A   // une table suffit, peu de vides
Sous-types riches, partition nette                -> B   // évite redondance ET colonnes vides
Sous-types indépendants, jamais requêtés ensemble -> C   // chaque type vit dans sa table</pre>
<div class="warn">L'héritage n'existe pas directement dans le modèle relationnel : on le SIMULE par l'une de ces stratégies. Le MCD garde l'intention claire (« un client EST un utilisateur ») ; le MLD choisit la réalisation concrète en tables.</div>`,
  exercises: [
    { type: "qcm", q: "La généralisation / spécialisation sert à…", opts: ["Dupliquer les données", "Factoriser les propriétés communes et isoler les spécifiques", "Compter les lignes", "Trier les entités"], a: 1, exp: "L'héritage à la Merise." },
    { type: "qcm", q: "La sur-entité porte…", opts: ["Les propriétés spécifiques", "Les propriétés communes", "Aucune propriété", "Les index"], a: 1, exp: "Le commun est factorisé en haut." },
    { type: "qcm", q: "Chaque sous-entité ajoute…", opts: ["Le commun", "Ses propriétés spécifiques", "Rien", "Un identifiant différent"], a: 1, exp: "Le spécifique descend dans les filles." },
    { type: "qcm", q: "« Un CLIENT est un UTILISATEUR » exprime…", opts: ["Une association N:M", "Un lien d'héritage (is-a)", "Une réflexive", "Une ternaire"], a: 1, exp: "Relation de spécialisation." },
    { type: "qcm", q: "L'héritage EXCLUSIF (X) signifie…", opts: ["Au moins une sous-entité", "Au plus une sous-entité", "Exactement deux", "Aucune règle"], a: 1, exp: "Pas deux types à la fois." },
    { type: "qcm", q: "L'héritage TOTAL (T) signifie…", opts: ["Au plus une", "Au moins une sous-entité (aucun utilisateur « pur »)", "Zéro", "Trois"], a: 1, exp: "Tout utilisateur a un type." },
    { type: "qcm", q: "La PARTITION (X, T) signifie…", opts: ["Au plus une", "Exactement une sous-entité", "Au moins deux", "Aucune"], a: 1, exp: "Le cas le plus courant." },
    { type: "qcm", q: "La stratégie « table mère + tables filles » correspond à…", opts: ["A", "B (souvent le meilleur compromis)", "C", "aucune"], a: 1, exp: "Pas de redondance, pas de colonnes vides." },
    { type: "qcm", q: "La stratégie « tout dans une table » a pour défaut…", opts: ["Trop de jointures nécessaires", "Des colonnes vides selon le type", "Trop de tables séparées", "Aucun identifiant possible"], a: 1, exp: "Colonnes nulles pour les propriétés d'autres types." },
    { type: "qcm", q: "En stratégie B, la clé d'une table fille est aussi…", opts: ["Une propriété commune recopiée", "Une clé étrangère vers la table mère", "Un index", "Calculée"], a: 1, exp: "CLIENT.id → UTILISATEUR.id." },
    { type: "vf", q: "L'héritage n'existe pas directement en relationnel : on le simule.", a: true, exp: "Trois stratégies possibles." },
    { type: "qcm", q: "Si un utilisateur peut être client ET vendeur, l'héritage est…", opts: ["Exclusif", "NON exclusif", "Total", "Une CIF"], a: 1, exp: "Pas d'exclusion : plusieurs types possibles." },
    { type: "qcm", q: "Sous-types riches + partition nette → stratégie…", opts: ["A", "B (mère + filles)", "C sans mère", "aucune"], a: 1, exp: "Le meilleur compromis pour ce cas." },
    { type: "qcm", q: "La stratégie C (tables séparées sans mère) recopie…", opts: ["Rien", "Les propriétés communes dans chaque table", "Les index", "Les identifiants"], a: 1, exp: "Redondance du commun." },
    { type: "vf", q: "Le choix de stratégie dépend du nombre et de la richesse des sous-types.", a: true, exp: "A, B ou C selon le contexte." }
  ],
  final: {
    title: "Exercice final — Spécialiser des véhicules",
    intro: `<p>Un garage gère des VÉHICULES. Tous ont une marque, un modèle, une immatriculation. Mais une VOITURE a un nombre de portes, une MOTO a une cylindrée, un CAMION a un tonnage. Un véhicule est d'exactement un de ces types.</p>`,
    questions: [
      { type: "qcm", q: "La sur-entité VEHICULE porte…", opts: ["Le tonnage", "Les propriétés communes (marque, modèle, immatriculation)", "La cylindrée", "Le nombre de portes"], a: 1, exp: "Le commun est factorisé." },
      { type: "qcm", q: "« nombre de portes » appartient à…", opts: ["VEHICULE", "VOITURE (sous-entité)", "MOTO", "CAMION"], a: 1, exp: "Propriété spécifique de la voiture." },
      { type: "qcm", q: "« un véhicule est d'exactement un type » est un héritage…", opts: ["Non exclusif", "Partition (X, T)", "Total seulement", "Exclusif seulement"], a: 1, exp: "Exactement une sous-entité." },
      { type: "qcm", q: "La stratégie B donnerait…", opts: ["Une seule table fourre-tout", "VEHICULE (commun) + VOITURE/MOTO/CAMION (spécifique) reliées par clé", "Aucune table", "Trois tables sans lien"], a: 1, exp: "Table mère + tables filles." },
      { type: "vf", q: "En stratégie B, VOITURE.id est une clé étrangère vers VEHICULE.id.", a: true, exp: "La fille référence la mère." }
    ],
    solution: `<pre class="pseudo">VEHICULE( #idVehicule, marque, modele, immatriculation, type )   // sur-entité : le commun
   △ (partition X,T)                                             // exactement un sous-type
   ├── VOITURE( #idVehicule -> VEHICULE, nbPortes )               // fille : clé = FK mère + spécifique
   ├── MOTO( #idVehicule -> VEHICULE, cylindree )                 // idem
   └── CAMION( #idVehicule -> VEHICULE, tonnage )                 // idem

Stratégie B : commun dans VEHICULE, spécifique dans chaque fille,   // pas de redondance
clé fille = clé étrangère vers la mère.                             // chaque fille référence VEHICULE</pre>
<p>Tu sais spécialiser proprement. Demain : vérifier et normaliser ton MCD.</p>`
  }
};
</script>

<script>

  { id: "mer-l13", title: "Spécialiser des paiements", level: 4,

    checklist: [
      "La sur-entité PAIEMENT porte-t-elle les propriétés communes (montant, date), et chaque sous-entité ses propriétés spécifiques ?",
      "Le type d'héritage est-il (X,T) : exclusif ET total (exactement un sous-type par paiement) ?",
      "La stratégie B crée-t-elle une table par sous-entité, avec la clé de PAIEMENT comme clé primaire et étrangère ?"
    ],
    hints: [
      "Commun (montant, date) dans PAIEMENT ; spécifique dans chaque sous-entité.",
      "« exactement un type » = partition (X, T).",
      "Stratégie B : table mère PAIEMENT + une table par mode, clé fille = FK vers la mère."
    ],
    solution: "MCD :\n  PAIEMENT( #idPaiement, montant, datePaiement, mode )\n     △ (partition X,T)\n     ├── PAIEMENT_CARTE( numTransaction )\n     ├── PAIEMENT_ESPECES( montantRecu, rendu )\n     └── PAIEMENT_VIREMENT( iban )\n\nMLD (stratégie B) :\n  PAIEMENT( #idPaiement, montant, datePaiement, mode )\n  PAIEMENT_CARTE( #idPaiement -> PAIEMENT, numTransaction )\n  PAIEMENT_ESPECES( #idPaiement -> PAIEMENT, montantRecu, rendu )\n  PAIEMENT_VIREMENT( #idPaiement -> PAIEMENT, iban )",
    note: "La stratégie B convient bien quand les sous-types ont des propriétés spécifiques nettes et une partition claire : le commun ne se répète pas, et chaque table fille reste petite. La colonne « mode » de la mère indique le sous-type." }
  ]
};
