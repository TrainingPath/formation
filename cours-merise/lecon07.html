<script>
var DAY = {
  num: 7,
  title: "Lire et construire un MCD complet",
  subtitle: "Assembler entités, associations et cardinalités en un schéma cohérent.",
  theory: `
<h3>1. La démarche pas à pas</h3>
<p>Rappel : un <strong>MCD</strong> (Modèle Conceptuel de Données) est le schéma qui décrit, sans aucune technique, les « choses » du métier et leurs liens. Le construire, c'est enchaîner dans l'ordre les étapes vues cette semaine. Le texte après <code>//</code> est un commentaire d'aide.</p>
<pre class="pseudo">1) Repérer les ENTITÉS                  // les « choses » du domaine (souvent des noms)
2) Lister leurs PROPRIÉTÉS               // atomiques, non calculées, non répétitives
3) Donner un IDENTIFIANT à chaque entité // le # unique qui distingue chaque occurrence
4) Repérer les ASSOCIATIONS              // les liens entre entités (souvent des verbes)
5) Poser les CARDINALITÉS (mini, maxi)   // le « combien de fois ? » sur chaque patte
6) RELIRE et vérifier                    // lire à voix haute pour traquer les erreurs</pre>

<h3>2. Un exemple filé : la vidéothèque</h3>
<p>Énoncé : « Une vidéothèque prête des films à ses membres. Un film appartient à un genre. Un membre peut emprunter plusieurs films ; un film peut être emprunté par plusieurs membres, à des dates différentes. » On applique la démarche ci-dessus. Rappel de notation : <code>#</code> marque l'identifiant, et <code>0,n</code> / <code>1,1</code> sont les cardinalités.</p>
<pre class="pseudo">MEMBRE( #idMembre, nom, email )      // entité MEMBRE : son identifiant + deux propriétés
FILM( #idFilm, titre, duree )        // entité FILM
GENRE( #idGenre, libelle )           // entité GENRE (« libelle » = le nom du genre)

GENRE 0,n ----( APPARTENIR )---- 1,1 FILM   // un film a 1 seul genre ; un genre regroupe 0..n films
MEMBRE 0,n ----( EMPRUNTER )---- 0,n FILM    // N:M : chacun peut être multiple
              EMPRUNTER porte : dateEmprunt  // la date dépend du lien -> association porteuse</pre>

<h3>3. Lire un MCD à voix haute</h3>
<p>Un bon réflexe de vérification : lire chaque association dans les deux sens, en s'appuyant sur les cardinalités. Si ça sonne juste, le modèle est probablement bon.</p>
<pre class="pseudo">« Un FILM appartient à EXACTEMENT un GENRE »        // 1,1 côté FILM
« Un GENRE regroupe de 0 à plusieurs FILMS »         // 0,n côté GENRE
« Un MEMBRE emprunte de 0 à plusieurs FILMS »        // 0,n côté MEMBRE
« Un FILM est emprunté par 0 à plusieurs MEMBRES »   // 0,n côté FILM</pre>
<div class="tip">Si une phrase lue à voix haute sonne faux (« un film appartient à plusieurs genres » alors que le métier dit un seul), c'est le signe que la cardinalité est à corriger. La lecture est ton meilleur détecteur d'erreurs.</div>

<h3>4. Les erreurs fréquentes à traquer</h3>
<p>Voici les fautes classiques du débutant. Le texte après <code>//</code> rappelle pourquoi c'est un problème.</p>
<pre class="pseudo">- une entité sans identifiant                    // on ne pourrait pas distinguer ses occurrences
- une propriété recopiée dans deux entités        // redondance -> risque d'incohérence
- une propriété calculable (age, total…)          // se recalcule, ne se stocke pas
- une association sans cardinalités               // le « combien ? » manque
- un N:M mal repéré (confondu avec deux 1:N)       // traitement au MLD totalement différent
- une propriété du lien (date) dans une entité     // devrait être sur l'association</pre>

<h3>5. La checklist finale</h3>
<p>Avant de valider un MCD, on coche chaque point (☐ = case à cocher).</p>
<pre class="pseudo">☐ chaque entité a un identifiant unique              // aucune entité orpheline d'identifiant
☐ chaque propriété est atomique et à un seul endroit // atomicité + pas de redondance
☐ chaque association a un verbe et deux cardinalités  // un lien nommé et quantifié
☐ les cardinalités reflètent les règles de gestion    // le modèle colle au métier réel
☐ aucune donnée calculable stockée                   // pas d'age, pas de total figé</pre>`,
  exercises: [
    { type: "qcm", q: "La première étape de construction d'un MCD est…", opts: ["Poser les cardinalités", "Repérer les entités (les noms du domaine)", "Écrire du SQL", "Choisir un SGBD"], a: 1, exp: "On identifie d'abord les entités." },
    { type: "qcm", q: "Après avoir listé entités et propriétés, on…", opts: ["Crée les tables", "Donne un identifiant à chaque entité", "Installe MySQL", "Écrit un index"], a: 1, exp: "Identifiant avant les associations." },
    { type: "qcm", q: "Les associations correspondent souvent aux…", opts: ["Noms", "Verbes du domaine", "Couleurs", "Nombres"], a: 1, exp: "Emprunter, appartenir…" },
    { type: "qcm", q: "Une association sans cardinalités est…", opts: ["Complète", "Incomplète : il manque le « combien »", "Interdite en SQL", "Un identifiant"], a: 1, exp: "Toujours deux cardinalités." },
    { type: "qcm", q: "Lire un MCD à voix haute permet de…", opts: ["Gagner du temps SQL", "Vérifier que les cardinalités reflètent le métier", "Colorier le schéma", "Supprimer des entités"], a: 1, exp: "La lecture révèle les erreurs." },
    { type: "qcm", q: "« un film appartient à 1,1 genre » se lit…", opts: ["Un film a plusieurs genres", "Un film appartient à exactement un genre", "Un genre a un film", "Aucun film n'a de genre"], a: 1, exp: "1,1 = exactement un." },
    { type: "qcm", q: "La date d'emprunt doit être placée…", opts: ["Dans MEMBRE", "Dans FILM", "Sur l'association EMPRUNTER", "Dans GENRE"], a: 2, exp: "Elle dépend du couple membre+film." },
    { type: "qcm", q: "Une propriété recopiée dans deux entités est…", opts: ["Une bonne pratique", "De la redondance à corriger", "Un identifiant", "Obligatoire"], a: 1, exp: "Une donnée, un seul endroit." },
    { type: "qcm", q: "Confondre un N:M avec deux 1:N est…", opts: ["Impossible", "Une erreur fréquente à traquer", "Recommandé", "Sans conséquence"], a: 1, exp: "Le N:M a un traitement différent." },
    { type: "qcm", q: "Dans la checklist, chaque entité doit avoir…", opts: ["Une couleur", "Un identifiant unique", "Trois associations", "Un index"], a: 1, exp: "Pas d'entité sans identifiant." },
    { type: "vf", q: "Si une lecture à voix haute sonne faux, la cardinalité est probablement à corriger.", a: true, exp: "La lecture est un test de cohérence." },
    { type: "qcm", q: "« age » dans une entité est…", opts: ["Correct", "Une donnée calculable à ne pas stocker", "Un identifiant", "Une association"], a: 1, exp: "On garde dateNaissance." },
    { type: "qcm", q: "Combien de cardinalités porte l'association EMPRUNTER (binaire) ?", opts: ["Une", "Deux", "Trois", "Zéro"], a: 1, exp: "Une par patte." },
    { type: "qcm", q: "Le type de l'association EMPRUNTER (0,n / 0,n) est…", opts: ["1:1", "1:N", "N:M", "réflexive"], a: 2, exp: "Maxi n des deux côtés." },
    { type: "vf", q: "Un MCD bien relu réduit fortement les erreurs au moment de créer la base.", a: true, exp: "La relecture est une étape de qualité." }
  ],
  final: {
    title: "Exercice final — Repérer les défauts d'un MCD",
    intro: `<p>Voici un MCD proposé par un débutant. Le texte après <code>//</code> attire l'œil sur chaque ligne suspecte :</p>
<pre class="pseudo">CLIENT( nom, prenom, ageClient, libelleCategoriePreferee )   // pas de # ? age ? libellé recopié ?
COMMANDE( date, montant )                                     // pas de # non plus ?
CLIENT ----( PASSER )---- COMMANDE     (sans cardinalités)    // le « combien ? » manque</pre>`,
    questions: [
      { type: "qcm", q: "Premier défaut de CLIENT :", opts: ["Trop de propriétés", "Aucun identifiant", "Trop d'associations", "Un index manquant"], a: 1, exp: "Il faut un #idClient." },
      { type: "qcm", q: "« ageClient » est…", opts: ["Correct", "Calculable : remplacer par dateNaissance", "Un identifiant", "Une association"], a: 1, exp: "Pas de donnée calculable." },
      { type: "qcm", q: "« libelleCategoriePreferee » dans CLIENT…", opts: ["Est parfait", "Devrait venir d'une entité CATEGORIE via une association", "Est l'identifiant", "Est une date"], a: 1, exp: "Sinon redondance." },
      { type: "qcm", q: "L'association PASSER a pour défaut…", opts: ["Un mauvais verbe", "L'absence de cardinalités", "Trop de cardinalités", "Une couleur"], a: 1, exp: "Il faut (mini,maxi) de chaque côté." },
      { type: "vf", q: "COMMANDE devrait aussi recevoir un identifiant (#idCommande).", a: true, exp: "Toute entité a un identifiant." }
    ],
    solution: `<pre class="pseudo">CLIENT( #idClient, nom, prenom, dateNaissance )      // # ajouté, age -> dateNaissance
COMMANDE( #idCommande, date, montant )               // identifiant ajouté
CATEGORIE( #idCategorie, libelle )                   // le libellé sort dans sa propre entité

CLIENT 0,n ----( PASSER )---- 1,1 COMMANDE           // cardinalités posées : 1:N
CLIENT 0,n ----( PREFERER )--- 0,1 CATEGORIE          // la catégorie préférée devient un lien

Corrections : identifiants ajoutés, age -> dateNaissance,   // récapitulatif des fixes
catégorie sortie en entité, cardinalités posées.</pre>
<p>Fin de la semaine 1 : tu sais construire et relire un MCD. Demain : les associations porteuses de données.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Construis ton MCD complet…",
  items: [
  { id: "mer-l7", title: "MCD complet d'un cabinet médical", level: 3,
    statement: "Modélise ce mini-domaine : « Un cabinet médical enregistre des CONSULTATIONS. Chaque consultation concerne un seul PATIENT et un seul MEDECIN, à une date donnée. Un patient peut avoir plusieurs consultations ; un médecin en réalise plusieurs. » Écris les entités (avec identifiants et 2 propriétés chacune), les associations et toutes les cardinalités. Où places-tu la date de consultation ?",
    hints: [
      "Entités : PATIENT, MEDECIN, CONSULTATION (ou une association CONSULTER).",
      "Si la consultation a ses propres propriétés (date, motif), c'est plutôt une entité reliée à PATIENT et MEDECIN.",
      "La date appartient à la consultation, pas au patient ni au médecin seuls."
    ],
    solution: "PATIENT( #idPatient, nom, dateNaissance )\nMEDECIN( #idMedecin, nom, specialite )\nCONSULTATION( #idConsultation, dateConsult, motif )\n\nPATIENT 0,n ----( CONCERNER )---- 1,1 CONSULTATION\nMEDECIN 0,n ----( REALISER )----- 1,1 CONSULTATION\n\nLa date (dateConsult) est une propriété de CONSULTATION :\nelle caractérise la consultation elle-même.\n\n(Variante : une association ternaire CONSULTER entre PATIENT et MEDECIN\nportant date et motif ; l'entité CONSULTATION est souvent plus claire.)",
    note: "Quand un « lien » possède ses propres données (date, motif) et une identité, on le modélise volontiers comme une entité à part entière (CONSULTATION) reliée aux deux acteurs. C'est plus lisible qu'une association porteuse surchargée." }
  ]
};
