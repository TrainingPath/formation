  title: "Les contraintes (CIF, exclusion, totalité…)",
  subtitle: "Exprimer des règles que les cardinalités ne capturent pas.",
  theory: `
<h3>1. Pourquoi des contraintes ?</h3>
<p>Les cardinalités disent « combien de fois », mais certaines règles du métier vont plus loin et ne tiennent pas dans un simple (mini, maxi). Par exemple : « une location est validée par un vendeur, forcément celui du magasin où se trouve le jeu » ; ou « un compte est soit particulier, soit professionnel, jamais les deux ». Ces règles s'expriment par des <strong>contraintes</strong> qu'on ajoute au MCD. Une contrainte est une <em>règle supplémentaire</em> qui restreint les combinaisons autorisées.</p>

<h3>2. La CIF (Contrainte d'Intégrité Fonctionnelle)</h3>
<p>Une <strong>CIF</strong> exprime qu'une entité est <strong>déterminée</strong> par une ou plusieurs autres, à travers des associations. « Déterminée » signifie : dès qu'on connaît les valeurs de gauche, la valeur de droite est fixée sans ambiguïté. Exemple : « connaissant le vol ET la date, on connaît la salle d'embarquement ». On la note par un point relié aux pattes concernées, avec la mention <code>CIF</code>. Le texte après <code>--</code> ou <code>-></code> est un commentaire/notation.</p>
<pre class="pseudo">Exemple : dans un cinéma
  SEANCE est déterminée par (SALLE, HORAIRE)          // le couple (salle, horaire) fixe la séance
  -> à une salle + un horaire correspond au plus une séance   // pas deux séances au même endroit et heure
  CIF : (SALLE, HORAIRE) --> SEANCE                  // notation : la flèche va des déterminants vers le déterminé</pre>
<div class="tip">Une CIF traduit une <strong>dépendance fonctionnelle</strong> entre participations : « ces valeurs-là déterminent celle-ci ». Elle évite des associations redondantes et clarifie les règles. (On reverra la dépendance fonctionnelle en détail à la leçon 18.)</div>

<h3>3. La contrainte d'EXCLUSION (X)</h3>
<p>Deux associations sont en <strong>exclusion</strong> quand une occurrence ne peut participer qu'à l'une OU l'autre, jamais aux deux en même temps. Exemple : « un document est soit archivé, soit en cours de rédaction ». On note l'exclusion par un <code>X</code> reliant les deux associations. Note : les <code>\\</code> et <code>/</code> dans le dessin tracent les branches.</p>
<pre class="pseudo">   ( ARCHIVER )        ( REDIGER )        // les deux associations concernées
        \\       X       /                  // le X marque l'exclusion entre elles
             DOCUMENT                       // l'entité soumise à la règle
   X = exclusion : jamais les deux à la fois   // au plus une des deux participations</pre>

<h3>4. La contrainte de TOTALITÉ (T)</h3>
<p>La <strong>totalité</strong> impose qu'une occurrence participe à <strong>au moins une</strong> des associations concernées (elle ne peut pas n'en avoir aucune). Exemple : « tout compte est soit crédité, soit débité — au moins une opération ». On la note par un <code>T</code>.</p>

<h3>5. La PARTITION (X + T)</h3>
<p>La <strong>partition</strong> combine exclusion ET totalité : exactement une des associations, ni zéro ni deux. C'est le cas typique de l'héritage exclusif et total (leçon 13) : un utilisateur est client OU vendeur OU admin, et exactement un des trois.</p>
<pre class="pseudo">EXCLUSION (X)   : au plus une    // 0 ou 1 des associations
TOTALITÉ  (T)   : au moins une   // 1 ou plus des associations
PARTITION (X+T) : exactement une // 1 seule, ni 0 ni 2 (X et T réunies)</pre>
<div class="warn">Toutes les contraintes ne sont pas vérifiables automatiquement par le SGBD. Certaines (comme « le vendeur du même magasin ») seront contrôlées par l'application (le programme). Le MCD sert alors à les DOCUMENTER clairement, pour que tout le monde connaisse la règle.</div>`,
  exercises: [
    { type: "qcm", q: "Une contrainte sert à…", opts: ["Colorer le schéma", "Exprimer une règle que les cardinalités seules ne capturent pas", "Compter les entités", "Créer un index"], a: 1, exp: "Elle affine les règles métier." },
    { type: "qcm", q: "Une CIF exprime qu'une entité est…", opts: ["Colorée", "Déterminée par d'autres via des associations", "Supprimée", "Calculée"], a: 1, exp: "Dépendance fonctionnelle entre participations." },
    { type: "qcm", q: "« À une salle + un horaire correspond au plus une séance » est…", opts: ["Une exclusion", "Une CIF : (SALLE, HORAIRE) → SEANCE", "Une totalité", "Un index"], a: 1, exp: "Détermination fonctionnelle." },
    { type: "qcm", q: "La contrainte d'EXCLUSION (X) impose…", opts: ["Au moins une des associations", "Au plus une (jamais les deux à la fois)", "Exactement deux", "Aucune règle"], a: 1, exp: "L'une OU l'autre, pas les deux." },

    { type: "qcm", q: "« Tout compte a au moins une opération » est…", opts: ["Une exclusion", "Une totalité (T)", "Une CIF", "Une réflexive"], a: 1, exp: "Au moins une participation." },
    { type: "qcm", q: "L'héritage exclusif et total est un cas de…", opts: ["CIF", "Partition (X+T)", "Exclusion seule", "Totalité seule"], a: 1, exp: "Exactement un sous-type." },
    { type: "vf", q: "Certaines contraintes ne sont pas vérifiables automatiquement par le SGBD.", a: true, exp: "Elles seront contrôlées par l'application." },
    { type: "qcm", q: "Le MCD documente les contraintes afin de…", opts: ["Les cacher", "Les rendre explicites et compréhensibles", "Les supprimer", "Les calculer"], a: 1, exp: "Clarté des règles pour tous." },
    { type: "qcm", q: "Exclusion = au plus une ; totalité = au moins une ; partition =…", opts: ["Zéro", "Exactement une", "Au plus deux", "Trois"], a: 1, exp: "La combinaison des deux." },
    { type: "qcm", q: "Une CIF permet souvent d'éviter…", opts: ["Des index", "Des associations redondantes", "Des entités", "Des identifiants"], a: 1, exp: "Elle clarifie les dépendances." },
    { type: "vf", q: "Une contrainte d'exclusion se note par un X reliant les associations concernées.", a: true, exp: "X = exclusion sur le schéma." },
    { type: "qcm", q: "« Un employé est soit en CDI, soit en CDD, exactement un des deux » est…", opts: ["Une CIF", "Une partition (X+T)", "Une totalité seule", "Une exclusion seule"], a: 1, exp: "Exactement une des deux situations." }
  ],
  final: {
    title: "Exercice final — Choisir la bonne contrainte",
    intro: `<p>Une banque : un CLIENT possède des COMPTES. Le texte après <code>//</code> résume chaque règle :</p>
<pre class="pseudo">R1) un compte est soit COURANT soit ÉPARGNE, jamais les deux, toujours l'un des deux  // exclusion + totalité
R2) connaissant un VIREMENT, on connaît le compte source et le compte destination      // une détermination
R3) un client peut n'avoir aucune carte, ou plusieurs                                   // simple 0,n</pre>`,
    questions: [
      { type: "qcm", q: "La règle R1 est une contrainte de type…", opts: ["CIF", "Partition (exclusion + totalité)", "Totalité seule", "Cardinalité"], a: 1, exp: "Exactement un des deux types." },
      { type: "qcm", q: "La règle R2 est une…", opts: ["Exclusion", "CIF : (VIREMENT) → comptes source et destination", "Partition", "Totalité"], a: 1, exp: "Le virement détermine ses comptes." },
      { type: "qcm", q: "La règle R3 relève plutôt…", opts: ["D'une contrainte spéciale", "Des cardinalités simples (0,n)", "D'une exclusion", "D'une CIF"], a: 1, exp: "0,n suffit, pas besoin de contrainte spéciale." },
      { type: "qcm", q: "R1 sans la totalité (juste l'exclusion) autoriserait…", opts: ["Rien de nouveau", "Un compte ni courant ni épargne", "Deux types à la fois", "Un client sans compte"], a: 1, exp: "Sans totalité, le cas « aucun » deviendrait possible." },
      { type: "vf", q: "Certaines de ces règles devront être vérifiées par l'application, pas seulement par la base.", a: true, exp: "Toutes ne sont pas exprimables en contraintes SQL simples." }
    ],
    solution: `<pre class="pseudo">R1 = PARTITION (X+T)   // COMPTE est courant OU épargne, exactement un
R2 = CIF               // (VIREMENT) --> COMPTE_SOURCE , COMPTE_DESTINATION : le virement fixe ses comptes
R3 = cardinalité 0,n   // simple lien CLIENT -- CARTE, aucune contrainte spéciale

Exclusion = au plus une ; Totalité = au moins une ; Partition = exactement une.   // rappel</pre>
<p>Tu sais nommer les contraintes. Demain : les entités faibles et l'identifiant relatif.</p>`
  }
};
