  num: 10,
  title: "Associations réflexives",
  subtitle: "Quand une entité se relie à elle-même.",
  theory: `
<h3>1. Le principe</h3>
<p>Une association <strong>réflexive</strong> (on dit aussi <strong>récursive</strong>) relie une entité à <strong>elle-même</strong> : les deux pattes de l'association partent du même rectangle et y reviennent. Cela paraît étrange au début, mais c'est très courant : ça sert à modéliser des hiérarchies (un chef et ses subordonnés), des filiations (parents et enfants), des compositions (une pièce faite d'autres pièces). Dans le schéma, le texte après <code>//</code> ou <code>--</code> est un commentaire.</p>
<pre class="pseudo">EMPLOYE ----( ENCADRER )---- EMPLOYE   // la même entité aux deux bouts du lien
   (un employé encadre d'autres employés)   // un EMPLOYE joue les deux rôles à la fois</pre>

<h3>2. Nommer les rôles, c'est obligatoire</h3>
<p>Puisque les deux extrémités touchent la même entité, on ne peut pas les distinguer sans leur donner un <strong>rôle</strong>. Un rôle, c'est le nom de la « casquette » que porte l'entité de chaque côté. On précise donc le rôle de chaque patte pour lever l'ambiguïté « qui encadre qui ? ».</p>
<pre class="pseudo">EMPLOYE ----( ENCADRER )---- EMPLOYE
  côté « chef »       0,n   // un chef encadre 0 jusqu'à n employés
  côté « subordonné » 0,1   // un employé a 0 ou 1 chef (le patron en a 0)
Rôles : ENCADRER(chef, subordonne)   // les deux casquettes du même EMPLOYE</pre>
<div class="tip">Sans rôles, impossible de lire une réflexive : « qui encadre qui ? » resterait sans réponse. Les rôles (« chef » / « subordonné ») rendent le schéma lisible et guident la traduction au MLD.</div>

<h3>3. Des exemples classiques</h3>
<p>Le texte après <code>//</code> illustre le sens de chaque réflexive.</p>
<pre class="pseudo">Hiérarchie  : EMPLOYE encadre EMPLOYE     // organigramme d'une entreprise
Filiation   : PERSONNE est parent de PERSONNE  // arbre généalogique
Composition : PIECE est composée de PIECE       // nomenclature (une pièce faite de sous-pièces)
Extensions  : JEU étend JEU                     // une extension complète un jeu de base</pre>

<h3>4. La cardinalité décide de la traduction</h3>
<p>Comme pour les associations normales, c'est le maxi qui commande la traduction en tables. Une réflexive <strong>1:N</strong> (un chef, plusieurs subordonnés ; mais un subordonné, un seul chef) se traduit par une clé étrangère qui pointe vers la <strong>même</strong> table. Une réflexive <strong>N:M</strong> (une pièce composée de plusieurs pièces, chacune pouvant entrer dans plusieurs pièces) se traduit par une <strong>table d'association</strong> reliant la table à elle-même.</p>
<pre class="pseudo">Réflexive 1:N (hiérarchie) :
  EMPLOYE( #idEmploye, nom, #idChef )        -- idChef pointe vers EMPLOYE(idEmploye), la même table

Réflexive N:M (nomenclature) :
  COMPOSER( #idComposant, #idCompose, quantite )   -- table de liaison de PIECE avec elle-même
    idComposant -> PIECE , idCompose -> PIECE       -- les deux FK visent la même table</pre>

<h3>5. Attention aux cycles</h3>
<p>Une réflexive peut créer des <strong>cycles</strong> (A encadre B, qui encadre A : une boucle sans fin). Selon le métier, on l'interdit par une <strong>contrainte</strong> (un chef ne peut pas être son propre subordonné, ni directement, ni en remontant la chaîne). Cette règle se vérifie souvent côté application (dans le programme), car elle est difficile à imposer par le seul schéma.</p>
<div class="warn">Le champ « idChef » doit accepter la valeur NULL (vide) : le grand patron n'a pas de chef. Une réflexive 1:N a donc presque toujours un mini 0 côté subordonné.</div>`,
  exercises: [
    { type: "qcm", q: "Une association réflexive relie…", opts: ["Deux entités différentes", "Une entité à elle-même", "Trois entités", "Deux bases"], a: 1, exp: "Les deux pattes partent de la même entité." },
    { type: "qcm", q: "Sur une réflexive, il est obligatoire de…", opts: ["Mettre une couleur", "Nommer les rôles de chaque côté", "Supprimer les cardinalités", "Ajouter un index"], a: 1, exp: "Sans rôles, on ne peut pas la lire." },
    { type: "qcm", q: "« EMPLOYE encadre EMPLOYE » modélise…", opts: ["Une filiation génétique", "Une hiérarchie (organigramme)", "Un prix", "Une couleur"], a: 1, exp: "Relation chef/subordonné." },
    { type: "qcm", q: "Une réflexive 1:N se traduit par…", opts: ["Une table d'association", "Une clé étrangère vers la MÊME table", "Rien", "Deux tables"], a: 1, exp: "Ex. idChef dans EMPLOYE." },
    { type: "qcm", q: "Une réflexive N:M se traduit par…", opts: ["Une clé étrangère simple", "Une table d'association reliant la table à elle-même", "Un index", "Une propriété"], a: 1, exp: "Ex. COMPOSER(idComposant, idCompose)." },
    { type: "qcm", q: "Les rôles « chef » et « subordonné » servent à…", opts: ["Décorer", "Distinguer les deux extrémités de la réflexive", "Calculer un total", "Trier"], a: 1, exp: "Ils lèvent l'ambiguïté." },
    { type: "qcm", q: "« PIECE composée de PIECE » (nomenclature) est une réflexive…", opts: ["1:1", "1:N", "N:M", "ternaire"], a: 2, exp: "Une pièce contient plusieurs pièces et inversement." },
    { type: "qcm", q: "Dans EMPLOYE(#idEmploye, nom, #idChef), idChef référence…", opts: ["Une autre table", "La même table EMPLOYE", "Rien", "Un index"], a: 1, exp: "Clé étrangère réflexive." },
    { type: "qcm", q: "Le grand patron (sans chef) impose que idChef soit…", opts: ["Toujours rempli", "Nullable (peut être vide)", "Un identifiant", "Calculé"], a: 1, exp: "Mini 0 côté subordonné." },
    { type: "vf", q: "Une réflexive peut créer des cycles qu'il faut parfois interdire par une contrainte.", a: true, exp: "A encadre B encadre A." },
    { type: "qcm", q: "« JEU étend JEU » exprime…", opts: ["Une hiérarchie salariale", "Qu'une extension complète un jeu de base", "Un prix", "Une catégorie"], a: 1, exp: "Réflexive sur JEU." },
    { type: "qcm", q: "La cardinalité d'une réflexive…", opts: ["N'existe pas", "Décide de sa traduction (FK simple ou table)", "Est toujours 1:1", "Est une couleur"], a: 1, exp: "1:N → FK ; N:M → table." },
    { type: "qcm", q: "Combien de rôles distincts sur une réflexive binaire ?", opts: ["Zéro", "Deux (un par côté)", "Trois", "Un seul suffit"], a: 1, exp: "Un rôle par extrémité." },
    { type: "vf", q: "Une réflexive 1:N ajoute une clé étrangère vers la même table.", a: true, exp: "Ex. idChef → EMPLOYE." },
    { type: "qcm", q: "« PERSONNE est parent de PERSONNE » est un exemple de…", opts: ["Association ternaire", "Association réflexive (filiation)", "Propriété", "Index"], a: 1, exp: "Relation d'une entité avec elle-même." }
  ],
  final: {
    title: "Exercice final — Modéliser une hiérarchie",
    intro: `<p>Une entreprise : chaque EMPLOYE a au plus un supérieur direct, et peut encadrer plusieurs employés. Le directeur n'a pas de supérieur.</p>`,
    questions: [
      { type: "qcm", q: "Le type de la réflexive ENCADRER est…", opts: ["N:M", "1:N (un chef, plusieurs subordonnés ; un subordonné, un chef)", "1:1", "ternaire"], a: 1, exp: "Un seul supérieur par employé." },
      { type: "qcm", q: "Côté « subordonné », la cardinalité est…", opts: ["1,1", "0,1 (le directeur n'a pas de chef)", "0,n", "1,n"], a: 1, exp: "Au plus un supérieur, parfois aucun." },
      { type: "qcm", q: "Côté « chef », la cardinalité est…", opts: ["1,1", "0,n (encadre 0 à plusieurs)", "0,1", "1,1"], a: 1, exp: "Un chef encadre plusieurs employés." },
      { type: "qcm", q: "La traduction au MLD ajoute…", opts: ["Une table SUPERIEUR", "Une clé étrangère idSuperieur dans EMPLOYE (nullable)", "Rien", "Trois FK"], a: 1, exp: "Réflexive 1:N = FK vers la même table." },
      { type: "vf", q: "idSuperieur doit être nullable pour le directeur.", a: true, exp: "Le sommet de la hiérarchie n'a pas de chef." }
    ],
    solution: `<pre class="pseudo">EMPLOYE ----( ENCADRER )---- EMPLOYE
  côté « chef »        0,n     // encadre plusieurs subordonnés
  côté « subordonné »  0,1     // a au plus un chef (0 pour le directeur)

MLD :
  EMPLOYE( #idEmploye, nom, #idSuperieur )        // FK vers la même table
    idSuperieur -> EMPLOYE(idEmploye)  , NULL pour le directeur   // NULL = pas de chef</pre>
<p>Tu maîtrises la réflexive. Demain : les contraintes qui affinent le modèle (CIF, exclusion…).</p>`
  }
};
</script>
