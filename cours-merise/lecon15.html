<script>
var DAY = {
  num: 15,
  title: "Du MCD au MLD : les règles de passage",
  subtitle: "Traduire mécaniquement le conceptuel en relationnel.",
  theory: `
<h3>1. Objectif du MLD</h3>
<p>Le <strong>MLD</strong> (Modèle Logique de Données) traduit le MCD en un ensemble de <strong>tables</strong> (des tableaux à lignes et colonnes) reliées par des <strong>clés</strong>. Il est <em>relationnel</em> : fini les ovales et les cardinalités dessinées, il ne reste que des tables, des <strong>clés primaires</strong> (l'identifiant de chaque table) et des <strong>clés étrangères</strong> (une colonne qui recopie la clé d'une autre table pour la désigner). Le passage du MCD au MLD suit des <strong>règles mécaniques</strong> : on les applique sans avoir à réfléchir ni à inventer.</p>

<h3>2. Règle 1 — chaque entité devient une table</h3>
<p>Toute entité du MCD devient une <strong>table</strong>. Son identifiant devient la <strong>clé primaire</strong> (qu'on souligne ou qu'on préfixe de <code>#</code>). Ses propriétés deviennent les colonnes de la table. Le texte après <code>--</code> est un commentaire.</p>
<pre class="pseudo">MCD :  JEU( #idJeu, titre, prixLocation, stock )         // l'entité JEU dans le conceptuel
MLD :  JEU( #idJeu, titre, prixLocation, stock )         -- même contenu ; # = clé primaire</pre>

<h3>3. Règle 2 — l'association 1:N descend une clé étrangère</h3>
<p>Pour une association <strong>1:N</strong>, on n'ajoute AUCUNE table : la clé de l'entité côté « 1 » descend comme <strong>clé étrangère</strong> dans la table côté « n ».</p>
<pre class="pseudo">MCD :  CATEGORIE 0,n --( APPARTENIR )-- 1,1 JEU          // un jeu a 1 catégorie, une catégorie a n jeux
MLD :  JEU( #idJeu, titre, prixLocation, stock, #idCategorie )   // idCategorie ajouté dans JEU (côté n)
       idCategorie -> CATEGORIE(idCategorie)             // cette colonne pointe vers CATEGORIE</pre>
<div class="tip">Truc mnémo : la clé migre vers le côté « plusieurs ». Chaque jeu (côté n) mémorise SA catégorie unique. On ne pourrait pas faire l'inverse : une catégorie a plusieurs jeux, elle ne saurait pas lequel stocker.</div>

<h3>4. Règle 3 — l'association N:M devient une table</h3>
<p>Pour une association <strong>N:M</strong>, on crée une <strong>nouvelle table</strong> (la table d'association). Sa clé primaire est composée des deux clés étrangères. Les éventuelles propriétés portées par l'association y sont ajoutées comme colonnes.</p>
<pre class="pseudo">MCD :  CLIENT 0,n --( LOUER: dateDebut )-- 0,n JEU       // N:M porteur : dateDebut sur le lien
MLD :  LOUER( #idClient, #idJeu, dateDebut, nbJours )    -- nouvelle table ; clé = (idClient, idJeu)
       idClient -> CLIENT , idJeu -> JEU                 -- deux clés étrangères vers les entités</pre>

<h3>5. Le tableau récapitulatif</h3>
<p>La première ligne est l'en-tête. Le texte à droite indique ce que devient chaque élément du MCD.</p>
<pre class="pseudo">ÉLÉMENT MCD          DEVIENT AU MLD                              // en-tête
entité               une table (identifiant = clé primaire)       // règle 1
association 1:1      une clé étrangère d'un côté (+ unicité)       // FK unique
association 1:N      une clé étrangère du côté « n »               // règle 2
association N:M      une nouvelle table (2 clés étrangères)        // règle 3
association ternaire une nouvelle table (3 clés étrangères)        // comme un N:M à 3 pattes
propriété portée     une colonne dans la table de l'association    // sur la table d'association</pre>
<div class="warn">Ces règles sont mécaniques : un MCD correct donne un MLD correct sans « inventer ». Les cas particuliers (héritage, entité faible, réflexive) ont leurs propres recettes, vues demain.</div>`,
  exercises: [
    { type: "qcm", q: "Le MLD est un modèle…", opts: ["Conceptuel", "Relationnel (tables + clés)", "Physique", "Graphique sans tables"], a: 1, exp: "Tables, clés primaires et étrangères." },
    { type: "qcm", q: "Règle 1 : chaque entité devient…", opts: ["Une clé", "Une table (identifiant = clé primaire)", "Un index", "Une association"], a: 1, exp: "Entité → table." },
    { type: "qcm", q: "L'identifiant d'une entité devient au MLD…", opts: ["Une clé étrangère", "La clé primaire de la table", "Un index", "Une colonne calculée"], a: 1, exp: "Identifiant → clé primaire." },
    { type: "qcm", q: "Une association 1:N se traduit par…", opts: ["Une nouvelle table", "Une clé étrangère du côté « n »", "Rien", "Deux tables"], a: 1, exp: "La clé du « 1 » descend chez le « n »." },
    { type: "qcm", q: "Dans « CATEGORIE 1 --- n JEU », la clé étrangère va…", opts: ["Dans CATEGORIE", "Dans JEU (côté n)", "Nulle part", "Dans une 3e table"], a: 1, exp: "idCategorie dans JEU." },
    { type: "qcm", q: "Une association N:M se traduit par…", opts: ["Une clé étrangère", "Une nouvelle table (table d'association)", "Un index", "Rien"], a: 1, exp: "Table avec deux clés étrangères." },
    { type: "qcm", q: "La clé primaire d'une table d'association N:M est…", opts: ["Une seule clé", "La combinaison des deux clés étrangères", "La date seule", "Absente"], a: 1, exp: "(idClient, idJeu) par exemple." },
    { type: "qcm", q: "Les propriétés portées par une association N:M…", opts: ["Disparaissent", "Deviennent des colonnes de la table d'association", "Vont dans une entité", "Sont calculées"], a: 1, exp: "Ex. dateDebut, nbJours dans LOUER." },
    { type: "qcm", q: "Une association ternaire devient une table avec…", opts: ["Une clé étrangère", "Trois clés étrangères", "Aucune", "Un index"], a: 1, exp: "Une FK par entité reliée." },
    { type: "qcm", q: "Le passage MCD → MLD est…", opts: ["Créatif et libre", "Mécanique (règles précises)", "Impossible", "Aléatoire"], a: 1, exp: "Des règles déterministes." },
    { type: "vf", q: "Un 1:N n'ajoute jamais de nouvelle table, seulement une clé étrangère.", a: true, exp: "FK côté « n »." },
    { type: "qcm", q: "« la clé migre vers le côté plusieurs » décrit la règle…", opts: ["Du N:M", "Du 1:N", "De l'entité", "De l'index"], a: 1, exp: "Truc mnémo du 1:N." },
    { type: "qcm", q: "Au MLD, les cardinalités graphiques…", opts: ["Restent dessinées", "Disparaissent au profit des clés", "Deviennent des index", "Sont recopiées"], a: 1, exp: "Le MLD est textuel, à base de clés." },
    { type: "vf", q: "Un MCD correct produit un MLD correct sans avoir à « inventer ».", a: true, exp: "Les règles suffisent." },
    { type: "qcm", q: "Une association 1:1 se traduit souvent par…", opts: ["Une table", "Une clé étrangère d'un côté (+ contrainte d'unicité)", "Trois FK", "Rien"], a: 1, exp: "FK unique d'un côté." }
  ],
  final: {
    title: "Exercice final — Appliquer les trois règles",
    intro: `<p>MCD d'une école. Le texte après <code>//</code> annonce la règle à appliquer :</p>
<pre class="pseudo">ELEVE( #idEleve, nom )                              // entité -> table
CLASSE( #idClasse, niveau )                         // entité -> table
COURS( #idCours, intitule )                         // entité -> table
CLASSE 0,n --( APPARTENIR )-- 1,1 ELEVE             // 1:N -> FK du côté « n » (ELEVE)
ELEVE 0,n --( SUIVRE: moyenne )-- 0,n COURS         // N:M porteur -> nouvelle table</pre>`,
    questions: [
      { type: "qcm", q: "Combien de tables « entités » au départ ?", opts: ["Deux", "Trois (ELEVE, CLASSE, COURS)", "Une", "Quatre"], a: 1, exp: "Une par entité." },
      { type: "qcm", q: "L'association APPARTENIR (1:N) se traduit par…", opts: ["Une nouvelle table", "Une clé étrangère idClasse dans ELEVE", "idEleve dans CLASSE", "Rien"], a: 1, exp: "La clé du « 1 » (CLASSE) descend chez le « n » (ELEVE)." },
      { type: "qcm", q: "L'association SUIVRE (N:M) se traduit par…", opts: ["Une clé étrangère", "Une nouvelle table SUIVRE(idEleve, idCours, moyenne)", "Rien", "Un index"], a: 1, exp: "Table d'association + propriété portée." },
      { type: "qcm", q: "« moyenne » se place…", opts: ["Dans ELEVE", "Dans COURS", "Dans la table SUIVRE", "Dans CLASSE"], a: 2, exp: "Propriété du couple (élève, cours)." },
      { type: "vf", q: "Au total, on obtient 4 tables : ELEVE, CLASSE, COURS, SUIVRE.", a: true, exp: "3 entités + 1 table d'association." }
    ],
    solution: `<pre class="pseudo">ELEVE( #idEleve, nom, #idClasse )        -- FK du 1:N : la clé de CLASSE descend dans ELEVE
CLASSE( #idClasse, niveau )
COURS( #idCours, intitule )
SUIVRE( #idEleve, #idCours, moyenne )    -- table du N:M + la propriété portée
  idEleve -> ELEVE , idCours -> COURS     -- deux clés étrangères

4 tables : 3 entités + 1 table d'association.   // le compte final</pre>
<p>Tu appliques les règles de base. Demain : les associations en détail et leurs pièges.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Traduis le MCD en MLD…",
  items: [
  { id: "mer-l15", title: "Traduire un petit MCD", level: 3,
    statement: "Traduis ce MCD en MLD (tables, clés primaires #, clés étrangères avec leur cible) : <code>AUTEUR(#idAuteur, nom)</code>, <code>LIVRE(#idLivre, titre)</code>, avec <code>AUTEUR 0,n --( ECRIRE )-- 1,1 LIVRE</code> (un livre a un seul auteur, un auteur écrit plusieurs livres) et <code>LECTEUR(#idLecteur, nom)</code> avec <code>LECTEUR 0,n --( EMPRUNTER: dateEmprunt )-- 0,n LIVRE</code>.",
    hints: [
      "ECRIRE est 1:N : la clé de l'entité côté 1 (AUTEUR) descend dans LIVRE.",
      "EMPRUNTER est N:M : nouvelle table avec les deux clés + dateEmprunt.",
      "N'oublie pas d'indiquer chaque clé étrangère et sa cible."
    ],
    solution: "AUTEUR( #idAuteur, nom )\nLIVRE( #idLivre, titre, #idAuteur )\n  idAuteur -> AUTEUR(idAuteur)          -- association 1:N\nLECTEUR( #idLecteur, nom )\nEMPRUNTER( #idLecteur, #idLivre, dateEmprunt )\n  clé primaire = (idLecteur, idLivre, dateEmprunt)\n  idLecteur -> LECTEUR , idLivre -> LIVRE   -- association N:M porteuse",
    note: "Le 1:N (ECRIRE) ajoute simplement idAuteur dans LIVRE ; le N:M (EMPRUNTER) crée une table dédiée dont la clé inclut la date pour autoriser plusieurs emprunts du même livre par le même lecteur." }
  ]
};
