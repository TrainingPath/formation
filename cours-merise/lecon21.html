var DAY = {

  title: "Examen final Merise",
  subtitle: "Tout le cours en une épreuve : du besoin au MPD.",
  theory: `
<h3>Récapitulatif avant l'épreuve</h3>
<p>Vingt leçons, une méthode complète. Voici deux minutes de révision où l'on redéfinit chaque terme important, puis 20 questions.</p>

<h3>1. Les niveaux</h3>
<p>Merise décrit les données à trois niveaux, du plus abstrait au plus concret. Le <strong>MCD</strong> (Modèle Conceptuel de Données) décrit le SENS métier : entités, associations, cardinalités, sans aucune technique. Le <strong>MLD</strong> (Modèle Logique de Données) traduit ce sens en tables reliées par des clés. Le <strong>MPD</strong> (Modèle Physique de Données) descend au niveau d'un SGBD précis : types, index, contraintes. On descend toujours dans l'ordre : MCD → MLD → MPD.</p>

<h3>2. Le MCD</h3>
<p>Rappel des briques du conceptuel. Le texte après <code>//</code> est un commentaire.</p>
<pre class="pseudo">ENTITÉ (rectangle) : #identifiant + propriétés atomiques        // une « chose » du métier, avec sa clé
ASSOCIATION (ovale) : verbe + cardinalités (mini, maxi) par patte // le lien entre entités, quantifié
TYPES : 1:1, 1:N, N:M (selon les maxi)                           // la famille se lit sur les maximums
CAS PARTICULIERS : porteuse, ternaire, réflexive, faible, héritage  // les situations spéciales du cours</pre>

<h3>3. Les règles de passage au MLD</h3>
<p>Comment chaque élément du MCD devient des tables. Le texte à droite est la recette.</p>
<pre class="pseudo">entité        -> table (identifiant = clé primaire)          // règle 1 de base
1:N           -> clé étrangère du côté « n »                 // la clé migre vers le « plusieurs »
N:M           -> table d'association (2 clés étrangères)      // nouvelle table de liaison
ternaire      -> table (3 clés étrangères)                    // comme un N:M à 3 pattes
entité faible -> clé composite (FK forte + id relatif)         // ex. (idJeu, numExemplaire)
héritage      -> A (une table) / B (mère+filles) / C (filles) // 3 stratégies au choix</pre>

<h3>4. Normalisation et intégrité</h3>
<p>La <strong>normalisation</strong> chasse la redondance : <strong>1FN</strong> = propriétés atomiques ; <strong>2FN</strong> = chaque propriété dépend de TOUTE la clé (utile aux clés composées) ; <strong>3FN</strong> = aucune propriété non-clé n'en détermine une autre (« rien que la clé »). L'<strong>intégrité référentielle</strong> garantit que chaque clé étrangère cible une clé primaire réellement existante (pas de lien « dans le vide »).</p>

<h3>5. Le MPD</h3>
<p>Le niveau physique ajoute les détails techniques : les <strong>types</strong> (VARCHAR pour du texte, INT pour un entier, DECIMAL pour l'argent, DATE pour une date…), les <strong>contraintes</strong> (NOT NULL = obligatoire, UNIQUE = sans doublon, DEFAULT = valeur par défaut, CHECK = règle de validité, FOREIGN KEY = clé étrangère), les <strong>clés auto-incrémentées</strong> et les <strong>index</strong> (pour accélérer les recherches). À ce stade, c'est presque du SQL.</p>
<div class="tip">Conseil d'examen : pour classer une association, regarde d'abord les maxi. Pour placer une propriété, demande-toi de quoi elle dépend. Bonne chance !</div>`,
  exercises: [
    { type: "qcm", q: "L'ordre des niveaux de conception est…", opts: ["MPD → MLD → MCD", "MCD → MLD → MPD", "MLD → MCD → MPD", "au hasard"], a: 1, exp: "Du conceptuel au physique." },
    { type: "qcm", q: "Une entité se dessine par…", opts: ["Un ovale", "Un rectangle", "Un losange", "Une flèche"], a: 1, exp: "Rectangle ; l'ovale est l'association." },
    { type: "qcm", q: "Toute entité doit avoir…", opts: ["Une couleur", "Un identifiant unique", "Trois associations", "Un index"], a: 1, exp: "Pas d'entité sans identifiant." },
    { type: "qcm", q: "Une propriété doit être…", opts: ["Composite", "Atomique, non calculée, non répétitive", "Toujours calculée", "Recopiée"], a: 1, exp: "Règles de la 1FN." },
    { type: "qcm", q: "La cardinalité s'écrit…", opts: ["(couleur, taille)", "(mini, maxi)", "(clé, valeur)", "(nom, type)"], a: 1, exp: "Minimum et maximum." },
    { type: "qcm", q: "Le type d'une association se lit sur…", opts: ["Les mini", "Les maxi", "Les couleurs", "Les noms"], a: 1, exp: "1:1 / 1:N / N:M selon les maxi." },
    { type: "qcm", q: "Un 1:N se traduit par…", opts: ["Une table", "Une clé étrangère du côté « n »", "Rien", "Un index"], a: 1, exp: "FK côté plusieurs." },
    { type: "qcm", q: "Un N:M se traduit par…", opts: ["Une clé étrangère", "Une table d'association (2 FK)", "Rien", "Une couleur"], a: 1, exp: "Table dédiée." },
    { type: "qcm", q: "Une propriété qui dépend des deux entités reliées se place…", opts: ["Dans l'une des entités", "Sur l'association (porteuse)", "Dans un index", "Nulle part"], a: 1, exp: "Association porteuse." },
    { type: "qcm", q: "Une entité faible a une clé primaire…", opts: ["Simple", "Composite (FK forte + id relatif)", "Absente", "Calculée"], a: 1, exp: "Ex. (idJeu, numExemplaire)." },
    { type: "qcm", q: "L'héritage en stratégie B donne…", opts: ["Une seule table", "Une table mère + une par sous-entité", "Aucune table", "Trois index"], a: 1, exp: "Mère + filles reliées par la clé." },
    { type: "qcm", q: "La 3FN interdit qu'une propriété non-clé…", opts: ["Existe", "En détermine une autre (dépendance transitive)", "Soit atomique", "Soit unique"], a: 1, exp: "Rien que la clé." },
    { type: "qcm", q: "L'intégrité référentielle impose qu'une FK…", opts: ["Soit nulle", "Cible une clé primaire existante", "Soit un index", "Soit calculée"], a: 1, exp: "Pas de référence orpheline." },
    { type: "qcm", q: "Pour un montant d'argent, on choisit…", opts: ["FLOAT", "DECIMAL(p, s)", "VARCHAR", "BOOLEAN"], a: 1, exp: "Décimal exact." },
    { type: "qcm", q: "Une association réflexive relie…", opts: ["Deux entités", "Une entité à elle-même", "Trois entités", "Deux bases"], a: 1, exp: "Ex. EMPLOYE encadre EMPLOYE." },
    { type: "qcm", q: "Une association ternaire se traduit par une table avec…", opts: ["Une FK", "Trois clés étrangères", "Aucune", "Un index"], a: 1, exp: "Une FK par entité reliée." },
    { type: "qcm", q: "La contrainte de PARTITION signifie…", opts: ["Au plus une", "Exactement une (exclusion + totalité)", "Au moins deux", "Aucune"], a: 1, exp: "X + T." },
    { type: "qcm", q: "Le MPD ajoute au MLD…", opts: ["Des cardinalités", "Types, contraintes, index (propre au SGBD)", "Des ovales", "Des couleurs"], a: 1, exp: "Le niveau physique." },
    { type: "qcm", q: "« dépendre de la clé, de toute la clé, et de rien d'autre que la clé » résume…", opts: ["La 1FN", "La 3FN", "L'index", "La cardinalité"], a: 1, exp: "La 3FN." },
    { type: "qcm", q: "Le MLD bien fait se traduit presque ligne à ligne en…", opts: ["HTML", "SQL (CREATE TABLE)", "Python", "dessin"], a: 1, exp: "Antichambre du SQL." }
  ],
  final: {
    title: "Épreuve pratique — Modéliser de A à Z",
    intro: `<p>Énoncé : « Un club sportif propose des ACTIVITÉS. Chaque MEMBRE peut s'inscrire à plusieurs activités, et une activité accueille plusieurs membres ; on note la date d'inscription. Chaque activité est encadrée par un seul ENTRAÎNEUR ; un entraîneur encadre plusieurs activités. »</p>`,
    questions: [
      { type: "qcm", q: "L'association MEMBRE–ACTIVITÉ (inscription) est de type…", opts: ["1:1", "1:N", "N:M (avec date portée)", "réflexive"], a: 2, exp: "Plusieurs des deux côtés + date." },
      { type: "qcm", q: "L'association ACTIVITÉ–ENTRAÎNEUR est de type…", opts: ["N:M", "1:N (une activité, un entraîneur ; un entraîneur, plusieurs activités)", "1:1", "ternaire"], a: 1, exp: "Maxi 1 côté activité, n côté entraîneur." },
      { type: "qcm", q: "La date d'inscription se place…", opts: ["Dans MEMBRE", "Dans ACTIVITÉ", "Sur l'association d'inscription (table N:M)", "Dans ENTRAÎNEUR"], a: 2, exp: "Elle dépend du couple." },
      { type: "qcm", q: "Au MLD, l'inscription devient…", opts: ["Une clé étrangère", "Une table INSCRIRE(idMembre, idActivite, dateInscription)", "Rien", "Un index"], a: 1, exp: "Table d'association porteuse." },
      { type: "qcm", q: "Au MLD, l'encadrement (1:N) ajoute…", opts: ["Une table", "idEntraineur dans ACTIVITÉ", "idActivite dans ENTRAÎNEUR", "Rien"], a: 1, exp: "FK côté « n » (ACTIVITÉ)." }
    ],
    solution: `<pre class="pseudo">MCD :
  MEMBRE( #idMembre, nom )                                       // entité
  ACTIVITE( #idActivite, libelle )                               // entité
  ENTRAINEUR( #idEntraineur, nom )                               // entité
  MEMBRE 0,n --( INSCRIRE: dateInscription )-- 0,n ACTIVITE       // N:M porteuse (date sur le lien)
  ENTRAINEUR 0,n --( ENCADRER )-- 1,1 ACTIVITE                    // 1:N : une activité, un entraîneur

MLD :
  MEMBRE( #idMembre, nom )
  ENTRAINEUR( #idEntraineur, nom )
  ACTIVITE( #idActivite, libelle, #idEntraineur -> ENTRAINEUR )   // FK du 1:N (côté ACTIVITE)
  INSCRIRE( #idMembre -> MEMBRE, #idActivite -> ACTIVITE, dateInscription )  // table du N:M

MPD : types (INT, VARCHAR, DATE), PK auto-incrémentées, FK, index utiles.   // niveau physique</pre>
<p>🧩 Cours Merise terminé : tu sais concevoir une base, du besoin au schéma physique. Prochaine étape : le SQL, pour créer et interroger ces tables.</p>`
  }
};
