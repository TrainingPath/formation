<script>
var DAY = {
  num: 16,
  title: "Traduire les associations en tables",
  subtitle: "Le détail des 1:1, 1:N et N:M, et leurs pièges.",
  theory: `
<h3>1. Le 1:N sans piège… presque</h3>
<p>Rappel : dans un 1:N, la clé du côté « 1 » descend comme clé étrangère côté « n ». Le piège se cache dans le <strong>mini</strong>. La valeur <strong>NULL</strong> (en base de données) signifie « case vide, valeur inconnue ou absente ». Si, côté « 1 », la participation est facultative (cardinalité 0,1), alors la clé étrangère devra <strong>accepter NULL</strong> (on écrit « NULL autorisé »). Si elle est obligatoire, la colonne est <strong>NOT NULL</strong> (« jamais vide »). Le texte après <code>-></code> est une explication.</p>
<pre class="pseudo">JEU 0,n --( APPARTENIR )-- 1,1 CATEGORIE
  -> idCategorie NOT NULL          // un jeu a TOUJOURS une catégorie : jamais vide

EMPLOYE 0,n --( TRAVAILLER )-- 0,1 SERVICE
  -> idService NULL autorisé       // un employé peut n'avoir AUCUN service : case vide permise</pre>

<h3>2. Le cas du 1:1</h3>
<p>Un <strong>1:1</strong> se traduit par une clé étrangère placée d'<strong>un seul</strong> côté, assortie d'une contrainte d'<strong>unicité</strong> (mot-clé UNIQUE : elle empêche que deux lignes pointent vers la même cible, donc empêche deux fois le même lien). On choisit le côté selon les mini : la clé va de préférence du côté dont la participation est obligatoire.</p>
<pre class="pseudo">PERSONNE 1,1 --( POSSEDER )-- 0,1 PASSEPORT
  -> idPersonne dans PASSEPORT, UNIQUE    // chaque passeport a 1 titulaire ; une personne a 0 ou 1 passeport</pre>
<div class="tip">Un 1:1 mérite toujours une question : les deux entités ne sont-elles pas en réalité une seule ? Si oui, on fusionne. Si non (cycle de vie différent, données optionnelles rarement remplies), on garde deux tables + une clé étrangère UNIQUE.</div>

<h3>3. Le N:M et sa table d'association</h3>
<p>Le N:M crée une table dont la clé primaire combine les deux clés étrangères. Cette clé combinée garantit qu'un même couple n'apparaît qu'une seule fois — sauf si une propriété (comme une date) doit permettre la répétition, auquel cas cette propriété entre aussi dans la clé.</p>
<pre class="pseudo">Couple unique :
  INSCRIRE( #idEtudiant, #idCours )         -- un étudiant s'inscrit UNE fois à un cours

Couple répétable (avec date) :
  LOUER( #idClient, #idJeu, #dateDebut )    -- relouer le même jeu un autre jour est possible</pre>

<h3>4. Nommer les tables d'association</h3>
<p>On nomme la table par le verbe de l'association (LOUER, INSCRIRE) ou par un nom métier (LOCATION, INSCRIPTION). Le nom métier est souvent plus clair, surtout si la table reçoit un identifiant propre.</p>
<pre class="pseudo">Option A : LOUER( #idClient, #idJeu, dateDebut )                    // clé composée des 2 FK
Option B : LOCATION( #idLocation, #idClient, #idJeu, dateDebut )    // id artificiel + FK : plus simple à référencer</pre>

<h3>5. Récapitulatif des clés étrangères</h3>
<p>Le texte après <code>//</code> précise chaque règle sur les clés étrangères (FK).</p>
<pre class="pseudo">- une clé étrangère référence TOUJOURS une clé primaire existante   // elle pointe vers une ligne réelle
- elle porte le même type que la clé référencée                     // sinon la comparaison est impossible
- elle peut être NULL si la participation est facultative (mini 0)   // case vide autorisée
- plusieurs clés étrangères peuvent composer une clé primaire        // cas des tables d'association</pre>
<div class="warn">Une clé étrangère « orpheline » (qui pointe vers une clé primaire inexistante) casse l'<strong>intégrité référentielle</strong> (la garantie que chaque référence désigne bien quelque chose de réel). Le SGBD la refusera si la contrainte FOREIGN KEY est déclarée (vu au MPD et en SQL).</div>`,
  exercises: [
    { type: "qcm", q: "Dans un 1:N, la clé étrangère se place…", opts: ["Côté « 1 »", "Côté « n »", "Dans une 3e table", "Nulle part"], a: 1, exp: "La clé du « 1 » descend chez le « n »." },
    { type: "qcm", q: "Si côté « 1 » la cardinalité est 0,1, la clé étrangère…", opts: ["Est interdite", "Doit accepter NULL", "Devient primaire", "Est calculée"], a: 1, exp: "Participation facultative = FK nullable." },
    { type: "qcm", q: "« Un jeu a toujours une catégorie » implique idCategorie…", opts: ["NULL autorisé", "NOT NULL", "primaire", "calculé"], a: 1, exp: "Participation obligatoire." },
    { type: "qcm", q: "Un 1:1 se traduit par…", opts: ["Une table d'association", "Une clé étrangère d'un côté + contrainte d'unicité", "Deux tables en plus", "Rien"], a: 1, exp: "FK unique d'un côté." },
    { type: "qcm", q: "La contrainte d'unicité sur un 1:1 empêche…", opts: ["Les NULL", "Deux fois le même lien", "Les index", "Les clés primaires"], a: 1, exp: "Un seul lien par occurrence." },
    { type: "qcm", q: "Face à un 1:1, la bonne question est…", opts: ["Combien de propriétés ?", "Ne s'agit-il pas d'une seule entité ?", "Combien d'index ?", "Quel SGBD ?"], a: 1, exp: "Souvent une fusion possible." },
    { type: "qcm", q: "La clé primaire d'une table d'association N:M combine…", opts: ["Une seule FK", "Les deux clés étrangères", "La date seule", "Un index"], a: 1, exp: "(idA, idB)." },
    { type: "qcm", q: "Pour autoriser plusieurs locations du même couple, on ajoute à la clé…", opts: ["Le nom", "La date (dateDebut)", "Le prix", "Rien"], a: 1, exp: "La date distingue les répétitions." },
    { type: "qcm", q: "Nommer la table d'association LOCATION plutôt que LOUER…", opts: ["Est interdit", "Est souvent plus clair, surtout avec un identifiant propre", "Casse le MLD", "Change les cardinalités"], a: 1, exp: "Un nom métier + id artificiel simplifie." },
    { type: "qcm", q: "Une clé étrangère référence toujours…", opts: ["N'importe quoi", "Une clé primaire existante", "Un index", "Une propriété calculée"], a: 1, exp: "Intégrité référentielle." },
    { type: "vf", q: "Une clé étrangère porte le même type que la clé qu'elle référence.", a: true, exp: "Sinon la référence est impossible." },
    { type: "qcm", q: "Une clé étrangère « orpheline » casse…", opts: ["La 3FN", "L'intégrité référentielle", "L'atomicité", "L'index"], a: 1, exp: "Elle pointe vers une PK inexistante." },
    { type: "qcm", q: "« EMPLOYE 0,n TRAVAILLER 0,1 SERVICE » donne idService…", opts: ["NOT NULL", "NULL autorisé (un employé peut n'avoir aucun service)", "primaire", "en double"], a: 1, exp: "Mini 0 côté service." },
    { type: "vf", q: "Plusieurs clés étrangères peuvent composer une clé primaire.", a: true, exp: "Cas des tables d'association." },
    { type: "qcm", q: "Ajouter un identifiant artificiel à une table d'association…", opts: ["Est impossible", "Simplifie souvent son référencement", "Casse le N:M", "Supprime les FK"], a: 1, exp: "Ex. idLocation + FK." }
  ],
  final: {
    title: "Exercice final — Choisir NULL ou NOT NULL",
    intro: `<p>Trois associations à traduire. Le texte après <code>//</code> rappelle la règle métier :</p>
<pre class="pseudo">A) COMMANDE 0,n --( PASSER )-- 1,1 CLIENT       // toute commande a un client (obligatoire)
B) PERSONNE 0,n --( HABITER )-- 0,1 VILLE        // une personne peut être sans ville (SDF)
C) UTILISATEUR 1,1 --( AVOIR )-- 0,1 PROFIL       // 1:1 : au plus un profil par utilisateur</pre>`,
    questions: [
      { type: "qcm", q: "Pour A, idClient dans COMMANDE est…", opts: ["NULL autorisé", "NOT NULL", "primaire", "calculé"], a: 1, exp: "Toute commande a un client." },
      { type: "qcm", q: "Pour B, idVille dans PERSONNE est…", opts: ["NOT NULL", "NULL autorisé (personne sans ville)", "primaire", "en double"], a: 1, exp: "Mini 0 côté ville." },
      { type: "qcm", q: "L'association C (1:1) se traduit par…", opts: ["Une table PROFIL_UTILISATEUR", "idUtilisateur dans PROFIL, UNIQUE", "Trois FK", "Rien"], a: 1, exp: "FK unique d'un côté." },
      { type: "qcm", q: "Pour C, on met la clé plutôt du côté…", opts: ["Obligatoire (PROFIL référence l'UTILISATEUR)", "Aléatoire", "Des deux côtés", "Nulle part"], a: 0, exp: "Le profil dépend d'un utilisateur existant." },
      { type: "vf", q: "Une contrainte UNIQUE sur idUtilisateur empêche deux profils pour un même utilisateur.", a: true, exp: "C'est ce qui matérialise le 1:1." }
    ],
    solution: `<pre class="pseudo">A) COMMANDE( #idCommande, date, #idClient )   -- idClient NOT NULL : toute commande a un client
B) PERSONNE( #idPersonne, nom, #idVille )      -- idVille NULL autorisé : personne peut être sans ville
C) PROFIL( #idProfil, bio, #idUtilisateur )    -- idUtilisateur UNIQUE : matérialise le 1:1

Le mini décide de NULL/NOT NULL ; le 1:1 ajoute une contrainte d'unicité.   // règle à retenir</pre>
<p>Tu gères les clés et leurs contraintes. Demain : les cas particuliers (héritage, faible, ternaire).</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Traduis en précisant NULL / NOT NULL / UNIQUE…",
  items: [
  { id: "mer-l16", title: "Traduire avec les bonnes contraintes", level: 4,
    statement: "Traduis en MLD : <code>SERVICE(#idService, nom)</code> ; <code>EMPLOYE(#idEmploye, nom)</code> ; <code>EMPLOYE 0,n --( AFFECTER )-- 1,1 SERVICE</code> (tout employé est affecté à un service) ; et <code>EMPLOYE 1,1 --( DIRIGER )-- 0,1 SERVICE</code> (un service a au plus un directeur, un employé dirige au plus un service : 1:1). Précise NULL/NOT NULL et UNIQUE.",
    checklist: [
      "Les deux associations (AFFECTER, DIRIGER) donnent-elles bien deux clés étrangères distinctes ?",
      "La clé étrangère du 1:N (AFFECTER) est-elle NOT NULL du côté obligatoire ?",
      "La clé du 1:1 (DIRIGER) est-elle UNIQUE et nullable (participation 0,1) ?"
    ],
    hints: [
      "AFFECTER (1:N) : idService dans EMPLOYE, NOT NULL (tout employé a un service).",
      "DIRIGER (1:1) : idDirecteur dans SERVICE, UNIQUE et NULL autorisé (un service peut n'avoir pas encore de directeur).",
      "Attention à ne pas confondre les deux liens EMPLOYE–SERVICE."
    ],
    solution: "SERVICE( #idService, nom, #idDirecteur )\n  idDirecteur -> EMPLOYE(idEmploye) , UNIQUE , NULL autorisé   -- DIRIGER (1:1)\nEMPLOYE( #idEmploye, nom, #idService )\n  idService -> SERVICE(idService) , NOT NULL                   -- AFFECTER (1:N)\n\n- AFFECTER : chaque employé a un service (NOT NULL), un service a plusieurs employés.\n- DIRIGER : un service a au plus un directeur (UNIQUE) ; peut ne pas en avoir (NULL).",
    note: "Deux associations différentes entre les mêmes entités donnent deux clés étrangères distinctes. Le 1:N impose NOT NULL côté obligatoire ; le 1:1 se matérialise par une clé étrangère UNIQUE, nullable si la participation est facultative." }
  ]
};
