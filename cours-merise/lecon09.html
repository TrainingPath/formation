<script>
var DAY = {
  num: 9,
  title: "Associations n-aires (ternaires)",
  subtitle: "Quand trois entités sont liées en même temps.",
  theory: `
<h3>1. Au-delà du binaire</h3>
<p>Jusqu'ici, nos associations reliaient deux entités : on dit qu'elles sont <strong>binaires</strong>. Une association <strong>n-aire</strong> en relie trois ou plus (le « n » veut dire « un certain nombre »). La plus courante est la <strong>ternaire</strong> (« ter- » = trois), qui relie exactement trois entités. Elle s'impose quand un même fait met en jeu trois acteurs <strong>en même temps</strong>, sans qu'on puisse le découper en associations à deux sans perdre du sens. Dans le schéma, le texte après <code>//</code> ou <code>--</code> est un commentaire. Note : le <code>\\</code> dans le dessin sert juste à tracer une branche en diagonale.</p>
<pre class="pseudo">        ( VENDRE )                         // l'association ternaire, au centre
        /    |    \\                          // trois branches vers trois entités
   CLIENT   JEU   VENDEUR                    // les trois entités reliées
   0,n      0,n    0,n                       // la cardinalité de chaque patte
   VENDRE porte : dateVente, prixVente       // propriétés du fait « vente »</pre>
<p>Ici, une vente lie un client, un jeu ET un vendeur simultanément : « le client C a acheté le jeu J auprès du vendeur V, tel jour ». Les trois sont indissociables dans ce fait.</p>

<h3>2. Chaque patte a sa cardinalité</h3>
<p>Sur une ternaire, chaque entité porte sa propre cardinalité vers l'association. On lit toujours de la même façon : « pour UNE occurrence de cette entité, combien d'occurrences de VENDRE ? ».</p>
<pre class="pseudo">CLIENT  0,n   -- un client participe à 0 jusqu'à n ventes
JEU     0,n   -- un jeu est vendu 0 jusqu'à n fois
VENDEUR 0,n   -- un vendeur réalise 0 jusqu'à n ventes</pre>

<h3>3. Ternaire ou trois binaires ?</h3>
<p>Piège fréquent : croire que trois associations binaires remplacent une ternaire. Elles ne le font pas toujours. Prendre séparément « Client–Jeu », « Client–Vendeur » et « Jeu–Vendeur » fait perdre l'information « ces trois-là ensemble, dans la même vente ». La ternaire, elle, garde le fait comme un tout indivisible.</p>
<div class="warn">N'utilise une ternaire que si les trois entités sont VRAIMENT liées en même temps. Si le fait se décompose sans perte (par exemple : le vendeur est en réalité lié à la vente, elle-même liée au client et au jeu), une entité intermédiaire est souvent plus claire.</div>

<h3>4. La traduction au MLD</h3>
<p>Comme un N:M, une association ternaire devient une <strong>table</strong> au niveau logique (MLD). Cette table contient les <strong>trois</strong> clés étrangères (une par entité reliée), plus les propriétés portées. Rappel : une <strong>clé étrangère</strong> est une colonne qui recopie l'identifiant d'une autre table pour la désigner. La clé primaire de la table est généralement la combinaison des trois clés étrangères (on l'ajuste si un même trio peut se répéter).</p>
<pre class="pseudo">VENDRE( #idClient, #idJeu, #idVendeur, dateVente, prixVente )   // 3 FK + les propriétés portées
  idClient -> CLIENT , idJeu -> JEU , idVendeur -> VENDEUR       // chaque FK pointe vers son entité</pre>

<h3>5. Souvent remplaçable par une entité</h3>
<p>Dans la pratique, on préfère fréquemment transformer la ternaire en <strong>entité</strong> (par exemple VENTE) reliée par trois associations binaires 1:N. C'est plus lisible, surtout si la vente a un identifiant propre (un numéro de facture) et d'autres liens à ajouter plus tard.</p>
<pre class="pseudo">VENTE( #idVente, dateVente, prixVente )                        // la vente devient une entité à part entière
CLIENT 1,1 -- VENTE   /   JEU 1,1 -- VENTE   /   VENDEUR 1,1 -- VENTE   // reliée par 3 associations 1:N</pre>`,
  exercises: [
    { type: "qcm", q: "Une association n-aire relie…", opts: ["Une seule entité", "Trois entités ou plus", "Deux propriétés", "Deux tables identiques"], a: 1, exp: "La ternaire relie trois entités." },
    { type: "qcm", q: "Une ternaire s'impose quand…", opts: ["Deux entités suffisent", "Trois entités sont liées SIMULTANÉMENT sans décomposition possible", "Le schéma est petit", "On veut réduire le nombre de tables"], a: 1, exp: "Le fait met en jeu trois acteurs à la fois." },
    { type: "qcm", q: "Sur une ternaire, chaque patte porte…", opts: ["La même cardinalité obligatoire", "Sa propre cardinalité", "Aucune cardinalité", "Un identifiant"], a: 1, exp: "Une cardinalité par entité." },
    { type: "qcm", q: "Remplacer une ternaire par trois binaires…", opts: ["Est toujours équivalent", "Peut perdre l'information « ces trois-là ensemble »", "Est interdit", "Accélère tout"], a: 1, exp: "La décomposition perd parfois le sens." },
    { type: "qcm", q: "Au MLD, une ternaire devient…", opts: ["Une clé étrangère", "Une table avec les trois clés étrangères", "Rien", "Un index"], a: 1, exp: "Comme un N:M, mais à trois FK." },
    { type: "qcm", q: "La clé primaire de la table issue d'une ternaire est souvent…", opts: ["Une seule des trois clés", "La combinaison des trois clés étrangères", "Le prix", "La date seule"], a: 1, exp: "Les trois FK forment la clé (ajustée au besoin)." },
    { type: "qcm", q: "« VENDRE porte dateVente, prixVente » signifie que ces propriétés…", opts: ["Sont dans CLIENT", "Dépendent du fait ternaire (les trois ensemble)", "Sont des identifiants", "Sont calculées"], a: 1, exp: "Propriétés portées par l'association." },
    { type: "qcm", q: "On préfère souvent, en pratique, transformer une ternaire en…", opts: ["Une propriété", "Une entité (ex. VENTE) reliée par 3 binaires", "Un index", "Une couleur"], a: 1, exp: "Plus lisible, surtout avec un identifiant propre." },
    { type: "qcm", q: "Une entité VENTE aurait pour avantage…", opts: ["Moins clair", "Un identifiant propre (n° de facture) et d'autres liens faciles", "Aucune cardinalité", "Pas de propriétés"], a: 1, exp: "Lisibilité et extensibilité." },
    { type: "vf", q: "Une ternaire ne doit être utilisée que si les trois entités sont réellement liées en même temps.", a: true, exp: "Sinon, décomposer ou créer une entité." },
    { type: "qcm", q: "Combien de clés étrangères dans la table d'une ternaire ?", opts: ["Une", "Deux", "Trois", "Zéro"], a: 2, exp: "Une par entité reliée." },
    { type: "qcm", q: "Sur la ternaire VENDRE, la cardinalité côté VENDEUR 0,n signifie…", opts: ["Un vendeur fait exactement une vente", "Un vendeur participe à 0..n ventes", "Un vendeur n'a pas de vente", "Deux vendeurs par vente"], a: 1, exp: "0..n ventes par vendeur." },
    { type: "qcm", q: "L'association la plus courante reste…", opts: ["La ternaire", "La binaire", "La quaternaire", "La réflexive"], a: 1, exp: "Le binaire domine ; la ternaire est plus rare." },
    { type: "vf", q: "Au MLD, une ternaire se traduit comme un N:M mais avec trois clés étrangères.", a: true, exp: "Table d'association à trois FK." },
    { type: "qcm", q: "Si une vente a un numéro de facture unique, il vaut mieux…", opts: ["Garder la ternaire", "En faire une entité VENTE avec cet identifiant", "Supprimer le vendeur", "Ignorer la date"], a: 1, exp: "L'identifiant propre justifie une entité." }
  ],
  final: {
    title: "Exercice final — Reconnaître le besoin d'une ternaire",
    intro: `<p>Une compagnie aérienne : « Un PILOTE pilote un AVION sur un VOL donné. » On veut savoir qui a piloté quel avion sur quel vol. Le texte après <code>//</code> rappelle le rôle de chaque entité :</p>
<pre class="pseudo">PILOTE( #idPilote, nom )              // celui qui pilote
AVION( #idAvion, modele )             // l'appareil utilisé
VOL( #idVol, date, destination )      // le trajet effectué</pre>`,
    questions: [
      { type: "qcm", q: "« Qui a piloté quel avion sur quel vol » met en jeu…", opts: ["Deux entités", "Trois entités simultanément → ternaire", "Une entité", "Aucune"], a: 1, exp: "Pilote + Avion + Vol ensemble." },
      { type: "qcm", q: "Trois binaires séparées (pilote-avion, pilote-vol, avion-vol)…", opts: ["Conservent tout", "Perdent l'info « ces trois-là ensemble »", "Sont obligatoires", "Sont plus précises"], a: 1, exp: "La décomposition perd le fait global." },
      { type: "qcm", q: "L'association ternaire pourrait s'appeler…", opts: ["PILOTE", "ASSURER (le vol)", "TRANSPORTER", "idVol"], a: 1, exp: "Un verbe métier reliant les trois." },
      { type: "qcm", q: "Au MLD, elle deviendra une table avec…", opts: ["Une FK", "Les trois FK (idPilote, idAvion, idVol)", "Aucune FK", "Un index seul"], a: 1, exp: "Trois clés étrangères." },
      { type: "vf", q: "Si chaque vol n'a qu'un avion et un pilote, on pourrait aussi mettre idAvion et idPilote directement dans VOL.", a: true, exp: "Selon les cardinalités réelles, une entité VOL enrichie peut suffire." }
    ],
    solution: `<pre class="pseudo">Ternaire :
  ( ASSURER )  relie  PILOTE, AVION, VOL     // un verbe qui lie les trois entités
  PILOTE 0,n / AVION 0,n / VOL 0,n           // une cardinalité par patte

MLD :
  ASSURER( #idPilote, #idAvion, #idVol )     -- table à 3 clés étrangères

Variante (si un vol = 1 avion + 1 pilote) :
  VOL( #idVol, date, destination, #idAvion, #idPilote )   // les 2 FK directement dans VOL</pre>
<p>Tu sais reconnaître une ternaire. Demain : une entité reliée à elle-même.</p>`
  }
};
</script>
