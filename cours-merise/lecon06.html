<script>
var DAY = {
  num: 6,
  title: "Associations 1:1, 1:N et N:M",
  subtitle: "Classer les associations selon leurs maxi — la clé du futur MLD.",
  theory: `
<h3>1. Le type se lit sur les maxi</h3>
<p>Chaque association binaire appartient à une <strong>famille</strong> (un « type »). Bonne nouvelle : ce type se lit directement sur les deux <strong>maximums</strong> de cardinalité (le second chiffre de chaque étiquette (mini, maxi)). Pour classer, on ignore volontairement les mini (0 ou 1) : seul compte le maxi (1 ou n) de chaque côté. On note ces types <code>1:1</code>, <code>1:N</code>, <code>N:M</code> (les lettres N et M signifient toutes deux « plusieurs »). Le texte après <code>//</code> est un commentaire.</p>
<pre class="pseudo">maxi 1  et maxi 1   ->  1:1   // un-à-un : au plus un de chaque côté
maxi 1  et maxi n   ->  1:N   // un-à-plusieurs : un côté unique, l'autre multiple
maxi n  et maxi n   ->  N:M   // plusieurs-à-plusieurs : multiple des deux côtés</pre>

<h3>2. L'association 1:N (la plus fréquente)</h3>
<p>Dans un <strong>1:N</strong>, un côté a un maxi à 1 et l'autre à n. Exemple concret : un jeu appartient à une seule catégorie (maxi 1 côté JEU), tandis qu'une catégorie regroupe plusieurs jeux (maxi n côté CATEGORIE).</p>
<pre class="pseudo">CATEGORIE 0,n ----( APPARTENIR )---- 1,1 JEU     ->  1:N   // maxi n à gauche, maxi 1 à droite</pre>
<div class="tip">Au MLD (le niveau des tables), un 1:N se traduira SANS nouvelle table : on ajoute simplement une <strong>clé étrangère</strong> du côté « n » (dans la table JEU, on mettra une colonne idCategorie qui pointe vers CATEGORIE). Une clé étrangère est une colonne qui « recopie » l'identifiant d'une autre table pour la désigner. Retiens cette règle : c'est la plus utilisée.</div>

<h3>3. L'association N:M (plusieurs-à-plusieurs)</h3>
<p>Dans un <strong>N:M</strong>, les deux maxi valent n. Exemple : un client loue plusieurs jeux, ET un jeu est loué par plusieurs clients.</p>
<pre class="pseudo">CLIENT 0,n ----( LOUER )---- 0,n JEU             ->  N:M   // maxi n des DEUX côtés</pre>
<div class="warn">Au MLD, un N:M devient obligatoirement une <strong>nouvelle table</strong> (appelée table d'association ou table de liaison), contenant les deux clés étrangères. Une simple clé étrangère ne suffit JAMAIS pour un N:M : on ne saurait pas où la mettre puisque les deux côtés sont multiples.</div>

<h3>4. L'association 1:1 (rare)</h3>
<p>Dans un <strong>1:1</strong>, les deux maxi valent 1. Exemple : un pays a une seule capitale, et une ville est capitale d'un seul pays. Le 1:1 est rare et cache souvent une seule entité qu'on a coupée en deux sans raison ; il faut donc toujours le remettre en question (« ces deux entités ne devraient-elles pas n'en faire qu'une ? »).</p>
<pre class="pseudo">PAYS 0,1 ----( AVOIR_CAPITALE )---- 1,1 VILLE   ->  1:1   // maxi 1 des deux côtés</pre>

<h3>5. Récapitulatif visuel</h3>
<p>Ce tableau relie chaque type à sa future traduction en tables. La première ligne est l'en-tête (le nom des colonnes) ; le texte après <code>//</code> commente.</p>
<pre class="pseudo">TYPE   MAXI gauche / droite   TRADUCTION AU MLD                      // en-tête du tableau
1:1    1 / 1                  clé étrangère d'un côté (+ unicité)      // rare : à questionner
1:N    1 / n                  clé étrangère du côté « n »             // le cas le plus courant
N:M    n / n                  NOUVELLE TABLE avec les deux clés étrangères  // table d'association obligatoire</pre>
<p>Savoir classer une association, c'est déjà savoir comment elle deviendra des tables. Ces règles de passage seront détaillées aux leçons 15 à 17.</p>`,
  exercises: [
    { type: "qcm", q: "Le type d'une association se lit sur…", opts: ["Les mini", "Les maxi (1 ou n de chaque côté)", "Les noms", "Les couleurs"], a: 1, exp: "On classe par les maximums." },
    { type: "qcm", q: "Maxi 1 et maxi n donnent une association…", opts: ["1:1", "1:N", "N:M", "ternaire"], a: 1, exp: "Un-à-plusieurs." },
    { type: "qcm", q: "Maxi n et maxi n donnent une association…", opts: ["1:1", "1:N", "N:M", "réflexive"], a: 2, exp: "Plusieurs-à-plusieurs." },
    { type: "qcm", q: "Maxi 1 et maxi 1 donnent une association…", opts: ["1:1", "1:N", "N:M", "aucune"], a: 0, exp: "Un-à-un." },
    { type: "qcm", q: "Le type d'association le plus fréquent est…", opts: ["1:1", "1:N", "N:M", "ternaire"], a: 1, exp: "Le 1:N domine les modèles." },
    { type: "qcm", q: "Un 1:N se traduit au MLD par…", opts: ["Une nouvelle table", "Une clé étrangère du côté « n »", "Rien", "Deux tables en plus"], a: 1, exp: "FK côté n, pas de table supplémentaire." },
    { type: "qcm", q: "Un N:M se traduit au MLD par…", opts: ["Une clé étrangère", "Une nouvelle table (table d'association) avec deux FK", "Rien", "Un index"], a: 1, exp: "Table d'association obligatoire." },
    { type: "qcm", q: "« un jeu, une catégorie ; une catégorie, plusieurs jeux » est…", opts: ["N:M", "1:N", "1:1", "réflexif"], a: 1, exp: "Maxi 1 côté jeu, n côté catégorie." },
    { type: "qcm", q: "« un client loue plusieurs jeux, un jeu est loué par plusieurs clients » est…", opts: ["1:1", "1:N", "N:M", "aucune"], a: 2, exp: "Maxi n des deux côtés." },
    { type: "qcm", q: "Le 1:1 est…", opts: ["Le plus fréquent", "Rare, et cache souvent une seule entité coupée en deux", "Impossible", "Interdit"], a: 1, exp: "À questionner systématiquement." },
    { type: "vf", q: "Pour classer une association, on ignore les mini et on regarde les maxi.", a: true, exp: "Le maxi détermine 1:1 / 1:N / N:M." },
    { type: "qcm", q: "Pour un N:M, une clé étrangère seule…", opts: ["Suffit", "Ne suffit jamais : il faut une table d'association", "Est interdite", "Remplace tout"], a: 1, exp: "Le N:M exige une table dédiée." },
    { type: "qcm", q: "Dans un 1:N, la clé étrangère va…", opts: ["Du côté « 1 »", "Du côté « n »", "Nulle part", "Des deux côtés"], a: 1, exp: "La clé du « 1 » descend chez le « n »." },
    { type: "qcm", q: "« un pays a une capitale, une ville est capitale d'un seul pays » est…", opts: ["N:M", "1:N", "1:1", "ternaire"], a: 2, exp: "Maxi 1 des deux côtés." },
    { type: "vf", q: "Classer une association renseigne déjà sur sa future traduction en tables.", a: true, exp: "Type = règle de passage au MLD." }
  ],
  final: {
    title: "Exercice final — Classer trois associations",
    intro: `<p>Trois associations d'un système scolaire. Le texte après <code>//</code> rappelle les maxi à comparer :</p>
<pre class="pseudo">A) ELEVE 0,n --( SUIVRE )-- 1,n COURS              // maxi n à gauche, maxi n à droite
B) COURS 1,1 --( SE_DEROULER )-- 0,n SALLE          // maxi 1 à gauche, maxi n à droite
C) ELEVE 1,1 --( AVOIR_DOSSIER )-- 1,1 DOSSIER_MEDICAL  // maxi 1 à gauche, maxi 1 à droite</pre>`,
    questions: [
      { type: "qcm", q: "L'association A (SUIVRE) est de type…", opts: ["1:1", "1:N", "N:M", "aucune"], a: 2, exp: "Maxi n des deux côtés." },
      { type: "qcm", q: "L'association B (SE_DEROULER) est de type…", opts: ["1:1", "1:N", "N:M", "ternaire"], a: 1, exp: "Maxi 1 côté COURS, n côté SALLE." },
      { type: "qcm", q: "L'association C (AVOIR_DOSSIER) est de type…", opts: ["N:M", "1:N", "1:1", "réflexive"], a: 2, exp: "Maxi 1 des deux côtés." },
      { type: "qcm", q: "Laquelle exigera une NOUVELLE table au MLD ?", opts: ["A (le N:M)", "B", "C", "Aucune"], a: 0, exp: "Seul le N:M impose une table d'association." },
      { type: "vf", q: "L'association B se traduira par une clé étrangère du côté SALLE.", a: true, exp: "1:N : FK du côté « n »." }
    ],
    solution: `<pre class="pseudo">A) SUIVRE        : N:M   // maxi n des deux côtés -> nouvelle table SUIVRE(idEleve, idCours)
B) SE_DEROULER   : 1:N   // maxi 1 côté COURS -> FK idSalle dans COURS
C) AVOIR_DOSSIER : 1:1   // maxi 1 des deux côtés -> FK d'un côté (idDossier dans ELEVE) + unicité

Le maxi décide du type ; le type décide de la traduction.   // règle à retenir</pre>
<p>Tu classes les associations sans hésiter. Demain : assembler un MCD complet et le relire.</p>`
  }
};
</script>

  { id: "mer-l6", title: "Déterminer les types d'associations", level: 3,
    statement: "Pour une plateforme de streaming : (1) un UTILISATEUR possède un seul ABONNEMENT actif, un abonnement appartient à un seul utilisateur ; (2) un UTILISATEUR regarde plusieurs FILMS, un film est regardé par plusieurs utilisateurs. Donne le type (1:1, 1:N ou N:M) de chaque association et indique laquelle nécessitera une nouvelle table au MLD.",

    solution: "(1) UTILISATEUR 1,1 --( POSSEDER )-- 0,1 ABONNEMENT\n    Maxi 1 des deux côtés  ->  1:1\n    (traduction : une clé étrangère d'un côté + contrainte d'unicité)\n\n(2) UTILISATEUR 0,n --( REGARDER )-- 0,n FILM\n    Maxi n des deux côtés  ->  N:M\n    ->  NÉCESSITE une nouvelle table REGARDER(idUtilisateur, idFilm)\n\nSeule l'association (2), de type N:M, impose une table d'association.",
