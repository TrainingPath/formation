<script>
var DAY = {
  num: 5,
  title: "Les cardinalités",
  subtitle: "Le cœur du MCD : « combien de fois ? » sur chaque patte.",
  theory: `
<h3>1. Définition</h3>
<p>Une <strong>cardinalité</strong> est une petite étiquette qu'on pose sur chaque <strong>patte</strong> d'une association (une patte = le trait qui relie l'association à une entité). Elle répond à la question « combien de fois ? ». Précisément : pour <strong>une seule</strong> occurrence de l'entité, elle donne le nombre <strong>minimum</strong> et <strong>maximum</strong> de fois où cette occurrence participe à l'association. On l'écrit sous la forme <code>(mini, maxi)</code>. Dans le schéma, le texte après <code>//</code> est un commentaire.</p>
<pre class="pseudo">CLIENT 0,n ----( LOUER )---- 1,n JEU     // 0,n du côté client ; 1,n du côté jeu (une étiquette par patte)</pre>

<h3>2. Comment lire une cardinalité</h3>
<p>On lit toujours en partant de l'entité, vers l'association : « pour UN client, COMBIEN de locations au minimum et au maximum ? ». Dans l'exemple ci-dessus, l'étiquette côté CLIENT vaut <code>0,n</code> : cela signifie qu'un client donné peut n'avoir loué aucun jeu (minimum 0) ou en avoir loué plusieurs (maximum n, « n » se lisant « un nombre quelconque, sans limite fixée »).</p>

<h3>3. Les quatre cardinalités courantes</h3>
<p>Il n'existe en pratique que quatre étiquettes. Le texte après <code>//</code> traduit chacune en langage courant.</p>
<pre class="pseudo">0,1  : au minimum 0, au maximum 1   // facultatif, et au plus une seule fois
1,1  : exactement 1                 // obligatoire, et exactement une seule fois
0,n  : au minimum 0, au maximum n   // facultatif, et plusieurs fois possibles
1,n  : au minimum 1, au maximum n   // obligatoire, et plusieurs fois possibles</pre>
<p>Retiens la clé de lecture : le <strong>mini</strong> (0 ou 1) dit si la participation est <em>facultative</em> (0) ou <em>obligatoire</em> (1). Le <strong>maxi</strong> (1 ou n) dit si l'entité participe <em>une seule fois</em> (1) ou <em>plusieurs fois</em> (n).</p>

<h3>4. Exemple raisonné</h3>
<pre class="pseudo">CATEGORIE 0,n ----( APPARTENIR )---- 1,1 JEU   // à lire patte par patte, ci-dessous

Côté JEU (1,1)       // un jeu appartient à EXACTEMENT une catégorie
                     // (mini 1 = obligatoire, maxi 1 = une seule)
Côté CATEGORIE (0,n) // une catégorie regroupe de 0 à n jeux
                     // (une catégorie peut être vide, ou contenir plusieurs jeux)</pre>
<div class="tip">Astuce de lecture : commence par le maxi, il donne la structure (1 ou n). Le mini affine ensuite l'obligation (0 = facultatif, 1 = obligatoire).</div>

<h3>5. Choisir le bon mini</h3>
<p>Le mini traduit une <strong>règle de gestion</strong> (une règle du métier). Pose-toi la question à voix haute : « Un client doit-il forcément avoir loué un jeu ? » Non : un client peut s'inscrire sans jamais louer → mini 0. « Un jeu doit-il forcément appartenir à une catégorie ? » Si la règle dit oui → mini 1. Le mini ne se devine pas : il se décide en interrogeant le métier.</p>
<div class="warn">Erreur classique du débutant : mettre 1,n partout par réflexe. Demande-toi à CHAQUE patte : la participation est-elle vraiment obligatoire (mini 1) ou facultative (mini 0) ?</div>`,
  exercises: [
    { type: "qcm", q: "Une cardinalité s'écrit…", opts: ["(couleur, taille)", "(mini, maxi)", "(nom, prénom)", "(clé, valeur)"], a: 1, exp: "Minimum et maximum de participation." },
    { type: "qcm", q: "On lit une cardinalité…", opts: ["De l'association vers l'entité", "Du côté de l'entité, vers l'association", "De droite à gauche uniquement", "Au hasard"], a: 1, exp: "« Pour UNE occurrence, combien de fois ? »" },
    { type: "qcm", q: "La cardinalité 1,1 signifie…", opts: ["De 0 à plusieurs", "Exactement une fois (obligatoire, unique)", "Au moins une fois", "Jamais"], a: 1, exp: "Mini 1, maxi 1." },
    { type: "qcm", q: "La cardinalité 0,n signifie…", opts: ["Exactement une", "De 0 à plusieurs (facultative, multiple)", "Au moins une", "Aucune jamais"], a: 1, exp: "Mini 0, maxi n." },
    { type: "qcm", q: "La cardinalité 1,n signifie…", opts: ["De 0 à 1", "Au moins une, plusieurs possibles (obligatoire, multiple)", "Exactement une", "Zéro"], a: 1, exp: "Mini 1, maxi n." },
    { type: "qcm", q: "Le MINI d'une cardinalité indique…", opts: ["La couleur", "Si la participation est facultative (0) ou obligatoire (1)", "Le nombre de tables", "La vitesse"], a: 1, exp: "0 = facultatif, 1 = obligatoire." },
    { type: "qcm", q: "Le MAXI d'une cardinalité indique…", opts: ["La date", "Si l'entité participe une seule fois (1) ou plusieurs (n)", "L'identifiant", "Le type SQL"], a: 1, exp: "1 = unique, n = multiple." },
    { type: "qcm", q: "Dans « JEU 1,1 APPARTENIR CATEGORIE », un jeu a…", opts: ["0 à plusieurs catégories", "Exactement une catégorie", "Au moins deux catégories", "Aucune catégorie"], a: 1, exp: "1,1 = exactement une." },
    { type: "qcm", q: "Dans « CATEGORIE 0,n APPARTENIR JEU », une catégorie…", opts: ["A exactement un jeu", "Peut regrouper de 0 à n jeux", "A au moins deux jeux", "N'a jamais de jeu"], a: 1, exp: "0,n = de zéro à plusieurs." },
    { type: "qcm", q: "« Un client peut exister sans avoir loué » se traduit côté CLIENT par…", opts: ["mini 1", "mini 0", "maxi 1", "maxi 0"], a: 1, exp: "Participation facultative = mini 0." },
    { type: "vf", q: "Mettre 1,n partout par réflexe est une erreur : le mini se décide selon le métier.", a: true, exp: "Il faut interroger l'obligation à chaque patte." },
    { type: "qcm", q: "Pour lire vite, on regarde d'abord…", opts: ["Le mini", "Le maxi (il donne la structure 1 ou n)", "La couleur", "Le nom de l'entité"], a: 1, exp: "Le maxi structure, le mini affine." },
    { type: "qcm", q: "« Un jeu doit obligatoirement avoir une catégorie » fixe côté JEU le mini à…", opts: ["0", "1", "n", "aucun"], a: 1, exp: "Obligatoire = mini 1." },
    { type: "vf", q: "La cardinalité se place côté entité, sur la patte de l'association.", a: true, exp: "Une par patte." },
    { type: "qcm", q: "Combien de cardinalités porte une association binaire ?", opts: ["Une", "Deux (une par patte)", "Trois", "Zéro"], a: 1, exp: "Une de chaque côté." }
  ],
  final: {
    title: "Exercice final — Poser les cardinalités",
    intro: `<p>Règles de gestion d'une bibliothèque. Le texte après <code>//</code> traduit chaque règle en cardinalité :</p>
<pre class="pseudo">- un EMPRUNT concerne un seul LIVRE et un seul ADHERENT   // participations obligatoires et uniques
- un LIVRE peut ne jamais avoir été emprunté, ou plusieurs fois  // côté LIVRE : de 0 à n
- un ADHERENT peut n'avoir aucun emprunt, ou en avoir plusieurs  // côté ADHERENT : de 0 à n
Association : ADHERENT --( EMPRUNTER )-- LIVRE            // le lien à cardinaliser</pre>`,
    questions: [
      { type: "qcm", q: "Côté ADHERENT sur EMPRUNTER, la cardinalité est…", opts: ["1,1", "0,n", "1,n", "0,1"], a: 1, exp: "Peut n'avoir aucun (0) ou plusieurs (n) emprunts." },
      { type: "qcm", q: "Côté LIVRE sur EMPRUNTER, la cardinalité est…", opts: ["1,1", "0,n", "1,n", "0,1"], a: 1, exp: "Jamais emprunté (0) ou plusieurs fois (n)." },
      { type: "qcm", q: "Le maxi n des deux côtés indique une association de type…", opts: ["1:1", "1:N", "N:M", "Aucune"], a: 2, exp: "Plusieurs des deux côtés = N:M." },
      { type: "qcm", q: "Si on imposait « tout adhérent a au moins un emprunt », côté ADHERENT deviendrait…", opts: ["0,n", "1,n", "1,1", "0,1"], a: 1, exp: "Le mini passerait à 1." },
      { type: "vf", q: "Le mini 0 côté LIVRE traduit qu'un livre peut n'avoir jamais été emprunté.", a: true, exp: "Participation facultative." }
    ],
    solution: `<pre class="pseudo">ADHERENT 0,n ----( EMPRUNTER )---- 0,n LIVRE   // cardinalités posées sur chaque patte

Côté ADHERENT 0,n   // de 0 à plusieurs emprunts (facultatif, multiple)
Côté LIVRE    0,n   // de 0 à plusieurs emprunts (facultatif, multiple)
Maxi n des deux côtés  ->  association N:M      // plusieurs des deux côtés
(EMPRUNTER portera sûrement une dateEmprunt)   // association porteuse, vue en leçon 8</pre>
<p>Tu poses des cardinalités justes. Demain : classer les associations en 1:1, 1:N et N:M.</p>`
  }
};
</script>
