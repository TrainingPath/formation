<script>
var DAY = {
  num: 20,
  title: "Projet guidé : la base de la Ludothèque",
  subtitle: "Du MCD au MPD, le modèle complet en un seul flux.",
  theory: `
<h3>1. Le cahier des charges</h3>
<p>Le <strong>cahier des charges</strong> est le texte qui décrit ce que la base doit gérer. Le voici : « La ludothèque gère un catalogue de jeux, rangés par catégorie et fournis par des fournisseurs. Des utilisateurs (clients, vendeurs, administrateurs) interviennent. Un client peut <strong>louer</strong> ou <strong>acheter</strong> des jeux. Le stock est géré par deux compteurs : un pour la vente, un pour la location. » Nous allons assembler ici, sur ce seul exemple, tout ce que le cours a présenté.</p>

<h3>2. Le MCD complet</h3>
<p>On repère les entités, l'héritage, et les associations avec leurs cardinalités. Le triangle <code>△</code> marque l'héritage ; le texte après <code>//</code> commente.</p>
<pre class="pseudo">UTILISATEUR( #idUtilisateur, nom, prenom, email )   // sur-entité : le commun
   △ (partition X,T)                                  // exactement un sous-type
   ├── CLIENT( adresse, pointsFidelite )              // sous-entité spécialisée
   ├── VENDEUR( matricule )                            // sous-entité spécialisée
   └── ADMINISTRATEUR( niveauAcces )                   // sous-entité spécialisée

CATEGORIE( #idCategorie, libelle )                    // entité
FOURNISSEUR( #idFournisseur, nom, telephone )          // entité
JEU( #idJeu, titre, prixAchat, prixLocation, stockVente, stockLocation )  // entité : 2 compteurs de stock

CATEGORIE   0,n --( APPARTENIR )-- 1,1 JEU            // 1:N : un jeu a une catégorie
FOURNISSEUR 0,n --( FOURNIR )--    1,1 JEU            // 1:N : un jeu vient d'un fournisseur
CLIENT 0,n --( LOUER: dateDebut, nbJours, montant )-- 0,n JEU    // N:M porteuse : location
CLIENT 0,n --( ACHETER: dateAchat, prix )-- 0,n JEU              // N:M porteuse : achat</pre>

<h3>3. Le passage au MLD</h3>
<p>On applique les règles (leçons 15-17) : entités → tables ; héritage → mère + filles ; 1:N (APPARTENIR, FOURNIR) → clés étrangères ; N:M porteuses (LOUER, ACHETER) → tables d'association. Le texte après <code>//</code> commente.</p>
<pre class="pseudo">UTILISATEUR( #idUtilisateur, nom, prenom, email, type )        // mère : commun + colonne type
CLIENT( #idUtilisateur -> UTILISATEUR, adresse, pointsFidelite )  // fille : clé = FK mère
VENDEUR( #idUtilisateur -> UTILISATEUR, matricule )              // fille
ADMINISTRATEUR( #idUtilisateur -> UTILISATEUR, niveauAcces )      // fille
CATEGORIE( #idCategorie, libelle )
FOURNISSEUR( #idFournisseur, nom, telephone )
JEU( #idJeu, titre, prixAchat, prixLocation, stockVente, stockLocation,   // les deux FK du 1:N :
     #idCategorie -> CATEGORIE, #idFournisseur -> FOURNISSEUR )           // catégorie + fournisseur
LOUER( #idClient -> CLIENT, #idJeu -> JEU, #dateDebut, nbJours, montant )  // table du N:M location
ACHETER( #idClient -> CLIENT, #idJeu -> JEU, #dateAchat, prix )            // table du N:M achat</pre>

<h3>4. Un extrait de MPD</h3>
<p>On concrétise la table JEU en SQL. Le texte après <code>--</code> est un commentaire SQL.</p>
<pre class="pseudo">CREATE TABLE JEU (                                            -- crée la table JEU
  idJeu        INT           PRIMARY KEY AUTO_INCREMENT,       -- clé auto-numérotée
  titre        VARCHAR(120)  NOT NULL,                         -- texte obligatoire
  prixAchat    DECIMAL(6,2)  NOT NULL CHECK (prixAchat >= 0),  -- décimal exact, jamais négatif
  prixLocation DECIMAL(6,2)  NOT NULL CHECK (prixLocation >= 0), -- idem
  stockVente    INT          NOT NULL DEFAULT 0,               -- compteur de vente, 0 par défaut
  stockLocation INT          NOT NULL DEFAULT 0,               -- compteur de location, 0 par défaut
  idCategorie   INT          NOT NULL,                         -- FK obligatoire
  idFournisseur INT          NOT NULL,                         -- FK obligatoire
  FOREIGN KEY (idCategorie)   REFERENCES CATEGORIE(idCategorie),   -- lien vers CATEGORIE
  FOREIGN KEY (idFournisseur) REFERENCES FOURNISSEUR(idFournisseur), -- lien vers FOURNISSEUR
  INDEX idx_titre (titre)                                      -- recherche par titre accélérée
);</pre>

<h3>5. La relecture finale</h3>
<p>On coche la checklist de qualité (☐ = case à cocher). Le texte après <code>//</code> précise.</p>
<pre class="pseudo">☐ chaque entité a un identifiant, chaque table une clé primaire   // rien d'orphelin
☐ héritage : clé fille = FK vers la mère                          // stratégie B respectée
☐ JEU : deux clés étrangères (idCategorie, idFournisseur) + deux stocks  // liens et compteurs présents
☐ LOUER / ACHETER : clés composées incluant la date               // relouer/racheter possible
☐ toutes les FK ciblent une PK existante ; 3FN respectée          // cohérence et pas de redondance</pre>
<div class="tip">Ce modèle sera exactement le point de départ des cours SQL, SQL Server et MySQL : on y créera ces tables, puis on les remplira et les interrogera. La boucle « conception → base réelle » est bouclée.</div>`,
  exercises: [
    { type: "qcm", q: "Dans le MCD, UTILISATEUR se spécialise en…", opts: ["Une seule entité", "CLIENT, VENDEUR, ADMINISTRATEUR (héritage)", "Des index", "Des catégories"], a: 1, exp: "Partition d'héritage." },
    { type: "qcm", q: "FOURNISSEUR est reliée à JEU par une association…", opts: ["N:M", "1:N (un jeu vient d'un fournisseur ; un fournisseur fournit plusieurs jeux)", "1:1", "réflexive"], a: 1, exp: "FOURNIR est 1:N : clé étrangère idFournisseur dans JEU." },
    { type: "qcm", q: "APPARTENIR (CATEGORIE-JEU) est de type…", opts: ["N:M", "1:N", "1:1", "ternaire"], a: 1, exp: "Un jeu, une catégorie ; une catégorie, plusieurs jeux." },
    { type: "qcm", q: "LOUER et ACHETER sont des associations…", opts: ["1:1", "1:N", "N:M porteuses", "réflexives"], a: 2, exp: "Plusieurs des deux côtés + propriétés." },
    { type: "qcm", q: "L'héritage se traduit ici en stratégie…", opts: ["A (une table)", "B (mère + filles)", "C (filles seules)", "aucune"], a: 1, exp: "UTILISATEUR + CLIENT/VENDEUR/ADMIN." },
    { type: "qcm", q: "Le stock d'un jeu est modélisé par…", opts: ["Une entité EXEMPLAIRE", "Deux compteurs : stockVente et stockLocation", "Un seul compteur", "Une association"], a: 1, exp: "Deux stocks : un pour la vente, un pour la location." },
    { type: "qcm", q: "CLIENT.idUtilisateur est…", opts: ["Une simple colonne", "Clé primaire ET clé étrangère vers UTILISATEUR", "Calculée", "Un index"], a: 1, exp: "Stratégie B." },
    { type: "qcm", q: "La table LOUER contient…", opts: ["Une seule clé", "idClient, idJeu, dateDebut + nbJours, montant", "Seulement le montant", "Rien"], a: 1, exp: "Table d'association porteuse." },
    { type: "qcm", q: "JEU.idCategorie est…", opts: ["Une clé primaire", "Une clé étrangère NOT NULL vers CATEGORIE", "Calculée", "Nullable ici"], a: 1, exp: "Tout jeu a une catégorie." },
    { type: "qcm", q: "Pour le prix des jeux, on choisit le type…", opts: ["FLOAT", "DECIMAL(6,2)", "VARCHAR", "BOOLEAN"], a: 1, exp: "Décimal exact pour l'argent." },
    { type: "vf", q: "Ce MLD respecte la 3FN si aucune information n'est dupliquée entre tables.", a: true, exp: "Objectif de qualité." },
    { type: "qcm", q: "La clé de LOUER inclut la date pour…", opts: ["Décorer", "Permettre de relouer le même jeu à une autre date", "Trier", "Indexer"], a: 1, exp: "Autoriser la répétition du couple." },
    { type: "qcm", q: "L'index idx_titre sur JEU accélère…", opts: ["Les suppressions", "La recherche d'un jeu par titre", "Les insertions", "Le calcul du stock"], a: 1, exp: "Recherche fréquente par titre." },
    { type: "qcm", q: "Ce modèle servira de point de départ aux cours…", opts: ["De dessin", "SQL, SQL Server, MySQL", "De Python seulement", "D'HTML"], a: 1, exp: "On y créera ces tables." },
    { type: "vf", q: "Chaque clé étrangère du MLD doit cibler une clé primaire existante.", a: true, exp: "Intégrité référentielle." }
  ],
  final: {
    title: "Exercice final — Compléter le modèle",
    intro: `<p>On veut ajouter les VENTES avec un vendeur : « Un client achète un jeu auprès d'un vendeur, à une date. »</p>`,
    questions: [
      { type: "qcm", q: "« client + jeu + vendeur ensemble » suggère…", opts: ["Un 1:N", "Une association ternaire (ou une entité VENTE)", "Une réflexive", "Un index"], a: 1, exp: "Trois acteurs simultanés." },
      { type: "qcm", q: "En table d'association ternaire, la table VENDRE aura…", opts: ["Une FK", "Trois clés étrangères (idClient, idJeu, idVendeur)", "Aucune", "Un index seul"], a: 1, exp: "Une FK par entité." },
      { type: "qcm", q: "Le vendeur est une sous-entité de…", opts: ["JEU", "UTILISATEUR", "CATEGORIE", "FOURNISSEUR"], a: 1, exp: "VENDEUR hérite d'UTILISATEUR." },
      { type: "qcm", q: "La propriété « dateVente » se place…", opts: ["Dans CLIENT", "Dans la table VENDRE (dépend du trio)", "Dans JEU", "Dans CATEGORIE"], a: 1, exp: "Propriété portée par la ternaire." },
      { type: "vf", q: "On pourrait aussi modéliser la vente comme une entité VENTE avec un identifiant propre.", a: true, exp: "Souvent plus lisible (n° de facture)." }
    ],
    solution: `<pre class="pseudo">Option ternaire :
  VENDRE( #idClient -> CLIENT, #idJeu -> JEU, #idVendeur -> VENDEUR, dateVente, prix )   // 3 FK + propriétés

Option entité (souvent préférée) :
  VENTE( #idVente, dateVente, prix, #idClient -> CLIENT,     // identifiant propre (ex. n° de facture)
         #idJeu -> JEU, #idVendeur -> VENDEUR )              // reliée aux trois acteurs par 3 FK

Le modèle complet de la Ludothèque est prêt pour le SQL.   // conception terminée</pre>
<p>Bravo : tu as conçu une base entière. Demain : l'examen final Merise.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Assemble le modèle de la Ludothèque…",
  items: [
  { id: "mer-l20", title: "Ajouter les réservations au modèle", level: 5,
    statement: "Complète le modèle de la Ludothèque : on veut gérer les <strong>réservations</strong> — un client réserve un jeu pour une date souhaitée, avec un statut (en attente, honorée, annulée). Donne l'ajout au MCD (association et cardinalités) puis au MLD (table, clés). Précise pourquoi la date de réservation entre dans la clé.",
    hints: [
      "RÉSERVER relie CLIENT et JEU : N:M porteuse (dateReservation, statut).",
      "Un même client peut réserver le même jeu à plusieurs dates : la date entre dans la clé.",
      "MLD : nouvelle table avec les deux clés étrangères + la date + le statut."
    ],
    solution: "MCD :\n  CLIENT 0,n ----( RESERVER )---- 0,n JEU\n                 RESERVER porte : dateReservation, statut\n\nMLD :\n  RESERVER( #idClient -> CLIENT, #idJeu -> JEU, #dateReservation, statut )\n    clé primaire = (idClient, idJeu, dateReservation)\n\nLa date entre dans la clé car un même client peut réserver le même jeu\nà plusieurs dates différentes : (idClient, idJeu) seul interdirait la répétition.",
    note: "La réservation suit le même schéma que LOUER et ACHETER : une N:M porteuse dont la clé inclut la date pour autoriser plusieurs occurrences du même couple. Le modèle accueille la nouvelle règle sans rien casser — signe d'une conception solide." }
  ]
};
</script>
