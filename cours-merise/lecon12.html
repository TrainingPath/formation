var DAY = {
  num: 12,
  title: "Identifiant relatif et entité faible",
  subtitle: "Une entité qui emprunte son identité à une autre.",
  theory: `
<h3>1. Le cas typique</h3>
<p>Imaginons un magasin de jeux. Chaque JEU (Catan, Azul…) existe en plusieurs <strong>exemplaires</strong> physiques, numérotés 1, 2, 3… <strong>à l'intérieur du jeu</strong>. Problème : le numéro d'exemplaire n'est PAS unique dans toute la base : il y a un « exemplaire 1 » pour Catan ET un « exemplaire 1 » pour Azul. Le numéro seul ne suffit donc pas à identifier un exemplaire précis. L'exemplaire ne peut pas s'identifier tout seul : il a besoin de savoir de quel jeu il parle.</p>

<h3>2. L'identifiant relatif</h3>
<p>Une <strong>entité faible</strong> est une entité qui ne peut pas s'identifier seule : elle possède un <strong>identifiant relatif</strong>, c'est-à-dire un identifiant qui doit être complété par celui de l'entité « forte » à laquelle elle est rattachée. L'identité complète d'un exemplaire est donc le couple <code>(idJeu, numExemplaire)</code>. Dans le schéma, le texte après <code>//</code> est un commentaire.</p>
<pre class="pseudo">EXEMPLAIRE
  #numExemplaire   (identifiant RELATIF à JEU)   // unique seulement DANS un jeu donné
  etat                                            // propriété propre (neuf, abîmé…)

JEU 1,n ----( POSSEDER )---- 1,1 EXEMPLAIRE       // 1,1 côté exemplaire : il dépend d'un seul jeu
  identité complète = (idJeu, numExemplaire)      // il faut les DEUX pour l'identifier</pre>
<div class="tip">On reconnaît une entité faible à sa cardinalité 1,1 vers l'entité forte : l'exemplaire dépend TOTALEMENT d'un jeu, à la fois pour exister et pour être identifié.</div>

<h3>3. Comment savoir si une entité est faible ?</h3>
<p>Trois indices. Le texte après <code>//</code> explicite chacun.</p>
<pre class="pseudo">- son identifiant seul n'est PAS unique globalement   // « exemplaire 1 » existe pour plusieurs jeux
- elle n'existe QUE rattachée à une entité forte       // cardinalité 1,1 vers l'entité forte
- si l'entité forte disparaît, l'entité faible n'a plus de sens  // supprimer le jeu supprime ses exemplaires</pre>
<p>Autres exemples : une LIGNE de facture (relative à la FACTURE), une PLACE dans une salle, un CHAPITRE d'un livre, un ÉPISODE d'une saison. Dans chaque cas, le numéro n'a de sens que « à l'intérieur » de l'entité forte.</p>

<h3>4. La traduction au MLD</h3>
<p>La clé primaire de la table faible est <strong>composite</strong> (elle combine plusieurs colonnes) : elle réunit la clé étrangère vers l'entité forte ET l'identifiant relatif.</p>
<pre class="pseudo">EXEMPLAIRE( #idJeu, #numExemplaire, etat )   // la table faible
  clé primaire = (idJeu, numExemplaire)       // deux colonnes forment ensemble la clé
  idJeu -> JEU(idJeu)                          // idJeu est aussi une clé étrangère vers JEU</pre>
<div class="warn">Ne confonds pas entité faible et simple association 1:N. Une entité faible a ses PROPRES propriétés (etat, dateAchat…) et un identifiant relatif ; elle mérite sa propre table, avec une clé composite.</div>

<h3>5. Entité faible ou identifiant artificiel ?</h3>
<p>En pratique, on remplace souvent l'identifiant relatif par un identifiant <strong>artificiel</strong> autonome (un idExemplaire auto-incrémenté), tout en gardant la clé étrangère idJeu. C'est plus simple à manipuler dans les requêtes, au prix de perdre le « numéro dans le jeu » comme identifiant officiel.</p>
<pre class="pseudo">Variante : EXEMPLAIRE( #idExemplaire, numExemplaire, etat, #idJeu )   // id artificiel + FK vers le jeu</pre>`,
  exercises: [
    { type: "qcm", q: "Une entité faible…", opts: ["S'identifie toute seule", "Emprunte une partie de son identité à une entité forte", "N'a pas de propriétés", "Est une association"], a: 1, exp: "Identifiant relatif." },
    { type: "qcm", q: "Le numéro d'exemplaire (1, 2, 3 par jeu)…", opts: ["Est unique globalement", "N'est unique que pour un jeu donné", "Est une catégorie", "Est calculé"], a: 1, exp: "D'où l'identifiant relatif." },
    { type: "qcm", q: "L'identité complète d'un exemplaire est…", opts: ["numExemplaire seul", "(idJeu, numExemplaire)", "idJeu seul", "etat"], a: 1, exp: "Clé composite." },
    { type: "qcm", q: "On reconnaît une entité faible à sa cardinalité…", opts: ["0,n vers l'entité forte", "1,1 vers l'entité forte", "N:M", "0,1"], a: 1, exp: "Elle dépend totalement de l'entité forte." },
    { type: "qcm", q: "Si l'entité forte disparaît, l'entité faible…", opts: ["Continue seule", "N'a plus de sens", "Devient forte", "Se duplique"], a: 1, exp: "Dépendance existentielle." },
    { type: "qcm", q: "La clé primaire de la table faible est…", opts: ["Simple", "Composite (FK vers l'entité forte + identifiant relatif)", "Absente", "Un index"], a: 1, exp: "Ex. (idJeu, numExemplaire)." },
    { type: "qcm", q: "Une LIGNE de facture est faible par rapport à…", opts: ["Le PRODUIT", "La FACTURE", "Le CLIENT", "La DATE"], a: 1, exp: "Numérotée au sein de la facture." },
    { type: "qcm", q: "Une entité faible se distingue d'une simple association 1:N car…", opts: ["Elle n'a pas de propriétés", "Elle a ses propres propriétés et un identifiant relatif", "Elle n'a pas de lien", "Elle est colorée"], a: 1, exp: "Elle mérite sa table." },
    { type: "qcm", q: "Dans EXEMPLAIRE(#idJeu, #numExemplaire, etat), idJeu est…", opts: ["Une propriété simple", "Une partie de la clé ET une clé étrangère vers JEU", "Un calcul", "Un index inutile"], a: 1, exp: "Double rôle : clé + FK." },
    { type: "vf", q: "Une entité faible n'existe que rattachée à une entité forte.", a: true, exp: "Cardinalité 1,1 vers l'entité forte." },
    { type: "qcm", q: "Un CHAPITRE numéroté dans un LIVRE est…", opts: ["Une entité forte", "Une entité faible (identifiant relatif au livre)", "Une association", "Un index"], a: 1, exp: "« chapitre 1 » n'a de sens que dans un livre." },
    { type: "qcm", q: "Une variante pratique remplace l'identifiant relatif par…", opts: ["Rien", "Un identifiant artificiel autonome + FK vers l'entité forte", "Une couleur", "Deux entités"], a: 1, exp: "idExemplaire auto-incrémenté + idJeu." },
    { type: "qcm", q: "Une PLACE identifiée par (rangée, numéro) dans une SALLE illustre…", opts: ["Un héritage", "Un identifiant relatif / composite", "Une ternaire", "Une exclusion"], a: 1, exp: "Identité relative à la salle." },
    { type: "vf", q: "La clé composite d'une entité faible inclut la clé de l'entité forte.", a: true, exp: "C'est ce qui la rattache." },
    { type: "qcm", q: "Un ÉPISODE d'une SAISON (épisode 1, 2, 3…) est…", opts: ["Une entité forte", "Une entité faible relative à la saison", "Une propriété", "Un index"], a: 1, exp: "Numéroté au sein de la saison." }
  ],
  final: {
    title: "Exercice final — Une entité faible de facturation",
    intro: `<p>Une facture contient des lignes numérotées 1, 2, 3… Chaque ligne référence un produit, avec une quantité. Le texte après <code>//</code> précise chaque élément :</p>
<pre class="pseudo">FACTURE( #idFacture, date, client )              // l'entité forte
PRODUIT( #idProduit, nom, prix )                  // le produit référencé par une ligne
LIGNE : numéro (1,2,3… par facture), quantité      // numéro RELATIF à sa facture -> entité faible</pre>`,
    questions: [
      { type: "qcm", q: "LIGNE est une entité…", opts: ["Forte", "Faible, relative à FACTURE", "Association pure", "Index"], a: 1, exp: "Numéro relatif à la facture." },
      { type: "qcm", q: "L'identité complète d'une ligne est…", opts: ["numLigne seul", "(idFacture, numLigne)", "idProduit seul", "quantite"], a: 1, exp: "Clé composite." },
      { type: "qcm", q: "La cardinalité de LIGNE vers FACTURE est…", opts: ["0,n", "1,1 (une ligne appartient à exactement une facture)", "N:M", "0,1"], a: 1, exp: "Dépendance totale." },
      { type: "qcm", q: "Au MLD, la clé primaire de LIGNE est…", opts: ["(idFacture, numLigne)", "numLigne", "idProduit", "quantite"], a: 0, exp: "FK facture + numéro relatif." },
      { type: "vf", q: "LIGNE référence aussi PRODUIT par une clé étrangère idProduit.", a: true, exp: "Chaque ligne pointe un produit." }
    ],
    solution: `<pre class="pseudo">FACTURE( #idFacture, date, client )
PRODUIT( #idProduit, nom, prix )
LIGNE( #idFacture, #numLigne, quantite, #idProduit )   // table de l'entité faible
  clé primaire = (idFacture, numLigne)                  // clé composite
  idFacture -> FACTURE  ,  idProduit -> PRODUIT          // deux clés étrangères

LIGNE est faible : « ligne 1 » n'a de sens que dans SA facture.   // dépendance à l'entité forte</pre>
<p>Tu modélises les entités faibles. Demain : l'héritage (généralisation / spécialisation).</p>`
  }
};
