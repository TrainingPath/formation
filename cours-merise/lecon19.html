  title: "Du MLD au MPD : vers le physique",
  subtitle: "Types, contraintes, index — et un aperçu du SQL.",
  theory: `
<h3>1. Le rôle du MPD</h3>
<p>Le <strong>MPD</strong> (Modèle Physique de Données) est le troisième et dernier niveau Merise. Il concrétise le MLD dans un <strong>SGBD précis</strong> (MySQL, SQL Server, Oracle…). Concrètement, on y fait quatre choses : on choisit un <strong>type</strong> pour chaque colonne (nombre ? texte ? date ?), on ajoute des <strong>contraintes</strong> (NOT NULL, UNIQUE, DEFAULT, CHECK), on définit les <strong>clés</strong>, et on prévoit des <strong>index</strong> pour la performance. C'est l'antichambre directe du langage SQL.</p>

<h3>2. Choisir les types de colonnes</h3>
<p>Un <strong>type</strong> dit quelle sorte de valeur une colonne peut contenir. Le texte après <code>--</code> ou <code>:</code> donne le type SQL correspondant.</p>
<pre class="pseudo">TEXTE court fixe/variable :  CHAR(n) / VARCHAR(n)     -- n = longueur max (VARCHAR = variable)
TEXTE long                :  TEXT                       -- pour de longs paragraphes
ENTIER                    :  INT (ou SMALLINT, BIGINT) -- nombres entiers, sans décimales
DÉCIMAL exact (argent)    :  DECIMAL(p, s)              -- ex. DECIMAL(6,2) = jusqu'à 9999.99
DATE / DATE-HEURE         :  DATE / DATETIME            -- une date, ou une date avec l'heure
BOOLÉEN                   :  BOOLEAN (ou TINYINT)       -- vrai/faux (oui/non)</pre>
<div class="warn">Pour l'argent, on n'utilise JAMAIS un type flottant (FLOAT) : il arrondit mal (0,10 + 0,20 peut donner 0,30000001). On prend <code>DECIMAL(p, s)</code>, qui est exact au centime près.</div>

<h3>3. Ajouter les contraintes</h3>
<p>Une <strong>contrainte</strong> est une règle que le SGBD fait respecter automatiquement. Le texte après <code>:</code> explique chacune.</p>
<pre class="pseudo">PRIMARY KEY   : la clé primaire (unique + non nulle)        -- identifie chaque ligne
NOT NULL      : valeur obligatoire                          -- interdit la case vide
UNIQUE        : valeur unique (ex. email)                    -- pas deux fois la même
DEFAULT val   : valeur par défaut (ex. stock DEFAULT 0)      -- valeur si on ne précise rien
CHECK (cond)  : règle de validité (ex. prix >= 0)            -- refuse les valeurs interdites
FOREIGN KEY   : clé étrangère + intégrité référentielle      -- lien vers une autre table
AUTO_INCREMENT/IDENTITY : numéro auto pour les clés artificielles  -- 1, 2, 3… générés seuls</pre>

<h3>4. Prévoir des index</h3>
<p>Un <strong>index</strong> est une structure qui accélère les recherches sur une colonne, exactement comme l'index alphabétique à la fin d'un livre évite de lire toutes les pages. On indexe les colonnes souvent utilisées dans les recherches et les <strong>jointures</strong> (le rapprochement de deux tables par leurs clés). Les clés primaires sont indexées automatiquement.</p>
<pre class="pseudo">INDEX idx_titre ON JEU(titre)   -- rechercher un jeu par son titre devient rapide</pre>
<div class="tip">Attention : trop d'index ralentit les écritures, car chaque insertion ou mise à jour doit aussi mettre à jour tous les index. On indexe utile, pas partout.</div>

<h3>5. Le MPD… c'est presque du SQL</h3>
<p>Voici la même table exprimée en MLD puis en MPD (proche du SQL). Le texte après <code>--</code> est un commentaire SQL.</p>
<pre class="pseudo">-- MLD :  JEU( #idJeu, titre, prix, stock, #idCategorie -> CATEGORIE )   -- rappel du niveau logique
-- MPD (proche SQL) :
CREATE TABLE JEU (                                             -- crée la table JEU
  idJeu        INT           PRIMARY KEY AUTO_INCREMENT,        -- clé artificielle auto-numérotée
  titre        VARCHAR(120)  NOT NULL,                          -- texte obligatoire, 120 caractères max
  prix         DECIMAL(6,2)  NOT NULL CHECK (prix >= 0),        -- décimal exact, jamais négatif
  stock        INT           NOT NULL DEFAULT 0,                -- entier, 0 par défaut
  idCategorie  INT           NOT NULL,                          -- clé étrangère (obligatoire)
  FOREIGN KEY (idCategorie) REFERENCES CATEGORIE(idCategorie),  -- lien vers CATEGORIE
  INDEX idx_titre (titre)                                       -- accélère la recherche par titre
);</pre>
<p>À partir d'ici, les cours <strong>SQL</strong>, <strong>SQL Server</strong> et <strong>MySQL</strong> prennent le relais : ils écrivent et exécutent réellement ces instructions.</p>`,
  exercises: [

    { type: "qcm", q: "Le type flottant (FLOAT) pour l'argent est…", opts: ["Recommandé", "À éviter (arrondis imprécis)", "Obligatoire", "Le plus rapide"], a: 1, exp: "DECIMAL est exact." },

    { type: "qcm", q: "CHECK (prix >= 0) sert à…", opts: ["Indexer", "Imposer une règle de validité", "Créer une FK", "Calculer le prix"], a: 1, exp: "Contrainte de domaine." },
    { type: "qcm", q: "Un index sert à…", opts: ["Stocker plus", "Accélérer les recherches sur une colonne", "Créer une table", "Supprimer des lignes"], a: 1, exp: "Comme l'index d'un livre." },
    { type: "qcm", q: "Les clés primaires sont indexées…", opts: ["Jamais", "Automatiquement", "Seulement en SQL Server", "Sur demande uniquement"], a: 1, exp: "Index automatique sur la PK." },
    { type: "vf", q: "Trop d'index ralentit les écritures (insertions/mises à jour).", a: true, exp: "Chaque index doit être maintenu." },
    { type: "qcm", q: "AUTO_INCREMENT / IDENTITY sert à…", opts: ["Chiffrer", "Générer automatiquement un numéro pour les clés artificielles", "Indexer le texte", "Trier"], a: 1, exp: "Numéro auto pour la clé primaire." },
    { type: "qcm", q: "FOREIGN KEY … REFERENCES … déclare…", opts: ["Un index", "Une clé étrangère + l'intégrité référentielle", "Une valeur par défaut", "Une colonne calculée"], a: 1, exp: "Le lien entre tables." },
    { type: "qcm", q: "Le MPD est l'antichambre directe…", opts: ["Du HTML", "Du SQL (CREATE TABLE)", "Du MCD", "Du dessin"], a: 1, exp: "On y écrit presque du SQL." },
    { type: "vf", q: "On indexe surtout les colonnes utilisées dans les recherches et les jointures.", a: true, exp: "Index utile, pas partout." }
  ],
  final: {
    title: "Exercice final — Écrire un MPD",
    intro: `<p>À partir de cette table du MLD. Le texte après <code>--</code> résume les règles à appliquer :</p>
<pre class="pseudo">CLIENT( #idClient, nom, email, dateInscription, pointsFidelite )   -- la table du MLD
Règles : email unique et obligatoire ; points par défaut 0 ;        -- UNIQUE + NOT NULL ; DEFAULT 0
         idClient auto-incrémenté ; recherche fréquente par email.   -- AUTO_INCREMENT ; index sur email</pre>`,
    questions: [
      { type: "qcm", q: "idClient sera…", opts: ["VARCHAR PRIMARY KEY", "INT PRIMARY KEY AUTO_INCREMENT", "DATE", "BOOLEAN"], a: 1, exp: "Clé artificielle auto-incrémentée." },
      { type: "qcm", q: "email doit porter…", opts: ["Rien", "NOT NULL et UNIQUE", "DEFAULT 0", "un CHECK numérique"], a: 1, exp: "Obligatoire et unique." },
      { type: "qcm", q: "pointsFidelite reçoit…", opts: ["UNIQUE", "DEFAULT 0", "PRIMARY KEY", "FOREIGN KEY"], a: 1, exp: "Valeur par défaut 0." },
      { type: "qcm", q: "dateInscription aura pour type…", opts: ["INT", "DATE (ou DATETIME)", "VARCHAR(2)", "BOOLEAN"], a: 1, exp: "Un type date." },
      { type: "vf", q: "Un index sur email accélérera les recherches fréquentes par email.", a: true, exp: "Recherche fréquente = index pertinent." }
    ],
    solution: `<pre class="pseudo">CREATE TABLE CLIENT (                                     -- crée la table CLIENT
  idClient        INT          PRIMARY KEY AUTO_INCREMENT, -- clé artificielle auto-numérotée
  nom             VARCHAR(80)  NOT NULL,                   -- texte obligatoire
  email           VARCHAR(150) NOT NULL UNIQUE,            -- obligatoire ET sans doublon
  dateInscription DATE         NOT NULL,                   -- type date, obligatoire
  pointsFidelite  INT          NOT NULL DEFAULT 0,         -- entier, 0 par défaut
  INDEX idx_email (email)                                  -- accélère la recherche par email
);</pre>
<p>Ton MPD est prêt pour le SQL. Demain : le projet complet de la Ludothèque.</p>`
  }
};
