  title: "Les associations entre entités",
  subtitle: "Relier les entités pour traduire les liens du métier.",
  theory: `
<h3>1. Qu'est-ce qu'une association ?</h3>
<p>Une <strong>association</strong> (on dit aussi <strong>relation</strong>) relie deux entités (parfois plus) pour exprimer un <em>lien</em> du monde réel : un CLIENT <em>loue</em> un JEU, un JEU <em>appartient à</em> une CATEGORIE. Là où l'entité est une « chose » (un nom), l'association est plutôt une action ou un rattachement (un verbe). Dans un schéma Merise, on la dessine par un <strong>ovale</strong> (une bulle) contenant un verbe, relié par des traits aux entités concernées. Dans les schémas en texte ci-dessous, les tirets <code>---</code> représentent ces traits.</p>
<pre class="pseudo">CLIENT -----( LOUER )----- JEU              // un CLIENT est relié à un JEU par le lien « louer »

JEU -----( APPARTENIR )----- CATEGORIE      // un JEU est rattaché à une CATEGORIE</pre>

<h3>2. Le nom d'une association</h3>
<p>On nomme l'association par un <strong>verbe</strong> à l'infinitif (LOUER, APPARTENIR, POSSEDER) ou par un nom qui décrit le lien. Astuce de lecture : le nom se lit dans les <strong>deux sens</strong>. Pour LOUER entre CLIENT et JEU, on peut dire « un client LOUE un jeu » ou, dans l'autre sens, « un jeu EST LOUÉ PAR un client ». Cette double lecture aidera plus tard à poser les cardinalités.</p>

<h3>3. La dimension (arité) d'une association</h3>
<p>L'<strong>arité</strong> (ou dimension) d'une association, c'est le nombre d'entités qu'elle relie. Le texte après <code>//</code> illustre chaque cas.</p>
<pre class="pseudo">BINAIRE   : relie 2 entités                 // le cas le plus courant   (CLIENT - LOUER - JEU)
TERNAIRE  : relie 3 entités                 // trois entités d'un coup  (CLIENT - VENDRE - JEU - VENDEUR)
RÉFLEXIVE : relie une entité à elle-même     // une entité liée à elle    (JEU - ETENDRE - JEU, ex. extension)</pre>
<p>La grande majorité des associations sont <strong>binaires</strong> (deux entités). Les ternaires et les réflexives (leçons 9 et 10) sont plus rares, mais bien utiles quand le métier l'exige.</p>

<h3>4. Association ou propriété ?</h3>
<p>Grande question de débutant : quand mettre une <strong>association</strong> plutôt qu'une simple <strong>propriété</strong> ? Réponse : dès qu'une information renvoie à une <strong>autre entité</strong>. La catégorie d'un jeu n'est pas un simple texte à recopier dans JEU ; c'est un lien vers l'entité CATEGORIE (qui a sa propre existence, son propre identifiant), exprimé par une association.</p>
<pre class="pseudo">MAUVAIS :  JEU( titre, libelleCategorie )       -- « stratégie » recopié dans chaque jeu = redondance
BON     :  JEU --( APPARTENIR )-- CATEGORIE      -- un simple lien vers l'entité CATEGORIE, pas une copie</pre>
<div class="tip">Règle pratique : si tu allais recopier la même valeur dans beaucoup d'occurrences (le libellé « stratégie » sur des centaines de jeux), c'est le signe qu'il faut une entité séparée + une association. On écrit l'info UNE fois dans CATEGORIE, et chaque jeu y renvoie.</div>

<h3>5. Une association peut porter des propriétés</h3>
<p>Certaines informations ne dépendent ni d'une entité ni de l'autre, mais du <strong>lien</strong> lui-même. La date d'une location ne caractérise ni le client tout seul, ni le jeu tout seul : elle caractérise le <em>couple</em> (client, jeu) à un moment donné. On la place donc SUR l'association LOUER. On appelle cela une <strong>association porteuse</strong> (détaillée en leçon 8).</p>
<pre class="pseudo">CLIENT --( LOUER )-- JEU                    // le lien de location entre un client et un jeu
          LOUER porte : dateDebut, nbJours  // ces infos appartiennent au lien, pas aux entités</pre>`,

    { type: "qcm", q: "La date d'une location se place…", opts: ["Dans CLIENT", "Dans JEU", "Sur l'association LOUER (elle dépend du lien)", "Nulle part"], a: 2, exp: "Association porteuse." },
    { type: "vf", q: "La plupart des associations sont binaires.", a: true, exp: "Binaire = cas le plus fréquent." },
    { type: "qcm", q: "Une information qui renvoie à une AUTRE entité appelle…", opts: ["Une propriété", "Une association", "Un identifiant", "Un index"], a: 1, exp: "Lien = association." },
    { type: "qcm", q: "Quel verbe conviendrait pour relier AUTEUR et LIVRE ?", opts: ["ÉCRIRE", "AUTEUR", "idLivre", "POSSÉDER"], a: 0, exp: "Un verbe métier : un auteur ÉCRIT un livre." },
    { type: "vf", q: "Une association peut porter ses propres propriétés (association porteuse).", a: true, exp: "Ex. dateDebut sur LOUER." },
    { type: "qcm", q: "Le signe qu'il faut une entité + association plutôt qu'une propriété :", opts: ["La valeur est courte", "On recopierait la même valeur dans de nombreuses occurrences", "La valeur est un nombre", "L'entité est petite"], a: 1, exp: "La duplication annonce une entité séparée." }
  ],
  final: {
    title: "Exercice final — Propriété ou association ?",
    intro: `<p>Dans une médiathèque, on hésite pour trois informations. Le texte après <code>//</code> résume l'enjeu de chacune :</p>
<pre class="pseudo">1) le TITRE d'un film                                          // info simple, propre à un seul film

    questions: [

      { type: "qcm", q: "Le GENRE, partagé par des centaines de films, devient…", opts: ["Une propriété recopiée", "Une entité GENRE reliée par une association", "Un identifiant", "Un index"], a: 1, exp: "On évite de recopier « action » partout." },
      { type: "qcm", q: "Le RÉALISATEUR (avec sa biographie) devient…", opts: ["Une propriété texte de FILM", "Une entité REALISATEUR reliée par « RÉALISER »", "Le titre", "Un genre"], a: 1, exp: "Il a ses propres propriétés et plusieurs films." },
      { type: "qcm", q: "L'association entre FILM et REALISATEUR pourrait s'appeler…", opts: ["GENRE", "RÉALISER", "PRODUIRE", "idFilm"], a: 1, exp: "Un verbe métier." },
      { type: "vf", q: "Mettre le genre en propriété texte dans chaque film créerait de la redondance.", a: true, exp: "D'où l'entité GENRE + association." }
    ],
    solution: `<pre class="pseudo">FILM( #idFilm, titre, duree )                  // le titre reste une simple propriété du film
GENRE( #idGenre, libelle )                      // le genre devient une entité (écrit UNE fois)
REALISATEUR( #idRealisateur, nom, biographie )  // le réalisateur a ses propres infos

FILM --( APPARTENIR )-- GENRE          // le genre est une entité reliée, pas une copie
REALISATEUR --( RÉALISER )-- FILM      // un verbe métier relie le réalisateur à ses films

Le titre reste une simple propriété de FILM.   // pas de lien : une info atomique propre au film</pre>
<p>Tu distingues propriété et association. Demain : les cardinalités, le cœur du MCD.</p>`
  }
};
