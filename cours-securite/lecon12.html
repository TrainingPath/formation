<script>
var DAY = {
  num: 12,
  title: "Dépendances : CVE, scan et chaîne d'approvisionnement",
  subtitle: "Ton code peut être parfait et ton application vulnérable.",
  theory: `
<h3>1. Le code que tu n'as pas écrit</h3>
<p>Une <strong>dépendance</strong> est une <strong>bibliothèque</strong> (un ensemble de code tout prêt) écrite par d'autres et que ton projet réutilise. Une application moderne, c'est environ 10 % de ton code et 90 % de dépendances — qui ont elles-mêmes leurs propres dépendances, en cascade. Une faille peut donc se cacher dans une bibliothèque de bibliothèque que personne n'a jamais lue. Tout cet écosystème de code emprunté forme la <strong>chaîne d'approvisionnement</strong> logicielle (supply chain) : la suite de fournisseurs dont dépend ton application.</p>

<h3>2. Les CVE : failles connues et publiées</h3>
<p>Une <strong>CVE</strong> (Common Vulnerabilities and Exposures) est une faille de sécurité rendue <strong>publique</strong>, dotée d'un identifiant unique (ex. <code>CVE-2023-1234</code>) et d'une note de gravité. Le vrai danger n'est pas la faille en soi, mais d'utiliser une <em>vieille</em> version vulnérable alors qu'un correctif existe déjà. Des outils comparent tes dépendances à la liste des CVE connues.</p>
<pre class="pseudo">CVE = faille de securite publique, identifiee (CVE-2023-xxxx), notee.   # un repertoire mondial des failles connues
Le risque : utiliser une version vulnerable dont le correctif existe.    # rester en retard sur les mises a jour
$ pip-audit                                                             # outil Python : compare tes libs a la liste des CVE
-> "urllib3 1.26.4 : CVE-2023-xxxx (elevee), corrige en 1.26.18"         # il indique quoi mettre a jour, et vers quelle version
# npm audit (JS), OWASP Dependency-Check (Java),                        # l'equivalent selon le langage
# dotnet list package --vulnerable (C#), composer audit (PHP)           # meme idee dans chaque ecosysteme</pre>

<h3>3. Scanner l'image aussi</h3>
<p>Rappel : une <strong>image</strong> Docker empaquette ton application AVEC un petit système d'exploitation de base et ses paquets système. Ceux-ci peuvent aussi porter des CVE. Des scanners d'image inspectent tout le paquet, code applicatif ET système, en une seule passe.</p>
<pre class="pseudo">L'image contient un OS de base + des paquets systeme (cours Docker) :    # pas seulement ton code
$ trivy image ghcr.io/toi/ludotheque:1.2.0                              # trivy scanne l'image entiere
$ docker scout cves ghcr.io/toi/ludotheque:1.2.0                        # docker scout : meme role, autre outil
-> failles applicatives ET systeme, en une passe.                       # un rapport complet en une commande</pre>

<h3>4. Automatiser dans le pipeline</h3>
<p>Un <strong>pipeline</strong> (ou CI) est la chaîne automatisée qui teste le code à chaque modification. On y ajoute un <strong>job</strong> (une étape) « securite » qui lance les scanners tout seul.</p>
<pre class="pseudo"># cours CI/CD : un job "securite" (detaille leçon 17)
- pip-audit + trivy a chaque commit                                    # scan automatique a chaque modification
- une CVE CRITIQUE -> job rouge -> merge et livraison bloques           # rouge = echec ; on n'integre pas de code vulnerable
- Dependabot / Renovate : ouvrent automatiquement les PR de mise a jour  # des robots proposent les mises a jour
-> "on espere que nos libs sont a jour" devient une garantie verifiee.  # l'espoir remplace par une verification</pre>
<p><strong>Merge</strong> = fusionner une modification dans le code principal ; une <strong>PR</strong> (pull request) est la demande de fusion, relue avant acceptation. <strong>Dependabot</strong> et <strong>Renovate</strong> sont des robots qui surveillent tes dépendances et ouvrent d'eux-mêmes les demandes de mise à jour.</p>

<h3>5. Les attaques de chaîne d'approvisionnement</h3>
<p>Différentes des CVE : ici, ce n'est pas une faille accidentelle, mais du code volontairement malveillant introduit dans une dépendance.</p>
<pre class="pseudo">Distinctes des CVE : un paquet LEGITIME est compromis, ou un paquet
MALVEILLANT se fait passer pour un autre :
- typosquat : "reqeusts" au lieu de "requests" (faute de frappe piegee)   # un nom presque identique, glisse par erreur
- paquet abandonne repris par un acteur malveillant                       # l'ancien mainteneur passe la main a un pirate
- dependance qui exfiltre au build/a l'install                            # elle vole des donnees pendant l'installation
Parades : verifier les noms, epingler les versions (lockfile), preferer   # controler ce qu'on installe
les sources officielles, limiter les scripts post-install.                # et reduire ce qui s'execute a l'installation</pre>
<p>Le <strong>typosquat</strong> mise sur une faute de frappe : un paquet piégé porte un nom presque identique à un paquet populaire. <strong>Épingler</strong> une version, c'est fixer précisément le numéro utilisé ; le <strong>lockfile</strong> (fichier de verrouillage) enregistre ces versions exactes pour que le projet s'installe toujours à l'identique. Un <strong>script post-install</strong> est du code qu'un paquet peut exécuter automatiquement au moment de son installation — pratique, mais aussi vecteur d'attaque.</p>
<div class="warn">Épingler les versions (requirements.txt/lockfile) rend le build reproductible ET bloque une mise à jour malveillante silencieuse — mais fige aussi les versions vulnérables. Il faut donc épingler <strong>ET</strong> mettre à jour régulièrement, de façon testée par la CI. L'un sans l'autre est un piège.</div>
<div class="tip">Deux menaces à ne pas confondre : les <strong>CVE</strong> (failles connues de libs légitimes → scanner et mettre à jour) et les <strong>attaques de chaîne</strong> (code malveillant introduit → vérifier noms, sources, scripts). Le scan automatisé couvre la première ; la vigilance sur les sources couvre la seconde.</div>`,
  exercises: [
    { type: "qcm", q: "Une application moderne est surtout faite…", opts: ["De ton seul code", "De dépendances (et leurs dépendances)", "De CSS", "De HTML"], a: 1, exp: "90 % de code des autres." },
    { type: "qcm", q: "Une CVE, c'est…", opts: ["Un test", "Une faille de sécurité publique et identifiée", "Un cookie", "Un protocole"], a: 1, exp: "CVE-AAAA-xxxx." },
    { type: "qcm", q: "Le risque avec les CVE :", opts: ["Aucun", "Utiliser une version vulnérable dont le correctif existe", "La lenteur", "Le CSS"], a: 1, exp: "Ne pas mettre à jour." },
    { type: "qcm", q: "Scanner les dépendances Python :", opts: ["pip-audit", "docker ps", "ls", "git log"], a: 0, exp: "npm audit, composer audit… selon la pile." },
    { type: "qcm", q: "Scanner une image Docker :", opts: ["trivy / docker scout", "un ping", "un test unitaire", "un cookie"], a: 0, exp: "Failles applicatives ET système." },
    { type: "qcm", q: "L'image contient aussi…", opts: ["Rien d'autre que ton code", "Un OS de base + paquets système (à scanner)", "Le CSS seul", "Les logs"], a: 1, exp: "Docker leçon 16." },
    { type: "qcm", q: "Le scan automatisé en CI…", opts: ["Est inutile", "Transforme l'espoir en garantie vérifiée à chaque commit", "Ralentit tout", "Chiffre"], a: 1, exp: "DevSecOps (leçon 17)." },
    { type: "qcm", q: "Une CVE critique en CI devrait…", opts: ["Être ignorée", "Rendre le job rouge et bloquer le merge", "Accélérer", "Chiffrer"], a: 1, exp: "Barrière (leçon 17)." },
    { type: "qcm", q: "Dependabot / Renovate…", opts: ["Déploient", "Ouvrent automatiquement les PR de mise à jour", "Suppriment des libs", "Chiffrent"], a: 1, exp: "Mise à jour assistée." },
    { type: "qcm", q: "Le typosquat, c'est…", opts: ["Une CVE", "Un paquet au nom proche d'un vrai (reqeusts), piégé", "Un XSS", "Un cookie"], a: 1, exp: "Attaque de chaîne." },
    { type: "qcm", q: "CVE et attaque de chaîne sont…", opts: ["Identiques", "Deux menaces distinctes (faille connue vs code malveillant)", "Sans rapport avec les libs", "Des tests"], a: 1, exp: "Parades différentes." },
    { type: "qcm", q: "Épingler les versions…", opts: ["Suffit seul", "Reproductibilité + anti-maj malveillante, MAIS fige les versions vulnérables", "Chiffre", "Est inutile"], a: 1, exp: "Épingler ET mettre à jour." },
    { type: "vf", q: "Épingler sans jamais mettre à jour est sûr.", a: false, exp: "On fige les failles connues." },
    { type: "qcm", q: "Contre les attaques de chaîne :", opts: ["Vérifier noms, sources officielles, limiter les scripts post-install", "un WAF", "HTTPS", "rien"], a: 0, exp: "Vigilance sur les sources." },
    { type: "vf", q: "Ton code parfait peut être rendu vulnérable par une dépendance.", a: true, exp: "D'où le scan." }
  ],
  final: {
    title: "Exercice final — Maîtriser les dépendances",
    intro: `<p>Personne ne sait quelles libs ont des failles connues. On s'outille.</p>`,
    questions: [
      { type: "qcm", q: "Détecter les CVE des dépendances :", opts: ["pip-audit (ou l'équivalent de la pile)", "un ping", "docker ps", "git log"], a: 0, exp: "Scan dédié." },
      { type: "qcm", q: "Détecter les CVE de l'image :", opts: ["trivy / docker scout", "un test unitaire", "ls", "rien"], a: 0, exp: "Appli + système." },
      { type: "qcm", q: "Automatiser :", opts: ["Un job sécurité en CI (critique = merge bloqué)", "un scan annuel", "à la main parfois", "jamais"], a: 0, exp: "À chaque commit." },
      { type: "qcm", q: "Maintenir dans le temps :", opts: ["Épingler ET mettre à jour, testé par la CI", "épingler et ne jamais bouger", "tout en latest", "supprimer les libs"], a: 0, exp: "Les deux ensemble." },
      { type: "vf", q: "CVE et attaques de chaîne demandent des parades différentes.", a: true, exp: "Scan vs vigilance sur les sources." }
    ],
    solution: `<pre class="pseudo"># Dependances applicatives
$ pip-audit            # (npm audit / composer audit / dotnet list --vulnerable)   # scanner tes libs selon la pile

# Image (appli + systeme)
$ trivy image ghcr.io/toi/ludotheque:1.2.0                              # scanner l'image Docker complete

# En CI (job "securite", leçon 17) : critique -> merge bloque          # automatiser le scan a chaque commit
# Dependabot/Renovate : PR de mise a jour automatiques                  # des robots proposent les updates
# Epingler (lockfile) ET mettre a jour regulierement, teste par la CI   # les deux ensemble, jamais l'un seul
# Chaine : verifier noms (typosquat), sources officielles, scripts post-install   # vigilance sur l'origine du code</pre>
<p>La chaîne d'approvisionnement est surveillée. Demain : journaliser sans trahir.</p>`
  }
};

    checklist: ["Ta politique scanne-t-elle les DEUX niveaux : dépendances (pip-audit/npm audit…) et image (trivy/scout) ?", "Épingles-tu les versions ET les mets-tu à jour régulièrement (les deux, jamais l'un seul) ?", "En CI, une CVE critique bloque-t-elle le merge et une CVE élevée ouvre-t-elle un ticket ?", "As-tu une conduite à tenir pour une CVE critique en prod (évaluer l'exposition, patcher, mitiger) ?"],
    solution: "POLITIQUE DE DÉPENDANCES — La Ludothèque\n\nSCAN\n- Dépendances : pip-audit (adapter à la pile : npm/composer/dotnet/maven)\n- Image : trivy / docker scout (appli + système, Docker l.16)\n- Fréquence : à CHAQUE commit (CI) + veille continue (nouvelles CVE)\n\nÉPINGLAGE + MISE À JOUR (les deux, jamais l'un seul)\n- Versions épinglées (requirements.txt / lockfile) : reproductible,\n  bloque une mise à jour malveillante silencieuse.\n- Mises à jour régulières via Dependabot/Renovate, TESTÉES par la CI\n  avant merge (sinon on fige les versions vulnérables).\n\nINTÉGRATION CI (leçon 17)\n- CVE CRITIQUE -> job rouge -> merge/livraison bloqués\n- CVE élevée -> ticket priorisé, non bloquant\n\nATTAQUES DE CHAÎNE\n- Vérifier les noms (typosquat), préférer les sources officielles\n- Épingler par empreinte quand c'est possible, limiter les scripts\n  post-install, revoir les nouvelles dépendances en PR.\n\nCVE CRITIQUE EN PRODUCTION (conduite à tenir)\n1. Évaluer l'exposition : la fonction vulnérable est-elle utilisée/atteignable ?\n2. Si oui : patcher en priorité (PR expresse -> CI -> déploiement, CI/CD l.14).\n3. Si patch indisponible : mitiger (config, WAF, désactiver la fonction).\n4. Journaliser et surveiller pendant la fenêtre d'exposition (l.13).",
