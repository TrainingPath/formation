<script>
var DAY = {
  num: 9,
  title: "HTTPS/TLS : chiffrer en transit, HSTS",
  subtitle: "Sans lui, identifiants et cookies s'affichent en clair sur le WiFi public.",
  theory: `
<h3>1. Ce que HTTPS protège</h3>
<p>Quand ton navigateur parle à un serveur, les messages traversent de nombreux relais (ta box, ton fournisseur d'accès, des routeurs…). <strong>HTTP</strong> (le protocole du web) envoie ces messages en <em>clair</em>, lisibles par tous ceux qui les relaient. <strong>HTTPS</strong> est le même protocole, mais <strong>chiffré</strong> : <strong>chiffrer</strong> = brouiller les données pour que seuls l'expéditeur et le destinataire puissent les lire. Le chiffrement s'appuie sur <strong>TLS</strong> (Transport Layer Security), la technologie qui protège le <strong>transport</strong>. Sans HTTPS, sur un WiFi public (ou via un <strong>FAI</strong>, fournisseur d'accès à Internet, ou un <strong>proxy</strong>, un relais intermédiaire), n'importe qui sur le chemin peut lire ET modifier ce qui passe — mots de passe, cookies de session, données. On appelle cet espion « l'homme du milieu » (man-in-the-middle).</p>
<pre class="pseudo">HTTP  : GET /connexion  ->  mot de passe LISIBLE par tout intermediaire   # tout circule en clair sur le reseau
HTTPS : tout est chiffre ->  l'intermediaire ne voit qu'un flux opaque     # illisible sans la cle secrete</pre>

<h3>2. Forcer HTTPS partout</h3>
<p>Il ne suffit pas de « proposer » HTTPS : il faut y forcer chaque visiteur, sinon une visite restée en HTTP demeurerait vulnérable. Une <strong>redirection</strong> renvoie automatiquement toute requête HTTP vers son équivalent HTTPS.</p>
<pre class="pseudo"># settings.py (production)
SECURE_SSL_REDIRECT = True              # toute requete HTTP est redirigee en HTTPS
SESSION_COOKIE_SECURE = True            # le cookie de session ne part que sur HTTPS (leçon 6)
CSRF_COOKIE_SECURE = True               # idem pour le cookie qui porte le jeton CSRF
SECURE_PROXY_SSL_HEADER = ("HTTP_X_FORWARDED_PROTO", "https")  # dit a Django "je suis derriere un proxy qui gere le HTTPS"</pre>

<h3>3. HSTS : fermer la première fenêtre</h3>
<p>Problème subtil : la toute première requête d'un visiteur peut partir en HTTP (avant que la redirection ne l'attrape) — donc interceptable. <strong>HSTS</strong> (HTTP Strict Transport Security) est un en-tête qui « grave » dans le navigateur la consigne « ce site, c'est HTTPS uniquement, et pour longtemps ». Ensuite, le navigateur refuse de lui-même tout HTTP vers ce domaine.</p>
<pre class="pseudo"># la 1re requete peut partir en HTTP (avant la redirection) -> interceptable
SECURE_HSTS_SECONDS = 31536000          # duree de la consigne : 1 an (31536000 secondes)
SECURE_HSTS_INCLUDE_SUBDOMAINS = True   # applique aussi la regle a tous les sous-domaines
SECURE_HSTS_PRELOAD = True              # demande l'inclusion dans la liste pre-chargee des navigateurs
# ensuite, le navigateur refuse tout HTTP vers ce domaine, meme tape a la main.</pre>

<h3>4. Les certificats</h3>
<p>Un <strong>certificat</strong> est une carte d'identité électronique qui prouve « ce serveur est bien celui qu'il prétend être » — c'est ce que représente le petit cadenas du navigateur. Il est délivré par une autorité de confiance.</p>
<pre class="pseudo">Le certificat prouve l'identite du serveur (le cadenas).                # empeche un imposteur de se faire passer pour le site
Let's Encrypt : gratuit, automatise (certbot / Caddy / Traefik)         # une autorite gratuite + des outils qui gerent tout
-> renouvellement automatique = jamais de certificat expire            # un certificat expire = site bloque (panne classique)
Le reverse proxy (nginx, cours Docker) termine le TLS.                  # le proxy dechiffre a l'entree, puis parle a l'app en interne</pre>
<p>Un <strong>reverse proxy</strong> (nginx, Caddy…) est un serveur placé « devant » l'application : il reçoit les connexions HTTPS, les déchiffre (« termine le TLS »), puis transmet en interne à l'application. <strong>Let's Encrypt</strong> est une autorité qui délivre gratuitement des certificats et permet de les renouveler automatiquement.</p>

<h3>5. Ce que HTTPS ne protège PAS</h3>
<pre class="pseudo">✔ protege : ecoute et alteration EN TRANSIT (WiFi, FAI, proxy)          # le tuyau entre navigateur et serveur
✘ ne protege PAS : XSS, injection, IDOR, mots de passe faibles,          # toutes les failles de l'application elle-meme
  failles applicatives, donnees une fois arrivees au serveur.           # une fois arrive, HTTPS n'a plus rien a dire
HTTPS est NECESSAIRE, jamais SUFFISANT.                                  # indispensable, mais pas une garantie a lui seul</pre>
<div class="warn">Le cadenas rassure l'utilisateur mais ne dit <strong>rien</strong> de la solidité de l'application. Un site de phishing peut avoir un certificat valide ; un site en HTTPS peut être criblé de failles. « Le site est en HTTPS donc sécurisé » est un raccourci dangereux.</div>
<div class="tip">Vérifie ta configuration avec un testeur TLS (SSL Labs) : versions de protocole (pas de TLS obsolète), suites de chiffrement, chaîne de certificats, HSTS. Une note, des recommandations concrètes — comme les scanners d'en-têtes (leçon 15).</div>`,
  exercises: [
    { type: "qcm", q: "HTTPS chiffre…", opts: ["La base de données", "Le transport entre navigateur et serveur", "Les mots de passe stockés", "Le CSS"], a: 1, exp: "En transit." },
    { type: "qcm", q: "Sans HTTPS, sur un WiFi public…", opts: ["Tout va bien", "Mots de passe et cookies sont lisibles par les intermédiaires", "Le site est plus rapide", "Rien ne passe"], a: 1, exp: "Interception en clair." },
    { type: "qcm", q: "Un intermédiaire sur HTTP peut…", opts: ["Seulement lire", "Lire ET modifier ce qui passe", "Rien", "Chiffrer"], a: 1, exp: "Man-in-the-middle." },
    { type: "qcm", q: "SECURE_SSL_REDIRECT = True…", opts: ["Chiffre la base", "Redirige toute requête HTTP vers HTTPS", "Supprime les cookies", "Accélère"], a: 1, exp: "Forcer HTTPS." },
    { type: "qcm", q: "Le problème que HSTS résout :", opts: ["Le XSS", "La première requête HTTP interceptable avant redirection", "La force brute", "Le CSRF"], a: 1, exp: "La fenêtre initiale." },
    { type: "qcm", q: "HSTS grave dans le navigateur :", opts: ["Le mot de passe", "« ce site, HTTPS uniquement »", "Le cookie", "Le certificat"], a: 1, exp: "Refus du HTTP ensuite." },
    { type: "qcm", q: "Après HSTS, taper http://... vers ce domaine…", opts: ["Fonctionne", "Est refusé/converti par le navigateur", "Plante", "Est plus rapide"], a: 1, exp: "Mémorisé." },
    { type: "qcm", q: "Le certificat sert à…", opts: ["Chiffrer la base", "Prouver l'identité du serveur", "Accélérer", "Compresser"], a: 1, exp: "Le cadenas." },
    { type: "qcm", q: "Let's Encrypt permet…", opts: ["Des certificats payants manuels", "Des certificats gratuits, renouvelés automatiquement", "De désactiver HTTPS", "Un WAF"], a: 1, exp: "Plus de certificat expiré." },
    { type: "qcm", q: "Le TLS est terminé par…", opts: ["La base", "Le reverse proxy (nginx…)", "Le navigateur seul", "Le linter"], a: 1, exp: "Devant l'app (Docker l.9/16)." },
    { type: "qcm", q: "HTTPS protège contre…", opts: ["Le XSS", "L'écoute et l'altération en transit", "L'injection SQL", "Les mots de passe faibles"], a: 1, exp: "Le transport uniquement." },
    { type: "vf", q: "Un site en HTTPS est forcément sécurisé.", a: false, exp: "Nécessaire, jamais suffisant." },
    { type: "qcm", q: "Un site de phishing peut-il avoir un certificat valide ?", opts: ["Non, jamais", "Oui : le cadenas ne prouve pas l'honnêteté du site", "Seulement en HTTP", "Impossible"], a: 1, exp: "Le cadenas ≠ confiance." },
    { type: "qcm", q: "Tester sa configuration TLS :", opts: ["SSL Labs / testeur TLS", "un ping", "docker ps", "git log"], a: 0, exp: "Note + recommandations." },
    { type: "vf", q: "HTTPS ne protège pas les données une fois arrivées au serveur.", a: true, exp: "D'où le chiffrement au repos (leçon 10)." }
  ],
  final: {
    title: "Exercice final — HTTPS partout",
    intro: `<p>Rien ne force HTTPS en production. On corrige.</p>`,
    questions: [
      { type: "qcm", q: "Forcer la redirection :", opts: ["SECURE_SSL_REDIRECT = True", "un cookie", "un log", "rien"], a: 0, exp: "HTTP → HTTPS." },
      { type: "qcm", q: "Fermer la première fenêtre :", opts: ["HSTS (SECURE_HSTS_SECONDS)", "un WAF", "un CAPTCHA", "un timeout"], a: 0, exp: "Mémorisé par le navigateur." },
      { type: "qcm", q: "Les cookies :", opts: ["SESSION_COOKIE_SECURE / CSRF_COOKIE_SECURE = True", "HttpOnly seul", "SameSite seul", "rien"], a: 0, exp: "HTTPS uniquement (leçon 6)." },
      { type: "qcm", q: "Les certificats :", opts: ["Let's Encrypt automatisé (renouvellement auto)", "manuels annuels", "aucun", "auto-signés en prod"], a: 0, exp: "Jamais d'expiration surprise." },
      { type: "vf", q: "HTTPS reste nécessaire mais insuffisant : les failles applicatives demeurent.", a: true, exp: "Pas de faux sentiment." }
    ],
    solution: `<pre class="pseudo"># settings.py — production
SECURE_SSL_REDIRECT = True                     # HTTP -> HTTPS force
SECURE_HSTS_SECONDS = 31536000                 # HSTS : HTTPS obligatoire pendant 1 an
SECURE_HSTS_INCLUDE_SUBDOMAINS = True          # y compris les sous-domaines
SECURE_HSTS_PRELOAD = True                     # demande d'inscription dans la liste des navigateurs
SESSION_COOKIE_SECURE = True                   # cookie de session sur HTTPS seulement
CSRF_COOKIE_SECURE = True                       # cookie CSRF sur HTTPS seulement
SECURE_PROXY_SSL_HEADER = ("HTTP_X_FORWARDED_PROTO", "https")   # config quand on est derriere un reverse proxy

# certificats : Let's Encrypt automatise (certbot / Caddy / Traefik)   # renouvellement automatique
# tester : SSL Labs -> note A, pas de TLS obsolete                     # verifier la qualite de la config</pre>
<p>Le transport est chiffré. Demain : protéger les données une fois arrivées — le chiffrement au repos.</p>`
  }
};
</script>

    statement: "Rédige une explication pédagogique (12-16 lignes) qui démonte le raccourci « le site est en HTTPS donc sécurisé » : ce que HTTPS protège réellement (avec un exemple concret de WiFi public), ce qu'il ne protège pas (au moins 4 failles applicatives), pourquoi un site de phishing peut avoir un cadenas, et la configuration minimale (redirection + HSTS + cookies Secure). Termine par « HTTPS est nécessaire, jamais suffisant ».",
    hints: [
      "Exemple concret : sans HTTPS, l'attaquant du café voit ton mot de passe en clair.",
      "Ce qu'il ne protège pas : XSS, injection, IDOR, mot de passe faible — tout l'applicatif.",
      "Le cadenas prouve le chiffrement du transport, pas l'honnêteté du site."
    ],
    solution: "LE MYTHE DU CADENAS — « HTTPS = sécurisé » ?\n\nCE QUE HTTPS PROTÈGE (le transport)\nSans HTTPS, dans un café : l'attaquant sur le même WiFi lit chaque requête\nen clair — ton mot de passe de connexion, ton cookie de session s'affichent\ntels quels. Il peut aussi MODIFIER les réponses (injecter du contenu).\nHTTPS chiffre ce transport : l'intermédiaire ne voit qu'un flux opaque.\nC'est réel et indispensable.\n\nCE QUE HTTPS NE PROTÈGE PAS (l'application)\nUne fois la requête arrivée au serveur, HTTPS n'a plus rien à dire :\n- injection SQL (leçon 2) : la requête chiffrée reste une injection\n- XSS (leçon 3) : le script s'exécute quand même chez la victime\n- IDOR (leçon 7) : l'objet d'un autre reste accessible\n- mot de passe faible, session volée, secret exposé...\nHTTPS chiffre le tuyau ; il ne solidifie pas ce qui coule dedans.\n\nLE CADENAS N'EST PAS UN LABEL DE CONFIANCE\nUn site de phishing obtient un certificat gratuit en minutes : il aura\nle cadenas. Le cadenas prouve « le transport est chiffré », jamais\n« ce site est honnête ni bien codé ».\n\nCONFIGURATION MINIMALE\nSECURE_SSL_REDIRECT, HSTS (1 an, preload), cookies Secure, certificat\nauto-renouvelé. Puis tester (SSL Labs).\n\nConclusion : HTTPS est NÉCESSAIRE, jamais SUFFISANT.",
    note: "Ce raccourci « HTTPS = sécurisé » est répandu jusque chez des développeurs — le démonter est un service pédagogique. La bonne image : HTTPS est un tuyau blindé, mais l'eau qui y coule peut être empoisonnée. Toutes les leçons de ce cours portent sur ce qui coule dans le tuyau ; celle-ci sécurise le tuyau lui-même. Les deux sont indispensables, aucun ne remplace l'autre." }
