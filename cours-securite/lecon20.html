<script>
var DAY = {
  num: 20,
  title: "Audit de sécurité complet de la Ludothèque",
  subtitle: "Reprendre le modèle de menace de la leçon 1 et cocher chaque risque.",
  theory: `
<h3>1. Boucler la boucle</h3>
<p>Un <strong>audit de sécurité</strong> est une vérification méthodique de toutes les protections d'une application. La leçon 1 posait le <strong>modèle de menace</strong> : les biens à protéger, la surface d'attaque, les risques classés par priorité. Les leçons 2 à 19 ont apporté les parades. L'audit vérifie maintenant, ligne par ligne, qu'aucun risque n'est resté ouvert — et distingue ce qui est <strong>fait</strong> de ce qui se <strong>surveille en continu</strong>.</p>

<h3>2. La matrice risque → parade</h3>
<p>Une <strong>matrice</strong> est ici un simple tableau qui met, en face de chaque risque, la parade qui le ferme et la leçon correspondante :</p>
<pre class="pseudo">Risque (leçon 1)          -> Parade                               -> Leçon
Injection SQL             -> ORM + requetes parametrees           -> 2     # code et donnees jamais melanges
XSS stocke                -> echappement + CSP + sanitisation     -> 3,15  # le script injecte n'est pas execute
CSRF                      -> jeton + SameSite                     -> 4     # la requete forgee est refusee
Force brute mots de passe -> hachage fort + rate limit + MFA      -> 5     # essais ralentis, mot de passe illisible
Vol de session            -> HttpOnly/Secure/SameSite + HTTPS     -> 6,9   # le cookie vole devient inexploitable
IDOR / acces casse        -> filtrage par request.user            -> 7     # on ne voit que ses propres objets
Secrets exposes           -> hors code + scan + rotation          -> 8,17  # aucun secret dans le code
Interception reseau       -> HTTPS + HSTS                         -> 9     # le transport est chiffre
Fuite de la base          -> chiffrement + minimisation           -> 10    # peu de donnees, et illisibles au repos
Upload / SSRF             -> validation + liste d'autorisation    -> 11    # n'accepter que le connu
Dependance vulnerable     -> scan CVE en CI                       -> 12,17 # detecter les libs a trous
Fuite par logs/erreurs    -> logs surs + DEBUG=0 + msg generiques -> 13,14 # ne rien divulguer par erreur
Clickjacking / MIME       -> en-tetes de securite                 -> 15    # des consignes de defense au navigateur
Infra exposee             -> non-root, moindre surface            -> 16    # peu de portes, peu de privileges
Donnees personnelles      -> RGPD : droits, durees, minimisation  -> 18    # la conformite EST de la securite
Incident                  -> plan de reponse pret                 -> 19    # savoir reagir avant la crise</pre>

<h3>3. Chaque ligne, une preuve</h3>
<p>Un audit sérieux ne se contente pas de bonnes intentions : chaque parade doit s'appuyer sur une <strong>preuve</strong> vérifiable — une configuration, un test automatisé, un scan, une commande.</p>
<pre class="pseudo">Un audit n'est pas une liste de bonnes intentions : chaque parade a
une PREUVE verifiable — une config, un test, un scan, une commande.   # du concret, pas des promesses
Ex. IDOR : le test d'acces croise (leçon 7) passe en CI.             # un test qui echoue si la faille revient
Ex. HTTPS : SSL Labs note A. Ex. secrets : gitleaks vert.            # des verifications objectives et repetables</pre>

<h3>4. Ce qui se surveille en continu</h3>
<p>La sécurité n'est jamais « terminée » : certaines choses se vérifient une fois, d'autres se surveillent en permanence.</p>
<pre class="pseudo">La securite n'est jamais "finie" :
- nouvelles CVE (scan permanent, leçon 12/17)                       # de nouvelles failles apparaissent chaque jour
- logs de securite surveilles (leçon 13)                            # detecter les attaques en direct
- revue de securite a chaque grande fonctionnalite                  # le modele de menace evolue avec l'app
- mises a jour regulieres, exercices de reponse a incident          # entretenir les defenses et s'entrainer
- test d'intrusion periodique                                       # trouver ce que l'automatique ne voit pas (pentest)</pre>

<h3>5. Le rapport d'audit</h3>
<p>Le <strong>livrable</strong> (le document final) de l'audit réunit la matrice cochée, les preuves, les points à surveiller — et les éventuels <strong>risques acceptés</strong> : des risques qu'on choisit de ne pas traiter parce que la parade coûterait plus cher que le risque lui-même, mais qu'on documente et assume.</p>
<pre class="pseudo">Livrable : la matrice cochee + les preuves + les points a surveiller   # un dossier complet, pas un simple avis
+ les eventuels risques ACCEPTES (documentes, avec justification).     # ce qu'on choisit sciemment de ne pas traiter
-> un etat des lieux honnete, pas un tampon "securise".               # dire la verite, pas rassurer a tout prix</pre>
<div class="warn">Un audit qui coche tout en vert est suspect : il reste presque toujours des risques <strong>acceptés</strong> (coût de la parade &gt; risque) — l'important est qu'ils soient <strong>documentés et assumés</strong>, pas ignorés. « Nous savons et nous acceptons » vaut mille fois mieux que « nous ne savions pas ».</div>
<div class="tip">Cet audit se répète : à chaque grande évolution, on reprend le modèle de menace (de nouvelles fonctionnalités = de nouveaux risques) et on re-vérifie. La sécurité est un cycle — menace, parade, vérification, surveillance — pas une destination.</div>`,
  exercises: [
    { type: "qcm", q: "L'audit reprend…", opts: ["Le CSS", "Le modèle de menace de la leçon 1", "Les tests unitaires", "Le Dockerfile"], a: 1, exp: "Boucler la boucle." },
    { type: "qcm", q: "L'audit vérifie que…", opts: ["Le site est joli", "Chaque risque a sa parade, aucune ligne ouverte", "Le code compile", "Les logs sont vides"], a: 1, exp: "Ligne par ligne." },
    { type: "qcm", q: "La parade à l'injection SQL :", opts: ["ORM + requêtes paramétrées", "un cookie", "HTTPS", "un log"], a: 0, exp: "Leçon 2." },
    { type: "qcm", q: "La parade à l'IDOR :", opts: ["Filtrage par request.user", "un UUID", "le menu masqué", "HTTPS"], a: 0, exp: "Leçon 7." },
    { type: "qcm", q: "La parade au vol de session :", opts: ["HttpOnly/Secure/SameSite + HTTPS", "un CAPTCHA", "un log", "rien"], a: 0, exp: "Leçons 6/9." },
    { type: "qcm", q: "Chaque parade de l'audit doit avoir…", opts: ["Une bonne intention", "Une preuve vérifiable (config, test, scan)", "Un slogan", "Un tampon"], a: 1, exp: "Vérifiable." },
    { type: "qcm", q: "La preuve pour l'IDOR :", opts: ["Un vœu", "Le test d'accès croisé qui passe en CI (leçon 7)", "Le CSS", "Un cookie"], a: 1, exp: "Test automatisé." },
    { type: "qcm", q: "La preuve pour HTTPS :", opts: ["Un sentiment", "SSL Labs note A", "Un log", "Rien"], a: 1, exp: "Testeur objectif." },
    { type: "qcm", q: "La sécurité est…", opts: ["Finie une fois l'audit passé", "Un processus continu (jamais terminée)", "Un projet ponctuel", "Une case cochée"], a: 1, exp: "Cycle permanent." },
    { type: "qcm", q: "Ce qui se surveille en continu :", opts: ["Rien", "Nouvelles CVE, logs, revue par fonctionnalité, mises à jour, pentest", "Le CSS", "Les commits"], a: 1, exp: "Vigilance." },
    { type: "qcm", q: "Un risque accepté doit être…", opts: ["Ignoré", "Documenté et assumé (avec justification)", "Caché", "Oublié"], a: 1, exp: "« Nous savons et acceptons »." },
    { type: "qcm", q: "Un audit tout en vert est…", opts: ["Idéal", "Suspect : il reste presque toujours des risques acceptés", "Impossible", "Obligatoire"], a: 1, exp: "Honnêteté." },
    { type: "vf", q: "« Nous savons et acceptons » vaut mieux que « nous ne savions pas ».", a: true, exp: "Risque documenté." },
    { type: "qcm", q: "Le livrable de l'audit :", opts: ["Un tampon « sécurisé »", "La matrice cochée + preuves + points à surveiller + risques acceptés", "Rien", "Un slogan"], a: 1, exp: "État des lieux honnête." },
    { type: "vf", q: "L'audit se répète à chaque grande évolution (nouveaux risques).", a: true, exp: "Le cycle." }
  ],
  final: {
    title: "Exercice final — Boucler l'audit",
    intro: `<p>On vérifie que chaque risque de la leçon 1 est couvert.</p>`,
    questions: [
      { type: "qcm", q: "L'audit part de :", opts: ["Le modèle de menace (leçon 1)", "le CSS", "les tests", "le Dockerfile"], a: 0, exp: "Boucler la boucle." },
      { type: "qcm", q: "Chaque parade est :", opts: ["Prouvée (config, test, scan)", "affirmée", "supposée", "cachée"], a: 0, exp: "Vérifiable." },
      { type: "qcm", q: "Un risque non couvert et assumé est :", opts: ["Documenté comme risque accepté", "ignoré", "caché", "oublié"], a: 0, exp: "Transparence." },
      { type: "qcm", q: "Après l'audit :", opts: ["Surveillance continue (CVE, logs, revues, pentest)", "on arrête tout", "on oublie", "on chiffre"], a: 0, exp: "Jamais fini." },
      { type: "vf", q: "L'audit se répète à chaque grande évolution de l'application.", a: true, exp: "Cycle permanent." }
    ],
    solution: `<pre class="pseudo">MATRICE (extrait) — chaque risque, sa parade, sa PREUVE
Injection SQL  -> ORM/parametre       -> grep raw/ + bandit vert (l.2,17)      # aucune requete concatenee
XSS            -> echappement + CSP    -> pas de |safe + CSP appliquee (l.3,15) # scripts injectes bloques
IDOR           -> filtre proprietaire  -> test d'acces croise en CI (l.7)       # A ne peut pas voir les objets de B
Secrets        -> hors code + scan     -> gitleaks vert (l.8,17)                # rien de sensible dans le depot
HTTPS          -> HSTS                 -> SSL Labs A (l.9)                       # transport chiffre, HTTPS force
Dependances    -> scan CVE             -> pip-audit/trivy en CI (l.12,17)        # libs a jour, sans CVE critique

+ RISQUES ACCEPTES documentes (cout > risque, justifies)          # assumes, pas ignores
+ SURVEILLANCE CONTINUE : CVE, logs, revues, pentest periodique   # la securite est un cycle</pre>
<p>L'audit est bouclé. Demain : l'examen final — le trajet sécurisé d'un clic.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton rapport d'audit…",
  items: [
  { id: "secu-l20", title: "Le rapport d'audit de sécurité", level: 3,
    statement: "Rédige le rapport d'audit de sécurité de ton capstone : la matrice complète risque → parade → preuve (au moins 12 lignes, reprenant le modèle de menace de la leçon 1), une section « risques acceptés » (au moins 2, documentés et justifiés), une section « à surveiller en continu », et la conclusion honnête (pas un tampon « sécurisé »).",
    hints: [
      "Chaque ligne : le risque, la parade EN PLACE, et la PREUVE vérifiable.",
      "Risques acceptés : ex. pas de MFA client (coût/friction) — documenté, pas ignoré.",
      "Conclusion : un état des lieux daté, à revoir, pas une certification définitive."
    ],
    solution: "RAPPORT D'AUDIT DE SÉCURITÉ — [mon capstone] — [date]\n\nMATRICE RISQUE -> PARADE -> PREUVE\nRisque              | Parade en place                | Preuve vérifiable\n--------------------+--------------------------------+-----------------------\nInjection SQL       | ORM / requêtes paramétrées     | bandit vert, grep raw() nul\nXSS stocké          | échappement + CSP + sanitize   | pas de |safe, CSP appliquée\nCSRF                | jeton + SameSite               | config + test POST cross-site\nForce brute         | hachage argon2 + rate limit    | axes actif, test de blocage\nVol de session      | HttpOnly/Secure/SameSite+HTTPS | flags cookie + SSL Labs A\nIDOR                | filtrage par request.user      | test d'accès croisé en CI\nSecrets exposés     | hors code + scan + rotation    | gitleaks vert (CI)\nInterception        | HTTPS + HSTS                   | SSL Labs A, HSTS preload\nFuite base          | minimisation + sauvegarde chiffrée | pas de carte stockée\nUpload / SSRF       | validation + liste autorisation | tests upload + import\nDépendances         | scan CVE en CI                 | pip-audit + trivy verts\nFuite logs/erreurs  | logs filtrés + DEBUG=0         | audit anti-fuite (l.14)\nEn-têtes            | CSP, X-Frame, nosniff, HSTS    | securityheaders note A\nInfra               | non-root, moindre surface      | nmap : seul 443 exposé\nDonnées perso       | RGPD : droits + durées         | export/anonymisation codés\nIncident            | plan prêt + exercice annuel    | plan documenté, testé\n\nRISQUES ACCEPTÉS (documentés)\n1. MFA non imposé aux CLIENTS (friction/coût vs profil de risque) —\n   imposé aux vendeurs/admins ; réévalué si incidents.\n2. Pas de WAF dédié (coût vs taille du projet) — compensé par la CSP,\n   le rate limit et la validation stricte.\n\nÀ SURVEILLER EN CONTINU\nNouvelles CVE (scan permanent), logs de sécurité, revue à chaque grande\nfonctionnalité, mises à jour, test d'intrusion périodique.\n\nCONCLUSION\nÉtat des lieux au [date] : les risques critiques/élevés du modèle de menace\nsont couverts et prouvés. Deux risques acceptés, documentés. Ce rapport\nn'est PAS une certification définitive : il sera revu à chaque évolution\nmajeure. La sécurité reste un processus continu.",
    note: "Un rapport d'audit honnête se reconnaît à sa section « risques acceptés » et à sa conclusion datée et non définitive : la sécurité parfaite n'existe pas, et prétendre le contraire est le premier signe d'un audit qui ment. La colonne « preuve » est ce qui distingue un audit sérieux d'une liste de bonnes intentions — chaque parade renvoie à quelque chose de vérifiable, souvent automatisé en CI (cours précédent). C'est l'aboutissement de tout le cours : non pas « c'est sécurisé », mais « voici précisément contre quoi, comment, et ce qui reste à surveiller »." }
  ]
};
</script>
