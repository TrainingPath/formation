<script>
var DAY = {
  num: 14,
  title: "Fuite d'information : erreurs, DEBUG, messages",
  subtitle: "Chaque détail divulgué est une pièce du puzzle que l'attaquant assemble.",
  theory: `
<h3>1. La reconnaissance de l'attaquant</h3>
<p>Avant de frapper, un attaquant fait de la <strong>reconnaissance</strong> : il collecte des indices sur sa cible — les versions des logiciels utilisés (donc les CVE applicables, leçon 12), la structure interne, les comptes qui existent, les chemins de fichiers. Chaque information « anodine » que ton application laisse échapper fait ce travail de repérage à sa place. La <strong>discrétion</strong> est donc une défense à part entière.</p>

<h3>2. DEBUG en production : la carte au trésor</h3>
<p>Le mode <strong>DEBUG</strong> est un réglage de développement qui affiche des détails techniques quand une erreur survient — très pratique pour corriger, catastrophique en <strong>production</strong> (le site en ligne, utilisé par de vrais visiteurs). Une <strong>trace</strong> (ou stack trace) est le rapport détaillé d'une erreur : la suite des fonctions traversées, les fichiers, parfois la valeur des variables.</p>
<pre class="pseudo">DEBUG = False    # en production (rappel capstone l.20, Docker l.20)   # JAMAIS True sur un site en ligne
# DEBUG=True affiche : trace complete, chemins, extraits de requetes SQL,
# variables locales, parfois des secrets. C'est un plan detaille de l'app.   # tout ce qu'un attaquant reve de savoir
ALLOWED_HOSTS = ["ludotheque.example.com"]   # liste des noms de domaine acceptes : pas de "*" (qui accepterait tout)</pre>
<p><code>ALLOWED_HOSTS</code> est la liste des noms de domaine sous lesquels ton site accepte de répondre ; la limiter empêche certaines usurpations. Un <code>"*"</code> signifierait « n'importe quel nom », à proscrire.</p>

<h3>3. Des pages d'erreur sobres</h3>
<p>Quand une erreur survient, le serveur renvoie un code : <strong>404</strong> (page introuvable) ou <strong>500</strong> (erreur interne du serveur). En production, ces pages doivent rester sobres : un message neutre pour l'utilisateur, et le détail technique réservé aux logs.</p>
<pre class="pseudo">404 / 500 personnalisees, sans aucun detail technique :
"Une erreur est survenue" — pas la trace, pas le nom de la table,     # rien qui renseigne l'attaquant
pas le chemin du fichier. Le detail va dans les LOGS (leçon 13), pas   # cote serveur, pour l'enquete
dans la reponse envoyee a l'utilisateur.                              # cote public, on ne montre rien</pre>

<h3>4. Les messages qui en disent trop</h3>
<p>Un message d'erreur trop précis renseigne l'attaquant. Le cas classique : distinguer « email inconnu » de « mot de passe incorrect » permet de découvrir quels comptes existent — c'est l'<strong>énumération de comptes</strong>.</p>
<pre class="pseudo">✘ "Email inconnu" / "Mot de passe incorrect"  -> revele quels comptes existent   # deux messages = deux informations distinctes
✔ "Identifiants invalides"                     -> les deux cas, meme message      # un seul message = aucune fuite
# idem inscription/reset : "si un compte existe, un email a ete envoye"           # ne pas confirmer l'existence
# -> ne jamais confirmer l'existence d'un compte (enumeration de comptes)
✘ erreur API : "colonne 'client_secret' introuvable" -> structure interne         # devoile les noms de colonnes/tables
✔ erreur API : {"erreur": "requete invalide"} + code HTTP                         # generique + un code, rien de plus</pre>

<h3>5. Les bannières et en-têtes</h3>
<p>Chaque réponse HTTP peut contenir des <strong>en-têtes</strong> « bannières » qui annoncent la technologie employée : <code>Server:</code>, <code>X-Powered-By:</code>, <code>X-AspNet-Version:</code>… Les révéler, c'est offrir à l'attaquant la liste exacte des CVE à essayer.</p>
<pre class="pseudo">Masquer/neutraliser : Server:, X-Powered-By:, X-AspNet-Version:...
-> ne pas annoncer sa pile et ses versions (= la liste des CVE a essayer).   # moins on en dit, mieux c'est
Les commentaires HTML, les fichiers exposes (.git/, /admin par defaut,        # des sources de fuite frequentes
endpoints de debug) fuient aussi : les retirer de la surface publique.       # reduire ce qui est accessible</pre>
<div class="warn">L'énumération de comptes est sous-estimée : distinguer « email inconnu » de « mauvais mot de passe » offre gratuitement la liste des comptes valides, qui alimente ensuite la force brute et le phishing ciblé. Le message unique « identifiants invalides » coûte zéro et ferme cette fuite.</div>
<div class="tip">La discrétion n'est pas de l'« obscurité comme sécurité » (cacher au lieu de corriger) : c'est refuser de <strong>faciliter</strong> le travail de l'attaquant en plus d'avoir des défenses solides. On corrige la faille ET on ne publie pas la carte — les deux, pas l'un à la place de l'autre.</div>`,
  exercises: [
    { type: "qcm", q: "La reconnaissance de l'attaquant consiste à…", opts: ["Attaquer directement", "Collecter versions, structure, comptes avant d'attaquer", "Chiffrer", "Rien"], a: 1, exp: "Chaque fuite l'aide." },
    { type: "qcm", q: "DEBUG=True en production…", opts: ["Est recommandé", "Expose trace, chemins, SQL, parfois des secrets", "Accélère", "Chiffre"], a: 1, exp: "Carte au trésor." },
    { type: "qcm", q: "En production, DEBUG vaut…", opts: ["True", "False", "peu importe", "1"], a: 1, exp: "Rappel capstone/Docker." },
    { type: "qcm", q: "ALLOWED_HOSTS = [\"*\"] en prod est…", opts: ["Idéal", "Une mauvaise pratique (accepter tout hôte)", "Obligatoire", "Sans effet"], a: 1, exp: "Restreindre." },
    { type: "qcm", q: "Une page d'erreur en prod doit…", opts: ["Montrer la stack", "Rester sobre : « une erreur est survenue »", "Afficher le SQL", "Donner le chemin"], a: 1, exp: "Le détail va dans les logs." },
    { type: "qcm", q: "Le détail technique d'une erreur va…", opts: ["Dans la réponse HTTP", "Dans les logs (leçon 13), pas à l'utilisateur", "Sur la page d'accueil", "En clair"], a: 1, exp: "Utile sans divulguer." },
    { type: "qcm", q: "« Email inconnu » vs « mot de passe incorrect » :", opts: ["Ergonomique donc bon", "Révèle quels comptes existent (énumération)", "Chiffré", "Sans risque"], a: 1, exp: "Fuite d'information." },
    { type: "qcm", q: "Le bon message d'échec de connexion :", opts: ["« Email inconnu »", "« Identifiants invalides » (indifférencié)", "« Mauvais mot de passe »", "Le détail SQL"], a: 1, exp: "Les deux cas, pareil." },
    { type: "qcm", q: "À la réinitialisation de mot de passe :", opts: ["« Cet email n'existe pas »", "« Si un compte existe, un email a été envoyé »", "Le mot de passe par email", "La liste des comptes"], a: 1, exp: "Ne pas confirmer l'existence." },
    { type: "qcm", q: "Une erreur API « colonne client_secret introuvable »…", opts: ["Est utile au client", "Divulgue la structure interne", "Est chiffrée", "Est obligatoire"], a: 1, exp: "Message générique à la place." },
    { type: "qcm", q: "Masquer Server: et X-Powered-By: évite de…", opts: ["Ralentir", "Annoncer sa pile et ses versions (CVE à essayer)", "Chiffrer", "Rien"], a: 1, exp: "Moins d'indices." },
    { type: "qcm", q: "L'énumération de comptes alimente ensuite…", opts: ["Le CSS", "La force brute et le phishing ciblé", "Le cache", "Le chiffrement"], a: 1, exp: "Une fuite en amont." },
    { type: "vf", q: "Le message unique « identifiants invalides » coûte zéro et ferme une fuite.", a: true, exp: "Facile et efficace." },
    { type: "qcm", q: "La discrétion vs « l'obscurité comme sécurité » :", opts: ["Identiques", "On corrige la faille ET on ne facilite pas l'attaque, pas l'un à la place de l'autre", "Cacher suffit", "Ni corriger ni cacher"], a: 1, exp: "Les deux ensemble." },
    { type: "qcm", q: "Un .git/ exposé ou un endpoint de debug public…", opts: ["Sont sans risque", "Fuient et doivent être retirés de la surface publique", "Accélèrent", "Chiffrent"], a: 1, exp: "Réduire la surface." }
  ],
  final: {
    title: "Exercice final — Couper les fuites",
    intro: `<p>Une exception affiche la trace complète et les messages distinguent les cas.</p>`,
    questions: [
      { type: "qcm", q: "La trace en production :", opts: ["DEBUG=False + pages d'erreur sobres", "l'afficher pour aider", "en clair", "dans l'URL"], a: 0, exp: "Détail dans les logs." },
      { type: "qcm", q: "Le message de connexion :", opts: ["« Identifiants invalides » (unique)", "distinguer email/mot de passe", "le SQL", "la stack"], a: 0, exp: "Anti-énumération." },
      { type: "qcm", q: "Les erreurs API :", opts: ["Génériques + code HTTP, sans détail interne", "avec le nom des colonnes", "avec le chemin", "avec la version"], a: 0, exp: "Rien de structurel." },
      { type: "qcm", q: "Les bannières de version :", opts: ["Masquées (Server, X-Powered-By)", "affichées fièrement", "en clair", "obligatoires"], a: 0, exp: "Moins d'indices." },
      { type: "vf", q: "On corrige la faille ET on ne facilite pas la reconnaissance.", a: true, exp: "Les deux." }
    ],
    solution: `<pre class="pseudo"># 1. Production sobre
DEBUG = False                                     # pas de trace technique en ligne
ALLOWED_HOSTS = ["ludotheque.example.com"]        # domaines acceptes, pas de "*"
# pages 404/500 personnalisees, aucun detail technique   # message neutre pour l'utilisateur

# 2. Messages indifferencies
#    connexion : "Identifiants invalides" (jamais lequel)          # anti-enumeration de comptes
#    reset     : "Si un compte existe, un email a ete envoye"       # ne confirme pas l'existence

# 3. Erreurs API generiques : {"erreur": "requete invalide"} + code HTTP   # rien de structurel

# 4. Masquer les bannieres (Server, X-Powered-By), retirer .git/, endpoints debug   # moins d'indices exposes</pre>
<p>Fin de la semaine 2 : les données et la config sont protégées. Lundi : le durcissement final.</p>`
  }
};
</script>

var ECRITURE = {

  { id: "secu-l14", title: "L'audit anti-fuite", level: 2,
    statement: "Écris l'audit anti-fuite d'information de ton capstone en production : la checklist vérifiable (DEBUG, ALLOWED_HOSTS, pages d'erreur, messages d'auth indifférenciés, bannières masquées, fichiers/endpoints exposés), chaque point avec SA vérification, et pour un cas trouvé (messages de connexion qui distinguent les cas), la correction et l'explication de la fuite (énumération de comptes).",
    hints: [
      "Chaque point : ✔/✘ + comment le vérifier (config, requête curl, scan).",
      "L'énumération : « email inconnu » offre la liste des comptes valides à l'attaquant.",
      "Vérifier les bannières : curl -I sur le site montre les en-têtes Server/X-Powered-By."
    ],
    atoi: { cmd: "curl -sI https://github.com | grep -iE \"server|x-powered-by|x-aspnet\"", expected: "Cette commande révèle les bannières de technologie renvoyées par le serveur (Server:, X-Powered-By…). Attendu sur TON app : ces en-têtes doivent être neutralisés ou anodins — une bannière détaillée (version précise du serveur/framework) offre gratuitement à l'attaquant la liste des CVE à essayer." },
    checklist: ["Chaque point de ta checklist a-t-il SA vérification (config, requête curl, scan) et un statut ✔/✘ ?", "Vérifies-tu DEBUG=False, ALLOWED_HOSTS restreint et des pages 404/500 sans détail technique ?", "Les messages d'authentification sont-ils indifférenciés (un seul « identifiants invalides ») ?", "Expliques-tu que l'énumération de comptes prépare force brute et phishing en révélant les cibles valides ?"],
    solution: "AUDIT ANTI-FUITE D'INFORMATION — [mon capstone] en production\n\n1. ✔ DEBUG = False\n   -> grep DEBUG settings.py ; provoquer une 500 -> page sobre, pas de trace\n2. ✔ ALLOWED_HOSTS restreint (pas de \"*\")\n   -> grep ALLOWED_HOSTS settings.py\n3. ✔ Pages 404/500 personnalisées, aucun détail technique\n   -> curl -i .../page-inexistante -> message générique\n4. ✘ Messages de connexion INDIFFÉRENCIÉS  <-- FUITE TROUVÉE\n   -> tester un email inconnu vs un mot de passe faux : messages DIFFÉRENTS\n5. ✔ Reset : « si un compte existe, un email a été envoyé »\n6. ? Bannières masquées\n   -> curl -I .../ | grep -iE 'server|x-powered-by|x-aspnet' -> à neutraliser\n7. ✔ Aucun .git/, /admin par défaut, endpoint de debug exposé\n   -> curl -i .../.git/config -> 404\n\nCAS TROUVÉ (point 4) — correction\n# AVANT\nif not User.objects.filter(email=email).exists():\n    msg = \"Email inconnu\"           # révèle que le compte n'existe pas\nelif not user.check_password(mdp):\n    msg = \"Mot de passe incorrect\"  # révèle que le compte EXISTE\n# APRÈS\nuser = authenticate(request, username=email, password=mdp)\nif user is None:\n    msg = \"Identifiants invalides\"  # un seul message pour les deux cas\n\nEXPLICATION DE LA FUITE\nDeux messages différents = un oracle : l'attaquant teste des emails,\nrepère lesquels existent (« mot de passe incorrect » = compte valide),\nconstitue la liste des comptes, puis cible force brute et phishing.\nLe message unique ferme cet oracle pour zéro coût.",
    note: "L'énumération de comptes est le parfait exemple de fuite « anodine » aux conséquences réelles : elle ne donne aucun accès directement, mais elle prépare toutes les attaques suivantes en révélant les cibles valides. Ce type de faille passe les tests fonctionnels (l'app « marche ») et n'est visible qu'avec le regard de l'attaquant — d'où l'audit dédié, curl à la main, en pensant reconnaissance." }
