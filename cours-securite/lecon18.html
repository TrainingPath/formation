<script>
var DAY = {
  num: 18,
  title: "RGPD et données personnelles",
  subtitle: "Les principes de protection des données ne sont pas qu'une case juridique.",
  theory: `
<h3>1. Pourquoi ça concerne le développeur</h3>
<p>Une <strong>donnée personnelle</strong> est toute information se rapportant à une personne identifiable : email, nom, historique d'achat. La Ludothèque en stocke beaucoup. Le <strong>RGPD</strong> (Règlement Général sur la Protection des Données, la loi européenne en la matière) impose des règles — mais surtout, ses principes <em>sont</em> de la sécurité des données. Minimiser, limiter, permettre l'effacement : chaque règle réduit ce qui peut fuiter. Ce n'est donc pas qu'une case juridique, c'est du travail de développeur.</p>

<h3>2. Les principes clés</h3>
<pre class="pseudo">Minimisation : ne collecter que le necessaire (leçon 10)   # pas de champ "au cas ou" : moins de donnees = moins de risque
Base legale   : une raison claire de traiter la donnee     # ex. executer le contrat, ou le consentement de la personne
Finalite      : les donnees servent au but annonce         # on ne les reutilise pas pour autre chose en douce
Limitation de duree : ne pas garder indefiniment           # au-dela d'un delai, on purge ou on anonymise
Transparence  : une politique de confidentialite lisible   # dire quoi, pourquoi, et combien de temps on garde</pre>
<p>Le <strong>consentement</strong> est l'accord libre et explicite de la personne. Une <strong>politique de confidentialité</strong> est le document qui explique aux utilisateurs quelles données sont collectées, pourquoi et pour combien de temps.</p>

<h3>3. Les droits des personnes — à IMPLÉMENTER</h3>
<p>Le RGPD donne aux personnes des droits sur leurs données — et ces droits doivent devenir du vrai code, pas seulement une phrase dans les <strong>CGU</strong> (conditions générales d'utilisation).</p>
<pre class="pseudo">def exporter_mes_donnees(request):        # droit d'ACCES / portabilite : recuperer ses donnees
    return JsonResponse(donnees_personnelles(request.user))   # renvoie un fichier JSON reutilisable

def supprimer_mon_compte(request):        # droit a l'EFFACEMENT ("droit a l'oubli")
    anonymiser_locations(request.user)    # on garde les stats agregees, on retire l'identite
    request.user.delete()                 # puis on supprime le compte lui-meme
# droit de RECTIFICATION : pouvoir corriger ses donnees.       # l'utilisateur peut modifier ses infos
# Ces droits sont du CODE, pas juste une mention dans les CGU.  # a implementer reellement</pre>
<p><code>JsonResponse</code> renvoie les données au format <strong>JSON</strong>, un format texte standard facile à réutiliser ailleurs — c'est ce qu'exige le droit à la <strong>portabilité</strong> (pouvoir emporter ses données).</p>

<h3>4. Anonymisation vs suppression</h3>
<p><strong>Anonymiser</strong>, c'est retirer tout ce qui permet d'identifier une personne, tout en conservant des données agrégées (des totaux). C'est souvent préférable à la suppression pure.</p>
<pre class="pseudo">Le "droit a l'oubli" demande souvent l'ANONYMISATION plutot que la suppression brute :
- on retire l'identite (email, nom -> "client supprime")             # la personne n'est plus reconnaissable
- on garde les statistiques agregees (nombre de locations, revenus)   # des totaux, sans aucun nom
-> la personne n'est plus identifiable, l'activite reste comptee.     # concilier l'oubli et la comptabilite
La suppression totale casse parfois l'integrite comptable (obligations legales).   # certaines donnees doivent etre conservees</pre>

<h3>5. Violation de données et sous-traitants</h3>
<p>Une <strong>violation de données</strong> est un incident où des données personnelles sont exposées, volées ou détruites. Un <strong>sous-traitant</strong> est un prestataire (hébergeur, service de paiement) qui traite des données pour ton compte.</p>
<pre class="pseudo">- Violation : obligation de notifier l'autorite (ex. CNIL) sous 72 h + les   # CNIL = l'autorite francaise de protection des donnees
  personnes si risque eleve -> la reponse a incident (leçon 19) inclut ce volet.   # prevenir vite et clairement
- Sous-traitants (hebergeur, prestataire de paiement) : contrats conformes,  # encadrer chacun par un contrat
  ils traitent des donnees pour toi -> leur securite te concerne.            # leur faille devient ta responsabilite</pre>
<div class="warn">Le RGPD conçu <strong>dès le départ</strong> (privacy by design) coûte dix fois moins que le rétrofit : ajouter l'anonymisation, l'export et la purge après coup, dans une base qui n'a pas été pensée pour, est douloureux. Chaque nouvelle donnée collectée mérite la question « en ai-je vraiment besoin, et pour combien de temps ? ».</div>
<div class="tip">Ce cours reste technique, pas juridique : les détails légaux relèvent d'un juriste. Mais les <strong>traductions techniques</strong> du RGPD — minimisation, chiffrement (leçon 10), contrôle d'accès (leçon 7), droits implémentés, durées appliquées — sont, elles, du ressort du développeur.</div>`,
  exercises: [
    { type: "qcm", q: "La Ludothèque stocke des données personnelles :", opts: ["Non", "Oui : emails, historiques de location/achat", "Seulement des jeux", "Aucune"], a: 1, exp: "Le RGPD s'applique." },
    { type: "qcm", q: "Les principes du RGPD sont…", opts: ["Purement juridiques", "Aussi de la sécurité des données", "Sans lien avec le code", "Optionnels"], a: 1, exp: "Minimiser réduit la fuite." },
    { type: "qcm", q: "La minimisation :", opts: ["Collecter beaucoup", "Ne collecter que le nécessaire (leçon 10)", "Chiffrer tout", "Dupliquer"], a: 1, exp: "Pas de « au cas où »." },
    { type: "qcm", q: "La base légale, c'est…", opts: ["Un serveur", "Une raison claire de traiter la donnée", "Un cookie", "Un chiffrement"], a: 1, exp: "Contrat, consentement…" },
    { type: "qcm", q: "La limitation de durée impose de…", opts: ["Garder à vie", "Purger / anonymiser les données au-delà d'une durée", "Chiffrer", "Publier"], a: 1, exp: "Pas de conservation infinie." },
    { type: "qcm", q: "Le droit d'accès / portabilité se traduit par…", opts: ["Une mention dans les CGU", "Une fonction d'export des données (format réutilisable)", "Rien", "Un cookie"], a: 1, exp: "Du code, pas du texte." },
    { type: "qcm", q: "Le droit à l'effacement demande souvent…", opts: ["La suppression brute toujours", "L'anonymisation (retirer l'identité, garder les stats)", "De chiffrer", "De publier"], a: 1, exp: "Intégrité préservée." },
    { type: "qcm", q: "Anonymiser une location, c'est…", opts: ["La supprimer", "Retirer l'identité mais garder l'activité agrégée", "La chiffrer", "La dupliquer"], a: 1, exp: "Personne non identifiable." },
    { type: "qcm", q: "Les droits des personnes sont…", opts: ["Une mention légale", "Du code à implémenter (export, effacement, rectification)", "Optionnels", "Automatiques"], a: 1, exp: "Concrets." },
    { type: "qcm", q: "Une violation de données impose…", opts: ["Le silence", "Notifier l'autorité (72 h) + les personnes si risque élevé", "Rien", "De chiffrer"], a: 1, exp: "Volet de l'incident (leçon 19)." },
    { type: "qcm", q: "Les sous-traitants (hébergeur, paiement)…", opts: ["Ne te concernent pas", "Traitent des données pour toi : leur sécurité te concerne", "Sont hors sujet", "Chiffrent"], a: 1, exp: "Contrats conformes." },
    { type: "qcm", q: "Le privacy by design signifie…", opts: ["Ajouter le RGPD à la fin", "Concevoir la protection dès le départ", "L'ignorer", "Chiffrer tout"], a: 1, exp: "10× moins cher que le rétrofit." },
    { type: "vf", q: "Ajouter export/anonymisation/purge après coup est douloureux.", a: true, exp: "D'où le privacy by design." },
    { type: "qcm", q: "Ce cours traite le RGPD…", opts: ["Sur le plan juridique complet", "Sur ses traductions TECHNIQUES (le développeur)", "Pas du tout", "Comme du droit pur"], a: 1, exp: "Minimisation, droits, durées." },
    { type: "vf", q: "La question « en ai-je vraiment besoin ? » doit accompagner chaque donnée collectée.", a: true, exp: "Minimisation." }
  ],
  final: {
    title: "Exercice final — Appliquer le RGPD",
    intro: `<p>La Ludothèque n'implémente aucun droit et garde tout à vie.</p>`,
    questions: [
      { type: "qcm", q: "Principe de départ :", opts: ["Minimisation (ne collecter que le nécessaire)", "tout collecter", "chiffrer tout", "publier"], a: 0, exp: "Réduire la surface." },
      { type: "qcm", q: "Le droit d'accès :", opts: ["Fonction d'export des données", "une mention CGU", "rien", "un cookie"], a: 0, exp: "Implémenté." },
      { type: "qcm", q: "Le droit à l'effacement :", opts: ["Anonymiser + supprimer l'identité (garder les stats agrégées)", "tout garder", "chiffrer", "rien"], a: 0, exp: "Intégrité préservée." },
      { type: "qcm", q: "Les données anciennes :", opts: ["Purge/anonymisation planifiée (limitation de durée)", "gardées à vie", "publiées", "dupliquées"], a: 0, exp: "Durée limitée." },
      { type: "vf", q: "Les principes RGPD sont aussi de la sécurité des données.", a: true, exp: "Minimiser = moins de fuite possible." }
    ],
    solution: `<pre class="pseudo"># Minimisation : pas de carte bancaire (delegue), pas de "au cas ou"   # ne collecter que le necessaire
# Droits implementes
def exporter_mes_donnees(request):     # acces / portabilite
    return JsonResponse(donnees_personnelles(request.user))   # export au format JSON, reutilisable
def supprimer_mon_compte(request):     # effacement
    anonymiser_locations(request.user)  # garder les stats, retirer l'identite
    request.user.delete()               # puis supprimer le compte
# Limitation de duree : purge/anonymisation planifiee (tache cron)   # cron = tache automatique periodique
# Violation : notifier l'autorite < 72 h + personnes si risque eleve (leçon 19)   # obligation legale
# Sous-traitants : contrats conformes (hebergeur, paiement)          # leur securite te concerne</pre>
<p>Les données personnelles sont respectées. Demain : quand tout échoue — la réponse à incident.</p>`
  }
};
</script>
