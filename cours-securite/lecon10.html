<script>
var DAY = {
  num: 10,
  title: "Chiffrement et données sensibles au repos",
  subtitle: "HTTPS protège le transit ; il reste à protéger ce qui dort sur le disque.",
  theory: `
<h3>1. Hachage vs chiffrement : ne pas confondre</h3>
<p>Rappel des deux opérations (leçon 5). Le <strong>hachage</strong> transforme une donnée en empreinte de façon <strong>irréversible</strong> : parfait pour un mot de passe, qu'on n'a jamais besoin de relire. Le <strong>chiffrement</strong> brouille une donnée de façon <strong>réversible</strong>, avec une clé : à utiliser quand il faudra relire la donnée plus tard. « Au repos » désigne les données qui dorment sur le disque (par opposition au transit protégé par HTTPS).</p>
<pre class="pseudo">HACHAGE     : a sens unique, IRREVERSIBLE
              -> mots de passe (on ne les relit jamais) — argon2/bcrypt         # impossible de retrouver l'original
CHIFFREMENT : reversible AVEC une cle
              -> donnees qu'il faut relire (email, historique si tres sensible) # on les dechiffre au besoin
Confondre les deux (chiffrer un mot de passe) est une faute classique.          # un mot de passe se HACHE, jamais ne se chiffre</pre>

<h3>2. La minimisation : la meilleure protection</h3>
<p>La <strong>minimisation</strong> consiste à ne collecter et ne garder que le strict nécessaire. La donnée la plus sûre est celle qui n'existe pas chez toi : on ne peut ni la voler, ni la perdre.</p>
<pre class="pseudo">La donnee la plus sure est celle qu'on ne stocke PAS :
✘ numero de carte bancaire -> delegue au prestataire de paiement (jamais stocke chez nous)   # c'est lui qui detient la carte
✘ donnees "au cas ou" -> non collectees                                 # ce qu'on ne demande pas ne peut pas fuiter
✔ purge/anonymisation des donnees inutiles (locations tres anciennes)   # supprimer ou rendre anonyme ce qui ne sert plus
-> une donnee absente ne fuite pas, ne se vole pas (RGPD, leçon 18).     # c'est le principe de minimisation du RGPD</pre>
<p>Un <strong>prestataire de paiement</strong> (Stripe, PayPal…) est une société spécialisée à qui l'on confie le traitement des cartes, pour ne jamais les manipuler soi-même. <strong>Purger</strong> = supprimer les données périmées ; <strong>anonymiser</strong> = retirer ce qui permet d'identifier une personne. Le <strong>RGPD</strong> est la loi européenne sur la protection des données personnelles (leçon 18).</p>

<h3>3. Chiffrer les sauvegardes</h3>
<p>Une <strong>sauvegarde</strong> (backup) est une copie de la base gardée de côté en cas de panne. Un <strong>dump</strong> est le fichier qui contient cette copie. S'il n'est pas chiffré, ce fichier EST la base clients complète, lisible par quiconque le récupère.</p>
<pre class="pseudo">$ mysqldump ... | gpg --encrypt --recipient sauvegarde@ludo > backup.sql.gpg   # mysqldump exporte la base, gpg la chiffre au passage
# la cle de dechiffrement est stockee SEPAREMENT de la sauvegarde              # sinon elle voyage avec le tresor
# (une sauvegarde chiffree avec sa cle a cote = sauvegarde en clair)           # la cle a cote annule tout le chiffrement</pre>
<p><code>mysqldump</code> est l'outil qui exporte une base MySQL dans un fichier ; le symbole <code>|</code> (« pipe ») envoie ce résultat directement à <code>gpg</code>, un outil de chiffrement, sans jamais écrire de fichier en clair. Un dump qui traîne est une base clients complète en clair : la sauvegarde mérite autant de soin que la base.</p>

<h3>4. Chiffrement au niveau base / disque</h3>
<p>On peut aussi chiffrer tout le support de stockage. Le <strong>TDE</strong> (Transparent Data Encryption) chiffre les fichiers de la base de façon invisible pour l'application ; de même, un disque ou un « volume » chiffré rend illisible tout son contenu sans la clé.</p>
<pre class="pseudo">TDE (Transparent Data Encryption) / volumes chiffres / disque chiffre :
-> un disque physique vole, un snapshot cloud exfiltre restent illisibles.       # snapshot = copie instantanee d'un disque
Defense en profondeur : meme si l'acces applicatif tombe, le stockage resiste.   # une couche de plus, sous l'application
La cle est geree par un KMS, jamais a cote des donnees.                          # KMS = coffre a cles dedie, tenu a l'ecart</pre>
<p>Un <strong>snapshot</strong> est une copie instantanée d'un disque (fréquente dans le cloud). Un <strong>KMS</strong> (Key Management Service) est un service dédié à la garde et à la rotation des clés de chiffrement, tenu à l'écart des données qu'il protège.</p>

<h3>5. Les données particulièrement sensibles</h3>
<p>Le <strong>chiffrement de champ</strong> (applicatif) chiffre une colonne précise avant de l'enregistrer, et la déchiffre seulement au moment de l'utiliser. On le réserve aux données les plus sensibles, car il complique l'usage courant.</p>
<pre class="pseudo">Certaines donnees exigent un chiffrement applicatif (au niveau du champ) :
- donnees de sante, opinions, donnees tres personnelles           # les plus sensibles au regard de la loi
- chiffrees avant stockage, dechiffrees a l'usage, cle au KMS      # elles ne dorment jamais en clair
Pour la Ludotheque : email et historique relevent surtout de la
MINIMISATION et du controle d'acces (leçon 7), pas forcement du chiffrement   # proportionnalite : ne pas sur-chiffrer
de champ — chaque donnee selon sa sensibilite.                    # le bon traitement pour chaque donnee</pre>
<div class="warn">Chiffrer n'a de sens que si la <strong>clé</strong> est protégée : une sauvegarde chiffrée dont la clé dort dans le même dossier, ou dans le code (leçon 8), n'est pas chiffrée — c'est du théâtre. La gestion des clés (KMS, rotation, séparation) est le vrai sujet du chiffrement.</div>
<div class="tip">Ordre de priorité pour la Ludothèque : (1) ne pas stocker ce qui n'est pas nécessaire, (2) hacher les mots de passe, (3) chiffrer les sauvegardes, (4) chiffrer le disque/la base, (5) chiffrer au niveau champ les données les plus sensibles. Du plus rentable au plus spécifique.</div>`,
  exercises: [
    { type: "qcm", q: "Un mot de passe se…", opts: ["Chiffre", "Hache (irréversible)", "Encode", "Stocke en clair avec un sel"], a: 1, exp: "On ne le relit jamais." },
    { type: "qcm", q: "Une donnée qu'il faut relire (email) se…", opts: ["Hache", "Chiffre (réversible avec clé) si très sensible", "Encode en base64 pour la protéger", "Affiche en clair partout"], a: 1, exp: "Selon la sensibilité." },
    { type: "qcm", q: "Chiffrer un mot de passe est…", opts: ["Idéal", "Une faute : il faut le hacher", "Obligatoire", "Plus sûr"], a: 1, exp: "Réversible = risque." },
    { type: "qcm", q: "La meilleure protection d'une donnée :", opts: ["La chiffrer", "Ne pas la stocker (minimisation)", "La journaliser systématiquement", "La dupliquer"], a: 1, exp: "Absente = insaisissable." },
    { type: "qcm", q: "Le numéro de carte bancaire :", opts: ["Est stocké chiffré", "Est délégué au prestataire, jamais stocké", "Est haché", "Est en clair"], a: 1, exp: "Ne pas le détenir." },
    { type: "qcm", q: "Une sauvegarde de base non chiffrée qui traîne, c'est…", opts: ["Sans risque", "Une base clients complète en clair", "Chiffrée d'office", "Anonymisée automatiquement"], a: 1, exp: "Autant de soin que la base." },
    { type: "qcm", q: "Une sauvegarde chiffrée avec sa clé dans le même dossier :", opts: ["Est sûre", "N'est pas protégée : la clé doit être séparée", "Est idéale", "Est un standard"], a: 1, exp: "Théâtre de sécurité." },
    { type: "qcm", q: "Le TDE / disque chiffré protège contre…", opts: ["Le XSS", "Le vol physique du disque / snapshot exfiltré", "L'injection", "Le CSRF"], a: 1, exp: "Stockage illisible." },
    { type: "qcm", q: "La clé de chiffrement doit être gérée par…", opts: ["Le code", "Un KMS, séparée des données", "Le même dossier", "Un fichier .txt"], a: 1, exp: "Le vrai sujet : la clé." },
    { type: "qcm", q: "Le chiffrement de champ (applicatif) sert aux…", opts: ["Emails ordinaires", "Données très sensibles (santé, opinions…)", "Logs", "Mots de passe (au lieu du hachage)"], a: 1, exp: "Selon la sensibilité." },
    { type: "qcm", q: "Pour la Ludothèque, email et historique relèvent surtout de…", opts: ["Chiffrement de champ obligatoire", "Minimisation + contrôle d'accès", "Suppression immédiate après chaque location", "Journalisation renforcée uniquement"], a: 1, exp: "Proportionné." },
    { type: "vf", q: "Chiffrer sans protéger la clé est du théâtre de sécurité.", a: true, exp: "La gestion des clés est centrale." },
    { type: "qcm", q: "La priorité n°1 pour la Ludothèque :", opts: ["Chiffrer chaque champ", "Ne pas stocker l'inutile", "Un WAF", "Un pare-feu réseau plus strict"], a: 1, exp: "Le plus rentable." },
    { type: "qcm", q: "La minimisation rejoint quel cadre légal ?", opts: ["Une norme ISO purement technique", "Le RGPD (leçon 18)", "HTTPS", "Le CSRF"], a: 1, exp: "Privacy by design." },
    { type: "vf", q: "HTTPS protège le transit, le chiffrement au repos protège le stockage.", a: true, exp: "Deux moments, deux protections." }
  ],
  final: {
    title: "Exercice final — Protéger les données stockées",
    intro: `<p>La base clients et les sauvegardes sont en clair. On priorise.</p>`,
    questions: [
      { type: "qcm", q: "Priorité n°1 :", opts: ["Minimiser : ne pas stocker l'inutile (ex. pas de carte)", "chiffrer chaque octet", "un WAF", "dupliquer les sauvegardes"], a: 0, exp: "Le plus efficace." },
      { type: "qcm", q: "Les mots de passe :", opts: ["Hachés (argon2/bcrypt)", "chiffrés AES", "en clair", "encodés en base64"], a: 0, exp: "Irréversible." },
      { type: "qcm", q: "Les sauvegardes :", opts: ["Chiffrées, clé stockée séparément", "en clair sur un partage", "supprimées", "compressées seulement"], a: 0, exp: "Base complète sinon." },
      { type: "qcm", q: "La clé de chiffrement :", opts: ["Dans un KMS, séparée des données", "à côté de la sauvegarde", "dans le code", "dans le README"], a: 0, exp: "Le vrai sujet." },
      { type: "vf", q: "Une donnée non stockée ne peut ni fuiter ni être volée.", a: true, exp: "La minimisation d'abord." }
    ],
    solution: `<pre class="pseudo"># Priorite (du plus rentable au plus specifique)
# 1. MINIMISER : pas de carte bancaire (paiement delegue), pas de "au cas ou"   # ne pas detenir l'inutile
# 2. HACHER les mots de passe (argon2)   — leçon 5                              # irreversible
# 3. CHIFFRER les sauvegardes, cle au KMS, separee :                            # le dump ne doit pas etre lisible
$ mysqldump ... | gpg --encrypt --recipient sauvegarde@ludo > backup.sql.gpg    # export + chiffrement en une seule passe
# 4. Disque/base chiffres (TDE, volume) : vol physique illisible                # protege le support de stockage
# 5. Chiffrement de champ pour les donnees les plus sensibles seulement         # proportionne a la sensibilite reelle</pre>
<p>Les données au repos sont protégées. Demain : ne jamais faire confiance aux entrées.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta stratégie de protection des données…",
  items: [
  { id: "secu-l10", title: "La cartographie des données", level: 3,
    statement: "Cartographie les données de ton capstone par sensibilité et décide de leur protection : un tableau (donnée → sensibilité → traitement : minimiser / hacher / chiffrer / accès seul), incluant mots de passe, emails, historiques, montants, et un éventuel numéro de carte. Justifie chaque choix et conclus par les 3 priorités d'action.",
    hints: [
      "Chaque ligne : la donnée, sa sensibilité, et LE bon traitement (pas de sur-chiffrement).",
      "Mot de passe → haché ; carte → non stockée ; email → minimisation + accès contrôlé.",
      "Ne pas tout chiffrer : proportionner à la sensibilité réelle."
    ],
    checklist: ["Chaque donnée a-t-elle une sensibilité ET un traitement proportionné (minimiser / hacher / chiffrer / accès seul) ?", "Le mot de passe est-il haché, le numéro de carte NON stocké, l'email minimisé et à accès contrôlé ?", "Évites-tu le sur-chiffrement (tout chiffrer au champ) comme le sous-chiffrement (mot de passe en clair) ?", "Poses-tu pour chaque donnée la question « peut-on ne pas la stocker du tout ? » ?"],
    solution: "CARTOGRAPHIE DES DONNÉES — [mon capstone]\n\nDonnée              | Sensibilité | Traitement\n--------------------+-------------+------------------------------------------\nMot de passe        | Critique    | HACHÉ (argon2) — jamais chiffré ni relu\nNuméro de carte     | Critique    | NON STOCKÉ — délégué au prestataire\nEmail               | Élevée      | Minimisation + contrôle d'accès (l.7) +\n                    |             | chiffrement des sauvegardes\nHistorique location | Moyenne     | Accès contrôlé + anonymisation après\n                    |             | X années (RGPD, l.18)\nMontant d'achat     | Moyenne     | Intégrité (transaction) + accès contrôlé\nNom / pseudo        | Faible      | Contrôle d'accès standard\nLogs applicatifs    | Variable    | JAMAIS de secret/donnée perso brute (l.13)\n\nJUSTIFICATION\n- On ne chiffre pas TOUT : l'email en base est protégé par le contrôle\n  d'accès et le chiffrement des sauvegardes/disque, pas forcément au champ\n  (proportionnalité). La carte, elle, ne doit tout simplement pas exister\n  chez nous.\n\n3 PRIORITÉS D'ACTION\n1. Supprimer toute donnée non nécessaire (carte, champs « au cas où »).\n2. Vérifier le hachage fort des mots de passe (l.5) et chiffrer les sauvegardes.\n3. Planifier l'anonymisation des données anciennes (l.18).",
    note: "La cartographie évite les deux erreurs symétriques : sous-protéger (mot de passe en clair) et sur-protéger (chiffrer au champ chaque nom, ce qui alourdit sans bénéfice réel). Chaque donnée mérite le traitement PROPORTIONNÉ à sa sensibilité — et la question la plus puissante reste « peut-on ne pas la stocker du tout ? ». C'est le socle du privacy by design du RGPD (leçon 18)." }
  ]
