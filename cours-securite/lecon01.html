<script>
var DAY = {
  num: 1,
  title: "Penser sécurité : menaces, surface d'attaque, défense en profondeur",
  subtitle: "Avant d'écrire une parade, savoir contre quoi — et pour protéger quoi.",
  theory: `
<h3>1. La sécurité n'est pas une fonctionnalité</h3>
<p>Commençons par les mots. La <strong>sécurité</strong>, en informatique, désigne l'ensemble des précautions qui empêchent quelqu'un de <em>voler</em>, de <em>modifier</em> ou de <em>casser</em> ce que fait ton application. Une <strong>fonctionnalité</strong>, elle, est une chose visible que l'application sait faire (se connecter, louer un jeu, payer). L'erreur du débutant est de croire que la sécurité est une fonctionnalité de plus, « ajoutée à la fin ». Faux : c'est plutôt comme la <em>solidité</em> d'une maison. On ne rajoute pas la solidité une fois les murs montés — elle est présente dans chaque brique, chaque fondation, chaque décision de construction.</p>
<p>Une <strong>application</strong> (ici notre site « Ludothèque », qui loue et vend des jeux de société) reçoit sans arrêt des informations venues de l'extérieur : ce que tape un visiteur, ce qu'envoie un autre ordinateur… Chaque endroit qui reçoit une information est une <strong>porte</strong> potentielle par laquelle un attaquant peut tenter d'entrer. Coder « en pensant sécurité », c'est se demander, à chaque porte : « et si la personne en face était malveillante ? »</p>

<h3>2. Les trois propriétés à protéger (la triade « CIA »)</h3>
<p>Les experts résument ce qu'il faut protéger par trois mots, souvent abrégés <strong>CIA</strong> (l'anglais pour <em>Confidentiality, Integrity, Availability</em> — aucun rapport avec l'agence américaine !). Une <strong>donnée</strong> est simplement une information stockée : un nom, un prix, un mot de passe. Voici les trois propriétés, avec une image pour chacune :</p>
<pre class="pseudo">Confidentialite : seuls les gens autorises peuvent VOIR les donnees   # comme une lettre cachetee : seul le destinataire l'ouvre (ex. mots de passe, historique d'un client)
Integrite       : les donnees ne sont pas MODIFIEES en douce         # comme un contrat paraphe : gratter un chiffre se voit (ex. le stock, un montant, un role)
Disponibilite   : le service reste ACCESSIBLE quand on en a besoin   # comme un magasin qui reste ouvert : nul ne peut le bloquer aux vrais clients</pre>
<p><strong>Confidentialité</strong> = garder secret ce qui doit l'être. <strong>Intégrité</strong> = garantir que les données restent exactes et n'ont pas été trafiquées à l'insu de tous. <strong>Disponibilité</strong> = s'assurer que le service répond bien ; l'attaque qui la vise s'appelle le « déni de service » (submerger le serveur jusqu'à le faire tomber).</p>

<h3>3. Le modèle de menace : réfléchir avant de coder</h3>
<p>Un <strong>modèle de menace</strong> est une petite analyse écrite, faite AVANT de coder des protections, et qui répond à trois questions dans l'ordre. C'est l'équivalent, pour un commerçant, de se demander « qu'est-ce que je crains de me faire voler, par où un voleur entrerait-il, et à quoi ressemble ce voleur ? » avant même d'acheter une alarme.</p>
<pre class="pseudo">1) Que protege-t-on ?          -> les BIENS     # un "bien" = une chose de valeur : donnees clients, argent, reputation
2) Par ou peut-on entrer ?     -> la SURFACE   # tous les points d'entree ouverts au monde exterieur
3) Qui attaque, et pourquoi ?  -> les PROFILS  # le portrait-robot des attaquants et leur motivation</pre>
<p>On ne cherche pas à « tout » sécuriser (impossible et ruineux) : on classe les risques par <strong>impact × probabilité</strong> — c'est-à-dire « à quel point ce serait grave » multiplié par « à quel point c'est susceptible d'arriver » — et on ferme d'abord les portes les plus dangereuses.</p>

<h3>4. La surface d'attaque</h3>
<p>La <strong>surface d'attaque</strong>, c'est la liste de TOUS les endroits par lesquels une information extérieure peut entrer dans ton application — donc tous les endroits qu'un attaquant peut tenter d'exploiter. Plus il y a de portes et de fenêtres, plus la maison est difficile à défendre.</p>
<pre class="pseudo">Tout ce qui recoit une entree venue du dehors :
  formulaires          # les champs a remplir : connexion, recherche, louer/acheter
  API REST             # une "porte de service" ou d'autres programmes viennent chercher des donnees (REST = un style d'API tres repandu)
  parametres d'URL     # les infos ecrites dans l'adresse web, par exemple  ...?id=42
  en-tetes HTTP        # les etiquettes techniques envoyees avec chaque requete web (langue, navigateur, cookies...)
  uploads de fichiers  # quand un visiteur televerse (envoie) un fichier vers le serveur
  webhooks             # un autre serveur qui vient "sonner a ta porte" pour te signaler un evenement
  dependances          # les bibliotheques de code ecrites par d'autres, que ton programme execute
Reduire la surface = fermer/desactiver tout ce qu'on n'utilise pas.   # moins de portes = moins a surveiller</pre>
<p>Quelques mots à retenir. Une <strong>requête HTTP</strong> est le message qu'un navigateur envoie à un serveur pour demander une page ou lui envoyer des données ; la <strong>réponse</strong> est ce que le serveur renvoie. Une <strong>API</strong> (Application Programming Interface) est une porte prévue pour que des programmes se parlent entre eux. Une <strong>dépendance</strong> est du code tout prêt, écrit par quelqu'un d'autre, que l'on branche dans son projet pour gagner du temps — mais que l'on exécute donc un peu « les yeux fermés ».</p>

<h3>5. La défense en profondeur</h3>
<p>La <strong>défense en profondeur</strong> est le principe le plus important du cours : ne jamais compter sur UNE seule protection, mais en <strong>empiler plusieurs</strong>, indépendantes, en supposant que chacune peut un jour céder. Image : un château fort n'a pas qu'un seul mur — il a des douves, un pont-levis, un rempart, puis un donjon. Si l'assaillant franchit les douves, le mur l'arrête encore.</p>
<pre class="pseudo">Autour d'un mot de passe, par exemple :
  echappement du template  ET  CSP                          # deux parades contre le XSS (leçons a venir)
  hachage du mdp  ET  limitation de debit  ET  MFA          # trois parades independantes autour du login
Si une barriere tombe, la suivante tient encore.            # c'est tout l'interet d'empiler</pre>
<p>Vocabulaire cité ici, détaillé plus loin dans le cours : un <strong>template</strong> est un modèle de page HTML « à trous » que l'on remplit avec des données ; l'<strong>échappement</strong> consiste à neutraliser les caractères dangereux dans ces données. Une <strong>CSP</strong> (Content Security Policy) est une consigne de sécurité que le serveur donne au navigateur. Le <strong>hachage</strong> transforme un mot de passe en une empreinte illisible et irréversible. La <strong>limitation de débit</strong> (rate limiting) bloque celui qui essaie trop de mots de passe trop vite. Le <strong>MFA</strong> (authentification à plusieurs facteurs) exige une seconde preuve d'identité (un code sur ton téléphone) en plus du mot de passe.</p>
<div class="warn">Aucune protection n'est parfaite : chaque couche suppose que les <strong>autres pourraient céder</strong>. Si une barrière tombe, la suivante tient. C'est le fil conducteur de tout le cours.</div>
<div class="tip">Approche défensive : ce cours apprend à <strong>protéger</strong> la Ludothèque, pas à attaquer les systèmes d'autrui. Adopter le regard de l'attaquant sert uniquement à trouver ses propres failles avant qu'un autre ne le fasse.</div>`,
  exercises: [
    { type: "qcm", q: "La sécurité est…", opts: ["Une fonctionnalité ajoutée à la fin", "Une manière de coder, présente à chaque décision", "L'affaire du seul administrateur", "Optionnelle"], a: 1, exp: "Pas une couche de peinture." },
    { type: "qcm", q: "Le C de CIA :", opts: ["Contrôle", "Confidentialité (seuls les autorisés voient)", "Cache", "Client"], a: 1, exp: "Les trois propriétés." },
    { type: "qcm", q: "L'intégrité protège…", opts: ["La vitesse", "Les données contre l'altération à l'insu", "Le design", "Le réseau"], a: 1, exp: "Stocks, montants, rôles." },
    { type: "qcm", q: "La disponibilité, c'est…", opts: ["Le chiffrement", "Le service accessible aux utilisateurs légitimes", "Le hachage", "Un cookie"], a: 1, exp: "Le déni de service l'attaque." },
    { type: "qcm", q: "Le modèle de menace répond d'abord à…", opts: ["Quel framework ?", "Que protège-t-on, par où entre-t-on, qui attaque ?", "Quel langage ?", "Quel prix ?"], a: 1, exp: "Biens, surface, profils." },
    { type: "qcm", q: "On priorise les risques par…", opts: ["Ordre alphabétique", "Impact × probabilité", "Date", "Hasard"], a: 1, exp: "Sécuriser ce qui compte d'abord." },
    { type: "qcm", q: "La surface d'attaque, c'est…", opts: ["Le CSS", "Tout ce qui reçoit une entrée extérieure", "La base seule", "Le code interne"], a: 1, exp: "Formulaires, API, uploads, dépendances." },
    { type: "qcm", q: "Réduire la surface d'attaque signifie…", opts: ["Ajouter des services", "Fermer ce qu'on n'utilise pas", "Ouvrir tous les ports", "Tout exposer"], a: 1, exp: "Moindre surface." },
    { type: "qcm", q: "Une dépendance fait-elle partie de la surface ?", opts: ["Non", "Oui : c'est du code des autres qu'on exécute", "Seulement en prod", "Jamais"], a: 1, exp: "La chaîne d'approvisionnement (leçon 12)." },
    { type: "qcm", q: "La défense en profondeur suppose…", opts: ["Une barrière parfaite", "Que chaque couche peut céder, donc on en superpose", "Un seul pare-feu", "Aucune protection"], a: 1, exp: "Échappement ET CSP, hachage ET rate limit." },
    { type: "vf", q: "Une seule protection bien faite suffit toujours.", a: false, exp: "Aucune n'est parfaite : superposer." },
    { type: "qcm", q: "Adopter le regard de l'attaquant sert à…", opts: ["Attaquer les autres", "Trouver ses propres failles avant qu'un autre le fasse", "Impressionner", "Rien"], a: 1, exp: "Approche défensive." },
    { type: "qcm", q: "« On ne sécurise pas tout » signifie…", opts: ["On ne sécurise rien", "On priorise selon la valeur et le risque", "La sécurité est inutile", "On attend l'incident"], a: 1, exp: "Ressources limitées, choix éclairés." },
    { type: "qcm", q: "Le vol de session admin serait classé…", opts: ["Négligeable", "Critique (impact élevé)", "Moyen", "Hors sujet"], a: 1, exp: "Impact maximal." },
    { type: "vf", q: "La Ludothèque, avec comptes et données clients, a une vraie surface d'attaque.", a: true, exp: "Le point de départ du cours." }
  ],
  final: {
    title: "Exercice final — Le premier regard",
    intro: `<p>On pose les fondations de l'audit à venir.</p>`,
    questions: [
      { type: "qcm", q: "Les trois questions du modèle de menace :", opts: ["Que protège-t-on ? Par où entre-t-on ? Qui attaque ?", "Quel prix ? Quel délai ? Quel client ?", "Quel langage ? Quel framework ? Quelle base ?", "aucune"], a: 0, exp: "Biens, surface, profils." },
      { type: "qcm", q: "Un bien critique de la Ludothèque :", opts: ["Le logo", "Les mots de passe et données clients", "La couleur du bouton", "Le nom de domaine"], a: 1, exp: "Confidentialité maximale." },
      { type: "qcm", q: "Un point d'entrée typique :", opts: ["Le formulaire de connexion", "Le fichier README", "Le CSS", "Un commentaire"], a: 0, exp: "Il reçoit une entrée." },
      { type: "qcm", q: "La défense en profondeur consiste à :", opts: ["Superposer des protections indépendantes", "Choisir la meilleure et s'y tenir", "Tout miser sur HTTPS", "Ne rien faire"], a: 0, exp: "Redondance volontaire." },
      { type: "vf", q: "Ce cours est défensif : protéger la Ludothèque, pas attaquer autrui.", a: true, exp: "Le cadre." }
    ],
    solution: `<pre class="pseudo">MODELE DE MENACE (esquisse)
Biens    : mots de passe, donnees clients, integrite stocks/montants   # ce qui a de la valeur et qu'il faut proteger en priorite
Surface  : formulaires, API, uploads, en-tetes, dependances            # toutes les portes d'entree recensees
Profils  : client curieux (IDOR), anonyme externe (injection, XSS,     # qui attaque, et par quel moyen
           force brute), dependance compromise (secrets)               #   (suite de la liste des profils)
Priorite : impact x probabilite -> critique en premier                 # on ferme d'abord le plus grave et le plus probable
Methode  : defense en profondeur, couche apres couche                  # empiler des protections independantes</pre>
<p>Le regard est posé. Demain : la première faille classique — l'injection SQL.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton modèle de menace…",
  items: [
  { id: "secu-l1", title: "Le modèle de menace de ton capstone", level: 2,
    statement: "Dresse le modèle de menace de TON application du Niveau 6 : liste 4-5 biens à protéger (classés par sensibilité), la surface d'attaque (au moins 6 points d'entrée réels de ton projet), 3 profils d'attaquant avec ce qu'ils viseraient, et une priorisation en 3 niveaux (critique/élevé/moyen) par impact × probabilité.",
    hints: [
      "Biens : pense à ce qui ferait mal si c'était volé, altéré ou rendu indisponible.",
      "Surface : parcours tes urls.py / routes — chaque route est un point d'entrée.",
      "Profils : anonyme externe, utilisateur authentifié malveillant, dépendance/interne."
    ],
    checklist: ["Tes biens sont-ils classés par sensibilité, avec ce qui fait mal s'ils sont volés, altérés ou rendus indisponibles ?", "Ta surface d'attaque liste-t-elle des points d'entrée RÉELS de ton projet (routes, API, en-têtes, uploads, dépendances) ?", "Chaque profil d'attaquant précise-t-il ce qu'il viserait concrètement ?", "Ta priorisation croise-t-elle bien impact ET probabilité, pas juste « ça a l'air grave » ?"],
    solution: "MODÈLE DE MENACE — [mon capstone]\n\nBIENS (par sensibilité décroissante)\n1. Mots de passe des comptes        (jamais récupérables)\n2. Données personnelles clients      (email, historique -> RGPD)\n3. Intégrité des stocks et montants  (fraude, incohérence)\n4. Sessions actives                  (usurpation d'identité)\n5. Disponibilité du service\n\nSURFACE D'ATTAQUE (points d'entrée réels)\n- POST /connexion, /inscription      (identifiants)\n- GET  /catalogue?q=...              (recherche)\n- POST /louer/<id>, /acheter/<id>   (actions métier)\n- API  /api/jeux, /api/mes-locations\n- en-têtes HTTP, cookies\n- dépendances (requirements.txt / pom.xml / composer.json)\n\nPROFILS D'ATTAQUANT\n1. Anonyme externe   -> injection, XSS, force brute, vol de session\n2. Client authentifié -> IDOR (voir les données des autres), élévation\n3. Dépendance/chaîne  -> secrets exfiltrés, code malveillant\n\nPRIORISATION (impact × probabilité)\nCRITIQUE : injection SQL, vol de session admin, fuite base clients\nÉLEVÉ    : IDOR sur locations, XSS stocké, force brute connexion\nMOYEN    : énumération de comptes, déni de service\n\nChaque ligne « critique/élevé » sera fermée par une leçon de ce cours.",
    note: "Ce document est la carte de tout l'audit : sans lui, on colmate au hasard ; avec lui, on ferme les vraies portes en premier. Garde-le ouvert pendant le cours — à la leçon 20, tu cocheras chaque risque avec sa parade. Un modèle de menace n'est jamais figé : il évolue avec l'application, à revoir à chaque grande fonctionnalité." }
  ]
};
