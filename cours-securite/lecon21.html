<script>
var DAY = {
  num: 21,
  title: "Récapitulatif : la Ludothèque durcie (examen)",
  subtitle: "Tout le cours — et le regard de sécurité — en une épreuve.",
  theory: `
<h3>Récapitulatif avant l'épreuve</h3>
<p>Vingt et une leçons, et la Ludothèque est passée d'une application fonctionnelle à une application <strong>auditée de bout en bout</strong> (« auditée » = vérifiée méthodiquement, faille par faille). Récapitulons — chaque terme renvoie à sa leçon si tu veux le revoir.</p>

<h3>1. Les grands classiques (semaine 1)</h3>
<p>Injection (séparer le code et les données, pour qu'une saisie ne devienne pas une commande), XSS (échapper la sortie, c'est-à-dire neutraliser les balises affichées), CSRF (jeton + SameSite contre les requêtes forgées par un autre site), authentification (hacher les mots de passe, limiter les essais, MFA), sessions (cookie durci : HttpOnly/Secure/SameSite), contrôle d'accès (filtrer par propriétaire pour empêcher l'IDOR). Les failles OWASP les plus fréquentes, fermées.</p>

<h3>2. Données, secrets, dépendances (semaine 2)</h3>
<p>Secrets hors du code (et rotation si l'un fuit), HTTPS/HSTS (chiffrer le transit), chiffrement et minimisation (protéger les données au repos, ou mieux : ne pas les stocker), validation des entrées (upload, SSRF), scan des dépendances (repérer les CVE, surveiller la chaîne d'approvisionnement), logs sûrs (tracer sans divulguer), zéro fuite d'information (DEBUG=0, messages génériques).</p>

<h3>3. Durcissement et pratique (semaine 3)</h3>
<p>En-têtes de sécurité (CSP, protection contre l'encadrement en iframe), infrastructure (moindre privilège et moindre surface), DevSecOps (sécurité vérifiée automatiquement dans le pipeline), RGPD (droits et durées sur les données personnelles), réponse à incident (le plan écrit à froid), audit complet. La sécurité devenue processus, pas événement.</p>

<h3>Le fil conducteur : la défense en profondeur</h3>
<p>Rappel du principe central : ne jamais compter sur une seule protection, mais en empiler plusieurs, indépendantes. Suivons un clic « Louer » qui traverse toutes les barrières :</p>
<pre class="pseudo">Aucune couche ne se croit suffisante. Un "Louer" securise traverse :
HTTPS -> en-tetes -> cookie durci -> CSRF -> authentification ->        # le transport, la page, la session, l'origine, l'identite
autorisation role + ressource -> validation -> ORM anti-injection ->    # les droits, les entrees, la requete a la base
sortie echappee -> transaction -> log sur -> erreur generique.          # l'affichage, l'ecriture, la trace, l'erreur
Si une barriere cede, la suivante tient.                                # c'est toute l'idee de la defense en profondeur</pre>
<div class="tip">La sécurité n'est jamais « finie » : nouvelles menaces, nouvelles dépendances, nouvelles fonctionnalités. Ce que ce cours donne n'est pas une liste de cases à cocher une fois, mais un <strong>regard</strong> — celui qui, devant n'importe quelle application, se demande « par où entre-t-on, et jusqu'où va-t-on ? ». Bonne épreuve, la dernière de la formation !</div>`,
  exercises: [
    { type: "qcm", q: "L'injection SQL se ferme par…", opts: ["Un pare-feu applicatif (WAF)", "La séparation code/données (requêtes paramétrées, ORM)", "Le chiffrement du transport (HTTPS)", "Un audit régulier des journaux"], a: 1, exp: "Leçon 2." },
    { type: "qcm", q: "Le XSS se ferme par…", opts: ["Chiffrer la base", "L'échappement de sortie (+ CSP)", "Un rate limit", "Un identifiant UUID imprévisible"], a: 1, exp: "Leçons 3/15." },
    { type: "qcm", q: "Le CSRF se ferme par…", opts: ["Le jeton + SameSite", "Le chiffrement des cookies de session", "L'en-tête de sécurité HSTS", "Un scan de vulnérabilités régulier"], a: 0, exp: "Leçon 4." },
    { type: "qcm", q: "Un mot de passe se…", opts: ["Chiffre avec une clé secrète réversible", "Hache (argon2/bcrypt), + rate limit + MFA", "Encode en Base64 avant stockage", "Publie en clair dans un fichier de log"], a: 1, exp: "Leçon 5." },
    { type: "qcm", q: "Le cookie de session se durcit avec…", opts: ["HttpOnly, Secure, SameSite, expiration", "un timeout de 10 ans", "une simple case « se souvenir de moi »", "un enregistrement dans les logs d'accès"], a: 0, exp: "Leçon 6." },
    { type: "qcm", q: "L'IDOR se ferme par…", opts: ["Un UUID seul", "Le filtrage par le propriétaire (request.user)", "Le menu masqué", "Le chiffrement HTTPS des requêtes"], a: 1, exp: "Leçon 7." },
    { type: "qcm", q: "Un secret exposé doit être…", opts: ["Caché plus profondément dans le code", "Tourné (révoqué + régénéré)", "Chiffré sur place", "Ignoré s'il n'a pas encore été exploité"], a: 1, exp: "Leçon 8." },
    { type: "qcm", q: "HTTPS protège…", opts: ["Le stockage", "Le transit (+ HSTS)", "Contre le XSS", "Les mots de passe faibles"], a: 1, exp: "Leçon 9, nécessaire pas suffisant." },
    { type: "qcm", q: "La meilleure protection d'une donnée :", opts: ["La chiffrer", "Ne pas la stocker (minimisation)", "La dupliquer", "La publier"], a: 1, exp: "Leçon 10." },
    { type: "qcm", q: "Toute entrée est…", opts: ["De confiance", "Hostile jusqu'à validation", "Chiffrée", "Sans risque"], a: 1, exp: "Leçon 11." },
    { type: "qcm", q: "Une dépendance vulnérable se détecte par…", opts: ["Une revue de code manuelle occasionnelle", "Le scan CVE (pip-audit/trivy) en CI", "Le chiffrement du trafic HTTPS", "Un message d'erreur générique"], a: 1, exp: "Leçons 12/17." },
    { type: "qcm", q: "Dans les logs, on ne met JAMAIS…", opts: ["L'horodatage", "Mots de passe, jetons, données perso brutes", "L'adresse IP de la requête", "L'événement"], a: 1, exp: "Leçon 13." },
    { type: "qcm", q: "Le message d'échec de connexion :", opts: ["« Email inconnu »", "« Identifiants invalides » (indifférencié)", "Le détail SQL", "La stack trace complète de l'erreur"], a: 1, exp: "Leçon 14, anti-énumération." },
    { type: "qcm", q: "La CSP est…", opts: ["Un remplacement de l'échappement", "Un rempart anti-XSS complémentaire (en-tête)", "Un jeton anti-CSRF", "Un scan automatique des dépendances"], a: 1, exp: "Leçon 15." },
    { type: "qcm", q: "L'infra se durcit par…", opts: ["Plus de ports", "Moindre privilège et moindre surface", "Un WAF seul", "Une configuration par défaut, jamais modifiée"], a: 1, exp: "Leçon 16." },
    { type: "qcm", q: "DevSecOps, c'est…", opts: ["Un audit annuel", "La sécurité en contrôle continu dans le pipeline", "Un pare-feu", "Un simple plugin de navigateur"], a: 1, exp: "Leçon 17." },
    { type: "qcm", q: "Le RGPD, techniquement, c'est…", opts: ["Du droit pur", "Minimisation, droits implémentés, durées, anonymisation", "Une simple bannière de consentement", "Un scan de conformité automatique"], a: 1, exp: "Leçon 18." },
    { type: "qcm", q: "Face à un incident, on confine…", opts: ["Après avoir tout nettoyé", "AVANT d'éradiquer (arrêter l'hémorragie)", "Seulement si le client s'en aperçoit", "Après le post-mortem"], a: 1, exp: "Leçon 19." },
    { type: "qcm", q: "Un audit honnête contient…", opts: ["Que du vert", "Des risques acceptés documentés", "Un tampon « 100% sécurisé »", "Uniquement des félicitations"], a: 1, exp: "Leçon 20." },
    { type: "qcm", q: "Le fil conducteur du cours :", opts: ["Une seule barrière parfaite", "La défense en profondeur (couches indépendantes)", "HTTPS seul", "L'obscurité du code, jamais documenté"], a: 1, exp: "Chaque couche suppose que les autres cèdent." }
  ],
  final: {
    title: "Épreuve de synthèse — Le trajet sécurisé d'un « Louer »",
    intro: `<p>Un client clique « Louer ». Suivez la requête à travers toutes les défenses désormais en place.</p>`,
    questions: [
      { type: "qcm", q: "Le transport et l'entrée :", opts: ["HTTPS/HSTS + en-têtes (CSP, frame) + cookie durci", "HTTP simple", "une simple page d'accueil sans en-tête", "un WAF seul"], a: 0, exp: "Leçons 9, 15, 6." },
      { type: "qcm", q: "L'identité et les droits :", opts: ["CSRF + authentification + autorisation rôle ET ressource", "le menu masqué", "un champ caché", "une simple vérification côté client (JavaScript)"], a: 0, exp: "Leçons 4, 5, 7." },
      { type: "qcm", q: "Le traitement des données :", opts: ["Validation + ORM anti-injection + sortie échappée", "concaténation SQL", "|safe partout", "une validation uniquement côté client"], a: 0, exp: "Leçons 11, 2, 3." },
      { type: "qcm", q: "Après l'action :", opts: ["Log sûr (sans secret) + erreur générique si échec", "log du mot de passe", "stack trace publique", "un simple code d'erreur HTTP 500"], a: 0, exp: "Leçons 13, 14." },
      { type: "vf", q: "Si une barrière cède, la suivante tient : c'est la défense en profondeur.", a: true, exp: "🎓 Le fil conducteur du cours." }
    ],
    solution: `<pre class="pseudo">LE TRAJET SECURISE D'UN "LOUER"
Transport   HTTPS + HSTS chiffrent la requete             (l.9)    # illisible sur le reseau
En-tetes    CSP, X-Frame-Options protegent la page        (l.15)   # scripts et iframes maitrises
Cookie      session HttpOnly + Secure + SameSite          (l.6)    # cookie de session inexploitable meme vole
CSRF        jeton verifie : requete issue de NOTRE page   (l.4)    # pas une requete forgee ailleurs
AuthN       utilisateur authentifie (hachage, rate, MFA)  (l.5)    # on sait QUI agit
AuthZ       droit de louer (role) sur SES donnees (ressource) (l.7) # ...et s'il en a le DROIT
Validation  entrees verifiees, rien de confiance aveugle  (l.11)   # toute entree est hostile jusqu'a preuve
Injection   ORM / parametre : pas de SQL forge            (l.2)    # la saisie reste une simple donnee
XSS         sortie echappee : pas de script injecte       (l.3)    # le texte est affiche, pas execute
Metier      transaction atomique (capstone) -> COMMIT              # tout ou rien, jamais d'etat incoherent
Log         evenement trace, SANS secret                  (l.13)   # utile a l'enquete, sans trahir
Erreur      message generique si echec, DEBUG=0           (l.14)   # aucune fuite d'information
Autour : secrets hors code (l.8), dependances scannees (l.12),     # le contexte reste sain
image durcie (l.16), pipeline securise (l.17), RGPD (l.18),        # infra + CI + conformite
plan d'incident pret (l.19).                                       # prets a reagir meme si tout echoue</pre>
<p>🎓 <strong>Félicitations — et bravo pour toute la formation !</strong> La Ludothèque a été conçue (Merise), développée (langage + framework + base), assemblée (capstone), conteneurisée (Docker), livrée par un pipeline (CI/CD) et enfin <strong>durcie</strong> contre les attaques. Tu es passé du premier <code>if</code> au regard de sécurité d'un développeur professionnel complet. La défense en profondeur n'est plus une notion : c'est ton réflexe.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta synthèse de sécurité…",
  items: [
  { id: "secu-l21", title: "Le regard de sécurité", level: 3,
    statement: "Exercice de synthèse final : prends une fonctionnalité que tu ajouterais à la Ludothèque (ex. messagerie entre client et vendeur, système d'avis, wishlist) et applique-lui le regard de sécurité complet — modèle de menace de la fonctionnalité, les 6-8 défenses pertinentes parmi celles du cours, et les risques résiduels. Montre que la sécurité est un REGARD applicable à tout, pas une liste figée.",
    hints: [
      "Choisis une fonctionnalité avec des entrées utilisateur et des données (ex. avis : texte + note).",
      "Passe-la au crible : injection ? XSS (texte affiché) ? IDOR (avis d'autrui) ? autorisation ? RGPD ?",
      "Conclus sur ce que ce regard t'apporte au-delà de ce cours précis."
    ],
    checklist: ["As-tu choisi une fonctionnalité avec de vraies entrées utilisateur et des données (avis, messagerie, wishlist) ?", "Lui appliques-tu un modèle de menace propre (biens, surface, attaquants) avant de choisir les défenses ?", "Sélectionnes-tu 6-8 défenses PERTINENTES du cours (XSS, injection, IDOR, CSRF, validation, RGPD, logs) ?", "Montres-tu que la sécurité est un REGARD transférable (mêmes questions partout), avec les risques résiduels assumés ?"],
    solution: "LE REGARD DE SÉCURITÉ APPLIQUÉ — nouvelle fonctionnalité « avis sur un jeu »\n\nDESCRIPTION : un client laisse une note (1-5) + un texte sur un jeu qu'il a\nloué/acheté ; les avis s'affichent publiquement sur la page du jeu.\n\nMODÈLE DE MENACE (de la fonctionnalité)\n- Biens : intégrité des avis, réputation, données des auteurs\n- Surface : formulaire d'avis (note + texte), affichage public, API\n- Attaquants : spammeur, client malveillant (avis d'autrui), anonyme (XSS)\n\nDÉFENSES PERTINENTES\n1. XSS (l.3) : le texte d'avis s'affiche chez tous -> ÉCHAPPEMENT strict\n   (le piège classique du contenu utilisateur affiché) + CSP (l.15)\n2. Injection (l.2) : recherche/tri des avis via l'ORM, jamais de SQL forgé\n3. Autorisation par ressource (l.7) : on ne peut noter QUE ce qu'on a\n   loué/acheté ; on ne modifie/supprime QUE SON avis (anti-IDOR)\n4. Validation (l.11) : note bornée 1-5, texte longueur max, anti-spam (rate limit)\n5. Contrôle d'accès (l.7) : seul l'auteur ou un admin modère ; refusé par défaut\n6. CSRF (l.4) : poster/supprimer un avis = POST + jeton\n7. RGPD (l.18) : l'avis est une donnée personnelle -> export/anonymisation\n   (à la suppression du compte, l'avis devient « auteur anonyme »)\n8. Logs (l.13) : tracer les suppressions d'avis (modération), sans données brutes\n\nRISQUES RÉSIDUELS (acceptés/documentés)\n- Faux avis d'un concurrent : mitigé (achat vérifié requis), pas éliminé\n- Contenu inapproprié : modération humaine, pas 100 % automatisable\n\nCE QUE M'APPORTE CE REGARD\nJe n'ai pas eu besoin d'une « checklist avis » : j'ai appliqué le MÊME\nquestionnement (par où entre-t-on ? jusqu'où va-t-on ? que protège-t-on ?)\nqu'à n'importe quelle fonctionnalité. La sécurité n'est pas une liste\nfigée à mémoriser, c'est un REGARD qui se pose sur tout code nouveau.",
    note: "Cet exercice final montre l'aboutissement du cours : la sécurité n'est pas 21 recettes à réciter, mais un REGARD transférable. Face à une fonctionnalité jamais vue (« les avis »), tu retrouves seul les bonnes questions et les défenses pertinentes, en piochant dans un répertoire compris plutôt que mémorisé. C'est exactement ce qu'on attend d'un développeur : non pas connaître toutes les failles par cœur, mais savoir les CHERCHER dans son propre code, à chaque fois. Bravo — pour ce cours et pour toute la formation." }
  ]
};
