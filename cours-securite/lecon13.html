<script>
var DAY = {
  num: 13,
  title: "Journalisation sûre et détection",
  subtitle: "Les logs sont à double tranchant : indispensables, et dangereux s'ils trahissent.",
  theory: `
<h3>1. Pourquoi journaliser (côté sécurité)</h3>
<p>Un <strong>log</strong> (journal) est une trace écrite, ligne par ligne, de ce que fait l'application. <strong>Journaliser</strong>, c'est écrire ces traces. Le capstone journalisait le métier (une commande passée, un stock modifié) ; ici on journalise la <strong>sécurité</strong> : qui s'est connecté, quand, quels échecs, quels changements de rôle. Sans logs, un incident (leçon 19) reste un mystère — on ignore ce qui s'est passé et jusqu'où l'attaquant est allé.</p>

<h3>2. Ce qu'on journalise</h3>
<p>Un <strong>logger</strong> est l'outil qui écrit les logs. Il classe chaque message par <strong>niveau</strong> d'importance : <code>info</code> (événement normal), <code>warning</code> (avertissement), <code>error</code> (erreur). La règle : tracer QUI a fait QUOI et QUAND.</p>
<pre class="pseudo">logger.info("connexion reussie user=%s ip=%s", user.id, ip)             # evenement normal : on note l'utilisateur et son IP
logger.warning("echec de connexion email=%s ip=%s", email, ip)          # avertissement : un essai a echoue (jamais le mot de passe)
logger.warning("changement de role cible=%s par=%s", cible.id, admin.id) # qui a promu qui : une trace sensible a garder
logger.warning("acces refuse ressource=%s user=%s", pk, user.id)        # une autorisation refusee (signal d'IDOR possible, leçon 7)
# QUI, QUOI, QUAND — les evenements de securite, traces.                # le trio a toujours consigner</pre>
<p>L'<strong>IP</strong> est l'adresse réseau de la machine qui se connecte ; le symbole <code>%s</code> insère une valeur dans le message (ici l'identifiant, l'email…).</p>

<h3>3. Ce qu'on ne journalise JAMAIS</h3>
<p>Un log peut trahir autant qu'il aide. Certaines données ne doivent JAMAIS y figurer, car les logs se copient et circulent.</p>
<pre class="pseudo">✘ mots de passe (meme le mot de passe essaye lors d'un echec)   # un log n'est pas un endroit ou ranger un secret
✘ jetons de session / API, cookies                              # les copier reviendrait a offrir des acces
✘ numeros de carte, donnees personnelles brutes                 # ce serait une fuite de donnees par les logs
-> les logs se copient, s'archivent, se partagent, s'envoient a un tiers :   # ils voyagent beaucoup
  ils doivent etre traites comme des donnees SENSIBLES.          # donc protegees comme telles</pre>

<h3>4. Détecter en direct</h3>
<p>Des logs qu'on ne lit qu'après coup ne servent qu'à l'autopsie (le <strong>post-mortem</strong>). Bien mieux : surveiller les logs en temps réel pour repérer les attaques pendant qu'elles se produisent.</p>
<pre class="pseudo">Des logs sans surveillance ne servent qu'au post-mortem. Detecter :
- rafale d'echecs de connexion (force brute) -> alerte + rate limit (leçon 5)   # trop d'essais = attaque en cours
- acces sequentiels a /locations/1,2,3... (IDOR tente) -> alerte                # quelqu'un balaye les numeros (leçon 7)
- un compte qui change soudain de pays/appareil -> signalement                  # comportement inhabituel = suspect
-> passer de l'autopsie a la prevention.                                        # detecter tot plutot que constater trop tard</pre>

<h3>5. Intégrité et centralisation des logs</h3>
<p>Un attaquant qui pénètre le serveur peut effacer les logs pour couvrir ses traces… s'ils sont locaux et modifiables. On les protège : <strong>centraliser</strong> = les envoyer vers un serveur de logs séparé ; <strong>append-only</strong> = on ne peut qu'ajouter, jamais réécrire ; <strong>horodater</strong> = marquer la date et l'heure exactes de chaque ligne.</p>
<pre class="pseudo">Un attaquant qui entre efface ses traces si les logs sont locaux et editables.
- centraliser (serveur de logs distinct, append-only)   # hors de portee de l'attaquant, et non modifiables
- horodater, conserver selon une duree definie          # dater precisement + retention (combien de temps on garde)
- proteger l'acces aux logs                             # ils contiennent malgre tout des infos sensibles</pre>
<div class="warn">Le paradoxe du log : pour être utile à l'enquête, il doit être détaillé ; pour être sûr, il ne doit rien contenir de sensible. La ligne de partage : journaliser l'<strong>événement</strong> (« connexion échouée pour ce compte ») jamais le <strong>secret</strong> (le mot de passe essayé). L'identifiant de l'utilisateur, oui ; ses données personnelles brutes, non.</div>
<div class="tip">Toutes les piles ont un logger structuré (Python logging, SLF4J/Logback, Serilog, Monolog). Le travail de sécurité : définir une politique de ce qui se journalise, filtrer les données sensibles, centraliser, et brancher la détection sur les événements clés.</div>`,
  exercises: [
    { type: "qcm", q: "Côté sécurité, on journalise…", opts: ["Le CSS", "Les événements de sécurité (connexions, échecs, changements de rôle)", "Les images", "Rien"], a: 1, exp: "QUI, QUOI, QUAND." },
    { type: "qcm", q: "Sans logs, un incident est…", opts: ["Résolu vite", "Un mystère : on ignore ce qui s'est passé et jusqu'où", "Impossible", "Chiffré"], a: 1, exp: "La base du forensic (leçon 19)." },
    { type: "qcm", q: "On journalise un échec de connexion en…", opts: ["logger.info", "logger.warning (email + ip, PAS le mot de passe)", "clair total", "ne pas journaliser"], a: 1, exp: "L'événement, pas le secret." },
    { type: "qcm", q: "On ne journalise JAMAIS…", opts: ["L'identifiant utilisateur", "Les mots de passe, jetons, cartes, données perso brutes", "L'horodatage", "L'IP"], a: 1, exp: "Fuite par les logs." },
    { type: "qcm", q: "Le mot de passe essayé lors d'un échec…", opts: ["Doit être journalisé pour enquêter", "Ne se journalise jamais", "Est chiffré dans le log", "Est public"], a: 1, exp: "Jamais, même à l'échec." },
    { type: "qcm", q: "Pourquoi traiter les logs comme sensibles ?", opts: ["Ils sont volumineux", "Ils se copient, s'archivent, se partagent", "Ils sont chiffrés", "Ils sont inutiles"], a: 1, exp: "Diffusion large." },
    { type: "qcm", q: "Des logs sans surveillance servent…", opts: ["À prévenir", "Seulement au post-mortem", "À rien", "À chiffrer"], a: 1, exp: "Détecter en direct est mieux." },
    { type: "qcm", q: "Une rafale d'échecs de connexion doit…", opts: ["Être ignorée", "Déclencher une alerte + rate limit (leçon 5)", "Être journalisée sans plus", "Chiffrer"], a: 1, exp: "Force brute détectée." },
    { type: "qcm", q: "Des accès à /locations/1,2,3... séquentiels signalent…", opts: ["Un usage normal", "Une tentative d'IDOR (leçon 7)", "Un XSS", "Un cache"], a: 1, exp: "Motif suspect." },
    { type: "qcm", q: "Un attaquant local peut…", opts: ["Rien", "Effacer ses traces si les logs sont locaux et éditables", "Chiffrer les logs", "Accélérer"], a: 1, exp: "D'où la centralisation." },
    { type: "qcm", q: "Protéger l'intégrité des logs :", opts: ["Les garder locaux et modifiables", "Centraliser, append-only, horodater", "Les supprimer souvent", "Les publier"], a: 1, exp: "Serveur de logs distinct." },
    { type: "vf", q: "Les logs doivent être détaillés ET ne rien contenir de sensible.", a: true, exp: "Le paradoxe : événement oui, secret non." },
    { type: "qcm", q: "La ligne de partage :", opts: ["Tout journaliser", "L'événement (connexion échouée) oui, le secret (mot de passe) non", "Rien journaliser", "Chiffrer tout"], a: 1, exp: "Utile sans trahir." },
    { type: "qcm", q: "L'accès aux logs doit être…", opts: ["Public", "Protégé (ils contiennent des infos sensibles)", "Illimité", "Sans mot de passe"], a: 1, exp: "Contrôle d'accès aux logs." },
    { type: "vf", q: "Brancher la détection sur les événements clés transforme l'autopsie en prévention.", a: true, exp: "Alerter en direct." }
  ],
  final: {
    title: "Exercice final — Des logs utiles et sûrs",
    intro: `<p>Les logs enregistrent des mots de passe et personne ne surveille les intrusions.</p>`,
    questions: [
      { type: "qcm", q: "Un échec de connexion se journalise :", opts: ["email + ip, JAMAIS le mot de passe", "avec le mot de passe pour enquêter", "en clair total", "pas du tout"], a: 0, exp: "Événement, pas secret." },
      { type: "qcm", q: "À bannir des logs :", opts: ["Mots de passe, jetons, cartes, données perso brutes", "l'horodatage", "l'IP", "l'id utilisateur"], a: 0, exp: "Données sensibles." },
      { type: "qcm", q: "Détecter la force brute :", opts: ["Alerte sur rafale d'échecs + rate limit", "rien", "un cache", "un cookie"], a: 0, exp: "En direct." },
      { type: "qcm", q: "Protéger les logs :", opts: ["Centraliser, append-only, accès contrôlé", "les garder locaux éditables", "les publier", "les supprimer"], a: 0, exp: "Intégrité." },
      { type: "vf", q: "Journaliser l'événement sans le secret : utile à l'enquête, sans fuite.", a: true, exp: "La ligne de partage." }
    ],
    solution: `<pre class="pseudo"># A JOURNALISER (evenements de securite)
logger.warning("echec de connexion email=%s ip=%s", email, ip)          # l'evenement, mais PAS le mot de passe
logger.warning("changement de role cible=%s par=%s", cible.id, admin.id) # qui a promu qui
logger.warning("acces refuse ressource=%s user=%s", pk, user.id)        # signal d'IDOR possible (leçon 7)

# A BANNIR : mots de passe, jetons, cartes, donnees perso brutes         # jamais de secret dans un log

# DETECTER : rafale d'echecs -> alerte + rate limit (leçon 5)            # attraper la force brute en direct
# INTEGRITE : logs centralises, append-only, horodates, acces controle   # des traces infalsifiables</pre>
<p>Les logs éclairent sans trahir. Demain : ne rien divulguer par erreur.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta politique de journalisation…",
  items: [
  { id: "secu-l13", title: "La politique de journalisation de sécurité", level: 3,
    statement: "Rédige la politique de journalisation de sécurité de la Ludothèque : la liste des événements à tracer (connexions, échecs, changements de rôle, accès refusés, actions sensibles), la liste noire de ce qui ne doit JAMAIS apparaître, les règles d'intégrité/rétention/accès, et 3 règles de détection (avec le seuil et l'action). Cite les leçons 5 (rate limit), 7 (IDOR) et 19 (incident).",
    hints: [
      "Événements : chaque action qui compte pour reconstituer une intrusion.",
      "Liste noire : mots de passe, jetons, cartes, données perso brutes.",
      "Détection : force brute (rafale d'échecs), IDOR (accès séquentiels), élévation soudaine."
    ],
    checklist: ["Ta liste d'événements couvre-t-elle connexions, échecs, changements de rôle, accès refusés et actions sensibles (QUI/QUOI/QUAND/d'OÙ) ?", "Ta liste noire interdit-elle mots de passe, jetons, cartes et données perso brutes dans les logs ?", "Tes logs sont-ils intègres (append-only, centralisés), horodatés, avec rétention et accès restreint ?", "Chaque règle de détection a-t-elle un seuil ET une action (force brute, IDOR, connexion inhabituelle) ?"],
    solution: "POLITIQUE DE JOURNALISATION DE SÉCURITÉ — La Ludothèque\n\nÉVÉNEMENTS À TRACER (QUI, QUOI, QUAND, d'OÙ)\n- Connexion réussie / échouée (user ou email, ip)\n- Déconnexion, changement de mot de passe, réinitialisation\n- Changement de rôle / promotion (cible + auteur)\n- Accès refusé à une ressource (pk + user) — signal d'IDOR (l.7)\n- Actions sensibles : suppression, remboursement, export de données (l.18)\n\nLISTE NOIRE (jamais dans les logs)\n- Mots de passe (même celui essayé à l'échec)\n- Jetons de session/API, cookies\n- Numéros de carte, données personnelles brutes\n\nINTÉGRITÉ / RÉTENTION / ACCÈS\n- Centralisés sur un serveur distinct, append-only, horodatés\n- Rétention définie (ex. 12 mois), puis purge\n- Accès aux logs restreint et lui-même journalisé\n\nRÈGLES DE DÉTECTION\n1. > 5 échecs de connexion / 5 min (même IP ou même compte)\n   -> alerte + blocage temporaire (rate limit, l.5)\n2. Accès séquentiels à /locations/{N} croissants par un même compte\n   -> alerte (tentative d'IDOR, l.7)\n3. Connexion réussie depuis un pays/appareil inhabituel\n   -> notification à l'utilisateur + surveillance renforcée\n\nCes journaux alimentent la réponse à incident (l.19) : sans eux,\nimpossible de savoir ce qui s'est passé ni jusqu'où.",
    note: "Une bonne politique de journalisation se conçoit AVANT l'incident, en pensant à la question qu'on se posera pendant : « qu'est-ce qui s'est passé, quand, jusqu'où ? ». Les trois règles de détection transforment des logs passifs en système d'alerte — et le lien avec la leçon 19 est direct : la qualité de la réponse à incident dépend entièrement de la qualité des logs accumulés avant lui." }
  ]
};
</script>
