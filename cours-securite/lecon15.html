<script>
var DAY = {
  num: 15,
  title: "En-têtes de sécurité HTTP (CSP, HSTS, frame)",
  subtitle: "Quelques lignes d'instructions au navigateur, une protection disproportionnée.",
  theory: `
<h3>1. Le principe</h3>
<p>Un <strong>en-tête</strong> HTTP est une ligne d'information technique jointe à chaque réponse du serveur. Les <strong>en-têtes de sécurité</strong> en sont un sous-ensemble : des consignes que le serveur donne au navigateur — « refuse les scripts venus d'ailleurs », « ne te laisse pas encadrer par un autre site », « ne devine pas le type des fichiers ». Presque gratuits à poser, ils servent de filet de rattrapage quand une autre défense a un trou (un échappement manqué, un reste de HTTP).</p>

<h3>2. Content-Security-Policy (le rempart anti-XSS)</h3>
<p>La <strong>CSP</strong> (Content-Security-Policy) liste les sources autorisées pour chaque type de ressource (scripts, styles, images…). Tout ce qui n'est pas dans la liste est bloqué par le navigateur — y compris un script injecté par un XSS (leçon 3).</p>
<pre class="pseudo">Content-Security-Policy: default-src 'self'; script-src 'self'; object-src 'none'
# 'self' = uniquement les ressources du MEME site ; tout le reste est bloque
# meme si un XSS (leçon 3) injecte un script, le navigateur REFUSE de l'executer
# s'il ne vient pas d'une source autorisee. C'est le meilleur filet de rattrapage.
# a deployer en report-only d'abord (leçon 3) pour ne rien casser au demarrage.</pre>

<h3>3. Les autres en-têtes clés</h3>
<pre class="pseudo">X-Frame-Options: DENY            # personne ne peut afficher le site dans une iframe -> anti-clickjacking
                                 # (le "clic detourne", explique juste apres)
X-Content-Type-Options: nosniff  # le navigateur ne "devine" pas le type d'un fichier : il respecte l'etiquette declaree
Referrer-Policy: strict-origin-when-cross-origin   # ne pas divulguer l'URL complete visitee aux autres sites
Strict-Transport-Security: ...   # c'est HSTS (leçon 9) : impose HTTPS uniquement
Permissions-Policy: geolocation=(), camera=()      # desactive des API navigateur inutiles (position, camera...)</pre>
<p>Une <strong>iframe</strong> est une page web affichée à l'intérieur d'une autre. Le « MIME sniffing », que <code>nosniff</code> désactive, est la tendance du navigateur à deviner tout seul le type d'un fichier — source de confusion exploitable.</p>

<h3>4. Le clickjacking, concrètement</h3>
<p>Le <strong>clickjacking</strong> (« détournement de clic ») consiste à superposer une page piège au-dessus d'une vraie page rendue transparente, pour que la victime clique en réalité ailleurs que là où elle croit cliquer.</p>
<pre class="pseudo">L'attaquant charge la Ludotheque dans une iframe invisible par-dessus un
leurre ; la victime croit cliquer sur le leurre, clique en realite sur       # le clic "traverse" vers la vraie page
"Supprimer mon compte". X-Frame-Options: DENY (ou CSP frame-ancestors)       # interdire l'encadrement du site...
interdit l'encadrement -> l'attaque devient impossible.                      # ...supprime la superposition piegee</pre>

<h3>5. Poser et tester</h3>
<p>Ces en-têtes se posent soit dans le code (via un <strong>middleware</strong>, un composant qui traite chaque requête/réponse), soit au niveau du <strong>reverse proxy</strong> (leçon 9). Des sites en ligne notent ensuite ta configuration.</p>
<pre class="pseudo"># Django : SecurityMiddleware + django-csp
SECURE_CONTENT_TYPE_NOSNIFF = True     # active l'en-tete nosniff
X_FRAME_OPTIONS = "DENY"               # active l'en-tete X-Frame-Options
# Java : Spring Security headers ; C# : app.UseHsts + headers ; PHP : header()   # les equivalents selon la pile
# ou le reverse proxy (nginx) injecte les en-tetes pour toutes les reponses.      # une seule config pour tout le site
# Tester : securityheaders.com, Mozilla Observatory -> une note + les manques.    # audit gratuit en ligne</pre>
<div class="warn">La CSP est puissante mais capricieuse : trop stricte d'un coup, elle casse les scripts et styles légitimes et se fait désactiver en urgence. La déployer en <strong>report-only</strong> (elle signale sans bloquer), traiter les faux positifs, puis appliquer — c'est la seule voie qui la fait adopter durablement.</div>
<div class="tip">Ces en-têtes complètent, ils ne remplacent pas : la CSP renforce l'échappement (leçon 3), HSTS renforce HTTPS (leçon 9). Défense en profondeur — chaque en-tête est une couche de plus, pour un coût quasi nul.</div>`,
  exercises: [
    { type: "qcm", q: "Les en-têtes de sécurité sont…", opts: ["Du CSS", "Des instructions du serveur au navigateur", "Des cookies", "Des logs"], a: 1, exp: "« refuse ceci, n'accepte que cela »." },
    { type: "qcm", q: "Leur intérêt :", opts: ["Coûteux et faibles", "Presque gratuits, rattrapent des oublis", "Remplacent tout", "Ralentissent"], a: 1, exp: "Filet de rattrapage." },
    { type: "qcm", q: "La Content-Security-Policy protège surtout contre…", opts: ["L'injection SQL", "Le XSS (2e rempart)", "Le CSRF", "La force brute"], a: 1, exp: "Refuse les scripts non autorisés." },
    { type: "qcm", q: "Même si un XSS injecte un script, une bonne CSP…", opts: ["L'exécute", "Refuse de l'exécuter (source non autorisée)", "Le chiffre", "L'ignore"], a: 1, exp: "Défense en profondeur." },
    { type: "qcm", q: "X-Frame-Options: DENY protège contre…", opts: ["Le XSS", "Le clickjacking (encadrement en iframe)", "L'injection", "Le vol de cookie"], a: 1, exp: "Pas d'iframe piège." },
    { type: "qcm", q: "Le clickjacking, c'est…", opts: ["Un clic rapide", "Faire cliquer la victime sur une action cachée via une iframe", "Un XSS", "Un CSRF"], a: 1, exp: "Clic détourné." },
    { type: "qcm", q: "X-Content-Type-Options: nosniff empêche…", opts: ["Le HTTPS", "Le navigateur de deviner les types MIME", "Le CSRF", "Le log"], a: 1, exp: "Anti-confusion de type." },
    { type: "qcm", q: "Strict-Transport-Security correspond à…", opts: ["La CSP", "HSTS (leçon 9) : HTTPS uniquement", "Le CSRF", "Un cookie"], a: 1, exp: "Rappel HTTPS." },
    { type: "qcm", q: "Referrer-Policy sert à…", opts: ["Chiffrer", "Ne pas fuiter l'URL complète vers d'autres sites", "Bloquer les scripts", "Logger"], a: 1, exp: "Moins de fuite." },
    { type: "qcm", q: "Permissions-Policy: camera=()…", opts: ["Active la caméra", "Désactive des API navigateur inutiles", "Chiffre", "Ralentit"], a: 1, exp: "Réduire la surface." },
    { type: "qcm", q: "La CSP se déploie idéalement…", opts: ["Stricte d'un coup", "En report-only d'abord, puis appliquée", "Jamais", "Sans test"], a: 1, exp: "Sinon elle casse et se fait désactiver." },
    { type: "vf", q: "Une CSP trop stricte d'un coup peut casser scripts et styles légitimes.", a: true, exp: "D'où le report-only." },
    { type: "qcm", q: "Poser les en-têtes peut se faire…", opts: ["Seulement dans le code", "Code (middleware) OU reverse proxy (nginx)", "Nulle part", "Dans la base"], a: 1, exp: "Plusieurs endroits." },
    { type: "qcm", q: "Tester ses en-têtes :", opts: ["securityheaders.com / Observatory", "un ping", "docker ps", "git log"], a: 0, exp: "Note + manques." },
    { type: "vf", q: "Les en-têtes complètent l'échappement et HTTPS, ils ne les remplacent pas.", a: true, exp: "Défense en profondeur." }
  ],
  final: {
    title: "Exercice final — Poser les en-têtes",
    intro: `<p>Les réponses HTTP ne portent aucun en-tête de sécurité. On les ajoute.</p>`,
    questions: [
      { type: "qcm", q: "Le rempart anti-XSS :", opts: ["Content-Security-Policy", "un cookie", "un log", "un cache"], a: 0, exp: "2e rempart (leçon 3)." },
      { type: "qcm", q: "Anti-clickjacking :", opts: ["X-Frame-Options: DENY (ou CSP frame-ancestors)", "HTTPS", "un CAPTCHA", "rien"], a: 0, exp: "Pas d'iframe." },
      { type: "qcm", q: "Déployer la CSP :", opts: ["report-only d'abord, ajuster, appliquer", "stricte d'un coup", "jamais", "sans test"], a: 0, exp: "Adoption durable." },
      { type: "qcm", q: "Vérifier le résultat :", opts: ["securityheaders.com / Observatory", "un sentiment", "docker ps", "rien"], a: 0, exp: "Note objective." },
      { type: "vf", q: "Quelques en-têtes offrent une protection disproportionnée à leur coût.", a: true, exp: "Le meilleur rapport effort/gain." }
    ],
    solution: `<pre class="pseudo"># En-tetes (middleware / django-csp / reverse proxy)
Content-Security-Policy-Report-Only: default-src 'self'; script-src 'self'  # etape 1 : observer sans bloquer
Content-Security-Policy: default-src 'self'; script-src 'self'; object-src 'none'  # etape 2 : appliquer pour de bon
X-Frame-Options: DENY                                       # anti-clickjacking
X-Content-Type-Options: nosniff                             # pas de devinette de type MIME
Referrer-Policy: strict-origin-when-cross-origin            # ne pas fuiter l'URL complete
Strict-Transport-Security: max-age=31536000; includeSubDomains; preload   # HSTS : HTTPS obligatoire

# Django : SECURE_CONTENT_TYPE_NOSNIFF, X_FRAME_OPTIONS = "DENY", django-csp   # activer cote code
# Tester : securityheaders.com -> viser une note A                             # verifier objectivement le resultat</pre>
<p>Le navigateur est instruit. Demain : durcir les conteneurs et l'infra.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta configuration d'en-têtes…",
  items: [
  { id: "secu-l15", title: "Le déploiement progressif de la CSP", level: 3,
    statement: "Écris le plan de déploiement d'une Content-Security-Policy sur la Ludothèque, sans rien casser : la CSP de départ, la phase report-only (collecter les violations via report-uri), comment analyser les rapports pour distinguer vrais risques et faux positifs, l'ajustement (sources légitimes), puis le passage en application. Explique aussi pourquoi bannir le JavaScript en ligne (inline) simplifie tout.",
    hints: [
      "report-only : le navigateur signale ce qu'il BLOQUERAIT, sans bloquer.",
      "report-uri /csp-report/ reçoit les violations en JSON à analyser.",
      "Le JS inline force 'unsafe-inline' (qui affaiblit la CSP) ; l'externaliser permet 'self' strict."
    ],
    atoi: { cmd: "curl -sI https://github.com | grep -i \"content-security-policy\"", expected: "L'en-tête Content-Security-Policy d'un vrai site montre une politique déclarant les sources autorisées (default-src, script-src 'self'…). Attendu : c'est le type d'en-tête que tu déploieras — d'abord en Content-Security-Policy-Report-Only pour observer les violations, puis en Content-Security-Policy pour bloquer, une fois les faux positifs traités." },
    checklist: ["Ta CSP de départ est-elle stricte (default-src 'self', object-src 'none', frame-ancestors 'none') ?", "Passes-tu par une phase report-only avec report-uri pour collecter les violations sans rien casser ?", "Sais-tu distinguer, dans les rapports, une source légitime oubliée d'un script suspect (XSS) ?", "Expliques-tu pourquoi bannir le JS inline permet de garder script-src 'self' strict (sans 'unsafe-inline') ?"],
    solution: "DÉPLOIEMENT PROGRESSIF DE LA CSP — La Ludothèque\n\nCSP DE DÉPART (stricte, à valider)\ndefault-src 'self'; script-src 'self'; style-src 'self';\nimg-src 'self' data:; object-src 'none'; frame-ancestors 'none'\n\nPHASE 1 — REPORT-ONLY (aucun blocage, on observe)\nContent-Security-Policy-Report-Only: <la politique>; report-uri /csp-report/\n# le navigateur SIGNALE chaque violation (script/style/image bloqués) sans\n# rien casser. On collecte plusieurs jours, sur tous les parcours.\n\nPHASE 2 — ANALYSER LES RAPPORTS\n# chaque violation reçue en JSON sur /csp-report/ :\n# - vraie source légitime oubliée (ex. une CDN de police) -> l'AJOUTER\n# - script inline maison -> l'EXTERNALISER (fichier .js servi en 'self')\n# - script inconnu/suspect -> potentiel XSS (l.3) à INVESTIGUER, pas à autoriser\n\nPHASE 3 — AJUSTER puis APPLIQUER\n# une fois les faux positifs traités, basculer l'en-tête :\nContent-Security-Policy: <la politique ajustée>\n# (retirer Report-Only) -> le navigateur BLOQUE désormais pour de bon.\n\nPOURQUOI BANNIR LE JS INLINE\n# <script>...<\/script> et onclick=\"...\" forcent 'unsafe-inline' dans script-src,\n# ce qui rouvre la porte au XSS que la CSP devait fermer. En externalisant\n# tout le JS (fichiers servis en 'self'), on garde script-src 'self' STRICT :\n# la CSP redevient un vrai rempart. C'est l'effort qui rend la CSP efficace.",
    note: "Le report-only est ce qui distingue une CSP qui tient d'une CSP désactivée en catastrophe le premier jour : on découvre ce qu'elle casserait AVANT de casser quoi que ce soit. Et l'insight clé — bannir le JS inline — n'est pas cosmétique : 'unsafe-inline' annule l'essentiel de la protection CSP contre le XSS. La CSP force donc une meilleure architecture front (JS externalisé), un bénéfice au-delà de la sécurité." }
  ]
};
</script>
