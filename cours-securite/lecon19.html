<script>
var DAY = {
  num: 19,
  title: "Réponse à incident : détecter, confiner, rétablir",
  subtitle: "Le plan écrit à froid sépare la gêne contenue de la catastrophe.",
  theory: `
<h3>1. Pourquoi un plan AVANT</h3>
<p>Un <strong>incident</strong> de sécurité est un événement où la protection a cédé : intrusion, fuite de données, service saboté. La <strong>réponse à incident</strong> est la procédure qui organise la réaction. En pleine crise, personne ne réfléchit bien : improviser au moment où la Ludothèque est compromise garantit les erreurs — oublier de confiner, détruire les preuves, prévenir trop tard. Le plan écrit à froid (calmement, avant tout incident) transforme la panique en <strong>exécution</strong>.</p>

<h3>2. Les cinq phases</h3>
<p>La réaction suit toujours le même ordre, en cinq étapes :</p>
<pre class="pseudo">1. DETECTER    : reconnaitre l'incident (logs, alerte, signalement d'un tiers)      # d'abord se rendre compte que ca arrive
2. CONFINER    : limiter la casse vite (couper l'acces, isoler) — avant de nettoyer  # arreter la propagation
3. ERADIQUER   : rotation des secrets, corriger la faille, retirer les portes derobees   # eliminer la cause et l'intrus
4. RETABLIR    : redeployer une version saine, restaurer depuis une sauvegarde propre    # remettre le service en etat sur
5. TIRER LES LEÇONS : post-mortem sans blame, actions correctives                    # apprendre pour que ca ne se reproduise pas</pre>
<p>Une <strong>porte dérobée</strong> (backdoor) est un accès caché qu'un attaquant laisse derrière lui pour revenir plus tard. Un <strong>post-mortem</strong> (« après la mort ») est l'analyse menée une fois l'incident clos.</p>

<h3>3. Confiner ≠ éradiquer</h3>
<p>Ne pas confondre les deux : <strong>confiner</strong>, c'est stopper l'hémorragie immédiatement ; <strong>éradiquer</strong>, c'est nettoyer en profondeur ensuite. On confine d'abord.</p>
<pre class="pseudo">L'ordre compte : on ARRETE L'HEMORRAGIE avant de nettoyer.
- couper l'acces compromis (desactiver le compte, isoler le service)   # fermer la porte utilisee par l'intrus
- INVALIDER toutes les sessions (leçon 6) -> ejecter l'intrus          # meme s'il avait vole un cookie, il est deconnecte
- PRESERVER les preuves (logs, snapshot) AVANT de tout effacer         # snapshot = copie figee de l'etat, utile a l'enquete
# nettoyer trop vite detruit les traces necessaires a comprendre l'ampleur.   # sans preuves, on ignore jusqu'ou c'est alle</pre>

<h3>4. Éradiquer et rétablir</h3>
<p><strong>Éradiquer</strong> = supprimer la cause (tourner les secrets, corriger la faille). <strong>Rétablir</strong> = revenir à un état sain, souvent par un <strong>rollback</strong> (retour à une version antérieure fiable) ou une restauration de sauvegarde.</p>
<pre class="pseudo">Eradiquer : ROTATION de tous les secrets potentiellement exposes (leçon 8),   # les anciens secrets sont grilles
            corriger la faille (patch, dependance, config), verifier qu'aucune  # boucher le trou d'origine
            porte derobee n'a ete laissee.                                     # s'assurer que l'intrus ne peut plus revenir
Retablir  : redeployer une version saine (rollback, CI/CD l.19), restaurer     # revenir a un code connu comme sur
            depuis une sauvegarde PROPRE (leçon 10) si donnees alterees,        # une sauvegarde anterieure a l'incident
            surveillance renforcee pendant la reprise.                         # rester tres vigilant apres le retour</pre>

<h3>5. Le post-mortem sans blâme</h3>
<p>Le <strong>post-mortem</strong> analyse l'incident après coup. « Sans blâme » (blameless) veut dire qu'on cherche la <strong>cause racine</strong> (la faille du système) plutôt qu'un coupable — car chercher un coupable pousse chacun à cacher ses erreurs.</p>
<pre class="pseudo">Chercher un COUPABLE -> chacun cache ses erreurs -> on n'apprend rien.   # la peur empeche de signaler les problemes
Chercher la CAUSE RACINE (systeme) -> on expose et on corrige.          # comprendre le "pourquoi" profond
- chronologie factuelle, cause racine, actions correctives datees        # un compte-rendu concret et suivi
- notifier si donnees personnelles touchees (RGPD, leçon 18 : 72 h)      # obligation legale de prevenir
Un incident bien gere rend l'organisation plus forte.                    # on en ressort plus solide qu'avant</pre>
<div class="warn">La plupart des dégâts d'un incident viennent de la <strong>réaction</strong>, pas de l'intrusion initiale : nettoyer avant d'avoir compris l'ampleur, oublier de tourner un secret, ne pas invalider les sessions (l'intrus reste connecté), prévenir trop tard. Le plan et l'ordre des phases évitent ces erreurs de panique.</div>
<div class="tip">Ce plan reprend et élève le rapport d'incident du cours CI/CD (leçon 18) au rang de discipline. Et il se teste : un exercice à froid (simuler un incident, dérouler le plan) transforme la procédure en réflexe — comme la restauration de sauvegarde du cours Docker.</div>`,
  exercises: [
    { type: "qcm", q: "Un plan de réponse à incident s'écrit…", opts: ["Pendant la crise", "AVANT (à froid)", "Après coup", "Jamais"], a: 1, exp: "La panique n'invente pas." },
    { type: "qcm", q: "Les cinq phases :", opts: ["Détecter, confiner, éradiquer, rétablir, tirer les leçons", "Coder, tester, déployer", "Chiffrer, hacher, signer", "aucune"], a: 0, exp: "L'ordre classique." },
    { type: "qcm", q: "Confiner ≠ éradiquer :", opts: ["Identiques", "On arrête l'hémorragie AVANT de nettoyer", "L'inverse", "Sans rapport"], a: 1, exp: "L'ordre compte." },
    { type: "qcm", q: "La première action de confinement :", opts: ["Tout nettoyer", "Couper l'accès compromis, isoler", "Redéployer", "Prévenir la presse"], a: 1, exp: "Limiter la casse." },
    { type: "qcm", q: "Pendant le confinement, on invalide…", opts: ["Rien", "Toutes les sessions (leçon 6) pour éjecter l'intrus", "Le CSS", "Les logs"], a: 1, exp: "L'intrus est déconnecté." },
    { type: "qcm", q: "Avant de nettoyer, il faut…", opts: ["Tout effacer", "Préserver les preuves (logs, snapshot)", "Redémarrer", "Prévenir les clients"], a: 1, exp: "Comprendre l'ampleur." },
    { type: "qcm", q: "Nettoyer trop vite…", opts: ["Aide", "Détruit les traces nécessaires à l'enquête", "Chiffre", "Accélère"], a: 1, exp: "Preuves perdues." },
    { type: "qcm", q: "Éradiquer inclut…", opts: ["Rien", "Rotation des secrets, correction de la faille, retrait des portes dérobées", "Un cookie", "Un log"], a: 1, exp: "Nettoyer vraiment." },
    { type: "qcm", q: "Rétablir consiste à…", opts: ["Ignorer", "Redéployer une version saine, restaurer depuis une sauvegarde propre", "Attendre", "Chiffrer"], a: 1, exp: "Rollback (CI/CD l.19)." },
    { type: "qcm", q: "Le post-mortem cherche…", opts: ["Un coupable", "La cause racine (système)", "À punir", "À oublier"], a: 1, exp: "Sans blâme." },
    { type: "qcm", q: "Chercher un coupable pousse à…", opts: ["Apprendre", "Cacher ses erreurs → on n'apprend rien", "Corriger", "S'améliorer"], a: 1, exp: "Contre-productif." },
    { type: "qcm", q: "Si des données personnelles sont touchées :", opts: ["Rien", "Notifier l'autorité < 72 h + les personnes si risque (RGPD, leçon 18)", "Chiffrer", "Attendre un an"], a: 1, exp: "Obligation légale." },
    { type: "vf", q: "La plupart des dégâts viennent de la réaction, pas de l'intrusion initiale.", a: true, exp: "D'où le plan et l'ordre." },
    { type: "qcm", q: "Ce plan élève quel élément du cours CI/CD ?", opts: ["Les tests", "Le rapport d'incident (leçon 18)", "Le build", "Le déploiement"], a: 1, exp: "Au rang de discipline." },
    { type: "vf", q: "Un exercice à froid transforme la procédure en réflexe.", a: true, exp: "Comme la restauration Docker." }
  ],
  final: {
    title: "Exercice final — Dérouler le plan",
    intro: `<p>La Ludothèque est compromise. On applique le plan, dans l'ordre.</p>`,
    questions: [
      { type: "qcm", q: "Phase 1 :", opts: ["Détecter et qualifier (logs, périmètre)", "tout redéployer", "prévenir la presse", "rien"], a: 0, exp: "Comprendre d'abord." },
      { type: "qcm", q: "Phase 2 :", opts: ["Confiner : couper l'accès, invalider les sessions, préserver les preuves", "nettoyer tout de suite", "attendre", "chiffrer"], a: 0, exp: "Arrêter l'hémorragie." },
      { type: "qcm", q: "Phase 3 :", opts: ["Éradiquer : rotation des secrets, corriger la faille", "ignorer", "un email", "un cache"], a: 0, exp: "Nettoyer vraiment." },
      { type: "qcm", q: "Phase 4-5 :", opts: ["Rétablir (version saine) + post-mortem sans blâme", "blâmer un dev", "oublier", "supprimer les logs"], a: 0, exp: "Reprise + apprentissage." },
      { type: "vf", q: "On confine avant d'éradiquer, on préserve les preuves avant de nettoyer.", a: true, exp: "L'ordre sauve." }
    ],
    solution: `<pre class="pseudo">1. DETECTER : logs (leçon 13), qualifier perimetre et donnees touchees   # se rendre compte + mesurer l'ampleur
2. CONFINER : couper l'acces, INVALIDER les sessions (l.6),              # stopper l'hemorragie
              preserver les preuves (logs, snapshot) AVANT de nettoyer   # garder les traces pour l'enquete
3. ERADIQUER: ROTATION des secrets (l.8), corriger la faille,            # eliminer la cause
              verifier l'absence de porte derobee                        # empecher tout retour de l'intrus
4. RETABLIR : redeployer une version saine (CI/CD l.19),                 # revenir a un code sur
              restaurer depuis une sauvegarde propre (l.10)              # si les donnees ont ete alterees
5. LEÇONS   : post-mortem sans blame, cause racine, actions datees       # apprendre sans punir
              notifier si donnees perso (RGPD, l.18 : 72 h)              # obligation legale</pre>
<p>La crise est maîtrisée. Demain : l'audit complet qui referme le modèle de menace.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton plan de réponse à incident…",
  items: [
  { id: "secu-l19", title: "Le plan de réponse à incident", level: 3,
    statement: "Rédige le plan de réponse à incident de la Ludothèque, prêt à exécuter : les 5 phases avec les actions concrètes pour CE projet (rotation des secrets, invalidation des sessions, rollback, restauration), les rôles (qui décide, qui exécute, qui communique), le seuil de notification RGPD, et la règle du post-mortem sans blâme. Termine par la mention de l'exercice à froid.",
    hints: [
      "Chaque phase : actions concrètes tirées des leçons (secrets l.8, sessions l.6, rollback CI/CD l.19).",
      "Rôles : un responsable d'incident décide, on ne délibère pas à cinq en pleine crise.",
      "Tester le plan à froid le rend exécutable — sinon c'est un document mort."
    ],
    solution: "PLAN DE RÉPONSE À INCIDENT — La Ludothèque (à exécuter, pas à improviser)\n\nRÔLES\n- Responsable d'incident : DÉCIDE (une seule voix, pas de délibération en crise)\n- Technique : EXÉCUTE (confinement, rotation, rétablissement)\n- Communication : informe direction, clients, autorité si besoin\n\n1. DÉTECTER (leçon 13)\n   Source : alerte logs, signalement tiers, comportement anormal.\n   Qualifier : incident réel ? périmètre ? données personnelles touchées ?\n\n2. CONFINER (vite, avant de nettoyer)\n   - couper l'accès compromis (désactiver comptes, isoler le service)\n   - INVALIDER toutes les sessions (leçon 6) -> éjecter l'intrus\n   - PRÉSERVER les preuves : snapshot, copie des logs, avant toute action\n\n3. ÉRADIQUER\n   - ROTATION de tous les secrets exposés (leçon 8) : base, clés, jetons\n   - corriger la faille (patch, dépendance l.12, config)\n   - vérifier l'absence de porte dérobée / compte ajouté\n\n4. RÉTABLIR\n   - redéployer une version saine (rollback, CI/CD l.19)\n   - restaurer depuis une sauvegarde PROPRE (leçon 10) si données altérées\n   - surveillance renforcée 48 h (leçon 13)\n\n5. TIRER LES LEÇONS (post-mortem SANS BLÂME)\n   - chronologie factuelle, cause RACINE (système, pas personne)\n   - actions correctives datées et assignées\n   - NOTIFICATION RGPD (leçon 18) : autorité < 72 h + personnes si risque élevé\n\nEXERCICE À FROID : ce plan est simulé une fois par an (incident fictif)\npour qu'il devienne un réflexe et non un PDF oublié.",
    note: "Deux détails distinguent un vrai plan d'un document décoratif : un responsable d'incident unique qui DÉCIDE (les catastrophes s'aggravent quand cinq personnes délibèrent en paniquant), et l'exercice à froid (un plan jamais répété ne sera pas suivi le jour J). Le post-mortem sans blâme n'est pas de la bienveillance naïve : c'est la seule culture où les gens signalent leurs erreurs assez tôt pour qu'on les corrige — chercher un coupable garantit qu'on cachera la prochaine faille." }
