<script>
var DAY = {
  num: 15,
  title: "Versions et releases : tags et changelog",
  subtitle: "Marquer les commits livrables et raconter ce qui change.",
  theory: `
<h3>1. main verte ≠ tout livrer</h3>
<p>Grâce à la semaine 2, chaque commit de <code>main</code> est vérifié. Mais on ne <strong>livre</strong> pas <em>chaque</em> commit : on choisit des <strong>points de livraison</strong> — les <strong>versions</strong>. Une <strong>release</strong> (« mise à disposition ») est la publication officielle d'une version. Le <strong>tag Git</strong> (l'étiquette posée sur un commit précis, vue leçon 1) marque ces points ; son push (envoi vers GitHub) déclenchera la livraison automatique (leçon 16).</p>

<h3>2. semver : le numéro qui parle</h3>
<p><strong>semver</strong> (pour <em>Semantic Versioning</em>, « versionnage sémantique ») est une convention pour numéroter les versions de façon parlante : trois nombres séparés par des points.</p>
<pre class="pseudo">MAJEURE.MINEURE.PATCH                                   # le format : trois nombres ; à gauche = le plus important
1.0.0 → 1.0.1   PATCH   : correction, rien ne change pour l'utilisateur   # on incrémente le 3e nombre : petit correctif invisible
1.0.1 → 1.1.0   MINEURE : fonctionnalité compatible (les réservations)    # on incrémente le 2e ; on remet le PATCH à 0 ; nouveauté sans casse
1.1.0 → 2.0.0   MAJEURE : rupture (API changée, migration destructive)    # on incrémente le 1er ; on remet les autres à 0 ; ça CASSE l'existant</pre>
<p>Une <strong>rupture</strong> (en anglais <em>breaking change</em>) est un changement qui casse ce qui marchait avant (par exemple une <strong>API</strong> — l'interface par laquelle d'autres programmes appellent le tien — dont on modifie le comportement).</p>

<h3>3. Le tag annoté</h3>
<pre class="pseudo">git tag -a v1.1.0 -m "Réservations + corrections"   # -a = tag ANNOTÉ ; -m = son message ; v1.1.0 = le nom du tag
git push origin v1.1.0        # ← ce push envoie le tag au distant et DÉCLENCHERA le CD (leçon 16)
# -a : tag ANNOTÉ (auteur, date, message) — un objet complet et daté,
# contrairement au tag LÉGER (un simple nom, sans métadonnées). Pour les versions : toujours -a.</pre>
<p>Un <strong>tag annoté</strong> mémorise qui l'a créé, quand, et pourquoi (message). Un <strong>tag léger</strong> n'est qu'un nom collé sur un commit. Pour des versions officielles, on prend toujours l'annoté.</p>

<h3>4. Le changelog depuis les commits normés</h3>
<p>Un <strong>changelog</strong> (« journal des changements ») est la liste, lisible par un humain, de ce qui a changé dans une version. Grâce aux messages normés (leçon 1), on peut le générer automatiquement.</p>
<pre class="pseudo">$ git log v1.0.0..HEAD --oneline        # "v1.0.0..HEAD" = les commits entre le tag v1.0.0 et maintenant (HEAD)
f7a8b9c feat: réservation d'un jeu indisponible      # feat → une nouveauté
c3d4e5f feat: notification de disponibilité          # feat → une nouveauté
a9b8c7d fix: message du stock épuisé                 # fix → une correction
21e0d9f chore: maj Django 5.1                        # chore → entretien : n'intéresse pas l'utilisateur

# CHANGELOG.md — v1.1.0 (généré en triant feat/fix)   # on RANGE les commits par type
## Nouveautés                                         # section alimentée par les "feat:"
- Réservation d'un jeu indisponible
- Notification quand le jeu redevient disponible
## Corrections                                        # section alimentée par les "fix:"
- Message clair quand le stock de location est épuisé</pre>
<p>La discipline de la leçon 1 paie : le changelog <strong>s'écrit tout seul</strong>. Les <code>chore:</code> et <code>refactor:</code> n'y figurent pas — l'utilisateur s'en moque.</p>

<h3>5. La release GitHub</h3>
<pre class="pseudo">GitHub → Releases → Draft new release → tag v1.1.0 + le changelog   # "Draft new release" = rédiger une nouvelle release ; on y attache le tag et les notes
# la page de release archive : le tag, les notes, et bientôt
# le lien vers l'image publiée                        # elle devient la "vitrine" officielle de la version</pre>
<div class="warn">Un tag de version est <strong>immuable</strong> (on ne le modifie jamais) — la même règle que pour les images Docker (et pour l'histoire partagée, leçon 7). Une erreur dans la v1.1.0 ? On publie la v1.1.1. On ne déplace <strong>jamais</strong> un tag poussé.</div>
<div class="tip">Qui décide du numéro ? Le <strong>contenu</strong> : relis <code>git log</code> depuis le dernier tag. Une seule rupture suffit à faire une majeure ; aucun feat = un patch. Le numéro est un résumé honnête, pas un choix marketing.</div>`,
  exercises: [
    { type: "qcm", q: "On livre…", opts: ["Chaque commit de main", "Des points choisis : les versions taguées", "Une fois par an", "Les branches"], a: 1, exp: "Main verte rend le choix libre." },
    { type: "qcm", q: "semver s'écrit…", opts: ["MAJEURE.MINEURE.PATCH", "ANNÉE.MOIS", "au hasard", "PATCH.MAJEURE"], a: 0, exp: "1.1.0, 2.0.0…" },
    { type: "qcm", q: "Une correction sans changement visible :", opts: ["MAJEURE", "PATCH (1.0.0 → 1.0.1)", "MINEURE", "rien"], a: 1, exp: "Le dernier chiffre." },
    { type: "qcm", q: "Les réservations (fonctionnalité compatible) :", opts: ["PATCH", "MINEURE (1.0.x → 1.1.0)", "MAJEURE", "v2"], a: 1, exp: "Nouveau, sans rupture." },
    { type: "qcm", q: "Une API changée de façon incompatible :", opts: ["PATCH", "MINEURE", "MAJEURE (→ 2.0.0)", "un chore"], a: 2, exp: "La rupture s'annonce." },
    { type: "qcm", q: "git tag -a crée…", opts: ["Un tag léger", "Un tag ANNOTÉ (auteur, date, message)", "Une branche", "Un commit"], a: 1, exp: "Toujours -a pour les versions." },
    { type: "qcm", q: "Le push du tag (git push origin v1.1.0)…", opts: ["Ne sert à rien", "Déclenchera le pipeline de livraison (leçon 16)", "Pousse main", "Supprime le tag"], a: 1, exp: "L'événement déclencheur du CD." },
    { type: "qcm", q: "Le changelog se génère depuis…", opts: ["La mémoire", "git log depuis le dernier tag, trié par type (feat/fix)", "Les emails", "Le YAML"], a: 1, exp: "La leçon 1 paie." },
    { type: "qcm", q: "chore: et refactor: dans le changelog utilisateur…", opts: ["En premier", "Absents : l'utilisateur s'en moque", "En rouge", "Obligatoires"], a: 1, exp: "Le changelog parle à l'utilisateur." },
    { type: "qcm", q: "git log v1.0.0..HEAD montre…", opts: ["Tout l'historique", "Les commits depuis le tag v1.0.0", "Le futur", "Les branches"], a: 1, exp: "La matière du changelog." },
    { type: "vf", q: "On peut déplacer un tag de version déjà poussé si on s'est trompé.", a: false, exp: "Immuable : on publie la version suivante." },
    { type: "qcm", q: "Une erreur dans la v1.1.0 :", opts: ["On déplace le tag", "On publie v1.1.1", "On supprime GitHub", "On attend"], a: 1, exp: "La règle des images Docker, identique." },
    { type: "qcm", q: "Le numéro de version est décidé par…", opts: ["Le marketing", "Le CONTENU depuis le dernier tag (git log)", "La date", "Le hasard"], a: 1, exp: "Un résumé honnête." },
    { type: "qcm", q: "La release GitHub archive…", opts: ["Le code seulement", "Tag + notes de version (+ lien vers l'image bientôt)", "Les secrets", "Les branches"], a: 1, exp: "La vitrine de la version." },
    { type: "vf", q: "Tag Git v1.1.0 et image 1.1.0 raconteront la même histoire.", a: true, exp: "L'alignement de la leçon 16." }
  ],
  final: {
    title: "Exercice final — La release v1.1.0",
    intro: `<p>On prépare la première version livrée par le pipeline.</p>`,
    questions: [
      { type: "qcm", q: "Le contenu depuis v1.0.0 : 2 feat + 1 fix compatibles. Le numéro :", opts: ["v1.1.0 (mineure)", "v2.0.0", "v1.0.1", "v1.0.0-bis"], a: 0, exp: "Fonctionnalités sans rupture." },
      { type: "qcm", q: "Le changelog liste :", opts: ["Les feat (Nouveautés) et fix (Corrections)", "tous les commits", "les chore", "rien"], a: 0, exp: "Trié pour l'utilisateur." },
      { type: "qcm", q: "Le tag :", opts: ["git tag -a v1.1.0 -m \"...\"", "git tag v1.1.0 (léger)", "git branch v1.1.0", "un zip"], a: 0, exp: "Annoté, toujours." },
      { type: "qcm", q: "Le déclencheur de la livraison sera :", opts: ["git push origin v1.1.0", "un email", "un clic en prod", "le vendredi"], a: 0, exp: "Le push du tag." },
      { type: "vf", q: "La release GitHub documente la version pour l'équipe et les utilisateurs.", a: true, exp: "La vitrine." }
    ],
    solution: `<pre class="pseudo">$ git log v1.0.0..HEAD --oneline       # on lit les commits depuis v1.0.0 : 2 feat + 1 fix → MINEURE

# CHANGELOG.md — v1.1.0                 # on rédige les notes de version
## Nouveautés                          # les feat:
- Réservation d'un jeu indisponible
- Notification quand le jeu redevient disponible
## Corrections                         # les fix:
- Message clair quand le stock de location est épuisé

$ git tag -a v1.1.0 -m "Réservations + corrections"   # on pose le tag annoté sur le commit courant
$ git push origin v1.1.0               # ← on pousse le tag : le CD s'en saisira demain</pre>
<p>La version est marquée et racontée. Demain : le tag déclenche build et push de l'image.</p>`
  }
};
</script>
