<script>
var DAY = {
  num: 4,
  title: "Le dépôt distant : push, pull, fetch",
  subtitle: "Le double en ligne : sauvegarde, collaboration — et bientôt, moteur du pipeline.",
  theory: `
<h3>1. Qu'est-ce qu'un dépôt distant, et pourquoi ?</h3>
<p>Jusqu'ici, ton dépôt Git vivait uniquement sur ton ordinateur : on l'appelle le dépôt <strong>local</strong>. Un <strong>dépôt distant</strong> (en anglais <em>remote</em>) est une <strong>copie du dépôt hébergée sur un serveur en ligne</strong> (par exemple sur GitHub, un site qui héberge des dépôts Git). Trois raisons de l'utiliser : la <strong>sauvegarde</strong> (le portable meurt, pas le projet), la <strong>collaboration</strong> (toute l'équipe partage un même point de vérité en ligne), et — décisif pour ce cours — c'est <strong>là que la CI s'exécutera</strong> : GitHub Actions (l'outil de CI/CD que l'on utilisera) vit directement dans le dépôt GitHub et réagit à chaque envoi de code.</p>

<h3>2. Relier le dépôt local au distant</h3>
<pre class="pseudo">git remote add origin git@github.com:toi/ludotheque.git
# remote add = ajoute un dépôt distant ; "origin" = son surnom (nom conventionnel du distant principal) ; puis son adresse
git remote -v                     # -v = verbose : liste les distants configurés et leurs adresses (vérification)
git push -u origin main           # push = ENVOYER ses commits vers le distant ; ici la branche main
                                  # -u (upstream) = mémorise le lien "ma main locale suit origin/main"
git push --tags                   # les tags (étiquettes de version, ex. v1.0.0) ne partent pas seuls : on les pousse à part</pre>
<p><strong>Push</strong> (« pousser ») veut dire <em>envoyer</em> tes commits locaux vers le dépôt distant. L'option <code>-u</code> (pour <em>upstream</em>, « en amont ») mémorise le lien entre ta branche locale et sa jumelle distante : ensuite, un simple <code>git push</code> ou <code>git pull</code> sans arguments suffit.</p>

<h3>3. fetch contre pull : regarder ou intégrer</h3>
<pre class="pseudo">git fetch                  # fetch = "aller chercher" : RAMÈNE les nouveautés du distant…
                           # …dans une référence locale nommée origin/main, SANS toucher à TON code
git log main..origin/main  # compare : "quels commits origin/main a-t-il que ma main n'a pas ?" → ce qu'ont fait les autres
git pull                   # pull = "tirer" : équivaut à fetch + merge → on INTÈGRE vraiment les changements dans ton code</pre>
<p><code>origin/main</code> est une <strong>référence de suivi</strong> : une copie locale qui mémorise « où en était <code>main</code> sur le distant la dernière fois que j'ai regardé ». Elle est mise à jour par <code>git fetch</code>. Séparer <code>fetch</code> (regarder) et <code>pull</code> (intégrer) évite les surprises : on inspecte d'abord, on fusionne ensuite.</p>

<h3>4. Pousser une branche de travail</h3>
<pre class="pseudo">git switch feature/reservations                 # on se place sur sa branche de fonctionnalité
git push -u origin feature/reservations         # on la pousse : elle apparaît sur le distant, visible par l'équipe
# une fois en ligne, elle est prête pour une "pull request" (demande de fusion, vue leçon 6)</pre>

<h3>5. Quand le push est refusé</h3>
<pre class="pseudo">! [rejected] main -> main (non-fast-forward)    # Git REFUSE : "non-fast-forward" = ta main locale est en RETARD
# quelqu'un a poussé avant toi : le distant contient des commits que tu n'as pas encore
git pull                   # on intègre d'abord ces commits (par merge ou rebase, leçon 7)
git push                   # maintenant que tu contiens tout, l'envoi est accepté</pre>
<div class="warn"><code>git push --force</code> écrase l'histoire distante — y compris les commits des autres. Sur une branche <strong>partagée</strong> (main !), c'est interdit ; sur ta branche de PR à toi, <code>--force-with-lease</code> (leçon 7) est la version civilisée (elle refuse d'écraser si quelqu'un d'autre a poussé entre-temps).</div>
<div class="tip">SSH ou HTTPS ? Ce sont deux façons de se connecter au serveur. <strong>SSH</strong> (avec une <em>clé</em>, un fichier secret prouvant ton identité) évite de retaper un <em>jeton</em> (mot de passe temporaire) à chaque fois et servira au déploiement (leçon 17). <code>ssh -T git@github.com</code> vérifie la connexion en une commande (<code>-T</code> = test, sans ouvrir de terminal distant).</div>`,
  exercises: [
    { type: "qcm", q: "Le dépôt distant sert à…", opts: ["Ralentir", "Sauvegarde + collaboration + exécution de la CI", "Compiler", "Remplacer les branches"], a: 1, exp: "Trois rôles, dont le pipeline." },
    { type: "qcm", q: "Relier le dépôt local à GitHub :", opts: ["git remote add origin <url>", "git link", "git connect", "git clone local"], a: 0, exp: "origin = le nom conventionnel." },
    { type: "qcm", q: "Le -u de git push -u origin main…", opts: ["Force", "Mémorise le lien local↔distant (upstream)", "Supprime", "Compresse"], a: 1, exp: "Ensuite push/pull nus." },
    { type: "qcm", q: "Les tags partent au distant par…", opts: ["git push --tags", "git push seul", "automatiquement", "git tag -push"], a: 0, exp: "Les tags ne partent pas seuls." },
    { type: "qcm", q: "git fetch…", opts: ["Intègre les nouveautés dans ton code", "Les ramène SANS toucher à ton code", "Pousse", "Supprime"], a: 1, exp: "Regarder d'abord." },
    { type: "qcm", q: "git pull équivaut à…", opts: ["fetch + merge", "push + merge", "fetch seul", "clone"], a: 0, exp: "On intègre." },
    { type: "qcm", q: "Voir ce que les autres ont poussé (après fetch) :", opts: ["git log main..origin/main", "git diff HEAD", "ls", "git remote -v"], a: 0, exp: "Les commits d'écart." },
    { type: "qcm", q: "origin/main est…", opts: ["Une branche modifiable à la main", "La copie locale de l'état du distant (mise à jour par fetch)", "Un tag", "Le serveur lui-même"], a: 1, exp: "Une référence de suivi." },
    { type: "qcm", q: "Pousser sa branche de travail sert à…", opts: ["Rien", "La rendre visible (sauvegarde + future PR)", "La fusionner", "La supprimer"], a: 1, exp: "Prête pour la leçon 6." },
    { type: "qcm", q: "! [rejected] (non-fast-forward) signifie…", opts: ["Le serveur est mort", "Ton local est en retard : quelqu'un a poussé avant", "Le mot de passe est faux", "La branche n'existe pas"], a: 1, exp: "pull, puis push." },
    { type: "qcm", q: "La réponse correcte au rejet :", opts: ["git push --force", "git pull puis git push", "supprimer le distant", "recloner"], a: 1, exp: "Intégrer, puis repartir." },
    { type: "vf", q: "git push --force sur main est acceptable en cas d'urgence.", a: false, exp: "On écraserait les commits des autres." },
    { type: "qcm", q: "Le --force « civilisé » sur SA branche de PR :", opts: ["--force-with-lease", "--force-hard", "--yolo", "aucun"], a: 0, exp: "Refuse si quelqu'un d'autre a poussé (leçon 7)." },
    { type: "qcm", q: "SSH plutôt que HTTPS car…", opts: ["C'est plus joli", "Clé sans ressaisie + servira au déploiement (leçon 17)", "HTTPS est interdit", "SSH est plus lent"], a: 1, exp: "Vérif : ssh -T git@github.com." },
    { type: "vf", q: "GitHub Actions exécutera les pipelines à partir de ce dépôt distant.", a: true, exp: "La scène de la semaine 2." }
  ],
  final: {
    title: "Exercice final — La Ludothèque en ligne",
    intro: `<p>Le dépôt du capstone rejoint GitHub, branches et tags compris.</p>`,
    questions: [
      { type: "qcm", q: "La liaison :", opts: ["git remote add origin git@github.com:toi/ludotheque.git", "git upload", "un zip", "git clone"], a: 0, exp: "Le remote nommé origin." },
      { type: "qcm", q: "Le premier envoi :", opts: ["git push -u origin main puis git push --tags", "git push --force", "git pull", "git fetch"], a: 0, exp: "main + v1.0.0." },
      { type: "qcm", q: "La branche de travail part par :", opts: ["git push -u origin feature/reservations", "git push main", "elle reste locale à jamais", "git merge"], a: 0, exp: "Visible pour la PR." },
      { type: "qcm", q: "Avant d'intégrer le travail des autres, regarder :", opts: ["git fetch + git log main..origin/main", "git pull direct toujours", "l'email", "rien"], a: 0, exp: "Regarder, puis intégrer." },
      { type: "vf", q: "Après -u, git push et git pull suffisent sans arguments.", a: true, exp: "Le tracking est mémorisé." }
    ],
    solution: `<pre class="pseudo">$ git remote add origin git@github.com:toi/ludotheque.git   # on déclare le distant "origin" et son adresse SSH
$ git push -u origin main                # premier envoi de main ; -u mémorise le lien
$ git push --tags                        # on envoie aussi les tags (v1.0.0)

$ git switch feature/reservations        # on passe sur la branche de travail
$ git push -u origin feature/reservations   # on la publie (visible par l'équipe, prête pour une PR)

# le cycle quotidien :
$ git fetch                              # on rapatrie les nouveautés du distant, sans toucher à notre code
$ git log main..origin/main              # on REGARDE ce que les autres ont poussé
$ git pull                               # on INTÈGRE ces changements chez nous</pre>
<p>Le dépôt vit en ligne. Demain : les règles du jeu — le workflow d'équipe.</p>`
  }
};
</script>

var ECRITURE = {
  placeholder: "Écris ton scénario distant…",
  items: [
  { id: "cicd-l4", title: "Le push rejeté", level: 2,
    statement: "Scénario à dérouler en commandes commentées : tu veux pousser ton commit sur main, le push est rejeté (non-fast-forward) car une collègue a poussé un fix pendant ta journée. Montre : le rejet, l'inspection de ce qu'elle a poussé (fetch + log), l'intégration (pull), la vérification (log --graph, tests) et le push final. Termine par la règle sur --force.",
    hints: [
      "git fetch d'abord : origin/main avance, ton main local non.",
      "git log main..origin/main --oneline : SES commits ; git log origin/main..main : les TIENS.",
      "Après le pull : les deux histoires réunies, tests, push."
    ],
    solution: "$ git push\n! [rejected]  main -> main (non-fast-forward)\n# Traduction : le main distant contient des commits que je n'ai pas.\n\n# 1. REGARDER sans rien toucher\n$ git fetch                      # rapatrie l'état du distant dans origin/main\n$ git log main..origin/main --oneline\n  d4e5f6a fix: fuseau horaire des dates de retour   # SON commit\n# (elle a corrigé un bug pendant que je travaillais)\n$ git log origin/main..main --oneline\n  b2c3d4e feat: export CSV des locations     # mon commit à moi\n\n# 2. INTÉGRER\n$ git pull                       # fetch + merge : nos deux histoires réunies\n\n# 3. VÉRIFIER\n$ git log --oneline --graph -5   # la jonction est là, rien n'est perdu\n$ python manage.py test          # son fix + ma feature cohabitent : vert\n\n# 4. REPARTIR\n$ git push                       # accepté : je contiens tout\n\n# Règle : le rejet n'est JAMAIS un problème à forcer.\n# git push --force sur main écraserait le fix de ma collègue —\n# le rejet est une PROTECTION, pull est la réponse.",
    note: "Le rejet non-fast-forward est le garde-fou le plus mal aimé de Git : il semble bloquer, il protège en réalité le travail des autres. Le trio fetch → log → pull transforme la friction en routine de dix secondes — et la leçon 5 (workflow) fera disparaître le cas : plus personne ne pousse main en direct." }
  ]
};
