  title: "Les workflows de branches (GitHub Flow)",
  subtitle: "Des gestes aux règles : comment l'équipe s'organise autour de main.",
  theory: `
<h3>1. Pourquoi des règles ?</h3>
<p>Tu sais maintenant créer des branches, fusionner (merge) et échanger avec le distant. Ce sont des <strong>gestes</strong>. Mais sans <strong>règles communes</strong>, chacun improvise : branches qui vivent des semaines, fusions sauvages, <code>main</code> cassé. Un <strong>workflow</strong> (mot anglais : « flux de travail », « façon de procéder ») est le <strong>contrat d'équipe</strong> qui décrit comment on utilise Git ensemble. Il rend le dépôt <strong>prévisible</strong> : tout le monde suit le même chemin.</p>

<h3>2. GitHub Flow : cinq règles</h3>
<p><strong>GitHub Flow</strong> est un workflow simple et populaire (popularisé par GitHub). Il tient en cinq règles :</p>
<pre class="pseudo">1. main est TOUJOURS déployable — personne n'y committe en direct    # "déployable" = installable en production à tout instant
2. tout changement part d'une branche courte et nommée              # jamais de modif directe : on isole dans une branche
   (feature/reservations, fix/stock-negatif, chore/maj-django)      # rappel des préfixes type/sujet (leçon 2)
3. push tôt, pull request tôt (visible = discutable)                # une "pull request" = demande de fusion ouverte à la discussion
4. merge UNIQUEMENT via PR : revue humaine + CI verte (leçons 6 et 14)  # PR = pull request ; "CI verte" = tests automatiques réussis
5. la branche est supprimée après le merge                          # une fois fusionnée, la branche ne sert plus : on la jette</pre>
<p>Une <strong>pull request</strong> (souvent abrégée <strong>PR</strong>, littéralement « demande de tirer/récupérer ») est une <strong>demande formelle de fusionner une branche dans une autre</strong>, ouverte sur GitHub : les collègues peuvent la relire, la commenter, et la machine (la CI) peut la tester avant qu'on l'accepte. Une <strong>revue</strong> (en anglais <em>review</em>) est la relecture du code par un autre humain.</p>

<h3>3. Le cycle complet d'un changement</h3>
<pre class="pseudo">git switch main && git pull            # 1. partir d'un main FRAIS : on se met sur main et on récupère les dernières nouveautés
git switch -c fix/message-stock        # 2. créer et basculer sur une branche dédiée au correctif
... code + test ...                    # 3. on modifie le code et on lance les tests localement
git commit -m "fix: message d'erreur du stock épuisé"   # 4. on enregistre le changement avec un message normé
git push -u origin fix/message-stock   # 5. on publie la branche sur le distant (-u mémorise le lien)
# → PR → revue → CI verte → merge (sur GitHub)          # 6. on ouvre la pull request ; après relecture et tests verts, on fusionne
git switch main && git pull            # 7. on revient sur main et on récupère le merge tout juste fait
git branch -d fix/message-stock        # 8. on nettoie : la branche fusionnée est supprimée</pre>

<h3>4. Pourquoi des branches COURTES ?</h3>
<p>Une branche qui vit une semaine <strong>diverge</strong> de <code>main</code> pendant une semaine : pendant ce temps, main avance de son côté, si bien que la fusion finale provoque des conflits massifs et une revue indigeste. Une branche de quelques heures se fusionne sans douleur. Un gros chantier ? On le <strong>découpe</strong> en étapes livrables (d'abord le squelette, puis le service, puis l'interface…), chacune sur sa propre petite branche.</p>

<h3>5. Et Git Flow ?</h3>
<pre class="pseudo">Git Flow : develop, release/*, hotfix/*, main...   # un autre workflow, avec PLUSIEURS branches permanentes
→ pensé pour des versions espacées (logiciel installé, mobile)   # adapté quand on livre rarement (ex. une app à installer)
GitHub Flow : main + branches courtes              # notre choix : une seule branche permanente + des branches jetables
→ pensé pour le déploiement continu — NOTRE cas (le CD de la semaine 3)   # adapté quand on livre souvent et automatiquement</pre>
<div class="warn">Le pire workflow est celui qui n'est pas <strong>écrit</strong> : « on fait comme d'habitude » signifie trois habitudes différentes pour trois développeurs. Une page dans le README suffit (le <strong>README</strong> est le fichier d'accueil qui explique le projet).</div>
<div class="tip">La règle 1 (« main toujours déployable ») est une promesse — les leçons 6 et 14 la transformeront en <strong>mécanisme</strong> : revue obligatoire + CI verte, verrouillées par la <em>protection de branche</em> (un réglage GitHub qui bloque techniquement tout merge non conforme).</div>`,
  exercises: [
    { type: "qcm", q: "Un workflow est…", opts: ["Un outil Git", "Le contrat d'équipe sur l'usage des branches", "Un serveur", "Une commande"], a: 1, exp: "Des règles, pas des gestes." },

    { type: "qcm", q: "Un gros chantier se gère…", opts: ["Sur une branche de deux mois", "Découpé en étapes livrables, une branche chacune", "Sans branches", "En vacances"], a: 1, exp: "Squelette → service → UI." },
    { type: "qcm", q: "Git Flow (develop, release/*, …) est pensé pour…", opts: ["Le déploiement continu", "Des versions espacées (logiciel installé)", "Les débutants", "GitHub uniquement"], a: 1, exp: "Un autre contexte." },
    { type: "qcm", q: "Notre choix pour la Ludothèque :", opts: ["GitHub Flow (main + branches courtes)", "Git Flow complet", "Aucun workflow", "Un par développeur"], a: 0, exp: "Adapté au CD de la semaine 3." },
    { type: "vf", q: "Un workflow non écrit fonctionne aussi bien.", a: false, exp: "Trois devs, trois « habitudes »." },
    { type: "qcm", q: "Le workflow s'écrit…", opts: ["Nulle part", "Dans le README (une page suffit)", "Dans un email perdu", "Sur un post-it"], a: 1, exp: "Visible des nouveaux arrivants." },
    { type: "qcm", q: "La règle 4 (merge via PR) sera verrouillée par…", opts: ["La bonne volonté", "La protection de branche (leçon 14)", "Un mot de passe", "Le chef"], a: 1, exp: "Promesse → mécanisme." },
    { type: "qcm", q: "fix/stock-negatif est…", opts: ["Un mauvais nom", "Un nom conforme (type/sujet)", "Un tag", "Un remote"], a: 1, exp: "La convention de la leçon 2." },
    { type: "vf", q: "GitHub Flow prépare directement le déploiement continu de la semaine 3.", a: true, exp: "main vert = livrable à tout instant." }
  ],
  final: {
    title: "Exercice final — Le cycle complet",
    intro: `<p>Un fix traverse tout le workflow, du départ au nettoyage.</p>`,
    questions: [
      { type: "qcm", q: "Étape 1 :", opts: ["git switch main && git pull", "brancher depuis n'importe où", "coder direct sur main", "git push"], a: 0, exp: "Partir frais." },
      { type: "qcm", q: "Étape 2 :", opts: ["git switch -c fix/message-stock", "git branch main2", "git tag", "git merge"], a: 0, exp: "La branche du chantier." },
      { type: "qcm", q: "Étape 4 (après commit) :", opts: ["git push -u origin fix/message-stock", "git push main", "rien", "merge local dans main"], a: 0, exp: "Visible → PR." },
      { type: "qcm", q: "Le merge se fait :", opts: ["Sur GitHub, via la PR (revue + CI)", "en local sur main", "par email", "au hasard"], a: 0, exp: "La règle 4." },
      { type: "vf", q: "Après le merge : switch main, pull, branch -d.", a: true, exp: "Récupérer et nettoyer." }
    ],
    solution: `<pre class="pseudo">$ git switch main && git pull              # 1. partir frais : sur main, avec les dernières nouveautés
$ git switch -c fix/message-stock          # 2. créer la branche du correctif et basculer dessus
$ ... code + test ...                      # 3. on code et on teste localement

$ git switch main && git pull              # 7. on récupère le merge sur main
$ git branch -d fix/message-stock          # 8. on nettoie la branche fusionnée</pre>
<p>Le cycle est un réflexe. Demain : l'étape 4 en détail — la pull request.</p>`
  }
