<script>
var DAY = {
  num: 14,
  title: "Protection de branche : merge bloqué si rouge",
  subtitle: "Les règles deviennent des mécanismes — pour tout le monde, même les admins.",
  theory: `
<h3>1. Le maillon manquant</h3>
<p>Le pipeline vérifie tout (leçons 9-12)… mais rien n'<strong>oblige</strong> à l'écouter : une personne pressée peut merger une PR rouge (dont la CI a échoué), une personne distraite peut pousser directement sur <code>main</code>. La <strong>protection de branche</strong> est un réglage GitHub qui transforme les règles d'équipe en <strong>mécanismes</strong> : ce qui était « il ne faut pas » devient « on ne peut pas ».</p>

<h3>2. La configuration</h3>
<pre class="pseudo">Settings → Branches → Branch protection rules → main :        # le chemin GitHub pour protéger la branche main
✔ Require a pull request before merging                       # "exiger une PR avant tout merge" : plus de modif directe
    ✔ Require approvals : 1                                    # exiger au moins 1 approbation (revue humaine, leçon 6)
✔ Require status checks to pass before merging                # exiger que les vérifications automatiques soient vertes
    ✔ tests   ✔ qualite   ✔ image        ← les jobs du pipeline   # les "status checks" = les résultats des jobs de CI
    ✔ Require branches to be up to date before merging        # exiger que la branche soit À JOUR avec main avant le merge
✔ Do not allow bypassing the above settings   ← admins compris   # interdire de CONTOURNER ces règles, même aux administrateurs
(le push direct sur main devient impossible pour tous)        # conséquence : la seule porte d'entrée est la PR</pre>
<p>Un <strong>status check</strong> (« contrôle d'état ») est le résultat vert/rouge d'un job de CI, rattaché à la PR. Une <strong>approval</strong> (« approbation ») est le feu vert d'un relecteur. <strong>Up to date</strong> (« à jour ») signifie que la branche contient les derniers commits de <code>main</code>. <strong>Bypass</strong> veut dire « contourner » : le désactiver ferme la porte dérobée.</p>

<h3>3. Ce que ça donne sur une PR</h3>
<pre class="pseudo">CI rouge          → bouton merge GRIS, la raison affichée            # tant qu'un check échoue, on ne peut pas merger
pas d'approbation → merge bloqué                                     # sans revue approuvée, blocage
branche en retard → « Update branch » demandé (on reteste sur main à jour)   # il faut remettre la branche à jour puis re-tester
tout vert + revue → merge en un clic                                 # le chemin normal reste fluide et rapide</pre>

<h3>4. « Up to date » : le trou de la course</h3>
<p>Sans cette option : ta PR est verte <em>contre le main d'hier</em>, une autre PR entre entre-temps, et la combinaison des deux casse — <code>main</code> devient rouge alors que <strong>chaque PR était verte séparément</strong>. C'est une « course » (deux changements qui se croisent). « Require up to date » force à <strong>retester sur le main final</strong> avant de fusionner, ce qui referme ce trou.</p>

<h3>5. Pourquoi inclure les admins ?</h3>
<p>« Juste cette fois, c'est urgent » est exactement le commit qui casse la prod un vendredi soir. Une règle contournable n'est pas une règle : l'urgence <strong>vraie</strong> passe par une PR expresse (la CI prend 5 minutes) — pas par un passe-droit.</p>
<div class="warn">Les <strong>noms des status checks</strong> requis doivent correspondre aux noms des jobs (<code>tests</code>, <code>qualite</code>, <code>image</code>). Renommer un job dans le YAML sans mettre à jour la protection = un check requis qui n'existe plus… et plus aucun merge possible. Les deux se maintiennent ensemble.</div>
<div class="tip">Avec cette leçon, la promesse de la leçon 5 (« main toujours déployable ») devient une <strong>propriété du système</strong> : chaque commit de main a, mécaniquement, passé tests + qualité + build + revue. La semaine 3 peut livrer main les yeux fermés.</div>`,
  exercises: [
    { type: "qcm", q: "Sans protection, un pressé peut…", opts: ["Rien", "Merger une PR rouge ou pousser main en direct", "Supprimer GitHub", "Changer les tests"], a: 1, exp: "Le maillon manquant." },
    { type: "qcm", q: "La protection de branche transforme…", opts: ["Le code", "Les règles d'équipe en mécanismes appliqués", "Les tests", "Les images"], a: 1, exp: "Promesse → propriété." },
    { type: "qcm", q: "Elle se configure…", opts: ["Dans le YAML", "Settings → Branches → protection rules", "Dans le Dockerfile", "En local"], a: 1, exp: "Côté GitHub." },
    { type: "qcm", q: "Les status checks requis sont…", opts: ["tests, qualite, image (les jobs du pipeline)", "au hasard", "un seul", "les commits"], a: 0, exp: "Le contrat de la leçon 8, verrouillé." },
    { type: "qcm", q: "Une PR avec CI rouge :", opts: ["Merge possible en insistant", "Bouton merge gris, raison affichée", "Supprimée", "Re-testée à l'infini"], a: 1, exp: "Le blocage visible." },
    { type: "qcm", q: "Require approvals : 1 exige…", opts: ["Un commentaire", "Une revue approuvée avant le merge", "Un tag", "Un admin"], a: 1, exp: "La leçon 6, mécanisée." },
    { type: "qcm", q: "« Require branches to be up to date » évite…", opts: ["Les conflits Git", "Deux PR vertes séparément qui cassent combinées", "Les secrets", "Les forks"], a: 1, exp: "On reteste sur le main final." },
    { type: "qcm", q: "Le scénario de la course :", opts: ["Impossible", "PR verte contre le main d'HIER + autre PR entrée entre-temps", "Un bug GitHub", "Un test lent"], a: 1, exp: "main rouge, chaque PR verte." },
    { type: "qcm", q: "Inclure les admins dans la protection car…", opts: ["Ils sont nuls", "Une règle contournable n'est pas une règle", "GitHub l'impose", "C'est gratuit"], a: 1, exp: "« Juste cette fois » = le bug du vendredi." },
    { type: "qcm", q: "L'urgence vraie passe par…", opts: ["Un passe-droit", "Une PR expresse (la CI prend 5 min)", "Un push forcé", "Un appel au chef"], a: 1, exp: "Le système reste intègre." },
    { type: "vf", q: "Après cette config, le push direct sur main est impossible pour tous.", a: true, exp: "PR obligatoire." },
    { type: "qcm", q: "Renommer un job sans mettre à jour la protection cause…", opts: ["Rien", "Un check requis introuvable : plus aucun merge", "Un merge auto", "Une erreur YAML"], a: 1, exp: "Les deux se maintiennent ensemble." },
    { type: "qcm", q: "« Main toujours déployable » est désormais…", opts: ["Un vœu", "Une propriété mécanique du système", "Un slogan", "Une option"], a: 1, exp: "Chaque commit de main a tout passé." },
    { type: "qcm", q: "La conséquence pour la semaine 3 :", opts: ["Rien", "On peut livrer main les yeux fermés", "Plus de tests", "Plus de tags"], a: 1, exp: "Le CD s'appuie sur ce verrou." },
    { type: "vf", q: "La protection remplace la revue humaine.", a: false, exp: "Elle l'EXIGE — elle ne la remplace pas." }
  ],
  final: {
    title: "Exercice final — Le verrou final de la CI",
    intro: `<p>On verrouille main — et on vérifie que le verrou tient.</p>`,
    questions: [
      { type: "qcm", q: "Les quatre cases essentielles :", opts: ["PR requise + 1 approbation + status checks + up to date", "juste la PR", "juste les checks", "aucune"], a: 0, exp: "Le verrou complet." },
      { type: "qcm", q: "Les checks cochés :", opts: ["tests, qualite, image", "deploy", "aucun", "lint seul"], a: 0, exp: "Les jobs du contrat." },
      { type: "qcm", q: "Les admins :", opts: ["Inclus dans la protection (pas de bypass)", "exemptés", "supprimés", "notifiés seulement"], a: 0, exp: "Une règle pour tous." },
      { type: "qcm", q: "Test du verrou — push direct sur main :", opts: ["Refusé", "accepté", "accepté avec warning", "silencieux"], a: 0, exp: "La preuve que ça tient." },
      { type: "vf", q: "Une PR verte, approuvée et à jour se merge en un clic.", a: true, exp: "Le chemin nominal reste fluide." }
    ],
    solution: `<pre class="pseudo">Settings → Branches → main :                                  # on ouvre la protection de la branche main
✔ Require a pull request (1 approval)                         # PR obligatoire + 1 approbation (revue)
✔ Require status checks : tests, qualite, image (+ up to date)   # les 3 jobs doivent être verts, sur une branche à jour
✔ No bypass (admins compris)                                  # personne ne contourne, admins inclus

# le test du verrou :
$ git push origin main                                        # on tente de pousser directement sur main…
remote: error: GH006: Protected branch update failed          # …GitHub REFUSE : la branche est protégée
# ✔ le verrou tient — la seule porte est la PR verte et relue</pre>
<p>La CI est complète et inviolable. Lundi : la semaine du CD — versions, registre, déploiement.</p>`
  }
};
</script>
