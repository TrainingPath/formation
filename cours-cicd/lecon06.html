  title: "Pull requests et revue de code",
  subtitle: "Le lieu où le code se lit à quatre yeux avant d'entrer dans main.",
  theory: `
<h3>1. Qu'est-ce qu'une PR ?</h3>
<p>Rappel : une <strong>pull request</strong> (PR) est une <strong>demande de fusionner une branche dans main</strong>. Elle dit : « ma branche est prête, je demande son intégration ». C'est une page en ligne (sur GitHub) qui montre le <strong>diff</strong> (l'ensemble des différences apportées : les lignes ajoutées et supprimées), porte une <strong>conversation</strong> (les commentaires des relecteurs), et affiche les <strong>statuts</strong> (l'état de la revue et de la CI, en vert ou rouge). Le merge (la fusion) se fait <strong>là</strong>, sur la page de la PR — jamais en local.</p>

<h3>2. La description qui fait gagner du temps</h3>
<pre class="pseudo">## Quoi                                              # section 1 : CE QUE fait le changement
Message précis quand le stock de location est nul.   # une phrase claire, factuelle
## Pourquoi                                          # section 2 : la RAISON du changement
Ticket #42 : les clients croyaient à un bug.         # on renvoie au ticket qui a motivé le travail
## Comment tester                                    # section 3 : les ÉTAPES pour vérifier soi-même
1. docker compose up -d ; jeu avec stock_location=0  # on prépare l'environnement et un cas de test
2. cliquer « Louer » → message précis, stock inchangé.  # le résultat attendu, vérifiable à l'œil</pre>
<p>Trois questions : <strong>quoi, pourquoi, comment vérifier</strong>. Le relecteur (la personne qui relit) ne devine pas — il vérifie.</p>

<h3>3. Relire : la méthode</h3>
<pre class="pseudo">On cherche (dans l'ordre d'importance) :
1. la CORRECTION : le code fait-il ce que la description annonce ?   # le plus important : est-ce juste ?
2. les RÈGLES du projet : métier dans les services ? tests présents ?  # respecte-t-il l'architecture convenue ?
3. les cas limites : stock 0, concurrence, données vides            # "cas limite" = situation extrême/inhabituelle ; "concurrence" = deux actions simultanées
4. la lisibilité : noms, découpage                                  # le code se comprend-il facilement ?
(le STYLE, lui, appartient au linter — leçon 11 : on n'en débat pas en revue)   # linter = outil qui vérifie le style automatiquement</pre>

<h3>4. Commenter : sur le code, jamais la personne</h3>
<pre class="pseudo">✘ « c'est faux »            ✘ « tu as encore oublié les tests »   # ✘ = à éviter : jugements vagues, visant la personne
✔ « ce message est construit dans la vue ; notre règle le met côté   # ✔ = à faire : on cite la RÈGLE et on propose
   service (exception) — peux-tu le déplacer ? »                    # une demande précise et actionnable
✔ « que se passe-t-il si deux clients rendent en même temps ?       # on pointe un cas limite par une question ouverte
   un test de concurrence rassurerait »                            # on suggère une action concrète (ajouter un test)</pre>

<h3>5. Le cycle de la revue</h3>
<pre class="pseudo">auteur ouvre la PR → relecteur commente → auteur pousse des commits   # l'auteur répond en committant sur la MÊME branche
(la PR se met à jour SEULE) → relecteur approuve → merge → branche supprimée   # pousser met à jour la PR automatiquement</pre>
<div class="warn">Une PR de 2 000 lignes ne sera pas relue — elle sera <em>survolée</em>. La taille cible : <strong>relisible en 10 minutes</strong> (~200-400 lignes). Trop gros ? Découper (leçon 5) — c'est l'auteur qui doit ce travail au relecteur, pas l'inverse.</div>
<div class="tip">La revue est un transfert de connaissance dans les deux sens : le relecteur découvre le code de demain, l'auteur reçoit un regard neuf. Une PR peut être ouverte en <strong>brouillon</strong> (<em>draft</em>) pour discuter d'un travail encore en cours. Les équipes qui relisent vite (« &lt; 24 h ») gardent des branches courtes — les deux règles se tiennent.</div>`,
  exercises: [
    { type: "qcm", q: "Une pull request demande…", opts: ["Un rollback", "L'intégration d'une branche dans main, avec diff et conversation", "Un déploiement", "Un tag"], a: 1, exp: "Le sas d'entrée de main." },
    { type: "qcm", q: "Le merge d'une branche d'équipe se fait…", opts: ["En local", "Sur la PR (GitHub)", "Par un push direct", "En prod"], a: 1, exp: "Là où revue et CI sont visibles." },
    { type: "qcm", q: "La description d'une PR répond à…", opts: ["Quoi, pourquoi, comment tester", "Qui, quand, combien", "La liste des fichiers", "Le nom du relecteur"], a: 0, exp: "Le relecteur vérifie au lieu de deviner." },
    { type: "qcm", q: "La première chose que cherche un relecteur :", opts: ["Les fautes de frappe", "La correction : le code fait-il ce qu'il annonce ?", "Le style", "La longueur"], a: 1, exp: "L'essentiel d'abord." },
    { type: "qcm", q: "« Le métier dans les services » relève de…", opts: ["Du goût", "Des règles du projet, vérifiées en revue", "Du linter", "De la prod"], a: 1, exp: "L'architecture du capstone se défend ici." },
    { type: "qcm", q: "Les débats de style (espaces, quotes) appartiennent…", opts: ["À la revue", "Au linter/formateur (leçon 11)", "Au relecteur", "À la CI"], a: 1, exp: "La machine tranche, la revue pense." },
    { type: "qcm", q: "Un bon commentaire de revue…", opts: ["« c'est faux »", "Porte sur le code, propose, explique la règle", "Note la personne", "Impose sans expliquer"], a: 1, exp: "Jamais la personne." },
    { type: "qcm", q: "L'auteur répond aux demandes en…", opts: ["Ouvrant une autre PR", "Poussant des commits sur la même branche (la PR se met à jour seule)", "Fermant la PR", "Un merge local"], a: 1, exp: "Le cycle naturel." },
    { type: "qcm", q: "Une PR de 2 000 lignes sera…", opts: ["Bien relue", "Survolée : trop grosse pour une vraie revue", "Refusée par Git", "Fusionnée sans revue"], a: 1, exp: "Taille cible : 10 min de lecture." },
    { type: "qcm", q: "Qui doit le travail de découpage d'une PR trop grosse ?", opts: ["Le relecteur", "L'auteur", "Personne", "La CI"], a: 1, exp: "Respect du temps du relecteur." },
    { type: "qcm", q: "« Que se passe-t-il si deux clients rendent en même temps ? » est…", opts: ["Hors sujet", "Une revue des cas limites (concurrence)", "Du style", "Une question inutile"], a: 1, exp: "Le capstone (leçon 12) a appris à y penser." },
    { type: "vf", q: "La revue sert aussi au transfert de connaissance dans l'équipe.", a: true, exp: "Deux personnes connaissent désormais ce code." },
    { type: "qcm", q: "Une PR en brouillon (draft) sert à…", opts: ["Cacher le code", "Montrer un travail en cours pour en discuter tôt", "Bloquer main", "Merger plus vite"], a: 1, exp: "Push tôt, PR tôt (leçon 5)." },
    { type: "qcm", q: "Après l'approbation :", opts: ["Merge + suppression de la branche", "On rouvre une PR", "push --force", "On tag la version"], a: 0, exp: "La fin du cycle." },
    { type: "vf", q: "Relire vite (< 24 h) aide à garder des branches courtes.", a: true, exp: "Les deux règles se renforcent." }
  ],
  final: {
    title: "Exercice final — La PR exemplaire",
    intro: `<p>On ouvre, relit et conclut la PR du fix de message.</p>`,
    questions: [
      { type: "qcm", q: "Le titre :", opts: ["fix: message d'erreur du stock épuisé", "changements", "update", "PR"], a: 0, exp: "Normé comme un commit." },
      { type: "qcm", q: "La description contient :", opts: ["Quoi / Pourquoi (#42) / Comment tester", "le diff copié-collé", "le nom de l'auteur", "un GIF seulement"], a: 0, exp: "Les trois questions." },
      { type: "qcm", q: "Le relecteur repère le message construit dans la vue :", opts: ["Il demande le déplacement côté service, en citant la règle", "il dit « c'est faux »", "il merge quand même", "il ferme la PR"], a: 0, exp: "Code, règle, proposition." },
      { type: "qcm", q: "L'auteur corrige :", opts: ["Commit poussé sur la branche → PR à jour", "nouvelle PR", "merge local", "push --force"], a: 0, exp: "Le cycle continue." },
      { type: "vf", q: "Approbation → merge → branche supprimée.", a: true, exp: "Et main reste déployable." }
    ],
    solution: `<pre class="pseudo">PR « fix: message d'erreur du stock épuisé »          # titre normé, comme un message de commit
## Quoi   : message précis à stock nul                # la description répond aux trois questions
## Pourquoi : #42 — les clients croyaient à un bug
## Tester : compose up, stock=0, « Louer » → message, stock inchangé

Relecteur : « message construit dans la vue ; notre règle le met côté   # commentaire ciblé sur le code + la règle
service — peux-tu le déplacer ? »
Auteur    : commit "refactor: message porté par StockInsuffisant" → poussé   # l'auteur corrige, la PR se met à jour seule
Relecteur : ✔ Approve → merge → branche supprimée      # approbation, fusion, nettoyage : fin du cycle</pre>
<p>La revue a protégé l'architecture. Demain : soigner l'histoire avant de la partager.</p>`
  }
};
</script>
