<script>
var DAY = {
  num: 3,
  title: "Fusionner : merge, fast-forward et conflits",
  subtitle: "Ramener le travail dans main — et trancher quand deux vérités se contredisent.",
  theory: `
<h3>0. Fusionner : de quoi parle-t-on ?</h3>
<p>Rappel : une <strong>branche</strong> est une ligne d'histoire indépendante. Quand un chantier est terminé, il faut <strong>ramener</strong> son travail dans <code>main</code> (la branche de référence). Cette opération s'appelle une <strong>fusion</strong> (en anglais <em>merge</em>) : elle réunit les commits d'une branche dans une autre. La commande est <code>git merge</code>. Selon la situation, la fusion se passe de trois façons : sans histoire (fast-forward), avec un commit de jonction (merge commit), ou avec un désaccord à trancher (conflit).</p>

<h3>1. La fusion simple : le fast-forward</h3>
<pre class="pseudo">$ git switch main                    # on se place sur la branche qui va RECEVOIR le travail
$ git merge feature/reservations     # on demande de fusionner la branche feature/reservations dans main
Fast-forward                         # message de Git : "avance rapide"
# main n'avait PAS avancé depuis la création de la branche :
# Git se contente de faire GLISSER l'étiquette main jusqu'au dernier commit de la branche.
# Résultat : AUCUN nouveau commit n'est créé, l'histoire reste une ligne droite.</pre>
<p><strong>Fast-forward</strong> (littéralement « avance rapide ») : comme <code>main</code> n'a rien de nouveau à préserver, Git déplace simplement son étiquette en avant. C'est le cas le plus propre.</p>

<h3>2. Le merge commit (commit de fusion)</h3>
<pre class="pseudo">$ git merge feature/tarifs           # on fusionne une autre branche dans main
Merge made by the 'ort' strategy.    # "fusion réalisée par la stratégie ort" (l'algorithme interne de Git)
# main AVAIT avancé de son côté pendant que la branche avançait du sien :
# Git crée un COMMIT DE FUSION spécial, qui a DEUX parents (deux commits d'origine),
# et qui réunit les deux histoires en une seule.
git log --oneline --graph            # --graph dessine la jonction : on voit les deux lignes se rejoindre</pre>
<p>Un <strong>parent</strong> est le commit qui précède un autre dans l'histoire. Un commit normal a un seul parent ; un <strong>merge commit</strong> en a <strong>deux</strong>, car il noue ensemble deux fils d'histoire.</p>

<h3>3. Le conflit : quand Git refuse de choisir à ta place</h3>
<pre class="pseudo">$ git merge feature/tarifs           # on tente la fusion
CONFLICT (content): Merge conflict in catalogue/services.py   # CONFLIT de contenu dans ce fichier
$ git status                         # both modified: catalogue/services.py = "modifié des deux côtés"

&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD                                          # début du bloc : à partir d'ici, MA version (HEAD = ma branche courante)
    return base + (nb_jours - 7) * Decimal("0.50")     # ma ligne : majoration de 0,50
=======                                                # séparateur entre les deux versions
    return base + (nb_jours - 7) * Decimal("0.60")     # la ligne de l'autre branche : majoration de 0,60
&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/tarifs                                # fin du bloc : au-dessus, la version de la branche fusionnée</pre>
<p>Deux branches ont modifié <strong>la même ligne</strong> : Git ne peut pas deviner laquelle garder, alors il insère des <strong>marqueurs</strong> (<code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code>, <code>=======</code>, <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code>) qui encadrent les deux versions et attend ta décision. Ce n'est pas une erreur — c'est une <strong>question</strong>.</p>

<h3>4. Résoudre un conflit</h3>
<pre class="pseudo">1. Ouvrir le fichier, comprendre les DEUX intentions          # POURQUOI 0,50 ? POURQUOI 0,60 ?
2. Écrire la version finale (l'une, l'autre, ou une combinaison)  # tu tranches en connaissance de cause
3. Supprimer les marqueurs &lt;&lt;&lt;&lt;&lt;&lt;&lt; ======= &gt;&gt;&gt;&gt;&gt;&gt;&gt;         # sinon ils resteraient dans le code (texte parasite)
4. git add catalogue/services.py     # ajouter le fichier = déclarer à Git "ce conflit est résolu"
5. git commit                        # crée le commit de fusion qui conclut l'opération
# Panique ? git merge --abort : annule TOUT le merge et revient à l'état d'avant, sans casse.</pre>

<h3>5. Prévenir plutôt que guérir</h3>
<pre class="pseudo">- branches COURTES (moins de divergence)      # moins une branche vit, moins elle risque de heurter main
- git pull régulier (rester proche de main)    # git pull = récupérer et fusionner les changements distants (leçon 4)
- fichiers bien découpés (deux chantiers ≠ mêmes lignes)   # si chacun touche SON fichier, pas de collision</pre>
<div class="warn">Résoudre un conflit est un acte <strong>éditorial</strong>, pas mécanique : il faut comprendre les deux intentions (pourquoi 0,50 ? pourquoi 0,60 ?) avant de trancher. « Prendre la version la plus récente » sans réfléchir écrase peut-être une correction critique.</div>
<div class="tip">Après une résolution : lancer les <strong>tests</strong> (des programmes qui vérifient automatiquement que le code fait ce qu'on attend). Le fichier fusionné peut être syntaxiquement parfait et métier-faux — les tests du capstone sont ton filet, et la CI (semaine 2) les lancera d'office.</div>`,
  exercises: [
    { type: "qcm", q: "Un fast-forward se produit quand…", opts: ["main a avancé", "main n'a pas avancé : l'étiquette avance simplement", "Il y a conflit", "On force"], a: 1, exp: "Pas de nouveau commit." },
    { type: "qcm", q: "Un merge commit a…", opts: ["Zéro parent", "Deux parents (il réunit deux histoires)", "Un parent", "Trois parents"], a: 1, exp: "La jonction dans le graphe." },
    { type: "qcm", q: "Un conflit survient quand…", opts: ["Deux branches modifient la même ligne (ou zone)", "On committe trop", "Le réseau coupe", "Les tests échouent"], a: 0, exp: "Deux vérités contradictoires." },
    { type: "vf", q: "Un conflit est une erreur de Git.", a: false, exp: "C'est une question posée au développeur." },
    { type: "qcm", q: "Entre <<<<<<< HEAD et ======= se trouve…", opts: ["La version de la branche fusionnée", "La version de MA branche courante", "Le résultat final", "Un commentaire"], a: 1, exp: "HEAD = où je suis." },
    { type: "qcm", q: "Entre ======= et >>>>>>> se trouve…", opts: ["Ma version", "La version de la branche qu'on fusionne", "La version finale", "L'historique"], a: 1, exp: "L'autre vérité." },
    { type: "qcm", q: "L'ordre de résolution :", opts: ["add → commit → éditer", "Comprendre → écrire la version finale → retirer les marqueurs → add → commit", "supprimer le fichier", "merge --force"], a: 1, exp: "Éditorial d'abord." },
    { type: "qcm", q: "git add sur un fichier en conflit signifie…", opts: ["Le conflit est déclaré résolu", "Le fichier est supprimé", "Le merge est annulé", "Le fichier est ignoré"], a: 0, exp: "Puis git commit conclut." },
    { type: "qcm", q: "Annuler un merge en cours :", opts: ["git merge --abort", "rm -rf .git", "git reset --hard sans réfléchir", "fermer le terminal"], a: 0, exp: "Retour propre à l'état d'avant." },
    { type: "qcm", q: "Oublier les marqueurs <<<<<<< dans le fichier…", opts: ["Ne gêne pas", "Laisse du texte parasite (souvent une erreur de syntaxe)", "Les supprime seuls", "Bloque Git"], a: 1, exp: "Le linter/la CI le verront — mais autant relire." },
    { type: "qcm", q: "« Prendre la version la plus récente » sans lire…", opts: ["Est toujours correct", "Peut écraser une correction critique", "Est obligatoire", "Est plus rapide donc mieux"], a: 1, exp: "Comprendre les deux intentions." },
    { type: "qcm", q: "Après toute résolution :", opts: ["Taguer la version", "Lancer les tests", "push --force", "supprimer la branche"], a: 1, exp: "Syntaxe correcte ≠ métier correct." },
    { type: "qcm", q: "Réduire la fréquence des conflits :", opts: ["Ne plus brancher", "Branches courtes + pull régulier + fichiers bien découpés", "Un seul dev", "Des commits énormes"], a: 1, exp: "La prévention." },
    { type: "vf", q: "Deux branches qui modifient deux fichiers différents provoquent un conflit.", a: false, exp: "Git fusionne seul : conflit = même zone." },
    { type: "qcm", q: "Voir la jonction des histoires :", opts: ["git log --oneline --graph", "git show", "git status", "git tag"], a: 0, exp: "Le graphe du dépôt." }
  ],
  final: {
    title: "Exercice final — Le conflit des tarifs",
    intro: `<p>Deux branches ont modifié la même ligne du calcul de tarif. On tranche proprement.</p>`,
    questions: [
      { type: "qcm", q: "Git annonce :", opts: ["CONFLICT (content) + both modified", "une erreur fatale", "un merge automatique", "un fast-forward"], a: 0, exp: "La question est posée." },
      { type: "qcm", q: "Première chose à faire :", opts: ["Comprendre POURQUOI chaque branche a sa valeur", "add direct", "prendre HEAD", "merge --abort toujours"], a: 0, exp: "Acte éditorial." },
      { type: "qcm", q: "La version finale écrite, on…", opts: ["Retire les marqueurs, git add, git commit", "push --force", "supprime la branche", "git merge --abort"], a: 0, exp: "La séquence de sortie." },
      { type: "qcm", q: "Avant de considérer la fusion finie :", opts: ["python manage.py test", "git push --force", "git tag", "git commit --amend"], a: 0, exp: "Le filet du capstone." },
      { type: "vf", q: "En cas de doute, git merge --abort permet de repartir sans casse.", a: true, exp: "Personne n'est jamais coincé." }
    ],
    solution: `<pre class="pseudo">$ git merge feature/tarifs                                   # on tente de fusionner la branche des tarifs
CONFLICT (content): Merge conflict in catalogue/services.py  # Git signale le conflit : à toi de trancher

# les deux intentions : 0.50 (actuel) vs 0.60 (décision produit récente)   # on ENQUÊTE avant de choisir
# → la version 0.60 est la bonne (ticket #51)                              # verdict justifié par un ticket

$ ${'$'}EDITOR catalogue/services.py    # ouvre le fichier dans l'éditeur : on écrit la version finale et on retire les marqueurs
$ git add catalogue/services.py       # on déclare le conflit résolu
$ git commit                          # on crée le commit de fusion qui conclut
$ python manage.py test               # on relance les tests du capstone → tout vert ✔</pre>
<p>Le conflit est tranché en conscience. Demain : le dépôt distant — la scène de la collaboration.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta résolution de conflit…",
  items: [
  { id: "cicd-l3", title: "Le conflit à trois intentions", level: 3,
    statement: "Scénario : main contient « retries = 3 » (fix urgent d'hier), ta branche feature/robustesse a « retries = 5, timeout = 10 » (ton chantier). Le merge conflit sur ces lignes. Écris : le bloc de conflit tel que Git l'affiche, ton raisonnement (les DEUX intentions à préserver), la version finale combinée, et la séquence complète de commandes jusqu'aux tests.",
    hints: [
      "Les deux intentions ne s'excluent pas : le fix voulait retries>1, ton chantier ajoute timeout.",
      "La bonne réponse est souvent une COMBINAISON, pas un choix.",
      "Séquence : éditer → add → commit → manage.py test."
    ],
    atoi: { cmd: "git merge feature/robustesse\n# CONFLICT (content): both modified catalogue/services.py\n# éditer le bloc <<<<<<< HEAD ... ======= ... >>>>>>> : combiner les deux intentions\ngit add catalogue/services.py\ngit commit\npython manage.py test\ngit log --oneline --graph -5", expected: "Git signale CONFLICT (content) et both modified sur catalogue/services.py. Après avoir combiné retries=3 (fix d'incident) et timeout=10 (mon apport), retiré les marqueurs, fait git add puis le commit de fusion, python manage.py test repasse au vert : la combinaison tient et aucun fix n'a été silencieusement écrasé." },
    checklist: ["As-tu reproduit le bloc de conflit complet (<<<<<<< HEAD, =======, >>>>>>>) tel que Git l'affiche ?", "Ta version finale COMBINE-t-elle les deux intentions plutôt que d'en écraser une ?", "As-tu retiré tous les marqueurs avant git add ?", "As-tu relancé les tests pour confirmer que la fusion est métier-correcte, pas seulement syntaxique ?"],
    solution: "# Ce que Git affiche dans catalogue/services.py :\n<<<<<<< HEAD\n    retries = 3          # fix: réessaie 3 fois (incident #58 d'hier)\n=======\n    retries = 5\n    timeout = 10         # feat: robustesse des appels externes\n>>>>>>> feature/robustesse\n\n# Raisonnement :\n# - HEAD porte un FIX D'INCIDENT : la valeur 3 a été choisie hier\n#   pour une raison précise (au-delà, l'attente cumulée dépassait 30 s).\n# - Ma branche apporte le TIMEOUT, qui n'existait pas.\n# → combiner : garder retries = 3 (décision d'incident, plus récente\n#   et documentée) ET introduire timeout = 10 (mon apport).\n\n# Version finale (marqueurs supprimés) :\n    retries = 3          # incident #58 : ne pas dépasser ~30 s cumulées\n    timeout = 10         # borne chaque tentative\n\n$ git add catalogue/services.py   # conflit déclaré résolu\n$ git commit             # message auto du merge, complété si besoin\n$ python manage.py test  # vert : la combinaison tient\n$ git log --oneline --graph -5   # la jonction est propre",
    note: "Le réflexe « je garde ma version » aurait silencieusement annulé un fix d'incident — le pire type de régression, invisible jusqu'au prochain incident. La résolution experte lit les COMMENTAIRES et l'historique (git log -p sur la ligne, git blame) avant de trancher : un conflit est une conversation entre deux commits, et tu es l'arbitre informé." }
  ]
};
