<script>
var DAY = {
  num: 8,
  title: "Pourquoi la CI ? Le pipeline",
  subtitle: "De la discipline personnelle à la garantie d'équipe.",
  theory: `
<h3>1. Le problème</h3>
<p>Grâce à la semaine 1, l'équipe collabore proprement. Mais rien ne <strong>vérifie</strong> automatiquement : les <strong>tests</strong> (programmes qui contrôlent que le code fait ce qu'on attend) tournent « quand on y pense », le <strong>lint</strong> (vérification automatique du style et des erreurs courantes) dépend des goûts de chacun, et l'<strong>image Docker</strong> (le paquet qui contient l'application prête à tourner) se découvre cassée seulement au moment de livrer. Résultat : un commit « rouge » (qui casse quelque chose) peut entrer dans <code>main</code> sans que personne ne le voie.</p>

<h3>2. L'intégration continue</h3>
<p>La <strong>CI</strong> (Continuous Integration, intégration continue) exécute automatiquement, <strong>à chaque push et sur chaque PR</strong>, la batterie de vérifications du projet : tests, lint, <strong>build</strong> (la construction du programme livrable). Le résultat — <strong>vert</strong> (tout va bien) ou <strong>rouge</strong> (quelque chose échoue) — s'affiche directement sur le commit et sur la pull request.</p>

<h3>3. Le pipeline</h3>
<pre class="pseudo">push / PR                                                        # point de départ : un envoi de code ou une PR déclenche tout
   ├─→ tests     (les 50+ tests du capstone, avec un vrai MySQL) # étape 1 : on lance tous les tests contre une vraie base MySQL
   ├─→ qualité   (lint, format, couverture)                     # étape 2 : style (lint), mise en forme, "couverture" = % du code testé
   └─→ image     (le docker build du cours Docker + smoke test) # étape 3 : on construit l'image Docker + un "smoke test" (test de démarrage minimal)
        → verdict : ✅ vert (mergeable) ou ❌ rouge (bloqué)     # bilan final : vert = on peut merger, rouge = fusion interdite</pre>
<p>Un <strong>pipeline</strong> est cette suite d'étapes ordonnées. Chaque étape est un <strong>job</strong> (une tâche). Certains jobs tournent <strong>en parallèle</strong> (en même temps, pour aller plus vite), d'autres attendent : l'image ne se construit que si les tests passent. Un <strong>smoke test</strong> (« test de fumée ») est un contrôle minimal — « est-ce que ça démarre sans exploser ? » — comme allumer un appareil pour voir s'il ne fume pas.</p>

<h3>4. Ce que la CI change</h3>
<pre class="pseudo">AVANT                                APRÈS
tests « quand on y pense »           tests À CHAQUE commit            # plus de test oublié : c'est systématique
« ça marchait chez moi »             machine neutre, environnement neuf   # la CI part d'un ordinateur vierge : fini l'excuse
le style se discute en revue         le linter tranche, la revue pense    # la machine gère le style, l'humain gère le fond
l'image cassée découverte tard       cassée = su au commit même       # on apprend le problème tout de suite, pas à la livraison
la confiance repose sur les gens     la confiance repose sur le système   # on ne dépend plus de la mémoire de chacun</pre>

<h3>5. Le contrat de CI de la Ludothèque</h3>
<pre class="pseudo">À chaque push/PR : 1. python manage.py test          # 1) lancer tous les tests Django du projet
                   2. ruff check . (+ format)        # 2) ruff = le linter/formateur Python ; "." = tout le dossier courant
                   3. docker build + smoke test      # 3) construire l'image et vérifier qu'elle démarre
Rouge ⇒ pas de merge (leçon 14), pas de livraison (semaine 3)   # une seule étape rouge bloque fusion ET livraison
Promesse : main est TOUJOURS verte.                  # conséquence : tout ce qui est dans main a passé les 3 contrôles</pre>
<div class="warn">La CI ne <strong>crée</strong> pas la qualité : elle exécute les tests <em>que tu as écrits</em>. Un projet sans tests aura une CI verte et des bugs en prod — la CI amplifie la discipline existante, elle ne la remplace pas.</div>
<div class="tip">Règle de conception d'un pipeline : tout ce que tu fais à la main avant de dire « c'est bon » doit y figurer. Si tu vérifies quelque chose manuellement, c'est un futur job.</div>`,
  exercises: [
    { type: "qcm", q: "CI signifie…", opts: ["Code Inspection", "Continuous Integration (intégration continue)", "Central Infrastructure", "Commit Immédiat"], a: 1, exp: "Vérifier à chaque intégration." },
    { type: "qcm", q: "La CI s'exécute…", opts: ["Une fois par mois", "À chaque push et sur chaque PR", "À la demande du chef", "En prod"], a: 1, exp: "Systématique, sans fatigue." },
    { type: "qcm", q: "Sans CI, les tests tournent…", opts: ["Toujours", "« Quand on y pense » — donc parfois pas", "Jamais", "En prod"], a: 1, exp: "Le problème fondateur." },
    { type: "qcm", q: "Un pipeline est…", opts: ["Un serveur", "Une suite d'étapes de vérification ordonnées", "Un tuyau réseau", "Une branche"], a: 1, exp: "Tests, qualité, image…" },
    { type: "qcm", q: "Le verdict de la CI est visible…", opts: ["Nulle part", "Sur le commit et la PR (vert/rouge)", "Par email papier", "En prod"], a: 1, exp: "Transparence totale." },
    { type: "qcm", q: "« Ça marchait chez moi » est réfuté par…", opts: ["La bonne foi", "La machine neutre à environnement neuf de la CI", "Le chef", "Les logs"], a: 1, exp: "Comme les conteneurs (Docker l.9 du fil rouge)." },
    { type: "qcm", q: "Les débats de style en revue sont remplacés par…", opts: ["Des votes", "Le linter (la machine tranche)", "Le silence", "Le plus ancien"], a: 1, exp: "La revue pense, le linter formate." },
    { type: "qcm", q: "L'image Docker cassée se découvre…", opts: ["Au moment de livrer", "Au commit même, par le job de build", "Jamais", "En réunion"], a: 1, exp: "Tôt = pas cher à corriger." },
    { type: "qcm", q: "Le contrat de CI de la Ludothèque contient…", opts: ["Tests + lint/format + build d'image", "Que les tests", "Que le build", "Un déploiement direct en prod"], a: 0, exp: "Les trois vérifications." },
    { type: "qcm", q: "Un pipeline rouge…", opts: ["Se merge quand même", "Bloque merge et livraison", "Redémarre le serveur", "Supprime la branche"], a: 1, exp: "Verrouillé leçon 14." },
    { type: "vf", q: "La CI garantit la qualité même sans tests écrits.", a: false, exp: "Elle exécute ce qui existe : amplificateur, pas créateur." },
    { type: "qcm", q: "« Main toujours verte » signifie…", opts: ["Main est jolie", "Tout commit de main a passé tests, lint et build", "Main est vide", "Main est privée"], a: 1, exp: "La promesse du contrat." },
    { type: "qcm", q: "Certaines étapes tournent en parallèle pour…", opts: ["Faire joli", "Garder le pipeline rapide", "Consommer du CPU", "Éviter les conflits"], a: 1, exp: "tests et qualité, en même temps." },
    { type: "qcm", q: "L'image ne se construit qu'après les tests car…", opts: ["Docker est lent", "Inutile d'emballer du code cassé", "C'est obligatoire", "Le YAML l'exige toujours"], a: 1, exp: "L'ordre a un sens." },
    { type: "qcm", q: "La règle de conception d'un pipeline :", opts: ["Le minimum", "Tout ce qu'on vérifie à la main doit y figurer", "Que les tests", "Le maximum de jobs inutiles"], a: 1, exp: "Vérif manuelle = futur job." }
  ],
  final: {
    title: "Exercice final — Le contrat de CI",
    intro: `<p>On écrit le contrat que le pipeline devra tenir.</p>`,
    questions: [
      { type: "qcm", q: "Déclencheurs du contrat :", opts: ["Chaque push et chaque PR", "le 1er du mois", "à la main", "en prod"], a: 0, exp: "Systématique." },
      { type: "qcm", q: "Vérification n° 1 :", opts: ["python manage.py test (les tests du capstone)", "un ping", "le CSS", "un backup"], a: 0, exp: "Le métier d'abord." },
      { type: "qcm", q: "Vérification n° 3 :", opts: ["docker build + smoke test", "un déploiement", "un email", "rien"], a: 0, exp: "L'artefact se construit." },
      { type: "qcm", q: "Un rouge bloque :", opts: ["Merge et livraison", "le café", "les branches", "les commits locaux"], a: 0, exp: "Les conséquences du contrat." },
      { type: "vf", q: "Ce contrat reprend exactement ce qu'on faisait à la main aux cours précédents.", a: true, exp: "Rien de nouveau : c'est automatisé." }
    ],
    solution: `<pre class="pseudo">CONTRAT DE CI — Ludothèque
Déclencheurs : chaque push, chaque pull request        # QUAND le pipeline se lance

1. TESTS    python manage.py test         (capstone, avec MySQL)   # tous les tests, contre une vraie base
2. QUALITÉ  ruff check . && ruff format --check .                  # lint + vérif de mise en forme (--check = ne modifie rien, signale seulement)
3. IMAGE    docker build + smoke test     (cours Docker)          # construction de l'image + test de démarrage

Rouge ⇒ merge bloqué (leçon 14) et aucune livraison (semaine 3)   # conséquence d'un échec
Promesse : main toujours verte.                                   # garantie tenue par le contrat</pre>
<p>Le contrat est signé. Demain : le confier à GitHub Actions.</p>`
  }
};
</script>

    statement: "Fais l'inventaire honnête de TOUT ce que tu vérifies à la main avant de dire « c'est bon » sur la Ludothèque (au moins 6 points, des tests au docker build en passant par les migrations et le lint), et transforme chaque point en future étape de pipeline : nom du job, commande exacte, durée estimée, et ce qui se passe si c'est rouge.",
    hints: [

      "La somme des durées donne la durée cible du pipeline (< 10 min)."

    solution: "INVENTAIRE — ce que je vérifie à la main → le pipeline\n\n1. « Les tests passent »\n   → job tests : python manage.py test — ~3 min — rouge = merge bloqué\n2. « Le code est propre »\n   → job lint : ruff check . && ruff format --check . — ~10 s — rouge = merge bloqué\n3. « Les migrations s'appliquent sur une base vierge »\n   → dans le job tests : manage.py migrate sur le MySQL de service — inclus\n4. « L'image se construit »\n   → job image : docker build -t ludotheque:ci . — ~2 min — rouge = merge bloqué\n5. « Le conteneur démarre »\n   → smoke test : docker run --rm ... manage.py check — ~15 s — rouge = merge bloqué\n6. « Pas de secret qui traîne »\n   → job lint étendu : grep des motifs (clé, mot de passe) ou outil dédié\n     — ~5 s — rouge = merge bloqué + rotation du secret\n7. « La couverture ne recule pas »\n   → job couverture : coverage report --fail-under=80 — inclus dans tests\n\nDurée cible du pipeline : ~5-6 min (tests et lint en parallèle).\nTout ce qui reste manuel après ça : relire la PR (humain, voulu).",
    note: "L'inventaire honnête révèle toujours des vérifications qu'on croit faire « toujours » et qu'on saute en réalité un vendredi sur deux — exactement celles qui laisseront passer le bug. Les leçons 9 à 12 implémentent cette liste, point par point ; la durée cible (< 10 min) garde le pipeline utilisable : trop lent, on le contourne." }
  ]
