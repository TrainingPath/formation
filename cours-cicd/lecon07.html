<script>
var DAY = {
  num: 7,
  title: "Historique propre : rebase, amend, stash",
  subtitle: "Soigner l'histoire avant de la partager — et connaître la règle d'or.",
  theory: `
<h3>0. Réécrire l'histoire : de quoi parle-t-on ?</h3>
<p>Un commit possède un <strong>identifiant</strong> unique (une longue suite de caractères, l'empreinte du commit). Certains outils (<code>amend</code>, <code>rebase</code>) <strong>réécrivent l'histoire</strong> : ils remplacent d'anciens commits par de nouveaux, avec de <strong>nouveaux identifiants</strong>. C'est très pratique pour ranger sa branche avant de la partager — mais dangereux si les commits concernés ont déjà été partagés avec d'autres. D'où une « règle d'or » que l'on verra au point 4.</p>

<h3>1. amend : compléter le dernier commit</h3>
<pre class="pseudo">$ git commit -m "feat: réservation d'un jeu"   # on enregistre le commit…
# zut, tests.py oublié !                        # …mais on a oublié un fichier
$ git add catalogue/tests.py                    # on ajoute le fichier manquant à l'index
$ git commit --amend --no-edit                  # --amend = "corriger" le dernier commit ; --no-edit = garder le même message
# --amend REMPLACE le dernier commit par une version complétée (le commit reçoit un NOUVEL identifiant)</pre>
<p><strong>amend</strong> (« amender », « corriger ») ne crée pas un second commit : il <strong>refond</strong> le dernier en y incorporant les nouveaux changements. Idéal pour un fichier oublié ou un message raté, juste après coup.</p>

<h3>2. rebase : rejouer sur une base à jour</h3>
<pre class="pseudo">main a avancé pendant mon chantier :             # pendant que je codais, d'autres ont fait avancer main
$ git switch feature/reservations                # je me place sur ma branche
$ git rebase main                                # rebase = "rebaser" : reposer ma branche sur la nouvelle pointe de main
# mes commits sont REJOUÉS un à un sur la pointe de main   # Git détache mes commits et les rejoue au-dessus du main récent
# → historique LINÉAIRE, comme si j'avais commencé aujourd'hui   # résultat : une ligne droite, sans commit de fusion
# conflit en route ? résoudre → git add → git rebase --continue  # si un commit rejoué heurte main : on résout puis on continue
# panique ? git rebase --abort                   # --abort annule tout le rebase et revient à l'état de départ</pre>
<p><strong>rebase</strong> (« rebaser ») change la <strong>base</strong> de ta branche : au lieu de partir d'un vieux commit, elle repart de la pointe actuelle de <code>main</code>. L'histoire devient <strong>linéaire</strong> (une seule ligne), donc plus facile à lire.</p>

<h3>3. merge ou rebase ?</h3>
<pre class="pseudo">merge  : préserve la chronologie vraie (commit de fusion)   # garde la trace exacte de quand les histoires se sont croisées
rebase : réécrit pour la lisibilité (ligne droite)          # sacrifie la chronologie exacte au profit d'une histoire nette
Pratique courante : rebase de SA branche locale sur main,   # on range SA branche à soi (privée) avec rebase…
merge (via PR) pour entrer DANS main.                       # …et on entre dans main par un merge officiel (via la PR)</pre>

<h3>4. La règle d'or</h3>
<div class="warn">amend et rebase <strong>réécrivent l'histoire</strong> (nouveaux identifiants de commits). On ne réécrit <strong>jamais</strong> des commits déjà poussés qu'un autre a pu récupérer : sinon son historique et le tien divergent, et c'est le chaos. Sur SA branche de PR déjà poussée (donc à soi seul), c'est acceptable avec <code>git push --force-with-lease</code> — ce « force prudent » refuse d'écraser si quelqu'un d'autre a poussé entre-temps.</div>

<h3>5. stash : le tiroir à travail en cours</h3>
<pre class="pseudo">$ git stash                    # stash = "mettre de côté" : range les modifications en cours dans un tiroir, le dépôt redevient propre
$ git switch main && ... le fix urgent ... && git switch feature/x   # on va traiter une urgence, puis on revient sur sa branche
$ git stash pop                # pop = "sortir du tiroir" : réapplique le travail mis de côté et vide le tiroir
$ git stash list               # liste les tiroirs empilés (on peut en avoir plusieurs)</pre>
<div class="tip">Ces trois outils servent le même but : présenter à l'équipe une histoire <strong>lisible</strong> — des commits atomiques, dans l'ordre, sur une base à jour. La lisibilité de l'histoire est un service rendu au futur (et au futur, tu y seras).</div>`,
  exercises: [
    { type: "qcm", q: "git commit --amend…", opts: ["Crée un 2e commit", "Remplace/complète le dernier commit", "Supprime le commit", "Pousse"], a: 1, exp: "Nouvel identifiant, un seul commit." },
    { type: "qcm", q: "Le cas d'usage typique d'amend :", opts: ["Réécrire main", "Fichier oublié ou message raté du DERNIER commit", "Fusionner", "Taguer"], a: 1, exp: "La retouche immédiate." },
    { type: "qcm", q: "git rebase main (depuis sa branche)…", opts: ["Fusionne main dans la branche", "Rejoue les commits de la branche sur la pointe de main", "Supprime main", "Pousse"], a: 1, exp: "Historique linéaire." },
    { type: "qcm", q: "Après un rebase, l'historique de la branche est…", opts: ["Identique", "Linéaire, comme commencé depuis le main à jour", "Vide", "Doublé"], a: 1, exp: "La ligne droite." },
    { type: "qcm", q: "Un conflit pendant un rebase :", opts: ["Tout est perdu", "Résoudre → add → git rebase --continue", "On force", "On supprime la branche"], a: 1, exp: "--abort si panique." },
    { type: "qcm", q: "merge vs rebase :", opts: ["Identiques", "merge préserve la chronologie, rebase réécrit pour la lisibilité", "rebase préserve, merge réécrit", "Aucun ne fusionne"], a: 1, exp: "Deux philosophies." },
    { type: "qcm", q: "La pratique courante :", opts: ["rebase sa branche locale sur main ; merge (PR) pour entrer dans main", "L'inverse", "Que du rebase partout", "Que du merge partout"], a: 0, exp: "Le meilleur des deux." },
    { type: "qcm", q: "La règle d'or :", opts: ["Toujours forcer", "Ne jamais réécrire des commits déjà partagés", "Ne jamais rebaser", "Committer le vendredi"], a: 1, exp: "L'histoire partagée est immuable." },
    { type: "vf", q: "amend sur un commit déjà poussé et récupéré par un collègue est sans danger.", a: false, exp: "Son historique et le tien divergent : chaos." },
    { type: "qcm", q: "Après un rebase de SA branche de PR déjà poussée :", opts: ["git push --force-with-lease", "git push --force brutal", "git pull", "rien"], a: 0, exp: "Refuse d'écraser le travail d'un autre." },
    { type: "qcm", q: "--force-with-lease vs --force :", opts: ["Identiques", "with-lease échoue si quelqu'un a poussé entre-temps", "force est plus sûr", "with-lease supprime la branche"], a: 1, exp: "Le garde-fou en plus." },
    { type: "qcm", q: "git stash sert à…", opts: ["Supprimer le travail", "Mettre le travail en cours de côté (dépôt propre)", "Pousser", "Fusionner"], a: 1, exp: "Le tiroir." },
    { type: "qcm", q: "Reprendre le travail mis de côté :", opts: ["git stash pop", "git stash drop", "git pull", "git redo"], a: 0, exp: "Applique et dépile." },
    { type: "qcm", q: "Le scénario type du stash :", opts: ["Vacances", "Interruption urgente en plein chantier non committable", "Déploiement", "Revue"], a: 1, exp: "Fix urgent, puis retour." },
    { type: "vf", q: "Le but commun d'amend/rebase/stash : présenter une histoire lisible à l'équipe.", a: true, exp: "Un service rendu au futur." }
  ],
  final: {
    title: "Exercice final — La branche présentable",
    intro: `<p>Avant d'ouvrir la PR : on nettoie, on rejoue, on pousse proprement.</p>`,
    questions: [
      { type: "qcm", q: "tests.py oublié dans le dernier commit (local) :", opts: ["git add + git commit --amend --no-edit", "un 2e commit « oups »", "recommencer la branche", "push direct"], a: 0, exp: "Complété, pas doublé." },
      { type: "qcm", q: "main a avancé de 4 commits :", opts: ["git rebase main depuis la branche", "ignorer", "supprimer main", "merge main 4 fois"], a: 0, exp: "Base à jour, ligne droite." },
      { type: "qcm", q: "Conflit au 2e commit rejoué :", opts: ["Résoudre → add → rebase --continue", "--abort obligatoire", "forcer", "pleurer"], a: 0, exp: "Ou --abort si besoin de recul." },
      { type: "qcm", q: "La branche avait déjà été poussée :", opts: ["git push --force-with-lease", "git push --force", "git pull", "nouvelle branche"], a: 0, exp: "SA branche de PR, en sécurité." },
      { type: "vf", q: "On n'aurait jamais fait ça sur main.", a: true, exp: "La règle d'or, toujours." }
    ],
    solution: `<pre class="pseudo">$ git add catalogue/tests.py               # on ajoute le fichier de tests oublié
$ git commit --amend --no-edit             # on complète le dernier commit (même message)

$ git rebase main                          # on rejoue nos commits sur la pointe de main à jour
# conflit → résolu → git add → git rebase --continue   # si un commit rejoué heurte main, on résout et on poursuit

$ git push --force-with-lease              # MA branche de PR, réécrite : push "prudent" qui protège les autres
# → la PR montre une histoire linéaire, relisible en 10 minutes</pre>
<p>Semaine Git terminée : l'équipe collabore proprement. Lundi : la machine prend le relais — la CI.</p>`
  }
};
</script>
