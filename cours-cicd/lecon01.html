  title: "Le dépôt de la Ludothèque : rappels et hygiène Git",
  subtitle: "Avant d'automatiser, on solidifie les fondations : un dépôt propre.",
  theory: `
<h3>1. De quoi parle ce cours ? (les mots CI et CD)</h3>
<p>Ce cours s'appelle « CI/CD ». Décomposons tout de suite ces deux sigles, car ils reviendront à chaque leçon. <strong>CI</strong> veut dire <strong>Continuous Integration</strong>, en français <strong>intégration continue</strong>. « Intégrer », ici, signifie <em>réunir le travail de tout le monde dans un seul programme</em> ; « continue » veut dire <em>tout le temps, à chaque petit changement</em>, au lieu d'attendre la fin du projet. Concrètement, la CI, c'est une machine qui, <strong>à chaque fois que quelqu'un modifie le code</strong>, vérifie automatiquement que tout fonctionne encore (le code compile, les tests passent). <strong>CD</strong> veut dire <strong>Continuous Delivery/Deployment</strong>, en français <strong>livraison / déploiement continu</strong>. <strong>Déployer</strong>, c'est <em>installer le programme sur le serveur où les vrais utilisateurs s'en servent</em> (le « mettre en ligne »). La CD, c'est donc une machine qui <strong>livre automatiquement</strong> la nouvelle version aux utilisateurs, sans qu'un humain ait à copier des fichiers à la main.</p>
<p>Pour orchestrer tout cela, on utilise un <strong>pipeline</strong> (mot anglais qui signifie « oléoduc », « tuyau ») : c'est une <strong>suite d'étapes automatiques</strong> que le code traverse, comme une chaîne de montage dans une usine. À une extrémité on met le code source ; à l'autre sort une application testée et déployée. On appelle chaque étape un <strong>job</strong> (« tâche » en anglais). Le programme qui exécute ces jobs sur une machine s'appelle un <strong>runner</strong> (« exécuteur »).</p>
<p>Le plan du cours suit ces idées : <strong>branches et pull requests</strong> pour travailler à plusieurs (semaine 1), un <strong>pipeline qui teste à chaque changement</strong> (la CI, semaine 2), puis un pipeline qui <strong>livre à chaque version</strong> (la CD, semaine 3). Tout part d'un même endroit : le <strong>dépôt Git</strong> de la Ludothèque (une application de gestion de prêt de jeux de société qui sert de fil rouge).</p>

<h3>2. Rappels sur Git : le dépôt et les trois zones</h3>
<p><strong>Git</strong> est un <strong>logiciel de gestion de versions</strong> : il mémorise l'histoire complète d'un projet, chaque modification, qui l'a faite et quand — comme un « historique » que l'on pourrait remonter à volonté. Un <strong>dépôt</strong> (en anglais <em>repository</em>, souvent abrégé « repo ») est le <strong>dossier suivi par Git</strong> : il contient le code plus toute cette histoire. Dans Git, un fichier voyage à travers <strong>trois zones</strong> avant d'entrer définitivement dans l'histoire :</p>
<pre class="pseudo">répertoire de travail → (git add) → index/staging → (git commit) → historique
# répertoire de travail = les fichiers tels que tu les édites en ce moment sur ton disque
# git add = commande qui SÉLECTIONNE les changements à enregistrer (les met "de côté")
# index / staging = la zone d'attente : ce qui est prêt à être enregistré (staging = "mise en scène")
# git commit = commande qui ENREGISTRE pour de bon le contenu de l'index dans l'histoire
# historique = la suite de tous les enregistrements (les commits), gravée dans le dépôt

git status                     # affiche l'état de chaque fichier : modifié, sélectionné (add), ou non suivi
git diff                       # affiche le détail des changements PAS ENCORE ajoutés à l'index (add)
git log --oneline --graph      # affiche l'histoire : --oneline = un commit par ligne, --graph = dessine les branches</pre>
<p>Un <strong>commit</strong> (prononcé « comitte ») est un <strong>enregistrement</strong> : une photo de l'état du projet à un instant donné, accompagnée d'un message qui explique le changement. C'est l'unité de base de l'histoire d'un dépôt.</p>

<h3>3. Le commit atomique</h3>
<p>Un bon commit est <strong>atomique</strong> : « atomique » veut dire <em>insécable, qui ne traite qu'une seule chose</em>. Un commit atomique contient <strong>un</strong> changement cohérent (une correction, une fonctionnalité, un renommage) — et pas « tout le travail de la journée » mélangé. Pourquoi ? Parce qu'un tel commit se relit facilement, se comprend d'un coup d'œil et, au besoin, s'annule tout seul grâce à <code>git revert</code> (une commande qui crée un nouveau commit annulant les effets d'un commit précédent) <strong>sans emporter le reste</strong> du travail avec lui.</p>

<h3>4. Les messages de commit normés</h3>
<p>Chaque commit porte un <strong>message</strong> qui décrit son changement. Pour que ces messages soient réguliers et exploitables par une machine, on suit une convention appelée « Conventional Commits » : chaque message commence par un <strong>type</strong> (une étiquette), suivi de deux-points, puis d'un résumé court à l'impératif.</p>
<pre class="pseudo">type: résumé à l'impératif (< 70 caractères)   # forme générale : une étiquette, deux-points, un résumé bref
feat: réservation d'un jeu indisponible          # feat = feature = une NOUVELLE fonctionnalité
fix: refuse le double-rendu d'une location        # fix = une CORRECTION de bug
docs: guide d'installation Docker                 # docs = documentation (fichiers d'explication, pas de code)
refactor: extrait le calcul de tarif du contrôleur # refactor = réorganise le code SANS changer ce qu'il fait
test: couvre le prix figé à l'achat               # test = ajoute ou modifie des tests automatiques
chore: met à jour Django 5.1                       # chore = "corvée" : tâche d'entretien (mise à jour d'outils, config…)</pre>
<p>Cette convention n'est pas décorative : la leçon 15 <strong>générera le changelog</strong> (la « liste des nouveautés » d'une version) automatiquement, en triant les commits <code>feat:</code> et <code>fix:</code>. Écrire des messages normés aujourd'hui, c'est s'offrir des changelogs gratuits demain.</p>

<h3>5. L'hygiène du dépôt : le .gitignore et les secrets</h3>
<p>Un fichier spécial nommé <strong>.gitignore</strong> liste les fichiers que Git doit <strong>ignorer</strong>, c'est-à-dire ne jamais suivre ni enregistrer. On y met deux catégories : les <strong>secrets</strong> (mots de passe, clés d'accès — jamais dans l'histoire !) et les <strong>fichiers générés</strong> (produits automatiquement, inutiles à conserver).</p>
<pre class="pseudo"># .gitignore de la Ludothèque   (# = ligne de commentaire, ignorée par Git)
.env                # fichier des variables secrètes (mots de passe, clés) : JAMAIS dans le dépôt
.env.*              # toutes les variantes (.env.local, .env.prod…) ; * = "n'importe quelle suite de caractères"
.venv/              # dossier de l'environnement Python (le / final indique un dossier) : régénérable, inutile à suivre
__pycache__/        # dossier où Python range ses fichiers compilés temporaires
*.pyc               # tout fichier finissant par .pyc (Python compilé) ; * = n'importe quel nom
sauvegarde-*.sql    # les dumps de base de données (souvent volumineux et sensibles)</pre>
<div class="warn">Un pipeline automatise ce qu'on lui donne : un dépôt qui contient un <code>.env</code>, des fichiers générés ou des commits fourre-tout produira des livraisons du même acabit. La qualité de tout ce cours dépend de cette leçon.</div>
<div class="tip">Vérifie ton capstone maintenant : <code>git status</code> propre, <code>git log --oneline</code> lisible, <code>git tag</code> cohérent. Un <strong>tag</strong> est une étiquette posée sur un commit pour marquer une version importante (par exemple <code>v1.0.0</code>). C'est le dépôt qu'on va brancher au pipeline.</div>`,
  exercises: [
    { type: "qcm", q: "Ce cours automatise…", opts: ["L'écriture du code", "La vérification et la livraison à chaque commit/version", "La conception Merise", "Le suivi des tickets"], a: 1, exp: "CI (vérifier) + CD (livrer)." },
    { type: "qcm", q: "Les trois zones de Git :", opts: ["Travail → index (add) → historique (commit)", "RAM → disque → cloud", "dev → test → prod", "commit → push → pull"], a: 0, exp: "Le trajet d'un changement." },
    { type: "qcm", q: "git status montre…", opts: ["L'historique", "L'état de chaque fichier (modifié, indexé, non suivi)", "Les branches distantes", "Le contenu du dernier commit"], a: 1, exp: "Le tableau de bord." },
    { type: "qcm", q: "git diff (sans option) montre…", opts: ["Les changements non encore indexés", "L'historique", "Les tags", "Le .gitignore"], a: 0, exp: "Travail vs index." },

    { type: "qcm", q: "L'avantage d'un commit atomique :", opts: ["Moins de commits", "git revert l'annule sans emporter le reste", "Plus rapide", "Une histoire plus courte"], a: 1, exp: "Granularité = réversibilité." },
    { type: "qcm", q: "Le format des messages :", opts: ["type: résumé à l'impératif", "Une date", "Le nom du fichier", "Le hash du commit"], a: 0, exp: "feat:, fix:, docs:…" },
    { type: "qcm", q: "« feat: » annonce…", opts: ["Une correction", "Une nouvelle fonctionnalité", "Un test", "Une config"], a: 1, exp: "feature." },
    { type: "qcm", q: "« fix: » annonce…", opts: ["Une fonctionnalité", "Une correction de bug", "Un déploiement", "Un tag"], a: 1, exp: "La paire feat/fix structure le changelog." },
    { type: "qcm", q: "La convention des messages servira à…", opts: ["Trier les tickets", "Générer le changelog automatiquement (leçon 15)", "Nommer les branches", "Compresser le dépôt"], a: 1, exp: "Investissement, pas décoration." },
    { type: "qcm", q: "Dans .gitignore de la Ludothèque, on trouve…", opts: ["settings.py", ".env, .venv/, __pycache__/", "manage.py", "les templates"], a: 1, exp: "Secrets et fichiers générés." },
    { type: "vf", q: "Un secret commité puis supprimé au commit suivant est hors de danger.", a: false, exp: "L'historique le garde : rotation obligatoire (déjà vu, toujours vrai)." },
    { type: "qcm", q: "git log --oneline --graph sert à…", opts: ["Fusionner les branches", "Visualiser l'histoire et ses branches", "Supprimer", "Pousser"], a: 1, exp: "La carte du dépôt." },
    { type: "vf", q: "La qualité du pipeline dépend de la qualité du dépôt qu'on lui donne.", a: true, exp: "Garbage in, garbage out." },
    { type: "qcm", q: "Les tags du dépôt (v1.0.0) correspondent…", opts: ["Aux humeurs", "Aux versions déployées (cours Docker)", "Aux branches", "Aux tests"], a: 1, exp: "L'histoire déjà commencée." }
  ],
  final: {
    title: "Exercice final — L'audit du dépôt",
    intro: `<p>On vérifie que le dépôt du capstone est prêt pour l'automatisation.</p>`,
    questions: [
      { type: "qcm", q: "Premier contrôle :", opts: ["git status propre (rien d'inattendu, rien de secret)", "la taille du dépôt", "le nombre de branches", "le nombre de commits"], a: 0, exp: "La base." },
      { type: "qcm", q: "Un fichier .env apparaît dans git status :", opts: ["On l'ajoute au .gitignore immédiatement", "on le committe", "on l'ignore", "on le renomme"], a: 0, exp: "Avant tout commit malheureux." },
      { type: "qcm", q: "Un commit « wip lundi » dans l'historique est…", opts: ["Un anti-modèle (ni atomique, ni normé)", "parfait", "obligatoire", "acceptable en équipe"], a: 0, exp: "Illisible et inannulable." },
      { type: "qcm", q: "Le bon message pour la correction du double-rendu :", opts: ["fix: refuse le double-rendu d'une location", "update code", "changes", "v2"], a: 0, exp: "type: résumé." },
      { type: "vf", q: "git log --oneline doit se lire comme un journal du projet.", a: true, exp: "C'est le but de la discipline." }
    ],
    solution: `<pre class="pseudo">$ git status                     # 1) on demande l'état : "propre" = rien de modifié ni oublié ✔
$ cat .gitignore                 # 2) cat affiche le contenu d'un fichier : on vérifie que .env, .venv/, __pycache__/ y sont ✔
$ git log --oneline -5           # 3) affiche les 5 derniers commits (-5), un par ligne (--oneline)
a1b2c3d feat: pagination du catalogue                 # chaque ligne = un identifiant court + le message normé
e4f5a6b fix: refuse le double-rendu d'une location     # on relit l'histoire comme un journal clair
9c8d7e6 test: couvre le prix figé à l'achat
...                              # (…) et ainsi de suite : lisible comme un journal ✔
$ git tag                        # 4) liste les tags (étiquettes de version) : v1.0.0 présent ✔</pre>
<p>Les fondations sont saines. Demain : travailler en parallèle avec les branches.</p>`
  }
};
