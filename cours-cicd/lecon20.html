  title: "Le pipeline complet de la Ludothèque",
  subtitle: "Assembler toutes les pièces — et les documenter pour l'équipe.",
  theory: `
<h3>1. Les deux workflows, côte à côte</h3>
<p>On rassemble tout ce qui a été construit. Rappel : un <strong>pipeline</strong> est la suite ordonnée d'étapes automatiques que traverse le code. Voici les deux workflows du projet, avec leur enchaînement complet.</p>
<pre class="pseudo">── ci.yml ─────────────────────────────── (~5-8 min)       # 1er workflow : la vérification, à chaque commit
push / PR                                                  # déclenché par un envoi de code ou une PR
   ├─→ tests     (MySQL service, 50+ tests + couverture)  ┐ parallèles   # job tests (leçon 10) et…
   └─→ qualite   (ruff check + format --check)            ┘             # …job qualite (leçon 11) en même temps
              └─→ image (build + smoke test)   needs: les deux   # job image (leçon 12), seulement si les deux au-dessus sont verts
                     └─→ [si main] deployer-staging → recette   # si on est sur main : déploiement staging (leçon 18) puis recette manuelle

   BARRIÈRE (l.14) : merge SEULEMENT si tests+qualite+image verts   # la protection de branche (leçon 14)…
                     + 1 revue humaine + branche à jour             # …exige aussi une revue et une branche à jour

── release.yml ────────────────────────── (~4-6 min + approbation)   # 2e workflow : la livraison, à chaque tag
git push origin v1.1.0                                     # déclenché par le push d'un tag de version
   └─→ publier   (build, tag 1.1.0 + latest, push ghcr.io, release GitHub)   # job publier (leçon 16) : construit et publie l'image
          └─→ ⏸ APPROBATION (environnement production)     # ⏸ = pause : attente d'une approbation humaine (leçon 18)
                 └─→ deployer-production (ssh, pull, up -d, migrate)   # job de déploiement prod (leçon 17)
                        └─→ curl /sante/ avec retries ✔     # vérification finale de santé (avec réessais)</pre>

<h3>2. Chaque flèche est une leçon</h3>
<pre class="pseudo">branches/PR/protection : leçons 2-7, 14      tests en CI : 10   # rappel : chaque brique vient d'une leçon précise
qualité : 11        image : 12       secrets : 13
versions/changelog : 15    publier : 16    déployer : 17
staging/approbation : 18   rollback/N-1 : 19</pre>

<h3>3. Les badges : l'état en un regard</h3>
<pre class="pseudo"># README.md
![CI](https://github.com/toi/ludotheque/actions/workflows/ci.yml/badge.svg)   # un "badge" = une petite image auto qui affiche vert/rouge selon le dernier run
# vert/rouge en tête du dépôt — l'état de main, public et permanent</pre>
<p>Un <strong>badge</strong> est une petite image générée par GitHub qui montre en direct si le pipeline est vert ou rouge. Placé en haut du README (le fichier d'accueil du projet), il rend l'état de <code>main</code> visible d'un coup d'œil.</p>

<h3>4. La durée : une exigence de premier ordre</h3>
<p>Un pipeline de 8 minutes est utilisé ; un pipeline de 40 minutes est <strong>contourné</strong> (« je merge, on verra »). Les <strong>caches</strong> (réutilisation de ce qui a déjà été téléchargé/construit — pip, build), le <strong>parallélisme</strong> (jobs qui tournent en même temps) et des jobs minimaux ne sont pas du confort : ils protègent l'<strong>adoption</strong> (le fait que l'équipe s'en serve vraiment).</p>

<h3>5. Le schéma EST la documentation</h3>
<p>Ce diagramme, dans le README à côté du workflow Git (leçon 5), est le document d'<strong>onboarding</strong> (« accueil / prise en main » d'un nouvel arrivant) : on y lit qui déclenche quoi, où sont les barrières, et ce qui est automatique. Rien d'autre à expliquer en réunion.</p>
<div class="warn">Un pipeline vivant <strong>dérive</strong> (s'écarte peu à peu de l'état voulu) : jobs qui s'allongent, steps morts, checks oubliés dans la protection. Une revue trimestrielle du pipeline (durées, pertinence, alignement protection ↔ jobs) fait partie de sa maintenance — c'est du code, il vieillit comme le reste.</div>
<div class="tip">Relis le chemin depuis la leçon 1 : chaque automatisation a d'abord été un geste manuel appris (tests du capstone, build du cours Docker, déploiement à la main). C'est l'ordre sain — automatiser ce qu'on comprend, jamais l'inverse.</div>`,
  exercises: [

    { type: "qcm", q: "Le badge du README montre…", opts: ["La couverture de tests", "L'état (vert/rouge) du workflow sur main, en permanence", "Le nombre de commits", "La version de Python"], a: 1, exp: "L'état en un regard." },
    { type: "qcm", q: "Un pipeline de 40 minutes est…", opts: ["Plus rigoureux", "Contourné (« je merge, on verra »)", "Parfait", "Obligatoire"], a: 1, exp: "La durée protège l'adoption." },
    { type: "qcm", q: "Les caches et le parallélisme sont…", opts: ["Du luxe", "Une protection de l'adoption du pipeline", "Dangereux", "Réservés aux gros projets"], a: 1, exp: "Vitesse = usage." },
    { type: "qcm", q: "Le document d'onboarding du pipeline :", opts: ["Une réunion", "Le schéma dans le README (avec le workflow Git)", "Un email", "Rien"], a: 1, exp: "Qui déclenche quoi, où sont les barrières." },
    { type: "vf", q: "Un pipeline écrit une fois est bon pour toujours.", a: false, exp: "Il dérive : revue trimestrielle." },
    { type: "qcm", q: "La dérive typique d'un pipeline :", opts: ["Des tests trop nombreux", "Jobs qui s'allongent, steps morts, protection désalignée", "Trop de secrets", "Trop de YAML"], a: 1, exp: "C'est du code : il vieillit." },
    { type: "qcm", q: "L'ordre sain de l'automatisation :", opts: ["Automatiser d'abord, comprendre ensuite", "Apprendre le geste à la main, puis l'automatiser", "Copier un blog", "Ne rien automatiser"], a: 1, exp: "Le fil de toute la formation." },
    { type: "qcm", q: "De git push origin v1.1.0 à la prod à jour, il faut…", opts: ["Une soirée", "~10 min + un clic d'approbation", "Une semaine", "Un admin serveur"], a: 1, exp: "Le pipeline chiffré." },
    { type: "vf", q: "Chaque flèche du schéma correspond à une leçon de ce cours.", a: true, exp: "L'assemblage n'invente rien." }
  ],
  final: {
    title: "Exercice final — L'assemblage final",
    intro: `<p>On vérifie que le pipeline complet tient debout, de bout en bout.</p>`,
    questions: [
      { type: "qcm", q: "Un push sur une PR déclenche :", opts: ["tests + qualite, puis image", "le déploiement prod", "rien", "une release"], a: 0, exp: "La CI protège." },
      { type: "qcm", q: "Un merge sur main ajoute :", opts: ["deployer-staging automatique", "la prod", "un tag", "rien de plus"], a: 0, exp: "La répétition générale." },
      { type: "qcm", q: "Un tag v* déclenche :", opts: ["publier → approbation → deployer-production", "les tests seuls", "staging", "un badge"], a: 0, exp: "La livraison." },
      { type: "qcm", q: "Le README affiche :", opts: ["Le badge CI + le schéma du pipeline + le workflow Git", "rien", "les secrets", "les logs"], a: 0, exp: "L'onboarding complet." },
      { type: "vf", q: "La durée totale de la CI reste sous 10 minutes.", a: true, exp: "Caches + parallélisme : l'exigence tenue." }
    ],
    solution: `<pre class="pseudo">PR ouverte      → tests + qualite (parallèles) → image → mergeable si vert+revue   # cycle de vérification (CI)
merge sur main  → (re-CI) → deployer-staging → recette                            # déploiement automatique en staging
tag v1.1.0      → publier (ghcr.io:1.1.0 + release GitHub)                        # publication de l'image versionnée
                → ⏸ approbation → deployer-production → /sante/ ✔                  # prod après feu vert humain, puis vérif santé
incident        → VERSION précédente, pull, up -d (< 5 min, schéma N-1)           # rollback rapide et sûr (leçon 19)

README : badge CI + ce schéma + le workflow Git (l.5) = l'onboarding             # toute la doc d'accueil en un endroit</pre>
<p>Le pipeline est complet et documenté. Demain : l'examen final — de la formation entière, en un trajet.</p>`
  }
};
