<script>
var DAY = {
  num: 11,
  title: "Qualité automatisée : lint, format, couverture",
  subtitle: "La machine tranche le style, mesure les filets — la revue pense.",
  theory: `
<h3>1. Le linter : les erreurs évidentes</h3>
<p>Un <strong>linter</strong> est un outil qui <strong>lit ton code sans l'exécuter</strong> et signale les défauts évidents : import inutile, variable jamais utilisée, comparaison douteuse. L'opération s'appelle le <strong>lint</strong> (le mot vient de « peluche » : le linter enlève les petites peluches du code). Notre linter Python est <strong>ruff</strong>, très rapide.</p>
<pre class="pseudo">$ ruff check .             # ruff check = analyser le code ; "." = le dossier courant et tous ses sous-dossiers
catalogue/views.py:12:1: F401 'json' imported but unused          # fichier:ligne:colonne + code F401 : "json" importé mais jamais utilisé
catalogue/services.py:45:5: F841 local variable 'total' assigned but never used   # F841 : variable "total" créée mais jamais lue</pre>
<p>Le lint attrape ce que l'œil ne voit plus. Rapide (quelques millisecondes) et sans débat : c'est vrai ou faux, pas une question de goût.</p>

<h3>2. Le formateur : zéro débat de style</h3>
<p>Un <strong>formateur</strong> (en anglais <em>formatter</em>) réécrit automatiquement le code selon une mise en forme unique (guillemets, espaces, longueur de ligne). Fini les discussions : la machine applique toujours les mêmes règles.</p>
<pre class="pseudo">$ ruff format .            # formate le code EN LE MODIFIANT (usage en local, quand on écrit)
$ ruff format --check .    # --check = VÉRIFIE seulement, sans rien modifier ; échoue si un fichier n'est pas bien formaté (usage en CI)
# guillemets, espaces, longueur de ligne : la machine tranche,
# la revue de code ne parle plus jamais de style</pre>

<h3>3. La couverture : mesurer les filets</h3>
<p>La <strong>couverture</strong> (en anglais <em>coverage</em>) mesure <strong>quelle part du code est traversée par les tests</strong>. L'outil <code>coverage</code> exécute les tests en notant chaque ligne visitée, puis produit un rapport.</p>
<pre class="pseudo">$ coverage run manage.py test    # lance les tests en ENREGISTRANT quelles lignes de code sont exécutées
$ coverage report                # affiche le tableau récapitulatif :
Name                     Stmts   Miss  Cover    # Stmts = nb d'instructions ; Miss = non testées ; Cover = % couvert
catalogue/services.py      120      6    95%     # 120 instructions, 6 jamais testées → 95 % couvert (très bon)
catalogue/views.py          80     24    70%     ← des vues sans filet   # 24 instructions non testées : un trou à combler
TOTAL                      450     54    88%     # bilan global du projet : 88 %

$ coverage report --fail-under=80    # --fail-under=80 : échoue (rouge) si la couverture globale descend sous 80 %</pre>

<h3>4. Les jobs parallèles</h3>
<pre class="pseudo">jobs:
  tests:    { ... }          # ~3 min   ┐ le job de tests (leçon 10)
  qualite:                   # ~30 s    ┘ le job qualité ; sans "needs:" entre eux, ils tournent EN PARALLÈLE (en même temps)
    runs-on: ubuntu-latest                       # machine neuve
    steps:
      - uses: actions/checkout@v4                # récupérer le code
      - uses: actions/setup-python@v5            # installer Python…
        with: { python-version: "3.14" }          # …version 3.14
      - run: pip install ruff                    # installer seulement ruff (pas besoin de toute l'app : c'est plus rapide)
      - run: ruff check .                        # étape lint
      - run: ruff format --check .               # étape vérification du formatage</pre>
<p><code>needs:</code> sert à dire qu'un job doit <strong>attendre</strong> un autre ; ici on ne l'utilise pas entre <code>tests</code> et <code>qualite</code>, donc ils s'exécutent en parallèle et le verdict complet arrive plus vite.</p>

<h3>5. Ce que la couverture dit — et ne dit pas</h3>
<div class="warn">80 % couverts ≠ bien testé : un test peut <em>traverser</em> une ligne sans rien <em>vérifier</em> (aucune <strong>assertion</strong>, c'est-à-dire aucun contrôle du résultat). Mais 40 % dit à coup sûr que des pans entiers n'ont <strong>aucun</strong> filet. La couverture est un <strong>détecteur de trous</strong>, pas un certificat de qualité.</div>
<div class="tip">Le seuil <code>--fail-under</code> se règle <em>au niveau actuel</em> du projet (pas à 100 %) : il empêche de <strong>reculer</strong>. On le remonte au fil des progrès — un <strong>cliquet</strong> (mécanisme qui n'autorise qu'un seul sens, comme une roue qui ne peut plus redescendre), pas une barre de saut.</div>`,
  exercises: [
    { type: "qcm", q: "Le linter attrape…", opts: ["Les bugs métier", "Les erreurs évidentes : import inutile, variable morte…", "Les fautes d'orthographe", "Les secrets"], a: 1, exp: "Ce que l'œil ne voit plus." },
    { type: "qcm", q: "Notre linter Python :", opts: ["ruff check .", "eslint", "gcc", "prettier"], a: 0, exp: "Rapide et complet." },
    { type: "qcm", q: "F401 'json' imported but unused est typiquement…", opts: ["Un bug critique", "Un signalement de lint (nettoyage)", "Un test", "Un secret"], a: 1, exp: "La rouille du code." },
    { type: "qcm", q: "En CI, on utilise ruff format avec…", opts: ["--check (vérifie sans modifier)", "rien (il modifie)", "--force", "--fix"], a: 0, exp: "La CI vérifie, ne réécrit pas." },
    { type: "qcm", q: "Le formateur supprime…", opts: ["Les bugs", "Les débats de style en revue (la machine tranche)", "Les tests", "Les branches"], a: 1, exp: "La revue pense, la machine formate." },
    { type: "qcm", q: "La couverture mesure…", opts: ["La vitesse", "La part du code traversée par les tests", "La qualité des assertions", "Le nombre de commits"], a: 1, exp: "Stmts/Miss/Cover." },
    { type: "qcm", q: "70 % sur views.py signale…", opts: ["Un record", "Des vues sans filet de test", "Une erreur ruff", "Rien"], a: 1, exp: "Le détecteur de trous." },
    { type: "vf", q: "80 % de couverture garantit que le code est bien testé.", a: false, exp: "Traverser ≠ vérifier : les assertions font la qualité." },
    { type: "vf", q: "40 % de couverture garantit que des pans entiers n'ont aucun filet.", a: true, exp: "Ce que la mesure dit à coup sûr." },
    { type: "qcm", q: "--fail-under=80 fait…", opts: ["Formater", "Échouer le job si la couverture descend sous 80 %", "Monter à 80 %", "Rien"], a: 1, exp: "Le cliquet anti-recul." },
    { type: "qcm", q: "Le seuil se règle…", opts: ["À 100 % d'office", "Au niveau actuel, pour empêcher de reculer", "À 0", "Au hasard"], a: 1, exp: "On le remonte au fil des progrès." },
    { type: "qcm", q: "tests et qualite tournent en parallèle car…", opts: ["needs: les relie", "Aucun needs: entre eux", "GitHub le devine", "C'est impossible"], a: 1, exp: "Pipeline rapide." },
    { type: "qcm", q: "L'intérêt du parallélisme :", opts: ["Plus de CPU consommé", "Le verdict complet arrive plus vite", "Moins de jobs", "Aucun"], a: 1, exp: "~3 min au lieu de 3 min 30." },
    { type: "qcm", q: "Le job qualite installe…", opts: ["Tout requirements.txt", "Juste ruff (il n'exécute pas l'app)", "MySQL", "Docker"], a: 1, exp: "Minimal = rapide." },
    { type: "qcm", q: "Un fichier mal formaté poussé en PR…", opts: ["Passe", "Rend le job qualite rouge → merge bloqué (leçon 14)", "Est reformaté par la CI", "Supprime la PR"], a: 1, exp: "Le contrat s'applique." }
  ],
  final: {
    title: "Exercice final — La qualité en pipeline",
    intro: `<p>Lint, format et couverture rejoignent la CI.</p>`,
    questions: [
      { type: "qcm", q: "Le job qualite exécute :", opts: ["ruff check . puis ruff format --check .", "ruff format . (modifiant)", "manage.py test", "docker build"], a: 0, exp: "Vérification pure." },
      { type: "qcm", q: "La couverture s'exécute :", opts: ["Avec les tests (coverage run manage.py test) + report --fail-under", "sans base", "en prod", "à la main"], a: 0, exp: "Sur le job avec MySQL." },
      { type: "qcm", q: "tests et qualite :", opts: ["En parallèle (pas de needs entre eux)", "en série obligatoire", "un seul job", "au choix de GitHub"], a: 0, exp: "Rapidité." },
      { type: "qcm", q: "Le seuil initial :", opts: ["Le niveau actuel du projet", "100 %", "0 %", "50 % toujours"], a: 0, exp: "Cliquet anti-recul." },
      { type: "vf", q: "La revue de code ne débat plus du style.", a: true, exp: "ruff a tranché une fois pour toutes." }
    ],
    solution: `<pre class="pseudo">  qualite:                                   # le job qualité
    runs-on: ubuntu-latest                   # machine neuve
    steps:
      - uses: actions/checkout@v4            # récupérer le code
      - uses: actions/setup-python@v5        # installer Python…
        with: { python-version: "3.14" }      # …version 3.14
      - run: pip install ruff                # installer ruff seulement (rapide)
      - run: ruff check .                    # lint : erreurs évidentes
      - run: ruff format --check .           # vérifier le formatage sans modifier

  # dans le job tests (avec le service MySQL) :
      - run: |                               # | = bloc de plusieurs commandes shell
          pip install coverage               # installer l'outil de couverture
          coverage run manage.py test        # lancer les tests en mesurant la couverture
          coverage report --fail-under=80    # échouer si la couverture passe sous 80 %</pre>
<p>Style tranché, filets mesurés. Demain : l'image Docker se construit en CI.</p>`
  }
};
</script>
