<script>
var DAY = {
  num: 18,
  title: "Environnements : staging, production, approbations",
  subtitle: "Une répétition générale automatique, une première décidée par un humain.",
  theory: `
<h3>1. Pourquoi staging ?</h3>
<p>Déployer <code>main</code> directement en <strong>production</strong> (le serveur des vrais clients) est brutal : la première rencontre du code avec le monde réel se ferait devant les utilisateurs. <strong>Staging</strong> (« mise en scène », « pré-production ») est un second serveur qui sert de <strong>scène de répétition</strong> — mêmes conteneurs, même compose, mais avec des données de test — où les surprises se produisent <em>avant</em> d'atteindre les clients.</p>

<h3>2. Les environnements GitHub</h3>
<pre class="pseudo">Settings → Environments : staging / production   # un "environnement" GitHub = une cible de déploiement nommée, avec ses propres réglages
# chaque environnement a :
#   SES secrets (SSH_PRIVATE_KEY de staging ≠ production)   # des secrets cloisonnés : la clé de staging n'ouvre pas la prod
#   SES règles  (production : required reviewers = approbation humaine)   # "required reviewers" = personnes devant approuver avant déploiement
# un job cible un environnement avec : environment: staging   # la ligne "environment:" rattache un job à un environnement</pre>
<p>Un <strong>environnement</strong> est une cible de déploiement déclarée dans GitHub, avec ses secrets et ses règles propres. <strong>Required reviewers</strong> (« relecteurs requis ») impose qu'un humain approuve avant que le déploiement parte.</p>

<h3>3. Le flux à deux étages</h3>
<pre class="pseudo"># ci.yml — le merge sur main déploie STAGING, automatiquement
  deployer-staging:
    if: github.ref == 'refs/heads/main'     # if = condition : ce job ne tourne QUE si la référence est la branche main (pas sur les PR)
    environment: staging                    # ce job vise l'environnement "staging" (donc ses secrets à lui)
    needs: [tests, qualite, image]          # après que tests, qualite et image soient verts
    steps: [ ...ssh staging.ludotheque... pull/up/migrate/curl... ]   # les mêmes étapes qu'en leçon 17, mais vers le serveur de staging

# release.yml — le tag déploie PRODUCTION, après accord
  deployer-production:
    environment: production                 # vise l'environnement "production" ; required reviewers : 1 → attend une approbation
    needs: publier                          # après la publication de l'image
    steps: [ ...ssh ludotheque.example.com... ]   # les mêmes étapes, vers le serveur de production</pre>

<h3>4. L'approbation : l'humain décide du moment</h3>
<pre class="pseudo">tag poussé → image publiée → le job production s'affiche « Waiting »   # "Waiting" = en attente : le job est en pause, il attend le feu vert
→ un reviewer désigné clique « Approve and deploy »                   # un relecteur autorisé approuve et lance le déploiement
→ le déploiement part — tracé : qui a approuvé, quand                 # GitHub enregistre l'auteur et l'heure de l'approbation</pre>
<p>L'automatisation <strong>exécute</strong>, l'humain <strong>décide du moment</strong> : lundi matin plutôt que vendredi soir, après la recette staging plutôt qu'avant.</p>

<h3>5. Le cloisonnement des secrets</h3>
<p>La clé de staging ne peut pas toucher la production : un pipeline (ou un environnement) compromis ne donne que <strong>son</strong> étage. C'est le <strong>cloisonnement</strong> (séparer en compartiments étanches). Même logique que les rôles de la Ludothèque — le vendeur ne gère pas les comptes.</p>
<div class="warn">Staging n'est utile que s'il <strong>ressemble</strong> à la production : mêmes images, même compose, même MySQL 8.4. Un staging « à peu près pareil » valide à peu près rien — la seule différence tolérée : les données (jeu de test) et la taille (plus petit).</div>
<div class="tip">Le flux complet devient : PR verte → merge → <strong>staging se met à jour seul</strong> → on <em>recette</em> (on vérifie manuellement) → tag → <strong>production après un clic</strong>. Chaque étape existe déjà (leçons 9-17) — cette leçon ne fait que les répartir sur deux étages.</div>`,
  exercises: [
    { type: "qcm", q: "Staging est…", opts: ["Un serveur de secours", "La scène de répétition : mêmes conteneurs, données de test", "La prod du pauvre", "Un backup"], a: 1, exp: "Les surprises AVANT les clients." },
    { type: "qcm", q: "Déployer main directement en prod expose…", opts: ["Rien", "La première rencontre du code avec le réel… devant les clients", "Les secrets", "Le YAML"], a: 1, exp: "D'où la répétition." },
    { type: "qcm", q: "Un environnement GitHub porte…", opts: ["Du CSS", "Ses secrets et ses règles (reviewers…)", "Des branches", "Des images"], a: 1, exp: "Settings → Environments." },
    { type: "qcm", q: "Un job cible un environnement par…", opts: ["environment: staging", "env: staging", "runs-on: staging", "needs: staging"], a: 0, exp: "La clé du mécanisme." },
    { type: "qcm", q: "Staging se déploie…", opts: ["Sur approbation", "Automatiquement à chaque merge sur main", "Sur tag", "Jamais"], a: 1, exp: "Tout, tout de suite — c'est son rôle." },
    { type: "qcm", q: "if: github.ref == 'refs/heads/main' évite…", opts: ["Les tests", "De déployer staging depuis les PR", "Les secrets", "Le cache"], a: 1, exp: "Seul le merge déploie." },
    { type: "qcm", q: "La production se déploie…", opts: ["À chaque commit", "Sur tag, APRÈS approbation humaine", "Jamais", "La nuit"], a: 1, exp: "required reviewers." },
    { type: "qcm", q: "« Waiting » sur le job production signifie…", opts: ["Un bug", "L'attente de l'approbation d'un reviewer désigné", "Un timeout", "Un conflit"], a: 1, exp: "L'humain décide du moment." },
    { type: "qcm", q: "L'approbation trace…", opts: ["Rien", "Qui a approuvé et quand", "Le CSS", "La météo"], a: 1, exp: "Auditabilité." },
    { type: "qcm", q: "L'automatisation exécute, l'humain…", opts: ["Regarde", "Décide du moment (et du contenu, via le tag)", "Tape les commandes", "Dort"], a: 1, exp: "La répartition saine." },
    { type: "qcm", q: "La clé SSH de staging…", opts: ["Ouvre aussi la prod", "Ne peut toucher QUE staging (cloisonnement)", "Est publique", "N'existe pas"], a: 1, exp: "Un étage compromis ≠ tout compromis." },
    { type: "vf", q: "Un staging « à peu près pareil » que la prod valide autant qu'un staging identique.", a: false, exp: "Mêmes images, même compose — sinon il ment." },
    { type: "qcm", q: "Les différences tolérées entre staging et prod :", opts: ["La version de MySQL", "Les données (jeu de test) et la taille", "Le compose", "Les images"], a: 1, exp: "Tout le reste : identique." },
    { type: "qcm", q: "La recette se fait…", opts: ["En prod", "Sur staging, après son déploiement automatique", "En local", "Jamais"], a: 1, exp: "Puis on tague en confiance." },
    { type: "vf", q: "Cette leçon n'invente rien : elle répartit les jobs existants sur deux étages.", a: true, exp: "Les briques 9-17, organisées." }
  ],
  final: {
    title: "Exercice final — Les deux étages",
    intro: `<p>Staging automatique, production approuvée : on assemble le flux.</p>`,
    questions: [
      { type: "qcm", q: "Le merge sur main déclenche :", opts: ["deployer-staging (automatique)", "la prod", "rien", "un tag"], a: 0, exp: "La répétition générale." },
      { type: "qcm", q: "Le tag v* déclenche :", opts: ["publier puis deployer-production (après approbation)", "staging", "les tests seuls", "un email"], a: 0, exp: "La première, décidée." },
      { type: "qcm", q: "Les secrets sont :", opts: ["Par environnement (staging ≠ production)", "partagés", "dans le YAML", "sur le bureau"], a: 0, exp: "Cloisonnés." },
      { type: "qcm", q: "L'approbation de prod est donnée par :", opts: ["Un reviewer désigné dans l'environnement", "n'importe qui", "le pipeline", "le client"], a: 0, exp: "Et c'est tracé." },
      { type: "vf", q: "Le flux : PR → merge → staging auto → recette → tag → approbation → prod.", a: true, exp: "Le CD complet, à deux étages." }
    ],
    solution: `<pre class="pseudo"># ci.yml
  deployer-staging:                             # job de déploiement vers staging
    if: github.ref == 'refs/heads/main'         # seulement quand on est sur main (donc après un merge)
    environment: staging                        # utilise les secrets de l'environnement staging
    needs: [tests, qualite, image]              # après les vérifications de CI
    steps: [ ssh staging... pull/up/migrate/curl ]   # déploie et vérifie (comme leçon 17), vers staging

# release.yml
  deployer-production:                          # job de déploiement vers la production
    environment: production        # required reviewers : 1   # attend l'approbation d'un relecteur désigné
    needs: publier                              # après la publication de l'image
    steps: [ ssh prod... pull/up/migrate/curl ]  # déploie et vérifie, vers la production</pre>
<p>Répétition automatique, première sur décision. Demain : et si ça tourne mal — rollback et migrations.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton organisation d'environnements…",
  items: [
  { id: "cicd-l18", title: "La recette de staging", level: 2,
    statement: "Rédige la check-list de recette staging de la Ludothèque (celle qu'on déroule APRÈS le déploiement auto et AVANT de taguer) : 6-8 points concrets couvrant le parcours critique (catalogue, connexion, louer, acheter, espaces par rôle, /sante/), qui la déroule, en combien de temps, et la règle de sortie (que faire si un point échoue).",
    hints: [
      "Le parcours critique = ce qui fait vivre la Ludothèque : consulter, louer, acheter.",
      "Chaque point : l'action + le résultat attendu, vérifiable en < 1 min.",
      "Échec → PAS de tag : fix par PR, staging se redéploie, recette rejouée."
    ],
    solution: "RECETTE STAGING — avant tout tag de version (~10 min, par l'auteur\nde la fonctionnalité + un autre membre, en binôme)\n\n1. /sante/ répond 200 (la base répond derrière).\n2. Catalogue : la recherche « catan » paginée renvoie des résultats,\n   les catégories filtrent.\n3. Connexion : compte de test client — session ouverte, menu adapté.\n4. LOUER : sur un jeu à stock connu → message de succès, stock -1\n   visible dans l'espace vendeur.\n5. ACHETER : montant affiché = prix du catalogue (le prix figé se voit).\n6. Stock épuisé : le jeu à stock 0 affiche le refus propre (pas de 500).\n7. Cloisonnement : le compte client sur /gestion/ → refus.\n8. La NOUVEAUTÉ de la version : son scénario nominal + son cas d'erreur\n   (ex. v1.1.0 : réserver un jeu indisponible, notification reçue).\n\nRÈGLE DE SORTIE\nUn point échoue → PAS de tag. Le fix suit le circuit normal (branche,\nPR, CI, merge) ; staging se redéploie seul ; la recette est REJOUÉE\nen entier (un fix peut casser un autre point). On ne « note pas pour\nplus tard » : staging rouge = release gelée.",
    note: "La recette ne reteste pas ce que la CI vérifie déjà (les 50 tests) : elle vérifie ce que les tests automatiques voient mal — les parcours complets, les yeux d'un humain sur l'interface, la nouveauté en conditions réelles. Courte et rituelle, elle reste faite ; longue et exhaustive, elle serait sautée dès la deuxième semaine." }
  ]
};
