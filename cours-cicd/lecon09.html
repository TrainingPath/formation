<script>
var DAY = {
  num: 9,
  title: "Premier workflow GitHub Actions",
  subtitle: "Un fichier YAML dans le dépôt, exécuté à chaque push.",
  theory: `
<h3>0. GitHub Actions et le YAML : le vocabulaire de la semaine</h3>
<p><strong>GitHub Actions</strong> est le service de CI/CD intégré à GitHub : il lit des fichiers de configuration dans ton dépôt et exécute automatiquement les tâches qu'ils décrivent. Ces fichiers sont écrits en <strong>YAML</strong> (prononcé « yamel ») : c'est un <strong>format texte pour décrire de la configuration</strong> sous forme de listes et de couples <em>clé: valeur</em>. Sa particularité : la structure est donnée par l'<strong>indentation</strong> (le décalage en début de ligne, avec des espaces). Un fichier de configuration GitHub Actions s'appelle un <strong>workflow</strong> (« flux de travail ») ; il contient un ou plusieurs <strong>jobs</strong> (tâches), et chaque job contient des <strong>steps</strong> (étapes) exécutées dans l'ordre.</p>

<h3>1. Où vit le pipeline ?</h3>
<pre class="pseudo">.github/workflows/ci.yml     # emplacement imposé : le dossier .github/workflows/ à la racine du dépôt ; ci.yml = notre fichier
# GitHub détecte ce dossier et exécute les workflows qu'il contient   # dès qu'un .yml y apparaît, GitHub le prend en charge</pre>
<p>Le pipeline vit <strong>dans le dépôt</strong>, versionné comme le reste du code. L'automatisation suit donc les mêmes règles : historique, revue en PR, retours en arrière possibles.</p>

<h3>2. L'anatomie d'un workflow</h3>
<pre class="pseudo">name: CI                        # name = le nom du workflow, affiché dans l'onglet Actions

on:                             # on = les DÉCLENCHEURS : les événements qui lancent le workflow
  push:                         # événement "push" : quelqu'un envoie des commits
    branches: [main]            # …mais seulement quand ça concerne la branche main
  pull_request:                 # événement "pull_request" : une PR est ouverte ou mise à jour
    branches: [main]            # …ciblant main

jobs:                           # jobs = la liste des tâches (chaque job tourne sur sa propre machine indépendante)
  verifier:                     # "verifier" = le nom (choisi par nous) de ce job
    runs-on: ubuntu-latest      # runs-on = sur quelle machine ; ubuntu-latest = un Linux Ubuntu neuf, fourni par GitHub
    steps:                      # steps = les étapes du job, exécutées de haut en bas
      - uses: actions/checkout@v4          # uses = utiliser une ACTION toute faite ; checkout récupère le code du dépôt ; @v4 = version épinglée
      - uses: actions/setup-python@v5      # action qui installe Python sur la machine
        with:                              # with = les paramètres passés à l'action
          python-version: "3.14"           # …ici : la version de Python à installer
      - name: Installer les dépendances    # name = un libellé lisible pour cette étape
        run: pip install -r requirements.txt   # run = exécuter une commande shell ; installe les paquets listés dans requirements.txt
      - name: Vérification de base
        run: python manage.py check        # commande Django qui contrôle que le projet est bien configuré
        env:                               # env = variables d'environnement pour CETTE étape
          DJANGO_SECRET_KEY: cle-de-ci      # valeur jetable, juste pour faire tourner la CI (les vrais secrets : leçon 13)</pre>

<h3>3. uses contre run</h3>
<pre class="pseudo">uses: actions/checkout@v4    # uses = brancher une ACTION réutilisable (un bloc prêt à l'emploi publié sur le "marketplace" de GitHub)
                             # épinglée à une version (@v4) — exactement comme on épingle une image Docker à un tag
run: pip install ...         # run = lancer une commande shell, la même que tu taperais dans ton terminal</pre>
<p>Une <strong>action</strong> est un composant réutilisable (par exemple <code>actions/checkout</code>, publié sur le <strong>marketplace</strong>, la boutique d'actions de GitHub). <code>checkout</code> est indispensable : sans lui, la machine démarre <strong>vide</strong>, sans ton code.</p>

<h3>4. La machine éphémère</h3>
<p>Chaque job démarre sur un <strong>runner neuf</strong> (le <strong>runner</strong> est la machine qui exécute le job ; <code>ubuntu-latest</code> en fournit un tout propre) : rien d'installé de la veille, rien de « chez moi ». <strong>Éphémère</strong> veut dire « qui ne dure pas » : la machine est jetée après usage. C'est le même principe que les conteneurs Docker — l'environnement est reconstruit à chaque fois, donc reproductible à l'identique.</p>

<h3>5. Suivre l'exécution</h3>
<pre class="pseudo">GitHub → onglet Actions → le workflow → chaque step avec ses logs   # "logs" = les messages produits par chaque étape (ce qui s'est affiché)
✓ vert : tout est passé   ✗ rouge : le step fautif est déplié, logs à l'appui   # en cas d'échec, GitHub ouvre l'étape en faute et montre l'erreur</pre>
<div class="warn">Le YAML est sensible à l'<strong>indentation</strong> (espaces, pas de tabulations). Une erreur de structure = un workflow qui ne se déclenche pas ou échoue étrangement — l'onglet Actions affiche les erreurs de syntaxe.</div>
<div class="tip">Épingle les actions (<code>@v4</code>, <code>@v5</code>) comme tu épingles les images Docker : une action non versionnée peut changer de comportement — même logique, mêmes raisons.</div>`,
  exercises: [
    { type: "qcm", q: "Les workflows vivent dans…", opts: [".github/workflows/", "/etc/ci/", "le serveur de prod", "un clic de config"], a: 0, exp: "Dans le dépôt, versionnés." },
    { type: "qcm", q: "L'avantage du pipeline versionné :", opts: ["Aucun", "Historique, revue en PR, retour arrière — comme le code", "Il tourne sans runner", "Il se configure en un clic"], a: 1, exp: "L'infra suit les règles du code." },
    { type: "qcm", q: "on: définit…", opts: ["Le nom", "Les déclencheurs (push, pull_request…)", "Les secrets", "Le serveur"], a: 1, exp: "Quand le workflow s'exécute." },
    { type: "qcm", q: "Notre workflow se déclenche sur…", opts: ["push et pull_request vers main", "chaque sauvegarde de fichier", "un cron uniquement", "un clic manuel uniquement"], a: 0, exp: "Le contrat de la leçon 8." },
    { type: "qcm", q: "runs-on: ubuntu-latest signifie…", opts: ["Mon PC", "Une machine neuve fournie par GitHub à chaque exécution", "Le serveur de prod", "Un conteneur MySQL"], a: 1, exp: "Le runner éphémère." },
    { type: "qcm", q: "uses: fait appel à…", opts: ["Une commande shell", "Une action réutilisable (marketplace), versionnée", "Un secret", "Un job"], a: 1, exp: "checkout, setup-python…" },
    { type: "qcm", q: "run: exécute…", opts: ["Une action du marketplace", "Une commande shell, comme dans ton terminal", "Un job entier", "Un déploiement"], a: 1, exp: "pip install, manage.py…" },
    { type: "qcm", q: "actions/checkout@v4 sert à…", opts: ["Installer les dépendances", "Récupérer le code du commit dans le runner", "Créer une branche", "Pousser"], a: 1, exp: "Sans lui, le runner est vide." },
    { type: "qcm", q: "Le @v4 de checkout@v4 est…", opts: ["Un identifiant de commit", "L'épinglage de version (comme un tag d'image Docker)", "Un numéro de job", "Le nombre d'essais"], a: 1, exp: "Même logique, mêmes raisons." },
    { type: "qcm", q: "Chaque job démarre…", opts: ["Sur la machine d'hier", "Sur un runner NEUF : rien d'installé de la veille", "Sur mon poste", "Sur le même runner que la veille"], a: 1, exp: "Reproductible par construction." },
    { type: "vf", q: "Le runner neuf réfute le « ça marche chez moi », comme les conteneurs.", a: true, exp: "Même principe." },
    { type: "qcm", q: "Les logs d'exécution se lisent…", opts: ["Dans l'onglet Actions, step par step", "dans le fichier ci.yml", "dans les Settings du dépôt", "dans le terminal local"], a: 0, exp: "Le step rouge est déplié." },
    { type: "qcm", q: "Le YAML est sensible à…", opts: ["La casse des commentaires", "L'indentation (espaces, pas de tabulations)", "La longueur des noms", "L'ordre des clés"], a: 1, exp: "Structure = espaces." },
    { type: "qcm", q: "DJANGO_SECRET_KEY: cle-de-ci dans le YAML est acceptable car…", opts: ["C'est un vrai secret", "C'est une valeur jetable de CI, pas un secret de prod", "GitHub la chiffre", "Personne ne lit le YAML"], a: 1, exp: "Les vrais secrets : leçon 13." },
    { type: "qcm", q: "env: au niveau d'un step définit…", opts: ["Des variables d'environnement pour ce step", "Le runner", "Le déclencheur", "La branche"], a: 0, exp: "Comme -e en Docker." }
  ],
  final: {
    title: "Exercice final — Le squelette qui tourne",
    intro: `<p>Le premier workflow de la Ludothèque s'exécute au push.</p>`,
    questions: [
      { type: "qcm", q: "Le fichier :", opts: [".github/workflows/ci.yml", "ci.txt à la racine", "/etc/github.yml", "un réglage cliqué"], a: 0, exp: "Détecté par GitHub." },
      { type: "qcm", q: "Les déclencheurs :", opts: ["on: push + pull_request (branches main)", "on: cron seul", "on: manuel", "on: release seul"], a: 0, exp: "Le contrat." },
      { type: "qcm", q: "Les deux premières étapes :", opts: ["checkout@v4 puis setup-python@v5", "pip d'abord", "docker build", "ssh"], a: 0, exp: "Le code, puis l'outil." },
      { type: "qcm", q: "La vérification de ce squelette :", opts: ["python manage.py check", "les 50 tests déjà", "un déploiement", "le docker build"], a: 0, exp: "Les tests complets : demain." },
      { type: "vf", q: "Un push suffit maintenant à déclencher une machine neuve qui vérifie le commit.", a: true, exp: "La CI est née." }
    ],
    solution: `<pre class="pseudo">name: CI                                        # nom du workflow
on:                                             # déclencheurs
  push: { branches: [main] }                    # sur push vers main ({ } = écriture compacte du même bloc qu'au-dessus)
  pull_request: { branches: [main] }            # et sur PR vers main
jobs:                                           # les tâches
  verifier:                                     # un job nommé "verifier"
    runs-on: ubuntu-latest                      # machine Ubuntu neuve
    steps:                                      # ses étapes
      - uses: actions/checkout@v4               # récupérer le code
      - uses: actions/setup-python@v5           # installer Python
        with: { python-version: "3.14" }        # …version 3.14
      - run: pip install -r requirements.txt    # installer les dépendances
      - run: python manage.py check             # vérifier la configuration
        env: { DJANGO_SECRET_KEY: cle-de-ci }   # variable jetable pour la CI</pre>
<p>Le squelette est vert dans l'onglet Actions. Demain : y brancher les vrais tests — avec MySQL.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton premier workflow…",
  items: [
  { id: "cicd-l9", title: "Le workflow annoté", level: 2,
    statement: "Écris le fichier .github/workflows/ci.yml complet du squelette de CI de la Ludothèque, avec un commentaire au-dessus de CHAQUE ligne significative expliquant son rôle (déclencheurs, runner, checkout, setup-python, cache pip éventuel, dépendances, check). Bonus : ajoute le déclencheur manuel workflow_dispatch et explique son usage.",
    hints: [
      "workflow_dispatch: permet le bouton « Run workflow » — pratique pour déboguer.",
      "actions/setup-python@v5 accepte cache: 'pip' — les dépendances en cache entre exécutions.",
      "Chaque commentaire : # <quoi> — <pourquoi>."
    ],
    atoi: { cmd: "# .github/workflows/ci.yml\non:\n  push: { branches: [main] }\n  pull_request: { branches: [main] }\n  workflow_dispatch:\njobs:\n  verifier:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with: { python-version: \"3.14\" }\n      - run: pip install -r requirements.txt\n      - run: python manage.py check", expected: "À chaque push ou PR sur main, GitHub démarre le job verifier sur un runner ubuntu-latest neuf, exécute checkout → setup-python → pip install → python manage.py check, et le workflow se termine vert (check passé). Le déclencheur workflow_dispatch ajoute un bouton « Run workflow » pour relancer le même pipeline à la main, sans commit artificiel." },
    checklist: [
      "As-tu commenté chaque ligne significative avec le format # <quoi> — <pourquoi> ?",
      "As-tu inclus les trois déclencheurs push, pull_request ET workflow_dispatch ?",
      "As-tu épinglé les actions (checkout@v4, setup-python@v5) et fixé la version de Python ?",
      "As-tu expliqué que DJANGO_SECRET_KEY est une valeur jetable de CI, pas un vrai secret ?"
    ],
    solution: "# .github/workflows/ci.yml\n# Le nom affiché dans l'onglet Actions et sur les badges\nname: CI\n\n# Déclencheurs : chaque push sur main, chaque PR visant main,\n# et le bouton manuel (débogage sans commit artificiel)\non:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n  workflow_dispatch:\n\njobs:\n  verifier:\n    # Machine NEUVE fournie par GitHub à chaque exécution :\n    # rien d'hier, rien de « chez moi »\n    runs-on: ubuntu-latest\n    steps:\n      # Récupère le code du commit qui a déclenché — sans lui, runner vide\n      - uses: actions/checkout@v4\n\n      # Installe Python 3.14 (la version de l'image Docker : cohérence)\n      # cache: pip — les paquets téléchargés sont réutilisés entre runs\n      - uses: actions/setup-python@v5\n        with:\n          python-version: \"3.14\"\n          cache: \"pip\"\n\n      # Les dépendances exactes du projet (requirements.txt versionné)\n      - name: Installer les dépendances\n        run: pip install -r requirements.txt\n\n      # Première vérification : la config du projet est saine\n      # (les vrais tests + MySQL arrivent au job suivant, leçon 10)\n      - name: Vérification de base\n        run: python manage.py check\n        env:\n          # valeur JETABLE de CI — les vrais secrets : leçon 13\n          DJANGO_SECRET_KEY: cle-de-ci",
    note: "workflow_dispatch évite le péché classique du débogage de CI : des commits « test ci » en rafale pour re-déclencher. Le cache pip fait gagner ~30 s par exécution — sur des dizaines de runs quotidiens, c'est significatif. Et la version Python est LA MÊME que dans le Dockerfile : un pipeline qui teste avec 3.14 et livre du 3.13 ne prouve rien." }
  ]
};
</script>
