  theory: `
<h3>Récapitulatif avant l'épreuve</h3>
<p>Vingt et une leçons, et un commit tagué (un enregistrement marqué d'une étiquette de version) se déploie désormais tout seul : <strong>testé</strong> (les tests automatiques passent), <strong>construit</strong> (l'image Docker est fabriquée), <strong>publié</strong> (envoyé au registre), <strong>livré</strong> (installé sur le serveur), <strong>vérifié</strong> (sa santé est contrôlée). Récapitulons chaque étage. Tous les mots ci-dessous ont été définis dans les leçons indiquées — c'est le moment de vérifier qu'ils te sont devenus familiers.</p>

<h3>1. Git avancé (semaine 1)</h3>
<p>Un dépôt <strong>propre</strong> (commits atomiques normés, .gitignore pour exclure secrets et fichiers générés), des <strong>branches courtes</strong> par chantier (une branche = une étiquette mobile sur un commit), les <strong>conflits</strong> résolus en conscience (deux versions d'une même ligne, à trancher), le <strong>distant</strong> comme scène commune (la copie du dépôt en ligne), le <strong>GitHub Flow</strong> écrit (les règles d'équipe), la <strong>pull request</strong> relue à quatre yeux (la demande de fusion, relue par un collègue), et l'histoire soignée (<strong>rebase/amend/stash</strong>) — jamais réécrite quand elle est partagée (la règle d'or).</p>

<h3>2. L'intégration continue (semaine 2)</h3>
<p>Un <strong>pipeline</strong> dans le dépôt (GitHub Actions, écrit en YAML) exécute à chaque push le contrat : <strong>tests</strong> (avec un MySQL de service, un conteneur d'appoint), <strong>qualité</strong> (ruff pour le lint et le format, couverture avec seuil-cliquet), <strong>image</strong> (build + smoke test pour prouver qu'elle démarre). Les <strong>secrets</strong> (jetons, clés) vivent hors YAML, à portée minimale. La <strong>protection de branche</strong> rend le tout inviolable : pas de vert, pas de merge — admins compris.</p>

<h3>3. Le déploiement continu (semaine 3)</h3>
<p>Le <strong>tag semver</strong> (le numéro MAJEURE.MINEURE.PATCH, avec changelog généré des commits normés) déclenche la <strong>publication</strong> de l'image (alignée au tag Git), puis le <strong>déploiement</strong> : staging automatique au merge (la répétition générale), production sur <strong>approbation</strong> (un humain valide le moment) — et le <strong>rollback</strong> (retour arrière) reste trivial grâce aux images immuables et aux migrations <strong>N-1</strong> (compatibles avec la version précédente).</p>

<h3>Le trajet d'une fonctionnalité — et de la formation</h3>
<pre class="pseudo">git switch -c feature/notification → commits normés → push → PR   # créer la branche, committer proprement, publier, ouvrir la pull request
  → CI : tests + qualité + image → revue → merge (protégé)         # la CI vérifie, un humain relit, la fusion n'est permise que si tout est vert
  → staging auto → recette → git tag v1.2.0 → image publiée        # staging se déploie seul ; après recette, on tague ; le tag publie l'image
  → approbation → prod : pull, up -d, migrate → /sante/ 200 ✔      # un humain approuve ; la prod se met à jour ; la santé est vérifiée (200 = OK)

Sous ce trajet : l'algo, le langage, le framework, la base née de   # rappel : ce cours s'appuie sur toute la formation…
Merise, l'application du Niveau 6, les conteneurs du cours Docker.   # …chaque couche construite lors des cours précédents</pre>
<div class="tip">Ce qui reste manuel est ce qui doit l'être : écrire le code et les tests, relire, décider du tag, approuver la prod. <strong>Les décisions.</strong> Tout le reste : la machine. Bonne épreuve — la dernière !</div>`,

  ],

<p>🎓 <strong>Félicitations — pour ce cours, et pour toute la formation !</strong> De l'algorithmique à la livraison automatisée, en passant par un langage, un framework, une base conçue en Merise, une application complète et ses conteneurs : la Ludothèque t'a accompagné de la première variable au pipeline de production. Tu as désormais le quotidien complet d'un développeur professionnel entre les mains.</p>`
