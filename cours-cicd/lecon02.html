  title: "Les branches : travailler en parallèle",
  subtitle: "Isoler chaque chantier — main reste toujours livrable.",
  theory: `
<h3>1. Le problème que les branches résolvent</h3>
<p>Rappel : dans un dépôt Git, l'<strong>historique</strong> est la suite des <strong>commits</strong> (les enregistrements successifs du projet). La ligne principale de cette histoire s'appelle par convention <code>main</code> (« principale » en anglais) : c'est la version <strong>de référence</strong>, celle que l'on doit pouvoir livrer à tout moment.</p>
<p>Imaginons maintenant deux développeurs qui travaillent sur deux fonctionnalités différentes (les réservations d'un côté, les nouveaux tarifs de l'autre) directement sur <code>main</code> : leurs commits s'entremêlent, et plus rien n'est livrable tant que les deux chantiers ne sont pas terminés — car <code>main</code> contient en permanence du travail à moitié fait. La solution s'appelle la <strong>branche</strong> : elle <strong>isole</strong> (sépare) chaque chantier dans son propre espace.</p>

<h3>2. Qu'est-ce qu'une branche ?</h3>
<p>Contrairement à ce qu'on imagine, une branche n'est <strong>pas</strong> une copie des fichiers. C'est simplement une <strong>étiquette</strong> (un nom) qui pointe vers un commit et qui <strong>avance automatiquement</strong> à chaque nouveau commit que tu fais dessus.</p>
<pre class="pseudo">Une branche = une ÉTIQUETTE MOBILE sur un commit. C'est tout.
main                 → a1b2c3d          # l'étiquette "main" pointe vers le commit a1b2c3d (identifiant abrégé)
feature/reservations → b2c3d4e          # l'étiquette "feature/reservations" pointe vers un autre commit
                                        # (elle avance d'un cran à CHAQUE commit fait sur cette branche)
HEAD = « où je suis »                    # HEAD est un pointeur spécial qui indique la branche ACTUELLEMENT active</pre>
<p><strong>HEAD</strong> (mot anglais pour « tête ») est le repère « tu es ici » : il désigne la branche sur laquelle tu travailles en ce moment. Comme une branche n'est qu'un nom, la créer est <strong>instantané et gratuit</strong> : aucun fichier n'est copié.</p>

<h3>3. Les gestes de base</h3>
<pre class="pseudo">git switch -c feature/reservations   # switch = changer de branche ; -c = create : CRÉE la branche ET bascule dessus
git switch main                      # revenir sur la branche main (sans -c, car elle existe déjà)
git branch -v                        # lister toutes les branches ; -v = verbose : montre aussi leur dernier commit
git branch -d feature/x              # -d = delete : SUPPRIMER la branche (Git refuse si son travail n'est pas fusionné)
git branch -D feature/x              # -D majuscule = FORCER la suppression, même si non fusionnée (travail perdu, assumé)</pre>
<p><strong>Fusionner</strong> (en anglais <em>merge</em>) veut dire réunir le travail d'une branche dans une autre ; on le verra en détail leçon 3. <code>git branch -d</code> ne supprime en sécurité qu'une branche déjà fusionnée ; <code>-D</code> force la suppression en toute connaissance de cause.</p>

<h3>4. Chaque branche a son propre état</h3>
<pre class="pseudo">$ git switch -c feature/reservations              # on crée la branche et on bascule dessus
$ echo "..." > catalogue/reservations.py          # echo écrit du texte ; > crée/remplit le fichier reservations.py
$ git add . && git commit -m "feat: ébauche du service de réservation"
# git add . = sélectionne TOUS les changements ; && = "puis, si ça réussit" ; commit -m = enregistre avec ce message
$ git switch main                                 # on repart sur main
$ ls catalogue/reservations.py                    # ls liste un fichier → ici : "introuvable" ! le fichier n'existe pas sur main</pre>
<p>En basculant de branche, Git <strong>réécrit le répertoire de travail</strong> (tes fichiers sur le disque) pour qu'il corresponde à la branche visée : chaque branche montre <strong>son</strong> monde, avec ses fichiers et ses commits à elle.</p>

<h3>5. Bien nommer les branches</h3>
<pre class="pseudo">feature/reservations     # préfixe "feature/" = une nouvelle fonctionnalité
fix/stock-negatif        # préfixe "fix/" = une correction de bug
chore/maj-django         # préfixe "chore/" = de l'entretien (mise à jour d'un outil)
# règle d'or : des branches COURTES (heures ou jours) et UN seul sujet par branche</pre>
<div class="warn">Basculer avec des modifications <strong>non committées</strong> (pas encore enregistrées) qui seraient écrasées : Git <strong>refuse</strong> pour protéger ton travail. Il faut committer d'abord, ou utiliser <code>git stash</code> (une commande qui met de côté temporairement les changements, vue leçon 7) — jamais de bascule « en force ».</div>
<div class="tip">Une branche ratée se jette (<code>git branch -D</code>) sans laisser de trace dans main : c'est un <strong>brouillon gratuit</strong>. Expérimente sans peur — c'est exactement à ça que ça sert.</div>`,

    { type: "qcm", q: "Après un commit sur feature/…, main…", opts: ["Contient aussi le commit", "N'a pas bougé", "Est supprimée", "Avance seule"], a: 1, exp: "Isolation des chantiers." },
    { type: "qcm", q: "En basculant de branche, le répertoire de travail…", opts: ["Ne change pas", "Est réécrit pour montrer l'état de la branche", "Est vidé", "Est dupliqué"], a: 1, exp: "Chaque branche, son monde." },
    { type: "qcm", q: "Un bon nom de branche :", opts: ["truc", "fix/stock-negatif", "branche2", "final-final-v3"], a: 1, exp: "type/sujet." },
    { type: "qcm", q: "La durée de vie idéale d'une branche :", opts: ["Des mois", "Courte : heures ou jours", "Éternelle", "Une année"], a: 1, exp: "Moins de divergence = moins de conflits." },
    { type: "qcm", q: "git branch -d refuse si…", opts: ["La branche n'est pas fusionnée (travail perdu)", "Il pleut", "La branche est vieille", "Jamais"], a: 0, exp: "-D force, en connaissance de cause." },
    { type: "qcm", q: "Basculer avec des modifications non committées qui seraient écrasées :", opts: ["Git écrase", "Git refuse : committer ou stash d'abord", "Git fusionne", "Git supprime la branche"], a: 1, exp: "Protection du travail." },
    { type: "vf", q: "Une expérimentation ratée sur une branche laisse des traces dans main.", a: false, exp: "branch -D et il n'en reste rien." },
    { type: "qcm", q: "main doit rester en permanence…", opts: ["Vide", "Livrable", "Verrouillée à clé", "Sur mon poste"], a: 1, exp: "Le principe du workflow (leçon 5)." }
  ],
  final: {
    title: "Exercice final — Deux chantiers en parallèle",
    intro: `<p>Réservations et tarifs avancent chacun sur leur branche.</p>`,
    questions: [
      { type: "qcm", q: "Ouvrir le chantier réservations :", opts: ["git switch -c feature/reservations", "git branch main", "git new reservations", "mkdir"], a: 0, exp: "Créer + basculer." },
      { type: "qcm", q: "Committer dessus affecte…", opts: ["Seulement feature/reservations", "main aussi", "toutes les branches", "le distant"], a: 0, exp: "Isolation." },
      { type: "qcm", q: "Ouvrir le second chantier depuis main :", opts: ["git switch main puis git switch -c feature/tarifs", "depuis la 1re branche", "git copy", "impossible"], a: 0, exp: "Chaque branche part de main." },
      { type: "qcm", q: "Vérifier l'état des trois branches :", opts: ["git branch -v", "ls", "git status seul", "git diff"], a: 0, exp: "La vue d'ensemble." },
      { type: "vf", q: "main est restée identique pendant que les deux chantiers avançaient.", a: true, exp: "Toujours livrable." }
    ],
    solution: `<pre class="pseudo">$ git switch -c feature/reservations            # chantier 1 : on crée sa branche et on bascule dessus
$ ... code ... && git commit -m "feat: ébauche du service de réservation"   # on code puis on committe sur CETTE branche

$ git switch main                               # on revient sur main (intacte)
$ git switch -c feature/tarifs                  # chantier 2 : sa propre branche, partie de main
$ ... code ... && git commit -m "feat: tarif dégressif à la semaine"        # on committe, isolé du chantier 1

$ git branch -v                                 # on liste les branches et leur dernier commit
  feature/reservations  b2c3d4e feat: ébauche du service de réservation      # chantier 1
* feature/tarifs        c3d4e5f feat: tarif dégressif à la semaine           # * = branche active (HEAD est ici)
  main                  a1b2c3d feat: pagination du catalogue   ← intact     # main n'a PAS bougé : toujours livrable</pre>
<p>Deux mondes parallèles, un main serein. Demain : les réunir — et survivre aux conflits.</p>`
  }
};
