<body>
<script>
var DAY = {
  num: 2,
  title: "Configuration : Hibernate, la connexion MySQL et show_sql",
  subtitle: "Trois dépendances, un fichier de config, et Hibernate se met à parler.",
  theory: `
<h3>1. Les dépendances Maven</h3>
<p>Posons d'abord le décor. <strong>Maven</strong> est l'outil qui construit ton projet Java et va chercher tout seul les bibliothèques dont il a besoin sur Internet. La liste de ces besoins se déclare dans un fichier nommé <strong>pom.xml</strong> (« Project Object Model »). Chaque brique externe s'appelle une <strong>dépendance</strong> : une bibliothèque écrite par d'autres que ton projet réutilise. Ce fichier est écrit en <strong>XML</strong>, un format où l'on ouvre une balise <code>&lt;truc&gt;</code> et on la referme <code>&lt;/truc&gt;</code>, comme des boîtes emboîtées. Un projet JPA/Hibernate a besoin de deux briques : le moteur ORM et le <strong>driver</strong> de ta base (le driver est le petit traducteur qui sait parler le protocole précis de MySQL).</p>
<pre class="pseudo">&lt;dependency&gt;                                 &lt;!-- une dépendance = une brique externe ajoutée au projet --&gt;
  &lt;groupId&gt;org.hibernate.orm&lt;/groupId&gt;        &lt;!-- groupId = l'organisation qui publie la brique --&gt;
  &lt;artifactId&gt;hibernate-core&lt;/artifactId&gt;     &lt;!-- artifactId = le nom de la brique : ici le moteur (inclut l'API JPA) --&gt;
&lt;/dependency&gt;                                &lt;!-- fin de la première dépendance --&gt;
&lt;dependency&gt;                                 &lt;!-- début de la deuxième brique --&gt;
  &lt;groupId&gt;com.mysql&lt;/groupId&gt;                &lt;!-- publiée par MySQL --&gt;
  &lt;artifactId&gt;mysql-connector-j&lt;/artifactId&gt;  &lt;!-- le driver JDBC qui sait parler à MySQL --&gt;
&lt;/dependency&gt;                                &lt;!-- fin de la deuxième dépendance --&gt;</pre>

<h3>2. Le fichier persistence.xml</h3>
<p>La configuration standard JPA vit dans le fichier <strong>src/main/resources/META-INF/persistence.xml</strong>. On y déclare une <strong>unité de persistance</strong> (<em>persistence-unit</em>) : c'est simplement un nom + la description de la connexion à la base. Chaque réglage s'écrit dans une balise <code>&lt;property&gt;</code> (« propriété » = un couple nom + valeur, comme un réglage dans un menu).</p>
<pre class="pseudo">&lt;persistence-unit name="ludothequePU"&gt;        &lt;!-- on nomme l'unité de persistance : "ludothequePU" --&gt;
  &lt;properties&gt;                                 &lt;!-- début de la liste des réglages --&gt;
    &lt;property name="jakarta.persistence.jdbc.url"                &lt;!-- réglage : l'adresse de la base... --&gt;
              value="jdbc:mysql://localhost:3306/ludotheque"/&gt;  &lt;!-- ...protocole jdbc:mysql, hôte localhost, port 3306, base ludotheque --&gt;
    &lt;property name="jakarta.persistence.jdbc.user"     value="root"/&gt;    &lt;!-- l'identifiant de connexion --&gt;
    &lt;property name="jakarta.persistence.jdbc.password" value="secret"/&gt;  &lt;!-- le mot de passe (local d'apprentissage seulement) --&gt;
    &lt;property name="hibernate.show_sql"    value="true"/&gt;  &lt;!-- afficher chaque requête SQL dans la console --&gt;
    &lt;property name="hibernate.format_sql"  value="true"/&gt;  &lt;!-- l'indenter joliment pour la rendre lisible --&gt;
  &lt;/properties&gt;                                &lt;!-- fin de la liste des réglages --&gt;
&lt;/persistence-unit&gt;                           &lt;!-- fin de l'unité de persistance --&gt;</pre>
<p>L'URL JDBC est exactement celle du cours MySQL : protocole, hôte, port 3306, nom de la base <em>ludotheque</em> créée au Niveau 4.</p>

<h3>3. show_sql : la fenêtre sur le moteur</h3>
<p><strong>hibernate.show_sql=true</strong> affiche dans la console (la fenêtre texte où le programme écrit ses messages) chaque requête SQL que Hibernate génère ; <strong>format_sql</strong> l'indente. C'est TON outil pédagogique numéro un : à chaque leçon, tu compareras ce que tu écris en Java et ce que Hibernate envoie à MySQL. Dans le SQL affiché, <code>j1_0</code> est un <strong>alias</strong> (un surnom court) que Hibernate donne à la table.</p>
<pre class="pseudo">Hibernate:                                        -- Hibernate annonce qu'il va exécuter une requête
    select j1_0.id, j1_0.titre, j1_0.prix_location -- SELECT : les colonnes demandées (j1_0 = surnom de la table jeu)
    from jeu j1_0                                  -- FROM : on lit dans la table jeu (surnommée j1_0)
    where j1_0.id = ?                              -- WHERE : on ne garde que la ligne dont l'id vaut la valeur du ?</pre>

<h3>4. Démarrer le moteur</h3>
<p>Le point d'entrée JPA : créer une <strong>EntityManagerFactory</strong> (« fabrique d'EntityManager ») à partir du nom de l'unité de persistance. Elle est coûteuse à créer → une seule pour toute l'application. À partir d'elle, on obtient des <strong>EntityManager</strong> : des objets légers et jetables qui servent au vrai travail (lire, écrire).</p>
<pre class="pseudo">EntityManagerFactory emf =                              // la FABRIQUE : objet lourd, créé une seule fois
    Persistence.createEntityManagerFactory("ludothequePU"); // on la construit à partir du nom de l'unité de persistance
EntityManager em = emf.createEntityManager();           // un EntityManager : léger et jetable (détaillé leçon 5)
// ... travail ...                                      // ici on ferait nos lectures/écritures d'objets
em.close();                                             // on ferme l'EntityManager dès qu'on a fini
emf.close();                                            // on ferme la fabrique à l'arrêt de l'application</pre>

<h3>5. Le lien avec Spring Boot</h3>
<p>Dans le cours Spring, tout cela existait déjà… caché. Le starter <em>spring-boot-starter-data-jpa</em> apporte Hibernate, et le fichier <strong>application.properties</strong> remplace persistence.xml. Un fichier <em>.properties</em> se lit ligne par ligne sous la forme <code>clé=valeur</code>, et un <code>#</code> en début de ligne marque un commentaire :</p>
<pre class="pseudo"># équivalents Spring Boot (fichier application.properties)
spring.datasource.url=jdbc:mysql://localhost:3306/ludotheque   # l'adresse de la base (même URL JDBC qu'au-dessus)
spring.datasource.username=root                               # l'identifiant de connexion
spring.jpa.show-sql=true                                      # afficher le SQL généré (équivalent de hibernate.show_sql)</pre>
<p>Même moteur, autre emballage. EF Core a sa chaîne de connexion dans appsettings.json, Laravel dans .env, Django dans settings.py : toujours la même idée.</p>
<div class="warn">Ne mets JAMAIS un vrai mot de passe en dur dans un fichier versionné : en projet réel, il vient d'une variable d'environnement. Ici on tolère le mot de passe local d'apprentissage, pas plus.</div>
<div class="tip">Active show_sql dès aujourd'hui et garde la console sous les yeux tout le cours : voir le SQL généré transforme Hibernate de boîte noire en boîte de verre.</div>`,
  exercises: [
    { type: "qcm", q: "Les deux dépendances Maven indispensables :", opts: ["hibernate-core et mysql-connector-j", "spring-web et junit", "hibernate-core et tomcat", "jdbc-api et php-connector"], a: 0, exp: "Le moteur ORM + le driver JDBC de ta base." },
    { type: "qcm", q: "Le fichier de configuration standard JPA s'appelle…", opts: ["persistence.xml", "hibernate.txt", "config.java", "web.xml"], a: 0, exp: "Dans src/main/resources/META-INF/." },
    { type: "qcm", q: "persistence.xml doit se trouver dans…", opts: ["src/main/resources/META-INF/", "la racine du disque", "target/classes/sql/", "src/test/java/"], a: 0, exp: "C'est l'emplacement normalisé où JPA le cherche." },
    { type: "input", q: "Quelle propriété Hibernate affiche le SQL généré dans la console ?", a: ["hibernate.show_sql", "show_sql"], ph: "nom.de.la.propriété", exp: "hibernate.show_sql=true : ta fenêtre sur le moteur." },
    { type: "qcm", q: "Une unité de persistance (persistence-unit) regroupe…", opts: ["Un nom + la configuration de connexion à une base", "Les tests unitaires", "Les fichiers CSS du projet", "Les logs du serveur"], a: 0, exp: "C'est elle qu'on nomme pour créer l'EntityManagerFactory." },
    { type: "qcm", q: "L'URL JDBC correcte pour la base ludotheque locale :", opts: ["jdbc:mysql://localhost:3306/ludotheque", "http://localhost/ludotheque", "mysql:jdbc@ludotheque:3306", "ftp://localhost:3306"], a: 0, exp: "Protocole jdbc:mysql, hôte, port 3306, nom de base — comme au cours MySQL." },
    { type: "vf", q: "L'EntityManagerFactory est coûteuse à créer : on n'en crée qu'une par application.", a: true, exp: "Une factory pour l'appli, des EntityManager légers et jetables." },
    { type: "qcm", q: "Persistence.createEntityManagerFactory(...) prend en paramètre…", opts: ["Le nom de l'unité de persistance", "Le mot de passe MySQL", "Le chemin du pom.xml", "Le nom de la classe main"], a: 0, exp: "Ici : ludothequePU, déclaré dans persistence.xml." },
    { type: "qcm", q: "hibernate.format_sql=true sert à…", opts: ["Indenter le SQL affiché pour le rendre lisible", "Accélérer les requêtes", "Chiffrer le SQL", "Traduire le SQL en français"], a: 0, exp: "Confort de lecture, à combiner avec show_sql." },
    { type: "qcm", q: "Dans Spring Boot, l'équivalent de show_sql est…", opts: ["spring.jpa.show-sql=true", "spring.mvc.debug=true", "server.port=3306", "logging.level=OFF"], a: 0, exp: "Même moteur Hibernate, configuré via application.properties." },
    { type: "vf", q: "Spring Boot utilise un autre ORM que Hibernate par défaut.", a: false, exp: "spring-boot-starter-data-jpa embarque Hibernate : c'est le même moteur." },
    { type: "input", q: "Sur quel port MySQL écoute-t-il par défaut ?", a: ["3306"], ph: "Numéro de port…", exp: "3306, comme vu au Niveau 4." },
    { type: "qcm", q: "Où doit vivre un vrai mot de passe de production ?", opts: ["Dans une variable d'environnement", "En dur dans persistence.xml versionné", "Dans un commentaire Java", "Dans le README public"], a: 0, exp: "Jamais de secret en dur dans un fichier versionné (cf. cours Sécurité, Niveau 7)." },
    { type: "qcm", q: "Le rôle de mysql-connector-j :", opts: ["C'est le driver JDBC qui parle le protocole MySQL", "C'est un ORM concurrent", "C'est un serveur web", "C'est un outil de migration"], a: 0, exp: "Hibernate génère le SQL, le driver le transporte jusqu'à MySQL." },
    { type: "qcm", q: "Chez les voisins, la connexion base se configure dans…", opts: [".env (Laravel), settings.py (Django), appsettings.json (EF Core)", "pom.xml partout", "index.html", "style.css"], a: 0, exp: "Même besoin, fichiers différents : URL, utilisateur, mot de passe." }
  ],
  final: {
    title: "Exercice final — Brancher la Ludothèque",
    intro: `<p>Tu configures le projet Maven de la Ludothèque : vérifions chaque pièce du branchement, du pom.xml à la première trace SQL.</p>`,
    questions: [
      { type: "qcm", q: "Il manque une dépendance et tu obtiens « No suitable driver ». Laquelle ?", opts: ["mysql-connector-j", "hibernate-core", "junit", "spring-web"], a: 0, exp: "Sans driver JDBC, Hibernate ne peut pas atteindre MySQL." },
      { type: "input", q: "Quel nom d'unité de persistance passes-tu à createEntityManagerFactory si persistence.xml déclare name=ludothequePU ?", a: ["ludothequePU", "\"ludothequePU\""], ph: "Le nom exact…", exp: "Le nom doit correspondre exactement à celui du persistence-unit." },
      { type: "qcm", q: "La console reste muette côté SQL. Que vérifier ?", opts: ["hibernate.show_sql=true dans les propriétés", "La version de Windows", "La couleur du terminal", "Le fichier style.css"], a: 0, exp: "C'est la propriété qui affiche chaque requête générée." },
      { type: "vf", q: "jakarta.persistence.jdbc.url est une propriété standard JPA, pas spécifique à Hibernate.", a: true, exp: "Préfixe jakarta.persistence = norme ; préfixe hibernate. = spécifique au moteur." },
      { type: "qcm", q: "Ordre de démarrage correct :", opts: ["createEntityManagerFactory → createEntityManager → travail → close", "createEntityManager → createEntityManagerFactory", "close → travail → open", "Aucun ordre n'est nécessaire"], a: 0, exp: "La factory d'abord (une fois), puis des EntityManager courts." }
    ],
    solution: `<pre class="pseudo">pom.xml        : hibernate-core + mysql-connector-j             # les 2 dépendances Maven : le moteur + le driver
persistence.xml: META-INF/ · unité "ludothequePU"              # le fichier de config JPA, à cet emplacement précis
  jakarta.persistence.jdbc.url = jdbc:mysql://localhost:3306/ludotheque  # où se trouve la base
  jakarta.persistence.jdbc.user / password                     # comment s'y connecter (identifiant + mot de passe)
  hibernate.show_sql = true · hibernate.format_sql = true       # voir le SQL généré, joliment indenté

Java : emf = Persistence.createEntityManagerFactory("ludothequePU")  # créer la fabrique (une seule fois)
       em  = emf.createEntityManager()   → console : "Hibernate: select..."  # créer un EM et voir la 1re trace SQL

Spring Boot = même moteur via application.properties (spring.jpa.show-sql)  # autre emballage, même Hibernate</pre>
<p>Le moteur tourne et tu vois son SQL. Demain : la première entité — transformer la table jeu en classe Java annotée.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {

  items: [
  { id: "hibernate-l2", title: "La checklist de branchement", level: 1,
    statement: "Rédige, comme pour un collègue qui rejoint le projet Ludothèque, la checklist complète pour brancher Hibernate sur la base MySQL du Niveau 4 : dépendances, fichier de configuration, propriétés indispensables, vérification que ça marche. Pour chaque élément, explique en une phrase POURQUOI il est nécessaire et quel symptôme apparaît s'il manque.",
    hints: [
      "Pars du pom.xml : quelles sont les deux briques et le symptôme si chacune manque ?",
      "Dans persistence.xml : URL, user, password, show_sql — que se passe-t-il si l'URL pointe sur une base inexistante ?",

    solution: "CHECKLIST — Brancher Hibernate sur ludotheque\n1. pom.xml : hibernate-core\n   Pourquoi : le moteur ORM. Sans lui : classes JPA introuvables à la compilation.\n2. pom.xml : mysql-connector-j\n   Pourquoi : le driver JDBC. Sans lui : erreur « No suitable driver ».\n3. src/main/resources/META-INF/persistence.xml, unité ludothequePU\n   Pourquoi : JPA cherche ce fichier à cet endroit précis.\n   Sans lui : « No Persistence provider / unit named ludothequePU ».\n4. jakarta.persistence.jdbc.url = jdbc:mysql://localhost:3306/ludotheque\n   Pourquoi : localiser la base. URL fausse : « Unknown database » ou refus de connexion.\n5. user / password corrects\n   Sans eux : « Access denied for user ».\n6. hibernate.show_sql=true (+ format_sql)\n   Pourquoi : voir le SQL généré, indispensable pour apprendre et déboguer.\n7. Test de vie : createEntityManagerFactory(\"ludothequePU\") + un find\n   Preuve : la console affiche « Hibernate: select ... ».",
    note: "Cette checklist est le réflexe professionnel : toute intégration (Hibernate ici, EF Core ou Eloquent ailleurs, Docker au Niveau 7) se documente en couples cause→symptôme. Tu la réutiliseras telle quelle pour configurer le datasource Spring Boot du projet full-stack au Niveau 6." }
