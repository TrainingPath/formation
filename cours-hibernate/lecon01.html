<script>
var DAY = {
  num: 1,
  title: "Pourquoi un ORM ? Du SQL aux objets",
  subtitle: "Ton code pense en objets, ta base pense en tables. L'ORM est le traducteur.",
  theory: `
<h3>1. Le problème : deux mondes qui ne parlent pas la même langue</h3>
<p>Avant tout, posons les mots de base. Une <strong>base de données</strong> est un grand classeur informatique qui range des informations dans des <strong>tables</strong>. Une <strong>table</strong> est une grille, comme une feuille Excel, avec des <strong>lignes</strong> (chaque ligne = un enregistrement, par exemple un jeu précis) et des <strong>colonnes</strong> (chaque colonne = une information, par exemple le titre). <strong>MySQL</strong> est le logiciel qui gère ces bases. Pour lui parler, on écrit du <strong>SQL</strong> (Structured Query Language, « langage de requêtes structuré ») : par exemple <code>SELECT * FROM jeu</code> se lit « donne-moi tout (<code>*</code>) le contenu de la table jeu ».</p>
<p>De l'autre côté, <strong>Java</strong> est le langage dans lequel tu écris ton application. Java « pense » en <strong>objets</strong> : un objet est un petit paquet qui regroupe des données et des actions, comme une fiche cartonnée. Le moule qui sert à fabriquer ces fiches s'appelle une <strong>classe</strong> (par exemple la classe <code>Jeu</code>), et chaque fiche fabriquée est une <strong>instance</strong> (un objet). Les informations rangées dans l'objet sont ses <strong>attributs</strong> (le titre, le prix…).</p>
<p>Au Niveau 4, tu as conçu le schéma MySQL de la <strong>Ludothèque</strong> : des tables <em>jeu</em>, <em>membre</em>, <em>location</em>, <em>avis</em>, reliées par des <strong>clés étrangères</strong>. Une clé étrangère (en anglais <em>foreign key</em>, FK) est une colonne qui pointe vers la ligne d'une autre table, comme un renvoi « voir fiche n°42 ». En Java, tu manipules des objets équivalents. Entre les deux, avec <strong>JDBC</strong> (l'outil de base de Java pour parler à une base) écrit « à la main » (on dit <em>brut</em>), chaque lecture demande le même rituel pénible :</p>
<pre class="pseudo">// JDBC brut : verbeux, répétitif, fragile
PreparedStatement ps = conn.prepareStatement("SELECT * FROM jeu WHERE id = ?"); // on prépare une requête SQL ; le ? est un trou à boucher plus tard
ps.setLong(1, id);                          // on bouche le trou n°1 avec la valeur de la variable id (un nombre "long")
ResultSet rs = ps.executeQuery();           // on exécute la requête ; rs = le tableau de résultats renvoyé par la base
Jeu jeu = new Jeu();                         // on fabrique un objet Jeu vide (new = créer une nouvelle instance de la classe Jeu)
jeu.setTitre(rs.getString("titre"));         // on lit la colonne "titre" du résultat et on la range dans l'objet... colonne par colonne
jeu.setPrixLocation(rs.getBigDecimal("prix_location")); // ...puis la colonne "prix_location", à la main, une par une (fastidieux et fragile)</pre>
<p>Ce fossé entre objets et tables a un nom : le <strong>décalage objet-relationnel</strong> (en anglais <em>impedance mismatch</em>). Les objets ont des références, de l'héritage, des collections ; les tables n'ont que des lignes, des colonnes et des clés étrangères. Traduire de l'un à l'autre à la main est long et source d'erreurs.</p>

<h3>2. L'idée de l'ORM</h3>
<p>Un <strong>ORM</strong> (Object-Relational Mapping, « correspondance objet-relationnel ») est un logiciel traducteur : tu décris <strong>une seule fois</strong> la correspondance entre tes classes et tes tables, et il génère le SQL à ta place. C'est comme un interprète bilingue entre le « monde objet » de Java et le « monde table » de la base. Le mot <strong>mapping</strong> signifie justement « faire correspondre » : une carte qui relie chaque élément d'un côté à son équivalent de l'autre.</p>
<pre class="pseudo">classe Jeu        ←→  table jeu               // une CLASSE Java correspond à une TABLE de la base
objet jeu #42     ←→  ligne WHERE id = 42     // un OBJET (une instance) correspond à une LIGNE précise de la table
attribut titre    ←→  colonne titre           // un ATTRIBUT de l'objet correspond à une COLONNE de la table
référence membre  ←→  clé étrangère membre_id // une RÉFÉRENCE vers un autre objet correspond à une CLÉ ÉTRANGÈRE</pre>
<p>Résultat : tu écris simplement <code>em.find(Jeu.class, 42L)</code> (« trouve le Jeu dont l'identifiant est 42 ») et l'ORM écrit, exécute et convertit le SELECT tout seul. Le <code>L</code> collé à 42 précise à Java qu'il s'agit d'un nombre <em>long</em> (un entier de grande taille).</p>

<h3>3. JPA, la norme ; Hibernate, le moteur</h3>
<p><strong>JPA</strong> (Jakarta Persistence API) est une <strong>spécification</strong> : un ensemble de règles et de noms standardisés (des interfaces et des <strong>annotations</strong> comme <code>@Entity</code>, <code>EntityManager</code>…). Une <strong>annotation</strong> est une étiquette précédée d'un <code>@</code> que l'on colle sur une classe pour lui donner un rôle. La <strong>persistance</strong>, c'est « faire survivre les données au-delà de l'exécution du programme », donc les enregistrer durablement dans la base. <strong>Hibernate</strong> est l'<strong>implémentation</strong> la plus utilisée de JPA : le moteur qui fait réellement le travail. Tu écris ton code en suivant la norme JPA, et Hibernate l'exécute — exactement comme ton code parle à JDBC pendant que le driver MySQL fait le vrai dialogue avec la base.</p>
<pre class="pseudo">Ton code  →  JPA (annotations, EntityManager)     // ← LA NORME : les mots standard que ton code utilise
                     ↓                              // (ton code ne connaît que JPA, pas le moteur)
             Hibernate                              // ← L'IMPLÉMENTATION : le moteur qui exécute vraiment
                     ↓                              // (il traduit tes ordres JPA en vraies requêtes SQL)
             JDBC + driver MySQL  →  base ludotheque // ← la plomberie finale qui dialogue avec MySQL</pre>

<h3>4. Et Spring Data JPA dans tout ça ?</h3>
<p>Dans le cours Spring, tu as écrit des interfaces <code>JpaRepository</code> et les requêtes apparaissaient « par magie ». Spring Data JPA est une <strong>surcouche</strong> (une couche posée par-dessus une autre pour en simplifier l'usage) : sous chaque repository se cache un <code>EntityManager</code> JPA, donc Hibernate. Ce cours ouvre le capot : à la fin, tu sauras exactement ce que Spring Data fait pour toi — et pourquoi il rame parfois.</p>

<h3>5. Le même concept partout</h3>
<p>Chaque pile technologique a son ORM : <strong>EF Core</strong> en C#/.NET, <strong>Eloquent</strong> dans Laravel (PHP), l'<strong>ORM Django</strong> en Python. Les noms changent, mais les concepts (mapping, entités, lazy loading, migrations) sont les mêmes. Maîtriser Hibernate, c'est comprendre les quatre. Fil rouge du cours : construire la couche de persistance complète de la Ludothèque sur ta base MySQL du Niveau 4.</p>
<div class="warn">Un ORM ne dispense JAMAIS de connaître SQL : il en génère, et c'est toi qui devras lire ce SQL pour diagnostiquer les lenteurs (leçon 18). L'ORM est un traducteur, pas un remplaçant.</div>
<div class="tip">Retiens le vocabulaire dès aujourd'hui : une classe mappée s'appelle une <strong>entité</strong>, et l'objet central de JPA s'appelle l'<strong>EntityManager</strong>. Tout le cours tourne autour de ces deux mots.</div>`,
  exercises: [
    { type: "qcm", q: "Le problème principal que résout un ORM :", opts: ["La lenteur de MySQL", "La traduction répétitive entre objets Java et tables relationnelles", "Les fautes de compilation", "La taille des fichiers .class"], a: 1, exp: "C'est le décalage objet-relationnel : l'ORM automatise la traduction." },
    { type: "qcm", q: "ORM signifie…", opts: ["Object-Relational Mapping", "Online Relational MySQL", "Object Runtime Manager", "Open Resource Model"], a: 0, exp: "Correspondance objet-relationnel." },
    { type: "qcm", q: "Dans le mapping ORM, une classe Java correspond à…", opts: ["Une table", "Une ligne", "Une colonne", "Une base entière"], a: 0, exp: "Classe ↔ table, objet ↔ ligne, attribut ↔ colonne." },
    { type: "qcm", q: "Un objet (une instance) correspond à…", opts: ["Une colonne", "Une ligne de la table", "Un index", "Une clé étrangère"], a: 1, exp: "L'objet jeu #42 est la ligne WHERE id = 42." },
    { type: "vf", q: "JPA est une implémentation et Hibernate est la spécification.", a: false, exp: "C'est l'inverse : JPA = la norme (interfaces, annotations), Hibernate = l'implémentation." },
    { type: "qcm", q: "JPA est…", opts: ["Une spécification (interfaces et annotations standard)", "Un serveur de base de données", "Un langage de programmation", "Un IDE"], a: 0, exp: "Jakarta Persistence API : la norme que Hibernate implémente." },
    { type: "qcm", q: "Le rôle de Hibernate est de…", opts: ["Compiler le code Java", "Implémenter JPA et générer le SQL", "Remplacer MySQL", "Dessiner le schéma Merise"], a: 1, exp: "C'est le moteur qui fait le vrai travail sous les annotations JPA." },
    { type: "qcm", q: "Spring Data JPA est…", opts: ["Un concurrent de Hibernate", "Une surcouche au-dessus de JPA/Hibernate", "Un driver MySQL", "Un autre nom de JDBC"], a: 1, exp: "Sous chaque JpaRepository se cache un EntityManager, donc Hibernate." },
    { type: "vf", q: "Avec un ORM, il devient inutile de connaître SQL.", a: false, exp: "L'ORM génère du SQL qu'il faut savoir lire pour diagnostiquer (leçon 18)." },
    { type: "qcm", q: "Le décalage objet-relationnel désigne…", opts: ["La différence de nature entre objets (références, collections) et tables (lignes, FK)", "Un bug de MySQL", "Le décalage horaire des serveurs", "Une erreur de compilation Java"], a: 0, exp: "C'est l'impedance mismatch, la raison d'être des ORM." },
    { type: "input", q: "Comment s'appelle une classe Java mappée sur une table dans le vocabulaire JPA ? (un mot)", a: ["entité", "entite", "entity", "une entité"], ph: "Un mot…", exp: "Une entité : le mot central de tout le cours." },
    { type: "input", q: "Quel est l'ORM du framework Laravel (PHP) ?", a: ["Eloquent"], ph: "Nom de l'ORM…", exp: "Eloquent en PHP, EF Core en C#, l'ORM Django en Python : mêmes concepts." },
    { type: "qcm", q: "L'équivalent de Hibernate dans l'écosystème .NET :", opts: ["EF Core", "Eloquent", "Django ORM", "Sequelize"], a: 0, exp: "Entity Framework Core, vu dans la branche C# de la formation." },
    { type: "vf", q: "Le fil rouge du cours est la couche de persistance de la Ludothèque, sur le schéma MySQL du Niveau 4.", a: true, exp: "Entités Jeu, Membre, Location, Avis : on repart de TA base." },
    { type: "qcm", q: "Avec JDBC brut, mapper un ResultSet vers un objet…", opts: ["Est automatique", "Se fait colonne par colonne, à la main", "Est impossible", "Nécessite un fichier XML obligatoire"], a: 1, exp: "rs.getString(...), setTitre(...) : c'est ce rituel que l'ORM élimine." }
  ],
  final: {
    title: "Exercice final — La carte mentale de l'ORM",
    intro: `<p>Avant de configurer quoi que ce soit, on vérifie que l'architecture est claire dans ta tête : qui est la norme, qui est le moteur, qui traduit quoi.</p>`,
    questions: [
      { type: "qcm", q: "Ordre correct des couches, de ton code vers la base :", opts: ["Code → JPA → Hibernate → JDBC → MySQL", "Code → JDBC → JPA → Hibernate → MySQL", "Code → MySQL → Hibernate → JPA", "Code → Hibernate → JPA → MySQL"], a: 0, exp: "Tu codes contre la norme JPA ; Hibernate l'implémente et parle JDBC." },
      { type: "qcm", q: "Un attribut Java (ex. titre) correspond à…", opts: ["Une colonne de la table", "Une table", "Une base", "Un serveur"], a: 0, exp: "Attribut ↔ colonne : le troisième étage du mapping." },
      { type: "vf", q: "Une référence entre objets (location.getJeu()) correspond côté base à une clé étrangère.", a: true, exp: "C'est le cœur des leçons 8 à 12 sur les relations." },
      { type: "qcm", q: "Pourquoi ce cours alors que Spring Data JPA « marche tout seul » ?", opts: ["Pour comprendre et maîtriser ce qui se passe sous les repositories", "Parce que Spring Data est abandonné", "Parce que Hibernate remplace Spring", "Pour éviter d'écrire du Java"], a: 0, exp: "On ouvre le capot : cycle de vie, SQL généré, pièges de performance." },
      { type: "qcm", q: "Quel trio d'ORM retrouve-t-on dans les autres piles de la formation ?", opts: ["EF Core, Eloquent, ORM Django", "React, Vue, Angular", "MySQL, SQL Server, SQLite", "Maven, Gradle, npm"], a: 0, exp: "Mêmes concepts partout : mapping, entités, lazy loading." }
    ],
    solution: `<pre class="pseudo">Problème : objets Java ↔ tables MySQL = deux mondes (impedance mismatch)  // le décalage objet-relationnel qu'il faut traduire
Solution : l'ORM traduit automatiquement                                  // un seul mapping décrit, puis le SQL est généré tout seul
           classe ↔ table · objet ↔ ligne · attribut ↔ colonne · référence ↔ FK  // les 4 correspondances de base à retenir

JPA       = la spécification (annotations, EntityManager)                 // la NORME : ce que tu écris dans ton code
Hibernate = l'implémentation qui génère le SQL                            // le MOTEUR : ce qui s'exécute réellement
Spring Data JPA = surcouche au-dessus (les repositories du cours Spring)  // simplifie encore l'usage de JPA/Hibernate
Ailleurs  : EF Core (C#), Eloquent (PHP), ORM Django (Python)             // mêmes concepts, autres langages

Fil rouge : la persistance de la Ludothèque (Jeu, Membre, Location, Avis) // le projet construit tout au long du cours</pre>
<p>Les idées sont posées. Demain : on branche Hibernate sur ta base MySQL et on le regarde parler SQL grâce à show_sql.</p>`
  }
};
