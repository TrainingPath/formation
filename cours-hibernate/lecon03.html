<script>
var DAY = {
  num: 3,
  title: "La première entité : @Entity, @Id, @Column",
  subtitle: "La table jeu devient une classe Java — trois annotations suffisent.",
  theory: `
<h3>1. De la table à la classe</h3>
<p>Au Niveau 4, tu as créé la table <em>jeu</em>. Aujourd'hui, on écrit son double Java : une <strong>entité</strong>. Une entité est une classe ordinaire — on dit un <strong>POJO</strong> (Plain Old Java Object, « bon vieil objet Java tout simple ») — décorée d'<strong>annotations</strong> JPA (les étiquettes commençant par <code>@</code>) qui décrivent le mapping. À gauche, le <strong>CREATE TABLE</strong> SQL que tu connais ; à droite, l'annotation Java correspondante.</p>
<pre class="pseudo">CREATE TABLE jeu (                        -- la table SQL...                  → devient @Entity (une classe)
  id BIGINT PRIMARY KEY AUTO_INCREMENT,   -- la clé primaire auto-incrémentée  → @Id @GeneratedValue
  titre VARCHAR(150) NOT NULL,            -- texte obligatoire de 150 max      → @Column(nullable = false, length = 150)
  prix_location DECIMAL(6,2),             -- un nombre décimal (argent)         → BigDecimal prixLocation
  date_sortie DATE                        -- une date                           → LocalDate dateSortie
);                                        -- fin de la définition de la table</pre>

<h3>2. Les trois annotations fondatrices</h3>
<pre class="pseudo">@Entity                                            // cette classe est une ENTITÉ : elle sera mappée sur une table
@Table(name = "jeu")                               // on fixe le nom de la table ("jeu") — optionnel si le nom colle
public class Jeu {                                 // début de la classe Jeu (une classe publique)

  @Id                                              // cet attribut est la CLÉ PRIMAIRE : l'identité unique de la ligne
  @GeneratedValue(strategy = GenerationType.IDENTITY) // sa valeur est générée par l'AUTO_INCREMENT de MySQL
  private Long id;                                 // l'identifiant, un nombre "long" (attribut privé)

  @Column(nullable = false, length = 150)          // colonne titre : interdiction du vide (NOT NULL) et VARCHAR(150)
  private String titre;                            // le titre du jeu, un texte (String)

  @Column(name = "prix_location")                  // on précise le nom de colonne (le camelCase ne suffit pas ici)
  private BigDecimal prixLocation;                 // le prix, en BigDecimal (calculs d'argent précis, sans arrondi)

  private LocalDate dateSortie;                    // aucune @Column : mappé automatiquement → colonne date_sortie

  protected Jeu() {}                               // constructeur SANS argument : OBLIGATOIRE (Hibernate en a besoin)
  public Jeu(String titre) { this.titre = titre; } // constructeur pratique : crée un Jeu à partir de son titre
  // getters / setters...                          // les accesseurs pour lire/modifier les attributs
}                                                  // fin de la classe Jeu</pre>
<p><strong>@Entity</strong> déclare la classe comme persistante (elle survivra dans la base). <strong>@Id</strong> marque la clé primaire — toute entité en a exactement une. <strong>@Column</strong> affine le mapping d'un attribut (nom, nullable, length) ; sans elle, Hibernate déduit tout des conventions.</p>

<h3>3. La génération de la clé</h3>
<p><strong>@GeneratedValue(strategy = GenerationType.IDENTITY)</strong> délègue la clé à l'AUTO_INCREMENT de MySQL : tu ne fixes jamais l'id toi-même, la base le fournit à l'insertion. (D'autres stratégies existent — SEQUENCE pour PostgreSQL/Oracle — mais IDENTITY est le choix naturel avec MySQL.)</p>

<h3>4. Les conventions de nommage</h3>
<p>Hibernate convertit par défaut le <strong>camelCase</strong> Java (mots collés avec une majuscule au milieu, comme <em>prixLocation</em>) en <strong>snake_case</strong> SQL (mots séparés par un tiret bas, comme <em>prix_location</em>) : <em>prixLocation</em> → <em>prix_location</em>, <em>dateSortie</em> → <em>date_sortie</em>. Tu n'écris <code>@Column(name=...)</code> que quand la convention ne suffit pas. Les types se mappent naturellement : String → VARCHAR, BigDecimal → DECIMAL, LocalDate → DATE, boolean → TINYINT/BIT.</p>

<h3>5. Les règles du POJO persistant</h3>
<p>Une entité doit avoir : un <strong>constructeur sans argument</strong> (au moins protected — Hibernate en a besoin pour créer l'objet par <strong>réflexion</strong>, une technique où Java fabrique et remplit un objet sans passer par ton code), ne pas être <strong>final</strong> (Hibernate crée des sous-classes <strong>proxy</strong> — des doublures automatiques, leçon 12), et de préférence des attributs privés avec accesseurs. Côté Spring Data, ce sont exactement ces entités que tes JpaRepository manipulaient ; EF Core et Django font le même travail avec des propriétés C# et des champs de modèle Python.</p>
<div class="warn">Oublier le constructeur sans argument est l'erreur n°1 du débutant : tout compile, puis Hibernate explose au chargement avec « No default constructor for entity ». Ajoute-le dès que tu crées une entité.</div>
<div class="tip">Une entité = une table, pas plus : garde tes classes métier riches en logique, mais laisse l'entité fidèle au schéma du Niveau 4. Si le mapping devient acrobatique, c'est souvent le schéma qu'il faut réinterroger.</div>`,
  exercises: [
    { type: "qcm", q: "L'annotation qui déclare une classe comme persistante :", opts: ["@Entity", "@Service", "@Controller", "@Test"], a: 0, exp: "@Entity : la classe est désormais mappée sur une table." },
    { type: "input", q: "Quelle annotation marque la clé primaire d'une entité ?", a: ["@Id", "id"], ph: "@…", exp: "@Id : toute entité en a exactement une." },
    { type: "qcm", q: "Avec MySQL et AUTO_INCREMENT, la stratégie de génération adaptée est…", opts: ["GenerationType.IDENTITY", "GenerationType.TABLE", "GenerationType.AUTO_MANUEL", "Aucune génération possible"], a: 0, exp: "IDENTITY délègue l'id à l'AUTO_INCREMENT de la base." },
    { type: "qcm", q: "@Column(nullable = false, length = 150) correspond en SQL à…", opts: ["VARCHAR(150) NOT NULL", "INT PRIMARY KEY", "TEXT NULL", "DATE UNIQUE"], a: 0, exp: "@Column affine le DDL et documente le mapping." },
    { type: "vf", q: "Une entité peut se passer de @Column sur un attribut : Hibernate applique alors les conventions.", a: true, exp: "dateSortie → date_sortie automatiquement ; @Column ne sert qu'à dévier." },
    { type: "qcm", q: "Par convention, l'attribut prixLocation est mappé sur la colonne…", opts: ["prix_location", "PRIXLOCATION", "prixlocation_col", "location_prix"], a: 0, exp: "camelCase Java → snake_case SQL par défaut." },
    { type: "qcm", q: "Le constructeur sans argument d'une entité…", opts: ["Est obligatoire (au moins protected)", "Est interdit", "Doit être public et final", "N'existe qu'en C#"], a: 0, exp: "Hibernate instancie par réflexion : sans lui, erreur au chargement." },
    { type: "vf", q: "Une entité peut être déclarée final sans conséquence.", a: false, exp: "Hibernate crée des proxys par héritage (leçon 12) : évite final." },
    { type: "qcm", q: "@Table(name = \"jeu\") sert à…", opts: ["Fixer explicitement le nom de la table mappée", "Créer une vue MySQL", "Déclarer un index", "Choisir le port de connexion"], a: 0, exp: "Utile quand le nom de classe ne correspond pas à la table." },
    { type: "qcm", q: "Le type Java naturel pour la colonne date_sortie DATE :", opts: ["LocalDate", "String", "int", "float"], a: 0, exp: "java.time.LocalDate ↔ DATE ; plus de vieux java.util.Date." },
    { type: "qcm", q: "Le type Java recommandé pour prix_location DECIMAL(6,2) :", opts: ["BigDecimal", "double", "String", "char"], a: 0, exp: "BigDecimal évite les erreurs d'arrondi binaire sur l'argent (cf. cours Java)." },
    { type: "input", q: "Quelle annotation demande à la base de générer la valeur de la clé primaire ?", a: ["@GeneratedValue", "GeneratedValue"], ph: "@…", exp: "@GeneratedValue(strategy = GenerationType.IDENTITY) avec MySQL." },
    { type: "qcm", q: "Combien de clés primaires (@Id simples) une entité déclare-t-elle ?", opts: ["Exactement une", "Zéro", "Au moins trois", "Une par attribut"], a: 0, exp: "Une identité unique par entité, comme une PK par table." },
    { type: "vf", q: "Tu dois fixer l'id à la main avant chaque insertion avec IDENTITY.", a: false, exp: "C'est MySQL qui le fournit à l'INSERT ; l'objet le reçoit après persist." },
    { type: "qcm", q: "Ces entités sont exactement ce que manipulaient…", opts: ["Tes JpaRepository du cours Spring", "Tes fichiers CSS", "Les contrôleurs REST uniquement", "Les scripts bash"], a: 0, exp: "Spring Data expose des repositories PAR entité : le voile se lève." }
  ],
  final: {
    title: "Exercice final — L'entité Membre",
    intro: `<p>À toi de mapper la table <em>membre</em> de la Ludothèque : id BIGINT AUTO_INCREMENT, pseudo VARCHAR(40) NOT NULL UNIQUE, email VARCHAR(120) NOT NULL, date_inscription DATE.</p>`,
    questions: [
      { type: "qcm", q: "L'en-tête minimal correct de la classe :", opts: ["@Entity public class Membre { ... }", "@Repository final class Membre { ... }", "@Entity interface Membre { ... }", "class Membre extends Table { ... }"], a: 0, exp: "Une classe (ni final, ni interface) annotée @Entity." },
      { type: "qcm", q: "Le mapping correct de l'id :", opts: ["@Id @GeneratedValue(strategy = GenerationType.IDENTITY) private Long id;", "@Column private int id;", "@Id public static long id;", "private Long id; // rien d'autre"], a: 0, exp: "PK + génération déléguée à l'AUTO_INCREMENT." },
      { type: "qcm", q: "Pour pseudo VARCHAR(40) NOT NULL UNIQUE :", opts: ["@Column(nullable = false, length = 40, unique = true)", "@Id @Column(length = 40)", "@Table(unique = true)", "Aucune annotation possible"], a: 0, exp: "@Column porte nullable, length et unique." },
      { type: "vf", q: "L'attribut dateInscription sera mappé sur date_inscription sans @Column(name=...).", a: true, exp: "Convention camelCase → snake_case." },
      { type: "input", q: "Quel élément non annoté la classe Membre doit-elle absolument contenir pour Hibernate ?", a: ["un constructeur sans argument", "constructeur sans argument", "constructeur par défaut", "un constructeur par défaut", "no-arg constructor"], ph: "un … sans …", exp: "Le constructeur sans argument, au moins protected." }
    ],
    solution: `<pre class="pseudo">@Entity                                            // classe persistante (mappée sur une table)
@Table(name = "membre")                            // nom explicite de la table : "membre"
public class Membre {                              // début de l'entité Membre
  @Id                                              // clé primaire
  @GeneratedValue(strategy = GenerationType.IDENTITY) // id fourni par l'AUTO_INCREMENT de MySQL
  private Long id;                                 // l'identifiant (nombre long)

  @Column(nullable = false, length = 40, unique = true) // pseudo : NOT NULL, VARCHAR(40), valeur UNIQUE
  private String pseudo;                           // le pseudo du membre

  @Column(nullable = false, length = 120)          // email : NOT NULL, VARCHAR(120)
  private String email;                            // l'adresse e-mail

  private LocalDate dateInscription;               // mappé automatiquement → colonne date_inscription

  protected Membre() {}                            // constructeur sans argument : obligatoire
  public Membre(String pseudo, String email) { ... } // constructeur pratique pour créer un Membre
}                                                  // fin de l'entité Membre</pre>
<p>Deux entités (Jeu, Membre) existent sur le papier. Demain : qui crée les tables — Hibernate ou toi ? Le duel ddl-auto contre le schéma du Niveau 4.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "hibernate-l3", title: "Mapper la table avis", level: 2,
    statement: "La table avis de la Ludothèque contient : id BIGINT AUTO_INCREMENT, note TINYINT NOT NULL (1 à 5), commentaire TEXT NULL, date_avis DATETIME NOT NULL (plus deux clés étrangères qu'on ignorera jusqu'à la leçon 8). Rédige le code complet de l'entité Avis avec ses annotations, puis justifie par écrit chaque choix : type Java de chaque attribut, annotations retenues ou omises, et ce que tu fais (pour l'instant) des clés étrangères.",
    hints: [
      "note 1-5 : quel type Java simple ? int ou Integer — lequel autorise l'absence de valeur, et est-ce souhaitable ici avec NOT NULL ?",
      "commentaire TEXT : String suffit, mais comment indiquer à @Column qu'on veut un grand texte (columnDefinition ou length) ?",
      "date_avis DATETIME : LocalDate ou LocalDateTime ? Regarde ce que stocke DATETIME."
    ],
    solution: "@Entity\n@Table(name = \"avis\")\npublic class Avis {\n  @Id\n  @GeneratedValue(strategy = GenerationType.IDENTITY)\n  private Long id;\n\n  @Column(nullable = false)\n  private int note;                 // NOT NULL → primitive int acceptable\n\n  @Column(columnDefinition = \"TEXT\")\n  private String commentaire;       // NULL autorisé → pas de nullable=false\n\n  @Column(name = \"date_avis\", nullable = false)\n  private LocalDateTime dateAvis;   // DATETIME = date + heure → LocalDateTime\n\n  protected Avis() {}\n}\n\nJustifications :\n- int (primitif) pour note : la colonne est NOT NULL, aucune absence possible.\n- String + columnDefinition TEXT : un VARCHAR par défaut serait trop court.\n- LocalDateTime pour DATETIME (LocalDate perdrait l'heure).\n- Les FK jeu_id / membre_id attendront @ManyToOne (leçon 8) :\n  surtout ne PAS les mapper en simples Long, on perdrait la relation objet.",
    note: "Justifier chaque type est le réflexe qui distingue un mapping subi d'un mapping conçu — la contrainte NOT NULL de ton MCD Merise du Niveau 4 décide même du choix primitive/wrapper en Java. Tu referas ce raisonnement à l'identique avec les propriétés EF Core ou les champs de modèle Django." }
  ]
};
