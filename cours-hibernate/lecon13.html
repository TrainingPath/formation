<script>
var DAY = {
  num: 13,
  title: "JPQL : requêter en objets",
  subtitle: "Comme SQL, mais sur tes entités : SELECT j FROM Jeu j — la classe, pas la table.",
  theory: `
<h3>1. find ne suffit plus</h3>
<p>em.find(Jeu.class, 42L) ne sait faire qu'une chose : chercher par clé primaire. Mais la Ludothèque veut « les jeux à moins de 4 euros », « les membres inscrits cette année », « les avis notés 5 ». Il faut un langage de requête. JPA en fournit un : <strong>JPQL</strong> (Java Persistence Query Language, « langage de requête de JPA »). Sa particularité fondatrice : il requête les <strong>entités et leurs attributs Java</strong>, jamais les tables et colonnes SQL.</p>
<pre class="pseudo">JPQL :  SELECT j FROM Jeu j WHERE j.prixLocation &lt; :max   -- requête sur l'ENTITÉ Jeu et son ATTRIBUT prixLocation
                     ↑ Jeu = la CLASSE     ↑ prixLocation = l'ATTRIBUT Java   -- (repères visuels)

SQL généré par Hibernate (visible dans show_sql) :        -- Hibernate traduit tout seul en vrai SQL...
        SELECT j.id, j.titre, j.prix_location, ...         -- ...il liste les VRAIES colonnes de la table
        FROM jeu j WHERE j.prix_location &lt; ?               -- ...la VRAIE table jeu et la colonne prix_location
                     ↑ jeu = la table       ↑ prix_location = la colonne   -- (repères visuels)</pre>
<p>Tu écris FROM Jeu (la classe, avec sa majuscule) et j.prixLocation (le camelCase Java) ; Hibernate traduit vers la table jeu et la colonne prix_location grâce au mapping des leçons 3 à 11. Et le résultat n'est pas un ResultSet : ce sont des <strong>entités gérées</strong>, prêtes pour le dirty checking (leçon 6).</p>

<h3>2. TypedQuery : la requête typée de bout en bout</h3>
<pre class="pseudo">TypedQuery&lt;Jeu&gt; query = em.createQuery(              // créer une requête TYPÉE qui rendra des Jeu
    "SELECT j FROM Jeu j WHERE j.prixLocation &lt; :max", Jeu.class);  // la chaîne JPQL + la classe attendue
query.setParameter("max", new BigDecimal("4.00"));  // remplir le paramètre nommé :max
List&lt;Jeu&gt; jeux = query.getResultList();   // exécuter → 0, 1 ou N résultats</pre>
<p><strong>createQuery</strong> prend la chaîne JPQL et la classe attendue, et rend une <strong>TypedQuery&lt;Jeu&gt;</strong> : le compilateur sait que getResultList() rend une List&lt;Jeu&gt; — pas de cast, pas de surprise. (Il existe une version sans le second argument qui rend une Query brute non typée : évite-la.)</p>

<h3>3. Les paramètres nommés : jamais de concaténation</h3>
<p><strong>:max</strong> est un <strong>paramètre nommé</strong> (un « trou » identifié par un nom), rempli par <strong>setParameter("max", valeur)</strong>. C'est l'équivalent du ? de PreparedStatement du Niveau 4, en plus lisible — et c'est la même barrière contre l'<strong>injection SQL</strong> (l'attaque où une saisie piégée modifie ta requête) :</p>
<pre class="pseudo">// INTERDIT — injection possible et plan de requête jamais réutilisé :
em.createQuery("SELECT j FROM Jeu j WHERE j.titre = '" + saisie + "'", Jeu.class);  // on colle la saisie DANS la requête : DANGER

// CORRECT :
em.createQuery("SELECT j FROM Jeu j WHERE j.titre = :titre", Jeu.class)  // :titre = paramètre nommé (un trou sûr)
  .setParameter("titre", saisie)   // on remplit le trou : la valeur reste séparée du texte de la requête
  .getResultList();                // exécuter et récupérer la liste</pre>

<h3>4. getResultList ou getSingleResult ?</h3>
<pre class="pseudo">List&lt;Jeu&gt; jeux = query.getResultList();      // liste éventuellement vide : sans danger

Jeu jeu = em.createQuery(                     // on veut UN seul jeu...
    "SELECT j FROM Jeu j WHERE j.titre = :t", Jeu.class)  // ...celui dont le titre vaut :t
  .setParameter("t", "Catan")                 // remplir :t avec "Catan"
  .getSingleResult();                         // exiger EXACTEMENT un résultat
// aucun résultat  → NoResultException
// deux résultats  → NonUniqueResultException</pre>
<p><strong>getResultList</strong> rend toujours une liste (vide si rien) : c'est le choix par défaut. <strong>getSingleResult</strong> exige exactement UN résultat et lance une exception sinon : réserve-le aux cas où l'unicité est garantie (recherche sur colonne UNIQUE, agrégat COUNT). Contrairement à find, il ne rend jamais null.</p>

<h3>5. La casse compte, et le lien avec Spring Data</h3>
<p>Les mots-clés JPQL (SELECT, FROM, WHERE) sont insensibles à la casse, mais les <strong>noms d'entités et d'attributs</strong> suivent Java à la lettre : FROM jeu ou j.PrixLocation échouent — l'entité s'appelle Jeu, l'attribut prixLocation. L'erreur ne surgit qu'à l'exécution, la chaîne n'étant pas vérifiée par le compilateur. Et le voile se lève encore sur Spring Data : findByPrixLocationLessThan(max) ne faisait que <strong>générer cette même requête JPQL</strong> à partir du nom de la méthode — et @Query te laissait l'écrire toi-même. Ailleurs : LINQ en EF Core, le query builder d'Eloquent, filter() des QuerySet Django — partout l'idée d'interroger le modèle objet plutôt que les tables.</p>
<div class="warn">JPQL n'est PAS du SQL : FROM jeu (nom de table) au lieu de FROM Jeu (nom de classe) est l'erreur n°1, et elle n'explose qu'à l'exécution avec un message du genre « Jeu is not mapped » inversé. Règle mnémotechnique : dans une requête JPQL, tout ce qui se trouve après FROM ou un point doit exister DANS TON CODE JAVA.</div>
<div class="tip">Garde le réflexe show_sql (leçon 2) : pour chaque JPQL que tu écris, lis le SQL généré et vérifie qu'il correspond à ce que tu aurais écrit au Niveau 4. C'est le meilleur exercice bilingue objet/relationnel qui existe — et il te prépare aux jointures JPQL de demain.</div>`,
  exercises: [
    { type: "qcm", q: "JPQL interroge…", opts: ["Les entités et leurs attributs Java", "Les tables et colonnes MySQL", "Les fichiers de configuration", "Le cache du navigateur"], a: 0, exp: "FROM Jeu, j.prixLocation : tout est côté objet ; Hibernate traduit vers jeu et prix_location." },
    { type: "qcm", q: "La requête correcte pour les jeux à moins de :max :", opts: ["SELECT * FROM jeu WHERE prix_location &lt; :max", "SELECT j FROM jeu j WHERE j.prix_location &lt; :max", "SELECT j FROM Jeu j WHERE j.prixLocation &lt; :max", "GET Jeu WHERE prixLocation &lt; :max"], a: 2, exp: "Nom de classe Jeu (majuscule) et attribut Java prixLocation : jamais les noms SQL." },
    { type: "vf", q: "Dans un JPQL, FROM jeu (minuscule, comme la table) fonctionne aussi bien que FROM Jeu.", a: false, exp: "Les noms d'entités sont sensibles à la casse : c'est la classe Java Jeu, pas la table jeu." },
    { type: "qcm", q: "La méthode de l'EntityManager qui crée une requête JPQL typée :", opts: ["find", "prepareStatement", "executeQuery", "createQuery"], a: 3, exp: "em.createQuery(jpql, Jeu.class) rend une TypedQuery&lt;Jeu&gt; — prepareStatement, c'était JDBC au Niveau 4." },
    { type: "qcm", q: "L'intérêt de TypedQuery&lt;Jeu&gt; par rapport à la Query brute :", opts: ["Elle est plus rapide à l'exécution", "getResultList() rend une List&lt;Jeu&gt; vérifiée par le compilateur, sans cast", "Elle évite la transaction", "Elle contourne le mapping"], a: 1, exp: "Le typage de bout en bout : le second argument de createQuery fixe le type du résultat." },
    { type: "input", q: "Quelle méthode remplit un paramètre nommé comme :max ?", a: ["setParameter", "setparameter", "setParameter()", ".setParameter"], ph: "nom de la méthode…", exp: "query.setParameter(\"max\", valeur) — le nom sans les deux-points." },
    { type: "qcm", q: "Concaténer la saisie utilisateur dans la chaîne JPQL est interdit car…", opts: ["JPQL refuse le +", "C'est une porte ouverte à l'injection (même fléau qu'en SQL au Niveau 4)", "Les chaînes Java sont immuables", "Hibernate ne voit pas les String"], a: 1, exp: "Les paramètres nommés sont la version JPQL du PreparedStatement : toujours :param + setParameter." },
    { type: "qcm", q: "getResultList() quand aucun jeu ne correspond retourne…", opts: ["Une liste vide", "null", "Une NoResultException", "Un jeu par défaut"], a: 0, exp: "Toujours une liste, éventuellement vide : le choix sans danger pour les recherches." },
    { type: "qcm", q: "getSingleResult() quand AUCUNE ligne ne correspond…", opts: ["Retourne null comme find", "Retourne une liste vide", "Lance NoResultException", "Retourne 0"], a: 2, exp: "Contrairement à find, jamais de null : exception si zéro (NoResult…) ou plusieurs (NonUnique…)." },
    { type: "vf", q: "getSingleResult est le bon choix quand l'unicité est garantie (colonne UNIQUE, COUNT).", a: true, exp: "Exactement son terrain : un pseudo UNIQUE, un agrégat — sinon, préfère getResultList." },
    { type: "qcm", q: "Les entités retournées par une requête JPQL sont…", opts: ["Détachées d'office", "Des copies en lecture seule", "Des Map clé/valeur", "Gérées : le dirty checking de la leçon 6 s'applique"], a: 3, exp: "Modifier un jeu issu de getResultList dans la transaction déclenche l'UPDATE au commit." },
    { type: "input", q: "Comment s'écrit un paramètre nommé « max » DANS la chaîne JPQL ?", a: [":max", "deux-points max", ":max dans la requête"], ph: "avec sa ponctuation…", exp: "Préfixe deux-points dans la requête (:max), nom nu dans setParameter(\"max\", …)." },
    { type: "qcm", q: "Une faute de frappe dans la chaîne JPQL (j.pryxLocation) est détectée…", opts: ["À la compilation", "À l'exécution seulement, quand la requête est analysée", "Jamais", "Par MySQL au démarrage"], a: 1, exp: "La chaîne échappe au compilateur : d'où l'intérêt de tester chaque requête (et des méthodes dérivées Spring Data, validées au démarrage)." },
    { type: "qcm", q: "Sous findByPrixLocationLessThan(max) de Spring Data se cache…", opts: ["Une requête JPQL générée depuis le nom de la méthode", "Un fichier CSV", "Une procédure stockée MySQL", "Un appel HTTP"], a: 0, exp: "Spring Data parse le nom et produit SELECT j FROM Jeu j WHERE j.prixLocation &lt; :max — le voile se lève." },
    { type: "vf", q: "Dans show_sql, la requête JPQL apparaît traduite avec les vrais noms de tables et de colonnes.", a: true, exp: "SELECT ... FROM jeu ... WHERE prix_location < ? : la traduction repose sur le mapping des leçons 3 à 11." }
  ],
  final: {
    title: "Exercice final — Le moteur de recherche du catalogue",
    intro: `<p>La Ludothèque veut sa première vraie fonctionnalité de recherche : « les jeux dont le prix de location est inférieur à un budget donné », et « LE jeu portant un titre exact ». À toi d'assembler les requêtes.</p>`,
    questions: [
      { type: "qcm", q: "La construction complète et correcte pour la recherche par budget :", opts: ["em.createQuery(\"SELECT j FROM Jeu j WHERE j.prixLocation &lt; :max\", Jeu.class).setParameter(\"max\", budget).getResultList()", "em.find(Jeu.class, budget)", "em.createQuery(\"SELECT * FROM jeu WHERE prix_location &lt; \" + budget).getResultList()", "em.createNativeQuery(\"SELECT j FROM Jeu j\")"], a: 0, exp: "JPQL sur l'entité + paramètre nommé + TypedQuery : la chaîne complète." },
      { type: "input", q: "Pour récupérer une List&lt;Jeu&gt; éventuellement vide, on termine par la méthode…", a: ["getResultList", "getresultlist", "getResultList()", ".getResultList"], ph: "nom de la méthode…", exp: "getResultList : toujours une liste, jamais d'exception pour cause de zéro résultat." },
      { type: "qcm", q: "Pour « LE jeu au titre exact » (titre UNIQUE en base), le bon terminal est…", opts: ["getResultList puis get(0) sans vérifier", "getSingleResult, en gérant NoResultException si le titre n'existe pas", "find(Jeu.class, titre)", "executeUpdate"], a: 1, exp: "Unicité garantie par la contrainte UNIQUE → getSingleResult, avec l'exception « aucun résultat » à traiter." },
      { type: "vf", q: "Écrire WHERE j.prix_location &lt; :max (nom de colonne SQL) fonctionnera puisque Hibernate connaît le mapping.", a: false, exp: "JPQL n'accepte QUE les attributs Java : prixLocation. Le mapping sert à traduire, pas à mélanger les deux mondes." },
      { type: "qcm", q: "Le SQL visible dans show_sql pour la recherche par budget ressemblera à…", opts: ["SELECT j FROM Jeu j WHERE j.prixLocation &lt; ?", "UPDATE jeu SET prix_location = ?", "SELECT ... FROM jeu ... WHERE prix_location &lt; ? (noms SQL, paramètre positionnel)", "SHOW TABLES"], a: 2, exp: "Hibernate traduit entité → table, attribut → colonne, :max → ? : le bilinguisme en action." }
    ],
    solution: `<pre class="pseudo">// 1. Les jeux sous un budget donné
List&lt;Jeu&gt; abordables = em.createQuery(         // requête typée renvoyant des Jeu
    "SELECT j FROM Jeu j WHERE j.prixLocation &lt; :max", Jeu.class)  // JPQL : entité Jeu + attribut prixLocation
  .setParameter("max", new BigDecimal("4.00"))  // remplir le paramètre :max
  .getResultList();                      // liste vide si aucun : sans danger
// show_sql → SELECT ... FROM jeu ... WHERE prix_location &lt; ?

// 2. LE jeu au titre exact (titre UNIQUE)
try {                                          // getSingleResult peut lever une exception
  Jeu catan = em.createQuery(                  // requête typée renvoyant un Jeu
      "SELECT j FROM Jeu j WHERE j.titre = :t", Jeu.class)  // JPQL sur l'attribut titre
    .setParameter("t", "Catan")                // remplir le paramètre :t
    .getSingleResult();                        // exiger EXACTEMENT un résultat
} catch (NoResultException e) { /* aucun jeu de ce titre */ }  // gérer le cas "rien trouvé"

// Règle d'or : FROM Jeu (classe), j.prixLocation (attribut Java),
// :param + setParameter — jamais de concaténation, jamais de noms SQL.</pre>
<p>Tu sais filtrer une entité. Mais la vraie puissance arrive quand les requêtes traversent les relations des leçons 8 à 11 : demain, JPQL avancé — jointures entre entités, projections et paramètres à volonté.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "hibernate-l13", title: "Traduire le cahier des charges en JPQL", level: 2,
    statement: "Le responsable de la Ludothèque te dicte quatre besoins : (1) tous les jeux dont le prix de location est entre deux bornes saisies par l'utilisateur ; (2) les membres inscrits après une date donnée, classés du plus récent au plus ancien ; (3) le nombre total d'avis ayant la note 5 ; (4) LE membre correspondant à un pseudo saisi. Pour chacun : écris la requête JPQL complète avec ses paramètres nommés, le code Java d'exécution (createQuery, setParameter, terminal getResultList ou getSingleResult), et justifie le choix du terminal. Signale enfin lequel de ces besoins Spring Data aurait couvert par une simple méthode dérivée findBy…, et lequel mérite un @Query explicite.",
    hints: [
      "Besoin 1 : deux paramètres nommés (:min et :max) — BETWEEN existe en JPQL, ou deux comparaisons.",
      "Besoin 3 : SELECT COUNT(a) FROM Avis a … rend un Long, toujours exactement une valeur : quel terminal s'impose ?",
      "Besoin 4 : pseudo est UNIQUE (leçon 3). Quel terminal, et quelle exception faut-il attraper si le pseudo n'existe pas ?"
    ],
    solution: "1) Fourchette de prix → getResultList (0..N résultats attendus)\n   TypedQuery<Jeu> q = em.createQuery(\n     \"SELECT j FROM Jeu j WHERE j.prixLocation BETWEEN :min AND :max\", Jeu.class);\n   q.setParameter(\"min\", min).setParameter(\"max\", max);\n   List<Jeu> jeux = q.getResultList();\n\n2) Membres récents → getResultList + ORDER BY\n   \"SELECT m FROM Membre m WHERE m.dateInscription > :depuis\n    ORDER BY m.dateInscription DESC\"\n   .setParameter(\"depuis\", date).getResultList();\n\n3) Nombre d'avis 5 étoiles → getSingleResult (un agrégat rend TOUJOURS une valeur)\n   Long nb = em.createQuery(\n     \"SELECT COUNT(a) FROM Avis a WHERE a.note = :note\", Long.class)\n     .setParameter(\"note\", 5).getSingleResult();\n\n4) Membre par pseudo (UNIQUE) → getSingleResult + NoResultException\n   try {\n     Membre m = em.createQuery(\n       \"SELECT m FROM Membre m WHERE m.pseudo = :p\", Membre.class)\n       .setParameter(\"p\", pseudo).getSingleResult();\n   } catch (NoResultException e) { /* pseudo inconnu : cas normal a gerer */ }\n\nCôté Spring Data :\n- (1), (2), (4) = méthodes dérivées :\n  findByPrixLocationBetween, findByDateInscriptionAfterOrderByDateInscriptionDesc,\n  findByPseudo (retour Optional<Membre> : l'exception devient un Optional vide).\n- (3) = countByNote(5) existe aussi... mais dès que l'agrégat se complique,\n  @Query(\"SELECT COUNT(a) FROM Avis a WHERE a.note = :note\") reprend la main :\n  c'est EXACTEMENT le JPQL écrit ci-dessus.",

};
