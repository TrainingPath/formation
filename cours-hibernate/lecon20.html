<p>Dix-neuf leçons de briques ; aujourd'hui, le bâtiment. Voici le modèle objet complet de la Ludothèque, fidèle au schéma MySQL du Niveau 4 (ddl-auto=validate le vérifie à chaque démarrage, leçon 4) :</p>
<pre class="pseudo">@Entity public class Categorie {                       // entité Categorie
  @Id @GeneratedValue(strategy = GenerationType.IDENTITY) private Long id;  // clé primaire auto-incrémentée
  @Column(nullable = false, length = 60, unique = true) private String nom; // nom : NOT NULL, VARCHAR(60), unique

  @ManyToOne(fetch = FetchType.LAZY)                    // N jeux → 1 catégorie, LAZY (leçon 8 + 12)

}                                                      // fin de Jeu

}                                                      // fin de Membre

<p>Relis ce bloc lentement : chaque annotation est une leçon. LAZY partout sur les @ManyToOne (leçon 12), mappedBy côté inverse (leçon 9), @JoinTable pour le many-to-many (leçon 10), @Embeddable sans identité propre (leçon 11).</p>

<h3>2. Le motif DAO : isoler la persistance</h3>
<p>On ne sème pas des em.find() dans toute l'application : on regroupe l'accès aux données par entité dans un <strong>DAO</strong> (Data Access Object, « objet d'accès aux données »), aussi appelé Repository. Une classe, un EntityManager injecté, des méthodes nommées métier :</p>
<pre class="pseudo">public class JeuDao {                              // DAO : accès aux données des Jeu
  private final EntityManager em;                 // l'EntityManager, injecté par le constructeur
  public JeuDao(EntityManager em) { this.em = em; }  // constructeur : on reçoit l'EntityManager

  public Optional&lt;Jeu&gt; trouverParId(Long id) {    // chercher un jeu par son identifiant
    return Optional.ofNullable(em.find(Jeu.class, id));   // find rend le jeu ou null → Optional (leçon 5)
  }                                               // fin de trouverParId
  public List&lt;Jeu&gt; cataloguePagine(int page, int taille) {  // une page du catalogue (leçon 16)
    return em.createQuery(                        // construire la requête JPQL...
        "SELECT j FROM Jeu j JOIN FETCH j.categorie ORDER BY j.titre", Jeu.class)  // JOIN FETCH : évite le N+1 (leçon 18)
      .setFirstResult(page * taille).setMaxResults(taille).getResultList();  // découpage OFFSET/LIMIT + exécution
  }                                               // fin de cataloguePagine
  public void sauvegarder(Jeu jeu) {              // enregistrer un jeu (création OU mise à jour)
    if (jeu.getId() == null) em.persist(jeu);     // pas d'id → nouveau → persist (leçon 5)
    else em.merge(jeu);                           // id présent → détaché → merge (leçon 6)
  }                                               // fin de sauvegarder
}                                                 // fin du DAO</pre>
<p>Avantages : les requêtes JPQL vivent en un seul endroit, testable et remplaçable ; le reste de l'application parle métier (« cataloguePagine »), jamais SQL.</p>

<h3>3. Les requêtes clés du projet</h3>
<pre class="pseudo">// Locations en retard (leçons 13-14) : LocationDao
SELECT l FROM Location l JOIN FETCH l.jeu JOIN FETCH l.membre   -- charger location + jeu + membre en UNE requête
WHERE l.dateRetourReelle IS NULL AND l.dateRetourPrevue &lt; :aujourdhui  -- pas encore rendue ET échéance dépassée
ORDER BY l.dateRetourPrevue                                     -- les plus en retard en premier

// Note moyenne d'un jeu (leçon 14, agrégat) : AvisDao
SELECT AVG(a.note) FROM Avis a WHERE a.jeu.id = :jeuId          -- moyenne des notes du jeu donné (calcul côté MySQL)

// Catalogue filtré par catégorie, paginé (leçons 13, 16, 18)
SELECT j FROM Jeu j JOIN FETCH j.categorie c                    -- jeux + leur catégorie (JOIN FETCH anti-N+1)
WHERE c.nom = :nomCategorie ORDER BY j.titre                    -- filtrés par nom de catégorie, triés par titre
  → setFirstResult / setMaxResults                              -- puis découpés en pages</pre>
<p>Remarque le réflexe désormais automatique : chaque requête d'affichage qui traverse une relation embarque son <strong>JOIN FETCH</strong> (leçon 18) — le N+1 est éliminé à la conception, pas en pompier.</p>

<h3>4. Les opérations métier transactionnelles</h3>
<p>louerJeu et rendreJeu sont les cœurs battants de l'application : plusieurs écritures qui doivent réussir ou échouer <strong>ensemble</strong> (leçon 17) :</p>
<pre class="pseudo">public Location louerJeu(Long jeuId, Long membreId) {  // opération métier : louer un jeu
  EntityManager em = emf.createEntityManager();        // ouvrir l'EntityManager (session courte)
  EntityTransaction tx = em.getTransaction();          // récupérer la transaction
  try {                                                // bloc protégé
    tx.begin();                                        // ouvrir la transaction
    Jeu jeu = em.find(Jeu.class, jeuId);               // charger le jeu
    Membre membre = em.find(Membre.class, membreId);   // charger le membre
    if (jeu == null || membre == null) throw new IntrouvableException();  // refuser si l'un manque
    if (locationDao.jeuDejaLoue(em, jeuId)) throw new JeuIndisponibleException();  // refuser si déjà loué
    Location loc = new Location(jeu, membre,           // créer la location...
        LocalDate.now(), LocalDate.now().plusDays(14));  // ...aujourd'hui, retour prévu dans 14 jours
    em.persist(loc);                                   // planifier l'INSERT
    tx.commit();                       // tout passe... ou rien (flush + COMMIT)
    return loc;                                        // renvoyer la location créée
  } catch (RuntimeException ex) {                      // en cas d'erreur...
    if (tx.isActive()) tx.rollback();  // jamais de tx orpheline : on annule tout
    throw ex;                                          // relancer l'erreur
  } finally { em.close(); }            // session courte (leçon 19) : toujours fermer
}                                                      // fin de louerJeu
// rendreJeu : find(Location) → setDateRetourReelle(now)
// → AUCUN appel d'update : le dirty checking s'en charge (leçon 6)</pre>

<h3>5. La check-list finale — et la passerelle vers Spring Data</h3>
<pre class="pseudo">CHECK-LIST DE LA COUCHE DE PERSISTANCE
[x] ddl-auto = validate : le schéma du Niveau 4 reste la référence
[x] entités = POJO + constructeur sans argument, jamais final
[x] toutes les associations @ManyToOne/@OneToMany en LAZY
[x] côté inverse : mappedBy ; collections initialisées à la déclaration
[x] un DAO par agrégat, EntityManager injecté, JPQL centralisé
[x] JOIN FETCH sur chaque requête d'affichage traversant une relation
[x] pagination systématique des listes (setFirstResult/setMaxResults)
[x] écritures = transaction ; rollback dans le catch ; close en finally
[x] sessions courtes ; flush/clear par paquets pour les imports</pre>
<p>Regarde une dernière fois ton JeuDao : trouverParId, cataloguePagine, sauvegarder… Au Niveau 6, Spring Data JPA <strong>générera exactement ces méthodes</strong> à partir d'une interface : <em>interface JeuRepository extends JpaRepository&lt;Jeu, Long&gt;</em> te donnera findById, findAll(Pageable), save — mêmes persist/merge, même EntityManager, mêmes transactions via @Transactional. Tu ne découvriras rien de nouveau : tu reconnaîtras tout. EF Core, Eloquent et Django ORM organisent leurs projets selon le même triptyque entités / repositories / services transactionnels.</p>
