<script>
var DAY = {
  num: 20,
  title: "L'authentification : mots de passe et MFA",
  subtitle: "Prouver qui l'on est : facteurs, bonnes pratiques et double authentification.",
  theory: `
<h3>1. Identification, authentification, autorisation</h3>
<p>Trois mots à ne pas confondre. L'<strong>identification</strong>, c'est annoncer qui l'on prétend être (« je suis alice »). L'<strong>authentification</strong>, c'est le <em>prouver</em> (donner le mot de passe). L'<strong>autorisation</strong>, c'est ce qu'on a le droit de faire une fois authentifié (lire tel dossier). Aujourd'hui, on se concentre sur l'authentification : la preuve d'identité.</p>
<h3>2. Les trois facteurs d'authentification</h3>
<p>On prouve son identité par un ou plusieurs <strong>facteurs</strong>, classés en trois familles. <strong>Ce que je sais</strong> (un mot de passe, un code PIN). <strong>Ce que je possède</strong> (un téléphone, une clé physique, une carte). <strong>Ce que je suis</strong> (une empreinte, un visage : la biométrie). Un mot de passe seul n'utilise qu'<em>un</em> facteur : s'il fuite, la porte est ouverte.</p>
<pre class="pseudo"># Les 3 facteurs :
# 1) CE QUE JE SAIS     -&gt; mot de passe, code PIN
# 2) CE QUE JE POSSEDE  -&gt; telephone (appli), cle FIDO2, carte a puce
# 3) CE QUE JE SUIS     -&gt; empreinte, visage (biometrie)</pre>
<h3>3. Le mot de passe : forces et faiblesses</h3>
<p>Le mot de passe reste omniprésent mais fragile : réutilisé, trop court, ou volé par hameçonnage (<em>phishing</em>). Les bonnes pratiques modernes ont changé. On privilégie la <strong>longueur</strong> (une <em>phrase de passe</em> longue vaut mieux qu'un mot court compliqué), on <strong>ne réutilise jamais</strong> le même mot de passe, et on s'appuie sur un <strong>gestionnaire de mots de passe</strong> pour en générer et stocker des uniques. Côté serveur, on ne stocke jamais un mot de passe en clair : on garde son <strong>empreinte</strong> (<em>hash</em>) calculée avec un algorithme lent et salé (bcrypt, argon2).</p>
<div class="tip">Recommandation actuelle (type NIST) : miser sur la <strong>longueur</strong> et l'unicité plutôt que sur des règles de complexité absurdes changées tous les mois. Une longue phrase de passe mémorisable bat « P@ss1! » réécrit chaque mois.</div>
<h3>4. La MFA : ajouter un second facteur</h3>
<p>La <strong>MFA</strong> (<em>Multi-Factor Authentication</em>, authentification multifacteur ; on parle aussi de <strong>2FA</strong> quand il y a deux facteurs) exige au moins <strong>deux facteurs de familles différentes</strong>. Même si le mot de passe fuite, l'attaquant n'a pas le second facteur. Les formes courantes : un <strong>code temporaire</strong> généré par une appli (<em>TOTP</em>, code à 6 chiffres qui change toutes les 30 s), une <strong>notification push</strong> à valider, ou une <strong>clé de sécurité physique FIDO2</strong> (la plus résistante au phishing).</p>
<div class="warn">Le SMS comme second facteur vaut mieux que rien, mais il est vulnérable (interception, échange de carte SIM / <em>SIM swap</em>). Préfère une appli TOTP ou une clé FIDO2 quand c'est possible.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Identification (qui je pretends etre) / Authentification (je le prouve) / Autorisation (mes droits)
# 3 facteurs : SAVOIR (mot de passe) | POSSEDER (tel, cle) | ETRE (biometrie)
# Bon mot de passe : LONG, UNIQUE, gere par un gestionnaire ; stocke en HASH sale (bcrypt/argon2)
# MFA / 2FA = au moins 2 facteurs de familles differentes
# Le mieux : TOTP ou cle FIDO2 ; le SMS est un pis-aller (SIM swap)</pre>`,
  exercises: [
    { type: "qcm", q: "Que fait l'authentification ?", opts: ["Annonce qui l'on prétend être", "Prouve l'identité annoncée", "Définit les droits d'accès", "Journalise les tentatives de connexion"], a: 1, exp: "L'authentification prouve l'identité ; l'identification l'annonce ; l'autorisation gère les droits." },
    { type: "input", q: "Comment appelle-t-on ce qu'un utilisateur a le droit de faire une fois authentifié ? (un mot)", a: ["autorisation", "l'autorisation"], ph: "un mot", exp: "L'autorisation gère les droits d'accès." },
    { type: "qcm", q: "À quelle famille appartient un mot de passe ?", opts: ["Ce que je possède", "Ce que je suis", "Ce que je sais", "Ce que je vois"], a: 2, exp: "Le mot de passe = ce que je sais." },
    { type: "qcm", q: "À quelle famille appartient une empreinte digitale ?", opts: ["Ce que je sais", "Ce que je possède", "Ce que je suis", "Ce que je fais"], a: 2, exp: "La biométrie = ce que je suis." },
    { type: "vf", q: "Une clé de sécurité physique FIDO2 relève du facteur « ce que je possède ».", a: true, exp: "Oui : c'est un objet que l'on détient." },
    { type: "input", q: "Comment nomme-t-on l'empreinte cryptographique d'un mot de passe stockée côté serveur ? (un mot, anglais)", a: ["hash", "le hash", "hachage"], ph: "un mot", exp: "Le hash (haché) : on ne stocke jamais le mot de passe en clair." },
    { type: "qcm", q: "Quelle pratique est aujourd'hui recommandée pour les mots de passe ?", opts: ["Les réutiliser partout", "Privilégier la longueur et l'unicité", "Les changer tous les jours obligatoirement", "Les écrire sur un post-it"], a: 1, exp: "Longueur + unicité (souvent via un gestionnaire) priment sur la complexité imposée." },
    { type: "vf", q: "Il est acceptable de stocker les mots de passe en clair côté serveur.", a: false, exp: "Non : on stocke un hash salé (bcrypt, argon2), jamais le clair." },
    { type: "input", q: "Que signifie le sigle MFA ? (donne les trois mots anglais)", a: ["multi factor authentication", "multi-factor authentication", "multifactor authentication"], ph: "trois mots", exp: "MFA = Multi-Factor Authentication." },
    { type: "qcm", q: "Qu'exige la MFA ?", opts: ["Deux mots de passe différents", "Au moins deux facteurs de familles différentes", "Un mot de passe très long", "Une seule empreinte"], a: 1, exp: "La MFA combine des facteurs de familles distinctes (savoir + posséder, etc.)." },
    { type: "qcm", q: "Que génère une application TOTP ?", opts: ["Un mot de passe permanent", "Un code temporaire (souvent 6 chiffres) qui change toutes les 30 s", "Une clé publique", "Une adresse IP"], a: 1, exp: "TOTP : code temporaire renouvelé périodiquement." },
    { type: "vf", q: "Deux mots de passe distincts constituent une vraie MFA à deux facteurs.", a: false, exp: "Non : deux mots de passe restent le même facteur (savoir). Il faut des familles différentes." },
    { type: "input", q: "Quel facteur physique résiste le mieux au phishing (nom de la norme, ex. FIDO...) ?", a: ["fido2", "fido 2", "cle fido2", "cle de securite fido2"], ph: "une norme", exp: "Une clé FIDO2 est très résistante au hameçonnage." },
    { type: "qcm", q: "Pourquoi le SMS est-il un second facteur moins sûr ?", opts: ["Il coûte cher", "Il est vulnérable à l'interception et au SIM swap", "Il est trop lent", "Il n'existe plus"], a: 1, exp: "Le SMS peut être intercepté ou détourné via un échange de carte SIM." },
    { type: "vf", q: "Un gestionnaire de mots de passe aide à avoir des mots de passe uniques et longs.", a: true, exp: "Oui : il génère et stocke des mots de passe uniques et complexes." }
  ],
  final: {
    title: "Exercice final — Sécuriser les comptes d'une petite équipe",
    intro: `<p>Une association découvre qu'un compte a été piraté : le mot de passe « soleil2020 » était réutilisé sur plusieurs sites. On veut mettre en place une politique d'authentification solide.</p>`,
    questions: [
      { type: "qcm", q: "Quelle faiblesse a permis le piratage ?", opts: ["Un mot de passe trop long", "Un mot de passe faible et réutilisé", "Trop de MFA", "Un hash trop lent"], a: 1, exp: "Faible + réutilisé : la fuite d'un site ouvre les autres comptes." },
      { type: "input", q: "Quel outil recommander pour générer et stocker des mots de passe uniques ? (deux mots)", a: ["gestionnaire de mots de passe", "un gestionnaire de mots de passe", "gestionnaire mots de passe"], ph: "deux/trois mots", exp: "Un gestionnaire de mots de passe." },
      { type: "qcm", q: "Quelle mesure protège même si un mot de passe fuite à nouveau ?", opts: ["Changer d'IP", "Activer la MFA", "Désactiver le pare-feu", "Utiliser un mot de passe plus court"], a: 1, exp: "La MFA exige un second facteur que l'attaquant n'a pas." },
      { type: "vf", q: "Choisir « soleil2020 » recopié partout est une bonne pratique.", a: false, exp: "Non : faible et réutilisé, c'est justement le problème." },
      { type: "qcm", q: "Pour la MFA, quel choix est le plus robuste face au phishing ?", opts: ["SMS", "Clé de sécurité FIDO2", "Question secrète", "E-mail de secours"], a: 1, exp: "La clé FIDO2 résiste le mieux au hameçonnage." }
    ],
    solution: `<pre class="pseudo"># Politique d'authentification recommandee :
# 1) Mots de passe LONGS et UNIQUES via un gestionnaire (phrases de passe).
# 2) Cote serveur : stockage en HASH sale (bcrypt / argon2), jamais en clair.
# 3) MFA activee partout : 2 facteurs de familles differentes
#    (mot de passe = SAVOIR + appli TOTP/cle FIDO2 = POSSEDER).
# 4) Preferer TOTP ou FIDO2 au SMS (risque de SIM swap).
# Resultat : meme si un mot de passe fuit, le compte reste protege.</pre>
<p>Les comptes sont bien plus difficiles à compromettre. Demain : centraliser l'authentification à l'échelle du réseau avec RADIUS et 802.1X.</p>`
  }
};
</script>
