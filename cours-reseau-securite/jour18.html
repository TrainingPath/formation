var DAY = {
  num: 18,
  title: "IPsec et le VPN site à site",
  subtitle: "Relier deux réseaux d'entreprise par un tunnel permanent et chiffré.",
  theory: `
<h3>1. Le besoin : relier deux sites comme un seul réseau</h3>
<p>Une entreprise a un siège à Paris et une agence à Lyon. On veut que les deux réseaux locaux communiquent <strong>comme s'ils étaient un seul LAN</strong>, en passant par Internet, mais sans exposer les données. C'est le rôle du <strong>VPN site à site</strong> (en anglais <em>site-to-site</em>) : un tunnel permanent monté entre les deux passerelles (les routeurs/pare-feu), transparent pour les utilisateurs. Personne n'installe de logiciel : ce sont les équipements réseau qui chiffrent.</p>
<p>La technologie de référence pour cela est <strong>IPsec</strong> (<em>IP Security</em>), une suite de protocoles standardisée qui sécurise directement la couche IP.</p>
<h3>2. Les deux protocoles d'IPsec : AH et ESP</h3>
<p>IPsec propose deux « moteurs » de protection. <strong>AH</strong> (<em>Authentication Header</em>) assure l'<strong>authentification</strong> et l'<strong>intégrité</strong> du paquet, mais <em>ne chiffre pas</em> les données. <strong>ESP</strong> (<em>Encapsulating Security Payload</em>) assure l'intégrité, l'authentification <em>et</em> la <strong>confidentialité</strong> (chiffrement). En pratique on utilise presque toujours <strong>ESP</strong>, car sans chiffrement un VPN a peu d'intérêt. AH est aussi mal compatible avec le NAT.</p>
<div class="tip">Mémo simple : <strong>AH = signe mais ne cache pas</strong> ; <strong>ESP = signe ET chiffre</strong>. Pour un vrai VPN confidentiel, on choisit ESP.</div>
<h3>3. Deux modes : transport et tunnel</h3>
<p>IPsec fonctionne selon deux modes. En <strong>mode transport</strong>, seule la charge utile (les données) est protégée, l'en-tête IP d'origine reste visible : c'est utilisé de bout en bout entre deux hôtes. En <strong>mode tunnel</strong>, le paquet IP <em>entier</em> est chiffré et encapsulé dans un nouveau paquet : c'est LE mode du VPN site à site, car il masque aussi les adresses internes.</p>
<pre class="pseudo"># Mode TRANSPORT (hote a hote) :
[ IP d'origine ][ ESP ][ donnees chiffrees ]
#   en-tete IP visible

# Mode TUNNEL (site a site, entre passerelles) :
[ nouvelle IP: passerelleA -&gt; passerelleB ][ ESP ][ CHIFFRE: IP interne + donnees ]
#   les adresses INTERNES sont cachees dans le tunnel</pre>
<h3>4. Négociation : IKE et les phases</h3>
<p>Avant de chiffrer, les deux passerelles doivent s'authentifier et convenir des clés. C'est le rôle du protocole <strong>IKE</strong> (<em>Internet Key Exchange</em>, aujourd'hui IKEv2). Il se déroule en deux temps : d'abord établir un canal sécurisé de négociation (phase 1), puis négocier les paramètres du tunnel de données lui-même (phase 2). L'authentification des passerelles se fait par une <strong>clé pré-partagée</strong> (<em>PSK</em>) ou par <strong>certificats</strong>. On appelle l'accord négocié une <strong>SA</strong> (<em>Security Association</em>).</p>
<div class="warn">Une clé pré-partagée (PSK) trop courte ou réutilisée est un maillon faible : sur un tunnel exposé à Internet, préfère une PSK longue et aléatoire, ou mieux, des certificats.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># VPN site a site = tunnel permanent entre 2 passerelles (transparent)
# IPsec = suite de protocoles securisant la couche IP
# AH  = authentification + integrite (PAS de chiffrement)
# ESP = authentification + integrite + CONFIDENTIALITE (chiffrement)  &lt;- usuel
# Mode transport = hote a hote ; Mode TUNNEL = site a site (masque les IP internes)
# IKE (IKEv2) negocie cles et SA ; auth par PSK ou certificats</pre>`,
  exercises: [
    { type: "qcm", q: "Que relie un VPN site à site ?", opts: ["Deux applications", "Deux réseaux entiers via leurs passerelles", "Deux disques durs", "Deux navigateurs"], a: 1, exp: "Il relie deux LAN via les passerelles, de façon transparente pour les utilisateurs." },
    { type: "input", q: "Quelle suite de protocoles sécurise directement la couche IP et sert de base au VPN site à site ? (un mot)", a: ["ipsec"], ph: "un mot", exp: "IPsec (IP Security)." },
    { type: "qcm", q: "Lequel des deux protocoles IPsec CHIFFRE les données ?", opts: ["AH", "ESP", "Aucun", "Les deux à parts égales"], a: 1, exp: "ESP assure la confidentialité (chiffrement) ; AH ne chiffre pas." },
    { type: "vf", q: "AH (Authentication Header) chiffre les données pour les rendre confidentielles.", a: false, exp: "Non : AH assure authentification et intégrité, mais ne chiffre pas." },
    { type: "input", q: "Quel mode IPsec chiffre le paquet IP entier et est utilisé pour le site à site ? (un mot)", a: ["tunnel", "mode tunnel", "le mode tunnel"], ph: "un mot", exp: "Le mode tunnel encapsule tout le paquet et masque les IP internes." },
    { type: "qcm", q: "En mode transport, qu'est-ce qui reste visible ?", opts: ["Rien", "L'en-tête IP d'origine", "La clé secrète", "Le mot de passe utilisateur"], a: 1, exp: "En mode transport, l'en-tête IP d'origine reste visible ; seules les données sont protégées." },
    { type: "qcm", q: "Quel protocole négocie les clés et l'authentification avant IPsec ?", opts: ["ARP", "IKE (IKEv2)", "DNS", "DHCP"], a: 1, exp: "IKE (Internet Key Exchange) établit les SA et négocie les clés." },
    { type: "vf", q: "Le mode tunnel masque les adresses IP internes des deux sites.", a: true, exp: "Oui : le paquet interne (avec ses IP) est chiffré dans un nouveau paquet." },
    { type: "input", q: "Comment appelle-t-on l'accord de sécurité négocié (paramètres, clés) entre deux extrémités IPsec ? (sigle 2 lettres)", a: ["sa"], ph: "2 lettres", exp: "SA = Security Association." },
    { type: "qcm", q: "Que signifie ESP ?", opts: ["Extra Secure Protocol", "Encapsulating Security Payload", "Encrypted Session Path", "External Site Protection"], a: 1, exp: "ESP = Encapsulating Security Payload." },
    { type: "vf", q: "En pratique, ESP est le protocole IPsec le plus utilisé pour un vrai VPN.", a: true, exp: "Oui : sans chiffrement (ESP), un VPN a peu d'intérêt ; AH est aussi gêné par le NAT." },
    { type: "qcm", q: "Quelles méthodes authentifient les passerelles avec IKE ?", opts: ["Login/mot de passe uniquement", "Clé pré-partagée (PSK) ou certificats", "Adresse MAC", "Numéro de série"], a: 1, exp: "IKE authentifie par PSK (clé pré-partagée) ou par certificats." },
    { type: "input", q: "Quel sigle (3 lettres) désigne une clé secrète connue à l'avance des deux passerelles ?", a: ["psk"], ph: "3 lettres", exp: "PSK = Pre-Shared Key." },
    { type: "qcm", q: "Pourquoi AH est-il peu adapté quand il y a du NAT ?", opts: ["Il est trop rapide", "Il protège l'en-tête IP que le NAT modifie, ce qui casse la vérification", "Il chiffre trop fort", "Il ne fonctionne qu'en IPv6"], a: 1, exp: "AH authentifie des champs de l'en-tête IP que le NAT réécrit, invalidant le contrôle." },
    { type: "vf", q: "Un VPN site à site oblige chaque utilisateur à installer un logiciel client.", a: false, exp: "Non : ce sont les passerelles qui chiffrent ; c'est transparent pour les postes." }
  ],
  final: {
    title: "Exercice final — Relier Paris et Lyon",
    intro: `<p>L'entreprise veut que le réseau <code>10.1.0.0/16</code> (Paris) et <code>10.2.0.0/16</code> (Lyon) communiquent via Internet, de façon chiffrée et transparente pour les employés. On configure un tunnel IPsec entre les deux pare-feu.</p>`,
    questions: [
      { type: "qcm", q: "Quel type de VPN convient ?", opts: ["Site à site", "Nomade individuel", "Aucun, impossible", "VPN navigateur"], a: 0, exp: "Relier deux réseaux entiers via leurs passerelles = VPN site à site." },
      { type: "qcm", q: "Quel mode IPsec choisir pour masquer les adresses internes ?", opts: ["Transport", "Tunnel", "Direct", "Bridge"], a: 1, exp: "Le mode tunnel encapsule le paquet entier et cache les IP internes." },
      { type: "input", q: "Quel protocole (ESP ou AH) faut-il pour que les données soient chiffrées ?", a: ["esp"], ph: "3 lettres", exp: "ESP fournit la confidentialité (chiffrement)." },
      { type: "vf", q: "Les employés de Lyon devront installer un client VPN sur leur poste.", a: false, exp: "Non : le tunnel est monté entre les pare-feu, c'est transparent côté postes." },
      { type: "qcm", q: "Avant de chiffrer, que font les deux pare-feu ?", opts: ["Rien", "Ils négocient clés et SA via IKE et s'authentifient (PSK/certificats)", "Ils désactivent le NAT partout", "Ils changent d'adresse MAC"], a: 1, exp: "IKE établit l'authentification et les Security Associations avant le trafic chiffré." }
    ],
    solution: `<pre class="pseudo"># Tunnel IPsec site a site Paris (10.1.0.0/16) &lt;-&gt; Lyon (10.2.0.0/16)
# 1) IKEv2 : les 2 pare-feu s'authentifient (PSK longue ou certificats)
# 2) On negocie les SA (phase 1 puis phase 2)
# 3) Protocole ESP en MODE TUNNEL :
[ IP: pareFeuParis -&gt; pareFeuLyon ][ ESP ][ CHIFFRE: 10.1.x -&gt; 10.2.x + donnees ]
# Resultat : les deux LAN communiquent comme un seul, en chiffre, sans client sur les postes.</pre>
<p>Les deux sites forment un réseau unique et sûr. Demain : le VPN pour l'utilisateur nomade en télétravail.</p>`
  }
};
