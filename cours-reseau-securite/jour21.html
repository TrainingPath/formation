<script>
var DAY = {
  num: 21,
  title: "RADIUS et le contrôle d'accès (802.1X)",
  subtitle: "Authentifier de façon centralisée qui a le droit de se brancher au réseau.",
  theory: `
<h3>1. Le besoin : contrôler l'accès au réseau lui-même</h3>
<p>Jusqu'ici on authentifiait des comptes d'application. Mais comment empêcher un inconnu qui branche un câble dans une prise murale, ou se connecte au Wi-Fi, d'accéder au réseau ? Il faut authentifier <strong>l'appareil ou l'utilisateur avant de lui donner le réseau</strong>. Deux briques s'en chargent : le standard <strong>802.1X</strong> (contrôle d'accès au port) et le serveur <strong>RADIUS</strong> (authentification centralisée).</p>
<h3>2. RADIUS : l'authentification centralisée (AAA)</h3>
<p><strong>RADIUS</strong> (<em>Remote Authentication Dial-In User Service</em>) est un serveur qui centralise les <strong>trois A</strong> : <strong>Authentication</strong> (qui es-tu ?), <strong>Authorization</strong> (à quoi as-tu droit ?), <strong>Accounting</strong> (journalisation de l'usage). Au lieu que chaque switch ou borne Wi-Fi gère ses propres comptes, tous interrogent <em>le même</em> serveur RADIUS, souvent adossé à un annuaire (Active Directory, LDAP). Un seul endroit à administrer, des règles cohérentes partout.</p>
<pre class="pseudo"># AAA du serveur RADIUS :
# Authentication -&gt; verifier l'identite
# Authorization  -&gt; decider les droits (VLAN, acces)
# Accounting     -&gt; enregistrer qui, quand, combien de temps</pre>
<h3>3. 802.1X : les trois rôles (port-based NAC)</h3>
<p><strong>802.1X</strong> réalise un contrôle d'accès <strong>basé sur le port</strong> (<em>port-based Network Access Control</em>). Tant que l'appareil n'est pas authentifié, le port du switch (ou l'association Wi-Fi) ne laisse rien passer. Il y a trois acteurs. Le <strong>supplicant</strong> : le poste qui demande l'accès. L'<strong>authenticator</strong> : le switch ou la borne Wi-Fi qui garde la porte. Le <strong>serveur d'authentification</strong> : le RADIUS qui tranche. Le supplicant et le serveur dialoguent via <strong>EAP</strong> (<em>Extensible Authentication Protocol</em>), l'authenticator ne faisant que relayer.</p>
<pre class="pseudo"># Trois roles 802.1X :
# Supplicant (le poste) &lt;--EAP--&gt; Authenticator (le switch/borne) &lt;--RADIUS--&gt; Serveur (RADIUS)
#   demande l'acces            garde le port, relaie              decide oui/non</pre>
<h3>4. Ce que ça permet et les méthodes EAP</h3>
<p>Une fois l'utilisateur reconnu, RADIUS peut renvoyer au switch une <strong>consigne d'autorisation</strong> : par exemple « place ce port dans le VLAN 20 » (dynamic VLAN assignment), ou « refuse ». On peut ainsi isoler automatiquement un visiteur dans un VLAN invité. Les méthodes d'authentification (EAP) varient : <strong>EAP-TLS</strong> (certificats des deux côtés, le plus sûr), <strong>PEAP</strong> ou <strong>EAP-TTLS</strong> (identifiant/mot de passe dans un tunnel TLS).</p>
<div class="tip">802.1X + RADIUS, c'est le socle du Wi-Fi d'entreprise (<strong>WPA2/WPA3-Enterprise</strong>) : chaque employé a ses propres identifiants, sans clé Wi-Fi partagée à changer quand quelqu'un part.</div>
<div class="warn">Sans 802.1X, une simple prise réseau accessible (salle d'attente, hall) est une porte ouverte sur le LAN. Le contrôle d'accès au port ferme cette faille.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Objectif : authentifier AVANT de donner l'acces reseau (prise ou Wi-Fi)
# RADIUS = serveur d'authentification centralisee -&gt; AAA (Authentication/Authorization/Accounting)
# 802.1X = controle d'acces base sur le PORT (port-based NAC)
# 3 roles : Supplicant (poste) | Authenticator (switch/borne) | Serveur (RADIUS)
# Dialogue via EAP ; methodes : EAP-TLS (certificats), PEAP/EAP-TTLS (mot de passe en tunnel)
# Bonus : RADIUS peut assigner dynamiquement un VLAN au port</pre>`,
  exercises: [
    { type: "qcm", q: "Que centralise un serveur RADIUS ?", opts: ["Le stockage des fichiers", "L'authentification, l'autorisation et l'accounting (AAA)", "Le routage IP", "L'attribution DHCP uniquement"], a: 1, exp: "RADIUS assure les 3 A : Authentication, Authorization, Accounting." },
    { type: "input", q: "Quel standard réalise un contrôle d'accès basé sur le port ? (norme, ex. 802.1?)", a: ["802.1x", "8021x", "ieee 802.1x"], ph: "une norme", exp: "802.1X = contrôle d'accès basé sur le port." },
    { type: "qcm", q: "Dans 802.1X, comment appelle-t-on le poste qui demande l'accès ?", opts: ["Authenticator", "Supplicant", "Serveur", "Routeur"], a: 1, exp: "Le supplicant est le client qui demande l'accès." },
    { type: "qcm", q: "Quel rôle joue le switch ou la borne Wi-Fi dans 802.1X ?", opts: ["Supplicant", "Authenticator (garde-porte, relais)", "Serveur d'authentification", "Aucun"], a: 1, exp: "L'authenticator garde le port et relaie vers le serveur RADIUS." },

    { type: "input", q: "Quel protocole extensible transporte le dialogue d'authentification entre supplicant et serveur ? (sigle 3 lettres)", a: ["eap"], ph: "3 lettres", exp: "EAP = Extensible Authentication Protocol." },
    { type: "qcm", q: "Que signifie le troisième A de AAA (Accounting) ?", opts: ["Chiffrement", "Journalisation de l'usage (qui, quand, combien)", "Attribution d'IP", "Filtrage d'URL"], a: 1, exp: "Accounting = comptabilité/journalisation de l'usage." },
    { type: "qcm", q: "Quelle méthode EAP utilise des certificats des deux côtés et est la plus sûre ?", opts: ["EAP-TLS", "PAP", "CHAP", "EAP-MD5"], a: 0, exp: "EAP-TLS s'appuie sur des certificats client et serveur." },
    { type: "vf", q: "RADIUS peut demander au switch de placer un port dans un VLAN précis après authentification.", a: true, exp: "Oui : c'est l'attribution dynamique de VLAN." },
    { type: "input", q: "À quel annuaire RADIUS est-il souvent adossé en entreprise (deux mots ou sigle) ?", a: ["active directory", "ldap", "annuaire ldap", "ad"], ph: "un annuaire", exp: "Souvent Active Directory / LDAP." },
    { type: "qcm", q: "Quel avantage du Wi-Fi d'entreprise (WPA2/WPA3-Enterprise) via 802.1X ?", opts: ["Une seule clé partagée pour tous", "Chaque employé a ses propres identifiants, sans clé Wi-Fi commune", "Pas besoin d'authentification", "Débit doublé garanti"], a: 1, exp: "Identifiants individuels : pas de clé partagée à changer au départ d'un employé." },
    { type: "vf", q: "Le supplicant dialogue directement avec le serveur RADIUS sans passer par l'authenticator.", a: false, exp: "Non : l'authenticator relaie le dialogue EAP vers le serveur." },
    { type: "qcm", q: "Pourquoi une prise réseau libre dans un hall est-elle risquée sans 802.1X ?", opts: ["Elle consomme de l'électricité", "N'importe qui peut se brancher et accéder au LAN", "Elle ralentit le Wi-Fi", "Elle change les IP"], a: 1, exp: "Sans contrôle de port, une prise accessible ouvre le LAN à un inconnu." },
    { type: "input", q: "Que signifie le premier A de AAA ? (un mot, français ou anglais)", a: ["authentification", "authentication"], ph: "un mot", exp: "Authentication : vérifier l'identité." },
    { type: "qcm", q: "Quel intérêt d'un serveur RADIUS unique plutôt que des comptes sur chaque switch ?", opts: ["Aucun", "Administration centralisée et règles cohérentes partout", "Cela supprime le besoin de mots de passe", "Cela double le trafic"], a: 1, exp: "Un point d'administration unique = cohérence et simplicité." }
  ],
  final: {
    title: "Exercice final — Verrouiller l'accès au réseau du campus",
    intro: `<p>Un campus veut que seules les machines et personnes autorisées accèdent au réseau, que ce soit par une prise murale ou par le Wi-Fi. On déploie 802.1X avec un serveur RADIUS relié à l'annuaire.</p>`,
    questions: [
      { type: "qcm", q: "Quel standard bloque le port tant que l'appareil n'est pas authentifié ?", opts: ["802.1X", "802.11n", "HTTP", "DHCP"], a: 0, exp: "802.1X contrôle l'accès au port." },
      { type: "input", q: "Quel type de serveur centralise l'authentification (un mot) ?", a: ["radius", "serveur radius"], ph: "un mot", exp: "Un serveur RADIUS." },
      { type: "qcm", q: "Quel équipement joue le rôle d'authenticator ?", opts: ["Le PC de l'étudiant", "Le switch ou la borne Wi-Fi", "Le serveur RADIUS", "Le pare-feu Internet"], a: 1, exp: "Le switch/borne est l'authenticator qui garde le port." },
      { type: "vf", q: "RADIUS peut placer automatiquement un visiteur dans un VLAN invité isolé.", a: true, exp: "Oui : attribution dynamique de VLAN selon l'identité." },
      { type: "qcm", q: "Quelle méthode EAP offrirait la plus forte assurance (certificats des deux côtés) ?", opts: ["EAP-TLS", "PAP en clair", "Aucune", "CHAP"], a: 0, exp: "EAP-TLS avec certificats client et serveur est la plus robuste." }
    ],
    solution: `<pre class="pseudo"># Deploiement 802.1X + RADIUS sur le campus :
# Supplicant (poste) &lt;--EAP--&gt; Authenticator (switch/borne) &lt;--RADIUS--&gt; Serveur RADIUS (+ annuaire)
# 1) Port/Wi-Fi bloque tant que non authentifie.
# 2) RADIUS verifie l'identite via l'annuaire (AD/LDAP) -&gt; Authentication.
# 3) Il renvoie une decision -&gt; Authorization (ex: VLAN 20 pour employe, VLAN invite sinon).
# 4) Il journalise la session -&gt; Accounting.
# Methode conseillee : EAP-TLS (certificats). Wi-Fi = WPA2/WPA3-Enterprise.</pre>
<p>Le réseau n'est plus ouvert à quiconque branche un câble. Demain : segmenter et durcir le LAN avec les VLAN et la port security.</p>`
  }
};
