<script>
var DAY = {
  num: 10,
  title: "La DMZ : la zone démilitarisée",
  subtitle: "Un sas isolé pour les services qu'on doit exposer sans risquer tout le réseau.",
  theory: `
<h3>1. Le problème : exposer sans tout exposer</h3>
<p>Une entreprise doit parfois publier des services accessibles depuis Internet : un site web, un serveur de messagerie, un DNS public. Or ces machines, joignables par le monde entier, sont les plus exposées aux attaques. Si l'une d'elles est compromise et qu'elle se trouve dans le réseau interne, l'attaquant a un pied directement au milieu des postes de travail et des bases de données. Il faut donc les <strong>isoler</strong>.</p>
<p>La solution est la <strong>DMZ</strong> (en anglais <em>demilitarized zone</em>, « zone démilitarisée », terme emprunté au vocabulaire militaire d'une bande neutre entre deux camps). En réseau, la DMZ est un <strong>segment isolé</strong>, séparé à la fois d'Internet et du réseau interne (en anglais <em>LAN</em>), où l'on place les services exposés au public.</p>
<h3>2. Trois zones, une logique de confiance</h3>
<p>On distingue trois espaces avec trois niveaux de confiance croissants :</p>
<pre class="pseudo"># Les trois zones autour du pare-feu
INTERNET   : zone non fiable (tout le monde, y compris les attaquants)
DMZ        : zone semi-fiable, isolee -> serveurs web, mail, DNS publics
LAN interne: zone de confiance -> postes, fichiers, bases de donnees</pre>
<p>La règle d'or : Internet peut atteindre la <strong>DMZ</strong> (pour consulter le site), mais <strong>ne doit jamais atteindre directement le LAN</strong>. Et si un serveur de la DMZ est piraté, l'attaquant reste coincé dans la DMZ : il ne peut pas rebondir librement vers l'interne.</p>
<h3>3. Comment on construit une DMZ</h3>
<p>Deux montages classiques. Le premier utilise <strong>un seul pare-feu à trois pattes</strong> (three-legged) : une interface vers Internet, une vers la DMZ, une vers le LAN, chacune avec ses règles. Le second, plus robuste, utilise <strong>deux pare-feux</strong> encadrant la DMZ (architecture en sandwich) :</p>
<pre class="pseudo"># Architecture a deux pare-feux (la DMZ est au milieu)
Internet --[ Pare-feu externe ]-- DMZ --[ Pare-feu interne ]-- LAN
                    |                            |
   laisse entrer 80/443 vers la DMZ   ne laisse presque rien
   bloque tout vers le LAN            passer DMZ -> LAN</pre>
<div class="tip">Le sens des flux est la clé : on autorise <strong>Internet vers DMZ</strong> sur les seuls ports publics (par exemple 80 et 443 pour un site web), et on restreint très fortement <strong>DMZ vers LAN</strong>. La DMZ n'a besoin de parler à l'interne que pour des cas précis et contrôlés.</div>
<h3>4. Ce qu'on met (et ce qu'on ne met pas) en DMZ</h3>
<p>En DMZ : les services <strong>destinés au public</strong> — serveur web frontal, relais de messagerie, DNS externe, passerelle VPN. Jamais en DMZ : les <strong>données sensibles</strong> et les systèmes internes — base de données clients, contrôleur de domaine, fichiers RH. Un serveur web en DMZ qui a besoin de la base de données garde celle-ci dans le LAN et n'y accède qu'à travers une règle étroite et surveillée.</p>
<div class="warn">Une DMZ mal cloisonnée ne sert à rien : si la règle « DMZ vers LAN » est trop large, l'isolation est fictive. Le principe défensif est le <strong>moindre privilège</strong> : n'autoriser que le strict flux nécessaire, dans le seul sens nécessaire.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># DMZ = segment ISOLE pour les services exposes au public
# 3 zones : Internet (non fiable) / DMZ (semi-fiable) / LAN (confiance)
# Regle d'or : Internet -> DMZ oui ; Internet -> LAN jamais directement
# Si la DMZ est compromise, l'attaquant reste coince (pas de rebond vers le LAN)
# Montages : un pare-feu a 3 pattes OU deux pare-feux (sandwich)
# Principe : moindre privilege, on n'ouvre que le flux strictement necessaire</pre>`,
  exercises: [
    { type: "qcm", q: "Que désigne une DMZ en réseau ?", opts: ["Un logiciel antivirus", "Un segment isolé pour les services exposés au public", "Un type de câble", "Un protocole de chiffrement"], a: 1, exp: "La DMZ est une zone isolée, séparée d'Internet et du LAN, pour les services exposés." },
    { type: "input", q: "Que signifie le sigle DMZ (en anglais) ?", a: ["demilitarized zone", "zone démilitarisée", "demilitarised zone"], ph: "en toutes lettres", exp: "DMZ = demilitarized zone, la « zone démilitarisée »." },
    { type: "qcm", q: "Quelle machine placerait-on typiquement en DMZ ?", opts: ["La base de données clients", "Le serveur web public", "Le contrôleur de domaine", "Le serveur de fichiers RH"], a: 1, exp: "Les services destinés au public (web, mail, DNS externe) vont en DMZ." },

    { type: "qcm", q: "Quelle zone a le plus bas niveau de confiance ?", opts: ["Le LAN interne", "La DMZ", "Internet", "Le pare-feu"], a: 2, exp: "Internet est la zone non fiable ; le LAN est la zone de confiance." },
    { type: "vf", q: "Le flux « DMZ vers LAN » doit être restreint au strict minimum.", a: true, exp: "Oui : par moindre privilège, on n'ouvre que le flux nécessaire et contrôlé." },
    { type: "qcm", q: "L'architecture DMZ « en sandwich » utilise…", opts: ["Aucun pare-feu", "Un seul pare-feu", "Deux pare-feux encadrant la DMZ", "Trois routeurs"], a: 2, exp: "Deux pare-feux (externe et interne) encadrent la DMZ." },
    { type: "input", q: "Quel principe de sécurité recommande de n'autoriser que le flux strictement nécessaire ?", a: ["moindre privilège", "moindre privilege", "least privilege", "principe du moindre privilège"], ph: "un principe", exp: "Le moindre privilège : n'accorder que ce qui est indispensable." },
    { type: "qcm", q: "Pourquoi isole-t-on les services exposés dans une DMZ ?", opts: ["Pour aller plus vite", "Pour qu'une compromission ne donne pas accès au réseau interne", "Pour économiser des adresses IP", "Pour éviter le chiffrement"], a: 1, exp: "L'isolation limite l'impact d'une compromission au seul segment DMZ." },
    { type: "vf", q: "Une règle « DMZ vers LAN » trop large rend l'isolation quasi inutile.", a: true, exp: "Oui : si le cloisonnement est trop permissif, la protection devient fictive." },
    { type: "qcm", q: "Un serveur web en DMZ a besoin de la base de données interne. Que fait-on ?", opts: ["On déplace la base en DMZ", "On garde la base dans le LAN et on ouvre une règle étroite et surveillée", "On expose la base à Internet", "On supprime le pare-feu"], a: 1, exp: "La base reste dans le LAN ; seul un flux minimal et contrôlé est autorisé." }
  ],
  final: {
    title: "Exercice final — Publier un site sans exposer l'entreprise",
    intro: `<p>La société Nova veut mettre en ligne un site vitrine. Ce site consulte une base de données clients hébergée en interne. L'équipe sécurité doit concevoir l'architecture pour exposer le site sans ouvrir le réseau interne. Aidons-la.</p>`,
    questions: [
      { type: "qcm", q: "Où placer le serveur web frontal ?", opts: ["Dans le LAN interne", "En DMZ", "Sur Internet directement", "Sur le poste d'un employé"], a: 1, exp: "Le serveur web public se place en DMZ, zone isolée pour l'exposition." },
      { type: "qcm", q: "Où reste la base de données clients ?", opts: ["En DMZ", "Dans le LAN interne", "Sur Internet", "Chez le fournisseur d'accès"], a: 1, exp: "Donnée sensible : elle reste dans le LAN, jamais exposée." },
      { type: "input", q: "Quels flux autorise-t-on d'Internet vers la DMZ pour le site web ? (ports)", a: ["80 et 443", "80 443", "443 et 80", "80,443"], ph: "deux nombres", exp: "HTTP 80 et HTTPS 443, uniquement vers le serveur web de la DMZ." },
      { type: "vf", q: "On ouvre un accès large de la DMZ vers tout le LAN pour simplifier.", a: false, exp: "Non : on n'ouvre qu'un flux étroit DMZ vers la base précise, par moindre privilège." },
      { type: "qcm", q: "Un attaquant compromet le serveur web en DMZ. Grâce à l'architecture, il…", opts: ["Accède librement à tout le LAN", "Reste confiné à la DMZ, sans rebond libre vers l'interne", "Chiffre automatiquement ses traces", "Prend le contrôle du pare-feu"], a: 1, exp: "L'isolation confine l'attaquant à la DMZ : c'est tout l'intérêt du montage." }
    ],
    solution: `<pre class="pseudo"># Architecture cible pour Nova
Internet --[ FW externe ]-- DMZ (serveur web) --[ FW interne ]-- LAN (BDD)
Regles :
  Internet -> DMZ   : autoriser TCP 80 et 443 vers le serveur web SEULEMENT
  Internet -> LAN   : BLOQUER (aucun acces direct)
  DMZ -> LAN        : autoriser UNIQUEMENT le port de la base, vers la BDD precise
  Sens inverses     : bloques par defaut
# Resultat : site public accessible, BDD protegee, compromission confinee.</pre>
<p>En cloisonnant selon les trois zones et le moindre privilège, Nova publie son site tout en gardant ses données à l'abri.</p>`
  }
};
