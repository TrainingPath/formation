var DAY = {
  num: 31,
  title: "Projet final : sécuriser l'infra d'une PME",
  subtitle: "Assembler toutes les briques : pare-feu, DMZ, VPN, MFA, durcissement, supervision.",
  theory: `
<h3>1. Le projet : une petite entreprise à protéger</h3>
<p>Voici la synthèse de tout le parcours. Imagine une PME de 30 personnes : des postes de travail, quelques serveurs internes (fichiers, base de données), un site web public et des employés parfois en télétravail. Ton rôle, en tant que responsable défensif, est de concevoir une architecture <strong>sûre par conception</strong> en assemblant les briques vues les jours précédents. Aucune brique seule ne suffit : c'est leur <strong>combinaison</strong> qui protège.</p>
<h3>2. Segmenter : pare-feu et DMZ</h3>
<p>Le <strong>pare-feu</strong> (firewall) filtre le trafic entre zones selon des règles, avec la logique « tout refuser par défaut, autoriser au cas par cas ». On sépare surtout ce qui est exposé à Internet du réseau interne grâce à une <strong>DMZ</strong> (<em>zone démilitarisée</em>) : les serveurs publics (le site web) y vivent, isolés du LAN. Si le serveur web est compromis, l'attaquant se retrouve dans la DMZ, <strong>pas</strong> directement sur le réseau interne.</p>
<pre class="pseudo"># Segmentation type d'une PME
Internet --- [Pare-feu] --- DMZ (serveur web public)
                  |
                  +------- LAN interne (postes, serveur de fichiers, BDD)
# Regle : la DMZ ne peut PAS ouvrir de connexion vers le LAN interne.</pre>
<h3>3. Accès distant : VPN et MFA</h3>
<p>Les télétravailleurs ne doivent jamais exposer les services internes directement sur Internet. Ils passent par un <strong>VPN</strong> (<em>Virtual Private Network</em>) : un tunnel chiffré qui les relie au réseau de l'entreprise comme s'ils étaient sur place. Et pour l'authentification, un mot de passe ne suffit plus : on ajoute une <strong>MFA</strong> (<em>authentification multifacteur</em>), c'est-à-dire un second facteur (application mobile, clé physique, code à usage unique). Ainsi, un mot de passe volé ne suffit pas à entrer.</p>
<pre class="pseudo"># Acces distant securise
Employe distant --- VPN (tunnel chiffre) ---&gt; Reseau PME
Connexion = mot de passe + 2e facteur (MFA) -&gt; un mot de passe vole ne suffit pas
# Principe : chiffrer le canal (VPN) ET renforcer l'identite (MFA).</pre>
<h3>4. Durcir et donner le moindre privilège</h3>
<p>Chaque serveur et service est <strong>durci</strong> (jour 28) : surface minimale, mises à jour régulières, comptes de service dédiés, aucun service inutile en écoute. On applique le <strong>moindre privilège</strong> partout : un comptable n'accède pas aux serveurs, un service web ne tourne pas en administrateur. On segmente aussi les droits internes selon les rôles.</p>
<div class="tip">La règle qui traverse tout le projet : <strong>ne faire confiance à rien par défaut</strong>. Chaque zone, chaque compte, chaque flux doit être justifié. C'est l'esprit du « zéro confiance » (Zero Trust).</div>
<h3>5. Superviser : journaux, SIEM, détection</h3>
<p>Une infra sécurisée doit être <strong>surveillée</strong>. On centralise les journaux (jour 29) vers un <strong>SIEM</strong> qui corrèle et alerte, on déploie un <strong>IDS/IPS</strong> (jour 26) aux points sensibles, et on prépare un <strong>plan de réponse à incident</strong>. On audite régulièrement l'inventaire avec <strong>nmap</strong> (jour 30) pour vérifier qu'aucun port ni équipement non prévu n'apparaît. Enfin, des <strong>sauvegardes</strong> testées permettent de repartir sain.</p>
<div class="warn">La sécurité n'est jamais « finie ». Sans mises à jour, supervision et audits réguliers, une infra durcie se dégrade. Le facteur humain compte aussi : sensibilise les employés (hameçonnage, mots de passe).</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Architecture PME securisee = defense en profondeur :
# - Pare-feu + DMZ  : segmenter, isoler le public de l'interne
# - VPN + MFA       : acces distant chiffre + identite renforcee
# - Durcissement + moindre privilege : reduire la surface, limiter les droits
# - SIEM + IDS/IPS + reponse a incident : detecter et reagir
# - Audits nmap + sauvegardes testees : verifier et pouvoir restaurer
# Principe unificateur : ne rien faire confiance par defaut (Zero Trust)</pre>`,
  exercises: [
    { type: "qcm", q: "À quoi sert une DMZ dans l'architecture d'une PME ?", opts: ["À accélérer Internet", "À isoler les serveurs publics du réseau interne", "À chiffrer les disques", "À remplacer le VPN"], a: 1, exp: "La DMZ isole les serveurs exposés (web) du LAN interne." },

    { type: "qcm", q: "Quel outil centralise et corrèle les journaux pour superviser l'infra ?", opts: ["Un SIEM", "Un serveur proxy", "Un serveur de sauvegarde", "Un antivirus seul"], a: 0, exp: "Le SIEM centralise, corrèle les journaux et lève des alertes." },

    { type: "vf", q: "Des audits nmap réguliers aident à repérer un port ou un équipement non prévu.", a: true, exp: "Oui : l'audit d'inventaire vérifie que rien d'inattendu n'apparaît." },
    { type: "input", q: "Quel sigle désigne le tunnel chiffré pour l'accès distant ?", a: ["vpn"], ph: "3 lettres", exp: "VPN : Virtual Private Network, tunnel chiffré." },
    { type: "input", q: "Comment nomme-t-on la zone qui isole les serveurs publics du réseau interne (sigle) ?", a: ["dmz"], ph: "3 lettres", exp: "DMZ : zone démilitarisée pour les serveurs exposés." },
    { type: "input", q: "Quel sigle désigne l'authentification à plusieurs facteurs ?", a: ["mfa", "2fa"], ph: "3 lettres", exp: "MFA (ou 2FA) : authentification multifacteur." },
    { type: "input", q: "Comment nomme-t-on la stratégie « ne faire confiance à rien par défaut » (expression anglaise) ?", a: ["zero trust", "zero-trust", "zerotrust", "confiance zero", "confiance zéro"], ph: "deux mots", exp: "Zero Trust : aucune confiance implicite, tout est vérifié." },
    { type: "input", q: "Quelle stratégie empile plusieurs couches de protection (expression FR) ?", a: ["defense en profondeur", "défense en profondeur", "la defense en profondeur"], ph: "trois mots", exp: "La défense en profondeur : plusieurs couches complémentaires." }
  ],
  final: {

      { type: "vf", q: "Il est inutile de superviser une fois l'architecture déployée.", a: false, exp: "Non : SIEM, IDS/IPS et audits réguliers sont indispensables dans la durée." },
      { type: "qcm", q: "Si le serveur web en DMZ est compromis, l'attaquant…", opts: ["Accède directement au LAN interne", "Reste confiné à la DMZ, isolé du LAN", "Contrôle le pare-feu automatiquement", "Éteint Internet"], a: 1, exp: "L'isolation de la DMZ empêche le rebond direct vers le LAN interne." }
    ],
    solution: `<pre class="pseudo"># Architecture finale de la PME (defense en profondeur) :
Internet --[Pare-feu]-- DMZ : serveur web public (isole)

                 +--- LAN interne : postes, fichiers, BDD (durcis, moindre privilege)

Verification : audits nmap reguliers + sauvegardes testees
# Fil rouge : Zero Trust -> aucune confiance implicite, chaque flux justifie.</pre>
<p>Bravo : tu sais désormais concevoir une infrastructure défendue en couches. La sécurité est un processus continu — reste curieux et tiens tout à jour.</p>`
  }
};
