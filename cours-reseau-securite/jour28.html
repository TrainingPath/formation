var DAY = {
  num: 28,
  title: "Durcir un serveur et un service",
  subtitle: "Réduire la surface d'attaque : moins on expose, moins on risque.",
  theory: `
<h3>1. Qu'est-ce que le durcissement (hardening) ?</h3>
<p><strong>Durcir</strong> un système (en anglais <em>hardening</em>) consiste à réduire tout ce qui pourrait être attaqué. L'idée est simple : plus un serveur expose de services, de comptes et de fonctions, plus il offre de portes d'entrée. On appelle <strong>surface d'attaque</strong> l'ensemble de ces points exposés. Durcir, c'est <strong>rétrécir cette surface</strong> au strict nécessaire.</p>
<div class="tip">Analogie : une maison avec dix portes et vingt fenêtres est plus dure à surveiller qu'un studio avec une seule porte blindée. On ferme ce qui ne sert pas.</div>
<h3>2. Réduire la surface : couper l'inutile</h3>
<p>Premier réflexe : <strong>désinstaller ou désactiver</strong> les services non utilisés. Un serveur web n'a pas besoin d'un serveur de fichiers ni d'une base ouverte sur l'extérieur. On <strong>ferme les ports</strong> inutiles au pare-feu, on ne garde que ceux du service (par exemple 443 pour HTTPS). Chaque service en écoute est une cible potentielle.</p>
<pre class="pseudo"># Voir ce qui ecoute sur la machine (audit local)
ss -tulpn                 # liste les ports TCP/UDP en ecoute
# Garder l'essentiel : ex. 22 (SSH restreint) et 443 (HTTPS)
# Fermer/desactiver le reste. Regle par defaut : TOUT refuser, autoriser au cas par cas.</pre>
<h3>3. Le principe du moindre privilège</h3>
<p>Le <strong>principe du moindre privilège</strong> (en anglais <em>least privilege</em>) dit qu'un utilisateur, un service ou un processus ne doit avoir <strong>que</strong> les droits strictement nécessaires à sa tâche. Concrètement : ne pas faire tourner un service web en <strong>root</strong> (compte administrateur tout-puissant), créer un compte dédié à droits limités, et n'accorder les privilèges élevés que ponctuellement. Ainsi, si le service est compromis, les dégâts restent contenus.</p>
<pre class="pseudo"># Mauvais : le service tourne en root (tout est permis s'il est pirate)
# Bon    : compte dedie, droits minimaux
useradd -r -s /usr/sbin/nologin appsvc     # compte de service sans shell
# Le service tourne sous 'appsvc' : il ne peut pas tout casser.</pre>
<h3>4. Tenir à jour et authentifier fortement</h3>
<p>Une grande partie des intrusions exploite des <strong>failles connues</strong> pour lesquelles un correctif existe déjà. D'où l'importance des <strong>mises à jour</strong> régulières (système et applications), idéalement automatisées pour les correctifs de sécurité. Côté accès : désactiver la connexion SSH par mot de passe au profit des <strong>clés SSH</strong>, interdire la connexion directe en root, et activer une authentification forte quand c'est possible. Un mot de passe faible ou un logiciel non patché annule tous les autres efforts.</p>
<div class="warn">Le durcissement n'est pas une action unique mais un <strong>processus continu</strong>. Un serveur durci aujourd'hui redevient vulnérable demain si les mises à jour ne suivent pas. Documente et rejoue régulièrement tes vérifications.</div>
<h3>5. Défense en profondeur</h3>
<p>On ne mise jamais sur une seule barrière. La <strong>défense en profondeur</strong> empile plusieurs couches : pare-feu, service durci, moindre privilège, journalisation, sauvegardes. Si une couche cède, les autres tiennent. Les <strong>sauvegardes</strong> testées sont la dernière ligne : elles permettent de repartir sain après un incident.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Surface minimale : desactiver services/ports inutiles
# Moindre privilege : chaque service/compte a le STRICT necessaire (pas de root inutile)
# Mises a jour : combler les failles connues (patch)
# Auth forte : cles SSH, pas de root direct, MFA si possible
# Defense en profondeur : plusieurs couches + sauvegardes testees</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie « durcir » (hardening) un serveur ?", opts: ["Le rendre plus rapide", "Réduire sa surface d'attaque et le sécuriser", "Le rendre plus joli", "Augmenter sa mémoire"], a: 1, exp: "Durcir = réduire ce qui peut être attaqué et renforcer la configuration." },
    { type: "qcm", q: "Qu'appelle-t-on la « surface d'attaque » ?", opts: ["La taille du disque", "L'ensemble des points exposés attaquables", "La vitesse du réseau", "Le nombre d'écrans"], a: 1, exp: "C'est l'ensemble des services, comptes et fonctions exposés." },

    { type: "qcm", q: "Pourquoi éviter de faire tourner un service web en root ?", opts: ["C'est plus lent", "Si le service est compromis, l'attaquant hérite de tous les droits", "root est payant", "root n'existe pas"], a: 1, exp: "En root, une compromission donne un contrôle total : on limite les droits." },
    { type: "qcm", q: "Pourquoi les mises à jour sont-elles cruciales ?", opts: ["Pour changer la couleur", "Pour corriger des failles connues déjà exploitées", "Pour ralentir le serveur", "Pour vider les logs"], a: 1, exp: "Beaucoup d'intrusions exploitent des failles connues déjà corrigées ailleurs." },
    { type: "qcm", q: "La « défense en profondeur » consiste à…", opts: ["Miser sur une seule barrière", "Empiler plusieurs couches de protection", "Supprimer le pare-feu", "N'utiliser que l'antivirus"], a: 1, exp: "Plusieurs couches : si l'une cède, les autres tiennent." },

    { type: "vf", q: "Le durcissement est une action unique qu'on n'a plus à refaire.", a: false, exp: "Non : c'est un processus continu, notamment via les mises à jour." },
    { type: "vf", q: "Utiliser des clés SSH plutôt qu'un mot de passe renforce l'accès distant.", a: true, exp: "Oui : les clés SSH sont plus robustes que les mots de passe." },
    { type: "vf", q: "Des sauvegardes testées permettent de repartir sain après un incident.", a: true, exp: "Oui : c'est la dernière ligne de défense pour restaurer un état sûr." },
    { type: "input", q: "Comment nomme-t-on (en français) le principe : « donner uniquement les droits nécessaires » ?", a: ["moindre privilege", "principe du moindre privilege", "le moindre privilege", "moindre privilège"], ph: "trois mots", exp: "Le principe du moindre privilège." },
    { type: "input", q: "Quel compte administrateur tout-puissant sous Linux ne faut-il pas utiliser pour un service ?", a: ["root", "le compte root"], ph: "un nom", exp: "root : compte tout-puissant à éviter pour faire tourner un service." },
    { type: "input", q: "Comment appelle-t-on un correctif logiciel de sécurité (terme courant) ?", a: ["patch", "un patch", "correctif"], ph: "un mot", exp: "Un patch (correctif) comble une faille connue." },
    { type: "input", q: "Quelle stratégie empile plusieurs couches de protection ? (expression FR)", a: ["defense en profondeur", "défense en profondeur", "la defense en profondeur"], ph: "trois mots", exp: "La défense en profondeur." },
    { type: "input", q: "Quel terme anglais désigne l'action de durcir/sécuriser un système ?", a: ["hardening", "le hardening"], ph: "un mot", exp: "Hardening : le durcissement d'un système." }
  ],
  final: {
    title: "Exercice final — Durcir un serveur web de labo",
    intro: `<p>Tu déploies un serveur web dans ton labo. Par défaut, il expose plusieurs services, tourne en root et n'a pas été mis à jour depuis l'installation. Applique une démarche de durcissement.</p>`,
    questions: [
      { type: "qcm", q: "Première action pour réduire la surface d'attaque ?", opts: ["Ajouter des services", "Désactiver les services et ports inutiles", "Passer tout en root", "Désactiver le pare-feu"], a: 1, exp: "On coupe l'inutile : moins de services exposés." },
      { type: "input", q: "Sous quel type de compte faire tourner le service web (principe) ?", a: ["compte dedie", "compte dédié", "moindre privilege", "compte a droits limites", "compte non-root", "non root"], ph: "quelques mots", exp: "Un compte dédié à droits limités (moindre privilège), pas root." },
      { type: "vf", q: "Laisser le service tourner en root est acceptable pour aller plus vite.", a: false, exp: "Non : en cas de compromission, l'attaquant obtient tous les droits." },
      { type: "qcm", q: "Concernant les mises à jour du système, tu…", opts: ["Les ignores", "Les appliques régulièrement (correctifs de sécurité)", "Les désinstalles", "Les repousses d'un an"], a: 1, exp: "On applique les correctifs pour combler les failles connues." },
      { type: "input", q: "Pour l'accès distant, tu remplaces le mot de passe SSH par… ?", a: ["cles ssh", "clés ssh", "cle ssh", "une cle ssh", "cle", "clés"], ph: "deux mots", exp: "Des clés SSH, plus robustes que les mots de passe." }
    ],
    solution: `<pre class="pseudo"># Demarche de durcissement :
1) Surface minimale : desactiver services/ports inutiles (ss -tulpn)
2) Moindre privilege : compte dedie, PAS de service en root
3) Mises a jour : appliquer les correctifs de securite regulierement
4) Auth forte : cles SSH, interdire root en direct
5) Defense en profondeur : pare-feu + journaux + sauvegardes testees</pre>
<p>Un serveur durci expose peu et se répare vite. Demain : journalisation, audit et réponse à incident.</p>`
  }
};
