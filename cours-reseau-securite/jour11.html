  theory: `
<h3>1. Chiffrer : rendre illisible sans la clé</h3>
<p><strong>Chiffrer</strong>, c'est transformer un message clair en un texte illisible pour quiconque n'a pas la clé. Le message d'origine s'appelle le <strong>texte clair</strong> (en anglais <em>plaintext</em>), le résultat brouillé le <strong>texte chiffré</strong> (<em>ciphertext</em>). L'opération inverse, retrouver le clair à partir du chiffré, se nomme <strong>déchiffrer</strong>. Attention au vocabulaire : « déchiffrer » se fait avec la clé ; « décrypter » désigne casser le message sans la clé.</p>
<p>Dans le <strong>chiffrement symétrique</strong>, une <strong>seule et même clé</strong> sert à la fois à chiffrer et à déchiffrer. C'est comme un cadenas dont la même clé ferme et ouvre : les deux correspondants doivent posséder cette clé identique.</p>
<h3>2. AES, la référence actuelle</h3>
<p>L'algorithme symétrique standard aujourd'hui est <strong>AES</strong> (en anglais <em>Advanced Encryption Standard</em>). Il travaille sur des blocs de 128 bits et accepte des clés de <strong>128, 192 ou 256 bits</strong>. AES-256 est considéré comme très robuste et sert partout : Wi-Fi (WPA2/WPA3), disques chiffrés (BitLocker), messageries, et à l'intérieur même de connexions sécurisées comme TLS. Un ancien algorithme, <strong>DES</strong>, est aujourd'hui obsolète car sa clé de 56 bits est trop courte.</p>
<pre class="pseudo"># Principe du chiffrement symetrique
Texte clair  --[ chiffrer avec la cle K ]-->  Texte chiffre
Texte chiffre --[ dechiffrer avec la MEME cle K ]-->  Texte clair
# La cle K est identique des deux cotes.</pre>
<h3>3. Son point fort : la rapidité</h3>
<p>Le grand avantage du symétrique est sa <strong>rapidité</strong>. Les opérations sont simples et souvent accélérées directement par le processeur (jeu d'instructions AES-NI). On peut chiffrer des gigaoctets à grande vitesse avec un coût minime. C'est pourquoi, dès qu'il y a beaucoup de données à protéger — un disque entier, un flux vidéo, le contenu d'une session web — c'est du chiffrement symétrique qui fait le travail de fond.</p>
<div class="tip">Symétrique = <strong>même clé des deux côtés</strong> = <strong>très rapide</strong>. Retiens ce couple : c'est ce qui le rend idéal pour chiffrer de gros volumes en continu.</div>
<h3>4. Son point faible : l'échange de la clé</h3>
<p>Il y a un problème redoutable : <strong>comment transmettre la clé secrète</strong> à ton correspondant sans qu'un espion l'intercepte ? Si tu envoies la clé par le même réseau que le message, un attaquant qui écoute la capture — et tout s'effondre. C'est le <strong>problème de l'échange de clé</strong> (en anglais <em>key exchange problem</em>). Autre difficulté : le <strong>nombre de clés</strong>. Pour que N personnes communiquent deux à deux en secret, il faut N×(N−1)/2 clés distinctes ; à 100 personnes, cela fait déjà 4950 clés à gérer.</p>
<div class="warn">Ne confonds pas : le symétrique n'est pas « moins sûr » que l'asymétrique. AES est excellent. Sa faiblesse n'est pas le chiffrement lui-même mais la <strong>distribution de la clé</strong>. La leçon suivante (chiffrement asymétrique) résout précisément ce problème d'échange.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Symetrique = UNE seule cle, identique pour chiffrer et dechiffrer
# Algorithme standard : AES (cles 128/192/256 bits) ; DES est obsolete
# Point fort  : RAPIDITE (ideal pour de gros volumes de donnees)
# Point faible: comment ECHANGER la cle secrete sans se faire intercepter ?
# + explosion du nombre de cles quand il y a beaucoup de correspondants
# La solution a l'echange viendra du chiffrement asymetrique (jour 12)</pre>`,

    solution: `<pre class="pseudo"># Choix pour le transfert nocturne
Algorithme : AES-256 (symetrique) -> rapide, adapte aux gros volumes

<p>AES-256 chiffre vite et bien les sauvegardes ; reste à échanger la clé de façon sûre — c'est exactement ce que résout le chiffrement asymétrique.</p>`
