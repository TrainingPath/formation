  title: "Le pare-feu : le principe",
  subtitle: "Un poste de contrôle qui décide ce qui passe et ce qui est bloqué.",
  theory: `
<h3>1. Qu'est-ce qu'un pare-feu ?</h3>
<p>Un <strong>pare-feu</strong> (en anglais <em>firewall</em>) est un dispositif, matériel ou logiciel, placé entre deux réseaux (ou entre une machine et le réseau) et qui <strong>contrôle le trafic</strong> qui les traverse. Son rôle est simple à énoncer : pour chaque paquet qui se présente, décider s'il a le droit de passer (<strong>autoriser</strong>) ou non (<strong>bloquer</strong>). L'image la plus juste est celle d'un <strong>poste de contrôle</strong> à l'entrée d'un bâtiment : le vigile compare chaque visiteur à une liste et laisse entrer ou refoule.</p>
<div class="tip">Le mot <em>firewall</em> vient du bâtiment : c'est le « mur coupe-feu » qui empêche un incendie de se propager d'une pièce à l'autre. Le pare-feu réseau empêche de la même façon le « feu » (le trafic dangereux) de se propager d'un réseau à l'autre.</div>
<h3>2. Où se place un pare-feu ?</h3>
<p>Un pare-feu se place à une <strong>frontière</strong>, là où le trafic doit être contrôlé :</p>
<pre class="pseudo"># Entre Internet et le reseau local (pare-feu de perimetre / passerelle).
# Entre deux zones internes (segmentation : bureautique vs serveurs).
# Sur une machine elle-meme (pare-feu personnel / host-based).</pre>
<p>On distingue le <strong>pare-feu réseau</strong> (protège tout un réseau, souvent un équipement dédié) et le <strong>pare-feu personnel</strong> (logiciel installé sur une machine, qui la protège elle seule). Les deux se complètent : c'est de la défense en profondeur.</p>
<h3>3. Ce qu'il regarde : les critères de décision</h3>
<p>Un pare-feu ne « comprend » pas le contenu comme un humain : il prend sa décision d'après des <strong>critères techniques</strong> présents dans les paquets. Les plus courants :</p>
<pre class="pseudo"># Adresse IP source  : d'ou vient le paquet.
# Adresse IP destination : ou il va.
# Port source / destination : quel service est vise (ex : 80 web, 443 web securise, 22 SSH).
# Protocole : TCP, UDP, ICMP...
# Sens : entrant (in) ou sortant (out).</pre>
<p>À partir de ces critères, le pare-feu applique des <strong>règles</strong> définies à l'avance. Nous détaillerons les règles au jour suivant ; aujourd'hui, l'important est le <strong>principe</strong> : filtrer selon des critères, autoriser ou bloquer.</p>
<h3>4. Autoriser ou bloquer : les deux logiques</h3>
<p>Il existe deux façons opposées de raisonner. La <strong>liste blanche</strong> (en anglais <em>allowlist</em>) : tout est interdit sauf ce qui est explicitement autorisé. La <strong>liste noire</strong> (en anglais <em>denylist</em>) : tout est permis sauf ce qui est explicitement interdit. En sécurité, la liste blanche est <strong>bien plus sûre</strong> : on n'ouvre que le strict nécessaire, et tout le reste est refusé par défaut. La liste noire oblige à connaître et lister toutes les menaces, ce qui est impossible.</p>
<div class="warn">Piège : un pare-feu n'est pas un antivirus. Il décide qui peut communiquer avec qui, mais il n'inspecte pas forcément le <em>contenu</em> pour détecter un virus dans un fichier autorisé à passer. Le pare-feu est une couche parmi d'autres, pas une protection totale.</div>
<h3>5. Ce que le pare-feu ne fait pas</h3>
<p>Un pare-feu classique ne protège pas contre une attaque qui passe par un canal <strong>autorisé</strong> : si le port web (443) est ouvert, une attaque visant l'application web derrière passera par cette porte légitime. Il ne protège pas non plus contre l'hameçonnage (l'utilisateur agit lui-même) ni contre une menace interne déjà dans le réseau. D'où, encore une fois, la nécessité de plusieurs couches.</p>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># PARE-FEU (firewall) = poste de controle du trafic entre deux reseaux.
# Pour chaque paquet : AUTORISER ou BLOQUER.
# Criteres : IP source/destination, ports, protocole, sens (in/out).
# Placement : perimetre (Internet &lt;-&gt; LAN), entre zones, ou sur la machine.
# Liste blanche (tout interdit sauf autorise) = plus sur que liste noire.
# Un pare-feu n'est PAS un antivirus : c'est UNE couche, pas tout.</pre>`,

    { type: "qcm", q: "Pourquoi la liste blanche est-elle plus sûre que la liste noire ?", opts: ["Elle est plus jolie", "On n'ouvre que le nécessaire ; tout le reste est refusé par défaut", "Elle bloque Internet entièrement", "Elle est plus rapide à taper"], a: 1, exp: "La liste noire exigerait de connaître toutes les menaces ; la liste blanche refuse tout sauf l'autorisé." },
    { type: "vf", q: "Un pare-feu remplace complètement un antivirus.", a: false, exp: "Faux : le pare-feu décide qui communique avec qui, mais n'inspecte pas forcément le contenu pour un virus. Ce sont des couches différentes." },
    { type: "input", q: "Un pare-feu logiciel installé sur une seule machine pour la protéger elle-même s'appelle un pare-feu… (un mot)", a: ["personnel", "personel", "host-based", "local"], ph: "un mot", exp: "Le pare-feu personnel (host-based) protège la machine sur laquelle il est installé." },
    { type: "qcm", q: "Quel port correspond au web sécurisé (HTTPS) ?", opts: ["22", "25", "443", "3306"], a: 2, exp: "Le port 443 est celui de HTTPS (web sécurisé). Le 80 est HTTP, le 22 SSH." },
    { type: "qcm", q: "Un pare-feu protège-t-il contre l'hameçonnage où l'utilisateur donne lui-même son mot de passe ?", opts: ["Oui, totalement", "Non : l'utilisateur agit lui-même par un canal autorisé", "Oui, il bloque tous les courriels", "Il n'existe pas d'hameçonnage"], a: 1, exp: "L'hameçonnage passe par l'action de l'utilisateur via un canal autorisé : le pare-feu ne l'arrête pas." },
    { type: "vf", q: "Pare-feu réseau et pare-feu personnel peuvent se compléter (défense en profondeur).", a: true, exp: "Oui : l'un protège tout le réseau, l'autre chaque machine ; les combiner ajoute des couches." },
    { type: "qcm", q: "Si le port 443 est ouvert, une attaque visant l'application web derrière…", opts: ["Est toujours bloquée par le pare-feu", "Peut passer par cette porte légitime", "Éteint le pare-feu", "Change le port automatiquement"], a: 1, exp: "Le pare-feu laisse passer le trafic autorisé ; une attaque via un canal ouvert n'est pas arrêtée par lui seul." },
    { type: "input", q: "D'où vient le mot « firewall » : c'est à l'origine un mur qui empêche la propagation de quoi ? (un mot)", a: ["feu", "incendie", "le feu", "un incendie"], ph: "un mot", exp: "Le mur coupe-feu empêche un incendie de se propager d'une pièce à l'autre." },
    { type: "qcm", q: "Le « sens » d'un paquet observé par le pare-feu désigne…", opts: ["Sa couleur", "S'il est entrant (in) ou sortant (out)", "Sa taille en mètres", "Son ancienneté"], a: 1, exp: "Le sens indique si le paquet entre (in) ou sort (out), un critère de filtrage courant." }
  ],

      { type: "qcm", q: "Quelle logique choisir pour « seul le web est joignable, le reste bloqué » ?", opts: ["Liste noire", "Liste blanche : tout bloqué sauf le web autorisé", "Tout ouvrir", "Aucune règle"], a: 1, exp: "La liste blanche : on n'autorise que le nécessaire (le web) et on bloque tout le reste." },
      { type: "input", q: "Quel port faut-il autoriser en entrée pour un site web sécurisé (HTTPS) ?", a: ["443", "port 443"], ph: "un nombre", exp: "Le port 443 (HTTPS) doit être autorisé pour rendre le site accessible." },
      { type: "vf", q: "Ce pare-feu empêchera aussi un employé de se faire piéger par un courriel d'hameçonnage.", a: false, exp: "Faux : l'hameçonnage passe par l'action de l'utilisateur ; le pare-feu de périmètre ne l'arrête pas. Il faut d'autres couches." },
      { type: "qcm", q: "Si une faille existe dans l'application web exposée sur le port 443, le pare-feu…", opts: ["La corrige tout seul", "Ne bloque pas forcément l'attaque qui passe par ce port autorisé", "Ferme Internet", "Devient un antivirus"], a: 1, exp: "Le trafic web est autorisé : une attaque de l'application derrière peut passer. D'où d'autres couches nécessaires." }
    ],
    solution: `<pre class="pseudo"># Principe applique a l'entreprise :
# Pare-feu de perimetre = vigile entre Internet et le LAN.
# Logique : LISTE BLANCHE
#   - Autoriser en entree : le port 443 (site web HTTPS).
#   - Bloquer TOUT le reste depuis Internet.
# Limites a garder en tete :
#   - N'arrete pas l'hameconnage (action de l'utilisateur).
#   - N'arrete pas forcement une attaque via un port autorise.
#   => le pare-feu est UNE couche, a completer par d'autres.</pre>
<p>Le principe est posé : filtrer selon des critères, autoriser le minimum, bloquer le reste. Demain, nous traduisons ce principe en règles concrètes : filtrage de paquets par IP, port, protocole, et politique par défaut.</p>`
