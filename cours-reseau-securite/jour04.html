  title: "Surface d'attaque et défense en profondeur",
  subtitle: "Réduire ce qui est exposé, puis empiler les couches de protection.",
  theory: `
<h3>1. La surface d'attaque : tout ce par quoi on peut entrer</h3>
<p>La <strong>surface d'attaque</strong> (en anglais <em>attack surface</em>) est l'ensemble des points par lesquels un attaquant pourrait tenter d'entrer : chaque <strong>service ouvert</strong>, chaque <strong>port en écoute</strong>, chaque <strong>compte utilisateur</strong>, chaque logiciel installé, chaque page web accessible. Plus il y a de points d'entrée, plus la surface est grande, et plus il y a de chances qu'un de ces points soit vulnérable. Imaginez une maison : chaque porte et chaque fenêtre est une entrée possible. Moins il y en a d'ouvertes, moins il y a à surveiller.</p>
<h3>2. Réduire la surface d'attaque</h3>
<p>Le premier réflexe de sécurité n'est pas d'ajouter des protections, mais de <strong>retirer l'inutile</strong>. On appelle cela le <strong>durcissement</strong> (en anglais <em>hardening</em>). Concrètement :</p>
<pre class="pseudo"># Fermer les services et ports non utilises.
# Desinstaller les logiciels dont on ne se sert pas.
# Supprimer les comptes inactifs, changer les mots de passe par defaut.
# N'exposer sur Internet QUE ce qui doit l'etre.
# Appliquer les mises a jour (fermer les failles connues).</pre>
<p>Chaque service fermé est un risque en moins, sans effort de surveillance supplémentaire. C'est la mesure au meilleur rapport efficacité/effort.</p>
<div class="tip">Principe du <strong>moindre privilège</strong> (en anglais <em>least privilege</em>) : chaque compte, chaque service ne reçoit que les droits strictement nécessaires à sa tâche, rien de plus. Un service web n'a pas besoin d'être administrateur du système.</div>
<h3>3. La défense en profondeur : plusieurs couches</h3>
<p>Aucune protection n'est parfaite. La <strong>défense en profondeur</strong> (en anglais <em>defense in depth</em>) consiste à empiler <strong>plusieurs couches</strong> de protection indépendantes, pour que la défaillance de l'une n'ouvre pas tout. L'image classique est le <strong>château fort</strong> : douves, remparts, herse, gardes, donjon. Franchir une couche ne suffit pas ; il faut toutes les franchir.</p>
<pre class="pseudo"># Exemple de couches, de l'exterieur vers l'interieur :
# 1. Pare-feu reseau (filtre le trafic entrant)
# 2. Segmentation du reseau (separer les zones)
# 3. Authentification forte (mots de passe + second facteur)
# 4. Droits d'acces au moindre privilege
# 5. Chiffrement des donnees sensibles
# 6. Journalisation et surveillance (detecter une intrusion)
# 7. Sauvegardes (pouvoir restaurer apres incident)</pre>
<h3>4. Prévention, détection, réaction sur chaque couche</h3>
<p>Une bonne défense en profondeur ne fait pas que <strong>prévenir</strong> : elle <strong>détecte</strong> (journaux, alertes) et permet de <strong>réagir</strong> (isoler une machine, restaurer une sauvegarde). Si un attaquant franchit le pare-feu, la segmentation limite sa progression, la surveillance le repère, et les sauvegardes permettent de repartir. On suppose toujours qu'une couche <em>peut</em> tomber : c'est justement pour cela qu'il y en a plusieurs.</p>
<div class="warn">Piège : empiler des couches ne dispense pas de réduire la surface d'attaque. Un service inutile laissé ouvert reste une porte, même derrière dix protections. On <strong>réduit d'abord</strong>, puis on <strong>protège en couches</strong> ce qui reste.</div>
<h3>5. Segmentation : cloisonner pour limiter</h3>
<p>La <strong>segmentation</strong> (en anglais <em>segmentation</em>) découpe le réseau en zones séparées : le poste d'accueil n'a pas besoin d'atteindre les serveurs de comptabilité. Ainsi, si une machine est compromise, l'attaquant ne peut pas se déplacer librement partout : on limite le <strong>déplacement latéral</strong> (en anglais <em>lateral movement</em>). C'est l'équivalent des portes coupe-feu dans un bâtiment.</p>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># SURFACE D'ATTAQUE = tous les points d'entree possibles.
# 1er reflexe : REDUIRE (durcissement) -> fermer/desinstaller/supprimer l'inutile.
# Moindre privilege : juste les droits necessaires, rien de plus.
# DEFENSE EN PROFONDEUR = plusieurs couches independantes (chateau fort).
# Segmentation -> limite le deplacement lateral d'un attaquant.
# Chaque couche : prevenir, detecter, reagir. On suppose qu'une couche peut tomber.</pre>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce que la « surface d'attaque » ?", opts: ["La taille d'un pare-feu", "L'ensemble des points par lesquels on pourrait entrer", "Le nombre d'attaquants", "La vitesse du réseau"], a: 1, exp: "La surface d'attaque regroupe tous les points d'entrée possibles : services, ports, comptes, logiciels." },

    { type: "input", q: "Quelle image classique illustre la défense en profondeur avec ses douves, remparts et donjon ? (un mot)", a: ["château fort", "chateau fort", "château", "chateau", "forteresse"], ph: "un mot", exp: "Le château fort : plusieurs couches successives à franchir." },
    { type: "qcm", q: "À quoi sert la segmentation du réseau ?", opts: ["À accélérer Internet", "À séparer les zones pour limiter le déplacement latéral d'un attaquant", "À chiffrer les mots de passe", "À supprimer les sauvegardes"], a: 1, exp: "La segmentation cloisonne le réseau ; un attaquant compromis dans une zone ne circule pas partout." },
    { type: "vf", q: "Empiler des couches de protection rend inutile la réduction de la surface d'attaque.", a: false, exp: "Faux : un service inutile ouvert reste une porte. On réduit d'abord, puis on protège en couches ce qui reste." },
    { type: "input", q: "Comment nomme-t-on le déplacement d'un attaquant d'une machine à une autre à l'intérieur du réseau ? (deux mots)", a: ["déplacement latéral", "deplacement lateral", "lateral movement"], ph: "deux mots", exp: "Le déplacement latéral : la segmentation sert justement à le limiter." },
    { type: "qcm", q: "Un service web devrait-il tourner avec les droits d'administrateur du système ?", opts: ["Oui, par sécurité", "Non : moindre privilège, juste ce qu'il lui faut", "Oui, sinon il ne marche pas", "Peu importe"], a: 1, exp: "Par moindre privilège, un service ne reçoit que les droits nécessaires, pas les droits d'admin." },
    { type: "qcm", q: "Parmi ces actions, laquelle réduit la surface d'attaque ?", opts: ["Installer plus d'applications", "Fermer les ports non utilisés", "Créer plus de comptes", "Désactiver les mises à jour"], a: 1, exp: "Fermer les ports inutilisés supprime des points d'entrée : la surface diminue." },
    { type: "vf", q: "On conçoit la défense en profondeur en supposant qu'une couche peut tomber.", a: true, exp: "Oui : c'est justement pourquoi on en met plusieurs. Aucune couche n'est parfaite." },
    { type: "qcm", q: "Les mots de passe par défaut d'un équipement neuf devraient être…", opts: ["Conservés tels quels", "Changés immédiatement", "Partagés à tous", "Supprimés sans remplacement"], a: 1, exp: "Les mots de passe par défaut sont connus de tous : les changer réduit la surface d'attaque." },
    { type: "input", q: "Sur chaque couche, on cherche à prévenir, à détecter et à… (un mot)", a: ["réagir", "reagir", "répondre", "repondre"], ph: "un mot", exp: "Prévenir, détecter et réagir : isoler, restaurer, limiter les dégâts." },
    { type: "qcm", q: "Si un attaquant franchit le pare-feu, qu'est-ce qui limite ensuite sa progression dans le réseau ?", opts: ["Rien, c'est perdu", "La segmentation et la surveillance", "Un antivirus sur le routeur uniquement", "Le renforcement du mot de passe administrateur"], a: 1, exp: "La segmentation freine le déplacement latéral, et la surveillance permet de le repérer." }
  ],

      { type: "input", q: "Le partage de fichiers exposé à Internet sans raison : que faut-il faire pour réduire la surface ? (un verbe)", a: ["fermer", "le fermer", "désexposer", "desexposer", "restreindre", "bloquer"], ph: "un verbe", exp: "On ne l'expose plus à Internet : on le ferme ou on le restreint au réseau interne." },

      { type: "vf", q: "Comme le site web doit rester public, il est inutile d'ajouter d'autres couches de protection autour.", a: false, exp: "Faux : ce qui reste exposé se protège en couches (pare-feu, mises à jour, surveillance). Défense en profondeur." },
      { type: "qcm", q: "L'absence de sauvegarde concerne surtout quelle capacité en cas d'incident ?", opts: ["La prévention", "La réaction (pouvoir restaurer)", "La confidentialité", "La vitesse"], a: 1, exp: "Les sauvegardes servent à réagir : restaurer après un incident (ex : rançongiciel)." }
    ],
    solution: `<pre class="pseudo"># Plan de durcissement de la TPE :
# 1. REDUIRE la surface :
#    - fermer / ne plus exposer le partage de fichiers a Internet

#    - appliquer les mises a jour (fermer les failles connues)

#    - journalisation / surveillance (detecter)
#    - SAUVEGARDES (pouvoir restaurer -> reagir)
# Regle : reduire d'abord, proteger en profondeur ensuite.</pre>
