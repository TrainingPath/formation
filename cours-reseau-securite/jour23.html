  title: "L'attaque ARP spoofing / MITM",
  subtitle: "Comprendre le mécanisme pour mieux le détecter et s'en protéger.",
  theory: `
<h3>1. Rappel : à quoi sert ARP</h3>
<p>Sur un réseau local, pour envoyer une trame, une machine a besoin de l'<strong>adresse MAC</strong> correspondant à une adresse IP. Le protocole <strong>ARP</strong> (<em>Address Resolution Protocol</em>) s'en charge : « qui a l'IP 192.168.1.1 ? » ; la machine concernée répond « c'est moi, voici ma MAC ». Chaque hôte range ces réponses dans une <strong>table ARP</strong> (cache). Le problème historique d'ARP : il est <strong>sans authentification</strong>. Une machine croit n'importe quelle réponse, même non sollicitée.</p>
<h3>2. Le principe de l'ARP spoofing (vue défensive)</h3>
<p>L'<strong>ARP spoofing</strong> (ou <em>ARP poisoning</em>, empoisonnement de cache) exploite cette absence de vérification. Un poste malveillant envoie de <strong>fausses réponses ARP</strong> affirmant « l'IP de la passerelle, c'est MA MAC ». Les victimes mettent à jour leur cache et envoient désormais leur trafic destiné à la passerelle vers l'attaquant. On comprend ici le <em>mécanisme</em> uniquement pour savoir le <strong>reconnaître et le bloquer</strong> — pas pour le reproduire.</p>
<pre class="pseudo"># Situation NORMALE :
# PC --(trafic vers passerelle)--&gt; Passerelle (MAC reelle)
#
# Cache ARP EMPOISONNE (symptome a detecter) :
# PC pense : IP passerelle = MAC de l'attaquant
# PC --(trafic)--&gt; Attaquant --(relaie)--&gt; Passerelle
#   -&gt; l'attaquant est AU MILIEU du flux (MITM)</pre>
<h3>3. La conséquence : l'homme du milieu (MITM)</h3>
<p>Une fois le cache empoisonné, l'attaquant se retrouve <strong>au milieu</strong> des échanges : c'est une attaque <strong>MITM</strong> (<em>Man-In-The-Middle</em>). Il peut observer le trafic non chiffré, voire le modifier avant de le relayer. C'est précisément pourquoi le <strong>chiffrement de bout en bout</strong> (HTTPS, VPN) est vital : même intercepté, un flux chiffré reste illisible. Un signe d'alerte pour l'utilisateur : une <strong>alerte de certificat</strong> inattendue peut trahir une tentative d'interception.</p>
<div class="tip">Défense côté usage : privilégier HTTPS partout, un VPN sur les réseaux non fiables, et ne jamais ignorer un avertissement de certificat. Le MITM ne « casse » pas le chiffrement ; il tente de vous faire baisser la garde.</div>
<h3>4. Détecter et prévenir sur le réseau</h3>
<p>Les défenses réseau sont concrètes. <strong>Dynamic ARP Inspection (DAI)</strong> : le switch inspecte les réponses ARP et rejette celles qui ne correspondent pas à une association IP/MAC légitime (apprise via le <em>DHCP snooping</em>). <strong>DHCP snooping</strong> : le switch n'accepte les baux DHCP que des ports de confiance et construit une table IP/MAC fiable. <strong>Entrées ARP statiques</strong> pour les équipements critiques (passerelle) : le cache ne peut plus être écrasé. Enfin, la <strong>détection</strong> : des outils de supervision alertent quand une même IP change soudainement de MAC, ou quand une MAC répond pour plusieurs IP — signes typiques d'empoisonnement.</p>
<div class="warn">Symptômes à surveiller : une IP (souvent la passerelle) qui « change » de MAC, une MAC qui prétend détenir plusieurs IP, un afflux de réponses ARP non sollicitées. Ce sont des signaux de cache ARP empoisonné à investiguer.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># ARP resout IP -&gt; MAC sur le LAN, mais SANS authentification (faille de conception)
# ARP spoofing/poisoning : fausses reponses ARP -&gt; cache empoisonne -&gt; MITM
# MITM = attaquant au milieu : peut lire/modifier le trafic NON chiffre
# Parade usage : HTTPS + VPN + ne jamais ignorer une alerte de certificat
# Parades reseau : DHCP snooping + Dynamic ARP Inspection (DAI) + ARP statique (passerelle)
# Detection : IP qui change de MAC, MAC pour plusieurs IP, reponses ARP non sollicitees</pre>`,

    { type: "qcm", q: "Quel autre symptôme d'empoisonnement de cache ARP ?", opts: ["Un ping plus rapide", "Une même MAC qui prétend détenir plusieurs IP", "Plus aucune trame ARP", "Un DNS plus lent"], a: 1, exp: "Une MAC répondant pour plusieurs IP est un signe d'empoisonnement." },
    { type: "vf", q: "Le MITM par ARP spoofing concerne le réseau local (même segment).", a: true, exp: "Oui : ARP fonctionne sur le LAN, donc l'attaque s'y déroule." },
    { type: "qcm", q: "Quelle combinaison protège efficacement contre l'ARP spoofing ?", opts: ["DHCP snooping + DAI + ARP statique", "FTP + Telnet", "HTTP + DNS", "Spanning Tree + NAT"], a: 0, exp: "DHCP snooping + DAI + entrées ARP statiques forment une défense solide." }
  ],

    ],
    solution: `<pre class="pseudo"># Analyse defensive de l'incident :
# Symptome : IP passerelle 192.168.1.1 associee a une MAC inhabituelle
#            + coupures intermittentes -&gt; cache ARP empoisonne (objectif : MITM).
#
# Reponse (detecter + prevenir, PAS reproduire) :
