  title: "Le VPN nomade (WireGuard, OpenVPN)",
  subtitle: "Le télétravailleur rejoint le réseau de l'entreprise depuis n'importe où.",
  theory: `
<h3>1. Le VPN nomade : un poste vers un site</h3>
<p>Contrairement au site à site (deux réseaux reliés en permanence), le <strong>VPN nomade</strong> (en anglais <em>client-to-site</em> ou <em>remote access</em>) relie <strong>un seul appareil</strong> — le portable du télétravailleur — au réseau de l'entreprise. L'employé installe un <strong>logiciel client</strong> qui monte un tunnel chiffré vers la passerelle. Une fois connecté, sa machine se comporte comme si elle était branchée dans les locaux : elle reçoit une IP interne et accède aux serveurs privés.</p>
<pre class="pseudo"># Site a site : LAN &lt;=&gt; LAN (permanent, entre passerelles)
# Nomade      : 1 poste --tunnel--&gt; passerelle -&gt; LAN entreprise (a la demande)</pre>
<h3>2. OpenVPN : le vétéran robuste</h3>
<p><strong>OpenVPN</strong> est une solution open source très répandue. Elle s'appuie sur la bibliothèque <strong>TLS/SSL</strong> (la même qui protège HTTPS) pour l'authentification et l'échange de clés, et peut fonctionner sur <strong>UDP</strong> (rapide) ou sur <strong>TCP</strong> port 443 (pour traverser les pare-feu restrictifs en se faisant passer pour du trafic web). Elle est mature, flexible, compatible partout, mais sa configuration est riche et son code volumineux.</p>
<h3>3. WireGuard : le moderne, simple et rapide</h3>
<p><strong>WireGuard</strong> est un protocole plus récent, conçu pour être <strong>minimaliste</strong> : quelques milliers de lignes de code (contre des centaines de milliers), ce qui facilite l'audit de sécurité. Il utilise une cryptographie moderne fixée (pas de négociation d'algorithmes) et fonctionne sur <strong>UDP</strong>. Chaque extrémité possède une <strong>paire de clés</strong> (une privée, une publique) : on autorise un pair en connaissant sa <strong>clé publique</strong>, exactement comme SSH. Résultat : rapide, léger, idéal sur mobile où il reconnecte instantanément après un changement de réseau.</p>
<div class="tip">Comparaison express : <strong>OpenVPN</strong> = mature, très configurable, sait se déguiser en HTTPS (TCP/443). <strong>WireGuard</strong> = simple, très rapide, code minimal, excellent sur mobile. Les deux sont d'excellents choix ; WireGuard gagne du terrain.</div>
<h3>4. Sécuriser l'accès nomade : au-delà du tunnel</h3>
<p>Le tunnel chiffre le transport, mais un accès nomade sûr exige plus. On authentifie <strong>l'utilisateur</strong> (idéalement avec une double authentification, MFA — vu au jour 20) en plus de la clé de l'appareil. On peut vérifier la <strong>conformité du poste</strong> (antivirus à jour). Enfin, on choisit entre <strong>tunnel intégral</strong> (<em>full tunnel</em> : tout le trafic passe par l'entreprise, plus sûr) et <strong>tunnel partagé</strong> (<em>split tunnel</em> : seul le trafic vers l'entreprise passe par le VPN, le reste va directement sur Internet, plus rapide mais moins contrôlé).</p>
<div class="warn">Le split tunnel est pratique mais réduit la visibilité de la sécurité : le trafic personnel de l'employé échappe aux protections de l'entreprise. À arbitrer selon la politique de sécurité.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># VPN nomade (client-to-site) = 1 poste -&gt; passerelle -&gt; LAN entreprise
# OpenVPN : open source, base sur TLS, UDP ou TCP/443, tres flexible
# WireGuard : moderne, code minimal, UDP, cles publique/privee (comme SSH), rapide

# Full tunnel (tout par le VPN, + sur) vs Split tunnel (+ rapide, - controle)</pre>`,

    { type: "vf", q: "WireGuard est particulièrement adapté au mobile car il reconnecte vite après un changement de réseau.", a: true, exp: "Oui : sa conception légère le rend excellent sur mobile." },
    { type: "qcm", q: "En plus du tunnel, quelle mesure renforce fortement l'accès nomade ?", opts: ["Désactiver le pare-feu", "Exiger la double authentification (MFA) de l'utilisateur", "Ouvrir tous les ports", "Supprimer l'antivirus"], a: 1, exp: "La MFA sur l'utilisateur ajoute une barrière essentielle." },
    { type: "qcm", q: "Un avantage d'OpenVPN par rapport à WireGuard ?", opts: ["Il est plus simple à lire", "Il peut se déguiser en HTTPS via TCP/443 pour passer les pare-feu", "Il n'a pas besoin de clés", "Il fonctionne sans logiciel"], a: 1, exp: "OpenVPN sur TCP/443 franchit les pare-feu restrictifs en imitant HTTPS." },
    { type: "input", q: "Combien de clés compose la paire de chaque pair WireGuard (répond par un chiffre) ?", a: ["2", "deux"], ph: "un chiffre", exp: "Une clé privée et une clé publique : deux clés." },
    { type: "vf", q: "Le split tunnel augmente toujours la sécurité par rapport au full tunnel.", a: false, exp: "Non : le split tunnel réduit la visibilité de sécurité sur le trafic personnel." }
  ],

    questions: [

    ],
    solution: `<pre class="pseudo"># Solution accès nomade PME :
# - Protocole : WireGuard (simple, rapide, super sur mobile)
#   -&gt; chaque poste a sa paire de cles ; on autorise via la cle PUBLIQUE
# - Repli : OpenVPN en TCP/443 pour les reseaux tres filtrants (imite HTTPS)

# - Mode : full tunnel (tout le trafic via l'entreprise) pour garder le controle
# Resultat : poste distant = comme branche au LAN, chiffre de bout en bout.</pre>
<p>L'équipe travaille à distance en sécurité. Demain : le premier facteur d'accès, l'authentification et la MFA.</p>`
