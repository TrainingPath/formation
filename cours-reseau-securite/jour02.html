  title: "Le triangle CIA",
  subtitle: "Confidentialité, intégrité, disponibilité : les trois piliers de toute sécurité.",
  theory: `
<h3>1. Trois questions pour toute donnée</h3>
<p>Pour décider si une information est bien protégée, on se pose trois questions simples. Qui a le droit de la <strong>lire</strong> ? Qui a le droit de la <strong>modifier</strong> ? Est-elle <strong>accessible</strong> quand on en a besoin ? Ces trois questions correspondent aux trois piliers de la sécurité, regroupés sous le sigle anglais <strong>CIA</strong> : <em>Confidentiality, Integrity, Availability</em>. En français, on utilise souvent le sigle <strong>DIC</strong> ou <strong>DICP</strong> : Disponibilité, Intégrité, Confidentialité (et parfois Preuve/traçabilité).</p>
<div class="tip">Attention au faux ami : ici « CIA » n'a rien à voir avec l'agence américaine. C'est simplement l'acronyme des trois propriétés à garantir.</div>
<h3>2. La confidentialité : qui a le droit de lire ?</h3>
<p>La <strong>confidentialité</strong> (en anglais <em>confidentiality</em>) garantit que seules les personnes autorisées peuvent accéder à une information. Un bulletin de salaire ne doit être lisible que par son propriétaire et le service paie. Les outils typiques : le <strong>chiffrement</strong> (rendre le contenu illisible sans la clé), les <strong>mots de passe</strong> et les <strong>droits d'accès</strong>. Quand la confidentialité est brisée, on parle de <strong>fuite</strong> ou de <strong>divulgation</strong> (en anglais <em>disclosure</em>).</p>
<h3>3. L'intégrité : la donnée est-elle intacte ?</h3>
<p>L'<strong>intégrité</strong> (en anglais <em>integrity</em>) garantit qu'une information n'a pas été <strong>modifiée</strong> de façon non autorisée, par accident ou par malveillance. Si un pirate change le numéro de compte sur un virement, la confidentialité n'est peut-être pas touchée (le montant reste lisible) mais l'intégrité, elle, est brisée. Pour la vérifier, on utilise des <strong>sommes de contrôle</strong> et des fonctions de <strong>hachage</strong> (en anglais <em>hash</em>) comme SHA-256 : le moindre changement d'un octet change complètement l'empreinte calculée.</p>
<pre class="pseudo"># Idee du controle d'integrite :
fichier_original      -> empreinte : 9f2a...c1
fichier_apres_transit -> empreinte : 9f2a...c1   => intact (integrite OK)
fichier_modifie       -> empreinte : 04be...77   => alteration detectee !</pre>
<h3>4. La disponibilité : est-ce accessible au bon moment ?</h3>
<p>La <strong>disponibilité</strong> (en anglais <em>availability</em>) garantit que le service ou la donnée est accessible quand un utilisateur légitime en a besoin. Un site bancaire parfaitement confidentiel et intègre ne sert à rien s'il est en panne au moment de payer. Les menaces sur la disponibilité : les <strong>dénis de service</strong>, les pannes matérielles, les erreurs humaines. Les parades : la <strong>redondance</strong> (plusieurs serveurs), les <strong>sauvegardes</strong> et une bonne surveillance.</p>
<div class="warn">Piège fréquent : croire que « plus de sécurité » est toujours mieux. Renforcer la confidentialité à l'extrême (mots de passe impossibles, accès verrouillés) peut nuire à la disponibilité (personne ne peut plus travailler). La sécurité, c'est un <strong>équilibre</strong> entre les trois piliers selon le contexte.</div>
<h3>5. Les trois piliers ensemble</h3>
<p>Une bonne protection tient compte des trois à la fois, mais leur importance relative dépend du contexte. Pour un dossier médical, la confidentialité prime. Pour un relevé bancaire, l'intégrité est cruciale. Pour un site de commerce, la disponibilité peut être la priorité (chaque minute d'arrêt coûte). Le triangle CIA sert de <strong>grille de lecture</strong> : face à un incident, on se demande toujours lequel des trois piliers a été touché.</p>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># CIA (anglais) = DIC / DICP (francais)
# C - Confidentialite : seuls les autorises peuvent LIRE.
#     Outils : chiffrement, mots de passe, droits d'acces.
# I - Integrite : la donnee n'est pas MODIFIEE sans autorisation.
#     Outils : hachage (SHA-256), sommes de controle.
# A - Disponibilite : accessible QUAND on en a besoin.
#     Outils : redondance, sauvegardes, surveillance.
# Securite = EQUILIBRE entre les trois selon le contexte.</pre>`,

    { type: "qcm", q: "Quel outil sert surtout à protéger la confidentialité ?", opts: ["La redondance des serveurs", "Le chiffrement", "Les sauvegardes", "Le calcul d'empreinte"], a: 1, exp: "Le chiffrement rend le contenu illisible sans la clé : il protège la confidentialité." },

    { type: "vf", q: "Une donnée peut rester confidentielle tout en ayant perdu son intégrité.", a: true, exp: "Oui : on peut modifier une donnée (perte d'intégrité) sans l'avoir divulguée (confidentialité préservée)." },
    { type: "qcm", q: "Quand la confidentialité est brisée, on parle de…", opts: ["Redondance", "Fuite (ou divulgation)", "Sauvegarde", "Latence"], a: 1, exp: "La rupture de confidentialité est une fuite / divulgation (disclosure)." },
    { type: "input", q: "Quel pilier une somme de contrôle (checksum) permet-elle de vérifier ?", a: ["intégrité", "integrite", "l'intégrité", "l'integrite"], ph: "un mot", exp: "Une somme de contrôle vérifie l'intégrité : la donnée est-elle intacte ?" },
    { type: "qcm", q: "À quoi sert le triangle CIA face à un incident ?", opts: ["À réparer automatiquement", "De grille de lecture : quel pilier a été touché ?", "À chiffrer les disques", "À accélérer le réseau"], a: 1, exp: "Le triangle CIA est une grille d'analyse : on identifie le(s) pilier(s) atteint(s)." }
  ],

    title: "Exercice final — Classer les incidents d'une clinique",
    intro: `<p>Une petite clinique utilise un logiciel de dossiers patients. En une semaine, trois incidents surviennent. Pour chacun, il faut identifier quel pilier du triangle CIA est touché, afin de choisir la bonne parade.</p>`,
    questions: [

      { type: "qcm", q: "Incident 2 : une panne serveur empêche l'accès aux dossiers pendant deux heures. Pilier touché ?", opts: ["Confidentialité", "Intégrité", "Disponibilité", "Aucun"], a: 2, exp: "Le service inaccessible au moment voulu : c'est la disponibilité." },
      { type: "qcm", q: "Incident 3 : un dosage médicamenteux est modifié par erreur dans un dossier. Pilier touché ?", opts: ["Confidentialité", "Intégrité", "Disponibilité", "Aucun"], a: 1, exp: "Une modification non autorisée / erronée de la donnée brise l'intégrité." },
      { type: "input", q: "Pour l'incident 2, quelle parade (un mot) permet qu'un second serveur prenne le relais ?", a: ["redondance", "la redondance"], ph: "un mot", exp: "La redondance maintient la disponibilité si un serveur tombe." },
      { type: "vf", q: "Restreindre à l'excès les accès (incident 1) sans se soucier de rien d'autre est forcément la meilleure solution.", a: false, exp: "Non : trop restreindre peut bloquer le travail légitime (disponibilité). Il faut équilibrer les trois piliers." }
    ],
    solution: `<pre class="pseudo"># Grille CIA appliquee aux 3 incidents :
# Incident 1 (lecture non autorisee)   -> CONFIDENTIALITE

# Lecon : identifier le pilier touche guide le choix de la parade.</pre>
<p>Le triangle CIA transforme une intuition floue (« c'est un problème de sécurité ») en diagnostic précis. Demain, nous verrons qui, concrètement, menace ces piliers : les menaces et les attaquants.</p>`
