<script>
var DAY = {
  num: 25,
  title: "Usurpation et sniffing",
  subtitle: "Comprendre l'écoute passive et l'usurpation d'adresse pour mieux s'en protéger.",
  theory: `
<h3>1. Pourquoi étudier les menaces quand on veut défendre ?</h3>
<p>On ne protège bien que ce dont on comprend les faiblesses. Ce cours est strictement <strong>défensif</strong> : le but est de sécuriser <em>ton propre</em> réseau, jamais d'attaquer autrui. Deux menaces classiques du réseau local expliquent pourquoi le chiffrement est devenu indispensable : l'<strong>écoute passive</strong> (en anglais <em>sniffing</em>) et l'<strong>usurpation d'adresse</strong> (en anglais <em>spoofing</em>). Les connaître, c'est savoir où placer ses défenses.</p>
<h3>2. Le sniffing : écouter le trafic qui passe</h3>
<p>Un paquet réseau non chiffré voyage en clair : n'importe quel équipement capable de lire le trafic peut en voir le contenu. Le <strong>sniffing</strong> consiste à capturer ces paquets. Sur un réseau commuté moderne, un switch dirige normalement chaque trame vers le bon port, ce qui limite l'écoute ; mais le WiFi ouvert, un port miroir mal configuré ou une machine compromise permettent d'observer le trafic. Des outils légitimes d'analyse comme <strong>Wireshark</strong> ou <strong>tcpdump</strong> servent aux administrateurs à diagnostiquer un réseau ; entre de mauvaises mains, ils révèlent des identifiants transmis en clair.</p>
<pre class="pseudo"># Capturer le trafic d'une interface (usage d'audit, sur SON reseau)
tcpdump -i eth0 -n port 80        # observe le HTTP en clair
# Un HTTP non chiffre laisse voir la requete :
GET /login?user=lea&amp;pass=secret HTTP/1.1
Host: exemple.local
# En HTTPS (TLS), ce meme contenu serait illisible pour l'ecouteur.</pre>
<div class="tip">Règle d'or : suppose toujours que le réseau est écouté. Le seul vrai rempart est le <strong>chiffrement de bout en bout</strong> (HTTPS/TLS, SSH, VPN), qui rend la capture inutilisable.</div>
<h3>3. L'usurpation (spoofing) : se faire passer pour un autre</h3>
<p>Chaque paquet IP contient une adresse source. Rien, au niveau IP seul, ne prouve qu'elle est authentique : un attaquant peut la falsifier — c'est l'<strong>IP spoofing</strong>. Il en existe des variantes : <strong>ARP spoofing</strong> (empoisonner la table ARP d'un réseau local pour se placer au milieu), <strong>MAC spoofing</strong> (copier l'adresse matérielle d'un équipement), <strong>DNS spoofing</strong> (renvoyer de fausses réponses DNS). Le point commun : tromper la confiance qu'un système accorde à une identité non vérifiée.</p>
<pre class="pseudo"># Idee du spoofing (schema, pas une commande d'attaque) :
Victime  --- pense parler a --->  Passerelle
             mais l'attaquant s'est intercale (Man-in-the-Middle)
Victime  ---> Attaquant ---> Passerelle     (il relaie et lit tout)</pre>
<h3>4. Pourquoi chiffrer change tout</h3>
<p>Face au sniffing, le chiffrement rend le contenu illisible. Face au spoofing, l'<strong>authentification</strong> (certificats TLS, clés SSH) prouve que l'on parle bien au bon serveur, pas à un imposteur. Un attaquant peut toujours intercepter des octets chiffrés, mais sans la clé ils sont inexploitables, et un certificat invalide déclenche une alerte. C'est pourquoi le web est passé massivement à <strong>HTTPS</strong>, et pourquoi on remplace Telnet par SSH et FTP par SFTP.</p>
<div class="warn">Un cadenas HTTPS prouve que la liaison est chiffrée et que le certificat est valide — pas que le site est honnête. Vérifie toujours le nom de domaine exact : le chiffrement protège le transport, pas ton jugement.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Sniffing  = ecouter le trafic (passif) -> parade : CHIFFRER
# Spoofing  = usurper une identite (IP/ARP/MAC/DNS) -> parade : AUTHENTIFIER
# HTTPS/TLS, SSH, VPN : confidentialite + integrite + authenticite
# Principe : ne jamais faire confiance a une identite non verifiee</pre>`,
  exercises: [
    { type: "qcm", q: "Que désigne le « sniffing » ?", opts: ["Falsifier une adresse IP", "Capturer et lire le trafic réseau", "Bloquer un port", "Chiffrer une connexion"], a: 1, exp: "Le sniffing est l'écoute passive : capturer les paquets qui circulent." },
    { type: "qcm", q: "Quelle est la meilleure parade contre l'écoute passive du trafic ?", opts: ["Éteindre le pare-feu", "Chiffrer le trafic (TLS, SSH, VPN)", "Changer d'adresse IP", "Désactiver le DNS"], a: 1, exp: "Chiffrer rend le contenu capturé illisible : c'est le vrai rempart." },
    { type: "qcm", q: "L'« IP spoofing » consiste à…", opts: ["Écouter le WiFi", "Falsifier l'adresse IP source d'un paquet", "Compresser les paquets", "Accélérer le routage"], a: 1, exp: "Le spoofing usurpe une identité en falsifiant l'adresse source." },
    { type: "qcm", q: "Quel outil légitime sert à analyser/capturer le trafic pour diagnostiquer un réseau ?", opts: ["Photoshop", "Wireshark", "Excel", "PowerPoint"], a: 1, exp: "Wireshark (et tcpdump) sont des analyseurs de trafic utilisés en administration." },
    { type: "qcm", q: "L'« ARP spoofing » vise surtout à…", opts: ["Casser un mot de passe WiFi", "Se placer en homme du milieu sur un réseau local", "Formater un disque", "Désactiver le HTTPS"], a: 1, exp: "Empoisonner l'ARP permet d'intercepter le trafic local (Man-in-the-Middle)." },
    { type: "qcm", q: "Contre l'usurpation d'identité d'un serveur, quel mécanisme aide le plus ?", opts: ["La compression", "L'authentification (certificats TLS, clés SSH)", "Le changement de port", "La défragmentation"], a: 1, exp: "L'authentification prouve qu'on parle au bon serveur, pas à un imposteur." },
    { type: "vf", q: "Un paquet IP prouve à lui seul, de façon fiable, l'identité de son expéditeur.", a: false, exp: "Non : l'adresse source peut être falsifiée. Il faut authentifier au-dessus d'IP." },
    { type: "vf", q: "Sur un réseau, il est prudent de supposer que le trafic peut être écouté.", a: true, exp: "Oui : c'est l'hypothèse défensive de base, d'où l'usage systématique du chiffrement." },
    { type: "vf", q: "HTTPS remplace avantageusement HTTP car il chiffre et authentifie la liaison.", a: true, exp: "Oui : TLS assure confidentialité, intégrité et authenticité du serveur." },
    { type: "vf", q: "Le cadenas HTTPS garantit que le site est honnête et digne de confiance.", a: false, exp: "Non : il garantit le chiffrement et un certificat valide, pas l'honnêteté du site." },
    { type: "input", q: "Quel protocole sécurisé remplace Telnet pour l'administration à distance ?", a: ["ssh"], ph: "3 lettres", exp: "SSH chiffre et authentifie la session, contrairement à Telnet en clair." },
    { type: "input", q: "Comment nomme-t-on l'attaque où l'on s'intercale entre deux parties pour lire/relayer leur trafic (terme en anglais) ?", a: ["man in the middle", "man-in-the-middle", "mitm", "homme du milieu"], ph: "expression", exp: "Man-in-the-Middle (MITM), en français « homme du milieu »." },
    { type: "input", q: "Quel outil en ligne de commande capture le trafic d'une interface (souvent utilisé pour un audit) ?", a: ["tcpdump"], ph: "un nom", exp: "tcpdump capture et affiche les paquets d'une interface réseau." },
    { type: "input", q: "Quelle variante d'usurpation renvoie de fausses réponses de résolution de noms ?", a: ["dns spoofing", "spoofing dns", "usurpation dns"], ph: "deux mots", exp: "Le DNS spoofing fournit de fausses réponses pour détourner vers un faux serveur." },
    { type: "input", q: "Quel protocole assure le chiffrement sous HTTPS (sigle) ?", a: ["tls", "ssl/tls", "tls/ssl"], ph: "3 lettres", exp: "TLS (successeur de SSL) chiffre et authentifie la connexion HTTPS." }
  ],
  final: {
    title: "Exercice final — Un café, un WiFi ouvert",
    intro: `<p>Dans un labo, tu simules un réseau WiFi ouvert pour comprendre les risques. Une machine « victime » se connecte à un service interne en HTTP simple, puis en HTTPS. Analysons, en défense, ce qui est exposé.</p>`,
    questions: [
      { type: "qcm", q: "Sur ce WiFi ouvert, le trafic HTTP en clair est…", opts: ["Impossible à lire", "Potentiellement lisible par un écouteur", "Automatiquement chiffré", "Chiffré par le routeur"], a: 1, exp: "Sans chiffrement applicatif, le contenu HTTP est exposé à l'écoute." },
      { type: "input", q: "Quel changement simple protège immédiatement le contenu échangé ?", a: ["https", "le https", "chiffrer", "tls", "passer en https"], ph: "un mot", exp: "Passer en HTTPS (TLS) rend le contenu illisible pour l'écouteur." },
      { type: "vf", q: "En HTTPS, l'écouteur peut encore voir la charge utile en clair (mot de passe, etc.).", a: false, exp: "Non : TLS chiffre la charge utile ; il ne verra que des octets chiffrés." },
      { type: "qcm", q: "Si un attaquant fait de l'ARP spoofing, il cherche à…", opts: ["Réduire la latence", "S'intercaler en homme du milieu", "Augmenter le débit", "Sauvegarder le trafic légitimement"], a: 1, exp: "L'ARP spoofing sert à intercepter le trafic local (MITM)." },
      { type: "vf", q: "Même en MITM, un certificat TLS invalide devrait alerter la victime.", a: true, exp: "Oui : un certificat non valide déclenche une alerte, signe d'usurpation possible." }
    ],
    solution: `<pre class="pseudo"># Bilan defensif du labo :
HTTP en clair  -> contenu lisible par un ecouteur (sniffing)
HTTPS (TLS)    -> contenu chiffre + serveur authentifie
ARP spoofing   -> tentative de MITM : le certificat invalide doit alerter
# Reflexe : chiffrer partout + verifier le domaine et le certificat.</pre>
<p>Conclusion : le chiffrement neutralise l'écoute, l'authentification neutralise l'usurpation. Demain, on apprend à <em>détecter</em> les intrusions avec les IDS/IPS.</p>`
  }
};
