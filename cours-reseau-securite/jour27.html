<script>
var DAY = {
  num: 27,
  title: "La sécurité du WiFi (WPA2 / WPA3)",
  subtitle: "Chiffrer les ondes : du WEP cassé au WPA3, et les bons réflexes.",
  theory: `
<h3>1. Le WiFi diffuse dans l'air : tout le monde entend</h3>
<p>Contrairement à un câble, une onde WiFi se propage autour de la borne : n'importe quel appareil à portée capte les trames. La seule protection réelle est donc le <strong>chiffrement</strong> de la liaison sans fil. Depuis les débuts du WiFi, les normes de sécurité ont beaucoup évolué : <strong>WEP</strong>, puis <strong>WPA</strong>, <strong>WPA2</strong> et aujourd'hui <strong>WPA3</strong> (WPA = <em>Wi-Fi Protected Access</em>).</p>
<h3>2. WEP : obsolète et cassé</h3>
<p>Le <strong>WEP</strong> (<em>Wired Equivalent Privacy</em>) fut le premier standard. Il est aujourd'hui <strong>totalement cassé</strong> : ses faiblesses (vecteur d'initialisation trop court, chiffrement RC4 mal employé) permettent de retrouver la clé en quelques minutes avec des outils publics. Il ne faut <strong>jamais</strong> utiliser le WEP — ni le vieux WPA (TKIP) qui présente aussi des faiblesses.</p>
<div class="warn">Si un équipement ne propose que WEP ou WPA/TKIP, considère-le comme non sécurisé pour toute donnée sensible. Le WEP donne une fausse impression de protection : c'est pire que pas de mot de passe, car on baisse la garde.</div>
<h3>3. WPA2 : le standard qui a longtemps régné</h3>
<p><strong>WPA2</strong> a généralisé le chiffrement <strong>AES</strong> via le mécanisme <strong>CCMP</strong>, bien plus robuste que le TKIP. Pour un particulier ou une petite entreprise, on utilise le mode <strong>WPA2-PSK</strong> (<em>Pre-Shared Key</em>, « clé pré-partagée ») : une seule phrase secrète pour tout le monde, aussi appelé mode <strong>Personnel</strong>. En entreprise, le mode <strong>WPA2-Enterprise</strong> authentifie chaque utilisateur individuellement via un serveur <strong>RADIUS</strong> (802.1X), ce qui évite le mot de passe unique partagé.</p>
<pre class="pseudo"># Choix de securite sur une box (du meilleur au pire)
WPA3            &lt;- privilegier si tous les appareils le supportent
WPA2-PSK (AES)  &lt;- bon standard actuel, tres repandu
WPA/TKIP        &lt;- a eviter (faible)
WEP             &lt;- INTERDIT (casse)
Ouvert (aucun)  &lt;- aucune confidentialite</pre>
<h3>4. WPA3 : la génération actuelle</h3>
<p><strong>WPA3</strong> apporte plusieurs améliorations. Son échange d'authentification <strong>SAE</strong> (<em>Simultaneous Authentication of Equals</em>, aussi appelé « Dragonfly ») remplace l'ancien handshake et résiste bien mieux aux attaques par <strong>dictionnaire hors-ligne</strong> : même si un attaquant capture l'échange, il ne peut pas tester des millions de mots de passe tranquillement chez lui. WPA3 offre aussi la <strong>PFS</strong> (confidentialité persistante) : compromettre la clé plus tard ne déchiffre pas le trafic passé. Un mode <em>transition</em> WPA2/WPA3 existe pour la compatibilité.</p>
<h3>5. Bonnes pratiques concrètes</h3>
<p>Au-delà de la norme, quelques réflexes comptent : une <strong>phrase de passe longue</strong> (au moins 12–15 caractères, non devinable), <strong>changer le mot de passe d'administration</strong> par défaut de la box, <strong>désactiver le WPS</strong> (le bouton/PIN de connexion facile, vulnérable), tenir le <strong>micrologiciel</strong> (firmware) à jour, et isoler les visiteurs sur un <strong>réseau invité</strong> séparé. Cacher le SSID n'apporte quasiment aucune sécurité réelle.</p>
<div class="tip">Priorités : WPA3 si possible, sinon WPA2-PSK (AES) ; phrase de passe longue ; WPS désactivé ; firmware à jour ; réseau invité pour les visiteurs.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># WEP           -> CASSE, interdit
# WPA/TKIP      -> faible, a eviter
# WPA2-PSK/AES  -> bon standard actuel (CCMP)
# WPA3-SAE      -> meilleur : resiste au dictionnaire hors-ligne + PFS
# Reflexes : passphrase longue, WPS off, firmware a jour, reseau invite</pre>`,
  exercises: [
    { type: "qcm", q: "Pourquoi le WiFi impose-t-il un chiffrement de la liaison ?", opts: ["Parce que c'est joli", "Parce que les ondes se propagent et sont captables par tous à portée", "Parce que c'est plus rapide", "Parce que la loi l'interdit"], a: 1, exp: "Le signal se diffuse dans l'air : sans chiffrement, tout le monde peut écouter." },
    { type: "qcm", q: "Quel est le statut du WEP aujourd'hui ?", opts: ["Le plus sûr", "Obsolète et cassé", "Réservé aux entreprises", "Identique à WPA3"], a: 1, exp: "Le WEP est cassé : la clé se retrouve en quelques minutes. À proscrire." },
    { type: "qcm", q: "Quel chiffrement robuste WPA2 a-t-il généralisé ?", opts: ["RC4", "AES (via CCMP)", "WEP", "DES"], a: 1, exp: "WPA2 utilise AES via CCMP, bien plus solide que le TKIP." },
    { type: "qcm", q: "Que signifie PSK dans WPA2-PSK ?", opts: ["Public Secure Key", "Pre-Shared Key (clé pré-partagée)", "Personal Server Kit", "Packet Switch Key"], a: 1, exp: "PSK = Pre-Shared Key : une clé partagée par tous, mode Personnel." },
    { type: "qcm", q: "Quel échange d'authentification introduit WPA3 ?", opts: ["TKIP", "SAE (Dragonfly)", "WEP", "PPP"], a: 1, exp: "WPA3 utilise SAE, résistant au dictionnaire hors-ligne." },
    { type: "qcm", q: "En entreprise, quel mode authentifie chaque utilisateur via un serveur RADIUS ?", opts: ["WPA2-PSK", "WPA2-Enterprise (802.1X)", "WEP", "WiFi ouvert"], a: 1, exp: "WPA2-Enterprise (802.1X) authentifie individuellement via RADIUS." },
    { type: "vf", q: "Le WEP offre une protection suffisante pour des données sensibles.", a: false, exp: "Non : il est cassé. Il donne une fausse impression de sécurité." },
    { type: "vf", q: "WPA3 (SAE) résiste mieux que WPA2 aux attaques par dictionnaire hors-ligne.", a: true, exp: "Oui : SAE empêche de tester massivement des mots de passe hors-ligne." },
    { type: "vf", q: "Désactiver le WPS est une bonne pratique de sécurité WiFi.", a: true, exp: "Oui : le WPS (PIN/bouton) présente des vulnérabilités connues." },
    { type: "vf", q: "Cacher le SSID rend le réseau réellement sécurisé.", a: false, exp: "Non : masquer le nom n'apporte quasiment aucune sécurité réelle." },
    { type: "input", q: "Quel chiffrement WPA2 emploie-t-il via CCMP (sigle) ?", a: ["aes"], ph: "3 lettres", exp: "AES est le chiffrement robuste utilisé par WPA2 (CCMP)." },
    { type: "input", q: "Quel mécanisme d'authentification WPA3 remplace l'ancien handshake (sigle) ?", a: ["sae"], ph: "3 lettres", exp: "SAE (Simultaneous Authentication of Equals), dit Dragonfly." },
    { type: "input", q: "Quelle fonctionnalité de connexion facile faut-il désactiver sur la box (sigle) ?", a: ["wps"], ph: "3 lettres", exp: "Le WPS est vulnérable : on le désactive." },
    { type: "input", q: "Quel réseau séparé propose-t-on aux visiteurs pour isoler leur trafic ?", a: ["reseau invite", "réseau invité", "reseau invites", "invite", "guest"], ph: "deux mots", exp: "Un réseau invité isole les visiteurs du réseau principal." },
    { type: "input", q: "Quel serveur d'authentification centralisée utilise WPA2-Enterprise (nom) ?", a: ["radius"], ph: "un nom", exp: "RADIUS, via 802.1X, authentifie chaque utilisateur." }
  ],
  final: {
    title: "Exercice final — Configurer une box en labo",
    intro: `<p>Tu configures la box WiFi de ton labo. Les appareils sont récents et supportent WPA3, mais un vieux capteur ne connaît que WPA2. Faisons les bons choix, en défense.</p>`,
    questions: [
      { type: "qcm", q: "Le meilleur choix de sécurité si tout le matériel le supporte est…", opts: ["WEP", "WPA/TKIP", "WPA3", "Réseau ouvert"], a: 2, exp: "WPA3 est la génération la plus sûre (SAE, PFS)." },
      { type: "input", q: "Le vieux capteur ne gère que WPA2 : quel mode Personnel avec AES choisir (sigle du mode) ?", a: ["wpa2-psk", "wpa2 psk", "psk", "wpa2-personnel", "wpa2 personnel"], ph: "un mode", exp: "WPA2-PSK (AES) reste un bon standard pour les appareils compatibles." },
      { type: "vf", q: "Activer le WEP « juste pour le vieux capteur » est acceptable.", a: false, exp: "Non : le WEP est cassé et compromettrait tout le réseau." },
      { type: "qcm", q: "Concernant le WPS de la box, tu…", opts: ["L'actives pour la facilité", "Le désactives", "L'ignores", "Le mets en WEP"], a: 1, exp: "On désactive le WPS, vulnérable." },
      { type: "input", q: "Pour les visiteurs du labo, tu actives un réseau… ?", a: ["invite", "réseau invité", "reseau invite", "guest"], ph: "un mot", exp: "Un réseau invité isole les visiteurs du réseau principal." }
    ],
    solution: `<pre class="pseudo"># Configuration retenue :
- SSID principal : WPA3 (SAE) pour les appareils recents
  ou mode transition WPA2/WPA3 si le vieux capteur doit rejoindre
- WPA2-PSK (AES) accepte pour les appareils non-WPA3 ; JAMAIS WEP/TKIP
- Passphrase longue (12-15+ car.), mot de passe admin change
- WPS DESACTIVE, firmware a jour, reseau INVITE pour les visiteurs</pre>
<p>Sécuriser le WiFi, c'est choisir la bonne norme ET appliquer les réflexes. Demain : durcir un serveur et un service.</p>`
  }
};
