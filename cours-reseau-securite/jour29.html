  title: "Journalisation, audit et réponse à incident",
  subtitle: "Garder des traces, les analyser, et savoir réagir quand ça tourne mal.",
  theory: `
<h3>1. Pourquoi journaliser ?</h3>
<p>Un système qui ne garde aucune trace est aveugle : après un incident, impossible de savoir ce qui s'est passé. La <strong>journalisation</strong> (en anglais <em>logging</em>) enregistre les événements : connexions, erreurs, accès, modifications. Ces <strong>journaux</strong> (logs) sont à la fois un outil de <strong>diagnostic</strong> et une source de preuves. Sans eux, une intrusion peut rester invisible pendant des mois.</p>
<div class="tip">Un bon log répond à quatre questions : <strong>qui</strong>, <strong>quoi</strong>, <strong>quand</strong>, <strong>d'où</strong>. Horodatage précis et identifiants sont essentiels.</div>
<h3>2. Où trouver les journaux ?</h3>
<p>Sous Linux, beaucoup de journaux vivent dans <strong>/var/log</strong> ; les systèmes modernes utilisent aussi <strong>journald</strong> (consultable avec la commande journalctl). Sous Windows, on parle des <strong>journaux d'événements</strong> (Event Log), consultables via l'Observateur d'événements. Les événements de sécurité importants : échecs de connexion, création de comptes, élévation de privilèges, modifications de règles de pare-feu.</p>
<pre class="pseudo"># Exemples de consultation (audit local)
journalctl -u ssh --since today      # journal du service SSH aujourd'hui
grep "Failed password" /var/log/auth.log   # echecs d'authentification SSH
# Un pic d'echecs = possible tentative de force brute -> a investiguer.</pre>
<h3>3. Centraliser : le SIEM</h3>
<p>Sur plusieurs machines, consulter les logs un par un est ingérable. On les <strong>centralise</strong> vers un point unique. C'est le rôle d'un <strong>SIEM</strong> (en anglais <em>Security Information and Event Management</em>) : il collecte les journaux de tout le parc, les <strong>corrèle</strong> (recoupe des événements venus de sources différentes) et lève des <strong>alertes</strong>. Un échec de connexion isolé n'est rien ; mille échecs suivis d'une réussite depuis la même source, c'est une histoire que le SIEM sait raconter.</p>
<pre class="pseudo"># Idee de correlation par un SIEM
Source A : 500 echecs SSH depuis 203.0.113.7
Source B : 1 connexion REUSSIE depuis 203.0.113.7
Source C : creation d'un nouveau compte admin
=> ALERTE : possible compromission (force brute reussie + persistance)</pre>
<h3>4. Protéger et conserver les journaux</h3>
<p>Un attaquant cherche souvent à <strong>effacer les traces</strong>. Il faut donc <strong>protéger les journaux</strong> : les envoyer en temps réel vers un serveur distant (le SIEM), restreindre qui peut les modifier, et définir une <strong>durée de conservation</strong> (rétention) adaptée. Des journaux falsifiables ne valent rien comme preuve. La <strong>synchronisation de l'heure</strong> (NTP) entre machines est indispensable pour corréler correctement.</p>
<div class="warn">Ne conserve pas de données sensibles inutiles dans les logs (mots de passe en clair, données personnelles) : les journaux eux-mêmes doivent être sécurisés et respecter la vie privée.</div>
<h3>5. La réponse à incident : une méthode</h3>
<p>Quand une alerte se confirme, on suit des <strong>étapes</strong> claires pour ne pas paniquer. Un modèle répandu comporte : <strong>préparation</strong> (avant l'incident : plan, contacts, sauvegardes), <strong>identification</strong> (confirmer qu'il y a bien incident), <strong>confinement</strong> (isoler pour limiter la propagation), <strong>éradication</strong> (supprimer la cause), <strong>récupération</strong> (remettre en service proprement) et <strong>leçons apprises</strong> (retour d'expérience pour s'améliorer).</p>
<pre class="pseudo"># Cycle de reponse a incident
Preparation -&gt; Identification -&gt; Confinement -&gt; Eradication -&gt; Recuperation -&gt; Lecons apprises
# Regle d'or : CONFINER d'abord (isoler la machine) pour stopper l'hemorragie,
# puis comprendre, corriger, restaurer, et documenter.</pre>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Journaliser : qui, quoi, quand, d'ou (horodatage + identifiants)

# SIEM : centralise + correle + alerte
# Proteger les logs (deport, retention, NTP) contre l'effacement
# Reponse : Preparation-Identification-Confinement-Eradication-Recuperation-Lecons</pre>`,

    { type: "input", q: "Quel sigle désigne l'outil qui centralise et corrèle les journaux de sécurité ?", a: ["siem"], ph: "4 lettres", exp: "SIEM : centralisation, corrélation et alertes." },

    { type: "input", q: "Comment nomme-t-on la durée pendant laquelle on conserve les journaux ?", a: ["retention", "rétention", "la retention", "duree de retention"], ph: "un mot", exp: "La rétention : durée de conservation des journaux." }
  ],

    intro: `<p>Ton SIEM de labo lève une alerte : des centaines d'échecs SSH depuis une même source, suivis d'une connexion réussie et de la création d'un compte administrateur. Déroule la réponse à incident.</p>`,
    questions: [

      { type: "input", q: "Quelle dernière étape sert à tirer un retour d'expérience pour s'améliorer ?", a: ["lecons apprises", "leçons apprises", "retour d'experience", "retex", "lecons"], ph: "deux mots", exp: "Les leçons apprises (retour d'expérience) clôturent le cycle." }
    ],
    solution: `<pre class="pseudo"># Reponse a incident deroulee :
1) Identification : SIEM correle echecs SSH + reussite + compte admin cree
2) Confinement    : isoler la machine du reseau
3) Eradication    : supprimer le compte malveillant, corriger la faille, changer les cles
4) Recuperation   : restaurer depuis une sauvegarde saine, remettre en service surveille
5) Lecons apprises: documenter, renforcer (MFA, fail2ban, cles SSH, tuning des alertes)</pre>
<p>Des journaux protégés + un SIEM + une méthode = on détecte tôt et on réagit juste. Demain : auditer un réseau avec nmap.</p>`
