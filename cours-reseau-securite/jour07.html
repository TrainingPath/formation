<script>
var DAY = {
  num: 7,
  title: "Le pare-feu à états (stateful)",
  subtitle: "Se souvenir des connexions pour autoriser automatiquement les réponses légitimes.",
  theory: `
<h3>1. Le problème du filtrage sans état</h3>
<p>Hier, le filtrage de paquets jugeait chaque paquet <strong>isolément</strong>. Cela pose un problème concret. Quand votre machine demande une page web, elle envoie un paquet <strong>sortant</strong> vers le port 443 du serveur. Le serveur répond par un paquet <strong>entrant</strong>. Avec un pare-feu sans état et une politique default DROP en entrée, ce paquet de réponse serait bloqué : le pare-feu ne sait pas qu'il fait suite à votre demande. Pour que cela marche, on serait obligé d'ouvrir largement les entrées, ce qui affaiblit la sécurité.</p>
<h3>2. La solution : suivre les connexions</h3>
<p>Le <strong>pare-feu à états</strong> (en anglais <em>stateful firewall</em>) résout cela en <strong>mémorisant les connexions</strong> en cours dans une <strong>table d'états</strong> (en anglais <em>state table</em>, ou <em>table de suivi des connexions</em> / <em>connection tracking</em>). Quand vous initiez une connexion sortante, il l'enregistre. Lorsque la réponse arrive, il reconnaît qu'elle <strong>appartient à une connexion déjà établie</strong> et l'autorise automatiquement, sans avoir besoin d'une règle d'entrée large et permanente.</p>
<div class="tip">Analogie : le vigile note qui est sorti fumer une cigarette. Quand cette personne revient, il la laisse rentrer parce qu'il se <strong>souvient</strong> qu'elle était déjà entrée. Un vigile sans mémoire (stateless) redemanderait une autorisation à chaque passage.</div>
<h3>3. Les états d'une connexion</h3>
<p>Le pare-feu classe chaque paquet selon l'état de la connexion à laquelle il se rattache. Les états typiques (vocabulaire iptables) :</p>
<pre class="pseudo"># NEW         : premier paquet, la connexion demarre (nouvelle demande)
# ESTABLISHED : paquet appartenant a une connexion deja etablie
# RELATED     : connexion liee a une autre deja autorisee (ex : transfert FTP de donnees)
# INVALID     : paquet qui ne correspond a aucune connexion connue -> a jeter</pre>
<p>La règle typique d'un pare-feu à états tient en peu de mots : autoriser <strong>ESTABLISHED,RELATED</strong> (les réponses et suites légitimes), autoriser explicitement les <strong>NEW</strong> que l'on veut permettre (ex : nouvelles connexions vers le port 443 du serveur), et <strong>jeter le reste</strong>.</p>
<h3>4. Pourquoi c'est plus sûr ET plus simple</h3>
<p>Le suivi d'état apporte deux bénéfices. <strong>Sécurité</strong> : on n'a plus besoin d'ouvrir des plages d'entrée larges pour les réponses ; seules les réponses aux connexions réellement initiées passent. <strong>Simplicité</strong> : une seule règle « autoriser ESTABLISHED,RELATED » remplace des dizaines de règles fragiles. Le pare-feu à états détecte aussi les paquets <strong>INVALID</strong> (par exemple un paquet qui prétend faire partie d'une connexion qui n'existe pas) et les rejette.</p>
<pre class="pseudo"># Schema d'une session web sortante avec pare-feu a etats :
# 1. Machine -> Serveur : NEW (demande vers port 443)  => autorise (regle sortante)
# 2. Le pare-feu enregistre la connexion dans sa table d'etats
# 3. Serveur -> Machine : ESTABLISHED (reponse)         => autorise AUTOMATIQUEMENT
# 4. Un paquet non sollicite venu d'ailleurs : INVALID  => jete</pre>
<div class="warn">Le suivi d'état n'est pas magique : il gère la légitimité du <em>flux</em>, pas le <em>contenu</em>. Une connexion parfaitement « établie » peut transporter une attaque applicative. Le stateful reste une couche : il se complète par l'inspection applicative et les autres mesures.</div>
<h3>5. Stateless ou stateful : que choisir ?</h3>
<p>Le stateful est aujourd'hui la norme pour la plupart des usages : plus sûr, plus simple à écrire. Le stateless garde un intérêt là où la performance brute prime et où l'on veut des règles ultra-simples, ou pour un filtrage très basique. Mais pour protéger un réseau ou une machine ordinaire, on privilégie le <strong>suivi d'état</strong>.</p>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># STATELESS : juge chaque paquet seul -> doit ouvrir large pour les reponses.
# STATEFUL : memorise les connexions dans une TABLE D'ETATS.
# Etats : NEW (nouvelle), ESTABLISHED (etablie), RELATED (liee), INVALID (a jeter).
# Regle cle : autoriser ESTABLISHED,RELATED + les NEW voulues, jeter le reste.
# Benefices : plus SUR (pas d'entrees larges) et plus SIMPLE (moins de regles).
# Reste une couche : gere le flux, pas le contenu applicatif.</pre>`,
  exercises: [
    { type: "qcm", q: "Quel est le principe d'un pare-feu à états (stateful) ?", opts: ["Juger chaque paquet isolément", "Mémoriser les connexions pour reconnaître les réponses légitimes", "Chiffrer tous les paquets", "Bloquer tout le trafic sortant"], a: 1, exp: "Le stateful suit les connexions et autorise automatiquement les paquets qui appartiennent à une connexion établie." },
    { type: "input", q: "Comment appelle-t-on la table où le pare-feu mémorise les connexions en cours ? (deux mots, FR ou EN)", a: ["table d'états", "table d etats", "table d'etats", "state table", "table de suivi"], ph: "deux mots", exp: "La table d'états (state table / connection tracking) mémorise les connexions suivies." },
    { type: "qcm", q: "Dans le vocabulaire des états, que signifie ESTABLISHED ?", opts: ["Un premier paquet d'une nouvelle connexion", "Un paquet appartenant à une connexion déjà établie", "Un paquet invalide à jeter", "Un paquet chiffré"], a: 1, exp: "ESTABLISHED : le paquet fait partie d'une connexion déjà en cours." },
    { type: "qcm", q: "Quel état désigne le tout premier paquet qui démarre une connexion ?", opts: ["ESTABLISHED", "NEW", "RELATED", "INVALID"], a: 1, exp: "NEW : le premier paquet, la connexion démarre." },
    { type: "input", q: "Quel état désigne un paquet ne correspondant à aucune connexion connue et qu'il faut jeter ?", a: ["invalid", "invalide"], ph: "un mot", exp: "INVALID : le paquet ne correspond à aucune connexion suivie, on le jette." },
    { type: "vf", q: "Avec un pare-feu à états, la réponse à une connexion que vous avez initiée est autorisée automatiquement.", a: true, exp: "Oui : le pare-feu reconnaît qu'elle appartient à une connexion établie (ESTABLISHED)." },
    { type: "qcm", q: "Quelle règle résume la logique d'un pare-feu à états ?", opts: ["Tout bloquer, y compris les réponses", "Autoriser ESTABLISHED,RELATED + les NEW voulues, jeter le reste", "Tout autoriser", "Autoriser seulement INVALID"], a: 1, exp: "On autorise les réponses/suites (ESTABLISHED,RELATED) et les nouvelles connexions voulues (NEW), et on jette le reste." },
    { type: "vf", q: "Un pare-feu sans état doit souvent ouvrir des entrées larges pour laisser passer les réponses.", a: true, exp: "Oui : sans mémoire, il ne relie pas la réponse à la demande, ce qui oblige à ouvrir plus, donc moins sûr." },
    { type: "input", q: "Quel état désigne une connexion liée à une autre déjà autorisée (ex : données FTP) ?", a: ["related", "relatée", "relatee", "liée", "liee"], ph: "un mot", exp: "RELATED : une connexion associée à une connexion déjà autorisée." },
    { type: "qcm", q: "Un avantage du stateful en matière d'écriture des règles est…", opts: ["Il faut beaucoup plus de règles", "Une seule règle ESTABLISHED,RELATED remplace de nombreuses règles fragiles", "Il n'y a plus aucune règle à écrire", "Les règles deviennent aléatoires"], a: 1, exp: "Le suivi d'état simplifie : une règle pour les réponses au lieu de dizaines de règles d'entrée." },
    { type: "vf", q: "Le suivi d'état inspecte le contenu applicatif et détecte tout virus dans le flux.", a: false, exp: "Faux : il gère la légitimité du flux (connexion), pas le contenu applicatif. C'est une couche parmi d'autres." },
    { type: "qcm", q: "Pourquoi le stateful est-il plus sûr pour les réponses entrantes ?", opts: ["Il chiffre les réponses", "Seules les réponses aux connexions réellement initiées passent", "Il ouvre tous les ports", "Il ralentit le trafic"], a: 1, exp: "On n'ouvre pas d'entrées larges : seul ce qui répond à une connexion établie est accepté." },
    { type: "input", q: "Un vigile qui « se souvient » de qui est sorti pour le laisser rentrer illustre un pare-feu de quel type ? (un mot, FR ou EN)", a: ["à états", "a etats", "stateful", "états", "etats"], ph: "un mot", exp: "C'est l'analogie du pare-feu à états (stateful) : il se souvient des connexions." },
    { type: "qcm", q: "Pour une machine ordinaire à protéger, on privilégie généralement…", opts: ["Le stateless", "Le stateful (suivi d'état)", "Aucun pare-feu", "Un pare-feu qui autorise tout"], a: 1, exp: "Le stateful est la norme : plus sûr et plus simple pour la plupart des usages." },
    { type: "qcm", q: "Un paquet arrive en prétendant appartenir à une connexion inexistante. Le pare-feu à états…", opts: ["L'accepte comme ESTABLISHED", "Le classe INVALID et le jette", "Le transforme en NEW", "L'ignore mais le laisse passer"], a: 1, exp: "Ne correspondant à aucune connexion suivie, il est INVALID et doit être jeté." }
  ],
  final: {
    title: "Exercice final — La session web et la table d'états",
    intro: `<p>Sur un poste de travail, l'utilisateur ouvre un site web. Le pare-feu de la machine est en default DROP pour les entrées et utilise le suivi d'état. Suivons ce qui se passe, paquet par paquet, et comparons avec ce qu'aurait fait un pare-feu sans état.</p>`,
    questions: [
      { type: "qcm", q: "Le premier paquet sortant vers le port 443 du serveur est de quel état ?", opts: ["ESTABLISHED", "NEW", "INVALID", "RELATED"], a: 1, exp: "C'est le début de la connexion : état NEW." },
      { type: "input", q: "Le pare-feu enregistre alors cette connexion dans sa… (deux mots)", a: ["table d'états", "table d etats", "table d'etats", "state table", "table de suivi"], ph: "deux mots", exp: "Il l'inscrit dans la table d'états pour reconnaître la réponse à venir." },
      { type: "qcm", q: "La réponse entrante du serveur est autorisée parce que…", opts: ["Toutes les entrées sont ouvertes", "Elle est ESTABLISHED : elle appartient à la connexion déjà initiée", "Elle est INVALID", "Le pare-feu est éteint"], a: 1, exp: "La réponse est ESTABLISHED : le pare-feu la relie à la connexion initiée et l'autorise automatiquement." },
      { type: "vf", q: "Avec un pare-feu sans état et default DROP en entrée, cette réponse aurait risqué d'être bloquée sans règle d'ouverture large.", a: true, exp: "Oui : sans mémoire, il ne relie pas la réponse à la demande, d'où le besoin d'ouvrir large (moins sûr)." },
      { type: "qcm", q: "Un paquet non sollicité arrive d'une autre adresse sans connexion associée. Que fait le pare-feu à états ?", opts: ["Il l'accepte", "Il le classe INVALID / non-ESTABLISHED et le jette", "Il le transforme en réponse", "Il ouvre un port pour lui"], a: 1, exp: "Aucune connexion ne lui correspond : il est jeté (INVALID / non autorisé par default DROP)." }
    ],
    solution: `<pre class="pseudo"># Deroule de la session web (pare-feu a etats, default DROP entrant) :
# 1. Poste -> Serveur:443   etat NEW      => autorise (sortant permis)
# 2. Pare-feu ENREGISTRE la connexion dans la table d'etats
# 3. Serveur:443 -> Poste   etat ESTABLISHED => autorise AUTOMATIQUEMENT
# 4. Paquet non sollicite    etat INVALID  => jete
#
# Comparaison stateless : il aurait fallu ouvrir large en entree
# pour laisser passer la reponse -> moins sur.
# Regle cle stateful : ACCEPT ESTABLISHED,RELATED ; jeter le reste.</pre>
<p>Le suivi d'état est ce qui rend un pare-feu à la fois sûr et simple à configurer. Demain, dernière étape : mettre tout cela en pratique avec iptables et nftables, et leurs chaînes INPUT/OUTPUT/FORWARD.</p>`
  }
};
