var DAY = {
  num: 9,
  title: "Le pare-feu Windows et les zones",
  subtitle: "Un portier qui filtre le trafic selon l'endroit où tu te trouves.",
  theory: `
<h3>1. À quoi sert un pare-feu ?</h3>
<p>Un <strong>pare-feu</strong> (en anglais <em>firewall</em>, littéralement « mur coupe-feu ») est un filtre placé entre ta machine et le réseau. Son rôle : examiner chaque paquet qui entre ou qui sort, puis décider de le <strong>laisser passer</strong> ou de le <strong>bloquer</strong>, en s'appuyant sur des <strong>règles</strong>. Imagine un portier de club : il regarde qui se présente, consulte sa liste, et ouvre ou ferme la porte. Le pare-feu de Windows s'appelle <em>Pare-feu Windows Defender</em> et il est actif par défaut.</p>
<p>Un pare-feu raisonne sur trois critères principaux : la <strong>direction</strong> (le trafic entre-t-il ou sort-il ?), le <strong>port</strong> et le <strong>protocole</strong> (TCP 443, UDP 53…), et l'<strong>adresse</strong> (quelle source, quelle destination). C'est un outil purement <strong>défensif</strong> : il réduit la surface d'attaque de la machine.</p>
<h3>2. Entrant et sortant : deux sens à ne pas confondre</h3>
<p>Le trafic <strong>entrant</strong> (en anglais <em>inbound</em>) vient du réseau vers ta machine : c'est quelqu'un qui frappe à ta porte. Le trafic <strong>sortant</strong> (<em>outbound</em>) part de ta machine vers le réseau : c'est toi qui sors. La philosophie de Windows est prudente : par défaut il <strong>bloque le trafic entrant non sollicité</strong> et <strong>autorise le trafic sortant</strong>. Autrement dit, tu peux consulter un site web (tu sors), mais personne ne peut ouvrir une connexion vers toi sans qu'une règle l'autorise.</p>
<div class="tip">Retenir le sens par défaut : <strong>entrant = bloqué</strong> (sauf règle d'autorisation), <strong>sortant = autorisé</strong>. Une réponse à une connexion que TU as initiée passe toujours : le pare-feu suit l'état de la connexion (<em>stateful</em>).</div>
<h3>3. Les trois profils de zone</h3>
<p>La grande idée de Windows : le même ordinateur n'a pas les mêmes besoins de sécurité partout. Windows définit donc trois <strong>profils</strong> (ou <strong>zones</strong>) selon le réseau auquel tu es connecté :</p>
<pre class="pseudo"># Les 3 profils du pare-feu Windows
Domaine (Domain)  : le PC est joint a un domaine d'entreprise (Active Directory)
                    -> regles gerees par l'administrateur, confiance controlee
Prive (Private)   : reseau de confiance (maison, bureau) -> un peu plus permissif
                    ex: partage de fichiers/imprimante autorise
Public (Public)   : reseau inconnu (gare, cafe, aeroport) -> le plus strict
                    -> decouverte reseau coupee, partages bloques</pre>
<p>Quand tu te connectes à un nouveau réseau Wi-Fi, Windows te demande s'il s'agit d'un réseau privé ou public : ta réponse choisit le profil, donc le niveau de filtrage. Sur un réseau public, choisis toujours <strong>Public</strong> : ta machine devient quasi invisible aux autres.</p>
<h3>4. Écrire une règle</h3>
<p>Une <strong>règle</strong> décrit un cas et une décision. On peut créer une règle entrante ou sortante, la lier à un port, à un programme, à une adresse, et l'attacher à un ou plusieurs profils. Exemple de logique (schéma, pas une vraie commande) :</p>
<pre class="pseudo"># Idee d'une regle entrante
SI  direction = entrant
ET  protocole = TCP  ET  port = 3389 (Bureau a distance)
ET  profil    = Prive
ALORS action  = Autoriser
SINON (par defaut)     = Bloquer</pre>
<div class="warn">Ouvrir un port entrant, c'est ouvrir une porte : ne le fais que si le service est nécessaire, et restreins la source quand tu le peux. Le Bureau à distance (RDP, port 3389) exposé au public est une cible classique d'attaques par force brute. En cadre défensif, on ferme tout ce qui ne sert pas.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Pare-feu = filtre entrant/sortant selon des regles
# Par defaut : ENTRANT bloque, SORTANT autorise, connexions suivies (stateful)
# 3 profils : Domaine (entreprise) / Prive (confiance) / Public (strict)
# Une regle = direction + protocole/port + adresse + profil -> Autoriser/Bloquer
# Reflexe defensif : n'ouvrir un port entrant que si c'est vraiment necessaire</pre>`,
  exercises: [

    { type: "qcm", q: "Par défaut, le pare-feu Windows traite le trafic entrant non sollicité comment ?", opts: ["Il l'autorise", "Il le bloque", "Il le chiffre", "Il le redirige"], a: 1, exp: "Windows bloque par défaut l'entrant non sollicité et autorise le sortant." },

    { type: "qcm", q: "Quel profil est le plus strict ?", opts: ["Domaine", "Privé", "Public", "Ils sont identiques"], a: 2, exp: "Le profil Public (réseau inconnu) est le plus restrictif : découverte et partages coupés." },
    { type: "vf", q: "Le profil Domaine s'applique quand le PC est joint à un domaine d'entreprise (Active Directory).", a: true, exp: "Oui : les règles y sont typiquement gérées par l'administrateur." },
    { type: "input", q: "Sur un réseau Wi-Fi de café ou de gare, quel profil faut-il choisir ?", a: ["public", "profil public"], ph: "un mot", exp: "Public : la machine devient quasi invisible et les partages sont bloqués." },
    { type: "qcm", q: "Que signifie qu'un pare-feu est « stateful » (à état) ?", opts: ["Il oublie chaque paquet", "Il suit l'état des connexions et laisse passer les réponses attendues", "Il chiffre l'état du disque", "Il ne filtre que l'UDP"], a: 1, exp: "Un pare-feu à état laisse revenir la réponse d'une connexion que TU as initiée." },
    { type: "qcm", q: "De quoi se compose principalement une règle de pare-feu ?", opts: ["Un simple numéro de port", "Direction + protocole/port + adresse + profil, puis une action", "Un mot de passe uniquement", "Une adresse MAC seule"], a: 1, exp: "La règle décrit un cas (direction, port, adresse, profil) et une décision (autoriser/bloquer)." },
    { type: "vf", q: "Autoriser un port entrant augmente la surface d'attaque de la machine.", a: true, exp: "Oui : chaque port ouvert est une porte potentielle ; on n'ouvre que le nécessaire." },
    { type: "input", q: "Sur quel port TCP écoute par défaut le Bureau à distance (RDP) ?", a: ["3389"], ph: "un nombre", exp: "RDP écoute sur le port TCP 3389 ; l'exposer au public est risqué." },
    { type: "qcm", q: "Le profil Privé correspond à…", opts: ["Un réseau inconnu", "Un réseau de confiance (maison, bureau)", "Un réseau d'entreprise avec domaine", "Un réseau chiffré obligatoirement"], a: 1, exp: "Privé = réseau de confiance ; un peu plus permissif (partage possible)." },
    { type: "vf", q: "Le pare-feu Windows Defender est désactivé par défaut.", a: false, exp: "Non : il est actif par défaut sur Windows." },
    { type: "input", q: "Quel mot anglais désigne le pare-feu ?", a: ["firewall"], ph: "un mot", exp: "Firewall : le « mur coupe-feu » qui filtre le trafic." }
  ],
  final: {
    title: "Exercice final — Configurer un poste nomade",
    intro: `<p>Sarah utilise un portable qu'elle connecte tantôt au réseau de l'entreprise, tantôt à sa box, tantôt au Wi-Fi d'un hôtel. Elle veut un filtrage prudent partout et n'exposer aucun service inutile. Aidons-la à raisonner en profils et en règles.</p>`,
    questions: [
      { type: "qcm", q: "À l'hôtel, quel profil doit-elle choisir pour ce Wi-Fi ?", opts: ["Domaine", "Privé", "Public", "Aucun"], a: 2, exp: "Réseau inconnu = Public : le plus strict, partages et découverte coupés." },
      { type: "vf", q: "Sur le réseau de l'entreprise joint au domaine, le profil Domaine s'active et les règles viennent souvent de l'administrateur.", a: true, exp: "Oui : en environnement Active Directory, la stratégie centralise les règles." },
      { type: "qcm", q: "Elle n'héberge aucun serveur. Que faire des règles entrantes ?", opts: ["Tout ouvrir", "Laisser l'entrant bloqué par défaut", "Autoriser RDP au public", "Désactiver le pare-feu"], a: 1, exp: "Sans service à exposer, on garde l'entrant bloqué : surface d'attaque minimale." },
      { type: "input", q: "Elle consulte des sites web : ce trafic qu'elle initie est-il entrant ou sortant ?", a: ["sortant", "outbound"], ph: "un mot", exp: "Naviguer, c'est initier une connexion vers l'extérieur : trafic sortant (autorisé)." },
      { type: "qcm", q: "Un collègue lui demande d'ouvrir RDP (3389) au profil Public pour « dépanner à distance ». Réflexe défensif ?", opts: ["Ouvrir sans condition", "Refuser au Public ; sinon restreindre la source et préférer un canal sécurisé", "Désactiver le pare-feu", "Ouvrir tous les ports"], a: 1, exp: "RDP exposé au public est une cible d'attaques ; on restreint fortement ou on évite." }
    ],
    solution: `<pre class="pseudo"># Strategie de Sarah, profil par profil :
Hotel / Wi-Fi inconnu  -> Profil PUBLIC (strict) : rien d'expose
Box maison             -> Profil PRIVE (confiance) : partages si besoin
Entreprise (domaine)   -> Profil DOMAINE : regles de l'administrateur
Regle par defaut       -> ENTRANT bloque, SORTANT autorise
RDP 3389 au public     -> NON (ou source restreinte + canal securise)</pre>
<p>En choisissant le bon profil et en gardant l'entrant fermé, Sarah reste protégée partout sans rien exposer d'inutile.</p>`
  }
};
