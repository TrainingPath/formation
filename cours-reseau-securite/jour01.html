<script>
var DAY = {
  num: 1,
  title: "Pourquoi sécuriser un réseau ?",
  subtitle: "Comprendre ce qu'on protège, contre quoi, et pourquoi ça compte vraiment.",
  theory: `
<h3>1. Un réseau, c'est une porte ouverte sur le monde</h3>
<p>Dès qu'une machine est connectée à un réseau, elle devient <strong>joignable</strong> par d'autres machines. C'est tout l'intérêt : partager des fichiers, envoyer des courriels, consulter des sites. Mais « joignable » veut aussi dire « atteignable par des inconnus ». Un serveur exposé sur Internet reçoit des tentatives de connexion non sollicitées dès ses premières minutes en ligne. La sécurité réseau (en anglais <em>network security</em>) est l'ensemble des mesures qui permettent de garder les bénéfices de la connexion tout en refermant les portes qui ne devraient pas rester ouvertes.</p>
<p>Ce cours est <strong>strictement défensif</strong> : l'objectif est de comprendre les mécanismes pour mieux <em>protéger</em> ses propres systèmes. Toute manipulation se fait dans un <strong>laboratoire isolé</strong> (machines virtuelles, réseau de test), jamais contre des systèmes qui ne vous appartiennent pas.</p>
<h3>2. Que cherche-t-on à protéger ?</h3>
<p>On ne protège pas « le réseau » de manière abstraite : on protège des <strong>actifs</strong> (en anglais <em>assets</em>). Un actif, c'est tout ce qui a de la valeur : des <strong>données</strong> (dossiers clients, mots de passe, fichiers de paie), des <strong>services</strong> (le site web qui doit rester en ligne), et la <strong>réputation</strong> de l'organisation. Perdre l'un de ces actifs a un coût réel : amende, arrêt d'activité, clients qui partent.</p>
<div class="tip">Bon réflexe : avant de sécuriser, listez vos actifs et classez-les par importance. On protège d'abord ce qui ferait le plus mal à perdre. C'est l'idée de <strong>gestion du risque</strong> (en anglais <em>risk management</em>).</div>
<h3>3. Des exemples de risques concrets</h3>
<p>Voici des situations réelles que la sécurité réseau cherche à éviter :</p>
<pre class="pseudo"># Fuite de donnees : une base clients mal protegee est copiee.
# Rancongiciel : un logiciel chiffre les fichiers et exige un paiement.
# Deni de service : un service est noye sous les requetes et tombe.
# Usurpation : un attaquant se fait passer pour un utilisateur legitime.
# Intrusion : un acces non autorise a une machine interne.</pre>
<p>Le point commun : dans chaque cas, quelqu'un obtient un accès ou un effet qu'il ne devrait pas avoir. Un mot de passe faible, un service inutile laissé ouvert, un logiciel non mis à jour : voilà les fissures par lesquelles les problèmes entrent.</p>
<h3>4. Le coût d'un incident</h3>
<p>Un incident de sécurité ne se limite presque jamais au problème technique. Il y a le coût <strong>direct</strong> (remettre les systèmes en état, payer des experts), le coût <strong>indirect</strong> (activité arrêtée, ventes perdues), et le coût <strong>de réputation</strong> (confiance des clients entamée). Dans beaucoup de pays, une fuite de données personnelles entraîne aussi des obligations légales : prévenir les personnes concernées et parfois une autorité. En Europe, le <strong>RGPD</strong> encadre la protection des données personnelles.</p>
<div class="warn">Piège classique : croire qu'« on est trop petit pour intéresser un attaquant ». La plupart des attaques sont <strong>automatisées</strong> et ne visent personne en particulier : elles balaient Internet à la recherche de la première porte ouverte. Être petit ne protège pas.</div>
<h3>5. La sécurité est un processus, pas un produit</h3>
<p>Aucun outil unique ne « rend sécurisé ». La sécurité est une démarche continue : évaluer les risques, mettre en place des protections, surveiller, corriger, recommencer. On parle souvent de trois grands types de mesures : <strong>prévention</strong> (empêcher l'incident), <strong>détection</strong> (le repérer vite) et <strong>réaction</strong> (limiter les dégâts et restaurer). Un pare-feu, que nous verrons dans ce cours, est un outil de prévention parmi d'autres.</p>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># Etre connecte = etre joignable = etre expose.
# On protege des ACTIFS : donnees, services, reputation.
# Risques : fuite, rancongiciel, deni de service, usurpation, intrusion.
# Les attaques sont souvent AUTOMATISEES : la taille ne protege pas.
# Securite = processus continu : prevenir / detecter / reagir.
# Cadre de ce cours : DEFENSIF, en laboratoire isole.</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie « une machine est joignable sur un réseau » ?", opts: ["Elle est éteinte", "D'autres machines peuvent l'atteindre", "Elle n'a pas d'adresse", "Elle est connectée mais invisible aux autres machines"], a: 1, exp: "Joignable = atteignable par d'autres machines, y compris des inconnus. C'est l'intérêt du réseau mais aussi son risque." },
    { type: "qcm", q: "En sécurité, qu'appelle-t-on un « actif » (asset) ?", opts: ["Un câble réseau", "Tout ce qui a de la valeur à protéger : données, services, réputation", "Un type d'attaque", "Un mot de passe uniquement"], a: 1, exp: "Un actif est un bien à protéger : données, services, réputation." },
    { type: "vf", q: "Ce cours a une visée défensive : comprendre pour mieux protéger, en laboratoire isolé.", a: true, exp: "Oui. Le cadre est strictement défensif et les manipulations se font en labo isolé." },
    { type: "qcm", q: "Pourquoi « on est trop petit pour être visé » est-il un mauvais raisonnement ?", opts: ["Parce que les petits n'ont pas de données", "Parce que beaucoup d'attaques sont automatisées et balaient Internet sans cibler personne", "Parce que les attaquants préfèrent les petits", "Parce que les hébergeurs protègent automatiquement les petits sites"], a: 1, exp: "Les attaques automatisées cherchent la première porte ouverte, quelle que soit la taille de la cible." },
    { type: "input", q: "Comment appelle-t-on un logiciel malveillant qui chiffre les fichiers et exige un paiement pour les rendre ?", a: ["rancongiciel", "rançongiciel", "ransomware"], ph: "un mot", exp: "Rançongiciel (en anglais ransomware) : il chiffre les données et réclame une rançon." },
    { type: "vf", q: "La sécurité est un produit qu'on achète une fois et qui règle tout.", a: false, exp: "Non : la sécurité est un processus continu (prévenir, détecter, réagir), pas un produit unique." },
    { type: "qcm", q: "Parmi ces coûts d'un incident, lequel est un coût de réputation ?", opts: ["Payer un expert pour restaurer", "La perte de confiance des clients", "Racheter du matériel", "Les heures supplémentaires"], a: 1, exp: "La perte de confiance des clients est un coût de réputation, distinct des coûts directs et indirects." },
    { type: "input", q: "Quel règlement européen encadre la protection des données personnelles ? (sigle)", a: ["rgpd", "gdpr"], ph: "sigle", exp: "Le RGPD (en anglais GDPR) encadre la protection des données personnelles en Europe." },
    { type: "qcm", q: "Une attaque qui noie un service sous les requêtes jusqu'à le faire tomber s'appelle…", opts: ["Une fuite de données", "Un déni de service", "Une usurpation", "Une attaque de l'homme du milieu"], a: 1, exp: "Le déni de service (denial of service) rend un service indisponible en le saturant." },
    { type: "qcm", q: "Les trois grands types de mesures de sécurité sont…", opts: ["Authentification, autorisation, audit", "Prévention, détection, réaction", "Lire, écrire, exécuter", "Chiffrement, sauvegarde, journalisation"], a: 1, exp: "Prévention (empêcher), détection (repérer vite), réaction (limiter et restaurer)." },
    { type: "vf", q: "Un serveur fraîchement exposé sur Internet ne reçoit des connexions que si on lui donne son adresse.", a: false, exp: "Faux : des scans automatisés le trouvent et tentent des connexions dès ses premières minutes en ligne." },
    { type: "input", q: "Comment nomme-t-on la démarche qui consiste à évaluer les risques et à décider quoi protéger en priorité ? (deux mots)", a: ["gestion du risque", "gestion des risques", "risk management"], ph: "deux mots", exp: "La gestion du risque : on identifie et on hiérarchise ce qu'on protège." },
    { type: "qcm", q: "Un pare-feu est surtout un outil de quel type ?", opts: ["Détection", "Prévention", "Réaction", "Sauvegarde"], a: 1, exp: "Le pare-feu prévient en bloquant du trafic indésirable avant qu'il n'atteigne les services." },
    { type: "qcm", q: "Pourquoi lister ses actifs avant de sécuriser ?", opts: ["Pour acheter le pare-feu le plus cher", "Pour protéger d'abord ce qui ferait le plus mal à perdre", "Pour chiffrer automatiquement tous les fichiers", "Parce que c'est obligatoire partout"], a: 1, exp: "Classer les actifs par importance permet de concentrer l'effort là où le risque est le plus élevé." },
    { type: "input", q: "Un accès non autorisé à une machine interne s'appelle une… (un mot)", a: ["intrusion", "une intrusion"], ph: "un mot", exp: "Une intrusion : un accès obtenu sans autorisation à un système." }
  ],
  final: {
    title: "Exercice final — La petite association qui se met en ligne",
    intro: `<p>Une association de quartier héberge son premier petit serveur : un site vitrine et une base des membres (noms, adresses courriel). L'équipe pense « personne ne nous connaît, on ne risque rien ». Deux jours après la mise en ligne, les journaux montrent des centaines de tentatives de connexion venues du monde entier. Aidons-les à raisonner correctement.</p>`,
    questions: [
      { type: "qcm", q: "Pourquoi reçoivent-ils déjà des tentatives alors qu'ils n'ont donné leur adresse à personne ?", opts: ["Un employé a trahi", "Des scans automatisés balaient Internet et ont trouvé leur serveur", "Leur nom de domaine a été indexé par un moteur de recherche", "Un pare-feu mal configuré génère de fausses alertes"], a: 1, exp: "Les scans automatisés trouvent tout serveur exposé, sans qu'on ait communiqué son adresse." },
      { type: "input", q: "La base des membres (noms, courriels) est un exemple de quoi qu'on doit protéger ? (un mot)", a: ["actif", "un actif", "actifs", "données", "donnees"], ph: "un mot", exp: "C'est un actif : des données personnelles ayant de la valeur et à protéger." },
      { type: "vf", q: "Comme l'association est petite, elle n'a besoin d'aucune mesure de sécurité.", a: false, exp: "Faux : les attaques automatisées ne tiennent pas compte de la taille. La protection reste nécessaire." },
      { type: "qcm", q: "Si la base de membres fuitait, quel type de coût, en plus du coût technique, apparaîtrait ?", opts: ["Aucun", "Un coût de réputation et de possibles obligations légales (RGPD)", "Le coût de formation des nouveaux employés", "Le coût des heures supplémentaires techniques"], a: 1, exp: "Une fuite de données personnelles entraîne perte de confiance et obligations légales." },
      { type: "qcm", q: "Quelle démarche adopter en premier ?", opts: ["Acheter au hasard un logiciel « sécurité totale »", "Lister les actifs, évaluer les risques, puis prévenir/détecter/réagir", "Installer un antivirus sur chaque poste et s'arrêter là", "Ne rien faire tant qu'il n'y a pas d'incident"], a: 1, exp: "La sécurité est un processus : on identifie les actifs et les risques avant de choisir les mesures." }
    ],
    solution: `<pre class="pseudo"># Raisonnement de l'association :
# 1. Etre en ligne = etre expose (scans automatiques immediats).
# 2. Actifs a proteger : le site (disponibilite) + la base membres (donnees).
# 3. La taille ne protege pas : attaques automatisees.
# 4. Un incident coute : technique + reputation + obligations legales.
# 5. Demarche : lister actifs -> evaluer risques -> prevenir/detecter/reagir.</pre>
<p>La sécurité n'est pas une dépense de luxe réservée aux grands : c'est la condition pour rester en ligne sereinement. Demain, nous verrons le socle qui structure toute la sécurité : le triangle CIA.</p>`
  }
};
</script>
