<script>
var DAY = {
  num: 6,
  title: "Filtrage de paquets et règles",
  subtitle: "Écrire des règles par IP, port et protocole, et choisir la bonne politique par défaut.",
  theory: `
<h3>1. Le filtrage de paquets</h3>
<p>Le <strong>filtrage de paquets</strong> (en anglais <em>packet filtering</em>) est la forme la plus fondamentale de pare-feu. Pour chaque paquet qui se présente, le pare-feu regarde ses <strong>en-têtes</strong> (adresses, ports, protocole) et le compare à une <strong>liste de règles</strong>. Il ne s'intéresse ni au contenu applicatif, ni à l'historique de la connexion : il juge le paquet isolément, d'où le nom de filtrage <strong>sans état</strong> (en anglais <em>stateless</em>), que nous opposerons demain au filtrage à états.</p>
<h3>2. De quoi est faite une règle ?</h3>
<p>Une règle décrit un <strong>motif</strong> (les critères à reconnaître) et une <strong>action</strong> (que faire si ça correspond). Les critères classiques :</p>
<pre class="pseudo"># SOURCE      : adresse IP (ou plage) d'ou vient le paquet
# DESTINATION : adresse IP (ou plage) visee
# PORT        : numero de port (service vise, ex : 22, 80, 443)
# PROTOCOLE   : TCP, UDP, ICMP
# SENS        : entrant (INPUT) ou sortant (OUTPUT)
# ACTION      : ACCEPT (autoriser) | DROP (jeter) | REJECT (refuser + reponse)</pre>
<p>Exemple en langage courant : « autoriser le TCP entrant vers le port 443 » ou « bloquer tout ce qui vient de l'adresse 203.0.113.7 ».</p>
<h3>3. DROP contre REJECT</h3>
<p>Deux façons de refuser un paquet. <strong>DROP</strong> : le paquet est jeté <strong>silencieusement</strong>, l'expéditeur n'a aucune réponse et attend jusqu'à expiration. <strong>REJECT</strong> : le paquet est refusé mais le pare-feu <strong>renvoie un message</strong> d'erreur (« port fermé »). DROP est plus discret (l'attaquant ne sait pas si la machine existe) ; REJECT est plus « poli » et évite les attentes, utile en interne pour le confort. Pour l'exposition Internet, DROP est souvent préféré.</p>
<div class="tip">Astuce mémoire : <strong>DROP</strong> = « on jette sans répondre » (silence). <strong>REJECT</strong> = « on refoule en le disant » (message renvoyé). <strong>ACCEPT</strong> = « on laisse passer ».</div>
<h3>4. L'ordre des règles compte</h3>
<p>Un pare-feu lit ses règles <strong>de haut en bas</strong> et applique <strong>la première</strong> qui correspond. L'ordre est donc crucial : une règle trop large placée trop haut peut « avaler » du trafic avant qu'une règle plus précise ne soit lue. On place généralement les règles <strong>spécifiques d'abord</strong>, les règles générales ensuite.</p>
<pre class="pseudo"># Lecture de haut en bas, premiere correspondance appliquee :
# Regle 1 : ACCEPT TCP vers port 443        (specifique)
# Regle 2 : ACCEPT TCP vers port 22 depuis 10.0.0.5  (specifique)
# Regle 3 : DROP tout le reste              (generale, en dernier)
# => un paquet vers 443 est accepte par la regle 1 et ne lit pas la 3.</pre>
<h3>5. La politique par défaut</h3>
<p>Que faire d'un paquet qui ne correspond à <strong>aucune</strong> règle ? C'est la <strong>politique par défaut</strong> (en anglais <em>default policy</em>). Deux choix : <strong>default ACCEPT</strong> (tout ce qui n'est pas interdit passe) ou <strong>default DROP</strong> (tout ce qui n'est pas autorisé est bloqué). En sécurité, la bonne réponse est presque toujours <strong>default DROP</strong> : c'est l'application de la liste blanche. On bloque tout par défaut, puis on ouvre explicitement le strict nécessaire.</p>
<div class="warn">Piège classique et dangereux : laisser la politique par défaut sur ACCEPT « pour ne rien casser ». Cela revient à laisser toutes les portes ouvertes et à espérer avoir pensé à lister chaque interdiction. On finit toujours par en oublier une. <strong>Default DROP</strong> est la posture sûre.</div>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># FILTRAGE DE PAQUETS (stateless) : juge chaque paquet isole via ses en-tetes.
# Regle = MOTIF (IP src/dst, port, protocole, sens) + ACTION.
# Actions : ACCEPT (passer) | DROP (jeter en silence) | REJECT (refuser + message).
# Ordre : lecture de haut en bas, PREMIERE correspondance -> specifiques d'abord.
# POLITIQUE PAR DEFAUT : default DROP (tout bloque sauf autorise) = posture sure.</pre>`,
  exercises: [
    { type: "qcm", q: "Sur quoi se base le filtrage de paquets pour décider ?", opts: ["Le contenu du fichier téléchargé", "Les en-têtes du paquet (IP, port, protocole)", "La météo", "Le nom de l'utilisateur"], a: 1, exp: "Le filtrage de paquets examine les en-têtes : adresses, ports, protocole." },
    { type: "input", q: "Comment qualifie-t-on un filtrage qui juge chaque paquet isolément, sans mémoire de la connexion ? (terme anglais)", a: ["stateless", "sans état", "sans etat"], ph: "un mot", exp: "Stateless (sans état) : chaque paquet est jugé seul, sans historique. C'est le filtrage de base." },
    { type: "qcm", q: "Que fait l'action DROP ?", opts: ["Autorise le paquet", "Jette le paquet silencieusement, sans réponse", "Renvoie un message d'erreur poli", "Chiffre le paquet"], a: 1, exp: "DROP jette le paquet sans réponse : l'expéditeur attend jusqu'à expiration." },
    { type: "qcm", q: "En quoi REJECT diffère-t-il de DROP ?", opts: ["REJECT autorise le paquet", "REJECT refuse mais renvoie un message d'erreur", "REJECT chiffre le paquet", "Ils sont identiques"], a: 1, exp: "REJECT refuse et prévient l'expéditeur ; DROP jette en silence." },
    { type: "input", q: "Quelle action autorise un paquet à passer ?", a: ["accept", "accepter"], ph: "un mot", exp: "ACCEPT autorise le paquet à traverser le pare-feu." },
    { type: "vf", q: "Un pare-feu applique toutes les règles qui correspondent à un paquet, pas seulement la première.", a: false, exp: "Faux : il lit de haut en bas et applique la PREMIÈRE règle qui correspond, puis s'arrête." },
    { type: "qcm", q: "Où placer les règles les plus spécifiques ?", opts: ["En dernier", "Avant les règles générales", "N'importe où, l'ordre n'a pas d'importance", "Dans un autre fichier"], a: 1, exp: "Les règles spécifiques d'abord ; sinon une règle générale trop haute avale le trafic." },
    { type: "input", q: "Comment appelle-t-on la décision appliquée à un paquet qui ne correspond à aucune règle ? (trois mots)", a: ["politique par défaut", "politique par defaut", "default policy", "la politique par défaut"], ph: "trois mots", exp: "La politique par défaut (default policy) : ACCEPT ou DROP pour le reste non prévu." },
    { type: "qcm", q: "Quelle politique par défaut est la plus sûre ?", opts: ["default ACCEPT", "default DROP", "default REJECT ALL puis ACCEPT tout", "Aucune"], a: 1, exp: "default DROP : tout est bloqué sauf ce qu'on autorise explicitement (liste blanche)." },
    { type: "vf", q: "default DROP est l'application concrète de la logique de liste blanche.", a: true, exp: "Oui : on bloque tout par défaut puis on ouvre explicitement le strict nécessaire." },
    { type: "qcm", q: "Pour l'exposition sur Internet, DROP est souvent préféré à REJECT parce que…", opts: ["Il est plus lent", "Il est plus discret : l'attaquant n'obtient aucune information", "Il renvoie plus de messages", "Il ouvre plus de ports"], a: 1, exp: "DROP ne renvoie rien : l'attaquant ne sait même pas si la machine existe." },
    { type: "input", q: "Une règle est composée d'un motif (les critères) et d'une… (un mot)", a: ["action", "une action"], ph: "un mot", exp: "Une règle = motif (critères) + action (ACCEPT/DROP/REJECT)." },
    { type: "qcm", q: "Avec les règles : 1) ACCEPT port 443, 2) DROP tout, un paquet vers le port 443…", opts: ["Est bloqué par la règle 2", "Est accepté par la règle 1 et n'atteint pas la 2", "Déclenche une erreur", "Est renvoyé à l'expéditeur"], a: 1, exp: "La première règle qui correspond s'applique : ACCEPT (443) est lue avant le DROP général." },
    { type: "vf", q: "Laisser la politique par défaut sur ACCEPT « pour ne rien casser » est une bonne pratique de sécurité.", a: false, exp: "Faux : c'est risqué. On oublie toujours une interdiction. default DROP est la posture sûre." },
    { type: "qcm", q: "Quel critère permet de n'autoriser SSH que depuis une seule adresse ?", opts: ["Le protocole seulement", "L'adresse IP source combinée au port 22", "La couleur du paquet", "La taille du disque"], a: 1, exp: "On combine l'IP source autorisée et le port 22 (SSH) : ACCEPT TCP port 22 depuis cette IP." }
  ],
  final: {
    title: "Exercice final — Écrire la logique des règles d'un serveur",
    intro: `<p>Un serveur doit : offrir son site web en HTTPS (port 443) à tout le monde, permettre l'administration SSH (port 22) uniquement depuis le poste de l'administrateur (10.0.0.5), et rien d'autre en entrée. Composons la logique des règles et choisissons la politique par défaut.</p>`,
    questions: [
      { type: "qcm", q: "Quelle politique par défaut adopter pour le trafic entrant ?", opts: ["default ACCEPT", "default DROP", "Aucune politique", "ACCEPT tout puis rien"], a: 1, exp: "default DROP : on bloque tout par défaut, puis on ouvre le strict nécessaire." },
      { type: "input", q: "Quel port autoriser en entrée pour le site web HTTPS accessible à tous ?", a: ["443", "port 443", "le 443"], ph: "un nombre", exp: "Le port 443 (HTTPS) doit être ouvert à tous en entrée." },
      { type: "qcm", q: "Pour SSH, quelle règle traduit « seulement depuis 10.0.0.5 » ?", opts: ["ACCEPT TCP port 22 depuis n'importe quelle IP", "ACCEPT TCP port 22 depuis 10.0.0.5 uniquement", "DROP port 22 pour tous", "ACCEPT port 443 depuis 10.0.0.5"], a: 1, exp: "On combine le port 22 et l'IP source 10.0.0.5 pour restreindre SSH à l'administrateur." },
      { type: "vf", q: "Il faut placer la règle générale « DROP tout le reste » AVANT les règles ACCEPT spécifiques.", a: false, exp: "Faux : les spécifiques (ACCEPT 443, ACCEPT 22 depuis 10.0.0.5) d'abord, le DROP général en dernier." },
      { type: "qcm", q: "Face à Internet, vaut-il mieux DROP ou REJECT pour le trafic non autorisé ?", opts: ["REJECT, pour être poli", "DROP, plus discret : aucune information donnée à l'attaquant", "ACCEPT, par prudence", "Peu importe totalement"], a: 1, exp: "DROP ne renvoie rien : l'attaquant n'obtient aucune information sur la machine." }
    ],
    solution: `<pre class="pseudo"># Logique des regles (haut en bas, premiere correspondance) :
# Politique par defaut : default DROP (tout bloque sauf autorise)
#
# 1. ACCEPT  TCP  dst port 443  (site web HTTPS, pour tous)
# 2. ACCEPT  TCP  dst port 22   src 10.0.0.5  (SSH admin uniquement)
# 3. (implicite) tout le reste -> DROP  (politique par defaut)
#
# Ordre : specifiques (1 et 2) d'abord, DROP general en dernier.
# Face a Internet : DROP (silencieux) plutot que REJECT.</pre>
<p>Vous savez maintenant composer un jeu de règles cohérent et choisir la bonne politique par défaut. Mais ce filtrage juge chaque paquet isolément : demain, nous verrons sa limite et sa réponse, le pare-feu à états.</p>`
  }
};
</script>
