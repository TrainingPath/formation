  title: "La sécurité des VLAN et du LAN",

  theory: `
<h3>1. Segmenter : diviser pour mieux protéger</h3>
<p>Un réseau local « à plat » (tout le monde dans le même segment) est fragile : si une machine est compromise, elle voit et attaque toutes les autres. La <strong>segmentation</strong> consiste à découper le LAN en zones étanches. Les <strong>VLAN</strong> (<em>Virtual LAN</em>) permettent de créer plusieurs réseaux logiques sur le même équipement physique : VLAN des serveurs, VLAN bureautique, VLAN invités, VLAN téléphonie. Par défaut, deux VLAN ne communiquent pas : il faut passer par un routeur/pare-feu qui applique des règles. On réduit ainsi la <strong>surface d'attaque</strong> et on contient un incident dans sa zone.</p>
<pre class="pseudo"># LAN a plat : 1 seul domaine -&gt; une machine infectee voit TOUT
# LAN segmente en VLAN :
# VLAN 10 (serveurs) | VLAN 20 (bureautique) | VLAN 30 (invites) | VLAN 40 (VoIP)
#   -&gt; le trafic INTER-VLAN passe par un routeur/pare-feu qui filtre</pre>
<h3>2. Ports access et trunk, le marquage 802.1Q</h3>
<p>Sur un switch, un port <strong>access</strong> appartient à un seul VLAN (on y branche un PC). Un port <strong>trunk</strong> transporte plusieurs VLAN entre équipements ; chaque trame est alors <strong>étiquetée</strong> (<em>tag</em>) selon la norme <strong>802.1Q</strong> qui inscrit le numéro de VLAN dans la trame. Le trunk est comme une autoroute à plusieurs voies, chaque voiture portant l'étiquette de sa destination.</p>
<h3>3. Le VLAN natif : un piège à connaître</h3>
<p>Sur un trunk, un VLAN particulier voyage <strong>sans étiquette</strong> : le <strong>VLAN natif</strong> (par défaut le VLAN 1). C'est une faiblesse : une trame injectée sans tag sera traitée comme appartenant au VLAN natif, ce qui peut être exploité pour sauter de VLAN (<em>VLAN hopping</em>). Bonnes pratiques défensives : <strong>ne pas utiliser le VLAN 1</strong> pour les données, <strong>changer le VLAN natif</strong> pour un VLAN inutilisé et « en cul-de-sac », et ne mettre en trunk que les ports réellement entre équipements (désactiver la négociation automatique de trunk sur les ports d'accès).</p>
<div class="warn">Ne laisse jamais le VLAN 1 (natif par défaut) servir de VLAN de production ou de gestion, et désactive l'auto-négociation de trunk (DTP) sur les ports utilisateurs : c'est la base contre le VLAN hopping.</div>
<h3>4. Port security : verrouiller le port d'accès</h3>
<p>La <strong>port security</strong> limite quelles machines peuvent utiliser un port d'accès en se basant sur l'<strong>adresse MAC</strong>. On peut fixer un nombre maximal d'adresses MAC par port (souvent 1), et définir une <strong>réaction</strong> si une MAC non autorisée apparaît : <strong>shutdown</strong> (couper le port), <strong>restrict</strong> ou <strong>protect</strong> (bloquer le trafic indésirable, avec ou sans alerte). Cela contre le branchement sauvage d'un mini-switch ou d'un appareil pirate, et limite les attaques par saturation de la table d'adresses (<em>MAC flooding</em>, qui vise à faire déborder la table pour forcer le switch à diffuser partout).</p>
<div class="tip">Empilez les défenses (<em>defense in depth</em>) : VLAN pour cloisonner, port security pour verrouiller les ports d'accès, et 802.1X (jour 21) pour authentifier avant l'accès. Aucune couche seule n'est parfaite.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Segmentation = cloisonner le LAN en VLAN -&gt; contenir un incident
# Port access = 1 VLAN | Port trunk = plusieurs VLAN, tag 802.1Q
# VLAN natif = non tague (VLAN 1 par defaut) -&gt; risque de VLAN hopping
#   Defense : ne pas utiliser VLAN 1, changer le VLAN natif, desactiver DTP sur les ports users
# Port security = limiter les MAC par port (max, puis shutdown/restrict/protect)
#   -&gt; contre le mini-switch pirate et le MAC flooding
# Defense en profondeur : VLAN + port security + 802.1X</pre>`,

    { type: "qcm", q: "Bonne pratique concernant le VLAN natif d'un trunk ?", opts: ["Le laisser à VLAN 1 avec des données", "Le changer pour un VLAN inutilisé et en cul-de-sac", "Le supprimer complètement", "Le chiffrer avec IPsec"], a: 1, exp: "Changer le VLAN natif pour un VLAN inutilisé réduit le risque de hopping." },
    { type: "qcm", q: "Quelles trois défenses se complètent au niveau du LAN d'accès ?", opts: ["VLAN, port security et 802.1X", "DNS, DHCP et NAT", "HTTP, FTP et SSH", "AES, RSA et SHA"], a: 0, exp: "VLAN (cloisonner) + port security (verrouiller) + 802.1X (authentifier)." }
  ],

    questions: [

      { type: "qcm", q: "Pour authentifier qui se branche sur les prises publiques, on ajoute…", opts: ["802.1X + RADIUS", "Un simple hub", "Rien", "Un pare-feu applicatif"], a: 0, exp: "802.1X avec RADIUS authentifie avant l'accès (défense en profondeur)." }
    ],
    solution: `<pre class="pseudo"># Durcissement du LAN de l'open space :
# 1) SEGMENTER en VLAN : VLAN employes, VLAN imprimantes, VLAN invites (salle d'attente).

# Defense en profondeur : chaque couche couvre les angles morts des autres.</pre>
