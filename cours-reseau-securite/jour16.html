  theory: `
<h3>1. HTTPS = HTTP + TLS</h3>
<p><strong>HTTP</strong> (en anglais <em>HyperText Transfer Protocol</em>) est le langage du web : il transporte les pages, les images, les formulaires entre ton navigateur et le serveur. Mais HTTP est <strong>en clair</strong> : n'importe qui sur le chemin (un Wi-Fi public, un fournisseur d'accès) peut lire ou modifier ce qui passe. <strong>HTTPS</strong> (le « S » pour <em>Secure</em>) résout cela d'une manière élégante : ce n'est pas un nouveau protocole, c'est simplement <strong>HTTP transporté à l'intérieur d'un tunnel TLS</strong>. On empile : HTTP au-dessus, TLS qui chiffre, TCP/IP qui transporte.</p>
<pre class="pseudo"># HTTPS = HTTP dans un tunnel TLS
+-------------------------+
|  HTTP (pages, formulaires) |   <- le contenu applicatif
+-------------------------+
|  TLS (chiffrement + auth) |    <- le tunnel securise
+-------------------------+
|  TCP / IP (transport)     |    <- l'acheminement
+-------------------------+
# HTTP tout seul = port 80 (en clair) ; HTTPS = port 443 (chiffre)</pre>
<h3>2. Le port 443 et l'URL</h3>
<p>HTTP « nu » utilise le <strong>port 80</strong> ; HTTPS utilise le <strong>port 443</strong>. Dans la barre d'adresse, une URL en <code>https://</code> indique que la connexion passera par TLS. Le navigateur ouvre alors une connexion TCP vers le port 443 du serveur, réalise le <strong>handshake TLS</strong> (jour 15), puis envoie les requêtes HTTP <strong>à l'intérieur</strong> du tunnel chiffré.</p>
<h3>3. Le cadenas : ce qu'il dit (et ce qu'il ne dit pas)</h3>
<p>Le petit <strong>cadenas</strong> affiché par le navigateur signifie que la connexion est chiffrée et que le certificat du site est valide. En cliquant dessus, on peut inspecter le certificat : à qui il a été délivré, par quelle autorité, jusqu'à quand il est valide.</p>
<div class="warn">Le cadenas ne garantit PAS que le site est honnête : il garantit que la <strong>connexion</strong> vers CE domaine est chiffrée et authentifiée. Un site d'hameçonnage peut aussi obtenir un certificat valide. Le cadenas prouve « tu parles bien à ce-domaine, en privé », pas « ce-domaine est digne de confiance ». Vérifie toujours le nom de domaine.</div>
<h3>4. La vérification du certificat, étape par étape</h3>
<p>Avant d'afficher le cadenas, le navigateur effectue les contrôles du jour 14 : le certificat correspond-il au <strong>nom de domaine</strong> demandé ? Est-il <strong>dans sa période de validité</strong> ? Sa <strong>chaîne de confiance</strong> remonte-t-elle à une <strong>CA racine</strong> connue ? N'est-il pas <strong>révoqué</strong> ? Si tout est bon, la clé publique du serveur est fiable et le handshake peut établir la clé de session.</p>
<pre class="pseudo"># De l'URL au contenu, de bout en bout
1. L'utilisateur tape https://ma-banque.example
2. Navigateur -> connexion TCP sur le PORT 443
3. Handshake TLS : ServerHello + CERTIFICAT verifie (nom, dates, chaine, revocation)
4. Cle de session symetrique etablie (chiffrement hybride)
5. Requetes/reponses HTTP echangees CHIFFREES en AES dans le tunnel
6. Cadenas affiche : connexion chiffree + certificat valide</pre>
<div class="tip">« De bout en bout » ici veut dire : entre TON navigateur et LE serveur, personne au milieu ne peut lire ni modifier le contenu. Mot de passe, numéro de carte, messages : tout circule chiffré. C'est ce qui rend les achats et la banque en ligne possibles.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># HTTPS = HTTP + TLS : le web chiffre, sur le PORT 443 (HTTP nu = port 80)
# TLS s'occupe du handshake, du certificat et du chiffrement AES du contenu
# Le CADENAS = connexion chiffree + certificat valide (PAS "site honnete")
# Verification du certificat : nom de domaine, validite, chaine, revocation
# Bout en bout : personne au milieu ne lit ni ne modifie le contenu
# Reflexe defensif : verifier le NOM DE DOMAINE, ne pas ignorer une alerte</pre>`,

    { type: "qcm", q: "Dans quel ordre les couches s'empilent-elles pour HTTPS ?", opts: ["TLS au-dessus de HTTP", "HTTP au-dessus de TLS au-dessus de TCP/IP", "HTTP directement sur IP sans TCP", "DNS au-dessus de HTTP"], a: 1, exp: "HTTP (contenu) sur TLS (tunnel) sur TCP/IP (transport)." },

    { type: "qcm", q: "Que signifie « chiffrement de bout en bout » ici ?", opts: ["Le disque est chiffré", "Entre le navigateur et le serveur, personne au milieu ne peut lire ni modifier", "Le site est plus rapide", "Le DNS est chiffré"], a: 1, exp: "Le contenu reste illisible pour tout intermédiaire entre client et serveur." },
    { type: "vf", q: "Le cadenas dispense de regarder le nom de domaine affiché.", a: false, exp: "Non : le cadenas ne prouve pas l'honnêteté ; il faut toujours vérifier le domaine." },
    { type: "qcm", q: "Quelle brique de TLS permet au navigateur de faire confiance à la clé publique du serveur ?", opts: ["Le certificat signé par une CA", "Le port 80", "Le cache DNS", "La compression"], a: 0, exp: "Le certificat X.509 signé par une autorité relie la clé publique à l'identité du site." }
  ],

      { type: "input", q: "Une fois le tunnel prêt, avec quel type de chiffrement le numéro de carte circule-t-il ? (rapide)", a: ["symétrique", "symetrique", "aes", "chiffrement symétrique"], ph: "un type / algo", exp: "Le contenu HTTP (dont la carte) est chiffré en symétrique (AES) dans le tunnel." },
      { type: "vf", q: "Le cadenas seul suffit à prouver que boutique.example est une entreprise honnête.", a: false, exp: "Non : il prouve une connexion chiffrée et un certificat valide ; l'honnêteté se vérifie autrement (domaine, réputation)." }
    ],
    solution: `<pre class="pseudo"># Achat de Nadia, de bout en bout
1. https://boutique.example -> connexion TCP sur le PORT 443
2. Handshake TLS : ServerHello + CERTIFICAT
   -> verif : nom de domaine, dates de validite, chaine jusqu'a une CA racine, revocation
3. Cle de session symetrique etablie (asymetrique pour la cle, AES ensuite)
4. Requetes HTTP (dont le numero de carte) CHIFFREES en AES dans le tunnel
5. Cadenas affiche = connexion chiffree + certificat valide
# Reflexe : verifier que le domaine est bien boutique.example (le cadenas ne suffit pas).</pre>
<p>HTTP fournit le contenu, TLS fournit la sécurité, le certificat fournit la confiance : ensemble, ils permettent un web où l'on peut payer et se connecter en toute discrétion.</p>`
  }
