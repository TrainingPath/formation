  title: "Les fonctions de hachage",
  subtitle: "Une empreinte de taille fixe qui trahit la moindre modification.",
  theory: `
<h3>1. Une empreinte numérique</h3>
<p>Une <strong>fonction de hachage</strong> (en anglais <em>hash function</em>) prend une donnée de n'importe quelle taille — un mot, un fichier de 4 Go, un message — et en calcule une <strong>empreinte</strong> de <strong>longueur fixe</strong>, appelée <strong>condensé</strong> ou <strong>hash</strong> (en anglais <em>digest</em>). C'est une sorte d'« empreinte digitale » du contenu : deux fichiers différents produisent des empreintes différentes, et le moindre octet changé bouleverse complètement le résultat.</p>
<p>Attention à ne pas confondre avec le chiffrement : le hachage <strong>ne se déchiffre pas</strong>. Il n'y a pas de clé et pas de retour en arrière. On ne cherche pas à cacher la donnée puis à la retrouver, mais à obtenir une signature courte et vérifiable de son contenu.</p>
<h3>2. SHA-256, le standard</h3>
<p>La fonction de référence aujourd'hui est <strong>SHA-256</strong> (de la famille <em>SHA-2</em>, « Secure Hash Algorithm »). Elle produit toujours une empreinte de <strong>256 bits</strong>, soit 64 caractères hexadécimaux, quelle que soit la taille de l'entrée. Un exemple de comportement :</p>
<pre class="pseudo"># SHA-256 : sortie de longueur fixe, tres sensible a l'entree
SHA-256("bonjour")  -> 2cf24dba5fb0a30e...  (64 caracteres hex)
SHA-256("Bonjour")  -> b1e8...             (totalement different pour 1 majuscule)
SHA-256(fichier 4Go)-> ...                 (toujours 256 bits)
# Un seul bit change dans l'entree => empreinte completement differente (effet avalanche)</pre>
<p>Des fonctions plus anciennes, <strong>MD5</strong> et <strong>SHA-1</strong>, sont aujourd'hui considérées comme cassées pour la sécurité (on sait fabriquer des collisions) : on ne les utilise plus pour garantir l'intégrité sensible.</p>
<h3>3. Les propriétés qui font la sécurité</h3>
<p>Une bonne fonction de hachage cryptographique possède trois qualités essentielles :</p>
<pre class="pseudo"># Trois proprietes cles
1. IRREVERSIBILITE : impossible de retrouver l'entree a partir de l'empreinte
                     (fonction "a sens unique")
2. EFFET AVALANCHE : un minuscule changement d'entree change tout le hash
3. RESISTANCE AUX COLLISIONS : tres difficile de trouver deux entrees
                     donnant la MEME empreinte</pre>
<div class="tip">Longueur fixe + irréversibilité + effet avalanche = un outil parfait pour <strong>détecter toute modification</strong>. Si l'empreinte recalculée ne correspond pas à l'empreinte attendue, la donnée a changé.</div>
<h3>4. À quoi ça sert : l'intégrité</h3>
<p>L'usage numéro un est la <strong>vérification d'intégrité</strong> (en anglais <em>integrity</em>) : s'assurer qu'un fichier n'a pas été altéré. Quand tu télécharges un logiciel, le site publie souvent son empreinte SHA-256 ; tu recalcules l'empreinte du fichier reçu et tu compares. Si elles diffèrent, le fichier est corrompu ou trafiqué. Autre usage majeur : le <strong>stockage des mots de passe</strong>. Un service ne stocke jamais ton mot de passe en clair, mais son empreinte (avec un « sel »). À la connexion, il hache ce que tu tapes et compare aux empreintes : il te vérifie sans jamais conserver le secret. Le hachage est aussi au cœur des <strong>signatures numériques</strong> et de TLS.</p>
<div class="warn">Le hachage garantit l'intégrité, pas la confidentialité. Une empreinte ne cache pas la donnée d'un attaquant qui teste des millions d'entrées possibles (attaque par dictionnaire). Pour les mots de passe, on ajoute un <strong>sel</strong> (valeur aléatoire) et on utilise des fonctions lentes dédiées.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Hachage = empreinte de LONGUEUR FIXE d'une donnee de taille quelconque
# Standard : SHA-256 (256 bits) ; MD5 et SHA-1 sont obsoletes/casses
# Proprietes : IRREVERSIBLE (a sens unique), effet avalanche, resistance collisions
# Ce n'est PAS du chiffrement : pas de cle, pas de dechiffrement
# Usage principal : INTEGRITE (verifier qu'un fichier n'a pas ete modifie)
# Aussi : stockage de mots de passe (avec sel), signatures, TLS</pre>`,

    { type: "qcm", q: "Que produit une fonction de hachage ?", opts: ["Une empreinte de longueur fixe", "Un fichier chiffré déchiffrable", "Une adresse IP", "Une clé publique"], a: 0, exp: "Le hachage produit une empreinte (condensé) de longueur fixe." },

    { type: "input", q: "Quelle propriété signifie qu'on ne peut pas retrouver l'entrée à partir de l'empreinte ?", a: ["irréversibilité", "irreversibilite", "irréversible", "à sens unique", "sens unique"], ph: "une propriété", exp: "L'irréversibilité (fonction à sens unique)." },
    { type: "qcm", q: "Deux fichiers différents devraient donner…", opts: ["La même empreinte", "Des empreintes différentes", "Aucune empreinte", "Une empreinte plus longue pour le plus gros"], a: 1, exp: "Des entrées différentes donnent des empreintes différentes (résistance aux collisions)." },
    { type: "vf", q: "L'empreinte SHA-256 d'un fichier de 4 Go et celle d'un mot font la même longueur.", a: true, exp: "Oui : la sortie est toujours de 256 bits, quelle que soit la taille d'entrée." },
    { type: "qcm", q: "Pourquoi un service stocke-t-il l'empreinte d'un mot de passe plutôt que le mot de passe ?", opts: ["Pour gagner de la place", "Pour vérifier sans jamais conserver le secret en clair", "Pour le chiffrer plus vite", "Pour l'envoyer par email"], a: 1, exp: "Il compare des empreintes : il te vérifie sans stocker le mot de passe en clair." },
    { type: "input", q: "Quelle valeur aléatoire ajoute-t-on avant de hacher un mot de passe ?", a: ["un sel", "sel", "le sel", "salt"], ph: "trois lettres", exp: "Le sel (salt), une valeur aléatoire, contre les attaques par dictionnaire." },
    { type: "vf", q: "Le hachage garantit la confidentialité de la donnée.", a: false, exp: "Non : il garantit l'intégrité, pas la confidentialité (ce n'est pas du chiffrement)." },
    { type: "qcm", q: "Comment vérifie-t-on qu'un logiciel téléchargé n'a pas été altéré ?", opts: ["En regardant sa taille seulement", "En recalculant son empreinte et en la comparant à celle publiée", "En changeant son extension", "En le chiffrant"], a: 1, exp: "On compare l'empreinte recalculée à l'empreinte de référence publiée." },
    { type: "qcm", q: "Comment appelle-t-on le fait que deux entrées différentes donnent la même empreinte ?", opts: ["Une avalanche", "Une collision", "Une signature", "Un sel"], a: 1, exp: "Une collision ; une bonne fonction y résiste (très difficile à provoquer)." }
  ],
  final: {

    intro: `<p>Karim télécharge un installateur depuis le site officiel d'un logiciel. La page affiche : « SHA-256 : 3a7f... ». Il veut être sûr que le fichier reçu est authentique et intact. Raisonnons avec lui.</p>`,
    questions: [
      { type: "qcm", q: "Que représente la valeur « SHA-256 : 3a7f... » publiée ?", opts: ["Le mot de passe du site", "L'empreinte attendue du fichier authentique", "L'adresse IP du serveur", "La clé privée de l'éditeur"], a: 1, exp: "C'est l'empreinte de référence du fichier légitime." },
      { type: "input", q: "Que doit faire Karim sur le fichier reçu pour vérifier ?", a: ["recalculer son empreinte", "calculer le hash", "recalculer le sha-256", "calculer son empreinte sha-256", "hacher le fichier"], ph: "une action", exp: "Il recalcule l'empreinte SHA-256 du fichier téléchargé." },
      { type: "qcm", q: "Les deux empreintes sont identiques. Conclusion ?", opts: ["Le fichier est corrompu", "Le fichier est intact et correspond à l'original", "Le fichier est chiffré", "Rien ne peut être conclu"], a: 1, exp: "Empreintes égales = contenu identique à l'original, non altéré." },
      { type: "vf", q: "Si un seul octet du fichier avait été modifié, l'empreinte serait très différente.", a: true, exp: "Oui : l'effet avalanche fait qu'un minuscule changement bouleverse le hash." },
      { type: "qcm", q: "Le hachage lui garantit-il aussi que personne n'a pu LIRE le fichier ?", opts: ["Oui, il chiffre le contenu", "Non : il garantit l'intégrité, pas la confidentialité", "Oui, grâce au sel", "Non, il ne garantit rien"], a: 1, exp: "Le hachage prouve l'intégrité, pas la confidentialité (ce n'est pas du chiffrement)." }
    ],
    solution: `<pre class="pseudo"># Verification d'integrite par Karim
1. Le site publie l'empreinte de reference : SHA-256 = 3a7f...
2. Karim telecharge le fichier
3. Il RECALCULE l'empreinte SHA-256 du fichier recu
4. Il COMPARE : 
     - identiques  -> fichier intact et authentique (OK)
     - differentes -> fichier corrompu ou trafique (ne pas installer)
# Rappel : le hachage prouve l'INTEGRITE, pas la confidentialite.</pre>
<p>Grâce à l'irréversibilité et à l'effet avalanche de SHA-256, la moindre altération se détecte immédiatement par simple comparaison d'empreintes.</p>`
  }
};
