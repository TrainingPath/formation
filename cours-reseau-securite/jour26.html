<title>Jour 26</title><link rel="stylesheet" href="style.css"></head><body>
<script>
var DAY = {
  num: 26,
  title: "Les IDS / IPS : détection d'intrusion",
  subtitle: "Poser des sentinelles qui repèrent — et parfois bloquent — les activités suspectes.",
  theory: `
<h3>1. Voir ce qui se passe sur son réseau</h3>
<p>Un pare-feu filtre selon des règles, mais il ne « comprend » pas toujours le contenu suspect qui passe par un port autorisé. Pour aller plus loin, on ajoute des sentinelles : un <strong>IDS</strong> (en anglais <em>Intrusion Detection System</em>, « système de détection d'intrusion ») observe le trafic et <strong>alerte</strong> quand il repère quelque chose d'anormal. Un <strong>IPS</strong> (<em>Intrusion Prevention System</em>) va plus loin : il peut <strong>bloquer</strong> la connexion en temps réel.</p>
<div class="tip">Mémo simple : l'IDS <strong>détecte et prévient</strong> (il lève une alarme) ; l'IPS <strong>détecte et empêche</strong> (il coupe le flux). L'IDS est un témoin, l'IPS est un vigile.</div>
<h3>2. Où les place-t-on ?</h3>
<p>Un IDS/IPS peut être <strong>réseau</strong> (NIDS/NIPS) : il analyse le trafic à un point de passage, souvent via un port miroir du switch ou en coupure. Il peut aussi être <strong>hôte</strong> (HIDS) : installé sur une machine, il surveille ses journaux, ses fichiers système et ses processus. Un IPS réseau doit être placé <em>en coupure</em> (in-line) pour pouvoir bloquer, alors qu'un IDS peut se contenter d'écouter une copie du trafic.</p>
<pre class="pseudo"># Placement typique (schema)
Internet --- [Pare-feu] --- [IPS en coupure] --- Reseau interne
                                 |
                          alertes + blocage
# IDS en ecoute : recoit une COPIE du trafic (port miroir), il alerte seulement.</pre>
<h3>3. Deux grandes familles de détection</h3>
<p>Il existe deux approches complémentaires. La détection par <strong>signatures</strong> compare le trafic à une base de motifs connus (comme un antivirus reconnaît une empreinte de virus) : très fiable sur les menaces déjà répertoriées, mais aveugle face à une attaque inédite. La détection par <strong>anomalies</strong> apprend d'abord un profil de trafic « normal », puis signale tout écart : elle peut repérer du nouveau, au prix de <strong>faux positifs</strong> (fausses alertes) plus nombreux.</p>
<pre class="pseudo"># Signatures   : "je connais ce motif d'attaque" -> precis, mais rate l'inconnu
# Anomalies    : "ceci s'ecarte du normal"       -> detecte l'inconnu, plus de faux positifs
# Beaucoup d'outils combinent les deux.</pre>
<h3>4. Deux outils de référence : Snort et Suricata</h3>
<p><strong>Snort</strong> est l'IDS/IPS open source historique, fondé sur des règles de signatures. <strong>Suricata</strong> est plus récent, <strong>multi-thread</strong> (il exploite plusieurs cœurs pour de hauts débits) et gère nativement l'analyse de nombreux protocoles. Les deux utilisent des <strong>règles</strong> décrivant quoi chercher. Voici l'esprit d'une règle (à lire, pas à apprendre par cœur) :</p>
<pre class="pseudo"># Regle Snort/Suricata (structure) :
alert tcp any any -&gt; 192.168.1.0/24 22 (msg:"Tentative SSH suspecte"; sid:1000001;)
#  action  proto src   dst-reseau  port   message d'alerte      identifiant
# Ici : alerter sur toute connexion TCP entrante vers le port 22 du reseau interne.</pre>
<div class="warn">Un IDS/IPS mal réglé génère trop d'alertes : on finit par toutes les ignorer (fatigue d'alerte). Il faut <strong>ajuster les règles</strong> (tuning) et tenir la base de signatures à jour, sinon la sentinelle devient inutile ou bloque du trafic légitime.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># IDS = detecte + ALERTE     |  IPS = detecte + BLOQUE (en coupure)
# NIDS/NIPS = reseau         |  HIDS = sur un hote (journaux, fichiers)
# Signatures = motifs connus |  Anomalies = ecart au normal (+ faux positifs)
# Outils : SNORT (historique) et SURICATA (multi-thread) -> regles a jour</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie IDS ?", opts: ["Internet Data Server", "Intrusion Detection System", "IP Domain Service", "Internal Disk Storage"], a: 1, exp: "IDS = Intrusion Detection System, système de détection d'intrusion." },
    { type: "qcm", q: "Quelle est la différence clé entre IDS et IPS ?", opts: ["L'IDS chiffre, l'IPS non", "L'IDS alerte, l'IPS peut bloquer", "L'IPS est plus lent", "Aucune différence"], a: 1, exp: "L'IDS détecte et alerte ; l'IPS détecte et peut bloquer le flux." },
    { type: "qcm", q: "La détection par signatures repose sur…", opts: ["Un apprentissage du trafic normal", "Une base de motifs d'attaques connus", "Le hasard", "Le chiffrement"], a: 1, exp: "Les signatures comparent le trafic à des motifs d'attaques déjà répertoriés." },
    { type: "qcm", q: "Un inconvénient de la détection par anomalies ?", opts: ["Elle ne détecte jamais rien", "Elle génère plus de faux positifs", "Elle ne fonctionne qu'en HTTPS", "Elle chiffre le trafic"], a: 1, exp: "En signalant tout écart au normal, elle produit davantage de fausses alertes." },
    { type: "qcm", q: "Lequel de ces outils est un IDS/IPS multi-thread récent ?", opts: ["Snort", "Suricata", "Wireshark", "Zeek"], a: 1, exp: "Suricata est multi-thread et gère de hauts débits ; Snort est l'historique." },
    { type: "qcm", q: "Pour pouvoir BLOQUER le trafic, un IPS réseau doit être…", opts: ["En écoute sur un port miroir", "Placé en coupure (in-line)", "Éteint", "Installé sur le client"], a: 1, exp: "Seul un placement en coupure permet d'interrompre le flux en temps réel." },
    { type: "vf", q: "Un IDS en écoute reçoit généralement une copie du trafic et se contente d'alerter.", a: true, exp: "Oui : via un port miroir, il observe et alerte sans couper le trafic." },
    { type: "vf", q: "La détection par signatures repère efficacement une attaque totalement inédite.", a: false, exp: "Non : sans signature connue, elle est aveugle. Les anomalies aident sur l'inconnu." },
    { type: "vf", q: "Snort est un IDS/IPS open source fondé sur des règles de signatures.", a: true, exp: "Oui : Snort est l'outil historique à base de règles." },
    { type: "vf", q: "Trop d'alertes mal réglées peuvent conduire à ignorer les vraies alertes.", a: true, exp: "Oui : c'est la fatigue d'alerte ; d'où l'importance du réglage (tuning)." },
    { type: "input", q: "Comment appelle-t-on une fausse alerte levée à tort par un système de détection ?", a: ["faux positif", "un faux positif", "faux-positif"], ph: "deux mots", exp: "Un faux positif : une alerte déclenchée alors qu'il n'y a pas de vraie menace." },
    { type: "input", q: "Quel sigle désigne un IDS/IPS installé sur une machine (surveille journaux et fichiers) ?", a: ["hids"], ph: "4 lettres", exp: "HIDS = Host Intrusion Detection System, orienté hôte." },
    { type: "input", q: "Quel sigle désigne le système qui, en plus de détecter, peut bloquer l'intrusion ?", a: ["ips"], ph: "3 lettres", exp: "IPS = Intrusion Prevention System." },
    { type: "input", q: "Cite l'IDS/IPS open source historique fondé sur des règles.", a: ["snort"], ph: "un nom", exp: "Snort est l'IDS/IPS de référence historique." },
    { type: "input", q: "Comment nomme-t-on l'ajustement fin des règles pour réduire les fausses alertes (terme courant) ?", a: ["tuning", "le tuning", "reglage", "ajustement"], ph: "un mot", exp: "Le tuning : on affine les règles pour limiter les faux positifs." }
  ],
  final: {
    title: "Exercice final — Déployer une sentinelle",
    intro: `<p>Dans ton labo, tu veux surveiller le trafic vers un serveur interne. Tu hésites entre écouter (alerter) et couper (bloquer), puis entre signatures et anomalies. Décidons ensemble.</p>`,
    questions: [
      { type: "qcm", q: "Tu veux d'abord seulement OBSERVER sans risquer de couper du trafic légitime. Tu déploies…", opts: ["Un IPS en coupure", "Un IDS en écoute", "Un pare-feu qui bloque tout", "Rien"], a: 1, exp: "Un IDS en écoute alerte sans interrompre : idéal pour observer d'abord." },
      { type: "input", q: "Pour pouvoir plus tard BLOQUER en temps réel, quel type de système faut-il (sigle) ?", a: ["ips"], ph: "3 lettres", exp: "Un IPS, placé en coupure, peut bloquer le flux." },
      { type: "qcm", q: "Tu choisis Suricata plutôt que Snort surtout pour…", opts: ["Sa gestion multi-thread des hauts débits", "Sa capacité à chiffrer", "Sa gestion intégrée des VPN", "Son antivirus intégré"], a: 0, exp: "Suricata est multi-thread, adapté aux débits élevés." },
      { type: "vf", q: "Activer la détection par anomalies risque d'augmenter le nombre de faux positifs.", a: true, exp: "Oui : signaler tout écart au normal multiplie les fausses alertes." },
      { type: "qcm", q: "Après quelques jours, l'IDS crie trop souvent. La bonne réaction est de…", opts: ["Tout désactiver", "Ajuster (tuner) les règles et mettre à jour les signatures", "Ignorer définitivement les alertes", "Débrancher le réseau"], a: 1, exp: "On affine les règles et on tient les signatures à jour pour rester efficace." }
    ],
    solution: `<pre class="pseudo"># Plan de deploiement raisonne :
1) IDS en ECOUTE (port miroir) -> observer, alerter sans couper
2) Analyser les alertes, TUNER les regles (moins de faux positifs)
3) Passer un IPS en COUPURE pour bloquer les menaces confirmees
# Signatures (connu) + anomalies (inconnu), base a jour. Outil : Snort / Suricata.</pre>
<p>Une bonne sentinelle est réglée, à jour et surveillée. Demain : sécuriser le WiFi (WPA2/WPA3).</p>`
  }
};
</script>
