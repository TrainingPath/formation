var DAY = {
  num: 15,
  title: "TLS / SSL en détail",
  subtitle: "La poignée de main qui transforme un canal ouvert en tunnel chiffré.",
  theory: `
<h3>1. Ce que TLS assemble</h3>
<p><strong>TLS</strong> (en anglais <em>Transport Layer Security</em>) est le protocole qui sécurise les communications sur Internet. Son ancêtre s'appelait <strong>SSL</strong> (<em>Secure Sockets Layer</em>) ; on dit encore « SSL » par habitude, mais SSL est obsolète : aujourd'hui on utilise TLS (versions 1.2 et 1.3). TLS ne réinvente rien : il <strong>assemble</strong> les trois briques des leçons précédentes. L'<strong>asymétrique</strong> (RSA/ECC) et les certificats servent à s'authentifier et à établir une clé ; le <strong>symétrique</strong> (AES) chiffre ensuite tout le trafic ; le <strong>hachage</strong> (SHA-256) garantit l'intégrité. TLS apporte donc trois garanties : <strong>confidentialité</strong>, <strong>intégrité</strong> et <strong>authentification</strong> du serveur.</p>
<h3>2. La négociation (handshake)</h3>
<p>Avant d'échanger des données, client et serveur exécutent une <strong>poignée de main</strong> (en anglais <em>handshake</em>) : une courte négociation qui met tout en place. Les étapes clés (schéma simplifié) :</p>
<pre class="pseudo"># Handshake TLS (vue simplifiee)
1. ClientHello  : le client propose ses versions TLS et ses algorithmes
                  (suites de chiffrement) + un alea (nombre aleatoire)
2. ServerHello  : le serveur choisit la version et la suite, envoie son alea
3. Certificat   : le serveur envoie son certificat X.509 (avec sa cle publique)
                  -> le client verifie la chaine de confiance jusqu'a une racine
4. Echange de cles : client et serveur etablissent un SECRET commun
                  (ex: Diffie-Hellman ephemere) -> d'ou une CLE DE SESSION symetrique
5. Finished     : les deux confirment ; a partir d'ici tout est chiffre en AES</pre>
<h3>3. Le cœur : négocier une clé de session</h3>
<p>Le but central du handshake est de faire naître, des deux côtés, une même <strong>clé de session</strong> symétrique, sans qu'un espion qui écoute puisse la reconstituer. On y parvient grâce à l'asymétrique (échange <strong>Diffie-Hellman</strong>, souvent en version <strong>éphémère</strong>). Une fois cette clé partagée, on bascule sur du <strong>chiffrement symétrique (AES)</strong> : rapide, il chiffre l'intégralité des données de la session. C'est le <strong>chiffrement hybride</strong> vu au jour 12 : l'asymétrique pour établir la clé, le symétrique pour le débit.</p>
<div class="tip">Résumé de la logique : asymétrique + certificat pour <strong>s'authentifier et convenir d'une clé</strong>, puis symétrique (AES) pour <strong>chiffrer vite tout le reste</strong>. Le hachage vérifie au passage que rien n'a été altéré.</div>
<h3>4. Suites de chiffrement et confidentialité persistante</h3>
<p>Une <strong>suite de chiffrement</strong> (en anglais <em>cipher suite</em>) est la combinaison d'algorithmes retenue : méthode d'échange de clé, algorithme symétrique (ex. AES-GCM), fonction de hachage (ex. SHA-256). Les échanges <strong>éphémères</strong> apportent la <strong>confidentialité persistante</strong> (en anglais <em>forward secrecy</em>) : la clé de session est jetée après usage, si bien qu'une clé privée volée plus tard ne permet pas de déchiffrer les anciennes conversations. <strong>TLS 1.3</strong> a simplifié et accéléré le handshake (moins d'allers-retours) et supprimé les vieux algorithmes faibles.</p>
<div class="warn">TLS authentifie le serveur (via son certificat), mais si l'utilisateur ignore une alerte de certificat, un attaquant en homme du milieu peut établir DEUX tunnels TLS et tout lire. La sécurité de TLS dépend donc aussi de la validité du certificat vérifiée au jour 14.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># TLS (ex-SSL) = securise les communications : confidentialite + integrite + authentification
# Handshake : ClientHello -> ServerHello -> Certificat -> echange de cles -> Finished
# But central : creer une CLE DE SESSION symetrique commune, sans l'exposer
# Ensuite : tout le trafic est chiffre en SYMETRIQUE (AES), rapide
# Chiffrement hybride : asymetrique pour la cle, symetrique pour les donnees
# Ephemere = forward secrecy ; TLS 1.3 = plus simple, plus rapide, plus sur</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie TLS ?", opts: ["Total Link System", "Transport Layer Security", "Trusted Local Server", "Transfer List Service"], a: 1, exp: "TLS = Transport Layer Security, le protocole qui sécurise les communications." },
    { type: "vf", q: "SSL est la version moderne et recommandée, TLS étant obsolète.", a: false, exp: "C'est l'inverse : SSL est obsolète ; on utilise TLS (1.2 et 1.3)." },

    { type: "input", q: "Quel type de chiffrement (rapide) protège les données après le handshake ?", a: ["symétrique", "symetrique", "aes", "chiffrement symétrique"], ph: "un type / un algo", exp: "Une fois la clé de session établie, le symétrique (AES) chiffre tout le trafic." },
    { type: "qcm", q: "Quel est le but central du handshake ?", opts: ["Choisir la langue d'affichage du site", "Établir une clé de session symétrique commune sans l'exposer", "Envoyer la clé privée du serveur", "Compresser les données"], a: 1, exp: "Le handshake fait naître une clé de session symétrique partagée, à l'abri des écoutes." },
    { type: "vf", q: "Le serveur envoie son certificat X.509 pour être authentifié pendant le handshake.", a: true, exp: "Oui : le client vérifie la chaîne de confiance jusqu'à une racine." },
    { type: "input", q: "Comment nomme-t-on la combinaison d'algorithmes négociée (échange, chiffrement, hachage) ? (deux mots)", a: ["suite de chiffrement", "cipher suite", "la suite de chiffrement", "suites de chiffrement"], ph: "deux mots", exp: "La suite de chiffrement (cipher suite) regroupe les algorithmes retenus." },
    { type: "qcm", q: "Quel message clôt la négociation, après quoi tout est chiffré ?", opts: ["ClientHello", "ServerHello", "Finished", "Reset"], a: 2, exp: "Le message Finished confirme ; ensuite le trafic est chiffré en AES." },
    { type: "vf", q: "TLS combine chiffrement asymétrique et symétrique (chiffrement hybride).", a: true, exp: "Oui : asymétrique pour établir la clé, symétrique (AES) pour les données." },
    { type: "input", q: "Comment nomme-t-on la propriété où une clé privée volée plus tard ne déchiffre pas les anciennes sessions ? (français ou anglais)", a: ["forward secrecy", "confidentialité persistante", "confidentialite persistante", "perfect forward secrecy"], ph: "une propriété", exp: "La confidentialité persistante (forward secrecy), apportée par les échanges éphémères." },
    { type: "qcm", q: "Quel apport principal de TLS 1.3 ?", opts: ["Il ralentit tout", "Handshake simplifié/plus rapide et suppression des algos faibles", "Il supprime le chiffrement", "Il impose SSL"], a: 1, exp: "TLS 1.3 réduit les allers-retours et retire les vieux algorithmes vulnérables." },
    { type: "vf", q: "Ignorer une alerte de certificat peut permettre une attaque de l'homme du milieu malgré TLS.", a: true, exp: "Oui : la sécurité de TLS dépend de la validité du certificat vérifiée par l'utilisateur/navigateur." },
    { type: "qcm", q: "Quelle brique garantit que les données n'ont pas été altérées en transit ?", opts: ["Le hachage (ex. SHA-256)", "Le DHCP", "Le routage", "La compression"], a: 0, exp: "Le hachage assure l'intégrité des données échangées dans la session." }
  ],
  final: {
    title: "Exercice final — Décomposer une connexion sécurisée",
    intro: `<p>Le navigateur de Yanis ouvre une connexion TLS vers un serveur. On veut identifier, étape par étape, ce qui se passe pendant le handshake et pourquoi la suite est à la fois sûre et rapide.</p>`,
    questions: [
      { type: "input", q: "Quel message le client envoie-t-il en premier ?", a: ["clienthello", "client hello"], ph: "un mot", exp: "ClientHello : il propose versions et suites de chiffrement, avec un aléa." },
      { type: "qcm", q: "Que fait le serveur juste après avoir répondu (ServerHello) ?", opts: ["Il coupe la connexion", "Il envoie son certificat X.509 pour prouver son identité", "Il envoie sa clé privée", "Il demande le mot de passe"], a: 1, exp: "Il transmet son certificat ; le client vérifie la chaîne de confiance." },
      { type: "qcm", q: "Quel est l'objectif de l'échange de clés du handshake ?", opts: ["Partager la clé privée du serveur", "Établir une clé de session symétrique commune sans l'exposer", "Choisir la langue du site", "Compresser la page"], a: 1, exp: "On établit une clé de session symétrique, cœur du reste de la communication." },
      { type: "input", q: "Une fois le handshake fini, quel algorithme symétrique chiffre typiquement le trafic ?", a: ["aes", "aes-gcm", "aes-256"], ph: "un algo", exp: "AES (souvent AES-GCM) chiffre rapidement l'ensemble des données de session." },
      { type: "vf", q: "Grâce à l'échange éphémère, un vol futur de la clé privée ne révèle pas cette session passée.", a: true, exp: "Oui : c'est la confidentialité persistante (forward secrecy)." }
    ],
    solution: `<pre class="pseudo"># Handshake TLS de Yanis, decompose
ClientHello  -> versions + suites de chiffrement proposees + alea client
ServerHello  -> version et suite choisies + alea serveur
Certificat   -> certificat X.509 du serveur (verif. chaine de confiance)
Echange cles -> Diffie-Hellman (ephemere) => CLE DE SESSION symetrique commune
Finished     -> confirmation des deux cotes
=> Ensuite : tout le trafic chiffre en AES (rapide)
# Asymetrique + certificat pour s'authentifier et convenir de la cle ;
# symetrique (AES) pour chiffrer vite ; hachage pour l'integrite.</pre>
<p>Le handshake établit confiance et clé ; le symétrique assure le débit. C'est ce mécanisme hybride qui rend HTTPS à la fois sûr et utilisable au quotidien.</p>`
  }
};
