<script>
var DAY = {
  num: 17,
  title: "Le VPN : le principe",
  subtitle: "Un tunnel chiffré pour rester confidentiel sur un réseau public.",
  theory: `
<h3>1. Le problème : un réseau public n'est pas privé</h3>
<p>Quand tes données traversent Internet, elles passent par une longue chaîne d'équipements que tu ne contrôles pas : le Wi-Fi du café, le routeur du fournisseur d'accès, des dizaines de routeurs intermédiaires. Chacun peut, en théorie, <strong>lire</strong> ou <strong>modifier</strong> ce qui passe si le trafic n'est pas protégé. Un <strong>VPN</strong> (en anglais <em>Virtual Private Network</em>, « réseau privé virtuel ») résout ce problème : il crée un <strong>tunnel chiffré</strong> entre ton appareil et un point de confiance, de sorte que le réseau public devient illisible pour les curieux.</p>
<p>Analogie : envoyer une carte postale, c'est écrire en clair — le facteur peut tout lire. Un VPN, c'est glisser la carte dans une enveloppe blindée et opaque : le facteur voit qu'un colis circule, mais pas son contenu.</p>
<h3>2. Ce que le VPN garantit (et ce qu'il ne garantit pas)</h3>
<p>Un bon VPN apporte trois propriétés. La <strong>confidentialité</strong> (le contenu est chiffré, illisible pour un tiers). L'<strong>intégrité</strong> (toute altération en route est détectée). L'<strong>authentification</strong> (les deux extrémités prouvent leur identité, ce qui empêche un imposteur de se faire passer pour le serveur). En revanche, un VPN ne rend pas anonyme : ton fournisseur de VPN, lui, voit tout. Il ne protège pas non plus contre un logiciel malveillant déjà présent sur ta machine.</p>
<div class="tip">Retiens la formule « CIA » de la sécurité : <strong>C</strong>onfidentialité, <strong>I</strong>ntégrité, <strong>A</strong>uthentification. Un VPN sérieux vise les trois, pas seulement le chiffrement.</div>
<h3>3. Comment marche le tunnel : l'encapsulation</h3>
<p>Le cœur du VPN est l'<strong>encapsulation</strong> : le paquet d'origine (avec sa vraie adresse IP de destination) est chiffré, puis placé <em>à l'intérieur</em> d'un nouveau paquet dont l'en-tête vise le serveur VPN. On dit qu'un paquet « voyage dans » un autre. À l'arrivée, le serveur ouvre l'enveloppe, déchiffre, et transmet le paquet d'origine vers sa vraie destination.</p>
<pre class="pseudo"># Sans VPN (paquet en clair sur Internet) :
[ IP: moi -&gt; site ][ TCP ][ donnees LISIBLES ]

# Avec VPN (encapsulation + chiffrement) :
[ IP: moi -&gt; serveurVPN ][ enveloppe VPN ][ CHIFFRE: IP moi-&gt;site + TCP + donnees ]
#        en-tete visible          contenu illisible pour le reseau public</pre>
<h3>4. Chiffrement symétrique et échange de clés</h3>
<p>Le chiffrement du tunnel utilise une <strong>clé secrète</strong> partagée par les deux extrémités (chiffrement <em>symétrique</em>, rapide, ex. AES). Problème : comment se mettre d'accord sur cette clé à travers un réseau hostile sans qu'un espion la capte ? Grâce à un <strong>échange de clés</strong> (souvent <em>Diffie-Hellman</em>), qui permet à deux parties de calculer une même clé secrète sans jamais la transmettre en clair. C'est la magie mathématique qui rend le VPN possible.</p>
<div class="warn">Un VPN « gratuit » douteux peut être pire que pas de VPN : puisqu'il déchiffre tout ton trafic à sa sortie, un opérateur malhonnête pourrait le lire ou le revendre. La confiance dans le fournisseur (ou dans TON propre serveur) est essentielle.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># VPN = Virtual Private Network = tunnel chiffre sur reseau public
# Buts : Confidentialite + Integrite + Authentification (CIA)
# Mecanisme cle : ENCAPSULATION (paquet chiffre dans un autre paquet)
# Chiffrement symetrique (AES) + echange de cles (Diffie-Hellman)
# Limite : le fournisseur VPN voit le trafic ; ce n'est PAS l'anonymat</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie l'acronyme VPN ?", opts: ["Very Private Network", "Virtual Private Network", "Verified Protocol Node", "Virtual Public Node"], a: 1, exp: "VPN = Virtual Private Network, réseau privé virtuel." },
    { type: "qcm", q: "Quel est le rôle principal d'un VPN sur un réseau public ?", opts: ["Accélérer la connexion", "Créer un tunnel chiffré confidentiel", "Bloquer la publicité", "Augmenter le débit Wi-Fi"], a: 1, exp: "Le VPN chiffre le trafic dans un tunnel pour le rendre illisible aux tiers." },
    { type: "vf", q: "Sur un réseau public non protégé, les équipements intermédiaires peuvent en théorie lire le trafic en clair.", a: true, exp: "Oui, d'où l'intérêt de chiffrer le trafic sensible." },
    { type: "input", q: "Quel mécanisme place le paquet d'origine chiffré à l'intérieur d'un nouveau paquet ? (un mot)", a: ["encapsulation", "l'encapsulation"], ph: "un mot", exp: "L'encapsulation : un paquet voyage à l'intérieur d'un autre." },
    { type: "qcm", q: "Parmi ces propriétés, laquelle n'est PAS un objectif de sécurité classique d'un VPN ?", opts: ["Confidentialité", "Intégrité", "Anonymat total garanti", "Authentification"], a: 2, exp: "Un VPN ne garantit pas l'anonymat : le fournisseur voit le trafic." },
    { type: "vf", q: "Un VPN authentifie les deux extrémités pour éviter qu'un imposteur se fasse passer pour le serveur.", a: true, exp: "L'authentification empêche l'usurpation d'identité du point de sortie." },
    { type: "input", q: "Quelle famille d'algorithme (symétrique) rapide chiffre souvent le contenu du tunnel ? (donne son sigle de 3 lettres)", a: ["aes"], ph: "3 lettres", exp: "AES est l'algorithme symétrique de référence." },
    { type: "qcm", q: "Pourquoi utilise-t-on un échange de clés type Diffie-Hellman ?", opts: ["Pour compresser les données", "Pour se mettre d'accord sur une clé secrète sans la transmettre en clair", "Pour attribuer les adresses IP", "Pour accélérer le routage"], a: 1, exp: "Diffie-Hellman calcule une clé commune sans jamais l'envoyer en clair." },
    { type: "qcm", q: "Dans l'en-tête visible d'un paquet VPN, quelle destination apparaît ?", opts: ["Le site web final", "Le serveur VPN", "Aucune destination", "L'adresse MAC du site"], a: 1, exp: "L'en-tête externe vise le serveur VPN ; la vraie destination est chiffrée à l'intérieur." },
    { type: "vf", q: "Un VPN protège efficacement contre un logiciel malveillant déjà installé sur ta machine.", a: false, exp: "Non : le VPN chiffre le transport, il ne nettoie pas un poste déjà compromis." },
    { type: "input", q: "Cite en un mot la propriété qui garantit que le contenu reste illisible pour un tiers.", a: ["confidentialite", "la confidentialite"], ph: "un mot", exp: "La confidentialité : le contenu est chiffré." },
    { type: "qcm", q: "Que voit exactement le Wi-Fi d'un café quand tu utilises un VPN ?", opts: ["Le contenu de tes pages", "Un trafic chiffré vers le serveur VPN", "Tes mots de passe en clair", "Rien du tout, aucun paquet"], a: 1, exp: "Il voit qu'un tunnel chiffré part vers le serveur VPN, sans en lire le contenu." },
    { type: "vf", q: "Le chiffrement symétrique utilise la même clé pour chiffrer et déchiffrer.", a: true, exp: "Oui : les deux extrémités partagent la même clé secrète." },
    { type: "qcm", q: "Pourquoi un VPN gratuit douteux peut-il être risqué ?", opts: ["Il est trop lent", "L'opérateur déchiffre tout le trafic en sortie et pourrait l'exploiter", "Il consomme trop de batterie", "Il n'a pas d'adresse IP"], a: 1, exp: "À la sortie du tunnel, l'opérateur voit le trafic en clair : la confiance est cruciale." },
    { type: "input", q: "Formule mnémotechnique en 3 lettres résumant Confidentialité, Intégrité, Authentification.", a: ["cia"], ph: "3 lettres", exp: "CIA : Confidentialité, Intégrité, Authentification." }
  ],
  final: {
    title: "Exercice final — Café, Wi-Fi ouvert et VPN",
    intro: `<p>Sofia travaille depuis un café. Le Wi-Fi est ouvert (sans mot de passe). Elle active son VPN d'entreprise avant de consulter la messagerie interne. Analysons ce qui se passe.</p>`,
    questions: [
      { type: "qcm", q: "Sans VPN, quel est le principal risque sur ce Wi-Fi ouvert ?", opts: ["Le débit est bridé", "Un tiers sur le réseau peut lire le trafic non chiffré", "Le VPN se désactive", "L'IP change"], a: 1, exp: "Un réseau ouvert facilite l'écoute du trafic non protégé." },
      { type: "vf", q: "Une fois le VPN actif, le point d'accès Wi-Fi voit le contenu des e-mails de Sofia.", a: false, exp: "Non : il ne voit qu'un tunnel chiffré vers le serveur VPN." },
      { type: "input", q: "Quel mécanisme met le paquet vers la messagerie à l'intérieur d'un paquet vers le serveur VPN ? (un mot)", a: ["encapsulation", "l'encapsulation"], ph: "un mot", exp: "L'encapsulation réalise le tunnel." },
      { type: "qcm", q: "Qui, dans cette chaîne, peut légitimement déchiffrer le trafic de Sofia ?", opts: ["Le café", "Le serveur VPN de l'entreprise", "N'importe quel client Wi-Fi", "Le fabricant du routeur"], a: 1, exp: "Seule l'extrémité de confiance (serveur VPN) déchiffre le tunnel." },
      { type: "vf", q: "Le VPN rend Sofia totalement anonyme vis-à-vis de son entreprise.", a: false, exp: "Non : le serveur VPN de l'entreprise voit et journalise potentiellement son trafic." }
    ],
    solution: `<pre class="pseudo"># Wi-Fi ouvert = reseau public non fiable.
# Le VPN cree un tunnel chiffre : Confidentialite + Integrite + Authentification.
# Le cafe ne voit qu'un flux chiffre -&gt; serveurVPN (pas le contenu).
# Seul le serveur VPN de confiance dechiffre puis relaie vers la messagerie.
# VPN != anonymat : l'extremite de sortie voit le trafic.</pre>
<p>Sofia a bien protégé la confidentialité de sa session. Demain : comment relier durablement deux sites entiers avec IPsec.</p>`
  }
};
