  title: "Les menaces et les attaquants",

  theory: `
<h3>1. Trois mots à distinguer : menace, vulnérabilité, risque</h3>
<p>On confond souvent ces trois notions. Une <strong>menace</strong> (en anglais <em>threat</em>) est un danger potentiel : un incendie, un pirate, une panne. Une <strong>vulnérabilité</strong> (en anglais <em>vulnerability</em>) est une faiblesse qui peut être exploitée : un mot de passe faible, un logiciel non mis à jour. Le <strong>risque</strong> (en anglais <em>risk</em>) est la probabilité qu'une menace exploite une vulnérabilité, multipliée par l'impact. Pas de vulnérabilité, pas de risque ; une menace seule, sans faiblesse à exploiter, reste sans effet.</p>
<pre class="pseudo"># Formule mentale :
# RISQUE  =  MENACE  x  VULNERABILITE  x  IMPACT
# Reduire l'un des trois reduit le risque.</pre>
<h3>2. Les types de menaces</h3>
<p>Les menaces ne sont pas toutes humaines ni toutes malveillantes. On les classe souvent ainsi :</p>
<pre class="pseudo"># Menaces HUMAINES intentionnelles : intrusion, vol de donnees, sabotage.
# Menaces HUMAINES accidentelles   : erreur de manipulation, mauvaise config.
# Menaces ENVIRONNEMENTALES         : incendie, inondation, coupure de courant.
# Menaces TECHNIQUES                : panne materielle, bug logiciel.</pre>
<p>Une bonne sécurité ne se concentre pas uniquement sur le « pirate » : une erreur humaine ou une panne peut causer autant de dégâts qu'une attaque.</p>
<h3>3. Les profils d'attaquants</h3>
<p>Quand la menace est humaine et malveillante, elle a un visage et un motif. On distingue plusieurs <strong>profils</strong> :</p>
<p>Le <strong>script kiddie</strong> : peu compétent, il réutilise des outils tout faits, souvent par jeu ou vantardise. L'<strong>hacktiviste</strong> : motivé par une cause idéologique. Le <strong>cybercriminel</strong> : motivé par l'argent (rançongiciels, fraude). La <strong>menace interne</strong> (en anglais <em>insider</em>) : un employé, actuel ou ancien, qui abuse de ses accès légitimes. Enfin, les groupes très organisés, parfois soutenus par un État, désignés par le sigle <strong>APT</strong> (<em>Advanced Persistent Threat</em>, « menace persistante avancée »), patients et bien financés.</p>
<div class="tip">Ne sous-estimez jamais la <strong>menace interne</strong> : un employé a déjà un accès légitime, ce qui contourne beaucoup de défenses périmétriques. D'où l'intérêt du principe du moindre privilège, que nous verrons plus tard.</div>
<h3>4. Les vecteurs d'attaque</h3>
<p>Le <strong>vecteur d'attaque</strong> (en anglais <em>attack vector</em>) est le <strong>chemin</strong> par lequel une menace atteint sa cible. Les plus courants :</p>
<pre class="pseudo"># Hameconnage (phishing) : un courriel piege pousse a cliquer / donner un mot de passe.
# Logiciel malveillant (malware) : virus, ver, cheval de Troie, rancongiciel.
# Exploitation d'une faille : un service non a jour laisse entrer.
# Mots de passe faibles / reutilises : devines ou testes en masse.
# Ingenierie sociale : manipuler une personne plutot qu'une machine.</pre>
<p>Le vecteur le plus fréquent n'est pas technique mais <strong>humain</strong> : l'hameçonnage et l'ingénierie sociale visent la personne, pas la machine. Aucun pare-feu n'empêche un utilisateur de taper son mot de passe sur un faux site.</p>
<div class="warn">Piège : croire qu'une attaque est forcément spectaculaire. La plupart commencent par un simple courriel bien tourné ou un mot de passe réutilisé. La sophistication vient après, une fois le premier pied dans la porte.</div>
<h3>5. Relier menace, motif et parade</h3>
<p>Comprendre le profil et le motif aide à anticiper. Un cybercriminel cherche un gain rapide : il vise large et automatise. Un APT vise une cible précise et reste discret longtemps. Un insider abuse d'un accès existant. À chaque profil correspondent des parades différentes : sensibilisation contre l'hameçonnage, mises à jour contre l'exploitation de failles, surveillance des accès contre l'insider.</p>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># MENACE = danger potentiel ; VULNERABILITE = faiblesse ; RISQUE = menace x vuln x impact.

    { type: "qcm", q: "Une inondation qui détruit un serveur est une menace de type…", opts: ["Humaine intentionnelle", "Environnementale", "Technique logicielle", "Ingénierie sociale"], a: 1, exp: "L'inondation est une menace environnementale, ni humaine ni logicielle." },
    { type: "vf", q: "La plupart des attaques commencent par un procédé simple (courriel, mot de passe réutilisé) avant toute sophistication.", a: true, exp: "Oui : la sophistication vient souvent après le premier accès obtenu simplement." },
    { type: "qcm", q: "Quelle parade correspond le mieux à la menace de l'hameçonnage ?", opts: ["Ajouter des serveurs", "Sensibiliser les utilisateurs", "Chiffrer les disques", "Augmenter la bande passante"], a: 1, exp: "L'hameçonnage vise l'humain : la sensibilisation est la parade la plus adaptée." },
    { type: "input", q: "Une erreur de manipulation d'un employé qui efface un fichier est une menace humaine… (un mot)", a: ["accidentelle", "accidentel", "involontaire"], ph: "un mot", exp: "C'est une menace humaine accidentelle (non intentionnelle), mais tout aussi coûteuse." },
    { type: "qcm", q: "Pourquoi la menace interne est-elle particulièrement redoutable ?", opts: ["Elle est toujours étrangère", "L'employé a déjà un accès légitime qui contourne les défenses périmétriques", "Elle ne cause jamais de dégâts", "Elle est facile à bloquer par un pare-feu"], a: 1, exp: "Un insider dispose déjà d'accès autorisés, ce qui rend beaucoup de défenses de périmètre inopérantes." }
  ],

      { type: "qcm", q: "Quelle parade principale réduit ce type de risque ?", opts: ["Débrancher tous les serveurs", "Sensibiliser les employés et renforcer l'authentification", "Acheter plus de bande passante", "Supprimer la messagerie"], a: 1, exp: "La sensibilisation et une authentification renforcée (ex : second facteur) réduisent ce risque." }
    ],
    solution: `<pre class="pseudo"># Analyse de l'incident :
# Menace        : cybercriminel motive par l'argent.
# Vecteur       : hameconnage (courriel piege) + ingenierie sociale.

# Rappel : le vecteur le plus courant est HUMAIN, pas technique.</pre>
<p>Identifier menace, vecteur et vulnérabilité transforme un incident subi en leçon exploitable. Demain, nous verrons comment réduire l'exposition globale : surface d'attaque et défense en profondeur.</p>`
