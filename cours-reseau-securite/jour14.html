var DAY = {
  num: 14,
  title: "Certificats et autorités (PKI)",
  subtitle: "Comment prouver qu'une clé publique appartient bien à qui elle prétend.",
  theory: `
<h3>1. Le trou dans le chiffrement asymétrique</h3>
<p>Le chiffrement asymétrique repose sur les clés publiques. Mais une question demeure : quand tu récupères une clé publique censée être celle de <strong>ta-banque.com</strong>, comment être sûr qu'elle appartient vraiment à ta banque, et pas à un attaquant qui s'est glissé au milieu ? Sans preuve, un pirate pourrait te fournir SA clé publique en se faisant passer pour la banque : c'est l'attaque de <strong>l'homme du milieu</strong> (en anglais <em>man-in-the-middle</em>). Il faut donc <strong>relier une clé publique à une identité</strong> de manière vérifiable.</p>
<h3>2. Le certificat numérique (X.509)</h3>
<p>La réponse est le <strong>certificat numérique</strong>, au format standard <strong>X.509</strong>. C'est une sorte de <strong>carte d'identité électronique</strong> qui associe une identité à une clé publique. Un certificat contient notamment :</p>
<pre class="pseudo"># Contenu d'un certificat X.509 (simplifie)
Sujet (Subject)      : a qui il appartient (ex: ta-banque.com)
Cle publique         : la cle publique du sujet
Emetteur (Issuer)    : l'autorite qui a delivre le certificat
Validite             : dates de debut et d'expiration
Numero de serie      : identifiant unique
Signature de la CA   : preuve d'authenticite apposee par l'autorite</pre>
<p>L'élément décisif est la dernière ligne : le certificat est <strong>signé</strong> par une autorité de confiance. Cette signature garantit que le contenu n'a pas été modifié et qu'une entité reconnue atteste bien du lien identité ↔ clé publique.</p>
<h3>3. L'autorité de certification (CA)</h3>
<p>Une <strong>autorité de certification</strong> (en anglais <em>Certificate Authority</em>, <strong>CA</strong>) est un tiers de confiance qui vérifie l'identité d'un demandeur, puis <strong>signe</strong> son certificat avec sa propre clé privée. Des noms connus : Let's Encrypt, DigiCert, GlobalSign. Comment ta signature est-elle vérifiable par tout le monde ? Parce que ton système d'exploitation et ton navigateur contiennent d'avance une liste de <strong>CA racines de confiance</strong> (magasin de certificats). Si un certificat remonte à l'une d'elles, il est accepté.</p>
<div class="tip">Une CA ne connaît pas ta clé privée : elle atteste seulement de ton identité et signe ta clé publique. La confiance ne vient pas de la clé elle-même, mais de la <strong>signature d'une autorité reconnue</strong>.</div>
<h3>4. La chaîne de confiance (PKI)</h3>
<p>Tout cet écosystème s'appelle la <strong>PKI</strong> (en anglais <em>Public Key Infrastructure</em>, « infrastructure à clés publiques »). Les certificats forment une <strong>chaîne de confiance</strong> : ta banque a un certificat signé par une CA intermédiaire, elle-même signée par une <strong>CA racine</strong> (en anglais <em>root CA</em>). La racine se signe elle-même et est présente dans ton magasin de confiance.</p>
<pre class="pseudo"># Chaine de confiance (de la racine jusqu'au site)
CA racine (root, auto-signee, dans ton magasin de confiance)
   |  signe
CA intermediaire
   |  signe
Certificat du site (ta-banque.com)
# Le navigateur verifie chaque signature en remontant jusqu'a une racine connue.</pre>
<div class="warn">Si un certificat est expiré, si le nom ne correspond pas au site, ou si aucune racine connue n'est trouvée, le navigateur affiche une alerte. Ne l'ignore jamais à la légère : c'est peut-être une tentative d'homme du milieu. Une CA compromise ou une clé privée volée peut aussi être révoquée (listes CRL / OCSP).</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Probleme : prouver qu'une cle publique appartient bien a telle identite
# Certificat X.509 = carte d'identite : identite + cle publique + signature CA
# CA (autorite de certification) = tiers de confiance qui verifie et SIGNE
# PKI = tout l'ecosysteme ; chaine de confiance : site <- intermediaire <- racine
# Le navigateur/OS contient les CA RACINES de confiance d'avance
# Empeche l'homme du milieu ; alertes si expire, mauvais nom, racine inconnue</pre>`,
  exercises: [
    { type: "qcm", q: "À quoi sert un certificat numérique ?", opts: ["À chiffrer un disque", "À relier de façon vérifiable une identité à une clé publique", "À attribuer une adresse IP", "À compresser des fichiers"], a: 1, exp: "Le certificat associe une identité à une clé publique, attestée par une signature." },
    { type: "input", q: "Quel est le format standard des certificats numériques ?", a: ["x.509", "x509", "x 509"], ph: "un format", exp: "Le format X.509 est le standard des certificats." },

    { type: "input", q: "Comment appelle-t-on l'autorité tout en haut de la hiérarchie, auto-signée ? (deux mots)", a: ["ca racine", "racine", "root ca", "autorité racine", "la ca racine"], ph: "deux mots", exp: "La CA racine (root CA) : auto-signée et présente dans les magasins de confiance." },
    { type: "qcm", q: "Que contient un certificat X.509 ?", opts: ["Uniquement un mot de passe", "L'identité du sujet, sa clé publique, l'émetteur, la validité et la signature de la CA", "Seulement une adresse IP", "La clé privée du site"], a: 1, exp: "Il contient le sujet, la clé publique, l'émetteur, la validité et la signature." },
    { type: "vf", q: "Un certificat contient la clé privée du site.", a: false, exp: "Non, jamais : il contient la clé PUBLIQUE ; la clé privée reste secrète." },
    { type: "qcm", q: "Cite un exemple d'autorité de certification réelle.", opts: ["Let's Encrypt", "Wikipedia", "Windows Defender", "Google Maps"], a: 0, exp: "Let's Encrypt, DigiCert, GlobalSign sont des CA connues." },
    { type: "vf", q: "Un certificat expiré ou dont le nom ne correspond pas au site déclenche une alerte.", a: true, exp: "Oui : ces anomalies alertent l'utilisateur, il ne faut pas les ignorer à la légère." },
    { type: "input", q: "Comment nomme-t-on la suite de certificats qui relie un site jusqu'à une racine ? (deux/trois mots)", a: ["chaîne de confiance", "chaine de confiance", "la chaîne de confiance", "chaine de certification"], ph: "quelques mots", exp: "La chaîne de confiance : site → intermédiaire → racine." },
    { type: "qcm", q: "La signature de la CA sur un certificat garantit quoi ?", opts: ["Que le site est rapide", "Que le contenu n'a pas été modifié et qu'une autorité atteste le lien identité/clé", "Que la connexion est gratuite", "Que le fichier est compressé"], a: 1, exp: "Elle garantit l'intégrité du certificat et l'attestation par une autorité reconnue." }
  ],
  final: {
    title: "Exercice final — Vérifier le certificat d'une banque",
    intro: `<p>Léna se connecte à <code>ma-banque.example</code>. Le navigateur reçoit le certificat du site et doit décider s'il fait confiance. Suivons le contrôle, étape par étape, du point de vue défensif.</p>`,
    questions: [
      { type: "qcm", q: "Le certificat du site est signé par…", opts: ["Léna elle-même", "Une autorité de certification (CA)", "Le fournisseur d'accès", "Personne"], a: 1, exp: "C'est une CA qui a vérifié l'identité et signé le certificat du site." },
      { type: "input", q: "Que contient le certificat pour permettre le chiffrement à suivre ? (deux mots)", a: ["la clé publique", "clé publique", "cle publique", "la cle publique du site"], ph: "deux mots", exp: "La clé publique du site, attestée par la signature de la CA." },
      { type: "qcm", q: "Comment le navigateur valide-t-il la confiance ?", opts: ["Il remonte la chaîne jusqu'à une CA racine présente dans son magasin", "Il fait confiance sans vérifier", "Il compare la couleur du cadenas", "Il demande à la banque par téléphone"], a: 0, exp: "Il vérifie la chaîne de confiance jusqu'à une racine connue." },
      { type: "vf", q: "Si le nom du certificat ne correspond pas à ma-banque.example, c'est suspect.", a: true, exp: "Oui : un nom qui ne correspond pas peut signaler un homme du milieu ; on n'ignore pas l'alerte." },
      { type: "qcm", q: "Un attaquant présente sa propre clé publique sans certificat valide signé. Que se passe-t-il ?", opts: ["Le navigateur l'accepte quand même", "Le navigateur alerte car la chaîne ne remonte à aucune racine de confiance", "La connexion devient plus rapide", "Rien, c'est normal"], a: 1, exp: "Sans signature remontant à une racine connue, le navigateur refuse ou alerte." }
    ],
    solution: `<pre class="pseudo"># Controle du certificat par le navigateur de Lena
1. Recevoir le certificat X.509 du site (identite + cle publique + signature)
2. Verifier que le NOM correspond bien a ma-banque.example
3. Verifier les DATES de validite (non expire)
4. Remonter la CHAINE : site <- CA intermediaire <- CA racine
5. La racine est-elle dans le magasin de confiance de l'OS/navigateur ?
     - oui, tout est bon -> confiance etablie, cle publique fiable
     - non / anomalie     -> ALERTE (possible homme du milieu)
# La signature de la CA garantit le lien identite <-> cle publique.</pre>
<p>Ce contrôle relie la clé publique à l'identité réelle du site : c'est la PKI qui transforme une simple clé en une identité vérifiable.</p>`
  }
};
