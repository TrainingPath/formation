  theory: `
<h3>1. L'idée renversante : deux clés au lieu d'une</h3>
<p>Au jour précédent, une seule clé servait à tout, d'où le problème de la partager. Le <strong>chiffrement asymétrique</strong> (en anglais <em>asymmetric</em>, aussi appelé <em>cryptographie à clé publique</em>) casse ce nœud avec une idée brillante : chaque personne possède une <strong>paire de clés</strong> mathématiquement liées. L'une est la <strong>clé publique</strong>, qu'on peut diffuser à tout le monde ; l'autre est la <strong>clé privée</strong>, gardée absolument secrète.</p>
<p>La magie : ce qui est <strong>chiffré avec la clé publique</strong> ne peut être <strong>déchiffré qu'avec la clé privée</strong> correspondante, et réciproquement. Les deux clés sont différentes (d'où « asymétrique ») et l'on ne peut pas déduire la clé privée à partir de la clé publique.</p>
<pre class="pseudo"># Envoyer un secret a Alice
1. Alice publie sa cle PUBLIQUE (tout le monde peut la voir)
2. Bob chiffre son message avec la cle PUBLIQUE d'Alice
3. Seul le detenteur de la cle PRIVEE d'Alice peut dechiffrer -> Alice
# Un espion qui capture le message chiffre ET la cle publique ne peut RIEN faire.</pre>
<h3>2. Comment ça résout l'échange de clé</h3>
<p>Plus besoin de transmettre un secret au préalable ! Pour recevoir des messages confidentiels, Alice <strong>publie</strong> sa clé publique au grand jour. N'importe qui l'utilise pour lui écrire de façon chiffrée, et elle seule, avec sa clé privée, peut lire. Le <strong>problème d'échange de clé</strong> du symétrique disparaît : la clé qu'on diffuse n'est pas un secret, et le secret (clé privée) ne quitte jamais son propriétaire.</p>
<div class="tip">Analogie du cadenas : Alice envoie à tout le monde des <strong>cadenas ouverts</strong> (clé publique). Chacun peut fermer une boîte avec ce cadenas, mais seule Alice possède la <strong>clé qui l'ouvre</strong> (clé privée). Distribuer des cadenas ouverts ne révèle aucun secret.</div>
<h3>3. RSA et ECC, les algorithmes phares</h3>
<p>Deux grandes familles dominent. <strong>RSA</strong> (des initiales de Rivest, Shamir, Adleman) repose sur la difficulté de factoriser le produit de deux très grands nombres premiers ; ses clés font typiquement 2048 ou 4096 bits. <strong>ECC</strong> (en anglais <em>Elliptic Curve Cryptography</em>, « cryptographie sur courbes elliptiques ») repose sur des courbes mathématiques et offre une sécurité équivalente avec des clés <strong>beaucoup plus courtes</strong> (une clé ECC de 256 bits rivalise avec une clé RSA de 3072 bits), donc plus rapides et plus légères. ECC est aujourd'hui de plus en plus privilégié, notamment sur mobile.</p>
<h3>4. Le revers : c'est lent, et une autre superpuissance</h3>
<p>L'asymétrique a un défaut : il est <strong>beaucoup plus lent</strong> que le symétrique, car ses calculs mathématiques sont lourds. On ne l'utilise donc <strong>pas</strong> pour chiffrer de gros volumes. En pratique on combine les deux : l'asymétrique sert à <strong>échanger de façon sûre une clé symétrique</strong> (petite), puis toute la suite des données est chiffrée en symétrique (rapide). C'est exactement ce que fait TLS (jour 15). Autre usage majeur : en chiffrant avec sa clé <strong>privée</strong>, on crée une <strong>signature numérique</strong> que tout le monde vérifie avec la clé publique — cela prouve l'origine et l'intégrité.</p>
<div class="warn">La clé privée ne doit JAMAIS être partagée ni transmise. Si elle fuite, toute la sécurité s'effondre : quelqu'un pourrait lire tes messages et signer en ton nom. La clé publique, elle, est faite pour être diffusée sans crainte.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Asymetrique = une PAIRE de cles : PUBLIQUE (diffusee) + PRIVEE (secrete)
# Chiffre avec la publique -> dechiffre seulement avec la privee (et inversement)
# Resout l'ECHANGE DE CLE : la cle diffusee n'est pas un secret
# Algorithmes : RSA (2048/4096 bits) et ECC (courbes, cles plus courtes)
# Defaut : LENT -> sert a echanger une cle symetrique, puis AES prend le relais
# Autre usage : SIGNATURE (chiffrer avec la privee, verifier avec la publique)</pre>`,

    { type: "vf", q: "On peut déduire facilement la clé privée à partir de la clé publique.", a: false, exp: "Non : c'est justement impossible en pratique ; c'est ce qui rend le système sûr." },

    { type: "input", q: "De quels noms viennent les initiales R, S, A de RSA ? (les inventeurs)", a: ["rivest shamir adleman", "rivest, shamir, adleman", "rivest shamir et adleman"], ph: "trois noms", exp: "RSA = Rivest, Shamir et Adleman, ses trois concepteurs." },
    { type: "qcm", q: "Pourquoi diffuser une clé publique ne révèle-t-il aucun secret ?", opts: ["Parce qu'elle est chiffrée", "Parce qu'elle ne sert qu'à chiffrer/vérifier, pas à déchiffrer/signer", "Parce qu'elle change chaque seconde", "Parce qu'elle est invisible"], a: 1, exp: "La clé publique ne permet ni de déchiffrer ni de signer : la partager est sans risque." }

    ],
    solution: `<pre class="pseudo"># Echange confidentiel Bob -> Alice, sans secret prealable
1. Alice publie sa cle PUBLIQUE
2. Bob genere une cle AES aleatoire (symetrique, rapide)
3. Bob chiffre le message avec AES (rapide, gros volume)
4. Bob chiffre la petite cle AES avec la cle PUBLIQUE d'Alice
5. Il envoie [message chiffre AES] + [cle AES chiffree RSA/ECC]
6. Alice dechiffre la cle AES avec sa cle PRIVEE, puis lit le message
# L'echange de cle est resolu, et le gros du chiffrement reste rapide.</pre>
<p>C'est exactement l'idée du chiffrement hybride utilisé par TLS : l'asymétrique met la clé en sécurité, le symétrique fait le travail de fond.</p>`
