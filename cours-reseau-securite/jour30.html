<script>
var DAY = {
  num: 30,
  title: "Pratique : auditer un réseau (nmap)",
  subtitle: "Dresser l'inventaire de SON propre réseau : quels hôtes, quels ports ouverts ?",
  theory: `
<h3>1. Auditer, c'est faire l'inventaire de son réseau</h3>
<p>On ne protège bien que ce que l'on connaît. Un <strong>audit d'inventaire</strong> répond à des questions simples mais essentielles : combien de machines sont réellement connectées ? quels services écoutent ? y a-t-il un équipement oublié ou non autorisé ? L'outil de référence pour cela s'appelle <strong>nmap</strong> (<em>Network Mapper</em>). Dans ce cours, on l'utilise <strong>uniquement sur son propre réseau ou son labo</strong>, avec autorisation : c'est un outil d'administration défensif, pas d'attaque.</p>
<div class="warn">Cadre légal et éthique : ne scanne <strong>que</strong> les réseaux qui t'appartiennent ou pour lesquels tu as une autorisation écrite. Scanner le réseau d'autrui sans accord est illégal. Ici, tout se fait en <strong>labo</strong> ou sur <strong>ton propre réseau</strong>.</p></div>
<h3>2. Découvrir les hôtes présents (scan de ping)</h3>
<p>Première étape : savoir <strong>qui est là</strong>. L'option <strong>-sn</strong> effectue une simple découverte d'hôtes (autrefois « ping scan ») sans analyser les ports. On obtient la liste des machines actives sur le sous-réseau — un inventaire vivant à comparer avec ce que l'on croit avoir.</p>
<pre class="pseudo"># Decouverte des hotes actifs sur SON propre reseau local
nmap -sn 192.168.1.0/24
# Resultat : liste des adresses IP qui repondent (machines allumees).
# Utile pour reperer un equipement inconnu ou oublie.</pre>
<h3>3. Repérer les ports ouverts</h3>
<p>Ensuite : sur une machine donnée, <strong>quels ports sont ouverts</strong> ? Un port ouvert = un service qui écoute = une porte à surveiller. Un scan de ports par défaut vérifie les ports les plus courants. Chaque port ouvert doit être <strong>justifié</strong> : s'il ne correspond à aucun service voulu, c'est une anomalie à corriger (durcissement, jour 28).</p>
<pre class="pseudo"># Scanner les ports d'un hote de SON reseau
nmap 192.168.1.10
# Exemple de sortie :
PORT     STATE   SERVICE
22/tcp   open    ssh
80/tcp   open    http
443/tcp  open    https
# Chaque port OUVERT doit correspondre a un service voulu, sinon on ferme.</pre>
<h3>4. Identifier les services et versions (-sV)</h3>
<p>Savoir qu'un port est ouvert ne suffit pas : quel logiciel écoute, et dans quelle version ? L'option <strong>-sV</strong> tente de détecter le <strong>service et sa version</strong>. C'est précieux en défense : une version ancienne peut correspondre à une faille connue à corriger. On croise ces informations avec les bulletins de sécurité pour prioriser les mises à jour.</p>
<pre class="pseudo"># Detection des services et versions (audit de vulnerabilite defensif)
nmap -sV 192.168.1.10
# PORT    STATE  SERVICE  VERSION
# 22/tcp  open   ssh      OpenSSH 8.9
# 80/tcp  open   http     nginx 1.24.0
# Une version ancienne connue vulnerable = a mettre a jour en priorite.</pre>
<div class="tip">Démarche d'audit type : <strong>-sn</strong> pour lister les hôtes, puis un scan de ports, puis <strong>-sV</strong> sur les hôtes sensibles. On documente et on compare à l'état attendu (inventaire de référence).</div>
<h3>5. De l'audit à l'action</h3>
<p>Un audit ne vaut que par ce qu'on en fait. Après le scan : <strong>fermer</strong> les ports/services inutiles, <strong>mettre à jour</strong> les versions vulnérables, <strong>vérifier</strong> qu'aucun équipement inconnu ne s'est invité, et <strong>refaire</strong> l'audit régulièrement. C'est la boucle : inventorier → corriger → réinventorier.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># nmap = outil d'INVENTAIRE et d'audit de SON propre reseau (defensif)
# -sn : decouverte des hotes (qui est la ?)
# scan de ports : quels ports OUVERTS (portes a surveiller) ?
# -sV : quels services et VERSIONS (reperer les versions vulnerables) ?
# Toujours : sur son reseau / en labo, avec autorisation. Puis corriger.</pre>`,
  exercises: [
    { type: "qcm", q: "À quoi sert nmap dans ce cours ?", opts: ["À attaquer des serveurs distants", "À inventorier et auditer son propre réseau", "À chiffrer des fichiers", "À envoyer des e-mails"], a: 1, exp: "Ici nmap est un outil défensif d'inventaire et d'audit de son propre réseau." },
    { type: "qcm", q: "Que fait l'option -sn de nmap ?", opts: ["Scanne tous les ports en profondeur", "Découvre les hôtes actifs sans analyser les ports", "Chiffre le trafic", "Désactive le pare-feu"], a: 1, exp: "-sn fait une découverte d'hôtes (qui répond), sans scan de ports." },
    { type: "qcm", q: "Que tente de déterminer l'option -sV ?", opts: ["Le système d'exploitation de la cible", "Le service et sa version derrière un port", "La vitesse du disque", "Le nombre de connexions actives"], a: 1, exp: "-sV détecte le service et sa version, utile pour repérer les versions vulnérables." },
    { type: "qcm", q: "Un port ouvert signifie surtout…", opts: ["Un service qui écoute (une porte à surveiller)", "Un disque plein", "Un câble débranché", "Une mise à jour réussie"], a: 0, exp: "Un port ouvert = un service en écoute, donc un point à justifier et surveiller." },
    { type: "qcm", q: "Après un audit qui révèle un port ouvert inutile, on…", opts: ["L'ignore", "Ferme le service/port inutile", "Ouvre d'autres ports", "Débranche le réseau"], a: 1, exp: "On ferme ce qui n'est pas justifié : réduction de la surface d'attaque." },
    { type: "qcm", q: "Que représente 192.168.1.0/24 dans une commande nmap ?", opts: ["Une seule machine", "Un sous-réseau (plage d'adresses) à parcourir", "Un port", "Un mot de passe"], a: 1, exp: "C'est un sous-réseau : la plage d'hôtes à découvrir." },
    { type: "vf", q: "Scanner le réseau d'autrui sans autorisation est acceptable si c'est pour apprendre.", a: false, exp: "Non : c'est illégal. On ne scanne que son réseau ou avec autorisation écrite." },
    { type: "vf", q: "Détecter une version logicielle ancienne aide à prioriser les mises à jour.", a: true, exp: "Oui : une version connue vulnérable devient une priorité de correction." },
    { type: "vf", q: "Un audit réseau est plus utile s'il est répété régulièrement.", a: true, exp: "Oui : inventorier, corriger, réinventorier — c'est une boucle continue." },
    { type: "vf", q: "L'option -sn analyse en détail tous les ports de chaque hôte.", a: false, exp: "Non : -sn se limite à la découverte d'hôtes, sans scan de ports." },
    { type: "input", q: "Quel outil (nom) sert à cartographier et auditer un réseau ?", a: ["nmap"], ph: "un nom", exp: "nmap (Network Mapper) : découverte et audit réseau." },
    { type: "input", q: "Quelle option de nmap découvre les hôtes sans scanner les ports ?", a: ["-sn", "sn"], ph: "option", exp: "-sn : découverte d'hôtes (host discovery)." },
    { type: "input", q: "Quelle option de nmap détecte le service et sa version ?", a: ["-sv", "sv"], ph: "option", exp: "-sV : détection de service et de version." },
    { type: "input", q: "Comment nomme-t-on l'état d'un port qui accepte une connexion (mot anglais affiché par nmap) ?", a: ["open", "ouvert"], ph: "un mot", exp: "open : le port est ouvert, un service écoute." },
    { type: "input", q: "Sur quels réseaux est-il autorisé d'utiliser nmap dans ce cours ?", a: ["son propre reseau", "son reseau", "le sien", "son propre réseau", "en labo", "labo"], ph: "quelques mots", exp: "Uniquement son propre réseau / labo, avec autorisation." }
  ],
  final: {
    title: "Exercice final — Inventaire du labo",
    intro: `<p>Tu audites ton propre réseau de labo 10.0.0.0/24. Tu veux d'abord savoir qui est connecté, puis vérifier les ports et versions des machines. Déroule une démarche défensive.</p>`,
    questions: [
      { type: "input", q: "Quelle option nmap utilises-tu d'abord pour lister les hôtes actifs ?", a: ["-sn", "sn"], ph: "option", exp: "-sn découvre les hôtes présents sur le sous-réseau." },
      { type: "qcm", q: "Le scan révèle une machine inconnue que tu ne reconnais pas. Tu…", opts: ["L'ignores", "L'investigues : équipement oublié ou non autorisé ?", "Éteins tout le réseau", "Ajoutes des ports"], a: 1, exp: "Un hôte inconnu doit être identifié : oublié ou intrus." },
      { type: "input", q: "Pour connaître les versions des services d'un hôte sensible, quelle option ?", a: ["-sv", "sv"], ph: "option", exp: "-sV détecte les services et leurs versions." },
      { type: "vf", q: "Un port ouvert sans service justifié doit être fermé lors du durcissement.", a: true, exp: "Oui : on ferme l'inutile pour réduire la surface d'attaque." },
      { type: "vf", q: "Comme tu audites ton propre labo, tu es dans un cadre autorisé.", a: true, exp: "Oui : scanner son propre réseau/labo est légitime et défensif." }
    ],
    solution: `<pre class="pseudo"># Demarche d'audit en labo (10.0.0.0/24) :
1) nmap -sn 10.0.0.0/24        # qui est la ? -> inventaire des hotes
2) Comparer a l'inventaire attendu -> investiguer tout hote inconnu
3) nmap 10.0.0.X               # ports ouverts d'un hote
4) nmap -sV 10.0.0.X           # services + versions (reperer le vulnerable)
5) Corriger : fermer l'inutile, mettre a jour, puis REFAIRE l'audit.</pre>
<p>Auditer, c'est se voir comme on est réellement, pour corriger. Demain : le projet final — sécuriser l'infra d'une PME.</p>`
  }
};
</script>
