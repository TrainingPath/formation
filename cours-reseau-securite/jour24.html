var DAY = {
  num: 24,
  title: "Le déni de service (DoS / DDoS)",
  subtitle: "Comprendre la saturation d'un service pour savoir l'absorber et la mitiger.",
  theory: `
<h3>1. Le principe : saturer pour rendre indisponible</h3>
<p>Une attaque par <strong>déni de service</strong> (<em>DoS</em>, <em>Denial of Service</em>) ne vole pas de données : elle vise la <strong>disponibilité</strong>. En saturant une ressource — bande passante, mémoire, connexions ouvertes, puissance de calcul — l'attaquant rend le service <strong>inaccessible aux utilisateurs légitimes</strong>. Analogie : bloquer l'entrée d'un magasin avec une foule qui n'achète rien ; les vrais clients ne peuvent plus entrer. On étudie ce mécanisme uniquement pour savoir <strong>résister et réagir</strong>.</p>
<h3>2. DoS et DDoS : la différence d'échelle</h3>
<p>Un <strong>DoS</strong> vient d'une seule source ; il est plus facile à repérer et à bloquer. Le <strong>DDoS</strong> (<em>Distributed Denial of Service</em>, déni de service distribué) provient de <strong>milliers de machines réparties</strong>, souvent des appareils compromis regroupés en <strong>botnet</strong> (réseau de robots). Comme le trafic vient de partout, bloquer une seule adresse ne suffit pas : c'est ce qui rend le DDoS redoutable.</p>
<pre class="pseudo"># DoS  : 1 source ------------------&gt; [ service sature ]
# DDoS : des milliers de sources (botnet) ==&gt; [ service sature ]
#        difficile de distinguer le trafic legitime du malveillant</pre>
<h3>3. Les grandes familles d'attaques</h3>
<p>On distingue trois familles. <strong>Volumétriques</strong> : noyer le lien sous un débit énorme (ex. amplification via des services mal configurés qui répondent en gros paquets à de petites requêtes). <strong>Protocolaires</strong> : épuiser des ressources d'état, comme le <em>SYN flood</em> qui ouvre des connexions TCP à moitié établies jusqu'à saturer la table. <strong>Applicatives</strong> (couche 7) : des requêtes en apparence légitimes mais coûteuses (ex. une recherche lourde répétée) qui épuisent le serveur avec peu de trafic, donc plus difficiles à distinguer.</p>
<pre class="pseudo"># 3 familles :
# Volumetrique  -&gt; saturer la BANDE PASSANTE (amplification, flood UDP)
# Protocolaire  -&gt; epuiser des ETATS (SYN flood : demi-connexions TCP)
# Applicative   -&gt; couche 7 : requetes couteuses qui imitent des vrais clients</pre>
<h3>4. Se protéger : la mitigation</h3>
<p>Aucune solution unique ; on empile des défenses. <strong>Rate limiting</strong> : plafonner le nombre de requêtes par source et par seconde. <strong>Filtrage</strong> en amont chez l'opérateur ou le FAI, et <strong>blackholing/scrubbing</strong> : rediriger le trafic suspect vers des centres de « nettoyage » qui gardent le légitime. <strong>Services anti-DDoS</strong> et <strong>CDN</strong> : répartir la charge sur un vaste réseau mondial qui absorbe les pics. <strong>Surdimensionnement</strong> et <strong>autoscaling</strong> pour encaisser. Contre le SYN flood, les <strong>SYN cookies</strong> évitent de réserver des ressources tant que la connexion n'est pas confirmée. Enfin, un <strong>plan de réponse</strong> et de la <strong>supervision</strong> pour détecter tôt un pic anormal.</p>
<div class="tip">La bonne pratique est la <strong>défense en profondeur</strong> : rate limiting + filtrage FAI + service anti-DDoS/CDN + surdimensionnement, plus un plan de crise testé. On absorbe et on filtre plutôt que de « gagner » frontalement.</div>
<div class="warn">Réduire la surface d'exposition aide aussi : fermer les services inutiles et corriger les configurations d'amplification (ex. serveurs ouverts qui répondent à tout) évite d'être à la fois victime ET relais involontaire d'une attaque.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># DoS/DDoS visent la DISPONIBILITE (saturer, rendre indisponible) - pas le vol
# DoS = 1 source ; DDoS = distribue via un BOTNET (des milliers de machines)
# Familles : Volumetrique (bande passante) | Protocolaire (SYN flood) | Applicative (couche 7)
# Mitigation : rate limiting, filtrage FAI, scrubbing, anti-DDoS/CDN, autoscaling, SYN cookies
# Toujours : supervision + plan de reponse + reduire la surface d'exposition</pre>`,

    { type: "qcm", q: "Quelle propriété de sécurité vise une attaque DoS ?", opts: ["La confidentialité", "L'intégrité", "La disponibilité", "La non-répudiation"], a: 2, exp: "Le DoS rend le service indisponible : il vise la disponibilité." },
    { type: "vf", q: "Une attaque DoS a pour but principal de voler des données.", a: false, exp: "Non : elle vise à rendre le service inaccessible, pas à voler." },

    { type: "qcm", q: "À quelle famille appartient une attaque qui sature la bande passante ?", opts: ["Volumétrique", "Protocolaire", "Applicative", "Physique"], a: 0, exp: "Saturer la bande passante = attaque volumétrique." },
    { type: "qcm", q: "Le SYN flood appartient à quelle famille ?", opts: ["Volumétrique", "Protocolaire", "Applicative", "Aucune"], a: 1, exp: "Le SYN flood épuise des ressources d'état TCP : famille protocolaire." },
    { type: "input", q: "Le SYN flood laisse des connexions TCP à moitié établies : comment nomme-t-on ces demi-connexions ? (deux mots)", a: ["demi connexions", "demi-connexions", "connexions semi ouvertes", "half open"], ph: "deux mots", exp: "Des demi-connexions (semi-ouvertes) qui saturent la table." },
    { type: "vf", q: "Une attaque applicative (couche 7) peut saturer un serveur avec relativement peu de trafic.", a: true, exp: "Oui : des requêtes coûteuses épuisent le serveur sans gros débit, d'où sa discrétion." },
    { type: "qcm", q: "Quelle mesure plafonne le nombre de requêtes par source et par seconde ?", opts: ["Le rate limiting", "Le NAT", "Le DHCP", "Le VLAN"], a: 0, exp: "Le rate limiting limite le débit de requêtes par source." },
    { type: "input", q: "Quelle technique évite de réserver des ressources tant qu'une connexion TCP n'est pas confirmée (contre le SYN flood) ? (deux mots)", a: ["syn cookies", "les syn cookies", "syn cookie"], ph: "deux mots", exp: "Les SYN cookies diffèrent l'allocation de ressources." },
    { type: "qcm", q: "Comment un CDN aide-t-il contre un DDoS volumétrique ?", opts: ["Il chiffre le trafic", "Il répartit et absorbe la charge sur un vaste réseau mondial", "Il supprime TCP", "Il bloque tout le trafic"], a: 1, exp: "Un CDN dilue le trafic sur de nombreux points de présence." },
    { type: "vf", q: "Le scrubbing consiste à rediriger le trafic suspect vers des centres qui filtrent et ne laissent passer que le légitime.", a: true, exp: "Oui : les centres de scrubbing nettoient le trafic." },
    { type: "input", q: "Comment nomme-t-on la stratégie d'empiler plusieurs couches de protection ? (expression, français ou anglais)", a: ["defense en profondeur", "defense in depth", "la defense en profondeur"], ph: "une expression", exp: "La défense en profondeur combine plusieurs mesures." },
    { type: "qcm", q: "Pourquoi corriger un serveur mal configuré qui répond à tout est-il important ?", opts: ["Pour aller plus vite", "Pour éviter d'être un relais d'amplification d'attaque", "Pour changer d'IP", "Pour désactiver HTTPS"], a: 1, exp: "Un service ouvert peut servir d'amplificateur : réduire la surface d'exposition." }
  ],
  final: {
    title: "Exercice final — Le site marchand tombe pendant un pic",
    intro: `<p>Un site e-commerce devient inaccessible : la supervision montre un débit entrant énorme venant de milliers d'adresses différentes, et le serveur épuise ses connexions. L'équipe soupçonne un DDoS. Élaborons la réponse défensive.</p>`,
    questions: [
      { type: "qcm", q: "Quel indice pointe vers un DDoS plutôt qu'un DoS simple ?", opts: ["Une seule IP source", "Des milliers d'adresses sources différentes", "Aucun trafic", "Un problème de DNS interne"], a: 1, exp: "La multiplicité des sources caractérise le DDoS." },
      { type: "input", q: "Comment appelle-t-on l'ensemble de machines compromises probablement à l'origine ? (un mot)", a: ["botnet", "un botnet"], ph: "un mot", exp: "Un botnet orchestre l'attaque distribuée." },
      { type: "qcm", q: "Quelle mesure immédiate limite les requêtes abusives par source ?", opts: ["Le rate limiting", "Le doublement des mots de passe", "La désactivation d'ARP", "Le changement de VLAN"], a: 0, exp: "Le rate limiting plafonne les requêtes par source." },
      { type: "vf", q: "Un service anti-DDoS ou un CDN peut absorber et filtrer une grande partie du trafic malveillant en amont.", a: true, exp: "Oui : il dilue et nettoie le trafic avant le serveur d'origine." },
      { type: "qcm", q: "Le serveur épuise ses connexions à moitié ouvertes : quelle contre-mesure est adaptée ?", opts: ["Les SYN cookies", "Un mot de passe plus long", "Fermer HTTPS", "Un câble blindé"], a: 0, exp: "Les SYN cookies contrent l'épuisement par SYN flood." }
    ],
    solution: `<pre class="pseudo"># Reponse defensive au DDoS (absorber + filtrer, PAS contre-attaquer) :
# Constat : debit enorme + milliers de sources + connexions epuisees -&gt; DDoS (botnet).
# 1) Basculer derriere un service anti-DDoS / CDN : dilue et nettoie le trafic (scrubbing).
# 2) Rate limiting par source et filtrage en amont (FAI/operateur).
# 3) SYN cookies pour les demi-connexions TCP (composante protocolaire).
# 4) Autoscaling / surdimensionnement pour encaisser les pics.
# 5) Superviser, appliquer le plan de crise, reduire la surface (services inutiles fermes).
# Objectif : maintenir la DISPONIBILITE pour les vrais clients.</pre>
<p>Le service est rétabli et durci. Tu as parcouru VPN, authentification, contrôle d'accès, durcissement du LAN et défense face aux attaques : les fondations d'un réseau sûr.</p>`
  }
