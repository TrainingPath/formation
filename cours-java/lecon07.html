var DAY = {
  num: 7,
  title: "Les tableaux en Java",
  subtitle: "Les jours 14-15 d'algorithmique… avec des indices qui commencent à 0 !",
  theory: `
<h3>1. Qu'est-ce qu'un tableau ?</h3>
<p>Un <strong>tableau</strong> range PLUSIEURS valeurs du même type dans une seule variable, dans des <strong>cases</strong> numérotées. Imagine une rangée de casiers collés les uns aux autres : chaque casier porte un numéro (l'<strong>indice</strong>) et contient une valeur. Une seule variable désigne toute la rangée.</p>
<pre class="pseudo">int[] notes = new int[5];            // crée 5 cases d'entiers, toutes initialisées à 0
double[] prix = new double[10];      // 10 cases de double, toutes à 0.0
int[] t = {12, 8, 15, 10, 14};       // création AVEC ses valeurs (la taille, 5, est déduite automatiquement)</pre>
<p><code>new int[5]</code> réserve la place en mémoire ; au départ, les cases numériques valent 0, les objets (String…) valent <code>null</code> (« rien »), et les boolean valent <code>false</code>.</p>

<h3>2. LA grande différence : les indices commencent à 0 !</h3>
<pre class="pseudo">int[] t = {12, 8, 15, 10, 14};
indices Java :   0     1     2     3     4        // chaque case a un NUMÉRO, à partir de 0
              [ 12 ][  8 ][ 15 ][ 10 ][ 14 ]
t[0] → 12     (la PREMIÈRE case)                  // t[0] = 1re case
t[4] → 14     (la DERNIÈRE : indice taille - 1)   // 5 cases → dernier indice = 4
t[5] → ArrayIndexOutOfBoundsException !           // t[5] n'existe pas → erreur de débordement à l'exécution</pre>
<div class="warn">En pseudocode, nos tableaux allaient de 1 à n. En Java : de <strong>0 à n−1</strong>. Le dernier indice est <code>t.length - 1</code>. Ce décalage est LA source d'erreurs des débutants — surveille chaque ±1.</div>

<h3>3. La taille : t.length (sans parenthèses)</h3>
<pre class="pseudo">int n = t.length;        // length = le nombre de cases (5). Pour un TABLEAU : un CHAMP, donc PAS de ()</pre>
<p>Attention au piège Java : la taille d'un <strong>tableau</strong> est <code>t.length</code> (sans parenthèses), mais la longueur d'une <strong>String</strong> sera <code>mot.length()</code> (avec parenthèses, leçon 9). Deux écritures proches à ne pas confondre.</p>

<h3>4. Le parcours d'un tableau</h3>
<pre class="pseudo">// PAR INDICES (permet de connaître/modifier la position)
for (int i = 0; i &lt; t.length; i++) {     // i part de 0 et va jusqu'à length-1 grâce au < STRICT
    System.out.println(t[i]);            // affiche la case numéro i
}
// FOR-EACH (plus simple, pour juste lire les valeurs)
for (int valeur : t) {                    // « valeur » prend successivement la valeur de chaque case du tableau
    System.out.println(valeur);          // on affiche cette valeur, sans se soucier du numéro de case
}</pre>
<div class="tip">Grave la formule magique : <code>for (int i = 0; i &lt; t.length; i++)</code>. Le <code>&lt;</code> STRICT (et non <code>&lt;=</code>) fait pile le bon nombre de tours et évite le débordement.</div>

<h3>5. Les motifs classiques (somme, maximum)</h3>
<pre class="pseudo">// SOMME de toutes les cases
int somme = 0;                                    // accumulateur à 0
for (int i = 0; i &lt; t.length; i++) { somme += t[i]; }  // on ajoute chaque case au total

// MAXIMUM : la 1re case sert de « champion » provisoire
int max = t[0];                                   // hypothèse : le plus grand est en case 0
for (int i = 1; i &lt; t.length; i++) {              // on compare à partir de la case 1
    if (t[i] &gt; max) { max = t[i]; }               // si on trouve plus grand, il devient le nouveau champion
}</pre>
<p>Le motif du maximum (« champion provisoire » remplacé dès qu'on trouve mieux) reviendra pour trier, chercher, comparer.</p>

<h3>6. Débordement = exception</h3>
<p>Là où le pseudocode « plantait » vaguement, Java lève une <code>ArrayIndexOutOfBoundsException</code> à l'exécution, avec l'indice fautif indiqué dans le message. Une <strong>exception</strong> est un signal d'erreur (leçon 16) : prends le temps de le lire, il te dit exactement quelle case tu as tenté d'atteindre.</p>`,
  exercises: [
    { type: "qcm", q: "Comment créer un tableau de 8 entiers ?", opts: ["int t[8];", "int[] t = new int[8];", "array t = 8;", "int t = [8];"], a: 1, exp: "Type[] nom = new Type[taille]." },
    { type: "qcm", q: "En Java, le PREMIER élément d'un tableau est à l'indice…", opts: ["1", "0", "-1", "Au choix"], a: 1, exp: "LA différence avec notre pseudocode : tout commence à 0." },
    { type: "input", q: "int[] t = {7, 3, 9, 1}; Que vaut <code>t[2]</code> ?", a: "9", ph: "nombre", exp: "Indices 0,1,2,3 : t[2] est le TROISIÈME élément : 9." },
    { type: "qcm", q: "Le DERNIER élément d'un tableau t s'écrit…", opts: ["t[t.length]", "t[t.length - 1]", "t[last]", "t[-1]"], a: 1, exp: "5 cases → indices 0 à 4 : le dernier est length−1." },
    { type: "qcm", q: "Que provoque <code>t[t.length]</code> ?", opts: ["Le dernier élément", "ArrayIndexOutOfBoundsException : débordement", "0", "null"], a: 1, exp: "Le débordement du jour 14, version exception Java." },
    { type: "qcm", q: "t.length s'écrit…", opts: ["t.length() avec parenthèses", "t.length sans parenthèses : c'est un champ", "length(t)", "t.size"], a: 1, exp: "Piège : pour les String ce sera length() AVEC parenthèses (leçon 9) !" },
    { type: "qcm", q: "La boucle de parcours standard :", opts: ["for (int i = 1; i <= t.length; i++)", "for (int i = 0; i < t.length; i++)", "for (int i = 0; i <= t.length; i++)", "while (t)"], a: 1, exp: "Départ 0, strictement inférieur : zéro débordement." },
    { type: "qcm", q: "Pourquoi <code>i <= t.length</code> est-il un bug ?", opts: ["Trop lent", "Au dernier tour, i = length → t[i] déborde", "Ça ne compile pas", "Aucun bug"], a: 1, exp: "Le ±1 : < strict obligatoire avec un départ à 0." },
    { type: "input", q: "int[] t = new int[4]; System.out.println(t[2]); Qu'affiche-t-on ?", a: "0", ph: "nombre", exp: "new int[n] initialise toutes les cases à 0 (0.0 pour double, false pour boolean)." },
    { type: "input", q: "int[] t = {5, 2, 8, 3}; somme avec la boucle standard : résultat ?", a: "18", ph: "nombre", exp: "5+2+8+3 = 18 : l'accumulateur du jour 15." },
    { type: "qcm", q: "<code>for (int v : t)</code> — le for-each :", opts: ["Parcourt les indices", "Parcourt directement les VALEURS, sans gérer d'indice", "Trie le tableau", "Ne compile pas"], a: 1, exp: "Idéal en lecture seule ; pour modifier ou connaître la position, garde le for classique." },
    { type: "qcm", q: "Dans le motif max en Java, on initialise <code>max = t[0]</code> et la boucle part de…", opts: ["i = 0", "i = 1 : la case 0 est déjà prise comme champion", "i = 2", "i = -1"], a: 1, exp: "Le jour 17 traduit : t[1] du pseudocode devient t[0], et le départ 2 devient 1." },
    { type: "input", q: "int[] t = {4, 9, 2, 7}; int max = t[0]; boucle du max… Que vaut max à la fin ?", a: "9", ph: "nombre", exp: "Le champion 4 est détrôné par 9, qui résiste à 2 et 7." },
    { type: "qcm", q: "Comparer les cases voisines t[i] et t[i+1] : la boucle doit s'arrêter à…", opts: ["i < t.length", "i < t.length - 1 : sinon t[i+1] déborde au dernier tour", "i <= t.length", "peu importe"], a: 1, exp: "Le réflexe anti-débordement du jour 15, décalé pour le 0-indexé." },
    { type: "input", q: "int[] t = {3, 6, 9}; for (int i = 0; i < t.length; i++) { t[i] *= 2; } Que vaut t[2] ?", a: "18", ph: "nombre", exp: "Chaque case est doublée : {6, 12, 18}." }
  ],
  final: {
    title: "Exercice final — L'audit de la boutique (version Java)",
    intro: `<p>Le final du jour 15, traduit : ventes de 6 jours, total, moyenne, bons jours (>= 100), baisses.</p>
<pre class="pseudo">int[] ventes = {120, 80, 150, 60, 90, 100};        // 6 cases : les ventes de chaque jour
int total = 0, nbBons = 0, baisses = 0;            // trois compteurs à 0 (accumulateur + deux compteurs)
for (int i = 0; i < ventes.length; i++) {          // parcourt toutes les cases (indices 0 à 5)
    total += ventes[i];                            // ajoute la vente du jour au total
    if (ventes[i] >= 100) { nbBons++; }            // compte les jours à 100 ventes ou plus
}
double moyenne = (double) total / ventes.length;   // cast → moyenne réelle (et non division entière)
for (int i = 1; i < ventes.length; i++) {          // 2e parcours à partir de l'indice 1
    if (ventes[i] < ventes[i - 1]) { baisses++; }  // compare au jour précédent : baisse ?
}</pre>`,
    questions: [
      { type: "input", q: "Que vaut <code>total</code> ?", a: "600", ph: "nombre", exp: "120+80+150+60+90+100 = 600, comme au jour 15." },
      { type: "input", q: "Que vaut <code>nbBons</code> ?", a: "3", ph: "nombre", exp: "120, 150, 100." },
      { type: "qcm", q: "Pourquoi le cast <code>(double) total</code> dans la moyenne ?", opts: ["Pour faire joli", "total et length sont des int : sans cast, 600/6 irait mais 601/6 donnerait 100 au lieu de 100.16", "C'est obligatoire pour compiler", "Pour arrondir"], a: 1, exp: "La division entière de la leçon 3 frapperait en silence : cast systématique pour une moyenne." },
      { type: "qcm", q: "La 2ᵉ boucle démarre à i = 1. Traduction du jour 15 (elle démarrait à 2) : pourquoi 1 ici ?", opts: ["Erreur", "Indices décalés de 1 : le « 2ᵉ élément » du pseudocode EST l'indice 1 en Java", "Pour aller plus vite", "1 est toujours le départ"], a: 1, exp: "On lit ventes[i-1] : départ au 2ᵉ élément = indice 1. Le décalage 0-indexé en action." },
      { type: "input", q: "Que vaut <code>baisses</code> ?", a: "2", ph: "nombre", exp: "80<120 et 60<150 : deux baisses, comme au jour 15." }
    ],
    solution: `<pre class="pseudo">i    ventes[i]   total   nbBons
0    120         120     1
1    80          200     1
2    150         350     2
3    60          410     2
4    90          500     2
5    100         600     3
moyenne = 600/6.0 = 100.0 · baisses = 2 (indices 1 et 3)</pre>
<p>Compare ligne à ligne avec le jour 15 : mêmes motifs, indices décalés de 1. Ton nouvel automatisme : « pseudocode 1..n » ⇔ « Java 0..length-1 ».</p>`
  }
};
</script>

    solution: "public class Statistiques {                      // pas de Scanner : les données sont dans le code\n    public static void main(String[] args) {    // point d'entrée du programme\n        int[] notes = {12, 8, 15, 19, 6, 11};   // création + remplissage du tableau en une ligne\n        int min = notes[0];                      // le 1er élément (indice 0 !) sert de départ\n        int max = notes[0];                      // idem pour le maximum\n        int somme = notes[0];                    // la somme inclut déjà notes[0]\n        for (int i = 1; i < notes.length; i++) { // parcourt le RESTE : indices 1 à length-1\n            if (notes[i] < min) min = notes[i];  // plus petit que le min actuel ? → nouveau min\n            if (notes[i] > max) max = notes[i];  // plus grand que le max actuel ? → nouveau max\n            somme += notes[i];                   // accumule pour la moyenne\n        }                                        // fin du parcours\n        double moyenne = (double) somme / notes.length; // le cast (double) force la division réelle\n        System.out.println(\"Min : \" + min);      // affiche le minimum\n        System.out.println(\"Max : \" + max);      // affiche le maximum\n        System.out.println(\"Moyenne : \" + moyenne); // affiche la moyenne exacte\n    }                                            // fin de main\n}                                                // fin de la classe",
