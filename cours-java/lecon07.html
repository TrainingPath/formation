  title: "Les tableaux en Java",
  subtitle: "Les jours 14-15 d'algorithmique… avec des indices qui commencent à 0 !",
  theory: `
<h3>1. Qu'est-ce qu'un tableau ?</h3>
<p>Un <strong>tableau</strong> range PLUSIEURS valeurs du même type dans une seule variable, dans des <strong>cases</strong> numérotées. Imagine une rangée de casiers collés les uns aux autres : chaque casier porte un numéro (l'<strong>indice</strong>) et contient une valeur. Une seule variable désigne toute la rangée.</p>
<pre class="pseudo">int[] notes = new int[5];            // crée 5 cases d'entiers, toutes initialisées à 0
double[] prix = new double[10];      // 10 cases de double, toutes à 0.0
int[] t = {12, 8, 15, 10, 14};       // création AVEC ses valeurs (la taille, 5, est déduite automatiquement)</pre>
<p><code>new int[5]</code> réserve la place en mémoire ; au départ, les cases numériques valent 0, les objets (String…) valent <code>null</code> (« rien »), et les boolean valent <code>false</code>.</p>

<h3>2. LA grande différence : les indices commencent à 0 !</h3>
<pre class="pseudo">int[] t = {12, 8, 15, 10, 14};
indices Java :   0     1     2     3     4        // chaque case a un NUMÉRO, à partir de 0
              [ 12 ][  8 ][ 15 ][ 10 ][ 14 ]
t[0] → 12     (la PREMIÈRE case)                  // t[0] = 1re case
t[4] → 14     (la DERNIÈRE : indice taille - 1)   // 5 cases → dernier indice = 4
t[5] → ArrayIndexOutOfBoundsException !           // t[5] n'existe pas → erreur de débordement à l'exécution</pre>
<div class="warn">En pseudocode, nos tableaux allaient de 1 à n. En Java : de <strong>0 à n−1</strong>. Le dernier indice est <code>t.length - 1</code>. Ce décalage est LA source d'erreurs des débutants — surveille chaque ±1.</div>

<h3>3. La taille : t.length (sans parenthèses)</h3>
<pre class="pseudo">int n = t.length;        // length = le nombre de cases (5). Pour un TABLEAU : un CHAMP, donc PAS de ()</pre>
<p>Attention au piège Java : la taille d'un <strong>tableau</strong> est <code>t.length</code> (sans parenthèses), mais la longueur d'une <strong>String</strong> sera <code>mot.length()</code> (avec parenthèses, leçon 9). Deux écritures proches à ne pas confondre.</p>

<h3>4. Le parcours d'un tableau</h3>
<pre class="pseudo">// PAR INDICES (permet de connaître/modifier la position)
for (int i = 0; i &lt; t.length; i++) {     // i part de 0 et va jusqu'à length-1 grâce au < STRICT
    System.out.println(t[i]);            // affiche la case numéro i
}
// FOR-EACH (plus simple, pour juste lire les valeurs)
for (int valeur : t) {                    // « valeur » prend successivement la valeur de chaque case du tableau
    System.out.println(valeur);          // on affiche cette valeur, sans se soucier du numéro de case
}</pre>
<div class="tip">Grave la formule magique : <code>for (int i = 0; i &lt; t.length; i++)</code>. Le <code>&lt;</code> STRICT (et non <code>&lt;=</code>) fait pile le bon nombre de tours et évite le débordement.</div>

<h3>5. Les motifs classiques (somme, maximum)</h3>
<pre class="pseudo">// SOMME de toutes les cases
int somme = 0;                                    // accumulateur à 0
for (int i = 0; i &lt; t.length; i++) { somme += t[i]; }  // on ajoute chaque case au total

// MAXIMUM : la 1re case sert de « champion » provisoire
int max = t[0];                                   // hypothèse : le plus grand est en case 0
for (int i = 1; i &lt; t.length; i++) {              // on compare à partir de la case 1
    if (t[i] &gt; max) { max = t[i]; }               // si on trouve plus grand, il devient le nouveau champion
}</pre>
<p>Le motif du maximum (« champion provisoire » remplacé dès qu'on trouve mieux) reviendra pour trier, chercher, comparer.</p>

<h3>6. Débordement = exception</h3>
<p>Là où le pseudocode « plantait » vaguement, Java lève une <code>ArrayIndexOutOfBoundsException</code> à l'exécution, avec l'indice fautif indiqué dans le message. Une <strong>exception</strong> est un signal d'erreur (leçon 16) : prends le temps de le lire, il te dit exactement quelle case tu as tenté d'atteindre.</p>`,

<pre class="pseudo">int[] ventes = {120, 80, 150, 60, 90, 100};        // 6 cases : les ventes de chaque jour
int total = 0, nbBons = 0, baisses = 0;            // trois compteurs à 0 (accumulateur + deux compteurs)

n            double bon = valeurBase * coefficient;\n            if (adherent.equals(\"oui\")) {\n                bon = bon * PRIME_ADHERENT;\n            }\n\n            bons[n] = Math.round(bon * 100) / 100.0;\n            categories[n] = categorie;\n            recycles[n] = (etat == 4);\n            n = n + 1;\n\n            System.out.print(\"Catégorie (0 pour clore la matinée) : \");\n            categorie = clavier.nextInt();\n        }\n\n        // Cumul par categorie : cinq cases, l'indice EST le numero de\n        // categorie. La case 0 reste inutilisee, et c'est un choix - elle\n        // coute huit octets et evite un decalage a chaque acces.\n        double[] parCategorie = new double[5];\n        double total = 0.0;\n        int acceptes = 0;\n        for (int i = 0; i < n; i++) {\n            total = total + bons[i];\n            if (categories[i] >= 1 && categories[i] <= 4) {\n                parCategorie[categories[i]] = parCategorie[categories[i]] + bons[i];\n            }\n            if (!recycles[i]) {\n                acceptes = acceptes + 1;\n            }\n        }\n        total = Math.round(total * 100) / 100.0;\n\n        double moyen = 0.0;\n        int auDessus = 0;\n        if (acceptes > 0) {\n            moyen = Math.round(total / acceptes * 100) / 100.0;\n            // Second parcours : impossible hier, ou les bons avaient disparu\n            // au fur et a mesure. C'est exactement ce que le tableau apporte.\n            for (int i = 0; i < n; i++) {\n                if (!recycles[i] && bons[i] > moyen) {\n                    auDessus = auDessus + 1;\n                }\n            }\n        }\n\n        String[] noms = {\"\", \"meuble\", \"électroménager\", \"livre\", \"vêtement\"};\n\n        System.out.println();\n        System.out.println(\"=== Clôture de la matinée ===\");\n        System.out.println(\"Bénévole : \" + benevole);\n        System.out.println(\"Dépôts enregistrés : \" + n + \", dont \" + acceptes + \" avec
