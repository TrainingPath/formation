  theory: `
<h3>1. Rappel : une String est IMMUABLE</h3>
<p><strong>Immuable</strong> signifie « qui ne peut pas changer après sa création » — comme un livre déjà imprimé : pour corriger une phrase, tu réimprimes un nouveau livre, tu ne ratures pas l'ancien. En Java, une <code>String</code> est immuable : toutes ses méthodes qui « modifient » renvoient en réalité une NOUVELLE String et laissent l'ancienne intacte.</p>
<pre class="pseudo">String jeu = "catan";                 // le texte « catan »
jeu.toUpperCase();                    // crée « CATAN »... mais ne l'affecte à rien : perdu !
System.out.println(jeu);              // affiche toujours « catan » : l'original n'a pas bougé
jeu = jeu.toUpperCase();              // CORRECT : on réaffecte le nouveau texte à la variable</pre>
<div class="warn">Le piège classique : croire que <code>jeu.toUpperCase()</code> modifie <code>jeu</code>. Non ! Il faut RÉAFFECTER : <code>jeu = jeu.toUpperCase()</code>. Même logique que les <code>LocalDate</code> de la leçon 19.</div>

<h3>2. Pourquoi l'immutabilité est une bonne chose</h3>
<p>Une valeur qui ne change jamais est <strong>prévisible</strong> et sûre : personne ne peut la modifier dans ton dos. On peut la partager entre plusieurs parties du programme (et même entre threads, leçon 29) sans risque. Java en profite pour réutiliser en mémoire les String identiques (le « pool de chaînes »).</p>
<div class="tip">Un objet immuable est comme une pièce de monnaie : sa valeur est gravée. Tu peux la prêter à dix personnes, aucune ne peut en changer la valeur. C'est ce qui rend le partage sans danger.</div>

<h3>3. Le problème : concaténer dans une boucle</h3>
<p>Comme chaque <code>+</code> sur des String crée un NOUVEAU texte, additionner du texte dans une boucle fabrique des quantités d'objets intermédiaires jetés aussitôt : c'est lent et gaspilleur.</p>
<pre class="pseudo">String liste = "";                        // texte de départ (vide)
for (int i = 0; i &lt; 1000; i++) {          // mille tours
    liste = liste + i + ", ";             // à CHAQUE tour, un NOUVEAU String complet est recréé !
}                                         // -> ~1000 objets temporaires : coûteux</pre>

<h3>4. La solution : StringBuilder, un tableau blanc réinscriptible</h3>
<p><code>StringBuilder</code> est un constructeur de texte MUTABLE (modifiable) : au lieu de recréer le texte à chaque ajout, il écrit sur un « tableau blanc » qu'on efface et complète à volonté. On n'imprime le livre final qu'à la toute fin, avec <code>toString()</code>.</p>
<pre class="pseudo">StringBuilder sb = new StringBuilder();   // un tableau blanc, vide au départ
for (int i = 0; i &lt; 1000; i++) {          // mille tours
    sb.append(i).append(", ");            // append AJOUTE sur place, sans recréer d'objet
}                                         // rapide : un seul tampon interne qui grandit
String resultat = sb.toString();          // on « imprime » le texte final une seule fois</pre>
<div class="tip"><code>append</code> renvoie le StringBuilder lui-même, ce qui permet de CHAÎNER : <code>sb.append("a").append("b")</code>. C'est le « chaînage de méthodes ».</div>

<h3>5. Les méthodes utiles de StringBuilder</h3>
<pre class="pseudo">sb.append("texte")        // ajoute à la fin
sb.insert(0, "début : ")  // insère à la position 0 (au début)
sb.reverse()              // inverse tout le contenu
sb.length()               // longueur actuelle du texte
sb.deleteCharAt(2)        // supprime le caractère à l'indice 2
sb.toString()             // convertit le tampon en String définitive (immuable)</pre>

<h3>6. Quand utiliser quoi ?</h3>
<pre class="pseudo">// Peu de concaténations, code simple : le + suffit largement
String message = "Bonjour " + nom + " !";        // parfaitement acceptable

// Beaucoup d'ajouts, surtout dans une BOUCLE : StringBuilder
StringBuilder sb = new StringBuilder();           // tampon efficace
for (String jeu : jeux) sb.append(jeu).append("\\n"); // ajout répété sans gaspillage</pre>
<div class="warn">Ne sur-optimise pas : pour deux ou trois <code>+</code>, garde la simplicité de la String. StringBuilder brille dans les BOUCLES et les gros assemblages de texte.</div>

<h3>7. En résumé</h3>
<p>La <strong>String</strong> est immuable : sûre, partageable, mais coûteuse à assembler en masse. Le <strong>StringBuilder</strong> est mutable : idéal pour construire du texte morceau par morceau. Choisis l'outil selon le besoin, et n'oublie jamais de RÉAFFECTER quand tu « modifies » une String.</p>`,

      "enonce": "Le comité des fêtes vend des billets de tombola à 2,50 € pièce. Un numéro de billet s'écrit deux lettres de série, un tiret, quatre chiffres — les zéros de tête étant obligatoires. Décris le billet par une fiche cartonnée à trois champs — numéro, acheteur, prix en centimes — et écris deux fonctions d'assemblage : l'une fabrique un numéro à partir d'une série et d'un rang, l'autre compose une ligne de souche en colonnes, le numéro sur douze caractères, l'acheteur suivi de points de conduite jusqu'à vingt, puis le prix en euros à deux décimales. Fabrique un billet pour chacun des acheteurs Verlinden, Ba, Della Faille, Ntumba et Oger, à partir du rang 7. Affiche les souches, vérifie par un motif que tous les numéros fabriqués ont la forme annoncée, et montre qu'un numéro sans zéros de tête ne l'aurait pas. Compose ensuite le carnet complet — titre, ligne de séparation, souches, ligne de séparation, recette totale — sur un seul tableau blanc, et affiche-le. Démontre alors que passer un tableau blanc à une méthode qui écrit dedans modifie l'original, tandis que passer un texte à une méthode qui le rallonge ne change rien chez l'appelant. Corrige enfin une en-tête par insertion et ajout, et désigne le premier billet du carnet avec un juge de la leçon 25.",
      "principe": "Un tableau blanc est un objet modifiable : le donner à quelqu'un, c'est lui donner le droit de le raturer. Un texte est une valeur : le donner, c'est en donner une copie que rien ne peut altérer. Toute la différence de comportement entre les deux tient là, et elle décide de ce qu'on peut partager sans y penser.",

      "reflexion": "Les prix sont stockés en centimes, sous forme d'entiers, et convertis en euros seulement à l'affichage. Ce choix traverse tout le programme. Cherche au moins deux raisons de le faire, puis une situation où il devient insuffisant — et dis ce qu'on emploie dans ce cas.",
      "remarque": "Les points de conduite de la souche sont calculés à partir de la longueur du nom, avec un minimum d'un point. Ce minimum n'est pas une précaution cosmétique : sans lui, un nom de plus de vingt caractères demanderait une répétition négative, ce qui lève une exception à l'exécution. Les valeurs négatives sont le premier endroit où regarder quand un calcul de mise en page plante.",
      "indices": [
        "Note d'abord ce que chaque fonction doit rendre, et surtout ce qu'elle ne doit pas faire. La fabrique de numéro rend un texte et n'affiche rien. La composition de souche rend un texte et n'affiche rien. C'est le programme principal qui affiche. Cette séparation paraît formelle ; elle est ce qui rendra le programme testable après-demain.",
        "Le plan : la fiche du billet ; le motif du numéro ; les deux fonctions d'assemblage ; la liste des acheteurs et la boucle de fabrication ; l'affichage des souches et le contrôle des formes ; la composition du carnet ; la démonstration sur le partage ; la correction d'en-tête ; le juge et les deux dernières questions.",
        "Pour les zéros de tête, ne cherche pas d'outil savant : convertis le rang en texte, regarde combien de chiffres il compte, et complète par autant de zéros qu'il en manque pour arriver à quatre. C'est la même arithmétique que les points de conduite de l'exercice précédent, appliquée à des zéros.",
        "Le point dur est la démonstration du partage, parce qu'elle demande d'écrire une méthode qui ne sert à rien. Écris-en deux : l'une reçoit un tableau blanc et lui ajoute une mention ; l'autre reçoit un texte et tente de le rallonger en réaffectant son paramètre. Appelle les deux, affiche les deux variables d'origine, et constate. La seconde méthode ne provoque aucune erreur de compilation — elle est simplement sans effet, ce qui est bien plus instructif qu'une erreur.",

      ],
      "solution": "// La tombola du comité des fêtes : fabriquer, verifier et imprimer des billets.\nimport java.util.ArrayList;\nimport java.util.Comparator;\nimport java.util.List;\nimport java.util.Optional;\nimport java.util.stream.Collectors;\n\npublic class Tombola {\n\n    record Billet(String numero, String acheteur, int prixCents) { }\n\n    // Un numero de billet : deux lettres de serie, un tiret, quatre chiffres.\n    static final String NUMERO = \"[A-Z]{2}-\\\\d{4}\";\n\n    // Le numero se fabrique par assemblage, pas par concatenation dispersee.\n    static String numeroDe(String serie, int rang) {\n        StringBuilder n = new StringBuilder();\n        n.append(serie).append(\"-\");\n        String chiffres = String.valueOf(rang);\n        n.append(\"0\".repeat(4 - chiffres.length())).append(chiffres);\n        return n.toString();\n    }\n\n    // Une ligne de souche, en colonnes, sans autre outil que le tampon.\n    static String souche(Billet b) {\n        StringBuilder l = new StringBuilder();\n        l.append(b.numero());\n        l.append(\" \".repeat(12 - b.numero().length()));\n        l.append(b.acheteur());\n        l.append(\".\".repeat(Math.max(1, 20 - b.acheteur().length())));\n        l.append(String.format(\"%.2f\", b.prixCents() / 100.0)).append(\" €\");\n        return l.toString();\n    }\n\n    public static void main(String[] args) {\n        ArrayList<String> acheteurs = new ArrayList<>();\n        acheteurs.add(\"Verlinden\");\n        acheteurs.add(\"Ba\");\n        acheteurs.add(\"Della Faille\");\n        acheteurs.add(\"Ntumba\");\n        acheteurs.add(\"Oger\");\n\n        // Fabrication : un billet par acheteur, numerotes a la suite.\n        ArrayList<Billet> billets = new ArrayList<>();\n        int rang = 7;\n        for (String a : acheteurs) {\n            billets.add(new Billet(numeroDe(\"TB\", rang), a, 250));\n            rang = rang + 1;\n        }\n\n        System.out.println(\"--- Souches ---\");\n        billets.forEach(b -> System.out.println(\"  \" + souche(b)));\n\n        // Tous les numeros fabriques doivent avoir la forme annoncee.\n        long conformes = billets.stream().filter(b -> b.numero().matches(NUMERO)).count();\n        System.out.println(\"Numéros conformes : \" + conformes + \" sur \" + billets.size());\n        System.out.println(\"« TB-7 » serait-il conforme ? \" + \"TB-7\".matches(NUMERO));\n\n        // Le carnet complet : une seule chaine, assemblee en une passe.\n        StringBuilder carnet = new StringBuilder();\n        carnet.append(\"TOMBOLA DU COMITÉ DES FÊTES\\n\");\n        carnet.append(\"=\".repeat(38)).append(\"\\n\");\n        for (Billet b : billets) {\n            carnet.append(souche(b)).append(\"\\n\");\n        }\n        carnet.append(\"=\".repeat(38)).append(\"\\n\");\n        int recette = billets.stream().mapToInt(b -> b.prixCents()).sum();\n        carnet.append(\"Recette : \").append(String.format(\"%.2f\", recette / 100.0)).append(\" €\");\n        System.out.println();\n        System.out.println(carnet.toString());\n\n        // Le tampon est MUTABLE : le passer a une methode qui l'ecrit, c'est\n        // accepter qu'elle le modifie. Le texte, lui, ne risque rien.\n        StringBuilder partage = new StringBuilder(\"brouillon\");\n        ajouterMention(partage);\n        System.out.println();\n        System.out.println(\"Après passage dans une méthode : \" + partage.toString());\n        String texte = \"brouillon\";\n        ajouterMentionInutile(texte);\n        System.out.println(\"Le texte, lui : \" + texte);\n\n        // Une correction de derniere minute : le tampon s'edite, le texte se refait.\n        StringBuilder entete = new StringBuilder(\"TOMBOLA DU COMITE DES FETES\");\n        entete.insert(0, \"★ \").append(\" ★\");\n        System.out.println(\"En-tête corrigée : \" + entete.toString());\n        System.out.println(\"Longueur : \" + entete.length());\n\n        // Le billet gagnant, designe par un juge de la lecon 25.\n        Comparator<Billet> parNumero = Comparator.comparing(Billet::numero);\n        Optional<Billet> premier = billets.stream().sorted(parNumero).findFirst();\n        System.out.println();\n        System.out.println(\"Premier billet du carnet : \"\n                + premier.map(b -> b.numero() + \" (\" + b.acheteur() + \")\").orElse(\"carnet vide\"));\n\n        // Les souches en une liste de textes, pour un envoi par courriel.\n        List<String> lignes = billets.stream()\n                .filter(b -> b.acheteur().length() > 4)\n                .map(b -> souche(b))\n                .collect(Collectors.toList());\n        System.out.println(\"Souches des noms longs : \" + lignes.size());\n    }\n\n    static void ajouterMention(StringBuilder tampon) {\n        tampon.append(\" — relu\");\n    }\n\n    static void ajouterMentionInutile(String texte) {\n        texte = texte + \" — relu\";\n    }\n}",

      "hier": "lecon26.html",
      "enonce": "L'affiche de la bourse doit partir chez l'imprimeur. Reprends sans les modifier la fiche du vélo, la liste fermée des états, la fiche d'inscription, les motifs et les quatre juges nommés des deux jours précédents, et travaille sur le hangar complété : les cinq vélos du jour 1 plus les deux inscriptions acceptées du jour 2. Écris une fonction de colonne qui complète un texte à une largeur donnée en tronquant s'il déborde, une fonction qui compose la ligne d'un vélo — code sur treize, modèle sur vingt, taille sur cinq, propriétaire sur treize, prix aligné à droite — et une fonction qui compose une étiquette encadrée à coller sur le guidon. Compose ensuite l'affiche entière sur un <strong>seul</strong> tableau blanc, de haut en bas : un filet, le titre centré sur soixante caractères, un filet, puis une section par état — dans l'ordre neuf, bon, usé — chacune titrée avec son effectif et remplie du plus cher au moins cher, puis un filet et un pied de page donnant le nombre de vélos, la valeur totale et la mention « entrée libre ». Fige l'affiche en texte, affiche-la, donne sa longueur et son nombre de lignes. Prouve enfin que la même liste assemblée par concaténation donne le même texte, imprime l'étiquette du vélo le plus cher, montre qu'un remplacement non affecté sur le texte figé ne change rien, et termine par l'index des propriétaires, le plus grand cadre, la validité du courriel du vendeur et le compte des codes conformes.",
      "principe": "Un document se compose du haut vers le bas, sur un seul tampon, et ne devient un texte qu'à la toute fin. Cet ordre n'est pas une préférence d'écriture : il fait qu'aucune partie du document n'est recopiée deux fois, et il rend le résultat définitivement immuable au moment précis où il part chez l'imprimeur.",
      "reflexion": "Les trois sections de l'affiche sont produites par une boucle sur les trois états, chacune ouvrant une chaîne de traitement sur le hangar entier. Le hangar est donc parcouru trois fois. Propose une manière de n'y passer qu'une seule fois avec les outils dont tu disposes, évalue ce qu'elle coûte en lisibilité, et dis à partir de quelle taille de hangar tu changerais d'avis.",
      "remarque": "La fonction de colonne tronque les textes trop longs, ce qui mutile silencieusement un modèle au nom à rallonge. C'est le choix habituel des mises en page à largeur fixe, et il est mauvais : le lecteur de l'affiche ne saura jamais qu'il manque quelque chose. Signaler la troncature par un caractère convenu coûterait une ligne et rendrait la perte visible.",
      "indices": [
        "Regarde l'affiche finale comme un empilement de blocs : filet, titre, filet, puis trois blocs identiques à un état près, puis filet, puis pied de page. Écris cette liste sur ton brouillon — c'est exactement la suite des ajouts que ton programme fera, dans cet ordre. Un document composé de haut en bas se code de haut en bas.",
        "Le plan : les déclarations des jours 1 et 2, recopiées ; la constante de largeur ; les fonctions de colonne, de ligne et d'étiquette ; le hangar complété ; les quatre juges ; la composition de l'affiche sur un tampon ; le figeage et les mesures ; puis les quatre démonstrations finales.",
        "Pour la section d'un état, filtre le hangar sur cet état, trie du plus cher au moins cher, et ajoute une ligne par vélo. Le titre de section a besoin de l'effectif : range donc le résultat du filtrage dans une liste avant de l'écrire, plutôt que d'ouvrir deux chaînes — une chaîne consommée ne se recompte pas, c'est la leçon 22 et elle sert encore.",
        "Le point dur est le centrage du titre et la largeur des filets, parce que tout dépend d'une seule constante. Déclare cette largeur une fois, en constante nommée, et exprime tout le reste par rapport à elle : la marge de centrage est la moitié de ce qui reste une fois le titre posé, et la longueur du filet de section est la largeur moins ce que le titre de section occupe déjà. Si tu écris des nombres en dur, ton affiche se disloquera au premier changement de format — essaie de passer la largeur de soixante à soixante-dix pour t'en convaincre.",
        "Ton fichier ressemble à ceci :<br><code>static final int LARGEUR = 60;</code><br><code>static String colonne(String texte, int largeur) {</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;if (texte.length() &gt;= …) { return texte.substring(0, …) + \" \"; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;return texte + \" \".repeat(largeur - …);</code><br><code>}</code><br><code>affiche.append(\"═\".repeat(LARGEUR)).append(\"\\\\n\");</code><br><code>for (Etat etat : new Etat[] {Etat.NEUF, …, …}) {</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;List&lt;Velo&gt; lot = hangar.stream().filter(v -&gt; v.etat() == …)</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;.sorted(parPrix.…()).collect(Collectors.…);</code><br><code>String documentFinal = ….toString();</code> ← le figeage<br><code>documentFinal.split(\"\\\\n\").length</code>"
      ],
      "solution": "// La bourse aux velos - jour 3 sur 4 : l'affiche imprimable.\n// La fiche du velo, la liste fermee, les quatre juges et les motifs des jours\n// precedents ne bougent pas. Ce qui est neuf, c'est la composition du document.\nimport java.util.ArrayList;\nimport java.util.Comparator;\nimport java.util.List;\nimport java.util.Optional;\nimport java.util.stream.Collectors;\n\npublic class BourseAuxVelos {\n\n    record Velo(String code, String proprietaire, String modele, int taille,\n                int prixEuros, Etat etat) { }\n\n    enum Etat { NEUF, BON, USE }\n\n    record Inscription(Velo velo, String courriel) { }\n\n    static final String CODE = \"BV-\\\\d{4}-\\\\d{3}\";\n    static final String COURRIEL = \"[a-z0-9._-]+@[a-z0-9-]+\\\\.[a-z]{2,4}\";\n\n    static final int LARGEUR = 60;\n\n    static String colonne(String texte, int largeur) {\n        if (texte.length() >= largeur) {\n            return texte.substring(0, largeur - 1) + \" \";\n        }\n        return texte + \" \".repeat(largeur - texte.length());\n    }\n\n    static String ligneVelo(Velo v) {\n        StringBuilder l = new StringBuilder();\n        l.append(colonne(v.code(), 13));\n        l.append(colonne(v.modele(), 20));\n        l.append(colonne(\"T\" + v.taille(), 5));\n        l.append(colonne(v.proprietaire(), 13));\n        String prix = v.prixEuros() + \" €\";\n        l.append(\" \".repeat(Math.max(1, 8 - prix.length()))).append(prix);\n        return l.toString();\n    }\n\n    static String etiquette(Velo v) {\n        StringBuilder e = new StringBuilder();\n        e.append(\"┌\").append(\"─\".repeat(24)).append(\"┐\\n\");\n        e.append(\"│ \").append(colonne(v.code(), 23)).append(\"│\\n\");\n        e.append(\"│ \").append(colonne(v.prixEuros() + \" €\", 23)).append(\"│\\n\");\n        e.append(\"└\").append(\"─\".repeat(24)).append(\"┘\");\n        return e.toString();\n    }\n\n    public static void main(String[] args) {\n        ArrayList<Velo> hangar = new ArrayList<>();\n        hangar.add(new Velo(\"BV-2026-004\", \"Lambert\", \"Gitane Tour\", 54, 180, Etat.BON));\n        hangar.add(new Velo(\"BV-2026-001\", \"Nzeyimana\", \"Peugeot PX10\", 58, 320, Etat.BON));\n        hangar.add(new Velo(\"BV-2026-003\", \"Declercq\", \"Btwin Riverside\", 50, 95, Etat.USE));\n        hangar.add(new Velo(\"BV-2026-005\", \"Lambert\", \"Ridley Fenix\", 54, 640, Etat.NEUF));\n        hangar.add(new Velo(\"BV-2026-002\", \"Haddad\", \"Motobécane C4\", 58, 180, Etat.USE));\n        hangar.add(new Velo(\"BV-2026-006\", \"Peeters\", \"Trek FX2\", 56, 240, Etat.BON));\n        hangar.add(new Velo(\"BV-2026-007\", \"Sow\", \"Brompton M3L\", 50, 890, Etat.NEUF));\n\n        // Les quatre juges des jours 1 et 2, mot pour mot.\n        Comparator<Velo> parPrix = Comparator.comparingInt(Velo::prixEuros);\n        Comparator<Velo> parTaille = Comparator.comparingInt(Velo::taille);\n        Comparator<Velo> parProprietaire = Comparator.comparing(Velo::proprietaire);\n        Comparator<Velo> parEtat = Comparator.comparingInt(v -> v.etat().ordinal());\n\n        // L'affiche entiere est composee sur UN tampon, du haut vers le bas.\n        StringBuilder affiche = new StringBuilder();\n        affiche.append(\"═\".repeat(LARGEUR)).append(\"\\n\");\n        affiche.append(centrer(\"BOURSE AUX VÉLOS — SAMEDI 12 SEPTEMBRE\")).append(\"\\n\");\n        affiche.append(\"═\".repeat(LARGEUR)).append(\"\\n\");\n\n        for (Etat etat : new Etat[] {Etat.NEUF, Etat.BON, Etat.USE}) {\n            List<Velo> lot = hangar.stream()\n                    .filter(v -> v.etat() == etat)\n                    .sorted(parPrix.reversed())\n                    .collect(Collectors.toList());\n            affiche.append(\"\\n\").append(\"— \").append(etat).append(\" (\").append(lot.size())\n                    .append(\") \").append(\"—\".repeat(LARGEUR - 8 - etat.name().length()))\n                    .append(\"\\n\");\n            for (Velo v : lot) {\n                affiche.append(ligneVelo(v)).append(\"\\n\");\n            }\n        }\n\n        int total = hangar.stream().mapToInt(v -> v.prixEuros()).sum();\n        affiche.append(\"\\n\").append(\"═\".repeat(LARGEUR)).append(\"\\n\");\n        affiche.append(hangar.size()).append(\" vélos · \").append(total).append(\" € au total · \")\n                .append(\"entrée libre\").append(\"\\n\");\n\n        // Le document fini devient un texte immuable : il peut circuler sans risque.\n        String documentFinal = affiche.toString();\n        System.out.println(documentFinal);\n\n        System.out.println(\"Longueur de l'affiche : \" + documentFinal.length() + \" caractères\");\n        System.out.println(\"Lignes : \" + documentFinal.split(\"\\n\").length);\n\n        // Le meme contenu par concatenation : identique, mais paye en objets jetes.\n        String parConcatenation = \"\";\n        for (Velo v : hangar) {\n            parConcatenation = parConcatenation + ligneVelo(v) + \"\\n\";\n        }\n        StringBuilder parTampon = new StringBuilder();\n        for (Velo v : hangar) {\n            parTampon.append(ligneVelo(v)).append(\"\\n\");\n        }\n        System.out.println(\"Les deux assemblages donnent-ils le même texte ? \"\n                + parConcatenation.equals(parTampon.toString()));\n\n        // Une etiquette a coller sur le guidon.\n        Optional<Velo> plusCher = hangar.stream().sorted(parPrix.reversed()).findFirst();\n        System.out.println();\n        System.out.println(plusCher.map(v -> etiquette(v)).orElse(\"aucun vélo à étiqueter\"));\n\n        // Le tampon se corrige sur place ; le texte fini, jamais.\n        StringBuilder brouillon = new StringBuilder(\"BOURSE AUX VELOS\");\n        brouillon.insert(0, \"★ \").append(\" ★\");\n        System.out.println();\n        System.out.println(\"Brouillon corrigé : \" + brouillon.toString());\n        String fige = brouillon.toString();\n        fige.replace(\"★\", \"☆\");\n        System.out.println(\"Le texte figé après un remplacement non affecté : \" + fige);\n\n        // Les autres juges servent l'index de fin d'affiche.\n        System.out.println();\n        System.out.println(\"Index par propriétaire : \" + hangar.stream().sorted(parProprietaire)\n                .map(v -> v.proprietaire()).collect(Collectors.toList()));\n        System.out.println(\"Plus grand cadre : \" + hangar.stream().sorted(parTaille.reversed())\n                .findFirst().map(v -> \"T\" + v.taille()).orElse(\"—\"));\n        Inscription contact = new Inscription(hangar.get(6), \"a.sow@ulb.be\");\n        System.out.println(\"Contact du vendeur : \" + contact.courriel()\n                + \" (forme valide : \" + contact.courriel().matches(COURRIEL) + \")\");\n        System.out.println(\"Codes conformes : \"\n                + hangar.stream().filter(v -> v.code().matches(CODE)).count() + \"/\" + hangar.size());\n    }\n\n    static String centrer(String texte) {\n        int marge = (LARGEUR - texte.length()) / 2;\n        StringBuilder c = new StringBuilder();\n        c.append(\" \".repeat(Math.max(0, marge))).append(texte);\n        return c.toString();\n    }\n}",
      "pourquoi": "Le remplacement appliqué au texte figé ne change rien, et c'est précisément ce qu'on attend d'un document parti à l'impression : plus personne ne peut le modifier, même par accident, même en croyant bien faire. Le tampon était modifiable tant que le document se construisait ; le figeage marque le moment où cette liberté cesse d'être utile et devient un risque. Choisir quand figer, c'est choisir quand la discussion est close.",
      "tests": [
        {
          "code": "assert 'BOURSE AUX VÉLOS — SAMEDI 12 SEPTEMBRE' in __output__ and '— NEUF (2) ' in __output__ and '— BON (3) ' in __output__ and '— USE (2) ' in __output__",
          "label": "L'affiche porte son titre et ses trois sections avec les bons effectifs"
        },
        {
          "code": "i = __output__.index('— NEUF'); bloc = __output__[i:i+400]; assert bloc.index('BV-2026-007') < bloc.index('BV-2026-005') and 'BV-2026-007  Brompton M3L        T50  Sow             890 €' in __output__",
          "label": "Les colonnes sont alignées et chaque section va du plus cher au moins cher"
        },
        {
          "code": "assert '7 vélos · 2545 € au total · entrée libre' in __output__ and 'Lignes : 19' in __output__",
          "label": "Le pied de page et le nombre de lignes du document sont exacts"
        },
        {
          "code": "assert 'Les deux assemblages donnent-ils le même texte ? true' in __output__ and '┌────────────────────────┐' in __output__ and '│ BV-2026-007            │' in __output__",
          "label": "Les deux assemblages concordent et l'étiquette est correctement encadrée"
        },
        {
          "code": "assert 'Index par propriétaire : [Declercq, Haddad, Lambert, Lambert, Nzeyimana, Peeters, Sow]' in __output__ and 'Plus grand cadre : T58' in __output__ and 'forme valide : true' in __output__ and 'Codes conformes : 7/7' in __output__",
          "label": "Les juges et les motifs des jours précédents servent encore sans retouche"
        }
      ],
      "checklist": [
        "Ton affiche est-elle composée sur un seul tampon ? Si tu en as plusieurs que tu assembles à la fin, tu as reconstruit le problème que le tampon résout.",
        "Change la largeur de soixante à soixante-dix : l'affiche reste-t-elle cohérente ? Sinon, cherche les nombres écrits en dur.",
        "Tes fonctions de composition affichent-elles quelque chose, ou rendent-elles toutes un texte ? Une seule qui affiche suffit à rendre l'ensemble intestable.",
        "Le hangar est-il parcouru trois fois ou une seule ? Compte les chaînes que tu ouvres dessus, puis relis la question de réflexion.",
        "Un modèle nommé « Vélo tout-chemin à assistance électrique » passerait-il dans la colonne des vingt caractères ? Essaie et regarde ce que le lecteur verrait."
      ],
      "note": "Demain, dernier jour de la série : rien de neuf ne sera ajouté à la bourse. On écrira à la place le banc d'essai qui vérifie, sans intervention humaine, que tout ce que tu as construit en trois jours fait bien ce que tu crois — et c'est là que la séparation entre les fonctions qui composent et le programme qui affiche prendra tout son sens."
    }
  ]

      "solution": "public class Etiquettes {                                 // classe principale\n\n    public static String etiquette(String[] noms) {      // assemble les noms en une chaine\n        StringBuilder sb = new StringBuilder();          // tampon mutable, vide au depart\n        for (String nom : noms) {                        // parcours de chaque nom\n            sb.append(\"[\").append(nom).append(\"]\");      // ajoute [nom] sur place (chainage)\n        }                                                // aucun String temporaire cree inutilement\n        return sb.toString();                            // fige le tampon en String finale\n    }                                                    // fin de la methode\n\n    public static void main(String[] args) {             // point d'entree\n        String[] jeux = {\"Uno\", \"Catan\", \"Risk\"};        // tableau de noms\n        System.out.println(etiquette(jeux));             // affiche [Uno][Catan][Risk]\n    }                                                    // fin de main\n}                                                        // fin de la classe",
      "note": "append renvoie le StringBuilder lui-même, ce qui permet de chaîner les appels. Un seul tampon grandit au fil de la boucle, au lieu de recréer une String à chaque tour comme le ferait l'opérateur +.",
