  title: "Immutabilité et StringBuilder",
  subtitle: "Pourquoi une String ne change jamais, et comment construire du texte efficacement sans gaspiller.",
  theory: `
<h3>1. Rappel : une String est IMMUABLE</h3>
<p><strong>Immuable</strong> signifie « qui ne peut pas changer après sa création » — comme un livre déjà imprimé : pour corriger une phrase, tu réimprimes un nouveau livre, tu ne ratures pas l'ancien. En Java, une <code>String</code> est immuable : toutes ses méthodes qui « modifient » renvoient en réalité une NOUVELLE String et laissent l'ancienne intacte.</p>
<pre class="pseudo">String jeu = "catan";                 // le texte « catan »
jeu.toUpperCase();                    // crée « CATAN »... mais ne l'affecte à rien : perdu !
System.out.println(jeu);              // affiche toujours « catan » : l'original n'a pas bougé
jeu = jeu.toUpperCase();              // CORRECT : on réaffecte le nouveau texte à la variable</pre>
<div class="warn">Le piège classique : croire que <code>jeu.toUpperCase()</code> modifie <code>jeu</code>. Non ! Il faut RÉAFFECTER : <code>jeu = jeu.toUpperCase()</code>. Même logique que les <code>LocalDate</code> de la leçon 19.</div>

<h3>2. Pourquoi l'immutabilité est une bonne chose</h3>
<p>Une valeur qui ne change jamais est <strong>prévisible</strong> et sûre : personne ne peut la modifier dans ton dos. On peut la partager entre plusieurs parties du programme (et même entre threads, leçon 29) sans risque. Java en profite pour réutiliser en mémoire les String identiques (le « pool de chaînes »).</p>
<div class="tip">Un objet immuable est comme une pièce de monnaie : sa valeur est gravée. Tu peux la prêter à dix personnes, aucune ne peut en changer la valeur. C'est ce qui rend le partage sans danger.</div>

<h3>3. Le problème : concaténer dans une boucle</h3>
<p>Comme chaque <code>+</code> sur des String crée un NOUVEAU texte, additionner du texte dans une boucle fabrique des quantités d'objets intermédiaires jetés aussitôt : c'est lent et gaspilleur.</p>
<pre class="pseudo">String liste = "";                        // texte de départ (vide)
for (int i = 0; i &lt; 1000; i++) {          // mille tours
    liste = liste + i + ", ";             // à CHAQUE tour, un NOUVEAU String complet est recréé !
}                                         // -> ~1000 objets temporaires : coûteux</pre>

<h3>4. La solution : StringBuilder, un tableau blanc réinscriptible</h3>
<p><code>StringBuilder</code> est un constructeur de texte MUTABLE (modifiable) : au lieu de recréer le texte à chaque ajout, il écrit sur un « tableau blanc » qu'on efface et complète à volonté. On n'imprime le livre final qu'à la toute fin, avec <code>toString()</code>.</p>
<pre class="pseudo">StringBuilder sb = new StringBuilder();   // un tableau blanc, vide au départ
for (int i = 0; i &lt; 1000; i++) {          // mille tours
    sb.append(i).append(", ");            // append AJOUTE sur place, sans recréer d'objet
}                                         // rapide : un seul tampon interne qui grandit
String resultat = sb.toString();          // on « imprime » le texte final une seule fois</pre>
<div class="tip"><code>append</code> renvoie le StringBuilder lui-même, ce qui permet de CHAÎNER : <code>sb.append("a").append("b")</code>. C'est le « chaînage de méthodes ».</div>

<h3>5. Les méthodes utiles de StringBuilder</h3>
<pre class="pseudo">sb.append("texte")        // ajoute à la fin
sb.insert(0, "début : ")  // insère à la position 0 (au début)
sb.reverse()              // inverse tout le contenu
sb.length()               // longueur actuelle du texte
sb.deleteCharAt(2)        // supprime le caractère à l'indice 2
sb.toString()             // convertit le tampon en String définitive (immuable)</pre>

<h3>6. Quand utiliser quoi ?</h3>
<pre class="pseudo">// Peu de concaténations, code simple : le + suffit largement
String message = "Bonjour " + nom + " !";        // parfaitement acceptable

// Beaucoup d'ajouts, surtout dans une BOUCLE : StringBuilder
StringBuilder sb = new StringBuilder();           // tampon efficace
for (String jeu : jeux) sb.append(jeu).append("\\n"); // ajout répété sans gaspillage</pre>
<div class="warn">Ne sur-optimise pas : pour deux ou trois <code>+</code>, garde la simplicité de la String. StringBuilder brille dans les BOUCLES et les gros assemblages de texte.</div>

<h3>7. En résumé</h3>
<p>La <strong>String</strong> est immuable : sûre, partageable, mais coûteuse à assembler en masse. Le <strong>StringBuilder</strong> est mutable : idéal pour construire du texte morceau par morceau. Choisis l'outil selon le besoin, et n'oublie jamais de RÉAFFECTER quand tu « modifies » une String.</p>`,
  exercises: [
    { type: "qcm", q: "Que signifie « immuable » ?", opts: ["Rapide", "Qui ne peut pas changer après création", "Vide", "Privé"], a: 1, exp: "Comme un livre imprimé : figé une fois créé." },

    { type: "qcm", q: "Comment mettre réellement <code>jeu</code> en majuscules ?", opts: ["jeu.toUpperCase();", "jeu = jeu.toUpperCase();", "toUpperCase(jeu);", "jeu.upper();"], a: 1, exp: "Réaffecter le résultat à la variable." },
    { type: "vf", q: "L'immutabilité rend une valeur partageable sans risque qu'on la modifie dans notre dos.", a: true, exp: "Prévisible et sûre : un atout, pas une contrainte." },

    { type: "qcm", q: "Qu'est-ce qu'un <code>StringBuilder</code> ?", opts: ["Une String plus longue", "Un constructeur de texte MUTABLE (modifiable sur place)", "Une liste", "Un nombre"], a: 1, exp: "Un tableau blanc réinscriptible pour assembler du texte." },
    { type: "qcm", q: "Que fait <code>sb.append(\"a\")</code> ?", opts: ["Remplace tout par a", "Ajoute « a » à la fin, sur place", "Crée un nouveau StringBuilder", "Efface sb"], a: 1, exp: "append complète le tampon existant." },
    { type: "qcm", q: "Pourquoi peut-on écrire <code>sb.append(\"a\").append(\"b\")</code> ?", opts: ["Par hasard", "append renvoie le StringBuilder lui-même : on chaîne les appels", "C'est interdit", "append renvoie une String"], a: 1, exp: "Le chaînage de méthodes retourne le même objet." },
    { type: "qcm", q: "Comment obtenir le texte final d'un StringBuilder ?", opts: ["sb.print()", "sb.toString()", "sb.value()", "sb.get()"], a: 1, exp: "toString() fige le contenu en String immuable." },
    { type: "qcm", q: "<code>sb.reverse()</code> fait quoi ?", opts: ["trie le texte", "inverse l'ordre des caractères", "met en majuscules", "vide sb"], a: 1, exp: "Le contenu est retourné." },
    { type: "qcm", q: "Dans quel cas StringBuilder est-il le plus utile ?", opts: ["Pour deux + simples", "Pour de nombreux ajouts, surtout dans une BOUCLE", "Jamais", "Pour trier"], a: 1, exp: "Il évite les milliers d'objets temporaires des boucles." },
    { type: "vf", q: "Pour concaténer seulement 2 ou 3 morceaux, le simple <code>+</code> suffit.", a: true, exp: "Inutile de sur-optimiser : garde la simplicité." },
    { type: "qcm", q: "<code>sb.insert(0, \"Debut : \")</code> :", opts: ["ajoute à la fin", "insère au début (indice 0)", "supprime le début", "inverse"], a: 1, exp: "insert place le texte à la position donnée." },
    { type: "vf", q: "Le résultat de <code>sb.toString()</code> est, lui, immuable.", a: true, exp: "Une fois fige en String, il ne change plus." },
    { type: "qcm", q: "Java réutilise en mémoire les String identiques grâce à…", opts: ["StringBuilder", "au « pool de chaînes », rendu possible par l'immutabilité", "aux threads", "aux lambdas"], a: 1, exp: "Comme les String ne changent pas, elles se partagent sans danger." }
  ],
  final: {
    title: "Exercice final — Construire la liste des jeux",
    intro: `<p>On assemble les noms de jeux en une seule ligne « Uno - Catan - Risk », proprement :</p>
<pre class="pseudo">String[] jeux = {"Uno", "Catan", "Risk"};        // le tableau de noms

StringBuilder sb = new StringBuilder();          // (1) tampon vide
for (int i = 0; i &lt; jeux.length; i++) {          // parcours indexé
    sb.append(jeux[i]);                          // (2) ajoute le nom
    if (i &lt; jeux.length - 1) {                   // sauf pour le dernier...

    }
}
String ligne = sb.toString();                    // (4) texte final</pre>`,
    questions: [
      { type: "qcm", q: "(1) Pourquoi un StringBuilder plutôt qu'un + dans la boucle ?", opts: ["Aucune raison", "Pour éviter de recréer un String complet à chaque tour", "Pour trier", "Pour aller moins vite"], a: 1, exp: "append écrit sur place, sans objets temporaires." },
      { type: "qcm", q: "(2) Que fait <code>sb.append(jeux[i])</code> ?", opts: ["Remplace tout", "Ajoute le nom courant à la fin du tampon", "Crée un nouveau sb", "Efface sb"], a: 1, exp: "L'ajout se fait sur place." },
      { type: "qcm", q: "(3) Pourquoi le <code>if (i &lt; jeux.length - 1)</code> ?", opts: ["Pour sauter le premier", "Pour ne PAS mettre de séparateur après le dernier nom", "Pour trier", "Aucune raison"], a: 1, exp: "On évite un « - » qui traîne à la fin." },
      { type: "qcm", q: "(4) Que vaut <code>ligne</code> ?", opts: ["Uno-Catan-Risk", "Uno - Catan - Risk", "[Uno, Catan, Risk]", "UnoCatanRisk"], a: 1, exp: "Les noms séparés par « - », sans séparateur final." },
      { type: "vf", q: "Le <code>String ligne</code> obtenu est immuable.", a: true, exp: "toString() produit une String, donc figée." }
    ],
    solution: `<pre class="pseudo">sb (vide)
 append("Uno")   -> "Uno"
 append(" - ")   -> "Uno - "        // i=0 n'est pas le dernier
 append("Catan") -> "Uno - Catan"
 append(" - ")   -> "Uno - Catan - "// i=1 n'est pas le dernier
 append("Risk")  -> "Uno - Catan - Risk"  // i=2 est le dernier : pas de séparateur
toString()       -> "Uno - Catan - Risk"</pre>
<p>Un seul tampon, aucun objet gaspillé, un séparateur maîtrisé : c'est le bon réflexe pour assembler du texte en boucle. Prochaine leçon : les tests unitaires avec JUnit, pour prouver que ton code fonctionne.</p>`
  }
