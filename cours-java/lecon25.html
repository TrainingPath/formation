  num: 25,
  title: "Comparator, tri et Collections",
  subtitle: "Ranger une liste selon TES règles : par nom, par prix, croissant ou décroissant, à volonté.",
  theory: `
<h3>1. Trier : mettre de l'ordre dans le rayon</h3>
<p>Dans la <strong>ludothèque</strong>, tu veux parfois ranger les jeux par ordre alphabétique, parfois du moins cher au plus cher. <strong>Trier</strong>, c'est réorganiser les éléments d'une liste selon un critère. Java fournit un outil tout prêt : <code>Collections.sort</code>.</p>
<pre class="pseudo">import java.util.Collections;             // la boîte à outils des collections

ArrayList&lt;String&gt; jeux = /* ... */;       // une liste de noms
Collections.sort(jeux);                   // trie dans l'ordre NATUREL (alphabétique pour les String)
System.out.println(jeux);                 // [Catan, Risk, Uno] : rangé A -> Z</pre>

<h3>2. L'ordre naturel : Comparable</h3>
<p>Pourquoi <code>sort</code> sait-il ranger des String ou des int sans qu'on lui explique ? Parce que ces types implémentent <strong>Comparable</strong> : ils savent se comparer eux-mêmes via <code>compareTo</code>. C'est leur « ordre naturel » (alphabétique, numérique).</p>
<pre class="pseudo">"abc".compareTo("abd")   // renvoie un nombre NÉGATIF : « abc » vient AVANT « abd »
"b".compareTo("a")       // POSITIF : « b » vient APRÈS « a »
"x".compareTo("x")       // ZÉRO : égaux au sens du tri</pre>
<div class="tip">Règle de <code>compareTo</code> (et de tout comparateur) : renvoyer un nombre <strong>négatif</strong> si le premier passe avant, <strong>zéro</strong> si égalité, <strong>positif</strong> si le premier passe après. C'est le langage universel du tri.</div>

<h3>3. Trier selon TES règles : le Comparator</h3>
<p>Pour trier des objets complexes (des jeux avec nom ET prix), on fournit un <strong>Comparator</strong> : un « juge » qui, pour deux éléments, dit lequel passe en premier. Grâce aux lambdas (leçon 21), on l'écrit en une ligne.</p>
<pre class="pseudo">jeux.sort(Comparator.comparing(Jeu::prix));        // trie les jeux par prix CROISSANT
jeux.sort(Comparator.comparing(Jeu::nom));         // trie par nom (alphabétique)
jeux.sort(Comparator.comparingInt(Jeu::joueurs));  // version optimisée pour les int</pre>
<div class="tip"><code>Comparator.comparing(Jeu::prix)</code> se lit « compare deux jeux en regardant leur prix ». Le <code>Jeu::prix</code> est une référence de méthode : « la fonction qui, d'un jeu, extrait le prix ».</div>

<h3>4. Inverser et enchaîner les critères</h3>
<pre class="pseudo">jeux.sort(Comparator.comparing(Jeu::prix).reversed());   // reversed() : du plus cher au moins cher
jeux.sort(Comparator.comparing(Jeu::genre)               // critère PRINCIPAL : le genre
    .thenComparing(Jeu::nom));                           // en cas d'égalité : départage par nom</pre>
<div class="warn"><code>reversed()</code> inverse l'ordre. <code>thenComparing()</code> ajoute un critère de départage quand le premier donne une égalité — comme un classement où l'on départage les ex aequo par un second critère.</div>

<h3>5. La liste est modifiée SUR PLACE</h3>
<p>Attention : <code>list.sort(...)</code> et <code>Collections.sort(list)</code> réorganisent la liste ELLE-MÊME (mutation), contrairement aux Streams qui produisaient une copie. Après le tri, l'ordre d'origine est perdu.</p>
<pre class="pseudo">jeux.sort(Comparator.comparing(Jeu::prix)); // jeux est MAINTENANT trié : l'ordre initial a disparu</pre>

<h3>6. Les autres outils Collections</h3>
<pre class="pseudo">Collections.max(prix)          // le plus grand élément (selon l'ordre naturel)
Collections.min(prix)          // le plus petit
Collections.reverse(jeux)      // inverse l'ordre actuel de la liste (sur place)
Collections.shuffle(jeux)      // mélange aléatoirement (parfait pour une pioche de cartes !)
Collections.frequency(jeux, "Uno") // combien de fois « Uno » apparaît dans la liste</pre>

<h3>7. Trier via un Stream (sans modifier l'original)</h3>
<p>Si tu veux une version triée SANS toucher à la liste d'origine, passe par un Stream :</p>
<pre class="pseudo">List&lt;Jeu&gt; parPrix = jeux.stream()               // source
    .sorted(Comparator.comparing(Jeu::prix))    // trie le flux (l'original reste intact)
    .collect(Collectors.toList());              // récupère la liste triée</pre>`,
  exercises: [
    { type: "qcm", q: "Que fait <code>Collections.sort(liste)</code> sur une liste de String ?", opts: ["La mélange", "La trie dans l'ordre alphabétique (ordre naturel)", "La copie triée sans modifier l'original", "L'inverse"], a: 1, exp: "L'ordre naturel des String est alphabétique." },
    { type: "qcm", q: "Pourquoi les String et int savent-ils se trier seuls ?", opts: ["Parce qu'ils héritent d'Object", "Ils implémentent Comparable (méthode compareTo)", "Grâce à un import", "Grâce à un Comparator par défaut"], a: 1, exp: "Comparable définit leur ordre naturel." },

    { type: "qcm", q: "Que fait <code>.reversed()</code> ajouté à un Comparator ?", opts: ["Supprime le tri", "Inverse l'ordre (décroissant)", "Trie deux fois", "Mélange"], a: 1, exp: "reversed() renverse le sens du comparateur." },
    { type: "qcm", q: "À quoi sert <code>.thenComparing(Jeu::nom)</code> ?", opts: ["À trier plus vite", "À départager les ex aequo du 1er critère par un 2e critère", "À inverser", "À combiner deux listes triées"], a: 1, exp: "Un critère secondaire pour les égalités." },
    { type: "vf", q: "<code>list.sort(...)</code> modifie la liste sur place (mutation).", a: true, exp: "Contrairement au stream, le tri réorganise la liste d'origine." },
    { type: "qcm", q: "Après <code>jeux.sort(...)</code>, l'ordre d'origine…", opts: ["est conservé ailleurs", "est perdu (la liste elle-même a changé)", "reste dans une copie automatique", "est simplement inversé"], a: 1, exp: "Le tri sur place écrase l'ordre initial." },
    { type: "qcm", q: "<code>Collections.shuffle(liste)</code> :", opts: ["trie la liste", "mélange aléatoirement les éléments (utile pour une pioche)", "supprime les doublons", "inverse la liste"], a: 1, exp: "Un mélange aléatoire, parfait pour des cartes." },
    { type: "qcm", q: "<code>Collections.max(liste)</code> renvoie…", opts: ["la taille", "le plus grand élément selon l'ordre naturel", "le premier élément", "une copie"], a: 1, exp: "Le maximum de la liste." },
    { type: "vf", q: "<code>Comparator.comparingInt(Jeu::joueurs)</code> est une variante optimisée pour comparer des int.", a: true, exp: "comparingInt évite l'emballage/déballage des Integer." },
    { type: "qcm", q: "Pour obtenir une liste triée SANS modifier l'original :", opts: ["Collections.sort", "un Stream avec .sorted(...).collect(...)", "list.sort", "impossible"], a: 1, exp: "Le stream produit une copie triée, l'original reste intact." },
    { type: "vf", q: "Un Comparator peut s'écrire en une ligne grâce aux lambdas et références de méthode.", a: true, exp: "Comparator.comparing(Jeu::prix) : concis et lisible." }
  ],

    title: "Exercice final — Ranger le rayon par prix",
    intro: `<p>On dispose d'une liste de jeux (records) et on la range de plusieurs façons :</p>
<pre class="pseudo">record Jeu(String nom, double prix) { }                     // fiche jeu

ArrayList&lt;Jeu&gt; jeux = new ArrayList&lt;&gt;();                     // la liste
jeux.add(new Jeu("Uno", 8.0));                              // 8 EUR
jeux.add(new Jeu("Catan", 42.0));                           // 42 EUR
jeux.add(new Jeu("Risk", 30.0));                            // 30 EUR

jeux.sort(Comparator.comparing(Jeu::prix));                 // (1) tri par prix croissant
System.out.println(jeux.get(0).nom());                     // (2) premier après tri
jeux.sort(Comparator.comparing(Jeu::prix).reversed());     // (3) tri décroissant
System.out.println(jeux.get(0).nom());                     // (4) premier après tri inversé</pre>`,

      { type: "qcm", q: "(3) Que fait <code>.reversed()</code> ici ?", opts: ["Retrie par ordre naturel", "Inverse : trie du plus cher au moins cher", "Supprime le tri", "Mélange"], a: 1, exp: "L'ordre devient décroissant." },
      { type: "qcm", q: "(4) Quel nom s'affiche après le tri inversé ?", opts: ["Uno", "Catan (le plus cher, 42 EUR, en tête)", "Risk", "aucun"], a: 1, exp: "Décroissant : le prix le plus haut passe premier." },
      { type: "vf", q: "Ces tris modifient la liste <code>jeux</code> elle-même (sur place).", a: true, exp: "list.sort réorganise la liste d'origine, pas une copie." }
    ],
    solution: `<pre class="pseudo">sort(comparing(prix))           -> [Uno 8, Risk 30, Catan 42]  // croissant
get(0).nom()                     -> "Uno"
sort(comparing(prix).reversed()) -> [Catan 42, Risk 30, Uno 8]  // décroissant
get(0).nom()                     -> "Catan"
// La liste jeux est modifiée sur place à chaque tri.</pre>
<p>Un même Comparator, deux ordres grâce à reversed(), et thenComparing pour départager : tu ranges désormais n'importe quelle collection selon tes règles. Prochaine leçon : les expressions régulières, pour reconnaître des motifs dans du texte.</p>`
  }

      "solution": "// La criee aux poissons : le meme etal, range de six facons differentes.\nimport java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.Comparator;\nimport java.util.List;\nimport java.util.stream.Collectors;\n\npublic class Criee {\n\n    record Lot(String espece, int caisses, double prixKg) { }\n\n    // Seul le SIGNE compte : la valeur exacte ne veut rien dire.\n    static String lecture(int comparaison) {\n        if (comparaison < 0) {\n            return \"avant\";\n        } else if (comparaison > 0) {\n            return \"après\";\n        } else {\n            return \"à égalité\";\n        }\n    }\n\n    public static void main(String[] args) {\n        ArrayList<String> bateaux = new ArrayList<>();\n        bateaux.add(\"Saint-Guénolé\");\n        bateaux.add(\"Anna-Maria\");\n        bateaux.add(\"Ker Avel\");\n        bateaux.add(\"Anna-Maria\");\n\n        // L'ordre naturel des textes : alphabetique, sans rien expliquer a personne.\n        Collections.sort(bateaux);\n        System.out.println(\"Bateaux triés : \" + bateaux);\n        System.out.println(\"« Anna » vient \" + lecture(\"Anna\".compareTo(\"Ker\")) + \" « Ker »\");\n        System.out.println(\"« Ker » vient \" + lecture(\"Ker\".compareTo(\"Anna\")) + \" « Anna »\");\n        System.out.println(\"« Ker » vient \" + lecture(\"Ker\".compareTo(\"Ker\")) + \" de « Ker »\");\n        System.out.println(\"Anna-Maria débarque \" + Collections.frequency(bateaux, \"Anna-Maria\")\n                + \" fois\");\n\n        ArrayList<Lot> etal = new ArrayList<>();\n        etal.add(new Lot(\"lieu jaune\", 4, 12.50));\n        etal.add(new Lot(\"sardine\", 9, 4.20));\n        etal.add(new Lot(\"bar de ligne\", 2, 24.00));\n        etal.add(new Lot(\"maquereau\", 9, 6.80));\n        etal.add(new Lot(\"langoustine\", 3, 24.00));\n\n        // Un juge par critere, ecrit en une ligne grace a la reference de methode.\n        etal.sort(Comparator.comparing(Lot::espece));\n        System.out.println();\n        System.out.println(\"Par espèce :\");\n        etal.forEach(l -> System.out.println(\"  \" + l.espece()));\n\n        etal.sort(Comparator.comparing(Lot::prixKg));\n        System.out.println(\"Du moins cher : \" + etal.get(0).espece() + \" à \"\n                + etal.get(0).prixKg() + \" €\");\n\n        etal.sort(Comparator.comparing(Lot::prixKg).reversed());\n        System.out.println(\"Du plus cher : \" + etal.get(0).espece() + \" à \"\n                + etal.get(0).prixKg() + \" €\");\n\n        // Deux lots a 24 € : le premier critere ne suffit pas, le second departage.\n        etal.sort(Comparator.comparing(Lot::prixKg).reversed().thenComparing(Lot::espece));\n        System.out.println(\"Ex aequo départagés :\");\n        etal.forEach(l -> System.out.println(\"  \" + l.prixKg() + \" € — \" + l.espece()));\n\n        // Le juge specialise pour les entiers.\n        etal.sort(Comparator.comparingInt(Lot::caisses));\n        System.out.println(\"Le plus petit lot : \" + etal.get(0).espece() + \" (\"\n                + etal.get(0).caisses() + \" caisses)\");\n\n        // Les prix seuls : le plus haut, le plus bas, l'ordre inverse.\n        List<Double> prix = etal.stream().map(l -> l.prixKg()).collect(Collectors.toList());\n        System.out.println();\n        System.out.println(\"Prix : \" + prix);\n        System.out.println(\"Le plus haut : \" + Collections.max(prix)\n                + \" — le plus bas : \" + Collections.min(prix));\n        Collections.reverse(prix);\n        System.out.println(\"Prix à l'envers : \" + prix);\n\n        // Le tri par flux ne touche pas a l'original : les deux listes coexistent.\n        ArrayList<String> criees = new ArrayList<>();\n        criees.add(\"sardine\");\n        criees.add(\"bar de ligne\");\n        criees.add(\"maquereau\");\n        List<String> triees = criees.stream()\n                .sorted(Comparator.comparing(nom -> nom))\n                .collect(Collectors.toList());\n        System.out.println();\n        System.out.println(\"Original intact : \" + criees);\n        System.out.println(\"Copie triée     : \" + triees);\n\n        // Le tri sur place, lui, efface l'ordre d'arrivee.\n        criees.sort(Comparator.comparing(nom -> nom));\n        System.out.println(\"Après tri sur place : \" + criees);\n    }\n}",

      "enonce": "Cinq tireurs sont engagés, dans cet ordre d'inscription : Delcourt (Namur, 4 victoires, 21 touches reçues), Ceulemans (Gand, 5, 18), Nkemi (Namur, 4, 15), Bary (Liège, 5, 18) et Aerts (Liège, 2, 30). Le règlement classe d'abord au nombre de victoires décroissant, puis au nombre de touches reçues croissant, puis par ordre alphabétique. Décris le tireur par une fiche cartonnée qui sait se comparer elle-même selon ce règlement — c'est son ordre naturel — et produis le classement numéroté sans détruire l'ordre d'inscription. Écris ensuite le même classement sous forme de juge composé, et vérifie par programme que les deux donnent exactement la même chose. Produis aussi le classement privé de son dernier départage, et affiche les deux côte à côte. Effectue le tirage au sort des poules avec une source d'aléa initialisée à la graine 2026, puis refais-le à l'identique pour prouver qu'il est rejouable. Trie enfin une copie de la feuille par club, sur place, en montrant ce qui est perdu ; affiche les touches reçues extrêmes, le vainqueur avec son club, et le nombre de Liégeois.",
      "principe": "Un classement sportif n'est rien d'autre qu'un juge à plusieurs étages : le critère principal, puis les départages, dans un ordre écrit noir sur blanc. Un règlement qui ne dit pas comment départager les ex aequo laisse la décision à l'ordre d'arrivée des inscriptions — ce qui est toujours une décision, mais que personne n'a prise.",

      "reflexion": "Le règlement est écrit à deux endroits : dans la fiche du tireur et dans le juge composé. Le programme vérifie qu'ils concordent — mais rien n'empêche quelqu'un de modifier l'un sans l'autre dans six mois. Est-ce une duplication qu'il faut supprimer, et si oui, laquelle des deux écritures garderais-tu ? Défends ton choix par un argument qui ne soit pas « c'est plus court ».",
      "remarque": "Le règlement départage les ex aequo par ordre alphabétique, ce qui avantage silencieusement le début de l'alphabet à chaque tournoi de la saison. C'est un biais réel, sans conséquence ici, mais qui deviendrait une injustice mesurable sur un classement annuel cumulé. Un départage doit être arbitraire ; il ne devrait pas être systématiquement le même arbitraire.",
      "indices": [
        "Écris le règlement en français avant toute chose : « le plus de victoires d'abord ; à égalité, le moins de touches reçues ; à égalité encore, l'ordre alphabétique ». Ces trois phrases sont exactement les trois étages de ton juge, dans cet ordre. Repère que la première est décroissante et la deuxième croissante — c'est là que se logent les erreurs de signe.",
        "Le plan : la fiche du tireur, qui sait se comparer ; la liste des engagés ; une copie triée pour le classement ; le juge composé et sa comparaison avec le premier classement ; le classement sans départage ; les deux tirages ; puis le tri sur place, les extrêmes, le vainqueur et le comptage.",
        "Pour comparer deux nombres dans une fiche qui se compare elle-même, la soustraction suffit et se lit bien : le sens de la soustraction encode le sens du tri. Écris d'abord le cas décroissant, puis relis-le en te demandant lequel des deux tireurs passe devant si le résultat est négatif — c'est le seul moyen fiable de ne pas inverser le classement.",
        "Le point dur est la preuve que les deux écritures du règlement concordent. Ne les compare pas à l'œil : produis deux listes de noms, l'une par la fiche, l'autre par le juge composé, et compare-les par programme. Une égalité de listes affichée « vrai » est une vérification ; deux affichages côte à côte qu'un humain doit relire n'en sont pas une. Pour le tirage rejouable, souviens-toi de la leçon 19 : une source d'aléa initialisée avec une graine produit toujours la même suite.",

      "solution": "// Le tournoi d'escrime : un classement, c'est un comparateur ecrit noir sur blanc.\nimport java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.Comparator;\nimport java.util.List;\nimport java.util.Optional;\nimport java.util.Random;\nimport java.util.stream.Collectors;\n\npublic class Tournoi {\n\n    // La fiche du tireur sait se comparer elle-meme : c'est son ordre naturel,\n    // celui du reglement — victoires d'abord, puis touches recues, puis nom.\n    record Tireur(String nom, String club, int victoires, int touchesRecues)\n            implements Comparable<Tireur> {\n        public int compareTo(Tireur autre) {\n            if (victoires != autre.victoires) {\n                return autre.victoires - victoires;      // le plus de victoires d'abord\n            }\n            if (touchesRecues != autre.touchesRecues) {\n                return touchesRecues - autre.touchesRecues;  // le moins encaisse d'abord\n            }\n            return nom.compareTo(autre.nom);             // dernier recours : l'alphabet\n        }\n    }\n\n    public static void main(String[] args) {\n        ArrayList<Tireur> engages = new ArrayList<>();\n        engages.add(new Tireur(\"Delcourt\", \"Namur\", 4, 21));\n        engages.add(new Tireur(\"Ceulemans\", \"Gand\", 5, 18));\n        engages.add(new Tireur(\"Nkemi\", \"Namur\", 4, 15));\n        engages.add(new Tireur(\"Bary\", \"Liège\", 5, 18));\n        engages.add(new Tireur(\"Aerts\", \"Liège\", 2, 30));\n\n        // L'ordre d'inscription doit survivre au classement : on trie une COPIE.\n        List<Tireur> classement = new ArrayList<>(engages);\n        Collections.sort(classement);\n\n        System.out.println(\"--- Classement ---\");\n        int rang = 1;\n        for (Tireur t : classement) {\n            System.out.println(rang + \". \" + t.nom() + \" (\" + t.club() + \") \"\n                    + t.victoires() + \" v, \" + t.touchesRecues() + \" touches\");\n            rang++;\n        }\n        System.out.println(\"Ordre d'inscription intact ? \" + engages.get(0).nom());\n\n        // Le meme classement, ecrit comme un juge plutot que dans la fiche.\n        List<String> parJuge = engages.stream()\n                .sorted(Comparator.comparingInt(Tireur::victoires).reversed()\n                        .thenComparing(Tireur::touchesRecues)\n                        .thenComparing(Tireur::nom))\n                .map(t -> t.nom())\n                .collect(Collectors.toList());\n        System.out.println(\"Même ordre par comparateur ? \"\n                + parJuge.equals(classement.stream().map(t -> t.nom())\n                        .collect(Collectors.toList())));\n\n        // Sans le depart alphabetique, les deux ex aequo restent dans l'ordre\n        // ou ils sont arrives : le tri est stable, donc previsible, mais arbitraire.\n        List<String> sansDepart = engages.stream()\n                .sorted(Comparator.comparingInt(Tireur::victoires).reversed()\n                        .thenComparing(Tireur::touchesRecues))\n                .map(t -> t.nom())\n                .collect(Collectors.toList());\n        System.out.println(\"Sans départage : \" + sansDepart);\n        System.out.println(\"Avec départage : \" + parJuge);\n\n        // Le tirage des poules : aleatoire, mais rejouable a l'identique.\n        List<Tireur> pioche = new ArrayList<>(engages);\n        Collections.shuffle(pioche, new Random(2026));\n        System.out.println(\"Tirage (graine 2026) : \"\n                + pioche.stream().map(t -> t.nom()).collect(Collectors.toList()));\n        List<Tireur> pioche2 = new ArrayList<>(engages);\n        Collections.shuffle(pioche2, new Random(2026));\n        System.out.println(\"Même graine, même tirage ? \"\n                + pioche.stream().map(t -> t.nom()).collect(Collectors.toList())\n                        .equals(pioche2.stream().map(t -> t.nom())\n                                .collect(Collectors.toList())));\n\n        // Le tri sur place efface l'ordre precedent, sans prevenir.\n        ArrayList<Tireur> feuille = new ArrayList<>(engages);\n        System.out.println();\n        System.out.println(\"Feuille avant : \" + feuille.get(0).nom());\n        feuille.sort(Comparator.comparing(Tireur::club));\n        System.out.println(\"Feuille après tri par club : \" + feuille.get(0).nom()\n                + \" — l'ordre d'arrivée est perdu\");\n\n        // Les extremes se lisent sur une liste de nombres.\n        List<Integer> touches = engages.stream()\n                .map(t -> t.touchesRecues())\n                .collect(Collectors.toList());\n        System.out.println(\"Touches encaissées, de \" + Collections.min(touches)\n                + \" à \" + Collections.max(touches));\n\n        // Le club du vainqueur : une recherche qui pourrait ne rien trouver.\n        Optional<Tireur> vainqueur = classement.stream().findFirst();\n        System.out.println(\"Vainqueur : \" + vainqueur.map(t -> t.nom() + \" — \" + t.club())\n                .orElse(\"tournoi annulé\"));\n        System.out.println(\"Combien de Liégeois ? \"\n                + engages.stream().filter(t -> t.club().equals(\"Liège\")).count());\n    }\n}",

      "enonce": "Nouvelle série sur quatre leçons. Une bourse aux vélos d'occasion reçoit cinq machines, chacune décrite par un code d'inscription, un propriétaire, un modèle, une taille de cadre, un prix en euros et un état — neuf, bon ou usé. Voici l'ordre d'arrivée : BV-2026-004, Lambert, Gitane Tour, taille 54, 180 €, bon ; BV-2026-001, Nzeyimana, Peugeot PX10, 58, 320 €, bon ; BV-2026-003, Declercq, Btwin Riverside, 50, 95 €, usé ; BV-2026-005, Lambert, Ridley Fenix, 54, 640 €, neuf ; BV-2026-002, Haddad, Motobécane C4, 58, 180 €, usé. Décris le vélo par une fiche cartonnée et l'état par une liste de choix fermée, puis déclare <strong>quatre juges nommés</strong> — par prix, par taille, par propriétaire, par état — que les trois prochaines leçons réutiliseront. Le programme affiche l'inventaire dans l'ordre d'arrivée ; puis trois classements obtenus sans toucher au hangar : par prix croissant, par taille puis prix, et par état puis prix décroissant. Il vérifie ensuite que l'ordre d'arrivée est intact, affiche les prix extrêmes et le nombre de vélos à 180 €, désigne la meilleure affaire — le moins cher qui ne soit pas usé — et répond à une demande de taille 62 qui ne donnera rien. Il trie enfin la feuille d'émargement sur place par propriétaire puis prix décroissant, trie les codes d'inscription, et affiche la valeur totale du hangar.",
      "principe": "Un juge nommé est à l'ordre ce qu'un critère nommé était au filtrage : une règle métier sortie du code qui l'utilise, écrite une fois, et combinable. Les combinaisons — inverser, départager — se lisent alors comme la phrase française qui les décrit, et c'est cette lisibilité qui permettra aux trois leçons suivantes de s'appuyer dessus sans les rouvrir.",

      "remarque": "Le juge par état repose sur la position des constantes dans la liste fermée, c'est-à-dire sur l'ordre où elles ont été écrites. C'est commode et fragile : le jour où quelqu'un insérera un état « à réparer » entre deux existants, le classement changera sans qu'aucune ligne de tri n'ait été touchée. Cette dépendance mérite au minimum un commentaire dans le code.",
      "indices": [
        "Commence par l'inventaire des données, comme aux leçons 21 à 24 : six champs, dont un à valeurs fermées. Puis liste les classements demandés et, pour chacun, écris en français la phrase du juge : « du moins cher au plus cher », « par taille, et à taille égale du moins cher au plus cher », « du meilleur état au plus usé, et à état égal du plus cher au moins cher ». Ces phrases sont ton code.",

      "solution": "// La bourse aux velos - jour 1 sur 4 : mettre de l'ordre dans le hangar.\n// Les quatre comparateurs nommes ci-dessous serviront les quatre jours.\nimport java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.Comparator;\nimport java.util.List;\nimport java.util.Optional;\nimport java.util.stream.Collectors;\n\npublic class BourseAuxVelos {\n\n    record Velo(String code, String proprietaire, String modele, int taille,\n                int prixEuros, Etat etat) { }\n\n    enum Etat { NEUF, BON, USE }\n\n    static String fiche(Velo v) {\n        return v.code() + \" \" + v.modele() + \" (T\" + v.taille() + \", \" + v.etat()\n                + \") — \" + v.prixEuros() + \" € — \" + v.proprietaire();\n    }\n\n    public static void main(String[] args) {\n        ArrayList<Velo> hangar = new ArrayList<>();\n        hangar.add(new Velo(\"BV-2026-004\", \"Lambert\", \"Gitane Tour\", 54, 180, Etat.BON));\n        hangar.add(new Velo(\"BV-2026-001\", \"Nzeyimana\", \"Peugeot PX10\", 58, 320, Etat.BON));\n        hangar.add(new Velo(\"BV-2026-003\", \"Declercq\", \"Btwin Riverside\", 50, 95, Etat.USE));\n        hangar.add(new Velo(\"BV-2026-005\", \"Lambert\", \"Ridley Fenix\", 54, 640, Etat.NEUF));\n        hangar.add(new Velo(\"BV-2026-002\", \"Haddad\", \"Motobécane C4\", 58, 180, Etat.USE));\n\n        // Les quatre juges de la bourse, nommes une fois pour toutes.\n        Comparator<Velo> parPrix = Comparator.comparingInt(Velo::prixEuros);\n        Comparator<Velo> parTaille = Comparator.comparingInt(Velo::taille);\n        Comparator<Velo> parProprietaire = Comparator.comparing(Velo::proprietaire);\n        Comparator<Velo> parEtat = Comparator.comparingInt(v -> v.etat().ordinal());\n\n        System.out.println(\"--- Ordre d'arrivée ---\");\n        hangar.forEach(v -> System.out.println(\"  \" + fiche(v)));\n\n        // Chaque classement travaille sur une COPIE : le hangar garde son ordre.\n        List<Velo> parPrixCroissant = hangar.stream()\n                .sorted(parPrix)\n                .collect(Collectors.toList());\n        System.out.println();\n        System.out.println(\"--- Du moins cher au plus cher ---\");\n        parPrixCroissant.forEach(v -> System.out.println(\"  \" + v.prixEuros() + \" € — \"\n                + v.modele()));\n\n        List<Velo> parTaillePuisPrix = hangar.stream()\n                .sorted(parTaille.thenComparing(parPrix))\n                .collect(Collectors.toList());\n        System.out.println();\n        System.out.println(\"--- Par taille, puis par prix ---\");\n        parTaillePuisPrix.forEach(v -> System.out.println(\"  T\" + v.taille() + \" — \"\n                + v.prixEuros() + \" € — \" + v.modele()));\n\n        List<Velo> parEtatPuisPrixDecroissant = hangar.stream()\n                .sorted(parEtat.thenComparing(parPrix.reversed()))\n                .collect(Collectors.toList());\n        System.out.println();\n        System.out.println(\"--- Par état, puis du plus cher ---\");\n        parEtatPuisPrixDecroissant.forEach(v -> System.out.println(\"  \" + v.etat() + \" — \"\n                + v.prixEuros() + \" € — \" + v.modele()));\n\n        System.out.println();\n        System.out.println(\"Ordre d'arrivée intact ? \" + hangar.get(0).code());\n\n        // Les extremes, lus sur la liste des prix.\n        List<Integer> prix = hangar.stream().map(v -> v.prixEuros()).collect(Collectors.toList());\n        System.out.println(\"Prix de \" + Collections.min(prix) + \" € à \"\n                + Collections.max(prix) + \" €\");\n        System.out.println(\"Vélos à 180 € : \" + Collections.frequency(prix, 180));\n\n        // La meilleure affaire : le moins cher en bon ou neuf etat.\n        Optional<Velo> affaire = hangar.stream()\n                .filter(v -> v.etat() != Etat.USE)\n                .sorted(parPrix)\n                .findFirst();\n        System.out.println(\"Meilleure affaire : \"\n                + affaire.map(v -> fiche(v)).orElse(\"aucune\"));\n        Optional<Velo> introuvable = hangar.stream()\n                .filter(v -> v.taille() == 62)\n                .sorted(parPrix)\n                .findFirst();\n        System.out.println(\"En taille 62 : \" + introuvable.map(v -> fiche(v)).orElse(\"aucun vélo\"));\n\n        // La feuille d'emargement, elle, se trie SUR PLACE : c'est voulu.\n        ArrayList<Velo> emargement = new ArrayList<>(hangar);\n        emargement.sort(parProprietaire.thenComparing(parPrix.reversed()));\n        System.out.println();\n        System.out.println(\"--- Feuille d'émargement ---\");\n        emargement.forEach(v -> System.out.println(\"  \" + v.proprietaire() + \" : \"\n                + v.modele() + \" (\" + v.prixEuros() + \" €)\"));\n\n        // Le code d'inscription se trie dans l'ordre naturel des textes.\n        List<String> codes = hangar.stream().map(v -> v.code()).collect(Collectors.toList());\n        Collections.sort(codes);\n        System.out.println(\"Codes : \" + codes);\n        int total = hangar.stream().mapToInt(v -> v.prixEuros()).sum();\n        System.out.println(\"Valeur du hangar : \" + total + \" € pour \" + hangar.size() + \" vélos\");\n    }\n}",

      "solution": "import java.util.ArrayList;                                   // liste dynamique\nimport java.util.Comparator;                                  // pour construire le comparateur\n\npublic class Classement {                                     // classe principale\n\n    record Joueur(String nom, int score) { }                  // fiche : nom + score\n\n    public static void main(String[] args) {                  // point d'entrée\n        ArrayList<Joueur> joueurs = new ArrayList<>();        // la liste des joueurs\n        joueurs.add(new Joueur(\"Ana\", 30));                   // score 30\n        joueurs.add(new Joueur(\"Bob\", 50));                   // score 50\n        joueurs.add(new Joueur(\"Zoe\", 30));                   // score 30 (egalite avec Ana)\n\n        joueurs.sort(                                         // tri de la liste sur place\n            Comparator.comparingInt(Joueur::score)           // critere principal : le score...\n                .reversed()                                  // ...mais en DÉCROISSANT (meilleur d'abord)\n                .thenComparing(Joueur::nom)                  // egalite de score -> depart par nom (A->Z)\n        );                                                    // fin du comparateur\n\n        for (Joueur j : joueurs) {                            // parcours du classement trie\n            System.out.println(j.nom() + \" : \" + j.score());  // affiche « nom : score »\n        }                                                     // Bob 50, Ana 30, Zoe 30\n    }                                                         // fin de main\n}                                                             // fin de la classe",
