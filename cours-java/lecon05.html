  title: "Conditions : if, else, switch",
  subtitle: "Les jours 6 et 7 d'algorithmique en syntaxe Java.",
  theory: `
<h3>1. SI … ALORS … SINON devient if / else</h3>
<p>Une <strong>condition</strong> est une question à laquelle l'ordinateur ne peut répondre que par <em>vrai</em> ou <em>faux</em> (on dit une <strong>expression booléenne</strong>). Un <code>if</code> (« si ») évalue cette condition : si elle est vraie, le bloc entre accolades s'exécute ; sinon on passe au <code>else</code> (« sinon »). C'est un aiguillage : selon la réponse, le programme part d'un côté ou de l'autre.</p>
<pre class="pseudo">PSEUDOCODE                       JAVA
SI note >= 10 ALORS              if (note &gt;= 10) {          // condition entre parenthèses ; { ouvre le bloc « vrai »
    Écrire("Réussi")                 System.out.println("Réussi");   // exécuté si note >= 10
SINON                            } else {                   // } ferme le bloc vrai ; else ouvre le bloc « faux »
    Écrire("Échoué")                 System.out.println("Échoué");   // exécuté si note < 10
FINSI                            }                          // l'accolade fermante remplace le FINSI</pre>
<ul>
<li>La condition est <strong>entre parenthèses</strong>.</li>
<li>Le bloc est <strong>entre accolades</strong> (le FINSI devient <code>}</code>).</li>
<li>Pas de mot « ALORS » : l'accolade ouvrante le remplace.</li>
</ul>

<h3>2. La cascade : else if</h3>
<pre class="pseudo">if (note &gt;= 16) {                          // 1er test ; si vrai, on exécute et on IGNORE la suite
    System.out.println("Très bien");
} else if (note &gt;= 14) {                   // testé seulement si le précédent était faux
    System.out.println("Bien");
} else if (note &gt;= 10) {                   // idem : l'ordre des seuils est crucial
    System.out.println("Passable");
} else {                                   // aucun seuil atteint : le cas restant
    System.out.println("Échoué");
}</pre>
<p>Dès qu'un test est vrai, son bloc s'exécute et les autres sont ignorés. On va donc du seuil le plus haut au plus bas : une note de 15 échoue à <code>&gt;= 16</code> mais réussit <code>&gt;= 14</code> → « Bien ».</p>

<h3>3. Les pièges Java des conditions</h3>
<pre class="pseudo">if (x = 5)   { ... }    // ERREUR : = AFFECTE (met 5 dans x) ; la comparaison s'écrit ==
if (x == 5);  { ... }   // PIÈGE : le ; termine le if à VIDE → le bloc { } s'exécute TOUJOURS
if (x == 5)
    a++;                // seule cette ligne dépend du if
    b++;                // PIÈGE : sans accolades, b++ s'exécute TOUJOURS (l'indentation ne compte pas)</pre>
<div class="warn">Prends l'habitude de TOUJOURS mettre les accolades, même pour une seule instruction. Ce réflexe évite les pièges 2 et 3, sources de bugs célèbres et difficiles à repérer.</div>

<h3>4. Comparer des String : equals, jamais ==</h3>
<pre class="pseudo">String rep = clavier.next();
if (rep == "oui")        // FAUX AMI : == compare les RÉFÉRENCES (les adresses mémoire), pas le contenu !
if (rep.equals("oui"))   // CORRECT : .equals compare le CONTENU, caractère par caractère
if (rep.equalsIgnoreCase("OUI"))   // compare le contenu en ignorant majuscules/minuscules</pre>
<div class="warn">Différence majeure avec C# et PHP : en Java, <code>==</code> sur deux String teste si ce sont le même objet en mémoire, pas s'ils ont le même texte. Pour comparer le contenu, utilise TOUJOURS <code>.equals</code>. C'est l'un des pièges Java les plus fréquents.</div>

<h3>5. switch : la cascade d'égalités</h3>
<p>Quand on compare UNE variable à plusieurs valeurs précises, <code>switch</code> (« aiguillage ») est plus lisible qu'une longue chaîne de <code>if/else</code> :</p>
<pre class="pseudo">switch (jour) {                                        // on compare « jour » à chaque case (cas)
    case 1: System.out.println("Lundi"); break;        // si jour == 1 : afficher Lundi, puis break SORT du switch
    case 2: System.out.println("Mardi"); break;        // si jour == 2 : Mardi
    default: System.out.println("Jour inconnu");        // aucun case ne correspond : cas par défaut
}</pre>
<div class="tip">Sans <code>break</code>, l'exécution CONTINUE dans le case suivant (le « fall-through ») : mets un <code>break</code> par case, sauf effet voulu. Le switch ne teste que des ÉGALITÉS : pour des intervalles (<code>note &gt;= 10</code>), reste en <code>if/else</code>.</div>`,
  exercises: [
    { type: "qcm", q: "Traduire <code>SI x > 5 ALORS ... FINSI</code> :", opts: ["if x > 5 then { }", "if (x > 5) { ... }", "si (x > 5) { }", "when x > 5:"], a: 1, exp: "Parenthèses pour la condition, accolades pour le bloc." },

    { type: "qcm", q: "int x = 0. <code>if (x > 0) {A} else if (x < 0) {B} else {C}</code> : quel bloc ?", opts: ["A", "B", "C : zéro n'est ni positif ni négatif", "Aucun"], a: 2, exp: "Le SINON final attrape le cas restant (jour 7)." },

    { type: "qcm", q: "jour = 2 dans le switch de la théorie SANS AUCUN break : qu'affiche-t-il ?", opts: ["Mardi", "Mardi puis Jour inconnu (l'exécution continue !)", "Lundi", "Rien"], a: 1, exp: "Sans break, on traverse tous les cases suivants." },
    { type: "qcm", q: "Pour classer une note en intervalles (>= 16, >= 14…), switch ou if/else ?", opts: ["switch", "if/else if : le switch ne teste que des ÉGALITÉS", "Les deux", "Aucun"], a: 1, exp: "case note >= 16 n'existe pas : intervalles → cascade if." },
    { type: "qcm", q: "<code>if (rep.equalsIgnoreCase(\"OUI\"))</code> accepte…", opts: ["Seulement OUI", "oui, OUI, Oui, oUi… : la casse est ignorée", "Seulement oui", "Tout mot"], a: 1, exp: "Pratique pour les réponses utilisateur." },
    { type: "qcm", q: "Le rôle de <code>default</code> dans un switch :", opts: ["Le premier cas testé", "Le cas exécuté si aucun case ne correspond — le SINON final de la cascade", "Une erreur", "Le case déclenché quand la variable vaut 0"], a: 1, exp: "Toujours prévoir le cas « autre » (jour 7 : le SINON attrape-tout)." },
    { type: "qcm", q: "boolean estMajeur = age >= 18; puis <code>if (estMajeur) {...}</code> :", opts: ["Erreur : il faut if (estMajeur == true)", "Parfaitement valide et plus lisible : la variable EST déjà un boolean", "Il faut un switch", "if (estMajeur = true)"], a: 1, exp: "== true est redondant — le boolean se consomme tel quel (jour 21 : fonctions-tests)." }
  ],
  final: {
    title: "Exercice final — Le tarif du musée (version Java)",
    intro: `<p>Traduction du grand final du jour 7 : gratuit avant 6 ans, 5 € de 6 à 17 (3 € le mercredi), 12 € de 18 à 64, 8 € à partir de 65.</p>
<pre class="pseudo">int age = clavier.nextInt();               // lit l'âge du visiteur
boolean mercredi = clavier.nextBoolean();  // lit vrai/faux : est-on mercredi ?
int prix;                                  // prix à calculer (encore vide)
if (age < 6) {                             // 1re tranche : les tout-petits
    prix = 0;                              // gratuit
} else if (age < 18) {                     // on n'arrive ici que si age >= 6 : tranche 6-17
    if (mercredi) {                        // if imbriqué : sous-cas du mercredi
        prix = 3;                          // tarif mercredi
    } else {                               // les autres jours
        prix = 5;                          // tarif normal jeune
    }
} else if (age < 65) {                     // tranche adulte 18-64
    prix = 12;                             // plein tarif
} else {                                   // reste : 65 ans et plus
    prix = 8;                              // tarif senior
}
System.out.println("Prix : " + prix + " €"); // affiche le prix final</pre>`,
    questions: [
      { type: "input", q: "age = 15, mercredi = true : quel prix ?", a: "3", ph: "nombre", exp: "Cascade → tranche 6-17 → if imbriqué → 3 €. Identique au jour 7." },
      { type: "input", q: "age = 70, mercredi = true : quel prix ?", a: "8", ph: "nombre", exp: "else final : 8 €. Le mercredi ne concerne que les 6-17 ans." },
      { type: "qcm", q: "Pourquoi <code>else if (age < 18)</code> suffit-il sans tester age >= 6 ?", opts: ["C'est un bug", "On n'y arrive que si age < 6 était FAUX : on sait déjà que age >= 6", "Java le devine", "18 > 6"], a: 1, exp: "L'héritage de la cascade, exactement comme au jour 7." },
      { type: "qcm", q: "Si on écrivait <code>if (mercredi == true)</code> au lieu de <code>if (mercredi)</code> :", opts: ["Erreur de compilation", "Ça marche mais c'est redondant : mercredi EST un boolean", "Ça inverse le test", "Ça plante à l'exécution"], a: 1, exp: "Style : le boolean se consomme directement." },
      { type: "qcm", q: "On inverse les deux premiers tests (age < 18 d'abord, puis age < 6). Conséquence ?", opts: ["Les 65 ans et plus paient 12 € au lieu de 8 €", "Les moins de 6 ans paient 5 € (ou 3) : le cas gratuit n'est plus jamais atteint", "Erreur de compilation", "Tout le monde paie 12"], a: 1, exp: "L'ordre des seuils : LA leçon du jour 7, valable dans tous les langages." }
    ],
    solution: `<p>Table de vérification (identique au jour 7 — seule la syntaxe a changé !) :</p>
<pre class="pseudo">age   mercredi   chemin               prix
4     -          age &lt; 6              0
15    true       6-17 → if interne    3
15    false      6-17 → else interne  5
30    -          age &lt; 65             12
70    -          else final           8</pre>
<p>Tu constates que la LOGIQUE (cascade + imbrication) est exactement celle du mois d'algorithmique. Apprendre un langage, c'est apprendre une syntaxe — la pensée, tu l'as déjà.</p>`
  }
