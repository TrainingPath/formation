  subtitle: "Les jours 6 et 7 d'algorithmique en syntaxe Java.",
  theory: `
<h3>1. SI … ALORS … SINON devient if / else</h3>
<p>Une <strong>condition</strong> est une question à laquelle l'ordinateur ne peut répondre que par <em>vrai</em> ou <em>faux</em> (on dit une <strong>expression booléenne</strong>). Un <code>if</code> (« si ») évalue cette condition : si elle est vraie, le bloc entre accolades s'exécute ; sinon on passe au <code>else</code> (« sinon »). C'est un aiguillage : selon la réponse, le programme part d'un côté ou de l'autre.</p>
<pre class="pseudo">PSEUDOCODE                       JAVA
SI note >= 10 ALORS              if (note &gt;= 10) {          // condition entre parenthèses ; { ouvre le bloc « vrai »
    Écrire("Réussi")                 System.out.println("Réussi");   // exécuté si note >= 10
SINON                            } else {                   // } ferme le bloc vrai ; else ouvre le bloc « faux »
    Écrire("Échoué")                 System.out.println("Échoué");   // exécuté si note < 10
FINSI                            }                          // l'accolade fermante remplace le FINSI</pre>
<ul>
<li>La condition est <strong>entre parenthèses</strong>.</li>
<li>Le bloc est <strong>entre accolades</strong> (le FINSI devient <code>}</code>).</li>
<li>Pas de mot « ALORS » : l'accolade ouvrante le remplace.</li>
</ul>

<h3>2. La cascade : else if</h3>
<pre class="pseudo">if (note &gt;= 16) {                          // 1er test ; si vrai, on exécute et on IGNORE la suite
    System.out.println("Très bien");
} else if (note &gt;= 14) {                   // testé seulement si le précédent était faux
    System.out.println("Bien");
} else if (note &gt;= 10) {                   // idem : l'ordre des seuils est crucial
    System.out.println("Passable");
} else {                                   // aucun seuil atteint : le cas restant
    System.out.println("Échoué");
}</pre>
<p>Dès qu'un test est vrai, son bloc s'exécute et les autres sont ignorés. On va donc du seuil le plus haut au plus bas : une note de 15 échoue à <code>&gt;= 16</code> mais réussit <code>&gt;= 14</code> → « Bien ».</p>

<h3>3. Les pièges Java des conditions</h3>
<pre class="pseudo">if (x = 5)   { ... }    // ERREUR : = AFFECTE (met 5 dans x) ; la comparaison s'écrit ==
if (x == 5);  { ... }   // PIÈGE : le ; termine le if à VIDE → le bloc { } s'exécute TOUJOURS
if (x == 5)
    a++;                // seule cette ligne dépend du if
    b++;                // PIÈGE : sans accolades, b++ s'exécute TOUJOURS (l'indentation ne compte pas)</pre>
<div class="warn">Prends l'habitude de TOUJOURS mettre les accolades, même pour une seule instruction. Ce réflexe évite les pièges 2 et 3, sources de bugs célèbres et difficiles à repérer.</div>

<h3>4. Comparer des String : equals, jamais ==</h3>
<pre class="pseudo">String rep = clavier.next();
if (rep == "oui")        // FAUX AMI : == compare les RÉFÉRENCES (les adresses mémoire), pas le contenu !
if (rep.equals("oui"))   // CORRECT : .equals compare le CONTENU, caractère par caractère
if (rep.equalsIgnoreCase("OUI"))   // compare le contenu en ignorant majuscules/minuscules</pre>
<div class="warn">Différence majeure avec C# et PHP : en Java, <code>==</code> sur deux String teste si ce sont le même objet en mémoire, pas s'ils ont le même texte. Pour comparer le contenu, utilise TOUJOURS <code>.equals</code>. C'est l'un des pièges Java les plus fréquents.</div>

<h3>5. switch : la cascade d'égalités</h3>
<p>Quand on compare UNE variable à plusieurs valeurs précises, <code>switch</code> (« aiguillage ») est plus lisible qu'une longue chaîne de <code>if/else</code> :</p>
<pre class="pseudo">switch (jour) {                                        // on compare « jour » à chaque case (cas)
    case 1: System.out.println("Lundi"); break;        // si jour == 1 : afficher Lundi, puis break SORT du switch
    case 2: System.out.println("Mardi"); break;        // si jour == 2 : Mardi
    default: System.out.println("Jour inconnu");        // aucun case ne correspond : cas par défaut
}</pre>
<div class="tip">Sans <code>break</code>, l'exécution CONTINUE dans le case suivant (le « fall-through ») : mets un <code>break</code> par case, sauf effet voulu. Le switch ne teste que des ÉGALITÉS : pour des intervalles (<code>note &gt;= 10</code>), reste en <code>if/else</code>.</div>`,

ault:\n                nomSaison = \"saison inconnue\";\n                break;\n        }\n\n        System.out.println();\n        System.out.println(\"Bulletin — \" + nomSaison);\n        System.out.println(\"Temps \" + qualificatif + \" (\" + temperature + \" °C)\");\n        System.out.println(\"Vent \" + avisVent + \" (\" + vent + \" km/h)\");\n\n        // && : les DEUX conditions doivent tenir. Un seul & existe aussi et\n        // ferait presque la meme chose, mais evaluerait toujours la seconde.\n        if (temperature < 10 && vent >= 50) {\n            System.out.println(\"Alerte : refroidissement éolien, couvrez-vous.\");\n        } else {\n            System.out.println(\"Pas d'alerte particulière.\");\n        }\n    }\n}",

      "solution": "// La billetterie du train : trois reductions qui se composent, dans un ordre\n// qui n'est pas indifferent.\nimport java.util.Scanner;\n\npublic class Billetterie {\n    public static void main(String[] args) {\n        final double PLEIN_TARIF = 24.00;\n        final double MAJORATION_POINTE = 1.20;\n\n        Scanner clavier = new Scanner(System.in);\n\n        System.out.print(\"Âge du voyageur : \");\n        int age = clavier.nextInt();\n        System.out.print(\"Carte (aucune, jeune, senior, famille) : \");\n        String carte = clavier.next();\n        System.out.print(\"Voyage en heure de pointe (oui/non) : \");\n        String pointe = clavier.next();\n\n        // Cascade d'age : les bornes sont rangees du plus petit au plus grand.\n        // Dans l'autre ordre, un enfant de dix ans serait attrape par le\n        // premier test qu'il satisfait et paierait le tarif des jeunes.\n        double reductionAge;\n        String categorie;\n        if (age < 4) {\n            reductionAge = 1.00;\n            categorie = \"tout-petit\";\n        } else if (age < 12) {\n            reductionAge = 0.50;\n            categorie = \"enfant\";\n        } else if (age < 26) {\n            reductionAge = 0.30;\n            categorie = \"jeune\";\n        } else if (age < 65) {\n            reductionAge = 0.00;\n            categorie = \"adulte\";\n        } else {\n            reductionAge = 0.40;\n            categorie = \"senior\";\n        }\n\n        // equals, JAMAIS ==, pour comparer deux textes : == demande si ce sont\n        // les deux memes objets en memoire, ce qui n'est pas la question posee.\n        double reductionCarte;\n        if (carte.equals(\"jeune\")) {\n            reductionCarte = 0.25;\n        } else if (carte.equals(\"senior\")) {\n            reductionCarte = 0.20;\n        } else if (carte.equals(\"famille\")) {\n            reductionCarte = 0.15;\n        } else {\n            reductionCarte = 0.00;\n        }\n\n        // Les deux reductions se COMPOSENT : on applique la seconde a ce qui\n        // reste apres la premiere, on ne les additionne pas.\n        double prix = PLEIN_TARIF * (1 - reductionAge) * (1 - reductionCarte);\n        if (pointe.equals(\"oui\")) {\n            prix = prix * MAJORATION_POINTE;\n        }\n        double prixArrondi = Math.round(prix * 100) / 100.0;\n\n        System.out.println();\n        System.out.println(\"Catégorie : \" + categorie);\n        System.out.println(\"Réduction d'âge : \" + (int) (reductionAge * 100) + \" %\");\n        System.out.println(\"Réduction carte : \" + (int) (reductionCarte * 100) + \" %\");\n        System.out.println(\"Heure de pointe : \" + pointe);\n        System.out.println(\"Prix du billet : \" + prixArrondi + \" €\");\n    }\n}",

        "Ton fichier ressemble à ceci :<br><code>double valeurBase; String nomCategorie;</code><br><code>switch (categorie) {</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;case 1: … break;</code> ← quatre fois, plus un <code>default</code><br><code>}</code><br><code>double coefficient; String nomEtat;</code><br><code>if (etat == 1) {</code> … <code>} else if (…) {</code> … <code>}</code><br><code>double bon = valeurBase * …;</code><br><code>if (adherent.equals(…)) {</code> … <code>}</code><br><code>…</code> ← les quatre lignes du reçu<br><code>if (etat == 4) {</code> … <code>} else {</code> … <code>}</code>"

      "solution": "// La ressourcerie du quartier - jour 1 sur 4.\n// Un depot, une estimation. Le programme ne sait traiter qu'un seul objet :\n// c'est sa limite du jour, et la boucle de demain la levera.\nimport java.util.Scanner;\n\npublic class Ressourcerie {\n    public static void main(String[] args) {\n        final double PRIME_ADHERENT = 1.10;\n\n        Scanner clavier = new Scanner(System.in);\n\n        System.out.print(\"Nom du déposant : \");\n        String deposant = clavier.nextLine();\n        System.out.print(\"Catégorie (1 meuble, 2 électro, 3 livre, 4 vêtement) : \");\n        int categorie = clavier.nextInt();\n        System.out.print(\"État (1 comme neuf, 2 bon, 3 usagé, 4 irréparable) : \");\n        int etat = clavier.nextInt();\n        System.out.print(\"Adhérent (oui/non) : \");\n        String adherent = clavier.next();\n\n        // switch sur la categorie : quatre egalites exactes, plus un default\n        // qui n'est pas decoratif - c'est lui qui rattrape une saisie fausse.\n        double valeurBase;\n        String nomCategorie;\n        switch (categorie) {\n            case 1:\n                valeurBase = 20.00;\n                nomCategorie = \"meuble\";\n                break;\n            case 2:\n                valeurBase = 15.00;\n                nomCategorie = \"électroménager\";\n                break;\n            case 3:\n                valeurBase = 2.00;\n                nomCategorie = \"livre\";\n                break;\n            case 4:\n                valeurBase = 3.00;\n                nomCategorie = \"vêtement\";\n                break;\n            default:\n                valeurBase = 0.00;\n                nomCategorie = \"catégorie inconnue\";\n                break;\n        }\n\n        // L'etat se prete a une cascade plutot qu'a un switch : on y lira\n        // demain des intervalles, et switch ne sait comparer que des egalites.\n        double coefficient;\n        String nomEtat;\n        if (etat == 1) {\n            coefficient = 1.00;\n            nomEtat = \"comme neuf\";\n        } else if (etat == 2) {\n            coefficient = 0.60;\n            nomEtat = \"bon\";\n        } else if (etat == 3) {\n            coefficient = 0.30;\n            nomEtat = \"usagé\";\n        } else {\n            coefficient = 0.00;\n            nomEtat = \"irréparable\";\n        }\n\n        double bon = valeurBase * coefficient;\n        if (adherent.equals(\"oui\")) {\n            bon = bon * PRIME_ADHERENT;\n        }\n        double bonArrondi = Math.round(bon * 100) / 100.0;\n\n        System.out.println();\n        System.out.println(\"--- Reçu de dépôt ---\");\n        System.out.println(\"Déposant : \" + deposant);\n        System.out.println(\"Objet : \" + nomCategorie + \", état \" + nomEtat);\n        System.out.println(\"Valeur de base : \" + valeurBase + \" €\");\n\n        // Un objet irreparable n'est pas refuse : il est accepte pour la\n        // matiere, mais il n'ouvre droit a aucun bon. Le dire explicitement\n        // vaut mieux que d'afficher un bon de 0,00 € sans commentaire.\n        if (etat == 4) {\n            System.out.println(\"Aucun bon d'achat : objet orienté vers le recyclage matière.\");\n        } else {\n            System.out.println(\"Bon d'achat remis : \" + bonArrondi + \" €\");\n        }\n    }\n}",
