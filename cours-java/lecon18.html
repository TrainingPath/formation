  title: "HashMap et les collections",
  subtitle: "Associer des clés à des valeurs : le dictionnaire de Java.",
  theory: `
<h3>1. Le problème de l'association</h3>
<p>« Quelle est la note d'Ana ? » Avec une ArrayList, il faut PARCOURIR toute la liste pour retrouver Ana (recherche séquentielle, lente si la liste est grande). La <strong>HashMap</strong> est comme un dictionnaire : elle associe directement une <strong>clé</strong> (le mot qu'on cherche) à une <strong>valeur</strong> (sa définition). On demande la clé « Ana », on obtient sa note quasi instantanément, sans parcours.</p>

<h3>2. Créer et manipuler une HashMap</h3>
<pre class="pseudo">import java.util.HashMap;                            // import nécessaire (où trouver la classe HashMap)

HashMap&lt;String, Integer&gt; notes = new HashMap&lt;&gt;();   // clés String (les noms) → valeurs Integer (les notes)
notes.put("Ana", 14);            // ASSOCIE la clé "Ana" à la valeur 14
notes.put("Bob", 9);             // une autre paire clé→valeur
notes.put("Zoé", 16);
notes.get("Ana")                 // → 14 : accès DIRECT par la clé (pas de parcours)
notes.get("Max")                 // → null : la clé "Max" n'existe pas !
notes.put("Bob", 11);            // RE-put sur une clé existante : REMPLACE l'ancienne valeur (9 → 11)
notes.containsKey("Zoé")         // → true : la clé est-elle présente ?
notes.remove("Bob");             // supprime la paire "Bob"
notes.size()                     // → le nombre de paires</pre>
<div class="warn">Une clé est UNIQUE : <code>put</code> sur une clé existante ÉCRASE la valeur (comme une affectation). Et <code>get</code> sur une clé absente rend <code>null</code> — gare au <code>NullPointerException</code> si tu l'utilises sans tester !</div>

<h3>3. getOrDefault : le null apprivoisé</h3>
<pre class="pseudo">int n = notes.getOrDefault("Max", 0);    // renvoie la note de Max, ou 0 s'il est absent → plus de null à gérer</pre>
<p><code>getOrDefault</code> fournit une valeur de repli quand la clé n'existe pas : indispensable pour éviter les <code>null</code>.</p>

<h3>4. Parcourir une HashMap</h3>
<pre class="pseudo">for (String cle : notes.keySet()) {              // keySet() = l'ensemble des CLÉS
    System.out.println(cle + " → " + notes.get(cle));  // pour chaque clé, on récupère sa valeur
}
for (int valeur : notes.values()) { /* ... */ }  // values() = les valeurs seules</pre>
<p>Attention : l'ordre de parcours n'est PAS l'ordre d'insertion (la HashMap range les éléments selon sa mécanique interne). Pour un ordre stable, il faut trier les clés ou utiliser une <code>LinkedHashMap</code>/<code>TreeMap</code>.</p>

<h3>5. Le motif star : compter les occurrences</h3>
<pre class="pseudo">String[] mots = {"chat", "chien", "chat", "oiseau", "chat"};
HashMap&lt;String, Integer&gt; compteur = new HashMap&lt;&gt;();   // mot → nombre d'apparitions
for (String mot : mots) {
    compteur.put(mot, compteur.getOrDefault(mot, 0) + 1);  // lit le compte actuel (0 si nouveau) et ajoute 1
}
// résultat : {chat=3, chien=1, oiseau=1}</pre>
<p>C'est le motif compteur (leçon 6) démultiplié : UN compteur PAR clé, créé à la volée. <code>getOrDefault(mot, 0) + 1</code> gère élégamment la première apparition (compteur à 0). Ce motif résout mille problèmes : votes, fréquences, inventaires…</p>

<h3>6. Quelle collection pour quel besoin ?</h3>
<pre class="pseudo">Ordre + doublons + accès par position   → ArrayList    // une liste ordonnée d'éléments
Association clé → valeur, accès direct   → HashMap     // retrouver une valeur par sa clé
Unicité (pas de doublons)                → HashSet     // un ensemble sans répétition
File / pile                              → ArrayDeque  // ajouts/retraits aux extrémités</pre>`,

    { type: "qcm", q: "L'avantage de la HashMap sur l'ArrayList pour « la note d'Ana » :", opts: ["Elle trie", "Accès DIRECT par clé (O(1)) au lieu d'un parcours (O(n)) — le jour 28 en action", "Elle occupe moins de mémoire", "Elle autorise les clés en double"], a: 1, exp: "Pas de recherche : la clé mène droit à la valeur." },

    { type: "qcm", q: "L'ordre de parcours d'une HashMap est…", opts: ["L'ordre d'insertion", "IMPRÉVISIBLE : la map range selon sa mécanique interne", "Alphabétique", "Décroissant"], a: 1, exp: "Besoin d'ordre ? Trier les clés, ou utiliser TreeMap/LinkedHashMap." },
    { type: "qcm", q: "Dans le compteur d'occurrences, que fait <code>compteur.getOrDefault(mot, 0) + 1</code> ?", opts: ["Compte les clés", "Lit le compte actuel du mot (0 s'il est nouveau) et ajoute 1 : un compteur PAR clé", "Supprime le mot", "Trie les mots"], a: 1, exp: "Le c ← c + 1 du jour 12, distribué par clé." },
    { type: "input", q: "Votes : {\"A\",\"B\",\"A\",\"A\",\"C\",\"B\"} passés au compteur. Que vaut compteur.get(\"A\") ?", a: "3", ph: "nombre", exp: "Trois votes A : le dépouillement automatique." },
    { type: "qcm", q: "Stocker le panier d'un client (produits dans l'ordre, doublons possibles) :", opts: ["HashMap", "ArrayList : ordre et doublons sont naturels", "HashSet", "int[]"], a: 1, exp: "Le guide de choix : chaque structure a sa mission." },
    { type: "qcm", q: "Stocker « code postal → nom de ville » :", opts: ["ArrayList", "HashMap<String, String> : une association pure", "int[]", "String[]"], a: 1, exp: "Clé unique → valeur : la définition même de la map." },
    { type: "qcm", q: "Un HashSet garantit…", opts: ["L'ordre d'insertion", "L'UNICITÉ : ajouter un doublon ne fait rien", "Des paires clé-valeur", "Un tri"], a: 1, exp: "« La liste des participants sans doublons » : HashSet. Le cousin de la map (des clés sans valeurs)." }
  ],
  final: {
    title: "Exercice final — L'inventaire du magasin",
    intro: `<p>Le stock du magasin vit dans une map :</p>
<pre class="pseudo">HashMap&lt;String, Integer&gt; stock = new HashMap&lt;&gt;();     // produit → quantité en stock
stock.put("pomme", 12);                              // 12 pommes
stock.put("poire", 5);                               // 5 poires
stock.put("kiwi", 0);                                // 0 kiwi (déjà en rupture)
// Vente de 3 pommes :
stock.put("pomme", stock.get("pomme") - 3);          // (1) lit 12, calcule 9, réécrit
// Arrivage de 10 mangues (nouveau produit) :
stock.put("mangue", stock.getOrDefault("mangue", 0) + 10);   // (2) 0 par défaut (nouveau) + 10
// Rapport des ruptures :
for (String produit : stock.keySet()) {              // parcourt chaque produit (clé)
    if (stock.get(produit) == 0) {                   // quantité nulle = rupture ?
        System.out.println("RUPTURE : " + produit);   // (3) signale le produit épuisé
    }
}</pre>`,
    questions: [
      { type: "input", q: "(1) Que vaut stock.get(\"pomme\") après la vente ?", a: "9", ph: "nombre", exp: "12 − 3 = 9 : lecture, calcul, ré-écriture — la mise à jour type d'une map." },
      { type: "qcm", q: "(2) Pourquoi getOrDefault plutôt que get pour la mangue ?", opts: ["C'est plus court", "La mangue n'existe pas encore : get rendrait null et null + 10 exploserait", "get est déprécié", "Pour trier"], a: 1, exp: "getOrDefault gère les deux cas (nouveau/existant) en une ligne." },
      { type: "input", q: "(3) Quel produit apparaît dans le rapport de rupture ?", a: ["kiwi", "le kiwi", "KIWI"], ph: "produit", exp: "Seul le kiwi est à 0. Le filtre conditionnel du jour 12, sur map." },
      { type: "input", q: "Que vaut stock.size() à la fin ?", a: "4", ph: "nombre", exp: "pomme, poire, kiwi, mangue : 4 clés." },
      { type: "qcm", q: "Un client demande « avocat ». Quel code SÛRE pour afficher le stock ?", opts: ["System.out.println(stock.get(\"avocat\") + 0);", "System.out.println(stock.getOrDefault(\"avocat\", 0));", "stock.put(\"avocat\")", "stock.remove(\"avocat\")"], a: 1, exp: "0 par défaut : ni null, ni exception, juste « pas de stock ». Le cas limite (jour 30) traité avec élégance." }
    ],
    solution: `<pre class="pseudo">Après (1) : {pomme=9, poire=5, kiwi=0}
Après (2) : {pomme=9, poire=5, kiwi=0, mangue=10}
Rapport   : RUPTURE : kiwi
size      : 4

Motifs : mise à jour lecture→calcul→put, getOrDefault
anti-null, parcours keySet + filtre conditionnel.</pre>
<p>ArrayList pour les séquences, HashMap pour les associations : avec ces deux-là (et tes classes !), tu peux modéliser presque n'importe quel système. Prochaine étape : les utilitaires Random et dates, puis le PROJET.</p>`
  }
