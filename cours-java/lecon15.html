  title: "Interfaces et classes abstraites",
  subtitle: "Des contrats sans implémentation : programmer par promesses.",
  theory: `
<h3>1. La classe abstraite : un moule inachevé</h3>
<p>Créer un <code>new Animal("X")</code> a-t-il un sens ? Un animal « générique » n'existe pas : seuls existent des chiens, des chats… On rend donc la classe <strong>abstraite</strong> : elle sert de base commune (un moule inachevé), mais ne peut plus être fabriquée directement.</p>
<pre class="pseudo">public abstract class Animal {                                 // abstract : on ne pourra pas faire new Animal(...)
    protected String nom;
    public Animal(String nom) { this.nom = nom; }
    public void manger() { System.out.println(nom + " mange"); }   // méthode CONCRÈTE : code fourni, partagé
    public abstract void crier();       // méthode ABSTRAITE : aucun corps, à définir dans chaque fille
}
Animal a = new Animal("X");     // ERREUR : on n'instancie pas une classe abstraite
Animal a = new Chien("Rex");    // OK : Chien est une classe concrète qui complète le moule</pre>
<p>Une méthode <code>abstract</code> n'a pas de corps (pas de code entre accolades) : chaque classe fille concrète est <strong>OBLIGÉE</strong> de la redéfinir, et le compilateur le vérifie. Fini le « ... » par défaut sans signification : l'obligation est garantie.</p>

<h3>2. L'interface : un contrat pur</h3>
<p>Une <strong>interface</strong> ne contient (classiquement) que des <strong>signatures</strong> (le nom et les paramètres d'une méthode, sans son code) : elle dit CE QU'ON SAIT FAIRE, pas comment. C'est une promesse, un contrat à honorer.</p>
<pre class="pseudo">public interface Comparable2 {
    int comparerA(Object autre);        // juste la signature : une promesse, aucun code
}
public interface Imprimable {
    void imprimer();
}

public class Facture implements Imprimable, Comparable2 {   // une classe peut signer PLUSIEURS contrats !
    public void imprimer() { /* ... */ }       // elle DOIT fournir le code de chaque méthode promise
    public int comparerA(Object autre) { /* ... */ }
}</pre>

<h3>3. extends vs implements</h3>
<pre class="pseudo">extends    → hériter d'UNE classe (attributs + code + contrat)     // une seule classe mère
implements → signer PLUSIEURS contrats (que des promesses à tenir) // autant d'interfaces que voulu</pre>

<h3>4. Programmer contre l'interface</h3>
<pre class="pseudo">ArrayList&lt;Imprimable&gt; documents = new ArrayList&lt;&gt;();   // une liste de « tout ce qui sait s'imprimer »
documents.add(new Facture());
documents.add(new Bulletin());
documents.add(new Affiche());
for (Imprimable doc : documents) {
    doc.imprimer();              // chacun s'imprime à sa façon : polymorphisme via l'interface !
}</pre>
<p>La boucle ignore tout des classes concrètes : elle ne connaît que le contrat <code>Imprimable</code>. On peut y brancher n'importe quelle classe future qui « implements Imprimable » sans toucher à ce code.</p>

<h3>5. Dans la vraie vie Java</h3>
<pre class="pseudo">class ArrayList implements List          // List est une interface, ArrayList une de ses implémentations
List&lt;String&gt; l = new ArrayList&lt;&gt;();     // on type la variable avec le CONTRAT (List), pas l'implémentation
Comparable, Runnable, Comparator...      // interfaces standard omniprésentes dans Java</pre>
<p>Typer la variable avec l'interface (<code>List</code> plutôt que <code>ArrayList</code>) permet de changer d'implémentation plus tard (par ex. <code>LinkedList</code>) sans réécrire le code qui l'utilise.</p>
<div class="tip">Choix rapide : du CODE COMMUN à partager + relation « est un » → classe abstraite. Juste un RÔLE/CAPACITÉ (imprimable, comparable, volant…) → interface. Les deux se combinent : une classe <code>extends</code> UNE classe et <code>implements</code> PLUSIEURS interfaces.</div>`,

    intro: `<p>Une société de livraison modélise :</p>
<pre class="pseudo">public abstract class Vehicule {                     // classe abstraite : pas de new Vehicule direct
    protected String immat;                          // attribut commun : plaque d'immatriculation
    public Vehicule(String immat) { this.immat = immat; } // constructeur commun
    public void demarrer() { System.out.println(immat + " démarre"); } // code partagé (concret)
    public abstract double coutParKm();              // ABSTRAITE : chaque type calcule le sien
}
public interface Electrique {                        // contrat : « je sais me recharger »
    void recharger();                                // signature seule, aucun code
}
public class Camion extends Vehicule {               // Camion EST UN Vehicule
    public Camion(String i) { super(i); }            // délègue l'immat à la mère
    public double coutParKm() { return 0.9; }        // fournit sa version obligatoire
}
public class VeloCargo extends Vehicule implements Electrique { // hérite ET signe un contrat
    public VeloCargo(String i) { super(i); }         // constructeur
    public double coutParKm() { return 0.05; }       // sa version du coût
    public void recharger() { System.out.println(immat + " en charge"); } // honore le contrat Electrique
}</pre>`,

      { type: "qcm", q: "VeloCargo cumule extends Vehicule et implements Electrique. C'est possible car…", opts: ["Java accepte tout", "UNE classe mère + PLUSIEURS interfaces : la règle Java exacte", "Vehicule est une interface", "Electrique est abstraite"], a: 1, exp: "Héritage simple, contrats multiples : le résumé de la leçon." }
    ],
    solution: `<pre class="pseudo">Vehicule (abstraite)          Electrique (interface)
   ├── Camion (0.9 €/km)          ▲
   └── VeloCargo (0.05 €/km) ────┘ (implements)

Parc : total += v.coutParKm()   → polymorphisme
Recharge : if (v instanceof Electrique) → contrat testé
new Vehicule(...) → interdit : le générique n'existe pas</pre>
<p>Classe abstraite = base commune inachevée ; interface = capacité signable par n'importe qui. Avec l'héritage d'hier, tu tiens tout l'arsenal de conception Java. Demain : gérer les erreurs proprement.</p>`

      "solution": "// La saison du theatre : une classe abstraite qui impose ce que chaque\n// spectacle doit savoir faire, sans decider comment.\n\npublic class Theatre {\n    public static void main(String[] args) {\n        // On ne peut PAS ecrire new Spectacle(...) : la classe est\n        // inachevee, elle ne sait pas calculer un prix.\n        Spectacle[] saison = {\n            new Piece(\"Le Misanthrope\", 145, 320),\n            new Concert(\"Trio Vents du Nord\", 90, 180),\n            new Conference(\"Habiter la ville en 2050\", 75, 200),\n            new Piece(\"En attendant Godot\", 105, 250)\n        };\n\n        for (Spectacle s : saison) {\n            System.out.println(s.resume());\n        }\n\n        int minutesTotal = 0;\n        double recette = 0.0;\n        Spectacle leplusLong = saison[0];\n        for (Spectacle s : saison) {\n            minutesTotal = minutesTotal + s.getDureeMinutes();\n            recette = recette + s.recetteMaximale();\n            if (s.getDureeMinutes() > leplusLong.getDureeMinutes()) {\n                leplusLong = s;\n            }\n        }\n\n        System.out.println();\n        System.out.println(\"Spectacles à l'affiche : \" + saison.length);\n        System.out.println(\"Durée cumulée : \" + (minutesTotal / 60) + \" h \" + (minutesTotal % 60) + \" min\");\n        System.out.println(\"Le plus long : \" + leplusLong.getTitre());\n        System.out.println(\"Recette maximale : \" + Math.round(recette * 100) / 100.0 + \" €\");\n    }\n}\n\n// abstract : ce moule est inachevé. Il porte des donnees et du comportement\n// commun, mais laisse un trou que chaque fille doit boucher.\nabstract class Spectacle {\n    private String titre;\n    private int dureeMinutes;\n    private int placesDisponibles;\n\n    Spectacle(String titre, int dureeMinutes, int placesDisponibles) {\n        this.titre = titre;\n        this.dureeMinutes = dureeMinutes;\n        this.placesDisponibles = placesDisponibles;\n    }\n\n    String getTitre() {\n        return titre;\n    }\n\n    int getDureeMinutes() {\n        return dureeMinutes;\n    }\n\n    int getPlacesDisponibles() {\n        return placesDisponibles;\n    }\n\n    // Aucun corps : c'est le trou. Toute fille concrete DOIT le boucher,\n    // et le compilateur refuse celles qui ne le font pas.\n    abstract double prixPlace();\n\n    abstract String genre();\n\n    // Du comportement commun, ecrit une fois, qui s'appuie sur le trou.\n    double recetteMaximale() {\n        return Math.round(prixPlace() * placesDisponibles * 100) / 100.0;\n    }\n\n    String resume() {\n        return genre() + \" « \" + titre + \" » — \" + dureeMinutes + \" min, \"\n               + placesDisponibles + \" places à \" + prixPlace() + \" €, soit \"\n               + recetteMaximale() + \" € au maximum\";\n    }\n}\n\nclass Piece extends Spectacle {\n    Piece(String titre, int dureeMinutes, int placesDisponibles) {\n        super(titre, dureeMinutes, placesDisponibles);\n    }\n\n    @Override\n    double prixPlace() {\n        return 22.00;\n    }\n\n    @Override\n    String genre() {\n        return \"Théâtre\";\n    }\n}\n\nclass Concert extends Spectacle {\n    Concert(String titre, int dureeMinutes, int placesDisponibles) {\n        super(titre, dureeMinutes, placesDisponibles);\n    }\n\n    @Override\n    double prixPlace() {\n        return 18.50;\n    }\n\n    @Override\n    String genre() {\n        return \"Concert\";\n    }\n}\n\nclass Conference extends Spectacle {\n    Conference(String titre, int dureeMinutes, int placesDisponibles) {\n        super(titre, dureeMinutes, placesDisponibles);\n    }\n\n    @Override\n    double prixPlace() {\n        return 6.00;\n    }\n\n    @Override\n    String genre() {\n        return \"Conférence\";\n    }\n}",

          "texte": "Pourquoi une turbine ne pourrait-elle pas obtenir le même résultat en héritant d'une classe « Mesurable » et d'une classe « Entretenable » ? Réponds en une phrase sur ce que Java interdit, et en une autre sur la raison de cette interdiction."
        }
      ],
      "reflexion": "Les méthodes qui remplissent un contrat doivent être déclarées accessibles à tous, alors que rien ne t'y obligeait dans les exercices d'héritage des jours précédents. Essaie de les déclarer sans cette mention et lis le refus du compilateur. Pourquoi cette règle est-elle inévitable ? Pense à ce qu'un contrat promet, et à qui.",
      "remarque": "Le nom d'une interface finit souvent par « -able » ou « -ible » : c'est une convention forte de l'écosystème Java, qu'on retrouve dans les interfaces standard du langage. Elle dit bien ce qu'une interface est : une capacité, pas une identité.",
      "indices": [
        "L'énoncé décrit deux ensembles qui se recoupent partiellement : tout ce qui se relève, et une partie de ce qui se relève. Dessine ces deux ensembles sur ton brouillon avec les quatre équipements dedans. Tu verras immédiatement pourquoi une seule hiérarchie ne peut pas décrire cette situation.",
        "Le plan : deux contrats déclarant seulement des signatures, puis trois classes indépendantes, chacune annonçant les contrats qu'elle remplit. Le programme principal construit deux tableaux de types différents à partir des mêmes objets, et les parcourt séparément.",
        "Attention à un détail qui surprend : le même objet apparaît dans les deux tableaux, sans être copié ni converti. Une turbine est simultanément un instrument relevable et un équipement à entretenir ; ce ne sont pas deux versions d'elle, ce sont deux façons de la regarder. Un contrat est une paire de lunettes, pas un moule.",
        "Le point dur est la question d, et elle porte sur une limite du langage : une classe Java ne peut avoir qu'une seule classe mère. La raison n'est pas un caprice — hériter de deux mères qui définiraient toutes deux une méthode du même nom poserait une question sans réponse : laquelle appliquer ? Les interfaces échappent au problème précisément parce qu'elles ne fournissent aucun corps, donc rien qui puisse entrer en conflit. Autre détail pratique : une classe qui annonce un contrat sans en fournir toutes les méthodes ne compile pas, et le message nomme précisément celle qui manque.",
        "Ton fichier ressemble à ceci :<br><code>interface Mesurable {</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;String designation();</code> ← que des signatures<br><code>&nbsp;&nbsp;&nbsp;&nbsp;double valeurMesuree();</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;String unite();</code><br><code>}</code><br><code>interface Entretenable {</code> … <code>}</code><br><code>class Turbine implements Mesurable, Entretenable {</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;@Override</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public String designation() {</code> … <code>}</code><br><code>}</code><br><code>class Capteur implements Mesurable {</code> … <code>}</code><br><code>Mesurable[] instruments = {…};</code><br><code>Entretenable[] aEntretenir = {…};</code> ← pas les mêmes objets"
      ],
      "solution": "// La centrale hydroelectrique : deux contrats independants, et une classe\n// qui remplit les deux. C'est ce que l'heritage simple ne permet pas.\n\npublic class Centrale {\n    public static void main(String[] args) {\n        Turbine t1 = new Turbine(\"Turbine amont\", 4200);\n        Turbine t2 = new Turbine(\"Turbine aval\", 3100);\n        Vanne v1 = new Vanne(\"Vanne de garde\", 78);\n        Capteur c1 = new Capteur(\"Sonde de niveau\", 12.4);\n\n        // Un tableau du type du CONTRAT : il accepte tout ce qui le remplit,\n        // quelle que soit la famille de classes d'ou l'objet vient.\n        Mesurable[] instruments = {t1, t2, v1, c1};\n        for (Mesurable m : instruments) {\n            System.out.println(m.designation() + \" : \" + m.valeurMesuree() + \" \" + m.unite());\n        }\n\n        System.out.println();\n        // Second contrat, rempli par une partie seulement des equipements.\n        Entretenable[] aEntretenir = {t1, t2, v1};\n        int heures = 0;\n        for (Entretenable e : aEntretenir) {\n            heures = heures + e.heuresEntretienAnnuel();\n        }\n        System.out.println(\"Équipements sous entretien : \" + aEntretenir.length);\n        System.out.println(\"Heures d'entretien par an : \" + heures + \" h\");\n\n        double productionTotale = t1.valeurMesuree() + t2.valeurMesuree();\n        System.out.println(\"Production instantanée : \" + productionTotale + \" kW\");\n        System.out.println(\"Instruments mesurés : \" + instruments.length\n                           + \", dont \" + aEntretenir.length + \" sous contrat d'entretien\");\n        System.out.println(\"Hors entretien : \" + c1.designation()\n                           + \" — un capteur se relève, il ne se révise pas.\");\n    }\n}\n\n// Une interface est un CONTRAT pur : que des signatures, aucun corps.\n// Elle ne dit pas ce qu'est l'objet, seulement ce qu'il sait faire.\ninterface Mesurable {\n    String designation();\n    double valeurMesuree();\n    String unite();\n}\n\ninterface Entretenable {\n    int heuresEntretienAnnuel();\n}\n\n// implements, et non extends : une turbine n'EST PAS une mesure, elle\n// SAIT SE mesurer. Et elle peut remplir plusieurs contrats a la fois.\nclass Turbine implements Mesurable, Entretenable {\n    private String nom;\n    private double puissanceKw;\n\n    Turbine(String nom, double puissanceKw) {\n        this.nom = nom;\n        this.puissanceKw = puissanceKw;\n    }\n\n    @Override\n    public String designation() {\n        return nom;\n    }\n\n    @Override\n    public double valeurMesuree() {\n        return puissanceKw;\n    }\n\n    @Override\n    public String unite() {\n        return \"kW\";\n    }\n\n    @Override\n    public int heuresEntretienAnnuel() {\n        return 40;\n    }\n}\n\nclass Vanne implements Mesurable, Entretenable {\n    private String nom;\n    private int ouverturePourcent;\n\n    Vanne(String nom, int ouverturePourcent) {\n        this.nom = nom;\n        this.ouverturePourcent = ouverturePourcent;\n    }\n\n    @Override\n    public String designation() {\n        return nom;\n    }\n\n    @Override\n    public double valeurMesuree() {\n        return ouverturePourcent;\n    }\n\n    @Override\n    public String unite() {\n        return \"%\";\n    }\n\n    @Override\n    public int heuresEntretienAnnuel() {\n        return 12;\n    }\n}\n\n// Un capteur se mesure mais ne s'entretient pas : il ne remplit qu'un\n// seul des deux contrats, et c'est parfaitement legitime.\nclass Capteur implements Mesurable {\n    private String nom;\n    private double metres;\n\n    Capteur(String nom, double metres) {\n        this.nom = nom;\n        this.metres = metres;\n    }\n\n    @Override\n    public String designation() {\n        return nom;\n    }\n\n    @Override\n    public double valeurMesuree() {\n        return metres;\n    }\n\n    @Override\n    public String unite() {\n        return \"m\";\n    }\n}",

          "ref": "d",
          "texte": "Parce que Java interdit d'hériter de plusieurs classes : une classe n'a qu'une seule mère. L'interdiction existe pour éviter une ambiguïté insoluble — si deux mères fournissaient chacune un corps pour une méthode du même nom, rien ne permettrait de décider laquelle s'applique. Les interfaces ne posent pas ce problème puisqu'elles ne fournissent aucun corps : il n'y a rien à départager."
        },
        {
          "ref": "Réflexion",
          "texte": "Sans la mention d'accessibilité, le compilateur refuse avec un message du type <em>attempting to assign weaker access privileges</em>. La règle est inévitable parce qu'un contrat est une promesse faite à tout le monde : n'importe quel code détenant une variable du type de l'interface doit pouvoir appeler les méthodes annoncées. Si la classe les rendait moins accessibles que le contrat ne l'annonce, la promesse serait rompue — et elle serait rompue à l'exécution, dans du code parfaitement légitime qui ne connaît que l'interface. Le compilateur ferme cette porte à la compilation, ce qui est le seul moment où c'est encore réparable. Une interface ne peut donc pas contenir de méthode discrète : tout ce qu'elle déclare est public par nature."
        }

      "hier": "lecon14.html",
      "enonce": "La ville complète son offre par des trottinettes. Une trottinette n'est pas un vélo : elle n'a ni année de mise en service ni compteur de courses, son tarif est une prise en charge fixe de 1,00 €, et elle refuse la location sous 15 % d'autonomie, chaque course en consommant 10 points. Mais la ville veut une flotte unique, où tout engin sache donner son identifiant, se décrire, dire s'il est disponible, se louer, se rendre et annoncer son tarif. Écris ce contrat, fais-le remplir par ta classe de vélos — le vélo électrique continuant d'en hériter — et écris la classe des trottinettes sans aucun lien de parenté avec les vélos. Le programme principal constitue une flotte de quatre engins dont une trottinette à 12 % d'autonomie, affiche le catalogue, tente une location sur chacun, puis affiche le nombre d'engins, le nombre en course et la recette engagée.",
      "principe": "L'héritage et l'interface ne sont pas concurrents, ils répondent à deux questions différentes. L'héritage dit « ceci est une sorte de cela » et permet de partager du code ; l'interface dit « ceci sait faire cela » et permet de traiter ensemble des choses sans parenté. Un même programme utilise normalement les deux, comme ici.",
      "reflexion": "On pourrait faire descendre la trottinette de la classe des vélos : elle hériterait de la gestion de l'état et du compteur, et il suffirait de redéfinir le tarif. Le programme fonctionnerait. Nomme trois choses qui seraient fausses dans le code obtenu — pas des maladresses de style, des affirmations que le code énoncerait et qui ne seraient pas vraies. Puis dis à quel moment concret cela finirait par coûter quelque chose.",
      "remarque": "Ta classe de vélos change peu : elle annonce le contrat et rend publiques les méthodes qui le remplissent. C'est le signe qu'elle était bien conçue — un contrat qu'on peut faire remplir par une classe existante en modifiant seulement ses déclarations décrit une capacité qu'elle avait déjà.",
      "indices": [
        "Commence par le contrat, et écris-le en regardant ce dont le programme principal a besoin — pas ce que tes classes savent faire. C'est l'ordre qui compte : une interface se déduit des besoins de l'appelant, sinon elle n'est qu'un résumé de l'existant et n'apporte rien. Six méthodes suffisent ici.",
        "Le plan : l'interface, puis la classe de vélos qui l'annonce et dont les six méthodes deviennent accessibles à tous, puis la classe des vélos électriques inchangée dans son principe — elle hérite, donc elle remplit le contrat par héritage —, puis la classe des trottinettes, écrite de zéro. Le programme principal déclare son tableau du type du contrat.",
        "Note ce que la classe des vélos électriques n'a pas à faire : elle n'annonce pas le contrat. Elle hérite d'une classe qui le remplit, elle le remplit donc aussi — et ses redéfinitions valent redéfinitions des méthodes du contrat. Cela mérite d'être vérifié plutôt que cru : mets un électrique dans le tableau de la flotte et regarde si le compilateur proteste.",
        "Le point dur est la trottinette, parce que la tentation d'hériter est forte : elle aurait tout de suite un état, un compteur, une méthode de retour. Résiste. La classe des vélos porte une année de mise en service et un compteur de courses dont la trottinette n'a que faire, et surtout une règle de tarif — la remise « vélo ancien » — qui ne veut rien dire pour elle. Écris ses trois champs à part ; le peu que tu recopieras est le prix de l'honnêteté du modèle.",
        "Ton fichier ressemble à ceci :<br><code>interface Louable {</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;String identifiant();</code> … <code>boolean louer();</code> … <code>double tarifCourse();</code><br><code>}</code><br><code>class Velo implements Louable {</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;@Override</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public boolean louer() {</code> … <code>}</code><br><code>}</code><br><code>class VeloElectrique extends Velo {</code> … <code>}</code> ← pas d'<code>implements</code><br><code>class Trottinette implements Louable {</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;private int autonomiePourcent;</code> … <code>private boolean disponible;</code><br><code>}</code><br><code>Louable[] flotte = {…};</code>"

      "solution": "// Le parc a velos partages - jour 3 sur 4.\n// La ville ajoute des trottinettes. Une trottinette n'EST PAS un velo :\n// l'heritage ne convient pas. Mais les deux SAVENT se louer.\n\npublic class ParcMobilite {\n    public static void main(String[] args) {\n        Velo v1 = new Velo(\"BXL-0142\", 2021);\n        VeloElectrique e1 = new VeloElectrique(\"BXE-0501\", 2023, 90);\n        Trottinette t1 = new Trottinette(\"TRT-0210\", 55);\n        Trottinette t2 = new Trottinette(\"TRT-0211\", 12);\n\n        // Le tableau est declare du type du CONTRAT. Il contient deux\n        // familles de classes sans aucun ancetre commun autre qu'Object.\n        Louable[] flotte = {v1, e1, t1, t2};\n        for (Louable l : flotte) {\n            System.out.println(l.identifiant() + \" — \" + l.description()\n                               + \" — \" + l.tarifCourse() + \" €\");\n        }\n\n        System.out.println();\n        for (Louable l : flotte) {\n            System.out.println(\"Location de \" + l.identifiant() + \" : \" + l.louer());\n        }\n\n        System.out.println();\n        double recette = 0.0;\n        int louees = 0;\n        for (Louable l : flotte) {\n            if (!l.estDisponible()) {\n                louees = louees + 1;\n                recette = recette + l.tarifCourse();\n            }\n        }\n        System.out.println(\"Engins de la flotte : \" + flotte.length);\n        System.out.println(\"En course : \" + louees);\n        System.out.println(\"Recette en cours : \" + Math.round(recette * 100) / 100.0 + \" €\");\n    }\n}\n\n// Le contrat : ce que tout engin partage doit savoir faire, quelle que\n// soit sa nature.\ninterface Louable {\n    String identifiant();\n    String description();\n    boolean estDisponible();\n    boolean louer();\n    boolean rendre();\n    double tarifCourse();\n}\n\nclass Velo implements Louable {\n    private static final double TARIF_BASE = 1.20;\n\n    private String code;\n    private int anneeMiseEnService;\n    private boolean disponible;\n    private int courses;\n\n    Velo(String code, int anneeMiseEnService) {\n        this.code = code.trim().toUpperCase();\n        this.anneeMiseEnService = anneeMiseEnService;\n        this.disponible = true;\n        this.courses = 0;\n    }\n\n    int getCourses() {\n        return courses;\n    }\n\n    int getAnneeMiseEnService() {\n        return anneeMiseEnService;\n    }\n\n    @Override\n    public String identifiant() {\n        return code;\n    }\n\n    @Override\n    public String description() {\n        return \"vélo mécanique, \" + courses + \" course(s)\";\n    }\n\n    @Override\n    public boolean estDisponible() {\n        return disponible;\n    }\n\n    @Override\n    public boolean louer() {\n        if (!disponible) {\n            return false;\n        }\n        disponible = false;\n        courses = courses + 1;\n        return true;\n    }\n\n    @Override\n    public boolean rendre() {\n        if (disponible) {\n            return false;\n        }\n        disponible = true;\n        return true;\n    }\n\n    @Override\n    public double tarifCourse() {\n        double tarif = TARIF_BASE;\n        if (anneeMiseEnService <= 2020) {\n            tarif = tarif - 0.30;\n        }\n        return Math.round(tarif * 100) / 100.0;\n    }\n}\n\n// L'heritage reste utile la ou il l'etait : un velo electrique EST un velo.\nclass VeloElectrique extends Velo {\n    private static final int BATTERIE_MINIMALE = 20;\n    private static final int CONSOMMATION_PAR_COURSE = 15;\n    private static final double SUPPLEMENT = 0.80;\n\n    private int batteriePourcent;\n\n    VeloElectrique(String code, int anneeMiseEnService, int batteriePourcent) {\n        super(code, anneeMiseEnService);\n        this.batteriePourcent = batteriePourcent;\n    }\n\n    @Override\n    public boolean louer() {\n        if (batteriePourcent < BATTERIE_MINIMALE) {\n            return false;\n        }\n        if (!super.louer()) {\n            return false;\n        }\n        batteriePourcent = batteriePourcent - CONSOMMATION_PAR_COURSE;\n        return true;\n    }\n\n    @Override\n    public double tarifCourse() {\n        return Math.round((super.tarifCourse() + SUPPLEMENT) * 100) / 100.0;\n    }\n\n    @Override\n    public String description() {\n        return \"vélo électrique (\" + batteriePourcent + \" %), \"\n               + getCourses() + \" course(s)\";\n    }\n}\n\n// Une trottinette ne descend d'aucun velo. Elle remplit le meme contrat,\n// et cela suffit pour qu'elle voyage dans la meme flotte.\nclass Trottinette implements Louable {\n    private static final double PRISE_EN_CHARGE = 1.00;\n    private static final int AUTONOMIE_MINIMALE = 15;\n\n    private String code;\n    private int autonomiePourcent;\n    private boolean disponible;\n\n    Trottinette(String code, int autonomiePourcent) {\n        this.code = code.trim().toUpperCase();\n        this.autonomiePourcent = autonomiePourcent;\n        this.disponible = true;\n    }\n\n    @Override\n    public String identifiant() {\n        return code;\n    }\n\n    @Override\n    public String description() {\n        return \"trottinette (\" + autonomiePourcent + \" % d'autonomie)\";\n    }\n\n    @Override\n    public boolean estDisponible() {\n        return disponible;\n    }\n\n    @Override\n    public boolean louer() {\n        if (!disponible || autonomiePourcent < AUTONOMIE_MINIMALE) {\n            return false;\n        }\n        disponible = false;\n        autonomiePourcent = autonomiePourcent - 10;\n        return true;\n    }\n\n    @Override\n    public boolean rendre() {\n        if (disponible) {\n            return false;\n        }\n        disponible = true;\n        return true;\n    }\n\n    @Override\n    public double tarifCourse() {\n        return PRISE_EN_CHARGE;\n    }\n}",
