  title: "Héritage et polymorphisme",
  subtitle: "Des classes qui en étendent d'autres : réutiliser sans copier.",
  theory: `
<h3>1. L'héritage : « est un »</h3>
<p>Un Chien EST UN Animal ; un Chat aussi. L'<strong>héritage</strong> permet à une classe de récupérer gratuitement tout ce qu'une autre possède. Plutôt que copier les attributs communs dans chaque classe, on crée une classe <strong>mère</strong> (le parent, plus général) et des classes <strong>filles</strong> (plus précises) qui en héritent avec le mot-clé <code>extends</code> :</p>
<pre class="pseudo">public class Animal {
    protected String nom;                 // protected : accessible dans la classe ET ses filles
    public Animal(String nom) { this.nom = nom; }
    public void manger() { System.out.println(nom + " mange"); }   // comportement commun à tous les animaux
    public void crier() { System.out.println("..."); }             // comportement générique, à préciser
}

public class Chien extends Animal {                    // « extends Animal » = Chien HÉRITE d'Animal
    public Chien(String nom) { super(nom); }           // super(nom) appelle le CONSTRUCTEUR de la mère
    public void crier() { System.out.println(nom + " : Wouf !"); }  // REDÉFINITION du cri générique
    public void rapporter() { System.out.println(nom + " rapporte la balle"); }  // méthode PROPRE au chien
}</pre>
<ul>
<li><code>extends</code> : Chien hérite de TOUT ce qu'Animal possède (<code>manger</code> existe gratuitement).</li>
<li><code>super(nom)</code> : la fille délègue à la mère l'initialisation de la partie commune.</li>
<li><code>crier()</code> redéfini : la fille REMPLACE le comportement hérité (on dit « override »).</li>
<li><code>rapporter()</code> : la fille peut AJOUTER ses propres méthodes.</li>
</ul>

<h3>2. Le polymorphisme : une variable mère, des objets fille</h3>
<pre class="pseudo">Animal a1 = new Chien("Rex");        // la variable est de type Animal, mais l'OBJET est un Chien : autorisé !
Animal a2 = new Chat("Mia");         // idem, un Chat
a1.crier();                          // affiche « Rex : Wouf ! » → la version CHIEN est choisie
a2.crier();                          // affiche « Mia : Miaou ! » → la version CHAT</pre>
<p>La MÊME ligne <code>a.crier()</code> produit des comportements différents selon l'objet réel : c'est le <strong>polymorphisme</strong> (littéralement « plusieurs formes »). Java regarde à l'EXÉCUTION le vrai type de l'objet (Chien, Chat…) pour décider quelle version de <code>crier</code> appeler.</p>

<h3>3. La puissance : traiter une collection hétérogène uniformément</h3>
<pre class="pseudo">ArrayList&lt;Animal&gt; zoo = new ArrayList&lt;&gt;();   // une liste d'Animal peut contenir chiens et chats
zoo.add(new Chien("Rex"));
zoo.add(new Chat("Mia"));
zoo.add(new Chien("Fido"));
for (Animal a : zoo) {
    a.crier();               // chacun crie À SA FAÇON, sans le moindre if sur le type !
}</pre>
<div class="tip">Sans polymorphisme : une cascade <code>if (type == chien)… else if (type == chat)…</code> à maintenir partout. Avec : chaque classe porte son comportement, la boucle reste simple, et ajouter une nouvelle espèce ne demande aucune modification de cette boucle. C'est LA élégance de la POO.</div>

<h3>4. Limites et règles</h3>
<pre class="pseudo">Animal a = new Chien("Rex");
a.rapporter();               // ERREUR : vue comme un Animal, « a » n'expose que manger/crier
                             // le compilateur ne « voit » que les méthodes du type de la VARIABLE
Chien c = new Chien("Rex");
c.rapporter();               // OK : la variable est de type Chien, qui connaît rapporter</pre>
<ul>
<li>Java ne permet qu'un héritage SIMPLE — une seule classe mère par classe.</li>
<li><code>@Override</code> au-dessus d'une redéfinition : le compilateur vérifie qu'on redéfinit bien une méthode existante (une faute de frappe est ainsi détectée).</li>
<li>Toute classe hérite implicitement de <code>Object</code> (d'où <code>toString</code>, <code>equals</code>…).</li>
</ul>

<h3>5. Quand hériter ?</h3>
<p>Le test de la phrase : « X <strong>est un</strong> Y » doit sonner juste. Un Chien EST UN Animal ✓ → héritage. Une Voiture N'EST PAS un Moteur, mais elle EN A un → on préfère la <strong>composition</strong> (mettre un attribut Moteur dans Voiture). Bien distinguer « est un » et « a un » évite des hiérarchies bancales.</p>`,

Rex : Wouf !        (Chien.crier — override)
Rex mange           (Animal.manger — hérité)

<p>Hériter (garder), redéfinir (remplacer), polymorphisme (chacun sa version, même appel) : les trois piliers sont posés. Demain, on abstrait encore : interfaces et classes abstraites.</p>`

      "solution": "// Le parc a velos partages - jour 2 sur 4.\n// La ville ajoute des velos electriques. On ne recopie pas la classe :\n// on la PROLONGE. Un velo electrique EST un velo.\n\npublic class ParcVelos {\n    public static void main(String[] args) {\n        Velo v1 = new Velo(\"BXL-0142\", 2021);\n        Velo v2 = new Velo(\"bxl-0088\", 2019);\n        VeloElectrique e1 = new VeloElectrique(\"BXE-0501\", 2023, 90);\n        VeloElectrique e2 = new VeloElectrique(\"BXE-0502\", 2022, 18);\n\n        // Le tableau est declare en Velo et contient les deux sortes :\n        // c'est le polymorphisme qui rend ce melange possible.\n        Velo[] parc = {v1, v2, e1, e2};\n        for (Velo v : parc) {\n            System.out.println(v);\n        }\n\n        System.out.println();\n        System.out.println(\"Location de \" + e1.getCode() + \" : \" + e1.louer());\n        System.out.println(\"  -> \" + e1);\n        e1.rendre();\n        System.out.println(\"Location de \" + e2.getCode() + \" (batterie faible) : \" + e2.louer());\n        System.out.println(\"  -> \" + e2);\n        e2.recharger();\n        System.out.println(\"Après recharge : \" + e2.louer() + \" -> \" + e2);\n        e2.rendre();\n\n        System.out.println();\n        double recette = 0.0;\n        int coursesTotales = 0;\n        for (Velo v : parc) {\n            coursesTotales = coursesTotales + v.getCourses();\n            // tarifCourse() est appele sur le type DECLARE Velo, mais c'est\n            // la version du type REEL qui s'execute.\n            recette = recette + v.getCourses() * v.tarifCourse();\n        }\n        System.out.println(\"Vélos au parc : \" + parc.length);\n        System.out.println(\"Courses effectuées : \" + coursesTotales);\n        System.out.println(\"Recette : \" + Math.round(recette * 100) / 100.0 + \" €\");\n    }\n}\n\nclass Velo {\n    private static final double TARIF_BASE = 1.20;\n\n    private String code;\n    private int anneeMiseEnService;\n    private boolean disponible;\n    private int courses;\n\n    Velo(String code, int anneeMiseEnService) {\n        this.code = code.trim().toUpperCase();\n        this.anneeMiseEnService = anneeMiseEnService;\n        this.disponible = true;\n        this.courses = 0;\n    }\n\n    String getCode() {\n        return code;\n    }\n\n    int getAnneeMiseEnService() {\n        return anneeMiseEnService;\n    }\n\n    int getCourses() {\n        return courses;\n    }\n\n    boolean estDisponible() {\n        return disponible;\n    }\n\n    boolean louer() {\n        if (!disponible) {\n            return false;\n        }\n        disponible = false;\n        courses = courses + 1;\n        return true;\n    }\n\n    boolean rendre() {\n        if (disponible) {\n            return false;\n        }\n        disponible = true;\n        return true;\n    }\n\n    double tarifCourse() {\n        double tarif = TARIF_BASE;\n        if (anneeMiseEnService <= 2020) {\n            tarif = tarif - 0.30;\n        }\n        return Math.round(tarif * 100) / 100.0;\n    }\n\n    String categorie() {\n        return \"vélo mécanique\";\n    }\n\n    public String toString() {\n        String etat;\n        if (disponible) {\n            etat = \"à la station\";\n        } else {\n            etat = \"en course\";\n        }\n        return code + \" — \" + categorie() + \", \" + etat + \", \" + courses + \" course(s)\";\n    }\n}\n\nclass VeloElectrique extends Velo {\n    private static final int BATTERIE_MINIMALE = 20;\n    private static final int CONSOMMATION_PAR_COURSE = 15;\n    private static final double SUPPLEMENT = 0.80;\n\n    private int batteriePourcent;\n\n    VeloElectrique(String code, int anneeMiseEnService, int batteriePourcent) {\n        super(code, anneeMiseEnService);\n        this.batteriePourcent = batteriePourcent;\n    }\n\n    int getBatteriePourcent() {\n        return batteriePourcent;\n    }\n\n    // La fille AJOUTE une condition, puis delegue a       "solution": "public class TestHeritage {                      // classe principale : contient le point d'entrée (doit venir en premier pour `java Fichier.java`)\n    public static void main(String[] args) {    // point d'entrée du programme\n        Animal a = new Animal(\"Créature\");       // un animal générique\n        Animal b = new Chien(\"Rex\");             // POLYMORPHISME : type déclaré Animal, objet réel Chien\n        a.crier();                               // affiche : Créature fait ...\n        b.crier();                               // affiche : Rex fait Wouf ! (la version du Chien gagne)\n    }                                            // fin de main\n}                                                // fin de la classe de test\n\nclass Animal {                                   // classe PARENT\n    protected String nom;                        // protected : visible dans les classes filles\n\n    public Animal(String nom) {                  // constructeur du parent\n        this.nom = nom;                          // range le paramètre dans l'attribut\n    }                                            // fin du constructeur\n\n    public void crier() {                        // comportement par défaut\n        System.out.println(nom + \" fait ...\");   // un animal générique ne sait pas crier\n    }                                            // fin de crier\n}                                                // fin d'Animal\n\nclass Chien extends Animal {                     // Chien HÉRITE de tout ce qu'Animal possède\n    public Chien(String nom) {                   // constructeur de la classe fille\n        super(nom);                              // appelle le constructeur du PARENT (obligatoire, en 1re ligne)\n    }                                            // fin du constructeur\n\n    @Override                                    // annonce : on REDÉFINIT une méthode héritée\n    public void crier() {                        // même signature que dans Animal\n        System.out.println(nom + \" fait Wouf !\"); // comportement spécifique au chien\n    }                                            // fin de crier\n}                                                // fin de Chien",
      "note": "C'est la méthode de l'objet RÉEL qui s'exécute, pas celle du type déclaré : c'est ça, le polymorphisme.",
