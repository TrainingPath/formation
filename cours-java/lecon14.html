var DAY = {
  num: 14,
  title: "Héritage et polymorphisme",
  subtitle: "Des classes qui en étendent d'autres : réutiliser sans copier.",
  theory: `
<h3>1. L'héritage : « est un »</h3>
<p>Un Chien EST UN Animal ; un Chat aussi. L'<strong>héritage</strong> permet à une classe de récupérer gratuitement tout ce qu'une autre possède. Plutôt que copier les attributs communs dans chaque classe, on crée une classe <strong>mère</strong> (le parent, plus général) et des classes <strong>filles</strong> (plus précises) qui en héritent avec le mot-clé <code>extends</code> :</p>
<pre class="pseudo">public class Animal {
    protected String nom;                 // protected : accessible dans la classe ET ses filles
    public Animal(String nom) { this.nom = nom; }
    public void manger() { System.out.println(nom + " mange"); }   // comportement commun à tous les animaux
    public void crier() { System.out.println("..."); }             // comportement générique, à préciser
}

public class Chien extends Animal {                    // « extends Animal » = Chien HÉRITE d'Animal
    public Chien(String nom) { super(nom); }           // super(nom) appelle le CONSTRUCTEUR de la mère
    public void crier() { System.out.println(nom + " : Wouf !"); }  // REDÉFINITION du cri générique
    public void rapporter() { System.out.println(nom + " rapporte la balle"); }  // méthode PROPRE au chien
}</pre>
<ul>
<li><code>extends</code> : Chien hérite de TOUT ce qu'Animal possède (<code>manger</code> existe gratuitement).</li>
<li><code>super(nom)</code> : la fille délègue à la mère l'initialisation de la partie commune.</li>
<li><code>crier()</code> redéfini : la fille REMPLACE le comportement hérité (on dit « override »).</li>
<li><code>rapporter()</code> : la fille peut AJOUTER ses propres méthodes.</li>
</ul>

<h3>2. Le polymorphisme : une variable mère, des objets fille</h3>
<pre class="pseudo">Animal a1 = new Chien("Rex");        // la variable est de type Animal, mais l'OBJET est un Chien : autorisé !
Animal a2 = new Chat("Mia");         // idem, un Chat
a1.crier();                          // affiche « Rex : Wouf ! » → la version CHIEN est choisie
a2.crier();                          // affiche « Mia : Miaou ! » → la version CHAT</pre>
<p>La MÊME ligne <code>a.crier()</code> produit des comportements différents selon l'objet réel : c'est le <strong>polymorphisme</strong> (littéralement « plusieurs formes »). Java regarde à l'EXÉCUTION le vrai type de l'objet (Chien, Chat…) pour décider quelle version de <code>crier</code> appeler.</p>

<h3>3. La puissance : traiter une collection hétérogène uniformément</h3>
<pre class="pseudo">ArrayList&lt;Animal&gt; zoo = new ArrayList&lt;&gt;();   // une liste d'Animal peut contenir chiens et chats
zoo.add(new Chien("Rex"));
zoo.add(new Chat("Mia"));
zoo.add(new Chien("Fido"));
for (Animal a : zoo) {
    a.crier();               // chacun crie À SA FAÇON, sans le moindre if sur le type !
}</pre>
<div class="tip">Sans polymorphisme : une cascade <code>if (type == chien)… else if (type == chat)…</code> à maintenir partout. Avec : chaque classe porte son comportement, la boucle reste simple, et ajouter une nouvelle espèce ne demande aucune modification de cette boucle. C'est LA élégance de la POO.</div>

<h3>4. Limites et règles</h3>
<pre class="pseudo">Animal a = new Chien("Rex");
a.rapporter();               // ERREUR : vue comme un Animal, « a » n'expose que manger/crier
                             // le compilateur ne « voit » que les méthodes du type de la VARIABLE
Chien c = new Chien("Rex");
c.rapporter();               // OK : la variable est de type Chien, qui connaît rapporter</pre>
<ul>
<li>Java ne permet qu'un héritage SIMPLE — une seule classe mère par classe.</li>
<li><code>@Override</code> au-dessus d'une redéfinition : le compilateur vérifie qu'on redéfinit bien une méthode existante (une faute de frappe est ainsi détectée).</li>
<li>Toute classe hérite implicitement de <code>Object</code> (d'où <code>toString</code>, <code>equals</code>…).</li>
</ul>

<h3>5. Quand hériter ?</h3>
<p>Le test de la phrase : « X <strong>est un</strong> Y » doit sonner juste. Un Chien EST UN Animal ✓ → héritage. Une Voiture N'EST PAS un Moteur, mais elle EN A un → on préfère la <strong>composition</strong> (mettre un attribut Moteur dans Voiture). Bien distinguer « est un » et « a un » évite des hiérarchies bancales.</p>`,
  exercises: [
    { type: "qcm", q: "Quel mot-clé établit l'héritage ?", opts: ["inherits", "extends", "super", "implements"], a: 1, exp: "class Chien extends Animal." },
    { type: "qcm", q: "La classe fille hérite…", opts: ["De rien", "Des attributs et méthodes de la mère (sauf private inaccessible directement)", "Seulement du nom", "Des commentaires"], a: 1, exp: "manger() existe dans Chien sans une ligne de code." },
    { type: "qcm", q: "À quoi sert <code>super(nom)</code> dans le constructeur de Chien ?", opts: ["À créer un deuxième objet", "À appeler le constructeur de la classe MÈRE pour initialiser la partie commune", "À rendre la classe super", "À hériter deux fois"], a: 1, exp: "La fille délègue à la mère ce qui appartient à la mère." },
    { type: "qcm", q: "Redéfinir (override) une méthode signifie…", opts: ["La supprimer", "La RÉÉCRIRE dans la fille pour remplacer le comportement hérité", "La rendre private", "La dupliquer"], a: 1, exp: "crier() version Chien remplace crier() version Animal." },

    { type: "qcm", q: "<code>Animal a = new Chien(\"Rex\");</code> est légal car…", opts: ["Java est laxiste", "Un Chien EST UN Animal : la référence mère peut pointer un objet fille", "Chien = Animal", "C'est illégal"], a: 1, exp: "Le sens unique de l'héritage : fille → mère, jamais l'inverse." },
    { type: "qcm", q: "a1 = new Chien(\"Rex\") ; a1.crier() affiche « Rex : Wouf ! ». Pourquoi la version Chien ?", opts: ["Hasard", "Polymorphisme : Java choisit la méthode selon le TYPE RÉEL de l'objet, à l'exécution", "La variable décide", "Wouf est par défaut"], a: 1, exp: "La variable dit Animal, l'objet EST un Chien : l'objet gagne." },
    { type: "qcm", q: "Dans la boucle du zoo, chaque animal crie à sa façon SANS if. Qu'est-ce que ça remplace ?", opts: ["Rien", "La cascade if (type…) else if (type…) : chaque classe porte son comportement", "Un switch obligatoire", "Une erreur"], a: 1, exp: "Le polymorphisme élimine les if de type — le code reste ouvert aux nouvelles espèces." },
    { type: "qcm", q: "<code>Animal a = new Chien(\"Rex\"); a.rapporter();</code> :", opts: ["Rex rapporte", "ERREUR de compilation : la variable Animal ne « voit » que les méthodes d'Animal", "Wouf", "null"], a: 1, exp: "Le type de la VARIABLE fixe ce qui est accessible ; le type de l'OBJET fixe la version exécutée." },
    { type: "qcm", q: "L'annotation <code>@Override</code> sert à…", opts: ["Accélérer la méthode", "Faire VÉRIFIER par le compilateur qu'on redéfinit vraiment une méthode héritée (typo détectée !)", "Rendre la méthode publique", "Hériter"], a: 1, exp: "crierr() avec @Override = erreur immédiate au lieu d'un bug silencieux." },
    { type: "qcm", q: "Combien de classes mères directes une classe Java peut-elle avoir ?", opts: ["Autant qu'on veut", "UNE seule : héritage simple", "Deux", "Zéro obligatoirement"], a: 1, exp: "Pour combiner plusieurs contrats : les interfaces (leçon 15)." },
    { type: "qcm", q: "Toute classe Java hérite implicitement de…", opts: ["Main", "Object : d'où viennent toString(), equals()…", "String", "Animal"], a: 1, exp: "C'est pour ça qu'on REDÉFINIT toString (leçon 13) : il existait déjà !" },
    { type: "qcm", q: "« Une Voiture ___ un Moteur » : héritage ou composition ?", opts: ["extends Moteur : héritage", "Composition : la Voiture A UN Moteur (attribut), elle n'EST PAS un moteur", "Les deux", "Aucun"], a: 1, exp: "Le test de la phrase « est un » : s'il sonne faux, c'est un attribut." },
    { type: "qcm", q: "« Un CompteEpargne est un Compte avec un taux d'intérêt » :", opts: ["Composition", "Héritage parfait : class CompteEpargne extends Compte + attribut taux", "Impossible", "Une interface"], a: 1, exp: "Il hérite de deposer/retirer et ajoute calculerInterets() : zéro duplication." },
    { type: "vf", q: "Une classe fille peut à la fois hériter de méthodes, en redéfinir certaines, et en ajouter de nouvelles.", a: true, exp: "Les trois mouvements de l'héritage : garder, remplacer, enrichir." }
  ],
  final: {
    title: "Exercice final — La ménagerie polymorphe",
    intro: `<p>Le zoo suivant tourne avec les classes de la théorie (+ une classe Chat symétrique à Chien, avec « Miaou ! ») :</p>
<pre class="pseudo">ArrayList&lt;Animal&gt; zoo = new ArrayList&lt;&gt;();  // liste d'Animal : accepte chiens ET chats
zoo.add(new Chien("Rex"));                   // un objet Chien rangé comme Animal
zoo.add(new Chat("Mia"));                    // un objet Chat rangé comme Animal
zoo.add(new Chien("Fido"));                  // un 2e chien
for (Animal a : zoo) {                       // parcourt chaque animal de la liste
    a.crier();                               // polymorphisme : la version du VRAI type s'exécute
    a.manger();                              // méthode héritée d'Animal, commune à tous
}</pre>`,
    questions: [
      { type: "qcm", q: "Que produit <code>a.crier()</code> au fil de la boucle ?", opts: ["Trois fois « ... »", "Rex : Wouf ! · Mia : Miaou ! · Fido : Wouf ! — chaque objet sa version", "Trois Wouf", "Erreur"], a: 1, exp: "Le polymorphisme en action : même ligne, trois comportements." },
      { type: "qcm", q: "<code>a.manger()</code> fonctionne pour tous. D'où vient cette méthode pour Chat et Chien ?", opts: ["Chacun l'a copiée", "HÉRITÉE d'Animal, jamais réécrite : un seul code pour tous", "De Object", "Du zoo"], a: 1, exp: "L'héritage factorise le commun ; l'override spécialise le reste." },
      { type: "qcm", q: "On ajoute une classe <code>Vache extends Animal</code> avec son crier(). Que faut-il changer dans la boucle du zoo ?", opts: ["Ajouter un if (vache)", "RIEN : zoo.add(new Vache(\"Marguerite\")) suffit, la boucle est déjà prête", "Refaire la boucle", "Changer ArrayList"], a: 1, exp: "Le code « ouvert à l'extension, fermé à la modification » : le graal de la conception." },
      { type: "qcm", q: "zoo.get(0).rapporter(); ne compile pas. Pourquoi, alors que zoo.get(0) EST un Chien ?", opts: ["Rex est fatigué", "La liste est typée Animal : le compilateur ne voit que les méthodes d'Animal", "rapporter est private", "get(0) rend null"], a: 1, exp: "Type déclaré = lunettes du compilateur. (Un cast (Chien) lèverait la restriction — avec prudence.)" },
      { type: "qcm", q: "Dans la classe Chat, quelle première ligne du constructeur <code>public Chat(String nom)</code> ?", opts: ["this.nom = nom; directement", "super(nom); — déléguer l'initialisation commune à Animal", "new Animal(nom);", "nom = null;"], a: 1, exp: "La mère construit la partie mère : chaîne d'initialisation propre." }
    ],
    solution: `<pre class="pseudo">Sortie du zoo :
Rex : Wouf !        (Chien.crier — override)
Rex mange           (Animal.manger — hérité)
Mia : Miaou !       (Chat.crier — override)
Mia mange           (hérité)
Fido : Wouf !
Fido mange

Ajout d'une espèce = une classe de plus, ZÉRO ligne modifiée ailleurs.</pre>
<p>Hériter (garder), redéfinir (remplacer), polymorphisme (chacun sa version, même appel) : les trois piliers sont posés. Demain, on abstrait encore : interfaces et classes abstraites.</p>`
  }
};
</script>
