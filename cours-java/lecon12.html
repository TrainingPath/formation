  title: "POO : classes et objets",
  subtitle: "Regrouper données et comportements : le grand saut conceptuel de Java.",
  theory: `
<h3>1. Pourquoi la POO ?</h3>
<p>Pour gérer 50 étudiants sans objets, il faudrait 3 tableaux parallèles (noms, âges, notes) à garder synchronisés — l'étudiant n°7, c'est <code>noms[7]</code>, <code>ages[7]</code>, <code>notes[7]</code> : fragile et pénible ! La <strong>Programmation Orientée Objet</strong> (POO) regroupe les données ET les comportements d'une même « chose » dans une <strong>classe</strong>.</p>

<h3>2. La classe : un moule ; l'objet : un exemplaire</h3>
<p>Une bonne image : la classe est un <strong>moule à gaufres</strong> (le plan) ; chaque gaufre fabriquée avec ce moule est un <strong>objet</strong> (un exemplaire concret). Toutes les gaufres ont la même forme, mais chacune est distincte.</p>
<pre class="pseudo">public class Etudiant {
    // ATTRIBUTS : les données que chaque étudiant portera
    String nom;
    int age;
    double moyenne;

    // MÉTHODES : le comportement, partagé par tous les étudiants
    void sePresenter() {
        System.out.println("Je suis " + nom + ", " + age + " ans");  // nom et age = ceux de l'objet appelant
    }
    boolean estEnReussite() {
        return moyenne &gt;= 10;         // vrai si la moyenne de cet objet atteint 10
    }
}</pre>
<p>La classe <code>Etudiant</code> est le <strong>moule</strong> (un plan). Chaque étudiant réel est un <strong>objet</strong> (une instance) fabriqué avec <code>new</code> :</p>
<pre class="pseudo">Etudiant e1 = new Etudiant();     // new FABRIQUE un exemplaire à partir du moule
e1.nom = "Ana";                   // on renseigne ses attributs avec le POINT
e1.age = 20;
e1.moyenne = 14.5;

Etudiant e2 = new Etudiant();     // un DEUXIÈME exemplaire, totalement indépendant du premier
e2.nom = "Bob";
e2.moyenne = 8.0;

e1.sePresenter();                 // affiche « Je suis Ana, 20 ans » (utilise les valeurs de e1)
e2.estEnReussite();               // renvoie false (la moyenne de e2 est 8.0)</pre>

<h3>3. Chaque objet a SES valeurs</h3>
<p>Modifier <code>e1.age</code> ne touche pas <code>e2.age</code> : chaque objet a sa propre copie des attributs. En revanche, tous partagent les mêmes méthodes — écrites une seule fois dans la classe, mais qui, à l'appel, travaillent sur les données de l'objet concerné. C'est toute la puissance de la POO : un moule, des exemplaires distincts au comportement commun.</p>

<h3>4. Les méthodes d'objet : plus de static !</h3>
<p>Dans <code>sePresenter()</code>, le <code>nom</code> utilisé est celui de <strong>l'objet sur lequel on appelle</strong> la méthode : <code>e1.sePresenter()</code> lit <code>e1.nom</code>. C'est pour cela qu'on retire <code>static</code> : une méthode <code>static</code> appartient à la classe entière (les outils des leçons 8-11), tandis qu'une méthode d'objet a besoin d'un exemplaire précis pour savoir « de quel nom on parle ».</p>

<h3>5. null : la référence vide</h3>
<pre class="pseudo">Etudiant e3 = null;        // e3 ne pointe vers AUCUN objet
e3.sePresenter();          // NullPointerException ! on appelle une méthode sur « rien »</pre>
<div class="warn"><code>null</code> signifie « aucun objet » (une boîte vide qui ne contient aucun exemplaire). Appeler une méthode sur <code>null</code> fait planter le programme (<code>NullPointerException</code>, le crash Java le plus célèbre). Avant d'utiliser un objet qui peut être vide, teste : <code>if (e3 != null)</code>.</div>

<h3>6. Tu utilises des objets depuis le début !</h3>
<pre class="pseudo">Scanner clavier = new Scanner(System.in);   // Scanner est une CLASSE : clavier est un objet créé avec new
String mot = "chat";                        // String aussi est une classe : mot est un objet
ArrayList&lt;String&gt; l = new ArrayList&lt;&gt;();   // ArrayList est une classe : l est un objet
clavier.nextInt();   mot.length();   l.add("x");   // .nextInt, .length, .add sont des MÉTHODES D'OBJET</pre>
<div class="tip">La POO ne fait qu'officialiser ce que tu pratiquais déjà : <code>objet.methode()</code>. Aujourd'hui, tu passes de simple <em>consommateur</em> d'objets à <em>fabricant</em> de tes propres classes.</div>`,

<pre class="pseudo">public class Compte {
    String titulaire;                 // attribut : le nom du propriétaire du compte
    double solde;                     // attribut : l'argent disponible

    void deposer(double montant) {    // méthode d'objet : ajoute de l'argent
        solde = solde + montant;      // le solde DE CET OBJET augmente
    }
    boolean retirer(double montant) { // renvoie true si le retrait a réussi
        if (montant <= solde) {       // a-t-on assez d'argent ?
            solde -= montant;         // oui : on débite (solde = solde - montant)
            return true;              // et on signale le succès
        }
        return false;                 // sinon : retrait refusé, solde inchangé
    }
}

c1.deposer(30);              // (1) dépôt sur c1

      "solution": "// L'atelier de poterie : des objets qui portent leurs donnees ET les\n// gestes qu'on peut leur appliquer.\n\npublic class Poterie {\n\n    // Une methode qui recoit un objet peut le MODIFIER : ce qui est copie,\n    // c'est la reference, pas la piece. Voir la reflexion du jour.\n    static void enfourner(Piece p) {\n        p.cuire();\n    }\n\n    public static void main(String[] args) {\n        Piece jarre = new Piece();\n        jarre.nom = \"Jarre à olives\";\n        jarre.hauteurCm = 22;\n        jarre.diametreCm = 14;\n\n        Piece bol = new Piece();\n        bol.nom = \"Bol tourné\";\n        bol.hauteurCm = 8;\n        bol.diametreCm = 16;\n\n        Piece vase = new Piece();\n        vase.nom = \"Vase col étroit\";\n        vase.hauteurCm = 31;\n        vase.diametreCm = 11;\n\n        System.out.println(jarre.etiquette());\n        System.out.println(bol.etiquette());\n        System.out.println(vase.etiquette());\n\n        System.out.println();\n        enfourner(jarre);\n        System.out.println(\"Après enfournage de la jarre : \" + jarre.etiquette());\n\n        // DEUX NOMS, UN SEUL OBJET. La seconde variable ne fabrique rien :\n        // elle designe la piece que la premiere designe deja.\n        Piece surLaTable = bol;\n        surLaTable.cuire();\n        System.out.println(\"Le bol vu par l'autre nom : \" + bol.etiquette());\n        System.out.println(\"Les deux noms désignent le même objet : \" + (surLaTable == bol));\n\n        // Une reference qui ne designe rien vaut null. L'utiliser leve une\n        // NullPointerException : ce n'est pas l'objet qui est vide, c'est\n        // qu'il n'y a pas d'objet du tout.\n        Piece commande = null;\n        System.out.println(\"Commande en attente : \" + (commande == null));\n\n        Piece[] atelier = {jarre, bol, vase};\n        int cuites = 0;\n        double volumeTotal = 0.0;\n        for (Piece p : atelier) {\n            volumeTotal = volumeTotal + p.volumeLitres();\n            if (p.cuite) {\n                cuites = cuites + 1;\n            }\n        }\n        System.out.println();\n        System.out.println(\"Pièces à l'atelier : \" + atelier.length + \", dont \" + cuites + \" cuites\");\n        System.out.println(\"Volume total : \" + Math.round(volumeTotal * 100) / 100.0 + \" L\");\n    }\n}\n\nclass Piece {\n    // Math.PI existe, mais on ne l'a pas encore rencontre dans le cours :\n    // une constante nommee fait le meme travail et se lit aussi bien.\n    static final double PI = 3.14159;\n\n    String nom;\n    int hauteurCm;\n    int diametreCm;\n    boolean cuite;      // false par defaut : Java initialise les champs\n\n    double volumeLitres() {\n        double rayon = diametreCm / 2.0;\n        double cm3 = PI * rayon * rayon * hauteurCm;\n        return Math.round(cm3 / 1000.0 * 100) / 100.0;\n    }\n\n    void cuire() {\n        cuite = true;\n    }\n\n    String etiquette() {\n        return nom + \" — \" + hauteurCm + \" cm de haut, \" + volumeLitres()\n               + \" L, \" + (cuite ? \"cuite\" : \"crue\");\n    }\n}",

      "solution": "// La grainotheque - jour 4 sur 4.\n// Les listes paralleles disparaissent : un sachet est desormais UNE chose,\n// qui porte son code, son espece, sa variete et son annee.\nimport java.util.ArrayList;\nimport java.util.Scanner;\n\npublic class Grainotheque {\n\n    // Le catalogue ne contient plus des textes mais des sachets. La\n    // promesse « les listes restent alignees » n'a plus lieu d'etre :\n    // il n'y a plus qu'une liste.\n    static void trier(ArrayList<Sachet> catalogue) {\n        for (int passe = 0; passe < catalogue.size() - 1; passe++) {\n            for (int i = 0; i < catalogue.size() - 1 - passe; i++) {\n                if (catalogue.get(i).code.compareTo(catalogue.get(i + 1).code) > 0) {\n                    Sachet tampon = catalogue.get(i);\n                    catalogue.set(i, catalogue.get(i + 1));\n                    catalogue.set(i + 1, tampon);\n                }\n            }\n        }\n    }\n\n    static Sachet chercher(ArrayList<Sachet> catalogue, String code) {\n        int debut = 0;\n        int fin = catalogue.size() - 1;\n        while (debut <= fin) {\n            int milieu = (debut + fin) / 2;\n            int ordre = catalogue.get(milieu).code.compareTo(code);\n            if (ordre == 0) {\n                return catalogue.get(milieu);\n            } else if (ordre < 0) {\n                debut = milieu + 1;\n            } else {\n                fin = milieu - 1;\n            }\n        }\n        // On rend null plutot que -1 : l'absence d'un OBJET se dit null.\n        return null;\n    }\n\n    // L'annee est fournie a part : la tirer du code demanderait de\n    // convertir un texte en nombre, ce que la lecon 16 t'apprendra.\n    static Sachet fabriquer(String code, int annee) {\n        String[] m = code.split(\"-\");\n        Sachet s = new Sachet();\n        s.code = code;\n        s.espece = m[0];\n        s.variete = m[1];\n        s.annee = annee;\n        return s;\n    }\n\n    public static void main(String[] args) {\n        ArrayList<Sachet> catalogue = new ArrayList<>();\n        catalogue.add(fabriquer(\"TOM-CERISE-2024\", 2024));\n        catalogue.add(fabriquer(\"HAR-FLAGEOLET-2024\", 2024));\n        catalogue.add(fabriquer(\"COU-BUTTERNUT-2023\", 2023));\n        catalogue.add(fabriquer(\"TOM-COEUR-2023\", 2023));\n        catalogue.add(fabriquer(\"RAD-ROSE-2024\", 2024));\n        catalogue.add(fabriquer(\"BAS-GRAND-2022\", 2022));\n        catalogue.add(fabriquer(\"POI-NAIN-2023\", 2023));\n        catalogue.add(fabriquer(\"TOM-NOIRE-2024\", 2024));\n\n        trier(catalogue);\n\n        System.out.println(\"=== Catalogue (\" + catalogue.size() + \" sachets) ===\");\n        for (Sachet s : catalogue) {\n            System.out.println(\"  \" + s.etiquette());\n        }\n\n        Scanner clavier = new Scanner(System.in);\n        System.out.print(\"Code à retrouver : \");\n        String cible = clavier.nextLine().trim().toUpperCase();\n\n        Sachet trouve = chercher(catalogue, cible);\n        System.out.println();\n        if (trouve == null) {\n            System.out.println(\"Aucun sachet sous ce code.\");\n        } else {\n            System.out.println(\"Trouvé : \" + trouve.etiquette());\n            System.out.println(\"Récolté il y a \" + trouve.age(2026) + \" an(s).\");\n        }\n\n        System.out.print(\"Espèce à recenser : \");\n        String espece = clavier.nextLine().trim().toUpperCase();\n        int compte = 0;\n        int plusAncienne = 9999;\n        for (Sachet s : catalogue) {\n            if (s.espece.equals(espece)) {\n                compte = compte + 1;\n                if (s.annee < plusAncienne) {\n                    plusAncienne = s.annee;\n                }\n            }\n        }\n        System.out.println(\"Sachets de l'espèce \" + espece + \" : \" + compte);\n        if (compte > 0) {\n            System.out.println(\"Récolte la plus ancienne : \" + plusAncienne);\n        }\n    }\n}\n\nclass Sachet {\n    String code;\n    String espece;\n    String variete;\n    int annee;\n\n    int age(int anneeCourante) {\n        return anneeCourante - annee;\n    }\n\n    String etiquette() {\n        // Une capitale initiale, le reste en minuscules.\n        String jolieVariete = variete.substring(0, 1) + variete.substring(1).toLowerCase();\n        return jolieVariete + \" (\" + espece + \"), récolte \" + annee;\n    }\n}",
