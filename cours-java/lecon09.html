  subtitle: "Le jour 19 d'algorithmique, avec l'arsenal des méthodes Java.",
  theory: `
<h3>1. String : un objet, pas un primitif</h3>
<p>Contrairement à <code>int</code> ou <code>char</code>, une <code>String</code> (une <strong>chaîne de caractères</strong>, c'est-à-dire du texte) est un <strong>objet</strong> : elle possède des <strong>méthodes</strong> (des actions) qu'on appelle avec le point (<code>mot.length()</code>, <code>mot.charAt(0)</code>…). Chaque caractère a un indice, à partir de 0, comme dans un tableau de lettres.</p>
<pre class="pseudo">String mot = "BONJOUR";
indices :      0123456        ← 0-indexé : B=0, O=1, N=2, J=3, O=4, U=5, R=6</pre>

<h3>2. L'arsenal de base</h3>
<pre class="pseudo">PSEUDOCODE (jour 19)     JAVA
LONGUEUR(mot)            mot.length()        // nombre de caractères — AVEC parenthèses (≠ t.length du tableau !)
mot[i]                   mot.charAt(i)       // le i-ème caractère (renvoie un char) — pas de crochets sur les String
a &amp; b                    a + b               // + colle deux chaînes (concaténation)
MAJUSCULE(mot)           mot.toUpperCase()   // renvoie une COPIE tout en majuscules
MINUSCULE(mot)           mot.toLowerCase()   // renvoie une COPIE tout en minuscules</pre>

<h3>3. Les indispensables en plus</h3>
<pre class="pseudo">"bonjour".contains("jou")     → true         // le texte contient-il « jou » ?
"bonjour".startsWith("bon")   → true         // commence-t-il par « bon » ?
"bonjour".endsWith("our")     → true         // finit-il par « our » ?
"bonjour".indexOf('o')        → 1            // position de la 1re occurrence (ou -1 si absent !)
"bonjour".substring(3)        → "jour"       // sous-chaîne de l'indice 3 jusqu'à la fin
"bonjour".substring(0, 3)     → "bon"        // sous-chaîne de 0 INCLUS à 3 EXCLU (attention : indice de fin, ≠ C#/PHP)
"  hey  ".trim()              → "hey"        // retire les espaces au début et à la fin
"a-b-c".split("-")            → tableau {"a", "b", "c"}   // découpe sur le séparateur → un String[]
"x".repeat(3)                 → "xxx"         // répète la chaîne 3 fois</pre>
<p>Piège Java sur <code>substring(0, 3)</code> : le second argument est un indice de FIN exclu (contrairement à C#/PHP où c'est une longueur). « bon » va de l'indice 0 à l'indice 3 exclu.</p>

<h3>4. Une String est IMMUABLE</h3>
<pre class="pseudo">String s = "chat";
s.toUpperCase();              // renvoie "CHAT" mais NE modifie PAS s : le résultat est jeté !
System.out.println(s);        // affiche « chat » (inchangé)
s = s.toUpperCase();          // il faut RÉAFFECTER le résultat à s
System.out.println(s);        // affiche « CHAT »</pre>
<div class="warn">« Immuable » veut dire qu'une String ne se modifie jamais : aucune méthode ne change la chaîne d'origine, elles retournent toutes une NOUVELLE chaîne. Oublier la réaffectation (<code>s = s.toUpperCase();</code>) est l'erreur classique : on croit avoir transformé le texte alors qu'on a jeté le résultat.</div>

<h3>5. Parcourir une chaîne caractère par caractère</h3>
<pre class="pseudo">// Compter les 'A'
int nb = 0;                                  // compteur
for (int i = 0; i &lt; mot.length(); i++) {     // on parcourt chaque indice, de 0 à length()-1
    if (mot.charAt(i) == 'A') { nb++; }      // char comparé avec == (les char sont des primitifs)
}</pre>
<div class="tip">Les <code>char</code> (primitifs) se comparent avec <code>==</code> ; les <code>String</code> (objets) avec <code>.equals()</code>. Retiens : apostrophes → <code>==</code>, guillemets → <code>equals</code>.</div>

<h3>6. Palindrome (comparer les extrémités : indice i et son miroir)</h3>
<p>Un <strong>palindrome</strong> est un mot qui se lit pareil de gauche à droite et de droite à gauche (radar, kayak…).</p>
<pre class="pseudo">boolean estPalindrome = true;                            // hypothèse de départ : oui
int n = mot.length();                                    // longueur totale
for (int i = 0; i &lt; n / 2; i++) {                        // on compare seulement la 1re moitié à la 2e
    if (mot.charAt(i) != mot.charAt(n - 1 - i)) { estPalindrome = false; }  // n-1-i = le caractère MIROIR (depuis la fin)
}</pre>
<p>L'indice miroir <code>n - 1 - i</code> est la clé : quand <code>i</code> vaut 0, on compare le premier caractère au dernier ; puis le deuxième à l'avant-dernier, etc. Dès qu'une paire diffère, ce n'est plus un palindrome.</p>`,

    intro: `<p>Le final du jour 19, traduit : valider un pseudo (3 à 12 caractères, sans espace) et fabriquer son miroir.</p>
<pre class="pseudo">String pseudo = "LAVAL";                     // le pseudo à analyser
int n = pseudo.length();                     // n = 5 caractères
boolean lgOK = (n >= 3 &amp;&amp; n <= 12);          // longueur valide ? (encadrement avec &&)
boolean espace = pseudo.contains(" ");       // contient-il un espace interdit ?
String miroir = "";                          // accumulateur de chaîne (vide au départ)
for (int i = n - 1; i >= 0; i--) {           // parcourt de la DERNIÈRE lettre (n-1) à la première (0)
