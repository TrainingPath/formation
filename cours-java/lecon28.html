  title: "Tests unitaires avec JUnit",
  subtitle: "Prouver que ton code fait ce qu'il promet : des petits contrôles automatiques qui t'alertent au moindre bug.",
  theory: `
<h3>1. Pourquoi tester ?</h3>
<p>Imagine que tu répares la caisse enregistreuse de ta <strong>ludothèque</strong>. Comment être SÛR qu'elle calcule juste ? Tu essaies quelques achats connus : « 2 jeux à 10 € = 20 € ». Un <strong>test unitaire</strong> automatise exactement cela : un petit programme qui vérifie qu'une méthode donne le bon résultat sur un cas précis, et qui hurle si ce n'est pas le cas.</p>
<div class="tip">« Unitaire » veut dire qu'on teste une <strong>unité</strong> isolée : une seule méthode, une seule règle, à la fois. Comme vérifier chaque pièce d'un moteur séparément avant de démarrer la voiture.</div>

<h3>2. JUnit : la boîte à outils des tests</h3>
<p><strong>JUnit</strong> est la bibliothèque standard de tests en Java. On écrit des méthodes de test marquées de l'annotation <code>@Test</code>. JUnit les repère et les exécute toutes automatiquement, puis affiche un rapport : vert (réussi) ou rouge (échoué).</p>
<pre class="pseudo">import org.junit.jupiter.api.Test;                    // l'annotation @Test
import static org.junit.jupiter.api.Assertions.*;     // les vérifications (assertEquals...)

class CalculTest {                                     // une classe de tests
    @Test                                              // marque : « ceci est un test »
    void additionSimple() {                            // un test = une méthode sans paramètre
        int resultat = Calcul.addition(2, 3);          // on exécute le code à vérifier
        assertEquals(5, resultat);                     // on AFFIRME : le résultat DOIT valoir 5
    }
}</pre>

<h3>3. Les assertions : le coeur du test</h3>
<p>Une <strong>assertion</strong> (« affirmation ») déclare ce qui DOIT être vrai. Si c'est vrai, le test passe silencieusement ; si c'est faux, le test échoue et JUnit t'indique où.</p>
<pre class="pseudo">assertEquals(attendu, obtenu)    // vérifie que obtenu == attendu (l'ATTENDU en premier !)
assertTrue(condition)            // vérifie que la condition est vraie
assertFalse(condition)           // vérifie que la condition est fausse
assertNull(objet)                // vérifie que l'objet est null
assertNotNull(objet)             // vérifie que l'objet n'est PAS null
assertThrows(Exception.class, () -&gt; ...) // vérifie qu'un code LÈVE bien une exception</pre>
<div class="warn">Ordre à mémoriser : <code>assertEquals(attendu, obtenu)</code> — la valeur ATTENDUE d'abord, la valeur OBTENUE ensuite. Inverser ne casse pas le test, mais rend les messages d'erreur trompeurs.</div>

<h3>4. Le modèle AAA : Arrange, Act, Assert</h3>
<p>Un bon test suit trois temps, comme une recette :</p>
<pre class="pseudo">@Test
void prixTotalDeuxJeux() {
    // ARRANGE : on prépare les données de départ
    Panier panier = new Panier();                 // un panier vide
    panier.ajouter(10.0);                         // un jeu à 10 EUR
    panier.ajouter(15.0);                         // un jeu à 15 EUR
    // ACT : on exécute l'action à tester
    double total = panier.total();                // on calcule le total
    // ASSERT : on vérifie le résultat attendu
    assertEquals(25.0, total);                    // le total DOIT valoir 25 EUR
}</pre>

<h3>5. Comparer des décimaux : la tolérance</h3>
<p>Les nombres à virgule (<code>double</code>) sont approximatifs (leçon 5). Pour les comparer, on donne une <strong>marge d'erreur</strong> (delta) : « égal à 0,001 près ».</p>
<pre class="pseudo">assertEquals(0.3, a + b, 0.0001);   // le 3e argument = tolérance : évite les faux échecs des flottants</pre>

<h3>6. Préparer le décor : @BeforeEach</h3>
<p>Quand plusieurs tests partent du même point, on met la préparation dans une méthode <code>@BeforeEach</code> : JUnit l'exécute AVANT chaque test, garantissant un décor neuf à chaque fois.</p>
<pre class="pseudo">Panier panier;                       // partagé par les tests
@BeforeEach                          // exécuté avant CHAQUE test
void preparer() {
    panier = new Panier();           // un panier tout neuf, indépendant, pour chaque test
}</pre>

<h3>7. La philosophie : un filet de sécurité</h3>
<p>Les tests sont un <strong>filet de sécurité</strong> : quand tu modifies ton code plus tard, tu relances les tests. S'ils restent verts, tu n'as rien cassé ; si l'un vire au rouge, tu sais AUSSITÔT où et pourquoi. Écrire des tests, c'est documenter le comportement attendu ET dormir tranquille.</p>`,

    { type: "qcm", q: "À quoi sert <code>@BeforeEach</code> ?", opts: ["À lancer un test une fois", "À exécuter une préparation AVANT chaque test (décor neuf)", "À la fin des tests", "À ignorer un test"], a: 1, exp: "Elle réinitialise l'état avant chaque test." },

    { type: "qcm", q: "<code>assertNotNull(objet)</code> vérifie que…", opts: ["objet vaut 0", "objet n'est PAS null", "objet est null", "objet est vide"], a: 1, exp: "Elle affirme la présence d'un objet." },
    { type: "vf", q: "Chaque test devrait être indépendant des autres.", a: true, exp: "@BeforeEach garantit un décor neuf, sans effet de bord entre tests." },
    { type: "qcm", q: "Quel est le principal bénéfice d'écrire des tests ?", opts: ["Un code plus court", "Détecter tôt les bugs et documenter le comportement attendu", "Un programme plus rapide", "Moins de mémoire"], a: 1, exp: "Confiance, régressions attrapées, comportement documenté." }

<pre class="pseudo">class PanierTest {
    Panier panier;                                 // partagé par les tests
    @BeforeEach                                    // (1) avant chaque test
    void preparer() {
        panier = new Panier();                     // panier tout neuf

Test panierVideEstZero : assertEquals(0.0, total())     // cas limite : vide -> 0
Test deuxJeux :
    ARRANGE : ajouter(10) ; ajouter(15)                 // on prépare
    ACT     : panier.total()                            // on exécute
    ASSERT  : assertEquals(25.0, ...)                   // 25 attendu

<p>Deux petits tests prouvent que le panier compte juste, y compris le cas vide. Modifie le code plus tard : ces tests t'avertiront au moindre écart. Prochaine leçon : threads et concurrence, pour faire plusieurs choses à la fois.</p>`

      "enonce": "<strong>Note d'atelier.</strong> JUnit est une bibliothèque extérieure : elle demande un projet configuré, un gestionnaire de dépendances et un lanceur. Les exercices d'aujourd'hui écrivent donc le banc d'essai <em>à la main</em>, en Java pur, avec le vocabulaire exact de la leçon — vérifier une égalité, vérifier une condition, vérifier qu'une erreur est levée, comparer des décimaux à une marge près, repartir d'un décor neuf. Tu obtiens le même filet de sécurité, tu peux l'exécuter partout, et tu découvres au passage qu'il n'y a aucune magie dans JUnit : une trentaine de lignes suffisent à en reproduire le cœur. Le jour où tu ouvriras un projet équipé de JUnit, tu reconnaîtras chaque pièce.<br><br>Écris d'abord le banc d'essai : deux compteurs, un de tests réussis et un d'échoués ; une vérification d'égalité qui prend l'attendu, l'obtenu et le nom du test, affiche une coche verte ou une croix, et fait figurer dans le message d'échec la valeur attendue <em>et</em> la valeur obtenue ; une vérification de condition ; une vérification d'égalité de décimaux avec une marge ; et un rapport final annonçant les deux compteurs. Écris ensuite la caisse à éprouver : un panier qui accepte des articles avec leur prix, sait dire combien d'articles il contient, calculer son total et appliquer un pourcentage de remise. Éprouve-la : un panier neuf est vide et totalise zéro ; deux ajouts à 3,20 € et 2,60 € font deux articles et 5,80 € ; dix centimes plus vingt centimes valent trente centimes à la marge près <em>et</em> ne les valent pas exactement — vérifie les deux ; une remise de 10 % sur 20 € donne 18 €, une remise de 0 % ne change rien. Termine par un test volontairement faux, qui attend 19 € là où le programme rend 18 €, pour voir à quoi ressemble un échec, puis affiche le rapport.",

      "solution": "// La caisse du marche : ecrire le filet de securite avant d'en avoir besoin.\n// JUnit n'est pas installe ici : on ecrit donc le banc d'essai a la main, ce\n// qui montre au passage qu'il n'y a aucune magie dans une bibliotheque de tests.\nimport java.util.ArrayList;\n\npublic class BancDEssai {\n\n    static int reussis = 0;\n    static int echoues = 0;\n\n    // L'attendu d'abord, l'obtenu ensuite : le message en depend.\n    static void verifierEgal(Object attendu, Object obtenu, String nom) {\n        if (attendu.equals(obtenu)) {\n            reussis = reussis + 1;\n            System.out.println(\"  ✓ \" + nom);\n        } else {\n            echoues = echoues + 1;\n            System.out.println(\"  ✗ \" + nom + \" — attendu « \" + attendu\n                    + \" », obtenu « \" + obtenu + \" »\");\n        }\n    }\n\n    static void verifierVrai(boolean condition, String nom) {\n        if (condition) {\n            reussis = reussis + 1;\n            System.out.println(\"  ✓ \" + nom);\n        } else {\n            echoues = echoues + 1;\n            System.out.println(\"  ✗ \" + nom + \" — la condition est fausse\");\n        }\n    }\n\n    // Les nombres a virgule ne se comparent pas au caractere pres : une marge.\n    static void verifierEgal(double attendu, double obtenu, double marge, String nom) {\n        if (Math.abs(attendu - obtenu) <= marge) {\n            reussis = reussis + 1;\n            System.out.println(\"  ✓ \" + nom);\n        } else {\n            echoues = echoues + 1;\n            System.out.println(\"  ✗ \" + nom + \" — attendu \" + attendu + \" ± \" + marge\n                    + \", obtenu \" + obtenu);\n        }\n    }\n\n    static void rapport() {\n        System.out.println(\"Bilan : \" + reussis + \" réussi(s), \" + echoues + \" échoué(s) — \"\n                + (echoues == 0 ? \"tout est vert\" : \"il reste du rouge\"));\n    }\n\n    public static void main(String[] args) {\n        System.out.println(\"--- Caisse : cas simples ---\");\n        Panier vide = new Panier();\n        verifierEgal(0, vide.nombreArticles(), \"un panier neuf est vide\");\n        verifierEgal(0.0, vide.total(), 0.001, \"un panier neuf totalise zéro\");\n\n        Panier deuxArticles = new Panier();\n        deuxArticles.ajouter(\"courgettes\", 3.20);\n        deuxArticles.ajouter(\"pain\", 2.60);\n        verifierEgal(2, deuxArticles.nombreArticles(), \"deux ajouts font deux articles\");\n        verifierEgal(5.80, deuxArticles.total(), 0.001, \"deux articles totalisent 5,80 €\");\n\n        System.out.println();\n        System.out.println(\"--- Caisse : cas limites ---\");\n        Panier centimes = new Panier();\n        centimes.ajouter(\"un\", 0.10);\n        centimes.ajouter(\"deux\", 0.20);\n        verifierEgal(0.30, centimes.total(), 0.001, \"0,10 + 0,20 vaut 0,30 à la marge près\");\n        verifierVrai(centimes.total() != 0.30, \"0,10 + 0,20 ne vaut PAS exactement 0,30\");\n\n        Panier remise = new Panier();\n        remise.ajouter(\"cageot\", 12.00);\n        remise.ajouter(\"fromage\", 8.00);\n        verifierEgal(18.0, remise.totalAvecRemise(10), 0.001, \"10 % de remise sur 20 € font 18 €\");\n        verifierEgal(20.0, remise.totalAvecRemise(0), 0.001, \"0 % de remise ne change rien\");\n\n        System.out.println();\n        System.out.println(\"--- Un test qui échoue, volontairement ---\");\n        verifierEgal(19.0, remise.totalAvecRemise(10), 0.001, \"10 % de remise donneraient 19 €\");\n\n        System.out.println();\n        rapport();\n    }\n}\n\nclass Panier {\n    private ArrayList<String> noms = new ArrayList<>();\n    private ArrayList<Double> prix = new ArrayList<>();\n\n    void ajouter(String nom, double montant) {\n        noms.add(nom);\n        prix.add(montant);\n    }\n\n    int nombreArticles() {\n        return noms.size();\n    }\n\n    double total() {\n        double somme = 0.0;\n        for (double p : prix) {\n            somme = somme + p;\n        }\n        return somme;\n    }\n\n    double totalAvecRemise(int pourcentage) {\n        return total() * (100 - pourcentage) / 100.0;\n    }\n}",

      "enonce": "<strong>Note d'atelier.</strong> JUnit est une bibliothèque extérieure : elle demande un projet configuré, un gestionnaire de dépendances et un lanceur. Les exercices d'aujourd'hui écrivent donc le banc d'essai <em>à la main</em>, en Java pur, avec le vocabulaire exact de la leçon — vérifier une égalité, vérifier une condition, vérifier qu'une erreur est levée, comparer des décimaux à une marge près, repartir d'un décor neuf. Tu obtiens le même filet de sécurité, tu peux l'exécuter partout, et tu découvres au passage qu'il n'y a aucune magie dans JUnit : une trentaine de lignes suffisent à en reproduire le cœur. Le jour où tu ouvriras un projet équipé de JUnit, tu reconnaîtras chaque pièce.<br><br>Un distributeur rend la monnaie en pièces de 200, 100, 50, 20, 10 et 5 centimes, en donnant toujours le moins de pièces possible. Décris le rendu de monnaie par une interface à une seule méthode, puis écris <strong>deux</strong> implémentations : l'une complète, l'autre à laquelle il manque la pièce de 20 — un distributeur en panne de rouleaux, ce qui arrive tous les jours. Les deux refusent un montant négatif et un montant qui n'est pas un multiple de 5, en levant une erreur porteuse d'un message. Écris ensuite un banc d'essai comprenant, en plus des vérifications d'égalité et de condition, une vérification qu'un code lève bien une erreur — pour laquelle tu déclareras ta propre interface d'action. Groupe tes tests en une <strong>batterie</strong> paramétrée par le rendeur à éprouver, en trois temps : l'invariant, à savoir que la somme rendue égale le montant dû, testé sur 70, 285 et 0 centimes ; la règle métier, à savoir le nombre de pièces — deux pour 70, cinq pour 285, aucune pour 0 ; et les deux refus. Repars d'un décor neuf avant chaque temps. Passe enfin la même batterie sur les deux rendeurs, affiche le bilan, dis si la batterie a su les distinguer, et montre le détail des deux rendus de 70 centimes.",
      "principe": "Un test ne vaut que par ce qu'il attrape. La seule façon de savoir si une batterie a de la valeur est de la passer sur une implémentation dont on sait qu'elle est fausse : celle qui reste verte sur le code cassé ne protégeait rien. C'est la contrepartie exacte du test volontairement faux de l'exercice précédent.",
      "sousQuestions": [

          "texte": "Quels sont les deux rendus de 70 centimes, et lequel des trois temps de la batterie fait la différence ?"

        {
          "ref": "d",
          "texte": "Le décor est refait avant chacun des trois temps. Sur ce programme précis, cela change-t-il quelque chose ? Alors pourquoi le faire ?"

      "reflexion": "La batterie est écrite une fois et passée sur deux implémentations, ce qui n'a été possible que parce que les deux respectent la même interface. Retourne la situation : qu'est-ce que cela dit de l'ordre dans lequel il faut concevoir ? Puis cherche l'inconvénient — qu'est-ce qu'une batterie partagée ne pourra jamais tester ?",
      "remarque": "Le rendu du moins de pièces possible est obtenu en servant les plus grosses pièces d'abord. Ce procédé donne le bon résultat pour le système de pièces européen, mais pas pour n'importe quel système : avec des pièces de 1, 3 et 4, rendre 6 donnerait 4+1+1, trois pièces, alors que 3+3 en suffirait de deux. La batterie de cet exercice ne le verrait pas — elle n'éprouve que les pièces réelles.",
      "indices": [
        "Commence par ce qui n'est pas un test : l'interface du rendeur, ses deux implémentations, et la petite fonction qui additionne une liste de pièces. Ce n'est qu'ensuite que la question « comment éprouver cela ? » devient concrète. Note dès maintenant les trois familles de choses à vérifier — un invariant, une règle métier, des refus — car ce sont les trois familles de tout programme.",
        "Le plan : l'interface et les deux rendeurs ; les compteurs et les trois vérifications ; la fonction de décor ; la batterie, qui prend un rendeur en paramètre et déroule les trois temps ; puis un programme principal qui appelle la batterie deux fois et affiche le bilan.",
        "Écris la batterie comme une fonction qui reçoit le rendeur à éprouver et ne le connaît que par son interface. C'est cela qui permet de la passer sur les deux implémentations sans en changer une ligne — et c'est aussi ce qui garantit qu'elle n'a pas triché en allant regarder à l'intérieur de l'une d'elles.",
        "Le point dur est la vérification qu'une erreur est bien levée. Tu ne peux pas passer le résultat du code fautif à ta fonction : ce code lèverait son erreur avant même l'appel, et ce serait ton banc d'essai qui mourrait. Il faut donc passer un moyen d'exécuter ce code plus tard, à l'intérieur du filet — c'est-à-dire une lambda. Déclare pour cela ta propre interface à une seule méthode sans paramètre ni retour : une lambda peut prendre sa forme, exactement comme au premier jour de la leçon 21. La vérification exécute l'action dans un bloc protégé : si rien ne se produit, le test échoue ; si une erreur survient, il réussit.",
        "Ton fichier ressemble à ceci :<br><code>interface Action { void executer(); }</code><br><code>static void verifierLeve(Action action, String nom) {</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;try { action.executer(); echoues = …; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;catch (Exception e) { reussis = …; }</code><br><code>}</code><br><code>interface Rendeur { List&lt;Integer&gt; rendre(int centimes); }</code><br><code>private static final int[] PIECES = {200, 100, 50, …, …, …};</code><br><code>throw new IllegalArgumentException(\"montant négatif : \" + …);</code><br><code>static void batterie(String intitule, Rendeur rendeur) { … }</code><br><code>verifierLeve(() -&gt; decor.rendre(-5), \"…\");</code>"
      ],
      "solution": "// Le distributeur de boissons : la meme batterie de tests, passee sur deux\n// monnayeurs dont un seul est correct. Un test ne vaut que par ce qu'il attrape.\nimport java.util.ArrayList;\nimport java.util.List;\n\npublic class BancDEssai {\n\n    static int reussis = 0;\n    static int echoues = 0;\n\n    // Notre propre « action a executer » : c'est tout ce qu'une lambda demande.\n    interface Action {\n        void executer();\n    }\n\n    static void verifierEgal(Object attendu, Object obtenu, String nom) {\n        if (attendu.equals(obtenu)) {\n            reussis = reussis + 1;\n            System.out.println(\"  ✓ \" + nom);\n        } else {\n            echoues = echoues + 1;\n            System.out.println(\"  ✗ \" + nom + \" — attendu \" + attendu + \", obtenu \" + obtenu);\n        }\n    }\n\n    static void verifierVrai(boolean condition, String nom) {\n        if (condition) {\n            reussis = reussis + 1;\n            System.out.println(\"  ✓ \" + nom);\n        } else {\n            echoues = echoues + 1;\n            System.out.println(\"  ✗ \" + nom + \" — la condition est fausse\");\n        }\n    }\n\n    // Verifier qu'un code leve bien une erreur : sans filet, c'est le banc qui meurt.\n    static void verifierLeve(Action action, String nom) {\n        try {\n            action.executer();\n            echoues = echoues + 1;\n            System.out.println(\"  ✗ \" + nom + \" — aucune erreur n'a été levée\");\n        } catch (Exception e) {\n            reussis = reussis + 1;\n            System.out.println(\"  ✓ \" + nom + \" (\" + e.getMessage() + \")\");\n        }\n    }\n\n    // Le decor : un monnayeur neuf avant CHAQUE serie, jamais reutilise.\n    static Rendeur decor;\n\n    static void preparer(Rendeur neuf) {\n        decor = neuf;\n    }\n\n    static int somme(List<Integer> pieces) {\n        int t = 0;\n        for (int p : pieces) {\n            t = t + p;\n        }\n        return t;\n    }\n\n    static void batterie(String intitule, Rendeur rendeur) {\n        System.out.println(\"--- \" + intitule + \" ---\");\n        preparer(rendeur);\n\n        // 1. L'invariant : ce qui est rendu vaut ce qui est du.\n        verifierEgal(70, somme(decor.rendre(70)), \"70 c rendus valent 70 c\");\n        verifierEgal(285, somme(decor.rendre(285)), \"285 c rendus valent 285 c\");\n        verifierEgal(0, somme(decor.rendre(0)), \"0 c rendu vaut 0 c\");\n\n        // 2. La regle metier : le moins de pieces possible.\n        preparer(rendeur);\n        verifierEgal(2, decor.rendre(70).size(), \"70 c se rendent en 2 pièces\");\n        verifierEgal(5, decor.rendre(285).size(), \"285 c se rendent en 5 pièces\");\n        verifierEgal(0, decor.rendre(0).size(), \"0 c ne rend aucune pièce\");\n\n        // 3. Les refus.\n        preparer(rendeur);\n        verifierLeve(() -> decor.rendre(-5), \"un montant négatif est refusé\");\n        verifierLeve(() -> decor.rendre(13), \"un montant non multiple de 5 est refusé\");\n    }\n\n    public static void main(String[] args) {\n        batterie(\"Monnayeur complet\", new MonnayeurComplet());\n        System.out.println();\n        batterie(\"Monnayeur sans pièce de 20\", new MonnayeurSansVingt());\n\n        System.out.println();\n        System.out.println(\"Bilan : \" + reussis + \" réussi(s), \" + echoues + \" échoué(s)\");\n        System.out.println(\"La batterie a-t-elle distingué les deux monnayeurs ? \" + (echoues > 0));\n        System.out.println(\"Détail du rendu de 70 c : complet \"\n                + new MonnayeurComplet().rendre(70) + \", incomplet \"\n                + new MonnayeurSansVingt().rendre(70));\n    }\n}\n\ninterface Rendeur {\n    List<Integer> rendre(int centimes);\n}\n\nclass MonnayeurComplet implements Rendeur {\n    private static final int[] PIECES = {200, 100, 50, 20, 10, 5};\n\n    public List<Integer> rendre(int centimes) {\n        if (centimes < 0) {\n            throw new IllegalArgumentException(\"montant négatif : \" + centimes);\n        }\n        if (centimes % 5 != 0) {\n            throw new IllegalArgumentException(\"montant non rendable : \" + centimes);\n        }\n        ArrayList<Integer> rendu = new ArrayList<>();\n        int reste = centimes;\n        for (int piece : PIECES) {\n            while (reste >= piece) {\n                rendu.add(piece);\n                reste = reste - piece;\n            }\n        }\n        return rendu;\n    }\n}\n\nclass MonnayeurSansVingt implements Rendeur {\n    private static final int[] PIECES = {200, 100, 50, 10, 5};\n\n    public List<Integer> rendre(int centimes) {\n        if (centimes < 0) {\n            throw new IllegalArgumentException(\"montant négatif : \" + centimes);\n        }\n        if (centimes % 5 != 0) {\n            throw new IllegalArgumentException(\"montant non rendable : \" + centimes);\n        }\n        ArrayList<Integer> rendu = new ArrayList<>();\n        int reste = centimes;\n        for (int piece : PIECES) {\n            while (reste >= piece) {\n                rendu.add(piece);\n                reste = reste - piece;\n            }\n        }\n        return rendu;\n    }\n}",
      "reponses": [
        {
          "ref": "a",
          "texte": "Le rendeur complet donne 50 + 20, soit deux pièces ; celui auquel il manque la pièce de 20 donne 50 + 10 + 10, soit trois. C'est le deuxième temps, celui de la règle métier, qui fait la différence : lui seul compte les pièces. Sur les huit vérifications de la batterie, deux passent au rouge pour le rendeur incomplet."
        },

          "ref": "b",
          "texte": "Qu'il est nécessaire et notoirement insuffisant. Un invariant vérifie qu'on ne vole pas le client, ce qui est capital — mais il reste vert sur une implémentation qui rendrait quatorze pièces de 5. Une batterie composée uniquement d'invariants donne un sentiment de sécurité sans en donner la substance : il faut toujours au moins un test qui exprime la règle métier elle-même."
        },
        {
          "ref": "c",
          "texte": "Parce que le code fautif lèverait son erreur au moment de l'évaluation de l'argument, c'est-à-dire avant l'entrée dans la fonction de vérification — et donc en dehors de tout filet. Le banc d'essai s'arrêterait sur cette ligne. En passant une lambda, on transmet le droit d'exécuter plus tard : l'exécution a lieu à l'intérieur du bloc protégé, exactement comme le repli paresseux de la leçon 23."
        },

          "ref": "d",
          "texte": "Non, cela ne change rien ici : les rendeurs ne gardent aucun état d'un appel à l'autre, donc un décor usagé serait identique à un décor neuf. On le fait quand même parce que cette propriété est vraie aujourd'hui et pourra cesser de l'être demain — le jour où le rendeur comptera son stock de pièces, un test dépendant d'un test précédent se mettra à échouer selon l'ordre d'exécution, et c'est le pire genre de panne à diagnostiquer."
        }

      "pourquoi": "La même batterie est passée sur deux implémentations, dont l'une est fausse à dessein — et le programme demande explicitement à la fin si elle a su les distinguer. C'est la question qu'on ne pose jamais à ses propres tests. Un banc d'essai est du code comme un autre : il peut être faux, incomplet ou inutile, et rien ne le signale, parce que rien ne teste les tests. Les passer sur du code cassé est le seul contrôle disponible.",

      "note": "L'ordre de conception que cet exercice suggère — l'interface d'abord, les implémentations ensuite, la batterie contre l'interface — est celui qui rend les tests possibles. Un code écrit sans y penser est souvent intestable non parce qu'il est mauvais, mais parce qu'il ne laisse aucune prise : rien à remplacer, rien à observer, tout entrelacé avec l'affichage."

      "hier": "lecon27.html",
      "enonce": "<strong>Note d'atelier.</strong> JUnit est une bibliothèque extérieure : elle demande un projet configuré, un gestionnaire de dépendances et un lanceur. Les exercices d'aujourd'hui écrivent donc le banc d'essai <em>à la main</em>, en Java pur, avec le vocabulaire exact de la leçon — vérifier une égalité, vérifier une condition, vérifier qu'une erreur est levée, comparer des décimaux à une marge près, repartir d'un décor neuf. Tu obtiens le même filet de sécurité, tu peux l'exécuter partout, et tu découvres au passage qu'il n'y a aucune magie dans JUnit : une trentaine de lignes suffisent à en reproduire le cœur. Le jour où tu ouvriras un projet équipé de JUnit, tu reconnaîtras chaque pièce.<br><br>Dernier jour : rien de neuf n'est ajouté à la bourse. Reprends dans un seul fichier le code des trois jours précédents — la fiche du vélo, la liste fermée des états, la fiche d'inscription, les motifs, la fonction de diagnostic du jour 2, les fonctions de colonne et de ligne du jour 3 — sans une retouche, puis écris le banc d'essai qui les éprouve. Le décor est le hangar complet des sept vélos, reconstruit avant chaque série. Éprouve le jour 1 : le moins cher en tête et le plus cher en queue du classement par prix, le hangar intact après un tri par flux, le neuf en premier selon le juge d'état, le plus grand cadre à 58, le premier propriétaire par ordre alphabétique. Éprouve le jour 2 : une demande correcte ne produit aucun reproche, et chacune des quatre demandes fautives produit exactement le sien ; une adresse valide passe le motif, une adresse trop courte non. Éprouve le jour 3 : une colonne fait la largeur demandée, un texte trop long est tronqué mais garde son séparateur, une ligne de vélo commence par le code, finit par le prix et tient dans la largeur ; et une répétition négative lève bien une erreur. Termine par une série de non-régression sur les chiffres de la série — sept vélos, 2545 €, deux vélos neufs, sept codes conformes — et par le bilan.",
      "principe": "Un banc d'essai de non-régression ne cherche pas les défauts : il fige ce qui, aujourd'hui, est réputé correct, pour que le jour où cela changera, quelqu'un l'apprenne dans la minute plutôt que dans six mois. C'est un témoin, pas un juge — et c'est la raison pour laquelle il vaut la peine de l'écrire même quand tout va bien.",
      "reflexion": "Le banc éprouve les fonctions qui rendent un texte, et ne dit rien de l'affiche complète composée au jour 3. Pourquoi cette partie-là est-elle restée hors d'atteinte ? Propose une manière de la rendre éprouvable, puis demande-toi si le jeu en vaut la chandelle pour une affiche — et pour un relevé bancaire.",
      "remarque": "Plusieurs vérifications ouvrent la boîte du résultat sans vérifier qu'elle est pleine. Dans le code ordinaire, ce serait une faute que la leçon 23 condamne ; dans un test, c'est un choix défendable — si la boîte est vide, le banc s'arrête bruyamment, ce qui est exactement l'information voulue. La règle n'est pas la même des deux côtés, et il faut savoir dire pourquoi.",
      "indices": [
        "Sépare mentalement le fichier en deux moitiés avant d'écrire une ligne : en haut, le code de la bourse, recopié des trois jours et intouchable ; en bas, le banc d'essai, qui n'a le droit de rien changer au-dessus de lui. Si tu te surprends à modifier une fonction du jour 3 pour la rendre testable, arrête-toi et note ce que tu voulais changer : c'est une information sur la conception d'hier, et la question de réflexion t'y ramènera.",
        "Le plan : les déclarations des jours 1 à 3 ; les compteurs, les trois vérifications et l'interface d'action ; la fonction de décor, qui reconstruit le hangar des sept vélos ; puis quatre séries titrées — jour 1, jour 2, jour 3, non-régression — chacune commençant par refaire le décor ; enfin le bilan.",
        "Pour éprouver le diagnostic du jour 2, souviens-toi qu'il reçoit un tableau de champs et non une ligne : découpe donc la ligne d'essai avant de l'appeler, exactement comme le programme du jour 2 le faisait. Tester une fonction, c'est l'appeler comme son appelant réel l'appelle — pas lui inventer une entrée plus commode.",
        "Le point dur est le choix de ce qu'on vérifie sur une ligne composée. La comparer caractère pour caractère à une ligne écrite à la main dans le test paraît rigoureux, et c'est en réalité fragile : la moindre décision de mise en page fait passer le test au rouge sans qu'aucun défaut n'existe. Préfère des propriétés — la ligne commence par le code, finit par le prix, a la bonne longueur. Un test doit résister aux changements qui ne sont pas des régressions, sinon on finit par le désactiver.",
        "Ton fichier ressemble à ceci :<br><code>static ArrayList&lt;Velo&gt; hangar;</code><br><code>static void preparer() { hangar = new ArrayList&lt;&gt;… ; hangar.add(…); }</code><br><code>verifierEgal(\"BV-2026-003\", parPrixCroissant.get(0).code(), \"…\");</code><br><code>verifierEgal(…, diagnostic(\"BV-2026-006;…\".split(\";\")), \"…\");</code><br><code>verifierEgal(13, colonne(\"BV-2026-004\", 13).length(), \"…\");</code><br><code>verifierVrai(ligneVelo(hangar.get(0)).startsWith(…), \"…\");</code><br><code>verifierLeve(() -&gt; \"x\".repeat(-1), \"…\");</code><br><code>verifierEgal(2545, hangar.stream().mapToInt(v -&gt; ….prixEuros()).sum(), \"…\");</code><br><code>verifierEgal(2L, hangar.stream().filter(…).count(), \"…\");</code> ← un L"
      ],
      "solution": "// La bourse aux velos - jour 4 sur 4 : le banc d'essai.\n// Rien de neuf n'est ajoute a la bourse. On verifie, sans intervention\n// humaine, que les trois jours precedents font ce qu'on croit.\nimport java.util.ArrayList;\nimport java.util.Comparator;\nimport java.util.List;\nimport java.util.stream.Collectors;\n\npublic class BancDEssai {\n\n    // ---------- le code des jours 1 a 3, repris sans une retouche ----------\n\n    record Velo(String code, String proprietaire, String modele, int taille,\n                int prixEuros, Etat etat) { }\n\n    enum Etat { NEUF, BON, USE }\n\n    record Inscription(Velo velo, String courriel) { }\n\n    static final String CODE = \"BV-\\\\d{4}-\\\\d{3}\";\n    static final String COURRIEL = \"[a-z0-9._-]+@[a-z0-9-]+\\\\.[a-z]{2,4}\";\n    static final int LARGEUR = 60;\n\n    static String diagnostic(String[] champs) {\n        if (champs.length != 7) {\n            return \"il manque des champs (\" + champs.length + \" au lieu de 7)\";\n        }\n        if (!champs[0].matches(CODE)) {\n            return \"code d'inscription mal formé\";\n        }\n        if (!champs[3].matches(\"\\\\d{2}\")) {\n            return \"taille de cadre illisible\";\n        }\n        if (!champs[4].matches(\"\\\\d{1,5}\")) {\n            return \"prix illisible\";\n        }\n        if (!champs[5].matches(\"(NEUF|BON|USE)\")) {\n            return \"état inconnu\";\n        }\n        if (!champs[6].matches(COURRIEL)) {\n            return \"adresse de courriel invalide\";\n        }\n        return \"\";\n    }\n\n    static String colonne(String texte, int largeur) {\n        if (texte.length() >= largeur) {\n            return texte.substring(0, largeur - 1) + \" \";\n        }\n        return texte + \" \".repeat(largeur - texte.length());\n    }\n\n    static String ligneVelo(Velo v) {\n        StringBuilder l = new StringBuilder();\n        l.append(colonne(v.code(), 13));\n        l.append(colonne(v.modele(), 20));\n        l.append(colonne(\"T\" + v.taille(), 5));\n        l.append(colonne(v.proprietaire(), 13));\n        String prix = v.prixEuros() + \" €\";\n        l.append(\" \".repeat(Math.max(1, 8 - prix.length()))).append(prix);\n        return l.toString();\n    }\n\n    // ---------- le banc d'essai ----------\n\n    static int reussis = 0;\n    static int echoues = 0;\n\n    interface Action {\n        void executer();\n    }\n\n    static void verifierEgal(Object attendu, Object obtenu, String nom) {\n        if (attendu.equals(obtenu)) {\n            reussis = reussis + 1;\n            System.out.println(\"  ✓ \" + nom);\n        } else {\n            echoues = echoues + 1;\n            System.out.println(\"  ✗ \" + nom + \" — attendu « \" + attendu\n                    + \" », obtenu « \" + obtenu + \" »\");\n        }\n    }\n\n    static void verifierVrai(boolean condition, String nom) {\n        if (condition) {\n            reussis = reussis + 1;\n            System.out.println(\"  ✓ \" + nom);\n        } else {\n            echoues = echoues + 1;\n            System.out.println(\"  ✗ \" + nom + \" — la condition est fausse\");\n        }\n    }\n\n    static void verifierLeve(Action action, String nom) {\n        try {\n            action.executer();\n            echoues = echoues + 1;\n            System.out.println(\"  ✗ \" + nom + \" — aucune erreur n'a été levée\");\n        } catch (Exception e) {\n            reussis = reussis + 1;\n            System.out.println(\"  ✓ \" + nom);\n        }\n    }\n\n    // Le decor : un hangar neuf avant chaque serie, pour qu'aucune serie\n    // n'herite de ce qu'une autre a laisse trainer.\n    static ArrayList<Velo> hangar;\n\n    static void preparer() {\n        hangar = new ArrayList<>();\n        hangar.add(new Velo(\"BV-2026-004\", \"Lambert\", \"Gitane Tour\", 54, 180, Etat.BON));\n        hangar.add(new Velo(\"BV-2026-001\", \"Nzeyimana\", \"Peugeot PX10\", 58, 320, Etat.BON));\n        hangar.add(new Velo(\"BV-2026-003\", \"Declercq\", \"Btwin Riverside\", 50, 95, Etat.USE));\n        hangar.add(new Velo(\"BV-2026-005\", \"Lambert\", \"Ridley Fenix\", 54, 640, Etat.NEUF));\n        hangar.add(new Velo(\"BV-2026-002\", \"Haddad\", \"Motobécane C4\", 58, 180, Etat.USE));\n        hangar.add(new Velo(\"BV-2026-006\", \"Peeters\", \"Trek FX2\", 56, 240, Etat.BON));\n        hangar.add(new Velo(\"BV-2026-007\", \"Sow\", \"Brompton M3L\", 50, 890, Etat.NEUF));\n    }\n\n    public static void main(String[] args) {\n        System.out.println(\"--- Jour 1 : les juges ---\");\n        preparer();\n        Comparator<Velo> parPrix = Comparator.comparingInt(Velo::prixEuros);\n        Comparator<Velo> parTaille = Comparator.comparingInt(Velo::taille);\n        Comparator<Velo> parProprietaire = Comparator.comparing(Velo::proprietaire);\n        Comparator<Velo> parEtat = Comparator.comparingInt(v -> v.etat().ordinal());\n\n        List<Velo> parPrixCroissant = hangar.stream().sorted(parPrix)\n                .collect(Collectors.toList());\n        verifierEgal(\"BV-2026-003\", parPrixCroissant.get(0).code(), \"le moins cher vient en tête\");\n        verifierEgal(\"BV-2026-007\", parPrixCroissant.get(6).code(), \"le plus cher vient en queue\");\n        verifierEgal(\"BV-2026-004\", hangar.get(0).code(), \"le tri par flux n'a pas touché au hangar\");\n        verifierEgal(Etat.NEUF, hangar.stream().sorted(parEtat).findFirst().get().etat(),\n                \"le juge d'état place le neuf en premier\");\n        verifierEgal(58, hangar.stream().sorted(parTaille.reversed()).findFirst().get().taille(),\n                \"le plus grand cadre mesure 58\");\n        verifierEgal(\"Declercq\", hangar.stream().sorted(parProprietaire).findFirst().get()\n                .proprietaire(), \"le premier propriétaire est Declercq\");\n\n        System.out.println();\n        System.out.println(\"--- Jour 2 : le diagnostic ---\");\n        preparer();\n        verifierEgal(\"\", diagnostic(\n                \"BV-2026-006;Peeters;Trek FX2;56;240;BON;jan.peeters@skynet.be\".split(\";\")),\n                \"une demande correcte ne produit aucun reproche\");\n        verifierEgal(\"code d'inscription mal formé\", diagnostic(\n                \"BV26008;Vandamme;Batavus;54;120;USE;v@proximus.be\".split(\";\")),\n                \"un code sans tirets est nommé comme tel\");\n        verifierEgal(\"état inconnu\", diagnostic(\n                \"BV-2026-009;K;Cannondale;58;510;EXCELLENT;k.k@voo.be\".split(\";\")),\n                \"un état hors liste est nommé comme tel\");\n        verifierEgal(\"adresse de courriel invalide\", diagnostic(\n                \"BV-2026-010;Meunier;Elops;52;75;USE;meunier[at]gmail.com\".split(\";\")),\n                \"une adresse sans arobase est nommée comme telle\");\n        verifierEgal(\"il manque des champs (6 au lieu de 7)\", diagnostic(\n                \"BV-2026-011;Dubois;Colnago;56;1450;BON\".split(\";\")),\n                \"une demande incomplète est comptée avant d'être lue\");\n        verifierVrai(\"a.sow@ulb.be\".matches(COURRIEL), \"une adresse valide passe le motif\");\n        verifierVrai(!\"a@b\".matches(COURRIEL), \"une adresse trop courte ne passe pas\");\n\n        System.out.println();\n        System.out.println(\"--- Jour 3 : la composition ---\");\n        preparer();\n        verifierEgal(13, colonne(\"BV-2026-004\", 13).length(), \"une colonne fait la largeur demandée\");\n        verifierEgal(6, colonne(\"Colnago Master\", 6).length(), \"un texte trop long est tronqué\");\n        verifierVrai(colonne(\"Colnago Master\", 6).endsWith(\" \"),\n                \"un texte tronqué garde son séparateur\");\n        verifierEgal(59, ligneVelo(hangar.get(0)).length(), \"une ligne de vélo tient dans la largeur\");\n        verifierVrai(ligneVelo(hangar.get(0)).startsWith(\"BV-2026-004\"),\n                \"la ligne commence par le code\");\n        verifierVrai(ligneVelo(hangar.get(0)).endsWith(\"180 €\"), \"la ligne finit par le prix aligné\");\n        verifierLeve(() -> \"x\".repeat(-1), \"une répétition négative lève bien une erreur\");\n\n        System.out.println();\n        System.out.println(\"--- Non-régression : les chiffres de la série ---\");\n        preparer();\n        verifierEgal(7, hangar.size(), \"le hangar compte toujours 7 vélos\");\n        verifierEgal(2545, hangar.stream().mapToInt(v -> v.prixEuros()).sum(),\n                \"la valeur totale vaut toujours 2545 €\");\n        verifierEgal(2L, hangar.stream().filter(v -> v.etat() == Etat.NEUF).count(),\n                \"il y a toujours 2 vélos neufs\");\n        verifierEgal(7L, hangar.stream().filter(v -> v.code().matches(CODE)).count(),\n                \"les 7 codes restent conformes\");\n        Inscription i = new Inscription(hangar.get(6), \"a.sow@ulb.be\");\n        verifierEgal(\"BV-2026-007\", i.velo().code(), \"l'inscription enveloppe bien son vélo\");\n\n        System.out.println();\n        System.out.println(\"Bilan : \" + reussis + \" réussi(s), \" + echoues + \" échoué(s)\");\n        System.out.println(echoues == 0\n                ? \"Le banc est vert : les trois jours tiennent.\"\n                : \"Le banc est rouge : quelque chose a bougé.\");\n    }\n}",
      "pourquoi": "Le comptage attendu s'écrit avec un L final. Ce détail minuscule est la dernière embûche de la série : le comptage d'une chaîne de traitement rend un entier long, et une vérification d'égalité qui compare des objets ne considère pas un entier ordinaire comme égal à un entier long, même de même valeur. Le test échouerait avec un message absurde — attendu 2, obtenu 2. C'est le genre d'échec qui fait perdre une demi-heure, et le connaître d'avance en fait perdre zéro.",
      "tests": [
        {

        },
        {
          "code": "assert '✓ une demande correcte ne produit aucun reproche' in __output__ and '✓ un code sans tirets est nommé comme tel' in __output__ and \"✓ une demande incomplète est comptée avant d'être lue\" in __output__",
          "label": "Le diagnostic du jour 2 nomme chaque faute, et compte avant de lire"
        },
        {
          "code": "assert '✓ une colonne fait la largeur demandée' in __output__ and '✓ un texte trop long est tronqué' in __output__ and '✓ la ligne finit par le prix aligné' in __output__ and '✓ une répétition négative lève bien une erreur' in __output__",
          "label": "La composition du jour 3 est éprouvée par propriétés, pas au caractère près"
        },
        {
          "code": "assert '✓ la valeur totale vaut toujours 2545 €' in __output__ and '✓ il y a toujours 2 vélos neufs' in __output__ and '✓ les 7 codes restent conformes' in __output__",
          "label": "La série de non-régression fige les chiffres des quatre jours"
        },
        {
          "code": "assert 'Bilan : 25 réussi(s), 0 échoué(s)' in __output__ and 'Le banc est vert : les trois jours tiennent.' in __output__",
          "label": "Vingt-cinq vérifications, aucune rouge"
        }
      ],
      "checklist": [
        "As-tu modifié une seule ligne du code des jours 1 à 3 pour le rendre testable ? Note laquelle et pourquoi — c'est la vraie conclusion de la série.",
        "Ton décor est-il refait avant chacune des quatre séries ? Retire un appel et regarde si un test change de résultat.",
        "Tes vérifications sur la ligne composée portent-elles sur des propriétés ou sur le texte exact ? Change la largeur d'une colonne et vois combien de tests virent au rouge sans qu'aucun défaut n'existe.",
        "Le total de 2545 € est-il écrit en dur dans le test ? Oui — et c'est voulu. Sais-tu dire pourquoi un test de non-régression a le droit de faire ce qu'un programme n'a pas le droit de faire ?",
        "Ton bilan annonce-t-il zéro échec ? Si oui, fais échouer un test exprès une fois, pour vérifier que le banc sait encore virer au rouge."
      ],
      "note": "Fin de la série. En quatre jours, la bourse aux vélos a été rangée, contrôlée, imprimée et éprouvée — et à aucun moment le code des jours précédents n'a dû être rouvert. Ce n'est pas un hasard d'énoncé : c'est ce que produisent des règles nommées, des données figées et des fonctions qui rendent au lieu d'afficher. Les trois habitudes tiennent en une phrase, et elles t'auront coûté quatre jours à installer."

      "solution": "import org.junit.jupiter.api.Test;                        // l'annotation @Test\nimport static org.junit.jupiter.api.Assertions.assertEquals; // l'assertion d'egalite\n\nclass MathJeuTest {                                       // classe de tests\n\n    @Test                                                // marque : ceci est un test\n    void doublerQuatreDonneHuit() {                      // un test = une methode sans parametre\n        int resultat = MathJeu.doubler(4);               // ACT : on execute le code a verifier\n        assertEquals(8, resultat);                       // ASSERT : attendu 8, obtenu resultat\n    }                                                    // fin du 1er test\n\n    @Test                                                // second test\n    void doublerZeroDonneZero() {                        // cas limite : 0\n        assertEquals(0, MathJeu.doubler(0));             // attendu 0 (l'attendu vient en premier)\n    }                                                    // fin du 2e test\n}                                                        // fin de la classe de tests",
