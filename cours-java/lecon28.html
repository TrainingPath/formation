<script>
var DAY = {
  num: 28,
  title: "Tests unitaires avec JUnit",
  subtitle: "Prouver que ton code fait ce qu'il promet : des petits contrôles automatiques qui t'alertent au moindre bug.",
  theory: `
<h3>1. Pourquoi tester ?</h3>
<p>Imagine que tu répares la caisse enregistreuse de ta <strong>ludothèque</strong>. Comment être SÛR qu'elle calcule juste ? Tu essaies quelques achats connus : « 2 jeux à 10 € = 20 € ». Un <strong>test unitaire</strong> automatise exactement cela : un petit programme qui vérifie qu'une méthode donne le bon résultat sur un cas précis, et qui hurle si ce n'est pas le cas.</p>
<div class="tip">« Unitaire » veut dire qu'on teste une <strong>unité</strong> isolée : une seule méthode, une seule règle, à la fois. Comme vérifier chaque pièce d'un moteur séparément avant de démarrer la voiture.</div>

<h3>2. JUnit : la boîte à outils des tests</h3>
<p><strong>JUnit</strong> est la bibliothèque standard de tests en Java. On écrit des méthodes de test marquées de l'annotation <code>@Test</code>. JUnit les repère et les exécute toutes automatiquement, puis affiche un rapport : vert (réussi) ou rouge (échoué).</p>
<pre class="pseudo">import org.junit.jupiter.api.Test;                    // l'annotation @Test
import static org.junit.jupiter.api.Assertions.*;     // les vérifications (assertEquals...)

class CalculTest {                                     // une classe de tests
    @Test                                              // marque : « ceci est un test »
    void additionSimple() {                            // un test = une méthode sans paramètre
        int resultat = Calcul.addition(2, 3);          // on exécute le code à vérifier
        assertEquals(5, resultat);                     // on AFFIRME : le résultat DOIT valoir 5
    }
}</pre>

<h3>3. Les assertions : le coeur du test</h3>
<p>Une <strong>assertion</strong> (« affirmation ») déclare ce qui DOIT être vrai. Si c'est vrai, le test passe silencieusement ; si c'est faux, le test échoue et JUnit t'indique où.</p>
<pre class="pseudo">assertEquals(attendu, obtenu)    // vérifie que obtenu == attendu (l'ATTENDU en premier !)
assertTrue(condition)            // vérifie que la condition est vraie
assertFalse(condition)           // vérifie que la condition est fausse
assertNull(objet)                // vérifie que l'objet est null
assertNotNull(objet)             // vérifie que l'objet n'est PAS null
assertThrows(Exception.class, () -&gt; ...) // vérifie qu'un code LÈVE bien une exception</pre>
<div class="warn">Ordre à mémoriser : <code>assertEquals(attendu, obtenu)</code> — la valeur ATTENDUE d'abord, la valeur OBTENUE ensuite. Inverser ne casse pas le test, mais rend les messages d'erreur trompeurs.</div>

<h3>4. Le modèle AAA : Arrange, Act, Assert</h3>
<p>Un bon test suit trois temps, comme une recette :</p>
<pre class="pseudo">@Test
void prixTotalDeuxJeux() {
    // ARRANGE : on prépare les données de départ
    Panier panier = new Panier();                 // un panier vide
    panier.ajouter(10.0);                         // un jeu à 10 EUR
    panier.ajouter(15.0);                         // un jeu à 15 EUR
    // ACT : on exécute l'action à tester
    double total = panier.total();                // on calcule le total
    // ASSERT : on vérifie le résultat attendu
    assertEquals(25.0, total);                    // le total DOIT valoir 25 EUR
}</pre>

<h3>5. Comparer des décimaux : la tolérance</h3>
<p>Les nombres à virgule (<code>double</code>) sont approximatifs (leçon 5). Pour les comparer, on donne une <strong>marge d'erreur</strong> (delta) : « égal à 0,001 près ».</p>
<pre class="pseudo">assertEquals(0.3, a + b, 0.0001);   // le 3e argument = tolérance : évite les faux échecs des flottants</pre>

<h3>6. Préparer le décor : @BeforeEach</h3>
<p>Quand plusieurs tests partent du même point, on met la préparation dans une méthode <code>@BeforeEach</code> : JUnit l'exécute AVANT chaque test, garantissant un décor neuf à chaque fois.</p>
<pre class="pseudo">Panier panier;                       // partagé par les tests
@BeforeEach                          // exécuté avant CHAQUE test
void preparer() {
    panier = new Panier();           // un panier tout neuf, indépendant, pour chaque test
}</pre>

<h3>7. La philosophie : un filet de sécurité</h3>
<p>Les tests sont un <strong>filet de sécurité</strong> : quand tu modifies ton code plus tard, tu relances les tests. S'ils restent verts, tu n'as rien cassé ; si l'un vire au rouge, tu sais AUSSITÔT où et pourquoi. Écrire des tests, c'est documenter le comportement attendu ET dormir tranquille.</p>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'un test unitaire ?", opts: ["Un test de vitesse", "Un petit programme qui vérifie automatiquement qu'une méthode donne le bon résultat", "Une boucle", "Un affichage"], a: 1, exp: "Il contrôle une unité de code sur un cas précis." },
    { type: "qcm", q: "Que signifie « unitaire » dans « test unitaire » ?", opts: ["Un seul fichier", "On teste UNE unité isolée (une méthode, une règle) à la fois", "Un test unique", "Un test rapide"], a: 1, exp: "On isole la plus petite brique testable." },
    { type: "qcm", q: "Quelle annotation marque une méthode de test JUnit ?", opts: ["@Run", "@Test", "@Check", "@Main"], a: 1, exp: "@Test signale à JUnit d'exécuter la méthode." },
    { type: "qcm", q: "Que fait <code>assertEquals(5, resultat)</code> ?", opts: ["Affecte 5 à resultat", "Vérifie que resultat vaut 5, sinon le test échoue", "Affiche 5", "Additionne"], a: 1, exp: "Une assertion : elle affirme ce qui doit être vrai." },
    { type: "qcm", q: "Dans <code>assertEquals(attendu, obtenu)</code>, quel argument vient en premier ?", opts: ["obtenu", "la valeur ATTENDUE", "peu importe", "la condition"], a: 1, exp: "Attendu d'abord, obtenu ensuite : convention à respecter." },
    { type: "qcm", q: "<code>assertTrue(condition)</code> réussit si…", opts: ["la condition est fausse", "la condition est vraie", "toujours", "jamais"], a: 1, exp: "Elle affirme que la condition est vraie." },
    { type: "qcm", q: "Comment vérifier qu'un code LÈVE une exception ?", opts: ["assertTrue", "assertThrows(Exception.class, () -&gt; ...)", "assertNull", "@Test seul"], a: 1, exp: "assertThrows vérifie qu'une exception attendue est levée." },
    { type: "qcm", q: "Que signifient les trois A du modèle AAA ?", opts: ["Ajouter, Appeler, Afficher", "Arrange (préparer), Act (agir), Assert (vérifier)", "Analyser, Assembler, Archiver", "Aucun sens"], a: 1, exp: "Préparer les données, exécuter, puis vérifier." },
    { type: "qcm", q: "Pourquoi donner une tolérance dans <code>assertEquals(0.3, x, 0.0001)</code> ?", opts: ["Pour aller plus vite", "Parce que les double sont approximatifs : on tolère une petite marge", "Pour arrondir", "C'est obligatoire partout"], a: 1, exp: "Les flottants exigent une marge d'erreur." },
    { type: "qcm", q: "À quoi sert <code>@BeforeEach</code> ?", opts: ["À lancer un test une fois", "À exécuter une préparation AVANT chaque test (décor neuf)", "À la fin des tests", "À ignorer un test"], a: 1, exp: "Elle réinitialise l'état avant chaque test." },
    { type: "vf", q: "Un test qui réussit ne produit aucun message ; seul un échec est signalé.", a: true, exp: "Vert = silencieux, rouge = alerte détaillée." },
    { type: "vf", q: "Les tests forment un filet de sécurité qui détecte les régressions quand on modifie le code.", a: true, exp: "On relance les tests après chaque changement." },
    { type: "qcm", q: "<code>assertNotNull(objet)</code> vérifie que…", opts: ["objet vaut 0", "objet n'est PAS null", "objet est null", "objet est vide"], a: 1, exp: "Elle affirme la présence d'un objet." },
    { type: "vf", q: "Chaque test devrait être indépendant des autres.", a: true, exp: "@BeforeEach garantit un décor neuf, sans effet de bord entre tests." },
    { type: "qcm", q: "Quel est le principal bénéfice d'écrire des tests ?", opts: ["Un code plus court", "Détecter tôt les bugs et documenter le comportement attendu", "Un programme plus rapide", "Moins de mémoire"], a: 1, exp: "Confiance, régressions attrapées, comportement documenté." }
  ],
  final: {
    title: "Exercice final — Tester le panier de la ludothèque",
    intro: `<p>On teste une méthode <code>total()</code> qui additionne les prix d'un panier :</p>
<pre class="pseudo">class PanierTest {
    Panier panier;                                 // partagé par les tests
    @BeforeEach                                    // (1) avant chaque test
    void preparer() {
        panier = new Panier();                     // panier tout neuf
    }
    @Test
    void panierVideEstZero() {
        assertEquals(0.0, panier.total());         // (2) panier vide -> total 0
    }
    @Test
    void deuxJeux() {
        panier.ajouter(10.0);                      // ARRANGE
        panier.ajouter(15.0);                      // ARRANGE
        assertEquals(25.0, panier.total());        // (3) ASSERT : 25 EUR
    }
}</pre>`,
    questions: [
      { type: "qcm", q: "(1) Quand s'exécute la méthode <code>@BeforeEach preparer()</code> ?", opts: ["Une fois au début", "Avant CHAQUE test, pour repartir d'un panier neuf", "À la fin", "Jamais"], a: 1, exp: "Elle garantit l'indépendance des tests." },
      { type: "qcm", q: "(2) Que vérifie <code>panierVideEstZero</code> ?", opts: ["Que le panier plante", "Qu'un panier vide a un total de 0", "Qu'il contient 1 jeu", "Rien"], a: 1, exp: "Le cas limite : rien dedans, total nul." },
      { type: "qcm", q: "(3) Que signifie <code>assertEquals(25.0, panier.total())</code> ?", opts: ["Ajoute 25", "Affirme que le total DOIT valoir 25.0", "Affiche 25", "Multiplie"], a: 1, exp: "L'assertion vérifie le résultat attendu." },
      { type: "vf", q: "Grâce à @BeforeEach, le test <code>deuxJeux</code> part d'un panier vide, non pollué par un autre test.", a: true, exp: "Chaque test reçoit un décor neuf et isolé." },
      { type: "qcm", q: "Si <code>total()</code> renvoyait 24.0 au lieu de 25.0, que se passerait-il ?", opts: ["Rien", "Le test deuxJeux échoue (rouge) et JUnit signale attendu 25 / obtenu 24", "Le test réussit quand même", "Le programme s'arrête définitivement"], a: 1, exp: "L'assertion échoue et pointe l'écart : le bug est révélé." }
    ],
    solution: `<pre class="pseudo">@BeforeEach preparer() : panier neuf avant chaque test  // isolation
Test panierVideEstZero : assertEquals(0.0, total())     // cas limite : vide -> 0
Test deuxJeux :
    ARRANGE : ajouter(10) ; ajouter(15)                 // on prépare
    ACT     : panier.total()                            // on exécute
    ASSERT  : assertEquals(25.0, ...)                   // 25 attendu
// Tous verts -> le calcul est prouvé correct sur ces cas.</pre>
<p>Deux petits tests prouvent que le panier compte juste, y compris le cas vide. Modifie le code plus tard : ces tests t'avertiront au moindre écart. Prochaine leçon : threads et concurrence, pour faire plusieurs choses à la fois.</p>`
  }
};

    statement: "On dispose d'une classe <code>MathJeu</code> avec <code>static int doubler(int n)</code> qui renvoie <code>n * 2</code>. Écris une classe de test JUnit avec deux méthodes <code>@Test</code> : l'une vérifie que <code>doubler(4)</code> vaut 8, l'autre que <code>doubler(0)</code> vaut 0. Utilise <code>assertEquals</code>.",
    hints: [

      "Chaque test est une méthode void sans paramètre, précédée de @Test.",
      "assertEquals(attendu, obtenu) : la valeur attendue d'abord, ex. assertEquals(8, MathJeu.doubler(4))."
    ],
    solution: "import org.junit.jupiter.api.Test;                        // l'annotation @Test\nimport static org.junit.jupiter.api.Assertions.assertEquals; // l'assertion d'egalite\n\nclass MathJeuTest {                                       // classe de tests\n\n    @Test                                                // marque : ceci est un test\n    void doublerQuatreDonneHuit() {                      // un test = une methode sans parametre\n        int resultat = MathJeu.doubler(4);               // ACT : on execute le code a verifier\n        assertEquals(8, resultat);                       // ASSERT : attendu 8, obtenu resultat\n    }                                                    // fin du 1er test\n\n    @Test                                                // second test\n    void doublerZeroDonneZero() {                        // cas limite : 0\n        assertEquals(0, MathJeu.doubler(0));             // attendu 0 (l'attendu vient en premier)\n    }                                                    // fin du 2e test\n}                                                        // fin de la classe de tests",
    note: "Chaque @Test vérifie un cas isolé, y compris le cas limite 0. assertEquals prend toujours la valeur attendue en premier, l'obtenue en second : c'est la convention JUnit." }
  ]
};
