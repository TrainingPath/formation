<script>
var DAY = {
  num: 31,
  title: "Examen final Java",
  subtitle: "21 leçons en une page : prouve que Java est devenu ton dialecte.",
  theory: `
<p>Cette dernière leçon est un <strong>examen de synthèse</strong> : chaque question porte un repère [L1], [L2]… qui renvoie à la leçon d'origine. Avant de te lancer, voici la carte complète du cours.</p>
<h3>Le cours en une carte</h3>
<pre class="pseudo">SEMAINE 1 — BASES
  classe/main/println · types (int, double, boolean, String, char)            // structure et données
  opérateurs (/, %, ==, &amp;&amp;) · Scanner · if/else/switch · boucles · tableaux [0..n-1]  // calculer, lire, décider, répéter

SEMAINE 2 — STRUCTURER
  méthodes static · String (equals, charAt, substring) · ArrayList            // factoriser, texte, listes
  algorithmes traduits (recherche, tri, dichotomie)                          // les grands classiques
  POO : classes, objets, constructeurs, private, this                        // modéliser en objets

SEMAINE 3 — VERS LE RÉEL
  héritage (extends, super, @Override) · polymorphisme                       // réutiliser, spécialiser
  abstract / interface · exceptions (try/catch/throw)                        // contractualiser, fiabiliser
  fichiers (PrintWriter, Scanner) · HashMap · Random · dates · PROJET        // persister, indexer, assembler</pre>
<h3>Les réflexes Java à vie</h3>
<ul>
<li><code>==</code> pour les primitifs, <code>.equals()</code> pour les String et objets (le piège Java n°1).</li>
<li>int/int tronque : caster <code>(double)</code> AVANT de diviser.</li>
<li>Tableaux et listes : 0-indexés, dernier = length−1, boucle <code>i &lt; length</code>.</li>
<li><code>String</code>, <code>LocalDate</code> : immuables → RÉAFFECTER le résultat.</li>
<li><code>null</code> : tester avant d'utiliser ; <code>getOrDefault</code> sur les maps.</li>
<li>Attributs <code>private</code> + constructeur + méthodes choisies = objet bien élevé (encapsulation).</li>
<li>Une exception se lit : type + message + ligne. Jamais de <code>catch</code> vide.</li>
</ul>
<div class="tip">L'examen pioche dans les 20 leçons précédentes. Vise 100 % — chaque question ratée te renvoie, grâce à son repère [L…], à la leçon exacte à revoir : c'est ton mode d'emploi de révision ciblée.</div>`,
  exercises: [
    { type: "qcm", q: "[L1] Le point d'entrée d'un programme Java :", opts: ["start()", "public static void main(String[] args)", "run()", "Main()"], a: 1, exp: "Signature exacte, casse comprise." },
    { type: "qcm", q: "[L2] Quel type pour un prix avec décimales ?", opts: ["int", "double", "char", "String"], a: 1, exp: "REEL → double." },
    { type: "qcm", q: "[L3] Que vaut <code>9 / 2</code> (deux int) ?", opts: ["4.5", "4", "5", "4.0"], a: 1, exp: "Division entière : le piège n°1." },
    { type: "input", q: "[L3] Que vaut <code>17 % 5</code> ?", a: "2", ph: "nombre", exp: "Le reste : 2." },
    { type: "qcm", q: "[L4] Lire un entier au clavier :", opts: ["clavier.nextInt()", "clavier.readInt()", "Lire(n)", "clavier.int()"], a: 0, exp: "Avec le Scanner créé sur System.in." },
    { type: "qcm", q: "[L5] Comparer deux String saisies :", opts: ["s1 == s2", "s1.equals(s2)", "s1 = s2", "s1 != s2"], a: 1, exp: "equals compare le contenu ; == les références." },
    { type: "input", q: "[L6] <code>int s = 0; for (int i = 1; i <= 5; i++) { if (i % 2 == 1) s += i; }</code> s = ?", a: "9", ph: "nombre", exp: "1+3+5 = 9 : accumulateur conditionnel." },
    { type: "qcm", q: "[L7] int[] t = {4, 7, 1}; le dernier élément est…", opts: ["t[3]", "t[t.length - 1] soit t[2] = 1", "t[1]", "t.last"], a: 1, exp: "0-indexé : 3 cases, indices 0-2." },
    { type: "qcm", q: "[L8] Une méthode qui n'a rien à retourner se déclare…", opts: ["int", "void", "null", "return"], a: 1, exp: "La procédure du jour 20 d'algo." },
    { type: "input", q: "[L9] Que vaut <code>\"JAVA\".charAt(1)</code> ?", a: ["A", "a"], ph: "caractère", exp: "J(0) A(1) : A." },
    { type: "qcm", q: "[L10] Ajouter en fin de ArrayList<String> l :", opts: ["l.push(x)", "l.add(x)", "l[l.size()] = x", "l.append toujours"], a: 1, exp: "add ajoute, get lit, size compte." },

    { type: "qcm", q: "[L13] Un attribut private est accessible…", opts: ["Partout", "Uniquement dans sa classe (d'où getters/setters)", "Dans le package entier toujours", "Par les sous-classes qui en héritent"], a: 1, exp: "L'encapsulation." },

    { type: "qcm", q: "[L19] Un entier aléatoire entre 1 et 100 :", opts: ["alea.nextInt(100)", "1 + alea.nextInt(100)", "alea.nextInt(101)", "alea.nextInt(1, 100) partout"], a: 1, exp: "nextInt(100) → 0..99, +1 → 1..100." }
  ],
  final: {
    title: "Épreuve de synthèse — Le gestionnaire de flotte",
    intro: `<p>Dernière épreuve ! Analyse ce programme complet :</p>
<pre class="pseudo">public class Vehicule {
    private String immat;                        // attribut privé : la plaque
    private int km;                              // attribut privé : le kilométrage
    public Vehicule(String immat, int km) {      // constructeur
        this.immat = immat;                      // range la plaque
        this.km = (km >= 0) ? km : 0;            // valide : un km négatif devient 0
    }
    public int getKm() { return km; }            // getter : lecture du kilométrage
    public void rouler(int distance) {           // ajoute des km parcourus
        if (distance > 0) { km += distance; }    // n'accepte que les distances positives
    }
    public String toString() { return immat + " : " + km + " km"; } // affichage lisible
}
// Main :
ArrayList&lt;Vehicule&gt; flotte = new ArrayList&lt;&gt;();   // liste de véhicules
flotte.add(new Vehicule("AA-11", 50000));       // 1er véhicule (50000 km)
flotte.add(new Vehicule("BB-22", -300));       // (1) km négatif → validé à 0
flotte.get(0).rouler(1500);                     // (2) AA-11 roule 1500 km
flotte.get(1).rouler(-99);                      // (3) distance négative → refusée
int total = 0;                                  // accumulateur du kilométrage total
for (Vehicule v : flotte) { total += v.getKm(); }   // (4) somme des km de la flotte</pre>`,
    questions: [
      { type: "input", q: "(1) Que vaut getKm() pour BB-22 juste après sa création ?", a: "0", ph: "nombre", exp: "Le constructeur valide : -300 devient 0 (leçon 13, naître cohérent)." },
      { type: "input", q: "(2) Que vaut le km de AA-11 après rouler(1500) ?", a: "51500", ph: "nombre", exp: "50000 + 1500." },
      { type: "qcm", q: "(3) rouler(-99) sur BB-22 :", opts: ["km devient -99", "Rien : le if refuse les distances négatives — l'encapsulation protège", "Exception", "km devient 99"], a: 1, exp: "La règle vit dans l'objet, indéjouable." },
      { type: "input", q: "(4) Que vaut total ?", a: "51500", ph: "nombre", exp: "51500 + 0 : l'accumulateur (jour 12) sur une liste d'objets." },
      { type: "qcm", q: "BILAN — Ce petit programme mobilise :", opts: ["Seulement des boucles", "Classe + encapsulation + constructeur validant + ArrayList + for-each + accumulateur : cinq semaines de savoir en 20 lignes", "Que de la POO", "Seulement des variables"], a: 1, exp: "Si tu as tout suivi sans relire : Java est devenu un automatisme. Félicitations, direction PHP ou C# — tu verras, 80 % se ressemble ! 🎓" }
    ],
    solution: `<pre class="pseudo">(1) new Vehicule("BB-22", -300) → km = 0 (validation)
(2) 50000 + 1500 = 51500
(3) rouler(-99) → refusé silencieusement, km reste 0
(4) total = 51500 + 0 = 51500

Le même programme en pseudocode aurait tenu au jour 30
d'algorithmique. Java n'a ajouté que : types, syntaxe,
objets. La PENSÉE, elle, n'a jamais changé.</pre>
<p><strong>Bravo !</strong> Tu as terminé le cours Java. Suite logique : le projet de la leçon 20 à enrichir (tri, HashMap des emprunteurs, dates de retour…), puis les cours PHP et C# pour constater à quel point tout se transfère.</p>`
