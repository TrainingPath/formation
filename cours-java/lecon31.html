<pre class="pseudo">public class Vehicule {
    private String immat;                        // attribut privé : la plaque
    private int km;                              // attribut privé : le kilométrage
    public Vehicule(String immat, int km) {      // constructeur
        this.immat = immat;                      // range la plaque
        this.km = (km >= 0) ? km : 0;            // valide : un km négatif devient 0
    }
    public int getKm() { return km; }            // getter : lecture du kilométrage
    public void rouler(int distance) {           // ajoute des km parcourus
        if (distance > 0) { km += distance; }    // n'accepte que les distances positives
    }
    public String toString() { return immat + " : " + km + " km"; } // affichage lisible
}
// Main :
ArrayList&lt;Vehicule&gt; flotte = new ArrayList&lt;&gt;();   // liste de véhicules
flotte.add(new Vehicule("AA-11", 50000));       // 1er véhicule (50000 km)
flotte.add(new Vehicule("BB-22", -300));       // (1) km négatif → validé à 0
flotte.get(0).rouler(1500);                     // (2) AA-11 roule 1500 km
flotte.get(1).rouler(-99);                      // (3) distance négative → refusée
int total = 0;                                  // accumulateur du kilométrage total
for (Vehicule v : flotte) { total += v.getKm(); }   // (4) somme des km de la flotte</pre>`,

        "Ton fichier ressemble à ceci :<br><code>System.out.println(\"Rangées nécessaires : \" + (places + parRangee - 1) / …);</code><br><code>((double) 250 / 12)</code> ← la conversion AVANT la division<br><code>String attendu = \"Bal\" + …();</code> ← assemblé à l'exécution<br><code>categories[categories.length - 1]</code><br><code>affiche = affiche.to…();</code> ← la réaffectation<br><code>vendus.getOrDefault(\"Balcon\", 0)</code><br><code>catch (NumberFormatException e) { … e.getMessage() }</code><br><code>class Concert { private final int capacite; private int vendues; }</code><br><code>if (vendues + nombre &gt; …) { return \"refusé (il reste \" + … ; }</code>"

      "solution": "// La salle de concert : les huit reflexes du cours, verifies un par un\n// sur un cas concret plutot que recites.\nimport java.util.ArrayList;\nimport java.util.HashMap;\nimport java.util.List;\nimport java.util.Map;\n\npublic class SalleDeConcert {\n\n    public static void main(String[] args) {\n        // [L3] Division entiere : deux entiers se divisent en entier, la\n        // partie decimale est perdue AVANT toute affectation.\n        int places = 250;\n        int parRangee = 12;\n        System.out.println(\"Rangées pleines : \" + places / parRangee);\n        System.out.println(\"Places au dernier rang : \" + places % parRangee);\n        System.out.println(\"Rangées nécessaires : \" + (places + parRangee - 1) / parRangee);\n        System.out.println(\"Moyenne fausse : \" + (250 / 12));\n        System.out.println(\"Moyenne juste  : \" + ((double) 250 / 12));\n\n        // [L9] Le piege numero un : == compare des adresses, equals des contenus.\n        String saisi = \"Balcon\";\n        String attendu = \"Bal\" + lireFin();\n        System.out.println(\"Avec == : \" + (saisi == attendu));\n        System.out.println(\"Avec equals : \" + saisi.equals(attendu));\n\n        // [L7] Les indices vont de 0 a longueur - 1.\n        String[] categories = {\"Fosse\", \"Parterre\", \"Balcon\", \"Loge\"};\n        System.out.println(\"Première catégorie : \" + categories[0]);\n        System.out.println(\"Dernière catégorie : \" + categories[categories.length - 1]);\n        System.out.println(\"Nombre de catégories : \" + categories.length);\n\n        // [L27] Un texte ne change pas : il faut reaffecter le resultat.\n        String affiche = \"concert de printemps\";\n        affiche.toUpperCase();\n        System.out.println(\"Sans réaffectation : \" + affiche);\n        affiche = affiche.toUpperCase();\n        System.out.println(\"Avec réaffectation : \" + affiche);\n\n        // [L18] Une cle absente d'un dictionnaire rend le vide : demander une\n        // valeur par defaut evite le plantage.\n        Map<String, Integer> vendus = new HashMap<>();\n        vendus.put(\"Fosse\", 180);\n        vendus.put(\"Parterre\", 96);\n        System.out.println(\"Balcon vendu : \" + vendus.getOrDefault(\"Balcon\", 0));\n        System.out.println(\"Fosse vendue : \" + vendus.getOrDefault(\"Fosse\", 0));\n\n        // [L16] Une exception se lit : son type, son message, sa ligne.\n        try {\n            int prix = Integer.parseInt(\"douze\");\n            System.out.println(\"inatteignable : \" + prix);\n        } catch (NumberFormatException e) {\n            System.out.println(\"Exception attrapée, message : \" + e.getMessage());\n        }\n\n        // [L13] Un objet bien eleve : attributs prives, etat toujours coherent.\n        Concert soiree = new Concert(\"Fanfare du Borinage\", 250, 18.0);\n        System.out.println(soiree.fiche());\n        System.out.println(\"Vente de 300 places : \" + soiree.vendre(300));\n        System.out.println(\"Vente de 200 places : \" + soiree.vendre(200));\n        System.out.println(\"Vente de 100 places : \" + soiree.vendre(100));\n        System.out.println(soiree.fiche());\n        System.out.println(\"Recette : \" + soiree.recette() + \" €\");\n\n        // [L6] Une boucle, [L4] un aiguillage, [L11] une recherche.\n        List<String> programme = new ArrayList<>();\n        programme.add(\"Fanfare du Borinage\");\n        programme.add(\"Chorale de Jodoigne\");\n        programme.add(\"Harmonie de Ciney\");\n        int trouve = -1;\n        for (int i = 0; i < programme.size(); i++) {\n            if (programme.get(i).equals(\"Harmonie de Ciney\")) {\n                trouve = i;\n            }\n        }\n        System.out.println(\"Position de l'Harmonie : \" + trouve);\n        System.out.println(\"Position d'un absent : \" + position(programme, \"Big band de Huy\"));\n\n        for (String c : categories) {\n            System.out.println(\"  \" + c + \" → \" + tarif(c) + \" €\");\n        }\n    }\n\n    // [L9] Une methode qui fabrique un texte a l'execution : le resultat n'est\n    // pas la meme instance que le litteral, meme s'il a le meme contenu.\n    static String lireFin() {\n        return \"con\";\n    }\n\n    static int position(List<String> liste, String cible) {\n        for (int i = 0; i < liste.size(); i++) {\n            if (liste.get(i).equals(cible)) {\n                return i;\n            }\n        }\n        return -1;\n    }\n\n    // [L4] Un aiguillage sur un texte : les comparaisons se font avec equals,\n    // jamais avec ==, et le dernier cas joue le role du defaut.\n    static double tarif(String categorie) {\n        if (categorie.equals(\"Fosse\")) {\n            return 15.0;\n        }\n        if (categorie.equals(\"Parterre\")) {\n            return 22.0;\n        }\n        if (categorie.equals(\"Balcon\")) {\n            return 28.0;\n        }\n        return 35.0;\n    }\n}\n\nclass Concert {\n    private final String intitule;\n    private final int capacite;\n    private final double prixPlace;\n    private int vendues;\n\n    Concert(String intitule, int capacite, double prixPlace) {\n        this.intitule = intitule;\n        this.capacite = capacite;\n        this.prixPlace = prixPlace;\n        this.vendues = 0;\n    }\n\n    // La regle metier vit dans l'objet : impossible de depasser la capacite.\n    String vendre(int nombre) {\n        if (nombre <= 0) {\n            return \"refusé (quantité absurde)\";\n        }\n        if (vendues + nombre > capacite) {\n            return \"refusé (il reste \" + (capacite - vendues) + \" places)\";\n        }\n        vendues = vendues + nombre;\n        return \"accepté (\" + vendues + \" vendues)\";\n    }\n\n    double recette() {\n        return vendues * prixPlace;\n    }\n\n    String fiche() {\n        return intitule + \" — \" + vendues + \"/\" + capacite + \" places\";\n    }\n}",

      "enonce": "Épreuve de synthèse sur la troisième semaine du cours. Un refuge accueille des hérissons et des écureuils, chacun avec un nom, un poids en grammes et une date d'arrivée. [L15] Déclare un contrat que tout pensionnaire doit tenir : savoir dire s'il peut être relâché. [L14] Écris une classe mère abstraite portant ce qui est commun — le nom, le poids, la date, la pesée, le nombre de jours de soins, la fiche — et laissant à chaque espèce le soin de se nommer ; puis les deux classes filles, un hérisson relâchable à partir de 500 g, un écureuil à partir de 300 g. [L16] La pesée refuse un poids négatif ou nul en levant une erreur porteuse d'un message. Peuple le refuge de Piquant (hérisson, 380 g, 12 mars 2026), Bogue (hérisson, 240 g, 2 mai), Noisette (écureuil, 310 g, 18 avril), Aiguille (hérisson, 520 g, 30 janvier) et Glandine (écureuil, 285 g, 9 juin). Le programme affiche les fiches, la liste des relâchables, [L18] le compte par espèce à l'aide d'un dictionnaire — en demandant aussi le nombre de loutres, qu'il n'y a pas — [L19] la date d'arrivée du doyen, ses jours de soins au 6 août 2026, sa sortie prévue trente jours après son arrivée et la preuve que sa date d'arrivée n'a pas bougé, [L16] une pesée refusée puis une pesée acceptée, [L23] une recherche qui aboutit et une qui échoue, et [L17] l'écriture puis la relecture d'un registre, avec le total des grammes relus.",
      "principe": "La troisième semaine du cours tient en une phrase : un contrat dit ce qu'on attend, une classe mère met en commun ce qui l'est vraiment, chaque fille apporte sa différence, et les erreurs voyagent par exceptions plutôt que par valeurs de retour douteuses. Tout le reste — collections, dates, fichiers — n'est que de l'outillage autour de ce noyau.",

      "reflexion": "Le seuil de relâche est écrit en dur dans chaque classe fille — 500 g pour le hérisson, 300 g pour l'écureuil. Trouve deux raisons de l'y laisser et deux raisons de l'en sortir, puis décide : où placerais-tu ces valeurs si le refuge accueillait quinze espèces et que les seuils changeaient chaque hiver ?",
      "remarque": "Le contrat de relâche est déclaré à part, alors que la classe mère aurait pu porter directement la méthode abstraite. Ici, la distinction ne sert à rien : seuls des pensionnaires tiennent ce contrat. Elle servirait le jour où un objet non pensionnaire — un lot en quarantaine, un nid transporté — devrait répondre à la même question. Une interface écrite trop tôt est du poids mort ; écrite trop tard, elle coûte une refonte.",
      "indices": [
        "Range les cinq pensionnaires dans un tableau à trois colonnes avant de coder : ce qu'ils ont en commun, ce qui diffère selon l'espèce, ce qui est propre à chaque individu. La première colonne devient la classe mère, la deuxième les méthodes que les filles redéfinissent, la troisième les attributs. Cet exercice de tri fait l'essentiel du travail.",
        "Le plan : le contrat ; la classe mère abstraite avec ses attributs privés, ses accesseurs, la pesée qui lève, le calcul de jours et la fiche ; les deux classes filles ; puis le programme principal, section par section dans l'ordre des repères de l'énoncé.",
        "Fais porter à la classe mère tout ce qui ne dépend pas de l'espèce, y compris la fiche — celle-ci appelle la méthode que les filles redéfinissent, et se trouve donc juste sans être écrite deux fois. C'est le cœur du polymorphisme : une méthode écrite une fois dans la mère, dont le comportement change selon la fille, sans aucun test de type.",
        "Le point dur est la date. Un objet date ne se modifie pas : la méthode qui ajoute trente jours ne touche à rien, elle rend une nouvelle date qu'il faut recueillir dans une variable. C'est exactement le piège du texte de la leçon 27, sur un autre type — et l'énoncé te demande de le prouver en réaffichant la date d'arrivée après le calcul. Pour le nombre de jours entre deux dates, souviens-toi de l'unité de temps de la leçon 19 : elle sait faire la différence entre deux dates.",
        "Ton fichier ressemble à ceci :<br><code>interface Relachable { boolean peutEtre…(); }</code><br><code>abstract class Pensionnaire implements Relachable {</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;abstract String espece();</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;void peser(int grammes) { if (grammes &lt;= 0) { throw new IllegalArgumentException(…); } }</code><br><code>class Herisson extends Pensionnaire { … super(nom, …, arrivee); }</code><br><code>public boolean peutEtreRelache() { return getPoidsGrammes() &gt;= …; }</code><br><code>parEspece.put(p.espece(), parEspece.getOrDefault(…, 0) + 1);</code><br><code>ChronoUnit.DAYS.between(arrivee, reference)</code> · <code>getArrivee().plusDays(30)</code><br><code>try (PrintWriter sortie = new PrintWriter(…)) { … }</code>"

      "solution": "// Le refuge pour herissons : la semaine 3 du cours en un seul programme —\n// heritage, interface, exception, dictionnaire, fichier, dates.\nimport java.io.IOException;\nimport java.io.PrintWriter;\nimport java.time.LocalDate;\nimport java.util.ArrayList;\nimport java.util.HashMap;\nimport java.util.List;\nimport java.util.Map;\nimport java.util.Optional;\nimport java.util.stream.Collectors;\n\npublic class Refuge {\n\n    public static void main(String[] args) {\n        List<Pensionnaire> pensionnaires = new ArrayList<>();\n        pensionnaires.add(new Herisson(\"Piquant\", 380, LocalDate.of(2026, 3, 12)));\n        pensionnaires.add(new Herisson(\"Bogue\", 240, LocalDate.of(2026, 5, 2)));\n        pensionnaires.add(new Ecureuil(\"Noisette\", 310, LocalDate.of(2026, 4, 18)));\n        pensionnaires.add(new Herisson(\"Aiguille\", 520, LocalDate.of(2026, 1, 30)));\n        pensionnaires.add(new Ecureuil(\"Glandine\", 285, LocalDate.of(2026, 6, 9)));\n\n        // [L14] Le polymorphisme : un seul appel, deux comportements.\n        System.out.println(\"--- Pensionnaires ---\");\n        for (Pensionnaire p : pensionnaires) {\n            System.out.println(\"  \" + p.fiche());\n        }\n\n        // [L15] L'interface : un contrat que deux espèces respectent chacune\n        // a sa maniere, sans rien partager d'autre.\n        System.out.println();\n        System.out.println(\"--- Relâchables ---\");\n        List<String> prets = pensionnaires.stream()\n                .filter(p -> p.peutEtreRelache())\n                .map(p -> p.getNom())\n                .collect(Collectors.toList());\n        System.out.println(\"  \" + prets);\n\n        // [L18] Le dictionnaire : compter par categorie sans tableau d'indices.\n        Map<String, Integer> parEspece = new HashMap<>();\n        for (Pensionnaire p : pensionnaires) {\n            parEspece.put(p.espece(), parEspece.getOrDefault(p.espece(), 0) + 1);\n        }\n        System.out.println();\n        System.out.println(\"Hérissons : \" + parEspece.getOrDefault(\"hérisson\", 0)\n                + \", écureuils : \" + parEspece.getOrDefault(\"écureuil\", 0)\n                + \", loutres : \" + parEspece.getOrDefault(\"loutre\", 0));\n\n        // [L19] Les dates : immuables, elles aussi.\n        LocalDate reference = LocalDate.of(2026, 8, 6);\n        Pensionnaire doyen = pensionnaires.get(3);\n        System.out.println(\"Arrivée du doyen : \" + doyen.getArrivee()\n                + \", soit \" + doyen.joursDepuis(reference) + \" jours de soins\");\n        LocalDate sortiePrevue = doyen.getArrivee().plusDays(30);\n        System.out.println(\"Sortie prévue : \" + sortiePrevue\n                + \" — l'arrivée a-t-elle bougé ? \" + doyen.getArrivee());\n\n        // [L16] L'exception : levee par la regle metier, attrapee par l'appelant.\n        System.out.println();\n        try {\n            doyen.peser(-40);\n            System.out.println(\"inatteignable\");\n        } catch (IllegalArgumentException e) {\n            System.out.println(\"Pesée refusée : \" + e.getMessage());\n        }\n        doyen.peser(545);\n        System.out.println(\"Nouveau poids du doyen : \" + doyen.getPoidsGrammes() + \" g\");\n\n        // [L23] La recherche qui peut ne rien trouver.\n        Optional<Pensionnaire> cherche = pensionnaires.stream()\n                .filter(p -> p.getNom().equals(\"Noisette\"))\n                .findFirst();\n        System.out.println(\"Recherche « Noisette » : \"\n                + cherche.map(p -> p.fiche()).orElse(\"inconnu au refuge\"));\n        Optional<Pensionnaire> absent = pensionnaires.stream()\n                .filter(p -> p.getNom().equals(\"Ronce\"))\n                .findFirst();\n        System.out.println(\"Recherche « Ronce » : \"\n                + absent.map(p -> p.fiche()).orElse(\"inconnu au refuge\"));\n\n        // [L17] Le fichier : ecrire, puis relire ce qu'on a ecrit.\n        String fichier = \"refuge.csv\";\n        try (PrintWriter sortie = new PrintWriter(fichier)) {\n            for (Pensionnaire p : pensionnaires) {\n                sortie.println(p.espece() + \";\" + p.getNom() + \";\" + p.getPoidsGrammes());\n            }\n            System.out.println();\n            System.out.println(\"Registre écrit : \" + pensionnaires.size() + \" lignes\");\n        } catch (IOException e) {\n            System.out.println(\"Écriture impossible : \" + e.getMessage());\n        }\n\n        int relus = 0;\n        int grammes = 0;\n        try (java.util.Scanner lecture = new java.util.Scanner(new java.io.File(fichier))) {\n            while (lecture.hasNextLine()) {\n                String[] champs = lecture.nextLine().split(\";\");\n                if (champs.length == 3 && champs[2].matches(\"\\\\d+\")) {\n                    relus = relus + 1;\n                    grammes = grammes + Integer.parseInt(champs[2]);\n                }\n            }\n        } catch (IOException e) {\n            System.out.println(\"Lecture impossible : \" + e.getMessage());\n        }\n        System.out.println(\"Registre relu : \" + relus + \" lignes, \" + grammes + \" g au total\");\n    }\n}\n\n// [L15] Le contrat : tout pensionnaire sait dire s'il peut repartir.\ninterface Relachable {\n    boolean peutEtreRelache();\n}\n\n// [L14] La classe mere : ce que tous les pensionnaires ont en commun.\nabstract class Pensionnaire implements Relachable {\n    private final String nom;\n    private int poidsGrammes;\n    private final LocalDate arrivee;\n\n    Pensionnaire(String nom, int poidsGrammes, LocalDate arrivee) {\n        this.nom = nom;\n        this.poidsGrammes = poidsGrammes;\n        this.arrivee = arrivee;\n    }\n\n    String getNom() {\n        return nom;\n    }\n\n    int getPoidsGrammes() {\n        return poidsGrammes;\n    }\n\n    LocalDate getArrivee() {\n        return arrivee;\n    }\n\n    void peser(int grammes) {\n        if (grammes <= 0) {\n            throw new IllegalArgumentException(\"poids impossible : \" + grammes + \" g\");\n        }\n        poidsGrammes = grammes;\n    }\n\n    long joursDepuis(LocalDate reference) {\n        return java.time.temporal.ChronoUnit.DAYS.between(arrivee, reference);\n    }\n\n    // Chaque espece repondra a sa facon.\n    abstract String espece();\n\n    String fiche() {\n        return nom + \" (\" + espece() + \", \" + poidsGrammes + \" g, arrivé le \" + arrivee + \")\";\n    }\n}\n\nclass Herisson extends Pensionnaire {\n    Herisson(String nom, int poidsGrammes, LocalDate arrivee) {\n        super(nom, poidsGrammes, arrivee);\n    }\n\n    String espece() {\n        return \"hérisson\";\n    }\n\n    // Un herisson passe l'hiver s'il depasse 500 g.\n    public boolean peutEtreRelache() {\n        return getPoidsGrammes() >= 500;\n    }\n}\n\nclass Ecureuil extends Pensionnaire {\n    Ecureuil(String nom, int poidsGrammes, LocalDate arrivee) {\n        super(nom, poidsGrammes, arrivee);\n    }\n\n    String espece() {\n        return \"écureuil\";\n    }\n\n    // Un ecureuil roux adulte pese environ 300 g.\n    public boolean peutEtreRelache() {\n        return getPoidsGrammes() >= 300;\n    }\n}",

      "hier": "lecon30.html",
      "enonce": "Épreuve finale. Reprends le cœur du registre d'hier — la liste fermée des espèces, la fiche du relevé, le motif du code de poste, la conversion d'un texte en espèce et la saisie contrôlée à trois refus nommés — et ajoute-lui <strong>trois fonctions</strong>, chacune exerçant une leçon différente. [L18] Le total par poste, indexé par un dictionnaire et non par une position, parce que les postes ne sont pas numérotés. [L25] Le poste le plus actif, désigné par un juge composé — effectif décroissant, puis ordre alphabétique. [L27] Une ligne d'alerte, composée sur un tampon et rendue, qui énumère les espèces passant sous un seuil donné, ou annonce qu'il n'y en a aucune. Alimente le registre de six saisies dont une fautive : CRE-01 milan 12, ROS-02 buse 9, CRE-01 faucon 7, FAL-03 milan 5, ROS-02 milan 11, TOU-04 cigogne 3. Affiche le total par espèce, le total par poste trié, le poste le plus actif, puis l'alerte au seuil de 10 et au seuil de 1. Termine par un banc d'essai de treize vérifications : les quatre messages de saisie, le compte de relevés retenus, le poste le plus actif d'un registre à une ligne, les deux alertes, et quatre contrôles de non-régression sur les chiffres et la conversion.",
      "principe": "Une épreuve finale ne demande pas d'écrire davantage, mais d'ajouter sans casser. Les trois fonctions nouvelles se greffent sur un code inchangé, et c'est le banc d'essai — et lui seul — qui autorise à le dire. Sans lui, « je n'ai rien cassé » est une opinion.",

        "Commence par recopier le noyau d'hier sans y toucher, et exécute-le pour vérifier qu'il fonctionne encore isolé. Ce n'est pas une précaution excessive : la moitié des régressions naissent d'une reprise inexacte, avant même le premier ajout. Une fois le noyau vert, les trois fonctions se traitent séparément, l'une après l'autre.",

      ],
      "solution": "// L'observatoire ornithologique - jour 3 sur 3 : l'epreuve.\n// Le programme d'hier reprend du service et recoit trois ajouts, chacun\n// exercant une lecon differente. Le banc d'essai prouve que rien n'a bouge.\nimport java.util.ArrayList;\nimport java.util.Comparator;\nimport java.util.List;\nimport java.util.Optional;\nimport java.util.stream.Collectors;\n\npublic class Epreuve {\n\n    enum Espece { MILAN, BUSE, FAUCON, EPERVIER }\n\n    record Releve(String poste, Espece espece, int effectif) { }\n\n    static final String CODE_POSTE = \"[A-Z]{3}-\\\\d{2}\";\n    static final Espece[] ESPECES = {Espece.MILAN, Espece.BUSE, Espece.FAUCON, Espece.EPERVIER};\n\n    static final List<Releve> REGISTRE = new ArrayList<>();\n\n    static Optional<Espece> especeDe(String texte) {\n        for (Espece e : ESPECES) {\n            if (e.name().equals(texte)) {\n                return Optional.of(e);\n            }\n        }\n        return Optional.empty();\n    }\n\n    static String saisir(List<Releve> registre, String poste, String espece, String effectif) {\n        if (!poste.matches(CODE_POSTE)) {\n            return \"Poste mal formé : « \" + poste + \" »\";\n        }\n        Optional<Espece> e = especeDe(espece);\n        if (!e.isPresent()) {\n            return \"Espèce inconnue : « \" + espece + \" »\";\n        }\n        if (!effectif.matches(\"\\\\d{1,3}\")) {\n            return \"Effectif illisible : « \" + effectif + \" »\";\n        }\n        registre.add(new Releve(poste, e.get(), Integer.parseInt(effectif)));\n        return \"Relevé enregistré : \" + poste + \" · \" + espece + \" · \" + effectif;\n    }\n\n    static int[] totaux(List<Releve> registre) {\n        int[] cases = new int[ESPECES.length];\n        for (Releve r : registre) {\n            cases[r.espece().ordinal()] = cases[r.espece().ordinal()] + r.effectif();\n        }\n        return cases;\n    }\n\n    // AJOUT 1 [L18] — le total par poste, indexe par un dictionnaire plutot\n    // que par une position, parce que les postes ne sont pas numerotes.\n    static java.util.Map<String, Integer> totauxParPoste(List<Releve> registre) {\n        java.util.Map<String, Integer> parPoste = new java.util.HashMap<>();\n        for (Releve r : registre) {\n            parPoste.put(r.poste(), parPoste.getOrDefault(r.poste(), 0) + r.effectif());\n        }\n        return parPoste;\n    }\n\n    // AJOUT 2 [L25] — le poste le plus actif, avec depart alphabetique.\n    static Optional<String> posteLePlusActif(List<Releve> registre) {\n        java.util.Map<String, Integer> parPoste = totauxParPoste(registre);\n        return parPoste.keySet().stream()\n                .sorted(Comparator.comparingInt((String p) -> parPoste.get(p)).reversed()\n                        .thenComparing(p -> p))\n                .findFirst();\n    }\n\n    // AJOUT 3 [L27] — la ligne d'alerte, composee et RENDUE.\n    static String alerte(List<Releve> registre, int seuil) {\n        List<String> rares = new ArrayList<>();\n        int[] t = totaux(registre);\n        for (int i = 0; i < ESPECES.length; i++) {\n            if (t[i] < seuil) {\n                rares.add(ESPECES[i].name());\n            }\n        }\n        if (rares.isEmpty()) {\n            return \"Aucune espèce sous le seuil de \" + seuil;\n        }\n        StringBuilder a = new StringBuilder();\n        a.append(\"Sous le seuil de \").append(seuil).append(\" : \");\n        for (int i = 0; i < rares.size(); i++) {\n            a.append(rares.get(i));\n            if (i < rares.size() - 1) {\n                a.append(\", \");\n            }\n        }\n        return a.toString();\n    }\n\n    static int reussis = 0;\n    static int echoues = 0;\n\n    static void verifier(Object attendu, Object obtenu, String nom) {\n        if (attendu.equals(obtenu)) {\n            reussis = reussis + 1;\n            System.out.println(\"  ✓ \" + nom);\n        } else {\n            echoues = echoues + 1;\n            System.out.println(\"  ✗ \" + nom + \" — attendu « \" + attendu + \" », obtenu « \"\n                    + obtenu + \" »\");\n        }\n    }\n\n    public static void main(String[] args) {\n        System.out.println(saisir(REGISTRE, \"CRE-01\", \"MILAN\", \"12\"));\n        System.out.println(saisir(REGISTRE, \"ROS-02\", \"BUSE\", \"9\"));\n        System.out.println(saisir(REGISTRE, \"CRE-01\", \"FAUCON\", \"7\"));\n        System.out.println(saisir(REGISTRE, \"FAL-03\", \"MILAN\", \"5\"));\n        System.out.println(saisir(REGISTRE, \"ROS-02\", \"MILAN\", \"11\"));\n        System.out.println(saisir(REGISTRE, \"TOU-04\", \"CIGOGNE\", \"3\"));\n\n        System.out.println();\n        System.out.println(\"--- Par espèce ---\");\n        int[] t = totaux(REGISTRE);\n        for (int i = 0; i < ESPECES.length; i++) {\n            System.out.println(\"  \" + ESPECES[i].name() + \" : \" + t[i]);\n        }\n\n        System.out.println();\n        System.out.println(\"--- Par poste ---\");\n        java.util.Map<String, Integer> parPoste = totauxParPoste(REGISTRE);\n        List<String> postes = new ArrayList<>(parPoste.keySet());\n        java.util.Collections.sort(postes);\n        for (String p : postes) {\n            System.out.println(\"  \" + p + \" : \" + parPoste.get(p));\n        }\n        System.out.println(\"Poste le plus actif : \"\n                + posteLePlusActif(REGISTRE).orElse(\"aucun relevé\"));\n        System.out.println(alerte(REGISTRE, 10));\n        System.out.println(alerte(REGISTRE, 1));\n\n        System.out.println();\n        System.out.println(\"--- Banc d'essai ---\");\n        List<Releve> bac = new ArrayList<>();\n        verifier(\"Relevé enregistré : CRE-01 · MILAN · 12\",\n                saisir(bac, \"CRE-01\", \"MILAN\", \"12\"), \"une saisie valide est enregistrée\");\n        verifier(\"Poste mal formé : « cre-01 »\",\n                saisir(bac, \"cre-01\", \"MILAN\", \"12\"), \"un poste minuscule est refusé\");\n        verifier(\"Espèce inconnue : « CIGOGNE »\",\n                saisir(bac, \"CRE-01\", \"CIGOGNE\", \"12\"), \"une espèce hors liste est refusée\");\n        verifier(\"Effectif illisible : « 1234 »\",\n                saisir(bac, \"CRE-01\", \"MILAN\", \"1234\"), \"un effectif à quatre chiffres est refusé\");\n        verifier(1, bac.size(), \"un seul relevé sur quatre a été retenu\");\n        verifier(\"CRE-01\", posteLePlusActif(bac).orElse(\"aucun\"),\n                \"le poste le plus actif d'un registre à une ligne est celui-là\");\n        verifier(\"Sous le seuil de 1 : BUSE, FAUCON, EPERVIER\", alerte(bac, 1),\n                \"sur un registre d'une ligne, les trois autres espèces sont sous tout seuil\");\n        verifier(\"Sous le seuil de 1 : EPERVIER\", alerte(REGISTRE, 1),\n                \"sur le registre complet, seul l'épervier reste à zéro\");\n\n        // Non-regression : les chiffres attendus n'ont pas bouge.\n        verifier(28, totaux(REGISTRE)[0], \"les milans totalisent toujours 28 individus\");\n        verifier(44, totaux(REGISTRE)[0] + totaux(REGISTRE)[1] + totaux(REGISTRE)[2]\n                + totaux(REGISTRE)[3], \"le registre pèse toujours 44 individus\");\n        verifier(5, REGISTRE.size(), \"cinq relevés sur six ont été retenus\");\n        verifier(true, especeDe(\"EPERVIER\").isPresent(), \"les quatre espèces sont reconnues\");\n        verifier(false, especeDe(\"Milan\").isPresent(), \"la conversion est sensible à la casse\");\n\n        System.out.println(\"  Banc : \" + reussis + \" réussi(s), \" + echoues + \" échoué(s)\");\n    }\n}",
      "pourquoi": "Le banc d'essai s'exerce sur un registre neuf pour les messages de saisie, et sur le registre réel pour les chiffres de non-régression. Ce sont deux usages différents du même outil : le premier éprouve un comportement en isolant tout le reste, le second constate qu'un résultat connu n'a pas changé. Les confondre — vérifier le comportement sur des données réelles — donne des tests qui échouent dès que les données bougent, et qu'on finit par désactiver.",
      "tests": [
        {

        },

          "label": "[L18] Les totaux par espèce et par poste sont exacts"
        },

          "label": "[L25] Le juge composé désigne le bon poste"
        },
        {
          "code": "assert 'Sous le seuil de 10 : BUSE, FAUCON, EPERVIER' in __output__ and 'Sous le seuil de 1 : EPERVIER' in __output__",

        },

          "label": "Les treize vérifications passent, non-régression comprise"

      "checklist": [
