var DAY = {
  num: 29,
  title: "Threads et concurrence",
  subtitle: "Faire plusieurs choses en même temps : plusieurs employés qui travaillent en parallèle, et les précautions à prendre.",
  theory: `
<h3>1. L'idée : plusieurs tâches en parallèle</h3>
<p>Jusqu'ici, ton programme faisait UNE chose à la fois, ligne après ligne : un seul employé dans la <strong>ludothèque</strong>. Un <strong>thread</strong> (« fil d'exécution ») est un employé supplémentaire qui travaille EN MÊME TEMPS. Avec plusieurs threads, on peut par exemple ranger un rayon pendant qu'un autre encaisse les clients.</p>
<div class="tip">Un <strong>thread</strong> est un fil d'exécution indépendant à l'intérieur du même programme. « Concurrence » veut dire « plusieurs tâches qui progressent en parallèle ». Comme plusieurs caissiers ouverts en même temps dans le magasin.</div>

<h3>2. Créer un thread avec une lambda</h3>
<p>La façon moderne : on donne au thread une tâche sous forme de lambda (un <code>Runnable</code>, leçon 21), puis on le démarre avec <code>start()</code>.</p>
<pre class="pseudo">Thread t = new Thread(() -&gt; {                 // on crée un fil avec la tâche à exécuter
    System.out.println("Je range le rayon");  // le travail de ce thread
});
t.start();                                    // DÉMARRE le thread : il part travailler en parallèle
System.out.println("Pendant ce temps, j'encaisse"); // le thread principal continue SANS attendre</pre>
<div class="warn">Ne confonds pas <code>start()</code> et <code>run()</code> ! <code>start()</code> lance un VRAI nouveau thread parallèle. <code>run()</code> exécute la tâche… dans le thread actuel, sans parallélisme : erreur fréquente des débutants.</div>

<h3>3. Attendre la fin : join()</h3>
<p>Le thread principal ne s'arrête pas pour attendre les autres. Si tu as besoin du résultat d'un thread, tu l'attends explicitement avec <code>join()</code> (« rejoindre »).</p>
<pre class="pseudo">Thread t = new Thread(() -&gt; longCalcul());   // un thread qui fait un long travail
t.start();                                   // on le lance
t.join();                                    // on ATTEND qu'il ait fini avant de continuer
System.out.println("Le calcul est terminé"); // ne s'affiche qu'après la fin du thread</pre>

<h3>4. L'ordre n'est PAS garanti</h3>
<p>Plusieurs threads avancent à leur rythme : l'ordre d'affichage varie d'une exécution à l'autre. C'est comme plusieurs caissiers : impossible de prédire lequel finira son client en premier.</p>
<pre class="pseudo">// Lancer 3 threads qui affichent leur numéro peut produire :
// « 2 1 3 » une fois, « 1 3 2 » une autre fois... l'ordre est IMPRÉVISIBLE</pre>

<h3>5. Le danger : la donnée partagée (race condition)</h3>
<p>Le vrai piège survient quand plusieurs threads modifient la MÊME donnée en même temps. Deux caissiers qui ajoutent à la même caisse au même instant peuvent s'écraser mutuellement : le total devient faux. On appelle cela une <strong>race condition</strong> (« situation de compétition »).</p>
<pre class="pseudo">int compteur = 0;                        // donnée partagée
// Deux threads font tous les deux : compteur = compteur + 1
// « lire, ajouter, réécrire » n'est PAS instantané : les deux peuvent lire 0
// puis écrire 1 chacun -> on perd une incrémentation. Le résultat final est FAUX.</pre>

<h3>6. La protection : synchronized et les verrous</h3>
<p>Pour éviter ce chaos, on met un <strong>verrou</strong> : une seule personne à la fois entre dans la « zone sensible ». Le mot-clé <code>synchronized</code> garantit qu'un seul thread exécute le bloc à la fois — les autres attendent leur tour.</p>
<pre class="pseudo">synchronized (verrou) {                  // un seul thread à la fois dans ce bloc
    compteur = compteur + 1;             // opération protégée : plus de collision
}                                        // en sortant, le verrou se libère pour le suivant</pre>
<div class="tip">Alternative plus simple pour un compteur : <code>AtomicInteger</code>, un entier dont l'incrémentation est « atomique » (insécable). <code>compteur.incrementAndGet()</code> est sûr sans verrou explicite.</div>

<h3>7. À utiliser avec discernement</h3>
<p>Le parallélisme accélère les tâches indépendantes (télécharger, calculer en fond) mais complexifie le code : ordre imprévisible, données partagées à protéger. La règle d'or : garde les données NON partagées quand tu peux (rappelle-toi l'immutabilité, leçon 27 : un objet immuable se partage sans danger). Ne synchronise que le strict nécessaire.</p>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'un thread ?", opts: ["Un processus séparé du programme", "Un fil d'exécution indépendant qui travaille en parallèle", "Une file d'attente de tâches", "Une variable"], a: 1, exp: "Un « employé » supplémentaire dans le même programme." },
    { type: "qcm", q: "Que signifie « concurrence » ici ?", opts: ["Une compétition commerciale", "Plusieurs tâches qui progressent en parallèle", "Un blocage du programme", "Une file d'attente"], a: 1, exp: "Plusieurs fils d'exécution avancent ensemble." },
    { type: "qcm", q: "Comment DÉMARRE-t-on un thread ?", opts: ["t.run()", "t.start()", "t.go()", "t.launch()"], a: 1, exp: "start() lance un vrai thread parallèle." },
    { type: "qcm", q: "Quelle est l'erreur d'appeler <code>t.run()</code> au lieu de <code>t.start()</code> ?", opts: ["run() crée deux threads à la fois", "run() exécute la tâche dans le thread ACTUEL, sans parallélisme", "run() plante toujours", "run() est plus rapide"], a: 1, exp: "Seul start() crée un nouveau fil d'exécution." },

    { type: "vf", q: "L'ordre d'exécution de plusieurs threads est garanti et toujours le même.", a: false, exp: "Faux : l'ordre est imprévisible, il varie d'une exécution à l'autre." },
    { type: "qcm", q: "Une tâche donnée à un thread prend souvent la forme…", opts: ["d'un int", "d'une lambda (un Runnable)", "d'une String", "d'un tableau"], a: 1, exp: "Le Runnable décrit QUOI faire, via une lambda." },
    { type: "qcm", q: "Qu'est-ce qu'une « race condition » ?", opts: ["Une course de vitesse", "Plusieurs threads modifient la MÊME donnée en même temps, produisant un résultat faux", "Un thread trop lent", "Une boucle infinie"], a: 1, exp: "La compétition sur une donnée partagée corrompt le résultat." },
    { type: "qcm", q: "Pourquoi <code>compteur = compteur + 1</code> est-il risqué en parallèle ?", opts: ["Il est trop lent", "« lire, ajouter, réécrire » n'est pas instantané : deux threads peuvent s'écraser", "Il utilise trop de mémoire", "Il ne compile pas"], a: 1, exp: "L'opération n'est pas atomique : incréments perdus." },
    { type: "qcm", q: "À quoi sert <code>synchronized</code> ?", opts: ["À accélérer le code", "À garantir qu'un SEUL thread à la fois exécute un bloc (un verrou)", "À créer un thread", "À arrêter tous les threads"], a: 1, exp: "Il protège la zone sensible avec un verrou." },
    { type: "vf", q: "Un bloc <code>synchronized</code> laisse entrer un seul thread à la fois ; les autres attendent.", a: true, exp: "Le verrou sérialise l'accès à la zone protégée." },
    { type: "qcm", q: "Quelle classe offre un entier à incrémentation « atomique » (sûre) ?", opts: ["BigInteger", "AtomicInteger (incrementAndGet)", "Integer", "ConcurrentInteger"], a: 1, exp: "AtomicInteger rend l'incrément insécable, sans verrou explicite." },
    { type: "vf", q: "Un objet IMMUABLE (leçon 27) peut être partagé entre threads sans danger.", a: true, exp: "Rien ne peut le modifier : pas de race condition possible." },
    { type: "qcm", q: "Quelle est la règle d'or de la concurrence ?", opts: ["Tout synchroniser", "Éviter les données partagées quand on peut, ne synchroniser que le nécessaire", "Ne jamais utiliser de thread", "Toujours utiliser run()"], a: 1, exp: "Moins de partage = moins de bugs ; synchroniser au minimum." },
    { type: "qcm", q: "Quand le parallélisme est-il le plus utile ?", opts: ["Pour du code trivial", "Pour des tâches indépendantes (télécharger, calculer en fond)", "Pour trier une petite liste", "Pour lire une seule variable"], a: 1, exp: "Il accélère les travaux indépendants exécutables en même temps." }
  ],
  final: {
    title: "Exercice final — Deux threads et un compteur partagé",
    intro: `<p>Deux threads incrémentent chacun un compteur 1000 fois. Sans protection, le total est imprévisible :</p>
<pre class="pseudo">int[] compteur = {0};                              // donnée PARTAGÉE (dans un tableau pour la modifier)
Runnable tache = () -&gt; {                            // la tâche commune aux deux threads
    for (int i = 0; i &lt; 1000; i++) {               // 1000 incréments
        compteur[0]++;                             // (1) lecture + ajout + écriture : NON atomique
    }
};
Thread a = new Thread(tache);                      // thread A
Thread b = new Thread(tache);                      // thread B
a.start(); b.start();                              // (2) on les lance en parallèle
a.join(); b.join();                                // (3) on attend leur fin
System.out.println(compteur[0]);                   // (4) total : idéalement 2000, mais...</pre>`,
    questions: [
      { type: "qcm", q: "(1) Pourquoi <code>compteur[0]++</code> est-il risqué ici ?", opts: ["Il est trop lent", "L'opération n'est pas atomique : les deux threads peuvent s'écraser (race condition)", "Il ne compile pas", "Il utilise trop de mémoire"], a: 1, exp: "Lire-ajouter-écrire peut s'entrelacer et perdre des incréments." },
      { type: "qcm", q: "(2) Que fait <code>a.start(); b.start();</code> ?", opts: ["Exécute A puis B l'un après l'autre", "Lance A et B en parallèle (ordre imprévisible)", "Attend A", "Crée deux compteurs"], a: 1, exp: "start() démarre les deux fils simultanément." },
      { type: "qcm", q: "(3) Pourquoi les <code>join()</code> ?", opts: ["Pour démarrer les threads", "Pour attendre que A et B aient fini avant d'afficher le total", "Pour arrêter les threads", "Pour relancer les threads"], a: 1, exp: "Sans join, on afficherait le compteur avant la fin des threads." },
      { type: "qcm", q: "(4) Que peut valoir <code>compteur[0]</code> sans protection ?", opts: ["Toujours 2000", "Souvent MOINS de 2000 (incréments perdus par la race condition)", "Toujours 0", "Toujours 1000"], a: 1, exp: "Des incréments se perdent : le total est souvent inférieur à 2000." },
      { type: "vf", q: "Protéger l'incrément avec <code>synchronized</code> ou un <code>AtomicInteger</code> garantirait 2000.", a: true, exp: "Un verrou ou l'atomicité empêche les collisions : le total redevient fiable." }
    ],
    solution: `<pre class="pseudo">Sans protection :
  compteur[0]++ = lire, +1, réécrire  -> non atomique
  A et B s'entrelacent -> incréments perdus -> total < 2000 (imprévisible)
Avec protection :
  synchronized(verrou) { compteur[0]++; }   // un seul thread à la fois
  // OU AtomicInteger : c.incrementAndGet();  // incrément atomique
  -> total = 2000 garanti
join() : indispensable pour attendre A et B avant de lire le total.</pre>
<p>Le parallélisme accélère, mais toute donnée partagée doit être protégée. Souviens-toi : le plus sûr reste de ne rien partager de mutable. Tu as terminé les leçons d'approfondissement : direction le projet guidé et l'examen !</p>`
  }
};
