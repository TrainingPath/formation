  title: "Threads et concurrence",
  subtitle: "Faire plusieurs choses en même temps : plusieurs employés qui travaillent en parallèle, et les précautions à prendre.",
  theory: `
<h3>1. L'idée : plusieurs tâches en parallèle</h3>
<p>Jusqu'ici, ton programme faisait UNE chose à la fois, ligne après ligne : un seul employé dans la <strong>ludothèque</strong>. Un <strong>thread</strong> (« fil d'exécution ») est un employé supplémentaire qui travaille EN MÊME TEMPS. Avec plusieurs threads, on peut par exemple ranger un rayon pendant qu'un autre encaisse les clients.</p>
<div class="tip">Un <strong>thread</strong> est un fil d'exécution indépendant à l'intérieur du même programme. « Concurrence » veut dire « plusieurs tâches qui progressent en parallèle ». Comme plusieurs caissiers ouverts en même temps dans le magasin.</div>

<h3>2. Créer un thread avec une lambda</h3>
<p>La façon moderne : on donne au thread une tâche sous forme de lambda (un <code>Runnable</code>, leçon 21), puis on le démarre avec <code>start()</code>.</p>
<pre class="pseudo">Thread t = new Thread(() -&gt; {                 // on crée un fil avec la tâche à exécuter
    System.out.println("Je range le rayon");  // le travail de ce thread
});
t.start();                                    // DÉMARRE le thread : il part travailler en parallèle
System.out.println("Pendant ce temps, j'encaisse"); // le thread principal continue SANS attendre</pre>
<div class="warn">Ne confonds pas <code>start()</code> et <code>run()</code> ! <code>start()</code> lance un VRAI nouveau thread parallèle. <code>run()</code> exécute la tâche… dans le thread actuel, sans parallélisme : erreur fréquente des débutants.</div>

<h3>3. Attendre la fin : join()</h3>
<p>Le thread principal ne s'arrête pas pour attendre les autres. Si tu as besoin du résultat d'un thread, tu l'attends explicitement avec <code>join()</code> (« rejoindre »).</p>
<pre class="pseudo">Thread t = new Thread(() -&gt; longCalcul());   // un thread qui fait un long travail
t.start();                                   // on le lance
t.join();                                    // on ATTEND qu'il ait fini avant de continuer
System.out.println("Le calcul est terminé"); // ne s'affiche qu'après la fin du thread</pre>

<h3>4. L'ordre n'est PAS garanti</h3>
<p>Plusieurs threads avancent à leur rythme : l'ordre d'affichage varie d'une exécution à l'autre. C'est comme plusieurs caissiers : impossible de prédire lequel finira son client en premier.</p>
<pre class="pseudo">// Lancer 3 threads qui affichent leur numéro peut produire :
// « 2 1 3 » une fois, « 1 3 2 » une autre fois... l'ordre est IMPRÉVISIBLE</pre>

<h3>5. Le danger : la donnée partagée (race condition)</h3>
<p>Le vrai piège survient quand plusieurs threads modifient la MÊME donnée en même temps. Deux caissiers qui ajoutent à la même caisse au même instant peuvent s'écraser mutuellement : le total devient faux. On appelle cela une <strong>race condition</strong> (« situation de compétition »).</p>
<pre class="pseudo">int compteur = 0;                        // donnée partagée
// Deux threads font tous les deux : compteur = compteur + 1
// « lire, ajouter, réécrire » n'est PAS instantané : les deux peuvent lire 0
// puis écrire 1 chacun -> on perd une incrémentation. Le résultat final est FAUX.</pre>

<h3>6. La protection : synchronized et les verrous</h3>
<p>Pour éviter ce chaos, on met un <strong>verrou</strong> : une seule personne à la fois entre dans la « zone sensible ». Le mot-clé <code>synchronized</code> garantit qu'un seul thread exécute le bloc à la fois — les autres attendent leur tour.</p>
<pre class="pseudo">synchronized (verrou) {                  // un seul thread à la fois dans ce bloc
    compteur = compteur + 1;             // opération protégée : plus de collision
}                                        // en sortant, le verrou se libère pour le suivant</pre>
<div class="tip">Alternative plus simple pour un compteur : <code>AtomicInteger</code>, un entier dont l'incrémentation est « atomique » (insécable). <code>compteur.incrementAndGet()</code> est sûr sans verrou explicite.</div>

<h3>7. À utiliser avec discernement</h3>
<p>Le parallélisme accélère les tâches indépendantes (télécharger, calculer en fond) mais complexifie le code : ordre imprévisible, données partagées à protéger. La règle d'or : garde les données NON partagées quand tu peux (rappelle-toi l'immutabilité, leçon 27 : un objet immuable se partage sans danger). Ne synchronise que le strict nécessaire.</p>`,

<pre class="pseudo">int[] compteur = {0};                              // donnée PARTAGÉE (dans un tableau pour la modifier)
Runnable tache = () -&gt; {                            // la tâche commune aux deux threads
    for (int i = 0; i &lt; 1000; i++) {               // 1000 incréments

};
Thread a = new Thread(tache);                      // thread A
Thread b = new Thread(tache);                      // thread B
a.start(); b.start();                              // (2) on les lance en parallèle
a.join(); b.join();                                // (3) on attend leur fin

      { type: "vf", q: "Protéger l'incrément avec <code>synchronized</code> ou un <code>AtomicInteger</code> garantirait 2000.", a: true, exp: "Un verrou ou l'atomicité empêche les collisions : le total redevient fiable." }

  compteur[0]++ = lire, +1, réécrire  -> non atomique
  A et B s'entrelacent -> incréments perdus -> total < 2000 (imprévisible)
Avec protection :
  synchronized(verrou) { compteur[0]++; }   // un seul thread à la fois

join() : indispensable pour attendre A et B avant de lire le total.</pre>
<p>Le parallélisme accélère, mais toute donnée partagée doit être protégée. Souviens-toi : le plus sûr reste de ne rien partager de mutable. Tu as terminé les leçons d'approfondissement : direction le projet guidé et l'examen !</p>`

      "solution": "// La blanchisserie : quatre machines qui tournent en meme temps.\n// Tout ce que ce programme affiche est reproductible : chaque fil ecrit dans\n// SA case, et le fil principal n'affiche qu'apres les avoir tous rejoints.\nimport java.util.concurrent.atomic.AtomicInteger;\n\npublic class Blanchisserie {\n\n    // Une donnee partagee sans protection : le compteur des debutants.\n    static int sansProtection = 0;\n    // La meme, protegee par un verrou.\n    static int avecVerrou = 0;\n    static final Object VERROU = new Object();\n    // La meme encore, confiee a un entier insecable.\n    static final AtomicInteger insecable = new AtomicInteger(0);\n\n    public static void main(String[] args) throws InterruptedException {\n        // Un fil, une tache, et l'attente explicite de sa fin.\n        String[] echo = new String[1];\n        Thread machine = new Thread(() -> echo[0] = \"cycle terminé\");\n        machine.start();\n        machine.join();\n        System.out.println(\"Après start puis join : \" + echo[0]);\n\n        // La meme tache lancee par run() : elle s'execute dans le fil courant,\n        // donc elle est finie a la ligne suivante — mais rien ne tourne en parallele.\n        String[] echoBis = new String[1];\n        Thread fausseMachine = new Thread(() -> echoBis[0] = \"cycle terminé\");\n        fausseMachine.run();\n        System.out.println(\"Après run seul : \" + echoBis[0]);\n\n        // Quatre machines, quatre charges, quatre cases : aucune donnee partagee.\n        int[] charges = {12, 7, 15, 9};\n        int[] minutes = new int[4];\n        Thread[] fils = new Thread[4];\n        for (int i = 0; i < 4; i++) {\n            final int poste = i;\n            fils[i] = new Thread(() -> minutes[poste] = 30 + charges[poste] * 3);\n            fils[i].start();\n        }\n        for (Thread f : fils) {\n            f.join();\n        }\n        System.out.println();\n        int total = 0;\n        for (int i = 0; i < 4; i++) {\n            System.out.println(\"  Machine \" + (i + 1) + \" : \" + charges[i] + \" kg → \"\n                    + minutes[i] + \" min\");\n            total = total + minutes[i];\n        }\n        System.out.println(\"Minutes machine cumulées : \" + total);\n\n        // Trois compteurs, quatre fils, vingt-cinq mille tours chacun.\n        Thread[] compteurs = new Thread[4];\n        for (int i = 0; i < 4; i++) {\n            compteurs[i] = new Thread(() -> {\n                for (int k = 0; k < 25000; k++) {\n                    sansProtection = sansProtection + 1;\n                    synchronized (VERROU) {\n                        avecVerrou = avecVerrou + 1;\n                    }\n                    insecable.incrementAndGet();\n                }\n            });\n            compteurs[i].start();\n        }\n        for (Thread c : compteurs) {\n            c.join();\n        }\n        System.out.println();\n        System.out.println(\"Attendu pour les trois : 100000\");\n        System.out.println(\"Avec verrou       : \" + avecVerrou);\n        System.out.println(\"Entier insécable  : \" + insecable.get());\n        System.out.println(\"Sans protection   : \" + sansProtection\n                + \" (perdus : \" + (100000 - sansProtection) + \")\");\n        System.out.println(\"Le compteur non protégé est-il fiable ? \"\n                + (sansProtection == 100000 ? \"il l'a été cette fois-ci\" : \"non\"));\n    }\n}",

      "solution": "// Le centre d'appels : quatre operateurs, une meme permanence, trois facons\n// d'additionner leur travail — dont une seule est a la fois juste et sans verrou.\nimport java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.List;\nimport java.util.stream.Collectors;\n\npublic class CentreAppels {\n\n    record Appel(String numero, int dureeSecondes, Categorie categorie) { }\n\n    enum Categorie { PANNE, FACTURE, RESILIATION }\n\n    // Strategie A : une donnee partagee sans aucune protection.\n    static int totalNu = 0;\n    // Strategie B : la meme, sous verrou.\n    static int totalVerrou = 0;\n    static final Object VERROU = new Object();\n\n    static Categorie categorieDe(int i) {\n        if (i % 3 == 0) {\n            return Categorie.PANNE;\n        }\n        if (i % 3 == 1) {\n            return Categorie.FACTURE;\n        }\n        return Categorie.RESILIATION;\n    }\n\n    public static void main(String[] args) throws InterruptedException {\n        ArrayList<Appel> permanence = new ArrayList<>();\n        for (int i = 0; i < 40; i++) {\n            permanence.add(new Appel(\"04\" + (70 + i), 30 + i * 5, categorieDe(i)));\n        }\n\n        int attendu = permanence.stream().mapToInt(a -> a.dureeSecondes()).sum();\n        System.out.println(\"Durée totale attendue : \" + attendu + \" s pour \"\n                + permanence.size() + \" appels\");\n\n        // Quatre operateurs, dix appels chacun : le decoupage est net.\n        final int OPERATEURS = 4;\n        final int PAR_OPERATEUR = permanence.size() / OPERATEURS;\n\n        // Strategie C : chacun ecrit dans SA case, personne ne partage rien.\n        int[] parOperateur = new int[OPERATEURS];\n        // Chacun tient aussi SA liste : elles seront reunies apres coup.\n        List<List<String>> traces = new ArrayList<>();\n        for (int i = 0; i < OPERATEURS; i++) {\n            traces.add(new ArrayList<>());\n        }\n\n        Thread[] operateurs = new Thread[OPERATEURS];\n        for (int i = 0; i < OPERATEURS; i++) {\n            final int poste = i;\n            operateurs[i] = new Thread(() -> {\n                int debut = poste * PAR_OPERATEUR;\n                for (int k = debut; k < debut + PAR_OPERATEUR; k++) {\n                    Appel a = permanence.get(k);\n                    totalNu = totalNu + a.dureeSecondes();          // A : sans filet\n                    synchronized (VERROU) {\n                        totalVerrou = totalVerrou + a.dureeSecondes();  // B : sous verrou\n                    }\n                    parOperateur[poste] = parOperateur[poste] + a.dureeSecondes();  // C : chez soi\n                    traces.get(poste).add(a.numero());\n                }\n            });\n            operateurs[i].start();\n        }\n        for (Thread o : operateurs) {\n            o.join();\n        }\n\n        int totalCases = 0;\n        for (int m : parOperateur) {\n            totalCases = totalCases + m;\n        }\n\n        System.out.println();\n        System.out.println(\"A — sans protection : \" + totalNu\n                + (totalNu == attendu ? \" (juste cette fois-ci)\" : \" (faux)\"));\n        System.out.println(\"B — sous verrou     : \" + totalVerrou);\n        System.out.println(\"C — une case chacun : \" + totalCases);\n        System.out.println(\"B et C sont-ils d'accord ? \" + (totalVerrou == totalCases));\n\n        System.out.println();\n        for (int i = 0; i < OPERATEURS; i++) {\n            System.out.println(\"  Opérateur \" + (i + 1) + \" : \" + traces.get(i).size()\n                    + \" appels, \" + parOperateur[i] + \" s\");\n        }\n\n        // Les quatre listes reunies apres coup : aucune n'a ete partagee.\n        List<String> tousLesNumeros = new ArrayList<>();\n        for (List<String> t : traces) {\n            tousLesNumeros.addAll(t);\n        }\n        System.out.println(\"Numéros collectés : \" + tousLesNumeros.size());\n        Collections.sort(tousLesNumeros);\n        System.out.println(\"Premier et dernier : \" + tousLesNumeros.get(0) + \" … \"\n                + tousLesNumeros.get(tousLesNumeros.size() - 1));\n\n        // Le bilan par categorie, calcule apres coup, en un seul fil : simple et sur.\n        System.out.println();\n        for (Categorie c : new Categorie[] {Categorie.PANNE, Categorie.FACTURE,\n                Categorie.RESILIATION}) {\n            List<Appel> lot = permanence.stream()\n                    .filter(a -> a.categorie() == c)\n                    .collect(Collectors.toList());\n            int duree = lot.stream().mapToInt(a -> a.dureeSecondes()).sum();\n            System.out.println(\"  \" + c + \" : \" + lot.size() + \" appels, \" + duree + \" s\");\n        }\n    }\n}",

      "enonce": "Nouvelle série sur les trois dernières leçons. Une réserve naturelle tient quatre postes d'observation — CRE-01, ROS-02, FAL-03 et TOU-04 — qui relèvent quatre espèces de rapaces : milan, buse, faucon et épervier. Décris le relevé par une fiche cartonnée — poste, espèce, effectif — et l'espèce par une liste fermée ; déclare aussi le motif d'un code de poste, trois majuscules, un tiret, deux chiffres. Fabrique quarante-huit relevés : le poste tourne sur les quatre, l'espèce est celle de rang trois fois l'indice modulo quatre, et l'effectif vaut un plus l'indice modulo sept. Vérifie que tous les codes de poste sont conformes. Écris ensuite une fonction de dépouillement qui additionne les effectifs d'une tranche de relevés dans un tableau de quatre cases qu'on lui fournit, et emploie-la <strong>deux fois</strong> : une fois sur la totalité, en un seul fil — c'est la référence — et une fois en parallèle, quatre fils sur douze relevés chacun, chacun écrivant dans son propre tableau, les quatre tableaux n'étant réunis qu'après l'attente de tous. Affiche les deux dépouillements côte à côte espèce par espèce, dis s'ils concordent, et donne les deux totaux. Termine par le classement des espèces du plus au moins nombreux avec départage alphabétique, la recherche d'une espèce jamais observée, le plus gros relevé, et le total par poste.",
      "principe": "La seule façon honnête de livrer une version parallèle est de garder la version séquentielle et de prouver, à chaque exécution, qu'elles donnent le même résultat. Le parallélisme est une optimisation ; une optimisation qui change le résultat n'est pas une optimisation, c'est une régression, et sans référence conservée on ne peut pas faire la différence.",

      "solution": "// L'observatoire ornithologique - jour 1 sur 3.\n// Quatre postes depouillent leurs releves en parallele, et le programme PROUVE\n// que le resultat est identique a celui du depouillement sequentiel.\nimport java.util.ArrayList;\nimport java.util.Comparator;\nimport java.util.List;\nimport java.util.Optional;\nimport java.util.stream.Collectors;\n\npublic class Observatoire {\n\n    record Releve(String poste, Espece espece, int effectif) { }\n\n    record Bilan(String espece, int effectif) { }\n\n    enum Espece { MILAN, BUSE, FAUCON, EPERVIER }\n\n    // Le code d'un poste : trois lettres majuscules, un tiret, deux chiffres.\n    static final String CODE_POSTE = \"[A-Z]{3}-\\\\d{2}\";\n\n    static final Espece[] ESPECES = {Espece.MILAN, Espece.BUSE, Espece.FAUCON, Espece.EPERVIER};\n\n    static String nomDe(int rang) {\n        return ESPECES[rang].name();\n    }\n\n    // Le depouillement d'une tranche : il n'ecrit QUE dans le tableau qu'on lui donne.\n    static void depouiller(List<Releve> releves, int debut, int fin, int[] cases) {\n        for (int i = debut; i < fin; i++) {\n            Releve r = releves.get(i);\n            cases[r.espece().ordinal()] = cases[r.espece().ordinal()] + r.effectif();\n        }\n    }\n\n    public static void main(String[] args) throws InterruptedException {\n        String[] postes = {\"CRE-01\", \"ROS-02\", \"FAL-03\", \"TOU-04\"};\n        ArrayList<Releve> releves = new ArrayList<>();\n        for (int i = 0; i < 48; i++) {\n            releves.add(new Releve(postes[i % 4], ESPECES[(i * 3) % 4], 1 + (i % 7)));\n        }\n        System.out.println(\"Relevés : \" + releves.size() + \" sur \" + postes.length + \" postes\");\n        System.out.println(\"Codes conformes : \"\n                + releves.stream().filter(r -> r.poste().matches(CODE_POSTE)).count()\n                + \"/\" + releves.size());\n\n        // Version sequentielle : la reference, ecrite d'abord.\n        int[] sequentiel = new int[4];\n        depouiller(releves, 0, releves.size(), sequentiel);\n\n        // Version parallele : quatre fils, quatre tableaux, aucune case commune.\n        final int FILS = 4;\n        final int TRANCHE = releves.size() / FILS;\n        int[][] partiels = new int[FILS][4];\n        Thread[] fils = new Thread[FILS];\n        for (int f = 0; f < FILS; f++) {\n            final int rang = f;\n            fils[f] = new Thread(() ->\n                    depouiller(releves, rang * TRANCHE, (rang + 1) * TRANCHE, partiels[rang]));\n            fils[f].start();\n        }\n        for (Thread f : fils) {\n            f.join();\n        }\n\n        // La reunion se fait dans le fil principal, une fois tout le monde rentre.\n        int[] parallele = new int[4];\n        for (int f = 0; f < FILS; f++) {\n            for (int e = 0; e < 4; e++) {\n                parallele[e] = parallele[e] + partiels[f][e];\n            }\n        }\n\n        System.out.println();\n        System.out.println(\"--- Dépouillement ---\");\n        StringBuilder tableau = new StringBuilder();\n        for (int e = 0; e < 4; e++) {\n            tableau.append(\"  \").append(nomDe(e))\n                    .append(\" \".repeat(10 - nomDe(e).length()))\n                    .append(\"séquentiel \").append(sequentiel[e])\n                    .append(\"  ·  parallèle \").append(parallele[e]).append(\"\\n\");\n        }\n        System.out.print(tableau.toString());\n\n        boolean identiques = true;\n        for (int e = 0; e < 4; e++) {\n            if (sequentiel[e] != parallele[e]) {\n                identiques = false;\n            }\n        }\n        System.out.println(\"Les deux dépouillements concordent-ils ? \" + identiques);\n\n        int totalSeq = 0;\n        int totalPar = 0;\n        for (int e = 0; e < 4; e++) {\n            totalSeq = totalSeq + sequentiel[e];\n            totalPar = totalPar + parallele[e];\n        }\n        System.out.println(\"Total séquentiel : \" + totalSeq + \" — total parallèle : \" + totalPar);\n\n        // Le classement des especes : un juge de la lecon 25 sur des fiches.\n        List<Bilan> bilans = new ArrayList<>();\n        for (int e = 0; e < 4; e++) {\n            bilans.add(new Bilan(nomDe(e), parallele[e]));\n        }\n        Comparator<Bilan> parEffectif = Comparator.comparingInt(Bilan::effectif);\n        Comparator<Bilan> parNom = Comparator.comparing(Bilan::espece);\n        List<Bilan> classement = bilans.stream()\n                .sorted(parEffectif.reversed().thenComparing(parNom))\n                .collect(Collectors.toList());\n        System.out.println();\n        System.out.println(\"--- Classement ---\");\n        int rang = 1;\n        for (Bilan b : classement) {\n            System.out.println(\"  \" + rang + \". \" + b.espece() + \" : \" + b.effectif());\n            rang = rang + 1;\n        }\n\n        // Une recherche qui peut ne rien donner : la boite de la lecon 23.\n        Optional<Bilan> jamaisVue = bilans.stream().filter(b -> b.effectif() == 0).findFirst();\n        System.out.println(\"Espèce jamais observée : \"\n                + jamaisVue.map(b -> b.espece()).orElse(\"aucune, les quatre ont été vues\"));\n        Optional<Releve> gros = releves.stream()\n                .sorted(Comparator.comparingInt(Releve::effectif).reversed())\n                .findFirst();\n        System.out.println(\"Plus gros relevé : \"\n                + gros.map(r -> r.effectif() + \" individus au poste \" + r.poste()).orElse(\"aucun\"));\n\n        // Par poste, sans aucun fil : le calcul d'apres coup est simple et sur.\n        System.out.println();\n        for (String p : postes) {\n            int somme = releves.stream()\n                    .filter(r -> r.poste().equals(p))\n                    .mapToInt(r -> r.effectif())\n                    .sum();\n            System.out.println(\"  \" + p + \" : \" + somme + \" individus\");\n        }\n    }\n}",
