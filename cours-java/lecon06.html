  theory: `
<h3>1. TANT QUE devient while</h3>
<p>Une <strong>boucle</strong> répète un bloc d'instructions plusieurs fois, sans avoir à le recopier — comme un manège qui refait le même tour tant qu'on ne l'arrête pas. Le <code>while</code> (« tant que ») teste sa condition AVANT chaque tour : si elle est fausse dès le départ, le corps n'est jamais exécuté (zéro tour).</p>
<pre class="pseudo">PSEUDOCODE                    JAVA
i ← 1                         int i = 1;                 // initialisation AVANT la boucle
TANT QUE i <= 5 FAIRE         while (i &lt;= 5) {           // tant que i <= 5, on refait un tour
    Écrire(i)                     System.out.println(i); // corps : affiche i
    i ← i + 1                     i++;                   // PROGRESSION : sans elle, i reste 1 → boucle infinie
FINTANTQUE                    }                          // fin du corps : on remonte tester la condition</pre>
<p>Mêmes règles qu'en algorithmique : initialiser avant, tester avant chaque tour, faire progresser dans le corps. Même danger : oublier la progression crée une <strong>boucle infinie</strong> (le programme tourne sans fin et se fige).</p>

<h3>2. RÉPÉTER…JUSQU'À devient do-while (condition INVERSÉE !)</h3>
<pre class="pseudo">RÉPÉTER                       do {                        // do : le corps s'exécute AU MOINS une fois…
    Lire(note)                    note = clavier.nextInt();
JUSQU'À note >= 0 ET note <= 20
                              } while (note &lt; 0 || note &gt; 20); // …puis on teste APRÈS : on recommence tant que c'est FAUX</pre>
<div class="warn">JUSQU'À donne la condition d'ARRÊT ; <code>while</code> donne la condition de CONTINUATION. Ce sont des CONTRAIRES (lois de De Morgan) ! « arrêter quand note valide (0 à 20) » devient « continuer tant que note invalide (&lt; 0 ou &gt; 20) ». Le <code>do-while</code> garantit, comme RÉPÉTER, au moins une exécution.</div>

<h3>3. POUR devient for</h3>
<pre class="pseudo">POUR i DE 1 A 10 FAIRE        for (int i = 1; i &lt;= 10; i++) {   // init ; condition ; progression, sur une ligne
    Écrire(i)                     System.out.println(i);
FINPOUR                       }</pre>
<p>Les trois zones du <code>for</code> : <code>for (initialisation ; condition ; progression)</code> regroupent les trois temps du TANT QUE. C'est la boucle idéale quand le nombre de tours est connu d'avance.</p>
<pre class="pseudo">POUR i DE 0 A 10 PAS 2   →   for (int i = 0; i &lt;= 10; i += 2)   // avance de 2 en 2 : 0, 2, 4… 10
POUR i DE 10 A 1 PAS -1  →   for (int i = 10; i &gt;= 1; i--)      // compte à rebours : 10, 9… 1</pre>

<h3>4. Les motifs classiques (accumulateur, compteur)</h3>
<pre class="pseudo">// ACCUMULATEUR : somme des n premiers entiers
int somme = 0;                             // on part de 0 (élément neutre de l'addition)
for (int i = 1; i &lt;= n; i++) {             // i parcourt 1, 2, 3 … n
    somme += i;                            // à chaque tour, on AJOUTE i au total
}
// COMPTEUR CONDITIONNEL : combien de pairs de 1 à 100 ?
int nbPairs = 0;                           // compteur initialisé à 0
for (int i = 1; i &lt;= 100; i++) {           // on passe en revue tous les entiers de 1 à 100
    if (i % 2 == 0) { nbPairs++; }         // +1 chaque fois que i est pair (reste nul modulo 2)
}</pre>

<h3>5. break et continue</h3>
<pre class="pseudo">break;      // SORT immédiatement de la boucle (on arrête tout, on n'y revient plus)
continue;   // ABANDONNE le tour en cours et passe directement au suivant</pre>
<p>À utiliser avec parcimonie : souvent, une condition de boucle bien écrite les rend inutiles. Mais <code>break</code> est pratique pour s'arrêter dès qu'on a trouvé (recherche), et <code>continue</code> pour ignorer certains cas.</p>
<div class="tip">Le guide de choix reste la loi : nombre de tours connu → <code>for</code> ; inconnu → <code>while</code> ; au moins un tour garanti → <code>do-while</code>.</div>`,

    { type: "qcm", q: "« Afficher les 25 premières lignes d'un rapport » :", opts: ["for (int i = 1; i <= 25; i++)", "while (true)", "do-while", "if"], a: 0, exp: "Nombre connu → for. Le guide du jour 11 est éternel." },
    { type: "input", q: "<code>int c = 0; for (int i = 1; i <= 30; i++) { if (i % 7 == 0) c++; }</code> Que vaut c ?", a: "4", ph: "nombre", exp: "7, 14, 21, 28 : le compteur conditionnel du jour 12." }
  ],

<pre class="pseudo">public class Epargne {
    public static void main(String[] args) {
        double capital = 100;              // capital de départ (réel : il aura des décimales)
        int annees = 0;                    // compteur d'années (entier)
        while (capital <= 150) {           // tant qu'on n'a pas dépassé 150 €, on continue

            annees++;                      // une année de plus est écoulée
        }                                  // on remonte tester la condition

}</pre>`,

      { type: "qcm", q: "Version « au moins une année est toujours comptée » : quelle boucle ?", opts: ["for", "do { capital *= 1.10; annees++; } while (capital <= 150);", "while inchangé", "switch"], a: 1, exp: "Exécution garantie → do-while. Tu maîtrises le guide de choix." }
    ],

<p>La trace est EXACTEMENT celle du jour 9. while/for/do-while ne sont que les habits Java de TANT QUE/POUR/RÉPÉTER : la logique t'appartenait déjà.</p>`
