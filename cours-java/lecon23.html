<script>
var DAY = {
  num: 23,
  title: "Optional et la sécurité anti-null",
  subtitle: "Une boîte qui contient « peut-être une valeur, peut-être rien » : dire l'absence sans faire planter le programme.",
  theory: `
<h3>1. Le fléau : null et la NullPointerException</h3>
<p>Dans ta <strong>ludothèque</strong>, tu cherches un jeu qui n'existe pas. La méthode te renvoie… <code>null</code>, c'est-à-dire « rien, le vide ». Si tu essaies quand même d'utiliser ce rien, le programme explose : c'est la fameuse <strong>NullPointerException</strong> (« exception de pointeur nul »), le plantage le plus fréquent de Java.</p>
<pre class="pseudo">String jeu = chercher("Inconnu");   // la recherche échoue et renvoie null (le « vide »)
int n = jeu.length();               // BOUM : on appelle length() sur du vide -> NullPointerException</pre>
<div class="warn"><code>null</code> signifie « cette variable ne pointe vers aucun objet ». Toute méthode appelée sur <code>null</code> fait planter le programme À L'EXÉCUTION. Le problème : rien ne t'avertit AVANT.</div>

<h3>2. La solution : Optional, une boîte fermée</h3>
<p><code>Optional&lt;T&gt;</code> est une <strong>boîte</strong> qui contient soit une valeur, soit rien — mais qui t'OBLIGE à vérifier avant d'ouvrir. C'est comme un colis marqué « peut être vide » : tu ne peux pas prétendre qu'il y a un cadeau dedans sans regarder d'abord.</p>
<pre class="pseudo">import java.util.Optional;                    // la classe boîte

Optional&lt;String&gt; boite = Optional.of("Uno"); // une boîte qui CONTIENT « Uno »
Optional&lt;String&gt; vide = Optional.empty();     // une boîte VIDE (au lieu de null)
Optional&lt;String&gt; peut = Optional.ofNullable(x); // boîte pleine si x != null, vide sinon</pre>
<div class="tip"><code>Optional.of(x)</code> refuse un x null (il plante volontairement). <code>Optional.ofNullable(x)</code> accepte null et fabrique une boîte vide : à utiliser quand la valeur peut légitimement manquer.</div>

<h3>3. Ouvrir la boîte prudemment : isPresent et get</h3>
<pre class="pseudo">if (boite.isPresent()) {         // la boîte contient-elle quelque chose ?
    String v = boite.get();      // OUI : on sort la valeur en sécurité
    System.out.println(v);       // on l'utilise
} else {                         // NON : la boîte est vide
    System.out.println("Aucun jeu trouvé"); // on gère l'absence proprement
}</pre>
<div class="warn">Appeler <code>get()</code> sur une boîte VIDE relance une exception. <code>get()</code> ne se fait qu'après avoir vérifié <code>isPresent()</code> — ou mieux, on évite <code>get()</code> avec les méthodes ci-dessous.</div>

<h3>4. La bonne façon : orElse et compagnie</h3>
<p>Plutôt que d'ouvrir la boîte à la main, on demande directement « la valeur, ou À DÉFAUT ceci » :</p>
<pre class="pseudo">String v = boite.orElse("Aucun");         // renvoie la valeur, ou « Aucun » si la boîte est vide
String w = boite.orElseGet(() -&gt; calcul()); // pareil, mais calcule le défaut seulement si nécessaire
String z = boite.orElseThrow();            // renvoie la valeur, ou lève une exception si vide</pre>

<h3>5. Enchaîner sans risque : map et ifPresent</h3>
<p>On peut transformer le contenu d'une boîte SANS l'ouvrir : si elle est vide, la transformation est simplement ignorée. Aucun risque de NullPointerException.</p>
<pre class="pseudo">Optional&lt;Integer&gt; taille = boite.map(s -&gt; s.length()); // transforme le contenu s'il existe, sinon reste vide
boite.ifPresent(s -&gt; System.out.println(s));            // exécute l'action UNIQUEMENT si la boîte est pleine</pre>

<h3>6. Optional et les Streams</h3>
<p>Beaucoup d'opérations terminales renvoient un Optional, car le résultat peut ne pas exister (liste vide, aucun élément trouvé) :</p>
<pre class="pseudo">Optional&lt;String&gt; premier = jeux.stream()      // source
    .filter(j -&gt; j.startsWith("Z"))          // aucun jeu ne commence peut-être par Z...
    .findFirst();                            // ...d'où un Optional (peut être vide)
System.out.println(premier.orElse("rien"));   // affiche le 1er trouvé, ou « rien »</pre>

<h3>7. La philosophie : rendre l'absence VISIBLE</h3>
<p>Le type de retour <code>Optional&lt;String&gt;</code> annonce clairement « attention, il se peut qu'il n'y ait rien ». Le compilateur t'oblige à y penser. Alors que <code>String</code> qui renvoie parfois <code>null</code> est un piège silencieux. Optional transforme un bug d'exécution en une question qu'on se pose à l'écriture.</p>`,
  exercises: [
    { type: "qcm", q: "Que signifie <code>null</code> ?", opts: ["Le nombre zéro", "« la variable ne pointe vers aucun objet » (le vide)", "Une chaîne vide", "false"], a: 1, exp: "null = absence de tout objet." },
    { type: "qcm", q: "Appeler une méthode sur <code>null</code> provoque…", opts: ["la valeur par défaut du type", "une NullPointerException à l'exécution", "une erreur de compilation", "un retour null"], a: 1, exp: "Le plantage le plus courant de Java." },
    { type: "qcm", q: "À quoi sert <code>Optional&lt;T&gt;</code> ?", opts: ["À convertir null en chaîne vide", "À représenter « peut-être une valeur, peut-être rien » de façon sûre", "À accélérer le code", "À remplacer les listes"], a: 1, exp: "Une boîte qui force à vérifier avant d'utiliser." },
    { type: "qcm", q: "<code>Optional.empty()</code> crée…", opts: ["une boîte contenant null", "une boîte VIDE (sans planter)", "un Optional contenant une chaîne vide", "une liste vide"], a: 1, exp: "L'absence explicite, propre, au lieu de null." },
    { type: "qcm", q: "Différence entre <code>Optional.of(x)</code> et <code>Optional.ofNullable(x)</code> ?", opts: ["les deux acceptent null indifféremment", "of(x) plante si x est null ; ofNullable(x) accepte null et fait une boîte vide", "ofNullable est plus lent", "of accepte null"], a: 1, exp: "ofNullable est le choix sûr quand x peut manquer." },
    { type: "qcm", q: "<code>boite.isPresent()</code> renvoie…", opts: ["la valeur", "true si la boîte contient une valeur", "toujours true", "un Optional"], a: 1, exp: "Il teste la présence d'une valeur." },
    { type: "vf", q: "Appeler <code>get()</code> sur un Optional vide relance une exception.", a: true, exp: "D'où l'intérêt de vérifier isPresent() ou d'utiliser orElse." },
    { type: "qcm", q: "<code>boite.orElse(\"defaut\")</code> renvoie…", opts: ["toujours \"defaut\"", "la valeur si présente, sinon \"defaut\"", "une exception", "un boolean"], a: 1, exp: "La valeur ou un repli fourni." },
    { type: "qcm", q: "<code>boite.orElseThrow()</code> :", opts: ["renvoie null", "renvoie la valeur, ou lève une exception si la boîte est vide", "renvoie une boîte vide", "renvoie la valeur même si la boîte est vide"], a: 1, exp: "Utile quand l'absence est vraiment anormale." },
    { type: "qcm", q: "<code>boite.ifPresent(action)</code> exécute l'action…", opts: ["toujours", "uniquement si la boîte contient une valeur", "jamais", "si la boîte est vide"], a: 1, exp: "L'action ne tourne que sur une boîte pleine." },
    { type: "qcm", q: "<code>boite.map(s -&gt; s.length())</code> sur une boîte VIDE donne…", opts: ["une erreur", "une boîte vide (la transformation est ignorée)", "0", "null"], a: 1, exp: "map ne s'applique que si la valeur existe : sûr par nature." },
    { type: "vf", q: "Un retour de type <code>Optional&lt;String&gt;</code> annonce clairement que la valeur peut manquer.", a: true, exp: "L'absence devient visible dans la signature, pas cachée." },
    { type: "qcm", q: "Sur un Stream, <code>findFirst()</code> renvoie…", opts: ["un String", "un Optional (le résultat peut ne pas exister)", "une List", "un boolean"], a: 1, exp: "Aucun élément ne correspond peut-être : d'où l'Optional." },
    { type: "vf", q: "Optional transforme un bug d'exécution (NullPointerException) en une question qu'on se pose à l'écriture.", a: true, exp: "Le compilateur nous force à gérer l'absence tôt." },
    { type: "qcm", q: "Quelle est la MEILLEURE pratique pour lire un Optional ?", opts: ["get() directement", "orElse / ifPresent / map plutôt que isPresent+get", "tester != null avant de lire", "appeler get() dans un try/catch"], a: 1, exp: "Les méthodes fonctionnelles évitent les oublis de vérification." }
  ],
  final: {
    title: "Exercice final — Chercher un jeu sans planter",
    intro: `<p>Une méthode cherche un jeu par nom et renvoie un Optional. Le programme principal l'utilise proprement :</p>
<pre class="pseudo">Optional&lt;String&gt; trouver(ArrayList&lt;String&gt; jeux, String cible) { // renvoie « peut-être un jeu »
    for (String j : jeux) {                    // on parcourt
        if (j.equals(cible)) {                 // trouvé ?
            return Optional.of(j);             // (1) boîte pleine
        }
    }
    return Optional.empty();                   // (2) rien trouvé : boîte vide (pas null !)
}
// Dans main :
Optional&lt;String&gt; r = trouver(jeux, "Catan");   // jeux contient Catan
String affichage = r.orElse("Introuvable");    // (3)
Optional&lt;String&gt; r2 = trouver(jeux, "Echecs"); // absent de la liste
String affichage2 = r2.orElse("Introuvable");  // (4)</pre>`,
    questions: [
      { type: "qcm", q: "(1) Pourquoi renvoyer <code>Optional.of(j)</code> quand on trouve ?", opts: ["Pour convertir la valeur en texte", "Pour emballer la valeur trouvée dans une boîte pleine", "Pour libérer la mémoire", "Par obligation syntaxique"], a: 1, exp: "of(j) crée une boîte contenant le jeu trouvé." },
      { type: "qcm", q: "(2) Pourquoi <code>Optional.empty()</code> plutôt que <code>return null</code> ?", opts: ["C'est pareil", "empty() rend l'absence explicite et force l'appelant à la gérer", "empty() est plus rapide", "null est interdit en Java"], a: 1, exp: "Optional évite la NullPointerException silencieuse." },
      { type: "qcm", q: "(3) Que vaut <code>affichage</code> ?", opts: ["Introuvable", "Catan (trouvé, donc la valeur est renvoyée)", "null", "une erreur"], a: 1, exp: "La boîte est pleine : orElse renvoie son contenu." },
      { type: "qcm", q: "(4) Que vaut <code>affichage2</code> ?", opts: ["Echecs", "Introuvable : la boîte est vide, orElse renvoie le repli", "null", "une exception"], a: 1, exp: "Aucun jeu « Echecs » : la boîte vide déclenche le orElse." },
      { type: "vf", q: "Grâce à Optional, aucune NullPointerException ne peut survenir ici même si le jeu est absent.", a: true, exp: "orElse fournit toujours une valeur de repli : pas de vide manipulé." }
    ],
    solution: `<pre class="pseudo">trouver(jeux, "Catan")   -> Optional.of("Catan")  // boîte pleine
    .orElse("Introuvable") -> "Catan"                // renvoie le contenu
trouver(jeux, "Echecs")  -> Optional.empty()      // boîte vide
    .orElse("Introuvable") -> "Introuvable"          // renvoie le repli
// affichage  = "Catan"
// affichage2 = "Introuvable"</pre>
<p>L'absence est gérée explicitement, sans un seul null ni plantage. Le type de retour prévient l'appelant : « il se peut qu'il n'y ait rien ». Prochaine leçon : records, enums et pattern matching, pour modéliser des données proprement.</p>`
  }
};
</script>
