  title: "Optional et la sécurité anti-null",
  subtitle: "Une boîte qui contient « peut-être une valeur, peut-être rien » : dire l'absence sans faire planter le programme.",
  theory: `
<h3>1. Le fléau : null et la NullPointerException</h3>
<p>Dans ta <strong>ludothèque</strong>, tu cherches un jeu qui n'existe pas. La méthode te renvoie… <code>null</code>, c'est-à-dire « rien, le vide ». Si tu essaies quand même d'utiliser ce rien, le programme explose : c'est la fameuse <strong>NullPointerException</strong> (« exception de pointeur nul »), le plantage le plus fréquent de Java.</p>
<pre class="pseudo">String jeu = chercher("Inconnu");   // la recherche échoue et renvoie null (le « vide »)
int n = jeu.length();               // BOUM : on appelle length() sur du vide -> NullPointerException</pre>
<div class="warn"><code>null</code> signifie « cette variable ne pointe vers aucun objet ». Toute méthode appelée sur <code>null</code> fait planter le programme À L'EXÉCUTION. Le problème : rien ne t'avertit AVANT.</div>

<h3>2. La solution : Optional, une boîte fermée</h3>
<p><code>Optional&lt;T&gt;</code> est une <strong>boîte</strong> qui contient soit une valeur, soit rien — mais qui t'OBLIGE à vérifier avant d'ouvrir. C'est comme un colis marqué « peut être vide » : tu ne peux pas prétendre qu'il y a un cadeau dedans sans regarder d'abord.</p>
<pre class="pseudo">import java.util.Optional;                    // la classe boîte

Optional&lt;String&gt; boite = Optional.of("Uno"); // une boîte qui CONTIENT « Uno »
Optional&lt;String&gt; vide = Optional.empty();     // une boîte VIDE (au lieu de null)
Optional&lt;String&gt; peut = Optional.ofNullable(x); // boîte pleine si x != null, vide sinon</pre>
<div class="tip"><code>Optional.of(x)</code> refuse un x null (il plante volontairement). <code>Optional.ofNullable(x)</code> accepte null et fabrique une boîte vide : à utiliser quand la valeur peut légitimement manquer.</div>

<h3>3. Ouvrir la boîte prudemment : isPresent et get</h3>
<pre class="pseudo">if (boite.isPresent()) {         // la boîte contient-elle quelque chose ?
    String v = boite.get();      // OUI : on sort la valeur en sécurité
    System.out.println(v);       // on l'utilise
} else {                         // NON : la boîte est vide
    System.out.println("Aucun jeu trouvé"); // on gère l'absence proprement
}</pre>
<div class="warn">Appeler <code>get()</code> sur une boîte VIDE relance une exception. <code>get()</code> ne se fait qu'après avoir vérifié <code>isPresent()</code> — ou mieux, on évite <code>get()</code> avec les méthodes ci-dessous.</div>

<h3>4. La bonne façon : orElse et compagnie</h3>
<p>Plutôt que d'ouvrir la boîte à la main, on demande directement « la valeur, ou À DÉFAUT ceci » :</p>
<pre class="pseudo">String v = boite.orElse("Aucun");         // renvoie la valeur, ou « Aucun » si la boîte est vide
String w = boite.orElseGet(() -&gt; calcul()); // pareil, mais calcule le défaut seulement si nécessaire
String z = boite.orElseThrow();            // renvoie la valeur, ou lève une exception si vide</pre>

<h3>5. Enchaîner sans risque : map et ifPresent</h3>
<p>On peut transformer le contenu d'une boîte SANS l'ouvrir : si elle est vide, la transformation est simplement ignorée. Aucun risque de NullPointerException.</p>
<pre class="pseudo">Optional&lt;Integer&gt; taille = boite.map(s -&gt; s.length()); // transforme le contenu s'il existe, sinon reste vide
boite.ifPresent(s -&gt; System.out.println(s));            // exécute l'action UNIQUEMENT si la boîte est pleine</pre>

<h3>6. Optional et les Streams</h3>
<p>Beaucoup d'opérations terminales renvoient un Optional, car le résultat peut ne pas exister (liste vide, aucun élément trouvé) :</p>
<pre class="pseudo">Optional&lt;String&gt; premier = jeux.stream()      // source
    .filter(j -&gt; j.startsWith("Z"))          // aucun jeu ne commence peut-être par Z...
    .findFirst();                            // ...d'où un Optional (peut être vide)
System.out.println(premier.orElse("rien"));   // affiche le 1er trouvé, ou « rien »</pre>

<h3>7. La philosophie : rendre l'absence VISIBLE</h3>
<p>Le type de retour <code>Optional&lt;String&gt;</code> annonce clairement « attention, il se peut qu'il n'y ait rien ». Le compilateur t'oblige à y penser. Alors que <code>String</code> qui renvoie parfois <code>null</code> est un piège silencieux. Optional transforme un bug d'exécution en une question qu'on se pose à l'écriture.</p>`,
  exercises: [
    { type: "qcm", q: "Que signifie <code>null</code> ?", opts: ["Le nombre zéro", "« la variable ne pointe vers aucun objet » (le vide)", "Une chaîne vide", "false"], a: 1, exp: "null = absence de tout objet." },

    { type: "qcm", q: "Quelle est la MEILLEURE pratique pour lire un Optional ?", opts: ["get() directement", "orElse / ifPresent / map plutôt que isPresent+get", "tester != null avant de lire", "appeler get() dans un try/catch"], a: 1, exp: "Les méthodes fonctionnelles évitent les oublis de vérification." }

    title: "Exercice final — Chercher un jeu sans planter",
    intro: `<p>Une méthode cherche un jeu par nom et renvoie un Optional. Le programme principal l'utilise proprement :</p>
<pre class="pseudo">Optional&lt;String&gt; trouver(ArrayList&lt;String&gt; jeux, String cible) { // renvoie « peut-être un jeu »
    for (String j : jeux) {                    // on parcourt
        if (j.equals(cible)) {                 // trouvé ?
            return Optional.of(j);             // (1) boîte pleine
        }
    }
    return Optional.empty();                   // (2) rien trouvé : boîte vide (pas null !)
}
// Dans main :
Optional&lt;String&gt; r = trouver(jeux, "Catan");   // jeux contient Catan
String affichage = r.orElse("Introuvable");    // (3)
Optional&lt;String&gt; r2 = trouver(jeux, "Echecs"); // absent de la liste
String affichage2 = r2.orElse("Introuvable");  // (4)</pre>`,
    questions: [
      { type: "qcm", q: "(1) Pourquoi renvoyer <code>Optional.of(j)</code> quand on trouve ?", opts: ["Pour convertir la valeur en texte", "Pour emballer la valeur trouvée dans une boîte pleine", "Pour libérer la mémoire", "Par obligation syntaxique"], a: 1, exp: "of(j) crée une boîte contenant le jeu trouvé." },
      { type: "qcm", q: "(2) Pourquoi <code>Optional.empty()</code> plutôt que <code>return null</code> ?", opts: ["C'est pareil", "empty() rend l'absence explicite et force l'appelant à la gérer", "empty() est plus rapide", "null est interdit en Java"], a: 1, exp: "Optional évite la NullPointerException silencieuse." },
      { type: "qcm", q: "(3) Que vaut <code>affichage</code> ?", opts: ["Introuvable", "Catan (trouvé, donc la valeur est renvoyée)", "null", "une erreur"], a: 1, exp: "La boîte est pleine : orElse renvoie son contenu." },
      { type: "qcm", q: "(4) Que vaut <code>affichage2</code> ?", opts: ["Echecs", "Introuvable : la boîte est vide, orElse renvoie le repli", "null", "une exception"], a: 1, exp: "Aucun jeu « Echecs » : la boîte vide déclenche le orElse." },
      { type: "vf", q: "Grâce à Optional, aucune NullPointerException ne peut survenir ici même si le jeu est absent.", a: true, exp: "orElse fournit toujours une valeur de repli : pas de vide manipulé." }
    ],
    solution: `<pre class="pseudo">trouver(jeux, "Catan")   -> Optional.of("Catan")  // boîte pleine
    .orElse("Introuvable") -> "Catan"                // renvoie le contenu
trouver(jeux, "Echecs")  -> Optional.empty()      // boîte vide
    .orElse("Introuvable") -> "Introuvable"          // renvoie le repli
// affichage  = "Catan"
// affichage2 = "Introuvable"</pre>
<p>L'absence est gérée explicitement, sans un seul null ni plantage. Le type de retour prévient l'appelant : « il se peut qu'il n'y ait rien ». Prochaine leçon : records, enums et pattern matching, pour modéliser des données proprement.</p>`

      "remarque": "La méthode « est libre » et la méthode qui rend l'hôte disent la même chose de deux façons, et rien n'oblige le code à les tenir d'accord. C'est une redondance acceptée ici pour la lisibilité, mais elle doit être consciente : le jour où l'on ajoutera une réservation posée sans hôte encore arrivé, ce sont les deux méthodes qu'il faudra corriger, pas une.",
      "indices": [
        "Décompose l'énoncé en deux moitiés très inégales. La première est de la mécanique déjà connue : une classe avec ses accesseurs, une liste, deux recherches qui filtrent un flux et prennent le premier survivant. La seconde tient en quatre lignes et porte tout l'enseignement : la même boîte pleine, deux manières de lui donner un repli, et une différence de comportement visible à l'écran. Réserve-lui ton attention.",
        "Le plan : la classe de la chambre, avec un champ d'hôte ordinaire et une méthode publique qui l'emballe ; deux méthodes de recherche rendant chacune une boîte ; une méthode de repli qui affiche une ligne avant de rendre son texte ; puis le programme principal qui déroule les questions dans l'ordre de l'énoncé.",
        "Pour afficher la fiche d'une chambre trouvée, n'ouvre pas la boîte : transforme son contenu en fiche, puis demande le résultat ou un repli. La chaîne est la même que la chambre existe ou non — c'est la même leçon qu'à l'exercice précédent, mais sur des objets au lieu de textes, ce qui la rend beaucoup plus utile.",
        "Le point dur est la démonstration du repli, et il est plus subtil qu'il n'y paraît. La première manière prend un texte en argument : ce texte doit exister au moment de l'appel, donc la méthode qui le fabrique s'exécute — même si la boîte est pleine et que son résultat sera jeté. La seconde prend non pas un texte mais un moyen d'en obtenir un, c'est-à-dire une lambda sans paramètre au sens de la leçon 21 : elle n'est déclenchée qu'en cas de besoin. Écris les deux lignes l'une sous l'autre, exécute, et compte les annonces.",
        "Ton fichier ressemble à ceci :<br><code>private String hote;</code> ← le vide est toléré ICI<br><code>Optional&lt;String&gt; hote() { return Optional.of…(hote); }</code><br><code>boolean estLibre() { return hote == …; }</code><br><code>static Optional&lt;Chambre&gt; parNumero(List&lt;Chambre&gt; …, int …) {</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;return ….stream().filter(c -&gt; c.getNumero() == …).find…();</code><br><code>}</code><br><code>static String repli() { System.out.println(…); return \"complet\"; }</code><br><code>existante.map(c -&gt; c.getType()).orElse(repli())</code><br><code>existante.map(c -&gt; c.getType()).orElseGet(() -&gt; …)</code><br><code>try { Optional.of(personne); } catch (Exception e) { … }</code>"
      ],
      "solution": "// L'auberge de jeunesse : objets (lecon 12), collections (20), lambdas (21),\n// flux (22) et boites (23) dans le meme programme.\nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.Optional;\n\npublic class Auberge {\n\n    // Une recherche par numero : le numero peut ne correspondre a rien.\n    static Optional<Chambre> parNumero(List<Chambre> chambres, int numero) {\n        return chambres.stream()\n                .filter(c -> c.getNumero() == numero)\n                .findFirst();\n    }\n\n    // La premiere chambre libre assez grande, s'il en existe une.\n    static Optional<Chambre> premiereLibre(List<Chambre> chambres, int litsMin) {\n        return chambres.stream()\n                .filter(c -> c.estLibre())\n                .filter(c -> c.getLits() >= litsMin)\n                .findFirst();\n    }\n\n    // Un repli COUTEUX, rendu visible : il annonce a l'ecran qu'on le fabrique.\n    static String repli() {\n        System.out.println(\"   (le panneau « complet » est repeint…)\");\n        return \"complet\";\n    }\n\n    public static void main(String[] args) {\n        ArrayList<Chambre> chambres = new ArrayList<>();\n        chambres.add(new Chambre(11, \"dortoir\", 6, \"Groupe scolaire\"));\n        chambres.add(new Chambre(12, \"privée\", 2, null));\n        chambres.add(new Chambre(13, \"dortoir\", 4, null));\n        chambres.add(new Chambre(14, \"privée\", 3, \"Famille Renard\"));\n        chambres.add(new Chambre(15, \"dortoir\", 8, null));\n\n        long libres = chambres.stream().filter(c -> c.estLibre()).count();\n        System.out.println(\"Chambres libres : \" + libres);\n\n        // a) la premiere chambre libre pour quatre personnes\n        Optional<Chambre> pourQuatre = premiereLibre(chambres, 4);\n        System.out.println(\"Pour 4 : \" + pourQuatre.map(c -> c.fiche()).orElse(\"rien de disponible\"));\n        Optional<Chambre> pourDix = premiereLibre(chambres, 10);\n        System.out.println(\"Pour 10 : \" + pourDix.map(c -> c.fiche()).orElse(\"rien de disponible\"));\n\n        // b) un numero qui n'existe pas\n        System.out.println(\"Chambre 12 : \" + parNumero(chambres, 12).map(c -> c.fiche()).orElse(\"inconnue\"));\n        System.out.println(\"Chambre 99 : \" + parNumero(chambres, 99).map(c -> c.fiche()).orElse(\"inconnue\"));\n\n        // c) le repli est-il fabrique quand la boite est PLEINE ?\n        Optional<Chambre> existante = parNumero(chambres, 14);\n        System.out.println(\"Avec orElse :\");\n        System.out.println(\"   \" + existante.map(c -> c.getType()).orElse(repli()));\n        System.out.println(\"Avec orElseGet :\");\n        System.out.println(\"   \" + existante.map(c -> c.getType()).orElseGet(() -> repli()));\n\n        // Qui occupe quoi : la reponse est une boite, jamais un null.\n        for (Chambre c : chambres) {\n            System.out.println(\"  \" + c.getNumero() + \" → \" + c.hote().orElse(\"libre\"));\n        }\n\n        // d) of exige une valeur, ofNullable accepte l'absence\n        String personne = null;\n        try {\n            Optional<String> refus = Optional.of(personne);\n            System.out.println(\"inatteignable : \" + refus);\n        } catch (Exception e) {\n            System.out.println(\"of(null) refusé : exception levée, message = \" + e.getMessage());\n        }\n        System.out.println(\"ofNullable(null) : \" + Optional.ofNullable(personne).orElse(\"boîte vide acceptée\"));\n\n        // Ouvrir une boite vide sans regarder : le filet de la lecon 16 rattrape.\n        try {\n            Chambre fantome = parNumero(chambres, 99).get();\n            System.out.println(\"inatteignable : \" + fantome.fiche());\n        } catch (Exception e) {\n            System.out.println(\"get() sur boîte vide : \" + e.getMessage());\n        }\n        System.out.println(\"L'auberge tourne toujours.\");\n    }\n}\n\nclass Chambre {\n    private int numero;\n    private String type;\n    private int lits;\n    private String hote;   // null a l'INTERIEUR : c'est tolere ici, jamais a la frontiere\n\n    Chambre(int numero, String type, int lits, String hote) {\n        this.numero = numero;\n        this.type = type;\n        this.lits = lits;\n        this.hote = hote;\n    }\n\n    int getNumero() {\n        return numero;\n    }\n\n    String getType() {\n        return type;\n    }\n\n    int getLits() {\n        return lits;\n    }\n\n    // La frontiere : l'exterieur ne recoit jamais null, il recoit une boite.\n    Optional<String> hote() {\n        return Optional.ofNullable(hote);\n    }\n\n    boolean estLibre() {\n        return hote == null;\n    }\n\n    String fiche() {\n        return \"n°\" + numero + \" (\" + type + \", \" + lits + \" lits)\";\n    }\n}",

      "hier": "lecon22.html",
      "enonce": "Reprends la médiathèque d'hier — la classe du média, le fonds et les quatre critères nommés, toujours mot pour mot — et installe la borne de consultation. Écris deux recherches : l'une rend le média portant un titre exact, l'autre rend le premier média du fonds satisfaisant un critère quelconque reçu en paramètre. Toutes deux annoncent par leur type de retour qu'elles peuvent ne rien trouver. Le programme affiche d'abord les titres disponibles avec leur nombre, comme hier. Puis la borne traite trois demandes de visiteurs — « La Jetée », « Blade Runner » et « Dune » — et répond à chacune par une seule ligne : la fiche du média suivie de « en rayon » ou de « sorti », ou bien « titre absent du fonds ». Il pose ensuite un ticket de réservation sur « Blade Runner » et sur « La Jetée », étant entendu qu'un ticket ne s'imprime que pour un média qui existe <em>et</em> qui est sorti. Il affiche enfin quatre suggestions — un film en rayon, un format court en rayon, un titre antérieur à 1970 en rayon, une bande dessinée — puis la durée du Guépard et celle de Dune, et le total des minutes consultables en rayon.",
      "principe": "Une recherche est le lieu naturel de l'absence : demander, c'est accepter de ne pas trouver. Une fois que les deux recherches rendent une boîte, tout le reste du programme s'écrit sans une seule branche — la borne, les tickets et les suggestions traitent le cas « rien » exactement comme le cas « quelque chose ».",
      "reflexion": "La borne répond « titre absent du fonds » pour Dune, et le ticket de réservation ne s'imprime pas pour « La Jetée ». Ces deux silences ont des causes très différentes. Lesquelles, et le visiteur peut-il les distinguer d'après l'affichage ? Que faudrait-il changer pour qu'il le puisse — et est-ce souhaitable ?",
      "remarque": "La durée de Dune s'affiche à zéro minute alors que Dune n'est pas au catalogue, tandis que la durée d'un livre présent vaut aussi zéro. Le même chiffre recouvre donc « absent » et « sans durée » : le repli a écrasé la distinction que la boîte préservait. C'est le prix de la commodité, et il faut le payer en connaissance de cause.",
      "indices": [
        "Ouvre ta solution d'hier à côté. Ce qui reste : la classe du média, le fonds, les quatre critères, la première ligne d'affichage. Ce qui est neuf tient en deux méthodes de recherche et en trois blocs qui les utilisent. Écris d'abord en français, pour chacun des trois blocs, la phrase « pour chaque … , si … alors … sinon … » — puis constate en codant que le « sinon » disparaît.",
        "Le plan : la classe et les critères d'hier, la recherche par titre, la recherche par critère, puis quatre sections dans le programme principal — les disponibles, la borne, les tickets, les suggestions — et enfin les durées et le total des minutes.",
        "La recherche par critère mérite un instant de réflexion. Elle ne reçoit pas un titre ni un support, mais un critère entier, c'est-à-dire un test au sens de la leçon 21. Cela te permet d'appeler la même méthode pour un film disponible, un format court disponible ou une bande dessinée — en combinant tes critères nommés à l'appel. Une seule méthode, quatre suggestions.",
        "Le point dur est le ticket de réservation, parce qu'il porte deux conditions : le média doit exister et il doit être sorti. La tentation est de chercher le titre puis de tester la disponibilité sur le résultat — mais tu ne disposes pas d'un outil pour filtrer une boîte. Retourne le problème : mets les deux conditions dans le critère que tu passes à la recherche, en combinant un test sur le titre et la négation du critère de disponibilité. La boîte rendue est alors pleine exactement quand le ticket doit s'imprimer, et l'action conditionnelle fait le reste.",

      "solution": "// La mediatheque - jour 3 sur 4 : la borne de consultation.\n// Les quatre criteres nommes du jour 1 et les flux du jour 2 sont repris tels\n// quels ; ce qui est neuf, c'est que la borne sait maintenant dire « rien ».\nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.Optional;\nimport java.util.function.Predicate;\nimport java.util.stream.Collectors;\n\npublic class Mediatheque {\n\n    // Une recherche par titre exact : le titre demande peut ne pas exister.\n    static Optional<Media> parTitre(List<Media> fonds, String titre) {\n        return fonds.stream()\n                .filter(m -> m.getTitre().equals(titre))\n                .findFirst();\n    }\n\n    // Le premier media du fonds qui satisfait un critere, s'il y en a un.\n    static Optional<Media> premier(List<Media> fonds, Predicate<Media> critere) {\n        return fonds.stream()\n                .filter(critere)\n                .findFirst();\n    }\n\n    public static void main(String[] args) {\n        ArrayList<Media> fonds = new ArrayList<>();\n        fonds.add(new Media(\"Le Guépard\", \"film\", 1963, 205, true));\n        fonds.add(new Media(\"Kind of Blue\", \"disque\", 1959, 45, true));\n        fonds.add(new Media(\"Les Misérables\", \"livre\", 1862, 0, false));\n        fonds.add(new Media(\"Blade Runner\", \"film\", 1982, 117, false));\n        fonds.add(new Media(\"Le Sacre du printemps\", \"disque\", 1913, 33, true));\n        fonds.add(new Media(\"La Nuit des temps\", \"livre\", 1968, 0, true));\n        fonds.add(new Media(\"La Jetée\", \"film\", 1962, 28, true));\n\n        // Les memes criteres qu'aux jours 1 et 2, mot pour mot.\n        Predicate<Media> disponible = m -> m.estDisponible();\n        Predicate<Media> film = m -> m.getSupport().equals(\"film\");\n        Predicate<Media> avant1970 = m -> m.getAnnee() < 1970;\n        Predicate<Media> court = m -> m.getDureeMinutes() > 0 && m.getDureeMinutes() <= 60;\n\n        List<String> titresDisponibles = fonds.stream()\n                .filter(disponible)\n                .map(m -> m.getTitre())\n                .collect(Collectors.toList());\n        System.out.println(\"Disponibles (\" + titresDisponibles.size() + \") : \" + titresDisponibles);\n\n        // La borne : trois demandes de visiteurs, dont deux qui ne donneront rien.\n        System.out.println();\n        System.out.println(\"--- Borne de consultation ---\");\n        ArrayList<String> demandes = new ArrayList<>();\n        demandes.add(\"La Jetée\");\n        demandes.add(\"Blade Runner\");\n        demandes.add(\"Dune\");\n\n        for (String demande : demandes) {\n            Optional<Media> resultat = parTitre(fonds, demande);\n            // Une seule chaine : on transforme le contenu s'il existe, sinon on replie.\n            String reponse = resultat\n                    .map(m -> m.fiche() + (m.estDisponible() ? \" — en rayon\" : \" — sorti\"))\n                    .orElse(\"titre absent du fonds\");\n            System.out.println(demande + \" → \" + reponse);\n        }\n\n        // Le ticket de reservation ne s'imprime que si le media existe ET est sorti :\n        // les deux conditions sont reunies dans le critere, la boite fait le reste.\n        System.out.println();\n        Predicate<Media> bladeRunner = m -> m.getTitre().equals(\"Blade Runner\");\n        Predicate<Media> laJetee = m -> m.getTitre().equals(\"La Jetée\");\n        premier(fonds, bladeRunner.and(disponible.negate()))\n                .ifPresent(m -> System.out.println(\"Réservation posée sur : \" + m.getTitre()));\n        premier(fonds, laJetee.and(disponible.negate()))\n                .ifPresent(m -> System.out.println(\"Réservation posée sur : \" + m.getTitre()));\n\n        // Les suggestions du jour : chacune peut manquer, aucune ne fait planter.\n        System.out.println();\n        System.out.println(\"--- Suggestions ---\");\n        System.out.println(\"Film en rayon    : \"\n                + premier(fonds, film.and(disponible)).map(m -> m.getTitre()).orElse(\"aucun\"));\n        System.out.println(\"Format court     : \"\n                + premier(fonds, court.and(disponible)).map(m -> m.fiche()).orElse(\"aucun\"));\n        System.out.println(\"Avant 1970       : \"\n                + premier(fonds, avant1970.and(disponible)).map(m -> m.getTitre()).orElse(\"aucun\"));\n        System.out.println(\"Bande dessinée   : \"\n                + premier(fonds, m -> m.getSupport().equals(\"bd\")).map(m -> m.getTitre())\n                        .orElse(\"support non représenté\"));\n\n        // La duree d'un titre demande : deux transformations enchainees sur une boite.\n        System.out.println();\n        Optional<Integer> dureeGuepard = parTitre(fonds, \"Le Guépard\").map(m -> m.getDureeMinutes());\n        Optional<Integer> dureeDune = parTitre(fonds, \"Dune\").map(m -> m.getDureeMinutes());\n        System.out.println(\"Durée du Guépard : \" + dureeGuepard.orElse(0) + \" min\");\n        System.out.println(\"Durée de Dune    : \" + dureeDune.orElse(0) + \" min\");\n\n        int minutesEnRayon = fonds.stream()\n                .filter(disponible)\n                .mapToInt(m -> m.getDureeMinutes())\n                .sum();\n        System.out.println(\"Minutes consultables en rayon : \" + minutesEnRayon);\n    }\n}\n\nclass Media {\n    private String titre;\n    private String support;\n    private int annee;\n    private int dureeMinutes;\n    private boolean disponible;\n\n    Media(String titre, String support, int annee, int dureeMinutes, boolean disponible) {\n        this.titre = titre;\n        this.support = support;\n        this.annee = annee;\n        this.dureeMinutes = dureeMinutes;\n        this.disponible = disponible;\n    }\n\n    String getTitre() {\n        return titre;\n    }\n\n    String getSupport() {\n        return support;\n    }\n\n    int getAnnee() {\n        return annee;\n    }\n\n    int getDureeMinutes() {\n        return dureeMinutes;\n    }\n\n    boolean estDisponible() {\n        return disponible;\n    }\n\n    String fiche() {\n        String duree;\n        if (dureeMinutes == 0) {\n            duree = \"—\";\n        } else {\n            duree = dureeMinutes + \" min\";\n        }\n        return titre + \" (\" + support + \", \" + annee + \", \" + duree + \")\";\n    }\n}",
      "pourquoi": "Une seule méthode de recherche par critère sert les quatre suggestions, y compris celle qui ne trouvera jamais rien parce que le fonds ne contient aucune bande dessinée. Ce cas-là n'a demandé aucun code particulier : il emprunte le même chemin que les trois autres et se replie tout seul. Une abstraction se juge à cela — au nombre de cas particuliers qu'elle fait disparaître, pas au nombre de lignes qu'elle économise.",
