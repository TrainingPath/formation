<p>Aujourd'hui, aucune nouveauté Java : on traduit les grands algorithmes vus en pseudocode. Objectif : constater que tu SAIS déjà tout — il ne restait que la syntaxe. Les motifs de raisonnement sont identiques.</p>

<h3>2. Recherche séquentielle (parcourir jusqu'à trouver)</h3>
<pre class="pseudo">public static int chercher(int[] t, int cible) {   // renvoie l'indice de « cible », ou -1 si absente
    for (int i = 0; i &lt; t.length; i++) {           // on parcourt chaque case
        if (t[i] == cible) {
            return i;          // trouvé ! on renvoie tout de suite l'indice (retour anticipé)
        }
    }
    return -1;                 // arrivé ici, rien trouvé : convention Java, -1 = « absent »
}</pre>
<p>Le <code>return</code> dans la boucle interrompt dès qu'on trouve. On choisit <code>-1</code> pour « absent » car 0 est un indice VALIDE (la 1re case) : seul un indice impossible peut signaler l'échec.</p>

<h3>3. Maximum et sa position</h3>
<pre class="pseudo">public static int posMax(int[] t) {
    int pos = 0;                              // on suppose que le max est en case 0
    for (int i = 1; i &lt; t.length; i++) {      // on compare à partir de la case 1
        if (t[i] &gt; t[pos]) { pos = i; }       // si t[i] dépasse le champion, i devient la position du max
    }
    return pos;                               // on renvoie l'INDICE du plus grand (pas sa valeur)
}</pre>

<h3>4. Tri à bulles (échanges de voisins)</h3>
<pre class="pseudo">public static void triBulles(int[] t) {
    for (int passage = 1; passage &lt; t.length; passage++) {      // plusieurs passages
        for (int i = 0; i &lt; t.length - passage; i++) {          // la zone à trier rétrécit à chaque passage
            if (t[i] &gt; t[i + 1]) {                              // deux voisins mal ordonnés ?
                int aux = t[i];          // on les ÉCHANGE via une variable temporaire (leçon 2)
                t[i] = t[i + 1];         // t[i] reçoit le voisin de droite
                t[i + 1] = aux;          // le voisin reçoit l'ancienne valeur de t[i]
            }
        }
    }
}</pre>
<p>Noter le <code>void</code> ! Le tableau étant passé par référence (leçon 8), le tri modifie l'original en mémoire — pas besoin de <code>return</code>. La borne interne <code>t.length - passage</code> évite de revisiter la fin déjà triée.</p>

<h3>5. Dichotomie (diviser l'intervalle par deux, tableau TRIÉ)</h3>
<pre class="pseudo">public static int dichotomie(int[] t, int cible) {
    int gauche = 0, droite = t.length - 1;      // les deux bornes de la zone de recherche (0-indexées !)
    while (gauche &lt;= droite) {                   // tant que la zone n'est pas vide
        int milieu = (gauche + droite) / 2;     // indice du milieu (division entière, sans risque ici)
        if (t[milieu] == cible) { return milieu; }             // pile au milieu : trouvé
        else if (t[milieu] &lt; cible) { gauche = milieu + 1; }   // cible plus grande → chercher à DROITE
        else { droite = milieu - 1; }                          // cible plus petite → chercher à GAUCHE
    }
    return -1;                                  // zone épuisée : absente
}</pre>
<p>La dichotomie n'a de sens que sur un tableau <strong>trié</strong> : à chaque tour on élimine la moitié restante, d'où une recherche très rapide comparée au parcours séquentiel.</p>

ring tamponNom = parcelles[i];\n                    parcelles[i] = parcelles[i + 1];\n                    parcelles[i + 1] = tamponNom;\n                    echanges = echanges + 1;\n                }\n            }\n        }\n\n        System.out.println();\n        System.out.println(\"Après tri (\" + echanges + \" échanges) :\");\n        for (int i = 0; i < parcelles.length; i++) {\n            System.out.println(\"  \" + (i + 1) + \". \" + parcelles[i] + \" : \"\n                               + rendements[i] + \" hl/ha\");\n        }\n\n        System.out.println();\n        int cible = 47;\n        int trouve = dichotomie(rendements, cible);\n        System.out.println(\"Recherche de \" + cible + \" hl/ha par dichotomie : position \"\n                           + trouve + \" (\" + parcelles[trouve] + \")\");\n        int absent = dichotomie(rendements, 50);\n        System.out.println(\"Recherche de 50 hl/ha : position \" + absent);\n    }\n}",

         }\n        }\n    }\n\n    public static void main(String[] args) {\n        ArrayList<String> catalogue = new ArrayList<>();\n        catalogue.add(\"TOM-CERISE-2024\");\n        catalogue.add(\"HAR-FLAGEOLET-2024\");\n        catalogue.add(\"COU-BUTTERNUT-2023\");\n        catalogue.add(\"TOM-COEUR-2023\");\n        catalogue.add(\"RAD-ROSE-2024\");\n        catalogue.add(\"BAS-GRAND-2022\");\n        catalogue.add(\"POI-NAIN-2023\");\n        catalogue.add(\"TOM-NOIRE-2024\");\n        catalogue.add(\"CAR-NANTAISE-2023\");\n        catalogue.add(\"LAI-BATAVIA-2024\");\n        catalogue.add(\"EPI-GEANT-2022\");\n        catalogue.add(\"COU-SPAGHETTI-2024\");\n\n        Scanner clavier = new Scanner(System.in);\n        System.out.print(\"Code à retrouver : \");\n        String cible = clavier.nextLine().trim().toUpperCase();\n\n        int posAvant = chercheSequentiel(catalogue, cible);\n        int seqAvant = comparaisonsSequentielle;\n\n        trier(catalogue);\n\n        System.out.println();\n        System.out.println(\"=== Catalogue trié (\" + catalogue.size() + \" sachets) ===\");\n        for (int i = 0; i < catalogue.size(); i++) {\n            System.out.println(\"  \" + (i + 1) + \". \" + catalogue.get(i));\n        }\n\n        int posSeq = chercheSequentiel(catalogue, cible);\n        int posDic = chercheDichotomie(catalogue, cible);\n\n        System.out.println();\n        System.out.println(\"Recherche de \" + cible);\n        System.out.println(\"  avant tri, séquentielle : position \" + posAvant\n                           + \" en \" + seqAvant + \" comparaisons\");\n        System.out.println(\"  après tri, séquentielle : position \" + posSeq\n                           + \" en \" + comparaisonsSequentielle + \" comparaisons\");\n        System.out.println(\"  après tri, dichotomie : position \" + posDic\n                           + \" en \" + comparaisonsDichotomie + \" comparaisons\");\n    }\n}",
