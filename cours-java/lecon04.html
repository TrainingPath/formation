  title: "Lire au clavier avec Scanner",
  subtitle: "Le Lire(...) du jour 5 d'algorithmique devient un objet Scanner.",
  theory: `
<h3>1. Importer puis créer le Scanner</h3>
<p>En Java, lire ce que l'utilisateur tape au clavier passe par la classe <code>Scanner</code>. Une <strong>classe</strong>, c'est un plan de fabrication ; un <strong>objet</strong>, c'est un exemplaire concret fabriqué à partir de ce plan. Comme <code>Scanner</code> n'est pas disponible par défaut, on l'<strong>importe</strong> (on indique à Java où aller la chercher) en haut du fichier, puis on en crée un objet branché sur l'<strong>entrée standard</strong> (le clavier).</p>
<pre class="pseudo">import java.util.Scanner;                    // IMPORT : indique où trouver la classe Scanner (tout en haut du fichier)

public class Saisie {
    public static void main(String[] args) {
        Scanner clavier = new Scanner(System.in);   // new = FABRIQUE un objet Scanner branché sur System.in (le clavier)
        // ... on utilise l'objet « clavier » pour lire ...
    }
}</pre>
<p>Le mot <code>new</code> veut dire « fabrique-moi un nouvel objet ». Ici on obtient un objet <code>Scanner</code> qu'on nomme <code>clavier</code> : c'est comme un lecteur branché sur le clavier, prêt à récupérer ce que tu tapes.</p>

<h3>2. Les méthodes de lecture</h3>
<p>Une <strong>méthode</strong> est une action qu'un objet sait faire ; on la déclenche en écrivant le nom de l'objet, un point, puis le nom de la méthode suivi de parenthèses. Ainsi <code>clavier.nextInt()</code> se lit « demande à l'objet clavier de lire le prochain entier ».</p>
<pre class="pseudo">PSEUDOCODE            JAVA
Lire(n)  (ENTIER)     int n = clavier.nextInt();        // lit un entier tapé au clavier
Lire(x)  (REEL)       double x = clavier.nextDouble();  // lit un nombre à virgule
Lire(mot) (1 mot)     String mot = clavier.next();      // lit UN seul mot (s'arrête au 1er espace)
Lire(ligne entière)   String ligne = clavier.nextLine();// lit TOUTE la ligne (espaces compris)</pre>
<p>Chaque méthode attend une saisie du bon type. À la différence de C#/PHP, le Scanner convertit directement en nombre : pas besoin de transformer un texte en nombre après coup.</p>

<h3>3. Le schéma universel : invite → lecture → traitement → affichage</h3>
<pre class="pseudo">System.out.println("Quel âge as-tu ?");   // 1. INVITE : dire à l'utilisateur ce qu'on attend de lui
int age = clavier.nextInt();              // 2. LECTURE de la saisie et rangement dans age
int annee = 2026 - age;                   // 3. TRAITEMENT : le calcul
System.out.println("Née vers " + annee);  // 4. AFFICHAGE du résultat</pre>
<p>Toujours afficher l'invite AVANT de lire : sinon l'utilisateur voit un curseur clignoter sans savoir quoi taper.</p>

<h3>4. Concaténer pour afficher</h3>
<p>Le <code>&amp;</code> du pseudocode devient <code>+</code> : dès qu'une String est impliquée, <code>+</code> ne fait plus une addition mais une <strong>concaténation</strong> (il <strong>colle</strong> les textes bout à bout).</p>
<pre class="pseudo">System.out.println("Total : " + total + " €");  // colle le libellé, la valeur, l'unité
System.out.println("1" + 2);      // "12" : "1" est une String → concaténation (collage)
System.out.println(1 + 2);        // 3    : deux int → vraie addition
System.out.println("Somme : " + 1 + 2);   // « Somme : 12 » : de gauche à droite, tout se colle ← piège !
System.out.println("Somme : " + (1 + 2)); // « Somme : 3 » : les parenthèses forcent l'addition d'abord</pre>
<p>Règle : l'évaluation se fait de gauche à droite. Dès qu'une String apparaît, tout ce qui suit est concaténé. Les parenthèses permettent de calculer avant de coller.</p>

<h3>5. Le piège nextInt + nextLine</h3>
<pre class="pseudo">int age = clavier.nextInt();       // lit 15 mais LAISSE le « Entrée » (retour à la ligne) dans le tampon
String nom = clavier.nextLine();   // lit ce reste vide → nom = "" (chaîne vide) !!

// Solution : consommer le reste de ligne avec un nextLine() « poubelle »
int age = clavier.nextInt();       // lit le nombre
clavier.nextLine();                // vide le tampon (jette le « Entrée » resté en attente)
String nom = clavier.nextLine();   // lit maintenant correctement le vrai nom</pre>
<p>Le <strong>tampon</strong> est une petite file d'attente où sont stockés les caractères tapés, dans l'ordre. <code>nextInt()</code> y prend le nombre mais laisse traîner la touche « Entrée » ; c'est ce reste qui pollue la lecture de texte suivante.</p>
<div class="warn">Après un <code>nextInt()</code>/<code>nextDouble()</code>, ajoute un <code>nextLine()</code> « poubelle » avant de lire du texte : le <code>nextInt</code> ne consomme pas le retour à la ligne, qui « pollue » la lecture suivante. Piège archi-classique des examens !</div>
<div class="tip">Un seul Scanner par programme suffit : crée-le au début du <code>main</code> et réutilise-le partout, plutôt que d'en créer un à chaque lecture.</div>`,
  exercises: [

    { type: "qcm", q: "Que faut-il faire AVANT chaque lecture (bonne pratique du jour 5) ?", opts: ["Rien", "Afficher une invite : l'utilisateur doit savoir quoi taper", "Vider l'écran", "Fermer le Scanner"], a: 1, exp: "Invite → lecture → traitement → affichage : le schéma universel." },
    { type: "qcm", q: "Qu'affiche <code>System.out.println(\"1\" + 2 + 3);</code> ?", opts: ["6", "123 : dès la String rencontrée, tout devient concaténation (gauche à droite)", "15", "Erreur"], a: 1, exp: "\"1\"+2 → \"12\", puis \"12\"+3 → \"123\"." },

    { type: "qcm", q: "Comment afficher « Total : 7 » à partir de int a=3, b=4 ?", opts: ["println(\"Total : \" + a + b)", "println(\"Total : \" + (a + b))", "println(Total : a + b)", "println(\"Total : \", a + b)"], a: 1, exp: "Sans parenthèses : Total : 34 ! Le + concatène dès qu'une String précède." },
    { type: "qcm", q: "L'utilisateur tape 8 puis 5. <code>int a = clavier.nextInt(); int b = clavier.nextInt();</code> Que vaut a - b ?", opts: ["3", "-3", "85", "0"], a: 0, exp: "a=8, b=5 : les lectures se font dans l'ordre de saisie (jour 5 !)." },
    { type: "qcm", q: "Après <code>int n = clavier.nextInt();</code>, <code>clavier.nextLine()</code> renvoie souvent…", opts: ["Le nombre suivant", "Une chaîne vide : le reste de la ligne où était le nombre", "null", "Une erreur"], a: 1, exp: "Le « Entrée » traîne dans le tampon : c'est LE piège Scanner." },
    { type: "qcm", q: "La parade au piège nextInt + nextLine :", opts: ["Ne jamais lire de texte", "Un nextLine() « poubelle » entre les deux", "Deux Scanners", "Redémarrer le programme"], a: 1, exp: "On consomme la fin de ligne avant la vraie lecture de texte." },
    { type: "qcm", q: "L'utilisateur tape « Jean Dupont ». <code>String s = clavier.next();</code> Que contient s ?", opts: ["Jean Dupont", "Jean : next() s'arrête à l'espace", "Dupont", "Rien"], a: 1, exp: "Pour le nom complet, il fallait nextLine()." },
    { type: "qcm", q: "Le convertisseur euros→dollars du jour 5, ligne de traitement en Java :", opts: ["double dollars = euros * 1.08;", "dollars ← euros * 1.08", "double dollars == euros * 1.08;", "Lire(dollars)"], a: 0, exp: "La flèche devient =, le type se déclare, le ; conclut." },
    { type: "vf", q: "Il faut créer un nouveau Scanner avant chaque lecture.", a: false, exp: "Un seul Scanner, créé une fois, réutilisé partout." },
    { type: "qcm", q: "L'utilisateur tape 10. <code>int n = clavier.nextInt(); n = n * 2 + 1; System.out.println(n);</code> Affichage ?", opts: ["10", "21", "20", "101"], a: 1, exp: "10 × 2 + 1 = 21 : trace classique, syntaxe Java." }
  ],
  final: {
    title: "Exercice final — Le ticket de caisse (version Java)",
    intro: `<p>Traduction complète de l'exercice final du jour 5 d'algorithmique : prix unitaire, quantité, TVA 21 %. L'utilisateur tape <strong>10</strong> puis <strong>3</strong> puis son nom <strong>« Ana Lopez »</strong>.</p>
<pre class="pseudo">import java.util.Scanner;                          // importe la classe Scanner
public class Ticket {
    public static void main(String[] args) {
        Scanner clavier = new Scanner(System.in);  // crée le lecteur de clavier
        System.out.println("Prix unitaire ?");     // invite
        double prix = clavier.nextDouble();        // lit le prix (réel)
        System.out.println("Quantité ?");          // invite
        int quantite = clavier.nextInt();          // lit la quantité (entier)
        // (A) ???                                 // ligne manquante : quel appel faut-il ici ?
        System.out.println("Nom du client ?");     // invite
        String client = clavier.nextLine();        // lit tout le nom (avec l'espace)
        double ttc = prix * quantite * 1.21;       // calcule le total TTC (+21 %)
        System.out.println(client + " doit " + ttc + " €"); // affiche le résultat
    }
}</pre>`,
    questions: [
      { type: "qcm", q: "Sans la ligne (A), que contiendra <code>client</code> ?", opts: ["Ana Lopez", "Une chaîne vide : le piège nextInt/nextLine", "Ana", "10"], a: 1, exp: "Le « Entrée » du 3 traîne dans le tampon." },
      { type: "qcm", q: "Que doit contenir la ligne (A) ?", opts: ["clavier.close();", "clavier.nextLine(); (le nextLine poubelle)", "clavier.nextInt();", "Rien"], a: 1, exp: "On vide le tampon avant de lire le nom." },
      { type: "qcm", q: "Pourquoi <code>nextLine()</code> et pas <code>next()</code> pour le client ?", opts: ["C'est pareil", "« Ana Lopez » contient un espace : next() ne lirait que « Ana »", "next() est obsolète", "nextLine() est plus rapide"], a: 1, exp: "Ligne entière → nextLine()." },
      { type: "input", q: "Que vaut <code>ttc</code> ? (10 × 3 × 1.21)", a: ["36.3", "36,3"], ph: "nombre", exp: "36.3 € — comme au jour 5, au centime près." },
      { type: "qcm", q: "La dernière ligne affiche exactement…", opts: ["client doit ttc €", "Ana Lopez doit 36.3 €", "Ana doit 36 €", "Erreur"], a: 1, exp: "Variables hors guillemets = valeurs ; textes entre guillemets = tels quels (jour 5 !)." }
    ],
    solution: `<pre class="pseudo">import java.util.Scanner;
public class Ticket {
    public static void main(String[] args) {
        Scanner clavier = new Scanner(System.in);
        System.out.println("Prix unitaire ?");
        double prix = clavier.nextDouble();          // 10
        System.out.println("Quantité ?");
        int quantite = clavier.nextInt();            // 3
        clavier.nextLine();                          // (A) vide le tampon !

        String client = clavier.nextLine();          // Ana Lopez
        double ttc = prix * quantite * 1.21;         // 36.3
        System.out.println(client + " doit " + ttc + " €");
    }
}</pre>
<p>Invite → lecture → traitement → affichage, plus le nextLine poubelle : ton squelette pour TOUS les programmes interactifs à venir.</p>`
