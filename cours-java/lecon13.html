<h3>1. Le constructeur : naître avec ses valeurs</h3>
<p>À la leçon 12, on créait un objet vide puis on remplissait les attributs un à un — risqué (on peut en oublier un, ou créer un objet incohérent). Le <strong>constructeur</strong> est une méthode spéciale, appelée automatiquement par <code>new</code>, qui initialise l'objet d'un coup — comme une fiche de naissance à remplir obligatoirement :</p>
<pre class="pseudo">public class Compte {
    private String titulaire;                                  // private = inaccessible depuis l'extérieur
    private double solde;

    // CONSTRUCTEUR : même nom que la classe, AUCUN type de retour
    public Compte(String titulaire, double soldeInitial) {
        this.titulaire = titulaire;                            // range le paramètre dans l'attribut
        this.solde = soldeInitial;
    }
}
Compte c = new Compte("Ana", 100);    // new déclenche le constructeur → objet créé ET initialisé d'un coup</pre>

<h3>2. this : « moi, l'objet en cours »</h3>
<p>Quand le paramètre et l'attribut portent le même nom, <code>this.titulaire</code> désigne l'ATTRIBUT de l'objet et <code>titulaire</code> seul le paramètre. <code>this</code> représente l'objet sur lequel on travaille (« moi-même ») — il lève l'ambiguïté entre les deux.</p>

<h3>3. L'encapsulation : private + getters/setters</h3>
<p><strong>Encapsuler</strong>, c'est enfermer les données dans l'objet et n'y donner accès que par des portes contrôlées. Le mot-clé <code>private</code> ferme l'accès direct ; un <strong>getter</strong> est une porte de lecture, un <strong>setter</strong> une porte d'écriture.</p>
<pre class="pseudo">private double solde;                 // private : INTERDIT d'y toucher directement depuis l'extérieur

public double getSolde() {            // GETTER : offre une LECTURE contrôlée de l'attribut privé
    return solde;
}
public void setTitulaire(String t) {  // SETTER : offre une ÉCRITURE contrôlée
    if (t != null &amp;&amp; !t.isEmpty()) {  // avec VALIDATION : on refuse null et la chaîne vide
        this.titulaire = t;
    }
}</pre>
<pre class="pseudo">c.solde = -5000;          // ERREUR de compilation : solde est private, on ne peut pas le forcer ✓
c.deposer(30);            // la seule porte d'entrée : passer par les méthodes publiques (qui valident)</pre>
<div class="tip">Règle d'or : attributs <code>private</code>, méthodes publiques choisies avec soin. L'objet devient une forteresse : impossible de corrompre ses données sans passer par ses règles. C'est l'<strong>encapsulation</strong>.</div>

<h3>4. Pourquoi c'est puissant</h3>
<ul>
<li><strong>Validation centralisée</strong> : le setter vérifie UNE fois pour tous les appels — la règle ne peut pas être contournée.</li>
<li><strong>Liberté d'évolution</strong> : on peut changer la mécanique interne sans casser le code qui utilise la classe.</li>
<li><strong>Invariants garantis</strong> : un Compte ne peut JAMAIS se retrouver dans un état incohérent.</li>
</ul>

<h3>5. Surcharge de constructeurs</h3>
<pre class="pseudo">public Compte(String titulaire) {          // 2e constructeur, avec un seul paramètre
    this(titulaire, 0);                    // this(...) appelle L'AUTRE constructeur avec solde 0 (zéro duplication)
}
Compte c1 = new Compte("Ana", 100);        // utilise le constructeur à 2 paramètres
Compte c2 = new Compte("Bob");             // utilise le constructeur à 1 paramètre → solde 0 par défaut</pre>
<p>Plusieurs constructeurs de même nom mais aux paramètres différents peuvent coexister (surcharge). L'appel <code>this(...)</code> évite de répéter la logique d'initialisation : elle reste écrite une seule fois.</p>

<h3>6. toString : la carte d'identité affichable</h3>
<pre class="pseudo">public String toString() {                       // définit comment l'objet se présente en texte
    return titulaire + " (" + solde + " €)";
}
System.out.println(c1);        // affiche « Ana (100.0 €) » : toString est appelé AUTOMATIQUEMENT</pre>
<p>Sans <code>toString</code>, afficher un objet donnerait quelque chose comme <code>Compte@6f75e721</code> (le nom de la classe et une adresse mémoire) : illisible. Le définir rend tes objets présentables.</p>`,

<pre class="pseudo">public class Compte {
    private String titulaire;                    // attribut privé : le nom du titulaire
    private double solde;                         // attribut privé : l'argent disponible

    public Compte(String titulaire, double soldeInitial) { // constructeur à 2 paramètres
        this.titulaire = titulaire;              // range le nom dans l'attribut
        this.solde = (soldeInitial >= 0) ? soldeInitial : 0; // valide : un solde négatif devient 0
    }
    public double getSolde() { return solde; }    // getter : lecture seule du solde
    public void deposer(double m) {               // dépôt contrôlé
        if (m > 0) { solde += m; }                // n'accepte que les montants positifs
    }
    public boolean retirer(double m) {            // retrait contrôlé, renvoie true si réussi
        if (m > 0 &amp;&amp; m <= solde) { solde -= m; return true; } // montant valide ET solde suffisant
        return false;                             // sinon : refus, solde inchangé
    }
    public String toString() { return titulaire + " : " + solde + " €"; } // affichage lisible
}</pre>`,

      "solution": "// La fromagerie : un fromage nait complet, et ses donnees sont a l'abri.\n\npublic class Fromagerie {\n    public static void main(String[] args) {\n        // Le constructeur exige les quatre renseignements : impossible de\n        // fabriquer un fromage sans nom ou sans poids.\n        Fromage tomme = new Fromage(\"Tomme du Condroz\", \"vache\", 92, 1.8);\n        Fromage chevre = new Fromage(\"Crottin des Fagnes\", \"chèvre\", 21, 0.12);\n        Fromage bleu = new Fromage(\"Bleu de la Meuse\", \"vache\", 64, 2.4);\n\n        System.out.println(tomme.etiquette());\n        System.out.println(chevre.etiquette());\n        System.out.println(bleu.etiquette());\n\n        Fromage[] cave = {tomme, chevre, bleu};\n        int affines = 0;\n        double poidsTotal = 0.0;\n        double valeurTotale = 0.0;\n        for (Fromage f : cave) {\n            poidsTotal = poidsTotal + f.getPoidsKg();\n            valeurTotale = valeurTotale + f.prixVente();\n            if (f.estAffine()) {\n                affines = affines + 1;\n            }\n        }\n\n        System.out.println();\n        System.out.println(\"Meules en cave : \" + cave.length + \", dont \" + affines + \" affinées\");\n        System.out.println(\"Poids total : \" + Math.round(poidsTotal * 100) / 100.0 + \" kg\");\n        System.out.println(\"Valeur de la cave : \" + Math.round(valeurTotale * 100) / 100.0 + \" €\");\n\n        // Un affinage supplementaire passe par une methode, pas par une\n        // ecriture directe : le champ est hors d'atteinte.\n        chevre.affinerDe(45);\n        System.out.println();\n        System.out.println(\"Après 45 jours de plus : \" + chevre.etiquette());\n    }\n}\n\nclass Fromage {\n    // private : personne, hors de cette classe, ne peut lire ni ecrire\n    // directement ces champs. C'est l'encapsulation.\n    private String nom;\n    private String lait;\n    private int joursAffinage;\n    private double poidsKg;\n\n    // Le constructeur porte le nom de la classe et n'a pas de type de\n    // retour. this.nom designe le champ, nom designe le parametre.\n    Fromage(String nom, String lait, int joursAffinage, double poidsKg) {\n        this.nom = nom;\n        this.lait = lait;\n        this.joursAffinage = joursAffinage;\n        this.poidsKg = poidsKg;\n    }\n\n    // Getters : on donne a lire, on ne donne pas a ecrire.\n    String getNom() {\n        return nom;\n    }\n\n    double getPoidsKg() {\n        return poidsKg;\n    }\n\n    int getJoursAffinage() {\n        return joursAffinage;\n    }\n\n    boolean estAffine() {\n        return joursAffinage >= 60;\n    }\n\n    double prixVente() {\n        double prixKilo;\n        if (lait.equals(\"chèvre\")) {\n            prixKilo = 32.00;\n        } else {\n            prixKilo = 24.50;\n        }\n        // Une meule affinee vaut vingt pour cent de plus.\n        if (estAffine()) {\n            prixKilo = prixKilo * 1.20;\n        }\n        return Math.round(prixKilo * poidsKg * 100) / 100.0;\n    }\n\n    // Modifier par une methode qui SAIT ce qu'elle fait, plutot que par\n    // une ecriture libre : le nombre de jours ne peut que croitre.\n    void affinerDe(int jours) {\n        if (jours > 0) {\n            joursAffinage = joursAffinage + jours;\n        }\n    }\n\n    String etiquette() {\n        String etat;\n        if (estAffine()) {\n            etat = \"affiné\";\n        } else {\n            etat = \"jeune\";\n        }\n        return nom + \" (lait de \" + lait + \") — \" + joursAffinage + \" jours, \"\n               + poidsKg + \" kg, \" + etat + \", \" + prixVente() + \" €\";\n    }\n}",

      "solution": "// L'observatoire : un objet dont l'etat reste toujours coherent, parce\n// qu'aucun chemin ne permet de le rendre incoherent.\n\npublic class Observatoire {\n    public static void main(String[] args) {\n        Observation m31 = new Observation(\"M31 Andromède\", 3.4, 45);\n        // Second constructeur : l'exposition standard de 30 minutes.\n        Observation m42 = new Observation(\"M42 Orion\", 4.0);\n        Observation ngc = new Observation(\"NGC 7000\", 4.0, -12);   // exposition refusee\n\n        System.out.println(m31);\n        System.out.println(m42);\n        System.out.println(ngc);\n\n        System.out.println();\n        System.out.println(\"On tente de porter M31 à 0 minute d'exposition :\");\n        boolean accepte = m31.setMinutesExposition(0);\n        System.out.println(\"  accepté : \" + accepte + \" -> \" + m31);\n\n        System.out.println(\"On tente de porter M31 à 120 minutes :\");\n        accepte = m31.setMinutesExposition(120);\n        System.out.println(\"  accepté : \" + accepte + \" -> \" + m31);\n\n        Observation[] nuit = {m31, m42, ngc};\n        int total = 0;\n        Observation laPlusFaible = nuit[0];\n        for (Observation o : nuit) {\n            total = total + o.getMinutesExposition();\n            // Plus la magnitude est GRANDE, plus l'astre est faible :\n            // l'echelle est inversee, et c'est une source d'erreur classique.\n            if (o.getMagnitude() > laPlusFaible.getMagnitude()) {\n                laPlusFaible = o;\n            }\n        }\n        System.out.println();\n        System.out.println(\"Objets observés : \" + nuit.length);\n        System.out.println(\"Temps de pose cumulé : \" + total + \" min\");\n        System.out.println(\"Objet le plus faible : \" + laPlusFaible.getNom()\n                           + \" (magnitude \" + laPlusFaible.getMagnitude() + \")\");\n    }\n}\n\nclass Observation {\n    private static final int EXPOSITION_STANDARD = 30;\n    private static final int EXPOSITION_MIN = 5;\n    private static final int EXPOSITION_MAX = 90;\n\n    private String nom;\n    private double magnitude;\n    private int minutesExposition;\n\n    Observation(String nom, double magnitude, int minutesExposition) {\n        this.nom = nom;\n        this.magnitude = magnitude;\n        // La validation est DANS le constructeur : un objet ne peut pas\n        // exister avec une exposition absurde, meme une fraction de seconde.\n        if (minutesExposition < EXPOSITION_MIN || minutesExposition > EXPOSITION_MAX) {\n            this.minutesExposition = EXPOSITION_STANDARD;\n        } else {\n            this.minutesExposition = minutesExposition;\n        }\n    }\n\n    // Surcharge : ce constructeur delegue a l'autre par this(...), plutot\n    // que de recopier son contenu. Une regle ecrite deux fois divergera.\n    Observation(String nom, double magnitude) {\n        this(nom, magnitude, EXPOSITION_STANDARD);\n    }\n\n    String getNom() {\n        return nom;\n    }\n\n    double getMagnitude() {\n        return magnitude;\n    }\n\n    int getMinutesExposition() {\n        return minutesExposition;\n    }\n\n    // Un setter qui REFUSE et le dit. Un setter qui accepte tout n'est\n    // qu'un champ public avec des parentheses en plus.\n    boolean setMinutesExposition(int minutes) {\n        if (minutes < EXPOSITION_MIN || minutes > EXPOSITION_MAX) {\n            return false;\n        }\n        this.minutesExposition = minutes;\n        return true;\n    }\n\n    // toString est appelee automatiquement des qu'on affiche l'objet ou\n    // qu'on le concatene a du texte.\n    public String toString() {\n        return nom + \" — magnitude \" + magnitude + \", pose de \" + minutesExposition + \" min\";\n    }\n}",

      "enonce": "Nouvelle série sur quatre leçons. Une ville met des vélos en libre-service. Chaque vélo porte un code de la forme BXL-0142, une année de mise en service, un état — à la station ou en course — et un compteur de courses. Un vélo est disponible à sa création. Écris la classe : le code doit être normalisé en capitales et débarrassé de ses espaces au moment de la création, tous les champs doivent être hors d'atteinte, et deux méthodes seulement — louer et rendre — doivent pouvoir toucher à l'état. Chacune répond par vrai ou faux selon qu'elle a pu agir : on ne loue pas un vélo déjà parti, on ne rend pas un vélo déjà à la station. La location incrémente le compteur de courses. Ajoute une méthode de tarif — 1,20 € la course, 0,30 € de moins pour les vélos mis en service en 2020 ou avant — et une carte d'identité affichable. Le programme principal crée trois vélos dont un avec un code en minuscules, enchaîne deux locations et deux retours dont deux impossibles, puis affiche le nombre de vélos disponibles, le total des courses, le vélo le plus ancien et le tarif d'une course.",

      "solution": "// Le parc a velos partages - jour 1 sur 4.\n// Un velo nait complet et ne peut pas se retrouver dans un etat absurde :\n// loue deux fois, ou rendu alors qu'il est a la station.\n\npublic class ParcVelos {\n    public static void main(String[] args) {\n        Velo v1 = new Velo(\"BXL-0142\", 2021);\n        Velo v2 = new Velo(\"BXL-0317\", 2023);\n        Velo v3 = new Velo(\"bxl-0088\", 2019);   // code normalise a la naissance\n\n        System.out.println(v1);\n        System.out.println(v2);\n        System.out.println(v3);\n\n        System.out.println();\n        System.out.println(\"Location de \" + v1.getCode() + \" : \" + v1.louer());\n        System.out.println(\"Nouvelle tentative sur le même vélo : \" + v1.louer());\n        System.out.println(\"Retour de \" + v1.getCode() + \" : \" + v1.rendre());\n        System.out.println(\"Retour une seconde fois : \" + v1.rendre());\n\n        v2.louer();\n        v2.rendre();\n        v2.louer();\n        v2.rendre();\n\n        Velo[] parc = {v1, v2, v3};\n        int disponibles = 0;\n        int coursesTotales = 0;\n        Velo aReviser = parc[0];\n        for (Velo v : parc) {\n            coursesTotales = coursesTotales + v.getCourses();\n            if (v.estDisponible()) {\n                disponibles = disponibles + 1;\n            }\n            if (v.getAnneeMiseEnService() < aReviser.getAnneeMiseEnService()) {\n                aReviser = v;\n            }\n        }\n\n        System.out.println();\n        System.out.println(\"Vélos au parc : \" + parc.length + \", disponibles : \" + disponibles);\n        System.out.println(\"Courses effectuées : \" + coursesTotales);\n        System.out.println(\"Le plus ancien : \" + aReviser.getCode()\n                           + \" (\" + aReviser.getAnneeMiseEnService() + \")\");\n        System.out.println(\"Tarif d'une course sur \" + v2.getCode() + \" : \" + v2.tarifCourse() + \" €\");\n    }\n}\n\nclass Velo {\n    private static final double TARIF_BASE = 1.20;\n\n    private String code;\n    private int anneeMiseEnService;\n    private boolean disponible;\n    private int courses;\n\n    Velo(String code, int anneeMiseEnService) {\n        // La normalisation a lieu UNE fois, a la naissance. Ensuite, tout\n        // le programme peut compter sur un code en capitales.\n        this.code = code.trim().toUpperCase();\n        this.anneeMiseEnService = anneeMiseEnService;\n        this.disponible = true;\n        this.courses = 0;\n    }\n\n    String getCode() {\n        return code;\n    }\n\n    int getAnneeMiseEnService() {\n        return anneeMiseEnService;\n    }\n\n    int getCourses() {\n        return courses;\n    }\n\n    boolean estDisponible() {\n        return disponible;\n    }\n\n    // Ces deux methodes sont les SEULS chemins qui touchent a l'etat.\n    // C'est ce qui rend impossible une double location.\n    boolean louer() {\n        if (!disponible) {\n            return false;\n        }\n        disponible = false;\n        courses = courses + 1;\n        return true;\n    }\n\n    boolean rendre() {\n        if (disponible) {\n            return false;\n        }\n        disponible = true;\n        return true;\n    }\n\n    double tarifCourse() {\n        // Les velos anciens sont moins chers.\n        double tarif = TARIF_BASE;\n        if (anneeMiseEnService <= 2020) {\n            tarif = tarif - 0.30;\n        }\n        return Math.round(tarif * 100) / 100.0;\n    }\n\n    public String toString() {\n        String etat;\n        if (disponible) {\n            etat = \"à la station\";\n        } else {\n            etat = \"en course\";\n        }\n        return code + \" (mis en service en \" + anneeMiseEnService + \") — \" + etat\n               + \", \" + courses + \" course(s)\";\n    }\n}",

      "statement": "Crée une classe <code>CompteBancaire</code> avec un attribut privé <code>solde</code>, un constructeur (solde initial), une méthode <code>deposer(montant)</code>, une méthode <code>retirer(montant)</code> qui refuse si le solde est insuffisant, et un <code>getSolde()</code>. Teste-la dans un <code>main</code>.",
      "hints": [
        "private double solde; — privé pour que personne ne modifie le solde sans passer par les méthodes (encapsulation).",
        "Dans le constructeur : this.solde = soldeInitial; — this distingue l'attribut du paramètre.",
        "retirer : if (montant > solde) afficher un refus, sinon solde -= montant."
      ],
      "solution": "public class CompteBancaire {                    // déclaration de la classe\n    private double solde;                        // attribut PRIVÉ : inaccessible de l'extérieur\n\n    public CompteBancaire(double soldeInitial) { // constructeur : appelé par new\n        this.solde = soldeInitial;               // this.solde = l'attribut ; soldeInitial = le paramètre\n    }                                            // fin du constructeur\n\n    public void deposer(double montant) {        // méthode publique : le point d'entrée autorisé\n        solde += montant;                        // ajoute le montant au solde\n    }                                            // fin de deposer\n\n    public void retirer(double montant) {        // méthode de retrait avec contrôle\n        if (montant > solde) {                   // retrait supérieur au solde disponible ?\n            System.out.println(\"Refusé : solde insuffisant\"); // on refuse sans modifier le solde\n        } else {                                 // sinon le retrait est possible\n            solde -= montant;                    // retire le montant\n        }                                        // fin du contrôle\n    }                                            // fin de retirer\n\n    public double getSolde() {                   // « getter » : lecture seule du solde\n        return solde;                            // renvoie la valeur de l'attribut\n    }                                            // fin du getter\n\n    public static void main(String[] args) {    // programme de test\n        CompteBancaire c = new CompteBancaire(100); // crée un compte avec 100 € (appelle le constructeur)\n        c.deposer(50);                           // solde : 150\n        c.retirer(30);                           // solde : 120\n        c.retirer(500);                          // refusé : 500 > 120, message affiché\n        System.out.println(\"Solde final : \" + c.getSolde() + \" €\"); // affiche 120.0 €\n    }                                            // fin de main\n}                                                // fin de la classe",
      "note": "Solde final attendu : 120 €. Encapsulation = attributs privés + méthodes publiques.",
      "lang": "java",
      "atoi": {

      },

        "Le solde est un attribut privé, modifié via des méthodes.",
        "Un retrait supérieur au solde est refusé.",
        "La sortie affiche le refus puis le solde final."
      ]
    }
