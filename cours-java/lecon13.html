var DAY = {
  num: 13,
  title: "Constructeurs et encapsulation",
  subtitle: "Naître complet, vivre protégé : les objets bien élevés.",
  theory: `
<h3>1. Le constructeur : naître avec ses valeurs</h3>
<p>À la leçon 12, on créait un objet vide puis on remplissait les attributs un à un — risqué (on peut en oublier un, ou créer un objet incohérent). Le <strong>constructeur</strong> est une méthode spéciale, appelée automatiquement par <code>new</code>, qui initialise l'objet d'un coup — comme une fiche de naissance à remplir obligatoirement :</p>
<pre class="pseudo">public class Compte {
    private String titulaire;                                  // private = inaccessible depuis l'extérieur
    private double solde;

    // CONSTRUCTEUR : même nom que la classe, AUCUN type de retour
    public Compte(String titulaire, double soldeInitial) {
        this.titulaire = titulaire;                            // range le paramètre dans l'attribut
        this.solde = soldeInitial;
    }
}
Compte c = new Compte("Ana", 100);    // new déclenche le constructeur → objet créé ET initialisé d'un coup</pre>

<h3>2. this : « moi, l'objet en cours »</h3>
<p>Quand le paramètre et l'attribut portent le même nom, <code>this.titulaire</code> désigne l'ATTRIBUT de l'objet et <code>titulaire</code> seul le paramètre. <code>this</code> représente l'objet sur lequel on travaille (« moi-même ») — il lève l'ambiguïté entre les deux.</p>

<h3>3. L'encapsulation : private + getters/setters</h3>
<p><strong>Encapsuler</strong>, c'est enfermer les données dans l'objet et n'y donner accès que par des portes contrôlées. Le mot-clé <code>private</code> ferme l'accès direct ; un <strong>getter</strong> est une porte de lecture, un <strong>setter</strong> une porte d'écriture.</p>
<pre class="pseudo">private double solde;                 // private : INTERDIT d'y toucher directement depuis l'extérieur

public double getSolde() {            // GETTER : offre une LECTURE contrôlée de l'attribut privé
    return solde;
}
public void setTitulaire(String t) {  // SETTER : offre une ÉCRITURE contrôlée
    if (t != null &amp;&amp; !t.isEmpty()) {  // avec VALIDATION : on refuse null et la chaîne vide
        this.titulaire = t;
    }
}</pre>
<pre class="pseudo">c.solde = -5000;          // ERREUR de compilation : solde est private, on ne peut pas le forcer ✓
c.deposer(30);            // la seule porte d'entrée : passer par les méthodes publiques (qui valident)</pre>
<div class="tip">Règle d'or : attributs <code>private</code>, méthodes publiques choisies avec soin. L'objet devient une forteresse : impossible de corrompre ses données sans passer par ses règles. C'est l'<strong>encapsulation</strong>.</div>

<h3>4. Pourquoi c'est puissant</h3>
<ul>
<li><strong>Validation centralisée</strong> : le setter vérifie UNE fois pour tous les appels — la règle ne peut pas être contournée.</li>
<li><strong>Liberté d'évolution</strong> : on peut changer la mécanique interne sans casser le code qui utilise la classe.</li>
<li><strong>Invariants garantis</strong> : un Compte ne peut JAMAIS se retrouver dans un état incohérent.</li>
</ul>

<h3>5. Surcharge de constructeurs</h3>
<pre class="pseudo">public Compte(String titulaire) {          // 2e constructeur, avec un seul paramètre
    this(titulaire, 0);                    // this(...) appelle L'AUTRE constructeur avec solde 0 (zéro duplication)
}
Compte c1 = new Compte("Ana", 100);        // utilise le constructeur à 2 paramètres
Compte c2 = new Compte("Bob");             // utilise le constructeur à 1 paramètre → solde 0 par défaut</pre>
<p>Plusieurs constructeurs de même nom mais aux paramètres différents peuvent coexister (surcharge). L'appel <code>this(...)</code> évite de répéter la logique d'initialisation : elle reste écrite une seule fois.</p>

<h3>6. toString : la carte d'identité affichable</h3>
<pre class="pseudo">public String toString() {                       // définit comment l'objet se présente en texte
    return titulaire + " (" + solde + " €)";
}
System.out.println(c1);        // affiche « Ana (100.0 €) » : toString est appelé AUTOMATIQUEMENT</pre>
<p>Sans <code>toString</code>, afficher un objet donnerait quelque chose comme <code>Compte@6f75e721</code> (le nom de la classe et une adresse mémoire) : illisible. Le définir rend tes objets présentables.</p>`,

    { type: "qcm", q: "Un constructeur se reconnaît à…", opts: ["Son type void", "Son nom IDENTIQUE à la classe et son ABSENCE de type de retour", "Son mot-clé build", "Ses accolades"], a: 1, exp: "public Compte(...) dans la classe Compte." },
    { type: "qcm", q: "Quand le constructeur s'exécute-t-il ?", opts: ["À chaque appel de méthode", "Au moment du new : une fois par objet créé", "Au lancement du programme", "Jamais"], a: 1, exp: "new = allocation + appel du constructeur." },
    { type: "qcm", q: "Dans <code>this.titulaire = titulaire;</code>, this.titulaire désigne…", opts: ["Le paramètre", "L'ATTRIBUT de l'objet en cours (this = moi)", "Une variable locale", "La classe"], a: 1, exp: "this départage l'attribut du paramètre homonyme." },
    { type: "qcm", q: "Que provoque <code>c.solde = 999;</code> si solde est private ?", opts: ["solde vaut 999", "Erreur de COMPILATION : accès interdit hors de la classe", "Un avertissement", "solde vaut 0"], a: 1, exp: "La forteresse fonctionne dès la compilation." },
    { type: "qcm", q: "Un getter est…", opts: ["Une méthode qui modifie un attribut", "Une méthode publique de LECTURE d'un attribut privé (getSolde)", "Un constructeur", "Un import"], a: 1, exp: "Lecture contrôlée ; le setter est son pendant en écriture." },
    { type: "qcm", q: "Le grand intérêt d'un setter par rapport à un attribut public :", opts: ["C'est plus long", "Il peut VALIDER la valeur avant de l'accepter (refuser null, négatif…)", "Il est plus rapide", "Aucun"], a: 1, exp: "La validation vit en UN seul endroit, pour tous les appels." },

    { type: "qcm", q: "À quoi sert toString() ?", opts: ["À convertir en int", "À définir l'affichage de l'objet : System.out.println(c) l'appelle automatiquement", "À trier", "À cloner"], a: 1, exp: "Sans lui : Compte@1a2b3c (l'adresse) — illisible." },
    { type: "qcm", q: "Sans toString personnalisé, println(c1) affiche…", opts: ["Ana (100.0 €)", "Quelque chose comme Compte@6f75e721 : classe + code mémoire", "null", "Erreur"], a: 1, exp: "D'où l'utilité d'écrire son toString." },
    { type: "qcm", q: "Le setter setAge doit refuser les âges négatifs. Quel corps ?", opts: ["this.age = age;", "if (age >= 0) { this.age = age; }", "return age;", "age = this.age;"], a: 1, exp: "Le if de validation : l'invariant « âge jamais négatif » est garanti à vie." },
    { type: "qcm", q: "new Compte(\"Ana\") avec le constructeur chaîné : que vaut getSolde() ?", opts: ["null", "0 : le constructeur délègue avec solde 0", "100", "Erreur"], a: 1, exp: "La valeur par défaut choisie par le concepteur — toi." },
    { type: "qcm", q: "L'encapsulation permet de changer la mécanique interne (ex : stocker les centimes en long) sans…", opts: ["Recompiler", "Casser le code UTILISATEUR : getters et méthodes gardent la même signature", "Rien changer", "Payer"], a: 1, exp: "Le contrat public reste, l'intérieur évolue : la maintenance devient possible." },
    { type: "vf", q: "Si aucune validation n'est nécessaire aujourd'hui, un setter reste utile : on pourra en ajouter demain sans rien casser.", a: true, exp: "Le point d'entrée unique est un investissement." },
    { type: "qcm", q: "Quel trio résume l'objet « bien élevé » ?", opts: ["public partout", "Attributs private + constructeur complet + méthodes publiques choisies", "Trois constructeurs", "static + void + final"], a: 1, exp: "Naître complet (constructeur), vivre protégé (private), interagir par contrat (méthodes)." }
  ],
  final: {
    title: "Exercice final — La forteresse CompteBancaire",
    intro: `<p>Version finale et blindée du compte :</p>
<pre class="pseudo">public class Compte {
    private String titulaire;                    // attribut privé : le nom du titulaire
    private double solde;                         // attribut privé : l'argent disponible

    public Compte(String titulaire, double soldeInitial) { // constructeur à 2 paramètres
        this.titulaire = titulaire;              // range le nom dans l'attribut
        this.solde = (soldeInitial >= 0) ? soldeInitial : 0; // valide : un solde négatif devient 0
    }
    public double getSolde() { return solde; }    // getter : lecture seule du solde
    public void deposer(double m) {               // dépôt contrôlé
        if (m > 0) { solde += m; }                // n'accepte que les montants positifs
    }
    public boolean retirer(double m) {            // retrait contrôlé, renvoie true si réussi
        if (m > 0 &amp;&amp; m <= solde) { solde -= m; return true; } // montant valide ET solde suffisant
        return false;                             // sinon : refus, solde inchangé
    }
    public String toString() { return titulaire + " : " + solde + " €"; } // affichage lisible
}</pre>`,
    questions: [
      { type: "input", q: "<code>new Compte(\"Ana\", -50)</code> : que vaut getSolde() ?", a: "0", ph: "nombre", exp: "Le constructeur valide : un solde initial négatif devient 0. L'objet naît TOUJOURS cohérent." },
      { type: "qcm", q: "<code>c.deposer(-30);</code> :", opts: ["solde diminue de 30", "Rien : le if refuse les montants négatifs — un dépôt négatif serait un retrait déguisé !", "Erreur de compilation", "solde passe à -30"], a: 1, exp: "La validation ferme la porte aux détournements." },
      { type: "qcm", q: "Compte c = new Compte(\"Ana\", 100); c.retirer(40); c.retirer(80); Que vaut le solde et que retourne le 2ᵉ retirer ?", opts: ["-20 et true", "60 et false : le 2ᵉ retrait est refusé (80 > 60)", "60 et true", "100 et false"], a: 1, exp: "100−40 = 60 ; 80 > 60 → false, solde intact." },
      { type: "qcm", q: "System.out.println(c) affiche « Ana : 60.0 € » grâce à…", opts: ["Un getter", "toString(), appelé automatiquement par println", "Le constructeur", "private"], a: 1, exp: "La carte d'identité affichable." },
      { type: "qcm", q: "Il n'y a PAS de setSolde. Pourquoi est-ce un choix de conception ?", opts: ["Oubli", "Le solde ne doit évoluer QUE par deposer/retirer, qui portent les règles métier : un setSolde serait une brèche", "Les setters sont interdits", "Pour économiser une ligne"], a: 1, exp: "Exposer le minimum : chaque méthode publique est une promesse à tenir." }
    ],
    solution: `<pre class="pseudo">new Compte("Ana", -50)   → solde 0 (validé à la naissance)
deposer(-30)             → refusé (if m > 0)
new Compte("Ana", 100) → retirer(40) ✓ → 60 → retirer(80) ✗ → 60
println(c)               → "Ana : 60.0 €" (toString)

Invariant garanti À VIE : solde >= 0, quoi que fasse l'utilisateur.</pre>
<p>C'est ça, l'encapsulation : les règles vivent DANS l'objet, indéjouables. Demain : des classes qui héritent d'autres classes.</p>`
  }
};

    solution: "public class CompteBancaire {                    // déclaration de la classe\n    private double solde;                        // attribut PRIVÉ : inaccessible de l'extérieur\n\n    public CompteBancaire(double soldeInitial) { // constructeur : appelé par new\n        this.solde = soldeInitial;               // this.solde = l'attribut ; soldeInitial = le paramètre\n    }                                            // fin du constructeur\n\n    public void deposer(double montant) {        // méthode publique : le point d'entrée autorisé\n        solde += montant;                        // ajoute le montant au solde\n    }                                            // fin de deposer\n\n    public void retirer(double montant) {        // méthode de retrait avec contrôle\n        if (montant > solde) {                   // retrait supérieur au solde disponible ?\n            System.out.println(\"Refusé : solde insuffisant\"); // on refuse sans modifier le solde\n        } else {                                 // sinon le retrait est possible\n            solde -= montant;                    // retire le montant\n        }                                        // fin du contrôle\n    }                                            // fin de retirer\n\n    public double getSolde() {                   // « getter » : lecture seule du solde\n        return solde;                            // renvoie la valeur de l'attribut\n    }                                            // fin du getter\n\n    public static void main(String[] args) {    // programme de test\n        CompteBancaire c = new CompteBancaire(100); // crée un compte avec 100 € (appelle le constructeur)\n        c.deposer(50);                           // solde : 150\n        c.retirer(30);                           // solde : 120\n        c.retirer(500);                          // refusé : 500 > 120, message affiché\n        System.out.println(\"Solde final : \" + c.getSolde() + \" €\"); // affiche 120.0 €\n    }                                            // fin de main\n}                                                // fin de la classe",
    note: "Solde final attendu : 120 €. Encapsulation = attributs privés + méthodes publiques." }
