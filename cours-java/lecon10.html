var DAY = {
  num: 10,
  title: "ArrayList et for-each",
  subtitle: "Le tableau qui grandit tout seul.",
  theory: `
<h3>1. Le problème du tableau figé</h3>
<p><code>new int[10]</code> fait exactement 10 cases, pour toujours : impossible d'en ajouter ou d'en retirer. Or la vraie vie ajoute et retire sans cesse (paniers, inscriptions, messages…). La solution est l'<code>ArrayList</code> : une <strong>liste dynamique</strong>, c'est-à-dire une rangée de cases élastique qui s'allonge ou se raccourcit toute seule selon le nombre d'éléments qu'on y met.</p>

<h3>2. Créer et manipuler une liste</h3>
<pre class="pseudo">import java.util.ArrayList;                     // import nécessaire (où trouver la classe ArrayList)

ArrayList&lt;String&gt; noms = new ArrayList&lt;&gt;();     // crée une liste VIDE de String
noms.add("Ana");            // ajoute "Ana" à la FIN        [Ana]
noms.add("Bob");            //                             [Ana, Bob]
noms.add("Zoé");            //                             [Ana, Bob, Zoé]
noms.get(0)                 // → "Ana" : LIT l'élément d'indice 0 (0-indexé, méthode get, pas de crochets)
noms.set(1, "Max")          // REMPLACE l'élément d'indice 1  [Ana, Max, Zoé]
noms.remove(0)              // RETIRE l'élément d'indice 0    [Max, Zoé] — tout se décale à gauche !
noms.size()                 // → 2 : le NOMBRE d'éléments actuel
noms.contains("Zoé")        // → true : la valeur est-elle présente ?
noms.indexOf("Zoé")         // → 1 : l'indice de la valeur (ou -1 si absente)
noms.isEmpty()              // → false : la liste est-elle vide ?</pre>

<h3>3. Le type entre chevrons : les génériques</h3>
<pre class="pseudo">ArrayList&lt;String&gt; mots   = new ArrayList&lt;&gt;();   // liste qui ne contient QUE des String
ArrayList&lt;Integer&gt; notes = new ArrayList&lt;&gt;();   // liste d'entiers : Integer, pas int !</pre>
<div class="warn">Les chevrons <code>&lt;&gt;</code> (les « génériques » : ils précisent le type des éléments) n'acceptent pas les primitifs : on écrit <code>Integer</code>, <code>Double</code>, <code>Boolean</code> (les classes « enveloppes » qui emballent un primitif). Java convertit automatiquement <code>int ↔ Integer</code> (c'est l'<em>autoboxing</em>) : <code>notes.add(15)</code> fonctionne donc directement.</div>

<h3>4. Parcourir une liste</h3>
<pre class="pseudo">// PAR INDICES (accès à la position)
for (int i = 0; i &lt; noms.size(); i++) {        // size() remplace length ; < strict
    System.out.println(i + " : " + noms.get(i));  // get(i) lit l'élément d'indice i
}
// FOR-EACH (plus simple, pour juste lire chaque élément)
for (String nom : noms) {                       // « nom » prend tour à tour chaque élément de la liste
    System.out.println(nom);                    // on affiche l'élément courant
}</pre>

<h3>5. Le piège du remove en boucle</h3>
<pre class="pseudo">// SUPPRIMER tous les "spam" : chaque remove DÉCALE les éléments suivants vers la gauche !
for (int i = 0; i &lt; msgs.size(); i++) {
    if (msgs.get(i).equals("spam")) {          // equals car ce sont des String
        msgs.remove(i);                        // on retire l'élément d'indice i…
        i--;                                   // …et on RECULE : sinon on sauterait l'élément qui a pris sa place
    }
}</pre>
<p>Pourquoi <code>i--</code> ? Après <code>remove(i)</code>, l'élément suivant glisse à l'indice <code>i</code>. Sans reculer, le <code>i++</code> de la boucle passerait par-dessus lui : deux « spam » consécutifs, et le second échapperait au filtre.</p>

<h3>6. Tableau ou ArrayList ?</h3>
<pre class="pseudo">Taille fixe connue, performances brutes   → tableau int[]     // quand on connaît le nombre d'éléments
Ajouts/retraits, taille inconnue          → ArrayList         // quand la collection évolue</pre>
<div class="tip">Correspondances à mémoriser : <code>t.length</code> → <code>list.size()</code> · <code>t[i]</code> → <code>list.get(i)</code> · <code>t[i] = x</code> → <code>list.set(i, x)</code>. Les MOTIFS (somme, maximum, recherche…) restent identiques : seule la façon d'accéder aux éléments change.</div>`,
  exercises: [
    { type: "qcm", q: "Quel avantage d'ArrayList sur le tableau ?", opts: ["Plus rapide", "Sa taille varie : add et remove à volonté", "Accepte les primitifs", "Aucun"], a: 1, exp: "Le tableau est figé à la création ; la liste vit." },
    { type: "qcm", q: "Déclarer une liste de String :", opts: ["ArrayList<String> l = new ArrayList<>();", "String[] l = new ArrayList();", "ArrayList l = String;", "List<string> l;"], a: 0, exp: "Avec l'import java.util.ArrayList et le type entre chevrons." },
    { type: "qcm", q: "Une liste d'entiers se déclare…", opts: ["ArrayList<int>", "ArrayList<Integer> : les chevrons exigent la classe enveloppe", "ArrayList<entier>", "int<ArrayList>"], a: 1, exp: "int → Integer, double → Double, boolean → Boolean." },
    { type: "qcm", q: "Lire le 1ᵉʳ élément d'une liste l :", opts: ["l[0]", "l.get(0)", "l.first()", "l.get(1)"], a: 1, exp: "Pas de crochets sur les listes : get(indice), 0-indexé." },
    { type: "qcm", q: "La taille actuelle d'une liste :", opts: ["l.length", "l.size()", "l.length()", "l.count"], a: 1, exp: "Trio à mémoriser : tableau .length, String .length(), liste .size()." },
    { type: "input", q: "l = [Ana, Bob, Zoé] ; l.remove(0) ; que vaut l.get(0) ?", a: ["Bob", "bob"], ph: "texte", exp: "remove décale tout vers la gauche : Bob passe en tête." },
    { type: "input", q: "ArrayList<Integer> l vide ; l.add(5); l.add(9); l.set(0, 7); Que vaut l.get(0) + l.get(1) ?", a: "16", ph: "nombre", exp: "set remplace : [7, 9] → 16." },
    { type: "qcm", q: "<code>l.contains(\"Zoé\")</code> remplace quel algorithme du mois d'algo ?", opts: ["Le tri à bulles", "La recherche séquentielle avec drapeau (jour 16)", "Le max", "La dichotomie"], a: 1, exp: "En interne, Java parcourt et compare : ton jour 16, encapsulé." },
    { type: "qcm", q: "<code>l.indexOf(x)</code> retourne -1 quand…", opts: ["x est en tête", "x est ABSENT de la liste", "La liste est pleine", "x est null"], a: 1, exp: "Comme String.indexOf : -1 = pas trouvé." },
    { type: "qcm", q: "La boucle de parcours par indices d'une liste :", opts: ["for (int i = 0; i < l.size(); i++)", "for (int i = 1; i <= l.size(); i++)", "for (int i = 0; i <= l.size(); i++)", "while (l.next())"], a: 0, exp: "0 et < strict : le même duo que les tableaux." },
    { type: "qcm", q: "Le for-each <code>for (String s : l)</code> convient quand…", opts: ["On veut modifier les positions", "On LIT simplement chaque élément sans besoin d'indice", "On supprime des éléments", "Jamais"], a: 1, exp: "Lecture → for-each ; position ou modification structurelle → for classique." },
    { type: "qcm", q: "Pourquoi <code>i--</code> après un <code>remove(i)</code> en boucle ?", opts: ["Pour ralentir", "Le remove décale les suivants sur la position i : sans recul, on SAUTE un élément", "C'est inutile", "Pour sortir de la boucle"], a: 1, exp: "Deux « spam » consécutifs : sans i--, le second échappe au filtre." },
    { type: "input", q: "ArrayList<Integer> notes = [12, 8, 15] ; somme via for-each : <code>int s = 0; for (int n : notes) { s += n; }</code>. s = ?", a: "35", ph: "nombre", exp: "L'accumulateur du jour 12 marche avec toutes les structures." },
    { type: "qcm", q: "Gérer les inscriptions à un club (arrivées et départs imprévisibles) :", opts: ["String[200]", "ArrayList<String> : taille variable par nature", "int[]", "char[]"], a: 1, exp: "Ajouts/retraits → liste. Le critère de choix du jour." },
    { type: "qcm", q: "<code>l.isEmpty()</code> équivaut à…", opts: ["l == null", "l.size() == 0", "l.get(0) == null", "l.length == 0"], a: 1, exp: "Le test « vide » — pense au cas limite du jour 30 !" }
  ],
  final: {
    title: "Exercice final — La liste d'attente du cabinet",
    intro: `<p>Un cabinet médical gère sa salle d'attente avec une ArrayList (tiens, tiens… une FILE du jour 29 !) :</p>
<pre class="pseudo">ArrayList&lt;String&gt; attente = new ArrayList&lt;&gt;();  // liste vide des patients en attente
attente.add("Ana");                  // arrivée d'Ana        [Ana]
attente.add("Bob");                  // arrivée de Bob       [Ana, Bob]
attente.add("Zoé");                  // arrivée de Zoé       [Ana, Bob, Zoé]
String suivant = attente.remove(0);  // (1) remove(0) retire ET renvoie le premier de la file
attente.add("Max");                  // (2) nouvelle arrivée à la fin
// (3) Bob abandonne :
attente.remove("Bob");               // retire l'élément égal à "Bob" (par valeur, pas par indice)
System.out.println(attente.size() + " en attente, prochain : " + attente.get(0)); // taille + tête de file</pre>`,
    questions: [
      { type: "input", q: "(1) Que vaut <code>suivant</code> ?", a: ["Ana", "ana"], ph: "texte", exp: "remove(0) retire ET retourne la tête : premier arrivé, premier servi — FIFO !" },
      { type: "qcm", q: "Après (1) et (2), la liste contient…", opts: ["[Bob, Zoé, Max]", "[Ana, Bob, Zoé, Max]", "[Max, Bob, Zoé]", "[Zoé, Max]"], a: 0, exp: "Ana sortie, Max ajouté en fin : la file avance." },
      { type: "qcm", q: "Quelle structure du jour 29 cette gestion reproduit-elle ?", opts: ["Une pile (LIFO)", "Une FILE (FIFO) : add en fin = ENFILER, remove(0) = DÉFILER", "Un tableau 2D", "Un arbre"], a: 1, exp: "ArrayList sait jouer la file — les abstractions du jour 29 se construisent avec les outils du langage." },
      { type: "input", q: "Après (3), qu'affiche la dernière ligne ? (nombre + prochain)", a: ["2 en attente, prochain : Zoé", "2 en attente, prochain : Zoe"], ph: "n en attente, prochain : X", exp: "[Zoé, Max] : size 2, tête Zoé." },
      { type: "qcm", q: "Pour jouer une PILE (Ctrl+Z), quelles opérations sur ArrayList ?", opts: ["add(fin) + remove(0)", "add en fin + remove(size()-1) : on empile et dépile au MÊME bout", "remove(0) seulement", "Impossible"], a: 1, exp: "Même liste, autre discipline : le bout unique fait le LIFO. La structure suit la règle d'accès (jour 29)." }
    ],
    solution: `<pre class="pseudo">[Ana]                      add
[Ana, Bob]                 add
[Ana, Bob, Zoé]            add
suivant = "Ana"            remove(0)  → [Bob, Zoé]        DÉFILER
[Bob, Zoé, Max]            add        → ENFILER
remove("Bob")              → [Zoé, Max]
Affiche : 2 en attente, prochain : Zoé</pre>
<p>File = add en fin + remove(0). Pile = add en fin + remove(size()-1). L'ArrayList est le couteau suisse ; la DISCIPLINE d'accès fait la structure (jour 29). La semaine prochaine : la POO.</p>`
  }
};

var ECRITURE = {

  { id: "java-carnet", title: "Le carnet de notes (ArrayList)", level: 3,
    statement: "Avec une <code>ArrayList&lt;Double&gt;</code> : lis des notes au clavier (valeur négative pour arrêter), puis affiche le nombre de notes, la moyenne, et la liste des notes ≥ 10 (les réussites).",
    hints: [
      "import java.util.ArrayList; puis ArrayList<Double> notes = new ArrayList<>(); — ajoute avec notes.add(n).",
      "Boucle de saisie : while (true) { lire ; if (n < 0) break; notes.add(n); }",
      "Parcours avec for-each : for (double n : notes) { … } — une fois pour la somme, une fois pour filtrer les ≥ 10."
    ],
    solution: "import java.util.ArrayList;                      // import de la liste dynamique\nimport java.util.Scanner;                        // import pour la lecture clavier\n\npublic class CarnetDeNotes {                     // déclaration de la classe\n    public static void main(String[] args) {    // point d'entrée du programme\n        Scanner sc = new Scanner(System.in);     // crée le lecteur de clavier\n        ArrayList<Double> notes = new ArrayList<>(); // liste vide qui grandira toute seule\n\n        while (true) {                           // boucle « infinie »… jusqu'au break\n            System.out.print(\"Note (négatif pour finir) ? \"); // invite\n            double n = sc.nextDouble();          // lit la note du tour\n            if (n < 0) break;                    // valeur négative → on sort immédiatement\n            notes.add(n);                        // sinon on ajoute la note à la liste\n        }                                        // fin de la saisie\n\n        double somme = 0;                        // accumulateur pour la moyenne\n        for (double n : notes) {                 // for-each : n prend chaque valeur de la liste\n            somme += n;                          // accumule\n        }                                        // fin du 1er parcours\n        double moyenne = notes.isEmpty() ? 0 : somme / notes.size(); // évite la division par zéro\n\n        System.out.println(\"Nombre de notes : \" + notes.size()); // size() = nombre d'éléments\n        System.out.println(\"Moyenne : \" + moyenne); // affiche la moyenne\n        System.out.print(\"Réussites : \");        // libellé\n        for (double n : notes) {                 // 2e parcours de la liste\n            if (n >= 10) System.out.print(n + \" \"); // filtre : n'affiche que les >= 10\n        }                                        // fin du filtre\n        System.out.println();                    // retour à la ligne final\n    }                                            // fin de main\n}                                                // fin de la classe",
    note: "ArrayList grandit toute seule, contrairement au tableau : size() remplace length." }
  ]
};
