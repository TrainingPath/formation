  theory: `
<h3>1. Le problème : une caisse sans étiquette</h3>
<p>Imagine une caisse de rangement dans ta <strong>ludothèque</strong> sur laquelle rien n'est écrit. Tu y ranges des jeux… mais aussi, par erreur, une tasse à café. Le jour où tu prends « le premier objet » en pensant que c'est un jeu, tu te retrouves avec la tasse dans les mains. Avant Java 5, les listes étaient exactement ces caisses sans étiquette : elles acceptaient <strong>tout</strong>.</p>
<pre class="pseudo">ArrayList sac = new ArrayList();        // caisse SANS étiquette : elle accepte n'importe quoi
sac.add("Uno");                         // on met un texte
sac.add(42);                            // ...et un entier ! rien ne l'interdit
String jeu = (String) sac.get(1);       // on CROIT lire un texte, mais get(1) est l'entier 42
                                        // -> plantage à l'exécution : ClassCastException</pre>
<div class="warn">Le <strong>transtypage</strong> (le <code>(String)</code>, appelé aussi « cast ») veut dire « fais-moi confiance, c'est bien un String ». Si tu te trompes, l'erreur n'explose qu'À L'EXÉCUTION, quand le mal est fait.</div>

<h3>2. La solution : le générique, une étiquette collée sur la caisse</h3>
<p>Un <strong>générique</strong> est une étiquette que l'on colle sur une classe pour préciser le <em>type</em> qu'elle manipule. On l'écrit entre chevrons : <code>&lt;String&gt;</code>. La caisse devient « caisse à jeux » et refuse tout le reste, DÈS LA COMPILATION.</p>
<pre class="pseudo">ArrayList&lt;String&gt; sac = new ArrayList&lt;&gt;();   // caisse ÉTIQUETÉE : réservée aux String
sac.add("Uno");                              // OK, c'est bien un texte
sac.add(42);                                 // ERREUR de COMPILATION : le compilateur refuse
String jeu = sac.get(0);                      // plus besoin de cast : le compilateur SAIT que c'est un String</pre>
<div class="tip">Le <code>&lt;&gt;</code> vide à droite s'appelle le « diamant » (diamond) : depuis Java 7, on ne réécrit pas le type, le compilateur le devine à partir de la partie gauche.</div>

<h3>3. Le vocabulaire : type paramétré et argument de type</h3>
<p>On dit que <code>ArrayList&lt;String&gt;</code> est un <strong>type paramétré</strong> : <code>ArrayList</code> est la classe, et <code>String</code> est l'<strong>argument de type</strong> (le paramètre qu'on lui passe entre chevrons). C'est comme une recette de gâteau où tu remplaces « &lt;FRUIT&gt; » par « pomme » ou « poire » selon l'envie : une seule recette, plusieurs gâteaux.</p>

<h3>4. Écrire SA PROPRE classe générique</h3>
<p>On peut créer nos propres boîtes étiquetées. La lettre entre chevrons dans la déclaration est un <strong>paramètre de type</strong> : un nom de remplacement (par convention <code>T</code> pour « Type », <code>E</code> pour « Element »).</p>
<pre class="pseudo">public class Boite&lt;T&gt; {                 // T = un type « à trous », choisi plus tard par l'utilisateur
    private T contenu;                  // le champ interne est du type T (inconnu ici)
    public void ranger(T objet) {       // on ne peut ranger qu'un objet de type T
        this.contenu = objet;           // stockage
    }
    public T prendre() {               // la méthode RENVOIE un T
        return this.contenu;            // on rend l'objet rangé
    }
}
// Utilisation :
Boite&lt;String&gt; b = new Boite&lt;&gt;();       // ici T devient String pour CETTE boîte
b.ranger("Catan");                     // n'accepte que des String
String jeu = b.prendre();              // renvoie un String, sans cast</pre>

<h3>5. Les méthodes génériques</h3>
<p>Une <strong>méthode générique</strong> déclare son propre paramètre de type juste avant le type de retour. Elle sert à écrire UNE fonction qui marche pour tous les types.</p>
<pre class="pseudo">public static &lt;T&gt; T premier(ArrayList&lt;T&gt; liste) {   // &lt;T&gt; annonce : « je travaille avec un type T »
    return liste.get(0);                            // renvoie le 1er élément, du bon type
}
// premier(mesJeux) renvoie un String si mesJeux est une ArrayList&lt;String&gt;</pre>

<h3>6. Les bornes : limiter T à une famille (extends)</h3>
<p>Parfois on veut accepter « n'importe quel type, MAIS à condition qu'il sache faire quelque chose ». Une <strong>borne</strong> (bounded type) restreint T à une famille via <code>extends</code>. Par exemple, exiger que T soit un <code>Number</code> pour pouvoir l'additionner.</p>
<pre class="pseudo">public static double somme(ArrayList&lt;? extends Number&gt; nombres) {  // ? extends Number = « un type inconnu, du moment que c'est un Number »
    double total = 0;                                              // accumulateur
    for (Number n : nombres) {                                    // chaque élément est vu comme un Number
        total += n.doubleValue();                                 // doubleValue() existe sur tout Number
    }
    return total;                                                 // somme finale
}</pre>
<div class="tip">Le <code>?</code> s'appelle le <strong>joker</strong> (wildcard) : « un type que je ne nomme pas ». <code>&lt;? extends Number&gt;</code> = « Number ou l'une de ses sous-classes » (Integer, Double…). Utile quand on veut LIRE une collection sans connaître son type exact.</div>

<h3>7. Pourquoi c'est un progrès énorme</h3>
<p>Les génériques déplacent la détection des erreurs de type de l'exécution (trop tard, l'utilisateur plante) vers la compilation (tout de suite, sur ta machine). On appelle cela la <strong>sécurité de type</strong> (type safety). En prime : plus de casts partout, un code plus lisible.</p>`,

<pre class="pseudo">public class Coffre&lt;T&gt; {               // T : le type que ce coffre rangera
    private T objet;                   // le contenu, du type T
    public void deposer(T o) {         // n'accepte qu'un T

    }

    }
}

Coffre&lt;String&gt; c = new Coffre&lt;&gt;();   // (1) T devient String
c.deposer("Catan");                   // (2)
c.deposer(7);                          // (3)
String jeu = c.retirer();             // (4)</pre>`,

      { type: "vf", q: "(4) <code>String jeu = c.retirer()</code> ne nécessite aucun cast.", a: true, exp: "retirer() renvoie un T = String : le compilateur le sait." },
      { type: "qcm", q: "Quel intérêt d'avoir écrit <code>Coffre&lt;T&gt;</code> plutôt que <code>Coffre</code> avec un Object ?", opts: ["Cela réduit la taille du fichier .class", "La sécurité de type : on évite les mélanges et les casts risqués", "C'est plus court", "Ça va plus vite"], a: 1, exp: "T garantit un contenu homogène et un retour typé." }
    ],
    solution: `<pre class="pseudo">Coffre&lt;String&gt; c = new Coffre&lt;&gt;();   // T = String pour ce coffre
c.deposer("Catan");                   // OK : String attendu, String fourni
// c.deposer(7);                       // REFUSÉ à la compilation : 7 est un int
String jeu = c.retirer();             // renvoie un String, sans (String) devant
System.out.println(jeu);              // affiche : Catan</pre>
<p>Une seule classe générique sert pour des String, des Integer, des objets Jeu… avec la garantie qu'on ne mélange jamais les torchons et les serviettes. Prochaine étape : les lambdas, pour écrire des traitements en une ligne.</p>`

      "solution": "// L'atelier de menuiserie : une meme classe qui range n'importe quoi,\n// mais qui sait ce qu'elle range.\nimport java.util.ArrayList;\n\npublic class Menuiserie {\n\n    // Methode generique : le <T> devant le type de retour annonce que ce\n    // T est un parametre de la methode, pas une classe existante.\n    static <T> T premier(T[] tableau) {\n        if (tableau.length == 0) {\n            return null;\n        }\n        return tableau[0];\n    }\n\n    public static void main(String[] args) {\n        Etagere<String> essences = new Etagere<>(\"Essences en stock\");\n        essences.ajouter(\"chêne\");\n        essences.ajouter(\"hêtre\");\n        essences.ajouter(\"noyer\");\n        essences.ajouter(\"frêne\");\n\n        Etagere<Integer> longueurs = new Etagere<>(\"Longueurs en cm\");\n        longueurs.ajouter(180);\n        longueurs.ajouter(240);\n        longueurs.ajouter(300);\n\n        System.out.println(essences.inventaire());\n        System.out.println(longueurs.inventaire());\n\n        // Le compilateur SAIT que c'est un String : pas de conversion,\n        // et une faute de type serait refusee avant l'execution.\n        String derniereEssence = essences.dernier();\n        int derniereLongueur = longueurs.dernier();\n        System.out.println(\"Dernière essence rangée : \" + derniereEssence\n                           + \" (\" + derniereEssence.length() + \" lettres)\");\n        System.out.println(\"Dernière longueur rangée : \" + derniereLongueur\n                           + \" cm, soit \" + (derniereLongueur / 100.0) + \" m\");\n\n        String[] outils = {\"scie à onglet\", \"rabot\", \"ciseau à bois\"};\n        Integer[] diametres = {6, 8, 10, 12};\n        System.out.println();\n        System.out.println(\"Premier outil du râtelier : \" + premier(outils));\n        System.out.println(\"Premier diamètre de mèche : \" + premier(diametres) + \" mm\");\n\n        Etagere<String> vide = new Etagere<>(\"Étagère vide\");\n        System.out.println(vide.inventaire());\n        System.out.println(\"Vide ? \" + vide.estVide() + \", dernier : \" + vide.dernier());\n    }\n}\n\n// La classe generique. T n'est pas un type : c'est un emplacement pour\n// un type, que l'on remplira au moment de creer l'objet.\nclass Etagere<T> {\n    private String nom;\n    private ArrayList<T> contenu;\n\n    Etagere(String nom) {\n        this.nom = nom;\n        this.contenu = new ArrayList<>();\n    }\n\n    void ajouter(T element) {\n        contenu.add(element);\n    }\n\n    int taille() {\n        return contenu.size();\n    }\n\n    boolean estVide() {\n        return contenu.isEmpty();\n    }\n\n    T dernier() {\n        if (contenu.isEmpty()) {\n            return null;\n        }\n        return contenu.get(contenu.size() - 1);\n    }\n\n    String inventaire() {\n        return nom + \" : \" + taille() + \" élément(s) \" + contenu;\n    }\n}",

      "solution": "// Le laboratoire : une classe generique BORNEE. T n'est plus n'importe\n// quoi - c'est n'importe quel nombre, et cela change tout.\nimport java.util.ArrayList;\n\npublic class Laboratoire {\n    public static void main(String[] args) {\n        Serie<Double> ph = new Serie<>(\"pH des prélèvements\");\n        ph.ajouter(7.2);\n        ph.ajouter(6.8);\n        ph.ajouter(7.9);\n        ph.ajouter(7.1);\n        ph.ajouter(6.4);\n\n        Serie<Integer> colonies = new Serie<>(\"Colonies par boîte\");\n        colonies.ajouter(142);\n        colonies.ajouter(89);\n        colonies.ajouter(203);\n        colonies.ajouter(97);\n\n        System.out.println(ph.rapport());\n        System.out.println(colonies.rapport());\n\n        System.out.println();\n        System.out.println(\"Prélèvements hors norme (pH < 6,5 ou > 7,5) : \" + ph.horsBornes(6.5, 7.5));\n        System.out.println(\"Boîtes hors norme (moins de 100 colonies) : \" + colonies.horsBornes(100, 1000));\n\n        Serie<Double> vide = new Serie<>(\"Série non renseignée\");\n        System.out.println();\n        System.out.println(vide.rapport());\n    }\n}\n\n// T extends Number : la borne. Elle restreint ce qu'on peut mettre dans\n// la serie ET elle autorise, a l'interieur, d'appeler ce que tout nombre\n// sait faire. Sans elle, T serait un objet quelconque et l'on ne\n// pourrait rien en calculer.\nclass Serie<T extends Number> {\n    private String intitule;\n    private ArrayList<T> valeurs;\n\n    Serie(String intitule) {\n        this.intitule = intitule;\n        this.valeurs = new ArrayList<>();\n    }\n\n    void ajouter(T valeur) {\n        valeurs.add(valeur);\n    }\n\n    int taille() {\n        return valeurs.size();\n    }\n\n    double somme() {\n        double total = 0.0;\n        for (T v : valeurs) {\n            // doubleValue() : disponible parce que T est borne a Number.\n            total = total + v.doubleValue();\n        }\n        return total;\n    }\n\n    double moyenne() {\n        if (valeurs.isEmpty()) {\n            return 0.0;\n        }\n        return somme() / valeurs.size();\n    }\n\n    double maximum() {\n        if (valeurs.isEmpty()) {\n            return 0.0;\n        }\n        double record = valeurs.get(0).doubleValue();\n        for (T v : valeurs) {\n            if (v.doubleValue() > record) {\n                record = v.doubleValue();\n            }\n        }\n        return record;\n    }\n\n    double minimum() {\n        if (valeurs.isEmpty()) {\n            return 0.0;\n        }\n        double record = valeurs.get(0).doubleValue();\n        for (T v : valeurs) {\n            if (v.doubleValue() < record) {\n                record = v.doubleValue();\n            }\n        }\n        return record;\n    }\n\n    int horsBornes(double bas, double haut) {\n        int compte = 0;\n        for (T v : valeurs) {\n            if (v.doubleValue() < bas || v.doubleValue() > haut) {\n                compte = compte + 1;\n            }\n        }\n        return compte;\n    }\n\n    String rapport() {\n        if (valeurs.isEmpty()) {\n            return intitule + \" : aucune mesure\";\n        }\n        return String.format(\"%s : %d mesures, moyenne %.2f, de %.2f à %.2f\",\n                             intitule, taille(), moyenne(), minimum(), maximum());\n    }\n}",

      "hier": "lecon19.html",
      "enonce": "Dernier jour de la série, et deux défauts à supprimer. Le premier : les trois associations parallèles indexées par le nom du coureur, qui traînent depuis la leçon 18. Remplace-les par une seule association dont la valeur est un objet portant le nom, le nombre de sorties, les kilomètres, les minutes, et sachant calculer son allure. Le second : la recherche du meilleur, réécrite à chaque fois. Écris une classe générique de palmarès qui retient le meilleur élément selon un score, sans rien savoir de la nature de cet élément, et à qui l'on dit à la création si « meilleur » veut dire le plus petit ou le plus grand score. Le journal comptera six sorties du mois de mai : Salomé au Bois de la Cambre le 3 (15 km, 82 min) et sur la Côte du moulin le 17 (12,5 km, 76 min) ; Inès sur la Boucle du canal le 5 (8,2 km, 51 min) et au Bois de la Cambre le 24 (15 km, 95 min) ; Rachid sur la Boucle du canal le 10 (8,2 km, 39 min) et au Bois de la Cambre le 31 (15 km, 74 min). Le programme imprime le tableau aligné par coureur, puis se sert de <strong>deux palmarès du même type</strong> — l'un sur les coureurs pour la meilleure allure, l'autre sur les noms de parcours pour le plus couru.",

      "reflexion": "Fais le bilan de la série. Reprends ta solution du jour 2, celle aux trois associations parallèles, et celle d'aujourd'hui. Nomme deux erreurs que la première rendait possibles et que la seconde interdit. Puis réponds honnêtement à l'objection : le palmarès générique remplace deux boucles de cinq lignes par une classe de trente — en quoi est-ce un progrès, et dans quel cas cela n'en serait-il pas un ?",
      "remarque": "La récupération du bilan d'un coureur emploie un motif à connaître : on demande la valeur, et si elle est absente on en crée une qu'on dépose aussitôt. C'est le pendant, pour les objets, du comptage à valeur de repli de la leçon 18 — avec une différence importante : ici on veut modifier l'objet ensuite, il faut donc que ce soit bien celui qui est dans l'association.",
      "indices": [
        "Deux remplacements indépendants, à faire l'un après l'autre. Commence par l'objet de bilan : il porte ce que les trois associations portaient, et une méthode qui calcule l'allure à partir de ses propres champs. Fais tourner ton programme avec cette seule modification et vérifie que le tableau est inchangé, avant de toucher au palmarès.",
        "Le plan : la classe de bilan avec ses quatre champs et sa méthode d'ajout de sortie ; la classe générique de palmarès avec son intitulé, son sens de comparaison, son meilleur élément et son score ; puis le programme principal qui relit le journal en alimentant une seule association, imprime le tableau, et nourrit les deux palmarès avant de les interroger.",

      "solution": "// Le club de course a pied - jour 4 sur 4.\n// Les trois associations paralleles disparaissent : une seule, dont la\n// valeur porte les trois cumuls. Et le suivi des records devient une\n// classe generique, ecrite une fois et employee sur deux types.\nimport java.io.BufferedReader;\nimport java.io.FileReader;\nimport java.io.FileWriter;\nimport java.io.IOException;\nimport java.io.PrintWriter;\nimport java.time.LocalDate;\nimport java.util.ArrayList;\nimport java.util.HashMap;\n\npublic class ClubCourse {\n    static final String JOURNAL = \"sorties.csv\";\n\n    static void enregistrer(LocalDate jour, String coureur, String parcours,\n                            double km, int minutes) {\n        try (PrintWriter sortie = new PrintWriter(new FileWriter(JOURNAL, true))) {\n            sortie.println(jour + \";\" + coureur + \";\" + parcours + \";\" + km + \";\" + minutes);\n        } catch (IOException e) {\n            System.out.println(\"Sortie non enregistrée : \" + e.getMessage());\n        }\n    }\n\n    public static void main(String[] args) {\n        enregistrer(LocalDate.of(2026, 5, 3), \"Salomé\", \"Bois de la Cambre\", 15.0, 82);\n        enregistrer(LocalDate.of(2026, 5, 5), \"Inès\", \"Boucle du canal\", 8.2, 51);\n        enregistrer(LocalDate.of(2026, 5, 10), \"Rachid\", \"Boucle du canal\", 8.2, 39);\n        enregistrer(LocalDate.of(2026, 5, 17), \"Salomé\", \"Côte du moulin\", 12.5, 76);\n        enregistrer(LocalDate.of(2026, 5, 24), \"Inès\", \"Bois de la Cambre\", 15.0, 95);\n        enregistrer(LocalDate.of(2026, 5, 31), \"Rachid\", \"Bois de la Cambre\", 15.0, 74);\n\n        // UNE seule association : la valeur porte tout ce qui concerne\n        // un coureur. Plus rien a garder aligne.\n        HashMap<String, Bilan> bilans = new HashMap<>();\n        HashMap<String, Integer> passages = new HashMap<>();\n\n        try (BufferedReader entree = new BufferedReader(new FileReader(JOURNAL))) {\n            String ligne = entree.readLine();\n            while (ligne != null) {\n                String[] c = ligne.split(\";\");\n                String coureur = c[1];\n                String parcours = c[2];\n                double km = Double.parseDouble(c[3]);\n                int minutes = Integer.parseInt(c[4]);\n\n                Bilan b = bilans.get(coureur);\n                if (b == null) {\n                    b = new Bilan(coureur);\n                    bilans.put(coureur, b);\n                }\n                b.ajouterSortie(km, minutes);\n                passages.put(parcours, passages.getOrDefault(parcours, 0) + 1);\n\n                ligne = entree.readLine();\n            }\n        } catch (IOException e) {\n            System.out.println(\"Journal illisible : \" + e.getMessage());\n            return;\n        }\n\n        // Le meme Palmares, employe sur deux types differents et dans\n        // deux sens differents. C'est ce que le generique achete.\n        Palmares<Bilan> meilleureAllure = new Palmares<>(\"Meilleure allure moyenne\", true);\n        Palmares<String> parcoursPhare = new Palmares<>(\"Parcours le plus couru\", false);\n\n        ArrayList<String> coureurs = trier(new ArrayList<>(bilans.keySet()));\n        System.out.printf(\"%-8s %8s %9s %10s%n\", \"Coureur\", \"Sorties\", \"Km\", \"Allure\");\n        for (String nom : coureurs) {\n            Bilan b = bilans.get(nom);\n            System.out.printf(\"%-8s %8d %9.1f %10.2f%n\", b.getNom(), b.getSorties(),\n                              b.getKm(), b.allure());\n            meilleureAllure.proposer(b, b.allure());\n        }\n\n        for (String p : trier(new ArrayList<>(passages.keySet()))) {\n            parcoursPhare.proposer(p, passages.get(p));\n        }\n\n        System.out.println();\n        System.out.println(meilleureAllure.intitule() + \" : \"\n                           + meilleureAllure.getMeilleur().getNom()\n                           + \" (\" + arrondi(meilleureAllure.getScore()) + \" min/km)\");\n        System.out.println(parcoursPhare.intitule() + \" : \" + parcoursPhare.getMeilleur()\n                           + \" (\" + (int) parcoursPhare.getScore() + \" passages)\");\n    }\n\n    static double arrondi(double x) {\n        return Math.round(x * 100) / 100.0;\n    }\n\n    static ArrayList<String> trier(ArrayList<String> liste) {\n        for (int passe = 0; passe < liste.size() - 1; passe++) {\n            for (int i = 0; i < liste.size() - 1 - passe; i++) {\n                if (liste.get(i).compareTo(liste.get(i + 1)) > 0) {\n                    String t = liste.get(i);\n                    liste.set(i, liste.get(i + 1));\n                    liste.set(i + 1, t);\n                }\n            }\n        }\n        return liste;\n    }\n}\n\n// Le palmares generique : il retient le meilleur element selon un score,\n// sans rien savoir de ce qu'est cet element. Le booleen dit dans quel\n// sens se lit « meilleur » - une allure basse, un compte eleve.\nclass Palmares<T> {\n    private String intitule;\n    private boolean plusPetitEstMeilleur;\n    private T meilleur;\n    private double score;\n\n    Palmares(String intitule, boolean plusPetitEstMeilleur) {\n        this.intitule = intitule;\n        this.plusPetitEstMeilleur = plusPetitEstMeilleur;\n        this.meilleur = null;\n    }\n\n    void proposer(T element, double score) {\n        if (meilleur == null) {\n            this.meilleur = element;\n            this.score = score;\n            return;\n        }\n        boolean mieux;\n        if (plusPetitEstMeilleur) {\n            mieux = score < this.score;\n        } else {\n            mieux = score > this.score;\n        }\n        if (mieux) {\n            this.meilleur = element;\n            this.score = score;\n        }\n    }\n\n    String intitule() {\n        return intitule;\n    }\n\n    T getMeilleur() {\n        return meilleur;\n    }\n\n    double getScore() {\n        return score;\n    }\n}\n\nclass Bilan {\n    private String nom;\n    private int sorties;\n    private double km;\n    private int minutes;\n\n    Bilan(String nom) {\n        this.nom = nom;\n    }\n\n    void ajouterSortie(double km, int minutes) {\n        this.sorties = this.sorties + 1;\n        this.km = this.km + km;\n        this.minutes = this.minutes + minutes;\n    }\n\n    String getNom() {\n        return nom;\n    }\n\n    int getSorties() {\n        return sorties;\n    }\n\n    double getKm() {\n        return km;\n    }\n\n    double allure() {\n        if (km == 0) {\n            return 0;\n        }\n        return minutes / km;\n    }\n}",

      "solution": "import java.util.ArrayList;                          // import de la liste dynamique\n\npublic class Pile<T> {                               // classe générique : T sera choisi à l'usage\n    private ArrayList<T> elements = new ArrayList<>(); // stockage interne, typé T\n\n    public void empiler(T e) {                       // ajoute un élément au sommet\n        elements.add(e);                             // add() place à la fin de la liste\n    }\n\n    public T depiler() {                             // retire et renvoie le sommet (dernier entré)\n        if (elements.isEmpty()) {                    // sécurité : pile vide ?\n            return null;                             // rien à dépiler\n        }\n        return elements.remove(elements.size() - 1); // remove(dernierIndice) renvoie l'élément retiré\n    }\n\n    public boolean estVide() {                       // la pile est-elle vide ?\n        return elements.isEmpty();                   // délègue à la liste interne\n    }\n\n    public static void main(String[] args) {         // point d'entrée\n        Pile<String> jeux = new Pile<>();            // T devient String : une pile de jeux\n        jeux.empiler(\"Uno\");                        // on empile Uno\n        jeux.empiler(\"Catan\");                      // puis Catan (au sommet)\n        System.out.println(jeux.depiler());          // affiche Catan (dernier entré, premier sorti)\n        System.out.println(jeux.depiler());          // affiche Uno\n        System.out.println(jeux.estVide());          // affiche true : plus rien\n    }                                                // fin de main\n}                                                    // fin de la classe",
