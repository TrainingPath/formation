  title: "Expressions régulières (regex)",
  subtitle: "Décrire un MOTIF de texte : « trois lettres puis quatre chiffres », et laisser Java vérifier ou extraire.",
  theory: `
<h3>1. L'idée : décrire une forme, pas un texte précis</h3>
<p>Dans ta <strong>ludothèque</strong>, chaque jeu a un code de rangement : trois lettres majuscules, puis trois chiffres, par exemple <code>CAT042</code>. Tu ne veux pas vérifier un code précis, mais une FORME : « toujours 3 lettres + 3 chiffres ». Une <strong>expression régulière</strong> (regex, ou « regexp ») est un mini-langage pour décrire ce genre de motif.</p>
<pre class="pseudo">boolean ok = "CAT042".matches("[A-Z]{3}[0-9]{3}");  // le texte suit-il ce MOTIF ? -> true</pre>
<div class="tip">La méthode <code>String.matches(motif)</code> renvoie <code>true</code> si le texte ENTIER correspond au motif. C'est le point d'entrée le plus simple des regex en Java.</div>

<h3>2. Les briques de base</h3>
<pre class="pseudo">.        // un caractère QUELCONQUE (n'importe lequel, sauf saut de ligne)
[abc]    // UN caractère parmi a, b ou c (une « classe » de caractères)
[a-z]    // UN caractère entre a et z (un intervalle)
[A-Z]    // UN caractère majuscule
[0-9]    // UN chiffre
[^abc]   // UN caractère qui n'est NI a, NI b, NI c (le ^ dans les crochets = négation)</pre>

<h3>3. Les raccourcis avec antislash</h3>
<pre class="pseudo">\\d       // un chiffre         (équivaut à [0-9], « d » comme digit)
\\w       // un caractère de « mot » : lettre, chiffre ou _
\\s       // un espace blanc (espace, tabulation, saut de ligne)
\\.       // un POINT littéral (l'antislash « échappe » le point magique)</pre>
<div class="warn">Piège Java : dans une chaîne Java, l'antislash lui-même doit être DOUBLÉ. Le motif regex <code>\\d</code> s'écrit donc <code>"\\\\d"</code> dans le code Java. Un antislash pour le regex, un second pour la chaîne Java.</div>

<h3>4. Les quantificateurs : combien de fois ?</h3>
<pre class="pseudo">*        // 0 fois ou PLUS  (autant qu'on veut, éventuellement rien)
+        // 1 fois ou plus  (au moins une fois)
?        // 0 ou 1 fois     (facultatif)
{3}      // EXACTEMENT 3 fois
{2,5}    // entre 2 et 5 fois
{2,}     // au moins 2 fois</pre>
<pre class="pseudo">"aaa".matches("a+")       // true : « a » une fois ou plus
"".matches("a*")          // true : « a » zéro fois ou plus -> le vide passe
"12".matches("[0-9]{3}")  // false : il faut EXACTEMENT 3 chiffres, il n'y en a que 2</pre>

<h3>5. Les ancres et les groupes</h3>
<pre class="pseudo">^        // début de la chaîne
$        // fin de la chaîne
(abc)    // un GROUPE : traite « abc » comme un bloc
a|b      // ALTERNATIVE : « a » OU « b »
(chat|chien)  // « chat » ou « chien »</pre>
<div class="tip">Avec <code>matches()</code>, les ancres <code>^</code> et <code>$</code> sont implicites : le motif doit couvrir tout le texte. Elles servent surtout avec <code>Pattern</code>/<code>Matcher</code> pour chercher DANS un texte plus long.</div>

<h3>6. Chercher et extraire : Pattern et Matcher</h3>
<p>Pour trouver toutes les occurrences d'un motif dans un long texte, on compile le motif une fois (<code>Pattern</code>) puis on le fait glisser sur le texte (<code>Matcher</code>).</p>
<pre class="pseudo">import java.util.regex.Pattern;                 // le motif compilé
import java.util.regex.Matcher;                 // le chercheur qui glisse sur le texte

Pattern p = Pattern.compile("[0-9]+");          // compile le motif « un ou plusieurs chiffres »
Matcher m = p.matcher("Uno 8e, Catan 42e");     // prépare la recherche dans ce texte
while (m.find()) {                              // avance jusqu'à la prochaine correspondance
    System.out.println(m.group());              // group() = le morceau trouvé : « 8 » puis « 42 »
}</pre>

<h3>7. Remplacer et découper</h3>
<pre class="pseudo">"a1b2c3".replaceAll("[0-9]", "*")   // remplace chaque chiffre par * -> « a*b*c* »
"Uno,Catan,Risk".split(",")          // découpe sur les virgules -> [Uno, Catan, Risk]
"un   deux".split("\\s+")            // découpe sur un ou plusieurs espaces -> [un, deux]</pre>
<p>Les regex sont l'outil universel pour valider une saisie (code, email, date), nettoyer du texte ou extraire des informations. Un motif bien écrit remplace des dizaines de lignes de <code>if</code>.</p>`,

// En Java pur : "[0-9]" évite l'antislash ; sinon \\d s'écrit "\\\\d".</pre>
<p>Un motif compact remplace une avalanche de tests caractère par caractère. Prochaine leçon : immutabilité et StringBuilder, pour manipuler du texte efficacement.</p>`

      "solution": "// Le controle technique : verifier des FORMES, pas des valeurs.\nimport java.util.ArrayList;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic class ControleTechnique {\n\n    // Une plaque belge : un chiffre, trois majuscules, trois chiffres, separes par des tirets.\n    static final String PLAQUE = \"[0-9]-[A-Z]{3}-[0-9]{3}\";\n    // Une date de convocation : deux chiffres, deux chiffres, quatre chiffres.\n    static final String DATE = \"\\\\d{2}/\\\\d{2}/\\\\d{4}\";\n    // Un numero de chassis : dix-sept caracteres de mot, majuscules ou chiffres.\n    static final String CHASSIS = \"[A-Z0-9]{17}\";\n\n    static String verdict(String texte, String motif) {\n        if (texte.matches(motif)) {\n            return \"accepté\";\n        }\n        return \"refusé\";\n    }\n\n    public static void main(String[] args) {\n        ArrayList<String> plaques = new ArrayList<>();\n        plaques.add(\"1-ABC-123\");\n        plaques.add(\"2-XYZ-999\");\n        plaques.add(\"1-abc-123\");\n        plaques.add(\"12-ABC-123\");\n        plaques.add(\"1-AB-123\");\n\n        System.out.println(\"--- Plaques ---\");\n        for (String p : plaques) {\n            System.out.println(\"  \" + p + \" : \" + verdict(p, PLAQUE));\n        }\n\n        System.out.println();\n        System.out.println(\"--- Dates de convocation ---\");\n        System.out.println(\"  06/08/2026 : \" + verdict(\"06/08/2026\", DATE));\n        System.out.println(\"  6/8/2026 : \" + verdict(\"6/8/2026\", DATE));\n        System.out.println(\"  99/99/9999 : \" + verdict(\"99/99/9999\", DATE));\n\n        System.out.println();\n        System.out.println(\"--- Châssis ---\");\n        System.out.println(\"  VF7XKHMZ8KZ012345 : \" + verdict(\"VF7XKHMZ8KZ012345\", CHASSIS));\n        System.out.println(\"  VF7XKHMZ8KZ01234 : \" + verdict(\"VF7XKHMZ8KZ01234\", CHASSIS));\n\n        // Les quantificateurs, sur des cas minuscules pour bien les voir.\n        System.out.println();\n        System.out.println(\"--- Quantificateurs ---\");\n        System.out.println(\"  « aaa » contre a+ : \" + \"aaa\".matches(\"a+\"));\n        System.out.println(\"  vide contre a+ : \" + \"\".matches(\"a+\"));\n        System.out.println(\"  vide contre a* : \" + \"\".matches(\"a*\"));\n        System.out.println(\"  « 12 » contre [0-9]{3} : \" + \"12\".matches(\"[0-9]{3}\"));\n        System.out.println(\"  « ABC » contre [A-Z]{2,5} : \" + \"ABC\".matches(\"[A-Z]{2,5}\"));\n        System.out.println(\"  « essence » contre (essence|diesel) : \"\n                + \"essence\".matches(\"(essence|diesel)\"));\n        System.out.println(\"  « gpl » contre (essence|diesel) : \"\n                + \"gpl\".matches(\"(essence|diesel)\"));\n\n        // Chercher DANS un texte, au lieu de valider un texte entier.\n        String rapport = \"Rendez-vous 14h30, quai 2, véhicule 1-ABC-123, 87500 km au compteur.\";\n        Pattern nombres = Pattern.compile(\"[0-9]+\");\n        Matcher chercheur = nombres.matcher(rapport);\n        String trouves = \"\";\n        while (chercheur.find()) {\n            trouves = trouves + chercheur.group() + \" \";\n        }\n        System.out.println();\n        System.out.println(\"Nombres du rapport : \" + trouves.trim());\n\n        // La plaque dans la phrase : le motif est le meme, on le CHERCHE au lieu de valider.\n        Matcher surLaPlaque = Pattern.compile(PLAQUE).matcher(rapport);\n        if (surLaPlaque.find()) {\n            System.out.println(\"Plaque relevée : \" + surLaPlaque.group());\n        }\n\n        // Masquer et decouper.\n        System.out.println();\n        System.out.println(\"Châssis masqué : \" + \"VF7XKHMZ8KZ012345\".replaceAll(\"[0-9]\", \"•\"));\n        String ligne = \"1-ABC-123;essence;2015;87500\";\n        String[] champs = ligne.split(\";\");\n        System.out.println(\"Champs : \" + champs.length + \" → plaque \" + champs[0]\n                + \", carburant \" + cha       "enonce": "Le gérant d'une station-service saisit ses passages à la main, une ligne par plein : date au format année-mois-jour, point-virgule, carburant parmi SP95, SP98 et DIESEL, point-virgule, litres avec un à trois décimales, point-virgule, prix au litre avec exactement trois décimales. Voici ce qu'il a tapé cette semaine : <code>2026-08-01;SP95;42.310;1.729</code>, <code>2026-08-02;DIESEL;58,700;1,689</code>, <code>2026-08-03;SP98;30.000;1.879</code>, <code>2026-08-04;GPL;25.000;0.899</code>, <code>2026-8-5;SP95;20.000;1.729</code> et <code>2026-08-06;SP95;12.450;1.735</code>. Écris un motif unique décrivant une ligne valide, ramène d'abord les virgules décimales à des points, puis trie les saisies en retenues et rejetées en affichant chacune avec sa marque. Transforme les lignes retenues en fiches cartonnées, imprime le journal avec le montant de chaque plein arrondi au centime, puis le total des litres et des euros. Désigne le passage le plus cher au moyen d'un juge de la leçon 25. Cherche ensuite toutes les dates dans le carnet libre du gérant, montre que le même motif de date accepte 2026-13-45, anonymise un numéro de carte dans un ticket, et compare enfin le motif strict de date à un motif entouré de « n'importe quoi » sur le texte « xx2026-08-06xx ».",
      "principe": "Une donnée saisie à la main est irrégulière par nature. Le motif ne sert pas à corriger cette irrégularité, il sert à la constater et à séparer, une fois pour toutes et au plus tôt, ce qui est exploitable de ce qui ne l'est pas. Tout ce qui passe le filtre peut ensuite être traité sans une seule vérification supplémentaire.",

      "reflexion": "Deux saisies sur six sont rejetées, et le programme se contente de les afficher. Dans une vraie station, que devrait-il en faire ? Énumère trois traitements possibles, du plus laxiste au plus strict, et dis lequel tu choisirais si les chiffres servaient à une déclaration fiscale.",
      "remarque": "Le total en euros est calculé à partir des litres et du prix au litre, jamais à partir des montants arrondis affichés. C'est délibéré : additionner des arrondis fait dériver le total de quelques centimes, et cette dérive est la signature d'un logiciel de comptabilité mal écrit. On arrondit à l'affichage, jamais au calcul.",
      "indices": [
        "Découpe le problème en trois passes bien séparées, et résiste à la tentation de les mélanger. Passe 1 : normaliser et trier le bon grain de l'ivraie, sans rien interpréter. Passe 2 : transformer ce qui a survécu en fiches, sans rien vérifier — la passe 1 s'en est chargée. Passe 3 : calculer et afficher. Chaque passe a une responsabilité et une seule.",
        "Le plan : la fiche du passage ; le motif d'une ligne valide, en constante nommée ; une fonction de normalisation ; une fonction de lecture qui découpe et construit la fiche ; puis les trois passes ; puis le juge et le passage le plus cher ; enfin les démonstrations sur le carnet, la date impossible, la carte et le motif trop permissif.",
        "Construis ton motif de ligne morceau par morceau, en testant après chaque ajout. D'abord la date seule, puis la date suivie du point-virgule et de l'alternative des carburants, et ainsi de suite. Un motif de soixante caractères écrit d'un trait ne se débogue pas — un motif construit en quatre étapes se débogue à chaque étape.",
        "Le point dur est l'ordre des opérations. Le gérant tape parfois des virgules décimales ; si tu contrôles la forme avant de les remplacer, ces lignes seront rejetées alors qu'elles sont parfaitement lisibles. Normalise donc d'abord, contrôle ensuite — et note que la ligne rejetée doit être affichée dans sa version d'origine, celle que le gérant reconnaîtra, pas dans sa version normalisée. Cela veut dire que tu manipules deux variables : la brute et la normalisée.",
        "Ton fichier ressemble à ceci :<br><code>record Passage(String date, String carburant, double litres, double …) { }</code><br><code>static final String TICKET =</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;\"\\\\d{4}-\\\\d{2}-\\\\d{2};(SP95|…|…);…\";</code><br><code>static String normaliser(String ligne) { return ligne.replaceAll(\",\", …); }</code><br><code>String[] champs = ligne.split(…);</code><br><code>new Passage(champs[0], champs[1], Double.parseDouble(champs[2]), …)</code><br><code>Math.round(montant * 100) / 100.0</code> ← l'arrondi d'affichage<br><code>Comparator&lt;Passage&gt; parMontant = Comparator.comparing(p -&gt; …);</code><br><code>Pattern.compile(\"\\\\d{4}-\\\\d{2}-\\\\d{2}\").matcher(carnet)</code><br><code>ticket.replaceAll(\"[0-9]{4} [0-9]{4} [0-9]{4} \", …)</code>"
      ],
      "solution": "// La station-service : un ticket par passage, saisi a la main, donc irregulier.\n// Le motif fait le tri entre ce qui est exploitable et ce qui ne l'est pas.\nimport java.util.ArrayList;\nimport java.util.Comparator;\nimport java.util.List;\nimport java.util.Optional;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\nimport java.util.stream.Collectors;\n\npublic class StationService {\n\n    record Passage(String date, String carburant, double litres, double prixLitre) { }\n\n    // Un ticket bien forme : date;carburant;litres;prix, les decimaux au point.\n    static final String TICKET =\n            \"\\\\d{4}-\\\\d{2}-\\\\d{2};(SP95|SP98|DIESEL);\\\\d+\\\\.\\\\d{1,3};\\\\d\\\\.\\\\d{3}\";\n\n    // La virgule decimale des saisies manuelles se ramene au point.\n    static String normaliser(String ligne) {\n        return ligne.replaceAll(\",\", \".\");\n    }\n\n    static Passage lire(String ligne) {\n        String[] champs = ligne.split(\";\");\n        return new Passage(champs[0], champs[1],\n                Double.parseDouble(champs[2]), Double.parseDouble(champs[3]));\n    }\n\n    public static void main(String[] args) {\n        ArrayList<String> saisies = new ArrayList<>();\n        saisies.add(\"2026-08-01;SP95;42.310;1.729\");\n        saisies.add(\"2026-08-02;DIESEL;58,700;1,689\");\n        saisies.add(\"2026-08-03;SP98;30.000;1.879\");\n        saisies.add(\"2026-08-04;GPL;25.000;0.899\");\n        saisies.add(\"2026-8-5;SP95;20.000;1.729\");\n        saisies.add(\"2026-08-06;SP95;12.450;1.735\");\n\n        // Premiere passe : normaliser, puis accepter ou rejeter selon la FORME.\n        ArrayList<String> retenues = new ArrayList<>();\n        ArrayList<String> rejetees = new ArrayList<>();\n        System.out.println(\"--- Contrôle des saisies ---\");\n        for (String brute : saisies) {\n            String ligne = normaliser(brute);\n            if (ligne.matches(TICKET)) {\n                retenues.add(ligne);\n                System.out.println(\"  ✓ \" + ligne);\n            } else {\n                rejetees.add(brute);\n                System.out.println(\"  ✗ \" + brute);\n            }\n        }\n        System.out.println(\"Retenues : \" + retenues.size() + \" — rejetées : \" + rejetees.size());\n\n        // Deuxieme passe : les lignes retenues deviennent des fiches.\n        List<Passage> passages = retenues.stream()\n                .map(l -> lire(l))\n                .collect(Collectors.toList());\n\n        System.out.println();\n        System.out.println(\"--- Journal ---\");\n        for (Passage p : passages) {\n            double montant = p.litres() * p.prixLitre();\n            System.out.println(\"  \" + p.date() + \" \" + p.carburant() + \" : \"\n                    + p.litres() + \" L à \" + p.prixLitre() + \" € → \"\n                    + Math.round(montant * 100) / 100.0 + \" €\");\n        }\n\n        double totalLitres = passages.stream().mapToDouble(p -> p.litres()).sum();\n        double totalEuros = passages.stream()\n                .mapToDouble(p -> p.litres() * p.prixLitre())\n                .sum();\n        System.out.println(\"Total : \" + Math.round(totalLitres * 100) / 100.0 + \" L pour \"\n                + Math.round(totalEuros * 100) / 100.0 + \" €\");\n\n        // Le passage le plus cher, par un juge de la lecon 25.\n        Comparator<Passage> parMontant =\n                Comparator.comparing(p -> p.litres() * p.prixLitre());\n        Optional<Passage> plusCher = passages.stream()\n                .sorted(parMontant.reversed())\n                .findFirst();\n        System.out.println(\"Passage le plus cher : \"\n                + plusCher.map(p -> p.date() + \" (\" + p.carburant() + \")\").orElse(\"aucun\"));\n\n        // Chercher DANS un texte libre : les dates du carnet du gérant.\n        String carnet = \"Livraison le 2026-08-02, contrôle des cuves le 2026-08-05, \"\n                + \"prochaine livraison 2026-08-09.\";\n        Pattern dates = Pattern.compile(\"\\\\d{4}-\\\\d{2}-\\\\d{2}\");\n        Matcher chercheur = dates.matcher(carnet);\n        List<String> trouvees = new ArrayList<>();\n        while (chercheur.find()) {\n            trouvees.add(chercheur.group());\n        }\n        System.out.println();\n        System.out.println(\"Dates du carnet : \" + trouvees);\n\n        // Le meme motif, employe a valider : la forme ne dit rien du sens.\n        System.out.println(\"« 2026-13-45 » a-t-il la bonne forme ? \"\n                + \"2026-13-45\".matches(\"\\\\d{4}-\\\\d{2}-\\\\d{2}\"));\n        System.out.println(\"Cette date existe-t-elle pour autant ? non\");\n\n        // Anonymiser un ticket avant archivage.\n        String ticket = \"Carte 4970 1234 5678 9012 — passage du 2026-08-06\";\n        System.out.println(\"Ticket archivé : \"\n                + ticket.replaceAll(\"[0-9]{4} [0-9]{4} [0-9]{4} \", \"•••• •••• •••• \"));\n\n        // Un motif mal ecrit accepte trop : celui-ci laisse passer n'importe quoi autour.\n        System.out.println(\"Motif trop permissif sur « xx2026-08-06xx » : \"\n                + \"xx2026-08-06xx\".matches(\".*\\\\d{4}-\\\\d{2}-\\\\d{2}.*\"));\n    }\n}",

    {
      "num": "26.3",
      "titre": "La bourse aux vélos — 2/4",
      "niveau": 3,

      "serie": {

      "hier": "lecon25.html",
      "enonce": "La bourse ouvre les inscriptions par courriel. Chaque demande arrive sur une ligne de sept champs séparés par des points-virgules : code, propriétaire, modèle, taille, prix, état, adresse de courriel. Reprends telles quelles la fiche du vélo et la liste fermée des états d'hier, et ajoute une fiche d'inscription qui enveloppe un vélo et une adresse — la fiche du vélo ne doit pas changer d'un caractère. Déclare des motifs nommés pour le code, l'adresse, la taille, le prix et l'état, puis écris une fonction de diagnostic qui contrôle les champs <strong>un par un</strong> et rend, non pas un « oui/non », mais la raison du refus. Dépouille ces six demandes : <code>BV-2026-006;Peeters;Trek FX2;56;240;BON;jan.peeters@skynet.be</code>, <code>BV-2026-007;Sow;Brompton M3L;50;890;NEUF;a.sow@ulb.be</code>, <code>BV26008;Vandamme;Batavus Old Dutch;54;120;USE;vandamme@proximus.be</code>, <code>BV-2026-009;Kaczmarek;Cannondale CAAD;58;510;EXCELLENT;k.k@voo.be</code>, <code>BV-2026-010;Meunier;Décathlon Elops;52;75;USE;meunier[at]gmail.com</code> et <code>BV-2026-011;Dubois;Colnago Master;56;1450;BON</code>. Ajoute les acceptées au hangar d'hier, reprends les <strong>quatre juges nommés mot pour mot</strong> et affiche le hangar complété par état puis du plus cher, sa taille, sa valeur, le plus grand cadre et le premier propriétaire par ordre alphabétique. Cherche enfin les codes cités dans un courrier libre du secrétariat, imprime l'affiche publique où la partie personnelle des adresses est masquée, et compare le motif strict d'adresse à un motif trop large sur le texte « a@b ».",
      "principe": "Un contrôle champ par champ coûte plus de lignes qu'un motif unique et rend infiniment plus : il dit <em>lequel</em> des sept champs est fautif. Le message d'erreur est une partie du programme, pas un supplément — un refus que l'utilisateur ne peut pas corriger seul est un refus mal écrit.",
      "reflexion": "La fiche du vélo n'a pas bougé : l'adresse de courriel voyage dans une fiche d'inscription qui l'enveloppe. On aurait pu, à la place, ajouter un septième champ à la fiche du vélo. Compare les deux solutions du point de vue du programme d'hier, puis du point de vue d'un vélo déposé sans adresse. Laquelle choisirais-tu, et à quelle condition changerais-tu d'avis ?",
      "remarque": "Le diagnostic s'arrête à la première faute trouvée : une demande à la fois mal codée et sans adresse valable ne signalera que le code. C'est un choix d'implémentation, pas une fatalité, et il a un coût réel — le propriétaire corrige, renvoie, et se fait refuser une seconde fois pour un autre motif. Accumuler toutes les fautes dans une liste serait plus aimable et plus long.",
      "indices": [
        "Range les six demandes avant de coder, et note pour chacune ce qui cloche : l'une a un code sans tirets, l'une un état qui n'existe pas, l'une une adresse écrite avec « at » entre crochets, l'une un champ manquant. Deux sont correctes. Cette liste est la spécification de ta fonction de diagnostic — et elle t'indique déjà l'ordre dans lequel tester.",
        "Le plan : les fiches et la liste fermée d'hier, plus la fiche d'inscription ; les motifs nommés ; la fonction de diagnostic ; le dépouillement, qui construit les fiches acceptées ; le hangar d'hier augmenté ; les quatre juges recopiés ; puis les affichages, la recherche dans le courrier et l'affiche publique.",
        "Fais rendre à ton diagnostic un texte vide quand tout va bien, et le motif du refus sinon. C'est un procédé courant et discutable — il confond « pas de problème » et « problème sans nom » — mais il se lit bien ici et évite d'inventer un type pour trois lignes. Note-le mentalement : c'est exactement le genre de raccourci que la boîte de la leçon 23 était faite pour remplacer.",
        "Le point dur est le tout premier contrôle, celui du nombre de champs. La demande de Dubois n'a que six champs : si tu testes l'adresse avant d'avoir compté, ton programme s'arrêtera sur un débordement de tableau au lieu d'afficher un message. L'ordre des contrôles n'est donc pas indifférent — le comptage vient toujours en premier, puis les champs, du plus structurant au plus accessoire. Pour construire la constante d'état à partir de son texte, écris une petite fonction de conversion : trois comparaisons suffisent, et le diagnostic a déjà garanti que le texte est correct.",
        "Ton fichier ressemble à ceci :<br><code>record Inscription(Velo velo, String courriel) { }</code><br><code>static final String CODE = \"BV-\\\\d{4}-\\\\d{3}\";</code><br><code>static final String COURRIEL = \"[a-z0-9._-]+@[a-z0-9-]+\\\\.[a-z]{2,4}\";</code><br><code>static String diagnostic(String[] champs) {</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;if (champs.length != 7) { return \"il manque …\"; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;if (!champs[…].matches(CODE)) { return \"…\"; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;return \"\";</code><br><code>}</code><br><code>static Etat etatDe(String texte) { if (texte.equals(\"NEUF\")) … }</code><br><code>i.courriel().replaceAll(\"^[a-z0-9._-]+@\", \"•••@\")</code>"
      ],
      "solution": "// La bourse aux velos - jour 2 sur 4 : les inscriptions arrivent par courriel.\n// La fiche du velo ne bouge pas d'un caractere : l'information nouvelle voyage\n// a cote, dans une fiche d'inscription qui l'enveloppe.\nimport java.util.ArrayList;\nimport java.util.Comparator;\nimport java.util.List;\nimport java.util.Optional;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\nimport java.util.stream.Collectors;\n\npublic class BourseAuxVelos {\n\n    record Velo(String code, String proprietaire, String modele, int taille,\n                int prixEuros, Etat etat) { }\n\n    enum Etat { NEUF, BON, USE }\n\n    record Inscription(Velo velo, String courriel) { }\n\n    // Les motifs de la bourse, nommes comme les juges l'ont ete hier.\n    static final String CODE = \"BV-\\\\d{4}-\\\\d{3}\";\n    static final String COURRIEL = \"[a-z0-9._-]+@[a-z0-9-]+\\\\.[a-z]{2,4}\";\n    static final String TAILLE = \"\\\\d{2}\";\n    static final String PRIX = \"\\\\d{1,5}\";\n    static final String ETAT = \"(NEUF|BON|USE)\";\n\n    // L'enumeration ne se construit pas depuis un texte sans qu'on le dise :\n    // le diagnostic a deja garanti que le texte est l'un des trois.\n    static Etat etatDe(String texte) {\n        if (texte.equals(\"NEUF\")) {\n            return Etat.NEUF;\n        }\n        if (texte.equals(\"BON\")) {\n            return Etat.BON;\n        }\n        return Etat.USE;\n    }\n\n    static String fiche(Velo v) {\n        return v.code() + \" \" + v.modele() + \" (T\" + v.taille() + \", \" + v.etat()\n                + \") — \" + v.prixEuros() + \" € — \" + v.proprietaire();\n    }\n\n    // Un seul motif dirait « non » sans dire pourquoi. Champ par champ, le\n    // refus devient un message que le proprietaire peut comprendre.\n    static String diagnostic(String[] champs) {\n        if (champs.length != 7) {\n            return \"il manque des champs (\" + champs.length + \" au lieu de 7)\";\n        }\n        if (!champs[0].matches(CODE)) {\n            return \"code d'inscription mal formé\";\n        }\n        if (!champs[3].matches(TAILLE)) {\n            return \"taille de cadre illisible\";\n        }\n        if (!champs[4].matches(PRIX)) {\n            return \"prix illisible\";\n        }\n        if (!champs[5].matches(ETAT)) {\n            return \"état inconnu\";\n        }\n        if (!champs[6].matches(COURRIEL)) {\n            return \"adresse de courriel invalide\";\n        }\n        return \"\";\n    }\n\n    public static void main(String[] args) {\n        ArrayList<String> recues = new ArrayList<>();\n        recues.add(\"BV-2026-006;Peeters;Trek FX2;56;240;BON;jan.peeters@skynet.be\");\n        recues.add(\"BV-2026-007;Sow;Brompton M3L;50;890;NEUF;a.sow@ulb.be\");\n        recues.add(\"BV26008;Vandamme;Batavus Old Dutch;54;120;USE;vandamme@proximus.be\");\n        recues.add(\"BV-2026-009;Kaczmarek;Cannondale CAAD;58;510;EXCELLENT;k.k@voo.be\");\n        recues.add(\"BV-2026-010;Meunier;Décathlon Elops;52;75;USE;meunier[at]gmail.com\");\n        recues.add(\"BV-2026-011;Dubois;Colnago Master;56;1450;BON\");\n\n        ArrayList<Inscription> acceptees = new ArrayList<>();\n        System.out.println(\"--- Dépouillement des inscriptions ---\");\n        for (String ligne : recues) {\n            String[] champs = ligne.split(\";\");\n            String probleme = diagnostic(champs);\n            if (probleme.isEmpty()) {\n                Velo v = new Velo(champs[0], champs[1], champs[2],\n                        Integer.parseInt(champs[3]), Integer.parseInt(champs[4]),\n                        etatDe(champs[5]));\n                acceptees.add(new Inscription(v, champs[6]));\n                System.out.println(\"  ✓ \" + champs[0] + \" — \" + champs[1]);\n            } else {\n                System.out.println(\"  ✗ \" + champs[0] + \" — \" + probleme);\n            }\n        }\n        System.out.println(\"Acceptées : \" + acceptees.size()\n                + \" sur \" + recues.size());\n\n        // Le hangar d'hier, augmente des inscriptions du jour.\n        ArrayList<Velo> hangar = new ArrayList<>();\n        hangar.add(new Velo(\"BV-2026-004\", \"Lambert\", \"Gitane Tour\", 54, 180, Etat.BON));\n        hangar.add(new Velo(\"BV-2026-001\", \"Nzeyimana\", \"Peugeot PX10\", 58, 320, Etat.BON));\n        hangar.add(new Velo(\"BV-2026-003\", \"Declercq\", \"Btwin Riverside\", 50, 95, Etat.USE));\n        hangar.add(new Velo(\"BV-2026-005\", \"Lambert\", \"Ridley Fenix\", 54, 640, Etat.NEUF));\n        hangar.add(new Velo(\"BV-2026-002\", \"Haddad\", \"Motobécane C4\", 58, 180, Etat.USE));\n        acceptees.forEach(i -> hangar.add(i.velo()));\n\n        // Les quatre juges d'hier, mot pour mot.\n        Comparator<Velo> parPrix = Comparator.comparingInt(Velo::prixEuros);\n        Comparator<Velo> parTaille = Comparator.comparingInt(Velo::taille);\n        Comparator<Velo> parProprietaire = Comparator.comparing(Velo::proprietaire);\n        Comparator<Velo> parEtat = Comparator.comparingInt(v -> v.etat().ordinal());\n\n        System.out.println();\n        System.out.println(\"--- Hangar complété, par état puis du plus cher ---\");\n        hangar.stream()\n                .sorted(parEtat.thenComparing(parPrix.reversed()))\n                .forEach(v -> System.out.println(\"  \" + fiche(v)));\n\n        System.out.println();\n        System.out.println(\"Hangar : \" + hangar.size() + \" vélos pour \"\n                + hangar.stream().mapToInt(v -> v.prixEuros()).sum() + \" €\");\n        Optional<Velo> plusGrand = hangar.stream()\n                .sorted(parTaille.reversed())\n                .findFirst();\n        System.out.println(\"Plus grand cadre : \"\n                + plusGrand.map(v -> \"T\" + v.taille() + \" — \" + v.modele()).orElse(\"aucun\"));\n        System.out.println(\"Premier au classement des propriétaires : \"\n                + hangar.stream().sorted(parProprietaire).findFirst()\n                        .map(v -> v.proprietaire()).orElse(\"aucun\"));\n\n        // Le courrier libre du secretariat : on y CHERCHE les codes.\n        String courrier = \"Bonjour, je confirme le retrait de BV-2026-003 samedi, \"\n                + \"et l'ami de BV-2026-007 passera pour BV-2026-011 si elle est validée. \"\n                + \"Merci — B. Declercq\";\n        Matcher chercheur = Pattern.compile(CODE).matcher(courrier);\n        List<String> cites = new ArrayList<>();\n        while (chercheur.find()) {\n            cites.add(chercheur.group());\n        }\n        System.out.println();\n        System.out.println(\"Codes cités dans le courrier : \" + cites);\n\n        // L'affiche publique ne montre pas les adresses en clair.\n        System.out.println();\n        System.out.println(\"--- Affiche publique ---\");\n        List<String> affiche = acceptees.stream()\n                .sorted(Comparator.comparing(i -> i.velo().prixEuros()))\n                .map(i -> \"  \" + fiche(i.velo()) + \" — contact : \"\n                        + i.courriel().replaceAll(\"^[a-z0-9._-]+@\", \"•••@\"))\n                .collect(Collectors.toList());\n        affiche.forEach(l -> System.out.println(l));\n\n        // Un motif trop large accepterait des adresses qui n'en sont pas.\n        System.out.println();\n        System.out.println(\"« a@b » contre le motif strict : \" + \"a@b\".matches(COURRIEL));\n        System.out.println(\"« a@b » contre un motif trop large : \" + \"a@b\".matches(\".+@.+\"));\n    }\n}",
      "pourquoi": "Le motif trop large accepte « a@b » comme adresse de courriel, le motif strict la refuse. Aucun des deux n'a raison dans l'absolu : il existe des adresses valides qu'un motif strict rejette, et il n'existe aucun motif capable de décrire exactement les adresses acceptables — la norme officielle est trop riche. Le seul contrôle définitif d'une adresse est d'y envoyer un message et d'attendre la réponse. Le motif ne fait que trier les fautes de frappe évidentes, et c'est déjà beaucoup.",
      "tests": [
        {
          "code": "assert '✓ BV-2026-006 — Peeters' in __output__ and '✓ BV-2026-007 — Sow' in __output__ and 'Acceptées : 2 sur 6' in __output__",
          "label": "Deux demandes sur six passent le dépouillement"
        },
        {
          "code": "assert \"✗ BV26008 — code d'inscription mal formé\" in __output__ and '✗ BV-2026-009 — état inconnu' in __output__ and '✗ BV-2026-010 — adresse de courriel invalide' in __output__ and 'il manque des champs (6 au lieu de 7)' in __output__",
          "label": "Chaque refus nomme précisément le champ fautif"
        },
        {
          "code": "i = __output__.index('Hangar complété'); bloc = __output__[i:i+500]; assert bloc.index('BV-2026-007') < bloc.index('BV-2026-005') < bloc.index('BV-2026-001') and 'Hangar : 7 vélos pour 2545 €' in __output__",
          "label": "Les juges d'hier classent le hangar augmenté sans être retouchés"
        },
        {
          "code": "assert 'Codes cités dans le courrier : [BV-2026-003, BV-2026-007, BV-2026-011]' in __output__",
          "label": "Le motif de code sert aussi à chercher dans un texte libre"
        },
        {
          "code": "assert '•••@skynet.be' in __output__ and '•••@ulb.be' in __output__ and '« a@b » contre le motif strict : false' in __output__ and '« a@b » contre un motif trop large : true' in __output__",
          "label": "L'affiche masque les adresses, et les deux motifs se comportent en sens inverse"
        }
      ],
      "checklist": [
        "Ta fiche du vélo est-elle identique, caractère pour caractère, à celle d'hier ? Si tu as ajouté un champ, ton programme d'hier ne compile plus.",
        "Tes quatre juges sont-ils recopiés à l'identique ? C'est le deuxième jour qu'ils servent sans retouche — vérifie que c'est bien vrai.",
        "Le comptage des champs vient-il avant tous les autres contrôles ? Supprime-le pour voir ce qui se passe sur la demande de Dubois, puis remets-le.",
        "Chacun de tes refus nomme-t-il un champ, ou dis-tu seulement « ligne invalide » ? Relis-les en te mettant à la place du propriétaire.",
        "Ton masquage d'adresse laisse-t-il fuir quelque chose ? Regarde ce qui reste affiché — est-ce anodin ?"
      ],
      "note": "Demain, l'affiche de la bourse deviendra un vrai document imprimable, avec des colonnes alignées et un pied de page — et tu découvriras pourquoi assembler des milliers de morceaux de texte par concaténation est une mauvaise idée que ton programme d'aujourd'hui commet déjà sans dommage."
    }
  ]
};
