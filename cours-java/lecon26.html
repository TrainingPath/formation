<script>
var DAY = {
  num: 26,
  title: "Expressions régulières (regex)",
  subtitle: "Décrire un MOTIF de texte : « trois lettres puis quatre chiffres », et laisser Java vérifier ou extraire.",
  theory: `
<h3>1. L'idée : décrire une forme, pas un texte précis</h3>
<p>Dans ta <strong>ludothèque</strong>, chaque jeu a un code de rangement : trois lettres majuscules, puis trois chiffres, par exemple <code>CAT042</code>. Tu ne veux pas vérifier un code précis, mais une FORME : « toujours 3 lettres + 3 chiffres ». Une <strong>expression régulière</strong> (regex, ou « regexp ») est un mini-langage pour décrire ce genre de motif.</p>
<pre class="pseudo">boolean ok = "CAT042".matches("[A-Z]{3}[0-9]{3}");  // le texte suit-il ce MOTIF ? -> true</pre>
<div class="tip">La méthode <code>String.matches(motif)</code> renvoie <code>true</code> si le texte ENTIER correspond au motif. C'est le point d'entrée le plus simple des regex en Java.</div>

<h3>2. Les briques de base</h3>
<pre class="pseudo">.        // un caractère QUELCONQUE (n'importe lequel, sauf saut de ligne)
[abc]    // UN caractère parmi a, b ou c (une « classe » de caractères)
[a-z]    // UN caractère entre a et z (un intervalle)
[A-Z]    // UN caractère majuscule
[0-9]    // UN chiffre
[^abc]   // UN caractère qui n'est NI a, NI b, NI c (le ^ dans les crochets = négation)</pre>

<h3>3. Les raccourcis avec antislash</h3>
<pre class="pseudo">\\d       // un chiffre         (équivaut à [0-9], « d » comme digit)
\\w       // un caractère de « mot » : lettre, chiffre ou _
\\s       // un espace blanc (espace, tabulation, saut de ligne)
\\.       // un POINT littéral (l'antislash « échappe » le point magique)</pre>
<div class="warn">Piège Java : dans une chaîne Java, l'antislash lui-même doit être DOUBLÉ. Le motif regex <code>\\d</code> s'écrit donc <code>"\\\\d"</code> dans le code Java. Un antislash pour le regex, un second pour la chaîne Java.</div>

<h3>4. Les quantificateurs : combien de fois ?</h3>
<pre class="pseudo">*        // 0 fois ou PLUS  (autant qu'on veut, éventuellement rien)
+        // 1 fois ou plus  (au moins une fois)
?        // 0 ou 1 fois     (facultatif)
{3}      // EXACTEMENT 3 fois
{2,5}    // entre 2 et 5 fois
{2,}     // au moins 2 fois</pre>
<pre class="pseudo">"aaa".matches("a+")       // true : « a » une fois ou plus
"".matches("a*")          // true : « a » zéro fois ou plus -> le vide passe
"12".matches("[0-9]{3}")  // false : il faut EXACTEMENT 3 chiffres, il n'y en a que 2</pre>

<h3>5. Les ancres et les groupes</h3>
<pre class="pseudo">^        // début de la chaîne
$        // fin de la chaîne
(abc)    // un GROUPE : traite « abc » comme un bloc
a|b      // ALTERNATIVE : « a » OU « b »
(chat|chien)  // « chat » ou « chien »</pre>
<div class="tip">Avec <code>matches()</code>, les ancres <code>^</code> et <code>$</code> sont implicites : le motif doit couvrir tout le texte. Elles servent surtout avec <code>Pattern</code>/<code>Matcher</code> pour chercher DANS un texte plus long.</div>

<h3>6. Chercher et extraire : Pattern et Matcher</h3>
<p>Pour trouver toutes les occurrences d'un motif dans un long texte, on compile le motif une fois (<code>Pattern</code>) puis on le fait glisser sur le texte (<code>Matcher</code>).</p>
<pre class="pseudo">import java.util.regex.Pattern;                 // le motif compilé
import java.util.regex.Matcher;                 // le chercheur qui glisse sur le texte

Pattern p = Pattern.compile("[0-9]+");          // compile le motif « un ou plusieurs chiffres »
Matcher m = p.matcher("Uno 8e, Catan 42e");     // prépare la recherche dans ce texte
while (m.find()) {                              // avance jusqu'à la prochaine correspondance
    System.out.println(m.group());              // group() = le morceau trouvé : « 8 » puis « 42 »
}</pre>

<h3>7. Remplacer et découper</h3>
<pre class="pseudo">"a1b2c3".replaceAll("[0-9]", "*")   // remplace chaque chiffre par * -> « a*b*c* »
"Uno,Catan,Risk".split(",")          // découpe sur les virgules -> [Uno, Catan, Risk]
"un   deux".split("\\s+")            // découpe sur un ou plusieurs espaces -> [un, deux]</pre>
<p>Les regex sont l'outil universel pour valider une saisie (code, email, date), nettoyer du texte ou extraire des informations. Un motif bien écrit remplace des dizaines de lignes de <code>if</code>.</p>`,
  exercises: [
    { type: "qcm", q: "À quoi sert une expression régulière ?", opts: ["À accélérer un programme", "À décrire un MOTIF de texte (une forme), pas un texte précis", "À trier une liste", "À créer un objet"], a: 1, exp: "Un mini-langage pour décrire des formes de texte." },
    { type: "qcm", q: "<code>\"CAT042\".matches(\"[A-Z]{3}[0-9]{3}\")</code> vaut :", opts: ["false", "true : 3 majuscules puis 3 chiffres", "une erreur", "CAT042"], a: 1, exp: "Le texte suit exactement le motif." },
    { type: "qcm", q: "Que signifie <code>[0-9]</code> ?", opts: ["Les nombres 0 à 9 en bloc", "UN caractère chiffre entre 0 et 9", "Exactement 9 fois", "Une plage de lettres"], a: 1, exp: "Une classe : un seul caractère parmi 0..9." },
    { type: "qcm", q: "Le raccourci <code>\\d</code> équivaut à…", opts: ["[a-z]", "[0-9] (un chiffre)", "n'importe quoi", "un espace"], a: 1, exp: "d comme digit : un chiffre." },
    { type: "qcm", q: "En Java, comment écrire le motif regex <code>\\d</code> dans une chaîne ?", opts: ["\"\\d\"", "\"\\\\d\" (antislash DOUBLÉ)", "\"d\"", "\"//d\""], a: 1, exp: "L'antislash doit être doublé dans une chaîne Java." },
    { type: "qcm", q: "Que signifie le quantificateur <code>+</code> ?", opts: ["0 ou 1 fois", "1 fois ou plus (au moins une)", "exactement 1", "0 fois"], a: 1, exp: "+ = au moins une occurrence." },
    { type: "qcm", q: "Que signifie <code>*</code> ?", opts: ["au moins une fois", "0 fois ou plus (éventuellement rien)", "exactement une fois", "jamais"], a: 1, exp: "* accepte aussi le vide." },
    { type: "qcm", q: "<code>{3}</code> signifie…", opts: ["au moins 3", "EXACTEMENT 3 fois", "entre 0 et 3", "3 groupes"], a: 1, exp: "Un nombre exact de répétitions." },
    { type: "qcm", q: "<code>\"12\".matches(\"[0-9]{3}\")</code> vaut :", opts: ["true", "false : il faut exactement 3 chiffres, il n'y en a que 2", "erreur", "12"], a: 1, exp: "2 chiffres ne satisfont pas {3}." },
    { type: "qcm", q: "Que fait <code>?</code> après un élément ?", opts: ["le rend obligatoire", "le rend facultatif (0 ou 1 fois)", "le répète 3 fois", "l'inverse"], a: 1, exp: "? = optionnel." },
    { type: "qcm", q: "Que signifie <code>chat|chien</code> ?", opts: ["chat suivi de chien", "chat OU chien (alternative)", "ni l'un ni l'autre", "chatchien"], a: 1, exp: "La barre | exprime un choix." },
    { type: "vf", q: "Avec <code>matches()</code>, le motif doit couvrir le texte ENTIER.", a: true, exp: "matches teste la correspondance complète, ancres implicites." },
    { type: "qcm", q: "Pour trouver TOUTES les occurrences d'un motif dans un long texte :", opts: ["matches() suffit", "Pattern.compile + Matcher.find() dans une boucle", "split()", "replaceAll()"], a: 1, exp: "Matcher.find() avance de correspondance en correspondance." },
    { type: "qcm", q: "<code>\"a1b2\".replaceAll(\"[0-9]\", \"*\")</code> donne…", opts: ["a1b2", "a*b* (chaque chiffre remplacé)", "****", "erreur"], a: 1, exp: "Chaque chiffre est remplacé par *." },
    { type: "vf", q: "<code>\"Uno,Catan\".split(\",\")</code> renvoie un tableau [Uno, Catan].", a: true, exp: "split découpe le texte sur le motif fourni." }
  ],
  final: {
    title: "Exercice final — Valider un code de rangement",
    intro: `<p>Chaque jeu porte un code : 3 lettres majuscules + 3 chiffres. On valide plusieurs codes :</p>
<pre class="pseudo">String motif = "[A-Z]{3}[0-9]{3}";        // (1) 3 majuscules, puis 3 chiffres
boolean a = "CAT042".matches(motif);       // (2)
boolean b = "cat042".matches(motif);       // (3) minuscules
boolean c = "CAT42".matches(motif);        // (4) seulement 2 chiffres
boolean d = "RIS100".matches(motif);       // (5)</pre>`,
    questions: [
      { type: "qcm", q: "(1) Que décrit <code>[A-Z]{3}[0-9]{3}</code> ?", opts: ["3 caractères quelconques", "3 lettres majuscules suivies de 3 chiffres", "3 chiffres puis 3 lettres", "6 lettres"], a: 1, exp: "Deux classes, chacune répétée exactement 3 fois." },
      { type: "qcm", q: "(2) <code>\"CAT042\"</code> :", opts: ["false", "true : 3 majuscules + 3 chiffres, conforme", "erreur", "0"], a: 1, exp: "Le format est respecté." },
      { type: "qcm", q: "(3) <code>\"cat042\"</code> :", opts: ["true", "false : les lettres sont en minuscules, [A-Z] exige des majuscules", "erreur", "true si on ignore la casse"], a: 1, exp: "[A-Z] n'accepte pas les minuscules." },
      { type: "qcm", q: "(4) <code>\"CAT42\"</code> :", opts: ["true", "false : seulement 2 chiffres, {3} en exige 3", "erreur", "true"], a: 1, exp: "Il manque un chiffre pour satisfaire {3}." },
      { type: "vf", q: "(5) <code>\"RIS100\"</code> est valide (true).", a: true, exp: "3 majuscules RIS + 3 chiffres 100 : conforme." }
    ],
    solution: `<pre class="pseudo">motif = "[A-Z]{3}[0-9]{3}"          // 3 majuscules puis 3 chiffres
"CAT042" -> true    // conforme
"cat042" -> false   // minuscules refusées par [A-Z]
"CAT42"  -> false   // 2 chiffres au lieu de 3
"RIS100" -> true    // conforme
// En Java pur : "[0-9]" évite l'antislash ; sinon \\d s'écrit "\\\\d".</pre>
<p>Un motif compact remplace une avalanche de tests caractère par caractère. Prochaine leçon : immutabilité et StringBuilder, pour manipuler du texte efficacement.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code Java ici…",
  items: [
  { id: "java-regex", title: "Le validateur de codes", level: 2,
    statement: "Écris une méthode <code>boolean codeValide(String code)</code> qui renvoie <code>true</code> si le code suit le motif « 3 lettres majuscules + 3 chiffres » (ex. <code>CAT042</code>). Teste-la dans un <code>main</code> sur trois codes : un valide, un en minuscules, un trop court. Affiche chaque résultat.",
    hints: [
      "Le motif regex est \"[A-Z]{3}[0-9]{3}\" : trois majuscules puis trois chiffres. Aucun antislash nécessaire.",
      "Dans codeValide, renvoie simplement code.matches(motif) : matches teste la correspondance complète.",
      "Dans main, appelle codeValide sur \"CAT042\", \"cat042\" et \"RIS12\", et affiche chaque booléen."
    ],
    solution: "public class Validateur {                                 // classe principale\n\n    public static boolean codeValide(String code) {      // teste le format du code\n        return code.matches(\"[A-Z]{3}[0-9]{3}\");         // true si 3 majuscules + 3 chiffres\n    }                                                    // matches exige une correspondance TOTALE\n\n    public static void main(String[] args) {             // point d'entrée\n        System.out.println(codeValide(\"CAT042\"));        // true  : format correct\n        System.out.println(codeValide(\"cat042\"));        // false : minuscules refusees par [A-Z]\n        System.out.println(codeValide(\"RIS12\"));         // false : seulement 2 chiffres, {3} en veut 3\n    }                                                    // fin de main\n}                                                        // fin de la classe",
    note: "matches() teste la chaîne entière contre le motif. Les classes [A-Z] et [0-9] évitent tout antislash ; en cas de besoin, le raccourci \\d s'écrit \"\\\\d\" en Java (antislash doublé)." }
  ]
};
