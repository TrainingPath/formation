<h3>1. Le cahier des charges</h3>
<p>La bibliothèque de l'école veut un programme console : <strong>ajouter un livre, lister les livres, emprunter, rendre, sauvegarder dans un fichier, quitter</strong>. On applique la méthode éprouvée : comprendre le besoin → découper en classes → écrire chaque brique → vérifier. Ce projet réunit presque tout le cours.</p>

<h3>2. Le découpage en classes (une responsabilité chacune)</h3>
<pre class="pseudo">Classe Livre       : titre, auteur, emprunté ?  + méthodes   // représente UN livre (les données)
Classe Bibliotheque: la liste des livres + les opérations    // gère la COLLECTION de livres
Classe Main        : le menu et la boucle principale         // s'occupe du DIALOGUE utilisateur</pre>
<p>Chaque classe a un rôle unique : plus clair et plus facile à tester que tout mettre dans <code>main</code>.</p>

<h3>3. La classe Livre (leçons 12-13)</h3>
<pre class="pseudo">public class Livre {
    private String titre;                    // attributs privés (encapsulation, leçon 13)
    private String auteur;
    private boolean emprunte;

    public Livre(String titre, String auteur) {   // constructeur
        this.titre = titre;
        this.auteur = auteur;
        this.emprunte = false;               // un livre naît toujours DISPONIBLE (objet cohérent d'emblée)
    }
    public String getTitre() { return titre; }          // getter
    public boolean estEmprunte() { return emprunte; }
    public boolean emprunter() {
        if (emprunte) { return false; }      // déjà pris → l'emprunt échoue, on renvoie false
        emprunte = true;                     // sinon on le marque emprunté…
        return true;                         // …et on renvoie true (succès)
    }
    public void rendre() { emprunte = false; }          // le rendre = redevenir disponible
    public String toString() {                          // affichage personnalisé
        return titre + " (" + auteur + ")" + (emprunte ? " [SORTI]" : " [dispo]");  // ternaire pour l'état
    }
}</pre>

<h3>4. La classe Bibliotheque (leçons 10, 11, 16)</h3>
<pre class="pseudo">public class Bibliotheque {
    private ArrayList&lt;Livre&gt; livres = new ArrayList&lt;&gt;();  // la collection interne (privée)

    public void ajouter(Livre l) { livres.add(l); }       // ajoute un livre
    public Livre chercher(String titre) {                 // recherche séquentielle (leçon 11)
        for (Livre l : livres) {
            if (l.getTitre().equalsIgnoreCase(titre)) { return l; }  // trouvé (casse ignorée) → on le renvoie
        }
        return null;                                      // aucun livre correspondant : null
    }
    public void lister() {
        if (livres.isEmpty()) { System.out.println("(vide)"); return; }  // cas limite : liste vide
        for (Livre l : livres) { System.out.println(l); }   // {l} déclenche toString automatiquement
    }
    public void sauvegarder(String fichier) { /* PrintWriter, CSV titre;auteur;emprunte (leçon 17) */ }
    public void charger(String fichier) { /* Scanner + split (leçon 17) */ }
}</pre>

<h3>5. Le menu principal (leçons 4, 6, 16)</h3>
<pre class="pseudo">Bibliotheque biblio = new Bibliotheque();
biblio.charger("livres.txt");                        // au démarrage : recharger l'état sauvegardé
int choix = 0;
do {                                                 // do-while : afficher le menu au moins une fois
    System.out.println("1.Ajouter 2.Lister 3.Emprunter 4.Rendre 5.Quitter");
    try {
        choix = Integer.parseInt(clavier.nextLine()); // lecture + conversion protégée
    } catch (NumberFormatException e) { choix = 0; }  // saisie non numérique → choix invalide (0)
    switch (choix) {                                  // aiguillage selon le choix
        case 1: /* lire titre+auteur, puis biblio.ajouter(new Livre(...)) */ break;
        case 2: biblio.lister(); break;
        case 3: /* chercher puis emprunter, en gérant null ET false ! */ break;
        case 4: /* chercher puis rendre */ break;
    }
} while (choix != 5);                                 // on répète jusqu'au choix « Quitter »
biblio.sauvegarder("livres.txt");                     // à la sortie : sauvegarder l'état</pre>

      "solution": "// Le vestiaire de la piscine : un programme console complet, en trois classes.\n// Une classe pour la donnee, une pour la collection, une pour le dialogue.\nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.Optional;\nimport java.util.Scanner;\n\npublic class VestiaireApp {\n\n    public static void main(String[] args) {\n        Scanner clavier = new Scanner(System.in);\n        Vestiaire vestiaire = new Vestiaire(4);\n        int choix = 0;\n\n        do {\n            System.out.println(\"--- 1.Déposer 2.Lister 3.Reprendre 4.Quitter ---\");\n            String saisie = clavier.nextLine();\n            try {\n                choix = Integer.parseInt(saisie);\n            } catch (NumberFormatException e) {\n                choix = 0;\n            }\n\n            if (choix == 1) {\n                System.out.println(\"Nom du nageur ?\");\n                String nom = clavier.nextLine();\n                Optional<Casier> attribue = vestiaire.deposer(nom);\n                System.out.println(attribue\n                        .map(c -> \"Casier \" + c.getNumero() + \" attribué à \" + nom)\n                        .orElse(\"Vestiaire complet, aucun casier libre\"));\n            } else if (choix == 2) {\n                vestiaire.lister();\n            } else if (choix == 3) {\n                System.out.println(\"Numéro de casier ?\");\n                String numero = clavier.nextLine();\n                System.out.println(vestiaire.reprendre(numero));\n            } else if (choix == 4) {\n                System.out.println(\"Fermeture du vestiaire.\");\n            } else {\n                System.out.println(\"Choix invalide : « \" + saisie + \" »\");\n            }\n        } while (choix != 4);\n\n        System.out.println(\"Casiers libres à la fermeture : \" + vestiaire.nombreLibres());\n    }\n}\n\n// La donnee : un casier, son numero, son occupant eventuel.\nclass Casier {\n    private final int numero;\n    private String occupant;\n\n    Casier(int numero) {\n        this.numero = numero;\n        this.occupant = null;\n    }\n\n    int getNumero() {\n        return numero;\n    }\n\n    // Le null reste a l'interieur : l'exterieur ne recoit qu'une boite.\n    Optional<String> occupant() {\n        return Optional.ofNullable(occupant);\n    }\n\n    boolean estLibre() {\n        return occupant == null;\n    }\n\n    void occuper(String nom) {\n        occupant = nom;\n    }\n\n    void liberer() {\n        occupant = null;\n    }\n\n    String fiche() {\n        return \"Casier \" + numero + \" : \" + occupant().orElse(\"libre\");\n    }\n}\n\n// La collection : elle connait tous les casiers et les regles du vestiaire.\nclass Vestiaire {\n    private final List<Casier> casiers = new ArrayList<>();\n\n    Vestiaire(int taille) {\n        for (int i = 1; i <= taille; i++) {\n            casiers.add(new Casier(i));\n        }\n    }\n\n    Optional<Casier> deposer(String nom) {\n        Optional<Casier> libre = casiers.stream().filter(c -> c.estLibre()).findFirst();\n        libre.ifPresent(c -> c.occuper(nom));\n        return libre;\n    }\n\n    // Le message rendu, jamais affiche : c'est l'appelant qui parle a l'ecran.\n    String reprendre(String numeroSaisi) {\n        if (!numeroSaisi.matches(\"\\\\d+\")) {\n            return \"« \" + numeroSaisi + \" » n'est pas un numéro\";\n        }\n        int numero = Integer.parseInt(numeroSaisi);\n        Optional<Casier> cible = casiers.stream()\n                .filter(c -> c.getNumero() == numero)\n                .findFirst();\n        if (!cible.isPresent()) {\n            return \"Aucun casier numéro \" + numero;\n        }\n        Casier c = cible.get();\n        if (c.estLibre()) {\n            return \"Le casier \" + numero + \" était déjà libre\";\n        }\n        String nom = c.occupant().orElse(\"?\");\n        c.liberer();\n        return \"Casier \" + numero + \" rendu par \" + nom;\n    }\n\n    void lister() {       "enonce": "Même structure, une exigence de plus : l'état doit survivre à la fermeture du programme. Une base nautique loue cinq canoës à 6,50 € l'heure. Écris la classe de la location — client, numéro de canoë, durée — capable de rendre sa ligne au format point-virgule, et la classe de la base, qui porte la flotte, le tarif et la liste des locations en cours. La base sait : trouver le premier canoë libre ; louer, en refusant un nom qui ne ressemble pas à un nom — au moins deux caractères, lettres, accents, apostrophes, tirets et espaces — et une durée hors de un à huit heures ; rendre un canoë en refusant un numéro non numérique et un canoë qui n'est pas sorti ; afficher l'état trié par numéro ; calculer la recette arrondie au centime ; sauvegarder dans un fichier ; et le recharger en comptant les lignes lues et les lignes rejetées. Le menu propose : 1 louer, 2 rendre, 3 état, 4 recette, 5 quitter. Le programme charge le fichier au démarrage, sauvegarde à la fermeture, puis — pour prouver que l'état a bien quitté la mémoire — fabrique une base entièrement neuve, la recharge depuis le même fichier et affiche son état.",

      "reflexion": "La sauvegarde écrase le fichier entier à chaque fermeture. Énumère au moins deux façons dont cela peut faire perdre des données, puis propose pour chacune une parade — sans supposer de bibliothèque extérieure. Enfin, dis laquelle tu retiendrais pour une base de cinq canoës, et laquelle pour un logiciel de comptabilité.",

      "indices": [
        "Traite la persistance comme une quatrième responsabilité, à côté de la donnée, de la collection et du dialogue. Elle se décompose en deux opérations symétriques mais pas identiques : écrire est facile, tu maîtrises ce que tu produis ; relire est un dépouillement de données étrangères, avec tout ce que la leçon 26 t'a appris. Prévois cette asymétrie dès le départ.",

      "solution": "// La location de canoes : le meme programme, mais qui se souvient d'un jour\n// a l'autre. Ce qui change tout, c'est que l'etat vit desormais hors du programme.\nimport java.io.File;\nimport java.io.IOException;\nimport java.io.PrintWriter;\nimport java.util.ArrayList;\nimport java.util.Comparator;\nimport java.util.List;\nimport java.util.Optional;\nimport java.util.Scanner;\nimport java.util.stream.Collectors;\n\npublic class LocationApp {\n\n    static final String FICHIER = \"locations.csv\";\n\n    public static void main(String[] args) {\n        Scanner clavier = new Scanner(System.in);\n        Base base = new Base(5, 6.50);\n        System.out.println(base.charger(FICHIER));\n\n        int choix = 0;\n        do {\n            System.out.println(\"--- 1.Louer 2.Rendre 3.État 4.Recette 5.Quitter ---\");\n            String saisie = clavier.nextLine();\n            try {\n                choix = Integer.parseInt(saisie);\n            } catch (NumberFormatException e) {\n                choix = 0;\n            }\n\n            if (choix == 1) {\n                System.out.println(\"Nom du client ?\");\n                String nom = clavier.nextLine();\n                System.out.println(\"Nombre d'heures ?\");\n                String heures = clavier.nextLine();\n                System.out.println(base.louer(nom, heures));\n            } else if (choix == 2) {\n                System.out.println(\"Numéro de canoë ?\");\n                System.out.println(base.rendre(clavier.nextLine()));\n            } else if (choix == 3) {\n                base.etat();\n            } else if (choix == 4) {\n                System.out.println(\"Recette du jour : \" + base.recette() + \" €\");\n            } else if (choix == 5) {\n                System.out.println(\"Fermeture de la base.\");\n            } else {\n                System.out.println(\"Choix invalide : « \" + saisie + \" »\");\n            }\n        } while (choix != 5);\n\n        System.out.println(base.sauvegarder(FICHIER));\n\n        // Preuve que l'etat a bien quitte la memoire : une base neuve le retrouve.\n        Base demain = new Base(5, 6.50);\n        System.out.println(demain.charger(FICHIER));\n        demain.etat();\n    }\n}\n\nclass Location {\n    private final String client;\n    private final int canoe;\n    private final int heures;\n\n    Location(String client, int canoe, int heures) {\n        this.client = client;\n        this.canoe = canoe;\n        this.heures = heures;\n    }\n\n    String getClient() {\n        return client;\n    }\n\n    int getCanoe() {\n        return canoe;\n    }\n\n    int getHeures() {\n        return heures;\n    }\n\n    String versLigne() {\n        return canoe + \";\" + client + \";\" + heures;\n    }\n}\n\nclass Base {\n    private final int flotte;\n    private final double tarifHoraire;\n    private final List<Location> locations = new ArrayList<>();\n\n    static final String NOM = \"[A-Za-zÀ-ÿ' -]{2,30}\";\n\n    Base(int flotte, double tarifHoraire) {\n        this.flotte = flotte;\n        this.tarifHoraire = tarifHoraire;\n    }\n\n    private Optional<Integer> premierLibre() {\n        for (int n = 1; n <= flotte; n++) {\n            final int candidat = n;\n            boolean pris = locations.stream().anyMatch(l -> l.getCanoe() == candidat);\n            if (!pris) {\n                return Optional.of(candidat);\n            }\n        }\n        return Optional.empty();\n    }\n\n    String louer(String nom, String heuresSaisies) {\n        if (!nom.matches(NOM)) {\n            return \"Nom refusé : « \" + nom + \" »\";\n        }\n        if (!heuresSaisies.matches(\"[1-8]\")) {\n            return \"Durée refusée : « \" + heuresSaisies + \" » (1 à 8 heures)\";\n        }\n        Optional<Integer> libre = premierLibre();\n        if (!libre.isPresent()) {\n            return \"Toute la flotte est sur l'eau\";\n        }\n        int canoe = libre.get();\n        locations.add(new Location(nom, canoe, Integer.parseInt(heuresSaisies)));\n        return \"Canoë \" + canoe + \" loué à \" + nom + \" pour \" + heuresSaisies + \" h\";\n    }\n\n    String rendre(String numeroSaisi) {\n        if (!numeroSaisi.matches(\"\\\\d+\")) {\n            return \"« \" + numeroSaisi + \" » n'est pas un numéro\";\n        }\n        int numero = Integer.parseInt(numeroSaisi);\n        Optional<Location> cible = locations.stream()\n                .filter(l -> l.getCanoe() == numero)\n                .findFirst();\n        if (!cible.isPresent()) {\n            return \"Le canoë \" + numero + \" n'est pas sorti\";\n        }\n        locations.remove(cible.get());\n        return \"Canoë \" + numero + \" rentré (\" + cible.get().getClient() + \")\";\n    }\n\n    void etat() {\n        if (locations.isEmpty()) {\n            System.out.println(\"  (toute la flotte est au ponton)\");\n            return;\n        }\n        locations.stream()\n                .sorted(Comparator.comparingInt(Location::getCanoe))\n                .forEach(l -> System.out.println(\"  Canoë \" + l.getCanoe() + \" · \"\n                        + l.getClient() + \" · \" + l.getHeures() + \" h\"));\n    }\n\n    double recette() {\n        int heures = locations.stream().mapToInt(l -> l.getHeures()).sum();\n        return Math.round(heures * tarifHoraire * 100) / 100.0;\n    }\n\n    String sauvegarder(String fichier) {\n        try (PrintWriter sortie = new PrintWriter(fichier)) {\n            for (Location l : locations) {\n                sortie.println(l.versLigne());\n            }\n            return \"Sauvegardé : \" + locations.size() + \" location(s)\";\n        } catch (IOException e) {\n            return \"Écriture impossible : \" + e.getMessage();\n        }\n    }\n\n    String charger(String fichier) {\n        File f = new File(fichier);\n        if (!f.exists()) {\n            return \"Aucun fichier \" + fichier + \" : on démarre à vide\";\n        }\n        locations.clear();\n        int lues = 0;\n        int rejetees = 0;\n        try (Scanner lecture = new Scanner(f)) {\n            while (lecture.hasNextLine()) {\n                String ligne = lecture.nextLine();\n                String[] champs = ligne.split(\";\");\n                if (champs.length != 3 || !champs[0].matches(\"\\\\d+\")\n                        || !champs[2].matches(\"\\\\d+\")) {\n                    rejetees = rejetees + 1;\n                    continue;\n                }\n                locations.add(new Location(champs[1], Integer.parseInt(champs[0]),\n                        Integer.parseInt(champs[2])));\n                lues = lues + 1;\n            }\n        } catch (IOException e) {\n            return \"Lecture impossible : \" + e.getMessage();\n        }\n        return \"Rechargé : \" + lues + \" location(s), \" + rejetees + \" ligne(s) rejetée(s)\";\n    }\n\n    List<String> clients() {\n        return locations.stream().map(l -> l.getClient()).collect(Collectors.toList());\n    }\n}",

      "enonce": "L'observatoire d'hier devient un vrai programme. Reprends la fiche du relevé, la liste fermée des espèces et le motif du code de poste, et construis autour d'eux un registre qui sait : convertir un texte en espèce sans jamais rendre le vide ; enregistrer un relevé en refusant tour à tour un poste mal formé, une espèce inconnue et un effectif illisible, avec un message qui nomme le champ fautif ; totaliser les effectifs par espèce ; dépouiller, c'est-à-dire afficher le classement du plus au moins nombreux avec départage alphabétique, suivi de l'espèce non observée s'il y en a une ; composer un rapport imprimable encadré de filets, avec une ligne par espèce en colonnes et un pied de page donnant le nombre de relevés et le total des individus ; sauvegarder et recharger en comptant les lignes rejetées ; et enfin s'éprouver lui-même. Le rapport doit être <strong>rendu</strong> et non affiché. Le banc d'essai, intégré au menu, monte un registre neuf, lui soumet cinq saisies dont quatre fautives, vérifie les cinq messages exacts, vérifie que seul le relevé valide a été retenu, et vérifie que le pied de page du rapport annonce le bon compte. Le menu propose : 1 saisir, 2 dépouiller, 3 rapport, 4 sauver, 5 banc, 6 quitter.",
      "principe": "Un programme complet n'est pas un programme long : c'est un programme dont chaque partie a une seule raison d'exister, et où le chemin d'une donnée — de la saisie au rapport, en passant par le disque — peut se suivre du doigt sans jamais se perdre. Tout ce que les leçons 21 à 29 ont installé ne sert ici que de vocabulaire.",

      "solution": "// L'observatoire ornithologique - jour 2 sur 3 : le programme complet.\n// Saisie controlee, depouillement, rapport imprimable, persistance, banc d'essai.\n// Tout ce que les lecons 21 a 29 ont installe sert ici en meme temps.\nimport java.io.File;\nimport java.io.IOException;\nimport java.io.PrintWriter;\nimport java.util.ArrayList;\nimport java.util.Comparator;\nimport java.util.List;\nimport java.util.Optional;\nimport java.util.Scanner;\nimport java.util.stream.Collectors;\n\npublic class ObservatoireApp {\n\n    public static void main(String[] args) {\n        Scanner clavier = new Scanner(System.in);\n        Registre registre = new Registre();\n        System.out.println(registre.charger(Registre.FICHIER));\n\n        int choix = 0;\n        do {\n            System.out.println(\"--- 1.Saisir 2.Dépouiller 3.Rapport 4.Sauver 5.Banc 6.Quitter ---\");\n            String saisie = clavier.nextLine();\n            try {\n                choix = Integer.parseInt(saisie);\n            } catch (NumberFormatException e) {\n                choix = 0;\n            }\n\n            if (choix == 1) {\n                System.out.println(\"Poste ?\");\n                String poste = clavier.nextLine();\n                System.out.println(\"Espèce ?\");\n                String espece = clavier.nextLine();\n                System.out.println(\"Effectif ?\");\n                String effectif = clavier.nextLine();\n                System.out.println(registre.saisir(poste, espece, effectif));\n            } else if (choix == 2) {\n                registre.depouiller();\n            } else if (choix == 3) {\n                System.out.print(registre.rapport());\n            } else if (choix == 4) {\n                System.out.println(registre.sauvegarder(Registre.FICHIER));\n            } else if (choix == 5) {\n                registre.banc();\n            } else if (choix == 6) {\n                System.out.println(\"Observatoire fermé.\");\n            } else {\n                System.out.println(\"Choix invalide : « \" + saisie + \" »\");\n            }\n        } while (choix != 6);\n    }\n}\n\nenum Espece { MILAN, BUSE, FAUCON, EPERVIER }\n\nrecord Releve(String poste, Espece espece, int effectif) {\n    String versLigne() {\n        return poste + \";\" + espece + \";\" + effectif;\n    }\n}\n\nclass Registre {\n\n    static final String FICHIER = \"releves.csv\";\n    static final String CODE_POSTE = \"[A-Z]{3}-\\\\d{2}\";\n    static final Espece[] ESPECES = {Espece.MILAN, Espece.BUSE, Espece.FAUCON, Espece.EPERVIER};\n\n    private final List<Releve> releves = new ArrayList<>();\n\n    // La conversion depuis un texte : elle rend une boite, jamais un null.\n    static Optional<Espece> especeDe(String texte) {\n        for (Espece e : ESPECES) {\n            if (e.name().equals(texte)) {\n                return Optional.of(e);\n            }\n        }\n        return Optional.empty();\n    }\n\n    // Un seul endroit valide la saisie, et il nomme le champ fautif.\n    String saisir(String poste, String espece, String effectif) {\n        if (!poste.matches(CODE_POSTE)) {\n            return \"Poste mal formé : « \" + poste + \" »\";\n        }\n        Optional<Espece> e = especeDe(espece);\n        if (!e.isPresent()) {\n            return \"Espèce inconnue : « \" + espece + \" »\";\n        }\n        if (!effectif.matches(\"\\\\d{1,3}\")) {\n            return \"Effectif illisible : « \" + effectif + \" »\";\n        }\n        releves.add(new Releve(poste, e.get(), Integer.parseInt(effectif)));\n        return \"Relevé enregistré : \" + poste + \" · \" + espece + \" · \" + effectif;\n    }\n\n    int[] totauxParEspece() {\n        int[] cases = new int[ESPECES.length];\n        for (Releve r : releves) {\n            cases[r.espece().ordinal()] = cases[r.espece().ordinal()] + r.effectif();\n        }\n        return cases;\n    }\n\n    void depouiller() {\n        if (releves.isEmpty()) {\n            System.out.println(\"  (aucun relevé)\");\n            return;\n        }\n        int[] totaux = totauxParEspece();\n        List<Bilan> bilans = new ArrayList<>();\n        for (int i = 0; i < ESPECES.length; i++) {\n            bilans.add(new Bilan(ESPECES[i].name(), totaux[i]));\n        }\n        Comparator<Bilan> parEffectif = Comparator.comparingInt(Bilan::effectif);\n        Comparator<Bilan> parNom = Comparator.comparing(Bilan::espece);\n        int rang = 1;\n        for (Bilan b : bilans.stream()\n                .sorted(parEffectif.reversed().thenComparing(parNom))\n                .collect(Collectors.toList())) {\n            System.out.println(\"  \" + rang + \". \" + b.espece() + \" : \" + b.effectif());\n            rang = rang + 1;\n        }\n        Optional<Bilan> absente = bilans.stream().filter(b -> b.effectif() == 0).findFirst();\n        System.out.println(\"  Espèce non observée : \"\n                + absente.map(b -> b.espece()).orElse(\"aucune\"));\n    }\n\n    // Le rapport RESSORT, il ne s'affiche pas : c'est ce qui le rend testable.\n    String rapport() {\n        StringBuilder r = new StringBuilder();\n        int largeur = 44;\n        r.append(\"═\".repeat(largeur)).append(\"\\n\");\n        r.append(\"RAPPORT DE L'OBSERVATOIRE\").append(\"\\n\");\n        r.append(\"═\".repeat(largeur)).append(\"\\n\");\n        int[] totaux = totauxParEspece();\n        for (int i = 0; i < ESPECES.length; i++) {\n            String nom = ESPECES[i].name();\n            r.append(\"  \").append(nom).append(\" \".repeat(12 - nom.length()))\n                    .append(\".\".repeat(Math.max(1, 20 - String.valueOf(totaux[i]).length())))\n                    .append(\" \").append(totaux[i]).append(\"\\n\");\n        }\n        r.append(\"─\".repeat(largeur)).append(\"\\n\");\n        r.append(\"  \").append(releves.size()).append(\" relevé(s) · \")\n                .append(totalGeneral()).append(\" individu(s)\").append(\"\\n\");\n        return r.toString();\n    }\n\n    int totalGeneral() {\n        return releves.stream().mapToInt(r -> r.effectif()).sum();\n    }\n\n    String sauvegarder(String fichier) {\n        try (PrintWriter sortie = new PrintWriter(fichier)) {\n            for (Releve r : releves) {\n                sortie.println(r.versLigne());\n            }\n            return \"Sauvegardé : \" + releves.size() + \" relevé(s)\";\n        } catch (IOException ex) {\n            return \"Écriture impossible : \" + ex.getMessage();\n        }\n    }\n\n    String charger(String fichier) {\n        File f = new File(fichier);\n        if (!f.exists()) {\n            return \"Aucun fichier \" + fichier + \" : registre vide\";\n        }\n        releves.clear();\n        int lus = 0;\n        int rejetes = 0;\n        try (Scanner lecture = new Scanner(f)) {\n            while (lecture.hasNextLine()) {\n                String[] champs = lecture.nextLine().split(\";\");\n                if (champs.length != 3) {\n                    rejetes = rejetes + 1;\n                    continue;\n                }\n                Optional<Espece> e = especeDe(champs[1]);\n                if (!champs[0].matches(CODE_POSTE) || !e.isPresent()\n                        || !champs[2].matches(\"\\\\d{1,3}\")) {\n                    rejetes = rejetes + 1;\n                    continue;\n                }\n                releves.add(new Releve(champs[0], e.get(), Integer.parseInt(champs[2])));\n                lus = lus + 1;\n            }\n        } catch (IOException ex) {\n            return \"Lecture impossible : \" + ex.getMessage();\n        }\n        return \"Rechargé : \" + lus + \" relevé(s), \" + rejetes + \" rejeté(s)\";\n    }\n\n    // Le banc d'essai de la lecon 28, applique aux regles de ce programme.\n    void banc() {\n        int reussis = 0;\n        int echoues = 0;\n        Registre bac = new Registre();\n\n        String[][] cas = {\n            {\"CRE-01\", \"MILAN\", \"12\", \"Relevé enregistré : CRE-01 · MILAN · 12\"},\n            {\"cre-01\", \"MILAN\", \"12\", \"Poste mal formé : « cre-01 »\"},\n            {\"CRE-01\", \"CIGOGNE\", \"12\", \"Espèce inconnue : « CIGOGNE »\"},\n            {\"CRE-01\", \"MILAN\", \"douze\", \"Effectif illisible : « douze »\"},\n            {\"CRE-01\", \"MILAN\", \"1234\", \"Effectif illisible : « 1234 »\"},\n        };\n        for (String[] c : cas) {\n            String obtenu = bac.saisir(c[0], c[1], c[2]);\n            if (c[3].equals(obtenu)) {\n                reussis = reussis + 1;\n                System.out.println(\"  ✓ \" + c[3]);\n            } else {\n                echoues = echoues + 1;\n                System.out.println(\"  ✗ attendu « \" + c[3] + \" », obtenu « \" + obtenu + \" »\");\n            }\n        }\n\n        if (bac.totalGeneral() == 12) {\n            reussis = reussis + 1;\n            System.out.println(\"  ✓ seul le relevé valide a été retenu\");\n        } else {\n            echoues = echoues + 1;\n            System.out.println(\"  ✗ total attendu 12, obtenu \" + bac.totalGeneral());\n        }\n        if (bac.rapport().contains(\"1 relevé(s) · 12 individu(s)\")) {\n            reussis = reussis + 1;\n            System.out.println(\"  ✓ le rapport annonce le bon pied de page\");\n        } else {\n            echoues = echoues + 1;\n            System.out.println(\"  ✗ pied de page du rapport inattendu\");\n        }\n        System.out.println(\"  Banc : \" + reussis + \" réussi(s), \" + echoues + \" échoué(s)\");\n    }\n}\n\nrecord Bilan(String espece, int effectif) { }",
