<h3>1. Le cahier des charges</h3>
<p>La bibliothèque de l'école veut un programme console : <strong>ajouter un livre, lister les livres, emprunter, rendre, sauvegarder dans un fichier, quitter</strong>. On applique la méthode éprouvée : comprendre le besoin → découper en classes → écrire chaque brique → vérifier. Ce projet réunit presque tout le cours.</p>

<h3>2. Le découpage en classes (une responsabilité chacune)</h3>
<pre class="pseudo">Classe Livre       : titre, auteur, emprunté ?  + méthodes   // représente UN livre (les données)
Classe Bibliotheque: la liste des livres + les opérations    // gère la COLLECTION de livres
Classe Main        : le menu et la boucle principale         // s'occupe du DIALOGUE utilisateur</pre>
<p>Chaque classe a un rôle unique : plus clair et plus facile à tester que tout mettre dans <code>main</code>.</p>

<h3>3. La classe Livre (leçons 12-13)</h3>
<pre class="pseudo">public class Livre {
    private String titre;                    // attributs privés (encapsulation, leçon 13)
    private String auteur;
    private boolean emprunte;

    public Livre(String titre, String auteur) {   // constructeur
        this.titre = titre;
        this.auteur = auteur;
        this.emprunte = false;               // un livre naît toujours DISPONIBLE (objet cohérent d'emblée)
    }
    public String getTitre() { return titre; }          // getter
    public boolean estEmprunte() { return emprunte; }
    public boolean emprunter() {
        if (emprunte) { return false; }      // déjà pris → l'emprunt échoue, on renvoie false
        emprunte = true;                     // sinon on le marque emprunté…
        return true;                         // …et on renvoie true (succès)
    }
    public void rendre() { emprunte = false; }          // le rendre = redevenir disponible
    public String toString() {                          // affichage personnalisé
        return titre + " (" + auteur + ")" + (emprunte ? " [SORTI]" : " [dispo]");  // ternaire pour l'état
    }
}</pre>

<h3>4. La classe Bibliotheque (leçons 10, 11, 16)</h3>
<pre class="pseudo">public class Bibliotheque {
    private ArrayList&lt;Livre&gt; livres = new ArrayList&lt;&gt;();  // la collection interne (privée)

    public void ajouter(Livre l) { livres.add(l); }       // ajoute un livre
    public Livre chercher(String titre) {                 // recherche séquentielle (leçon 11)
        for (Livre l : livres) {
            if (l.getTitre().equalsIgnoreCase(titre)) { return l; }  // trouvé (casse ignorée) → on le renvoie
        }
        return null;                                      // aucun livre correspondant : null
    }
    public void lister() {
        if (livres.isEmpty()) { System.out.println("(vide)"); return; }  // cas limite : liste vide
        for (Livre l : livres) { System.out.println(l); }   // {l} déclenche toString automatiquement
    }
    public void sauvegarder(String fichier) { /* PrintWriter, CSV titre;auteur;emprunte (leçon 17) */ }
    public void charger(String fichier) { /* Scanner + split (leçon 17) */ }
}</pre>

<h3>5. Le menu principal (leçons 4, 6, 16)</h3>
<pre class="pseudo">Bibliotheque biblio = new Bibliotheque();
biblio.charger("livres.txt");                        // au démarrage : recharger l'état sauvegardé
int choix = 0;
do {                                                 // do-while : afficher le menu au moins une fois
    System.out.println("1.Ajouter 2.Lister 3.Emprunter 4.Rendre 5.Quitter");
    try {
        choix = Integer.parseInt(clavier.nextLine()); // lecture + conversion protégée
    } catch (NumberFormatException e) { choix = 0; }  // saisie non numérique → choix invalide (0)
    switch (choix) {                                  // aiguillage selon le choix
        case 1: /* lire titre+auteur, puis biblio.ajouter(new Livre(...)) */ break;
        case 2: biblio.lister(); break;
        case 3: /* chercher puis emprunter, en gérant null ET false ! */ break;
        case 4: /* chercher puis rendre */ break;
    }
} while (choix != 5);                                 // on répète jusqu'au choix « Quitter »
biblio.sauvegarder("livres.txt");                     // à la sortie : sauvegarder l'état</pre>
<div class="tip">Repère la carte du cours : do-while pour le menu (leçon 6), try/catch sur la saisie (16), recherche séquentielle (11), null à gérer (12), encapsulation (13), fichier au départ/à l'arrivée (17). Le projet EST la révision : chaque brique, vue isolément, collabore ici.</div>`,

    { type: "qcm", q: "emprunter() retourne false si le livre est déjà sorti. Quel principe ?", opts: ["L'héritage", "La règle métier vit DANS l'objet : impossible d'emprunter deux fois, quoi que fasse le menu", "Une erreur de conception", "Le polymorphisme"], a: 1, exp: "L'encapsulation protège : le menu ne peut pas tricher." },

    { type: "qcm", q: "Dans quel format sauvegarder les livres ?", opts: ["Un binaire illisible", "CSV : titre;auteur;emprunte — une ligne par livre (leçon 17)", "Un tableau JSON imbriqué", "Une base de données SQL"], a: 1, exp: "Simple, lisible, rechargeable avec split." },
    { type: "qcm", q: "Quand appeler charger() et sauvegarder() ?", opts: ["À chaque action", "charger au DÉMARRAGE, sauvegarder à la SORTIE (choix 5) : le cycle de la leçon 17", "Après chaque emprunt", "Uniquement en cas d'erreur"], a: 1, exp: "Fichier → mémoire → fichier." },
    { type: "qcm", q: "System.out.println(l) affiche « Titre (Auteur) [dispo] » grâce à…", opts: ["getTitre", "toString() redéfini (leçon 13)", "printf", "La méthode equals()"], a: 1, exp: "La carte d'identité affichable de chaque objet." },
    { type: "qcm", q: "L'utilisateur emprunte « Dune » déjà sorti. Chaîne des événements ?", opts: ["Plantage", "chercher trouve le Livre → emprunter() retourne false → le menu affiche « déjà emprunté »", "Un doublon est créé", "rendre() est appelé"], a: 1, exp: "Chaque couche joue son rôle : objet = règle, menu = dialogue." },
    { type: "qcm", q: "Pour tester la classe Livre SEULE, il faut…", opts: ["Tout le projet", "Un petit main d'essai : new Livre, emprunter deux fois, vérifier false — testable isolément (jour 22)", "Une base de données", "Un framework externe"], a: 1, exp: "Brique par brique : on teste avant d'assembler." },
    { type: "qcm", q: "Évolution demandée : « trier les livres par titre à l'affichage ». Où intervenir ?", opts: ["Dans Main", "Dans Bibliotheque.lister() : un tri (leçon 11) avant la boucle — les autres classes ne bougent pas", "Dans Livre", "Dans une nouvelle classe de tri"], a: 1, exp: "Le découpage paie : une évolution = une méthode touchée." }
  ],
