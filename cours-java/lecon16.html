  title: "Les exceptions",
  subtitle: "Quand ça tourne mal : détecter, attraper, réagir proprement.",
  theory: `
<h3>1. Qu'est-ce qu'une exception ?</h3>
<p>Tu en as déjà croisé : <code>ArrayIndexOutOfBoundsException</code> (leçon 7), <code>NullPointerException</code> (leçon 12)… Une <strong>exception</strong> est un objet-signal que Java « lance » (comme une alarme qui se déclenche) quand une opération rencontre une situation anormale (texte non convertible, division par zéro, objet null…). Si personne ne la traite, elle remonte jusqu'en haut et fait planter le programme.</p>

<h3>2. try / catch : le filet de sécurité</h3>
<pre class="pseudo">try {
    int n = Integer.parseInt(saisie);      // peut lancer NumberFormatException si saisie n'est pas un nombre
    System.out.println(100 / n);           // peut lancer ArithmeticException si n vaut 0
} catch (NumberFormatException e) {        // ce catch se déclenche UNIQUEMENT pour une NumberFormatException
    System.out.println("Ce n'est pas un nombre !");
} catch (ArithmeticException e) {          // celui-ci UNIQUEMENT pour une erreur arithmétique (÷0)
    System.out.println("Division par zéro !");
}
System.out.println("La vie continue");     // après avoir géré l'erreur, le programme SURVIT et poursuit</pre>
<p>Le mot <code>try</code> veut dire « essaie » et <code>catch</code> « attrape ». Si une ligne du <code>try</code> lance une exception, le reste du <code>try</code> est abandonné et Java saute au <code>catch</code> du bon type, puis continue APRÈS le bloc. Sans exception, les <code>catch</code> sont ignorés.</p>

<h3>3. finally : le « quoi qu'il arrive »</h3>
<pre class="pseudo">try {
    // travail risqué
} catch (Exception e) {
    // réaction en cas d'erreur (e.getMessage() donne le texte de l'erreur)
} finally {
    // exécuté DANS TOUS LES CAS, erreur ou non : fermer un fichier, une connexion...
}</pre>
<p>Le bloc <code>finally</code> (« finalement ») s'exécute quoi qu'il arrive : c'est l'endroit idéal pour libérer les ressources (fermer un fichier), qu'une erreur soit survenue ou non.</p>

<h3>4. Lancer soi-même : throw</h3>
<p>Tes validations de la leçon 13 peuvent devenir des exceptions :</p>
<pre class="pseudo">public void retirer(double m) {
    if (m &gt; solde) {                        // règle métier violée : on retire plus que le solde
        throw new IllegalArgumentException("Solde insuffisant : " + solde);  // on LANCE une exception
    }
    solde -= m;                            // atteint seulement si la règle est respectée
}</pre>
<p><code>throw</code> (« lancer ») signale activement une erreur au lieu de continuer avec des données incohérentes. L'appelant décide alors : l'attraper (<code>catch</code>) et proposer autre chose, ou la laisser remonter.</p>

<h3>5. Le grand classique : sécuriser une saisie</h3>
<pre class="pseudo">int age = -1;
boolean valide = false;
while (!valide) {                              // on répète tant qu'on n'a pas une saisie valide
    try {
        System.out.println("Ton âge ?");
        age = Integer.parseInt(clavier.nextLine());
        valide = true;                        // atteint SEULEMENT si parseInt n'a pas explosé → on sortira
    } catch (NumberFormatException e) {
        System.out.println("Nombre invalide, recommence !");  // saisie non numérique : on redemande
    }
}</pre>
<p>Placement clé : <code>valide = true</code> est APRÈS le <code>parseInt</code>. Si la conversion échoue, l'exception saute cette ligne : <code>valide</code> reste <code>false</code> et la boucle recommence. L'utilisateur peut taper « abc », le programme redemande poliment.</p>
<div class="warn">Ne JAMAIS écrire un catch vide <code>catch (Exception e) {}</code> : l'erreur est avalée en silence, le bug devient introuvable. Au minimum : afficher un message.</div>
<div class="tip">Exceptions courantes à reconnaître : <code>NumberFormatException</code> (texte→nombre raté), <code>ArithmeticException</code> (÷0 entier), <code>ArrayIndexOutOfBoundsException</code> (débordement), <code>NullPointerException</code> (objet null), <code>InputMismatchException</code> (Scanner surpris).</div>`,
  exercises: [
    { type: "qcm", q: "Une exception non attrapée provoque…", opts: ["Un simple avertissement", "L'arrêt brutal du programme avec la pile d'appels affichée", "Le programme continue en ignorant la ligne fautive", "Une valeur par défaut utilisée à la place"], a: 1, exp: "Le « stack trace » rouge : lis-le, il donne la ligne exacte." },
    { type: "qcm", q: "Le bloc <code>try</code> contient…", opts: ["La réaction à l'erreur", "Le code RISQUÉ à surveiller", "La fermeture des fichiers", "Les imports"], a: 1, exp: "try = « essaie ceci » ; catch = « si ça éclate, fais cela »." },
    { type: "qcm", q: "Si AUCUNE exception n'éclate dans le try, le catch…", opts: ["S'exécute quand même", "Est complètement ignoré", "Ne s'exécute que si un finally est présent", "Plante"], a: 1, exp: "Le filet ne sert que si on tombe." },
    { type: "qcm", q: "<code>Integer.parseInt(\"abc\")</code> lance…", opts: ["ArithmeticException", "NumberFormatException", "NullPointerException", "Rien : ça vaut 0"], a: 1, exp: "Le texte→nombre raté : LA cliente des saisies utilisateur." },

    { type: "qcm", q: "Quand le bloc <code>finally</code> s'exécute-t-il ?", opts: ["Seulement après une exception", "Seulement sans exception", "TOUJOURS : exception ou pas — idéal pour fermer les ressources", "Jamais"], a: 2, exp: "Le « quoi qu'il arrive » du nettoyage." },
    { type: "qcm", q: "<code>throw new IllegalArgumentException(\"...\")</code> sert à…", opts: ["Attraper une erreur", "LANCER soi-même une exception quand une règle métier est violée", "Ignorer une erreur", "Créer un objet normal"], a: 1, exp: "Tes validations de la leçon 13, promues en signaux officiels." },
    { type: "qcm", q: "Pourquoi un catch VIDE est-il une faute grave ?", opts: ["Il ralentit", "L'erreur est avalée en silence : le programme continue avec des données fausses, bug introuvable", "Il ne compile pas", "Il double l'exception"], a: 1, exp: "Toujours au moins tracer le problème." },
    { type: "qcm", q: "Deux catch : NumberFormatException puis ArithmeticException. L'utilisateur tape « 0 » et on calcule 100/n. Quel catch ?", opts: ["Le premier", "Le second : \"0\" se parse très bien, c'est la division qui explose", "Les deux", "Aucun"], a: 1, exp: "Chaque catch attrape SON type : diagnostic précis." },
    { type: "qcm", q: "Dans la boucle de saisie sécurisée, pourquoi <code>valide = true</code> est-il APRÈS le parseInt ?", opts: ["Par style", "Si parseInt explose, la ligne n'est jamais atteinte : on reste dans la boucle. Sinon, on sort", "Ça devrait être avant", "Aucune importance"], a: 1, exp: "L'exception saute la fin du try : le placement fait toute la logique." },
    { type: "qcm", q: "catch (Exception e) attrape…", opts: ["Seulement les NullPointer", "Presque tout (Exception est la classe MÈRE) — pratique mais moins précis", "Uniquement les exceptions lancées par throw", "Les erreurs de compilation"], a: 1, exp: "L'héritage de la leçon 14 s'applique aux exceptions ! Attraper large = diagnostiquer flou." },
    { type: "qcm", q: "Les exceptions attrapent-elles les erreurs de COMPILATION (point-virgule oublié) ?", opts: ["Oui", "Non : la compilation précède l'exécution — try/catch ne concerne que l'exécution", "Parfois", "Avec finally oui"], a: 1, exp: "Grammaire (compilation) ≠ imprévu (exécution). Distinction de la leçon 1." },
    { type: "qcm", q: "e.getMessage() dans un catch donne…", opts: ["La ligne du bug", "Le MESSAGE embarqué dans l'exception (ex : « Solde insuffisant : 60.0 »)", "Le nom du fichier", "Le type de l'exception (ex : NumberFormatException)"], a: 1, exp: "Le message que le throw a rédigé — sois précis en le rédigeant." },
    { type: "qcm", q: "Après un catch exécuté, le programme…", opts: ["S'arrête", "Reprend APRÈS le bloc try/catch et continue normalement", "Recommence le try", "Saute au main"], a: 1, exp: "C'est tout l'intérêt : survivre à l'imprévu. (Pour réessayer : la boucle autour !)" },
    { type: "vf", q: "Prévenir (if montant <= solde) et guérir (try/catch) sont complémentaires : on valide ce qu'on peut prévoir, on attrape ce qu'on ne peut pas.", a: true, exp: "Le if pour les règles connues, l'exception pour l'imprévisible (fichier disparu, réseau coupé…)." }
  ],
  final: {
    title: "Exercice final — Le distributeur blindé",
    intro: `<p>Le distributeur de billets combine tout :</p>
<pre class="pseudo">public static void main(String[] args) {
    Scanner clavier = new Scanner(System.in);          // lecteur de clavier
    Compte c = new Compte("Ana", 100);                 // compte de test à 100 €
    boolean ok = false;                                // drapeau : retrait réussi ?
    while (!ok) {                                       // on répète tant que ce n'est pas réussi
        try {                                          // zone surveillée
            System.out.println("Montant à retirer ?"); // invite
            double m = Double.parseDouble(clavier.nextLine());   // (1) peut lancer NumberFormatException
            c.retirer(m);                                        // (2) peut throw IllegalArgumentException
            ok = true;                                 // atteint seulement si (1) et (2) réussissent
            System.out.println("Billets distribués !"); // succès
        } catch (NumberFormatException e) {            // saisie non numérique
            System.out.println("Tape un NOMBRE.");     // message adapté
        } catch (IllegalArgumentException e) {         // règle métier violée (solde insuffisant)
            System.out.println("Refus : " + e.getMessage()); // affiche le message du throw
        } finally {                                    // dans TOUS les cas
            System.out.println("--- fin de tentative ---");      // (3) exécuté à chaque tour
        }
    }
}</pre>
<p>retirer() lance IllegalArgumentException(« Solde insuffisant ») si m > solde. L'utilisateur tape successivement : <strong>« abc »</strong>, <strong>« 150 »</strong>, <strong>« 60 »</strong>.</p>`,
    questions: [
      { type: "qcm", q: "Saisie « abc » : que se passe-t-il ?", opts: ["Billets distribués", "NumberFormatException au (1) → « Tape un NOMBRE. » → finally → on reboucle", "IllegalArgument", "Plantage"], a: 1, exp: "parseDouble échoue, le catch adapté réagit, la boucle redemande." },
      { type: "qcm", q: "Saisie « 150 » : que se passe-t-il ?", opts: ["Distribution", "Le parse réussit, mais retirer() THROW → « Refus : Solde insuffisant » → on reboucle", "NumberFormat", "finally sauté"], a: 1, exp: "L'exception métier de la classe Compte remonte jusqu'au catch de main." },
      { type: "qcm", q: "Combien de fois « --- fin de tentative --- » s'affiche-t-il au total ?", opts: ["1", "2", "3 : finally s'exécute à CHAQUE tour, exception ou pas", "0"], a: 2, exp: "abc, 150, 60 : trois tentatives, trois finally." },
      { type: "input", q: "Après la saisie « 60 », que vaut le solde du compte ?", a: "40", ph: "nombre", exp: "100 − 60 = 40, et ok = true libère la boucle." },
      { type: "qcm", q: "Pourquoi retirer() LANCE une exception au lieu de retourner false (leçon 13) ?", opts: ["false est interdit", "L'exception PORTE un message précis et ne peut pas être ignorée par mégarde — un false oublié passe inaperçu", "C'est plus court", "Aucune différence"], a: 1, exp: "Deux styles valides ; l'exception force le traitement et documente la cause. À toi de choisir selon le contexte." }
    ],
    solution: `<pre class="pseudo">Tentative 1 : "abc"  → NumberFormatException → message → finally
Tentative 2 : "150"  → retirer THROW IllegalArgument → refus → finally
Tentative 3 : "60"   → retrait OK, solde 40, ok=true → finally → sortie

Architecture : la RÈGLE vit dans Compte (throw),
la RÉACTION vit dans main (catch), la PERSÉVÉRANCE dans la boucle.</pre>
<p>Prévenir, lancer, attraper, nettoyer : ton programme ne craint plus ni l'utilisateur farceur ni l'imprévu. Demain : les fichiers.</p>`
  }
};
