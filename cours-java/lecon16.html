  theory: `
<h3>1. Qu'est-ce qu'une exception ?</h3>
<p>Tu en as déjà croisé : <code>ArrayIndexOutOfBoundsException</code> (leçon 7), <code>NullPointerException</code> (leçon 12)… Une <strong>exception</strong> est un objet-signal que Java « lance » (comme une alarme qui se déclenche) quand une opération rencontre une situation anormale (texte non convertible, division par zéro, objet null…). Si personne ne la traite, elle remonte jusqu'en haut et fait planter le programme.</p>

<h3>2. try / catch : le filet de sécurité</h3>
<pre class="pseudo">try {
    int n = Integer.parseInt(saisie);      // peut lancer NumberFormatException si saisie n'est pas un nombre
    System.out.println(100 / n);           // peut lancer ArithmeticException si n vaut 0
} catch (NumberFormatException e) {        // ce catch se déclenche UNIQUEMENT pour une NumberFormatException
    System.out.println("Ce n'est pas un nombre !");
} catch (ArithmeticException e) {          // celui-ci UNIQUEMENT pour une erreur arithmétique (÷0)
    System.out.println("Division par zéro !");
}
System.out.println("La vie continue");     // après avoir géré l'erreur, le programme SURVIT et poursuit</pre>
<p>Le mot <code>try</code> veut dire « essaie » et <code>catch</code> « attrape ». Si une ligne du <code>try</code> lance une exception, le reste du <code>try</code> est abandonné et Java saute au <code>catch</code> du bon type, puis continue APRÈS le bloc. Sans exception, les <code>catch</code> sont ignorés.</p>

<h3>3. finally : le « quoi qu'il arrive »</h3>
<pre class="pseudo">try {
    // travail risqué
} catch (Exception e) {
    // réaction en cas d'erreur (e.getMessage() donne le texte de l'erreur)
} finally {
    // exécuté DANS TOUS LES CAS, erreur ou non : fermer un fichier, une connexion...
}</pre>
<p>Le bloc <code>finally</code> (« finalement ») s'exécute quoi qu'il arrive : c'est l'endroit idéal pour libérer les ressources (fermer un fichier), qu'une erreur soit survenue ou non.</p>

<h3>4. Lancer soi-même : throw</h3>
<p>Tes validations de la leçon 13 peuvent devenir des exceptions :</p>
<pre class="pseudo">public void retirer(double m) {
    if (m &gt; solde) {                        // règle métier violée : on retire plus que le solde
        throw new IllegalArgumentException("Solde insuffisant : " + solde);  // on LANCE une exception
    }
    solde -= m;                            // atteint seulement si la règle est respectée
}</pre>
<p><code>throw</code> (« lancer ») signale activement une erreur au lieu de continuer avec des données incohérentes. L'appelant décide alors : l'attraper (<code>catch</code>) et proposer autre chose, ou la laisser remonter.</p>

<h3>5. Le grand classique : sécuriser une saisie</h3>
<pre class="pseudo">int age = -1;
boolean valide = false;
while (!valide) {                              // on répète tant qu'on n'a pas une saisie valide
    try {
        System.out.println("Ton âge ?");
        age = Integer.parseInt(clavier.nextLine());
        valide = true;                        // atteint SEULEMENT si parseInt n'a pas explosé → on sortira
    } catch (NumberFormatException e) {
        System.out.println("Nombre invalide, recommence !");  // saisie non numérique : on redemande
    }
}</pre>
<p>Placement clé : <code>valide = true</code> est APRÈS le <code>parseInt</code>. Si la conversion échoue, l'exception saute cette ligne : <code>valide</code> reste <code>false</code> et la boucle recommence. L'utilisateur peut taper « abc », le programme redemande poliment.</p>

<pre class="pseudo">public static void main(String[] args) {
    Scanner clavier = new Scanner(System.in);          // lecteur de clavier
    Compte c = new Compte("Ana", 100);                 // compte de test à 100 €
    boolean ok = false;                                // drapeau : retrait réussi ?
    while (!ok) {                                       // on répète tant que ce n'est pas réussi
        try {                                          // zone surveillée
            System.out.println("Montant à retirer ?"); // invite

            c.retirer(m);                                        // (2) peut throw IllegalArgumentException

        }
    }

      "solution": "// Le comptoir d'enregistrement : les regles de bagage ne se signalent pas\n// par un booleen mais par une exception qui PORTE le motif du refus.\n\npublic class Comptoir {\n    public static void main(String[] args) {\n        double[] poids = {18.5, 22.4, -3.0, 8.2, 27.0};\n        String[] passagers = {\"Zoé Hermans\", \"Milan Radu\", \"Aya Cissé\", \"Tomás Rey\",\n                              \"Lena Kowal\"};\n\n        double totalSoute = 0.0;\n        int acceptes = 0;\n        int refuses = 0;\n\n        for (int i = 0; i < poids.length; i++) {\n            try {\n                double supplement = enregistrer(passagers[i], poids[i]);\n                totalSoute = totalSoute + poids[i];\n                acceptes = acceptes + 1;\n                System.out.println(passagers[i] + \" : bagage accepté, supplément \"\n                                   + supplement + \" €\");\n            } catch (BagageRefuseException e) {\n                refuses = refuses + 1;\n                // Le message est ecrit une fois, la ou la regle est connue.\n                System.out.println(passagers[i] + \" : REFUS — \" + e.getMessage());\n            } finally {\n                System.out.println(\"  dossier \" + (i + 1) + \" clos\");\n            }\n        }\n\n        System.out.println();\n        System.out.println(\"Bagages présentés : \" + poids.length);\n        System.out.println(\"Acceptés : \" + acceptes + \", refusés : \" + refuses);\n        System.out.println(\"Masse en soute : \" + Math.round(totalSoute * 10) / 10.0 + \" kg\");\n    }\n\n    static final double FRANCHISE_KG = 20.0;\n    static final double PLAFOND_KG = 23.0;\n    static final double PRIX_KILO_SUPP = 12.00;\n\n    // La methode ne rend PAS un booleen : elle rend le supplement du, et\n    // signale l'impossibilite par une exception. Les deux issues ne sont\n    // pas de meme nature, elles n'ont pas a partager le meme canal.\n    static double enregistrer(String passager, double poidsKg) {\n        if (poidsKg <= 0) {\n            throw new BagageRefuseException(\"poids invalide (\" + poidsKg + \" kg)\");\n        }\n        if (poidsKg > PLAFOND_KG) {\n            throw new BagageRefuseException(\"au-delà du plafond de \" + PLAFOND_KG + \" kg\");\n        }\n        if (poidsKg <= FRANCHISE_KG) {\n            return 0.0;\n        }\n        double excedent = poidsKg - FRANCHISE_KG;\n        return Math.round(excedent * PRIX_KILO_SUPP * 100) / 100.0;\n    }\n}\n\n// Une exception maison : elle ne fait qu'exister, et c'est deja beaucoup.\n// Son NOM est l'information principale ; le message ne fait qu'ajouter\n// le detail du cas.\nclass BagageRefuseException extends RuntimeException {\n    BagageRefuseException(String motif) {\n        super(motif);\n    }\n}",

s'est mal passe » : c'est justement ce\n    // qu'on cherche a supprimer.\n    static double louerA(ArrayList<Louable> flotte, String code) {\n        for (Louable l : flotte) {\n            if (l.identifiant().equals(code)) {\n                if (!l.louer()) {\n                    throw new EngiIndisponibleException(code + \" (\" + l.description() + \")\");\n                }\n                return l.tarifCourse();\n            }\n        }\n        throw new EngiInconnuException(code);\n    }\n}\n\nclass EngiInconnuException extends RuntimeException {\n    EngiInconnuException(String code) {\n        super(\"aucun engin sous le code \" + code);\n    }\n}\n\nclass EngiIndisponibleException extends RuntimeException {\n    EngiIndisponibleException(String detail) {\n        super(detail);\n    }\n}\n\ninterface Louable {\n    String identifiant();\n    String description();\n    boolean estDisponible();\n    boolean louer();\n    boolean rendre();\n    double tarifCourse();\n}\n\nclass Velo implements Louable {\n    private static final double TARIF_BASE = 1.20;\n\n    private String code;\n    private int anneeMiseEnService;\n    private boolean disponible;\n    private int courses;\n\n    Velo(String code, int anneeMiseEnService) {\n        this.code = code.trim().toUpperCase();\n        this.anneeMiseEnService = anneeMiseEnService;\n        this.disponible = true;\n        this.courses = 0;\n    }\n\n    int getCourses() {\n        return courses;\n    }\n\n    @Override\n    public String identifiant() {\n        return code;\n    }\n\n    @Override\n    public String description() {\n        return \"vélo mécanique, \" + courses + \" course(s)\";\n    }\n\n    @Override\n    public boolean estDisponible() {\n        return disponible;\n    }\n\n    @Override\n    public boolean louer() {\n        if (!disponible) {\n            return false;\n        }\n        disponible = false;\n        courses = courses + 1;\n        return true;\n    }\n\n    @Override\n    public boolean rendre() {\n        if (disponible) {\n            return false;\n        }\n        disponible = true;\n        return true;\n    }\n\n    @Override\n    public double tarifCourse() {\n        double tarif = TARIF_BASE;\n        if (anneeMiseEnService <= 2020) {\n            tarif = tarif - 0.30;\n        }\n        return Math.round(tarif * 100) / 100.0;\n    }\n}\n\nclass VeloElectrique extends Velo {\n    private static final int BATTERIE_MINIMALE = 20;\n    private static final int CONSOMMATION_PAR_COURSE = 15;\n    private static final double SUPPLEMENT = 0.80;\n\n    private int batteriePourcent;\n\n    VeloElectrique(String code, int anneeMiseEnService, int batteriePourcent) {\n        super(code, anneeMiseEnService);\n        this.batteriePourcent = batteriePourcent;\n    }\n\n    @Override\n    public boolean louer() {\n        if (batteriePourcent < BATTERIE_MINIMALE) {\n            return false;\n        }\n        if (!super.louer()) {\n            return false;\n        }\n        batteriePourcent = batteriePourcent - CONSOMMATION_PAR_COURSE;\n        return true;\n    }\n\n    @Override\n    public double tarifCourse() {\n        return Math.round((super.tarifCourse() + SUPPLEMENT) * 100) / 100.0;\n    }\n\n    @Override\n    public String description() {\n        return \"vélo électrique (\" + batteriePourcent + \" %), \" + getCourses() + \" course(s)\";\n    }\n}\n\nclass Trottinette implements Louable {\n    private static final double PRISE_EN_CHARGE = 1.00;\n    private static final int AUTONOMIE_MINIMALE = 15;\n\n    private String code;\n    private int autonomiePourcent;\n    private boolean disponible;\n\n    Trottinette(String code, int autonomiePourcent) {\n        this.code = code.trim().toUpperCase();\n        this.autonomiePourcent = autonomiePourcent;\n        this.disponible = true;\n    }\n\n    @Override\n    public String identifiant() {\n        return code;\n    }\n\n    @Override\n    public String description() {\n        return \"trottinette (\" + autonomiePourcent + \" % d'autonomie)\";\n    }\n\n    @Override\n    public boolean estDisponible() {\n        return disponible;\n    }\n\n    @Override\n    public boolean louer() {\n        if (!disponible || autonomiePourcent < AUTONOMIE_MINIMALE) {\n            return false;\n        }\n        disponible = false;\n        autonomiePourcent = autonomiePourcent - 10;\n        return true;\n    }\n\n    @Override\n    public boolean rendre() {\n        if (disponible) {\n            return false;\n        }\n        disponible = true;\n        return true;\n    }\n\n    @Override\n    public double tarifCourse() {\n        return PRISE_EN_CHARGE;\n    }\n}",
