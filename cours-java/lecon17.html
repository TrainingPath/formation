  title: "Lire et écrire des fichiers",

  theory: `
<h3>1. Pourquoi des fichiers ?</h3>
<p>À la fin du <code>main</code>, la <strong>mémoire vive (RAM)</strong> est libérée : toutes tes variables et tes <code>ArrayList</code> disparaissent. Pour que les données <strong>persistent</strong> (scores, inscriptions, configuration), il faut les copier de la RAM (volatile) vers un <strong>fichier</strong> sur le disque (durable). Lire un fichier, c'est l'opération inverse : recharger dans la RAM ce qui avait été sauvegardé.</p>
<p>En Java, l'écriture et la lecture passent par des <strong>flux (streams)</strong> : un « tuyau » d'octets entre ton programme et le fichier. C'est le même concept que <code>StreamWriter</code>/<code>StreamReader</code> en C#, simplement avec d'autres noms de classes.</p>

<h3>2. Écrire simplement : PrintWriter</h3>
<pre class="pseudo">import java.io.PrintWriter;                   // la classe qui écrit du texte dans un fichier
import java.io.IOException;                    // l'exception si l'écriture échoue

try (PrintWriter sortie = new PrintWriter("scores.txt")) { // ouvre (et ÉCRASE) le fichier ; try(...) le fermera tout seul
    sortie.println("Ana;14");                 // écrit la ligne + un retour à la ligne (comme System.out, mais vers le fichier)
    sortie.println("Bob;9");                  // deuxième ligne
} catch (IOException e) {                      // si l'écriture échoue (disque plein, droits…)
    System.out.println("Écriture impossible : " + e.getMessage()); // message clair au lieu d'un plantage
}                                              // à la sortie du try : le fichier est fermé, le tampon vidé</pre>
<div class="warn">Piège n°1 — l'écrasement : <code>new PrintWriter("scores.txt")</code> ÉCRASE le fichier existant. Le contenu précédent est perdu, comme une réaffectation de variable (leçon 2). Pour AJOUTER à la fin, voir la section 4.</div>

<h3>3. Le try-with-resources : fermeture automatique</h3>
<p>La parenthèse après <code>try</code> — <code>try (PrintWriter p = …)</code> — déclare une <strong>ressource</strong> qui sera <strong>fermée automatiquement</strong> à la sortie du bloc, même si une exception éclate. C'est le <code>finally</code> de la leçon 16, automatisé, et l'équivalent exact du <code>using</code> de C#.</p>
<p>Pourquoi c'est vital ? Un flux d'écriture utilise un <strong>tampon (buffer)</strong> : une zone mémoire où le texte s'accumule avant d'être réellement écrit sur le disque en un bloc (le disque est lent). Tant qu'on n'a pas <strong>fermé</strong> le flux (ce qui déclenche un <code>flush</code>, le « vidage » du tampon), les dernières données restent en mémoire et <strong>ne sont pas sur le disque</strong>.</p>
<div class="warn">Piège n°2 — le fichier vide : un flux jamais fermé peut laisser un fichier VIDE ou incomplet, car le tampon n'a pas été vidé. Le try-with-resources s'en charge pour toi.</div>

<h3>4. L'équivalent Java de StreamWriter : FileWriter + BufferedWriter</h3>
<p>En C#, <code>StreamWriter</code> écrit au fil de l'eau avec un tampon. En Java, on assemble deux classes : <code>FileWriter</code> (parle au fichier, octet par octet) enveloppé dans <code>BufferedWriter</code> (ajoute le tampon efficace). C'est le motif « flux emboîtés » typique de Java.</p>
<pre class="pseudo">import java.io.FileWriter;                     // écrit des caractères DANS un fichier
import java.io.BufferedWriter;                 // enveloppe un Writer pour lui ajouter un TAMPON efficace
import java.io.IOException;                     // exception d'entrée/sortie

try (BufferedWriter ecrivain =                 // ressource fermée automatiquement
        new BufferedWriter(new FileWriter("scores.txt", true))) { // true = MODE AJOUT (append) ; sans lui : écrasement
    ecrivain.write("Ana;14");                  // écrit le texte DANS LE TAMPON (pas encore sur le disque)
    ecrivain.newLine();                         // ajoute un retour à la ligne (portable : \\n ou \\r\\n selon l'OS)
    ecrivain.write("Bob;9");                    // deuxième enregistrement
    ecrivain.newLine();                         // fin de ligne
} catch (IOException e) {                        // en cas d'échec d'écriture
    System.out.println("Erreur : " + e.getMessage()); // on informe proprement
}                                               // fermeture auto → flush (vide le tampon) → close (ferme le fichier)</pre>
<div class="tip">Résumé des équivalences d'ÉCRITURE : C# <code>StreamWriter</code> ≈ Java <code>BufferedWriter(new FileWriter(...))</code> ≈ PHP <code>fopen(..., "w")</code> + <code>fwrite</code>. Même idée : un flux tamponné vers le fichier.</div>

<h3>5. Lire, façon Scanner (retrouvailles !)</h3>
<pre class="pseudo">import java.io.File;                           // représente un chemin de fichier
import java.io.FileNotFoundException;          // exception si le fichier n'existe pas
import java.util.Scanner;                       // le lecteur déjà vu à la leçon 4

try (Scanner lecteur = new Scanner(new File("scores.txt"))) { // Scanner branché sur un FICHIER (au lieu du clavier)
    while (lecteur.hasNextLine()) {            // TANT QU'il reste au moins une ligne à lire…
        String ligne = lecteur.nextLine();     // …on lit la ligne suivante
        System.out.println(ligne);             // et on la traite (ici : affichage)
    }                                          // on remonte tester s'il reste des lignes
} catch (FileNotFoundException e) {             // le fichier n'existe pas (déplacé, renommé, 1er lancement…)
    System.out.println("Fichier introuvable !"); // message propre
}                                               // fermeture automatique du Scanner (et donc du fichier)</pre>
<p>Le Scanner de la leçon 4 lit aussi les fichiers : mêmes méthodes, autre source. <code>hasNextLine()</code> est la condition de continuation d'un TANT QUE (leçon 6) : le nombre de tours est <strong>inconnu</strong> puisque le fichier peut avoir n'importe quelle taille.</p>

<h3>6. L'équivalent Java de StreamReader : FileReader + BufferedReader</h3>
<p>Le vrai jumeau de <code>StreamReader</code> (C#), c'est <code>BufferedReader</code>. On enveloppe <code>FileReader</code> (lit le fichier) dans <code>BufferedReader</code> (ajoute le tampon + la méthode <code>readLine()</code>).</p>
<pre class="pseudo">import java.io.FileReader;                     // lit des caractères DEPUIS un fichier
import java.io.BufferedReader;                 // enveloppe un Reader : ajoute le tampon et readLine()
import java.io.IOException;                     // exception d'entrée/sortie

try (BufferedReader lecteur =                  // ressource fermée automatiquement
        new BufferedReader(new FileReader("scores.txt"))) { // ouvre le fichier en lecture, avec tampon
    String ligne;                              // recevra chaque ligne lue
    while ((ligne = lecteur.readLine()) != null) { // readLine() rend la ligne suivante, ou null à la FIN du fichier
        System.out.println(ligne);             // traite la ligne tant qu'elle n'est pas null
    }                                          // on reboucle avec la ligne suivante
} catch (IOException e) {                        // erreur de lecture (fichier absent inclus)
    System.out.println("Lecture impossible : " + e.getMessage());
}                                               // fermeture automatique du flux</pre>
<p>Le motif <code>while ((ligne = lecteur.readLine()) != null)</code> est identique, mot pour mot, à celui de <code>StreamReader.ReadLine()</code> en C# : on lit, on range dans <code>ligne</code>, et <code>null</code> signale la fin du fichier.</p>
<div class="tip">Résumé des équivalences de LECTURE : C# <code>StreamReader.ReadLine()</code> ≈ Java <code>BufferedReader.readLine()</code> ≈ PHP <code>fgets($f)</code>. Le Scanner reste plus simple pour débuter ; BufferedReader est plus rapide sur les gros fichiers.</div>

<h3>7. Le format CSV : structurer les lignes</h3>
<pre class="pseudo">Ana;14                                        // un enregistrement par ligne…
Bob;9                                          // …le ; sépare les champs
String[] champs = ligne.split(";");            // découpe « Ana;14 » en {"Ana","14"} (split de la leçon 9)
String nom = champs[0];                        // 1er champ : le nom
int note = Integer.parseInt(champs[1]);        // 2e champ : "14" (texte) → 14 (nombre) — parse de la leçon 16</pre>

<h3>8. Sérialiser un objet entier (Serializable)</h3>
<p>Le CSV oblige à écrire chaque champ à la main. Pour sauvegarder un objet <strong>entier</strong> d'un coup — avec ses champs imbriqués — Java propose la <strong>sérialisation</strong> : transformer un objet en une suite d'<strong>octets</strong> (et l'inverse, la <strong>désérialisation</strong>). C'est l'équivalent du <code>JsonSerializer</code> de C# ou de <code>json.dumps</code> de Python, mais au format <strong>binaire</strong> et intégré au langage.</p>
<pre class="pseudo">import java.io.*;                               // ObjectOutputStream, FileOutputStream, Serializable…

class Etudiant implements Serializable {        // interface-MARQUEUR : aucune méthode à écrire
    private static final long serialVersionUID = 1L; // numéro de version du format
    String nom; int note;
    Etudiant(String nom, int note) { this.nom = nom; this.note = note; }
}

// SÉRIALISER : objet → octets → fichier
try (ObjectOutputStream sortie =
        new ObjectOutputStream(new FileOutputStream("etu.ser"))) {
    sortie.writeObject(new Etudiant("Ana", 14)); // écrit l'objet ENTIER d'un coup
} catch (IOException e) { System.out.println(e.getMessage()); }

// DÉSÉRIALISER : fichier → octets → objet
try (ObjectInputStream entree =
        new ObjectInputStream(new FileInputStream("etu.ser"))) {
    Etudiant e = (Etudiant) entree.readObject(); // reconstruit l'objet (cast nécessaire)
    System.out.println(e.nom + " : " + e.note);
} catch (IOException | ClassNotFoundException e) { System.out.println(e.getMessage()); }</pre>
<div class="tip"><code>Serializable</code> est une <strong>interface-marqueur</strong> : elle ne demande aucune méthode, elle « autorise » simplement la classe à être sérialisée. <code>writeObject</code>/<code>readObject</code> gèrent l'objet entier, y compris ses objets imbriqués — sans découpage champ par champ.</div>
<div class="warn">Trois différences à connaître : (1) contrairement à C#, Python et PHP, Java n'a <strong>pas de JSON dans sa bibliothèque standard</strong> — pour du JSON interopérable, on ajoute une bibliothèque (<strong>Jackson</strong> ou <strong>Gson</strong>), ce que tu verras avec les frameworks et l'API REST. (2) Le format de <code>ObjectOutputStream</code> est <strong>binaire</strong> : illisible et relisible seulement en Java. (3) Ne <strong>jamais désérialiser</strong> des données d'origine non fiable : c'est une faille de sécurité classique. Le <code>serialVersionUID</code> identifie la version du format pour détecter les incompatibilités.</div>

<h3>9. Le cycle complet d'une application</h3>
<pre class="pseudo">1. Démarrage : LIRE le fichier → remplir une ArrayList d'objets (disque → RAM)
2. Vie       : l'utilisateur manipule la liste (add, remove, tri…) — tout en RAM
3. Fin       : RÉÉCRIRE tout le fichier depuis la liste (RAM → disque)</pre>
<div class="tip">Ce cycle lecture → mémoire → réécriture est l'architecture de 90 % des petites applications. Ton projet de la leçon 20 l'utilisera.</div>`,

      "solution": "// Le carnet de la brocante : ecrire un fichier, puis le relire. Les deux\n// moitiés sont independantes - c'est le disque qui fait le lien.\nimport java.io.BufferedReader;\nimport java.io.FileReader;\nimport java.io.IOException;\nimport java.io.PrintWriter;\n\npublic class Brocante {\n    static final String FICHIER = \"brocante.csv\";\n\n    public static void main(String[] args) {\n        String[] lots = {\"Buffet en chêne;120;oui\", \"Lot de 40 disques;35;non\",\n                         \"Machine à coudre;60;oui\", \"Malle de voyage;45;non\",\n                         \"Service à thé;25;oui\"};\n\n        // try-with-resources : la ressource ouverte entre parentheses est\n        // refermee automatiquement a la sortie du bloc, meme si une\n        // exception survient. C'est le finally de la lecon 16, en mieux.\n        try (PrintWriter sortie = new PrintWriter(FICHIER)) {\n            for (String ligne : lots) {\n                sortie.println(ligne);\n            }\n        } catch (IOException e) {\n            System.out.println(\"Écriture impossible : \" + e.getMessage());\n            return;\n        }\n        System.out.println(lots.length + \" lots écrits dans \" + FICHIER);\n\n        int compte = 0;\n        int vendus = 0;\n        int recette = 0;\n        int total = 0;\n\n        try (BufferedReader entree = new BufferedReader(new FileReader(FICHIER))) {\n            String ligne = entree.readLine();\n            while (ligne != null) {\n                String[] champs = ligne.split(\";\");\n                String nom = champs[0];\n                int prix = Integer.parseInt(champs[1]);\n                boolean vendu = champs[2].equals(\"oui\");\n\n                compte = compte + 1;\n                total = total + prix;\n                if (vendu) {\n                    vendus = vendus + 1;\n                    recette = recette + prix;\n                }\n                System.out.println(\"  \" + nom + \" — \" + prix + \" € — \"\n                                   + (vendu ? \"vendu\" : \"invendu\"));\n                ligne = entree.readLine();   // la relecture fait avancer\n            }\n        } catch (IOException e) {\n            System.out.println(\"Lecture impossible : \" + e.getMessage());\n            return;\n        }\n\n        System.out.println();\n        System.out.println(\"Lots au catalogue : \" + compte);\n        System.out.println(\"Vendus : \" + vendus);\n        System.out.println(\"Valeur affichée : \" + total + \" €\");\n        System.out.println(\"Recette réelle : \" + recette + \" €\");\n    }\n}",

      "solution": "// Les passages aux remontees : un fichier ecrit, relu, et deux incidents\n// qui n'ont rien a voir l'un avec l'autre.\nimport java.io.BufferedReader;\nimport java.io.FileReader;\nimport java.io.FileWriter;\nimport java.io.IOException;\nimport java.io.PrintWriter;\n\npublic class Station {\n    static final String JOURNAL = \"passages.csv\";\n    static final String ABSENT = \"journal-inexistant.csv\";\n\n    public static void main(String[] args) {\n        String[] passages = {\"Nadia;Télésiège des Crêtes;9\",\n                             \"Yann;Téléski du Lac;9\",\n                             \"Nadia;Télésiège des Crêtes;10\",\n                             \"Bruno;Télécabine du Sommet;10\",\n                             \"Nadia;Téléski du Lac;11\",\n                             \"Yann;Télésiège des Crêtes;11\",\n                             \"Bruno;Télésiège des Crêtes;14\"};\n\n        // Mode AJOUT : le second argument true. Sans lui, chaque lancement\n        // effacerait la journee precedente - et l'on ne s'en apercevrait\n        // pas le premier jour, seulement le lendemain.\n        try (PrintWriter sortie = new PrintWriter(new FileWriter(JOURNAL, true))) {\n            for (String p : passages) {\n                sortie.println(p);\n            }\n        } catch (IOException e) {\n            System.out.println(\"Journal non alimenté : \" + e.getMessage());\n            return;\n        }\n\n        String[] remontees = {\"Télésiège des Crêtes\", \"Téléski du Lac\", \"Télécabine du Sommet\"};\n        int[] compteurs = new int[remontees.length];\n        int totalPassages = 0;\n        int premiereHeure = 99;\n        int derniereHeure = -1;\n        int lignesIllisibles = 0;\n\n        try (BufferedReader entree = new BufferedReader(new FileReader(JOURNAL))) {\n            String ligne = entree.readLine();\n            while (ligne != null) {\n                String[] champs = ligne.split(\";\");\n                if (champs.length fréquentée : \" + remontees[iPlusFrequentee]);\n\n        // Un fichier qui n'existe pas n'est pas une faute de programmation :\n        // c'est un cas prevu, qui a son propre message.\n        System.out.println();\n        System.out.println(\"Ouverture d'un journal absent :\");\n        try (BufferedReader e2 = new BufferedReader(new FileReader(ABSENT))) {\n            System.out.println(\"  \" + e2.readLine());\n        } catch (IOException e) {\n            System.out.println(\"  refus attendu — \" + e.getMessage());\n        }\n    }\n}",

      "solution": "// Le club de course a pied - jour 1 sur 4.\n// Le journal des sorties survit a la fin du programme : c'est tout ce que\n// le fichier apporte, et c'est enorme.\nimport java.io.BufferedReader;\nimport java.io.FileReader;\nimport java.io.FileWriter;\nimport java.io.IOException;\nimport java.io.PrintWriter;\n\npublic class ClubCourse {\n    static final String JOURNAL = \"sorties.csv\";\n\n    // Une sortie s'ajoute, elle ne remplace rien. Le mode ajout est le\n    // choix par defaut de tout journal ; le mode ecrasement doit etre\n    // l'exception, jamais l'inverse.\n    static void enregistrer(String coureur, String parcours, double km, int minutes) {\n        try (PrintWriter sortie = new PrintWriter(new FileWriter(JOURNAL, true))) {\n            sortie.println(coureur + \";\" + parcours + \";\" + km + \";\" + minutes);\n        } catch (IOException e) {\n            System.out.println(\"Sortie non enregistrée : \" + e.getMessage());\n        }\n    }\n\n    public static void main(String[] args) {\n        enregistrer(\"Salomé\", \"Boucle du canal\", 8.2, 44);\n        enregistrer(\"Rachid\", \"Côte du moulin\", 12.5, 71);\n        enregistrer(\"Salomé\", \"Bois de la Cambre\", 15.0, 82);\n        enregistrer(\"Inès\", \"Boucle du canal\", 8.2, 51);\n        enregistrer(\"Rachid\", \"Boucle du canal\", 8.2, 39);\n\n        int sorties = 0;\n        double kmTotal = 0.0;\n        int minutesTotal = 0;\n        double plusLongue = 0.0;\n        String coureurPlusLongue = \"aucun\";\n        double meilleureAllure = 999.0;\n        String coureurMeilleureAllure = \"aucun\";\n\n        try (BufferedReader entree = new BufferedReader(new FileReader(JOURNAL))) {\n            String ligne = entree.readLine();\n            while (ligne != null) {\n                String[] c = ligne.split(\";\");\n                String coureur = c[0];\n                double km = Double.parseDouble(c[2]);\n                int minutes = Integer.parseInt(c[3]);\n\n                sorties = sorties + 1;\n                kmTotal = kmTotal + km;\n                minutesTotal = minutesTotal + minutes;\n\n                if (km > plusLongue) {\n                    plusLongue = km;\n                    coureurPlusLongue = coureur;\n                }\n                // Allure = minutes par kilometre. Plus elle est PETITE,\n                // plus le coureur est rapide : encore une echelle inversee.\n                double allure = minutes / km;\n                if (allure < meilleureAllure) {\n                    meilleureAllure = allure;\n                    coureurMeilleureAllure = coureur;\n                }\n                ligne = entree.readLine();\n            }\n        } catch (IOException e) {\n            System.out.println(\"Journal illisible : \" + e.getMessage());\n            return;\n        }\n\n        System.out.println(\"=== Bilan du club ===\");\n        System.out.println(\"Sorties enregistrées : \" + sorties);\n        System.out.println(\"Distance cumulée : \" + Math.round(kmTotal * 10) / 10.0 + \" km\");\n        System.out.println(\"Temps cumulé : \" + (minutesTotal / 60) + \" h \" + (minutesTotal % 60) + \" min\");\n        System.out.println(\"Sortie la plus longue : \" + plusLongue + \" km (\" + coureurPlusLongue + \")\");\n        System.out.println(\"Meilleure allure : \" + Math.round(meilleureAllure * 100) / 100.0\n                           + \" min/km (\" + coureurMeilleureAllure + \")\");\n    }\n}",
