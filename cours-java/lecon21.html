  num: 21,
  title: "Lambdas et interfaces fonctionnelles",
  subtitle: "Passer un COMPORTEMENT comme on passe une valeur : la fonction devient un objet qu'on transporte.",
  theory: `
<h3>1. L'idée : transporter une action, pas seulement une donnée</h3>
<p>Jusqu'ici tu passais des <em>données</em> à tes méthodes (un nombre, un texte). Une <strong>lambda</strong> te permet de passer une <em>action</em> : « voici QUOI faire ». C'est comme donner à un employé de la <strong>ludothèque</strong> non pas un objet, mais une consigne écrite sur un post-it : « range par ordre alphabétique ». Le post-it (la consigne) se transporte, se range, s'exécute plus tard.</p>

<h3>2. Une interface fonctionnelle : le gabarit d'un post-it</h3>
<p>Une <strong>interface fonctionnelle</strong> est une interface qui ne déclare qu'UNE seule méthode abstraite. C'est le « gabarit » du post-it : elle dit quelle forme doit avoir la consigne (combien d'entrées, quelle sortie). On la marque souvent avec l'annotation <code>@FunctionalInterface</code>.</p>
<pre class="pseudo">@FunctionalInterface                 // annotation : garantit qu'il n'y a qu'UNE méthode abstraite
interface Salutation {               // le gabarit
    String direBonjour(String nom);  // UNE seule méthode : entrée String, sortie String
}</pre>

<h3>3. La lambda : remplir le post-it en une ligne</h3>
<p>Avant, pour fournir cette action, il fallait écrire une classe entière. La <strong>lambda</strong> (le mot vient des mathématiques) est une écriture ultra-courte : <code>paramètres -&gt; corps</code>. La flèche <code>-&gt;</code> se lit « donne » ou « produit ».</p>
<pre class="pseudo">Salutation s = nom -&gt; "Bonjour " + nom;   // nom (entrée) -> le texte à renvoyer (sortie)
System.out.println(s.direBonjour("Ana"));  // exécute la lambda : affiche « Bonjour Ana »</pre>
<div class="tip">Le compilateur sait que <code>nom</code> est un String parce que l'interface <code>Salutation</code> le dit. On n'écrit ni le type, ni <code>return</code>, ni accolades quand le corps tient en une expression : c'est l'<strong>inférence</strong> (Java devine).</div>

<h3>4. La syntaxe, cas par cas</h3>
<pre class="pseudo">()      -&gt; 42                 // zéro paramètre : parenthèses vides
x       -&gt; x * 2              // un paramètre : parenthèses facultatives
(x, y)  -&gt; x + y              // deux paramètres : parenthèses obligatoires
(x, y)  -&gt; {                  // corps sur plusieurs lignes : accolades + return explicite
              int somme = x + y; // instruction 1
              return somme;      // on doit écrire return
          }</pre>
<div class="warn">Corps court (une expression) : pas d'accolades, pas de <code>return</code>. Corps long (un bloc <code>{ }</code>) : <code>return</code> redevient OBLIGATOIRE. Ne mélange pas les deux styles.</div>

<h3>5. Les interfaces fonctionnelles toutes prêtes (java.util.function)</h3>
<p>Java fournit des gabarits standards, pour ne pas réinventer la roue à chaque fois :</p>
<pre class="pseudo">Predicate&lt;T&gt;      : T -&gt; boolean     // un TEST (« est-ce vrai ? »), méthode test(t)
Function&lt;T, R&gt;    : T -&gt; R           // une TRANSFORMATION T vers R, méthode apply(t)
Consumer&lt;T&gt;       : T -&gt; (rien)      // CONSOMME sans rien renvoyer, méthode accept(t)
Supplier&lt;T&gt;       : () -&gt; T          // FOURNIT une valeur sans entrée, méthode get()</pre>
<pre class="pseudo">Predicate&lt;String&gt; estLong = mot -&gt; mot.length() &gt; 5;  // teste si un mot fait plus de 5 lettres
System.out.println(estLong.test("Catan"));            // false : « Catan » fait 5 lettres
Function&lt;String, Integer&gt; taille = mot -&gt; mot.length();// transforme un mot en sa longueur
System.out.println(taille.apply("Uno"));              // 3</pre>

<h3>6. La référence de méthode : le raccourci du raccourci</h3>
<p>Quand la lambda ne fait qu'appeler une méthode existante, on peut la remplacer par une <strong>référence de méthode</strong>, notée <code>::</code>. C'est un synonyme encore plus court.</p>
<pre class="pseudo">Consumer&lt;String&gt; afficher = s -&gt; System.out.println(s);  // lambda qui affiche
Consumer&lt;String&gt; afficher2 = System.out::println;        // MÊME chose en référence de méthode
liste.forEach(System.out::println);                      // affiche chaque élément (forEach prend un Consumer)</pre>

<h3>7. Où ça sert vraiment ?</h3>
<p>Les lambdas rendent possibles les traitements de collections en une ligne : trier avec un <code>Comparator</code>, filtrer avec un <code>Predicate</code>, ou toute l'API <code>Stream</code> (leçon suivante). On passe le « quoi faire » à la méthode, qui s'occupe du « comment ». C'est la <strong>programmation fonctionnelle</strong> : traiter le code comme une donnée.</p>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'une lambda transporte, contrairement à une variable classique ?", opts: ["Une donnée", "Un COMPORTEMENT (une action à exécuter)", "Une simple valeur numérique", "Une classe entière"], a: 1, exp: "La lambda est une action qu'on passe et exécute plus tard." },
    { type: "qcm", q: "Une interface fonctionnelle possède…", opts: ["Aucune méthode", "Exactement UNE méthode abstraite", "Au moins deux méthodes", "Uniquement des méthodes statiques"], a: 1, exp: "Une seule méthode abstraite : c'est ce qui la rend « lambdifiable »." },

    { type: "qcm", q: "Que fait <code>System.out::println</code> ?", opts: ["Une erreur de syntaxe", "Une référence de méthode équivalente à <code>s -&gt; System.out.println(s)</code>", "L'accès à une variable statique", "Un appel immédiat de println"], a: 1, exp: "L'opérateur :: référence une méthode existante." },
    { type: "vf", q: "Une référence de méthode <code>::</code> est un raccourci d'une lambda qui ne fait qu'appeler une méthode.", a: true, exp: "Quand la lambda délègue tout à une méthode, :: est plus concis." },
    { type: "qcm", q: "Pourquoi le compilateur connaît-il le type du paramètre d'une lambda sans qu'on l'écrive ?", opts: ["En analysant la valeur passée à l'exécution", "Par inférence, grâce à l'interface fonctionnelle ciblée", "On doit toujours l'écrire", "Parce qu'un paramètre lambda est toujours un Object"], a: 1, exp: "Le gabarit (l'interface) fixe les types : Java les déduit." },
    { type: "qcm", q: "À quoi sert l'annotation <code>@FunctionalInterface</code> ?", opts: ["À rendre le code plus rapide", "À vérifier qu'il n'y a bien qu'UNE méthode abstraite (sinon erreur)", "À créer une lambda", "À importer function"], a: 1, exp: "C'est un garde-fou : le compilateur refuse une 2e méthode abstraite." },
    { type: "vf", q: "<code>liste.forEach(System.out::println)</code> affiche chaque élément de la liste.", a: true, exp: "forEach applique le Consumer à chaque élément." }
  ],

<pre class="pseudo">import java.util.function.Predicate;                 // le gabarit « test »

ArrayList&lt;String&gt; jeux = new ArrayList&lt;&gt;();          // la liste
jeux.add("Uno"); jeux.add("Catan"); jeux.add("Go");  // 3 jeux

    ],
    solution: `<pre class="pseudo">Predicate&lt;String&gt; nomLong = nom -&gt; nom.length() &gt; 4; // critère transporté comme une valeur
// test("Uno")   -> 3 > 4  -> false  (rejeté)
// test("Catan") -> 5 > 4  -> true   (affiché)
// test("Go")    -> 2 > 4  -> false  (rejeté)
// Sortie : Catan</pre>
<p>Le critère est devenu un objet qu'on nomme, réutilise et combine. La leçon suivante enchaîne ces lambdas dans des pipelines : l'API Stream.</p>`

      "solution": "// La cordonnerie : une interface fonctionnelle maison, puis les toutes\n// faites. Le point commun : on transporte une ACTION.\nimport java.util.ArrayList;\nimport java.util.function.Consumer;\nimport java.util.function.Function;\nimport java.util.function.Predicate;\n\npublic class Cordonnerie {\n\n    // Une interface fonctionnelle : UNE seule methode abstraite. Elle\n    // decrit la forme du post-it, pas ce qui sera ecrit dessus.\n    @FunctionalInterface\n    interface Tarif {\n        double montant(int paires);\n    }\n\n    static void devis(String intitule, int paires, Tarif regle) {\n        double du = Math.round(regle.montant(paires) * 100) / 100.0;\n        System.out.println(\"  \" + intitule + \" pour \" + paires + \" paire(s) : \" + du + \" €\");\n    }\n\n    public static void main(String[] args) {\n        System.out.println(\"Devis du jour :\");\n        // Trois regles de tarification, ecrites la ou on les emploie.\n        devis(\"Ressemelage\", 3, p -> p * 28.0);\n        devis(\"Talons\", 3, p -> p * 12.5);\n        // Une regle qui n'est pas proportionnelle : forfait puis degressif.\n        devis(\"Cirage complet\", 3, p -> 9.0 + (p - 1) * 4.0);\n\n        ArrayList<String> reparations = new ArrayList<>();\n        reparations.add(\"bottine cuir\");\n        reparations.add(\"basket toile\");\n        reparations.add(\"mocassin cuir\");\n        reparations.add(\"sandale cuir\");\n        reparations.add(\"botte caoutchouc\");\n\n        // Predicate : une question qui rend vrai ou faux.\n        Predicate<String> enCuir = article -> article.endsWith(\"cuir\");\n        Predicate<String> courte = article -> article.length() <= 13;\n\n        System.out.println();\n        System.out.println(\"Articles en cuir : \" + compter(reparations, enCuir));\n        System.out.println(\"Intitulés courts : \" + compter(reparations, courte));\n        // Les predicats se combinent, ce qui evite d'en ecrire un quatrieme.\n        System.out.println(\"Les deux à la fois : \" + compter(reparations, enCuir.and(courte)));\n        System.out.println(\"Ni l'un ni l'autre : \"\n                           + compter(reparations, enCuir.or(courte).negate()));\n\n        // Function : une transformation. Consumer : une action sans retour.\n        Function<String, String> bonDeTravail = article -> \"BT-\" + article.toUpperCase();\n        Consumer<String> afficher = ligne -> System.out.println(\"  \" + ligne);\n\n        System.out.println();\n        System.out.println(\"Bons de travail :\");\n        for (String r : reparations) {\n            afficher.accept(bonDeTravail.apply(r));\n        }\n    }\n\n    static int compter(ArrayList<String> liste, Predicate<String> critere) {\n        int n = 0;\n        for (String element : liste) {\n            if (critere.test(element)) {\n                n = n + 1;\n            }\n        }\n        return n;\n    }\n}",

      "solution": "// La station d'epuration : le meme controle applique a des seuils\n// differents, sans jamais reecrire la boucle.\nimport java.util.ArrayList;\nimport java.util.function.Consumer;\nimport java.util.function.Function;\nimport java.util.function.Predicate;\nimport java.util.function.Supplier;\n\npublic class Epuration {\n\n    static ArrayList<Double> filtrer(ArrayList<Double> mesures, Predicate<Double> critere) {\n        ArrayList<Double> retenues = new ArrayList<>();\n        for (double m : mesures) {\n            if (critere.test(m)) {\n                retenues.add(m);\n            }\n        }\n        return retenues;\n    }\n\n    static void pourChaque(ArrayList<Double> mesures, Consumer<Double> action) {\n        for (double m : mesures) {\n            action.accept(m);\n        }\n    }\n\n    public static void main(String[] args) {\n        ArrayList<Double> oxygene = new ArrayList<>();\n        double[] releves = {6.4, 4.1, 7.8, 3.2, 5.9, 8.3, 2.7, 6.0};\n        for (double r : releves) {\n            oxygene.add(r);\n        }\n\n        // Le seuil est une DONNEE ; la lambda le capture. On fabrique donc\n        // un critere different pour chaque seuil, sans dupliquer de code.\n        Function<Double, Predicate<Double>> sousLeSeuil = seuil -> valeur -> valeur < seuil;\n\n        System.out.println(\"Relevés d'oxygène dissous : \" + oxygene.size());\n        System.out.println(\"Sous 5 mg/L : \" + filtrer(oxygene, sousLeSeuil.apply(5.0)));\n        System.out.println(\"Sous 4 mg/L : \" + filtrer(oxygene, sousLeSeuil.apply(4.0)));\n        System.out.println(\"Sous 3 mg/L : \" + filtrer(oxygene, sousLeSeuil.apply(3.0)));\n\n        // Un critere nomme se relit mieux qu'une condition anonyme.\n        Predicate<Double> conforme = v -> v >= 5.0;\n        System.out.println();\n        System.out.println(\"Conformes : \" + filtrer(oxygene, conforme).size()\n                           + \" / \" + oxygene.size());\n        System.out.println(\"Non conformes : \" + filtrer(oxygene, conforme.negate()));\n\n        // Supplier : une valeur qu'on fabrique a la demande, et pas avant.\n        Supplier<String> entete = () -> \"--- Alerte station ---\";\n        ArrayList<Double> alertes = filtrer(oxygene, sousLeSeuil.apply(3.5));\n        if (!alertes.isEmpty()) {\n            System.out.println();\n            System.out.println(entete.get());\n            pourChaque(alertes, v -> System.out.println(\"  bassin sous-oxygéné : \" + v + \" mg/L\"));\n        }\n\n        // Reference de methode : la lambda ne fait qu'appeler une methode\n        // existante, on peut donc la designer directement.\n        System.out.println();\n        System.out.println(\"Tous les relevés :\");\n        pourChaque(oxygene, System.out::println);\n    }\n}",

      "solution": "// La mediatheque - jour 1 sur 4.\n// Le catalogue ne change pas ; ce qui change, ce sont les questions\n// qu'on lui pose. On passe donc la QUESTION en parametre.\nimport java.util.ArrayList;\nimport java.util.function.Consumer;\nimport java.util.function.Predicate;\n\npublic class Mediatheque {\n\n    static ArrayList<Media> filtrer(ArrayList<Media> fonds, Predicate<Media> critere) {\n        ArrayList<Media> retenus = new ArrayList<>();\n        for (Media m : fonds) {\n            if (critere.test(m)) {\n                retenus.add(m);\n            }\n        }\n        return retenus;\n    }\n\n    static void presenter(String titre, ArrayList<Media> lot, Consumer<Media> mise) {\n        System.out.println(titre + \" (\" + lot.size() + \")\");\n        for (Media m : lot) {\n            mise.accept(m);\n        }\n    }\n\n    public static void main(String[] args) {\n        ArrayList<Media> fonds = new ArrayList<>();\n        fonds.add(new Media(\"Le Guépard\", \"film\", 1963, 205, true));\n        fonds.add(new Media(\"Kind of Blue\", \"disque\", 1959, 45, true));\n        fonds.add(new Media(\"Les Misérables\", \"livre\", 1862, 0, false));\n        fonds.add(new Media(\"Blade Runner\", \"film\", 1982, 117, false));\n        fonds.add(new Media(\"Le Sacre du printemps\", \"disque\", 1913, 33, true));\n        fonds.add(new Media(\"La Nuit des temps\", \"livre\", 1968, 0, true));\n        fonds.add(new Media(\"La Jetée\", \"film\", 1962, 28, true));\n\n        Predicate<Media> disponible = m -> m.estDisponible();\n        Predicate<Media> film = m -> m.getSupport().equals(\"film\");\n        Predicate<Media> avant1970 = m -> m.getAnnee() < 1970;\n        Predicate<Media> court = m -> m.getDureeMinutes() > 0 && m.getDureeMinutes() <= 60;\n\n        Consumer<Media> ligneSimple = m -> System.out.println(\"  \" + m.fiche());\n\n        presenter(\"Disponibles\", filtrer(fonds, disponible), ligneSimple);\n        System.out.println();\n        presenter(\"Films disponibles\", filtrer(fonds, film.and(disponible)), ligneSimple);\n        System.out.println();\n        presenter(\"Antérieurs à 1970 et indisponibles\",\n                  filtrer(fonds, avant1970.and(disponible.negate())), ligneSimple);\n        System.out.println();\n        presenter(\"Formats courts\", filtrer(fonds, court), ligneSimple);\n\n        System.out.println();\n        System.out.println(\"Fonds total : \" + fonds.size());\n        System.out.println(\"Sortis : \" + filtrer(fonds, disponible.negate()).size());\n    }\n}\n\nclass Media {\n    private String titre;\n    private String support;\n    private int annee;\n    private int dureeMinutes;   // 0 pour un livre\n    private boolean disponible;\n\n    Media(String titre, String support, int annee, int dureeMinutes, boolean disponible) {\n        this.titre = titre;\n        this.support = support;\n        this.annee = annee;\n        this.dureeMinutes = dureeMinutes;\n        this.disponible = disponible;\n    }\n\n    String getTitre() {\n        return titre;\n    }\n\n    String getSupport() {\n        return support;\n    }\n\n    int getAnnee() {\n        return annee;\n    }\n\n    int getDureeMinutes() {\n        return dureeMinutes;\n    }\n\n    boolean estDisponible() {\n        return disponible;\n    }\n\n    String fiche() {\n        String duree;\n        if (dureeMinutes == 0) {\n            duree = \"—\";\n        } else {\n            duree = dureeMinutes + \" min\";\n        }\n        return titre + \" (\" + support + \", \" + annee + \", \" + duree + \")\";\n    }\n}",
