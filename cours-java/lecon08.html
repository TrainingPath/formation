  title: "Les méthodes",
  subtitle: "Les fonctions et procédures des jours 20-21, appelées méthodes en Java.",
  theory: `
<h3>1. Fonction → méthode</h3>
<p>Une <strong>méthode</strong> est un petit programme réutilisable, une machine à qui l'on donne un nom : on lui fournit des ingrédients (les <strong>paramètres</strong>), elle fait son travail, et elle peut rendre un résultat (la <strong>valeur de retour</strong>) — comme une recette que tu peux relancer autant de fois que tu veux. En Java, les sous-programmes s'appellent des méthodes. Pour l'instant, on les déclare <code>static</code> (dans la même classe que <code>main</code>).</p>
<pre class="pseudo">PSEUDOCODE                          JAVA
FONCTION carre(x : ENTIER) : ENTIER  public static int carre(int x) {   // « int » = type de RETOUR ; (int x) = un paramètre entier
    RETOURNER x * x                      return x * x;                   // return RENVOIE le résultat à l'appelant
FIN                                  }                                   // fin de la méthode</pre>
<ul>
<li><code>int</code> avant le nom = le <strong>type de retour</strong> (le genre de résultat rendu).</li>
<li><code>return</code> = RETOURNER : renvoie une valeur ET quitte immédiatement la méthode.</li>
<li>Chaque paramètre a son type : <code>(int a, int b)</code>.</li>
</ul>

<h3>2. Procédure → void</h3>
<p>Une méthode qui ne renvoie rien a le type de retour <code>void</code> (« vide ») : elle <em>agit</em> (afficher, modifier…) mais ne produit pas de valeur à récupérer.</p>
<pre class="pseudo">public static void afficherLigne(int n) {              // void = aucune valeur de retour
    for (int i = 0; i &lt; n; i++) { System.out.print("-"); }  // affiche n tirets sur la même ligne
    System.out.println();                             // passe à la ligne
}</pre>

<h3>3. Structure complète : définir puis appeler</h3>
<pre class="pseudo">public class Outils {
    public static void main(String[] args) {
        int r = carre(4);                   // APPEL : on passe 4, la méthode renvoie 16, rangé dans r
        System.out.println(max2(r, 20));    // appelle max2 avec 16 et 20 → affiche 20
        afficherLigne(10);                  // appel d'une méthode void → affiche ----------
    }
    public static int carre(int x) { return x * x; }   // définition de carre
    public static int max2(int a, int b) {
        if (a &gt; b) { return a; } else { return b; }   // renvoie le plus grand des deux
    }
    public static void afficherLigne(int n) { /* ... */ }   // définition de afficherLigne
}</pre>
<p><strong>Définir</strong> une méthode ne l'exécute pas : il faut l'<strong>appeler</strong> par son nom en fournissant les arguments. Les méthodes peuvent s'appeler entre elles dans la même classe.</p>

<h3>4. Passage par valeur</h3>
<pre class="pseudo">public static void doubler(int n) { n = n * 2; }   // n est une COPIE : la modifier n'affecte que la copie
int x = 5;
doubler(x);                                        // on passe une copie de x (5)
System.out.println(x);        // affiche 5 : l'original est intact → il fallait « x = doubler(x) » avec un return</pre>
<p>Un type simple (int, double…) est <strong>copié</strong> à l'appel : la méthode reçoit un double du carton, pas l'original, donc elle ne peut pas modifier la variable de départ. Nuance importante : passer un <strong>tableau</strong> transmet sa référence — la méthode PEUT alors modifier les cases du tableau original.</p>

<h3>5. Tous les chemins doivent retourner</h3>
<pre class="pseudo">public static int signe(int n) {
    if (n &gt; 0) { return 1; }              // renvoie 1 seulement si n > 0…
    // ERREUR de compilation : « missing return statement »
    // …mais si n &lt;= 0, aucune valeur n'est renvoyée : Java refuse de compiler
}</pre>
<div class="tip">Java VÉRIFIE à la compilation que TOUS les cas renvoient bien une valeur. Ce type de bug (oublier un cas) est donc impossible à livrer : il faut couvrir tous les chemins. Merci le typage fort.</div>

<h3>6. La surcharge (overloading)</h3>
<p>Deux méthodes peuvent porter le MÊME nom si leurs paramètres diffèrent : <code>max2(int, int)</code> et <code>max2(double, double)</code> coexistent. Java choisit automatiquement la bonne version selon le type des arguments fournis. Cela évite d'inventer des noms différents (<code>max2Int</code>, <code>max2Double</code>…) pour la même idée.</p>`,

    { type: "qcm", q: "Comment s'utilise ensuite estPair dans un if ?", opts: ["if (estPair(n) == true)", "if (estPair(n)) { … } — le boolean se consomme tel quel", "if estPair(n)", "if (estPair == n)"], a: 1, exp: "Lisible comme une phrase : « si n est pair »." },
    { type: "qcm", q: "La surcharge (overloading) permet…", opts: ["De rendre une méthode plus rapide", "Deux méthodes de MÊME nom avec des paramètres différents", "D'appeler une méthode deux fois", "De cacher une méthode"], a: 1, exp: "Java choisit la version selon les types des arguments." },
    { type: "qcm", q: "« Afficher un menu de 5 lignes » : quelle signature ?", opts: ["public static int afficherMenu()", "public static void afficherMenu() — une action sans résultat : void", "public static String menu", "return menu;"], a: 1, exp: "Le critère du jour 20 : besoin du résultat ? Non → void." },
    { type: "input", q: "<code>public static int mystere(int a, int b) { return a * 10 + b; }</code> Que vaut mystere(mystere(1, 2), 3) ?", a: "123", ph: "nombre", exp: "12 puis 123 : les arguments s'évaluent d'abord (jour 21)." },
    { type: "qcm", q: "Où peut-on appeler une méthode static déclarée dans la même classe ?", opts: ["Seulement dans main", "Depuis main ET depuis les autres méthodes de la classe", "Nulle part", "Seulement une fois"], a: 1, exp: "Les méthodes s'appellent entre elles : max3 peut appeler max2 (jour 20)." },
    { type: "qcm", q: "Une variable déclarée DANS une méthode est…", opts: ["Visible partout", "Locale : invisible depuis main et les autres méthodes", "Toujours static", "Une constante"], a: 1, exp: "La « bulle » du jour 21 : chaque méthode a ses variables locales." },
    { type: "qcm", q: "<code>public static double moyenne(int[] t)</code> — pourquoi retourner double et pas int ?", opts: ["Convention", "Une moyenne a presque toujours des décimales : (double) somme / t.length", "int est interdit", "Pour la surcharge"], a: 1, exp: "Et à l'intérieur : le cast anti-division-entière de la leçon 3 !" }
  ],
  final: {
    title: "Exercice final — La boîte à outils (version Java)",
    intro: `<p>Le final du jour 20, traduit et enrichi. Tu écris ta bibliothèque :</p>
<pre class="pseudo">public class Boite {
    public static void main(String[] args) {
        int[] notes = {12, 8, 15};                    // un petit tableau de notes
        System.out.println(carre(3));                 // (1) appelle carre(3)
        System.out.println(max2(carre(3), 8));        // (2) carre(3)=9 puis max2(9, 8)
        System.out.println(moyenne(notes));           // (3) moyenne du tableau
        afficherLigne(5);                             // (4) méthode void : affiche une ligne
    }
    public static int carre(int x) { return x * x; }  // renvoie x au carré
    public static int max2(int a, int b) { return (a > b) ? a : b; } // renvoie le plus grand (opérateur ternaire)
    public static double moyenne(int[] t) {           // renvoie la moyenne (réelle) du tableau
        int s = 0;                                    // accumulateur de la somme
        for (int i = 0; i < t.length; i++) { s += t[i]; } // additionne chaque case
        return (double) s / t.length;                 // cast → division réelle
    }
    public static void afficherLigne(int n) {         // void : n'affiche rien à retourner
        for (int i = 0; i < n; i++) { System.out.print("*"); } // n étoiles sur la même ligne
        System.out.println();                         // retour à la ligne
    }
}</pre>`,

    ],

<p>Chaque méthode fait UNE chose, se teste seule, s'assemble : la philosophie du jour 22, désormais dans un vrai langage. À partir de maintenant, chaque leçon enrichira cette boîte à outils.</p>`

      "Dans main : for (int i = 2; i <= 50; i++) { if (estPremier(i)) System.out.print(i + \" \"); }"

    solution: "public class Premiers {                          // déclaration de la classe\n    static boolean estPremier(int n) {           // méthode : reçoit un int, renvoie un boolean\n        if (n < 2) return false;                 // 0 et 1 ne sont pas premiers → sortie immédiate\n        for (int d = 2; d < n; d++) {            // teste chaque diviseur possible de 2 à n-1\n            if (n % d == 0) return false;        // reste nul → d divise n → pas premier, on sort\n        }                                        // fin de la boucle des diviseurs\n        return true;                             // aucun diviseur trouvé → n est premier\n    }                                            // fin de la méthode\n\n    public static void main(String[] args) {    // point d'entrée du programme\n        for (int i = 2; i <= 50; i++) {          // essaie chaque candidat de 2 à 50\n            if (estPremier(i)) {                 // appel de la méthode : true ou false\n                System.out.print(i + \" \");       // print (sans ln) : tout sur la même ligne\n            }                                    // fin du filtre\n        }                                        // fin du parcours\n        System.out.println();                    // retour à la ligne final\n    }                                            // fin de main\n}                                                // fin de la classe",
