  num: 22,
  title: "L'API Stream",
  subtitle: "Une chaîne de montage pour tes collections : filtrer, transformer, compter, en une seule phrase fluide.",
  theory: `
<h3>1. L'image : une chaîne de montage</h3>
<p>Imagine les jeux de ta <strong>ludothèque</strong> qui défilent sur un tapis roulant. À chaque poste, un ouvrier fait UNE chose : l'un écarte les jeux abîmés, l'autre note le prix sur une étiquette, un dernier compte ce qui reste. Un <strong>Stream</strong> (« flux ») est ce tapis roulant : une suite d'éléments qu'on fait passer par une série d'étapes.</p>
<pre class="pseudo">import java.util.stream.Collectors;         // pour rassembler le résultat à la fin

liste.stream()                             // (source) démarre le tapis à partir de la liste
     .filter(j -&gt; j.length() &gt; 3)          // (étape) ne garde que les jeux de + de 3 lettres
     .map(j -&gt; j.toUpperCase())            // (étape) transforme chaque jeu en MAJUSCULES
     .forEach(System.out::println);        // (fin) affiche chaque élément restant</pre>

<h3>2. Trois familles d'opérations</h3>
<p>La <strong>source</strong> crée le flux (<code>liste.stream()</code>). Les <strong>opérations intermédiaires</strong> transforment le flux et en renvoient un nouveau : on peut donc les enchaîner. L'<strong>opération terminale</strong> déclenche tout et produit un résultat (un nombre, une liste, un affichage). Sans opération terminale, RIEN ne s'exécute.</p>
<div class="tip">Un Stream est <strong>paresseux</strong> (lazy) : tant qu'on n'a pas branché une opération terminale, le tapis ne tourne pas. C'est comme une chaîne de montage à l'arrêt tant que personne n'appuie sur « démarrer ».</div>

<h3>3. filter : le videur à l'entrée</h3>
<p><code>filter</code> prend un <strong>Predicate</strong> (un test, leçon 21) et ne laisse passer que les éléments qui répondent « true ». Les autres tombent du tapis.</p>
<pre class="pseudo">liste.stream()                    // source
     .filter(j -&gt; j.startsWith("C")) // ne garde que les jeux commençant par C
     .count();                    // opération terminale : combien en reste-t-il ? (renvoie un long)</pre>

<h3>4. map : transformer chaque élément</h3>
<p><code>map</code> prend une <strong>Function</strong> et remplace chaque élément par le résultat. Le nombre d'éléments ne change pas, seule leur forme change.</p>
<pre class="pseudo">liste.stream()                    // source : des noms de jeux
     .map(j -&gt; j.length())        // remplace chaque nom par sa LONGUEUR (un Integer)
     .forEach(System.out::println); // affiche des nombres, pas des noms</pre>
<div class="warn">Ne confonds pas : <code>filter</code> ENLÈVE des éléments (le nombre baisse) ; <code>map</code> TRANSFORME sans en enlever (le nombre reste). Deux ouvriers, deux rôles.</div>

<h3>5. Récupérer le résultat : collect et Collectors.toList</h3>
<p>Souvent, on veut le résultat sous forme de nouvelle liste. L'opération terminale <code>collect(Collectors.toList())</code> rassemble les éléments survivants dans une <code>List</code>.</p>
<pre class="pseudo">List&lt;String&gt; courts = liste.stream()         // source
    .filter(j -&gt; j.length() &lt;= 3)            // garde les noms courts
    .collect(Collectors.toList());          // rassemble le résultat dans une nouvelle liste</pre>

<h3>6. Les terminales de calcul : count, anyMatch, sum, average</h3>
<pre class="pseudo">stream.count()                 // combien d'éléments ? (long)
stream.anyMatch(p)             // AU MOINS un élément passe le test p ? (boolean)
stream.allMatch(p)             // TOUS passent le test ? (boolean)
stream.mapToInt(x -&gt; x).sum()  // convertit en flux d'int puis additionne
stream.mapToInt(x -&gt; x).average() // moyenne (renvoie un OptionalDouble)</pre>

<h3>7. La règle d'or : l'original n'est jamais modifié</h3>
<p>Un Stream ne touche JAMAIS la collection d'origine : il produit un nouveau résultat. C'est comme photographier les jeux qui défilent sans déplacer les jeux eux-mêmes. Tu peux donc enchaîner des streams sans crainte d'abîmer tes données.</p>
<pre class="pseudo">long nb = jeux.stream()                       // on lit jeux...
    .filter(j -&gt; j.contains("a"))             // ...on filtre...
    .count();                                // ...on compte
// jeux reste EXACTEMENT la même liste qu'avant : le stream n'a rien modifié</pre>`,
  exercises: [

    { type: "qcm", q: "L'ordre logique d'un pipeline typique est…", opts: ["terminale, intermédiaire, source", "source (stream) -> intermédiaires (filter/map) -> terminale (collect/count)", "map avant stream", "count avant filter toujours"], a: 1, exp: "Source, puis transformations, puis résultat." },
    { type: "vf", q: "On peut enchaîner plusieurs <code>filter</code> et <code>map</code> dans un même pipeline.", a: true, exp: "Chaque intermédiaire renvoie un stream : on chaîne autant qu'on veut." }
  ],

<pre class="pseudo">import java.util.stream.Collectors;                  // pour collect

      { type: "qcm", q: "Si on remplaçait <code>collect(...)</code> par <code>count()</code>, on obtiendrait :", opts: ["[CATAN, MONOPOLY]", "2 (le nombre de survivants)", "4", "true"], a: 1, exp: "count() renvoie le nombre d'éléments restants : 2." }
    ],
    solution: `<pre class="pseudo">jeux.stream()                        // source : Uno, Catan, Risk, Monopoly
    .filter(j -&gt; j.length() &gt;= 5)    // reste : Catan, Monopoly
    .map(j -&gt; j.toUpperCase())       // devient : CATAN, MONOPOLY
    .collect(Collectors.toList());  // -> [CATAN, MONOPOLY]
// retenus = [CATAN, MONOPOLY]
// jeux.size() = 4  (la liste d'origine est intacte)</pre>
<p>Filtrer, transformer, rassembler : une phrase fluide remplace des boucles entières, sans jamais abîmer les données. Prochaine leçon : Optional, pour gérer proprement l'absence de valeur.</p>`

      "solution": "// La torrefaction : la meme question posee en une phrase au lieu d'une\n// boucle. L'original n'est jamais modifie.\nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.stream.Collectors;\n\npublic class Torrefaction {\n    public static void main(String[] args) {\n        ArrayList<String> cafes = new ArrayList<>();\n        cafes.add(\"Éthiopie Sidamo\");\n        cafes.add(\"Colombie Huila\");\n        cafes.add(\"Brésil Cerrado\");\n        cafes.add(\"Kenya AA\");\n        cafes.add(\"Guatemala Antigua\");\n        cafes.add(\"Éthiopie Yirgacheffe\");\n\n        int[] sacsKg = {60, 120, 250, 45, 90, 60};\n\n        // filter puis collect : on choisit, puis on ramasse. Rien n'est\n        // fait tant que la terminale n'est pas appelee.\n        List<String> ethiopiens = cafes.stream()\n                .filter(nom -> nom.startsWith(\"Éthiopie\"))\n                .collect(Collectors.toList());\n        System.out.println(\"Origines d'Éthiopie : \" + ethiopiens);\n\n        // map : transformer chaque element sans toucher a la source.\n        List<String> etiquettes = cafes.stream()\n                .map(nom -> nom.toUpperCase())\n                .collect(Collectors.toList());\n        System.out.println(\"Étiquettes : \" + etiquettes.get(0) + \" … \" + etiquettes.get(5));\n        System.out.println(\"La source est intacte : \" + cafes.get(0));\n\n        // count : une terminale qui rend un nombre, pas une liste.\n        long courts = cafes.stream()\n                .filter(nom -> nom.length() <= 14)\n                .count();\n        System.out.println(\"Noms de 14 caractères ou moins : \" + courts);\n\n        // Les nombres passent par un flux specialise, qui seul sait\n        // additionner et faire une moyenne.\n        int totalSacs = 0;\n        for (int kg : sacsKg) {\n            totalSacs = totalSacs + kg;\n        }\n        List<Integer> lots = new ArrayList<>();\n        for (int kg : sacsKg) {\n            lots.add(kg);\n        }\n        int somme = lots.stream().mapToInt(kg -> kg).sum();\n        // On divise soi-meme plutot que d'appeler average() : cette\n        // terminale rend un resultat « peut-etre vide », notion de la\n        // lecon 23. Un flux vide n'a pas de moyenne, et il faut le dire.\n        double moyenne = (double) somme / lots.size();\n\n        System.out.println();\n        System.out.println(\"Sacs en stock : \" + somme + \" kg (contrôle boucle : \" + totalSacs + \")\");\n        System.out.println(\"Lot moyen : \" + Math.round(moyenne * 10) / 10.0 + \" kg\");\n        System.out.println(\"Un lot dépasse-t-il 200 kg ? \" + lots.stream().anyMatch(kg -> kg > 200));\n        System.out.println(\"Tous les lots atteignent-ils 40 kg ? \" + lots.stream().allMatch(kg -> kg >= 40));\n\n        // Une chaine complete : choisir, transformer, ramasser.\n        List<String> grosLots = cafes.stream()\n                .filter(nom -> nom.length() > 15)\n                .map(nom -> nom.split(\" \")[0])\n                .collect(Collectors.toList());\n        System.out.println(\"Pays des origines au nom long : \" + grosLots);\n    }\n}",

      "solution": "// L'atelier de reliure : la meme question posee deux fois, une fois a la\n// boucle et une fois au flux, pour comparer ce qu'on lit.\nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.stream.Collectors;\n\npublic class Reliure {\n    public static void main(String[] args) {\n        ArrayList<Ouvrage> atelier = new ArrayList<>();\n        atelier.add(new Ouvrage(\"Atlas des cieux\", 1890, 320, \"cuir\", 240.0));\n        atelier.add(new Ouvrage(\"Herbier du Condroz\", 1932, 180, \"toile\", 95.0));\n        atelier.add(new Ouvrage(\"Almanach du port\", 1908, 96, \"papier\", 40.0));\n        atelier.add(new Ouvrage(\"Traité des marées\", 1874, 540, \"cuir\", 410.0));\n        atelier.add(new Ouvrage(\"Cahiers de la fonderie\", 1951, 210, \"toile\", 120.0));\n        atelier.add(new Ouvrage(\"Registre des halles\", 1899, 760, \"cuir\", 520.0));\n\n        // LA MEME QUESTION, DEUX FOIS. Combien d'ouvrages en cuir\n        // anterieurs a 1900, et quel est leur devis total ?\n        int compteBoucle = 0;\n        double totalBoucle = 0.0;\n        for (Ouvrage o : atelier) {\n            if (o.getReliure().equals(\"cuir\") && o.getAnnee() < 1900) {\n                compteBoucle = compteBoucle + 1;\n                totalBoucle = totalBoucle + o.getDevis();\n            }\n        }\n\n        long compteFlux = atelier.stream()\n                .filter(o -> o.getReliure().equals(\"cuir\"))\n                .filter(o -> o.getAnnee() < 1900)\n                .count();\n        double totalFlux = atelier.stream()\n                .filter(o -> o.getReliure().equals(\"cuir\"))\n                .filter(o -> o.getAnnee() < 1900)\n                .mapToDouble(o -> o.getDevis())\n                .sum();\n\n        System.out.println(\"Cuir avant 1900 — boucle : \" + compteBoucle + \" pour \" + totalBoucle + \" €\");\n        System.out.println(\"Cuir avant 1900 — flux   : \" + compteFlux + \" pour \" + totalFlux + \" €\");\n\n        // Les liure;\n    }\n\n    double getDevis() {\n        return devis;\n    }\n}",

      "solution": "// La mediatheque - jour 2 sur 4.\n// Les criteres nommes d'hier sont reutilises TELS QUELS : c'est le signe\n// qu'ils etaient au bon niveau. Seule la mecanique change.\nimport java.util.ArrayList;\nimport java.util.HashSet;\nimport java.util.List;\nimport java.util.function.Predicate;\nimport java.util.stream.Collectors;\n\npublic class Mediatheque {\n    public static void main(String[] args) {\n        ArrayList<Media> fonds = new ArrayList<>();\n        fonds.add(new Media(\"Le Guépard\", \"film\", 1963, 205, true));\n        fonds.add(new Media(\"Kind of Blue\", \"disque\", 1959, 45, true));\n        fonds.add(new Media(\"Les Misérables\", \"livre\", 1862, 0, false));\n        fonds.add(new Media(\"Blade Runner\", \"film\", 1982, 117, false));\n        fonds.add(new Media(\"Le Sacre du printemps\", \"disque\", 1913, 33, true));\n        fonds.add(new Media(\"La Nuit des temps\", \"livre\", 1968, 0, true));\n        fonds.add(new Media(\"La Jetée\", \"film\", 1962, 28, true));\n\n        // Les memes criteres qu'hier, mot pour mot.\n        Predicate<Media> disponible = m -> m.estDisponible();\n        Predicate<Media> film = m -> m.getSupport().equals(\"film\");\n        Predicate<Media> avant1970 = m -> m.getAnnee() < 1970;\n        Predicate<Media> court = m -> m.getDureeMinutes() > 0 && m.getDureeMinutes() <= 60;\n\n        List<String> titresDisponibles = fonds.stream()\n                .filter(disponible)\n                .map(m -> m.getTitre())\n                .collect(Collectors.toList());\n        System.out.println(\"Disponibles (\" + titresDisponibles.size() + \") : \" + titresDisponibles);\n\n        List<String> filmsDispo = fonds.stream()\n                .filter(film.and(disponible))\n                .map(m -> m.getTitre())\n                .collect(Collectors.toList());\n        System.out.println(\"Films disponibles : \" + filmsDispo);\n\n        List<String> anciensSortis = fonds.stream()\n                .filter(avant1970.and(disponible.negate()))\n                .map(m -> m.getTitre())\n                .collect(Collectors.toList());\n        System.out.println(\"Antérieurs à 1970 et sortis : \" + anciensSortis);\n\n        System.out.println(\"Formats courts : \" + fonds.stream().filter(court).count());\n\n        // Le catalogue papier : une ligne par media, disponibles d'abord.\n        System.out.println();\n        System.out.println(\"--- Catalogue ---\");\n        fonds.stream()\n                .filter(disponible)\n                .map(m -> \"  ● \" + m.fiche())\n                .forEach(ligne -> System.out.println(ligne));\n        fonds.stream()\n                .filter(disponible.negate())\n                .map(m -> \"  ○ \" + m.fiche() + \" — sorti\")\n                .forEach(ligne -> System.out.println(ligne));\n\n        // Trois chiffres, trois flux : chacun ne se parcourt qu'une fois.\n        int minutesEnRayon = fonds.stream()\n                .filter(disponible)\n                .mapToInt(m -> m.getDureeMinutes())\n                .sum();\n        // Le flux transforme, l'ensemble dedoublonne : deux outils de deux\n        // lecons differentes qui se completent sans se marcher dessus.\n        int supportsDistincts = new HashSet<>(fonds.stream()\n                .map(m -> m.getSupport())\n                .collect(Collectors.toList())).size();\n        boolean toutSorti = fonds.stream().allMatch(disponible.negate());\n\n        System.out.println();\n        System.out.println(\"Fonds : \" + fonds.size() + \" médias, \" + supportsDistincts + \" supports\");\n        System.out.println(\"Minutes consultables en rayon : \" + minutesEnRayon);\n        System.out.println(\"Tout est-il sorti ? \" + toutSorti);\n    }\n}\n\nclass Media {\n    private String titre;\n    private String support;\n    private int annee;\n    private int dureeMinutes;\n    private boolean disponible;\n\n    Media(String titre, String support, int annee, int dureeMinutes, boolean disponible)
