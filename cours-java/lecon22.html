var DAY = {
  num: 22,
  title: "L'API Stream",
  subtitle: "Une chaîne de montage pour tes collections : filtrer, transformer, compter, en une seule phrase fluide.",
  theory: `
<h3>1. L'image : une chaîne de montage</h3>
<p>Imagine les jeux de ta <strong>ludothèque</strong> qui défilent sur un tapis roulant. À chaque poste, un ouvrier fait UNE chose : l'un écarte les jeux abîmés, l'autre note le prix sur une étiquette, un dernier compte ce qui reste. Un <strong>Stream</strong> (« flux ») est ce tapis roulant : une suite d'éléments qu'on fait passer par une série d'étapes.</p>
<pre class="pseudo">import java.util.stream.Collectors;         // pour rassembler le résultat à la fin

liste.stream()                             // (source) démarre le tapis à partir de la liste
     .filter(j -&gt; j.length() &gt; 3)          // (étape) ne garde que les jeux de + de 3 lettres
     .map(j -&gt; j.toUpperCase())            // (étape) transforme chaque jeu en MAJUSCULES
     .forEach(System.out::println);        // (fin) affiche chaque élément restant</pre>

<h3>2. Trois familles d'opérations</h3>
<p>La <strong>source</strong> crée le flux (<code>liste.stream()</code>). Les <strong>opérations intermédiaires</strong> transforment le flux et en renvoient un nouveau : on peut donc les enchaîner. L'<strong>opération terminale</strong> déclenche tout et produit un résultat (un nombre, une liste, un affichage). Sans opération terminale, RIEN ne s'exécute.</p>
<div class="tip">Un Stream est <strong>paresseux</strong> (lazy) : tant qu'on n'a pas branché une opération terminale, le tapis ne tourne pas. C'est comme une chaîne de montage à l'arrêt tant que personne n'appuie sur « démarrer ».</div>

<h3>3. filter : le videur à l'entrée</h3>
<p><code>filter</code> prend un <strong>Predicate</strong> (un test, leçon 21) et ne laisse passer que les éléments qui répondent « true ». Les autres tombent du tapis.</p>
<pre class="pseudo">liste.stream()                    // source
     .filter(j -&gt; j.startsWith("C")) // ne garde que les jeux commençant par C
     .count();                    // opération terminale : combien en reste-t-il ? (renvoie un long)</pre>

<h3>4. map : transformer chaque élément</h3>
<p><code>map</code> prend une <strong>Function</strong> et remplace chaque élément par le résultat. Le nombre d'éléments ne change pas, seule leur forme change.</p>
<pre class="pseudo">liste.stream()                    // source : des noms de jeux
     .map(j -&gt; j.length())        // remplace chaque nom par sa LONGUEUR (un Integer)
     .forEach(System.out::println); // affiche des nombres, pas des noms</pre>
<div class="warn">Ne confonds pas : <code>filter</code> ENLÈVE des éléments (le nombre baisse) ; <code>map</code> TRANSFORME sans en enlever (le nombre reste). Deux ouvriers, deux rôles.</div>

<h3>5. Récupérer le résultat : collect et Collectors.toList</h3>
<p>Souvent, on veut le résultat sous forme de nouvelle liste. L'opération terminale <code>collect(Collectors.toList())</code> rassemble les éléments survivants dans une <code>List</code>.</p>
<pre class="pseudo">List&lt;String&gt; courts = liste.stream()         // source
    .filter(j -&gt; j.length() &lt;= 3)            // garde les noms courts
    .collect(Collectors.toList());          // rassemble le résultat dans une nouvelle liste</pre>

<h3>6. Les terminales de calcul : count, anyMatch, sum, average</h3>
<pre class="pseudo">stream.count()                 // combien d'éléments ? (long)
stream.anyMatch(p)             // AU MOINS un élément passe le test p ? (boolean)
stream.allMatch(p)             // TOUS passent le test ? (boolean)
stream.mapToInt(x -&gt; x).sum()  // convertit en flux d'int puis additionne
stream.mapToInt(x -&gt; x).average() // moyenne (renvoie un OptionalDouble)</pre>

<h3>7. La règle d'or : l'original n'est jamais modifié</h3>
<p>Un Stream ne touche JAMAIS la collection d'origine : il produit un nouveau résultat. C'est comme photographier les jeux qui défilent sans déplacer les jeux eux-mêmes. Tu peux donc enchaîner des streams sans crainte d'abîmer tes données.</p>
<pre class="pseudo">long nb = jeux.stream()                       // on lit jeux...
    .filter(j -&gt; j.contains("a"))             // ...on filtre...
    .count();                                // ...on compte
// jeux reste EXACTEMENT la même liste qu'avant : le stream n'a rien modifié</pre>`,
  exercises: [
    { type: "qcm", q: "Un Stream, c'est l'image de…", opts: ["Un tableau figé", "Un tapis roulant / une chaîne de montage d'éléments", "Un fichier", "Une base de données"], a: 1, exp: "Une suite d'éléments qu'on fait passer par des étapes." },
    { type: "qcm", q: "Comment démarre-t-on un stream sur une liste ?", opts: ["liste.begin()", "liste.stream()", "new Stream(liste)", "liste.flux()"], a: 1, exp: "La méthode stream() crée la source." },
    { type: "qcm", q: "Une opération INTERMÉDIAIRE (filter, map)…", opts: ["produit le résultat final", "renvoie un nouveau stream, donc s'enchaîne", "ferme le stream", "modifie la liste d'origine"], a: 1, exp: "Elles se chaînent et ne déclenchent rien seules." },
    { type: "qcm", q: "Sans opération TERMINALE, que se passe-t-il ?", opts: ["Tout s'exécute quand même", "Rien : le stream est paresseux, il ne tourne pas", "Erreur de compilation", "Le stream s'exécute une seule fois"], a: 1, exp: "Lazy : la terminale déclenche l'exécution." },
    { type: "qcm", q: "<code>filter</code> attend en argument…", opts: ["une Function", "un Predicate (un test true/false)", "un Consumer", "un int"], a: 1, exp: "filter garde les éléments qui passent le test." },
    { type: "qcm", q: "<code>map</code> attend en argument…", opts: ["un Predicate", "une Function (transformation)", "un boolean", "un Supplier"], a: 1, exp: "map remplace chaque élément par le résultat de la fonction." },
    { type: "vf", q: "<code>filter</code> peut réduire le nombre d'éléments, <code>map</code> le conserve.", a: true, exp: "filter enlève, map transforme sans enlever." },
    { type: "qcm", q: "Que renvoie <code>.count()</code> ?", opts: ["un int", "un long : le nombre d'éléments", "une List", "un boolean"], a: 1, exp: "count() compte les éléments du flux (long)." },
    { type: "qcm", q: "Pour rassembler le résultat dans une nouvelle liste :", opts: [".toArray()", ".collect(Collectors.toList())", ".forEach()", ".sum()"], a: 1, exp: "collect avec Collectors.toList() construit une List." },
    { type: "qcm", q: "<code>anyMatch(p)</code> renvoie true si…", opts: ["tous les éléments passent p", "au moins un élément passe le test p", "aucun ne passe", "la liste est vide"], a: 1, exp: "anyMatch = « il en existe au moins un »." },
    { type: "qcm", q: "<code>allMatch(p)</code> renvoie true si…", opts: ["au moins un passe", "TOUS les éléments passent le test", "un seul passe", "aucun"], a: 1, exp: "allMatch = « tous sans exception »." },
    { type: "vf", q: "Un stream modifie la collection d'origine au fur et à mesure.", a: false, exp: "Faux : le stream ne touche jamais la source, il produit un nouveau résultat." },
    { type: "qcm", q: "Pour additionner des entiers d'un stream :", opts: [".add()", ".mapToInt(x -&gt; x).sum()", ".plus()", ".count()"], a: 1, exp: "On passe en flux d'int (mapToInt) puis sum()." },
    { type: "qcm", q: "L'ordre logique d'un pipeline typique est…", opts: ["terminale, intermédiaire, source", "source (stream) -> intermédiaires (filter/map) -> terminale (collect/count)", "map avant stream", "count avant filter toujours"], a: 1, exp: "Source, puis transformations, puis résultat." },
    { type: "vf", q: "On peut enchaîner plusieurs <code>filter</code> et <code>map</code> dans un même pipeline.", a: true, exp: "Chaque intermédiaire renvoie un stream : on chaîne autant qu'on veut." }
  ],
  final: {
    title: "Exercice final — Le rayon des jeux populaires",
    intro: `<p>On cherche, parmi les jeux, ceux dont le nom fait 5 lettres ou plus, en majuscules, et on les compte :</p>
<pre class="pseudo">import java.util.stream.Collectors;                  // pour collect

ArrayList&lt;String&gt; jeux = new ArrayList&lt;&gt;();          // la liste
jeux.add("Uno"); jeux.add("Catan"); jeux.add("Risk"); // 3 jeux
jeux.add("Monopoly");                                // + 1

List&lt;String&gt; retenus = jeux.stream()                 // (1) source
    .filter(j -&gt; j.length() &gt;= 5)                    // (2) garde les noms >= 5 lettres
    .map(j -&gt; j.toUpperCase())                       // (3) en majuscules
    .collect(Collectors.toList());                  // (4) rassemble en liste

System.out.println(retenus);                         // affiche le résultat
System.out.println(jeux.size());                     // (5) taille de la liste D'ORIGINE</pre>`,
    questions: [
      { type: "qcm", q: "(2) Après le filter, quels jeux restent ?", opts: ["Uno, Risk", "Catan, Monopoly (5 et 8 lettres)", "Tous", "Aucun"], a: 1, exp: "Catan=5, Monopoly=8 ; Uno=3 et Risk=4 sont écartés." },
      { type: "qcm", q: "(3) Après le map, à quoi ressemblent les éléments ?", opts: ["catan, monopoly", "CATAN, MONOPOLY (en majuscules)", "5, 8", "Catan, Monopoly inchangés"], a: 1, exp: "map applique toUpperCase à chacun." },
      { type: "qcm", q: "(4) Que contient <code>retenus</code> ?", opts: ["[CATAN, MONOPOLY]", "[Catan, Monopoly]", "[]", "un nombre"], a: 0, exp: "La liste des survivants transformés en majuscules." },
      { type: "vf", q: "(5) <code>jeux.size()</code> vaut toujours 4 : le stream n'a pas modifié la liste d'origine.", a: true, exp: "Le stream ne touche jamais la source." },
      { type: "qcm", q: "Si on remplaçait <code>collect(...)</code> par <code>count()</code>, on obtiendrait :", opts: ["[CATAN, MONOPOLY]", "2 (le nombre de survivants)", "4", "true"], a: 1, exp: "count() renvoie le nombre d'éléments restants : 2." }
    ],
    solution: `<pre class="pseudo">jeux.stream()                        // source : Uno, Catan, Risk, Monopoly
    .filter(j -&gt; j.length() &gt;= 5)    // reste : Catan, Monopoly
    .map(j -&gt; j.toUpperCase())       // devient : CATAN, MONOPOLY
    .collect(Collectors.toList());  // -> [CATAN, MONOPOLY]
// retenus = [CATAN, MONOPOLY]
// jeux.size() = 4  (la liste d'origine est intacte)</pre>
<p>Filtrer, transformer, rassembler : une phrase fluide remplace des boucles entières, sans jamais abîmer les données. Prochaine leçon : Optional, pour gérer proprement l'absence de valeur.</p>`
  }
};
