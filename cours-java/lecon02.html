  theory: `
<h3>1. Déclarer, c'est s'engager</h3>
<p>Imagine la <strong>mémoire</strong> de l'ordinateur comme un immense mur de casiers vides. Une <strong>variable</strong>, c'est un de ces casiers : il porte un <strong>nom</strong> (pour le retrouver), il possède un <strong>type</strong> (le genre de chose qu'il a le droit de contenir) et il garde une <strong>valeur</strong> à l'intérieur. En pseudocode on écrivait <code>age : ENTIER</code> puis <code>age ← 15</code>. En Java, le type se déclare AVANT le nom, et l'affectation (« ranger une valeur ») utilise le signe <code>=</code> :</p>
<pre class="pseudo">int age;          // DÉCLARATION : le casier « age » de type int (entier) existe, mais il est encore vide
age = 15;         // AFFECTATION : on range la valeur 15 dedans (la flèche ← du pseudocode devient =)
int taille = 180; // les deux d'un coup : déclaration + initialisation (remplissage) sur la même ligne</pre>
<div class="warn">Le <code>=</code> de Java est l'affectation (notre ← du pseudocode) : il RANGE la valeur de droite dans la variable de gauche. L'égalité de comparaison (« est-ce égal ? »), elle, s'écrit <code>==</code> (leçon 5). Ne les confonds JAMAIS.</div>

<h3>2. Les types primitifs essentiels</h3>
<p>Le <strong>type</strong> est l'étiquette du casier : il indique au compilateur quel genre de valeur il contient et quelles opérations sont permises. Les types de base de Java s'appellent les types <strong>primitifs</strong> (ce sont les briques les plus simples du langage).</p>
<pre class="pseudo">PSEUDOCODE     JAVA        EXEMPLE
ENTIER         int         int age = 15;                // nombres entiers, sans virgule
REEL           double      double prix = 19.99;         // nombres à virgule
BOOLEEN        boolean     boolean estMajeur = false;   // uniquement true (vrai) ou false (faux)
CARACTÈRE      char        char lettre = 'A';           // UN seul caractère, entre apostrophes simples
CHAINE         String      String nom = "Léa";          // du texte, guillemets doubles, S majuscule</pre>
<p>Autres primitifs à connaître de vue : <code>long</code> (très grands entiers), <code>float</code> (réel moins précis que <code>double</code>), <code>byte</code>, <code>short</code>. Note bien la particularité de Java : <code>String</code> prend une majuscule (ce n'est pas un primitif mais une <strong>classe</strong> — une catégorie plus riche, vue plus tard).</p>

<h3>3. Typage FORT : le contrat est strict</h3>
<pre class="pseudo">int n = 5;         // n est un entier
n = "cinq";        // ERREUR de compilation : on ne range pas du texte dans un casier prévu pour un int
double d = 5;      // OK : un int (5) rentre sans perte dans un double → il devient 5.0 (élargissement automatique)
int m = 5.9;       // ERREUR : mettre 5.9 dans un int perdrait le « ,9 » → Java l'interdit sans conversion explicite</pre>
<p>« Fortement typé » veut dire que le compilateur <strong>vérifie</strong> la cohérence des types AVANT l'exécution, comme un contrôleur qui refuse un colis trop grand pour la boîte aux lettres. Une conversion sûre (petit type → grand type) est automatique ; une conversion risquée (grand → petit, avec perte) est refusée sans <em>cast</em> (une conversion forcée, vue à la leçon 3). Les erreurs de type sont ainsi attrapées tôt, avant même que le programme tourne.</p>

<h3>4. char : un seul caractère, entre apostrophes</h3>
<pre class="pseudo">char initiale = 'L';    // apostrophes simples ' ' = un char (exactement 1 caractère, pas plus)
String mot = "L";       // guillemets doubles " " = une String (une chaîne, même si elle ne contient qu'une lettre !)</pre>
<p>La distinction est stricte en Java : <code>'L'</code> (un char) et <code>"L"</code> (une String) sont deux types différents, à ne surtout pas confondre. L'apostrophe, c'est une seule lettre ; les guillemets, c'est du texte.</p>

<h3>5. Constantes : final</h3>
<pre class="pseudo">final double TVA = 0.21;    // final = valeur verrouillée définitivement dès la déclaration (comme collée au casier)
TVA = 0.10;                 // ERREUR : on ne peut pas réaffecter une variable déclarée final</pre>
<p>Une <strong>constante</strong> (mot-clé <code>final</code>) protège une valeur qui ne doit jamais changer (un taux de TVA, une limite de vitesse…) : toute tentative de la modifier plus tard est refusée par le compilateur.</p>

<h3>6. Conventions de nommage (importantes en Java !)</h3>
<ul>
<li>Variables et méthodes : <code>camelCase</code> → <code>prixTotal</code>, <code>nbEleves</code> (1re lettre minuscule, puis une majuscule à chaque nouveau mot)</li>
<li>Classes : <code>PascalCase</code> → <code>Bonjour</code>, <code>CompteBancaire</code> (une majuscule dès le début)</li>
<li>Constantes : <code>MAJUSCULES_SOULIGNEES</code> → <code>TVA</code>, <code>VITESSE_MAX</code></li>
</ul>
<div class="tip">Ces conventions n'ont aucun effet pour le compilateur (le code marche pareil sans), mais elles rendent le code lisible et reconnaissable par tout développeur Java. La trace du jour 2 d'algorithmique fonctionne à l'identique : suis chaque variable ligne par ligne, seule la syntaxe a changé.</div>`,

    { type: "qcm", q: "Quel type pour stocker un numéro de téléphone « 0475123456 » ?", opts: ["int", "long", "String : le 0 initial compte et on ne calcule jamais avec", "double"], a: 2, exp: "Le piège du code postal (jour 3 d'algo) : identifiant → String." },
    { type: "vf", q: "<code>boolean ok = true;</code> est valide.", a: true, exp: "true/false en minuscules : les deux seules valeurs d'un boolean." },
    { type: "input", q: "Trace : <code>int x = 10; int y = x; x = 3;</code> Que vaut <code>y</code> ?", a: "10", ph: "nombre", exp: "y a reçu une COPIE de 10 ; modifier x ensuite ne change rien pour y." }
  ],

    intro: `<p>Tu traduis l'exercice final du jour 3 d'algorithmique : la fiche d'un membre du club. Choisis les bons types et corrige le code :</p>

      { type: "qcm", q: "Que fait le <code>+</code> dans <code>nom + \" - \" + numero</code> ?", opts: ["Une addition : erreur", "Une concaténation : Java convertit numero en texte et colle tout → Martin - 20264", "Une comparaison", "Un affichage de numero sur une nouvelle ligne"], a: 1, exp: "Le & du pseudocode devient + en Java quand une String est impliquée. Approfondi leçon 3 !" }
    ],
    solution: `<pre class="pseudo">public class Fiche {
