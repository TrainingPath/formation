  title: "Records, enums et pattern matching",
  subtitle: "Trois outils modernes pour décrire des données : la fiche figée, la liste de choix fermée, et le tri intelligent par forme.",
  theory: `
<h3>1. Le record : une fiche cartonnée figée</h3>
<p>Dans ta <strong>ludothèque</strong>, chaque jeu a une fiche : un nom, un nombre de joueurs, un prix. Avant, décrire cette fiche demandait une longue classe (champs privés, constructeur, getters, equals, toString…). Un <strong>record</strong> écrit tout cela en UNE ligne. C'est une fiche cartonnée : une fois remplie, elle ne se modifie plus (<strong>immuable</strong>).</p>
<pre class="pseudo">public record Jeu(String nom, int joueurs, double prix) { }  // 3 champs : et c'est TOUT

Jeu catan = new Jeu("Catan", 4, 42.0);   // constructeur généré automatiquement
System.out.println(catan.nom());          // accesseur généré : « nom() », pas « getNom() »
System.out.println(catan);                // toString auto : Jeu[nom=Catan, joueurs=4, prix=42.0]</pre>
<div class="tip">Un record génère AUTOMATIQUEMENT : le constructeur, un accesseur par champ (<code>nom()</code>, <code>prix()</code>…), <code>equals</code>, <code>hashCode</code> et <code>toString</code>. Deux records aux mêmes valeurs sont égaux (<code>equals</code> compare les contenus).</div>

<h3>2. Le record est IMMUABLE</h3>
<p><strong>Immuable</strong> veut dire « qui ne peut pas changer après création » — comme une fiche plastifiée. Il n'y a pas de « setter ». Pour « changer » un champ, on crée une nouvelle fiche. Cela évite des tonnes de bugs (personne ne peut modifier tes données dans ton dos).</p>
<pre class="pseudo">Jeu enSolde = new Jeu(catan.nom(), catan.joueurs(), 21.0);  // on RECRÉE plutôt que de modifier</pre>

<h3>3. L'enum : une liste de choix FERMÉE</h3>
<p>Certaines valeurs n'ont qu'un nombre fini de possibilités : les jours de la semaine, les points cardinaux, la difficulté d'un jeu. Un <strong>enum</strong> (énumération) est une liste fermée de constantes nommées. C'est le menu à choix limité : impossible de commander « hors carte ».</p>
<pre class="pseudo">public enum Difficulte {          // une énumération : les seules valeurs possibles
    FACILE, MOYEN, DIFFICILE      // 3 constantes, écrites en MAJUSCULES par convention
}

Difficulte d = Difficulte.MOYEN;  // on ne peut choisir QUE parmi les 3
System.out.println(d);            // affiche MOYEN
System.out.println(d.name());     // « MOYEN » (le nom en texte)
System.out.println(d.ordinal());  // 1 : sa position (FACILE=0, MOYEN=1, DIFFICILE=2)</pre>
<div class="warn">L'enum est <strong>type-sûr</strong> : impossible de passer une difficulté inexistante. Comparé à un simple <code>int</code> (0, 1, 2) où l'on peut écrire 99 par erreur, l'enum verrouille les valeurs valides dès la compilation.</div>

<h3>4. switch sur un enum</h3>
<pre class="pseudo">switch (d) {                        // on aiguille selon la difficulté
    case FACILE   -&gt; System.out.println("Pour débuter"); // flèche : pas de break nécessaire
    case MOYEN    -&gt; System.out.println("Un bon défi");  // chaque branche est isolée
    case DIFFICILE-&gt; System.out.println("Pour experts"); // couvre les 3 cas
}</pre>
<div class="tip">Le <code>switch</code> à flèches (<code>-&gt;</code>, Java moderne) n'a pas besoin de <code>break</code> et le compilateur vérifie que tu couvres tous les cas de l'enum : un oubli devient une erreur.</div>

<h3>5. Le pattern matching : trier selon la FORME de l'objet</h3>
<p>Le <strong>pattern matching</strong> (« filtrage par motif ») teste le type d'un objet ET, si ça correspond, range directement la valeur dans une variable du bon type. Fini le <code>instanceof</code> suivi d'un cast manuel.</p>
<pre class="pseudo">Object o = "Uno";                        // une variable de type général
if (o instanceof String s) {             // teste : est-ce un String ? Si oui, range-le dans s (déjà casté)
    System.out.println(s.length());      // on utilise s directement : plus besoin de (String) o
}</pre>

<h3>6. Le pattern matching dans un switch</h3>
<pre class="pseudo">String decrire(Object o) {                    // décrit un objet selon son type réel
    return switch (o) {                       // switch qui RENVOIE une valeur
        case Integer i -&gt; "un entier : " + i; // si c'est un Integer, i est déjà typé
        case String s  -&gt; "un texte : " + s;  // si c'est un String, s est déjà typé
        default        -&gt; "autre chose";       // cas restant obligatoire
    };
}</pre>
<p>Ces outils modernes (records, enums, pattern matching) rendent le code plus court, plus sûr et plus lisible : on décrit CE QUE sont les données, et Java s'occupe de la mécanique.</p>`,
  exercises: [

    { type: "vf", q: "Le pattern matching évite le cast manuel après un <code>instanceof</code>.", a: true, exp: "La variable liée est déjà du bon type." },
    { type: "qcm", q: "Un <code>switch</code> qui RENVOIE une valeur s'utilise comme…", opts: ["une instruction sans retour", "une expression : <code>String r = switch(o) { ... };</code>", "une méthode qui renvoie void", "un bloc try/catch"], a: 1, exp: "Le switch-expression produit un résultat directement." },
    { type: "qcm", q: "Dans un switch avec pattern matching, le cas <code>default</code> est…", opts: ["interdit", "souvent obligatoire pour couvrir les types restants", "toujours inutile", "équivalent à un case null"], a: 1, exp: "Il faut couvrir tous les cas possibles." },
    { type: "vf", q: "Records, enums et pattern matching rendent le code plus court ET plus sûr.", a: true, exp: "On décrit les données ; Java génère la mécanique et vérifie les cas." }

public record Jeu(String nom, Difficulte niveau) { }       // (2) fiche immuable

Jeu j = new Jeu("Catan", Difficulte.MOYEN);                // création
System.out.println(j.nom());                               // (3) accesseur
System.out.println(j);                                     // (4) toString auto

String texte = switch (j.niveau()) {                       // (5) switch-expression

    case MOYEN     -&gt; "intermédiaire";
    case DIFFICILE -&gt; "expert";

      { type: "vf", q: "(5) Le switch-expression renvoie « intermédiaire » ici.", a: true, exp: "niveau() vaut MOYEN, donc la branche MOYEN -> « intermédiaire »." }
    ],
    solution: `<pre class="pseudo">Difficulte : FACILE, MOYEN, DIFFICILE      // 3 valeurs possibles, verrouillées
Jeu(...)  : constructeur + nom()/niveau() + equals/hashCode/toString générés
j.nom()   -> "Catan"                        // accesseur du record
j         -> Jeu[nom=Catan, niveau=MOYEN]   // toString automatique
switch(j.niveau()) : MOYEN -> "intermédiaire"  // texte = "intermédiaire"</pre>
<p>Une fiche immuable, un choix verrouillé, un aiguillage exhaustif : on décrit les données, Java écrit la plomberie. Prochaine leçon : Comparator, pour trier ces objets selon nos règles.</p>`

      "solution": "// La fromagerie : une fiche cartonnee par fromage, et une liste de choix fermee\n// pour le lait. Ce que la classe de la lecon 13 demandait en cinquante lignes.\nimport java.util.ArrayList;\nimport java.util.HashSet;\nimport java.util.List;\nimport java.util.stream.Collectors;\n\npublic class Fromagerie {\n\n    // Toute la fiche en une ligne : constructeur, accesseurs, egalite, affichage.\n    record Fromage(String nom, Lait lait, int affinageJours, double prixKg) { }\n\n    // Les seuls laits possibles : impossible d'ecrire « chevre » avec une faute.\n    enum Lait { VACHE, CHEVRE, BREBIS }\n\n    // Le switch a fleches : le compilateur verifie que les trois cas sont couverts.\n    static String saison(Lait lait) {\n        return switch (lait) {\n            case VACHE -> \"toute l'année\";\n            case CHEVRE -> \"du printemps à l'automne\";\n            case BREBIS -> \"de l'hiver au début de l'été\";\n        };\n    }\n\n    public static void main(String[] args) {\n        ArrayList<Fromage> etal = new ArrayList<>();\n        etal.add(new Fromage(\"Comté\", Lait.VACHE, 240, 28.50));\n        etal.add(new Fromage(\"Crottin\", Lait.CHEVRE, 21, 34.00));\n        etal.add(new Fromage(\"Ossau-Iraty\", Lait.BREBIS, 120, 39.00));\n        etal.add(new Fromage(\"Reblochon\", Lait.VACHE, 30, 26.00));\n\n        // L'affichage automatique de la fiche, sans une ligne ecrite pour lui.\n        System.out.println(\"Fiche brute : \" + etal.get(0));\n\n        // Les accesseurs portent le nom du champ, sans « get ».\n        for (Fromage f : etal) {\n            System.out.println(f.nom() + \" — \" + f.lait() + \", \" + f.affinageJours()\n                    + \" j, \" + f.prixKg() + \" €/kg — \" + saison(f.lait()));\n        }\n\n        // Deux fiches aux memes valeurs sont egales : l'egalite compare le contenu.\n        Fromage comte = new Fromage(\"Comté\", Lait.VACHE, 240, 28.50);\n        System.out.println(\"Même fiche ? \" + comte.equals(etal.get(0)));\n        System.out.println(\"Même objet ? \" + (comte == etal.get(0)));\n\n        // Et comme l'empreinte suit le contenu, l'ensemble les considere comme un doublon.\n        List<Fromage> avecDoublon = new ArrayList<>(etal);\n        avecDoublon.add(comte);\n        System.out.println(\"Fiches : \" + avecDoublon.size()\n                + \", distinctes : \" + new HashSet<>(avecDoublon).size());\n\n        // Une fiche ne se modifie pas : la promotion en fabrique une neuve.\n        Fromage promo = new Fromage(comte.nom(), comte.lait(), comte.affinageJours(), 24.90);\n        System.out.println(\"Avant : \" + comte.prixKg() + \" € — après : \" + promo.prixKg() + \" €\");\n        System.out.println(\"L'original a-t-il bougé ? \" + comte.prixKg());\n\n        // Une constante d'enumeration sait dire son nom et sa position.\n        System.out.println(\"Constante : \" + Lait.BREBIS.name()\n                + \", position \" + Lait.BREBIS.ordinal());\n\n        // Combien de laits differents sont represents sur l'etal aujourd'hui ?\n        System.out.println(\"Laits à l'étal : \" + new HashSet<>(etal.stream()\n                .map(f -> f.lait())\n                .collect(Collectors.toList())).size());\n    }\n}",

      "remarque": "Le cas par défaut du tarif rend zéro euro, ce qui est une décision discutable : un envoi non reconnu ne coûte rien, donc passe inaperçu dans le total. Rendre zéro est commode et dangereux ; lever une exception aurait arrêté le tri sur un objet inconnu. Aucun des deux n'est évidemment juste — mais choisir sans y penser, si.",
      "indices": [
        "Range les données avant de coder. Trois formes, chacune avec ses champs propres, plus deux champs communs à toutes : le destinataire et la zone. Note bien que « commun » ne veut pas dire « partagé » : chaque fiche redéclare les siens. Écris ensuite, en français, la formule du tarif pour chacune des trois formes ; le code sera la traduction directe de ces trois phrases.",
        "Le plan : les trois fiches et la liste fermée en haut ; une fonction pour le supplément de zone, qui aiguille sur la liste fermée ; une fonction de tarif et une de libellé, qui aiguillent sur la forme ; deux petites fonctions du même genre pour relire le destinataire et la zone ; enfin le quai et les affichages.",
        "Pour les fonctions qui décident selon la forme, souviens-toi que la liste contient des objets de types différents : elle doit donc être déclarée sur le type le plus général. C'est ce qui rend l'aiguillage nécessaire, et c'est aussi ce qui oblige à prévoir un cas par défaut — le compilateur ne peut pas savoir que tu n'y mettras que tes trois formes.",

      "solution": "// Le centre de tri postal : trois formes d'envoi, une seule chaine de traitement.\n// Le tri se fait sur la FORME de l'objet, pas sur une etiquette qu'on aurait\n// pense a mettre a jour.\nimport java.util.ArrayList;\nimport java.util.HashSet;\nimport java.util.List;\nimport java.util.Optional;\nimport java.util.stream.Collectors;\n\npublic class CentreDeTri {\n\n    record Lettre(String destinataire, int grammes, Zone zone) { }\n\n    record Colis(String destinataire, double kilos, boolean fragile, Zone zone) { }\n\n    record Palette(String destinataire, int nbColis, Zone zone) { }\n\n    enum Zone { LOCALE, NATIONALE, INTERNATIONALE }\n\n    // Le supplement depend de la zone : trois cas, tous couverts.\n    static double supplement(Zone zone) {\n        return switch (zone) {\n            case LOCALE -> 0.0;\n            case NATIONALE -> 1.50;\n            case INTERNATIONALE -> 6.00;\n        };\n    }\n\n    // Le tarif depend de la FORME de l'envoi. Chaque branche recoit une variable\n    // deja du bon type : aucune conversion manuelle a ecrire.\n    static double tarif(Object envoi) {\n        return switch (envoi) {\n            case Lettre l -> 1.20 + l.grammes() * 0.01 + supplement(l.zone());\n            case Colis c -> 4.00 + c.kilos() * 1.10 + (c.fragile() ? 3.00 : 0.00)\n                    + supplement(c.zone());\n            case Palette p -> 25.00 + p.nbColis() * 2.00 + supplement(p.zone());\n            default -> 0.00;\n        };\n    }\n\n    static String libelle(Object envoi) {\n        return switch (envoi) {\n            case Lettre l -> \"lettre de \" + l.grammes() + \" g\";\n            case Colis c -> \"colis de \" + c.kilos() + \" kg\";\n            case Palette p -> \"palette de \" + p.nbColis() + \" colis\";\n            default -> \"envoi non reconnu\";\n        };\n    }\n\n    // Une recherche par destinataire : elle peut ne rien trouver (lecon 23).\n    static Optional<Object> premierPour(List<Object> envois, String destinataire) {\n        return envois.stream()\n                .filter(e -> destinataire.equals(destinataireDe(e)))\n                .findFirst();\n    }\n\n    // Le destinataire se lit sur les trois formes, mais par trois accesseurs\n    // differents : le filtrage par motif les reunit.\n    static String destinataireDe(Object envoi) {\n        return switch (envoi) {\n            case Lettre l -> l.destinataire();\n            case Colis c -> c.destinataire();\n            case Palette p -> p.destinataire();\n            default -> \"\";\n        };\n    }\n\n    public static void main(String[] args) {\n        ArrayList<Object> quai = new ArrayList<>();\n        quai.add(new Lettre(\"Verhaegen\", 20, Zone.LOCALE));\n        quai.add(new Colis(\"Dupuis\", 2.5, true, Zone.NATIONALE));\n        quai.add(new Palette(\"Ateliers Sart\", 12, Zone.NATIONALE));\n        quai.add(new Lettre(\"Okonkwo\", 250, Zone.INTERNATIONALE));\n        quai.add(new Colis(\"Verhaegen\", 8.0, false, Zone.INTERNATIONALE));\n\n        System.out.println(\"--- Bordereau ---\");\n        for (Object envoi : quai) {\n            System.out.println(destinataireDe(envoi) + \" : \" + libelle(envoi)\n                    + \" → \" + tarif(envoi) + \" €\");\n        }\n\n        // a) le total, par un flux\n        double total = quai.stream().mapToDouble(e -> tarif(e)).sum();\n        System.out.println(\"Total du quai : \" + total + \" €\");\n\n        // b) deux fiches identiques sont egales, et l'ensemble les dedoublonne\n        Lettre a = new Lettre(\"Verhaegen\", 20, Zone.LOCALE);\n        Lettre b = new Lettre(\"Verhaegen\", 20, Zone.LOCALE);\n        System.out.println(\"Deux fiches identiques égales ? \" + a.equals(b));\n        System.out.println(\"Affichage automatique : \" + a);\n        List<Object> avecDoublons = new ArrayList<>(quai);\n        avecDoublons.add(a);\n        avecDoublons.add(b);\n        System.out.println(\"Envois : \" + avecDoublons.size()\n                + \", distincts : \" + new HashSet<>(avecDoublons).size());\n\n        // c) une forme non prevue tombe dans la branche de secours\n        Object intrus = \"un parapluie oublié sur le quai\";\n        System.out.println(\"Intrus : \" + libelle(intrus) + \" → \" + tarif(intrus) + \" €\");\n\n        // d) une fiche ne se modifie pas : le reetiquetage en cree une neuve\n        Colis initial = new Colis(\"Dupuis\", 2.5, true, Zone.NATIONALE);\n        Colis reoriente = new Colis(initial.destinataire(), initial.kilos(),\n                initial.fragile(), Zone.INTERNATIONALE);\n        System.out.println(\"Avant : \" + tarif(initial) + \" € — après : \" + tarif(reoriente) + \" €\");\n        System.out.println(\"L'original a-t-il bougé ? \" + initial.zone());\n\n        // La recherche qui aboutit et celle qui echoue, meme traitement.\n        System.out.println(\"Pour Okonkwo : \"\n                + premierPour(quai, \"Okonkwo\").map(e -> libelle(e)).orElse(\"aucun envoi\"));\n        System.out.println(\"Pour Lemmens : \"\n                + premierPour(quai, \"Lemmens\").map(e -> libelle(e)).orElse(\"aucun envoi\"));\n\n        // Les envois internationaux, par un flux sur des formes melangees.\n        List<String> international = quai.stream()\n                .filter(e -> zoneDe(e) == Zone.INTERNATIONALE)\n                .map(e -> destinataireDe(e))\n                .collect(Collectors.toList());\n        System.out.println(\"À l'international : \" + international);\n    }\n\n    static Zone zoneDe(Object envoi) {\n        return switch (envoi) {\n            case Lettre l -> l.zone();\n            case Colis c -> c.zone();\n            case Palette p -> p.zone();\n            default -> Zone.LOCALE;\n        };\n    }\n}",

    {

      "hier": "lecon23.html",
      "enonce": "Dernier jour de la médiathèque. Remplace la classe du média, écrite au jour 1 en une soixantaine de lignes, par une fiche cartonnée d'une seule ligne, et remplace le support — jusqu'ici un texte libre — par une liste de choix fermée à trois constantes. Réécris tes quatre critères nommés en conséquence : ils doivent rester reconnaissables ligne pour ligne. Le picto du catalogue dépend du support et se choisit par un aiguillage à flèches sans cas par défaut. Le programme reprend tout ce que la série a construit : les titres disponibles avec leur nombre, le catalogue avec les disponibles d'abord puis les sortis, et la borne qui répond aux trois demandes du jour 3. Il ajoute ensuite ce que la fiche cartonnée apporte : l'affichage brut d'une fiche, l'égalité de deux fiches aux mêmes valeurs, le comptage des fiches distinctes après ajout d'un doublon, le retour de prêt de « Blade Runner » — qui fabrique une fiche neuve sans toucher à l'ancienne — et le nombre de médias disponibles avant et après ce retour, calculé sur deux fonds distincts. Il termine par les trois suggestions et la ligne de synthèse : taille du fonds, supports distincts, minutes en rayon.",
      "principe": "La série se termine sur ce qu'elle a démontré sans le dire : les critères nommés du premier jour ont survécu à un changement de mécanique, puis à l'arrivée de l'absence, puis à un changement complet de représentation des données. Ce qui traverse quatre refontes sans se déformer était au bon niveau d'abstraction — et c'est la seule preuve qui vaille.",
      "reflexion": "Le retour de prêt oblige à reconstruire une fiche et à reconstruire le fonds, là où le jour 1 aurait suffi d'un modificateur. Compte ce que cela coûte en lignes, puis compte ce que cela garantit. Ensuite, réponds franchement : pour une médiathèque qui enregistre cent prêts par jour, est-ce le bon choix ? Qu'est-ce qui, dans la nature du problème, ferait pencher la balance ?",
      "remarque": "Les quatre critères ont changé — les accesseurs ont perdu leur « get » et la comparaison de support est passée du texte à la constante. Ils sont reconnaissables, pas identiques. Il faut le dire nettement : ce jour-ci n'est pas la démonstration parfaite des trois précédents, et prétendre le contraire serait tricher avec la seule chose que la série cherchait à établir.",
      "indices": [
        "Fais l'inventaire de ce qui change avant de toucher au code. La déclaration du média : une ligne au lieu de soixante. Le support : une constante au lieu d'un texte. Les accesseurs : sans « get ». La méthode de fiche : elle sort de la classe, puisqu'une fiche cartonnée n'a pas de comportement. Tout le reste — critères, flux, boîtes — se contente de suivre.",
        "Le plan : la fiche cartonnée et la liste fermée en haut ; la fonction du picto, qui aiguille sur le support ; la fonction de fiche, qui appelle le picto ; les deux recherches du jour 3, inchangées ; puis le programme principal, section par section, dans l'ordre de l'énoncé.",
        "Les quatre critères se réécrivent presque mécaniquement : retire les « get », et remplace la comparaison de texte du support par une comparaison de constantes. Note que celle-ci s'écrit avec le double signe égal, contrairement aux textes — deux constantes d'une même liste fermée sont uniques en mémoire, il n'y a donc rien à comparer champ par champ. C'est un des rares endroits où le double signe égal est non seulement correct mais préférable.",
        "Le point dur est le retour de prêt, parce qu'il demande de reconstruire à deux niveaux. D'abord la fiche : une fiche cartonnée ne se modifie pas, donc tu en fabriques une neuve reprenant les quatre autres valeurs et changeant la disponibilité. Ensuite le fonds : pour ne pas modifier le fonds d'origine — dont tu veux afficher le compte d'avant — tu en fabriques une copie et tu y remplaces la fiche à sa position. Compte alors les disponibles sur chacun des deux fonds : cinq d'un côté, six de l'autre, et les deux existent encore à la fin.",
        "Ton fichier ressemble à ceci :<br><code>record Media(String titre, Support support, int annee, int …, boolean …) { }</code><br><code>enum Support { FILM, …, … }</code><br><code>static String picto(Support support) { return switch (support) { case FILM -&gt; \"▸\"; … }; }</code><br><code>Predicate&lt;Media&gt; film = m -&gt; m.support() == Support.…;</code> ← les quatre critères<br><code>Media rentre = new Media(sorti.titre(), sorti.support(), …, …, true);</code><br><code>List&lt;Media&gt; fondsApresRetour = new ArrayList&lt;&gt;(fonds);</code><br><code>fondsApresRetour.set(3, …);</code><br><code>new HashSet&lt;&gt;(avecDoublon).size()</code>"
      ],
      "solution": "// La mediatheque - jour 4 sur 4 : la classe de soixante lignes devient une ligne.\n// Les quatre criteres nommes survivent une derniere fois, presque intacts : seul\n// le nom des accesseurs change, puisque le record les nomme comme les champs.\nimport java.util.ArrayList;\nimport java.util.HashSet;\nimport java.util.List;\nimport java.util.Optional;\nimport java.util.function.Predicate;\nimport java.util.stream.Collectors;\n\npublic class Mediatheque {\n\n    // Toute la fiche du jour 1, en une ligne, et immuable par-dessus le marche.\n    record Media(String titre, Support support, int annee, int dureeMinutes, boolean disponible) { }\n\n    // Le support n'est plus un texte libre : la faute de frappe devient impossible.\n    enum Support { FILM, DISQUE, LIVRE }\n\n    // Le picto du catalogue depend du support : trois cas, tous couverts.\n    static String picto(Support support) {\n        return switch (support) {\n            case FILM -> \"▸\";\n            case DISQUE -> \"♪\";\n            case LIVRE -> \"▤\";\n        };\n    }\n\n    static String fiche(Media m) {\n        String duree;\n        if (m.dureeMinutes() == 0) {\n            duree = \"—\";\n        } else {\n            duree = m.dureeMinutes() + \" min\";\n        }\n        return picto(m.support()) + \" \" + m.titre() + \" (\" + m.annee() + \", \" + duree + \")\";\n    }\n\n    static Optional<Media> parTitre(List<Media> fonds, String titre) {\n        return fonds.stream()\n                .filter(m -> m.titre().equals(titre))\n                .findFirst();\n    }\n\n    static Optional<Media> premier(List<Media> fonds, Predicate<Media> critere) {\n        return fonds.stream()\n                .filter(critere)\n                .findFirst();\n    }\n\n    public static void main(String[] args) {\n        ArrayList<Media> fonds = new ArrayList<>();\n        fonds.add(new Media(\"Le Guépard\", Support.FILM, 1963, 205, true));\n        fonds.add(new Media(\"Kind of Blue\", Support.DISQUE, 1959, 45, true));\n        fonds.add(new Media(\"Les Misérables\", Support.LIVRE, 1862, 0, false));\n        fonds.add(new Media(\"Blade Runner\", Support.FILM, 1982, 117, false));\n        fonds.add(new Media(\"Le Sacre du printemps\", Support.DISQUE, 1913, 33, true));\n        fonds.add(new Media(\"La Nuit des temps\", Support.LIVRE, 1968, 0, true));\n        fonds.add(new Media(\"La Jetée\", Support.FILM, 1962, 28, true));\n\n        // Les memes quatre criteres qu'aux jours 1, 2 et 3 : seuls les accesseurs\n        // ont perdu leur « get », et le support se compare a une constante.\n        Predicate<Media> disponible = m -> m.disponible();\n        Predicate<Media> film = m -> m.support() == Support.FILM;\n        Predicate<Media> avant1970 = m -> m.annee() < 1970;\n        Predicate<Media> court = m -> m.dureeMinutes() > 0 && m.dureeMinutes() <= 60;\n\n        List<String> titresDisponibles = fonds.stream()\n                .filter(disponible)\n                .map(m -> m.titre())\n                .collect(Collectors.toList());\n        System.out.println(\"Disponibles (\" + titresDisponibles.size() + \") : \" + titresDisponibles);\n\n        System.out.println();\n        System.out.println(\"--- Catalogue ---\");\n        fonds.stream()\n                .filter(disponible)\n                .map(m -> \"  \" + fiche(m))\n                .forEach(ligne -> System.out.println(ligne));\n        fonds.stream()\n                .filter(disponible.negate())\n                .map(m -> \"  \" + fiche(m) + \" — sorti\")\n                .forEach(ligne -> System.out.println(ligne));\n\n        // La borne du jour 3, inchangee dans son principe.\n        System.out.println();\n        System.out.println(\"--- Borne ---\");\n        ArrayList<String> demandes = new ArrayList<>();\n        demandes.add(\"La Jetée\");\n        demandes.add(\"Blade Runner\");\n        demandes.add(\"Dune\");\n        for (String demande : demandes) {\n            String reponse = parTitre(fonds, demande)\n                    .map(m -> fiche(m) + (m.disponible() ? \" — en rayon\" : \" — sorti\"))\n                    .orElse(\"titre absent du fonds\");\n            System.out.println(demande + \" → \" + reponse);\n        }\n\n        // L'affichage automatique de la fiche : ecrit par personne.\n        System.out.println();\n        System.out.println(\"Fiche brute : \" + fonds.get(6));\n\n        // Deux fiches aux memes valeurs sont egales, sans une ligne d'egalite ecrite.\n        Media jetee = new Media(\"La Jetée\", Support.FILM, 1962, 28, true);\n        System.out.println(\"Même fiche ? \" + jetee.equals(fonds.get(6)));\n        List<Media> avecDoublon = new ArrayList<>(fonds);\n        avecDoublon.add(jetee);\n        System.out.println(\"Fiches : \" + avecDoublon.size()\n                + \", distinctes : \" + new HashSet<>(avecDoublon).size());\n\n        // Un retour de pret ne modifie pas la fiche : il en fabrique une neuve.\n        Media sorti = fonds.get(3);\n        Media rentre = new Media(sorti.titre(), sorti.support(), sorti.annee(),\n                sorti.dureeMinutes(), true);\n        System.out.println(\"Blade Runner rentré : \" + rentre.disponible()\n                + \", fiche d'origine : \" + sorti.disponible());\n\n        // Le fonds n'est pas modifie sur place : on en construit un nouveau.\n        List<Media> fondsApresRetour = new ArrayList<>(fonds);\n        fondsApresRetour.set(3, rentre);\n        System.out.println(\"Disponibles après retour : \"\n                + fondsApresRetour.stream().filter(disponible).count()\n                + \" (avant : \" + fonds.stream().filter(disponible).count() + \")\");\n\n        System.out.println();\n        System.out.println(\"Film en rayon : \"\n                + premier(fonds, film.and(disponible)).map(m -> m.titre()).orElse(\"aucun\"));\n        System.out.println(\"Format court  : \"\n                + premier(fonds, court.and(disponible)).map(m -> fiche(m)).orElse(\"aucun\"));\n        System.out.println(\"Avant 1970    : \"\n                + premier(fonds, avant1970.and(disponible)).map(m -> m.titre()).orElse(\"aucun\"));\n\n        int minutesEnRayon = fonds.stream()\n                .filter(disponible)\n                .mapToInt(m -> m.dureeMinutes())\n                .sum();\n        int supportsDistincts = new HashSet<>(fonds.stream()\n                .map(m -> m.support())\n                .collect(Collectors.toList())).size();\n        System.out.println(\"Fonds : \" + fonds.size() + \" médias, \"\n                + supportsDistincts + \" supports, \" + minutesEnRayon + \" min en rayon\");\n    }\n}",
      "pourquoi": "Le fonds d'avant le retour et celui d'après coexistent à la fin du programme, et tous deux sont interrogeables. Avec des objets modifiables, la question « combien y en avait-il avant ? » aurait exigé de retenir le chiffre au bon moment — donc d'y avoir pensé à l'avance. Avec des fiches figées, l'historique est gratuit : il suffit de ne pas jeter l'ancienne version. C'est ce qui rend l'immuabilité si utile dès qu'un programme doit expliquer ce qu'il a fait.",
      "tests": [
        {
          "code": "assert 'Disponibles (5)' in __output__ and '▸ La Jetée (1962, 28 min)' in __output__ and '▤ Les Misérables (1862, —) — sorti' in __output__",
          "label": "Le catalogue reprend le fonds de la série, avec le picto du support"
        },
        {
          "code": "assert 'Dune → titre absent du fonds' in __output__ and 'Blade Runner → ▸ Blade Runner (1982, 117 min) — sorti' in __output__",
          "label": "La borne du jour 3 fonctionne à l'identique sur les nouvelles fiches"
        },
        {
          "code": "assert 'Media[titre=La Jetée, support=FILM, annee=1962, dureeMinutes=28, disponible=true]' in __output__ and 'Même fiche ? true' in __output__ and 'Fiches : 8, distinctes : 7' in __output__",
          "label": "Affichage, égalité et empreinte sont générés, pas écrits"
        },
        {
          "code": "assert \"Blade Runner rentré : true, fiche d'origine : false\" in __output__ and 'Disponibles après retour : 6 (avant : 5)' in __output__",
          "label": "Le retour de prêt laisse coexister les deux états du fonds"
        },
        {
          "code": "assert 'Film en rayon : Le Guépard' in __output__ and 'Format court  : ♪ Kind of Blue (1959, 45 min)' in __output__ and 'Fonds : 7 médias, 3 supports, 311 min en rayon' in __output__",
          "label": "Suggestions et synthèse concordent avec les jours précédents"
        }
      ],
      "checklist": [
        "Tes quatre critères sont-ils reconnaissables ligne pour ligne par rapport au jour 3 ? Note précisément ce qui a dû changer, et pourquoi.",
        "Compare la comparaison de support d'aujourd'hui et celle d'hier : pourquoi le double signe égal est-il correct ici, alors qu'il ne l'était pas sur un texte ?",
        "Ton fonds d'origine compte-t-il encore cinq disponibles à la fin du programme ? Si non, tu as modifié la liste au lieu d'en fabriquer une copie.",
        "Ton aiguillage sur le support a-t-il un cas par défaut ? Il ne devrait pas — et tu dois pouvoir dire ce que cela t'apporte.",
        "Le total des minutes en rayon vaut-il toujours 311, comme aux jours 2 et 3 ? Une refonte qui change les chiffres n'est pas une refonte."
      ],
      "note": "Quatre jours, quatre mécaniques — méthodes, flux, boîtes, fiches figées — et les mêmes 311 minutes en rayon à l'arrivée. C'est la propriété que tu dois retenir de cette série : refondre, c'est changer la façon dont un programme calcule sans changer ce qu'il répond. Le jour où les chiffres bougent, ce n'est plus une refonte, c'est une correction — ou un bug."
    }
  ]
};

      "solution": "public class Catalogue {                                  // classe principale\n\n    enum Genre { STRATEGIE, FAMILLE, CARTES }             // liste fermée de genres\n\n    record Jeu(String nom, Genre genre, double prix) { }  // fiche immuable : 3 champs\n\n    public static void main(String[] args) {              // point d'entrée\n        Jeu catan = new Jeu(\"Catan\", Genre.STRATEGIE, 42.0); // 1er jeu\n        Jeu uno = new Jeu(\"Uno\", Genre.CARTES, 8.0);         // 2e jeu\n\n        System.out.println(catan);                        // toString auto : Jeu[nom=Catan, ...]\n        System.out.println(uno);                          // idem pour uno\n        System.out.println(catan.nom());                  // accesseur : Catan\n\n        String reco = switch (catan.genre()) {            // switch-expression sur le genre\n            case STRATEGIE -> \"Pour les cerveaux tactiques\"; // branche STRATEGIE\n            case FAMILLE   -> \"Parfait a plusieurs\";         // branche FAMILLE\n            case CARTES    -> \"Rapide et nomade\";            // branche CARTES\n        };                                                // le switch renvoie une String\n        System.out.println(reco);                         // affiche la recommandation\n    }                                                     // fin de main\n}                                                         // fin de la classe",
