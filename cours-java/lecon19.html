<h3>1. Le hasard : la classe Random</h3>
<pre class="pseudo">import java.util.Random;

Random alea = new Random();          // crée un générateur de nombres aléatoires (un « lanceur de dés »)
int de = alea.nextInt(6) + 1;        // nextInt(6) tire 0..5 ; le +1 décale en 1..6 : un dé !
int carte = alea.nextInt(52);        // un entier de 0 à 51 (borne haute exclue)
double p = alea.nextDouble();        // un réel dans l'intervalle 0.0 &lt;= p &lt; 1.0
boolean pile = alea.nextBoolean();   // true ou false : pile ou face</pre>
<div class="warn"><code>nextInt(n)</code> tire entre <strong>0 et n−1</strong> (n exclu !). Pour un intervalle [min..max] : <code>min + alea.nextInt(max - min + 1)</code>. Le « ±1 » des tableaux frappe encore : le <code>+1</code> compte les deux bornes.</div>

<h3>2. Le motif « tirage dans une liste »</h3>
<pre class="pseudo">ArrayList&lt;String&gt; prenoms = /* ... */;
String gagnant = prenoms.get(alea.nextInt(prenoms.size()));   // nextInt(size) = indice valide → tirage au sort</pre>
<p><code>nextInt(prenoms.size())</code> ne peut jamais dépasser le dernier indice, puisque la borne haute (size) est exclue.</p>

<h3>3. Rappels Math + les manquants</h3>
<pre class="pseudo">Math.max(a, b) · Math.min(a, b) · Math.abs(x)        // plus grand, plus petit, valeur absolue
Math.pow(x, n) · Math.sqrt(x) · Math.round(x)        // puissance, racine, arrondi au plus proche
Math.floor(5.9) → 5.0     // arrondi vers le BAS (plancher)
Math.ceil(5.1)  → 6.0     // arrondi vers le HAUT (plafond)
Math.random()   → 0.0..1.0  // un réel aléatoire, sans créer d'objet Random</pre>

<h3>4. Les dates modernes : java.time</h3>
<pre class="pseudo">import java.time.LocalDate;

LocalDate aujourdHui = LocalDate.now();            // la date du jour (ex. 2026-07-03)
LocalDate examen = LocalDate.of(2026, 9, 15);      // une date précise : année, mois, jour
examen.getYear() → 2026 · examen.getMonthValue() → 9 · examen.getDayOfMonth() → 15   // on lit chaque composant
examen.plusDays(7)          // renvoie une NOUVELLE date décalée de 7 jours (immuable, comme String !)
examen.isAfter(aujourdHui)  // true : compare deux dates
examen.getDayOfWeek()       // TUESDAY : le jour de la semaine</pre>

<h3>5. Compter les jours entre deux dates</h3>
<pre class="pseudo">import java.time.temporal.ChronoUnit;
long jours = ChronoUnit.DAYS.between(aujourdHui, examen);   // nombre de jours entre les deux dates (ex. 74)</pre>
<div class="tip"><code>LocalDate</code> est IMMUABLE : <code>d.plusDays(7)</code> ne modifie pas <code>d</code>, il en renvoie une nouvelle — il faut réaffecter (<code>d = d.plusDays(7)</code>), exactement comme les String de la leçon 9. On compare les dates avec des méthodes (<code>isAfter</code>/<code>isBefore</code>), pas avec les opérateurs.</div>

<h3>6. Formater l'affichage : String.format et printf</h3>
<pre class="pseudo">String.format("%.2f", 3.14159)   → "3.14"     // %.2f = 2 décimales
System.out.printf("Prix : %.2f €%n", 19.999); // affiche « Prix : 20.00 € » (%n = saut de ligne)
String.format("%05d", 42)        → "00042"    // %05d = entier complété à 5 chiffres par des zéros</pre>
<p>Le <strong>formatage</strong> contrôle la façon d'afficher une valeur sans changer la valeur elle-même : utile pour des prix (les flottants affichent parfois <code>19.999999</code>) ou des numéros à longueur fixe.</p>`,

ainqueur = 0;\n        int somme = 0;\n        for (int i = 0; i < totaux.length; i++) {\n            somme = somme + totaux[i];\n            if (totaux[i] > totaux[iVainqueur]) {\n                iVainqueur = i;\n            }\n        }\n        double moyenne = Math.round((double) somme / totaux.length * 10) / 10.0;\n\n        System.out.println();\n        System.out.println(\"Vainqueur : \" + ordre[iVainqueur] + \" avec \" + totaux[iVainqueur] + \" points\");\n        System.out.println(\"Moyenne du tournoi : \" + moyenne + \" points\");\n        System.out.println(\"Écart au maximum théorique : \" + (540 - totaux[iVainqueur]) + \" points\");\n    }\n}",

      "solution": "// Le club de course a pied - jour 3 sur 4.\n// Le journal porte enfin une date. On peut donc filtrer une periode, au\n// lieu de tout cumuler depuis la nuit des temps.\nimport java.io.BufferedReader;\nimport java.io.FileReader;\nimport java.io.FileWriter;\nimport java.io.IOException;\nimport java.io.PrintWriter;\nimport java.time.LocalDate;\nimport java.time.temporal.ChronoUnit;\nimport java.util.ArrayList;\nimport java.util.HashMap;\n\npublic class ClubCourse {\n    static final String JOURNAL = \"sorties.csv\";\n\n    static void enregistrer(LocalDate jour, String coureur, String parcours,\n                            double km, int minutes) {\n        try (PrintWriter sortie = new PrintWriter(new FileWriter(JOURNAL, true))) {\n            sortie.println(jour + \";\" + coureur + \";\" + parcours + \";\" + km + \";\" + minutes);\n        } catch (IOException e) {\n            System.out.println(\"Sortie non enregistrée : \" + e.getMessage());\n        }\n    }\n\n    public static void main(String[] args) {\n        enregistrer(LocalDate.of(2026, 4, 26), \"Salomé\", \"Boucle du canal\", 8.2, 44);\n        enregistrer(LocalDate.of(2026, 4, 29), \"Rachid\", \"Côte du moulin\", 12.5, 71);\n        enregistrer(LocalDate.of(2026, 5, 3), \"Salomé\", \"Bois de la Cambre\", 15.0, 82);\n        enregistrer(LocalDate.of(2026, 5, 5), \"Inès\", \"Boucle du canal\", 8.2, 51);\n        enregistrer(LocalDate.of(2026, 5, 10), \"Rachid\", \"Boucle du canal\", 8.2, 39);\n        enregistrer(LocalDate.of(2026, 5, 17), \"Salomé\", \"Côte du moulin\", 12.5, 76);\n        enregistrer(LocalDate.of(2026, 5, 24), \"Inès\", \"Bois de la Cambre\", 15.0, 95);\n        enregistrer(LocalDate.of(2026, 6, 2), \"Rachid\", \"Bois de la Cambre\", 15.0, 74);\n\n        // La periode est declaree, pas devinee. Les deux bornes sont\n        // INCLUSES : on le dit ici, une fois, plutot que de laisser le\n        // lecteur deduire la convention du code.\n        LocalDate debut = LocalDate.of(2026, 5, 1);\n        LocalDate fin = LocalDate.of(2026, 5, 31);\n\n        HashMap<String, Integer> nbSorties = new HashMap<>();\n        HashMap<String, Double> kmParCoureur = new HashMap<>();\n        HashMap<String, Integer> minutesParCoureur = new HashMap<>();\n        int horsPeriode = 0;\n        LocalDate premiere = null;\n        LocalDate derniere = null;\n\n        try (BufferedReader entree = new BufferedReader(new FileReader(JOURNAL))) {\n            String ligne = entree.readLine();\n            while (ligne != null) {\n                String[] c = ligne.split(\";\");\n                LocalDate jour = LocalDate.parse(c[0]);\n                String coureur = c[1];\n                double km = Double.parseDouble(c[3]);\n                int minutes = Integer.parseInt(c[4]);\n\n                // Hors periode : ni avant le debut, ni apres la fin.\n                if (jour.isBefore(debut) || jour.isAfter(fin)) {\n                    horsPeriode = horsPeriode + 1;\n                } else {\n                    nbSorties.put(coureur, nbSorties.getOrDefault(coureur, 0) + 1);\n                    kmParCoureur.put(coureur, kmParCoureur.getOrDefault(coureur, 0.0) + km);\n                    minutesParCoureur.put(coureur, minutesParCoureur.getOrDefault(coureur, 0) + minutes);\n                    if (premiere == null || jour.isBefore(premiere)) {\n                        premiere = jour;\n                    }\n                    if (derniere == null || jour.isAfter(derniere)) {\n                        derniere = jour;\n                    }\n                }\n                ligne = entree.readLine();\n            }\n        } catch (IOException e) {\n            System.out.println(\"Journal illisible : \" + e.getMessage());\n            return;\n        }\n\n        System.out.println(\"Période retenue : du \" + debut + \" au \" + fin + \" (bornes incluses)\");\n        System.out.println(\"Sorties écartées hors période : \" + horsPeriode);\n        if (premiere == null) {\n            System.out.println(\"Aucune sortie dans la période.\");\n            return;\n        }\n        System.out.println(\"Première sortie : \" + premiere + \", dernière : \" + derniere\n                           + \", soit \" + ChronoUnit.DAYS.between(premiere, derniere) + \" jours d'écart\");\n        System.out.println();\n\n        ArrayList<String> coureurs = trier(new ArrayList<>(nbSorties.keySet()));\n        System.out.printf(\"%-8s %8s %9s %12s%n\", \"Coureur\", \"Sorties\", \"Km\", \"Allure\");\n        for (String nom : coureurs) {\n            double km = kmParCoureur.get(nom);\n            double allure = minutesParCoureur.get(nom) / km;\n            System.out.printf(\"%-8s %8d %9.1f %10.2f%n\", nom, nbSorties.get(nom), km, allure);\n        }\n    }\n\n    static ArrayList<String> trier(ArrayList<String> liste) {\n        for (int passe = 0; passe < liste.size() - 1; passe++) {\n            for (int i = 0; i < liste.size() - 1 - passe; i++) {\n                if (liste.get(i).compareTo(liste.get(i + 1)) > 0) {\n                    String t = liste.get(i);\n                    liste.set(i, liste.get(i + 1));\n                    liste.set(i + 1, t);\n                }\n            }\n        }\n        return liste;\n    }\n}",
