<h3>1. Java, c'est quoi ?</h3>
<p>Un <strong>ordinateur</strong> ne comprend pas le français : pour lui donner des ordres, il faut utiliser un <strong>langage de programmation</strong>, c'est-à-dire un ensemble de mots et de règles très précis. <strong>Java</strong> est l'un de ces langages, créé en 1995. On l'utilise pour des applications d'entreprise, des serveurs de sites web, les applications Android… Son slogan : « écrire une fois, exécuter partout ».</p>
<p>On dit que Java est <strong>compilé</strong>. Cela veut dire que le texte que tu écris (le <strong>code source</strong>, rangé dans un fichier <code>.java</code>) doit d'abord être <strong>traduit</strong> par un programme spécial appelé <strong>compilateur</strong> (l'outil <code>javac</code>). Comme un traducteur transforme un livre d'une langue vers une autre, le compilateur transforme ton fichier <code>.java</code> en un fichier <code>.class</code> écrit en <em>bytecode</em> — une langue intermédiaire.</p>
<p>Ce bytecode n'est pas lu directement par le <strong>processeur</strong> (le « cerveau » physique de la machine). Il est exécuté par la <strong>JVM</strong> (<em>Java Virtual Machine</em>, la « machine virtuelle Java ») : un programme qui joue le rôle d'un <strong>adaptateur universel</strong>. Sur Windows, sur Mac ou sur Linux, c'est la JVM installée sur cette machine qui traduit le même bytecode en instructions comprises par cette machine précise. Voilà pourquoi « écrire une fois, exécuter partout ».</p>
<p>Deux autres mots à retenir. <strong>Fortement typé</strong> signifie que chaque donnée (chaque nombre, chaque texte) porte une étiquette appelée <strong>type</strong>, que le compilateur vérifie — pour t'empêcher, par exemple, de mélanger un nombre et un texte par erreur. <strong>Orienté objet</strong> signifie que le code s'organise en <strong>classes</strong> : des sortes de moules qui servent à fabriquer des <strong>objets</strong> (on y reviendra en détail à la leçon 12).</p>
<p>Pour programmer, il te faut le <strong>JDK</strong> (<em>Java Development Kit</em>, la « boîte à outils » qui contient le compilateur <code>javac</code> et la JVM <code>java</code>) et un <strong>éditeur de code</strong> pour taper ton texte (IntelliJ IDEA, Eclipse ou VS Code).</p>

<h3>2. Le programme minimal, ligne par ligne</h3>
<pre class="pseudo">public class Bonjour {                            // déclare une CLASSE nommée Bonjour : en Java, tout code vit dans une classe
    public static void main(String[] args) {     // main = point d'ENTRÉE, la 1re MÉTHODE (bloc d'instructions) exécutée
        System.out.println("Bonjour le monde !"); // affiche le texte entre guillemets + un saut de ligne ; le ; termine l'instruction
    }                                             // accolade fermante : marque la fin de la méthode main
}                                                 // accolade fermante : marque la fin de la classe Bonjour</pre>
<ul>
<li><code>public class Bonjour</code> : tout code Java vit dans une <strong>classe</strong> (un conteneur nommé). Le fichier DOIT s'appeler <code>Bonjour.java</code> (même nom, même casse) — une règle stricte de Java.</li>
<li><code>public static void main(String[] args)</code> : le <strong>point d'entrée</strong>, l'équivalent du DEBUT de ton pseudocode. Une <strong>méthode</strong> est un bloc d'instructions portant un nom ; la JVM cherche exactement cette méthode <code>main</code> pour démarrer. <code>String[] args</code> reçoit les éventuels arguments tapés dans la ligne de commande.</li>
<li><code>System.out.println(...)</code> : ton <code>Écrire(...)</code> en Java. <code>System.out</code> désigne la <strong>sortie standard</strong> (l'écran, la fenêtre où le texte s'affiche) et <code>println</code> veut dire « imprimer une ligne ».</li>
<li>Chaque instruction se termine par un <strong>point-virgule</strong> <code>;</code> (comme le point à la fin d'une phrase).</li>
<li>Les blocs sont délimités par des <strong>accolades</strong> <code>{ }</code> (fini les FINSI/FINPOUR : c'est l'accolade fermante qui clôt le bloc).</li>
</ul>

<h3>3. Compiler puis exécuter (deux étapes en Java)</h3>
<pre class="pseudo">javac Bonjour.java     # le COMPILATEUR (javac) lit ton .java et produit le fichier Bonjour.class (le bytecode)
java Bonjour           # la JVM (java) exécute ce bytecode → affiche « Bonjour le monde ! » (noter : sans le .class)</pre>
<p>Contrairement à un langage interprété comme PHP, Java demande cette étape de compilation. Si le code contient une faute de grammaire, <code>javac</code> refuse de travailler et rien ne s'exécute. Petit piège utile : à la 2e ligne on écrit <code>java Bonjour</code> (le nom de la classe), <strong>sans</strong> l'extension <code>.class</code>.</p>

<h3>4. print, println et commentaires</h3>
<pre class="pseudo">System.out.println("A");  // affiche A PUIS passe à la ligne suivante (ln = line, « ligne » en anglais)
System.out.print("B");    // affiche B mais NE passe PAS à la ligne : le curseur reste juste après le B
// ceci est un commentaire d'une ligne : ignoré par le compilateur, il ne s'exécute jamais
/* ceci est un commentaire
   sur plusieurs lignes : tout ce qui est entre les marqueurs est ignoré */</pre>
<p>Deux <code>print</code> à la suite collent leurs textes sur la même ligne ; <code>println</code> ajoute un retour à la ligne à la fin. Un <strong>commentaire</strong> est du texte destiné à l'humain : le compilateur l'ignore complètement, il sert seulement à expliquer le code.</p>

<h3>5. La table de traduction (à compléter tout le cours)</h3>
<pre class="pseudo">PSEUDOCODE                 JAVA
ALGORITHME X / DEBUT       public class X { public static void main...   // le squelette de départ du programme
Écrire(x)                  System.out.println(x);                        // afficher une valeur à l'écran
fin de bloc (FINSI...)     }                                             // l'accolade fermante clôt le bloc
commentaire //             //                                            // même symbole qu'en pseudocode</pre>
<div class="warn">Java est sensible à la casse (majuscules ≠ minuscules) : <code>System</code> avec un S majuscule, <code>main</code> tout en minuscules, <code>Println</code> ≠ <code>println</code>. 90 % des premières erreurs viennent de là (et des <code>;</code> oubliés).</div>
<div class="tip">Une erreur de COMPILATION (javac râle) = une faute de grammaire, repérée AVANT l'exécution. Une erreur d'EXÉCUTION (le programme plante pendant qu'il tourne) = une logique fausse. Apprends à lire les messages : ils indiquent la ligne exacte du problème.</div>`,
