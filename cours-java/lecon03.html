<h3>1. Les opérateurs arithmétiques</h3>
<p>Un <strong>opérateur</strong> est un symbole qui effectue une opération sur des valeurs. Les valeurs sur lesquelles il agit s'appellent les <strong>opérandes</strong>. Par exemple, dans <code>3 + 5</code>, le <code>+</code> est l'opérateur et <code>3</code> et <code>5</code> sont les deux opérandes.</p>
<pre class="pseudo">PSEUDOCODE    JAVA     EXEMPLE
+ - *         + - *    identiques                  // addition, soustraction, multiplication
DIV (entier)  /        17 / 5   → 3   ← ATTENTION ! // entre deux int, / est une division ENTIÈRE
MOD           %        17 % 5   → 2                // modulo : le RESTE de la division</pre>
<div class="warn">LE piège Java n°1 : <code>/</code> entre deux int fait une division ENTIÈRE. <code>7 / 2</code> vaut <strong>3</strong>, pas 3.5, car le résultat d'une opération entre deux entiers est lui-même un entier ! Pour un résultat réel, il faut qu'au moins un opérande soit un double : <code>7.0 / 2</code> → 3.5.</div>
<p>Le <strong>modulo</strong> <code>%</code> donne le reste d'une division : <code>17 % 5 = 2</code> car 17 = 5×3 + 2 (il reste 2). C'est l'outil idéal pour tester la parité d'un nombre (<code>n % 2 == 0</code> veut dire « n est pair ») ou la divisibilité.</p>

<h3>2. Le cast : conversion explicite</h3>
<p>Un <strong>cast</strong>, c'est une conversion <strong>forcée</strong> d'un type vers un autre : tu écris le type voulu entre parenthèses juste devant la valeur, comme une étiquette « transforme-moi en ceci ».</p>
<pre class="pseudo">double d = 5.9;
int n = (int) d;         // (int) CONVERTIT en entier en TRONQUANT (coupe la virgule, sans arrondir) → n vaut 5, pas 6
int a = 7, b = 2;        // deux entiers déclarés sur la même ligne
double m = (double) a / b;   // on caste a en double AVANT de diviser → division réelle → m vaut 3.5</pre>
<p>Attention : le cast <strong>tronque</strong> (il coupe la partie après la virgule), il n'arrondit pas. Et la position compte : dans <code>(double) a / b</code>, convertir <code>a</code> d'abord « contamine » toute la division, qui devient réelle.</p>

<h3>3. Raccourcis d'affectation</h3>
<pre class="pseudo">n = n + 1;    ⇔  n += 1;   ⇔  n++;      // trois écritures équivalentes pour « ajouter 1 » (le motif compteur)
n = n - 1;    ⇔  n -= 1;   ⇔  n--;      // idem pour retirer 1
total = total + prix;   ⇔   total += prix;   // += ajoute au total : le motif accumulateur</pre>

<h3>4. Comparaisons : produire un boolean</h3>
<pre class="pseudo">PSEUDOCODE    JAVA
=             ==        // DEUX signes égal : teste l'ÉGALITÉ (à ne pas confondre avec = qui affecte)
≠             !=        // différent de
&lt; &gt; &lt;= &gt;=     identiques  // inférieur, supérieur, inférieur ou égal, supérieur ou égal</pre>
<p>Chaque comparaison produit un <code>boolean</code> (soit <code>true</code>, soit <code>false</code>), qu'on utilisera ensuite dans les conditions (leçon 5).</p>

<h3>5. Les opérateurs logiques</h3>
<p>Les <strong>opérateurs logiques</strong> combinent plusieurs conditions vraies/fausses en une seule réponse vraie/fausse.</p>
<pre class="pseudo">PSEUDOCODE    JAVA
ET            &amp;&amp;        // vrai seulement si les DEUX conditions sont vraies
OU            ||        // vrai si AU MOINS une condition est vraie
NON           !         // inverse : !true = false, !false = true</pre>
<pre class="pseudo">boolean ok = (age &gt;= 18) &amp;&amp; aPermis;         // vrai si majeur ET titulaire du permis
boolean gratuit = (age &lt; 6) || (age &gt;= 65);  // vrai si très jeune OU senior
boolean ferme = !ouvert;                     // ferme = l'inverse de ouvert</pre>

<h3>6. La classe Math : ta calculatrice intégrée</h3>
<p><code>Math</code> est une <strong>classe outil</strong> fournie avec Java : une boîte remplie de fonctions mathématiques toutes prêtes. On les appelle en écrivant <code>Math.</code> suivi du nom de la fonction.</p>
<pre class="pseudo">Math.abs(-5)        → 5        // valeur absolue (le nombre sans son signe)
Math.max(3, 8)      → 8        // le plus grand des deux
Math.min(3, 8)      → 3        // le plus petit des deux
Math.pow(2, 10)     → 1024.0   // puissance : 2 exposant 10 (retourne toujours un double)
Math.sqrt(16)       → 4.0      // racine carrée
Math.round(5.7)     → 6        // VRAI arrondi au plus proche (≠ cast qui tronque)</pre>
<p>Retiens la différence entre <code>Math.round(5.7)</code> = 6 (arrondi) et <code>(int) 5.7</code> = 5 (troncature) : deux résultats différents pour la même valeur de départ.</p>

<h3>7. Priorités des opérateurs</h3>
<p>Comme en mathématiques, certains opérateurs passent avant d'autres : <code>* / %</code> avant <code>+ -</code>, puis les comparaisons, puis <code>&amp;&amp;</code> avant <code>||</code>. Dans le doute, mets des parenthèses : elles ne coûtent rien et clarifient l'intention.</p>
<h3>Aller plus loin — pré-incrément (++i) et post-incrément (i++)</h3>
<p>Les deux écritures ajoutent 1 à la variable ; la différence n'apparaît que lorsqu'on <strong>lit la valeur au moment même</strong> de l'incrémentation. La formule à retenir : <code>i++</code> « donne sa valeur, PUIS grandit » ; <code>++i</code> « grandit, PUIS donne sa valeur ».</p>
<pre class="pseudo">int a = 5;        // a vaut 5
int b = a++;      // POST-increment : b prend l'ANCIENNE valeur -> b = 5, et ENSUITE a passe a 6
int c = 5;        // c vaut 5
int d = ++c;      // PRE-increment : c passe d'abord a 6, PUIS d prend la NOUVELLE valeur -> d = 6</pre>
<p>Dans une boucle <code>for (i = 0; i &lt; 5; i++)</code>, on ne lit pas le résultat de <code>i++</code> : on veut seulement « ajouter 1 ». C'est pourquoi <code>i++</code> et <code>++i</code> y donnent exactement la même boucle et sont interchangeables.</p>
<h3>Inverser une condition proprement — les lois de De Morgan</h3>
<p>Pour obtenir le CONTRAIRE d'une condition composée, on ne peut pas juste coller un <code>!</code> devant sans réfléchir. Les <strong>lois de De Morgan</strong> disent comment le NON « rentre » dans la parenthèse : il inverse chaque morceau ET échange <code>&amp;&amp;</code> (ET) avec <code>||</code> (OU).</p>
<pre class="pseudo">!(a &amp;&amp; b)      // NON (A ET B)...
  =  !a || !b     // ...devient (NON A) OU (NON B)
!(a || b)      // NON (A OU B)...
  =  !a &amp;&amp; !b     // ...devient (NON A) ET (NON B)</pre>
<p>Exemple : l'inverse de « la note est valide » <code>note &gt;= 0 &amp;&amp; note &lt;= 20</code> n'est PAS <code>note &gt;= 0 || note &lt;= 20</code>, mais <code>note &lt; 0 || note &gt; 20</code> (« en dessous de 0 OU au-dessus de 20 »). Chaque comparaison s'inverse, et le ET devient OU.</p>`,
