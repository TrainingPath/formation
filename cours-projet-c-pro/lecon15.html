<script>
var DAY = {
  num: 15,
  title: "Recherche, pagination et qualité (lint, sanitizers)",
  subtitle: "Fonctions de catalogue + analyse statique : une troisième maille dans le filet qualité.",
  theory: `
<h3>1. Recherche paginée (rappel)</h3>
<p>La <strong>pagination</strong> consiste à afficher les résultats par petits paquets (des « pages »), comme un moteur de recherche, plutôt que tout d'un coup. En SQL : <code>LIKE</code> cherche un motif dans un texte, <code>CONCAT</code> assemble des morceaux de texte, <code>%</code> signifie « n'importe quoi » (donc <code>%mot%</code> = « contient mot »), <code>ORDER BY</code> trie, <code>LIMIT</code> fixe le nombre de lignes par page et <code>OFFSET</code> le point de départ (combien de lignes sauter).</p>
<pre class="pseudo">SELECT id,nom FROM jeu WHERE nom LIKE CONCAT('%', ?, '%')   -- prend l'id et le nom des jeux dont le nom CONTIENT le mot recherché (le ? sera branché de façon sûre)
ORDER BY nom LIMIT ? OFFSET ?;      -- trie par nom ; LIMIT ? = nombre par page, OFFSET ? = combien sauter (paramètres liés, pagination côté base)</pre>

<h3>2. L'analyse statique (lint)</h3>
<p>Un <strong>linter</strong> lit le code <strong>sans l'exécuter</strong> et repère des défauts : fuites potentielles, comparaisons douteuses, variables non initialisées, tampons risqués. En C : <code>cppcheck</code> ou <code>clang-tidy</code>.</p>
<pre class="pseudo">cppcheck --enable=warning,performance --error-exitcode=1 src/   # analyse (sans exécuter) tout le dossier src/ ; --enable choisit les catégories de défauts ; --error-exitcode=1 fait échouer la CI si un défaut est trouvé</pre>
<div class="warn">Le lint voit des choses que les tests ne voient pas : un chemin d'erreur jamais exécuté peut quand même contenir une fuite, que <code>cppcheck</code> signalera à la lecture. <code>--error-exitcode=1</code> fait échouer la CI sur un défaut.</p></div>

<h3>3. Trois mailles complémentaires</h3>
<pre class="pseudo">Tests        : le code fait-il ce qu'on attend ?      (comportement)
Sanitizers   : accès mémoire / comportements indéfinis ? (exécution)
Lint         : motifs douteux, sans exécuter          (lecture statique)</pre>
<p>Chaque outil attrape une classe de bugs différente. Ensemble, ils forment un filet serré, exécuté à chaque push.</p>

<h3>4. Un pipeline qualité complet</h3>
<pre class="pseudo"># ci.yml
  quality:                         # job "qualité" qui cumule plusieurs contrôles
    steps:                         # ses étapes
      - run: sudo apt-get install -y cppcheck   # installe le linter cppcheck
      - run: cppcheck --enable=warning --error-exitcode=1 src/   # analyse statique de src/ ; échoue si un défaut est trouvé
      - run: gcc -g -fsanitize=address,undefined tests.c ... -o t &amp;&amp; ./t   # compile avec les sanitizers mémoire, PUIS exécute les tests</pre>
<div class="tip">On ne choisit pas <em>entre</em> tests, sanitizers et lint : on les cumule. Chacun est rapide, automatique, et refuse la fusion s'il échoue. La qualité devient un ensemble de portes que le code doit franchir.</div>`,
  exercises: [
    { type: "qcm", q: "Un linter analyse le code…", opts: ["en l'exécutant", "sans l'exécuter (statiquement)", "en prod", "à la main"], a: 1, exp: "Lecture statique." },
    { type: "qcm", q: "Un linter C courant :", opts: ["gets", "cppcheck (ou clang-tidy)", "make", "docker"], a: 1, exp: "Analyse statique." },
    { type: "qcm", q: "--error-exitcode=1 fait…", opts: ["compiler", "échouer la CI si un défaut est trouvé", "déployer", "chiffrer"], a: 1, exp: "Porte de qualité." },
    { type: "qcm", q: "Le lint repère notamment…", opts: ["la vitesse réseau", "fuites potentielles, comparaisons douteuses, variables non initialisées", "les rôles", "les secrets"], a: 1, exp: "Défauts de code." },
    { type: "qcm", q: "Les tests vérifient surtout…", opts: ["la mémoire", "le comportement (bon résultat)", "les motifs de code", "le réseau"], a: 1, exp: "Ce que le code fait." },
    { type: "qcm", q: "Les sanitizers vérifient…", opts: ["le comportement métier", "les accès mémoire et comportements indéfinis à l'exécution", "le style", "la CI"], a: 1, exp: "Exécution instrumentée." },
    { type: "qcm", q: "Tests, sanitizers et lint sont…", opts: ["interchangeables", "complémentaires (classes de bugs différentes)", "redondants", "inutiles"], a: 1, exp: "Filet serré." },
    { type: "qcm", q: "Un chemin d'erreur jamais exécuté peut…", opts: ["être ignoré", "contenir une fuite que le lint verra à la lecture", "être testé sans le vouloir", "chiffrer"], a: 1, exp: "Le lint lit tout le code." },
    { type: "qcm", q: "La recherche paginée utilise…", opts: ["la concaténation", "des paramètres liés + LIMIT/OFFSET", "un fichier", "gets"], a: 1, exp: "Sûr et efficace." },
    { type: "qcm", q: "Choisit-on entre tests, sanitizers et lint ?", opts: ["oui, un seul", "non : on les cumule", "aucun", "seulement le lint"], a: 1, exp: "Tous ensemble." },
    { type: "vf", q: "Le lint peut trouver des défauts que les tests ne révèlent pas.", a: true, exp: "Il lit le code, y compris les chemins non exécutés." },
    { type: "qcm", q: "clang-tidy est…", opts: ["un compilateur", "un outil d'analyse statique (lint)", "une base", "un secret"], a: 1, exp: "Alternative à cppcheck." },
    { type: "qcm", q: "La qualité devient…", opts: ["une étape finale", "un ensemble de portes que le code doit franchir", "optionnelle", "un secret"], a: 1, exp: "Contrôles cumulés." },
    { type: "qcm", q: "Le job quality s'exécute…", opts: ["une fois par an", "à chaque push", "en prod", "jamais"], a: 1, exp: "Automatique." },
    { type: "qcm", q: "cppcheck --enable=warning signale…", opts: ["seulement des erreurs de compilation", "des avertissements de qualité/performance", "des secrets", "des rôles"], a: 1, exp: "Défauts à corriger." }
  ],
  final: {
    title: "Exercice final — Compléter le filet qualité",
    intro: `<p>Une équipe a des tests, mais des fuites mémoire et des comparaisons douteuses passent. Que manque-t-il ?</p>`,
    questions: [
      { type: "qcm", q: "Pour les fuites/accès mémoire à l'exécution :", opts: ["rien", "un job sanitizer (-fsanitize=address)", "un log", "un secret"], a: 1, exp: "ASan." },
      { type: "qcm", q: "Pour les motifs douteux sans exécuter :", opts: ["rien", "un job de lint (cppcheck)", "un déploiement", "un scan d'image"], a: 1, exp: "Analyse statique." },
      { type: "qcm", q: "Ces contrôles s'exécutent…", opts: ["à la main parfois", "automatiquement en CI, à chaque push", "en prod", "jamais"], a: 1, exp: "Portes automatiques." },
      { type: "qcm", q: "Un échec de lint doit…", opts: ["être ignoré", "bloquer la fusion (--error-exitcode=1)", "déployer", "chiffrer"], a: 1, exp: "Condition de fusion." },
      { type: "qcm", q: "Le principe :", opts: ["choisir un seul outil", "cumuler tests + sanitizers + lint", "supprimer les tests", "faire confiance au relecteur seul"], a: 1, exp: "Filet complet." }
    ],
    solution: `<pre class="pseudo"># ci.yml : trois mailles
  test:     { run: make test }                                   # comportement
  asan:     { run: "gcc -g -fsanitize=address,undefined ... && ./t" }  # mémoire/UB
  lint:                                                          # 3e maille : analyse statique
    steps:                                                       # étapes du job lint
      - run: sudo apt-get install -y cppcheck                    # installe le linter
      - run: cppcheck --enable=warning,performance --error-exitcode=1 src/   # analyse src/ ; échoue sur tout défaut

# Branch protection : test + asan + lint doivent être verts pour fusionner.</pre>
<p>Trois outils, trois classes de bugs, trois portes à franchir. Le filet est complet. Demain : les espaces client, vendeur et administrateur.</p>`
  }
};
</script>
