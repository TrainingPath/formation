<script>
var DAY = {
  num: 16,
  title: "Les espaces client, vendeur et administrateur",
  subtitle: "Les menus par rôle, avec la sécurité en profondeur : menu + service + anti-IDOR.",
  theory: `
<h3>1. Menus par rôle (rappel) + sécurité renforcée</h3>
<p>Comme au Niveau 6, l'affichage s'adapte au rôle : chaque profil voit son propre menu (« espace »). Ici, on assume pleinement la <strong>défense en profondeur</strong> : empiler plusieurs contrôles indépendants, de sorte que si l'un cède, les autres protègent encore (comme un château avec ses douves, ses remparts ET ses gardes). Conséquence : le contrôle réel de sécurité n'est jamais dans l'affichage — cacher un bouton ne protège pas, cela évite juste d'encombrer l'écran.</p>

<h3>2. Les quatre gardes qui se cumulent</h3>
<pre class="pseudo">1. Menu filtré      : le client ne VOIT pas « Statistiques »   (confort)
2. Routage gardé    : le choix 8 vérifie le rôle avant d'agir  (barrière 1)
3. Service contrôlé : le service refuse si rôle insuffisant    (barrière 2)
4. Anti-IDOR        : la ressource doit appartenir à l'utilisateur (barrière 3)</pre>
<div class="warn">Aucune de ces couches n'est superflue : si l'une est contournée (menu deviné, routage buggé), les suivantes tiennent. C'est la <strong>défense en profondeur</strong> — on ne mise jamais tout sur un seul contrôle.</p></div>

<h3>3. Le même binaire, tous les rôles</h3>
<pre class="pseudo">void afficher_menu(const Utilisateur *u) {                     // affiche le menu adapté à l'utilisateur u
    printf("=== Espace %s ===\\n", role_libelle(u->role));     // titre : %s reçoit le libellé du rôle (Client/Vendeur/Admin) ; \n = retour à la ligne
    printf("1) Catalogue 2) Louer 3) Acheter 4) Mes locations\\n");  // options communes à tous les rôles
    if (peut_gerer_stock(u))  printf("5) Reappro 6) Ventes\\n");   // options en plus SI l'utilisateur peut gérer le stock (vendeur/admin)
    if (peut_administrer(u))  printf("7) Comptes 8) Stats\\n");    // options en plus SI l'utilisateur est administrateur
}</pre>

<h3>4. Tester la sécurité des espaces</h3>
<pre class="pseudo">// un client ne doit pas accéder à l'espace admin
CHECK(service_statistiques(&amp;client, c) == ERR_DROIT);       // appelé par un client → doit être refusé (ERR_DROIT)
// un vendeur ne gère pas les comptes
CHECK(service_supprimer_compte(&amp;vendeur, c, 3) == ERR_DROIT); // un vendeur ne peut pas supprimer le compte n°3 → refus attendu</pre>
<div class="tip">On écrit des tests de <strong>refus</strong> pour chaque frontière d'espace : la CI prouve qu'un rôle ne franchit pas les limites du sien. La sécurité des rôles n'est pas une promesse, c'est un test qui passe.</div>`,
  exercises: [
    { type: "qcm", q: "L'affichage du menu dépend…", opts: ["de l'adresse IP", "du rôle de l'utilisateur", "de l'ordre de connexion", "de la taille de l'écran"], a: 1, exp: "Espaces différents." },
    { type: "qcm", q: "Le contrôle réel de sécurité est…", opts: ["dans l'affichage", "dans le service (et l'anti-IDOR)", "dans le menu seul", "dans le libellé du bouton"], a: 1, exp: "Jamais l'UI seule." },
    { type: "qcm", q: "Combien de gardes se cumulent ?", opts: ["un", "quatre (menu, routage, service, anti-IDOR)", "trois", "deux"], a: 1, exp: "Défense en profondeur." },
    { type: "qcm", q: "Le menu filtré relève de…", opts: ["la sécurité seule", "le confort (UX)", "l'authentification", "le chiffrement"], a: 1, exp: "Barrière = service." },
    { type: "qcm", q: "Si le menu est contourné…", opts: ["tout est perdu", "le routage et le service tiennent encore", "l'accès admin est ouvert", "plus aucune barrière"], a: 1, exp: "Couches redondantes." },
    { type: "qcm", q: "Le même binaire sert…", opts: ["un seul rôle", "les trois profils", "trois programmes", "deux rôles seulement"], a: 1, exp: "Rôle module l'affichage." },
    { type: "qcm", q: "Un test de refus prouve que…", opts: ["le succès marche", "un rôle ne franchit pas ses limites", "que le menu s'affiche bien", "que la connexion réussit"], a: 1, exp: "Sécurité vérifiée." },
    { type: "qcm", q: "service_statistiques(&client, c) doit renvoyer…", opts: ["OK", "ERR_DROIT", "les stats", "ERR_STOCK"], a: 1, exp: "Client non autorisé." },
    { type: "qcm", q: "L'anti-IDOR ajoute une barrière au niveau…", opts: ["du menu", "de la ressource (propriété)", "du rôle seul", "de l'affichage"], a: 1, exp: "Contrôle par ressource." },
    { type: "qcm", q: "La sécurité des rôles est…", opts: ["une promesse", "un test qui passe en CI", "un simple commentaire", "un réglage du menu"], a: 1, exp: "Vérifiable." },
    { type: "vf", q: "Cacher une option suffit à empêcher un accès non autorisé.", a: false, exp: "Faux : le service reste la barrière ; le menu est du confort." },
    { type: "qcm", q: "peut_administrer conditionne l'accès à…", opts: ["au catalogue", "aux comptes et statistiques", "à louer", "au réapprovisionnement"], a: 1, exp: "Réservé admin." },
    { type: "qcm", q: "La défense en profondeur signifie…", opts: ["un seul contrôle fort", "plusieurs contrôles indépendants", "se fier au menu", "cacher le code"], a: 1, exp: "Redondance volontaire." },
    { type: "qcm", q: "Les tests de refus couvrent…", opts: ["le cas nominal", "chaque frontière d'espace (rôle interdit)", "les performances", "l'affichage du menu"], a: 1, exp: "Toutes les limites." },
    { type: "qcm", q: "Un vendeur supprimant un compte doit obtenir…", opts: ["OK", "ERR_DROIT", "la suppression", "ERR_STOCK"], a: 1, exp: "Réservé admin." }
  ],
  final: {
    title: "Exercice final — Prouver l'étanchéité des espaces",
    intro: `<p>On veut garantir qu'un client ne peut pas agir en admin. Comment le prouver durablement ?</p>`,
    questions: [
      { type: "qcm", q: "Le meilleur moyen de garantie :", opts: ["une note dans le wiki", "des tests de refus en CI", "cacher le menu", "une relecture manuelle"], a: 1, exp: "Vérifiable automatiquement." },
      { type: "qcm", q: "Un test type :", opts: ["service admin appelé par un client → OK", "service admin appelé par un client → ERR_DROIT", "service client appelé par un vendeur → OK", "service admin appelé par un admin → OK"], a: 1, exp: "Refus attendu." },
      { type: "qcm", q: "Où se trouve la vraie barrière ?", opts: ["le menu", "le contrôle dans le service", "le message d'accueil", "l'affichage"], a: 1, exp: "Service." },
      { type: "qcm", q: "Combien de couches idéalement ?", opts: ["une", "plusieurs (menu, routage, service, anti-IDOR)", "deux suffisent toujours", "le plus possible, sans limite"], a: 1, exp: "Défense en profondeur." },
      { type: "qcm", q: "Ces tests s'exécutent…", opts: ["avant chaque release", "à chaque push (CI)", "au déploiement seulement", "une fois par mois"], a: 1, exp: "Garantie continue." }
    ],
    solution: `<pre class="pseudo">/* tests de refus, exécutés en CI */
Utilisateur client  = { .id=1, .role=CLIENT };                // un utilisateur de rôle CLIENT (id 1)
Utilisateur vendeur = { .id=2, .role=VENDEUR };               // un utilisateur de rôle VENDEUR (id 2)

CHECK(service_statistiques(&amp;client, c)          == ERR_DROIT);  // un client ne voit pas les statistiques → refus
CHECK(service_supprimer_compte(&amp;vendeur, c, 9)  == ERR_DROIT);  // un vendeur ne supprime pas de compte → refus
CHECK(service_reappro(&amp;client, c, 1, 5)         == ERR_DROIT);  // un client ne réapprovisionne pas le stock → refus

/* + anti-IDOR : un client ne touche pas la ressource d'un autre */
CHECK(service_annuler_location(&amp;client, c, LOC_D_UN_AUTRE) == ERR_DROIT);  // annuler la location d'autrui → refus (contrôle de propriété)</pre>
<p>Chaque frontière d'espace est prouvée par un test de refus, rejoué à chaque push. L'étanchéité des rôles est garantie, pas espérée. Demain : l'image de production.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  "placeholder": "Écris tes tests ici…",
  "items": [
    {
      "id": "projcpro-l16",
      "title": "Tests de refus par rôle",
      "level": 3,
      "statement": "Écris trois assertions CHECK qui prouvent que : (1) un client ne peut pas réapprovisionner (ERR_DROIT), (2) un vendeur ne peut pas supprimer un compte (ERR_DROIT), (3) un admin le peut (OK ou ERR_DB selon la base). Prépare les Utilisateur nécessaires.",
      "hints": [
        "Crée client (CLIENT), vendeur (VENDEUR), admin (ADMIN).",
        "CHECK(service_reappro(&client, ...) == ERR_DROIT);",
        "Pour l'admin, le résultat autorisé est OK (ou ERR_DB si la base refuse)."
      ],
      "solution": "Utilisateur client  = { .id = 1, .role = CLIENT };    // un utilisateur de role CLIENT\nUtilisateur vendeur = { .id = 2, .role = VENDEUR };   // un utilisateur de role VENDEUR\nUtilisateur admin   = { .id = 3, .role = ADMIN };     // un utilisateur de role ADMIN\n\n// 1) client ne reapprovisionne pas\nCHECK(service_reappro(&client, c, 1, 5) == ERR_DROIT);   // refus attendu\n// 2) vendeur ne supprime pas de compte\nCHECK(service_supprimer_compte(&vendeur, c, 9) == ERR_DROIT);   // refus attendu\n// 3) admin autorise (OK, ou ERR_DB si la base refuse l'operation)\nCode r = service_supprimer_compte(&admin, c, 9);   // l'admin tente la suppression\nCHECK(r == OK || r == ERR_DB);   // pas ERR_DROIT : l'admin a le droit",
      "note": "Ces tests prouvent l'étanchéité des espaces : les rôles insuffisants sont refusés (ERR_DROIT), le rôle autorisé passe le contrôle d'accès. Rejoués en CI, ils transforment la sécurité en garantie continue.",
      "atoi": {
        "cmd": "make test",
        "expected": "Le harnais rejoue les trois CHECK : client -> ERR_DROIT, vendeur -> ERR_DROIT, admin -> OK/ERR_DB.\nSortie type : « tests OK ». Un rôle qui passerait alors qu'il devrait être refusé ferait échouer make test."
      },
      "checklist": [
        "As-tu préparé un Utilisateur pour chaque rôle testé (client, vendeur, admin) ?",
        "Les rôles insuffisants renvoient-ils bien ERR_DROIT (et non un autre code) ?",
        "Pour l'admin, acceptes-tu OK OU ERR_DB (le droit passe, seule la base peut encore refuser) ?"
      ]
    }
  ]
};
</script>
