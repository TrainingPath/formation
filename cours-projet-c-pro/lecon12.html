<script>
var DAY = {
  num: 12,
  title: "Acheter un jeu : prix figé et couverture",
  subtitle: "L'achat transactionnel, et la mesure de couverture pour repérer le code non testé.",
  theory: `
<h3>1. L'achat, transactionnel et à prix figé (rappel)</h3>
<p>Acheter diminue <code>stock_vente</code> et enregistre une vente au <strong>prix figé</strong> : on mémorise le prix réellement payé ce jour-là, pour qu'une hausse de tarif plus tard ne réécrive pas l'historique (comme un ticket de caisse, dont le montant imprimé ne change plus). Le tout dans une transaction (tout ou rien). Même schéma que la location, avec des colonnes différentes.</p>

<h3>2. La couverture de test</h3>
<p>La <strong>couverture</strong> mesure quelles lignes de code les tests exécutent réellement. Elle révèle les zones jamais testées — souvent les <em>branches</em> d'erreur (une <strong>branche</strong> est un chemin possible du code, par exemple le « sinon » d'un <code>if</code> : stock nul, échec base). Pour la mesurer, on <strong>instrumente</strong> le programme (on y ajoute des compteurs invisibles) avec l'outil <code>gcov</code> ; <code>gcovr</code> en fait un rapport synthétique.</p>
<pre class="pseudo">gcc --coverage -Wall tests.c services.c -o tests $(mysql_config --libs)   # compile en "instrumentant" le code (--coverage compte les lignes exécutées) ; -Wall active les avertissements ; $(mysql_config --libs) ajoute les bibliothèques MySQL
./tests                  # exécute le programme de tests (ce qui enregistre les lignes réellement parcourues)
gcov services.c          # affiche le % de lignes couvertes de services.c, ligne par ligne</pre>

<h3>3. Viser les chemins critiques, pas 100 %</h3>
<div class="warn">L'objectif n'est pas <strong>100 %</strong> à tout prix (on écrirait des tests inutiles), mais de couvrir les <strong>chemins critiques</strong> : le cas nominal <em>et</em> les cas d'échec. Pour <code>service_acheter</code> : succès, stock nul (<code>ERR_STOCK</code>), échec base (<code>ROLLBACK</code>).</p></div>

<h3>4. La couverture en CI</h3>
<pre class="pseudo"># on peut publier un rapport ou fixer un seuil minimal
gcovr --fail-under-line 70 ...   # échoue si &lt; 70 % de lignes couvertes</pre>
<div class="tip">Un seuil de couverture évite les régressions de qualité (« on a ajouté du code sans le tester »). Mais la couverture mesure la <em>quantité</em> de code exécuté, pas la <em>qualité</em> des assertions : un bon test vérifie le bon résultat, pas seulement que la ligne tourne.</div>`,
  exercises: [
    { type: "qcm", q: "Acheter enregistre le prix…", opts: ["recalculé plus tard", "figé au moment de l'achat", "toujours nul", "de location"], a: 1, exp: "Historique fidèle." },
    { type: "qcm", q: "La couverture mesure…", opts: ["la vitesse", "quelles lignes les tests exécutent réellement", "la mémoire", "le rôle"], a: 1, exp: "Code testé vs non testé." },
    { type: "qcm", q: "Quelles zones sont souvent non couvertes ?", opts: ["le cas nominal", "les branches d'erreur (stock nul, échec base)", "les commentaires", "le main"], a: 1, exp: "Les chemins d'échec." },
    { type: "qcm", q: "Quel flag gcc instrumente la couverture ?", opts: ["-Wall", "--coverage", "-O2", "-lm"], a: 1, exp: "Puis gcov/gcovr." },
    { type: "qcm", q: "Faut-il viser 100 % de couverture ?", opts: ["oui, toujours", "non : couvrir les chemins critiques (nominal + échecs)", "0 % suffit", "peu importe"], a: 1, exp: "Qualité, pas quantité brute." },
    { type: "qcm", q: "Pour service_acheter, un chemin d'échec à couvrir :", opts: ["aucun", "stock nul → ERR_STOCK", "l'affichage", "le login"], a: 1, exp: "Cas de refus." },
    { type: "qcm", q: "gcovr --fail-under-line 70 fait…", opts: ["compiler", "échouer la CI si la couverture < 70 %", "déployer", "chiffrer"], a: 1, exp: "Seuil minimal." },
    { type: "qcm", q: "La couverture mesure la quantité, pas…", opts: ["la vitesse", "la qualité des assertions", "le nombre de fichiers", "les rôles"], a: 1, exp: "Une ligne tournée ≠ bien vérifiée." },
    { type: "qcm", q: "Un bon test vérifie…", opts: ["que la ligne tourne", "le bon résultat attendu", "la couleur", "le runner"], a: 1, exp: "Assertion pertinente." },
    { type: "qcm", q: "Le prix figé protège…", opts: ["la vitesse", "l'exactitude de l'historique si le tarif change", "le réseau", "le rôle"], a: 1, exp: "Comptabilité fidèle." },
    { type: "vf", q: "Atteindre 100 % de couverture garantit l'absence de bugs.", a: false, exp: "Faux : la couverture ne juge pas la qualité des assertions." },
    { type: "qcm", q: "Un seuil de couverture évite…", opts: ["les tests", "d'ajouter du code sans le tester", "les commits", "les rôles"], a: 1, exp: "Anti-régression qualité." },
    { type: "qcm", q: "gcov produit…", opts: ["un binaire", "un rapport ligne par ligne des lignes couvertes", "un secret", "une image"], a: 1, exp: "Détail de couverture." },
    { type: "qcm", q: "Acheter et louer partagent…", opts: ["rien", "le même schéma transactionnel", "le même stock", "le même prix"], a: 1, exp: "Colonnes différentes, patron identique." },
    { type: "qcm", q: "La couverture se mesure sur…", opts: ["la prod", "l'exécution des tests (instrumentés)", "le déploiement", "les logs"], a: 1, exp: "Tests + --coverage." }
  ],
  final: {
    title: "Exercice final — Couvrir les chemins d'achat",
    intro: `<p>service_acheter a trois issues : succès, stock nul, échec base. On veut une bonne couverture.</p>`,
    questions: [
      { type: "qcm", q: "Combien de chemins critiques couvrir au minimum ?", opts: ["un (le succès)", "trois : succès, stock nul, échec base", "zéro", "dix"], a: 1, exp: "Nominal + échecs." },
      { type: "qcm", q: "Le cas « stock nul » doit renvoyer…", opts: ["OK", "ERR_STOCK, sans décrémenter", "ERR_DROIT", "la vente"], a: 1, exp: "Refus propre." },
      { type: "qcm", q: "Comment mesurer ce qui est couvert ?", opts: ["à l'œil", "gcc --coverage puis gcov/gcovr", "un log", "un scan d'image"], a: 1, exp: "Instrumentation." },
      { type: "qcm", q: "Viser 100 % coûte que coûte, c'est…", opts: ["idéal", "contre-productif : mieux vaut couvrir les chemins critiques", "obligatoire", "impossible"], a: 1, exp: "Qualité > quantité." },
      { type: "qcm", q: "Un test qui exécute une ligne sans vérifier le résultat est…", opts: ["excellent", "faible : la couverture monte mais rien n'est prouvé", "interdit", "rapide et suffisant"], a: 1, exp: "L'assertion compte." }
    ],
    solution: `<pre class="pseudo">/* trois tests d'intégration pour service_acheter */
CHECK(service_acheter(c, U, JEU_DISPO)  == OK);          // succès + stock -1
CHECK(service_acheter(c, U, JEU_EPUISE) == ERR_STOCK);   // refus, stock inchangé
/* échec base simulé (ex. jeu_id inexistant) */
CHECK(service_acheter(c, U, JEU_ABSENT) == ERR_DB);

# CI : gcc --coverage ... ; ./tests ; gcovr --fail-under-line 70
#   → couvre les 3 issues ; seuil garde-fou contre la régression de qualité.</pre>
<p>Trois chemins critiques couverts, un seuil minimal en CI, des assertions qui vérifient vraiment le résultat. Demain : l'interface et les entrées sûres.</p>`
  }
};
</script>

  { id: "projcpro-l12", title: "Mesurer la couverture", level: 2,
    statement: "Écris les commandes qui compilent le harnais de tests avec la couverture activée, l'exécutent, puis affichent le rapport de couverture de services.c. Ajoute un commentaire sur le fait de viser les chemins critiques plutôt que 100 %.",
    hints: [
      "gcc --coverage -Wall tests.c services.c -o tests $(mysql_config --cflags --libs).",
      "./tests puis gcov services.c.",
      "Commentaire : couvrir succès + cas d'erreur, pas 100 % à tout prix."
    ],
    solution: "# compilation instrumentee\ngcc --coverage -Wall -Wextra tests.c services.c -o tests $(mysql_config --cflags --libs)   # --coverage ajoute les compteurs ; mysql_config fournit les options MySQL\n\n# execution + rapport\n./tests                # lance les tests (enregistre les lignes parcourues)\ngcov services.c        # ou : gcovr --fail-under-line 70\n\n# Objectif : couvrir les CHEMINS CRITIQUES de chaque service\n#   (cas nominal ET branches d'erreur : ERR_STOCK, ERR_DB),\n#   pas 100 % coute que coute. La couverture mesure la quantite\n#   de code execute, pas la qualite des assertions.",
    note: "--coverage instrumente le binaire ; gcov/gcovr révèlent les lignes jamais exécutées, souvent les branches d'erreur. On vise les chemins critiques : un seuil raisonnable en CI protège la qualité sans encourager des tests creux." }
  ]
};
