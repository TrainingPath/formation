  title: "Git, branches et première CI",
  subtitle: "Un flux de travail par branches et pull requests, validé automatiquement dès le premier push.",
  theory: `
<h3>1. Le flux par branches</h3>
<p>Rappelons que <strong>Git</strong> garde l'historique du code. Ce code vit sur des <strong>branches</strong> : une branche est une copie de travail parallèle, comme un brouillon séparé où l'on peut expérimenter sans abîmer la version officielle. La branche officielle s'appelle <code>main</code> (la « ligne principale »). Une <strong>pull request</strong> (ou « demande de fusion ») est la proposition de rapatrier son brouillon dans <code>main</code> : les autres la relisent et l'approuvent avant de l'intégrer. Les lignes ci-dessous sont des <strong>commandes</strong> tapées dans le terminal (la fenêtre où l'on écrit des ordres) ; le <code>#</code> y introduit un commentaire.</p>
<pre class="pseudo">git switch -c feat/catalogue     # crée (-c) et bascule sur une nouvelle branche nommée "feat/catalogue"
... commits ...                  # (on travaille, puis on enregistre plusieurs commits sur cette branche)
git push -u origin feat/catalogue # envoie la branche vers le serveur "origin" (-u la relie pour les fois suivantes)
# puis ouvrir une Pull Request vers main   ← proposer la fusion de ce travail dans la branche principale</pre>
<p>On ne code jamais directement sur <code>main</code>. Chaque changement vit sur une branche, est relu via une <strong>pull request</strong>, et n'est fusionné qu'une fois validé.</p>

<h3>2. La CI : GitHub Actions</h3>
<p><strong>GitHub Actions</strong> est le robot de CI intégré à GitHub. On lui donne ses ordres dans un fichier YAML. Vocabulaire : un <strong>workflow</strong> est le scénario complet ; un <strong>job</strong> est une tâche de ce scénario ; une <strong>step</strong> (étape) est une action élémentaire du job ; le <strong>runner</strong> est l'ordinateur temporaire, loué dans le nuage, où tout s'exécute. Le <code>&amp;&amp;</code> (« et ensuite ») enchaîne deux commandes : la seconde ne se lance que si la première a réussi.</p>
<pre class="pseudo">name: CI                          # nom affiché du workflow
on: [push, pull_request]          # déclencheurs : à chaque push ET à chaque pull request
jobs:                             # la liste des tâches à exécuter
  build:                          # une tâche, qu'on nomme "build" (compilation)
    runs-on: ubuntu-latest        # sur quel runner : une machine Linux Ubuntu récente
    steps:                        # les étapes de la tâche, dans l'ordre
      - uses: actions/checkout@v4 # étape 1 : récupère (clone) le code du dépôt sur le runner
      - run: sudo apt-get update &amp;&amp; sudo apt-get install -y libmysqlclient-dev  # étape 2 : installe la bibliothèque MySQL nécessaire à la compilation
      - run: make                 # étape 3 : lance la compilation ; avec -Wall -Wextra, un simple avertissement peut faire échouer le build</pre>
<p>À chaque <code>push</code> et chaque pull request, GitHub exécute ce pipeline : il récupère le code, installe les dépendances, compile. Si la compilation échoue, la CI est <strong>rouge</strong>.</p>

<h3>3. La protection de branche</h3>
<div class="warn">On configure <code>main</code> pour <strong>exiger</strong> que la CI soit verte avant toute fusion. Ainsi, du code qui ne compile pas (ou dont les tests échouent) ne peut <strong>jamais</strong> entrer dans la branche principale. La discipline devient automatique.</p></div>

<h3>4. Des commits qui parlent</h3>
<pre class="pseudo">feat: ajoute la lecture du catalogue (DAO)
fix: corrige une fuite dans jeu_charger_tous
test: couvre service_tarif</pre>
<div class="tip">Des messages clairs (préfixes <code>feat</code>, <code>fix</code>, <code>test</code>…) rendent l'historique lisible et facilitent la revue. La CI + la revue humaine forment un double filtre : la machine vérifie que ça compile et passe les tests, l'humain juge la conception.</div>`,
  exercises: [
    { type: "qcm", q: "Code-t-on directement sur main ?", opts: ["oui", "non : sur une branche, via pull request", "parfois", "toujours"], a: 1, exp: "Une branche par fonctionnalité." },
    { type: "qcm", q: "Une pull request sert à…", opts: ["compiler", "faire relire et valider un changement avant fusion", "déployer", "supprimer une branche"], a: 1, exp: "Revue + CI." },
    { type: "qcm", q: "La CI se déclenche…", opts: ["une fois par an", "à chaque push et pull request", "jamais", "seulement en prod"], a: 1, exp: "on: [push, pull_request]." },
    { type: "qcm", q: "Un build qui échoue rend la CI…", opts: ["verte", "rouge", "grise", "orange"], a: 1, exp: "Échec visible." },
    { type: "qcm", q: "La protection de branche exige…", opts: ["au moins deux branches", "que la CI soit verte avant de fusionner", "un message de commit long", "un rebase obligatoire"], a: 1, exp: "Pas de fusion si rouge." },
    { type: "qcm", q: "Grâce à la protection, du code cassé…", opts: ["entre dans main", "ne peut jamais entrer dans main", "est déployé", "est corrigé automatiquement"], a: 1, exp: "Barrière automatique." },
    { type: "qcm", q: "actions/checkout@v4 sert à…", opts: ["compiler", "récupérer le code du dépôt dans le runner", "déployer", "tester"], a: 1, exp: "Étape de base." },
    { type: "qcm", q: "Un bon message de commit :", opts: ["« maj »", "« feat: ajoute la lecture du catalogue »", "« divers »", "« fix bug »"], a: 1, exp: "Clair et préfixé." },
    { type: "qcm", q: "La CI + la revue humaine forment…", opts: ["un seul filtre", "un double filtre (machine + humain)", "un contrôle redondant", "un ralentissement inutile"], a: 1, exp: "Compilation/tests + conception." },
    { type: "qcm", q: "git switch -c feat/x crée…", opts: ["un commit", "une nouvelle branche", "un tag", "un dépôt"], a: 1, exp: "Une branche de fonctionnalité." },
    { type: "vf", q: "La protection de branche rend la discipline automatique.", a: true, exp: "La machine impose la règle." },
    { type: "qcm", q: "make dans la CI échoue si…", opts: ["le runner est lent", "la compilation échoue (ou un warning traité en erreur)", "le dépôt est volumineux", "il y a trop de branches"], a: 1, exp: "Build rouge." },
    { type: "qcm", q: "runs-on: ubuntu-latest désigne…", opts: ["la prod", "l'environnement (runner) où tourne le job", "une image Docker", "une étape du job"], a: 1, exp: "La machine de CI." },
    { type: "qcm", q: "La revue humaine juge surtout…", opts: ["la compilation", "la conception et la lisibilité", "la vitesse du runner", "les volumes"], a: 1, exp: "Ce que la machine ne voit pas." },
    { type: "qcm", q: "Installer libmysqlclient-dev dans la CI sert à…", opts: ["déployer", "pouvoir compiler le code qui utilise MySQL", "lancer le serveur MySQL", "accélérer les tests"], a: 1, exp: "Dépendance de build." }
  ],
  final: {
    title: "Exercice final — Empêcher le code cassé d'entrer",
    intro: `<p>Une équipe pousse parfois du code qui ne compile pas dans main. Comment l'empêcher automatiquement ?</p>`,
    questions: [
      { type: "qcm", q: "Le mécanisme clé :", opts: ["relire tout à la main", "une CI qui compile + la protection de branche", "verrouiller le dépôt", "committer moins souvent"], a: 1, exp: "Automatiser la règle." },
      { type: "qcm", q: "Quand la CI doit-elle s'exécuter ?", opts: ["une fois par mois", "à chaque push et pull request", "jamais", "en prod seulement"], a: 1, exp: "Sur chaque changement." },
      { type: "qcm", q: "La protection de branche fait…", opts: ["compiler le code", "bloquer la fusion si les checks ne sont pas verts", "déployer", "supprimer des branches"], a: 1, exp: "Condition de fusion." },
      { type: "qcm", q: "Où code-t-on entre-temps ?", opts: ["sur main", "sur une branche de fonctionnalité", "en prod", "sur un fork personnel"], a: 1, exp: "Isolé de main." },
      { type: "qcm", q: "Bénéfice global :", opts: ["un déploiement plus rapide", "main reste toujours compilable et testé", "moins de branches à gérer", "une revue devenue facultative"], a: 1, exp: "Branche principale saine." }
    ],
    solution: `<pre class="pseudo"># .github/workflows/ci.yml      ← emplacement du fichier dans le dépôt
name: CI                          # nom du workflow
on: [push, pull_request]          # se déclenche à chaque push et chaque pull request
jobs:                             # les tâches
  build:                          # tâche de compilation
    runs-on: ubuntu-latest        # exécutée sur un runner Linux Ubuntu
    steps:                        # étapes successives
      - uses: actions/checkout@v4 # récupère le code du dépôt
      - run: sudo apt-get update &amp;&amp; sudo apt-get install -y libmysqlclient-dev  # installe la dépendance MySQL
      - run: make                 # compile ; échoue (job rouge) si la compilation rate

# Réglages du dépôt :
#   Branch protection sur main → « Require status checks to pass before merging »
#   → la fusion est impossible tant que le job build n'est pas vert.</pre>
<p>CI à chaque changement + protection de branche : le code cassé ne peut plus entrer dans main. Demain : appliquer le schéma SQL dans le conteneur.</p>`
  }
};
