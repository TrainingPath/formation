<script>
var DAY = {
  num: 8,
  title: "Validation, gestion des erreurs et entrées sûres",
  subtitle: "Valider le métier ET sécuriser les tampons — la double rigueur du C sous CI.",
  theory: `
<h3>1. Deux dangers, deux défenses</h3>
<p>Un <strong>tampon</strong> (buffer) est une zone mémoire de taille fixe où l'on range une saisie — imagine un verre : au-delà du bord, ça déborde. En C, une saisie mal gérée menace sur deux fronts. La <strong>validation métier</strong> vérifie que la valeur a du sens pour l'activité (un nom non vide, une durée réaliste). La <strong>sécurité mémoire</strong> évite le <strong>débordement de tampon</strong> : écrire plus de caractères que la taille prévue, ce qui abîme la mémoire d'à côté. On traite les deux fronts.</p>

<h3>2. Lecture bornée : jamais de débordement</h3>
<pre class="pseudo">char nom[50];                 // réserve un tampon de 50 caractères pour le nom
scanf(" %49[^\\n]", nom);     // lit AU PLUS 49 caractères jusqu'au retour à la ligne ; 49 = taille − 1, la case restante garde le '\0' (marqueur de fin de texte)
// JAMAIS : gets(nom), ni scanf("%s", nom) sans largeur   // ← ces formes n'ont AUCUNE limite → débordement possible</pre>
<div class="warn"><code>gets</code> et <code>scanf("%s")</code> sans largeur écrivent au-delà du tampon si l'entrée est trop longue : c'est le <strong>débordement de tampon</strong>, une des failles historiques du C. On borne toujours (<code>%49s</code>, <code>fgets</code> avec taille).</p></div>

<h3>3. Validation métier, testée</h3>
<pre class="pseudo">Code valider_nom(const char *nom) {          // renvoie un Code (OK ou ERR_SAISIE) selon la validité du nom
    size_t n = strlen(nom);                  // n = longueur du nom (size_t = type entier destiné aux tailles)
    if (n == 0 || n &gt; 100) return ERR_SAISIE;  // si vide (0) OU trop long (>100) : renvoie l'erreur de saisie (|| = OU)
    return OK;                               // sinon : nom valide
}
CHECK(valider_nom("") == ERR_SAISIE);        // nom vide → doit être rejeté
CHECK(valider_nom("Catan") == OK);           // nom correct → doit être accepté</pre>

<h3>4. Le sanitizer attrape ce que l'œil rate</h3>
<pre class="pseudo">gcc -g -fsanitize=address tests.c ... -o t &amp;&amp; ./t   # compile les tests avec le détecteur d'erreurs mémoire (-fsanitize=address), crée l'exécutable "t" (-o t), PUIS le lance (&& ./t)</pre>
<p>Un débordement peut « marcher » par chance, en corrompant une zone voisine sans planter tout de suite. L'<strong>AddressSanitizer</strong>, exécuté en CI, le transforme en échec net et pointe la ligne exacte.</p>
<div class="tip">Validation métier (codes de retour, testés) + entrées bornées (contre les débordements, vérifiées par le sanitizer) : deux disciplines menées ensemble, garanties par la CI à chaque push.</div>`,
  exercises: [
    { type: "qcm", q: "Une saisie en C menace sur…", opts: ["un seul front", "deux : validation métier et sécurité mémoire", "aucun", "trois"], a: 1, exp: "Métier + mémoire." },
    { type: "qcm", q: "Quelle lecture est sûre ?", opts: ["gets(nom)", "scanf(\" %49[^\\n]\", nom)", "scanf(\"%s\", nom)", "aucune"], a: 1, exp: "Bornée à 49." },
    { type: "qcm", q: "gets est…", opts: ["recommandé", "à proscrire (débordement)", "rapide et sûr", "obligatoire"], a: 1, exp: "Aucune borne." },
    { type: "qcm", q: "Un débordement de tampon, c'est…", opts: ["une fuite mémoire", "écrire au-delà de la taille d'un tampon", "une injection SQL", "un rôle"], a: 1, exp: "Faille historique du C." },
    { type: "qcm", q: "valider_nom(\"\") renvoie…", opts: ["OK", "ERR_SAISIE", "ERR_DB", "un nom valide"], a: 1, exp: "Nom vide rejeté." },
    { type: "qcm", q: "Le débordement peut…", opts: ["toujours planter", "corrompre une zone voisine sans planter tout de suite", "chiffrer", "trier"], a: 1, exp: "Bug silencieux." },
    { type: "qcm", q: "Quel outil attrape le débordement en CI ?", opts: ["make", "-fsanitize=address", "cppcheck seul", "un secret"], a: 1, exp: "AddressSanitizer." },
    { type: "qcm", q: "Le %49 dans %49[^\\n] correspond à…", opts: ["49 mots", "taille du tampon - 1 (place pour '\\0')", "49 lignes", "rien"], a: 1, exp: "char[50] → 49." },
    { type: "qcm", q: "La validation métier renvoie…", opts: ["un tampon", "un Code (OK / ERR_...)", "un secret", "rien"], a: 1, exp: "Codes testables." },
    { type: "qcm", q: "Deux disciplines menées ensemble :", opts: ["UI et DAO", "validation métier + entrées bornées", "build et deploy", "hash et sel"], a: 1, exp: "Sous CI." },
    { type: "vf", q: "Un débordement qui ne plante pas immédiatement est sans danger.", a: false, exp: "Faux : il corrompt la mémoire ; danger réel, souvent tardif." },
    { type: "qcm", q: "fgets par rapport à gets…", opts: ["pire", "borne la taille (sûr)", "identique", "plus lent seulement"], a: 1, exp: "On donne la taille du tampon." },
    { type: "qcm", q: "L'AddressSanitizer pointe…", opts: ["la vitesse", "la ligne exacte de l'erreur mémoire", "le rôle", "le prix"], a: 1, exp: "Diagnostic précis." },
    { type: "qcm", q: "valider_nom teste la longueur entre…", opts: ["0 et 0", "1 et 100", "1 et 1000000", "n'importe quoi"], a: 1, exp: "Bornes métier." },
    { type: "qcm", q: "La CI garantit ces contrôles…", opts: ["une fois", "à chaque push", "jamais", "en prod seulement"], a: 1, exp: "Continu." }
  ],
  final: {
    title: "Exercice final — Sécuriser une saisie",
    intro: `<p>Cette lecture de nom de jeu est dangereuse. Analyse :</p>
<pre class="pseudo">char nom[20];                  // tampon de 20 caractères seulement
printf("Nom ? ");              // affiche l'invite "Nom ? "
scanf("%s", nom);              // lit un mot SANS aucune limite de longueur (débordement si > 19 caractères : à interroger…)
dao_ajouter_jeu(c, nom, prix); // insère le nom en base</pre>`,
    questions: [
      { type: "qcm", q: "Danger n°1 — <code>scanf(\"%s\", nom)</code> :", opts: ["aucun", "pas de borne : débordement si le nom dépasse 19 caractères", "trop lent", "rien"], a: 1, exp: "Buffer overflow." },
      { type: "qcm", q: "Correction de la lecture :", opts: ["gets(nom)", "scanf(\" %19[^\\n]\", nom)", "scanf(\"%s\", &nom)", "rien"], a: 1, exp: "Bornée à 19." },
      { type: "qcm", q: "Manque n°2 — avant d'insérer :", opts: ["rien", "valider le nom (longueur, non vide)", "un COMMIT", "un secret"], a: 1, exp: "Validation métier." },
      { type: "qcm", q: "Quel outil confirmerait l'absence de débordement ?", opts: ["make", "-fsanitize=address / valgrind", "un log", "un tag"], a: 1, exp: "Sanitizer en CI." },
      { type: "qcm", q: "scanf(\"%s\") s'arrête aussi…", opts: ["jamais", "au premier espace (nom composé tronqué)", "à la fin du fichier seulement", "au ;"], a: 1, exp: "%[^\\n] lit la ligne entière." }
    ],
    solution: `<pre class="pseudo">char nom[20];                                // tampon de 20 caractères
printf("Nom ? ");                            // affiche l'invite
if (scanf(" %19[^\\n]", nom) != 1) return;   // lit au plus 19 caractères (borné, jamais de débordement) ; si la lecture échoue, on sort
if (valider_nom(nom) != OK) {                // validation métier : nom non vide et pas trop long
    printf("%s\\n", code_message(ERR_SAISIE));  // affiche le message correspondant au code d'erreur
    return;                                  // et on arrête
}
if (dao_ajouter_jeu(c, nom, prix) != 0)      // insertion via requête préparée (leçon 7) ; != 0 = échec
    printf("%s\\n", code_message(ERR_DB));   // affiche l'erreur base le cas échéant

/* CI : compiler tests avec -fsanitize=address pour prouver l'absence de débordement */</pre>
<p>Lecture bornée, validation métier, insertion sûre, sanitizer en garde-fou. Demain : l'authentification durcie.</p>`
  }
};
</script>

      "Borne : scanf(\" %31[^\\n]\", login) pour char[32].",
      "Teste le retour de scanf et le Code de validation.",
      "Commentaire : gcc -g -fsanitize=address ..."
    ],
    solution: "char login[32];                          // tampon de 32 caracteres pour le login\nprintf(\"Login ? \");                      // affiche l'invite\nif (scanf(\" %31[^\\n]\", login) != 1) {   // lit au plus 31 caracteres (borne : place pour '\\0') ; sort si echec\n    printf(\"Saisie invalide\\n\");\n    return;\n}\nif (valider_nom(login) != OK) {          // validation metier : longueur 1 a 100\n    printf(\"%s\\n\", code_message(ERR_SAISIE));   // message d'erreur si invalide\n    return;\n}\n// ... utiliser login ...\n// Detecter un debordement : gcc -g -fsanitize=address prog.c ... -o prog ; ./prog",
    note: "La largeur 31 (pour char[32]) empêche tout débordement, et la validation métier rejette une saisie vide ou trop longue. Le sanitizer, en CI, prouverait l'absence d'accès hors zone." }
  ]
};
