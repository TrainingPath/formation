<script>
var DAY = {
  num: 14,
  title: "Secrets et configuration par environnement",
  subtitle: "Aucun secret dans le code ni le dépôt : lus depuis l'environnement, injectés par la CI et la prod.",
  theory: `
<h3>1. Le code ne contient aucun secret</h3>
<pre class="pseudo">const char *pass = getenv("DB_PASSWORD");   // getenv lit la variable d'environnement "DB_PASSWORD" ; renvoie son texte, ou NULL si elle n'existe pas
if (!pass) { fprintf(stderr, "[ERREUR] DB_PASSWORD manquant\\n"); return NULL; }   // si absente (!pass) : écrit une erreur sur la sortie d'erreur (stderr) et arrête (return NULL)</pre>
<p>Une <strong>variable d'environnement</strong> est un réglage nommé fourni au programme par le système au moment où il démarre (comme des consignes glissées dans sa poche avant le départ). La fonction <code>getenv</code> (« get environment ») va y lire une valeur. Ainsi, le programme lit toute sa configuration depuis l'environnement : aucune valeur sensible n'est écrite en dur dans le code. <code>stderr</code> est la « sortie d'erreur », le canal réservé aux messages d'alerte.</p>

<h3>2. Trois niveaux cohérents</h3>
<pre class="pseudo">Code      : lit getenv(...)                       (public, versionné)
Dépôt     : .env dans .gitignore ; .env.example documenté (sans valeurs)
CI / prod : secrets injectés par l'orchestrateur (GitHub Secrets, etc.)</pre>

<h3>3. Les secrets dans la CI</h3>
<pre class="pseudo"># ci.yml
    env:                                        # variables d'environnement passées au job
      DB_PASSWORD: \${{ secrets.DB_PASSWORD }}   # sa valeur vient du coffre GitHub Secrets (chiffré, jamais écrit dans le dépôt)</pre>
<div class="warn">Un secret ne transite jamais par le code ni par un fichier versionné. Dans la CI, il vient d'un coffre (GitHub Secrets) et n'apparaît pas dans les logs (masqué automatiquement). En prod, il est injecté par l'orchestrateur.</p></div>

<h3>4. Que faire si un secret a fuité ?</h3>
<p>Le supprimer du code <strong>ne suffit pas</strong> : il reste dans l'historique Git. Il faut le considérer comme <strong>compromis</strong> et le <strong>faire tourner</strong> (changer le mot de passe/clé). D'où l'importance de ne jamais le committer en premier lieu.</p>
<div class="tip">Configuration ≠ secret : l'hôte ou le nom de base peuvent avoir une valeur par défaut ; un mot de passe, jamais — son absence doit faire échouer le démarrage plutôt que prendre une valeur devinable.</div>`,
  exercises: [
    { type: "qcm", q: "Le code lit ses secrets…", opts: ["en dur", "via getenv (variables d'environnement)", "dans l'UI", "dans un printf"], a: 1, exp: "Rien en dur." },
    { type: "qcm", q: "Le .env est…", opts: ["versionné", "ignoré par Git", "affiché", "dans le code"], a: 1, exp: "Jamais dans le dépôt." },
    { type: "qcm", q: ".env.example contient…", opts: ["les vrais secrets", "les noms de variables sans valeurs réelles", "le code", "un binaire"], a: 1, exp: "Documentation." },
    { type: "qcm", q: "Dans la CI, un secret vient de…", opts: ["du code", "GitHub Secrets (coffre chiffré)", "d'un printf", "du .env versionné"], a: 1, exp: "Injecté, masqué." },
    { type: "qcm", q: "Un secret apparaît-il dans les logs de CI ?", opts: ["oui", "non : masqué automatiquement", "toujours", "au choix"], a: 1, exp: "Protection intégrée." },
    { type: "qcm", q: "Supprimer un secret fuité du code…", opts: ["suffit", "ne suffit pas : il reste dans l'historique", "le chiffre", "rien"], a: 1, exp: "Il faut le faire tourner." },
    { type: "qcm", q: "Un secret compromis doit être…", opts: ["ignoré", "changé (rotation)", "affiché", "committé"], a: 1, exp: "On le considère perdu." },
    { type: "qcm", q: "Configuration vs secret : l'hôte DB_HOST…", opts: ["est un secret", "peut avoir un défaut (localhost)", "ne doit jamais exister", "est chiffré"], a: 1, exp: "Config, pas secret." },
    { type: "qcm", q: "Un mot de passe manquant devrait…", opts: ["prendre un défaut devinable", "faire échouer le démarrage", "être ignoré", "être affiché"], a: 1, exp: "Jamais de défaut pour un secret." },
    { type: "qcm", q: "Les trois niveaux cohérents :", opts: ["UI, service, DAO", "code (getenv), dépôt (.gitignore), CI/prod (injection)", "build, test, deploy", "hash, sel, session"], a: 1, exp: "Chaîne de gestion des secrets." },
    { type: "vf", q: "Un dépôt privé peut contenir des secrets en clair sans danger.", a: false, exp: "Faux : un dépôt privé peut fuiter ; on n'y met jamais de secret." },
    { type: "qcm", q: "getenv(\"DB_PASSWORD\") renvoie NULL si…", opts: ["le mdp est faux", "la variable n'est pas définie", "la base est vide", "jamais"], a: 1, exp: "On teste et on échoue proprement." },
    { type: "qcm", q: "En prod, les secrets sont injectés par…", opts: ["le code", "l'orchestrateur / la plateforme", "un printf", "le .env.example"], a: 1, exp: "Hors du code." },
    { type: "qcm", q: "${{ secrets.DB_PASSWORD }} désigne…", opts: ["une valeur en clair", "une référence à un secret du coffre GitHub", "un fichier", "un volume"], a: 1, exp: "Injection sécurisée." },
    { type: "qcm", q: "La meilleure protection contre la fuite d'un secret :", opts: ["le chiffrer dans le code", "ne jamais le committer", "le raccourcir", "l'afficher une fois"], a: 1, exp: "Prévention." }
  ],
  final: {
    title: "Exercice final — Réagir à une fuite",
    intro: `<p>Un développeur a committé le fichier .env contenant DB_PASSWORD=Secret123!, puis l'a supprimé au commit suivant. Que faut-il faire ?</p>`,
    questions: [
      { type: "qcm", q: "La suppression au commit suivant…", opts: ["règle tout", "ne suffit pas : le secret reste dans l'historique", "chiffre le secret", "le fait tourner"], a: 1, exp: "L'historique le conserve." },
      { type: "qcm", q: "Le mot de passe doit être considéré comme…", opts: ["sûr", "compromis", "temporaire", "public utile"], a: 1, exp: "Fuité = perdu." },
      { type: "qcm", q: "Action immédiate :", opts: ["rien", "changer (faire tourner) le mot de passe", "le raccourcir", "le rendre public"], a: 1, exp: "Rotation." },
      { type: "qcm", q: "Prévention pour l'avenir :", opts: ["rien", ".env dans .gitignore dès le départ ; secrets via l'environnement", "committer plus vite", "un dépôt privé suffit"], a: 1, exp: "Ne jamais committer." },
      { type: "qcm", q: "Le code doit lire le mot de passe via…", opts: ["une constante", "getenv, sans valeur par défaut", "l'UI", "un log"], a: 1, exp: "Config externalisée." }
    ],
    solution: `<pre class="pseudo">1. Rotation : changer DB_PASSWORD (l'ancien est compromis à jamais).
2. Retirer .env du suivi et l'ignorer :
     git rm --cached .env       # cesse de suivre .env dans Git (le fichier reste sur le disque)
     echo ".env" >> .gitignore  # ajoute la ligne ".env" au fichier .gitignore pour l'ignorer désormais
3. (idéalement) purger le secret de l'historique, puis forcer la rotation.
4. Prévention : .env.example versionné, secrets via getenv + coffre CI/prod.

/* code : aucune valeur par défaut pour un secret */
const char *pass = getenv("DB_PASSWORD");   // lit le mot de passe dans l'environnement
if (!pass) { fprintf(stderr, "[ERREUR] DB_PASSWORD manquant\\n"); return NULL; }   // absent → message d'erreur et arrêt (jamais de valeur par défaut pour un secret)</pre>
<p>Un secret committé est un secret perdu : on le fait tourner, puis on empêche la récidive. Demain : recherche, pagination et qualité (lint, sanitizers).</p>`
  }
};

    hints: [
      "Pour l'hôte : const char *host = getenv(\"DB_HOST\"); if (!host) host = \"localhost\";",
      "Pour le secret : const char *pass = getenv(\"DB_PASSWORD\"); if (!pass) return NULL;",
      "Un secret manquant doit faire échouer, pas prendre une valeur devinable."
    ],
    solution: "#include <stdlib.h>   // pour getenv\n#include <stdio.h>    // pour fprintf\n\n// Configuration : un defaut est acceptable\nconst char *host = getenv(\"DB_HOST\");    // lit DB_HOST dans l'environnement (NULL si absent)\nif (!host) host = \"localhost\";           // absent -> valeur par defaut raisonnable\n\n// Secret : AUCUN defaut -> on echoue si absent\nconst char *pass = getenv(\"DB_PASSWORD\");   // lit le mot de passe dans l'environnement\nif (!pass) {                             // s'il est absent...\n    fprintf(stderr, \"[ERREUR] DB_PASSWORD manquant\\n\");   // ...on signale l'erreur\n    return NULL;   // demarrage refuse\n}",
    note: "La nuance est essentielle : l'hôte est de la configuration (un défaut raisonnable convient), le mot de passe est un secret (jamais de défaut ; son absence bloque le démarrage plutôt que d'ouvrir une brèche)." }
  ]
};
