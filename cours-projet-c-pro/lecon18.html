<script>
var DAY = {
  num: 18,
  title: "Le pipeline complet : build, test, scan, protection",
  subtitle: "Enchaîner tous les contrôles et en faire des conditions de fusion incontournables.",
  theory: `
<h3>1. L'enchaînement des jobs</h3>
<pre class="pseudo">build       compile (-Wall -Wextra)
  ↓
test        tests unitaires (make test)
integration tests contre une base jetable
lint        cppcheck (analyse statique)
asan        sanitizers (mémoire, UB)
  ↓
image       docker build (multi-stage)
scan        trivy (vulnérabilités)</pre>
<p>Un <strong>pipeline</strong> est la chaîne de montage automatique du code : une suite de <strong>jobs</strong> (tâches) déclenchés à chaque envoi. Les jobs s'enchaînent grâce au mot-clé <code>needs:</code> (« a besoin de »), qui impose l'ordre : ici, l'image ne se construit que si les tests et le lint passent, et le scan suit l'image. Deux jobs sans lien peuvent tourner <strong>en parallèle</strong> (en même temps), ce qui accélère le retour.</p>

<h3>2. Un pipeline lisible</h3>
<pre class="pseudo">jobs:                                        # la liste des tâches du pipeline
  build:       { ... }                       # compile le code (aucune dépendance : démarre en premier)
  test:        { needs: build }              # tests unitaires : attend que "build" ait réussi
  integration: { needs: build }              # tests d'intégration : attend "build"
  lint:        { needs: build }              # analyse statique : attend "build"
  asan:        { needs: build }              # sanitizers mémoire : attend "build"
  image:       { needs: [test, lint, asan] } # construit l'image SEULEMENT si test, lint et asan sont verts
  scan:        { needs: image }              # scanne l'image : attend que "image" soit construite</pre>

<h3>3. La protection de branche, clé de voûte</h3>
<div class="warn">On configure <code>main</code> pour exiger que <strong>tous ces checks</strong> soient verts avant toute fusion (« required status checks »). Un seul job rouge = pas de fusion. La qualité n'est plus une bonne volonté : c'est une <strong>règle du dépôt</strong>, imposée à tous.</p></div>

<h3>4. Rapidité et parallélisme</h3>
<p>Les jobs indépendants (test, lint, asan) tournent <strong>en parallèle</strong> : le retour est rapide malgré le nombre de contrôles. On garde les jobs lents (intégration, scan) là où ils apportent le plus, sans ralentir la boucle courte.</p>
<div class="tip">Le pipeline transforme cinq disciplines (compiler, tester, analyser, conteneuriser, scanner) en une porte unique et automatique. Rien n'atteint <code>main</code> — puis la production — sans les avoir toutes franchies.</div>`,
  exercises: [
    { type: "qcm", q: "Les jobs s'enchaînent avec…", opts: ["depends_on", "needs:", "USER", "COPY"], a: 1, exp: "Dépendances entre jobs." },
    { type: "qcm", q: "L'image ne se construit que si…", opts: ["le build a échoué", "les tests et le lint passent", "un tag de version est posé", "le scan a déjà tourné"], a: 1, exp: "image: needs [test, lint, asan]." },
    { type: "qcm", q: "Le scan suit…", opts: ["le build", "la construction de l'image", "le lint", "les tests unitaires"], a: 1, exp: "scan: needs image." },
    { type: "qcm", q: "La protection de branche exige…", opts: ["un seul check", "que tous les checks soient verts avant fusion", "au moins un relecteur", "un tag de version"], a: 1, exp: "Required status checks." },
    { type: "qcm", q: "Un seul job rouge signifie…", opts: ["fusion possible", "pas de fusion", "fusion forcée quand même", "juste un avertissement"], a: 1, exp: "Barrière stricte." },
    { type: "qcm", q: "La qualité devient…", opts: ["une bonne volonté", "une règle du dépôt imposée à tous", "optionnelle", "une étape manuelle"], a: 1, exp: "Automatique et obligatoire." },
    { type: "qcm", q: "Les jobs indépendants tournent…", opts: ["en série", "en parallèle (retour rapide)", "seulement la nuit", "après la mise en prod"], a: 1, exp: "Parallélisme." },
    { type: "qcm", q: "Les jobs lents (intégration, scan) sont…", opts: ["regroupés avant le build", "placés là où ils apportent le plus, sans ralentir la boucle courte", "en premier toujours", "exécutés à chaque commit local"], a: 1, exp: "Équilibre." },
    { type: "qcm", q: "Le pipeline transforme les disciplines en…", opts: ["une suite d'étapes manuelles", "une porte unique et automatique", "une tâche optionnelle", "un simple rapport écrit"], a: 1, exp: "Contrôle intégré." },
    { type: "qcm", q: "Rien n'atteint main sans…", opts: ["un commit", "avoir franchi tous les contrôles", "une compilation locale", "un tag"], a: 1, exp: "Filtres cumulés." },
    { type: "vf", q: "La protection de branche rend la qualité obligatoire, pas optionnelle.", a: true, exp: "La règle est imposée par le dépôt." },
    { type: "qcm", q: "build compile avec…", opts: ["aucun flag", "-Wall -Wextra", "-O3 uniquement", "-w (sans avertissements)"], a: 1, exp: "Avertissements activés." },
    { type: "qcm", q: "integration teste contre…", opts: ["la prod", "une base jetable", "aucune base", "un fichier"], a: 1, exp: "État propre." },
    { type: "qcm", q: "asan couvre…", opts: ["le style", "les erreurs mémoire et comportements indéfinis", "les motifs de code douteux", "les bugs de logique métier"], a: 1, exp: "Sanitizers." },
    { type: "qcm", q: "Le pipeline s'exécute…", opts: ["à la main", "automatiquement sur push/PR", "une fois par sprint", "seulement le vendredi"], a: 1, exp: "CI continue." }
  ],
  final: {
    title: "Exercice final — Ordonner un pipeline",
    intro: `<p>On dispose des jobs : build, test, lint, image, scan. Comment les ordonner avec needs ?</p>`,
    questions: [
      { type: "qcm", q: "test dépend de…", opts: ["scan", "build", "image", "rien"], a: 1, exp: "On teste ce qui compile." },
      { type: "qcm", q: "image dépend de…", opts: ["rien", "test (et lint)", "scan", "un tag de version"], a: 1, exp: "On n'image que du code validé." },
      { type: "qcm", q: "scan dépend de…", opts: ["build", "image", "test", "rien"], a: 1, exp: "On scanne l'image produite." },
      { type: "qcm", q: "test et lint peuvent tourner…", opts: ["en série obligatoire", "en parallèle (tous deux après build)", "avant le build", "après scan"], a: 1, exp: "Indépendants." },
      { type: "qcm", q: "Pour bloquer la fusion, il faut…", opts: ["une simple consigne d'équipe", "déclarer ces jobs comme checks requis (protection de branche)", "un message de commit clair", "un tag"], a: 1, exp: "Required checks." }
    ],
    solution: `<pre class="pseudo">jobs:                                                          # les tâches du pipeline
  build: { runs-on: ubuntu-latest, steps: [checkout, deps, make] }   # compile (récupère le code, installe les dépendances, make)
  test:  { needs: build }                                      # tests : après build
  lint:  { needs: build }                                      # analyse statique : après build
  asan:  { needs: build }                                      # sanitizers : après build
  image: { needs: [test, lint, asan] }                         # image : seulement si test, lint et asan sont verts
  scan:  { needs: image }                                      # scan de vulnérabilités : après l'image

# Réglages du dépôt (main) :
#   Required status checks: build, test, lint, asan, image, scan
#   → aucune fusion tant qu'un seul de ces jobs n'est pas vert.</pre>
<p>Un enchaînement clair, du parallélisme là où c'est possible, et tous les jobs requis pour fusionner. Le pipeline est complet. Demain : le déploiement automatisé.</p>`
  }
};
</script>
