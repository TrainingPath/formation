<script>
var DAY = {
  num: 7,
  title: "Requêtes préparées et le job de tests au vert",
  subtitle: "Écrire sûr côté base — la sécurité vient de la conception, la CI garde le reste au vert.",
  theory: `
<h3>1. Les écritures passent par des requêtes préparées</h3>
<p>Une <strong>requête préparée</strong> est une requête SQL écrite « à trous » : on met des points d'interrogation <code>?</code> à la place des valeurs, puis on « branche » les valeurs séparément. Cela empêche l'<strong>injection SQL</strong> — l'attaque où une saisie malveillante (par exemple <code>' OR '1'='1</code>) serait interprétée comme du code SQL au lieu d'une simple donnée. Comme le formulaire est déjà imprimé avec ses cases, remplir une case ne peut jamais rajouter d'instructions. On appelle <strong>paramètres liés</strong> ces valeurs branchées sur les <code>?</code>. Toute écriture à partir d'une donnée externe passe donc par une requête préparée. C'est la même exigence qu'au Niveau 6, mais ici on l'inscrit dans un projet où <strong>chaque</strong> accès est relu et testé.</p>
<pre class="pseudo">int dao_ajouter_jeu(MYSQL *c, const char *nom, double prix) {  // ajoute un jeu ; c = connexion, nom et prix = données à insérer
    MYSQL_STMT *st = mysql_stmt_init(c);                       // crée une requête préparée vide (st = "statement")
    const char *sql = "INSERT INTO jeu(nom,prix_location,prix_achat) VALUES(?,?,0)";  // texte SQL à trous : les deux ? = deux valeurs à brancher
    if (mysql_stmt_prepare(st, sql, strlen(sql))) { mysql_stmt_close(st); return -1; }  // prépare la requête ; si échec, ferme et sort avec -1 (strlen = longueur du texte)
    MYSQL_BIND b[2]; memset(b, 0, sizeof(b));                 // b = 2 "branchements" ; memset les remplit de 0 (remise à zéro propre)
    unsigned long len = strlen(nom);                          // len = longueur du nom (nécessaire pour le brancher)
    b[0].buffer_type=MYSQL_TYPE_STRING; b[0].buffer=(char*)nom;  // 1er ? : un texte, dont la source est "nom"
    b[0].buffer_length=len; b[0].length=&amp;len;                // longueur de ce texte
    b[1].buffer_type=MYSQL_TYPE_DOUBLE; b[1].buffer=&amp;prix;   // 2e ? : un nombre à virgule, la variable "prix"
    mysql_stmt_bind_param(st, b);                             // relie effectivement les ? aux valeurs de b
    int ok = mysql_stmt_execute(st)==0 ? 0 : -1;             // exécute ; ok = 0 si succès, -1 si erreur
    mysql_stmt_close(st); return ok;                          // ferme la requête (libère la mémoire) et renvoie le résultat
}</pre>

<h3>2. La sécurité est structurelle, pas testée</h3>
<div class="warn">On ne « teste » pas l'injection au sens d'un test unitaire : la protection vient de la <strong>conception</strong> (le <code>?</code>). Ce que la CI vérifie, c'est que le code compile et que la logique environnante (validation, services) reste correcte. La revue de code, elle, s'assure qu'aucune concaténation n'a été introduite.</p></div>

<h3>3. Garder le job de tests au vert</h3>
<p>Ajouter un accès base ne doit pas casser les tests existants. On lance <code>make test</code> localement avant de pousser, puis la CI le rejoue. Un job <strong>toujours vert</strong> est un signal de confiance : on peut fusionner.</p>

<h3>4. La revue traque la concaténation</h3>
<pre class="pseudo">// signal d'alarme en revue :
sprintf(sql, "... '%s' ...", saisie);   // sprintf colle la saisie DANS le texte SQL (concaténation) → porte ouverte à l'injection → à refuser</pre>
<div class="tip">Deux gardes complémentaires : la <strong>machine</strong> (CI) vérifie compilation et tests ; l'<strong>humain</strong> (revue) traque les motifs dangereux qu'un test ne verrait pas, comme une requête concaténée. Ni l'un ni l'autre seul ne suffit.</div>`,
  exercises: [
    { type: "qcm", q: "Toute écriture depuis une donnée externe utilise…", opts: ["la concaténation", "une requête préparée", "un printf", "un fichier"], a: 1, exp: "Paramètres liés." },
    { type: "qcm", q: "La protection contre l'injection est…", opts: ["un test unitaire", "structurelle (le ? dans la conception)", "un secret", "un log"], a: 1, exp: "Elle vient de la conception." },
    { type: "qcm", q: "Que vérifie la CI ici ?", opts: ["l'injection directement", "la compilation et la logique environnante", "le réseau", "rien"], a: 1, exp: "Build + tests." },
    { type: "qcm", q: "Qui traque une concaténation dangereuse ?", opts: ["personne", "la revue de code (humain)", "le compilateur seul", "l'UI"], a: 1, exp: "Motif qu'un test ne voit pas." },
    { type: "qcm", q: "Ajouter un accès base ne doit pas…", opts: ["compiler", "casser les tests existants", "être relu", "être testé"], a: 1, exp: "Job toujours vert." },
    { type: "qcm", q: "Avant de pousser, on lance…", opts: ["rien", "make test localement", "un déploiement", "un scan"], a: 1, exp: "Puis la CI rejoue." },
    { type: "qcm", q: "Un job de tests toujours vert est…", opts: ["suspect", "un signal de confiance pour fusionner", "inutile", "un ralentissement"], a: 1, exp: "Base saine." },
    { type: "qcm", q: "Le motif <code>sprintf(sql, \"...'%s'...\", saisie)</code> est…", opts: ["recommandé", "un signal d'alarme (concaténation) à refuser", "obligatoire", "sans risque"], a: 1, exp: "Injection possible." },
    { type: "qcm", q: "Machine + humain forment…", opts: ["un seul garde", "deux gardes complémentaires", "aucun contrôle", "un doublon inutile"], a: 1, exp: "CI + revue." },
    { type: "qcm", q: "mysql_stmt_close sert à…", opts: ["ouvrir", "libérer la requête préparée", "exécuter", "lier"], a: 1, exp: "En fin d'usage." },
    { type: "vf", q: "Un test unitaire prouve à lui seul l'absence d'injection.", a: false, exp: "Faux : l'absence d'injection vient de la conception (paramètres liés) et de la revue." },
    { type: "qcm", q: "Le ? dans la requête sépare…", opts: ["rien", "le code SQL des données", "deux tables", "l'UI du service"], a: 1, exp: "Frontière infranchissable." },
    { type: "qcm", q: "MYSQL_TYPE_DOUBLE lie…", opts: ["un texte", "une valeur réelle (le prix)", "un id", "une date"], a: 1, exp: "Le type du paramètre." },
    { type: "qcm", q: "La revue de code juge notamment…", opts: ["la vitesse du runner", "la présence de motifs dangereux (concaténation)", "les volumes", "le healthcheck"], a: 1, exp: "Ce que la machine ne voit pas." },
    { type: "qcm", q: "« Toujours vert » veut dire…", opts: ["jamais de tests", "les tests passent en continu", "pas de CI", "tout est en prod"], a: 1, exp: "Confiance permanente." }
  ],
  final: {
    title: "Exercice final — Revue d'un accès base",
    intro: `<p>En revue de pull request, on lit ce code d'ajout de catégorie :</p>
<pre class="pseudo">char sql[128];                                                  // réserve un texte de 128 caractères pour la requête
sprintf(sql, "INSERT INTO categorie(nom) VALUES('%s')", nom);  // insère "nom" DIRECTEMENT dans le SQL (concaténation dangereuse : à interroger…)
mysql_query(c, sql);                                            // envoie ce texte tel quel à la base</pre>`,
    questions: [
      { type: "qcm", q: "Que doit signaler le relecteur ?", opts: ["rien", "une concaténation de saisie : risque d'injection", "trop de commentaires", "trop lent"], a: 1, exp: "Motif dangereux." },
      { type: "qcm", q: "La correction demandée :", opts: ["raccourcir nom", "une requête préparée avec ?", "chiffrer sql", "un log"], a: 1, exp: "Paramètre lié." },
      { type: "qcm", q: "La CI aurait-elle attrapé cette faille toute seule ?", opts: ["oui, toujours", "non : elle compile et passe ; c'est la revue qui la repère", "elle plante", "elle déploie"], a: 1, exp: "D'où l'importance de la revue." },
      { type: "qcm", q: "Après correction, la sécurité vient…", opts: ["d'un test", "de la conception (paramètre lié)", "d'un secret", "d'un log"], a: 1, exp: "Structurelle." },
      { type: "qcm", q: "Deux filtres complémentaires :", opts: ["CI seule", "CI (compile/tests) + revue (motifs)", "revue seule", "aucun"], a: 1, exp: "Machine + humain." }
    ],
    solution: `<pre class="pseudo">int dao_ajouter_categorie(MYSQL *c, const char *nom) {        // ajoute une catégorie de façon sûre
    MYSQL_STMT *st = mysql_stmt_init(c);                       // crée une requête préparée vide
    const char *sql = "INSERT INTO categorie(nom) VALUES(?)";  // SQL à trou : un seul ? pour le nom
    if (mysql_stmt_prepare(st, sql, strlen(sql))) { mysql_stmt_close(st); return -1; }  // prépare ; si échec, ferme et sort avec -1
    MYSQL_BIND b[1]; memset(b, 0, sizeof(b));                 // un seul branchement ; remis à zéro
    unsigned long len = strlen(nom);                          // longueur du nom
    b[0].buffer_type=MYSQL_TYPE_STRING; b[0].buffer=(char*)nom;  // le ? est un texte : la source est "nom"
    b[0].buffer_length=len; b[0].length=&amp;len;                // sa longueur
    mysql_stmt_bind_param(st, b);                             // relie le ? à la valeur
    int ok = mysql_stmt_execute(st)==0 ? 0 : -1;             // exécute ; 0 = succès, -1 = erreur
    mysql_stmt_close(st); return ok;                          // ferme et renvoie le résultat
}</pre>
<p>La revue a transformé une concaténation en requête préparée. Machine et humain se complètent. Demain : validation et entrées sûres.</p>`
  }
};
</script>
