<script>
var DAY = {
  num: 4,
  title: "Du MCD Merise au schéma SQL (dans le conteneur)",
  subtitle: "Un schéma versionné, appliqué automatiquement au démarrage du conteneur MySQL.",
  theory: `
<h3>1. Le schéma vit dans le dépôt</h3>
<p>Un <strong>schéma</strong> de base de données est le <em>plan</em> de la base : la liste des tableaux (tables) et de leurs colonnes, avant même d'y mettre la moindre donnée — comme le plan d'une maison avant les meubles. Le <strong>MCD Merise</strong> est une méthode de dessin de ce plan (Merise est une méthode française de conception ; MCD = Modèle Conceptuel de Données). Le fichier <code>schema.sql</code> (issu de ce plan) est <strong>versionné</strong> comme le code, c'est-à-dire suivi par Git. Fini le « j'ai créé les tables à la main » qui diverge d'un poste à l'autre : le schéma devient une source unique, rejouable partout à l'identique.</p>

<h3>2. Initialisation automatique</h3>
<p>L'image MySQL exécute tout script placé dans <code>/docker-entrypoint-initdb.d/</code> au <strong>premier démarrage</strong> d'un volume vide. On y monte <code>schema.sql</code>.</p>
<pre class="pseudo">services:                            # les conteneurs
  db:                                # le service base de données
    image: mysql:8.4                 # image officielle MySQL 8.4
    volumes:                         # montages : relier des fichiers/dossiers de l'hôte au conteneur
      - dbdata:/var/lib/mysql        # volume de persistance : conserve les données de la base
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro  # place notre schema.sql dans le dossier d'init de MySQL, en lecture seule (:ro)</pre>
<div class="warn">Le préfixe <code>01-</code> ordonne les scripts (schéma avant données de test). Le <code>:ro</code> monte le fichier en lecture seule. Attention : ces scripts ne s'exécutent qu'à l'initialisation d'un volume <strong>neuf</strong> ; pour rejouer, on repart d'un volume vide.</p></div>

<h3>3. Le schéma, rappel</h3>
<p><strong>SQL</strong> est le langage qui parle aux bases de données (« Structured Query Language »). Une <strong>table</strong> est un tableau : des <em>colonnes</em> (les intitulés, ex. nom, prix) et des <em>lignes</em> (chaque enregistrement). <code>CREATE TABLE</code> veut dire « crée une table ». Chaque colonne a un <strong>type</strong> : <code>INT</code> = nombre entier, <code>VARCHAR(50)</code> = texte d'au plus 50 caractères, <code>DECIMAL(6,2)</code> = nombre à 2 décimales (idéal pour l'argent). Les <strong>contraintes</strong> sont des règles : <code>PRIMARY KEY</code> désigne l'identifiant unique de la ligne, <code>AUTO_INCREMENT</code> numérote automatiquement, <code>NOT NULL</code> interdit de laisser vide, <code>UNIQUE</code> interdit les doublons, <code>DEFAULT</code> fixe une valeur par défaut, et <code>FOREIGN KEY</code> (clé étrangère) relie une table à une autre. En SQL, un commentaire commence par <code>--</code> (deux tirets).</p>
<pre class="pseudo">CREATE TABLE categorie (id INT AUTO_INCREMENT PRIMARY KEY, nom VARCHAR(50) NOT NULL);  -- table "categorie" : un id qui se numérote seul (clé primaire) + un nom texte (50 car. max) obligatoire
CREATE TABLE jeu (                                              -- crée la table "jeu"
  id INT AUTO_INCREMENT PRIMARY KEY, nom VARCHAR(100) NOT NULL,  -- id auto = identifiant unique ; nom obligatoire (100 car. max)
  prix_achat DECIMAL(6,2), prix_location DECIMAL(6,2),          -- deux montants à 2 décimales (DECIMAL évite les erreurs d'arrondi sur l'argent)
  stock_vente INT DEFAULT 0, stock_location INT DEFAULT 0,      -- deux entiers ; DEFAULT 0 = valent 0 si on ne les précise pas
  categorie_id INT, FOREIGN KEY (categorie_id) REFERENCES categorie(id)  -- clé étrangère : categorie_id doit correspondre à un id existant dans "categorie"
);                                                             -- fin de la table jeu
CREATE TABLE utilisateur (                                     -- crée la table "utilisateur"
  id INT AUTO_INCREMENT PRIMARY KEY, login VARCHAR(50) UNIQUE NOT NULL,  -- id auto ; login unique (jamais deux fois le même) et obligatoire
  mot_de_passe_hash VARCHAR(255) NOT NULL, role TINYINT NOT NULL DEFAULT 0  -- empreinte du mot de passe (jamais en clair) ; rôle = petit entier, 0 par défaut
);                                                             -- fin de la table utilisateur</pre>

<h3>4. Évolutions du schéma (migrations)</h3>
<p>Quand le schéma change, on ajoute un script versionné (<code>02-ajout-colonne.sql</code>) plutôt que de modifier l'existant : chaque évolution est tracée, comme un commit. C'est l'idée des <strong>migrations</strong>, gérées ici « à la main » mais rigoureusement versionnées.</p>
<div class="tip">Schéma dans le dépôt + initialisation automatique = une base identique en dev, en CI et en prod. Reproductibilité : la CI teste contre le vrai schéma, pas une approximation.</div>`,
  exercises: [
    { type: "qcm", q: "Le schema.sql est…", opts: ["tapé à la main partout", "versionné dans le dépôt (source unique)", "généré au hasard", "dans l'UI"], a: 1, exp: "Rejouable à l'identique." },
    { type: "qcm", q: "MySQL exécute automatiquement les scripts placés dans…", opts: ["/tmp", "/docker-entrypoint-initdb.d/", "/var/log", "/home"], a: 1, exp: "Au premier démarrage." },
    { type: "qcm", q: "Ces scripts s'exécutent…", opts: ["à chaque requête", "à l'initialisation d'un volume neuf", "jamais", "à chaque commit"], a: 1, exp: "Init d'un volume vide." },
    { type: "qcm", q: "Le préfixe 01- sert à…", opts: ["chiffrer", "ordonner les scripts (schéma avant données)", "accélérer", "rien"], a: 1, exp: "Ordre d'exécution." },
    { type: "qcm", q: ":ro dans le montage signifie…", opts: ["read-only (lecture seule)", "run-once", "root", "remote"], a: 0, exp: "Le fichier n'est pas modifiable." },
    { type: "qcm", q: "Pour rejouer le schéma d'init, il faut…", opts: ["rien", "repartir d'un volume vide", "un COMMIT", "un tag"], a: 1, exp: "Init = volume neuf." },
    { type: "qcm", q: "Une évolution de schéma se fait…", opts: ["en modifiant l'existant", "en ajoutant un script versionné (migration)", "à la main sans trace", "dans l'UI"], a: 1, exp: "Chaque changement tracé." },
    { type: "qcm", q: "L'idée des migrations, c'est…", opts: ["ignorer le schéma", "versionner chaque évolution du schéma", "supprimer la base", "chiffrer"], a: 1, exp: "Comme des commits de schéma." },
    { type: "qcm", q: "Un schéma versionné garantit…", opts: ["rien", "une base identique en dev, CI et prod", "plus de vitesse", "moins de tables"], a: 1, exp: "Reproductibilité." },
    { type: "qcm", q: "La CI teste ainsi contre…", opts: ["une approximation", "le vrai schéma", "aucune base", "la prod"], a: 1, exp: "Fidélité de l'environnement." },
    { type: "vf", q: "Créer les tables à la main sur chaque poste est une bonne pratique.", a: false, exp: "Faux : ça diverge ; on versionne le schéma." },
    { type: "qcm", q: "DECIMAL(6,2) sert pour…", opts: ["un texte", "un montant (prix)", "un id", "une date"], a: 1, exp: "Argent sans erreur d'arrondi." },
    { type: "qcm", q: "La clé étrangère categorie_id garantit…", opts: ["la vitesse", "l'intégrité (catégorie existante)", "le chiffrement", "le tri"], a: 1, exp: "Intégrité référentielle." },
    { type: "qcm", q: "Le login UNIQUE empêche…", opts: ["les jointures", "deux comptes de même login", "les FK", "les prix"], a: 1, exp: "Unicité des comptes." },
    { type: "qcm", q: "Monter schema.sql dans le conteneur évite…", opts: ["les tests", "l'étape manuelle de création des tables", "les commits", "les rôles"], a: 1, exp: "Automatisation." }
  ],
  final: {
    title: "Exercice final — Rendre le schéma reproductible",
    intro: `<p>Une équipe crée les tables à la main sur chaque machine, avec des variantes. Comment fiabiliser ?</p>`,
    questions: [
      { type: "qcm", q: "Le principal risque actuel :", opts: ["aucun", "les schémas divergent d'un poste à l'autre", "trop de tables", "trop lent"], a: 1, exp: "Pas de source unique." },
      { type: "qcm", q: "La solution :", opts: ["un wiki", "un schema.sql versionné, appliqué automatiquement", "des captures d'écran", "rien"], a: 1, exp: "Source unique rejouable." },
      { type: "qcm", q: "Où monter le script pour une init auto ?", opts: ["/root", "/docker-entrypoint-initdb.d/", "/var/log", "/tmp"], a: 1, exp: "Dossier d'init MySQL." },
      { type: "qcm", q: "Une modification de schéma se gère…", opts: ["à la main partout", "par un nouveau script de migration versionné", "sans trace", "dans l'UI"], a: 1, exp: "Évolutions tracées." },
      { type: "qcm", q: "Bénéfice pour la CI :", opts: ["aucun", "elle teste contre le même schéma qu'en prod", "moins de tests", "plus de secrets"], a: 1, exp: "Fidélité." }
    ],
    solution: `<pre class="pseudo"># docker-compose.yml (service db)
    volumes:                         # les montages du conteneur MySQL
      - dbdata:/var/lib/mysql        # volume de persistance : conserve les données
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro   # 01 = la structure (tables), exécutée en premier, en lecture seule
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro   # 02 = les données de test, exécutées ensuite

# Évolutions : 03-ajout-date-location.sql, 04-..., chacun versionné dans Git.</pre>
<p>Le schéma (et les migrations) vivent dans le dépôt et s'appliquent automatiquement : une base identique partout. Demain : le modèle et le DAO, testés dès l'écriture.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ta config / SQL ici…",
  items: [
  { id: "projcpro-l04", title: "Monter le schéma dans le conteneur", level: 2,
    statement: "Écris l'extrait du service « db » qui monte deux fichiers dans /docker-entrypoint-initdb.d/ en lecture seule : 01-schema.sql (structure) et 02-seed.sql (données de test), en plus du volume de persistance dbdata.",
    hints: [
      "Le volume dbdata garde les données ; les scripts d'init créent la structure.",
      "Ordonne avec les préfixes 01- et 02-.",
      "Monte en lecture seule avec :ro."
    ],
    solution: "services:\n  db:                              # le service base de donnees\n    image: mysql:8.4                 # image officielle MySQL 8.4\n    volumes:                         # montages du conteneur\n      - dbdata:/var/lib/mysql        # volume de persistance des donnees\n      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro   # 01 : structure des tables, en lecture seule\n      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro   # 02 : donnees de test, en lecture seule\n\nvolumes:                             # declaration des volumes\n  dbdata:                            # definit le volume dbdata",
    note: "Les scripts numérotés s'exécutent dans l'ordre au premier démarrage : structure d'abord, données de test ensuite. Montés en lecture seule, ils ne risquent pas d'être modifiés par le conteneur." }
  ]
};
</script>
