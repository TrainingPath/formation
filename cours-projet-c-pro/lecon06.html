<script>
var DAY = {
  num: 6,
  title: "La couche service et les règles métier, sous CI",
  subtitle: "Chaque règle arrive avec son test ; le métier n'avance que si le pipeline reste vert.",
  theory: `
<h3>1. Une règle, un test</h3>
<p>Une <strong>règle métier</strong> est une décision propre à l'activité (« −10 % au-delà de 3 jours de location ») ; un <strong>service</strong> est la couche de code qui regroupe ces règles, séparée de l'affichage et de la base. Comme dans le capstone « à la main », les règles métier vivent dans les services. La différence : ici, on n'ajoute <strong>aucune règle sans son test</strong>, et la CI l'exécute automatiquement. Note utile : quand on manipule une fiche via un <strong>pointeur</strong> (une flèche qui désigne la fiche au lieu d'en faire une copie), on lit ses champs avec <code>-&gt;</code> : <code>j-&gt;prix_location</code> veut dire « le prix_location de la fiche pointée par j ».</p>
<pre class="pseudo">double service_tarif(const Jeu *j, int jours) {  // calcule le prix de location : reçoit la fiche (pointeur j) et un nombre de jours ; renvoie un double
    double t = j->prix_location * jours;         // tarif de base = prix par jour × nombre de jours
    if (jours &gt;= 3) t *= 0.9;                     // si au moins 3 jours : remise de 10 % (t *= 0.9 signifie t = t × 0,9)
    return t;                                     // renvoie le tarif final
}
/* test livré avec la règle */
CHECK(service_tarif(&amp;j5, 1) == 5.0);             // 1 jour à 5.0 : pas de remise → 5.0 (&j5 = adresse de la fiche j5)
CHECK(service_tarif(&amp;j5, 4) == 18.0);            // 4 jours : 5×4=20, puis −10 % → 18.0</pre>

<h3>2. Le job « test » dans le pipeline</h3>
<pre class="pseudo"># ci.yml
  test:                            # job "test"
    runs-on: ubuntu-latest         # runner Linux Ubuntu
    steps:                         # étapes
      - uses: actions/checkout@v4  # récupère le code du dépôt
      - run: sudo apt-get install -y libmysqlclient-dev   # installe la bibliothèque MySQL
      - run: make test        # compile et exécute les tests ; ./tests renvoie 1 si un test échoue → CI rouge</pre>

<h3>3. Le métier n'avance que vert</h3>
<div class="warn">Règle d'équipe : on ne fusionne pas une pull request tant que le job <code>test</code> n'est pas vert. Une régression dans une règle métier bloque l'intégration <strong>avant</strong> d'atteindre <code>main</code>. La qualité n'est pas une étape finale, c'est une condition permanente.</p></div>

<h3>4. Des fonctions pures, faciles en CI</h3>
<p>Parce que les services sont <strong>purs</strong> (pas de MySQL ni d'écran), leurs tests sont rapides et déterministes : parfaits pour une CI qui doit rester rapide. On garde les tests lents (base) pour un job d'intégration séparé (leçon 11).</p>
<div class="tip">Le duo « règle + test » transforme chaque comportement en contrat vérifié. Refactoriser devient serein : si un test casse, on le voit tout de suite, dans la CI, avant la revue.</div>`,
  exercises: [
    { type: "qcm", q: "Dans le projet pro, ajoute-t-on une règle sans test ?", opts: ["oui", "non : chaque règle vient avec son test", "parfois", "seulement en prod"], a: 1, exp: "Règle + test ensemble." },
    { type: "qcm", q: "Les règles métier vivent dans…", opts: ["l'UI", "les services", "le DAO", "le Dockerfile"], a: 1, exp: "La couche qui décide." },
    { type: "qcm", q: "Le job test échoue si…", opts: ["le build est lent", "un test échoue (./tests renvoie 1)", "il y a trop de fichiers", "une branche reste ouverte"], a: 1, exp: "CI rouge." },
    { type: "qcm", q: "On fusionne une PR…", opts: ["toujours", "seulement si le job test est vert", "après un simple coup d'œil", "en prod d'abord"], a: 1, exp: "Qualité = condition de fusion." },
    { type: "qcm", q: "Une régression métier est bloquée…", opts: ["après la prod", "avant d'atteindre main (dans la CI)", "au moment du déploiement", "par l'utilisateur final"], a: 1, exp: "Barrière précoce." },
    { type: "qcm", q: "Pourquoi les services sont-ils faciles à tester en CI ?", opts: ["ils consomment peu de mémoire", "ils sont purs (pas de MySQL ni écran) : rapides et déterministes", "ils s'exécutent en parallèle", "ils sont bien commentés"], a: 1, exp: "Idéal pour une CI rapide." },
    { type: "qcm", q: "Les tests lents (base) sont…", opts: ["dans le même job", "dans un job d'intégration séparé", "lancés à la main", "en prod"], a: 1, exp: "Séparés pour la vitesse." },
    { type: "qcm", q: "service_tarif(&j5, 4) avec prix 5.0 vaut…", opts: ["20.0", "18.0", "15.0", "5.0"], a: 1, exp: "5×4×0.9." },
    { type: "qcm", q: "La qualité, dans ce cours, est…", opts: ["une étape finale", "une condition permanente", "l'affaire du relecteur seul", "réservée à la prod"], a: 1, exp: "Vert en continu." },
    { type: "qcm", q: "Le duo « règle + test » transforme un comportement en…", opts: ["simple commentaire", "contrat vérifié", "note d'affichage", "hypothèse non vérifiée"], a: 1, exp: "Spécification exécutable." },
    { type: "vf", q: "Refactoriser est plus serein avec des tests qui cassent visiblement en CI.", a: true, exp: "On voit tout de suite une régression." },
    { type: "qcm", q: "make test fait…", opts: ["déployer", "compiler et exécuter le harnais de tests", "lancer les conteneurs", "nettoyer le build"], a: 1, exp: "Construction + exécution." },
    { type: "qcm", q: "Un test « déterministe » donne…", opts: ["un résultat aléatoire", "toujours le même résultat pour la même entrée", "un résultat selon l'heure", "un résultat selon la machine"], a: 1, exp: "Fiabilité en CI." },
    { type: "qcm", q: "Où NE doit PAS vivre une règle de tarif ?", opts: ["dans le service", "dans l'UI ou le DAO", "dans un test", "dans services.c"], a: 1, exp: "Le métier reste centralisé." },
    { type: "qcm", q: "Le job test dépend logiquement…", opts: ["du déploiement", "de la compilation réussie", "d'une base distante", "de l'interface utilisateur"], a: 1, exp: "On teste du code qui compile." }
  ],
  final: {
    title: "Exercice final — Livrer une règle avec son test",
    intro: `<p>On ajoute la règle « remise fidélité » : -5 % supplémentaires si l'utilisateur est un client fidèle. On veut la livrer proprement.</p>`,
    questions: [
      { type: "qcm", q: "Où placer cette règle ?", opts: ["dans l'UI", "dans un service (fonction pure)", "dans le DAO", "dans le Dockerfile"], a: 1, exp: "Le métier au service." },
      { type: "qcm", q: "Que livre-t-on AVEC la règle ?", opts: ["un simple commentaire", "son test (au moins un cas nominal et un cas limite)", "une capture d'écran", "une documentation seule"], a: 1, exp: "Règle + test." },
      { type: "qcm", q: "Le test doit s'exécuter…", opts: ["à la main parfois", "automatiquement en CI (make test)", "une fois par sprint", "en prod"], a: 1, exp: "Pipeline." },
      { type: "qcm", q: "Si le test échoue en CI…", opts: ["on fusionne quand même", "on ne fusionne pas (rouge)", "on relance sans corriger", "on déploie"], a: 1, exp: "Barrière de fusion." },
      { type: "qcm", q: "La fonction étant pure, son test est…", opts: ["lent et fragile", "rapide et déterministe", "dépendant du réseau", "lié à l'affichage"], a: 1, exp: "Idéal pour la CI." }
    ],
    solution: `<pre class="pseudo">/* services.c */
double service_tarif_fidele(const Jeu *j, int jours, int fidele) {  // tarif avec remise fidélité (fidele = 1 si client fidèle, 0 sinon)
    double t = service_tarif(j, jours);   // réutilise la règle de base (calcul + remise durée)
    if (fidele) t *= 0.95;                // si fidèle : −5 % supplémentaires
    return t;                             // renvoie le tarif final
}
/* tests livrés avec la règle */
CHECK(service_tarif_fidele(&amp;j5, 4, 0) == 18.0);          // client non fidèle : 18.0 (aucune remise en plus)
CHECK(service_tarif_fidele(&amp;j5, 4, 1) == 18.0 * 0.95);   // client fidèle : 18.0 − 5 % = 17.1

# ci.yml : make test exécute ces assertions à chaque push.</pre>
<p>La règle réutilise l'existant, arrive avec ses tests, et la CI garantit qu'elle reste correcte. Demain : les requêtes préparées et le job de tests au vert.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  "placeholder": "Écris ton code C ici…",
  "items": [
    {
      "id": "projcpro-l06",
      "title": "Une règle de plafond, testée",
      "level": 2,
      "statement": "Écris une fonction pure service_tarif_plafonne(const Jeu *j, int jours, double plafond) qui renvoie le tarif de location (via service_tarif) mais jamais au-dessus du plafond. Ajoute deux CHECK : un cas sous le plafond, un cas plafonné.",
      "hints": [
        "Calcule t = service_tarif(j, jours).",
        "return t > plafond ? plafond : t;",
        "CHECK d'un cas normal et d'un cas où t dépasse le plafond."
      ],
      "solution": "#include <stdio.h>\ntypedef struct { double tarif_jour; } Jeu;\ndouble service_tarif(const Jeu *j, int jours) {\n    double t = j->tarif_jour * jours;\n    if (jours >= 7) t *= 0.9;\n    return t;\n}\ndouble service_tarif_plafonne(const Jeu *j, int jours, double plafond) {\n    double t = service_tarif(j, jours);\n    return t > plafond ? plafond : t;\n}\nstatic int _pass = 0, _tot = 0;\n#define CHECK(c) do { _tot++; if (c) _pass++; else printf(\"FAIL ligne %d\\n\", __LINE__); } while (0)\nint main(void) {\n    Jeu j5 = { 5.0 };\n    CHECK(service_tarif_plafonne(&j5, 1, 100.0) == 5.0);\n    CHECK(service_tarif_plafonne(&j5, 10, 30.0) == 30.0);\n    printf(\"%d/%d tests OK\\n\", _pass, _tot);\n    return _pass == _tot ? 0 : 1;\n}\n",
      "note": "La fonction reste pure : elle compose la règle de base et un plafond, sans toucher ni base ni écran. Les deux CHECK couvrent le cas nominal et le cas limite, et tournent en CI à chaque push.",
      "lang": "c",
      "atoi": {
        "cmd": "gcc prog.c -o prog && ./prog",
        "expected": "2/2 tests OK"
      },
      "checklist": [
        "La fonction reste-t-elle pure (aucun accès base ni écran, juste un calcul) ?",
        "Le plafond est-il appliqué avec un test clair (t > plafond ? plafond : t) ?",
        "Tes deux CHECK couvrent-ils le cas sous le plafond ET le cas plafonné ?"
      ]
    }
  ]
};
