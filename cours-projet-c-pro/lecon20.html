<script>
var DAY = {
  num: 20,
  title: "Observabilité, sauvegardes, RGPD et rollback",
  subtitle: "Exploiter en production : voir, restaurer, respecter les personnes, revenir en arrière.",
  theory: `
<h3>1. Observabilité : voir ce qui se passe</h3>
<pre class="pseudo">fprintf(stderr, "[INFO] location creee user=%d jeu=%d\\n", uid, jeu_id);   // écrit un journal d'information sur stderr ; %d = un nombre (ici les id user et jeu), \n = fin de ligne
fprintf(stderr, "[ERREUR] %s\\n", mysql_error(c));   // écrit un journal d'erreur ; %s = un texte (ici le message d'erreur renvoyé par MySQL)</pre>
<p>L'<strong>observabilité</strong>, c'est la capacité de voir ce qui se passe à l'intérieur du programme une fois en service. Un <strong>log</strong> (journal) est une ligne de texte que le programme écrit pour raconter un événement (« location créée », « erreur base »). Ces logs partent sur la <strong>sortie standard/erreur</strong> (stdout/stderr, les canaux d'affichage du programme), où l'orchestrateur les collecte. On <em>journalise</em> les événements importants (connexions, échecs, opérations) — mais <strong>jamais</strong> de secret ni de donnée personnelle.</p>

<h3>2. Sauvegardes testées</h3>
<pre class="pseudo">mysqldump ludotheque > backup-$(date +%F).sql   # exporte toute la base "ludotheque" ; > envoie le résultat dans un fichier backup-DATE.sql ($(date +%F) insère la date du jour) ; planifié chaque jour</pre>
<div class="warn">Une sauvegarde qui n'a jamais été <strong>restaurée</strong> ne vaut rien : on teste régulièrement la restauration sur un environnement à part. Sinon, on découvre le jour du sinistre qu'elle était corrompue.</p></div>

<h3>3. RGPD : minimisation et droits</h3>
<pre class="pseudo">• Ne collecter que le nécessaire (minimisation)
• Permettre l'effacement d'un compte (droit à l'oubli)
• Ne jamais journaliser email / mot de passe / données sensibles
• Sécuriser l'accès aux données personnelles (rôles, chiffrement au repos)</pre>
<p>Le RGPD n'est pas une option : traiter des données de personnes impose des devoirs concrets, dès la conception (<em>privacy by design</em>).</p>

<h3>4. Rollback</h3>
<pre class="pseudo"># chaque version publiée reste au registre
docker compose pull ludotheque:v1.3.4    # télécharge l'image de la version précédente connue (v1.3.4) depuis le registre
docker compose up -d                     # (re)démarre les conteneurs avec cette image (-d = en arrière-plan) : retour en arrière en quelques minutes</pre>
<div class="tip">Les quatre piliers de l'exploitation : <strong>observer</strong> (logs), <strong>restaurer</strong> (sauvegardes testées), <strong>respecter</strong> (RGPD), <strong>revenir</strong> (rollback). Un service pro n'est pas seulement livré : il est exploitable, réversible et conforme.</div>`,
  exercises: [
    { type: "qcm", q: "L'observabilité, c'est…", opts: ["cacher les erreurs", "voir ce qui se passe (logs, métriques)", "accélérer le programme", "supprimer les journaux"], a: 1, exp: "Diagnostiquer en prod." },
    { type: "qcm", q: "Les logs ne contiennent JAMAIS…", opts: ["un horodatage", "de secret ni de donnée personnelle", "un code d'erreur", "un id d'opération"], a: 1, exp: "Pas de données sensibles." },
    { type: "qcm", q: "Une sauvegarde jamais restaurée…", opts: ["est fiable", "ne vaut rien (peut être corrompue)", "est chiffrée", "suffit à elle seule"], a: 1, exp: "Tester la restauration." },
    { type: "qcm", q: "mysqldump sert à…", opts: ["créer la base", "sauvegarder la base", "restaurer la base", "vider la base"], a: 1, exp: "Export de la base." },
    { type: "qcm", q: "La minimisation RGPD signifie…", opts: ["tout collecter", "ne collecter que le nécessaire", "chiffrer tout", "conserver tout indéfiniment"], a: 1, exp: "Moins de données = moins de risque." },
    { type: "qcm", q: "Le droit à l'oubli impose…", opts: ["de chiffrer chaque compte", "de permettre l'effacement d'un compte/données", "de tout garder", "d'afficher les données"], a: 1, exp: "Effacement sur demande." },
    { type: "qcm", q: "« Privacy by design » veut dire…", opts: ["ajouter la vie privée à la fin", "penser la protection des données dès la conception", "sécuriser une fois en ligne", "chiffrer tout le trafic"], a: 1, exp: "Dès le départ." },
    { type: "qcm", q: "Le rollback consiste à…", opts: ["recompiler tout en urgence", "revenir à une version précédente connue", "passer à la version suivante", "corriger le bug à chaud"], a: 1, exp: "Retour arrière." },
    { type: "qcm", q: "Le rollback est possible car…", opts: ["on garde chaque version au registre", "on recompile tout", "on supprime les anciennes", "on garde le code source"], a: 0, exp: "Images versionnées conservées." },
    { type: "qcm", q: "Les quatre piliers de l'exploitation :", opts: ["build, test, deploy, scan", "observer, restaurer, respecter, revenir", "UI, service, DAO, base", "hash, sel, session, rôle"], a: 1, exp: "Exploitation pro." },
    { type: "vf", q: "Journaliser l'email d'un utilisateur est une bonne pratique de debug.", a: false, exp: "Faux : jamais de donnée personnelle dans les logs (RGPD)." },
    { type: "qcm", q: "Où vont les logs en conteneur ?", opts: ["dans le code", "sur stdout/stderr, collectés par l'orchestrateur", "dans Git", "dans la base de données"], a: 1, exp: "Sorties standard." },
    { type: "qcm", q: "Le RGPD est…", opts: ["optionnel", "un ensemble de devoirs concrets sur les données personnelles", "un outil de test", "un format de sauvegarde"], a: 1, exp: "Obligations légales." },
    { type: "qcm", q: "Un rollback prend idéalement…", opts: ["des jours", "quelques minutes (redéployer l'image précédente)", "plusieurs heures", "une journée entière"], a: 1, exp: "Rapide grâce aux images." },
    { type: "qcm", q: "Sauvegarde + test de restauration protègent contre…", opts: ["les injections", "la perte de données (sinistre, corruption)", "les pannes réseau", "les débordements"], a: 1, exp: "Continuité." }
  ],
  final: {
    title: "Exercice final — Préparer l'imprévu",
    intro: `<p>Un service pro tourne, mais l'équipe n'a ni logs exploitables, ni sauvegarde testée, ni plan de retour arrière. Que mettre en place ?</p>`,
    questions: [
      { type: "qcm", q: "Pour diagnostiquer les incidents :", opts: ["un accès direct à la prod", "des logs structurés (sans secrets/données perso)", "des logs contenant les mots de passe", "des captures d'écran"], a: 1, exp: "Observabilité." },
      { type: "qcm", q: "Pour se remettre d'une perte de données :", opts: ["une sauvegarde jamais testée", "des sauvegardes régulières ET testées en restauration", "davantage de logs", "un scan de l'image"], a: 1, exp: "Sauvegardes fiables." },
      { type: "qcm", q: "Pour respecter les utilisateurs :", opts: ["tout collecter", "minimisation, droit à l'oubli, pas de données perso dans les logs", "afficher les emails", "chiffrer le code source"], a: 1, exp: "RGPD." },
      { type: "qcm", q: "Pour réagir à un déploiement raté :", opts: ["forcer la version cassée", "un rollback vers la version précédente", "redéployer la même image", "désactiver les contrôles"], a: 1, exp: "Retour arrière." },
      { type: "qcm", q: "Ces garde-fous se préparent…", opts: ["après le sinistre", "avant (à froid), pas dans l'urgence", "quand un client se plaint", "en prod à chaud"], a: 1, exp: "Anticipation." }
    ],
    solution: `<pre class="pseudo">Observabilité : logs [INFO]/[ERREUR] vers stderr (aucun secret ni email)
Sauvegardes  : mysqldump quotidien + test de restauration mensuel sur env. à part
RGPD         : minimiser les données, offrir l'effacement de compte,
               ne jamais logguer email/mot de passe, restreindre l'accès
Rollback     : garder chaque image (registre) ;
               docker compose pull ludotheque:vPRECEDENTE && up -d</pre>
<p>Observer, restaurer, respecter, revenir : l'exploitation d'un vrai service. Tout se prépare à froid, pas dans l'urgence. Demain : le récapitulatif et l'examen final.</p>`
  }
};
</script>
