<script>
var DAY = {
  num: 2,
  title: "Le squelette C dans Docker Compose",
  subtitle: "Faire tourner le code C et MySQL ensemble, à l'identique partout.",
  theory: `
<h3>1. Deux services : app et db</h3>
<p>Rappel : un <strong>conteneur</strong> est une boîte qui emballe un programme avec tout son environnement. <strong>Docker Compose</strong> est l'outil qui décrit, dans un simple fichier texte, plusieurs conteneurs et la façon dont ils se parlent. Ce fichier est écrit en <strong>YAML</strong>, un format où le <em>décalage</em> (l'indentation, ces espaces en début de ligne) indique ce qui appartient à quoi, comme les puces et sous-puces d'une liste. Chaque conteneur y est appelé un <strong>service</strong>. Ici il y en a deux : <code>app</code> (notre programme C) et <code>db</code> (<strong>MySQL</strong>, un logiciel de <em>base de données</em> — un grand classeur électronique qui range et retrouve des informations). Ils démarrent ensemble et communiquent par un <strong>réseau</strong> interne privé que Compose crée pour eux, comme un interphone reliant deux pièces.</p>
<pre class="pseudo">services:                            # la liste des conteneurs (« services ») à faire tourner
  db:                                # 1er service : la base de données ; on la nomme "db"
    image: mysql:8.4                 # image toute prête : MySQL version 8.4 (rien à construire)
    environment:                     # réglages passés au conteneur, sous forme de variables
      MYSQL_DATABASE: ludotheque     # crée automatiquement une base nommée "ludotheque"
      MYSQL_USER: ludo               # crée un utilisateur "ludo" pour se connecter à la base
      MYSQL_PASSWORD: \${DB_PASSWORD} # son mot de passe, LU dans une variable externe (jamais écrit ici)
    volumes:                         # espaces de stockage qui survivent au conteneur
      - dbdata:/var/lib/mysql        # range les données MySQL dans le volume "dbdata" (persistance)
  app:                               # 2e service : notre programme C ; on le nomme "app"
    build: .                          # construit son image depuis le Dockerfile du dossier courant (.)
    depends_on: [db]                 # attend que "db" soit démarré avant de lancer "app"
    environment:                     # réglages passés à notre programme
      DB_HOST: db                     # adresse de la base = le nom du service "db" (voir §2)
      DB_USER: ludo                  # même utilisateur que côté base
      DB_PASSWORD: \${DB_PASSWORD}    # même mot de passe, lu dans la variable externe
      DB_NAME: ludotheque            # nom de la base à ouvrir
volumes:                             # déclaration des volumes utilisés plus haut
  dbdata:                            # définit le volume "dbdata" (géré par Docker)</pre>
<p>Deux mots à retenir. Une <strong>image</strong> est un modèle de conteneur déjà tout prêt, téléchargé depuis une bibliothèque publique (comme un plat surgelé qu'on n'a plus qu'à réchauffer) : <code>mysql:8.4</code> est l'image officielle de MySQL. Une <strong>variable d'environnement</strong> est un réglage nommé donné au programme au démarrage (comme un post-it « voici ton mot de passe ») ; c'est là qu'on place les secrets pour ne jamais les écrire en clair dans le fichier.</p>

<h3>2. Le nom du service est le nom d'hôte</h3>
<p>Dans le réseau Compose, <code>app</code> joint la base à l'adresse <code>db</code> : c'est pourquoi <code>DB_HOST</code> vaut <code>db</code>, pas <code>localhost</code>. Compose gère la résolution des noms.</p>

<h3>3. Les volumes : ne pas perdre les données</h3>
<div class="warn">Sans <strong>volume</strong>, les données MySQL disparaissent quand le conteneur est recréé. Le volume <code>dbdata</code> les conserve sur l'hôte. Les secrets, eux, restent dans des <strong>variables</strong> (<code>\${DB_PASSWORD}</code>), jamais écrits en dur dans le fichier.</p></div>

<h3>4. Le cycle de travail</h3>
<pre class="pseudo">docker compose up --build     # construit et démarre app + db
docker compose logs -f app    # suit les logs
docker compose down           # arrête (les volumes persistent)</pre>
<div class="tip">Chaque contributeur lance exactement le même environnement d'une commande. La CI utilisera la même image, garantissant que « testé en CI » veut dire « testé dans le vrai environnement ».</div>`,
  exercises: [
    { type: "qcm", q: "Docker Compose décrit…", opts: ["un seul conteneur", "plusieurs services et leurs liens", "le code C", "le Makefile"], a: 1, exp: "app + db ici." },
    { type: "qcm", q: "Les deux services du projet :", opts: ["app et db", "web et cache", "front et back", "test et prod"], a: 0, exp: "Le programme C et MySQL." },
    { type: "qcm", q: "DB_HOST vaut db parce que…", opts: ["c'est localhost", "le nom du service est le nom d'hôte réseau", "MySQL l'exige", "au hasard"], a: 1, exp: "Compose résout les noms." },
    { type: "qcm", q: "Un volume sert à…", opts: ["accélérer", "conserver les données au-delà de la vie du conteneur", "chiffrer", "compiler"], a: 1, exp: "Persistance sur l'hôte." },
    { type: "qcm", q: "Sans volume, les données MySQL…", opts: ["persistent", "disparaissent quand le conteneur est recréé", "sont chiffrées", "vont dans Git"], a: 1, exp: "D'où le volume dbdata." },
    { type: "qcm", q: "Les secrets dans le compose sont…", opts: ["en dur", "des variables (${DB_PASSWORD})", "affichés", "dans le code C"], a: 1, exp: "Jamais écrits en clair." },
    { type: "qcm", q: "depends_on: [db] signifie…", opts: ["db dépend de app", "app démarre après db", "rien", "les deux fusionnent"], a: 1, exp: "Ordre de démarrage." },
    { type: "qcm", q: "build: . indique…", opts: ["une image toute faite", "construire l'image depuis le Dockerfile local", "un volume", "un réseau"], a: 1, exp: "Image bâtie sur place." },
    { type: "qcm", q: "docker compose up --build fait…", opts: ["arrêter", "construire et démarrer les services", "supprimer les volumes", "committer"], a: 1, exp: "Démarrage complet." },
    { type: "qcm", q: "docker compose down…", opts: ["supprime le code", "arrête les services (les volumes persistent)", "déploie en prod", "compile"], a: 1, exp: "Arrêt propre." },
    { type: "vf", q: "Chaque contributeur obtient le même environnement d'une commande.", a: true, exp: "C'est l'intérêt de Compose." },
    { type: "qcm", q: "La CI utilise…", opts: ["un autre environnement", "la même image/compose que les développeurs", "aucune image", "la prod directement"], a: 1, exp: "« Testé en CI » = vrai environnement." },
    { type: "qcm", q: "image: mysql:8.4 signifie…", opts: ["compiler MySQL", "utiliser l'image officielle MySQL version 8", "un volume", "un secret"], a: 1, exp: "Image prête à l'emploi." },
    { type: "qcm", q: "docker compose logs -f app…", opts: ["compile app", "suit en direct les logs du service app", "supprime app", "déploie"], a: 1, exp: "Observation en direct." },
    { type: "qcm", q: "La persistance des données repose sur…", opts: ["depends_on", "le volume dbdata", "le nom d'hôte", "le Makefile"], a: 1, exp: "Volume monté sur MySQL." }
  ],
  final: {
    title: "Exercice final — Corriger un compose",
    intro: `<p>Un docker-compose problématique. Analyse :</p>
<pre class="pseudo">services:                        # la liste des services
  db:                            # le service base de données
    image: mysql:8.4             # image officielle MySQL 8.4
    environment:                 # réglages du conteneur MySQL
      MYSQL_PASSWORD: Secret123! # mot de passe écrit EN DUR dans le fichier (à interroger…)
  app:                           # le service programme C
    build: .                     # image construite depuis le Dockerfile local
    environment:                 # réglages du programme
      DB_HOST: localhost         # adresse de la base donnée comme "localhost" (à interroger…)</pre>`,
    questions: [
      { type: "qcm", q: "Problème n°1 — le mot de passe en dur :", opts: ["aucun", "il doit venir d'une variable (${DB_PASSWORD}), pas du fichier versionné", "trop court", "trop long"], a: 1, exp: "Secret dans le dépôt." },
      { type: "qcm", q: "Problème n°2 — DB_HOST: localhost :", opts: ["correct", "app doit joindre db par son nom de service : DB_HOST: db", "il faut 127.0.0.1", "rien"], a: 1, exp: "localhost pointerait vers app lui-même." },
      { type: "qcm", q: "Manque n°3 — pour ne pas perdre les données :", opts: ["rien", "un volume pour /var/lib/mysql", "un healthcheck seul", "un réseau"], a: 1, exp: "Persistance." },
      { type: "qcm", q: "Manque n°4 — l'ordre de démarrage :", opts: ["rien", "depends_on: [db] pour app", "un volume", "un secret"], a: 1, exp: "app après db." },
      { type: "qcm", q: "Les secrets viennent idéalement…", opts: ["du YAML", "de variables d'environnement / d'un .env non versionné", "du code C", "d'un printf"], a: 1, exp: "Jamais en clair dans le compose." }
    ],
    solution: `<pre class="pseudo">services:                            # les conteneurs à lancer
  db:                                # service base de données
    image: mysql:8.4                 # image officielle MySQL 8.4
    environment:                     # réglages de la base
      MYSQL_DATABASE: ludotheque     # crée la base "ludotheque"
      MYSQL_USER: ludo               # crée l'utilisateur "ludo"
      MYSQL_PASSWORD: \${DB_PASSWORD} # mot de passe lu dans une variable externe (corrige le secret en dur)
    volumes:                         # stockage persistant
      - dbdata:/var/lib/mysql        # conserve les données de la base (corrige l'oubli de persistance)
  app:                               # service programme C
    build: .                         # construit l'image depuis le Dockerfile local
    depends_on: [db]                 # démarre app APRÈS db (corrige l'ordre de démarrage)
    environment:                     # réglages du programme
      DB_HOST: db                    # joint la base par son nom de service (corrige "localhost")
      DB_PASSWORD: \${DB_PASSWORD}   # même secret, lu dans la variable externe
volumes:                             # déclaration des volumes
  dbdata:                            # définit le volume de persistance</pre>
<p>Secrets externalisés, bon nom d'hôte, volume de persistance, ordre de démarrage. L'environnement est reproductible. Demain : Git, branches et la première CI.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  items: [
  { id: "projcpro-l02", title: "Le service db", level: 2,
    statement: "Écris le service « db » d'un docker-compose : image mysql:8.4, la base ludotheque, l'utilisateur ludo, le mot de passe issu de la variable ${DB_PASSWORD}, et un volume dbdata pour persister /var/lib/mysql.",
    hints: [
      "environment : MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD.",
      "MYSQL_PASSWORD: ${DB_PASSWORD} (pas de valeur en dur).",
      "volumes : - dbdata:/var/lib/mysql, et déclarer dbdata en bas."
    ],
    solution: "services:\n  db:                              # le service base de donnees\n    image: mysql:8.4                 # image officielle MySQL 8.4 (prete a l'emploi)\n    environment:                     # variables de configuration du conteneur\n      MYSQL_DATABASE: ludotheque     # cree automatiquement la base ludotheque\n      MYSQL_USER: ludo               # cree l'utilisateur ludo\n      MYSQL_PASSWORD: ${DB_PASSWORD}   # mot de passe lu dans une variable externe (jamais en dur)\n      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}   # mot de passe administrateur, aussi externalise\n    volumes:                         # espace de stockage persistant\n      - dbdata:/var/lib/mysql        # range les donnees MySQL dans le volume dbdata\n\nvolumes:                             # on declare ici les volumes utilises\n  dbdata:                            # definit le volume dbdata (gere par Docker)",
    note: "Le mot de passe vient d'une variable, jamais du fichier versionné. Le volume dbdata conserve les données quand le conteneur est recréé : sans lui, chaque redémarrage repartirait d'une base vide." }
  ]
};
