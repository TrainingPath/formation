<script>
var DAY = {
  num: 19,
  title: "Déploiement automatisé : staging, production, santé",
  subtitle: "Livrer sans intervention manuelle, avec un palier de vérification avant la production.",
  theory: `
<h3>1. Deux environnements, deux déclencheurs</h3>
<pre class="pseudo">fusion en main       → déploiement automatique en STAGING (préproduction)
tag de version vX.Y.Z → déploiement en PRODUCTION</pre>
<p>La <strong>production</strong> (« la prod ») est l'environnement réel, celui qu'utilisent les vrais clients. Le <strong>staging</strong> (préproduction) est une copie fidèle de la prod, où l'on valide en conditions réelles sans risque. On ne <em>promeut</em> (fait passer) en production que ce qui a passé le staging, et cela se déclenche par un <strong>tag</strong> : une étiquette posée sur une version précise du code (par exemple <code>v1.4.0</code>), comme un marque-page nommé dans l'historique Git.</p>

<h3>2. Le healthcheck</h3>
<p>Un <strong>healthcheck</strong> (« contrôle de santé ») est une petite sonde qui interroge régulièrement le service pour vérifier qu'il répond vraiment — comme prendre le pouls d'un patient. Tant qu'il ne répond pas, le conteneur est marqué « malade » ; dès qu'il répond, il passe « sain » (healthy).</p>
<pre class="pseudo"># docker-compose : le conteneur signale son état
    healthcheck:                                          # définit la sonde de santé du service
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]   # commande de test : "mysqladmin ping" demande à MySQL s'il répond
      interval: 10s                                       # refait le test toutes les 10 secondes
      retries: 5                                          # déclare le service "malade" seulement après 5 échecs consécutifs</pre>
<div class="warn">Après un déploiement, on <strong>attend que le service soit sain</strong> (healthy) avant de le considérer en ligne. Un service qui ne répond pas déclenche un échec — et non une mise en ligne d'une version cassée.</p></div>

<h3>3. Promotion contrôlée</h3>
<pre class="pseudo">1. déployer en staging     (auto sur main)
2. vérifier la santé       (healthcheck vert)
3. tester en préproduction (smoke tests)
4. taguer vX.Y.Z           → déploiement production
5. vérifier la santé en prod ; sinon rollback</pre>

<h3>4. Le versionnement sémantique</h3>
<pre class="pseudo">v1.4.2  =  MAJEUR.MINEUR.CORRECTIF
MAJEUR  : changement incompatible
MINEUR  : nouvelle fonctionnalité compatible
CORRECTIF: correction de bug</pre>
<div class="tip">Le tag semver identifie précisément ce qui tourne en production et permet de revenir à une version antérieure connue. Déploiement automatisé ne veut pas dire imprudent : chaque promotion passe par la santé et un tag traçable.</div>`,
  exercises: [
    { type: "qcm", q: "Une fusion en main déclenche…", opts: ["la production", "le déploiement en staging", "un tag de version", "un rollback"], a: 1, exp: "Préproduction automatique." },
    { type: "qcm", q: "La production est déployée sur…", opts: ["chaque commit", "un tag de version (vX.Y.Z)", "chaque push", "chaque fusion en main"], a: 1, exp: "Promotion explicite." },
    { type: "qcm", q: "Le staging sert à…", opts: ["développer de nouvelles fonctions", "valider en conditions réelles avant la prod", "remplacer les tests unitaires", "stocker les sauvegardes"], a: 1, exp: "Copie de la prod." },
    { type: "qcm", q: "Un healthcheck vérifie…", opts: ["la version du code", "que le service est sain (répond)", "l'espace disque libre", "le nombre de connexions"], a: 1, exp: "État de santé." },
    { type: "qcm", q: "Après déploiement, on attend…", opts: ["la fin de la compilation", "que le service soit healthy avant de le déclarer en ligne", "un scan de l'image", "un tag"], a: 1, exp: "Pas de mise en ligne cassée." },
    { type: "qcm", q: "Un service qui ne répond pas déclenche…", opts: ["une mise en ligne", "un échec (et pas une version cassée en ligne)", "une promotion automatique", "un simple avertissement"], a: 1, exp: "Sécurité de déploiement." },
    { type: "qcm", q: "On promeut en prod…", opts: ["chaque commit récent", "ce qui a passé le staging", "le code non testé", "une version non validée"], a: 1, exp: "Palier de validation." },
    { type: "qcm", q: "semver v1.4.2 signifie…", opts: ["une date", "MAJEUR.MINEUR.CORRECTIF", "un hash", "un numéro de build"], a: 1, exp: "Versionnement sémantique." },
    { type: "qcm", q: "Un incrément MAJEUR indique…", opts: ["un correctif", "un changement incompatible", "une nouveauté compatible", "un simple renommage"], a: 1, exp: "Rupture de compatibilité." },
    { type: "qcm", q: "Le tag semver permet…", opts: ["de supprimer les versions passées", "d'identifier la version en prod et de revenir en arrière", "de réduire la taille de l'image", "de masquer le code source"], a: 1, exp: "Traçabilité + rollback." },
    { type: "vf", q: "Déploiement automatisé signifie déployer sans aucune vérification.", a: false, exp: "Faux : chaque promotion passe par la santé et un tag traçable." },
    { type: "qcm", q: "Les smoke tests en préproduction vérifient…", opts: ["tout en détail", "que les fonctions vitales répondent après déploiement", "chaque cas limite en détail", "toute la logique métier"], a: 1, exp: "Contrôle rapide post-déploiement." },
    { type: "qcm", q: "Si la prod est malsaine après déploiement…", opts: ["on met quand même en ligne", "on rollback vers la version précédente", "on relance le même déploiement", "on désactive le healthcheck"], a: 1, exp: "Retour arrière." },
    { type: "qcm", q: "interval et retries du healthcheck contrôlent…", opts: ["le port du service", "la fréquence et le nombre d'essais de vérification", "la commande de test", "le délai avant échec"], a: 1, exp: "Paramètres de sonde." },
    { type: "qcm", q: "Un incrément CORRECTIF (patch) correspond à…", opts: ["une rupture", "une correction de bug", "une grosse nouveauté", "un changement d'API"], a: 1, exp: "Le dernier chiffre." }
  ],
  final: {
    title: "Exercice final — Sécuriser une promotion en prod",
    intro: `<p>Une équipe déploie en production à chaque commit sur main, sans vérification. Comment sécuriser ?</p>`,
    questions: [
      { type: "qcm", q: "Premier problème :", opts: ["trop d'environnements", "aucun palier : le staging manque avant la prod", "il manque des tags", "le déploiement est trop lent"], a: 1, exp: "Valider en préproduction d'abord." },
      { type: "qcm", q: "Sur quoi déclencher la prod plutôt ?", opts: ["chaque commit", "un tag de version explicite", "chaque push", "chaque fusion en main"], a: 1, exp: "Promotion contrôlée." },
      { type: "qcm", q: "Après déploiement, vérifier…", opts: ["la vitesse de compilation", "la santé (healthcheck) avant de déclarer en ligne", "le nombre de commits", "les logs de build"], a: 1, exp: "Éviter une version cassée." },
      { type: "qcm", q: "Si la santé échoue :", opts: ["forcer la mise en ligne", "rollback vers la version précédente", "relancer la même image", "couper le healthcheck"], a: 1, exp: "Retour arrière." },
      { type: "qcm", q: "Le tag apporte :", opts: ["une image plus petite", "traçabilité de ce qui tourne et cible de rollback", "un build plus rapide", "un code masqué"], a: 1, exp: "Version connue." }
    ],
    solution: `<pre class="pseudo">Flux sécurisé :
  fusion main → deploy STAGING (auto) → healthcheck → smoke tests
  si OK et prêt → git tag v1.4.0 → deploy PRODUCTION
                → healthcheck prod → OK : en ligne
                                   → KO : rollback vers v1.3.x

# docker-compose : healthcheck (mysqladmin ping) qui conditionne
#   la promotion ; l'image de chaque version reste au registre pour le rollback.</pre>
<p>Un palier de staging, une promotion sur tag, une vérification de santé, un rollback prêt : le déploiement est automatisé <em>et</em> prudent. Demain : observabilité, sauvegardes, RGPD et rollback.</p>`
  }
};
</script>
