<script>
var DAY = {
  num: 17,
  title: "L'image de production : multi-stage, non-root, scan",
  subtitle: "Une image petite, sans compilateur, exécutée sans privilèges et scannée.",
  theory: `
<h3>1. Le Dockerfile multi-stage</h3>
<p>Un <strong>Dockerfile</strong> est la recette de fabrication d'un conteneur : une suite d'instructions en MAJUSCULES. <code>FROM</code> choisit l'image de départ, <code>RUN</code> exécute une commande pendant la construction (installer des outils), <code>WORKDIR</code> fixe le dossier de travail, <code>COPY</code> copie des fichiers dedans, <code>USER</code> choisit sous quel compte tourner, et <code>ENTRYPOINT</code>/<code>CMD</code> indiquent le programme à lancer au démarrage. Le mot <strong>multi-stage</strong> (« multi-étapes ») signifie qu'on enchaîne plusieurs images : une pour compiler, une autre, minimale, pour le résultat final.</p>
<pre class="pseudo">FROM debian:12 AS build                          # ÉTAPE 1 (nommée "build") : part d'une image Debian complète
RUN apt-get update &amp;&amp; apt-get install -y gcc make libmysqlclient-dev   # installe les outils de compilation (gcc, make) et la bibliothèque MySQL de développement
WORKDIR /src                                     # se place dans le dossier /src (créé au besoin)
COPY . .                                         # copie tout le projet (de l'hôte) dans /src (du conteneur)
RUN make                       # produit le binaire (compile le programme "app")

FROM debian:12-slim            # ÉTAPE 2 : nouvelle image, minimale (slim = allégée)
RUN apt-get update &amp;&amp; apt-get install -y libmysqlclient21 &amp;&amp; useradd -r ludo   # installe SEULEMENT la lib MySQL d'exécution, puis crée un utilisateur système "ludo"
COPY --from=build /src/app /usr/local/bin/app   # copie SEULEMENT le binaire depuis l'étape build (pas les outils de compilation)
USER ludo                      # à partir d'ici, le conteneur tourne sous "ludo" (exécution NON-root)
ENTRYPOINT ["app"]                               # programme lancé automatiquement au démarrage du conteneur</pre>
<p>Deux étapes : on <strong>compile</strong> dans une image équipée, puis on copie <strong>seulement le binaire</strong> dans une image minimale. Le compilateur ne se retrouve pas en production.</p>

<h3>2. Pourquoi multi-stage ?</h3>
<div class="warn">L'image finale est <strong>plus petite</strong> (moins de surface d'attaque, démarrage plus rapide) et <strong>ne contient pas</strong> les outils de build (gcc, make) qu'un attaquant pourrait exploiter. On n'embarque que le strict nécessaire à l'exécution.</p></div>

<h3>3. Non-root</h3>
<p>Par défaut, un conteneur tourne en <strong>root</strong>. On crée un utilisateur dédié (<code>ludo</code>) et on bascule dessus avec <code>USER</code>. Si le processus est compromis, l'attaquant n'a pas les pleins pouvoirs dans le conteneur.</p>

<h3>4. Scanner l'image</h3>
<pre class="pseudo">trivy image ludotheque:latest --exit-code 1 --severity CRITICAL,HIGH   # scanne l'image "ludotheque:latest" ; --severity limite aux failles graves/critiques ; --exit-code 1 fait échouer la CI si une telle faille est trouvée</pre>
<div class="tip">Un scanner (Trivy) inspecte l'image à la recherche de vulnérabilités connues (CVE) dans les paquets système. <code>--exit-code 1</code> fait échouer la CI si une faille grave est présente : on ne publie pas une image vulnérable.</div>`,
  exercises: [
    { type: "qcm", q: "Un Dockerfile multi-stage sépare…", opts: ["le code et les tests", "l'étape de build et l'image finale", "l'UI et le DAO", "deux bases"], a: 1, exp: "Compiler puis copier le binaire." },
    { type: "qcm", q: "L'image finale contient…", opts: ["gcc et make", "seulement le binaire et ses dépendances d'exécution", "tout le code source", "les tests"], a: 1, exp: "Le strict nécessaire." },
    { type: "qcm", q: "Pourquoi une image plus petite ?", opts: ["c'est joli", "moins de surface d'attaque, démarrage plus rapide", "obligatoire", "pour les logs"], a: 1, exp: "Sécurité + perf." },
    { type: "qcm", q: "Par défaut, un conteneur tourne en…", opts: ["ludo", "root", "invité", "personne"], a: 1, exp: "D'où l'intérêt de USER." },
    { type: "qcm", q: "USER ludo fait…", opts: ["supprimer ludo", "exécuter le conteneur sans privilèges root", "compiler", "scanner"], a: 1, exp: "Non-root." },
    { type: "qcm", q: "Non-root limite…", opts: ["la vitesse", "les dégâts si le processus est compromis", "les tests", "les rôles"], a: 1, exp: "Moindre privilège." },
    { type: "qcm", q: "COPY --from=build copie…", opts: ["tout /src", "seulement les fichiers voulus (le binaire) depuis l'étape build", "les secrets", "les logs"], a: 1, exp: "Sélectif." },
    { type: "qcm", q: "Un scanner d'image (Trivy) cherche…", opts: ["des tests", "des vulnérabilités connues (CVE) dans les paquets", "des rôles", "des prix"], a: 1, exp: "Sécurité de l'image." },
    { type: "qcm", q: "trivy ... --exit-code 1 fait…", opts: ["rien", "échouer la CI si une faille grave est trouvée", "déployer", "compiler"], a: 1, exp: "Porte de sécurité." },
    { type: "qcm", q: "Laisser gcc dans l'image de prod est…", opts: ["recommandé", "à éviter (surface d'attaque)", "obligatoire", "sans effet"], a: 1, exp: "Multi-stage l'évite." },
    { type: "vf", q: "Une image de production doit contenir le compilateur.", a: false, exp: "Faux : seulement le nécessaire à l'exécution." },
    { type: "qcm", q: "debian:12-slim est…", opts: ["une image lourde", "une image minimale", "un compilateur", "un secret"], a: 1, exp: "Base légère pour la prod." },
    { type: "qcm", q: "L'étape build utilise une image…", opts: ["minimale", "équipée (gcc, make, dev libs)", "sans rien", "de prod"], a: 1, exp: "Outils de compilation." },
    { type: "qcm", q: "Le scan s'exécute…", opts: ["une fois par an", "dans la CI, avant publication", "en prod seulement", "jamais"], a: 1, exp: "Avant de publier." },
    { type: "qcm", q: "Publier une image vulnérable est…", opts: ["acceptable", "refusé par le scan (--exit-code 1)", "obligatoire", "sans risque"], a: 1, exp: "On bloque." }
  ],
  final: {
    title: "Exercice final — Durcir une image",
    intro: `<p>Un Dockerfile de prod problématique. Analyse :</p>
<pre class="pseudo">FROM debian:12                                   # image de base complète (une seule étape : à interroger…)
RUN apt-get install -y gcc make libmysqlclient-dev   # installe gcc/make dans l'image… qui restera en production (à interroger…)
COPY . .                                         # copie tout le projet, y compris d'éventuels fichiers inutiles/sensibles (à interroger…)
RUN make                                         # compile le binaire
CMD ["./app"]                                    # lance ./app au démarrage (exécution en root par défaut : à interroger…)</pre>`,
    questions: [
      { type: "qcm", q: "Problème n°1 — une seule étape :", opts: ["aucun", "l'image finale contient gcc/make (surface d'attaque) : multi-stage", "trop lent", "rien"], a: 1, exp: "Séparer build et runtime." },
      { type: "qcm", q: "Problème n°2 — exécution :", opts: ["correcte", "root par défaut : ajouter un USER non-root", "trop rapide", "rien"], a: 1, exp: "Moindre privilège." },
      { type: "qcm", q: "Problème n°3 — la taille :", opts: ["idéale", "image lourde : préférer une base slim en finale", "trop petite", "rien"], a: 1, exp: "Réduire la surface." },
      { type: "qcm", q: "Manque n°4 — avant publication :", opts: ["rien", "un scan de vulnérabilités (Trivy)", "un printf", "un log"], a: 1, exp: "Refuser les CVE graves." },
      { type: "qcm", q: "COPY . . copie potentiellement…", opts: ["rien", "des fichiers inutiles/sensibles : mieux vaut être sélectif (.dockerignore)", "seulement le binaire", "un secret utile"], a: 1, exp: "Limiter le contexte." }
    ],
    solution: `<pre class="pseudo">FROM debian:12 AS build                          # étape build : image complète
RUN apt-get update &amp;&amp; apt-get install -y gcc make libmysqlclient-dev   # installe les outils de compilation
WORKDIR /src                                     # dossier de travail
COPY . .                                         # copie le projet
RUN make                                         # compile le binaire

FROM debian:12-slim                              # étape finale : image minimale
RUN apt-get update &amp;&amp; apt-get install -y libmysqlclient21 &amp;&amp; useradd -r ludo   # lib d'exécution seule + utilisateur non-root "ludo"
COPY --from=build /src/app /usr/local/bin/app    # copie uniquement le binaire depuis l'étape build
USER ludo                                        # exécution sans privilèges root
ENTRYPOINT ["app"]                               # programme lancé au démarrage

# CI : trivy image ludotheque:latest --exit-code 1 --severity CRITICAL,HIGH</pre>
<p>Multi-stage (pas de compilateur en prod), base slim, exécution non-root, scan de vulnérabilités. L'image est durcie. Demain : le pipeline complet.</p>`
  }
};
</script>
