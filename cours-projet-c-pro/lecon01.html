<script>
var DAY = {
  num: 1,
  title: "Cadrage : le projet pro et son environnement conteneurisé",
  subtitle: "Outiller AVANT de coder : dépôt, conteneur et pipeline dès le premier commit.",
  theory: `
<h3>1. Le changement de philosophie</h3>
<p>Dans le capstone « à la main » (Niveau 6), on a codé la Ludothèque (le logiciel qui gère une collection de jeux) puis réfléchi à l'outillage. Ici, on inverse : on met en place <strong>dès le jour 1</strong> le dépôt Git, le conteneur et la CI. Construire, industrialiser et sécuriser deviennent un <strong>seul geste</strong>, pas trois phases.</p>
<p>Avant tout, définissons les mots qui vont revenir sans cesse. <strong>Coder</strong>, c'est écrire des instructions (des ordres) dans un fichier texte pour dire à l'ordinateur quoi faire. <strong>Git</strong> est un « carnet de bord » qui enregistre chaque version de ton travail — c'est ce qu'on appelle <em>versionner</em> — comme un bouton « annuler » infini qui garde tout l'historique. Un <strong>dépôt</strong> (en anglais <em>repository</em>) est le dossier suivi par Git : la boîte qui contient le projet et sa mémoire. Un <strong>commit</strong> est une photo enregistrée du projet à un instant donné, accompagnée d'une petite étiquette qui décrit ce qu'on a changé — comme sauvegarder une partie de jeu vidéo. <strong>Pousser</strong> (<em>push</em>), c'est envoyer ses commits vers un serveur partagé (par exemple GitHub) pour les mettre en commun avec l'équipe.</p>
<p>Un <strong>conteneur</strong> est une « boîte » qui emballe le programme avec tout ce dont il a besoin pour fonctionner (le bon compilateur, la bonne base de données, les bons réglages), un peu comme une caravane qui transporte partout sa cuisine et son lit : où qu'on la pose, l'intérieur reste identique. <strong>Compiler</strong>, c'est traduire le code écrit par l'humain en langage que la machine sait exécuter, comme traduire une recette en gestes précis. La <strong>CI</strong> (intégration continue) est un robot qui, à chaque envoi de code, recompile tout et relance les tests automatiquement pour prévenir aussitôt si quelque chose casse — comme un contrôle qualité qui vérifie chaque pièce en bout de chaîne.</p>

<h3>2. Ce qu'on pose avant tout code métier</h3>
<pre class="pseudo">dépôt Git + .gitignore        versionner dès le début
Dockerfile + docker-compose   environnement reproductible
Makefile                      build et tests
.github/workflows/ci.yml      pipeline qui compile chaque push
.env.example                  documenter la config (sans secrets)</pre>
<p>Décryptons ces fichiers. Le <strong>Dockerfile</strong> est la <em>recette</em> qui décrit comment fabriquer le conteneur (quel système de base, quels outils installer). Le <strong>docker-compose</strong> est le <em>chef d'orchestre</em> : il lance plusieurs conteneurs ensemble (par exemple l'application ET sa base de données) et les fait communiquer. Le <strong>Makefile</strong> est un carnet de raccourcis : au lieu de retaper de longues commandes pour compiler ou tester, on tape simplement <code>make</code>. Le fichier <code>ci.yml</code> décrit le <strong>pipeline</strong>, c'est-à-dire la suite d'étapes automatiques (compiler, tester) que le robot CI déroule à chaque envoi. Enfin <code>.env.example</code> est un <em>modèle</em> du fichier de secrets : il liste les réglages attendus (nom d'utilisateur, etc.) sans les vraies valeurs, pour que chacun sache quoi remplir sans jamais exposer de mot de passe.</p>

<h3>3. Le .gitignore, dès le premier commit</h3>
<p>Le fichier <code>.gitignore</code> est une <strong>liste de choses à ne pas ranger dans le carnet de bord Git</strong> : on y inscrit les noms des fichiers que Git doit ignorer totalement. Chaque ligne nomme un fichier (ou un motif) ; une ligne qui commence par <code>#</code> (dièse) est un <strong>commentaire</strong>, c'est-à-dire une note pour l'humain que l'ordinateur ne lit pas. Le symbole <code>*</code> (étoile) signifie « n'importe quoi » : <code>*.o</code> désigne donc tous les fichiers dont le nom se termine par <code>.o</code>. Quant au fichier <code>.env</code>, il contient les <strong>secrets</strong> (mots de passe, clés d'accès à la base de données) : des informations sensibles qu'on ne doit jamais rendre publiques.</p>
<pre class="pseudo"># .gitignore  ← ce fichier liste ce que Git doit IGNORER (ne jamais suivre)
*.o           # tout fichier finissant par .o : un « fichier objet », résultat intermédiaire de compilation (regénérable)
app           # le programme exécutable nommé "app" (fabriqué à partir du code, donc inutile à versionner)
tests         # l'exécutable des tests (également refabriqué à chaque compilation)
.env          # le fichier des secrets (mots de passe, clés) : à NE JAMAIS versionner
*.log         # tout fichier finissant par .log : un « journal » d'exécution (du bruit, sans intérêt pour le code)</pre>
<div class="warn">On n'attend pas d'avoir « quelque chose à cacher » : le <code>.env</code> (secrets) est ignoré <strong>dès le départ</strong>. Un secret committé une fois reste dans l'historique, même supprimé ensuite.</p></div>

<h3>4. Pourquoi conteneuriser d'emblée ?</h3>
<p>Le conteneur garantit que le code, le compilateur et MySQL sont <strong>identiques</strong> partout : ta machine, celle d'un collègue, la CI, la production. Le fameux « ça marche chez moi » disparaît. On construit sur des bases stables au lieu de courir après les différences d'environnement.</p>
<div class="tip">Prérequis de ce cours : le capstone C (Niveau 6) et les cours d'outillage (Git, Tests, Docker, CI/CD, Sécurité). Ici, on ne réapprend pas ces outils : on les <strong>orchestre ensemble</strong> autour du projet.</div>`,
  exercises: [
    { type: "qcm", q: "La philosophie du projet pro :", opts: ["coder puis outiller", "outiller dès le jour 1 (build, industrialiser, sécuriser d'un geste)", "ne pas tester", "ignorer Git"], a: 1, exp: "L'outillage est premier." },
    { type: "qcm", q: "Que pose-t-on avant le code métier ?", opts: ["rien", "dépôt Git, conteneur, CI, Makefile", "l'UI seulement", "la base de prod"], a: 1, exp: "L'échafaudage d'abord." },
    { type: "qcm", q: "Le .env (secrets) doit être…", opts: ["versionné", "ignoré par Git dès le départ", "affiché", "dans le Dockerfile"], a: 1, exp: "Jamais dans l'historique." },
    { type: "qcm", q: "Un secret committé une fois…", opts: ["disparaît", "reste dans l'historique Git même supprimé après", "est chiffré", "est sans risque"], a: 1, exp: "D'où l'ignore dès le début." },
    { type: "qcm", q: "Le conteneur garantit…", opts: ["la vitesse", "un environnement identique partout", "moins de code", "la sécurité totale"], a: 1, exp: "Fin du « ça marche chez moi »." },
    { type: "qcm", q: "Construire, industrialiser, sécuriser sont…", opts: ["trois phases successives", "un seul geste continu", "optionnels", "réservés à la fin"], a: 1, exp: "D'un même pas." },
    { type: "qcm", q: "À quoi sert .env.example ?", opts: ["contenir les secrets", "documenter les variables attendues sans valeurs réelles", "compiler", "déployer"], a: 1, exp: "Versionné, sans secret." },
    { type: "qcm", q: "La CI dès le jour 1 compile…", opts: ["une fois par mois", "à chaque push", "jamais", "seulement en prod"], a: 1, exp: "Retour immédiat." },
    { type: "qcm", q: "Prérequis de ce cours :", opts: ["aucun", "le capstone Niveau 6 et les cours d'outillage", "seulement le langage C", "Python"], a: 1, exp: "On orchestre l'acquis." },
    { type: "qcm", q: "Ce cours réapprend-il Docker/Git en détail ?", opts: ["oui", "non : il les orchestre ensemble autour du projet", "seulement Git", "seulement Docker"], a: 1, exp: "Intégration, pas découverte." },
    { type: "vf", q: "On peut ajouter le .gitignore des secrets plus tard, sans risque.", a: false, exp: "Faux : un secret déjà committé reste dans l'historique." },
    { type: "qcm", q: "Le Makefile sert à…", opts: ["afficher", "build et tests", "chiffrer", "déployer seul"], a: 1, exp: "Construction reproductible." },
    { type: "qcm", q: "Le docker-compose orchestre…", opts: ["un seul conteneur", "plusieurs services (app, db) ensemble", "le Makefile", "Git"], a: 1, exp: "L'environnement complet." },
    { type: "qcm", q: "« Ça marche chez moi » est résolu par…", opts: ["plus de commentaires", "la conteneurisation", "un dépôt privé", "moins de tests"], a: 1, exp: "Environnement identique partout." },
    { type: "qcm", q: "Le pipeline vit dans…", opts: ["main.c", ".github/workflows/ci.yml", "le Makefile", "l'UI"], a: 1, exp: "GitHub Actions." }
  ],
  final: {
    title: "Exercice final — L'ordre de mise en place",
    intro: `<p>Un développeur propose : « on code toute la Ludothèque, puis on ajoute Git, Docker et la CI à la fin ». Analyse cette approche pour un projet pro.</p>`,
    questions: [
      { type: "qcm", q: "Le principal défaut :", opts: ["aucun", "l'outillage arrive trop tard : bugs et secrets s'accumulent sans filet", "trop de commits", "trop lent à coder"], a: 1, exp: "Le filet doit exister dès le début." },
      { type: "qcm", q: "Risque sur les secrets :", opts: ["nul", "des identifiants peuvent être committés avant le .gitignore", "trop de secrets", "aucun secret"], a: 1, exp: "Ignorer .env dès le jour 1." },
      { type: "qcm", q: "Risque sans CI précoce :", opts: ["aucun", "du code cassé s'accumule sans détection automatique", "trop de tests", "rien"], a: 1, exp: "La CI attrape tôt les régressions." },
      { type: "qcm", q: "La bonne approche pro :", opts: ["outiller à la fin", "dépôt + conteneur + CI dès le premier commit", "jamais d'outillage", "coder sans Git"], a: 1, exp: "L'échafaudage d'abord." },
      { type: "qcm", q: "Bénéfice de conteneuriser tôt :", opts: ["aucun", "chaque contributeur et la CI partagent le même environnement", "moins de code", "plus de secrets"], a: 1, exp: "Reproductibilité dès le début." }
    ],
    solution: `<pre class="pseudo">Jour 1 (avant tout code métier) :
  git init + .gitignore (.env, *.o, binaires)
  Dockerfile + docker-compose.yml (app + db)
  Makefile (build, test)
  .github/workflows/ci.yml (compile chaque push)
  .env.example (config documentée, sans secrets)

→ ensuite seulement : schéma, struct, DAO, services… (leçons suivantes),
  chaque ajout étant compilé, testé et versionné automatiquement.</pre>
<p>L'outillage n'est pas une finition : c'est le socle. Demain : faire tourner le squelette C dans Docker Compose.</p>`
  }
};
</script>
