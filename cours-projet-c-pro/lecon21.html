<script>
var DAY = {
  num: 21,
  title: "Récapitulatif : le projet professionnel de bout en bout (examen)",
  subtitle: "De la première branche à la production surveillée — construire, industrialiser, sécuriser d'un geste.",
  theory: `
<h3>Le voyage d'une modification</h3>
<p>Voici, en un coup d'œil, le trajet complet d'une modification de code, du poste du développeur jusqu'à la production. Chaque ligne du schéma correspond à une étape vue dans le cours, avec son <em>garde-fou</em> (le contrôle qui empêche d'avancer si quelque chose ne va pas). Lis-le de haut en bas : c'est l'ordre réel des événements.</p>
<pre class="pseudo">1. branche + commit                (Git)
2. Pull Request → CI :
     build (-Wall -Wextra)         compile
     test / integration            comportement + effet réel
     lint (cppcheck)               motifs douteux
     asan (address, undefined)     mémoire & UB
3. build image (multi-stage, non-root) + scan (Trivy)   pas de CVE critique
4. protection de branche          tous les checks verts pour fusionner
5. fusion main → staging          déploiement auto + healthcheck
6. tag vX.Y.Z → production         promotion contrôlée
7. observabilité + sauvegardes     et rollback si besoin</pre>
<div class="tip">Les trois disciplines n'ont pas été des phases mais un seul mouvement : <strong>construire</strong> (code testé, conteneurisé), <strong>industrialiser</strong> (CI/CD, image, déploiement), <strong>sécuriser</strong> (requêtes préparées, anti-IDOR, secrets, image durcie, RGPD). C'est exactement ce qu'on attend en entreprise.</div>
<div class="warn">Rien n'atteint la production sans avoir franchi <em>toutes</em> les portes : compilation, tests, analyse, scan, revue, santé. La qualité et la sécurité ne sont pas ajoutées à la fin — elles sont la façon même de travailler.</p></div>`,
  exercises: [
    { type: "qcm", q: "L'outillage a été mis en place…", opts: ["à la fin", "dès le premier commit", "jamais", "en prod"], a: 1, exp: "Construire/industrialiser/sécuriser d'un geste." },
    { type: "qcm", q: "Contre l'injection SQL :", opts: ["la concaténation", "les requêtes préparées", "un log", "un scan"], a: 1, exp: "Paramètres liés." },
    { type: "qcm", q: "L'IDOR est bloquée par…", opts: ["le rôle seul", "un contrôle de propriété de la ressource", "le menu", "un tag"], a: 1, exp: "Autorisation par ressource." },
    { type: "qcm", q: "Les secrets viennent…", opts: ["du code", "de l'environnement / d'un coffre (CI, prod)", "d'un printf", "du .env versionné"], a: 1, exp: "Jamais dans Git." },
    { type: "qcm", q: "L'image de prod est…", opts: ["lourde avec gcc, en root", "multi-stage, minimale, non-root, scannée", "le code source", "un secret"], a: 1, exp: "Durcie." },
    { type: "qcm", q: "La protection de branche exige…", opts: ["rien", "tous les checks verts avant fusion", "un seul test", "un déploiement"], a: 1, exp: "Portes obligatoires." },
    { type: "qcm", q: "La production est déployée sur…", opts: ["chaque commit", "un tag de version", "chaque push", "jamais"], a: 1, exp: "Promotion contrôlée." },
    { type: "qcm", q: "Le healthcheck conditionne…", opts: ["la compilation", "la promotion / le rollback", "le lint", "le hash"], a: 1, exp: "Santé du service." },
    { type: "qcm", q: "Les sanitizers attrapent…", opts: ["le style", "les erreurs mémoire et comportements indéfinis", "les rôles", "les prix"], a: 1, exp: "À l'exécution." },
    { type: "qcm", q: "Le RGPD impose notamment…", opts: ["tout collecter", "minimisation et droit à l'oubli", "logguer les emails", "un scan"], a: 1, exp: "Devoirs sur les données." },
    { type: "vf", q: "La qualité et la sécurité sont ajoutées à la fin du projet.", a: false, exp: "Faux : elles sont la façon même de travailler, dès le début." },
    { type: "qcm", q: "Le rollback repose sur…", opts: ["recompiler", "des images versionnées conservées au registre", "supprimer la base", "un log"], a: 1, exp: "Retour à une version connue." },
    { type: "qcm", q: "Les tests d'intégration tournent contre…", opts: ["la prod", "une base jetable", "aucune base", "un fichier"], a: 1, exp: "État propre." },
    { type: "qcm", q: "Le scan d'image refuse…", opts: ["les tests", "une image avec CVE critiques", "un commit", "un tag"], a: 1, exp: "Sécurité de l'image." },
    { type: "qcm", q: "Les trois disciplines forment…", opts: ["trois phases", "un seul mouvement continu", "un secret", "un log"], a: 1, exp: "Construire, industrialiser, sécuriser." }
  ],
  final: {
    title: "Épreuve finale — Le cycle complet",
    intro: `<p>Retrace le parcours d'un correctif (« fix : corrige un calcul de tarif ») du poste du développeur jusqu'à la production surveillée, en nommant le garde-fou de chaque étape.</p>`,
    questions: [
      { type: "qcm", q: "Le correctif commence sur…", opts: ["main", "une branche dédiée (fix/...)", "la prod", "un tag"], a: 1, exp: "Jamais directement sur main." },
      { type: "qcm", q: "La PR déclenche…", opts: ["la prod", "la CI (build, tests, lint, asan)", "un rollback", "rien"], a: 1, exp: "Toutes les portes." },
      { type: "qcm", q: "La fusion est possible seulement si…", opts: ["quelqu'un le veut", "tous les checks sont verts (protection de branche)", "c'est urgent", "jamais"], a: 1, exp: "Checks requis." },
      { type: "qcm", q: "Après fusion en main :", opts: ["prod directe", "déploiement staging + healthcheck", "rien", "un scan seul"], a: 1, exp: "Préproduction d'abord." },
      { type: "qcm", q: "La mise en production se fait…", opts: ["automatiquement à la fusion", "sur un tag de version, après validation du staging", "au hasard", "jamais"], a: 1, exp: "Promotion contrôlée." }
    ],
    solution: `<pre class="pseudo">fix/tarif (branche) + commit
  → Pull Request
      CI : build (-Wall) · test + integration · lint (cppcheck) · asan
           build image (multi-stage, non-root) · scan (Trivy)
  → protection de branche : tous verts → fusion dans main
  → deploy STAGING (auto) → healthcheck → smoke tests
  → git tag v1.4.1 → deploy PRODUCTION → healthcheck
      OK  : en ligne, logs et sauvegardes en place
      KO  : rollback vers v1.4.0
</pre>
<p>Chaque étape a son garde-fou ; rien ne passe sans les franchir tous. Bravo — tu as livré une application C professionnelle, du dépôt vide à la production surveillée, en construisant, industrialisant et sécurisant d'un même geste. Tu as bouclé le parcours C !</p>`
  }
};
</script>

    note: "Cette checklist résume tout le cours : chaque porte empêche une classe de problèmes d'atteindre la production. Construire, industrialiser et sécuriser ne sont pas des options finales mais les conditions permanentes du travail. Félicitations d'avoir bouclé le parcours C !" }
  ]
};
