<script>
var DAY = {
  num: 11,
  title: "Louer un jeu : transaction et test d'intégration",
  subtitle: "L'opération atomique du Niveau 6, vérifiée cette fois par un test contre une vraie base.",
  theory: `
<h3>1. La location transactionnelle (rappel)</h3>
<p>Louer un jeu revient à faire deux choses : enregistrer la location ET diminuer (« décrémenter ») le stock. Ces deux gestes doivent réussir <em>ensemble</em> ou échouer <em>ensemble</em> : c'est une <strong>transaction</strong>, une opération <strong>atomique</strong> (« tout ou rien », comme un virement bancaire où débit et crédit sont indissociables). Si la seconde étape échoue, la première est annulée. C'est la logique du capstone « à la main ». Ce qui change ici : on la <strong>vérifie par un test d'intégration</strong>.</p>

<h3>2. Test unitaire vs test d'intégration</h3>
<p>Un <strong>test unitaire</strong> vérifie une petite brique isolée (une fonction pure), sans base ni réseau : très rapide. Un <strong>test d'intégration</strong> vérifie que plusieurs briques fonctionnent ensemble avec le vrai monde extérieur (ici MySQL) : plus lent, mais plus réaliste. Le tableau ci-dessous résume :</p>
<pre class="pseudo">Unitaire     : teste une fonction pure, sans base (service_tarif…)   → rapide
Intégration  : teste l'effet réel sur MySQL (le stock diminue)      → plus lent</pre>
<div class="warn">Les deux sont complémentaires. L'unitaire couvre la logique ; l'intégration couvre l'assemblage réel (SQL, transaction, base). On sépare les jobs en CI : les unitaires à chaque push, l'intégration contre une base jetable.</p></div>

<h3>3. Un test d'intégration</h3>
<pre class="pseudo">int avant = dao_stock_loc(c, JEU_TEST);            // lit le stock de location AVANT (valeur de référence)
Code r = service_louer(c, USER_TEST, JEU_TEST, 2); // effectue la location (2 jours) ; r reçoit le code résultat
int apres = dao_stock_loc(c, JEU_TEST);            // relit le stock APRÈS l'opération
CHECK(r == OK);                                    // vérifie que la location a réussi
CHECK(apres == avant - 1);      // le stock a bien diminué de 1 (une unité louée en moins)</pre>

<h3>4. Une base jetable en CI</h3>
<pre class="pseudo"># ci.yml : job intégration avec un service MySQL éphémère
  integration:                   # un job nommé "integration"
    runs-on: ubuntu-latest       # sur un runner Linux Ubuntu
    services:                    # conteneurs annexes lancés le temps du job
      db:                        # une base de données jetable
        image: mysql:8.4         # image officielle MySQL 8.4
        env: { MYSQL_ROOT_PASSWORD: test, MYSQL_DATABASE: ludotheque }   # réglages : mot de passe admin de test + base "ludotheque"
        ports: ['3306:3306']     # expose le port 3306 (le "guichet" réseau de MySQL) au runner
    steps:                       # étapes du job
      - uses: actions/checkout@v4  # récupère le code du dépôt
      - run: ./scripts/attendre-mysql.sh &amp;&amp; ./scripts/charger-schema.sh   # attend que MySQL soit prêt PUIS charge le schéma
      - run: make integration    # compile et lance les tests d'intégration</pre>
<div class="tip">La CI démarre une base MySQL neuve, y charge le schéma, exécute les tests d'intégration, puis la jette. Chaque exécution part d'un état propre : les tests sont reproductibles, sans polluer d'environnement partagé.</div>`,
  exercises: [
    { type: "qcm", q: "Louer reste une opération…", opts: ["sans transaction", "atomique (transaction)", "d'affichage", "sans contrôle"], a: 1, exp: "Tout ou rien." },
    { type: "qcm", q: "Un test unitaire teste…", opts: ["l'effet sur la base", "une fonction pure, sans base (rapide)", "le réseau", "le Dockerfile"], a: 1, exp: "Logique isolée." },
    { type: "qcm", q: "Un test d'intégration teste…", opts: ["une fonction pure", "l'effet réel sur MySQL (stock diminué)", "le style", "un secret"], a: 1, exp: "Assemblage réel." },
    { type: "qcm", q: "Les deux types de tests sont…", opts: ["redondants", "complémentaires", "inutiles", "identiques"], a: 1, exp: "Logique + assemblage." },
    { type: "qcm", q: "En CI, les tests d'intégration tournent contre…", opts: ["la prod", "une base jetable/éphémère", "aucune base", "un fichier"], a: 1, exp: "État propre à chaque fois." },
    { type: "qcm", q: "Le test « apres == avant - 1 » vérifie…", opts: ["le prix", "que le stock a bien diminué d'une location", "le rôle", "le login"], a: 1, exp: "Effet de la location." },
    { type: "qcm", q: "Pourquoi séparer les jobs unitaire/intégration ?", opts: ["par style", "l'intégration est plus lente : on garde les unitaires rapides à chaque push", "sans raison", "pour cacher"], a: 1, exp: "Rapidité de la boucle." },
    { type: "qcm", q: "La base de CI est initialisée avec…", opts: ["rien", "le schéma versionné", "des données de prod", "un secret"], a: 1, exp: "Schéma chargé au démarrage." },
    { type: "qcm", q: "Après le job d'intégration, la base est…", opts: ["conservée", "jetée (éphémère)", "déployée", "sauvegardée"], a: 1, exp: "Pas de pollution." },
    { type: "qcm", q: "services: db: dans le YAML fournit…", opts: ["un volume", "un conteneur MySQL éphémère pour le job", "un secret", "un scan"], a: 1, exp: "Base de test." },
    { type: "vf", q: "Les tests d'intégration remplacent les tests unitaires.", a: false, exp: "Faux : ils sont complémentaires, pas substituables." },
    { type: "qcm", q: "attendre-mysql.sh sert à…", opts: ["compiler", "attendre que la base soit prête avant les tests", "déployer", "chiffrer"], a: 1, exp: "Éviter les tests avant que db soit up." },
    { type: "qcm", q: "Un test d'intégration est reproductible car…", opts: ["il dépend de l'heure", "il part d'un état propre à chaque exécution", "il utilise la prod", "il est aléatoire"], a: 1, exp: "Base neuve." },
    { type: "qcm", q: "La transaction garantit, même testée…", opts: ["la vitesse", "l'atomicité (stock + location ensemble)", "le chiffrement", "le tri"], a: 1, exp: "Tout ou rien." },
    { type: "qcm", q: "L'intégration couvre ce que l'unitaire ne voit pas :", opts: ["la logique pure", "le SQL réel, la transaction, la base", "les commentaires", "le style"], a: 1, exp: "L'assemblage." }
  ],
  final: {
    title: "Exercice final — Concevoir un test d'intégration",
    intro: `<p>On veut prouver que louer décrémente le stock, contre une vraie base de test. Quel scénario ?</p>`,
    questions: [
      { type: "qcm", q: "Première étape :", opts: ["louer directement", "lire le stock avant (dao_stock_loc)", "afficher", "supprimer"], a: 1, exp: "Mesure de référence." },
      { type: "qcm", q: "Deuxième étape :", opts: ["afficher", "appeler service_louer et vérifier le Code OK", "un COMMIT manuel", "un scan"], a: 1, exp: "Exécuter l'opération." },
      { type: "qcm", q: "Troisième étape :", opts: ["rien", "relire le stock et vérifier qu'il a baissé de 1", "déployer", "logger"], a: 1, exp: "Vérifier l'effet." },
      { type: "qcm", q: "Ce test tourne contre…", opts: ["la prod", "une base MySQL jetable en CI", "aucune base", "un fichier"], a: 1, exp: "État propre." },
      { type: "qcm", q: "Un cas de refus à tester aussi :", opts: ["aucun", "louer un jeu à stock nul → ERR_STOCK, stock inchangé", "afficher plus vite", "un secret"], a: 1, exp: "Couvrir le refus." }
    ],
    solution: `<pre class="pseudo">/* test d'intégration (contre la base de CI) */
void test_louer_decremente(MYSQL *c) {                 // c = connexion à la base de test
    int avant = dao_stock_loc(c, JEU_DISPO);           // stock d'un jeu disponible AVANT
    Code r = service_louer(c, USER_TEST, JEU_DISPO, 2);  // on le loue (2 jours)
    int apres = dao_stock_loc(c, JEU_DISPO);           // stock APRÈS
    CHECK(r == OK);                                    // la location doit réussir
    CHECK(apres == avant - 1);                         // le stock doit avoir baissé de 1

    /* refus : stock nul → ERR_STOCK, stock inchangé */
    int s0 = dao_stock_loc(c, JEU_EPUISE);             // stock d'un jeu épuisé (0) avant
    CHECK(service_louer(c, USER_TEST, JEU_EPUISE, 1) == ERR_STOCK);  // louer un jeu épuisé doit être refusé
    CHECK(dao_stock_loc(c, JEU_EPUISE) == s0);         // et le stock ne doit PAS avoir bougé (transaction annulée)
}</pre>
<p>Un scénario clair (mesurer, agir, vérifier), un cas nominal et un cas de refus, contre une base jetable. Demain : acheter, avec la mesure de couverture.</p>`
  }
};
</script>
