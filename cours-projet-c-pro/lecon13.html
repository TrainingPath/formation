<script>
var DAY = {
  num: 13,
  title: "L'interface et les entrées sûres (débordements de tampon)",
  subtitle: "Une UI mince, et des saisies bornées vérifiées par les sanitizers en CI.",
  theory: `
<h3>1. L'UI mince (rappel) + la sécurité des tampons</h3>
<p>L'<strong>UI</strong> (interface utilisateur, la partie qui dialogue avec la personne : menus, invites, affichage) reste « mince » : elle lit une saisie, la délègue au service qui décide, puis affiche le résultat — elle ne contient aucune règle métier. Mais en C, « lire » est une opération à risque : une saisie plus longue que le tampon provoque un <strong>débordement</strong> (écrire au-delà de la zone réservée). La version pro fait de cette sécurité une exigence <strong>vérifiée automatiquement</strong>.</p>

<h3>2. Toujours borner la lecture</h3>
<pre class="pseudo">char nom[50];                                // tampon de 50 caractères
if (scanf(" %49[^\\n]", nom) != 1) return;   // lit au plus 49 caractères jusqu'au retour à la ligne (49 : place pour le '\0' final) ; sort si la lecture échoue
// fgets est une autre option sûre :
char ligne[128];                             // tampon de 128 caractères
if (!fgets(ligne, sizeof(ligne), stdin)) return;   // lit une ligne au clavier (stdin) sans dépasser la taille du tampon ; sort si échec ou fin de saisie</pre>
<div class="warn"><code>gets</code> a été <strong>retiré</strong> du langage tant il est dangereux. <code>scanf("%s")</code> sans largeur et <code>strcpy</code> sans contrôle sont tout aussi risqués. On borne toujours : <code>%49s</code>, <code>fgets</code>, <code>snprintf</code> au lieu de <code>sprintf</code>.</p></div>

<h3>3. Les sanitizers en CI attrapent l'invisible</h3>
<pre class="pseudo"># job asan
  asan:                          # job qui traque les erreurs mémoire
    steps:                       # ses étapes
      - run: gcc -g -fsanitize=address,undefined -Wall tests.c ... -o t $(mysql_config --libs)   # compile avec les détecteurs d'erreurs mémoire (address) et de comportements indéfinis (undefined)
      - run: ./t     # lance le programme ; il échoue net sur débordement, use-after-free (accès à une zone déjà libérée) ou comportement indéfini</pre>
<p>L'AddressSanitizer + l'UndefinedBehaviorSanitizer transforment les bugs mémoire silencieux en échecs francs, à la ligne près. Un code qui « marchait par chance » échoue enfin visiblement.</p>

<h3>4. Le principe : ne jamais faire confiance à l'entrée</h3>
<div class="tip">Toute donnée venue de l'extérieur (clavier, fichier, réseau) est <strong>hostile par défaut</strong> : bornée en taille, validée en contenu, échappée si elle repart vers un autre système (SQL → requête préparée). L'UI est le premier rempart, le sanitizer le dernier contrôle.</div>`,
  exercises: [
    { type: "qcm", q: "En C, « lire une saisie » est risqué à cause de…", opts: ["la lenteur", "possibles débordements de tampon", "l'affichage", "rien"], a: 1, exp: "Entrée plus longue que le tampon." },
    { type: "qcm", q: "Quelle lecture est sûre ?", opts: ["gets(nom)", "scanf(\" %49[^\\n]\", nom)", "scanf(\"%s\", nom)", "aucune"], a: 1, exp: "Bornée." },
    { type: "qcm", q: "gets a été…", opts: ["amélioré", "retiré du langage (trop dangereux)", "rendu obligatoire", "accéléré"], a: 1, exp: "Bannir gets." },
    { type: "qcm", q: "À la place de sprintf, on préfère…", opts: ["gets", "snprintf (borné)", "strcpy", "scanf(\"%s\")"], a: 1, exp: "Écriture bornée." },
    { type: "qcm", q: "Quel sanitizer attrape les débordements ?", opts: ["-O2", "-fsanitize=address", "-Wall seul", "-lm"], a: 1, exp: "ASan." },
    { type: "qcm", q: "-fsanitize=undefined attrape…", opts: ["les fuites seules", "les comportements indéfinis (débordements d'entiers, etc.)", "les rôles", "les secrets"], a: 1, exp: "UBSan." },
    { type: "qcm", q: "Un bug mémoire « qui marchait par chance »…", opts: ["reste caché", "échoue visiblement sous sanitizer", "se corrige seul", "est sûr"], a: 1, exp: "Rendu franc." },
    { type: "qcm", q: "Toute donnée externe est…", opts: ["fiable", "hostile par défaut (à borner, valider, échapper)", "ignorée", "un secret"], a: 1, exp: "Méfiance systématique." },
    { type: "qcm", q: "Une donnée qui repart vers SQL doit être…", opts: ["concaténée", "passée en paramètre lié (requête préparée)", "affichée", "chiffrée"], a: 1, exp: "Anti-injection." },
    { type: "qcm", q: "L'UI reste…", opts: ["le cerveau", "mince : lire, déléguer, afficher (+ borner les saisies)", "le DAO", "la base"], a: 1, exp: "Premier rempart, pas de métier." },
    { type: "vf", q: "scanf(\"%s\") sans largeur est sûr si l'utilisateur est prudent.", a: false, exp: "Faux : on ne fait jamais confiance à l'entrée ; il faut borner." },
    { type: "qcm", q: "fgets est sûr parce qu'il…", opts: ["est rapide", "prend la taille du tampon en paramètre", "ignore les espaces", "chiffre"], a: 1, exp: "Lecture bornée." },
    { type: "qcm", q: "Le sanitizer en CI s'exécute…", opts: ["jamais", "à chaque push (job dédié)", "en prod", "à la main"], a: 1, exp: "Contrôle continu." },
    { type: "qcm", q: "Le dernier contrôle mémoire, c'est…", opts: ["l'UI", "le sanitizer", "le menu", "le login"], a: 1, exp: "Filet final." },
    { type: "qcm", q: "%49 pour un tampon char[50] laisse la place…", opts: ["à rien", "au '\\0' final", "à 50 caractères", "à un espace"], a: 1, exp: "Taille - 1." }
  ],
  final: {
    title: "Exercice final — Durcir une UI",
    intro: `<p>Cette UI de recherche est risquée. Analyse :</p>
<pre class="pseudo">char terme[16];                            // tampon de seulement 16 caractères
printf("Rechercher ? ");                   // affiche l'invite
gets(terme);                               // lit SANS aucune limite → débordement possible (gets est banni : à interroger…)
char sql[64];                              // tampon pour la requête
sprintf(sql, "... LIKE '%%%s%%'", terme);  // colle le terme DANS le SQL (concaténation → injection : à interroger…)
mysql_query(c, sql);                       // envoie la requête telle quelle</pre>`,
    questions: [
      { type: "qcm", q: "Danger n°1 — <code>gets(terme)</code> :", opts: ["aucun", "débordement de tampon (gets ne borne pas)", "trop lent", "rien"], a: 1, exp: "gets est banni." },
      { type: "qcm", q: "Danger n°2 — le sprintf du terme dans le SQL :", opts: ["aucun", "injection SQL : requête préparée nécessaire", "trop court", "rien"], a: 1, exp: "Concaténation dangereuse." },
      { type: "qcm", q: "Correction de la lecture :", opts: ["gets", "fgets(terme, sizeof(terme), stdin) ou scanf borné", "scanf(\"%s\")", "rien"], a: 1, exp: "Lecture bornée." },
      { type: "qcm", q: "Correction du SQL :", opts: ["échapper à la main", "LIKE CONCAT('%',?,'%') en paramètre lié", "raccourcir", "chiffrer"], a: 1, exp: "Requête préparée." },
      { type: "qcm", q: "Quel job CI prouverait l'absence de débordement ?", opts: ["build", "asan (-fsanitize=address)", "deploy", "scan"], a: 1, exp: "Sanitizer." }
    ],
    solution: `<pre class="pseudo">char terme[64];                                    // tampon plus large (64 caractères)
printf("Rechercher ? ");                           // affiche l'invite
if (!fgets(terme, sizeof(terme), stdin)) return;   // lit une ligne bornée à la taille du tampon ; sort si échec
terme[strcspn(terme, "\\n")] = '\\0';                // strcspn trouve la position du '\n' ; on la remplace par '\0' pour retirer le saut de ligne

/* requête préparée : LIKE CONCAT('%', ?, '%'), terme lié */
dao_chercher_par_nom(c, terme);                    // délègue la recherche : le terme est branché en paramètre lié (jamais concaténé)

# CI : job asan (-fsanitize=address) prouve l'absence de débordement.</pre>
<p>Lecture bornée, terme lié (pas concaténé), sanitizer en garde-fou. L'UI est un rempart, pas une passoire. Demain : secrets et configuration par environnement.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code C ici…",
  items: [
  { id: "projcpro-l13", title: "Lecture de ligne robuste", level: 2,
    statement: "Écris une fonction int lire_ligne(char *buf, size_t taille) qui lit une ligne au clavier avec fgets (bornée), retire le '\\n' final, et renvoie 1 si succès, 0 si échec/EOF. Explique en commentaire pourquoi elle est plus sûre que scanf(\"%s\").",
    hints: [
      "if (!fgets(buf, taille, stdin)) return 0;",
      "buf[strcspn(buf, \"\\n\")] = '\\0'; retire le saut de ligne.",
      "fgets borne la taille et lit la ligne entière (espaces compris)."
    ],
    solution: "#include <stdio.h>    // pour fgets, printf\n#include <string.h>   // pour strcspn\n\nint lire_ligne(char *buf, size_t taille) {   // lit une ligne dans buf (max 'taille' caracteres) ; 1 si ok, 0 sinon\n    if (!fgets(buf, taille, stdin))          // lit au clavier sans depasser 'taille'\n        return 0;                       // EOF ou erreur\n    buf[strcspn(buf, \"\\n\")] = '\\0';     // retire le '\\n' final\n    return 1;                                // succes\n}\n// Plus sur que scanf(\"%s\") : fgets BORNE la taille (pas de debordement)\n// et lit la LIGNE ENTIERE (les noms composes avec espaces ne sont pas tronques).",
    note: "fgets prend la taille du tampon : impossible de déborder. Il lit aussi la ligne complète (espaces inclus), contrairement à scanf(\"%s\") qui s'arrête au premier espace. On nettoie le '\\n' pour obtenir une chaîne propre." }
  ]
};
