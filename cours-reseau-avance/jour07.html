<script>
var DAY = {
  num: 7,
  title: "Les protocoles à vecteur de distance (RIP)",
  subtitle: "Le routage dynamique le plus simple : compter les sauts, de proche en proche.",
  theory: `
<h3>1. L'idée du vecteur de distance</h3>
<p>Un protocole à <strong>vecteur de distance</strong> (<em>distance vector</em>) repose sur une idée toute simple : chaque routeur dit périodiquement à ses <strong>voisins directs</strong> « voici les réseaux que je connais, et à quelle distance ». Un routeur ne voit donc jamais la carte entière : il fait confiance à ce que ses voisins lui rapportent, comme des rumeurs propagées de proche en proche. Le représentant historique de cette famille est <strong>RIP</strong> (<em>Routing Information Protocol</em>).</p>
<h3>2. La métrique de RIP : le nombre de sauts</h3>
<p>RIP utilise la métrique la plus intuitive qui soit : le <strong>nombre de sauts</strong> (<em>hop count</em>), c'est-à-dire le nombre de routeurs à traverser pour atteindre un réseau. Un réseau directement connecté est à 0 ou 1 saut ; s'il faut passer par trois routeurs, il est à 3 sauts. Entre deux chemins, RIP choisit celui qui a le <strong>moins de sauts</strong>. Simple à comprendre, simple à calculer.</p>
<pre class="pseudo"># RIP compte les routeurs a traverser
[PC] --R1-- --R2-- --R3-- [Reseau cible]
                que compte R1 pour joindre la cible ?  -> 3 sauts
# Entre deux chemins, RIP prend celui du plus PETIT nombre de sauts.</pre>
<div class="warn">Attention : compter les sauts ignore la qualité des liens. Un chemin de 2 sauts sur des liens lents sera préféré à un chemin de 3 sauts sur de la fibre ultra-rapide. RIP ne regarde QUE le nombre de routeurs, pas la bande passante.</div>
<h3>3. La limite des 15 sauts</h3>
<p>RIP a une contrainte célèbre : une distance de <strong>16 sauts est considérée comme l'infini</strong>, c'est-à-dire « inaccessible ». La distance <strong>maximale utilisable est donc 15 sauts</strong>. Au-delà, RIP déclare la destination injoignable. Cette limite volontaire empêche les compteurs de monter à l'infini en cas de boucle (voir plus loin), mais elle cantonne RIP aux <strong>réseaux de petite ou moyenne taille</strong> : impossible de traverser plus de 15 routeurs.</p>
<pre class="pseudo"># La regle des 15
distance <= 15 : reseau joignable
distance == 16 : INFINI -> reseau declare inaccessible
# RIP convient aux petits/moyens reseaux (diametre <= 15 sauts).</pre>
<h3>4. La lenteur de convergence</h3>
<p>Le gros défaut de RIP est sa <strong>lenteur de convergence</strong>. RIP envoie ses mises à jour à intervalles réguliers (classiquement toutes les 30 secondes) et non pas immédiatement. Quand un lien tombe, l'information se propage lentement, de voisin en voisin, une annonce à la fois. Pendant ce temps, des routeurs gardent de vieilles informations et peuvent créer une <strong>boucle de routage</strong> : le compteur de sauts grimpe alors petit à petit (« count to infinity ») jusqu'à atteindre 16. Pour limiter ce problème, RIP emploie des garde-fous comme le <em>split horizon</em> (ne pas réannoncer une route à celui qui nous l'a apprise) et le <em>route poisoning</em> (annoncer une route morte avec la métrique 16), mais la convergence reste lente comparée à OSPF.</p>
<div class="tip">Résume RIP en trois mots : simple, limité, lent. Simple car il compte les sauts ; limité par la barrière des 15 ; lent car ses mises à jour périodiques mettent du temps à faire le tour du réseau.</div>
<h3>5. RIPv1 et RIPv2</h3>
<p>Il existe deux versions. <strong>RIPv1</strong>, ancienne, n'envoyait pas le masque de sous-réseau : incompatible avec le CIDR et le sous-réseautage moderne. <strong>RIPv2</strong> corrige cela : il transporte le <strong>masque</strong> (support du <em>VLSM</em>/CIDR), utilise le <strong>multicast</strong> pour ses annonces au lieu du broadcast, et ajoute une <strong>authentification</strong> simple. En pratique, c'est <strong>RIPv2</strong> que l'on utilise aujourd'hui quand on choisit RIP. Le principe (vecteur de distance, 15 sauts) reste identique.</p>
<pre class="pseudo"># RIPv1 vs RIPv2
RIPv1 : pas de masque envoye (classful), broadcast, pas d'authent.
RIPv2 : masque inclus (VLSM/CIDR), multicast, authentification simple.
# Meme metrique (sauts) et meme limite (15) dans les deux versions.</pre>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># RIP = vecteur de distance : "je connais tel reseau a tant de sauts".
# Metrique = nombre de SAUTS ; on prend le moins de sauts.
# Limite   = 15 sauts max (16 = infini = inaccessible).
# Defaut   = convergence LENTE (maj periodiques, ~30 s, boucles possibles).
# Version moderne = RIPv2 (masque, multicast, authentification).</pre>`,
  exercises: [
    { type: "qcm", q: "Sur quelle idée repose un protocole à vecteur de distance ?", opts: ["Chaque routeur a une carte complète du réseau", "Chaque routeur dit à ses voisins les réseaux qu'il connaît et à quelle distance", "Un serveur central calcule tout", "Les routes sont écrites à la main"], a: 1, exp: "Vecteur de distance : on annonce à ses voisins « tel réseau à telle distance »." },

    { type: "qcm", q: "Entre deux chemins, RIP retient celui qui a…", opts: ["Le plus de sauts", "Le moins de sauts", "La plus grande bande passante", "Le nom le plus court"], a: 1, exp: "RIP choisit le chemin avec le plus petit nombre de sauts." },
    { type: "vf", q: "RIP tient compte de la bande passante des liens pour choisir le meilleur chemin.", a: false, exp: "Non : RIP ne regarde que le nombre de sauts, pas la qualité des liens." },

    { type: "qcm", q: "Que signifie une distance de 16 sauts dans RIP ?", opts: ["Le chemin le plus rapide", "L'infini : réseau inaccessible", "Une erreur de câblage", "Le nombre idéal de sauts"], a: 1, exp: "16 = infini : RIP déclare la destination injoignable." },
    { type: "vf", q: "La limite des 15 sauts cantonne RIP aux réseaux de petite ou moyenne taille.", a: true, exp: "Oui : on ne peut pas traverser plus de 15 routeurs, ce qui limite le diamètre du réseau." },
    { type: "qcm", q: "Quel est le principal défaut de RIP ?", opts: ["Il consomme trop de mémoire", "Sa convergence est lente", "Il est trop rapide", "Il n'a pas de métrique"], a: 1, exp: "RIP converge lentement à cause de ses mises à jour périodiques." },
    { type: "qcm", q: "À quel intervalle RIP envoie-t-il classiquement ses mises à jour ?", opts: ["Toutes les secondes", "Toutes les 30 secondes environ", "Une fois par jour", "Uniquement au démarrage"], a: 1, exp: "RIP diffuse ses tables périodiquement, classiquement toutes les 30 secondes." },
    { type: "input", q: "Comment appelle-t-on le phénomène où, en cas de boucle, le compteur de sauts grimpe jusqu'à 16 (terme anglais courant) ?", a: ["count to infinity", "count-to-infinity", "comptage a l'infini", "comptage vers l'infini"], ph: "trois mots", exp: "Le « count to infinity » : la métrique monte jusqu'à 16 (l'infini)." },
    { type: "qcm", q: "Le mécanisme « ne pas réannoncer une route à celui qui nous l'a apprise » s'appelle…", opts: ["Split horizon", "Route summary", "Hop count", "Fast reroute"], a: 0, exp: "Le split horizon limite les boucles en n'annonçant pas une route à sa source." },
    { type: "vf", q: "RIPv2 transporte le masque de sous-réseau, contrairement à RIPv1.", a: true, exp: "Oui : RIPv2 supporte VLSM/CIDR ; RIPv1 n'envoyait pas le masque." },
    { type: "qcm", q: "Quelle version de RIP utilise-t-on en pratique aujourd'hui ?", opts: ["RIPv1", "RIPv2", "RIPv5", "RIPv0"], a: 1, exp: "RIPv2 : masque inclus, multicast, authentification simple." },
    { type: "qcm", q: "RIPv2 envoie ses annonces via…", opts: ["Broadcast uniquement", "Multicast", "Unicast vers un serveur central", "TCP fiable"], a: 1, exp: "RIPv2 utilise le multicast (RIPv1 utilisait le broadcast)." },
    { type: "vf", q: "RIP donne à un routeur une carte complète et détaillée de tout le réseau.", a: false, exp: "Non : c'est l'état de liens (OSPF) qui construit une carte complète. RIP ne voit que ce que disent ses voisins." }
  ],
  final: {
    title: "Exercice final — Diagnostiquer un réseau sous RIP",
    intro: `<p>Le réseau d'une PME tourne sous RIPv2. Amel constate qu'un serveur situé au bout d'une longue chaîne de routeurs est injoignable, et que les pannes mettent du temps à se résorber. Aidons-la à poser le bon diagnostic.</p>`,
    questions: [
      { type: "qcm", q: "Le serveur est à 16 sauts. Pour RIP, cela signifie…", opts: ["Chemin optimal", "Infini : le serveur est déclaré inaccessible", "16 chemins possibles", "Une erreur DNS"], a: 1, exp: "16 = infini pour RIP : au-delà de 15 sauts, c'est injoignable." },
      { type: "input", q: "Quelle est la distance maximale utilisable qu'Amel doit respecter dans son plan de réseau (en sauts) ?", a: ["15", "15 sauts"], ph: "un nombre", exp: "15 sauts maximum : le réseau doit rester sous ce diamètre." },
      { type: "vf", q: "La lenteur à résorber les pannes s'explique par la convergence lente de RIP (mises à jour périodiques).", a: true, exp: "Oui : RIP propage l'information lentement, de proche en proche, toutes les ~30 s." },
      { type: "qcm", q: "Amel remarque qu'un chemin en fibre à 3 sauts est ignoré au profit d'un chemin lent à 2 sauts. Pourquoi ?", opts: ["RIP compte les sauts, pas la bande passante", "La fibre est en panne", "RIP préfère toujours le plus long", "C'est un bug d'IPv6"], a: 0, exp: "RIP ne regarde que le nombre de sauts, jamais la qualité du lien." },
      { type: "qcm", q: "Si Amel a besoin de dépasser 15 sauts ou d'une convergence rapide, elle devrait plutôt regarder…", opts: ["RIPv1", "Un protocole à état de liens comme OSPF", "Le routage statique pur", "Le DNS"], a: 1, exp: "OSPF (état de liens) lève la limite des 15 sauts et converge plus vite." }
    ],
    solution: `<pre class="pseudo"># Diagnostic d'Amel :
- Serveur a 16 sauts -> INFINI -> inaccessible (limite RIP = 15).
- Pannes lentes a resorber -> convergence LENTE (maj ~30 s, de proche en proche).
- Chemin fibre ignore -> RIP compte les SAUTS, pas la bande passante.
# Piste : passer a OSPF (etat de liens) pour lever la limite et converger vite.</pre>
<p>Amel a compris les limites de RIP. Demain : le protocole à état de liens OSPF, plus riche et plus rapide.</p>`
  }
};
