<script>
var DAY = {
  num: 2,
  title: "IPv6 : pourquoi ?",
  subtitle: "Quand le carnet d'adresses de la planète devient trop petit.",
  theory: `
<h3>1. Un problème d'arithmétique</h3>
<p>Une adresse IPv4 tient sur <strong>32 bits</strong>, soit quatre octets comme <code>192.168.1.10</code>. Trente-deux bits, cela fait 2 puissance 32, environ <strong>4,3 milliards</strong> d'adresses. En 1981, quand IPv4 a été standardisé, c'était colossal : la Terre comptait peu d'ordinateurs. Mais aujourd'hui, chaque humain possède souvent plusieurs appareils connectés — téléphone, ordinateur, montre, télévision — sans compter les serveurs, les caméras, les objets connectés. Le compte n'y est plus.</p>
<p>Fais le calcul : 8 milliards d'humains multipliés par plusieurs appareils chacun dépassent largement 4,3 milliards. C'est comme une ville qui aurait distribué tous ses numéros de téléphone : impossible d'en donner un nouveau sans en reprendre un ancien.</p>
<h3>2. L'épuisement d'IPv4, une histoire vraie</h3>
<p>Les adresses IPv4 sont distribuées par des organismes régionaux (les <em>RIR</em>). Dès 2011, le stock central mondial (géré par l'IANA) a été officiellement <strong>épuisé</strong> : plus de nouveaux blocs à distribuer. Depuis, les registres régionaux ont eux aussi atteint leurs limites. On a tenu grâce à des rustines : le partage d'adresses via le <strong>NAT</strong> (traduction d'adresses, plusieurs machines privées derrière une seule adresse publique) et un marché de revente d'adresses. Mais une rustine n'est pas une solution durable.</p>
<div class="warn">Le NAT a retardé la crise, pas résolu le problème de fond. Il complique les connexions entrantes, casse certaines applications (jeux, visioconférence, pair-à-pair) et ajoute une couche fragile. IPv6 supprime le besoin de NAT en donnant assez d'adresses pour tout le monde.</div>
<h3>3. IPv6 : la vraie réponse, 128 bits</h3>
<p>IPv6 code les adresses sur <strong>128 bits</strong>, soit quatre fois plus de bits qu'IPv4. Attention : quatre fois plus de bits ne veut pas dire quatre fois plus d'adresses, mais 2 puissance 128 — un nombre à 39 chiffres, de l'ordre de <strong>340 undécillions</strong> (340 suivi de 36 zéros). L'image classique : de quoi attribuer une adresse à chaque grain de sable de la planète, et il en resterait. Le manque d'adresses cesse d'être un problème pour très longtemps.</p>
<pre class="pseudo"># Comparaison de capacite
IPv4 : 32 bits  -> 2^32  ~ 4,3 milliards d'adresses
IPv6 : 128 bits -> 2^128 ~ 3,4 x 10^38 adresses
#
# 2^128, c'est environ 340 undecillions : pratiquement inepuisable.</pre>
<h3>4. IPv6 n'est pas QUE plus d'adresses</h3>
<p>En repartant d'une page presque blanche, les concepteurs d'IPv6 ont aussi <strong>simplifié et modernisé</strong> le protocole. Trois avantages notables : d'abord l'<strong>autoconfiguration</strong> (une machine peut se donner une adresse toute seule, sans serveur — on le verra jour 4) ; ensuite un <strong>en-tête simplifié</strong> et de taille fixe, plus rapide à traiter par les routeurs ; enfin la fin du <strong>NAT</strong>, chaque machine pouvant avoir une adresse publique, ce qui restaure la communication directe de bout en bout. La sécurité et la mobilité ont aussi été pensées plus tôt dans la conception.</p>
<div class="tip">Retiens la nuance : la raison NUMÉRO UN d'IPv6 est le nombre d'adresses. Les autres avantages (autoconf, en-tête, fin du NAT) sont des bonus rendus possibles par la refonte. Ne les cite pas comme motif principal.</div>
<h3>5. Pourquoi la transition traîne-t-elle ?</h3>
<p>Si IPv6 est meilleur, pourquoi tout le monde n'y est-il pas ? Parce qu'IPv6 n'est <strong>pas compatible directement</strong> avec IPv4 : une machine qui ne parle qu'IPv6 ne peut pas dialoguer avec une machine qui ne parle qu'IPv4. Il faut donc migrer tout l'écosystème — équipements, logiciels, fournisseurs d'accès — progressivement. D'où les techniques de cohabitation (double pile, tunnels) vues au jour 5. L'adoption progresse néanmoins d'année en année.</p>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># Le probleme : IPv4 = 32 bits ~ 4,3 milliards -> EPUISE
# La rustine  : NAT (partage d'adresses) -> retarde, ne resout pas
# La solution : IPv6 = 128 bits ~ 3,4 x 10^38 -> quasi inepuisable
#
# Avantages bonus : autoconfiguration, en-tete simplifie, fin du NAT.
# Raison n1 = le NOMBRE d'adresses.</pre>`,
  exercises: [
    { type: "qcm", q: "Combien d'adresses environ offre l'espace IPv4 (32 bits) ?", opts: ["4,3 millions", "4,3 milliards", "4,3 billions", "340 undécillions"], a: 1, exp: "2^32 fait environ 4,3 milliards d'adresses." },
    { type: "qcm", q: "Sur combien de bits une adresse IPv6 est-elle codée ?", opts: ["32", "64", "96", "128"], a: 3, exp: "IPv6 utilise 128 bits, soit 2^128 adresses possibles." },
    { type: "vf", q: "Passer de 32 à 128 bits multiplie le nombre d'adresses par 4.", a: false, exp: "Non : ce n'est pas 4x plus, mais 2^128 (le nombre est astronomiquement plus grand)." },
    { type: "input", q: "Quelle est la raison NUMÉRO UN de l'existence d'IPv6 (en quelques mots) ?", a: ["le manque d'adresses", "manque d'adresses", "l'epuisement d'ipv4", "epuisement des adresses ipv4", "plus d'adresses", "le nombre d'adresses", "epuisement ipv4"], ph: "quelques mots", exp: "La raison principale est l'épuisement / le manque d'adresses IPv4." },
    { type: "qcm", q: "Quelle « rustine » a permis de retarder l'épuisement d'IPv4 ?", opts: ["Le DNS", "Le NAT (partage d'adresses)", "Le Wi-Fi", "Le pare-feu"], a: 1, exp: "Le NAT met plusieurs machines privées derrière une seule adresse publique." },
    { type: "vf", q: "Le NAT résout définitivement le manque d'adresses IPv4.", a: false, exp: "Non : il retarde la crise mais ne la résout pas ; il complique aussi certaines applications." },
    { type: "qcm", q: "En quelle année environ le stock central mondial d'IPv4 (IANA) a-t-il été épuisé ?", opts: ["1995", "2011", "2020", "2025"], a: 1, exp: "Le stock central de l'IANA a été épuisé en 2011." },
    { type: "input", q: "Écris la puissance de 2 qui donne le nombre total d'adresses IPv6 (forme « 2^… »).", a: ["2^128", "2 puissance 128", "2**128", "2 128"], ph: "2^…", exp: "IPv6 = 128 bits, donc 2^128 adresses." },
    { type: "qcm", q: "Lequel N'EST PAS un avantage supplémentaire d'IPv6 ?", opts: ["L'autoconfiguration", "Un en-tête simplifié", "La suppression du besoin de NAT", "Le doublement de la vitesse d'Internet"], a: 3, exp: "IPv6 n'accélère pas magiquement Internet ; ses atouts sont adressage, autoconf, en-tête, fin du NAT." },
    { type: "qcm", q: "Pourquoi la transition vers IPv6 est-elle lente ?", opts: ["IPv6 est plus lent qu'IPv4", "IPv6 n'est pas directement compatible avec IPv4, il faut tout migrer", "IPv6 est payant", "IPv6 n'a jamais été standardisé"], a: 1, exp: "IPv6 et IPv4 ne dialoguent pas directement : la migration de l'écosystème est progressive." },
    { type: "vf", q: "Avec IPv6, chaque machine peut disposer d'une adresse publique, ce qui restaure la communication de bout en bout.", a: true, exp: "Oui : l'abondance d'adresses supprime le recours systématique au NAT." },
    { type: "input", q: "Comment appelle-t-on la technique qui met plusieurs machines privées derrière une seule adresse publique (trois lettres) ?", a: ["nat"], ph: "3 lettres", exp: "NAT : Network Address Translation, la traduction d'adresses." },
    { type: "qcm", q: "L'ordre de grandeur du nombre d'adresses IPv6 est de…", opts: ["Quelques millions", "Quelques milliards", "Environ 3,4 x 10^38", "Exactement 128"], a: 2, exp: "2^128 vaut environ 3,4 x 10^38, soit 340 undécillions." },
    { type: "vf", q: "IPv6 a été conçu en repartant presque de zéro, ce qui a permis de simplifier l'en-tête du paquet.", a: true, exp: "Oui : l'en-tête IPv6 est de taille fixe et plus simple à traiter pour les routeurs." },
    { type: "qcm", q: "Un exemple d'application souvent gênée par le NAT est…", opts: ["La lecture d'une page web statique", "La visioconférence ou le pair-à-pair", "L'envoi d'un e-mail simple", "La consultation du DNS"], a: 1, exp: "Le NAT complique les connexions entrantes : visio, jeux, pair-à-pair en souffrent." }
  ],
  final: {
    title: "Exercice final — Convaincre le patron",
    intro: `<p>Karim, administrateur réseau, veut convaincre sa direction d'investir dans IPv6. Son patron demande : « On a du NAT, ça marche, pourquoi changer ? » Aide Karim à construire son argumentaire chiffré et honnête.</p>`,
    questions: [
      { type: "qcm", q: "Premier argument de Karim : la taille de l'espace IPv4 est…", opts: ["Illimitée", "D'environ 4,3 milliards, et elle est épuisée", "De 128 bits", "De 340 undécillions"], a: 1, exp: "IPv4 = 32 bits ~ 4,3 milliards, stock épuisé depuis 2011." },
      { type: "input", q: "Karim rappelle le nombre de bits d'une adresse IPv6. Quel nombre ?", a: ["128", "128 bits"], ph: "un nombre", exp: "IPv6 code les adresses sur 128 bits." },
      { type: "vf", q: "Karim affirme honnêtement que le NAT a seulement retardé le problème, sans le résoudre.", a: true, exp: "Exact : le NAT est une rustine, pas une solution de fond." },
      { type: "qcm", q: "Le patron insiste : « Le NAT marche bien. » Quelle limite réelle Karim cite-t-il ?", opts: ["Le NAT casse certaines applications (visio, jeux, pair-à-pair)", "Le NAT consomme trop d'électricité", "Le NAT est illégal", "Le NAT efface les fichiers"], a: 0, exp: "Le NAT complique les connexions entrantes et gêne visio/jeux/pair-à-pair." },
      { type: "qcm", q: "Karim conclut : la raison de fond de passer à IPv6, c'est…", opts: ["La mode", "Le nombre d'adresses (128 bits, quasi inépuisable)", "La couleur des câbles", "La vitesse pure du réseau"], a: 1, exp: "La raison n1 reste le nombre d'adresses ; le reste est bonus." }
    ],
    solution: `<pre class="pseudo"># Argumentaire de Karim :
1) IPv4 = 32 bits ~ 4,3 milliards -> EPUISE depuis 2011.
2) NAT = rustine : retarde mais casse visio/jeux/pair-a-pair.
3) IPv6 = 128 bits ~ 3,4 x 10^38 -> assez pour tres longtemps.
4) Bonus : autoconfiguration, en-tete simplifie, fin du NAT.
# Raison n1 = le NOMBRE d'adresses.</pre>
<p>Le patron est convaincu. Demain : à quoi ressemble concrètement une adresse IPv6 ?</p>`
  }
};
