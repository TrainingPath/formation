var DAY = {
  num: 10,
  title: "Le routage inter-domaine (BGP)",
  subtitle: "Le protocole qui recolle les milliers de réseaux d'Internet en un seul.",
  theory: `
<h3>1. Le protocole qui fait tenir Internet</h3>
<p>Internet n'est pas un réseau unique, mais des dizaines de milliers de réseaux administrés séparément, appelés <strong>systèmes autonomes</strong> (en anglais <em>Autonomous Systems</em>, AS). Pour que ces réseaux indépendants s'échangent des routes, il faut un protocole capable de franchir les frontières administratives : c'est <strong>BGP</strong> (en anglais <em>Border Gateway Protocol</em>). On dit que BGP est l'<strong>EGP</strong> d'Internet, un <em>Exterior Gateway Protocol</em>, par opposition aux IGP comme OSPF qui travaillent à l'intérieur d'un AS.</p>
<p>Compare Internet à un continent de pays souverains. À l'intérieur d'un pays, on gère ses routes comme on veut (c'est OSPF). Mais pour aller d'un pays à l'autre, il faut des accords diplomatiques entre voisins frontaliers : c'est le rôle de BGP.</p>
<h3>2. Path vector : router par le chemin d'AS</h3>
<p>BGP n'est ni link-state ni un simple vecteur de distance : c'est un protocole à <strong>vecteur de chemin</strong> (en anglais <em>path vector</em>). Chaque annonce de route transporte la <strong>liste des AS à traverser</strong> pour l'atteindre, appelée <em>AS-PATH</em>. Cette liste sert deux buts : choisir un chemin (souvent le plus court en nombre d'AS) et <strong>détecter les boucles</strong> : si un routeur voit son propre numéro d'AS déjà présent dans l'AS-PATH, il rejette l'annonce.</p>
<pre class="pseudo"># Annonce BGP pour le reseau 203.0.113.0/24
Reseau : 203.0.113.0/24
AS-PATH : 65010 65020 65030   # traverser AS65010, puis 65020, puis 65030
# Si un routeur de l'AS65020 recoit un AS-PATH contenant deja 65020 -&gt; boucle -&gt; rejet.</pre>
<h3>3. eBGP et iBGP : dehors et dedans</h3>
<p>On distingue deux usages. Le <strong>eBGP</strong> (external BGP) relie deux routeurs situés dans des AS <strong>différents</strong> : c'est la vraie frontière entre organisations. Le <strong>iBGP</strong> (internal BGP) relie deux routeurs du <strong>même</strong> AS, pour transporter les routes externes à travers l'organisation. La distinction paraît subtile mais change les règles de propagation des routes.</p>
<h3>4. Une session BGP repose sur TCP</h3>
<p>Deux routeurs BGP voisins (des <strong>pairs</strong>, en anglais <em>peers</em>) n'échangent pas au hasard : ils ouvrent d'abord une connexion <strong>TCP sur le port 179</strong>. Ce choix est important : TCP garantit la livraison fiable et ordonnée des mises à jour, ce qui simplifie BGP. Les pairs ne sont pas découverts automatiquement comme dans OSPF : on les <strong>déclare manuellement</strong>, adresse par adresse. C'est cohérent avec l'idée d'accords volontaires entre organisations.</p>
<div class="tip">Trois faits à graver : BGP est un <strong>path vector</strong>, il route <strong>entre AS</strong>, et il s'appuie sur <strong>TCP port 179</strong>.</div>
<h3>5. Choisir une route : pas seulement le plus court</h3>
<p>Là où OSPF ne regarde qu'un coût technique, BGP décide selon des <strong>attributs</strong> qui reflètent aussi la <em>politique</em> commerciale. Parmi les plus connus : la <em>local preference</em> (préférence interne à l'AS), la longueur de l'<strong>AS-PATH</strong> (plus court = souvent préféré), l'origine, etc. Un opérateur peut donc préférer un chemin plus long parce qu'il coûte moins cher : BGP mélange technique et business.</p>
<div class="warn">BGP privilégie la politique sur la performance pure : le « meilleur » chemin BGP n'est pas toujours le plus rapide, mais celui que la politique de l'opérateur a désigné.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># BGP = Border Gateway Protocol, l'EGP d'Internet
# Route ENTRE systemes autonomes (AS), pas a l'interieur
# Type : path vector -&gt; annonce un AS-PATH (liste d'AS)
# AS-PATH sert aussi a detecter les boucles
# Transport : TCP, port 179 ; pairs declares manuellement
# eBGP = entre AS differents ; iBGP = dans le meme AS</pre>`,

    { type: "qcm", q: "eBGP relie deux routeurs…", opts: ["du même AS", "d'AS différents", "sans AS", "de la même sous-interface"], a: 1, exp: "eBGP (external) relie deux AS différents." },
    { type: "qcm", q: "iBGP relie deux routeurs…", opts: ["d'AS différents", "du même AS", "de VLAN différents", "sans TCP"], a: 1, exp: "iBGP (internal) relie deux routeurs du même AS." },
    { type: "vf", q: "Le meilleur chemin BGP est toujours le plus rapide en performance pure.", a: false, exp: "Non : BGP privilégie souvent la politique de l'opérateur sur la performance." },
    { type: "input", q: "Comment appelle-t-on (en anglais) deux routeurs BGP voisins qui échangent des routes ?", a: ["peers", "peer", "pairs", "pair"], ph: "un mot anglais", exp: "On parle de peers (pairs) BGP." },
    { type: "qcm", q: "Par opposition à un IGP comme OSPF, BGP est un…", opts: ["IGP", "EGP (Exterior Gateway Protocol)", "protocole statique", "protocole de niveau 2"], a: 1, exp: "BGP est un EGP : il route entre domaines administratifs." },
    { type: "vf", q: "Un AS-PATH plus court est souvent préféré par BGP.", a: true, exp: "Oui : à politique égale, un AS-PATH plus court est généralement choisi." },
    { type: "qcm", q: "Pourquoi BGP s'appuie-t-il sur TCP ?", opts: ["Pour être plus rapide qu'UDP", "Pour une livraison fiable et ordonnée des mises à jour", "Parce que c'est obligatoire pour tout routage", "Pour chiffrer le trafic"], a: 1, exp: "TCP fournit fiabilité et ordre, ce qui simplifie BGP." }
  ],
  final: {
    title: "Exercice final — Deux opérateurs s'interconnectent",
    intro: `<p>L'AS 65010 (un fournisseur d'accès) veut annoncer son réseau 198.51.100.0/24 à l'AS 65020 (un opérateur voisin). Leurs routeurs de bordure établissent une session pour échanger les routes. Analysons ce qui se passe.</p>`,
    questions: [
      { type: "qcm", q: "La session entre les deux routeurs de bordure d'AS différents est de type…", opts: ["iBGP", "eBGP", "OSPF", "statique"], a: 1, exp: "AS différents = eBGP (external)." },
      { type: "input", q: "Sur quel port TCP les deux routeurs ouvrent-ils la session ?", a: ["179"], ph: "un numéro", exp: "BGP ouvre la session sur TCP 179." },
      { type: "qcm", q: "Quand 65010 annonce son réseau à 65020, que devient l'AS-PATH vu par 65020 ?", opts: ["vide", "il contient 65010", "il contient 65020 seulement", "il contient l'IP source"], a: 1, exp: "En franchissant vers 65020, l'AS d'origine 65010 apparaît dans l'AS-PATH." },
      { type: "vf", q: "Si 65010 recevait en retour une annonce dont l'AS-PATH contient déjà 65010, il la rejetterait.", a: true, exp: "Oui : détection de boucle par l'AS-PATH." },
      { type: "qcm", q: "65020 pourrait préférer un autre chemin plus long si…", opts: ["c'est interdit", "sa politique/local preference le désigne", "l'AS-PATH est plus court", "le port change"], a: 1, exp: "La politique (local preference) peut l'emporter sur la longueur de l'AS-PATH." }
    ],
    solution: `<pre class="pseudo"># Cote AS65010 (routeur de bordure), config eBGP simplifiee
router bgp 65010
 neighbor 192.0.2.2 remote-as 65020   # pair declare manuellement
 network 198.51.100.0 mask 255.255.255.0
# Session : TCP 179 -&gt; annonce 198.51.100.0/24
# AS-PATH vu par 65020 : "65010"
# Detection de boucle : un AS-PATH contenant 65010 est rejete par 65010.</pre>
<p>Résumé : eBGP entre deux AS, session TCP 179, pairs déclarés à la main, AS-PATH pour le choix du chemin et la protection anti-boucle, politique pouvant primer sur la simple longueur.</p>`
  }
};
