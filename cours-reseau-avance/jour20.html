var DAY = {

  title: "Le WiFi d'entreprise (contrôleurs, SSID)",
  subtitle: "Gérer des dizaines de points d'accès de façon centralisée.",
  theory: `
<h3>1. Du WiFi domestique au WiFi d'entreprise</h3>
<p>À la maison, une seule box fait tout. En entreprise, on déploie parfois des dizaines ou des centaines de points d'accès (AP) sur plusieurs étages. Les configurer un par un serait ingérable : chaque changement de mot de passe ou de canal devrait être répété partout. La solution est de <strong>centraliser</strong> la gestion. On distingue alors les AP <strong>autonomes</strong> (chacun configuré seul, adapté au petit site) des AP <strong>managés</strong> (pilotés par un cerveau central).</p>
<h3>2. Le contrôleur WLAN (WLC)</h3>
<p>Le cerveau central s'appelle le <strong>contrôleur WLAN</strong> (en anglais <em>WLAN Controller</em>, WLC). Les points d'accès managés (dits « légers » ou <em>lightweight</em>) ne décident plus rien seuls : ils remontent au WLC, qui leur pousse la configuration, choisit les canaux et la puissance automatiquement, applique la sécurité et supervise l'ensemble. On configure une fois sur le WLC, et tous les AP sont mis à jour.</p>
<pre class="pseudo"># Architecture WiFi manage
        [ Contrôleur WLAN (WLC) ]
          |        |        |
       [AP-1]   [AP-2]   [AP-3]   ... (points d'acces legers)
# Le WLC pousse : SSID, canaux, puissance, securite, mises a jour.
# Les AP remontent : etat, clients connectes, mesures radio.</pre>
<div class="tip">Le WLC gere aussi le <strong>roaming</strong> a grande echelle : quand un utilisateur se deplace, le controleur coordonne le passage d'un AP a l'autre sans coupure, meme entre etages.</div>
<h3>3. Plusieurs SSID sur les mêmes AP</h3>
<p>Un même point d'accès peut diffuser plusieurs <strong>SSID</strong> (« Service Set Identifier », le nom du réseau WiFi). C'est très pratique pour séparer les usages sans multiplier le matériel. Typiquement une entreprise diffuse : un SSID « Interne » pour les employés, un SSID « Invités » pour les visiteurs, un SSID « Voix » pour les téléphones WiFi. Chaque SSID a ses propres règles de sécurité.</p>
<pre class="pseudo"># Un seul AP, trois SSID diffuses simultanement
SSID "ENTREPRISE"  -> employes, acces total
SSID "INVITES"     -> visiteurs, Internet seulement
SSID "VOIX"        -> telephones WiFi, QoS prioritaire</pre>
<h3>4. Associer chaque SSID à un VLAN</h3>
<p>Diffuser plusieurs SSID n'aurait pas d'intérêt s'ils aboutissaient tous au même réseau. On <strong>associe chaque SSID à un VLAN</strong> différent. Ainsi, le trafic des invités est isolé de celui des employés dès l'entrée dans le réseau filaire, comme s'ils étaient sur des réseaux physiquement séparés. Le pare-feu applique ensuite des règles par VLAN : les invités n'atteignent qu'Internet, jamais les serveurs internes.</p>
<pre class="pseudo"># Correspondance SSID <-> VLAN (isolation logique)
SSID "ENTREPRISE" -> VLAN 10  (postes de travail, serveurs)
SSID "INVITES"    -> VLAN 20  (Internet uniquement, isole)
SSID "VOIX"       -> VLAN 30  (telephonie, QoS)
# Le lien entre l'AP et le switch est un trunk 802.1Q qui transporte tous les VLAN.</pre>
<div class="warn">Un SSID "Invites" mal isole peut donner acces aux ressources internes. La regle : chaque SSID a SON VLAN, et le pare-feu limite ce que chaque VLAN peut atteindre. Ne jamais mettre invites et employes sur le meme VLAN.</div>
<h3>5. Sécurité et authentification</h3>
<p>Le WiFi d'entreprise s'appuie sur <strong>WPA2/WPA3-Entreprise</strong>, qui, au lieu d'un simple mot de passe partagé, authentifie chaque utilisateur individuellement via un serveur <strong>RADIUS</strong> (norme 802.1X). Chaque employé se connecte avec son propre identifiant ; on peut révoquer un accès sans changer la clé de tout le monde. Les invités, eux, passent souvent par un <strong>portail captif</strong> (page d'accueil web) sur le SSID « Invités ».</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># AP autonome (petit site) vs AP manage (grand site)
# WLC = controleur WLAN = cerveau central des AP legers
#   -> pousse config, canaux, puissance, securite ; gere le roaming
# Un AP diffuse PLUSIEURS SSID (Interne / Invites / Voix)
# Chaque SSID -> un VLAN different = isolation du trafic
# WPA2/WPA3-Entreprise + RADIUS (802.1X) = authentification par utilisateur
# Invites -> portail captif, VLAN isole, Internet seulement</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie le sigle WLC ?", opts: ["Wireless Link Cable", "WLAN Controller (contrôleur WLAN)", "WiFi Local Channel", "Wide LAN Connector"], a: 1, exp: "WLC = WLAN Controller : le contrôleur central des points d'accès." },

    { type: "qcm", q: "Le lien entre un AP multi-SSID et le switch est généralement…", opts: ["Un port access sur un seul VLAN", "Un trunk 802.1Q transportant plusieurs VLAN", "Une liaison sans fil", "Un câble croisé"], a: 1, exp: "Le trunk 802.1Q transporte tous les VLAN correspondant aux SSID." },
    { type: "vf", q: "Le contrôleur WLAN peut choisir automatiquement les canaux et la puissance des AP.", a: true, exp: "Oui : le WLC optimise canaux et puissance de façon centralisée." },
    { type: "qcm", q: "Pourquoi séparer le SSID « Invités » du réseau interne ?", opts: ["Pour aller plus vite", "Pour empêcher les visiteurs d'atteindre les serveurs internes", "Pour économiser des adresses IP", "Pour désactiver le WiFi la nuit"], a: 1, exp: "Isoler les invités les limite à Internet, sans accès aux ressources internes." },
    { type: "input", q: "Quel avantage clé de WPA2/WPA3-Entreprise + RADIUS : on peut révoquer un seul utilisateur sans changer quoi pour les autres ?", a: ["la cle", "le mot de passe", "la cle partagee", "le mot de passe partage", "cle", "mot de passe"], ph: "quelques mots", exp: "On révoque un compte sans changer la clé/mot de passe de tout le monde." },
    { type: "qcm", q: "Dans une architecture managée, que remontent les AP au contrôleur ?", opts: ["Rien du tout", "Leur état, les clients connectés et des mesures radio", "Uniquement leur adresse MAC", "Le mot de passe des utilisateurs en clair"], a: 1, exp: "Les AP remontent état, clients et mesures ; le WLC supervise l'ensemble." },
    { type: "vf", q: "Mettre invités et employés sur le même VLAN est une bonne pratique de sécurité.", a: false, exp: "Non : chaque SSID doit avoir son VLAN isolé pour protéger les ressources internes." },
    { type: "qcm", q: "Un site avec un seul AP dans un petit bureau utilisera plutôt…", opts: ["Un contrôleur WLAN dédié", "Un AP autonome", "Cent VLAN", "Un serveur RADIUS obligatoire"], a: 1, exp: "Pour un seul AP, l'autonome suffit ; le WLC devient utile à grande échelle." }
  ],
  final: {

    intro: `<p>Une entreprise équipe un étage avec 12 points d'accès. Elle veut un réseau employés, un réseau invités isolé et un réseau pour les téléphones WiFi, le tout géré de façon centralisée. Conçois l'architecture.</p>`,
    questions: [
      { type: "qcm", q: "Comment gérer 12 AP sans les configurer un par un ?", opts: ["Avec des AP autonomes", "Avec un contrôleur WLAN (WLC) et des AP managés", "Avec un câble par AP vers un PC", "En désactivant le WiFi"], a: 1, exp: "Le WLC centralise la configuration des 12 AP managés." },

      { type: "qcm", q: "Comment authentifier chaque employé individuellement ?", opts: ["Une clé WEP partagée", "WPA2/WPA3-Entreprise avec un serveur RADIUS", "Aucun mot de passe", "Un portail captif pour tous"], a: 1, exp: "WPA2/WPA3-Entreprise + RADIUS = un identifiant par employé." }
    ],
    solution: `<pre class="pseudo"># Architecture WiFi de l'etage
[ Controleur WLAN (WLC) ] --- pilote les 12 AP manages
Trois SSID diffuses par chaque AP, chacun sur son VLAN :
  SSID "ENTREPRISE" -> VLAN 10 -> WPA2/WPA3-Entreprise + RADIUS
  SSID "INVITES"    -> VLAN 20 -> portail captif, Internet SEULEMENT
  SSID "VOIX"       -> VLAN 30 -> telephones WiFi, QoS prioritaire
# Lien AP <-> switch : trunk 802.1Q (transporte VLAN 10/20/30)
# Le WLC : choisit canaux/puissance, gere le roaming entre les 12 AP</pre>
<p>Un contrôleur WLAN pilote les 12 AP d'un seul point. Trois SSID cohabitent sur chaque AP, chacun mappé à son VLAN pour isoler les trafics. Les employés s'authentifient via RADIUS, les invités passent par un portail captif limité à Internet, et la voix bénéficie de la QoS. Le roaming entre AP reste transparent.</p>`
