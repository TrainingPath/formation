<script>
var DAY = {
  num: 17,
  title: "La QoS en pratique",
  subtitle: "Donner la priorité à la voix quand le réseau est saturé.",
  theory: `
<h3>1. Pourquoi la qualité de service ?</h3>
<p>Sur un réseau, tous les paquets sont a priori traités de la même façon : premier arrivé, premier servi. Tant qu'il y a de la bande passante, tout va bien. Mais dès que le lien sature, une file d'attente se forme dans le routeur, et certains paquets sont retardés voire jetés. Pour un téléchargement, quelques millisecondes de retard ne se voient pas. Pour un <strong>appel téléphonique</strong> (VoIP) ou une visioconférence, le moindre retard provoque des coupures et des voix hachées. La <strong>qualité de service</strong> (en anglais <em>QoS</em>, « Quality of Service ») est l'ensemble des mécanismes qui permettent de dire au réseau : « ce trafic-là passe avant les autres ».</p>
<p>Imagine une autoroute embouteillée. La QoS, c'est la voie réservée aux ambulances : même quand tout est bloqué, elles passent. Les paquets de voix sont nos ambulances.</p>
<h3>2. Les critères à protéger : latence, gigue, perte</h3>
<p>Trois mesures décrivent la santé d'un flux temps réel. La <strong>latence</strong> (délai de bout en bout) doit rester basse : au-delà de ~150 ms pour la voix, la conversation devient pénible. La <strong>gigue</strong> (en anglais <em>jitter</em>) est la variation de ce délai d'un paquet à l'autre ; une forte gigue rend la voix saccadée. La <strong>perte de paquets</strong> (en anglais <em>packet loss</em>) coupe des morceaux de son. La QoS agit sur ces trois critères en réservant un traitement prioritaire au trafic sensible.</p>
<h3>3. Le marquage DSCP</h3>
<p>Pour traiter un paquet en priorité, il faut d'abord l'<strong>identifier</strong>. On appose donc une étiquette dans l'en-tête IP : le champ <strong>DSCP</strong> (« Differentiated Services Code Point »), codé sur 6 bits dans l'octet ToS de l'en-tête IPv4. Chaque valeur correspond à une classe de service. La plus connue pour la voix est <strong>EF</strong> (« Expedited Forwarding », DSCP 46) : acheminement accéléré. Les données de gestion vidéo/voix utilisent souvent les classes <strong>AF</strong> (« Assured Forwarding »), et le trafic ordinaire reste en <strong>BE</strong> (« Best Effort », DSCP 0).</p>
<pre class="pseudo"># Champ DSCP dans l'octet ToS de l'en-tete IPv4 (6 bits)
Classe    DSCP   Usage typique
BE  (0)     0    trafic ordinaire (web, mail, telechargement)
AF41       34    video interactive
EF         46    voix (VoIP) : priorite maximale
CS6        48    protocoles de routage (controle du reseau)</pre>
<div class="tip">On marque le trafic le plus tot possible, idealement sur le telephone IP ou le premier commutateur : c'est la <strong>frontiere de confiance</strong> (« trust boundary »). Ensuite, chaque routeur du chemin lit le DSCP et applique sa politique.</div>
<h3>4. Classification, mise en file et politiques</h3>
<p>Une fois marqué, le paquet est <strong>classé</strong> puis placé dans une <strong>file d'attente</strong> selon sa classe. Le routeur applique alors un <strong>ordonnancement</strong> : la file EF est servie en priorité stricte (« Low Latency Queuing »), les autres files se partagent le reste équitablement. Deux outils complètent le tableau : le <strong>policing</strong> qui jette le trafic qui dépasse un débit autorisé, et le <strong>shaping</strong> qui le lisse en le retenant temporairement au lieu de le jeter.</p>
<pre class="pseudo"># Logique d'une politique QoS (pseudo-config)
class-map VOIX
  match dscp ef                 # on reconnait la voix au DSCP 46
policy-map SORTIE
  class VOIX
    priority 128                # file prioritaire, 128 kbit/s reserves
  class DEFAUT
    bandwidth remaining 100     # le reste se partage le lien</pre>
<h3>5. Cas concret : VoIP prioritaire</h3>
<p>Un site a un lien WAN de 10 Mbit/s partagé entre navigation, sauvegardes et téléphonie. Sans QoS, une grosse sauvegarde sature le lien et les appels coupent. Avec QoS : le téléphone IP marque sa voix en EF (DSCP 46), le routeur de sortie place cette voix dans une file prioritaire garantie (par exemple 1 Mbit/s), et applique du shaping sur les sauvegardes. Résultat : même en pleine sauvegarde, la voix reste fluide car elle « double » les autres paquets à chaque routeur.</p>
<div class="warn">La QoS ne cree pas de bande passante : elle la <strong>repartit</strong>. Si le lien est trop petit pour la voix elle-meme, aucune priorite ne sauvera l'appel. La QoS gere la penurie, elle ne l'annule pas.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># QoS = donner un traitement prioritaire au trafic sensible
# 3 ennemis du temps reel : latence, gigue (jitter), perte
# DSCP = etiquette 6 bits dans l'en-tete IP  ->  EF (46) = voix
# Chaine : MARQUER -> CLASSER -> METTRE EN FILE -> ORDONNANCER
# policing = jeter l'exces | shaping = lisser l'exces
# La QoS repartit la bande passante, elle n'en cree pas</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie le sigle QoS ?", opts: ["Queue of Service", "Quality of Service", "Quick Optical Signal", "Quantity of Sessions"], a: 1, exp: "QoS = Quality of Service : la qualité de service réseau." },
    { type: "qcm", q: "Quel type de trafic a le plus besoin de QoS ?", opts: ["Un téléchargement de fichier", "Un appel VoIP en temps réel", "Un envoi de mail", "Une sauvegarde nocturne"], a: 1, exp: "La voix temps réel supporte mal le retard et la perte : elle est prioritaire." },
    { type: "input", q: "Comment appelle-t-on (mot anglais) la variation du délai entre les paquets ?", a: ["jitter", "gigue", "la gigue", "le jitter"], ph: "un mot", exp: "La gigue (jitter) est la variation de la latence d'un paquet à l'autre." },
    { type: "qcm", q: "Le champ DSCP se trouve dans l'en-tête de quel protocole ?", opts: ["Ethernet", "IP", "TCP", "HTTP"], a: 1, exp: "DSCP occupe 6 bits de l'octet ToS de l'en-tête IP." },
    { type: "input", q: "Quelle valeur DSCP (nombre) correspond à la classe EF utilisée pour la voix ?", a: ["46", "ef", "46 (ef)"], ph: "un nombre", exp: "EF = Expedited Forwarding = DSCP 46, réservé à la voix." },
    { type: "vf", q: "La QoS crée de la bande passante supplémentaire sur le lien.", a: false, exp: "Non : elle répartit la bande passante existante, elle n'en fabrique pas." },
    { type: "qcm", q: "Sur combien de bits est codé le champ DSCP ?", opts: ["4 bits", "6 bits", "8 bits", "16 bits"], a: 1, exp: "DSCP tient sur 6 bits, ce qui donne 64 valeurs possibles." },
    { type: "vf", q: "On a intérêt à marquer le trafic le plus tôt possible, près de la source.", a: true, exp: "Oui : à la frontière de confiance (téléphone IP ou premier commutateur)." },
    { type: "qcm", q: "Quelle classe DSCP correspond au trafic ordinaire (best effort) ?", opts: ["EF (46)", "AF41 (34)", "BE (0)", "CS6 (48)"], a: 2, exp: "Best Effort = DSCP 0 : le trafic sans priorité particulière." },
    { type: "input", q: "Quel mécanisme JETTE le trafic qui dépasse un débit autorisé (mot anglais) ?", a: ["policing", "le policing", "policer"], ph: "un mot anglais", exp: "Le policing jette l'excédent ; le shaping le lisse au lieu de le jeter." },
    { type: "qcm", q: "Quelle est la différence entre policing et shaping ?", opts: ["Aucune, ce sont des synonymes", "Le policing jette l'excédent, le shaping le retient et le lisse", "Le shaping marque, le policing route", "Le policing chiffre le trafic"], a: 1, exp: "Shaping = lissage (retenue temporaire) ; policing = suppression de l'excédent." },
    { type: "vf", q: "Au-delà d'environ 150 ms de latence, une conversation VoIP devient inconfortable.", a: true, exp: "Oui : ~150 ms est le seuil classique de gêne pour la voix interactive." },
    { type: "qcm", q: "Dans une file prioritaire stricte, la voix EF est servie…", opts: ["En dernier", "Avant les autres files", "Une fois sur deux", "Uniquement la nuit"], a: 1, exp: "La file EF passe en priorité (Low Latency Queuing) devant les autres." },
    { type: "input", q: "Comment nomme-t-on l'endroit du réseau où l'on décide de faire confiance (ou non) au marquage reçu ?", a: ["frontiere de confiance", "trust boundary", "la frontiere de confiance", "frontière de confiance"], ph: "en français ou anglais", exp: "La frontière de confiance (trust boundary) : là où l'on marque ou re-marque le trafic." },
    { type: "qcm", q: "Un lien WAN est saturé par une sauvegarde et les appels coupent. Que fait la QoS ?", opts: ["Elle augmente le débit du lien", "Elle place la voix en file prioritaire et lisse la sauvegarde", "Elle bloque tout le trafic", "Elle chiffre la voix"], a: 1, exp: "La voix est priorisée (EF) et la sauvegarde est mise en forme (shaping)." }
  ],
  final: {
    title: "Exercice final — Prioriser la voix sur un lien saturé",
    intro: `<p>Une PME dispose d'un lien WAN de 10 Mbit/s partagé entre le web, les sauvegardes et la téléphonie IP. Le soir, une sauvegarde sature le lien et les appels se coupent. Tu dois concevoir la politique QoS.</p>`,
    questions: [
      { type: "qcm", q: "Quelle est la cause des coupures d'appel ?", opts: ["Le web est chiffré", "La sauvegarde sature le lien et retarde/jette la voix", "Les téléphones sont éteints", "Le DSCP est trop grand"], a: 1, exp: "Sans priorité, la voix subit la file d'attente créée par la sauvegarde." },
      { type: "input", q: "Quel DSCP dois-tu appliquer aux paquets de voix ?", a: ["46", "ef", "46 ef"], ph: "valeur", exp: "EF = DSCP 46 pour la voix." },
      { type: "vf", q: "Il vaut mieux marquer la voix directement sur le téléphone IP (frontière de confiance).", a: true, exp: "Oui : marquer au plus près de la source garantit un traitement cohérent partout." },
      { type: "qcm", q: "Comment traites-tu la sauvegarde pour qu'elle ne noie plus la voix ?", opts: ["Tu la mets aussi en EF", "Tu la laisses en Best Effort et tu lui appliques du shaping", "Tu la supprimes définitivement", "Tu la routes vers le téléphone"], a: 1, exp: "La sauvegarde reste en BE et est lissée (shaping) pour laisser passer la voix." },
      { type: "qcm", q: "Après configuration, une grosse sauvegarde repart. Que se passe-t-il pour les appels ?", opts: ["Ils coupent encore", "Ils restent fluides car la voix passe en file prioritaire", "Le lien tombe", "Le DSCP disparaît"], a: 1, exp: "La file prioritaire garantit à la voix de doubler la sauvegarde à chaque routeur." }
    ],
    solution: `<pre class="pseudo"># Politique QoS de la PME
# 1) Marquage a la source : le telephone IP marque la voix en EF (DSCP 46)
# 2) Classification sur le routeur de sortie :
class-map VOIX
  match dscp ef
# 3) File prioritaire pour la voix, reste partage :
policy-map WAN-SORTIE
  class VOIX
    priority 1000            # 1 Mbit/s garanti, priorite stricte
  class DEFAUT
    bandwidth remaining 100  # web + sauvegardes se partagent le reste
    shape average ...        # on lisse les gros flux</pre>
<p>La voix est identifiée (EF), isolée dans une file prioritaire et garantie ; les sauvegardes sont lissées. Le lien reste plein, mais la voix passe toujours devant. La QoS n'a pas agrandi le tuyau, elle a organisé le passage.</p>`
  }
};
</script>
