var DAY = {
  num: 21,
  title: "La téléphonie sur IP (VoIP)",
  subtitle: "Faire passer la voix sur le même réseau que les données.",
  theory: `
<h3>1. Qu'est-ce que la VoIP ?</h3>
<p>La <strong>téléphonie sur IP</strong> (en anglais <em>VoIP</em>, « Voice over IP ») consiste à transporter la voix sous forme de paquets sur le réseau informatique, au lieu du réseau téléphonique classique. Un téléphone IP, un logiciel (softphone) ou un smartphone numérise la voix, la découpe en paquets et l'envoie sur le réseau IP. L'avantage : un seul réseau (données + voix), des coûts réduits, et des services avancés (visioconférence, messagerie unifiée).</p>
<h3>2. Deux protocoles complémentaires : SIP et RTP</h3>
<p>Un appel VoIP repose sur deux rôles bien distincts. Le premier, la <strong>signalisation</strong>, gère l'établissement de l'appel : trouver le correspondant, faire sonner, décrocher, raccrocher. C'est le rôle de <strong>SIP</strong> (« Session Initiation Protocol »). Le second, le <strong>transport du son</strong> lui-même, une fois l'appel établi, est assuré par <strong>RTP</strong> (« Real-time Transport Protocol »). En résumé : SIP monte l'appel, RTP transporte la voix.</p>
<pre class="pseudo"># Roles des deux protocoles
SIP  = signalisation : INVITE, sonnerie, decrochage, raccrochage (BYE)
RTP  = media : transporte les echantillons de voix pendant l'appel
# Analogie : SIP est la standardiste qui etablit la communication ;
# RTP est la ligne sur laquelle la voix circule ensuite.</pre>
<div class="tip">SIP fonctionne souvent sur le port 5060. RTP utilise UDP (pas TCP) : pour la voix, mieux vaut un paquet perdu qu'un paquet retransmis en retard. La ponctualite prime sur l'exhaustivite.</div>
<h3>3. Pourquoi UDP et pas TCP ?</h3>
<p>RTP s'appuie sur <strong>UDP</strong>, un transport sans retransmission ni accusé de réception. Cela paraît contre-intuitif, mais pour la voix en temps réel, retransmettre un paquet perdu ne sert à rien : quand la copie arriverait, le moment de le jouer serait déjà passé. On préfère donc laisser un petit trou (à peine audible) plutôt que d'attendre. TCP, avec ses retransmissions, introduirait des retards intolérables.</p>
<h3>4. Les codecs : compresser la voix</h3>
<p>Un <strong>codec</strong> (codeur-décodeur) transforme la voix analogique en données numériques et la compresse. Le choix du codec est un compromis entre <strong>qualité</strong> et <strong>débit</strong> consommé. Le codec <strong>G.711</strong> offre une excellente qualité mais consomme ~64 kbit/s ; <strong>G.729</strong> compresse beaucoup plus (~8 kbit/s) au prix d'une qualité un peu moindre, utile sur les liens WAN limités. On choisit le codec selon la bande passante disponible.</p>
<pre class="pseudo"># Codecs courants (compromis qualite / debit)
Codec    Debit approx.   Usage typique
G.711    ~64 kbit/s      LAN, excellente qualite
G.729    ~8 kbit/s       WAN, economie de bande passante
Opus     variable        moderne, s'adapte au reseau</pre>
<h3>5. Priorisation : la voix a besoin de QoS</h3>
<p>La voix est fragile : sensible à la <strong>latence</strong>, à la <strong>gigue</strong> (jitter) et à la <strong>perte</strong>. Sur un réseau chargé, il faut donc la <strong>prioriser</strong> avec la QoS. On marque les paquets RTP en <strong>DSCP EF (46)</strong> et on les place en file prioritaire, comme vu au jour 17. Sans QoS, un simple téléchargement peut hacher une conversation. On isole aussi souvent la voix dans un <strong>VLAN voix</strong> dédié pour lui appliquer facilement ces règles.</p>
<div class="warn">La signalisation SIP peut poser probleme avec le NAT et les pare-feu : les adresses annoncees dans SIP sont internes et deviennent invalides une fois traduites. On utilise des mecanismes (SBC, ALG SIP, STUN) pour resoudre ce cas classique.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># VoIP = transporter la voix en paquets sur le reseau IP
# SIP = signalisation (etablir/terminer l'appel), souvent port 5060
# RTP = transport du son pendant l'appel, sur UDP
# UDP car retransmettre un paquet de voix en retard est inutile
# Codec = compromis qualite/debit : G.711 (64k, qualite) / G.729 (8k, WAN)
# Voix fragile -> QoS : DSCP EF (46) + file prioritaire + VLAN voix</pre>`,

    { type: "input", q: "Quel codec offre une excellente qualité pour environ 64 kbit/s ?", a: ["g.711", "g711", "g 711", "g.711 (64k)"], ph: "G.???", exp: "G.711 : ~64 kbit/s, excellente qualité, typique du LAN." },
    { type: "qcm", q: "Quel codec compresse fortement (~8 kbit/s) pour les liens WAN limités ?", opts: ["G.711", "G.729", "Opus HD", "MP3"], a: 1, exp: "G.729 : ~8 kbit/s, économe, utile sur WAN au débit restreint." },
    { type: "vf", q: "La voix est peu sensible à la latence et à la gigue.", a: false, exp: "Faux : la voix est très sensible à la latence, à la gigue et à la perte." },

    { type: "qcm", q: "Sur quel port fonctionne classiquement SIP ?", opts: ["80", "443", "5060", "22"], a: 2, exp: "SIP utilise couramment le port 5060." },
    { type: "vf", q: "SIP et RTP jouent le même rôle et sont interchangeables.", a: false, exp: "Non : SIP = signalisation (monter l'appel), RTP = transport de la voix." },

    { type: "qcm", q: "Quel problème classique la signalisation SIP rencontre-t-elle ?", opts: ["Le NAT/pare-feu, car SIP annonce des adresses internes", "Elle consomme trop de disque", "Elle exige du câble fibre", "Elle interdit la QoS"], a: 0, exp: "Le NAT casse les adresses annoncées dans SIP ; on utilise SBC/ALG/STUN." },
    { type: "input", q: "Comment appelle-t-on la variation du délai entre paquets, néfaste à la voix ?", a: ["gigue", "la gigue", "jitter", "le jitter"], ph: "un mot", exp: "La gigue (jitter) fait saccader la voix si elle est trop forte." }
  ],
  final: {
    title: "Exercice final — Déployer la VoIP sur un site chargé",
    intro: `<p>Une entreprise déploie des téléphones IP sur un site où le réseau est déjà chargé par les données. Les premiers essais donnent des voix hachées pendant les gros transferts. Diagnostique et corrige.</p>`,
    questions: [
      { type: "qcm", q: "Quel protocole établit l'appel avant que la voix ne circule ?", opts: ["RTP", "SIP", "FTP", "ICMP"], a: 1, exp: "SIP monte l'appel ; ensuite RTP transporte la voix." },
      { type: "input", q: "Quel protocole transporte la voix, et sur quel transport s'appuie-t-il (nom + 3 lettres) ?", a: ["rtp udp", "rtp sur udp", "rtp, udp", "rtp / udp"], ph: "protocole + transport", exp: "RTP transporte la voix, sur UDP." },
      { type: "qcm", q: "Pourquoi la voix est-elle hachée pendant les gros transferts ?", opts: ["Le codec est chiffré", "Sans QoS, la voix subit latence, gigue et pertes dues à la congestion", "SIP est désactivé", "Le VLAN est trop grand"], a: 1, exp: "Sans priorisation, la voix est retardée/perdue quand le lien sature." },
      { type: "input", q: "Quel DSCP appliquer aux paquets RTP pour les prioriser ?", a: ["46", "ef", "46 ef"], ph: "valeur", exp: "DSCP EF = 46 pour la voix." },
      { type: "vf", q: "Placer la voix dans un VLAN voix dédié facilite l'application de la QoS.", a: true, exp: "Oui : le VLAN voix isole le trafic et simplifie la priorisation." }
    ],
    solution: `<pre class="pseudo"># Deploiement VoIP sur site charge
# 1) Etablissement : SIP (port 5060) monte/termine les appels
# 2) Media : RTP sur UDP transporte la voix (pas de retransmission)
# 3) Probleme des voix hachees = congestion sans QoS
# 4) Correction :
#    - VLAN voix dedie pour isoler le trafic telephonique
#    - Marquage DSCP EF (46) sur les paquets RTP
#    - File prioritaire sur les routeurs (Low Latency Queuing)
# 5) Codec : G.711 sur le LAN (qualite), G.729 si lien WAN limite</pre>
<p>SIP établit l'appel, RTP transporte la voix sur UDP. Les voix hachées venaient de l'absence de QoS : sous congestion, la voix subissait retards et pertes. En isolant la voix dans un VLAN dédié, en la marquant EF (46) et en la priorisant, les appels redeviennent fluides même pendant les gros transferts.</p>`
  }
};
