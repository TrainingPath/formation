<script>
var DAY = {
  num: 1,
  title: "Au-delà des fondamentaux : panorama",
  subtitle: "Ce qui reste à conquérir une fois les cinq premiers cours digérés.",
  theory: `
<h3>1. Où en sommes-nous ?</h3>
<p>Après cinq cours, tu maîtrises les <strong>fondamentaux</strong> : le modèle en couches (OSI et TCP/IP), les adresses IPv4 en quatre octets, le masque de sous-réseau et la notation <em>CIDR</em> (<code>/24</code>), la passerelle par défaut, le rôle du <strong>DNS</strong>, et les grands protocoles de transport <strong>TCP</strong> (fiable, orienté connexion) et <strong>UDP</strong> (rapide, sans garantie). Tu sais lire une table de routage simple et pinguer une machine. C'est le socle. Ce sixième cours suppose tout cela acquis et t'emmène plus loin.</p>
<p>Imagine que tu saches conduire en ville : feux, priorités, stationnement. Ce cours, c'est l'autoroute et la conduite longue distance : de nouveaux panneaux (IPv6), un GPS qui recalcule tout seul (routage dynamique), et la cohabitation de deux mondes qui se croisent (IPv4 et IPv6 en même temps).</p>
<h3>2. Le premier grand chantier : IPv6</h3>
<p>Le web a grandi plus vite que prévu. Les adresses IPv4, codées sur <strong>32 bits</strong>, offrent environ 4,3 milliards de combinaisons : c'est trop peu pour une planète de smartphones, d'objets connectés et de serveurs. La réponse s'appelle <strong>IPv6</strong> (<em>Internet Protocol version 6</em>), qui code les adresses sur <strong>128 bits</strong>. On passe d'un carnet d'adresses de quartier à un annuaire quasi infini. Les jours 2 à 4 détaillent le pourquoi, la notation hexadécimale, et l'autoconfiguration qui permet à une machine de se donner une adresse toute seule.</p>
<div class="tip">IPv6 n'est pas « IPv4 en plus grand » : la notation, la configuration et la découverte du voisinage changent. Mais la logique de couches et de routage reste la même. Tu ne repars pas de zéro.</div>
<h3>3. Le deuxième grand chantier : le routage dynamique</h3>
<p>Jusqu'ici, tu ajoutais des routes <strong>à la main</strong> (routage statique). Cela marche pour trois routeurs, pas pour trois cents. Les grands réseaux utilisent des <strong>protocoles de routage dynamique</strong> : les routeurs se parlent, s'échangent ce qu'ils savent, et construisent tout seuls leurs tables. Si un lien tombe, ils recalculent un autre chemin sans intervention humaine. Les jours 6 à 8 explorent deux familles : <strong>RIP</strong> (à vecteur de distance, simple mais lent) et <strong>OSPF</strong> (à état de liens, plus intelligent).</p>
<h3>4. La cohabitation, un sujet à part entière</h3>
<p>On ne remplace pas IPv4 par IPv6 du jour au lendemain. Pendant des années, les deux coexistent. Le jour 5 présente les techniques de <strong>transition</strong> : la <strong>double pile</strong> (dual stack, une machine qui parle les deux langues), les <strong>tunnels</strong> (encapsuler de l'IPv6 dans de l'IPv4 pour traverser un réseau qui ne connaît qu'IPv4) et la <strong>translation</strong>. Savoir faire cohabiter les deux est aujourd'hui une compétence de terrain incontournable.</p>
<pre class="pseudo"># Panorama du cours 6 (avance)
Jour 2  : IPv6, pourquoi ?          (epuisement IPv4, 128 bits)
Jour 3  : adressage IPv6            (hexa, ::, unicast/multicast/anycast)
Jour 4  : autoconfiguration         (SLAAC, RA, NDP, EUI-64)
Jour 5  : cohabiter v4/v6           (dual stack, tunnels 6in4, translation)
Jour 6  : routage dynamique         (metriques, convergence)
Jour 7  : vecteur de distance       (RIP, sauts, max 15)
Jour 8  : etat de liens             (OSPF, Dijkstra, aires)</pre>
<h3>5. La bonne posture pour ce cours</h3>
<p>Deux réflexes vont te servir tout du long. D'abord, <strong>relier</strong> chaque nouveauté à ce que tu connais : une adresse IPv6 reste une adresse, une route reste une route. Ensuite, penser en termes de <strong>problème résolu</strong> : chaque technologie existe parce qu'une limite précise a été atteinte. IPv6 résout le manque d'adresses ; le routage dynamique résout l'impossibilité de tout configurer à la main ; la double pile résout la transition. Garde ces « pourquoi » en tête.</p>
<div class="warn">Ne confonds pas les deux grands thèmes : l'<strong>adressage</strong> (IPv4 vs IPv6, jours 2 à 5) répond à « comment nommer les machines ». Le <strong>routage</strong> (jours 6 à 8) répond à « comment trouver le chemin ». Ce sont deux questions distinctes, indépendantes l'une de l'autre.</div>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># Deux grands themes pour ce cours avance :
Adressage : IPv4 (32 bits) -> IPv6 (128 bits) + cohabitation
Routage   : statique (a la main) -> dynamique (les routeurs se parlent)
#
# Chaque techno = une reponse a une limite precise.
# IPv6 -> manque d'adresses | routage dynamique -> passage a l'echelle</pre>`,

    { type: "qcm", q: "Sur combien de bits une adresse IPv4 est-elle codée ?", opts: ["16 bits", "32 bits", "64 bits", "128 bits"], a: 1, exp: "IPv4 = 32 bits, soit environ 4,3 milliards d'adresses possibles." },
    { type: "qcm", q: "Sur combien de bits une adresse IPv6 est-elle codée ?", opts: ["32 bits", "48 bits", "64 bits", "128 bits"], a: 3, exp: "IPv6 = 128 bits : un espace d'adressage gigantesque face à IPv4." },
    { type: "vf", q: "Ce cours suppose que les cinq cours précédents (fondamentaux) sont déjà acquis.", a: true, exp: "Oui : c'est un cours avancé qui construit sur le socle des fondamentaux." },
    { type: "qcm", q: "Quel problème IPv6 résout-il principalement ?", opts: ["La lenteur du DNS", "L'épuisement des adresses IPv4", "Les virus informatiques", "Le manque de câbles"], a: 1, exp: "IPv6 répond au manque d'adresses : 128 bits contre 32." },
    { type: "vf", q: "Le routage statique (routes ajoutées à la main) passe bien à l'échelle sur des centaines de routeurs.", a: false, exp: "Non : au-delà de quelques routeurs, on utilise le routage dynamique." },
    { type: "input", q: "Comment appelle-t-on le fait qu'une machine parle À LA FOIS IPv4 et IPv6 (deux mots, terme français ou anglais) ?", a: ["double pile", "dual stack", "la double pile", "pile double"], ph: "deux mots", exp: "La double pile (dual stack) : la machine dispose des deux protocoles en parallèle." },
    { type: "qcm", q: "Dans le routage dynamique, comment les tables de routage se construisent-elles ?", opts: ["Un humain les tape entièrement", "Les routeurs s'échangent des informations et calculent tout seuls", "Elles sont fixées par le fabricant", "Elles sont téléchargées depuis un site web"], a: 1, exp: "Les routeurs se parlent et construisent leurs tables automatiquement." },
    { type: "qcm", q: "Deux grands thèmes structurent ce cours. Lesquels ?", opts: ["Le câblage et l'électricité", "L'adressage et le routage", "Le Wi-Fi et la fibre", "Les serveurs et les clients"], a: 1, exp: "Adressage (comment nommer) et routage (comment trouver le chemin)." },
    { type: "vf", q: "Passer de IPv4 à IPv6 se fait instantanément, du jour au lendemain, à l'échelle d'Internet.", a: false, exp: "Non : les deux coexistent pendant des années, d'où les techniques de transition." },
    { type: "input", q: "Quel protocole de transport est fiable et orienté connexion (trois lettres) ?", a: ["tcp"], ph: "3 lettres", exp: "TCP : fiable et orienté connexion. UDP est rapide mais sans garantie." },
    { type: "qcm", q: "La question « comment trouver le chemin vers une machine » relève de…", opts: ["L'adressage", "Le routage", "Le DNS", "Le câblage"], a: 1, exp: "Le routage traite de la recherche de chemin ; l'adressage, du nommage." },
    { type: "vf", q: "IPv6 abandonne complètement la logique en couches du modèle TCP/IP.", a: false, exp: "Non : la logique de couches reste la même ; c'est surtout l'adressage qui change." },
    { type: "qcm", q: "Encapsuler de l'IPv6 dans de l'IPv4 pour traverser un réseau ancien s'appelle un…", opts: ["Pare-feu", "Tunnel", "Proxy", "Commutateur"], a: 1, exp: "Un tunnel (ex. 6in4) transporte l'IPv6 à l'intérieur de paquets IPv4." },
    { type: "input", q: "Combien d'adresses IPv4 environ (en milliards) offre l'espace 32 bits ?", a: ["4,3", "4.3", "4", "4,3 milliards", "environ 4 milliards"], ph: "un nombre", exp: "Environ 4,3 milliards d'adresses, insuffisant pour la planète connectée." },
    { type: "qcm", q: "Selon la leçon, chaque technologie de ce cours existe surtout parce que…", opts: ["Elle est à la mode", "Une limite précise a été atteinte", "Un fabricant l'a imposée", "Elle est plus jolie"], a: 1, exp: "Chaque techno répond à un problème concret : garde le « pourquoi » en tête." }
  ],

    questions: [

      { type: "vf", q: "Sofia peut s'appuyer sur ses connaissances de TCP, UDP, masque et DNS : ce cours ne les réexplique pas.", a: true, exp: "Oui : c'est un cours avancé, le socle est supposé acquis." },
      { type: "input", q: "Sur combien de bits est codée l'adresse IPv6 qu'elle va étudier dès le jour 2 ?", a: ["128", "128 bits"], ph: "un nombre", exp: "128 bits : c'est LA nouveauté centrale d'IPv6." },

    ],
    solution: `<pre class="pseudo"># La carte mentale de Sofia :
