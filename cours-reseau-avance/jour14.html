<script>
var DAY = {
  num: 14,
  title: "Le protocole Spanning Tree (STP)",
  subtitle: "Éliminer les boucles de niveau 2 sans renoncer aux liens de secours.",
  theory: `
<h3>1. Pourquoi les boucles de niveau 2 sont catastrophiques</h3>
<p>Pour la fiabilité, on relie souvent les commutateurs par plusieurs câbles : si l'un tombe, l'autre prend le relais. Mais au niveau 2 (Ethernet), une boucle physique est un désastre. Contrairement à IP, une trame Ethernet n'a <strong>pas de TTL</strong> qui la ferait mourir. Une trame de diffusion (<em>broadcast</em>) tourne alors indéfiniment, se duplique à chaque tour, et sature le réseau en quelques secondes : c'est la <strong>tempête de broadcast</strong> (<em>broadcast storm</em>).</p>
<p>Imagine un rond-point sans sortie où chaque voiture se clone à chaque tour : en un instant, plus rien ne circule. Il faut fermer une bretelle pour casser la boucle, tout en gardant la possibilité de la rouvrir si une autre route se ferme.</p>
<h3>2. STP : garder la redondance, bloquer les boucles</h3>
<p>Le <strong>Spanning Tree Protocol</strong> (STP), normalisé par <strong>IEEE 802.1D</strong>, résout ce problème. Son idée : à partir d'un réseau maillé avec des boucles, il calcule un <strong>arbre</strong> (spanning tree) sans boucle en <strong>bloquant logiquement</strong> certains ports. Les liens redondants ne sont pas débranchés : ils sont mis en réserve et <strong>réactivés automatiquement</strong> si un lien actif tombe. On garde la sécurité de la redondance sans le danger des boucles.</p>
<h3>3. Le root bridge : la racine de l'arbre</h3>
<p>Tout arbre a une racine. STP élit un <strong>root bridge</strong> (pont racine) : le commutateur de référence vers lequel tous les chemins convergent. L'élection se fait par le <strong>Bridge ID</strong>, composé d'une <strong>priorité</strong> (configurable) suivie de l'<strong>adresse MAC</strong> du switch. Le plus petit Bridge ID gagne : d'abord la priorité la plus basse, et à priorité égale la MAC la plus basse. Chaque autre switch détermine ensuite son <strong>root port</strong>, le port offrant le meilleur chemin (au moindre coût) vers la racine.</p>
<pre class="pseudo"># Election du root bridge
Bridge ID = [ priorite (configurable) ][ adresse MAC ]
# Le plus PETIT Bridge ID devient root bridge.
# priorite egale -> la plus petite MAC l'emporte.</pre>
<h3>4. Les BPDU : le langage de STP</h3>
<p>Les switchs s'échangent des messages appelés <strong>BPDU</strong> (en anglais <em>Bridge Protocol Data Unit</em>). Ces trames spéciales transportent les informations d'élection et de topologie : qui est root, à quel coût, par quel port. Grâce aux BPDU envoyées régulièrement, STP surveille en continu le réseau et recalcule l'arbre dès qu'un lien change d'état.</p>
<h3>5. Les états d'un port STP</h3>
<p>Avec le STP classique (802.1D), un port ne passe pas brutalement à « actif » : il traverse une série d'états pour éviter de rouvrir une boucle trop vite.</p>
<pre class="pseudo"># Etats d'un port en STP classique (802.1D)
Blocking   : ne transmet pas de donnees, ecoute juste les BPDU (evite la boucle)
Listening  : participe a l'election, ne transmet pas encore de donnees
Learning   : apprend les adresses MAC, ne transmet toujours pas les donnees
Forwarding : etat actif, il transmet les donnees
Disabled   : port desactive administrativement
# La transition prend un certain temps (d'ou la lenteur du STP classique).</pre>
<div class="tip">Ordre à retenir : <strong>Blocking → Listening → Learning → Forwarding</strong>. Un port de secours reste en Blocking ; il passe par Listening puis Learning avant de basculer en Forwarding si nécessaire.</div>
<h3>6. RSTP : la version rapide</h3>
<p>Le STP classique met plusieurs dizaines de secondes à converger après une panne, ce qui est long. Le <strong>RSTP</strong> (en anglais <em>Rapid Spanning Tree Protocol</em>, IEEE 802.1w) accélère fortement cette convergence en réduisant le nombre d'états et en ajoutant des rôles de ports qui basculent presque instantanément. RSTP est aujourd'hui la norme de fait sur les équipements modernes, tout en restant compatible avec l'ancien STP.</p>
<div class="warn">Désactiver STP pour « aller plus vite » est une très mauvaise idée sur un réseau maillé : une seule boucle non maîtrisée peut effondrer tout le réseau en une tempête de broadcast. Garde STP (ou RSTP) actif.</div>
<h3>7. Ce qu'il faut retenir</h3>
<pre class="pseudo"># STP (IEEE 802.1D) : casse les boucles de niveau 2, garde la redondance
# Sans TTL en Ethernet -> boucle = tempete de broadcast
# Root bridge : elu via le Bridge ID (priorite + MAC), plus petit gagne
# BPDU : messages d'election et de topologie entre switchs
# Etats : Blocking -&gt; Listening -&gt; Learning -&gt; Forwarding
# RSTP (802.1w) : convergence rapide, norme moderne</pre>`,
  exercises: [
    { type: "qcm", q: "Quel est le rôle principal de STP ?", opts: ["Chiffrer les trames", "Éviter les boucles de niveau 2 tout en gardant la redondance", "Attribuer des adresses IP", "Router entre AS"], a: 1, exp: "STP casse les boucles de commutation en gardant les liens de secours." },
    { type: "input", q: "Quelle norme IEEE définit le STP classique ?", a: ["802.1d", "ieee 802.1d", "8021d"], ph: "802.1…", exp: "STP classique = IEEE 802.1D." },
    { type: "qcm", q: "Pourquoi une boucle de niveau 2 est-elle si dangereuse ?", opts: ["Les trames Ethernet n'ont pas de TTL, elles tournent sans fin", "Elle coupe le courant", "Elle change les adresses MAC", "Elle chiffre le trafic"], a: 0, exp: "Sans TTL, une trame en boucle se duplique indéfiniment : tempête de broadcast." },
    { type: "input", q: "Comment appelle-t-on la saturation causée par des trames de diffusion qui bouclent ? (deux mots)", a: ["tempete de broadcast", "broadcast storm", "tempête de broadcast"], ph: "deux mots", exp: "C'est la tempête de broadcast (broadcast storm)." },
    { type: "qcm", q: "Comment appelle-t-on le commutateur racine de l'arbre STP ?", opts: ["Root port", "Root bridge", "Root VLAN", "Root AS"], a: 1, exp: "Le root bridge est la racine vers laquelle tout converge." },
    { type: "qcm", q: "De quoi se compose le Bridge ID servant à l'élection ?", opts: ["Priorité + adresse MAC", "Adresse IP seule", "Numéro de VLAN + coût", "TTL + port"], a: 0, exp: "Bridge ID = priorité (configurable) suivie de l'adresse MAC." },
    { type: "vf", q: "C'est le plus PETIT Bridge ID qui devient root bridge.", a: true, exp: "Oui : priorité la plus basse d'abord, puis MAC la plus basse." },
    { type: "input", q: "Comment appelle-t-on les messages échangés par les switchs pour STP ? (sigle)", a: ["bpdu"], ph: "un sigle", exp: "BPDU = Bridge Protocol Data Unit." },
    { type: "qcm", q: "Dans quel état un port STP transmet-il réellement les données ?", opts: ["Blocking", "Listening", "Learning", "Forwarding"], a: 3, exp: "Seul l'état Forwarding transmet les données utilisateur." },
    { type: "qcm", q: "Quel est l'ordre correct des états d'un port STP classique ?", opts: ["Forwarding → Learning → Blocking", "Blocking → Listening → Learning → Forwarding", "Learning → Blocking → Forwarding", "Listening → Forwarding → Blocking"], a: 1, exp: "L'ordre est Blocking, Listening, Learning, Forwarding." },
    { type: "vf", q: "Un port en état Blocking transmet normalement les données des utilisateurs.", a: false, exp: "Non : en Blocking il ne transmet pas de données, il écoute juste les BPDU." },
    { type: "input", q: "Dans quel état un port apprend-il les adresses MAC sans encore transmettre les données ?", a: ["learning", "learning state", "apprentissage"], ph: "un mot anglais", exp: "L'état Learning apprend les MAC sans transmettre les données." },
    { type: "qcm", q: "Que fait STP des liens redondants ?", opts: ["Il les débranche physiquement", "Il les bloque logiquement et les réactive si besoin", "Il les ignore totalement", "Il les fusionne en un seul câble"], a: 1, exp: "Les liens de secours sont bloqués puis réactivés automatiquement en cas de panne." },
    { type: "vf", q: "RSTP (802.1w) converge plus vite que le STP classique.", a: true, exp: "Oui : RSTP réduit le temps de convergence après une panne." },
    { type: "qcm", q: "Comment appelle-t-on, sur un switch non-racine, le port offrant le meilleur chemin vers le root bridge ?", opts: ["Root port", "Trunk port", "Native port", "Access port"], a: 0, exp: "C'est le root port, au coût le plus bas vers la racine." }
  ],
  final: {
    title: "Exercice final — Trois switchs en triangle",
    intro: `<p>SW1, SW2 et SW3 sont câblés en triangle (chacun relié aux deux autres) : une boucle physique existe. On veut la fiabilité de la redondance sans la tempête de broadcast. STP est activé partout. Analysons son fonctionnement.</p>`,
    questions: [
      { type: "qcm", q: "Sans STP, que provoquerait la boucle du triangle ?", opts: ["Rien", "Une tempête de broadcast qui sature le réseau", "Un changement d'adresses IP", "Un chiffrement automatique"], a: 1, exp: "Sans STP, la boucle déclenche une tempête de broadcast." },
      { type: "input", q: "Comment appelle-t-on le switch élu comme racine de l'arbre ?", a: ["root bridge", "le root bridge", "pont racine"], ph: "deux mots", exp: "Le root bridge est élu via le plus petit Bridge ID." },
      { type: "qcm", q: "Si SW1, SW2 et SW3 ont la même priorité, qui devient root bridge ?", opts: ["Celui à la plus grande MAC", "Celui à la plus petite adresse MAC", "Aucun", "Au hasard"], a: 1, exp: "À priorité égale, la plus petite MAC gagne l'élection." },
      { type: "vf", q: "Pour casser la boucle, STP met l'un des ports du triangle en état Blocking.", a: true, exp: "Oui : un port est bloqué logiquement pour rompre la boucle." },
      { type: "qcm", q: "Si le lien actif tombe, que fait le port bloqué ?", opts: ["Il reste bloqué à jamais", "Il passe par Listening puis Learning avant Forwarding", "Il chiffre le trafic", "Il devient root bridge"], a: 1, exp: "Le port de secours transite vers Forwarding pour rétablir la connectivité." }
    ],
    solution: `<pre class="pseudo"># Fonctionnement dans le triangle
1) Election : le switch au plus petit Bridge ID (priorite puis MAC) = root bridge
2) Chaque autre switch choisit son root port (meilleur cout vers la racine)
3) Un port du triangle passe en BLOCKING -> la boucle est cassee
4) Panne d'un lien actif :
   port bloque : Blocking -&gt; Listening -&gt; Learning -&gt; Forwarding
# Redondance conservee, tempete de broadcast evitee. RSTP accelererait l'etape 4.</pre>
<p>STP transforme le triangle bouclé en arbre sans boucle, garde un lien en réserve, et le réactive proprement en cas de panne.</p>`
  }
};
