  title: "Les systèmes autonomes (AS)",
  subtitle: "Les nations d'Internet : numéros, alliances de peering et contrats de transit.",
  theory: `
<h3>1. Qu'est-ce qu'un système autonome ?</h3>
<p>Un <strong>système autonome</strong> (en anglais <em>Autonomous System</em>, AS) est un ensemble de réseaux IP géré par une <strong>même autorité administrative</strong> et appliquant une politique de routage cohérente vers l'extérieur. Un fournisseur d'accès, un grand hébergeur, une université ou une entreprise mondiale possèdent chacun leur AS. Internet, vu de haut, est un maillage de milliers d'AS qui s'échangent des routes via BGP.</p>
<p>Reprends l'image des pays : chaque AS est une nation avec ses frontières, ses règles internes (son IGP, comme OSPF) et sa diplomatie extérieure (BGP). À l'intérieur, il fait ce qu'il veut ; à l'extérieur, il négocie.</p>
<h3>2. Le numéro d'AS (ASN)</h3>
<p>Chaque AS est identifié par un <strong>numéro d'AS</strong> (en anglais <em>AS Number</em>, ASN), attribué par les registres régionaux (RIR comme le RIPE, l'ARIN…). Historiquement le numéro tenait sur <strong>16 bits</strong> (0 à 65535). Face à la pénurie, on est passé aux ASN sur <strong>32 bits</strong>, offrant plus de quatre milliards d'identifiants. Certaines plages sont réservées à un usage <strong>privé</strong> (par exemple 64512 à 65534 en 16 bits), pour un usage interne qui ne sort pas sur Internet.</p>
<pre class="pseudo"># Numeros d'AS
16 bits : 0 .. 65535           (plage historique)
32 bits : jusqu'a ~4,29 milliards (extension moderne)
Prives (16 bits) : 64512 .. 65534   -> usage interne, non routes sur Internet</pre>
<h3>3. Le peering : s'échanger le trafic, souvent gratuitement</h3>
<p>Le <strong>peering</strong> (appairage) est un accord par lequel deux AS s'échangent <strong>directement</strong> leur trafic et celui de leurs clients, généralement <strong>sans se facturer</strong> (on parle de <em>peering settlement-free</em>). L'intérêt est mutuel : chacun gagne un chemin plus court et évite de payer un intermédiaire. Le peering se fait souvent dans un <strong>point d'échange Internet</strong> (en anglais <em>Internet Exchange Point</em>, IXP), un lieu neutre où de nombreux AS se branchent sur un commutateur commun.</p>
<div class="tip">Peering = « on s'échange nos trafics respectifs, sans facture ». C'est un accord entre pairs de taille comparable, pour le bénéfice des deux.</div>
<h3>4. Le transit : payer pour atteindre tout Internet</h3>
<p>Le <strong>transit</strong> est différent : un AS <strong>paie</strong> un opérateur plus grand (un <em>fournisseur de transit</em>) pour atteindre <strong>l'ensemble d'Internet</strong>, pas seulement les clients de ce fournisseur. Le peering ne donne accès qu'aux réseaux du partenaire et de ses clients ; le transit, lui, ouvre la porte de tout le reste. On combine donc souvent les deux : du peering gratuit là où c'est possible, du transit payant pour le reste.</p>
<pre class="pseudo"># Peering vs Transit
Peering  : gratuit (souvent) ; acces au partenaire et a SES clients
Transit  : payant ; acces a TOUT Internet via le fournisseur
# Strategie courante : peering la ou c'est possible + transit pour le reste.</pre>
<h3>5. La hiérarchie des opérateurs</h3>
<p>On classe informellement les opérateurs en <strong>niveaux</strong> (<em>tiers</em>). Un opérateur dit de <strong>Tier 1</strong> peut atteindre tout Internet uniquement par du peering, sans jamais acheter de transit. Les opérateurs de plus petite taille achètent du transit à de plus gros. Cette hiérarchie n'est pas figée : elle évolue avec les accords commerciaux, et un même AS peut être client ici et pair là-bas.</p>
<div class="warn">Ne confonds pas peering et transit : le peering échange les trafics des deux partenaires (souvent gratuit) ; le transit achète l'accès à tout Internet (payant). Les attributs BGP servent ensuite à appliquer ces politiques.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># AS = reseaux geres par une meme autorite, politique commune
# ASN = numero d'AS ; 16 bits (0..65535) puis 32 bits ; plages privees
# Peering = echange direct des trafics, souvent gratuit (IXP)
# Transit = on PAIE pour atteindre TOUT Internet
# BGP applique ces politiques entre AS</pre>`,

    { type: "qcm", q: "Quelle plage (16 bits) est réservée aux ASN privés ?", opts: ["0 à 1023", "64512 à 65534", "10000 à 20000", "40000 à 41000"], a: 1, exp: "La plage 64512 à 65534 est réservée à un usage privé en 16 bits." },
    { type: "vf", q: "Un ASN privé est routé normalement sur l'Internet public.", a: false, exp: "Non : les ASN privés servent à un usage interne, ils ne sortent pas sur Internet." },
    { type: "qcm", q: "Qui attribue les numéros d'AS ?", opts: ["Chaque entreprise elle-même librement", "Les registres régionaux (RIR : RIPE, ARIN…)", "Le fournisseur d'accès du voisin", "Personne, c'est aléatoire"], a: 1, exp: "Les RIR (RIPE, ARIN, etc.) attribuent les ASN." },
    { type: "qcm", q: "Un opérateur dit « Tier 1 »…", opts: ["achète toujours du transit", "atteint tout Internet uniquement par peering, sans acheter de transit", "n'a pas d'AS", "route en OSPF vers l'extérieur"], a: 1, exp: "Un Tier 1 atteint tout Internet par peering, sans transit payant." },
    { type: "input", q: "Comment appelle-t-on l'accord payant pour atteindre tout Internet via un fournisseur ? (un mot)", a: ["transit", "le transit"], ph: "un mot", exp: "C'est le transit (payant)." },
    { type: "vf", q: "À l'intérieur de son AS, un opérateur peut utiliser un IGP comme OSPF.", a: true, exp: "Oui : IGP à l'intérieur, BGP entre AS." },
    { type: "qcm", q: "Combien un ASN sur 16 bits offre-t-il de valeurs possibles au maximum ?", opts: ["256", "1024", "65536 (0 à 65535)", "4 milliards"], a: 2, exp: "16 bits = 65536 valeurs (0 à 65535)." }
  ],
  final: {
    title: "Exercice final — Choisir sa stratégie d'interconnexion",
    intro: `<p>Une entreprise obtient son propre AS 64512. Elle veut être présente sur Internet à coût maîtrisé. Elle envisage à la fois un point d'échange local et un contrat avec un gros opérateur. Aidons-la à structurer ses choix.</p>`,
    questions: [
      { type: "qcm", q: "Pour joindre l'ensemble d'Internet de façon garantie, l'entreprise a besoin de…", opts: ["seulement du peering", "un contrat de transit (payant)", "aucun accord", "un second router-id"], a: 1, exp: "Le peering seul ne couvre pas tout Internet : il faut du transit." },
      { type: "input", q: "Comment appelle-t-on le lieu neutre où elle peut s'appairer avec d'autres AS ? (3 lettres)", a: ["ixp"], ph: "3 lettres", exp: "Un IXP (Internet Exchange Point)." },
      { type: "vf", q: "Le peering au point d'échange peut réduire les coûts en évitant de payer du transit pour le trafic échangé localement.", a: true, exp: "Oui : le peering gratuit décharge une partie du trafic du transit payant." },
      { type: "qcm", q: "Son ASN 64512 se situe dans une plage…", opts: ["publique routable mondialement", "privée (usage interne)", "réservée au multicast", "de niveau 2"], a: 1, exp: "64512 ouvre la plage privée (64512 à 65534) : usage interne, non routé sur Internet." },
      { type: "qcm", q: "Quel protocole appliquera concrètement ces politiques entre AS ?", opts: ["OSPF", "BGP", "STP", "LACP"], a: 1, exp: "BGP est le protocole inter-AS qui applique peering et transit." }
    ],
    solution: `<pre class="pseudo"># Strategie type pour l'AS 64512
1) Transit  : contrat payant avec un gros operateur -> acces a TOUT Internet
2) Peering  : presence sur un IXP -> echange direct (souvent gratuit) avec des AS locaux
3) BGP      : annonce ses prefixes, applique local preference (preferer le peering)
# Resultat : couts reduits (peering) + couverture complete (transit).</pre>
<p>Le peering allège le transit sur le trafic local, le transit garantit la couverture mondiale, et BGP orchestre le tout entre AS.</p>`
  }
};
