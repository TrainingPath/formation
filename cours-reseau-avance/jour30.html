var DAY = {

  title: "Concevoir une architecture réseau complète",
  subtitle: "Assembler tout le parcours en un plan cohérent, redondant et évolutif.",
  theory: `
<h3>1. Concevoir, c'est arbitrer</h3>
<p>Une architecture réseau n'est jamais « la meilleure » dans l'absolu : elle résulte d'arbitrages entre <strong>coût</strong>, <strong>performance</strong>, <strong>disponibilité</strong>, <strong>sécurité</strong> et <strong>simplicité d'exploitation</strong>. Le concepteur part des besoins (nombre d'utilisateurs, sites, applications critiques, budget) et bâtit une structure claire, documentée et évolutive. Un réseau bien conçu se comprend d'un coup d'œil sur un schéma.</p>
<h3>2. Le modèle hiérarchique à trois couches</h3>
<p>Le modèle de référence, popularisé par Cisco, découpe le réseau en trois couches aux rôles distincts. La couche <strong>accès</strong> (access) branche les utilisateurs finaux : postes, téléphones, points d'accès Wi-Fi ; c'est là qu'on applique les VLAN et la sécurité de port. La couche <strong>distribution</strong> agrège les commutateurs d'accès, assure le routage inter-VLAN et applique les politiques (filtrage, QoS). La couche <strong>cœur</strong> (core) transporte le trafic entre les blocs de distribution le plus vite possible, sans fioriture : sa seule mission est la commutation rapide et fiable.</p>
<pre class="pseudo"># Modele hierarchique (haut = coeur, bas = utilisateurs)
        [ COEUR ]            commutation rapide, tres disponible
       /        \\
 [DISTRIB]    [DISTRIB]      routage inter-VLAN, politiques, QoS
   /  \\         /  \\
[ACC][ACC]   [ACC][ACC]     acces utilisateurs : VLAN, ports, Wi-Fi</pre>
<div class="tip">Découper en couches permet de raisonner par blocs, de localiser les pannes et de faire évoluer une partie sans tout casser. On parle aussi de conception « en blocs » (building blocks) répétables.</div>
<h3>3. La redondance : pas de point unique de panne</h3>
<p>La règle d'or de la disponibilité : éliminer tout <strong>point unique de défaillance</strong> (SPOF, Single Point Of Failure). On double les équipements critiques, les liens et les alimentations. Plusieurs mécanismes vus dans le parcours entrent en jeu : <strong>STP/RSTP</strong> évite les boucles quand on met des liens redondants entre commutateurs ; l'<strong>agrégation de liens</strong> (LACP) combine plusieurs câbles en un lien logique plus large et résilient ; un protocole de <strong>passerelle redondante</strong> (VRRP/HSRP) fait qu'une IP de passerelle unique est portée par deux routeurs, l'un prenant le relais si l'autre tombe.</p>
<pre class="pseudo"># Redondance de passerelle (VRRP/HSRP)
IP virtuelle passerelle : 192.168.10.1
  Routeur A (actif)   -- porte 192.168.10.1
  Routeur B (secours) -- prend le relais si A tombe
# Les postes gardent la meme passerelle : bascule transparente.</pre>
<h3>4. Adressage, segmentation et services</h3>
<p>Un bon plan d'adressage IP est <strong>hiérarchique et résumable</strong> : on réserve des plages par site et par fonction pour faciliter le routage (agrégation de routes) et la lecture. La <strong>segmentation</strong> par VLAN et sous-réseaux isole les usages (utilisateurs, serveurs, voix, invités, administration) et sert de première barrière de sécurité. On place les <strong>services</strong> — DHCP, DNS, NTP — de façon redondante, et on protège le tout par des <strong>pare-feu</strong> entre zones de confiance différentes.</p>
<div class="warn">Attention à la sur-conception : trop de couches ou de VLAN pour un petit site alourdit l'exploitation sans bénéfice. Adapte la complexité à la taille réelle et aux besoins.</div>
<h3>5. Bonnes pratiques et documentation</h3>
<p>Quelques réflexes de concepteur : appliquer le <strong>moindre privilège</strong> (n'ouvrir que le nécessaire), prévoir la <strong>croissance</strong> (adresses et ports en réserve), standardiser les configurations (IaC, modèles), et surtout <strong>documenter</strong> : schéma physique, schéma logique, plan d'adressage, plan de VLAN. Une architecture non documentée devient ingérable dès le premier incident.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Modele hierarchique : ACCES (utilisateurs) / DISTRIBUTION (routage, politiques) / COEUR (commutation rapide)
# Redondance : pas de SPOF -> doubler equipements, liens, alims
#   STP/RSTP (boucles) | LACP (agregation) | VRRP/HSRP (passerelle redondante)
# Adressage hierarchique et resumable ; segmentation par VLAN/sous-reseaux
# Services redondants (DHCP/DNS/NTP), pare-feu entre zones
# Moindre privilege, marge de croissance, standardisation, DOCUMENTATION</pre>`,
  exercises: [
    { type: "qcm", q: "Quelles sont les trois couches du modèle hiérarchique classique ?", opts: ["Physique, liaison, réseau", "Accès, distribution, cœur", "Public, privé, DMZ", "Web, app, données"], a: 1, exp: "Le modèle hiérarchique = accès, distribution, cœur." },

    { type: "vf", q: "Un plan d'adressage hiérarchique et résumable facilite le routage et la lecture.", a: true, exp: "Oui : réserver des plages par site/fonction permet l'agrégation de routes." },
    { type: "qcm", q: "Le routage inter-VLAN et les politiques (filtrage, QoS) se placent surtout à la couche…", opts: ["accès", "distribution", "cœur", "Internet"], a: 1, exp: "La distribution agrège l'accès, route entre VLAN et applique les politiques." },
    { type: "input", q: "Quel principe de sécurité consiste à n'ouvrir que le strict nécessaire ? (deux mots)", a: ["moindre privilège", "moindre privilege", "least privilege", "principe de moindre privilège"], ph: "deux mots", exp: "Le moindre privilège : n'accorder que les accès réellement nécessaires." },
    { type: "vf", q: "Ajouter un maximum de couches et de VLAN est toujours bénéfique, même sur un petit site.", a: false, exp: "Non : la sur-conception alourdit l'exploitation sans bénéfice réel." },
    { type: "qcm", q: "Pourquoi documenter schémas et plans d'adressage ?", opts: ["Pour ralentir le réseau", "Pour rendre le réseau gérable, surtout lors d'un incident", "Pour consommer plus d'IP", "Ce n'est pas nécessaire"], a: 1, exp: "Sans documentation, un réseau devient ingérable dès le premier incident." },
    { type: "qcm", q: "Éliminer les SPOF passe notamment par…", opts: ["un seul gros routeur", "le doublement des équipements, liens et alimentations", "la suppression des sauvegardes", "l'usage d'une seule alimentation"], a: 1, exp: "La redondance (doubler les éléments critiques) élimine les points uniques." },
    { type: "input", q: "Nomme un service réseau qu'on déploie de façon redondante dans une bonne conception (un mot, ex : résolution de noms).", a: ["dns", "dhcp", "ntp"], ph: "un service", exp: "DNS, DHCP et NTP se déploient de façon redondante." },
    { type: "vf", q: "La segmentation par VLAN et sous-réseaux constitue une première barrière de sécurité.", a: true, exp: "Oui : isoler les usages limite la portée d'une compromission." }
  ],
  final: {

    questions: [

      { type: "input", q: "Pour que la passerelle des postes survive à la panne d'un routeur, quel protocole utiliser ? (un sigle)", a: ["vrrp", "hsrp", "vrrp/hsrp", "vrrp ou hsrp"], ph: "un sigle", exp: "VRRP (ou HSRP) fournit une passerelle redondante." },

    ],
    solution: `<pre class="pseudo"># Architecture du batiment (synthese) :
# COEUR       : 2 commutateurs cœur redondants (LACP entre eux)
# DISTRIBUTION: 2 commutateurs, routage inter-VLAN, VRRP pour la passerelle
# ACCES       : commutateurs par etage, PoE pour tel. IP et bornes Wi-Fi

# Redondance  : liens doubles (STP/RSTP), 2 alims, pas de SPOF
# Documentation: schemas physique + logique, plan IP, plan VLAN</pre>
<p>Concevoir, c'est assembler avec méthode tout le parcours : hiérarchie claire, redondance sans SPOF, segmentation, services fiables et documentation.</p>`
