<script>
var DAY = {
  num: 9,
  title: "OSPF en pratique",
  subtitle: "Faire dialoguer les routeurs d'un même domaine avec un plan d'aires soigné.",
  theory: `
<h3>1. OSPF, le cartographe du réseau interne</h3>
<p>OSPF (en anglais <em>Open Shortest Path First</em>) est un protocole de routage <strong>à état de liens</strong> (<em>link-state</em>). Contrairement à un protocole à vecteur de distance qui se contente de répéter « je connais telle route à tel coût », OSPF fait mieux : chaque routeur dessine une <strong>carte complète</strong> de la topologie, puis calcule tout seul le plus court chemin avec l'algorithme de Dijkstra. On dit qu'OSPF est un IGP, un <strong>Interior Gateway Protocol</strong> : il route <em>à l'intérieur</em> d'un même système autonome, pas entre organisations.</p>
<p>Imagine une ville où chaque carrefour possède le plan intégral des rues, avec la longueur de chacune. N'importe quel carrefour peut alors calculer l'itinéraire optimal vers n'importe quelle adresse, sans demander l'avis des voisins. C'est exactement l'idée d'OSPF.</p>
<h3>2. Le router-id : la carte d'identité</h3>
<p>Chaque routeur OSPF possède un <strong>router-id</strong>, un identifiant unique de 32 bits qui a la forme d'une adresse IP (par exemple 1.1.1.1). Ce n'est pas forcément une vraie adresse routable : c'est une étiquette. Si tu ne le fixes pas, le routeur choisit automatiquement l'adresse la plus haute d'une interface de bouclage (<em>loopback</em>), sinon d'une interface physique. La bonne pratique est de le <strong>fixer explicitement</strong> pour que l'identité soit stable et prévisible.</p>
<h3>3. Les aires : découper pour respirer</h3>
<p>Sur un grand réseau, faire calculer à chaque routeur la carte de TOUT devient lourd. OSPF découpe donc le domaine en <strong>aires</strong> (<em>areas</em>), numérotées. L'aire centrale obligatoire est l'<strong>aire 0</strong>, aussi appelée <em>backbone</em> (dorsale) : toutes les autres aires doivent s'y raccorder. Un changement dans une aire ne force pas le recalcul dans les autres : on limite le bruit et on gagne en stabilité.</p>
<pre class="pseudo"># Vue d'ensemble d'un plan d'aires
        Aire 1  ---\
        Aire 2  ----+---  Aire 0 (backbone)  ---- Aire 3
        Aire 4  ---/
# Toute aire non-backbone se raccorde a l'aire 0.</pre>
<h3>4. Le coût : choisir le meilleur chemin</h3>
<p>OSPF classe les chemins par <strong>coût</strong> (<em>cost</em>) : plus le coût total d'un chemin est bas, plus il est préféré. Le coût d'une interface est traditionnellement calculé par une bande passante de référence divisée par la bande passante du lien. Un lien rapide a donc un coût faible, un lien lent un coût élevé. Le coût d'un itinéraire est la somme des coûts des liens traversés.</p>
<div class="tip">Retiens la logique : coût bas = lien rapide = chemin préféré. Tu peux forcer le coût d'une interface à la main quand tu veux orienter le trafic sans changer les câbles.</div>
<h3>5. Les adjacences : se reconnaître entre voisins</h3>
<p>Avant d'échanger la carte, deux routeurs OSPF voisins doivent devenir <strong>adjacents</strong>. Ils s'envoient d'abord des paquets <strong>Hello</strong> pour se découvrir et vérifier qu'ils sont compatibles (même aire, mêmes minuteurs Hello/Dead, même masque). L'état de la relation passe par plusieurs étapes : Down, Init, Two-Way, ExStart, Exchange, Loading, puis <strong>Full</strong> — l'état sain où les deux routeurs ont synchronisé leur base de données de topologie.</p>
<pre class="pseudo"># Etats d'une adjacence OSPF (dans l'ordre)
Down -&gt; Init -&gt; Two-Way -&gt; ExStart -&gt; Exchange -&gt; Loading -&gt; Full
# "Full" = base de topologie synchronisee : tout va bien.</pre>
<h3>6. Une configuration type (Cisco simplifiée)</h3>
<pre class="pseudo"># Sur un routeur Cisco (mode config)
router ospf 1                 # 1 = identifiant local du processus
 router-id 1.1.1.1            # on fixe l'identite
 network 10.0.0.0 0.0.0.255 area 0   # interfaces de ce reseau dans l'aire 0
 network 10.0.1.0 0.0.0.255 area 1   # celles-ci dans l'aire 1
# Verifier ensuite :
show ip ospf neighbor         # voisins et etat (on veut FULL)
show ip route ospf            # routes apprises par OSPF</pre>
<div class="warn">Le masque après network est un <strong>masque générique</strong> (wildcard), l'inverse du masque réseau : 0.0.0.255 vise le dernier octet. Une erreur ici et l'interface n'est pas annoncée : pas de voisin, pas de route.</div>
<h3>7. Ce qu'il faut retenir</h3>
<pre class="pseudo"># OSPF = protocole a etat de liens (link-state), IGP, Dijkstra
# router-id  : identite 32 bits (forme d'IP), a fixer
# aires      : decoupent le domaine ; aire 0 = backbone obligatoire
# cout       : bas = rapide = prefere ; itineraire = somme des couts
# adjacence  : Hello -&gt; ... -&gt; Full (bases synchronisees)</pre>`,

    { type: "vf", q: "OSPF est un IGP : il route à l'intérieur d'un même système autonome.", a: true, exp: "Oui, c'est un Interior Gateway Protocol, par opposition à BGP qui route entre AS." },

    { type: "qcm", q: "À quoi sert le router-id ?", opts: ["À chiffrer le trafic", "À identifier de façon unique le routeur (32 bits, forme d'IP)", "À définir la bande passante", "À compter les paquets"], a: 1, exp: "Le router-id est l'identifiant 32 bits du routeur dans le domaine OSPF." },
    { type: "vf", q: "Un coût OSPF élevé désigne le chemin préféré.", a: false, exp: "Non : c'est le coût le plus BAS qui est préféré (lien rapide)." },
    { type: "input", q: "Quel algorithme OSPF utilise-t-il pour calculer le plus court chemin ?", a: ["dijkstra", "algorithme de dijkstra", "spf"], ph: "un nom", exp: "OSPF applique l'algorithme de Dijkstra (Shortest Path First)." },
    { type: "qcm", q: "Quel type de paquet OSPF sert à découvrir et maintenir les voisins ?", opts: ["Hello", "Ping", "Trace", "Reset"], a: 0, exp: "Les paquets Hello découvrent les voisins et maintiennent l'adjacence." },
    { type: "qcm", q: "Quel état d'adjacence indique que deux routeurs ont synchronisé leur base de topologie ?", opts: ["Init", "Two-Way", "Full", "Down"], a: 2, exp: "L'état Full signifie que les bases de données de topologie sont synchronisées." },
    { type: "vf", q: "Le coût total d'un itinéraire OSPF est la somme des coûts des liens traversés.", a: true, exp: "Oui : on additionne les coûts des interfaces le long du chemin." },
    { type: "qcm", q: "Comment un lien rapide se traduit-il en coût OSPF ?", opts: ["Un coût élevé", "Un coût faible", "Un coût nul toujours", "Aucun coût"], a: 1, exp: "Un lien à forte bande passante donne un coût faible, donc préféré." },
    { type: "input", q: "Dans une config Cisco, quelle commande liste les voisins OSPF et leur état ? (réponds par la commande)", a: ["show ip ospf neighbor", "show ip ospf neighbors"], ph: "show ip ...", exp: "show ip ospf neighbor affiche les voisins et l'état (on veut Full)." },
    { type: "qcm", q: "Après network dans la config OSPF Cisco, on écrit un masque…", opts: ["réseau classique", "générique (wildcard), inverse du masque réseau", "de sous-réseau /24 forcé", "hexadécimal"], a: 1, exp: "On utilise un masque générique (wildcard), l'inverse du masque réseau." },
    { type: "vf", q: "Un changement dans une aire non-backbone force le recalcul complet dans toutes les autres aires.", a: false, exp: "Non : le découpage en aires limite justement la propagation du bruit." },
    { type: "qcm", q: "Toutes les aires OSPF non-backbone doivent se raccorder à…", opts: ["l'aire 1", "l'aire 0 (backbone)", "n'importe quelle aire", "aucune aire"], a: 1, exp: "Le plan d'aires impose un raccordement à l'aire 0." }
  ],
  final: {
    title: "Exercice final — Câbler un petit domaine OSPF",
    intro: `<p>Trois routeurs R1, R2, R3 doivent former un domaine OSPF. R1 et R2 sont dans l'aire 0, R3 dans l'aire 1, raccordé à R2. Après configuration, R1 voit ses voisins mais l'une des routes n'apparaît pas. Aidons l'administrateur.</p>`,
    questions: [
      { type: "input", q: "Quel router-id de la forme X.X.X.X est le plus courant pour R1 (par convention avec des 1) ?", a: ["1.1.1.1"], ph: "X.X.X.X", exp: "Par convention on fixe souvent router-id 1.1.1.1 pour R1." },
      { type: "qcm", q: "R3 est dans l'aire 1. Pour communiquer avec l'aire 0, il doit passer par…", opts: ["R1 directement", "R2, qui touche les deux aires", "aucun routeur", "une aire 2"], a: 1, exp: "R2 relie l'aire 0 et l'aire 1 : c'est le point de raccordement." },
      { type: "qcm", q: "Sur R1, quel état veut-on voir pour le voisin R2 ?", opts: ["Init", "Two-Way", "Full", "Down"], a: 2, exp: "Full = adjacence saine, bases synchronisées." },
      { type: "vf", q: "Un masque générique erroné dans la commande network peut empêcher une interface d'être annoncée, donc une route de manquer.", a: true, exp: "Exactement le symptôme décrit : wildcard mal posé, interface non annoncée." },
      { type: "input", q: "Quelle commande vérifie les routes apprises par OSPF sur R1 ?", a: ["show ip route ospf"], ph: "show ip ...", exp: "show ip route ospf liste les routes issues d'OSPF." }
    ],
    solution: `<pre class="pseudo"># Sur R2 (le routeur charniere entre aire 0 et aire 1)
router ospf 1
 router-id 2.2.2.2
 network 10.0.0.0 0.0.0.255 area 0    # cote R1
 network 10.0.1.0 0.0.0.255 area 1    # cote R3
# Verifs
show ip ospf neighbor   # R1 et R3 doivent etre en FULL
show ip route ospf      # les reseaux des deux aires apparaissent</pre>
<p>La route manquante venait d'un masque générique mal posé sur une commande network : l'interface n'était pas annoncée. Corrigé, l'adjacence passe en Full et la route apparaît.</p>`
  }
};
