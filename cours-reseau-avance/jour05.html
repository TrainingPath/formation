var DAY = {

  title: "Cohabiter IPv4 / IPv6",
  subtitle: "Deux mondes qui se croisent : les techniques pour vivre pendant la transition.",
  theory: `
<h3>1. Le problème : deux protocoles incompatibles</h3>
<p>IPv4 et IPv6 ne se parlent <strong>pas directement</strong> : une machine qui n'a qu'IPv6 ne peut pas dialoguer avec une machine qui n'a qu'IPv4, comme deux personnes parlant des langues différentes sans traducteur. Or on ne peut pas éteindre IPv4 d'un coup : des millions de sites, d'équipements et de fournisseurs l'utilisent encore. Il faut donc une <strong>période de transition</strong>, potentiellement longue, pendant laquelle les deux coexistent. Trois grandes familles de techniques répondent à ce besoin : la <strong>double pile</strong>, les <strong>tunnels</strong> et la <strong>translation</strong>.</p>
<h3>2. La double pile (dual stack)</h3>
<p>La méthode la plus simple et la plus recommandée : la <strong>double pile</strong> (<em>dual stack</em>). La machine (ou le routeur) implémente <strong>les deux protocoles en parallèle</strong> et reçoit à la fois une adresse IPv4 et une adresse IPv6. Elle est bilingue : elle parle IPv4 avec les interlocuteurs IPv4 et IPv6 avec les interlocuteurs IPv6. Le choix se fait souvent via le DNS (si un nom possède une adresse IPv6, on l'utilise, sinon on retombe sur IPv4).</p>
<pre class="pseudo"># Double pile : la machine a DEUX adresses
Interface eth0 :
   IPv4 -> 192.0.2.10
   IPv6 -> 2001:db8::10
# Elle dialogue en v4 avec le monde v4, en v6 avec le monde v6.</pre>
<div class="tip">La double pile est la stratégie de transition préférée : pas d'encapsulation, pas de traduction, chaque protocole emprunte son chemin natif. Son seul « coût » : il faut gérer et sécuriser deux plans d'adressage en même temps.</div>
<h3>3. Les tunnels (ex. 6in4)</h3>
<p>Problème fréquent : deux îlots IPv6 séparés par un réseau qui ne connaît qu'IPv4 (par exemple l'Internet d'un vieux fournisseur). Solution : le <strong>tunnel</strong>. On <strong>encapsule</strong> le paquet IPv6 <em>à l'intérieur</em> d'un paquet IPv4, on le fait voyager à travers le réseau IPv4, puis on le <strong>désencapsule</strong> à l'autre bout. C'est comme mettre une lettre écrite en IPv6 dans une enveloppe IPv4 pour qu'elle passe par la poste IPv4. La technique la plus connue s'appelle <strong>6in4</strong> (IPv6 dans IPv4).</p>
<pre class="pseudo"># Tunnel 6in4 : IPv6 encapsule dans IPv4
[ En-tete IPv4 | En-tete IPv6 | Donnees ]
       (enveloppe)   (lettre d'origine)
#
Ilot IPv6  --encapsulation-->  reseau IPv4  --desencapsulation-->  Ilot IPv6</pre>
<div class="warn">Un tunnel ne « traduit » rien : il transporte de l'IPv6 caché dans de l'IPv4. Les deux extrémités doivent comprendre l'IPv6. Ne confonds pas encapsulation (tunnel) et traduction (translation), qui répondent à des situations différentes.</div>
<h3>4. La translation (traduction)</h3>
<p>Parfois, il faut qu'une machine <strong>uniquement IPv6</strong> parle à une machine <strong>uniquement IPv4</strong> — là, ni la double pile (elles ne sont pas bilingues) ni le tunnel (les deux bouts ne parlent pas le même protocole) ne conviennent. Il faut un <strong>traducteur</strong> : la <strong>translation</strong>. Un équipement intermédiaire réécrit les paquets d'un protocole vers l'autre, comme un interprète entre deux langues. La technique de référence s'appelle <strong>NAT64</strong> (souvent couplée à <strong>DNS64</strong>) : elle permet à des clients IPv6-seuls d'atteindre des serveurs IPv4-seuls.</p>
<h3>5. Quelle technique dans quel cas ?</h3>
<p>Résumons la logique de choix. Les deux bouts peuvent-ils être bilingues ? Alors <strong>double pile</strong>. Les deux bouts parlent IPv6 mais un réseau intermédiaire est en IPv4 ? Alors <strong>tunnel</strong>. Un bout ne parle qu'IPv6 et l'autre qu'IPv4 ? Alors <strong>translation</strong>. Ces trois outils se combinent souvent dans un vrai réseau en transition.</p>
<pre class="pseudo"># Aide au choix
Deux bouts bilingues ...................... DOUBLE PILE (dual stack)
Deux bouts IPv6, reseau du milieu IPv4 .... TUNNEL (6in4 : IPv6 dans IPv4)
Un bout IPv6-seul <-> un bout IPv4-seul .... TRANSLATION (NAT64)</pre>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># IPv4 et IPv6 ne se parlent PAS directement -> periode de transition.
# 3 familles :
#   DOUBLE PILE : machine bilingue, deux adresses (recommande)
#   TUNNEL      : encapsuler IPv6 dans IPv4 (6in4) pour traverser du v4
#   TRANSLATION : traduire v6 <-> v4 (NAT64) entre bouts non compatibles
# Encapsuler (tunnel) != traduire (translation).</pre>`,
  exercises: [
    { type: "vf", q: "Une machine qui ne parle qu'IPv6 peut dialoguer directement avec une machine qui ne parle qu'IPv4.", a: false, exp: "Non : les deux protocoles ne sont pas compatibles directement, d'où les techniques de transition." },

    { type: "qcm", q: "Pourquoi la double pile est-elle la méthode recommandée ?", opts: ["Elle est gratuite", "Chaque protocole emprunte son chemin natif, sans encapsulation ni traduction", "Elle supprime IPv4", "Elle chiffre tout"], a: 1, exp: "Pas d'encapsulation ni de traduction : chaque protocole circule nativement." },

    { type: "input", q: "Comment nomme-t-on l'action de mettre un paquet IPv6 à l'intérieur d'un paquet IPv4 ?", a: ["encapsulation", "encapsuler", "l'encapsulation"], ph: "un mot", exp: "L'encapsulation : le paquet IPv6 devient la charge utile d'un paquet IPv4." },
    { type: "qcm", q: "Dans quel cas typique utilise-t-on un tunnel ?", opts: ["Deux îlots IPv6 séparés par un réseau qui ne connaît qu'IPv4", "Une seule machine isolée", "Un serveur DNS surchargé", "Un câble défectueux"], a: 0, exp: "Le tunnel relie deux îlots IPv6 à travers un réseau intermédiaire IPv4." },
    { type: "vf", q: "Un tunnel traduit l'IPv6 en IPv4 (change le protocole des données).", a: false, exp: "Non : un tunnel encapsule (transporte), il ne traduit pas. Les deux bouts parlent IPv6." },
    { type: "qcm", q: "La technique qui traduit un protocole vers l'autre pour relier un bout IPv6-seul et un bout IPv4-seul est…", opts: ["Le tunnel", "La double pile", "La translation (NAT64)", "Le DHCP"], a: 2, exp: "La translation (NAT64) réécrit les paquets d'un protocole vers l'autre." },
    { type: "input", q: "Quel nom porte la technique de translation de référence entre IPv6 et IPv4 ?", a: ["nat64", "nat 64"], ph: "un nom", exp: "NAT64 (souvent avec DNS64) traduit entre IPv6 et IPv4." },
    { type: "vf", q: "Encapsulation (tunnel) et translation (traduction) sont deux mécanismes différents.", a: true, exp: "Oui : le tunnel transporte sans changer le protocole ; la translation réécrit d'un protocole à l'autre." },
    { type: "qcm", q: "Deux extrémités peuvent être bilingues (v4 et v6). Quelle technique choisir ?", opts: ["Tunnel", "Double pile", "Translation", "Aucune"], a: 1, exp: "Si les deux bouts sont bilingues, la double pile est le choix naturel." },
    { type: "qcm", q: "Souvent couplée à NAT64 pour aiguiller les requêtes de noms, on trouve…", opts: ["DNS64", "DHCP6", "ARP4", "RA64"], a: 0, exp: "DNS64 accompagne NAT64 pour permettre aux clients IPv6-seuls d'atteindre des services IPv4." },
    { type: "vf", q: "On peut éteindre IPv4 instantanément partout dès qu'IPv6 existe.", a: false, exp: "Non : la transition est longue ; IPv4 reste massivement utilisé, d'où la cohabitation." },
    { type: "qcm", q: "Dans un paquet 6in4, quel en-tête est à l'extérieur (l'enveloppe) ?", opts: ["L'en-tête IPv6", "L'en-tête IPv4", "L'en-tête TCP", "Aucun en-tête"], a: 1, exp: "L'IPv4 est l'enveloppe extérieure ; l'IPv6 est encapsulé à l'intérieur." }
  ],
  final: {
    title: "Exercice final — Un réseau en transition",
    intro: `<p>L'entreprise de Léna migre vers IPv6. Trois situations se présentent le même jour. Pour chacune, Léna doit choisir la bonne technique de cohabitation parmi double pile, tunnel et translation.</p>`,
    questions: [
      { type: "qcm", q: "Situation A : les postes du siège reçoivent chacun une adresse IPv4 et une IPv6. C'est…", opts: ["Un tunnel", "La double pile", "La translation", "Du broadcast"], a: 1, exp: "Deux adresses en parallèle sur la même machine = double pile." },
      { type: "qcm", q: "Situation B : deux sites 100% IPv6 doivent communiquer, mais le lien loué entre eux ne transporte que de l'IPv4. Léna met en place…", opts: ["Une double pile", "Un tunnel 6in4", "Une translation NAT64", "Un serveur DHCP"], a: 1, exp: "Deux îlots IPv6 via un réseau IPv4 : on encapsule avec un tunnel 6in4." },
      { type: "input", q: "Situation C : un client interne qui n'a QUE de l'IPv6 doit joindre un vieux serveur qui n'a QUE de l'IPv4. Quelle famille de technique (un mot) ?", a: ["translation", "la translation", "traduction", "nat64"], ph: "un mot", exp: "Bouts incompatibles v6-seul / v4-seul : il faut une translation (NAT64)." },
      { type: "vf", q: "Dans la situation B, les deux extrémités doivent comprendre l'IPv6 pour désencapsuler le paquet.", a: true, exp: "Oui : un tunnel transporte de l'IPv6 ; les deux bouts sont bien IPv6." },
      { type: "qcm", q: "Léna retient la règle générale : la méthode de transition la plus simple et recommandée quand c'est possible est…", opts: ["Le tunnel", "La translation", "La double pile", "Le NAT44"], a: 2, exp: "La double pile est préférée car native, sans encapsulation ni traduction." }
    ],
    solution: `<pre class="pseudo"># Les choix de Lena :
A) Poste avec IPv4 + IPv6 ............... DOUBLE PILE
B) 2 sites IPv6 via un lien IPv4 ........ TUNNEL 6in4 (encapsulation)
C) Client IPv6-seul -> serveur IPv4-seul . TRANSLATION (NAT64)
#
# Regle : bilingue -> double pile ; meme protocole aux 2 bouts mais
# reseau du milieu different -> tunnel ; bouts incompatibles -> translation.</pre>
<p>Léna sait aiguiller chaque cas. À partir de demain, on change de sujet : le routage dynamique.</p>`
  }
