  title: "MPLS et réseaux opérateurs (aperçu)",

  theory: `
<h3>1. Le problème que résout MPLS</h3>
<p>Dans un réseau IP classique, chaque routeur, à chaque saut, examine l'adresse IP de destination et consulte sa table de routage pour décider où envoyer le paquet. Sur les gros réseaux d'opérateurs, cette opération répétée est coûteuse. <strong>MPLS</strong> (« Multiprotocol Label Switching ») propose une autre idée : décider du chemin une seule fois à l'entrée, apposer une <strong>étiquette</strong> (label) sur le paquet, puis, aux sauts suivants, se contenter de lire cette étiquette pour commuter rapidement, sans réanalyser l'adresse IP.</p>
<h3>2. La commutation d'étiquettes</h3>
<p>MPLS insère une petite étiquette entre l'en-tête de niveau 2 (Ethernet) et l'en-tête IP. Chaque routeur du cœur, appelé <strong>LSR</strong> (« Label Switching Router »), lit l'étiquette entrante, la remplace par une nouvelle et transmet le paquet : c'est la <strong>commutation d'étiquettes</strong> (« label switching »). Le chemin suivi de bout en bout s'appelle un <strong>LSP</strong> (« Label Switched Path »). Les routeurs de bordure, les <strong>LER</strong>, ajoutent l'étiquette à l'entrée et la retirent à la sortie.</p>
<pre class="pseudo"># Commutation d'etiquettes le long d'un LSP
Entree (LER) : ajoute l'etiquette 17   -> paquet [17][IP]
Coeur (LSR)  : 17 -> 24                 -> paquet [24][IP]
Coeur (LSR)  : 24 -> 31                 -> paquet [31][IP]
Sortie (LER) : retire l'etiquette       -> paquet [IP] pur
# Au coeur, on ne regarde QUE l'etiquette, jamais l'adresse IP.</pre>
<div class="tip">L'etiquette se place entre la couche 2 et la couche 3 : on parle parfois de "couche 2,5". MPLS est independant du protocole transporte (d'ou "Multiprotocol").</div>
<h3>3. À quoi ça sert vraiment</h3>
<p>Au-delà de la vitesse, l'intérêt majeur de MPLS est le <strong>contrôle des chemins</strong>. On peut forcer un flux à emprunter un itinéraire précis (ingénierie de trafic, « traffic engineering »), réserver de la bande passante, ou basculer très vite sur un chemin de secours en cas de panne. C'est pourquoi MPLS est omniprésent dans les <strong>réseaux d'opérateurs</strong> (backbones), là où fiabilité et maîtrise des flux sont essentielles.</p>
<h3>4. Les VPN opérateur (MPLS L3VPN)</h3>
<p>L'usage le plus connu de MPLS est le <strong>VPN opérateur</strong>. Une entreprise avec plusieurs sites (siège, agences) souscrit un service auprès d'un opérateur : ses sites sont reliés comme s'ils formaient un réseau privé unique, alors qu'ils traversent en réalité le réseau partagé de l'opérateur. Les étiquettes MPLS isolent chaque client des autres : deux entreprises peuvent même utiliser les mêmes adresses IP privées sans se gêner, car chaque VPN est cloisonné.</p>
<pre class="pseudo"># VPN operateur MPLS (relier les sites d'une entreprise)
Site A (siege) --\                          /-- Site B (agence)
                  [ Reseau MPLS operateur ]
Site C (agence) --/                          \-- Site D (agence)
# Vu de l'entreprise : un seul reseau prive.
# Vu de l'operateur : un flux etiquete, isole des autres clients.</pre>
<div class="warn">Un VPN operateur MPLS n'est pas forcement chiffre : l'isolation est logique (etiquettes + tables separees), pas cryptographique. Pour la confidentialite de bout en bout, on ajoute au besoin un chiffrement (IPsec) par-dessus.</div>
<h3>5. MPLS face aux alternatives</h3>
<p>MPLS reste très utilisé mais coûte cher. Des approches plus récentes comme le <strong>SD-WAN</strong> permettent de relier des sites via de l'Internet ordinaire tout en gardant une gestion centralisée, parfois en complément ou en remplacement de MPLS. Retiens surtout le principe fondateur de MPLS : <strong>commuter des étiquettes</strong> au lieu de router à chaque saut, pour la performance et le contrôle des chemins.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># MPLS = Multiprotocol Label Switching

# Usage phare : VPN operateur (relier les sites d'une entreprise, isoles)
# Isolation logique (pas de chiffrement par defaut) -> IPsec si besoin</pre>`,

    { type: "vf", q: "L'idée de MPLS est de décider le chemin une seule fois, à l'entrée du réseau.", a: true, exp: "Oui : décision à l'entrée (étiquetage), puis simple commutation au cœur." }

    solution: `<pre class="pseudo"># Solution : VPN operateur MPLS (L3VPN)
Siege + 3 agences  ->  raccordes au reseau MPLS de l'operateur

# Au coeur (LSR)   : commutation d'etiquettes, chemins maitrises (LSP)

<p>L'entreprise souscrit un VPN opérateur MPLS : ses quatre sites forment logiquement un réseau privé unique, alors qu'ils traversent le réseau partagé de l'opérateur. Les étiquettes assurent l'isolation et permettent des chemins maîtrisés avec bascule rapide en cas de panne. Comme MPLS n'est pas chiffré par défaut, on ajoute IPsec pour la confidentialité de bout en bout.</p>`
