<script>
var DAY = {
  num: 3,
  title: "L'adressage IPv6 : notation et types",
  subtitle: "Apprendre à lire, écrire et raccourcir ces longues adresses hexadécimales.",
  theory: `
<h3>1. Huit groupes hexadécimaux</h3>
<p>Une adresse IPv6 fait 128 bits. Pour la rendre lisible, on ne l'écrit pas en binaire ni en décimal, mais en <strong>hexadécimal</strong> (base 16, chiffres de 0 à 9 puis lettres a à f). On découpe les 128 bits en <strong>huit groupes de 16 bits</strong>, séparés par des deux-points. Chaque groupe s'écrit avec quatre chiffres hexadécimaux. Exemple complet :</p>
<pre class="pseudo"># Une adresse IPv6 complete (8 groupes de 16 bits)
2001:0db8:0000:0000:0000:ff00:0042:8329
#     |     |    |    |    |   |    |    |
#     8 groupes hexadecimaux = 8 x 16 bits = 128 bits</pre>
<p>Rappel : l'hexadécimal est pratique car un chiffre hexa représente exactement 4 bits, donc quatre chiffres représentent 16 bits — un groupe entier. C'est bien plus court que 16 chiffres binaires.</p>
<h3>2. Deux règles pour raccourcir</h3>
<p>Ces adresses sont longues : deux règles officielles les abrègent. <strong>Règle 1 : supprimer les zéros de tête</strong> de chaque groupe. <code>0db8</code> devient <code>db8</code>, <code>0000</code> devient <code>0</code>, <code>0042</code> devient <code>42</code>. <strong>Règle 2 : le double deux-points</strong> <code>::</code> remplace UNE SEULE suite de groupes entièrement nuls consécutifs. On ne peut l'utiliser <strong>qu'une fois</strong> par adresse, sinon on ne saurait plus combien de groupes de zéros il représente.</p>
<pre class="pseudo"># Meme adresse, compactee etape par etape
2001:0db8:0000:0000:0000:ff00:0042:8329   # complete
2001:db8:0:0:0:ff00:42:8329               # regle 1 : zeros de tete
2001:db8::ff00:42:8329                     # regle 2 : les trois groupes 0 -> ::
#
# L'adresse de bouclage (localhost) : 0:0:0:0:0:0:0:1 -> ::1
# L'adresse "indefinie" (tout a zero) : 0:0:0:0:0:0:0:0 -> ::</pre>
<div class="warn">Le <code>::</code> ne s'emploie qu'UNE fois. Dans <code>2001:0:0:1:0:0:0:5</code>, on compacte la plus longue suite de zéros : <code>2001:0:0:1::5</code> — pas les deux à la fois, sinon l'adresse serait ambiguë.</div>
<h3>3. Trois grands types d'adresses</h3>
<p>IPv6 distingue trois natures d'adresses, à ne pas confondre. L'<strong>unicast</strong> désigne <em>une seule</em> interface : le paquet va à une machine précise (comme un appel téléphonique). Le <strong>multicast</strong> désigne <em>un groupe</em> d'interfaces : le paquet est livré à tous les membres du groupe (comme une émission de radio pour les abonnés). L'<strong>anycast</strong> désigne <em>un groupe</em> aussi, mais le paquet ne va qu'au <strong>membre le plus proche</strong> (le plus proche au sens du routage). IPv6 n'a <strong>pas de broadcast</strong> (diffusion à tous) : le multicast le remplace avantageusement.</p>
<pre class="pseudo"># Les trois types (mnemotechnique)
unicast   : 1 vers 1        (une interface precise)
multicast : 1 vers plusieurs (tous les membres du groupe)
anycast   : 1 vers le plus proche (un seul membre, le plus proche)
# Pas de broadcast en IPv6 -> remplace par le multicast.</pre>
<h3>4. Reconnaître un type à son préfixe</h3>
<p>Le début de l'adresse (le préfixe) trahit son type. Les adresses <strong>multicast</strong> commencent toujours par <code>ff</code> (préfixe <code>ff00::/8</code>). Les adresses <strong>link-local</strong>, une catégorie d'unicast valable uniquement sur le lien local (le même réseau physique, non routable vers l'extérieur), commencent par <code>fe80</code> (préfixe <code>fe80::/10</code>). Chaque interface IPv6 possède automatiquement une adresse link-local : c'est elle qui sert aux échanges de voisinage (jour 4).</p>
<div class="tip">Réflexe de lecture : ça commence par <code>ff</code> ? C'est du multicast. Ça commence par <code>fe80</code> ? C'est du link-local (local au lien, non routable). Ça commence par <code>2001</code> ou <code>2000::/3</code> ? C'est de l'unicast global (routable sur Internet).</div>
<h3>5. Le préfixe et l'identifiant d'interface</h3>
<p>Comme en IPv4 avec le masque, une adresse IPv6 se lit en deux parties, séparées par la notation CIDR <code>/n</code>. Les premiers bits forment le <strong>préfixe réseau</strong> ; les derniers forment l'<strong>identifiant d'interface</strong> (equivalent de la partie « hôte »). Le plus courant est <strong>/64</strong> : 64 bits de réseau, 64 bits pour l'interface. Ainsi <code>2001:db8:ac10:1::/64</code> désigne un réseau, et une machine dedans pourrait avoir <code>2001:db8:ac10:1::a</code>.</p>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># Notation : 8 groupes de 16 bits en hexa, separes par ":"
# Raccourcis : zeros de tete supprimes  +  ::  (une seule fois)
# Types : unicast (1->1), multicast (1->groupe), anycast (1->plus proche)
# Prefixes : ff.. = multicast | fe80::/10 = link-local | 2000::/3 = global
# Decoupage : /64 courant -> 64 bits reseau + 64 bits interface
# Pas de broadcast en IPv6.</pre>`,
  exercises: [
    { type: "qcm", q: "Dans quelle base une adresse IPv6 s'écrit-elle ?", opts: ["Binaire", "Décimale", "Hexadécimale", "Octale"], a: 2, exp: "IPv6 s'écrit en hexadécimal (base 16, chiffres 0-9 et lettres a-f)." },
    { type: "qcm", q: "En combien de groupes découpe-t-on une adresse IPv6 ?", opts: ["4 groupes de 8 bits", "8 groupes de 16 bits", "6 groupes de 16 bits", "16 groupes de 8 bits"], a: 1, exp: "Huit groupes de 16 bits, séparés par des deux-points, soit 128 bits." },
    { type: "input", q: "Écris la forme compactée de l'adresse de bouclage IPv6 (localhost).", a: ["::1", "0:0:0:0:0:0:0:1"], ph: "l'adresse", exp: "0:0:0:0:0:0:0:1 se compacte en ::1." },
    { type: "vf", q: "On peut utiliser le double deux-points « :: » plusieurs fois dans une même adresse.", a: false, exp: "Non : une seule fois, sinon le nombre de groupes nuls devient ambigu." },
    { type: "qcm", q: "Que fait la règle « :: » ?", opts: ["Elle sépare deux adresses", "Elle remplace une suite de groupes entièrement nuls", "Elle double la longueur", "Elle marque la fin de l'adresse"], a: 1, exp: "Le :: remplace UNE suite de groupes de zéros consécutifs." },
    { type: "input", q: "Compacte au maximum : 2001:0db8:0000:0000:0000:0000:0000:0001", a: ["2001:db8::1", "2001:0db8::1"], ph: "adresse compactée", exp: "Zéros de tête supprimés et six groupes nuls remplacés par :: donnent 2001:db8::1." },
    { type: "qcm", q: "Une adresse qui commence par « ff » est de type…", opts: ["Unicast", "Multicast", "Anycast", "Link-local"], a: 1, exp: "Le préfixe ff00::/8 identifie les adresses multicast." },
    { type: "qcm", q: "Le type d'adresse « un vers le plus proche membre du groupe » s'appelle…", opts: ["Unicast", "Broadcast", "Anycast", "Multicast"], a: 2, exp: "Anycast : livré au membre le plus proche au sens du routage." },
    { type: "vf", q: "IPv6 possède un mécanisme de broadcast comme IPv4.", a: false, exp: "Non : IPv6 n'a pas de broadcast ; le multicast le remplace." },
    { type: "input", q: "Quel préfixe (forme feXX) identifie les adresses link-local ?", a: ["fe80", "fe80::", "fe80::/10"], ph: "feXX…", exp: "Les adresses link-local sont dans fe80::/10, on les reconnaît à fe80." },
    { type: "qcm", q: "Une adresse link-local (fe80::…) est…", opts: ["Routable sur tout Internet", "Valable seulement sur le lien local, non routable vers l'extérieur", "Réservée au multicast", "Interdite en IPv6"], a: 1, exp: "Link-local = local au lien physique, non routée hors du réseau local." },
    { type: "vf", q: "Supprimer les zéros de tête d'un groupe : 0db8 peut s'écrire db8.", a: true, exp: "Oui : les zéros de tête d'un groupe se retirent (0db8 -> db8, 0042 -> 42)." },
    { type: "qcm", q: "Le découpage réseau/interface le plus courant en IPv6 est…", opts: ["/8", "/24", "/64", "/128"], a: 2, exp: "Le /64 est standard : 64 bits de réseau, 64 bits d'identifiant d'interface." },
    { type: "input", q: "Un chiffre hexadécimal représente combien de bits ?", a: ["4", "4 bits", "quatre"], ph: "un nombre", exp: "Un chiffre hexa = 4 bits ; quatre chiffres = 16 bits = un groupe." },
    { type: "qcm", q: "Compacte : 2001:0:0:1:0:0:0:5 — quelle écriture est correcte ?", opts: ["2001::1::5", "2001:0:0:1::5", "2001::1:0:0:0:5", "2001:0:0:1:0:0:0:5 est déjà maximal"], a: 1, exp: "On applique :: sur la plus longue suite de zéros (la seconde) : 2001:0:0:1::5." }
  ],
  final: {
    title: "Exercice final — Décoder une adresse",
    intro: `<p>Nadia relève sur un routeur l'adresse <code>fe80:0000:0000:0000:0000:0000:0000:00a3</code> sur une interface, et voit passer du trafic vers <code>ff02::1</code>. Aidons-la à interpréter ce qu'elle observe.</p>`,
    questions: [
      { type: "input", q: "Compacte au maximum l'adresse fe80:0000:0000:0000:0000:0000:0000:00a3.", a: ["fe80::a3", "fe80::00a3"], ph: "adresse compactée", exp: "Zéros de tête et six groupes nuls -> fe80::a3." },
      { type: "qcm", q: "De quel type est fe80::a3 ?", opts: ["Multicast", "Unicast link-local", "Anycast", "Adresse globale routable"], a: 1, exp: "fe80 indique une adresse unicast link-local, locale au lien." },
      { type: "qcm", q: "L'adresse ff02::1 commence par ff : c'est donc du…", opts: ["Unicast", "Multicast", "Anycast", "Bouclage"], a: 1, exp: "Tout ce qui commence par ff est du multicast (ff02::1 = tous les nœuds du lien)." },
      { type: "vf", q: "L'adresse fe80::a3 est routable telle quelle vers Internet.", a: false, exp: "Non : une link-local n'est jamais routée hors du lien local." },
      { type: "qcm", q: "Nadia doit joindre UNE machine précise : quel type d'adresse utilise-t-elle ?", opts: ["Unicast", "Multicast", "Broadcast", "Anycast"], a: 0, exp: "Pour joindre une seule interface précise, on utilise de l'unicast." }
    ],
    solution: `<pre class="pseudo"># Lecture de Nadia :
fe80:...:00a3  -> fe80::a3   (unicast LINK-LOCAL, non routable)
ff02::1        -> multicast  (ff = multicast ; ici tous les noeuds du lien)
#
# Rappels de types :
unicast   1->1        | multicast 1->groupe (prefixe ff)
anycast   1->le plus proche | pas de broadcast en IPv6
# Reconnaitre au prefixe : fe80 = link-local, ff = multicast.</pre>
<p>Nadia sait lire les adresses. Demain : comment une machine se donne une adresse toute seule (SLAAC, NDP).</p>`
  }
};
</script>
