<script>
var DAY = {
  num: 13,
  title: "VLAN avancés et trunking (802.1Q)",
  subtitle: "Faire voyager plusieurs réseaux logiques sur un seul câble grâce à l'étiquette 802.1Q.",
  theory: `
<h3>1. Rappel : à quoi sert un VLAN</h3>
<p>Un <strong>VLAN</strong> (en anglais <em>Virtual Local Area Network</em>) découpe un commutateur physique en plusieurs réseaux logiques étanches. Les postes d'un même VLAN se parlent comme s'ils étaient seuls sur un switch ; ceux de VLAN différents doivent passer par un routeur. On segmente ainsi comptabilité, production et invités sans tirer de nouveaux câbles. Chaque VLAN porte un <strong>numéro</strong>, son <em>VLAN ID</em>.</p>
<p>Vois le switch comme un immeuble de bureaux : les VLAN sont des étages cloisonnés. On peut réorganiser les étages sans déménager les murs, simplement en réaffectant les bureaux.</p>
<h3>2. Le problème du câble unique entre deux switchs</h3>
<p>Si deux commutateurs hébergent chacun les VLAN 10, 20 et 30, comment faire passer les trois VLAN sur <strong>un seul câble</strong> qui les relie ? Il faut, à l'arrivée, savoir de quel VLAN vient chaque trame. La solution est de <strong>marquer</strong> chaque trame avec une étiquette indiquant son VLAN : c'est le <strong>tagging</strong>, normalisé par <strong>IEEE 802.1Q</strong>.</p>
<h3>3. Le tag 802.1Q : 4 octets insérés dans la trame</h3>
<p>La norme 802.1Q insère une étiquette de <strong>4 octets</strong> dans l'en-tête Ethernet, juste après l'adresse source. Ce tag contient notamment le <strong>VLAN ID sur 12 bits</strong>, ce qui donne théoriquement 4096 valeurs (0 à 4095), dont 1 à 4094 utilisables. On y trouve aussi 3 bits de priorité (le champ PCP, utilisé par la qualité de service) et un identifiant de protocole marquant qu'il s'agit d'une trame taguée.</p>
<pre class="pseudo"># Trame Ethernet avec tag 802.1Q (simplifie)
| MAC dest | MAC source | [TAG 802.1Q : 4 octets] | Type | Donnees | FCS |
                          \\__ TPID (0x8100) + PCP(3 bits) + VLAN ID (12 bits) __/
# VLAN ID sur 12 bits -> 0..4095 (1..4094 utilisables).</pre>
<h3>4. Port access contre port trunk</h3>
<p>Un port de switch fonctionne dans l'un de deux modes. Un <strong>port access</strong> appartient à <strong>un seul VLAN</strong> et se connecte à un poste final (PC, imprimante) : le poste ignore tout des VLAN, ses trames ne sont pas taguées. Un <strong>port trunk</strong>, lui, transporte <strong>plusieurs VLAN</strong> à la fois sur le même lien, en taguant les trames en 802.1Q : c'est le port qu'on utilise entre deux switchs ou vers un routeur.</p>
<div class="tip">Règle simple : port <strong>access</strong> = vers un poste, un seul VLAN, trames non taguées. Port <strong>trunk</strong> = entre équipements, plusieurs VLAN, trames taguées 802.1Q.</div>
<h3>5. Le VLAN natif : l'exception non taguée du trunk</h3>
<p>Sur un trunk, un VLAN particulier voyage <strong>sans étiquette</strong> : c'est le <strong>VLAN natif</strong> (en anglais <em>native VLAN</em>). Toute trame arrivant non taguée sur le trunk est réputée appartenir à ce VLAN natif. Par défaut il s'agit souvent du VLAN 1. Il est <strong>crucial que les deux extrémités du trunk soient d'accord</strong> sur le VLAN natif, sinon les trames non taguées atterrissent dans le mauvais VLAN.</p>
<pre class="pseudo"># Configuration Cisco simplifiee
# Port access vers un PC (VLAN 20)
interface gi0/1
 switchport mode access
 switchport access vlan 20
# Port trunk vers un autre switch
interface gi0/24
 switchport mode trunk
 switchport trunk native vlan 99      # VLAN natif choisi explicitement
 switchport trunk allowed vlan 10,20,30</pre>
<div class="warn">Ne laisse pas le VLAN natif au VLAN 1 par défaut sur un lien sensible : un désaccord entre les deux bouts, ou un mélange avec le trafic de gestion, ouvre des failles (saut de VLAN). Fixe-le explicitement et identiquement des deux côtés.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># VLAN = reseau logique ; VLAN ID identifie chaque VLAN
# 802.1Q = norme de tagging ; tag de 4 octets dans la trame
# VLAN ID sur 12 bits -> 0..4095 (1..4094 utilisables)
# Port access = 1 VLAN, vers un poste, trames non taguees
# Port trunk = plusieurs VLAN, trames taguees, entre equipements
# VLAN natif = le VLAN non tague du trunk ; a accorder des deux cotes</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie VLAN ?", opts: ["Very Large Area Network", "Virtual Local Area Network", "Verified Link Access Node", "Variable LAN"], a: 1, exp: "VLAN = Virtual Local Area Network, un réseau local virtuel." },
    { type: "input", q: "Quelle norme IEEE définit le tagging de VLAN ? (référence complète)", a: ["802.1q", "ieee 802.1q", "8021q"], ph: "802.1x…", exp: "La norme IEEE 802.1Q définit le marquage (tagging) des VLAN." },

    { type: "input", q: "Sur combien de bits est codé le VLAN ID dans le tag 802.1Q ?", a: ["12", "12 bits", "douze"], ph: "un nombre", exp: "Le VLAN ID tient sur 12 bits (0 à 4095)." },
    { type: "qcm", q: "Combien de valeurs de VLAN ID les 12 bits permettent-ils ?", opts: ["256", "1024", "4096 (0 à 4095)", "65536"], a: 2, exp: "12 bits = 4096 valeurs (0 à 4095), 1 à 4094 utilisables." },
    { type: "qcm", q: "Un port access…", opts: ["transporte plusieurs VLAN tagués", "appartient à un seul VLAN et connecte un poste", "relie toujours deux routeurs", "ignore les VLAN entièrement"], a: 1, exp: "Un port access est dans un seul VLAN, vers un poste final." },
    { type: "qcm", q: "Un port trunk sert à…", opts: ["connecter un seul PC", "transporter plusieurs VLAN sur un même lien, trames taguées", "désactiver les VLAN", "router entre AS"], a: 1, exp: "Le trunk porte plusieurs VLAN en taguant les trames en 802.1Q." },
    { type: "vf", q: "Sur un port access, les trames envoyées au poste final sont taguées 802.1Q.", a: false, exp: "Non : le poste ignore les VLAN, ses trames ne sont pas taguées." },
    { type: "input", q: "Comment appelle-t-on le VLAN qui voyage sans étiquette sur un trunk ? (deux mots)", a: ["vlan natif", "native vlan", "vlan native"], ph: "deux mots", exp: "C'est le VLAN natif (native VLAN)." },
    { type: "vf", q: "Le VLAN natif d'un trunk doit être identique aux deux extrémités.", a: true, exp: "Oui : un désaccord fait atterrir les trames non taguées dans le mauvais VLAN." },
    { type: "qcm", q: "Où insère-t-on le tag 802.1Q dans la trame Ethernet ?", opts: ["Après l'adresse source, dans l'en-tête", "Dans les données utiles", "Dans le FCS", "Nulle part, c'est un paquet séparé"], a: 0, exp: "Le tag s'insère dans l'en-tête, juste après l'adresse source." },
    { type: "qcm", q: "Quel VLAN est souvent le VLAN natif par défaut ?", opts: ["VLAN 0", "VLAN 1", "VLAN 100", "VLAN 4095"], a: 1, exp: "Par défaut, le VLAN natif est souvent le VLAN 1." },
    { type: "vf", q: "Les 3 bits de priorité (PCP) du tag 802.1Q servent à la qualité de service.", a: true, exp: "Oui : le champ PCP porte une priorité utilisée par la QoS de niveau 2." },
    { type: "input", q: "Quel mode de port configure-t-on entre deux switchs pour porter plusieurs VLAN ? (un mot)", a: ["trunk", "mode trunk", "trunking"], ph: "un mot", exp: "On configure le port en mode trunk." },
    { type: "qcm", q: "Pourquoi laisser le VLAN natif au VLAN 1 sur un lien sensible est déconseillé ?", opts: ["Cela ralentit le CPU", "Cela facilite des attaques de saut de VLAN / mélange avec la gestion", "Cela double la bande passante", "Cela désactive le trunk"], a: 1, exp: "Un VLAN natif mal maîtrisé ouvre des risques de saut de VLAN." }
  ],
  final: {
    title: "Exercice final — Relier deux switchs multi-VLAN",
    intro: `<p>SW1 et SW2 hébergent chacun les VLAN 10 (bureaux), 20 (voix) et 30 (invités). Ils sont reliés par un seul câble. Un PC en VLAN 20 sur SW1 doit joindre un serveur en VLAN 20 sur SW2. Configurons le lien correctement.</p>`,
    questions: [
      { type: "qcm", q: "Quel mode faut-il sur le port reliant SW1 et SW2 ?", opts: ["access", "trunk", "désactivé", "routage"], a: 1, exp: "Un lien portant plusieurs VLAN doit être un trunk." },
      { type: "input", q: "Quelle norme marque les trames pour distinguer les VLAN sur ce lien ?", a: ["802.1q", "ieee 802.1q", "8021q"], ph: "802.1…", exp: "802.1Q tague les trames avec leur VLAN ID." },
      { type: "vf", q: "Le VLAN natif doit être configuré identiquement sur SW1 et SW2.", a: true, exp: "Oui, sinon les trames non taguées tombent dans le mauvais VLAN." },
      { type: "qcm", q: "Le port du PC (VLAN 20) sur SW1 doit être en mode…", opts: ["trunk", "access dans le VLAN 20", "natif", "routé"], a: 1, exp: "Vers un poste final, on met un port access dans le bon VLAN." },
      { type: "input", q: "Sur combien de bits le VLAN ID 20 est-il codé dans le tag ?", a: ["12", "12 bits"], ph: "un nombre", exp: "Le VLAN ID (donc 20) est codé sur 12 bits." }
    ],
    solution: `<pre class="pseudo"># Sur SW1 (et symetriquement sur SW2)
interface gi0/1                 # vers le PC
 switchport mode access
 switchport access vlan 20
interface gi0/24                # lien vers SW2
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30
# Le trafic VLAN 20 traverse le trunk tague en 802.1Q,
# arrive sur SW2 identifie comme VLAN 20, et atteint le serveur.</pre>
<p>Le trunk 802.1Q distingue les trois VLAN sur le câble unique ; le VLAN natif accordé des deux côtés évite les mélanges ; le PC reste sur un port access simple.</p>`
  }
};
