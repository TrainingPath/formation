  title: "Le WiFi : les normes 802.11",
  subtitle: "De 802.11b à Wi-Fi 6 : comprendre bandes, débits et compatibilité.",
  theory: `
<h3>1. Le WiFi, c'est de l'Ethernet sans fil</h3>
<p>Le <strong>WiFi</strong> désigne les réseaux sans fil normalisés par la famille <strong>IEEE 802.11</strong>. L'idée est simple : remplacer le câble Ethernet par des ondes radio. La carte du poste et le <strong>point d'accès</strong> (en anglais <em>Access Point</em>, AP) dialoguent par radio, mais au-dessus, tout fonctionne comme un réseau local classique : mêmes adresses IP, mêmes protocoles. Le WiFi partage l'air comme un vieux réseau à câble partagé : à un instant donné, un seul émet, les autres écoutent. C'est un média <strong>half-duplex</strong> et partagé, d'où l'importance de bien le concevoir.</p>
<h3>2. Deux bandes de fréquences : 2,4 GHz et 5 GHz</h3>
<p>Le WiFi utilise deux grandes bandes de fréquences radio, chacune avec ses qualités. La bande <strong>2,4 GHz</strong> porte loin et traverse mieux les murs, mais elle est étroite, très encombrée (micro-ondes, Bluetooth, voisins) et n'offre que peu de canaux réellement utilisables. La bande <strong>5 GHz</strong> offre beaucoup plus de canaux et donc de débit, avec moins d'interférences, mais elle porte moins loin et traverse moins bien les obstacles.</p>
<pre class="pseudo"># Comparaison des deux bandes
Bande     Portee   Debit   Encombrement   Canaux utiles
2,4 GHz   longue   faible  fort           1 / 6 / 11 (3 non chevauchants)
5 GHz     courte   eleve   faible         de nombreux canaux 20/40/80 MHz</pre>
<div class="tip">Les box modernes sont <strong>bi-bande</strong> : elles diffusent en 2,4 GHz ET en 5 GHz. On reserve souvent le 5 GHz aux appareils proches et gourmands (PC, TV) et le 2,4 GHz aux objets eloignes ou lents (capteurs, imprimante).</div>
<h3>3. Les normes, de la plus ancienne à la plus récente</h3>
<p>Chaque lettre après « 802.11 » désigne une génération, avec un débit théorique maximal croissant. Depuis 2018, l'alliance WiFi a ajouté des noms commerciaux plus lisibles (Wi-Fi 4, 5, 6).</p>
<pre class="pseudo"># Les grandes normes 802.11
Norme     Nom commercial  Bande          Debit max theorique (ordre de grandeur)
802.11b   -               2,4 GHz        11 Mbit/s
802.11a   -               5 GHz          54 Mbit/s
802.11g   -               2,4 GHz        54 Mbit/s
802.11n   Wi-Fi 4         2,4 et 5 GHz   ~600 Mbit/s
802.11ac  Wi-Fi 5         5 GHz          plusieurs Gbit/s
802.11ax  Wi-Fi 6         2,4 et 5 GHz   plusieurs Gbit/s, meilleure densite</pre>
<div class="warn">Les debits annonces sont <strong>theoriques</strong> et partages : ils supposent un signal parfait et un seul appareil qui parle. En pratique on obtient bien moins, car l'air est partage et les obstacles attenuent le signal.</div>
<h3>4. Ce qui fait monter le débit</h3>
<p>Plusieurs techniques ont fait grimper les débits au fil des normes. Les <strong>canaux plus larges</strong> (20, 40, 80 MHz) transportent plus de données à la fois. La technique <strong>MIMO</strong> (« Multiple Input Multiple Output ») utilise plusieurs antennes en parallèle pour multiplier les flux. Enfin, une <strong>modulation</strong> plus dense encode davantage de bits par symbole radio. Wi-Fi 6 ajoute l'<strong>OFDMA</strong>, qui permet de servir plusieurs appareils en même temps sur un même canal : très utile dans les lieux denses (gares, amphis).</p>
<h3>5. Compatibilité ascendante</h3>
<p>Les normes sont <strong>rétrocompatibles</strong> : un point d'accès Wi-Fi 6 accepte un vieux portable 802.11n. Mais le lien se cale sur le plus lent des deux, et un client ancien qui « bavarde » lentement peut ralentir tout le monde sur la même cellule. D'où l'intérêt de renouveler le parc et de séparer les usages par bande.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># WiFi = 802.11 = Ethernet sans fil, media partage et half-duplex
# 2 bandes : 2,4 GHz (porte loin, lent, encombre) / 5 GHz (rapide, courte portee)
# Normes : b/g/n en 2,4 ; a/ac en 5 ; n et ax sur les deux bandes
# Wi-Fi 5 = 802.11ac  |  Wi-Fi 6 = 802.11ax
# Debit monte grace a : canaux larges + MIMO + modulation dense + OFDMA
# Debits annonces = theoriques et partages</pre>`,
  exercises: [

    { type: "qcm", q: "Quelle norme fonctionne uniquement en 2,4 GHz avec un débit max d'environ 11 Mbit/s ?", opts: ["802.11a", "802.11b", "802.11ac", "802.11ax"], a: 1, exp: "802.11b : 2,4 GHz, ~11 Mbit/s, la plus ancienne des grandes normes citées." },
    { type: "qcm", q: "Que désigne le sigle MIMO ?", opts: ["Un type de câble", "L'usage de plusieurs antennes en parallèle pour multiplier les flux", "Un protocole de chiffrement", "Une adresse réservée"], a: 1, exp: "MIMO = Multiple Input Multiple Output : plusieurs antennes, plusieurs flux simultanés." },
    { type: "input", q: "Le WiFi est un média partagé où un seul appareil émet à la fois : on dit qu'il est half-… quoi ?", a: ["duplex", "half-duplex", "half duplex"], ph: "half-…", exp: "Half-duplex : on émet OU on reçoit, pas les deux en même temps, sur un média partagé." },
    { type: "qcm", q: "Quelle norme fonctionne sur les DEUX bandes et porte le nom Wi-Fi 4 ?", opts: ["802.11g", "802.11n", "802.11ac", "802.11b"], a: 1, exp: "802.11n = Wi-Fi 4, disponible en 2,4 et 5 GHz." },
    { type: "vf", q: "Un point d'accès Wi-Fi 6 refuse totalement les anciens clients 802.11n.", a: false, exp: "Non : les normes sont rétrocompatibles ; le lien se cale simplement sur le plus lent." },
    { type: "qcm", q: "Quel apport majeur de Wi-Fi 6 sert les environnements très denses ?", opts: ["Le chiffrement WEP", "L'OFDMA (servir plusieurs appareils en même temps)", "Le retour au 2,4 GHz uniquement", "La suppression du MIMO"], a: 1, exp: "OFDMA permet de partager un canal entre plusieurs clients simultanément." },
    { type: "input", q: "Comment qualifie-t-on une box qui diffuse à la fois en 2,4 GHz et 5 GHz ?", a: ["bi-bande", "bibande", "bi bande", "dual band", "double bande"], ph: "un mot", exp: "Une box bi-bande émet simultanément sur 2,4 et 5 GHz." },
    { type: "qcm", q: "Pourquoi la bande 5 GHz offre-t-elle plus de débit que la 2,4 GHz ?", opts: ["Parce qu'elle porte plus loin", "Parce qu'elle offre plus de canaux et moins d'interférences", "Parce qu'elle traverse mieux les murs", "Parce qu'elle est plus ancienne"], a: 1, exp: "Plus de canaux disponibles et un air moins encombré = plus de débit." }
  ],
  final: {
    title: "Exercice final — Choisir la bonne norme et la bonne bande",
    intro: `<p>Un foyer possède une box bi-bande Wi-Fi 6. Il faut connecter un smartphone récent proche de la box, une caméra de jardin éloignée derrière deux murs, et un vieux portable 802.11n. Aide à répartir les usages.</p>`,
    questions: [
      { type: "qcm", q: "Le smartphone récent, proche de la box, est-il mieux en…", opts: ["2,4 GHz pour la portée", "5 GHz pour le débit", "Aucune bande", "En filaire uniquement"], a: 1, exp: "Proche et gourmand : le 5 GHz offre le meilleur débit." },
      { type: "qcm", q: "La caméra de jardin, éloignée et derrière deux murs, est mieux en…", opts: ["5 GHz", "2,4 GHz pour la portée et la traversée des murs", "Sans WiFi", "Wi-Fi 5 obligatoire"], a: 1, exp: "Le 2,4 GHz porte plus loin et traverse mieux les obstacles." },
      { type: "vf", q: "Le vieux portable 802.11n pourra se connecter au point d'accès Wi-Fi 6.", a: true, exp: "Oui : rétrocompatibilité. Le lien se calera sur la vitesse du 802.11n." },
      { type: "input", q: "Quel nom commercial porte le 802.11ax de la box ?", a: ["wi-fi 6", "wifi 6", "wi fi 6", "6"], ph: "Wi-Fi ?", exp: "802.11ax = Wi-Fi 6." },
      { type: "qcm", q: "Pourquoi séparer les usages entre les deux bandes ?", opts: ["Pour interdire Internet", "Pour donner du débit aux appareils proches et de la portée aux éloignés", "Pour chiffrer davantage", "Pour économiser des adresses IP"], a: 1, exp: "On adapte la bande à chaque besoin : débit en 5 GHz, portée en 2,4 GHz." }
    ],
    solution: `<pre class="pseudo"># Repartition conseillee (box bi-bande Wi-Fi 6)
Smartphone recent, proche  -> 5 GHz   (debit maximal)
Camera de jardin, eloignee -> 2,4 GHz (portee, traverse les murs)
Vieux portable 802.11n     -> se connecte (retrocompatible),
                              se cale sur sa propre vitesse
# Regle simple :
#   PRES + GOURMAND  -> 5 GHz
#   LOIN + LEGER     -> 2,4 GHz</pre>
<p>Une box bi-bande Wi-Fi 6 accepte tout le monde. On répartit intelligemment : le 5 GHz pour le débit à courte portée, le 2,4 GHz pour la portée à travers les murs. Les anciens appareils restent compatibles, mais ils dialoguent à leur propre vitesse.</p>`
  }
