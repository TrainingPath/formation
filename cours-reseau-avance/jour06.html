<script>
var DAY = {
  num: 6,
  title: "Le routage dynamique : les principes",
  subtitle: "Quand les routeurs apprennent les chemins tout seuls, au lieu qu'on les leur dicte.",
  theory: `
<h3>1. Rappel : le routage statique et ses limites</h3>
<p>Jusqu'ici, tu ajoutais des routes <strong>à la main</strong> : « pour joindre tel réseau, passe par tel routeur ». C'est le <strong>routage statique</strong>. Il est précis, prévisible et léger, parfait pour un petit réseau. Mais il a deux défauts majeurs quand le réseau grandit. D'abord, il ne <strong>passe pas à l'échelle</strong> : configurer trois routeurs est facile, en configurer trois cents à la main est un cauchemar. Ensuite, il ne <strong>s'adapte pas</strong> : si un lien tombe, la route reste écrite mais ne mène plus nulle part, jusqu'à ce qu'un humain intervienne.</p>
<div class="warn">Une route statique ne « sait » pas qu'un lien est cassé : elle continue d'envoyer le trafic dans le vide. Sur un grand réseau, l'intervention humaine est trop lente pour rétablir le service à temps.</div>
<h3>2. L'idée du routage dynamique</h3>
<p>Le <strong>routage dynamique</strong> automatise tout cela. Chaque routeur exécute un <strong>protocole de routage</strong> qui lui permet de <strong>dialoguer avec ses voisins</strong>, d'apprendre les réseaux qu'ils connaissent, et de <strong>calculer tout seul</strong> le meilleur chemin. Si un lien tombe, les routeurs s'en aperçoivent, s'échangent l'information et <strong>recalculent</strong> un chemin de secours automatiquement. L'humain configure le protocole une fois ; ensuite, le réseau s'auto-organise.</p>
<pre class="pseudo"># Statique vs dynamique
STATIQUE  : l'humain ecrit chaque route. Fige, ne s'adapte pas.
DYNAMIQUE : les routeurs se parlent, apprennent, recalculent seuls.
#
# Analogie : un plan papier fige (statique)
#            vs un GPS qui recalcule en direct (dynamique).</pre>
<h3>3. La métrique : comment choisir « le meilleur » chemin</h3>
<p>Souvent, plusieurs chemins mènent au même réseau. Lequel choisir ? Le routeur compare les chemins grâce à une <strong>métrique</strong> : un nombre qui mesure le « coût » d'un chemin. Plus la métrique est <strong>basse</strong>, meilleur est le chemin. Chaque protocole a sa propre définition de la métrique : nombre de routeurs traversés (le <strong>nombre de sauts</strong>, ou <em>hop count</em>), bande passante disponible, délai, fiabilité du lien… Le principe reste le même : transformer « la qualité d'un chemin » en un chiffre comparable.</p>
<pre class="pseudo"># La metrique : un cout compare pour choisir
Chemin A : 2 sauts  ->  metrique 2
Chemin B : 4 sauts  ->  metrique 4
# Le routeur retient A (metrique la plus basse).
# Selon le protocole : sauts, bande passante, delai...</pre>
<div class="tip">Retiens la règle d'or : la meilleure route est celle de <strong>métrique la plus faible</strong>. Ce qui change d'un protocole à l'autre, c'est la <em>façon de calculer</em> cette métrique, pas ce principe de comparaison.</div>
<h3>4. La convergence</h3>
<p>Quand quelque chose change (un lien tombe, un nouveau réseau apparaît), il faut un peu de temps pour que <strong>tous</strong> les routeurs se mettent d'accord sur la nouvelle carte. Ce moment où l'ensemble du réseau a intégré le changement et possède des tables cohérentes s'appelle la <strong>convergence</strong>. Un protocole qui <strong>converge vite</strong> rétablit le service rapidement après une panne ; un protocole lent laisse, pendant sa convergence, des routes incohérentes qui peuvent créer des boucles ou des pertes. La <strong>vitesse de convergence</strong> est un critère de qualité essentiel d'un protocole de routage.</p>
<h3>5. Deux grandes familles</h3>
<p>Il existe deux grandes philosophies de protocoles dynamiques, que les deux prochains jours détaillent. Les protocoles à <strong>vecteur de distance</strong> (<em>distance vector</em>) : chaque routeur dit à ses voisins « voici les réseaux que je connais et à quelle distance », un peu comme des rumeurs de proche en proche (exemple : <strong>RIP</strong>). Les protocoles à <strong>état de liens</strong> (<em>link state</em>) : chaque routeur décrit l'état de ses liens à tout le monde, et chacun se construit une <strong>carte complète</strong> du réseau pour calculer les chemins (exemple : <strong>OSPF</strong>). Les premiers sont simples mais lents à converger ; les seconds sont plus complexes mais plus rapides et plus fiables.</p>
<pre class="pseudo"># Deux familles (jours 7 et 8)
Vecteur de distance : "je connais tel reseau a telle distance"
                      simple, mais convergence lente. Ex : RIP
Etat de liens       : "voici l'etat de mes liens" -> carte complete
                      complexe, mais rapide et fiable. Ex : OSPF</pre>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># Statique : a la main, fige. Dynamique : les routeurs apprennent seuls.
# METRIQUE : cout d'un chemin -> on prend la plus BASSE.
# CONVERGENCE : temps pour que tous les routeurs soient d'accord.
# 2 familles : vecteur de distance (RIP) | etat de liens (OSPF)</pre>`,
  exercises: [
    { type: "qcm", q: "Quel est le principal défaut du routage statique sur un grand réseau ?", opts: ["Il consomme trop d'électricité", "Il ne passe pas à l'échelle et ne s'adapte pas aux pannes", "Il ne fonctionne qu'en IPv6", "Il nécessite un serveur central dédié"], a: 1, exp: "Le statique se configure à la main et ne réagit pas automatiquement aux changements." },
    { type: "vf", q: "Une route statique détecte automatiquement qu'un lien est tombé et se corrige seule.", a: false, exp: "Non : elle reste écrite telle quelle ; il faut une intervention humaine." },
    { type: "qcm", q: "Dans le routage dynamique, comment un routeur apprend-il les chemins ?", opts: ["Un humain les tape tous", "En dialoguant avec ses voisins et en calculant seul", "En les téléchargeant sur un site", "Ils sont gravés en usine"], a: 1, exp: "Les routeurs s'échangent des informations et calculent leurs tables automatiquement." },
    { type: "input", q: "Comment appelle-t-on le nombre qui mesure le « coût » d'un chemin pour le comparer aux autres ?", a: ["la metrique", "metrique", "une metrique", "metric"], ph: "un mot", exp: "La métrique : plus elle est basse, meilleur est le chemin." },
    { type: "qcm", q: "Entre deux chemins, lequel le routeur retient-il ?", opts: ["Celui de métrique la plus élevée", "Celui de métrique la plus basse", "Le plus récent", "Le premier appris"], a: 1, exp: "La meilleure route est celle de métrique la plus faible." },
    { type: "vf", q: "Tous les protocoles calculent la métrique exactement de la même façon.", a: false, exp: "Non : sauts, bande passante, délai… chaque protocole a sa propre définition." },
    { type: "input", q: "Comment nomme-t-on la métrique basée sur le nombre de routeurs traversés (terme français) ?", a: ["nombre de sauts", "le nombre de sauts", "sauts", "hop count", "nombre de saut"], ph: "trois mots", exp: "Le nombre de sauts (hop count) compte les routeurs traversés." },
    { type: "qcm", q: "Le moment où tous les routeurs partagent une vision cohérente du réseau s'appelle…", opts: ["La saturation", "La convergence", "La collision", "La fragmentation"], a: 1, exp: "La convergence : tout le réseau a intégré le dernier changement." },
    { type: "vf", q: "Un protocole qui converge lentement peut, pendant ce temps, provoquer des boucles ou des pertes.", a: true, exp: "Oui : tant que les tables sont incohérentes, le trafic peut boucler ou se perdre." },
    { type: "qcm", q: "Pourquoi la vitesse de convergence est-elle importante ?", opts: ["Pour économiser la mémoire", "Pour rétablir vite le service après une panne", "Pour chiffrer plus fort", "Pour réduire le nombre d'adresses"], a: 1, exp: "Converger vite = rétablir rapidement un chemin valide après un incident." },
    { type: "qcm", q: "Dans un protocole à vecteur de distance, un routeur annonce à ses voisins…", opts: ["L'état complet de tous les liens du réseau", "Les réseaux qu'il connaît et à quelle distance", "Rien du tout", "Uniquement son adresse MAC"], a: 1, exp: "Vecteur de distance : « je connais tel réseau à telle distance », de proche en proche." },
    { type: "qcm", q: "Dans un protocole à état de liens, chaque routeur construit…", opts: ["Une simple liste de voisins", "Une carte complète du réseau", "Un seul chemin figé", "Une table d'adresses MAC"], a: 1, exp: "État de liens : chacun décrit ses liens et se bâtit une carte complète." },
    { type: "input", q: "Cite le protocole à vecteur de distance étudié au jour 7 (trois lettres).", a: ["rip"], ph: "3 lettres", exp: "RIP est l'exemple typique de protocole à vecteur de distance." },
    { type: "input", q: "Cite le protocole à état de liens étudié au jour 8 (quatre lettres).", a: ["ospf"], ph: "4 lettres", exp: "OSPF est l'exemple typique de protocole à état de liens." },
    { type: "vf", q: "Les protocoles à état de liens sont généralement plus rapides à converger que ceux à vecteur de distance.", a: true, exp: "Oui : la carte complète permet un recalcul plus rapide et plus fiable." }
  ],
  final: {
    title: "Exercice final — Vendre le routage dynamique",
    intro: `<p>Le réseau de l'université de Théo compte maintenant 40 routeurs, tous configurés en statique. Chaque panne oblige un technicien à corriger les tables à la main, parfois la nuit. Théo propose de passer au routage dynamique. Construisons son raisonnement.</p>`,
    questions: [
      { type: "qcm", q: "Premier problème que Théo pointe avec le statique sur 40 routeurs :", opts: ["Il nécessite un protocole propriétaire", "Ça ne passe pas à l'échelle et n'auto-corrige pas les pannes", "Il sature les liens d'annonces", "Il exige des routeurs identiques"], a: 1, exp: "40 routeurs à la main + pas d'auto-correction = ingérable." },
      { type: "input", q: "Théo explique que les routeurs choisiront le meilleur chemin grâce à un nombre de coût. Comment l'appelle-t-il ?", a: ["la metrique", "metrique", "metric"], ph: "un mot", exp: "La métrique : on retient le chemin de métrique la plus basse." },
      { type: "vf", q: "Théo promet qu'après une panne, les routeurs recalculeront un chemin de secours automatiquement.", a: true, exp: "Oui : c'est l'atout du dynamique, à la vitesse de sa convergence." },
      { type: "input", q: "Théo insiste sur le temps que met le réseau à retrouver des tables cohérentes après un changement. Ce temps s'appelle la…", a: ["convergence", "la convergence"], ph: "un mot", exp: "La convergence : plus elle est rapide, mieux c'est." },
      { type: "qcm", q: "Théo devra choisir une famille de protocole. Lesquelles lui présente-t-on aux jours 7 et 8 ?", opts: ["TCP et UDP", "Vecteur de distance (RIP) et état de liens (OSPF)", "IPv4 et IPv6", "DNS et DHCP"], a: 1, exp: "Vecteur de distance (RIP, jour 7) et état de liens (OSPF, jour 8)." }
    ],
    solution: `<pre class="pseudo"># Le dossier de Theo :
Probleme : 40 routeurs en statique -> ingerable + pannes non corrigees.
Solution : routage DYNAMIQUE (les routeurs apprennent et recalculent seuls).
Choix du chemin : METRIQUE la plus basse.
Critere cle : vitesse de CONVERGENCE apres un incident.
Familles : vecteur de distance (RIP) | etat de liens (OSPF).</pre>
<p>Théo a convaincu la DSI. Demain : le plus simple des protocoles dynamiques, RIP.</p>`
  }
};
</script>
