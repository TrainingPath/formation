<script>
var DAY = {
  num: 28,
  title: "L'automatisation réseau (Ansible, IaC)",
  subtitle: "Décrire l'état voulu du réseau dans du code, puis le laisser s'appliquer.",
  theory: `
<h3>1. Le problème du réseau « à la main »</h3>
<p>Configurer un équipement par SSH, commande par commande, marche pour un routeur. Mais avec cinquante commutateurs, la méthode devient lente, source d'erreurs et impossible à reproduire à l'identique. Deux appareils censés être jumeaux finissent toujours par diverger : c'est la <strong>dérive de configuration</strong> (configuration drift). L'automatisation répond à cela : on décrit une fois la configuration, on l'applique partout, de façon fiable.</p>
<h3>2. L'infrastructure as code (IaC)</h3>
<p>L'<strong>IaC</strong> (Infrastructure as Code) consiste à décrire l'infrastructure — serveurs, réseaux, règles — dans des <strong>fichiers texte versionnés</strong>, exactement comme du code source. Avantages : on relit les changements (revue de code), on garde l'historique dans Git, on reconstruit à l'identique en cas de sinistre, et on documente automatiquement l'état réel. Le fichier <em>est</em> la vérité.</p>
<div class="tip">Deux philosophies : le mode <strong>impératif</strong> décrit les étapes (« fais ceci, puis cela ») ; le mode <strong>déclaratif</strong> décrit l'état voulu (« il DOIT y avoir un VLAN 10 nommé RH ») et laisse l'outil trouver comment y arriver. Ansible est majoritairement déclaratif.</div>
<h3>3. Ansible en bref</h3>
<p><strong>Ansible</strong> est un outil d'automatisation très répandu. Sa force : il est <strong>sans agent</strong> (agentless), c'est-à-dire qu'il n'installe rien de permanent sur les machines cibles ; il se connecte en SSH (ou via des API réseau) pour appliquer la configuration. On décrit les cibles dans un <strong>inventaire</strong> (inventory), et les actions dans des <strong>playbooks</strong> écrits en <strong>YAML</strong>, un format texte lisible fondé sur l'indentation.</p>
<pre class="pseudo"># Extrait de playbook YAML : creer un VLAN sur des commutateurs
- name: Configurer le VLAN RH
  hosts: commutateurs
  tasks:
    - name: S'assurer que le VLAN 10 existe
      ios_vlan:
        vlan_id: 10
        name: RH
        state: present     # etat VOULU : le VLAN 10 doit exister</pre>
<h3>4. L'idempotence, propriété reine</h3>
<p>La notion la plus importante est l'<strong>idempotence</strong> : appliquer plusieurs fois le même playbook produit le même résultat qu'une seule fois. Si le VLAN 10 existe déjà, Ansible ne le recrée pas et signale <em>ok</em> (aucun changement) ; s'il manque, il le crée et signale <em>changed</em>. Tu peux donc relancer un playbook sans crainte : il n'agit que sur ce qui s'écarte de l'état voulu. C'est ce qui rend l'automatisation sûre et répétable.</p>
<pre class="pseudo"># Resultat d'une execution idempotente
PLAY [Configurer le VLAN RH]
  ok=1    changed=0    # deja conforme : rien n'a ete modifie
# Relancer -> toujours changed=0 tant que l'etat voulu est respecte</pre>
<div class="warn">Une commande brute (module « shell » ou « command ») n'est pas idempotente par nature : elle s'exécute à chaque fois. Privilégie les modules dédiés (déclaratifs) qui vérifient l'état avant d'agir.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># IaC = infrastructure decrite dans du code texte versionne (Git)
# Declaratif : on decrit l'ETAT VOULU, pas les etapes
# Ansible : sans agent (SSH/API), inventaire + playbooks en YAML
# Idempotence : rejouer un playbook -> meme resultat (ok / changed)
# Modules dedies plutot que commandes brutes -> idempotent et sur</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie IaC ?", opts: ["Internet as Cloud", "Infrastructure as Code", "IP address Configuration", "Internal Access Control"], a: 1, exp: "IaC = Infrastructure as Code : décrire l'infrastructure dans des fichiers texte." },
    { type: "qcm", q: "Dans quel format sont écrits les playbooks Ansible ?", opts: ["XML", "YAML", "JSON compilé", "binaire"], a: 1, exp: "Les playbooks Ansible sont écrits en YAML, lisible et basé sur l'indentation." },
    { type: "input", q: "Comment appelle-t-on la propriété : « rejouer le même playbook donne le même résultat » ? (un mot)", a: ["idempotence", "l'idempotence", "idempotent", "idempotente"], ph: "un mot", exp: "L'idempotence : plusieurs exécutions équivalent à une seule." },
    { type: "qcm", q: "Ansible est qualifié de « sans agent » (agentless) parce que…", opts: ["il ne fait rien", "il n'installe pas de logiciel permanent sur les cibles et passe par SSH/API", "il n'a pas de playbooks", "il tourne uniquement sur Windows"], a: 1, exp: "Agentless : pas d'agent permanent ; connexion par SSH ou API." },
    { type: "vf", q: "Le mode déclaratif décrit l'état voulu plutôt que la suite exacte des étapes.", a: true, exp: "Oui : on décrit le résultat attendu, l'outil trouve comment l'atteindre." },
    { type: "input", q: "Comment nomme-t-on le fichier listant les machines cibles d'Ansible ? (un mot)", a: ["inventaire", "l'inventaire", "inventory"], ph: "un mot", exp: "L'inventaire (inventory) décrit les hôtes que gère Ansible." },
    { type: "qcm", q: "Que se passe-t-il si un playbook idempotent trouve la configuration déjà conforme ?", opts: ["Il plante", "Il n'applique aucun changement et signale ok / changed=0", "Il supprime tout", "Il recrée tout à zéro"], a: 1, exp: "S'il est déjà conforme, il ne change rien (changed=0)." },
    { type: "vf", q: "Configurer 50 commutateurs à la main garantit qu'ils resteront tous identiques.", a: false, exp: "Non : c'est la porte ouverte à la dérive de configuration (drift)." },
    { type: "qcm", q: "Comment appelle-t-on la divergence progressive entre appareils censés être identiques ?", opts: ["la dérive de configuration (drift)", "l'idempotence", "le NAT", "le peering"], a: 0, exp: "C'est la configuration drift, que l'IaC aide à éviter." },
    { type: "input", q: "Terme (deux mots anglais) désignant l'approche « décrire l'infrastructure comme du code ».", a: ["infrastructure as code", "infrastructure-as-code", "iac"], ph: "trois mots", exp: "Infrastructure as Code (IaC)." },
    { type: "vf", q: "Un module « shell/command » qui lance une commande brute est idempotent par nature.", a: false, exp: "Non : il s'exécute à chaque fois ; on préfère les modules déclaratifs dédiés." },
    { type: "qcm", q: "Un intérêt majeur de versionner sa configuration réseau dans Git ?", opts: ["Rendre le réseau plus lent", "Garder l'historique, faire des revues et reconstruire à l'identique", "Supprimer les sauvegardes", "Désactiver SSH"], a: 1, exp: "Git apporte historique, revue et reproductibilité." },
    { type: "qcm", q: "Dans le playbook, « state: present » exprime…", opts: ["une étape à répéter 10 fois", "l'état voulu : cet objet doit exister", "un ordre de suppression", "une adresse IP"], a: 1, exp: "state: present décrit l'état voulu (l'objet doit exister)." },
    { type: "input", q: "Comment appelle-t-on le fichier YAML qui décrit les tâches à appliquer avec Ansible ? (un mot)", a: ["playbook", "un playbook", "le playbook"], ph: "un mot", exp: "Le playbook contient les tâches (tasks) à appliquer." },
    { type: "vf", q: "Grâce à l'idempotence, on peut relancer un playbook sans risque tant que l'état voulu est respecté.", a: true, exp: "Oui : il n'agit que sur ce qui s'écarte de l'état décrit." }
  ],
  final: {
    title: "Exercice final — Déployer un VLAN sur tout un parc",
    intro: `<p>Une équipe doit créer le VLAN 20 « Voix » sur 40 commutateurs identiques et garantir que la configuration reste conforme dans le temps, sans dérive. Elle choisit Ansible.</p>`,
    questions: [
      { type: "qcm", q: "Où l'équipe déclare-t-elle la liste des 40 commutateurs ?", opts: ["Dans le playbook uniquement", "Dans l'inventaire (inventory)", "Dans le DNS", "Dans un pare-feu"], a: 1, exp: "L'inventaire recense les hôtes cibles." },
      { type: "input", q: "Dans quel format écrira-t-elle le playbook ? (un mot)", a: ["yaml"], ph: "un format", exp: "En YAML, le format des playbooks Ansible." },
      { type: "qcm", q: "Quelle clé exprime « le VLAN 20 doit exister » ?", opts: ["state: absent", "state: present", "delete: true", "mode: fast"], a: 1, exp: "state: present décrit l'état voulu : l'objet doit exister." },
      { type: "vf", q: "Si l'équipe relance le playbook alors que tout est déjà conforme, aucun changement ne sera appliqué.", a: true, exp: "Oui, grâce à l'idempotence : changed=0 tant que l'état est respecté." },
      { type: "qcm", q: "Comment détecter et corriger une future dérive sur un commutateur ?", opts: ["Rien à faire", "Relancer périodiquement le playbook : il ne corrige que ce qui a divergé", "Réinstaller tous les commutateurs", "Débrancher le réseau"], a: 1, exp: "Rejouer le playbook ramène chaque appareil à l'état voulu (correction du drift)." }
    ],
    solution: `<pre class="pseudo"># Inventaire (extrait)
[commutateurs]
sw01 ansible_host=10.0.0.11
sw02 ansible_host=10.0.0.12
# ... jusqu'a sw40

# Playbook (YAML) applique a tous
- hosts: commutateurs
  tasks:
    - name: VLAN 20 Voix present
      ios_vlan:
        vlan_id: 20
        name: Voix
        state: present     # etat voulu

# Rejouer regulierement -> idempotent : ok=... changed=0 si conforme,
# et correction ciblee de toute derive detectee.</pre>
<p>L'IaC et l'idempotence transforment la configuration réseau en code fiable, versionné et reproductible sur tout un parc.</p>`
  }
};
</script>
