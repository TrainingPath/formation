  title: "Concevoir un réseau WiFi (canaux, couverture)",
  subtitle: "Éviter les interférences avec un bon plan de fréquences.",
  theory: `
<h3>1. Le problème : des cellules qui se marchent dessus</h3>
<p>Un point d'accès (AP) couvre une zone appelée <strong>cellule</strong>. Dans un grand bâtiment, un seul AP ne suffit pas : on en pose plusieurs. Mais s'ils émettent sur le même canal en se chevauchant, ils se brouillent mutuellement, comme deux personnes qui crient en même temps dans la même pièce. Concevoir un réseau WiFi, c'est surtout organiser deux choses : la <strong>couverture</strong> (aucune zone morte) et le <strong>plan de fréquences</strong> (des AP voisins sur des canaux différents).</p>
<h3>2. Les canaux non chevauchants en 2,4 GHz : 1, 6 et 11</h3>
<p>La bande 2,4 GHz est découpée en 13 canaux (en Europe), mais ils se recouvrent largement : chaque canal WiFi est large et déborde sur ses voisins. En pratique, seuls trois canaux ne se chevauchent pas : <strong>1, 6 et 11</strong>. C'est la règle d'or du 2,4 GHz. On attribue à des AP voisins des canaux pris dans cet ensemble pour qu'ils ne s'interfèrent pas.</p>
<pre class="pseudo"># Bande 2,4 GHz : seuls 1, 6 et 11 ne se chevauchent pas
Canal :  1 . . . . 6 . . . . 11
         |_________|_________|
# Deux AP cote a cote : par exemple 1 et 6, ou 6 et 11.
# JAMAIS deux AP voisins sur le meme canal (ou sur 1 et 3 : ils se recouvrent).</pre>
<div class="tip">En 5 GHz, il y a beaucoup plus de canaux non chevauchants : la planification y est plus facile et on prefere cette bande dans les environnements denses.</div>
<h3>3. Le plan de fréquences en nid d'abeille</h3>
<p>Pour couvrir une surface avec plusieurs AP, on procède comme un motif en <strong>nid d'abeille</strong> : chaque cellule est entourée de cellules sur des canaux différents. En 2,4 GHz, on alterne 1 / 6 / 11 de sorte que deux cellules adjacentes n'aient jamais le même canal. Ainsi, même si les cellules se touchent pour éviter les zones mortes, elles n'interfèrent pas.</p>
<pre class="pseudo"># Plan de frequences en nid d'abeille (2,4 GHz)
   ( 1 )   ( 6 )   ( 1 )
      ( 11 )   ( 11 )
   ( 6 )   ( 1 )   ( 6 )
# Deux cellules qui se touchent n'ont jamais le meme canal.</pre>
<h3>4. Couverture et recouvrement maîtrisé</h3>
<p>Il faut un léger <strong>recouvrement</strong> (10 à 20 %) entre cellules voisines pour qu'un appareil qui se déplace ne perde jamais le signal. Trop de recouvrement gaspille et augmente les interférences ; pas assez crée des <strong>zones mortes</strong> (aucun signal). On ajuste aussi la <strong>puissance d'émission</strong> de chaque AP : la baisser réduit la taille de la cellule et limite le brouillage avec les voisins. Un site survey (relevé sur place) mesure le signal réel avant de figer le plan.</p>
<div class="warn">Monter la puissance a fond n'ameliore pas forcement le WiFi : cela agrandit la cellule, augmente le chevauchement avec les AP voisins et cree plus d'interferences. Souvent, il vaut mieux BAISSER la puissance et ajouter des AP.</div>
<h3>5. Le roaming : passer d'un AP à l'autre</h3>
<p>Quand un utilisateur se déplace (couloir, étages), son appareil doit passer d'un AP au suivant sans coupure : c'est le <strong>roaming</strong> (itinérance). Pour que ce soit transparent, tous les AP diffusent le <strong>même nom de réseau</strong> (SSID) et sont sur le même réseau logique ; l'appareil bascule tout seul vers l'AP au meilleur signal. Un bon recouvrement et un plan de canaux propre rendent ce basculement fluide, sans coupure d'appel VoIP par exemple.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Cellule = zone couverte par un AP
# 2,4 GHz : seuls les canaux 1, 6 et 11 ne se chevauchent pas
# Plan de frequences en nid d'abeille : voisins sur canaux differents
# Recouvrement 10-20 % : pas de zone morte, pas de brouillage excessif
# Baisser la puissance + ajouter des AP > monter la puissance a fond
# Roaming = passer d'un AP a l'autre sans coupure (meme SSID)</pre>`,

    { type: "input", q: "Comment appelle-t-on le fait qu'un appareil passe d'un AP à l'autre sans coupure ?", a: ["roaming", "le roaming", "itinerance", "itinérance", "l'itinerance"], ph: "un mot", exp: "Le roaming (itinérance) : basculement transparent entre AP." },

    { type: "vf", q: "Un léger recouvrement (10 à 20 %) entre cellules aide le roaming.", a: true, exp: "Oui : un peu de recouvrement évite les coupures quand on se déplace." },
    { type: "qcm", q: "Que provoque une puissance d'émission poussée au maximum sur tous les AP ?", opts: ["Un meilleur WiFi partout", "Plus de chevauchement et d'interférences entre AP", "La disparition des zones mortes garantie", "Un débit doublé"], a: 1, exp: "Trop de puissance agrandit les cellules et augmente le brouillage mutuel." },
    { type: "input", q: "Comment nomme-t-on une zone sans aucun signal WiFi ?", a: ["zone morte", "une zone morte", "zone blanche", "trou de couverture"], ph: "deux mots", exp: "Une zone morte (ou trou de couverture) : aucun signal reçu." },
    { type: "qcm", q: "Pour que le roaming soit transparent, les AP doivent diffuser…", opts: ["Des SSID tous différents", "Le même SSID (nom de réseau)", "Aucun SSID", "Un SSID caché unique par étage"], a: 1, exp: "Même SSID sur tous les AP : l'appareil bascule sans changer de réseau." },
    { type: "vf", q: "En 5 GHz, il y a davantage de canaux non chevauchants qu'en 2,4 GHz.", a: true, exp: "Oui : le 5 GHz offre bien plus de canaux disjoints, facilitant la planification." },
    { type: "qcm", q: "Deux AP côte à côte : quelle paire de canaux est correcte en 2,4 GHz ?", opts: ["1 et 2", "1 et 3", "6 et 11", "6 et 7"], a: 2, exp: "6 et 11 ne se chevauchent pas. 1/2, 1/3, 6/7 se recouvrent." },
    { type: "input", q: "Comment appelle-t-on le relevé de mesures du signal réalisé sur place avant de figer le plan WiFi ?", a: ["site survey", "un site survey", "releve de couverture", "site-survey"], ph: "terme anglais", exp: "Le site survey mesure le signal réel sur le terrain." },
    { type: "qcm", q: "Souvent, la meilleure solution à une mauvaise couverture est de…", opts: ["Monter la puissance à fond d'un seul AP", "Ajouter des AP et baisser leur puissance", "Supprimer le SSID", "Passer tous les AP sur le canal 1"], a: 1, exp: "Plus d'AP à puissance modérée = cellules propres, moins d'interférences." },

    intro: `<p>Un plateau de bureaux nécessite trois points d'accès en 2,4 GHz, alignés le long d'un couloir, avec un léger recouvrement pour permettre le roaming des téléphones VoIP. Établis le plan de fréquences.</p>`,

    solution: `<pre class="pseudo"># Plan de frequences du couloir (3 AP alignes, 2,4 GHz)
