  title: "Conteneurs et réseau (Docker, Kubernetes)",

  theory: `
<h3>1. Le réseau vu par un conteneur</h3>
<p>Un conteneur est un processus isolé qui croit disposer de sa propre machine, y compris de sa propre pile réseau : sa carte virtuelle, ses adresses, ses ports. Sur un même hôte, plusieurs conteneurs doivent pouvoir se parler et, parfois, être joignables de l'extérieur. Docker et Kubernetes automatisent tout ce câblage virtuel, mais les principes restent ceux d'un vrai réseau : adresses IP, ports, routage, NAT.</p>
<h3>2. Le réseau par défaut de Docker : bridge</h3>
<p>Quand tu installes Docker, il crée un réseau par défaut de type <strong>bridge</strong> (« pont »), souvent nommé <code>docker0</code>. C'est un commutateur virtuel : chaque conteneur reçoit une adresse IP privée sur ce pont (par exemple 172.17.0.0/16) et peut parler aux autres conteneurs du même pont. Pour joindre l'extérieur, Docker fait du <strong>NAT</strong> : les paquets sortants prennent l'adresse IP de l'hôte.</p>
<pre class="pseudo"># Publier un port : rendre un conteneur joignable depuis l'hote
docker run -d -p 8080:80 nginx
#            hote:8080  --&gt;  conteneur:80
# Un navigateur sur http://hote:8080 atteint le nginx du conteneur.</pre>
<div class="tip">Docker propose plusieurs pilotes réseau : <strong>bridge</strong> (défaut, isolé sur un hôte), <strong>host</strong> (le conteneur partage directement la pile de l'hôte, sans isolation), et <strong>overlay</strong> (relie des conteneurs sur plusieurs hôtes, façon VXLAN).</div>
<h3>3. Kubernetes : un modèle réseau plus ambitieux</h3>
<p>Kubernetes orchestre des conteneurs regroupés en <strong>pods</strong> (la plus petite unité déployable). Sa règle fondamentale : <strong>chaque pod a sa propre adresse IP</strong> et tous les pods peuvent se joindre entre eux sans NAT, même s'ils sont sur des nœuds différents. Le problème : les pods sont éphémères, leurs adresses changent à chaque redéploiement. On ne peut donc pas s'y connecter directement de façon stable.</p>
<h3>4. Le Service, adresse stable pour des pods instables</h3>
<p>La réponse est l'objet <strong>Service</strong>. Un Service fournit une adresse IP <em>stable</em> (et un nom DNS interne) qui répartit le trafic vers un ensemble de pods sélectionnés par étiquettes. Trois types courants : <strong>ClusterIP</strong> (accessible seulement à l'intérieur du cluster, valeur par défaut), <strong>NodePort</strong> (ouvre un port sur chaque nœud), <strong>LoadBalancer</strong> (demande un répartiteur externe au cloud pour exposer le service sur Internet).</p>
<pre class="pseudo"># Un Service ClusterIP devant 3 pods identiques
Service "web" (ClusterIP 10.96.0.15, DNS: web)
   -> pod web-a (10.244.1.4)
   -> pod web-b (10.244.2.7)
   -> pod web-c (10.244.1.9)
# Les clients internes appellent "web" ; peu importe quels pods vivent.</pre>
<h3>5. Qui branche tout cela ? Le CNI</h3>
<p>Kubernetes ne code pas lui-même le réseau : il délègue à un <strong>plugin CNI</strong> (Container Network Interface). Le CNI est une norme d'interface ; des implémentations comme <strong>Calico</strong>, <strong>Flannel</strong> ou <strong>Cilium</strong> attribuent les IP aux pods et assurent le routage entre nœuds. Changer de CNI, c'est changer la « façon de câbler » le cluster sans toucher aux applications.</p>
<div class="warn">Un conteneur n'est pas une VM : sans configuration de ports publiés (Docker) ou de Service (Kubernetes), l'application reste injoignable depuis l'extérieur, même si elle écoute bien à l'intérieur.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Docker : reseau par defaut = bridge (docker0), IP privees + NAT

#   ClusterIP (interne) | NodePort | LoadBalancer (externe)
# CNI : plugin qui cable le reseau des pods (Calico, Flannel, Cilium)</pre>`,

    { type: "vf", q: "Avec le pilote réseau « host », le conteneur partage directement la pile réseau de l'hôte, sans isolation.", a: true, exp: "Oui : en mode host, pas d'isolation réseau ni de NAT ; il utilise l'hôte tel quel." },
    { type: "qcm", q: "Le rôle d'un Service qui pointe vers 3 pods identiques est de…", opts: ["Supprimer deux pods", "Répartir le trafic entre les pods derrière une IP/nom stables", "Chiffrer les pods", "Créer un nouveau cluster"], a: 1, exp: "Le Service répartit (load-balance) vers les pods sélectionnés par étiquettes." },
    { type: "input", q: "Comment appelle-t-on l'action de rendre un port de conteneur joignable depuis l'hôte (verbe/expression courante) ?", a: ["publier un port", "publier le port", "publier", "publication de port", "port publié"], ph: "une expression", exp: "On « publie » un port avec -p hôte:conteneur." },
    { type: "vf", q: "Sans Service (K8s) ni port publié (Docker), une application en conteneur reste injoignable de l'extérieur même si elle écoute.", a: true, exp: "Oui : l'isolation réseau exige une exposition explicite." }
  ],

      { type: "vf", q: "Le plugin CNI attribue les IP aux pods et assure le routage entre les nœuds.", a: true, exp: "Oui : le CNI (Calico, Flannel, Cilium...) câble le réseau des pods." }
    ],
    solution: `<pre class="pseudo"># Docker (test local) :
docker run -d -p 80:3000 api      # hote:80 -> conteneur:3000

Deployment api (3 replicas)  ->  3 pods, IP ephemeres
Service "api"  (ClusterIP)    ->  IP + DNS stables, interne
Service "api"  (LoadBalancer) ->  IP publique via le cloud, pour Internet
# Le CNI (ex Calico) attribue les IP aux pods et route entre noeuds.</pre>
<p>Docker et Kubernetes réutilisent les fondamentaux du réseau (IP, ports, NAT, DNS) tout en automatisant le câblage des conteneurs éphémères.</p>`
