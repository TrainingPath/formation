  num: 22,
  title: "Le multicast (un vers plusieurs)",
  subtitle: "Envoyer un seul flux à de nombreux destinataires à la fois.",
  theory: `
<h3>1. Trois façons d'adresser un message</h3>
<p>Sur un réseau IP, il existe trois grands modes d'envoi. L'<strong>unicast</strong> (« un vers un ») envoie à un seul destinataire précis : c'est le cas le plus courant (une page web, un mail). Le <strong>broadcast</strong> (« un vers tous ») envoie à tout le monde sur le réseau local. Entre les deux, le <strong>multicast</strong> (« un vers plusieurs ») envoie à un <strong>groupe précis</strong> de destinataires intéressés, ni un seul ni tous.</p>
<pre class="pseudo"># Trois modes d'adressage
Unicast    1 -> 1     un destinataire precis
Broadcast  1 -> tous  tout le reseau local
Multicast  1 -> groupe   seulement ceux qui se sont abonnes</pre>
<h3>2. À quoi sert le multicast ?</h3>
<p>Imagine une chaîne de télévision diffusée en direct à 500 postes. En unicast, la source enverrait 500 copies identiques du même flux : gaspillage énorme de bande passante. En multicast, la source envoie <strong>une seule copie</strong>, et le réseau la <strong>duplique</strong> uniquement là où c'est nécessaire, au plus près des destinataires. Le multicast est idéal pour la <strong>diffusion en direct</strong> (streaming vidéo, radio, télé sur IP), la mise à jour simultanée de nombreux postes, ou la Bourse en temps réel.</p>
<div class="tip">L'economie du multicast vient de la <strong>duplication tardive</strong> : le flux reste unique le plus longtemps possible et n'est copie qu'au dernier embranchement, juste avant les recepteurs. Un arbre de distribution se forme entre la source et les abonnes.</div>
<h3>3. Les adresses multicast : 224.0.0.0/4</h3>
<p>Le multicast utilise une plage d'adresses IP réservée : <strong>224.0.0.0/4</strong>, c'est-à-dire de <strong>224.0.0.0 à 239.255.255.255</strong> (l'ancienne « classe D »). Une adresse multicast ne désigne pas une machine, mais un <strong>groupe</strong>. Un récepteur qui veut recevoir un flux « s'abonne » à l'adresse de groupe correspondante ; la source, elle, envoie simplement vers cette adresse sans connaître la liste des abonnés.</p>
<pre class="pseudo"># Plage multicast : 224.0.0.0/4
De 224.0.0.0 a 239.255.255.255   (ancienne classe D)
# Quelques sous-plages :
224.0.0.0 - 224.0.0.255   usages locaux/protocoles (ex : 224.0.0.1 = tous les hotes)
239.0.0.0/8               "administrativement limite" (usage prive interne)</pre>
<h3>4. IGMP : s'abonner et se désabonner</h3>
<p>Comment un poste dit-il « je veux ce flux » ? Grâce à <strong>IGMP</strong> (« Internet Group Management Protocol »). Un récepteur envoie un message IGMP <em>Join</em> pour rejoindre un groupe, et un <em>Leave</em> pour le quitter. Le routeur local recense ainsi qui veut quoi, et ne transmet le flux multicast que sur les segments où il y a au moins un abonné. IGMP fonctionne entre les hôtes et leur routeur local (sur le LAN).</p>
<pre class="pseudo"># IGMP : dialogue hote <-> routeur local
Hote  --IGMP Join 239.1.1.1-->  Routeur   (je rejoins ce groupe)
Routeur --Query-->  Hotes                 (qui veut encore ce flux ?)
Hote  --IGMP Leave 239.1.1.1--> Routeur   (je quitte ce groupe)
# Le routeur n'envoie le flux QUE la ou il y a des abonnes.</pre>
<div class="warn">Sur un switch, sans mecanisme dedie, un flux multicast serait diffuse comme du broadcast (sur tous les ports). L'<strong>IGMP snooping</strong> permet au switch d'ecouter les messages IGMP et de n'envoyer le flux qu'aux ports reellement abonnes.</div>
<h3>5. Routage multicast (aperçu)</h3>
<p>Entre routeurs, des protocoles dédiés (comme <strong>PIM</strong>) construisent l'<strong>arbre de distribution</strong> qui relie la source aux différents groupes d'abonnés à travers le réseau. L'idée reste la même : un flux unique qui se ramifie et ne se duplique qu'aux embranchements nécessaires. Sur Internet public, le multicast est peu déployé ; il est surtout utilisé dans les réseaux d'entreprise et d'opérateurs (IPTV).</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Unicast (1->1), Broadcast (1->tous), Multicast (1->groupe)
# Multicast = une seule copie, dupliquee au plus pres des recepteurs
# Adresses multicast : 224.0.0.0/4 (224.0.0.0 a 239.255.255.255)
# IGMP = les hotes s'abonnent (Join) / se desabonnent (Leave)
# IGMP snooping = le switch n'envoie le flux qu'aux ports abonnes
# Usage : streaming direct, IPTV, mises a jour de masse</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie « multicast » ?", opts: ["Un vers un", "Un vers tous", "Un vers un groupe précis d'abonnés", "Aucun destinataire"], a: 2, exp: "Multicast = un vers plusieurs : un groupe précis, ni un seul ni tous." },

    { type: "qcm", q: "Pourquoi l'unicast est-il inefficace pour diffuser un direct à 500 postes ?", opts: ["Il est chiffré", "La source doit envoyer 500 copies identiques", "Il utilise le broadcast", "Il n'a pas d'adresse IP"], a: 1, exp: "Unicast = une copie par destinataire = 500 copies redondantes." },
    { type: "input", q: "Comment appelle-t-on le mécanisme qui permet à un switch de n'envoyer le flux qu'aux ports abonnés ?", a: ["igmp snooping", "snooping", "l'igmp snooping", "igmp-snooping"], ph: "IGMP …", exp: "L'IGMP snooping fait écouter les messages IGMP par le switch." },
    { type: "vf", q: "Sans IGMP snooping, un switch tend à diffuser le multicast sur tous ses ports.", a: true, exp: "Oui : il le traite alors comme du broadcast, gaspillant la bande passante." },
    { type: "qcm", q: "Quel message IGMP envoie un hôte pour quitter un groupe ?", opts: ["Join", "Leave", "Query", "Reset"], a: 1, exp: "Leave : l'hôte annonce qu'il quitte le groupe multicast." },
    { type: "qcm", q: "Quel est un usage typique du multicast ?", opts: ["Envoyer un mail à une personne", "Diffuser une chaîne TV/IPTV en direct à de nombreux postes", "Traduire des adresses (NAT)", "Résoudre un nom de domaine"], a: 1, exp: "Le multicast excelle pour la diffusion en direct (streaming, IPTV)." },
    { type: "input", q: "Comment appelle-t-on le mode « un vers tous » sur le réseau local ?", a: ["broadcast", "le broadcast", "diffusion"], ph: "un mot", exp: "Broadcast : envoi à tous les hôtes du réseau local." },
    { type: "vf", q: "IGMP fonctionne entre les hôtes et leur routeur local, sur le LAN.", a: true, exp: "Oui : IGMP gère l'appartenance aux groupes entre hôtes et routeur local." },
    { type: "qcm", q: "L'économie du multicast repose sur…", opts: ["Le chiffrement du flux", "La duplication tardive du flux, au plus près des récepteurs", "L'envoi en double par sécurité", "La suppression des adresses IP"], a: 1, exp: "Le flux reste unique le plus longtemps et n'est copié qu'aux embranchements." },
    { type: "qcm", q: "Entre routeurs, quel type de protocole (ex : PIM) construit l'arbre de distribution ?", opts: ["Un protocole de NAT", "Un protocole de routage multicast", "Un protocole de messagerie", "Un protocole de chiffrement"], a: 1, exp: "PIM et consorts sont des protocoles de routage multicast (arbre de distribution)." }
  ],
  final: {
    title: "Exercice final — Diffuser une vidéo interne à 300 postes",
    intro: `<p>Une entreprise veut diffuser une conférence vidéo en direct à 300 postes sur son réseau, sans saturer les liens. Tu choisis le mode d'envoi et les mécanismes à activer.</p>`,
    questions: [
      { type: "qcm", q: "Quel mode d'envoi choisir pour économiser la bande passante ?", opts: ["Unicast (une copie par poste)", "Broadcast", "Multicast", "Anycast"], a: 2, exp: "Le multicast envoie une copie unique dupliquée près des récepteurs." },
      { type: "input", q: "Dans quelle plage d'adresses (CIDR) choisir l'adresse de groupe ?", a: ["224.0.0.0/4", "224.0.0.0 /4"], ph: "224.x.x.x/?", exp: "224.0.0.0/4 est la plage multicast." },
      { type: "input", q: "Quel protocole les postes utilisent-ils pour s'abonner au flux ?", a: ["igmp", "l'igmp"], ph: "4 lettres", exp: "IGMP : Join pour s'abonner, Leave pour quitter." },
      { type: "vf", q: "Il faut activer l'IGMP snooping sur les switches pour ne pas inonder tous les ports.", a: true, exp: "Oui : sinon le multicast se comporte comme du broadcast sur le LAN." },
      { type: "qcm", q: "Combien de copies la source envoie-t-elle en multicast ?", opts: ["300 copies", "Une seule, dupliquée par le réseau si nécessaire", "Zéro", "Deux par sécurité"], a: 1, exp: "Une copie unique, dupliquée uniquement aux embranchements utiles." }
    ],
    solution: `<pre class="pseudo"># Diffusion video interne a 300 postes
# 1) Mode : MULTICAST (un vers groupe) -> une seule copie a la source
# 2) Adresse de groupe : dans 224.0.0.0/4
#    (ex : 239.1.1.10, plage privee "administrativement limitee")
# 3) Abonnement : les postes envoient IGMP Join vers 239.1.1.10
# 4) Switches : activer l'IGMP snooping -> flux envoye SEULEMENT
#    aux ports abonnes (pas d'inondation type broadcast)
# 5) Routeurs : routage multicast (PIM) construit l'arbre de distribution
# Resultat : 1 flux a la source, duplique au plus pres des 300 postes.</pre>
<p>Le multicast est la réponse : la source émet une seule copie vers une adresse de groupe (dans 224.0.0.0/4). Les postes s'abonnent via IGMP, l'IGMP snooping évite d'inonder les ports non concernés, et le réseau duplique le flux uniquement là où c'est nécessaire. La bande passante est préservée, même avec 300 spectateurs.</p>`
  }
};
