  title: "La QoS : la qualité de service",
  subtitle: "Donner la priorité aux trafics sensibles quand la bande passante devient rare.",
  theory: `
<h3>1. Pourquoi prioriser le trafic</h3>
<p>Par défaut, un réseau traite tous les paquets à la même enseigne : « premier arrivé, premier servi » (en anglais <em>best effort</em>, « au mieux »). Tant qu'il y a de la place, tout va bien. Mais quand un lien sature, ce traitement égalitaire devient injuste : un gros téléchargement peut retarder un appel téléphonique, alors que le téléchargement supporte très bien quelques millisecondes de retard, contrairement à la voix. La <strong>qualité de service</strong> (en anglais <em>Quality of Service</em>, QoS) sert précisément à traiter certains trafics <strong>en priorité</strong>.</p>
<p>Imagine une file d'attente à l'hôpital : le tri (triage) fait passer une urgence vitale avant une consultation de routine. La QoS applique la même logique aux paquets : la voix et la vidéo temps réel passent devant le téléchargement de fichiers.</p>
<h3>2. Les quatre grandeurs à maîtriser</h3>
<p>La QoS agit sur quatre paramètres :</p>
<pre class="pseudo"># Les 4 grandeurs de la QoS
Bande passante : le debit disponible
Delai (latence): le temps de trajet d'un paquet
Gigue (jitter) : la VARIATION du delai d'un paquet a l'autre
Pertes         : les paquets perdus (drops)
# La voix supporte mal delai, gigue et pertes ; un fichier les tolere bien.</pre>
<p>Un appel VoIP a besoin d'un délai faible et d'une gigue faible ; un transfert de fichier ne réclame que du débit et tolère les à-coups. La QoS ajuste ces grandeurs selon la nature du trafic.</p>
<h3>3. Classer et marquer les paquets</h3>
<p>Avant de prioriser, il faut <strong>reconnaître</strong> chaque trafic : c'est la <strong>classification</strong>. Ensuite on <strong>marque</strong> le paquet avec une étiquette de priorité que les équipements suivants respecteront : c'est le <strong>marquage</strong>. Marquer une fois à l'entrée du réseau évite de reclasser à chaque saut. Deux endroits de marquage existent : au niveau 2 (le champ PCP du tag 802.1Q, vu au jour VLAN) et au niveau 3, dans l'en-tête IP.</p>
<h3>4. DiffServ et le champ DSCP</h3>
<p>Le modèle dominant aujourd'hui s'appelle <strong>DiffServ</strong> (en anglais <em>Differentiated Services</em>). Plutôt que de réserver un chemin pour chaque flux, il classe les paquets en <strong>catégories</strong> et applique à chaque catégorie un traitement défini. Le marquage se fait dans un champ de l'en-tête IP appelé <strong>DSCP</strong> (en anglais <em>Differentiated Services Code Point</em>), codé sur <strong>6 bits</strong>. Une valeur DSCP élevée et bien choisie (par exemple la classe « Expedited Forwarding » pour la voix) signale un traitement prioritaire.</p>
<div class="tip">DiffServ = on ne réserve rien flux par flux ; on classe les paquets en catégories via le champ <strong>DSCP</strong> (6 bits dans l'en-tête IP), et chaque catégorie reçoit un traitement défini.</div>
<h3>5. Les files d'attente : le cœur de la priorisation</h3>
<p>C'est dans les <strong>files d'attente</strong> (en anglais <em>queues</em>) de chaque interface que la priorité prend effet. Au lieu d'une seule file « premier arrivé, premier servi », l'équipement crée <strong>plusieurs files</strong> et un <strong>ordonnanceur</strong> (scheduler) décide laquelle servir en premier. On peut réserver une <strong>file prioritaire</strong> (en anglais <em>priority queue</em>) toujours servie en premier pour la voix, et répartir le reste selon des poids. Quand une file déborde, ses paquets sont écartés : mieux vaut perdre un paquet de téléchargement qu'un paquet de voix.</p>
<pre class="pseudo"># Files d'attente sur une interface (schema)
Paquets --classes--&gt; [ File 1 : VOIX (prioritaire) ]--\
                     [ File 2 : VIDEO (poids fort)   ]---+--&gt; Ordonnanceur --&gt; lien
                     [ File 3 : DATA (poids faible)   ]--/
# L'ordonnanceur vide d'abord la file prioritaire, puis les autres selon leur poids.</pre>
<h3>6. Éviter la congestion, pas seulement la subir</h3>
<p>La QoS agit aussi en amont. Le <strong>policing</strong> (contrôle de débit) et le <strong>shaping</strong> (lissage) limitent un trafic trop bavard : le policing jette l'excédent, le shaping le retarde pour lisser les pics. Ces outils protègent les trafics prioritaires en empêchant un flux gourmand de tout envahir.</p>
<div class="warn">La QoS ne crée pas de bande passante : elle la répartit. Sur un lien largement dimensionné, elle n'a presque rien à faire. Elle devient décisive uniquement quand le lien sature : c'est en cas de congestion qu'elle protège les trafics sensibles.</div>
<h3>7. Ce qu'il faut retenir</h3>
<pre class="pseudo"># QoS = prioriser certains trafics quand le lien sature (sinon best effort)

# DiffServ : categories de trafic ; champ DSCP (6 bits) dans l'en-tete IP

    { type: "vf", q: "La QoS crée de la bande passante supplémentaire sur le lien.", a: false, exp: "Non : elle répartit la bande passante existante, elle n'en crée pas." },
    { type: "qcm", q: "Au niveau 2, quel champ du tag 802.1Q porte une priorité utilisable par la QoS ?", opts: ["Le VLAN ID", "Le champ PCP (3 bits)", "Le TPID", "Le FCS"], a: 1, exp: "Le champ PCP (3 bits) du tag 802.1Q porte la priorité de niveau 2." },
    { type: "vf", q: "Sur un lien largement surdimensionné, la QoS a presque toujours un rôle décisif.", a: false, exp: "Non : la QoS devient décisive surtout en cas de congestion, pas quand tout est fluide." }
  ],

      { type: "qcm", q: "Pour empêcher les sauvegardes d'envahir le lien, on peut appliquer…", opts: ["du policing/shaping sur le trafic de sauvegarde", "un chiffrement", "un nouveau VLAN natif", "un root bridge"], a: 0, exp: "Policing/shaping limite le flux de sauvegarde et protège la voix." }
    ],
    solution: `<pre class="pseudo"># Strategie QoS pour proteger la voix
1) Classer : reconnaitre le trafic VoIP
2) Marquer : DSCP prioritaire (ex. classe Expedited Forwarding) a l'entree
3) Files : file PRIORITAIRE pour la voix, servie avant les autres
4) Limiter : policing/shaping sur les sauvegardes pour brider les pics
# En cas de congestion, la voix passe devant : delai et gigue restent faibles.</pre>
<p>La QoS ne crée pas de débit : elle donne la priorité à la voix quand le lien sature, en la marquant (DSCP/DiffServ), en la plaçant dans une file prioritaire et en bridant les gros transferts.</p>`
