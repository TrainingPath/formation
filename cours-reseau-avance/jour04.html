<script>
var DAY = {
  num: 4,
  title: "L'autoconfiguration IPv6 (SLAAC, NDP)",
  subtitle: "Comment une machine se donne une adresse toute seule, sans serveur.",
  theory: `
<h3>1. Le rêve : brancher et ça marche</h3>
<p>En IPv4, pour obtenir une adresse automatiquement, il faut un serveur <strong>DHCP</strong> qui distribue les adresses. IPv6 propose mieux : une machine peut se configurer <strong>toute seule</strong>, sans aucun serveur, grâce au <strong>SLAAC</strong> (<em>StateLess Address AutoConfiguration</em>, autoconfiguration d'adresse sans état). « Sans état » signifie qu'aucun serveur ne tient de registre de qui a quoi : la machine se débrouille avec les informations que lui donne le routeur. Branche un appareil sur un réseau IPv6 correctement configuré, et il obtient une adresse valable en quelques instants.</p>
<h3>2. Le protocole de voisinage : NDP</h3>
<p>Tout repose sur le <strong>NDP</strong> (<em>Neighbor Discovery Protocol</em>, protocole de découverte de voisins). C'est l'outil de dialogue local d'IPv6 : il remplace l'ancien <strong>ARP</strong> d'IPv4 et gère tout ce qui concerne le voisinage sur le lien. NDP s'appuie sur des messages <strong>ICMPv6</strong> et sur les adresses <strong>link-local</strong> (<code>fe80::</code>) vues au jour 3. Il rend quatre grands services :</p>
<pre class="pseudo"># Les messages cles de NDP
RS  (Router Solicitation)     : "Y a-t-il un routeur ?"   (envoye par l'hote)
RA  (Router Advertisement)    : "Je suis routeur, voici le prefixe"  (routeur)
NS  (Neighbor Solicitation)   : "Qui a cette adresse ?"    (resolution)
NA  (Neighbor Advertisement)  : "C'est moi, voici ma MAC"   (reponse)</pre>
<h3>3. Le rôle central du RA (Router Advertisement)</h3>
<p>Le message le plus important pour SLAAC est le <strong>RA</strong> (<em>Router Advertisement</em>, annonce de routeur). Le routeur du réseau émet régulièrement des RA — et répond aussi aux <strong>RS</strong> qu'un nouvel arrivant envoie pour demander « où est le routeur ? ». Le RA contient l'information vitale : le <strong>préfixe réseau</strong> à utiliser (typiquement un <code>/64</code>) et l'adresse du routeur qui servira de passerelle. Muni du préfixe, l'hôte connaît la moitié « réseau » de son adresse ; il doit maintenant fabriquer la moitié « interface ».</p>
<div class="tip">Résumé du dialogue : l'hôte demande (RS), le routeur annonce le préfixe (RA), l'hôte compose son adresse. Le routeur fournit la partie réseau ; la machine choisit sa partie interface. Personne ne tient de registre : c'est bien « sans état ».</div>
<h3>4. Fabriquer l'identifiant d'interface : EUI-64</h3>
<p>Comment l'hôte crée-t-il les 64 derniers bits (l'identifiant d'interface) ? Une méthode historique s'appelle <strong>EUI-64</strong> : elle dérive l'identifiant à partir de l'adresse <strong>MAC</strong> de la carte réseau (48 bits). On insère les 16 bits <code>fffe</code> au milieu de la MAC pour obtenir 64 bits, et on inverse un bit particulier. Résultat : un identifiant unique construit sans serveur. Aujourd'hui, pour des raisons de vie privée (une MAC identifie l'appareil partout), on utilise souvent des <strong>identifiants aléatoires</strong> à la place (adresses temporaires), mais le principe SLAAC reste le même : préfixe du RA + identifiant local.</p>
<pre class="pseudo"># Composition d'une adresse SLAAC
[ prefixe /64 recu dans le RA ] + [ identifiant d'interface /64 ]
        (partie reseau)                   (EUI-64 ou aleatoire)
# Exemple : 2001:db8:ac10:1:: (prefixe)  +  ...:1a2b:3c4d:5e6f (interface)</pre>
<h3>5. Vérifier qu'on est seul : DAD</h3>
<p>Avant d'utiliser son adresse, l'hôte s'assure que <strong>personne d'autre ne l'a déjà</strong>. C'est la <strong>DAD</strong> (<em>Duplicate Address Detection</em>, détection d'adresse dupliquée). La machine envoie un message NS (Neighbor Solicitation) demandant « quelqu'un utilise-t-il cette adresse ? ». Si personne ne répond, l'adresse est libre et devient utilisable ; si quelqu'un répond, il y a conflit et l'adresse est abandonnée. C'est le contrôle de sécurité final de l'autoconfiguration.</p>
<div class="warn">Ne confonds pas SLAAC et DHCPv6. SLAAC est SANS état (pas de serveur qui mémorise). DHCPv6 existe aussi en IPv6 (AVEC état, comme le DHCP d'IPv4) et sert quand on veut un contrôle centralisé ou distribuer d'autres infos (DNS, etc.). Les deux peuvent même coexister.</div>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># SLAAC = autoconfiguration SANS serveur (sans etat)
# NDP  = protocole de voisinage (remplace ARP), via ICMPv6
#   RS -> l'hote demande | RA -> le routeur annonce le prefixe
#   NS/NA -> resolution d'adresse sur le lien
# Adresse = prefixe (du RA)  +  identifiant d'interface (EUI-64 ou aleatoire)
# DAD = verifie que l'adresse n'est pas deja prise avant de l'utiliser</pre>`,
  exercises: [
    { type: "input", q: "Quel sigle (5 lettres) désigne l'autoconfiguration d'adresse IPv6 sans état, sans serveur ?", a: ["slaac"], ph: "5 lettres", exp: "SLAAC : StateLess Address AutoConfiguration." },
    { type: "qcm", q: "Que signifie « sans état » (stateless) dans SLAAC ?", opts: ["L'adresse change tout le temps", "Aucun serveur ne tient de registre de qui a quelle adresse", "L'adresse n'a pas de préfixe", "Le réseau est éteint"], a: 1, exp: "Sans état = aucun serveur ne mémorise l'attribution ; la machine se configure seule." },
    { type: "qcm", q: "Le protocole de découverte de voisins d'IPv6 s'appelle…", opts: ["ARP", "NDP", "DHCP", "DNS"], a: 1, exp: "NDP (Neighbor Discovery Protocol) gère le voisinage en IPv6." },
    { type: "vf", q: "NDP remplace le protocole ARP utilisé en IPv4.", a: true, exp: "Oui : NDP joue en IPv6 le rôle qu'ARP jouait en IPv4 (et bien plus)." },
    { type: "qcm", q: "Quel message le routeur émet-il pour annoncer le préfixe réseau ?", opts: ["RS (Router Solicitation)", "RA (Router Advertisement)", "NS (Neighbor Solicitation)", "NA (Neighbor Advertisement)"], a: 1, exp: "Le RA (Router Advertisement) porte le préfixe et l'adresse de passerelle." },
    { type: "input", q: "Quel message un hôte envoie-t-il pour demander « où est le routeur ? » (deux lettres) ?", a: ["rs", "router solicitation"], ph: "2 lettres", exp: "RS : Router Solicitation, la demande d'un routeur." },
    { type: "qcm", q: "Que contient principalement un RA, utile à SLAAC ?", opts: ["Le mot de passe Wi-Fi", "Le préfixe réseau (souvent /64) et l'adresse de passerelle", "La liste des ports ouverts", "L'heure du serveur"], a: 1, exp: "Le RA fournit le préfixe réseau et le routeur/passerelle." },
    { type: "qcm", q: "EUI-64 sert à…", opts: ["Chiffrer les données", "Fabriquer l'identifiant d'interface à partir de l'adresse MAC", "Compresser l'adresse", "Choisir le routeur"], a: 1, exp: "EUI-64 dérive les 64 bits d'interface depuis la MAC (48 bits)." },
    { type: "input", q: "Quels 16 bits (en hexa) EUI-64 insère-t-il au milieu de la MAC ?", a: ["fffe", "ff fe", "0xfffe"], ph: "4 chiffres hexa", exp: "EUI-64 insère fffe au milieu des 48 bits de la MAC pour obtenir 64 bits." },
    { type: "qcm", q: "Une adresse SLAAC est composée de…", opts: ["Un seul groupe de 16 bits", "Préfixe (du RA) + identifiant d'interface", "Deux préfixes collés", "L'adresse MAC uniquement"], a: 1, exp: "Adresse = préfixe reçu (partie réseau) + identifiant d'interface (partie hôte)." },
    { type: "vf", q: "Pour protéger la vie privée, on utilise souvent des identifiants d'interface aléatoires plutôt qu'EUI-64.", a: true, exp: "Oui : la MAC identifierait l'appareil partout, d'où les adresses temporaires aléatoires." },
    { type: "qcm", q: "Avant d'utiliser son adresse, l'hôte vérifie qu'elle n'est pas déjà prise. Ce mécanisme s'appelle…", opts: ["DHCP", "DAD (Duplicate Address Detection)", "DNS", "NAT"], a: 1, exp: "DAD : Duplicate Address Detection, la détection de doublon." },
    { type: "input", q: "Quel type de message NDP sert à la résolution « qui a cette adresse ? » (deux lettres) ?", a: ["ns", "neighbor solicitation"], ph: "2 lettres", exp: "NS (Neighbor Solicitation) demande qui possède une adresse ; NA répond." },
    { type: "vf", q: "SLAAC et DHCPv6 sont exactement la même chose.", a: false, exp: "Non : SLAAC est sans état ; DHCPv6 est avec état (serveur qui mémorise). Ils peuvent coexister." },
    { type: "qcm", q: "Sur quel type d'adresse et de protocole s'appuie NDP pour dialoguer localement ?", opts: ["Adresses globales et TCP", "Adresses link-local (fe80::) et messages ICMPv6", "Adresses multicast et UDP", "Adresses privées IPv4"], a: 1, exp: "NDP utilise les link-local (fe80::) et des messages ICMPv6." }
  ],
  final: {
    title: "Exercice final — Un portable rejoint le réseau",
    intro: `<p>Le portable de Yanis vient de se connecter à un réseau IPv6 sans DHCP. En quelques secondes, il obtient une adresse globale. Reconstituons, étape par étape, ce qui s'est passé sous le capot grâce à SLAAC et NDP.</p>`,
    questions: [
      { type: "qcm", q: "Étape 1 : le portable cherche le routeur. Quel message envoie-t-il ?", opts: ["RA", "RS (Router Solicitation)", "NA", "DAD"], a: 1, exp: "Il envoie un RS pour solliciter un routeur." },
      { type: "qcm", q: "Étape 2 : le routeur répond avec un RA. Qu'apporte ce RA ?", opts: ["Un mot de passe", "Le préfixe réseau /64 et la passerelle", "La liste des voisins", "Rien d'utile"], a: 1, exp: "Le RA fournit le préfixe et le routeur/passerelle." },
      { type: "input", q: "Étape 3 : le portable fabrique les 64 bits d'interface. Nomme la méthode historique dérivée de la MAC.", a: ["eui-64", "eui64", "eui 64"], ph: "un nom", exp: "EUI-64 dérive l'identifiant d'interface depuis la MAC." },
      { type: "vf", q: "Étape 4 : avant d'utiliser son adresse, le portable lance une DAD pour vérifier qu'elle est libre.", a: true, exp: "Oui : la DAD (via un NS) confirme qu'aucun voisin n'utilise déjà l'adresse." },
      { type: "qcm", q: "Bilan : aucun serveur DHCP n'a été nécessaire parce que…", opts: ["Le réseau est vide", "SLAAC est sans état : le routeur suffit à fournir le préfixe", "Le portable est spécial", "IPv6 interdit DHCP"], a: 1, exp: "SLAAC (sans état) permet la configuration avec le seul RA du routeur." }
    ],
    solution: `<pre class="pseudo"># Le film de la connexion (SLAAC + NDP) :
1) Hote -> RS  : "un routeur ?"
2) Routeur -> RA : prefixe /64 + passerelle
3) Hote compose : prefixe + identifiant d'interface (EUI-64 ou aleatoire)
4) DAD (NS) : "quelqu'un a deja cette adresse ?" -> non -> adresse valide
# Zero serveur DHCP : NDP + RA suffisent. C'est le "sans etat".</pre>
<p>Yanis est en ligne sans configuration manuelle. Demain : faire cohabiter IPv4 et IPv6.</p>`
  }
};
