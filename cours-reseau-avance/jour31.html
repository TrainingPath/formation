<script>
var DAY = {
  num: 31,
  title: "Projet final : architecture réseau d'entreprise",
  subtitle: "Synthétiser tout le parcours pour concevoir le réseau d'une entreprise multi-sites.",
  theory: `
<h3>1. Le cahier des charges</h3>
<p>Voici notre entreprise fil rouge, « Novatek ». Elle a un <strong>siège</strong> (400 postes) et deux <strong>agences</strong> (60 et 30 postes). On y trouve des postes de travail, de la <strong>téléphonie sur IP</strong>, du <strong>Wi-Fi</strong> pour le personnel et pour les invités, une <strong>salle serveurs</strong> au siège et des applications hébergées dans le <strong>cloud</strong>. Objectifs : disponibilité élevée, sécurité par zones, administration centralisée. Ce projet mobilise tout le parcours : adressage IP, VLAN, routage, services, sécurité, Wi-Fi, redondance et cloud.</p>
<h3>2. Adressage et segmentation (jours IP et LAN)</h3>
<p>On adopte un plan d'adressage <strong>hiérarchique</strong> : une plage privée par site, résumable pour le routage. Par exemple 10.1.0.0/16 pour le siège, 10.2.0.0/16 et 10.3.0.0/16 pour les agences. Chaque site se segmente en <strong>VLAN</strong> par usage : utilisateurs, voix, Wi-Fi personnel, Wi-Fi invités (isolé), serveurs, administration. La segmentation isole les usages et limite la portée d'un incident.</p>
<pre class="pseudo"># Plan d'adressage et VLAN (siege, exemple)
Site siege : 10.1.0.0/16
  VLAN 10 Users   10.1.10.0/24
  VLAN 20 Voix    10.1.20.0/24
  VLAN 30 WiFi    10.1.30.0/24
  VLAN 31 Invites 10.1.31.0/24   (isole d'Internet, pas d'acces LAN interne)
  VLAN 40 Servers 10.1.40.0/24
  VLAN 99 Admin   10.1.99.0/24</pre>
<h3>3. Structure LAN et redondance (jour 30)</h3>
<p>Chaque site suit le modèle <strong>accès / distribution / cœur</strong>. Au siège, on double les commutateurs de cœur et de distribution, on relie les commutateurs par de l'<strong>agrégation de liens</strong> (LACP), on active <strong>RSTP</strong> contre les boucles et on porte les passerelles par <strong>VRRP/HSRP</strong>. Objectif : aucun <strong>point unique de panne</strong> (SPOF). Les agences, plus petites, ont une structure simplifiée mais gardent une passerelle et un lien WAN de secours.</p>
<h3>4. Services, WAN et cloud (jours services + cloud)</h3>
<p>Les services <strong>DHCP</strong>, <strong>DNS</strong> et <strong>NTP</strong> sont déployés de façon redondante au siège et répliqués vers les agences. Les sites sont reliés par un <strong>WAN</strong> sécurisé : des tunnels <strong>VPN</strong> chiffrés (IPsec) entre routeurs, souvent doublés d'un accès de secours. Les applications cloud résident dans un <strong>VPC</strong> découpé en subnets publics/privés, relié à l'entreprise par VPN, avec des <strong>security groups</strong> restrictifs.</p>
<pre class="pseudo"># Interconnexion multi-sites + cloud
[Siege]===VPN IPsec===[Agence 1]
   ||  \\                 
   ||   ===VPN IPsec===[Agence 2]
   ||
   ===VPN IPsec===[VPC Cloud : subnets publics/prives, security groups]</pre>
<h3>5. Sécurité et supervision (jours sécurité + observabilité)</h3>
<p>On applique le <strong>moindre privilège</strong> : pare-feu entre zones (utilisateurs, serveurs, invités, DMZ, cloud), VLAN invités isolé, chiffrement <strong>WPA2/WPA3</strong> sur le Wi-Fi, et administration sur un VLAN dédié. La supervision combine <strong>SNMP</strong> (état et métriques), <strong>NetFlow</strong> (composition du trafic) et une pile logs, le tout affiché sur des <strong>tableaux de bord</strong> avec alertes. Enfin, les configurations sont gérées en <strong>IaC</strong> (Ansible), versionnées et idempotentes.</p>
<div class="warn">Un projet réussi tient dans sa cohérence globale ET dans sa documentation : schémas physique et logique, plan d'adressage, plan de VLAN, matrice de flux et procédures de reprise. Sans cela, rien n'est exploitable.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Un reseau d'entreprise = assemblage coherent de tout le parcours :
# Adressage hierarchique + VLAN par usage (segmentation)
# LAN accès/distribution/cœur, redondant (LACP, RSTP, VRRP/HSRP) -> pas de SPOF
# Services DHCP/DNS/NTP redondants ; WAN via VPN IPsec inter-sites
# Cloud : VPC, subnets public/prive, security groups, relie par VPN
# Securite : moindre privilege, pare-feu par zone, WPA2/WPA3, VLAN admin
# Supervision : SNMP + NetFlow + logs + dashboards/alertes ; config en IaC
# Et TOUJOURS : documenter (schemas, plans, matrice de flux)</pre>`,
  exercises: [
    { type: "qcm", q: "Quel principe guide le plan d'adressage d'un réseau multi-sites ?", opts: ["Adresses aléatoires", "Un plan hiérarchique et résumable, une plage par site", "Une seule adresse pour tout", "Uniquement des IP publiques"], a: 1, exp: "Un plan hiérarchique par site facilite le routage (agrégation) et la lecture." },
    { type: "qcm", q: "Pourquoi isoler le VLAN Wi-Fi invités ?", opts: ["Pour accélérer Internet", "Pour empêcher les invités d'atteindre le LAN interne", "Pour désactiver le DNS", "Pour supprimer la voix"], a: 1, exp: "Le VLAN invités isolé protège le réseau interne d'accès non maîtrisés." },
    { type: "input", q: "Quel protocole assure une passerelle redondante entre deux routeurs ? (un sigle)", a: ["vrrp", "hsrp", "vrrp/hsrp", "vrrp ou hsrp"], ph: "un sigle", exp: "VRRP (ou HSRP) : une IP de passerelle virtuelle portée par deux routeurs." },
    { type: "qcm", q: "Comment relier de façon sécurisée le siège et les agences via Internet ?", opts: ["En clair, sans protection", "Par des tunnels VPN chiffrés (IPsec)", "En WPA2 uniquement", "Par NetFlow"], a: 1, exp: "Des VPN IPsec chiffrent le trafic inter-sites sur Internet." },
    { type: "vf", q: "On peut éliminer les points uniques de panne en doublant équipements, liens et alimentations.", a: true, exp: "Oui : la redondance élimine les SPOF." },
    { type: "input", q: "Comment appelle-t-on le réseau virtuel privé loué chez un fournisseur de cloud ? (un sigle)", a: ["vpc"], ph: "un sigle", exp: "Le VPC (Virtual Private Cloud) isole votre réseau dans le cloud." },
    { type: "qcm", q: "Quels VLAN typiques crée-t-on pour segmenter par usage ?", opts: ["Un seul VLAN pour tout", "Users, Voix, Wi-Fi, Invités, Serveurs, Admin", "Uniquement Admin", "Aucun VLAN"], a: 1, exp: "On sépare les usages en VLAN distincts pour isoler et sécuriser." },
    { type: "vf", q: "Le chiffrement WPA2/WPA3 protège le Wi-Fi de l'entreprise.", a: true, exp: "Oui : WPA2/WPA3 chiffrent les communications sans fil." },
    { type: "qcm", q: "Quel duo d'outils permet de voir l'état (métriques) ET la composition du trafic ?", opts: ["DHCP et DNS", "SNMP et NetFlow", "STP et LACP", "WPA2 et IPsec"], a: 1, exp: "SNMP donne l'état/les métriques, NetFlow la composition (flux) du trafic." },
    { type: "input", q: "Quel outil d'automatisation, idempotent et sans agent, sert à gérer les configurations en IaC ? (un mot)", a: ["ansible"], ph: "un outil", exp: "Ansible : sans agent, playbooks YAML, idempotent." },
    { type: "vf", q: "Un réseau d'entreprise bien conçu peut se passer de documentation.", a: false, exp: "Non : sans schémas ni plans, il devient ingérable dès le premier incident." },
    { type: "qcm", q: "Où placer les serveurs internes sensibles au siège ?", opts: ["Dans le VLAN invités", "Dans un VLAN serveurs dédié, protégé par pare-feu", "Sur Internet en direct", "Dans le Wi-Fi invités"], a: 1, exp: "Un VLAN serveurs isolé et pare-feu applique le moindre privilège." },
    { type: "qcm", q: "Quel modèle structure le LAN de chaque site ?", opts: ["Un seul commutateur plat", "Accès / distribution / cœur", "Uniquement le cloud", "Aucune structure"], a: 1, exp: "Le modèle hiérarchique accès/distribution/cœur structure chaque site." },
    { type: "input", q: "Comment appelle-t-on le fait de combiner plusieurs liens physiques en un lien logique résilient ? (sigle ou deux mots)", a: ["lacp", "agrégation de liens", "agregation de liens", "agrégation", "agregation"], ph: "un sigle", exp: "LACP / agrégation de liens : résilience et débit accru." },
    { type: "vf", q: "Dans le VPC cloud, on découpe en subnets publics et privés protégés par des security groups.", a: true, exp: "Oui : subnets public/privé + security groups restrictifs isolent les ressources." }
  ],
  final: {
    title: "Exercice final — Valider l'architecture de Novatek",
    intro: `<p>L'architecture de Novatek est prête : siège et deux agences, VLAN par usage, LAN redondant, VPN inter-sites, VPC cloud et supervision. On vérifie la cohérence des grands choix avant validation.</p>`,
    questions: [
      { type: "qcm", q: "Le siège (10.1.0.0/16) et l'agence 1 (10.2.0.0/16) sont reliés par…", opts: ["un simple câble", "un VPN IPsec chiffré via Internet", "le Wi-Fi invités", "rien"], a: 1, exp: "Les sites distants se relient par VPN IPsec sur Internet." },
      { type: "input", q: "Pour que la passerelle du VLAN Users survive à la panne d'un routeur, on active… (un sigle)", a: ["vrrp", "hsrp", "vrrp/hsrp", "vrrp ou hsrp"], ph: "un sigle", exp: "VRRP/HSRP fournit une passerelle redondante transparente." },
      { type: "qcm", q: "Le Wi-Fi invités (VLAN 31) doit…", opts: ["accéder à tous les serveurs", "être isolé du LAN interne, avec sortie Internet contrôlée", "porter la téléphonie", "remplacer l'admin"], a: 1, exp: "Le VLAN invités est isolé du LAN interne, avec un accès Internet maîtrisé." },
      { type: "vf", q: "Les applications cloud vivent dans un VPC, bases de données en subnet privé, relié à l'entreprise par VPN.", a: true, exp: "Oui : subnet privé pour les bases, VPN pour l'interconnexion sécurisée." },
      { type: "qcm", q: "Pour détecter une saturation AVANT la plainte des utilisateurs, on met en place…", opts: ["rien", "des dashboards SNMP/NetFlow avec seuils et alertes", "un seul VLAN", "un mot de passe plus long"], a: 1, exp: "Métriques + flux + alertes sur seuils permettent la détection proactive." }
    ],
    solution: `<pre class="pseudo"># Novatek - synthese de l'architecture validee :
# Adressage : 10.1/16 siege, 10.2/16 et 10.3/16 agences (hierarchique)
# VLAN      : 10 Users | 20 Voix | 30 WiFi | 31 Invites (isole) | 40 Servers | 99 Admin
# LAN       : acces/distribution/coeur, redonde (LACP, RSTP, VRRP/HSRP) -> pas de SPOF
# Services  : DHCP/DNS/NTP redondants, repliques vers les agences
# WAN       : VPN IPsec chiffres entre les 3 sites (+ lien de secours)
# Cloud     : VPC, subnets public/prive, security groups, relie par VPN
# Securite  : moindre privilege, pare-feu par zone, WPA2/WPA3, VLAN admin dedie
# Supervision: SNMP + NetFlow + logs -> dashboards + alertes sur seuils
# Gestion   : configurations en IaC (Ansible), versionnees, idempotentes
# Livrables : schemas physique/logique, plan IP, plan VLAN, matrice de flux</pre>
<p>Félicitations : tu viens d'assembler l'intégralité du parcours réseau en une architecture cohérente, redondante, sécurisée et supervisée. C'est exactement le travail d'un architecte réseau.</p>`
  }
};
</script>
