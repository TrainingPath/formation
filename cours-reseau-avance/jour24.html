  theory: `
<h3>1. Le réseau traditionnel : chaque équipement décide seul</h3>
<p>Dans un réseau classique, chaque routeur ou commutateur est une boîte autonome qui contient deux fonctions mêlées. D'un côté, il <strong>décide</strong> des chemins (calcul des routes, protocoles) : c'est le <strong>plan de contrôle</strong> (« control plane »). De l'autre, il <strong>transmet</strong> concrètement les paquets à toute vitesse : c'est le <strong>plan de données</strong> (« data plane »). Comme chaque équipement embarque son propre cerveau, configurer un grand réseau signifie se connecter à des centaines de boîtes une par une. C'est lent, hétérogène et sujet aux erreurs.</p>
<h3>2. L'idée du SDN : séparer les deux plans</h3>
<p>Le <strong>SDN</strong> (« Software-Defined Networking », réseau défini par logiciel) part d'une idée forte : <strong>séparer le plan de contrôle du plan de données</strong>. On retire l'intelligence des équipements pour la centraliser dans un logiciel unique. Les commutateurs ne font plus que transmettre les paquets selon des règles qu'on leur pousse ; ils deviennent de simples exécutants, les « muscles ». La décision, elle, remonte à un cerveau central : le <strong>contrôleur</strong>.</p>
<pre class="pseudo"># Reseau classique vs SDN
Classique : chaque equipement = controle (cerveau) + donnees (muscles)
SDN       : controle CENTRALISE dans un controleur logiciel
            equipements = plan de donnees seulement (execution)</pre>
<div class="tip">Analogie : dans le reseau classique, chaque carrefour a son propre agent qui improvise. En SDN, une tour de controle unique voit tout le trafic et dicte a chaque carrefour quoi faire.</div>
<h3>3. Le contrôleur, cerveau centralisé</h3>
<p>Le <strong>contrôleur SDN</strong> a une vue d'ensemble de tout le réseau. Il calcule les chemins et distribue les règles de transmission à chaque commutateur. Comme il connaît la topologie globale, il peut prendre de meilleures décisions qu'un équipement isolé, réagir vite à une panne et appliquer une politique cohérente partout. On configure le réseau <strong>une seule fois, au niveau du contrôleur</strong>, au lieu de boîte par boîte.</p>
<pre class="pseudo"># Architecture SDN en trois etages
[ Applications ]  (securite, equilibrage, automatisation)
       | API "northbound"
[ Controleur SDN ]  (cerveau : vue globale, decisions)
       | protocole "southbound" (ex : OpenFlow)
[ Commutateurs ]  (plan de donnees : transmettre les paquets)</pre>
<h3>4. OpenFlow : parler aux équipements</h3>
<p>Pour que le contrôleur pilote les commutateurs, il faut un langage commun. <strong>OpenFlow</strong> est le protocole historique du SDN : il permet au contrôleur d'installer, dans chaque commutateur, des <strong>règles de flux</strong> (« flow entries ») disant « tel type de paquet -> telle action (transmettre sur ce port, jeter, modifier…) ». Le commutateur applique ces règles à grande vitesse sans avoir à réfléchir. On appelle « southbound » l'interface contrôleur -> équipements, et « northbound » l'interface applications -> contrôleur.</p>
<div class="warn">Centraliser le controle cree un point critique : si le controleur tombe, le pilotage s'arrete. En pratique on deploie plusieurs controleurs redondants et les equipements gardent des regles pour continuer a transmettre pendant une coupure.</div>
<h3>5. Ce que le SDN apporte</h3>
<p>Le SDN rend le réseau <strong>programmable</strong> : on peut l'automatiser par logiciel, l'adapter en quelques secondes à la demande, et déployer des politiques globales de façon cohérente. C'est un pilier des grands centres de données et du cloud, où des milliers de commutateurs doivent être orchestrés ensemble. Des applications posées au-dessus du contrôleur (sécurité, équilibrage de charge, ingénierie de trafic) peuvent piloter le réseau comme n'importe quel logiciel.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># SDN = Software-Defined Networking = reseau programmable

# Les commutateurs = plan de donnees : ils transmettent selon les regles recues
# OpenFlow = protocole southbound (controleur -> equipements)
# Avantages : configuration centralisee, automatisation, vue globale
# Risque : le controleur est critique -> redondance necessaire</pre>`,

    solution: `<pre class="pseudo"># Architecture SDN cible du datacenter
[ Applications ]  automatisation, securite, equilibrage de charge

[ Milliers de commutateurs ]  plan de donnees : transmettre seulement
# Points cles :
# - Plan de controle SEPARE du plan de donnees
# - Configuration UNE fois au controleur (plus boite par boite)
# - Reseau programmable -> changements en secondes, automatises
# - Controleur = critique -> plusieurs controleurs redondants</pre>
<p>Le SDN sépare le plan de contrôle du plan de données : l'intelligence remonte dans un contrôleur central qui a la vue globale et pousse les règles aux commutateurs via OpenFlow. Les équipements ne font plus que transmettre. On configure le réseau une seule fois, on l'automatise, et on gagne en cohérence et en rapidité. Comme le contrôleur devient critique, on le déploie en plusieurs exemplaires redondants.</p>`
