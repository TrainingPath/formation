<script>
var DAY = {
  num: 8,
  title: "Les protocoles à état de liens (OSPF)",
  subtitle: "Chaque routeur dessine la carte complète, puis calcule le plus court chemin.",
  theory: `
<h3>1. Une autre philosophie</h3>
<p>Là où RIP se contente d'écouter les rumeurs de ses voisins, un protocole à <strong>état de liens</strong> (<em>link state</em>) vise beaucoup plus haut : donner à <strong>chaque routeur</strong> une <strong>carte complète</strong> du réseau. Le représentant majeur est <strong>OSPF</strong> (<em>Open Shortest Path First</em>). L'idée : au lieu de dire « je connais tel réseau à telle distance », chaque routeur décrit précisément <strong>l'état de ses propres liens</strong> (à qui il est connecté, avec quel coût) et diffuse cette description à <strong>tout le monde</strong>. En rassemblant toutes ces descriptions, chaque routeur reconstitue le plan entier du réseau.</p>
<h3>2. La base de données topologique</h3>
<p>Chaque routeur OSPF collecte les descriptions de liens (les <em>LSA</em>, Link State Advertisements) émises par tous les autres et les range dans une <strong>base de données topologique</strong> (<em>link-state database</em>). Point crucial : dans une même zone, <strong>tous les routeurs possèdent la même base</strong>, donc la même carte. C'est la grande différence avec RIP : un routeur OSPF ne fait pas confiance aveuglément à un voisin, il possède lui-même la vue d'ensemble et raisonne dessus.</p>
<pre class="pseudo"># RIP vs OSPF : ce que "sait" un routeur
RIP  : "mes voisins m'ont dit que tel reseau est a X sauts" (vue partielle)
OSPF : "j'ai la carte complete de la zone" (base topologique identique
        pour tous les routeurs de la zone)</pre>
<div class="tip">Analogie : RIP, c'est demander son chemin à des passants successifs ; OSPF, c'est avoir la carte routière complète sous les yeux et tracer soi-même l'itinéraire optimal.</div>
<h3>3. L'algorithme de Dijkstra (SPF)</h3>
<p>Une fois la carte en main, comment trouver le meilleur chemin ? OSPF applique l'<strong>algorithme de Dijkstra</strong>, aussi appelé <strong>SPF</strong> (<em>Shortest Path First</em>, « le plus court chemin d'abord »). À partir de lui-même comme racine, chaque routeur calcule l'<strong>arbre des plus courts chemins</strong> vers tous les réseaux, en additionnant les <strong>coûts</strong> des liens. Le coût OSPF n'est pas un simple nombre de sauts : il dépend de la <strong>bande passante</strong> (un lien rapide a un coût faible, donc est préféré). OSPF choisit donc des chemins de meilleure qualité que RIP, pas seulement les plus courts en nombre de routeurs.</p>
<pre class="pseudo"># OSPF : carte -> Dijkstra (SPF) -> arbre des plus courts chemins
1) Rassembler tous les LSA -> base topologique (la carte)
2) Lancer Dijkstra depuis soi-meme (racine)
3) Obtenir le plus court chemin (cout mini) vers chaque reseau
# Cout base sur la bande passante -> les liens rapides sont favorises.</pre>
<h3>4. La convergence rapide</h3>
<p>Quand un lien change d'état, le routeur concerné diffuse <strong>immédiatement</strong> un nouveau LSA (pas d'attente de 30 secondes comme RIP). Tous les routeurs mettent à jour leur base et relancent Dijkstra. Résultat : OSPF <strong>converge beaucoup plus vite</strong> que RIP et évite mieux les boucles, car chacun décide à partir d'une carte cohérente plutôt que de rumeurs propagées lentement. C'est pourquoi OSPF est le standard des réseaux d'entreprise de grande taille.</p>
<h3>5. Les aires (areas) et le backbone</h3>
<p>Sur un très grand réseau, faire tourner Dijkstra sur une carte géante serait coûteux. OSPF découpe donc le réseau en <strong>aires</strong> (<em>areas</em>). Chaque aire a sa propre base topologique détaillée ; entre aires, on n'échange qu'un résumé. Cela réduit la taille des calculs et isole les changements (un incident dans une aire ne force pas tout le réseau à recalculer). Une aire est spéciale : l'<strong>aire 0</strong>, appelée <strong>backbone</strong> (dorsale). <strong>Toutes les autres aires doivent se connecter à l'aire 0</strong> : elle sert de colonne vertébrale par laquelle transite le trafic inter-aires.</p>
<pre class="pseudo"># Hierarchie OSPF
        [ Aire 0 = BACKBONE (dorsale) ]
         /            |            \\
     Aire 1        Aire 2        Aire 3
# Chaque aire se connecte a l'aire 0.
# Detail complet dans l'aire, resume entre aires -> calculs alleges.</pre>
<div class="warn">Ne confonds pas les deux « niveaux » d'OSPF. Dans une aire : base topologique identique + Dijkstra sur le détail. Entre aires : on ne partage qu'un résumé, et tout passe par l'aire 0. Oublier de rattacher une aire au backbone est une erreur de conception classique.</div>
<h3>6. Ce qu'il faut retenir aujourd'hui</h3>
<pre class="pseudo"># OSPF = etat de liens : chacun a la CARTE COMPLETE (base topologique).
# Calcul : algorithme de DIJKSTRA (SPF) -> plus court chemin par le COUT.
# Cout base sur la bande passante (pas juste le nombre de sauts).
# Convergence RAPIDE (LSA envoye tout de suite, pas d'attente periodique).
# AIRES : decoupage ; l'aire 0 (backbone) relie toutes les autres.</pre>`,
  exercises: [
    { type: "qcm", q: "Sur quelle idée repose un protocole à état de liens comme OSPF ?", opts: ["Écouter les rumeurs des voisins", "Donner à chaque routeur une carte complète du réseau", "Configurer chaque route à la main", "Compter uniquement les sauts"], a: 1, exp: "État de liens : chacun décrit ses liens et se construit la carte complète." },

    { type: "input", q: "Quel algorithme OSPF utilise-t-il pour calculer les plus courts chemins ?", a: ["dijkstra", "l'algorithme de dijkstra", "algorithme de dijkstra", "spf"], ph: "un nom", exp: "OSPF applique l'algorithme de Dijkstra, aussi appelé SPF." },
    { type: "qcm", q: "Sur quoi le coût d'un lien OSPF est-il principalement basé ?", opts: ["Le nombre de sauts", "La bande passante du lien", "Le nombre de routeurs traversés", "La charge CPU du routeur"], a: 1, exp: "Le coût OSPF dépend de la bande passante : un lien rapide a un coût faible." },
    { type: "vf", q: "Comme RIP, OSPF ne regarde que le nombre de routeurs traversés.", a: false, exp: "Non : OSPF utilise un coût basé sur la bande passante, pas un simple compte de sauts." },
    { type: "qcm", q: "Pourquoi OSPF converge-t-il plus vite que RIP ?", opts: ["Il attend plus longtemps", "Il diffuse immédiatement un LSA au moindre changement et recalcule sur une carte cohérente", "Il utilise moins de routeurs", "Il ne recalcule jamais"], a: 1, exp: "Pas d'attente périodique : diffusion immédiate et recalcul sur la carte complète." },
    { type: "input", q: "Comment appelle-t-on le découpage d'un grand réseau OSPF en sous-ensembles pour alléger les calculs ?", a: ["les aires", "aires", "les areas", "areas", "des aires", "une aire"], ph: "un mot", exp: "Les aires (areas) segmentent le réseau et isolent les changements." },
    { type: "qcm", q: "Quelle aire joue le rôle de dorsale (backbone) dans OSPF ?", opts: ["L'aire 1", "L'aire 10", "L'aire 0", "L'aire 255"], a: 2, exp: "L'aire 0 est le backbone auquel toutes les autres aires se rattachent." },
    { type: "vf", q: "Toutes les aires OSPF doivent se connecter à l'aire 0 (backbone).", a: true, exp: "Oui : l'aire 0 est la colonne vertébrale par laquelle transite le trafic inter-aires." },
    { type: "qcm", q: "Entre deux aires OSPF, qu'échange-t-on ?", opts: ["Toute la base topologique détaillée", "Seulement un résumé", "Rien du tout", "Les adresses MAC"], a: 1, exp: "Le détail reste dans l'aire ; entre aires on n'échange qu'un résumé." },
    { type: "qcm", q: "Que fait un routeur OSPF après avoir rassemblé tous les LSA ?", opts: ["Il attend 30 secondes", "Il lance Dijkstra depuis lui-même pour bâtir l'arbre des plus courts chemins", "Il efface sa table", "Il envoie un broadcast IPv4"], a: 1, exp: "Carte complète, puis Dijkstra (SPF) depuis soi-même comme racine." },
    { type: "input", q: "Comment nomme-t-on les messages qui décrivent l'état des liens et alimentent la base topologique (trois lettres) ?", a: ["lsa", "lsas"], ph: "3 lettres", exp: "Les LSA (Link State Advertisements) portent la description des liens." },
    { type: "vf", q: "OSPF est mieux adapté que RIP aux réseaux d'entreprise de grande taille.", a: true, exp: "Oui : convergence rapide, coût basé sur la bande passante et découpage en aires." }
  ],
  final: {
    title: "Exercice final — Concevoir un réseau OSPF",
    intro: `<p>Inès conçoit le réseau d'un grand campus avec OSPF. Elle doit organiser les aires, comprendre le calcul des chemins et justifier le choix d'OSPF plutôt que RIP. Aidons-la à valider sa conception.</p>`,
    questions: [
      { type: "qcm", q: "Inès segmente le campus en plusieurs aires. À quoi doivent-elles toutes se connecter ?", opts: ["À l'aire 255", "À l'aire 0 (backbone)", "À un serveur DNS", "À RIP"], a: 1, exp: "Toutes les aires se rattachent à l'aire 0, la dorsale." },
      { type: "input", q: "Quel algorithme chaque routeur lancera-t-il sur sa base topologique pour trouver les chemins ?", a: ["dijkstra", "l'algorithme de dijkstra", "spf"], ph: "un nom", exp: "Dijkstra (SPF) calcule l'arbre des plus courts chemins." },
      { type: "vf", q: "Dans une même aire, tous les routeurs d'Inès auront la même base topologique.", a: true, exp: "Oui : même carte pour tous les routeurs de l'aire, d'où des décisions cohérentes." },
      { type: "qcm", q: "Inès justifie OSPF plutôt que RIP notamment parce que le coût OSPF tient compte de…", opts: ["La charge instantanée des routeurs", "La bande passante des liens", "Le seul nombre de sauts", "Le nombre de VLAN configurés"], a: 1, exp: "OSPF favorise les liens rapides via un coût basé sur la bande passante." },
      { type: "qcm", q: "Autre argument d'Inès en faveur d'OSPF : sa convergence est…", opts: ["Plus lente que RIP", "Plus rapide que RIP", "Identique à RIP", "Inexistante"], a: 1, exp: "OSPF diffuse ses LSA immédiatement et converge plus vite que RIP." }
    ],
    solution: `<pre class="pseudo"># La conception d'Ines :

#
