var DAY = {
  num: 29,
  title: "Observabilité et métrologie",
  subtitle: "Voir ce qui se passe dans le réseau : métriques, logs, traces.",
  theory: `
<h3>1. Surveiller n'est pas observer</h3>
<p>La <strong>surveillance</strong> (monitoring) répond à une question connue d'avance : « ce lien est-il UP ? le débit dépasse-t-il 80 % ? ». L'<strong>observabilité</strong> va plus loin : c'est la capacité à comprendre un état interne <em>inconnu à l'avance</em> à partir de ce que le système émet. Un réseau observable te laisse répondre à des questions que tu n'avais pas prévues, en croisant plusieurs sources de données.</p>
<h3>2. Les trois piliers de l'observabilité</h3>
<p>On distingue trois types de signaux complémentaires. Les <strong>métriques</strong> (metrics) sont des mesures numériques dans le temps : débit, latence, taux d'erreurs, température. Les <strong>logs</strong> (journaux) sont des messages textuels horodatés décrivant des événements : « interface Gi0/1 down à 14h03 ». Les <strong>traces</strong> suivent le cheminement complet d'une requête à travers plusieurs composants, utiles pour localiser où le temps se perd. Métriques pour <em>quoi</em>, logs pour <em>quand/quoi précisément</em>, traces pour <em>où</em>.</p>
<div class="tip">Analogie médicale : les métriques sont le pouls et la tension (chiffres suivis en continu), les logs sont le carnet de bord des symptômes, les traces sont le parcours du patient de service en service.</div>
<h3>3. SNMP : interroger les équipements</h3>
<p><strong>SNMP</strong> (Simple Network Management Protocol) est le protocole historique pour collecter des métriques sur routeurs, commutateurs et serveurs. Un <strong>manager</strong> interroge des <strong>agents</strong> installés sur les équipements et lit des valeurs identifiées par des <strong>OID</strong> (Object IDentifier) rangés dans une <strong>MIB</strong> (Management Information Base). SNMP fonctionne surtout par <em>polling</em> (interrogation régulière), avec en plus des <strong>traps</strong> : des alertes que l'agent envoie spontanément lors d'un incident.</p>
<pre class="pseudo"># SNMP : le manager interroge, l'agent repond
Manager  --(GET oid ifInOctets)--&gt;  Agent (routeur)
Manager  &lt;--(valeur : 1048576)----   Agent
# Trap : alerte spontanee de l'agent
Agent  --(TRAP linkDown Gi0/1)--&gt;  Manager</pre>
<h3>4. NetFlow : qui parle à qui ?</h3>
<p>SNMP dit <em>combien</em> il passe de trafic ; <strong>NetFlow</strong> (créé par Cisco) dit <em>de quoi</em> il est fait. NetFlow résume le trafic en <strong>flux</strong> : chaque flux regroupe les paquets partageant les mêmes IP source/destination, ports et protocole. On obtient ainsi une comptabilité précise (« 60 % du trafic va vers ce serveur sur le port 443 »), essentielle pour la capacité, la facturation et la sécurité. Des variantes existent : IPFIX (standard), sFlow (par échantillonnage).</p>
<h3>5. Tableaux de bord et alertes</h3>
<p>Toutes ces données convergent vers des <strong>tableaux de bord</strong> (dashboards) qui les affichent en graphiques lisibles, et vers un moteur d'<strong>alertes</strong> qui prévient quand un seuil est franchi. Une chaîne moderne typique : un collecteur récupère les métriques, une base de données temporelle les stocke, un outil de visualisation trace les courbes, et l'alerting notifie l'astreinte. L'objectif : détecter <em>avant</em> que l'utilisateur ne se plaigne.</p>
<div class="warn">Collecter sans seuils ni alertes ne sert à rien : personne ne regarde des courbes en permanence. Définis des seuils pertinents et évite le « bruit » d'alertes qui finit par être ignoré (fatigue d'alerte).</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Observabilite : comprendre un etat interne inconnu a l'avance
# 3 piliers : METRIQUES (chiffres/temps) | LOGS (evenements) | TRACES (parcours)
# SNMP : manager interroge des agents (OID/MIB) ; polling + traps
# NetFlow : trafic resume en FLUX (qui parle a qui, quel port)
# Dashboards + alertes : visualiser et prevenir avant la panne</pre>`,

    { type: "qcm", q: "Quels sont les trois piliers de l'observabilité ?", opts: ["IP, TCP, UDP", "Métriques, logs, traces", "SNMP, NetFlow, sFlow", "Web, mail, DNS"], a: 1, exp: "Les trois piliers sont les métriques, les logs et les traces." },

    { type: "input", q: "Comment appelle-t-on l'écran qui affiche les données réseau sous forme de graphiques ? (un mot, français ou anglais)", a: ["tableau de bord", "dashboard", "un tableau de bord", "un dashboard", "tableaux de bord"], ph: "un mot", exp: "Le tableau de bord (dashboard) visualise les données." },
    { type: "vf", q: "Les traces servent surtout à suivre le cheminement complet d'une requête à travers plusieurs composants.", a: true, exp: "Oui : les traces localisent où le temps ou l'erreur se produit." },
    { type: "qcm", q: "Que désigne une MIB en SNMP ?", opts: ["Une base décrivant les objets (valeurs) interrogeables via des OID", "Un câble réseau", "Un pare-feu", "Un protocole de routage"], a: 0, exp: "La MIB (Management Information Base) organise les OID interrogeables." },
    { type: "qcm", q: "Pourquoi éviter de multiplier les alertes non pertinentes ?", opts: ["Elles coûtent de l'électricité", "Elles créent une fatigue d'alerte et finissent ignorées", "Elles accélèrent le réseau", "Elles chiffrent les logs"], a: 1, exp: "Trop d'alertes = fatigue d'alerte, et les vraies passent inaperçues." },
    { type: "input", q: "Standard ouvert dérivé de NetFlow pour l'export de flux (un sigle).", a: ["ipfix"], ph: "un sigle", exp: "IPFIX est la version normalisée (IETF) de l'export de flux." },
    { type: "vf", q: "Collecter des données sans définir de seuils ni d'alertes suffit à détecter les incidents.", a: false, exp: "Non : sans seuils/alertes, personne ne surveille les courbes en continu." }
  ],
  final: {
    title: "Exercice final — Diagnostiquer une lenteur applicative",
    intro: `<p>Les utilisateurs se plaignent de lenteurs sur une application interne. L'équipe réseau dispose de SNMP, NetFlow et d'une pile logs/traces. Elle veut trouver la cause méthodiquement.</p>`,
    questions: [
      { type: "qcm", q: "Pour voir si un lien est saturé (débit proche du maximum), quelle source consulter d'abord ?", opts: ["Les traces", "Les métriques (via SNMP)", "Le mot de passe du routeur", "Le DNS"], a: 1, exp: "Les métriques SNMP montrent l'utilisation des liens dans le temps." },
      { type: "input", q: "Pour savoir QUEL trafic sature le lien (quelles IP/ports), quelle technologie utiliser ? (un mot)", a: ["netflow", "net flow"], ph: "une techno", exp: "NetFlow décompose le trafic en flux : on voit qui consomme la bande passante." },
      { type: "qcm", q: "Pour localiser précisément où une requête perd du temps entre plusieurs services, on regarde…", opts: ["les traces", "la température", "les traps SNMP", "les OID"], a: 0, exp: "Les traces suivent la requête composant par composant." },
      { type: "vf", q: "Un log horodaté « interface Gi0/1 flapping à 14h03 » aide à corréler l'incident avec la plainte des utilisateurs.", a: true, exp: "Oui : les logs datés permettent la corrélation temporelle." },
      { type: "qcm", q: "Quel dispositif aurait pu prévenir l'équipe AVANT la plainte des utilisateurs ?", opts: ["Un dashboard avec seuils et alertes sur la saturation du lien", "Rien n'est possible", "Débrancher le lien", "Supprimer NetFlow"], a: 0, exp: "Des seuils/alertes sur les métriques préviennent avant l'impact utilisateur." }
    ],
    solution: `<pre class="pseudo"># Demarche d'observabilite :
# 1) METRIQUES (SNMP)  -> le lien coeur est a 95 % : saturation confirmee.
# 2) NETFLOW           -> 70 % du trafic vient d'une sauvegarde vers 10.2.0.9:445.
# 3) LOGS              -> tache de backup lancee en heures ouvrees a 14h00.
# 4) TRACES            -> confirment la latence ajoutee sur les requetes applicatives.
# Correction : replanifier la sauvegarde la nuit + alerte a 80 % d'utilisation.</pre>
<p>En croisant métriques, flux, logs et traces, on passe du symptôme (« c'est lent ») à la cause racine, puis à la prévention.</p>`
  }
};
