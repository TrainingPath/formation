  title: "Le réseau dans le cloud (VPC, subnets)",

  theory: `
<h3>1. Un réseau à louer, pas à câbler</h3>
<p>Dans le cloud, tu ne poses plus de câbles ni de commutateurs : tu <strong>décris</strong> ton réseau et le fournisseur le fabrique. La brique de base s'appelle le <strong>VPC</strong> (Virtual Private Cloud), c'est-à-dire un réseau virtuel privé et isolé, réservé à ton compte, chez un hébergeur comme <strong>AWS</strong>, <strong>Azure</strong> (qui parle de « VNet ») ou <strong>GCP</strong>. Ton VPC est ton petit datacenter logique : deux VPC de deux clients ne se voient pas, même s'ils tournent sur le même matériel physique.</p>
<h3>2. Le plan d'adressage : CIDR et subnets</h3>
<p>Quand tu crées un VPC, tu lui attribues une <strong>plage d'adresses privées</strong> au format CIDR, par exemple <strong>10.0.0.0/16</strong> (65 536 adresses). Tu la découpes ensuite en <strong>sous-réseaux</strong> (en anglais <em>subnets</em>), par exemple 10.0.1.0/24 et 10.0.2.0/24. Chaque subnet vit dans une <strong>zone de disponibilité</strong> (Availability Zone) : un datacenter distinct de la région. Répartir ses subnets sur plusieurs zones, c'est se protéger contre la panne d'un site.</p>
<pre class="pseudo"># Exemple de decoupage d'un VPC 10.0.0.0/16
VPC        10.0.0.0/16
 subnet-public-a   10.0.1.0/24   (zone A)  -> exposé à Internet
 subnet-public-b   10.0.2.0/24   (zone B)  -> exposé à Internet
 subnet-prive-a    10.0.10.0/24  (zone A)  -> bases de données, pas d'accès direct
 subnet-prive-b    10.0.11.0/24  (zone B)  -> bases de données, pas d'accès direct</pre>
<h3>3. Subnet public ou privé ?</h3>
<p>La différence n'est pas dans l'adressage mais dans le <strong>routage</strong>. Un <strong>subnet public</strong> possède une route vers une <strong>passerelle Internet</strong> (Internet Gateway) : ses machines peuvent recevoir un trafic entrant depuis Internet. Un <strong>subnet privé</strong> n'a pas cette route ; pour sortir vers Internet (mises à jour, appels d'API) sans être joignable de l'extérieur, il passe par une <strong>passerelle NAT</strong> (NAT Gateway). On y place les composants sensibles : bases de données, serveurs applicatifs internes.</p>
<div class="tip">Bonne pratique : serveurs web dans les subnets publics, bases de données dans les subnets privés. Ainsi la base n'est jamais atteignable directement depuis Internet.</div>
<h3>4. Les gardiens : security groups et NACL</h3>
<p>Le pare-feu du cloud a deux niveaux. Le <strong>security group</strong> (groupe de sécurité) s'attache à une machine (une instance) : il contrôle le trafic entrant et sortant et il est <strong>à état</strong> (stateful) — si tu autorises une connexion sortante, la réponse revient automatiquement. La <strong>NACL</strong> (Network ACL) s'applique à un subnet entier, elle est <strong>sans état</strong> (stateless) et sert de filtre plus large. En pratique, on règle finement les security groups (ex : « n'accepter le port 443 que depuis Internet, le port 5432 que depuis le subnet web »).</p>
<div class="warn">Par défaut, un security group bien conçu refuse tout en entrée et n'ouvre que le strict nécessaire. Ouvrir 0.0.0.0/0 sur le port 22 (SSH) expose la machine au monde entier : à éviter absolument.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># VPC   = reseau virtuel prive et isole (AWS/Azure VNet/GCP)
# CIDR du VPC (ex 10.0.0.0/16) decoupe en SUBNETS (/24...)
# Subnet public  = route vers Internet Gateway (exposable)
# Subnet prive   = pas d'entree directe ; sortie via NAT Gateway
# Security group = pare-feu par instance, stateful
# NACL           = pare-feu par subnet, stateless

    { type: "vf", q: "Dans le cloud, on décrit son réseau et le fournisseur le construit sans câblage physique de notre part.", a: true, exp: "Oui : le réseau cloud est défini par configuration, pas par câblage manuel." }

<p>Le cloud transforme le réseau en configuration : isolation par VPC, découpage par subnets, contrôle fin par security groups.</p>`
