<script>
var DAY = {
  num: 2,
  title: "Nettoyer les espaces : TRIM, LTRIM, RTRIM",
  subtitle: "L'ennemi invisible numéro un, et les trois fonctions qui en viennent à bout.",
  theory: `
<h3>1. Le problème des espaces parasites</h3>
<p>Un <strong>espace parasite</strong> (en anglais <em>whitespace</em>) est un caractère blanc — espace, tabulation, retour à la ligne — qui se trouve au début ou à la fin d'une valeur sans y avoir sa place. Il vient d'un copier-coller depuis Excel, d'un formulaire web sans validation, d'un import de fichier CSV mal découpé.</p>
<p>Son danger tient à un fait simple : <strong>il ne se voit pas</strong>. À l'écran, <code>'  Dupont '</code> ressemble trait pour trait à <code>'Dupont'</code>. Mais pour le SGBD, ce sont deux chaînes différentes, de longueurs différentes, qui ne seront jamais égales.</p>
<pre class="pseudo">-- Demonstration du degat, sur une table CLIENT contenant '  Dupont ' :

SELECT * FROM CLIENT WHERE nom = 'Dupont';   -- 0 ligne : la valeur stockee contient des espaces
SELECT COUNT(*) FROM CLIENT GROUP BY nom;    -- 'Dupont' et '  Dupont ' forment DEUX groupes distincts

-- Une jointure echoue aussi silencieusement :
SELECT c.nom, v.nb_habitants
FROM CLIENT c
JOIN VILLE v ON c.ville = v.nom;             -- si c.ville vaut 'Namur ' et v.nom vaut 'Namur' -&gt; aucune correspondance</pre>
<div class="warn">Ce défaut est vicieux parce qu'il ne provoque <strong>aucune erreur</strong>. La requête s'exécute parfaitement et renvoie zéro ligne, ou un total faux. Rien ne t'avertit.</div>

<h3>2. TRIM : rogner des deux côtés</h3>
<p><code>TRIM</code> (« rogner », « tailler ») supprime les espaces situés <strong>au début ET à la fin</strong> de la chaîne. Point capital : les espaces situés <strong>à l'intérieur</strong> ne sont jamais touchés.</p>
<pre class="pseudo">SELECT TRIM('   Dupont   ');    -- resultat : 'Dupont'
SELECT TRIM('  Jean  Paul  ');  -- resultat : 'Jean  Paul'  -- les 2 espaces du MILIEU restent intacts

-- Sur une vraie table, avec la comparaison avant / apres :
SELECT nom            AS avant,     -- '  Dupont '
       TRIM(nom)      AS apres      -- 'Dupont'
FROM CLIENT;</pre>
<p>Une fois TRIM appliqué, la comparaison redevient fiable :</p>
<pre class="pseudo">SELECT * FROM CLIENT WHERE TRIM(nom) = 'Dupont';   -- trouve bien la ligne, quels que soient les espaces</pre>

<h3>3. LTRIM et RTRIM : rogner d'un seul côté</h3>
<p>Parfois on ne veut nettoyer qu'un bord. <code>LTRIM</code> (<em>Left TRIM</em>) supprime les espaces de <strong>gauche</strong> uniquement, <code>RTRIM</code> (<em>Right TRIM</em>) ceux de <strong>droite</strong>.</p>
<pre class="pseudo">SELECT LTRIM('   Dupont   ');   -- 'Dupont   '  : le bord GAUCHE est nettoye, la droite reste
SELECT RTRIM('   Dupont   ');   -- '   Dupont'  : le bord DROIT est nettoye, la gauche reste
SELECT TRIM ('   Dupont   ');   -- 'Dupont'     : les deux bords

-- LTRIM(RTRIM(x)) donne exactement le meme resultat que TRIM(x) :
SELECT LTRIM(RTRIM('   Dupont   '));   -- 'Dupont'  -- utile sur les vieux SQL Server (avant 2017, TRIM n'existait pas)</pre>
<div class="tip">Sur SQL Server antérieur à 2017, <code>TRIM</code> n'existe pas : il faut écrire <code>LTRIM(RTRIM(colonne))</code>. Tu croiseras encore souvent cette écriture dans du code existant — sache la reconnaître.</div>

<h3>4. La forme standard complète : TRIM(... FROM ...)</h3>
<p>Le standard SQL prévoit une syntaxe plus riche, avec trois mots-clés : <code>LEADING</code> (au début), <code>TRAILING</code> (à la fin) et <code>BOTH</code> (les deux, valeur par défaut). Elle permet en outre de rogner un <strong>autre caractère</strong> que l'espace.</p>
<pre class="pseudo">TRIM(BOTH     FROM '  texte  ')          -- 'texte'    : les deux bords (comportement par defaut)
TRIM(LEADING  FROM '  texte  ')          -- 'texte  '  : equivaut a LTRIM
TRIM(TRAILING FROM '  texte  ')          -- '  texte'  : equivaut a RTRIM

-- Rogner un caractere choisi, ici le zero de tete d'un code article :
SELECT TRIM(LEADING '0' FROM '000457');  -- '457'   : supprime tous les 0 du DEBUT

-- Rogner un point-virgule de fin, souvenir d'un import CSV :
SELECT TRIM(TRAILING ';' FROM 'Namur;'); -- 'Namur'</pre>

<h3>5. Les différences entre SGBD</h3>
<div class="tip"><strong>MySQL / MariaDB</strong> : <code>TRIM</code>, <code>LTRIM</code>, <code>RTRIM</code> et la forme <code>TRIM(BOTH 'x' FROM col)</code> sont tous disponibles. Attention : <code>LTRIM</code>/<code>RTRIM</code> n'y retirent que l'<strong>espace</strong>, pas un caractère au choix.<br>
<strong>PostgreSQL</strong> : idem, plus <code>BTRIM(col, 'caracteres')</code> qui rogne des deux côtés un jeu de caractères donné.<br>
<strong>SQL Server</strong> : <code>LTRIM</code> et <code>RTRIM</code> depuis toujours ; <code>TRIM</code> seulement à partir de la version 2017 ; <code>TRIM('0' FROM col)</code> à partir de 2022 seulement.<br>
<strong>Oracle</strong> : <code>TRIM(LEADING '0' FROM col)</code>, et <code>RTRIM(col, '0')</code> accepte un jeu de caractères.</div>

<h3>6. Détecter et corriger sur toute une table</h3>
<p>Pour trouver les lignes réellement concernées, on compare la colonne avec sa propre version rognée : si elles diffèrent, c'est qu'il y avait des espaces.</p>
<pre class="pseudo">-- 1) MESURER l'ampleur du probleme
SELECT COUNT(*) AS nb_sales
FROM CLIENT
WHERE nom &lt;&gt; TRIM(nom);            -- &lt;&gt; = different : la valeur brute n'est pas egale a sa version rognee

-- 2) VOIR le detail, avec la longueur pour objectiver le nombre d'espaces
SELECT id,
       nom              AS avant,
       LENGTH(nom)      AS long_avant,   -- LENGTH compte les caracteres (LEN en SQL Server)
       TRIM(nom)        AS apres,
       LENGTH(TRIM(nom)) AS long_apres   -- la difference de longueur = le nombre d'espaces supprimes
FROM CLIENT
WHERE nom &lt;&gt; TRIM(nom);

-- 3) CORRIGER, avec le meme WHERE
UPDATE CLIENT
SET nom = TRIM(nom)
WHERE nom &lt;&gt; TRIM(nom);</pre>
<div class="warn">Piège spécifique à SQL Server : le type <code>CHAR(n)</code> complète automatiquement les valeurs avec des espaces à droite, et <code>LEN()</code> les ignore. Un <code>LEN()</code> identique ne prouve donc pas l'absence d'espaces de fin — utilise <code>DATALENGTH()</code> pour en avoir le cœur net.</div>`,
  exercises: [
    { type: "input", q: "Complète : SELECT ______(nom) FROM CLIENT; — la fonction qui rogne les espaces des DEUX côtés.", a: ["trim"], ph: "une fonction", exp: "TRIM supprime les espaces de début et de fin." },
    { type: "qcm", q: "Que renvoie TRIM('  Jean  Paul  ') ?", opts: ["'JeanPaul'", "'Jean  Paul'", "'Jean Paul'", "'  Jean  Paul  '"], a: 1, exp: "TRIM ne touche que les bords. Les deux espaces intérieurs sont conservés tels quels." },
    { type: "input", q: "Complète : SELECT ______('   Namur') — la fonction qui n'enlève que les espaces de GAUCHE.", a: ["ltrim"], ph: "une fonction", exp: "LTRIM = Left TRIM, le bord gauche uniquement." },
    { type: "vf", q: "TRIM supprime aussi les espaces situés au milieu de la chaîne.", a: false, exp: "Jamais. Pour les espaces intérieurs, il faudra REPLACE (jour 6)." },
    { type: "qcm", q: "Que renvoie RTRIM('  ABC  ') ?", opts: ["'ABC'", "'  ABC'", "'ABC  '", "'ABC ABC'"], a: 1, exp: "RTRIM nettoie la droite ; les deux espaces de gauche restent." },
    { type: "input", q: "Complète pour un vieux SQL Server sans TRIM : SELECT LTRIM(______(nom)) FROM CLIENT;", a: ["rtrim"], ph: "une fonction", exp: "LTRIM(RTRIM(x)) reproduit exactement le comportement de TRIM." },
    { type: "qcm", q: "Quelle requête détecte les lignes ayant des espaces parasites ?", opts: ["WHERE nom LIKE ' %'", "WHERE nom <> TRIM(nom)", "WHERE nom IS NULL", "WHERE TRIM(nom) = nom"], a: 1, exp: "Si la valeur brute diffère de sa version rognée, c'est qu'il y avait des espaces à un bord au moins." },
    { type: "vf", q: "Un espace parasite provoque un message d'erreur du SGBD.", a: false, exp: "Aucune erreur : la requête réussit et renvoie simplement un résultat faux ou vide. C'est ce qui le rend dangereux." },
    { type: "input", q: "Complète la forme standard : SELECT TRIM(______ '0' FROM '000457'); — pour enlever les zéros du DÉBUT.", a: ["leading"], ph: "un mot-clé", exp: "LEADING vise le début, TRAILING la fin, BOTH les deux." },
    { type: "qcm", q: "Que renvoie TRIM(TRAILING ';' FROM 'Namur;') ?", opts: ["'Namur;'", "'Namur'", "';Namur'", "'amur'"], a: 1, exp: "TRAILING rogne à la fin, et ici on rogne le caractère ';' au lieu de l'espace." },
    { type: "qcm", q: "Sur quel SGBD la fonction TRIM n'existe-t-elle qu'à partir de la version 2017 ?", opts: ["MySQL", "PostgreSQL", "SQL Server", "SQLite"], a: 2, exp: "SQL Server a longtemps imposé LTRIM(RTRIM(...)). TRIM est arrivé avec la version 2017." },
    { type: "input", q: "Complète l'UPDATE de correction : UPDATE CLIENT SET nom = TRIM(nom) ______ nom <> TRIM(nom);", a: ["where"], ph: "un mot-clé", exp: "Le WHERE limite l'écriture aux seules lignes réellement sales." },
    { type: "vf", q: "LTRIM(RTRIM(x)) donne le même résultat que TRIM(x) pour les espaces.", a: true, exp: "Rogner à gauche puis à droite revient à rogner des deux côtés." },
    { type: "qcm", q: "Pourquoi comparer LENGTH(nom) et LENGTH(TRIM(nom)) ?", opts: ["Pour trier les noms", "Pour connaître le nombre d'espaces supprimés", "Pour convertir en majuscules", "Pour créer un index"], a: 1, exp: "La différence de longueur chiffre exactement combien de caractères parasites ont été rognés." },
    { type: "qcm", q: "Quelle fonction PostgreSQL rogne des deux côtés un jeu de caractères donné ?", opts: ["MTRIM", "BTRIM", "CTRIM", "FULLTRIM"], a: 1, exp: "BTRIM(col, 'xyz') est la forme raccourcie propre à PostgreSQL." }
  ],
  final: {
    title: "Exercice final — Une table criblée d'espaces",
    intro: `<p>Table <code>ARTICLE</code> issue d'un import CSV. Les guillemets délimitent la valeur réellement stockée.</p>
<pre class="pseudo">id | reference   | libelle            | categorie
---+-------------+--------------------+------------
 1 | '  A-100 '  | 'Clavier  sans fil'| 'Info '
 2 | 'A-101'     | ' Souris optique'  | ' Info'
 3 | '000A-102'  | 'Ecran 24 pouces ' | 'Info'
 4 | ' A-103  '  | 'Cable HDMI'       | 'Info  '</pre>`,
    questions: [
      { type: "qcm", q: "Combien de lignes ont une référence comportant des espaces parasites ?", opts: ["Une", "Deux (lignes 1 et 4)", "Trois", "Quatre"], a: 1, exp: "Les lignes 1 ('  A-100 ') et 4 (' A-103  '). La ligne 3 a des zéros, pas des espaces." },
      { type: "qcm", q: "Que renvoie TRIM(libelle) pour la ligne 1 ?", opts: ["'Clavier sans fil'", "'Clavier  sans fil'", "'Claviersansfil'", "'Clavier'"], a: 1, exp: "Il n'y a pas d'espace aux bords ; les deux espaces intérieurs sont conservés par TRIM." },
      { type: "vf", q: "SELECT DISTINCT categorie FROM ARTICLE renvoie une seule ligne.", a: false, exp: "'Info ', ' Info', 'Info' et 'Info  ' sont quatre valeurs distinctes pour le SGBD." },
      { type: "qcm", q: "Comment retirer les zéros de tête de la référence '000A-102' ?", opts: ["TRIM('000A-102')", "LTRIM('000A-102')", "TRIM(LEADING '0' FROM reference)", "RTRIM(reference)"], a: 2, exp: "Il faut préciser le caractère à rogner et le côté : LEADING '0'." },
      { type: "vf", q: "Après UPDATE ARTICLE SET categorie = TRIM(categorie), un GROUP BY categorie ne formera plus qu'un seul groupe.", a: true, exp: "Une fois les espaces rognés, les quatre valeurs deviennent identiques : 'Info'." }
    ],
    solution: `<pre class="pseudo">-- 1) MESURER : combien de references et de categories sont sales ?
SELECT COUNT(*) AS refs_sales
FROM ARTICLE
WHERE reference &lt;&gt; TRIM(reference);        -- valeur brute differente de la version rognee

-- 2) TESTER le nettoyage complet, avant / apres et longueurs
SELECT id,
       reference               AS ref_avant,
       TRIM(reference)         AS ref_apres,
       LENGTH(reference)       AS long_avant,   -- LEN() en SQL Server
       LENGTH(TRIM(reference)) AS long_apres,
       TRIM(categorie)         AS cat_apres     -- meme traitement pour la categorie
FROM ARTICLE;

-- 3) CORRIGER colonne par colonne, chacune avec son propre WHERE
UPDATE ARTICLE
SET reference = TRIM(reference)
WHERE reference &lt;&gt; TRIM(reference);

UPDATE ARTICLE
SET categorie = TRIM(categorie)
WHERE categorie &lt;&gt; TRIM(categorie);

-- 4) CAS PARTICULIER : les zeros de tete de la ligne 3
UPDATE ARTICLE
SET reference = TRIM(LEADING '0' FROM reference)   -- rogne uniquement les 0 du DEBUT
WHERE reference &lt;&gt; TRIM(LEADING '0' FROM reference);

-- Verification finale : il ne doit plus rester qu'une seule categorie
SELECT DISTINCT categorie FROM ARTICLE;    -- attendu : une seule ligne, 'Info'</pre>
<p>Les espaces sont matés. Demain : la casse, l'autre grand semeur de faux doublons.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta requête SQL ici…",
  items: [
  { id: "sgbd-j02", title: "Rogner et compter", level: 2,
    statement: "Table <code>CONTACT(id, nom, code_postal)</code> :<pre class='pseudo'>id | nom          | code_postal\n---+--------------+-------------\n 1 | '  Leroy '   | '5000 '\n 2 | 'Martin'     | ' 4000'\n 3 | ' Dubois'    | '1000'\n 4 | 'Simon  '    | ' 6000 '</pre>Écris une requête qui affiche, pour <strong>les seules lignes dont le nom comporte des espaces parasites</strong> : l'identifiant, le nom brut, le nom rogné, et le nombre d'espaces supprimés. Trie par nombre d'espaces supprimés décroissant.",
    hints: [
      "Le filtre : la colonne comparée à sa propre version TRIM avec l'opérateur <>.",
      "Le nombre d'espaces supprimés = LENGTH(nom) - LENGTH(TRIM(nom)).",
      "On peut réutiliser l'alias d'une colonne calculée dans le ORDER BY (mais pas dans le WHERE)."
    ],
    solution: "SELECT id,                                          -- identifiant de la ligne\n       nom                        AS nom_avant,    -- la valeur telle qu'elle est stockee\n       TRIM(nom)                  AS nom_apres,    -- la meme, rognee des deux cotes\n       LENGTH(nom) - LENGTH(TRIM(nom)) AS nb_espaces  -- difference de longueur = espaces supprimes\nFROM CONTACT\nWHERE nom <> TRIM(nom)                              -- ne garde que les noms reellement sales\nORDER BY nb_espaces DESC;                           -- les pires d'abord\n\n-- Resultat attendu :\n-- id | nom_avant  | nom_apres | nb_espaces\n-- ---+------------+-----------+-----------\n--  1 | '  Leroy ' | 'Leroy'   |     3\n--  4 | 'Simon  '  | 'Simon'   |     2\n--  3 | ' Dubois'  | 'Dubois'  |     1\n\n-- La ligne 2 ('Martin') est propre : le WHERE l'exclut.\n\n-- Variante SQL Server : remplacer LENGTH par LEN.\n-- Attention, LEN() ignore les espaces de FIN : utiliser DATALENGTH pour un comptage exact.",
    note: "Piège : sur SQL Server, LEN('Simon  ') vaut 5 et non 7, car LEN ignore les espaces de fin — le calcul du nombre d'espaces y donnerait 0. C'est DATALENGTH qu'il faut utiliser. Bonne pratique : le WHERE col <> TRIM(col) est le détecteur universel d'espaces parasites, à mémoriser tel quel." }
  ]
};
</script>
