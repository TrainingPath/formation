<script>
var DAY = {
  num: 10,
  title: "Les fonctions numériques : ROUND, FLOOR, CEILING, ABS",
  subtitle: "Arrondir juste, tronquer sciemment, et ne jamais confondre les deux.",
  theory: `
<h3>1. Trois façons de « supprimer les décimales »</h3>
<p>Il n'existe pas une seule manière de ramener 9.7 à un entier, mais trois — et elles donnent des résultats différents. Les confondre produit des écarts de centimes qui, multipliés par un million de lignes, deviennent des écarts comptables.</p>
<pre class="pseudo">-- Sur la valeur 9.7 :
ROUND(9.7)     -- 10  : ARRONDI au plus proche (9.7 est plus proche de 10 que de 9)
FLOOR(9.7)     --  9  : PLANCHER, l'entier immediatement INFERIEUR ou egal
CEILING(9.7)   -- 10  : PLAFOND, l'entier immediatement SUPERIEUR ou egal

-- Sur la valeur 9.2 :
ROUND(9.2)     --  9  : le plus proche est 9
FLOOR(9.2)     --  9
CEILING(9.2)   -- 10  : CEILING monte TOUJOURS des qu'il y a une decimale

-- Sur une valeur NEGATIVE, la difference devient spectaculaire :
ROUND(-9.7)    -- -10
FLOOR(-9.7)    -- -10 : le plancher DESCEND (-10 est inferieur a -9.7)
CEILING(-9.7)  --  -9 : le plafond MONTE  (-9 est superieur a -9.7)</pre>
<div class="warn">Sur les nombres négatifs, <code>FLOOR</code> et <code>CEILING</code> ne « tronquent » pas : ils vont respectivement vers moins l'infini et vers plus l'infini. <code>FLOOR(-9.2)</code> vaut <strong>-10</strong>, pas -9. Si tu veux réellement tronquer (couper la partie décimale, quel que soit le signe), il faut <code>TRUNCATE</code>.</div>

<h3>2. ROUND avec un nombre de décimales</h3>
<p><code>ROUND(nombre, n)</code> arrondit à <code>n</code> décimales. C'est de loin l'usage le plus fréquent : les montants monétaires s'expriment à deux décimales, les pourcentages souvent à une.</p>
<pre class="pseudo">SELECT ROUND(1250.5678, 2);   -- 1250.57 : deux decimales
SELECT ROUND(1250.5678, 1);   -- 1250.6  : une decimale
SELECT ROUND(1250.5678, 0);   -- 1251    : entier
SELECT ROUND(1250.5678, -2);  -- 1300    : un n NEGATIF arrondit aux CENTAINES

-- Application : un prix TTC toujours propre
SELECT prix_ht,
       prix_ht * 1.21              AS ttc_brut,      -- 100.00 donne 121.00000000001 selon le type
       ROUND(prix_ht * 1.21, 2)    AS ttc_affiche    -- 121.00 : deux decimales, comme il se doit
FROM ARTICLE;</pre>
<div class="tip"><strong>Différence entre SGBD</strong> : <code>ROUND(x, n)</code> avec deux arguments existe partout. En revanche, <code>ROUND(x)</code> à un seul argument n'existe pas en SQL Server — il faut y écrire <code>ROUND(x, 0)</code>. PostgreSQL exige que <code>x</code> soit de type <code>NUMERIC</code> pour la forme à deux arguments : sur un <code>DOUBLE PRECISION</code>, il faut caster (<code>ROUND(x::numeric, 2)</code>).</div>

<h3>3. CEILING ou CEIL ? Les noms varient</h3>
<div class="tip"><strong>MySQL / MariaDB</strong> : <code>CEIL</code> et <code>CEILING</code> sont synonymes. <code>TRUNCATE(x, n)</code> tronque à n décimales (le 2e argument est obligatoire).<br>
<strong>PostgreSQL</strong> : <code>CEIL</code> et <code>CEILING</code> sont synonymes. <code>TRUNC(x, n)</code> tronque.<br>
<strong>SQL Server</strong> : <code>CEILING</code> uniquement (pas de <code>CEIL</code>). Pas de fonction TRUNC : on utilise <code>ROUND(x, n, 1)</code> — le troisième argument à 1 signifie « tronquer au lieu d'arrondir ».<br>
<strong>Oracle</strong> : <code>CEIL</code> uniquement, et <code>TRUNC</code>.</div>
<pre class="pseudo">-- Tronquer 9.789 a 2 decimales, selon le SGBD :
TRUNCATE(9.789, 2)     -- MySQL      -&gt; 9.78
TRUNC(9.789, 2)        -- PostgreSQL, Oracle -&gt; 9.78
ROUND(9.789, 2, 1)     -- SQL Server -&gt; 9.78  (le 3e argument 1 = tronquer)
ROUND(9.789, 2)        -- partout    -&gt; 9.79  (ARRONDI, resultat different !)</pre>

<h3>4. ABS : la valeur absolue</h3>
<p><code>ABS(nombre)</code> renvoie la valeur sans son signe. Son usage principal en nettoyage de données : mesurer un <strong>écart</strong> sans se soucier de son sens.</p>
<pre class="pseudo">SELECT ABS(-15);      -- 15
SELECT ABS(15);       -- 15
SELECT ABS(0);        --  0

-- Detecter les ecarts significatifs entre deux colonnes, dans un sens comme dans l'autre :
SELECT id, stock_theorique, stock_reel,
       stock_reel - stock_theorique        AS ecart,          -- peut etre negatif
       ABS(stock_reel - stock_theorique)   AS ecart_absolu    -- l'ampleur, sans le sens
FROM INVENTAIRE
WHERE ABS(stock_reel - stock_theorique) &gt; 5;   -- ecart de plus de 5 unites, en plus OU en moins
-- sans ABS, il faudrait ecrire : WHERE ecart &gt; 5 OR ecart &lt; -5</pre>

<h3>5. Les autres fonctions utiles</h3>
<pre class="pseudo">MOD(10, 3)      -- 1  : le RESTE de la division entiere de 10 par 3 (10 % 3 en MySQL et SQL Server)
POWER(2, 10)    -- 1024 : 2 eleve a la puissance 10
SQRT(16)        -- 4  : racine carree
SIGN(-15)       -- -1 : le signe (-1 si negatif, 0 si nul, 1 si positif)
GREATEST(3,9,5) -- 9  : le plus grand des arguments (MySQL, PostgreSQL, Oracle)
LEAST(3,9,5)    -- 3  : le plus petit

-- MOD sert a detecter les valeurs paires, ou les multiples :
SELECT id FROM COMMANDE WHERE MOD(id, 2) = 0;   -- identifiants pairs

-- GREATEST/LEAST n'existent pas en SQL Server avant 2022 : on y utilise un CASE WHEN.</pre>

<h3>6. Le piège des nombres à virgule flottante</h3>
<p><code>FLOAT</code> et <code>DOUBLE</code> stockent les nombres de façon <strong>approchée</strong> : le format binaire ne sait pas représenter 0.1 exactement, pas plus que le décimal ne sait écrire un tiers. Pour de l'argent, c'est rédhibitoire.</p>
<pre class="pseudo">SELECT 0.1 + 0.2;                  -- avec des FLOAT : 0.30000000000000004, et non 0.3
SELECT 0.1 + 0.2 = 0.3;            -- FAUX avec des FLOAT ! Un test d'egalite ne fonctionne pas.

-- La regle absolue :
--   argent, quantites comptables  -&gt; DECIMAL(p,s) ou NUMERIC(p,s), stockage EXACT
--   mesures physiques, statistiques -&gt; FLOAT / DOUBLE acceptable

-- Comparer deux flottants se fait TOUJOURS avec une tolerance :
WHERE ABS(valeur_a - valeur_b) &lt; 0.001;   -- « suffisamment proches » plutot que « egaux »</pre>
<div class="warn">Ne stocke jamais un montant en <code>FLOAT</code>. Les erreurs d'arrondi s'accumulent facture après facture, et le total des lignes finit par différer du total général de quelques centimes — un cauchemar à expliquer à un comptable.</div>

<h3>7. Application au contrôle qualité</h3>
<pre class="pseudo">-- Repartir des valeurs continues en tranches, avec FLOOR :
SELECT FLOOR(montant / 100) * 100 AS tranche,   -- 0-99 donne 0, 100-199 donne 100, etc.
       COUNT(*)                   AS nb_commandes
FROM COMMANDE
GROUP BY FLOOR(montant / 100) * 100
ORDER BY tranche;
-- FLOOR(250 / 100) = 2, puis 2 * 100 = 200 : la commande tombe dans la tranche 200

-- Reperer les valeurs aberrantes : negatives ou anormalement elevees
SELECT id, montant
FROM COMMANDE
WHERE montant &lt; 0                    -- un montant negatif est presque toujours une erreur de saisie
   OR montant &gt; 100000;              -- seuil metier au-dela duquel une verification s'impose

-- Verifier la coherence d'un total calcule
SELECT id,
       total_annonce,
       ROUND(prix_unitaire * quantite, 2)                        AS total_recalcule,
       ABS(total_annonce - ROUND(prix_unitaire * quantite, 2))   AS ecart
FROM LIGNE_COMMANDE
WHERE ABS(total_annonce - ROUND(prix_unitaire * quantite, 2)) &gt; 0.01;   -- tolerance d'un centime</pre>`,
  exercises: [
    { type: "qcm", q: "Que renvoie FLOOR(9.7) ?", opts: ["10", "9", "9.7", "0"], a: 1, exp: "FLOOR descend toujours vers l'entier inférieur ou égal." },
    { type: "input", q: "Complète : SELECT ______(1250.5678, 2); — la fonction qui arrondit à deux décimales.", a: ["round"], ph: "une fonction", exp: "ROUND(nombre, n) arrondit à n décimales." },
    { type: "qcm", q: "Que renvoie CEILING(9.2) ?", opts: ["9", "10", "9.2", "0"], a: 1, exp: "CEILING monte dès qu'il reste la moindre décimale." },
    { type: "qcm", q: "Que renvoie FLOOR(-9.2) ?", opts: ["-9", "-10", "9", "10"], a: 1, exp: "FLOOR va vers moins l'infini : -10 est inférieur à -9.2. Ce n'est PAS une troncature." },
    { type: "vf", q: "FLOOR tronque simplement la partie décimale.", a: false, exp: "Sur les négatifs, FLOOR descend : FLOOR(-9.2) vaut -10. Pour tronquer, il faut TRUNC ou TRUNCATE." },
    { type: "input", q: "Complète : SELECT ______(-15); — la fonction qui renvoie la valeur absolue.", a: ["abs"], ph: "une fonction", exp: "ABS supprime le signe et renvoie 15." },
    { type: "qcm", q: "Que renvoie ROUND(1250.5678, -2) ?", opts: ["1250.57", "1251", "1300", "0"], a: 2, exp: "Un second argument négatif arrondit à gauche de la virgule : ici aux centaines." },
    { type: "qcm", q: "Quelle fonction n'existe PAS en SQL Server ?", opts: ["CEILING", "ROUND", "CEIL", "ABS"], a: 2, exp: "SQL Server ne connaît que CEILING ; CEIL est un synonyme MySQL, PostgreSQL et Oracle." },
    { type: "input", q: "Complète : WHERE ______(stock_reel - stock_theorique) > 5; — pour détecter un écart en plus OU en moins.", a: ["abs"], ph: "une fonction", exp: "ABS évite d'écrire deux conditions avec un OR." },
    { type: "qcm", q: "Que renvoie MOD(10, 3) ?", opts: ["3", "1", "3.33", "0"], a: 1, exp: "MOD donne le reste de la division entière : 10 = 3×3 + 1." },
    { type: "vf", q: "0.1 + 0.2 = 0.3 est vrai avec des colonnes de type FLOAT.", a: false, exp: "Le stockage binaire est approché : le résultat vaut 0.30000000000000004. Il faut DECIMAL pour un calcul exact." },
    { type: "qcm", q: "Quel type utiliser pour un montant monétaire ?", opts: ["FLOAT", "DOUBLE", "DECIMAL(10,2)", "REAL"], a: 2, exp: "DECIMAL est un stockage exact ; FLOAT accumule des erreurs d'arrondi." },
    { type: "input", q: "Complète pour tronquer en MySQL : SELECT ______(9.789, 2);", a: ["truncate"], ph: "une fonction", exp: "TRUNCATE en MySQL, TRUNC en PostgreSQL et Oracle, ROUND(x, n, 1) en SQL Server." },
    { type: "qcm", q: "Que fait FLOOR(montant / 100) * 100 ?", opts: ["Arrondit au centime", "Range la valeur dans une tranche de 100", "Multiplie par 100", "Convertit en texte"], a: 1, exp: "C'est l'idiome classique de découpage en tranches pour un histogramme." },
    { type: "qcm", q: "Comment comparer deux nombres flottants correctement ?", opts: ["Avec =", "Avec ABS(a - b) < une petite tolérance", "Avec LIKE", "Avec IS NULL"], a: 1, exp: "On teste la proximité, jamais l'égalité stricte, car la représentation est approchée." }
  ],
  final: {
    title: "Exercice final — Contrôler des lignes de facture",
    intro: `<p>Table <code>LIGNE_FACTURE</code>. Le total annoncé a été saisi par un système externe.</p>
<pre class="pseudo">id | article   | prix_unit | quantite | total_annonce
---+-----------+-----------+----------+---------------
 1 | 'Clavier' |     29.90 |        3 |         89.70
 2 | 'Souris'  |     12.55 |        4 |         50.00
 3 | 'Ecran'   |    199.99 |        2 |        399.98
 4 | 'Cable'   |      4.95 |       -2 |         -9.90</pre>`,
    questions: [
      { type: "qcm", q: "Quelle ligne présente un écart entre total annoncé et total recalculé ?", opts: ["La ligne 1", "La ligne 2 : 12.55 × 4 = 50.20, or 50.00 est annoncé", "La ligne 3", "Aucune"], a: 1, exp: "L'écart est de 0.20, bien au-delà de la tolérance d'un centime." },
      { type: "qcm", q: "Quelle expression détecte cet écart dans les deux sens ?", opts: ["total_annonce - prix_unit * quantite > 0", "ABS(total_annonce - ROUND(prix_unit * quantite, 2)) > 0.01", "ROUND(total_annonce)", "FLOOR(total_annonce)"], a: 1, exp: "ABS capture les écarts positifs comme négatifs, et la tolérance de 0.01 absorbe les arrondis légitimes." },
      { type: "vf", q: "La ligne 4 est probablement une erreur de saisie.", a: true, exp: "Une quantité négative sur une facture est presque toujours anormale — sauf s'il s'agit explicitement d'un avoir." },
      { type: "qcm", q: "Que vaut ROUND(199.99 * 2, 2) ?", opts: ["399.98", "400.00", "399.99", "400"], a: 0, exp: "399.98 exactement : l'arrondi ne change rien puisque le résultat a déjà deux décimales." },
      { type: "qcm", q: "Pourquoi une tolérance de 0.01 plutôt qu'un test d'égalité strict ?", opts: ["Pour aller plus vite", "Pour absorber les arrondis légitimes au centime et ne signaler que les vrais écarts", "Parce que ABS l'exige", "Pour éviter les NULL"], a: 1, exp: "Un test strict ferait remonter des centaines de faux positifs dus au dernier centime." }
    ],
    solution: `<pre class="pseudo">-- 1) CONTROLER la coherence de chaque ligne
SELECT id,
       article,
       prix_unit,
       quantite,
       total_annonce,
       ROUND(prix_unit * quantite, 2)                          AS total_recalcule,
       ROUND(total_annonce - prix_unit * quantite, 2)          AS ecart,         -- signe conserve
       ABS(ROUND(total_annonce - prix_unit * quantite, 2))     AS ecart_absolu   -- ampleur seule
FROM LIGNE_FACTURE
ORDER BY ecart_absolu DESC;   -- les anomalies les plus graves en tete

-- 2) NE GARDER que les lignes reellement incoherentes
SELECT id, article, total_annonce, ROUND(prix_unit * quantite, 2) AS total_recalcule
FROM LIGNE_FACTURE
WHERE ABS(total_annonce - ROUND(prix_unit * quantite, 2)) &gt; 0.01;   -- tolerance d'un centime
-- attendu : la ligne 2 seulement (ecart de 0.20)

-- 3) REPERER les valeurs aberrantes
SELECT id, article, quantite, prix_unit
FROM LIGNE_FACTURE
WHERE quantite &lt;= 0             -- quantite nulle ou negative : suspect sur une facture
   OR prix_unit &lt; 0             -- prix negatif : erreur de saisie
   OR prix_unit &gt; 10000;        -- seuil metier de verification
-- attendu : la ligne 4 (quantite = -2)

-- 4) REPARTIR les lignes en tranches de montant
SELECT FLOOR(total_annonce / 100) * 100 AS tranche,   -- 89.70 tombe dans la tranche 0
       COUNT(*)                          AS nb_lignes,
       ROUND(SUM(total_annonce), 2)      AS total_tranche
FROM LIGNE_FACTURE
WHERE total_annonce &gt;= 0                  -- on ecarte les montants negatifs de ce comptage
GROUP BY FLOOR(total_annonce / 100) * 100
ORDER BY tranche;
-- tranche   0 : lignes 1 et 2
-- tranche 300 : ligne 3

-- Variantes : ROUND(x, 0) obligatoire en SQL Server pour un arrondi entier ;
-- en PostgreSQL, caster en numeric si la colonne est en double precision :
--   ROUND(prix_unit::numeric * quantite, 2)</pre>
<p>Les nombres sont sous contrôle. Demain : on attaque les dates, le terrain le plus glissant du SQL.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta requête SQL ici…",
  items: [
  { id: "sgbd-j10", title: "Écarts d'inventaire", level: 2,
    statement: "Table <code>INVENTAIRE(id, article, stock_theorique, stock_reel, prix_unit)</code> :<pre class='pseudo'>id | article    | stock_theorique | stock_reel | prix_unit\n---+------------+-----------------+------------+-----------\n 1 | 'Clavier'  |              50 |         48 |     29.90\n 2 | 'Souris'   |              30 |         30 |     12.55\n 3 | 'Ecran'    |              12 |         20 |    199.99\n 4 | 'Cable'    |             100 |         97 |      4.95</pre>Écris une requête qui affiche, pour chaque article présentant un écart de plus de 2 unités (en plus comme en moins) : l'écart signé, l'écart absolu, et la valeur financière de l'écart arrondie à deux décimales. Trie par valeur financière absolue décroissante.",
    hints: [
      "L'écart signé se calcule stock_reel - stock_theorique ; l'écart absolu s'obtient avec ABS.",
      "Le seuil « plus de 2 unités dans les deux sens » s'écrit ABS(...) > 2, ce qui évite un OR.",
      "La valeur financière = écart × prix unitaire, encadrée par ROUND(..., 2)."
    ],
    solution: "SELECT article,\n       stock_theorique,\n       stock_reel,\n       stock_reel - stock_theorique                                  AS ecart,          -- negatif = manquant\n       ABS(stock_reel - stock_theorique)                             AS ecart_absolu,   -- ampleur seule\n       ROUND((stock_reel - stock_theorique) * prix_unit, 2)          AS valeur_ecart,   -- impact financier signe\n       ROUND(ABS(stock_reel - stock_theorique) * prix_unit, 2)       AS valeur_absolue  -- impact, sans le sens\nFROM INVENTAIRE\nWHERE ABS(stock_reel - stock_theorique) > 2      -- seuil : plus de 2 unites, en plus OU en moins\nORDER BY valeur_absolue DESC;                    -- les ecarts les plus couteux en premier\n\n-- Resultat attendu :\n-- article   | ecart | ecart_absolu | valeur_ecart | valeur_absolue\n-- ----------+-------+--------------+--------------+---------------\n-- 'Ecran'   |     8 |            8 |      1599.92 |        1599.92\n-- 'Cable'   |    -3 |            3 |       -14.85 |          14.85\n\n-- Ligne 1 ('Clavier', ecart de -2) : exclue, l'ecart n'est pas STRICTEMENT superieur a 2.\n-- Ligne 2 ('Souris', ecart de 0)   : exclue, stock conforme.\n\n-- Sans ABS, le WHERE aurait exige deux conditions :\n--   WHERE stock_reel - stock_theorique > 2 OR stock_reel - stock_theorique < -2\n-- ABS dit la meme chose en une seule expression, bien plus lisible.\n\n-- Variante SQL Server : identique (ABS et ROUND y existent a l'identique).\n-- Variante PostgreSQL avec des colonnes en double precision :\n--   ROUND((... )::numeric, 2), car ROUND a deux arguments y exige le type numeric.",
    note: "Piège : le seuil « plus de 2 » exclut l'écart de exactement 2 unités (ligne 1). Précise toujours si un seuil métier est strict (>) ou large (>=) — la différence change le résultat, et l'ambiguïté d'un cahier des charges se paie en réunions. Bonne pratique : afficher l'écart SIGNÉ à côté de l'écart absolu. Le premier dit s'il s'agit d'un manquant ou d'un excédent — deux problèmes métier radicalement différents, alors que ABS les confond." }
  ]
};
</script>
