<script>
var DAY = {
  num: 4,
  title: "Découper une chaîne : SUBSTRING, LEFT, RIGHT",
  subtitle: "Extraire un morceau précis d'un texte : code postal, préfixe, extension, initiale.",
  theory: `
<h3>1. Pourquoi découper une chaîne ?</h3>
<p>Les données réelles arrivent souvent <strong>agglomérées</strong> : plusieurs informations tassées dans une seule colonne. Un code article <code>'FR-2024-00457'</code> contient un pays, une année et un numéro. Une adresse <code>'5000 Namur'</code> contient un code postal et une ville. Un email contient un identifiant et un domaine.</p>
<p><strong>Découper</strong> (on dit aussi <em>extraire une sous-chaîne</em>) consiste à ne garder qu'une portion du texte, désignée par sa position et sa longueur. Trois fonctions suffisent dans l'immense majorité des cas : <code>SUBSTRING</code>, <code>LEFT</code> et <code>RIGHT</code>.</p>

<h3>2. La notion de position</h3>
<p>Une chaîne est une suite de caractères numérotés. Point crucial : en SQL, la numérotation commence à <strong>1</strong> (et non à 0 comme dans la plupart des langages de programmation).</p>
<pre class="pseudo">Chaine :  N  a  m  u  r
Position: 1  2  3  4  5      -- le premier caractere est en position 1, PAS 0</pre>

<h3>3. SUBSTRING : extraire à partir d'une position</h3>
<p><code>SUBSTRING(texte, depart, longueur)</code> renvoie <code>longueur</code> caractères à partir de la position <code>depart</code>. Si on omet la longueur, on obtient tout le reste de la chaîne jusqu'à la fin.</p>
<pre class="pseudo">SELECT SUBSTRING('FR-2024-00457', 4, 4);   -- '2024'  : 4 caracteres a partir de la position 4
SELECT SUBSTRING('FR-2024-00457', 1, 2);   -- 'FR'    : les 2 premiers caracteres
SELECT SUBSTRING('FR-2024-00457', 9);      -- '00457' : de la position 9 jusqu'a la fin

-- Sur une table, avec avant / apres :
SELECT code_article               AS avant,   -- 'FR-2024-00457'
       SUBSTRING(code_article, 1, 2) AS pays, -- 'FR'
       SUBSTRING(code_article, 4, 4) AS annee -- '2024'
FROM ARTICLE;</pre>
<div class="tip">La forme standard SQL s'écrit <code>SUBSTRING(texte FROM depart FOR longueur)</code>. PostgreSQL et MySQL l'acceptent ; SQL Server exige la forme à virgules. La forme à virgules fonctionne partout : préfère-la.</div>

<h3>4. LEFT et RIGHT : les raccourcis des bords</h3>
<p><code>LEFT(texte, n)</code> prend les <code>n</code> premiers caractères, <code>RIGHT(texte, n)</code> les <code>n</code> derniers. Ce sont des raccourcis pratiques, mais <code>RIGHT</code> rend un vrai service : sans lui, prendre les derniers caractères oblige à calculer une position à partir de la longueur.</p>
<pre class="pseudo">SELECT LEFT('5000 Namur', 4);        -- '5000'   : les 4 premiers caracteres (le code postal)
SELECT RIGHT('5000 Namur', 5);       -- 'Namur'  : les 5 derniers caracteres

-- Equivalences avec SUBSTRING :
LEFT(txt, 4)   =  SUBSTRING(txt, 1, 4)                      -- toujours a partir de la position 1
RIGHT(txt, 5)  =  SUBSTRING(txt, LENGTH(txt) - 5 + 1, 5)    -- il faut calculer la position de depart

-- Un cas frequent : l'initiale du prenom
SELECT LEFT(prenom, 1) AS initiale FROM CLIENT;   -- 'Jean' donne 'J'</pre>

<h3>5. Les différences entre SGBD</h3>
<div class="tip"><strong>MySQL / MariaDB</strong> : <code>SUBSTRING</code>, <code>SUBSTR</code> (synonyme), <code>MID</code> (synonyme), <code>LEFT</code>, <code>RIGHT</code>. Tout est présent.<br>
<strong>PostgreSQL</strong> : <code>SUBSTRING</code> et <code>SUBSTR</code>, <code>LEFT</code> et <code>RIGHT</code> (depuis la version 9.1). Bonus : <code>LEFT(txt, -1)</code> retire le dernier caractère.<br>
<strong>SQL Server</strong> : <code>SUBSTRING</code> seulement (pas de <code>SUBSTR</code>), et la <strong>longueur est obligatoire</strong> — il n'existe pas de forme à deux arguments. <code>LEFT</code> et <code>RIGHT</code> existent.<br>
<strong>Oracle / SQLite</strong> : <code>SUBSTR</code> (SUBSTRING n'existe pas en Oracle), pas de <code>LEFT</code>/<code>RIGHT</code> en Oracle.</div>
<pre class="pseudo">-- « Tout a partir de la position 9 », selon le SGBD :
SUBSTRING(code, 9)                    -- MySQL, PostgreSQL : longueur facultative
SUBSTRING(code, 9, LEN(code))         -- SQL Server : longueur OBLIGATOIRE, on met la longueur totale
SUBSTR(code, 9)                       -- Oracle, SQLite</pre>
<div class="warn">Ne jamais dépasser les bornes n'est pas grave : <code>SUBSTRING('Namur', 3, 99)</code> renvoie <code>'mur'</code> sans erreur. En revanche, un départ à 0 ou négatif se comporte différemment selon le SGBD — évite-le.</div>

<h3>6. Découper dynamiquement, avec la position d'un séparateur</h3>
<p>Découper à une position fixe ne marche que si le format est rigoureusement constant. Dès que la longueur varie, il faut trouver la position du séparateur — nous verrons <code>POSITION</code> en détail demain, mais voici le principe.</p>
<pre class="pseudo">-- Extraire le domaine d'un email, quelle que soit la longueur de l'identifiant :
SELECT email                                        AS avant,      -- 'jean.dupont@mail.be'
       SUBSTRING(email, POSITION('@' IN email) + 1) AS domaine     -- 'mail.be'
FROM CLIENT;
-- POSITION('@' IN email) renvoie 12 ; on demarre donc a 13, juste apres l'arobase

-- Et la partie avant l'arobase :
SELECT SUBSTRING(email, 1, POSITION('@' IN email) - 1) AS identifiant   -- 'jean.dupont'
FROM CLIENT;</pre>
<div class="warn">Piège classique : si le caractère cherché est absent, <code>POSITION</code> renvoie 0. <code>SUBSTRING(email, 0 + 1)</code> renverra alors l'email entier au lieu du domaine — un résultat faux, sans erreur. Il faut donc filtrer les lignes valides ou prévoir un <code>CASE WHEN</code> (jour 14).</div>

<h3>7. Un cas concret complet</h3>
<pre class="pseudo">-- Table COMMANDE, colonne reference au format 'BE-2024-001234'
SELECT reference                     AS ref_complete,   -- 'BE-2024-001234'
       LEFT(reference, 2)            AS pays,           -- 'BE'  : les 2 premiers caracteres
       SUBSTRING(reference, 4, 4)    AS annee,          -- '2024' : 4 caracteres a partir du 4e
       RIGHT(reference, 6)           AS numero          -- '001234' : les 6 derniers
FROM COMMANDE
WHERE LENGTH(reference) = 14;        -- securite : on ne decoupe que les references au bon format</pre>`,
  exercises: [
    { type: "qcm", q: "En SQL, quel est le numéro du premier caractère d'une chaîne ?", opts: ["0", "1", "-1", "Cela dépend du SGBD"], a: 1, exp: "La numérotation SQL commence à 1, contrairement à la plupart des langages de programmation." },
    { type: "input", q: "Complète : SELECT ______('FR-2024', 4, 4); — la fonction standard d'extraction de sous-chaîne.", a: ["substring"], ph: "une fonction", exp: "SUBSTRING(texte, depart, longueur) est la forme standard." },
    { type: "qcm", q: "Que renvoie SUBSTRING('Namur', 3, 2) ?", opts: ["'Na'", "'am'", "'mu'", "'ur'"], a: 2, exp: "On part du 3e caractère ('m') et on en prend 2 : 'mu'." },
    { type: "input", q: "Complète : SELECT ______(prenom, 1) AS initiale; — la fonction qui prend les n premiers caractères.", a: ["left"], ph: "une fonction", exp: "LEFT(prenom, 1) renvoie la première lettre." },
    { type: "qcm", q: "Que renvoie RIGHT('5000 Namur', 5) ?", opts: ["'5000 '", "'Namur'", "'50000'", "' Namu'"], a: 1, exp: "RIGHT prend les 5 derniers caractères, soit 'Namur'." },
    { type: "vf", q: "SUBSTRING('Namur', 3, 99) provoque une erreur car 99 dépasse la longueur.", a: false, exp: "Aucune erreur : le SGBD renvoie simplement tout ce qui reste, soit 'mur'." },
    { type: "input", q: "Complète l'équivalent de LEFT(txt, 4) : SUBSTRING(txt, ______, 4);", a: ["1"], ph: "un nombre", exp: "LEFT(txt, n) équivaut à SUBSTRING(txt, 1, n)." },
    { type: "qcm", q: "Quelle particularité SUBSTRING a-t-elle sur SQL Server ?", opts: ["Elle s'appelle SUBSTR", "La longueur est obligatoire", "Elle commence à 0", "Elle n'existe pas"], a: 1, exp: "SQL Server n'accepte pas la forme à deux arguments : il faut toujours fournir une longueur." },
    { type: "vf", q: "SUBSTR est un synonyme de SUBSTRING en MySQL et PostgreSQL.", a: true, exp: "Les deux noms coexistent. En revanche Oracle ne connaît que SUBSTR, et SQL Server que SUBSTRING." },
    { type: "input", q: "Complète pour extraire le domaine d'un email : SUBSTRING(email, POSITION('@' IN email) ______ 1);", a: ["+"], ph: "un opérateur", exp: "On démarre juste APRÈS l'arobase, donc à sa position plus 1." },
    { type: "qcm", q: "Pourquoi préférer POSITION à une position fixe pour découper un email ?", opts: ["C'est plus rapide", "Parce que la longueur de l'identifiant varie d'un email à l'autre", "Parce que SUBSTRING est déprécié", "Pour économiser de la mémoire"], a: 1, exp: "Une position codée en dur ne fonctionne que si le format est rigoureusement constant." },
    { type: "qcm", q: "Que se passe-t-il si POSITION ne trouve pas le caractère cherché ?", opts: ["Une erreur est levée", "Elle renvoie 0, ce qui fausse silencieusement le SUBSTRING", "Elle renvoie NULL toujours", "Elle renvoie la longueur de la chaîne"], a: 1, exp: "Le retour 0 donne un SUBSTRING à partir de la position 1 : un résultat faux, sans alerte." },
    { type: "input", q: "Complète pour extraire l'année de 'BE-2024-001234' : SUBSTRING(reference, 4, ______);", a: ["4"], ph: "un nombre", exp: "L'année occupe 4 caractères à partir de la position 4." },
    { type: "vf", q: "LEFT et RIGHT existent en Oracle.", a: false, exp: "Oracle n'a ni LEFT ni RIGHT : on y utilise SUBSTR, avec un départ négatif pour la fin." },
    { type: "qcm", q: "Quel WHERE sécurise un découpage à position fixe ?", opts: ["WHERE reference IS NOT NULL", "WHERE LENGTH(reference) = 14", "WHERE reference LIKE '%-%'", "Aucun n'est utile"], a: 1, exp: "Vérifier la longueur garantit que le format attendu est respecté avant de découper." }
  ],
  final: {
    title: "Exercice final — Éclater un code produit",
    intro: `<p>Table <code>PRODUIT</code>, colonne <code>code</code> au format <code>PAYS-ANNEE-NUMERO</code> (2 + 4 + 6 caractères, séparés par des tirets).</p>
<pre class="pseudo">id | code             | email_contact
---+------------------+-----------------------
 1 | 'BE-2024-000457' | 'achat@delta.be'
 2 | 'FR-2023-001200' | 'jean.dupont@omega.fr'
 3 | 'NL-2024-000031' | 'info@beta.nl'
 4 | 'BE-2022-009999' | 'contact-sans-arobase'</pre>`,
    questions: [
      { type: "qcm", q: "Quelle expression extrait le pays ?", opts: ["RIGHT(code, 2)", "LEFT(code, 2)", "SUBSTRING(code, 2, 2)", "SUBSTRING(code, 0, 2)"], a: 1, exp: "LEFT(code, 2) prend les deux premiers caractères, soit 'BE'." },
      { type: "qcm", q: "Quelle expression extrait l'année ?", opts: ["SUBSTRING(code, 3, 4)", "SUBSTRING(code, 4, 4)", "LEFT(code, 4)", "RIGHT(code, 4)"], a: 1, exp: "Le tiret occupe la position 3 ; l'année commence donc en position 4." },
      { type: "qcm", q: "Quelle expression extrait le numéro à six chiffres ?", opts: ["RIGHT(code, 6)", "LEFT(code, 6)", "SUBSTRING(code, 6, 6)", "SUBSTRING(code, 1, 6)"], a: 0, exp: "Le numéro est en fin de chaîne : RIGHT(code, 6)." },
      { type: "vf", q: "SUBSTRING(email_contact, POSITION('@' IN email_contact) + 1) donne un résultat correct pour la ligne 4.", a: false, exp: "Il n'y a pas d'arobase : POSITION renvoie 0, donc SUBSTRING part de la position 1 et renvoie toute la chaîne." },
      { type: "qcm", q: "Comment protéger le découpage des emails sans arobase ?", opts: ["Ajouter un index", "Filtrer avec WHERE POSITION('@' IN email_contact) > 0", "Utiliser LEFT au lieu de SUBSTRING", "Utiliser TRIM"], a: 1, exp: "On ne découpe que les lignes contenant réellement le séparateur." }
    ],
    solution: `<pre class="pseudo">-- 1) ECLATER le code produit en trois colonnes
SELECT id,
       code                        AS code_complet,   -- 'BE-2024-000457'
       LEFT(code, 2)               AS pays,           -- 'BE'     : 2 premiers caracteres
       SUBSTRING(code, 4, 4)       AS annee,          -- '2024'   : 4 caracteres a partir du 4e
       RIGHT(code, 6)              AS numero          -- '000457' : 6 derniers caracteres
FROM PRODUIT
WHERE LENGTH(code) = 14;           -- securite : on ne decoupe que les codes au format attendu

-- 2) DECOUPER l'email, uniquement quand l'arobase existe
SELECT id,
       email_contact                                              AS email,
       SUBSTRING(email_contact, 1, POSITION('@' IN email_contact) - 1) AS identifiant,  -- avant l'arobase
       SUBSTRING(email_contact, POSITION('@' IN email_contact) + 1)    AS domaine       -- apres l'arobase
FROM PRODUIT
WHERE POSITION('@' IN email_contact) &gt; 0;   -- exclut la ligne 4, qui n'a pas d'arobase

-- 3) COMPTER les produits par pays, en s'appuyant sur le decoupage
SELECT LEFT(code, 2) AS pays,
       COUNT(*)      AS nb_produits
FROM PRODUIT
GROUP BY LEFT(code, 2)             -- on regroupe sur l'expression, pas sur l'alias
ORDER BY nb_produits DESC;
-- attendu : 'BE' -&gt; 2, 'FR' -&gt; 1, 'NL' -&gt; 1

-- Variante SQL Server : SUBSTRING exige une longueur, donc
-- SUBSTRING(email_contact, CHARINDEX('@', email_contact) + 1, LEN(email_contact))</pre>
<p>Tu sais découper. Demain : l'opération inverse — assembler des morceaux et mesurer des chaînes.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta requête SQL ici…",
  items: [
  { id: "sgbd-j04", title: "Extraire le code postal et la ville", level: 2,
    statement: "Table <code>LIVRAISON(id, adresse_ville)</code>, où la colonne contient un code postal belge de 4 chiffres, un espace, puis le nom de la ville :<pre class='pseudo'>id | adresse_ville\n---+------------------\n 1 | '5000 Namur'\n 2 | '4000 Liege'\n 3 | '1000 Bruxelles'\n 4 | '6000 Charleroi'</pre>Écris une requête qui affiche l'identifiant, le code postal seul, la ville seule (en majuscules), et la longueur du nom de la ville. Trie par code postal croissant.",
    hints: [
      "Le code postal fait toujours 4 caractères et se trouve au début : LEFT.",
      "La ville commence en position 6 (4 chiffres + 1 espace) : SUBSTRING sans longueur, ou avec une longueur généreuse.",
      "Pour la longueur : LENGTH sur la partie déjà extraite (LEN en SQL Server)."
    ],
    solution: "SELECT id,\n       LEFT(adresse_ville, 4)                     AS code_postal,   -- les 4 premiers caracteres\n       UPPER(SUBSTRING(adresse_ville, 6))         AS ville,         -- a partir du 6e caractere jusqu'a la fin, en majuscules\n       LENGTH(SUBSTRING(adresse_ville, 6))        AS long_ville     -- nombre de caracteres du nom de ville\nFROM LIVRAISON\nORDER BY code_postal ASC;                                           -- tri croissant sur le code postal\n\n-- Resultat attendu :\n-- id | code_postal | ville        | long_ville\n-- ---+-------------+--------------+-----------\n--  3 | '1000'      | 'BRUXELLES'  |    10\n--  2 | '4000'      | 'LIEGE'      |     5\n--  1 | '5000'      | 'NAMUR'      |     5\n--  4 | '6000'      | 'CHARLEROI'  |     9\n\n-- Position 6 : les positions 1 a 4 contiennent le code postal, la position 5 l'espace.\n\n-- Variante SQL Server (longueur obligatoire dans SUBSTRING) :\n-- UPPER(SUBSTRING(adresse_ville, 6, LEN(adresse_ville))) AS ville",
    note: "Piège : le code postal extrait par LEFT reste du TEXTE, pas un nombre. Le tri '1000' < '4000' fonctionne ici par chance car tous les codes ont 4 chiffres ; avec des longueurs différentes, le tri alphabétique placerait '10' avant '9'. Bonne pratique : convertir en nombre avec CAST (jour 9) dès qu'on trie ou compare des valeurs numériques stockées en texte." }
  ]
};
</script>
