<script>
var DAY = {
  num: 21,
  title: "Récapitulatif : la Ludothèque C assemblée (examen)",
  subtitle: "Tout le capstone en une épreuve : architecture, base, métier, sécurité, mémoire.",
  theory: `
<h3>Ce que tu as construit</h3>
<p>Une application <strong>C</strong> complète et <strong>en couches</strong>, qui réunit tout le cursus : le langage, la conception Merise, le SQL et MySQL. Rappel : une <strong>couche</strong> est un étage du programme avec un rôle précis, qui ne parle qu'à l'étage en dessous. Voici la carte du projet, de la surface (ce que voit l'utilisateur) jusqu'au fond (là où sont rangées les données).</p>
<pre class="pseudo">UI (ui.c)        menus par rôle, lecture/affichage, aucune règle
   ↓
Services (services.c)  DÉCIDENT : tarifs, stocks, transactions, autorisation
   ↓
DAO (dao.c)      accès MySQL : requêtes préparées, mapping ↔ struct
   ↓
MySQL            tables (jeu, categorie, utilisateur, location, vente)</pre>
<p>De haut en bas : l'<strong>UI</strong> (interface utilisateur) lit les saisies et affiche, sans jamais décider ; les <strong>services</strong> portent la logique <strong>métier</strong> (les règles de gestion) ; le <strong>DAO</strong> (<em>Data Access Object</em>) traduit entre les lignes SQL et les <strong>struct</strong> du C ; <strong>MySQL</strong> range durablement les données dans des <strong>tables</strong>. Le parcours des trois semaines :</p>
<pre class="pseudo">Semaine 1 — Fondations : architecture, connexion, schéma, struct, DAO, injection, services
Semaine 2 — Métier : validation, rôles, auth, autorisation, louer, acheter, UI
Semaine 3 — Livraison : recherche/pagination, espaces, mémoire, tests, config, build</pre>
<div class="tip">Les cinq réflexes du capstone : (1) le métier dans les services, (2) requêtes préparées partout, (3) transactions pour les opérations multi-écritures, (4) autorisation à chaque action, (5) mémoire disciplinée (un <code>malloc</code> = un <code>free</code>).</div>
<div class="warn">La version <strong>outillée</strong> (Niveau 8) reprendra ce projet avec Git, Docker et CI/CD dès le premier commit : mêmes règles, mais industrialisées et sécurisées d'un même geste.</div>`,
  exercises: [
    { type: "qcm", q: "Les règles métier vivent dans…", opts: ["l'UI", "les services", "le DAO", "MySQL"], a: 1, exp: "La couche qui décide." },
    { type: "qcm", q: "Contre l'injection SQL, on utilise…", opts: ["la concaténation", "les requêtes préparées", "des logs", "un enum"], a: 1, exp: "Paramètres liés." },
    { type: "qcm", q: "Louer et acheter s'exécutent dans…", opts: ["une transaction (atomicité)", "l'UI", "un fichier", "aucune protection"], a: 0, exp: "Tout ou rien." },
    { type: "qcm", q: "L'autorisation se vérifie…", opts: ["une fois au démarrage", "à chaque opération sensible, dans le service", "à l'affichage seulement", "jamais"], a: 1, exp: "Contrôle systématique." },
    { type: "qcm", q: "Le mot de passe est stocké…", opts: ["en clair", "sous forme de hash", "dans le code", "dans l'UI"], a: 1, exp: "Jamais en clair." },
    { type: "qcm", q: "Le DAO mappe…", opts: ["rôle ↔ menu", "lignes SQL ↔ struct", "prix ↔ stock", "requête ↔ affichage"], a: 1, exp: "Base ↔ C." },
    { type: "qcm", q: "Un catalogue de taille inconnue se charge…", opts: ["en tableau fixe", "par allocation dynamique, libérée ensuite", "par un tableau global", "dans l'UI"], a: 1, exp: "malloc + free." },
    { type: "qcm", q: "Le prix d'une vente est…", opts: ["recalculé plus tard", "figé au moment de l'achat", "arrondi à l'unité", "celui de location"], a: 1, exp: "Historique fidèle." },
    { type: "qcm", q: "Les tests renvoient…", opts: ["toujours 0", "0 si tout passe, 1 sinon (pour la CI)", "le nombre de jeux", "rien"], a: 1, exp: "Code de sortie exploitable." },
    { type: "qcm", q: "Les secrets (mot de passe DB) viennent…", opts: ["du code", "de l'environnement (getenv)", "de l'UI", "d'un printf"], a: 1, exp: "Jamais dans le dépôt." },
    { type: "vf", q: "Cacher une option dans le menu suffit à sécuriser une action.", a: false, exp: "Faux : la barrière est le contrôle côté service." },
    { type: "qcm", q: "La pagination se fait…", opts: ["en mémoire", "côté base (LIMIT/OFFSET)", "dans l'UI", "jamais"], a: 1, exp: "On ne rapatrie que la page." },
    { type: "qcm", q: "Un malloc va toujours avec…", opts: ["un printf", "un free", "un COMMIT", "un scanf"], a: 1, exp: "Sinon fuite." },
    { type: "qcm", q: "L'UI, dans l'architecture, doit…", opts: ["décider des règles", "lire, déléguer au service, afficher", "faire le SQL", "gérer les transactions"], a: 1, exp: "Mince et déléguée." },
    { type: "qcm", q: "La version outillée ajoutera…", opts: ["rien", "Git, Docker, CI/CD dès le départ", "un autre langage", "une interface graphique"], a: 1, exp: "Industrialisation." }
  ],
  final: {
    title: "Épreuve finale — Relire une opération complète",
    intro: `<p>Voici service_louer. Vérifie qu'il respecte les cinq réflexes du capstone :</p>
<pre class="pseudo">Code service_louer(MYSQL *c, int uid, int jeu_id, int jours) {   // louer le jeu jeu_id à l'utilisateur uid pour "jours" jours
    if (valider_duree(jours) != OK) return ERR_SAISIE;          // 1) valide la saisie (durée) avant tout
    mysql_query(c, "START TRANSACTION");                        // 2) ouvre la transaction (atomicité : tout ou rien)
    Jeu j;                                                      // fiche vide pour recevoir les infos du jeu
    if (dao_jeu_par_id(c, jeu_id, &amp;j) != 0) { mysql_query(c,"ROLLBACK"); return ERR_DB; }   // lit le jeu ; échec → annuler
    if (!service_peut_louer(&amp;j))            { mysql_query(c,"ROLLBACK"); return ERR_STOCK; } // 3) RÈGLE MÉTIER : stock insuffisant → annuler
    if (dao_inserer_location(c, uid, jeu_id, jours) != 0 ||     // insère la location ; si échec OU…
        dao_decrementer_stock_loc(c, jeu_id) != 0) { mysql_query(c,"ROLLBACK"); return ERR_DB; }   // …baisse du stock échoue → annuler
    mysql_query(c, "COMMIT");                                   // 4) tout a réussi → valider définitivement
    return OK;                                                  // 5) succès de la location
}</pre>`,
    questions: [
      { type: "qcm", q: "La règle de disponibilité est vérifiée…", opts: ["dans l'UI", "dans le service (service_peut_louer)", "dans le DAO", "nulle part"], a: 1, exp: "Le métier décide." },
      { type: "qcm", q: "L'opération est-elle atomique ?", opts: ["non", "oui : START TRANSACTION ... COMMIT / ROLLBACK", "seulement l'INSERT", "seulement l'UPDATE"], a: 1, exp: "Tout ou rien." },
      { type: "qcm", q: "La saisie (jours) est…", opts: ["ignorée", "validée avant d'agir", "affichée", "concaténée"], a: 1, exp: "valider_duree en premier." },
      { type: "qcm", q: "Où insère-t-on l'accès aux données ?", opts: ["dans l'UI", "via le DAO (dao_*), depuis le service", "en dur dans main", "dans un printf"], a: 1, exp: "Le service orchestre le DAO." },
      { type: "qcm", q: "Que manquerait-il pour un contexte multi-utilisateurs ?", opts: ["rien de plus", "un verrouillage (SELECT ... FOR UPDATE) pour éviter la double location", "un cache mémoire", "une file d'attente"], a: 1, exp: "Concurrence : verrouiller la ligne lue." }
    ],
    solution: `<pre class="pseudo">Flux d'une location, à travers les couches :
  ui_louer (ui.c)               lit jeu_id et jours, appelle le service
    → service_louer (services.c)
        valider_duree(jours)         (validation)
        START TRANSACTION            (atomicité)
        dao_jeu_par_id(...)          (DAO / mapping)
        service_peut_louer(&amp;j)       (RÈGLE MÉTIER : stock)
        dao_inserer_location(...)    (requête préparée)
        dao_decrementer_stock_loc()  (UPDATE)
        COMMIT ou ROLLBACK
    → code_message(r)                l'UI affiche le résultat</pre>
<p>Les cinq réflexes sont là : métier dans le service, requêtes préparées, transaction, contrôle du stock, gestion propre des erreurs. Bravo — tu as bâti une application C complète et solide. La version outillée t'attend au Niveau 8 !</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code C ici…",
  items: [
  { id: "projc-l21", title: "Synthèse — statistiques du catalogue", level: 3,
    statement: "Écris une fonction service_valeur_stock(const Jeu *tab, int n) qui renvoie la valeur totale du stock de vente (somme de prix_achat × stock_vente sur tout le catalogue). Fonction pure, testable sans base.",
    hints: [
      "Parcours de 0 à n-1.",
      "somme += tab[i].prix_achat * tab[i].stock_vente;",
      "Renvoie un double ; aucune dépendance à MySQL."
    ],
    lang: "c",
    atoi: { cmd: "gcc prog.c -o prog && ./prog", expected: "valeur totale = 81.00" },
    checklist: [
      "Parcours-tu bien les indices de 0 à n-1 ?",
      "Accumules-tu prix_achat × stock_vente pour chaque jeu ?",
      "Le total est-il un double, initialisé à 0.0 ?",
      "La fonction reste-t-elle pure (aucun accès base ni écran) ?"
    ],
    solution: "#include <stdio.h>\n\ntypedef struct {            /* extrait de modele.h */\n    double prix_achat;\n    int    stock_vente;\n} Jeu;\n\ndouble service_valeur_stock(const Jeu *tab, int n) {\n    double total = 0.0;\n    for (int i = 0; i < n; i++)\n        total += tab[i].prix_achat * tab[i].stock_vente;\n    return total;\n}\nint main(void) {\n    Jeu cat[] = {\n        { .prix_achat = 10.0, .stock_vente = 3 },\n        { .prix_achat = 25.5, .stock_vente = 2 },\n        { .prix_achat =  5.0, .stock_vente = 0 }\n    };\n    printf(\"valeur totale = %.2f\\n\", service_valeur_stock(cat, 3));\n    return 0;\n}",
    note: "Une fonction pure de synthèse : elle ne touche ni la base ni l'écran, donc se teste instantanément (leçon 18). Elle réunit struct, tableau et calcul — l'esprit du capstone. Félicitations d'être arrivée au bout !" }
  ]
};
