<script>
var DAY = {
  num: 11,
  title: "Autorisation : contrôle d'accès selon le rôle",
  subtitle: "Authentifié ≠ tout permis : chaque opération sensible vérifie le rôle.",
  theory: `
<h3>1. Authentification vs autorisation</h3>
<p>Deux mots qui se ressemblent mais désignent deux étapes différentes. L'<strong>authentification</strong> répond à « <em>qui</em> es-tu ? » : elle vérifie l'identité (leçon 10), un peu comme le vigile qui contrôle votre carte d'identité à l'entrée. L'<strong>autorisation</strong> répond à « as-tu le <em>droit</em> de faire ceci ? » : elle vérifie les permissions, comme le badge qui n'ouvre que certaines portes. Une fois reconnu, l'utilisateur n'a droit qu'à ce que son <strong>rôle</strong> permet — être entré dans le bâtiment ne donne pas accès à toutes les pièces.</p>

<h3>2. Des gardes centralisés</h3>
<p>Un <strong>garde</strong> est une petite fonction dont le seul travail est de répondre par oui ou non à la question « untel a-t-il ce droit ? ». On les regroupe pour n'avoir la règle qu'à un seul endroit.</p>
<pre class="pseudo">int peut_gerer_stock(const Utilisateur *u) {          // renvoie vrai (1) si u a le droit de gérer le stock
    return u->role == VENDEUR || u->role == ADMIN;    // vrai si le rôle vaut VENDEUR OU ADMIN
}
int peut_administrer(const Utilisateur *u) {          // renvoie vrai (1) si u a le droit d'administrer
    return u->role == ADMIN;                          // vrai uniquement si le rôle vaut ADMIN
}</pre>
<p>Le type <code>int</code> renvoyé sert de « vrai/faux » : 1 signifie vrai, 0 signifie faux. La flèche <code>-&gt;</code> dans <code>u-&gt;role</code> se lit « le champ <code>role</code> de la fiche pointée par <code>u</code> » : on l'utilise à la place du point <code>.</code> quand on tient un <strong>pointeur</strong> (une adresse) plutôt que la fiche elle-même. Le double barre <code>||</code> veut dire « OU » (l'un ou l'autre suffit), et <code>==</code> compare deux valeurs. Ces petites fonctions concentrent les règles d'accès. On les appelle au début de chaque service sensible, plutôt que de disperser des <code>if (role == ...)</code> un peu partout — où l'on finirait par en oublier un.</p>

<h3>3. Vérifier dans le service, pas seulement dans l'UI</h3>
<pre class="pseudo">Code service_reappro(const Utilisateur *u, MYSQL *c, int jeu_id, int n) {   // réapprovisionner le jeu jeu_id de n unités
    if (!peut_gerer_stock(u)) return ERR_DROIT;   // refuse AVANT toute action si l'utilisateur n'a pas le droit
    if (n &lt;= 0)              return ERR_SAISIE;   // n doit être strictement positif, sinon saisie invalide
    return dao_ajouter_stock(c, jeu_id, n);       // tout est bon : on délègue l'écriture en base au DAO
}</pre>
<p>Le point d'exclamation <code>!</code> veut dire « non » : <code>!peut_gerer_stock(u)</code> se lit « si u n'a PAS le droit ». Le contrôle est placé en <strong>premier</strong> : on refuse tôt, avant d'avoir touché à quoi que ce soit. <code>ERR_DROIT</code> et <code>ERR_SAISIE</code> sont des <strong>codes de retour</strong> (des étiquettes de résultat) que l'UI traduira en message.</p>
<div class="warn">Cacher un bouton dans le menu ne suffit PAS : c'est du confort, pas de la sécurité. La vraie barrière est le contrôle dans le <strong>service</strong>, exécuté à chaque appel — car un utilisateur malveillant pourrait déclencher l'action autrement (en modifiant le programme, en appelant la fonction directement…).</div>

<h3>4. Le principe du moindre privilège</h3>
<p>Chaque rôle reçoit le <strong>minimum</strong> de droits nécessaires à sa tâche, et rien de plus. Le client ne peut pas gérer le stock ; le vendeur ne peut pas gérer les comptes. En cas de doute, on <strong>refuse</strong> : c'est la règle du « <em>deny by default</em> » (refus par défaut). Mieux vaut une action bloquée à tort qu'une action dangereuse autorisée à tort.</p>
<div class="tip">Centraliser les gardes rend l'<strong>audit</strong> (la vérification a posteriori) facile : pour savoir qui peut réapprovisionner, on lit une seule fonction. Ajouter un rôle ou une règle se fait à un seul endroit.</div>`,
  exercises: [
    { type: "qcm", q: "L'autorisation répond à…", opts: ["qui es-tu ?", "as-tu le droit de faire ceci ?", "quel prix ?", "quel stock ?"], a: 1, exp: "Les droits, après l'identité." },
    { type: "qcm", q: "Un utilisateur authentifié a-t-il tous les droits ?", opts: ["Oui", "Non : seulement ceux de son rôle", "Selon l'heure", "Toujours"], a: 1, exp: "Authentifié ≠ tout permis." },
    { type: "qcm", q: "Les gardes (peut_gerer_stock…) servent à…", opts: ["afficher", "centraliser les règles d'accès", "trier", "chiffrer"], a: 1, exp: "Une seule source pour l'audit." },
    { type: "qcm", q: "Où vérifier l'autorisation ?", opts: ["dans l'UI seulement", "dans le service, à chaque opération sensible", "nulle part", "dans le Makefile"], a: 1, exp: "La vraie barrière est côté service." },
    { type: "qcm", q: "Cacher un bouton dans le menu…", opts: ["suffit à sécuriser", "est du confort, pas de la sécurité", "remplace le contrôle", "est inutile"], a: 1, exp: "L'action pourrait être déclenchée autrement." },
    { type: "qcm", q: "peut_gerer_stock autorise…", opts: ["le client", "vendeur et admin", "tout le monde", "personne"], a: 1, exp: "Pas le client." },
    { type: "qcm", q: "Le principe du moindre privilège :", opts: ["tout permettre", "donner le minimum de droits nécessaires", "un seul rôle", "aucun contrôle"], a: 1, exp: "Sécurité par défaut." },
    { type: "qcm", q: "En cas de doute sur un droit, on…", opts: ["autorise", "refuse (deny by default)", "demande à l'UI", "ignore"], a: 1, exp: "Refus par défaut." },
    { type: "qcm", q: "Un service refuse un accès en renvoyant…", opts: ["OK", "ERR_DROIT", "le stock", "rien"], a: 1, exp: "Un code d'accès refusé." },
    { type: "qcm", q: "Le contrôle d'accès s'exécute…", opts: ["une seule fois au démarrage", "à chaque appel du service sensible", "à l'affichage seulement", "jamais"], a: 1, exp: "Systématiquement." },
    { type: "vf", q: "Masquer une option dans le menu remplace le contrôle côté service.", a: false, exp: "Faux : c'est du confort ; le contrôle réel est dans le service." },
    { type: "qcm", q: "Centraliser les gardes facilite…", opts: ["les fuites", "l'audit et l'ajout de règles", "les injections", "rien"], a: 1, exp: "Un seul endroit à lire/modifier." },
    { type: "qcm", q: "peut_administrer autorise…", opts: ["le client", "le vendeur", "seulement l'admin", "tout le monde"], a: 2, exp: "Gestion des comptes réservée." },
    { type: "qcm", q: "Le contrôle vient AVANT…", opts: ["après l'écriture", "toute action (on refuse tôt)", "l'affichage", "jamais"], a: 1, exp: "On bloque avant d'agir." },
    { type: "qcm", q: "Un vendeur peut-il gérer les comptes ?", opts: ["Oui", "Non (réservé admin)", "Selon l'heure", "Toujours"], a: 1, exp: "Moindre privilège." }
  ],
  final: {
    title: "Exercice final — Protéger une action admin",
    intro: `<p>Supprimer un compte est réservé à l'admin. Analyse :</p>
<pre class="pseudo">Code service_supprimer_compte(const Utilisateur *u, MYSQL *c, int cible_id) {   // supprimer le compte n° cible_id
    return dao_supprimer_utilisateur(c, cible_id);   // PROBLÈME : supprime sans vérifier que u en a le droit
}</pre>`,
    questions: [
      { type: "qcm", q: "Que manque-t-il ?", opts: ["rien", "un contrôle d'autorisation : peut_administrer(u)", "un printf", "un sleep"], a: 1, exp: "N'importe qui pourrait supprimer un compte." },
      { type: "qcm", q: "Si u n'est pas admin, on renvoie…", opts: ["OK", "ERR_DROIT", "on supprime quand même", "ERR_DB"], a: 1, exp: "Accès refusé." },
      { type: "qcm", q: "Le contrôle vient…", opts: ["après la suppression", "avant, tout au début du service", "dans l'UI seulement", "jamais"], a: 1, exp: "On refuse avant d'agir." },
      { type: "qcm", q: "Suffit-il de cacher l'option dans le menu admin ?", opts: ["Oui", "Non : le service doit vérifier lui-même", "Selon le rôle", "Toujours"], a: 1, exp: "Le menu n'est pas une barrière de sécurité." },
      { type: "qcm", q: "Bonus de sécurité possible :", opts: ["aucun", "empêcher un admin de se supprimer lui-même", "supprimer plus vite", "logger le mot de passe"], a: 1, exp: "Éviter de se verrouiller / cas limites." }
    ],
    solution: `<pre class="pseudo">Code service_supprimer_compte(const Utilisateur *u, MYSQL *c, int cible_id) {   // supprimer le compte cible_id
    if (!peut_administrer(u)) return ERR_DROIT;      // seul l'admin peut supprimer un compte
    if (u->id == cible_id)    return ERR_SAISIE;     // garde-fou : on ne se supprime pas soi-même
    return dao_supprimer_utilisateur(c, cible_id) == 0 ? OK : ERR_DB;   // DAO renvoie 0 si succès → OK, sinon ERR_DB
}</pre>
<p>Contrôle d'autorisation en premier, garde-fou sur soi-même, retour d'un code parlant. La sécurité est dans le service, pas dans le menu. Demain : louer un jeu avec une transaction.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code C ici…",

  { id: "projc-l11", title: "Un garde pour les statistiques", level: 2,
    statement: "Écris service_statistiques(const Utilisateur *u, MYSQL *c) qui n'autorise que l'admin (renvoie ERR_DROIT sinon), puis délègue à dao_statistiques(c) et renvoie OK ou ERR_DB selon son résultat (0 = succès).",
    hints: [
      "Commence par le contrôle : if (!peut_administrer(u)) return ERR_DROIT;",
      "Appelle dao_statistiques(c) et teste son retour.",
      "Renvoie OK si 0, ERR_DB sinon."
    ],
    solution: "typedef enum { OK, ERR_STOCK, ERR_SAISIE, ERR_DROIT, ERR_DB } Code;   // les codes de resultat possibles\n\nint peut_administrer(const Utilisateur *u) {   // renvoie vrai si u est administrateur\n    return u->role == ADMIN;                   // seul le role ADMIN donne ce droit\n}\n\nCode service_statistiques(const Utilisateur *u, MYSQL *c) {   // afficher les statistiques (admin seulement)\n    if (!peut_administrer(u))                  // si l'utilisateur n'est PAS admin\n        return ERR_DROIT;                      // controle d'acces d'abord : on refuse\n    return dao_statistiques(c) == 0 ? OK : ERR_DB;   // DAO renvoie 0 si succes -> OK, sinon ERR_DB\n}",
    note: "Le contrôle d'accès s'exécute en tout premier, avant tout travail. Le service traduit ensuite le résultat du DAO en Code métier. Une barrière fiable, au bon endroit." }
  ]
};
