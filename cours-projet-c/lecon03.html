<script>
var DAY = {
  num: 3,
  title: "Du MCD Merise au schéma SQL",
  subtitle: "Traduire le modèle conceptuel de la Ludothèque en tables MySQL prêtes à recevoir des données.",
  theory: `
<h3>1. Du conceptuel au physique</h3>
<p>Le cours <strong>Merise</strong> (une méthode française de conception de bases de données) a produit le <strong>MCD</strong> — le <em>Modèle Conceptuel de Données</em> — de la Ludothèque. Un MCD est un dessin qui décrit les données <em>en idées</em>, avant tout code : des <strong>entités</strong> (les grands objets du domaine : Jeu, Catégorie, Utilisateur) et des <strong>associations</strong> (les liens entre eux : « un jeu appartient à une catégorie »). Une entité est un « type de chose » qu'on veut mémoriser, comme une case à cocher dans un formulaire répétée pour chaque objet.</p>
<p>Passer du <strong>conceptuel</strong> (les idées) au <strong>physique</strong> (la base réelle), c'est traduire ce dessin en <strong>tables</strong> SQL. Une <strong>table</strong> est un tableau à lignes et colonnes : chaque colonne est une information (nom, prix…), chaque ligne est un objet concret (un jeu précis). On y ajoute des <strong>clés primaires</strong> et des <strong>clés étrangères</strong>, définies plus bas.</p>

<h3>2. La table categorie et la table jeu</h3>
<p><code>CREATE TABLE</code> est l'ordre SQL qui <em>crée</em> une nouvelle table en décrivant ses colonnes. Chaque colonne reçoit un <strong>type</strong> (la nature de la donnée : nombre, texte, argent…) et parfois des <strong>contraintes</strong> (des règles que la base fait respecter).</p>
<pre class="pseudo">CREATE TABLE categorie (                       -- crée la table "categorie"
  id  INT AUTO_INCREMENT PRIMARY KEY,          -- clé primaire : un numéro unique auto-généré par la base
  nom VARCHAR(50) NOT NULL                     -- nom de la catégorie, texte obligatoire (50 caractères max)
);

CREATE TABLE jeu (                             -- crée la table "jeu"
  id             INT AUTO_INCREMENT PRIMARY KEY,  -- identifiant unique du jeu, auto-généré
  nom            VARCHAR(100) NOT NULL,           -- nom du jeu, texte obligatoire (100 caractères max)
  prix_achat     DECIMAL(6,2) NOT NULL,           -- prix de vente en euros (DECIMAL = exact, pas FLOAT)
  prix_location  DECIMAL(6,2) NOT NULL,           -- prix de location (par jour)
  stock_vente    INT NOT NULL DEFAULT 0,          -- quantité en stock pour la vente (0 par défaut)
  stock_location INT NOT NULL DEFAULT 0,          -- quantité en stock pour la location (0 par défaut)
  categorie_id   INT,                             -- numéro de la catégorie à laquelle appartient le jeu
  FOREIGN KEY (categorie_id) REFERENCES categorie(id)  -- clé étrangère : la catégorie doit vraiment exister
);</pre>
<p>Une <strong>clé primaire</strong> (<code>PRIMARY KEY</code>) est la colonne qui identifie chaque ligne de façon <em>unique</em>, comme un numéro de sécurité sociale : deux jeux ne peuvent pas avoir le même <code>id</code>. <code>AUTO_INCREMENT</code> demande à la base d'attribuer elle-même le prochain numéro libre (1, 2, 3…), pour qu'on n'ait pas à le gérer à la main.</p>

<h3>3. Les bons types</h3>
<pre class="pseudo">INT AUTO_INCREMENT  : une clé technique auto-générée (un entier qui s'incrémente tout seul)
VARCHAR(n)          : du texte de longueur variable, jusqu'à n caractères
DECIMAL(6,2)        : de l'argent, avec 2 décimales exactes (JAMAIS float pour un prix)
INT ... DEFAULT 0   : un compteur entier avec une valeur par défaut</pre>
<p>Petit lexique des mots-contraintes : <strong>NOT NULL</strong> veut dire « cette case ne peut jamais être vide » (l'information est obligatoire) ; <strong>DEFAULT 0</strong> veut dire « si on ne fournit pas de valeur, mets 0 ». Le type <code>DECIMAL(6,2)</code> signifie « un nombre de 6 chiffres au total dont 2 après la virgule » (ex. 9999.99).</p>
<div class="warn">Les <strong>deux stocks</strong> (vente et location) sont deux colonnes distinctes : c'est une décision du MCD, pas un détail. Un prix se stocke en <code>DECIMAL</code> pour éviter les erreurs d'arrondi du binaire flottant (avec <code>FLOAT</code>, 0,10 € + 0,20 € peut donner 0,30000004 €).</div>

<h3>4. La clé étrangère</h3>
<p>Une <strong>clé étrangère</strong> (<em>foreign key</em>) est une colonne qui <em>pointe</em> vers la clé primaire d'une autre table, pour relier les deux. <code>FOREIGN KEY (categorie_id) REFERENCES categorie(id)</code> garantit qu'un jeu ne peut pointer que vers une catégorie <strong>qui existe vraiment</strong> : c'est l'<strong>intégrité référentielle</strong>, c'est-à-dire la promesse qu'aucun lien ne « pend dans le vide ». C'est la base elle-même qui refuse une catégorie inexistante — le gardien est dans la base, pas dans notre code C.</p>
<div class="tip">On exécute ce script une seule fois (via le client mysql ou un fichier <code>schema.sql</code>). Côté C, on retrouvera exactement ces colonnes dans les <code>struct</code> (leçon 4) et dans les requêtes du DAO (leçon 5).</div>`,
  exercises: [
    { type: "qcm", q: "Le MCD Merise fournit…", opts: ["le code C", "les entités et associations, traduits en tables", "le Makefile", "l'UI"], a: 1, exp: "Conception → schéma physique." },
    { type: "qcm", q: "Quel type pour une clé primaire technique auto-générée ?", opts: ["VARCHAR", "INT AUTO_INCREMENT PRIMARY KEY", "DECIMAL", "TEXT"], a: 1, exp: "Un entier auto-incrémenté." },
    { type: "qcm", q: "Quel type pour un prix ?", opts: ["FLOAT", "DECIMAL(6,2)", "INT", "VARCHAR"], a: 1, exp: "DECIMAL évite les erreurs d'arrondi flottant." },
    { type: "qcm", q: "Pourquoi deux colonnes de stock ?", opts: ["Par simplicité de code", "Vente et location sont indépendantes (décision du MCD)", "Pour la vitesse", "Pour économiser de l'espace"], a: 1, exp: "Deux stocks distincts." },
    { type: "qcm", q: "À quoi sert une FOREIGN KEY ?", opts: ["Accélérer", "Garantir qu'une référence pointe vers une ligne existante", "Chiffrer", "Trier"], a: 1, exp: "Intégrité référentielle." },
    { type: "qcm", q: "VARCHAR(100) stocke…", opts: ["un entier", "du texte jusqu'à 100 caractères", "un prix", "une date"], a: 1, exp: "Texte de longueur variable." },
    { type: "qcm", q: "DEFAULT 0 sur stock_vente signifie…", opts: ["stock interdit", "valeur par défaut 0 si non fournie", "toujours 0", "erreur"], a: 1, exp: "Valeur par défaut à l'insertion." },
    { type: "qcm", q: "L'intégrité référentielle est assurée par…", opts: ["le C", "la base de données (contrainte FK)", "l'UI", "le Makefile"], a: 1, exp: "La base refuse une catégorie inexistante." },
    { type: "qcm", q: "Combien de fois exécute-t-on le CREATE TABLE ?", opts: ["à chaque lancement", "une fois (schéma initial)", "jamais", "à chaque requête"], a: 1, exp: "Le schéma se crée une fois." },
    { type: "qcm", q: "Le NOT NULL sur nom impose…", opts: ["un nom unique", "qu'un nom soit toujours fourni", "un nom court", "rien"], a: 1, exp: "La colonne ne peut pas être vide." },
    { type: "vf", q: "On peut utiliser FLOAT pour stocker un prix sans risque.", a: false, exp: "Faux : FLOAT introduit des erreurs d'arrondi ; on utilise DECIMAL." },
    { type: "qcm", q: "categorie_id dans jeu est…", opts: ["une clé primaire", "une clé étrangère vers categorie(id)", "un prix", "un stock"], a: 1, exp: "Elle référence la catégorie." },
    { type: "qcm", q: "Les colonnes SQL se retrouveront côté C dans…", opts: ["le Makefile", "les struct (leçon 4)", "les tests", "l'UI seule"], a: 1, exp: "Une ligne = une struct remplie." },
    { type: "qcm", q: "AUTO_INCREMENT évite…", opts: ["les jointures", "de gérer soi-même les identifiants", "les prix", "les FK"], a: 1, exp: "La base génère l'id." },
    { type: "qcm", q: "Où stocke-t-on typiquement ce script ?", opts: ["dans main.c", "dans un fichier schema.sql", "dans le Makefile", "dans l'UI"], a: 1, exp: "Un fichier SQL versionnable." }
  ],
  final: {
    title: "Exercice final — Compléter le schéma",
    intro: `<p>On veut une table location. Analyse cette proposition :</p>
<pre class="pseudo">CREATE TABLE location (                        -- proposition À CORRIGER
  id           INT AUTO_INCREMENT PRIMARY KEY, -- identifiant unique de la location (correct)
  utilisateur  VARCHAR(50),                    -- le loueur stocké en TEXTE (mauvais : devrait être un id + FK)
  jeu          INT,                            -- le jeu, mais SANS clé étrangère (aucune garantie d'existence)
  jours        INT,                            -- nombre de jours de location
  total        FLOAT                           -- montant en FLOAT (mauvais pour de l'argent : arrondis)
);</pre>`,
    questions: [
      { type: "qcm", q: "Problème n°1 — <code>utilisateur VARCHAR(50)</code> :", opts: ["Correct", "Mieux : un utilisateur_id INT avec FK vers utilisateur(id)", "Il faut TEXT", "Rien"], a: 1, exp: "On relie par clé étrangère, pas par un nom en texte." },
      { type: "qcm", q: "Problème n°2 — <code>jeu INT</code> sans contrainte :", opts: ["Correct", "Devrait être jeu_id INT avec FOREIGN KEY vers jeu(id)", "Il faut VARCHAR", "Rien"], a: 1, exp: "Une FK garantit l'intégrité." },
      { type: "qcm", q: "Problème n°3 — <code>total FLOAT</code> :", opts: ["Correct", "Pour de l'argent, DECIMAL(6,2)", "Il faut INT", "Il faut TEXT"], a: 1, exp: "Jamais FLOAT pour un montant." },
      { type: "qcm", q: "Que gagne-t-on avec les FK utilisateur_id et jeu_id ?", opts: ["Rien", "L'intégrité : impossible de louer un jeu inexistant", "De la vitesse pure", "Moins de tables"], a: 1, exp: "La base refuse les références orphelines." },
      { type: "qcm", q: "Une date de location serait de type…", opts: ["VARCHAR", "DATE ou DATETIME", "INT", "FLOAT"], a: 1, exp: "Un type temporel dédié." }
    ],
    solution: `<pre class="pseudo">CREATE TABLE location (                        -- version corrigée
  id              INT AUTO_INCREMENT PRIMARY KEY,  -- identifiant unique de la location
  utilisateur_id  INT NOT NULL,                    -- le loueur, relié par clé étrangère (un id, pas un texte)
  jeu_id          INT NOT NULL,                    -- le jeu loué, relié par clé étrangère
  jours           INT NOT NULL,                    -- durée de la location, en jours
  total           DECIMAL(6,2) NOT NULL,           -- montant total (DECIMAL : exact pour l'argent)
  date_debut      DATE NOT NULL,                   -- date de début (type temporel dédié)
  FOREIGN KEY (utilisateur_id) REFERENCES utilisateur(id),  -- l'utilisateur doit exister
  FOREIGN KEY (jeu_id)         REFERENCES jeu(id)           -- le jeu doit exister
);</pre>
<p>Des clés étrangères pour relier, du <code>DECIMAL</code> pour l'argent, un type <code>DATE</code> pour le temps. Le schéma est prêt. Demain : le miroir en <code>struct</code> côté C.</p>`
  }
};
</script>
