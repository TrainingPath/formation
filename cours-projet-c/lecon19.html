<script>
var DAY = {
  num: 19,
  title: "Qualité : logs, configuration et secrets",
  subtitle: "Sortir les identifiants du code, tracer ce qui se passe, préparer la mise en service.",
  theory: `
<h3>1. Ne jamais coder les secrets en dur</h3>
<p>Un <strong>secret</strong> est une information sensible (mot de passe, clé) qui ne doit être connue que des personnes autorisées. Coder un secret « <strong>en dur</strong> » (en anglais <em>hardcoded</em>) veut dire l'écrire directement dans le texte du programme.</p>
<pre class="pseudo">// À NE PAS FAIRE :
mysql_real_connect(c, "localhost", "ludo", "MonMotDePasse123", ...);   // le mot de passe est écrit EN DUR dans le code (fuite garantie)</pre>
<p>Un mot de passe dans le code finit dans l'historique de <strong>Git</strong> (l'outil qui garde toutes les versions du code), visible par tous ceux qui accèdent au dépôt. On lit plutôt les identifiants depuis l'<strong>environnement</strong> : un ensemble de <strong>variables</strong> fournies au programme au moment où on le lance, en dehors de son code.</p>
<pre class="pseudo">#include &lt;stdlib.h&gt;                        // pour getenv (lire une variable d'environnement)
const char *pass = getenv("DB_PASSWORD");   // récupère le mot de passe fourni AU LANCEMENT, hors du code
if (!pass) { fprintf(stderr, "[ERREUR] DB_PASSWORD manquant\\n"); return NULL; }   // si absent : message d'erreur et abandon</pre>
<p><code>getenv</code> (<em>get environment</em>) lit une variable d'environnement et renvoie sa valeur, ou <code>NULL</code> si elle n'existe pas — d'où le test <code>if (!pass)</code>.</p>

<h3>2. La configuration par environnement</h3>
<pre class="pseudo">DB_HOST, DB_USER, DB_PASSWORD, DB_NAME   // des variables d'environnement (fournies dehors), pas des constantes du code</pre>
<p>Le même <strong>binaire</strong> (le programme compilé) tourne en <strong>développement</strong> (sur la machine du programmeur) et en <strong>production</strong> (le vrai serveur des utilisateurs) : seules les <strong>variables</strong> changent. On ne recompile pas pour changer de base.</p>

<h3>3. Des logs utiles</h3>
<p>Un <strong>log</strong> (journal) est une trace écrite de ce que fait le programme : utile pour comprendre après coup ce qui s'est passé. <code>fprintf</code> écrit un message vers une destination précise.</p>
<pre class="pseudo">fprintf(stderr, "[INFO] Connecte a %s\\n", nom);      // trace un événement normal sur la sortie d'erreur
fprintf(stderr, "[ERREUR] %s\\n", mysql_error(c));   // trace le message d'erreur renvoyé par MySQL</pre>
<div class="warn">Les logs vont sur la <strong>sortie d'erreur</strong> (<code>stderr</code>, <em>standard error</em>), séparée de l'affichage destiné à l'utilisateur (<code>stdout</code>, <em>standard output</em>). On journalise les événements importants (connexion, échecs), mais <strong>jamais</strong> un mot de passe, un hash ou une donnée personnelle.</div>

<h3>4. Séparer configuration, secrets et code</h3>
<p>Trois choses distinctes : le <strong>code</strong> (versionné, public), la <strong>configuration</strong> (variables d'environnement, propre à chaque machine), les <strong>secrets</strong> (mots de passe, jamais dans le dépôt). C'est la base d'un <strong>déploiement</strong> propre (la mise en service du programme sur un serveur) — approfondi dans la version outillée du projet.</p>
<div class="tip">Un fichier <code>.env.example</code> (sans valeurs réelles) documente les variables attendues, tandis que le vrai <code>.env</code> est ignoré par Git. Le code lit <code>getenv</code> ; l'environnement fournit les valeurs.</div>`,
  exercises: [
    { type: "qcm", q: "Un mot de passe codé en dur finit…", opts: ["nulle part", "dans l'historique Git, visible", "chiffré", "supprimé"], a: 1, exp: "Fuite de secret." },
    { type: "qcm", q: "Comment lire un identifiant sans le coder en dur ?", opts: ["getenv(\"DB_PASSWORD\")", "printf", "scanf", "malloc"], a: 0, exp: "Depuis l'environnement." },
    { type: "qcm", q: "Si la variable d'environnement manque, on…", opts: ["continue", "signale une erreur claire et échoue", "devine", "affiche le code"], a: 1, exp: "Échec explicite." },
    { type: "qcm", q: "Le même binaire en dev et prod change grâce à…", opts: ["une recompilation", "des variables d'environnement différentes", "un autre code", "rien"], a: 1, exp: "Config externalisée." },
    { type: "qcm", q: "Les logs vont sur…", opts: ["stdout (affichage utilisateur)", "stderr (sortie d'erreur), séparée", "un fichier obligatoire", "la base"], a: 1, exp: "Séparer logs et affichage." },
    { type: "qcm", q: "Que ne journalise-t-on JAMAIS ?", opts: ["une connexion réussie", "un mot de passe, un hash, une donnée personnelle", "un code d'erreur", "un horodatage"], a: 1, exp: "Pas de secrets dans les logs." },
    { type: "qcm", q: "Trois choses distinctes :", opts: ["UI, service, DAO", "code, configuration, secrets", "client, vendeur, admin", "malloc, free, NULL"], a: 1, exp: "Séparation nette." },
    { type: "qcm", q: "Les secrets doivent-ils être dans le dépôt Git ?", opts: ["oui", "non, jamais", "parfois", "chiffrés dans le code"], a: 1, exp: "Jamais versionner un secret." },
    { type: "qcm", q: "À quoi sert un .env.example ?", opts: ["contenir les vrais secrets", "documenter les variables attendues, sans valeurs réelles", "compiler", "rien"], a: 1, exp: "Le vrai .env est ignoré par Git." },
    { type: "qcm", q: "getenv renvoie…", opts: ["un int", "la valeur de la variable, ou NULL si absente", "un double", "toujours \"\""], a: 1, exp: "On teste le NULL." },
    { type: "vf", q: "Coder le mot de passe MySQL dans le source est acceptable si le dépôt est privé.", a: false, exp: "Faux : un dépôt privé peut fuiter ; on externalise toujours." },
    { type: "qcm", q: "Un log d'erreur type :", opts: ["printf(mot_de_passe)", "fprintf(stderr, \"[ERREUR] %s\\n\", mysql_error(c))", "afficher le hash", "rien"], a: 1, exp: "Message utile, sans secret." },
    { type: "qcm", q: "Externaliser la config évite…", opts: ["les tests", "de recompiler pour changer d'environnement", "les rôles", "les transactions"], a: 1, exp: "Un binaire, plusieurs environnements." },
    { type: "qcm", q: "stdout sert à…", opts: ["les logs", "l'affichage destiné à l'utilisateur", "les erreurs", "rien"], a: 1, exp: "Séparé de stderr." },
    { type: "qcm", q: "La séparation code/config/secrets prépare…", opts: ["rien", "un déploiement propre", "des fuites", "des injections"], a: 1, exp: "Base du déploiement (version pro)." }
  ],
  final: {
    title: "Exercice final — Externaliser la connexion",
    intro: `<p>Cette connexion expose un secret. Analyse :</p>
<pre class="pseudo">MYSQL *db_connect(void) {                       // ouvre la connexion à la base
    MYSQL *c = mysql_init(NULL);                // prépare un objet de connexion vide
    mysql_real_connect(c, "localhost", "ludo", "Secret123!", "ludotheque", 0, NULL, 0);   // DÉFAUT : mot de passe EN DUR + retour non vérifié
    printf("Mot de passe: Secret123!\\n");      // DÉFAUT : affiche un secret à l'écran (fuite !)
    return c;                                    // renvoie la connexion (même si elle a échoué)
}</pre>`,
    questions: [
      { type: "qcm", q: "Problème n°1 — le mot de passe en dur :", opts: ["aucun", "il doit venir de getenv, pas du code", "trop court", "trop long"], a: 1, exp: "Secret dans le source." },
      { type: "qcm", q: "Problème n°2 — le printf du mot de passe :", opts: ["utile", "on ne journalise/affiche jamais un secret", "obligatoire", "sans risque"], a: 1, exp: "Fuite dans les logs/écran." },
      { type: "qcm", q: "Problème n°3 — le retour de connexion :", opts: ["correct", "non vérifié : il faut tester l'échec", "trop lent", "rien"], a: 1, exp: "Toujours vérifier mysql_real_connect." },
      { type: "qcm", q: "D'où viennent les identifiants proprement ?", opts: ["du code", "de variables d'environnement (getenv)", "de l'UI", "d'un printf"], a: 1, exp: "Config externalisée." },
      { type: "qcm", q: "Un log acceptable ici :", opts: ["le mot de passe", "\"[INFO] Connecte a ludotheque\" (sans secret)", "le hash", "rien du tout jamais"], a: 1, exp: "Événement utile, sans secret." }
    ],
    solution: `<pre class="pseudo">MYSQL *db_connect(void) {                       // ouvre la connexion à la base, proprement
    const char *host = getenv("DB_HOST"), *user = getenv("DB_USER");     // lit l'hôte et l'utilisateur depuis l'environnement
    const char *pass = getenv("DB_PASSWORD"), *name = getenv("DB_NAME"); // lit le mot de passe et le nom de la base
    if (!host || !user || !pass || !name) {     // si l'une des variables manque (|| = OU)…
        fprintf(stderr, "[ERREUR] Variables DB_* manquantes\\n");   // …afficher un message d'erreur…
        return NULL;                            // …et abandonner
    }
    MYSQL *c = mysql_init(NULL);                // prépare l'objet de connexion
    if (!mysql_real_connect(c, host, user, pass, name, 0, NULL, 0)) {   // tente la connexion ; si elle échoue…
        fprintf(stderr, "[ERREUR] Connexion : %s\\n", mysql_error(c));  // …afficher la raison donnée par MySQL…
        mysql_close(c);                         // …libérer l'objet de connexion…
        return NULL;                            // …et abandonner
    }
    fprintf(stderr, "[INFO] Connecte a %s\\n", name);   // sans secret : trace la connexion réussie (nom de base seulement)
    return c;                                    // renvoie la connexion valide
}</pre>
<p>Identifiants externalisés, aucun secret affiché, connexion vérifiée, log propre. Le projet est prêt pour la mise en service. Demain : le Makefile de release.</p>`
  }
};
