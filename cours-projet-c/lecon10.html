<script>
var DAY = {
  num: 10,
  title: "Authentification : mot de passe haché et session",
  subtitle: "Vérifier login + mot de passe sans jamais stocker le mot de passe en clair.",
  theory: `
<h3>1. Pourquoi hacher ?</h3>
<p>Un <strong>hachage</strong> (en anglais <em>hash</em>) transforme un mot de passe en une <strong>empreinte irréversible</strong> : une suite de caractères calculée à partir du mot de passe, mais dont on ne peut pas « remonter » au mot de passe d'origine. C'est comme une empreinte digitale : elle identifie une personne sans permettre de la reconstituer. On stocke donc l'empreinte, <strong>jamais</strong> le mot de passe lui-même. Ainsi, si la base de données <em>fuite</em> (se fait voler), les mots de passe ne sont pas révélés. À la connexion, on hache la saisie de l'utilisateur et on compare les deux <strong>empreintes</strong>.</p>
<pre class="pseudo">inscription : stocker  hash(mot_de_passe)              -- à l'inscription, on range seulement l'empreinte
connexion  : comparer  hash(saisie) == hash_stocké    -- à la connexion, on compare deux empreintes</pre>
<p>Deux notions à connaître. Le <strong>sel</strong> (<em>salt</em>) est une petite valeur aléatoire ajoutée avant le hachage : elle rend chaque empreinte <strong>unique</strong>, même pour deux personnes ayant choisi le même mot de passe, ce qui casse les « tables de correspondance » précalculées des attaquants. Une <strong>bibliothèque</strong> (en anglais <em>library</em>) est une boîte à outils de code déjà écrit et éprouvé, que l'on réutilise au lieu de tout refaire soi-même.</p>
<div class="warn">Un bon hachage de mot de passe est <strong>lent et salé</strong> (bcrypt, argon2), pas un simple MD5/SHA rapide — la lenteur freine les essais en masse d'un attaquant. En C, on utilise une bibliothèque dédiée (ex. <code>libsodium</code>, avec ses fonctions <code>crypto_pwhash_str</code> pour hacher et <code>crypto_pwhash_str_verify</code> pour vérifier). Ici on schématise avec une fonction <code>hacher()</code>.</div>

<h3>2. La fonction de connexion</h3>
<p>Voici la fonction qui vérifie une connexion. Quelques symboles du C à connaître d'abord. Une <strong>étoile</strong> <code>*</code> après un type désigne un <strong>pointeur</strong> : une variable qui contient non pas une valeur, mais l'<em>adresse</em> où se trouve la valeur — comme un papier portant l'adresse d'une maison plutôt que la maison elle-même. <code>MYSQL *c</code> est donc l'adresse de la connexion à la base. <code>const char *login</code> est un texte que la fonction promet de seulement <em>lire</em> (<code>const</code> = « constant »). <code>Utilisateur *out</code> est l'adresse d'une fiche à <strong>remplir</strong> en sortie. Le mot <code>Code</code> ici est le <strong>type de résultat</strong> renvoyé : un code parmi <code>OK</code>, <code>ERR_SAISIE</code>, etc. Le point d'exclamation <code>!</code> veut dire « non », et <code>!=</code> veut dire « différent de ».</p>
<pre class="pseudo">Code auth_login(MYSQL *c, const char *login, const char *mdp, Utilisateur *out) {   // reçoit la connexion, le login et le mdp saisis, et où écrire l'utilisateur trouvé
    char hash_stocke[256];                                  // case de 256 caractères pour recevoir l'empreinte lue en base
    if (dao_hash_par_login(c, login, hash_stocke, sizeof(hash_stocke)) != OK)   // demande au DAO l'empreinte de ce login ; si ça n'a pas fonctionné…
        return ERR_SAISIE;                                  // …login inconnu : on renvoie un code d'erreur neutre
    if (!mot_de_passe_ok(mdp, hash_stocke))                 // le mot de passe saisi correspond-il à l'empreinte ? si NON…
        return ERR_SAISIE;                                  // …mauvais mot de passe : même code neutre
    dao_utilisateur_par_login(c, login, out);               // charge id, login et rôle dans la fiche pointée par out
    return OK;                                              // tout est bon : la connexion a réussi
}</pre>
<p><code>sizeof(hash_stocke)</code> donne la <strong>taille</strong> de la case (256), pour que le DAO n'écrive jamais au-delà. Le double décalage : on lit d'abord l'empreinte stockée, puis on la compare — jamais l'inverse.</p>

<h3>3. Ne pas renseigner l'attaquant</h3>
<div class="warn">On renvoie le <strong>même message</strong> pour « login inconnu » et « mot de passe faux ». Distinguer les deux permettrait à un attaquant de deviner quels comptes existent (« ce login-là, au moins, existe »). On évite aussi d'afficher le hash ou le mot de passe dans les <strong>logs</strong> (le journal des évènements du programme) : un secret n'a rien à faire dans un fichier de traces.</div>

<h3>4. La « session » en console</h3>
<p>Après une connexion réussie, on garde l'<code>Utilisateur</code> courant en mémoire (une variable passée aux menus). C'est la version console d'une <strong>session</strong> : la mémoire de « qui est connecté » pour toute la durée du programme. Sur un site web, ce rôle est tenu par un cookie ; ici, c'est simplement une variable qui suit l'utilisateur d'un écran à l'autre.</p>
<div class="tip">La récupération du hash par login se fait par <strong>requête préparée</strong> (le login est une saisie de l'utilisateur !). Une requête préparée envoie d'abord le <em>gabarit</em> de la requête, puis les valeurs séparément, ce qui empêche une saisie piégée de se faire passer pour du code SQL. Jamais de <strong>concaténation</strong> (coller la saisie directement dans le texte SQL). On lie le login, on lit le hash, on compare.</div>`,
  exercises: [
    { type: "qcm", q: "Un hachage de mot de passe est…", opts: ["réversible", "irréversible (une empreinte)", "un chiffrement", "un login"], a: 1, exp: "On ne retrouve pas le mot de passe depuis le hash." },
    { type: "qcm", q: "On stocke en base…", opts: ["le mot de passe en clair", "le hash du mot de passe", "le login seulement", "rien"], a: 1, exp: "Jamais le mot de passe lui-même." },
    { type: "qcm", q: "À la connexion, on compare…", opts: ["les mots de passe en clair", "hash(saisie) et hash stocké", "les logins seulement", "les id"], a: 1, exp: "On compare des empreintes." },
    { type: "qcm", q: "Un bon hachage de mot de passe est…", opts: ["rapide comme MD5", "lent et salé (bcrypt, argon2)", "un simple XOR", "réversible"], a: 1, exp: "La lenteur freine les attaques par force brute." },
    { type: "qcm", q: "Quelle bibliothèque C pour hacher un mot de passe ?", opts: ["stdio.h", "libsodium (ou équivalent dédié)", "math.h", "string.h"], a: 1, exp: "Une lib spécialisée, pas un hash maison." },
    { type: "qcm", q: "Pour « login inconnu » et « mauvais mot de passe », on renvoie…", opts: ["deux messages précis", "le même message générique", "le hash", "rien"], a: 1, exp: "Ne pas renseigner l'attaquant." },
    { type: "qcm", q: "Récupérer le hash par login se fait par…", opts: ["concaténation SQL", "requête préparée (login = saisie)", "un fichier texte", "l'UI"], a: 1, exp: "Le login est une donnée externe." },
    { type: "qcm", q: "Après connexion réussie, on garde…", opts: ["le mot de passe", "l'Utilisateur courant en mémoire (session)", "le hash affiché", "rien"], a: 1, exp: "Qui est connecté pour la suite." },
    { type: "qcm", q: "Afficher le hash dans les logs est…", opts: ["utile", "une mauvaise pratique (fuite)", "obligatoire", "sans risque"], a: 1, exp: "On ne journalise pas les secrets." },
    { type: "qcm", q: "La « session » en console, c'est…", opts: ["un cookie", "la variable Utilisateur courante passée aux menus", "un fichier", "une table"], a: 1, exp: "L'état « connecté » du programme." },
    { type: "vf", q: "Un hash rapide (MD5) est adapté aux mots de passe.", a: false, exp: "Faux : il faut un hash lent et salé (bcrypt/argon2)." },
    { type: "qcm", q: "Si dao_hash_par_login échoue (login absent), auth_login renvoie…", opts: ["OK", "ERR_SAISIE (message générique)", "ERR_DB seulement", "le hash"], a: 1, exp: "Message neutre." },
    { type: "qcm", q: "Le « sel » d'un hash sert à…", opts: ["accélérer", "rendre chaque empreinte unique et casser les tables précalculées", "afficher", "trier"], a: 1, exp: "Deux mots de passe identiques ont des hash différents." },
    { type: "qcm", q: "out (Utilisateur *) est rempli…", opts: ["par valeur", "à travers son pointeur, après vérification", "jamais", "par l'UI"], a: 1, exp: "On charge id, login, rôle." },
    { type: "qcm", q: "L'authentification répond à la question…", opts: ["que peut faire l'utilisateur ?", "qui es-tu ? (identité)", "quel prix ?", "quel stock ?"], a: 1, exp: "Authentification = identité ; autorisation = droits." }
  ],
  final: {
    title: "Exercice final — Sécuriser la connexion",
    intro: `<p>Une première version d'auth_login. Analyse :</p>
<pre class="pseudo">Code auth_login(MYSQL *c, const char *login, const char *mdp, Utilisateur *out) {   // même signature : connexion, login, mdp, sortie
    char sql[256];                            // case de 256 caractères pour construire le texte de la requête
    sprintf(sql, "SELECT id FROM utilisateur WHERE login='%s' AND mot_de_passe='%s'", login, mdp);   // DANGER : colle le login et le mdp bruts dans le SQL (injection possible)
    mysql_query(c, sql);                      // envoie cette requête à la base (et compare des mots de passe EN CLAIR)
    ...                                       // (suite omise)
}</pre>`,
    questions: [
      { type: "qcm", q: "Faille n°1 — la concaténation de login et mdp :", opts: ["Aucune", "Injection SQL : il faut une requête préparée", "trop lent", "trop long"], a: 1, exp: "Saisies collées dans le SQL." },
      { type: "qcm", q: "Faille n°2 — comparer <code>mot_de_passe='%s'</code> en clair :", opts: ["Correct", "On ne compare pas des mots de passe en clair : on compare des hash", "il faut LIKE", "rien"], a: 1, exp: "La base ne doit contenir que des hash." },
      { type: "qcm", q: "La bonne approche :", opts: ["chiffrer le SQL", "requête préparée pour lire le hash par login, puis vérifier le mdp", "raccourcir le mdp", "logger le mdp"], a: 1, exp: "Lire le hash, puis comparer côté C." },
      { type: "qcm", q: "Message d'erreur recommandé :", opts: ["« login inconnu » précis", "un message générique identique dans les deux cas", "afficher le hash", "le mot de passe"], a: 1, exp: "Ne pas renseigner l'attaquant." },
      { type: "qcm", q: "Le hash doit être produit par…", opts: ["un XOR maison", "une fonction dédiée lente et salée", "MD5", "rien"], a: 1, exp: "bcrypt / argon2 / libsodium." }
    ],
    solution: `<pre class="pseudo">Code auth_login(MYSQL *c, const char *login, const char *mdp, Utilisateur *out) {   // reçoit connexion, login, mdp, et la fiche de sortie out
    char hash_stocke[256];                   // case qui recevra l'empreinte lue en base
    // requête PRÉPARÉE : le login est lié, pas concaténé
    if (dao_hash_par_login(c, login, hash_stocke, sizeof(hash_stocke)) != OK)   // lit l'empreinte du login ; si échec…
        return ERR_SAISIE;                   // …login inconnu (message neutre)

    if (!mot_de_passe_ok(mdp, hash_stocke))  // ex. crypto_pwhash_str_verify : le mdp correspond-il à l'empreinte ?
        return ERR_SAISIE;                   // …mauvais mdp (même message neutre)

    return dao_utilisateur_par_login(c, login, out);  // charge la session (id, login, rôle) et renvoie OK
}</pre>
<p>Requête préparée, comparaison de hash, message neutre : trois piliers d'une authentification sûre. Demain : l'autorisation par rôle.</p>`
  }
};
</script>
