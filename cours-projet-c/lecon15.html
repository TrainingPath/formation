<script>
var DAY = {
  num: 15,
  title: "Recherche, filtres et pagination",
  subtitle: "Retrouver un jeu par son nom et afficher le catalogue par pages, côté base.",
  theory: `
<h3>1. Rechercher par nom (LIKE)</h3>
<p>Une <strong>requête</strong> SQL est une question posée à la base. La plus courante commence par <code>SELECT</code> (« sélectionner »), qui demande à lire des données. <code>FROM</code> indique dans quelle table, et <code>WHERE</code> pose la condition (« là où… »).</p>
<pre class="pseudo">SELECT id, nom, prix_location, stock_location   -- choisir ces 4 colonnes à afficher
FROM jeu                                         -- les lire dans la table "jeu"
WHERE nom LIKE CONCAT('%', ?, '%')              -- ne garder que les jeux dont le nom CONTIENT le terme cherché
ORDER BY nom;                                    -- trier les résultats par nom (ordre alphabétique)</pre>
<p>Le mot <code>LIKE</code> (« ressemble à ») fait une recherche souple, et le <code>%</code> est un <strong>joker</strong> qui remplace « n'importe quelle suite de caractères » : <code>%catan%</code> trouve tout nom contenant « catan ». <code>CONCAT</code> (« concaténer », coller bout à bout) fabrique la chaîne <code>%terme%</code>. Le <code>?</code> est un <strong>paramètre lié</strong> : un emplacement réservé que l'on remplira <em>séparément</em> avec le terme saisi — jamais en le collant dans le texte. C'est ce qui neutralise l'<strong>injection SQL</strong> (le fait qu'une saisie piégée se fasse passer pour du code), même avec un <code>%</code> ou une apostrophe. <code>ORDER BY</code> trie le résultat.</p>

<h3>2. Paginer avec LIMIT / OFFSET</h3>
<p>Afficher un catalogue entier d'un coup serait illisible et lourd. On le découpe en <strong>pages</strong> : c'est la <strong>pagination</strong>.</p>
<pre class="pseudo">SELECT ... FROM jeu ORDER BY nom LIMIT ? OFFSET ?;   -- ne renvoyer qu'une "page" : au plus LIMIT lignes, après avoir sauté OFFSET lignes</pre>
<pre class="pseudo">int taille = 10;                    // 10 jeux affichés par page
int offset = (page - 1) * taille;   // page 1 → offset 0, page 2 → 10, page 3 → 20…</pre>
<p><code>LIMIT</code> fixe le nombre maximal de lignes renvoyées (la taille d'une page) ; <code>OFFSET</code> indique combien de lignes <strong>sauter</strong> avant de commencer (le décalage jusqu'à la bonne page).</p>
<div class="warn">On pagine <strong>côté base</strong> : on ne rapatrie que 10 lignes, pas tout le catalogue. Charger 100 000 jeux en mémoire pour n'en afficher 10 serait un gaspillage — et un risque mémoire.</div>

<h3>3. Compter pour connaître le nombre de pages</h3>
<p><code>COUNT(*)</code> compte le nombre de lignes qui correspondent, sans les rapatrier toutes. Cela permet de calculer combien de pages afficher.</p>
<pre class="pseudo">SELECT COUNT(*) FROM jeu WHERE nom LIKE CONCAT('%', ?, '%');   -- compte le nombre TOTAL de jeux correspondant au terme
// nb_pages = (total + taille - 1) / taille;   // nombre de pages = total ÷ taille, arrondi au supérieur</pre>
<p>L'astuce <code>(total + taille - 1) / taille</code> réalise une <strong>division entière arrondie vers le haut</strong> : par exemple 23 jeux par pages de 10 donnent (23+9)/10 = 3 pages.</p>

<h3>4. Filtrer</h3>
<p>On combine les critères dans le <code>WHERE</code> : catégorie, disponibilité, fourchette de prix… chaque filtre supplémentaire est un <code>AND ... = ?</code> avec sa valeur liée. Le mot <code>AND</code> veut dire « ET » : toutes les conditions doivent être vraies.</p>
<pre class="pseudo">WHERE stock_location &gt; 0 AND categorie_id = ? ORDER BY prix_location;   -- garder les jeux disponibles (stock > 0) ET d'une catégorie donnée, triés par prix</pre>
<div class="tip">Recherche + filtres + pagination forment le trio de tout catalogue. La base fait le travail lourd (filtrer, trier, découper) ; le C ne reçoit que la page utile. Toujours en requête préparée dès qu'une valeur vient de l'utilisateur.</div>`,
  exercises: [
    { type: "qcm", q: "Quel opérateur SQL pour une recherche « contient » ?", opts: ["=", "LIKE avec %", "IN", ">"], a: 1, exp: "LIKE '%terme%'." },
    { type: "qcm", q: "Le terme de recherche saisi doit être…", opts: ["concaténé", "un paramètre lié (requête préparée)", "affiché seulement", "ignoré"], a: 1, exp: "Anti-injection." },
    { type: "qcm", q: "LIMIT sert à…", opts: ["trier", "limiter le nombre de lignes renvoyées", "compter", "chiffrer"], a: 1, exp: "La taille d'une page." },
    { type: "qcm", q: "OFFSET sert à…", opts: ["sauter les N premières lignes", "trier", "compter", "filtrer"], a: 0, exp: "Le décalage vers la bonne page." },
    { type: "qcm", q: "offset pour la page 3 avec 10 par page :", opts: ["3", "20", "30", "10"], a: 1, exp: "(3-1)*10 = 20." },
    { type: "qcm", q: "On pagine…", opts: ["en mémoire en chargeant tout", "côté base (on ne rapatrie que la page)", "dans l'UI", "jamais"], a: 1, exp: "La base découpe." },
    { type: "qcm", q: "Charger 100 000 jeux pour en afficher 10 est…", opts: ["efficace", "un gaspillage (mémoire, temps)", "obligatoire", "sûr"], a: 1, exp: "On ne prend que le nécessaire." },
    { type: "qcm", q: "Pour le nombre de pages, on utilise…", opts: ["LIMIT", "COUNT(*) puis un calcul d'arrondi", "OFFSET", "LIKE"], a: 1, exp: "Total ÷ taille, arrondi au supérieur." },
    { type: "qcm", q: "nb_pages = (total + taille - 1) / taille donne…", opts: ["un arrondi au supérieur", "un arrondi au inférieur", "toujours 1", "une erreur"], a: 0, exp: "Astuce d'arrondi entier vers le haut." },
    { type: "qcm", q: "Un filtre par catégorie s'écrit…", opts: ["ORDER BY categorie", "AND categorie_id = ? (valeur liée)", "LIMIT categorie", "LIKE categorie"], a: 1, exp: "Un critère lié de plus." },
    { type: "vf", q: "Le % du LIKE doit être placé dans la valeur liée pour éviter l'injection.", a: false, exp: "Le % appartient au SQL (CONCAT) ; la valeur liée reste le terme brut, ce qui évite l'injection." },
    { type: "qcm", q: "ORDER BY nom…", opts: ["filtre", "trie les résultats par nom", "pagine", "compte"], a: 1, exp: "Le tri du catalogue." },
    { type: "qcm", q: "Combiner deux filtres se fait avec…", opts: ["OR toujours", "AND ... = ? pour chaque critère", "LIMIT", "un enum"], a: 1, exp: "Des conditions liées." },
    { type: "qcm", q: "Le trio d'un catalogue :", opts: ["insert, update, delete", "recherche, filtres, pagination", "commit, rollback, select", "hash, sel, session"], a: 1, exp: "Les fonctions attendues d'un catalogue." },
    { type: "qcm", q: "Dès qu'une valeur vient de l'utilisateur, on utilise…", opts: ["la concaténation", "une requête préparée", "un fichier", "rien"], a: 1, exp: "Toujours des paramètres liés." }
  ],
  final: {
    title: "Exercice final — Paginer proprement",
    intro: `<p>On veut la page 2 (10 par page) des jeux contenant un terme. Analyse :</p>
<pre class="pseudo">char sql[256];                                  // case de 256 caractères pour construire le texte SQL
sprintf(sql, "SELECT id,nom FROM jeu WHERE nom LIKE '%%%s%%' LIMIT 10 OFFSET 10", terme);   // DANGER : colle le terme brut dans le SQL (injection possible)
mysql_query(c, sql);                            // envoie la requête vulnérable à la base</pre>`,
    questions: [
      { type: "qcm", q: "Problème principal ?", opts: ["aucun", "terme concaténé : injection SQL possible", "LIMIT trop grand", "OFFSET faux"], a: 1, exp: "Le terme doit être lié, pas collé." },
      { type: "qcm", q: "L'OFFSET 10 correspond à…", opts: ["page 1", "page 2 (on saute les 10 premiers)", "page 3", "aucune"], a: 1, exp: "(2-1)*10 = 10." },
      { type: "qcm", q: "La bonne approche :", opts: ["échapper à la main", "requête préparée : LIKE CONCAT('%',?,'%') LIMIT ? OFFSET ?", "raccourcir le terme", "charger tout puis filtrer en C"], a: 1, exp: "Paramètres liés + pagination base." },
      { type: "qcm", q: "Charger tout puis filtrer en C serait…", opts: ["mieux", "un gaspillage mémoire", "plus sûr", "obligatoire"], a: 1, exp: "La base filtre et pagine." },
      { type: "qcm", q: "Pour le nombre total de pages, on ajoute…", opts: ["un LIMIT", "un COUNT(*) avec le même WHERE", "un OFFSET", "rien"], a: 1, exp: "Compter les résultats filtrés." }
    ],
    solution: `<pre class="pseudo">-- requête préparée (paramètres liés : terme, taille, offset)
SELECT id, nom, prix_location        -- colonnes à afficher
FROM jeu                             -- table des jeux
WHERE nom LIKE CONCAT('%', ?, '%')   -- ne garder que les noms contenant le terme (lié, donc sûr)
ORDER BY nom                         -- trier par nom
LIMIT ? OFFSET ?;                    -- ne renvoyer qu'une page (au plus LIMIT lignes, après OFFSET sautées)

/* côté C */
int taille = 10;                     // 10 jeux par page
int offset = (page - 1) * taille;    // page 2 → offset 10
/* bind : ? = terme (STRING), ? = taille (LONG), ? = offset (LONG) */</pre>
<p>Terme lié (sûr), pagination côté base (efficace), calcul d'offset clair. Le catalogue passe à l'échelle. Demain : les trois espaces client, vendeur et administrateur.</p>`
  }
};
</script>

    statement: "Écris la requête SQL (paramétrée) qui liste les jeux disponibles à la location (stock_location > 0) d'une catégorie donnée, triés par prix croissant, page par page (LIMIT/OFFSET). Indique côté C le calcul de l'offset.",

    solution: "-- Requete preparee (parametres lies : categorie_id, taille, offset)\nSELECT id, nom, prix_location, stock_location   -- colonnes a afficher\nFROM jeu                                        -- table des jeux\nWHERE stock_location > 0                         -- garder seulement les jeux disponibles a la location\n  AND categorie_id = ?                           -- ET appartenant a la categorie demandee (parametre lie)\nORDER BY prix_location ASC                       -- trier par prix croissant (ASC = ascendant)\nLIMIT ? OFFSET ?;                                -- une page : au plus LIMIT lignes, apres OFFSET sautees\n\n/* Cote C */\nint taille = 10;                    // 10 jeux par page\nint offset = (page - 1) * taille;   /* page commence a 1 -> page 1 = offset 0 */\n/* bind: ?1 = categorie_id (LONG), ?2 = taille (LONG), ?3 = offset (LONG) */",
    note: "Deux filtres (disponibilité + catégorie), un tri, une pagination : tout est délégué à la base via des paramètres liés. Le C ne reçoit que la page utile, triée et filtrée." }
  ]
