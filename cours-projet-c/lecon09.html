<script>
var DAY = {
  num: 9,
  title: "Utilisateurs et les trois rôles",
  subtitle: "Modéliser les comptes et les profils client / vendeur / administrateur.",
  theory: `
<h3>1. La table utilisateur</h3>
<p>Avant qu'un programme puisse gérer des comptes, il faut décider <em>comment</em> ranger les informations de chaque personne. On les range dans une <strong>table</strong> : un tableau à lignes et colonnes, exactement comme une feuille de tableur. Une <strong>ligne</strong> représente un utilisateur ; une <strong>colonne</strong> représente une information (son nom de connexion, son mot de passe, son rôle…). Cette table vit dans la <strong>base de données</strong> (le grand classeur du programme, qui garde tout même une fois l'ordinateur éteint), gérée par le logiciel <strong>MySQL</strong>. On la crée en écrivant une instruction en <strong>SQL</strong> — le langage qui sert à parler aux bases de données (SQL = <em>Structured Query Language</em>, « langage de requêtes structuré »).</p>
<pre class="pseudo">CREATE TABLE utilisateur (                        -- crée une nouvelle table nommée "utilisateur"
  id                INT AUTO_INCREMENT PRIMARY KEY,   -- numéro unique attribué tout seul : la "carte d'identité" de la ligne
  login             VARCHAR(50) UNIQUE NOT NULL,      -- nom de connexion (texte ≤ 50 car.), sans doublon et obligatoire
  mot_de_passe_hash VARCHAR(255) NOT NULL,            -- empreinte du mot de passe (jamais le mot de passe en clair), obligatoire
  role              TINYINT NOT NULL DEFAULT 0        -- petit entier : 0 client, 1 vendeur, 2 admin (0 par défaut)
);                                                    -- la parenthèse fermante et le ; terminent la définition de la table</pre>
<p>Décryptons chaque mot. <code>CREATE TABLE</code> veut dire « créer une table ». <code>INT</code> désigne un nombre <strong>entier</strong>. <code>AUTO_INCREMENT</code> demande à la base de <strong>numéroter toute seule</strong> chaque nouvelle ligne (1, 2, 3…), comme le ticket qu'une machine distribue à la boulangerie. <code>PRIMARY KEY</code> (« clé primaire ») désigne la colonne qui identifie <strong>de façon unique</strong> chaque ligne — deux utilisateurs ne peuvent pas avoir le même <code>id</code>. <code>VARCHAR(50)</code> est un <strong>texte</strong> d'au plus 50 caractères (VARCHAR = <em>variable characters</em>, « caractères en quantité variable »). <code>UNIQUE</code> interdit les doublons (pas deux fois le même login). <code>NOT NULL</code> veut dire « obligatoire » : la case ne peut pas rester vide — <em>NULL</em> signifiant « rien », l'absence totale de valeur. <code>TINYINT</code> est un <strong>tout petit entier</strong> (parfait pour coder 0, 1 ou 2). <code>DEFAULT 0</code> fixe la valeur <strong>par défaut</strong> à 0 : un compte créé sans précision est donc un client.</p>
<p>Le <code>login</code> est ainsi <strong>unique</strong>. Point crucial : le mot de passe n'est <strong>jamais</strong> stocké en clair, seulement son <strong>hash</strong> — une empreinte irréversible calculée à partir du mot de passe. C'est comme une empreinte digitale : elle permet de reconnaître la personne, mais on ne peut pas « remonter » de l'empreinte à la personne. On y revient en leçon 10. La colonne <code>role</code> encode le profil sous forme de chiffre.</p>

<h3>2. L'enum Role côté C</h3>
<p>Côté langage <strong>C</strong> (le langage dans lequel le programme est écrit), on veut manipuler les rôles avec des <em>noms</em> plutôt qu'avec des chiffres. Pour cela on utilise un <strong>enum</strong> (abréviation d'<em>enumeration</em>, « énumération ») : une liste de noms auxquels le compilateur attribue automatiquement des numéros (0 pour le premier, 1 pour le suivant, etc.). C'est comme les dossards d'une course : « Dupont » porte le n°1, « Martin » le n°2, mais on préfère dire les noms plutôt que les numéros.</p>
<pre class="pseudo">typedef enum { CLIENT, VENDEUR, ADMIN } Role;   // définit un type "Role" : CLIENT vaut 0, VENDEUR 1, ADMIN 2

typedef struct {                 // définit un type "Utilisateur" qui regroupe plusieurs informations
    int  id;                     // le numéro unique du compte (le même que la colonne id en base)
    char login[50];              // le nom de connexion : un tableau de 50 caractères
    Role role;                   // le profil, exprimé avec l'enum ci-dessus
} Utilisateur;                   // "Utilisateur" est le nom du nouveau type ainsi créé</pre>
<p><code>typedef</code> veut dire « définir un nouveau <strong>type</strong> » (une nouvelle sorte de donnée, avec un nom à nous). Une <strong>struct</strong> (structure) <strong>regroupe</strong> plusieurs informations sous un seul nom, comme une fiche cartonnée réunissant plusieurs champs. Ici la fiche <code>Utilisateur</code> réunit un <code>id</code> (entier), un <code>login</code> (texte de 50 caractères — <code>char</code> signifie <em>character</em>, « caractère », et <code>[50]</code> réserve 50 cases côte à côte) et un <code>role</code>. L'enum aligne ses valeurs sur la colonne <code>role</code> de la base (0, 1, 2) et rend le code lisible : on écrit <code>ADMIN</code> au lieu de <code>2</code>, ce qui se lit tout seul.</p>

<h3>3. Ce que chaque rôle peut faire</h3>
<p>Chaque profil a des droits différents — c'est le principe du « chacun son métier » vu en leçon 1 :</p>
<pre class="pseudo">CLIENT   : parcourir, louer, acheter, voir ses locations
VENDEUR  : gérer le stock (vente et location), enregistrer les opérations
ADMIN    : gérer les jeux et les comptes, voir les statistiques</pre>
<div class="warn">Le rôle est la base de l'<strong>autorisation</strong> (leçon 11) : décider « qui a le droit de faire quoi ». On ne fait <strong>jamais</strong> confiance au client pour dire son rôle : celui-ci vient de la base, est chargé à la connexion, et est vérifié à chaque opération sensible.</div>

<h3>4. Lire le rôle depuis la base</h3>
<p>Quand le <strong>DAO</strong> (la couche qui parle à la base, vue en leçon 1) lit une ligne, MySQL lui renvoie chaque colonne sous forme de <strong>texte</strong>. Il faut donc <em>convertir</em> ce texte en la bonne sorte de donnée avant de le ranger dans la struct.</p>
<pre class="pseudo">// dans le DAO, la colonne role (chaîne "0"/"1"/"2") devient un enum
u.role = (Role)atoi(row[3]);   // atoi transforme le texte "2" en entier 2 ; (Role) le réétiquette en ADMIN</pre>
<p><code>row[3]</code> désigne la <strong>4ᵉ colonne</strong> de la ligne lue (on compte à partir de 0 : row[0], row[1], row[2], row[3]) — <em>row</em> voulant dire « ligne » en anglais. <code>atoi</code> (<em>ASCII to integer</em>, « texte vers entier ») est une fonction qui <strong>convertit un texte en nombre entier</strong> : elle lit la chaîne <code>"2"</code> et renvoie l'entier <code>2</code>. Le préfixe <code>(Role)</code> est un <strong>cast</strong> (« conversion de type ») : il dit au compilateur « traite désormais cet entier comme un <code>Role</code> », donc <code>2</code> devient <code>ADMIN</code>. Enfin <code>u.role</code> désigne le champ <code>role</code> de la struct <code>u</code> : le point <code>.</code> se lit « le champ … de … ».</p>
<div class="tip">Le rôle voyage dans la struct <code>Utilisateur</code> une fois l'utilisateur authentifié. Toutes les couches savent alors « qui » agit, sans requêter la base à chaque contrôle.</div>`,
  exercises: [
    { type: "qcm", q: "Le login d'un utilisateur doit être…", opts: ["quelconque", "unique (UNIQUE NOT NULL)", "un nombre", "optionnel"], a: 1, exp: "Pas deux comptes identiques." },
    { type: "qcm", q: "Le mot de passe est stocké…", opts: ["en clair", "sous forme de hash", "chiffré réversiblement", "dans l'UI"], a: 1, exp: "Jamais en clair." },
    { type: "qcm", q: "Les trois rôles sont…", opts: ["dev, test, prod", "CLIENT, VENDEUR, ADMIN", "lecteur, auteur, admin", "root, invité, anonyme"], a: 1, exp: "Les profils de la Ludothèque." },
    { type: "qcm", q: "L'enum Role rend le code…", opts: ["plus lent", "plus lisible (ADMIN plutôt que 2)", "chiffré", "plus long inutilement"], a: 1, exp: "Des noms parlants." },
    { type: "qcm", q: "Le rôle sert de base à…", opts: ["l'affichage seul", "l'autorisation", "la vitesse", "rien"], a: 1, exp: "Qui a le droit de quoi." },
    { type: "qcm", q: "Fait-on confiance au client pour dire son rôle ?", opts: ["Oui", "Non : le rôle vient de la base, vérifié côté serveur", "Parfois", "Toujours"], a: 1, exp: "Jamais de confiance aveugle." },
    { type: "qcm", q: "Qui peut gérer le stock ?", opts: ["le client", "vendeur et admin", "tout le monde", "personne"], a: 1, exp: "Pas le client." },
    { type: "qcm", q: "Qui gère les comptes ?", opts: ["le client", "le vendeur", "l'admin", "le DAO"], a: 2, exp: "Réservé à l'administrateur." },
    { type: "qcm", q: "TINYINT DEFAULT 0 pour role signifie…", opts: ["admin par défaut", "client par défaut (0)", "aucun rôle", "erreur"], a: 1, exp: "Un nouveau compte est client." },
    { type: "qcm", q: "Le rôle voyage dans…", opts: ["le Makefile", "la struct Utilisateur après authentification", "un fichier temporaire", "l'UI seule"], a: 1, exp: "Chargé une fois, réutilisé." },
    { type: "vf", q: "On peut stocker le mot de passe en clair si la base est privée.", a: false, exp: "Faux : toujours un hash, quelle que soit la base." },
    { type: "qcm", q: "atoi(row[3]) converti en (Role) donne…", opts: ["une chaîne", "la valeur d'enum correspondante", "un double", "NULL"], a: 1, exp: "0→CLIENT, 1→VENDEUR, 2→ADMIN." },
    { type: "qcm", q: "Charger le rôle une fois évite…", opts: ["de compiler", "de requêter la base à chaque contrôle", "d'afficher", "les tests"], a: 1, exp: "Performance et simplicité." },
    { type: "qcm", q: "UNIQUE sur login est garanti par…", opts: ["le C", "la base (contrainte)", "l'UI", "le Makefile"], a: 1, exp: "La base refuse un doublon." },
    { type: "qcm", q: "Le rôle est vérifié…", opts: ["une seule fois", "à chaque opération sensible", "jamais", "à l'affichage seulement"], a: 1, exp: "Autorisation systématique." }
  ],
  final: {
    title: "Exercice final — Charger un utilisateur",
    intro: `<p>On lit un utilisateur depuis la base. Analyse le mapping (le passage de la ligne SQL vers la struct C) :</p>
<pre class="pseudo">u.id = atoi(row[0]);      // colonne 0 (texte) convertie en entier, rangée dans le champ id : correct
u.login = row[1];         // ERREUR : login est un tableau de char, on ne le remplit pas avec = (interdit en C)
u.role = row[3];          // ERREUR : row[3] est du texte ("2"), pas un Role ; il manque atoi puis le cast (Role)</pre>`,
    questions: [
      { type: "qcm", q: "Problème n°1 — <code>u.login = row[1]</code> :", opts: ["Correct", "login est un tableau char : il faut snprintf/strcpy, pas =", "il faut atoi", "rien"], a: 1, exp: "On ne copie pas une chaîne avec =." },
      { type: "qcm", q: "Problème n°2 — <code>u.role = row[3]</code> :", opts: ["Correct", "row[3] est une chaîne : il faut (Role)atoi(row[3])", "il faut un double", "rien"], a: 1, exp: "Conversion chaîne → enum." },
      { type: "qcm", q: "Si row[1] pouvait être NULL, il faudrait…", opts: ["l'ignorer", "tester (row[1] ? row[1] : \"\")", "planter", "rien"], a: 1, exp: "Protéger contre le NULL." },
      { type: "qcm", q: "Le hash du mot de passe est-il chargé dans cette struct exposée ?", opts: ["Oui, toujours", "Pas nécessairement : on peut le garder au niveau DAO/auth", "Jamais possible", "Dans l'UI"], a: 1, exp: "On limite l'exposition du hash." },
      { type: "qcm", q: "Le mapping fiabilise…", opts: ["l'affichage", "le passage ligne SQL → struct C", "le Makefile", "la CI"], a: 1, exp: "Chaque champ correctement converti." }
    ],
    solution: `<pre class="pseudo">u.id = atoi(row[0]);                                            // texte "12" → entier 12 pour l'identifiant
snprintf(u.login, sizeof(u.login), "%s", row[1] ? row[1] : "");  // copie sûre du login (au plus 49 car. + fin), "" si NULL
u.role = (Role)atoi(row[3]);   // "2" → ADMIN                    // texte → entier (atoi) → enum Role (cast)</pre>
<p><code>snprintf</code> (<em>safe print formatted</em>) écrit un texte dans une case de taille <strong>limitée</strong> sans jamais déborder : <code>sizeof(u.login)</code> lui donne la taille exacte de la case (50), et <code>"%s"</code> est un gabarit qui signifie « insère ici une chaîne de caractères ». L'écriture <code>row[1] ? row[1] : ""</code> est un test compact (dit « ternaire ») qui se lit « si <code>row[1]</code> existe, l'utiliser, sinon utiliser le texte vide » — une protection contre le NULL. Copie de chaîne sécurisée, conversion du rôle en enum, gestion du NULL : l'utilisateur est prêt à circuler dans l'application. Demain : l'authentification.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  items: [
  { id: "projc-l09", title: "Libellé d'un rôle", level: 2,
    statement: "Écris const char *role_libelle(Role r) qui renvoie « client », « vendeur » ou « administrateur » selon le rôle, avec un switch et un cas par défaut « inconnu ». Utilise l'enum Role { CLIENT, VENDEUR, ADMIN }.",
    hints: [
      "switch (r) { case CLIENT: return \"client\"; ... }",
      "Renvoie des chaînes littérales (pas de malloc).",
      "Un default protège des valeurs imprévues."
    ],
    solution: "typedef enum { CLIENT, VENDEUR, ADMIN } Role;   // les trois profils : CLIENT=0, VENDEUR=1, ADMIN=2\n\nconst char *role_libelle(Role r) {              // renvoie un texte constant decrivant le role r\n    switch (r) {                                // on examine la valeur du role r\n        case CLIENT:  return \"client\";          // cas 0 : renvoyer le texte \"client\"\n        case VENDEUR: return \"vendeur\";         // cas 1 : renvoyer le texte \"vendeur\"\n        case ADMIN:   return \"administrateur\";  // cas 2 : renvoyer le texte \"administrateur\"\n        default:      return \"inconnu\";         // toute autre valeur (donnee corrompue) : \"inconnu\"\n    }                                           // fin du switch\n}                                               // fin de la fonction",
    note: "Renvoyer des littéraux constants évite toute gestion mémoire. Le default couvre une valeur de rôle inattendue (donnée corrompue), par prudence." }
  ]
};
</script>
