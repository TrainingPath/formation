var DAY = {
  num: 18,
  title: "Tests : un mini-harnais d'assertions",
  subtitle: "Protéger le projet des régressions avec des tests simples et automatiques.",
  theory: `
<h3>1. Pourquoi tester ?</h3>
<p>Un <strong>test</strong> est un petit bout de code qui vérifie <em>automatiquement</em> qu'une fonction se comporte comme prévu. Quand on modifie le code plus tard, relancer les tests détecte instantanément une <strong>régression</strong> — un comportement qui marchait avant et qui casse après un changement (« ça marchait pourtant ! »). C'est le filet de sécurité du projet, comme les rambardes d'un escalier.</p>

<h3>2. Un harnais minimal en C</h3>
<p>Un <strong>harnais</strong> (de test) est l'outillage qui exécute les vérifications et compte les résultats. Ici il tient en une <strong>macro</strong> : un raccourci de texte que le compilateur remplace avant de compiler. Le mot-clé <code>#define</code> définit cette macro.</p>
<pre class="pseudo">#include &lt;stdio.h&gt;              // pour printf (afficher à l'écran)
static int ok = 0, ko = 0;       // deux compteurs : tests réussis (ok) et échoués (ko)
#define CHECK(cond) do { /* teste une condition */ \\
    if (cond) ok++; /* condition vraie : un succès de plus */ \\
    else { printf("FAIL: %s (ligne %d)\\n", #cond, __LINE__); ko++; } /* fausse : afficher le test raté et compter un échec */ \\
} while (0)                       // do{...}while(0) fait tenir la macro en un seul bloc sûr</pre>
<p><code>#include &lt;stdio.h&gt;</code> apporte les outils d'affichage. <code>static</code> réserve les compteurs à ce fichier. Dans la macro, <code>#cond</code> transforme l'expression testée en <strong>texte</strong> (pour l'afficher telle quelle), et <code>__LINE__</code> est remplacé par le <strong>numéro de ligne</strong> — de quoi localiser un test raté. Le <code>\\</code> en fin de ligne signale que la macro continue à la ligne suivante. La macro <code>CHECK</code> évalue une condition : si elle est vraie, un succès de plus ; sinon, elle affiche l'expression qui a échoué et sa ligne.</p>

<h3>3. Tester les fonctions pures d'abord</h3>
<pre class="pseudo">int main(void) {                             // point d'entrée du programme de test
    Jeu j = { .prix_location = 5.0, .stock_location = 2 };   // une fiche Jeu de test : prix 5.0, 2 en stock
    CHECK(service_tarif(&amp;j, 1) == 5.0);      // 1 jour → 5.0 attendu (pas de remise)
    CHECK(service_tarif(&amp;j, 4) == 18.0);     // 4 jours → 18.0 attendu (-10 % dès 3 jours)
    CHECK(service_peut_louer(&amp;j) == 1);      // stock > 0 → location possible (1 = vrai)
    CHECK(valider_duree(0) == ERR_SAISIE);   // 0 jour est invalide → doit renvoyer ERR_SAISIE

    printf("%d reussis, %d echoues\\n", ok, ko);   // bilan : nombre de tests réussis et échoués
    return ko == 0 ? 0 : 1;                  // renvoie 0 si aucun échec, sinon 1 (code lu par la CI)
}</pre>
<div class="warn">On teste d'abord les fonctions <strong>pures</strong> (services sans base ni écran) : rapides, <strong>déterministes</strong> (même entrée → même résultat à chaque fois), sans dépendance. Les tests qui touchent MySQL sont plus lents et fragiles — on les garde pour les tests d'intégration.</div>

<h3>4. Le code de sortie compte</h3>
<p>Tout programme, en se terminant, renvoie un <strong>code de sortie</strong> : un nombre où 0 signifie « succès » et tout autre valeur « échec ». Le programme de test renvoie <strong>0 si tout passe, 1 sinon</strong>. C'est ce que la <strong>CI/CD</strong> (l'automatisation vue au cours suivant) lira pour décider d'accepter ou de refuser une modification.</p>
<div class="tip">Un bon test est court, nommé clairement et vérifie <strong>un</strong> comportement. Beaucoup de petits tests valent mieux qu'un gros : quand l'un échoue, on sait exactement quoi.</div>`,
  exercises: [
    { type: "qcm", q: "Un test vérifie…", opts: ["la vitesse seule", "qu'une fonction se comporte comme prévu", "le style", "la mémoire seule"], a: 1, exp: "Comportement attendu." },
    { type: "qcm", q: "Une régression, c'est…", opts: ["une amélioration", "quelque chose qui marchait et casse après un changement", "une fuite mémoire", "une injection"], a: 1, exp: "Les tests la détectent tôt." },
    { type: "qcm", q: "La macro CHECK(cond) fait…", opts: ["afficher toujours", "compter un succès si vrai, sinon signaler l'échec", "compiler", "trier"], a: 1, exp: "Assertion simple." },
    { type: "qcm", q: "#cond dans la macro affiche…", opts: ["la valeur", "le texte de l'expression testée", "la ligne seule", "rien"], a: 1, exp: "Pour identifier le test qui casse." },
    { type: "qcm", q: "On teste en priorité…", opts: ["le SQL", "les fonctions pures (services sans base ni écran)", "l'affichage", "le Makefile"], a: 1, exp: "Rapides et déterministes." },
    { type: "qcm", q: "Pourquoi les tests base sont-ils gardés à part ?", opts: ["ils sont interdits", "plus lents et fragiles (intégration)", "inutiles", "trop rapides"], a: 1, exp: "Tests d'intégration séparés." },
    { type: "qcm", q: "Le programme de test renvoie…", opts: ["toujours 0", "0 si tout passe, 1 sinon", "le nombre de tests", "rien"], a: 1, exp: "Pour la CI." },
    { type: "qcm", q: "Le code de sortie est lu par…", opts: ["l'UI", "la CI/CD, pour accepter/refuser", "MySQL", "le client"], a: 1, exp: "Un test rouge bloque." },
    { type: "qcm", q: "Un bon test…", opts: ["teste tout d'un coup", "est court et vérifie un comportement", "n'a pas de nom", "est le plus long possible"], a: 1, exp: "Un test = un comportement." },
    { type: "qcm", q: "service_tarif(&j, 4) avec prix 5.0 vaut…", opts: ["20.0", "18.0 (-10 %)", "15.0", "5.0"], a: 1, exp: "5×4×0.9." },
    { type: "vf", q: "Relancer les tests après un changement aide à repérer les régressions.", a: true, exp: "C'est le rôle du filet de tests." },
    { type: "qcm", q: "Beaucoup de petits tests valent mieux que…", opts: ["aucun test", "un gros test fourre-tout", "des tests lents", "des tests base"], a: 1, exp: "On sait précisément quoi casse." },
    { type: "qcm", q: "Un test « déterministe » signifie…", opts: ["aléatoire", "même entrée → même résultat, à chaque fois", "dépend de l'heure", "dépend du réseau"], a: 1, exp: "Fiabilité." },
    { type: "qcm", q: "__LINE__ dans la macro donne…", opts: ["la valeur testée", "le numéro de ligne du test", "le nom du fichier", "rien"], a: 1, exp: "Localiser l'échec." },
    { type: "qcm", q: "valider_duree(0) devrait renvoyer…", opts: ["OK", "ERR_SAISIE", "ERR_DB", "0 jour valide"], a: 1, exp: "0 jour est invalide." }
  ],
  final: {
    title: "Exercice final — Écrire de bons tests",
    intro: `<p>On teste service_prix_final(jeu, quantite) = prix_achat × quantite. Quelques assertions :</p>
<pre class="pseudo">Jeu j = { .prix_achat = 10.0 };              // fiche de test : prix d'achat 10.0
CHECK(service_prix_final(&amp;j, 1) == 10.0);    // 1 exemplaire → 10.0 attendu
CHECK(service_prix_final(&amp;j, 3) == 30.0);    // 3 exemplaires → 30.0 attendu</pre>`,
    questions: [
      { type: "qcm", q: "Ces tests sont-ils « purs » (sans base) ?", opts: ["non", "oui : ils ne touchent ni MySQL ni l'écran", "ils font du SQL", "ils affichent"], a: 1, exp: "Rapides et déterministes." },
      { type: "qcm", q: "Un test utile en plus :", opts: ["aucun", "un cas limite, ex. quantite = 0 → 0.0", "afficher le prix", "un sleep"], a: 1, exp: "Couvrir les bords." },
      { type: "qcm", q: "Si un CHECK échoue, on voit…", opts: ["rien", "l'expression et la ligne fautives", "un plantage", "un COMMIT"], a: 1, exp: "Grâce à #cond et __LINE__." },
      { type: "qcm", q: "Le main de test renvoie 1 quand…", opts: ["tout passe", "au moins un test échoue (ko > 0)", "jamais", "toujours"], a: 1, exp: "Pour signaler l'échec à la CI." },
      { type: "qcm", q: "Comparer des double avec == est…", opts: ["toujours sûr", "risqué en général (arrondis) ; ici les valeurs sont exactes, sinon comparer à une tolérance", "interdit", "inutile"], a: 1, exp: "Pour des calculs non exacts, on tolère un écart epsilon." }
    ],
    solution: `<pre class="pseudo">#include &lt;stdio.h&gt;              // pour printf
#include "services.h"            // pour service_prix_final et la struct Jeu
static int ok = 0, ko = 0;       // compteurs de tests réussis / échoués
#define CHECK(c) do { if (c) ok++; else { printf("FAIL: %s (L%d)\\n", #c, __LINE__); ko++; } } while (0)   // teste c ; sinon affiche le test raté

int main(void) {                             // point d'entrée du test
    Jeu j = { .prix_achat = 10.0 };          // fiche de test : prix d'achat 10.0
    CHECK(service_prix_final(&amp;j, 1) == 10.0);    // 1 exemplaire → 10.0
    CHECK(service_prix_final(&amp;j, 3) == 30.0);    // 3 exemplaires → 30.0
    CHECK(service_prix_final(&amp;j, 0) == 0.0);     // cas limite : 0 exemplaire → 0.0
    printf("%d reussis, %d echoues\\n", ok, ko);  // bilan des tests
    return ko == 0 ? 0 : 1;                      // 0 si tout passe, 1 sinon (pour la CI)
}</pre>
<p>Des tests courts, purs, avec un cas limite, et un code de sortie exploitable par la CI. Le filet de sécurité est en place. Demain : logs, config et secrets.</p>`
  }
};
