<script>
var DAY = {

  title: "Du cahier des charges à l'architecture en couches",
  subtitle: "Avant d'écrire une ligne, on décide comment l'application C est organisée.",
  theory: `
<h3>1. Le cahier des charges de la Ludothèque</h3>
<p>Un <strong>cahier des charges</strong> est le document qui décrit, en français ordinaire, <em>ce que le logiciel doit faire</em> — avant d'écrire la moindre ligne de code. C'est comme le plan d'un architecte avant de bâtir une maison : on décide d'abord les pièces et leur usage, on pose les briques ensuite. Coder sans cahier des charges, c'est construire sans plan et démolir un mur sur deux.</p>
<p>Notre projet est une <strong>ludothèque</strong> (une bibliothèque de <em>jeux</em>) où l'on peut <strong>acheter</strong> ou <strong>louer</strong> des jeux de société. Il existe trois <strong>profils</strong> d'utilisateurs — <strong>client</strong>, <strong>vendeur</strong>, <strong>administrateur</strong> — c'est-à-dire trois catégories de personnes qui n'ont pas les mêmes droits (comme, dans un magasin, le visiteur, le caissier et le patron). Chaque jeu possède <strong>deux stocks</strong> distincts : un pour la vente, un pour la location. Un même jeu peut donc être en rupture à la vente mais encore disponible à la location.</p>
<p>Ce projet est un <strong>capstone</strong> (mot anglais : la « pierre de couronnement », le dernier bloc posé au sommet d'un arc pour le tenir en place). Il rassemble en un seul programme, écrit en langage <strong>C</strong>, tout ce que les cours précédents ont construit séparément : la conception Merise, le SQL, la base MySQL et le langage C.</p>

<h3>2. Le langage C, en un mot</h3>
<p>Le <strong>C</strong> est un <em>langage de programmation</em> : une façon d'écrire des <strong>instructions</strong> (des ordres) que l'ordinateur exécutera une par une. Contrairement à un tableur ou à un site web tout prêt, le C est un langage <strong>compilé</strong> : on écrit du texte lisible par un humain, puis un outil appelé <strong>compilateur</strong> le <em>traduit</em> en langage machine (des 0 et des 1) que le processeur comprend. C'est comme écrire une lettre en français puis la faire traduire en une langue que seul l'ordinateur parle.</p>
<p>Le C est un langage <strong>bas niveau</strong> : très proche de la machine, rapide, mais sans « filet de sécurité » automatique. Il n'a <strong>pas de framework web</strong> (pas de boîte à outils toute faite pour construire un site) : on doit donc organiser soi-même le programme, à la main. D'où l'importance de l'étape suivante.</p>

<h3>3. Une architecture en couches</h3>
<p>L'<strong>architecture</strong> d'un programme, c'est sa façon d'être <em>organisé</em> : comment on découpe le travail en morceaux et qui parle à qui. Une <strong>architecture en couches</strong> (en anglais <em>layers</em>) empile ces morceaux comme les étages d'un immeuble : chaque étage a un rôle précis et ne s'adresse qu'à l'étage juste en dessous.</p>
<p>Analogie du restaurant : la <strong>salle</strong> prend la commande et sert (elle ne cuisine pas), la <strong>cuisine</strong> décide et prépare (elle ne va pas à la cave), la <strong>cave</strong> range et sort les ingrédients (elle ne décide pas du menu). Chacun son métier : c'est exactement l'idée des couches.</p>
<pre class="pseudo">Flux d'une action :
UI (console)  →  Service (métier)  →  DAO (accès MySQL)  →  MySQL
   ui.c            services.c            dao.c              base
lit / affiche      DÉCIDE                lit/écrit SQL       stocke</pre>
<p>Décryptons chaque couche :</p>
<ul>
<li><strong>UI</strong> = <em>User Interface</em>, l'« interface utilisateur ». C'est la partie que la personne voit et avec laquelle elle interagit. Ici c'est une interface <strong>console</strong> (un écran de texte, sans souris ni boutons, où l'on tape au clavier). L'UI <em>lit</em> ce que tape l'utilisateur et <em>affiche</em> les résultats — rien d'autre.</li>
<li><strong>Service</strong> = la couche <strong>métier</strong>. « Métier » désigne les <strong>règles de gestion</strong> du domaine : par exemple « si le stock est nul, on refuse la location ». C'est le <em>cerveau</em> qui décide.</li>
<li><strong>DAO</strong> = <em>Data Access Object</em>, l'« objet d'accès aux données ». C'est la couche qui parle à la base : elle traduit les demandes en <strong>SQL</strong> (le langage des bases de données) et va lire ou écrire dans MySQL. Elle ne décide de rien, elle exécute.</li>
<li><strong>MySQL</strong> est le <strong>SGBD</strong> (Système de Gestion de Base de Données) : un logiciel spécialisé qui range durablement les données dans des <strong>tables</strong> (des tableaux à lignes et colonnes) et sait les retrouver vite. C'est notre « cave » qui garde tout même quand le programme est éteint.</li>
</ul>
<p>La <strong>règle d'or</strong> : chaque couche ne parle qu'à la suivante, et les <strong>règles métier</strong> (stocks, tarifs, refus) vivent uniquement dans les <strong>services</strong>. Ainsi une règle est écrite à un seul endroit.</p>

<h3>4. L'arborescence en fichiers .h / .c</h3>
<p>En C, un programme est découpé en plusieurs <strong>fichiers</strong>, appelés <strong>modules</strong>. Un module se compose toujours de <strong>deux fichiers</strong> qui vont par paire :</p>
<ul>
<li>un fichier <strong>.h</strong> (« header », en-tête) : la <em>déclaration</em>, c'est-à-dire la liste des fonctions disponibles — comme le <strong>sommaire</strong> d'un livre qui annonce ce qu'on trouvera ;</li>
<li>un fichier <strong>.c</strong> : la <em>définition</em>, c'est-à-dire le vrai contenu, le <em>comment ça marche</em> — comme les chapitres eux-mêmes.</li>
</ul>
<p>Ce découpage permet la <strong>compilation séparée</strong> : on peut traduire chaque module indépendamment, puis les assembler. Voici les modules du projet :</p>
<pre class="pseudo">main.c          la boucle de menu, point d'entrée du programme
ui.c / ui.h     affichage et saisies (aucune règle métier)
services.c/.h   la logique métier (louer, acheter, gérer les stocks)
dao.c / dao.h   l'accès MySQL (les requêtes SELECT/INSERT/UPDATE)
db.c / db.h     la connexion MySQL partagée par tout le programme
modele.h        les struct : Jeu, Utilisateur, Location (les données)
Makefile        la recette qui compile et lie tous les .c ensemble</pre>
<p>Deux mots à définir ici. Une <strong>struct</strong> (structure) est un <em>regroupement</em> de plusieurs informations sous un seul nom : par exemple un <code>Jeu</code> réunit son titre, son prix et ses deux stocks — comme une fiche cartonnée qui rassemble plusieurs champs. Le <strong>Makefile</strong> est un fichier-<em>recette</em> : il décrit comment <strong>compiler</strong> (traduire) puis <strong>lier</strong> (assembler) tous les <code>.c</code> pour obtenir le programme final, sans retaper les commandes à la main.</p>

<h3>5. Pourquoi une couche service ?</h3>
<p>Trois raisons concrètes. Primo, la règle « stock nul → refus » doit exister <strong>une seule fois</strong> (pas recopiée dans chaque menu) : sinon, le jour où deux copies divergent, l'application se contredit. Secundo, en isolant le métier, il devient <strong>testable</strong> sans base de données ni écran — on peut vérifier la logique toute seule. Tertio, l'UI console et un futur module (une API web, une autre interface) <strong>réutilisent</strong> le même code de décision.</p>
<div class="warn">Une fonction d'affichage qui calcule un tarif ou contrôle un stock est un <strong>défaut d'architecture</strong> : le jour où deux endroits calculent différemment, les données se mettent à mentir.</div>
<div class="tip">Dessine ce flux (UI → service → DAO → MySQL) sur une feuille et garde-le sous les yeux : chacune des 20 prochaines leçons vient remplir une de ces cases.</div>`,
  exercises: [
    { type: "qcm", q: "La Ludothèque propose…", opts: ["Seulement l'achat", "L'achat ET la location de jeux", "Seulement la location", "L'échange entre clients"], a: 1, exp: "Deux opérations, deux stocks." },
    { type: "qcm", q: "Les trois profils sont…", opts: ["Client, Vendeur, Administrateur", "Client, Gérant, Fournisseur", "Lecteur, auteur, éditeur", "Client, Vendeur, Comptable"], a: 0, exp: "Définis dès le MCD Merise." },
    { type: "qcm", q: "L'ordre des couches est…", opts: ["UI → service → DAO → MySQL", "MySQL → UI → service", "DAO → UI → service", "service → UI → DAO"], a: 0, exp: "Chaque couche appelle la suivante." },
    { type: "qcm", q: "Les règles métier vivent dans…", opts: ["l'UI", "les services", "le DAO", "modele.h"], a: 1, exp: "La couche qui décide." },
    { type: "qcm", q: "Le rôle de l'UI (ui.c) :", opts: ["Décider des règles", "Lire les saisies et afficher, en déléguant", "Écrire du SQL", "Créer les tables"], a: 1, exp: "Traduction écran, pas décision." },
    { type: "qcm", q: "Le DAO (dao.c) s'occupe de…", opts: ["l'affichage", "l'accès à MySQL (SELECT/INSERT/UPDATE)", "la connexion réseau web", "le calcul des tarifs"], a: 1, exp: "Data Access Object : la couche base." },
    { type: "qcm", q: "Pourquoi une couche service ? (raison FAUSSE)", opts: ["Règle écrite une seule fois", "Métier testable sans base ni écran", "Code réutilisable", "Ça fait plus de fichiers, donc c'est mieux"], a: 3, exp: "Le nombre de fichiers n'est pas un but." },
    { type: "vf", q: "Chaque jeu a deux stocks : vente et location.", a: true, exp: "Décision structurante du modèle." },
    { type: "qcm", q: "modele.h contient…", opts: ["les struct du domaine (Jeu, Utilisateur…)", "les requêtes SQL", "la fonction main()", "les tests"], a: 0, exp: "Les types de données partagés." },
    { type: "qcm", q: "En C, un module se compose de…", opts: ["un seul fichier", "un .h (déclarations) + un .c (définitions)", "deux fichiers .c", "un seul fichier .o"], a: 1, exp: "Compilation séparée : .h/.c." },
    { type: "vf", q: "Un contrôle de stock dans une fonction d'affichage est un bon réflexe.", a: false, exp: "Défaut d'architecture : il appartient au service." },
    { type: "qcm", q: "Le Makefile sert à…", opts: ["afficher le menu", "compiler et lier tous les .c", "se connecter à MySQL", "stocker les données"], a: 1, exp: "Automatiser la construction." },
    { type: "qcm", q: "Le schéma des tables vient…", opts: ["du code C écrit d'abord", "du MCD Merise conçu en amont", "du frontend", "du Makefile"], a: 1, exp: "La conception précède le code." },
    { type: "qcm", q: "Une future interface (autre UI) pourrait réutiliser…", opts: ["deux logiques métier", "la même couche service", "deux bases", "rien"], a: 1, exp: "Une logique, plusieurs présentations." },
    { type: "vf", q: "Ce capstone réutilise Merise, SQL, MySQL et le langage C sans tout réapprendre.", a: true, exp: "Le but : les faire travailler ensemble." }
  ],
  final: {
    title: "Exercice final — L'architecture sur le papier",
    intro: `<p>On vérifie que la carte du projet est claire avant de coder.</p>`,
    questions: [
      { type: "qcm", q: "Une action « louer le jeu 12 » traverse :", opts: ["UI → service → DAO → MySQL", "MySQL → DAO → UI", "service → UI", "UI → MySQL direct"], a: 0, exp: "Le flux complet en couches." },
      { type: "qcm", q: "Le contrôle « stock nul → refus » vit dans :", opts: ["services.c", "ui.c", "modele.h", "dao.c"], a: 0, exp: "Règle métier." },
      { type: "qcm", q: "Le SQL des tables descend :", opts: ["du MCD Merise", "du code de l'UI", "du Makefile", "des services"], a: 0, exp: "Conception → code." },
      { type: "qcm", q: "L'UI « louer » fait :", opts: ["le moins possible : lire, déléguer, afficher", "le calcul du tarif", "le SQL", "la création de table"], a: 0, exp: "Traduction écran." },
      { type: "vf", q: "Une seule couche service portera toutes les règles métier.", a: true, exp: "C'est tout l'intérêt du découplage." }
    ],
    solution: `<pre class="pseudo">Action /louer 12/ (ui.c)                     // l'UI lit l'identifiant du jeu tapé par l'utilisateur
  → service_louer (services.c)              // le SERVICE vérifie le stock et DÉCIDE d'accepter ou refuser
  → dao_* (dao.c)                           // le DAO exécute en base : START TRANSACTION, INSERT, UPDATE, COMMIT
  → MySQL                                   // la base PERSISTE (enregistre durablement) le changement
  → l'UI affiche le résultat                // retour à l'écran : message correspondant au code renvoyé</pre>
<p>La carte est posée : chaque couche a un rôle unique et ne parle qu'à la suivante. Demain : créer le projet et le brancher sur MySQL.</p>`
  }
};
