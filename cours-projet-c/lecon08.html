<script>
var DAY = {
  num: 8,
  title: "Validation et gestion des erreurs",
  subtitle: "Des codes de retour cohérents : valider les entrées et remonter les échecs proprement.",
  theory: `
<h3>1. Un enum de codes de retour</h3>
<p>Un <strong>enum</strong> (énumération) est une liste de <em>noms</em> auxquels le compilateur associe automatiquement des numéros (le premier vaut 0, le suivant 1, etc.). Plutôt que de renvoyer des <code>0</code>/<code>-1</code> anonymes partout — dont personne ne se rappelle la signification — on donne un <strong>nom parlant</strong> à chaque résultat possible. C'est plus lisible et uniforme dans tout le projet : lire <code>ERR_STOCK</code> est bien plus clair que lire <code>2</code>.</p>
<pre class="pseudo">typedef enum { OK, ERR_STOCK, ERR_SAISIE, ERR_DROIT, ERR_DB } Code;   // 5 résultats nommés (OK=0, ERR_STOCK=1, ERR_SAISIE=2, …), regroupés sous le type "Code"</pre>

<h3>2. Valider avant d'agir</h3>
<p><strong>Valider</strong>, c'est vérifier qu'une donnée est <em>acceptable</em> avant de s'en servir. On valide « au plus tôt », c'est-à-dire dès l'entrée dans le service, <em>avant</em> tout accès à la base : inutile d'aller déranger MySQL pour une durée absurde.</p>
<pre class="pseudo">Code valider_duree(int jours) {           // vérifie qu'une durée de location est raisonnable
    if (jours &lt; 1 || jours &gt; 30) return ERR_SAISIE;   // hors de l'intervalle [1;30] jours → saisie invalide (|| = OU)
    return OK;                             // durée correcte : on renvoie OK
}</pre>
<p>Le symbole <code>||</code> signifie « OU » : la condition est vraie si <em>au moins</em> l'un des deux tests l'est (durée trop petite <strong>ou</strong> trop grande). On valide au plus tôt : une durée absurde ou un identifiant négatif est rejeté <strong>avant</strong> tout accès à la base.</p>

<h3>3. Remonter, ne pas afficher</h3>
<p><strong>Remonter</strong> (ou <em>propager</em>) une erreur, c'est la <em>renvoyer</em> à celui qui a appelé la fonction, au lieu de l'afficher soi-même. Un service <strong>renvoie un code</strong> ; c'est l'UI qui traduit ce code en message pour l'humain. Ainsi le métier reste réutilisable : une API afficherait le même code d'une autre façon (en JSON, par exemple).</p>
<pre class="pseudo">const char *code_message(Code c) {        // traduit un Code en texte lisible (rôle de l'UI) ; renvoie une chaîne constante
    switch (c) {                           // selon la valeur du code reçu…
        case OK:        return "OK";                      // succès
        case ERR_STOCK: return "Stock insuffisant";       // pas assez de stock
        case ERR_SAISIE:return "Saisie invalide";         // entrée utilisateur incorrecte
        case ERR_DROIT: return "Acces refuse";            // autorisation refusée
        case ERR_DB:    return "Erreur base de donnees";   // problème côté base de données
    }
    return "?";                            // cas imprévu (par sécurité : ne devrait jamais arriver)
}</pre>
<p>Le type de retour <code>const char *</code> est un pointeur vers une <strong>chaîne de caractères constante</strong> (un texte qu'on ne modifiera pas). Le <code>switch</code> choisit une branche selon la valeur : un <code>case</code> par code possible.</p>

<h3>4. Le contrat clair</h3>
<div class="warn">Chaque fonction qui peut échouer renvoie un <code>Code</code> (ou une valeur sentinelle documentée, comme <code>-1</code>). L'appelant <strong>doit</strong> le tester : ignorer un code d'erreur, c'est laisser passer un <strong>bug silencieux</strong> — une erreur qui ne se voit pas, ne provoque pas de plantage immédiat, mais fausse discrètement les données. C'est le fléau du C, qui ne force pas à vérifier les retours.</div>
<div class="tip">Ce petit enum + une fonction de message donnent une gestion d'erreurs homogène et centralisée. Ajouter un nouveau cas d'erreur, c'est ajouter une valeur à l'enum et une ligne au switch.</div>`,
  exercises: [
    { type: "qcm", q: "À quoi sert un enum de codes de retour ?", opts: ["à trier", "à nommer les résultats (OK, erreurs) de façon lisible", "à compter les erreurs", "à afficher"], a: 1, exp: "Uniformité et lisibilité." },
    { type: "qcm", q: "Quand valider une durée de location ?", opts: ["après l'écriture", "avant tout accès à la base (au plus tôt)", "jamais", "à l'affichage"], a: 1, exp: "Rejeter tôt les entrées absurdes." },
    { type: "qcm", q: "Un service, en cas d'erreur, doit…", opts: ["afficher un message", "renvoyer un code que l'UI traduira", "quitter le programme", "ignorer"], a: 1, exp: "Séparer décision et présentation." },
    { type: "qcm", q: "Qui traduit un Code en message ?", opts: ["le DAO", "l'UI", "MySQL", "le service"], a: 1, exp: "L'UI présente." },
    { type: "qcm", q: "code_message utilise idéalement…", opts: ["une boucle", "un switch sur le Code", "un malloc", "un fichier"], a: 1, exp: "Un case par code." },
    { type: "qcm", q: "Ignorer un code d'erreur mène à…", opts: ["rien", "un bug silencieux", "un crash immédiat", "une erreur de compilation"], a: 1, exp: "Le fléau du C : l'échec passe inaperçu." },
    { type: "qcm", q: "valider_duree(0) devrait renvoyer…", opts: ["OK", "ERR_SAISIE", "ERR_DB", "0 jour est valide"], a: 1, exp: "0 jour n'a pas de sens." },
    { type: "qcm", q: "Pourquoi renvoyer un code plutôt qu'afficher dans le service ?", opts: ["esthétique", "pour que le métier reste réutilisable (UI, API…)", "pour la vitesse", "pour simplifier l'UI"], a: 1, exp: "Le service ne connaît pas l'écran." },
    { type: "qcm", q: "Ajouter un nouveau cas d'erreur =", opts: ["réécrire tout", "une valeur d'enum + une ligne au switch", "un nouveau fichier", "modifier tous les appels"], a: 1, exp: "Extension simple et locale." },
    { type: "qcm", q: "ERR_DROIT correspond à…", opts: ["stock nul", "un accès refusé (autorisation)", "une erreur SQL", "une saisie"], a: 1, exp: "Contrôle d'accès échoué." },
    { type: "vf", q: "L'appelant peut ignorer le Code renvoyé sans risque.", a: false, exp: "Faux : il doit le tester, sinon l'erreur est perdue." },
    { type: "qcm", q: "Valider « au plus tôt » signifie…", opts: ["après le COMMIT", "dès l'entrée dans le service, avant la base", "à l'affichage", "jamais"], a: 1, exp: "On rejette avant d'agir." },
    { type: "qcm", q: "Un enum rend le code…", opts: ["plus lent", "plus lisible (OK plutôt que 0)", "plus long inutilement", "moins portable"], a: 1, exp: "Des noms parlants." },
    { type: "qcm", q: "Le contrat d'une fonction faillible :", opts: ["ne rien renvoyer", "renvoyer un Code ou une sentinelle documentée", "afficher", "planter"], a: 1, exp: "Un résultat testable." },
    { type: "qcm", q: "La gestion d'erreurs homogène apporte…", opts: ["de la confusion", "cohérence et maintenabilité", "des fuites", "de la lenteur"], a: 1, exp: "Un seul style partout." }
  ],
  final: {
    title: "Exercice final — Chaîner les validations",
    intro: `<p>On valide une demande de location. Analyse :</p>
<pre class="pseudo">Code service_louer(MYSQL *c, int uid, int jeu_id, int jours) {   // tente de louer un jeu
    dao_inserer_location(c, uid, jeu_id, jours);   // BUG : insère sans rien valider ni vérifier le retour
    return OK;                                      // BUG : renvoie toujours OK, même en cas d'échec
}</pre>`,
    questions: [
      { type: "qcm", q: "Que manque-t-il avant d'insérer ?", opts: ["rien", "valider la durée (et le stock) et vérifier les erreurs", "un COMMIT préalable", "une nouvelle connexion"], a: 1, exp: "On agit sans rien contrôler." },
      { type: "qcm", q: "Si la durée est invalide, on renvoie…", opts: ["OK", "ERR_SAISIE", "on insère quand même", "ERR_DB"], a: 1, exp: "Rejeter la saisie fautive." },
      { type: "qcm", q: "Le retour de dao_inserer_location doit être…", opts: ["ignoré", "testé, pour renvoyer ERR_DB en cas d'échec", "affiché ici", "toujours OK"], a: 1, exp: "On propage l'erreur." },
      { type: "qcm", q: "Renvoyer toujours OK est…", opts: ["prudent", "faux : on masque les échecs réels", "rapide", "recommandé"], a: 1, exp: "Un mensonge dangereux." },
      { type: "qcm", q: "Où valider le stock disponible ?", opts: ["dans l'UI", "dans le service, via service_peut_louer, avant d'insérer", "dans le DAO seul", "nulle part"], a: 1, exp: "Règle métier, avant l'écriture." }
    ],
    solution: `<pre class="pseudo">Code service_louer(MYSQL *c, int uid, int jeu_id, int jours) {   // loue un jeu en validant chaque étape
    if (valider_duree(jours) != OK) return ERR_SAISIE;   // 1) durée valide ? sinon on refuse (saisie invalide)

    Jeu j;                                               // struct qui recevra le jeu demandé
    if (dao_jeu_par_id(c, jeu_id, &amp;j) != 0) return ERR_DB;   // 2) charger le jeu ; échec de lecture → erreur base
    if (!service_peut_louer(&amp;j))           return ERR_STOCK; // 3) stock disponible ? sinon stock insuffisant

    if (dao_inserer_location(c, uid, jeu_id, jours) != 0) return ERR_DB;   // 4) écrire la location ; échec → erreur base
    return OK;                                           // toutes les étapes ont réussi
}</pre>
<p>On valide, on vérifie le stock, on teste chaque appel du DAO, et on renvoie un code parlant. L'UI n'aura qu'à le traduire. Demain : les utilisateurs et les trois rôles.</p>`
  }
};
</script>

  items: [
  { id: "projc-l08", title: "Valider une quantité d'achat", level: 2,
    statement: "Écris Code valider_quantite(int q, int stock_dispo) qui renvoie ERR_SAISIE si q <= 0, ERR_STOCK si q > stock_dispo, et OK sinon. Utilise l'enum Code { OK, ERR_STOCK, ERR_SAISIE, ERR_DROIT, ERR_DB }.",
    hints: [
      "Teste d'abord la saisie (q <= 0), puis la disponibilité (q > stock_dispo).",

    ],
    lang: "c",
    atoi: { cmd: "gcc prog.c -o prog && ./prog", expected: "0 2 1" },
    checklist: [
      "Testes-tu la saisie (q <= 0 → ERR_SAISIE) AVANT le stock ?",
      "Renvoies-tu ERR_STOCK quand q dépasse stock_dispo ?",
      "Le cas normal renvoie-t-il bien OK (valeur 0 de l'enum) ?",
      "Les valeurs affichées (0, 2, 1) correspondent-elles à OK, ERR_SAISIE, ERR_STOCK ?"
    ],
    solution: "#include <stdio.h>\n\ntypedef enum { OK, ERR_STOCK, ERR_SAISIE, ERR_DROIT, ERR_DB } Code;\n\nCode valider_quantite(int q, int stock_dispo) {\n    if (q <= 0)          return ERR_SAISIE;\n    if (q > stock_dispo) return ERR_STOCK;\n    return OK;\n}\nint main(void) {\n    printf(\"%d %d %d\\n\",\n           valider_quantite(2, 5),\n           valider_quantite(0, 5),\n           valider_quantite(9, 5));\n    return 0;\n}",
    note: "Deux causes d'échec distinctes, deux codes distincts : l'UI pourra afficher « saisie invalide » ou « stock insuffisant » selon le cas. On valide la saisie avant le stock." }
  ]
};
