<script>
var DAY = {
  num: 4,
  title: "Le modèle en struct : Jeu, Categorie, Fournisseur",
  subtitle: "Refléter les tables SQL en types C : une ligne de la base = une struct remplie.",
  theory: `
<h3>1. Une struct par table</h3>
<p>Une <strong>struct</strong> (abréviation de <em>structure</em>) est un type qui <strong>regroupe plusieurs informations sous un seul nom</strong>. Imagine une fiche cartonnée d'un jeu : elle réunit son numéro, son titre, son prix, ses stocks. En C, cette fiche est une struct, et chaque case de la fiche s'appelle un <strong>champ</strong>. Chaque table de la base a ainsi son <em>miroir</em> en C : les colonnes deviennent des champs, avec les types C correspondants (<code>DECIMAL</code> → <code>double</code>, <code>VARCHAR</code> → <code>char[]</code>, <code>INT</code> → <code>int</code>).</p>
<p>Rappel des types C : <code>int</code> est un nombre <em>entier</em> (sans virgule) ; <code>double</code> est un nombre <em>à virgule</em> (comme un prix : 44.90) ; <code>char</code> contient <strong>un seul caractère</strong>, donc <code>char[]</code> (un tableau de <code>char</code>) sert à stocker <em>du texte</em>, lettre par lettre.</p>
<pre class="pseudo">/* modele.h */                                        // fichier d'en-tête qui regroupe tous les types du domaine
typedef struct { int id; char nom[50]; } Categorie;   // une catégorie = un id + un nom (miroir de la table categorie)

typedef struct {                 // on définit un nouveau type "Jeu" qui rassemble les infos d'un jeu
    int    id;                   // identifiant unique (clé primaire de la table jeu)
    char   nom[100];             // nom du jeu : jusqu'à 99 caractères + le '\\0' final
    double prix_achat;           // prix de vente (miroir du DECIMAL de la base)
    double prix_location;        // prix de location, par jour
    int    stock_vente;          // quantité en stock pour la vente
    int    stock_location;       // quantité en stock pour la location
    int    categorie_id;         // clé étrangère : numéro de la catégorie du jeu
} Jeu;                           // fin de la struct ; "Jeu" devient un type réutilisable partout</pre>
<p>Le mot <code>typedef</code> (<em>type definition</em>) crée un <strong>alias</strong>, un nom court pour un type. Grâce à <code>typedef struct {…} Jeu;</code>, on peut ensuite écrire simplement <code>Jeu j;</code> au lieu du plus long <code>struct Jeu j;</code>. C'est purement du confort d'écriture.</p>

<h3>2. Pourquoi regrouper en struct ?</h3>
<p>Un jeu n'est pas six variables séparées qui traînent chacune de leur côté, mais <strong>une entité cohérente</strong>. La struct la transporte <em>d'un seul bloc</em> entre les couches : le DAO la remplit depuis la base, le service la lit et décide, l'UI l'affiche. On passe un colis fermé plutôt que six objets en vrac — moins d'oublis, moins d'erreurs.</p>

<h3>3. Prévoir la place des chaînes</h3>
<p>En C, une chaîne de caractères (du texte) se termine toujours par un caractère invisible spécial noté <code>'\\0'</code> (le « caractère nul »), qui marque la <strong>fin du texte</strong> — comme le point final d'une phrase pour l'ordinateur. Il faut donc toujours réserver <em>une case de plus</em> que le nombre de lettres visibles.</p>
<pre class="pseudo">char nom[100];   // VARCHAR(100) → 100 caractères max, la place du '\\0' final étant déjà comprise dans la taille</pre>
<div class="warn">Dimensionne les tableaux <code>char</code> au moins aussi grands que les <code>VARCHAR</code> correspondants (avec la place du <code>'\\0'</code>). Un nom tronqué à la lecture est un bug silencieux : on utilisera <code>snprintf</code> pour copier en toute sécurité (elle refuse d'écrire au-delà de la taille indiquée, contrairement à l'ancienne <code>strcpy</code>).</div>

<h3>4. Le module modele.h</h3>
<p>Toutes les struct vivent dans <code>modele.h</code>, un fichier d'en-tête <strong>inclus</strong> (avec <code>#include</code>) par les services, le DAO et l'UI. C'est le <strong>vocabulaire commun</strong> du projet : toutes les couches parlent du même <code>Jeu</code> et du même <code>Utilisateur</code>, avec exactement les mêmes champs.</p>
<div class="tip">La struct est l'équivalent C d'un « objet » de données. Le C n'a pas de <strong>classes</strong> (comme Java ou C++), mais l'association « struct + fonctions qui prennent un <code>Jeu *</code> » reproduit l'idée : des données groupées, et des opérations qui agissent dessus. Le <code>Jeu *</code> est un <em>pointeur</em> vers un jeu — on le passe pour permettre à une fonction de modifier le vrai jeu, pas une copie.</div>`,
  exercises: [
    { type: "qcm", q: "En C, on modélise une table par…", opts: ["une fonction", "une struct", "un enum", "un tableau d'int"], a: 1, exp: "Une struct par entité." },
    { type: "qcm", q: "Un DECIMAL(6,2) SQL se mappe en C par…", opts: ["int", "double", "char", "bool"], a: 1, exp: "Un réel côté C." },

    { type: "qcm", q: "Pourquoi regrouper les champs d'un jeu ?", opts: ["Pour la vitesse", "Parce qu'ils forment une entité cohérente transportée d'un bloc", "Par obligation", "Pour réduire le code"], a: 1, exp: "La struct circule entre les couches." },
    { type: "qcm", q: "Où placer les struct du domaine ?", opts: ["dans main.c", "dans modele.h, inclus par tous", "dans le Makefile", "dans l'UI"], a: 1, exp: "Le vocabulaire commun du projet." },
    { type: "qcm", q: "Deux stocks côté C, ce sont…", opts: ["un seul int", "deux champs : stock_vente et stock_location", "un double", "un tableau"], a: 1, exp: "Miroir des deux colonnes." },
    { type: "qcm", q: "Comment copier un nom lu de la base dans le champ, sans risque ?", opts: ["strcpy sans limite", "snprintf(dest, sizeof(dest), \"%s\", src)", "strcat(dest, src)", "gets"], a: 1, exp: "snprintf borne la copie." },
    { type: "qcm", q: "Le champ id d'une struct Jeu correspond à…", opts: ["un prix", "la clé primaire de la table jeu", "un stock", "une catégorie"], a: 1, exp: "La colonne id." },
    { type: "qcm", q: "categorie_id dans la struct Jeu stocke…", opts: ["le nom de la catégorie", "l'identifiant (FK) de la catégorie", "le prix", "un booléen"], a: 1, exp: "La clé étrangère, un entier." },
    { type: "qcm", q: "Le C a-t-il des classes comme Java ?", opts: ["Oui", "Non : struct + fonctions", "Seulement en mode objet", "Avec un mot-clé class"], a: 1, exp: "Pas de classes ; on structure autrement." },
    { type: "vf", q: "Il faut dimensionner char nom[] au moins comme le VARCHAR correspondant.", a: true, exp: "Sinon le nom est tronqué à la lecture." },
    { type: "qcm", q: "Une struct transporte les données…", opts: ["champ par champ manuellement", "d'un bloc entre les couches", "via des variables globales", "par fichier"], a: 1, exp: "On passe la struct (ou son adresse)." },
    { type: "qcm", q: "Pour modifier une struct dans une fonction, on passe…", opts: ["la struct par valeur", "un pointeur (Jeu *)", "son nom", "sa taille"], a: 1, exp: "Par adresse, pour agir sur l'original." },
    { type: "qcm", q: "typedef struct {...} Jeu; permet d'écrire ensuite…", opts: ["struct Jeu j;", "Jeu j;", "int Jeu;", "struct j;"], a: 1, exp: "L'alias évite de répéter « struct »." },
    { type: "qcm", q: "La struct est l'équivalent C d'…", opts: ["un type primitif", "un objet de données (données groupées)", "une simple variable", "un tableau dynamique"], a: 1, exp: "Données + opérations associées." }
  ],
  final: {
    title: "Exercice final — La struct Utilisateur",
    intro: `<p>On modélise l'utilisateur. Analyse :</p>
<pre class="pseudo">typedef struct {                 // struct Utilisateur À CORRIGER
    int id;                      // identifiant unique (correct)
    char login;                  // BUG : un seul caractère, alors qu'un login est du TEXTE
    int role;                    // rôle en entier (peu lisible : un enum serait plus clair)
    char mot_de_passe[10];       // BUG : jamais le mot de passe en clair (et 10 est bien trop court)
} Utilisateur;</pre>`,
    questions: [
      { type: "qcm", q: "Problème n°1 — <code>char login</code> :", opts: ["Correct", "Un login est du texte : char login[50], pas un seul char", "Il faut int", "Rien"], a: 1, exp: "Un char ne contient qu'un caractère." },
      { type: "qcm", q: "Problème n°2 — stocker <code>mot_de_passe</code> en clair :", opts: ["Correct", "On ne stocke jamais le mot de passe : seulement son hash", "Il faut char[100]", "Rien"], a: 1, exp: "Un hash, jamais le mot de passe lui-même." },
      { type: "qcm", q: "Le champ role gagnerait à être…", opts: ["un double", "un enum Role (CLIENT, VENDEUR, ADMIN) pour la lisibilité", "un char", "un pointeur"], a: 1, exp: "Un enum rend le code parlant." },
      { type: "qcm", q: "Le hash devrait être dimensionné…", opts: ["char[10]", "assez grand (ex. char[255]) selon l'algorithme", "char[1]", "int"], a: 1, exp: "Un hash moderne est long." },
      { type: "qcm", q: "Où placer cette struct ?", opts: ["dans l'UI", "dans modele.h", "dans le Makefile", "dans dao.c seulement"], a: 1, exp: "Le vocabulaire commun." }
    ],
    solution: `<pre class="pseudo">/* modele.h */                                   // les types partagés du projet
typedef enum { CLIENT, VENDEUR, ADMIN } Role;    // un enum : 3 rôles nommés (CLIENT=0, VENDEUR=1, ADMIN=2)

typedef struct {                 // struct Utilisateur corrigée
    int  id;                     // identifiant unique de l'utilisateur
    char login[50];              // login en tableau de char : du texte (pas un seul caractère)
    Role role;                   // rôle lisible grâce à l'enum ci-dessus
    /* le hash reste côté DAO/service, pas forcément exposé ici */   // le mot de passe n'apparaît pas dans le modèle
} Utilisateur;</pre>
<p>Un login en tableau de char, un rôle en enum lisible, et surtout : jamais de mot de passe en clair dans le modèle. Le vocabulaire du projet est prêt. Demain : lire ces struct depuis MySQL (le DAO).</p>`
  }
};
