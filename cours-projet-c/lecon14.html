<script>
var DAY = {
  num: 14,
  title: "L'interface console : menus et navigation",
  subtitle: "Une UI qui lit, appelle un service, affiche le résultat — et rien de plus.",
  theory: `
<h3>1. Le rôle de l'UI</h3>
<p>L'<strong>UI</strong> (<em>User Interface</em>, l'« interface utilisateur ») est la partie que la personne voit et avec laquelle elle interagit. Ici c'est une interface <strong>console</strong> : un écran de texte, sans souris ni boutons, où l'on tape au clavier. Elle <strong>lit</strong> les choix et les paramètres, <strong>appelle</strong> le service adapté, puis <strong>affiche</strong> le résultat. Elle ne calcule aucun tarif, ne vérifie aucun stock, ne fait aucun SQL. Elle est le simple traducteur entre l'humain et le métier — comme le serveur d'un restaurant qui prend la commande et apporte le plat, sans cuisiner.</p>

<h3>2. La boucle de menu</h3>
<p>Le mot <code>void</code> devant un nom de fonction signifie « ne renvoie rien » (la fonction agit mais ne rapporte aucune valeur). La boucle <code>do … while</code> exécute son corps <strong>au moins une fois</strong>, puis recommence tant que la condition reste vraie — idéal pour un menu, qu'on veut afficher au moins une fois.</p>
<pre class="pseudo">void menu(MYSQL *c, Utilisateur *u) {           // affiche le menu en boucle ; void = ne renvoie rien
    int choix;                                  // l'entier dans lequel on rangera le choix tapé
    do {                                        // do-while : on exécute le corps AU MOINS une fois
        afficher_menu(u);                       // affiche les options adaptées au rôle de u
        if (scanf("%d", &amp;choix) != 1) break;    // lit un entier au clavier ; si la lecture échoue, on sort de la boucle
        vider_entree();                         // nettoie le tampon clavier (le reste de la ligne)
        switch (choix) {                        // aiguille selon la valeur de choix
            case 1: ui_catalogue(c); break;     // choix 1 : afficher le catalogue, puis sortir du switch
            case 2: ui_louer(c, u);  break;     // choix 2 : lancer l'écran de location
            case 3: ui_acheter(c, u);break;     // choix 3 : lancer l'écran d'achat
            case 0: break;                      // choix 0 : ne rien faire (on quittera via la condition du while)
            default: printf("Choix inconnu\\n"); // toute autre valeur : afficher un message d'erreur
        }
    } while (choix != 0);                       // on recommence TANT QUE choix n'est pas 0 (0 = Quitter)
}</pre>
<p><code>scanf</code> (<em>scan formatted</em>, « lire au format ») lit une saisie clavier ; <code>"%d"</code> est un gabarit qui veut dire « attends un nombre entier ». L'esperluette <code>&amp;choix</code> donne l'<strong>adresse</strong> de la variable <code>choix</code>, pour que <code>scanf</code> sache où déposer ce qu'il lit. <code>scanf</code> renvoie le nombre de valeurs correctement lues : <code>!= 1</code> détecte donc une saisie ratée. <code>printf</code> (<em>print formatted</em>) affiche du texte à l'écran.</p>

<h3>3. Lire proprement au clavier</h3>
<p>Le <strong>tampon</strong> (en anglais <em>buffer</em>) est la petite zone d'attente où le système range ce que vous tapez avant que le programme ne le lise, un peu comme un tapis roulant de caisse. Après avoir lu un nombre, un retour à la ligne <code>'\\n'</code> (le caractère produit par la touche Entrée) y reste souvent : il faut le retirer.</p>
<pre class="pseudo">void vider_entree(void) {                 // vide le reste de la ligne resté dans le tampon ; (void) = fonction sans paramètre
    int ch; while ((ch = getchar()) != '\\n' &amp;&amp; ch != EOF) {}   // lit caractère par caractère jusqu'au saut de ligne ou la fin de saisie
}
// pour lire un texte avec espaces, borné :
scanf(" %49[^\\n]", nom);                 // lit au plus 49 caractères de la ligne (espaces compris) sans déborder</pre>
<p><code>getchar</code> lit <strong>un</strong> caractère à la fois. <code>EOF</code> (<em>End Of File</em>, « fin de fichier ») est la marque spéciale signalant qu'il n'y a plus rien à lire. Le <code>&amp;&amp;</code> veut dire « ET ». Le gabarit <code>%49[^\\n]</code> lit une suite de caractères qui ne sont pas un saut de ligne, dans la limite de 49 — la borne empêche de dépasser la taille du tableau.</p>
<div class="warn">Mélanger <code>scanf("%d")</code> et la lecture de chaînes laisse souvent un <code>'\\n'</code> dans le tampon. On le vide entre les saisies pour éviter les lectures « fantômes ». Et on borne toujours la taille (<code>%49s</code>) pour ne pas provoquer un <strong>débordement de tampon</strong> — écrire au-delà de la case prévue, un grand classique de bugs et de failles.</div>

<h3>4. Afficher le résultat d'un service</h3>
<pre class="pseudo">void ui_louer(MYSQL *c, Utilisateur *u) {       // écran de location
    int id, jours;                              // le numéro du jeu et la durée demandée
    printf("Jeu ? ");   scanf("%d", &amp;id);       // demande puis lit le numéro du jeu
    printf("Jours ? ");  scanf("%d", &amp;jours);   // demande puis lit le nombre de jours
    Code r = service_louer(c, u->id, id, jours); // délègue TOUT le métier au service ; r reçoit le code de résultat
    printf("%s\\n", code_message(r));            // traduit le code en message lisible et l'affiche
}</pre>
<p><code>%s</code> est le gabarit d'un texte (une chaîne de caractères) : <code>printf("%s\\n", …)</code> affiche le message renvoyé par <code>code_message(r)</code>, une fonction qui convertit un code de résultat en phrase compréhensible. <code>u-&gt;id</code> se lit « le champ id de l'utilisateur pointé par u ».</p>
<div class="tip">L'UI reste mince : chaque action tient en « lire → appeler service → afficher <code>code_message</code> ». Toute la logique est ailleurs. Résultat : on pourrait remplacer la console par une autre interface sans toucher au métier.</div>`,
  exercises: [
    { type: "qcm", q: "Le rôle de l'UI est de…", opts: ["calculer les tarifs", "lire, appeler un service, afficher", "faire du SQL", "gérer les transactions"], a: 1, exp: "Traduction humain ↔ métier." },
    { type: "qcm", q: "L'UI calcule-t-elle les tarifs ?", opts: ["oui", "non : elle délègue au service", "parfois", "toujours"], a: 1, exp: "Le métier est ailleurs." },
    { type: "qcm", q: "Quelle boucle pour un menu répété ?", opts: ["for figé", "do-while (afficher au moins une fois)", "while sans corps", "aucune"], a: 1, exp: "do-while jusqu'à « Quitter »." },
    { type: "qcm", q: "afficher_menu(u) adapte les options…", opts: ["au hasard", "selon le rôle de l'utilisateur", "selon les préférences enregistrées", "jamais"], a: 1, exp: "Client, vendeur, admin voient des menus différents." },
    { type: "qcm", q: "Pourquoi vider le tampon entre saisies ?", opts: ["pour la vitesse", "pour éviter un '\\n' résiduel qui fausse la lecture suivante", "pour libérer la mémoire", "sans raison"], a: 1, exp: "Éviter les lectures fantômes." },
    { type: "qcm", q: "Pour lire un texte avec espaces, borné :", opts: ["scanf(\"%s\", nom)", "scanf(\" %49[^\\n]\", nom)", "gets(nom)", "scanf(\"%d\", nom)"], a: 1, exp: "%[^\\n] lit la ligne ; 49 borne." },
    { type: "qcm", q: "ui_louer, après le service, affiche…", opts: ["le SQL", "code_message(r) (le résultat traduit)", "le code brut du service", "rien"], a: 1, exp: "L'UI traduit le code." },
    { type: "qcm", q: "Remplacer la console par une autre interface exigerait…", opts: ["de tout réécrire", "peu de changements : le métier ne bouge pas", "de changer la base", "d'ajouter des règles"], a: 1, exp: "Le découplage paie." },
    { type: "qcm", q: "gets() est…", opts: ["recommandé", "à proscrire (débordement) ; préférer fgets/scanf borné", "rapide et sûr", "obligatoire"], a: 1, exp: "gets ne borne pas : dangereux." },
    { type: "qcm", q: "Un choix inconnu dans le switch mène à…", opts: ["un plantage", "le cas default (message d'erreur)", "une boucle infinie", "rien"], a: 1, exp: "default gère l'imprévu." },
    { type: "vf", q: "L'UI doit contenir la logique métier pour aller plus vite.", a: false, exp: "Faux : la logique reste dans les services." },
    { type: "qcm", q: "scanf(\"%d\", &choix) != 1 teste…", opts: ["si choix vaut 1", "si la lecture d'un entier a échoué", "si l'entier est négatif", "si la saisie est vide"], a: 1, exp: "Robustesse de la saisie." },
    { type: "qcm", q: "Borner la saisie (%49s) protège contre…", opts: ["l'injection SQL", "le débordement de tampon", "les fuites mémoire", "les erreurs de calcul"], a: 1, exp: "On ne dépasse pas la taille du tableau." },
    { type: "qcm", q: "Chaque action de l'UI tient en…", opts: ["lire → appeler service → afficher", "SQL → COMMIT", "calcul → SQL", "rien"], a: 0, exp: "Une UI mince." },
    { type: "qcm", q: "L'affichage du menu selon le rôle relève de…", opts: ["confort d'UX (la sécurité reste au service)", "la seule sécurité", "la logique métier", "la configuration système"], a: 0, exp: "Le contrôle réel est côté service." }
  ],
  final: {
    title: "Exercice final — Une UI trop bavarde",
    intro: `<p>Cette fonction d'UI en fait trop. Analyse :</p>
<pre class="pseudo">void ui_louer(MYSQL *c, Utilisateur *u) {       // écran de location qui EN FAIT TROP
    int id, jours;                              // numéro du jeu et durée
    scanf("%d %d", &amp;id, &amp;jours);                // lit les deux nombres d'un coup (sans vérifier la saisie)
    Jeu j; dao_jeu_par_id(c, id, &amp;j);           // DÉFAUT : l'UI appelle le DAO directement (elle devrait passer par le service)
    if (j.stock_location > 0) {                 // DÉFAUT : l'UI vérifie le stock (c'est une règle métier)
        double t = j.prix_location * jours * 0.9;   // DÉFAUT : l'UI calcule le tarif (règle métier dupliquée)
        dao_inserer_location(c, u->id, id, jours);  // DÉFAUT : insertion sans transaction (pas atomique)
        printf("Loue pour %.2f\\n", t);         // affiche le tarif calculé avec 2 décimales
    }
}</pre>`,
    questions: [
      { type: "qcm", q: "Défaut n°1 — l'UI fait du SQL (dao_*) :", opts: ["Correct", "L'UI ne devrait pas appeler le DAO : elle passe par le service", "trop lent", "rien"], a: 1, exp: "L'UI parle au service, pas au DAO." },
      { type: "qcm", q: "Défaut n°2 — l'UI calcule le tarif :", opts: ["Correct", "Le tarif est une règle métier : c'est service_tarif", "le calcul est trop lent", "rien"], a: 1, exp: "Duplication de la règle." },
      { type: "qcm", q: "Défaut n°3 — pas de transaction :", opts: ["Correct", "Louer doit être atomique : passer par service_louer (transaction)", "il suffit d'ajouter un COMMIT", "rien"], a: 1, exp: "L'atomicité vit dans le service." },
      { type: "qcm", q: "La bonne UI se contente de…", opts: ["tout faire", "lire id et jours, appeler service_louer, afficher code_message", "faire le SQL", "calculer"], a: 1, exp: "Mince et déléguée." },
      { type: "qcm", q: "Avantage de corriger :", opts: ["aucun", "une seule source de vérité, UI remplaçable", "un code plus rapide", "moins de fonctions à écrire"], a: 1, exp: "Découplage et cohérence." }
    ],
    solution: `<pre class="pseudo">void ui_louer(MYSQL *c, Utilisateur *u) {       // écran de location, version mince
    int id, jours;                              // numéro du jeu et durée
    printf("Jeu ? ");  if (scanf("%d", &amp;id) != 1) return;    // demande et lit le jeu ; saisie invalide → on abandonne
    printf("Jours ? "); if (scanf("%d", &amp;jours) != 1) return; // demande et lit les jours ; saisie invalide → on abandonne

    Code r = service_louer(c, u->id, id, jours);  // TOUT le métier est ici (stock, tarif, transaction)
    printf("%s\\n", code_message(r));              // on affiche le résultat traduit
}</pre>
<p>L'UI ne fait que lire, déléguer au service et afficher. Le calcul, le stock, la transaction : tout est dans <code>service_louer</code>. Demain : recherche, filtres et pagination.</p>`
  }
};
