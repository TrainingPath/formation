<script>
var DAY = {
  num: 16,
  title: "Les espaces client, vendeur et administrateur",
  subtitle: "Un menu adapté à chaque rôle — l'affichage suit, la sécurité reste au service.",
  theory: `
<h3>1. Trois espaces, un même programme</h3>
<p>Un <strong>espace</strong> désigne ici l'ensemble des écrans et options réservés à un profil. Selon le rôle de l'utilisateur connecté, le menu affiche des options différentes. Le <strong>client</strong> loue et achète, le <strong>vendeur</strong> gère le stock, l'<strong>administrateur</strong> gère les comptes et les statistiques. Un seul et même programme s'adapte : c'est le rôle qui change ce que l'on voit.</p>

<h3>2. Composer le menu selon le rôle</h3>
<p>On affiche d'abord les options communes à tous, puis on ajoute les options réservées à l'aide des gardes vus en leçon 11 (<code>peut_gerer_stock</code>, <code>peut_administrer</code>). <code>role_libelle</code> transforme le rôle en un mot lisible pour le titre.</p>
<pre class="pseudo">void afficher_menu(const Utilisateur *u) {                       // affiche le menu adapté à l'utilisateur u
    printf("\\n=== Espace %s ===\\n", role_libelle(u->role));    // titre : "Espace client/vendeur/administrateur" selon le rôle
    printf("1) Catalogue  2) Louer  3) Acheter  4) Mes locations\\n");   // options communes à TOUS les utilisateurs
    if (peut_gerer_stock(u))                                     // si u est vendeur ou admin…
        printf("5) Reapprovisionner  6) Ventes du jour\\n");     // …ajouter les options de gestion du stock
    if (peut_administrer(u))                                     // si u est admin…
        printf("7) Gerer les comptes  8) Statistiques\\n");      // …ajouter les options d'administration
    printf("0) Quitter\\n");                                     // option de sortie, proposée à tous
}</pre>
<p>Ici <code>%s</code> est remplacé par le texte renvoyé par <code>role_libelle(u-&gt;role)</code>, et <code>\\n</code> passe à la ligne. Les <code>if</code> font apparaître ou disparaître des lignes de menu selon le rôle.</p>

<h3>3. L'affichage n'est pas la sécurité</h3>
<div class="warn">Masquer l'option « Statistiques » à un client est du <strong>confort</strong>, pas une barrière. Si le client tapait quand même 8, le <strong>service</strong> refuserait (leçon 11). Les deux vont ensemble : un menu clair <em>et</em> un contrôle côté service. Ne jamais compter sur l'un seul.</div>

<h3>4. Router selon le choix ET le rôle</h3>
<p><strong>Router</strong>, c'est aiguiller chaque choix vers la bonne action. On en profite pour revérifier le droit au moment de lancer une action sensible.</p>
<pre class="pseudo">case 5:                                        // l'utilisateur a tapé 5 (Réapprovisionner)
    if (peut_gerer_stock(u)) ui_reappro(c, u);  // vérifie le droit AVANT de lancer l'action
    else printf("Acces refuse\\n");             // sinon : refuser (double garde, en plus du menu)
    break;                                      // sortir du switch</pre>
<div class="tip">Chaque espace n'expose que ses actions, et chaque action revérifie le droit. C'est la <strong>défense en profondeur</strong> : plusieurs contrôles indépendants valent mieux qu'un seul, comme plusieurs serrures sur une même porte. Le même <strong>binaire</strong> (le programme compilé) sert les trois profils, sans code dupliqué.</div>`,
  exercises: [
    { type: "qcm", q: "Le menu affiché dépend…", opts: ["de l'heure", "du rôle de l'utilisateur connecté", "du nombre de jeux disponibles", "de la dernière option choisie"], a: 1, exp: "Client, vendeur, admin voient des options différentes." },
    { type: "qcm", q: "Le client peut…", opts: ["gérer les comptes", "louer et acheter", "voir les statistiques", "gérer le stock"], a: 1, exp: "Ses actions de base." },
    { type: "qcm", q: "Le vendeur peut en plus…", opts: ["gérer les comptes", "gérer le stock", "consulter les journaux système", "créer des comptes administrateurs"], a: 1, exp: "Réapprovisionner, enregistrer." },
    { type: "qcm", q: "L'admin peut en plus…", opts: ["seulement gérer le stock", "gérer les comptes et voir les statistiques", "modifier les prix des jeux", "accéder aux ventes du jour"], a: 1, exp: "Administration." },
    { type: "qcm", q: "Masquer une option est…", opts: ["une barrière de sécurité", "du confort ; la sécurité est au service", "une protection complète", "un contrôle d'accès réel"], a: 1, exp: "Confort d'UX, pas sécurité." },
    { type: "qcm", q: "Si un client tape une option cachée…", opts: ["ça marche", "le service refuse (contrôle d'accès)", "le menu principal réapparaît", "l'action est mise en attente"], a: 1, exp: "Le service est la vraie barrière." },
    { type: "qcm", q: "La « défense en profondeur » signifie…", opts: ["un seul contrôle", "plusieurs contrôles indépendants", "un contrôle centralisé unique", "cacher le code"], a: 1, exp: "Menu + service + éventuellement base." },
    { type: "qcm", q: "afficher_menu utilise role_libelle pour…", opts: ["vérifier les droits d'accès", "afficher le nom de l'espace courant", "journaliser l'action", "trier les options du menu"], a: 1, exp: "Un titre lisible." },
    { type: "qcm", q: "Un même binaire sert…", opts: ["un seul rôle", "les trois profils, sans duplication", "trois programmes séparés", "deux rôles seulement"], a: 1, exp: "Le rôle module le comportement." },
    { type: "qcm", q: "Router selon le choix ET le rôle évite…", opts: ["les doublons de code", "qu'une action sensible soit lancée sans droit", "les fuites mémoire", "les injections"], a: 1, exp: "Double garde." },
    { type: "vf", q: "Un menu bien filtré rend le contrôle côté service inutile.", a: false, exp: "Faux : le menu est du confort ; le service reste la barrière." },
    { type: "qcm", q: "peut_gerer_stock conditionne l'affichage de…", opts: ["Catalogue", "Réapprovisionner / Ventes du jour", "Quitter", "Louer"], a: 1, exp: "Options réservées vendeur/admin." },
    { type: "qcm", q: "L'affichage adapté au rôle relève de…", opts: ["la sécurité seule", "l'ergonomie (UX)", "la base", "la couche réseau"], a: 1, exp: "Confort d'utilisation." },
    { type: "qcm", q: "Le principe « ne compter sur aucun contrôle unique » s'appelle…", opts: ["le moindre privilège", "la défense en profondeur", "l'atomicité", "la pagination"], a: 1, exp: "Plusieurs couches de protection." },
    { type: "qcm", q: "Chaque action sensible, en plus du menu…", opts: ["fait confiance au menu", "revérifie le droit côté service", "s'exécute sans contrôle", "recharge le menu principal"], a: 1, exp: "Contrôle systématique." }
  ],
  final: {
    title: "Exercice final — Sécuriser un espace vendeur",
    intro: `<p>Le menu cache « Réapprovisionner » au client, mais le routage l'appelle sans vérifier. Analyse :</p>
<pre class="pseudo">case 5:                          // choix 5 (Réapprovisionner)
    ui_reappro(c, u);   // FAILLE : appelé pour le choix 5 quel que soit le rôle (aucune vérification du droit)
    break;                        // sortir du switch</pre>`,
    questions: [
      { type: "qcm", q: "Où est la faille ?", opts: ["nulle part", "l'action n'est pas re-gardée : un non-vendeur pourrait la déclencher", "le case est mal écrit", "le menu est mal affiché"], a: 1, exp: "Le menu caché ne suffit pas." },
      { type: "qcm", q: "La correction dans le routage :", opts: ["ajouter un log de l'action", "if (peut_gerer_stock(u)) ui_reappro(...); else refuser", "cacher plus fort le menu", "supprimer le case"], a: 1, exp: "Re-garder l'action." },
      { type: "qcm", q: "Où est la barrière définitive ?", opts: ["le menu", "le service (ui_reappro appelle service_reappro qui contrôle)", "le fichier de configuration", "l'affichage"], a: 1, exp: "Le service revérifie toujours." },
      { type: "qcm", q: "Combien de contrôles idéalement ?", opts: ["zéro", "plusieurs (menu + routage + service) : défense en profondeur", "un seul suffit", "exactement deux"], a: 1, exp: "Redondance volontaire." },
      { type: "qcm", q: "Cacher une option protège surtout…", opts: ["contre les attaques", "le confort de l'utilisateur légitime", "les données confidentielles", "contre les intrusions"], a: 1, exp: "UX, pas sécurité." }
    ],
    solution: `<pre class="pseudo">case 5:                                        // choix 5 (Réapprovisionner)
    if (peut_gerer_stock(u))                   // vérifie le droit dans le routage…
        ui_reappro(c, u);                      // …qui appelle service_reappro (lequel re-contrôle encore)
    else                                       // sinon (pas le droit)…
        printf("%s\\n", code_message(ERR_DROIT)); // …afficher le message « accès refusé »
    break;                                     // sortir du switch</pre>
<p>Menu filtré (confort), routage gardé (défense), service contrôlé (barrière) : trois lignes de défense indépendantes. Les trois espaces cohabitent sûrement dans un seul programme. Demain : maîtriser la mémoire du projet.</p>`
  }
};
</script>
