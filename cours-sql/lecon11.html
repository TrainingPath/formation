<script>
var DAY = {
  num: 11,
  title: "Les jointures externes (LEFT / RIGHT JOIN)",
  subtitle: "Garder les lignes même sans correspondance.",
  theory: `
<h3>1. Le problème de l'INNER JOIN</h3>
<p>Rappel : l'INNER JOIN (leçon 10) <strong>exclut</strong> les lignes sans correspondance. Conséquence gênante : une catégorie qui ne contient aucun jeu <strong>disparaît</strong> complètement du résultat. Or on veut parfois voir « TOUTES les catégories, quitte à afficher 0 jeu pour les vides ». Il faut donc une jointure qui n'oublie personne : la <strong>jointure externe</strong>.</p>

<h3>2. LEFT JOIN : garder toute la table de gauche</h3>
<p><code>LEFT JOIN</code> (ou LEFT OUTER JOIN, « jointure externe gauche ») conserve <strong>toutes</strong> les lignes de la table de <strong>gauche</strong> (celle écrite après FROM), même celles qui n'ont aucune correspondance à droite. Pour ces lignes solitaires, les colonnes de droite valent alors <code>NULL</code> (vide).</p>
<pre class="pseudo">SELECT c.libelle, j.titre           -- libellé de la catégorie + titre du jeu (s'il y en a un)
FROM CATEGORIE c                     -- table de GAUCHE : on garde TOUTES ses lignes
LEFT JOIN JEU j ON j.idCategorie = c.idCategorie;  -- LEFT JOIN = même les catégories sans jeu restent

-- pour une catégorie sans aucun jeu, la colonne j.titre vaut NULL</pre>

<h3>3. Compter en tenant compte des vides</h3>
<p>Piège au moment de compter : avec un LEFT JOIN, il faut compter <strong>les correspondances</strong> et non les lignes brutes. Sinon, une catégorie vide compterait quand même 1 (sa propre ligne remplie de NULL). Astuce : on compte une colonne de la table de DROITE, que COUNT ignore quand elle est NULL.</p>
<pre class="pseudo">SELECT c.libelle, COUNT(j.idJeu) AS nb_jeux   -- COUNT(j.idJeu) = nombre de jeux réellement reliés
FROM CATEGORIE c
LEFT JOIN JEU j ON j.idCategorie = c.idCategorie
GROUP BY c.libelle;                           -- un compte par catégorie

-- COUNT(j.idJeu) vaut 0 pour une catégorie sans jeu (COUNT ignore les NULL)</pre>
<div class="tip">Astuce clé : <code>COUNT(*)</code> compterait la ligne NULL comme 1 (faux !). Pour obtenir 0 sur les groupes vides, compte une colonne de la table de droite : <code>COUNT(j.idJeu)</code>.</div>

<h3>4. RIGHT JOIN et FULL JOIN</h3>
<p>Deux variantes existent, symétriques ou combinées :</p>
<pre class="pseudo">RIGHT JOIN  -- garde toutes les lignes de la table de DROITE (le miroir du LEFT JOIN)
FULL JOIN   -- garde les lignes des DEUX tables (gauche ET droite ; non supporté par MySQL)</pre>
<p>En pratique, on privilégie le <code>LEFT JOIN</code> : il suffit de placer la table « à conserver » à gauche. Tout RIGHT JOIN peut d'ailleurs se réécrire en LEFT JOIN en inversant simplement l'ordre des deux tables.</p>

<h3>5. Trouver les lignes « orphelines »</h3>
<p>Usage très classique du LEFT JOIN : repérer les lignes SANS correspondance (les « orphelines »). Après la jointure, ces lignes ont des NULL du côté droit ; il suffit de les isoler avec <code>WHERE ... IS NULL</code>.</p>
<pre class="pseudo">-- les catégories qui n'ont AUCUN jeu :
SELECT c.libelle
FROM CATEGORIE c
LEFT JOIN JEU j ON j.idCategorie = c.idCategorie
WHERE j.idJeu IS NULL;   -- IS NULL = aucune correspondance trouvée à droite (catégorie orpheline)</pre>
<div class="warn">L'ordre des tables COMPTE pour un LEFT JOIN : « CATEGORIE LEFT JOIN JEU » garde toutes les catégories ; « JEU LEFT JOIN CATEGORIE » garde tous les jeux. Ce n'est PAS symétrique, contrairement à l'INNER JOIN.</div>`,
  exercises: [
    { type: "qcm", q: "Un INNER JOIN exclut…", opts: ["Rien", "Les lignes sans correspondance", "Toutes les lignes", "Les doublons"], a: 1, exp: "Seules les correspondances restent." },
    { type: "qcm", q: "LEFT JOIN conserve…", opts: ["Toutes les lignes de droite", "Toutes les lignes de gauche, même sans correspondance", "Aucune ligne", "Les doublons"], a: 1, exp: "La table de gauche entière." },
    { type: "qcm", q: "Une ligne de gauche sans correspondance a, pour les colonnes de droite…", opts: ["0", "NULL", "Une erreur", "La valeur précédente"], a: 1, exp: "Colonnes de droite = NULL." },
    { type: "qcm", q: "Pour lister toutes les catégories, même vides :", opts: ["INNER JOIN", "CATEGORIE LEFT JOIN JEU", "JEU LEFT JOIN CATEGORIE", "RIGHT JOIN JEU"], a: 1, exp: "Catégorie à gauche, conservée." },
    { type: "qcm", q: "Pour compter 0 sur une catégorie vide, on utilise…", opts: ["COUNT(*)", "COUNT(j.idJeu) (colonne de droite)", "SUM(*)", "COUNT(1)"], a: 1, exp: "COUNT ignore les NULL de droite." },
    { type: "qcm", q: "COUNT(*) sur un LEFT JOIN compterait une catégorie vide comme…", opts: ["0", "1 (sa ligne avec des NULL)", "NULL", "Une erreur"], a: 1, exp: "D'où COUNT(colonne de droite)." },
    { type: "qcm", q: "RIGHT JOIN conserve…", opts: ["La table de gauche", "Toutes les lignes de la table de droite", "Les deux", "Aucune"], a: 1, exp: "Symétrique du LEFT." },
    { type: "qcm", q: "FULL JOIN garde…", opts: ["Une seule table", "Les lignes des deux tables (correspondance ou non)", "Rien", "Les doublons"], a: 1, exp: "Union des deux côtés (pas en MySQL)." },
    { type: "qcm", q: "En pratique, on privilégie…", opts: ["Le RIGHT JOIN", "Le LEFT JOIN (table à conserver à gauche)", "Le FULL JOIN", "Le produit cartésien"], a: 1, exp: "Convention plus lisible." },
    { type: "qcm", q: "Trouver les catégories sans aucun jeu :", opts: ["INNER JOIN", "LEFT JOIN ... WHERE j.idJeu IS NULL", "RIGHT JOIN", "GROUP BY"], a: 1, exp: "Orphelines = correspondance NULL." },
    { type: "vf", q: "LEFT JOIN n'est pas symétrique : l'ordre des tables change le résultat.", a: true, exp: "La table de gauche est conservée." },
    { type: "qcm", q: "« CATEGORIE LEFT JOIN JEU » garde…", opts: ["Tous les jeux", "Toutes les catégories", "Rien", "Les doublons"], a: 1, exp: "La table de gauche = CATEGORIE." },
    { type: "qcm", q: "Un INNER JOIN est-il symétrique (ordre des tables sans effet sur les lignes) ?", opts: ["Non", "Oui, contrairement au LEFT JOIN", "Jamais", "Seulement avec GROUP BY"], a: 1, exp: "L'INNER JOIN est symétrique." },
    { type: "vf", q: "Tout RIGHT JOIN peut se réécrire en LEFT JOIN en inversant les tables.", a: true, exp: "Équivalence par inversion." },
    { type: "qcm", q: "WHERE j.idJeu IS NULL après un LEFT JOIN garde…", opts: ["Les catégories avec des jeux", "Les catégories SANS jeu (orphelines)", "Tous les jeux", "Rien"], a: 1, exp: "Les lignes de gauche sans correspondance." }
  ],
  final: {
    title: "Exercice final — Catégories et fournisseurs vides",
    intro: `<p>Tables CATEGORIE(idCategorie, libelle) et JEU(idJeu, titre, idCategorie). On veut un panorama complet, y compris les catégories inutilisées.</p>`,
    questions: [
      { type: "qcm", q: "Pour voir TOUTES les catégories avec leur nombre de jeux (0 compris) :", opts: ["INNER JOIN", "CATEGORIE LEFT JOIN JEU + GROUP BY", "JEU INNER JOIN CATEGORIE", "RIGHT JOIN CATEGORIE"], a: 1, exp: "Catégorie conservée à gauche." },
      { type: "qcm", q: "Pour compter 0 sur une catégorie vide, on écrit…", opts: ["COUNT(*)", "COUNT(j.idJeu)", "SUM(idJeu)", "COUNT(c.libelle)"], a: 1, exp: "Colonne de la table de droite." },
      { type: "qcm", q: "Repérer les catégories sans aucun jeu :", opts: ["WHERE j.idJeu IS NULL après LEFT JOIN", "INNER JOIN", "HAVING COUNT(*) = 0 sans LEFT JOIN", "ORDER BY"], a: 0, exp: "Orphelines via IS NULL." },
      { type: "qcm", q: "« JEU LEFT JOIN CATEGORIE » conserverait…", opts: ["Toutes les catégories", "Tous les jeux", "Aucune ligne", "Les doublons"], a: 1, exp: "La table de gauche = JEU." },
      { type: "vf", q: "Le LEFT JOIN sert aussi à trouver les lignes orphelines (sans correspondance).", a: true, exp: "Avec WHERE ... IS NULL." }
    ],
    solution: `<pre class="pseudo">-- toutes les catégories, avec leur nombre de jeux (0 possible)
SELECT c.libelle, COUNT(j.idJeu) AS nb_jeux   -- COUNT(colonne de droite) = 0 si aucun jeu
FROM CATEGORIE c                              -- table de gauche conservée en entier
LEFT JOIN JEU j ON j.idCategorie = c.idCategorie   -- lien FK/PK, catégories vides gardées
GROUP BY c.libelle;                           -- un compte par catégorie

-- les catégories vides (orphelines)
SELECT c.libelle
FROM CATEGORIE c
LEFT JOIN JEU j ON j.idCategorie = c.idCategorie
WHERE j.idJeu IS NULL;                        -- aucune correspondance à droite = catégorie sans jeu</pre>
<p>Tu gères les jointures externes. Demain : les sous-requêtes.</p>`
  }
};
