<script>
var DAY = {
  num: 21,
  title: "Examen final SQL",
  subtitle: "Tout le langage en une épreuve : du CREATE au JOIN.",
  theory: `
<h3>Récapitulatif avant l'épreuve</h3>
<p>Vingt leçons, un langage complet. Deux minutes de révision pour te remettre en tête chaque famille de commandes, puis 20 questions. Chaque ligne des blocs ci-dessous est commentée pour te rappeler à quoi elle sert.</p>

<h3>1. Définir (DDL) — la structure</h3>
<p>Le <strong>DDL</strong> (Data Definition Language) fabrique et modifie les tables (le contenant, pas le contenu) :</p>
<pre class="pseudo">CREATE TABLE ... (colonnes, types, PRIMARY KEY, FOREIGN KEY, CHECK)  -- CRÉER une table et ses règles
ALTER TABLE ... ADD / DROP / MODIFY                                  -- MODIFIER une table existante (colonne/contrainte)
DROP TABLE ...                                                       -- SUPPRIMER une table entière (et ses données !)</pre>

<h3>2. Manipuler (DML) — les données</h3>
<p>Le <strong>DML</strong> (Data Manipulation Language) agit sur les lignes (le contenu) :</p>
<pre class="pseudo">INSERT INTO ... VALUES ...     -- AJOUTER des lignes
UPDATE ... SET ... WHERE ...   -- MODIFIER des lignes ciblées par WHERE
DELETE FROM ... WHERE ...      -- SUPPRIMER des lignes ciblées (JAMAIS sans WHERE, sinon toute la table part !)</pre>

<h3>3. Interroger (DQL) — l'ordre logique</h3>
<p>Le <strong>DQL</strong> (Data Query Language), c'est SELECT. Voici l'ordre dans lequel le SGBD exécute réellement une requête :</p>
<pre class="pseudo">FROM      -- 1) table(s) source + JOIN (relier les tables)
WHERE     -- 2) filtrer les LIGNES
GROUP BY  -- 3) former les groupes
HAVING    -- 4) filtrer les GROUPES (sur un agrégat)
SELECT    -- 5) choisir colonnes + agrégats (COUNT, SUM, AVG, MIN, MAX)
ORDER BY  -- 6) trier le résultat
LIMIT     -- 7) borner le nombre de lignes renvoyées</pre>

<h3>4. Relier et combiner</h3>
<pre class="pseudo">INNER JOIN  -- garde seulement les correspondances des DEUX tables
LEFT JOIN   -- garde TOUTE la table de gauche (NULL à droite si pas de correspondance)
sous-requête (SELECT ...)  -- une requête dans une autre : dans WHERE / FROM / SELECT
UNION / INTERSECT / EXCEPT -- opérations ENSEMBLISTES (empiler / intersection / différence)</pre>

<h3>5. Structurer et fiabiliser</h3>
<pre class="pseudo">Contraintes : PRIMARY KEY, FOREIGN KEY, UNIQUE, NOT NULL, CHECK, DEFAULT  -- les règles de qualité des données
Vues : CREATE VIEW           -- une requête enregistrée sous un nom (table virtuelle)
Index : CREATE INDEX         -- accélère les recherches (comme l'index d'un livre)
Transactions : START / COMMIT / ROLLBACK  -- tout ou rien (les garanties ACID)</pre>
<div class="tip">Conseil d'examen : repère le VERBE de la question (« combien » → COUNT, « total » → SUM, « par » → GROUP BY, « avec le libellé de » → JOIN, « au moins » → HAVING). Bonne chance !</div>`,
  exercises: [
    { type: "qcm", q: "Créer une table :", opts: ["MAKE TABLE", "CREATE TABLE", "NEW TABLE", "ADD TABLE"], a: 1, exp: "DDL : CREATE TABLE." },
    { type: "qcm", q: "Ajouter des lignes :", opts: ["ADD ROW", "INSERT INTO ... VALUES", "PUT", "APPEND"], a: 1, exp: "INSERT (DML)." },
    { type: "qcm", q: "Le WHERE oublié dans un DELETE…", opts: ["N'a pas d'effet", "Supprime TOUTE la table", "Trie", "Crée un index"], a: 1, exp: "Danger : toutes les lignes." },
    { type: "qcm", q: "Filtrer les lignes :", opts: ["HAVING", "WHERE", "GROUP BY", "ORDER BY"], a: 1, exp: "WHERE sur les lignes." },
    { type: "qcm", q: "Filtrer les groupes (après agrégation) :", opts: ["WHERE", "HAVING", "SELECT", "LIMIT"], a: 1, exp: "HAVING après GROUP BY." },
    { type: "qcm", q: "Compter les lignes :", opts: ["SUM(*)", "COUNT(*)", "AVG(*)", "TOTAL(*)"], a: 1, exp: "COUNT." },
    { type: "qcm", q: "Somme d'une colonne :", opts: ["COUNT(col)", "SUM(col)", "MAX(col)", "AVG(col)"], a: 1, exp: "SUM." },
    { type: "qcm", q: "Afficher le libellé de la catégorie d'un jeu :", opts: ["Un DISTINCT", "Une jointure JEU–CATEGORIE", "Un index", "Un CHECK"], a: 1, exp: "JOIN." },
    { type: "qcm", q: "Garder toutes les catégories, même vides :", opts: ["INNER JOIN", "LEFT JOIN (CATEGORIE à gauche)", "UNION", "GROUP BY"], a: 1, exp: "Jointure externe." },
    { type: "qcm", q: "Comparer chaque jeu à la moyenne :", opts: ["WHERE prix > AVG(prix)", "WHERE prix > (SELECT AVG(prix) FROM JEU)", "HAVING AVG", "GROUP BY prix"], a: 1, exp: "Sous-requête scalaire." },
    { type: "qcm", q: "Empiler deux résultats sans doublon :", opts: ["JOIN", "UNION", "GROUP BY", "INTERSECT ALL"], a: 1, exp: "UNION." },
    { type: "qcm", q: "Garantir qu'un email est unique :", opts: ["PRIMARY KEY", "UNIQUE", "CHECK", "DEFAULT"], a: 1, exp: "Contrainte d'unicité." },
    { type: "qcm", q: "Interdire un prix négatif :", opts: ["UNIQUE", "CHECK (prix >= 0)", "NOT NULL", "PRIMARY KEY"], a: 1, exp: "CHECK." },
    { type: "qcm", q: "Une requête enregistrée sous un nom :", opts: ["Un index", "Une vue (CREATE VIEW)", "Une contrainte", "Une transaction"], a: 1, exp: "Vue." },
    { type: "qcm", q: "Accélérer une recherche par titre :", opts: ["Une vue", "Un index sur titre", "Un CHECK", "Un GROUP BY"], a: 1, exp: "Index." },
    { type: "qcm", q: "Valider une transaction :", opts: ["ROLLBACK", "COMMIT", "SAVE", "END"], a: 1, exp: "COMMIT." },
    { type: "qcm", q: "Annuler une transaction :", opts: ["COMMIT", "ROLLBACK", "UNDO", "CANCEL"], a: 1, exp: "ROLLBACK." },
    { type: "qcm", q: "Le A de ACID :", opts: ["Alias", "Atomicité", "Agrégat", "Accès"], a: 1, exp: "Tout ou rien." },
    { type: "qcm", q: "Les 3 jeux les plus loués :", opts: ["COUNT sans GROUP BY", "GROUP BY + COUNT + ORDER BY DESC + LIMIT 3", "DISTINCT", "UNION"], a: 1, exp: "Top N par comptage." },
    { type: "qcm", q: "L'ordre logique correct :", opts: ["SELECT, FROM, WHERE", "FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY", "WHERE, FROM, SELECT", "ORDER BY, FROM, SELECT"], a: 1, exp: "L'ordre d'évaluation réel." }
  ],
  final: {
    title: "Épreuve pratique — Requête complète",
    intro: `<p>Énoncé : « Pour chaque fournisseur, donne le nombre de jeux qu'il fournit et le prix de location moyen de ces jeux, uniquement pour les fournisseurs ayant au moins 2 jeux, triés par prix moyen décroissant. »</p>
<pre class="pseudo">JEU(idJeu, titre, prixLocation, idCategorie, idFournisseur)   -- table des jeux (idFournisseur = clé étrangère)
FOURNISSEUR(idFournisseur, nom)                              -- table des fournisseurs</pre>`,
    questions: [
      { type: "qcm", q: "Quelles tables joindre ?", opts: ["Seulement JEU", "JEU et FOURNISSEUR", "Seulement FOURNISSEUR", "CLIENT et JEU"], a: 1, exp: "Le nom vient de FOURNISSEUR, les jeux de JEU." },
      { type: "qcm", q: "On regroupe par…", opts: ["idJeu", "le fournisseur (f.nom)", "la catégorie", "la date"], a: 1, exp: "Statistiques par fournisseur." },
      { type: "qcm", q: "« Au moins 2 jeux » se traduit par…", opts: ["WHERE COUNT(*) >= 2", "HAVING COUNT(*) >= 2", "LIMIT 2", "ORDER BY 2"], a: 1, exp: "HAVING sur l'agrégat." },
      { type: "qcm", q: "Le prix moyen :", opts: ["SUM(prixLocation)", "AVG(prixLocation)", "COUNT(prixLocation)", "MAX(prixLocation)"], a: 1, exp: "AVG par groupe." },
      { type: "qcm", q: "Trier par prix moyen décroissant :", opts: ["ORDER BY prix_moyen", "ORDER BY prix_moyen DESC", "GROUP BY prix_moyen", "HAVING prix_moyen"], a: 1, exp: "ORDER BY ... DESC." }
    ],
    solution: `<pre class="pseudo">SELECT f.nom,
       COUNT(*)              AS nb_jeux,      -- nombre de jeux fournis par ce fournisseur
       AVG(j.prixLocation)   AS prix_moyen   -- prix de location moyen de ses jeux
FROM JEU j
JOIN FOURNISSEUR f ON f.idFournisseur = j.idFournisseur   -- relie chaque jeu à son fournisseur
GROUP BY f.nom                              -- un regroupement par fournisseur
HAVING COUNT(*) &gt;= 2                        -- ne garde que ceux ayant au moins 2 jeux
ORDER BY prix_moyen DESC;                    -- du prix moyen le plus élevé au plus bas

-- Jointure + agrégats + GROUP BY + HAVING + ORDER BY : tout le cours réuni.</pre>
<p>🗃️ Cours SQL terminé : tu sais créer, remplir et interroger une base relationnelle. Prochaines étapes : SQL Server (T-SQL) et MySQL, qui approfondissent chacun leur SGBD.</p>`
  }
};
</script>

    statement: "À partir de LOUER(idClient, idJeu, dateDebut, montant), JEU(idJeu, titre, idCategorie), CATEGORIE(idCategorie, libelle), écris une requête produisant, PAR catégorie : le nombre de locations, le chiffre d'affaires (somme des montants) et le montant moyen d'une location. Ne garde que les catégories dont le chiffre d'affaires dépasse 50, et trie par chiffre d'affaires décroissant.",
    hints: [
      "Joins LOUER → JEU → CATEGORIE.",
      "COUNT(*), SUM(l.montant), AVG(l.montant), GROUP BY c.libelle.",
      "HAVING SUM(l.montant) > 50, puis ORDER BY le CA DESC."
    ],
    solution: "SELECT c.libelle,\n       COUNT(*)        AS nb_locations,\n       SUM(l.montant)  AS chiffre_affaires,\n       AVG(l.montant)  AS montant_moyen\nFROM LOUER l\nJOIN JEU j       ON j.idJeu = l.idJeu\nJOIN CATEGORIE c ON c.idCategorie = j.idCategorie\nGROUP BY c.libelle\nHAVING SUM(l.montant) > 50\nORDER BY chiffre_affaires DESC;",
    note: "Cette requête réunit tout le cours : deux jointures (pour remonter du montant jusqu'au libellé de catégorie), trois agrégats (COUNT, SUM, AVG), un GROUP BY, un HAVING sur un agrégat et un ORDER BY. C'est exactement le type de rapport qu'on attend d'un développeur SQL." }
  ]
};
