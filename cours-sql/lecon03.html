<script>
var DAY = {
  num: 3,
  title: "Insérer des données : INSERT",
  subtitle: "Remplir les tables avec de vraies lignes.",
  theory: `
<h3>1. La commande INSERT</h3>
<p>Une table fraîchement créée est <strong>vide</strong> : elle a des colonnes mais aucune ligne, comme un tableau où seuls les titres de colonnes sont écrits. La commande <code>INSERT INTO</code> (« insérer dans ») sert à y <strong>ajouter des lignes</strong>. Le principe : on annonce la table et les colonnes qu'on va remplir, puis on donne les <strong>valeurs</strong> avec le mot-clé <code>VALUES</code>.</p>
<pre class="pseudo">INSERT INTO CATEGORIE (idCategorie, libelle)   -- INSERT INTO = « ajoute dans » la table CATEGORIE, colonnes visées entre ( )
VALUES (1, 'Stratégie');                       -- VALUES = les valeurs à ranger : idCategorie=1, libelle='Stratégie' ; le ; exécute</pre>
<p>Attention à la façon d'écrire les valeurs : les <strong>chaînes de caractères</strong> (du texte) se mettent entre <strong>apostrophes</strong> simples <code>'...'</code>, tandis que les <strong>nombres</strong> s'écrivent seuls, sans guillemets. C'est ainsi que le SGBD distingue le texte des nombres.</p>

<h3>2. Insérer plusieurs lignes d'un coup</h3>
<p>Plutôt que de répéter INSERT dix fois, on peut ajouter plusieurs lignes en une seule commande : il suffit d'enchaîner plusieurs groupes de parenthèses, séparés par des virgules, après VALUES.</p>
<pre class="pseudo">INSERT INTO CATEGORIE (idCategorie, libelle) VALUES   -- une seule commande INSERT pour plusieurs lignes
  (1, 'Stratégie'),   -- 1re ligne à ajouter (la virgule finale annonce qu'il y en a d'autres)
  (2, 'Famille'),     -- 2e ligne à ajouter
  (3, 'Ambiance');    -- 3e et dernière ligne ; le ; termine toute la commande</pre>

<h3>3. Nommer les colonnes (recommandé)</h3>
<p>On PEUT omettre la liste des colonnes, à condition de fournir TOUTES les valeurs, dans l'ordre exact où les colonnes ont été définies. Mais c'est risqué : si un jour on ajoute une colonne à la table, la requête casse. <strong>Nommer les colonnes</strong> rend la requête solide et lisible.</p>
<pre class="pseudo">-- risqué : dépend de l'ordre exact des colonnes de la table
INSERT INTO CATEGORIE VALUES (1, 'Stratégie');                    -- pas de noms : SQL devine l'ordre (fragile)

-- sûr : colonnes nommées explicitement
INSERT INTO CATEGORIE (idCategorie, libelle) VALUES (1, 'Stratégie');  -- on dit clairement où va chaque valeur</pre>

<h3>4. Colonnes omises : DEFAULT et NULL</h3>
<p>Que se passe-t-il pour une colonne qu'on ne mentionne pas dans l'INSERT ? Elle prend sa valeur par <strong>DEFAULT</strong> si une valeur par défaut a été définie, sinon <strong>NULL</strong> (« vide/inconnu ») si c'est autorisé. Une clé auto-incrémentée, elle, se remplit toute seule : on ne la fournit jamais.</p>
<pre class="pseudo">-- Supposons que stockVente et stockLocation aient DEFAULT 0 :
INSERT INTO JEU (idJeu, titre, prixAchat, prixLocation, idCategorie)  -- on ne cite PAS les deux colonnes de stock
VALUES (1, 'Catan', 44.90, 5.00, 1);                                 -- on donne les 5 valeurs des colonnes citées
-- Résultat : stockVente et stockLocation valent 0 (leur DEFAULT), sans qu'on ait rien écrit</pre>

<h3>5. Attention aux contraintes</h3>
<p>Souviens-toi des contraintes (leçon 2) : ce sont des règles que le SGBD fait respecter. Un INSERT qui les <strong>viole</strong> est <strong>refusé</strong> avec une erreur : clé primaire déjà utilisée, colonne NOT NULL laissée vide, clé étrangère pointant vers un identifiant qui n'existe pas, condition CHECK non respectée.</p>
<div class="warn">Insère d'abord la table « parente » (CATEGORIE), puis la « fille » (JEU) : une clé étrangère doit pointer vers une ligne qui EXISTE DÉJÀ. Sinon, erreur d'intégrité référentielle. On remplit toujours dans le sens parent → enfant.</div>`,
  exercises: [
    { type: "qcm", q: "INSERT INTO sert à…", opts: ["Lire des lignes", "Ajouter une ou plusieurs lignes", "Supprimer une table", "Trier"], a: 1, exp: "Ajout de données (DML)." },
    { type: "qcm", q: "Une chaîne de caractères s'écrit…", opts: ["Entre guillemets doubles", "Entre apostrophes simples '...'", "Sans rien", "Entre crochets"], a: 1, exp: "'Stratégie'." },
    { type: "qcm", q: "Un nombre dans un INSERT s'écrit…", opts: ["Entre apostrophes", "Sans guillemets : 44.90", "Entre crochets", "En toutes lettres"], a: 1, exp: "Les nombres ne sont pas entourés." },
    { type: "qcm", q: "Pour insérer 3 lignes en une commande…", opts: ["3 INSERT obligatoires", "Plusieurs groupes VALUES séparés par des virgules", "Impossible", "Un seul VALUES sans virgule"], a: 1, exp: "VALUES (…),(…),(…)." },
    { type: "qcm", q: "Nommer les colonnes dans l'INSERT est…", opts: ["Interdit", "Recommandé (plus sûr, survit aux changements)", "Inutile", "Réservé aux experts"], a: 1, exp: "Robustesse de la requête." },
    { type: "qcm", q: "Une colonne non citée prend…", opts: ["Une erreur", "Sa valeur DEFAULT, sinon NULL", "0 toujours", "La valeur précédente"], a: 1, exp: "DEFAULT ou NULL selon la définition." },
    { type: "qcm", q: "Une clé auto-incrémentée dans l'INSERT…", opts: ["Doit être fournie", "Se remplit toute seule : on l'omet", "Doit valoir 0", "Est un texte"], a: 1, exp: "Le SGBD la numérote." },
    { type: "qcm", q: "Insérer deux fois la même clé primaire…", opts: ["Est autorisé", "Provoque une erreur (doublon de PK)", "Écrase l'ancienne", "Crée une vue"], a: 1, exp: "La PK doit rester unique." },
    { type: "qcm", q: "Insérer un JEU avec idCategorie inexistant…", opts: ["Fonctionne", "Échoue : violation de clé étrangère", "Crée la catégorie", "Met NULL"], a: 1, exp: "La FK doit cibler une ligne existante." },
    { type: "qcm", q: "Dans quel ordre insérer CATEGORIE et JEU ?", opts: ["JEU puis CATEGORIE", "CATEGORIE (parente) puis JEU (fille)", "Peu importe", "Les deux en même temps"], a: 1, exp: "La cible de la FK doit exister d'abord." },
    { type: "vf", q: "Un INSERT qui viole une contrainte NOT NULL est refusé.", a: true, exp: "La valeur obligatoire manque." },
    { type: "qcm", q: "INSERT INTO CATEGORIE VALUES (1, 'Famille'); (sans colonnes) suppose…", opts: ["Rien", "Que l'on fournit toutes les colonnes dans l'ordre exact", "Une seule colonne", "Un tri"], a: 1, exp: "Ordre des colonnes de la table." },
    { type: "qcm", q: "Le DEFAULT 0 sur stockVente signifie qu'un INSERT sans stockVente…", opts: ["Échoue", "Met 0 automatiquement", "Met NULL", "Met -1"], a: 1, exp: "Valeur par défaut appliquée." },
    { type: "vf", q: "On peut insérer une ligne en ne fournissant que les colonnes obligatoires (les autres prenant DEFAULT/NULL).", a: true, exp: "Colonnes facultatives omises." },
    { type: "qcm", q: "INSERT appartient à la famille…", opts: ["DDL", "DML", "DQL", "TCL"], a: 1, exp: "Manipulation de données." }
  ],
  final: {
    title: "Exercice final — Peupler le catalogue",
    intro: `<p>Les tables CATEGORIE et JEU existent. On veut ajouter la catégorie 3 « Ambiance », puis un jeu « Dixit » (idJeu 4, prixAchat 29.90, prixLocation 3.50) dans cette catégorie.</p>`,
    questions: [
      { type: "qcm", q: "Quelle insertion faire EN PREMIER ?", opts: ["Le jeu Dixit", "La catégorie 3 (parente)", "Peu importe", "Aucune"], a: 1, exp: "La FK idCategorie=3 doit exister d'abord." },
      { type: "qcm", q: "Comment insérer la catégorie ?", opts: ["INSERT INTO CATEGORIE (idCategorie, libelle) VALUES (3, 'Ambiance');", "ADD CATEGORIE 3", "NEW ROW", "SELECT CATEGORIE"], a: 0, exp: "INSERT avec colonnes nommées." },
      { type: "qcm", q: "« Ambiance » doit être écrit…", opts: ["Ambiance sans rien", "'Ambiance' entre apostrophes", "\"Ambiance\"", "[Ambiance]"], a: 1, exp: "Chaîne entre apostrophes." },
      { type: "qcm", q: "Si on omet stockVente/stockLocation pour Dixit…", opts: ["Erreur", "Ils prennent 0 (DEFAULT)", "Ils valent NULL", "Le jeu n'est pas créé"], a: 1, exp: "DEFAULT 0 s'applique." },
      { type: "vf", q: "Insérer Dixit avant la catégorie 3 provoquerait une erreur de clé étrangère.", a: true, exp: "La catégorie doit exister avant." }
    ],
    solution: `<pre class="pseudo">-- 1) la catégorie parente (elle doit exister avant le jeu qui la référence)
INSERT INTO CATEGORIE (idCategorie, libelle) VALUES (3, 'Ambiance');   -- ajoute la catégorie n°3

-- 2) le jeu (les stocks prennent 0 par défaut car on ne les cite pas)
INSERT INTO JEU (idJeu, titre, prixAchat, prixLocation, idCategorie)   -- colonnes remplies pour Dixit
VALUES (4, 'Dixit', 29.90, 3.50, 3);                                   -- id 4, texte entre apostrophes, idCategorie=3</pre>
<p>Le catalogue se remplit. Demain : l'interroger avec SELECT.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris tes INSERT…",
  items: [
  { id: "sql-l3",
    lang: "sql",
    schema: `CREATE TABLE CATEGORIE (idCategorie INT PRIMARY KEY, libelle TEXT);
INSERT INTO CATEGORIE VALUES (1,'Strategie'),(2,'Famille');
CREATE TABLE JEU (idJeu INT PRIMARY KEY, titre TEXT, prixAchat REAL, prixLocation REAL, stockVente INT, stockLocation INT, idCategorie INT);`,
    tests: [
      { label: "Deux jeux ont été insérés", query: "SELECT COUNT(*) FROM JEU", expect: [[2]] },
      { label: "Catan et Azul avec leurs prix de location", query: "SELECT titre, prixLocation FROM JEU ORDER BY idJeu", expect: [['Catan',5.0],['Azul',4.0]] }
    ],
    checklist: [
      "As-tu utilisé un seul INSERT avec deux groupes de VALUES ?",
      "As-tu respecté l'ordre des colonnes nommées ?",
      "Les chaînes sont-elles entre apostrophes et les nombres sans guillemets ?"
    ], title: "Ajouter des jeux au catalogue", level: 2,
    statement: "La table JEU(idJeu, titre, prixAchat, prixLocation, stockVente, stockLocation, idCategorie) existe, ainsi que les catégories 1 et 2. Écris un seul INSERT ajoutant deux jeux : « Catan » (id 1, achat 44.90, location 5.00, stocks 3 et 2, catégorie 1) et « Azul » (id 2, achat 39.90, location 4.00, stocks 5 et 3, catégorie 1).",
    hints: [
      "Un seul INSERT avec deux groupes de VALUES séparés par une virgule.",
      "Nomme les colonnes dans l'INSERT.",
      "Chaînes entre apostrophes, nombres sans guillemets."
    ],
    solution: "INSERT INTO JEU (idJeu, titre, prixAchat, prixLocation, stockVente, stockLocation, idCategorie) VALUES\n  (1, 'Catan', 44.90, 5.00, 3, 2, 1),\n  (2, 'Azul',  39.90, 4.00, 5, 3, 1);",
    note: "Un seul INSERT peut créer plusieurs lignes : plus lisible et plus efficace que deux commandes. Les valeurs suivent l'ordre des colonnes nommées." }
  ]
};
</script>
