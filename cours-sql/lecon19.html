var DAY = {

  title: "Les transactions (COMMIT, ROLLBACK, ACID)",
  subtitle: "Un ensemble d'opérations : tout ou rien.",
  theory: `
<h3>1. Le besoin</h3>
<p>Certaines opérations métier demandent PLUSIEURS commandes qui vont ensemble. Louer un jeu, par exemple, c'est deux choses : insérer une location ET décrémenter le stock. Problème : si l'insertion réussit mais que le décrément échoue (panne, erreur…), la base se retrouve dans un état <strong>incohérent</strong> (une location existe mais le stock n'a pas bougé). La solution est la <strong>transaction</strong> : un regroupement d'opérations traité comme un bloc INDIVISIBLE — soit tout réussit, soit rien n'est appliqué. C'est le principe « tout ou rien ».</p>

<h3>2. START, COMMIT, ROLLBACK</h3>
<p>On délimite une transaction avec trois mots-clés : <code>START TRANSACTION</code> (début), <code>COMMIT</code> (« valider » définitivement) et <code>ROLLBACK</code> (« annuler », revenir en arrière).</p>
<pre class="pseudo">START TRANSACTION;          -- ouvre la transaction (ou BEGIN) : rien n'est encore définitif
  INSERT INTO LOUER ...;    -- 1re opération : enregistre la location
  UPDATE JEU SET stockLocation = stockLocation - 1 WHERE idJeu = 1;  -- 2e opération : baisse le stock
COMMIT;                     -- COMMIT = valide les DEUX opérations d'un coup, définitivement</pre>
<p>Si une étape se passe mal, on annule tout d'un seul geste :</p>
<pre class="pseudo">START TRANSACTION;
  UPDATE JEU SET stockLocation = stockLocation - 1 WHERE idJeu = 1;  -- opération déjà faite (mais pas validée)
  -- oups, un problème est détecté ici
ROLLBACK;                   -- ROLLBACK = annule TOUT : la base revient exactement à l'état d'avant le START</pre>

<h3>3. Les propriétés ACID</h3>
<p>Une bonne transaction respecte quatre garanties, résumées par l'acronyme <strong>ACID</strong> :</p>
<pre class="pseudo">A - Atomicité   : TOUT ou RIEN (soit COMMIT complet, soit ROLLBACK complet)      -- indivisible
C - Cohérence   : la base reste VALIDE de bout en bout (contraintes respectées)  -- jamais d'état invalide
I - Isolation   : les transactions simultanées ne se GÊNENT pas entre elles      -- comme si chacune était seule
D - Durabilité  : une fois COMMIT, les données SURVIVENT (même en cas de panne)   -- écrites pour de bon</pre>

<h3>4. Isolation : plusieurs utilisateurs en même temps</h3>
<p>Imagine deux clients qui tentent de louer le DERNIER exemplaire au même instant. L'<strong>isolation</strong> empêche que les deux réussissent : le SGBD met en file d'attente (des <em>verrous</em>) les accès concurrents pour éviter les incohérences. Il existe plusieurs « niveaux d'isolation », qui dosent le compromis entre performance et rigueur.</p>

<h3>5. Autocommit</h3>
<p>Par défaut, beaucoup de SGBD sont en <strong>autocommit</strong> : chaque commande isolée est validée immédiatement, comme si elle était sa propre petite transaction. Pour grouper VOLONTAIREMENT plusieurs opérations, il faut donc démarrer explicitement une transaction (<code>START TRANSACTION</code>), puis conclure par <code>COMMIT</code> ou <code>ROLLBACK</code>.</p>
<div class="tip">Règle d'or : dès qu'une opération métier touche PLUSIEURS lignes ou tables qui doivent rester cohérentes ensemble (louer, transférer de l'argent, passer une commande), enveloppe-la dans une transaction. Le ROLLBACK est ton filet de sécurité.</div>`,
  exercises: [
    { type: "qcm", q: "Une transaction regroupe…", opts: ["Une seule commande", "Plusieurs opérations en un tout indivisible", "Des index", "Des vues"], a: 1, exp: "Tout ou rien." },
    { type: "qcm", q: "COMMIT…", opts: ["Annule les opérations", "Valide définitivement les opérations", "Crée une table", "Trie"], a: 1, exp: "Validation." },
    { type: "qcm", q: "ROLLBACK…", opts: ["Valide", "Annule tout : retour à l'état d'avant", "Crée un index", "Supprime la table"], a: 1, exp: "Annulation." },
    { type: "qcm", q: "On démarre une transaction avec…", opts: ["OPEN", "START TRANSACTION (ou BEGIN)", "RUN", "GO"], a: 1, exp: "Début explicite." },
    { type: "qcm", q: "Le A de ACID signifie…", opts: ["Accès", "Atomicité (tout ou rien)", "Alias", "Agrégat"], a: 1, exp: "Atomicité." },
    { type: "qcm", q: "Le C de ACID signifie…", opts: ["Colonne", "Cohérence (la base reste valide)", "COMMIT", "CHECK"], a: 1, exp: "Cohérence." },
    { type: "qcm", q: "Le I de ACID signifie…", opts: ["Index", "Isolation (les transactions concurrentes ne se gênent pas)", "INSERT", "Identifiant"], a: 1, exp: "Isolation." },
    { type: "qcm", q: "Le D de ACID signifie…", opts: ["DELETE", "Durabilité (les données survivent après COMMIT)", "DISTINCT", "DDL"], a: 1, exp: "Durabilité." },
    { type: "qcm", q: "Louer = insérer une location + décrémenter le stock. Sans transaction, si le 2e échoue…", opts: ["Rien de grave", "La base devient incohérente", "Le stock se recrée", "L'index se met à jour"], a: 1, exp: "D'où la transaction." },
    { type: "qcm", q: "L'isolation empêche que…", opts: ["Deux clients louent le dernier exemplaire simultanément avec succès", "Les index se mettent à jour", "Les vues changent", "Les prix baissent"], a: 0, exp: "Sérialisation des accès concurrents." },
    { type: "vf", q: "Après un COMMIT, un ROLLBACK ne peut plus annuler les opérations.", a: true, exp: "COMMIT est définitif." },
    { type: "qcm", q: "L'autocommit signifie…", opts: ["Rien n'est validé", "Chaque commande est validée immédiatement", "Tout est annulé", "Les transactions sont interdites"], a: 1, exp: "Validation automatique par défaut." },
    { type: "qcm", q: "Quand envelopper une opération dans une transaction ?", opts: ["Pour un simple SELECT", "Quand plusieurs écritures doivent rester cohérentes ensemble", "Jamais", "Pour créer un index"], a: 1, exp: "Opérations multi-lignes/tables liées." },
    { type: "vf", q: "La durabilité garantit que des données validées survivent à une panne.", a: true, exp: "Le D de ACID." },
    { type: "qcm", q: "Le ROLLBACK est utile quand…", opts: ["Tout va bien", "Une étape de la transaction échoue et on veut tout annuler", "On crée une vue", "On trie"], a: 1, exp: "Filet de sécurité." }
  ],
  final: {
    title: "Exercice final — Une location fiable",
    intro: `<p>Louer le jeu 1 par le client 2 : on insère la location et on décrémente le stock, atomiquement.</p>`,
    questions: [
      { type: "qcm", q: "Pourquoi une transaction ici ?", opts: ["Pour trier", "Pour que l'insertion ET le décrément réussissent ensemble ou pas du tout", "Pour créer un index", "Pour une vue"], a: 1, exp: "Atomicité de l'opération métier." },
      { type: "qcm", q: "On commence par…", opts: ["COMMIT", "START TRANSACTION", "ROLLBACK", "DROP"], a: 1, exp: "Ouvrir la transaction." },

      { type: "qcm", q: "Après COMMIT, les deux changements sont…", opts: ["Provisoires", "Définitifs et durables", "Annulables", "Perdus à la fermeture"], a: 1, exp: "Durabilité." },
      { type: "vf", q: "L'isolation évite qu'un autre client loue le même dernier exemplaire au même instant.", a: true, exp: "Accès concurrents gérés." }
    ],
    solution: `<pre class="pseudo">START TRANSACTION;          -- ouvre le bloc « tout ou rien »

INSERT INTO LOUER (idClient, idJeu, dateDebut, nbJours, montant)
VALUES (2, 1, '2026-07-06', 3, 15.00);   -- 1) enregistre la location

UPDATE JEU
SET stockLocation = stockLocation - 1
WHERE idJeu = 1 AND stockLocation &gt; 0;    -- 2) baisse le stock, seulement s'il en reste

COMMIT;   -- valide les deux ensemble ; (ou ROLLBACK; pour tout annuler en cas de souci)

-- Atomicité : les deux opérations réussissent ensemble, ou aucune.</pre>
<p>Ta base reste fiable. Demain : le projet guidé, des requêtes métier sur la Ludothèque.</p>`
  }
