  title: "Les sous-requêtes",
  subtitle: "Une requête dans une requête.",
  theory: `
<h3>1. Le principe</h3>
<p>Une <strong>sous-requête</strong> (ou requête imbriquée) est une requête <code>SELECT</code> placée entre parenthèses <strong>à l'intérieur</strong> d'une autre requête. C'est comme une question dont on a besoin de la réponse pour poser la question principale (« montre-moi les jeux plus chers que LA MOYENNE » — il faut d'abord calculer la moyenne). Le SGBD évalue d'abord la sous-requête (la partie entre parenthèses), obtient un résultat, puis s'en sert dans la requête principale.</p>

<h3>2. Sous-requête qui renvoie UNE valeur</h3>
<p>Cas le plus simple : la sous-requête renvoie un seul nombre (on parle de sous-requête <em>scalaire</em>). On peut alors le comparer directement avec <code>=</code>, <code>&gt;</code>, <code>&lt;</code>…</p>
<pre class="pseudo">SELECT titre, prixLocation
FROM JEU
WHERE prixLocation &gt; (SELECT AVG(prixLocation) FROM JEU);   -- la ( ) calcule la moyenne, puis on garde les prix au-dessus
-- résultat : les jeux plus chers que la moyenne de tous les jeux</pre>

<h3>3. Sous-requête qui renvoie UNE LISTE : IN</h3>
<p>Quand la sous-requête renvoie PLUSIEURS valeurs (une colonne, plusieurs lignes), on ne peut plus utiliser <code>=</code>. On la combine avec <code>IN</code> (« parmi ») ou <code>NOT IN</code> (« pas parmi »).</p>
<pre class="pseudo">-- les jeux qui ont déjà été loués (leur id figure dans la table LOUER) :
SELECT titre
FROM JEU
WHERE idJeu IN (SELECT idJeu FROM LOUER);       -- IN = l'id du jeu est-il dans la liste des jeux loués ?

-- les jeux JAMAIS loués (l'inverse) :
SELECT titre
FROM JEU
WHERE idJeu NOT IN (SELECT idJeu FROM LOUER);   -- NOT IN = l'id n'est PAS dans la liste des jeux loués</pre>

<h3>4. Tester l'existence : EXISTS</h3>
<p><code>EXISTS</code> (« il existe ») renvoie vrai dès que la sous-requête retourne AU MOINS une ligne. On l'emploie pour « existe-t-il un… lié à celui-ci ? ». La sous-requête est ici <em>corrélée</em> : elle fait référence à la ligne courante de la requête externe.</p>
<pre class="pseudo">SELECT titre
FROM JEU j
WHERE EXISTS (                                   -- EXISTS = vrai s'il existe au moins une ligne ci-dessous
  SELECT 1 FROM LOUER l WHERE l.idJeu = j.idJeu  -- cherche une location de CE jeu (l.idJeu = j.idJeu, le lien corrélé)
);
-- résultat : les jeux ayant au moins une location</pre>

<h3>5. Sous-requête ou jointure ?</h3>
<p>Beaucoup de sous-requêtes peuvent se réécrire en jointure, et inversement. La sous-requête est souvent plus <strong>lisible</strong> pour « comparer à une valeur agrégée » (moyenne, max) ; la jointure est souvent plus <strong>efficace</strong> pour « ramener des colonnes d'une autre table ».</p>
<pre class="pseudo">-- version sous-requête :
WHERE idJeu IN (SELECT idJeu FROM LOUER)          -- filtre par appartenance à la liste
-- version jointure équivalente (avec DISTINCT pour éviter les doublons) :
FROM JEU j JOIN LOUER l ON j.idJeu = l.idJeu       -- relie directement les deux tables</pre>
<div class="tip">Une sous-requête dans le <code>WHERE</code> filtre les lignes ; mais elle peut aussi apparaître dans le <code>FROM</code> (on parle alors de « table dérivée ») ou dans le <code>SELECT</code> (comme valeur calculée). Dans tous les cas, on l'entoure de parenthèses.</div>`,
  exercises: [
    { type: "qcm", q: "Une sous-requête est…", opts: ["Un index", "Une requête SELECT placée dans une autre, entre parenthèses", "Une jointure", "Une vue"], a: 1, exp: "Requête imbriquée." },
    { type: "qcm", q: "Le SGBD évalue la sous-requête…", opts: ["En dernier", "D'abord, puis utilise son résultat", "Jamais", "En parallèle du tri"], a: 1, exp: "Résultat réinjecté dans la requête externe." },
    { type: "qcm", q: "« Jeux plus chers que la moyenne » :", opts: ["WHERE prixLocation > AVG(prixLocation)", "WHERE prixLocation > (SELECT AVG(prixLocation) FROM JEU)", "HAVING AVG", "GROUP BY prix"], a: 1, exp: "Sous-requête renvoyant une valeur." },
    { type: "qcm", q: "Peut-on écrire WHERE prix > AVG(prix) directement ?", opts: ["Oui", "Non : un agrégat ne va pas dans WHERE ; il faut une sous-requête", "Seulement en MySQL", "Avec un index"], a: 1, exp: "D'où la sous-requête." },
    { type: "qcm", q: "Une sous-requête qui renvoie plusieurs valeurs se combine avec…", opts: ["=", "IN (ou NOT IN)", "LIKE", "BETWEEN"], a: 1, exp: "IN teste l'appartenance à la liste." },
    { type: "qcm", q: "« Jeux jamais loués » :", opts: ["idJeu IN (SELECT idJeu FROM LOUER)", "idJeu NOT IN (SELECT idJeu FROM LOUER)", "idJeu = LOUER", "COUNT(LOUER)"], a: 1, exp: "NOT IN sur la liste des jeux loués." },
    { type: "qcm", q: "EXISTS renvoie vrai si…", opts: ["La sous-requête renvoie 0 ligne", "La sous-requête renvoie au moins une ligne", "Le prix est nul", "La table est vide"], a: 1, exp: "Test d'existence." },
    { type: "qcm", q: "SELECT 1 dans un EXISTS sert à…", opts: ["Renvoyer la colonne 1", "Peu importe la valeur : on teste juste l'existence de lignes", "Compter", "Trier"], a: 1, exp: "On ne lit pas la valeur, juste la présence." },
    { type: "qcm", q: "Une sous-requête est toujours…", opts: ["Sans parenthèses", "Entre parenthèses", "En majuscules", "Un alias"], a: 1, exp: "(SELECT ...)." },
    { type: "qcm", q: "Une sous-requête peut apparaître…", opts: ["Seulement dans WHERE", "Dans WHERE, FROM ou SELECT", "Seulement dans FROM", "Nulle part"], a: 1, exp: "Plusieurs emplacements possibles." },
    { type: "vf", q: "Beaucoup de sous-requêtes peuvent se réécrire en jointure, et inversement.", a: true, exp: "Deux approches souvent équivalentes." },
    { type: "qcm", q: "Pour « comparer à une valeur agrégée », on préfère souvent…", opts: ["Une jointure", "Une sous-requête (plus lisible)", "Un index", "Un GROUP BY seul"], a: 1, exp: "Sous-requête claire pour AVG/MAX." },
    { type: "qcm", q: "« Jeux déjà loués » avec IN :", opts: ["WHERE idJeu = LOUER", "WHERE idJeu IN (SELECT idJeu FROM LOUER)", "JOIN sans ON", "HAVING idJeu"], a: 1, exp: "Appartenance à la liste des loués." },
    { type: "vf", q: "Une sous-requête dans le WHERE filtre les lignes de la requête externe.", a: true, exp: "Elle sert de critère." },
    { type: "qcm", q: "NOT IN avec une sous-requête contenant des NULL peut…", opts: ["Toujours marcher", "Donner des résultats surprenants (piège des NULL)", "Créer un index", "Trier"], a: 1, exp: "Attention aux NULL avec NOT IN." }
  ],
  final: {
    title: "Exercice final — Comparer et filtrer",
    intro: `<p>Tables JEU(idJeu, titre, prixLocation, idCategorie), LOUER(idClient, idJeu, dateDebut).</p>`,
    questions: [
      { type: "qcm", q: "Jeux dont le prix dépasse la moyenne :", opts: ["WHERE prixLocation > AVG(prixLocation)", "WHERE prixLocation > (SELECT AVG(prixLocation) FROM JEU)", "HAVING prix > AVG", "GROUP BY prix"], a: 1, exp: "Sous-requête scalaire." },
      { type: "qcm", q: "Jeux qui ont déjà été loués :", opts: ["WHERE idJeu IN (SELECT idJeu FROM LOUER)", "WHERE idJeu = LOUER", "JOIN LOUER sans ON", "COUNT(LOUER)"], a: 0, exp: "IN sur la liste des jeux loués." },
      { type: "qcm", q: "Jeux jamais loués :", opts: ["idJeu IN (...)", "idJeu NOT IN (SELECT idJeu FROM LOUER)", "EXISTS(...)", "idJeu = 0"], a: 1, exp: "NOT IN." },
      { type: "qcm", q: "Avec EXISTS, on teste…", opts: ["Une valeur exacte", "S'il existe au moins une ligne liée", "La moyenne", "Le nombre de colonnes"], a: 1, exp: "Présence de lignes corrélées." },
      { type: "vf", q: "La sous-requête (SELECT AVG(...) FROM JEU) renvoie une seule valeur, utilisable avec >.", a: true, exp: "Sous-requête scalaire." }
    ],
    solution: `<pre class="pseudo">-- plus chers que la moyenne (sous-requête scalaire : une valeur)
SELECT titre, prixLocation
FROM JEU
WHERE prixLocation &gt; (SELECT AVG(prixLocation) FROM JEU);   -- compare chaque prix à la moyenne calculée

-- déjà loués (sous-requête liste : plusieurs valeurs, testée avec IN)
SELECT titre FROM JEU WHERE idJeu IN (SELECT idJeu FROM LOUER);   -- id présent dans les jeux loués

-- jamais loués (l'inverse, avec NOT IN)
SELECT titre FROM JEU WHERE idJeu NOT IN (SELECT idJeu FROM LOUER);  -- id absent de la liste des loués</pre>
<p>Tu imbriques les requêtes. Demain : combiner des résultats avec UNION.</p>`
  }
};
