  theory: `
<h3>1. Le problème : la recherche linéaire</h3>
<p>Sans index, pour trouver <code>WHERE titre = 'Catan'</code>, le SGBD parcourt <strong>toutes</strong> les lignes (un « scan complet »). Sur une grande table, c'est lent.</p>

<h3>2. Un index, c'est quoi ?</h3>
<p>Un <strong>index</strong> est une structure de données (souvent un arbre équilibré) qui trie les valeurs d'une colonne et pointe vers les lignes. Comme l'index d'un livre : au lieu de tout lire, on va directement à la bonne page.</p>
<pre class="pseudo">CREATE INDEX idx_titre ON JEU(titre);
-- désormais WHERE titre = 'Catan' est quasi instantané</pre>

<h3>3. Ce qu'un index accélère</h3>
<pre class="pseudo">- les recherches par égalité (WHERE titre = ...)
- les recherches par intervalle (WHERE prix BETWEEN ...)
- les tris (ORDER BY colonne indexée)
- les jointures (sur les colonnes de jointure)</pre>
<p>Les <strong>clés primaires</strong> sont indexées automatiquement. On ajoute des index sur les colonnes souvent utilisées dans les <code>WHERE</code> et les <code>JOIN</code>.</p>

<h3>4. Le coût d'un index</h3>
<div class="warn">Un index accélère les LECTURES mais ralentit les ÉCRITURES : chaque INSERT/UPDATE/DELETE doit aussi mettre à jour les index. Il occupe aussi de l'espace disque. On indexe donc <strong>utile</strong>, pas partout.</div>
<pre class="pseudo">Règle : indexer les colonnes fréquemment filtrées/jointes,
        pas les colonnes rarement recherchées ni celles à faible diversité
        (ex. un booléen n'a que 2 valeurs : index peu utile).</pre>

<h3>5. Index unique et index composé</h3>
<pre class="pseudo">-- index unique : accélère ET garantit l'unicité (comme UNIQUE)
CREATE UNIQUE INDEX idx_email ON CLIENT(email);

-- index composé : sur plusieurs colonnes (ordre important)
CREATE INDEX idx_cat_prix ON JEU(idCategorie, prixLocation);

-- supprimer un index
DROP INDEX idx_titre;   -- (syntaxe selon SGBD)</pre>
<div class="tip">Un index composé (idCategorie, prixLocation) aide les requêtes qui filtrent d'abord sur idCategorie. L'ordre des colonnes compte : la première colonne est la plus « discriminante » pour l'index.</div>`,

    { type: "qcm", q: "Les clés primaires sont…", opts: ["Jamais indexées", "Indexées automatiquement", "Indexées sur demande seulement", "Des vues"], a: 1, exp: "Index automatique sur la PK." },
    { type: "qcm", q: "Un index ralentit…", opts: ["Les lectures", "Les écritures (INSERT/UPDATE/DELETE)", "Les vues", "Rien"], a: 1, exp: "Chaque écriture met à jour l'index." },
    { type: "qcm", q: "On indexe donc…", opts: ["Toutes les colonnes", "Les colonnes fréquemment filtrées ou jointes", "Aucune", "Les booléens surtout"], a: 1, exp: "Index utile, pas partout." },
    { type: "qcm", q: "Indexer un booléen (2 valeurs) est…", opts: ["Très utile", "Souvent peu utile (faible diversité)", "Obligatoire", "Interdit"], a: 1, exp: "Peu discriminant." },
    { type: "qcm", q: "Un index UNIQUE…", opts: ["Ralentit tout", "Accélère ET garantit l'unicité", "Supprime les doublons existants", "Trie la table"], a: 1, exp: "Accélération + contrainte d'unicité." },
    { type: "qcm", q: "Dans un index composé (idCategorie, prixLocation), l'ordre…", opts: ["N'a aucune importance", "Compte : la 1re colonne est la plus discriminante", "Est aléatoire", "Inverse les valeurs"], a: 1, exp: "L'ordre influence l'efficacité." },
    { type: "vf", q: "Un index occupe de l'espace disque supplémentaire.", a: true, exp: "Structure stockée en plus." },
    { type: "qcm", q: "Supprimer un index :", opts: ["DELETE INDEX", "DROP INDEX idx_titre", "REMOVE INDEX", "TRUNCATE INDEX"], a: 1, exp: "DROP INDEX." },
    { type: "qcm", q: "Un index aide une jointure quand…", opts: ["Jamais", "La colonne de jointure est indexée", "La table est petite", "On trie par titre"], a: 1, exp: "Jointure plus rapide sur colonne indexée." },
    { type: "vf", q: "Trop d'index peut dégrader les performances d'écriture.", a: true, exp: "Chaque index à maintenir coûte." },
    { type: "qcm", q: "L'image mentale d'un index est…", opts: ["Une photocopie", "L'index alphabétique à la fin d'un livre", "Un mot de passe", "Une sauvegarde"], a: 1, exp: "Aller directement à la bonne page." }
  ],
