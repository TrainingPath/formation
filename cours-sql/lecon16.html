<script>
var DAY = {
  num: 16,
  title: "Modifier le schéma : ALTER TABLE",
  subtitle: "Faire évoluer une table déjà créée.",
  theory: `
<h3>1. Pourquoi ALTER TABLE ?</h3>
<p>Une base n'est jamais figée : au fil du temps, les besoins changent et il faut ajouter une colonne, modifier un type, poser une nouvelle contrainte… tout cela SANS recréer la table de zéro et SANS perdre les données déjà présentes. C'est exactement le rôle d'<code>ALTER TABLE</code> (« altérer/modifier la table »), une commande de la famille DDL. Le <strong>schéma</strong>, c'est la structure de la base (ses tables et colonnes) ; ALTER TABLE le fait évoluer.</p>

<h3>2. Ajouter une colonne</h3>
<pre class="pseudo">ALTER TABLE JEU ADD stockLocation INT NOT NULL DEFAULT 0;   -- ADD = ajoute la colonne stockLocation (entier, obligatoire, défaut 0)</pre>
<p>La nouvelle colonne apparaît sur TOUTES les lignes existantes ; leur valeur est le <code>DEFAULT</code> indiqué (ou NULL sinon). Attention : ajouter une colonne <code>NOT NULL</code> SANS DEFAULT sur une table déjà remplie échoue — le SGBD ne saurait quoi mettre dans les lignes existantes (obligatoire mais aucune valeur fournie).</p>

<h3>3. Supprimer ou renommer une colonne</h3>
<pre class="pseudo">ALTER TABLE JEU DROP COLUMN ancienneColonne;              -- DROP COLUMN = supprime définitivement cette colonne (et ses données)
ALTER TABLE JEU RENAME COLUMN prix TO prixLocation;       -- RENAME COLUMN = renomme prix en prixLocation (syntaxe selon SGBD)</pre>

<h3>4. Modifier le type d'une colonne</h3>
<p>La syntaxe pour changer le type varie d'un SGBD à l'autre :</p>
<pre class="pseudo">-- MySQL :
ALTER TABLE JEU MODIFY titre VARCHAR(150);         -- MODIFY = change le type de titre (ici on l'agrandit à 150)
-- PostgreSQL / SQL Server :
ALTER TABLE JEU ALTER COLUMN titre VARCHAR(150);   -- ALTER COLUMN = même effet, autre mot-clé</pre>
<div class="warn">Changer un type peut ÉCHOUER si les données existantes ne « rentrent » plus (ex. passer de VARCHAR(120) à VARCHAR(20) alors qu'un titre fait déjà 60 caractères). Toujours vérifier les données AVANT de réduire une taille.</div>

<h3>5. Ajouter ou supprimer une contrainte</h3>
<p>On peut aussi ajouter (ou retirer) des contraintes après coup. Pour une clé étrangère ajoutée plus tard, il faut d'abord que la colonne support existe :</p>
<pre class="pseudo">-- ajouter une clé étrangère après coup :
ALTER TABLE JEU ADD idFournisseur INT;                    -- 1) créer la colonne qui portera le lien
ALTER TABLE JEU
  ADD CONSTRAINT fk_jeu_fournisseur                        -- 2) poser la contrainte, nommée fk_jeu_fournisseur
  FOREIGN KEY (idFournisseur) REFERENCES FOURNISSEUR(idFournisseur);  -- lien vers la PK de FOURNISSEUR

-- ajouter une règle de validité (CHECK) :
ALTER TABLE JEU ADD CONSTRAINT chk_prix CHECK (prixLocation &gt;= 0);   -- interdit désormais un prix négatif

-- supprimer une contrainte par son nom :
ALTER TABLE JEU DROP CONSTRAINT fk_jeu_fournisseur;       -- DROP CONSTRAINT = retire la contrainte nommée</pre>
<div class="tip">Pour ajouter une clé étrangère, la colonne doit d'abord exister (ADD la colonne), et ses valeurs doivent DÉJÀ pointer vers des lignes valides de la table cible — sinon la contrainte est refusée.</div>`,
  exercises: [
    { type: "qcm", q: "ALTER TABLE sert à…", opts: ["Interroger des données", "Modifier la structure d'une table existante", "Supprimer des lignes", "Trier"], a: 1, exp: "Évolution du schéma (DDL)." },
    { type: "qcm", q: "Ajouter une colonne :", opts: ["ALTER TABLE JEU ADD stockLocation INT;", "ADD COLUMN stockLocation", "NEW COLUMN", "UPDATE JEU ADD"], a: 0, exp: "ALTER TABLE ... ADD ..." },
    { type: "qcm", q: "Une nouvelle colonne prend, pour les lignes existantes…", opts: ["Une erreur", "Sa valeur DEFAULT (ou NULL)", "0 toujours", "La clé primaire"], a: 1, exp: "DEFAULT ou NULL." },
    { type: "qcm", q: "Ajouter une colonne NOT NULL sans DEFAULT sur une table NON vide…", opts: ["Réussit", "Échoue (que mettre dans les lignes existantes ?)", "Met NULL", "Vide la table"], a: 1, exp: "Il faut un DEFAULT." },
    { type: "qcm", q: "Supprimer une colonne :", opts: ["DELETE COLUMN", "ALTER TABLE JEU DROP COLUMN ...", "REMOVE COLUMN", "DROP JEU"], a: 1, exp: "ALTER TABLE ... DROP COLUMN." },
    { type: "qcm", q: "Modifier le type d'une colonne (MySQL) :", opts: ["ALTER TABLE JEU MODIFY titre VARCHAR(150)", "CHANGE TYPE", "SET TYPE", "UPDATE TYPE"], a: 0, exp: "MODIFY (MySQL) / ALTER COLUMN (autres)." },
    { type: "qcm", q: "Réduire un VARCHAR alors que des données sont plus longues…", opts: ["Fonctionne", "Peut échouer (données tronquées)", "Crée un index", "Trie"], a: 1, exp: "Vérifier les données avant." },
    { type: "qcm", q: "Ajouter une clé étrangère après coup nécessite d'abord…", opts: ["Un index", "Que la colonne existe (ADD la colonne)", "Un GROUP BY", "Une vue"], a: 1, exp: "La colonne support doit exister." },
    { type: "qcm", q: "Pour ajouter une FK, les valeurs de la colonne doivent…", opts: ["Être nulles", "Déjà pointer vers des lignes valides de la cible", "Être uniques", "Être triées"], a: 1, exp: "Sinon la contrainte est refusée." },
    { type: "qcm", q: "Supprimer une contrainte nommée :", opts: ["DROP fk_jeu_fournisseur", "ALTER TABLE JEU DROP CONSTRAINT fk_jeu_fournisseur", "DELETE CONSTRAINT", "REMOVE FK"], a: 1, exp: "DROP CONSTRAINT par nom." },
    { type: "vf", q: "ALTER TABLE modifie la structure sans perdre les données existantes.", a: true, exp: "On fait évoluer, on ne recrée pas." },
    { type: "qcm", q: "Nommer une contrainte lors de son ajout permet…", opts: ["Un tri", "De la supprimer facilement ensuite (par son nom)", "Un calcul", "Un index automatique"], a: 1, exp: "DROP CONSTRAINT nom." },
    { type: "qcm", q: "ALTER TABLE fait partie du…", opts: ["DML", "DDL", "DQL", "TCL"], a: 1, exp: "Définition de la structure." },
    { type: "vf", q: "On peut ajouter un CHECK à une table existante avec ALTER TABLE ... ADD CONSTRAINT.", a: true, exp: "Ajout de contrainte a posteriori." },
    { type: "qcm", q: "Ajouter stockLocation INT NOT NULL DEFAULT 0 sur une table remplie…", opts: ["Échoue", "Réussit : les lignes existantes reçoivent 0", "Met NULL", "Vide la table"], a: 1, exp: "Le DEFAULT remplit l'existant." }
  ],
  final: {
    title: "Exercice final — Ajouter le lien fournisseur",
    intro: `<p>La table JEU existe déjà (sans fournisseur). On veut y ajouter le lien vers FOURNISSEUR, qui existe aussi.</p>`,
    questions: [
      { type: "qcm", q: "Première étape :", opts: ["Ajouter la contrainte FK directement", "ALTER TABLE JEU ADD idFournisseur INT;", "DROP JEU", "SELECT idFournisseur"], a: 1, exp: "La colonne doit exister d'abord." },
      { type: "qcm", q: "Deuxième étape :", opts: ["ALTER TABLE JEU ADD FOREIGN KEY (idFournisseur) REFERENCES FOURNISSEUR(idFournisseur)", "UPDATE JEU", "CREATE INDEX", "DELETE"], a: 0, exp: "Ajout de la clé étrangère." },
      { type: "qcm", q: "Si des jeux ont un idFournisseur pointant vers un fournisseur inexistant…", opts: ["La FK s'ajoute quand même", "L'ajout de la FK échoue", "Ils sont supprimés", "Ils passent à NULL"], a: 1, exp: "Les valeurs doivent être valides." },
      { type: "qcm", q: "Ajouter la colonne comme NOT NULL sans DEFAULT sur une table remplie…", opts: ["Réussit", "Échoue (lignes existantes sans valeur)", "Met 0", "Vide la table"], a: 1, exp: "Prévoir un DEFAULT ou remplir ensuite." },
      { type: "vf", q: "Nommer la contrainte (CONSTRAINT fk_jeu_fournisseur) facilite sa suppression future.", a: true, exp: "DROP CONSTRAINT par nom." }
    ],
    solution: `<pre class="pseudo">-- 1) ajouter la colonne support du lien
ALTER TABLE JEU ADD idFournisseur INT;    -- la colonne doit exister avant la contrainte

-- 2) (remplir idFournisseur avec des valeurs valides via UPDATE si besoin)

-- 3) ajouter la clé étrangère (nommée, pour la retrouver plus tard)
ALTER TABLE JEU
  ADD CONSTRAINT fk_jeu_fournisseur
  FOREIGN KEY (idFournisseur) REFERENCES FOURNISSEUR(idFournisseur);  -- lien FK/PK validé</pre>
<p>Ton schéma évolue proprement. Demain : les vues.</p>`
  }
};
</script>
