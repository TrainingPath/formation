<script>
var DAY = {
  num: 7,
  title: "Opérateurs : LIKE, IN, BETWEEN, NULL",
  subtitle: "Rechercher par motif, par liste, par intervalle — et gérer l'absence.",
  theory: `
<h3>1. Rechercher par motif : LIKE</h3>
<p>Le <code>=</code> exige une correspondance EXACTE. Mais souvent on cherche « les titres qui commencent par C » ou « qui contiennent us ». Pour cela il faut un <strong>motif</strong> (une sorte de gabarit avec des trous) et l'opérateur <code>LIKE</code> (« ressemble à »). Deux <strong>jokers</strong> remplissent les trous : <code>%</code> remplace n'importe quelle suite de caractères (même aucune), et <code>_</code> (souligné) remplace exactement UN caractère.</p>
<pre class="pseudo">WHERE titre LIKE 'C%'      -- % après C = « commence par C, peu importe la suite » (Catan, Carcassonne)
WHERE titre LIKE '%us%'    -- % des deux côtés = « contient us n'importe où » (dedans)
WHERE titre LIKE '_ixit'   -- _ = un seul caractère, puis « ixit » = mot de 5 lettres finissant par ixit (Dixit)</pre>

<h3>2. Appartenir à une liste : IN</h3>
<p>Quand une colonne peut valoir plusieurs choses acceptables (« catégorie 1 OU 2 OU 5 »), écrire une longue chaîne de <code>OR</code> est pénible. L'opérateur <code>IN</code> (« parmi ») teste si la valeur figure dans une <strong>liste</strong> entre parenthèses. C'est plus court et plus lisible.</p>
<pre class="pseudo">-- ceci remplace : idCategorie = 1 OR idCategorie = 2
WHERE idCategorie IN (1, 2)             -- IN = « la valeur est-elle dans cette liste ? » (ici 1 ou 2)

WHERE titre IN ('Catan', 'Azul', 'Dixit')  -- marche aussi avec du texte (apostrophes obligatoires)</pre>

<h3>3. Être dans un intervalle : BETWEEN</h3>
<p>Pour tester « entre telle et telle valeur », l'opérateur <code>BETWEEN a AND b</code> (« entre a et b ») vérifie l'appartenance à un <strong>intervalle</strong>, <strong>bornes comprises</strong> (a et b inclus).</p>
<pre class="pseudo">WHERE prixLocation BETWEEN 3 AND 5   -- BETWEEN = de 3 à 5 INCLUS (les valeurs 3 et 5 sont acceptées)
-- c'est exactement pareil que : prixLocation &gt;= 3 AND prixLocation &lt;= 5</pre>

<h3>4. Gérer l'absence : IS NULL</h3>
<p><code>NULL</code> représente une valeur <strong>absente ou inconnue</strong> — attention, ce n'est PAS 0, ni la chaîne vide '' : c'est « on ne sait pas ». Particularité : on ne peut PAS la tester avec <code>=</code> (car « inconnu = quelque chose » vaut toujours « inconnu »). On emploie donc <code>IS NULL</code> et <code>IS NOT NULL</code>.</p>
<pre class="pseudo">WHERE telephone IS NULL       -- IS NULL = « la valeur est absente » (fournisseurs sans téléphone renseigné)
WHERE telephone IS NOT NULL   -- IS NOT NULL = « la valeur existe » (ceux qui ont bien un téléphone)</pre>
<div class="warn">Piège classique : <code>WHERE telephone = NULL</code> ne renvoie JAMAIS de ligne. Toute comparaison avec NULL vaut « inconnu », jamais « vrai ». Utilise TOUJOURS <code>IS NULL</code> / <code>IS NOT NULL</code>.</div>

<h3>5. La négation</h3>
<p>Chaque opérateur possède sa forme négative, en glissant <code>NOT</code> devant : <code>NOT LIKE</code>, <code>NOT IN</code>, <code>NOT BETWEEN</code>. La condition est alors vraie exactement quand la version positive serait fausse.</p>
<pre class="pseudo">WHERE titre NOT LIKE 'C%'              -- NOT LIKE = ne correspond PAS au motif (ne commence pas par C)
WHERE idCategorie NOT IN (3)           -- NOT IN = n'est PAS dans la liste (pas la catégorie 3)
WHERE prixLocation NOT BETWEEN 3 AND 5 -- NOT BETWEEN = HORS de l'intervalle (< 3 ou > 5)</pre>`,
  exercises: [
    { type: "qcm", q: "LIKE sert à…", opts: ["Trier", "Comparer une chaîne à un motif (recherche)", "Compter", "Créer une table"], a: 1, exp: "Recherche par motif." },
    { type: "qcm", q: "Le joker % signifie…", opts: ["Un seul caractère", "N'importe quelle suite de caractères (même vide)", "Un chiffre", "Un espace"], a: 1, exp: "% = suite quelconque." },
    { type: "qcm", q: "Le joker _ signifie…", opts: ["Plusieurs caractères", "Exactement un caractère", "Un chiffre", "Rien"], a: 1, exp: "_ = un caractère." },
    { type: "qcm", q: "titre LIKE 'C%' trouve…", opts: ["Ce qui finit par C", "Ce qui commence par C", "Ce qui contient C", "Exactement 'C'"], a: 1, exp: "Motif « commence par C »." },
    { type: "qcm", q: "titre LIKE '%us%' trouve…", opts: ["Ce qui commence par us", "Ce qui contient « us »", "Ce qui finit par us seulement", "Exactement 'us'"], a: 1, exp: "% des deux côtés = contient." },
    { type: "qcm", q: "IN (1, 2) est équivalent à…", opts: ["= 1 AND = 2", "= 1 OR = 2", "BETWEEN 1 AND 2 toujours", "&lt;&gt; 1"], a: 1, exp: "Appartenance à une liste = OR." },
    { type: "qcm", q: "BETWEEN 3 AND 5 inclut…", opts: ["3 et 5 exclus", "3 et 5 compris", "Seulement 4", "Rien"], a: 1, exp: "Bornes comprises." },
    { type: "qcm", q: "BETWEEN 3 AND 5 équivaut à…", opts: ["&gt; 3 AND &lt; 5", "&gt;= 3 AND &lt;= 5", "= 3 OR = 5", "IN (3,5)"], a: 1, exp: "Inférieur/supérieur ou égal." },
    { type: "qcm", q: "NULL représente…", opts: ["Zéro", "Une valeur absente/inconnue", "La chaîne vide", "Faux"], a: 1, exp: "Absence de valeur." },
    { type: "qcm", q: "Tester l'absence de téléphone :", opts: ["telephone = NULL", "telephone IS NULL", "telephone == NULL", "telephone LIKE NULL"], a: 1, exp: "IS NULL, jamais = NULL." },
    { type: "vf", q: "WHERE telephone = NULL ne renvoie jamais de ligne.", a: true, exp: "Comparaison avec NULL = inconnu." },
    { type: "qcm", q: "« ne commence pas par C » :", opts: ["titre LIKE 'C%'", "titre NOT LIKE 'C%'", "titre &lt;&gt; 'C'", "titre IN ('C')"], a: 1, exp: "NOT LIKE." },
    { type: "qcm", q: "« pas les catégories 1 ni 2 » :", opts: ["idCategorie IN (1,2)", "idCategorie NOT IN (1, 2)", "idCategorie &lt;&gt; 1", "NOT idCategorie"], a: 1, exp: "NOT IN sur la liste." },
    { type: "vf", q: "IN est souvent plus lisible qu'une longue suite de OR.", a: true, exp: "IN (a, b, c) condense les OR." },
    { type: "qcm", q: "titre LIKE '_ixit' correspond à…", opts: ["N'importe quel mot avec ixit", "Un mot de 5 lettres finissant par ixit (Dixit)", "ixit seul", "Rien"], a: 1, exp: "_ = un caractère devant « ixit »." }
  ],
  final: {
    title: "Exercice final — Recherches ciblées",
    intro: `<p>Tables JEU(idJeu, titre, prixLocation, idCategorie) et FOURNISSEUR(idFournisseur, nom, telephone).</p>`,
    questions: [
      { type: "qcm", q: "Jeux dont le titre contient « a » :", opts: ["WHERE titre = 'a'", "WHERE titre LIKE '%a%'", "WHERE titre IN ('a')", "WHERE titre BETWEEN a"], a: 1, exp: "% de part et d'autre = contient." },
      { type: "qcm", q: "Jeux des catégories 1 ou 3 :", opts: ["WHERE idCategorie IN (1, 3)", "WHERE idCategorie = 1 AND 3", "WHERE idCategorie BETWEEN 1 AND 3", "WHERE idCategorie LIKE 13"], a: 0, exp: "Liste avec IN." },
      { type: "qcm", q: "Jeux à louer entre 3 et 4 inclus :", opts: ["WHERE prixLocation IN (3,4)", "WHERE prixLocation BETWEEN 3 AND 4", "WHERE prixLocation LIKE 3", "WHERE prixLocation = 3.5"], a: 1, exp: "Intervalle avec BETWEEN." },
      { type: "qcm", q: "Fournisseurs sans numéro de téléphone :", opts: ["WHERE telephone = NULL", "WHERE telephone IS NULL", "WHERE telephone = ''", "WHERE NOT telephone"], a: 1, exp: "IS NULL pour l'absence." },
      { type: "vf", q: "WHERE idCategorie NOT IN (1,3) garde les catégories autres que 1 et 3.", a: true, exp: "Négation de l'appartenance." }
    ],
    solution: `<pre class="pseudo">SELECT titre FROM JEU WHERE titre LIKE '%a%';        -- contient la lettre a (jokers % de chaque côté)

SELECT titre FROM JEU WHERE idCategorie IN (1, 3);   -- catégorie parmi la liste {1, 3}

SELECT titre, prixLocation
FROM JEU
WHERE prixLocation BETWEEN 3 AND 4;                  -- prix dans l'intervalle 3 à 4 inclus

SELECT nom FROM FOURNISSEUR WHERE telephone IS NULL; -- téléphone absent (IS NULL, jamais = NULL)</pre>
<p>Tu maîtrises les filtres avancés. Demain : compter et calculer avec les fonctions d'agrégation.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta requête de recherche…",
  items: [
  { id: "sql-l7",
    lang: "sql",
    schema: `CREATE TABLE JEU (idJeu INT, titre TEXT, prixAchat REAL, prixLocation REAL, idCategorie INT);
INSERT INTO JEU VALUES (1,'Azul',39.9,4.0,1),(2,'Dixit',29.9,5.0,2),(3,'Abyss',34.9,7.0,1),(4,'Catan',44.9,5.0,1),(5,'Dobble',19.9,3.0,3),(6,'Azul Duel',20.0,6.0,2);`,
    tests: [
      { label: "Titres en A/D, catégories 1-2, prix entre 3 et 6", expect: [['Azul',4.0,1],['Dixit',5.0,2],['Azul Duel',6.0,2]] }
    ],
    checklist: [
      "As-tu mis le OR (LIKE 'A%' OR LIKE 'D%') entre parenthèses ?",
      "As-tu utilisé IN (1, 2) pour les catégories ?",
      "BETWEEN 3 AND 6 inclut-il bien les bornes 3 et 6 ?"
    ], title: "Recherche multi-critères", level: 3,
    statement: "À partir de JEU(idJeu, titre, prixAchat, prixLocation, idCategorie), écris une requête affichant les jeux dont le titre commence par « A » OU « D », qui appartiennent aux catégories 1 ou 2, et dont le prix de location est compris entre 3 et 6 (bornes comprises). Combine LIKE, IN et BETWEEN.",
    hints: [
      "Titre commençant par A ou D : (titre LIKE 'A%' OR titre LIKE 'D%').",
      "Catégories : idCategorie IN (1, 2).",
      "Prix : prixLocation BETWEEN 3 AND 6. Relie le tout par AND, avec des parenthèses autour du OR."
    ],
    solution: "SELECT titre, prixLocation, idCategorie\nFROM JEU\nWHERE (titre LIKE 'A%' OR titre LIKE 'D%')\n  AND idCategorie IN (1, 2)\n  AND prixLocation BETWEEN 3 AND 6;",
    note: "On combine trois opérateurs : LIKE (motif), IN (liste), BETWEEN (intervalle). Les parenthèses autour du OR sont indispensables, car AND est prioritaire sur OR." }
  ]
};
</script>
