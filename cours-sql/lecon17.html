var DAY = {
  num: 17,
  title: "Les vues (CREATE VIEW)",
  subtitle: "Enregistrer une requête sous un nom, comme une table virtuelle.",
  theory: `
<h3>1. Qu'est-ce qu'une vue ?</h3>
<p>Une <strong>vue</strong> (view en anglais) est une requête <code>SELECT</code> à laquelle on donne un <strong>nom</strong> pour la conserver. Ensuite, on l'interroge <strong>comme si c'était une table</strong>. Différence essentielle : une vue ne stocke AUCUNE donnée — elle rejoue sa requête à chaque appel. On dit que c'est une « table virtuelle » : elle a l'apparence d'une table, mais derrière, ce n'est qu'une requête mémorisée. Pense à un raccourci ou à un « signet » qui rejoue toujours la même recherche.</p>
<pre class="pseudo">CREATE VIEW catalogue_dispo AS       -- CREATE VIEW = crée une vue nommée catalogue_dispo ; AS introduit sa requête
SELECT j.titre, j.prixLocation, c.libelle   -- les colonnes que la vue exposera
FROM JEU j
JOIN CATEGORIE c ON j.idCategorie = c.idCategorie   -- jointure JEU/CATEGORIE mémorisée dans la vue
WHERE j.stockLocation &gt; 0;            -- la vue ne montrera que les jeux ayant du stock</pre>

<h3>2. Utiliser une vue</h3>
<p>Une fois créée, on s'en sert exactement comme d'une table dans un FROM :</p>
<pre class="pseudo">SELECT * FROM catalogue_dispo;                              -- lit toute la vue (toutes ses colonnes/lignes)
SELECT titre FROM catalogue_dispo WHERE libelle = 'Stratégie';  -- on peut re-filtrer la vue avec un WHERE</pre>
<p>On peut donc filtrer, trier ou même joindre une vue comme n'importe quelle table.</p>

<h3>3. À quoi servent les vues ?</h3>
<pre class="pseudo">- SIMPLIFIER : cacher une requête compliquée derrière un nom simple à retenir
- RÉUTILISER : écrire la logique UNE seule fois, puis l'appeler partout
- SÉCURISER  : n'exposer que certaines colonnes/lignes (ex. sans les prix d'achat internes)
- STABILISER : si le schéma change, on corrige la vue seule, pas les 50 requêtes qui l'utilisent</pre>

<h3>4. La vue reflète toujours les données actuelles</h3>
<p>Point crucial : une vue n'est PAS une photo figée. Comme elle rejoue sa requête à chaque interrogation, elle montre toujours les données du moment. Ajoute un jeu (avec du stock) et il apparaîtra aussitôt dans <code>catalogue_dispo</code>, sans rien avoir à refaire. Les données elles-mêmes restent dans les tables sources (JEU, CATEGORIE).</p>

<h3>5. Modifier ou supprimer une vue</h3>
<pre class="pseudo">CREATE OR REPLACE VIEW catalogue_dispo AS SELECT ...;  -- REPLACE = redéfinit la vue existante (nouvelle requête)
DROP VIEW catalogue_dispo;                             -- DROP VIEW = supprime la vue (les tables sources restent intactes)</pre>
<div class="tip">Une vue simple (sur UNE seule table, sans agrégat) peut parfois être mise à jour (INSERT/UPDATE à travers elle, répercutés sur la table). Mais une vue avec jointure ou agrégat est en général en <strong>lecture seule</strong> : on l'utilise pour consulter, pas pour écrire.</div>`,
  exercises: [
    { type: "qcm", q: "Une vue est…", opts: ["Une copie des données", "Une requête SELECT enregistrée sous un nom (table virtuelle)", "Un index", "Une contrainte"], a: 1, exp: "Table virtuelle, sans stockage." },
    { type: "qcm", q: "Une vue stocke-t-elle les données ?", opts: ["Oui, une copie", "Non : elle rejoue sa requête à chaque appel", "Seulement les clés", "Uniquement en cache"], a: 1, exp: "Aucune donnée dupliquée." },
    { type: "qcm", q: "On crée une vue avec…", opts: ["CREATE TABLE", "CREATE VIEW nom AS SELECT ...", "CREATE INDEX", "MAKE VIEW"], a: 1, exp: "CREATE VIEW ... AS ..." },
    { type: "qcm", q: "On interroge une vue…", opts: ["Différemment d'une table", "Comme une table (SELECT ... FROM vue)", "Seulement avec un index", "Impossible"], a: 1, exp: "SELECT * FROM vue." },
    { type: "qcm", q: "Un intérêt d'une vue :", opts: ["Ralentir les requêtes", "Masquer une requête complexe derrière un nom simple", "Supprimer des tables", "Créer des doublons"], a: 1, exp: "Simplification et réutilisation." },
    { type: "qcm", q: "Une vue peut servir à la sécurité en…", opts: ["Chiffrant les données", "N'exposant que certaines colonnes/lignes", "Créant un mot de passe", "Supprimant la table"], a: 1, exp: "Exposer un sous-ensemble." },
    { type: "qcm", q: "Si on ajoute un jeu avec du stock, catalogue_dispo…", opts: ["Ne change pas", "L'affiche aussitôt (elle reflète les données actuelles)", "Doit être recréée", "Plante"], a: 1, exp: "La vue est toujours à jour." },
    { type: "qcm", q: "Redéfinir une vue :", opts: ["ALTER VIEW seulement", "CREATE OR REPLACE VIEW ...", "UPDATE VIEW", "MODIFY VIEW"], a: 1, exp: "CREATE OR REPLACE." },
    { type: "qcm", q: "Supprimer une vue :", opts: ["DELETE VIEW", "DROP VIEW nom", "REMOVE VIEW", "TRUNCATE VIEW"], a: 1, exp: "DROP VIEW." },
    { type: "qcm", q: "Une vue avec jointure ou agrégat est en général…", opts: ["Modifiable librement", "En lecture seule", "Un index", "Une contrainte"], a: 1, exp: "Consultation, pas écriture." },
    { type: "vf", q: "Supprimer une vue ne supprime pas les données des tables sources.", a: true, exp: "La vue ne contient pas les données." },
    { type: "qcm", q: "On peut filtrer une vue :", opts: ["Non", "Oui : SELECT ... FROM vue WHERE ...", "Seulement en la recréant", "Uniquement avec un index"], a: 1, exp: "Comme une table." },
    { type: "qcm", q: "Si le schéma change, une vue permet de…", opts: ["Tout casser", "Adapter la logique en un seul endroit (la vue)", "Supprimer les tables", "Créer un doublon"], a: 1, exp: "Point de stabilité." },
    { type: "vf", q: "On peut joindre une vue à une autre table dans une requête.", a: true, exp: "Une vue s'utilise comme une table." },
    { type: "qcm", q: "Exposer le catalogue SANS les prix d'achat se fait avec…", opts: ["Un index", "Une vue qui ne sélectionne pas prixAchat", "Un CHECK", "Un DELETE"], a: 1, exp: "La vue filtre les colonnes montrées." }
  ],
  final: {
    title: "Exercice final — Une vue métier",
    intro: `<p>On veut une vue « vitrine » exposant seulement ce qu'un client doit voir.</p>`,
    questions: [
      { type: "qcm", q: "Créer la vue :", opts: ["MAKE VIEW", "CREATE VIEW vitrine AS SELECT ...", "CREATE TABLE vitrine", "NEW VIEW"], a: 1, exp: "CREATE VIEW ... AS SELECT." },
      { type: "qcm", q: "Pour cacher le prix d'achat aux clients, la vue…", opts: ["Chiffre prixAchat", "Ne sélectionne pas la colonne prixAchat", "Supprime la colonne", "Trie par prixAchat"], a: 1, exp: "On n'expose que titre, prixLocation…" },
      { type: "qcm", q: "Interroger la vitrine :", opts: ["SELECT * FROM vitrine;", "OPEN vitrine", "VIEW vitrine", "RUN vitrine"], a: 0, exp: "Comme une table." },
      { type: "qcm", q: "Un nouveau jeu disponible apparaît dans la vitrine…", opts: ["Après recréation manuelle", "Automatiquement (la vue reflète les données)", "Jamais", "Après un COMMIT explicite de la vue"], a: 1, exp: "Toujours à jour." },
      { type: "vf", q: "La vitrine est en lecture seule si elle contient une jointure.", a: true, exp: "Vue jointe = consultation." }
    ],
    solution: `<pre class="pseudo">CREATE VIEW vitrine AS                       -- vue « vitrine » pour le client
SELECT j.titre, j.prixLocation, c.libelle    -- on N'expose PAS prixAchat (donnée interne)
FROM JEU j
JOIN CATEGORIE c ON j.idCategorie = c.idCategorie
WHERE j.stockLocation &gt; 0;                   -- seulement les jeux disponibles

-- utilisation par le client (il ne voit jamais le prix d'achat)
SELECT * FROM vitrine ORDER BY prixLocation;  -- on trie la vue comme une table</pre>
<p>Tu enregistres tes requêtes utiles. Demain : accélérer avec les index.</p>`
  }
};
