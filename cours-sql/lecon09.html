<script>
var DAY = {
  num: 9,
  title: "Regrouper : GROUP BY et HAVING",
  subtitle: "Des indicateurs par groupe, et un filtre sur les groupes.",
  theory: `
<h3>1. GROUP BY : un agrégat PAR groupe</h3>
<p>À la leçon 8, un agrégat résumait TOUTE la table en une seule valeur. Mais souvent on veut un résumé <strong>par groupe</strong> : « combien de jeux PAR catégorie ? ». La clause <code>GROUP BY</code> (« regrouper par ») rassemble les lignes qui partagent la même valeur (toutes celles de la catégorie 1 ensemble, celles de la catégorie 2 ensemble…), puis calcule l'agrégat séparément dans chaque paquet. Imagine que tu tries des cartes en tas selon leur couleur, puis que tu comptes chaque tas.</p>
<pre class="pseudo">SELECT idCategorie, COUNT(*) AS nb_jeux   -- pour chaque groupe : sa catégorie et le nombre de jeux dedans
FROM JEU
GROUP BY idCategorie;                     -- GROUP BY = fais un tas par valeur d'idCategorie

-- résultat : une ligne par catégorie, avec son nombre de jeux</pre>

<h3>2. La règle d'or</h3>
<p>Règle à ne jamais oublier : dans un SELECT avec GROUP BY, chaque colonne affichée doit être <strong>soit</strong> une colonne citée dans le <code>GROUP BY</code>, <strong>soit</strong> placée à l'intérieur d'une fonction d'agrégation. Une colonne « libre » n'a aucun sens : un groupe contient plusieurs titres, lequel afficher ?</p>
<pre class="pseudo">-- BON : idCategorie est dans le GROUP BY, COUNT(*) est un agrégat
SELECT idCategorie, COUNT(*) FROM JEU GROUP BY idCategorie;

-- FAUX : titre n'est ni groupé ni agrégé (un groupe a plusieurs titres → ambigu)
SELECT idCategorie, titre, COUNT(*) FROM JEU GROUP BY idCategorie;</pre>

<h3>3. Plusieurs agrégats par groupe</h3>
<p>Rien n'empêche de calculer plusieurs agrégats à la fois pour chaque groupe : le SGBD les évalue tous, tas par tas.</p>
<pre class="pseudo">SELECT idCategorie,                       -- la catégorie (colonne du GROUP BY)
       COUNT(*)          AS nb_jeux,       -- combien de jeux dans cette catégorie
       AVG(prixLocation) AS prix_moyen,    -- prix de location moyen de cette catégorie
       MAX(prixLocation) AS plus_cher      -- le jeu le plus cher de cette catégorie
FROM JEU
GROUP BY idCategorie;                      -- un tas par catégorie</pre>

<h3>4. HAVING : filtrer les GROUPES</h3>
<p>Une fois les groupes formés et agrégés, on veut parfois n'en garder que certains : « les catégories ayant au moins 2 jeux ». Comme le critère porte sur un agrégat (COUNT), on ne peut pas utiliser WHERE. On utilise <code>HAVING</code> (« ayant »), le filtre spécial des groupes, qui agit APRÈS l'agrégation.</p>
<pre class="pseudo">SELECT idCategorie, COUNT(*) AS nb_jeux
FROM JEU
GROUP BY idCategorie
HAVING COUNT(*) &gt;= 2;                      -- HAVING = ne garde que les groupes ayant au moins 2 jeux</pre>
<div class="tip">WHERE ne peut PAS utiliser d'agrégat (COUNT, SUM…), car il agit AVANT le regroupement (les groupes n'existent pas encore). C'est le rôle de HAVING. On peut combiner les deux : WHERE filtre les lignes d'abord, puis HAVING filtre les groupes ensuite.</div>

<h3>5. L'ordre logique complet</h3>
<p>Voici enfin l'ordre COMPLET dans lequel le SGBD exécute une requête (rappel : ce n'est pas l'ordre d'écriture) :</p>
<pre class="pseudo">FROM       -- 1) quelle table ?
WHERE      -- 2) filtrer les LIGNES (avant tout regroupement)
GROUP BY   -- 3) former les groupes (les tas)
HAVING     -- 4) filtrer les GROUPES (sur les agrégats)
SELECT     -- 5) choisir les colonnes + agrégats à afficher
ORDER BY   -- 6) trier le résultat final</pre>
<pre class="pseudo">-- exemple complet, étape par étape :
SELECT idCategorie, AVG(prixLocation) AS prix_moyen   -- 5) affiche catégorie + prix moyen
FROM JEU                                              -- 1) depuis JEU
WHERE stockLocation &gt; 0                               -- 2) garde d'abord les jeux disponibles
GROUP BY idCategorie                                  -- 3) regroupe par catégorie
HAVING AVG(prixLocation) &gt; 4                          -- 4) ne garde que les catégories dont la moyenne dépasse 4
ORDER BY prix_moyen DESC;                             -- 6) trie du plus cher au moins cher</pre>`,
  exercises: [
    { type: "qcm", q: "GROUP BY sert à…", opts: ["Trier", "Former des groupes et calculer un agrégat par groupe", "Filtrer une ligne", "Supprimer les doublons"], a: 1, exp: "Un agrégat par groupe." },
    { type: "qcm", q: "« Nombre de jeux par catégorie » s'écrit avec…", opts: ["ORDER BY idCategorie", "GROUP BY idCategorie + COUNT(*)", "WHERE idCategorie", "DISTINCT"], a: 1, exp: "Regroupement + comptage." },
    { type: "qcm", q: "Avec GROUP BY, une colonne affichée doit être…", opts: ["N'importe laquelle", "Groupée OU dans un agrégat", "Toujours la clé primaire", "Un alias"], a: 1, exp: "La règle d'or du GROUP BY." },
    { type: "qcm", q: "SELECT idCategorie, titre, COUNT(*) ... GROUP BY idCategorie est…", opts: ["Correct", "Incohérent : titre n'est ni groupé ni agrégé", "Correct si titre est dans le GROUP BY", "Valide, titre s'affiche quand même"], a: 1, exp: "titre viole la règle." },
    { type: "qcm", q: "HAVING filtre…", opts: ["Les lignes avant regroupement", "Les groupes après agrégation", "Chaque ligne individuellement", "Le résultat après ORDER BY"], a: 1, exp: "Filtre post-agrégation." },
    { type: "qcm", q: "WHERE filtre…", opts: ["Les groupes", "Les lignes avant le regroupement", "Les agrégats", "Le résultat final trié"], a: 1, exp: "Filtre pré-regroupement." },
    { type: "qcm", q: "« Catégories avec au moins 2 jeux » :", opts: ["WHERE COUNT(*) >= 2", "GROUP BY idCategorie HAVING COUNT(*) >= 2", "ORDER BY COUNT(*)", "DISTINCT idCategorie"], a: 1, exp: "HAVING sur l'agrégat." },
    { type: "qcm", q: "Peut-on écrire WHERE COUNT(*) > 2 ?", opts: ["Oui", "Non : WHERE agit avant l'agrégation, il faut HAVING", "Seulement en MySQL", "Oui, si on ajoute GROUP BY"], a: 1, exp: "Les agrégats vont dans HAVING." },
    { type: "qcm", q: "Dans l'ordre logique, GROUP BY vient…", opts: ["Avant WHERE", "Après WHERE, avant HAVING", "Après ORDER BY", "En premier"], a: 1, exp: "FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY." },
    { type: "qcm", q: "On peut combiner WHERE et HAVING ?", opts: ["Non", "Oui : WHERE sur les lignes, HAVING sur les groupes", "Seulement l'un des deux", "Jamais avec GROUP BY"], a: 1, exp: "Les deux filtres coexistent." },
    { type: "vf", q: "GROUP BY produit une ligne de résultat par groupe distinct.", a: true, exp: "Un résultat par valeur groupée." },
    { type: "qcm", q: "Trier les catégories par prix moyen décroissant :", opts: ["GROUP BY prix_moyen", "ORDER BY prix_moyen DESC (après GROUP BY)", "HAVING prix_moyen", "WHERE prix_moyen"], a: 1, exp: "ORDER BY en dernier." },
    { type: "qcm", q: "SELECT idCategorie, COUNT(*) FROM JEU GROUP BY idCategorie donne, pour 3 catégories…", opts: ["Une ligne", "Trois lignes (une par catégorie)", "Toutes les lignes de JEU", "Deux lignes (les catégories non vides)"], a: 1, exp: "Une ligne par groupe." },
    { type: "vf", q: "HAVING peut utiliser une fonction d'agrégation (ex. HAVING SUM(...) > 100).", a: true, exp: "C'est justement son rôle." },
    { type: "qcm", q: "« Prix moyen par catégorie, seulement si > 4 » :", opts: ["WHERE AVG > 4", "GROUP BY idCategorie HAVING AVG(prixLocation) > 4", "ORDER BY AVG", "DISTINCT AVG"], a: 1, exp: "HAVING sur la moyenne." }
  ],
  final: {
    title: "Exercice final — Analyse par catégorie",
    intro: `<p>Table JEU(idJeu, titre, prixLocation, stockLocation, idCategorie). On analyse le catalogue par catégorie.</p>`,
    questions: [
      { type: "qcm", q: "Nombre de jeux par catégorie :", opts: ["SELECT COUNT(*) FROM JEU", "SELECT idCategorie, COUNT(*) FROM JEU GROUP BY idCategorie", "SELECT DISTINCT idCategorie", "ORDER BY idCategorie"], a: 1, exp: "GROUP BY + COUNT." },
      { type: "qcm", q: "Prix de location moyen par catégorie :", opts: ["AVG(prixLocation) GROUP BY idCategorie", "SELECT idCategorie, AVG(prixLocation) FROM JEU GROUP BY idCategorie", "SELECT AVG(prixLocation) FROM JEU", "HAVING AVG"], a: 1, exp: "Un AVG par groupe." },
      { type: "qcm", q: "Seulement les catégories ayant plus de 2 jeux :", opts: ["WHERE COUNT(*) > 2", "... GROUP BY idCategorie HAVING COUNT(*) > 2", "ORDER BY COUNT(*)", "DISTINCT"], a: 1, exp: "HAVING sur le comptage." },
      { type: "qcm", q: "Où filtrer « seulement les jeux disponibles » avant de grouper ?", opts: ["HAVING stockLocation > 0", "WHERE stockLocation > 0", "GROUP BY stockLocation", "ORDER BY stock"], a: 1, exp: "WHERE agit avant le regroupement." },
      { type: "vf", q: "On peut trier le résultat groupé par le prix moyen avec ORDER BY.", a: true, exp: "ORDER BY après le GROUP BY." }
    ],
    solution: `<pre class="pseudo">SELECT idCategorie,
       COUNT(*)          AS nb_jeux,     -- nombre de jeux du groupe
       AVG(prixLocation) AS prix_moyen   -- prix moyen du groupe
FROM JEU
WHERE stockLocation &gt; 0        -- 1) filtre les LIGNES (jeux disponibles)
GROUP BY idCategorie           -- 2) forme les groupes (par catégorie)
HAVING COUNT(*) &gt; 2            -- 3) filtre les GROUPES (plus de 2 jeux)
ORDER BY prix_moyen DESC;      -- 4) trie le résultat (prix moyen décroissant)</pre>
<p>Tu analyses par groupe. Demain : relier plusieurs tables avec les jointures.</p>`
  }
};
</script>
