var DAY = {
  num: 13,
  title: "Opérateurs ensemblistes : UNION",
  subtitle: "Empiler les résultats de plusieurs requêtes.",
  theory: `
<h3>1. UNION : empiler deux résultats</h3>
<p><code>UNION</code> (« union ») <strong>réunit</strong> les lignes de deux requêtes SELECT en un seul résultat, et <strong>supprime les doublons</strong>. Image mentale : c'est un empilage <strong>vertical</strong> — on pose les lignes de la 2e requête sous celles de la 1re. C'est différent d'une jointure, qui est un croisement <strong>horizontal</strong> (elle accole des colonnes côte à côte).</p>
<pre class="pseudo">-- les identifiants des clients ayant loué OU acheté, sans répétition :
SELECT idClient FROM LOUER      -- 1re pile : les clients qui ont loué
UNION                           -- UNION = empile les deux et retire les doublons
SELECT idClient FROM ACHETER;   -- 2e pile : les clients qui ont acheté</pre>

<h3>2. Les règles de compatibilité</h3>
<p>Pour empiler deux résultats, leurs colonnes doivent « s'aligner ». Trois règles :</p>
<pre class="pseudo">- même NOMBRE de colonnes dans chaque SELECT          -- 2 colonnes d'un côté = 2 colonnes de l'autre
- des TYPES compatibles colonne par colonne           -- un nombre s'empile avec un nombre, du texte avec du texte
- les noms de colonnes du résultat viennent du 1er SELECT  -- c'est le premier qui donne les en-têtes</pre>
<pre class="pseudo">-- OK : une seule colonne (un id) de chaque côté, même type :
SELECT idClient FROM LOUER
UNION
SELECT idClient FROM ACHETER;   -- structures identiques → empilage valide</pre>

<h3>3. UNION ALL : garder les doublons</h3>
<p><code>UNION ALL</code> (« union de tout ») empile SANS supprimer les doublons. C'est plus rapide (pas de travail de déduplication) : à utiliser quand on sait qu'il n'y a pas de doublons, ou justement quand on VEUT les garder (pour les compter).</p>
<pre class="pseudo">SELECT idJeu FROM LOUER
UNION ALL                       -- ALL = garde TOUTES les lignes, doublons compris
SELECT idJeu FROM ACHETER;
-- un jeu loué 2 fois et acheté 1 fois apparaîtra 3 fois dans le résultat</pre>
<div class="tip">UNION (dédupliqué) fait un travail de tri EN PLUS pour éliminer les doublons, ce qui coûte du temps. Si tu n'as pas besoin de dédupliquer, UNION ALL est plus efficace.</div>

<h3>4. INTERSECT et EXCEPT</h3>
<p>Deux autres opérateurs ensemblistes complètent UNION :</p>
<pre class="pseudo">INTERSECT   -- garde uniquement les lignes présentes dans LES DEUX requêtes (le « et »)
EXCEPT      -- garde les lignes de la 1re SAUF celles de la 2e (le « sauf » ; appelé MINUS chez Oracle)</pre>
<pre class="pseudo">-- les clients qui ont loué ET acheté (présents des deux côtés) :
SELECT idClient FROM LOUER
INTERSECT                       -- INTERSECT = intersection des deux ensembles
SELECT idClient FROM ACHETER;</pre>
<p>INTERSECT et EXCEPT ne sont pas supportés par tous les SGBD (les anciennes versions de MySQL ne les ont pas ; on les remplace alors par des jointures ou des sous-requêtes).</p>

<h3>5. Trier un résultat d'UNION</h3>
<p>Un seul <code>ORDER BY</code> est autorisé, tout à la fin, après le dernier SELECT : il trie le résultat GLOBAL (l'ensemble empilé), pas chaque morceau séparément.</p>
<pre class="pseudo">SELECT titre, prixLocation AS prix FROM JEU WHERE idCategorie = 1   -- 1er morceau (le 1er SELECT nomme les colonnes)
UNION
SELECT titre, prixLocation FROM JEU WHERE idCategorie = 2           -- 2e morceau empilé
ORDER BY prix DESC;                                                 -- tri UNIQUE du résultat complet, par prix décroissant</pre>`,
  exercises: [
    { type: "qcm", q: "UNION sert à…", opts: ["Croiser des colonnes", "Empiler les lignes de deux requêtes (et dédupliquer)", "Trier", "Créer une table"], a: 1, exp: "Empilage vertical de lignes." },
    { type: "qcm", q: "UNION supprime…", opts: ["Les colonnes", "Les doublons", "Les NULL", "Les index"], a: 1, exp: "Résultat sans doublon." },
    { type: "qcm", q: "Les deux SELECT d'un UNION doivent avoir…", opts: ["Le même nom de table", "Le même nombre de colonnes, de types compatibles", "Le même WHERE", "Le même ORDER BY"], a: 1, exp: "Compatibilité de structure." },
    { type: "qcm", q: "Les noms de colonnes du résultat viennent…", opts: ["Du dernier SELECT", "Du premier SELECT", "Au hasard", "De la table"], a: 1, exp: "Le premier SELECT nomme les colonnes." },
    { type: "qcm", q: "UNION ALL…", opts: ["Supprime les doublons", "Garde les doublons (plus rapide)", "Trie", "Filtre les NULL"], a: 1, exp: "Pas de déduplication." },
    { type: "qcm", q: "Un jeu loué 2 fois et acheté 1 fois apparaît, avec UNION ALL…", opts: ["1 fois", "3 fois", "0 fois", "2 fois"], a: 1, exp: "Tous les doublons conservés." },
    { type: "qcm", q: "INTERSECT renvoie…", opts: ["Toutes les lignes", "Les lignes présentes dans LES DEUX requêtes", "Aucune", "Les doublons"], a: 1, exp: "Intersection des deux ensembles." },
    { type: "qcm", q: "EXCEPT renvoie…", opts: ["Les lignes communes", "Les lignes de la 1re requête SAUF celles de la 2e", "Toutes les lignes", "Rien"], a: 1, exp: "Différence ensembliste." },
    { type: "qcm", q: "« Clients ayant loué ET acheté » :", opts: ["UNION", "INTERSECT", "UNION ALL", "EXCEPT"], a: 1, exp: "Présents des deux côtés." },
    { type: "qcm", q: "UNION est plus lent qu'UNION ALL car…", opts: ["Il joint des tables", "Il doit éliminer les doublons (tri)", "Il crée un index", "Il trie toujours"], a: 1, exp: "La déduplication a un coût." },
    { type: "vf", q: "Un ORDER BY sur un UNION se place à la fin et porte sur le résultat global.", a: true, exp: "Un seul ORDER BY final." },
    { type: "qcm", q: "INTERSECT et EXCEPT…", opts: ["Sont universels", "Ne sont pas supportés par tous les SGBD", "Sont interdits", "Remplacent UNION"], a: 1, exp: "Support variable (MySQL ancien ne les a pas)." },
    { type: "qcm", q: "Deux SELECT avec un nombre de colonnes différent dans un UNION…", opts: ["Fonctionnent", "Provoquent une erreur", "Dédupliquent", "Trient"], a: 1, exp: "Nombre de colonnes doit être identique." },
    { type: "vf", q: "UNION est un empilage vertical (lignes), la jointure un croisement horizontal (colonnes).", a: true, exp: "Deux logiques différentes." },
    { type: "qcm", q: "Pour compter combien de fois un id apparaît au total (loué + acheté), on utilise plutôt…", opts: ["UNION", "UNION ALL (garde les doublons)", "INTERSECT", "EXCEPT"], a: 1, exp: "On veut conserver les répétitions." }
  ],
  final: {
    title: "Exercice final — Combiner des listes",
    intro: `<p>Tables LOUER(idClient, idJeu) et ACHETER(idClient, idJeu). On analyse l'activité des clients.</p>`,
    questions: [
      { type: "qcm", q: "Clients ayant loué OU acheté (sans doublon) :", opts: ["SELECT idClient FROM LOUER UNION SELECT idClient FROM ACHETER", "JOIN LOUER ACHETER", "INTERSECT", "EXCEPT"], a: 0, exp: "UNION déduplique." },
      { type: "qcm", q: "Clients ayant loué ET acheté :", opts: ["UNION", "INTERSECT", "UNION ALL", "EXCEPT"], a: 1, exp: "Présents des deux côtés." },
      { type: "qcm", q: "Clients ayant loué mais JAMAIS acheté :", opts: ["UNION", "INTERSECT", "EXCEPT (LOUER sauf ACHETER)", "UNION ALL"], a: 2, exp: "Différence ensembliste." },
      { type: "qcm", q: "Pour garder les doublons (compter l'activité totale) :", opts: ["UNION", "UNION ALL", "INTERSECT", "EXCEPT"], a: 1, exp: "UNION ALL conserve tout." },
      { type: "vf", q: "Les deux SELECT d'un UNION doivent renvoyer le même nombre de colonnes.", a: true, exp: "Compatibilité de structure." }
    ],
    solution: `<pre class="pseudo">-- loué OU acheté (identifiants uniques)
SELECT idClient FROM LOUER
UNION                            -- empile et déduplique
SELECT idClient FROM ACHETER;

-- loué ET acheté (présents dans les deux)
SELECT idClient FROM LOUER
INTERSECT                        -- garde uniquement les communs
SELECT idClient FROM ACHETER;

-- loué mais jamais acheté (les uns SAUF les autres)
SELECT idClient FROM LOUER
EXCEPT                           -- retire ceux présents dans ACHETER
SELECT idClient FROM ACHETER;</pre>
<p>Tu combines des ensembles. Demain : modifier et supprimer des données.</p>`
  }
};
