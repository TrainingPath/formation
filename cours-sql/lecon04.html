<script>
var DAY = {
  num: 4,
  title: "Interroger : SELECT ... FROM",
  subtitle: "Choisir les colonnes, les renommer, calculer, dédupliquer.",
  theory: `
<h3>1. Projeter des colonnes</h3>
<p>On revient à la lecture des données. <code>SELECT</code> choisit les <strong>colonnes</strong> à afficher, et <code>FROM</code> indique dans quelle <strong>table</strong> aller les chercher. Le fait de ne garder que certaines colonnes s'appelle la <strong>projection</strong> (comme un projecteur qui n'éclaire qu'une partie de la scène). C'est différent du <em>filtrage</em> de lignes (WHERE, leçon 5) : ici on choisit des colonnes, pas des lignes.</p>
<pre class="pseudo">SELECT titre, prixLocation FROM JEU;   -- projette 2 colonnes (titre, prixLocation) de la table JEU
SELECT * FROM JEU;                     -- l'étoile * = toutes les colonnes de JEU</pre>

<h3>2. Renommer avec un alias (AS)</h3>
<p>Un <strong>alias</strong> est un <strong>nom d'affichage temporaire</strong> donné à une colonne (ou à une table), juste le temps du résultat — un surnom. On l'introduit avec le mot-clé <code>AS</code> (« en tant que »), qui est souvent facultatif. Cela ne renomme rien dans la table : c'est purement cosmétique, pour un affichage plus clair.</p>
<pre class="pseudo">SELECT titre AS jeu, prixLocation AS tarif   -- « titre » s'affichera « jeu », « prixLocation » s'affichera « tarif »
FROM JEU;                                    -- toujours depuis la table JEU</pre>

<h3>3. Colonnes calculées</h3>
<p>Un SELECT ne se limite pas à recopier des colonnes existantes : il peut afficher le résultat d'un <strong>calcul</strong> ou d'une <strong>expression</strong>. La valeur est calculée à la volée, ligne par ligne, sans rien changer dans la table.</p>
<pre class="pseudo">-- prix TTC = prix de location + 21 % de TVA :
SELECT titre, prixLocation * 1.21 AS prix_ttc   -- multiplie chaque prix par 1.21 et nomme le résultat « prix_ttc »
FROM JEU;

-- une constante (valeur fixe identique sur chaque ligne) :
SELECT titre, 'à louer' AS statut FROM JEU;      -- ajoute une colonne « statut » valant toujours le texte 'à louer'</pre>

<h3>4. Éliminer les doublons : DISTINCT</h3>
<p>Le mot-clé <code>DISTINCT</code> (« distinct », « différent ») <strong>supprime les lignes en double</strong> dans le résultat. Pratique pour obtenir la liste des valeurs différentes d'une colonne : si 10 jeux sont dans la catégorie 1, on ne veut voir « 1 » qu'une seule fois.</p>
<pre class="pseudo">-- la liste des catégories réellement utilisées, sans répétition :
SELECT DISTINCT idCategorie FROM JEU;   -- DISTINCT = garde chaque valeur d'idCategorie une seule fois</pre>

<h3>5. L'ordre logique d'une requête</h3>
<p>Détail important : même si on ÉCRIT <code>SELECT</code> en premier, le SGBD ne l'EXÉCUTE pas en premier. Il commence par repérer la table (<code>FROM</code>), puis choisit les lignes, puis les colonnes. Comprendre cet ordre « caché » aidera énormément pour les requêtes complexes des leçons suivantes.</p>
<pre class="pseudo">FROM       -- ÉTAPE 1 : quelle table ? (on va chercher les données)
->  WHERE      -- ÉTAPE 2 : quelles lignes garder ? (le filtre — leçon 5)
->  SELECT     -- ÉTAPE 3 : quelles colonnes afficher ? (la projection)
->  ORDER BY   -- ÉTAPE 4 : dans quel ordre trier le résultat ? (leçon 6)</pre>
<div class="tip">Un alias contenant un espace se met entre guillemets doubles (ou crochets selon le SGBD) : <code>SELECT prixLocation AS "tarif de location" FROM JEU;</code>. Attention : guillemets doubles pour un alias, apostrophes simples pour du texte-donnée.</div>`,
  exercises: [
    { type: "qcm", q: "La « projection » consiste à…", opts: ["Filtrer des lignes", "Ne garder que certaines colonnes", "Trier", "Supprimer une table"], a: 1, exp: "SELECT choisit les colonnes." },
    { type: "qcm", q: "FROM indique…", opts: ["Les colonnes", "La table source", "Le tri", "La condition"], a: 1, exp: "La table interrogée." },
    { type: "qcm", q: "Un alias (AS) sert à…", opts: ["Filtrer", "Donner un nom d'affichage à une colonne ou une table", "Supprimer les doublons", "Créer un index"], a: 1, exp: "Renommer pour la lisibilité." },
    { type: "qcm", q: "Dans SELECT prixLocation AS tarif, « tarif » est…", opts: ["Une table", "Le nom d'affichage de la colonne", "Une condition", "Une valeur"], a: 1, exp: "Alias de colonne." },
    { type: "qcm", q: "Une colonne calculée, c'est…", opts: ["Une colonne de la table", "Le résultat d'une expression (ex. prix * 1.21)", "Un index", "Une clé"], a: 1, exp: "SELECT peut afficher des calculs." },
    { type: "qcm", q: "SELECT DISTINCT idCategorie FROM JEU renvoie…", opts: ["Tous les idCategorie avec doublons", "Les valeurs distinctes d'idCategorie (sans répétition)", "Les titres", "Une erreur"], a: 1, exp: "DISTINCT déduplique." },
    { type: "qcm", q: "DISTINCT s'applique…", opts: ["À une seule ligne", "À l'ensemble des colonnes sélectionnées (supprime les lignes en double)", "Aux index", "Aux clés"], a: 1, exp: "Déduplication du résultat." },
    { type: "qcm", q: "SELECT * FROM JEU renvoie…", opts: ["Une colonne", "Toutes les colonnes de JEU", "Aucune donnée", "Le nombre de lignes"], a: 1, exp: "* = toutes les colonnes." },
    { type: "qcm", q: "Le mot AS est…", opts: ["Obligatoire", "Souvent optionnel pour un alias", "Interdit", "Réservé aux tables"], a: 1, exp: "SELECT titre jeu marche aussi." },
    { type: "qcm", q: "Dans l'ordre logique, le SGBD lit d'abord…", opts: ["SELECT", "FROM (la table)", "ORDER BY", "AS"], a: 1, exp: "FROM avant SELECT." },
    { type: "vf", q: "SELECT peut afficher une constante (ex. 'à louer') comme colonne.", a: true, exp: "Une expression littérale est permise." },
    { type: "qcm", q: "Pour afficher le prix de location majoré de 21 %…", opts: ["prixLocation + 21", "prixLocation * 1.21", "prixLocation DISTINCT", "prixLocation AS 21"], a: 1, exp: "Multiplication par 1.21." },
    { type: "qcm", q: "Un alias avec un espace se met…", opts: ["Sans rien", "Entre guillemets (ou crochets)", "En majuscules", "Entre apostrophes de chaîne"], a: 1, exp: "\"tarif de location\"." },
    { type: "vf", q: "SELECT ne modifie jamais les données de la table.", a: true, exp: "C'est une lecture (DQL)." },
    { type: "qcm", q: "SELECT titre, titre FROM JEU…", opts: ["Est interdit", "Affiche deux fois la colonne titre", "Supprime les doublons", "Renomme titre"], a: 1, exp: "On peut répéter une colonne." }
  ],
  final: {
    title: "Exercice final — Projeter et calculer",
    intro: `<p>Table JEU(idJeu, titre, prixAchat, prixLocation, idCategorie). On veut un affichage commercial.</p>`,
    questions: [
      { type: "qcm", q: "Afficher seulement le titre et le prix de location :", opts: ["SELECT * FROM JEU;", "SELECT titre, prixLocation FROM JEU;", "SELECT JEU;", "SELECT titre + prixLocation FROM JEU;"], a: 1, exp: "Projection des deux colonnes." },
      { type: "qcm", q: "Renommer prixLocation en « tarif » :", opts: ["prixLocation -> tarif", "prixLocation AS tarif", "AS tarif prixLocation", "tarif = prixLocation"], a: 1, exp: "colonne AS alias." },
      { type: "qcm", q: "Afficher le prix location TTC (TVA 21 %) :", opts: ["prixLocation * 1.21 AS ttc", "prixLocation + TVA", "TTC(prixLocation)", "prixLocation DISTINCT"], a: 0, exp: "Colonne calculée." },
      { type: "qcm", q: "Lister les catégories utilisées sans doublon :", opts: ["SELECT idCategorie FROM JEU;", "SELECT DISTINCT idCategorie FROM JEU;", "SELECT * FROM JEU;", "SELECT COUNT idCategorie"], a: 1, exp: "DISTINCT déduplique." },
      { type: "vf", q: "Une colonne calculée (prix * 1.21) ne modifie pas la table : c'est un affichage.", a: true, exp: "SELECT lit seulement." }
    ],
    solution: `<pre class="pseudo">SELECT titre,                          -- colonne brute : le titre du jeu
       prixLocation AS tarif,          -- même colonne, affichée sous le surnom « tarif »
       prixLocation * 1.21 AS tarif_ttc  -- colonne CALCULÉE : prix + 21 % de TVA, nommée « tarif_ttc »
FROM JEU;                              -- source : la table JEU

SELECT DISTINCT idCategorie FROM JEU;  -- liste des catégories utilisées, sans doublon (DISTINCT)

-- Récap : projection (colonnes) + alias (AS) + calcul + DISTINCT (déduplication).</pre>
<p>Tu sais façonner l'affichage. Demain : filtrer les lignes avec WHERE.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta requête SELECT…",
  items: [
  { id: "sql-l4",
    lang: "sql",
    schema: `CREATE TABLE JEU (idJeu INT, titre TEXT, prixAchat REAL, prixLocation REAL, idCategorie INT);
INSERT INTO JEU VALUES (1,'Catan',44.9,5.0,1),(2,'Azul',39.9,4.0,2),(3,'Dixit',29.9,3.0,1);`,
    tests: [
      { label: "Alias jeu/tarif + remise de 10%", query: "SELECT titre AS jeu, prixLocation AS tarif, ROUND(prixLocation*0.90,2) AS tarif_promo FROM JEU ORDER BY idJeu", expect: [['Catan',5.0,4.5],['Azul',4.0,3.6],['Dixit',3.0,2.7]] },
      { label: "Catégories distinctes", query: "SELECT DISTINCT idCategorie FROM JEU ORDER BY idCategorie", expect: [[1],[2]] }
    ],
    checklist: [
      "As-tu renommé les colonnes avec AS (jeu, tarif, tarif_promo) ?",
      "La remise de 10% est-elle bien prixLocation * 0.90 ?",
      "As-tu utilisé DISTINCT pour les catégories uniques ?"
    ], title: "Un affichage soigné du catalogue", level: 2,
    statement: "À partir de JEU(idJeu, titre, prixAchat, prixLocation), écris une requête qui affiche : le titre (renommé « jeu »), le prix de location (renommé « tarif ») et le prix de location remisé de 10 % (renommé « tarif_promo »). Ajoute une seconde requête listant les catégories distinctes utilisées.",
    hints: [
      "Alias : colonne AS nom.",
      "Remise 10 % : prixLocation * 0.90.",
      "Catégories distinctes : SELECT DISTINCT idCategorie FROM JEU;"
    ],
    solution: "SELECT titre AS jeu,\n       prixLocation AS tarif,\n       prixLocation * 0.90 AS tarif_promo\nFROM JEU;\n\nSELECT DISTINCT idCategorie FROM JEU;",
    note: "SELECT ne se limite pas aux colonnes brutes : alias (AS) pour l'affichage, expressions calculées pour dériver de nouvelles valeurs, DISTINCT pour éliminer les doublons." }
  ]
};
</script>
