<script>
var DAY = {
  num: 2,
  title: "Créer une table : CREATE TABLE et les types",
  subtitle: "Traduire le MLD en tables réelles.",
  theory: `
<h3>1. La commande CREATE TABLE</h3>
<p>Avant de pouvoir ranger des données, il faut d'abord <strong>fabriquer</strong> la table qui les accueillera — un peu comme dessiner les colonnes d'un tableau AVANT d'y écrire. C'est le rôle de <code>CREATE TABLE</code> (« créer une table »). Cette commande définit trois choses : le <strong>nom</strong> de la table, la <strong>liste des colonnes</strong>, et pour chaque colonne son <strong>type</strong> (quelle sorte de valeur elle contient) et ses <strong>contraintes</strong> (les règles qu'elle doit respecter).</p>
<pre class="pseudo">CREATE TABLE CATEGORIE (            -- CREATE TABLE = « fabrique une table » nommée CATEGORIE ; la ( ouvre la liste des colonnes
  idCategorie INT PRIMARY KEY,      -- colonne idCategorie : type INT (entier), PRIMARY KEY = identifiant unique de la ligne
  libelle     VARCHAR(60) NOT NULL  -- colonne libelle : texte jusqu'à 60 caractères, NOT NULL = valeur obligatoire
);                                  -- la ) ferme la liste des colonnes ; le ; termine la commande</pre>

<h3>2. Les types de colonnes les plus courants</h3>
<p>Le <strong>type</strong> d'une colonne indique la <strong>nature</strong> de ce qu'elle peut contenir : un nombre entier, du texte, une date… C'est comme préciser sur une étiquette « ici, uniquement des nombres ». Le SGBD refusera alors d'y mettre autre chose. Voici les types que tu rencontreras le plus souvent :</p>
<pre class="pseudo">INT                   -- entier (nombre sans virgule) : idJeu, stock, âge…
DECIMAL(p, s)         -- décimal EXACT : p = total de chiffres, s = chiffres après la virgule ; DECIMAL(6,2) va jusqu'à 9999.99
VARCHAR(n)            -- texte de longueur VARIABLE, jusqu'à n caractères max : titre, nom… (VAR = variable)
CHAR(n)               -- texte de longueur FIXE de n caractères (complété par des espaces si plus court)
TEXT                  -- texte LONG (paragraphes, descriptions), sans limite fixée à l'avance
DATE                  -- une date seule, au format année-mois-jour (2026-07-06)
DATETIME / TIMESTAMP  -- une date AVEC l'heure (le moment précis d'une action)
BOOLEAN               -- vrai/faux (oui/non) ; certains SGBD le stockent en TINYINT (0 ou 1)</pre>
<div class="warn">Pour l'argent, on utilise <code>DECIMAL</code> (exact), JAMAIS <code>FLOAT</code> (qui arrondit). Un prix de 5.10 doit rester 5.10, pas 5.0999999. FLOAT stocke les nombres « à peu près », ce qui est inacceptable pour de la comptabilité.</div>

<h3>3. Les contraintes de colonne</h3>
<p>Une <strong>contrainte</strong> est une <strong>règle</strong> que le SGBD fait respecter automatiquement, comme un vigile qui refuse toute donnée non conforme. Si tu essaies d'insérer une valeur interdite, la base bloque et renvoie une erreur. Voici les contraintes de base :</p>
<pre class="pseudo">PRIMARY KEY   -- clé PRIMAIRE : identifie chaque ligne de façon unique ; à la fois UNIQUE et jamais vide
NOT NULL      -- valeur OBLIGATOIRE : interdit la case vide (NULL = « rien », « inconnu »)
UNIQUE        -- valeur UNIQUE : interdit deux lignes avec la même valeur (ex. deux fois le même email)
DEFAULT val   -- valeur PAR DÉFAUT : si on ne fournit rien, la base met « val » automatiquement
CHECK (cond)  -- règle de VALIDITÉ : la condition doit être vraie (ex. CHECK (prix >= 0) interdit un prix négatif)</pre>

<h3>4. La clé étrangère (FOREIGN KEY)</h3>
<p>Une <strong>clé étrangère</strong> (FOREIGN KEY) est une colonne qui <strong>pointe vers</strong> la clé primaire d'une AUTRE table, pour relier les deux. Exemple : chaque jeu appartient à une catégorie ; on met donc dans JEU une colonne <code>idCategorie</code> qui « pointe » vers la table CATEGORIE. C'est comme une fiche qui note « voir dossier n°2 ». Le SGBD garantit alors qu'on ne peut pas pointer vers un dossier inexistant : c'est l'<strong>intégrité référentielle</strong>.</p>
<pre class="pseudo">CREATE TABLE JEU (                                                  -- fabrique la table JEU
  idJeu        INT PRIMARY KEY,                                     -- clé primaire : identifiant unique du jeu
  titre        VARCHAR(120) NOT NULL,                              -- titre : texte (max 120), obligatoire
  prixLocation DECIMAL(6,2) NOT NULL CHECK (prixLocation >= 0),    -- prix décimal exact, obligatoire, jamais négatif
  idCategorie  INT NOT NULL,                                        -- colonne qui contiendra le n° de catégorie du jeu
  FOREIGN KEY (idCategorie) REFERENCES CATEGORIE(idCategorie)       -- FK : idCategorie doit exister dans CATEGORIE(idCategorie)
);                                                                 -- fin de la définition de la table</pre>

<h3>5. La clé primaire auto-incrémentée</h3>
<p>Numéroter les lignes à la main (1, 2, 3…) est pénible et source d'erreurs. On laisse donc souvent le SGBD <strong>numéroter tout seul</strong> la clé primaire : à chaque nouvelle ligne, il attribue le numéro suivant. On appelle ça l'<strong>auto-incrémentation</strong>. La syntaxe change selon le SGBD : <code>AUTO_INCREMENT</code> (MySQL), <code>IDENTITY</code> (SQL Server), <code>SERIAL</code>/<code>GENERATED</code> (PostgreSQL).</p>
<pre class="pseudo">-- MySQL :
idJeu INT PRIMARY KEY AUTO_INCREMENT   -- clé primaire entière, numérotée automatiquement (1, 2, 3, …)
-- SQL Server :
idJeu INT IDENTITY(1,1) PRIMARY KEY    -- IDENTITY(1,1) = commence à 1, avance de 1 à chaque ligne</pre>
<div class="tip">Pour supprimer une table : <code>DROP TABLE JEU;</code> (attention : cela détruit la table ET toutes ses données, sans confirmation !). Ces commandes de structure (CREATE, DROP, ALTER) forment la famille DDL vue à la leçon 1.</div>`,
  exercises: [
    { type: "qcm", q: "CREATE TABLE sert à…", opts: ["Interroger des données", "Définir une nouvelle table (colonnes, types, contraintes)", "Supprimer des lignes", "Trier"], a: 1, exp: "Définition de structure (DDL)." },
    { type: "qcm", q: "Le type d'un prix exact est…", opts: ["FLOAT", "DECIMAL(p, s)", "VARCHAR", "INT"], a: 1, exp: "DECIMAL est exact, idéal pour l'argent." },
    { type: "qcm", q: "Pour du texte de longueur variable, on choisit…", opts: ["INT", "VARCHAR(n)", "DATE", "BOOLEAN"], a: 1, exp: "VARCHAR jusqu'à n caractères." },
    { type: "qcm", q: "PRIMARY KEY garantit qu'une colonne est…", opts: ["Rapide", "Unique et non nulle", "Facultative", "Un texte"], a: 1, exp: "Identifiant de la ligne." },
    { type: "qcm", q: "NOT NULL signifie…", opts: ["Valeur unique", "Valeur obligatoire", "Valeur par défaut", "Clé primaire"], a: 1, exp: "Interdit les vides." },
    { type: "qcm", q: "UNIQUE sur email garantit…", opts: ["Un email obligatoire", "Pas deux fois le même email", "Un index rapide seulement", "Un email court"], a: 1, exp: "Aucun doublon." },
    { type: "qcm", q: "DEFAULT 0 sur stock…", opts: ["Interdit 0", "Met 0 si la valeur n'est pas fournie", "Rend stock unique", "Supprime la colonne"], a: 1, exp: "Valeur par défaut." },
    { type: "qcm", q: "CHECK (prixLocation >= 0) empêche…", opts: ["Les doublons", "Un prix négatif", "Les valeurs nulles", "Les index"], a: 1, exp: "Contrainte de validité." },
    { type: "qcm", q: "Une FOREIGN KEY sert à…", opts: ["Trier", "Référencer la clé primaire d'une autre table (intégrité)", "Créer un index", "Calculer"], a: 1, exp: "Le lien entre tables." },
    { type: "qcm", q: "Pour l'argent, on évite le type…", opts: ["DECIMAL", "FLOAT (arrondis imprécis)", "INT", "VARCHAR"], a: 1, exp: "DECIMAL exact ; FLOAT arrondit." },
    { type: "vf", q: "AUTO_INCREMENT / IDENTITY laisse le SGBD numéroter automatiquement la clé primaire.", a: true, exp: "Numéro auto pour la PK." },
    { type: "qcm", q: "DROP TABLE JEU; …", opts: ["Vide la table", "Supprime la table ET ses données", "Crée la table", "La renomme"], a: 1, exp: "Attention : destruction complète." },
    { type: "qcm", q: "VARCHAR(120) autorise un titre de…", opts: ["Exactement 120 caractères", "Jusqu'à 120 caractères", "120 lignes", "120 mots"], a: 1, exp: "Longueur maximale variable." },
    { type: "vf", q: "CREATE, ALTER et DROP font partie du DDL.", a: true, exp: "Définition de la structure." },
    { type: "qcm", q: "La clé étrangère idCategorie dans JEU référence…", opts: ["JEU(idJeu)", "CATEGORIE(idCategorie)", "Rien", "Une vue"], a: 1, exp: "La PK de la table cible." }
  ],
  final: {
    title: "Exercice final — Créer la table FOURNISSEUR",
    intro: `<p>On veut la table FOURNISSEUR : un identifiant entier (clé primaire), un nom obligatoire (texte 80), un téléphone (texte 20, facultatif).</p>`,
    questions: [
      { type: "qcm", q: "idFournisseur sera…", opts: ["VARCHAR PRIMARY KEY", "INT PRIMARY KEY", "DATE", "BOOLEAN"], a: 1, exp: "Entier, clé primaire." },
      { type: "qcm", q: "nom (obligatoire, texte 80) s'écrit…", opts: ["nom VARCHAR(80) NOT NULL", "nom INT", "nom TEXT UNIQUE", "nom CHAR"], a: 0, exp: "VARCHAR(80) + NOT NULL." },
      { type: "qcm", q: "telephone facultatif signifie…", opts: ["NOT NULL", "Pas de NOT NULL (les vides sont permis)", "PRIMARY KEY", "CHECK"], a: 1, exp: "Sans NOT NULL, la valeur peut manquer." },
      { type: "qcm", q: "Quelle commande crée la table ?", opts: ["MAKE TABLE", "CREATE TABLE FOURNISSEUR (...)", "NEW TABLE", "ADD TABLE"], a: 1, exp: "CREATE TABLE." },
      { type: "vf", q: "Cette table pourra ensuite être référencée par une clé étrangère depuis JEU.", a: true, exp: "idFournisseur (PK) sera la cible d'une FK." }
    ],
    solution: `<pre class="pseudo">CREATE TABLE FOURNISSEUR (          -- fabrique la table FOURNISSEUR
  idFournisseur INT PRIMARY KEY,    -- identifiant entier + clé primaire (unique, non nul)
  nom           VARCHAR(80) NOT NULL, -- nom : texte max 80, obligatoire (NOT NULL)
  telephone     VARCHAR(20)         -- téléphone : texte max 20 ; PAS de NOT NULL donc facultatif
);                                  -- fin de la table ; le ; exécute</pre>
<p>Ta première table est prête. Demain : la remplir avec INSERT.</p>`
  }
};
</script>

    tests: [
      { label: "La table CLIENT a 4 colonnes", query: "SELECT COUNT(*) FROM pragma_table_info('CLIENT')", expect: [[4]] },
      { label: "idClient est la clé primaire", query: "SELECT name FROM pragma_table_info('CLIENT') WHERE pk=1", expect: [['idClient']] },
      { label: "email est déclaré NOT NULL", query: "SELECT [notnull] FROM pragma_table_info('CLIENT') WHERE name='email'", expect: [[1]] }
    ],
    checklist: [
      "As-tu déclaré idClient en PRIMARY KEY ?",
      "email est-il NOT NULL et UNIQUE ?",
      "pointsFidelite a-t-il DEFAULT 0 et un CHECK (>= 0) ?"
    ], title: "Créer la table CLIENT", level: 2,
    statement: "Écris le CREATE TABLE de CLIENT : idClient (entier, clé primaire), nom (texte 80, obligatoire), email (texte 150, obligatoire et unique), pointsFidelite (entier, valeur par défaut 0, jamais négatif).",
    hints: [
      "PRIMARY KEY sur idClient.",
      "email VARCHAR(150) NOT NULL UNIQUE.",
      "pointsFidelite INT NOT NULL DEFAULT 0 CHECK (pointsFidelite >= 0)."
    ],
    solution: "CREATE TABLE CLIENT (\n  idClient       INT PRIMARY KEY,\n  nom            VARCHAR(80)  NOT NULL,\n  email          VARCHAR(150) NOT NULL UNIQUE,\n  pointsFidelite INT NOT NULL DEFAULT 0 CHECK (pointsFidelite >= 0)\n);",
    note: "Chaque contrainte encode une règle métier : NOT NULL (obligatoire), UNIQUE (pas de doublon d'email), DEFAULT (valeur initiale), CHECK (bornes valides). Le SGBD les fait respecter automatiquement." }
  ]
};
