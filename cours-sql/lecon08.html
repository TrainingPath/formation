<script>
var DAY = {
  num: 8,
  title: "Les fonctions d'agrégation",
  subtitle: "Résumer plusieurs lignes en une seule valeur.",
  theory: `
<h3>1. Compter, additionner, moyenner</h3>
<p>Jusqu'ici, SELECT renvoyait une ligne par enregistrement. Mais parfois on veut un <strong>résumé</strong> : « combien de jeux ? », « quel prix moyen ? ». Une <strong>fonction d'agrégation</strong> (« agréger » = regrouper en un tout) prend un ensemble de lignes et le condense en <strong>une seule valeur</strong>. Les cinq principales :</p>
<pre class="pseudo">COUNT(...)   -- COMPTE le nombre de lignes (« combien ? »)
SUM(col)     -- SOMME (additionne) toutes les valeurs de la colonne
AVG(col)     -- MOYENNE (average) des valeurs de la colonne
MIN(col)     -- la plus PETITE valeur (minimum)
MAX(col)     -- la plus GRANDE valeur (maximum)</pre>

<h3>2. COUNT : compter</h3>
<p><code>COUNT</code> compte des lignes. On peut compter tout, compter après un filtre, ou compter seulement les valeurs présentes d'une colonne.</p>
<pre class="pseudo">SELECT COUNT(*) FROM JEU;                          -- COUNT(*) = nombre TOTAL de lignes (tous les jeux)
SELECT COUNT(*) FROM JEU WHERE idCategorie = 1;    -- même comptage, mais seulement sur les lignes filtrées (catégorie 1)
SELECT COUNT(telephone) FROM FOURNISSEUR;          -- COUNT(colonne) = compte seulement les valeurs NON NULL de telephone</pre>
<div class="tip"><code>COUNT(*)</code> compte toutes les lignes ; <code>COUNT(colonne)</code> ne compte que les lignes où cette colonne n'est PAS NULL (les absences ne comptent pas). <code>COUNT(DISTINCT col)</code> compte les valeurs DIFFÉRENTES.</div>

<h3>3. SUM, AVG, MIN, MAX</h3>
<p>Ces quatre fonctions travaillent sur une colonne numérique. On peut en calculer plusieurs d'un coup dans le même SELECT :</p>
<pre class="pseudo">SELECT SUM(stockLocation) AS stock_total,   -- additionne tous les stocks de location, résultat nommé « stock_total »
       AVG(prixLocation)  AS prix_moyen,    -- moyenne de tous les prix de location
       MIN(prixLocation)  AS moins_cher,    -- le plus petit prix de location
       MAX(prixLocation)  AS plus_cher      -- le plus grand prix de location
FROM JEU;                                   -- sur l'ensemble de la table JEU</pre>
<p>Ces fonctions <strong>ignorent</strong> les valeurs <code>NULL</code> : une case vide ne fausse ni la somme, ni la moyenne (elle n'est simplement pas comptée).</p>

<h3>4. Un agrégat = une valeur pour tout le groupe</h3>
<p>Sans <code>GROUP BY</code> (leçon 9), l'agrégat porte sur <strong>toute</strong> la table (ou sur toutes les lignes retenues par WHERE), et produit UNE seule valeur. Conséquence : on ne peut PAS mélanger une colonne « normale » (une valeur par ligne) avec un agrégat (une valeur pour tout) — ce serait comparer un détail et un total.</p>
<pre class="pseudo">-- FAUX : titre a une valeur par ligne, mais COUNT(*) est un total unique (incohérent)
SELECT titre, COUNT(*) FROM JEU;          -- erreur ou résultat trompeur

-- BON : uniquement des agrégats (tout est « global »)
SELECT COUNT(*), AVG(prixLocation) FROM JEU;   -- deux valeurs globales, cohérent
-- BON aussi : accompagner d'un GROUP BY (voir leçon 9)</pre>

<h3>5. Agréger avec un alias et un filtre</h3>
<p>On combine volontiers WHERE (choisir les lignes) et un agrégat (les résumer), avec un alias pour un affichage clair :</p>
<pre class="pseudo">-- prix moyen des seuls jeux de la catégorie 1 :
SELECT AVG(prixLocation) AS prix_moyen_strategie   -- moyenne, joliment nommée
FROM JEU
WHERE idCategorie = 1;                             -- WHERE d'abord : on ne moyenne que la catégorie 1</pre>
<div class="warn">Ne confonds pas <code>COUNT(*)</code> (nombre de lignes) et <code>SUM(col)</code> (somme des valeurs). « Combien de jeux ? » → COUNT ; « Quel stock total ? » → SUM. Deux questions différentes, deux fonctions différentes.</div>`,
  exercises: [
    { type: "qcm", q: "Une fonction d'agrégation…", opts: ["Trie les lignes", "Résume plusieurs lignes en une seule valeur", "Crée une table", "Filtre une ligne"], a: 1, exp: "COUNT, SUM, AVG…" },
    { type: "qcm", q: "Compter le nombre de jeux :", opts: ["SUM(*)", "COUNT(*) FROM JEU", "COUNT() FROM JEU", "COUNT(*) IN JEU"], a: 1, exp: "COUNT(*) compte les lignes." },
    { type: "qcm", q: "COUNT(*) compte…", opts: ["Les colonnes", "Toutes les lignes", "Les valeurs non nulles d'une colonne", "Les valeurs distinctes"], a: 1, exp: "Toutes les lignes du résultat." },
    { type: "qcm", q: "COUNT(telephone) compte…", opts: ["Toutes les lignes", "Seulement les lignes où telephone n'est pas NULL", "Les doublons", "Toutes les valeurs, NULL comprises"], a: 1, exp: "COUNT(col) ignore les NULL." },
    { type: "qcm", q: "La somme des stocks :", opts: ["COUNT(stockLocation)", "SUM(stockLocation)", "AVG(stockLocation)", "MAX(stockLocation)"], a: 1, exp: "SUM additionne." },
    { type: "qcm", q: "Le prix moyen :", opts: ["SUM(prixLocation)", "AVG(prixLocation)", "COUNT(prixLocation)", "MEAN(prixLocation)"], a: 1, exp: "AVG = moyenne." },
    { type: "qcm", q: "Le jeu le plus cher (valeur du prix) :", opts: ["MIN(prixLocation)", "MAX(prixLocation)", "GREATEST(prixLocation)", "SUM(prixLocation)"], a: 1, exp: "MAX = maximum." },
    { type: "qcm", q: "Les agrégats ignorent les valeurs…", opts: ["Positives", "NULL", "Décimales", "Textuelles"], a: 1, exp: "NULL n'entre pas dans le calcul." },
    { type: "qcm", q: "COUNT(DISTINCT idCategorie) donne…", opts: ["Le nombre total de jeux", "Le nombre de catégories DIFFÉRENTES utilisées", "La somme des catégories", "Le nombre de catégories, NULL compris"], a: 1, exp: "DISTINCT compte les valeurs uniques." },
    { type: "qcm", q: "SELECT titre, COUNT(*) FROM JEU (sans GROUP BY) est…", opts: ["Correct", "Incohérent : on mélange une colonne par ligne et un agrégat global", "Correct si on ajoute ORDER BY", "Valide, titre est ignoré"], a: 1, exp: "Il faut regrouper (GROUP BY)." },
    { type: "vf", q: "Sans GROUP BY, un agrégat porte sur toutes les lignes (filtrées par WHERE).", a: true, exp: "Une seule valeur pour l'ensemble." },
    { type: "qcm", q: "« Combien de jeux en catégorie 1 ? » :", opts: ["SELECT SUM(*) FROM JEU", "SELECT COUNT(*) FROM JEU WHERE idCategorie = 1", "SELECT AVG(idCategorie)", "SELECT MAX(idJeu)"], a: 1, exp: "COUNT + WHERE." },
    { type: "qcm", q: "« Quel est le stock total ? » utilise…", opts: ["COUNT", "SUM", "AVG", "MIN"], a: 1, exp: "Somme des stocks." },
    { type: "vf", q: "On peut donner un alias au résultat d'un agrégat (AVG(...) AS prix_moyen).", a: true, exp: "Alias pour l'affichage." },
    { type: "qcm", q: "MIN(prixLocation) renvoie…", opts: ["Le prix le plus élevé", "Le prix le plus bas", "La moyenne", "Le nombre de jeux"], a: 1, exp: "MIN = minimum." }
  ],
  final: {
    title: "Exercice final — Tableau de bord du catalogue",
    intro: `<p>Table JEU(idJeu, titre, prixAchat, prixLocation, stockVente, stockLocation, idCategorie). On veut des indicateurs globaux.</p>`,
    questions: [
      { type: "qcm", q: "Le nombre total de jeux :", opts: ["SUM(idJeu)", "COUNT(*)", "AVG(idJeu)", "MAX(idJeu)"], a: 1, exp: "COUNT(*) compte les lignes." },
      { type: "qcm", q: "Le prix de location moyen :", opts: ["AVG(prixLocation)", "SUM(prixLocation)", "COUNT(prixLocation)", "MIN(prixLocation)"], a: 0, exp: "Moyenne des prix." },
      { type: "qcm", q: "Le stock de vente total :", opts: ["COUNT(stockVente)", "SUM(stockVente)", "MAX(stockVente)", "AVG(stockVente)"], a: 1, exp: "Somme des stocks de vente." },
      { type: "qcm", q: "Le prix d'achat le plus élevé :", opts: ["MIN(prixAchat)", "MAX(prixAchat)", "SUM(prixAchat)", "COUNT(prixAchat)"], a: 1, exp: "MAX." },
      { type: "vf", q: "On peut calculer plusieurs agrégats dans un même SELECT.", a: true, exp: "COUNT, AVG, SUM, MAX ensemble." }
    ],
    solution: `<pre class="pseudo">SELECT COUNT(*)            AS nb_jeux,            -- nombre total de jeux
       AVG(prixLocation)  AS prix_loc_moyen,     -- prix de location moyen
       SUM(stockVente)    AS stock_vente_total,  -- somme des stocks de vente
       MAX(prixAchat)     AS achat_max,          -- prix d'achat le plus élevé
       MIN(prixLocation)  AS loc_min             -- prix de location le plus bas
FROM JEU;                                        -- le tout sur toute la table JEU</pre>
<p>Tu résumes une table en indicateurs. Demain : ces chiffres CATÉGORIE PAR CATÉGORIE, avec GROUP BY.</p>`
  }
};
</script>

  items: [
  { id: "sql-l8",
    lang: "sql",
    schema: `CREATE TABLE JEU (idJeu INT, titre TEXT, prixLocation REAL, stockLocation INT, idCategorie INT);
INSERT INTO JEU VALUES (1,'Catan',5.0,2,1),(2,'Azul',3.0,4,1),(3,'Dixit',4.0,3,1),(4,'UNO',9.0,5,2);`,
    tests: [
      { label: "Indicateurs de la catégorie 1 (nb, moyenne, stock total)", expect: [[3,4.0,9]] }

      "As-tu filtré la catégorie 1 avec WHERE avant d'agréger ?",
      "As-tu utilisé COUNT(*), AVG(...) et SUM(...) ?",
      "Chaque résultat a-t-il un alias clair (AS) ?"
    ], title: "Indicateurs d'une catégorie", level: 2,
    statement: "À partir de JEU(idJeu, titre, prixLocation, stockLocation, idCategorie), écris une requête qui donne, pour la catégorie 1 uniquement : le nombre de jeux, le prix de location moyen, et le stock de location total. Donne un alias clair à chaque résultat.",
    hints: [
      "Filtre : WHERE idCategorie = 1.",
      "COUNT(*), AVG(prixLocation), SUM(stockLocation).",
      "Chaque agrégat reçoit un alias AS."
    ],

    note: "WHERE filtre d'abord les lignes de la catégorie 1, puis les agrégats résument ce sous-ensemble. Chaque fonction (COUNT, AVG, SUM) répond à une question métier différente." }
  ]
};
