<script>
var DAY = {
  num: 20,
  title: "Projet guidé : interroger la Ludothèque",
  subtitle: "Assembler tout le SQL pour répondre à des questions métier.",
  theory: `
<h3>1. Le schéma de travail</h3>
<p>Voici le <strong>schéma</strong> complet (la liste des tables et de leurs colonnes) qui sert de terrain de jeu. Chaque table est écrite « NOM(colonne1, colonne2, …) ». Rappel : la première colonne de chaque table est généralement sa clé primaire, et les colonnes en « id… » qui pointent vers une autre table sont des clés étrangères.</p>
<pre class="pseudo">CATEGORIE(idCategorie, libelle)                                    -- les catégories de jeux
FOURNISSEUR(idFournisseur, nom, telephone)                         -- les fournisseurs
JEU(idJeu, titre, prixAchat, prixLocation, stockVente, stockLocation,  -- les jeux du catalogue
    idCategorie, idFournisseur)                                    -- (idCategorie, idFournisseur = clés étrangères)
CLIENT(idClient, nom, email, pointsFidelite)                       -- les clients
LOUER(idClient, idJeu, dateDebut, nbJours, montant)                -- chaque location (table d'association)
ACHETER(idClient, idJeu, dateAchat, prix)                          -- chaque achat (table d'association)</pre>

<h3>2. Chiffre d'affaires</h3>
<p>Le <strong>chiffre d'affaires</strong> (CA), c'est la somme d'argent encaissé. On l'obtient avec SUM.</p>
<pre class="pseudo">-- CA des locations : on additionne tous les montants de location
SELECT SUM(montant) AS ca_locations FROM LOUER;   -- SUM = total des montants ; alias ca_locations

-- CA total (locations + achats) : on additionne deux totaux
SELECT
  (SELECT COALESCE(SUM(montant),0) FROM LOUER) +   -- total des locations (0 si la table est vide)
  (SELECT COALESCE(SUM(prix),0)    FROM ACHETER) AS ca_total;  -- + total des achats, le tout nommé ca_total</pre>
<p><code>COALESCE(x, 0)</code> renvoie <code>x</code>, sauf si <code>x</code> est NULL auquel cas il renvoie 0. Utile ici : SUM sur une table vide donne NULL, et NULL + quelque chose = NULL ; COALESCE évite ce piège.</p>

<h3>3. Le top des jeux les plus loués</h3>
<pre class="pseudo">SELECT j.titre, COUNT(*) AS nb_locations   -- le titre + le nombre de fois qu'il a été loué
FROM LOUER l                               -- chaque ligne = une location
JOIN JEU j ON j.idJeu = l.idJeu            -- jointure pour récupérer le TITRE (LOUER n'a que l'id)
GROUP BY j.titre                           -- un compteur par jeu
ORDER BY nb_locations DESC                 -- du plus loué au moins loué
LIMIT 3;                                   -- on ne garde que le podium (3 premiers)</pre>

<h3>4. Les clients fidèles</h3>
<pre class="pseudo">-- clients ayant loué PLUS de 2 fois :
SELECT c.nom, COUNT(*) AS nb_locations   -- le nom du client + son nombre de locations
FROM LOUER l
JOIN CLIENT c ON c.idClient = l.idClient  -- jointure pour récupérer le NOM du client
GROUP BY c.nom                            -- un compteur par client
HAVING COUNT(*) &gt; 2                       -- HAVING = ne garde que les clients à plus de 2 locations
ORDER BY nb_locations DESC;               -- du plus fidèle au moins fidèle</pre>

<h3>5. Le catalogue enrichi</h3>
<pre class="pseudo">-- chaque jeu affiché avec sa catégorie et son fournisseur :
SELECT j.titre, c.libelle AS categorie, f.nom AS fournisseur,   -- titre + libellé catégorie + nom fournisseur
       j.prixLocation, j.stockLocation
FROM JEU j
JOIN CATEGORIE c   ON c.idCategorie = j.idCategorie             -- INNER JOIN : chaque jeu A une catégorie
LEFT JOIN FOURNISSEUR f ON f.idFournisseur = j.idFournisseur    -- LEFT JOIN : le fournisseur peut MANQUER (garde le jeu quand même)
WHERE j.stockLocation &gt; 0                                       -- seulement les jeux disponibles
ORDER BY c.libelle, j.titre;                                    -- tri par catégorie puis par titre</pre>
<div class="tip">On combine ici TOUT le cours : jointures, LEFT JOIN (le fournisseur peut être absent), agrégats, GROUP BY, HAVING, tri, limite, sous-requêtes. C'est la boîte à outils complète pour répondre à n'importe quelle question métier.</div>`,
  exercises: [
    { type: "qcm", q: "Le CA des locations s'obtient avec…", opts: ["COUNT(montant)", "SUM(montant) FROM LOUER", "AVG(montant)", "MAX(montant)"], a: 1, exp: "Somme des montants." },
    { type: "qcm", q: "COALESCE(SUM(montant), 0) sert à…", opts: ["Trier", "Remplacer un NULL par 0 (table vide)", "Compter", "Filtrer"], a: 1, exp: "Éviter un résultat NULL." },
    { type: "qcm", q: "Le top 3 des jeux loués combine…", opts: ["Seulement COUNT", "JOIN + GROUP BY + COUNT + ORDER BY DESC + LIMIT", "Un index", "Une vue seule"], a: 1, exp: "Plusieurs briques ensemble." },
    { type: "qcm", q: "Pour afficher le titre (pas l'idJeu) dans le top, il faut…", opts: ["Un DISTINCT", "Joindre JEU", "Un CHECK", "Un index"], a: 1, exp: "Le titre est dans JEU." },
    { type: "qcm", q: "« Clients ayant loué plus de 2 fois » utilise…", opts: ["WHERE COUNT(*) > 2", "GROUP BY + HAVING COUNT(*) > 2", "ORDER BY COUNT", "DISTINCT"], a: 1, exp: "HAVING filtre les groupes." },
    { type: "qcm", q: "Pour relier un jeu à son fournisseur qui peut être absent…", opts: ["INNER JOIN", "LEFT JOIN FOURNISSEUR", "RIGHT JOIN CLIENT", "UNION"], a: 1, exp: "LEFT JOIN garde le jeu même sans fournisseur." },
    { type: "qcm", q: "Le CA total (locations + achats) se calcule avec…", opts: ["Un seul SUM", "L'addition de deux sous-requêtes SUM", "Un COUNT", "Un LEFT JOIN"], a: 1, exp: "Deux SUM additionnés." },
    { type: "qcm", q: "GROUP BY j.titre dans le top regroupe…", opts: ["Par client", "Par jeu (pour compter ses locations)", "Par date", "Par catégorie"], a: 1, exp: "Un comptage par jeu." },
    { type: "qcm", q: "ORDER BY nb_locations DESC LIMIT 3 donne…", opts: ["Les 3 moins loués", "Les 3 plus loués", "Tous les jeux", "3 clients"], a: 1, exp: "Tri décroissant + limite." },
    { type: "qcm", q: "Filtrer le catalogue enrichi sur les jeux disponibles :", opts: ["HAVING stockLocation > 0", "WHERE j.stockLocation > 0", "ORDER BY stock", "DISTINCT stock"], a: 1, exp: "WHERE sur les lignes." },
    { type: "vf", q: "Une même requête peut combiner jointures, agrégats, GROUP BY, HAVING et tri.", a: true, exp: "C'est le cas des requêtes métier." },
    { type: "qcm", q: "Pour le prix moyen de location par catégorie :", opts: ["SUM(prixLocation)", "GROUP BY idCategorie + AVG(prixLocation)", "COUNT(prixLocation)", "MAX(prixLocation)"], a: 1, exp: "Un AVG par groupe." },
    { type: "qcm", q: "COUNT(*) dans LOUER GROUP BY idJeu compte…", opts: ["Les jeux", "Le nombre de locations par jeu", "Les clients", "Les catégories"], a: 1, exp: "Locations par jeu." },
    { type: "vf", q: "LEFT JOIN FOURNISSEUR évite de perdre les jeux sans fournisseur renseigné.", a: true, exp: "Le jeu reste, fournisseur = NULL." },
    { type: "qcm", q: "La panoplie « jointure + agrégat + tri » sert à…", opts: ["Créer des tables", "Répondre à des questions métier (CA, tops, moyennes)", "Indexer", "Chiffrer"], a: 1, exp: "Analyse des données." }
  ],
  final: {
    title: "Exercice final — Le tableau de bord",
    intro: `<p>On veut, en une requête, le chiffre d'affaires des locations PAR catégorie, du plus rentable au moins rentable.</p>`,
    questions: [
      { type: "qcm", q: "Quelles tables joindre ?", opts: ["Seulement LOUER", "LOUER, JEU (pour la catégorie) et CATEGORIE (pour le libellé)", "Seulement CLIENT", "Aucune"], a: 1, exp: "Le montant est dans LOUER, la catégorie via JEU." },
      { type: "qcm", q: "L'agrégat du CA par catégorie :", opts: ["COUNT(montant)", "SUM(l.montant)", "AVG(montant)", "MAX(montant)"], a: 1, exp: "Somme des montants." },
      { type: "qcm", q: "On regroupe par…", opts: ["idJeu", "la catégorie (c.libelle)", "idClient", "la date"], a: 1, exp: "CA par catégorie." },
      { type: "qcm", q: "Trier du plus rentable au moins :", opts: ["ORDER BY ca", "ORDER BY ca DESC", "GROUP BY ca", "HAVING ca"], a: 1, exp: "Tri décroissant du CA." },
      { type: "vf", q: "Cette requête combine 2 jointures, un SUM, un GROUP BY et un ORDER BY.", a: true, exp: "Une vraie requête d'analyse." }
    ],
    solution: `<pre class="pseudo">SELECT c.libelle,
       SUM(l.montant) AS ca_categorie   -- CA = somme des montants de location du groupe
FROM LOUER l                            -- les montants sont dans LOUER
JOIN JEU j       ON j.idJeu = l.idJeu           -- 1re jointure : relier la location à son jeu
JOIN CATEGORIE c ON c.idCategorie = j.idCategorie  -- 2e jointure : du jeu vers sa catégorie
GROUP BY c.libelle                      -- un total par catégorie
ORDER BY ca_categorie DESC;             -- du plus rentable au moins rentable</pre>
<p>Tu réponds à de vraies questions métier. Demain : l'examen final SQL.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta requête métier…",
  items: [
  { id: "sql-l20",
    lang: "sql",
    schema: `CREATE TABLE CLIENT (idClient INT, nom TEXT);
INSERT INTO CLIENT VALUES (1,'Alice'),(2,'Bob'),(3,'Chloe');
CREATE TABLE LOUER (idClient INT, idJeu INT, montant REAL);
INSERT INTO LOUER VALUES (1,10,15.0),(1,11,10.0),(2,12,8.0),(3,13,12.0),(3,14,14.0);`,
    tests: [
      { label: "Clients ayant dépensé plus de 20 en locations, triés DESC", expect: [['Chloe',26.0],['Alice',25.0]] }
    ],
    checklist: [
      "As-tu joint LOUER et CLIENT sur idClient ?",
      "As-tu agrégé avec SUM(l.montant) et GROUP BY c.nom ?",
      "Le filtre est-il HAVING SUM(...) > 20 (pas WHERE), puis ORDER BY DESC ?"
    ], title: "Le meilleur client", level: 4,
    statement: "À partir de LOUER(idClient, idJeu, montant), ACHETER(idClient, prix) et CLIENT(idClient, nom), écris une requête qui affiche, pour chaque client, le total dépensé en locations, trié du plus gros au plus petit dépensier, en ne gardant que ceux ayant dépensé plus de 20. (Concentre-toi sur les locations.)",
    hints: [
      "JOIN LOUER et CLIENT sur idClient.",
      "SUM(l.montant) par client, GROUP BY c.nom.",
      "HAVING SUM(l.montant) > 20, puis ORDER BY DESC."
    ],
    solution: "SELECT c.nom, SUM(l.montant) AS total_locations\nFROM LOUER l\nJOIN CLIENT c ON c.idClient = l.idClient\nGROUP BY c.nom\nHAVING SUM(l.montant) > 20\nORDER BY total_locations DESC;",
    note: "On joint LOUER (les montants) à CLIENT (les noms), on agrège par client (SUM + GROUP BY), on filtre les gros clients (HAVING sur l'agrégat) et on trie (ORDER BY DESC). C'est le schéma type d'une requête d'analyse." }
  ]
};
</script>
