<script>
var DAY = {
  num: 1,
  title: "SQL et les bases de données relationnelles",
  subtitle: "Tables, lignes, colonnes — et le langage pour les interroger.",
  theory: `
<h3>1. Qu'est-ce qu'une base de données ?</h3>
<p>Une <strong>base de données</strong> est un ensemble d'informations rangées de façon très organisée, pour qu'un ordinateur puisse les retrouver rapidement. Imagine un immense classeur parfaitement trié : au lieu de feuilles en vrac, tout est classé dans des tiroirs étiquetés. Une base de données <strong>relationnelle</strong> (le type le plus répandu) range ces informations dans des <strong>tables</strong>. Une <strong>table</strong>, c'est comme une feuille d'un tableur (Excel, par exemple) : un quadrillage. Le mot « relationnelle » vient de <em>relation</em>, qui est simplement l'autre nom savant d'une table — ne t'inquiète pas, une relation ici n'a rien à voir avec les sentiments : c'est juste un tableau.</p>
<p>Dans ce quadrillage, chaque <strong>colonne</strong> représente un <strong>type d'information</strong> (par exemple « titre », « prix ») ; on l'appelle aussi un <strong>champ</strong> ou un <strong>attribut</strong>. Chaque <strong>ligne</strong> représente une <strong>fiche complète</strong> (par exemple UN jeu précis, avec son titre, son prix, etc.) ; on l'appelle aussi un <strong>enregistrement</strong>. Voici une table qui liste des jeux de société :</p>
<pre class="pseudo">Table JEU                                          -- une table nommée JEU (comme une feuille de tableur intitulée « JEU »)
  idJeu | titre  | prixLocation | stockLocation     -- la ligne d'en-tête : les 4 colonnes (les champs) de la table
  ------+--------+--------------+--------------      -- simple trait de séparation entre l'en-tête et les données (décoratif)
    1   | Catan  |     5.00     |      2             -- 1re ligne (un enregistrement) : le jeu « Catan », loué 5.00, stock 2
    2   | Azul   |     4.00     |      3             -- 2e ligne (un enregistrement) : le jeu « Azul », loué 4.00, stock 3</pre>
<p>Cette table a donc 4 colonnes (idJeu, titre, prixLocation, stockLocation) et 2 lignes (Catan, Azul). C'est exactement le MLD (modèle logique des données) conçu avec la méthode Merise, mais devenu réel et stocké dans l'ordinateur.</p>

<h3>2. Le SGBD : le logiciel qui gère tout</h3>
<p>Un <strong>SGBD</strong> (Système de Gestion de Base de Données) est le <strong>logiciel</strong> qui stocke réellement les tables sur le disque et qui exécute tes ordres. C'est un peu le « bibliothécaire » : toi tu lui demandes « donne-moi la liste des jeux à moins de 5 € », lui va chercher et te ramène le résultat. Tu ne touches jamais directement aux fichiers : tu passes toujours par lui. Les SGBD les plus connus sont <strong>SQLite</strong>, <strong>MySQL</strong>/MariaDB, <strong>PostgreSQL</strong>, <strong>SQL Server</strong>, Oracle… Ils comprennent tous le même langage, <strong>SQL</strong>, avec de petites variantes de dialecte (comme le français de France et le français du Québec).</p>

<h3>3. SQL : un langage, plusieurs familles de commandes</h3>
<p><strong>SQL</strong> se prononce « esse-cu-elle » (ou « siquel ») et signifie <em>Structured Query Language</em>, c'est-à-dire « langage de requêtes structuré ». Une <strong>requête</strong> est simplement une question ou un ordre qu'on envoie au SGBD. Les commandes SQL se rangent en grandes <strong>familles</strong>, selon ce qu'elles font :</p>
<pre class="pseudo">DDL (Data Definition)   : CREATE, ALTER, DROP     -- DDL = créer/modifier la STRUCTURE (fabriquer ou détruire les tables)
DML (Data Manipulation) : INSERT, UPDATE, DELETE  -- DML = ajouter, changer ou supprimer les DONNÉES à l'intérieur des tables
DQL (Data Query)        : SELECT                   -- DQL = INTERROGER (lire) les données sans jamais les modifier
TCL (Transaction)       : COMMIT, ROLLBACK         -- TCL = valider (COMMIT) ou annuler (ROLLBACK) un lot de modifications
DCL (Data Control)      : GRANT, REVOKE            -- DCL = gérer les DROITS d'accès (qui a le droit de faire quoi)</pre>
<p><strong>SQL</strong> est un langage <em>déclaratif</em> : on décrit CE QU'ON VEUT obtenir, pas COMMENT l'obtenir. Tu dis « je veux les titres des jeux » et le SGBD se débrouille tout seul pour aller les chercher efficacement. C'est le contraire d'un langage <em>impératif</em> (comme la plupart des langages de programmation), où il faut détailler chaque étape.</p>

<h3>4. La première requête : SELECT</h3>
<p>La commande la plus utilisée est <code>SELECT</code> (« sélectionner »). Elle <strong>lit</strong> des données sans jamais les abîmer : elle regarde, elle ne touche pas. Une requête SELECT de base se compose de deux morceaux : <code>SELECT</code> suivi des colonnes voulues, puis <code>FROM</code> suivi de la table où aller les chercher.</p>
<pre class="pseudo">SELECT titre, prixLocation   -- SELECT = « affiche-moi » ; ici les 2 colonnes voulues (séparées par une virgule)
FROM JEU;                     -- FROM = « depuis la table » ; JEU est la table source ; le ; termine l'ordre</pre>
<p>L'étoile <code>*</code> est un raccourci qui veut dire « toutes les colonnes » : <code>SELECT * FROM JEU;</code> affiche la table entière. Chaque commande SQL se termine par un point-virgule <code>;</code> — c'est le point final de la phrase, il dit au SGBD « j'ai fini, tu peux exécuter ».</p>
<div class="tip">Convention : on écrit les mots-clés SQL en MAJUSCULES (SELECT, FROM) et les noms de tables/colonnes tels qu'ils ont été définis. SQL n'est PAS sensible à la casse des mots-clés (<code>select</code> = <code>SELECT</code>), mais cette convention rend les requêtes beaucoup plus lisibles.</div>

<h3>5. Ce qu'on va apprendre</h3>
<p>Dans les prochaines leçons : créer des tables (CREATE), les remplir (INSERT), et surtout les <strong>interroger</strong> de mille façons — filtrer (WHERE), trier (ORDER BY), compter et additionner (COUNT, SUM), relier plusieurs tables entre elles (JOIN), et bien plus. Le fil rouge de tout le cours sera la base d'une <strong>Ludothèque</strong> (un service de location de jeux), de sa création jusqu'à de vraies requêtes utiles au quotidien.</p>`,
  exercises: [
    { type: "qcm", q: "Une base de données relationnelle range l'information dans…", opts: ["Des fichiers texte", "Des tables (colonnes et lignes)", "Des documents JSON", "Des feuilles de calcul"], a: 1, exp: "Tables = relations : colonnes + lignes." },
    { type: "qcm", q: "Dans une table, une COLONNE représente…", opts: ["Un enregistrement", "Un champ (ex. titre, prix)", "Une base entière", "Un index"], a: 1, exp: "La colonne = un attribut/champ." },
    { type: "qcm", q: "Dans une table, une LIGNE représente…", opts: ["Un champ", "Un enregistrement (ex. un jeu précis)", "Une colonne", "Une requête"], a: 1, exp: "La ligne = un enregistrement." },
    { type: "qcm", q: "Un SGBD est…", opts: ["Un langage", "Le logiciel qui gère la base et exécute les requêtes", "Une table", "Un fichier"], a: 1, exp: "MySQL, PostgreSQL, SQL Server…" },
    { type: "qcm", q: "SQL signifie…", opts: ["Simple Query Language", "Structured Query Language", "System Quick Lookup", "Standard Question List"], a: 1, exp: "Langage de requêtes structuré." },
    { type: "qcm", q: "SELECT appartient à la famille…", opts: ["DDL", "DQL (interrogation)", "TCL", "DCL"], a: 1, exp: "SELECT interroge les données." },
    { type: "qcm", q: "CREATE, ALTER, DROP appartiennent au…", opts: ["DML", "DDL (définition des tables)", "DQL", "TCL"], a: 1, exp: "Définition de la structure." },
    { type: "qcm", q: "INSERT, UPDATE, DELETE appartiennent au…", opts: ["DDL", "DML (manipulation des données)", "DQL", "DCL"], a: 1, exp: "Modification des données." },
    { type: "qcm", q: "SQL est un langage…", opts: ["Impératif (on dit comment faire)", "Déclaratif (on décrit ce qu'on veut)", "Graphique", "Compilé"], a: 1, exp: "Le SGBD choisit le « comment »." },
    { type: "qcm", q: "Quelle requête affiche toutes les colonnes de JEU ?", opts: ["GET ALL JEU", "SELECT * FROM JEU;", "SHOW JEU", "READ JEU"], a: 1, exp: "* = toutes les colonnes." },
    { type: "qcm", q: "Chaque commande SQL se termine par…", opts: ["Un point", "Un point-virgule ;", "Une virgule", "Rien"], a: 1, exp: "Le ; marque la fin de l'instruction." },
    { type: "vf", q: "Les mots-clés SQL (SELECT, FROM) ne sont pas sensibles à la casse.", a: true, exp: "select = SELECT ; la majuscule est une convention." },
    { type: "qcm", q: "Dans SELECT titre, prixLocation FROM JEU, « JEU » est…", opts: ["Une colonne", "La table source (après FROM)", "Un alias", "Une base"], a: 1, exp: "FROM indique la table." },
    { type: "qcm", q: "COMMIT et ROLLBACK relèvent du…", opts: ["DDL", "TCL (transactions)", "DQL", "DML"], a: 1, exp: "Valider/annuler une transaction." },
    { type: "vf", q: "Une base relationnelle est la réalisation concrète d'un MLD (modèle logique).", a: true, exp: "Le MLD devient des tables réelles dans un SGBD." }
  ],
  final: {
    title: "Exercice final — Lire une table et une requête",
    intro: `<p>On donne la table CATEGORIE et une requête :</p>
<pre class="pseudo">Table CATEGORIE                        -- une table nommée CATEGORIE (les catégories de jeux)
  idCategorie | libelle                 -- en-tête : 2 colonnes (idCategorie = numéro, libelle = nom lisible)
  ------------+-----------              -- trait de séparation décoratif entre en-tête et données
      1       | Stratégie               -- 1re ligne (enregistrement) : catégorie n°1 = « Stratégie »
      2       | Famille                 -- 2e ligne (enregistrement) : catégorie n°2 = « Famille »

SELECT libelle FROM CATEGORIE;          -- lit la SEULE colonne libelle, pour toutes les lignes de la table</pre>`,
    questions: [
      { type: "qcm", q: "Combien de colonnes a la table CATEGORIE ?", opts: ["Une", "Deux (idCategorie, libelle)", "Trois", "Zéro"], a: 1, exp: "idCategorie et libelle." },
      { type: "qcm", q: "Combien de lignes contient-elle ?", opts: ["Une", "Deux", "Trois", "Aucune"], a: 1, exp: "Deux enregistrements." },
      { type: "qcm", q: "Que renvoie SELECT libelle FROM CATEGORIE; ?", opts: ["Toute la table", "La colonne libelle : « Stratégie » et « Famille »", "Les id", "Une erreur"], a: 1, exp: "On projette la seule colonne libelle." },
      { type: "qcm", q: "Pour afficher AUSSI les id, on écrirait…", opts: ["SELECT * FROM CATEGORIE;", "SELECT id;", "GET CATEGORIE", "SHOW ALL"], a: 0, exp: "* prend toutes les colonnes." },
      { type: "vf", q: "SELECT ne modifie pas les données de la table.", a: true, exp: "SELECT lit seulement." }
    ],
    solution: `<pre class="pseudo">-- toutes les colonnes (l'étoile * = « prends tout »)
SELECT * FROM CATEGORIE;      -- affiche idCategorie ET libelle, pour les 2 lignes

-- une seule colonne (on ne garde que le nom lisible)
SELECT libelle FROM CATEGORIE;  -- affiche uniquement « Stratégie » et « Famille »

-- À retenir :
-- Table = colonnes (champs) + lignes (enregistrements).
-- SELECT interroge SANS modifier ; le ; termine chaque commande.</pre>
<p>Tu connais le vocabulaire. Demain : créer une table avec CREATE TABLE.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ta requête SQL ici…",
  items: [
  { id: "sql-l1",
    lang: "sql",
    schema: `CREATE TABLE CLIENT (idClient INT PRIMARY KEY, nom TEXT, email TEXT, pointsFidelite INT);
INSERT INTO CLIENT VALUES (1,'Alice','alice@mail.com',10),(2,'Bob','bob@mail.com',0),(3,'Chloe','chloe@mail.com',25);`,
    tests: [
      { label: "Toutes les colonnes (SELECT *)", query: "SELECT * FROM CLIENT ORDER BY idClient", expect: [[1,'Alice','alice@mail.com',10],[2,'Bob','bob@mail.com',0],[3,'Chloe','chloe@mail.com',25]] },
      { label: "Seulement nom et email", query: "SELECT nom, email FROM CLIENT ORDER BY idClient", expect: [['Alice','alice@mail.com'],['Bob','bob@mail.com'],['Chloe','chloe@mail.com']] }
    ],
    checklist: [
      "As-tu utilisé SELECT * pour afficher toutes les colonnes ?",
      "Pour la seconde requête, n'as-tu listé que nom et email ?",
      "Chaque requête se termine-t-elle par un point-virgule ?"
    ], title: "Décrire et lire une table", level: 1,
    statement: "Une table CLIENT possède les colonnes idClient, nom, email, pointsFidelite. (1) Combien de champs a-t-elle ? (2) Écris la requête qui affiche toutes les colonnes de tous les clients. (3) Écris celle qui n'affiche que le nom et l'email.",
    hints: [
      "Un « champ » = une colonne.",
      "Toutes les colonnes : SELECT * FROM CLIENT;",
      "Colonnes choisies : SELECT nom, email FROM CLIENT;"
    ],
    solution: "-- (1) 4 champs : idClient, nom, email, pointsFidelite\n\n-- (2) tous les clients, toutes les colonnes\nSELECT * FROM CLIENT;\n\n-- (3) seulement nom et email\nSELECT nom, email FROM CLIENT;",
    note: "SELECT * lit toutes les colonnes ; nommer les colonnes (SELECT nom, email) est plus précis et souvent plus efficace. Le point-virgule termine chaque requête." }
  ]
};
</script>
