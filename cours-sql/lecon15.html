<script>
var DAY = {
  num: 15,
  title: "Contraintes et intégrité référentielle",
  subtitle: "Faire respecter les règles directement par la base.",
  theory: `
<h3>1. Pourquoi des contraintes ?</h3>
<p>Une <strong>contrainte</strong> est une règle que le SGBD fait respecter <strong>automatiquement</strong>, à chaque INSERT ou UPDATE (on l'a croisée à la leçon 2). Son but : garantir la <strong>qualité</strong> des données quoi qu'il arrive — pas de doublon d'identifiant, pas de prix négatif, pas de lien vers une ligne inexistante. C'est un garde-fou : même une erreur de programme sera bloquée par la base.</p>

<h3>2. Les contraintes de colonne</h3>
<p>Rappel des règles qui se déclarent directement à côté d'une colonne :</p>
<pre class="pseudo">PRIMARY KEY   -- clé primaire : identifiant UNIQUE et NON NUL de la ligne
NOT NULL      -- valeur OBLIGATOIRE (interdit la case vide)
UNIQUE        -- valeur UNIQUE dans la colonne (ex. email : pas deux fois le même)
DEFAULT val   -- valeur PAR DÉFAUT si rien n'est fourni
CHECK (cond)  -- règle de VALIDITÉ : la condition doit être vraie (ex. CHECK (stock >= 0))</pre>

<h3>3. La clé étrangère et l'intégrité référentielle</h3>
<p>Une <code>FOREIGN KEY</code> (clé étrangère) impose qu'une valeur EXISTE bien dans la table cible. C'est l'<strong>intégrité référentielle</strong> : impossible de louer un jeu inexistant, ni de supprimer un jeu encore loué (selon la règle choisie). La base refuse toute « référence orpheline » (un lien qui pointe dans le vide).</p>
<pre class="pseudo">CREATE TABLE JEU (
  idJeu       INT PRIMARY KEY,                                  -- identifiant du jeu
  idCategorie INT NOT NULL,                                     -- catégorie obligatoire
  FOREIGN KEY (idCategorie) REFERENCES CATEGORIE(idCategorie)   -- FK : idCategorie DOIT exister dans CATEGORIE
);</pre>

<h3>4. Les règles ON DELETE / ON UPDATE</h3>
<p>Que se passe-t-il si l'on supprime (ou modifie) une ligne qui est référencée ailleurs ? On le décide en ajoutant une règle sur la clé étrangère :</p>
<pre class="pseudo">FOREIGN KEY (idCategorie) REFERENCES CATEGORIE(idCategorie)
  ON DELETE RESTRICT   -- RESTRICT = INTERDIT de supprimer une catégorie encore utilisée par des jeux
  ON DELETE CASCADE    -- CASCADE  = supprime EN CHAÎNE les jeux de la catégorie supprimée
  ON DELETE SET NULL   -- SET NULL = met idCategorie à NULL dans les jeux concernés (lien effacé)</pre>

<h3>5. Contrainte de table et clé composite</h3>
<p>Certaines contraintes portent sur PLUSIEURS colonnes à la fois : c'est le cas d'une clé primaire <strong>composite</strong> (formée de plusieurs colonnes), typique des tables d'association. On les déclare alors au niveau de la table (après les colonnes), et non à côté d'une seule colonne.</p>
<pre class="pseudo">CREATE TABLE LOUER (
  idClient  INT,
  idJeu     INT,
  dateDebut DATE,
  nbJours   INT,
  PRIMARY KEY (idClient, idJeu, dateDebut),         -- clé COMPOSITE : c'est le TRIO qui identifie une location
  FOREIGN KEY (idClient) REFERENCES CLIENT(idClient), -- idClient doit exister dans CLIENT
  FOREIGN KEY (idJeu)    REFERENCES JEU(idJeu)        -- idJeu doit exister dans JEU
);</pre>
<div class="tip">Nommer ses contraintes (<code>CONSTRAINT fk_jeu_cat FOREIGN KEY ...</code>) rend les messages d'erreur plus clairs et facilite leur suppression future (<code>ALTER TABLE ... DROP CONSTRAINT fk_jeu_cat</code>).</div>`,
  exercises: [
    { type: "qcm", q: "Une contrainte est…", opts: ["Un index", "Une règle que le SGBD fait respecter automatiquement", "Une requête", "Une vue"], a: 1, exp: "Garantie de qualité des données." },
    { type: "qcm", q: "PRIMARY KEY garantit…", opts: ["La rapidité", "Un identifiant unique et non nul par ligne", "Une valeur par défaut", "Un texte"], a: 1, exp: "Unicité + non nul." },
    { type: "qcm", q: "UNIQUE empêche…", opts: ["Les valeurs nulles", "Les doublons dans la colonne", "Les index", "Les jointures"], a: 1, exp: "Pas deux fois la même valeur." },
    { type: "qcm", q: "CHECK (stock >= 0) empêche…", opts: ["Un stock nul", "Un stock négatif", "Un doublon", "Une jointure"], a: 1, exp: "Contrainte de domaine." },
    { type: "qcm", q: "FOREIGN KEY impose…", opts: ["Un tri", "Qu'une valeur existe dans la table cible (intégrité référentielle)", "Un index", "Un calcul"], a: 1, exp: "Pas de référence orpheline." },
    { type: "qcm", q: "ON DELETE RESTRICT…", opts: ["Supprime en cascade", "Interdit de supprimer une ligne encore référencée", "Met à NULL", "Ne fait rien"], a: 1, exp: "Protection des liens." },
    { type: "qcm", q: "ON DELETE CASCADE…", opts: ["Interdit", "Supprime aussi les lignes qui référencent", "Met à NULL", "Duplique"], a: 1, exp: "Propagation de la suppression." },
    { type: "qcm", q: "ON DELETE SET NULL…", opts: ["Supprime les lignes liées", "Met la clé étrangère à NULL dans les lignes liées", "Interdit", "Recopie"], a: 1, exp: "Le lien devient vide." },
    { type: "qcm", q: "La clé primaire d'une table d'association (LOUER) est souvent…", opts: ["Une seule colonne", "Composite (plusieurs colonnes)", "Absente", "Un index seul"], a: 1, exp: "(idClient, idJeu, dateDebut)." },
    { type: "qcm", q: "Une contrainte sur plusieurs colonnes se déclare…", opts: ["Sur chaque colonne", "Au niveau de la table", "Dans un index", "Dans une vue"], a: 1, exp: "Contrainte de table." },
    { type: "vf", q: "L'intégrité référentielle empêche de référencer une ligne inexistante.", a: true, exp: "La FK doit cibler une PK existante." },
    { type: "qcm", q: "Nommer une contrainte (CONSTRAINT fk_...) facilite…", opts: ["Le tri", "Les messages d'erreur et sa suppression ultérieure", "L'insertion", "Le calcul"], a: 1, exp: "Gestion plus claire." },
    { type: "qcm", q: "DEFAULT sert à…", opts: ["Interdire une valeur", "Fournir une valeur par défaut si non précisée", "Créer une clé", "Trier"], a: 1, exp: "Valeur initiale automatique." },
    { type: "vf", q: "Les contraintes sont vérifiées à chaque INSERT et UPDATE.", a: true, exp: "Le SGBD les applique en continu." },
    { type: "qcm", q: "Insérer une location avec un idJeu inexistant, avec une FK…", opts: ["Réussit", "Échoue (violation de clé étrangère)", "Crée le jeu", "Met NULL"], a: 1, exp: "La cible doit exister." }
  ],
  final: {
    title: "Exercice final — Sécuriser la table LOUER",
    intro: `<p>On crée la table d'association LOUER reliant CLIENT et JEU, avec la date et la durée.</p>`,
    questions: [
      { type: "qcm", q: "La clé primaire de LOUER (couple répétable avec date) est…", opts: ["idClient seul", "(idClient, idJeu, dateDebut)", "dateDebut", "idJeu seul"], a: 1, exp: "Clé composite avec la date." },
      { type: "qcm", q: "idClient doit être…", opts: ["Une simple colonne", "Une clé étrangère vers CLIENT", "Un CHECK", "Un index seul"], a: 1, exp: "FK vers CLIENT." },
      { type: "qcm", q: "Pour empêcher un nombre de jours négatif :", opts: ["UNIQUE (nbJours)", "CHECK (nbJours > 0)", "DEFAULT 0", "PRIMARY KEY"], a: 1, exp: "Contrainte de validité." },
      { type: "qcm", q: "Empêcher de supprimer un jeu encore loué :", opts: ["ON DELETE CASCADE", "ON DELETE RESTRICT sur la FK vers JEU", "ON DELETE SET NULL", "Rien"], a: 1, exp: "RESTRICT protège les locations." },
      { type: "vf", q: "Ces contraintes viennent directement du MLD Merise (clés, cardinalités).", a: true, exp: "Le MLD dicte PK, FK et règles." }
    ],
    solution: `<pre class="pseudo">CREATE TABLE LOUER (
  idClient  INT,
  idJeu     INT,
  dateDebut DATE,
  nbJours   INT NOT NULL CHECK (nbJours &gt; 0),        -- durée obligatoire et strictement positive
  montant   DECIMAL(7,2) NOT NULL,                   -- montant obligatoire
  PRIMARY KEY (idClient, idJeu, dateDebut),          -- clé composite : le trio identifie la location
  FOREIGN KEY (idClient) REFERENCES CLIENT(idClient),         -- idClient doit exister dans CLIENT
  FOREIGN KEY (idJeu)    REFERENCES JEU(idJeu) ON DELETE RESTRICT  -- interdit de supprimer un jeu encore loué
);</pre>
<p>Ta base fait respecter ses règles. Demain : faire évoluer le schéma avec ALTER TABLE.</p>`
  }
};
</script>
