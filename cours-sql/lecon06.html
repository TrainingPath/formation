var DAY = {
  num: 6,
  title: "Trier et limiter : ORDER BY, LIMIT",
  subtitle: "Classer les résultats et n'en garder qu'une partie.",
  theory: `
<h3>1. Trier avec ORDER BY</h3>
<p>Par défaut, un SELECT renvoie les lignes dans un ordre quelconque (celui qui arrange le SGBD). Pour les <strong>classer</strong> (du moins cher au plus cher, de A à Z…), on utilise <code>ORDER BY</code> (« trier par »). On indique la ou les colonnes qui servent de critère de tri. Cette clause se place à la toute fin de la requête.</p>
<pre class="pseudo">SELECT titre, prixLocation
FROM JEU
ORDER BY prixLocation;   -- ORDER BY = trie le résultat selon prixLocation ; par défaut du plus petit au plus grand</pre>

<h3>2. Croissant ou décroissant : ASC / DESC</h3>
<p>Deux mots-clés précisent le sens du tri : <code>ASC</code> (ascending = croissant, du plus petit au plus grand) et <code>DESC</code> (descending = décroissant, du plus grand au plus petit). Sans précision, c'est ASC.</p>
<pre class="pseudo">ORDER BY prixLocation ASC    -- ASC = croissant : du moins cher au plus cher (c'est le comportement par défaut)
ORDER BY prixLocation DESC   -- DESC = décroissant : du plus cher au moins cher</pre>

<h3>3. Trier sur plusieurs colonnes</h3>
<p>On peut donner plusieurs critères, séparés par des virgules. Le premier prime ; le second ne sert qu'à <strong>départager les ex æquo</strong> du premier (comme un classement sportif : à points égaux, on compare autre chose).</p>
<pre class="pseudo">-- d'abord par catégorie, puis (à catégorie égale) par prix décroissant :
SELECT titre, idCategorie, prixLocation
FROM JEU
ORDER BY idCategorie ASC, prixLocation DESC;   -- critère 1 = idCategorie croissant ; critère 2 (départage) = prix décroissant</pre>

<h3>4. Limiter le nombre de lignes</h3>
<p>Pour n'obtenir que les premières lignes (un « top 3 », par exemple), on <strong>limite</strong> le nombre de lignes renvoyées. La syntaxe dépend du SGBD :</p>
<pre class="pseudo">-- MySQL / PostgreSQL / SQLite :
SELECT titre FROM JEU ORDER BY prixLocation DESC LIMIT 3;   -- LIMIT 3 = garde seulement les 3 premières lignes du tri

-- SQL Server :
SELECT TOP 3 titre FROM JEU ORDER BY prixLocation DESC;     -- TOP 3 = même idée, mais placé juste après SELECT</pre>
<div class="tip">Un « top N » n'a de sens qu'AVEC un <code>ORDER BY</code> : d'abord on trie, ensuite on garde les N premières. Sans tri, « les 3 premières » ne veulent rien dire de fiable (le SGBD pourrait renvoyer n'importe lesquelles).</div>

<h3>5. Sauter des lignes : OFFSET (pagination)</h3>
<p>La <strong>pagination</strong>, c'est afficher les résultats page par page (page 1, page 2…). Pour cela, on SAUTE un certain nombre de lignes avec <code>OFFSET</code> (« décalage »), puis on en prend un paquet avec LIMIT.</p>
<pre class="pseudo">-- page 2 : sauter les 10 premières lignes, puis en prendre 10 :
SELECT titre FROM JEU
ORDER BY titre
LIMIT 10 OFFSET 10;   -- OFFSET 10 = ignore les 10 premières ; LIMIT 10 = renvoie ensuite 10 lignes (donc les lignes 11 à 20)</pre>
<div class="warn">On peut trier sur un alias ou une colonne calculée : <code>SELECT prixLocation * 1.21 AS ttc FROM JEU ORDER BY ttc;</code>. C'est possible car l'ORDER BY est appliqué en DERNIER, après le SELECT (donc l'alias existe déjà).</div>`,
  exercises: [
    { type: "qcm", q: "ORDER BY sert à…", opts: ["Filtrer", "Trier les lignes du résultat", "Choisir les colonnes", "Créer une table"], a: 1, exp: "Classement des résultats." },
    { type: "qcm", q: "ORDER BY se place…", opts: ["Avant FROM", "Après WHERE, en fin de requête", "Avant SELECT", "Dans le SELECT"], a: 1, exp: "En dernier." },
    { type: "qcm", q: "Le tri par défaut est…", opts: ["Décroissant", "Croissant (ASC)", "Aléatoire", "Par clé primaire"], a: 1, exp: "ASC implicite." },
    { type: "qcm", q: "Trier du plus cher au moins cher :", opts: ["ORDER BY prixLocation ASC", "ORDER BY prixLocation DESC", "ORDER BY DESC prix", "SORT prixLocation"], a: 1, exp: "DESC = décroissant." },
    { type: "qcm", q: "ORDER BY idCategorie, prixLocation DESC trie…", opts: ["Seulement par prix", "Par catégorie, puis par prix décroissant dans chaque catégorie", "Aléatoirement", "Par titre"], a: 1, exp: "Tri à deux niveaux." },
    { type: "qcm", q: "Pour n'avoir que les 3 premières lignes (MySQL) :", opts: ["TOP 3", "LIMIT 3", "FIRST 3", "HEAD 3"], a: 1, exp: "LIMIT en MySQL/PostgreSQL/SQLite." },
    { type: "qcm", q: "En SQL Server, on limite avec…", opts: ["LIMIT 3", "SELECT TOP 3 …", "ROWS 3", "MAX 3"], a: 1, exp: "TOP est la syntaxe SQL Server." },
    { type: "qcm", q: "Un « top N » nécessite…", opts: ["Rien", "Un ORDER BY (on trie puis on garde N)", "Un GROUP BY", "Un index"], a: 1, exp: "Sans tri, « les N premières » sont arbitraires." },
    { type: "qcm", q: "OFFSET 10 sert à…", opts: ["Prendre 10 lignes", "Sauter 10 lignes (pagination)", "Trier par 10", "Supprimer 10 lignes"], a: 1, exp: "Décalage pour la pagination." },
    { type: "qcm", q: "LIMIT 10 OFFSET 10 renvoie…", opts: ["Les 10 premières", "Les lignes 11 à 20 (page 2)", "20 lignes", "Une erreur"], a: 1, exp: "Saut de 10, puis 10 lignes." },
    { type: "vf", q: "On peut trier sur une colonne calculée ou un alias.", a: true, exp: "ORDER BY ttc après SELECT ... AS ttc." },
    { type: "qcm", q: "ORDER BY est appliqué…", opts: ["Avant WHERE", "En dernier, après le SELECT", "Avant FROM", "Jamais"], a: 1, exp: "Dernière étape logique." },
    { type: "qcm", q: "Trier par titre alphabétique :", opts: ["ORDER BY titre", "ORDER BY titre DESC", "SORT titre", "ORDER titre"], a: 0, exp: "ASC par défaut = A→Z." },
    { type: "vf", q: "ORDER BY peut porter sur une colonne non affichée dans le SELECT.", a: true, exp: "On peut trier sur une colonne qu'on n'affiche pas." },
    { type: "qcm", q: "Le « meilleur jeu » (le plus loué) suppose un tri…", opts: ["ASC", "DESC sur le nombre de locations", "Aléatoire", "Par id"], a: 1, exp: "Le plus grand en premier = DESC." }
  ],
  final: {
    title: "Exercice final — Classements",
    intro: `<p>Table JEU(idJeu, titre, prixLocation, stockLocation, idCategorie). On veut des classements pour la vitrine.</p>`,
    questions: [
      { type: "qcm", q: "Les jeux du moins cher au plus cher :", opts: ["ORDER BY prixLocation DESC", "ORDER BY prixLocation", "ORDER BY prixLocation ASC DESC", "SORT prix"], a: 1, exp: "ASC par défaut = croissant." },
      { type: "qcm", q: "Les 3 jeux les plus chers (MySQL) :", opts: ["ORDER BY prixLocation DESC LIMIT 3", "TOP 3 prixLocation", "LIMIT 3 ORDER BY prix", "ORDER BY 3"], a: 0, exp: "Tri décroissant + LIMIT 3." },
      { type: "qcm", q: "Trier par catégorie puis titre :", opts: ["ORDER BY idCategorie, titre", "ORDER BY titre, idCategorie DESC seulement", "GROUP BY idCategorie", "ORDER idCategorie titre"], a: 0, exp: "Deux colonnes de tri." },
      { type: "qcm", q: "La 2e page de 5 jeux (triés par titre) :", opts: ["LIMIT 5", "ORDER BY titre LIMIT 5 OFFSET 5", "OFFSET 5", "PAGE 2"], a: 1, exp: "Saut de 5, puis 5." },
      { type: "vf", q: "Afficher « les 3 plus chers » sans ORDER BY donnerait un résultat non fiable.", a: true, exp: "Le top exige un tri." }
    ],
    solution: `<pre class="pseudo">-- du moins cher au plus cher (ASC implicite)
SELECT titre, prixLocation FROM JEU ORDER BY prixLocation;   -- tri croissant sur le prix

-- top 3 des plus chers (MySQL/PostgreSQL/SQLite)
SELECT titre, prixLocation FROM JEU
ORDER BY prixLocation DESC   -- décroissant : les plus chers d'abord
LIMIT 3;                     -- ne garde que les 3 premiers

-- pagination : page 2 de 5 lignes
SELECT titre FROM JEU ORDER BY titre LIMIT 5 OFFSET 5;   -- saute 5, renvoie les 5 suivantes</pre>
<p>Fin de la semaine 1 : tu crées, remplis, filtres, tries. Demain : les recherches fines (LIKE, IN, BETWEEN).</p>`
  }
};
