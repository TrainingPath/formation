<script>
var DAY = {
  num: 10,
  title: "Les jointures internes (INNER JOIN)",
  subtitle: "Relier deux tables pour croiser leurs informations.",
  theory: `
<h3>1. Pourquoi joindre ?</h3>
<p>Dans une base bien conçue, l'information est répartie dans plusieurs tables pour éviter les répétitions (c'est la <strong>normalisation</strong>). Exemple : la table JEU ne stocke pas le nom de la catégorie, seulement son numéro (<code>idCategorie</code>). Pour afficher « Catan — Stratégie », il faut donc aller chercher le libellé dans la table CATEGORIE : c'est ce qu'on appelle <strong>joindre</strong> (relier) deux tables. Une <strong>jointure</strong> reconstitue l'information complète en suivant le lien entre les tables.</p>

<h3>2. La syntaxe INNER JOIN</h3>
<p><code>INNER JOIN</code> (« jointure interne ») relie deux tables. On indique la deuxième table après JOIN, puis, après le mot-clé <code>ON</code> (« sur »), la <strong>condition de correspondance</strong> qui explique COMMENT les lignes se relient.</p>
<pre class="pseudo">SELECT JEU.titre, CATEGORIE.libelle          -- on veut le titre (table JEU) et le libellé (table CATEGORIE)
FROM JEU                                      -- première table
INNER JOIN CATEGORIE                          -- deuxième table à relier
        ON JEU.idCategorie = CATEGORIE.idCategorie;  -- ON = lien : la FK de JEU = la PK de CATEGORIE</pre>
<p>La condition après <code>ON</code> relie la <strong>clé étrangère</strong> (idCategorie dans JEU) à la <strong>clé primaire</strong> (idCategorie dans CATEGORIE) : c'est le « pont » entre les deux tables. Le mot <code>INNER</code> est facultatif (<code>JOIN</code> tout seul = INNER JOIN).</p>

<h3>3. Ce que fait un INNER JOIN</h3>
<p>Il rapproche chaque ligne de JEU de la ligne de CATEGORIE qui lui <strong>correspond</strong> (même idCategorie), et fusionne leurs colonnes sur une même ligne de résultat. Important : les lignes SANS correspondance sont <strong>exclues</strong> (un jeu dont la catégorie n'existe pas n'apparaîtra pas).</p>
<pre class="pseudo">JEU                    CATEGORIE                    -- les deux tables de départ
titre  | idCategorie   idCategorie | libelle        -- leurs colonnes
Catan  |     1     -&gt;      1       | Stratégie      -- idCategorie 1 = 1 : ça correspond, on relie les deux lignes
                    résultat : Catan | Stratégie    -- ligne combinée finale (titre + libellé réunis)</pre>

<h3>4. Préfixer et utiliser des alias de table</h3>
<p>Quand une même colonne existe dans les deux tables (ici <code>idCategorie</code> des deux côtés), on doit préciser de laquelle on parle en la <strong>préfixant</strong> par le nom de la table. Pour alléger l'écriture, on donne souvent un <strong>alias de table</strong> (un surnom court : <code>j</code>, <code>c</code>).</p>
<pre class="pseudo">SELECT j.titre, c.libelle                          -- j = JEU, c = CATEGORIE (préfixes courts)
FROM JEU j                                          -- « JEU j » = la table JEU, surnommée j
JOIN CATEGORIE c ON j.idCategorie = c.idCategorie;  -- JOIN (= INNER JOIN) reliant j et c sur la clé</pre>

<h3>5. Joindre plus de deux tables</h3>
<p>On peut relier trois tables ou plus en enchaînant plusieurs JOIN, chacun avec son propre ON. Exemple : afficher les locations avec le titre du jeu ET le nom du client.</p>
<pre class="pseudo">SELECT c.nom, j.titre, l.dateDebut          -- le nom (CLIENT), le titre (JEU), la date (LOUER)
FROM LOUER l                                -- table centrale : chaque location
JOIN JEU j    ON l.idJeu = j.idJeu          -- 1er lien : relie la location à son jeu
JOIN CLIENT c ON l.idClient = c.idClient;   -- 2e lien : relie la location à son client</pre>
<div class="tip">Une jointure sans condition ON (ou avec une mauvaise condition) produit un <strong>produit cartésien</strong> : TOUTES les combinaisons possibles de lignes (10 × 10 = 100 lignes !). C'est presque toujours une erreur — vérifie toujours ton ON.</div>`,
  exercises: [
    { type: "qcm", q: "Joindre deux tables sert à…", opts: ["Les trier", "Croiser leurs informations reliées par une clé", "Les supprimer", "Les compter"], a: 1, exp: "Combiner des données réparties." },
    { type: "qcm", q: "La condition de jointure se met après…", opts: ["WHERE", "ON", "GROUP BY", "SELECT"], a: 1, exp: "JOIN ... ON condition." },
    { type: "qcm", q: "On relie typiquement…", opts: ["Deux clés primaires", "La clé étrangère d'une table à la clé primaire de l'autre", "Deux titres", "Deux index"], a: 1, exp: "FK = PK." },
    { type: "qcm", q: "INNER JOIN garde…", opts: ["Toutes les lignes des deux tables", "Seulement les lignes qui ont une correspondance", "Les lignes sans correspondance", "Une seule table"], a: 1, exp: "Correspondances uniquement." },
    { type: "qcm", q: "JOIN seul (sans mot INNER) est…", opts: ["Un LEFT JOIN", "Un INNER JOIN", "Interdit", "Un produit cartésien"], a: 1, exp: "INNER est la valeur par défaut." },
    { type: "qcm", q: "Pour afficher le libellé de la catégorie d'un jeu, il faut…", opts: ["Un GROUP BY", "Joindre JEU et CATEGORIE", "Un index", "Un DISTINCT"], a: 1, exp: "Le libellé est dans CATEGORIE." },
    { type: "qcm", q: "Un jeu dont idCategorie ne correspond à aucune catégorie…", opts: ["Apparaît quand même", "N'apparaît pas dans un INNER JOIN", "Crée une erreur", "Est dupliqué"], a: 1, exp: "Pas de correspondance = exclu." },
    { type: "qcm", q: "Un alias de table (JEU j) sert à…", opts: ["Trier", "Raccourcir et préfixer les colonnes", "Filtrer", "Créer un index"], a: 1, exp: "j.titre au lieu de JEU.titre." },
    { type: "qcm", q: "Quand une colonne existe dans les deux tables, on doit…", opts: ["La supprimer", "La préfixer par la table (ou l'alias)", "L'ignorer", "La renommer partout"], a: 1, exp: "Lever l'ambiguïté." },
    { type: "qcm", q: "Pour joindre 3 tables, on…", opts: ["Fait une seule jointure", "Enchaîne plusieurs JOIN ... ON", "Utilise GROUP BY", "C'est impossible"], a: 1, exp: "On ajoute des JOIN successifs." },
    { type: "vf", q: "Une jointure sans condition ON produit un produit cartésien (toutes les combinaisons).", a: true, exp: "Presque toujours une erreur." },
    { type: "qcm", q: "SELECT j.titre, c.libelle FROM JEU j JOIN CATEGORIE c ON j.idCategorie = c.idCategorie affiche…", opts: ["Les id", "Le titre du jeu et le libellé de sa catégorie", "Les catégories vides", "Une erreur"], a: 1, exp: "Le croisement des deux tables." },
    { type: "qcm", q: "Le mot ON introduit…", opts: ["Le tri", "La condition de correspondance entre les tables", "Le filtre des lignes", "Les colonnes"], a: 1, exp: "La clé de jointure." },
    { type: "vf", q: "On peut joindre LOUER, JEU et CLIENT pour afficher qui a loué quoi.", a: true, exp: "Deux JOIN successifs." },
    { type: "qcm", q: "Le résultat d'un INNER JOIN est…", opts: ["Une nouvelle table permanente", "Un résultat combinant les colonnes des tables reliées", "Un index", "Une vue"], a: 1, exp: "Un jeu de lignes croisées, en lecture." }
  ],
  final: {
    title: "Exercice final — Afficher les libellés",
    intro: `<p>Tables JEU(idJeu, titre, prixLocation, idCategorie) et CATEGORIE(idCategorie, libelle). On veut le catalogue « lisible ».</p>`,
    questions: [
      { type: "qcm", q: "Quelle clause relie les deux tables ?", opts: ["WHERE titre", "ON JEU.idCategorie = CATEGORIE.idCategorie", "GROUP BY", "ORDER BY"], a: 1, exp: "FK = PK dans le ON." },
      { type: "qcm", q: "Afficher titre + libellé :", opts: ["SELECT titre FROM JEU;", "SELECT JEU.titre, CATEGORIE.libelle FROM JEU JOIN CATEGORIE ON ...", "SELECT * FROM CATEGORIE;", "SELECT COUNT(*)"], a: 1, exp: "Projection sur les deux tables jointes." },
      { type: "qcm", q: "Un jeu avec idCategorie invalide (aucune catégorie) apparaît-il ?", opts: ["Oui", "Non, l'INNER JOIN l'exclut", "Il crée une erreur", "Il est dupliqué"], a: 1, exp: "Pas de correspondance = exclu." },
      { type: "qcm", q: "Pour n'afficher que la catégorie « Stratégie » :", opts: ["Ajouter WHERE CATEGORIE.libelle = 'Stratégie'", "Ajouter GROUP BY", "Retirer le ON", "Ajouter DISTINCT"], a: 0, exp: "WHERE après la jointure." },
      { type: "vf", q: "Un alias de table (JEU j, CATEGORIE c) rend la requête plus lisible.", a: true, exp: "j.titre, c.libelle." }
    ],
    solution: `<pre class="pseudo">SELECT j.titre, c.libelle, j.prixLocation   -- titre + libellé + prix, issus des deux tables
FROM JEU j                                  -- table JEU (alias j)
INNER JOIN CATEGORIE c                       -- reliée à CATEGORIE (alias c)
        ON j.idCategorie = c.idCategorie     -- lien : FK de JEU = PK de CATEGORIE
ORDER BY c.libelle, j.titre;                 -- tri par catégorie, puis par titre

-- variante filtrée sur une seule catégorie :
SELECT j.titre
FROM JEU j
JOIN CATEGORIE c ON j.idCategorie = c.idCategorie   -- même jointure
WHERE c.libelle = 'Stratégie';               -- WHERE s'applique APRÈS la jointure</pre>
<p>Tu croises les tables. Demain : garder aussi les lignes sans correspondance (LEFT JOIN).</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta jointure…",
  items: [
  { id: "sql-l10", title: "Qui a loué quel jeu ?", level: 3,
    statement: "Tables : LOUER(idClient, idJeu, dateDebut, montant), JEU(idJeu, titre), CLIENT(idClient, nom). Écris une requête qui affiche, pour chaque location, le nom du client, le titre du jeu et la date de début, en joignant les trois tables.",
    hints: [
      "Pars de LOUER, puis JOIN JEU sur idJeu, puis JOIN CLIENT sur idClient.",
      "Préfixe les colonnes par leur table (ou un alias).",
      "SELECT c.nom, j.titre, l.dateDebut."
    ],
    solution: "SELECT c.nom, j.titre, l.dateDebut\nFROM LOUER l\nJOIN JEU j    ON l.idJeu = j.idJeu\nJOIN CLIENT c ON l.idClient = c.idClient\nORDER BY l.dateDebut;",
    note: "La table d'association LOUER sert de pivot : on la joint à JEU (pour le titre) et à CLIENT (pour le nom). Chaque JOIN relie une clé étrangère de LOUER à la clé primaire de la table cible." }
  ]
