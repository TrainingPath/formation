<script>
var DAY = {
  num: 5,
  title: "Filtrer les lignes : WHERE",
  subtitle: "Ne garder que les lignes qui remplissent une condition.",
  theory: `
<h3>1. La clause WHERE</h3>
<p>Jusqu'ici, SELECT ramenait TOUTES les lignes de la table. Mais souvent on ne veut qu'une partie : « les jeux à moins de 5 € », « les clients de Paris »… La clause <code>WHERE</code> (« où », au sens de « là où la condition est vraie ») sert à <strong>filtrer les lignes</strong> : elle garde uniquement celles qui satisfont une <strong>condition</strong> (une phrase qui est soit vraie, soit fausse pour chaque ligne). Elle se place juste après <code>FROM</code>.</p>
<pre class="pseudo">SELECT titre, prixLocation   -- les colonnes à afficher
FROM JEU                     -- la table source
WHERE prixLocation &lt; 5;      -- WHERE = ne garde que les lignes où prixLocation est inférieur à 5</pre>

<h3>2. Les opérateurs de comparaison</h3>
<p>Un <strong>opérateur de comparaison</strong> compare deux valeurs et répond vrai ou faux. Voici les six essentiels :</p>
<pre class="pseudo">=            -- égal à
&lt;&gt; ou !=     -- différent de (les deux écritures existent selon le SGBD)
&lt;            -- strictement inférieur (plus petit que)
&gt;            -- strictement supérieur (plus grand que)
&lt;=           -- inférieur OU égal
&gt;=           -- supérieur OU égal</pre>
<p>Pour comparer une <strong>chaîne de texte</strong>, on l'entoure d'apostrophes : <code>WHERE libelle = 'Famille'</code> (comme dans un INSERT).</p>

<h3>3. Combiner des conditions : AND, OR, NOT</h3>
<p>On relie plusieurs conditions avec trois mots-clés : <code>AND</code> (« et » — les DEUX doivent être vraies), <code>OR</code> (« ou » — au moins UNE vraie suffit) et <code>NOT</code> (« pas » — inverse le résultat).</p>
<pre class="pseudo">-- jeux de la catégorie 1 ET à moins de 5 (les deux conditions vraies en même temps) :
WHERE idCategorie = 1 AND prixLocation &lt; 5   -- AND = les deux exigences à la fois

-- catégorie 1 OU catégorie 2 (l'une ou l'autre suffit) :
WHERE idCategorie = 1 OR idCategorie = 2      -- OR = au moins une des deux vraie

-- négation (tout ce qui n'est PAS catégorie 3) :
WHERE NOT (idCategorie = 3)                    -- NOT = inverse la condition entre parenthèses</pre>
<div class="tip"><code>AND</code> est prioritaire sur <code>OR</code> (il « s'applique en premier », comme × avant + en maths). En cas de doute, mets des parenthèses : <code>WHERE (a OR b) AND c</code> n'a PAS le même sens que <code>a OR (b AND c)</code>.</div>

<h3>4. Filtrer sur du texte</h3>
<p>Les comparaisons marchent aussi sur le texte, en respectant les apostrophes :</p>
<pre class="pseudo">WHERE titre = 'Catan'          -- égalité EXACTE : seulement le jeu dont le titre est pile « Catan »
WHERE libelle &lt;&gt; 'Ambiance'    -- différent de : tout sauf le libellé « Ambiance »</pre>
<p>La recherche par <strong>motif</strong> (« commence par… », « contient… ») se fait avec l'opérateur <code>LIKE</code>, que l'on verra à la leçon 7.</p>

<h3>5. WHERE avant SELECT</h3>
<p>Rappelle-toi l'ordre logique (leçon 4) : le SGBD applique <code>WHERE</code> <strong>avant</strong> de choisir les colonnes. Il élimine d'abord les lignes non voulues, puis projette les colonnes. Conséquence pratique très utile : on peut filtrer sur une colonne SANS l'afficher.</p>
<pre class="pseudo">SELECT titre               -- on n'AFFICHE que le titre…
FROM JEU
WHERE prixLocation &gt;= 4;   -- …mais on FILTRE sur le prix (colonne non affichée, ça marche quand même)</pre>
<div class="warn">Attention à <code>NULL</code> (l'absence de valeur) : une comparaison avec NULL (par ex. <code>= NULL</code>) ne renvoie JAMAIS « vrai », car « inconnu » ne peut pas être « égal ». Pour tester l'absence de valeur, on utilise <code>IS NULL</code> / <code>IS NOT NULL</code> (leçon 7).</div>`,
  exercises: [
    { type: "qcm", q: "WHERE sert à…", opts: ["Choisir les colonnes", "Filtrer les lignes selon une condition", "Trier", "Créer une table"], a: 1, exp: "Sélection des lignes." },
    { type: "qcm", q: "WHERE se place…", opts: ["Avant FROM", "Après FROM", "Avant SELECT", "À la fin, après ORDER BY"], a: 1, exp: "SELECT … FROM … WHERE …" },
    { type: "qcm", q: "L'opérateur « différent de » s'écrit…", opts: ["==", "&lt;&gt; ou !=", "=!", "NOT="], a: 1, exp: "&lt;&gt; (ou != selon le SGBD)." },
    { type: "qcm", q: "Filtrer les jeux à moins de 5 :", opts: ["WHERE prixLocation &gt; 5", "WHERE prixLocation &lt; 5", "WHERE prixLocation = 5", "WHERE prixLocation"], a: 1, exp: "Inférieur strict." },
    { type: "qcm", q: "Comparer à une chaîne se fait avec…", opts: ["Des guillemets doubles", "Des apostrophes : = 'Famille'", "Des crochets", "Rien"], a: 1, exp: "Chaîne entre apostrophes." },
    { type: "qcm", q: "« catégorie 1 ET moins de 5 » s'écrit…", opts: ["idCategorie = 1 OR prixLocation &lt; 5", "idCategorie = 1 AND prixLocation &lt; 5", "idCategorie = 1, prixLocation &lt; 5", "idCategorie = 1 &lt; 5"], a: 1, exp: "AND combine deux conditions vraies ensemble." },
    { type: "qcm", q: "AND est prioritaire sur…", opts: ["OR", "NOT", "=", "FROM"], a: 0, exp: "AND avant OR ; parenthèses en cas de doute." },
    { type: "qcm", q: "« supérieur ou égal à 4 » s'écrit…", opts: ["&gt; 4", "&gt;= 4", "=&gt; 4", "&lt;= 4"], a: 1, exp: "&gt;= 4." },
    { type: "qcm", q: "Le filtre WHERE porte sur…", opts: ["Seulement les colonnes affichées", "Toutes les colonnes de la table, même non affichées", "Les alias", "Les index"], a: 1, exp: "WHERE agit avant la projection." },
    { type: "qcm", q: "Tester une valeur absente se fait avec…", opts: ["= NULL", "IS NULL", "== NULL", "NULL()"], a: 1, exp: "= NULL ne marche pas ; IS NULL oui." },
    { type: "vf", q: "Le SGBD applique WHERE avant de choisir les colonnes (SELECT).", a: true, exp: "FROM → WHERE → SELECT." },
    { type: "qcm", q: "WHERE (idCategorie = 1 OR idCategorie = 2) AND prixLocation &lt; 5 garde…", opts: ["Tous les jeux", "Les jeux des catégories 1 ou 2 ET à moins de 5", "Seulement la catégorie 1", "Rien"], a: 1, exp: "Les parenthèses groupent le OR." },
    { type: "qcm", q: "Combien de lignes garde WHERE prixLocation = 4 ?", opts: ["Toutes", "Seulement celles dont le prix vaut exactement 4", "Aucune jamais", "Les 4 premières"], a: 1, exp: "Égalité exacte." },
    { type: "vf", q: "On peut filtrer sur une colonne qu'on n'affiche pas dans le SELECT.", a: true, exp: "WHERE porte sur la table entière." },
    { type: "qcm", q: "NOT (idCategorie = 3) garde…", opts: ["La catégorie 3", "Tout SAUF la catégorie 3", "Rien", "Toutes"], a: 1, exp: "Négation de la condition." }
  ],
  final: {
    title: "Exercice final — Cibler des jeux",
    intro: `<p>Table JEU(idJeu, titre, prixAchat, prixLocation, stockLocation, idCategorie). On cherche différents sous-ensembles.</p>`,
    questions: [
      { type: "qcm", q: "Jeux de la catégorie 2 :", opts: ["WHERE idCategorie = 2", "WHERE idCategorie &lt;&gt; 2", "WHERE 2", "ORDER BY idCategorie"], a: 0, exp: "Égalité sur la catégorie." },
      { type: "qcm", q: "Jeux à louer entre 4 et 6 (bornes comprises) avec AND :", opts: ["WHERE prixLocation &gt;= 4 AND prixLocation &lt;= 6", "WHERE prixLocation = 4 OR 6", "WHERE prixLocation 4 6", "WHERE 4 &lt; prix &lt; 6"], a: 0, exp: "Deux comparaisons combinées par AND." },
      { type: "qcm", q: "Jeux encore disponibles à la location :", opts: ["WHERE stockLocation = 0", "WHERE stockLocation &gt; 0", "WHERE stockLocation", "WHERE dispo"], a: 1, exp: "Stock strictement positif." },
      { type: "qcm", q: "Jeux qui ne sont PAS de la catégorie 1 :", opts: ["WHERE idCategorie = 1", "WHERE idCategorie &lt;&gt; 1", "WHERE NOT 1", "WHERE idCategorie"], a: 1, exp: "Différent de 1." },
      { type: "vf", q: "WHERE idCategorie = 1 AND idCategorie = 2 ne renvoie aucune ligne.", a: true, exp: "Une catégorie ne peut valoir 1 ET 2 à la fois." }
    ],
    solution: `<pre class="pseudo">SELECT titre FROM JEU WHERE idCategorie = 2;   -- égalité : uniquement la catégorie 2

SELECT titre, prixLocation
FROM JEU
WHERE prixLocation &gt;= 4 AND prixLocation &lt;= 6;  -- deux bornes reliées par AND (entre 4 et 6 inclus)

SELECT titre FROM JEU WHERE stockLocation &gt; 0;  -- stock strictement positif = encore dispo

SELECT titre FROM JEU WHERE idCategorie &lt;&gt; 1;   -- différent de 1 = tout sauf catégorie 1</pre>
<p>Tu filtres avec précision. Demain : trier et limiter les résultats.</p>`
  }
};
</script>

  items: [
  { id: "sql-l5", title: "Filtrer le catalogue", level: 2,
    statement: "À partir de JEU(idJeu, titre, prixAchat, prixLocation, stockLocation, idCategorie), écris une requête qui affiche le titre et le prix de location des jeux de la catégorie 1 qui sont encore disponibles à la location (stock de location supérieur à 0) ET dont le prix de location ne dépasse pas 5.",
    hints: [
      "Trois conditions reliées par AND.",
      "Disponible : stockLocation > 0 (écris > directement dans ta requête).",
      "Ne dépasse pas 5 : prixLocation <= 5."
    ],
    solution: "SELECT titre, prixLocation\nFROM JEU\nWHERE idCategorie = 1\n  AND stockLocation > 0\n  AND prixLocation <= 5;",
    note: "On enchaîne les conditions avec AND : chaque ligne renvoyée les satisfait toutes. WHERE agit avant SELECT, on peut donc filtrer sur stockLocation même sans l'afficher." }
  ]
};
