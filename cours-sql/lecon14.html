<script>
var DAY = {
  num: 14,
  title: "Modifier et supprimer : UPDATE, DELETE",
  subtitle: "Changer et retirer des données — avec prudence.",
  theory: `
<h3>1. UPDATE : modifier des lignes</h3>
<p>Jusqu'ici on ajoutait (INSERT) et on lisait (SELECT). Pour <strong>changer</strong> des valeurs déjà en place, on utilise <code>UPDATE</code> (« mettre à jour »). On indique la table, puis avec <code>SET</code> (« affecter ») les colonnes à modifier et leurs nouvelles valeurs, et enfin un <code>WHERE</code> qui désigne QUELLES lignes changer.</p>
<pre class="pseudo">UPDATE JEU                    -- UPDATE = modifie la table JEU
SET prixLocation = 6.00       -- SET = donne la nouvelle valeur à la colonne prixLocation
WHERE idJeu = 1;              -- WHERE = uniquement sur la ligne du jeu n°1</pre>
<p>On peut modifier plusieurs colonnes en une fois (virgules), et même se servir de la valeur ACTUELLE dans le calcul :</p>
<pre class="pseudo">UPDATE JEU
SET prixLocation = prixLocation * 1.10,   -- augmente le prix de 10 % (on repart de sa valeur actuelle)
    stockLocation = stockLocation - 1     -- et retire 1 au stock (deuxième colonne modifiée)
WHERE idJeu = 1;                          -- toujours sur le seul jeu n°1</pre>

<h3>2. DELETE : supprimer des lignes</h3>
<p><code>DELETE FROM</code> (« supprimer depuis ») efface les lignes désignées par le WHERE. Elle retire des LIGNES entières (pas des colonnes, pas la table elle-même).</p>
<pre class="pseudo">DELETE FROM JEU     -- DELETE FROM = supprime des lignes de la table JEU
WHERE idJeu = 3;    -- WHERE = seulement la ligne du jeu n°3</pre>

<h3>3. LE piège : oublier le WHERE</h3>
<div class="warn">Sans <code>WHERE</code>, <code>UPDATE</code> modifie TOUTES les lignes et <code>DELETE</code> vide TOUTE la table. <code>DELETE FROM JEU;</code> supprime tous les jeux d'un coup, sans confirmation. Vérifie toujours ton WHERE avant d'exécuter — idéalement, teste-le d'abord avec un SELECT.</div>
<pre class="pseudo">-- 1) tester le WHERE avec un SELECT (sans rien détruire) :
SELECT * FROM JEU WHERE idJeu = 3;    -- affiche ce qui SERAIT supprimé
-- 2) si c'est bien la/les bonne(s) ligne(s), alors seulement :
DELETE FROM JEU WHERE idJeu = 3;      -- même WHERE que le SELECT de test</pre>

<h3>4. L'intégrité référentielle protège les données</h3>
<p>Supprimer une CATEGORIE encore utilisée par des jeux ne se fait pas n'importe comment : le comportement dépend de la règle définie sur la clé étrangère. <code>RESTRICT</code> interdit la suppression, <code>CASCADE</code> supprime en chaîne les jeux liés, <code>SET NULL</code> met leur idCategorie à NULL.</p>
<pre class="pseudo">-- interdit si des jeux référencent encore la catégorie 1 :
DELETE FROM CATEGORIE WHERE idCategorie = 1;   -- provoque une erreur si la règle est RESTRICT</pre>

<h3>5. Vider une table : DELETE vs TRUNCATE</h3>
<p>Deux façons de vider entièrement une table, avec des différences importantes :</p>
<pre class="pseudo">DELETE FROM JEU;      -- supprime toutes les lignes une à une (annulable dans une transaction ; DML)
TRUNCATE TABLE JEU;   -- vide la table d'un coup, plus vite, et remet les compteurs auto à zéro
                      -- (souvent NON annulable ; considérée comme du DDL)</pre>
<div class="tip">UPDATE et DELETE font partie du DML (comme INSERT). Dans une transaction (leçon 19), un DELETE peut être annulé par ROLLBACK tant qu'on n'a pas validé avec COMMIT — un vrai filet de sécurité.</div>`,
  exercises: [
    { type: "qcm", q: "UPDATE sert à…", opts: ["Lire des lignes", "Modifier la valeur de colonnes sur certaines lignes", "Créer une table", "Trier"], a: 1, exp: "Modification des données." },
    { type: "qcm", q: "La clause SET dans UPDATE…", opts: ["Filtre les lignes", "Indique les colonnes à modifier et leurs nouvelles valeurs", "Trie", "Joint"], a: 1, exp: "SET col = valeur." },
    { type: "qcm", q: "Augmenter le prix de 10 % :", opts: ["SET prix = 10", "SET prix = prix * 1.10", "SET prix + 10 %", "SET prix DESC"], a: 1, exp: "On réutilise la valeur actuelle." },
    { type: "qcm", q: "DELETE FROM JEU WHERE idJeu = 3; …", opts: ["Vide la table", "Supprime la ligne du jeu 3", "Modifie le jeu 3", "Crée le jeu 3"], a: 1, exp: "Suppression ciblée." },
    { type: "qcm", q: "UPDATE sans WHERE…", opts: ["Ne fait rien", "Modifie TOUTES les lignes", "Modifie une ligne au hasard", "Provoque une erreur"], a: 1, exp: "Danger : toute la table." },
    { type: "qcm", q: "DELETE FROM JEU; (sans WHERE) …", opts: ["Supprime le jeu 1", "Supprime TOUTES les lignes de JEU", "Ne fait rien", "Supprime la table"], a: 1, exp: "Vide toute la table." },
    { type: "qcm", q: "Bonne pratique avant un DELETE :", opts: ["Rien", "Tester le WHERE avec un SELECT d'abord", "Supprimer la table", "Faire un TRUNCATE"], a: 1, exp: "Vérifier les lignes ciblées." },
    { type: "qcm", q: "Supprimer une catégorie encore utilisée (règle RESTRICT)…", opts: ["Réussit", "Échoue (intégrité référentielle)", "Supprime les jeux", "Met NULL"], a: 1, exp: "RESTRICT interdit la suppression." },
    { type: "qcm", q: "La règle CASCADE lors d'un DELETE de catégorie…", opts: ["Interdit", "Supprime aussi les jeux liés", "Met idCategorie à NULL", "Ne fait rien"], a: 1, exp: "Suppression propagée." },
    { type: "qcm", q: "La règle SET NULL…", opts: ["Supprime les jeux", "Met la clé étrangère à NULL dans les lignes liées", "Interdit tout", "Duplique"], a: 1, exp: "Le lien devient vide." },
    { type: "qcm", q: "On peut modifier plusieurs colonnes dans un UPDATE…", opts: ["Non", "Oui : SET col1 = ..., col2 = ...", "Une seule à la fois", "Seulement en MySQL"], a: 1, exp: "Colonnes séparées par des virgules." },
    { type: "qcm", q: "TRUNCATE TABLE JEU…", opts: ["Supprime une ligne", "Vide la table rapidement (souvent non annulable)", "Modifie une colonne", "Crée la table"], a: 1, exp: "Vidage rapide, DDL." },
    { type: "vf", q: "Dans une transaction, un DELETE peut être annulé par ROLLBACK avant COMMIT.", a: true, exp: "Le DELETE (DML) est transactionnel." },
    { type: "vf", q: "UPDATE et DELETE font partie du DML.", a: true, exp: "Manipulation de données." },
    { type: "qcm", q: "Le WHERE d'un UPDATE détermine…", opts: ["Les colonnes modifiées", "Les lignes qui seront modifiées", "Le tri", "L'index"], a: 1, exp: "Quelles lignes sont touchées." }
  ],
  final: {
    title: "Exercice final — Maintenance du catalogue",
    intro: `<p>Table JEU(idJeu, titre, prixLocation, stockLocation, idCategorie). Plusieurs opérations de maintenance.</p>`,
    questions: [
      { type: "qcm", q: "Passer le prix de location du jeu 2 à 4.50 :", opts: ["UPDATE JEU SET prixLocation = 4.50 WHERE idJeu = 2;", "SET prixLocation = 4.50", "UPDATE JEU prixLocation 4.50", "DELETE JEU 2"], a: 0, exp: "UPDATE ... SET ... WHERE." },
      { type: "qcm", q: "Baisser de 5 % tous les prix de la catégorie 1 :", opts: ["UPDATE JEU SET prixLocation = prixLocation * 0.95 WHERE idCategorie = 1;", "UPDATE ALL", "DELETE catégorie 1", "SET -5%"], a: 0, exp: "Calcul + WHERE sur la catégorie." },
      { type: "qcm", q: "Retirer du catalogue le jeu 5 :", opts: ["DROP JEU 5", "DELETE FROM JEU WHERE idJeu = 5;", "REMOVE JEU 5", "UPDATE JEU"], a: 1, exp: "DELETE ciblé." },
      { type: "qcm", q: "Quel est le risque de « DELETE FROM JEU; » ?", opts: ["Aucun", "Supprimer TOUS les jeux (WHERE oublié)", "Modifier un prix", "Créer un doublon"], a: 1, exp: "Sans WHERE, toute la table." },
      { type: "vf", q: "Tester d'abord son WHERE avec un SELECT évite les suppressions accidentelles.", a: true, exp: "Réflexe de sécurité." }
    ],
    solution: `<pre class="pseudo">-- prix précis sur un seul jeu
UPDATE JEU SET prixLocation = 4.50 WHERE idJeu = 2;   -- nouvelle valeur, ciblée par idJeu

-- remise de 5 % sur toute une catégorie
UPDATE JEU
SET prixLocation = prixLocation * 0.95   -- 0.95 = -5 % (on repart de la valeur actuelle)
WHERE idCategorie = 1;                    -- uniquement la catégorie 1

-- retrait d'un jeu (avec vérification préalable)
SELECT * FROM JEU WHERE idJeu = 5;   -- 1) on vérifie la ligne visée
DELETE FROM JEU WHERE idJeu = 5;     -- 2) même WHERE : suppression sûre</pre>
<p>Fin de la semaine 2 : tu interroges, agrèges, joins et modifies. Demain : les contraintes et l'intégrité.</p>`
  }
};
</script>
