  title: "Tâches planifiées et maintenance",
  subtitle: "Faire tourner ses scripts tout seuls, à heure fixe.",
  theory: `
<h3>1. Automatiser vraiment : la planification</h3>
<p>Un bon script d'audit ou de rapport (jours 23, 27, 28) ne sert pleinement que s'il tourne <strong>régulièrement</strong>, sans qu'on y pense. Windows possède pour cela le <strong>Planificateur de tâches</strong> (Task Scheduler) : un service qui exécute automatiquement un programme à un moment choisi (chaque nuit, chaque lundi, au démarrage…). On parle d'une <strong>tâche planifiée</strong>.</p>
<h3>2. Les trois ingrédients d'une tâche</h3>
<p>Une tâche planifiée se compose toujours de trois éléments. L'<strong>action</strong> (quoi exécuter : ici PowerShell avec notre script), le <strong>déclencheur</strong> (en anglais <em>trigger</em> : quand le lancer) et le <strong>principal</strong> (sous quel compte l'exécuter). On construit chacun avec une cmdlet, puis on assemble le tout.</p>
<pre class="pseudo">Action       # QUOI : lancer powershell.exe avec le chemin du script
Declencheur  # QUAND : tous les jours a 2h du matin, par exemple
Principal    # QUI : le compte sous lequel la tache s'execute (souvent SYSTEM ou un compte de service)</pre>
<h3>3. Créer la tâche par script</h3>
<p>Le module <strong>ScheduledTasks</strong> fournit les cmdlets. On fabrique l'action, le déclencheur, puis on enregistre la tâche avec <code>Register-ScheduledTask</code> :</p>
<pre class="pseudo">$action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-File C:\Scripts\audit.ps1"
# New-ScheduledTaskAction : definit QUOI executer (powershell + notre script audit.ps1)
$decl = New-ScheduledTaskTrigger -Daily -At 2am
# New-ScheduledTaskTrigger : definit QUAND (tous les jours a 2h du matin)
Register-ScheduledTask -TaskName "Audit AD quotidien" -Action $action -Trigger $decl -User "SYSTEM"
# Register-ScheduledTask : ENREGISTRE la tache avec un nom, l'action, le declencheur et le compte</pre>
<div class="tip">Un fichier <strong>.ps1</strong> est simplement un script PowerShell enregistré dans un fichier : on peut le lancer à la main ou le faire exécuter par une tâche planifiée.</div>
<h3>4. Gérer les tâches existantes</h3>
<p>D'autres cmdlets listent, lancent ou suppriment les tâches :</p>
<pre class="pseudo">Get-ScheduledTask -TaskName "Audit AD quotidien"        # affiche la tache et son etat
Start-ScheduledTask -TaskName "Audit AD quotidien"      # la lance TOUT DE SUITE (utile pour tester)
Unregister-ScheduledTask -TaskName "Audit AD quotidien" # supprime la tache
Get-ScheduledTaskInfo -TaskName "Audit AD quotidien"    # dernier resultat et prochaine execution prevue</pre>
<h3>5. Journaliser pour savoir ce qui s'est passé</h3>
<p>Une tâche s'exécute quand personne ne regarde : elle doit donc laisser une trace. On fait <strong>écrire</strong> au script un compte-rendu dans un fichier <strong>journal</strong> (log). La cmdlet la plus simple est <code>Out-File</code> (ou l'opérateur de redirection) ; pour ajouter à la fin sans écraser, on utilise <code>-Append</code> :</p>
<pre class="pseudo">"$(Get-Date) - Audit termine, 3 comptes a risque" | Out-File "C:\Logs\audit.log" -Append
# Get-Date insere la date et l'heure ; -Append ajoute la ligne a la fin du journal sans l'ecraser</pre>
<div class="warn">Sans journal, une tâche qui échoue passe inaperçue pendant des semaines. Toujours faire écrire au script au moins « début » et « fin OK », plus les erreurs éventuelles.</div>
<h3>6. Un rythme de maintenance</h3>
<p>La maintenance AD, c'est un ensemble de contrôles répétés à intervalle régulier, chacun automatisé en tâche planifiée :</p>
<pre class="pseudo">Chaque jour   : sauvegarde System State (jour 25) + controle de replication (jour 27)
Chaque semaine: rapport des comptes a risque (jour 28) + comptes inactifs
Chaque mois   : revue des membres de Domain Admins + verification des GPO</pre>
<div class="tip">L'automatisation transforme des corvées faciles à oublier en routine fiable. Le meilleur administrateur est celui dont les vérifications tournent toutes seules et l'alertent uniquement en cas de problème.</div>`,
  exercises: [
    { type: "qcm", q: "À quoi sert le <strong>Planificateur de tâches</strong> ?", opts: ["À créer des utilisateurs", "À exécuter automatiquement un programme à un moment choisi", "À répliquer AD", "À supprimer des GPO"], a: 1, exp: "Il lance des scripts à heure fixe, sans intervention." },
    { type: "qcm", q: "Quels sont les trois ingrédients d'une tâche planifiée ?", opts: ["Nom, mot de passe, SID", "Action, déclencheur, principal (compte)", "GPO, OU, ACL", "Forêt, domaine, site"], a: 1, exp: "Quoi (action), quand (déclencheur), sous quel compte (principal)." },

    { type: "qcm", q: "Que fait le paramètre <code>-Append</code> avec Out-File ?", opts: ["Écrase le fichier", "Ajoute à la fin sans effacer le contenu existant", "Supprime le fichier", "Crée une tâche"], a: 1, exp: "-Append conserve l'historique du journal." },
    { type: "input", q: "Quelle cmdlet ENREGISTRE (crée) une tâche planifiée ? (Verbe-Nom)", a: ["Register-ScheduledTask", "register-scheduledtask"], ph: "Verbe-ScheduledTask", exp: "Register-ScheduledTask assemble et enregistre la tâche." },
    { type: "input", q: "Quelle cmdlet définit l'ACTION (quoi exécuter) ? (Verbe-Nom)", a: ["New-ScheduledTaskAction", "new-scheduledtaskaction"], ph: "New-ScheduledTask...", exp: "New-ScheduledTaskAction précise le programme à lancer." },
    { type: "input", q: "Quelle cmdlet définit le DÉCLENCHEUR (quand) ? (Verbe-Nom)", a: ["New-ScheduledTaskTrigger", "new-scheduledtasktrigger"], ph: "New-ScheduledTask...", exp: "New-ScheduledTaskTrigger fixe le moment d'exécution." },
    { type: "input", q: "Quelle cmdlet LANCE tout de suite une tâche (pour tester) ? (Verbe-Nom)", a: ["Start-ScheduledTask", "start-scheduledtask"], ph: "Verbe-ScheduledTask", exp: "Start-ScheduledTask exécute la tâche immédiatement." },
    { type: "input", q: "Quelle cmdlet SUPPRIME une tâche planifiée ? (Verbe-Nom)", a: ["Unregister-ScheduledTask", "unregister-scheduledtask"], ph: "Verbe-ScheduledTask", exp: "Unregister-ScheduledTask retire la tâche." },
    { type: "input", q: "Quelle cmdlet insère la date et l'heure courantes dans un journal ? (Verbe-Nom)", a: ["Get-Date", "get-date"], ph: "Verbe-Date", exp: "Get-Date fournit l'horodatage de chaque ligne de log." },
    { type: "vf", q: "Une tâche planifiée peut exécuter un script chaque nuit sans intervention humaine.", a: true, exp: "C'est exactement son rôle." },
    { type: "vf", q: "Il est inutile de journaliser une tâche qui tourne automatiquement.", a: false, exp: "Au contraire : le journal est indispensable pour détecter les échecs." },
    { type: "vf", q: "Start-ScheduledTask est pratique pour tester une tâche sans attendre son heure.", a: true, exp: "Elle déclenche l'exécution immédiatement." }
  ],

<pre class="pseudo">$action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-File C:\Scripts\audit.ps1"

    questions: [

      { type: "input", q: "Quelle cmdlet définit QUAND (le déclencheur) ? (Verbe-Nom)", a: ["New-ScheduledTaskTrigger", "new-scheduledtasktrigger"], ph: "New-ScheduledTask...", exp: "New-ScheduledTaskTrigger -Daily -At 2am." },
      { type: "input", q: "Quelle cmdlet assemble et enregistre finalement la tâche ? (Verbe-Nom)", a: ["Register-ScheduledTask", "register-scheduledtask"], ph: "Verbe-ScheduledTask", exp: "Register-ScheduledTask relie action + trigger + compte." },
      { type: "qcm", q: "Comment vérifier que la tâche fonctionne, sans attendre 2h du matin ?", opts: ["La supprimer", "Start-ScheduledTask pour la lancer tout de suite", "Redémarrer AD", "Créer une GPO"], a: 1, exp: "Start-ScheduledTask déclenche un test immédiat." },
      { type: "qcm", q: "Pourquoi ajouter une ligne de log en fin de script ?", opts: ["Pour relancer la tâche automatiquement", "Pour savoir, le lendemain, si l'audit s'est bien exécuté", "Pour créer un utilisateur", "Pour déclencher la tâche plus tôt"], a: 1, exp: "Le journal prouve l'exécution et signale les erreurs." }
    ],
    solution: `<p>La tâche planifiée complète, avec journalisation dans le script appelé :</p>
<pre class="pseudo">-- Creation de la tache planifiee --
$action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-File C:\Scripts\audit.ps1"   # QUOI
$decl   = New-ScheduledTaskTrigger -Daily -At 2am                                                    # QUAND
Register-ScheduledTask -TaskName "Audit AD quotidien" -Action $action -Trigger $decl -User "SYSTEM"  # ENREGISTRE
Start-ScheduledTask -TaskName "Audit AD quotidien"                                                    # TEST immediat

-- A l'interieur de audit.ps1, on journalise --
"$(Get-Date) - Debut audit" | Out-File "C:\Logs\audit.log" -Append   # trace de debut
# ... controles ...
"$(Get-Date) - Fin audit OK" | Out-File "C:\Logs\audit.log" -Append  # trace de fin</pre>
<p>Action + déclencheur + enregistrement : la tâche tourne seule chaque nuit. Le test immédiat et le journal garantissent qu'on saura, sans surveiller, si tout se passe bien. C'est le cœur d'une maintenance automatisée.</p>`
  }
};
