<script>
var DAY = {
  num: 1,
  title: "Active Directory et l'automatisation : les concepts",
  subtitle: "Comprendre l'annuaire de l'entreprise avant d'écrire la moindre ligne.",
  theory: `
<h3>1. Qu'est-ce qu'un annuaire ?</h3>
<p>Un <strong>annuaire</strong> (en anglais <em>directory</em>) est une base de données spécialisée qui range des informations sur des personnes et des ressources, un peu comme l'annuaire téléphonique d'autrefois : tu cherches un nom, tu obtiens un numéro. Dans une entreprise, l'annuaire informatique répond à des questions du type « qui est Jean Dupont ? », « quel est son mot de passe ? », « a-t-il le droit d'ouvrir ce dossier ? ». Ce grand registre central s'appelle <strong>Active Directory</strong> (souvent abrégé <strong>AD</strong>), le service d'annuaire de Microsoft.</p>
<h3>2. Le domaine : le territoire administré</h3>
<p>Un <strong>domaine</strong> est un périmètre logique qui regroupe des utilisateurs, des ordinateurs et des règles partagées, avec une seule base de comptes. Imagine un immeuble avec un unique gardien qui connaît tous les locataires et distribue les clés : le domaine, c'est l'immeuble ; le gardien, c'est le service d'annuaire. Un domaine porte un nom qui ressemble à une adresse Internet, par exemple <code>entreprise.local</code> ou <code>contoso.com</code>.</p>
<div class="tip">Sans domaine, chaque ordinateur gère ses propres comptes dans son coin : impossible de se connecter partout avec le même identifiant. Le domaine centralise tout.</div>
<h3>3. La forêt : l'ensemble de tous les domaines</h3>
<p>Une <strong>forêt</strong> est la structure la plus haute : elle contient un ou plusieurs domaines qui se font mutuellement confiance. Si le domaine est un immeuble, la forêt est le quartier entier. Le tout premier domaine créé donne son nom à la forêt et s'appelle le <strong>domaine racine</strong> (la racine de l'arbre, d'où le mot forêt).</p>
<h3>4. Le contrôleur de domaine</h3>
<p>Un <strong>contrôleur de domaine</strong> (abrégé <strong>DC</strong>, pour <em>Domain Controller</em>) est le serveur qui héberge réellement l'annuaire et qui valide les connexions. C'est le gardien de l'immeuble en chair et en os. Quand un employé tape son mot de passe le matin, c'est un contrôleur de domaine qui vérifie et ouvre la porte.</p>
<div class="warn">Un domaine peut (et devrait) avoir <strong>plusieurs</strong> contrôleurs de domaine : si le gardien tombe malade, un remplaçant prend le relais. Ils se synchronisent en permanence pour avoir la même information.</div>
<h3>5. Objets et attributs</h3>
<p>Tout ce qui existe dans l'annuaire est un <strong>objet</strong> : un utilisateur, un ordinateur, un groupe sont des objets. Chaque objet possède des <strong>attributs</strong>, c'est-à-dire des cases d'information qui le décrivent. Pense à une fiche cartonnée : la fiche est l'objet, et chaque ligne de la fiche (nom, prénom, service, téléphone) est un attribut.</p>
<pre class="pseudo">Objet   : utilisateur Jean Dupont          # une fiche dans l'annuaire
Attribut: Name       = Jean Dupont         # le nom affiche
Attribut: SamAccountName = jdupont         # l'identifiant de connexion
Attribut: Department = Comptabilite        # le service
Attribut: Enabled    = True                # le compte est-il actif ?</pre>
<h3>6. LDAP et le nom distinctif (DN)</h3>
<p><strong>LDAP</strong> (<em>Lightweight Directory Access Protocol</em>) est le langage standard que les logiciels utilisent pour interroger un annuaire, comme le français est la langue pour parler au gardien. Grâce à LDAP, chaque objet a une adresse unique appelée <strong>nom distinctif</strong> ou <strong>DN</strong> (<em>Distinguished Name</em>). Le DN décrit le chemin complet vers l'objet, de la fiche jusqu'à la racine :</p>
<pre class="pseudo">CN=Jean Dupont,OU=Comptabilite,DC=entreprise,DC=local   # le DN complet de Jean
# CN = Common Name : le nom de l'objet lui-meme
# OU = Organizational Unit : le tiroir (dossier) qui le contient
# DC = Domain Component : un morceau du nom de domaine (entreprise.local)</pre>
<p>Lis un DN de gauche à droite comme une adresse postale à l'envers : la personne d'abord, puis le tiroir, puis l'immeuble.</p>
<h3>7. Pourquoi automatiser avec des scripts ?</h3>
<p>Cliquer dans les fenêtres pour créer 300 comptes un par un est lent et source d'erreurs. Une <strong>cmdlet</strong> (prononce « commandelette ») est une petite commande PowerShell prête à l'emploi, du genre <code>New-ADUser</code>. En les enchaînant dans un <strong>script</strong> (un fichier texte de commandes), on crée les 300 comptes en quelques secondes, toujours de la même manière. C'est tout l'objet de ce cours.</p>
<pre class="pseudo">New-ADUser -Name "Jean Dupont" -SamAccountName jdupont -Enabled $true   # cree un compte utilisateur actif
Get-ADUser -Identity jdupont                                            # affiche la fiche de ce compte</pre>
<div class="tip">Retiens la logique verbe-nom des cmdlets : <code>Get-</code> pour lire, <code>New-</code> pour créer, <code>Set-</code> pour modifier, <code>Remove-</code> pour supprimer. Nous les verrons toutes.</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'un annuaire (directory) au sens d'Active Directory ?", opts: ["Un antivirus", "Une base de données centrale qui range les comptes et les ressources", "Un tableur", "Un câble réseau"], a: 1, exp: "L'annuaire centralise les informations sur les utilisateurs, ordinateurs et droits." },
    { type: "qcm", q: "Le serveur qui héberge l'annuaire et valide les connexions s'appelle…", opts: ["Un routeur", "Un contrôleur de domaine (DC)", "Un pare-feu", "Un client"], a: 1, exp: "Le contrôleur de domaine est le gardien qui vérifie les mots de passe." },
    { type: "qcm", q: "Comment appelle-t-on la structure la plus haute qui contient un ou plusieurs domaines ?", opts: ["Le groupe", "L'OU", "La forêt", "Le DN"], a: 2, exp: "La forêt est le quartier ; le domaine est l'immeuble." },
    { type: "qcm", q: "Dans l'annuaire, un utilisateur, un ordinateur ou un groupe sont tous des…", opts: ["objets", "fichiers", "câbles", "scripts"], a: 0, exp: "Tout est objet ; chaque objet a des attributs qui le décrivent." },
    { type: "qcm", q: "Que signifie l'abréviation LDAP ?", opts: ["Le protocole standard pour interroger un annuaire", "Un type de câble", "Un mot de passe", "Une version de Windows"], a: 0, exp: "LDAP = Lightweight Directory Access Protocol, la langue pour parler à l'annuaire." },
    { type: "input", q: "Complète : le nom complet et unique d'un objet dans l'annuaire s'appelle le nom distinctif, abrégé ______ (trois lettres).", a: ["DN", "dn"], ph: "trois lettres", exp: "DN = Distinguished Name, l'adresse unique de l'objet." },
    { type: "input", q: "Complète le DN : CN=Jean Dupont,OU=Comptabilite,DC=entreprise,DC=______", a: ["local", "Local"], ph: "un mot", exp: "entreprise.local se décompose en DC=entreprise,DC=local." },
    { type: "input", q: "Complète : la petite commande PowerShell prête à l'emploi (ex. New-ADUser) s'appelle une ______.", a: ["cmdlet", "commandelette"], ph: "un mot", exp: "Une cmdlet est l'unité de commande de PowerShell." },
    { type: "input", q: "Complète : chaque case d'information d'un objet (Name, Department…) est un ______.", a: ["attribut", "attribute"], ph: "un mot", exp: "Les attributs décrivent l'objet, comme les lignes d'une fiche." },
    { type: "input", q: "Complète le verbe : la cmdlet qui LIT une fiche existante commence par Get, celle qui CRÉE commence par ______.", a: ["New", "new"], ph: "un verbe anglais", exp: "New- crée un nouvel objet (New-ADUser)." },
    { type: "input", q: "Complète : dans un DN, le morceau OU= désigne un tiroir appelé unité d'______.", a: ["organisation", "organization"], ph: "un mot", exp: "OU = Organizational Unit, un dossier de rangement." },
    { type: "vf", q: "Un domaine ne peut avoir qu'un seul contrôleur de domaine.", a: false, exp: "Il en faut plusieurs pour la tolérance de panne : si l'un tombe, un autre prend le relais." },
    { type: "vf", q: "Automatiser avec des scripts permet de créer des centaines de comptes de façon identique et rapide.", a: true, exp: "C'est l'intérêt principal de PowerShell face au clic manuel." },
    { type: "vf", q: "Dans un DN, on lit CN d'abord, puis l'OU, puis les DC : de l'objet vers la racine du domaine.", a: true, exp: "Comme une adresse à l'envers : la personne, le tiroir, puis l'immeuble." },
    { type: "qcm", q: "Quel préfixe de cmdlet sert à SUPPRIMER un objet ?", opts: ["Get-", "New-", "Set-", "Remove-"], a: 3, exp: "Remove- supprime, Set- modifie, Get- lit, New- crée." }
  ],
  final: {
    title: "Exercice final — Cartographier une petite entreprise",
    intro: `<p>La société <strong>Contoso</strong> possède un domaine <code>contoso.local</code>, deux contrôleurs de domaine, et une utilisatrice Marie Martin (identifiant <code>mmartin</code>) rangée dans le tiroir « Ventes ». Retrouve le vocabulaire à partir de ce schéma :</p>
<pre class="pseudo">Foret contoso.local
  └─ Domaine contoso.local
       ├─ DC1 (controleur de domaine)     # gardien numero 1
       ├─ DC2 (controleur de domaine)     # gardien numero 2 (secours)
       └─ OU=Ventes
            └─ CN=Marie Martin  (SamAccountName = mmartin)   # une fiche utilisateur</pre>`,
    questions: [
      { type: "qcm", q: "Combien de contrôleurs de domaine possède Contoso ?", opts: ["Aucun", "Un", "Deux", "Dix"], a: 2, exp: "DC1 et DC2 : deux gardiens, dont un de secours." },
      { type: "input", q: "Quel est l'identifiant de connexion (SamAccountName) de Marie ?", a: ["mmartin", "MMartin"], ph: "un identifiant", exp: "SamAccountName = mmartin." },
      { type: "input", q: "Reconstitue le DN de Marie : CN=Marie Martin,OU=Ventes,DC=contoso,DC=______", a: ["local", "Local"], ph: "un mot", exp: "Le domaine contoso.local donne DC=contoso,DC=local." },
      { type: "qcm", q: "Le tiroir « Ventes » qui contient Marie est un(e)…", opts: ["forêt", "unité d'organisation (OU)", "cmdlet", "attribut"], a: 1, exp: "Une OU est un dossier qui range les objets." },
      { type: "qcm", q: "Pour LIRE la fiche de Marie sans cliquer, quelle famille de cmdlet utiliser ?", opts: ["New-", "Get-", "Remove-", "Restart-"], a: 1, exp: "Get- lit un objet existant : Get-ADUser -Identity mmartin." }
    ],
    solution: `<p>Le DN complet de Marie assemble sa fiche, son tiroir et son domaine :</p>
<pre class="pseudo">CN=Marie Martin,OU=Ventes,DC=contoso,DC=local   # adresse unique de Marie dans l'annuaire
# CN  : l'objet lui-meme (Marie Martin)
# OU  : le tiroir Ventes qui la contient
# DC  : les deux morceaux du domaine contoso.local</pre>
<p>Pour la consulter par script, une seule ligne suffit :</p>
<pre class="pseudo">Get-ADUser -Identity mmartin   # lit la fiche de Marie a partir de son identifiant</pre>
<p>Tu maîtrises maintenant le vocabulaire : annuaire, domaine, forêt, contrôleur de domaine, objet, attribut, LDAP, DN et cmdlet. C'est la fondation de tout le reste du cours.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  items: [
  { id: "adps-j01", title: "Décrire son futur annuaire", level: 1,
    statement: "Ton entreprise s'appelle <code>Fabrikam</code> et utilisera le domaine <code>fabrikam.local</code>. En commentaires PowerShell (lignes commençant par #), écris un mini plan qui nomme : le nom de la forêt, le nom du domaine, combien de contrôleurs de domaine tu prévois, et le DN qu'aurait un utilisateur <code>pdurand</code> placé dans une OU <code>Direction</code>.",
    hints: [
      "Une ligne de commentaire PowerShell commence par le caractère #.",
      "Le premier domaine créé donne son nom à la forêt.",
      "Un DN s'écrit CN=...,OU=...,DC=fabrikam,DC=local."
    ],
    solution: "# --- Plan de l'annuaire Fabrikam ---\n# Foret        : fabrikam.local  (le premier domaine cree nomme la foret)\n# Domaine      : fabrikam.local  (l'immeuble qui regroupe comptes et regles)\n# Controleurs  : 2 controleurs de domaine (DC1 principal, DC2 de secours)\n# Objet exemple: utilisateur pdurand (Pierre Durand)\n# DN de pdurand: CN=Pierre Durand,OU=Direction,DC=fabrikam,DC=local\n#   CN = la fiche de Pierre\n#   OU = le tiroir Direction\n#   DC = les deux morceaux du domaine fabrikam.local",
    note: "Sur un vrai projet, on dessine toujours cette cartographie AVANT de créer quoi que ce soit : nom de forêt et de domaine sont très difficiles à changer ensuite." }
  ]
};
</script>
