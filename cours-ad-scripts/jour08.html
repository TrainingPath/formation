<script>
var DAY = {
  num: 8,
  title: "Créer des utilisateurs en masse (import CSV)",
  subtitle: "Fabriquer 300 comptes en une boucle à partir d'un fichier tableur.",
  theory: `
<h3>1. Le problème du volume</h3>
<p>Créer un compte à la main (jour 7) est simple. Mais à la rentrée, on reçoit parfois une liste de 300 nouveaux employés. Les créer un par un serait interminable. La solution : une <strong>liste</strong> dans un fichier, et une <strong>boucle</strong> qui répète New-ADUser pour chaque ligne.</p>
<h3>2. Le fichier CSV</h3>
<p>Un <strong>CSV</strong> (<em>Comma-Separated Values</em>, « valeurs séparées par des virgules ») est un fichier texte qui représente un tableau. La première ligne donne les <strong>en-têtes</strong> (les noms de colonnes) ; chaque ligne suivante est une fiche. C'est ce qu'Excel enregistre quand on choisit « CSV ».</p>
<pre class="pseudo">Prenom,Nom,Identifiant,Service          # ligne d'en-tetes : les noms de colonnes
Jean,Dupont,jdupont,Comptabilite        # une fiche = une future personne
Marie,Martin,mmartin,Ventes             # autre fiche
Lucas,Petit,lpetit,Informatique         # encore une</pre>
<div class="tip">Les en-têtes deviendront des <strong>attributs</strong> utilisables dans le script : la colonne Prenom se lira <code>$ligne.Prenom</code>. Choisis des en-têtes clairs et sans espaces.</div>
<h3>3. Lire le CSV : Import-Csv</h3>
<p>La cmdlet <code>Import-Csv</code> lit le fichier et le transforme en une liste d'objets, un par ligne. Chaque objet possède un attribut par colonne. On range cette liste dans une variable.</p>
<pre class="pseudo">$liste = Import-Csv -Path "C:\Temp\employes.csv"   # lit le CSV et range la liste d'objets dans $liste
$liste                                              # affiche toutes les lignes lues
$liste.Count                                       # combien de lignes (fiches) a-t-on lu ?</pre>
<h3>4. La boucle foreach</h3>
<p>Pour traiter chaque ligne, on utilise la boucle <code>foreach</code> (« pour chaque »). Elle prend les objets un par un et exécute le même bloc de code pour chacun. La variable de boucle (ici <code>$u</code>) représente la ligne en cours.</p>
<pre class="pseudo">foreach (\$u in \$liste) {          # pour chaque ligne \$u de la liste \$liste
    Write-Output \$u.Prenom        # affiche le prenom de la ligne courante
}                                 # fin du bloc repete pour chaque ligne</pre>
<div class="warn">Le dollar est nécessaire partout : <code>$liste</code>, <code>$u</code>, et <code>$u.Prenom</code>. La variable <code>$u</code> change à chaque tour de boucle et pointe la ligne suivante.</div>
<h3>5. Créer les comptes dans la boucle</h3>
<p>On place <code>New-ADUser</code> à l'intérieur de la boucle, en piochant chaque valeur dans la ligne courante. Le mot de passe temporaire peut être commun à tous (ils devront le changer).</p>
<pre class="pseudo">\$pwd = ConvertTo-SecureString "Bienvenue2024!" -AsPlainText -Force   # mot de passe temporaire commun
foreach (\$u in \$liste) {                                            # pour chaque future personne
    New-ADUser -Name "\$(\$u.Prenom) \$(\$u.Nom)" \`
      -GivenName \$u.Prenom -Surname \$u.Nom \`
      -SamAccountName \$u.Identifiant \`
      -Department \$u.Service \`
      -AccountPassword \$pwd -Enabled \$true -ChangePasswordAtLogon \$true   # cree le compte de cette ligne
}                                                                    # tour suivant : personne suivante
# "\$(\$u.Prenom) \$(\$u.Nom)" assemble le nom complet a partir de deux colonnes</pre>
<h3>6. Se protéger des erreurs</h3>
<p>Sur 300 comptes, un identifiant peut déjà exister et faire planter la boucle. On protège chaque création avec <code>try / catch</code> : <em>essaie</em> de créer, et <em>en cas d'erreur</em>, note-la et continue au lieu de tout arrêter.</p>
<pre class="pseudo">foreach (\$u in \$liste) {                     # pour chaque ligne
    try {                                     # tente la creation
        New-ADUser -Name \$u.Identifiant -SamAccountName \$u.Identifiant -Enabled \$false   # creation
    } catch {                                 # en cas d'erreur (ex. doublon)
        Write-Warning "Echec pour \$(\$u.Identifiant)"   # signale et continue avec la ligne suivante
    }
}</pre>
<h3>7. Toujours tester d'abord</h3>
<p>Avant de lancer sur 300 comptes réels, on teste sur un CSV de 2 ou 3 lignes, dans un labo. On peut aussi ajouter <code>-WhatIf</code> à New-ADUser pour simuler la boucle entière sans rien créer.</p>
<pre class="pseudo">foreach (\$u in \$liste) {                              # parcourt le CSV
    New-ADUser -Name \$u.Identifiant -WhatIf            # SIMULE la creation de chaque ligne
}                                                     # aucun compte n'est reellement cree</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie CSV ?", opts: ["Compte Système Vérifié", "Comma-Separated Values (valeurs séparées par des virgules)", "Central Server Volume", "Create Secure Vault"], a: 1, exp: "Un CSV est un tableau texte, colonnes séparées par des virgules." },
    { type: "qcm", q: "À quoi sert la première ligne d'un CSV ?", opts: ["À rien", "Elle donne les en-têtes (noms de colonnes)", "C'est un mot de passe", "C'est le total"], a: 1, exp: "Les en-têtes nomment les colonnes et deviennent des attributs." },
    { type: "qcm", q: "Quelle cmdlet lit un fichier CSV en objets PowerShell ?", opts: ["Read-File", "Import-Csv", "Get-Content", "New-Csv"], a: 1, exp: "Import-Csv transforme chaque ligne en objet." },
    { type: "qcm", q: "À quoi sert la boucle foreach ?", opts: ["À trier", "À répéter le même code pour chaque élément d'une liste", "À supprimer un fichier", "À créer une variable"], a: 1, exp: "foreach traite les objets un par un." },
    { type: "qcm", q: "Dans foreach ($u in $liste), que représente $u ?", opts: ["Le fichier entier", "La ligne (l'objet) en cours de traitement", "Le mot de passe", "Le nombre de lignes"], a: 1, exp: "$u pointe la ligne courante à chaque tour." },
    { type: "input", q: "Complète : pour lire employes.csv, on écrit Import-______ -Path \"C:\\Temp\\employes.csv\" .", a: ["Csv", "CSV", "csv"], ph: "un mot", exp: "Import-Csv lit le fichier." },
    { type: "input", q: "Complète : pour lire la colonne Prenom de la ligne courante, on écrit $u.______ .", a: ["Prenom", "prenom"], ph: "une colonne", exp: "$u.Prenom lit l'attribut issu de l'en-tête Prenom." },
    { type: "input", q: "Complète le mot-clé de boucle : ______ ($u in $liste) { ... } .", a: ["foreach", "ForEach", "Foreach"], ph: "un mot-clé", exp: "foreach répète le bloc pour chaque élément." },
    { type: "input", q: "Complète : pour connaître le nombre de lignes lues, on lit $liste.______ .", a: ["Count", "count"], ph: "un attribut", exp: "$liste.Count donne le nombre d'éléments." },
    { type: "input", q: "Complète : pour continuer malgré une erreur sur une ligne, on entoure la création de try / ______ .", a: ["catch", "Catch"], ph: "un mot-clé", exp: "try/catch capture l'erreur et poursuit la boucle." },
    { type: "input", q: "Complète : pour SIMULER la boucle sans rien créer, on ajoute -______ à New-ADUser.", a: ["WhatIf", "whatif"], ph: "un paramètre", exp: "-WhatIf simule chaque création." },
    { type: "vf", q: "Import-Csv renvoie une liste d'objets, un par ligne du fichier.", a: true, exp: "Chaque ligne devient un objet avec un attribut par colonne." },
    { type: "vf", q: "Sans try/catch, une seule ligne en erreur peut interrompre toute la boucle.", a: true, exp: "C'est pourquoi on protège chaque création pour continuer malgré un doublon." },
    { type: "vf", q: "Il est prudent de tester le script sur 2-3 lignes avant de lancer sur 300 comptes réels.", a: true, exp: "On valide en labo sur un petit échantillon avant la production." },
    { type: "qcm", q: "Comment assembler le nom complet à partir de deux colonnes Prenom et Nom ?", opts: ["$u.Prenom + Nom", "\"$($u.Prenom) $($u.Nom)\"", "Prenom-Nom", "$u,Prenom,Nom"], a: 1, exp: "\"$($u.Prenom) $($u.Nom)\" insère les deux valeurs dans une chaîne." }
  ],
  final: {
    title: "Exercice final — La rentrée des nouveaux",
    intro: `<p>Le fichier <code>C:\\Temp\\nouveaux.csv</code> contient les colonnes Prenom, Nom, Identifiant, Service. Tu dois créer tous les comptes, actifs, mot de passe temporaire commun à changer au premier login, en continuant malgré d'éventuels doublons. Étudie la trame :</p>
<pre class="pseudo">\$liste = Import-Csv -Path "C:\Temp\nouveaux.csv"                       # lit toutes les lignes
\$pwd = ConvertTo-SecureString "Rentree2024!" -AsPlainText -Force      # mot de passe temporaire commun
foreach (\$u in \$liste) {                                             # pour chaque future personne
    try {
        New-ADUser -Name "\$(\$u.Prenom) \$(\$u.Nom)" -SamAccountName \$u.Identifiant -Department \$u.Service -AccountPassword \$pwd -Enabled \$true -ChangePasswordAtLogon \$true
    } catch { Write-Warning "Echec: \$(\$u.Identifiant)" }             # note l'echec et continue
}</pre>`,
    questions: [
      { type: "input", q: "Quelle cmdlet charge le CSV dans $liste ?", a: ["Import-Csv", "import-csv", "Import-CSV"], ph: "Import-...", exp: "Import-Csv -Path ..." },
      { type: "input", q: "Quel mot-clé parcourt chaque ligne de $liste ?", a: ["foreach", "ForEach", "Foreach"], ph: "un mot-clé", exp: "foreach ($u in $liste)." },
      { type: "qcm", q: "Pourquoi le try/catch est-il utile ici ?", opts: ["Pour trier les lignes", "Pour qu'un doublon n'arrête pas toute la boucle : on note l'échec et on continue", "Pour aller plus vite", "Pour supprimer le CSV"], a: 1, exp: "L'erreur est capturée, la boucle poursuit avec les autres lignes." },
      { type: "input", q: "Comment lit-on le service de la ligne courante ? ($u puis…)", a: [".Service", "Service", "$u.Service"], ph: ".Xxxx", exp: "$u.Service lit la colonne Service." },
      { type: "qcm", q: "Comment tester ce script sans créer de vrais comptes ?", opts: ["Le lancer tel quel en production", "Ajouter -WhatIf à New-ADUser pour simuler", "Supprimer le foreach", "Enlever le mot de passe"], a: 1, exp: "-WhatIf simule chaque création sans rien écrire." }
    ],
    solution: `<p>Le script d'import en masse, robuste et testable :</p>
<pre class="pseudo">\$liste = Import-Csv -Path "C:\Temp\nouveaux.csv"                       # 1) lit le tableau en objets
\$pwd = ConvertTo-SecureString "Rentree2024!" -AsPlainText -Force      # 2) mot de passe temporaire commun
foreach (\$u in \$liste) {                                             # 3) boucle sur chaque ligne
    try {                                                            #    tente la creation
        New-ADUser -Name "\$(\$u.Prenom) \$(\$u.Nom)" \`
          -GivenName \$u.Prenom -Surname \$u.Nom \`
          -SamAccountName \$u.Identifiant \`
          -Department \$u.Service \`
          -AccountPassword \$pwd -Enabled \$true -ChangePasswordAtLogon \$true   # cree le compte de la ligne
    } catch {                                                        #    en cas d'erreur (ex. doublon)
        Write-Warning "Echec pour \$(\$u.Identifiant)"                #    signale et passe a la suivante
    }
}
Write-Output "\$(\$liste.Count) lignes traitees"                       # bilan : nombre de lignes parcourues</pre>
<p>Une boucle, un fichier, et des centaines de comptes créés de façon fiable. Au jour 9, nous verrons comment MODIFIER ces comptes existants avec Set-ADUser.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  { id: "adps-j08", title: "Import CSV en boucle", level: 3,
    statement: "Le fichier <code>C:\\Temp\\stagiaires.csv</code> a les colonnes Prenom, Nom, Identifiant. Écris un script qui lit ce CSV, prépare un mot de passe temporaire commun, puis crée pour chaque ligne un compte actif (nom = « Prenom Nom », identifiant = Identifiant, changement de mot de passe au premier login), en continuant malgré une erreur sur une ligne. Commente chaque ligne.",

    solution: "$liste = Import-Csv -Path \"C:\\Temp\\stagiaires.csv\"                    # lit le CSV en une liste d'objets\n$pwd = ConvertTo-SecureString \"Stage2024!\" -AsPlainText -Force        # mot de passe temporaire commun securise\nforeach ($u in $liste) {                                              # pour chaque ligne du fichier\n    try {                                                            # tente la creation du compte\n        New-ADUser -Name \"$($u.Prenom) $($u.Nom)\" -SamAccountName $u.Identifiant -AccountPassword $pwd -Enabled $true -ChangePasswordAtLogon $true   # cree le compte de la ligne\n    } catch {                                                        # en cas d'erreur (ex. doublon)\n        Write-Warning \"Echec pour $($u.Identifiant)\"                 # signale et continue avec la suivante\n    }\n}                                                                    # fin de la boucle",

  ]
};
</script>
