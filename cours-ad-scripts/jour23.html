<script>
var DAY = {
  num: 23,
  title: "Générer des rapports AD",
  subtitle: "Transformer l'annuaire en tableaux clairs, exportables et partageables.",
  theory: `
<h3>1. Pourquoi des rapports ?</h3>
<p>Un administrateur doit régulièrement répondre à des questions : « Combien d'utilisateurs sont désactivés ? », « Qui ne s'est pas connecté depuis 90 jours ? », « Liste des membres du groupe Admins ». Plutôt que de cliquer partout, on produit un <strong>rapport</strong> : un tableau de données extrait de l'annuaire, que l'on peut lire, filtrer et exporter vers un fichier.</p>
<h3>2. Récupérer les données : Get-ADUser -Filter</h3>
<p>Pour interroger plusieurs objets d'un coup, on utilise le paramètre <code>-Filter</code> (un <strong>filtre</strong> est une condition qui ne garde que les objets voulus). <code>-Filter *</code> prend tout ; une condition restreint la sélection :</p>
<pre class="pseudo">Get-ADUser -Filter *                       # TOUS les utilisateurs
Get-ADUser -Filter "Enabled -eq $false"    # seulement les comptes DESACTIVES (Enabled egal a faux)
Get-ADUser -Filter "Department -eq 'Ventes'"   # seulement les utilisateurs du service Ventes</pre>
<div class="tip">Dans un filtre, on compare avec des opérateurs préfixés d'un tiret : <code>-eq</code> (égal), <code>-ne</code> (différent), <code>-lt</code> (plus petit), <code>-gt</code> (plus grand). Ce sont les mêmes qu'on utilise partout en PowerShell.</div>
<h3>3. Choisir et renommer les colonnes : Select-Object</h3>
<p>On garde seulement les rubriques utiles avec <code>Select-Object</code>. On peut aussi calculer une colonne (une <strong>propriété calculée</strong>) avec un petit dictionnaire Name/Expression :</p>
<pre class="pseudo">Get-ADUser -Filter * -Properties Department,LastLogonDate |   # recupere aussi le service et la derniere connexion
    Select-Object Name, Department, LastLogonDate            # ne garde que ces trois colonnes</pre>
<h3>4. Trier et grouper</h3>
<p>Deux cmdlets rendent le rapport lisible. <code>Sort-Object</code> range les lignes dans l'ordre ; <code>Group-Object</code> regroupe et compte par catégorie :</p>
<pre class="pseudo">... | Sort-Object Department            # trie les lignes par service (ordre alphabetique)
... | Group-Object Department          # regroupe par service et donne le NOMBRE dans chaque groupe</pre>
<p><code>Group-Object Department</code> répond d'un coup à « combien d'utilisateurs par service ? ».</p>
<h3>5. Exporter : CSV et HTML</h3>
<p>Un rapport se partage mieux en fichier. Deux formats reviennent souvent. Le <strong>CSV</strong> (Comma-Separated Values, « valeurs séparées par des virgules ») est un tableau texte que Excel ouvre directement. L'<strong>HTML</strong> produit une page web présentable :</p>
<pre class="pseudo">... | Export-Csv -Path "C:\Rapports\liste.csv" -NoTypeInformation -Encoding UTF8   # exporte en CSV (lisible par Excel)
... | ConvertTo-Html -Title "Utilisateurs" | Out-File "C:\Rapports\liste.html"    # produit une page HTML</pre>
<div class="warn">Le paramètre <code>-NoTypeInformation</code> évite qu'Excel affiche une première ligne technique inutile. Pense aussi à <code>-Encoding UTF8</code> pour que les accents s'affichent correctement.</div>
<h3>6. Un rapport complet en une ligne (le pipeline)</h3>
<p>La force de PowerShell est d'enchaîner ces étapes avec le <strong>pipe</strong> : chaque cmdlet passe son résultat à la suivante, comme une chaîne de montage. Récupérer, filtrer, choisir, trier, exporter — tout se lit de gauche à droite :</p>
<pre class="pseudo">Get-ADUser -Filter "Enabled -eq $false" -Properties LastLogonDate |   # 1. prend les comptes desactives
    Select-Object Name, LastLogonDate |                              # 2. garde nom + derniere connexion
    Sort-Object Name |                                               # 3. trie par nom
    Export-Csv "C:\Rapports\desactives.csv" -NoTypeInformation -Encoding UTF8   # 4. exporte en CSV</pre>
<div class="tip">Retiens le schéma : Get- (récupérer) puis filtrer/choisir/trier puis Export- ou ConvertTo-. C'est la recette de presque tous les rapports AD.</div>`,
  exercises: [
    { type: "qcm", q: "À quoi sert le paramètre <code>-Filter</code> ?", opts: ["À supprimer des objets", "À ne garder que les objets répondant à une condition", "À trier", "À exporter"], a: 1, exp: "Le filtre sélectionne les objets voulus." },
    { type: "qcm", q: "Que renvoie <code>Get-ADUser -Filter *</code> ?", opts: ["Rien", "Tous les utilisateurs", "Un seul utilisateur", "Les groupes"], a: 1, exp: "L'astérisque prend tous les objets." },
    { type: "qcm", q: "Quel opérateur signifie « égal » dans un filtre PowerShell ?", opts: ["-eq", "-ne", "-gt", "="], a: 0, exp: "-eq = égal ; -ne = différent." },
    { type: "qcm", q: "Que fait <code>Group-Object Department</code> ?", opts: ["Supprime les services", "Regroupe et compte les utilisateurs par service", "Trie par nom", "Exporte en CSV"], a: 1, exp: "Il regroupe par catégorie et donne le nombre dans chaque groupe." },
    { type: "qcm", q: "Quel format est un tableau texte que Excel ouvre directement ?", opts: ["HTML", "CSV", "PNG", "EXE"], a: 1, exp: "CSV = valeurs séparées par des virgules." },
    { type: "qcm", q: "Que fait <code>Sort-Object Name</code> ?", opts: ["Compte les noms", "Range les lignes par nom", "Supprime les noms", "Filtre les noms"], a: 1, exp: "Sort-Object trie les lignes selon la propriété donnée." },
    { type: "input", q: "Quelle cmdlet EXPORTE un résultat en fichier CSV ? (Verbe-Nom)", a: ["Export-Csv", "export-csv"], ph: "Verbe-Csv", exp: "Export-Csv écrit un fichier CSV." },
    { type: "input", q: "Quelle cmdlet CHOISIT les colonnes affichées ? (Verbe-Nom)", a: ["Select-Object", "select-object", "Select"], ph: "Verbe-Object", exp: "Select-Object garde les propriétés voulues." },
    { type: "input", q: "Quel paramètre de Export-Csv évite la ligne technique en tête de fichier ? (avec le tiret)", a: ["-NoTypeInformation", "NoTypeInformation"], ph: "-Xxxx", exp: "-NoTypeInformation retire l'en-tête de type." },
    { type: "input", q: "Quelle cmdlet produit une page HTML à partir d'un résultat ? (Verbe-Nom)", a: ["ConvertTo-Html", "convertto-html"], ph: "Verbe-Html", exp: "ConvertTo-Html génère du HTML, souvent suivi de Out-File." },
    { type: "input", q: "Quel paramètre de -Filter garde les comptes désactivés : \"Enabled -eq ___\" ?", a: ["$false", "false"], ph: "$xxxx", exp: "Enabled -eq $false cible les comptes désactivés." },
    { type: "input", q: "Comment s'appelle le symbole | qui enchaîne les cmdlets ?", a: ["pipe", "le pipe", "pipeline"], ph: "un mot", exp: "Le pipe passe le résultat d'une cmdlet à la suivante." },
    { type: "vf", q: "Le pipe permet d'enchaîner récupérer, filtrer, trier et exporter en une seule ligne.", a: true, exp: "Chaque cmdlet transmet son résultat à la suivante." },
    { type: "vf", q: "-Encoding UTF8 aide à afficher correctement les accents dans le CSV.", a: true, exp: "UTF8 gère les caractères accentués." },
    { type: "vf", q: "Group-Object sert à trier les lignes par ordre alphabétique.", a: false, exp: "Trier, c'est Sort-Object ; Group-Object regroupe et compte." }
  ],
  final: {
    title: "Exercice final — Rapport des comptes inactifs",
    intro: `<p>La direction veut la liste des comptes ACTIVÉS qui ne se sont pas connectés récemment, avec nom et date de dernière connexion, exportée en CSV.</p>
<pre class="pseudo">Get-ADUser -Filter "Enabled -eq $true" -Properties LastLogonDate |   # comptes actifs + derniere connexion
    Select-Object Name, LastLogonDate |                             # colonnes utiles
    Sort-Object LastLogonDate |                                     # les plus anciens d'abord
    Export-Csv "C:\Rapports\inactifs.csv" -NoTypeInformation -Encoding UTF8   # export CSV</pre>`,
    questions: [
      { type: "qcm", q: "Pourquoi ajouter <code>-Properties LastLogonDate</code> ?", opts: ["Pour trier", "Car LastLogonDate n'est pas un attribut de base : il faut le demander", "Pour exporter", "Pour supprimer le compte"], a: 1, exp: "Sans -Properties, cet attribut ne serait pas récupéré." },
      { type: "input", q: "Quelle cmdlet garde seulement Name et LastLogonDate ? (Verbe-Nom)", a: ["Select-Object", "select-object", "Select"], ph: "Verbe-Object", exp: "Select-Object choisit les colonnes." },
      { type: "input", q: "Quelle cmdlet range les lignes de la plus ancienne connexion à la plus récente ? (Verbe-Nom)", a: ["Sort-Object", "sort-object"], ph: "Verbe-Object", exp: "Sort-Object LastLogonDate trie par date." },
      { type: "qcm", q: "Quel paramètre évite la ligne technique en tête du CSV ?", opts: ["-Encoding", "-NoTypeInformation", "-Filter", "-Path"], a: 1, exp: "-NoTypeInformation nettoie l'en-tête." },
      { type: "input", q: "Quelle cmdlet écrit finalement le fichier CSV ? (Verbe-Nom)", a: ["Export-Csv", "export-csv"], ph: "Verbe-Csv", exp: "Export-Csv produit le fichier." }
    ],
    solution: `<p>Le pipeline complet, commenté étape par étape :</p>
<pre class="pseudo">Import-Module ActiveDirectory                                           # charge les cmdlets AD
Get-ADUser -Filter "Enabled -eq $true" -Properties LastLogonDate |      # 1. comptes actifs + date de connexion
    Select-Object Name, LastLogonDate |                                # 2. garde nom et derniere connexion
    Sort-Object LastLogonDate |                                        # 3. trie du plus ancien au plus recent
    Export-Csv "C:\Rapports\inactifs.csv" -NoTypeInformation -Encoding UTF8   # 4. exporte un CSV lisible par Excel</pre>
<p>La recette universelle : Get- pour récupérer, Select/Sort pour mettre en forme, Export- pour partager. Le même schéma sert à tous les rapports AD.</p>`
  }
};
</script>
