<script>
var DAY = {
  num: 28,
  title: "Sécurité : audit et comptes à risque",
  subtitle: "Débusquer les comptes qui affaiblissent la sécurité du domaine.",
  theory: `
<h3>1. Pourquoi auditer les comptes</h3>
<p><strong>Auditer</strong>, c'est passer l'annuaire en revue pour repérer ce qui cloche. Avec le temps, un domaine accumule des <strong>comptes à risque</strong> : d'anciens employés jamais désactivés, des mots de passe qui n'expirent jamais, des comptes membres de groupes trop puissants… Chacun est une porte d'entrée possible pour un attaquant. Un audit régulier permet de fermer ces portes.</p>
<h3>2. Les comptes inactifs</h3>
<p>Un compte encore actif alors que la personne est partie est dangereux : personne ne le surveille. On les repère par leur date de dernière connexion (<code>LastLogonDate</code>) ancienne. La cmdlet spécialisée <code>Search-ADAccount</code> facilite cela :</p>
<pre class="pseudo">Search-ADAccount -AccountInactive -TimeSpan 90.00:00:00   # comptes sans connexion depuis 90 jours
# -AccountInactive : cherche les comptes inactifs
# -TimeSpan        : la duree d'inactivite (ici 90 jours, au format jours.heures:min:sec)</pre>
<h3>3. Les comptes désactivés ou verrouillés</h3>
<p>Un compte <strong>verrouillé</strong> (locked) l'a souvent été après trop de mauvais mots de passe : cela peut trahir une tentative d'attaque. Un compte <strong>désactivé</strong> (disabled) devrait, à terme, être supprimé pour ne pas encombrer. On les liste facilement :</p>
<pre class="pseudo">Search-ADAccount -LockedOut     # comptes actuellement verrouilles (a surveiller)
Search-ADAccount -AccountDisabled   # comptes desactives (a nettoyer regulierement)</pre>
<h3>4. Les mots de passe à problème</h3>
<p>Deux réglages sont particulièrement risqués. <strong>PasswordNeverExpires</strong> : le mot de passe n'expire jamais, donc peut rester le même pendant des années. <strong>PasswordNotRequired</strong> : le compte peut ne pas avoir de mot de passe du tout. On les traque avec un filtre :</p>
<pre class="pseudo">Get-ADUser -Filter "PasswordNeverExpires -eq $true" -Properties PasswordNeverExpires   # mots de passe qui n'expirent jamais
Get-ADUser -Filter "PasswordNotRequired -eq $true" -Properties PasswordNotRequired     # comptes sans mot de passe obligatoire</pre>
<div class="warn">Un compte administrateur avec « mot de passe qui n'expire jamais » ET « membre des Admins du domaine » est une cible de choix. Ces comptes méritent une attention et une protection renforcées.</div>
<h3>5. Les groupes trop puissants</h3>
<p>Le groupe <strong>Domain Admins</strong> (« Administrateurs du domaine ») donne un pouvoir quasi total. On doit savoir EXACTEMENT qui en fait partie et vérifier que c'est justifié. On lit les membres d'un groupe avec <code>Get-ADGroupMember</code> :</p>
<pre class="pseudo">Get-ADGroupMember -Identity "Domain Admins"   # liste les membres du groupe le plus puissant du domaine
# Regle : ce groupe doit rester le plus PETIT possible (principe du moindre privilege, jour 20)</pre>
<h3>6. L'audit d'événements</h3>
<p>Au-delà des comptes, Windows peut <strong>journaliser</strong> (enregistrer) les événements de sécurité : connexions réussies ou échouées, modifications d'objets… Ces traces vont dans le <strong>journal de sécurité</strong>, qu'on lit avec <code>Get-WinEvent</code>. Exemple : repérer les échecs de connexion (événement 4625) :</p>
<pre class="pseudo">Get-WinEvent -FilterHashtable @{ LogName='Security'; Id=4625 } -MaxEvents 20   # 20 derniers ECHECS de connexion
# LogName=Security : le journal de securite
# Id=4625          : le code d'evenement "echec d'ouverture de session"
# -MaxEvents 20    : ne remonte que les 20 plus recents</pre>
<div class="tip">Un audit efficace combine les deux angles : l'ÉTAT des comptes (inactifs, mots de passe faibles, groupes sensibles) et les ÉVÉNEMENTS (qui tente de se connecter, quand, avec quel résultat).</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie <strong>auditer</strong> l'annuaire ?", opts: ["Le supprimer", "Le passer en revue pour repérer ce qui pose un risque", "Le sauvegarder", "Le répliquer"], a: 1, exp: "L'audit cherche les faiblesses de sécurité." },
    { type: "qcm", q: "Pourquoi un compte d'ancien employé encore actif est-il risqué ?", opts: ["Il est lent", "Personne ne le surveille : porte d'entrée pour un attaquant", "Il coûte cher", "Il crée des GPO"], a: 1, exp: "Un compte inactif mais actif est une cible discrète." },
    { type: "qcm", q: "Que trahit souvent un compte <strong>verrouillé</strong> ?", opts: ["Un mot de passe trop court", "De nombreuses tentatives de mot de passe (peut-être une attaque)", "Une GPO", "Une réplication"], a: 1, exp: "Le verrouillage suit trop d'échecs de connexion." },
    { type: "qcm", q: "Pourquoi <strong>PasswordNeverExpires</strong> est-il risqué ?", opts: ["Le compte est plus rapide", "Le mot de passe peut rester le même pendant des années", "Le compte est désactivé", "Rien de risqué"], a: 1, exp: "Un mot de passe jamais renouvelé finit par fuiter." },
    { type: "qcm", q: "Quel groupe doit rester le plus PETIT possible ?", opts: ["Utilisateurs du domaine", "Domain Admins (Administrateurs du domaine)", "Invités", "Tout le monde"], a: 1, exp: "Ce groupe très puissant applique le moindre privilège." },
    { type: "qcm", q: "Que contient le <strong>journal de sécurité</strong> de Windows ?", opts: ["Les fichiers Word", "Les événements de sécurité : connexions réussies/échouées, modifications…", "Les GPO", "Les sauvegardes"], a: 1, exp: "On l'analyse avec Get-WinEvent." },
    { type: "input", q: "Quelle cmdlet spécialisée cherche les comptes inactifs, verrouillés ou désactivés ? (Verbe-Nom)", a: ["Search-ADAccount", "search-adaccount"], ph: "Verbe-ADAccount", exp: "Search-ADAccount avec -AccountInactive, -LockedOut, -AccountDisabled." },
    { type: "input", q: "Quel paramètre de Search-ADAccount liste les comptes VERROUILLÉS ? (avec le tiret)", a: ["-LockedOut", "LockedOut"], ph: "-Xxxx", exp: "Search-ADAccount -LockedOut." },
    { type: "input", q: "Quelle cmdlet liste les MEMBRES d'un groupe ? (Verbe-Nom)", a: ["Get-ADGroupMember", "get-adgroupmember"], ph: "Verbe-ADGroupMember", exp: "Get-ADGroupMember -Identity 'Domain Admins'." },
    { type: "input", q: "Quelle cmdlet lit les événements du journal de sécurité ? (Verbe-Nom)", a: ["Get-WinEvent", "get-winevent"], ph: "Verbe-WinEvent", exp: "Get-WinEvent interroge les journaux Windows." },
    { type: "input", q: "Complète le filtre des mots de passe éternels : \"PasswordNeverExpires -eq ___\"", a: ["$true", "true"], ph: "$xxxx", exp: "PasswordNeverExpires -eq $true." },
    { type: "input", q: "Quel identifiant d'événement (Id) correspond à un ÉCHEC de connexion ? (un nombre)", a: ["4625", "Id 4625"], ph: "un nombre", exp: "L'événement 4625 = échec d'ouverture de session." },
    { type: "vf", q: "Un attribut PasswordNotRequired à $true signifie que le compte peut n'avoir aucun mot de passe.", a: true, exp: "C'est un réglage très risqué à corriger." },
    { type: "vf", q: "Il faut connaître exactement les membres du groupe Domain Admins.", a: true, exp: "Ce groupe très puissant doit être strictement contrôlé." },
    { type: "vf", q: "Un audit complet ne regarde que l'état des comptes, jamais les événements.", a: false, exp: "Un bon audit combine état des comptes ET événements." }
  ],
  final: {
    title: "Exercice final — Chasse aux comptes à risque",
    intro: `<p>La direction demande un point sécurité : comptes inactifs depuis 90 jours, mots de passe qui n'expirent jamais, et membres de Domain Admins.</p>
<pre class="pseudo">Search-ADAccount -AccountInactive -TimeSpan 90.00:00:00        # comptes dormants
Get-ADUser -Filter "PasswordNeverExpires -eq $true"           # mots de passe eternels
Get-ADGroupMember -Identity "Domain Admins"                   # qui est administrateur du domaine</pre>`,
    questions: [
      { type: "input", q: "Quelle cmdlet trouve les comptes inactifs ? (Verbe-Nom)", a: ["Search-ADAccount", "search-adaccount"], ph: "Verbe-ADAccount", exp: "Search-ADAccount -AccountInactive." },
      { type: "qcm", q: "Que faire d'un compte inactif appartenant à un employé parti ?", opts: ["Le laisser tel quel", "Le désactiver puis, plus tard, le supprimer", "Le rendre admin", "Lui retirer son nom"], a: 1, exp: "On réduit la surface d'attaque en désactivant puis nettoyant." },
      { type: "input", q: "Quel filtre trouve les mots de passe éternels : PasswordNeverExpires -eq ___ ?", a: ["$true", "true"], ph: "$xxxx", exp: "PasswordNeverExpires -eq $true." },
      { type: "input", q: "Quelle cmdlet liste les membres de Domain Admins ? (Verbe-Nom)", a: ["Get-ADGroupMember", "get-adgroupmember"], ph: "Verbe-ADGroupMember", exp: "Get-ADGroupMember -Identity 'Domain Admins'." },
      { type: "qcm", q: "Le compte d'un admin a PasswordNeverExpires ET est dans Domain Admins. Que conclure ?", opts: ["Tout va bien", "C'est une cible sensible : à renforcer et surveiller de près", "Il faut le supprimer sans réfléchir", "C'est obligatoire"], a: 1, exp: "Combinaison puissante + faible : priorité de sécurité." }
    ],
    solution: `<p>Un mini-audit en trois volets, chaque résultat exporté pour la direction :</p>
<pre class="pseudo">Import-Module ActiveDirectory                                                     # charge les cmdlets AD
Search-ADAccount -AccountInactive -TimeSpan 90.00:00:00 |                          # 1. comptes sans connexion depuis 90 j
    Select-Object Name, LastLogonDate                                            # affiche nom + derniere connexion
Get-ADUser -Filter "PasswordNeverExpires -eq $true" -Properties PasswordNeverExpires |   # 2. mots de passe eternels
    Select-Object Name                                                           # affiche le nom
Get-ADGroupMember -Identity "Domain Admins" |                                     # 3. membres du groupe le plus puissant
    Select-Object Name, objectClass                                              # affiche qui est admin (et de quel type)</pre>
<p>Trois angles, une même logique : lister, filtrer, présenter. Ces contrôles, répétés régulièrement (idéalement automatisés, jour 29), maintiennent le domaine sain et réduisent la surface d'attaque.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton script PowerShell ici…",
  items: [
  { id: "adps-j28", title: "Rapport des comptes inactifs à désactiver", level: 3,
    statement: "Écris un script qui liste les comptes utilisateurs ACTIVÉS mais sans connexion depuis 60 jours, affiche leur nom et leur dernière connexion, et exporte le tout dans <code>C:\\Rapports\\dormants.csv</code>.",
    hints: [
      "Utilise Search-ADAccount -AccountInactive -TimeSpan 60.00:00:00 -UsersOnly.",
      "Filtre les comptes encore activés avec Where-Object { $_.Enabled -eq $true }.",
      "Sélectionne Name et LastLogonDate, puis Export-Csv avec -NoTypeInformation -Encoding UTF8."
    ],
    solution: "Import-Module ActiveDirectory                                                       # charge les cmdlets AD\nSearch-ADAccount -AccountInactive -TimeSpan 60.00:00:00 -UsersOnly |                 # comptes utilisateurs inactifs depuis 60 jours\n    Where-Object { $_.Enabled -eq $true } |                                        # ne garde que ceux ENCORE actives\n    Select-Object Name, LastLogonDate |                                            # affiche nom et derniere connexion\n    Export-Csv 'C:\\Rapports\\dormants.csv' -NoTypeInformation -Encoding UTF8         # exporte un CSV pour la direction",
    note: "On combine Search-ADAccount (pour l'inactivite) et Where-Object (pour ne cibler que les comptes encore actifs, les seuls dangereux). Le rapport aide a decider lesquels desactiver, en appliquant le moindre privilege." }
  ]
};
</script>
