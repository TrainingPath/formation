<script>
var DAY = {
  num: 11,
  title: "Les unités d'organisation (OU)",
  subtitle: "Ranger l'annuaire dans des tiroirs pour mieux administrer.",
  theory: `
<h3>1. Qu'est-ce qu'une OU ?</h3>
<p>Une <strong>unité d'organisation</strong> (en anglais <em>Organizational Unit</em>, abrégé <strong>OU</strong>) est un dossier de rangement à l'intérieur du domaine. Elle contient des utilisateurs, des ordinateurs, des groupes ou d'autres OU. Imagine une grande armoire (le domaine) remplie de tiroirs (les OU) : chaque tiroir regroupe ce qui va ensemble, par exemple un tiroir « Ventes », un tiroir « Informatique ».</p>
<div class="tip">Les OU ne servent pas qu'à ranger : ce sont aussi les points d'application des <strong>stratégies de groupe</strong> (les règles automatiques appliquées à un ensemble d'objets) et le niveau où l'on peut <strong>déléguer</strong> des droits d'administration. Une bonne arborescence d'OU facilite toute la gestion.</p>
<h3>2. Créer une OU : New-ADOrganizationalUnit</h3>
<p>La cmdlet du jour est <code>New-ADOrganizationalUnit</code>. On lui donne un nom (<code>-Name</code>) et l'endroit où la créer (<code>-Path</code>, le DN du conteneur parent). Sans <code>-Path</code>, elle est créée à la racine du domaine.</p>
<pre class="pseudo">New-ADOrganizationalUnit -Name "Ventes" -Path "DC=entreprise,DC=local"   # cree l'OU Ventes a la racine du domaine
# -Name : le nom du tiroir (Ventes)
# -Path : le DN du parent (ici la racine du domaine entreprise.local)</pre>
<h3>3. Le DN d'une OU</h3>
<p>Une OU a un DN qui commence par <code>OU=</code>. Une OU imbriquée (un tiroir dans un tiroir) empile les <code>OU=</code>. Sa lecture suit la logique du jour 1 : de l'objet vers la racine.</p>
<pre class="pseudo">OU=Ventes,DC=entreprise,DC=local            # l'OU Ventes, juste sous la racine
OU=Paris,OU=Ventes,DC=entreprise,DC=local   # l'OU Paris, rangee DANS l'OU Ventes (imbrication)
# on lit de gauche a droite : l'OU la plus interne d'abord, puis ses parents</pre>
<h3>4. Créer une arborescence</h3>
<p>On construit une hiérarchie en créant d'abord le tiroir parent, puis les sous-tiroirs en pointant leur <code>-Path</code> vers le parent.</p>
<pre class="pseudo">New-ADOrganizationalUnit -Name "Ventes" -Path "DC=entreprise,DC=local"                 # 1) cree le parent Ventes
New-ADOrganizationalUnit -Name "Paris" -Path "OU=Ventes,DC=entreprise,DC=local"        # 2) cree Paris DANS Ventes
New-ADOrganizationalUnit -Name "Lyon" -Path "OU=Ventes,DC=entreprise,DC=local"         # 3) cree Lyon DANS Ventes
# l'ordre compte : le parent doit exister avant ses enfants</pre>
<h3>5. Lister et lire les OU</h3>
<p>Pour explorer les OU existantes, on utilise <code>Get-ADOrganizationalUnit</code> avec un filtre (comme pour les utilisateurs).</p>
<pre class="pseudo">Get-ADOrganizationalUnit -Filter *                                  # liste TOUTES les OU du domaine
Get-ADOrganizationalUnit -Filter { Name -eq "Ventes" }              # cherche l'OU nommee Ventes
Get-ADOrganizationalUnit -Identity "OU=Ventes,DC=entreprise,DC=local"   # lit une OU par son DN</pre>
<h3>6. La protection contre la suppression accidentelle</h3>
<p>Par défaut, une OU est créée avec une <strong>protection contre la suppression accidentelle</strong> : un garde-fou qui empêche de l'effacer par erreur (avec tout son contenu !). C'est très utile, mais il faut le désactiver avant une suppression volontaire.</p>
<pre class="pseudo">Set-ADOrganizationalUnit -Identity "OU=Ventes,DC=entreprise,DC=local" -ProtectedFromAccidentalDeletion \$false   # retire le garde-fou
Remove-ADOrganizationalUnit -Identity "OU=Ventes,DC=entreprise,DC=local"                                        # supprime l'OU (maintenant possible)</pre>
<div class="warn">Supprimer une OU supprime aussi tout ce qu'elle contient. Utilise toujours <code>-WhatIf</code> d'abord, et ne retire la protection que si tu es certain de vouloir effacer.</div>
<h3>7. Renommer ou décrire une OU</h3>
<p>On modifie une OU avec <code>Set-ADOrganizationalUnit</code> (description, protection…) et on la renomme avec <code>Rename-ADObject</code>.</p>
<pre class="pseudo">Set-ADOrganizationalUnit -Identity "OU=Ventes,DC=entreprise,DC=local" -Description "Equipe commerciale"   # ajoute une description
Rename-ADObject -Identity "OU=Ventes,DC=entreprise,DC=local" -NewName "Commercial"                        # renomme Ventes en Commercial</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie OU ?", opts: ["Objet Utilisateur", "Organizational Unit (unité d'organisation)", "Ordinateur Unique", "Outil Universel"], a: 1, exp: "Une OU est un dossier de rangement dans le domaine." },
    { type: "qcm", q: "Quelle cmdlet crée une OU ?", opts: ["New-ADUser", "New-ADOrganizationalUnit", "New-ADGroup", "Add-OU"], a: 1, exp: "New-ADOrganizationalUnit crée un tiroir." },
    { type: "qcm", q: "Par quoi commence le DN d'une OU ?", opts: ["CN=", "OU=", "DC=", "SAM="], a: 1, exp: "OU=Ventes,DC=entreprise,DC=local." },
    { type: "qcm", q: "Outre le rangement, à quoi servent surtout les OU ?", opts: ["À rien d'autre", "À appliquer des stratégies de groupe et à déléguer des droits", "À stocker des mots de passe", "À créer des utilisateurs"], a: 1, exp: "Les OU sont les points d'application des stratégies et de la délégation." },
    { type: "qcm", q: "Que se passe-t-il si on supprime une OU pleine ?", opts: ["Rien", "Tout son contenu est supprimé aussi", "Le contenu part à la racine", "Le domaine plante"], a: 1, exp: "La suppression est récursive : attention !" },
    { type: "input", q: "Complète : le paramètre qui donne le nom de l'OU est -______ .", a: ["Name", "name"], ph: "un paramètre", exp: "-Name \"Ventes\"." },
    { type: "input", q: "Complète : le paramètre qui indique le conteneur parent (DN) est -______ .", a: ["Path", "path"], ph: "un paramètre", exp: "-Path reçoit le DN du parent." },
    { type: "input", q: "Complète le DN de l'OU Paris imbriquée dans Ventes : OU=Paris,OU=______,DC=entreprise,DC=local .", a: ["Ventes", "ventes"], ph: "un nom", exp: "L'OU parente apparaît juste après." },
    { type: "input", q: "Complète : pour LISTER toutes les OU, on tape Get-ADOrganizationalUnit -______ * .", a: ["Filter", "filter"], ph: "un paramètre", exp: "Get-ADOrganizationalUnit -Filter *." },
    { type: "input", q: "Complète : le garde-fou anti-suppression est l'attribut ProtectedFromAccidental______ .", a: ["Deletion", "deletion"], ph: "un mot", exp: "ProtectedFromAccidentalDeletion." },
    { type: "input", q: "Complète : pour renommer une OU, on utilise Rename-AD______ .", a: ["Object", "object"], ph: "un mot", exp: "Rename-ADObject renomme un objet, dont une OU." },
    { type: "vf", q: "Une OU peut contenir d'autres OU (imbrication).", a: true, exp: "On empile les OU= pour créer une arborescence." },
    { type: "vf", q: "Par défaut, une OU est protégée contre la suppression accidentelle.", a: true, exp: "Il faut retirer cette protection avant de pouvoir la supprimer." },
    { type: "vf", q: "Pour créer une sous-OU, son OU parente doit déjà exister.", a: true, exp: "On crée toujours le parent avant l'enfant." },
    { type: "qcm", q: "Avant de supprimer une OU pour de vrai, quel réflexe adopter ?", opts: ["La supprimer directement", "Tester avec -WhatIf et vérifier son contenu", "Redémarrer le DC", "Rien"], a: 1, exp: "-WhatIf et vérification du contenu évitent une catastrophe." }
  ],
  final: {
    title: "Exercice final — Bâtir l'arborescence de l'entreprise",
    intro: `<p>Tu structures le domaine <code>entreprise.local</code> : une OU <code>Sieges</code> à la racine, puis deux sous-OU <code>Paris</code> et <code>Lyon</code> à l'intérieur, avec une description sur Paris. Étudie la trame :</p>
<pre class="pseudo">New-ADOrganizationalUnit -Name "Sieges" -Path "DC=entreprise,DC=local"                   # 1) OU parente a la racine
New-ADOrganizationalUnit -Name "Paris" -Path "OU=Sieges,DC=entreprise,DC=local"          # 2) Paris DANS Sieges
New-ADOrganizationalUnit -Name "Lyon" -Path "OU=Sieges,DC=entreprise,DC=local"           # 3) Lyon DANS Sieges
Set-ADOrganizationalUnit -Identity "OU=Paris,OU=Sieges,DC=entreprise,DC=local" -Description "Siege principal"   # 4) decrit Paris</pre>`,
    questions: [
      { type: "input", q: "Quelle cmdlet crée l'OU Sieges ?", a: ["New-ADOrganizationalUnit", "new-adorganizationalunit"], ph: "New-AD...", exp: "New-ADOrganizationalUnit." },
      { type: "input", q: "Quel paramètre indique où créer l'OU (le DN parent) ?", a: ["-Path", "Path", "-path"], ph: "-Xxxx", exp: "-Path reçoit le DN du parent." },
      { type: "qcm", q: "Pourquoi créer Sieges AVANT Paris et Lyon ?", opts: ["Question de goût", "Le parent doit exister avant qu'on puisse y ranger des enfants", "Pour aller plus vite", "Sans importance"], a: 1, exp: "On ne range pas dans un tiroir qui n'existe pas encore." },
      { type: "input", q: "Complète le DN de Paris : OU=Paris,OU=______,DC=entreprise,DC=local .", a: ["Sieges", "sieges"], ph: "un nom", exp: "Paris est imbriquée dans Sieges." },
      { type: "qcm", q: "Comment ajouter une description à l'OU Paris ?", opts: ["New-ADOrganizationalUnit -Description", "Set-ADOrganizationalUnit -Identity ... -Description ...", "Remove-ADOrganizationalUnit", "Get-ADOrganizationalUnit"], a: 1, exp: "Set-ADOrganizationalUnit modifie une OU existante." }
    ],
    solution: `<p>L'arborescence complète, parent puis enfants :</p>
<pre class="pseudo">New-ADOrganizationalUnit -Name "Sieges" -Path "DC=entreprise,DC=local"                   # 1) tiroir parent
New-ADOrganizationalUnit -Name "Paris" -Path "OU=Sieges,DC=entreprise,DC=local"          # 2) sous-tiroir Paris
New-ADOrganizationalUnit -Name "Lyon" -Path "OU=Sieges,DC=entreprise,DC=local"           # 3) sous-tiroir Lyon
Set-ADOrganizationalUnit -Identity "OU=Paris,OU=Sieges,DC=entreprise,DC=local" \`
  -Description "Siege principal"                                                          # 4) description de Paris
Get-ADOrganizationalUnit -Filter * | Select-Object Name, DistinguishedName               # verifie l'arborescence</pre>
<p>L'annuaire a maintenant des tiroirs. Au jour 12, nous apprendrons à y DÉPLACER les objets avec Move-ADObject.</p>`
  }
};
