  title: "Automatiser : fonctions et paramètres",
  subtitle: "Emballer un script utile dans une commande réutilisable.",
  theory: `
<h3>1. Pourquoi des fonctions ?</h3>
<p>Jusqu'ici, nos scripts s'exécutent de haut en bas. Mais dès qu'on répète une même suite d'instructions (créer un utilisateur, l'ajouter à des groupes…), il devient malin de l'emballer dans une <strong>fonction</strong> : un mini-programme nommé, réutilisable, qu'on appelle par son nom autant de fois qu'on veut. La fonction évite de copier-coller le même code et centralise les corrections en un seul endroit.</p>
<h3>2. Écrire une fonction simple</h3>
<p>En PowerShell, on déclare une fonction avec le mot-clé <code>function</code>, suivi d'un nom (idéalement au format Verbe-Nom, comme les cmdlets) et d'un bloc entre accolades :</p>
<pre class="pseudo">function Dire-Bonjour {          # declare une fonction nommee Dire-Bonjour
    Write-Host "Bonjour !"       # instruction executee quand on appelle la fonction
}                                # fin de la fonction
Dire-Bonjour                     # APPELLE la fonction : affiche Bonjour !</pre>
<div class="tip">La convention Verbe-Nom (Get-, New-, Set-…) rend tes fonctions cohérentes avec les vraies cmdlets et faciles à deviner.</div>
<h3>3. Les paramètres : rendre la fonction adaptable</h3>
<p>Une fonction devient vraiment utile quand elle accepte des <strong>paramètres</strong> : des valeurs qu'on lui fournit à l'appel pour qu'elle travaille sur des données différentes. On les déclare dans un bloc <code>param(...)</code>. Chaque paramètre est une variable (elle commence par le signe dollar) :</p>
<pre class="pseudo">function Dire-Bonjour {          # declare la fonction
    param(                       # debut de la liste des parametres
        $Prenom                  # un parametre nomme Prenom
    )                            # fin des parametres
    Write-Host "Bonjour $Prenom !"   # utilise la valeur recue
}
Dire-Bonjour -Prenom "Marie"     # appel avec la valeur Marie -> Bonjour Marie !</pre>
<h3>4. Paramètres obligatoires et types</h3>
<p>On peut exiger qu'un paramètre soit fourni (<strong>Mandatory</strong>, « obligatoire ») et préciser son <strong>type</strong> (le genre de valeur attendu : du texte avec <code>[string]</code>, un nombre entier avec <code>[int]</code>). Le type évite les erreurs en refusant une valeur du mauvais genre :</p>
<pre class="pseudo">function New-Employe {                       # fonction de creation d'employe
    param(                                   # liste des parametres
        [Parameter(Mandatory=$true)]         # ce parametre est OBLIGATOIRE
        [string]$Nom,                        # attend du texte (le nom)
        [int]$Age                            # attend un nombre entier (l'age)
    )
    Write-Host "Employe : $Nom, age : $Age"  # utilise les deux valeurs
}
New-Employe -Nom "Dupont" -Age 30            # appel correct</pre>
<div class="warn">Si un paramètre Mandatory n'est pas fourni, PowerShell le RÉCLAME avant d'exécuter la fonction : impossible de l'oublier par accident.</div>
<h3>5. Renvoyer un résultat</h3>
<p>Une fonction peut <strong>renvoyer</strong> une valeur avec <code>return</code> (ou simplement en la laissant s'afficher). Le résultat peut alors être rangé dans une variable :</p>
<pre class="pseudo">function Get-NomComplet {                     # fonction qui fabrique un nom complet
    param([string]$Prenom, [string]$Nom)     # deux parametres texte
    return "$Prenom $Nom"                     # renvoie la chaine assemblee
}
$complet = Get-NomComplet -Prenom "Marie" -Nom "Dupont"   # range le resultat dans $complet
Write-Host $complet                           # affiche : Marie Dupont</pre>
<h3>6. Valeur par défaut</h3>
<p>On peut donner une <strong>valeur par défaut</strong> à un paramètre : celle qui sera utilisée si l'appelant ne fournit rien. Pratique pour les réglages courants.</p>
<pre class="pseudo">function New-Utilisateur {                    # fonction de creation
    param(                                    # parametres
        [string]$Nom,                         # obligatoire dans l'usage
        [string]$Service = "Général"          # valeur PAR DEFAUT si non precisee
    )
    Write-Host "$Nom rejoint le service $Service"
}
New-Utilisateur -Nom "Léa"                    # sans -Service -> Service = General
New-Utilisateur -Nom "Léa" -Service "Ventes"  # avec -Service -> Ventes</pre>
<div class="tip">Fonction + paramètres = la base de l'automatisation. Le jour 30, on assemblera tout cela dans un vrai script d'onboarding.</div>`,
  exercises: [
    { type: "qcm", q: "À quoi sert une <strong>fonction</strong> ?", opts: ["À ralentir le script", "À emballer une suite d'instructions réutilisable sous un nom", "À supprimer des fichiers", "À créer une GPO"], a: 1, exp: "La fonction évite le copier-coller et centralise le code." },

    { type: "qcm", q: "Que signifie <code>Mandatory=$true</code> sur un paramètre ?", opts: ["Il est facultatif", "Il est obligatoire : PowerShell le réclame s'il manque", "Il est caché", "Il est un nombre"], a: 1, exp: "Un paramètre Mandatory doit être fourni." },

    { type: "input", q: "Dans quel bloc déclare-t-on les paramètres d'une fonction ? (mot-clé suivi de parenthèses)", a: ["param", "param()", "param(...)"], ph: "mot-clé", exp: "Le bloc param(...) liste les paramètres." },
    { type: "input", q: "Quel type impose une valeur TEXTE à un paramètre ? (entre crochets)", a: ["[string]", "string"], ph: "[Xxxxx]", exp: "[string] = texte ; [int] = entier." },
    { type: "input", q: "Comment appeler une fonction Dire-Bonjour en lui passant Prenom = Marie ? Écris l'appel.", a: ["Dire-Bonjour -Prenom \"Marie\"", "Dire-Bonjour -Prenom 'Marie'", "Dire-Bonjour -Prenom Marie"], ph: "appel", exp: "Dire-Bonjour -Prenom 'Marie'." },
    { type: "input", q: "Par quel signe commence un nom de paramètre (variable) en PowerShell ?", a: ["$", "dollar", "le dollar"], ph: "un signe", exp: "Comme toute variable : $Prenom, $Nom…" },
    { type: "input", q: "Quel attribut rend un paramètre obligatoire ? (le mot avant =$true)", a: ["Mandatory", "mandatory"], ph: "un mot", exp: "[Parameter(Mandatory=$true)]." },
    { type: "input", q: "Complète une valeur par défaut : [string]$Service ___ \"Général\"", a: ["=", "égal"], ph: "un signe", exp: "$Service = 'Général' donne une valeur par défaut." },
    { type: "vf", q: "Une fonction permet de réutiliser du code sans le copier-coller.", a: true, exp: "C'est son intérêt principal." },
    { type: "vf", q: "Un paramètre Mandatory manquant est réclamé par PowerShell avant l'exécution.", a: true, exp: "Impossible de l'oublier par accident." },
    { type: "vf", q: "Une valeur par défaut est utilisée uniquement si l'appelant ne fournit rien.", a: true, exp: "Si l'appelant précise le paramètre, sa valeur remplace le défaut." }
  ],
  final: {
    title: "Exercice final — Une fonction de création d'utilisateur",
    intro: `<p>On veut une fonction <code>New-CompteAD</code> qui crée un utilisateur à partir d'un prénom, d'un nom et d'un service (par défaut « Général »).</p>
<pre class="pseudo">function New-CompteAD {
    param(
        [Parameter(Mandatory=$true)][string]$Prenom,   # obligatoire
        [Parameter(Mandatory=$true)][string]$Nom,      # obligatoire
        [string]$Service = "Général"                   # valeur par defaut
    )
    # ... corps de la fonction ...
}</pre>`,
    questions: [
      { type: "qcm", q: "Pourquoi mettre Prenom et Nom en Mandatory ?", opts: ["Pour ralentir", "Pour garantir qu'on ne crée jamais un compte sans ces informations", "Pour les cacher", "Aucune raison"], a: 1, exp: "Mandatory force la présence des informations indispensables." },
      { type: "input", q: "Quel bloc contient la liste des paramètres ? (mot-clé)", a: ["param", "param()"], ph: "mot-clé", exp: "param(...) déclare les paramètres." },
      { type: "input", q: "Quel type mettre devant $Prenom pour imposer du texte ? (entre crochets)", a: ["[string]", "string"], ph: "[Xxxxx]", exp: "[string] impose une chaîne de caractères." },
      { type: "qcm", q: "Si on appelle New-CompteAD -Prenom 'Léa' -Nom 'Roy' sans -Service, que vaut Service ?", opts: ["Vide", "Général (la valeur par défaut)", "Erreur", "Léa"], a: 1, exp: "La valeur par défaut s'applique quand -Service est absent." },
      { type: "input", q: "Écris l'appel qui crée Léa Roy au service Ventes.", a: ["New-CompteAD -Prenom \"Léa\" -Nom \"Roy\" -Service \"Ventes\"", "New-CompteAD -Prenom 'Léa' -Nom 'Roy' -Service 'Ventes'"], ph: "appel", exp: "On passe les trois paramètres nommés." }
    ],
    solution: `<p>La fonction complète, prête à appeler <code>New-ADUser</code> à l'intérieur :</p>
<pre class="pseudo">function New-CompteAD {                                   # declare la fonction
    param(                                               # liste des parametres
        [Parameter(Mandatory=$true)][string]$Prenom,     # prenom obligatoire (texte)
        [Parameter(Mandatory=$true)][string]$Nom,        # nom obligatoire (texte)
        [string]$Service = "Général"                     # service, valeur par defaut
    )
    $login = "$Prenom.$Nom"                              # fabrique un identifiant simple
    New-ADUser -Name "$Prenom $Nom" -SamAccountName $login -Department $Service -Enabled $true   # cree le compte
    Write-Host "Compte cree : $login (service $Service)"  # message de confirmation
}
New-CompteAD -Prenom "Léa" -Nom "Roy" -Service "Ventes"   # appel : cree Lea Roy au service Ventes</pre>
<p>Une seule fonction, appelée autant de fois qu'il y a d'employés : c'est le cœur de l'automatisation. On la réutilisera au jour 30.</p>`
  }
};
