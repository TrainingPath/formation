var DAY = {

  title: "Créer et lier des GPO par script",
  subtitle: "Automatiser la fabrication et le déploiement des stratégies de groupe.",
  theory: `
<h3>1. Pourquoi scripter les GPO</h3>
<p>Au jour 18, nous avons découvert les GPO. Aujourd'hui, on passe à l'action : créer, remplir et lier des GPO entièrement en ligne de commande. L'intérêt du script est la <strong>répétabilité</strong> : la même GPO sera créée exactement de la même façon sur dix domaines, sans clic, sans oubli, et le script sert de trace écrite de ce qui a été fait.</p>
<h3>2. Créer et garder la GPO dans une variable</h3>
<p>Une <strong>variable</strong> est une étiquette qui garde en mémoire un résultat pour le réutiliser (en PowerShell, un nom de variable commence par le signe dollar). On stocke la GPO créée pour ne pas avoir à la rechercher ensuite :</p>
<pre class="pseudo">Import-Module GroupPolicy                     # charge les cmdlets de stratégie de groupe
$gpo = New-GPO -Name "Sécurité poste"         # cree la GPO ET range l'objet resultat dans la variable $gpo
$gpo = New-GPO -Name "Sécurité poste" -Comment "Regles de securite"   # -Comment ajoute une description</pre>
<div class="tip">Ranger le résultat de <code>New-GPO</code> dans une variable évite de retaper le nom partout et rend le script plus sûr : on manipule l'objet exact que l'on vient de créer.</div>
<h3>3. Remplir la GPO : Set-GPRegistryValue</h3>
<p>Beaucoup de réglages Windows se traduisent par une valeur dans le <strong>Registre</strong> (la grande base de configuration de Windows). La cmdlet <code>Set-GPRegistryValue</code> écrit une telle valeur à l'intérieur de la GPO. Il faut lui donner la clé (l'emplacement), le nom de la valeur et son contenu. Voici la commande, chaque paramètre commenté :</p>
<pre class="pseudo">Set-GPRegistryValue -Name "Sécurité poste" -Key "HKCU\Software\Policies\Microsoft\Windows\Control Panel\Desktop" -ValueName "ScreenSaveTimeOut" -Type String -Value "600"
# -Name       : la GPO que l'on remplit (Securite poste)
# -Key        : l'emplacement du reglage dans le Registre
# -ValueName  : le nom precis de la valeur ecrite (ScreenSaveTimeOut)
# -Type/-Value: le type (texte) et le contenu (600 secondes avant verrouillage)</pre>
<div class="tip">Pour lisibilité, on peut couper une longue commande PowerShell sur plusieurs lignes avec l'accent grave (apostrophe inversée) en fin de ligne : PowerShell la relit alors comme une seule commande.</div>
<h3>4. Lier la GPO et régler son comportement</h3>
<p>On lie ensuite avec <code>New-GPLink</code>. Deux paramètres utiles précisent le comportement de la liaison :</p>
<pre class="pseudo">New-GPLink -Name "Sécurité poste" -Target "OU=Compta,DC=exemple,DC=local" -LinkEnabled Yes -Enforced Yes
# -Target      : l'emplacement lie (ici l'OU Compta)
# -LinkEnabled : liaison ACTIVE des maintenant (Yes / No)
# -Enforced    : liaison IMPOSEE, ses reglages priment et ne peuvent etre ecrases</pre>
<p><strong>LinkEnabled</strong> active ou non la liaison ; <strong>Enforced</strong> (« imposée ») rend la GPO prioritaire et empêche une autre GPO de la contredire plus bas dans l'arborescence.</p>
<h3>5. Ordre et priorité des GPO</h3>
<p>Plusieurs GPO peuvent s'appliquer au même objet. Elles se cumulent, mais en cas de conflit, l'ordre compte. La règle générale se résume par l'acronyme <strong>LSDOU</strong> : Local, Site, Domaine, OU — la dernière appliquée (l'OU la plus proche) l'emporte, SAUF si une GPO est <em>Enforced</em>.</p>
<pre class="pseudo">GPO du Domaine   -> reglages generaux              # appliques en premier
GPO du Site      -> ajustements par lieu            # puis
GPO de l'OU      -> reglages precis, prioritaires   # appliques en dernier : gagnent en cas de conflit
GPO Enforced     -> imposee, gagne quand meme       # exception : elle prime sur tout</pre>
<h3>6. Vérifier et sauvegarder</h3>
<p>On contrôle le résultat, et on peut sauvegarder une GPO dans un dossier pour la réimporter ailleurs :</p>
<pre class="pseudo">Get-GPInheritance -Target "OU=Compta,DC=exemple,DC=local"      # montre les GPO liees et leur ordre sur cette OU
Backup-GPO -Name "Sécurité poste" -Path "C:\Sauvegardes\GPO"   # exporte la GPO dans un dossier</pre>
<div class="warn">Teste toujours une nouvelle GPO sur une OU de test avant de la lier aux vraies OU de production : un mauvais réglage se propage à tous les postes en quelques minutes.</div>`,
  exercises: [
    { type: "qcm", q: "Pourquoi ranger le résultat de New-GPO dans une variable ?", opts: ["Pour aller plus vite au démarrage", "Pour réutiliser l'objet exact créé sans le rechercher", "C'est obligatoire", "Pour supprimer la GPO"], a: 1, exp: "La variable garde l'objet en mémoire pour la suite du script." },
    { type: "qcm", q: "Que fait <code>Set-GPRegistryValue</code> ?", opts: ["Lie une GPO", "Écrit un réglage (valeur de Registre) dans une GPO", "Supprime une GPO", "Redémarre le poste"], a: 1, exp: "Elle remplit la GPO avec un paramètre stocké dans le Registre." },
    { type: "qcm", q: "À quoi sert le paramètre <code>-Enforced Yes</code> sur une liaison ?", opts: ["Désactive la GPO", "Rend la GPO prioritaire, non écrasable par une autre", "Supprime la liaison", "Change le nom"], a: 1, exp: "Enforced = imposée : ses réglages priment en cas de conflit." },

    { type: "input", q: "Quelle cmdlet ÉCRIT un réglage de Registre dans une GPO ? (Verbe-Nom)", a: ["Set-GPRegistryValue", "set-gpregistryvalue"], ph: "Verbe-GPRegistryValue", exp: "Set-GPRegistryValue remplit la GPO avec une valeur de Registre." },

    { type: "input", q: "Quelle cmdlet affiche les GPO liées et leur ordre sur une OU ? (Verbe-Nom)", a: ["Get-GPInheritance", "get-gpinheritance"], ph: "Verbe-GPInheritance", exp: "Get-GPInheritance montre l'héritage et l'ordre des GPO." },
    { type: "input", q: "Par quel signe commence un nom de variable en PowerShell ?", a: ["$", "le dollar", "dollar"], ph: "un signe", exp: "Toute variable PowerShell commence par le signe dollar, ex : $gpo." },
    { type: "vf", q: "Une GPO Enforced l'emporte même sur une GPO d'OU normalement prioritaire.", a: true, exp: "Enforced est l'exception qui rend une GPO non écrasable." },
    { type: "vf", q: "On peut couper une longue commande PowerShell sur plusieurs lignes avec l'accent grave en fin de ligne.", a: true, exp: "PowerShell relit alors les lignes comme une seule commande." },
    { type: "vf", q: "Il est prudent de tester une GPO sur une OU de test avant la production.", a: true, exp: "Un mauvais réglage se propage vite à tous les postes." }
  ],
  final: {
    title: "Exercice final — Déployer une GPO de verrouillage",
    intro: `<p>Objectif : créer une GPO qui verrouille l'écran après 10 minutes, la lier à l'OU des postes de la compta, puis vérifier.</p>
<pre class="pseudo">$gpo = New-GPO -Name "Verrouillage 10 min"          # cree la GPO et la garde dans $gpo
Set-GPRegistryValue -Name "Verrouillage 10 min" ... # y ecrit le delai de 600 secondes
New-GPLink -Name "Verrouillage 10 min" -Target "OU=Compta,DC=exemple,DC=local"   # lie a l'OU Compta</pre>`,
    questions: [
      { type: "input", q: "Quel verbe crée la GPO : $gpo = ___-GPO -Name 'Verrouillage 10 min' ?", a: ["New", "new"], ph: "un verbe", exp: "New-GPO crée la GPO." },
      { type: "qcm", q: "Quelle cmdlet écrit le délai de verrouillage dans la GPO ?", opts: ["New-GPLink", "Set-GPRegistryValue", "Backup-GPO", "Remove-GPO"], a: 1, exp: "Set-GPRegistryValue place le réglage dans la GPO." },
      { type: "input", q: "Quel paramètre de New-GPLink reçoit le chemin de l'OU Compta ? (avec le tiret)", a: ["-Target", "Target"], ph: "-Xxxxx", exp: "-Target attend le DN de l'OU." },
      { type: "qcm", q: "Pour rendre cette GPO prioritaire et non écrasable, on ajoute…", opts: ["-LinkEnabled No", "-Enforced Yes", "-Comment", "-All"], a: 1, exp: "Enforced Yes impose la GPO." },
      { type: "qcm", q: "Comment vérifier ensuite que la GPO est bien liée à l'OU Compta ?", opts: ["Remove-GPO", "Get-GPInheritance -Target ...", "New-GPO", "Import-Module"], a: 1, exp: "Get-GPInheritance liste les GPO liées et leur ordre." }
    ],
    solution: `<p>Le script complet, étape par étape :</p>
<pre class="pseudo">Import-Module GroupPolicy                                     # charge les cmdlets GPO
$gpo = New-GPO -Name "Verrouillage 10 min"                   # cree la GPO et la garde en memoire
Set-GPRegistryValue -Name "Verrouillage 10 min" -Key "HKCU\Software\Policies\Microsoft\Windows\Control Panel\Desktop" -ValueName "ScreenSaveTimeOut" -Type String -Value "600"   # delai de 600 s
New-GPLink -Name "Verrouillage 10 min" -Target "OU=Compta,DC=exemple,DC=local" -LinkEnabled Yes   # lie et active
Get-GPInheritance -Target "OU=Compta,DC=exemple,DC=local"    # verifie que la GPO apparait bien</pre>
<p>On crée, on remplit, on lie, on vérifie. Tout est écrit dans le script : reproductible et documenté.</p>`
  }
};
