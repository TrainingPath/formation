<script>
var DAY = {
  num: 18,
  title: "Les stratégies de groupe (module GroupPolicy)",
  subtitle: "Appliquer des réglages à des centaines de postes d'un seul geste.",
  theory: `
<h3>1. Le problème que résolvent les GPO</h3>
<p>Imagine devoir régler manuellement le fond d'écran, le mot de passe minimum et l'accès au Panneau de configuration sur 500 ordinateurs. Impensable. La solution d'Active Directory s'appelle la <strong>stratégie de groupe</strong>, en anglais <strong>Group Policy</strong>. Une stratégie de groupe est un ensemble de réglages que l'annuaire applique automatiquement à des utilisateurs ou des ordinateurs.</p>
<h3>2. La GPO : le paquet de réglages</h3>
<p>Une <strong>GPO</strong> (Group Policy Object, « objet de stratégie de groupe ») est le contenant concret de ces réglages : une sorte de « recette » qui regroupe une liste de paramètres. Par exemple, une GPO « Sécurité poste » peut à la fois imposer un mot de passe de 12 caractères, verrouiller l'écran après 10 minutes et interdire l'installation de logiciels.</p>
<div class="tip">Retiens la différence : la <strong>stratégie de groupe</strong> est le mécanisme (le concept), la <strong>GPO</strong> est l'objet précis qui contient les réglages. On dit couramment « créer une GPO ».</div>
<h3>3. Où s'applique une GPO : la liaison</h3>
<p>Une GPO ne fait rien tant qu'elle n'est pas <strong>liée</strong> (en anglais <em>linked</em>) à un emplacement de l'annuaire. On peut lier une GPO à un <strong>site</strong>, à un <strong>domaine</strong> entier, ou — le plus courant — à une <strong>unité d'organisation</strong> (OU : un dossier de l'annuaire qui range des utilisateurs ou des ordinateurs). Tous les objets situés dans l'emplacement lié reçoivent les réglages de la GPO.</p>
<pre class="pseudo">GPO "Sécurité poste"  --liée à-->  OU "Ordinateurs Compta"   # tous les PC de la compta reçoivent les réglages
GPO "Fond d'écran RH" --liée à-->  OU "Utilisateurs RH"       # tous les employés RH reçoivent ce fond d'écran</pre>
<h3>4. Le module GroupPolicy en PowerShell</h3>
<p>Windows Server fournit un <strong>module</strong> PowerShell dédié nommé <strong>GroupPolicy</strong> (un module est une boîte de commandes que l'on charge pour obtenir de nouvelles cmdlets). On le charge comme le module AD :</p>
<pre class="pseudo">Import-Module GroupPolicy        # charge les cmdlets qui gèrent les stratégies de groupe
Get-GPO -All                     # liste TOUTES les GPO du domaine
Get-GPO -Name "Default Domain Policy"   # affiche une GPO précise par son nom</pre>
<p>Les principales cmdlets de ce module suivent la logique Verbe-Nom de PowerShell :</p>
<pre class="pseudo">New-GPO       # crée une nouvelle GPO (vide au départ)
Get-GPO       # lit / liste des GPO existantes
New-GPLink    # lie une GPO à un emplacement (OU, domaine, site)
Set-GPLink    # modifie une liaison existante (l'activer, la désactiver…)
Remove-GPO    # supprime une GPO
Get-GPResultantSetOfPolicy   # calcule les réglages réellement appliqués à un poste</pre>
<h3>5. Deux moitiés dans chaque GPO</h3>
<p>Chaque GPO possède deux parties : la <strong>configuration ordinateur</strong> (réglages appliqués à la machine, quel que soit l'utilisateur connecté) et la <strong>configuration utilisateur</strong> (réglages appliqués à la personne, quel que soit le poste). C'est important : un réglage de mot de passe se met côté ordinateur, un fond d'écran côté utilisateur.</p>
<div class="warn">Une GPO mal liée peut toucher bien plus de monde que prévu. Lier au domaine entier applique les réglages à TOUT le monde. On lie donc au plus près : une OU précise, et on teste avant de généraliser.</div>
<h3>6. La rafraîchir</h3>
<p>Les postes récupèrent les GPO automatiquement (environ toutes les 90 minutes), mais on peut forcer la mise à jour immédiate avec <code>Invoke-GPUpdate</code> (l'équivalent de la vieille commande <code>gpupdate</code>).</p>
<pre class="pseudo">Invoke-GPUpdate -Computer "PC-COMPTA-01" -Force   # force ce poste à recharger ses GPO tout de suite</pre>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'une <strong>GPO</strong> ?", opts: ["Un utilisateur", "Un objet qui regroupe des réglages appliqués à des utilisateurs ou ordinateurs", "Un câble réseau", "Un mot de passe"], a: 1, exp: "La GPO (Group Policy Object) contient une liste de paramètres." },
    { type: "qcm", q: "Que faut-il faire pour qu'une GPO agisse réellement ?", opts: ["La renommer", "La lier à un site, un domaine ou une OU", "La sauvegarder", "Redémarrer AD"], a: 1, exp: "Sans liaison (link), une GPO ne s'applique à personne." },
    { type: "qcm", q: "Quel module PowerShell gère les stratégies de groupe ?", opts: ["ActiveDirectory", "GroupPolicy", "DnsServer", "GPOModule"], a: 1, exp: "Le module GroupPolicy fournit Get-GPO, New-GPO, New-GPLink…" },
    { type: "qcm", q: "Quelle cmdlet CRÉE une nouvelle GPO ?", opts: ["Add-GPO", "New-GPO", "Set-GPO", "Create-GPO"], a: 1, exp: "En PowerShell, on crée avec le verbe New : New-GPO." },
    { type: "qcm", q: "Sur quel emplacement lie-t-on le plus souvent une GPO ?", opts: ["Un fichier", "Une unité d'organisation (OU)", "Une imprimante", "Un disque dur"], a: 1, exp: "L'OU permet de cibler précisément un groupe d'objets." },
    { type: "qcm", q: "Un réglage de fond d'écran se place plutôt dans…", opts: ["La configuration ordinateur", "La configuration utilisateur", "Le schéma", "Le DNS"], a: 1, exp: "Le fond d'écran suit la personne : configuration utilisateur." },
    { type: "input", q: "Écris la commande qui charge le module de gestion des GPO.", a: ["Import-Module GroupPolicy", "import-module grouppolicy"], ph: "Cmdlet Nom", exp: "Import-Module GroupPolicy charge les cmdlets de stratégie de groupe." },
    { type: "input", q: "Quelle cmdlet LIE une GPO à un emplacement ? (Verbe-Nom)", a: ["New-GPLink", "new-gplink"], ph: "Verbe-GPLink", exp: "New-GPLink crée la liaison entre une GPO et une OU/domaine/site." },
    { type: "input", q: "Quel paramètre affiche TOUTES les GPO : Get-GPO ___ ?", a: ["-All", "All"], ph: "-Xxx", exp: "Get-GPO -All liste toutes les GPO du domaine." },
    { type: "input", q: "Quelle cmdlet SUPPRIME une GPO ? (Verbe-Nom)", a: ["Remove-GPO", "remove-gpo"], ph: "Verbe-GPO", exp: "Remove-GPO efface une GPO." },
    { type: "input", q: "Quelle cmdlet force un poste à recharger ses GPO immédiatement ?", a: ["Invoke-GPUpdate", "invoke-gpupdate"], ph: "Verbe-GPUpdate", exp: "Invoke-GPUpdate est l'équivalent PowerShell de gpupdate." },
    { type: "input", q: "Le verbe PowerShell qui LIT ou LISTE des objets est… (ex : ___-GPO)", a: ["Get", "get"], ph: "un verbe", exp: "Get-GPO lit ou liste des GPO." },
    { type: "vf", q: "Lier une GPO au domaine entier applique ses réglages à tout le monde.", a: true, exp: "C'est justement pourquoi on privilégie une OU précise." },
    { type: "vf", q: "Une GPO contient une configuration ordinateur ET une configuration utilisateur.", a: true, exp: "Deux moitiés : réglages machine et réglages personne." },
    { type: "vf", q: "Une GPO créée mais non liée applique déjà ses réglages.", a: false, exp: "Sans liaison, elle ne s'applique à personne." }
  ],
  final: {
    title: "Exercice final — Diagnostiquer une GPO sans effet",
    intro: `<p>Un collègue a créé la GPO « Sécurité poste » mais se plaint qu'elle « ne fait rien ». Tu enquêtes avec PowerShell.</p>
<pre class="pseudo">Import-Module GroupPolicy            # charge les cmdlets GPO
Get-GPO -Name "Sécurité poste"       # la GPO existe bien, mais...
Get-GPInheritance -Target "OU=Compta,DC=exemple,DC=local"   # ...aucune liaison vers cette OU</pre>`,
    questions: [
      { type: "qcm", q: "Quelle est la cause la plus probable ?", opts: ["Le serveur est éteint", "La GPO n'est liée à aucun emplacement", "Le mot de passe est faux", "Le module n'existe pas"], a: 1, exp: "Une GPO non liée ne s'applique à personne." },
      { type: "input", q: "Quelle cmdlet faut-il utiliser pour la lier à l'OU Compta ? (Verbe-Nom)", a: ["New-GPLink", "new-gplink"], ph: "Verbe-GPLink", exp: "New-GPLink crée la liaison manquante." },
      { type: "qcm", q: "Après la liaison, comment forcer un poste à appliquer la GPO tout de suite ?", opts: ["Remove-GPO", "Invoke-GPUpdate -Force", "New-GPO", "Get-GPO -All"], a: 1, exp: "Invoke-GPUpdate force le rafraîchissement immédiat." },
      { type: "vf", q: "Créer une GPO et la lier sont deux actions distinctes.", a: true, exp: "New-GPO crée, New-GPLink lie : il faut les deux." },
      { type: "qcm", q: "Pour limiter le risque, à quel niveau lier « Sécurité poste » ?", opts: ["Au domaine entier", "À l'OU précise qui contient les postes concernés", "À une imprimante", "Nulle part"], a: 1, exp: "On cible au plus près pour éviter de toucher tout le monde." }
    ],
    solution: `<p>La démarche complète : créer, lier, puis rafraîchir.</p>
<pre class="pseudo">Import-Module GroupPolicy                                          # charge les cmdlets GPO
$gpo = New-GPO -Name "Sécurité poste"                              # crée la GPO (si elle n'existe pas encore)
New-GPLink -Name "Sécurité poste" -Target "OU=Compta,DC=exemple,DC=local"   # lie la GPO à l'OU Compta
Invoke-GPUpdate -Computer "PC-COMPTA-01" -Force                    # force ce poste à recharger ses GPO</pre>
<p>Leçon clé : une GPO ne produit AUCUN effet tant qu'elle n'est pas liée. Créer et lier sont deux étapes séparées, et on lie toujours au plus près des objets visés.</p>`
  }
};
</script>
