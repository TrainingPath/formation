<script>
var DAY = {
  num: 10,
  title: "Mots de passe et état des comptes",
  subtitle: "Activer, désactiver, débloquer et réinitialiser en toute sécurité.",
  theory: `
<h3>1. L'état d'un compte</h3>
<p>Un compte utilisateur peut être <strong>actif</strong> (il peut se connecter) ou <strong>désactivé</strong> (il existe mais est bloqué, sans être supprimé). Désactiver plutôt que supprimer est la bonne pratique quand quelqu'un part : on garde la fiche et ses droits, prête à réactiver ou à archiver.</p>
<pre class="pseudo">Disable-ADAccount -Identity jdupont   # DESACTIVE le compte : il ne peut plus se connecter
Enable-ADAccount -Identity jdupont    # REACTIVE le compte : la connexion redevient possible
# Disable = eteindre, Enable = rallumer, sans jamais supprimer la fiche</pre>
<div class="tip">On peut aussi jouer sur l'état via <code>Set-ADUser -Enabled $true/$false</code>, mais <code>Enable-ADAccount</code> et <code>Disable-ADAccount</code> sont plus explicites et dédiés à cette tâche.</div>
<h3>2. Compte verrouillé : la différence avec désactivé</h3>
<p>Attention à ne pas confondre. Un compte <strong>verrouillé</strong> (<em>locked out</em>) l'a été automatiquement après trop de mauvais mots de passe, pour se protéger des attaques ; c'est temporaire. Un compte <strong>désactivé</strong> l'a été volontairement par un administrateur. On <strong>déverrouille</strong> avec <code>Unlock-ADAccount</code>.</p>
<pre class="pseudo">Unlock-ADAccount -Identity jdupont   # DEVERROUILLE un compte bloque apres trop d'essais rates
# ne pas confondre : Unlock (verrou automatique) vs Enable (desactivation manuelle)</pre>
<h3>3. Réinitialiser un mot de passe</h3>
<p>Quand un utilisateur a oublié son mot de passe, on le <strong>réinitialise</strong> avec <code>Set-ADAccountPassword</code> et le paramètre <code>-Reset</code>. Le nouveau mot de passe se fournit sous forme sécurisée, comme d'habitude.</p>
<pre class="pseudo">\$pwd = ConvertTo-SecureString "NouveauMdp2024!" -AsPlainText -Force   # prepare le nouveau mot de passe securise
Set-ADAccountPassword -Identity jdupont -Reset -NewPassword \$pwd      # remplace le mot de passe (reinitialisation)
# -Reset : on impose un nouveau mot de passe sans connaitre l'ancien
# -NewPassword : le nouveau mot de passe, sous forme securisee</pre>
<h3>4. Forcer le changement au prochain login</h3>
<p>Après une réinitialisation, la bonne pratique est d'obliger l'utilisateur à choisir SON mot de passe dès sa prochaine connexion. On combine avec <code>Set-ADUser -ChangePasswordAtLogon $true</code>.</p>
<pre class="pseudo">Set-ADUser -Identity jdupont -ChangePasswordAtLogon \$true   # l'utilisateur devra changer le mdp temporaire au prochain login
# ainsi l'administrateur ne connait pas le mot de passe definitif de l'utilisateur</pre>
<h3>5. Mot de passe qui n'expire pas</h3>
<p>Certains comptes de service ont un mot de passe qui ne doit jamais expirer. L'attribut se règle avec <code>Set-ADUser -PasswordNeverExpires $true</code>. À réserver à de rares cas justifiés : pour un humain, l'expiration régulière reste plus sûre.</p>
<pre class="pseudo">Set-ADUser -Identity svc_sauvegarde -PasswordNeverExpires \$true   # le mdp de ce compte de service n'expirera pas
# -PasswordNeverExpires : a limiter aux comptes techniques, jamais par confort</pre>
<div class="warn">Ne mets pas <code>PasswordNeverExpires</code> sur des comptes d'humains « pour éviter les rappels » : c'est une faille de sécurité. Réserve-le aux comptes de service surveillés.</div>
<h3>6. Repérer les comptes à problème</h3>
<p>Des cmdlets et filtres aident à faire le ménage : lister les comptes désactivés, verrouillés, ou dont le mot de passe est expiré. <code>Search-ADAccount</code> est spécialisée dans ces recherches d'état.</p>
<pre class="pseudo">Search-ADAccount -LockedOut          # tous les comptes actuellement verrouilles
Search-ADAccount -AccountDisabled    # tous les comptes desactives
Search-ADAccount -PasswordExpired    # tous les comptes au mot de passe expire
Get-ADUser -Filter { Enabled -eq \$false }   # autre facon de lister les comptes desactives</pre>
<h3>7. Le scénario de départ d'un employé</h3>
<p>Quand quelqu'un quitte l'entreprise, le réflexe sûr est : <strong>désactiver</strong> le compte (pas supprimer tout de suite), le décrire comme parti, et éventuellement le déplacer dans une OU d'archive (jour 12). On garde ainsi une trace et on peut réactiver en cas d'erreur.</p>
<pre class="pseudo">Disable-ADAccount -Identity jdupont                                   # 1) coupe l'acces immediatement
Set-ADUser -Identity jdupont -Description "Parti le 2024-06-30"       # 2) note la date de depart
# la suppression definitive viendra plus tard, apres periode de conservation</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle cmdlet DÉSACTIVE un compte sans le supprimer ?", opts: ["Remove-ADUser", "Disable-ADAccount", "Unlock-ADAccount", "Set-ADAccountPassword"], a: 1, exp: "Disable-ADAccount bloque la connexion en gardant la fiche." },
    { type: "qcm", q: "Quelle cmdlet RÉACTIVE un compte désactivé ?", opts: ["Enable-ADAccount", "Unlock-ADAccount", "New-ADUser", "Reset-ADUser"], a: 0, exp: "Enable-ADAccount rallume le compte." },
    { type: "qcm", q: "Un compte s'est bloqué tout seul après 10 mauvais mots de passe. Que faire ?", opts: ["Enable-ADAccount", "Unlock-ADAccount", "Remove-ADUser", "Rien"], a: 1, exp: "C'est un verrouillage : Unlock-ADAccount le déverrouille." },
    { type: "qcm", q: "Quelle cmdlet réinitialise un mot de passe oublié ?", opts: ["Set-ADUser -Password", "Set-ADAccountPassword -Reset", "New-Password", "Unlock-ADAccount"], a: 1, exp: "Set-ADAccountPassword -Reset impose un nouveau mot de passe." },
    { type: "qcm", q: "Pourquoi désactiver plutôt que supprimer un partant ?", opts: ["C'est plus rapide", "On garde la fiche et les droits, réactivables, avant suppression définitive", "Ça libère de l'espace", "Cela force le renouvellement de son mot de passe"], a: 1, exp: "Désactiver est réversible et conserve la trace." },
    { type: "input", q: "Complète : pour couper l'accès sans supprimer, on utilise ______-ADAccount .", a: ["Disable", "disable"], ph: "un verbe", exp: "Disable-ADAccount désactive le compte." },
    { type: "input", q: "Complète : pour déverrouiller un compte bloqué après trop d'essais, on utilise ______-ADAccount .", a: ["Unlock", "unlock"], ph: "un verbe", exp: "Unlock-ADAccount lève le verrouillage." },
    { type: "input", q: "Complète : pour réinitialiser un mot de passe, on utilise Set-ADAccountPassword -______ -NewPassword $pwd .", a: ["Reset", "reset"], ph: "un paramètre", exp: "-Reset impose un nouveau mot de passe." },
    { type: "input", q: "Complète : pour forcer le changement au prochain login, on met -ChangePasswordAtLogon $______ .", a: ["true", "True"], ph: "un booléen", exp: "$true oblige à redéfinir le mot de passe." },
    { type: "input", q: "Complète : pour lister les comptes verrouillés, on utilise Search-ADAccount -______ .", a: ["LockedOut", "lockedout"], ph: "un paramètre", exp: "Search-ADAccount -LockedOut." },
    { type: "input", q: "Complète : pour lister les comptes désactivés, on utilise Search-ADAccount -Account______ .", a: ["Disabled", "disabled"], ph: "un mot", exp: "Search-ADAccount -AccountDisabled." },
    { type: "vf", q: "Un compte verrouillé (locked out) et un compte désactivé, c'est exactement la même chose.", a: false, exp: "Verrouillé = blocage auto temporaire ; désactivé = action volontaire d'un admin." },
    { type: "vf", q: "Après une réinitialisation, il est prudent de forcer le changement de mot de passe au prochain login.", a: true, exp: "Ainsi l'admin ne connaît pas le mot de passe final de l'utilisateur." },
    { type: "vf", q: "Mettre PasswordNeverExpires $true sur les comptes des humains est une bonne pratique de confort.", a: false, exp: "C'est une faille : à réserver aux rares comptes de service surveillés." },
    { type: "qcm", q: "Quel est le bon premier geste quand un employé quitte l'entreprise ?", opts: ["Supprimer immédiatement le compte", "Désactiver le compte (réversible) et noter le départ", "Changer son bureau", "Ne rien faire"], a: 1, exp: "On désactive d'abord ; la suppression viendra après conservation." }
  ],
  final: {
    title: "Exercice final — Départ et retour de deux employés",
    intro: `<p>Deux situations : <code>jdupont</code> quitte l'entreprise (couper l'accès et noter le départ), et <code>mmartin</code> revient de congé mais s'est verrouillée en ratant son mot de passe ; il faut la déverrouiller et lui donner un mot de passe temporaire à changer au login. Étudie la trame :</p>
<pre class="pseudo">Disable-ADAccount -Identity jdupont                                   # coupe l'acces de jdupont
Set-ADUser -Identity jdupont -Description "Parti le 2024-06-30"       # note la date de depart
\$pwd = ConvertTo-SecureString "Retour2024!" -AsPlainText -Force       # nouveau mot de passe pour mmartin
Unlock-ADAccount -Identity mmartin                                    # leve le verrouillage
Set-ADAccountPassword -Identity mmartin -Reset -NewPassword \$pwd      # reinitialise son mot de passe
Set-ADUser -Identity mmartin -ChangePasswordAtLogon \$true            # a changer au prochain login</pre>`,
    questions: [
      { type: "input", q: "Quelle cmdlet coupe l'accès de jdupont sans le supprimer ?", a: ["Disable-ADAccount", "disable-adaccount"], ph: "Disable-...", exp: "Disable-ADAccount." },
      { type: "input", q: "Quelle cmdlet lève le verrouillage de mmartin ?", a: ["Unlock-ADAccount", "unlock-adaccount"], ph: "Unlock-...", exp: "Unlock-ADAccount." },
      { type: "input", q: "Quel paramètre de Set-ADAccountPassword impose un nouveau mot de passe ? (avec son tiret)", a: ["-Reset", "Reset", "-reset"], ph: "-Xxxx", exp: "-Reset." },
      { type: "qcm", q: "Pourquoi -ChangePasswordAtLogon $true pour mmartin ?", opts: ["Pour la bloquer", "Pour qu'elle choisisse elle-même son mot de passe définitif au prochain login", "Pour supprimer son compte", "Sans raison"], a: 1, exp: "L'admin ne doit pas connaître le mot de passe final." },
      { type: "qcm", q: "Pourquoi ne pas SUPPRIMER tout de suite le compte de jdupont ?", opts: ["Par flemme", "Pour garder la fiche/les droits, réversibles, le temps de la période de conservation", "C'est interdit", "Ça casse le domaine"], a: 1, exp: "Désactiver est réversible ; la suppression est définitive." }
    ],
    solution: `<p>Le double scénario, départ et déverrouillage :</p>
<pre class="pseudo"># --- Depart de jdupont ---
Disable-ADAccount -Identity jdupont                                   # coupe l'acces immediatement
Set-ADUser -Identity jdupont -Description "Parti le 2024-06-30"       # trace la date de depart
# --- Retour de mmartin ---
\$pwd = ConvertTo-SecureString "Retour2024!" -AsPlainText -Force       # nouveau mot de passe securise
Unlock-ADAccount -Identity mmartin                                    # deverrouille (essais rates)
Set-ADAccountPassword -Identity mmartin -Reset -NewPassword \$pwd      # reinitialise le mot de passe
Set-ADUser -Identity mmartin -ChangePasswordAtLogon \$true            # forcera un changement au login
Search-ADAccount -LockedOut                                          # verifie qu'il ne reste aucun verrou</pre>
<p>Tu maîtrises l'état et les mots de passe des comptes. Au jour 11, nous structurons l'annuaire avec les unités d'organisation (OU).</p>`
  }
};
</script>

};
