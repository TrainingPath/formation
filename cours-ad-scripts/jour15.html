<script>
var DAY = {
  num: 15,
  title: "Les ordinateurs du domaine",
  subtitle: "Les machines aussi ont un compte : les inventorier et les gérer.",
  theory: `
<h3>1. Un ordinateur est un objet, lui aussi</h3>
<p>Quand un PC « rejoint le domaine », l'annuaire crée pour lui un <strong>compte ordinateur</strong> : un objet, comme pour un utilisateur, avec ses propres attributs (nom, système d'exploitation, date de dernière connexion…). Cela permet à la machine de s'authentifier auprès du domaine et de recevoir des stratégies. Par convention, le nom d'un compte ordinateur se termine par un dollar (par exemple <code>PC-COMPTA01$</code>).</p>
<h3>2. Lister les ordinateurs : Get-ADComputer</h3>
<p>La cmdlet vedette est <code>Get-ADComputer</code>, sœur de <code>Get-ADUser</code>. Mêmes paramètres : <code>-Identity</code> pour une machine, <code>-Filter</code> pour une liste, <code>-Properties</code> pour plus d'attributs.</p>
<pre class="pseudo">Get-ADComputer -Identity "PC-COMPTA01"                          # affiche la fiche d'un ordinateur precis
Get-ADComputer -Filter *                                        # liste TOUS les ordinateurs du domaine
Get-ADComputer -Filter * -Properties OperatingSystem, LastLogonDate   # ajoute l'OS et la derniere connexion</pre>
<div class="tip">Tout ce que tu as appris sur Get-ADUser (jour 6) se transpose : -Identity, -Filter, -SearchBase, -Properties, le pipeline… fonctionnent pareil pour les ordinateurs.</div>
<h3>3. Attributs utiles d'un ordinateur</h3>
<p>Quelques attributs souvent consultés pour l'inventaire ou le ménage :</p>
<pre class="pseudo">Name              # le nom de la machine (ex. PC-COMPTA01)
OperatingSystem   # le systeme d'exploitation (ex. Windows 11 Pro)
LastLogonDate     # date de la derniere connexion au domaine (utile pour reperer les machines mortes)
Enabled           # le compte ordinateur est-il actif ?
DistinguishedName # le DN complet (dans quelle OU se trouve la machine)</pre>
<h3>4. Faire un inventaire</h3>
<p>On combine <code>Get-ADComputer</code> avec le pipeline pour produire des inventaires lisibles : choisir des colonnes, trier, exporter en CSV.</p>
<pre class="pseudo">Get-ADComputer -Filter * -Properties OperatingSystem |
  Select-Object Name, OperatingSystem |
  Sort-Object OperatingSystem                                   # liste triee par systeme d'exploitation
Get-ADComputer -Filter * -Properties OperatingSystem |
  Export-Csv -Path "C:\Temp\inventaire.csv" -NoTypeInformation  # exporte l'inventaire dans un fichier CSV</pre>
<h3>5. Repérer les machines inactives</h3>
<p>Un classique du ménage : trouver les ordinateurs qui ne se sont pas connectés depuis longtemps (peut-être remplacés ou volés). On compare <code>LastLogonDate</code> à une date de référence calculée avec <code>Get-Date</code>.</p>
<pre class="pseudo">\$limite = (Get-Date).AddDays(-90)                                       # date d'il y a 90 jours
Get-ADComputer -Filter { LastLogonDate -lt \$limite } -Properties LastLogonDate   # machines inactives depuis 90 jours
# -lt = strictement inferieur : LastLogonDate plus ancienne que la limite</pre>
<div class="warn">Ne supprime jamais un compte ordinateur inactif sans vérifier : la machine peut être simplement éteinte pour un long congé. Désactive d'abord (Disable-ADAccount), attends, puis supprime.</div>
<h3>6. Désactiver, déplacer, supprimer un ordinateur</h3>
<p>Les mêmes verbes que pour les utilisateurs s'appliquent : <code>Disable-ADAccount</code> désactive, <code>Move-ADObject</code> déplace, <code>Remove-ADComputer</code> supprime.</p>
<pre class="pseudo">Disable-ADAccount -Identity "PC-COMPTA01\$"                              # desactive le compte ordinateur (noter le dollar final)
Get-ADComputer -Identity "PC-COMPTA01" | Move-ADObject -TargetPath "OU=Obsoletes,DC=entreprise,DC=local"   # deplace vers une OU d'obsoletes
Remove-ADComputer -Identity "PC-COMPTA01" -Confirm:\$false               # supprime le compte ordinateur (sans confirmation)</pre>
<h3>7. Les ordinateurs dans les groupes</h3>
<p>Un compte ordinateur peut être membre d'un groupe (pour lui appliquer des stratégies ou des accès). On l'ajoute comme un utilisateur, en n'oubliant pas le dollar final du nom.</p>
<pre class="pseudo">Add-ADGroupMember -Identity "G_PostesCompta" -Members "PC-COMPTA01\$"    # ajoute la machine au groupe (dollar final obligatoire)
# un ordinateur membre d'un groupe peut recevoir des droits ou des GPO cibles</pre>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'un compte ordinateur dans l'annuaire ?", opts: ["Un simple fichier", "Un objet représentant une machine, avec ses attributs", "Un mot de passe", "Une OU"], a: 1, exp: "Comme un utilisateur, l'ordinateur est un objet de l'annuaire." },
    { type: "qcm", q: "Quelle cmdlet liste les ordinateurs du domaine ?", opts: ["Get-ADUser", "Get-ADComputer", "Get-Service", "Get-ADGroup"], a: 1, exp: "Get-ADComputer, sœur de Get-ADUser." },
    { type: "qcm", q: "Quel attribut indique la dernière connexion d'une machine ?", opts: ["OperatingSystem", "LastLogonDate", "Name", "Enabled"], a: 1, exp: "LastLogonDate sert à repérer les machines inactives." },
    { type: "qcm", q: "Par quel caractère se termine le nom d'un compte ordinateur ?", opts: ["Un point", "Un dollar ($)", "Un tiret", "Une étoile"], a: 1, exp: "Ex. PC-COMPTA01$ : le dollar final est la convention." },
    { type: "qcm", q: "Que faut-il faire AVANT de supprimer une machine inactive ?", opts: ["Rien", "Vérifier puis désactiver d'abord (elle peut être juste éteinte)", "Redémarrer le DC", "La renommer"], a: 1, exp: "On désactive et on attend avant de supprimer définitivement." },
    { type: "input", q: "Complète : la cmdlet qui lit les ordinateurs est Get-AD______ .", a: ["Computer", "computer"], ph: "un mot", exp: "Get-ADComputer." },
    { type: "input", q: "Complète : pour lister tous les ordinateurs, on tape Get-ADComputer -______ * .", a: ["Filter", "filter"], ph: "un paramètre", exp: "-Filter * liste toutes les machines." },
    { type: "input", q: "Complète : pour voir le système d'exploitation, on ajoute -Properties Operating______ .", a: ["System", "system"], ph: "un mot", exp: "-Properties OperatingSystem." },
    { type: "input", q: "Complète : pour une date d'il y a 90 jours, on écrit (Get-Date).AddDays(-______) .", a: ["90", "90)"], ph: "un nombre", exp: "(Get-Date).AddDays(-90)." },
    { type: "input", q: "Complète l'opérateur « strictement inférieur » pour comparer les dates : LastLogonDate -______ $limite .", a: ["lt", "LT"], ph: "deux lettres", exp: "-lt = less than (inférieur)." },
    { type: "input", q: "Complète : pour supprimer un compte ordinateur, on utilise Remove-AD______ .", a: ["Computer", "computer"], ph: "un mot", exp: "Remove-ADComputer." },
    { type: "vf", q: "Les paramètres de Get-ADComputer (-Identity, -Filter, -Properties) fonctionnent comme ceux de Get-ADUser.", a: true, exp: "La logique est identique d'un objet à l'autre." },
    { type: "vf", q: "Un compte ordinateur peut être membre d'un groupe.", a: true, exp: "Utile pour cibler des stratégies ou des accès sur des machines." },
    { type: "vf", q: "Une machine qui ne s'est pas connectée depuis 90 jours doit être supprimée immédiatement.", a: false, exp: "Elle peut être simplement éteinte : on vérifie et on désactive d'abord." },
    { type: "qcm", q: "Comment exporter l'inventaire des ordinateurs vers un fichier ?", opts: ["Remove-ADComputer", "Get-ADComputer -Filter * | Export-Csv -Path ... -NoTypeInformation", "Import-Csv", "New-ADComputer"], a: 1, exp: "Export-Csv écrit la liste dans un CSV." }
  ],
  final: {
    title: "Exercice final — Ménage du parc informatique",
    intro: `<p>Tu inventories le parc, repères les machines inactives depuis 90 jours, les désactives et les déplaces dans une OU « Obsoletes » (après simulation). Étudie la trame :</p>
<pre class="pseudo">\$limite = (Get-Date).AddDays(-90)                                                     # date seuil : il y a 90 jours
Get-ADComputer -Filter * -Properties OperatingSystem, LastLogonDate |
  Select-Object Name, OperatingSystem, LastLogonDate | Sort-Object LastLogonDate       # inventaire trie par anciennete
\$vieux = Get-ADComputer -Filter { LastLogonDate -lt \$limite } -Properties LastLogonDate   # machines inactives depuis 90 j
\$vieux | Disable-ADAccount                                                             # desactive ces machines
\$vieux | Move-ADObject -TargetPath "OU=Obsoletes,DC=entreprise,DC=local" -WhatIf        # SIMULE leur deplacement</pre>`,
    questions: [
      { type: "input", q: "Quelle cmdlet liste les ordinateurs ?", a: ["Get-ADComputer", "get-adcomputer"], ph: "Get-AD...", exp: "Get-ADComputer." },
      { type: "input", q: "Comment calcule-t-on la date d'il y a 90 jours ? (complète : (Get-Date).____(-90))", a: ["AddDays", "adddays"], ph: "une méthode", exp: "(Get-Date).AddDays(-90)." },
      { type: "qcm", q: "Que sélectionne { LastLogonDate -lt $limite } ?", opts: ["Les machines connectées aujourd'hui", "Les machines dont la dernière connexion est plus ancienne que la limite", "Tous les ordinateurs", "Les utilisateurs"], a: 1, exp: "-lt garde les dates antérieures au seuil." },
      { type: "input", q: "Quelle cmdlet désactive les comptes ordinateurs trouvés ?", a: ["Disable-ADAccount", "disable-adaccount"], ph: "Disable-...", exp: "Disable-ADAccount." },
      { type: "qcm", q: "Pourquoi -WhatIf sur le Move-ADObject final ?", opts: ["Pour supprimer les machines", "Pour simuler et vérifier ce qui serait déplacé avant d'agir", "Pour les rallumer", "Sans raison"], a: 1, exp: "On teste le déplacement de masse avant de l'appliquer." }
    ],
    solution: `<p>Le ménage complet du parc, prudent et vérifiable :</p>
<pre class="pseudo">\$limite = (Get-Date).AddDays(-90)                                                     # seuil d'inactivite : 90 jours
# 1) Inventaire lisible, trie par anciennete de connexion
Get-ADComputer -Filter * -Properties OperatingSystem, LastLogonDate |
  Select-Object Name, OperatingSystem, LastLogonDate |
  Sort-Object LastLogonDate
# 2) Reperer les machines inactives
\$vieux = Get-ADComputer -Filter { LastLogonDate -lt \$limite } -Properties LastLogonDate
# 3) Les desactiver (reversible), PAS supprimer tout de suite
\$vieux | Disable-ADAccount
# 4) Simuler le deplacement en OU Obsoletes avant de l'appliquer
\$vieux | Move-ADObject -TargetPath "OU=Obsoletes,DC=entreprise,DC=local" -WhatIf</pre>
<p>Tu sais inventorier et gérer les machines. Au jour 16, dernier jour, nous approfondissons l'art de rechercher et filtrer avec -Filter et -LDAPFilter.</p>`
  }
};
</script>
