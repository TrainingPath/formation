<script>
var DAY = {
  num: 7,
  title: "Créer des utilisateurs : New-ADUser",
  subtitle: "Fabriquer une fiche employé propre, active et prête à l'emploi.",
  theory: `
<h3>1. La cmdlet de création</h3>
<p>Pour créer un compte utilisateur, une seule cmdlet : <code>New-ADUser</code>. Elle fabrique une nouvelle fiche dans l'annuaire. Au minimum, il faut un <strong>nom</strong> ; en pratique on renseigne aussi l'identifiant de connexion et l'état du compte.</p>
<pre class="pseudo">New-ADUser -Name "Jean Dupont"   # cree une fiche minimale nommee Jean Dupont
# -Name devient le CN (Common Name) de l'objet dans l'annuaire</pre>
<h3>2. Les attributs indispensables</h3>
<p>Trois paramètres reviennent presque toujours : <code>-Name</code> (le nom affiché), <code>-SamAccountName</code> (l'identifiant de connexion, court et unique) et <code>-Enabled</code> (le compte est-il actif ?). On y ajoute souvent le <strong>UPN</strong> (<em>User Principal Name</em>), l'identifiant moderne façon adresse e-mail.</p>
<pre class="pseudo">New-ADUser -Name "Jean Dupont" -SamAccountName jdupont -UserPrincipalName "jdupont@entreprise.local" -Enabled $true   # compte complet et actif
# -SamAccountName    : identifiant de connexion court (jdupont)
# -UserPrincipalName : identifiant long facon e-mail (jdupont@entreprise.local)
# -Enabled $true     : le compte est actif des sa creation</pre>
<div class="warn">Un compte créé sans mot de passe reste <strong>désactivé</strong> : Windows refuse d'activer un compte utilisateur sans mot de passe valide. Il faut donc fournir un mot de passe pour pouvoir mettre <code>-Enabled $true</code>.</div>
<h3>3. Fournir un mot de passe</h3>
<p>Le mot de passe se donne via <code>-AccountPassword</code>, sous forme <strong>sécurisée</strong> (pas en texte brut). On le prépare avec <code>ConvertTo-SecureString</code>, exactement comme au jour 4.</p>
<pre class="pseudo">$pwd = ConvertTo-SecureString "Bienvenue2024!" -AsPlainText -Force   # prepare un mot de passe securise
New-ADUser -Name "Jean Dupont" -SamAccountName jdupont -AccountPassword $pwd -Enabled $true   # compte actif avec mot de passe
# -AccountPassword $pwd : le mot de passe initial, sous forme securisee</pre>
<h3>4. Placer l'utilisateur dans une OU</h3>
<p>Par défaut, le compte atterrit dans le conteneur <code>Users</code>. Pour le ranger dans un tiroir précis, on indique le DN de l'OU avec <code>-Path</code>.</p>
<pre class="pseudo">New-ADUser -Name "Jean Dupont" -SamAccountName jdupont -Path "OU=Ventes,DC=entreprise,DC=local" -Enabled $true   # cree Jean directement dans l'OU Ventes
# -Path : le DN de l'OU de destination</pre>
<h3>5. Enrichir la fiche</h3>
<p>De nombreux attributs descriptifs sont acceptés directement : prénom, nom, service, fonction, e-mail… Cela évite d'avoir à modifier la fiche ensuite.</p>
<pre class="pseudo">New-ADUser -Name "Jean Dupont" \`
  -GivenName "Jean" -Surname "Dupont" \`
  -Department "Comptabilite" -Title "Comptable" \`
  -EmailAddress "jdupont@entreprise.local" \`
  -SamAccountName jdupont -Enabled $true   # cree une fiche riche en une seule commande
# -GivenName : prenom ; -Surname : nom de famille
# -Department : service ; -Title : intitule de poste</pre>
<h3>6. Forcer le changement de mot de passe</h3>
<p>Bonne pratique de sécurité : obliger le nouvel employé à choisir son propre mot de passe à la première connexion, avec <code>-ChangePasswordAtLogon $true</code>. Le mot de passe initial n'est alors que temporaire.</p>
<pre class="pseudo">New-ADUser -Name "Jean Dupont" -SamAccountName jdupont -AccountPassword $pwd -Enabled $true -ChangePasswordAtLogon $true   # mdp temporaire, a changer au 1er login
# -ChangePasswordAtLogon $true : l'utilisateur devra definir son mot de passe des sa premiere connexion</pre>
<h3>7. Vérifier après création</h3>
<p>Réflexe systématique : relire la fiche qu'on vient de créer avec <code>Get-ADUser</code>, pour confirmer que tout est correct (identifiant, état, OU).</p>
<pre class="pseudo">Get-ADUser -Identity jdupont -Properties Department, Enabled   # verifie le compte fraichement cree
# on relit toujours ce que l'on vient d'ecrire</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle cmdlet crée un compte utilisateur ?", opts: ["Add-ADUser", "New-ADUser", "Set-ADUser", "Create-User"], a: 1, exp: "New-ADUser fabrique une nouvelle fiche utilisateur." },
    { type: "qcm", q: "Que devient la valeur de -Name dans l'annuaire ?", opts: ["Le mot de passe", "Le CN (Common Name) de l'objet", "L'adresse IP", "Le DN complet"], a: 1, exp: "-Name renseigne le CN de l'objet." },
    { type: "qcm", q: "Pourquoi un compte créé sans mot de passe reste-t-il désactivé ?", opts: ["Bug de PowerShell", "Windows refuse d'activer un compte sans mot de passe valide", "C'est plus rapide", "Il manque le nom"], a: 1, exp: "Sans mot de passe, impossible de mettre -Enabled $true." },
    { type: "qcm", q: "Comment fournit-on le mot de passe à New-ADUser ?", opts: ["-Password en texte brut", "-AccountPassword avec un mot de passe sécurisé", "-Pwd", "On ne peut pas"], a: 1, exp: "-AccountPassword attend un SecureString." },
    { type: "qcm", q: "Que fait -Path dans New-ADUser ?", opts: ["Fixe le mot de passe", "Indique le DN de l'OU où ranger le compte", "Active le compte", "Donne le prénom"], a: 1, exp: "-Path place l'utilisateur dans l'OU voulue." },
    { type: "input", q: "Complète : l'identifiant de connexion court se fixe avec -Sam______ .", a: ["AccountName", "accountname"], ph: "un mot", exp: "-SamAccountName jdupont." },
    { type: "input", q: "Complète : pour activer le compte, on met -Enabled $______ .", a: ["true", "True"], ph: "un booléen", exp: "-Enabled $true active le compte." },
    { type: "input", q: "Complète : le mot de passe se prépare avec ConvertTo-Secure______ .", a: ["String", "string"], ph: "un mot", exp: "ConvertTo-SecureString transforme le texte en mot de passe sécurisé." },
    { type: "input", q: "Complète : le prénom se fixe avec -Given______ .", a: ["Name", "name"], ph: "un mot", exp: "-GivenName \"Jean\" fixe le prénom." },
    { type: "input", q: "Complète : le nom de famille se fixe avec -Sur______ .", a: ["name", "Name"], ph: "un mot", exp: "-Surname \"Dupont\" fixe le nom de famille." },
    { type: "input", q: "Complète : pour forcer le changement du mot de passe au premier login, on met -ChangePasswordAtLogon $______ .", a: ["true", "True"], ph: "un booléen", exp: "-ChangePasswordAtLogon $true." },
    { type: "vf", q: "On peut activer un compte avec -Enabled $true sans jamais fournir de mot de passe.", a: false, exp: "Il faut un mot de passe valide pour pouvoir activer le compte." },
    { type: "vf", q: "Le paramètre -AccountPassword attend un mot de passe sécurisé, pas du texte brut.", a: true, exp: "On le prépare avec ConvertTo-SecureString." },
    { type: "vf", q: "Sans -Path, le nouvel utilisateur est rangé par défaut dans le conteneur Users.", a: true, exp: "Users est l'emplacement par défaut ; -Path permet de choisir une OU." },
    { type: "qcm", q: "Quel est le bon réflexe juste après New-ADUser ?", opts: ["Redémarrer le DC", "Relire la fiche avec Get-ADUser pour vérifier", "Supprimer le compte", "Rien"], a: 1, exp: "On relit toujours ce qu'on vient de créer." }
  ],
  final: {
    title: "Exercice final — Onboarding de Sophie Bernard",
    intro: `<p>Nouvelle recrue : Sophie Bernard, identifiant <code>sbernard</code>, service Marketing, à placer dans l'OU Marketing, compte actif avec mot de passe temporaire à changer au premier login. Étudie la trame :</p>
<pre class="pseudo">$pwd = ConvertTo-SecureString "Temporaire2024!" -AsPlainText -Force          # mot de passe initial securise
New-ADUser -Name "Sophie Bernard" -GivenName "Sophie" -Surname "Bernard" \`
  -SamAccountName sbernard -UserPrincipalName "sbernard@entreprise.local" \`
  -Department "Marketing" -Path "OU=Marketing,DC=entreprise,DC=local" \`
  -AccountPassword $pwd -Enabled $true -ChangePasswordAtLogon $true          # compte actif, mdp temporaire</pre>`,
    questions: [
      { type: "input", q: "Quel paramètre fixe l'identifiant de connexion sbernard ?", a: ["-SamAccountName", "SamAccountName", "-samaccountname"], ph: "-Xxxx", exp: "-SamAccountName sbernard." },
      { type: "input", q: "Quel paramètre place Sophie dans l'OU Marketing ? (avec son tiret)", a: ["-Path", "Path", "-path"], ph: "-Xxxx", exp: "-Path reçoit le DN de l'OU Marketing." },
      { type: "qcm", q: "Pourquoi préparer $pwd avec ConvertTo-SecureString ?", opts: ["Pour aller plus vite", "Parce que -AccountPassword exige un mot de passe sécurisé, pas du texte brut", "Pour créer l'OU", "Pour trier la liste"], a: 1, exp: "Le mot de passe doit être un SecureString." },
      { type: "input", q: "Quel paramètre oblige Sophie à changer son mot de passe au premier login ? (nom seul)", a: ["ChangePasswordAtLogon", "changepasswordatlogon", "-ChangePasswordAtLogon"], ph: "un paramètre", exp: "-ChangePasswordAtLogon $true." },
      { type: "qcm", q: "Sans fournir $pwd, que se passerait-il avec -Enabled $true ?", opts: ["Rien de spécial", "Le compte ne pourrait pas être activé (pas de mot de passe valide)", "Le DC redémarre", "Le compte serait supprimé"], a: 1, exp: "Un compte sans mot de passe ne peut pas être activé." }
    ],
    solution: `<p>Le script d'onboarding complet, à relire après exécution :</p>
<pre class="pseudo">$pwd = ConvertTo-SecureString "Temporaire2024!" -AsPlainText -Force          # 1) mot de passe temporaire securise
New-ADUser -Name "Sophie Bernard" \`
  -GivenName "Sophie" -Surname "Bernard" \`
  -SamAccountName sbernard \`
  -UserPrincipalName "sbernard@entreprise.local" \`
  -Department "Marketing" \`
  -Path "OU=Marketing,DC=entreprise,DC=local" \`
  -AccountPassword $pwd -Enabled $true -ChangePasswordAtLogon $true          # 2) creation complete
Get-ADUser -Identity sbernard -Properties Department, Enabled                # 3) verification apres coup</pre>
<p>Un compte propre est créé en une commande. Mais créer 300 comptes à la main serait fastidieux : au jour 8, nous automatisons la création en masse depuis un fichier CSV.</p>`
  }
};
</script>

    atoi: { cmd: "Sur une VM Windows Server promue controleur de domaine, execute TES cmdlets dans PowerShell, puis verifie le resultat dans l annuaire / la sortie attendue.", expected: "(New-ADUser ne renvoie rien en cas de succès ; le compte lpetit est créé dans OU=IT, actif)\n\nDistinguishedName : CN=Lucas Petit,OU=IT,DC=entreprise,DC=local\nDepartment        : Informatique\nEnabled           : True\nName              : Lucas Petit\nSamAccountName    : lpetit" },

  ]
