<script>
var DAY = {
  num: 13,
  title: "Les groupes : types et étendues",
  subtitle: "Distribuer des droits à des équipes entières plutôt qu'un par un.",
  theory: `
<h3>1. À quoi sert un groupe ?</h3>
<p>Un <strong>groupe</strong> est un objet qui rassemble plusieurs comptes (ou d'autres groupes) sous un même nom. Au lieu de donner l'accès à un dossier à 40 personnes une par une, on l'accorde une fois au groupe « Comptabilité », et tout membre du groupe en hérite. Pense à un trousseau d'invitations : inviter le « club de foot » plutôt que d'écrire 40 cartons.</p>
<div class="tip">Règle d'or de l'administration : on donne des droits aux <strong>groupes</strong>, pas aux personnes. Quand quelqu'un arrive ou part, il suffit de l'ajouter ou de le retirer du groupe ; les droits suivent automatiquement.</p>
<h3>2. Les deux TYPES de groupe</h3>
<p>Il existe deux <strong>types</strong> de groupe, selon leur usage :</p>
<pre class="pseudo">Type "Security"     # groupe de SECURITE : sert a donner des DROITS et des permissions (le plus courant)
Type "Distribution" # groupe de DISTRIBUTION : sert uniquement de liste d'envoi e-mail, PAS de droits</pre>
<p>Un groupe de <strong>sécurité</strong> peut recevoir des permissions (sur un dossier, une imprimante…). Un groupe de <strong>distribution</strong> ne sert qu'aux logiciels de messagerie pour envoyer un mail à toute une liste. Pour administrer des accès, on utilise presque toujours des groupes de sécurité.</p>
<h3>3. Les trois ÉTENDUES (scopes)</h3>
<p>L'<strong>étendue</strong> (en anglais <em>scope</em>) définit jusqu'où le groupe rayonne dans la forêt et qui il peut contenir. Il y en a trois :</p>
<pre class="pseudo">DomainLocal   # etendue LOCALE de domaine : pour DONNER l'acces a une ressource d'un domaine
Global        # etendue GLOBALE : pour REGROUPER des membres d'un meme domaine (par service, par role)
Universal     # etendue UNIVERSELLE : rayonne dans TOUTE la foret, utile en multi-domaines</pre>
<div class="warn">Ne confonds pas TYPE et ÉTENDUE : le type dit « à quoi sert le groupe » (droits ou mail), l'étendue dit « jusqu'où il porte et qui il contient ». Ce sont deux réglages distincts.</div>
<h3>4. La stratégie A-G-DL-P</h3>
<p>La bonne pratique classique se résume par l'acronyme <strong>A G DL P</strong> : les <em>comptes</em> (A) vont dans des groupes <em>Globaux</em> (G), eux-mêmes placés dans des groupes <em>DomainLocal</em> (DL), auxquels on attribue les <em>Permissions</em> (P). Cela sépare proprement « qui » et « quoi ».</p>
<pre class="pseudo">Accounts   -> Global      # on range les personnes dans des groupes globaux (ex. G_Comptables)
Global     -> DomainLocal # on range ces groupes globaux dans des groupes locaux (ex. DL_DossierCompta)
DomainLocal-> Permission  # on donne la permission sur la ressource au groupe DomainLocal
# A-G-DL-P : Account, Global, DomainLocal, Permission</pre>
<h3>5. Créer un groupe : New-ADGroup</h3>
<p>La cmdlet <code>New-ADGroup</code> crée un groupe. On précise son nom (<code>-Name</code>), son étendue (<code>-GroupScope</code>), son type (<code>-GroupCategory</code>) et son emplacement (<code>-Path</code>).</p>
<pre class="pseudo">New-ADGroup -Name "G_Comptables" \`
  -GroupScope Global \`
  -GroupCategory Security \`
  -Path "OU=Groupes,DC=entreprise,DC=local"   # cree un groupe de securite global nomme G_Comptables
# -GroupScope : l'etendue (DomainLocal, Global ou Universal)
# -GroupCategory : le type (Security ou Distribution)</pre>
<h3>6. Lire et modifier des groupes</h3>
<p>On lit les groupes avec <code>Get-ADGroup</code>, on les modifie avec <code>Set-ADGroup</code>, on les supprime avec <code>Remove-ADGroup</code>. La logique verbe-nom reste identique aux utilisateurs.</p>
<pre class="pseudo">Get-ADGroup -Filter *                                       # liste tous les groupes du domaine
Get-ADGroup -Identity "G_Comptables" -Properties GroupScope, GroupCategory   # lit type et etendue d'un groupe
Set-ADGroup -Identity "G_Comptables" -Description "Equipe comptabilite"       # ajoute une description</pre>
<div class="tip">Une convention de nommage aide beaucoup : préfixer les groupes globaux par <code>G_</code> et les DomainLocal par <code>DL_</code> rend l'annuaire lisible d'un coup d'œil.</div>`,
  exercises: [
    { type: "qcm", q: "À quoi sert principalement un groupe ?", opts: ["À stocker des mots de passe", "À rassembler des comptes pour leur donner des droits collectivement", "À créer des OU", "À redémarrer le DC"], a: 1, exp: "On accorde les droits au groupe, et les membres en héritent." },
    { type: "qcm", q: "Quel TYPE de groupe sert à donner des permissions ?", opts: ["Distribution", "Security", "Universal", "Global"], a: 1, exp: "Le groupe de sécurité (Security) porte des droits." },
    { type: "qcm", q: "À quoi sert un groupe de DISTRIBUTION ?", opts: ["À donner des droits", "Uniquement de liste d'envoi e-mail", "À créer des utilisateurs", "À rien"], a: 1, exp: "La distribution ne sert qu'à la messagerie, pas aux permissions." },
    { type: "qcm", q: "Que définit l'ÉTENDUE (scope) d'un groupe ?", opts: ["Sa couleur", "Jusqu'où il porte dans la forêt et qui il peut contenir", "Son mot de passe", "Sa date de création"], a: 1, exp: "L'étendue : DomainLocal, Global ou Universal." },
    { type: "qcm", q: "Dans A-G-DL-P, où range-t-on d'abord les comptes des personnes ?", opts: ["Dans des groupes Universal", "Dans des groupes Global", "Dans des groupes DomainLocal", "Nulle part"], a: 1, exp: "Accounts -> Global : les comptes vont dans des groupes globaux." },
    { type: "input", q: "Complète : la cmdlet qui crée un groupe est New-AD______ .", a: ["Group", "group"], ph: "un mot", exp: "New-ADGroup." },
    { type: "input", q: "Complète : l'étendue se fixe avec -Group______ .", a: ["Scope", "scope"], ph: "un mot", exp: "-GroupScope Global / DomainLocal / Universal." },
    { type: "input", q: "Complète : le type se fixe avec -Group______ .", a: ["Category", "category"], ph: "un mot", exp: "-GroupCategory Security / Distribution." },
    { type: "input", q: "Complète l'étendue qui REGROUPE des membres d'un même domaine : Group______ = Global .", a: ["Scope", "scope"], ph: "un mot", exp: "-GroupScope Global regroupe des comptes du domaine." },
    { type: "input", q: "Complète : l'étendue qui rayonne dans TOUTE la forêt s'appelle ______ .", a: ["Universal", "universal"], ph: "une étendue", exp: "L'étendue Universal porte sur toute la forêt." },
    { type: "input", q: "Complète : pour lire un groupe, on utilise Get-AD______ .", a: ["Group", "group"], ph: "un mot", exp: "Get-ADGroup." },
    { type: "vf", q: "Le TYPE et l'ÉTENDUE d'un groupe sont deux réglages différents.", a: true, exp: "Type = à quoi il sert ; étendue = jusqu'où il porte." },
    { type: "vf", q: "Pour gérer des accès à un dossier, on utilise un groupe de sécurité.", a: true, exp: "Seuls les groupes de sécurité portent des permissions." },
    { type: "vf", q: "La bonne pratique est de donner les droits directement aux personnes, pas aux groupes.", a: false, exp: "C'est l'inverse : on donne les droits aux groupes." },
    { type: "qcm", q: "Que veut dire l'acronyme A-G-DL-P ?", opts: ["Un nom de serveur", "Account -> Global -> DomainLocal -> Permission", "Un mot de passe", "Une version de Windows"], a: 1, exp: "La stratégie d'imbrication classique des groupes." }
  ],
  final: {
    title: "Exercice final — Structurer les groupes du service Compta",
    intro: `<p>Tu appliques la stratégie A-G-DL-P pour le dossier comptable : un groupe GLOBAL de sécurité <code>G_Comptables</code> pour regrouper les personnes, et un groupe DOMAINLOCAL de sécurité <code>DL_DossierCompta</code> pour porter la permission sur la ressource. Étudie la trame :</p>
<pre class="pseudo">New-ADGroup -Name "G_Comptables" -GroupScope Global -GroupCategory Security -Path "OU=Groupes,DC=entreprise,DC=local"        # groupe global (les personnes)
New-ADGroup -Name "DL_DossierCompta" -GroupScope DomainLocal -GroupCategory Security -Path "OU=Groupes,DC=entreprise,DC=local"   # groupe local (la ressource)
Set-ADGroup -Identity "G_Comptables" -Description "Membres de la comptabilite"   # decrit le groupe global</pre>`,
    questions: [
      { type: "input", q: "Quelle cmdlet crée un groupe ?", a: ["New-ADGroup", "new-adgroup"], ph: "New-AD...", exp: "New-ADGroup." },
      { type: "input", q: "Quel paramètre fixe l'étendue Global ou DomainLocal ? (avec son tiret)", a: ["-GroupScope", "GroupScope", "-groupscope"], ph: "-Xxxx", exp: "-GroupScope." },
      { type: "qcm", q: "Quel GroupCategory choisir pour porter des permissions ?", opts: ["Distribution", "Security", "Universal", "Global"], a: 1, exp: "Security : seul type qui porte des droits." },
      { type: "qcm", q: "Dans A-G-DL-P, quel rôle joue G_Comptables (Global) ?", opts: ["Il porte la permission finale", "Il regroupe les comptes des personnes", "Il crée l'OU", "Il stocke le mot de passe"], a: 1, exp: "Le groupe global rassemble les personnes." },
      { type: "input", q: "Quel préfixe de nommage indique un groupe DomainLocal dans l'exemple ?", a: ["DL_", "DL", "dl_"], ph: "un préfixe", exp: "DL_ pour DomainLocal, G_ pour Global." }
    ],
    solution: `<p>La structure A-G-DL-P appliquée à la comptabilité :</p>
<pre class="pseudo"># Groupe GLOBAL : regroupe les personnes (le "qui")
New-ADGroup -Name "G_Comptables" \`
  -GroupScope Global -GroupCategory Security \`
  -Path "OU=Groupes,DC=entreprise,DC=local"
# Groupe DOMAINLOCAL : portera la permission sur la ressource (le "quoi")
New-ADGroup -Name "DL_DossierCompta" \`
  -GroupScope DomainLocal -GroupCategory Security \`
  -Path "OU=Groupes,DC=entreprise,DC=local"
Set-ADGroup -Identity "G_Comptables" -Description "Membres de la comptabilite"
# Prochaine etape (jour 14) : mettre G_Comptables DANS DL_DossierCompta, et donner la permission a DL_DossierCompta</pre>
<p>Les groupes sont créés et bien typés. Au jour 14, nous les remplissons : ajouter et retirer des membres avec Add/Remove-ADGroupMember.</p>`
  }
};
</script>
