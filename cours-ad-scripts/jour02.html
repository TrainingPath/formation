<script>
var DAY = {
  num: 2,
  title: "PowerShell : les bases pour l'administrateur",
  subtitle: "Apprendre à parler à Windows avec des verbes, des noms et des paramètres.",
  theory: `
<h3>1. Qu'est-ce que PowerShell ?</h3>
<p><strong>PowerShell</strong> est à la fois un langage et une console (une fenêtre où l'on tape des commandes) fournis avec Windows. C'est l'outil de l'administrateur pour piloter le système sans souris. On y tape des commandes appelées <strong>cmdlets</strong> (« commandelettes »), et on peut les enchaîner dans un fichier <strong>.ps1</strong> qu'on appelle un <strong>script</strong>.</p>
<h3>2. La grammaire Verbe-Nom</h3>
<p>Chaque cmdlet suit toujours la même forme : un <strong>verbe</strong> approuvé, un tiret, puis un <strong>nom</strong> au singulier. C'est comme donner un ordre clair : « <em>Prends</em> le <em>dossier</em> », « <em>Crée</em> l'<em>utilisateur</em> ». Cette régularité rend les commandes faciles à deviner.</p>
<pre class="pseudo">Get-Process       # Get  = obtenir  ->  liste les processus qui tournent
Get-Service       # Get  = obtenir  ->  liste les services Windows
New-Item          # New  = creer    ->  cree un fichier ou un dossier
Set-Location      # Set  = definir  ->  change de dossier courant
Remove-Item       # Remove = enlever->  supprime un fichier</pre>
<div class="tip">Les verbes sont standardisés. <code>Get</code> lit, <code>New</code> crée, <code>Set</code> modifie, <code>Add</code> ajoute, <code>Remove</code> supprime. Une fois ces verbes connus, tu devines la moitié des commandes AD.</div>
<h3>3. Les paramètres</h3>
<p>Un <strong>paramètre</strong> précise <em>comment</em> exécuter la commande. Il commence par un tiret et est suivi d'une valeur, comme les options d'une recette (« cuire <em>-température</em> 180 <em>-durée</em> 30 »). L'ordre des paramètres n'a pas d'importance puisqu'ils sont nommés.</p>
<pre class="pseudo">Get-Service -Name Spooler                 # -Name : ne montrer que le service Spooler
New-Item -Path C:\Temp -ItemType Directory # -Path : ou creer ; -ItemType : quoi creer (un dossier)
Get-ChildItem -Path C:\ -Recurse           # -Recurse : descendre aussi dans les sous-dossiers</pre>
<h3>4. Les variables</h3>
<p>Une <strong>variable</strong> est une boîte étiquetée où l'on range une valeur pour la réutiliser. En PowerShell, son nom commence toujours par un dollar. On y met une valeur avec le signe égal.</p>
<pre class="pseudo">$nom = "Jean Dupont"       # range le texte "Jean Dupont" dans la boite $nom
$actif = $true             # $true et $false sont les deux valeurs booleennes (vrai / faux)
Write-Output $nom          # affiche le contenu de la boite : Jean Dupont</pre>
<div class="warn">Un texte se met entre guillemets ; un booléen s'écrit <code>$true</code> ou <code>$false</code> (avec le dollar). Ne confonds pas <code>$actif</code> (la variable) et <code>$true</code> (la valeur).</div>
<h3>5. Le pipeline : enchaîner les commandes</h3>
<p>Le <strong>pipeline</strong> (la barre verticale) envoie le résultat d'une cmdlet directement dans la suivante, comme un tapis roulant qui passe les objets d'un poste à l'autre. C'est la grande force de PowerShell : il fait circuler des <strong>objets</strong> (des fiches complètes), pas seulement du texte.</p>
<pre class="pseudo">Get-Service | Where-Object { $_.Status -eq "Running" }   # ne garder que les services en marche
# Get-Service produit toutes les fiches de service
# |  = le tapis roulant qui les transmet
# Where-Object = un filtre ; $_ designe la fiche en cours de traitement
# .Status = l'attribut Statut ; -eq = est egal a ; "Running" = en marche</pre>
<h3>6. Lire un attribut avec le point</h3>
<p>Pour lire un <strong>attribut</strong> d'un objet, on écrit l'objet, un point, puis le nom de l'attribut. Le point veut dire « de » : <code>$service.Status</code> se lit « le Statut de $service ».</p>
<pre class="pseudo">$s = Get-Service -Name Spooler   # range la fiche du service Spooler dans $s
$s.Status                        # lit l'attribut Status (Running ou Stopped)
$s.DisplayName                   # lit le nom affiche du service</pre>
<h3>7. Demander de l'aide</h3>
<p>Deux réflexes de survie : <code>Get-Help</code> explique une cmdlet, et <code>Get-Command</code> cherche les cmdlets disponibles. Personne ne retient tout par cœur ; on sait juste où chercher.</p>
<pre class="pseudo">Get-Help Get-Service -Examples   # affiche des exemples d'utilisation de Get-Service
Get-Command -Verb Get -Noun AD*  # liste les cmdlets Get-AD... (celles de l'annuaire)
Get-Service | Get-Member         # liste les attributs et actions disponibles sur une fiche service</pre>
<div class="tip">Ces trois cmdlets d'aide fonctionnent partout, y compris sur les cmdlets Active Directory que nous verrons à partir du jour 5.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle est la forme générale d'une cmdlet PowerShell ?", opts: ["Nom-Verbe", "Verbe-Nom (ex. Get-Service)", "Nom seul", "Un simple mot isolé"], a: 1, exp: "Toujours un verbe approuvé, un tiret, un nom singulier." },
    { type: "qcm", q: "Que fait le verbe Get dans une cmdlet ?", opts: ["Il crée", "Il supprime", "Il lit / obtient une information", "Il redémarre"], a: 2, exp: "Get lit sans rien modifier : c'est le verbe le plus sûr." },
    { type: "qcm", q: "À quoi sert le pipeline (la barre |) ?", opts: ["À commenter", "À envoyer le résultat d'une cmdlet dans la suivante", "À créer une variable", "À supprimer un fichier"], a: 1, exp: "Le pipeline fait circuler les objets d'une commande à l'autre." },
    { type: "qcm", q: "Comment écrit-on la valeur booléenne VRAI en PowerShell ?", opts: ["true", "$true", "\"vrai\"", "1.0"], a: 1, exp: "$true et $false, avec le dollar, sont les booléens de PowerShell." },
    { type: "qcm", q: "Dans le pipeline, que représente $_ ?", opts: ["Le nom du script", "L'objet en cours de traitement", "Une erreur", "Le dossier courant"], a: 1, exp: "$_ désigne l'élément qui circule actuellement sur le tapis roulant." },
    { type: "input", q: "Complète : pour LIRE la liste des services, on tape Get-______ .", a: ["Service", "service"], ph: "un nom", exp: "Get-Service liste les services Windows." },
    { type: "input", q: "Complète : une variable en PowerShell commence toujours par le caractère ______ .", a: ["$", "dollar"], ph: "un symbole", exp: "Le dollar introduit toute variable : $nom, $actif…" },
    { type: "input", q: "Complète : pour lire l'attribut Status de l'objet rangé dans $s, on écrit $s______Status .", a: [".", "point"], ph: "un symbole", exp: "Le point relie l'objet à son attribut : $s.Status." },
    { type: "input", q: "Complète : la cmdlet qui affiche l'aide et des exemples s'appelle Get-______ .", a: ["Help", "help"], ph: "un nom", exp: "Get-Help Get-Service -Examples montre des exemples." },
    { type: "input", q: "Complète : le paramètre qui précise le nom d'un service à filtrer est -______ .", a: ["Name", "name"], ph: "un paramètre", exp: "Get-Service -Name Spooler ne montre que Spooler." },
    { type: "input", q: "Complète l'opérateur : pour tester « est égal à » dans un filtre, on utilise -______ .", a: ["eq", "EQ"], ph: "deux lettres", exp: "-eq signifie equal (égal). Il y a aussi -ne, -gt, -lt." },
    { type: "vf", q: "L'ordre des paramètres nommés n'a pas d'importance car chacun porte son étiquette.", a: true, exp: "Comme ils sont nommés (-Path, -Name…), on peut les écrire dans n'importe quel ordre." },
    { type: "vf", q: "Le pipeline de PowerShell ne fait circuler que du texte brut, jamais des objets.", a: false, exp: "Justement, il fait circuler des objets complets avec tous leurs attributs." },
    { type: "vf", q: "Get-Command permet de découvrir quelles cmdlets existent, par exemple toutes celles en Get-AD*.", a: true, exp: "Get-Command -Verb Get -Noun AD* liste les cmdlets d'annuaire." },
    { type: "qcm", q: "Quel verbe utiliserais-tu pour MODIFIER une propriété existante ?", opts: ["Get", "New", "Set", "Remove"], a: 2, exp: "Set modifie ; New crée ; Get lit ; Remove supprime." }
  ],
  final: {
    title: "Exercice final — Lire l'état d'un service",
    intro: `<p>Tu veux savoir si le service d'impression <code>Spooler</code> tourne, puis n'afficher que les services actuellement en marche. Étudie ce script commenté :</p>
<pre class="pseudo">$s = Get-Service -Name Spooler                        # range la fiche du Spooler dans $s
Write-Output $s.Status                                # affiche son statut : Running ou Stopped
Get-Service | Where-Object { $_.Status -eq "Running" } # liste tous les services en marche</pre>`,
    questions: [
      { type: "input", q: "Quel paramètre limite Get-Service au seul Spooler ? (écris-le avec son tiret)", a: ["-Name", "-name", "Name", "name"], ph: "-Xxxx", exp: "-Name Spooler cible un service précis." },
      { type: "input", q: "Pour lire le statut de la fiche rangée dans $s, on écrit $s puis quel symbole puis Status ?", a: [".", "point"], ph: "un symbole", exp: "$s.Status : le point relie l'objet à son attribut." },
      { type: "qcm", q: "Dans le filtre Where-Object, que teste { $_.Status -eq \"Running\" } ?", opts: ["Que le statut vaut Running (en marche)", "Que le service s'appelle Running", "Rien", "Que le service est arrêté"], a: 0, exp: "-eq compare le statut de l'objet courant à Running." },
      { type: "qcm", q: "Que représente $_ dans ce filtre ?", opts: ["La fiche de service en cours de traitement", "Le mot Running", "Une erreur", "Le nom du script"], a: 0, exp: "$_ est l'objet qui passe sur le pipeline à cet instant." },
      { type: "input", q: "Quel verbe faudrait-il pour DÉMARRER un service arrêté ? (verbe seul, il précède -Service)", a: ["Start", "start"], ph: "un verbe", exp: "Start-Service -Name Spooler démarre le service." }
    ],
    solution: `<p>Le script combine tout ce que nous avons vu : variable, attribut avec le point, pipeline et filtre.</p>
<pre class="pseudo">$s = Get-Service -Name Spooler                         # 1) on lit la fiche du Spooler
Write-Output $s.Status                                 # 2) on affiche son attribut Status
Get-Service | Where-Object { $_.Status -eq "Running" } # 3) on filtre : uniquement les services en marche
# Get-Service produit toutes les fiches
# | les envoie une par une dans Where-Object
# $_ est la fiche courante, .Status son statut, -eq le teste contre "Running"</pre>
<p>Ces réflexes (verbe-nom, paramètres, pipeline, point) sont exactement ceux que tu réutiliseras avec les cmdlets Active Directory à partir du jour 5.</p>`
  }
};
</script>
