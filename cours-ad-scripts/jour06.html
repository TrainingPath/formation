<script>
var DAY = {
  num: 6,
  title: "Explorer l'annuaire : Get-ADUser, Get-ADObject",
  subtitle: "Lire des fiches sans rien casser : le réflexe le plus sûr de l'administrateur.",
  theory: `
<h3>1. Lire d'abord, toujours</h3>
<p>Avant de modifier quoi que ce soit, on <strong>lit</strong>. Les cmdlets en <code>Get-</code> ne changent rien : elles se contentent d'afficher. C'est le terrain d'entraînement idéal. Les deux vedettes du jour sont <code>Get-ADUser</code> (lire des utilisateurs) et <code>Get-ADObject</code> (lire n'importe quel objet, quel que soit son type).</p>
<h3>2. Get-ADUser -Identity : une fiche précise</h3>
<p>Le paramètre <code>-Identity</code> désigne UN objet précis, en général par son <strong>SamAccountName</strong> (l'identifiant de connexion) ou son DN. La cmdlet renvoie alors la fiche de cette personne.</p>
<pre class="pseudo">Get-ADUser -Identity jdupont   # affiche la fiche de l'utilisateur dont l'identifiant est jdupont
# -Identity accepte le SamAccountName (jdupont) ou le DN complet</pre>
<div class="warn">Par défaut, Get-ADUser n'affiche qu'une poignée d'attributs (Name, SamAccountName, Enabled…). Beaucoup d'informations restent cachées tant qu'on ne les demande pas explicitement.</div>
<h3>3. Voir plus d'attributs : -Properties</h3>
<p>Pour afficher des attributs supplémentaires (service, e-mail, dernière connexion…), on liste leurs noms avec <code>-Properties</code>. Le mot magique <code>*</code> demande <strong>tous</strong> les attributs.</p>
<pre class="pseudo">Get-ADUser -Identity jdupont -Properties Department, EmailAddress   # ajoute le service et l'e-mail a l'affichage
Get-ADUser -Identity jdupont -Properties *                          # affiche TOUS les attributs de la fiche</pre>
<h3>4. Chercher plusieurs utilisateurs : -Filter</h3>
<p>Pour obtenir une liste au lieu d'une seule fiche, on remplace <code>-Identity</code> par <code>-Filter</code>, qui exprime un critère. <code>-Filter *</code> signifie « tout le monde ». Nous approfondirons les filtres au jour 16 ; voici les bases :</p>
<pre class="pseudo">Get-ADUser -Filter *                                  # TOUS les utilisateurs du domaine
Get-ADUser -Filter { Department -eq "Ventes" }        # ceux dont le service est Ventes
Get-ADUser -Filter { Enabled -eq $true }              # uniquement les comptes actifs</pre>
<div class="tip">Retiens la règle : <code>-Identity</code> pour UNE fiche connue, <code>-Filter</code> pour CHERCHER une liste selon un critère. Ne mets jamais les deux ensemble.</div>
<h3>5. Limiter la zone de recherche : -SearchBase</h3>
<p><code>-SearchBase</code> restreint la recherche à une branche précise de l'annuaire, en donnant le DN d'une OU. C'est comme dire « ne cherche que dans ce tiroir ».</p>
<pre class="pseudo">Get-ADUser -Filter * -SearchBase "OU=Ventes,DC=entreprise,DC=local"   # uniquement les utilisateurs du tiroir Ventes
# -SearchBase : le DN de l'OU ou l'on limite la recherche</pre>
<h3>6. Get-ADObject : lire tout type d'objet</h3>
<p><code>Get-ADUser</code> ne voit que les utilisateurs. Pour lire <strong>n'importe quel</strong> objet (utilisateur, groupe, ordinateur, OU…), on utilise <code>Get-ADObject</code>. C'est le passe-partout de la lecture.</p>
<pre class="pseudo">Get-ADObject -Filter { Name -eq "Ventes" }                    # cherche tout objet nomme "Ventes" (peut etre une OU, un groupe...)
Get-ADObject -Filter { ObjectClass -eq "user" }               # tous les objets de type utilisateur
Get-ADObject -Identity "OU=Ventes,DC=entreprise,DC=local"     # lit l'OU Ventes par son DN</pre>
<h3>7. Choisir et trier l'affichage</h3>
<p>On combine souvent Get-ADUser avec le pipeline pour ne montrer que certaines colonnes (<code>Select-Object</code>) ou pour trier (<code>Sort-Object</code>).</p>
<pre class="pseudo">Get-ADUser -Filter * | Select-Object Name, SamAccountName   # n'afficher que deux colonnes
Get-ADUser -Filter * | Sort-Object Name                     # trier la liste par nom
Get-ADUser -Filter * | Measure-Object                       # compter combien il y en a (attribut Count)</pre>`,
  exercises: [
    { type: "qcm", q: "Pourquoi commence-t-on par les cmdlets Get- ?", opts: ["Elles sont plus rapides", "Elles ne modifient rien : lire est sans danger", "Elles suppriment les doublons", "Elles créent des comptes"], a: 1, exp: "Get- lit seulement : c'est le terrain d'entraînement sûr." },
    { type: "qcm", q: "Quel paramètre cible UN utilisateur précis par son identifiant ?", opts: ["-Filter", "-Identity", "-SearchBase", "-Properties"], a: 1, exp: "-Identity jdupont désigne une seule fiche." },
    { type: "qcm", q: "Que fait -Properties * ?", opts: ["Supprime les attributs", "Affiche TOUS les attributs de la fiche", "Filtre les comptes actifs", "Trie la liste"], a: 1, exp: "L'étoile demande l'ensemble des attributs." },
    { type: "qcm", q: "Quelle cmdlet lit N'IMPORTE QUEL type d'objet (user, group, OU…) ?", opts: ["Get-ADUser", "Get-ADObject", "Get-ADGroup", "Get-Service"], a: 1, exp: "Get-ADObject est le passe-partout de la lecture." },
    { type: "qcm", q: "Que renvoie Get-ADUser -Filter * ?", opts: ["Une erreur", "Tous les utilisateurs du domaine", "Un seul utilisateur", "Les groupes"], a: 1, exp: "-Filter * signifie « tout le monde »." },
    { type: "input", q: "Complète : pour afficher la fiche de jdupont, on tape Get-ADUser -______ jdupont .", a: ["Identity", "identity"], ph: "un paramètre", exp: "-Identity désigne une fiche précise." },
    { type: "input", q: "Complète : pour afficher aussi le service et l'e-mail, on ajoute -______ Department, EmailAddress .", a: ["Properties", "properties"], ph: "un paramètre", exp: "-Properties ajoute des attributs à l'affichage." },
    { type: "input", q: "Complète : pour CHERCHER une liste selon un critère, on utilise -______ au lieu de -Identity.", a: ["Filter", "filter"], ph: "un paramètre", exp: "-Filter exprime un critère de recherche." },
    { type: "input", q: "Complète : pour limiter la recherche à une OU précise, on utilise -Search______ .", a: ["Base", "base"], ph: "un mot", exp: "-SearchBase reçoit le DN de l'OU." },
    { type: "input", q: "Complète : pour n'afficher que certaines colonnes, on enchaîne avec | Select-______ Name, SamAccountName .", a: ["Object", "object"], ph: "un mot", exp: "Select-Object choisit les colonnes." },
    { type: "input", q: "Complète : pour trier la liste par nom, on enchaîne avec | Sort-______ Name .", a: ["Object", "object"], ph: "un mot", exp: "Sort-Object trie le résultat." },
    { type: "vf", q: "Get-ADUser affiche par défaut TOUS les attributs de l'utilisateur.", a: false, exp: "Il n'en montre que quelques-uns ; il faut -Properties pour en voir plus." },
    { type: "vf", q: "On peut utiliser -Identity et -Filter en même temps dans un seul Get-ADUser.", a: false, exp: "L'un cible une fiche, l'autre cherche une liste : ils s'excluent." },
    { type: "vf", q: "Get-ADObject peut retrouver une OU ou un groupe, pas seulement un utilisateur.", a: true, exp: "C'est justement son intérêt : il voit tous les types d'objets." },
    { type: "qcm", q: "Comment COMPTER le nombre d'utilisateurs du domaine ?", opts: ["Get-ADUser -Count", "Get-ADUser -Filter * | Measure-Object", "Get-ADUser -All", "Get-ADObject -Sum"], a: 1, exp: "Measure-Object compte les objets qui traversent le pipeline." }
  ],
  final: {
    title: "Exercice final — Enquêter dans le tiroir Ventes",
    intro: `<p>Tu veux : consulter la fiche complète de <code>mmartin</code>, puis lister tous les utilisateurs ACTIFS de l'OU Ventes en n'affichant que leur nom et leur identifiant, triés par nom. Étudie la trame :</p>
<pre class="pseudo">Get-ADUser -Identity mmartin -Properties *                                  # fiche complete de Marie
Get-ADUser -Filter { Enabled -eq $true } -SearchBase "OU=Ventes,DC=entreprise,DC=local" |
  Select-Object Name, SamAccountName | Sort-Object Name                     # actifs de Ventes, tries</pre>`,
    questions: [
      { type: "input", q: "Quel paramètre affiche TOUS les attributs de la fiche de Marie ? (avec sa valeur)", a: ["-Properties *", "-properties *", "Properties *"], ph: "-Xxx *", exp: "-Properties * demande l'ensemble des attributs." },
      { type: "input", q: "Quel paramètre limite la recherche au seul tiroir Ventes ?", a: ["-SearchBase", "-searchbase", "SearchBase"], ph: "-Xxxx", exp: "-SearchBase reçoit le DN de l'OU Ventes." },
      { type: "qcm", q: "Que sélectionne { Enabled -eq $true } ?", opts: ["Les comptes désactivés", "Les comptes actifs uniquement", "Tous les objets", "Les groupes"], a: 1, exp: "-eq $true garde les comptes activés." },
      { type: "input", q: "Quelle cmdlet du pipeline ne garde que les colonnes Name et SamAccountName ?", a: ["Select-Object", "select-object"], ph: "Select-...", exp: "Select-Object Name, SamAccountName." },
      { type: "qcm", q: "Pourquoi utiliser -Identity pour Marie mais -Filter pour la liste ?", opts: ["Au hasard", "-Identity cible une fiche connue, -Filter cherche une liste selon un critère", "-Filter est plus rapide", "Les deux sont identiques"], a: 1, exp: "Une fiche précise vs une recherche par critère." }
    ],
    solution: `<p>La combinaison lecture ciblée + recherche filtrée + mise en forme :</p>
<pre class="pseudo">Get-ADUser -Identity mmartin -Properties *                                   # 1) toute la fiche de Marie
Get-ADUser -Filter { Enabled -eq $true } \`
  -SearchBase "OU=Ventes,DC=entreprise,DC=local" |                           # 2) actifs, uniquement dans Ventes
  Select-Object Name, SamAccountName |                                       # ne garder que 2 colonnes
  Sort-Object Name                                                           # trier par nom
# -Identity : une fiche connue ;  -Filter + -SearchBase : une recherche ciblee</pre>
<p>Tu sais maintenant explorer l'annuaire dans tous les sens sans rien modifier. Au jour 7, on passe à la création avec New-ADUser.</p>`
  }
};
</script>

<script>

    atoi: { cmd: "Get-ADUser -Identity jdupont -Properties *\nGet-ADUser -Filter * | Select-Object Name, SamAccountName | Sort-Object Name\nGet-ADUser -Filter * | Measure-Object", expected: "(fiche complète de jdupont : tous les attributs)\nDistinguishedName : CN=Jean Dupont,OU=IT,DC=entreprise,DC=local\nEnabled           : True\n...\n\nName          SamAccountName\n----          --------------\nAlice Bernard abernard\nJean Dupont   jdupont\n...\n\nCount : 42" },
    checklist: ["Utilises-tu -Properties * uniquement pour la fiche complète demandée ?", "La liste est-elle réduite à Name + SamAccountName puis triée par nom ?", "Comptes-tu le total avec Measure-Object en fin de pipeline ?"],
    hints: [

      "Enchaîne Get-ADUser -Filter * avec Select-Object puis Sort-Object.",

    ],
    solution: "Get-ADUser -Identity jdupont -Properties *              # 1) affiche TOUS les attributs de la fiche de jdupont\nGet-ADUser -Filter * | Select-Object Name, SamAccountName | Sort-Object Name   # 2) liste nom + identifiant, triee par nom\nGet-ADUser -Filter * | Measure-Object                  # 3) compte le nombre total d'utilisateurs (attribut Count)\n# -Filter * = tout le monde ; le pipeline | met en forme puis compte",

  ]
};
