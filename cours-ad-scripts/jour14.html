<script>
var DAY = {
  num: 14,
  title: "Gérer les membres d'un groupe",
  subtitle: "Ajouter, retirer, lister : faire vivre les groupes au quotidien.",
  theory: `
<h3>1. Un groupe vide ne sert à rien</h3>
<p>Créer un groupe (jour 13) ne suffit pas : il faut le <strong>peupler</strong> de <strong>membres</strong>. Un membre est un objet appartenant au groupe : le plus souvent un utilisateur, mais aussi un ordinateur ou un autre groupe. Les cmdlets du jour ajoutent, retirent et listent ces membres.</p>
<h3>2. Ajouter des membres : Add-ADGroupMember</h3>
<p><code>Add-ADGroupMember</code> ajoute un ou plusieurs membres à un groupe. On indique le groupe (<code>-Identity</code>) et le ou les membres (<code>-Members</code>).</p>
<pre class="pseudo">Add-ADGroupMember -Identity "G_Comptables" -Members jdupont              # ajoute jdupont au groupe G_Comptables
Add-ADGroupMember -Identity "G_Comptables" -Members jdupont, mmartin, lpetit   # ajoute plusieurs membres d'un coup
# -Identity : le groupe a remplir ; -Members : la liste des membres a ajouter (separes par des virgules)</pre>
<h3>3. Retirer des membres : Remove-ADGroupMember</h3>
<p><code>Remove-ADGroupMember</code> retire des membres. Par défaut, elle demande une confirmation ; dans un script, on ajoute <code>-Confirm:$false</code> pour ne pas être interrompu.</p>
<pre class="pseudo">Remove-ADGroupMember -Identity "G_Comptables" -Members jdupont -Confirm:\$false   # retire jdupont du groupe, sans demander de confirmation
# retirer un membre ne SUPPRIME pas son compte : il quitte juste le groupe</pre>
<div class="warn">Retirer quelqu'un d'un groupe ne supprime pas son compte : cela lui retire seulement les droits liés à ce groupe. Ne confonds pas <code>Remove-ADGroupMember</code> (quitter un groupe) et <code>Remove-ADUser</code> (effacer le compte).</div>
<h3>4. Lister les membres : Get-ADGroupMember</h3>
<p><code>Get-ADGroupMember</code> affiche qui appartient au groupe. Avec <code>-Recursive</code>, elle descend aussi dans les groupes imbriqués pour montrer TOUS les membres effectifs.</p>
<pre class="pseudo">Get-ADGroupMember -Identity "G_Comptables"                       # membres directs du groupe
Get-ADGroupMember -Identity "G_Comptables" -Recursive            # tous les membres, y compris via groupes imbriques
Get-ADGroupMember -Identity "G_Comptables" | Measure-Object      # compte le nombre de membres</pre>
<h3>5. Voir les groupes d'un utilisateur</h3>
<p>La question inverse est fréquente : « à quels groupes appartient jdupont ? ». On lit alors l'attribut <code>MemberOf</code> de l'utilisateur.</p>
<pre class="pseudo">Get-ADUser -Identity jdupont -Properties MemberOf   # affiche la liste des groupes de jdupont
(Get-ADUser -Identity jdupont -Properties MemberOf).MemberOf   # extrait juste les DN des groupes
# MemberOf : l'attribut qui liste les groupes auxquels appartient l'utilisateur</pre>
<h3>6. Imbriquer des groupes (A-G-DL-P)</h3>
<p>Un groupe peut être membre d'un autre groupe. C'est ainsi qu'on applique A-G-DL-P (jour 13) : on met le groupe Global DANS le groupe DomainLocal, avec la même cmdlet <code>Add-ADGroupMember</code>.</p>
<pre class="pseudo">Add-ADGroupMember -Identity "DL_DossierCompta" -Members "G_Comptables"   # met le groupe global DANS le groupe local
# desormais, tout membre de G_Comptables herite des droits accordes a DL_DossierCompta</pre>
<h3>7. Remplir un groupe en masse (pipeline)</h3>
<p>Pour ajouter tout un service à un groupe, on combine <code>Get-ADUser -Filter</code> et <code>Add-ADGroupMember</code>. Attention à la forme : ici on récupère d'abord les utilisateurs, puis on les passe en <code>-Members</code>.</p>
<pre class="pseudo">\$membres = Get-ADUser -Filter { Department -eq "Comptabilite" }        # recupere tous les comptables
Add-ADGroupMember -Identity "G_Comptables" -Members \$membres           # les ajoute tous au groupe en une fois
# on constitue d'abord la liste, puis on l'ajoute d'un bloc au groupe</pre>
<div class="tip">Vérifie toujours après coup avec <code>Get-ADGroupMember</code> : c'est le réflexe « je relis ce que je viens d'écrire », appliqué aux groupes.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle cmdlet ajoute un membre à un groupe ?", opts: ["New-ADGroup", "Add-ADGroupMember", "Set-ADGroup", "Get-ADGroupMember"], a: 1, exp: "Add-ADGroupMember ajoute des membres." },
    { type: "qcm", q: "Quelle cmdlet retire un membre d'un groupe ?", opts: ["Remove-ADUser", "Remove-ADGroupMember", "Disable-ADAccount", "Move-ADObject"], a: 1, exp: "Remove-ADGroupMember retire des membres." },
    { type: "qcm", q: "Retirer jdupont d'un groupe, est-ce que ça supprime son compte ?", opts: ["Oui, définitivement", "Non : il quitte le groupe mais son compte reste", "Ça le désactive", "Ça le verrouille"], a: 1, exp: "Quitter un groupe ne touche pas au compte lui-même." },
    { type: "qcm", q: "Que fait -Recursive avec Get-ADGroupMember ?", opts: ["Supprime les membres", "Descend aussi dans les groupes imbriqués pour tous les membres effectifs", "Trie par nom", "Compte les groupes"], a: 1, exp: "-Recursive révèle les membres via l'imbrication." },
    { type: "qcm", q: "Quel attribut liste les groupes d'un utilisateur ?", opts: ["Members", "MemberOf", "GroupScope", "Department"], a: 1, exp: "MemberOf donne les groupes de l'utilisateur." },
    { type: "input", q: "Complète : pour ajouter des membres, on utilise Add-ADGroup______ .", a: ["Member", "member"], ph: "un mot", exp: "Add-ADGroupMember." },
    { type: "input", q: "Complète : le paramètre qui liste les membres à ajouter est -______ .", a: ["Members", "members"], ph: "un paramètre", exp: "-Members jdupont, mmartin…" },
    { type: "input", q: "Complète : pour retirer sans confirmation dans un script, on ajoute -Confirm:$______ .", a: ["false", "False"], ph: "un booléen", exp: "-Confirm:$false évite l'invite." },
    { type: "input", q: "Complète : pour LISTER les membres d'un groupe, on utilise Get-ADGroup______ .", a: ["Member", "member"], ph: "un mot", exp: "Get-ADGroupMember." },
    { type: "input", q: "Complète : pour voir tous les membres même imbriqués, on ajoute -______ .", a: ["Recursive", "recursive"], ph: "un paramètre", exp: "-Recursive descend dans les groupes imbriqués." },
    { type: "input", q: "Complète : pour connaître les groupes de jdupont, on lit -Properties Member______ .", a: ["Of", "of"], ph: "un mot", exp: "L'attribut MemberOf liste ses groupes." },
    { type: "vf", q: "Un groupe peut être membre d'un autre groupe (imbrication).", a: true, exp: "C'est la base de la stratégie A-G-DL-P." },
    { type: "vf", q: "Remove-ADGroupMember et Remove-ADUser font la même chose.", a: false, exp: "L'un retire d'un groupe, l'autre efface le compte : très différent." },
    { type: "vf", q: "On peut ajouter plusieurs membres d'un coup en les séparant par des virgules.", a: true, exp: "-Members jdupont, mmartin, lpetit ajoute les trois." },
    { type: "qcm", q: "Comment ajouter tout le service Comptabilité au groupe G_Comptables ?", opts: ["Un ajout par personne", "Récupérer la liste avec Get-ADUser -Filter puis Add-ADGroupMember -Members $liste", "Impossible", "Remove-ADGroupMember"], a: 1, exp: "On constitue la liste puis on l'ajoute en bloc." }
  ],
  final: {
    title: "Exercice final — Peupler et imbriquer les groupes Compta",
    intro: `<p>Suite du jour 13 : tu remplis <code>G_Comptables</code> avec trois personnes, tu imbriques ce groupe dans <code>DL_DossierCompta</code> (stratégie A-G-DL-P), tu retires quelqu'un qui a changé de service, et tu vérifies. Étudie la trame :</p>
<pre class="pseudo">Add-ADGroupMember -Identity "G_Comptables" -Members jdupont, mmartin, lpetit   # 1) ajoute 3 membres au groupe global
Add-ADGroupMember -Identity "DL_DossierCompta" -Members "G_Comptables"          # 2) imbrique le global dans le local
Remove-ADGroupMember -Identity "G_Comptables" -Members lpetit -Confirm:\$false   # 3) retire lpetit (a change de service)
Get-ADGroupMember -Identity "G_Comptables"                                      # 4) verifie les membres restants</pre>`,
    questions: [
      { type: "input", q: "Quelle cmdlet ajoute les trois membres à G_Comptables ?", a: ["Add-ADGroupMember", "add-adgroupmember"], ph: "Add-...", exp: "Add-ADGroupMember." },
      { type: "qcm", q: "Que réalise la ligne 2 (Add-ADGroupMember -Identity DL_DossierCompta -Members G_Comptables) ?", opts: ["Elle supprime un groupe", "Elle imbrique le groupe global dans le groupe local (A-G-DL-P)", "Elle crée un utilisateur", "Elle renomme le groupe"], a: 1, exp: "Un groupe devient membre d'un autre groupe." },
      { type: "input", q: "Quel paramètre évite la demande de confirmation au retrait ? (écris-le entier)", a: ["-Confirm:$false", "-confirm:$false", "Confirm:$false"], ph: "-Confirm:...", exp: "-Confirm:$false." },
      { type: "qcm", q: "Retirer lpetit du groupe supprime-t-il son compte ?", opts: ["Oui", "Non, il perd juste les droits liés à ce groupe", "Ça le verrouille", "Ça le désactive"], a: 1, exp: "Quitter un groupe n'efface pas le compte." },
      { type: "input", q: "Quelle cmdlet liste les membres restants du groupe ?", a: ["Get-ADGroupMember", "get-adgroupmember"], ph: "Get-...", exp: "Get-ADGroupMember." }
    ],
    solution: `<p>Le cycle de vie complet des membres d'un groupe :</p>
<pre class="pseudo"># 1) Remplir le groupe global avec les personnes
Add-ADGroupMember -Identity "G_Comptables" -Members jdupont, mmartin, lpetit
# 2) Imbriquer le global dans le local (A-G-DL-P) : G_Comptables devient membre de DL_DossierCompta
Add-ADGroupMember -Identity "DL_DossierCompta" -Members "G_Comptables"
# 3) lpetit change de service : on le retire (sans confirmation, dans un script)
Remove-ADGroupMember -Identity "G_Comptables" -Members lpetit -Confirm:\$false
# 4) Verifier le resultat
Get-ADGroupMember -Identity "G_Comptables"                       # membres directs restants
Get-ADGroupMember -Identity "DL_DossierCompta" -Recursive        # tous les membres effectifs via imbrication</pre>
<p>Tu sais faire vivre un groupe. Au jour 15, nous nous intéressons aux objets ordinateurs du domaine.</p>`
  }
};
</script>
