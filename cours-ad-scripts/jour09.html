<script>
var DAY = {
  num: 9,
  title: "Modifier des comptes : Set-ADUser",
  subtitle: "Mettre à jour une fiche existante sans la recréer.",
  theory: `
<h3>1. Modifier plutôt que recréer</h3>
<p>Quand un employé change de service, déménage de bureau ou reçoit un titre, on ne recrée pas son compte : on <strong>modifie</strong> sa fiche existante. La cmdlet du jour est <code>Set-ADUser</code> (verbe Set = « définir/modifier »). Elle prend l'utilisateur à modifier via <code>-Identity</code>, puis les attributs à changer.</p>
<pre class="pseudo">Set-ADUser -Identity jdupont -Department "Ventes"   # change le service de jdupont en Ventes
# -Identity : qui modifier (par SamAccountName ou DN)
# -Department : le nouvel attribut a definir</pre>
<h3>2. Les attributs courants ont leur paramètre</h3>
<p>Beaucoup d'attributs ont un paramètre dédié : <code>-Title</code> (fonction), <code>-Department</code> (service), <code>-Office</code> (bureau), <code>-EmailAddress</code> (e-mail), <code>-Description</code> (description), <code>-OfficePhone</code> (téléphone). On peut en changer plusieurs d'un coup.</p>
<pre class="pseudo">Set-ADUser -Identity jdupont \`
  -Title "Chef comptable" \`
  -Office "Bureau 204" \`
  -OfficePhone "01 23 45 67 89"   # met a jour trois attributs en une seule commande</pre>
<h3>3. Effacer un attribut : -Clear</h3>
<p>Pour <strong>vider</strong> un attribut (le laisser vide), on utilise <code>-Clear</code> suivi du nom de l'attribut. Utile quand une information n'est plus valable.</p>
<pre class="pseudo">Set-ADUser -Identity jdupont -Clear OfficePhone   # efface le numero de telephone de la fiche
# -Clear : vide l'attribut nomme, sans le remplacer</pre>
<h3>4. Les attributs sans paramètre dédié : -Replace</h3>
<p>Certains attributs plus rares n'ont pas de paramètre tout prêt. On les modifie alors avec <code>-Replace</code>, en donnant une <strong>table de correspondance</strong> attribut = valeur (une paire écrite entre accolades avec le nom et la nouvelle valeur).</p>
<pre class="pseudo">Set-ADUser -Identity jdupont -Replace @{ title = "Directeur" }   # remplace l'attribut brut "title"
# @{ ... } est une table de hachage : elle associe un nom d'attribut a sa valeur
# -Add ajoute une valeur, -Remove en retire une, -Replace ecrase l'ancienne</pre>
<div class="warn">La plupart du temps, préfère le paramètre dédié (<code>-Title</code>) quand il existe : c'est plus lisible. <code>-Replace</code> est réservé aux attributs sans raccourci.</div>
<h3>5. Modifier plusieurs comptes d'un coup (pipeline)</h3>
<p>On combine souvent <code>Get-ADUser</code> et <code>Set-ADUser</code> par le pipeline : on récupère une liste d'utilisateurs, puis on leur applique la même modification à tous.</p>
<pre class="pseudo">Get-ADUser -Filter { Department -eq "Ventes" } | Set-ADUser -Office "Batiment B"   # meme bureau pour tout le service Ventes
# Get-ADUser produit la liste ; le pipeline la passe a Set-ADUser
# chaque utilisateur recu est modifie a son tour</pre>
<div class="tip">C'est la grande force de PowerShell : « lis une liste, applique une action à chacun ». Le même schéma servira pour les groupes et les ordinateurs.</div>
<h3>6. Tester avant, vérifier après</h3>
<p>Comme toujours : <code>-WhatIf</code> pour simuler la modification, puis <code>Get-ADUser</code> pour relire et confirmer que le changement a bien pris.</p>
<pre class="pseudo">Get-ADUser -Filter { Department -eq "Ventes" } | Set-ADUser -Office "Batiment B" -WhatIf   # SIMULE la modification de masse
Get-ADUser -Identity jdupont -Properties Title, Office, Department   # relit pour verifier apres coup</pre>
<div class="warn">Une modification de masse sans <code>-WhatIf</code> préalable peut toucher des dizaines de comptes d'un coup : vérifie toujours d'abord QUI est concerné par ton filtre.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle cmdlet modifie un compte utilisateur existant ?", opts: ["New-ADUser", "Set-ADUser", "Get-ADUser", "Edit-ADUser"], a: 1, exp: "Set-ADUser modifie une fiche existante." },
    { type: "qcm", q: "Quel paramètre désigne l'utilisateur à modifier ?", opts: ["-Filter", "-Identity", "-Path", "-Name"], a: 1, exp: "-Identity cible le compte (SamAccountName ou DN)." },
    { type: "qcm", q: "Comment changer le service en une commande ?", opts: ["Set-ADUser -Identity jdupont -Department \"Ventes\"", "New-ADUser -Department", "Remove-ADUser", "Get-ADUser -Department"], a: 0, exp: "-Department fixe le nouveau service." },
    { type: "qcm", q: "Que fait -Clear OfficePhone ?", opts: ["Met un nouveau numéro", "Vide (efface) l'attribut téléphone", "Supprime le compte", "Active le compte"], a: 1, exp: "-Clear vide l'attribut nommé." },
    { type: "qcm", q: "Quand utilise-t-on -Replace @{ ... } ?", opts: ["Jamais", "Pour les attributs qui n'ont pas de paramètre dédié", "Pour supprimer un compte", "Pour lister les comptes"], a: 1, exp: "-Replace modifie un attribut brut sans raccourci." },
    { type: "input", q: "Complète : la fonction/poste se fixe avec -______ \"Chef comptable\".", a: ["Title", "title"], ph: "un paramètre", exp: "-Title fixe l'intitulé de poste." },
    { type: "input", q: "Complète : le bureau se fixe avec -______ \"Bureau 204\".", a: ["Office", "office"], ph: "un paramètre", exp: "-Office fixe le bureau." },
    { type: "input", q: "Complète : pour VIDER un attribut, on utilise -______ suivi de son nom.", a: ["Clear", "clear"], ph: "un paramètre", exp: "-Clear efface l'attribut." },
    { type: "input", q: "Complète : l'e-mail se met à jour avec -Email______ .", a: ["Address", "address"], ph: "un mot", exp: "-EmailAddress fixe l'adresse e-mail." },
    { type: "input", q: "Complète : la table qui associe un attribut à sa valeur s'écrit @{ nom = valeur } et se passe à -______ .", a: ["Replace", "replace"], ph: "un paramètre", exp: "-Replace @{ ... } remplace un attribut brut." },
    { type: "input", q: "Complète : pour appliquer la même modif à une liste, on relie Get-ADUser à Set-ADUser par le ______ (symbole |).", a: ["pipeline", "pipe", "|"], ph: "un mot", exp: "Le pipeline passe la liste à Set-ADUser." },
    { type: "vf", q: "Pour changer le service d'un employé, il faut supprimer puis recréer son compte.", a: false, exp: "On modifie simplement avec Set-ADUser, sans rien recréer." },
    { type: "vf", q: "On peut modifier plusieurs attributs dans un seul appel à Set-ADUser.", a: true, exp: "-Title, -Office, -OfficePhone… peuvent être combinés." },
    { type: "vf", q: "Une modification de masse par pipeline peut toucher beaucoup de comptes : mieux vaut la tester avec -WhatIf.", a: true, exp: "On vérifie d'abord qui est concerné par le filtre." },
    { type: "qcm", q: "Quel bon réflexe adopter juste après une modification ?", opts: ["Redémarrer le DC", "Relire la fiche avec Get-ADUser pour confirmer", "Supprimer le compte", "Rien"], a: 1, exp: "On relit toujours ce qu'on vient de modifier." }
  ],
  final: {
    title: "Exercice final — Réorganisation du service Ventes",
    intro: `<p>Le service Ventes déménage : tous ses membres passent au « Bâtiment B », et l'employé <code>jdupont</code> devient « Chef comptable » tout en changeant de service pour Comptabilité, en effaçant son ancien numéro de téléphone. Étudie la trame :</p>
<pre class="pseudo">Get-ADUser -Filter { Department -eq "Ventes" } | Set-ADUser -Office "Batiment B" -WhatIf   # 1) SIMULE le changement de bureau collectif
Get-ADUser -Filter { Department -eq "Ventes" } | Set-ADUser -Office "Batiment B"           # 2) applique pour de vrai
Set-ADUser -Identity jdupont -Title "Chef comptable" -Department "Comptabilite" -Clear OfficePhone   # 3) modifie jdupont
Get-ADUser -Identity jdupont -Properties Title, Department, Office                          # 4) verifie</pre>`,
    questions: [
      { type: "input", q: "Quelle cmdlet applique la modification ?", a: ["Set-ADUser", "set-aduser"], ph: "Set-...", exp: "Set-ADUser." },
      { type: "qcm", q: "Que fait la ligne 1 avec -WhatIf ?", opts: ["Modifie tout le monde", "Simule le changement collectif sans rien modifier", "Supprime le service", "Rien du tout"], a: 1, exp: "-WhatIf montre qui serait touché avant d'agir." },
      { type: "input", q: "Quel paramètre efface l'ancien téléphone de jdupont ? (avec son tiret)", a: ["-Clear", "Clear", "-clear"], ph: "-Xxxx", exp: "-Clear OfficePhone vide l'attribut." },
      { type: "qcm", q: "Comment le service Ventes reçoit-il tous le même bureau en une commande ?", opts: ["Un Set-ADUser par personne", "Get-ADUser (le filtre) relié par pipeline à Set-ADUser", "En recréant les comptes", "Impossible"], a: 1, exp: "Le pipeline applique la même action à chaque utilisateur de la liste." },
      { type: "input", q: "Quel paramètre donne le nouveau titre « Chef comptable » à jdupont ?", a: ["-Title", "Title", "-title"], ph: "-Xxxx", exp: "-Title \"Chef comptable\"." }
    ],
    solution: `<p>La combinaison modification de masse + modification ciblée + vérification :</p>
<pre class="pseudo">Get-ADUser -Filter { Department -eq "Ventes" } | Set-ADUser -Office "Batiment B" -WhatIf   # 1) qui serait touche ?
Get-ADUser -Filter { Department -eq "Ventes" } | Set-ADUser -Office "Batiment B"           # 2) applique le nouveau bureau
Set-ADUser -Identity jdupont \`
  -Title "Chef comptable" \`
  -Department "Comptabilite" \`
  -Clear OfficePhone                                                                        # 3) promotion + changement de service + tel efface
Get-ADUser -Identity jdupont -Properties Title, Department, Office                          # 4) relit pour confirmer</pre>
<p>Tu sais désormais mettre à jour une ou mille fiches. Au jour 10, nous nous concentrons sur les mots de passe et l'état des comptes (activer, désactiver, débloquer).</p>`
  }
};
</script>

    ],
    solution: "Set-ADUser -Identity mmartin -Title \"Responsable\" -Office \"Bureau 12\"                  # 1) fixe titre et bureau de mmartin\nSet-ADUser -Identity mmartin -Clear Description                                        # 2) efface la description\nGet-ADUser -Filter { Department -eq \"Informatique\" } | Set-ADUser -Office \"Batiment C\" -WhatIf   # 3a) SIMULE le bureau collectif\nGet-ADUser -Filter { Department -eq \"Informatique\" } | Set-ADUser -Office \"Batiment C\"           # 3b) applique pour de vrai\nGet-ADUser -Identity mmartin -Properties Title, Office, Description                    # relit la fiche pour verifier",

  ]
};
