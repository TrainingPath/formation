<script>
var DAY = {
  num: 5,
  title: "Le module ActiveDirectory : découverte",
  subtitle: "Charger la boîte à outils qui contient toutes les cmdlets AD.",
  theory: `
<h3>1. Qu'est-ce qu'un module ?</h3>
<p>Un <strong>module</strong> PowerShell est une boîte à outils : un paquet de cmdlets regroupées par thème. Le module qui nous intéresse s'appelle <strong>ActiveDirectory</strong> ; il contient toutes les commandes en <code>*-AD*</code> (Get-ADUser, New-ADUser, Set-ADGroup…). Sans ce module chargé, ces cmdlets n'existent pas dans la console.</p>
<div class="tip">Ce module est installé automatiquement avec <code>-IncludeManagementTools</code> (jour 3). Sur un poste d'administration sans le rôle, on l'obtient via la fonctionnalité <strong>RSAT</strong> (<em>Remote Server Administration Tools</em>, les outils d'administration à distance).</div>
<h3>2. Voir les modules disponibles</h3>
<p>Deux cmdlets pour explorer : <code>Get-Module -ListAvailable</code> liste les modules installés sur la machine, et <code>Get-Module</code> (sans option) montre ceux déjà chargés en mémoire.</p>
<pre class="pseudo">Get-Module -ListAvailable -Name ActiveDirectory   # le module AD est-il installe sur cette machine ?
Get-Module                                        # quels modules sont deja charges en memoire ?</pre>
<h3>3. Charger le module</h3>
<p>Sur les versions récentes de PowerShell, un module se charge <strong>automatiquement</strong> dès qu'on appelle une de ses cmdlets. On peut aussi le charger explicitement avec <code>Import-Module</code>, ce qui reste une bonne habitude en début de script pour être sûr.</p>
<pre class="pseudo">Import-Module ActiveDirectory   # charge explicitement la boite a outils AD en memoire
# apres cette ligne, toutes les cmdlets *-AD* sont disponibles</pre>
<h3>4. Découvrir les cmdlets du module</h3>
<p>Une fois le module chargé, on liste ses cmdlets avec <code>Get-Command -Module ActiveDirectory</code>. On y retrouve la logique verbe-nom : Get pour lire, New pour créer, Set pour modifier, Remove pour supprimer.</p>
<pre class="pseudo">Get-Command -Module ActiveDirectory                # toutes les cmdlets du module AD
Get-Command -Module ActiveDirectory -Verb Get      # seulement celles qui LISENT (Get-AD...)
Get-Command -Noun ADUser                           # toutes les commandes agissant sur un ADUser</pre>
<div class="warn">Il y a plus de 100 cmdlets AD : inutile de les mémoriser. Retiens la logique verbe + objet (ADUser, ADGroup, ADComputer, ADOrganizationalUnit) et laisse Get-Command te retrouver la bonne.</div>
<h3>5. Le lecteur AD:</h3>
<p>Le module ajoute aussi un <strong>lecteur</strong> nommé <code>AD:</code> qui permet de parcourir l'annuaire comme un disque avec des dossiers. On y navigue avec <code>Set-Location</code> (changer d'emplacement) et <code>Get-ChildItem</code> (lister le contenu).</p>
<pre class="pseudo">Set-Location AD:                 # se placer a la racine de l'annuaire, comme on ferait cd C:\
Get-ChildItem                    # lister les objets de l'emplacement courant
Set-Location C:                  # revenir sur le disque C: quand on a fini</pre>
<h3>6. Tester la connexion à l'annuaire</h3>
<p>Pour vérifier que tout fonctionne, deux cmdlets d'information : <code>Get-ADDomain</code> décrit le domaine courant, et <code>Get-ADForest</code> décrit la forêt. Si elles répondent, le module parle bien à l'annuaire.</p>
<pre class="pseudo">Get-ADDomain    # affiche les infos du domaine : nom, DN, controleurs...
Get-ADForest    # affiche les infos de la foret : nom, domaines, niveau fonctionnel
(Get-ADDomain).DNSRoot   # ne lire qu'un attribut : le nom DNS du domaine (ex. entreprise.local)</pre>
<div class="tip">Les parenthèses <code>(Get-ADDomain)</code> exécutent d'abord la cmdlet, puis le point lit un attribut du résultat : une façon rapide d'extraire une seule information.</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'un module PowerShell ?", opts: ["Un compte administrateur", "Une boîte à outils regroupant des cmdlets par thème", "Un serveur", "Un fichier journal"], a: 1, exp: "Le module ActiveDirectory regroupe toutes les cmdlets *-AD*." },
    { type: "qcm", q: "Quel module contient Get-ADUser, New-ADUser, Set-ADGroup… ?", opts: ["Networking", "ActiveDirectory", "Storage", "Defender"], a: 1, exp: "Le module ActiveDirectory." },
    { type: "qcm", q: "Quelle cmdlet charge explicitement un module en mémoire ?", opts: ["Load-Module", "Import-Module", "New-Module", "Get-Module"], a: 1, exp: "Import-Module ActiveDirectory." },
    { type: "qcm", q: "Comment lister toutes les cmdlets du module AD ?", opts: ["Get-ADUser", "Get-Command -Module ActiveDirectory", "Import-Module", "Get-Help"], a: 1, exp: "Get-Command -Module ActiveDirectory les énumère." },
    { type: "qcm", q: "Que fait Get-ADDomain ?", opts: ["Crée un domaine", "Supprime le domaine", "Affiche les informations du domaine courant", "Redémarre le DC"], a: 2, exp: "C'est une cmdlet de lecture qui décrit le domaine." },
    { type: "input", q: "Complète : pour voir les modules INSTALLÉS, on tape Get-Module -List______ .", a: ["Available", "available"], ph: "un mot", exp: "Get-Module -ListAvailable." },
    { type: "input", q: "Complète le nom du module : Import-Module ______ .", a: ["ActiveDirectory", "activedirectory"], ph: "un nom", exp: "Import-Module ActiveDirectory." },
    { type: "input", q: "Complète : sur un poste d'admin sans le rôle, on installe le module via la fonctionnalité ______ (4 lettres).", a: ["RSAT", "rsat"], ph: "quatre lettres", exp: "RSAT = Remote Server Administration Tools." },
    { type: "input", q: "Complète : le lecteur ajouté par le module pour parcourir l'annuaire s'écrit ______: (deux lettres et deux points).", a: ["AD", "ad", "AD:"], ph: "un lecteur", exp: "Le lecteur AD: se parcourt comme un disque." },
    { type: "input", q: "Complète : pour décrire la FORÊT courante, on utilise Get-AD______ .", a: ["Forest", "forest"], ph: "un mot", exp: "Get-ADForest décrit la forêt." },
    { type: "input", q: "Complète : pour lire seulement le nom DNS du domaine, on écrit (Get-ADDomain).______ .", a: ["DNSRoot", "dnsroot", "DnsRoot"], ph: "un attribut", exp: "(Get-ADDomain).DNSRoot donne entreprise.local." },
    { type: "vf", q: "Sans le module ActiveDirectory chargé, les cmdlets Get-ADUser et consorts n'existent pas dans la console.", a: true, exp: "Les cmdlets viennent du module ; pas de module, pas de cmdlets." },
    { type: "vf", q: "Sur PowerShell récent, appeler Get-ADUser charge automatiquement le module ActiveDirectory.", a: true, exp: "Le chargement automatique fonctionne, mais Import-Module explicite reste une bonne habitude." },
    { type: "vf", q: "Get-Command sert à mémoriser toutes les cmdlets par cœur.", a: false, exp: "Au contraire : il évite de tout mémoriser en retrouvant la cmdlet à la demande." },
    { type: "qcm", q: "Que renvoient les parenthèses dans (Get-ADDomain).DNSRoot ?", opts: ["Une erreur", "Le seul attribut DNSRoot du domaine, extrait du résultat de Get-ADDomain", "Tout le domaine", "Le mot de passe"], a: 1, exp: "On exécute la cmdlet, puis le point lit un attribut du résultat." }
  ],
  final: {
    title: "Exercice final — Vérifier que la boîte à outils AD répond",
    intro: `<p>Sur ton nouveau contrôleur de domaine, tu veux t'assurer que le module AD est là, le charger, et lire quelques informations du domaine. Voici la séquence commentée :</p>
<pre class="pseudo">Get-Module -ListAvailable -Name ActiveDirectory   # 1) le module est-il installe ?
Import-Module ActiveDirectory                     # 2) le charger en memoire
Get-Command -Module ActiveDirectory -Verb Get     # 3) lister les cmdlets de lecture disponibles
Get-ADDomain                                       # 4) afficher les infos du domaine courant
(Get-ADDomain).DNSRoot                             # 5) extraire juste le nom DNS du domaine</pre>`,
    questions: [
      { type: "input", q: "Quelle cmdlet vérifie que le module est installé sans le charger ? (avec son option -ListAvailable)", a: ["Get-Module -ListAvailable", "get-module -listavailable"], ph: "Get-Module -...", exp: "Get-Module -ListAvailable." },
      { type: "input", q: "Quelle cmdlet charge le module en mémoire ?", a: ["Import-Module", "import-module"], ph: "Import-...", exp: "Import-Module ActiveDirectory." },
      { type: "qcm", q: "À quoi sert -Verb Get dans Get-Command -Module ActiveDirectory -Verb Get ?", opts: ["À créer des utilisateurs", "À ne lister que les cmdlets de LECTURE (Get-AD...)", "À redémarrer", "À supprimer le module"], a: 1, exp: "On filtre les cmdlets sur le verbe Get." },
      { type: "input", q: "Quelle cmdlet décrit le domaine courant ?", a: ["Get-ADDomain", "get-addomain"], ph: "Get-AD...", exp: "Get-ADDomain." },
      { type: "qcm", q: "Que renvoie (Get-ADDomain).DNSRoot ?", opts: ["Toutes les infos du domaine", "Uniquement le nom DNS (ex. entreprise.local)", "La liste des utilisateurs", "Une erreur"], a: 1, exp: "Le point extrait le seul attribut DNSRoot." }
    ],
    solution: `<p>La séquence de découverte, du contrôle d'installation à la lecture d'un attribut :</p>
<pre class="pseudo">Get-Module -ListAvailable -Name ActiveDirectory   # confirme que la boite a outils est presente
Import-Module ActiveDirectory                     # la charge (bonne habitude en debut de script)
Get-Command -Module ActiveDirectory               # decouvre toutes les cmdlets disponibles
Get-ADDomain                                       # verifie que le module dialogue bien avec l'annuaire
(Get-ADDomain).DNSRoot                             # extrait le nom DNS : entreprise.local</pre>
<p>La boîte à outils répond : tu peux désormais lire et écrire dans l'annuaire. Dès le jour 6, nous explorons l'annuaire avec Get-ADUser et Get-ADObject.</p>`
  }
};
</script>
