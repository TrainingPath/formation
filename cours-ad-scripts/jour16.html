<script>
var DAY = {
  num: 16,
  title: "Rechercher et filtrer (-Filter, -LDAPFilter)",
  subtitle: "Poser la bonne question à l'annuaire pour trouver exactement ce qu'on cherche.",
  theory: `
<h3>1. Filtrer, c'est poser une question précise</h3>
<p>Depuis le jour 6, on utilise <code>-Filter</code> sans le décortiquer. Aujourd'hui, on le maîtrise vraiment. Un <strong>filtre</strong> est un critère qui trie les objets : l'annuaire ne renvoie que ceux qui satisfont la condition. Bien filtrer, c'est demander « les comptes désactivés du service Ventes » plutôt que « tout le monde » puis chercher à la main.</p>
<h3>2. Les opérateurs de comparaison</h3>
<p>Un filtre compare un attribut à une valeur avec un <strong>opérateur</strong>. Les mêmes qu'au jour 2, en version PowerShell :</p>
<pre class="pseudo">-eq   # egal a           (equal)      : Department -eq "Ventes"
-ne   # different de      (not equal)  : Enabled -ne \$true
-lt   # inferieur a       (less than)  : LastLogonDate -lt \$limite
-gt   # superieur a       (greater)    : whenCreated -gt \$hier
-like # ressemble a (avec le joker *)  : Name -like "Jean*"</pre>
<h3>3. Le joker * avec -like</h3>
<p>L'opérateur <code>-like</code> permet les recherches partielles grâce au <strong>joker</strong> <code>*</code>, qui remplace « n'importe quoi ». <code>"Jean*"</code> trouve tout ce qui commence par Jean ; <code>"*son"</code> tout ce qui finit par son ; <code>"*ar*"</code> tout ce qui contient ar.</p>
<pre class="pseudo">Get-ADUser -Filter { Name -like "Mar*" }        # tous les utilisateurs dont le nom commence par Mar (Marie, Marc...)
Get-ADUser -Filter { SamAccountName -like "*admin*" }   # tous les identifiants contenant admin</pre>
<h3>4. Combiner des conditions : -and, -or</h3>
<p>On relie plusieurs conditions avec <code>-and</code> (ET) et <code>-or</code> (OU), exactement comme la logique booléenne du jour 8. Des parenthèses clarifient les priorités.</p>
<pre class="pseudo">Get-ADUser -Filter { (Department -eq "Ventes") -and (Enabled -eq \$true) }   # actifs ET du service Ventes
Get-ADUser -Filter { (Title -eq "Stagiaire") -or (Title -eq "Alternant") }  # stagiaires OU alternants
# -and : les deux conditions doivent etre vraies ; -or : au moins une</pre>
<div class="warn">Dans un filtre, la valeur texte va entre guillemets et l'attribut S'ÉCRIT SANS dollar (<code>Department</code>, pas <code>$Department</code>). En revanche, une VARIABLE PowerShell garde son dollar (<code>\$limite</code>). Cette distinction est la source d'erreur numéro un.</p>
<h3>5. -Filter en chaîne de caractères</h3>
<p>On peut écrire le filtre entre accolades (pratique) ou entre guillemets (une chaîne de caractères). La forme chaîne est utile quand on construit le filtre à partir de variables.</p>
<pre class="pseudo">\$service = "Ventes"                                     # la valeur recherchee, dans une variable
Get-ADUser -Filter "Department -eq '\$service'"          # filtre construit avec la variable (guillemets simples autour)
# la variable \$service est remplacee par sa valeur ; noter les apostrophes autour</pre>
<h3>6. -LDAPFilter : la syntaxe native de l'annuaire</h3>
<p>À côté de <code>-Filter</code> (syntaxe PowerShell), il existe <code>-LDAPFilter</code>, qui utilise la <strong>syntaxe LDAP</strong> (jour 1), le langage natif des annuaires. Elle est plus déroutante (préfixée, entre parenthèses) mais parfois plus puissante ou attendue par la documentation.</p>
<pre class="pseudo">Get-ADUser -LDAPFilter "(department=Ventes)"                       # equivalent LDAP de Department -eq "Ventes"
Get-ADUser -LDAPFilter "(&(department=Ventes)(title=Comptable))"  # ET : & place AVANT les conditions
Get-ADUser -LDAPFilter "(|(title=Stagiaire)(title=Alternant))"    # OU : | place AVANT les conditions
# en LDAP : & = ET, | = OU, ! = NON, places EN TETE ; chaque condition entre parentheses</pre>
<div class="tip">Retiens : <code>-Filter</code> pour le quotidien (syntaxe PowerShell lisible), <code>-LDAPFilter</code> quand une source te donne déjà une requête LDAP toute faite. Les deux répondent à la même question.</p>
<h3>7. Éviter le piège du -Filter *</h3>
<p>Ramener TOUT l'annuaire avec <code>-Filter *</code> puis filtrer côté PowerShell (avec Where-Object) fonctionne, mais surcharge le contrôleur de domaine. Il vaut mieux filtrer AU PLUS TÔT, dans <code>-Filter</code>, pour que l'annuaire ne renvoie que le nécessaire.</p>
<pre class="pseudo">Get-ADUser -Filter * | Where-Object { \$_.Department -eq "Ventes" }   # LENT : ramene tout, puis filtre en local
Get-ADUser -Filter { Department -eq "Ventes" }                       # RAPIDE : l'annuaire filtre a la source
# regle d'or : filtrer le plus tot possible, cote annuaire</pre>`,
  exercises: [
    { type: "qcm", q: "À quoi sert un filtre dans une recherche AD ?", opts: ["À supprimer des objets", "À ne renvoyer que les objets qui satisfont un critère", "À créer une OU", "À trier uniquement"], a: 1, exp: "Le filtre restreint le résultat à ce qui correspond." },
    { type: "qcm", q: "Quel opérateur signifie « égal à » ?", opts: ["-ne", "-eq", "-lt", "-like"], a: 1, exp: "-eq = equal (égal)." },
    { type: "qcm", q: "Que fait le joker * avec -like dans \"Mar*\" ?", opts: ["Rien", "Remplace « n'importe quoi » : trouve tout ce qui commence par Mar", "Multiplie", "Supprime"], a: 1, exp: "* remplace une suite quelconque de caractères." },
    { type: "qcm", q: "Comment exige-t-on que DEUX conditions soient vraies ?", opts: ["-or", "-and", "-not", "-like"], a: 1, exp: "-and = ET : les deux conditions doivent être vraies." },
    { type: "qcm", q: "Dans un filtre { Department -eq \"Ventes\" }, comment s'écrit l'attribut Department ?", opts: ["$Department (avec dollar)", "Department (sans dollar)", "\"Department\"", "-Department"], a: 1, exp: "L'attribut s'écrit sans dollar ; le dollar est réservé aux variables." },
    { type: "input", q: "Complète l'opérateur « différent de » : Enabled -______ $true .", a: ["ne", "NE"], ph: "deux lettres", exp: "-ne = not equal (différent)." },
    { type: "input", q: "Complète l'opérateur des recherches partielles avec joker : Name -______ \"Jean*\" .", a: ["like", "LIKE"], ph: "un opérateur", exp: "-like autorise le joker *." },
    { type: "input", q: "Complète : pour relier deux conditions par un ET, on utilise -______ .", a: ["and", "AND"], ph: "un opérateur", exp: "-and combine deux conditions (toutes vraies)." },
    { type: "input", q: "Complète : pour relier deux conditions par un OU, on utilise -______ .", a: ["or", "OR"], ph: "un opérateur", exp: "-or : au moins une condition vraie." },
    { type: "input", q: "Complète : la syntaxe native de l'annuaire s'utilise avec le paramètre -______Filter .", a: ["LDAP", "ldap"], ph: "quatre lettres", exp: "-LDAPFilter utilise la syntaxe LDAP." },
    { type: "input", q: "Complète : en LDAP, le symbole du ET placé en tête est ______ .", a: ["&", "et", "esperluette"], ph: "un symbole", exp: "En LDAP, & = ET, placé avant les conditions." },
    { type: "vf", q: "Dans un filtre PowerShell, un nom d'attribut s'écrit sans dollar, mais une variable garde son dollar.", a: true, exp: "Department sans dollar ; $limite avec dollar." },
    { type: "vf", q: "-Filter et -LDAPFilter peuvent répondre à la même question, avec deux syntaxes différentes.", a: true, exp: "L'un en syntaxe PowerShell, l'autre en syntaxe LDAP native." },
    { type: "vf", q: "Filtrer avec Get-ADUser -Filter * puis Where-Object est plus efficace que filtrer directement dans -Filter.", a: false, exp: "C'est plus lent : mieux vaut filtrer à la source, côté annuaire." },
    { type: "qcm", q: "En LDAP, comment s'écrit « le service est Ventes » ?", opts: ["Department -eq Ventes", "(department=Ventes)", "{ Department = Ventes }", "-Department Ventes"], a: 1, exp: "Syntaxe LDAP : (attribut=valeur) entre parenthèses." }
  ],
  final: {
    title: "Exercice final — Retrouver l'aiguille dans la botte de foin",
    intro: `<p>La direction demande la liste des comptes ACTIFS du service Ventes dont le nom commence par « Dur », en deux syntaxes (PowerShell et LDAP), et rappelle qu'il faut filtrer à la source. Étudie la trame :</p>
<pre class="pseudo"># Syntaxe PowerShell (-Filter)
Get-ADUser -Filter { (Department -eq "Ventes") -and (Enabled -eq \$true) -and (Name -like "Dur*") }
# Syntaxe LDAP equivalente (-LDAPFilter)
Get-ADUser -LDAPFilter "(&(department=Ventes)(!(userAccountControl:1.2.840.113556.1.4.803:=2))(name=Dur*))"
# A ne PAS faire : ramener tout puis filtrer en local
Get-ADUser -Filter * | Where-Object { \$_.Department -eq "Ventes" }   # LENT</pre>`,
    questions: [
      { type: "input", q: "Quel opérateur combine « service Ventes » ET « compte actif » ?", a: ["-and", "and", "-AND"], ph: "-xxx", exp: "-and exige les deux conditions." },
      { type: "input", q: "Quel opérateur permet de filtrer les noms commençant par « Dur » ? (avec son tiret)", a: ["-like", "like", "-LIKE"], ph: "-xxxx", exp: "-like \"Dur*\" avec le joker." },
      { type: "qcm", q: "Dans le filtre, comment s'écrit l'attribut Department ?", opts: ["$Department", "Department (sans dollar)", "-Department", "\"$Department\""], a: 1, exp: "Sans dollar ; seul $true est une valeur booléenne PowerShell." },
      { type: "input", q: "Quel paramètre reçoit la requête en syntaxe LDAP native ?", a: ["-LDAPFilter", "LDAPFilter", "-ldapfilter"], ph: "-Xxxx", exp: "-LDAPFilter." },
      { type: "qcm", q: "Pourquoi la dernière ligne (Get-ADUser -Filter * | Where-Object) est-elle déconseillée ?", opts: ["Elle est fausse", "Elle ramène tout l'annuaire puis filtre en local : lent et lourd pour le DC", "Elle supprime des comptes", "Elle est plus rapide"], a: 1, exp: "On doit filtrer à la source, pas après avoir tout rapatrié." }
    ],
    solution: `<p>La même recherche, en deux syntaxes, filtrée à la source :</p>
<pre class="pseudo"># --- Syntaxe PowerShell : lisible, recommandee au quotidien ---
Get-ADUser -Filter { (Department -eq "Ventes") -and (Enabled -eq \$true) -and (Name -like "Dur*") } \`
  -Properties Department |
  Select-Object Name, SamAccountName, Department          # ne garder que l'essentiel a l'affichage
# --- Syntaxe LDAP : utile quand une source fournit deja la requete ---
Get-ADUser -LDAPFilter "(&(department=Ventes)(name=Dur*))"   # & = ET, chaque condition entre parentheses
# Regle d'or : filtrer TOT (cote annuaire), jamais tout ramener pour trier ensuite.</pre>
<p>Félicitations : tu as parcouru les 16 jours. Tu sais installer AD DS, promouvoir un contrôleur, créer et gérer utilisateurs, groupes, OU et ordinateurs, et interroger l'annuaire avec précision. Tu es prêt à administrer Active Directory par les scripts.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton script PowerShell ici…",
  items: [
  { id: "adps-j16", title: "Composer un filtre précis", level: 3,
    statement: "Écris un script qui trouve tous les utilisateurs ACTIFS dont l'identifiant contient « adm » ET qui appartiennent au service « Informatique », en filtrant à la source. Affiche seulement nom et identifiant. Donne aussi la version équivalente en <code>-LDAPFilter</code>. Commente chaque ligne.",
    atoi: { cmd: "Sur une VM Windows Server promue controleur de domaine, execute TES cmdlets dans PowerShell, puis verifie le resultat dans l annuaire / la sortie attendue.", expected: "Name          SamAccountName\n----          --------------\nAdmin Reseau  adm-reseau\nAdmin Systeme adm-sys\n(les deux syntaxes, -Filter et -LDAPFilter, renvoient la même liste)" },
    checklist: ["Combines-tu les trois conditions avec -and dans -Filter ?", "Filtres-tu à la source plutôt qu'avec Where-Object après coup ?", "Ta version -LDAPFilter utilise-t-elle la forme (&(...)(...)) ?"],
    hints: [
      "Combine trois conditions avec -and : Enabled -eq $true, SamAccountName -like \"*adm*\", Department -eq \"Informatique\".",
      "Enchaîne avec Select-Object Name, SamAccountName pour l'affichage.",
      "En LDAP : (&(...)(...)) avec chaque condition entre parenthèses ; * fait office de joker."
    ],
    solution: "Get-ADUser -Filter { (Enabled -eq $true) -and (SamAccountName -like \"*adm*\") -and (Department -eq \"Informatique\") } | Select-Object Name, SamAccountName   # syntaxe PowerShell : filtre a la source, 3 conditions reliees par -and\n# attributs sans dollar ; $true est la valeur booleenne ; -like autorise le joker *\nGet-ADUser -LDAPFilter \"(&(sAMAccountName=*adm*)(department=Informatique))\" | Select-Object Name, SamAccountName   # meme recherche en syntaxe LDAP native (& = ET)\n# regle d'or : filtrer cote annuaire, ne jamais tout ramener pour trier ensuite",
    note: "Filtrer à la source (dans -Filter ou -LDAPFilter) plutôt qu'avec Where-Object après coup économise énormément de charge sur le contrôleur de domaine, surtout dans les grands annuaires de plusieurs milliers d'objets." }
  ]
};
</script>
