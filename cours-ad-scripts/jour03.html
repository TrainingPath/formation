<script>
var DAY = {
  num: 3,
  title: "Installer le rôle AD DS (Install-WindowsFeature)",
  subtitle: "Poser les fondations : ajouter le service d'annuaire sur un serveur.",
  theory: `
<h3>1. Un rôle, c'est quoi ?</h3>
<p>Un serveur Windows est comme un employé polyvalent : par défaut il ne fait presque rien, mais on lui confie des <strong>rôles</strong>, c'est-à-dire de grandes fonctions à assurer (serveur de fichiers, serveur web, serveur d'annuaire…). Le rôle qui transforme un serveur en machine Active Directory s'appelle <strong>AD DS</strong> : <em>Active Directory Domain Services</em>, les « services de domaine Active Directory ».</p>
<div class="tip">Installer le rôle AD DS ne crée pas encore de domaine : cela installe seulement les <strong>outils</strong> et le <strong>moteur</strong>. La création du domaine viendra au jour 4 avec la promotion en contrôleur de domaine.</div>
<h3>2. Les fonctionnalités (features)</h3>
<p>Une <strong>fonctionnalité</strong> (en anglais <em>feature</em>) est un composant installable de Windows Server. Un rôle est une grosse fonctionnalité. On les gère avec deux cmdlets jumelles : <code>Get-WindowsFeature</code> pour voir ce qui est disponible ou installé, et <code>Install-WindowsFeature</code> pour installer.</p>
<pre class="pseudo">Get-WindowsFeature -Name AD-Domain-Services   # affiche l'etat du role AD DS (installe ou non)
# La colonne "Install State" indique Available (dispo) ou Installed (installe)</pre>
<h3>3. Installer le rôle AD DS</h3>
<p>La cmdlet clé du jour est <code>Install-WindowsFeature</code>. On lui donne le <strong>nom technique</strong> du rôle (<code>AD-Domain-Services</code>) et on ajoute presque toujours <code>-IncludeManagementTools</code> pour installer en même temps les outils d'administration (dont le fameux module ActiveDirectory que nous utiliserons dès le jour 5).</p>
<pre class="pseudo">Install-WindowsFeature -Name AD-Domain-Services -IncludeManagementTools   # installe le role AD DS + ses outils
# -Name  : le nom technique du role a installer
# -IncludeManagementTools : ajoute la console et les cmdlets d'administration
</pre>
<div class="warn">Le nom technique est <code>AD-Domain-Services</code> (avec des tirets), pas « Active Directory » en clair. PowerShell exige le nom exact.</div>
<h3>4. Vérifier le résultat</h3>
<p>Toute installation renvoie un objet <strong>résultat</strong> qui contient des attributs utiles, notamment <code>Success</code> (l'opération a-t-elle réussi ?) et <code>RestartNeeded</code> (faut-il redémarrer ?). On range ce résultat dans une variable pour l'examiner.</p>
<pre class="pseudo">$r = Install-WindowsFeature -Name AD-Domain-Services -IncludeManagementTools   # range le resultat dans $r
$r.Success         # True si l'installation a reussi
$r.RestartNeeded   # indique si un redemarrage est necessaire (No, Yes, Maybe)</pre>
<h3>5. Le paramètre -WhatIf : répéter sans agir</h3>
<p><code>-WhatIf</code> est un filet de sécurité présent sur beaucoup de cmdlets : il <strong>simule</strong> l'action et décrit ce qui se passerait, sans rien exécuter. Comme une répétition générale avant le vrai spectacle.</p>
<pre class="pseudo">Install-WindowsFeature -Name AD-Domain-Services -WhatIf   # SIMULE l'installation, ne l'execute PAS
# Affiche "What if: ..." pour montrer ce qui serait fait, sans toucher au serveur</pre>
<div class="tip">Prends l'habitude de lancer d'abord avec <code>-WhatIf</code>, surtout sur les cmdlets qui modifient le système. Tu vérifies tes intentions avant de les rendre réelles.</div>
<h3>6. Où exécuter ces commandes ?</h3>
<p>Ces cmdlets doivent tourner dans une console PowerShell ouverte <strong>en tant qu'administrateur</strong> (élévation de privilèges), directement sur le serveur qui deviendra contrôleur de domaine. Sans droits administrateur, l'installation échoue faute de permissions.</p>
<pre class="pseudo">Get-WindowsFeature | Where-Object { $_.Installed }   # liste tout ce qui est deja installe sur ce serveur
# | envoie chaque fonctionnalite dans le filtre
# $_.Installed vaut True pour celles qui sont installees</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie AD DS ?", opts: ["Active Directory Disk Space", "Active Directory Domain Services", "Advanced Data Storage", "Automatic Domain Setup"], a: 1, exp: "AD DS = Active Directory Domain Services, le rôle d'annuaire." },
    { type: "qcm", q: "Quelle cmdlet installe un rôle ou une fonctionnalité Windows Server ?", opts: ["New-WindowsFeature", "Add-Role", "Install-WindowsFeature", "Set-Feature"], a: 2, exp: "Install-WindowsFeature installe rôles et fonctionnalités." },
    { type: "qcm", q: "Installer le rôle AD DS crée-t-il aussitôt un domaine ?", opts: ["Oui, immédiatement", "Non : cela installe seulement le moteur et les outils ; le domaine se crée à la promotion (jour 4)", "Oui, mais sans nom", "Cela supprime le domaine"], a: 1, exp: "L'installation pose les fondations ; la promotion crée le domaine." },
    { type: "qcm", q: "À quoi sert -IncludeManagementTools ?", opts: ["À redémarrer le serveur", "À installer aussi les outils et cmdlets d'administration", "À supprimer le rôle", "À simuler l'installation"], a: 1, exp: "Sans lui, on n'aurait pas les outils pour gérer l'annuaire." },
    { type: "qcm", q: "Que fait le paramètre -WhatIf ?", opts: ["Il force l'installation", "Il simule l'action sans l'exécuter", "Il redémarre", "Il supprime le rôle"], a: 1, exp: "-WhatIf est une répétition : il décrit sans agir." },
    { type: "input", q: "Complète : la cmdlet qui INSTALLE le rôle est Install-Windows______ .", a: ["Feature", "feature"], ph: "un nom", exp: "Install-WindowsFeature." },
    { type: "input", q: "Complète le nom technique du rôle : Install-WindowsFeature -Name AD-Domain-______ .", a: ["Services", "services"], ph: "un mot", exp: "Le nom technique est AD-Domain-Services." },
    { type: "input", q: "Complète : pour VOIR l'état d'une fonctionnalité sans l'installer, on utilise Get-Windows______ .", a: ["Feature", "feature"], ph: "un nom", exp: "Get-WindowsFeature affiche l'état (Available/Installed)." },
    { type: "input", q: "Complète : après installation, l'attribut $r.______ vaut True si tout s'est bien passé.", a: ["Success", "success"], ph: "un attribut", exp: "$r.Success indique le succès de l'opération." },
    { type: "input", q: "Complète : l'attribut qui indique s'il faut redémarrer est $r.Restart______ .", a: ["Needed", "needed"], ph: "un mot", exp: "$r.RestartNeeded vaut No, Yes ou Maybe." },
    { type: "input", q: "Complète le paramètre de simulation : Install-WindowsFeature -Name AD-Domain-Services -______ .", a: ["WhatIf", "whatif"], ph: "un paramètre", exp: "-WhatIf simule l'installation." },
    { type: "vf", q: "On peut installer le rôle AD DS depuis une console PowerShell ouverte sans droits administrateur.", a: false, exp: "Il faut des droits administrateur : l'installation modifie le système." },
    { type: "vf", q: "-IncludeManagementTools installe notamment le module ActiveDirectory que l'on utilisera plus tard.", a: true, exp: "C'est pour cela qu'on l'ajoute presque toujours." },
    { type: "vf", q: "Ranger le résultat dans une variable ($r = Install-WindowsFeature ...) permet ensuite de lire $r.Success.", a: true, exp: "Le résultat est un objet dont on lit les attributs avec le point." },
    { type: "qcm", q: "Comment lister uniquement les fonctionnalités DÉJÀ installées ?", opts: ["Get-WindowsFeature | Where-Object { $_.Installed }", "Install-WindowsFeature -All", "Get-Service", "Remove-WindowsFeature"], a: 0, exp: "On filtre sur l'attribut Installed avec Where-Object." }
  ],
  final: {
    title: "Exercice final — Installer AD DS proprement",
    intro: `<p>Sur un serveur neuf, tu dois installer le rôle d'annuaire avec ses outils, vérifier le succès, et savoir s'il faut redémarrer. Voici la trame commentée à compléter mentalement :</p>
<pre class="pseudo">Get-WindowsFeature -Name AD-Domain-Services            # 1) verifier l'etat AVANT (Available ?)
$r = Install-WindowsFeature -Name AD-Domain-Services -IncludeManagementTools   # 2) installer role + outils
$r.Success                                             # 3) l'installation a-t-elle reussi ?
$r.RestartNeeded                                       # 4) faut-il redemarrer ?</pre>`,
    questions: [
      { type: "input", q: "Quel est le nom technique exact du rôle à passer après -Name ? (avec les tirets)", a: ["AD-Domain-Services", "ad-domain-services"], ph: "Nom-Technique", exp: "AD-Domain-Services." },
      { type: "input", q: "Quel paramètre ajoute les outils d'administration ? (avec son tiret)", a: ["-IncludeManagementTools", "IncludeManagementTools", "-includemanagementtools"], ph: "-Xxxx", exp: "-IncludeManagementTools." },
      { type: "qcm", q: "À quoi sert la ligne 1 (Get-WindowsFeature) avant d'installer ?", opts: ["À installer deux fois", "À vérifier l'état de départ du rôle", "À supprimer le rôle", "À redémarrer"], a: 1, exp: "On regarde si le rôle est Available avant d'agir." },
      { type: "input", q: "Quel attribut de $r vaut True si l'installation a réussi ?", a: ["Success", "success"], ph: "un attribut", exp: "$r.Success." },
      { type: "qcm", q: "Si $r.RestartNeeded indique « Yes », que faut-il faire ?", opts: ["Rien", "Réinstaller le rôle", "Redémarrer le serveur pour finaliser", "Supprimer AD DS"], a: 2, exp: "Certaines installations exigent un redémarrage pour se terminer." }
    ],
    solution: `<p>Le script complet, du contrôle initial au redémarrage éventuel :</p>
<pre class="pseudo">Get-WindowsFeature -Name AD-Domain-Services            # etat de depart : Available attendu
$r = Install-WindowsFeature -Name AD-Domain-Services -IncludeManagementTools   # installation du role + outils
if ($r.Success) { Write-Output "Installation reussie" } # message si succes
$r.RestartNeeded                                       # affiche si un redemarrage est requis
# Restart-Computer -Force                              # a decommenter si RestartNeeded = Yes</pre>
<p>Le rôle est en place, mais le serveur n'est pas encore contrôleur de domaine : il ne détient aucun annuaire. C'est l'objet du jour 4, la <strong>promotion</strong> avec Install-ADDSForest.</p>`
  }
};
</script>
