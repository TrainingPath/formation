<script>
var DAY = {
  num: 12,
  title: "Déplacer et organiser les objets (Move-ADObject)",
  subtitle: "Ranger chaque chose au bon endroit, un ou mille objets à la fois.",
  theory: `
<h3>1. Pourquoi déplacer un objet ?</h3>
<p>Un employé change de service, un ordinateur passe d'un site à un autre, un compte partant doit être archivé : dans tous ces cas, l'objet doit changer d'OU. On ne le recrée pas ; on le <strong>déplace</strong> avec <code>Move-ADObject</code>. L'objet garde son identité, ses attributs et son mot de passe : seul son emplacement (son DN) change.</p>
<h3>2. La cmdlet Move-ADObject</h3>
<p><code>Move-ADObject</code> a besoin de deux informations : <strong>quel</strong> objet déplacer (<code>-Identity</code>, son DN actuel) et <strong>vers où</strong> (<code>-TargetPath</code>, le DN de l'OU de destination).</p>
<pre class="pseudo">Move-ADObject -Identity "CN=Jean Dupont,OU=Ventes,DC=entreprise,DC=local" -TargetPath "OU=Comptabilite,DC=entreprise,DC=local"   # deplace Jean de Ventes vers Comptabilite
# -Identity   : le DN ACTUEL de l'objet a deplacer
# -TargetPath : le DN de l'OU de DESTINATION (le tiroir d'arrivee)</pre>
<div class="warn">Move-ADObject attend le <strong>DN complet</strong> dans <code>-Identity</code>, pas seulement le SamAccountName. On récupère souvent ce DN avec Get-ADUser d'abord (voir plus bas).</div>
<h3>3. Retrouver le DN facilement</h3>
<p>Taper un DN à la main est fastidieux et risqué. Mieux vaut le demander à <code>Get-ADUser</code>, qui renvoie l'attribut <code>DistinguishedName</code>. On peut enchaîner directement dans un pipeline.</p>
<pre class="pseudo">\$dn = (Get-ADUser -Identity jdupont).DistinguishedName   # recupere le DN actuel de jdupont
Move-ADObject -Identity \$dn -TargetPath "OU=Comptabilite,DC=entreprise,DC=local"   # le deplace avec ce DN
# on lit d'abord le DN, puis on s'en sert pour le deplacement</pre>
<h3>4. Déplacer via le pipeline</h3>
<p>Encore plus direct : on peut envoyer l'objet trouvé par Get-ADUser directement dans Move-ADObject par le pipeline, sans variable intermédiaire.</p>
<pre class="pseudo">Get-ADUser -Identity jdupont | Move-ADObject -TargetPath "OU=Comptabilite,DC=entreprise,DC=local"   # trouve puis deplace en une ligne
# Get-ADUser fournit l'objet (avec son DN) ; Move-ADObject le range dans la destination</pre>
<h3>5. Déplacer plusieurs objets d'un coup</h3>
<p>Le pipeline permet de déplacer TOUT un ensemble : par exemple, transférer tous les membres d'un service vers une nouvelle OU. On combine <code>Get-ADUser -Filter</code> et <code>Move-ADObject</code>.</p>
<pre class="pseudo">Get-ADUser -Filter { Department -eq "Ventes" } |
  Move-ADObject -TargetPath "OU=Commercial,DC=entreprise,DC=local"   # deplace TOUS les utilisateurs Ventes vers Commercial
# chaque utilisateur trouve est deplace a son tour dans la nouvelle OU</pre>
<div class="tip">Ce schéma « chercher une liste, la déplacer » sert aussi pour archiver des comptes : on filtre les comptes désactivés et on les envoie dans une OU « Archive ».</div>
<h3>6. Attention à la protection</h3>
<p>Comme les OU, certains objets (surtout les OU elles-mêmes) peuvent être protégés contre la suppression accidentelle. Cette protection peut aussi bloquer un déplacement d'OU. On la retire temporairement si besoin, exactement comme au jour 11.</p>
<pre class="pseudo">Set-ADOrganizationalUnit -Identity "OU=Paris,OU=Ventes,DC=entreprise,DC=local" -ProtectedFromAccidentalDeletion \$false   # retire le garde-fou avant de deplacer l'OU
Move-ADObject -Identity "OU=Paris,OU=Ventes,DC=entreprise,DC=local" -TargetPath "OU=Commercial,DC=entreprise,DC=local"    # deplace l'OU Paris</pre>
<h3>7. Tester et vérifier</h3>
<p>Comme toujours : <code>-WhatIf</code> pour simuler un déplacement de masse, puis relecture pour confirmer le nouvel emplacement.</p>
<pre class="pseudo">Get-ADUser -Filter { Department -eq "Ventes" } | Move-ADObject -TargetPath "OU=Commercial,DC=entreprise,DC=local" -WhatIf   # SIMULE le deplacement collectif
(Get-ADUser -Identity jdupont).DistinguishedName   # relit le DN pour confirmer la nouvelle OU</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle cmdlet déplace un objet d'une OU à une autre ?", opts: ["Set-ADObject", "Move-ADObject", "Rename-ADObject", "Copy-ADObject"], a: 1, exp: "Move-ADObject change l'emplacement d'un objet." },
    { type: "qcm", q: "Que garde un objet quand on le déplace ?", opts: ["Rien", "Son identité, ses attributs et son mot de passe : seul le DN change", "Uniquement le nom", "Il est recréé"], a: 1, exp: "Un déplacement n'altère que l'emplacement." },
    { type: "qcm", q: "Quel paramètre indique l'OU de destination ?", opts: ["-Path", "-TargetPath", "-Destination", "-Identity"], a: 1, exp: "-TargetPath reçoit le DN de l'OU d'arrivée." },
    { type: "qcm", q: "Que doit contenir -Identity pour Move-ADObject ?", opts: ["Le SamAccountName seul", "Le DN complet de l'objet", "Le mot de passe", "Le nom du domaine"], a: 1, exp: "Move-ADObject attend le DN complet." },
    { type: "qcm", q: "Comment déplacer tout un service en une commande ?", opts: ["Un Move par personne", "Get-ADUser -Filter { ... } | Move-ADObject -TargetPath ...", "New-ADUser", "Impossible"], a: 1, exp: "Le pipeline déplace toute la liste filtrée." },
    { type: "input", q: "Complète : le paramètre qui reçoit le DN de destination est -Target______ .", a: ["Path", "path"], ph: "un mot", exp: "-TargetPath." },
    { type: "input", q: "Complète : pour récupérer le DN d'un utilisateur, on lit (Get-ADUser -Identity jdupont).______ .", a: ["DistinguishedName", "distinguishedname"], ph: "un attribut", exp: "L'attribut DistinguishedName donne le DN." },
    { type: "input", q: "Complète : pour déplacer via pipeline, on écrit Get-ADUser -Identity jdupont | ______-ADObject -TargetPath ... .", a: ["Move", "move"], ph: "un verbe", exp: "Move-ADObject reçoit l'objet par le pipeline." },
    { type: "input", q: "Complète : pour SIMULER un déplacement de masse, on ajoute -______ .", a: ["WhatIf", "whatif"], ph: "un paramètre", exp: "-WhatIf simule sans agir." },
    { type: "input", q: "Complète : avant de déplacer une OU protégée, on met -ProtectedFromAccidentalDeletion $______ .", a: ["false", "False"], ph: "un booléen", exp: "$false retire le garde-fou." },
    { type: "input", q: "Complète : pour filtrer les utilisateurs d'un service avant de les déplacer, on utilise Get-ADUser -______ { Department -eq \"Ventes\" } .", a: ["Filter", "filter"], ph: "un paramètre", exp: "-Filter sélectionne la liste à déplacer." },
    { type: "vf", q: "Déplacer un objet le recrée depuis zéro et lui donne un nouveau mot de passe.", a: false, exp: "Non : l'objet garde tout ; seul son emplacement change." },
    { type: "vf", q: "On peut envoyer le résultat de Get-ADUser directement dans Move-ADObject par le pipeline.", a: true, exp: "Get-ADUser fournit l'objet et son DN à Move-ADObject." },
    { type: "vf", q: "La protection contre la suppression accidentelle peut empêcher de déplacer une OU.", a: true, exp: "On la retire temporairement avant le déplacement." },
    { type: "qcm", q: "Comment archiver tous les comptes désactivés dans une OU Archive ?", opts: ["Les supprimer", "Get-ADUser -Filter { Enabled -eq $false } | Move-ADObject -TargetPath \"OU=Archive,...\"", "Les recréer", "Rien faire"], a: 1, exp: "On filtre les désactivés et on les déplace vers l'archive." }
  ],
  final: {
    title: "Exercice final — Fusion de deux équipes",
    intro: `<p>Le service « Ventes » fusionne avec « Commercial » : il faut déplacer tous les utilisateurs de l'OU Ventes vers l'OU Commercial, après avoir simulé l'opération. Un cas particulier : l'employé <code>jdupont</code>, dont on connaît juste l'identifiant, doit rejoindre l'OU Direction. Étudie la trame :</p>
<pre class="pseudo">Get-ADUser -Filter * -SearchBase "OU=Ventes,DC=entreprise,DC=local" |
  Move-ADObject -TargetPath "OU=Commercial,DC=entreprise,DC=local" -WhatIf   # 1) SIMULE le deplacement collectif
Get-ADUser -Filter * -SearchBase "OU=Ventes,DC=entreprise,DC=local" |
  Move-ADObject -TargetPath "OU=Commercial,DC=entreprise,DC=local"           # 2) applique pour de vrai
Get-ADUser -Identity jdupont | Move-ADObject -TargetPath "OU=Direction,DC=entreprise,DC=local"   # 3) cas particulier</pre>`,
    questions: [
      { type: "input", q: "Quelle cmdlet réalise le déplacement ?", a: ["Move-ADObject", "move-adobject"], ph: "Move-...", exp: "Move-ADObject." },
      { type: "input", q: "Quel paramètre indique l'OU de destination ? (avec son tiret)", a: ["-TargetPath", "TargetPath", "-targetpath"], ph: "-Xxxx", exp: "-TargetPath." },
      { type: "qcm", q: "À quoi sert -WhatIf à la ligne 1 ?", opts: ["À déplacer deux fois", "À simuler et voir qui serait déplacé, sans rien bouger", "À supprimer l'OU", "À trier"], a: 1, exp: "On vérifie l'ampleur du déplacement avant de le faire." },
      { type: "qcm", q: "Pour jdupont, pourquoi passer par Get-ADUser | Move-ADObject ?", opts: ["Pour le supprimer", "Parce que Move-ADObject a besoin du DN complet, que Get-ADUser fournit", "Pour changer son mot de passe", "Parce que Move-ADObject accepte seulement le SamAccountName"], a: 1, exp: "Get-ADUser donne l'objet et son DN au pipeline." },
      { type: "input", q: "Quel paramètre de Get-ADUser limite la recherche à l'OU Ventes ?", a: ["-SearchBase", "SearchBase", "-searchbase"], ph: "-Xxxx", exp: "-SearchBase cible l'OU source." }
    ],
    solution: `<p>La fusion complète, du test au cas particulier :</p>
<pre class="pseudo"># 1) Simulation du deplacement collectif
Get-ADUser -Filter * -SearchBase "OU=Ventes,DC=entreprise,DC=local" |
  Move-ADObject -TargetPath "OU=Commercial,DC=entreprise,DC=local" -WhatIf
# 2) Deplacement reel de tous les utilisateurs de Ventes vers Commercial
Get-ADUser -Filter * -SearchBase "OU=Ventes,DC=entreprise,DC=local" |
  Move-ADObject -TargetPath "OU=Commercial,DC=entreprise,DC=local"
# 3) Cas particulier : jdupont rejoint la Direction (Get-ADUser fournit le DN)
Get-ADUser -Identity jdupont | Move-ADObject -TargetPath "OU=Direction,DC=entreprise,DC=local"
# Verification : relire le nouvel emplacement
(Get-ADUser -Identity jdupont).DistinguishedName</pre>
<p>Tu sais désormais ranger et réorganiser l'annuaire à volonté. Au jour 13, nous abordons les groupes : leurs types et leurs étendues.</p>`
  }
};
</script>

    solution: "Get-ADUser -Identity lpetit | Move-ADObject -TargetPath \"OU=IT,DC=entreprise,DC=local\"                    # 1) deplace lpetit vers l'OU IT (Get-ADUser fournit son DN)\nGet-ADUser -Filter { Enabled -eq $false } | Move-ADObject -TargetPath \"OU=Archive,DC=entreprise,DC=local\" -WhatIf   # 2a) SIMULE l'archivage des comptes desactives\nGet-ADUser -Filter { Enabled -eq $false } | Move-ADObject -TargetPath \"OU=Archive,DC=entreprise,DC=local\"           # 2b) archive reellement les comptes desactives\n# Move-ADObject deplace chaque objet recu ; l'objet garde identite, attributs et mot de passe",
