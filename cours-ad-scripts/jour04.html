<script>
var DAY = {
  num: 4,
  title: "Promouvoir un contrôleur de domaine (Install-ADDSForest)",
  subtitle: "Donner naissance au domaine : transformer le serveur en gardien de l'annuaire.",
  theory: `
<h3>1. Installer n'est pas promouvoir</h3>
<p>Au jour 3, nous avons installé le <strong>rôle</strong> AD DS : le moteur est là, mais aucun annuaire n'existe encore. La <strong>promotion</strong> est l'étape qui crée réellement le domaine et fait du serveur un <strong>contrôleur de domaine</strong> (le gardien qui détient l'annuaire et valide les connexions). C'est comme monter le moteur d'une voiture (jour 3) puis, enfin, mettre le contact (aujourd'hui).</p>
<h3>2. Créer une forêt neuve : Install-ADDSForest</h3>
<p>Quand il n'existe encore aucun domaine, on crée la toute première <strong>forêt</strong> (et donc le premier domaine, dit domaine racine) avec la cmdlet <code>Install-ADDSForest</code>. Son paramètre principal est <code>-DomainName</code>, le nom du futur domaine.</p>
<pre class="pseudo">Install-ADDSForest -DomainName "entreprise.local"   # cree la foret et son premier domaine
# -DomainName : le nom du domaine racine, sous forme d'adresse (entreprise.local)</pre>
<div class="tip">Il existe aussi <code>Install-ADDSDomainController</code> pour AJOUTER un contrôleur à un domaine déjà existant. Aujourd'hui on part de zéro, donc c'est bien <code>Install-ADDSForest</code>.</div>
<h3>3. Le nom NetBIOS</h3>
<p>À côté du nom complet (entreprise.local), chaque domaine a aussi un <strong>nom NetBIOS</strong> : un nom court, en majuscules, sans point, hérité des anciennes versions de Windows (par exemple <code>ENTREPRISE</code>). On le fixe avec <code>-DomainNetbiosName</code>.</p>
<pre class="pseudo">Install-ADDSForest -DomainName "entreprise.local" -DomainNetbiosName "ENTREPRISE"   # nom long + nom court
# -DomainNetbiosName : le nom court (max 15 caracteres, sans point)</pre>
<h3>4. Le mot de passe de restauration (DSRM)</h3>
<p>La promotion réclame un mot de passe spécial : le <strong>mot de passe DSRM</strong> (<em>Directory Services Restore Mode</em>, « mode de restauration des services d'annuaire »). C'est un mot de passe de secours pour réparer l'annuaire s'il tombe en panne, comme une clé de secours cachée. On le fournit sous forme sécurisée avec <code>-SafeModeAdministratorPassword</code>.</p>
<pre class="pseudo">$pwd = ConvertTo-SecureString "MotDePasseFort!" -AsPlainText -Force   # transforme le texte en mot de passe securise
Install-ADDSForest -DomainName "entreprise.local" -SafeModeAdministratorPassword $pwd   # promotion avec le mdp DSRM
# ConvertTo-SecureString : chiffre le texte en memoire
# -AsPlainText -Force : on part d'un texte clair (a eviter en prod, ici pour l'exemple)</pre>
<div class="warn">Note bien ce mot de passe DSRM en lieu sûr : sans lui, impossible de réparer l'annuaire en cas de gros problème. Il n'est PAS le même que le mot de passe administrateur habituel.</div>
<h3>5. Le niveau fonctionnel</h3>
<p>Le <strong>niveau fonctionnel</strong> (<em>functional level</em>) indique la version minimale de Windows Server que devront respecter tous les contrôleurs : il débloque certaines fonctions modernes mais interdit les serveurs trop anciens. On le fixe avec <code>-ForestMode</code> et <code>-DomainMode</code> (par exemple <code>WinThreshold</code> pour les versions récentes).</p>
<pre class="pseudo">Install-ADDSForest -DomainName "entreprise.local" -ForestMode WinThreshold -DomainMode WinThreshold   # niveau moderne
# -ForestMode / -DomainMode : compatibilite minimale exigee des controleurs</pre>
<h3>6. Le redémarrage automatique</h3>
<p>La promotion se termine toujours par un <strong>redémarrage</strong> du serveur : c'est en redémarrant qu'il devient réellement contrôleur de domaine. Le paramètre <code>-Force</code> évite les questions de confirmation dans un script.</p>
<pre class="pseudo">Install-ADDSForest -DomainName "entreprise.local" -SafeModeAdministratorPassword $pwd -Force   # promotion sans confirmation
# Le serveur redemarre a la fin : au reveil, il est controleur de domaine</pre>
<div class="tip">Après ce redémarrage, les cmdlets du module ActiveDirectory (Get-ADUser, New-ADUser…) deviennent utilisables. C'est le début de l'administration, à partir du jour 5.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle est la différence entre installer le rôle (jour 3) et promouvoir (jour 4) ?", opts: ["Aucune", "Installer pose le moteur ; promouvoir crée le domaine et fait du serveur un contrôleur de domaine", "Promouvoir supprime le rôle", "Installer crée le domaine"], a: 1, exp: "La promotion crée réellement l'annuaire." },
    { type: "qcm", q: "Quelle cmdlet crée une toute première forêt (aucun domaine existant) ?", opts: ["New-ADForest", "Install-ADDSForest", "Add-ADDomain", "Set-ADForest"], a: 1, exp: "Install-ADDSForest crée la forêt et son domaine racine." },
    { type: "qcm", q: "Quel paramètre donne le nom du futur domaine ?", opts: ["-Name", "-DomainName", "-Forest", "-DN"], a: 1, exp: "-DomainName \"entreprise.local\"." },
    { type: "qcm", q: "À quoi sert le mot de passe DSRM (SafeModeAdministratorPassword) ?", opts: ["À se connecter tous les jours", "À réparer l'annuaire en mode de restauration si panne", "À chiffrer les fichiers", "À rien"], a: 1, exp: "C'est la clé de secours pour restaurer les services d'annuaire." },
    { type: "qcm", q: "Que se passe-t-il à la fin de la promotion ?", opts: ["Rien", "Le serveur redémarre et devient contrôleur de domaine", "Le rôle est désinstallé", "Le domaine est supprimé"], a: 1, exp: "Le redémarrage finalise la transformation en DC." },
    { type: "input", q: "Complète la cmdlet de promotion d'une nouvelle forêt : Install-ADDS______ .", a: ["Forest", "forest"], ph: "un mot", exp: "Install-ADDSForest." },
    { type: "input", q: "Complète : le paramètre qui fixe le nom du domaine est -Domain______ .", a: ["Name", "name"], ph: "un mot", exp: "-DomainName." },
    { type: "input", q: "Complète : le nom court en majuscules et sans point s'appelle le nom ______ .", a: ["NetBIOS", "netbios", "NetBios"], ph: "un mot", exp: "Le nom NetBIOS, fixé par -DomainNetbiosName." },
    { type: "input", q: "Complète : pour transformer un texte en mot de passe sécurisé, on utilise ConvertTo-Secure______ .", a: ["String", "string"], ph: "un mot", exp: "ConvertTo-SecureString chiffre le texte en mémoire." },
    { type: "input", q: "Complète : le paramètre qui évite les demandes de confirmation dans un script est -______ .", a: ["Force", "force"], ph: "un paramètre", exp: "-Force exécute sans poser de questions." },
    { type: "input", q: "Complète : pour AJOUTER un contrôleur à un domaine EXISTANT, on utilise Install-ADDS______Controller .", a: ["Domain", "domain"], ph: "un mot", exp: "Install-ADDSDomainController ajoute un DC à un domaine déjà en place." },
    { type: "vf", q: "Le mot de passe DSRM est le même que le mot de passe administrateur habituel.", a: false, exp: "C'est un mot de passe distinct, dédié au mode de restauration de l'annuaire." },
    { type: "vf", q: "Install-ADDSForest sert quand aucun domaine n'existe encore ; on part de zéro.", a: true, exp: "Il crée la première forêt et son domaine racine." },
    { type: "vf", q: "Après la promotion et le redémarrage, les cmdlets Get-ADUser et New-ADUser deviennent utilisables.", a: true, exp: "Le module ActiveDirectory est pleinement actif une fois le DC opérationnel." },
    { type: "qcm", q: "Que fixe le paramètre -ForestMode (ou -DomainMode) ?", opts: ["Le mot de passe", "Le niveau fonctionnel, c'est-à-dire la version minimale exigée des contrôleurs", "Le nom NetBIOS", "L'adresse IP"], a: 1, exp: "Le niveau fonctionnel débloque des fonctions et fixe une compatibilité minimale." }
  ],
  final: {
    title: "Exercice final — Naissance du domaine formation.local",
    intro: `<p>Tu crées de zéro la forêt <code>formation.local</code> (nom NetBIOS <code>FORMATION</code>), avec un mot de passe DSRM et un redémarrage automatique. Étudie la séquence commentée :</p>
<pre class="pseudo">$pwd = ConvertTo-SecureString "Restaurer2024!" -AsPlainText -Force   # prepare le mot de passe DSRM securise
Install-ADDSForest -DomainName "formation.local" -DomainNetbiosName "FORMATION" -SafeModeAdministratorPassword $pwd -Force   # promotion complete
# le serveur redemarre a la fin et devient controleur de domaine</pre>`,
    questions: [
      { type: "input", q: "Quelle cmdlet crée la forêt de zéro ?", a: ["Install-ADDSForest", "install-addsforest"], ph: "Install-...", exp: "Install-ADDSForest." },
      { type: "input", q: "Quel paramètre fixe le nom court FORMATION ? (avec son tiret)", a: ["-DomainNetbiosName", "DomainNetbiosName", "-domainnetbiosname"], ph: "-Xxxx", exp: "-DomainNetbiosName \"FORMATION\"." },
      { type: "qcm", q: "Que fait ConvertTo-SecureString ici ?", opts: ["Il crée le domaine", "Il transforme le texte du mot de passe en objet sécurisé attendu par la cmdlet", "Il redémarre le serveur", "Il supprime le domaine"], a: 1, exp: "-SafeModeAdministratorPassword attend un mot de passe sécurisé, pas du texte brut." },
      { type: "input", q: "Quel paramètre évite toute demande de confirmation dans le script ? (avec son tiret)", a: ["-Force", "Force", "-force"], ph: "-Xxxx", exp: "-Force." },
      { type: "qcm", q: "Après exécution, que devient le serveur ?", opts: ["Un simple client", "Un contrôleur de domaine du domaine formation.local", "Un serveur web", "Rien de spécial"], a: 1, exp: "Après le redémarrage, il détient l'annuaire de formation.local." }
    ],
    solution: `<p>Le script complet de naissance d'un domaine :</p>
<pre class="pseudo">$pwd = ConvertTo-SecureString "Restaurer2024!" -AsPlainText -Force   # mot de passe DSRM (a garder en lieu sur)
Install-ADDSForest \`
  -DomainName "formation.local" \`
  -DomainNetbiosName "FORMATION" \`
  -SafeModeAdministratorPassword $pwd \`
  -Force                                                            # cree la foret, le domaine, promeut, et redemarre
# Au reveil du serveur : il est controleur de domaine, l'annuaire existe.</pre>
<p>Le domaine est né. Dès le jour 5, nous découvrirons le module ActiveDirectory pour peupler cet annuaire d'utilisateurs, de groupes et d'ordinateurs.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton script PowerShell ici…",
  items: [
  { id: "adps-j04", title: "Promouvoir le premier contrôleur", level: 3,
    statement: "Écris un script qui crée de zéro la forêt <code>labo.local</code> avec le nom NetBIOS <code>LABO</code> : prépare d'abord un mot de passe DSRM sécurisé dans <code>$pwd</code>, puis lance <code>Install-ADDSForest</code> avec le nom de domaine, le nom NetBIOS, le mot de passe DSRM, et sans demande de confirmation. Commente chaque ligne.",
    atoi: { cmd: "$pwd = ConvertTo-SecureString \"MdpDsrm2024!\" -AsPlainText -Force\nInstall-ADDSForest -DomainName \"labo.local\" -DomainNetbiosName \"LABO\" -SafeModeAdministratorPassword $pwd -Force", expected: "Message                 Context   RebootRequired  Status\n-------                 -------   --------------  ------\nL'opération a réussi.    DCPromo   True            Success\n(le serveur devient contrôleur de domaine de la nouvelle forêt labo.local, puis redémarre automatiquement)" },
    checklist: ["Le mot de passe DSRM est-il préparé en SecureString avant l'appel ?", "As-tu fourni -DomainName, -DomainNetbiosName et -SafeModeAdministratorPassword ?", "Fais-tu cet essai sur un serveur de labo isolé, jamais en production ?"],
    hints: [
      "Prépare le mot de passe avec ConvertTo-SecureString \"...\" -AsPlainText -Force.",
      "Passe-le à -SafeModeAdministratorPassword $pwd.",
      "-DomainName, -DomainNetbiosName et -Force complètent la commande."
    ],
    solution: "$pwd = ConvertTo-SecureString \"MdpDsrm2024!\" -AsPlainText -Force   # prepare le mot de passe DSRM securise\nInstall-ADDSForest -DomainName \"labo.local\" -DomainNetbiosName \"LABO\" -SafeModeAdministratorPassword $pwd -Force   # cree la foret et promeut le serveur\n# -DomainName        : nom complet du domaine (labo.local)\n# -DomainNetbiosName : nom court en majuscules (LABO)\n# -SafeModeAdministratorPassword : mot de passe DSRM de secours\n# -Force             : pas de demande de confirmation ; le serveur redemarre a la fin",
    note: "Ne fais JAMAIS un premier essai de promotion en production : monte d'abord un serveur de labo isolé. Une forêt mal nommée est presque impossible à renommer proprement." }
  ]
};
</script>
