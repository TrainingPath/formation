<script>
var DAY = {
  num: 31,
  title: "Examen final : automatiser l'administration AD",
  subtitle: "Une synthèse de tout le parcours, des attributs à l'onboarding.",
  theory: `
<h3>1. Ce que tu sais faire maintenant</h3>
<p>Bravo : tu arrives au terme du parcours « Active Directory par les scripts ». Tu es passé des <strong>attributs et du schéma</strong> (la matière première de l'annuaire) jusqu'à un vrai <strong>script d'onboarding</strong>. Cet examen final récapitule les grandes notions et vérifie que les réflexes sont acquis. Prends ton temps, relis les définitions au besoin : c'est une révision, pas un piège.</p>
<h3>2. La carte du cours</h3>
<p>Voici, en une vue, tout ce que couvre l'examen :</p>
<pre class="pseudo">Attributs & schema     : objet, classe, attribut, ldapDisplayName        # jour 17
GPO                    : stratégie de groupe, GPO, liaison (link)         # jours 18-19
Securite des acces     : ACL, ACE, delegation, moindre privilege          # jour 20
Comptes de service     : gMSA, cle racine KDS, mot de passe gere          # jour 21
Automatisation         : fonction, param(), Mandatory, valeur par defaut  # jour 22
Rapports               : Filter, Select/Sort/Group, Export-Csv            # jour 23
Recuperation           : corbeille AD, tombstone, Restore-ADObject        # jour 24
Sauvegarde             : System State, wbadmin, ntdsutil, DSRM            # jour 25
Roles FSMO             : 5 roles, transfert, saisie (seize)               # jour 26
Replication            : convergence, Get-ADReplication*, forcer          # jour 27
Securite/audit         : comptes a risque, Search-ADAccount, Get-WinEvent # jour 28
Maintenance            : taches planifiees, journalisation                # jour 29
Projet                 : onboarding complet                               # jour 30</pre>
<h3>3. Les cmdlets à retenir absolument</h3>
<p>Un petit aide-mémoire des commandes les plus utiles, classées par verbe :</p>
<pre class="pseudo">Get-ADUser / Get-ADGroupMember / Get-ADDomain / Get-ADForest   # LIRE l'annuaire
New-ADUser / New-GPO / New-ADServiceAccount / New-GPLink        # CREER
Set-ADUser / Set-GPRegistryValue / Set-Acl                      # MODIFIER
Add-ADGroupMember                                               # AJOUTER a un groupe
Search-ADAccount                                               # CHERCHER des comptes a risque
Restore-ADObject                                               # RESTAURER un objet supprime
Register-ScheduledTask                                         # PLANIFIER une tache</pre>
<div class="tip">Rappelle-toi la grammaire de PowerShell : tout est <strong>Verbe-Nom</strong>. Get pour lire, New pour créer, Set pour modifier, Remove pour supprimer, Add pour ajouter. Deviner le nom d'une cmdlet devient facile.</div>
<h3>4. Les principes qui comptent plus que les commandes</h3>
<p>Au-delà de la syntaxe, retiens surtout ces idées de fond, valables toute une carrière :</p>
<pre class="pseudo">Moindre privilege   : n'accorder QUE le droit necessaire, sur la plus petite portee   # jour 20
Repetabilite        : un script fait 100 fois le meme geste, sans oubli               # jours 22, 30
Tracer/journaliser  : garder une preuve ecrite de ce qui a ete fait                   # jour 29
Sauvegarder AVANT   : corbeille AD et System State prets avant l'incident             # jours 24-25
Verifier apres      : relire l'etat (Get-...) apres chaque changement                 # partout</pre>
<h3>5. Conseils pour l'examen</h3>
<p>Lis chaque question en entier. Pour les questions « à taper », respecte la forme Verbe-Nom et les tirets des paramètres. Pour les vrai/faux, méfie-toi des mots absolus (« toujours », « jamais »). Et souviens-toi : une commande qui LIT (Get-, Search-, Test-) est sans danger ; une commande qui MODIFIE (Set-, Remove-, Move- -Force) mérite qu'on réfléchisse à deux fois.</p>
<div class="warn">Dans la vraie vie comme à l'examen : avant d'exécuter une commande qui change l'annuaire, demande-toi « qui cela touche-t-il, et comment revenir en arrière ? ». C'est la marque d'un bon administrateur.</div>
<h3>6. Et après ?</h3>
<p>Ce cours t'a donné les fondations. Pour continuer : automatise tes propres tâches répétitives, découvre la gestion des erreurs (<code>try/catch</code>), l'import en masse depuis des fichiers CSV, et les modules complémentaires (DNS, DHCP, Exchange). L'automatisation est un chemin sans fin, mais tu tiens désormais la boussole. Bonne administration !</p>`,
  exercises: [
    { type: "qcm", q: "Quelle cmdlet LIT les informations d'un utilisateur ?", opts: ["New-ADUser", "Get-ADUser", "Remove-ADUser", "Set-GPO"], a: 1, exp: "Get pour lire ; Get-ADUser interroge une fiche." },
    { type: "qcm", q: "Que faut-il faire pour qu'une GPO agisse ?", opts: ["La renommer", "La lier (link) à un site, domaine ou OU", "La sauvegarder", "Rien"], a: 1, exp: "Sans liaison, une GPO n'a aucun effet (jours 18-19)." },
    { type: "qcm", q: "Le principe du moindre privilège consiste à…", opts: ["Donner Contrôle total à tous", "N'accorder que le droit nécessaire sur la plus petite portée", "Tout refuser", "Ignorer les ACL"], a: 1, exp: "Fondamental de sécurité (jour 20)." },
    { type: "qcm", q: "Qu'est-ce qui gère automatiquement le mot de passe d'un compte de service ?", opts: ["Une GPO", "Un gMSA", "Un tombstone", "Le PDC seul"], a: 1, exp: "Le gMSA : mot de passe géré par AD (jour 21)." },
    { type: "qcm", q: "Combien de rôles FSMO existe-t-il ?", opts: ["3", "5", "7", "1"], a: 1, exp: "Cinq : 2 de forêt, 3 de domaine (jour 26)." },
    { type: "qcm", q: "Que permet la corbeille AD ?", opts: ["Supprimer plus vite", "Restaurer intégralement un objet supprimé", "Créer des GPO", "Répliquer"], a: 1, exp: "Elle conserve tous les attributs (jour 24)." },
    { type: "input", q: "Quelle cmdlet CRÉE un utilisateur ? (Verbe-Nom)", a: ["New-ADUser", "new-aduser"], ph: "Verbe-ADUser", exp: "New-ADUser (jour 30)." },
    { type: "input", q: "Quelle cmdlet AJOUTE un utilisateur à un groupe ? (Verbe-Nom)", a: ["Add-ADGroupMember", "add-adgroupmember"], ph: "Verbe-ADGroupMember", exp: "Add-ADGroupMember." },
    { type: "input", q: "Quelle cmdlet CHERCHE les comptes inactifs ou verrouillés ? (Verbe-Nom)", a: ["Search-ADAccount", "search-adaccount"], ph: "Verbe-ADAccount", exp: "Search-ADAccount (jour 28)." },
    { type: "input", q: "Quelle cmdlet EXPORTE un rapport en fichier CSV ? (Verbe-Nom)", a: ["Export-Csv", "export-csv"], ph: "Verbe-Csv", exp: "Export-Csv (jour 23)." },
    { type: "input", q: "Quelle cmdlet RESTAURE un objet supprimé (corbeille) ? (Verbe-Nom)", a: ["Restore-ADObject", "restore-adobject"], ph: "Verbe-ADObject", exp: "Restore-ADObject (jour 24)." },
    { type: "input", q: "Quelle cmdlet ENREGISTRE une tâche planifiée ? (Verbe-Nom)", a: ["Register-ScheduledTask", "register-scheduledtask"], ph: "Verbe-ScheduledTask", exp: "Register-ScheduledTask (jour 29)." },
    { type: "vf", q: "En PowerShell, les commandes suivent la forme Verbe-Nom (Get-, New-, Set-…).", a: true, exp: "C'est la grammaire de PowerShell." },
    { type: "vf", q: "Une commande qui commence par Get- modifie l'annuaire.", a: false, exp: "Get- ne fait que lire : c'est sans danger." },
    { type: "vf", q: "Il vaut mieux activer la corbeille AD et les sauvegardes AVANT le premier incident.", a: true, exp: "Sauvegarder avant, c'est éviter la catastrophe (jours 24-25)." }
  ],
  final: {
    title: "Exercice final — Le scénario complet",
    intro: `<p>Mise en situation récapitulative : une nouvelle employée arrive, tu dois l'intégrer, puis mettre en place le suivi. Ce final relie plusieurs jours du cours.</p>

2. La retrouver/restaurer si suppression erronee # jour 24
3. Planifier un audit de securite regulier        # jours 28-29</pre>`,
    questions: [
      { type: "input", q: "Pour créer le compte de la nouvelle employée, quelle cmdlet ? (Verbe-Nom)", a: ["New-ADUser", "new-aduser"], ph: "Verbe-ADUser", exp: "New-ADUser crée le compte (jour 30)." },
      { type: "qcm", q: "Pour qu'elle change son mot de passe temporaire à la 1re connexion, quel paramètre ?", opts: ["-Enabled $false", "-ChangePasswordAtLogon $true", "-Path", "-Filter"], a: 1, exp: "-ChangePasswordAtLogon $true force le changement." },
      { type: "input", q: "Si son compte est supprimé par erreur (corbeille active), quelle cmdlet le restaure ? (Verbe-Nom)", a: ["Restore-ADObject", "restore-adobject"], ph: "Verbe-ADObject", exp: "Restore-ADObject (jour 24)." },
      { type: "input", q: "Pour faire tourner l'audit chaque semaine automatiquement, quelle cmdlet enregistre la tâche ? (Verbe-Nom)", a: ["Register-ScheduledTask", "register-scheduledtask"], ph: "Verbe-ScheduledTask", exp: "Register-ScheduledTask (jour 29)." },
      { type: "qcm", q: "Quel principe guide TOUTES ces actions de bout en bout ?", opts: ["Donner le maximum de droits", "Moindre privilège, répétabilité et traçabilité", "Ne jamais sauvegarder", "Éviter les scripts"], a: 1, exp: "Ce sont les fils rouges du cours." }
    ],
    solution: `<p>Le scénario complet, en assemblant les briques du cours :</p>
<pre class="pseudo">-- 1. ONBOARDING (jour 30) --
New-Onboarding -Prenom "Sophie" -Nom "Bernard" -Service "RH"        # cree compte + groupes + dossier + journal

-- 2. RECUPERATION si suppression accidentelle (jour 24) --
Get-ADObject -Filter "Name -like 'Sophie Bernard*'" -IncludeDeletedObjects | Restore-ADObject   # restaure

-- 3. AUDIT PLANIFIE (jours 28-29) --
$action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-File C:\Scripts\risque.ps1"   # QUOI
$decl   = New-ScheduledTaskTrigger -Weekly -DaysOfWeek Monday -At 7am                                 # QUAND
Register-ScheduledTask -TaskName "Audit securite" -Action $action -Trigger $decl -User "SYSTEM"       # ENREGISTRE</pre>
<p>Créer, récupérer, surveiller : trois moments d'une même mission d'administration, chacun automatisé et tracé. Tu maîtrises désormais la boucle complète : de l'attribut isolé jusqu'à l'infrastructure qui s'entretient toute seule. Félicitations pour ce parcours, et bonne route dans l'automatisation !</p>`
  }
