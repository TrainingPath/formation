<script>
var DAY = {
  num: 17,
  title: "Les attributs et le schéma",
  subtitle: "Comprendre de quoi est fait chaque objet d'Active Directory.",
  theory: `
<h3>1. Un annuaire rempli d'objets</h3>
<p>Active Directory (AD) est un <strong>annuaire</strong> : une grande base de données qui décrit tout ce qui vit sur le réseau de l'entreprise. Chaque élément qu'AD connaît (un employé, un ordinateur, une imprimante, un groupe…) est un <strong>objet</strong>. Un objet, c'est comme une fiche cartonnée : une fiche pour Marie Dupont, une fiche pour le PC-COMPTA-01, etc.</p>
<p>Chaque objet appartient à une <strong>classe</strong>. La classe, c'est le <em>type</em> de la fiche : la classe <code>user</code> (utilisateur), la classe <code>computer</code> (ordinateur), la classe <code>group</code> (groupe). Toutes les fiches d'une même classe ont les mêmes rubriques à remplir.</p>
<h3>2. Les attributs : les rubriques de la fiche</h3>
<p>Un <strong>attribut</strong> est une rubrique (une propriété) de l'objet : une petite case qui contient une information précise. La fiche d'un utilisateur possède par exemple les attributs <code>GivenName</code> (le prénom), <code>Surname</code> (le nom de famille), <code>mail</code> (l'adresse e-mail) ou <code>Department</code> (le service). Chaque attribut a un nom et une valeur, exactement comme « Prénom : Marie ».</p>
<div class="tip">Beaucoup d'attributs ont deux noms : un nom « lisible » dans les fenêtres Windows (par exemple « Prénom ») et un nom technique utilisé par les scripts et le protocole LDAP, appelé le <strong>ldapDisplayName</strong> (ici <code>givenName</code>). En PowerShell, on utilise le nom technique.</div>
<h3>3. Le schéma : le plan de tous les objets</h3>
<p>Le <strong>schéma</strong> est le catalogue qui définit TOUTES les classes possibles et TOUS les attributs possibles dans la forêt AD. C'est le plan d'architecte de l'annuaire : il dit « un objet de classe user PEUT avoir tel et tel attribut, et cet attribut contient du texte / un nombre / une date ». Le schéma est unique et partagé par toute la forêt.</p>
<div class="warn">Modifier le schéma (ajouter un attribut inédit) est une opération <strong>irréversible</strong> et globale : on ne supprime jamais vraiment un attribut du schéma. On y touche seulement avec de très bonnes raisons et beaucoup de précautions.</div>
<h3>4. Lire les attributs avec PowerShell</h3>
<p>Le module <strong>ActiveDirectory</strong> fournit des <strong>cmdlets</strong> (des commandes PowerShell prêtes à l'emploi) pour interroger l'annuaire. Par défaut, <code>Get-ADUser</code> ne renvoie que quelques attributs de base : pour en voir d'autres, on les demande explicitement avec le paramètre <code>-Properties</code>.</p>
<pre class="pseudo">Import-Module ActiveDirectory          # charge le module qui contient les cmdlets AD
Get-ADUser -Identity mdupont           # renvoie les attributs de BASE de l'utilisateur mdupont
Get-ADUser -Identity mdupont -Properties Department,mail   # demande EN PLUS le service et l'e-mail
Get-ADUser -Identity mdupont -Properties *   # affiche TOUS les attributs remplis de la fiche</pre>
<p>Pour n'afficher que certaines rubriques, on canalise le résultat vers <code>Select-Object</code> (le symbole barre verticale s'appelle le <strong>pipe</strong> : il envoie le résultat d'une commande dans la suivante) :</p>
<pre class="pseudo">Get-ADUser -Identity mdupont -Properties Department | Select-Object Name,Department   # n'affiche que le nom et le service</pre>
<h3>5. Explorer le schéma lui-même</h3>
<p>On peut aussi interroger le schéma pour lister les attributs existants. Chaque attribut du schéma est décrit par un objet que l'on lit avec <code>Get-ADObject</code> :</p>
<pre class="pseudo">Get-ADObject -SearchBase (Get-ADRootDSE).schemaNamingContext -LDAPFilter "(objectClass=attributeSchema)" -Properties name   # liste tous les attributs definis dans le schema</pre>
<div class="tip">Retiens surtout la logique : un objet = une fiche, une classe = un type de fiche, un attribut = une case de la fiche, le schéma = le plan de toutes les fiches possibles.</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'un <strong>objet</strong> dans Active Directory ?", opts: ["Un fichier sur le disque", "Un élément décrit par l'annuaire (utilisateur, ordinateur, groupe…)", "Une fenêtre Windows", "Un câble réseau"], a: 1, exp: "Chaque utilisateur, ordinateur ou groupe est un objet, comparable à une fiche." },
    { type: "qcm", q: "Un <strong>attribut</strong>, c'est…", opts: ["Un type d'objet", "Une rubrique (propriété) d'un objet, comme le prénom ou l'e-mail", "Un serveur", "Un mot de passe uniquement"], a: 1, exp: "L'attribut est une case de la fiche : GivenName, mail, Department…" },
    { type: "qcm", q: "À quoi sert le <strong>schéma</strong> ?", opts: ["À sauvegarder l'annuaire", "À définir toutes les classes et tous les attributs possibles", "À connecter les câbles", "À afficher les fenêtres"], a: 1, exp: "Le schéma est le plan qui décrit ce qu'un objet PEUT contenir." },
    { type: "qcm", q: "Quelle cmdlet lit les informations d'un utilisateur ?", opts: ["Read-User", "Get-ADUser", "Show-Attribute", "Open-ADUser"], a: 1, exp: "Get-ADUser interroge la fiche d'un utilisateur." },
    { type: "qcm", q: "Par défaut, <code>Get-ADUser</code> renvoie…", opts: ["Tous les attributs", "Seulement quelques attributs de base", "Aucun attribut", "Uniquement le mot de passe"], a: 1, exp: "Pour les autres attributs, il faut le paramètre -Properties." },
    { type: "qcm", q: "Le nom technique d'un attribut utilisé par les scripts s'appelle…", opts: ["le displayName", "le ldapDisplayName", "le hostname", "le SID"], a: 1, exp: "Le ldapDisplayName (ex : givenName) est le nom utilisé par LDAP et PowerShell." },
    { type: "input", q: "Quel PARAMÈTRE ajoute-t-on à Get-ADUser pour demander des attributs supplémentaires ? (avec le tiret)", a: ["-Properties", "Properties"], ph: "-Xxxxx", exp: "-Properties Department,mail demande ces attributs en plus." },
    { type: "input", q: "Complète pour tout demander : Get-ADUser -Identity mdupont -Properties ___", a: ["*"], ph: "symbole", exp: "L'astérisque * demande TOUS les attributs remplis." },
    { type: "input", q: "Quelle cmdlet charge le module AD ? Écris la commande complète pour charger ActiveDirectory.", a: ["Import-Module ActiveDirectory", "import-module activedirectory"], ph: "Cmdlet Nom", exp: "Import-Module ActiveDirectory rend les cmdlets AD disponibles." },
    { type: "input", q: "Quel attribut contient le prénom d'un utilisateur (nom technique) ?", a: ["GivenName", "givenName"], ph: "attribut", exp: "GivenName stocke le prénom ; Surname stocke le nom de famille." },
    { type: "input", q: "Vers quelle cmdlet canalise-t-on (pipe) le résultat pour choisir les colonnes affichées ?", a: ["Select-Object", "select-object", "Select"], ph: "Verbe-Nom", exp: "Select-Object choisit les propriétés à afficher." },
    { type: "input", q: "Comment s'appelle le symbole barre verticale qui envoie le résultat d'une commande dans la suivante ?", a: ["pipe", "le pipe", "pipeline"], ph: "un mot", exp: "Le pipe relie deux cmdlets : cmdA | cmdB." },
    { type: "vf", q: "Le schéma est unique et partagé par toute la forêt Active Directory.", a: true, exp: "Il n'y a qu'un seul schéma pour toute la forêt." },
    { type: "vf", q: "On peut supprimer définitivement un attribut du schéma sans conséquence.", a: false, exp: "Modifier le schéma est irréversible : on ne supprime jamais vraiment un attribut." },
    { type: "vf", q: "Un attribut peut avoir un nom lisible dans Windows et un nom technique différent pour LDAP.", a: true, exp: "Ex : « Prénom » côté fenêtre, givenName côté LDAP/PowerShell." }
  ],
  final: {
    title: "Exercice final — Inspecter une fiche utilisateur",
    intro: `<p>Ton collègue te demande de vérifier le service et l'e-mail de l'utilisatrice <code>mdupont</code>, puis de comprendre pourquoi certains attributs n'apparaissent pas.</p>
<pre class="pseudo">Get-ADUser -Identity mdupont                       # n'affiche que les attributs de base
Get-ADUser -Identity mdupont -Properties Department,mail   # ajoute le service et l'e-mail</pre>`,
    questions: [
      { type: "qcm", q: "Pourquoi l'e-mail de mdupont n'apparaît pas avec Get-ADUser tout seul ?", opts: ["L'attribut mail n'existe pas", "Ce n'est pas un attribut de base : il faut le demander avec -Properties", "L'utilisatrice est désactivée", "Il faut redémarrer le serveur"], a: 1, exp: "Seuls quelques attributs sortent par défaut ; -Properties mail l'ajoute." },
      { type: "input", q: "Écris la commande qui affiche TOUS les attributs remplis de mdupont.", a: ["Get-ADUser -Identity mdupont -Properties *", "Get-ADUser mdupont -Properties *", "get-aduser -identity mdupont -properties *"], ph: "commande", exp: "-Properties * demande tous les attributs." },
      { type: "qcm", q: "Que fait le pipe dans <code>Get-ADUser mdupont -Properties Department | Select-Object Name,Department</code> ?", opts: ["Il supprime l'utilisateur", "Il envoie le résultat de Get-ADUser dans Select-Object pour ne garder que Name et Department", "Il crée un fichier", "Il redémarre AD"], a: 1, exp: "Le pipe enchaîne les cmdlets ; Select-Object filtre les colonnes." },
      { type: "vf", q: "GivenName et Surname sont deux attributs distincts (prénom et nom de famille).", a: true, exp: "GivenName = prénom, Surname = nom de famille." },
      { type: "qcm", q: "Quel terme désigne le catalogue de toutes les classes et attributs possibles ?", opts: ["Le domaine", "Le schéma", "La forêt", "L'unité d'organisation"], a: 1, exp: "Le schéma définit ce qui peut exister dans l'annuaire." }
    ],
    solution: `<p>Pour inspecter proprement une fiche, on demande explicitement les attributs voulus, puis on affiche seulement l'utile :</p>
<pre class="pseudo">Import-Module ActiveDirectory                                   # charge les cmdlets AD
Get-ADUser -Identity mdupont -Properties Department,mail |       # lit la fiche + le service + l'e-mail
    Select-Object Name,Department,mail                          # n'affiche que ces trois rubriques</pre>
<p>À retenir : les attributs de base sortent seuls, les autres se demandent avec <code>-Properties</code>, et <code>-Properties *</code> montre tout. Le schéma, lui, est le plan général : on le consulte mais on le modifie très rarement.</p>`
  }
};
</script>
