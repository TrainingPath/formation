<script>
var DAY = {
  num: 30,
  title: "Projet guidé : script d'onboarding complet",
  subtitle: "Assembler tout le cours en un seul script d'arrivée d'un employé.",
  theory: `
<h3>1. Qu'est-ce que l'onboarding ?</h3>
<p>L'<strong>onboarding</strong> (« intégration », l'arrivée d'un nouvel employé) demande toujours les mêmes gestes côté informatique : créer le compte AD, définir un mot de passe temporaire, ranger le compte dans la bonne unité d'organisation, l'ajouter à ses groupes, créer son dossier personnel… Fait à la main, c'est long et source d'oublis. Aujourd'hui, on rassemble tout ce qu'on a appris en <strong>un seul script réutilisable</strong>.</p>
<h3>2. Les étapes du script</h3>
<p>Notre script d'onboarding enchaînera, dans l'ordre logique :</p>
<pre class="pseudo">1. Recevoir les infos (prenom, nom, service) via des parametres   # jour 22
2. Fabriquer un identifiant de connexion (login)                  # ex : prenom.nom
3. Creer le compte utilisateur dans la bonne OU                    # jours 17-18
4. Definir un mot de passe temporaire a changer a la 1re connexion
5. Ajouter l'utilisateur a ses groupes                            # appartenances
6. Creer son dossier personnel sur le serveur de fichiers
7. Ecrire un compte-rendu dans un journal                         # jour 29</pre>
<h3>3. Préparer le mot de passe (objet sécurisé)</h3>
<p>Un mot de passe ne se manipule pas en texte clair : PowerShell veut un objet <strong>SecureString</strong> (« chaîne sécurisée », un texte protégé en mémoire). On le fabrique avec <code>ConvertTo-SecureString</code> :</p>
<pre class="pseudo">$motDePasse = ConvertTo-SecureString "Bienvenue2026!" -AsPlainText -Force
# ConvertTo-SecureString : transforme le texte en objet securise attendu par New-ADUser
# -AsPlainText -Force    : on part d'un texte en clair (acceptable pour un mot de passe TEMPORAIRE)</pre>
<h3>4. Le script complet et commenté</h3>
<p>Voici le script d'onboarding, sous forme de fonction paramétrée. Lis chaque ligne : elle réutilise une notion du cours.</p>
<pre class="pseudo">function New-Onboarding {                                   # fonction reutilisable d'integration (jour 22)
    param(                                                 # ses parametres
        [Parameter(Mandatory=$true)][string]$Prenom,       # prenom obligatoire
        [Parameter(Mandatory=$true)][string]$Nom,          # nom obligatoire
        [string]$Service = "Général"                       # service, valeur par defaut
    )

    Import-Module ActiveDirectory                          # charge les cmdlets AD (jour 17)

    $login = ($Prenom + "." + $Nom).ToLower()              # fabrique un login : prenom.nom en minuscules
    $ou    = "OU=Employes,DC=exemple,DC=local"             # OU cible ou ranger le compte

    $motDePasse = ConvertTo-SecureString "Bienvenue2026!" -AsPlainText -Force   # mot de passe temporaire securise

    New-ADUser -Name ($Prenom + " " + $Nom) -GivenName $Prenom -Surname $Nom -SamAccountName $login -UserPrincipalName ($login + "@exemple.local") -Department $Service -Path $ou -AccountPassword $motDePasse -ChangePasswordAtLogon $true -Enabled $true
    # 3+4. cree le compte : prenom/nom, login, service, dans la bonne OU, mot de passe temporaire a changer, compte actif

    Add-ADGroupMember -Identity "Tous-Employes" -Members $login     # 5. groupe commun a tous
    Add-ADGroupMember -Identity ("Grp-" + $Service) -Members $login # 5. groupe du service (ex : Grp-Ventes)

    $dossier = "\\SRV-FICHIERS\Perso$\" + $login           # 6. chemin du dossier personnel sur le serveur
    New-Item -Path $dossier -ItemType Directory -Force     # cree le dossier personnel

    "$(Get-Date) - Onboarding OK : $login ($Service)" | Out-File "C:\Logs\onboarding.log" -Append   # 7. journal (jour 29)

    Write-Host ("Compte cree : " + $login + " dans " + $Service)   # message de confirmation a l'ecran
}                                                          # fin de la fonction

New-Onboarding -Prenom "Marie" -Nom "Dupont" -Service "Ventes"   # appel : integre Marie Dupont au service Ventes</pre>
<div class="tip">Ici, la longue commande <code>New-ADUser</code> est écrite sur une seule ligne pour éviter les pièges de mise en forme. Dans un vrai script, on peut la couper avec l'accent grave en fin de ligne pour la rendre plus lisible.</div>
<h3>5. Pourquoi ce script est robuste</h3>
<p>Les paramètres <strong>Mandatory</strong> empêchent d'oublier le prénom ou le nom (jour 22). Le mot de passe est <strong>temporaire</strong> et doit être changé dès la première connexion (<code>-ChangePasswordAtLogon $true</code>). Le journal garde une trace de chaque création (jour 29). Et comme tout est écrit, la 100e intégration se fait exactement comme la première.</p>
<div class="warn">En vrai, on ne met jamais un mot de passe en clair dans un script partagé : on le génère aléatoirement ou on le demande à l'exécution. Ici, il est écrit pour l'exemple pédagogique, et il est temporaire.</div>
<h3>6. Aller plus loin</h3>
<p>On pourrait enrichir le script : lire une liste d'employés depuis un CSV (import en masse), envoyer un e-mail de bienvenue, gérer les erreurs avec <code>try/catch</code> (essayer/rattraper), ou vérifier d'abord que le login n'existe pas déjà. Chaque brique du cours (rapports, GPO, sécurité) peut se greffer ici. C'est ainsi qu'un administrateur bâtit, petit à petit, sa boîte à outils d'automatisation.</p>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce que l'<strong>onboarding</strong> ?", opts: ["La suppression d'un compte", "L'intégration d'un nouvel employé (création du compte, groupes, dossier…)", "La sauvegarde d'AD", "La réplication"], a: 1, exp: "C'est l'ensemble des gestes d'arrivée d'un employé." },
    { type: "qcm", q: "Pourquoi automatiser l'onboarding dans un script ?", opts: ["Pour exécuter les étapes dans un ordre aléatoire", "Pour faire chaque fois exactement les mêmes gestes, sans oubli", "Pour supprimer AD", "Pour créer une forêt"], a: 1, exp: "La répétabilité évite les erreurs et les oublis." },
    { type: "qcm", q: "Pourquoi convertir le mot de passe en <strong>SecureString</strong> ?", opts: ["Pour l'afficher", "Car New-ADUser attend un objet mot de passe sécurisé, pas du texte clair", "Pour le supprimer", "Pour le trier"], a: 1, exp: "AccountPassword exige un SecureString." },
    { type: "qcm", q: "Que fait <code>-ChangePasswordAtLogon $true</code> ?", opts: ["Bloque le compte", "Oblige l'utilisateur à changer son mot de passe à la première connexion", "Supprime le mot de passe", "Crée un groupe"], a: 1, exp: "Le mot de passe temporaire doit être remplacé dès la 1re connexion." },
    { type: "qcm", q: "Quel paramètre de New-ADUser range le compte dans la bonne OU ?", opts: ["-Department", "-Path", "-Enabled", "-Surname"], a: 1, exp: "-Path reçoit le DN de l'OU cible." },
    { type: "qcm", q: "Pourquoi mettre Prenom et Nom en Mandatory ?", opts: ["Pour l'affichage à l'écran", "Pour ne jamais créer un compte sans ces informations essentielles", "Pour convertir leur valeur en nombre entier", "Pour leur donner une valeur par défaut"], a: 1, exp: "Mandatory force la présence des données indispensables." },
    { type: "input", q: "Quelle cmdlet CRÉE le compte utilisateur ? (Verbe-Nom)", a: ["New-ADUser", "new-aduser"], ph: "Verbe-ADUser", exp: "New-ADUser crée l'utilisateur avec tous ses attributs." },
    { type: "input", q: "Quelle cmdlet AJOUTE l'utilisateur à un groupe ? (Verbe-Nom)", a: ["Add-ADGroupMember", "add-adgroupmember"], ph: "Verbe-ADGroupMember", exp: "Add-ADGroupMember -Identity groupe -Members login." },
    { type: "input", q: "Quelle cmdlet transforme un texte en mot de passe sécurisé ? (Verbe-Nom)", a: ["ConvertTo-SecureString", "convertto-securestring"], ph: "Verbe-SecureString", exp: "ConvertTo-SecureString ... -AsPlainText -Force." },
    { type: "input", q: "Quelle cmdlet CRÉE le dossier personnel sur le serveur ? (Verbe-Nom)", a: ["New-Item", "new-item"], ph: "Verbe-Item", exp: "New-Item -ItemType Directory crée le dossier." },
    { type: "input", q: "Quel paramètre de New-ADUser reçoit le mot de passe sécurisé ? (avec le tiret)", a: ["-AccountPassword", "AccountPassword"], ph: "-Xxxx", exp: "-AccountPassword attend un SecureString." },
    { type: "input", q: "Quelle cmdlet écrit l'horodatage dans le journal d'onboarding ? (Verbe-Nom)", a: ["Get-Date", "get-date"], ph: "Verbe-Date", exp: "Get-Date fournit la date/heure de chaque ligne de log." },
    { type: "vf", q: "Un script d'onboarding garantit que chaque nouvel employé est traité de la même façon.", a: true, exp: "C'est tout l'intérêt de la répétabilité." },
    { type: "vf", q: "Mettre un mot de passe en clair dans un script partagé est une bonne pratique.", a: false, exp: "Jamais : on le génère ou on le demande à l'exécution." },
    { type: "vf", q: "Le journal (log) permet de savoir a posteriori quels comptes ont été créés.", a: true, exp: "La trace écrite est essentielle pour le suivi." }
  ],
  final: {
    title: "Exercice final — Comprendre le script d'onboarding",
    intro: `<p>On reprend le script d'intégration. Réponds en te basant sur l'ordre logique des étapes et le rôle de chaque cmdlet.</p>
<pre class="pseudo">New-ADUser ...              # cree le compte dans l'OU, avec mot de passe temporaire
Add-ADGroupMember ...       # ajoute l'utilisateur a ses groupes
New-Item ...               # cree le dossier personnel
Out-File ... -Append       # journalise l'operation</pre>`,
    questions: [
      { type: "qcm", q: "Dans quel ordre logique se déroulent les étapes ?", opts: ["Dossier, puis compte, puis groupes", "Compte, puis groupes, puis dossier, puis journal", "Journal d'abord", "Groupes avant le compte"], a: 1, exp: "On crée le compte, on l'ajoute aux groupes, on crée son dossier, on journalise." },
      { type: "input", q: "Quelle cmdlet crée le compte utilisateur ? (Verbe-Nom)", a: ["New-ADUser", "new-aduser"], ph: "Verbe-ADUser", exp: "New-ADUser." },
      { type: "qcm", q: "Pourquoi -ChangePasswordAtLogon $true est-il important ?", opts: ["Il désactive le compte", "L'employé choisit lui-même un mot de passe que l'admin ne connaît pas", "Il supprime le compte", "Il crée une GPO"], a: 1, exp: "Le mot de passe temporaire est remplacé par l'utilisateur." },
      { type: "input", q: "Quelle cmdlet ajoute l'utilisateur au groupe de son service ? (Verbe-Nom)", a: ["Add-ADGroupMember", "add-adgroupmember"], ph: "Verbe-ADGroupMember", exp: "Add-ADGroupMember." },
      { type: "qcm", q: "Que garantit l'écriture dans le fichier journal onboarding.log ?", opts: ["Rien", "Une trace de chaque intégration, consultable plus tard", "La suppression du compte", "Une réplication"], a: 1, exp: "Le journal assure le suivi des créations." }
    ],
    solution: `<p>Le script, résumé dans son ordre logique, réutilise tout le cours :</p>
<pre class="pseudo">function New-Onboarding {                                        # fonction parametree (jour 22)
    param([Parameter(Mandatory=$true)][string]$Prenom,          # infos obligatoires
          [Parameter(Mandatory=$true)][string]$Nom,
          [string]$Service = "Général")                         # valeur par defaut
    Import-Module ActiveDirectory                               # cmdlets AD (jour 17)
    $login = ($Prenom + "." + $Nom).ToLower()                   # fabrique le login
    $mdp   = ConvertTo-SecureString "Bienvenue2026!" -AsPlainText -Force   # mot de passe temporaire securise
    New-ADUser -Name ($Prenom+" "+$Nom) -SamAccountName $login -Department $Service -Path "OU=Employes,DC=exemple,DC=local" -AccountPassword $mdp -ChangePasswordAtLogon $true -Enabled $true   # cree le compte
    Add-ADGroupMember -Identity ("Grp-"+$Service) -Members $login   # ajoute au groupe du service
    New-Item -Path ("\\SRV-FICHIERS\Perso$\"+$login) -ItemType Directory -Force   # dossier personnel
    "$(Get-Date) - Onboarding OK : $login" | Out-File "C:\Logs\onboarding.log" -Append   # journalise
}
New-Onboarding -Prenom "Marie" -Nom "Dupont" -Service "Ventes"  # integre Marie Dupont</pre>
<p>Un seul appel intègre entièrement un employé : compte, mot de passe, groupes, dossier, journal. C'est l'aboutissement du cours : chaque brique apprise s'assemble en un outil concret et fiable.</p>`
  }
};
</script>
