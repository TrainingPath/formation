<script>
var DAY = {
  num: 6,
  title: "Le protocole EIGRP",
  subtitle: "Métrique composite, DUAL, successor et feasible successor.",
  theory: `
<h3>1. EIGRP, un vecteur de distance « avancé »</h3>
<p>EIGRP (« Enhanced Interior Gateway Routing Protocol ») est le protocole de routage propriétaire Cisco (désormais ouvert). Il est souvent qualifié d'<strong>hybride</strong>, mais reste fondamentalement un protocole à <strong>vecteur de distance</strong> : chaque routeur apprend les réseaux de ses voisins, sans carte globale comme OSPF. Sa force vient de son algorithme de calcul, <strong>DUAL</strong>, qui garantit des chemins <strong>sans boucle</strong> et une <strong>reconvergence quasi instantanée</strong> grâce à des chemins de secours pré-calculés.</p>
<p>EIGRP maintient trois tables : la table de <strong>voisins</strong> (neighbors, via les Hello), la table de <strong>topologie</strong> (toutes les routes apprises) et la table de <strong>routage</strong> (les meilleures, installées). L'AD (distance administrative) d'EIGRP interne est <strong>90</strong>.</p>
<h3>2. La métrique composite</h3>
<p>Contrairement à OSPF (coût basé sur la bande passante) ou RIP (nombre de sauts), EIGRP calcule une <strong>métrique composite</strong> à partir de plusieurs facteurs, pondérés par des coefficients K :</p>
<pre class="pseudo"># Facteurs de la métrique EIGRP
Bandwidth (bande passante)  -> K1  [utilisé par défaut]
Load (charge)               -> K2  [désactivé par défaut]
Delay (délai)               -> K3  [utilisé par défaut]
Reliability (fiabilité)     -> K4/K5 [désactivés par défaut]
# Valeurs par défaut : K1=1, K2=0, K3=1, K4=0, K5=0
# => par défaut, la métrique dépend de BANDWIDTH et DELAY.</pre>
<div class="warn">Les valeurs K doivent être IDENTIQUES entre voisins, sinon l'adjacence ne se forme pas. Par défaut, seuls bande passante et délai comptent ; activer la charge ou la fiabilité rend la métrique instable car ces valeurs varient sans cesse. On les laisse donc généralement à zéro.</div>
<h3>3. DUAL, successor et feasible successor</h3>
<p>Le cœur d'EIGRP est l'algorithme <strong>DUAL</strong> (« Diffusing Update Algorithm »). Il repose sur deux distances calculées pour chaque destination :</p>
<pre class="pseudo"># Deux distances clés
FD (Feasible Distance)   -> MA métrique totale pour atteindre la destination
RD/AD (Reported Distance)-> la métrique annoncée par le VOISIN (sa distance à lui)</pre>
<p>À partir de là, DUAL désigne :</p>
<pre class="pseudo"># Rôles des routes
SUCCESSOR          -> le meilleur chemin (FD la plus basse) ; installé dans la table de routage
FEASIBLE SUCCESSOR -> un chemin de SECOURS valide, prêt à prendre le relais sans recalcul
# Condition de faisabilité (Feasibility Condition) :
#   un voisin est feasible successor SI  RD_voisin &lt; FD_actuelle
#   (sa distance annoncée est STRICTEMENT inférieure à ma meilleure distance)</pre>
<p>La <strong>condition de faisabilité</strong> garantit l'absence de boucle : si la distance annoncée par le voisin est inférieure à ma propre meilleure distance, ce voisin est forcément plus proche de la destination que moi, donc l'utiliser ne créera pas de boucle. Le feasible successor est stocké prêt à l'emploi : si le successor tombe, EIGRP bascule <strong>instantanément</strong> sans recalcul.</p>
<div class="tip">Analogie : le successor est ton itinéraire principal vers le travail ; le feasible successor est un itinéraire alternatif déjà validé (tu sais qu'il ne te ramène pas en arrière). S'il y a un accident, tu bascules sans réfléchir. S'il n'existe aucun feasible successor, EIGRP doit « demander sa route » aux voisins (état ACTIVE, requêtes) : c'est plus lent.</div>
<h3>4. Le processus de requête (état ACTIVE)</h3>
<p>Quand un successor tombe et qu'aucun feasible successor n'existe, la route passe à l'état <strong>ACTIVE</strong> : le routeur envoie des <strong>requêtes (Query)</strong> à ses voisins pour trouver un nouveau chemin, et attend leurs <strong>réponses (Reply)</strong>. Tant que la route est stable avec un successor, elle est à l'état <strong>PASSIVE</strong> (état normal). Un blocage prolongé en ACTIVE donne l'erreur <em>Stuck In Active</em> (SIA).</p>
<pre class="pseudo"># Configuration IOS (EIGRP nommé)
router eigrp MONAS
 address-family ipv4 autonomous-system 100
  network 10.0.0.0 0.0.0.255
# Vérifs utiles :
# show ip eigrp neighbors      -> voisins
# show ip eigrp topology       -> FD, RD, successors/feasible successors</pre>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># EIGRP : vecteur de distance avancé, AD interne = 90, algo = DUAL
# Métrique composite : par défaut BANDWIDTH + DELAY (K1=1,K3=1, autres=0)
# FD = ma distance ; RD = distance annoncée par le voisin
# Successor = meilleur chemin ; Feasible Successor = secours pré-validé
# Condition de faisabilité : RD_voisin &lt; FD_actuelle  (=> pas de boucle)
# Pas de FS -> route ACTIVE (Query/Reply) ; sinon PASSIVE.</pre>`,
  exercises: [
    { type: "qcm", q: "À quelle famille EIGRP appartient-il fondamentalement ?", opts: ["État de liens", "Vecteur de distance (avancé)", "Vecteur de chemin", "Statique"], a: 1, exp: "EIGRP est un vecteur de distance avancé (souvent dit hybride), pas un état de liens." },
    { type: "input", q: "Quelle est la distance administrative (AD) d'EIGRP interne ?", a: ["90"], ph: "un nombre", exp: "L'AD d'EIGRP interne est 90." },
    { type: "input", q: "Comment s'appelle l'algorithme de calcul d'EIGRP ?", a: ["dual", "diffusing update algorithm"], ph: "un sigle", exp: "DUAL = Diffusing Update Algorithm." },
    { type: "qcm", q: "Par défaut, la métrique composite d'EIGRP repose sur…", opts: ["Le nombre de sauts", "Bande passante et délai", "La charge et la fiabilité", "Le coût OSPF"], a: 1, exp: "Par défaut K1=1 et K3=1 : seuls bande passante (bandwidth) et délai (delay) comptent." },
    { type: "vf", q: "Les valeurs des coefficients K doivent être identiques entre deux voisins EIGRP pour former une adjacence.", a: true, exp: "Oui : des K différents empêchent l'adjacence." },
    { type: "qcm", q: "Que désigne la Feasible Distance (FD) ?", opts: ["La distance annoncée par le voisin", "Ma propre métrique totale vers la destination", "Le nombre de sauts", "La bande passante brute"], a: 1, exp: "La FD est MA métrique totale pour atteindre la destination." },
    { type: "qcm", q: "Que désigne la Reported Distance (RD) ?", opts: ["Ma métrique totale", "La métrique annoncée par le voisin (sa distance à lui)", "Le délai local", "La charge du lien"], a: 1, exp: "La RD est la distance annoncée par le voisin vers la destination." },
    { type: "input", q: "Comment appelle-t-on le meilleur chemin (FD la plus basse) installé dans la table de routage ?", a: ["successor", "le successor"], ph: "un terme", exp: "Le successor est le meilleur chemin, installé dans la table de routage." },
    { type: "qcm", q: "Un feasible successor est…", opts: ["Le meilleur chemin actif", "Un chemin de secours pré-validé, prêt sans recalcul", "Une route externe", "Un voisin injoignable"], a: 1, exp: "Le feasible successor est un chemin de secours valide, prêt à prendre le relais." },
    { type: "qcm", q: "Quelle est la condition de faisabilité (Feasibility Condition) ?", opts: ["RD_voisin &lt; FD_actuelle", "FD_actuelle &lt; RD_voisin", "RD_voisin = FD_actuelle", "Le voisin doit être un ABR"], a: 0, exp: "Un voisin est feasible successor si sa RD est strictement inférieure à la FD actuelle." },
    { type: "vf", q: "La condition de faisabilité garantit que le chemin de secours ne crée pas de boucle.", a: true, exp: "Oui : si le voisin est plus proche que moi, l'utiliser ne peut pas boucler." },
    { type: "qcm", q: "Quand un successor tombe et qu'il existe un feasible successor, que se passe-t-il ?", opts: ["Recalcul global", "Bascule instantanée vers le feasible successor", "Passage en Stuck In Active", "Perte de la route"], a: 1, exp: "EIGRP bascule instantanément sur le feasible successor, sans recalcul." },
    { type: "qcm", q: "Dans quel état passe une route sans feasible successor lorsque le successor tombe ?", opts: ["PASSIVE", "ACTIVE (Query/Reply)", "STUB", "DOWN définitif"], a: 1, exp: "Sans FS, la route passe à ACTIVE : envoi de Query, attente de Reply." },
    { type: "input", q: "Comment nomme-t-on l'erreur d'une route bloquée trop longtemps en état ACTIVE ?", a: ["stuck in active", "sia", "stuck-in-active"], ph: "terme ou sigle", exp: "Stuck In Active (SIA) : la route reste bloquée en ACTIVE." },
    { type: "qcm", q: "Quelle commande affiche FD, RD et les successors/feasible successors ?", opts: ["show ip route", "show ip eigrp neighbors", "show ip eigrp topology", "show running-config"], a: 2, exp: "show ip eigrp topology détaille FD, RD et les rôles des routes." }
  ],
  final: {
    title: "Exercice final — Successor ou pas ?",
    intro: `<p>Un routeur atteint le réseau 10.1.1.0/24 avec une Feasible Distance (FD) de 3000. Deux voisins alternatifs annoncent ce réseau : le voisin A avec une Reported Distance (RD) de 2500, le voisin B avec une RD de 3200. Analyse.</p>`,
    questions: [
      { type: "qcm", q: "Le voisin A (RD 2500) satisfait-il la condition de faisabilité (FD = 3000) ?", opts: ["Oui : 2500 &lt; 3000", "Non : 2500 > 3000", "Seulement si K5=1", "Impossible à dire"], a: 0, exp: "2500 &lt; 3000 : A est un feasible successor valide." },
      { type: "qcm", q: "Le voisin B (RD 3200) est-il un feasible successor ?", opts: ["Oui", "Non : 3200 n'est pas &lt; 3000", "Oui car il est plus rapide", "Oui car RD > FD"], a: 1, exp: "3200 n'est pas strictement inférieur à 3000 : B n'est PAS feasible successor." },
      { type: "input", q: "Quel voisin (A ou B) sera stocké comme chemin de secours pré-validé ?", a: ["a", "le voisin a", "voisin a"], ph: "A ou B", exp: "Le voisin A satisfait la condition, il devient feasible successor." },
      { type: "vf", q: "Si le successor tombe, EIGRP peut basculer instantanément sur A sans recalcul.", a: true, exp: "Oui : A étant feasible successor, la bascule est immédiate." },
      { type: "qcm", q: "Si A n'existait pas et que seul B restait, que ferait EIGRP à la chute du successor ?", opts: ["Basculer sur B directement", "Passer la route à l'état ACTIVE et envoyer des Query", "Supprimer EIGRP", "Utiliser OSPF"], a: 1, exp: "Sans feasible successor valide, la route passe ACTIVE et EIGRP interroge ses voisins." }
    ],
    solution: `<pre class="pseudo"># Analyse (FD actuelle = 3000)
Voisin A : RD 2500  ->  2500 &lt; 3000  => FEASIBLE SUCCESSOR (secours prêt)
Voisin B : RD 3200  ->  3200 !&lt; 3000 => NON feasible (risque de boucle)
Chute du successor :
  - avec A -> bascule instantanée (pas de recalcul)
  - sans FS -> route ACTIVE, envoi de Query, attente de Reply
# Condition de faisabilité : RD_voisin &lt; FD_actuelle</pre>
<p>Tu maîtrises la logique DUAL d'EIGRP. Demain : BGP, le protocole qui relie les systèmes autonomes d'Internet.</p>`
  }
};
</script>
