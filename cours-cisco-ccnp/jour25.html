  theory: `
<h3>1. Pourquoi automatiser le réseau ?</h3>
<p>Configurer un routeur à la main, en Telnet ou SSH, c'est faisable pour trois équipements. Mais dès qu'un opérateur gère des <strong>centaines de commutateurs</strong>, la saisie manuelle devient lente, fatigante et surtout <strong>source d'erreurs</strong>. Une virgule oubliée, une VLAN mal numérotée, et c'est la panne. L'automatisation (<em>network automation</em>) consiste à écrire un programme qui se connecte aux équipements, envoie les commandes et vérifie le résultat, de façon <strong>reproductible</strong> et sans faute de frappe.</p>
<p>Python est devenu le langage roi du réseau : lisible, gratuit, doté d'un immense écosystème de bibliothèques (<em>libraries</em>) spécialisées. Cisco l'a placé au cœur de sa certification <strong>DevNet</strong> et de l'axe automatisation du CCNP.</p>
<h3>2. Paramiko : SSH bas niveau</h3>
<p><strong>Paramiko</strong> est une bibliothèque Python qui implémente le protocole <strong>SSHv2</strong>. Elle ouvre une session chiffrée vers un équipement et permet d'envoyer des commandes. C'est puissant mais « brut » : c'est à toi de gérer l'invite (<em>prompt</em>), les délais, la pagination du <code>--More--</code>. On dit que Paramiko est <strong>bas niveau</strong> : il connaît SSH, mais rien du dialecte Cisco IOS.</p>
<pre class="pseudo"># Paramiko : ouvrir une session SSH brute (extrait)
import paramiko
client = paramiko.SSHClient()
client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
client.connect("192.168.1.1", username="admin", password="cisco")
stdin, stdout, stderr = client.exec_command("show ip int brief")
print(stdout.read().decode())
client.close()</pre>
<h3>3. Netmiko : SSH pensé pour le réseau</h3>
<p><strong>Netmiko</strong> est bâti <em>par-dessus</em> Paramiko, mais il connaît les équipements réseau. Il gère automatiquement l'invite, désactive la pagination, sait passer en mode enable et en mode configuration. Tu lui indiques le <strong>type d'appareil</strong> (<code>device_type</code>, par exemple <code>cisco_ios</code>) et il adapte son comportement. C'est l'outil favori pour scripter de la configuration Cisco.</p>
<pre class="pseudo"># Netmiko : envoyer des commandes de configuration
from netmiko import ConnectHandler
r1 = {
  "device_type": "cisco_ios",
  "host": "192.168.1.1",
  "username": "admin",
  "password": "cisco",
}
conn = ConnectHandler(**r1)
print(conn.send_command("show ip interface brief"))
conn.send_config_set(["interface Lo0", "ip address 10.0.0.1 255.255.255.255"])
conn.disconnect()</pre>
<div class="tip"><code>send_command()</code> sert à LIRE (commandes show). <code>send_config_set([...])</code> entre en mode configuration, envoie chaque ligne de la liste, puis ressort tout seul. Netmiko fait aussi le <code>terminal length 0</code> à ta place.</div>
<h3>4. Scripts de configuration et bonnes pratiques</h3>
<p>Un bon script réseau ne code pas les mots de passe en dur : on les lit depuis un fichier ou une variable d'environnement. On boucle sur une <strong>liste d'équipements</strong> (souvent décrite dans un fichier de données), on capture les résultats, et on <strong>vérifie</strong> ce qu'on a fait (<em>show</em> après <em>config</em>). On évite d'écrire un chemin Windows avec un seul antislash dans une chaîne Python : il faut le doubler, par exemple \\\\serveur\\\\partage, ou utiliser une chaîne brute.</p>
<div class="warn">Un script qui pousse une mauvaise config sur 200 équipements casse 200 équipements en quelques secondes. Teste TOUJOURS sur un seul appareil de laboratoire avant un déploiement de masse, et prévois un plan de retour arrière (<em>rollback</em>).</div>
<h3>5. Autres bibliothèques utiles</h3>
<p><strong>Napalm</strong> (Network Automation and Programmability Abstraction Layer with Multivendor support) offre une interface unique pour plusieurs constructeurs. <strong>Nornir</strong> est un cadre d'exécution parallèle en pur Python. <strong>Requests</strong> sert à parler aux API REST (voir jour 26). <strong>ncclient</strong> parle NETCONF. Ensemble, ces briques forment la boîte à outils de l'ingénieur réseau moderne.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Paramiko  = SSH bas niveau (tu geres tout toi-meme)
# Netmiko   = SSH oriente reseau (gere prompt, enable, config)
#   send_command()     -> lire un show
#   send_config_set([])-> pousser de la configuration
# device_type = "cisco_ios" (ou cisco_xe, cisco_nxos, ...)
# Regle d'or : tester sur 1 equipement avant les 200
# Autres : Napalm (multivendor), Nornir, ncclient, requests</pre>`,

    { type: "input", q: "Dans un chemin Windows écrit dans une chaîne Python normale, comment doit-on écrire l'antislash pour qu'il soit littéral ? (le caractère répété)", a: ["\\\\", "double antislash", "deux antislash"], ph: "un antislash devient ?", exp: "On double l'antislash car il sert de caractère d'échappement dans les chaînes Python." },
    { type: "qcm", q: "Quelle méthode Netmiko utilise-t-on pour LIRE le résultat d'un show ?", opts: ["send_config_set()", "send_command()", "disconnect()", "enable()"], a: 1, exp: "send_command() exécute une commande d'affichage et retourne sa sortie." },
    { type: "input", q: "Quel cadre Python d'exécution parallèle en pur Python complète Netmiko pour piloter des flottes ? (un mot)", a: ["nornir"], ph: "commence par N", exp: "Nornir est un framework d'automatisation parallèle en Python pur." }
  ],

      { type: "qcm", q: "Après avoir récupéré chaque config, que fait un bon script ?", opts: ["Rien de plus", "Fermer proprement la session (disconnect) et archiver le résultat", "Redémarrer le routeur", "Effacer la config"], a: 1, exp: "On ferme la connexion et on sauvegarde le texte récupéré dans un fichier daté." }
    ],
    solution: `<pre class="pseudo"># Squelette de script de sauvegarde (Netmiko)
from netmiko import ConnectHandler
equipements = [
  {"device_type":"cisco_ios","host":"192.168.1.1","username":"admin","password":"..."},
  {"device_type":"cisco_ios","host":"192.168.1.2","username":"admin","password":"..."},
  {"device_type":"cisco_ios","host":"192.168.1.3","username":"admin","password":"..."},
]
for eq in equipements:
    conn = ConnectHandler(**eq)
    running = conn.send_command("show running-config")
    # ... ecrire 'running' dans un fichier date par host ...
    conn.disconnect()</pre>
<p>Une boucle, Netmiko, un <code>show running-config</code> et une écriture fichier : la sauvegarde de toute une flotte tient en quelques lignes. Demain, on parle des API REST et de NETCONF/RESTCONF.</p>`
