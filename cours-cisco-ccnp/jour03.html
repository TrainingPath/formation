<script>
var DAY = {
  num: 3,
  title: "Architecture des réseaux d'entreprise",
  subtitle: "Campus hiérarchique, spine-leaf, WAN et cloud : le squelette d'ENCOR.",
  theory: `
<h3>1. Pourquoi une architecture, et pas juste des câbles ?</h3>
<p>Un réseau d'entreprise n'est pas un tas d'équipements reliés au hasard : c'est une <strong>architecture</strong>, c'est-à-dire un plan qui organise le trafic pour qu'il soit rapide, prévisible et facile à dépanner. Cisco structure ce plan en <strong>modèles de référence</strong>. Les connaître, c'est parler la langue d'ENCOR et savoir où placer chaque fonction.</p>
<h3>2. Le modèle hiérarchique à trois couches (campus)</h3>
<p>Le réseau de campus (les bâtiments d'un site) suit le <strong>modèle à trois couches</strong> : <strong>accès</strong>, <strong>distribution</strong> et <strong>coeur</strong> (« access / distribution / core »). Chaque couche a un rôle net :</p>
<pre class="pseudo"># Modèle hiérarchique Cisco (campus)
ACCESS       -> connecte les terminaux (PC, téléphones, bornes) ; PoE, VLAN
DISTRIBUTION -> agrège les accès ; routage inter-VLAN, politiques, filtrage
CORE         -> épine dorsale ; commutation ultra-rapide entre distributions</pre>
<p>La couche d'accès branche les utilisateurs. La couche de distribution regroupe plusieurs commutateurs d'accès et applique l'intelligence (routage, ACL, QoS). La couche de coeur ne fait qu'une chose, mais très vite : transporter d'un bloc à l'autre. On rencontre aussi le modèle <strong>collapsed core</strong> (« coeur réduit ») où distribution et coeur fusionnent sur les petits sites.</p>
<div class="tip">Analogie routière : l'accès, ce sont les rues d'un quartier ; la distribution, les boulevards qui relient les quartiers ; le coeur, l'autoroute qui traverse la ville sans feux rouges. On ne met pas de feux (politiques) sur l'autoroute : le coeur reste simple et rapide.</div>
<h3>3. L'architecture spine-leaf (datacenter)</h3>
<p>Dans les datacenters, le trafic « est-ouest » (de serveur à serveur) explose. Le modèle hiérarchique classique, pensé pour le trafic « nord-sud » (client vers serveur), devient un goulot. On lui préfère l'architecture <strong>spine-leaf</strong> (« épine-feuille »).</p>
<pre class="pseudo"># Topologie spine-leaf
[SPINE]---[SPINE]     couche épine : commutateurs de coeur
   | \   / |          maillage complet
   |  \ /  |
 [LEAF] [LEAF] [LEAF]  couche feuille : connecte les serveurs
# Règle : chaque leaf est relié à CHAQUE spine (jamais leaf-leaf ni spine-spine)</pre>
<p>Résultat : n'importe quel serveur atteint n'importe quel autre en <strong>un nombre de sauts constant</strong> (leaf → spine → leaf), donc une latence prévisible. Pour ajouter de la capacité, on rajoute des spines ; pour ajouter des ports, on rajoute des leaves. C'est une topologie <strong>non bloquante</strong> et horizontalement extensible.</p>
<h3>4. Le WAN : relier les sites</h3>
<p>Le <strong>WAN</strong> (« Wide Area Network », réseau étendu) relie des sites géographiquement séparés : siège, agences, datacenters. Technologies classiques : liens loués, <strong>MPLS</strong>, Internet, et de plus en plus le <strong>SD-WAN</strong> (WAN piloté par logiciel) qui superpose une couche de politique et de sécurité sur des liens variés (fibre, 4G/5G, Internet), avec un contrôle centralisé.</p>
<h3>5. Le cloud et le modèle des services</h3>
<p>L'entreprise moderne étend son réseau vers le <strong>cloud</strong>. On distingue les modèles de service : <strong>IaaS</strong> (on loue l'infrastructure : VM, réseau, stockage), <strong>PaaS</strong> (on loue une plateforme de développement) et <strong>SaaS</strong> (on consomme un logiciel prêt, comme une messagerie). Côté déploiement : cloud <strong>public</strong>, <strong>privé</strong>, <strong>hybride</strong> (mélange) ou <strong>multicloud</strong>. Le rôle du réseau devient alors de connecter proprement et en sécurité le campus, le WAN et ces ressources cloud.</p>
<div class="warn">Ne plaque pas le modèle spine-leaf sur un petit campus, ni le modèle trois couches sur un datacenter à fort trafic est-ouest. Chaque architecture répond à un profil de trafic : hiérarchique pour le campus (nord-sud), spine-leaf pour le datacenter (est-ouest).</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># CAMPUS  : hiérarchique = Access / Distribution / Core (+ collapsed core)
# DC      : spine-leaf = latence constante, non bloquant, extensible
# WAN     : relie les sites (MPLS, Internet, SD-WAN)
# CLOUD   : IaaS / PaaS / SaaS ; public / privé / hybride / multicloud
# Règle d'or : l'architecture suit le PROFIL DE TRAFIC
#   nord-sud -> hiérarchique   |   est-ouest -> spine-leaf</pre>`,
  exercises: [
    { type: "qcm", q: "Quelles sont les trois couches du modèle hiérarchique de campus ?", opts: ["Accès, transport, session", "Accès, distribution, coeur", "Physique, liaison, réseau", "Spine, leaf, core"], a: 1, exp: "Access, Distribution, Core : le modèle hiérarchique classique de Cisco." },
    { type: "qcm", q: "Quel est le rôle principal de la couche de coeur (core) ?", opts: ["Appliquer les ACL et le routage inter-VLAN", "Connecter les terminaux", "Commuter très vite entre les blocs de distribution", "Distribuer le PoE"], a: 2, exp: "Le coeur transporte vite d'un bloc à l'autre ; on y évite les politiques lourdes." },
    { type: "input", q: "Comment nomme-t-on le modèle où les couches distribution et coeur fusionnent (petits sites) ?", a: ["collapsed core", "coeur réduit", "collapsed", "coeur reduit"], ph: "deux mots", exp: "Le collapsed core (coeur réduit) fusionne distribution et coeur." },
    { type: "qcm", q: "Dans une topologie spine-leaf, à quoi chaque leaf est-il connecté ?", opts: ["Aux autres leaves", "À chaque spine", "Uniquement à un spine", "Aux terminaux du campus"], a: 1, exp: "Chaque leaf est relié à CHAQUE spine ; jamais leaf-leaf ni spine-spine." },
    { type: "vf", q: "Dans une architecture spine-leaf, deux serveurs communiquent avec un nombre de sauts constant.", a: true, exp: "Oui : leaf -> spine -> leaf, donc une latence prévisible et constante." },
    { type: "qcm", q: "Quel type de trafic domine dans un datacenter moderne et motive le spine-leaf ?", opts: ["Nord-sud (client-serveur)", "Est-ouest (serveur-serveur)", "Broadcast uniquement", "Trafic de gestion"], a: 1, exp: "Le trafic est-ouest (serveur à serveur) explose et rend le modèle hiérarchique inadapté." },
    { type: "input", q: "Quel sigle désigne le réseau qui relie des sites géographiquement distants ?", a: ["wan"], ph: "3 lettres", exp: "WAN = Wide Area Network." },
    { type: "qcm", q: "Le SD-WAN se caractérise par…", opts: ["Un câblage en fibre uniquement", "Un pilotage logiciel centralisé sur des liens variés", "L'absence de sécurité", "Un usage réservé au datacenter"], a: 1, exp: "Le SD-WAN superpose une couche de politique/sécurité pilotée par logiciel sur des liens hétérogènes." },
    { type: "qcm", q: "Dans le modèle cloud, que loue-t-on avec l'IaaS ?", opts: ["Un logiciel prêt à l'emploi", "Une plateforme de développement", "L'infrastructure (VM, réseau, stockage)", "Le code source des applications"], a: 2, exp: "IaaS = Infrastructure as a Service : on loue VM, réseau et stockage." },
    { type: "vf", q: "Une messagerie en ligne prête à l'emploi relève du modèle SaaS.", a: true, exp: "SaaS = Software as a Service : on consomme un logiciel fini." },
    { type: "qcm", q: "Quel modèle de déploiement mélange cloud public et cloud privé ?", opts: ["Multicloud", "Hybride", "Public strict", "On-premise"], a: 1, exp: "Le cloud hybride combine public et privé." },
    { type: "vf", q: "Il est recommandé de placer de lourdes politiques de filtrage sur la couche de coeur.", a: false, exp: "Non : le coeur reste simple et rapide ; les politiques vont sur la distribution." },
    { type: "input", q: "Dans le modèle hiérarchique, quelle couche assure le routage inter-VLAN et les politiques ?", a: ["distribution", "la distribution", "couche de distribution"], ph: "une couche", exp: "La couche de distribution agrège les accès et applique routage, ACL et QoS." },
    { type: "qcm", q: "Pour augmenter la bande passante interne d'un spine-leaf, on ajoute…", opts: ["Des liens leaf-leaf", "Des spines", "Des terminaux", "Des collapsed cores"], a: 1, exp: "Ajouter des spines augmente la capacité ; ajouter des leaves augmente les ports." },
    { type: "qcm", q: "Quelle couche du campus connecte directement PC, téléphones et bornes Wi-Fi ?", opts: ["Coeur", "Distribution", "Accès", "Spine"], a: 2, exp: "La couche d'accès branche les terminaux (avec PoE et VLAN)." }
  ],
  final: {
    title: "Exercice final — Choisir la bonne architecture",
    intro: `<p>Une entreprise possède un siège avec plusieurs bâtiments, un datacenter à fort trafic serveur-à-serveur, et trois agences distantes reliées à des applications hébergées en cloud. On te demande de placer chaque brique.</p>`,
    questions: [
      { type: "qcm", q: "Pour les bâtiments du siège (campus), quel modèle choisir ?", opts: ["Spine-leaf", "Hiérarchique accès/distribution/coeur", "SD-WAN pur", "Multicloud"], a: 1, exp: "Le campus suit le modèle hiérarchique trois couches." },
      { type: "qcm", q: "Pour le datacenter à fort trafic est-ouest, quel modèle ?", opts: ["Collapsed core", "Spine-leaf", "Access/Distribution/Core", "WAN MPLS"], a: 1, exp: "Le spine-leaf est taillé pour le trafic est-ouest du datacenter." },
      { type: "input", q: "Quelle technologie relie les trois agences distantes au siège (donne le sigle du réseau étendu ou sa version moderne pilotée par logiciel) ?", a: ["wan", "sd-wan", "sdwan"], ph: "sigle", exp: "Un WAN, idéalement un SD-WAN piloté par logiciel." },
      { type: "vf", q: "Les applications hébergées et consommées comme service relèvent du SaaS.", a: true, exp: "Oui : SaaS = logiciel consommé en ligne." },
      { type: "qcm", q: "Sur un petit site sans besoin d'un coeur dédié, quelle simplification adopter ?", opts: ["Un spine-leaf géant", "Un collapsed core (distribution+coeur fusionnés)", "Supprimer la couche d'accès", "Uniquement du cloud"], a: 1, exp: "Le collapsed core fusionne distribution et coeur sur les petits sites." }
    ],
    solution: `<pre class="pseudo"># Placement des briques
Siège (campus)   -> hiérarchique : Access / Distribution / Core
Datacenter (E-O) -> spine-leaf (non bloquant, latence constante)
Agences distantes-> WAN / SD-WAN vers le siège
Applications     -> cloud SaaS (consommées comme service)
Petit site       -> collapsed core (distribution + coeur fusionnés)
# Principe : l'architecture suit le profil de trafic.</pre>
<p>Tu sais désormais cartographier un réseau d'entreprise complet. Demain : la virtualisation, qui fait tourner tout ce monde sur moins de matériel.</p>`
  }
};
</script>
