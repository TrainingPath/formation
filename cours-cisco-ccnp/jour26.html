<script>
var DAY = {
  num: 26,
  title: "Les API REST et NETCONF/RESTCONF",
  subtitle: "Parler aux équipements avec des données structurées plutôt qu'avec du texte d'écran.",
  theory: `
<h3>1. Le problème du "scraping" d'écran</h3>
<p>Quand un script lit la sortie d'un <code>show ip interface brief</code>, il analyse du texte prévu pour un humain : colonnes, espaces, abréviations. C'est fragile — un changement d'affichage casse le script. On appelle ça du <em>screen scraping</em>. La solution moderne : demander à l'équipement des <strong>données structurées</strong> (JSON ou XML) via une <strong>API</strong> (Application Programming Interface), c'est-à-dire une porte d'entrée programmatique documentée.</p>
<h3>2. Les modèles d'API : REST</h3>
<p><strong>REST</strong> (REpresentational State Transfer) est un style d'API qui s'appuie sur <strong>HTTP</strong>. On agit sur des <em>ressources</em> désignées par une URL, avec les verbes HTTP standard :</p>
<pre class="pseudo"># Verbes HTTP et leur sens dans une API REST
GET    -> lire une ressource        (ex : lire les interfaces)
POST   -> creer une ressource
PUT    -> remplacer une ressource
PATCH  -> modifier partiellement
DELETE -> supprimer une ressource
# Les donnees voyagent en JSON (le plus courant) ou en XML.
# La reponse contient un code de statut : 200 OK, 201 Created,
# 401 Unauthorized, 404 Not Found, 500 Server Error, ...</pre>
<div class="tip">JSON (JavaScript Object Notation) est un format texte de paires clé/valeur, lisible et léger. C'est le format d'échange dominant des API REST modernes.</div>
<h3>3. NETCONF : configurer proprement</h3>
<p><strong>NETCONF</strong> (Network Configuration Protocol) est un protocole conçu <em>spécifiquement</em> pour la gestion de configuration réseau. Points clés à mémoriser :</p>
<pre class="pseudo"># NETCONF en bref
Transport : SSH   (port TCP 830)
Encodage  : XML
Modele    : YANG (decrit la structure des donnees)
Datastores: running, candidate, startup
Operations: get-config, edit-config, commit, lock, ...</pre>
<p>La grande force de NETCONF est la notion de <strong>datastore candidate</strong> : on prépare une configuration complète, on la valide, puis on la <em>valide définitivement</em> (<code>commit</code>). Si quelque chose ne va pas, on n'a rien cassé. NETCONF utilise des <strong>modèles YANG</strong> (voir jour 27) pour décrire précisément chaque donnée manipulable.</p>
<div class="warn">Retiens bien : NETCONF fonctionne sur <strong>SSH, port 830</strong>, et encode en <strong>XML</strong>. C'est un piège classique d'examen de le confondre avec RESTCONF.</div>
<h3>4. RESTCONF : NETCONF version HTTP</h3>
<p><strong>RESTCONF</strong> apporte la philosophie REST au monde YANG. Il expose les mêmes modèles de données que NETCONF, mais via <strong>HTTP/HTTPS</strong> (généralement port 443), avec les verbes GET/POST/PUT/PATCH/DELETE, et un encodage <strong>JSON ou XML</strong>. C'est plus simple à consommer depuis un navigateur ou la bibliothèque Python <code>requests</code>.</p>
<pre class="pseudo"># Comparatif NETCONF vs RESTCONF
                 NETCONF            RESTCONF
Transport        SSH (port 830)     HTTP/HTTPS (443)
Encodage         XML                JSON ou XML
Style            operations RPC     verbes REST (GET/PUT/...)
Datastore cand.  oui (commit)       limite
Modele de donnees YANG              YANG</pre>
<h3>5. Un exemple concret RESTCONF</h3>
<p>Pour lire les interfaces d'un IOS-XE via RESTCONF, on interroge une URL dédiée avec un en-tête indiquant qu'on veut du JSON :</p>
<pre class="pseudo"># Requete RESTCONF (extrait, en-tetes simplifies)
GET https://routeur/restconf/data/ietf-interfaces:interfaces
Accept: application/yang-data+json
# La reponse est un JSON structure decrivant chaque interface
# selon le modele YANG "ietf-interfaces".</pre>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># API = porte programmatique -> donnees STRUCTUREES (JSON/XML)
# REST : style sur HTTP, verbes GET/POST/PUT/PATCH/DELETE
# NETCONF : SSH port 830, XML, YANG, datastore candidate + commit
# RESTCONF : HTTP/HTTPS 443, JSON ou XML, YANG, style REST
# Codes HTTP : 200 OK, 201 Created, 401, 404, 500
# But commun : fini le screen scraping fragile</pre>`,
  exercises: [
    { type: "qcm", q: "Sur quel port TCP NETCONF fonctionne-t-il par défaut ?", opts: ["22", "443", "830", "161"], a: 2, exp: "NETCONF utilise SSH sur le port TCP 830." },
    { type: "qcm", q: "Quel encodage NETCONF utilise-t-il pour ses données ?", opts: ["JSON uniquement", "XML", "CSV", "YAML"], a: 1, exp: "NETCONF encode ses données en XML." },
    { type: "qcm", q: "Quel verbe HTTP sert à LIRE une ressource dans une API REST ?", opts: ["POST", "GET", "DELETE", "PATCH"], a: 1, exp: "GET récupère (lit) une ressource sans la modifier." },
    { type: "input", q: "Quel format de données texte, à base de paires clé/valeur, domine les API REST modernes ? (un mot)", a: ["json"], ph: "4 lettres", exp: "JSON est le format d'échange dominant des API REST." },
    { type: "vf", q: "RESTCONF fonctionne sur HTTP/HTTPS et peut encoder en JSON ou en XML.", a: true, exp: "Vrai : RESTCONF apporte le style REST sur HTTP, avec JSON ou XML." },
    { type: "qcm", q: "Quel protocole propose un datastore 'candidate' avec commit, idéal pour préparer puis valider une config ?", opts: ["RESTCONF", "NETCONF", "SNMP", "Telnet"], a: 1, exp: "NETCONF permet de préparer la config dans le datastore candidate puis de la commiter." },
    { type: "qcm", q: "Que veut dire le code de statut HTTP 401 ?", opts: ["OK", "Ressource créée", "Non autorisé (authentification requise)", "Erreur serveur"], a: 2, exp: "401 Unauthorized signale un problème d'authentification/autorisation." },
    { type: "vf", q: "Le 'screen scraping' consiste à analyser un affichage texte prévu pour un humain, ce qui est fragile.", a: true, exp: "Vrai : d'où l'intérêt des API qui renvoient des données structurées." },
    { type: "input", q: "Quel langage de modélisation décrit la structure des données manipulées par NETCONF et RESTCONF ? (4 lettres)", a: ["yang"], ph: "modèle de données", exp: "YANG décrit la structure des données (voir jour 27)." },
    { type: "qcm", q: "Quel verbe HTTP supprime une ressource ?", opts: ["GET", "PUT", "DELETE", "POST"], a: 2, exp: "DELETE supprime la ressource désignée par l'URL." },
    { type: "qcm", q: "Sur quel(s) port(s) RESTCONF fonctionne-t-il généralement ?", opts: ["830 (SSH)", "443 (HTTPS)", "23 (Telnet)", "69 (TFTP)"], a: 1, exp: "RESTCONF passe par HTTP/HTTPS, typiquement le port 443." },
    { type: "vf", q: "NETCONF et RESTCONF utilisent tous deux des modèles de données YANG.", a: true, exp: "Vrai : YANG est le langage de modélisation commun aux deux protocoles." },
    { type: "input", q: "Quel verbe HTTP crée une nouvelle ressource dans une API REST ? (un mot en majuscules)", a: ["post"], ph: "verbe HTTP", exp: "POST crée une nouvelle ressource." },
    { type: "qcm", q: "Pourquoi préférer une API à l'analyse de texte d'un 'show' ?", opts: ["C'est toujours plus rapide à exécuter", "Les données structurées sont fiables et stables face aux changements d'affichage", "Ça consomme moins de mémoire", "L'analyse de texte est impossible à scripter"], a: 1, exp: "Les API renvoient des données structurées, robustes contrairement au scraping." },
    { type: "input", q: "Quel code de statut HTTP signifie que tout s'est bien passé (succès standard) ? (nombre)", a: ["200"], ph: "3 chiffres", exp: "200 OK indique le succès d'une requête HTTP." }
  ],
  final: {
    title: "Exercice final — Choisir REST, NETCONF ou RESTCONF",
    intro: `<p>Ton équipe automatise un parc IOS-XE. Selon les cas, il faut choisir le bon mécanisme d'accès programmatique. Réponds en gardant en tête les caractéristiques de chaque protocole.</p>`,
    questions: [
      { type: "qcm", q: "Tu veux préparer une grosse configuration, la valider, puis l'appliquer d'un coup avec possibilité d'annuler. Que choisis-tu ?", opts: ["NETCONF (datastore candidate + commit)", "Screen scraping", "Telnet", "SNMP en écriture"], a: 0, exp: "Le datastore candidate de NETCONF permet préparation, validation puis commit." },
      { type: "input", q: "Sur quel port TCP ta session NETCONF va-t-elle s'établir ?", a: ["830"], ph: "port", exp: "NETCONF s'établit sur SSH, port 830." },
      { type: "qcm", q: "Un développeur web veut lire l'état des interfaces depuis son navigateur, en JSON. Quel mécanisme est le plus adapté ?", opts: ["NETCONF (XML/SSH)", "RESTCONF (HTTP/JSON)", "Telnet", "TFTP"], a: 1, exp: "RESTCONF expose les modèles YANG en JSON sur HTTP : idéal pour le web." },
      { type: "vf", q: "RESTCONF et NETCONF partagent les mêmes modèles de données YANG.", a: true, exp: "Vrai : seuls le transport et l'encodage diffèrent ; le modèle YANG est commun." },
      { type: "qcm", q: "Quel verbe HTTP utiliserais-tu en RESTCONF pour simplement consulter les interfaces sans rien changer ?", opts: ["DELETE", "GET", "POST", "PUT"], a: 1, exp: "GET lit la ressource sans la modifier." }
    ],
    solution: `<pre class="pseudo"># Grille de decision
Preparer/valider/commiter une grosse config  -> NETCONF (candidate + commit)
Lire de l'etat en JSON depuis le web/requests -> RESTCONF (HTTP/JSON)
Consommer une API generique d'un controleur   -> REST (GET/POST/...)
# Rappels de ports/encodages :
NETCONF  : SSH 830, XML
RESTCONF : HTTPS 443, JSON ou XML
# Les deux reposent sur des modeles YANG.</pre>
<p>Tu sais maintenant distinguer REST, NETCONF et RESTCONF. Demain : YANG en détail, plus Ansible et l'infrastructure as code.</p>`
  }
};
</script>
