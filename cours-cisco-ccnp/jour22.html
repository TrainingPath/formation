<script>
var DAY = {
  num: 22,
  title: "La sécurité de l'infrastructure (AAA, TACACS+, RADIUS)",
  subtitle: "Centraliser qui se connecte, ce qu'il a le droit de faire, et garder la trace.",
  theory: `
<h3>1. Le problème des comptes locaux</h3>
<p>Sur un petit réseau, on crée un compte administrateur <em>local</em> sur chaque routeur. Mais dès qu'il y a des dizaines d'équipements et plusieurs administrateurs, cela devient ingérable : changer un mot de passe oblige à le faire partout, et rien ne trace qui a fait quoi. La solution est de <strong>centraliser</strong> l'authentification sur un serveur dédié. C'est le rôle de l'<strong>AAA</strong>.</p>
<h3>2. Les trois A de l'AAA</h3>
<p>Le cadre <strong>AAA</strong> répond à trois questions distinctes. L'<strong>Authentification</strong> (Authentication) : <em>qui es-tu ?</em> On vérifie l'identité (login + mot de passe, certificat…). L'<strong>Autorisation</strong> (Authorization) : <em>qu'as-tu le droit de faire ?</em> On décide des commandes ou des services permis. La <strong>Traçabilité</strong> (Accounting) : <em>qu'as-tu fait ?</em> On enregistre les actions (commandes tapées, durée de session) pour l'audit. Une phrase mnémotechnique : <em>« Qui es-tu, que peux-tu faire, qu'as-tu fait ? »</em></p>
<div class="tip">Authentication = identité, Authorization = permissions, Accounting = journalisation. Les trois sont indépendants : on peut authentifier centralement et autoriser localement, par exemple.</div>
<h3>3. Deux protocoles : TACACS+ et RADIUS</h3>
<p>Pour parler au serveur central, l'équipement (le <em>NAS</em>, Network Access Server) utilise l'un de deux protocoles. <strong>TACACS+</strong> est un protocole <em>Cisco</em> (propriétaire à l'origine) taillé pour l'administration des équipements. <strong>RADIUS</strong> est un standard ouvert (IETF), très répandu pour l'accès des <em>utilisateurs finaux</em> au réseau (Wi-Fi, VPN, 802.1X). Les deux existent souvent ensemble : TACACS+ pour administrer les routeurs, RADIUS pour authentifier les postes qui se connectent.</p>
<h3>4. TACACS+ vs RADIUS : les différences qui tombent à l'examen</h3>
<p>Ces différences sont classiques et doivent être connues par cœur.</p>
<pre class="pseudo"># TACACS+                          # RADIUS
Transport : TCP port 49            Transport : UDP 1812 (auth) / 1813 (acct)
Chiffrement : TOUT le paquet       Chiffrement : le MOT DE PASSE seulement
AAA : les 3 A SÉPARÉS              AAA : Authentification + Autorisation COMBINÉES
Origine : Cisco (propriétaire)     Origine : standard ouvert (IETF)
Usage : administration équipements Usage : accès réseau des utilisateurs (802.1X, VPN)</pre>
<p>Le point le plus discriminant : <strong>TACACS+ chiffre l'intégralité du paquet</strong> (corps compris) et <strong>sépare les trois A</strong>, ce qui permet un contrôle très fin des commandes autorisées, commande par commande. <strong>RADIUS ne chiffre que le mot de passe</strong> et <strong>fusionne authentification et autorisation</strong> dans un même échange. C'est pourquoi on préfère TACACS+ pour l'administration des équipements Cisco.</p>
<h3>5. Configurer l'AAA sur IOS</h3>
<p>On active d'abord le modèle AAA, on déclare le(s) serveur(s) avec leur clé partagée (secret), puis on définit des <strong>listes de méthodes</strong> (method lists) qui indiquent, dans l'ordre, où authentifier. On prévoit toujours un repli local (<code>local</code>) au cas où le serveur serait injoignable, sinon on risque de se verrouiller dehors.</p>
<pre class="pseudo"># Exemple TACACS+ pour l'administration
aaa new-model
tacacs server SRV1
 address ipv4 10.0.0.10
 key CleSecretePartagee
!
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
aaa accounting commands 15 default start-stop group tacacs+</pre>
<div class="warn">Toujours garder un compte local de secours et le repli <code>local</code> dans la method list. Si le seul moyen d'authentification est le serveur TACACS+ et qu'il tombe (ou que la clé est fausse), plus personne ne peut se connecter : c'est le scénario du verrouillage administrateur.</p></div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># AAA = Authentication (qui) / Authorization (quoi) / Accounting (trace)
# TACACS+ : TCP 49, chiffre TOUT le paquet, 3 A SÉPARÉS, Cisco -> admin équipements
# RADIUS  : UDP 1812/1813, chiffre le MDP seulement, Authn+Authz COMBINÉES,
#           standard ouvert -> accès utilisateurs (802.1X, Wi-Fi, VPN)
# IOS : aaa new-model + serveur + clé + method lists (+ repli local !)</pre>`,
  exercises: [
    { type: "qcm", q: "Que veulent dire les trois A de l'AAA ?", opts: ["Adressage, Analyse, Archivage", "Authentification, Autorisation, Accounting (traçabilité)", "Accès, Alerte, Audit", "Attribution, Allocation, Activation"], a: 1, exp: "Authentication (qui es-tu), Authorization (que peux-tu faire), Accounting (qu'as-tu fait)." },
    { type: "qcm", q: "Quel protocole utilise TCP sur le port 49 ?", opts: ["RADIUS", "TACACS+", "SNMP", "SSH"], a: 1, exp: "TACACS+ fonctionne en TCP port 49 ; RADIUS utilise UDP 1812/1813." },
    { type: "qcm", q: "Quels ports UDP RADIUS utilise-t-il pour l'authentification et la traçabilité ?", opts: ["49 et 50", "1812 et 1813", "161 et 162", "1701 et 1723"], a: 1, exp: "RADIUS : UDP 1812 (authentification) et 1813 (accounting)." },
    { type: "vf", q: "TACACS+ chiffre l'intégralité du paquet, tandis que RADIUS ne chiffre que le mot de passe.", a: true, exp: "Vrai : c'est une différence majeure. TACACS+ protège tout le corps ; RADIUS seulement le champ mot de passe." },
    { type: "input", q: "Quel protocole AAA est d'origine Cisco et sépare les trois A ? (un mot)", a: ["tacacs+", "tacacs", "tacacs plus"], ph: "un protocole", exp: "TACACS+ (Cisco) sépare Authentification, Autorisation et Accounting." },
    { type: "qcm", q: "Pour quel usage privilégie-t-on généralement RADIUS ?", opts: ["l'administration des routeurs commande par commande", "l'accès réseau des utilisateurs (802.1X, Wi-Fi, VPN)", "le routage OSPF", "la QoS"], a: 1, exp: "RADIUS (standard ouvert) est courant pour l'accès des utilisateurs finaux au réseau." },
    { type: "vf", q: "RADIUS sépare complètement l'authentification et l'autorisation en deux échanges distincts.", a: false, exp: "Faux : RADIUS combine authentification et autorisation. C'est TACACS+ qui les sépare." },
    { type: "input", q: "Dans l'AAA, quel A répond à la question « qu'as-tu fait ? » (journalisation) ? (un mot)", a: ["accounting", "tracabilite", "traçabilité", "l'accounting"], ph: "un mot", exp: "L'Accounting (traçabilité) enregistre les actions pour l'audit." },
    { type: "qcm", q: "Comment appelle-t-on l'équipement qui interroge le serveur AAA (routeur, switch, NAS) ?", opts: ["le client AAA / NAS", "le RP", "le RADIUS server", "le border node"], a: 0, exp: "Le NAS (Network Access Server) est le client AAA qui dialogue avec le serveur." },
    { type: "qcm", q: "Pourquoi préfère-t-on TACACS+ pour administrer les équipements Cisco ?", opts: ["il est plus rapide en UDP", "il sépare les A et permet une autorisation fine commande par commande", "il n'a pas besoin de clé", "il chiffre moins"], a: 1, exp: "La séparation des A permet un contrôle précis des commandes autorisées." },
    { type: "vf", q: "Il faut toujours prévoir un repli local (local) dans la method list AAA.", a: true, exp: "Vrai : sinon, si le serveur tombe, plus personne ne peut se connecter (verrouillage)." },
    { type: "input", q: "Quelle commande globale active le modèle AAA sur IOS ? Réponds : aaa …", a: ["new-model", "aaa new-model"], ph: "deux mots", exp: "aaa new-model active le cadre AAA avant toute configuration de serveurs et method lists." },
    { type: "qcm", q: "Sur quel protocole de transport repose RADIUS ?", opts: ["TCP", "UDP", "ICMP", "GRE"], a: 1, exp: "RADIUS utilise UDP (1812/1813) ; TACACS+ utilise TCP (49)." },
    { type: "input", q: "Comment appelle-t-on la liste ordonnée qui indique où authentifier (serveur puis local) ? Réponds : method …", a: ["list", "lists", "method list", "liste de methodes"], ph: "un mot", exp: "La method list définit l'ordre des sources d'authentification (ex. group tacacs+ local)." },
    { type: "qcm", q: "Quelle affirmation est correcte ?", opts: ["RADIUS = Cisco, TACACS+ = standard ouvert", "TACACS+ = Cisco/TCP 49, RADIUS = standard/UDP 1812-1813", "Les deux utilisent TCP 49", "Les deux chiffrent tout le paquet"], a: 1, exp: "TACACS+ (Cisco, TCP 49, chiffre tout) vs RADIUS (standard, UDP 1812/1813, chiffre le mdp)." }
  ],
  final: {
    title: "Exercice final — Centraliser l'administration",
    intro: "<p>Une entreprise a 40 routeurs et 6 administrateurs. On veut centraliser l'accès, tracer les commandes et choisir le bon protocole. On met aussi en place un garde-fou anti-verrouillage.</p>",
    questions: [
      { type: "qcm", q: "Pour administrer les 40 routeurs avec autorisation fine des commandes, on choisit…", opts: ["RADIUS", "TACACS+", "Telnet local", "SNMPv1"], a: 1, exp: "TACACS+ sépare les A et autorise commande par commande : idéal pour l'administration." },
      { type: "input", q: "Quel port TCP TACACS+ utilise-t-il ?", a: ["49", "tcp 49", "port 49"], ph: "un nombre", exp: "TACACS+ = TCP port 49." },
      { type: "qcm", q: "Pour tracer chaque commande de niveau 15, on active…", opts: ["aaa accounting commands 15", "aaa authentication login", "ip accounting", "logging buffered"], a: 0, exp: "aaa accounting commands 15 journalise les commandes privilégiées." },
      { type: "vf", q: "Il faut garder un compte local et le repli local dans la method list pour éviter le verrouillage si le serveur tombe.", a: true, exp: "Oui : sans repli local, une panne du serveur TACACS+ bloque tous les accès." },
      { type: "qcm", q: "Pour l'accès Wi-Fi des employés en 802.1X, on utiliserait plutôt…", opts: ["TACACS+", "RADIUS", "CDP", "STP"], a: 1, exp: "RADIUS est le standard de l'accès réseau utilisateur (802.1X, Wi-Fi, VPN)." }
    ],
    solution: "<pre class=\"pseudo\"># Administration centralisée via TACACS+\naaa new-model\ntacacs server SRV1\n address ipv4 10.0.0.10\n key CleSecretePartagee\n!\naaa authentication login default group tacacs+ local\naaa authorization exec default group tacacs+ local\naaa accounting commands 15 default start-stop group tacacs+\n!\n! Garde-fou : 'local' en dernier recours + un compte local de secours\nusername secours privilege 15 secret Str0ng!Backup</pre><p>Choix cohérent : TACACS+ (TCP 49, chiffre tout, 3 A séparés) pour administrer les équipements, RADIUS pour l'accès des utilisateurs, et toujours un repli local contre le verrouillage.</p>"
  }
};
</script>
