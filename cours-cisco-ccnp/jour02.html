  title: "Le format : examen core + concentration",
  subtitle: "Comprendre exactement quels examens passer, et dans quel ordre.",
  theory: `
<h3>1. Rappel : deux examens pour un CCNP</h3>
<p>Hier, on a posé le principe : toute piste CCNP exige <strong>un examen de tronc commun</strong> (« core ») et <strong>un examen de concentration</strong>. Aujourd'hui, on entre dans le détail concret de ce format, en prenant la piste <strong>Enterprise</strong> comme fil rouge. Objectif : savoir quel examen ouvre quoi, et comment planifier son passage.</p>
<h3>2. L'examen core : ENCOR 350-401</h3>
<p>Le core de la piste Enterprise est <strong>ENCOR</strong> (« Implementing and Operating Cisco Enterprise Network Core Technologies »), code <strong>350-401</strong>. Il dure environ 120 minutes et couvre un large éventail : architecture, virtualisation, infrastructure (couches 2 et 3, y compris OSPF, EIGRP, BGP), services réseau, sécurité et automatisation. C'est un examen exigeant qui valide qu'on maîtrise le cœur des technologies d'un réseau d'entreprise moderne.</p>
<div class="tip">Un même examen core peut servir deux buts : il valide la moitié du CCNP <em>et</em> il fait office de qualification écrite pour le CCIE de la même piste. Réussir ENCOR, c'est cocher deux cases à la fois.</div>
<h3>3. L'examen de concentration : choisir sa spécialité</h3>
<p>La seconde brique est un <strong>examen de concentration</strong> à choisir dans une liste propre à la piste. Il approfondit un domaine précis. Pour Enterprise, le catalogue comprend notamment :</p>
<pre class="pseudo"># Concentrations CCNP Enterprise (extraits)
300-410 ENARSI  -> Advanced Routing and Services (OSPF, EIGRP, BGP, VPN, dépannage)
300-415 ENSDWI  -> SD-WAN (déploiement, politiques, sécurité)
300-425 ENWLSD  -> Wireless Design (conception sans-fil)
300-430 ENWLSI  -> Wireless Implementation (mise en oeuvre sans-fil)
300-435 ENAUTO  -> Automation (programmabilité, APIs, Python, modèles YANG)</pre>
<p>Le choix se fait selon le métier visé : un ingénieur routage prendra <strong>ENARSI</strong> ; un spécialiste WAN moderne prendra <strong>ENSDWI</strong> ; un développeur réseau prendra <strong>ENAUTO</strong>.</p>
<h3>4. Ordre, codes et logique de numérotation</h3>
<p>Rien n'impose de passer le core avant la concentration : l'ordre est libre. En pratique, beaucoup commencent par le core, plus large, puis enchaînent sur une concentration alignée sur le core (ENARSI complète bien ENCOR sur le routage). Les codes suivent une logique : les cores commencent par <strong>350-</strong>, les concentrations Enterprise par <strong>300-</strong>, et le CCNA par <strong>200-301</strong>.</p>
<pre class="pseudo"># Lecture des codes d'examen
200-301  -> CCNA (Associate)
350-401  -> ENCOR, core CCNP Enterprise (350 = core Professional)
300-4xx  -> concentrations CCNP Enterprise
350-701  -> SCOR, core CCNP Security (autre piste)</pre>
<div class="warn">Ne confonds pas ENCOR (core, 350-401) avec ENARSI (concentration, 300-410). Les deux couvrent du routage, mais ENCOR est généraliste et obligatoire, tandis qu'ENARSI est une spécialité optionnelle. Passer ENARSI sans ENCOR ne donne AUCUNE certification CCNP.</div>
<h3>5. Validité et recertification</h3>
<p>Une certification Cisco est valable <strong>trois ans</strong>. On la renouvelle en repassant un examen, ou via le programme de <strong>Continuing Education</strong> (crédits de formation continue). Le CCNP, comme les autres, suit cette règle : la maîtrise doit rester à jour dans un domaine qui évolue vite.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># CCNP Enterprise = 1 core + 1 concentration
# CORE          : 350-401 ENCOR (obligatoire, ~120 min, généraliste)
# CONCENTRATION : au choix (ENARSI, ENSDWI, ENWLSD, ENAUTO...)
# Ordre libre ; codes 350- = core, 300- = concentration Enterprise
# Validité : 3 ans, recertification par examen ou formation continue
# ENCOR sert aussi de qualification écrite au CCIE Enterprise.</pre>`,

    { type: "qcm", q: "Quel est le code de l'examen core de la piste Enterprise ?", opts: ["300-410", "200-301", "350-401", "350-701"], a: 2, exp: "350-401 est le code d'ENCOR, le core Enterprise." },
    { type: "qcm", q: "Que signifie l'acronyme ENARSI ?", opts: ["Le core Enterprise", "Une concentration Advanced Routing and Services", "Le CCNA", "Le core Security"], a: 1, exp: "ENARSI (300-410) est une concentration axée routage avancé et services." },
    { type: "vf", q: "Il faut obligatoirement passer le core AVANT la concentration.", a: false, exp: "L'ordre est libre ; commencer par le core est courant mais pas imposé." },

    { type: "qcm", q: "Quelle concentration choisir pour se spécialiser en SD-WAN ?", opts: ["300-410 ENARSI", "300-415 ENSDWI", "300-435 ENAUTO", "300-425 ENWLSD"], a: 1, exp: "300-415 ENSDWI est la concentration SD-WAN." },
    { type: "vf", q: "Réussir seulement ENARSI, sans ENCOR, permet d'obtenir le CCNP Enterprise.", a: false, exp: "Non : sans le core ENCOR, il n'y a pas de CCNP. Il faut core + concentration." },
    { type: "input", q: "Quelle concentration Enterprise (acronyme) porte sur l'automatisation et la programmabilité ?", a: ["enauto", "300-435", "300-435 enauto"], ph: "acronyme ou code", exp: "ENAUTO (300-435) couvre automatisation, APIs, Python et modèles YANG." },
    { type: "qcm", q: "Un examen core CCNP commence par quel préfixe de code ?", opts: ["200-", "300-", "350-", "100-"], a: 2, exp: "Les cores Professional commencent par 350- (350-401 ENCOR, 350-701 SCOR...)." },
    { type: "qcm", q: "Combien de temps une certification Cisco reste-t-elle valable ?", opts: ["1 an", "2 ans", "3 ans", "À vie"], a: 2, exp: "Trois ans, avec recertification par examen ou formation continue." },
    { type: "qcm", q: "ENCOR fait aussi office de quoi vis-à-vis du CCIE Enterprise ?", opts: ["Du labo pratique", "De la qualification écrite", "D'un renouvellement automatique", "D'un prérequis d'inscription au CCNA"], a: 1, exp: "ENCOR est la qualification écrite du CCIE Enterprise." },
    { type: "vf", q: "ENCOR est un examen généraliste couvrant architecture, virtualisation, infrastructure, sécurité et automatisation.", a: true, exp: "Oui, ENCOR ratisse large sur le cœur des technologies Enterprise." },
    { type: "input", q: "Quel code d'examen correspond au CCNA (niveau Associate) ?", a: ["200-301", "200301"], ph: "chiffres", exp: "Le CCNA porte le code 200-301." },
    { type: "qcm", q: "Un ingénieur voulant approfondir OSPF, EIGRP et BGP en concentration choisirait plutôt…", opts: ["ENWLSD", "ENARSI", "ENAUTO", "ENSDWI"], a: 1, exp: "ENARSI (Advanced Routing and Services) approfondit le routage." },
    { type: "vf", q: "Le code 350-701 correspond au core d'une autre piste (Security).", a: true, exp: "Oui : SCOR 350-701 est le core CCNP Security ; chaque piste a son propre core." },
    { type: "qcm", q: "Comment renouvelle-t-on une certification Cisco arrivant à échéance ?", opts: ["On ne peut pas la renouveler", "En repassant un examen ou via la formation continue", "En payant une simple taxe", "Elle se renouvelle seule"], a: 1, exp: "Recertification par examen ou par crédits de Continuing Education." }
  ],
  final: {
    title: "Exercice final — Planifier deux examens",
    intro: `<p>Karim vise le CCNP Enterprise avec une orientation routage/dépannage. Il veut planifier ses deux examens sur six mois et éviter les confusions de codes.</p>`,
    questions: [
      { type: "input", q: "Quel examen core (nom + code) doit-il inscrire à son planning ?", a: ["encor 350-401", "350-401 encor", "encor", "350-401"], ph: "nom et code", exp: "Le core Enterprise est ENCOR 350-401." },
      { type: "qcm", q: "Vu son orientation routage/dépannage, quelle concentration lui convient le mieux ?", opts: ["300-415 ENSDWI", "300-410 ENARSI", "300-425 ENWLSD", "300-435 ENAUTO"], a: 1, exp: "ENARSI (300-410) couvre le routage avancé et le dépannage." },
      { type: "vf", q: "Karim peut passer ENARSI avant ENCOR s'il le souhaite.", a: true, exp: "L'ordre des examens est libre." },

    ],
    solution: `<pre class="pseudo"># Plan d'examens de Karim (CCNP Enterprise)
Examen 1 (core)          : 350-401 ENCOR
Examen 2 (concentration) : 300-410 ENARSI (routage/dépannage)
Ordre : libre (souvent ENCOR d'abord car généraliste)
Total : 2 examens = CCNP Enterprise
Recertification : sous 3 ans (examen ou formation continue)</pre>
<p>Karim a un planning cohérent. Demain : on prend de la hauteur avec l'architecture des réseaux d'entreprise, un pilier d'ENCOR.</p>`
