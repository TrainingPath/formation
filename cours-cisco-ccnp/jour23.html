<script>
var DAY = {
  num: 23,
  title: "La supervision (SNMP, NetFlow, SPAN, IP SLA)",
  subtitle: "Mesurer l'état, compter les flux, capturer le trafic et vérifier la disponibilité.",
  theory: `
<h3>1. Superviser, c'est voir</h3>
<p>On ne gère bien que ce que l'on mesure. La <strong>supervision</strong> (monitoring) donne au réseau des yeux et des oreilles : connaître la charge des liens, repérer une panne avant l'utilisateur, comprendre qui consomme la bande passante, prouver qu'un service respecte son engagement. Quatre outils complémentaires couvrent des besoins différents : <strong>SNMP</strong> (état des équipements), <strong>NetFlow</strong> (qui parle à qui), <strong>SPAN</strong> (capture du trafic) et <strong>IP SLA</strong> (mesure de disponibilité et de délai).</p>
<h3>2. SNMP : l'état des équipements</h3>
<p><strong>SNMP</strong> (Simple Network Management Protocol) permet à une station de supervision (le <em>manager</em>, ex. un logiciel NMS) d'interroger les équipements (les <em>agents</em>). Chaque valeur mesurable (charge CPU, trafic d'une interface, température) est identifiée par un <strong>OID</strong> dans une base appelée <strong>MIB</strong>. Le manager fait des <em>get</em> pour lire ; l'agent peut envoyer spontanément une alerte, le <strong>trap</strong>, quand un événement survient. Retiens les ports : <strong>UDP 161</strong> pour les requêtes, <strong>UDP 162</strong> pour les traps. En version, <strong>SNMPv3</strong> est à privilégier car il apporte authentification et chiffrement (v1 et v2c circulent en clair avec de simples <em>community strings</em>).</p>
<pre class="pseudo"># SNMP : ports et versions
UDP 161 = requêtes (get/set)     UDP 162 = traps (alertes de l'agent)
v1 / v2c : community string en clair (public/private) -> à éviter
v3       : authentification + chiffrement -> recommandé
MIB = base de données ; OID = identifiant d'une valeur mesurable</pre>
<h3>3. NetFlow : qui parle à qui</h3>
<p><strong>NetFlow</strong> ne mesure pas l'état d'un équipement mais analyse les <strong>flux</strong> qui le traversent. Un <em>flux</em> est un ensemble de paquets partageant les mêmes caractéristiques (IP source, IP destination, ports, protocole, interface). L'équipement compte ces flux et exporte des statistiques vers un <em>collecteur</em>. On répond ainsi à « quelles applications consomment le lien ? », « d'où vient ce pic de trafic ? ». C'est de la <em>métrologie</em> de flux, essentielle pour la capacité et la sécurité. La version moderne et normalisée s'appelle <strong>IPFIX</strong> ; <strong>Flexible NetFlow</strong> permet de choisir les champs suivis.</p>
<div class="tip">Ne confonds pas : SNMP dit « l'interface Gi0/1 est chargée à 80 % » (compteur agrégé) ; NetFlow dit « ces 80 % sont surtout du trafic vidéo entre 10.1.1.5 et un serveur externe » (détail par flux).</div>
<h3>4. SPAN : capturer le trafic</h3>
<p>Pour analyser finement (Wireshark, sonde IDS), il faut voir les paquets eux-mêmes. Sur un commutateur, un port ne voit que son propre trafic : le <strong>SPAN</strong> (Switched Port Analyzer), ou <em>port mirroring</em>, recopie le trafic d'un ou plusieurs ports (ou VLAN) source vers un <strong>port destination</strong> où l'on branche la sonde. Le <strong>RSPAN</strong> étend la copie à travers plusieurs commutateurs (via un VLAN dédié), et l'<strong>ERSPAN</strong> l'encapsule pour la transporter sur un réseau routé.</p>
<pre class="pseudo"># SPAN local : copier le trafic de Gi0/1 vers Gi0/24 (sonde)
monitor session 1 source interface Gi0/1
monitor session 1 destination interface Gi0/24</pre>
<h3>5. IP SLA : mesurer la disponibilité et le délai</h3>
<p><strong>IP SLA</strong> (Service Level Agreement) fait générer à l'équipement des <em>sondes actives</em> : de petits tests réguliers (ping ICMP, requête HTTP, mesure de gigue UDP pour la voix) vers une cible, pour mesurer en continu la <strong>disponibilité</strong>, le <strong>délai</strong> et la <strong>perte</strong>. On l'utilise pour vérifier un engagement de service, mais aussi pour déclencher des actions : couplé à un <strong>objet suivi</strong> (track), un IP SLA peut faire basculer une route statique si la cible devient injoignable. C'est une brique clé de la haute disponibilité.</p>
<pre class="pseudo"># IP SLA : pinguer une cible toutes les 10 s et suivre le résultat
ip sla 1
 icmp-echo 8.8.8.8
 frequency 10
ip sla schedule 1 life forever start-time now
!
track 1 ip sla 1 reachability     # bascule possible d'une route selon l'état</pre>
<div class="warn">Attention aux confusions d'examen : SNMP = état (compteurs), NetFlow = flux (qui parle à qui), SPAN = copie de paquets pour capture, IP SLA = sonde active de disponibilité. Chacun a un rôle propre ; ils se complètent, ils ne se remplacent pas.</p></div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># SNMP   : état des équipements. UDP 161 (get) / 162 (trap). v3 = sécurisé. MIB/OID.
# NetFlow: analyse des flux (qui parle à qui). Export vers collecteur. IPFIX.
# SPAN   : copie (mirroring) du trafic d'un port/VLAN vers une sonde. RSPAN/ERSPAN.
# IP SLA : sondes actives (ping, gigue) -> disponibilité/délai, couplé à track.</pre>`,
  exercises: [
    { type: "qcm", q: "Quel outil interroge l'état des équipements (CPU, trafic d'interface) via MIB et OID ?", opts: ["NetFlow", "SNMP", "SPAN", "IP SLA"], a: 1, exp: "SNMP lit les valeurs (OID) exposées dans la MIB des agents." },
    { type: "qcm", q: "Quels ports UDP SNMP utilise-t-il pour les requêtes et les traps ?", opts: ["161 (requêtes) et 162 (traps)", "49 et 50", "1812 et 1813", "23 et 80"], a: 0, exp: "UDP 161 pour get/set, UDP 162 pour les traps envoyés par l'agent." },
    { type: "qcm", q: "Quel outil répond à « quelles applications et quels hôtes consomment le lien » ?", opts: ["SNMP", "NetFlow", "SPAN", "STP"], a: 1, exp: "NetFlow analyse les flux (source, destination, ports) et les exporte vers un collecteur." },
    { type: "vf", q: "SNMPv3 apporte authentification et chiffrement, contrairement à v1/v2c.", a: true, exp: "Vrai : v1/v2c reposent sur des community strings en clair ; v3 est sécurisé." },
    { type: "input", q: "Quel outil recopie (mirroring) le trafic d'un port vers un port de sonde ? (sigle 4 lettres)", a: ["span", "port mirroring", "mirroring"], ph: "sigle", exp: "SPAN (Switched Port Analyzer) copie le trafic vers un port destination pour analyse." },
    { type: "qcm", q: "Quel outil génère des sondes actives (ping, gigue) pour mesurer la disponibilité et le délai ?", opts: ["SNMP", "NetFlow", "IP SLA", "SPAN"], a: 2, exp: "IP SLA lance des tests réguliers vers une cible et mesure disponibilité, délai, perte." },
    { type: "vf", q: "NetFlow capture le contenu complet de chaque paquet, comme Wireshark.", a: false, exp: "Faux : NetFlow compte et résume des flux (métadonnées). Pour capturer les paquets, c'est SPAN." },
    { type: "input", q: "Dans SNMP, comment appelle-t-on l'alerte envoyée spontanément par l'agent vers le manager ? (un mot)", a: ["trap", "un trap", "trap snmp"], ph: "un mot", exp: "Le trap est une notification asynchrone envoyée par l'agent (UDP 162)." },
    { type: "qcm", q: "Comment appelle-t-on l'identifiant d'une valeur mesurable dans la MIB ?", opts: ["OID", "SID", "VNI", "EID"], a: 0, exp: "Un OID (Object IDentifier) désigne chaque objet mesurable de la MIB." },
    { type: "qcm", q: "Quelle variante de SPAN permet de transporter la copie sur un réseau routé (encapsulée) ?", opts: ["RSPAN", "ERSPAN", "VSPAN", "TSPAN"], a: 1, exp: "ERSPAN encapsule le trafic copié pour le router ; RSPAN reste en couche 2 via un VLAN dédié." },
    { type: "vf", q: "IP SLA peut, couplé à un objet track, faire basculer une route selon la disponibilité d'une cible.", a: true, exp: "Vrai : c'est une brique de haute disponibilité (bascule de route statique)." },
    { type: "input", q: "Quel est le nom du standard IETF moderne dérivé de NetFlow pour l'export de flux ? (5 lettres)", a: ["ipfix"], ph: "un standard", exp: "IPFIX est la normalisation IETF de l'export de flux type NetFlow." },
    { type: "qcm", q: "Sur un switch, quelle commande démarre une session de copie du trafic (SPAN) ?", opts: ["ip flow monitor", "monitor session", "snmp-server host", "ip sla schedule"], a: 1, exp: "monitor session N source/destination configure le SPAN local." },
    { type: "input", q: "Dans SNMP, comment appelle-t-on la base de données qui décrit les objets mesurables ? (sigle 3 lettres)", a: ["mib"], ph: "sigle", exp: "La MIB (Management Information Base) organise les OID." },
    { type: "qcm", q: "Quelle correspondance est correcte ?", opts: ["SNMP = capture de paquets", "NetFlow = analyse des flux (qui parle à qui)", "SPAN = sonde active de disponibilité", "IP SLA = lecture des OID"], a: 1, exp: "NetFlow = flux ; SNMP = état/OID ; SPAN = capture ; IP SLA = sonde active." }
  ],
  final: {
    title: "Exercice final — Choisir le bon outil de supervision",
    intro: "<p>Pour chaque besoin de l'équipe réseau, tu dois désigner l'outil adapté parmi SNMP, NetFlow, SPAN et IP SLA, puis en connaître les bases de configuration.</p>",
    questions: [
      { type: "qcm", q: "« Alerter automatiquement quand un lien tombe ou que le CPU dépasse un seuil. »", opts: ["SNMP (traps)", "SPAN", "NetFlow", "IP SLA"], a: 0, exp: "SNMP suit l'état et envoie des traps sur événement." },
      { type: "qcm", q: "« Savoir quelles machines saturent le lien WAN et avec quelles applications. »", opts: ["IP SLA", "NetFlow", "SPAN", "STP"], a: 1, exp: "NetFlow détaille les flux : sources, destinations, ports, volumes." },
      { type: "input", q: "« Brancher Wireshark pour analyser paquet par paquet le trafic d'un port. » Quel outil ? (sigle)", a: ["span", "port mirroring"], ph: "sigle", exp: "SPAN recopie le trafic du port vers le port où est branchée la sonde." },
      { type: "qcm", q: "« Vérifier en continu que la passerelle Internet répond et basculer une route sinon. »", opts: ["SNMP get", "IP SLA + track", "NetFlow", "RSPAN"], a: 1, exp: "IP SLA teste la cible ; couplé à track, il déclenche la bascule de route." },
      { type: "vf", q: "Pour l'accès SNMP, on privilégie SNMPv3 pour l'authentification et le chiffrement.", a: true, exp: "Oui : v1/v2c circulent en clair, v3 est sécurisé." }
    ],
    solution: "<pre class=\"pseudo\"># Chaque outil, son rôle\nSNMP    -> état des équipements (OID/MIB), traps. UDP 161/162, v3 sécurisé.\nNetFlow -> analyse des flux (qui parle à qui), export vers collecteur (IPFIX).\nSPAN    -> copie du trafic vers une sonde : monitor session 1 source/destination.\nIP SLA  -> sondes actives (ping, gigue) + track pour bascule de route.\n\n# Exemple IP SLA\nip sla 1\n icmp-echo 8.8.8.8\n frequency 10\nip sla schedule 1 life forever start-time now\ntrack 1 ip sla 1 reachability</pre><p>Le bon réflexe : état -> SNMP, flux -> NetFlow, paquets -> SPAN, disponibilité -> IP SLA. Ils se complètent.</p>"
  }
};
</script>
