<script>
var DAY = {
  num: 9,
  title: "VLAN, VTP et trunking avancé",
  subtitle: "Découper le réseau en zones logiques et propager les VLAN sans se tromper.",
  theory: `
<h3>1. Rappel VLAN et le rôle du trunk</h3>
<p>Un <strong>VLAN</strong> (« Virtual LAN ») découpe un même commutateur physique en plusieurs réseaux logiques isolés : deux ports dans des VLAN différents ne se parlent qu'en passant par un routeur. Pense à un immeuble de bureaux : un seul bâtiment, mais des étages séparés par des portes à badge. Entre deux commutateurs, on ne veut pas tirer un câble par VLAN : on utilise une liaison <strong>trunk</strong> (jonction) qui transporte plusieurs VLAN sur un seul lien. Chaque trame reçoit une étiquette <strong>802.1Q</strong> (un champ de 4 octets contenant le VLAN ID sur 12 bits, soit 1 à 4094).</p>
<pre class="pseudo">! Configurer un acces et un trunk (Cisco IOS)
Switch(config)# vlan 20
Switch(config-vlan)# name Comptabilite
Switch(config)# interface gi0/1
Switch(config-if)# switchport mode access
Switch(config-if)# switchport access vlan 20
Switch(config)# interface gi0/24
Switch(config-if)# switchport trunk encapsulation dot1q
Switch(config-if)# switchport mode trunk</pre>
<h3>2. Le VLAN natif</h3>
<p>Sur un trunk 802.1Q, un VLAN circule <strong>sans étiquette</strong> : c'est le <strong>VLAN natif</strong> (« native VLAN »), par défaut le VLAN 1. Toute trame non taguée reçue sur le trunk est supposée appartenir à ce VLAN. Les deux extrémités du trunk DOIVENT s'accorder sur le même VLAN natif, sinon les trames fuient d'un VLAN vers un autre.</p>
<div class="warn">Le VLAN natif à 1 par défaut est un risque de sécurité (attaque de « VLAN hopping »). Bonne pratique : changer le VLAN natif pour un VLAN inutilisé et dédié. Commande : <strong>switchport trunk native vlan 999</strong>.</div>
<h3>3. DTP : la négociation automatique du trunk</h3>
<p>Le <strong>DTP</strong> (« Dynamic Trunking Protocol », propriétaire Cisco) permet à deux ports de négocier tout seuls s'ils forment un trunk. Les modes : <strong>dynamic auto</strong> (attend qu'on lui propose), <strong>dynamic desirable</strong> (propose activement), <strong>trunk</strong> (forcé, propose du DTP) et <strong>access</strong> (jamais de trunk). Un port en <em>desirable</em> face à un port <em>auto</em> ou <em>desirable</em> forme un trunk ; deux <em>auto</em> restent en accès.</p>
<div class="tip">Pour la sécurité, on désactive DTP avec <strong>switchport nonegotiate</strong> et on force manuellement le mode. Un port laissé en dynamic auto peut être transformé en trunk par un attaquant.</div>
<h3>4. VTP : propager les VLAN entre commutateurs</h3>
<p>Le <strong>VTP</strong> (« VLAN Trunking Protocol », propriétaire Cisco) synchronise la base de VLAN d'un commutateur vers les autres du même <strong>domaine VTP</strong>, pour éviter de créer chaque VLAN à la main partout. Trois modes :</p>
<pre class="pseudo">! server      : cree/modifie/supprime des VLAN, annonce au domaine
! client      : n'edite pas, applique ce qu'il recoit
! transparent : ignore VTP pour lui-meme, mais relaie les annonces (v2)
Switch(config)# vtp domain ENTREPRISE
Switch(config)# vtp mode server
Switch(config)# vtp password S3cret
Switch(config)# vtp version 2</pre>
<p>Chaque annonce porte un <strong>numéro de révision de configuration</strong> : le commutateur retient toujours la révision la plus haute. VTP existe en <strong>version 1, 2 et 3</strong> ; la v3 ajoute la propagation des VLAN étendus (1006-4094), une meilleure sécurité et un serveur « primaire » explicite.</p>
<div class="warn">Piège classique : brancher dans le domaine un ancien commutateur en mode server avec une révision plus haute et une base VLAN vide. Il écrase la configuration de tout le domaine. Réinitialise toujours la révision (changer de domaine puis revenir, ou passer en transparent) avant d'insérer un commutateur.</div>
<h3>5. Le VTP pruning</h3>
<p>Le <strong>pruning VTP</strong> (« élagage ») évite d'inonder inutilement un trunk avec le trafic de diffusion d'un VLAN qui n'a aucun port actif à l'autre bout. Il retire dynamiquement du trunk les VLAN non nécessaires, économisant la bande passante. On l'active sur un serveur VTP : <strong>vtp pruning</strong>.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># VLAN natif  : circule NON tague sur le trunk (defaut VLAN 1) -> a securiser
# DTP         : negocie le trunk (auto / desirable / trunk / access) -> desactiver si possible
# VTP modes   : server (edite+annonce) / client (applique) / transparent (relaie, v2)
# Revision    : la plus HAUTE gagne -> danger du switch insere
# Pruning     : retire les VLAN inutiles du trunk (economie de BP)
# 802.1Q      : etiquette 4 octets, VLAN ID sur 12 bits (1-4094)</pre>`,
  exercises: [
    { type: "qcm", q: "Que transporte une liaison trunk entre deux commutateurs ?", opts: ["Un seul VLAN à la fois", "Plusieurs VLAN sur un même lien grâce à l'étiquetage 802.1Q", "Uniquement du trafic de gestion", "Seulement le VLAN natif"], a: 1, exp: "Un trunk multiplexe plusieurs VLAN sur un lien unique via les étiquettes 802.1Q." },
    { type: "qcm", q: "Combien de bits code le VLAN ID dans une étiquette 802.1Q ?", opts: ["8 bits", "10 bits", "12 bits", "24 bits"], a: 2, exp: "Le VLAN ID tient sur 12 bits, d'où la plage 1 à 4094 (0 et 4095 réservés)." },
    { type: "qcm", q: "Comment circule le VLAN natif sur un trunk 802.1Q ?", opts: ["Avec une double étiquette", "Sans étiquette (non tagué)", "Chiffré", "Sur un port séparé"], a: 1, exp: "Le VLAN natif est le seul à voyager non tagué sur le trunk." },
    { type: "qcm", q: "Quel protocole propriétaire Cisco négocie automatiquement l'établissement d'un trunk ?", opts: ["VTP", "STP", "DTP", "CDP"], a: 2, exp: "DTP (Dynamic Trunking Protocol) négocie le mode trunk/access." },
    { type: "qcm", q: "Quel mode VTP permet de créer, modifier et supprimer des VLAN tout en les annonçant au domaine ?", opts: ["client", "transparent", "server", "off"], a: 2, exp: "Le mode server édite la base et l'annonce ; le client applique seulement." },
    { type: "qcm", q: "À quoi sert le VTP pruning ?", opts: ["À chiffrer les trunks", "À retirer du trunk les VLAN sans destinataire pour économiser la bande passante", "À supprimer les VLAN de la base", "À accélérer le spanning tree"], a: 1, exp: "Le pruning élague les VLAN inutiles d'un trunk, réduisant les diffusions superflues." },
    { type: "vf", q: "Les deux extrémités d'un trunk doivent utiliser le même VLAN natif.", a: true, exp: "Un désaccord de VLAN natif provoque des fuites de trafic entre VLAN." },
    { type: "vf", q: "Un commutateur en mode VTP transparent applique les VLAN reçus à sa propre base.", a: false, exp: "Le mode transparent ignore les annonces pour lui-même ; il les relaie (en v2) mais garde sa base locale indépendante." },
    { type: "vf", q: "Le commutateur conserve toujours la configuration VTP portant le numéro de révision le plus élevé.", a: true, exp: "C'est le principe de la révision : la plus haute écrase les autres, d'où le danger d'insérer un switch mal réinitialisé." },
    { type: "vf", q: "Laisser un port en mode dynamic auto est une bonne pratique de sécurité.", a: false, exp: "Un port dynamic auto peut être transformé en trunk par un attaquant ; on force le mode et on utilise switchport nonegotiate." },
    { type: "input", q: "Quel est le VLAN natif par défaut sur un trunk Cisco ? (numéro)", a: ["1", "vlan 1"], ph: "un numéro", exp: "Par défaut le VLAN natif est le VLAN 1, qu'il est conseillé de changer." },
    { type: "input", q: "Quel mode VTP se contente d'appliquer les VLAN reçus sans pouvoir les éditer ?", a: ["client", "mode client"], ph: "un mot", exp: "Le mode client applique la base annoncée sans pouvoir la modifier." },
    { type: "input", q: "Quelle commande IOS désactive la négociation DTP sur une interface ?", a: ["switchport nonegotiate", "nonegotiate"], ph: "switchport ...", exp: "switchport nonegotiate coupe l'envoi de trames DTP sur le port." },
    { type: "input", q: "Quel standard IEEE définit l'étiquetage des VLAN sur un trunk ?", a: ["802.1q", "dot1q", "ieee 802.1q", "8021q"], ph: "802.1...", exp: "Le standard 802.1Q définit l'insertion de l'étiquette VLAN dans la trame." },
    { type: "input", q: "Quelle version de VTP est nécessaire pour propager les VLAN étendus (1006-4094) ?", a: ["3", "version 3", "vtp version 3", "v3"], ph: "un numéro", exp: "VTP version 3 gère la plage étendue et améliore la sécurité." }
  ],
  final: {
    title: "Exercice final — Intégrer un nouveau commutateur sans casser le domaine",
    intro: "<p>Tu ajoutes un commutateur d'occasion au domaine VTP <code>ENTREPRISE</code>. Il était configuré en mode server avec une révision élevée et presque aucun VLAN. Sécurise l'opération et vérifie le trunk.</p>",
    questions: [
      { type: "qcm", q: "Quel est le danger principal de brancher ce switch tel quel ?", opts: ["Il ralentit le réseau", "Sa révision plus haute peut écraser la base VLAN du domaine", "Il change le VLAN natif partout", "Il désactive STP"], a: 1, exp: "Une révision supérieure avec base vide écrase les VLAN du domaine." },
      { type: "input", q: "Cite une méthode simple pour remettre son numéro de révision à zéro avant l'insertion.", a: ["mode transparent", "passer en transparent", "vtp mode transparent", "changer de domaine", "changer le nom de domaine"], ph: "une méthode", exp: "Passer en mode transparent (ou changer temporairement le nom de domaine) réinitialise la révision." },
      { type: "qcm", q: "Sur le trunk vers ce switch, comment réduire le risque de VLAN hopping ?", opts: ["Garder le VLAN natif à 1", "Changer le VLAN natif pour un VLAN dédié inutilisé", "Activer DTP desirable", "Supprimer tous les VLAN"], a: 1, exp: "Un VLAN natif dédié et inutilisé réduit la surface d'attaque." },
      { type: "vf", q: "Forcer le port en mode trunk avec switchport nonegotiate est plus sûr que dynamic auto.", a: true, exp: "Le mode forcé sans négociation empêche un pair de manipuler le trunk." },
      { type: "qcm", q: "Pour limiter les diffusions inutiles sur ce trunk, tu actives…", opts: ["Le VTP pruning", "Le portfast", "Le BPDU guard", "Le CDP"], a: 0, exp: "Le VTP pruning élague les VLAN sans destinataire du trunk." }
    ],
    solution: "<pre class=\"pseudo\">! 1) Neutraliser la revision AVANT branchement\nSwitch(config)# vtp mode transparent      ! remet la revision a 0\nSwitch(config)# vtp mode client           ! ou server selon le role voulu\n! 2) Securiser le trunk\nSwitch(config-if)# switchport trunk encapsulation dot1q\nSwitch(config-if)# switchport mode trunk\nSwitch(config-if)# switchport nonegotiate\nSwitch(config-if)# switchport trunk native vlan 999\n! 3) Economiser la bande passante\nSwitch(config)# vtp pruning</pre><p>En réinitialisant la révision, en forçant le trunk et en dédiant le VLAN natif, tu intègres le commutateur sans risque d'écrasement ni de VLAN hopping.</p>"
  }
};
</script>
