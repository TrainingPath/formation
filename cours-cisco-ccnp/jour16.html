  theory: `
<h3>1. Pourquoi le SD-WAN ?</h3>
<p>Le WAN traditionnel relie les sites par des liens MPLS coûteux, configurés routeur par routeur, à la main. Le <strong>SD-WAN</strong> (« Software-Defined WAN ») applique au WAN l'idée du <strong>SDN</strong> : séparer le <strong>plan de contrôle</strong> (les décisions) du <strong>plan de données</strong> (le transport des paquets), et centraliser la gestion. On peut alors utiliser n'importe quel transport (MPLS, Internet, 4G/5G) de façon unifiée, appliquer des politiques globales, et router les applications selon leur qualité de lien.</p>
<div class="tip">Analogie : au lieu que chaque chauffeur (routeur) choisisse seul sa route, une tour de contrôle centrale (le contrôleur) distribue les itinéraires optimaux à toute la flotte, en temps réel.</div>
<h3>2. La solution Cisco : l'architecture Viptela</h3>
<p>La solution SD-WAN de Cisco repose sur la technologie <strong>Viptela</strong>, organisée en <strong>quatre plans</strong> distincts, chacun avec son composant :</p>
<pre class="pseudo"># --- Les 4 composants Viptela ---
# vManage : plan de GESTION (management)
#   -> interface graphique unique, configuration, monitoring, dashboards
# vSmart  : plan de CONTROLE (control)
#   -> distribue les politiques et les routes (protocole OMP), le "cerveau"
# vBond   : plan d'ORCHESTRATION (orchestration)
#   -> point de contact initial, authentifie et met en relation les composants (traverse le NAT)
# vEdge / cEdge : plan de DONNEES (data)
#   -> les routeurs aux sites qui transportent REELLEMENT le trafic</pre>
<h3>3. Le rôle de chaque composant</h3>
<p><strong>vManage</strong> est le tableau de bord : une seule console web pour configurer et superviser toute la fabrique. <strong>vSmart</strong> est le contrôleur central : il ne transporte aucun trafic utilisateur, il calcule et pousse les politiques et les routes via le protocole <strong>OMP</strong> (« Overlay Management Protocol »). <strong>vBond</strong> est l'orchestrateur : c'est le premier point de contact d'un nouvel équipement (« zero-touch provisioning »), il l'authentifie et lui présente les vSmart/vManage ; c'est aussi lui qui aide à traverser le <strong>NAT</strong>. Enfin, les <strong>vEdge</strong> (ou <strong>cEdge</strong> sous IOS-XE) sont les routeurs physiques ou virtuels dans les sites : ils forment l'overlay de données et transportent le trafic réel.</p>
<div class="warn">Ne confonds pas vSmart (contrôle : décide des routes/politiques, ne porte PAS le trafic) et vEdge (données : porte le trafic mais ne décide pas des politiques globales). C'est la traduction concrète de la séparation control plane / data plane.</div>
<h3>4. Le fonctionnement de l'overlay</h3>
<p>Les routeurs edge établissent entre eux un overlay chiffré de tunnels <strong>IPsec</strong>, contrôlé par le vSmart. Le plan de contrôle utilise <strong>OMP</strong> (comparable à un BGP de l'overlay) pour annoncer préfixes, TLOC (« Transport Locators ») et politiques. Le plan de données transporte le trafic directement de site à site (« full mesh » possible) sans passer par le contrôleur. Résultat : le vSmart peut tomber sans couper le trafic déjà établi — le data plane reste autonome.</p>
<h3>5. Les bénéfices concrets</h3>
<pre class="pseudo"># - Zero-touch provisioning : un edge s'auto-configure en contactant vBond
# - Application-aware routing : router selon la qualite (latence/perte/gigue) du lien
# - Transport-agnostic : MPLS, Internet, 4G/5G unifies dans le meme overlay
# - Politiques centralisees : definies une fois sur vManage, appliquees partout
# - Securite : tunnels IPsec de site a site, segmentation</pre>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># SD-WAN = SDN applique au WAN : separer plan de controle et plan de donnees

    { type: "input", q: "Quel sigle (3 lettres) désigne le protocole de gestion de l'overlay SD-WAN ?", a: ["omp", "overlay management protocol"], ph: "3 lettres", exp: "OMP = Overlay Management Protocol." }
  ],

      { type: "qcm", q: "Comment le SD-WAN exploite-t-il à la fois MPLS, Internet et 4G ?", opts: ["Il n'en garde qu'un seul", "Il les unifie dans un même overlay (transport-agnostic) avec routage applicatif", "Il les chiffre en WEP", "Il les convertit en VLAN"], a: 1, exp: "Le SD-WAN est transport-agnostic et route les applications selon la qualité des liens." }
    ],
    solution: "<pre class=\"pseudo\"># Fabrique SD-WAN Cisco (Viptela) - qui fait quoi\n# vManage  (gestion)       : console unique -> config + monitoring\n# vSmart   (controle)      : politiques + routes via OMP, ne porte PAS le trafic\n# vBond    (orchestration) : 1er contact zero-touch, authentification, traverse le NAT\n# vEdge/cEdge (donnees)    : routeurs de site, overlay IPsec, transportent le trafic\n#\n# Transports MPLS + Internet + 4G unifies dans l'overlay (transport-agnostic)\n# Application-aware routing : chaque appli suit le meilleur lien (latence/perte/gigue)\n# Data plane autonome : si vSmart tombe, les tunnels etablis continuent</pre><p>La séparation control plane (vSmart) / data plane (vEdge), orchestrée par vBond et gérée depuis vManage, permet un WAN unifié, économique et résilient.</p>"
