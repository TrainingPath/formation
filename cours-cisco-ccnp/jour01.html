<script>
var DAY = {
  num: 1,
  title: "La certification CCNP : structure et pistes",
  subtitle: "Le niveau professionnel de Cisco : un tronc commun et une spécialité au choix.",
  theory: `
<h3>1. Où se situe le CCNP dans la hiérarchie Cisco ?</h3>
<p>Cisco organise ses certifications en trois grands niveaux : <strong>Associate</strong> (le CCNA, socle des fondamentaux), <strong>Professional</strong> (le CCNP, notre sujet) et <strong>Expert</strong> (le CCIE, le sommet avec examen de laboratoire). Le <strong>CCNP</strong> (« Cisco Certified Network Professional ») s'adresse à un ingénieur qui conçoit, déploie et dépanne des réseaux complexes. Ce cours suppose que le <strong>CCNA est acquis</strong> : on ne réexplique pas le sous-réseautage ni les VLAN de base, on construit par-dessus.</p>
<p>Depuis la refonte de 2020, il n'y a plus de prérequis formel : on peut passer un CCNP sans détenir le CCNA. Dans les faits, sauter le socle Associate est une très mauvaise idée, car les examens Professional tiennent ces bases pour évidentes.</p>
<h3>2. Les six pistes (« tracks ») du CCNP</h3>
<p>Le CCNP n'est pas une certification unique : c'est une <strong>famille de pistes</strong>, chacune correspondant à un domaine de l'ingénierie réseau. Six pistes coexistent :</p>
<pre class="pseudo"># Les pistes CCNP disponibles
Enterprise      -> routage/commutation, WAN, sans-fil, automatisation (notre track)
Security        -> pare-feu, VPN, contrôle d'accès, sécurité du réseau
Data Center     -> UCS, Nexus, stockage, ACI, fabric de datacenter
Service Provider -> réseaux d'opérateurs, MPLS, segment routing, très haut débit
Collaboration   -> voix/vidéo sur IP, téléphonie, présence, messagerie
CyberOps        -> centre opérationnel de sécurité (SOC), détection, réponse à incident</pre>
<p>Chaque piste vise un métier différent. Un architecte de campus vise <strong>Enterprise</strong> ; un administrateur de pare-feu vise <strong>Security</strong> ; un analyste de SOC vise <strong>CyberOps</strong>. Ce cours suit la piste <strong>Enterprise</strong>, la plus généraliste et la plus demandée.</p>
<h3>3. Le principe « core + concentration »</h3>
<p>Toutes les pistes Professional partagent la même mécanique : pour être certifié, il faut réussir <strong>deux examens</strong>. Un <strong>examen de tronc commun</strong> (« core »), obligatoire et unique pour toute la piste, plus un <strong>examen de concentration</strong> à choisir dans une liste. C'est le principe « un noyau, une spécialité ».</p>
<div class="tip">Pense au CCNP comme à un diplôme universitaire : le tronc commun (core) est la matière fondamentale que tout le monde suit ; la concentration est l'option que tu choisis pour te spécialiser. Deux examens réussis = une certification CCNP.</div>
<h3>4. L'exemple de la piste Enterprise</h3>
<p>Pour la piste <strong>CCNP Enterprise</strong>, l'examen de tronc commun s'appelle <strong>ENCOR</strong>, dont le code officiel est <strong>350-401</strong> (« Implementing and Operating Cisco Enterprise Network Core Technologies »). C'est LE cœur de la piste, et c'est celui que ce cours prépare. À côté, on choisit une concentration parmi plusieurs (routage avancé ENARSI, SD-WAN, sans-fil, automatisation, conception).</p>
<pre class="pseudo"># CCNP Enterprise = ENCOR + 1 concentration
Tronc commun : 350-401 ENCOR         (obligatoire, ~120 min)
Concentration (au choix, exemples) :
  300-410 ENARSI  -> routage avancé et services
  300-415 ENSDWI  -> SD-WAN
  300-425 ENWLSD  -> conception sans-fil
  300-435 ENAUTO  -> automatisation et programmabilité</pre>
<div class="warn">Le tronc commun ENCOR sert aussi de <strong>qualification écrite au CCIE Enterprise</strong>. Réussir ENCOR n'est donc pas un petit palier : c'est la pierre angulaire de tout le parcours Enterprise, du Professional jusqu'à l'Expert.</div>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Trois niveaux : Associate (CCNA) &lt; Professional (CCNP) &lt; Expert (CCIE)
# CCNP = 6 pistes : Enterprise, Security, Data Center,
#        Service Provider, Collaboration, CyberOps
# Format = 1 examen CORE (obligatoire) + 1 CONCENTRATION (au choix)
# Enterprise : CORE = 350-401 ENCOR   (préparé par ce cours)
# Ce cours suppose le CCNA acquis : niveau ingénieur.</pre>`,
  exercises: [
    { type: "qcm", q: "À quel niveau de la hiérarchie Cisco correspond le CCNP ?", opts: ["Associate", "Professional", "Expert", "Entry"], a: 1, exp: "CCNP = Cisco Certified Network Professional, le niveau intermédiaire entre CCNA (Associate) et CCIE (Expert)." },
    { type: "qcm", q: "Combien d'examens faut-il réussir pour obtenir une certification CCNP ?", opts: ["Un seul", "Deux", "Trois", "Quatre"], a: 1, exp: "Un examen de tronc commun (core) + un examen de concentration = deux examens." },
    { type: "input", q: "Quel est le nom (acronyme) de l'examen de tronc commun de la piste CCNP Enterprise ?", a: ["encor"], ph: "5 lettres", exp: "ENCOR est le core de la piste Enterprise." },
    { type: "input", q: "Quel est le code officiel de l'examen ENCOR ?", a: ["350-401", "350401"], ph: "chiffres", exp: "Le code officiel d'ENCOR est 350-401." },
    { type: "qcm", q: "Laquelle de ces pistes n'existe PAS parmi les tracks CCNP ?", opts: ["Enterprise", "Data Center", "Blockchain", "Service Provider"], a: 2, exp: "Il n'y a pas de piste Blockchain. Les six pistes sont Enterprise, Security, Data Center, Service Provider, Collaboration, CyberOps." },
    { type: "vf", q: "Le CCNP se compose d'un examen de tronc commun obligatoire et d'un examen de concentration au choix.", a: true, exp: "C'est exactement le principe core + concentration." },
    { type: "qcm", q: "Un ingénieur spécialisé dans les pare-feu et les VPN choisirait quelle piste ?", opts: ["Enterprise", "Security", "Collaboration", "Data Center"], a: 1, exp: "La piste Security couvre pare-feu, VPN et contrôle d'accès." },
    { type: "vf", q: "Depuis la refonte de 2020, détenir le CCNA est un prérequis formel obligatoire pour passer le CCNP.", a: false, exp: "Il n'y a plus de prérequis formel ; mais le CCNA reste vivement recommandé car ses bases sont supposées acquises." },
    { type: "qcm", q: "Que signifie le « core » dans le format CCNP ?", opts: ["Un examen optionnel", "L'examen de tronc commun obligatoire de la piste", "Le laboratoire du CCIE", "Un module de renouvellement"], a: 1, exp: "Le core est l'examen de tronc commun, obligatoire et commun à toute la piste." },
    { type: "input", q: "Quelle piste CCNP est dédiée au centre opérationnel de sécurité (SOC), détection et réponse à incident ?", a: ["cyberops", "cyber ops"], ph: "un mot", exp: "CyberOps est orientée SOC, détection et réponse aux incidents." },
    { type: "qcm", q: "L'examen ENCOR 350-401 sert aussi de qualification à quelle certification supérieure ?", opts: ["CCNA Enterprise", "CCIE Enterprise (qualification écrite)", "CompTIA Network+", "CCT Data Center"], a: 1, exp: "ENCOR fait office de qualification écrite pour le CCIE Enterprise." },
    { type: "qcm", q: "Parmi ces codes, lequel est un examen de CONCENTRATION Enterprise (et non le core) ?", opts: ["350-401", "300-410 ENARSI", "200-301", "350-701"], a: 1, exp: "300-410 ENARSI est une concentration ; 350-401 est le core ; 200-301 est le CCNA." },
    { type: "vf", q: "La piste Enterprise est la plus généraliste et couvre routage, commutation, WAN et automatisation.", a: true, exp: "Oui, Enterprise est la piste la plus large et la plus demandée." },
    { type: "input", q: "Quel niveau de certification Cisco se situe au sommet, avec un examen de laboratoire ?", a: ["ccie", "expert"], ph: "acronyme ou niveau", exp: "Le CCIE (Expert) est le sommet, avec son fameux examen de labo." },
    { type: "qcm", q: "Combien de pistes (tracks) le programme CCNP propose-t-il ?", opts: ["Trois", "Quatre", "Six", "Huit"], a: 2, exp: "Six pistes : Enterprise, Security, Data Center, Service Provider, Collaboration, CyberOps." }
  ],
  final: {
    title: "Exercice final — Construire son parcours CCNP",
    intro: `<p>Sofia, administratrice réseau titulaire du CCNA, veut évoluer vers un poste d'ingénieur réseau d'entreprise. Elle vise le CCNP Enterprise et se demande comment structurer ses révisions et ses examens.</p>`,
    questions: [
      { type: "qcm", q: "Quelle piste Sofia doit-elle viser ?", opts: ["CCNP Security", "CCNP Enterprise", "CCNP Data Center", "CCNP Collaboration"], a: 1, exp: "Un poste d'ingénieur réseau d'entreprise correspond à la piste Enterprise." },
      { type: "input", q: "Quel examen de tronc commun (code) devra-t-elle réussir en premier lieu ?", a: ["350-401", "encor", "350-401 encor"], ph: "code ou nom", exp: "Le core Enterprise est ENCOR 350-401." },
      { type: "qcm", q: "En plus du core, que doit-elle réussir pour être certifiée ?", opts: ["Rien d'autre", "Un examen de concentration au choix", "Deux autres examens core", "Le laboratoire CCIE"], a: 1, exp: "Core + une concentration = CCNP." },
      { type: "vf", q: "Réussir uniquement ENCOR, sans concentration, suffit à obtenir le CCNP Enterprise.", a: false, exp: "Non : il faut aussi valider un examen de concentration." },
      { type: "qcm", q: "Si Sofia veut ensuite viser l'Expert, en quoi ENCOR l'aide-t-il ?", opts: ["Il ne sert plus à rien", "Il fait office de qualification écrite au CCIE Enterprise", "Il remplace le labo CCIE", "Il donne le CCIE automatiquement"], a: 1, exp: "ENCOR est la qualification écrite du CCIE Enterprise ; reste le labo." }
    ],
    solution: `<pre class="pseudo"># Parcours de Sofia (CCNP Enterprise)
Piste choisie : Enterprise
Etape 1 : reussir le CORE  -> 350-401 ENCOR
Etape 2 : reussir 1 CONCENTRATION (ex : 300-410 ENARSI)
=> CCNP Enterprise obtenu (2 examens)
Bonus : ENCOR = qualification ecrite pour viser le CCIE Enterprise.</pre>
<p>Sofia a désormais une feuille de route claire. Demain : on détaille le format « core + concentration » et le catalogue précis des examens Enterprise.</p>`
  }
};
