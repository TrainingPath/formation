var DAY = {
  num: 13,
  title: "Le sans-fil d'entreprise (architectures, roaming)",
  subtitle: "Gérer des centaines de bornes Wi-Fi comme un seul système cohérent.",
  theory: `
<h3>1. Autonome ou centralisé ?</h3>
<p>Une petite installation utilise des bornes <strong>autonomes</strong> (« autonomous AP ») : chaque point d'accès contient sa propre configuration. À grande échelle, c'est ingérable : mille bornes = mille configurations à maintenir. L'entreprise passe alors au modèle <strong>centralisé</strong>, où un <strong>contrôleur WLAN</strong> (« WLC », Wireless LAN Controller) pilote des bornes <strong>légères</strong> (« lightweight AP »). Le WLC devient le cerveau unique : politiques, sécurité, canaux et puissance sont gérés au même endroit.</p>
<div class="tip">Analogie : une borne autonome est un commerçant indépendant qui gère seul sa boutique ; le modèle WLC est une chaîne de magasins pilotée par un siège central qui fixe les règles pour tous.</div>
<h3>2. CAPWAP et le split-MAC</h3>
<p>Entre chaque borne légère et le WLC s'établit un tunnel <strong>CAPWAP</strong> (« Control And Provisioning of Wireless Access Points »). Il comporte deux canaux : un canal de <strong>contrôle</strong> (chiffré, DTLS, port <strong>UDP 5246</strong>) et un canal de <strong>données</strong> (port <strong>UDP 5247</strong>) qui encapsule le trafic des clients.</p>
<p>Le modèle est dit <strong>split-MAC</strong> : les fonctions de la couche MAC 802.11 sont <em>réparties</em> entre la borne et le contrôleur. La borne garde le <strong>temps réel</strong> (émission des balises « beacons », accusés de réception, chiffrement radio) ; le WLC gère le <strong>reste</strong> (authentification, association, mobilité, politiques QoS et sécurité).</p>
<pre class="pseudo"># CAPWAP - deux canaux
# Controle : UDP 5246, chiffre par DTLS  (gestion, join, config)
# Donnees  : UDP 5247                     (trafic des clients encapsule)
#
# Split-MAC :
#   AP (temps reel)  -> beacons, ACK, chiffrement/dechiffrement radio
#   WLC (le reste)   -> auth, association, roaming, QoS, securite</pre>
<h3>3. Modes de déploiement CAPWAP</h3>
<p>En mode <strong>local</strong> (centralisé), tout le trafic client remonte au WLC par le tunnel : contrôle total mais dépendance au lien. En mode <strong>FlexConnect</strong> (« flex »), la borne d'un site distant peut commuter le trafic <em>localement</em> (« local switching ») et continuer à servir les clients même si le lien vers le WLC tombe — idéal pour les agences.</p>
<h3>4. Le SSID et le mapping VLAN</h3>
<p>Un <strong>WLAN</strong>/<strong>SSID</strong> (le nom de réseau visible) est associé sur le WLC à une <strong>interface</strong> ou un <strong>VLAN</strong> filaire. Ainsi le Wi-Fi « Invités » débouche sur le VLAN invités, et « Corp » sur le VLAN interne. On sépare les usages sans multiplier les bornes.</p>
<h3>5. Le roaming : passer d'une borne à l'autre</h3>
<p>Quand un utilisateur se déplace, son appareil bascule vers une borne au meilleur signal : c'est le <strong>roaming</strong> (« itinérance »). Deux cas :</p>
<pre class="pseudo"># Roaming L2 : les deux bornes sont dans le MEME VLAN / sous-reseau
#   -> le client GARDE son adresse IP, transition rapide
# Roaming L3 : les bornes sont dans des sous-reseaux DIFFERENTS
#   -> il faut un tunnel de mobilite entre WLC (ancre/anchor)
#      pour conserver la session sans changer d'IP</pre>
<div class="warn">Un roaming L3 mal conçu coupe la session (l'IP change) : appels VoIP interrompus, VPN relancé. On utilise des groupes de mobilité (« mobility groups ») entre WLC pour maintenir la session via un WLC « ancre ».</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># WLC : cerveau central des bornes LEGERES (lightweight) ; bornes autonomes = petits sites
# CAPWAP : tunnel AP<->WLC, controle UDP 5246 (DTLS) + donnees UDP 5247
# Split-MAC : AP = temps reel (beacons/ACK/chiffrement) ; WLC = auth/assoc/roaming/QoS
# FlexConnect : commutation locale sur site distant (survie si lien WLC coupe)
# Roaming L2 : meme VLAN, garde l'IP ; L3 : sous-reseaux differents, tunnel de mobilite</pre>`,

    { type: "qcm", q: "Quel mode permet à une borne d'un site distant de commuter le trafic localement ?", opts: ["Local mode", "FlexConnect", "Monitor", "Sniffer"], a: 1, exp: "FlexConnect fait de la commutation locale et survit à une coupure du lien WLC." },
    { type: "qcm", q: "Lors d'un roaming L2, qu'arrive-t-il à l'adresse IP du client ?", opts: ["Elle change à chaque borne", "Elle est conservée (même sous-réseau)", "Elle est supprimée", "Elle devient publique"], a: 1, exp: "En L2, mêmes VLAN/sous-réseau : le client garde son IP, transition rapide." },
    { type: "vf", q: "Le canal de contrôle CAPWAP est chiffré par DTLS.", a: true, exp: "Le contrôle (UDP 5246) est protégé par DTLS." },
    { type: "vf", q: "Une borne autonome dépend d'un WLC pour fonctionner.", a: false, exp: "L'autonome contient sa propre config ; c'est la borne légère qui dépend du WLC." },
    { type: "vf", q: "Dans split-MAC, le WLC gère l'authentification et l'association des clients.", a: true, exp: "Auth, association, mobilité et politiques remontent au WLC." },
    { type: "vf", q: "Un roaming L3 se produit quand les bornes sont dans des sous-réseaux différents.", a: true, exp: "En L3, changer de sous-réseau impose un tunnel de mobilité pour garder la session." },
    { type: "input", q: "Comment appelle-t-on (un terme anglais) les bornes pilotées par un WLC ?", a: ["lightweight", "lightweight ap", "légères", "legeres", "borne légère"], ph: "un terme", exp: "Les bornes légères (lightweight APs) sont pilotées par le WLC." },
    { type: "input", q: "Quel sigle désigne le protocole de tunnel entre AP et contrôleur ?", a: ["capwap"], ph: "6 lettres", exp: "CAPWAP = Control And Provisioning of Wireless Access Points." },
    { type: "input", q: "Comment nomme-t-on (un mot) le fait de passer d'une borne à une autre en se déplaçant ?", a: ["roaming", "itinérance", "itinerance"], ph: "un mot", exp: "Le roaming (itinérance) bascule le client vers la meilleure borne." },
    { type: "input", q: "Quel port UDP transporte les données clients dans CAPWAP ?", a: ["5247", "udp 5247"], ph: "un numéro", exp: "Le canal de données CAPWAP utilise UDP 5247." },
    { type: "input", q: "Comment appelle-t-on le modèle où les fonctions MAC 802.11 sont réparties entre AP et WLC ?", a: ["split-mac", "split mac", "splitmac"], ph: "split-...", exp: "Le modèle split-MAC répartit les fonctions MAC entre la borne et le contrôleur." }
  ],
  final: {
    title: "Exercice final — Déployer un Wi-Fi centralisé multi-sites",
    intro: "<p>Une entreprise a un siège avec un WLC et plusieurs agences distantes reliées par WAN. Les employés se déplacent dans les couloirs du siège et voyagent entre agences. Tu conçois l'architecture.</p>",
    questions: [
      { type: "qcm", q: "Quel modèle choisis-tu pour gérer des centaines de bornes uniformément ?", opts: ["Bornes autonomes indépendantes", "Bornes légères pilotées par un WLC", "Un routeur par borne", "Aucune gestion centralisée"], a: 1, exp: "Le modèle WLC + bornes légères centralise la gestion à grande échelle." },
      { type: "qcm", q: "Pour qu'une agence garde son Wi-Fi même si le lien vers le WLC tombe, tu configures les bornes en…", opts: ["Local mode", "FlexConnect (commutation locale)", "Sniffer", "Rogue"], a: 1, exp: "FlexConnect commute localement et résiste à une coupure du lien WLC." },
      { type: "input", q: "Dans les couloirs du siège, les bornes sont dans le même VLAN : de quel type de roaming s'agit-il ?", a: ["l2", "roaming l2", "couche 2", "layer 2"], ph: "L2 ou L3 ?", exp: "Même VLAN = roaming L2, le client garde son IP." },
      { type: "vf", q: "Le tunnel CAPWAP de contrôle utilise UDP 5246 et est chiffré par DTLS.", a: true, exp: "Contrôle = UDP 5246 protégé par DTLS." },
      { type: "qcm", q: "Pour maintenir une session VoIP lors d'un roaming entre sous-réseaux différents, il faut…", opts: ["Changer d'IP à chaque fois", "Un tunnel de mobilité entre WLC (roaming L3)", "Désactiver le chiffrement", "Un seul SSID par borne"], a: 1, exp: "Le roaming L3 via un WLC ancre garde la session malgré le changement de sous-réseau." }
    ],
    solution: "<pre class=\"pseudo\"># Architecture recommandee\n# - Siege : WLC + bornes LEGERES (lightweight) en local mode\n#   -> tunnel CAPWAP (controle UDP 5246 DTLS + donnees UDP 5247)\n# - Couloirs du siege : meme VLAN -> roaming L2 (IP conservee, rapide)\n# - Agences : bornes en FlexConnect (commutation locale)\n#   -> le Wi-Fi survit meme si le WAN vers le WLC tombe\n# - Mobilite inter-sous-reseaux : mobility group + WLC ancre -> roaming L3\n#   -> sessions VoIP/VPN maintenues sans changement d'IP</pre><p>Un WLC central, des bornes légères, FlexConnect pour les agences et des groupes de mobilité pour le roaming L3 offrent un Wi-Fi cohérent et résilient.</p>"
