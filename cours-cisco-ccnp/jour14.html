var DAY = {

  title: "La sécurité et la QoS du sans-fil",
  subtitle: "Authentifier chaque utilisateur et prioriser la voix sur l'air partagé.",
  theory: `
<h3>1. Personal ou Enterprise ?</h3>
<p>Le Wi-Fi se sécurise selon deux grandes familles. En mode <strong>Personal</strong> (« PSK », Pre-Shared Key), tout le monde partage le <em>même</em> mot de passe : simple pour la maison, mais dangereux en entreprise (un départ = changer la clé partout). En mode <strong>Enterprise</strong>, chaque utilisateur possède ses <em>propres</em> identifiants, vérifiés par un serveur central via <strong>802.1X</strong>. On révoque un seul compte sans toucher aux autres.</p>
<h3>2. WPA2 et WPA3</h3>
<p><strong>WPA2</strong> (2004, norme 802.11i) chiffre avec <strong>AES-CCMP</strong> : c'est le socle de la sécurité Wi-Fi moderne. <strong>WPA3</strong> (2018) le renforce : en Personal il remplace la PSK par <strong>SAE</strong> (« Simultaneous Authentication of Equals », protocole Dragonfly) qui résiste aux attaques par dictionnaire hors ligne ; en Enterprise il propose un mode 192 bits. Les deux existent en variante <strong>Enterprise</strong> reposant sur 802.1X.</p>
<div class="tip">SAE apporte le « forward secrecy » : même si le mot de passe fuite plus tard, les communications déjà capturées ne peuvent pas être déchiffrées rétroactivement.</div>
<h3>3. 802.1X : les trois acteurs</h3>
<p>L'authentification <strong>802.1X</strong> met en scène trois rôles :</p>
<pre class="pseudo"># Supplicant     : le client (le PC / smartphone qui veut se connecter)
# Authenticator  : le point d'acces / WLC (le portier, qui relaie)
# Authentication Server : le serveur RADIUS (qui decide oui/non)
#
# Transport des credentials : EAP encapsule dans 802.1X (EAPOL cote air),
#   puis RADIUS entre l'authenticator et le serveur.</pre>
<p>Le dialogue utilise <strong>EAP</strong> (« Extensible Authentication Protocol ») avec des méthodes comme <strong>EAP-TLS</strong> (certificats des deux côtés, le plus sûr), <strong>PEAP</strong> ou <strong>EAP-TTLS</strong> (identifiant/mot de passe dans un tunnel TLS). Le serveur <strong>RADIUS</strong> (souvent Cisco ISE) valide l'utilisateur et peut renvoyer un VLAN ou des règles dynamiques.</p>
<div class="warn">Ne confonds pas EAP-TLS (certificats clients, robuste mais lourd à déployer) et PEAP (mot de passe, plus simple mais dépendant de la solidité des mots de passe). Le choix de la méthode EAP est une décision de sécurité majeure.</div>
<h3>4. La QoS sur le Wi-Fi : WMM</h3>
<p>L'air est un média <strong>partagé et half-duplex</strong> : tout le monde parle sur la même fréquence. Sans priorité, un gros téléchargement écrase un appel VoIP. Le Wi-Fi utilise <strong>WMM</strong> (« Wi-Fi Multimedia », basé sur 802.11e) qui définit <strong>4 catégories d'accès</strong> (« Access Categories ») par ordre de priorité :</p>
<pre class="pseudo"># AC_VO : Voice (voix)       -> priorite la plus haute
# AC_VI : Video (video)
# AC_BE : Best Effort (defaut)
# AC_BK : Background (fond)  -> priorite la plus basse
# Chaque AC a ses temporisateurs (AIFS, fenetre de contention) :
#   plus la priorite est haute, plus l'acces au media est rapide.</pre>
<h3>5. Le marquage QoS de bout en bout</h3>
<p>Pour que la priorité survive du Wi-Fi au réseau filaire, on <strong>mappe</strong> les balises : le <strong>DSCP</strong> (« Differentiated Services Code Point », marquage IP de couche 3, ex : <strong>EF</strong> = 46 pour la voix) est traduit en catégorie WMM/UP côté air, et réciproquement. Le WLC assure ce mapping DSCP ↔ UP (« User Priority » 802.11e / 802.1p) et applique éventuellement un plafond de trust.</p>
<div class="tip">Bonne pratique : marquer la voix en <strong>DSCP EF (46)</strong> et la vidéo en <strong>AF41 (34)</strong>, puis vérifier que le WLC les mappe bien vers AC_VO et AC_VI. Une balise perdue = pas de priorité.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Personal (PSK) = mot de passe partage | Enterprise (802.1X) = identifiants par utilisateur
# WPA2 : AES-CCMP (802.11i) | WPA3 : SAE (Personal, anti-dictionnaire) + mode 192 bits
# 802.1X : supplicant (client) / authenticator (AP-WLC) / serveur RADIUS ; transport EAP
# Methodes EAP : EAP-TLS (certificats), PEAP/EAP-TTLS (mot de passe dans TLS)
# WMM (802.11e) : 4 AC -> VO > VI > BE > BK ; mapping DSCP (EF=46) <-> UP pour la QoS</pre>`,

    { type: "qcm", q: "Quelle catégorie d'accès WMM a la priorité la plus haute ?", opts: ["AC_BK (Background)", "AC_BE (Best Effort)", "AC_VI (Video)", "AC_VO (Voice)"], a: 3, exp: "AC_VO (voix) est la plus prioritaire, devant VI, BE puis BK." },
    { type: "vf", q: "En mode Personal (PSK), tous les appareils partagent le même mot de passe.", a: true, exp: "La PSK est commune ; d'où la difficulté de révocation en entreprise." },

    { type: "input", q: "Comment s'appelle (un mot anglais) le client dans le modèle 802.1X ?", a: ["supplicant", "le supplicant"], ph: "un mot", exp: "Le supplicant est le poste client qui demande l'accès." },
    { type: "input", q: "Quel mécanisme remplace la PSK dans WPA3-Personal ?", a: ["sae", "dragonfly", "simultaneous authentication of equals"], ph: "3 lettres", exp: "SAE (Dragonfly) remplace la PSK et résiste aux attaques hors ligne." },
    { type: "input", q: "Quelle valeur DSCP (nom ou numéro) marque généralement la voix ?", a: ["ef", "46", "ef 46", "expedited forwarding"], ph: "EF ou un numéro", exp: "La voix se marque DSCP EF (46), mappée vers AC_VO." },
    { type: "input", q: "Quel sigle désigne le mécanisme de QoS Wi-Fi basé sur 802.11e ?", a: ["wmm", "wi-fi multimedia", "wifi multimedia"], ph: "3 lettres", exp: "WMM (Wi-Fi Multimedia) implémente les catégories d'accès de 802.11e." }
  ],

    questions: [

    ],
    solution: "<pre class=\"pseudo\"># Securite du SSID Corp\n# - WPA2/WPA3-Enterprise (802.1X)\n#   supplicant (PC) <-> authenticator (AP/WLC) <-> RADIUS (Cisco ISE)\n#   methode EAP : EAP-TLS (certificats) ou PEAP (mot de passe dans TLS)\n#   -> chaque employe a ses identifiants, revocation individuelle\n#\n# QoS voix\n# - WMM active : la voix -> AC_VO (priorite maximale)\n# - Marquage DSCP EF (46) cote filaire, mappe vers AC_VO cote air\n#   -> l'appel VoIP passe avant les telechargements (AC_BE/BK)</pre><p>WPA2/WPA3-Enterprise avec 802.1X sécurise chaque utilisateur, et WMM avec le mapping DSCP EF vers AC_VO garantit une voix fluide.</p>"
