var DAY = {
  num: 29,
  title: "Aperçu CCNP Security & Data Center",
  subtitle: "Le CCNP Enterprise n'est qu'une piste : la sécurité et le data center ont les leurs.",
  theory: `
<h3>1. Une même architecture, plusieurs pistes CCNP</h3>
<p>Le niveau <strong>CCNP</strong> (Cisco Certified Network Professional) n'existe pas qu'en version Enterprise. Cisco décline le professional en plusieurs <strong>pistes</strong> : Enterprise, <strong>Security</strong>, <strong>Data Center</strong>, Collaboration, Service Provider, etc. Toutes partagent la même logique apprise au jour 28 : <strong>un examen core + une concentration</strong>. Si le routage/commutation d'entreprise ne te passionne pas, une autre piste correspond peut-être mieux à ta carrière.</p>
<pre class="pseudo"># Meme formule pour toutes les pistes CCNP
CCNP &lt;piste&gt; = 1 examen CORE + 1 examen de CONCENTRATION
# Enterprise   -> core ENCOR 350-401
# Security     -> core SCOR 350-701
# Data Center  -> core DCCOR 350-601</pre>
<h3>2. CCNP Security : le core SCOR 350-701</h3>
<p>La piste <strong>CCNP Security</strong> a pour core l'examen <strong>SCOR 350-701</strong> (« Implementing and Operating Cisco Security Core Technologies »). Il couvre la sécurité réseau, le cloud, la sécurité du contenu, la protection des accès (endpoint), la visibilité et l'application des politiques. On y retrouve des technologies Cisco comme les pare-feux <strong>ASA</strong> et <strong>Firepower</strong>, l'authentification via <strong>ISE</strong> (Identity Services Engine), les VPN, et la protection de la messagerie/du web.</p>
<div class="tip">SCOR 350-701 est aussi la première étape du CCIE Security. Comme pour Enterprise, réussir le core d'une piste ouvre la voie vers son CCIE.</div>
<h3>3. CCNP Data Center : le core DCCOR 350-601</h3>
<p>La piste <strong>CCNP Data Center</strong> a pour core l'examen <strong>DCCOR 350-601</strong> (« Implementing and Operating Cisco Data Center Core Technologies »). Elle s'adresse à celles et ceux qui opèrent les <strong>centres de données</strong> : réseau du data center, calcul (serveurs), stockage, automatisation et sécurité propres au data center. Deux technologies phares y apparaissent : <strong>NX-OS</strong> et <strong>ACI</strong>.</p>
<h3>4. NX-OS et ACI : le vocabulaire du data center</h3>
<p><strong>NX-OS</strong> est le système d'exploitation des commutateurs <strong>Nexus</strong> de Cisco, pensé pour le data center (haute densité, fonctionnalités avancées comme VXLAN, vPC). Il ressemble à IOS mais avec ses propres particularités. <strong>ACI</strong> (Application Centric Infrastructure) est l'approche <strong>SDN</strong> (Software-Defined Networking) de Cisco pour le data center : un contrôleur central, l'<strong>APIC</strong> (Application Policy Infrastructure Controller), pilote une <em>fabric</em> de commutateurs Nexus selon des <strong>politiques applicatives</strong> plutôt que boîte par boîte.</p>
<pre class="pseudo"># Repères data center
NX-OS : OS des commutateurs Nexus (VXLAN, vPC, ...)
ACI   : SDN data center pilote par le controleur APIC
        -&gt; on decrit des politiques applicatives,
           la fabric applique la configuration.</pre>
<div class="warn">Ne confonds pas les codes des cores : ENCOR 350-401 (Enterprise), SCOR 350-701 (Security), DCCOR 350-601 (Data Center). Ces numéros tombent souvent aux examens.</div>
<h3>5. Comment choisir sa piste ?</h3>
<p>Si ton quotidien tourne autour des <strong>pare-feux, du VPN, de l'authentification et de la défense</strong>, la piste <strong>Security</strong> est faite pour toi. Si tu opères des <strong>serveurs, du stockage et des commutateurs Nexus</strong> dans un centre de données, vise la piste <strong>Data Center</strong>. Rien n'empêche, au fil d'une carrière, de cumuler plusieurs pistes CCNP : les compétences réseau apprises dans l'Enterprise restent un socle utile partout.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Pistes CCNP : Enterprise, Security, Data Center, ...
# Chaque piste = 1 CORE + 1 CONCENTRATION
#   Security    : core SCOR 350-701 (ASA, Firepower, ISE, VPN)
#   Data Center : core DCCOR 350-601 (NX-OS, ACI)
# NX-OS : OS des commutateurs Nexus
# ACI   : SDN data center + controleur APIC (politiques appli)
# Chaque core est la 1re marche du CCIE de sa piste</pre>`,
  exercises: [
    { type: "qcm", q: "Quel est l'examen core de la piste CCNP Security ?", opts: ["ENCOR 350-401", "SCOR 350-701", "DCCOR 350-601", "ENARSI 300-410"], a: 1, exp: "Le core Security est le SCOR 350-701." },
    { type: "input", q: "Quel est le numéro de l'examen core CCNP Data Center (DCCOR) ? (format xxx-xxx)", a: ["350-601", "350601"], ph: "xxx-xxx", exp: "Le core Data Center est le DCCOR 350-601." },
    { type: "qcm", q: "NX-OS est le système d'exploitation de quels commutateurs Cisco ?", opts: ["Catalyst", "Nexus", "Meraki", "Aironet"], a: 1, exp: "NX-OS équipe les commutateurs Nexus, dédiés au data center." },

    { type: "input", q: "Comment s'appelle le contrôleur central qui pilote une fabric ACI ? (sigle)", a: ["apic"], ph: "sigle du contrôleur", exp: "L'APIC (Application Policy Infrastructure Controller) pilote la fabric ACI." },
    { type: "qcm", q: "Quel core viserait un ingénieur spécialisé en pare-feux et VPN ?", opts: ["DCCOR 350-601", "SCOR 350-701", "ENCOR 350-401", "ENSDWI 300-415"], a: 1, exp: "La sécurité (pare-feux, VPN) relève du core SCOR 350-701." },
    { type: "vf", q: "DCCOR 350-601 est le core de la piste CCNP Data Center.", a: true, exp: "Vrai : DCCOR 350-601 est bien le core Data Center." },
    { type: "input", q: "Quelle solution Cisco d'authentification et de contrôle d'accès (Identity Services Engine) apparaît dans le CCNP Security ? (sigle)", a: ["ise"], ph: "3 lettres", exp: "ISE = Identity Services Engine, pour l'authentification et les politiques d'accès." },
    { type: "qcm", q: "ACI repose sur quel paradigme réseau ?", opts: ["Le routage à vecteur de distance", "Le SDN (Software-Defined Networking)", "Le Telnet", "Le spanning-tree classique uniquement"], a: 1, exp: "ACI est l'approche SDN de Cisco pour le data center." },
    { type: "vf", q: "Réussir le core d'une piste (par exemple SCOR) est aussi la première étape du CCIE correspondant.", a: true, exp: "Vrai : chaque core amorce le parcours CCIE de sa piste." },
    { type: "qcm", q: "Quels pare-feux Cisco sont typiquement abordés dans le CCNP Security ?", opts: ["Nexus et Catalyst", "ASA et Firepower", "APIC et vPC", "Meraki MX uniquement"], a: 1, exp: "Les pare-feux ASA et Firepower sont au cœur du CCNP Security." },
    { type: "input", q: "Quel est le numéro de l'examen core CCNP Security (SCOR) ? (format xxx-xxx)", a: ["350-701", "350701"], ph: "xxx-xxx", exp: "Le core Security est le SCOR 350-701." },
    { type: "qcm", q: "Sur quel critère choisir entre les pistes Security et Data Center ?", opts: ["Le salaire moyen affiché dans les annonces", "Son métier réel : défense/pare-feux vs serveurs/stockage/Nexus", "La piste réputée la plus facile", "La piste la plus récente"], a: 1, exp: "On choisit la piste selon son métier : sécurité ou opérations de data center." },
    { type: "vf", q: "NX-OS et IOS sont exactement le même système d'exploitation, sans aucune différence.", a: false, exp: "Faux : NX-OS ressemble à IOS mais possède ses propres particularités (data center)." }
  ],
  final: {
    title: "Exercice final — Orienter deux profils différents",
    intro: `<p>Deux ingénieurs demandent conseil. Karim administre des serveurs et des commutateurs Nexus dans un centre de données. Lena configure des pare-feux, du VPN et de l'authentification ISE. Aide chacun à choisir sa piste CCNP.</p>`,
    questions: [
      { type: "qcm", q: "Quelle piste CCNP conseilles-tu à Karim (serveurs, stockage, Nexus) ?", opts: ["Security", "Data Center", "Collaboration", "Aucune"], a: 1, exp: "Le data center (Nexus, stockage) relève de la piste CCNP Data Center." },
      { type: "input", q: "Quel examen core Karim doit-il viser ? (nom ou numéro)", a: ["dccor", "dccor 350-601", "350-601"], ph: "core data center", exp: "Karim vise le core DCCOR 350-601." },
      { type: "qcm", q: "Quelle piste conseilles-tu à Lena (pare-feux, VPN, ISE) ?", opts: ["Data Center", "Security", "Enterprise", "Service Provider"], a: 1, exp: "Pare-feux, VPN et ISE relèvent de la piste CCNP Security." },
      { type: "input", q: "Quel examen core Lena doit-elle viser ? (nom ou numéro)", a: ["scor", "scor 350-701", "350-701"], ph: "core security", exp: "Lena vise le core SCOR 350-701." },
      { type: "vf", q: "Chacun devra ensuite ajouter un examen de concentration à son core pour valider son CCNP.", a: true, exp: "Vrai : la formule core + concentration s'applique à toutes les pistes." }
    ],
    solution: `<pre class="pseudo"># Orientation
Karim (Nexus, stockage) -> CCNP Data Center, core DCCOR 350-601
Lena  (pare-feux, VPN, ISE) -> CCNP Security, core SCOR 350-701
Ensuite : chacun ajoute 1 concentration a son core.
# Rappels cores :
Enterprise  : ENCOR 350-401
Security     : SCOR 350-701
Data Center  : DCCOR 350-601</pre>
<p>Une piste, un core, une concentration : la logique CCNP est la même partout. Demain, place à la pratique avec un scénario d'entreprise complexe.</p>`
