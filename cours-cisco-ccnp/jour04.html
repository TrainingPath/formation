<script>
var DAY = {
  num: 4,
  title: "La virtualisation : machines, conteneurs, réseau",
  subtitle: "Faire tourner plusieurs mondes isolés sur un seul matériel.",
  theory: `
<h3>1. L'idée fondatrice : découpler le logiciel du matériel</h3>
<p>Historiquement, un serveur physique faisait tourner un système et une application. Résultat : des machines sous-utilisées, chères et rigides. La <strong>virtualisation</strong> casse ce lien : elle permet à <strong>plusieurs systèmes isolés</strong> de partager le même matériel, chacun croyant disposer de sa propre machine. C'est le socle du datacenter et du cloud modernes, et un domaine explicitement couvert par ENCOR.</p>
<h3>2. L'hyperviseur et les machines virtuelles</h3>
<p>Une <strong>machine virtuelle</strong> (« VM ») est un ordinateur complet émulé par logiciel : son propre système d'exploitation, son noyau, sa mémoire, ses disques virtuels. Le chef d'orchestre s'appelle l'<strong>hyperviseur</strong>, qui répartit le matériel réel (CPU, RAM, réseau) entre les VM. On distingue deux types :</p>
<pre class="pseudo"># Types d'hyperviseurs
Type 1 (bare-metal) : posé DIRECTEMENT sur le matériel
    ex : VMware ESXi, Microsoft Hyper-V, KVM
    -> performant, pour serveurs et datacenters
Type 2 (hosted)     : posé PAR-DESSUS un OS existant
    ex : VirtualBox, VMware Workstation
    -> pratique sur un poste de travail, moins performant</pre>
<div class="tip">Analogie : l'hyperviseur de type 1 est le propriétaire d'un immeuble bâti sur un terrain nu (le matériel). Le type 2 est un locataire qui sous-loue des chambres dans un appartement déjà meublé (un OS déjà installé). Le type 1 est plus direct, donc plus rapide.</div>
<h3>3. Les conteneurs : plus légers que les VM</h3>
<p>Un <strong>conteneur</strong> (« container ») emballe une application et ses dépendances, mais <strong>partage le noyau du système hôte</strong> au lieu d'embarquer son propre OS. Il n'y a pas d'hyperviseur : un <strong>moteur de conteneurs</strong> (comme Docker) isole les processus. Résultat : les conteneurs démarrent en secondes, pèsent des mégaoctets là où une VM pèse des gigaoctets, et on en empile bien plus sur une même machine.</p>
<pre class="pseudo"># VM vs Conteneur
VM        : [App][Bins][OS invité complet] sur hyperviseur -> lourd, isolé fort
Conteneur : [App][Bins]                    partage noyau hôte -> léger, dense
# Compromis : VM = isolation plus forte ; Conteneur = densité et rapidité</pre>
<div class="warn">Un conteneur n'est PAS une mini-VM. Comme il partage le noyau de l'hôte, son isolation est moins étanche : on ne fait pas tourner deux noyaux différents (ex : Windows et Linux) dans des conteneurs sur le même hôte comme on le ferait avec des VM. Le choix VM/conteneur est un compromis isolation / légèreté.</div>
<h3>4. La virtualisation du réseau</h3>
<p>On ne virtualise pas que des serveurs : on virtualise aussi le <strong>réseau</strong>. Plusieurs briques y contribuent :</p>
<pre class="pseudo"># Briques de virtualisation réseau
vSwitch          -> commutateur virtuel reliant les VM dans l'hôte
VLAN             -> segmente un réseau physique en réseaux logiques (couche 2)
VRF              -> tables de routage multiples et étanches sur un même routeur
Tunnels (VXLAN, GRE) -> réseaux superposés (overlay) au-dessus du réseau physique
NFV              -> fonctions réseau (pare-feu, routeur) en logiciel plutôt qu'en boîtier</pre>
<p>La <strong>VXLAN</strong> mérite une mention : elle encapsule de la couche 2 dans de l'UDP pour étendre des segments à travers un réseau routé, brique clé des fabrics de datacenter modernes. La <strong>NFV</strong> (« Network Functions Virtualization ») remplace des appliances matérielles par des logiciels, alignant le réseau sur la souplesse de la virtualisation serveur.</p>
<h3>5. Ce qu'il faut retenir</h3>
<pre class="pseudo"># VM        : OS invité complet + hyperviseur (type 1 bare-metal / type 2 hosted)
# Conteneur : partage le noyau hôte, léger et rapide (moteur type Docker)
# Compromis : VM = isolation forte ; conteneur = densité, démarrage rapide
# Réseau virtualisé : vSwitch, VLAN, VRF, tunnels (VXLAN/GRE), NFV
# Objectif commun : découpler le logiciel du matériel physique.</pre>`,
  exercises: [
    { type: "qcm", q: "Quel composant répartit le matériel réel entre plusieurs machines virtuelles ?", opts: ["Le conteneur", "L'hyperviseur", "Le vSwitch", "Le noyau invité"], a: 1, exp: "L'hyperviseur alloue CPU, RAM et réseau aux VM." },
    { type: "qcm", q: "Un hyperviseur de type 1 (bare-metal) s'installe…", opts: ["Par-dessus un OS existant", "Directement sur le matériel", "Dans un conteneur", "Dans une VM"], a: 1, exp: "Le type 1 se pose directement sur le matériel (ESXi, Hyper-V, KVM)." },

    { type: "qcm", q: "Lequel est un hyperviseur de type 1 ?", opts: ["VirtualBox", "VMware Workstation", "VMware ESXi", "Docker"], a: 2, exp: "ESXi est un hyperviseur bare-metal (type 1)." },
    { type: "qcm", q: "À quoi sert un vSwitch ?", opts: ["À router entre AS", "À commuter le trafic entre VM à l'intérieur d'un hôte", "À chiffrer un WAN", "À empiler des conteneurs"], a: 1, exp: "Le vSwitch est un commutateur virtuel reliant les VM au sein de l'hôte." },
    { type: "qcm", q: "Que permet un VRF sur un routeur ?", opts: ["Plusieurs tables de routage étanches sur un même routeur", "Un chiffrement matériel", "Un seul VLAN global", "Le remplacement de l'hyperviseur"], a: 0, exp: "Le VRF crée des tables de routage multiples et isolées sur le même équipement." },
    { type: "input", q: "Quelle technologie encapsule de la couche 2 dans de l'UDP pour étendre des segments à travers un réseau routé ?", a: ["vxlan"], ph: "un sigle", exp: "VXLAN encapsule la couche 2 dans UDP, brique des fabrics de datacenter." },
    { type: "vf", q: "La NFV remplace des boîtiers réseau matériels par des fonctions logicielles.", a: true, exp: "NFV = Network Functions Virtualization : pare-feu, routeurs, etc. en logiciel." },
    { type: "qcm", q: "Principal avantage des conteneurs pour la densité d'un serveur ?", opts: ["Ils consomment plus de RAM", "On peut en empiler beaucoup plus qu'avec des VM", "Ils nécessitent chacun un OS complet", "Ils exigent un hyperviseur type 1"], a: 1, exp: "Légers, les conteneurs se déploient en bien plus grand nombre par machine." },
    { type: "qcm", q: "Pourquoi ne peut-on pas facilement faire tourner un noyau Windows et un noyau Linux dans deux conteneurs sur le même hôte ?", opts: ["Parce que Docker l'interdit par licence", "Parce que les conteneurs partagent le noyau de l'hôte", "Parce que c'est plus lent", "Parce qu'il faut deux hyperviseurs"], a: 1, exp: "Les conteneurs partagent le noyau hôte : ils ne peuvent pas exécuter un noyau différent." },
    { type: "input", q: "Quel objectif commun poursuivent VM, conteneurs et virtualisation réseau ?", a: ["découpler le logiciel du matériel", "decoupler le logiciel du materiel", "abstraction du matériel", "abstraction du materiel"], ph: "une idée", exp: "Tous découplent le logiciel du matériel physique." }
  ],
  final: {
    title: "Exercice final — VM ou conteneur ?",
    intro: `<p>Une équipe doit héberger : (1) une vieille application qui exige un noyau Windows complet et une forte isolation, et (2) une nouvelle API web sans état à déployer en dizaines d'instances qui démarrent vite. Aide-la à choisir.</p>`,
    questions: [
      { type: "qcm", q: "Pour la vieille application Windows exigeant une forte isolation, on choisit…", opts: ["Un conteneur", "Une machine virtuelle", "Un vSwitch", "Un VRF"], a: 1, exp: "Une VM : OS invité complet et isolation forte." },
      { type: "qcm", q: "Pour l'API web démultipliée en dizaines d'instances rapides, on choisit…", opts: ["Des machines virtuelles lourdes", "Des conteneurs", "Un hyperviseur type 2", "Un tunnel GRE"], a: 1, exp: "Des conteneurs : légers, denses et à démarrage rapide." },
      { type: "input", q: "Quel type d'hyperviseur (numéro) pour un serveur de datacenter performant ?", a: ["type 1", "type1", "1", "bare-metal", "bare metal"], ph: "type", exp: "Type 1 (bare-metal), directement sur le matériel." },
      { type: "vf", q: "Les conteneurs de l'API partageront le noyau du système hôte.", a: true, exp: "Oui, c'est le principe même des conteneurs." },
      { type: "qcm", q: "Pour isoler le trafic réseau de plusieurs clients sur un même routeur, on emploie…", opts: ["Un conteneur", "Un VRF", "Un hyperviseur type 2", "Un moteur Docker"], a: 1, exp: "Le VRF crée des tables de routage étanches par client." }
    ],
    solution: `<pre class="pseudo"># Décision
App Windows héritée, isolation forte -> VM (OS invité complet)
API web sans état, x dizaines rapides -> Conteneurs (légers, denses)

Isolation réseau multi-clients        -> VRF (tables de routage étanches)
# Règle : isolation/OS différent -> VM ; densité/rapidité -> conteneur.</pre>
<p>Tu sais arbitrer VM et conteneurs et nommer les briques réseau virtualisées. Demain : on plonge dans le routage avancé avec OSPF multi-aires.</p>`
  }
