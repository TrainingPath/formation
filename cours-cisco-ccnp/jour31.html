<script>
var DAY = {
  num: 31,
  title: "Projet final : conception réseau professionnelle",
  subtitle: "Concevoir un campus d'entreprise redondant, routé, sécurisé et supervisé.",
  theory: `
<h3>1. La mission d'ingénierie</h3>
<p>Voici le projet de synthèse. Une entreprise ouvre un nouveau <strong>campus</strong> de trois bâtiments et te confie sa conception réseau. Le cahier des charges est exigeant : <strong>redondance</strong> (aucune panne isolée ne doit couper le service), <strong>routage</strong> interne OSPF et connexion Internet en BGP, <strong>sécurité</strong> à tous les niveaux, et <strong>supervision</strong> pour voir et anticiper les incidents. Ce jour rassemble tout le cours : architecture, routage, HA, sécurité et automatisation.</p>
<h3>2. L'architecture hiérarchique en couches</h3>
<p>Le modèle de référence Cisco découpe le campus en trois couches, ce qui rend le réseau lisible, extensible et prévisible :</p>
<pre class="pseudo"># Modele hierarchique Cisco (campus)
[Coeur / Core]    : commutation tres rapide entre batiments
      |             (2 commutateurs pour la redondance)
[Distribution]    : agregation, routage inter-VLAN, politiques
      |             (paire redondante par batiment)
[Acces / Access]  : ports utilisateurs, PoE, VLAN, securite de port
# Chaque couche est DOUBLEE pour eviter tout point unique de panne.</pre>
<div class="tip">Un « point unique de panne » (en anglais <em>single point of failure</em>, SPOF) est un élément dont la panne suffit à couper le service. L'objectif d'un design redondant est d'éliminer tous les SPOF.</div>
<h3>3. Redondance : liens, équipements et passerelles</h3>
<p>On double tout ce qui compte. Deux commutateurs de cœur, des liens en <strong>EtherChannel</strong> pour agréger la bande passante et survivre à la perte d'un câble, des passerelles redondantes via <strong>HSRP/VRRP</strong>, et deux alimentations. Côté couche 2, on maîtrise le <strong>spanning-tree</strong> (RSTP) pour éviter les boucles tout en gardant des chemins de secours. Idéalement, les paires de distribution sont regroupées en une seule entité logique (technologies de type StackWise/vPC selon la plateforme) pour simplifier et fiabiliser.</p>
<h3>4. Le plan de routage : OSPF à l'intérieur, BGP vers l'extérieur</h3>
<p>À l'intérieur du campus, <strong>OSPF</strong> assure un routage rapide et hiérarchisé, éventuellement découpé en <strong>aires</strong> (area 0 en cœur). Vers Internet, on établit une session <strong>BGP</strong> avec le(s) fournisseur(s), idéalement <strong>deux liens</strong> vers deux opérateurs pour la redondance de sortie. On contrôle finement ce qu'on annonce et ce qu'on accepte (filtrage de préfixes).</p>
<pre class="pseudo"># Plan de routage (extrait conceptuel IOS)
router ospf 1
 router-id 1.1.1.1
 network 10.0.0.0 0.255.255.255 area 0
!
router bgp 65010
 neighbor 203.0.113.1 remote-as 64500   ! FAI 1
 neighbor 198.51.100.1 remote-as 64501  ! FAI 2 (redondance)
 network 192.0.2.0 mask 255.255.255.0
! OSPF = interieur ; BGP = frontiere Internet</pre>
<h3>5. La sécurité en profondeur</h3>
<p>On applique le principe de <strong>défense en profondeur</strong> : plusieurs couches de protection. En bordure, un <strong>pare-feu</strong> (ASA/Firepower). Sur l'accès, la <strong>sécurité de port</strong> (port-security), le <strong>DHCP snooping</strong> et le <strong>Dynamic ARP Inspection</strong> contre les attaques de couche 2. Le routage est <strong>authentifié</strong> (OSPF/BGP). L'administration passe par <strong>SSH</strong> et <strong>AAA</strong>, avec des <strong>ACL</strong> restreignant l'accès de gestion. La segmentation par VLAN et le contrôle d'accès (ISE) limitent la portée d'une compromission.</p>
<div class="warn">Un design sans supervision est aveugle. Prévois dès la conception la collecte de <strong>logs (syslog)</strong>, la métrologie (<strong>SNMP</strong> ou télémétrie), et la synchronisation d'horloge (<strong>NTP</strong>) : sans horloge commune, les journaux sont incomparables lors d'un incident.</p></div>
<h3>6. Supervision et automatisation</h3>
<p>Un réseau professionnel se <strong>supervise</strong> et s'<strong>automatise</strong>. On centralise les journaux via <strong>syslog</strong>, on surveille l'état via <strong>SNMP</strong> ou la <strong>télémétrie</strong> moderne, on synchronise l'heure via <strong>NTP</strong>. Enfin, on déploie et on vérifie la configuration avec les outils des jours 25 à 27 : scripts <strong>Python/Netmiko</strong>, <strong>NETCONF/RESTCONF</strong>, et des <strong>playbooks Ansible</strong> idempotents versionnés dans Git. Le réseau devient reproductible, auditable et rapide à faire évoluer.</p>
<h3>7. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Design campus professionnel = synthese du cours
# 1. Hierarchie : Coeur / Distribution / Acces (chaque couche doublee)
# 2. Redondance : 2 equipements, EtherChannel, HSRP/VRRP, RSTP
# 3. Routage : OSPF a l'interieur, BGP vers Internet (2 FAI)
# 4. Securite en profondeur : pare-feu, port-security, DHCP snooping,
#    DAI, routage authentifie, SSH+AAA, ACL, VLAN/ISE
# 5. Supervision : syslog, SNMP/telemetrie, NTP
# 6. Automatisation : Netmiko, NETCONF/RESTCONF, Ansible (IaC/Git)
# Objectif : zero point unique de panne (SPOF)</pre>`,
  exercises: [
    { type: "qcm", q: "Quelles sont les trois couches du modèle hiérarchique de campus Cisco ?", opts: ["Physique, Liaison, Réseau", "Cœur, Distribution, Accès", "Client, Serveur, Base", "WAN, LAN, VLAN"], a: 1, exp: "Le modèle Cisco : Cœur (Core), Distribution et Accès (Access)." },
    { type: "input", q: "Comment appelle-t-on (en anglais, sigle) un élément dont la panne suffit à couper le service ? (3 lettres)", a: ["spof"], ph: "single point of...", exp: "SPOF = Single Point Of Failure, à éliminer par la redondance." },
    { type: "qcm", q: "Quel protocole de routage utilise-t-on à l'intérieur du campus dans ce design ?", opts: ["BGP", "OSPF", "RIP", "Telnet"], a: 1, exp: "OSPF assure le routage interne ; BGP gère la frontière Internet." },
    { type: "qcm", q: "Quel protocole établit-on avec les fournisseurs Internet ?", opts: ["OSPF", "EIGRP", "BGP", "HSRP"], a: 2, exp: "BGP est le protocole de routage entre systèmes autonomes (Internet)." },
    { type: "vf", q: "Dans un design redondant, on double les équipements critiques pour éliminer les points uniques de panne.", a: true, exp: "Vrai : la redondance (2 équipements, liens, alimentations) supprime les SPOF." },
    { type: "input", q: "Quelle technologie agrège plusieurs liens physiques en un seul lien logique résilient ? (un mot)", a: ["etherchannel"], ph: "agrégation de liens", exp: "L'EtherChannel agrège des liens pour la bande passante et la résilience." },
    { type: "qcm", q: "Quel mécanisme fournit une passerelle par défaut redondante aux postes ?", opts: ["OSPF", "HSRP/VRRP (FHRP)", "NTP", "SNMP"], a: 1, exp: "Les FHRP (HSRP/VRRP) offrent une passerelle virtuelle redondante." },
    { type: "vf", q: "La défense en profondeur consiste à empiler plusieurs couches de sécurité indépendantes.", a: true, exp: "Vrai : pare-feu, sécurité de port, routage authentifié, ACL, etc." },
    { type: "input", q: "Quel service synchronise l'horloge des équipements pour rendre les journaux comparables ? (sigle)", a: ["ntp"], ph: "3 lettres", exp: "NTP synchronise l'heure ; indispensable pour corréler les logs." },
    { type: "qcm", q: "Quelle mesure de couche 2 protège contre un faux serveur DHCP pirate ?", opts: ["BGP", "DHCP snooping", "OSPF", "EtherChannel"], a: 1, exp: "Le DHCP snooping bloque les réponses DHCP venant de ports non fiables." },
    { type: "qcm", q: "Comment centralise-t-on les messages de journalisation des équipements ?", opts: ["Via NTP", "Via syslog", "Via HSRP", "Via RSTP"], a: 1, exp: "Syslog centralise les journaux pour la supervision et l'analyse." },
    { type: "vf", q: "On peut déployer et vérifier la configuration du campus avec des playbooks Ansible idempotents versionnés dans Git.", a: true, exp: "Vrai : l'infrastructure as code rend le déploiement reproductible et auditable." },
    { type: "input", q: "Quel protocole (sigle) surveille l'état des équipements via des compteurs et des traps ? (4 lettres)", a: ["snmp"], ph: "métrologie", exp: "SNMP (Simple Network Management Protocol) collecte l'état des équipements." },
    { type: "qcm", q: "Quel protocole de couche 2 empêche les boucles tout en gardant des chemins de secours ?", opts: ["Le spanning-tree (RSTP)", "OSPF", "BGP", "NTP"], a: 0, exp: "Le spanning-tree (RSTP) bloque les boucles tout en offrant des chemins de repli." },
    { type: "qcm", q: "Quel est l'objectif global d'un design de campus professionnel ?", opts: ["Réduire le nombre de VLAN", "Zéro point unique de panne, sécurité et supervision intégrées", "Supprimer le routage", "Utiliser Telnet partout"], a: 1, exp: "On vise la haute disponibilité (zéro SPOF), la sécurité et la supervision." }
  ],
  final: {
    title: "Exercice final — Valider le design du campus",
    intro: `<p>Tu présentes ton design de campus (3 bâtiments) au comité technique. On te pose une série de questions pour vérifier que chaque exigence (redondance, routage, sécurité, supervision) est bien couverte.</p>`,
    questions: [
      { type: "qcm", q: "Comment garantis-tu qu'aucune panne d'un seul commutateur de cœur ne coupe le service ?", opts: ["Un seul commutateur puissant", "Deux commutateurs de cœur redondants", "Un pare-feu", "Du NTP"], a: 1, exp: "On double le cœur : deux commutateurs éliminent le SPOF." },
      { type: "input", q: "Quel protocole assures-tu à l'intérieur du campus pour le routage ? (sigle)", a: ["ospf"], ph: "routage interne", exp: "OSPF est le protocole de routage interne du design." },
      { type: "qcm", q: "Comment sécurises-tu l'accès d'administration des équipements ?", opts: ["Telnet en clair", "SSH avec AAA et ACL de gestion", "Aucun contrôle", "Un mot de passe partagé unique en clair"], a: 1, exp: "SSH + AAA + ACL protègent l'accès d'administration." },
      { type: "vf", q: "La synchronisation NTP est nécessaire pour corréler les journaux lors d'un incident.", a: true, exp: "Vrai : sans horloge commune, les logs de différents équipements sont incomparables." },
      { type: "qcm", q: "Comment rends-tu le déploiement de configuration reproductible et auditable ?", opts: ["En tapant tout à la main", "Avec des playbooks Ansible idempotents versionnés (IaC/Git)", "Avec un tableur", "En désactivant la supervision"], a: 1, exp: "L'infrastructure as code (Ansible + Git) rend le déploiement reproductible et auditable." }
    ],
    solution: `<pre class="pseudo"># Check-list de validation du design
[Redondance ] Coeur x2, distribution en paires, EtherChannel,
              HSRP/VRRP pour les passerelles, RSTP maitrise -> 0 SPOF
[Routage    ] OSPF area 0 en interne ; BGP vers 2 FAI en sortie
[Securite   ] pare-feu bordure ; port-security, DHCP snooping, DAI ;
              routage authentifie ; SSH + AAA + ACL ; VLAN/ISE
[Supervision] syslog centralise ; SNMP/telemetrie ; NTP synchronise
[Automatisation] Netmiko / NETCONF / RESTCONF ; Ansible idempotent
              versionne dans Git (infrastructure as code)
# Chaque exigence du cahier des charges est couverte.</pre>
<p>Félicitations : tu viens de concevoir un campus d'entreprise redondant, routé, sécurisé et supervisé. C'est la synthèse de tout le parcours CCNP. Il ne te reste plus qu'à passer les examens.</p>`
  }
};
</script>
