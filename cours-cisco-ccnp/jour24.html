  title: "Le dépannage réseau avancé",
  subtitle: "Une méthode, les bonnes commandes show, et le debug manié avec prudence.",
  theory: `
<h3>1. Dépanner, c'est raisonner, pas deviner</h3>
<p>Le dépannage (troubleshooting) est autant une méthode qu'une connaissance technique. Sans démarche, on tape des commandes au hasard et on aggrave parfois la panne. Une bonne méthode suit toujours les mêmes étapes : <strong>définir le problème</strong> (symptôme précis, périmètre), <strong>collecter les informations</strong>, <strong>formuler des hypothèses</strong>, <strong>tester une hypothèse à la fois</strong>, puis <strong>corriger et documenter</strong>. Changer plusieurs choses en même temps est l'erreur classique : on ne sait plus ce qui a réglé (ou cassé) quoi.</p>
<h3>2. Les modèles de raisonnement (top-down, bottom-up, diviser)</h3>
<p>On structure l'analyse avec le modèle OSI. En <strong>bottom-up</strong>, on part de la couche physique (câble, interface up/down) et on remonte : sûr mais parfois long. En <strong>top-down</strong>, on part de l'application et on descend : efficace quand le problème semble applicatif. La méthode <strong>diviser pour régner</strong> (divide and conquer) attaque au milieu (souvent la couche 3 : « le ping passe-t-il ? ») et oriente vers le haut ou le bas selon le résultat. On complète par <strong>suivre le chemin</strong> (follow the path) : suivre le trajet réel du paquet, saut par saut.</p>
<div class="tip">Un bon point d'entrée « diviser pour régner » : un simple <code>ping</code> puis <code>traceroute</code>. S'ils réussissent, la couche 3 est saine et le problème est probablement plus haut (DNS, application) ; s'ils échouent, on descend vers le routage, la couche 2, le physique.</div>
<h3>3. Les commandes show : la photo de l'état</h3>
<p>Les commandes <strong>show</strong> donnent une photo instantanée, sans risque, de l'état de l'équipement. Ce sont les premières à dégainer. Quelques incontournables : <code>show ip interface brief</code> (état des interfaces d'un coup d'œil), <code>show ip route</code> (table de routage), <code>show ip ospf neighbor</code> ou <code>show ip bgp summary</code> (voisinages), <code>show mac address-table</code> et <code>show interfaces status</code> (couche 2), <code>show running-config</code> (config active), <code>show logging</code> (journal des événements).</p>
<pre class="pseudo"># Commandes show à connaître
show ip interface brief        # interfaces : up/down, IP, protocole
show ip route                  # table de routage
show ip ospf neighbor          # voisins OSPF (adjacences)
show cdp neighbors detail      # équipements voisins directs
show mac address-table         # apprentissage des MAC (couche 2)
show logging                   # journal des messages
show processes cpu sorted      # ce qui charge le CPU</pre>
<h3>4. Le debug : puissant mais dangereux</h3>
<p>Là où show donne une photo, <strong>debug</strong> donne un film en temps réel des événements internes (échanges de protocole, décisions du routeur). C'est très puissant pour comprendre <em>pourquoi</em> quelque chose échoue (ex. <code>debug ip ospf adj</code> pour voir une adjacence qui ne monte pas). Mais debug consomme le CPU et peut submerger la console de messages, au point de faire tomber un équipement chargé. Règles d'or : cibler au maximum (le debug le plus précis possible), l'utiliser hors production ou avec prudence, et toujours l'arrêter avec <code>no debug all</code> (ou <code>undebug all</code>).</p>
<div class="warn">JAMAIS de <code>debug all</code> sur un équipement en production : il peut saturer le CPU et provoquer la panne que vous vouliez éviter. Ciblez (par exemple <code>debug ip icmp</code>), redirigez la sortie vers un buffer plutôt que la console, et coupez avec <code>undebug all</code> dès que possible.</p></div>
<h3>5. La boîte à outils IOS</h3>
<p>Au-delà de show et debug, IOS offre des outils de test : <strong>ping</strong> (connectivité couche 3, avec options étendues : taille, source, répétitions), <strong>traceroute</strong> (trajet saut par saut, pour localiser où ça coince), <strong>terminal monitor</strong> (voir les logs/debug en session SSH), le <strong>ping étendu</strong> pour simuler du trafic depuis une source précise, et les compteurs d'interface (<code>show interfaces</code>) pour repérer erreurs, collisions et rejets (drops). On journalise vers un serveur <strong>Syslog</strong> pour garder l'historique, et on horodate tout par <strong>NTP</strong> afin de corréler les événements entre équipements.</p>
<pre class="pseudo"># Démarche type
1. show ip interface brief   -> l'interface est-elle up/up ?
2. ping / traceroute         -> jusqu'où le paquet va-t-il ?
3. show ip route             -> la route existe-t-elle ?
4. show logging              -> quel message d'erreur ?
5. debug CIBLÉ (si besoin)   -> pourquoi ça échoue ? puis undebug all</pre>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># Méthode : définir -> collecter -> hypothèse -> tester (une chose) -> corriger/documenter
# Modèles : bottom-up, top-down, diviser pour régner, suivre le chemin
# show  = photo instantanée (sans risque) : commencer par là
# debug = film en temps réel (coûteux) : cibler, jamais debug all en prod, undebug all
# Outils : ping, traceroute, terminal monitor, Syslog, NTP (horodatage)</pre>`,
  exercises: [

    { type: "vf", q: "Il est recommandé de lancer debug all en production pour tout voir d'un coup.", a: false, exp: "Faux : debug all peut saturer le CPU et faire tomber l'équipement. On cible toujours." },
    { type: "input", q: "Quelle commande arrête tous les debug en cours ? Réponds : undebug …", a: ["all", "undebug all", "no debug all"], ph: "un mot", exp: "undebug all (ou no debug all) coupe tous les debug actifs." },
    { type: "qcm", q: "La méthode « diviser pour régner » commence souvent par…", opts: ["remplacer le câble", "un test de couche 3 (ping) pour orienter vers le haut ou le bas", "recharger l'IOS", "effacer la config"], a: 1, exp: "On attaque au milieu (couche 3) : le ping oriente ensuite l'analyse." },
    { type: "qcm", q: "Pour voir les messages de log et de debug dans une session SSH, on active…", opts: ["terminal monitor", "logging console", "no logging", "show buffers"], a: 0, exp: "terminal monitor renvoie les messages vers la session distante (VTY)." },
    { type: "vf", q: "Changer plusieurs paramètres à la fois est une bonne pratique de dépannage.", a: false, exp: "Faux : on teste une hypothèse à la fois, sinon on ne sait pas ce qui a réglé (ou cassé) quoi." },
    { type: "input", q: "Quel protocole horodate les équipements pour corréler les événements entre eux ? (sigle 3 lettres)", a: ["ntp"], ph: "sigle", exp: "NTP synchronise les horloges : indispensable pour corréler des logs multi-équipements." },
    { type: "qcm", q: "Quelle commande affiche le journal des messages (événements) de l'équipement ?", opts: ["show logging", "show running-config", "show ip arp", "show flash"], a: 0, exp: "show logging montre le journal local (erreurs, changements d'état…)." },
    { type: "input", q: "Vers quel type de serveur centralise-t-on les journaux pour garder l'historique ? (un mot)", a: ["syslog", "serveur syslog"], ph: "un mot", exp: "Syslog centralise les journaux de tous les équipements pour l'audit et le dépannage." },
    { type: "qcm", q: "Quelle est la première étape d'une bonne méthode de dépannage ?", opts: ["corriger tout de suite", "définir précisément le problème (symptôme, périmètre)", "recharger l'équipement", "lancer debug all"], a: 1, exp: "On commence par définir le problème avant de collecter, formuler des hypothèses et tester." }
  ],
  final: {
    title: "Exercice final — Une adjacence OSPF qui ne monte pas",
    intro: "<p>Deux routeurs devraient être voisins OSPF, mais l'adjacence ne s'établit pas. Applique une démarche structurée, du plus sûr (show) au plus ciblé (debug).</p>",
    questions: [
      { type: "qcm", q: "Première vérification, sans risque :", opts: ["debug ip ospf adj", "show ip interface brief (interface up/up ?)", "reload", "erase startup-config"], a: 1, exp: "On commence par le plus sûr : l'interface est-elle bien up/up ?" },
      { type: "input", q: "Quelle commande show liste les voisins OSPF détectés ? Réponds : show ip ospf …", a: ["neighbor", "neighbors", "show ip ospf neighbor"], ph: "un mot", exp: "show ip ospf neighbor montre l'état des adjacences (Init, 2-Way, Full…)." },
      { type: "vf", q: "Un test ping entre les deux interfaces confirme la connectivité de couche 3 avant d'aller plus loin.", a: true, exp: "Oui : si le ping échoue, inutile de chercher côté OSPF, le problème est plus bas." },
      { type: "qcm", q: "Pour voir en direct pourquoi l'adjacence échoue (MTU, hello, masque), on utilise…", opts: ["debug ip ospf adj (ciblé)", "debug all", "show clock", "show flash"], a: 0, exp: "Un debug ciblé montre l'échange Hello et la cause (mismatch de zone, MTU, timers…)." },
      { type: "input", q: "Une fois le diagnostic fait, quelle commande coupe le debug ?", a: ["undebug all", "no debug all", "undebug"], ph: "commande", exp: "undebug all arrête les debug pour ne plus charger le CPU." }
    ],
    solution: "<pre class=\"pseudo\"># Démarche du sûr vers le ciblé\n1. show ip interface brief        -> interface up/up ? IP correcte ?\n2. ping voisin                    -> couche 3 saine ?\n3. show ip ospf neighbor          -> état de l'adjacence (Init/2-Way/Full)\n4. show ip ospf interface         -> zone, timers hello/dead, réseau, MTU\n5. debug ip ospf adj (CIBLÉ)      -> cause exacte de l'échec\n6. undebug all                    -> couper le debug après diagnostic\n\n# Causes fréquentes : mismatch de zone, masque, timers hello/dead, MTU, authentification.</pre><p>La clé : progresser du plus sûr (show, ping) vers le plus coûteux (debug ciblé), tester une hypothèse à la fois, et couper le debug dès le diagnostic obtenu.</p>"
  }
};
