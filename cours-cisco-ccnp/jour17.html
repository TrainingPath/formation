<script>
var DAY = {
  num: 17,
  title: "Le SD-Access (fabric, DNA Center)",
  subtitle: "Construire un réseau piloté par l'intention, où l'adresse ne dit plus où tu es.",
  theory: `
<h3>1. Du réseau câblé au réseau piloté par l'intention</h3>
<p>Dans un réseau classique, la sécurité et la politique reposent sur des VLAN, des sous-réseaux et des ACL écrites boîte par boîte. Déplacer un utilisateur ou isoler un service demande de reconfigurer des dizaines d'équipements à la main. Le <strong>SD-Access</strong> (Software-Defined Access) de Cisco propose une autre logique : l'administrateur exprime une <em>intention</em> (« ces caméras ne parlent qu'au serveur vidéo ») dans une console centrale, et le contrôleur programme lui-même tous les commutateurs. On parle de réseau <strong>intent-based</strong> (piloté par l'intention).</p>
<h3>2. Underlay et overlay : deux réseaux superposés</h3>
<p>SD-Access sépare le transport physique et le réseau logique. L'<strong>underlay</strong> est le réseau physique, celui des câbles et des liens routés (souvent en IS-IS) : son seul rôle est d'acheminer des paquets d'un commutateur à l'autre, de façon simple et robuste. Par-dessus, on bâtit l'<strong>overlay</strong> : un réseau virtuel, la <strong>fabric</strong>, où circulent réellement les données des utilisateurs, encapsulées dans des tunnels. L'analogie : l'underlay est le réseau autoroutier, l'overlay est le service de livraison qui emprunte ces routes sans se soucier du bitume.</p>
<div class="tip">Dans la fabric, les rôles clés sont : le <strong>Edge node</strong> (le commutateur d'accès où se branchent les postes), le <strong>Border node</strong> (la sortie vers le reste du réseau) et le <strong>Control plane node</strong> (l'annuaire qui sait où se trouve chaque hôte).</div>
<h3>3. LISP pour le plan de contrôle, VXLAN pour le plan de données</h3>
<p>Deux protocoles font tourner la fabric. Le <strong>plan de contrôle</strong> repose sur <strong>LISP</strong> (Locator/ID Separation Protocol) : il sépare l'<em>identité</em> d'un hôte (son adresse IP, l'EID) de sa <em>localisation</em> (le routeur qui le dessert, le RLOC). Un Control plane node joue le rôle d'annuaire (map-server) : quand un Edge cherche où joindre une IP, il l'interroge, comme on demande un numéro à un service de renseignements. Le <strong>plan de données</strong> repose sur <strong>VXLAN</strong> : chaque trame utilisateur est encapsulée dans un paquet UDP et transporte un identifiant de segment. VXLAN offre plus de 16 millions de segments, contre 4094 VLAN.</p>
<pre class="pseudo"># Séparation des plans dans une fabric SD-Access
Plan de contrôle : LISP   -> annuaire identité (EID) / localisation (RLOC)
Plan de données  : VXLAN  -> encapsulation UDP + numéro de segment (VNI)
Underlay physique : IS-IS -> achemine simplement entre commutateurs</pre>
<h3>4. Cisco DNA Center, le cerveau</h3>
<p>Toute la fabric se pilote depuis <strong>Cisco DNA Center</strong> (aujourd'hui Catalyst Center) : un contrôleur applicatif avec une interface web. On y définit les sites, on provisionne les équipements, on écrit les politiques, et on surveille l'état (assurance). DNA Center dialogue avec les équipements et, pour l'identité des utilisateurs, s'appuie sur <strong>Cisco ISE</strong> (Identity Services Engine), qui authentifie et attribue à chaque hôte une étiquette de groupe.</p>
<h3>5. La segmentation par étiquettes (SGT)</h3>
<p>Le grand avantage de SD-Access est la <strong>segmentation</strong>. La <em>macro-segmentation</em> découpe le réseau en <strong>réseaux virtuels</strong> (VN, l'équivalent de VRF) totalement étanches : invités, production, IoT. La <em>micro-segmentation</em>, plus fine, se fait avec des <strong>SGT</strong> (Scalable Group Tags) : chaque hôte reçoit une étiquette selon son rôle, et la politique dit quelles étiquettes peuvent se parler, indépendamment de l'adresse IP. On ne raisonne plus « sous-réseau 10.1.1.0 », mais « groupe Employés vers groupe Serveurs-RH : autorisé ».</p>
<div class="warn">Ne confonds pas les plans : LISP ne transporte AUCUNE donnée utilisateur, il ne fait que localiser les hôtes. Ce sont les paquets VXLAN qui portent les trames. Inverser les deux est l'erreur la plus fréquente à l'examen.</div>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># SD-Access = réseau piloté par l'intention (intent-based)
Underlay  = réseau physique (IS-IS)      -> transport brut
Overlay   = fabric virtuelle (tunnels)   -> données réelles
LISP  = plan de contrôle (qui est où ?)
VXLAN = plan de données (encapsulation + segment)
DNA Center = console centrale ; ISE = identité + SGT
Segmentation : VN (macro) et SGT (micro)</pre>`,
  exercises: [
    { type: "qcm", q: "Dans SD-Access, quel protocole assure le plan de contrôle (localiser les hôtes) ?", opts: ["VXLAN", "LISP", "OSPF", "STP"], a: 1, exp: "LISP sépare identité (EID) et localisation (RLOC) : c'est l'annuaire de la fabric." },
    { type: "qcm", q: "Quel protocole assure le plan de données (transport encapsulé des trames) ?", opts: ["LISP", "VXLAN", "IS-IS", "IGMP"], a: 1, exp: "VXLAN encapsule chaque trame dans un paquet UDP avec un identifiant de segment (VNI)." },
    { type: "vf", q: "L'underlay est le réseau physique qui achemine simplement les paquets entre commutateurs.", a: true, exp: "Oui : l'underlay (souvent IS-IS) transporte, l'overlay (fabric) porte les données réelles." },
    { type: "qcm", q: "Comment appelle-t-on le contrôleur central qui pilote une fabric SD-Access ?", opts: ["vCenter", "Cisco DNA Center", "Wireshark", "Nexus Dashboard"], a: 1, exp: "Cisco DNA Center (Catalyst Center) provisionne, applique les politiques et surveille la fabric." },
    { type: "input", q: "Que signifie l'acronyme LISP (les deux premiers mots) ? Réponds : Locator/ID …", a: ["separation", "separation protocol", "locator id separation protocol"], ph: "un mot", exp: "Locator/ID Separation Protocol : il sépare l'identité de la localisation." },
    { type: "qcm", q: "Quel rôle de fabric correspond au commutateur d'accès où se branchent les postes ?", opts: ["Border node", "Edge node", "Control plane node", "Map-resolver"], a: 1, exp: "L'Edge node est le commutateur d'accès de la fabric ; le Border est la sortie." },
    { type: "vf", q: "LISP transporte les données utilisateur à l'intérieur de la fabric.", a: false, exp: "Non : LISP ne fait que localiser les hôtes (plan de contrôle). Les données voyagent en VXLAN." },
    { type: "input", q: "Dans LISP, comment appelle-t-on l'identifiant d'un hôte (son adresse) ? (sigle 3 lettres)", a: ["eid"], ph: "sigle", exp: "L'EID (Endpoint IDentifier) est l'identité ; le RLOC est la localisation." },
    { type: "qcm", q: "La micro-segmentation dans SD-Access s'appuie sur…", opts: ["des ACL par port", "des étiquettes SGT (Scalable Group Tags)", "le spanning-tree", "des sous-réseaux /30"], a: 1, exp: "Les SGT étiquettent les hôtes par rôle ; la politique autorise ou non les échanges entre étiquettes." },
    { type: "qcm", q: "Quel produit Cisco fournit l'identité des utilisateurs et attribue les SGT ?", opts: ["ISE (Identity Services Engine)", "ASA", "Prime", "Meraki"], a: 0, exp: "Cisco ISE authentifie les hôtes et leur affecte une étiquette de groupe (SGT)." },
    { type: "vf", q: "VXLAN offre bien plus de segments logiques que les 4094 VLAN classiques.", a: true, exp: "Vrai : VXLAN code un identifiant de segment (VNI) sur 24 bits, soit plus de 16 millions de segments." },
    { type: "input", q: "Comment appelle-t-on le réseau virtuel superposé où circulent réellement les données ? (un mot en anglais, aussi appelé la fabric)", a: ["overlay", "l'overlay"], ph: "underlay ou overlay ?", exp: "L'overlay (la fabric) porte les données ; l'underlay est le transport physique." },
    { type: "qcm", q: "Un réseau virtuel (VN) dans SD-Access correspond, dans un routeur classique, à…", opts: ["un VLAN", "une VRF (macro-segmentation)", "une route statique", "une interface loopback"], a: 1, exp: "Le VN est l'équivalent d'une VRF : des réseaux totalement étanches (invités, production, IoT)." },
    { type: "input", q: "Comment nomme-t-on de façon générale un réseau où l'administrateur exprime une intention appliquée automatiquement ? Réponds : réseau piloté par l'…", a: ["intention", "intent", "intent-based", "l'intention"], ph: "un mot", exp: "Réseau piloté par l'intention (intent-based networking) : la base philosophique de SD-Access." },
    { type: "vf", q: "Dans la fabric, la politique de sécurité peut être exprimée entre groupes (SGT) sans dépendre des adresses IP.", a: true, exp: "Vrai : c'est tout l'intérêt des SGT, on raisonne par rôle plutôt que par sous-réseau." }
  ],
  final: {
    title: "Exercice final — Cartographier une fabric SD-Access",
    intro: "<p>Une entreprise déploie SD-Access. On te donne les briques : commutateurs d'accès, sortie vers Internet, annuaire des hôtes, console web, moteur d'identité. Relie chaque brique à son rôle et vérifie ta compréhension des plans.</p>",
    questions: [
      { type: "qcm", q: "Le poste d'un employé se branche physiquement sur…", opts: ["un Border node", "un Edge node", "le Control plane node", "DNA Center"], a: 1, exp: "L'Edge node est le commutateur d'accès de la fabric." },
      { type: "qcm", q: "Pour joindre une IP inconnue, l'Edge interroge…", opts: ["le serveur DHCP", "le Control plane node (annuaire LISP)", "STP", "le Border directement"], a: 1, exp: "Le Control plane node (map-server LISP) répond où se trouve l'EID." },
      { type: "vf", q: "Une fois la localisation connue, la trame est encapsulée en VXLAN pour traverser la fabric.", a: true, exp: "Oui : LISP localise, VXLAN transporte." },
      { type: "input", q: "Quelle console web sert à provisionner et surveiller toute la fabric ?", a: ["dna center", "cisco dna center", "dnac", "catalyst center"], ph: "nom de la console", exp: "Cisco DNA Center (Catalyst Center)." },
      { type: "qcm", q: "Pour isoler totalement le réseau invités du réseau production, on utilise…", opts: ["deux VXLAN au hasard", "des réseaux virtuels (VN, macro-segmentation)", "un seul SGT", "une route statique"], a: 1, exp: "Les VN (équivalents VRF) réalisent la macro-segmentation étanche." }
    ],
    solution: "<pre class=\"pseudo\"># Fabric SD-Access, les rôles :\nEdge node          -> commutateur d'accès (postes)\nBorder node        -> sortie vers l'extérieur\nControl plane node -> annuaire LISP (EID -> RLOC)\nDNA Center         -> console centrale (intent + assurance)\nISE                -> identité + attribution des SGT\n\n# Les deux plans, à ne jamais inverser :\nLISP  = plan de contrôle (localiser)\nVXLAN = plan de données (transporter)</pre><p>Une fois ces rôles en tête, SD-Access devient lisible : on décrit l'intention, DNA Center programme la fabric, LISP sait où est chacun, VXLAN transporte, les SGT filtrent.</p>"
  }
};
</script>
