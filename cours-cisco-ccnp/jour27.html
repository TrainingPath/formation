  theory: `
<h3>1. YANG : le plan des données réseau</h3>
<p><strong>YANG</strong> (Yet Another Next Generation) est un <strong>langage de modélisation de données</strong>. Il ne configure rien tout seul : il <em>décrit</em> quelles données existent, leur type, leur hiérarchie et leurs contraintes. C'est le « plan d'architecte » que NETCONF et RESTCONF utilisent pour savoir de quoi ils parlent. Un modèle YANG définit par exemple qu'une interface possède un nom (texte), un état activé (booléen), une adresse IP (chaîne au bon format), etc.</p>
<pre class="pseudo"># Idee d'un modele YANG (tres simplifie)
module interfaces {
  list interface {
    key "name";
    leaf name        { type string; }
    leaf enabled     { type boolean; }
    leaf ip-address  { type string; }
  }
}
# leaf = feuille (une donnee) ; list = collection ; container = groupe</pre>
<div class="tip">On distingue les <strong>modèles standards</strong> (IETF, comme <code>ietf-interfaces</code> ; OpenConfig, multi-constructeur) et les <strong>modèles natifs</strong> propres à un constructeur (Cisco IOS-XE natif). Les modèles standards facilitent le multi-vendeur.</div>
<h3>2. L'infrastructure as code (IaC)</h3>
<p>L'<strong>infrastructure as code</strong> consiste à décrire l'état voulu de l'infrastructure dans des <strong>fichiers texte versionnés</strong> (dans Git), plutôt que par des clics manuels. Avantages : historique des changements, revue par les pairs, reproductibilité, retour arrière. On ne dit plus « connecte-toi et tape ces commandes » mais « voici le fichier qui décrit le réseau voulu ; applique-le ».</p>
<h3>3. Ansible : l'automatisation sans agent</h3>
<p><strong>Ansible</strong> (édité par Red Hat) est un outil d'automatisation très utilisé en réseau. Ses caractéristiques :</p>
<pre class="pseudo"># Concepts Ansible
- Sans agent (agentless) : rien a installer sur l'equipement ;
  Ansible se connecte en SSH (ou via API pour le reseau).
- Inventory (inventaire) : la liste des equipements a gerer.
- Playbook : fichier YAML decrivant les taches a appliquer.
- Module : brique reutilisable (ex : ios_config, ios_facts).
- Idempotence : appliquer 2 fois donne le meme resultat.</pre>
<h3>4. Un playbook réseau en YAML</h3>
<p>Un <strong>playbook</strong> est un fichier <strong>YAML</strong> (attention : indentation par espaces, jamais de tabulation). Il liste des <em>tâches</em> qui invoquent des <em>modules</em>. Exemple pour configurer un serveur NTP sur des routeurs IOS :</p>
<pre class="pseudo"># playbook.yml (extrait)
- name: Configurer NTP sur les routeurs
  hosts: routeurs
  gather_facts: no
  tasks:
    - name: Definir le serveur NTP
      cisco.ios.ios_config:
        lines:
          - ntp server 10.0.0.9</pre>
<h3>5. L'idempotence : la propriété clé</h3>
<p>L'<strong>idempotence</strong> signifie qu'appliquer une tâche plusieurs fois produit toujours le <strong>même état final</strong>, sans effet secondaire supplémentaire. Si la ligne <code>ntp server 10.0.0.9</code> est déjà présente, Ansible constate que rien n'est à faire et rapporte <code>ok</code> plutôt que <code>changed</code>. On peut donc relancer un playbook en toute sécurité : il ne « refait » que ce qui manque.</p>
<div class="warn">En YAML, une tabulation à la place d'espaces provoque une erreur de syntaxe. Configure ton éditeur pour insérer des espaces. De même, un antislash dans une valeur peut devoir être doublé (\\\\) selon le contexte de guillemets.</div>
<h3>6. Ce qu'il faut retenir</h3>

    { type: "qcm", q: "Ansible se connecte typiquement aux équipements réseau via…", opts: ["Un agent local", "SSH (ou une API pour le réseau)", "Un câble console uniquement", "SNMP en écriture"], a: 1, exp: "Ansible étant agentless, il utilise SSH ou l'API de l'équipement." },
    { type: "vf", q: "Un modèle YANG natif Cisco IOS-XE est identique pour tous les constructeurs.", a: false, exp: "Faux : un modèle natif est propre à un constructeur ; ce sont les modèles standards qui sont communs." },
    { type: "input", q: "Quelle éditrice logicielle est à l'origine d'Ansible ? (nom de l'entreprise)", a: ["red hat", "redhat"], ph: "entreprise", exp: "Ansible est édité par Red Hat." }
  ],

      { type: "input", q: "Où déclares-tu la liste des routeurs à cibler dans Ansible ? (un mot)", a: ["inventory", "l'inventory", "inventaire"], ph: "fichier de ...", exp: "L'inventory contient la liste des hôtes/équipements." },

      { type: "vf", q: "Le fichier playbook doit être indenté avec des espaces, pas des tabulations.", a: true, exp: "Vrai : YAML interdit les tabulations d'indentation." },

    ],
    solution: `<pre class="pseudo"># play NTP idempotent (extrait)
