var DAY = {
  num: 28,
  title: "Choisir sa concentration",
  subtitle: "Un tronc commun, puis une spécialité qui te ressemble.",
  theory: `
<h3>1. Comment est structuré le CCNP Enterprise</h3>
<p>Le <strong>CCNP Enterprise</strong> ne s'obtient pas avec un seul examen. Il repose sur une structure en deux temps : un <strong>examen de tronc commun</strong> (<em>core</em>) obligatoire, puis <strong>un examen de concentration</strong> à choisir parmi une liste. Réussir les deux (core + une concentration) donne la certification. C'est ce qui te permet d'orienter ta certification vers ce qui t'intéresse vraiment.</p>
<pre class="pseudo"># Formule CCNP Enterprise
CCNP Enterprise = 1 examen CORE + 1 examen de CONCENTRATION
# Core (Enterprise) : ENCOR 350-401
#   (routage, commutation, sans-fil, securite, automatisation)
# Concentration : au choix parmi plusieurs specialites</pre>
<div class="tip">L'examen core sert aussi de première étape vers le CCIE Enterprise. En le réussissant, tu avances sur deux fronts à la fois.</div>
<h3>2. Le core Enterprise : ENCOR 350-401</h3>
<p>L'examen <strong>ENCOR 350-401</strong> (« Implementing and Operating Cisco Enterprise Network Core Technologies ») couvre un large socle : architecture, routage avancé (OSPF, EIGRP, BGP), commutation, réseaux sans-fil, sécurité de l'infrastructure, virtualisation et automatisation. C'est le passage obligé, la fondation commune à toutes les concentrations.</p>
<h3>3. Les concentrations Enterprise</h3>
<p>Après le core, tu choisis une spécialité selon ton métier ou tes envies. Les concentrations Enterprise couvrent notamment :</p>
<pre class="pseudo"># Exemples de concentrations Enterprise (examens 300-4xx)
- Routage avance          : ENARSI 300-410
- SD-WAN                  : ENSDWI 300-415
- Design                  : ENSLD 300-420
- Sans-fil (wireless)     : ENWLSI 300-430
- Automatisation          : ENAUTO 300-435
# Tu passes le CORE + UNE seule de ces concentrations.</pre>
<div class="warn">Ne confonds pas core et concentration. Le core (350-401) est unique et obligatoire ; la concentration (un examen 300-4xx) se choisit. Une erreur classique est de croire qu'il faut réussir TOUTES les concentrations : non, une seule suffit.</div>
<h3>4. Comment choisir ?</h3>
<p>Aligne ton choix sur ton <strong>métier réel ou visé</strong>. Tu opères des tunnels et des liaisons multisites ? La concentration <strong>SD-WAN</strong> (ENSDWI) est logique. Tu déploies des points d'accès Wi-Fi ? Vise le <strong>sans-fil</strong> (ENWLSI). Tu écris des scripts Python et des playbooks (jours 25 à 27) ? L'<strong>automatisation</strong> (ENAUTO) valorise exactement ces compétences. Le routage complexe te passionne ? <strong>ENARSI</strong> approfondit OSPF, BGP, redistribution et VPN.</p>
<h3>5. Ce que la concentration change concrètement</h3>
<p>La concentration détermine la <strong>mention</strong> de ta certification et les compétences validées. Sur ton CV, « CCNP Enterprise avec concentration automatisation » n'envoie pas le même signal que « avec concentration SD-WAN ». Beaucoup d'ingénieurs passent d'ailleurs <strong>plusieurs concentrations au fil du temps</strong> : chaque concentration réussie est aussi une certification Specialist Cisco à part entière.</p>
<h3>6. Ce qu'il faut retenir</h3>
<pre class="pseudo"># CCNP Enterprise = CORE (ENCOR 350-401) + 1 CONCENTRATION
# Concentrations (exemples) :
#   ENARSI 300-410 (routage avance)
#   ENSDWI 300-415 (SD-WAN)
#   ENSLD  300-420 (design)
#   ENWLSI 300-430 (sans-fil)
#   ENAUTO 300-435 (automatisation)
# Choisir = aligner sur son metier/objectif
# Le core est aussi la 1re marche vers le CCIE Enterprise</pre>`,
  exercises: [
    { type: "qcm", q: "De combien d'examens le CCNP Enterprise se compose-t-il ?", opts: ["Un seul examen", "Un core + une concentration", "Trois examens de concentration", "Uniquement des examens de concentration"], a: 1, exp: "Il faut réussir l'examen core ET un examen de concentration." },
    { type: "input", q: "Quel est le numéro de l'examen core Enterprise (ENCOR) ? (format xxx-xxx)", a: ["350-401", "350401"], ph: "xxx-xxx", exp: "L'examen core Enterprise est l'ENCOR 350-401." },
    { type: "qcm", q: "Quel examen de concentration correspond au SD-WAN ?", opts: ["ENARSI 300-410", "ENSDWI 300-415", "ENWLSI 300-430", "ENAUTO 300-435"], a: 1, exp: "ENSDWI 300-415 est la concentration SD-WAN." },
    { type: "vf", q: "Pour obtenir le CCNP Enterprise, il faut réussir toutes les concentrations disponibles.", a: false, exp: "Faux : une seule concentration suffit, en plus du core." },
    { type: "qcm", q: "Quelle concentration valorise le mieux des compétences Python/Ansible ?", opts: ["ENWLSI (sans-fil)", "ENAUTO (automatisation)", "ENSLD (design)", "ENSDWI (SD-WAN)"], a: 1, exp: "ENAUTO 300-435 cible l'automatisation réseau." },
    { type: "input", q: "Quel examen de concentration approfondit le routage avancé (OSPF, BGP, redistribution) ? (nom)", a: ["enarsi", "enarsi 300-410", "300-410"], ph: "concentration routage", exp: "ENARSI 300-410 est la concentration routage avancé." },
    { type: "qcm", q: "Quelle concentration choisir si tu déploies surtout des points d'accès Wi-Fi ?", opts: ["ENAUTO", "ENWLSI (sans-fil)", "ENARSI", "ENSDWI"], a: 1, exp: "ENWLSI 300-430 est la concentration sans-fil (wireless)." },
    { type: "vf", q: "L'examen core Enterprise est aussi la première étape vers le CCIE Enterprise.", a: true, exp: "Vrai : réussir l'ENCOR 350-401 amorce le parcours CCIE Enterprise." },
    { type: "qcm", q: "Sur quel critère est-il le plus judicieux de choisir sa concentration ?", opts: ["La réputation de facilité de l'examen", "Son métier réel ou visé et ses centres d'intérêt", "Le tarif d'inscription le plus bas", "La concentration la plus populaire du moment"], a: 1, exp: "On aligne la concentration sur son métier et ses objectifs." },
    { type: "input", q: "Quel examen correspond à la concentration DESIGN Enterprise ? (nom ou numéro)", a: ["ensld", "ensld 300-420", "300-420"], ph: "concentration design", exp: "ENSLD 300-420 est la concentration design." },
    { type: "qcm", q: "Que valide en plus chaque examen de concentration réussi ?", opts: ["Rien du tout", "Une certification Cisco Specialist à part entière", "Le CCIE automatiquement", "Le CCNA"], a: 1, exp: "Chaque concentration est aussi une certification Specialist Cisco." },
    { type: "vf", q: "Le core ENCOR couvre le routage, la commutation, le sans-fil, la sécurité et l'automatisation.", a: true, exp: "Vrai : c'est un socle large et transversal." },
    { type: "input", q: "Combien de concentrations faut-il réussir, en plus du core, pour valider le CCNP Enterprise ? (chiffre)", a: ["1", "une", "un"], ph: "un nombre", exp: "Une seule concentration, en complément du core." },
    { type: "qcm", q: "Que signifie le fait que l'ENCOR soit 'core' ?", opts: ["Qu'il est facultatif", "Qu'il est le tronc commun obligatoire", "Qu'il ne compte pas", "Qu'il remplace la concentration"], a: 1, exp: "Le core est le tronc commun obligatoire, commun à toutes les concentrations." },
    { type: "qcm", q: "Un ingénieur peut-il passer plusieurs concentrations au fil du temps ?", opts: ["Non, une seule à vie", "Oui, chacune ajoutant une specialisation", "Seulement s'il rate le core", "Uniquement le CCIE"], a: 1, exp: "Oui : beaucoup accumulent des concentrations, chacune étant une Specialist." }
  ],
  final: {
    title: "Exercice final — Bâtir son plan de certification",
    intro: `<p>Nadia est ingénieure réseau et passe ses journées à écrire des scripts Python et des playbooks Ansible pour piloter une grande flotte d'équipements Cisco. Elle veut décrocher le CCNP Enterprise. Aide-la à construire son plan.</p>`,
    questions: [
      { type: "input", q: "Quel examen core doit-elle réussir en premier ? (nom ou numéro)", a: ["encor", "encor 350-401", "350-401"], ph: "examen core", exp: "L'ENCOR 350-401 est le tronc commun obligatoire." },
      { type: "qcm", q: "Compte tenu de son métier (Python + Ansible), quelle concentration lui conseilles-tu ?", opts: ["ENWLSI (sans-fil)", "ENAUTO (automatisation)", "ENSLD (design)", "Aucune"], a: 1, exp: "ENAUTO 300-435 valorise ses compétences d'automatisation." },
      { type: "vf", q: "Elle doit réussir à la fois le core et une concentration pour obtenir le CCNP Enterprise.", a: true, exp: "Vrai : core + une concentration = CCNP Enterprise." },
      { type: "qcm", q: "Sa concentration automatisation réussie lui apporte aussi…", opts: ["Le CCIE automatiquement", "Une certification Specialist en automatisation", "Le CCNA", "Rien"], a: 1, exp: "Chaque concentration est également une certification Specialist." },
      { type: "vf", q: "Plus tard, elle pourra ajouter une seconde concentration (ex : ENARSI) si elle le souhaite.", a: true, exp: "Vrai : on peut cumuler des concentrations au fil du temps." }
    ],
    solution: `<pre class="pseudo"># Plan de Nadia
Etape 1 : CORE  -> ENCOR 350-401 (tronc commun)
Etape 2 : CONCENTRATION -> ENAUTO 300-435 (automatisation)
=> CCNP Enterprise obtenu, mention automatisation
Bonus  : ENAUTO reussi = certification Specialist automatisation
Plus tard : ajouter ENARSI/ENSDWI/... selon les besoins</pre>
<p>Core d'abord, puis la concentration alignée sur son métier : le plan est clair. Demain, on élargit l'horizon avec les pistes CCNP Security et Data Center.</p>`
  }
};
