<script>
var DAY = {
  num: 10,
  title: "Compter : NB, NBVAL, NB.VIDE",
  subtitle: "Trois fonctions pour dénombrer : les nombres, les cellules remplies, les cellules vides.",
  theory: `
<h3>1. Compter, mais compter QUOI ?</h3>
<p>« Combien y a-t-il de… » est une question quotidienne : combien de participants ? combien de notes saisies ? combien de cases encore vides ? Excel a une fonction différente selon ce qu'on veut compter. Le piège est de choisir la bonne.</p>
<h3>2. NB : compte seulement les NOMBRES</h3>
<p><strong>NB</strong> (prononcé « nombre ») compte uniquement les cellules qui contiennent un <em>nombre</em> (ou une date, qui est un nombre). Le texte et les cellules vides sont ignorés.</p>
<pre class="pseudo">=NB(B2:B10)         // compte combien de cellules de B2:B10 contiennent un NOMBRE
   NB(...)     compte les nombres
   B2:B10      la plage examinee
// du texte comme "absent" n'est PAS compte par NB</pre>
<div class="tip">Usage typique : combien d'élèves ont une note chiffrée ? NB ignore les « absent » écrits en toutes lettres.</div>
<h3>3. NBVAL : compte tout ce qui est REMPLI</h3>
<p><strong>NBVAL</strong> (« nombre de valeurs ») compte toutes les cellules <em>non vides</em> : nombres ET texte. Elle ne compte que les cellules qui contiennent quelque chose.</p>
<pre class="pseudo">=NBVAL(B2:B10)      // compte les cellules NON VIDES (nombres + texte)
   NBVAL(...)  compte tout ce qui n'est pas vide
   B2:B10      la plage examinee</pre>
<p>Usage typique : combien de personnes ont répondu (peu importe que la réponse soit un mot ou un chiffre) ?</p>
<h3>4. NB.VIDE : compte les cellules VIDES</h3>
<p><strong>NB.VIDE</strong> compte les cellules <em>vides</em> d'une plage. Utile pour repérer ce qui reste à remplir.</p>
<pre class="pseudo">=NB.VIDE(B2:B10)    // compte combien de cellules sont ENCORE VIDES
   NB.VIDE(...)  compte les cases vides
   B2:B10        la plage examinee</pre>
<div class="warn">Attention au point : la fonction s'écrit <code>NB.VIDE</code> avec un point, pas d'espace. De même, il existe <code>NB.SI</code> (jour 13) : la famille « NB. » avec un point.</div>
<h3>5. La relation entre les trois</h3>
<p>Sur une même plage : le nombre de cellules non vides (NBVAL) plus le nombre de cellules vides (NB.VIDE) égale le nombre total de cellules de la plage.</p>
<pre class="pseudo">NBVAL(plage) + NB.VIDE(plage) = nombre total de cellules de la plage
NB(plage) <= NBVAL(plage)   // NB (nombres seuls) est toujours <= NBVAL (nombres + texte)</pre>
<h3>6. Récapitulatif</h3>
<pre class="pseudo">Fonction    Compte...                       Exemple d'usage
NB          les NOMBRES uniquement          combien de notes chiffrees
NBVAL       les cellules NON VIDES          combien de reponses (mot ou chiffre)
NB.VIDE     les cellules VIDES              combien de cases a remplir</pre>
<div class="tip">Petite astuce : la barre d'état en bas de l'écran affiche déjà « Nombre » (NBVAL) et « Somme » quand tu sélectionnes une plage, sans écrire de formule. Pratique pour une vérification rapide.</div>`,
  exercises: [
    { type: "qcm", q: "Que compte NB(plage) ?", opts: ["les cellules vides", "uniquement les cellules contenant un nombre", "toutes les cellules remplies", "le texte seulement"], a: 1, exp: "NB ne compte que les nombres (et dates) ; il ignore texte et vides." },
    { type: "qcm", q: "Que compte NBVAL(plage) ?", opts: ["les nombres seulement", "toutes les cellules non vides (nombres + texte)", "les cellules vides", "les formules"], a: 1, exp: "NBVAL compte tout ce qui n'est pas vide, chiffres comme mots." },
    { type: "qcm", q: "Que compte NB.VIDE(plage) ?", opts: ["les cellules remplies", "les cellules vides", "les nombres", "les erreurs"], a: 1, exp: "NB.VIDE dénombre les cases vides d'une plage." },
    { type: "input", q: "Écris la fonction qui compte les cellules vides de B2 à B10.", a: "=NB.VIDE(B2:B10)", ph: "=NB.VIDE(...)", exp: "=NB.VIDE(B2:B10). Avec un point, pas d'espace." },
    { type: "vf", q: "NB ignore les cellules qui contiennent du texte.", a: true, exp: "Seuls les nombres sont comptés par NB ; « absent » en texte ne l'est pas." },
    { type: "qcm", q: "Une plage B2:B6 contient : 12, « absent », 15, vide, 9. Que renvoie NB(B2:B6) ?", opts: ["5", "3", "4", "2"], a: 1, exp: "Trois nombres (12, 15, 9). Le texte et le vide ne comptent pas." },
    { type: "input", q: "Même plage (12, « absent », 15, vide, 9). Que renvoie NBVAL(B2:B6) ?", a: "4", ph: "un nombre", exp: "Quatre cellules non vides (12, absent, 15, 9) ; seule la vide est exclue." },
    { type: "input", q: "Même plage (12, « absent », 15, vide, 9). Que renvoie NB.VIDE(B2:B6) ?", a: "1", ph: "un nombre", exp: "Une seule cellule vide dans la plage." },
    { type: "qcm", q: "Pour compter combien d'élèves ont une note chiffrée (les « absent » ne comptent pas), on utilise…", opts: ["NBVAL", "NB", "NB.VIDE", "SOMME"], a: 1, exp: "NB ne retient que les nombres : parfait pour ignorer les « absent »." },
    { type: "qcm", q: "Pour compter combien de personnes ont répondu (mot ou chiffre), on utilise…", opts: ["NB", "NBVAL", "NB.VIDE", "MAX"], a: 1, exp: "NBVAL compte toutes les réponses non vides." },
    { type: "vf", q: "Sur une plage, NBVAL(plage) + NB.VIDE(plage) = nombre total de cellules de la plage.", a: true, exp: "Chaque cellule est soit remplie (NBVAL) soit vide (NB.VIDE)." },
    { type: "vf", q: "NB(plage) est toujours inférieur ou égal à NBVAL(plage).", a: true, exp: "NB (nombres) est un sous-ensemble de NBVAL (nombres + texte)." },
    { type: "qcm", q: "Comment s'écrit correctement la fonction des cellules vides ?", opts: ["NBVIDE", "NB VIDE", "NB.VIDE", "NB-VIDE"], a: 2, exp: "Avec un point : NB.VIDE." },
    { type: "input", q: "Une plage de 8 cellules a 5 cases remplies. Combien renvoie NB.VIDE ?", a: "3", ph: "un nombre", exp: "8 − 5 = 3 cellules vides." },
    { type: "qcm", q: "Où voir rapidement le « Nombre » de cellules remplies sans écrire de formule ?", opts: ["Dans la Zone Nom", "Dans la barre d'état, en bas, en sélectionnant la plage", "Dans le titre", "Nulle part"], a: 1, exp: "La barre d'état affiche Nombre (NBVAL) et Somme pour la sélection courante." }
  ],
  final: {
    title: "Exercice final — Suivi d'inscriptions",
    intro: `<p>Une sortie scolaire : chaque élève doit rendre un montant. « ok » signifie payé sans montant précis, un nombre = montant versé, une case vide = pas encore rendu.</p>
<pre class="pseudo">      A          B
  1  Eleve      Paiement
  2  Ali        15
  3  Bea        ok
  4  Chris      (vide)
  5  Dora       15
  6  Emma       (vide)
  7  Farid      20</pre>
<p>La plage des paiements est B2:B7 (6 cellules).</p>`,
    questions: [
      { type: "input", q: "Combien d'élèves ont versé un MONTANT chiffré ? Écris la fonction.", a: "=NB(B2:B7)", ph: "=...(B2:B7)", exp: "=NB(B2:B7) compte les nombres : 15, 15, 20 → 3." },
      { type: "input", q: "Combien vaut =NB(B2:B7) ?", a: "3", ph: "un nombre", exp: "Trois montants chiffrés (15, 15, 20). « ok » et les vides ne comptent pas." },
      { type: "input", q: "Combien d'élèves ont donné une réponse (montant OU « ok ») ? Valeur de =NBVAL(B2:B7).", a: "4", ph: "un nombre", exp: "15, ok, 15, 20 = 4 cellules non vides." },
      { type: "input", q: "Combien d'élèves n'ont PAS encore rendu ? Valeur de =NB.VIDE(B2:B7).", a: "2", ph: "un nombre", exp: "Deux cellules vides (Chris et Emma)." },
      { type: "qcm", q: "Vérification : NBVAL(B2:B7) + NB.VIDE(B2:B7) doit valoir…", opts: ["3", "4", "6 (le nombre total de cellules)", "2"], a: 2, exp: "4 remplies + 2 vides = 6, le total de la plage." }
    ],
    solution: `<p>Chaque question appelle une fonction « compter » différente :</p>
<pre class="pseudo">=NB(B2:B7)       -> 3   // seulement les MONTANTS chiffres (15, 15, 20)
=NBVAL(B2:B7)    -> 4   // toutes les reponses non vides (dont "ok")
=NB.VIDE(B2:B7)  -> 2   // les cases encore vides (Chris, Emma)
Verif : 4 + 2 = 6 = nombre total de cellules de B2:B7</pre>
<p>La leçon : choisis la fonction selon ce que tu comptes. NB = nombres, NBVAL = tout ce qui est rempli, NB.VIDE = ce qui est vide. Demain (compter/sommer sous condition), on ira plus loin avec NB.SI.</p>`
  }
};
</script>
