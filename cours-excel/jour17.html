var DAY = {
  num: 17,
  title: "La mise en forme conditionnelle",
  subtitle: "Colorer automatiquement les cellules selon leur valeur.",
  theory: `
<h3>1. C'est quoi la mise en forme conditionnelle ?</h3>
<p>La <strong>mise en forme conditionnelle</strong> (souvent abrégée « MFC ») est une règle qui change <strong>automatiquement</strong> l'apparence d'une cellule (couleur du fond, du texte, icône…) <strong>selon ce qu'elle contient</strong>. Analogie : c'est un feu tricolore automatique — la cellule devient rouge si la valeur est mauvaise, verte si elle est bonne, sans que tu aies à colorier toi-même.</p>
<p>La grande différence avec la couleur « manuelle » (jour 5) : ici la couleur <strong>suit la donnée</strong>. Si tu changes le nombre, la couleur se met à jour toute seule.</p>
<div class="tip">Le chemin de départ est toujours le même : sélectionne d'abord les cellules, puis <code>Ruban ▸ Accueil ▸ Mise en forme conditionnelle</code>.</div>
<h3>2. Les règles « toutes prêtes »</h3>
<p>Sélectionne une plage de nombres, puis <code>Ruban ▸ Accueil ▸ Mise en forme conditionnelle ▸ Règles de mise en surbrillance des cellules</code>. Tu obtiens des règles clés en main :</p>
<pre class="pseudo">Supérieur à…        // colore les cellules dont la valeur dépasse un seuil que tu tapes
Inférieur à…        // colore celles en dessous d'un seuil
Entre…              // colore celles comprises entre deux bornes
Égal à…             // colore celles égales à une valeur précise
Texte qui contient… // colore les cellules contenant un mot donné</pre>
<p>Exemple concret : sélectionne les notes en <strong>B2:B20</strong>, choisis <strong>Inférieur à…</strong>, tape <strong>10</strong>, choisis un remplissage rouge. Toutes les notes sous 10 deviennent rouges.</p>
<h3>3. Barres, nuances et jeux d'icônes</h3>
<p>Toujours dans le même menu : <code>Barres de données</code>, <code>Nuances de couleurs</code> et <code>Jeux d'icônes</code> transforment une colonne de nombres en mini-graphique dans les cellules.</p>
<ul>
<li><strong>Barres de données</strong> : une petite barre remplit la cellule, proportionnelle à la valeur (comme un thermomètre).</li>
<li><strong>Nuances de couleurs</strong> : un dégradé (par ex. rouge → jaune → vert) selon que la valeur est basse ou haute.</li>
<li><strong>Jeux d'icônes</strong> : des flèches, feux ou symboles (▲ ● ▼) placés à côté de chaque nombre.</li>
</ul>
<h3>4. Une règle avec formule (pour colorer TOUTE la ligne)</h3>
<p>Pour colorer une ligne entière selon UNE colonne, il faut une règle basée sur une formule. Sélectionne la plage (par ex. A2:C20), puis <code>Mise en forme conditionnelle ▸ Nouvelle règle ▸ Utiliser une formule…</code> et saisis :</p>
<pre class="pseudo">=\$C2<10          // teste la colonne C de la ligne courante
// le \$ devant C : la colonne est FIGÉE (on regarde toujours la colonne C)
// pas de \$ devant le 2 : la ligne s'ADAPTE (ligne 2, puis 3, puis 4…)
// résultat : chaque ligne où la note en C est < 10 est colorée en entier</pre>
<div class="warn">Le placement des <code>\$</code> est LA difficulté (revois le jour 8). Pour colorer une ligne d'après une colonne fixe : <code>\$</code> devant la lettre, rien devant le chiffre.</div>
<h3>5. Modifier ou supprimer une règle</h3>
<p><code>Mise en forme conditionnelle ▸ Gérer les règles</code> ouvre la liste de toutes les règles actives : tu peux les éditer, changer leur ordre ou les supprimer. Pour tout effacer d'un coup : <code>Mise en forme conditionnelle ▸ Effacer les règles</code>.</p>
<div class="tip">Compatibilité : la MFC existe à l'identique dans Microsoft 365 et Office 2021/2019. Rien de spécifique aux versions récentes ici.</div>`,

    { type: "qcm", q: "À quoi sert la mise en forme conditionnelle ?", opts: ["À faire des calculs", "À changer l'apparence d'une cellule selon sa valeur", "À trier les données", "À imprimer plus vite"], a: 1, exp: "La MFC applique automatiquement une mise en forme en fonction du contenu." },

    { type: "qcm", q: "Où gère-t-on la liste des règles existantes ?", opts: ["Mise en forme conditionnelle ▸ Gérer les règles", "Fichier ▸ Options", "Données ▸ Trier", "Insertion ▸ Tableau"], a: 0, exp: "Gérer les règles liste, ordonne, édite ou supprime les règles." },
    { type: "qcm", q: "Un « jeu d'icônes » ajoute :", opts: ["Des flèches ou feux à côté des valeurs", "Une nouvelle colonne", "Une formule", "Un graphique séparé"], a: 0, exp: "Des symboles (▲ ● ▼, feux…) selon la valeur." },
    { type: "vf", q: "On peut cumuler plusieurs règles sur la même plage.", a: true, exp: "Oui, elles s'empilent ; leur ordre se gère dans Gérer les règles." },
    { type: "qcm", q: "Pour tout enlever d'un coup, on utilise :", opts: ["Effacer les règles", "Supprimer les lignes", "Accueil ▸ Effacer ▸ Effacer les formats", "Format de cellule ▸ Remplissage ▸ Aucune couleur"], a: 0, exp: "Mise en forme conditionnelle ▸ Effacer les règles." },
    { type: "qcm", q: "Quelle règle mettre pour repérer un stock 'compris entre 10 et 20' ?", opts: ["Supérieur à…", "Entre…", "Texte qui contient…", "Nuances de couleurs"], a: 1, exp: "La règle Entre… prend deux bornes." },
    { type: "vf", q: "La mise en forme conditionnelle fonctionne pareil dans 365 et dans Office 2021/2019.", a: true, exp: "Aucune différence de version pour la MFC de base." },
    { type: "qcm", q: "Avant de créer une règle, la première étape est :", opts: ["Sélectionner les cellules concernées", "Enregistrer le fichier", "Ouvrir un graphique", "Trier la colonne"], a: 0, exp: "On sélectionne toujours la plage d'abord, puis on crée la règle." }
  ],

    questions: [

      { type: "qcm", q: "Quelle règle toute prête choisir ?", opts: ["Supérieur à…", "Inférieur à…", "Entre…", "Texte qui contient…"], a: 1, exp: "Inférieur à… avec le seuil 600." },
      { type: "input", q: "Combien de cellules deviennent rouges (valeurs < 600) ?", a: "1", ph: "nombre", exp: "Seul Bruno (450) est sous 600 : 1 cellule." },

      { type: "input", q: "Sur les barres de données, quelle valeur donne la barre la plus longue ?", a: "1500", ph: "nombre", exp: "La plus grande valeur (David, 1500) remplit toute la cellule." }
    ],
    solution: `<p><strong>Étape 1 — Colorer les faibles ventes :</strong></p>
<pre class="pseudo">1. Sélectionne B2:B5
2. Accueil ▸ Mise en forme conditionnelle ▸ Règles de mise en surbrillance ▸ Inférieur à…
3. Tape 600, choisis « Remplissage rouge clair »

<pre class="pseudo">1. Garde B2:B5 sélectionné
2. Accueil ▸ Mise en forme conditionnelle ▸ Barres de données ▸ choisis une couleur
→ chaque cellule affiche une barre proportionnelle : David a la plus longue.</pre>
<p>Astuce : les deux règles cohabitent sans problème. Tu peux les revoir dans « Gérer les règles ».</p>`
  }
};
