<script>
var DAY = {
  num: 7,
  title: "Les premières formules : + - × ÷",
  subtitle: "Faire calculer Excel : le signe =, les opérateurs, et la magie des références.",
  theory: `
<h3>1. Une formule commence TOUJOURS par =</h3>
<p>Une <strong>formule</strong> est un calcul qu'Excel effectue à ta place. La règle numéro un : elle commence par le signe <strong>égal</strong> <code>=</code>. Sans le <code>=</code>, Excel croit que tu écris du texte et affiche bêtement ce que tu as tapé.</p>
<pre class="pseudo">=2+3         // Excel calcule et affiche 5
2+3          // SANS le = : Excel affiche le texte "2+3", aucun calcul !</pre>
<div class="warn">Le piège du débutant : oublier le <code>=</code>. Si ta cellule affiche la formule au lieu du résultat, vérifie d'abord que tu as bien commencé par <code>=</code>.</div>
<h3>2. Les quatre opérateurs</h3>
<pre class="pseudo">+   addition           =10+5   ->  15
-   soustraction       =10-5   ->  5
*   multiplication     =10*5   ->  50   // l'etoile, PAS le x
/   division           =10/2   ->  5    // la barre oblique, PAS le : des fractions</pre>
<div class="tip">On tape <strong>*</strong> pour « fois » et <strong>/</strong> pour « divisé ». Le « × » et le « ÷ » du cahier n'existent pas au clavier.</div>
<h3>3. Le vrai pouvoir : calculer avec des références</h3>
<p>Au lieu de taper des nombres fixes, on met des <strong>références</strong> de cellules. Excel va alors chercher la valeur qui s'y trouve. Avantage énorme : si la valeur change, le résultat se recalcule tout seul.</p>
<pre class="pseudo">=A1+A2       // additionne le contenu de A1 et celui de A2
   A1        Excel lit la valeur rangee en A1
   +         addition
   A2        Excel lit la valeur rangee en A2
// si A1 passe de 10 a 20, le resultat se met a jour AUTOMATIQUEMENT</pre>
<div class="tip">Astuce de saisie : après le <code>=</code>, tu peux <strong>cliquer</strong> sur une cellule au lieu de taper sa référence. Excel écrit l'adresse pour toi. Puis tape l'opérateur, clique la suivante, et Entrée.</div>
<h3>4. Les parenthèses et l'ordre des opérations</h3>
<p>Excel respecte les règles mathématiques : <strong>×</strong> et <strong>÷</strong> avant <strong>+</strong> et <strong>−</strong>. Les <strong>parenthèses</strong> forcent l'ordre.</p>
<pre class="pseudo">=2+3*4         // vaut 14 : le 3*4 se fait d'abord (=12), puis +2
=(2+3)*4       // vaut 20 : la parenthese force le 2+3 d'abord (=5), puis *4
   ( )         change l'ordre : ce qui est dedans se calcule en premier</pre>
<h3>5. Un exemple concret : un total et une TVA</h3>
<pre class="pseudo">      A          B
  1  Prix HT    100
  2  TVA 20%    =B1*0,2      // 100 * 0,2 = 20  (montant de TVA)
  3  Prix TTC   =B1+B2       // 100 + 20 = 120  (total a payer)</pre>
<p>Comme B2 et B3 utilisent des <em>références</em>, changer B1 (le prix HT) recalcule instantanément la TVA et le TTC. C'est tout l'intérêt d'un tableur.</p>
<div class="warn">Ne mets pas le résultat « en dur » (taper 120 à la main) : tu perds le recalcul automatique. Fais toujours calculer Excel avec une formule.</div>`,
  exercises: [
    { type: "qcm", q: "Par quel signe commence toute formule ?", opts: ["+", "=", "*", "( )"], a: 1, exp: "Le signe = déclenche le calcul. Sans lui, Excel affiche du texte." },
    { type: "qcm", q: "Que se passe-t-il si tu tapes « 2+3 » sans le = ?", opts: ["Affiche 5", "Affiche le texte 2+3, sans calcul", "Erreur rouge", "Affiche 23"], a: 1, exp: "Sans =, Excel prend ça pour du texte et ne calcule rien." },
    { type: "qcm", q: "Quel signe utilise-t-on pour multiplier ?", opts: ["x", "*", "×", "."], a: 1, exp: "L'étoile * ; le « × » du cahier n'existe pas au clavier." },
    { type: "qcm", q: "Quel signe utilise-t-on pour diviser ?", opts: [":", "÷", "/", "backslash"], a: 2, exp: "La barre oblique /. Ex : =10/2 donne 5." },
    { type: "input", q: "Que vaut =10-4 ?", a: "6", ph: "un nombre", exp: "Soustraction simple : 10 − 4 = 6." },
    { type: "input", q: "Que vaut =2+3*4 ?", a: "14", ph: "un nombre", exp: "La multiplication d'abord : 3*4=12, puis +2 = 14." },
    { type: "input", q: "Que vaut =(2+3)*4 ?", a: "20", ph: "un nombre", exp: "La parenthèse force 2+3=5 d'abord, puis *4 = 20." },
    { type: "qcm", q: "À quoi servent les parenthèses dans une formule ?", opts: ["À rien", "À forcer l'ordre des opérations (elles se calculent en premier)", "À colorier", "À écrire du texte"], a: 1, exp: "Ce qui est entre parenthèses est calculé avant le reste." },
    { type: "qcm", q: "Pourquoi écrire =A1+A2 plutôt que =10+5 ?", opts: ["C'est plus joli", "Car le résultat se recalcule tout seul si A1 ou A2 change", "C'est obligatoire", "Ça va plus vite à taper"], a: 1, exp: "Les références rendent le calcul dynamique : c'est l'atout du tableur." },
    { type: "vf", q: "Après le =, on peut cliquer sur une cellule au lieu de taper sa référence.", a: true, exp: "Excel insère l'adresse de la cellule cliquée : plus rapide et sans faute de frappe." },
    { type: "input", q: "A1 vaut 8 et A2 vaut 5. Que vaut =A1*A2 ?", a: "40", ph: "un nombre", exp: "Excel lit 8 et 5, multiplie : 40." },
    { type: "input", q: "B1 vaut 100. Que vaut =B1*0,2 ?", a: "20", ph: "un nombre", exp: "100 × 0,2 = 20 (par ex. une TVA de 20 %)." },
    { type: "vf", q: "Ordre de priorité : la multiplication et la division passent avant l'addition et la soustraction.", a: true, exp: "Comme en maths ; les parenthèses permettent de changer cet ordre." },
    { type: "qcm", q: "Ta cellule affiche « =A1+A2 » au lieu du résultat. Cause probable ?", opts: ["La cellule est au format Texte : elle est traitée comme texte", "A1 est vide", "Il y a trop de décimales", "Le fichier est corrompu"], a: 0, exp: "Souvent la cellule est en format Texte : repasse-la en Standard et re-valide la formule." },
    { type: "qcm", q: "Il vaut mieux, pour un prix TTC, écrire…", opts: ["120 tapé à la main", "=B1+B2 pour qu'il se recalcule si le prix change", "le mot « cent vingt »", "rien"], a: 1, exp: "Une formule garde le total à jour automatiquement ; une valeur en dur non." }
  ],
  final: {
    title: "Exercice final — La note de restaurant",
    intro: `<p>On calcule l'addition d'un repas. Les prix unitaires et les quantités sont donnés ; on veut les totaux par ligne, le sous-total, puis le total avec un pourboire de 10 %.</p>
<pre class="pseudo">      A          B         C          D
  1  Plat       PrixUnit  Quantite   Total
  2  Pizza      12        2          =B2*C2
  3  Salade     8         1          =B3*C3
  4  Boisson    3         3          =B4*C4
  5  Sous-total                      =D2+D3+D4
  6  Pourboire 10%                   =D5*0,1
  7  TOTAL                           =D5+D6</pre>`,
    questions: [
      { type: "input", q: "Que vaut D2 (=B2*C2, pizza) ?", a: "24", ph: "un nombre", exp: "12 × 2 = 24." },
      { type: "input", q: "Que vaut D5, le sous-total (=D2+D3+D4) ?", a: "41", ph: "un nombre", exp: "24 (pizza) + 8 (salade) + 9 (boisson) = 41." },
      { type: "input", q: "Que vaut D6, le pourboire (=D5*0,1) ?", a: "4,1", ph: "un nombre", exp: "41 × 0,1 = 4,1." },
      { type: "input", q: "Que vaut D7, le total (=D5+D6) ?", a: "45,1", ph: "un nombre", exp: "41 + 4,1 = 45,1." },
      { type: "qcm", q: "Le client ajoute une boisson (C4 passe de 3 à 4). Que se passe-t-il ?", opts: ["Rien, il faut tout recalculer à la main", "D4, D5, D6 et D7 se recalculent automatiquement", "Une erreur apparaît", "Seul D4 change, pas le total"], a: 1, exp: "Comme tout est en formules avec références, la chaîne entière se met à jour." }
    ],
    solution: `<p>Chaque case est une formule qui pointe vers d'autres cellules :</p>
<pre class="pseudo">D2 =B2*C2  -> 12*2 = 24        // prix unitaire x quantite
D3 =B3*C3  -> 8*1  = 8
D4 =B4*C4  -> 3*3  = 9
D5 =D2+D3+D4 -> 24+8+9 = 41    // sous-total
D6 =D5*0,1   -> 41*0,1 = 4,1   // pourboire 10 %
D7 =D5+D6    -> 41+4,1 = 45,1  // total a payer</pre>
<p>Puisque tout est relié par des références, modifier une quantité ou un prix recalcule automatiquement toute l'addition. Demain, on verra comment recopier ces formules proprement (le rôle du $).</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris tes formules et où les placer…",
  items: [
  { id: "excel-j07", title: "Facture avec formules", level: 2,
    statement: "Recopie ce tableau, puis écris les FORMULES (pas les résultats tapés à la main) pour calculer le total de chaque ligne en colonne D, puis le total général en D5.<pre class=\"pseudo\">      A          B         C          D\n  1  Article    PrixUnit  Quantite   Total\n  2  Cahier     2,5       4          ?\n  3  Stylo      1,2       10         ?\n  4  Gomme      0,8       3          ?\n  5  TOTAL                           ?</pre>",
    hints: [
      "Chaque total de ligne = prix unitaire × quantité. En D2, commence par = puis multiplie B2 par C2 avec l'étoile.",
      "Une fois D2 écrite, recopie-la vers le bas avec la poignée : D3 et D4 s'ajustent tout seuls.",
      "Le total général en D5 additionne les trois totaux : =D2+D3+D4."
    ],
    solution: "En D2 (total de la ligne Cahier), tape :\n=B2*C2         // multiplie le prix unitaire par la quantite\n   B2   le prix unitaire du cahier (2,5)\n   *    multiplication\n   C2   la quantite (4)\n-> D2 = 10\n\nRecopie D2 vers D3 et D4 (poignee de recopie) :\nD3 devient =B3*C3  -> 1,2*10 = 12\nD4 devient =B4*C4  -> 0,8*3  = 2,4\n\nEn D5 (total general), tape :\n=D2+D3+D4      // additionne les trois totaux de ligne\n-> D5 = 10 + 12 + 2,4 = 24,4\n\nResultat attendu : D2=10, D3=12, D4=2,4, D5=24,4. Si tu changes une quantite, tout se recalcule.",
    note: "N'oublie pas le = au debut de CHAQUE formule. Et utilise * pour multiplier (pas le x). Ne tape jamais le resultat en dur : laisse Excel calculer pour garder la mise a jour automatique." }
  ]
};
</script>
