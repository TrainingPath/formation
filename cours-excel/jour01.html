<script>
var DAY = {
  num: 1,
  title: "Découvrir Excel : classeur, feuille, cellule",
  subtitle: "Le vocabulaire de base et le tour de l'écran, sans rien calculer encore.",
  theory: `
<h3>1. Excel, c'est quoi ?</h3>
<p>Excel est un <strong>tableur</strong> : un logiciel qui range des informations dans une immense grille de petits rectangles. Imagine une feuille de papier quadrillée géante, mais qui sait aussi <em>calculer</em> toute seule. On s'en sert pour des budgets, des listes, des notes, des plannings, des statistiques…</p>
<div class="tip">Aujourd'hui on ne calcule rien : on apprend juste à se repérer et à nommer ce qu'on voit. C'est la fondation de tout le reste.</div>
<h3>2. Trois mots à retenir : classeur, feuille, cellule</h3>
<p><strong>Le classeur</strong> est le fichier Excel entier, celui que tu enregistres sur ton ordinateur (il porte l'extension <code>.xlsx</code>). Analogie : c'est le <em>cahier</em>.</p>
<p><strong>La feuille</strong> (ou « feuille de calcul ») est une page à l'intérieur du classeur. Un classeur peut contenir plusieurs feuilles, comme un cahier contient plusieurs pages. Tu les vois en bas de l'écran sous forme d'<strong>onglets</strong> (<em>Feuil1</em>, <em>Feuil2</em>…). Analogie : c'est la <em>page</em> du cahier.</p>
<p><strong>La cellule</strong> est un seul petit rectangle de la grille, là où on écrit une information. Analogie : c'est la <em>case</em> du quadrillage. C'est l'unité de base d'Excel : tout se passe dans des cellules.</p>
<pre class="pseudo">Classeur (le fichier .xlsx)          // le cahier tout entier
   +-- Feuille "Feuil1"              // une page du cahier
   |      +-- Cellule A1            // une case de la page
   |      +-- Cellule B1
   +-- Feuille "Feuil2"             // une autre page</pre>
<h3>3. Repérer une cellule : colonnes, lignes, référence</h3>
<p>Les <strong>colonnes</strong> sont verticales et portent des <strong>lettres</strong> en haut : A, B, C, … Z, puis AA, AB…</p>
<p>Les <strong>lignes</strong> sont horizontales et portent des <strong>numéros</strong> à gauche : 1, 2, 3, …</p>
<p>Chaque cellule a donc une adresse unique, appelée sa <strong>référence</strong> : on colle la <em>lettre de la colonne</em> puis le <em>numéro de la ligne</em>. La case au croisement de la colonne B et de la ligne 3 s'appelle <strong>B3</strong>. C'est exactement comme la bataille navale.</p>
<pre class="pseudo">      A        B        C          // en-têtes de colonnes (lettres)
  1  A1       B1       C1          // ligne 1
  2  A2       B2       C2          // ligne 2
  3  A3      [B3]      C3          // B3 = colonne B, ligne 3</pre>
<div class="tip">On dit toujours la <strong>colonne d'abord</strong> (lettre), puis la ligne (chiffre) : B3, jamais 3B.</div>
<h3>4. Le tour de l'écran</h3>
<ul>
<li><strong>Le Ruban</strong> : la grande barre d'outils en haut, organisée en onglets (<em>Accueil</em>, <em>Insertion</em>, <em>Mise en page</em>, <em>Formules</em>, <em>Données</em>…). On y trouve tous les boutons.</li>
<li><strong>La Zone Nom</strong> : la petite case tout à gauche, juste au-dessus de la grille. Elle affiche la référence de la cellule sélectionnée (par ex. <em>A1</em>). Tu peux y taper une référence pour y sauter directement.</li>
<li><strong>La Barre de formule</strong> : la longue barre à droite de la Zone Nom. Elle montre le <em>vrai</em> contenu de la cellule sélectionnée.</li>
<li><strong>La cellule active</strong> : la cellule entourée d'un cadre épais, celle qui recevra ce que tu tapes.</li>
<li><strong>Les onglets de feuille</strong> : en bas, pour passer d'une feuille à l'autre et en ajouter avec le bouton <strong>+</strong>.</li>
</ul>
<h3>5. Se déplacer et enregistrer</h3>
<pre class="pseudo">Clic sur une case          // la sélectionne (elle devient active)
Fleches du clavier         // se deplace d'une cellule
Ctrl + Origine (Debut)     // revient en A1
Ctrl + S                   // enregistre le classeur</pre>
<p>Chemins de ruban utiles : <code>Ruban ▸ Fichier ▸ Enregistrer sous</code> pour choisir l'emplacement, <code>Ruban ▸ Fichier ▸ Nouveau</code> pour créer un classeur vierge.</p>
<div class="warn">Ne confonds pas « classeur » (le fichier entier) et « feuille » (une page dedans). C'est l'erreur de débutant la plus fréquente.</div>`,
  exercises: [
    { type: "qcm", q: "Comment s'appelle le fichier Excel tout entier que l'on enregistre ?", opts: ["Une feuille", "Un classeur", "Une cellule", "Un ruban"], a: 1, exp: "Le fichier entier (.xlsx) est le classeur ; c'est le « cahier »." },
    { type: "qcm", q: "Comment s'appelle une seule case de la grille ?", opts: ["Une colonne", "Une ligne", "Une cellule", "Une feuille"], a: 2, exp: "La cellule est l'unité de base : un rectangle où l'on écrit une information." },
    { type: "input", q: "Quelle est la référence de la case au croisement de la colonne C et de la ligne 5 ?", a: "C5", ph: "ex : A1", exp: "Colonne d'abord (C), puis ligne (5) : C5." },
    { type: "qcm", q: "Les colonnes sont repérées par…", opts: ["des numéros (1, 2, 3)", "des lettres (A, B, C)", "des couleurs", "des symboles"], a: 1, exp: "Colonnes = lettres en haut ; lignes = numéros à gauche." },
    { type: "vf", q: "Un classeur peut contenir plusieurs feuilles.", a: true, exp: "Comme un cahier contient plusieurs pages : on les voit en bas sous forme d'onglets." },
    { type: "qcm", q: "On écrit une référence de cellule…", opts: ["ligne puis colonne (3B)", "colonne puis ligne (B3)", "dans n'importe quel ordre", "avec un tiret (B-3)"], a: 1, exp: "Toujours la lettre de colonne d'abord, puis le numéro de ligne : B3." },
    { type: "qcm", q: "À quoi sert la Zone Nom (petite case en haut à gauche) ?", opts: ["À changer la couleur", "À afficher la référence de la cellule active et y sauter", "À enregistrer le fichier", "À imprimer"], a: 1, exp: "Elle montre l'adresse de la cellule sélectionnée ; on peut y taper une référence pour y aller directement." },
    { type: "input", q: "Combien de lettres compose la référence de la première cellule de la feuille (colonne A, ligne 1) ?", a: "A1", ph: "la référence", exp: "La toute première cellule est A1." },
    { type: "vf", q: "La cellule « active » est celle entourée d'un cadre épais : c'est elle qui reçoit ce que tu tapes.", a: true, exp: "Exactement : une seule cellule est active à la fois." },
    { type: "qcm", q: "Comment s'appelle la grande barre d'outils en haut avec les onglets Accueil, Insertion, Données… ?", opts: ["La barre de formule", "Le Ruban", "La Zone Nom", "L'onglet de feuille"], a: 1, exp: "C'est le Ruban : il regroupe tous les boutons, classés par onglets." },
    { type: "qcm", q: "Où trouve-t-on les onglets Feuil1, Feuil2… ?", opts: ["En haut à droite", "En bas de l'écran", "Dans le Ruban", "Dans la Zone Nom"], a: 1, exp: "Les onglets de feuille sont en bas ; le bouton + en ajoute une." },
    { type: "vf", q: "La barre de formule affiche le vrai contenu de la cellule sélectionnée.", a: true, exp: "Utile car une cellule peut afficher un résultat différent de ce qu'elle contient réellement." },
    { type: "qcm", q: "Quel raccourci enregistre le classeur ?", opts: ["Ctrl + S", "Ctrl + P", "Ctrl + Z", "F1"], a: 0, exp: "Ctrl + S enregistre (Save). Prends l'habitude de l'utiliser souvent." },
    { type: "input", q: "Analogie : si le classeur est le cahier et la cellule est la case, la feuille est la…", a: "page", ph: "un mot", exp: "La feuille est la page du cahier." },
    { type: "qcm", q: "Quel raccourci ramène directement à la cellule A1 ?", opts: ["Ctrl + A", "Ctrl + Origine (Début)", "Entrée", "Échap"], a: 1, exp: "Ctrl + Origine (touche « Début »/« Home ») ramène en haut à gauche, en A1." }
  ],
  final: {
    title: "Exercice final — Se repérer dans la grille",
    intro: `<p>On ouvre un classeur avec une feuille contenant un petit tableau. Voici ce qu'on voit à l'écran :</p>
<pre class="pseudo">      A          B         C
  1  Produit    Prix      Stock
  2  Pomme      0,50      120
  3  Poire      0,80      95
  4  Banane     0,40      200</pre>
<p>Réponds en observant les colonnes (lettres) et les lignes (numéros).</p>`,
    questions: [
      { type: "input", q: "Quelle est la référence de la cellule contenant le mot « Poire » ?", a: "A3", ph: "ex : A1", exp: "« Poire » est colonne A, ligne 3 : A3." },
      { type: "input", q: "Quelle est la référence de la cellule contenant le stock 200 ?", a: "C4", ph: "ex : A1", exp: "200 est colonne C (Stock), ligne 4 (Banane) : C4." },
      { type: "qcm", q: "Que contient la cellule B1 ?", opts: ["Prix", "Pomme", "0,50", "Stock"], a: 0, exp: "B1 est colonne B, ligne 1 : l'en-tête « Prix »." },
      { type: "input", q: "Dans quelle cellule est écrit le prix de la banane (0,40) ?", a: "B4", ph: "ex : A1", exp: "Colonne B (Prix), ligne 4 (Banane) : B4." },
      { type: "qcm", q: "Ce tableau occupe une seule feuille. Comment ajouter une deuxième feuille au classeur ?", opts: ["En cliquant sur Ctrl + S", "En cliquant sur le bouton + à côté des onglets, en bas", "En tapant dans la barre de formule", "C'est impossible"], a: 1, exp: "Le bouton + en bas, à droite des onglets de feuille, crée une nouvelle feuille." }
    ],
    solution: `<p>La méthode, à chaque fois : repère la <strong>colonne</strong> (lettre en haut) puis la <strong>ligne</strong> (numéro à gauche), et colle les deux.</p>
<pre class="pseudo">"Poire"  -> colonne A, ligne 3  -> A3
 200     -> colonne C, ligne 4  -> C4
 B1      -> colonne B, ligne 1  -> "Prix"
 0,40    -> colonne B, ligne 4  -> B4</pre>
<p>Tout Excel repose sur ce repérage : une cellule = une lettre + un numéro. Demain, on commence à écrire dedans.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  { id: "excel-j01", title: "Ma première feuille", level: 1,
    statement: "Ouvre un classeur vierge. Recopie <strong>exactement</strong> ce mini-tableau dans la feuille (respecte les colonnes et les lignes), puis enregistre le classeur sous le nom <em>Essai</em>.<pre class=\"pseudo\">      A          B\n  1  Ville      Habitants\n  2  Paris      2100000\n  3  Lyon       520000</pre>",

    ],
    solution: "Manip pas a pas :\n1) Clique sur la cellule A1.            // la case en haut a gauche devient active\n2) Tape : Ville  puis Tab.              // Tab valide et va en B1\n3) Tape : Habitants  puis Entree.       // Entree valide et descend\n4) Clique sur A2, tape : Paris  puis Tab.\n5) En B2, tape : 2100000  puis Entree.\n6) Clique sur A3, tape : Lyon  puis Tab.\n7) En B3, tape : 520000  puis Entree.\n8) Ctrl + S  ->  choisis un dossier  ->  nom : Essai  ->  Enregistrer.\n\nResultat attendu : A1=Ville, B1=Habitants, A2=Paris, B2=2100000, A3=Lyon, B3=520000, fichier Essai.xlsx enregistre.",

  ]
};
