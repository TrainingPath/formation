<script>
var DAY = {
  num: 25,
  title: "La validation des données (listes déroulantes)",
  subtitle: "Forcer une saisie propre : listes de choix et contrôles de valeurs.",
  theory: `
<h3>1. C'est quoi la validation des données ?</h3>
<p>La <strong>validation des données</strong> est une règle qui <strong>contrôle ce qu'on a le droit de taper</strong> dans une cellule. Analogie : c'est un videur à l'entrée — il refuse ce qui ne respecte pas la règle (« que des nombres entre 0 et 100 », « seulement Oui/Non »). Elle sert surtout à créer des <strong>listes déroulantes</strong> et à éviter les fautes de frappe.</p>
<div class="tip">Le chemin de base : sélectionne les cellules, puis <code>Ruban ▸ Données ▸ Validation des données</code>.</div>
<h3>2. Créer une liste déroulante</h3>
<p>Une <strong>liste déroulante</strong> transforme la cellule en menu : l'utilisateur choisit dans une liste au lieu de taper. Deux façons de définir les choix :</p>
<pre class="pseudo">Données ▸ Validation des données ▸ Autoriser : « Liste »
Méthode A — taper les choix séparés par des points-virgules :
   Source :  Oui;Non;Peut-être
Méthode B — pointer une plage qui contient les choix :
   Source :  =\$F\$2:\$F\$5      // les valeurs sont écrites en F2:F5</pre>
<div class="tip">La méthode B (plage) est préférable : pour ajouter un choix, il suffit d'éditer la plage, sans rouvrir la validation.</div>
<h3>3. Contrôler des nombres, des dates, une longueur</h3>
<p>Le menu « Autoriser » propose d'autres règles que la liste :</p>
<pre class="pseudo">Nombre entier ▸ entre 0 et 100        // refuse 150 ou un texte
Décimal      ▸ supérieur à 0          // refuse les négatifs
Date         ▸ postérieure à 01/01/2024
Longueur du texte ▸ inférieure à 10   // ex. un code de 9 caractères max</pre>
<h3>4. Personnaliser les messages</h3>
<p>Dans la boîte de validation, deux onglets bien utiles :</p>
<ul>
<li><strong>Message de saisie</strong> : une info-bulle qui s'affiche quand on clique la cellule (« Choisis une ville »).</li>
<li><strong>Alerte d'erreur</strong> : le message affiché en cas de saisie interdite, avec 3 styles — <em>Arrêt</em> (bloque), <em>Avertissement</em> (prévient mais laisse passer), <em>Information</em> (informe seulement).</li>
</ul>
<h3>5. Où sont stockés les choix ? Astuce plage nommée</h3>
<p>On peut donner un nom à la plage des choix (jour 26) et l'utiliser comme source : <code>Source : =Villes</code> au lieu de <code>=\$F\$2:\$F\$5</code>. Plus lisible, surtout si la liste est sur une autre feuille.</p>
<div class="warn">Avant 365, une source de liste sur une AUTRE feuille exigeait justement une plage nommée. Depuis 365 on peut pointer directement une autre feuille, mais la plage nommée reste la méthode la plus robuste, valable dans toutes les versions.</div>
<h3>6. Repérer et enlever une validation</h3>
<pre class="pseudo">Données ▸ Validation des données ▸ (onglet Options) ▸ « Effacer tout »   // enlève la règle
Accueil ▸ Rechercher et sélectionner ▸ « Validation des données »       // repère les cellules qui en ont une</pre>
<div class="tip">Une liste déroulante se reconnaît à la petite flèche ▼ qui apparaît quand on sélectionne la cellule.</div>`,
  exercises: [
    { type: "qcm", q: "La validation des données sert à :", opts: ["Calculer", "Contrôler ce qu'on a le droit de taper", "Trier", "Imprimer"], a: 1, exp: "C'est un videur qui refuse les saisies non conformes." },
    { type: "qcm", q: "Où l'active-t-on ?", opts: ["Données ▸ Validation des données", "Insertion ▸ Tableau", "Accueil ▸ Police", "Révision"], a: 0, exp: "Ruban ▸ Données ▸ Validation des données." },
    { type: "qcm", q: "Pour une liste déroulante, on choisit Autoriser :", opts: ["Nombre entier", "Liste", "Date", "Décimal"], a: 1, exp: "Le type « Liste » crée le menu déroulant." },
    { type: "qcm", q: "Comment taper directement les choix Oui/Non ?", opts: ["Source : Oui;Non", "Source : Oui,Non seulement", "Source : Oui-Non", "Dans un graphique"], a: 0, exp: "Séparés par des points-virgules dans le champ Source." },
    { type: "qcm", q: "Avantage de pointer une plage (=\$F\$2:\$F\$5) comme source :", opts: ["C'est plus lent", "On ajoute un choix en éditant la plage, sans rouvrir la validation", "Ça supprime la liste", "Ça évite les doublons dans la liste"], a: 1, exp: "La liste suit la plage : plus souple à faire évoluer." },
    { type: "vf", q: "On peut limiter une cellule aux nombres entiers entre 0 et 100.", a: true, exp: "Autoriser ▸ Nombre entier ▸ entre 0 et 100." },
    { type: "qcm", q: "Le 'Message de saisie' :", opts: ["Bloque la cellule", "Affiche une info-bulle quand on clique la cellule", "Trie", "Colore"], a: 1, exp: "C'est une aide affichée à la sélection de la cellule." },
    { type: "qcm", q: "Le style d'alerte qui BLOQUE la saisie interdite est :", opts: ["Arrêt", "Avertissement", "Information", "Aucun"], a: 0, exp: "Arrêt empêche la validation ; Avertissement/Information laissent passer." },
    { type: "qcm", q: "L'alerte 'Avertissement' :", opts: ["Bloque toujours", "Prévient mais laisse passer si on confirme", "Supprime la cellule", "Trie"], a: 1, exp: "Elle avertit sans interdire réellement." },
    { type: "qcm", q: "Une liste déroulante se reconnaît à :", opts: ["Une couleur rouge", "Une petite flèche ▼ à la sélection", "Un graphique", "Une bordure épaisse autour de la cellule"], a: 1, exp: "La flèche ▼ apparaît quand on clique la cellule." },
    { type: "qcm", q: "Pour enlever une règle de validation :", opts: ["Validation des données ▸ Effacer tout", "Trier", "Ctrl + P", "Insertion"], a: 0, exp: "Le bouton Effacer tout retire la règle." },
    { type: "vf", q: "Une plage nommée peut servir de source à une liste (Source : =Villes).", a: true, exp: "Plus lisible et robuste, surtout entre feuilles." },
    { type: "qcm", q: "Pour repérer les cellules ayant une validation :", opts: ["Accueil ▸ Rechercher et sélectionner ▸ Validation des données", "Trier", "Filtrer", "Imprimer"], a: 0, exp: "Cette commande sélectionne toutes ces cellules." },
    { type: "vf", q: "En Office 2019, mettre la source d'une liste sur une autre feuille passe idéalement par une plage nommée.", a: true, exp: "La plage nommée est la méthode fiable dans toutes les versions." },
    { type: "qcm", q: "Autoriser 'Longueur du texte ▸ inférieure à 10' sert à :", opts: ["Compter les cellules", "Limiter un code à moins de 10 caractères", "Trier", "Colorer"], a: 1, exp: "On borne la longueur de la saisie texte." }
  ],
  final: {
    title: "Exercice final — La feuille de commande propre",
    intro: `<p>Tu prépares une feuille de saisie de commandes. Les villes autorisées sont listées à part :</p>
<pre class="pseudo">      A          B                E
1   Client     Ville            (choix de villes)
2   Durand     [à saisir]       Paris
3                                Lyon
4                                Marseille</pre>
<p>On veut que la colonne <strong>Ville (B)</strong> n'accepte que Paris, Lyon ou Marseille via une liste déroulante, et que la saisie interdite soit bloquée.</p>`,
    questions: [
      { type: "qcm", q: "Quelle plage sélectionner avant de créer la liste ?", opts: ["E2:E4", "La colonne B (ex. B2:B20)", "A1", "Tout"], a: 1, exp: "La règle s'applique aux cellules où on saisira la ville." },
      { type: "qcm", q: "Quel type 'Autoriser' choisir ?", opts: ["Nombre entier", "Liste", "Date", "Décimal"], a: 1, exp: "« Liste » crée le menu déroulant." },
      { type: "qcm", q: "Quelle Source pointer vers les villes ?", opts: ["=Paris;Lyon", "=\$E\$2:\$E\$4", "=B2", "=E2:E4"], a: 1, exp: "On pointe la plage E2:E4 qui contient les choix." },
      { type: "qcm", q: "Pour bloquer une ville hors liste :", opts: ["Style d'alerte : Arrêt", "Style : Information", "Ne rien mettre", "Trier"], a: 0, exp: "Le style Arrêt empêche la saisie non conforme." },
      { type: "vf", q: "Ajouter 'Nice' en E5 et étendre la source à E2:E5 ajoutera Nice à la liste.", a: true, exp: "La liste suit la plage source : il suffit de l'étendre." }
    ],
    solution: `<p><strong>Marche à suivre :</strong></p>
<pre class="pseudo">1. Écris les choix Paris, Lyon, Marseille en E2:E4
2. Sélectionne la colonne à contraindre, ex. B2:B20
3. Données ▸ Validation des données
4. Onglet Options ▸ Autoriser : « Liste »
5. Source : =\$E\$2:\$E\$4   (le \$ fige la plage : elle ne bouge pas si on recopie)
6. Onglet « Alerte d'erreur » ▸ Style : Arrêt ▸ message « Choisis une ville de la liste »
7. (Facultatif) Onglet « Message de saisie » ▸ « Sélectionne une ville »
8. OK</pre>
<p><strong>Résultat :</strong> en B2 apparaît une flèche ▼. Choisir Paris/Lyon/Marseille est autorisé ; taper « Bordeaux » déclenche un blocage (style Arrêt).</p>
<p>Astuce d'évolution : pour ajouter Nice, tape-le en E5 et remplace la source par <code>=\$E\$2:\$E\$5</code>, ou mieux, utilise une plage nommée « Villes » (jour 26) pour écrire simplement <code>Source : =Villes</code>.</p>`
  }
};
</script>
