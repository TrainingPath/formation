<script>
var DAY = {
  num: 29,
  title: "Plusieurs feuilles et formules 3D",
  subtitle: "Faire dialoguer plusieurs onglets et additionner à travers les feuilles.",
  theory: `
<h3>1. Un classeur, plusieurs feuilles</h3>
<p>Un <strong>classeur</strong> (le fichier Excel) peut contenir plusieurs <strong>feuilles</strong> (les onglets en bas : Feuil1, Feuil2…). Analogie : un classeur = un classeur physique, chaque feuille = une intercalaire. On sépare ainsi janvier, février, mars… ou « Données » et « Synthèse ».</p>
<pre class="pseudo">Clic droit sur un onglet ▸ Renommer / Insérer / Supprimer / Couleur d'onglet
Bouton + à droite des onglets ▸ ajoute une feuille</pre>
<h3>2. Faire référence à une autre feuille</h3>
<p>Pour utiliser une cellule d'une autre feuille dans une formule, on écrit le <strong>nom de la feuille suivi d'un point d'exclamation</strong>, puis la cellule :</p>
<pre class="pseudo">=Janvier!B2
// Janvier : le nom de la feuille
// !       : le séparateur « dans cette feuille »
// B2      : la cellule voulue dans la feuille Janvier</pre>
<div class="tip">Le plus simple : commence la formule par <code>=</code>, puis clique l'onglet de l'autre feuille et la cellule. Excel écrit la référence tout seul.</div>
<div class="warn">Si le nom de la feuille contient un espace (« Ventes 2024 »), Excel l'entoure d'apostrophes : <code>='Ventes 2024'!B2</code>. C'est normal.</div>
<h3>3. Additionner la MÊME cellule sur plusieurs feuilles : la formule 3D</h3>
<p>Imagine 12 feuilles mensuelles identiques, avec le total en B10 sur chacune. Une <strong>formule 3D</strong> additionne la même cellule à travers plusieurs feuilles d'un coup, en indiquant la <strong>première</strong> et la <strong>dernière</strong> feuille séparées par deux-points :</p>
<pre class="pseudo">=SOMME(Janvier:Décembre!B10)
// Janvier      : première feuille de l'empilement
// :Décembre    : jusqu'à la feuille Décembre (toutes les feuilles entre les deux sont incluses)
// !B10         : additionne la cellule B10 de chacune de ces feuilles
// image : on empile les feuilles et on additionne « en profondeur » (la 3e dimension)</pre>
<div class="tip">Astuce de saisie : tape <code>=SOMME(</code>, clique l'onglet Janvier, maintiens <strong>Maj</strong> et clique l'onglet Décembre, clique B10, ferme la parenthèse, Entrée.</div>
<h3>4. Ça marche avec d'autres fonctions</h3>
<pre class="pseudo">=MOYENNE(Lun:Ven!C5)     // moyenne de C5 sur les feuilles Lun à Ven
=MAX(T1:T4!D2)           // le plus grand D2 parmi les feuilles T1 à T4</pre>
<h3>5. Le piège des feuilles « intercalaires »</h3>
<div class="warn">La formule 3D prend TOUTES les feuilles situées entre la première et la dernière nommée, dans l'ordre des onglets. Si tu glisses une feuille « Notes » entre Janvier et Décembre, elle sera incluse dans le calcul ! Range les feuilles à additionner côte à côte.</div>
<h3>6. Une feuille de synthèse</h3>
<p>Le schéma pro classique : des feuilles de <strong>saisie</strong> (une par mois) et une feuille de <strong>synthèse</strong> qui les agrège avec des références inter-feuilles et des formules 3D. On construira exactement ça dans le projet final (jour 31).</p>
<div class="tip">Compatibilité : références inter-feuilles et formules 3D existent depuis très longtemps, identiques en 365 et 2021/2019.</div>`,
  exercises: [
    { type: "qcm", q: "Un classeur peut contenir :", opts: ["Une seule feuille obligatoirement", "Plusieurs feuilles (onglets)", "Aucune feuille", "Seulement des graphiques"], a: 1, exp: "Les onglets en bas sont les feuilles du classeur." },
    { type: "qcm", q: "Pour référencer B2 de la feuille Janvier :", opts: ["=Janvier@B2", "=Janvier!B2", "=Janvier.B2", "=B2Janvier"], a: 1, exp: "Nom de feuille + ! + cellule." },
    { type: "qcm", q: "Le symbole ! signifie :", opts: ["Une erreur", "'dans cette feuille'", "Une multiplication", "Un commentaire"], a: 1, exp: "Il sépare le nom de la feuille de la cellule." },
    { type: "vf", q: "Si le nom de feuille a un espace, Excel l'entoure d'apostrophes.", a: true, exp: "='Ventes 2024'!B2, c'est normal." },
    { type: "qcm", q: "Une formule 3D sert à :", opts: ["Dessiner en 3D", "Additionner la même cellule sur plusieurs feuilles", "Trier", "Protéger"], a: 1, exp: "Elle agrège une cellule à travers plusieurs feuilles." },
    { type: "qcm", q: "=SOMME(Janvier:Décembre!B10) additionne :", opts: ["Seulement Janvier", "B10 de toutes les feuilles de Janvier à Décembre", "Toutes les cellules de Janvier", "B10 de Janvier et Décembre seulement"], a: 1, exp: "La même cellule B10 sur chaque feuille de la plage 3D." },
    { type: "qcm", q: "Dans Janvier:Décembre, le deux-points signifie :", opts: ["Division", "'jusqu'à' (toutes les feuilles entre les deux)", "Soustraction", "Un commentaire"], a: 1, exp: "Il englobe toutes les feuilles de la première à la dernière." },
    { type: "vf", q: "La formule 3D marche aussi avec MOYENNE ou MAX.", a: true, exp: "=MOYENNE(Lun:Ven!C5), =MAX(T1:T4!D2), etc." },
    { type: "qcm", q: "Astuce pour sélectionner plusieurs feuilles à additionner :", opts: ["Cliquer la 1re, Maj+clic la dernière", "Ctrl + S", "Trier les onglets", "Filtrer"], a: 0, exp: "Maj+clic étend la sélection d'onglets." },
    { type: "qcm", q: "Le piège des formules 3D :", opts: ["Elles sont lentes", "Une feuille glissée entre les bornes est incluse dans le calcul", "Elles suppriment des feuilles", "Elles ne marchent qu'en 365"], a: 1, exp: "Toutes les feuilles entre la 1re et la dernière comptent." },
    { type: "qcm", q: "Pour ajouter une feuille rapidement :", opts: ["Le bouton + à droite des onglets", "Ctrl + P", "Données ▸ Trier", "Insertion ▸ Tableau"], a: 0, exp: "Le + crée une nouvelle feuille." },
    { type: "qcm", q: "Le plus simple pour écrire une référence inter-feuille :", opts: ["Taper = puis cliquer l'autre onglet et la cellule", "Tout écrire à la main sans erreur", "Copier-coller la feuille", "Utiliser un tableau croisé dynamique"], a: 0, exp: "Excel écrit la référence quand tu cliques la cellule." },
    { type: "qcm", q: "Une 'feuille de synthèse' :", opts: ["Sert uniquement à l'impression", "Agrège les données des autres feuilles", "Est un graphique", "Est un filtre"], a: 1, exp: "Elle regroupe les feuilles de saisie via des références et formules 3D." },
    { type: "vf", q: "Références inter-feuilles et formules 3D existent en 365 et 2021/2019.", a: true, exp: "Fonctionnalités anciennes et communes." },
    { type: "qcm", q: "Pour renommer un onglet :", opts: ["Clic droit sur l'onglet ▸ Renommer (ou double-clic)", "Ctrl + S", "Trier", "Filtrer"], a: 0, exp: "Double-clic ou clic droit ▸ Renommer." }
  ],
  final: {
    title: "Exercice final — Le total du trimestre",
    intro: `<p>Ton classeur a 3 feuilles identiques : <strong>Janvier</strong>, <strong>Février</strong>, <strong>Mars</strong>. Sur chacune, le total des ventes du mois est en <strong>B10</strong> :</p>
<pre class="pseudo">Janvier!B10 = 5000
Février!B10 = 4200
Mars!B10    = 6100</pre>
<p>Sur une 4ᵉ feuille « Synthèse », on veut le total du trimestre en une seule formule.</p>`,
    questions: [
      { type: "qcm", q: "Quelle formule 3D écrire dans Synthèse ?", opts: ["=SOMME(Janvier+Février+Mars)", "=SOMME(Janvier:Mars!B10)", "=Janvier!B10", "=SOMME(B10)"], a: 1, exp: "La syntaxe 3D : première:dernière feuille + !cellule." },
      { type: "input", q: "Combien vaut ce total (5000 + 4200 + 6100) ?", a: "15300", ph: "nombre", exp: "5000 + 4200 + 6100 = 15300." },
      { type: "qcm", q: "Comment référencer seulement le total de Février ?", opts: ["=Février!B10", "=B10Février", "=Février.B10", "=SOMME(Février)"], a: 0, exp: "Nom de feuille + ! + cellule." },
      { type: "vf", q: "Si on glisse une feuille 'Vacances' entre Février et Mars, son B10 s'ajoutera au total 3D.", a: true, exp: "La formule 3D inclut toutes les feuilles entre les bornes." },
      { type: "qcm", q: "Pour une moyenne mensuelle à la place :", opts: ["=MOYENNE(Janvier:Mars!B10)", "=SOMME(Janvier:Mars!B10)", "=MAX(B10)", "=Janvier!B10"], a: 0, exp: "On remplace SOMME par MOYENNE dans la même syntaxe 3D." }
    ],
    solution: `<p><strong>La formule 3D :</strong></p>
<pre class="pseudo">Sur la feuille Synthèse, en B2 par exemple :
=SOMME(Janvier:Mars!B10)
- Janvier   : première feuille
- :Mars     : jusqu'à Mars (Février, au milieu, est inclus)
- !B10      : additionne B10 de chacune → 5000 + 4200 + 6100</pre>
<p><strong>Résultat : 15 300.</strong></p>
<p><strong>Saisie assistée :</strong> tape <code>=SOMME(</code>, clique l'onglet Janvier, maintiens Maj et clique l'onglet Mars, clique la cellule B10, ferme la parenthèse, Entrée.</p>
<p>Attention au piège : range Janvier, Février, Mars côte à côte. Toute feuille glissée entre Janvier et Mars serait comptée dans la somme 3D.</p>`
  }
};
</script>
