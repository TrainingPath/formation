<script>
var DAY = {
  num: 19,
  title: "Filtrer les données",
  subtitle: "N'afficher que les lignes qui t'intéressent.",
  theory: `
<h3>1. Filtrer, c'est quoi ?</h3>
<p><strong>Filtrer</strong>, c'est masquer temporairement les lignes qui ne t'intéressent pas, pour ne voir que celles qui répondent à un critère. Analogie : c'est un tamis — les données restent toutes là, mais tu ne regardes qu'un sous-ensemble. Contrairement au tri (jour 18), le filtre ne réorganise rien : il <strong>cache</strong> simplement des lignes.</p>
<div class="tip">Filtrer ne supprime JAMAIS de données. Enlève le filtre et tout réapparaît.</div>
<h3>2. Activer le filtre automatique</h3>
<p>Clique une cellule du tableau, puis :</p>
<pre class="pseudo">Ruban ▸ Données ▸ Filtrer        // ajoute une petite flèche ▼ sur chaque en-tête
Raccourci : Ctrl + Maj + L       // active/désactive le filtre</pre>
<p>Des petites <strong>flèches ▼</strong> apparaissent sur la ligne d'en-têtes. Chaque flèche ouvre un menu pour filtrer cette colonne.</p>
<h3>3. Filtrer par cases à cocher</h3>
<p>Clique la flèche ▼ d'une colonne : Excel liste toutes les valeurs présentes, chacune avec une case cochée. Décoche celles que tu veux masquer, ou tape dans la zone de recherche. Exemple : dans une colonne « Ville », ne garde que « Paris ».</p>
<div class="tip">Une colonne filtrée affiche une petite icône d'entonnoir à la place de la flèche : c'est le signe qu'un filtre est actif là.</div>
<h3>4. Les filtres spéciaux : nombres, textes, dates</h3>
<p>Selon le type de la colonne, le menu propose des filtres adaptés :</p>
<pre class="pseudo">Filtres numériques  ▸ Supérieur à…, Entre…, Les 10 premiers…   // pour des nombres
Filtres textuels    ▸ Commence par…, Contient…, Ne contient pas…  // pour du texte
Filtres chronologiques ▸ Ce mois-ci, Cette année, Après…          // pour des dates</pre>
<p>Exemple : « Filtres numériques ▸ Supérieur à ▸ 1000 » n'affiche que les ventes au-dessus de 1000.</p>
<h3>5. Cumuler plusieurs filtres</h3>
<p>Tu peux filtrer plusieurs colonnes en même temps : les critères se combinent avec un ET (la ligne doit satisfaire TOUS les filtres actifs). Exemple : Ville = Paris ET Ventes &gt; 1000.</p>
<h3>6. Effacer un filtre</h3>
<pre class="pseudo">Flèche ▼ de la colonne ▸ « Effacer le filtre de … »   // enlève un filtre précis
Ruban ▸ Données ▸ Effacer                              // enlève TOUS les filtres
Ruban ▸ Données ▸ Filtrer (à nouveau)                  // retire les flèches ▼</pre>
<h3>7. Bonus 365 : la fonction FILTRE</h3>
<p>Dans <strong>Microsoft 365</strong> (et Excel 2021), il existe une <em>fonction</em> qui filtre par formule et renvoie automatiquement le résultat dans plusieurs cellules :</p>
<pre class="pseudo">=FILTRE(A2:C10 ; B2:B10>1000)
// FILTRE : renvoie les lignes de A2:C10…
// …pour lesquelles la condition B2:B10>1000 est vraie
// le résultat « déborde » tout seul sur plusieurs lignes</pre>
<div class="warn">La fonction FILTRE n'existe PAS dans Office 2019. Sur 2019, utilise le filtre automatique du ruban (points 2 à 6), qui lui fonctionne partout.</div>`,
  exercises: [
    { type: "qcm", q: "Filtrer, c'est :", opts: ["Supprimer des lignes", "Masquer temporairement les lignes non voulues", "Trier les données", "Colorer des cellules"], a: 1, exp: "Le filtre cache des lignes sans rien effacer." },
    { type: "vf", q: "Filtrer supprime définitivement les données masquées.", a: false, exp: "Elles réapparaissent dès qu'on retire le filtre." },
    { type: "qcm", q: "Quel raccourci active/désactive le filtre ?", opts: ["Ctrl + F", "Ctrl + Maj + L", "Ctrl + S", "Alt + F4"], a: 1, exp: "Ctrl + Maj + L bascule le filtre automatique." },
    { type: "qcm", q: "Après activation, qu'apparaît-il sur les en-têtes ?", opts: ["Un triangle rouge", "Une petite flèche ▼", "Un graphique", "Rien"], a: 1, exp: "Une flèche de filtre sur chaque colonne." },
    { type: "qcm", q: "Quelle est la différence entre trier et filtrer ?", opts: ["Aucune", "Trier réorganise, filtrer masque des lignes", "Filtrer réorganise, trier masque", "Les deux suppriment des données"], a: 1, exp: "Trier change l'ordre ; filtrer cache un sous-ensemble." },
    { type: "qcm", q: "Pour ne garder que les ventes > 1000 :", opts: ["Filtres textuels ▸ Contient", "Filtres numériques ▸ Supérieur à", "Trier de A à Z", "Filtres chronologiques"], a: 1, exp: "Filtres numériques ▸ Supérieur à ▸ 1000." },
    { type: "vf", q: "On peut filtrer plusieurs colonnes en même temps.", a: true, exp: "Les filtres se combinent avec un ET." },
    { type: "qcm", q: "Combiner deux filtres (Ville=Paris et Ventes>1000) affiche :", opts: ["Les lignes satisfaisant les DEUX critères", "Les lignes satisfaisant au moins un critère", "Toutes les lignes", "Aucune ligne"], a: 0, exp: "Les filtres se cumulent en ET." },
    { type: "qcm", q: "Une colonne actuellement filtrée montre :", opts: ["Une icône d'entonnoir", "Une croix rouge", "Un point d'exclamation", "Rien de particulier"], a: 0, exp: "L'entonnoir remplace la flèche pour signaler un filtre actif." },
    { type: "qcm", q: "Pour enlever TOUS les filtres d'un coup :", opts: ["Données ▸ Effacer", "Ctrl + Z", "Supprimer les lignes", "Affichage ▸ Figer les volets"], a: 0, exp: "Ruban ▸ Données ▸ Effacer retire tous les filtres actifs." },
    { type: "qcm", q: "Pour du texte, quel filtre pour 'commence par Dur' ?", opts: ["Filtres numériques", "Filtres textuels ▸ Commence par", "Filtres chronologiques", "Nuances de couleurs"], a: 1, exp: "Les filtres textuels proposent Commence par, Contient, etc." },
    { type: "vf", q: "La fonction FILTRE existe dans Office 2019.", a: false, exp: "FILTRE n'existe que dans 365 et Excel 2021." },
    { type: "qcm", q: "Que fait =FILTRE(A2:C10 ; B2:B10>1000) ?", opts: ["Trie A2:C10", "Renvoie les lignes où B>1000, débordant sur plusieurs cellules", "Supprime les lignes", "Compte les lignes"], a: 1, exp: "La fonction renvoie dynamiquement les lignes correspondantes." },
    { type: "qcm", q: "Sur Office 2019, pour filtrer on utilise :", opts: ["La fonction FILTRE", "Le filtre automatique du ruban (Données ▸ Filtrer)", "Rien, c'est impossible", "Un tableau croisé"], a: 1, exp: "Le filtre du ruban marche partout ; FILTRE non." },
    { type: "vf", q: "Le filtre par cases à cocher permet de décocher les valeurs à masquer.", a: true, exp: "On coche/décoche les valeurs dans le menu de la flèche ▼." }
  ],
  final: {
    title: "Exercice final — Les commandes du mois",
    intro: `<p>Une liste de commandes :</p>
<pre class="pseudo">      A         B          C
1   Client    Ville      Montant
2   Durand    Paris      1500
3   Petit     Lyon       800
4   Martin    Paris      300
5   Roux      Paris      2000
6   Blanc     Lyon       1200</pre>
<p>On veut afficher uniquement les clients de <strong>Paris</strong> dont le <strong>Montant dépasse 1000</strong>.</p>`,
    questions: [
      { type: "qcm", q: "Première étape ?", opts: ["Supprimer Lyon", "Cliquer une cellule puis Données ▸ Filtrer", "Trier par montant", "Copier le tableau"], a: 1, exp: "On active d'abord le filtre automatique." },
      { type: "qcm", q: "Comment ne garder que Paris ?", opts: ["Flèche ▼ de Ville, cocher seulement Paris", "Trier Ville A→Z", "Supprimer les lignes Lyon", "Filtres numériques"], a: 0, exp: "Menu de la colonne Ville : on ne coche que Paris." },
      { type: "qcm", q: "Comment garder Montant > 1000 ?", opts: ["Filtres textuels", "Flèche ▼ Montant ▸ Filtres numériques ▸ Supérieur à ▸ 1000", "Trier Z→A", "Effacer"], a: 1, exp: "Filtres numériques ▸ Supérieur à 1000 sur la colonne Montant." },
      { type: "input", q: "Combien de lignes restent visibles au final ?", a: "2", ph: "nombre", exp: "Durand (1500) et Roux (2000) : 2 lignes (Martin est à Paris mais 300 < 1000)." },
      { type: "input", q: "Quel client au montant le plus élevé reste affiché ?", a: "Roux", ph: "un nom", exp: "Roux, 2000, à Paris." }
    ],
    solution: `<p><strong>Marche à suivre :</strong></p>
<pre class="pseudo">1. Clique une cellule du tableau (ex. A2)
2. Ruban ▸ Données ▸ Filtrer  (ou Ctrl+Maj+L)
3. Flèche ▼ de « Ville » : décoche tout sauf « Paris » ▸ OK
4. Flèche ▼ de « Montant » : Filtres numériques ▸ Supérieur à… ▸ tape 1000 ▸ OK</pre>
<p><strong>Résultat visible :</strong></p>
<pre class="pseudo">Durand  Paris  1500
Roux    Paris  2000</pre>
<p>Martin (Paris, 300) est masqué car 300 n'est pas &gt; 1000. Les lignes Lyon sont masquées par le filtre Ville.</p>
<p><strong>Variante 365 :</strong> dans une cellule libre, <code>=FILTRE(A2:C6 ; (B2:B6="Paris")*(C2:C6>1000))</code> renvoie le même résultat par formule (la multiplication joue le rôle du ET).</p>`
  }
};
</script>
