<script>
var DAY = {
  num: 16,
  title: "Les fonctions date et heure",
  subtitle: "Calculer avec le temps : dates du jour, écarts en jours, extraire jour/mois/année.",
  theory: `
<h3>1. Rappel : une date est un nombre</h3>
<p>Comme vu au jour 4, une <strong>date</strong> est en réalité un nombre : le nombre de jours écoulés depuis le 1er janvier 1900. C'est ce qui permet de <em>calculer</em> avec les dates : soustraire deux dates donne un nombre de jours, ajouter 7 à une date donne la date d'une semaine plus tard.</p>
<pre class="pseudo">=B2-A2       // difference entre deux dates = nombre de JOURS entre elles
=A2+7        // la date A2 plus 7 jours (une semaine apres)</pre>
<div class="warn">Si un calcul de dates affiche une date bizarre (ex. « 07/01/1900 ») au lieu d'un nombre, c'est que la cellule a hérité du format Date. Repasse-la en format Nombre/Standard (jour 5) pour voir le nombre de jours.</div>
<h3>2. La date (et l'heure) d'aujourd'hui</h3>
<pre class="pseudo">=AUJOURDHUI()    // la date du jour (sans heure) ; se met a jour chaque jour
=MAINTENANT()    // la date ET l'heure actuelles
   ( )   ces fonctions n'ont AUCUN argument, mais gardent les parentheses vides</pre>
<div class="tip">Ces fonctions sont « vivantes » : elles se recalculent à chaque ouverture du fichier. Pour figer la date du jour une fois pour toutes, utilise plutôt le raccourci <code>Ctrl + ;</code> qui écrit la date en dur.</div>
<h3>3. Extraire jour, mois, année</h3>
<pre class="pseudo">=JOUR(A2)     // le numero du jour (1 a 31)
=MOIS(A2)     // le numero du mois (1 a 12)
=ANNEE(A2)    // l'annee (ex : 2025)</pre>
<pre class="pseudo">// Exemple : A2 = 14/07/2025
=JOUR(A2)   -> 14
=MOIS(A2)   -> 7
=ANNEE(A2)  -> 2025</pre>
<h3>4. Fabriquer une date, calculer un âge</h3>
<pre class="pseudo">=DATE(annee ; mois ; jour)      // construit une vraie date a partir de 3 nombres
=DATE(2025 ; 12 ; 25)           // -> 25/12/2025
=ANNEE(AUJOURDHUI()) - ANNEE(B2)   // age approximatif a partir d'une date de naissance B2</pre>
<div class="tip">Pour un âge exact (au jour près), il existe la fonction <strong>DATEDIF</strong> : <code>=DATEDIF(B2 ; AUJOURDHUI() ; "y")</code> renvoie le nombre d'années complètes. Elle fonctionne mais reste peu documentée : à connaître, sans en abuser.</div>
<h3>5. Le jour de la semaine et les jours ouvrés</h3>
<pre class="pseudo">=JOURSEM(A2 ; 2)     // numero du jour de la semaine : 1 = lundi ... 7 = dimanche
   le 2 choisit la convention (lundi = 1), plus lisible en France
=NB.JOURS.OUVRES(debut ; fin)   // compte les jours ouvres (hors week-ends) entre 2 dates</pre>
<h3>6. Les heures</h3>
<p>Une heure est une <em>fraction de journée</em> : midi = 0,5 (la moitié du jour). On peut donc additionner et soustraire des heures.</p>
<pre class="pseudo">=HEURE(A2)     // extrait les heures (0 a 23)
=MINUTE(A2)    // extrait les minutes (0 a 59)
=B2-A2         // duree entre deux heures (formater la cellule en heure)</pre>
<div class="warn">Compatibilité : ces fonctions existent dans toutes les versions. Attention seulement à l'écriture sans accent des noms : <code>AUJOURDHUI</code> (sans apostrophe ni accent) et <code>ANNEE</code> (sans accent). Excel les propose automatiquement quand tu commences à taper.</div>`,
  exercises: [
    { type: "qcm", q: "En interne, une date est…", opts: ["du texte", "un nombre de jours depuis 1900", "une image", "une couleur"], a: 1, exp: "C'est pourquoi on peut calculer avec : soustraire, additionner des jours." },
    { type: "qcm", q: "=B2-A2 (deux dates) donne…", opts: ["une erreur", "le nombre de jours entre les deux dates", "la date la plus récente", "un texte"], a: 1, exp: "La différence de deux dates est un nombre de jours." },
    { type: "qcm", q: "=AUJOURDHUI() renvoie…", opts: ["l'heure seulement", "la date du jour", "une date fixe de 1900", "toujours 0"], a: 1, exp: "La date du jour, recalculée à chaque ouverture du fichier." },
    { type: "vf", q: "AUJOURDHUI() et MAINTENANT() s'écrivent avec des parenthèses vides, sans argument.", a: true, exp: "Elles n'ont pas d'argument mais gardent les parenthèses : AUJOURDHUI()." },
    { type: "input", q: "A2 = 14/07/2025. Que renvoie =MOIS(A2) ?", a: "7", ph: "un nombre", exp: "Juillet = mois 7." },
    { type: "input", q: "A2 = 14/07/2025. Que renvoie =ANNEE(A2) ?", a: "2025", ph: "un nombre", exp: "ANNEE extrait 2025." },
    { type: "input", q: "A2 = 14/07/2025. Que renvoie =JOUR(A2) ?", a: "14", ph: "un nombre", exp: "JOUR extrait le 14." },
    { type: "qcm", q: "=DATE(2025;12;25) construit…", opts: ["le texte « 2025 12 25 »", "la vraie date 25/12/2025", "le nombre 20251225", "une erreur"], a: 1, exp: "DATE(année;mois;jour) fabrique une date à partir de trois nombres." },
    { type: "qcm", q: "Pour figer la date du jour (qu'elle ne change plus), on utilise…", opts: ["=AUJOURDHUI()", "le raccourci Ctrl + ; qui écrit la date en dur", "=MAINTENANT()", "rien"], a: 1, exp: "AUJOURDHUI() se recalcule ; Ctrl + ; pose une date fixe." },
    { type: "qcm", q: "=A2+7 (A2 est une date) donne…", opts: ["7", "la date une semaine plus tard", "une erreur", "le 7e jour du mois"], a: 1, exp: "Ajouter 7 à une date avance de 7 jours." },
    { type: "qcm", q: "Pour un âge en années complètes à partir d'une date de naissance, on peut utiliser…", opts: ["NBCAR", "DATEDIF(naissance;AUJOURDHUI();\"y\")", "GAUCHE", "SOMME"], a: 1, exp: "DATEDIF avec \"y\" renvoie le nombre d'années entières." },
    { type: "qcm", q: "=JOURSEM(A2;2) renvoie 1 pour…", opts: ["dimanche", "lundi (avec la convention 2)", "le 1er du mois", "janvier"], a: 1, exp: "Avec l'argument 2, la semaine commence au lundi (=1)." },
    { type: "qcm", q: "Que compte NB.JOURS.OUVRES(début;fin) ?", opts: ["tous les jours", "les jours ouvrés (hors samedis/dimanches) entre deux dates", "les heures", "les mois"], a: 1, exp: "Elle exclut les week-ends (et les fériés si on les fournit)." },
    { type: "vf", q: "Une heure est une fraction de journée : midi vaut 0,5.", a: true, exp: "Le jour entier = 1 ; midi = la moitié = 0,5. D'où les calculs d'heures." },
    { type: "qcm", q: "Les noms AUJOURDHUI et ANNEE s'écrivent…", opts: ["avec accents et apostrophes", "sans accent (AUJOURDHUI, ANNEE) ; Excel les propose en tapant", "en anglais uniquement", "en minuscules obligatoires"], a: 1, exp: "En interface française mais sans accent : AUJOURDHUI, ANNEE." }
  ],
  final: {
    title: "Exercice final — Gérer des échéances",
    intro: `<p>On suit des factures : date d'émission et délai de paiement. On veut la date limite, savoir combien de jours restent, et extraire le mois d'émission. On se place « aujourd'hui » au 10/07/2025.</p>
<pre class="pseudo">      A          B           C          D
  1  Facture    Emission    Delai(j)   ...
  2  F1         01/07/2025  30
  3  F2         20/06/2025  15
Date limite = Emission + Delai ; Jours restants = Limite - AUJOURDHUI()</pre>`,
    questions: [
      { type: "input", q: "Écris la formule de la date limite de F1 (émission + délai).", a: "=B2+C2", ph: "=B2+...", exp: "=B2+C2 : on ajoute le nombre de jours de délai à la date d'émission." },
      { type: "qcm", q: "Date limite de F1 (01/07/2025 + 30 jours) ?", opts: ["30/07/2025", "31/07/2025", "01/08/2025", "31/08/2025"], a: 1, exp: "01/07 + 30 jours = 31/07/2025." },
      { type: "input", q: "Écris la formule des jours restants (limite moins aujourd'hui) pour F1.", a: "=B2+C2-AUJOURDHUI()", ph: "=...-AUJOURDHUI()", exp: "=B2+C2-AUJOURDHUI() ; si aujourd'hui = 10/07/2025, il reste 21 jours." },
      { type: "input", q: "Que renvoie =MOIS(B2) pour F1 (émission 01/07/2025) ?", a: "7", ph: "un nombre", exp: "Juillet = 7." },
      { type: "qcm", q: "Pourquoi les « jours restants » changent-ils tout seuls d'un jour à l'autre ?", opts: ["Bug d'Excel", "Car AUJOURDHUI() se recalcule chaque jour", "Car la date d'émission bouge", "Ils ne changent jamais"], a: 1, exp: "AUJOURDHUI() est vivante : le décompte diminue naturellement chaque jour." }
    ],
    solution: `<p>Tout repose sur le fait qu'une date est un nombre de jours :</p>
<pre class="pseudo">Date limite :
=B2+C2               // date d'emission + nombre de jours de delai
-> 01/07/2025 + 30 = 31/07/2025

Jours restants :
=B2+C2-AUJOURDHUI()  // date limite moins la date du jour
-> 31/07/2025 - 10/07/2025 = 21 jours

Mois d'emission :
=MOIS(B2)  -> 7</pre>
<p>Comme AUJOURDHUI() se recalcule chaque jour, le décompte reste automatiquement à jour. Astuce d'affichage : si un résultat censé être un nombre de jours s'affiche comme une date, repasse la cellule en format Nombre. Bravo, tu as terminé les 16 premiers jours et couvert le socle des calculs Excel !</p>`
  }
};
</script>
