<script>
var DAY = {
  num: 9,
  title: "Les fonctions de base : SOMME, MOYENNE, MIN, MAX",
  subtitle: "Des raccourcis prêts à l'emploi pour additionner, moyenner et trouver les extrêmes.",
  theory: `
<h3>1. Qu'est-ce qu'une fonction ?</h3>
<p>Une <strong>fonction</strong> est une petite machine de calcul déjà toute prête, à qui on donne des données et qui renvoie un résultat. Analogie : une machine à café. Tu mets du café et de l'eau (les <strong>arguments</strong>, ce qu'on donne à la fonction entre parenthèses), tu appuies, et elle rend un café (le résultat). On appelle une fonction par son <strong>nom</strong> suivi de <strong>parenthèses</strong>.</p>
<pre class="pseudo">=NOM(argument1 ; argument2 ; ...)
   =           toute formule commence par =
   NOM         le nom de la fonction (SOMME, MOYENNE...)
   ( )         contient les arguments (les donnees a traiter)
   ;           separe plusieurs arguments</pre>
<div class="tip">Le point-virgule <code>;</code> sépare les arguments. Les deux-points <code>:</code> décrivent une plage (B2:B10). Ne les confonds pas.</div>
<h3>2. SOMME : additionner une plage</h3>
<p><strong>SOMME</strong> additionne toutes les cellules d'une plage. Bien plus court que <code>=B2+B3+B4+…+B10</code>.</p>
<pre class="pseudo">=SOMME(B2:B10)      // additionne toutes les cellules de B2 a B10
   SOMME(...)  la fonction qui fait le total
   B2:B10      la plage : de la cellule B2 a la cellule B10 (le : veut dire jusqu'a)</pre>
<p>Raccourci en or : sélectionne la cellule sous une colonne de nombres et appuie sur <strong>Alt + =</strong> (la Somme automatique). Excel devine la plage et écrit la formule. On la trouve aussi dans <code>Ruban ▸ Accueil ▸ Somme automatique</code> (le symbole Σ).</p>
<h3>3. MOYENNE : la moyenne d'une plage</h3>
<pre class="pseudo">=MOYENNE(B2:B10)    // additionne puis divise par le nombre de valeurs
// equivaut a SOMME(B2:B10) / (nombre de cellules non vides)</pre>
<div class="warn">MOYENNE ignore les cellules <strong>vides</strong> (elles ne comptent pas), mais un <strong>0</strong> saisi compte comme une vraie valeur et fait baisser la moyenne. Vide ≠ zéro.</div>
<h3>4. MIN et MAX : les extrêmes</h3>
<pre class="pseudo">=MIN(B2:B10)        // la plus PETITE valeur de la plage
=MAX(B2:B10)        // la plus GRANDE valeur de la plage</pre>
<p>Pratique pour repérer la note la plus basse, le plus gros montant, la température minimale, etc.</p>
<h3>5. On peut mélanger plages et cellules</h3>
<pre class="pseudo">=SOMME(B2:B5 ; D2:D5)     // additionne DEUX plages d'un coup
=SOMME(B2:B10 ; 100)      // additionne la plage ET un nombre fixe (100)
=MAX(B2 ; C2 ; D2)        // le plus grand parmi trois cellules separees</pre>
<h3>6. Écrire une fonction sans se tromper</h3>
<p>Tape <code>=SOMME(</code> puis <strong>sélectionne la plage à la souris</strong> : Excel écrit B2:B10 pour toi. Ferme la parenthèse, Entrée. Excel propose aussi une bulle d'aide qui rappelle les arguments attendus.</p>
<div class="tip">Ces quatre fonctions acceptent exactement la même écriture : =FONCTION(plage). Une fois que tu en maîtrises une, tu les maîtrises toutes.</div>`,
  exercises: [
    { type: "qcm", q: "Une fonction s'appelle par…", opts: ["son nom suivi de parenthèses", "un simple nombre", "une couleur", "le signe $"], a: 0, exp: "Ex : SOMME(...) ; ce qui est entre parenthèses = les arguments." },
    { type: "qcm", q: "Comment appelle-t-on ce qu'on donne à une fonction entre parenthèses ?", opts: ["des cellules", "des arguments", "des formats", "des onglets"], a: 1, exp: "Les arguments sont les données fournies à la fonction." },
    { type: "input", q: "Écris la formule qui additionne la plage B2 à B10.", a: "=SOMME(B2:B10)", ph: "=SOMME(...)", exp: "=SOMME(B2:B10) : la fonction SOMME sur la plage B2:B10." },
    { type: "qcm", q: "Que fait =MOYENNE(A1:A5) ?", opts: ["Le total", "La moyenne des valeurs de A1 à A5", "La plus grande valeur", "Compte les cellules"], a: 1, exp: "Elle additionne et divise par le nombre de valeurs." },
    { type: "input", q: "Quel raccourci lance la Somme automatique sous une colonne de nombres ?", a: "Alt + =", ph: "ex : Ctrl + X", exp: "Alt + = insère =SOMME(...) avec la plage devinée." },
    { type: "qcm", q: "=MIN(B2:B10) renvoie…", opts: ["la plus grande valeur", "la plus petite valeur", "la moyenne", "le total"], a: 1, exp: "MIN donne le minimum de la plage." },
    { type: "qcm", q: "=MAX(B2:B10) renvoie…", opts: ["la plus petite valeur", "la plus grande valeur", "le nombre de cellules", "la moyenne"], a: 1, exp: "MAX donne le maximum de la plage." },
    { type: "vf", q: "Dans une moyenne, une cellule vide est ignorée mais un 0 saisi compte comme une valeur.", a: true, exp: "Vide ≠ zéro : le 0 fait baisser la moyenne, le vide non." },
    { type: "input", q: "B2:B4 valent 10, 20, 30. Que renvoie =SOMME(B2:B4) ?", a: "60", ph: "un nombre", exp: "10 + 20 + 30 = 60." },
    { type: "input", q: "B2:B4 valent 10, 20, 30. Que renvoie =MOYENNE(B2:B4) ?", a: "20", ph: "un nombre", exp: "(10+20+30)/3 = 20." },
    { type: "qcm", q: "Le symbole Σ (Somme automatique) se trouve dans…", opts: ["Ruban ▸ Accueil (et aussi Formules)", "la Zone Nom", "les onglets de feuille", "le menu Fichier"], a: 0, exp: "On le trouve dans Accueil et dans l'onglet Formules." },
    { type: "qcm", q: "=SOMME(B2:B5 ; D2:D5) fait quoi ?", opts: ["Une erreur", "Additionne les deux plages ensemble", "Compare les plages", "Additionne seulement B2:B5"], a: 1, exp: "On peut donner plusieurs plages, séparées par ;." },
    { type: "input", q: "B2:B4 valent 5, 8, 2. Que renvoie =MIN(B2:B4) ?", a: "2", ph: "un nombre", exp: "La plus petite des trois est 2." },
    { type: "input", q: "B2:B4 valent 5, 8, 2. Que renvoie =MAX(B2:B4) ?", a: "8", ph: "un nombre", exp: "La plus grande des trois est 8." },
    { type: "vf", q: "=SOMME(B2:B10) est plus court et plus sûr que =B2+B3+B4+B5+B6+B7+B8+B9+B10.", a: true, exp: "La fonction évite les oublis et s'adapte mieux ; c'est l'intérêt des fonctions." }
  ],
  final: {
    title: "Exercice final — Bulletin de notes",
    intro: `<p>Voici les notes d'un élève dans cinq matières. On veut le total, la moyenne, la meilleure et la plus faible note.</p>
<pre class="pseudo">      A          B
  1  Matiere    Note
  2  Maths      14
  3  Francais   11
  4  Histoire   16
  5  Anglais    8
  6  Sport      13
  7  Total      =SOMME(B2:B6)
  8  Moyenne    =MOYENNE(B2:B6)
  9  Meilleure  =MAX(B2:B6)
 10  Plus faible =MIN(B2:B6)</pre>`,
    questions: [
      { type: "input", q: "Que vaut B7, le total (=SOMME(B2:B6)) ?", a: "62", ph: "un nombre", exp: "14+11+16+8+13 = 62." },
      { type: "input", q: "Que vaut B8, la moyenne (=MOYENNE(B2:B6)) ?", a: "12,4", ph: "un nombre", exp: "62 / 5 = 12,4." },
      { type: "input", q: "Que vaut B9, la meilleure note (=MAX(B2:B6)) ?", a: "16", ph: "un nombre", exp: "La plus grande est 16 (Histoire)." },
      { type: "input", q: "Que vaut B10, la plus faible (=MIN(B2:B6)) ?", a: "8", ph: "un nombre", exp: "La plus petite est 8 (Anglais)." },
      { type: "qcm", q: "On ajoute une 6e matière en ligne 7 et on décale les totaux. Le plus robuste serait…", opts: ["Retaper tous les résultats", "Étendre les plages des fonctions à B2:B7", "Supprimer les fonctions", "Ne rien faire"], a: 1, exp: "Il suffit d'élargir la plage (B2:B7) : les fonctions recalculent tout." }
    ],
    solution: `<p>Quatre fonctions, toutes sur la même plage B2:B6 :</p>
<pre class="pseudo">B7  =SOMME(B2:B6)    -> 14+11+16+8+13 = 62
B8  =MOYENNE(B2:B6)  -> 62 / 5 = 12,4
B9  =MAX(B2:B6)      -> 16  (la plus haute)
B10 =MIN(B2:B6)      -> 8   (la plus basse)</pre>
<p>Toutes ces fonctions partagent la même écriture <code>=FONCTION(plage)</code>. Astuce : place-toi en B7 et appuie sur Alt + = pour que la Somme automatique écrive la plage à ta place.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris tes formules et où les placer…",
  items: [
  { id: "excel-j09", title: "Statistiques de ventes", level: 2,
    statement: "Recopie ce tableau des ventes de la semaine, puis calcule en colonne B : le total (B7), la moyenne journalière (B8), le meilleur jour (B9) et le moins bon jour (B10), avec les fonctions adaptées.<pre class=\"pseudo\">      A          B\n  1  Jour       Ventes\n  2  Lundi      120\n  3  Mardi      90\n  4  Mercredi   150\n  5  Jeudi      80\n  6  Vendredi   160\n  7  Total      ?\n  8  Moyenne    ?\n  9  Meilleur   ?\n 10  Moins bon  ?</pre>",
    hints: [

    note: "Utilise le : pour la plage (B2:B6) et le ; seulement si tu ajoutes une deuxieme plage. Alt + = ecrit la somme et devine la plage : gain de temps garanti." }
  ]
};
</script>
