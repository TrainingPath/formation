<script>
var DAY = {
  num: 20,
  title: "Mettre les données sous forme de tableau",
  subtitle: "Transformer une plage en vrai « Tableau » Excel, intelligent et pratique.",
  theory: `
<h3>1. Une plage… ou un Tableau ?</h3>
<p>Jusqu'ici tes données étaient une simple <strong>plage</strong> de cellules. Excel propose un objet spécial : le <strong>Tableau</strong> (avec un grand T). Un <strong>Tableau</strong> est une plage « officialisée » qu'Excel reconnaît comme un ensemble cohérent, avec un nom, des filtres intégrés et des formules facilitées. Analogie : passer d'un tas de fiches à un classeur étiqueté et rangé.</p>
<div class="tip">Ne confonds pas : « tableau » au sens large (des cellules alignées) et « Tableau » l'objet Excel créé par la commande ci-dessous. Ici on parle du second.</div>
<h3>2. Créer un Tableau</h3>
<p>Clique une cellule de tes données, puis :</p>
<pre class="pseudo">Ruban ▸ Insertion ▸ Tableau      // convertit la plage en Tableau
Raccourci : Ctrl + L  (ou Ctrl + T)   // même effet
// Excel propose la plage détectée : coche « Mon tableau comporte des en-têtes »</pre>
<p>Résultat : la plage prend un style rayé, les en-têtes reçoivent des flèches de filtre, et un nouvel onglet <strong>Création de tableau</strong> apparaît quand tu cliques dedans.</p>
<h3>3. Les super-pouvoirs d'un Tableau</h3>
<ul>
<li><strong>Extension automatique</strong> : tape une valeur juste en dessous ou à droite, le Tableau s'agrandit tout seul et applique le style.</li>
<li><strong>Ligne de total</strong> : <code>Création de tableau ▸ Ligne des totaux</code> ajoute une ligne en bas avec Somme, Moyenne, etc. choisies par menu.</li>
<li><strong>Filtres intégrés</strong> : les flèches ▼ sont là dès le départ.</li>
<li><strong>En-têtes toujours visibles</strong> : quand tu descends, les en-têtes remplacent les lettres de colonnes.</li>
</ul>
<h3>4. Les colonnes calculées et les formules « parlantes »</h3>
<p>Dans un Tableau, si tu tapes une formule dans une colonne, elle se recopie <strong>automatiquement</strong> sur toute la colonne. Et les références utilisent le <strong>nom des colonnes</strong> au lieu des lettres :</p>
<pre class="pseudo">=[@Quantité]*[@Prix]
// [@Quantité] : la valeur de la colonne « Quantité » sur la LIGNE courante
// [@Prix]     : la valeur de la colonne « Prix » sur la même ligne
// bien plus lisible que =B2*C2, et recopié tout seul partout</pre>
<div class="tip">Le <code>@</code> signifie « sur cette ligne-ci ». <code>Tableau1[Prix]</code> (sans @) désignerait TOUTE la colonne Prix.</div>
<h3>5. Nommer et styliser le Tableau</h3>
<p>Par défaut, ton Tableau s'appelle <strong>Tableau1</strong>. Renomme-le dans <code>Création de tableau ▸ Nom du tableau</code> (ex. « Ventes ») : c'est plus clair dans les formules. Change l'apparence avec <code>Création de tableau ▸ Styles de tableau</code>.</p>
<h3>6. Revenir à une plage normale</h3>
<pre class="pseudo">Création de tableau ▸ Convertir en plage
// enlève le côté « objet Tableau » mais garde les données et le style</pre>
<div class="tip">Compatibilité : les Tableaux existent depuis longtemps, identiques dans 365 et 2021/2019. Les formules avec noms de colonnes ([@…]) y fonctionnent partout.</div>`,
  exercises: [
    { type: "qcm", q: "Un 'Tableau' Excel (grand T) est :", opts: ["N'importe quelles cellules", "Une plage officialisée avec nom, filtres et formules facilitées", "Un graphique", "Un fichier"], a: 1, exp: "C'est un objet reconnu par Excel, plus qu'une simple plage." },
    { type: "qcm", q: "Quel raccourci crée un Tableau ?", opts: ["Ctrl + L (ou Ctrl + T)", "Ctrl + S", "Ctrl + P", "Ctrl + F"], a: 0, exp: "Ctrl + L / Ctrl + T, ou Insertion ▸ Tableau." },
    { type: "vf", q: "Quand on tape une valeur juste sous un Tableau, il s'agrandit automatiquement.", a: true, exp: "L'extension automatique applique aussi le style et les formules." },
    { type: "qcm", q: "La 'Ligne des totaux' se trouve dans :", opts: ["Onglet Création de tableau", "Onglet Affichage", "Onglet Révision", "Onglet Fichier"], a: 0, exp: "Création de tableau ▸ Ligne des totaux." },
    { type: "qcm", q: "Que signifie [@Prix] dans une formule de Tableau ?", opts: ["Toute la colonne Prix", "La valeur de Prix sur la ligne courante", "La somme des prix", "Une erreur"], a: 1, exp: "Le @ = 'sur cette ligne-ci'." },
    { type: "qcm", q: "=[@Quantité]*[@Prix] va :", opts: ["Rester sur une seule cellule", "Se recopier sur toute la colonne automatiquement", "Provoquer une erreur", "Trier la colonne"], a: 1, exp: "Les colonnes calculées se propagent seules." },
    { type: "vf", q: "Dans un Tableau, les en-têtes restent visibles quand on descend.", a: true, exp: "Ils remplacent les lettres de colonnes en haut." },
    { type: "qcm", q: "Le nom par défaut d'un premier Tableau est :", opts: ["Feuil1", "Tableau1", "Classeur1", "Plage1"], a: 1, exp: "Tableau1, modifiable dans Création de tableau ▸ Nom du tableau." },
    { type: "qcm", q: "Pour renommer un Tableau :", opts: ["Création de tableau ▸ Nom du tableau", "Clic droit ▸ Renommer la feuille", "Fichier ▸ Enregistrer sous", "Impossible"], a: 0, exp: "Le champ Nom du tableau dans l'onglet Création." },
    { type: "qcm", q: "Pour transformer un Tableau en plage ordinaire :", opts: ["Création de tableau ▸ Convertir en plage", "Supprimer les en-têtes", "Ctrl + Z", "Insertion ▸ Tableau"], a: 0, exp: "Convertir en plage garde les données mais retire l'objet Tableau." },
    { type: "vf", q: "Tableau1[Prix] (sans @) désigne toute la colonne Prix.", a: true, exp: "Sans @ = la colonne entière ; avec @ = la ligne courante." },
    { type: "qcm", q: "Avantage d'un Tableau pour les formules :", opts: ["Elles sont plus lentes", "Les références utilisent les noms de colonnes, plus lisibles", "Elles ne marchent plus", "Il faut les retaper"], a: 1, exp: "=[@Quantité]*[@Prix] est plus clair que =B2*C2." },
    { type: "qcm", q: "Les filtres dans un Tableau :", opts: ["Sont absents", "Sont intégrés dès la création", "Doivent être achetés", "Ne marchent qu'en 365"], a: 1, exp: "Les flèches de filtre sont présentes d'emblée." },
    { type: "vf", q: "Les Tableaux existent aussi bien dans 365 que dans Office 2021/2019.", a: true, exp: "Fonctionnalité ancienne et commune à ces versions." },
    { type: "qcm", q: "Pour changer l'apparence rayée d'un Tableau :", opts: ["Création de tableau ▸ Styles de tableau", "Accueil ▸ Police", "Données ▸ Trier", "Affichage ▸ Zoom"], a: 0, exp: "Les Styles de tableau proposent des jeux de couleurs." }
  ],
  final: {
    title: "Exercice final — La liste de courses en Tableau",
    intro: `<p>Une petite liste de courses :</p>
<pre class="pseudo">      A          B          C
1   Produit    Quantité   Prix
2   Pain       2          1,20
3   Lait       3          0,90
4   Café       1          4,50</pre>
<p>On veut la transformer en Tableau nommé « Courses », ajouter une colonne <strong>Total</strong> = Quantité × Prix, et une ligne de totaux.</p>`,
    questions: [
      { type: "qcm", q: "Comment créer le Tableau ?", opts: ["Insertion ▸ Tableau (ou Ctrl+L)", "Données ▸ Trier", "Accueil ▸ Coller", "Fichier ▸ Nouveau"], a: 0, exp: "Clique une cellule puis Insertion ▸ Tableau." },
      { type: "qcm", q: "En D2, quelle formule pour le Total ?", opts: ["=B2+C2", "=[@Quantité]*[@Prix]", "=SOMME(B2:C2)", "=Quantité+Prix"], a: 1, exp: "Le produit ligne par ligne, avec les noms de colonnes." },
      { type: "input", q: "Que vaut le Total de la ligne Pain (2 × 1,20) ?", a: "2,4", ph: "nombre", exp: "2 × 1,20 = 2,40 €." },
      { type: "vf", q: "La formule tapée en D2 se recopie seule sur D3 et D4.", a: true, exp: "Colonne calculée : propagation automatique." },
      { type: "qcm", q: "Comment renommer le Tableau en 'Courses' ?", opts: ["Création de tableau ▸ Nom du tableau", "Renommer la feuille", "Enregistrer sous Courses", "Impossible"], a: 0, exp: "Champ Nom du tableau dans l'onglet Création." }
    ],
    solution: `<p><strong>Marche à suivre :</strong></p>
<pre class="pseudo">1. Clique une cellule des données (ex. A2)
2. Insertion ▸ Tableau (ou Ctrl+L) ▸ vérifie « Mon tableau comporte des en-têtes » ▸ OK
3. En D1, tape l'en-tête : Total
4. En D2, tape : =[@Quantité]*[@Prix] puis Entrée
   → la formule se recopie seule sur D3 et D4
5. Renomme : Création de tableau ▸ Nom du tableau ▸ « Courses »
6. Coche Création de tableau ▸ Ligne des totaux
   → une ligne s'ajoute en bas ; sur la cellule sous Total, choisis « Somme »</pre>
<p><strong>Résultats de la colonne Total :</strong> Pain 2,40 · Lait 2,70 · Café 4,50 → total général <strong>9,60 €</strong>.</p>
<p>La formule <code>=[@Quantité]*[@Prix]</code> multiplie, sur chaque ligne, la valeur de la colonne Quantité par celle de la colonne Prix. C'est plus lisible que <code>=B2*C2</code> et Excel l'applique à toute la colonne automatiquement.</p>`
  }
};
</script>
