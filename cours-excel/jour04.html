<script>
var DAY = {
  num: 4,
  title: "Les types de données : nombres, texte, dates",
  subtitle: "Excel ne voit pas tout pareil. Comprendre ça évite 90 % des bugs de débutant.",
  theory: `
<h3>1. Pourquoi le « type » compte</h3>
<p>Un <strong>type de données</strong>, c'est la <em>nature</em> de ce qu'il y a dans une cellule : un nombre, du texte, ou une date. Excel se comporte différemment selon le type. On ne peut pas additionner du texte, et une date est en réalité un nombre déguisé. Comprendre ça, c'est éviter les erreurs mystérieuses.</p>
<h3>2. L'indice visuel : l'alignement automatique</h3>
<p>Quand tu tapes une valeur et valides, Excel devine le type et l'aligne tout seul :</p>
<pre class="pseudo">Nombre / date  ->  colle a DROITE de la cellule    // Excel a reconnu un nombre
Texte          ->  colle a GAUCHE de la cellule     // Excel a reconnu du texte</pre>
<div class="tip">Un « nombre » collé à gauche est suspect : Excel l'a pris pour du texte et il ne se calculera pas ! L'alignement est ton premier détecteur d'erreur.</div>
<h3>3. Les nombres</h3>
<p>Tape les chiffres <strong>sans espace ni symbole</strong>. Le séparateur de décimales en français est la <strong>virgule</strong>.</p>
<pre class="pseudo">1234        // bon : un nombre
1234,5      // bon : virgule = decimales (mille deux cent trente-quatre virgule cinq)
1 234       // MAUVAIS : l'espace peut le transformer en texte
1234€       // MAUVAIS : ne tape pas le symbole, on le met en forme au jour 5</pre>
<div class="warn">Ne tape jamais le symbole € ou % ni les espaces des milliers à la main. On saisit le nombre nu (1234) et on l'habille ensuite avec la mise en forme (jour 5). Un nombre « habillé » à la main devient souvent du texte.</div>
<h3>4. Le texte</h3>
<p>Toute suite de caractères qui n'est pas un nombre ou une date pur est du <strong>texte</strong> (mots, codes, phrases). Colle à gauche. Un code postal ou un numéro qui commence par 0 (ex. 0475…) doit être forcé en texte, sinon Excel enlève le 0 de tête.</p>
<pre class="pseudo">Bonjour         // texte
Chris 12        // texte (contient des lettres)
=" forcer "     // on peut forcer en texte en mettant une apostrophe devant :
'0475           // l'apostrophe (') dit "traite ca comme du texte" -> garde le 0</pre>
<h3>5. Les dates : des nombres déguisés</h3>
<p>Une <strong>date</strong> est en fait un nombre : Excel compte les jours depuis le 1er janvier 1900. Le 1/1/1900 = 1, et par exemple le 1/1/2020 = 43831. C'est pour ça qu'on peut <em>calculer</em> avec les dates (nombre de jours entre deux dates, etc.).</p>
<pre class="pseudo">Tape 14/07/2025   // Excel reconnait une DATE (collee a droite)
   -> en interne c'est un nombre de jours depuis 1900
   -> tu peux faire =B2-A2 pour compter les jours entre deux dates</pre>
<p>Pour saisir une date, utilise les slash ou les tirets : <code>14/07/2025</code> ou <code>14-07-2025</code>. Raccourci pour la date du jour : <code>Ctrl + ;</code> (point-virgule). Pour l'heure : <code>Ctrl + :</code>.</p>
<div class="tip">Si une date s'affiche comme un gros nombre (ex. 45852), c'est juste un problème d'affichage : la cellule contient bien une date, mais son format est « Nombre ». On corrige au jour 5.</div>
<h3>6. Récapitulatif</h3>
<pre class="pseudo">Type      Exemple        Aligne     Calculable ?
Nombre    1234,5         droite     oui
Date      14/07/2025     droite     oui (c'est un nombre)
Texte     Bonjour        gauche     non</pre>`,
  exercises: [
    { type: "qcm", q: "Par défaut, un nombre valide se colle…", opts: ["à gauche de la cellule", "à droite de la cellule", "au centre", "en bas"], a: 1, exp: "Nombres et dates s'alignent à droite ; le texte à gauche." },
    { type: "qcm", q: "Par défaut, du texte se colle…", opts: ["à droite", "à gauche", "au centre", "il n'apparaît pas"], a: 1, exp: "Le texte s'aligne à gauche : c'est l'indice visuel du type." },
    { type: "qcm", q: "Le séparateur de décimales en Excel français est…", opts: ["le point", "la virgule", "l'espace", "le slash"], a: 1, exp: "En français on écrit 1234,5 avec une virgule." },
    { type: "vf", q: "Il faut taper le symbole € directement dans la cellule pour un prix.", a: false, exp: "Non : on tape le nombre nu (1234) et on ajoute l'habillage € via la mise en forme (jour 5)." },
    { type: "qcm", q: "Un nombre qui s'affiche collé À GAUCHE signifie…", opts: ["tout va bien", "Excel l'a pris pour du texte : il ne se calculera pas", "il est trop grand", "c'est une date"], a: 1, exp: "Un nombre à gauche = interprété comme texte : à corriger avant tout calcul." },
    { type: "qcm", q: "En interne, une date est…", opts: ["du texte", "un nombre de jours depuis 1900", "une image", "un symbole"], a: 1, exp: "Excel compte les jours depuis le 1/1/1900 ; c'est pourquoi on peut calculer avec." },
    { type: "input", q: "Quel signe tape-t-on devant un code pour le forcer en texte (ex. garder le 0 de 0475) ?", a: "'", ph: "un caractère", exp: "L'apostrophe (') force la cellule en texte et conserve le zéro de tête." },
    { type: "qcm", q: "Comment saisir correctement une date du 14 juillet 2025 ?", opts: ["14 07 2025", "14/07/2025", "14.07.2025 avec des points", "juillet 14"], a: 1, exp: "Avec des slash (ou des tirets) : 14/07/2025, ce qu'Excel reconnaît comme date." },
    { type: "input", q: "Quel raccourci insère la date du jour ?", a: "Ctrl + ;", ph: "ex : Ctrl + X", exp: "Ctrl + ; (point-virgule) insère la date d'aujourd'hui." },
    { type: "vf", q: "On peut soustraire deux dates pour obtenir un nombre de jours.", a: true, exp: "Comme une date est un nombre, =B2-A2 donne l'écart en jours." },
    { type: "qcm", q: "Pourquoi éviter de taper « 1 234 » avec un espace ?", opts: ["C'est interdit", "L'espace peut faire prendre le nombre pour du texte", "Ça affiche une erreur rouge", "Ça change de feuille"], a: 1, exp: "L'espace casse le type nombre ; tape 1234 sans espace, l'affichage des milliers se règle après." },
    { type: "qcm", q: "Une date affichée comme le nombre 45852, c'est…", opts: ["une erreur grave", "juste un problème d'affichage : c'est le format qui est « Nombre »", "un bug à réinstaller", "une cellule vide"], a: 1, exp: "Le contenu est bien une date ; seul le format d'affichage est à corriger (jour 5)." },
    { type: "input", q: "Vrai type de « Chris12 » (contient des lettres) : nombre ou texte ?", a: "texte", ph: "nombre ou texte", exp: "Dès qu'il y a des lettres, c'est du texte : collé à gauche, non calculable." },
    { type: "vf", q: "Un numéro de téléphone commençant par 0 se saisit mieux en le forçant en texte.", a: true, exp: "Sinon Excel supprime le 0 de tête. L'apostrophe ' avant le numéro le préserve." },
    { type: "qcm", q: "Parmi ces saisies, laquelle Excel considère comme un NOMBRE calculable ?", opts: ["1 234", "1234,5", "1234€", "12h34"], a: 1, exp: "Seul 1234,5 est un nombre pur ; les autres contiennent espace, symbole ou lettre." }
  ],
  final: {
    title: "Exercice final — Reconnaître les types",
    intro: `<p>On a saisi ces valeurs. En observant l'alignement, on peut deviner ce qu'Excel a compris :</p>
<pre class="pseudo">      A (aligne a...)    B (contenu tape)
  1  droite             1500
  2  gauche             1 500
  3  droite             25/12/2025
  4  gauche             Total
  5  gauche             0475123456</pre>
<p>Rappel : droite = nombre/date reconnu ; gauche = texte.</p>`,
    questions: [
      { type: "qcm", q: "En A1, 1500 est aligné à droite. Excel l'a compris comme…", opts: ["du texte", "un nombre (calculable)", "une date", "une erreur"], a: 1, exp: "Aligné à droite = nombre reconnu : parfait pour calculer." },
      { type: "qcm", q: "En A2, « 1 500 » (avec espace) est aligné à gauche. C'est donc…", opts: ["un nombre", "du texte : l'espace a cassé le type nombre", "une date", "un pourcentage"], a: 1, exp: "L'espace a transformé le nombre en texte : il ne se calculera pas." },
      { type: "qcm", q: "En A3, 25/12/2025 est aligné à droite. C'est…", opts: ["du texte", "une date (donc un nombre)", "une erreur", "un code"], a: 1, exp: "Reconnu comme date, collé à droite, calculable (soustractions de jours possibles)." },
      { type: "input", q: "Pour que « 0475123456 » garde son 0 de tête (A5), quel caractère taper devant ?", a: "'", ph: "un caractère", exp: "L'apostrophe ' force le texte et conserve le zéro initial." },
      { type: "qcm", q: "Laquelle de ces cellules NE pourra PAS servir dans un calcul (somme, etc.) ?", opts: ["A1 (1500)", "A3 (la date)", "A2 (le « 1 500 » à gauche)", "aucune"], a: 2, exp: "A2 est du texte à cause de l'espace ; un calcul l'ignorerait ou renverrait une erreur." }
    ],
    solution: `<p>La règle d'or : <strong>l'alignement révèle le type</strong>.</p>
<pre class="pseudo">A1  1500          droite  -> NOMBRE  (ok pour calculer)
A2  "1 500"       gauche  -> TEXTE   (l'espace a tout casse)
A3  25/12/2025    droite  -> DATE    (nombre de jours en interne)
A4  Total         gauche  -> TEXTE   (un mot)
A5  '0475123456   gauche  -> TEXTE   (force par ', garde le 0)</pre>
<p>Conseil pratique : saisis toujours des nombres nus (1500, pas « 1 500 » ni « 1500 € ») ; tu les habilleras avec la mise en forme demain, sans jamais perdre leur capacité à se calculer.</p>`
  }
};
</script>
