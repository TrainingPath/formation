<script>
var DAY = {
  num: 12,
  title: "SI imbriqués, ET, OU",
  subtitle: "Gérer plus de deux cas, et combiner plusieurs conditions dans un seul test.",
  theory: `
<h3>1. Le problème : plus de deux cas</h3>
<p>Un SI simple ne connaît que deux réponses (vrai / faux). Mais souvent il y a trois cas ou plus : par exemple une mention « Bien », « Passable » ou « Insuffisant ». On enchaîne alors plusieurs SI : c'est le <strong>SI imbriqué</strong> (un SI placé dans le « sinon » d'un autre SI).</p>
<h3>2. SI imbriqué : un SI dans le SINON</h3>
<pre class="pseudo">=SI(B2>=16 ; "Tres bien" ; SI(B2>=10 ; "Passable" ; "Insuffisant"))
   B2>=16          1er test ; si VRAI -> "Tres bien"
   sinon...        on entre dans le 2e SI
   B2>=10          2e test ; si VRAI -> "Passable"
   sinon           -> "Insuffisant"</pre>
<p>On teste du <strong>cas le plus haut au plus bas</strong> (ou l'inverse), sans trous. Dès qu'un test est vrai, Excel s'arrête et renvoie sa valeur.</p>
<div class="warn">Chaque SI ouvre une parenthèse : à la fin, il faut autant de parenthèses fermantes que de SI ouverts. Deux SI = deux « ) » à la fin. C'est l'erreur classique.</div>
<h3>3. Astuce d'ordre</h3>
<p>Range tes tests dans l'ordre logique. Si tu écris <code>B2>=10</code> avant <code>B2>=16</code>, tous les 16+ tomberaient dans « Passable » car 16 est aussi >= 10 : le premier test vrai gagne. Va donc du plus exigeant au moins exigeant (ou trie proprement).</p>
<div class="tip">Depuis Excel 2019/2021 et 365, la fonction <strong>SI.CONDITIONS</strong> remplace avantageusement les longues cascades de SI : <code>=SI.CONDITIONS(B2>=16;"Tres bien";B2>=10;"Passable";VRAI;"Insuffisant")</code>. Elle n'existe PAS dans les versions plus anciennes : dans ce cas, reste sur les SI imbriqués.</div>
<h3>4. ET : toutes les conditions à la fois</h3>
<p><strong>ET</strong> renvoie VRAI seulement si <em>toutes</em> les conditions sont vraies. On l'utilise dans la condition d'un SI.</p>
<pre class="pseudo">=SI(ET(B2>=10 ; C2>=10) ; "Admis" ; "Refuse")
   ET(...)        VRAI seulement si TOUTES les conditions dedans sont vraies
   B2>=10         1re condition (note 1)
   C2>=10         2e condition (note 2)
// il faut les DEUX notes >= 10 pour etre admis</pre>
<h3>5. OU : au moins une condition</h3>
<p><strong>OU</strong> renvoie VRAI si <em>au moins une</em> des conditions est vraie.</p>
<pre class="pseudo">=SI(OU(B2>=16 ; C2>=16) ; "Felicitations" ; "")
   OU(...)        VRAI si AU MOINS UNE condition est vraie
// une seule tres bonne note suffit pour les felicitations</pre>
<h3>6. Récapitulatif</h3>
<pre class="pseudo">ET(a ; b)   -> VRAI si a ET b sont vrais (les deux)
OU(a ; b)   -> VRAI si a OU b est vrai (au moins un)
SI imbrique -> plusieurs cas en cascade (le 1er test vrai gagne)</pre>
<div class="tip">On peut mettre ET et OU ensemble, mais garde tes formules lisibles. Si ça devient trop long, une colonne intermédiaire de calcul est souvent plus claire qu'une formule géante.</div>`,
  exercises: [
    { type: "qcm", q: "À quoi sert un SI imbriqué ?", opts: ["À additionner", "À gérer plus de deux cas (en enchaînant des SI)", "À trier", "À compter"], a: 1, exp: "On place un SI dans le « sinon » d'un autre pour traiter 3 cas ou plus." },
    { type: "qcm", q: "ET(condition1 ; condition2) est VRAI quand…", opts: ["au moins une est vraie", "les DEUX sont vraies", "les deux sont fausses", "jamais"], a: 1, exp: "ET exige que toutes les conditions soient vraies." },
    { type: "qcm", q: "OU(condition1 ; condition2) est VRAI quand…", opts: ["les deux sont vraies seulement", "au moins une est vraie", "les deux sont fausses", "jamais"], a: 1, exp: "OU suffit qu'une seule condition soit vraie." },
    { type: "qcm", q: "Combien de parenthèses fermantes à la fin de =SI(...;...;SI(...;...;...)) ?", opts: ["1", "2", "3", "0"], a: 1, exp: "Deux SI ouverts = deux « ) » à fermer à la fin." },
    { type: "qcm", q: "=SI(B2>=16;\"TB\";SI(B2>=10;\"Passable\";\"Insuffisant\")) avec B2=12 donne…", opts: ["TB", "Passable", "Insuffisant", "erreur"], a: 1, exp: "12 n'est pas >=16 mais est >=10 → « Passable »." },
    { type: "qcm", q: "Même formule avec B2=18 donne…", opts: ["TB", "Passable", "Insuffisant", "0"], a: 0, exp: "18 >= 16 : le premier test est vrai → « TB »." },
    { type: "qcm", q: "Même formule avec B2=5 donne…", opts: ["TB", "Passable", "Insuffisant", "vide"], a: 2, exp: "5 n'est ni >=16 ni >=10 → dernier cas « Insuffisant »." },
    { type: "qcm", q: "=SI(ET(B2>=10;C2>=10);\"Admis\";\"Refuse\") avec B2=12 et C2=8 donne…", opts: ["Admis", "Refuse (car C2<10)", "erreur", "vide"], a: 1, exp: "ET exige les deux ≥ 10 ; C2=8 échoue → « Refuse »." },
    { type: "qcm", q: "=SI(OU(B2>=16;C2>=16);\"Bravo\";\"\") avec B2=9 et C2=17 donne…", opts: ["rien", "Bravo (car C2>=16)", "erreur", "9"], a: 1, exp: "OU : une seule condition vraie suffit (C2=17)." },
    { type: "vf", q: "Dans un SI imbriqué, le premier test VRAI l'emporte et Excel s'arrête là.", a: true, exp: "L'ordre des tests compte donc beaucoup." },
    { type: "vf", q: "Écrire B2>=10 avant B2>=16 est une erreur d'ordre : les 16+ tomberaient dans le cas « >=10 ».", a: true, exp: "16 est aussi >=10 ; il faut tester le plus exigeant d'abord." },
    { type: "qcm", q: "SI.CONDITIONS est disponible…", opts: ["dans toutes les versions depuis 1997", "à partir d'Excel 2019/2021 et dans 365, pas avant", "seulement sur Mac", "jamais"], a: 1, exp: "Récente : à partir de 2019/2021. Sur les versions antérieures, on garde les SI imbriqués." },
    { type: "input", q: "Écris une condition ET vraie seulement si A2 vaut au moins 18 ET B2 vaut « oui ».", a: "ET(A2>=18;B2=\"oui\")", ph: "ET(...)", exp: "ET(A2>=18;B2=\"oui\") : les deux doivent être vraies." },
    { type: "qcm", q: "Quand une formule à SI imbriqués devient trop longue, mieux vaut…", opts: ["la laisser illisible", "utiliser une colonne intermédiaire de calcul pour clarifier", "supprimer des cas", "tout mettre sur une ligne"], a: 1, exp: "Découper en étapes rend le classeur plus lisible et plus fiable." },
    { type: "input", q: "Que renvoie ET(VRAI ; FAUX) ?", a: "FAUX", ph: "VRAI ou FAUX", exp: "ET exige tout vrai ; une condition fausse rend l'ensemble FAUX." }
  ],
  final: {
    title: "Exercice final — Attribuer une mention",
    intro: `<p>On classe des élèves selon leur moyenne : « Bien » à partir de 14, « Assez bien » à partir de 12, « Passable » à partir de 10, sinon « Echec ». On veut aussi féliciter (colonne D) ceux qui ont au moins 10 en moyenne ET une note de sport (colonne C) au moins égale à 15.</p>
<pre class="pseudo">      A          B          C        D
  1  Eleve      Moyenne    Sport    Mention / Felicitation
  2  Ali        15         16
  3  Bea        11         10
  4  Chris      13         17
  5  Dora       8          18</pre>`,
    questions: [
      { type: "qcm", q: "Quelle mention pour Ali (moyenne 15) ?", opts: ["Bien", "Assez bien", "Passable", "Echec"], a: 0, exp: "15 >= 14 : « Bien »." },
      { type: "qcm", q: "Quelle mention pour Bea (moyenne 11) ?", opts: ["Bien", "Assez bien", "Passable", "Echec"], a: 2, exp: "11 n'est pas >=14 ni >=12, mais >=10 → « Passable »." },
      { type: "qcm", q: "Quelle mention pour Dora (moyenne 8) ?", opts: ["Bien", "Assez bien", "Passable", "Echec"], a: 3, exp: "8 échoue à tous les seuils → « Echec »." },
      { type: "qcm", q: "Qui reçoit une félicitation ET(moyenne>=10 ; sport>=15) ?", opts: ["Ali et Chris", "Tout le monde", "Bea seulement", "Personne"], a: 0, exp: "Ali (15 et 16) et Chris (13 et 17) réunissent les deux conditions ; Bea a 10 en sport (<15), Dora a 8 de moyenne." },
      { type: "input", q: "Écris la formule de mention pour Ali (visant B2), du plus haut au plus bas.", a: "=SI(B2>=14;\"Bien\";SI(B2>=12;\"Assez bien\";SI(B2>=10;\"Passable\";\"Echec\")))", ph: "=SI(...)", exp: "Trois SI imbriqués, trois parenthèses fermantes à la fin." }
    ],
    solution: `<p>La mention : trois seuils, donc trois SI en cascade (du plus haut au plus bas) :</p>
<pre class="pseudo">=SI(B2>=14 ; "Bien" ;
     SI(B2>=12 ; "Assez bien" ;
        SI(B2>=10 ; "Passable" ; "Echec")))
// 3 SI ouverts -> 3 parentheses ")" a la fin
Ali 15 -> Bien ; Bea 11 -> Passable ; Chris 13 -> Assez bien ; Dora 8 -> Echec</pre>
<p>La félicitation combine deux conditions avec ET :</p>
<pre class="pseudo">=SI(ET(B2>=10 ; C2>=15) ; "Felicitations" ; "")
// il faut moyenne >= 10 ET sport >= 15
Ali (15 ; 16) OK ; Chris (13 ; 17) OK ; Bea (11 ; 10) non ; Dora (8 ; 18) non</pre>
<p>Retiens : ordre des tests du plus exigeant au moins exigeant, autant de « ) » que de SI, et ET pour exiger toutes les conditions à la fois.</p>`
  }
};
</script>
