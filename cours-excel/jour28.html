<script>
var DAY = {
  num: 28,
  title: "Figer les volets, mise en page et impression",
  subtitle: "Garder les en-têtes visibles à l'écran, et sortir une belle impression.",
  theory: `
<h3>1. Figer les volets : garder les en-têtes à l'écran</h3>
<p><strong>Figer les volets</strong>, c'est « clouer » certaines lignes ou colonnes pour qu'elles restent visibles quand tu fais défiler. Analogie : la ligne de titre reste collée en haut, comme un en-tête de journal qui ne bouge pas.</p>
<pre class="pseudo">Ruban ▸ Affichage ▸ Figer les volets
▸ « Figer la ligne supérieure »     // la ligne 1 reste visible en défilant
▸ « Figer la première colonne »     // la colonne A reste visible
▸ « Figer les volets »              // fige TOUT ce qui est au-dessus ET à gauche de la cellule active</pre>
<div class="tip">Pour figer la ligne 1 ET la colonne A ensemble : clique la cellule <strong>B2</strong> puis « Figer les volets ». Excel fige tout ce qui est au-dessus et à gauche de B2.</div>
<div class="warn">Ne confonds pas « Figer les volets » (affichage à l'écran) avec « verrouiller » (protection, jour 27) : ça n'a rien à voir. Figer ne protège rien, ça aide juste à lire.</div>
<h3>2. Orientation et marges (onglet Mise en page)</h3>
<pre class="pseudo">Ruban ▸ Mise en page ▸ Orientation ▸ Portrait / Paysage   // paysage = feuille couchée, plus large
Ruban ▸ Mise en page ▸ Marges                              // petites/normales/larges
Ruban ▸ Mise en page ▸ Taille                              // A4, Lettre…</pre>
<h3>3. Le problème n°1 : « ça déborde sur 6 pages ! »</h3>
<p>Un grand tableau s'imprime souvent sur trop de pages. Deux armes :</p>
<pre class="pseudo">Mise en page ▸ Zone d'impression ▸ Définir      // n'imprime QUE la plage sélectionnée
Mise en page ▸ Ajuster : Largeur = 1 page       // comprime tout sur 1 page de large</pre>
<p>Le réglage « Ajuster à 1 page en largeur » (dans <code>Fichier ▸ Imprimer ▸ Mise à l'échelle</code> aussi) évite les colonnes orphelines sur une 2ᵉ page.</p>
<h3>4. Répéter les titres sur chaque page imprimée</h3>
<p>Sur une longue liste, la ligne d'en-têtes doit se répéter en haut de CHAQUE page papier (ce n'est PAS le même réglage que « Figer les volets », qui ne concerne que l'écran) :</p>
<pre class="pseudo">Mise en page ▸ Imprimer les titres ▸ « Lignes à répéter en haut » ▸ sélectionne \$1:\$1
// la ligne 1 se réimprime en tête de chaque page</pre>
<h3>5. En-tête et pied de page</h3>
<p>Pour un titre, une date ou un numéro de page sur l'impression : <code>Insertion ▸ En-tête et pied de page</code>. On y insère des champs automatiques (numéro de page, nom du fichier, date).</p>
<h3>6. Vérifier AVANT d'imprimer : l'aperçu</h3>
<pre class="pseudo">Ctrl + P  (ou Fichier ▸ Imprimer)   // ouvre l'aperçu : on voit exactement les pages
Affichage ▸ Aperçu des sauts de page  // montre où Excel coupe, réglable à la souris</pre>
<div class="tip">Le mode « Aperçu des sauts de page » affiche des lignes bleues : tu peux les faire glisser pour décider où couper. Compatibilité 365 et 2021/2019 : identique.</div>`,
  exercises: [
    { type: "qcm", q: "Figer les volets sert à :", opts: ["Protéger les cellules", "Garder des lignes/colonnes visibles en défilant", "Trier", "Imprimer"], a: 1, exp: "Les en-têtes restent affichés à l'écran quand on défile." },
    { type: "qcm", q: "Où se trouve 'Figer les volets' ?", opts: ["Onglet Affichage", "Onglet Données", "Onglet Révision", "Onglet Fichier"], a: 0, exp: "Ruban ▸ Affichage ▸ Figer les volets." },
    { type: "qcm", q: "Pour figer la ligne 1 ET la colonne A, on clique d'abord :", opts: ["A1", "B2 puis Figer les volets", "Z100", "B1 puis Figer les volets"], a: 1, exp: "Excel fige ce qui est au-dessus et à gauche de B2." },
    { type: "vf", q: "Figer les volets protège les cellules contre la modification.", a: false, exp: "Non : figer aide à lire, verrouiller (jour 27) protège." },
    { type: "qcm", q: "L'orientation 'Paysage' donne une feuille :", opts: ["Plus haute", "Couchée, plus large", "Protégée", "Divisée en deux pages automatiquement"], a: 1, exp: "Paysage = format horizontal, utile pour les tableaux larges." },
    { type: "qcm", q: "Pour n'imprimer qu'une partie précise du tableau :", opts: ["Mise en page ▸ Zone d'impression ▸ Définir", "Trier", "Filtrer", "Ctrl + Z"], a: 0, exp: "La zone d'impression limite ce qui sort à l'impression." },
    { type: "qcm", q: "Pour éviter des colonnes sur une 2e page :", opts: ["Ajuster : Largeur = 1 page", "Trier", "Masquer la ligne 1", "Réduire la taille de police à 8"], a: 0, exp: "La mise à l'échelle comprime tout sur 1 page de large." },
    { type: "qcm", q: "Répéter la ligne d'en-têtes sur chaque page imprimée :", opts: ["Mise en page ▸ Imprimer les titres ▸ Lignes à répéter en haut", "Figer les volets", "Insertion ▸ Tableau", "Trier"], a: 0, exp: "Imprimer les titres concerne le papier, pas l'écran." },
    { type: "vf", q: "'Figer les volets' et 'Imprimer les titres' sont le même réglage.", a: false, exp: "Figer = écran ; Imprimer les titres = pages papier. Deux réglages distincts." },
    { type: "qcm", q: "Pour ajouter un numéro de page à l'impression :", opts: ["Insertion ▸ En-tête et pied de page", "Données ▸ Trier", "Accueil ▸ Police", "Révision"], a: 0, exp: "Le pied de page accueille le numéro de page automatique." },
    { type: "qcm", q: "Le raccourci pour l'aperçu avant impression :", opts: ["Ctrl + P", "Ctrl + S", "Ctrl + F", "F2"], a: 0, exp: "Ctrl + P ouvre Fichier ▸ Imprimer avec l'aperçu." },
    { type: "qcm", q: "'Aperçu des sauts de page' permet de :", opts: ["Trier", "Voir et déplacer où Excel coupe les pages", "Protéger", "Filtrer"], a: 1, exp: "Les lignes bleues (déplaçables) montrent les coupures." },
    { type: "vf", q: "On peut faire glisser les lignes bleues des sauts de page.", a: true, exp: "Elles sont ajustables à la souris pour choisir les coupures." },
    { type: "qcm", q: "Pour figer seulement la première colonne :", opts: ["Affichage ▸ Figer les volets ▸ Figer la première colonne", "Trier", "Ctrl + 1", "Insertion"], a: 0, exp: "L'option dédiée fige la colonne A." },
    { type: "vf", q: "Ces réglages d'affichage et d'impression sont identiques en 365 et 2021/2019.", a: true, exp: "Mêmes onglets et mêmes commandes." }
  ],
  final: {
    title: "Exercice final — Imprimer proprement une longue liste",
    intro: `<p>Tu as une liste de 200 clients (en-têtes en ligne 1, données de la ligne 2 à 201) qui déborde sur 5 pages, et sur les pages 2 à 5 on ne voit plus les titres de colonnes.</p>
<pre class="pseudo">      A         B          C           D
1   Nom       Ville      Téléphone   Montant   ← ligne d'en-têtes
2   …         …          …           …
…   (jusqu'à la ligne 201)</pre>
<p>Objectif : titres visibles à l'écran ET répétés sur chaque page imprimée, sans colonnes orphelines.</p>`,
    questions: [
      { type: "qcm", q: "Pour garder les titres à l'ÉCRAN en défilant :", opts: ["Affichage ▸ Figer les volets ▸ Figer la ligne supérieure", "Imprimer les titres", "Trier", "Zone d'impression"], a: 0, exp: "Figer la ligne supérieure garde la ligne 1 visible à l'écran." },
      { type: "qcm", q: "Pour répéter les titres sur chaque PAGE imprimée :", opts: ["Mise en page ▸ Imprimer les titres ▸ Lignes à répéter en haut : \$1:\$1", "Figer les volets", "Ctrl + P seulement", "Filtrer"], a: 0, exp: "Imprimer les titres agit sur le papier, page après page." },
      { type: "qcm", q: "Pour éviter que des colonnes partent sur une 2e page en largeur :", opts: ["Ajuster : Largeur = 1 page", "Masquer la colonne D", "Trier", "Supprimer des lignes"], a: 0, exp: "La mise à l'échelle comprime la largeur sur 1 page." },
      { type: "input", q: "Quelle plage indiquer dans 'Lignes à répéter en haut' pour la ligne 1 ?", a: "\$1:\$1", ph: "ex. \$1:\$1", exp: "\$1:\$1 désigne toute la ligne 1." },
      { type: "qcm", q: "Comment vérifier le rendu avant d'imprimer ?", opts: ["Ctrl + P (aperçu)", "Trier", "Ctrl + S", "Insertion ▸ Tableau"], a: 0, exp: "L'aperçu (Ctrl+P) montre les pages telles qu'elles sortiront." }
    ],
    solution: `<p><strong>Étape écran — figer les titres :</strong></p>
<pre class="pseudo">Affichage ▸ Figer les volets ▸ « Figer la ligne supérieure »
→ la ligne 1 reste affichée quand on descend dans les 200 clients</pre>
<p><strong>Étape impression — répéter les titres :</strong></p>
<pre class="pseudo">Mise en page ▸ Imprimer les titres
▸ « Lignes à répéter en haut » : clique la ligne 1 → \$1:\$1 s'inscrit
→ les en-têtes se réimpriment en haut des pages 2, 3, 4, 5</pre>
<p><strong>Étape mise à l'échelle :</strong></p>
<pre class="pseudo">Mise en page ▸ Ajuster : Largeur = 1 page (Hauteur : automatique)
→ les 4 colonnes tiennent sur une seule largeur de page</pre>
<p><strong>Contrôle final :</strong> <code>Ctrl + P</code> pour vérifier l'aperçu. On voit les titres en haut de chaque page et aucune colonne orpheline.</p>
<p>Retiens la distinction clé : <strong>Figer les volets = confort à l'écran</strong> ; <strong>Imprimer les titres = répétition sur le papier</strong>. Il faut souvent les deux.</p>`
  }
};
</script>
