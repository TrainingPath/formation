  num: 26,
  title: "Nommer des plages de cellules",
  subtitle: "Remplacer les \$A\$1:\$A\$10 par des noms clairs comme TVA ou Prix.",
  theory: `
<h3>1. C'est quoi une plage nommée ?</h3>
<p>Une <strong>plage nommée</strong> est un surnom que tu donnes à une cellule ou à un groupe de cellules. Analogie : au lieu de dire « la personne assise en rangée A, siège 1 », tu dis « Marie ». La formule <code>=B2*\$F\$1</code> devient <code>=B2*TVA</code> : bien plus lisible, et tu ne peux plus te tromper de cellule.</p>
<div class="tip">Un nom pointe toujours vers la même cellule : c'est comme une référence <strong>absolue</strong> (jour 8) déguisée en mot. Pas besoin de \$ quand on utilise le nom.</div>
<h3>2. La façon la plus rapide : la Zone Nom</h3>
<p>La <strong>Zone Nom</strong> est la petite case tout en haut à gauche, juste à gauche de la barre de formule (elle affiche normalement « A1 »).</p>
<pre class="pseudo">1. Sélectionne la cellule ou la plage (ex. F1)
2. Clique dans la Zone Nom (en haut à gauche)
3. Tape le nom : TVA  puis Entrée
// désormais F1 s'appelle TVA partout dans le classeur</pre>
<h3>3. La méthode complète : le Gestionnaire de noms</h3>
<pre class="pseudo">Ruban ▸ Formules ▸ Gestionnaire de noms      // liste, crée, modifie, supprime les noms
Ruban ▸ Formules ▸ Définir un nom            // crée un nom avec sa portée</pre>
<p>Le <strong>Gestionnaire de noms</strong> montre tous les noms, ce à quoi ils renvoient, et permet de les corriger ou supprimer. Indispensable dès qu'un classeur grandit.</p>
<h3>4. Les règles de nommage</h3>
<ul>
<li>Pas d'espace (utilise <code>Prix_HT</code> ou <code>PrixHT</code>).</li>
<li>Ne pas commencer par un chiffre.</li>
<li>Interdit d'utiliser un nom qui ressemble à une adresse de cellule (ex. « A1 », « TVA1 » si ça peut être lu comme une case).</li>
<li>Sensible au sens mais pas à la casse : <code>tva</code> et <code>TVA</code> sont le même nom.</li>
</ul>
<h3>5. Créer plusieurs noms d'un coup (depuis les en-têtes)</h3>
<pre class="pseudo">Sélectionne le tableau AVEC ses en-têtes
Formules ▸ Depuis sélection ▸ coche « Ligne du haut »
// chaque colonne prend le nom de son en-tête : Prix, Quantité, Total…</pre>
<h3>6. Utiliser un nom dans une formule</h3>
<pre class="pseudo">=SOMME(Ventes)              // Ventes = la plage nommée B2:B13
=Prix*Quantite             // multiplie deux plages nommées, ligne à ligne
=B2*(1+TVA)                // TVA = la cellule du taux ; on lit tout de suite le sens</pre>
<div class="tip">Astuce : quand tu commences à taper un nom dans une formule, Excel le propose dans la liste d'auto-complétion (avec une petite étiquette). Appuie sur Tab pour l'insérer.</div>
<h3>7. Portée : feuille ou classeur</h3>
<p>La <strong>portée</strong> dit où le nom est valable : tout le <strong>classeur</strong> (par défaut) ou une seule <strong>feuille</strong>. On la choisit dans « Définir un nom ». Pour un usage général, laisse « Classeur ».</p>
<div class="tip">Compatibilité : les plages nommées existent depuis toujours, à l'identique dans 365 et 2021/2019.</div>`,
  exercises: [
    { type: "qcm", q: "Une plage nommée est :", opts: ["Une formule prédéfinie", "Un surnom donné à une ou plusieurs cellules", "Un graphique", "Un filtre"], a: 1, exp: "Un nom qui désigne une cellule ou une plage." },
    { type: "qcm", q: "Un nom se comporte comme une référence :", opts: ["Relative", "Absolue (pointe toujours la même cellule)", "Vide", "Aléatoire"], a: 1, exp: "Comme une référence absolue, sans avoir à écrire de \$." },
    { type: "qcm", q: "La façon la plus rapide de nommer une cellule :", opts: ["La Zone Nom en haut à gauche", "Un graphique", "Le filtre", "L'impression"], a: 0, exp: "Sélectionne, clique la Zone Nom, tape le nom, Entrée." },
    { type: "qcm", q: "Le Gestionnaire de noms se trouve dans :", opts: ["Onglet Formules", "Onglet Données", "Onglet Insertion", "Onglet Affichage"], a: 0, exp: "Ruban ▸ Formules ▸ Gestionnaire de noms." },
    { type: "vf", q: "Un nom de plage peut contenir des espaces.", a: false, exp: "Interdit : utilise un underscore (Prix_HT) ou colle les mots." },
    { type: "qcm", q: "Un nom de plage peut-il commencer par un chiffre ?", opts: ["Oui", "Non", "Seulement en 365", "Seulement s'il est court"], a: 1, exp: "Un nom ne commence jamais par un chiffre." },
    { type: "vf", q: "tva et TVA désignent le même nom (insensible à la casse).", a: true, exp: "La casse n'est pas distinguée pour les noms." },
    { type: "qcm", q: "=SOMME(Ventes) où Ventes = B2:B13 :", opts: ["Renvoie une erreur", "Additionne la plage B2:B13", "Trie", "Compte les cellules"], a: 1, exp: "Le nom remplace la plage dans la formule." },
    { type: "qcm", q: "Pour créer un nom par colonne à partir des en-têtes :", opts: ["Formules ▸ Depuis sélection ▸ Ligne du haut", "Données ▸ Trier", "Insertion ▸ Tableau", "Accueil ▸ Coller"], a: 0, exp: "Chaque colonne prend le nom de son en-tête." },
    { type: "qcm", q: "L'auto-complétion des noms dans une formule s'insère avec :", opts: ["La touche Tab", "La touche Suppr", "Ctrl + S", "Alt + F4"], a: 0, exp: "Tab insère le nom proposé." },
    { type: "qcm", q: "La 'portée' d'un nom précise :", opts: ["Son type de données", "S'il vaut pour tout le classeur ou une seule feuille", "Son format", "Son tri"], a: 1, exp: "Portée = classeur (défaut) ou feuille." },
    { type: "vf", q: "=B2*(1+TVA) est plus lisible que =B2*(1+\$F\$1).", a: true, exp: "Le nom rend l'intention immédiatement claire." },
    { type: "qcm", q: "Pour supprimer un nom devenu inutile :", opts: ["Gestionnaire de noms ▸ Supprimer", "Trier", "Filtrer", "Formules ▸ Vérification des formules"], a: 0, exp: "Le Gestionnaire de noms liste et supprime les noms." },
    { type: "vf", q: "Les plages nommées fonctionnent aussi bien en 365 qu'en Office 2021/2019.", a: true, exp: "Fonctionnalité ancienne et commune." },
    { type: "qcm", q: "Un nom valable comme source de liste déroulante (jour 25) :", opts: ["Oui, Source : =Villes fonctionne", "Non, jamais", "Seulement en 2019", "Seulement pour des nombres"], a: 0, exp: "On peut écrire Source : =NomDePlage dans la validation." }
  ],
  final: {
    title: "Exercice final — Facturer avec la TVA",
    intro: `<p>Un mini-tableau de facturation :</p>
<pre class="pseudo">      A          B          C
1   Article    PrixHT     PrixTTC
2   Clavier    50
3   Souris     20
4   Écran      200
5
6   Taux TVA   0,20</pre>
<p>On veut nommer la cellule B6 « TVA », puis calculer le PrixTTC = PrixHT × (1 + TVA) de façon lisible.</p>`,
    questions: [
      { type: "qcm", q: "Comment nommer B6 rapidement ?", opts: ["Sélectionner B6, taper TVA dans la Zone Nom, Entrée", "La copier dans une autre feuille", "La trier", "La filtrer"], a: 0, exp: "La Zone Nom (en haut à gauche) est la voie la plus rapide." },
      { type: "qcm", q: "Quelle formule en C2 ?", opts: ["=B2*TVA", "=B2*(1+TVA)", "=B2+TVA", "=TVA"], a: 1, exp: "PrixTTC = PrixHT × (1 + taux)." },
      { type: "input", q: "Que vaut le PrixTTC du Clavier (50 × 1,20) ?", a: "60", ph: "nombre", exp: "50 × 1,20 = 60 €." },
      { type: "vf", q: "Grâce au nom, pas besoin d'écrire \$B\$6 dans la formule.", a: true, exp: "Le nom se comporte déjà comme une référence absolue." },
      { type: "input", q: "Que vaut le PrixTTC de l'Écran (200 × 1,20) ?", a: "240", ph: "nombre", exp: "200 × 1,20 = 240 €." }
    ],
    solution: `<p><strong>Marche à suivre :</strong></p>
<pre class="pseudo">1. Clique B6 (qui contient 0,20)
2. Clique la Zone Nom (en haut à gauche), tape : TVA, Entrée
3. En C2, tape :  =B2*(1+TVA)
   - B2      : le prix HT de la ligne
   - TVA     : le taux (0,20), toujours la cellule B6 grâce au nom
   - (1+TVA) : ajoute 20 % → multiplie par 1,20
4. Recopie C2 vers le bas (poignée de recopie) jusqu'à C4</pre>
<p><strong>Résultats :</strong> Clavier 60 · Souris 24 · Écran 240.</p>
<p>Sans le nom, il aurait fallu écrire <code>=B2*(1+\$B\$6)</code> et penser aux \$ pour figer B6 à la recopie. Le nom <code>TVA</code> fait ce travail automatiquement ET rend la formule lisible.</p>`
  }
};
</script>
