<script>
var DAY = {
  num: 22,
  title: "Personnaliser un graphique",
  subtitle: "Titres, couleurs, étiquettes : rendre le graphique clair et professionnel.",
  theory: `
<h3>1. Les « éléments » d'un graphique</h3>
<p>Un graphique est fait de plusieurs <strong>éléments</strong> qu'on peut afficher ou masquer : le <strong>titre</strong>, les <strong>titres d'axes</strong>, les <strong>étiquettes de données</strong> (les chiffres écrits sur les barres), la <strong>légende</strong>, le <strong>quadrillage</strong>. Analogie : c'est comme habiller une silhouette — on ajoute juste ce qui aide à comprendre.</p>
<div class="tip">Le moyen le plus rapide : clique le graphique, un petit bouton <strong>+</strong> apparaît à droite (« Éléments de graphique »). Coche/décoche ce que tu veux.</div>
<h3>2. Mettre un titre parlant</h3>
<pre class="pseudo">Clique la zone « Titre du graphique » ▸ tape ton texte
// ou : Création de graphique ▸ Ajouter un élément ▸ Titre du graphique</pre>
<p>Un bon titre dit CE QUE montre le graphique (« Ventes 2024 par trimestre »), pas juste « Graphique 1 ».</p>
<h3>3. Ajouter les étiquettes de données</h3>
<p>Les <strong>étiquettes de données</strong> affichent la valeur exacte sur chaque barre ou point. Très utile quand on veut le chiffre ET la vue d'ensemble.</p>
<pre class="pseudo">Bouton + ▸ coche « Étiquettes de données »
// ou : Création de graphique ▸ Ajouter un élément ▸ Étiquettes de données</pre>
<h3>4. Changer les couleurs et le style</h3>
<p>Deux boutons juste à côté du + :</p>
<ul>
<li><strong>Pinceau (Styles)</strong> : jeux de mise en forme tout prêts (bordures, ombres…).</li>
<li><strong>Couleurs</strong> : palettes de couleurs prédéfinies.</li>
</ul>
<p>On peut aussi cliquer <em>une seule</em> barre (deux clics lents) pour la colorer à part : pratique pour mettre en avant un mois record.</p>
<h3>5. Régler les axes</h3>
<p>Double-clique un axe pour ouvrir le volet <strong>Format de l'axe</strong> à droite. Tu peux y fixer :</p>
<pre class="pseudo">Minimum / Maximum : les bornes de l'échelle (ex. de 0 à 3000)
Unité principale : l'espacement des graduations (ex. tous les 500)</pre>
<div class="warn">Piège de lecture : si l'axe ne commence PAS à 0, les écarts paraissent exagérés. Pour une comparaison honnête, garde souvent le minimum à 0.</div>
<h3>6. Changer le type sans tout refaire</h3>
<pre class="pseudo">Création de graphique ▸ Modifier le type de graphique
// passe d'un histogramme à une courbe sans recréer le graphique</pre>
<p>Et <code>Création de graphique ▸ Intervertir les lignes/colonnes</code> échange ce qui est en catégories et ce qui est en séries : très utile si Excel a « deviné » à l'envers.</p>
<h3>7. Compatibilité versions</h3>
<div class="tip">Les boutons +, pinceau et couleurs apparaissent au survol du graphique dans 365 et 2021/2019. Dans les très anciennes versions, tout passe par l'onglet « Création de graphique ▸ Ajouter un élément ». Le résultat est le même.</div>`,
  exercises: [
    { type: "qcm", q: "Le bouton + à droite du graphique sert à :", opts: ["Ajouter des lignes au tableau", "Afficher/masquer les éléments du graphique", "Calculer une somme", "Imprimer"], a: 1, exp: "« Éléments de graphique » coche titre, étiquettes, légende, etc." },
    { type: "qcm", q: "Les 'étiquettes de données' affichent :", opts: ["Le titre", "La valeur exacte sur chaque barre/point", "La légende", "L'axe"], a: 1, exp: "Elles écrivent le chiffre directement sur la donnée." },
    { type: "vf", q: "Un bon titre décrit ce que montre le graphique.", a: true, exp: "« Ventes 2024 par trimestre » vaut mieux que « Graphique 1 »." },
    { type: "qcm", q: "Pour changer la palette de couleurs :", opts: ["Le bouton Couleurs près du graphique", "Données ▸ Trier", "Ctrl + S", "Suppr"], a: 0, exp: "Le bouton Couleurs propose des palettes prédéfinies." },
    { type: "qcm", q: "Pour colorer UNE seule barre différemment :", opts: ["Clic droit ▸ Sélectionner les données", "La cliquer seule (deux clics lents) puis choisir sa couleur", "Trier", "Filtrer"], a: 1, exp: "Un clic sélectionne la série, un second la barre seule." },
    { type: "qcm", q: "Pour régler l'échelle de l'axe vertical :", opts: ["Double-cliquer l'axe ▸ Format de l'axe", "Trier", "Insertion ▸ Tableau", "Ctrl + F"], a: 0, exp: "Le volet Format de l'axe fixe minimum, maximum, unité." },
    { type: "vf", q: "Un axe qui ne commence pas à 0 peut exagérer les écarts.", a: true, exp: "C'est un piège de lecture classique ; garde souvent le minimum à 0." },
    { type: "qcm", q: "Pour passer d'un histogramme à une courbe :", opts: ["Recréer le graphique", "Création de graphique ▸ Modifier le type de graphique", "Le supprimer", "Filtrer"], a: 1, exp: "On change le type sans tout refaire." },
    { type: "qcm", q: "'Intervertir les lignes/colonnes' sert à :", opts: ["Trier", "Échanger catégories et séries", "Imprimer", "Supprimer la légende"], a: 1, exp: "Utile quand Excel a deviné l'axe à l'envers." },
    { type: "qcm", q: "L''unité principale' d'un axe correspond à :", opts: ["Le titre", "L'espacement entre les graduations", "La couleur", "La légende"], a: 1, exp: "Ex. une graduation tous les 500." },
    { type: "qcm", q: "Pour ajouter un titre d'axe :", opts: ["Bouton + ▸ Titres des axes", "Données ▸ Filtrer", "Ctrl + Z", "Fichier ▸ Options"], a: 0, exp: "Les éléments (dont Titres des axes) se cochent via le bouton +." },
    { type: "vf", q: "La légende peut être masquée si elle est inutile (une seule série).", a: true, exp: "Décoche « Légende » dans le bouton +." },
    { type: "qcm", q: "Le bouton 'pinceau' près du graphique gère :", opts: ["Les styles de mise en forme", "Le tri", "L'impression", "Les formules"], a: 0, exp: "Le pinceau propose des styles tout prêts." },
    { type: "vf", q: "Les boutons +, pinceau et couleurs existent dans 365 et 2021/2019.", a: true, exp: "Ils apparaissent au survol du graphique dans ces versions." },
    { type: "qcm", q: "Le 'quadrillage' d'un graphique correspond :", opts: ["Aux lignes de repère derrière les données", "Au titre", "À la légende", "Aux étiquettes"], a: 0, exp: "Ce sont les lignes horizontales/verticales de fond, activables via le +." }
  ],
  final: {
    title: "Exercice final — Habiller le graphique des ventes",
    intro: `<p>Tu repars du graphique des ventes trimestrielles :</p>
<pre class="pseudo">      A            B
1   Trimestre    Ventes
2   T1           1200
3   T2           1800
4   T3           900
5   T4           2100</pre>
<p>Objectif : histogramme avec un titre clair, les valeurs affichées sur les barres, la barre T4 en couleur différente, et un axe vertical de 0 à 2500.</p>`,
    questions: [
      { type: "qcm", q: "Comment ajouter le titre 'Ventes 2024 par trimestre' ?", opts: ["Cliquer la zone Titre et taper le texte", "Trier", "Insertion ▸ Tableau", "Suppr"], a: 0, exp: "On clique la zone Titre du graphique et on saisit." },
      { type: "qcm", q: "Comment afficher les valeurs sur les barres ?", opts: ["Bouton + ▸ Étiquettes de données", "Données ▸ Filtrer", "Ctrl + P", "Format de l'axe"], a: 0, exp: "Les étiquettes de données écrivent la valeur sur chaque barre." },
      { type: "qcm", q: "Comment colorer seulement la barre T4 ?", opts: ["La cliquer seule puis Remplissage", "Trier Z→A", "Supprimer les autres", "Clic droit ▸ Modifier le type de graphique de la série"], a: 0, exp: "Deux clics lents isolent la barre T4, puis on choisit sa couleur." },
      { type: "input", q: "Si l'axe va de 0 à 2500, quelle valeur touche presque le haut ?", a: "2100", ph: "nombre", exp: "T4 = 2100, proche du maximum 2500." },
      { type: "qcm", q: "Régler le maximum de l'axe à 2500 se fait dans :", opts: ["Format de l'axe (double-clic sur l'axe)", "Données ▸ Trier", "Accueil ▸ Police", "Insertion"], a: 0, exp: "Le volet Format de l'axe fixe Minimum et Maximum." }
    ],
    solution: `<p><strong>Marche à suivre :</strong></p>
<pre class="pseudo">1. Sélectionne A1:B5 ▸ Insertion ▸ Histogramme groupé
2. Titre : clique « Titre du graphique » ▸ tape « Ventes 2024 par trimestre »
3. Valeurs : bouton + ▸ coche « Étiquettes de données »
4. Barre T4 : clique une fois la série (toutes les barres), puis re-clique la seule barre T4
   ▸ clic droit ▸ Remplissage ▸ choisis une couleur vive
5. Axe : double-clique l'axe vertical ▸ Format de l'axe
   ▸ Minimum = 0 ▸ Maximum = 2500</pre>
<p><strong>Résultat :</strong> un histogramme lisible, titré, avec 1200 / 1800 / 900 / 2100 écrits sur les barres, T4 mise en avant par sa couleur, et une échelle honnête partant de 0.</p>
<p>Garder le minimum à 0 évite d'exagérer visuellement les écarts entre trimestres.</p>`
  }
};
</script>
