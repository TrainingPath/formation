<script>
var DAY = {
  num: 18,
  title: "Trier les données",
  subtitle: "Remettre une liste dans l'ordre, sans se tromper de colonnes.",
  theory: `
<h3>1. Trier, c'est quoi ?</h3>
<p><strong>Trier</strong>, c'est réorganiser les lignes d'un tableau selon une colonne : de A à Z, du plus petit au plus grand, du plus récent au plus ancien… Analogie : c'est ranger des fiches par ordre alphabétique. Excel déplace des <strong>lignes entières</strong>, pas seulement la colonne triée — sinon les données ne correspondraient plus.</p>
<div class="warn">Danger n°1 du tri : sélectionner UNE seule colonne et trier « la sélection ». Les noms bougent mais pas les âges : tout se mélange ! Clique juste une cellule DANS le tableau et laisse Excel détecter les colonnes.</div>
<h3>2. Le tri rapide (un clic)</h3>
<p>Clique une cellule de la colonne à trier, puis :</p>
<pre class="pseudo">Ruban ▸ Données ▸ Trier de A à Z   // ordre croissant (A→Z, 1→9, ancien→récent)
Ruban ▸ Données ▸ Trier de Z à A   // ordre décroissant (Z→A, 9→1, récent→ancien)</pre>
<p>Le même bouton existe aussi dans <code>Accueil ▸ Trier et filtrer</code>. Excel reconnaît tout seul la ligne d'en-têtes (la ligne 1 avec les titres) et ne la trie pas.</p>
<h3>3. Le tri sur plusieurs niveaux</h3>
<p>Pour trier « par ville, puis par nom à l'intérieur de chaque ville », il faut plusieurs <strong>niveaux</strong>. Un <strong>niveau</strong> est un critère de tri ; le 2ᵉ niveau départage les ex æquo du 1ᵉʳ.</p>
<pre class="pseudo">Ruban ▸ Données ▸ Trier   // ouvre la boîte de dialogue « Trier »
Niveau 1 : Trier par « Ville »  ordre A à Z          // critère principal
+ Ajouter un niveau                                  // bouton « Ajouter un niveau »
Niveau 2 : Puis par « Nom »  ordre A à Z             // départage les mêmes villes</pre>
<div class="tip">L'ordre des niveaux compte : le niveau du haut est le critère principal. Utilise les flèches Monter/Descendre pour le changer.</div>
<h3>4. Trier des nombres, des dates, du texte</h3>
<ul>
<li><strong>Texte</strong> : A→Z ou Z→A (ordre alphabétique).</li>
<li><strong>Nombres</strong> : du plus petit au plus grand, ou l'inverse.</li>
<li><strong>Dates</strong> : du plus ancien au plus récent, ou l'inverse.</li>
</ul>
<div class="warn">Si des nombres sont stockés comme du texte (petit triangle vert en haut à gauche de la cellule), le tri sera faux (10 avant 2). Convertis-les d'abord en nombres.</div>
<h3>5. Trier par couleur (option avancée)</h3>
<p>Dans <code>Données ▸ Trier</code>, le menu « Trier sur » propose aussi « Couleur de cellule » : pratique pour remonter les cellules colorées par une mise en forme conditionnelle (jour 17). Disponible dans 365 comme dans 2021/2019.</p>
<h3>6. Le piège des lignes vides</h3>
<div class="warn">Une ligne entièrement vide au milieu du tableau « coupe » la détection automatique : Excel ne triera que le bloc au-dessus. Évite les lignes vides dans tes données.</div>`,
  exercises: [
    { type: "qcm", q: "Trier de A à Z veut dire :", opts: ["Ordre décroissant", "Ordre croissant (alphabétique/petit à grand)", "Supprimer des lignes", "Filtrer"], a: 1, exp: "A→Z = croissant." },
    { type: "vf", q: "Quand on trie, Excel déplace les lignes entières, pas juste la colonne triée.", a: true, exp: "Sinon les données ne correspondraient plus entre elles." },
    { type: "qcm", q: "Où trouve-t-on les boutons de tri ?", opts: ["Onglet Données", "Onglet Insertion", "Onglet Affichage", "Onglet Fichier"], a: 0, exp: "Ruban ▸ Données ▸ Trier (aussi dans Accueil ▸ Trier et filtrer)." },
    { type: "qcm", q: "Pour ne PAS mélanger les colonnes, avant de trier je dois :", opts: ["Sélectionner une seule colonne", "Cliquer une cellule dans le tableau et laisser Excel détecter", "Copier le tableau", "Supprimer les en-têtes"], a: 1, exp: "Une simple cellule active suffit ; Excel étend la sélection." },
    { type: "qcm", q: "Un 'niveau' de tri, c'est :", opts: ["Une ligne du tableau", "Un critère de tri", "Une couleur", "Un onglet"], a: 1, exp: "Chaque niveau = un critère ; le 2ᵉ départage les ex æquo du 1ᵉʳ." },
    { type: "vf", q: "Le niveau du haut dans la boîte Trier est le critère principal.", a: true, exp: "Les niveaux suivants ne servent qu'à départager." },
    { type: "qcm", q: "Pour trier par Ville PUIS par Nom, il faut :", opts: ["Deux niveaux", "Deux fichiers", "Deux feuilles", "Impossible"], a: 0, exp: "Niveau 1 Ville, niveau 2 Nom, via Ajouter un niveau." },
    { type: "qcm", q: "Des nombres stockés comme du texte donnent un tri :", opts: ["Correct", "Faux (10 avant 2)", "Impossible", "En couleur"], a: 1, exp: "Le texte se trie caractère par caractère : '10' passe avant '2'." },
    { type: "vf", q: "Excel trie automatiquement la ligne d'en-têtes avec les données.", a: false, exp: "Il reconnaît les en-têtes et les laisse en place." },
    { type: "qcm", q: "Trier des dates de Z à A (décroissant) donne :", opts: ["Du plus ancien au plus récent", "Du plus récent au plus ancien", "Par ordre alphabétique", "Rien"], a: 1, exp: "Décroissant = du plus récent au plus ancien." },
    { type: "qcm", q: "Une ligne entièrement vide au milieu du tableau :", opts: ["N'a aucun effet", "Coupe la détection : seul le bloc du haut est trié", "Accélère le tri", "Colore les données"], a: 1, exp: "Évite les lignes vides dans une plage à trier." },
    { type: "vf", q: "On peut trier selon la couleur des cellules.", a: true, exp: "Données ▸ Trier ▸ Trier sur ▸ Couleur de cellule." },
    { type: "qcm", q: "Pour changer l'ordre des niveaux dans la boîte Trier :", opts: ["Les flèches Monter/Descendre", "Ctrl+Z", "Retaper les titres", "Fermer le fichier"], a: 0, exp: "Les flèches réordonnent les niveaux." },
    { type: "qcm", q: "Le tri par couleur est disponible :", opts: ["Seulement dans 365", "Seulement dans 2019", "Dans 365 et 2021/2019", "Jamais"], a: 2, exp: "Fonctionnalité présente dans toutes ces versions." },
    { type: "qcm", q: "Après avoir cliqué une cellule de la colonne 'Âge', 'Trier de Z à A' donne :", opts: ["Les plus jeunes en haut", "Les plus âgés en haut", "L'ordre alphabétique", "Rien"], a: 1, exp: "Z à A sur des nombres = du plus grand au plus petit." }
  ],
  final: {
    title: "Exercice final — Le carnet de contacts",
    intro: `<p>Un petit carnet de contacts :</p>
<pre class="pseudo">      A         B          C
1   Nom       Ville      Âge
2   Zoé       Lyon       30
3   Ali       Paris      25
4   Nina      Lyon       22
5   Tom       Paris      40</pre>
<p>On veut trier par <strong>Ville</strong> (A→Z), puis par <strong>Âge</strong> (croissant) à l'intérieur de chaque ville.</p>`,
    questions: [
      { type: "qcm", q: "Quelle est la première action ?", opts: ["Sélectionner seulement la colonne Ville", "Cliquer une cellule du tableau", "Supprimer la ligne 1", "Copier ailleurs"], a: 1, exp: "Une cellule active suffit ; Excel détecte tout le tableau." },
      { type: "qcm", q: "Combien de niveaux de tri faut-il ?", opts: ["1", "2", "3", "0"], a: 1, exp: "Niveau 1 = Ville, niveau 2 = Âge." },
      { type: "input", q: "Quel nom se retrouve tout en haut après le tri ?", a: "Nina", ph: "un prénom", exp: "Ville Lyon d'abord ; entre Nina (22) et Zoé (30), la plus jeune (Nina) passe devant." },
      { type: "input", q: "Quel nom se retrouve tout en bas ?", a: "Tom", ph: "un prénom", exp: "Ville Paris ensuite ; entre Ali (25) et Tom (40), le plus âgé (Tom) est en bas." },
      { type: "qcm", q: "Si on inversait les niveaux (Âge puis Ville), le résultat :", opts: ["Serait identique", "Serait différent : l'ordre des niveaux compte", "Provoquerait une erreur", "Effacerait les données"], a: 1, exp: "Le critère du haut prime : l'ordre des niveaux change le résultat." }
    ],
    solution: `<p><strong>Marche à suivre :</strong></p>
<pre class="pseudo">1. Clique une cellule quelconque du tableau (ex. A2)
2. Ruban ▸ Données ▸ Trier
3. Coche « Mes données ont des en-têtes » (souvent déjà coché)
4. Niveau 1 : Trier par « Ville », ordre A à Z
5. Clique « Ajouter un niveau »
6. Niveau 2 : Puis par « Âge », ordre du plus petit au plus grand
7. OK</pre>
<p><strong>Résultat :</strong></p>
<pre class="pseudo">Nina  Lyon   22
Zoé   Lyon   30
Ali   Paris  25
Tom   Paris  40</pre>
<p>Les deux Lyon d'abord (triés par âge), puis les deux Paris (triés par âge).</p>`
  }
};
</script>
