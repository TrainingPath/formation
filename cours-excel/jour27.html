<script>
var DAY = {
  num: 27,
  title: "Protéger cellules, feuilles et classeur",
  subtitle: "Empêcher qu'on écrase tes formules, ou ouvrir sans mot de passe.",
  theory: `
<h3>1. Trois niveaux de protection</h3>
<p>Excel protège à trois échelles, à ne pas confondre :</p>
<ul>
<li><strong>Cellules / feuille</strong> : empêcher de modifier certaines cellules (tes formules), tout en laissant saisir ailleurs.</li>
<li><strong>Structure du classeur</strong> : empêcher d'ajouter, supprimer ou renommer des feuilles.</li>
<li><strong>Fichier</strong> : demander un mot de passe pour ouvrir tout le classeur.</li>
</ul>
<h3>2. La règle en deux temps (le point le plus important)</h3>
<p>Toutes les cellules sont <strong>« Verrouillées » par défaut</strong>… mais ce verrou ne fait RIEN tant que la feuille n'est pas protégée. La logique se fait donc en deux temps :</p>
<pre class="pseudo">Étape 1 : DÉVERROUILLE les cellules où l'on veut pouvoir écrire
   Sélectionne ces cellules ▸ Ctrl+1 (Format de cellule) ▸ onglet Protection ▸ décoche « Verrouillée »
Étape 2 : PROTÈGE la feuille
   Ruban ▸ Révision ▸ Protéger la feuille
// résultat : on ne peut taper QUE dans les cellules déverrouillées ; les autres (formules) sont bloquées</pre>
<div class="warn">Erreur classique : protéger la feuille sans avoir d'abord déverrouillé les cellules de saisie → plus personne ne peut rien taper. Déverrouille d'abord, protège ensuite.</div>
<h3>3. Protéger la feuille en détail</h3>
<pre class="pseudo">Révision ▸ Protéger la feuille
▸ (facultatif) mot de passe
▸ coche ce qui reste autorisé (ex. « Sélectionner les cellules déverrouillées »)</pre>
<p>Pour lever la protection : <code>Révision ▸ Ôter la protection de la feuille</code> (il faudra le mot de passe s'il y en avait un).</p>
<h3>4. Protéger la structure du classeur</h3>
<pre class="pseudo">Révision ▸ Protéger le classeur
// empêche d'ajouter, supprimer, renommer, masquer ou déplacer des feuilles
// n'empêche PAS de modifier le contenu des cellules (c'est le rôle de la protection de feuille)</pre>
<h3>5. Mot de passe pour ouvrir le fichier</h3>
<p>Pour qu'on ne puisse même pas ouvrir le classeur sans mot de passe :</p>
<pre class="pseudo">Fichier ▸ Informations ▸ Protéger le classeur ▸ « Chiffrer avec mot de passe »
// ou : Fichier ▸ Enregistrer sous ▸ Outils ▸ Options générales ▸ Mot de passe pour la lecture</pre>
<div class="warn">Un mot de passe de fichier oublié = fichier PERDU. Microsoft ne peut pas le récupérer. Note-le en lieu sûr.</div>
<h3>6. Masquer sans protéger (à ne pas confondre)</h3>
<p>Masquer une colonne (clic droit ▸ Masquer) la cache mais n'importe qui peut la réafficher. Pour vraiment empêcher de la voir, il faut la masquer PUIS protéger la feuille. Masquer ≠ protéger.</p>
<div class="tip">Compatibilité : ces protections existent à l'identique dans 365 et 2021/2019. Les mots de passe restent valables d'une version à l'autre.</div>`,
  exercises: [
    { type: "qcm", q: "Protéger une feuille sert surtout à :", opts: ["Accélérer les calculs", "Empêcher de modifier certaines cellules", "Trier", "Imprimer"], a: 1, exp: "On bloque la modification (souvent des formules)." },
    { type: "vf", q: "Par défaut, toutes les cellules sont 'Verrouillées'.", a: true, exp: "Mais ce verrou n'agit que si la feuille est protégée." },
    { type: "vf", q: "Le verrou d'une cellule agit même si la feuille n'est pas protégée.", a: false, exp: "Le verrou ne fait rien tant que la feuille n'est pas protégée." },
    { type: "qcm", q: "Pour pouvoir taper dans certaines cellules après protection, il faut d'abord :", opts: ["Les déverrouiller (Format de cellule ▸ Protection)", "Les colorer", "Les trier", "Les nommer"], a: 0, exp: "On décoche « Verrouillée » sur les cellules de saisie." },
    { type: "qcm", q: "Où protéger la feuille ?", opts: ["Révision ▸ Protéger la feuille", "Insertion", "Données ▸ Trier", "Accueil ▸ Police"], a: 0, exp: "Ruban ▸ Révision ▸ Protéger la feuille." },
    { type: "qcm", q: "L'ordre correct est :", opts: ["Protéger la feuille puis déverrouiller", "Déverrouiller les cellules de saisie, puis protéger la feuille", "Peu importe l'ordre", "On ne peut pas les deux"], a: 1, exp: "Déverrouiller d'abord, protéger ensuite." },
    { type: "qcm", q: "'Protéger le classeur' (Révision) empêche :", opts: ["De modifier les cellules", "D'ajouter/supprimer/renommer des feuilles", "D'ouvrir le fichier", "De trier"], a: 1, exp: "Cela protège la STRUCTURE (les feuilles), pas le contenu." },
    { type: "qcm", q: "Pour exiger un mot de passe à l'ouverture du fichier :", opts: ["Fichier ▸ Informations ▸ Protéger le classeur ▸ Chiffrer avec mot de passe", "Révision ▸ Protéger la feuille", "Données ▸ Filtrer", "Accueil"], a: 0, exp: "Le chiffrement du classeur exige un mot de passe pour ouvrir." },
    { type: "vf", q: "Un mot de passe de fichier oublié peut être récupéré par Microsoft.", a: false, exp: "Non : fichier chiffré = perdu si le mot de passe est oublié." },
    { type: "qcm", q: "Masquer une colonne (sans protéger) :", opts: ["La rend impossible à réafficher", "La cache mais n'importe qui peut la réafficher", "La supprime", "La trie"], a: 1, exp: "Masquer ≠ protéger : il faut protéger la feuille en plus." },
    { type: "qcm", q: "Pour lever la protection d'une feuille :", opts: ["Révision ▸ Ôter la protection de la feuille", "La supprimer", "Ctrl + Z", "Filtrer"], a: 0, exp: "Il faudra le mot de passe s'il y en avait un." },
    { type: "vf", q: "La protection de feuille peut se faire avec ou sans mot de passe.", a: true, exp: "Le mot de passe est facultatif au moment de protéger." },
    { type: "qcm", q: "'Protéger le classeur' empêche-t-il de modifier une cellule ?", opts: ["Oui", "Non, ça concerne seulement la structure des feuilles", "Seulement en 365", "Uniquement les formules"], a: 1, exp: "Pour bloquer les cellules, il faut protéger la FEUILLE." },
    { type: "vf", q: "Ces protections fonctionnent pareil en 365 et 2021/2019.", a: true, exp: "Mêmes menus, mêmes comportements." },
    { type: "qcm", q: "Le raccourci pour ouvrir Format de cellule (onglet Protection) est :", opts: ["Ctrl + 1", "Ctrl + P", "Ctrl + S", "F2"], a: 0, exp: "Ctrl + 1 ouvre la boîte Format de cellule." }
  ],
  final: {
    title: "Exercice final — Un formulaire de saisie protégé",
    intro: `<p>Un petit formulaire : l'utilisateur ne doit remplir que la colonne B, et surtout pas écraser la formule de Total en B5.</p>
<pre class="pseudo">      A            B
1   Quantité     [saisie]
2   Prix         [saisie]
3
4
5   Total        =B1*B2</pre>
<p>On veut : B1 et B2 modifiables, B5 (la formule) verrouillée, feuille protégée.</p>`,
    questions: [
      { type: "qcm", q: "Quelles cellules faut-il déverrouiller ?", opts: ["B5", "B1 et B2 (les cellules de saisie)", "Toutes", "Aucune"], a: 1, exp: "On déverrouille ce qui doit rester modifiable." },
      { type: "qcm", q: "Comment déverrouiller B1:B2 ?", opts: ["Ctrl+1 ▸ Protection ▸ décocher Verrouillée", "Les colorer", "Les trier", "Les nommer"], a: 0, exp: "Format de cellule ▸ onglet Protection." },
      { type: "vf", q: "B5 doit rester verrouillée pour protéger la formule.", a: true, exp: "On la laisse verrouillée (état par défaut)." },
      { type: "qcm", q: "Étape finale ?", opts: ["Révision ▸ Protéger la feuille", "Supprimer B5", "Trier", "Imprimer"], a: 0, exp: "La protection de feuille active enfin les verrous." },
      { type: "vf", q: "Après protection, taper dans B5 sera refusé mais B1/B2 resteront libres.", a: true, exp: "Seules les cellules déverrouillées acceptent la saisie." }
    ],
    solution: `<p><strong>Marche à suivre :</strong></p>
<pre class="pseudo">1. Sélectionne B1:B2 (les cellules de saisie)
2. Ctrl+1 ▸ onglet Protection ▸ DÉCOCHE « Verrouillée » ▸ OK
   (B5, elle, reste verrouillée : on n'y touche pas)
3. Révision ▸ Protéger la feuille
4. (facultatif) mets un mot de passe
5. Laisse cochée « Sélectionner les cellules déverrouillées » ▸ OK</pre>
<p><strong>Résultat :</strong></p>
<ul>
<li>On peut taper une Quantité en B1 et un Prix en B2.</li>
<li>Toute tentative d'écrire dans B5 (la formule =B1*B2) est bloquée avec un message.</li>
</ul>
<p>Le total se recalcule normalement quand on change B1 ou B2 : protéger n'empêche pas les formules de fonctionner, seulement de les écraser.</p>`
  }
};
</script>

};
