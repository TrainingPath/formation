<script>
var DAY = {
  num: 2,
  title: "Saisir, modifier et se déplacer",
  subtitle: "Écrire dans les cellules, corriger, valider, et bouger vite sans la souris.",
  theory: `
<h3>1. Saisir une valeur</h3>
<p><strong>Saisir</strong>, c'est simplement taper quelque chose dans une cellule. On clique sur la cellule pour la rendre <strong>active</strong> (cadre épais), on tape, puis on <strong>valide</strong>. Tant qu'on n'a pas validé, rien n'est encore enregistré dans la cellule.</p>
<pre class="pseudo">Clic sur A1  ->  tape "Bonjour"  ->  Entree     // Entree valide et descend en A2
Clic sur B1  ->  tape 42        ->  Tab        // Tab valide et va a droite en C1</pre>
<div class="tip">Valider avec <strong>Entrée</strong> descend d'une ligne. Valider avec <strong>Tab</strong> (touche tabulation) va à droite. Choisir la bonne touche fait gagner un temps fou quand on remplit un tableau.</div>
<h3>2. Modifier le contenu d'une cellule</h3>
<p>Il y a deux façons très différentes :</p>
<ul>
<li><strong>Remplacer</strong> tout : clique sur la cellule et tape directement. Le nouveau texte écrase l'ancien.</li>
<li><strong>Corriger</strong> une partie : double-clique sur la cellule (ou appuie sur <code>F2</code>). Un curseur clignotant apparaît <em>dans</em> la cellule : tu peux alors modifier un seul caractère sans tout retaper.</li>
</ul>
<pre class="pseudo">Double-clic sur la cellule   // ou touche F2 : passe en mode "modification"
F2                            // meme chose : edite sans tout effacer
Suppr / Retour arriere       // efface des caracteres pendant l'edition</pre>
<h3>3. Effacer, annuler, rétablir</h3>
<pre class="pseudo">Selectionne + touche Suppr   // vide la cellule (efface le contenu)
Ctrl + Z                     // ANNULE la derniere action (undo)
Ctrl + Y                     // RETABLIT ce qu'on vient d'annuler (redo)
Echap                        // annule la saisie EN COURS avant de valider</pre>
<div class="warn">La touche <strong>Suppr</strong> vide la cellule mais garde sa mise en forme (couleur, bordure). Pour tout enlever, on utilise plus tard <code>Ruban ▸ Accueil ▸ Effacer ▸ Effacer tout</code>.</div>
<h3>4. Se déplacer sans la souris</h3>
<p>Naviguer au clavier est bien plus rapide que de viser à la souris.</p>
<pre class="pseudo">Fleches                 // une cellule dans la direction choisie
Tab                     // une cellule a droite
Entree                  // valide et descend
Ctrl + fleche           // saute au bout des donnees (bord du bloc rempli)
Ctrl + Origine (Debut)  // revient en A1
Ctrl + Fin              // va a la derniere cellule utilisee
Page suiv. / Page prec. // descend / monte d'un ecran</pre>
<div class="tip">La <strong>Zone Nom</strong> (case en haut à gauche) permet de <em>téléporter</em> la sélection : tape <code>D50</code> puis Entrée pour sauter directement en D50, même très loin.</div>
<h3>5. La recopie éclair (aperçu)</h3>
<p>Quand une cellule est active, un petit carré apparaît en bas à droite de son cadre : la <strong>poignée de recopie</strong>. On la travaillera au jour 6, mais retiens déjà qu'un cliquer-glisser dessus recopie le contenu vers les cellules voisines.</p>`,
  exercises: [
    { type: "qcm", q: "Après avoir tapé une valeur, quelle touche valide ET descend d'une ligne ?", opts: ["Tab", "Entrée", "Échap", "Suppr"], a: 1, exp: "Entrée valide et descend. Tab valide et va à droite." },
    { type: "qcm", q: "Quelle touche valide et déplace vers la cellule de droite ?", opts: ["Entrée", "Tab", "F2", "Ctrl"], a: 1, exp: "Tab (tabulation) valide et va à droite : pratique pour remplir une ligne." },
    { type: "qcm", q: "Comment corriger UN seul caractère sans retaper toute la cellule ?", opts: ["Cliquer une fois", "Double-cliquer (ou F2) pour passer en mode modification", "Appuyer sur Suppr", "Changer de feuille"], a: 1, exp: "Double-clic ou F2 place un curseur dans la cellule pour éditer précisément." },
    { type: "qcm", q: "Quel raccourci annule la dernière action ?", opts: ["Ctrl + Z", "Ctrl + Y", "Ctrl + S", "Ctrl + C"], a: 0, exp: "Ctrl + Z = annuler (undo). Ctrl + Y rétablit." },
    { type: "input", q: "Quelle touche du clavier passe une cellule en mode modification (édition) ?", a: "F2", ph: "une touche", exp: "F2 ouvre l'édition dans la cellule, comme un double-clic." },
    { type: "vf", q: "Taper directement dans une cellule déjà remplie écrase son ancien contenu.", a: true, exp: "Un simple clic + saisie remplace tout ; pour garder l'existant, utilise F2." },
    { type: "qcm", q: "Que fait la touche Échap pendant qu'on tape (avant de valider) ?", opts: ["Valide la saisie", "Annule la saisie en cours", "Efface toute la ligne", "Change de feuille"], a: 1, exp: "Échap abandonne ce qu'on est en train de taper et remet le contenu d'origine." },
    { type: "qcm", q: "Que fait Ctrl + Flèche du bas dans un bloc de données rempli ?", opts: ["Descend d'une cellule", "Saute jusqu'au bord (dernière cellule remplie) du bloc", "Efface la colonne", "Insère une ligne"], a: 1, exp: "Ctrl + flèche « saute » au bout des données : idéal dans les longues listes." },
    { type: "input", q: "Quel raccourci (2 touches) ramène en cellule A1 ?", a: "Ctrl + Origine", ph: "ex : Ctrl + X", exp: "Ctrl + Origine (touche Début/Home) revient en A1." },
    { type: "vf", q: "La touche Suppr efface aussi la couleur et les bordures de la cellule.", a: false, exp: "Suppr efface seulement le contenu ; la mise en forme reste. Pour tout enlever : Effacer ▸ Effacer tout." },
    { type: "qcm", q: "Comment sauter très vite en cellule Z200 sans faire défiler ?", opts: ["Avec les flèches", "Taper Z200 dans la Zone Nom puis Entrée", "Avec Ctrl + Z", "Impossible"], a: 1, exp: "La Zone Nom sert à se téléporter : on y tape une référence et Entrée." },
    { type: "qcm", q: "Ctrl + Y sert à…", opts: ["Enregistrer", "Rétablir ce qu'on vient d'annuler (redo)", "Copier", "Fermer le fichier"], a: 1, exp: "Ctrl + Y refait l'action annulée par Ctrl + Z." },
    { type: "input", q: "Quel raccourci va directement à la dernière cellule utilisée de la feuille ?", a: "Ctrl + Fin", ph: "ex : Ctrl + X", exp: "Ctrl + Fin saute au coin bas-droite de la zone utilisée." },
    { type: "vf", q: "Pour remplir une ligne de gauche à droite, valider avec Tab est plus pratique qu'avec Entrée.", a: true, exp: "Tab avance à droite ; Entrée descendrait, ce qui casse le remplissage horizontal." },
    { type: "qcm", q: "Tu as effacé une donnée par erreur. Que faire immédiatement ?", opts: ["Fermer sans enregistrer", "Ctrl + Z pour annuler", "Ctrl + S", "Retaper de mémoire"], a: 1, exp: "Ctrl + Z restaure la donnée : le réflexe de sauvetage n°1." }
  ],
  final: {
    title: "Exercice final — Remplir une petite liste",
    intro: `<p>On veut saisir cette liste de courses dans une feuille vierge :</p>
<pre class="pseudo">      A          B
  1  Article    Quantite
  2  Pain       2
  3  Lait       1
  4  Oeufs      12</pre>
<p>Réfléchis aux touches à utiliser pour aller vite, et à comment corriger une faute.</p>`,
    questions: [
      { type: "qcm", q: "Pour remplir A1 puis B1 (même ligne), quelle touche après A1 ?", opts: ["Entrée", "Tab", "Échap", "Suppr"], a: 1, exp: "Tab passe à droite (B1) sans changer de ligne." },
      { type: "qcm", q: "Après avoir tapé B1 (Quantite), comment revenir facilement au début de la ligne 2 ?", opts: ["Ctrl + S", "Entrée (Excel revient souvent en A2 après un Tab)", "F2", "Ctrl + Z"], a: 1, exp: "Après avoir utilisé Tab sur une ligne, Entrée ramène au début de la ligne suivante." },
      { type: "input", q: "Tu as écrit « Ouefs » au lieu de « Oeufs » en A4. Quelle touche pour éditer sans tout retaper ?", a: "F2", ph: "une touche", exp: "F2 (ou double-clic) ouvre l'édition pour corriger juste les lettres inversées." },
      { type: "qcm", q: "Tu as tapé 21 au lieu de 12 en B4 et pas encore validé. Le plus simple ?", opts: ["Fermer le fichier", "Appuyer sur Échap puis retaper 12", "Ctrl + S", "Changer de feuille"], a: 1, exp: "Échap annule la saisie en cours ; on retape proprement 12." },
      { type: "input", q: "Une fois la liste finie, quel raccourci pour enregistrer le classeur ?", a: "Ctrl + S", ph: "ex : Ctrl + X", exp: "Ctrl + S enregistre. À faire régulièrement." }
    ],
    solution: `<p>Séquence de frappe efficace :</p>
<pre class="pseudo">A1: Article  [Tab]  Quantite  [Entree]     // ligne d'en-tetes
A2: Pain     [Tab]  2         [Entree]
A3: Lait     [Tab]  1         [Entree]
A4: Oeufs    [Tab]  12        [Entree]
Ctrl + S                                    // enregistrer</pre>
<p>Correction d'une faute : F2 (ou double-clic) pour éditer sans effacer, Échap pour annuler une saisie non validée, Ctrl + Z pour annuler une action déjà validée. Ces trois réflexes te sauveront tous les jours.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Décris ta manip dans Excel…",
  items: [
  { id: "excel-j02", title: "Saisir vite et corriger", level: 1,
    statement: "Dans une feuille vierge, saisis ce tableau en utilisant <strong>Tab</strong> pour avancer sur la ligne et <strong>Entrée</strong> pour changer de ligne. Ensuite, corrige la faute volontaire : remplace « Banae » par « Banane » en A4 <em>sans</em> retaper toute la cellule.<pre class=\"pseudo\">      A          B\n  1  Fruit      Prix\n  2  Pomme      0,50\n  3  Poire      0,80\n  4  Banae      0,40</pre>",
    hints: [
      "Sur chaque ligne : tape le fruit, appuie sur Tab, tape le prix, appuie sur Entrée.",
      "Pour corriger A4 sans tout effacer : double-clique dessus (ou touche F2) pour faire apparaître le curseur.",
      "Une fois le curseur dans la cellule, place-toi entre le « a » et le « e » et ajoute le « n » manquant : Banae -> Banane."
    ],
    solution: "Saisie :\nA1 Fruit [Tab] Prix [Entree]\nA2 Pomme [Tab] 0,50 [Entree]\nA3 Poire [Tab] 0,80 [Entree]\nA4 Banae [Tab] 0,40 [Entree]\n\nCorrection de A4 :\n1) Double-clic sur A4  (ou selectionne A4 puis F2).   // curseur dans la cellule\n2) Place le curseur pour obtenir : Banane.            // ajoute le n manquant\n3) Entree pour valider.                               // A4 affiche Banane\n\nResultat attendu : A4 = Banane, les prix inchanges.",
    note: "N'oublie pas : un simple clic + saisie EFFACE tout le contenu. Pour corriger une partie, il faut passer en mode edition avec F2 ou un double-clic." }
  ]
};
</script>
