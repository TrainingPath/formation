<script>
var DAY = {
  num: 3,
  title: "Sélectionner : cellules, lignes, colonnes, plages",
  subtitle: "Choisir sur quoi on va agir : la base avant toute mise en forme ou tout calcul.",
  theory: `
<h3>1. Pourquoi sélectionner ?</h3>
<p><strong>Sélectionner</strong>, c'est désigner à Excel les cellules sur lesquelles on veut agir (colorier, calculer, effacer…). Analogie : avant de peindre un mur, on choisit d'abord la zone à peindre. Rien ne se passe tant qu'on n'a pas dit « c'est ICI ».</p>
<h3>2. Le mot clé du jour : la plage</h3>
<p>Une <strong>plage</strong> est un rectangle de plusieurs cellules qui se touchent. On l'écrit avec la cellule du <em>coin haut-gauche</em>, deux-points, et la cellule du <em>coin bas-droite</em>. Le <strong>deux-points</strong> se lit « jusqu'à ».</p>
<pre class="pseudo">B2:D5      // la plage : toutes les cellules du rectangle de B2 JUSQU'A D5
   B2      le coin en haut a gauche
   D5      le coin en bas a droite
   :       veut dire "jusqu'a" (toutes les cases entre les deux coins)</pre>
<pre class="pseudo">      A     B     C     D
  2        [B2                  ]     // plage B2:D5 =
  3        [                    ]     // 3 colonnes (B,C,D)
  4        [                    ]     // x 4 lignes (2,3,4,5)
  5        [                 D5 ]     // = 12 cellules</pre>
<div class="tip">Une plage est TOUJOURS un rectangle plein. On ne peut pas décrire un « L » avec une seule plage ; il faudrait alors une sélection multiple (voir plus bas).</div>
<h3>3. Sélectionner à la souris</h3>
<pre class="pseudo">Clic sur une cellule                 // selectionne 1 cellule
Clic-glisse d'un coin a l'autre       // selectionne une plage rectangulaire
Clic sur la lettre de colonne (A)     // selectionne TOUTE la colonne
Clic sur le numero de ligne (3)       // selectionne TOUTE la ligne
Clic sur le carre coin (au-dessus de 1, a gauche de A)   // toute la feuille</pre>
<h3>4. Sélectionner au clavier</h3>
<p>On maintient <strong>Maj</strong> (Shift) en se déplaçant : la sélection s'étend.</p>
<pre class="pseudo">Maj + fleches            // etend la selection cellule par cellule
Maj + clic               // selectionne du point de depart jusqu'au clic
Ctrl + Maj + fleche      // etend jusqu'au bord des donnees (tres rapide)
Ctrl + A                 // selectionne tout le bloc de donnees (puis toute la feuille)</pre>
<h3>5. Sélection multiple : la touche Ctrl</h3>
<p>Pour choisir plusieurs zones qui ne se touchent pas, on maintient <strong>Ctrl</strong> pendant qu'on clique/glisse chaque zone. Utile pour colorier A1, C1 et E1 en une fois.</p>
<pre class="pseudo">Clic A1  ->  Ctrl+clic C3  ->  Ctrl+clic E5   // 3 cellules eparpillees selectionnees ensemble</pre>
<div class="warn">Une plage s'écrit avec deux-points (<code>A1:A10</code>). Le point-virgule (<code>A1;C1</code>) sert à lister des cellules <em>séparées</em> dans une formule. Ne les confonds pas : « : » = un bloc continu ; « ; » = une liste d'éléments distincts.</div>
<h3>6. Compter les cellules d'une plage</h3>
<p>Nombre de cellules = (nombre de colonnes) × (nombre de lignes). Pour <code>B2:D5</code> : colonnes B,C,D = 3 ; lignes 2,3,4,5 = 4 ; donc 3 × 4 = <strong>12</strong> cellules.</p>`,
  exercises: [
    { type: "input", q: "Comment s'écrit la plage allant de A1 jusqu'à A10 ?", a: "A1:A10", ph: "ex : B2:C4", exp: "Coin haut-gauche, deux-points, coin bas-droite : A1:A10." },
    { type: "qcm", q: "Le symbole « : » dans une plage veut dire…", opts: ["« et »", "« jusqu'à »", "« ou »", "« moins »"], a: 1, exp: "A1:A10 se lit « de A1 jusqu'à A10 ». Le deux-points relie deux coins." },
    { type: "input", q: "Combien de cellules contient la plage B2:D5 ?", a: "12", ph: "un nombre", exp: "3 colonnes (B,C,D) × 4 lignes (2,3,4,5) = 12." },
    { type: "qcm", q: "Comment sélectionner toute une colonne d'un coup ?", opts: ["Cliquer sur sa lettre en haut", "Cliquer sur A1", "Appuyer sur Entrée", "Double-cliquer une cellule"], a: 0, exp: "Un clic sur la lettre d'en-tête sélectionne la colonne entière." },
    { type: "qcm", q: "Comment sélectionner toute une ligne ?", opts: ["Cliquer sur sa lettre", "Cliquer sur son numéro à gauche", "Ctrl + S", "Appuyer sur Tab"], a: 1, exp: "Un clic sur le numéro à gauche sélectionne la ligne entière." },
    { type: "qcm", q: "Une plage est toujours…", opts: ["une seule cellule", "un rectangle plein de cellules qui se touchent", "une colonne uniquement", "en forme de L"], a: 1, exp: "Une plage est un bloc rectangulaire continu." },
    { type: "qcm", q: "Quelle touche maintient-on pour ÉTENDRE une sélection avec les flèches ?", opts: ["Ctrl", "Maj (Shift)", "Alt", "Tab"], a: 1, exp: "Maj + flèches agrandit la sélection à partir de la cellule active." },
    { type: "qcm", q: "Quelle touche maintient-on pour sélectionner plusieurs zones séparées ?", opts: ["Maj", "Ctrl", "Alt", "Entrée"], a: 1, exp: "Ctrl + clics ajoute des zones non contiguës à la sélection." },
    { type: "vf", q: "A1;C1 (avec un point-virgule) décrit un bloc continu de cellules.", a: false, exp: "Le « ; » liste des cellules séparées. Un bloc continu s'écrit avec « : » (A1:C1)." },
    { type: "input", q: "Combien de cellules dans la plage A1:C1 ?", a: "3", ph: "un nombre", exp: "3 colonnes (A,B,C) × 1 ligne = 3 cellules." },
    { type: "qcm", q: "Ctrl + Maj + Flèche du bas, dans une liste remplie, sert à…", opts: ["Effacer la colonne", "Sélectionner d'un coup jusqu'au bas des données", "Insérer une ligne", "Changer de feuille"], a: 1, exp: "Combo rapide pour sélectionner toute une colonne de données en un geste." },
    { type: "qcm", q: "Où cliquer pour sélectionner toute la feuille d'un coup ?", opts: ["Sur A1", "Sur le petit carré au-dessus du 1 et à gauche du A", "Sur le numéro 1", "Sur la lettre A"], a: 1, exp: "Le carré du coin (intersection en-têtes) sélectionne toute la feuille ; Ctrl + A aussi." },
    { type: "input", q: "Combien de cellules contient la plage C3:E3 ?", a: "3", ph: "un nombre", exp: "3 colonnes (C,D,E) × 1 ligne = 3." },
    { type: "vf", q: "Sélectionner est utile avant de colorier, calculer ou effacer un groupe de cellules.", a: true, exp: "On désigne d'abord la zone, puis on applique l'action dessus." },
    { type: "input", q: "Écris la plage qui couvre les colonnes A à C et les lignes 1 à 4.", a: "A1:C4", ph: "ex : B2:D5", exp: "Coin A1 jusqu'au coin C4 : A1:C4 (3 × 4 = 12 cellules)." }
  ],
  final: {
    title: "Exercice final — Décrire des sélections",
    intro: `<p>Voici une feuille avec des notes d'élèves :</p>
<pre class="pseudo">      A          B        C        D
  1  Eleve      Maths    Anglais  Sport
  2  Ali        14       12       16
  3  Bea        9        15       11
  4  Chris      17       8        13
  5  Dora       11       13       15</pre>
<p>Réponds en repérant colonnes (lettres) et lignes (numéros).</p>`,
    questions: [
      { type: "input", q: "Écris la plage qui contient TOUTES les notes de Maths (sans l'en-tête).", a: "B2:B5", ph: "ex : B2:B5", exp: "Colonne B (Maths), lignes 2 à 5 : B2:B5." },
      { type: "input", q: "Écris la plage qui contient toutes les notes de l'élève Bea (les 3 matières).", a: "B3:D3", ph: "ex : B3:D3", exp: "Ligne 3 (Bea), colonnes B à D : B3:D3." },
      { type: "input", q: "Écris la plage de TOUTES les notes chiffrées (les 4 élèves, les 3 matières, sans en-têtes ni noms).", a: "B2:D5", ph: "ex : B2:D5", exp: "De B2 (haut-gauche des notes) à D5 (bas-droite) : B2:D5." },
      { type: "input", q: "Combien de cellules contient cette plage de notes B2:D5 ?", a: "12", ph: "un nombre", exp: "3 colonnes × 4 lignes = 12 notes." },
      { type: "qcm", q: "Tu veux sélectionner d'un coup les colonnes Maths, Anglais et Sport en entier. Que faire ?", opts: ["Cliquer sur B, puis Ctrl+clic sur C et D... ou glisser sur les lettres B à D", "Taper B2:D5", "Appuyer sur Entrée", "Ctrl + Z"], a: 0, exp: "Glisser sur les en-têtes B, C, D (ou Ctrl+clics) sélectionne les 3 colonnes entières." }
    ],
    solution: `<p>Repère toujours le coin haut-gauche et le coin bas-droite de la zone voulue :</p>
<pre class="pseudo">Notes de Maths     -> colonne B, lignes 2 a 5   -> B2:B5   (4 cellules)
Notes de Bea       -> ligne 3, colonnes B a D    -> B3:D3   (3 cellules)
Toutes les notes   -> B2 (coin) a D5 (coin)      -> B2:D5   (12 cellules)</pre>
<p>Retiens : une plage = deux coins reliés par « : ». Savoir décrire une plage est indispensable, car toutes les fonctions (SOMME, MOYENNE…) travaillent sur des plages, dès le jour 9.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {

  { id: "excel-j03", title: "Sélectionner les bonnes zones", level: 1,
    statement: "Recopie ce tableau, puis réalise ces sélections dans Excel : (a) toute la colonne des prix (colonne B entière), (b) uniquement la plage des trois prix chiffrés, (c) les deux cellules A1 et A4 ensemble (non contiguës).<pre class=\"pseudo\">      A          B\n  1  Article    Prix\n  2  Stylo      1,20\n  3  Cahier     2,50\n  4  Gomme      0,80</pre>",

    ],
    solution: "Manips :\n(a) Colonne des prix : clic sur la lettre B (en-tete de colonne).   // toute la colonne B selectionnee\n(b) Plage des prix chiffres : clic sur B2, glisse jusqu'a B4.      // plage B2:B4 (3 cellules)\n    -> a l'ecrit, cette plage se note B2:B4\n       B2  coin haut-gauche\n       B4  coin bas-droite\n       :   veut dire jusqu'a\n(c) A1 et A4 ensemble : clic sur A1, puis Ctrl+clic sur A4.        // selection multiple non contigue\n\nResultat attendu : tu sais isoler une colonne entiere, une plage precise (B2:B4) et des cellules eparpillees.",
    note: "Piege classique : ecrire B2:B3 alors que les prix descendent jusqu'a B4. Compte bien tes lignes avant de valider une plage." }
  ]
};
</script>
