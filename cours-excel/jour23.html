var DAY = {
  num: 23,
  title: "Les tableaux croisés dynamiques : découverte",
  subtitle: "Résumer des centaines de lignes en un clic, sans formule.",
  theory: `
<h3>1. C'est quoi un tableau croisé dynamique ?</h3>
<p>Un <strong>tableau croisé dynamique</strong> (souvent abrégé « TCD ») est un outil qui <strong>résume</strong> automatiquement une grande liste : il regroupe les lignes et calcule des totaux, sans que tu écrives la moindre formule. Analogie : tu as un panier de 500 tickets de caisse en vrac ; le TCD te rend en 3 secondes le total dépensé par magasin et par mois, joliment rangé.</p>
<p>« Dynamique » parce que tu peux réorganiser le résumé en <strong>glissant des champs</strong> à la souris, et le voir se recalculer instantanément.</p>
<div class="tip">Le mot <strong>champ</strong> désigne simplement une colonne de tes données source (ex. « Ville », « Vendeur », « Montant »). Chaque en-tête de colonne devient un champ.</div>
<h3>2. Les données de départ : une liste propre</h3>
<p>Un TCD a besoin d'une <strong>liste bien tenue</strong> : une ligne d'en-têtes, puis une ligne par enregistrement, sans trous ni cellules fusionnées.</p>
<pre class="pseudo">      A          B         C
1   Vendeur    Ville     Montant     // ligne d'en-têtes = les futurs champs
2   Alice      Paris     1200        // un enregistrement par ligne
3   Bruno      Lyon      800
4   Alice      Lyon      600</pre>
<div class="warn">Pas de ligne vide, pas de cellule fusionnée, un seul en-tête par colonne : c'est la condition n°1 pour un TCD sain.</div>
<h3>3. Créer le TCD</h3>
<pre class="pseudo">1. Clique une cellule de la liste
2. Ruban ▸ Insertion ▸ Tableau croisé dynamique
3. Excel propose la plage et « Nouvelle feuille de calcul » ▸ OK
4. Une feuille vide s'ouvre avec, à droite, le volet « Champs de tableau croisé dynamique »</pre>
<h3>4. Les 4 zones magiques</h3>
<p>À droite, le volet liste tes champs en haut, et 4 zones en bas où les déposer :</p>
<pre class="pseudo">Lignes    : ce qui devient les lignes du résumé (ex. Ville)         // regroupe verticalement
Colonnes  : ce qui devient les colonnes (ex. Vendeur)              // regroupe horizontalement
Valeurs   : ce qu'on calcule (ex. Somme de Montant)               // le chiffre au croisement
Filtres   : un filtre global au-dessus du tableau (ex. par année)  // filtre l'ensemble</pre>
<p>Exemple : glisse <strong>Ville</strong> dans <em>Lignes</em> et <strong>Montant</strong> dans <em>Valeurs</em> → tu obtiens instantanément le total des montants par ville.</p>
<h3>5. Somme, moyenne, nombre… au choix</h3>
<p>Par défaut, un champ numérique déposé dans <em>Valeurs</em> est <strong>additionné</strong> (« Somme de Montant »). Clique dessus ▸ <code>Paramètres des champs de valeurs</code> pour choisir Moyenne, Nombre, Max, Min…</p>
<div class="warn">Si Excel écrit « Nombre de Montant » au lieu de « Somme », c'est souvent qu'une cellule de la colonne contient du texte ou un vide. Nettoie la colonne source.</div>
<h3>6. Actualiser après un changement</h3>
<p>Un TCD ne se met PAS à jour tout seul quand tu modifies les données source. Il faut l'<strong>actualiser</strong> :</p>
<pre class="pseudo">Clic droit dans le TCD ▸ Actualiser        // recalcule à partir des données à jour
// ou : Analyse du tableau croisé dynamique ▸ Actualiser</pre>
<div class="tip">Bonus 365 : le bouton <strong>Analyser des données</strong> (Accueil) propose des TCD tout prêts par intelligence intégrée. Il n'existe pas dans 2019 ; la création manuelle (points 3-4) fonctionne partout.</div>`,
  exercises: [
    { type: "qcm", q: "Un tableau croisé dynamique sert à :", opts: ["Dessiner un graphique", "Résumer automatiquement une grande liste", "Protéger la feuille", "Trier une colonne"], a: 1, exp: "Le TCD regroupe et calcule des totaux sans formule." },
    { type: "qcm", q: "Un 'champ' dans un TCD, c'est :", opts: ["Une formule de calcul", "Une colonne des données source", "Un graphique", "Une feuille"], a: 1, exp: "Chaque en-tête de colonne devient un champ." },
    { type: "vf", q: "Un TCD oblige à écrire des formules compliquées.", a: false, exp: "Justement non : on glisse des champs, aucune formule à taper." },

    { type: "qcm", q: "La zone 'Lignes' du volet sert à :", opts: ["Calculer un total", "Définir ce qui regroupe verticalement (ex. Ville)", "Filtrer", "Colorer"], a: 1, exp: "Les valeurs de ce champ deviennent les lignes du résumé." },
    { type: "qcm", q: "La zone 'Valeurs' contient :", opts: ["Ce qu'on calcule (ex. Somme de Montant)", "Les titres", "Les couleurs", "Les filtres"], a: 0, exp: "C'est le chiffre affiché au croisement." },
    { type: "vf", q: "Une liste avec des lignes vides et des cellules fusionnées est idéale pour un TCD.", a: false, exp: "Au contraire : il faut une liste propre, sans trous ni fusions." },

    { type: "qcm", q: "Pour passer de Somme à Moyenne :", opts: ["Paramètres des champs de valeurs", "Trier", "Filtrer", "Ctrl + S"], a: 0, exp: "Clic sur le champ ▸ Paramètres des champs de valeurs." },
    { type: "qcm", q: "Si le TCD affiche 'Nombre de Montant' au lieu de 'Somme', c'est souvent que :", opts: ["La colonne source contient du texte ou des vides", "Le fichier est corrompu", "Excel est en anglais", "Il faut imprimer"], a: 0, exp: "Un texte parasite empêche la somme ; nettoie la colonne." },
    { type: "vf", q: "Un TCD se met à jour automatiquement quand on change les données source.", a: false, exp: "Il faut l'Actualiser (clic droit ▸ Actualiser)." },
    { type: "qcm", q: "Pour recalculer un TCD après modification des données :", opts: ["Clic droit ▸ Actualiser", "Le supprimer", "Trier", "Enregistrer le classeur"], a: 0, exp: "Actualiser relit les données source." },
    { type: "qcm", q: "La zone 'Filtres' d'un TCD :", opts: ["Filtre l'ensemble du tableau (ex. par année)", "Calcule une somme", "Trie", "Colore"], a: 0, exp: "Un filtre global s'ajoute au-dessus du TCD." },
    { type: "vf", q: "Le bouton 'Analyser des données' existe dans 365 mais pas dans Office 2019.", a: true, exp: "La création manuelle du TCD marche partout ; ce bouton est récent." },
    { type: "qcm", q: "Pour un total du Montant par Ville, on glisse :", opts: ["Ville dans Lignes et Montant dans Valeurs", "Montant dans Lignes et Ville dans Valeurs", "Tout dans Filtres", "Ville dans Filtres et Montant dans Lignes"], a: 0, exp: "Ville regroupe les lignes, Montant est additionné dans Valeurs." }
  ],
  final: {
    title: "Exercice final — Le total des ventes par ville",
    intro: `<p>Une liste de ventes :</p>
<pre class="pseudo">      A          B         C
1   Vendeur    Ville     Montant
2   Alice      Paris     1200
3   Bruno      Lyon      800
4   Alice      Lyon      600
5   Bruno      Paris     400
6   Alice      Paris     300</pre>
<p>On veut un TCD donnant le <strong>total des Montants par Ville</strong>.</p>`,
    questions: [
      { type: "qcm", q: "Première étape ?", opts: ["Cliquer une cellule de la liste puis Insertion ▸ Tableau croisé dynamique", "Trier par ville", "Faire un graphique", "Imprimer"], a: 0, exp: "On lance le TCD depuis une cellule de la liste." },
      { type: "qcm", q: "Quel champ mettre dans Lignes ?", opts: ["Montant", "Ville", "Vendeur", "Aucun"], a: 1, exp: "Ville regroupe le résumé par ville." },
      { type: "qcm", q: "Quel champ mettre dans Valeurs ?", opts: ["Ville", "Vendeur", "Montant (en Somme)", "Montant (en Nombre)"], a: 2, exp: "Somme de Montant est le calcul voulu." },
      { type: "input", q: "Quel total obtient-on pour Paris (1200 + 400 + 300) ?", a: "1900", ph: "nombre", exp: "1200 + 400 + 300 = 1900." },
      { type: "input", q: "Quel total obtient-on pour Lyon (800 + 600) ?", a: "1400", ph: "nombre", exp: "800 + 600 = 1400." }
    ],
    solution: `<p><strong>Marche à suivre :</strong></p>
<pre class="pseudo">1. Clique une cellule de la liste (ex. A2)
2. Insertion ▸ Tableau croisé dynamique ▸ Nouvelle feuille ▸ OK
3. Dans le volet à droite :
   - glisse « Ville »   dans la zone Lignes

<p><strong>Résultat :</strong></p>
<pre class="pseudo">Ville        Somme de Montant
Lyon         1400
Paris        1900
Total        3300</pre>
<p>Aucune formule écrite : le TCD a regroupé les 5 lignes par ville et additionné les montants. Si tu changes une valeur source, fais un clic droit ▸ <strong>Actualiser</strong> pour mettre le résumé à jour.</p>`
  }
};
</script>
