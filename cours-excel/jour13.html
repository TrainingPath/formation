<script>
var DAY = {
  num: 13,
  title: "Compter et sommer sous condition : NB.SI, SOMME.SI",
  subtitle: "Ne compter ou n'additionner que les lignes qui remplissent un critère.",
  theory: `
<h3>1. L'idée : compter/additionner « seulement si »</h3>
<p>Hier, SI décidait pour une cellule. Aujourd'hui, on veut compter ou additionner sur toute une colonne, mais <strong>seulement les lignes qui respectent un critère</strong> : « combien de ventes à Paris ? », « total des dépenses supérieures à 100 € ? ». Deux fonctions font ça : <strong>NB.SI</strong> et <strong>SOMME.SI</strong>.</p>
<h3>2. NB.SI : compter selon un critère</h3>
<pre class="pseudo">=NB.SI(plage ; critere)
   NB.SI(...)   compte les cellules qui respectent le critere
   plage        la zone ou l'on cherche
   critere      la condition (un texte, un nombre, ou une comparaison)</pre>
<pre class="pseudo">=NB.SI(B2:B10 ; "Paris")     // combien de cellules valent exactement "Paris"
=NB.SI(B2:B10 ; ">100")      // combien de valeurs sont superieures a 100
=NB.SI(B2:B10 ; A1)          // combien valent le contenu de A1</pre>
<div class="tip">Un critère de comparaison va entre <strong>guillemets</strong> : <code>">100"</code>, <code>"<=50"</code>, <code>"<>0"</code>. Un texte aussi : <code>"Paris"</code>. Un simple nombre peut s'écrire sans guillemets : <code>NB.SI(B2:B10;100)</code>.</div>
<h3>3. SOMME.SI : additionner selon un critère</h3>
<p><strong>SOMME.SI</strong> additionne des valeurs, mais uniquement sur les lignes qui remplissent le critère. Elle a souvent <strong>trois</strong> arguments : la plage où on teste le critère, le critère, et la plage des nombres à additionner.</p>
<pre class="pseudo">=SOMME.SI(plage_critere ; critere ; plage_a_sommer)
   plage_critere   la zone ou l'on verifie la condition (ex : les villes)
   critere         la condition (ex : "Paris")
   plage_a_sommer  la zone des nombres a additionner (ex : les montants)</pre>
<pre class="pseudo">=SOMME.SI(B2:B10 ; "Paris" ; C2:C10)
   B2:B10   colonne des villes (ou l'on cherche "Paris")
   "Paris"  le critere
   C2:C10   colonne des montants (ce qu'on additionne pour les lignes "Paris")</pre>
<div class="warn">Les deux plages doivent avoir la <strong>même hauteur</strong> et être alignées (même lignes). Si le critère porte directement sur les nombres à additionner, on peut n'utiliser que deux arguments : <code>=SOMME.SI(C2:C10 ; ">100")</code> additionne les montants eux-mêmes qui dépassent 100.</div>
<h3>4. Les jokers pour le texte</h3>
<p>Dans un critère texte, on peut utiliser des <strong>caractères génériques</strong> : <code>*</code> remplace n'importe quelle suite de caractères, <code>?</code> remplace un seul caractère.</p>
<pre class="pseudo">=NB.SI(A2:A10 ; "A*")       // compte les mots qui COMMENCENT par A
=NB.SI(A2:A10 ; "*son")     // compte ceux qui FINISSENT par "son"
=NB.SI(A2:A10 ; "*") -> compte les cellules contenant du texte</pre>
<h3>5. Combiner avec un $ pour recopier</h3>
<p>Quand on fait un tableau récapitulatif (une ligne par ville, par exemple), on bloque souvent les plages en absolu avec F4 pour pouvoir recopier la formule sans que les plages ne se décalent.</p>
<pre class="pseudo">=SOMME.SI(\$B\$2:\$B\$10 ; E2 ; \$C\$2:\$C\$10)
   \$B\$2:\$B\$10   plages bloquees (ne bougent pas en recopiant)
   E2             le critere lu dans la ligne courante (relatif : suit)</pre>
<div class="tip">Cousines utiles (mêmes idées) : <strong>MOYENNE.SI</strong> fait une moyenne conditionnelle, et <strong>NB.SI.ENS / SOMME.SI.ENS</strong> gèrent plusieurs critères à la fois (disponibles depuis Excel 2007).</div>`,
  exercises: [
    { type: "qcm", q: "Que fait NB.SI(plage ; critère) ?", opts: ["Additionne la plage", "Compte les cellules qui respectent le critère", "Trie la plage", "Calcule une moyenne"], a: 1, exp: "NB.SI dénombre les cellules répondant à la condition." },
    { type: "qcm", q: "Que fait SOMME.SI ?", opts: ["Compte les cellules", "Additionne seulement les lignes qui remplissent un critère", "Trie", "Compte les vides"], a: 1, exp: "SOMME.SI additionne sous condition." },
    { type: "input", q: "Écris la formule qui compte les cellules valant « Paris » dans B2:B10.", a: "=NB.SI(B2:B10;\"Paris\")", ph: "=NB.SI(...)", exp: "=NB.SI(B2:B10;\"Paris\") : critère texte entre guillemets." },
    { type: "qcm", q: "Comment écrire un critère « supérieur à 100 » dans NB.SI ?", opts: [">100 sans guillemets", "\">100\" entre guillemets", "SUP(100)", "100+"], a: 1, exp: "Les critères de comparaison vont entre guillemets : \">100\"." },
    { type: "qcm", q: "Dans =SOMME.SI(B2:B10;\"Paris\";C2:C10), que représente C2:C10 ?", opts: ["la zone du critère", "la zone des nombres à additionner", "un texte", "rien"], a: 1, exp: "3e argument : la plage des montants à sommer pour les lignes « Paris »." },
    { type: "vf", q: "Dans SOMME.SI, la plage du critère et la plage à sommer doivent avoir la même hauteur.", a: true, exp: "Elles doivent être alignées ligne à ligne, sinon le calcul est faux." },
    { type: "qcm", q: "=SOMME.SI(C2:C10;\">100\") (deux arguments) additionne…", opts: ["toutes les cellules", "les valeurs de C2:C10 qui dépassent 100", "les cellules texte", "rien"], a: 1, exp: "Sans 3e argument, le critère s'applique à la plage elle-même." },
    { type: "qcm", q: "Le joker * dans un critère texte signifie…", opts: ["multiplication", "n'importe quelle suite de caractères", "un seul caractère", "un chiffre"], a: 1, exp: "* = n'importe quelle suite ; ? = un seul caractère." },
    { type: "qcm", q: "=NB.SI(A2:A10;\"A*\") compte…", opts: ["les cellules valant « A* »", "les mots commençant par A", "les mots finissant par A", "les cellules vides"], a: 1, exp: "A* = commence par A, suivi de n'importe quoi." },
    { type: "input", q: "Une colonne B2:B6 contient Paris, Lyon, Paris, Nice, Paris. Que renvoie =NB.SI(B2:B6;\"Paris\") ?", a: "3", ph: "un nombre", exp: "« Paris » apparaît trois fois." },
    { type: "input", q: "Montants C2:C6 = 50, 120, 80, 200, 90. Que renvoie =NB.SI(C2:C6;\">100\") ?", a: "2", ph: "un nombre", exp: "Seuls 120 et 200 dépassent 100 : deux valeurs." },
    { type: "input", q: "Mêmes montants (50,120,80,200,90). Que renvoie =SOMME.SI(C2:C6;\">100\") ?", a: "320", ph: "un nombre", exp: "120 + 200 = 320 (seules les valeurs > 100)." },
    { type: "vf", q: "Pour recopier un récapitulatif par ville, on bloque souvent les plages en absolu ($) avec F4.", a: true, exp: "Ainsi les plages restent fixes pendant que le critère (relatif) suit chaque ligne." },
    { type: "qcm", q: "Pour additionner avec PLUSIEURS critères à la fois, on utilise…", opts: ["SOMME.SI", "SOMME.SI.ENS", "SOMME", "NB"], a: 1, exp: "SOMME.SI.ENS (et NB.SI.ENS) gèrent plusieurs critères ; dispo depuis 2007." },
    { type: "qcm", q: "MOYENNE.SI sert à…", opts: ["compter", "faire une moyenne conditionnelle", "trier", "additionner sous condition"], a: 1, exp: "Même logique que SOMME.SI, mais pour la moyenne." }
  ],
  final: {
    title: "Exercice final — Ventes par ville",
    intro: `<p>Un commercial note ses ventes. On veut compter les ventes par ville et additionner les montants par ville.</p>
<pre class="pseudo">      A          B         C
  1  Vente      Ville     Montant
  2  V1         Paris     200
  3  V2         Lyon      150
  4  V3         Paris     300
  5  V4         Nice      100
  6  V5         Paris     250
  7  V6         Lyon      400</pre>`,
    questions: [
      { type: "input", q: "Combien de ventes à Paris ? Écris la formule (plage B2:B7).", a: "=NB.SI(B2:B7;\"Paris\")", ph: "=NB.SI(...)", exp: "=NB.SI(B2:B7;\"Paris\") → 3 (V1, V3, V5)." },
      { type: "input", q: "Combien vaut ce NB.SI pour Paris ?", a: "3", ph: "un nombre", exp: "Paris apparaît trois fois (V1, V3, V5)." },
      { type: "input", q: "Total des montants de Paris ? Écris la formule.", a: "=SOMME.SI(B2:B7;\"Paris\";C2:C7)", ph: "=SOMME.SI(...)", exp: "On teste la ville en B2:B7, on somme les montants C2:C7." },
      { type: "input", q: "Combien vaut ce total pour Paris ?", a: "750", ph: "un nombre", exp: "200 + 300 + 250 = 750." },
      { type: "input", q: "Combien de ventes dépassent 200 € ? =NB.SI(C2:C7;\">200\").", a: "3", ph: "un nombre", exp: "300, 250 et 400 dépassent 200 : trois ventes (200 pile n'est pas > 200)." }
    ],
    solution: `<p>NB.SI pour compter, SOMME.SI pour additionner, chacune avec le critère « Paris » :</p>
<pre class="pseudo">=NB.SI(B2:B7 ; "Paris")            -> 3    // V1, V3, V5
=SOMME.SI(B2:B7 ; "Paris" ; C2:C7) -> 750  // 200 + 300 + 250
   B2:B7   colonne des villes (ou l'on cherche "Paris")
   "Paris" le critere
   C2:C7   colonne des montants (ce qu'on additionne)
=NB.SI(C2:C7 ; ">200")             -> 3    // 300, 250, 400 (200 pile exclu)</pre>
<p>Pour un tableau récapitulatif (une ligne par ville), écris le nom de la ville en colonne E et remplace <code>"Paris"</code> par la cellule E2, en bloquant les plages B et C avec F4 pour pouvoir recopier.</p>`
  }
};
</script>
