<script>
var DAY = {
  num: 14,
  title: "RECHERCHEV et RECHERCHEX",
  subtitle: "Aller chercher automatiquement une info dans un tableau à partir d'une clé.",
  theory: `
<h3>1. Le besoin : retrouver une valeur associée</h3>
<p>Tu as un tableau « code produit → prix ». Ailleurs, tu tapes un code et tu veux que le prix apparaisse tout seul. C'est le rôle des fonctions de <strong>recherche</strong> : à partir d'une <strong>clé</strong> (le code), elles vont chercher la valeur associée (le prix) dans un tableau. Analogie : chercher un mot dans un dictionnaire pour lire sa définition.</p>
<h3>2. RECHERCHEV : la classique (toutes versions)</h3>
<p><strong>RECHERCHEV</strong> (« recherche verticale ») cherche une valeur dans la <em>première colonne</em> d'un tableau et renvoie une valeur située sur la <em>même ligne</em>, dans la colonne que tu indiques.</p>
<pre class="pseudo">=RECHERCHEV(valeur_cherchee ; tableau ; numero_colonne ; FAUX)
   valeur_cherchee   la cle a retrouver (ex : le code produit)
   tableau           la plage complete ou chercher (1re colonne = les cles)
   numero_colonne    le RANG de la colonne dont on veut la valeur (1, 2, 3...)
   FAUX              exige une correspondance EXACTE (a mettre presque toujours)</pre>
<pre class="pseudo">=RECHERCHEV(E2 ; \$A\$2:\$C\$10 ; 3 ; FAUX)
   E2              le code tape par l'utilisateur
   \$A\$2:\$C\$10   le tableau (bloque avec F4 pour recopier)
   3              on veut la 3e colonne du tableau (ex : le prix)
   FAUX           correspondance exacte</pre>
<div class="warn">Deux pièges majeurs de RECHERCHEV : (1) la clé DOIT être dans la <strong>1re colonne</strong> du tableau ; elle ne sait pas chercher « vers la gauche ». (2) le dernier argument : mets <strong>FAUX</strong> (exact). Avec VRAI (ou vide), elle fait une recherche approximative qui donne souvent des résultats faux.</div>
<h3>3. Le numéro de colonne, source d'erreurs</h3>
<p>Le 3e argument est un <strong>rang</strong> (1 = première colonne du tableau, 2 = deuxième…), pas une lettre de colonne. Si tu insères une colonne dans le tableau, ce numéro ne se met pas à jour : gare aux décalages.</p>
<h3>4. RECHERCHEX : la moderne (365 et 2021 seulement)</h3>
<p><strong>RECHERCHEX</strong> est la version récente, plus simple et plus souple. Elle prend la plage des clés et la plage des résultats <em>séparément</em>, donc elle peut chercher dans n'importe quel sens.</p>
<pre class="pseudo">=RECHERCHEX(valeur_cherchee ; plage_cles ; plage_resultats)
   valeur_cherchee  la cle a retrouver
   plage_cles       la colonne ou se trouvent les cles
   plage_resultats  la colonne dont on veut la valeur</pre>
<pre class="pseudo">=RECHERCHEX(E2 ; \$A\$2:\$A\$10 ; \$C\$2:\$C\$10)
   E2              le code cherche
   \$A\$2:\$A\$10   colonne des codes (les cles)
   \$C\$2:\$C\$10   colonne des prix (le resultat voulu)</pre>
<div class="tip">Avantages de RECHERCHEX : correspondance exacte <strong>par défaut</strong> (pas de FAUX à retenir), pas de numéro de colonne à compter, et elle peut chercher à gauche comme à droite. On peut aussi ajouter un 4e argument pour afficher un message si rien n'est trouvé.</div>
<div class="warn">IMPORTANT (versions) : <strong>RECHERCHEX n'existe qu'à partir d'Excel 2021 et dans Microsoft 365</strong>. Sur Excel 2019, 2016 ou plus ancien, elle n'est PAS disponible : utilise alors <strong>RECHERCHEV</strong> (avec FAUX). Si tu partages ton fichier avec quelqu'un sur une vieille version, préfère RECHERCHEV pour la compatibilité.</div>
<h3>5. Gérer l'absence de résultat</h3>
<p>Si la clé n'existe pas, RECHERCHEV renvoie l'erreur <code>#N/A</code> (« non disponible »). On peut l'habiller : avec RECHERCHEX, on met un 4e argument (le texte à afficher) ; avec RECHERCHEV, on l'entoure de SIERREUR (vu au fil du cours) : <code>=SIERREUR(RECHERCHEV(...) ; "Introuvable")</code>.</p>`,
  exercises: [
    { type: "qcm", q: "À quoi servent RECHERCHEV / RECHERCHEX ?", opts: ["À trier", "À retrouver une valeur associée à une clé dans un tableau", "À compter", "À colorier"], a: 1, exp: "On donne une clé, la fonction rapporte la valeur associée." },
    { type: "qcm", q: "Dans RECHERCHEV, la valeur cherchée doit se trouver…", opts: ["dans n'importe quelle colonne", "dans la 1re colonne du tableau", "dans la dernière colonne", "en dehors du tableau"], a: 1, exp: "RECHERCHEV cherche dans la première colonne du tableau uniquement." },
    { type: "qcm", q: "Le dernier argument de RECHERCHEV, pour une correspondance EXACTE, doit être…", opts: ["VRAI", "FAUX", "1", "vide"], a: 1, exp: "FAUX = exact. VRAI/vide = approximatif, souvent faux." },
    { type: "qcm", q: "Le 3e argument de RECHERCHEV (numéro de colonne) est…", opts: ["une lettre (A, B, C)", "un rang : 1 = 1re colonne du tableau, 2 = 2e…", "toujours 1", "une couleur"], a: 1, exp: "C'est un numéro d'ordre dans le tableau, pas une lettre." },
    { type: "input", q: "Écris une RECHERCHEV qui cherche E2 dans A2:C10 et renvoie la 3e colonne, exacte.", a: "=RECHERCHEV(E2;A2:C10;3;FAUX)", ph: "=RECHERCHEV(...)", exp: "=RECHERCHEV(E2;A2:C10;3;FAUX)." },
    { type: "qcm", q: "RECHERCHEX est disponible…", opts: ["dans toutes les versions", "à partir d'Excel 2021 et dans Microsoft 365 seulement", "seulement sur Mac", "jamais"], a: 1, exp: "RECHERCHEX est récente : 2021 et 365. Avant, on utilise RECHERCHEV." },
    { type: "qcm", q: "Sur Excel 2019, pour une recherche exacte, on utilise…", opts: ["RECHERCHEX", "RECHERCHEV avec FAUX", "rien, c'est impossible", "SOMME.SI"], a: 1, exp: "2019 n'a pas RECHERCHEX : RECHERCHEV(...;FAUX) est la solution." },
    { type: "vf", q: "RECHERCHEV ne sait pas chercher « vers la gauche » (la clé doit être à gauche des données à récupérer).", a: true, exp: "Limitation classique ; RECHERCHEX, elle, cherche dans les deux sens." },
    { type: "qcm", q: "Un avantage de RECHERCHEX sur RECHERCHEV ?", opts: ["Elle trie", "Correspondance exacte par défaut et pas de numéro de colonne à compter", "Elle colorie", "Elle est plus ancienne"], a: 1, exp: "Plus simple : plages séparées, exact par défaut, recherche bidirectionnelle." },
    { type: "qcm", q: "Que renvoie RECHERCHEV si la clé n'existe pas dans le tableau ?", opts: ["0", "#N/A (non disponible)", "une cellule vide", "VRAI"], a: 1, exp: "L'erreur #N/A signale que la valeur cherchée est introuvable." },
    { type: "qcm", q: "Pour afficher « Introuvable » au lieu de #N/A avec RECHERCHEV, on l'entoure de…", opts: ["SOMME", "SIERREUR", "NB.SI", "MAX"], a: 1, exp: "=SIERREUR(RECHERCHEV(...);\"Introuvable\") remplace l'erreur par un texte." },
    { type: "vf", q: "On bloque souvent le tableau de RECHERCHEV en absolu ($) pour pouvoir recopier la formule.", a: true, exp: "Sinon la plage se décalerait à chaque ligne recopiée." },
    { type: "input", q: "Écris une RECHERCHEX qui cherche E2 dans A2:A10 et renvoie C2:C10.", a: "=RECHERCHEX(E2;A2:A10;C2:C10)", ph: "=RECHERCHEX(...)", exp: "=RECHERCHEX(E2;A2:A10;C2:C10) : clé, plage des clés, plage des résultats." },
    { type: "qcm", q: "Danger du numéro de colonne dans RECHERCHEV : si on insère une colonne dans le tableau…", opts: ["le numéro se met à jour tout seul", "le numéro ne bouge pas et peut renvoyer la mauvaise colonne", "la formule s'efface", "rien ne change jamais"], a: 1, exp: "Le rang codé en dur ne suit pas l'insertion : source d'erreurs silencieuses." },
    { type: "qcm", q: "Pour partager un fichier avec une personne sous Excel 2016, mieux vaut utiliser…", opts: ["RECHERCHEX", "RECHERCHEV (compatible partout)", "peu importe", "aucune des deux"], a: 1, exp: "RECHERCHEX planterait chez elle ; RECHERCHEV assure la compatibilité." }
  ],
  final: {
    title: "Exercice final — Retrouver un prix par son code",
    intro: `<p>Un catalogue relie chaque code à un article et un prix. En E2, l'utilisateur tape un code ; on veut afficher le prix correspondant.</p>
<pre class="pseudo">      A        B          C          E        F
  1  Code     Article    Prix       Code ?   Prix
  2  P01      Casque     49         P03      (a calculer)
  3  P02      Clavier    29
  4  P03      Souris     15
  5  P04      Ecran      120</pre>
<p>La clé est en colonne A (les codes), le prix en colonne C.</p>`,
    questions: [
      { type: "input", q: "Avec RECHERCHEV : écris la formule en F2 (tableau A2:C5, prix = 3e colonne, exact).", a: "=RECHERCHEV(E2;A2:C5;3;FAUX)", ph: "=RECHERCHEV(...)", exp: "=RECHERCHEV(E2;A2:C5;3;FAUX)." },
      { type: "input", q: "Quel prix renvoie cette formule pour le code P03 ?", a: "15", ph: "un nombre", exp: "P03 correspond à Souris, prix 15." },
      { type: "input", q: "Avec RECHERCHEX (Excel 2021/365) : écris la formule équivalente en F2.", a: "=RECHERCHEX(E2;A2:A5;C2:C5)", ph: "=RECHERCHEX(...)", exp: "=RECHERCHEX(E2;A2:A5;C2:C5) : clé, plage codes, plage prix." },
      { type: "qcm", q: "L'utilisateur tape un code inexistant (P99). Que renvoie la RECHERCHEV simple ?", opts: ["0", "#N/A", "le dernier prix", "P99"], a: 1, exp: "Clé absente → erreur #N/A. On peut l'habiller avec SIERREUR." },
      { type: "qcm", q: "Ton collègue est sous Excel 2019. Quelle formule lui envoyer ?", opts: ["RECHERCHEX", "RECHERCHEV avec FAUX", "aucune", "les deux à la fois"], a: 1, exp: "2019 n'a pas RECHERCHEX ; RECHERCHEV est compatible." }
    ],
    solution: `<p>Deux écritures pour le même résultat, selon ta version :</p>
<pre class="pseudo">RECHERCHEV (toutes versions) :
=RECHERCHEV(E2 ; \$A\$2:\$C\$5 ; 3 ; FAUX)
   E2              le code cherche (P03)
   \$A\$2:\$C\$5   le tableau (cles en 1re colonne), bloque avec F4
   3              la 3e colonne du tableau = le Prix
   FAUX           correspondance exacte
-> renvoie 15

RECHERCHEX (Excel 2021 / 365 uniquement) :
=RECHERCHEX(E2 ; \$A\$2:\$A\$5 ; \$C\$2:\$C\$5)
   plages des cles et des prix separees ; exact par defaut
-> renvoie 15</pre>
<p>Retiens la règle de version : RECHERCHEX seulement à partir de 2021/365 ; sinon RECHERCHEV(...;FAUX). Et pense à FAUX (exact) et au blocage des plages avec F4 pour recopier.</p>`
  }
};
</script>
