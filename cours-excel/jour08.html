<script>
var DAY = {
  num: 8,
  title: "Références relatives et absolues (le rôle du $)",
  subtitle: "Pourquoi une formule recopiée se décale, et comment « bloquer » une cellule avec le $.",
  theory: `
<h3>1. Le problème que le $ résout</h3>
<p>Quand tu recopies une formule vers le bas ou le côté, ses références se <strong>décalent</strong> toutes seules. C'est souvent ce qu'on veut… mais pas toujours. Le signe <strong>$</strong> (dollar) sert à <em>bloquer</em> une référence pour qu'elle ne bouge pas pendant la recopie.</p>
<h3>2. Référence relative (par défaut)</h3>
<p>Une référence <strong>relative</strong> est une adresse normale, sans $ (ex. <code>A1</code>). Excel la comprend comme une <em>direction</em> (« la cellule juste à gauche »), pas comme une adresse fixe. Donc quand on recopie, elle suit le mouvement.</p>
<pre class="pseudo">En C2 : =A2*B2         // recopie vers le bas en C3...
En C3 elle devient : =A3*B3      // les references ont suivi (relatif)
En C4 : =A4*B4                    // chaque ligne calcule avec SA propre ligne</pre>
<div class="tip">Le relatif est génial : on écrit UNE formule et on la recopie sur 1000 lignes, chacune s'adaptant à sa ligne. C'est le fonctionnement normal.</div>
<h3>3. Référence absolue : bloquer avec le $</h3>
<p>Une référence <strong>absolue</strong> est verrouillée avec des $ (ex. <code>\$A\$1</code>). Elle pointe TOUJOURS vers la même cellule, même recopiée partout. Le $ se lit « bloqué ».</p>
<pre class="pseudo">\$A\$1        // colonne bloquee ET ligne bloquee : ne bouge jamais
   \$A       le \$ devant le A bloque la COLONNE
   \$1       le \$ devant le 1 bloque la LIGNE</pre>
<p>Cas typique : un taux de TVA ou un taux de change rangé dans une seule cellule, réutilisé sur toutes les lignes.</p>
<pre class="pseudo">      A          B              C
  1  Taux       0,2
  2  Montant    Formule TVA
  3  100        =A3*\$B\$1        // A3 relatif (suit) ; \$B\$1 bloque le taux
  4  200        =A4*\$B\$1        // en recopiant : A3->A4 change, mais \$B\$1 reste fige
  5  300        =A5*\$B\$1</pre>
<div class="warn">Sans le $ sur le taux, en recopiant vers le bas la référence B1 deviendrait B2, B3… (des cellules vides ou fausses) et le calcul serait ruiné. C'est LE piège classique.</div>
<h3>4. La touche magique F4</h3>
<p>Pas besoin de taper les $ à la main. Pendant la saisie d'une formule, clique sur une référence (ou place le curseur dessus) et appuie sur <strong>F4</strong> : Excel ajoute/enlève les $ en tournant sur 4 états.</p>
<pre class="pseudo">Reference tapee : B1
F4 (1 fois)  -> \$B\$1     // tout bloque (absolu)
F4 (2 fois)  -> B\$1      // seule la LIGNE bloquee (mixte)
F4 (3 fois)  -> \$B1      // seule la COLONNE bloquee (mixte)
F4 (4 fois)  -> B1        // retour au relatif</pre>
<h3>5. Références mixtes (aperçu)</h3>
<p>On peut bloquer seulement la ligne (<code>B\$1</code>) ou seulement la colonne (<code>\$B1</code>). Utile pour les tables à double entrée (comme une table de multiplication), où l'en-tête de colonne et l'en-tête de ligne se croisent. On approfondira au besoin ; pour l'instant, retiens surtout le duo relatif / absolu.</p>
<div class="tip">Méthode sûre : écris ta formule pour la 1re ligne, réfléchis « qu'est-ce qui doit rester fixe si je recopie ? », mets un $ (via F4) sur ces éléments-là, PUIS recopie.</div>`,
  exercises: [
    { type: "qcm", q: "À quoi sert le signe $ dans une référence ?", opts: ["À afficher des euros", "À bloquer (verrouiller) une référence lors de la recopie", "À multiplier", "À colorier"], a: 1, exp: "Le $ empêche la référence de se décaler quand on recopie la formule." },
    { type: "qcm", q: "Une référence SANS $ (ex. A1) est dite…", opts: ["absolue", "relative", "fixe", "verrouillée"], a: 1, exp: "Relative : elle se décale quand on recopie la formule." },
    { type: "input", q: "Comment écrit-on une référence à la cellule A1 totalement bloquée (absolue) ?", a: "$A$1", ph: "ex : $X$9", exp: "$A$1 : un $ devant la colonne et un devant la ligne." },
    { type: "input", q: "Quelle touche ajoute/enlève les $ pendant la saisie d'une formule ?", a: "F4", ph: "une touche", exp: "F4 fait tourner la référence entre relatif, absolu et mixtes." },
    { type: "qcm", q: "=A2*B2 en C2, recopiée en C3, devient…", opts: ["=A2*B2", "=A3*B3", "=A2*B3", "=$A$2*$B$2"], a: 1, exp: "Relatif : tout se décale d'une ligne vers le bas." },
    { type: "qcm", q: "=A3*$B$1 recopiée d'une ligne vers le bas devient…", opts: ["=A4*$B$2", "=A4*$B$1", "=A3*$B$1", "=$A$4*$B$1"], a: 1, exp: "A3 (relatif) devient A4 ; $B$1 (absolu) reste $B$1." },
    { type: "vf", q: "Une référence relative se comporte comme une direction (« la case à gauche »), pas comme une adresse figée.", a: true, exp: "C'est pour ça qu'elle suit le mouvement lors de la recopie." },
    { type: "qcm", q: "Un taux unique rangé en B1, réutilisé sur 100 lignes : comment le référencer ?", opts: ["B1 (relatif)", "$B$1 (absolu) pour qu'il ne bouge pas", "B$1 seulement", "peu importe"], a: 1, exp: "En absolu $B$1, il reste pointé sur le taux quelle que soit la ligne." },
    { type: "qcm", q: "Après F4 appuyé une fois sur B1, on obtient…", opts: ["B1", "$B$1", "B$1", "$B1"], a: 1, exp: "1er F4 = tout bloqué : $B$1." },
    { type: "qcm", q: "B$1 signifie…", opts: ["tout bloqué", "seule la ligne 1 est bloquée (colonne libre)", "seule la colonne B est bloquée", "rien de bloqué"], a: 1, exp: "Le $ devant le 1 bloque la ligne ; la colonne B reste relative." },
    { type: "qcm", q: "$B1 signifie…", opts: ["tout bloqué", "seule la colonne B est bloquée (ligne libre)", "seule la ligne est bloquée", "rien de bloqué"], a: 1, exp: "Le $ devant le B bloque la colonne ; la ligne 1 reste relative." },
    { type: "vf", q: "Oublier le $ sur un taux partagé fait pointer la formule recopiée vers des cellules vides plus bas.", a: true, exp: "C'est le bug classique : B1 devient B2, B3… et le calcul se casse." },
    { type: "input", q: "=A5*$B$1 recopiée d'une ligne vers le bas : écris la nouvelle formule.", a: "=A6*$B$1", ph: "ex : =A7*$B$1", exp: "A5→A6 (relatif) ; $B$1 reste bloqué." },
    { type: "qcm", q: "Bonne méthode de travail ?", opts: ["Recopier puis corriger 100 formules", "Écrire la 1re formule, bloquer avec F4 ce qui doit rester fixe, PUIS recopier", "Ne jamais recopier", "Taper chaque formule à la main"], a: 1, exp: "On pense au verrouillage AVANT de recopier : gain de temps énorme." },
    { type: "qcm", q: "Combien d'états F4 propose-t-il en boucle pour une référence ?", opts: ["2", "3", "4", "8"], a: 2, exp: "4 : absolu, ligne bloquée, colonne bloquée, relatif, puis ça reboucle." }
  ],
  final: {
    title: "Exercice final — Convertir des prix avec un taux",
    intro: `<p>On convertit des prix en euros vers une autre monnaie. Le taux de change est rangé une seule fois, en B1. On veut une formule recopiable sur toute la colonne.</p>
<pre class="pseudo">      A          B
  1  Taux       1,1
  2  Prix EUR   Prix converti
  3  100        =A3*$B$1
  4  50         =A4*$B$1
  5  200        =A5*$B$1</pre>
<p>Le taux 1,1 doit rester fixe pour toutes les lignes.</p>`,
    questions: [
      { type: "input", q: "Que vaut B3 (=A3*$B$1) ?", a: "110", ph: "un nombre", exp: "100 × 1,1 = 110." },
      { type: "input", q: "Que vaut B5 (=A5*$B$1) ?", a: "220", ph: "un nombre", exp: "200 × 1,1 = 220." },
      { type: "qcm", q: "Pourquoi $B$1 et pas B1 dans ces formules ?", opts: ["Pour afficher un symbole", "Pour que le taux reste bloqué et ne se décale pas en recopiant", "Pour aller plus vite", "Aucune raison"], a: 1, exp: "En relatif, B1 deviendrait B2, B3… (vides) : le calcul serait faux." },
      { type: "qcm", q: "Si on avait écrit =A3*B1 (sans $) puis recopié en B4, la formule deviendrait…", opts: ["=A4*B1 (correct)", "=A4*B2 (faux : pointe une cellule vide)", "=A3*B1", "=$A$4*$B$2"], a: 1, exp: "Sans blocage, B1 se décale en B2 : erreur classique." },
      { type: "input", q: "On change le taux : B1 passe à 1,2. Que devient B3 automatiquement ?", a: "120", ph: "un nombre", exp: "100 × 1,2 = 120 : toutes les lignes se recalculent, car elles pointent le même $B$1." }
    ],
    solution: `<p>Une seule formule à écrire en B3, puis à recopier vers le bas :</p>
<pre class="pseudo">B3 =A3*\$B\$1
   A3       relatif : suit la ligne (100, puis 50, puis 200)
   *        multiplication
   \$B\$1    absolu : reste toujours pointe sur le taux (F4 pour poser les \$)
Recopie B3 -> B4 -> B5 :
B4 =A4*\$B\$1   // A3 est devenu A4 ; le taux n'a pas bouge
B5 =A5*\$B\$1</pre>
<p>Le réflexe à ancrer : ce qui est <strong>partagé par toutes les lignes</strong> (un taux, un total de référence) se met en <strong>absolu</strong> avec F4 ; ce qui <strong>change à chaque ligne</strong> reste relatif.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris tes formules et où les placer…",
  items: [
  { id: "excel-j08", title: "Une remise unique sur toute une liste", level: 2,
    statement: "Recopie ce tableau. Le taux de remise est en B1 (une seule case). Écris en C4 une formule qui calcule le prix après remise, puis recopie-la jusqu'en C6. La formule doit garder le taux bloqué.<pre class=\"pseudo\">      A          B\n  1  Remise     0,3\n  2\n  3  Article    Prix        (colonne C : Prix apres remise)\n  4  Casque     50\n  5  Clavier    30\n  6  Souris     20</pre>",
    hints: [
      "Prix après remise = prix × (1 − taux). Le taux se lit en B1 pour toutes les lignes.",
      "En C4, commence par =B4*(1-B1). Puis clique sur B1 dans la barre de formule et appuie sur F4 pour le bloquer en $B$1.",
      "Une fois C4 correcte avec le $ sur le taux, recopie-la vers C5 et C6 avec la poignée : seul le prix (B4→B5→B6) doit se décaler."
    ],
    solution: "En C4 (prix apres remise du casque), tape :\n=B4*(1-$B$1)        // prix moins la remise\n   B4        le prix de l'article (relatif : suivra la ligne)\n   *         multiplication\n   (1-$B$1)  garde 70 % du prix si remise = 0,3 ; $B$1 = taux BLOQUE avec F4\n-> C4 = 50 * (1 - 0,3) = 50 * 0,7 = 35\n\nRecopie C4 vers C5 et C6 (poignee de recopie) :\nC5 =B5*(1-$B$1)  -> 30 * 0,7 = 21\nC6 =B6*(1-$B$1)  -> 20 * 0,7 = 14\n\nResultat attendu : C4=35, C5=21, C6=14. Le taux $B$1 reste fige sur les trois lignes.",
    note: "Bloque la plage/cellule du taux avec F4 AVANT de recopier. Sans le $, B1 deviendrait B2 puis B3 (des cases vides) et les prix seraient faux : c'est le piege numero un du chapitre." }
  ]
};
