<script>
var DAY = {
  num: 24,
  title: "Tableaux croisés dynamiques : regrouper et calculer",
  subtitle: "Croiser deux critères, grouper des dates, afficher des pourcentages.",
  theory: `
<h3>1. Rappel express</h3>
<p>Hier tu as construit un TCD simple (Ville en Lignes, Somme de Montant en Valeurs). Aujourd'hui on va plus loin : <strong>croiser deux critères</strong>, <strong>grouper</strong> des dates, changer le <strong>calcul</strong> et afficher des <strong>pourcentages</strong>.</p>
<h3>2. Croiser deux critères (Lignes ET Colonnes)</h3>
<p>Le « croisé » du nom vient de là : mets un champ en <em>Lignes</em> et un autre en <em>Colonnes</em>, et le TCD calcule la valeur à chaque <strong>croisement</strong>.</p>
<pre class="pseudo">Lignes   : Ville        // une ligne par ville
Colonnes : Vendeur      // une colonne par vendeur
Valeurs  : Somme de Montant   // le total au croisement ville × vendeur
// résultat : un vrai tableau à double entrée, comme une grille de bataille navale</pre>
<h3>3. Grouper des dates (par mois, trimestre, année)</h3>
<p>Si un champ contient des <strong>dates</strong>, on peut les regrouper pour ne pas avoir 365 lignes. Fais un clic droit sur une date dans le TCD :</p>
<pre class="pseudo">Clic droit sur une date ▸ Grouper…
▸ coche Mois, Trimestres, Années (plusieurs à la fois possible)
// les ventes du 3 et du 17 janvier se cumulent en « janv. »</pre>
<div class="tip">Excel 365 groupe souvent les dates par mois automatiquement dès qu'on pose le champ. Dans 2019, il faut parfois le faire à la main via « Grouper ».</div>
<h3>4. Grouper des nombres par tranches</h3>
<p>Même principe pour des nombres : clic droit sur une valeur ▸ <code>Grouper</code> ▸ définis un début, une fin et un pas (ex. tranches de 100). Utile pour un histogramme d'âges ou de montants.</p>
<h3>5. Changer le calcul : Somme, Moyenne, Nombre</h3>
<pre class="pseudo">Clic sur le champ dans Valeurs ▸ Paramètres des champs de valeurs
▸ onglet « Synthèse des valeurs par » ▸ Somme / Moyenne / Nombre / Max / Min
// Nombre = combien de lignes ; Moyenne = valeur moyenne, etc.</pre>
<h3>6. Afficher en pourcentage</h3>
<p>Même boîte, mais onglet <strong>« Afficher les valeurs »</strong> : choisis « % du total général » pour voir la part de chaque case plutôt que le montant brut.</p>
<pre class="pseudo">Paramètres des champs de valeurs ▸ Afficher les valeurs ▸ « % du total général »
// Paris 1900 sur 3300 → affiché « 57,58 % »</pre>
<h3>7. Trier et filtrer dans le TCD</h3>
<p>Les flèches sur les en-têtes du TCD trient (du plus grand total au plus petit, par ex.). Pour ne garder que certaines valeurs, décoche-les dans ces mêmes menus, ou utilise un <strong>segment</strong> : <code>Analyse du TCD ▸ Insérer un segment</code> ajoute des boutons cliquables pour filtrer visuellement.</p>
<div class="warn">Après toute modification des données source, pense à <strong>Actualiser</strong> (clic droit ▸ Actualiser). Le TCD ne se recalcule pas seul.</div>`,
  exercises: [
    { type: "qcm", q: "Pour croiser deux critères dans un TCD :", opts: ["Un champ en Lignes, un autre en Colonnes", "Deux champs en Valeurs", "Tout en Filtres", "Deux champs en Lignes"], a: 0, exp: "Le croisement Lignes × Colonnes crée un tableau à double entrée." },
    { type: "qcm", q: "Le mot 'croisé' vient de :", opts: ["Du croisement de deux fichiers différents", "Du croisement Lignes × Colonnes", "Du tri", "Du filtre"], a: 1, exp: "La valeur s'affiche au croisement des deux critères." },
    { type: "qcm", q: "Pour regrouper des dates par mois :", opts: ["Clic droit sur une date ▸ Grouper", "Trier", "Supprimer", "Filtrer"], a: 0, exp: "Grouper propose Mois, Trimestres, Années." },
    { type: "vf", q: "On peut grouper à la fois par mois ET par année.", a: true, exp: "Plusieurs niveaux de regroupement sont possibles en même temps." },
    { type: "qcm", q: "Pour grouper des nombres par tranches de 100 :", opts: ["Clic droit sur une valeur ▸ Grouper (début, fin, pas)", "Trier", "Filtrer", "Créer une colonne calculée dans la source"], a: 0, exp: "On définit début, fin et pas dans la boîte Grouper." },
    { type: "qcm", q: "Pour afficher une Moyenne au lieu d'une Somme :", opts: ["Paramètres des champs de valeurs ▸ Synthèse par ▸ Moyenne", "Trier", "Filtrer", "Ctrl + S"], a: 0, exp: "L'onglet Synthèse des valeurs par change le calcul." },
    { type: "qcm", q: "'Nombre' dans Valeurs affiche :", opts: ["Le total additionné", "Combien de lignes correspondent", "La moyenne", "Le maximum"], a: 1, exp: "Nombre = comptage des lignes du groupe." },
    { type: "qcm", q: "Pour afficher chaque case en % du total :", opts: ["Afficher les valeurs ▸ % du total général", "Trier", "Grouper", "Insérer un segment"], a: 0, exp: "L'onglet Afficher les valeurs propose % du total général." },
    { type: "input", q: "Paris = 1900 sur un total de 3300. Quel pourcentage arrondi à l'unité ?", a: "58", ph: "nombre sans %", exp: "1900 / 3300 ≈ 57,58 %, soit 58 % arrondi." },
    { type: "qcm", q: "Un 'segment' dans un TCD sert à :", opts: ["Calculer", "Filtrer visuellement avec des boutons", "Grouper", "Trier"], a: 1, exp: "Analyse du TCD ▸ Insérer un segment ajoute des boutons de filtre." },
    { type: "vf", q: "Le TCD se recalcule tout seul après modification des données.", a: false, exp: "Il faut Actualiser (clic droit ▸ Actualiser)." },
    { type: "qcm", q: "Trier un TCD du plus grand total au plus petit se fait :", opts: ["Via les flèches sur les en-têtes du TCD", "En retapant les données", "En supprimant des lignes", "Données ▸ Trier sur la feuille source"], a: 0, exp: "Les menus de tri sont sur les en-têtes du TCD." },
    { type: "qcm", q: "Excel 365 par rapport à 2019 pour grouper des dates :", opts: ["365 groupe souvent par mois automatiquement", "365 ne sait pas grouper", "Aucune différence de comportement", "2019 est plus automatique"], a: 0, exp: "365 propose souvent le regroupement mensuel d'emblée." },
    { type: "vf", q: "Un même champ ne peut jamais servir à la fois de Lignes et de Colonnes.", a: true, exp: "On croise deux champs DIFFÉRENTS ; un même champ occupe une seule zone." },
    { type: "qcm", q: "Pour ne garder que certains vendeurs dans le TCD :", opts: ["Les décocher dans le menu de l'en-tête, ou un segment", "Supprimer la source", "Changer de fichier", "Trier les vendeurs par ordre alphabétique"], a: 0, exp: "On filtre par le menu de l'en-tête ou un segment." }
  ],
  final: {
    title: "Exercice final — Croiser ville et vendeur",
    intro: `<p>On reprend la liste des ventes :</p>
<pre class="pseudo">      A          B         C
1   Vendeur    Ville     Montant
2   Alice      Paris     1200
3   Bruno      Lyon      800
4   Alice      Lyon      600
5   Bruno      Paris     400
6   Alice      Paris     300</pre>
<p>On veut un TCD croisant <strong>Ville (Lignes)</strong> et <strong>Vendeur (Colonnes)</strong>, avec la <strong>Somme des Montants</strong> au croisement.</p>`,
    questions: [
      { type: "qcm", q: "Quel champ en Colonnes ?", opts: ["Montant", "Vendeur", "Ville", "Aucun"], a: 1, exp: "Vendeur devient les colonnes du tableau croisé." },
      { type: "input", q: "Total pour Alice à Paris (1200 + 300) ?", a: "1500", ph: "nombre", exp: "1200 + 300 = 1500 au croisement Paris × Alice." },
      { type: "input", q: "Total pour Bruno à Lyon ?", a: "800", ph: "nombre", exp: "Une seule vente : 800." },
      { type: "input", q: "Total général de tout le TCD ?", a: "3300", ph: "nombre", exp: "1200+800+600+400+300 = 3300." },
      { type: "qcm", q: "Pour afficher chaque case en % du total général :", opts: ["Paramètres des champs de valeurs ▸ Afficher les valeurs ▸ % du total général", "Trier", "Grouper", "Segment"], a: 0, exp: "L'onglet Afficher les valeurs propose ce mode." }
    ],
    solution: `<p><strong>Construire le tableau croisé :</strong></p>
<pre class="pseudo">1. Clique la liste ▸ Insertion ▸ Tableau croisé dynamique ▸ OK
2. Volet à droite :
   - Ville   ▸ zone Lignes
   - Vendeur ▸ zone Colonnes
   - Montant ▸ zone Valeurs (Somme de Montant)</pre>
<p><strong>Résultat :</strong></p>
<pre class="pseudo">              Alice   Bruno   Total
Lyon          600     800     1400
Paris         1500    400     1900
Total         2100    1200    3300</pre>
<p>Chaque case est le total au croisement ville × vendeur. Alice-Paris = 1200 + 300 = 1500.</p>
<p><strong>En pourcentage :</strong> clique le champ dans Valeurs ▸ Paramètres des champs de valeurs ▸ Afficher les valeurs ▸ « % du total général ». Alice-Paris devient 1500/3300 ≈ 45,5 %.</p>`
  }
};
</script>
