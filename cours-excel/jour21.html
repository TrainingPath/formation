<script>
var DAY = {
  num: 21,
  title: "Créer un graphique",
  subtitle: "Transformer des chiffres en image parlante.",
  theory: `
<h3>1. Pourquoi un graphique ?</h3>
<p>Un <strong>graphique</strong> est une représentation visuelle de tes données : des barres, une courbe, un camembert… Analogie : un chiffre te dit « 1200 », un graphique te fait <em>voir</em> d'un coup d'œil que c'est deux fois plus que le voisin. Le graphique est <strong>lié</strong> aux cellules : change une valeur, il se redessine tout seul.</p>
<h3>2. La méthode en 3 clics</h3>
<pre class="pseudo">1. Sélectionne les données AVEC leurs en-têtes (ex. A1:B7)
2. Ruban ▸ Insertion ▸ (groupe Graphiques) ▸ choisis un type
3. Le graphique apparaît sur la feuille, déplaçable et redimensionnable</pre>
<div class="tip">Astuce 365 / 2021/2019 : <code>Insertion ▸ Graphiques recommandés</code> propose les types les plus adaptés à tes données. Idéal quand on hésite.</div>
<h3>3. Choisir le bon type</h3>
<ul>
<li><strong>Histogramme (colonnes)</strong> : comparer des quantités entre catégories (ventes par mois). Le plus courant.</li>
<li><strong>Barres</strong> : comme l'histogramme mais horizontal, pratique pour de longs libellés.</li>
<li><strong>Courbe (ligne)</strong> : montrer une évolution dans le temps (température jour après jour).</li>
<li><strong>Secteurs (camembert)</strong> : montrer des parts d'un tout (répartition d'un budget). À réserver à peu de catégories.</li>
</ul>
<div class="warn">Le camembert n'a de sens que si les parts forment un tout à 100 % (un budget, des votes). Pour comparer des mois entre eux, préfère l'histogramme.</div>
<h3>4. Comprendre le vocabulaire</h3>
<pre class="pseudo">Série de données : un ensemble de valeurs (ex. la colonne « Ventes »)   // ce qui est tracé
Catégories (axe horizontal) : les étiquettes (ex. les mois)            // l'axe du bas
Axe vertical : l'échelle des valeurs                                    // l'axe de gauche
Légende : la petite liste qui dit quelle couleur = quelle série        // le repère des couleurs</pre>
<h3>5. Déplacer, redimensionner, supprimer</h3>
<p>Un graphique est un <strong>objet flottant</strong> posé sur la feuille : clique-le et glisse-le pour le déplacer, tire ses coins pour le redimensionner, appuie sur <strong>Suppr</strong> pour l'effacer. Pour le mettre sur sa propre feuille : <code>Création de graphique ▸ Déplacer le graphique ▸ Nouvelle feuille</code>.</p>
<h3>6. Les deux onglets qui apparaissent</h3>
<p>Quand un graphique est sélectionné, deux onglets contextuels apparaissent :</p>
<ul>
<li><strong>Création de graphique</strong> : changer le type, les couleurs, la disposition, échanger lignes/colonnes.</li>
<li><strong>Format</strong> : régler l'apparence fine (contours, effets).</li>
</ul>
<div class="tip">On personnalise tout cela en détail au jour 22. Aujourd'hui, l'essentiel : sélectionner les bonnes données et choisir le bon type.</div>`,
  exercises: [
    { type: "qcm", q: "Un graphique sert à :", opts: ["Calculer plus vite", "Représenter visuellement des données", "Trier les lignes", "Protéger la feuille"], a: 1, exp: "Il transforme des chiffres en image parlante." },
    { type: "vf", q: "Si je change une valeur, le graphique se met à jour tout seul.", a: true, exp: "Le graphique est lié aux cellules sources." },
    { type: "qcm", q: "Où se trouvent les boutons de graphique ?", opts: ["Onglet Insertion", "Onglet Données", "Onglet Révision", "Onglet Fichier"], a: 0, exp: "Ruban ▸ Insertion ▸ groupe Graphiques." },
    { type: "qcm", q: "Pour comparer les ventes de 12 mois, quel type ?", opts: ["Camembert", "Histogramme (colonnes)", "Un seul secteur", "Aucun"], a: 1, exp: "L'histogramme compare bien des catégories." },
    { type: "qcm", q: "Pour montrer une évolution de température jour après jour :", opts: ["Camembert", "Courbe (ligne)", "Barres empilées", "Secteurs"], a: 1, exp: "La courbe illustre une évolution dans le temps." },
    { type: "qcm", q: "Le camembert convient pour :", opts: ["Comparer 12 mois", "Montrer les parts d'un tout (100 %)", "Une évolution", "Deux tableaux"], a: 1, exp: "Secteurs = répartition d'un ensemble en parts." },
    { type: "qcm", q: "Avant d'insérer, il faut :", opts: ["Sélectionner les données avec leurs en-têtes", "Enregistrer", "Imprimer", "Trier"], a: 0, exp: "La sélection (données + en-têtes) sert de source au graphique." },
    { type: "qcm", q: "Une 'série de données' est :", opts: ["Une étiquette d'axe", "Un ensemble de valeurs tracées (ex. la colonne Ventes)", "La légende", "Le titre"], a: 1, exp: "La série, ce sont les valeurs mesurées." },
    { type: "qcm", q: "Les 'catégories' correspondent le plus souvent :", opts: ["À l'axe horizontal (les étiquettes)", "À l'axe vertical", "À la légende", "Au titre"], a: 0, exp: "Les catégories sont sur l'axe du bas (ex. les mois)." },
    { type: "qcm", q: "La légende sert à :", opts: ["Trier les données", "Dire quelle couleur correspond à quelle série", "Calculer un total", "Imprimer"], a: 1, exp: "Elle relie couleurs et séries." },
    { type: "vf", q: "Un graphique peut être déplacé et redimensionné sur la feuille.", a: true, exp: "C'est un objet flottant : glisser pour déplacer, coins pour redimensionner." },
    { type: "qcm", q: "Pour supprimer un graphique :", opts: ["Le sélectionner et appuyer sur Suppr", "Fermer le fichier", "Trier", "Filtrer"], a: 0, exp: "Sélection puis touche Suppr." },
    { type: "qcm", q: "'Graphiques recommandés' :", opts: ["N'existe pas", "Propose les types adaptés aux données", "Supprime les données", "Imprime le graphique"], a: 1, exp: "Insertion ▸ Graphiques recommandés aide à choisir." },
    { type: "vf", q: "Quand un graphique est sélectionné, l'onglet 'Création de graphique' apparaît.", a: true, exp: "Deux onglets contextuels : Création de graphique et Format." },
    { type: "qcm", q: "Pour mettre le graphique sur sa propre feuille :", opts: ["Création de graphique ▸ Déplacer le graphique ▸ Nouvelle feuille", "Le copier", "Insertion ▸ Tableau", "Impossible"], a: 0, exp: "Déplacer le graphique ▸ Nouvelle feuille lui donne une feuille dédiée." }
  ],
  final: {
    title: "Exercice final — Les ventes trimestrielles",
    intro: `<p>Les ventes par trimestre :</p>
<pre class="pseudo">      A            B
1   Trimestre    Ventes
2   T1           1200
3   T2           1800
4   T3           900
5   T4           2100</pre>
<p>On veut un <strong>histogramme</strong> comparant les 4 trimestres, puis se demander quel type conviendrait pour montrer la <strong>part</strong> de chaque trimestre dans l'année.</p>`,
    questions: [
      { type: "qcm", q: "Quelle plage sélectionner ?", opts: ["B2:B5", "A1:B5", "A2:A5", "B1"], a: 1, exp: "Données + en-têtes : A1:B5." },
      { type: "qcm", q: "Quel type pour comparer les 4 trimestres ?", opts: ["Camembert", "Histogramme", "Courbe unique", "Aucun"], a: 1, exp: "L'histogramme compare des catégories." },
      { type: "input", q: "Quel trimestre aura la barre la plus haute ?", a: "T4", ph: "T1/T2/T3/T4", exp: "T4 = 2100, la valeur maximale." },
      { type: "input", q: "Quel trimestre aura la barre la plus courte ?", a: "T3", ph: "T1/T2/T3/T4", exp: "T3 = 900, la plus faible." },
      { type: "qcm", q: "Pour montrer la PART de chaque trimestre dans le total annuel :", opts: ["Un camembert (secteurs)", "Une courbe", "Un histogramme", "Aucun graphique"], a: 0, exp: "Les secteurs montrent des parts d'un tout (ici l'année)." }
    ],
    solution: `<p><strong>Créer l'histogramme :</strong></p>
<pre class="pseudo">1. Sélectionne A1:B5 (avec les en-têtes)
2. Ruban ▸ Insertion ▸ Histogramme ▸ « Histogramme groupé »
   (ou Insertion ▸ Graphiques recommandés, qui propose l'histogramme)
3. Le graphique apparaît : 4 barres, une par trimestre
4. Déplace-le sous le tableau en le faisant glisser</pre>
<p>Les barres montrent d'un coup d'œil : T4 domine (2100), T3 est le plus bas (900).</p>
<p><strong>Pour la part de chacun :</strong> même sélection, mais <code>Insertion ▸ Secteurs (camembert)</code>. Chaque part = un trimestre rapporté au total annuel (1200+1800+900+2100 = 6000). T4 représente 2100/6000 = 35 % du camembert.</p>`
  }
};
</script>
