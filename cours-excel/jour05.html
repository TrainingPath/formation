<script>
var DAY = {
  num: 5,
  title: "Mettre en forme les cellules",
  subtitle: "Habiller les données : police, couleurs, bordures, nombres, € et %, sans changer les valeurs.",
  theory: `
<h3>1. Forme vs contenu</h3>
<p><strong>Mettre en forme</strong>, c'est changer l'<em>apparence</em> d'une cellule (couleur, gras, format du nombre) sans toucher à sa <em>valeur</em>. Analogie : c'est habiller une personne ; en dessous, c'est toujours la même personne. Une cellule qui affiche « 12,00 € » contient toujours le nombre 12 et se calcule normalement.</p>
<div class="tip">La plupart des boutons de mise en forme sont dans <code>Ruban ▸ Accueil</code>, regroupés en sections : Police, Alignement, Nombre.</div>
<h3>2. Police, gras, couleurs</h3>
<pre class="pseudo">Ruban - Accueil - Police       // choisir la police et la taille
Ctrl + G   -> Gras             // (B/Bold) met en gras
Ctrl + I   -> Italique         // penche le texte
Ctrl + U   -> Souligne         // souligne
Bouton Couleur de police (un A) // couleur du texte
Bouton Couleur de remplissage (pot de peinture)  // couleur du fond de la cellule</pre>
<h3>3. Aligner et fusionner</h3>
<pre class="pseudo">Ruban - Accueil - Alignement
  gauche / centre / droite     // position horizontale du contenu
  haut / milieu / bas          // position verticale
  Renvoyer a la ligne          // fait tenir un long texte sur plusieurs lignes DANS la cellule
  Fusionner et centrer         // reunit plusieurs cellules en une seule (pour un titre)</pre>
<div class="warn">La <strong>fusion</strong> de cellules est jolie pour un titre, mais elle gêne le tri et certaines formules. À éviter dans une zone de données ; réserve-la aux titres.</div>
<h3>4. Les bordures</h3>
<p>Par défaut, le quadrillage gris de l'écran ne s'imprime pas. Pour tracer de vraies lignes, on ajoute des <strong>bordures</strong>.</p>
<pre class="pseudo">Ruban - Accueil - Police - bouton Bordures (petite grille) - fleche
  -> Toutes les bordures    dessine un cadre autour de chaque cellule
  -> Bordure exterieure     encadre juste le pourtour de la selection</pre>
<h3>5. Le format des NOMBRES (le plus important)</h3>
<p>Le <strong>format de nombre</strong> décide comment un nombre s'affiche, sans changer sa valeur réelle. Le nombre 0,25 peut s'afficher « 0,25 » ou « 25 % » : c'est le même nombre.</p>
<pre class="pseudo">Ruban - Accueil - section Nombre
  Bouton €        // format Monetaire : 1234  ->  1 234,00 EUR
  Bouton %        // format Pourcentage : 0,25  ->  25 %
  Bouton 000      // separateur de milliers : 1234  ->  1 234
  Fleches Ajouter/Reduire decimale  // change le nombre de chiffres apres la virgule</pre>
<div class="tip">Le % <strong>multiplie l'affichage par 100</strong> : tape 0,2 puis clique %, tu vois « 20 % ». Si tu veux voir 20 %, ne tape pas 20 mais 0,2 (ou tape 20% directement).</div>
<h3>6. La boîte complète et le pinceau</h3>
<pre class="pseudo">Ctrl + Maj + 1     // format nombre avec 2 decimales et separateur de milliers
Ctrl + 1           // ouvre la grande boite Format de cellule (tout est dedans)
Bouton Reproduire la mise en forme (pinceau)  // copie l'apparence d'une cellule vers une autre</pre>
<p>Le <strong>pinceau</strong> (Ruban ▸ Accueil ▸ Presse-papiers) copie uniquement l'habillage : clique la cellule modèle, clique le pinceau, puis « peins » les cellules à habiller pareil.</p>`,
  exercises: [
    { type: "vf", q: "Mettre en forme change l'apparence mais pas la valeur de la cellule.", a: true, exp: "12 affiché « 12,00 € » vaut toujours 12 et se calcule normalement." },
    { type: "input", q: "Quel raccourci met le texte en gras ?", a: "Ctrl + G", ph: "ex : Ctrl + X", exp: "Ctrl + G (Gras) en français ; c'est le B/Bold." },
    { type: "qcm", q: "Le bouton % appliqué au nombre 0,25 affiche…", opts: ["0,25 %", "25 %", "2,5 %", "250 %"], a: 1, exp: "Le format % multiplie l'affichage par 100 : 0,25 devient 25 %." },
    { type: "qcm", q: "Pour voir « 20 % », que faut-il taper dans la cellule ?", opts: ["20", "0,2 (ou 20%)", "2000", "0,02"], a: 1, exp: "0,2 formaté en % donne 20 %. Taper 20 puis % donnerait 2000 %." },
    { type: "qcm", q: "À quoi sert « Fusionner et centrer » ?", opts: ["Additionner des cellules", "Réunir plusieurs cellules en une seule (ex. un titre)", "Ajouter une bordure", "Colorier"], a: 1, exp: "La fusion réunit des cellules ; pratique pour un titre au-dessus d'un tableau." },
    { type: "vf", q: "La fusion de cellules est recommandée au milieu d'une zone de données.", a: false, exp: "Au contraire : elle gêne tri et formules. On la réserve aux titres." },
    { type: "qcm", q: "Le quadrillage gris à l'écran…", opts: ["s'imprime toujours", "ne s'imprime pas : il faut ajouter des bordures", "colorie les cellules", "est une erreur"], a: 1, exp: "Pour des lignes imprimées, on ajoute de vraies bordures." },
    { type: "input", q: "Quel raccourci ouvre la grande boîte « Format de cellule » ?", a: "Ctrl + 1", ph: "ex : Ctrl + X", exp: "Ctrl + 1 ouvre la boîte complète (nombre, police, bordure, remplissage…)." },
    { type: "qcm", q: "L'outil « pinceau » (Reproduire la mise en forme) copie…", opts: ["la valeur", "uniquement l'apparence (mise en forme)", "la formule", "la feuille entière"], a: 1, exp: "Le pinceau reporte l'habillage d'une cellule sur d'autres, sans copier le contenu." },
    { type: "qcm", q: "« Renvoyer à la ligne automatiquement » sert à…", opts: ["additionner", "faire tenir un long texte sur plusieurs lignes dans la cellule", "changer la couleur", "insérer une date"], a: 1, exp: "Le texte long passe à la ligne à l'intérieur de la même cellule au lieu de déborder." },
    { type: "qcm", q: "Où se trouvent la plupart des boutons de mise en forme ?", opts: ["Ruban ▸ Données", "Ruban ▸ Accueil", "Ruban ▸ Formules", "Zone Nom"], a: 1, exp: "L'onglet Accueil regroupe Police, Alignement et Nombre." },
    { type: "qcm", q: "Le format Monétaire (€) appliqué à 1234 peut afficher…", opts: ["1234", "1 234,00 €", "0,1234", "1234%"], a: 1, exp: "Le format € ajoute séparateur de milliers, décimales et le symbole, sans changer la valeur 1234." },
    { type: "input", q: "Quel raccourci met en italique ?", a: "Ctrl + I", ph: "ex : Ctrl + X", exp: "Ctrl + I applique l'italique." },
    { type: "vf", q: "Ajouter des décimales (0 → 0,00) modifie la vraie valeur du nombre.", a: false, exp: "Cela change seulement l'affichage ; la valeur stockée reste identique." },
    { type: "qcm", q: "Tu veux appliquer l'habillage de A1 à toute la plage A2:A10 rapidement. Le mieux ?", opts: ["Tout refaire à la main", "Utiliser le pinceau (Reproduire la mise en forme)", "Fusionner les cellules", "Changer de police"], a: 1, exp: "Le pinceau reporte instantanément la même mise en forme sur la plage." }
  ],
  final: {
    title: "Exercice final — Habiller un petit budget",
    intro: `<p>Voici un budget brut, saisi en nombres nus. On veut le rendre lisible sans changer les valeurs :</p>
<pre class="pseudo">      A            B
  1  BUDGET       (titre, a mettre en valeur)
  2  Loyer        750
  3  Courses      320
  4  Transport    60
  5  Taux epargne 0,15</pre>
<p>Objectif : titre centré et en gras, montants en euros, taux en pourcentage.</p>`,
    questions: [
      { type: "qcm", q: "Pour mettre le titre « BUDGET » en valeur au-dessus des deux colonnes, on peut…", opts: ["le supprimer", "sélectionner A1:B1 puis « Fusionner et centrer » et mettre en gras", "le mettre en italique seulement", "le déplacer en B5"], a: 1, exp: "Fusionner et centrer A1:B1 puis Ctrl + G donne un vrai titre." },
      { type: "qcm", q: "Pour afficher 750 comme « 750,00 € », on applique…", opts: ["le format Pourcentage", "le format Monétaire (bouton €)", "le gras", "une bordure"], a: 1, exp: "Le bouton € applique le format Monétaire, sans modifier la valeur 750." },
      { type: "qcm", q: "En B5, le taux 0,15 doit s'afficher « 15 % ». On clique…", opts: ["le bouton €", "le bouton %", "le pinceau", "Fusionner"], a: 1, exp: "Le format % multiplie l'affichage par 100 : 0,15 → 15 %." },
      { type: "vf", q: "Après avoir formaté B2 en euros, la valeur qui servira dans une somme est toujours 750.", a: true, exp: "Le format n'altère pas la valeur ; les calculs utilisent bien 750." },
      { type: "input", q: "Quel raccourci ouvre la boîte complète pour tout régler d'un coup (nombre, bordures, remplissage) ?", a: "Ctrl + 1", ph: "ex : Ctrl + X", exp: "Ctrl + 1 ouvre « Format de cellule », qui contient tous les onglets." }
    ],
    solution: `<p>Étapes de mise en forme (aucune valeur n'est modifiée) :</p>
<pre class="pseudo">1) Titre : selectionne A1:B1 -> Accueil -> Fusionner et centrer -> Ctrl+G (gras).
2) Montants : selectionne B2:B4 -> bouton € (format Monetaire).      // 750 -> 750,00 EUR
3) Taux : selectionne B5 -> bouton % .                              // 0,15 -> 15 %
4) (option) Bordures : selectionne A1:B5 -> Toutes les bordures.
5) (option) Pinceau pour reproduire un habillage d'une cellule a l'autre.</pre>
<p>Le budget est lisible et reste 100 % calculable : la mise en forme n'est qu'un habillage.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Décris ta manip dans Excel…",
  items: [
  { id: "excel-j05", title: "Rendre un tableau lisible", level: 2,
    statement: "Recopie ce tableau (nombres nus), puis mets-le en forme : en-têtes de la ligne 1 en gras avec un fond de couleur, prix de la colonne B au format euros avec 2 décimales, remise de la colonne C au format pourcentage, et un cadre (toutes les bordures) autour de l'ensemble.<pre class=\"pseudo\">      A          B        C\n  1  Article    Prix     Remise\n  2  Casque     49,9     0,1\n  3  Clavier    29       0,05\n  4  Souris     15,5     0,2</pre>",
    hints: [
      "Sélectionne d'abord la ligne d'en-têtes A1:C1, puis applique le gras (Ctrl + G) et une couleur de remplissage (pot de peinture).",
      "Pour les prix : sélectionne B2:B4, clique le bouton € ; règle les décimales avec les flèches « Ajouter/Réduire décimale ».",
      "Pour les remises : sélectionne C2:C4 et clique le bouton % ; 0,1 deviendra 10 %."
    ],
    solution: "Etapes :\n1) En-tetes : selectionne A1:C1 -> Ctrl+G (gras) -> bouton Couleur de remplissage (choisis une couleur).\n2) Prix en euros : selectionne B2:B4 -> Accueil - section Nombre - bouton € .   // 49,9 -> 49,90 EUR\n   - regle 2 decimales avec les fleches decimale si besoin.\n3) Remise en % : selectionne C2:C4 -> bouton % .                              // 0,1 -> 10 %, 0,05 -> 5 %, 0,2 -> 20 %\n4) Cadre : selectionne A1:C4 -> bouton Bordures - Toutes les bordures.\n\nResultat attendu :\n- ligne 1 en gras, sur fond colore\n- B2:B4 affichent 49,90 EUR / 29,00 EUR / 15,50 EUR\n- C2:C4 affichent 10 % / 5 % / 20 %\n- un quadrillage entoure tout le tableau.\nLes valeurs (49,9 ; 0,1 ; ...) restent inchangees : seul l'affichage change.",
    note: "Rappel du piege du % : 0,1 s'affiche 10 %. Si tu tapes 10 puis appliques %, tu obtiendrais 1000 %. Le format multiplie l'affichage par 100." }
  ]
};
</script>
