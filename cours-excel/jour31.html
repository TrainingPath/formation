<script>
var DAY = {
  num: 31,
  title: "Projet final : un tableau de bord complet",
  subtitle: "Assembler tout le cours en un vrai tableau de bord de ventes.",
  theory: `
<h3>1. Ce qu'on va construire</h3>
<p>Un <strong>tableau de bord</strong> (dashboard) est une page qui résume l'essentiel : quelques chiffres clés, un graphique, des filtres. On va assembler tout ce que tu as appris en 30 jours autour d'un cas concret : les ventes d'une petite boutique. C'est une <strong>synthèse</strong>, pas une nouvelle notion.</p>
<p>Plan du classeur :</p>
<pre class="pseudo">Feuille « Ventes »   : la liste brute (les données)          // jours 4, 20
Feuille « Synthèse » : les chiffres clés + un graphique      // jours 21-22
Un tableau croisé dynamique pour le détail par vendeur       // jours 23-24</pre>
<h3>2. Étape 1 — Des données propres en Tableau</h3>
<p>On met la liste sous forme de <strong>Tableau</strong> (grand T) nommé « Ventes » : filtres intégrés, extension automatique, formules lisibles.</p>
<pre class="pseudo">Sélectionne les données ▸ Ctrl+L ▸ en-têtes cochés
Création de tableau ▸ Nom du tableau : Ventes
Colonne calculée CA :  =[@Quantité]*[@PrixUnit]
// [@Quantité], [@PrixUnit] : les valeurs de la ligne courante ; recopie automatique</pre>
<h3>3. Étape 2 — Les indicateurs clés (KPI)</h3>
<p>Un <strong>indicateur clé</strong> (ou KPI) est un chiffre qui résume une information importante. On les calcule avec les fonctions des jours 9 à 16 :</p>
<pre class="pseudo">CA total     : =SOMME(Ventes[CA])                       // somme de la colonne CA du Tableau
Nb de ventes : =NBVAL(Ventes[Produit])                  // combien de lignes remplies
Panier moyen : =MOYENNE(Ventes[CA])                     // CA moyen par vente
CA de Paris  : =SOMME.SI(Ventes[Ville];"Paris";Ventes[CA])  // total CA quand Ville = Paris
Meilleure vente : =MAX(Ventes[CA])                      // la vente la plus élevée</pre>
<h3>4. Étape 3 — Un calcul sécurisé et lisible</h3>
<p>On combine plage nommée, SI et SIERREUR pour un indicateur robuste :</p>
<pre class="pseudo">=SIERREUR( SOMME.SI(Ventes[Ville];"Lyon";Ventes[CA]) / SOMME(Ventes[CA]) ; 0 )
// SOMME.SI(...) : le CA de Lyon
// / SOMME(Ventes[CA]) : divisé par le CA total → la part de Lyon
// SIERREUR(... ; 0) : si le total est 0 (aucune vente), affiche 0 au lieu de #DIV/0!</pre>
<h3>5. Étape 4 — Un graphique et un TCD</h3>
<pre class="pseudo">Graphique : sélectionne Ville + CA agrégés ▸ Insertion ▸ Histogramme (jours 21-22)
TCD       : Insertion ▸ Tableau croisé dynamique ▸ Vendeur en Lignes, Somme de CA en Valeurs (jours 23-24)</pre>
<h3>6. Étape 5 — Finitions</h3>
<ul>
<li><strong>Mise en forme conditionnelle</strong> (jour 17) : barres de données sur le CA pour repérer les grosses ventes.</li>
<li><strong>Validation</strong> (jour 25) : une liste déroulante pour choisir la ville d'un KPI dynamique.</li>
<li><strong>Protection</strong> (jour 27) : verrouille les cellules de formules, laisse la saisie libre.</li>
<li><strong>Mise en page</strong> (jour 28) : figer les volets, préparer l'impression du dashboard.</li>
</ul>
<div class="tip">Bonus 365 : le bouton <code>Accueil ▸ Analyser des données</code> propose automatiquement graphiques et tendances. Absent d'Office 2019 : sur cette version, construis le TCD et le graphique à la main (ce que tu sais faire maintenant !).</div>
<div class="warn">Après toute modification des données, pense à <strong>Actualiser</strong> le TCD (clic droit ▸ Actualiser). Les KPI en formule, eux, se recalculent seuls.</div>
<h3>7. Bravo</h3>
<p>Si tu réussis ce projet, tu maîtrises la boîte à outils Excel du quotidien : saisir, calculer, chercher, organiser, visualiser, analyser et fiabiliser. Le reste n'est que pratique. Félicitations pour ces 31 jours !</p>`,
  exercises: [
    { type: "qcm", q: "Un 'tableau de bord' (dashboard) est :", opts: ["Une seule formule", "Une page qui résume l'essentiel (chiffres clés, graphique, filtres)", "Un fichier protégé", "Un tri"], a: 1, exp: "Il synthétise les informations importantes en une vue." },
    { type: "qcm", q: "Un KPI (indicateur clé) est :", opts: ["Une mise en forme conditionnelle", "Un chiffre qui résume une information importante", "Un onglet", "Un filtre"], a: 1, exp: "Ex. CA total, panier moyen, nombre de ventes." },
    { type: "qcm", q: "=SOMME(Ventes[CA]) fait :", opts: ["La moyenne du CA", "La somme de la colonne CA du Tableau Ventes", "Le maximum", "Un tri"], a: 1, exp: "Ventes[CA] désigne toute la colonne CA du Tableau." },
    { type: "qcm", q: "Le panier moyen se calcule avec :", opts: ["=SOMME", "=MOYENNE(Ventes[CA])", "=MAX", "=NB.SI"], a: 1, exp: "La moyenne du CA par vente." },
    { type: "qcm", q: "=SOMME.SI(Ventes[Ville];\"Paris\";Ventes[CA]) renvoie :", opts: ["Le CA total", "Le CA seulement pour Paris", "Le nombre de villes", "Le maximum"], a: 1, exp: "Somme conditionnelle : CA quand Ville = Paris." },
    { type: "qcm", q: "Pourquoi envelopper une division dans SIERREUR ?", opts: ["Pour trier", "Pour éviter #DIV/0! si le dénominateur est 0", "Pour colorer", "Pour imprimer"], a: 1, exp: "SIERREUR renvoie une valeur de repli en cas d'erreur." },
    { type: "qcm", q: "La colonne calculée CA d'un Tableau s'écrit :", opts: ["=B2*C2 seulement", "=[@Quantité]*[@PrixUnit] et se recopie seule", "=SOMME(tout)", "=Quantité*PrixUnit sans les [@...]"], a: 1, exp: "Les noms de colonnes rendent la formule lisible et auto-recopiée." },
    { type: "qcm", q: "Pour le détail par vendeur, on utilise :", opts: ["Un tableau croisé dynamique", "Un tri", "Une mise en forme conditionnelle", "Une protection"], a: 0, exp: "TCD : Vendeur en Lignes, Somme de CA en Valeurs." },
    { type: "vf", q: "Après avoir modifié les données, il faut Actualiser le TCD.", a: true, exp: "Le TCD ne se recalcule pas seul ; les KPI en formule, si." },
    { type: "qcm", q: "Pour repérer visuellement les grosses ventes dans la colonne CA :", opts: ["Barres de données (mise en forme conditionnelle)", "Un tri Z→A obligatoire", "Une protection", "Une formule 3D"], a: 0, exp: "Les barres de données donnent un aperçu immédiat." },
    { type: "qcm", q: "Pour choisir une ville et voir son KPI se mettre à jour :", opts: ["Une liste déroulante (validation) + SOMME.SI", "Un graphique seul", "Un tri", "Une impression"], a: 0, exp: "La validation fournit le choix, SOMME.SI recalcule." },
    { type: "qcm", q: "Mettre la liste sous forme de Tableau apporte :", opts: ["Un tri automatique permanent", "Filtres intégrés, extension auto et formules lisibles", "Une protection automatique", "Un graphique"], a: 1, exp: "Autant d'atouts pour un dashboard vivant." },
    { type: "vf", q: "Le bouton 'Analyser des données' existe en 365 mais pas en Office 2019.", a: true, exp: "Sur 2019, on construit TCD et graphique manuellement." },
    { type: "qcm", q: "=MAX(Ventes[CA]) donne :", opts: ["Le nombre de ventes", "La vente la plus élevée", "La moyenne", "Le total"], a: 1, exp: "Le plus grand CA de la colonne." },
    { type: "qcm", q: "Protéger le dashboard sert à :", opts: ["Empêcher d'écraser les formules tout en laissant saisir les données", "Trier plus vite", "Imprimer", "Accélérer les calculs"], a: 0, exp: "On déverrouille les cellules de saisie, on protège la feuille (jour 27)." }
  ],
  final: {
    title: "Exercice final — Les KPI du tableau de bord",
    intro: `<p>La feuille « Ventes » est un Tableau nommé <strong>Ventes</strong> avec une colonne calculée <strong>CA</strong> = Quantité × PrixUnit :</p>
<pre class="pseudo">   Produit   Ville    Vendeur   Quantité   PrixUnit   CA
   Clavier   Paris    Alice     2          25         50
   Souris    Lyon     Bruno     5          10         50
   Écran     Paris    Alice     1          200        200
   Câble     Lyon     Bruno     4          5          20
   Casque    Paris    Alice     2          40         80</pre>
<p>On calcule les indicateurs clés sur la feuille Synthèse.</p>`,
    questions: [
      { type: "input", q: "CA total = SOMME(Ventes[CA]). Combien (50+50+200+20+80) ?", a: "400", ph: "nombre", exp: "50+50+200+20+80 = 400." },
      { type: "input", q: "Nombre de ventes = NBVAL(Ventes[Produit]) ?", a: "5", ph: "nombre", exp: "5 lignes de produits." },
      { type: "input", q: "CA de Paris = SOMME.SI(Ventes[Ville];\"Paris\";Ventes[CA]) (50+200+80) ?", a: "330", ph: "nombre", exp: "Clavier 50 + Écran 200 + Casque 80 = 330." },
      { type: "input", q: "Panier moyen = MOYENNE(Ventes[CA]) = 400 / 5 ?", a: "80", ph: "nombre", exp: "400 / 5 = 80." },
      { type: "input", q: "Part de Lyon = CA Lyon / CA total = (50+20)/400, en % arrondi à l'unité ?", a: "18", ph: "nombre sans %", exp: "70 / 400 = 0,175 ≈ 18 %." }
    ],
    solution: `<p><strong>Les formules KPI (feuille Synthèse) :</strong></p>
<pre class="pseudo">CA total     : =SOMME(Ventes[CA])                       → 400
Nb de ventes : =NBVAL(Ventes[Produit])                  → 5
CA Paris     : =SOMME.SI(Ventes[Ville];"Paris";Ventes[CA]) → 330
Panier moyen : =MOYENNE(Ventes[CA])                     → 80
Meilleure vente : =MAX(Ventes[CA])                      → 200</pre>
<p><strong>Part de Lyon (sécurisée) :</strong></p>
<pre class="pseudo">=SIERREUR( SOMME.SI(Ventes[Ville];"Lyon";Ventes[CA]) / SOMME(Ventes[CA]) ; 0 )
- CA de Lyon = 50 (Souris) + 20 (Câble) = 70
- / CA total 400 = 0,175 → mis en forme % → 18 %
- SIERREUR ; 0 : si aucune vente (total 0), affiche 0 au lieu de #DIV/0!</pre>
<p><strong>Pour finir le dashboard :</strong> un histogramme CA par Ville, un TCD Vendeur → Somme de CA (Alice 330, Bruno 70), des barres de données sur la colonne CA, une protection des cellules de formule. Tu as tout vu pendant 31 jours — assemble et savoure !</p>`
  }
};
</script>
