<body>
<script>
var DAY = {
  num: 30,
  title: "Gérer les erreurs (SIERREUR) et auditer ses formules",
  subtitle: "Reconnaître les messages d'erreur, les neutraliser proprement, et retrouver leur cause.",
  theory: `
<h3>1. Le petit dictionnaire des erreurs</h3>
<p>Quand une formule ne peut pas donner de résultat, Excel affiche un <strong>code d'erreur</strong> qui commence par <code>#</code>. Chacun a un sens précis :</p>
<pre class="pseudo">#DIV/0!    // division par zéro (ou par une cellule vide)
#N/A       // valeur non trouvée (souvent une RECHERCHEV/RECHERCHEX sans correspondance)
#NOM?      // nom de fonction mal orthographié, ou texte oublié entre guillemets
#VALEUR!   // mauvais type : on additionne du texte avec un nombre, par ex.
#REF!      // référence détruite : on a supprimé une cellule dont la formule dépendait
#NOMBRE!   // calcul impossible (racine d'un négatif, résultat trop grand…)
##### (dièses) // ce n'est PAS une erreur : la colonne est juste trop étroite ! élargis-la</pre>
<div class="tip">Le dernier n'est pas une vraie erreur : <code>#####</code> signifie « colonne trop étroite ». Double-clique la bordure de la colonne pour l'élargir.</div>
<h3>2. SIERREUR : afficher un message propre à la place d'une erreur</h3>
<p><strong>SIERREUR</strong> teste une formule : si elle marche, elle renvoie son résultat ; si elle produit une erreur, elle renvoie une <strong>valeur de repli</strong> que tu choisis (un tiret, un texte, 0…).</p>
<pre class="pseudo">=SIERREUR( A1/B1 ; "—" )
// SIERREUR : « si erreur, remplace »
// A1/B1    : l'expression testée (peut échouer si B1 = 0 → #DIV/0!)
// ; "—"    : la valeur de repli affichée en cas d'erreur (ici un tiret)
// résultat : le quotient si B1 ≠ 0, sinon « — » au lieu de #DIV/0!</pre>
<p>Exemple typique avec une recherche :</p>
<pre class="pseudo">=SIERREUR( RECHERCHEV(D2;Tarifs;2;FAUX) ; "Non trouvé" )
// si le produit D2 existe dans Tarifs : renvoie son prix
// s'il n'existe pas (#N/A) : affiche « Non trouvé » au lieu du code d'erreur</pre>
<div class="warn">Ne mets pas SIERREUR PARTOUT à l'aveugle : il cache l'erreur mais aussi sa cause. Vérifie d'abord POURQUOI ça échoue, puis masque proprement les cas légitimes (une cellule encore vide, par ex.).</div>
<h3>3. La cousine SI.NON.DISP (365 / 2019+)</h3>
<pre class="pseudo">=SI.NON.DISP( RECHERCHEV(D2;Tarifs;2;FAUX) ; "Non trouvé" )
// ne rattrape QUE l'erreur #N/A, laisse passer les autres (#DIV/0!, #REF!…)
// utile quand tu veux voir les vraies erreurs et masquer seulement « non trouvé »</pre>
<div class="tip">SI.NON.DISP existe depuis Excel 2013, donc présent en 365 et 2021/2019. SIERREUR existe depuis 2007.</div>
<h3>4. Auditer : d'où vient la formule ?</h3>
<p>L'onglet <strong>Formules</strong> contient des outils d'audit :</p>
<pre class="pseudo">Formules ▸ Repérer les antécédents   // flèches vers les cellules QUI ALIMENTENT la formule
Formules ▸ Repérer les dépendants    // flèches vers les cellules QUI UTILISENT cette cellule
Formules ▸ Supprimer les flèches     // efface ces flèches d'audit
Formules ▸ Afficher les formules  (Ctrl + ù)  // montre les formules au lieu des résultats</pre>
<h3>5. Évaluer une formule pas à pas</h3>
<pre class="pseudo">Formules ▸ Évaluer la formule
// Excel calcule morceau par morceau, tu vois où l'erreur apparaît</pre>
<p>Et la <strong>Vérification des erreurs</strong> (<code>Formules ▸ Vérification des erreurs</code>) parcourt la feuille et explique chaque erreur trouvée. Le petit triangle vert dans un coin de cellule signale d'ailleurs une anomalie potentielle.</p>
<div class="tip">Réflexe d'audit : sélectionne la cellule en erreur, clique le petit panneau d'avertissement qui apparaît à côté : Excel propose souvent directement la cause et la correction.</div>`,
  exercises: [
    { type: "qcm", q: "#DIV/0! signifie :", opts: ["Colonne trop étroite", "Division par zéro (ou cellule vide)", "Nom mal écrit", "Référence détruite"], a: 1, exp: "On divise par 0 ou par une cellule vide." },
    { type: "qcm", q: "#N/A apparaît souvent avec :", opts: ["Une SOMME", "Une RECHERCHEV sans correspondance", "Une addition", "Un tri"], a: 1, exp: "Valeur non trouvée par une recherche." },
    { type: "qcm", q: "##### (des dièses) veut dire :", opts: ["Une grave erreur", "La colonne est trop étroite, élargis-la", "Une division par zéro", "Une erreur de syntaxe dans la formule"], a: 1, exp: "Ce n'est pas une erreur : la valeur ne tient pas, élargis la colonne." },
    { type: "qcm", q: "#NOM? indique le plus souvent :", opts: ["Une division par zéro", "Un nom de fonction mal orthographié", "Une colonne étroite", "Un bon résultat"], a: 1, exp: "Fonction mal écrite ou texte sans guillemets." },
    { type: "qcm", q: "#REF! survient quand :", opts: ["On supprime une cellule dont la formule dépendait", "La colonne est étroite", "On additionne", "On trie"], a: 0, exp: "La référence a été détruite." },
    { type: "qcm", q: "Que fait =SIERREUR(A1/B1;\"—\") si B1 = 0 ?", opts: ["Affiche #DIV/0!", "Affiche —", "Plante Excel", "Affiche 0 forcément"], a: 1, exp: "En cas d'erreur, la valeur de repli « — » s'affiche." },
    { type: "qcm", q: "Dans SIERREUR, le 2e argument est :", opts: ["L'expression testée", "La valeur de repli en cas d'erreur", "Un tri", "Le message d'erreur Excel standard"], a: 1, exp: "=SIERREUR(expression ; valeur_si_erreur)." },
    { type: "qcm", q: "=SIERREUR(RECHERCHEV(D2;Tarifs;2;FAUX);\"Non trouvé\") affiche 'Non trouvé' quand :", opts: ["Le produit existe", "Le produit n'est pas dans Tarifs (#N/A)", "Toujours", "Jamais"], a: 1, exp: "En cas de #N/A, on renvoie le message de repli." },
    { type: "vf", q: "Mettre SIERREUR partout est une bonne idée, ça masque tous les problèmes.", a: false, exp: "Il cache l'erreur ET sa cause : vérifie d'abord pourquoi ça échoue." },
    { type: "qcm", q: "SI.NON.DISP rattrape :", opts: ["Toutes les erreurs", "Seulement #N/A", "Seulement #DIV/0!", "#REF! et #N/A"], a: 1, exp: "Il ne neutralise que #N/A, laissant voir les autres." },
    { type: "vf", q: "SIERREUR et SI.NON.DISP existent en 365 comme en 2021/2019.", a: true, exp: "SIERREUR depuis 2007, SI.NON.DISP depuis 2013." },
    { type: "qcm", q: "'Repérer les antécédents' montre :", opts: ["Les cellules qui alimentent la formule", "Les cellules qui utilisent cette formule", "Les erreurs d'impression", "Les feuilles"], a: 0, exp: "Des flèches vers les cellules sources de la formule." },
    { type: "qcm", q: "Ctrl + ù (Afficher les formules) permet de :", opts: ["Imprimer", "Voir les formules au lieu des résultats", "Trier", "Protéger"], a: 1, exp: "Bascule l'affichage formules/résultats." },
    { type: "qcm", q: "'Évaluer la formule' sert à :", opts: ["La calculer morceau par morceau pour trouver l'erreur", "La supprimer", "La convertir en valeur", "La trier"], a: 0, exp: "On voit à quelle étape l'erreur apparaît." },
    { type: "qcm", q: "Le petit triangle vert dans un coin de cellule signale :", opts: ["Une cellule protégée", "Une anomalie potentielle à vérifier", "Un graphique", "Un tri en cours"], a: 1, exp: "C'est un indicateur de vérification d'erreurs." }
  ],
  final: {
    title: "Exercice final — Fiabiliser un tableau de prix unitaires",
    intro: `<p>On calcule un prix unitaire = Montant / Quantité, mais certaines quantités sont à 0 ou vides :</p>
<pre class="pseudo">      A          B          C          D
1   Produit    Montant    Quantité   PrixUnit
2   Stylo      120        40         =B2/C2
3   Cahier     90         0          =B3/C3   ← #DIV/0!
4   Gomme      50         25         =B4/C4</pre>
<p>On veut afficher un tiret « — » à la place de #DIV/0!, sans casser les lignes correctes.</p>`,
    questions: [
      { type: "qcm", q: "Pourquoi la ligne Cahier affiche-t-elle #DIV/0! ?", opts: ["Colonne trop étroite", "Division par 0 (Quantité = 0)", "Nom mal écrit", "Référence détruite"], a: 1, exp: "90 / 0 est impossible → #DIV/0!." },
      { type: "qcm", q: "Quelle formule mettre en D2 pour gérer l'erreur ?", opts: ["=B2/C2", "=SIERREUR(B2/C2;\"—\")", "=SI(C2=0)", "=SOMME(B2/C2)"], a: 1, exp: "SIERREUR renvoie le tiret quand la division échoue." },
      { type: "input", q: "Que vaut D2 (Stylo, 120 / 40) ?", a: "3", ph: "nombre", exp: "120 / 40 = 3." },
      { type: "input", q: "Qu'affiche D3 (Cahier) avec la formule SIERREUR ?", a: "—", ph: "le repli", exp: "La division échoue (÷0) → la valeur de repli « — »." },
      { type: "qcm", q: "Pour comprendre d'où vient l'erreur, quel outil d'audit ?", opts: ["Formules ▸ Repérer les antécédents / Évaluer la formule", "Données ▸ Trier", "Insertion ▸ Graphique", "Accueil ▸ Coller"], a: 0, exp: "Les outils d'audit de l'onglet Formules montrent et évaluent la formule." }
    ],
    solution: `<p><strong>La formule protégée :</strong></p>
<pre class="pseudo">En D2 : =SIERREUR( B2/C2 ; "—" )
- B2/C2  : le calcul du prix unitaire (peut donner #DIV/0! si C = 0)
- ; "—"  : la valeur de repli affichée quand le calcul échoue
Recopie ensuite D2 vers D3 et D4 avec la poignée de recopie.</pre>
<p><strong>Résultats :</strong> Stylo 3 · Cahier — (au lieu de #DIV/0!) · Gomme 2.</p>
<p><strong>Bon réflexe d'audit :</strong> avant de masquer, sélectionne D3 et clique <code>Formules ▸ Évaluer la formule</code> : tu vois que B3/C3 = 90/0 provoque l'erreur. Ici le 0 est légitime (pas encore de quantité), donc afficher « — » a du sens. SIERREUR corrige l'affichage sans fausser les lignes valides.</p>
<p>Variante : si tu ne veux masquer QUE les « non trouvé » d'une recherche et voir les autres erreurs, utilise <code>SI.NON.DISP</code> à la place.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Décris ta manip dans Excel…",
  items: [
  { id: "excel-j30", title: "Un tarif à l'épreuve des erreurs", level: 3,
    statement: "Recopie ce tableau. La colonne D cherche le prix du produit dans un mini-tarif, et la colonne E calcule un taux = Ventes/Objectif. Protège les deux colonnes contre les erreurs : « Non trouvé » pour une recherche ratée, « — » pour une division par un objectif nul.<pre class=\"pseudo\">      A          B         C          F          G\n1   Produit    Ventes    Objectif   (Tarif)    (Prix)\n2   Stylo      120       40         Stylo      2\n3   Cahier     90        0          Cahier     3\n4   Zorglub    50        25         Gomme      1</pre>",
    hints: [
      "Pour le prix : =RECHERCHEV(A2;$F$2:$G$4;2;FAUX) — Zorglub n'existe pas dans le tarif → #N/A.",
      "Enveloppe la recherche dans SIERREUR avec le repli \"Non trouvé\".",
      "Pour le taux : =SIERREUR(B2/C2;\"—\") gère l'objectif = 0 de Cahier."
    ],
    solution: "OBJECTIF : deux colonnes calculées, robustes aux erreurs.\n\nCOLONNE D — Prix cherché dans le tarif F2:G4 :\n1. En D2 :  =SIERREUR( RECHERCHEV(A2;$F$2:$G$4;2;FAUX) ; \"Non trouvé\" )\n   - RECHERCHEV(A2;$F$2:$G$4;2;FAUX) : cherche le produit A2 dans le tarif, renvoie la 2e colonne (le prix), correspondance exacte (FAUX)\n   - $F$2:$G$4 : la plage tarif figée ($) pour la recopie\n   - SIERREUR(... ; \"Non trouvé\") : si le produit n'existe pas (#N/A), affiche « Non trouvé »\n2. Recopie D2 vers D3, D4.\n   Résultats : Stylo 2 · Cahier 3 · Zorglub « Non trouvé ».\n\nCOLONNE E — Taux Ventes/Objectif :\n3. En E2 :  =SIERREUR( B2/C2 ; \"—\" )\n   - B2/C2 : le taux (peut donner #DIV/0! si l'objectif = 0)\n   - \"—\" : repli affiché en cas d'erreur\n4. Recopie E2 vers le bas.\n   Résultats : Stylo 3 · Cahier « — » (objectif 0) · Zorglub 2.\n\nAUDIT : sur une cellule en erreur, Formules ▸ Évaluer la formule montre l'étape fautive.",
    note: "Astuce fine : SIERREUR attrape TOUTES les erreurs. Si tu veux masquer uniquement le « produit non trouvé » (#N/A) mais continuer à voir un vrai #REF! ou #DIV/0! anormal, remplace SIERREUR par SI.NON.DISP sur la colonne de recherche." }
  ]
};
</script>
