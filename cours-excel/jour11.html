<script>
var DAY = {
  num: 11,
  title: "La fonction SI",
  subtitle: "Faire prendre une décision à Excel : « si la condition est vraie, alors… sinon… ».",
  theory: `
<h3>1. L'idée : une décision automatique</h3>
<p>La fonction <strong>SI</strong> permet à Excel de choisir entre deux réponses selon qu'une <strong>condition</strong> est vraie ou fausse. Analogie : « <em>Si</em> il pleut, <em>alors</em> je prends un parapluie, <em>sinon</em> je prends des lunettes de soleil. » Excel fait pareil, automatiquement, dans une cellule.</p>
<h3>2. La structure de SI</h3>
<pre class="pseudo">=SI(condition ; valeur_si_VRAI ; valeur_si_FAUX)
   SI(...)              la fonction de decision
   condition           un test qui donne VRAI ou FAUX (ex : B2>=10)
   valeur_si_VRAI      ce qu'on affiche si la condition est vraie
   valeur_si_FAUX      ce qu'on affiche si la condition est fausse
   ;                   separe les trois arguments</pre>
<div class="tip">Lis-la toujours à voix haute : « SI (ceci) ALORS (cela) SINON (autre chose) ». Les trois morceaux sont séparés par des points-virgules.</div>
<h3>3. Les opérateurs de comparaison</h3>
<p>La condition compare deux choses. Voici les symboles :</p>
<pre class="pseudo">=    egal a           B2=10
<>   different de      B2<>0     // le "different" s'ecrit < suivi de >
>    strictement superieur   B2>10
<    strictement inferieur   B2<10
>=   superieur ou egal       B2>=10
<=   inferieur ou egal       B2<=10</pre>
<h3>4. Un premier exemple : admis ou recalé</h3>
<pre class="pseudo">=SI(B2>=10 ; "Admis" ; "Recale")
   B2>=10      la condition : la note en B2 vaut-elle au moins 10 ?
   "Admis"     affiche si VRAI (note >= 10)
   "Recale"    affiche si FAUX (note < 10)</pre>
<div class="warn">Le texte à afficher va entre <strong>guillemets droits</strong> : "Admis". Sans les guillemets, Excel croirait que c'est un nom de cellule ou de fonction et renverrait une erreur.</div>
<h3>5. On peut aussi afficher des nombres ou des calculs</h3>
<pre class="pseudo">=SI(B2>=10 ; 1 ; 0)              // 1 si admis, 0 sinon (pas de guillemets pour les nombres)
=SI(B2>100 ; B2*0,9 ; B2)        // remise de 10 % au-dela de 100, sinon prix normal
=SI(B2="oui" ; "Valide" ; "En attente")   // teste un TEXTE (avec guillemets)</pre>
<h3>6. Piège fréquent : le SINON vide</h3>
<p>Si tu ne veux rien afficher dans le cas faux, mets deux guillemets collés <code>""</code> (chaîne vide) :</p>
<pre class="pseudo">=SI(B2>=10 ; "Admis" ; "")      // affiche "Admis" ou... rien du tout
   ""      chaine vide : la cellule reste visuellement vide</pre>
<div class="tip">Compte bien tes parenthèses et tes guillemets. Une erreur classique : oublier de fermer la parenthèse ou un guillemet. Excel signale alors une formule invalide.</div>`,
  exercises: [
    { type: "qcm", q: "Que fait la fonction SI ?", opts: ["Additionne", "Choisit entre deux résultats selon qu'une condition est vraie ou fausse", "Compte les cellules", "Trie"], a: 1, exp: "SI prend une décision : valeur si vrai, valeur si faux." },
    { type: "qcm", q: "Combien d'arguments a la fonction SI (dans sa forme de base) ?", opts: ["1", "2", "3 (condition, si vrai, si faux)", "4"], a: 2, exp: "Trois : la condition, la valeur si vrai, la valeur si faux." },
    { type: "input", q: "Quel symbole signifie « supérieur ou égal » ?", a: ">=", ph: "un symbole", exp: ">= : supérieur ou égal (ex. B2>=10)." },
    { type: "qcm", q: "Comment écrit-on « différent de » ?", opts: ["=/=", "!=", "<>", "><"], a: 2, exp: "En Excel, « différent de » s'écrit <> (inférieur suivi de supérieur)." },
    { type: "qcm", q: "Dans =SI(B2>=10 ; \"Admis\" ; \"Recale\"), que s'affiche-t-il si B2 vaut 8 ?", opts: ["Admis", "Recale", "8", "une erreur"], a: 1, exp: "8 n'est pas >= 10 : condition fausse → « Recale »." },
    { type: "qcm", q: "Pourquoi met-on « Admis » entre guillemets ?", opts: ["Pour la couleur", "Parce que c'est du texte à afficher (sinon Excel cherche une cellule/fonction)", "Ce n'est pas obligatoire", "Pour aller plus vite"], a: 1, exp: "Les guillemets indiquent une valeur texte littérale." },
    { type: "vf", q: "Les nombres affichés par SI n'ont pas besoin de guillemets.", a: true, exp: "=SI(...;1;0) : les nombres se mettent tels quels ; seuls les textes prennent des guillemets." },
    { type: "input", q: "Complète : =SI(B2>=10 ; \"Admis\" ; ___ ) pour afficher « Recale » sinon.", a: "\"Recale\"", ph: "ex : \"Non\"", exp: "Le 3e argument (cas faux) : \"Recale\" entre guillemets." },
    { type: "qcm", q: "Que renvoie =SI(B2>100 ; B2*0,9 ; B2) si B2 vaut 200 ?", opts: ["200", "180 (remise de 10 %)", "20", "une erreur"], a: 1, exp: "200 > 100 : on applique 200*0,9 = 180." },
    { type: "qcm", q: "Que renvoie la même formule =SI(B2>100 ; B2*0,9 ; B2) si B2 vaut 50 ?", opts: ["45", "50 (prix normal, condition fausse)", "5", "0"], a: 1, exp: "50 n'est pas > 100 : on garde B2 = 50." },
    { type: "qcm", q: "Pour ne RIEN afficher dans le cas faux, on met…", opts: ["0", "un espace", "\"\" (deux guillemets collés = chaîne vide)", "rien du tout, on laisse un blanc"], a: 2, exp: "La chaîne vide \"\" laisse la cellule visuellement vide." },
    { type: "qcm", q: "=SI(B2=\"oui\" ; \"Valide\" ; \"En attente\") teste…", opts: ["un nombre", "un texte (la cellule contient-elle « oui » ?)", "une date", "une couleur"], a: 1, exp: "On peut comparer du texte ; « oui » va entre guillemets." },
    { type: "vf", q: "La condition d'un SI donne toujours soit VRAI, soit FAUX.", a: true, exp: "C'est un test logique : le résultat est binaire, vrai ou faux." },
    { type: "input", q: "Écris une formule qui affiche « Majeur » si l'âge en A2 est au moins 18, sinon « Mineur ».", a: "=SI(A2>=18;\"Majeur\";\"Mineur\")", ph: "=SI(...)", exp: "=SI(A2>=18;\"Majeur\";\"Mineur\") : condition A2>=18." },
    { type: "qcm", q: "Erreur fréquente qui rend un SI invalide ?", opts: ["Trop de chiffres", "Oublier de fermer une parenthèse ou un guillemet", "Utiliser des références", "Mettre un point-virgule"], a: 1, exp: "Parenthèses/guillemets non fermés : Excel refuse la formule." }
  ],
  final: {
    title: "Exercice final — Réductions selon le montant",
    intro: `<p>Une boutique accorde une réduction de 5 % dès 50 € d'achat. On veut, pour chaque client, afficher le prix à payer et un message.</p>
<pre class="pseudo">      A          B         C                              D
  1  Client     Montant   Prix a payer                   Message
  2  Ali        80        =SI(B2>=50 ; B2*0,95 ; B2)      =SI(B2>=50 ; "Reduction" ; "")
  3  Bea        30        =SI(B3>=50 ; B3*0,95 ; B3)      =SI(B3>=50 ; "Reduction" ; "")
  4  Chris      50        =SI(B4>=50 ; B4*0,95 ; B4)      =SI(B4>=50 ; "Reduction" ; "")</pre>`,
    questions: [
      { type: "input", q: "Que vaut C2 pour Ali (montant 80) ?", a: "76", ph: "un nombre", exp: "80 >= 50 : 80*0,95 = 76." },
      { type: "input", q: "Que vaut C3 pour Bea (montant 30) ?", a: "30", ph: "un nombre", exp: "30 < 50 : pas de réduction, on garde 30." },
      { type: "qcm", q: "Que vaut C4 pour Chris (montant 50, la condition est >=50) ?", opts: ["50", "47,5 (car 50>=50 est vrai)", "45", "erreur"], a: 1, exp: "50 >= 50 est VRAI (le « ou égal » compte) : 50*0,95 = 47,5." },
      { type: "qcm", q: "Qu'affiche D3 pour Bea ?", opts: ["Reduction", "rien (chaîne vide)", "0", "Faux"], a: 1, exp: "30 < 50 : cas faux → \"\" (rien affiché)." },
      { type: "input", q: "On veut afficher « Cadeau » au lieu de « Reduction ». Écris le nouveau D2.", a: "=SI(B2>=50;\"Cadeau\";\"\")", ph: "=SI(...)", exp: "On remplace juste le texte du cas vrai : =SI(B2>=50;\"Cadeau\";\"\")." }
    ],
    solution: `<p>Deux colonnes de SI, l'une renvoyant un calcul, l'autre un texte :</p>
<pre class="pseudo">Prix a payer :
C2 =SI(B2>=50 ; B2*0,95 ; B2)
   B2>=50     condition : le montant atteint-il 50 ?
   B2*0,95    si VRAI : prix reduit de 5 %
   B2         si FAUX : prix normal
-> Ali 80 -> 76 ; Bea 30 -> 30 ; Chris 50 -> 47,5

Message :
D2 =SI(B2>=50 ; "Reduction" ; "")
   "Reduction"  si VRAI
   ""           si FAUX : rien affiche</pre>
<p>Point clé : <code>>=</code> inclut l'égalité, donc 50 déclenche bien la réduction. Le texte va entre guillemets ; le calcul, sans. Demain : enchaîner plusieurs SI et combiner des conditions avec ET / OU.</p>`
  }
};
</script>
