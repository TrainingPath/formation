<script>
var DAY = {
  num: 15,
  title: "Les fonctions texte",
  subtitle: "Découper, assembler, nettoyer et transformer du texte automatiquement.",
  theory: `
<h3>1. Pourquoi manipuler le texte ?</h3>
<p>Les données réelles sont souvent mal rangées : un nom et un prénom collés, des espaces en trop, des majuscules mal placées. Les <strong>fonctions texte</strong> permettent de découper, recoller et nettoyer ce texte sans tout retaper. Rappel : le texte à afficher va entre <strong>guillemets droits</strong>.</p>
<h3>2. Assembler : &amp; et CONCAT</h3>
<p>Le symbole <strong>&amp;</strong> (esperluette) colle deux textes bout à bout. On ajoute souvent un espace <code>" "</code> entre les morceaux.</p>
<pre class="pseudo">=A2&" "&B2
   A2       premier morceau (ex : le prenom)
   &" "&    colle un espace entre les deux
   B2       deuxieme morceau (ex : le nom)
// "Marie" & " " & "Curie" -> "Marie Curie"</pre>
<p>La fonction <strong>CONCAT</strong> fait pareil (elle remplace l'ancienne CONCATENER) : <code>=CONCAT(A2;" ";B2)</code>. Depuis Excel 2019/365, <strong>JOINDRE.TEXTE</strong> permet même de coller toute une plage avec un séparateur.</p>
<h3>3. Découper : GAUCHE, DROITE, STXT</h3>
<pre class="pseudo">=GAUCHE(A2 ; 3)     // les 3 premiers caracteres a GAUCHE
=DROITE(A2 ; 2)     // les 2 derniers caracteres a DROITE
=STXT(A2 ; 4 ; 5)   // extrait 5 caracteres a partir de la position 4
   STXT(texte ; debut ; longueur)   // "sous-texte" : au milieu</pre>
<pre class="pseudo">// Exemple : A2 = "FR-2025-0042"
=GAUCHE(A2 ; 2)      -> "FR"      // les 2 premieres lettres
=DROITE(A2 ; 4)      -> "0042"    // les 4 derniers caracteres
=STXT(A2 ; 4 ; 4)    -> "2025"    // 4 caracteres a partir du 4e</pre>
<h3>4. Mesurer et trouver : NBCAR et TROUVE / CHERCHE</h3>
<pre class="pseudo">=NBCAR(A2)          // nombre de caracteres du texte (espaces compris)
=TROUVE("-" ; A2)   // position du 1er tiret dans A2 (respecte la casse)
=CHERCHE("a" ; A2)  // idem mais ignore majuscules/minuscules</pre>
<div class="tip">On combine souvent TROUVE et STXT/GAUCHE pour découper à un endroit variable, par exemple couper un e-mail au niveau du @.</div>
<h3>5. Nettoyer et changer la casse</h3>
<pre class="pseudo">=SUPPRESPACE(A2)    // enleve les espaces en trop (debut, fin, doublons)
=MAJUSCULE(A2)      // tout en MAJUSCULES
=MINUSCULE(A2)      // tout en minuscules
=NOMPROPRE(A2)      // Met Une Majuscule A Chaque Mot</pre>
<div class="warn">SUPPRESPACE est un réflexe de nettoyage : des espaces invisibles en fin de cellule cassent souvent les comparaisons et les recherches (RECHERCHEV qui « ne trouve pas » alors que ça semble identique).</div>
<h3>6. Remplacer : SUBSTITUE</h3>
<pre class="pseudo">=SUBSTITUE(A2 ; "-" ; "/")   // remplace tous les "-" par des "/"
   SUBSTITUE(texte ; ancien ; nouveau)</pre>
<div class="tip">Bon à savoir : le résultat d'une fonction texte est du texte « calculé ». Pour le figer en texte simple, copie puis Collage spécial ▸ Valeurs (vu au jour 6).</div>`,
  exercises: [
    { type: "qcm", q: "Que fait le symbole & entre deux textes ?", opts: ["Les additionne", "Les colle bout à bout (concatène)", "Les compare", "Les efface"], a: 1, exp: "& assemble des textes : A2&\" \"&B2 → « Marie Curie »." },
    { type: "input", q: "Avec A2 = « Marie » et B2 = « Curie », qu'affiche =A2&\" \"&B2 ?", a: "Marie Curie", ph: "le texte", exp: "Le & colle prénom, espace et nom : « Marie Curie »." },
    { type: "qcm", q: "=GAUCHE(A2;3) renvoie…", opts: ["les 3 derniers caractères", "les 3 premiers caractères", "le 3e caractère seulement", "3 espaces"], a: 1, exp: "GAUCHE prend les n premiers caractères à gauche." },
    { type: "qcm", q: "=DROITE(A2;2) renvoie…", opts: ["les 2 premiers caractères", "les 2 derniers caractères", "le 2e mot", "une erreur"], a: 1, exp: "DROITE prend les n derniers caractères." },
    { type: "input", q: "A2 = « FR-2025-0042 ». Que renvoie =GAUCHE(A2;2) ?", a: "FR", ph: "le texte", exp: "Les 2 premiers caractères : « FR »." },
    { type: "input", q: "A2 = « FR-2025-0042 ». Que renvoie =DROITE(A2;4) ?", a: "0042", ph: "le texte", exp: "Les 4 derniers caractères : « 0042 »." },
    { type: "qcm", q: "=STXT(A2;4;4) fait quoi ?", opts: ["prend les 4 premiers", "extrait 4 caractères à partir de la position 4", "compte 4 mots", "supprime 4 espaces"], a: 1, exp: "STXT(texte;début;longueur) extrait au milieu." },
    { type: "qcm", q: "=NBCAR(A2) renvoie…", opts: ["le nombre de mots", "le nombre de caractères (espaces compris)", "la position d'un caractère", "les majuscules"], a: 1, exp: "NBCAR compte tous les caractères, y compris les espaces." },
    { type: "qcm", q: "Pour enlever les espaces en trop d'un texte, on utilise…", opts: ["MAJUSCULE", "SUPPRESPACE", "NBCAR", "GAUCHE"], a: 1, exp: "SUPPRESPACE nettoie les espaces superflus (début, fin, doublons internes)." },
    { type: "input", q: "Quelle fonction met tout un texte en MAJUSCULES ?", a: "MAJUSCULE", ph: "un nom de fonction", exp: "=MAJUSCULE(A2) ; MINUSCULE pour l'inverse ; NOMPROPRE pour l'initiale." },
    { type: "qcm", q: "=NOMPROPRE(\"marie curie\") renvoie…", opts: ["MARIE CURIE", "marie curie", "Marie Curie", "Marie curie"], a: 2, exp: "NOMPROPRE met une majuscule à chaque mot." },
    { type: "qcm", q: "=SUBSTITUE(A2;\"-\";\"/\") fait quoi ?", opts: ["supprime les tirets", "remplace tous les « - » par des « / »", "coupe au tiret", "compte les tirets"], a: 1, exp: "SUBSTITUE remplace un texte par un autre partout où il apparaît." },
    { type: "qcm", q: "TROUVE et CHERCHE renvoient…", opts: ["un texte", "la position d'un caractère/mot dans un texte", "le nombre de mots", "une couleur"], a: 1, exp: "Elles donnent la position ; CHERCHE ignore la casse, TROUVE la respecte." },
    { type: "vf", q: "Des espaces invisibles en fin de cellule peuvent faire échouer une RECHERCHEV.", a: true, exp: "D'où l'utilité de SUPPRESPACE avant de comparer ou rechercher." },
    { type: "qcm", q: "JOINDRE.TEXTE (coller une plage avec séparateur) est apparue…", opts: ["dans toutes les versions", "vers Excel 2019 et dans 365", "en 1997", "jamais"], a: 1, exp: "Fonction récente (2019/365) ; sur versions anciennes, on utilise & ou CONCATENER." }
  ],
  final: {
    title: "Exercice final — Nettoyer un fichier de contacts",
    intro: `<p>Un fichier importé est mal formaté. On veut reconstruire un nom complet propre et extraire l'indicatif du code.</p>
<pre class="pseudo">      A          B          C
  1  Prenom     Nom        Code
  2  marie      CURIE      FR-01
  3  jean       DUPONT     BE-02</pre>
<p>Objectif : « Marie Curie » (initiales propres) en D, et l'indicatif « FR » extrait du code en E.</p>`,
    questions: [
      { type: "input", q: "Écris une formule qui assemble prénom et nom avec un espace en D2 (sans corriger la casse).", a: "=A2&\" \"&B2", ph: "=A2&...", exp: "=A2&\" \"&B2 → « marie CURIE »." },
      { type: "input", q: "Pour obtenir « Marie Curie » (chaque mot capitalisé), on enveloppe le tout dans…", a: "NOMPROPRE", ph: "un nom de fonction", exp: "=NOMPROPRE(A2&\" \"&B2) → « Marie Curie »." },
      { type: "input", q: "Écris la formule qui extrait « FR » (les 2 premiers caractères) du code en E2.", a: "=GAUCHE(C2;2)", ph: "=GAUCHE(...)", exp: "=GAUCHE(C2;2) prend « FR »." },
      { type: "input", q: "Que renvoie =NBCAR(C2) pour « FR-01 » ?", a: "5", ph: "un nombre", exp: "F, R, -, 0, 1 = 5 caractères (le tiret compte)." },
      { type: "input", q: "Écris la formule qui remplace le « - » par un « / » dans le code C2.", a: "=SUBSTITUE(C2;\"-\";\"/\")", ph: "=SUBSTITUE(...)", exp: "=SUBSTITUE(C2;\"-\";\"/\") → « FR/01 »." }
    ],
    solution: `<p>On combine assemblage, casse et découpage :</p>
<pre class="pseudo">Nom complet propre :
=NOMPROPRE(A2&" "&B2)
   A2&" "&B2   colle prenom + espace + nom -> "marie CURIE"
   NOMPROPRE   met une majuscule a chaque mot -> "Marie Curie"

Indicatif :
=GAUCHE(C2 ; 2)   -> "FR"    // les 2 premiers caracteres

Autres :
=NBCAR("FR-01")           -> 5
=SUBSTITUE(C2;"-";"/")     -> "FR/01"</pre>
<p>Réflexe pro : avant de comparer ou rechercher du texte importé, passe-le dans SUPPRESPACE pour éliminer les espaces invisibles. Ces fonctions se combinent (imbriquent) très librement.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris tes formules et où les placer…",
  items: [
  { id: "excel-j15", title: "Fabriquer un identifiant", level: 3,
    statement: "Recopie ce tableau. En colonne D, fabrique un identifiant au format « PRENOM.NOM » en minuscules (ex. « marie.curie ») à partir des colonnes A et B. En colonne E, extrais l'année « 2025 » du code de la colonne C.<pre class=\"pseudo\">      A          B          C\n  1  Prenom     Nom        Code\n  2  Marie      Curie      ID-2025-01\n  3  Jean       Dupont     ID-2025-02</pre>",
    hints: [
      "Assemble avec & : prénom, un point littéral \".\", puis nom. Enveloppe le tout dans MINUSCULE pour tout mettre en minuscules.",
      "Pour l'identifiant : =MINUSCULE(A2&\".\"&B2). Le \".\" entre guillemets est le séparateur.",
      "Pour l'année : dans « ID-2025-01 », l'année commence au 4e caractère et fait 4 chiffres. Utilise STXT(C2 ; 4 ; 4)."
    ],
    solution: "En D2 (identifiant PRENOM.NOM en minuscules) :\n=MINUSCULE(A2&\".\"&B2)\n   A2          le prenom (Marie)\n   &\".\"&      colle un point entre les deux\n   B2          le nom (Curie)\n   MINUSCULE   met tout en minuscules\n-> \"marie.curie\"\n\nEn E2 (annee extraite du code) :\n=STXT(C2 ; 4 ; 4)\n   C2   le code \"ID-2025-01\"\n   4    on commence a la position 4 (juste apres \"ID-\")\n   4    on prend 4 caracteres\n-> \"2025\"\n\nRecopie D2 et E2 vers le bas :\nD3 -> \"jean.dupont\" ; E3 -> \"2025\"\n\nResultat attendu : D2=marie.curie, E2=2025, D3=jean.dupont, E3=2025.",
    note: "Le texte litteral (le point) va entre guillemets : \".\". Pour STXT, compte bien les positions : le 1er caractere est en position 1 (ici I=1, D=2, tiret=3, donc l'annee demarre en 4)." }
  ]
};
</script>
