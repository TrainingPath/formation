<script>
var DAY = {
  num: 12,
  title: "Grid : la mise en page en grille",
  subtitle: "Flexbox aligne une rangée. Grid dessine toute la page — lignes ET colonnes à la fois.",
  theory: `
<h3>1. display: grid et grid-template-columns</h3>
<p>Comme Flexbox, Grid s'active sur le <strong>parent</strong>. La différence : tu déclares des <strong>colonnes</strong> (et des lignes), et les enfants viennent remplir les cases automatiquement :</p>
<pre class="pseudo">.catalogue {
  display: grid;
  grid-template-columns: 200px 200px 200px;  /* 3 colonnes de 200px */
  gap: 16px;                                 /* le même gap que Flexbox */
}</pre>
<p>Les cartes de jeux se placent case après case, ligne après ligne, sans que tu touches au HTML.</p>

<h3>2. L'unité fr et repeat()</h3>
<p>L'unité <code>fr</code> (« fraction ») partage l'espace <strong>disponible</strong> : <code>1fr 1fr 1fr</code> = trois colonnes égales, <code>2fr 1fr</code> = la première deux fois plus large. Et <code>repeat()</code> évite de se répéter :</p>
<pre class="pseudo">grid-template-columns: 1fr 1fr 1fr;        /* trois colonnes égales */
grid-template-columns: repeat(3, 1fr);     /* exactement pareil */
grid-template-columns: 2fr 1fr;            /* contenu large + barre latérale */</pre>
<p>Contrairement aux pourcentages, <code>fr</code> se calcule <strong>après</strong> le gap : jamais de débordement à cause des espacements.</p>

<h3>3. Étendre un élément : grid-column</h3>
<p>Un enfant peut occuper plusieurs colonnes. Pratique pour mettre en avant le jeu du mois dans le catalogue :</p>
<pre class="pseudo">.jeu-vedette {
  grid-column: span 2;      /* s'étend sur 2 colonnes */
}
.pleine-largeur {
  grid-column: 1 / -1;      /* de la 1re ligne de grille à la dernière */
}</pre>

<h3>4. grid-template-areas : le plan de la page</h3>
<p>Pour le layout global, Grid offre une syntaxe qui se lit comme un plan. Tu nommes des zones, puis tu les dessines :</p>
<pre class="pseudo">body {
  display: grid;
  grid-template-columns: 2fr 1fr;
  grid-template-areas:
    "entete  entete"
    "contenu lateral"
    "pied    pied";
}
header { grid-area: entete; }
main   { grid-area: contenu; }
aside  { grid-area: lateral; }
footer { grid-area: pied; }</pre>
<p>Répéter un nom (« entete entete ») étend la zone sur les deux colonnes. Le plan de la page se lit littéralement dans le CSS.</p>

<h3>5. La grille fluide : auto-fill + minmax</h3>
<p>Le sommet de l'art pour le catalogue de la Ludothèque — une grille qui adapte <strong>seule</strong> son nombre de colonnes à la largeur de l'écran :</p>
<pre class="pseudo">.catalogue {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}</pre>
<p>Lecture : « crée autant de colonnes que possible (<code>auto-fill</code>), chacune d'au moins 220px, et partage le reste équitablement (<code>1fr</code>) ». Grand écran : 4 colonnes. Tablette : 2. Téléphone : 1. Sans une seule media query.</p>
<div class="warn">Ne choisis pas Grid « parce que c'est plus récent » : <strong>Flexbox = 1 dimension</strong> (une rangée OU une colonne : nav, footer), <strong>Grid = 2 dimensions</strong> (lignes ET colonnes : catalogue, plan de page). Les deux cohabitent dans toute vraie feuille de style — souvent une grid dont les cartes sont en flex à l'intérieur.</div>
<div class="tip">Comme pour Flexbox, l'inspecteur (F12) affiche un badge <strong>grid</strong> sur les conteneurs : clique-le pour voir les lignes, les numéros de colonnes et les noms de zones superposés à la page. Redimensionne la fenêtre avec la grille auto-fill affichée : le déclic est immédiat.</div>`,
  exercises: [
    { type: "qcm", q: "display: grid se déclare…", opts: ["Sur chaque carte", "Sur le conteneur parent", "Sur le body obligatoirement", "Dans le HTML"], a: 1, exp: "Même logique que Flexbox : le parent définit la grille, les enfants la remplissent." },
    { type: "qcm", q: "grid-template-columns: repeat(3, 1fr); crée…", opts: ["3 lignes", "3 colonnes de largeur égale", "1 colonne de 3fr", "3 colonnes de 3px"], a: 1, exp: "repeat(3, 1fr) = 1fr 1fr 1fr : trois colonnes égales." },
    { type: "qcm", q: "L'unité fr représente…", opts: ["Une fraction de l'espace disponible", "Une unité fixe, comme le pixel", "1% de l'écran", "La taille de la police"], a: 0, exp: "2fr 1fr : la première colonne reçoit deux parts, la seconde une." },
    { type: "qcm", q: "Avec grid-template-columns: 2fr 1fr, la première colonne est…", opts: ["Deux fois plus large que la seconde", "Deux fois plus haute", "De 2px", "Invisible"], a: 0, exp: "Deux parts contre une : idéal contenu + barre latérale." },
    { type: "qcm", q: "L'avantage de fr sur les pourcentages :", opts: ["fr est plus joli", "fr se calcule après le gap : pas de débordement", "fr marche sans display: grid", "Aucun"], a: 1, exp: "3 × 33.33% + gaps déborde ; 3 × 1fr jamais." },
    { type: "qcm", q: "Pour que le jeu vedette occupe 2 colonnes du catalogue :", opts: ["width: 200%;", "grid-column: span 2;", "colspan=\"2\" en HTML", "flex: 2;"], a: 1, exp: "grid-column: span 2 étend l'élément sur deux pistes." },
    { type: "qcm", q: "grid-column: 1 / -1; signifie…", opts: ["Colonne 1 uniquement", "De la première à la dernière ligne de grille : pleine largeur", "Une colonne négative", "Une erreur"], a: 1, exp: "-1 désigne la dernière ligne de la grille, quelle que soit sa taille." },
    { type: "qcm", q: "Dans grid-template-areas, écrire \"entete entete\" sur la première ligne…", opts: ["Crée deux headers", "Étend la zone entete sur les deux colonnes", "Provoque une erreur", "Centre le header"], a: 1, exp: "Répéter le nom d'une zone l'étend sur les cases concernées." },
    { type: "qcm", q: "Comment un élément rejoint-il la zone nommée \"contenu\" ?", opts: ["main { grid-area: contenu; }", "main { area: contenu; }", "&lt;main area=\"contenu\"&gt;", "main { grid-zone: contenu; }"], a: 0, exp: "grid-area relie l'élément au nom déclaré dans le plan." },
    { type: "qcm", q: "repeat(auto-fill, minmax(220px, 1fr)) produit…", opts: ["Toujours 220 colonnes", "Autant de colonnes d'au moins 220px que l'écran en accepte", "Une colonne unique", "Des colonnes de 1px"], a: 1, exp: "La grille fluide : le nombre de colonnes s'adapte tout seul à la largeur." },
    { type: "qcm", q: "Pour la barre de navigation (une simple rangée de liens), l'outil naturel est…", opts: ["Grid, toujours", "Flexbox : c'est de la 1 dimension", "Un tableau", "position: absolute"], a: 1, exp: "Une rangée = 1D = Flexbox. Grid brille en 2D." },
    { type: "vf", q: "Grid gère les deux dimensions (lignes et colonnes), Flexbox une seule.", a: true, exp: "C'est LE critère de choix entre les deux." },
    { type: "vf", q: "Il faut choisir entre Flexbox et Grid pour tout le site : on ne peut pas mélanger.", a: false, exp: "On les combine sans cesse : une grid de cartes, chaque carte organisée en flex." },
    { type: "input", q: "Quelle unité de grille partage l'espace disponible en fractions ?", a: ["fr", "1fr"], ph: "unité…", exp: "fr — grid-template-columns: repeat(3, 1fr)." },
    { type: "input", q: "Quelle fonction évite d'écrire 1fr 1fr 1fr 1fr à la main ?", a: ["repeat", "repeat()"], ph: "fonction…", exp: "repeat(4, 1fr) — plus court et plus lisible." }
  ],
  final: {
    title: "Exercice final — Le catalogue en grille",
    intro: `<p>La page « Les jeux » de la Ludothèque passe en grille fluide, avec un jeu vedette mis en avant.</p>`,
    questions: [
      { type: "input", q: "Complète : .catalogue { display: ______; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }", a: ["grid"], ph: "valeur…", exp: "display: grid active la grille sur le conteneur." },
      { type: "qcm", q: "Dans repeat(auto-fill, minmax(220px, 1fr)), le 220px est…", opts: ["La largeur maximale d'une carte", "La largeur minimale d'une colonne", "Le gap", "La hauteur des lignes"], a: 1, exp: "minmax(min, max) : jamais moins de 220px, et 1fr pour partager le reste." },
      { type: "qcm", q: "Sur un écran étroit où une seule colonne de 220px tient, la grille auto-fill affiche…", opts: ["Une colonne, sans media query", "Un débordement", "Rien", "Toujours 3 colonnes"], a: 0, exp: "C'est toute la beauté de la grille fluide : elle s'adapte seule." },
      { type: "vf", q: ".jeu-vedette { grid-column: span 2; } fait occuper deux colonnes à la carte vedette.", a: true, exp: "span 2 = s'étendre sur deux pistes de colonnes." },
      { type: "qcm", q: "Le plan global de page « header en haut, main + aside au milieu, footer en bas » s'écrit lisiblement avec…", opts: ["float", "grid-template-areas", "text-align", "flex-wrap"], a: 1, exp: "Les zones nommées se lisent comme un plan dessiné dans le CSS." }
    ],
    solution: `<pre class="pseudo">/* catalogue fluide : le nombre de colonnes s'adapte seul */
.catalogue {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}
.jeu-vedette { grid-column: span 2; }   /* mise en avant */

/* plan global de la page */
body {
  display: grid;
  grid-template-columns: 2fr 1fr;
  grid-template-areas: "entete entete" "contenu lateral" "pied pied";
}

Choix d'outil : 1 dimension → Flexbox / 2 dimensions → Grid</pre>
<p>Le site est beau sur ton écran. Mais sur un téléphone ? Demain, media queries et mobile-first pour qu'il soit beau partout.</p>`
  }
};
</script>

var ECRITURE = {

    checklist: [
      "Pour chaque zone, as-tu tranché en te demandant : 1 ou 2 dimensions ?",
      "L'intérieur d'une carte (empilement vertical) est-il en flex-direction: column ?",

      "As-tu justifié chaque choix Flexbox/Grid en une phrase ?"
    ],
    statement: "Passe en revue cinq zones du site de la Ludothèque : la barre de navigation, le catalogue de jeux, le plan global d'une page (header / main + aside / footer), l'intérieur d'une carte de jeu (image, titre, texte empilés), et le footer en trois colonnes égales. Pour chacune, tranche : Flexbox ou Grid ? Justifie en une phrase (1 ou 2 dimensions ?), puis écris la règle CSS clé de la zone. Termine par le code complet de la grille fluide du catalogue.",
    hints: [
      "Pose-toi une seule question par zone : ai-je besoin de contrôler lignes ET colonnes, ou juste une rangée/colonne ?",

    ],
    solution: "AUDIT LAYOUT — Ludothèque\n\n1. Nav        → FLEXBOX : une rangée de liens, 1 dimension.\n   nav { display: flex; gap: 16px; }\n\n2. Catalogue  → GRID : lignes ET colonnes de cartes, 2 dimensions.\n   (code complet plus bas)\n\n3. Plan de page → GRID : zones nommées sur 2 dimensions.\n   body { display: grid; grid-template-columns: 2fr 1fr;\n          grid-template-areas: \"entete entete\" \"contenu lateral\" \"pied pied\"; }\n\n4. Intérieur d'une carte → FLEXBOX : un empilement vertical, 1 dimension.\n   .carte { display: flex; flex-direction: column; gap: 8px; }\n\n5. Footer 3 colonnes → FLEXBOX : une seule rangée à partager.\n   footer { display: flex; gap: 24px; }\n   footer section { flex: 1; }\n\n/* Catalogue fluide */\n.catalogue {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));\n  gap: 16px;\n}",
    note: "Cet audit est exactement le raisonnement qu'on attend d'un intégrateur devant une maquette : découper la page en zones et choisir l'outil par dimension, avant d'écrire du code. Remarque le point 4 : une carte en flex DANS une grid — combiner les deux est la norme, pas l'exception, et c'est ce que tu feras dans le mini-projet de la leçon 14." }
  ]
};
</script>
