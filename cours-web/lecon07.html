<!DOCTYPE html>

<head>

<title>Leçon 7</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
var DAY = {
  num: 7,
  title: "Mini-projet : la page d'accueil de la Ludothèque en HTML",
  subtitle: "Toute la semaine dans une seule page — et un site qui tient debout.",
  theory: `
<h3>1. Le plan du site</h3>
<p>Avant de coder, on organise. Le site de la Ludothèque compte quatre pages, toutes dans le même dossier, avec les images à part :</p>
<pre class="pseudo">ludotheque/                         &lt;!-- le dossier racine du site --&gt;
├── index.html        ← accueil (le mini-projet du jour)      &lt;!-- page d'accueil --&gt;
├── jeux.html         ← catalogue complet (tableau)           &lt;!-- la liste de tous les jeux --&gt;
├── jeu-catan.html    ← fiche détaillée d'un jeu              &lt;!-- une page de détail --&gt;
├── avis.html         ← formulaire d'avis                     &lt;!-- le formulaire --&gt;
└── images/                         &lt;!-- sous-dossier des images --&gt;
    ├── catan.jpg                   &lt;!-- une image --&gt;
    └── azul.jpg                    &lt;!-- une autre image --&gt;</pre>
<p>Chaque page partage le <strong>même squelette</strong> (leçon 4) : header avec nav, main propre à la page, footer. La nav pointe vers les quatre pages — depuis n'importe où, on va partout. C'est la règle des noms qui rend tout ça fiable : minuscules, sans espaces ni accents.</p>

<h3>2. La démarche : structure d'abord</h3>
<p>Pour construire une page, toujours le même ordre : <strong>squelette → zones → contenu</strong>. On écrit d'abord le doctype et le duo head/body, puis les balises sémantiques vides, et seulement ensuite on remplit. Pour l'accueil :</p>
<pre class="pseudo">Étape 1 : &lt;!DOCTYPE html&gt;, &lt;html lang="fr"&gt;, head complet   // poser le squelette de base
          (charset UTF-8 + title "Ludothèque — Accueil")     // accents corrects + titre d'onglet
Étape 2 : &lt;header&gt;+&lt;nav&gt;, &lt;main&gt; vide, &lt;footer&gt;              // dessiner les grandes zones (vides)
Étape 3 : remplir le &lt;main&gt;, section par section            // ajouter le contenu propre à la page
Étape 4 : tester CHAQUE lien et CHAQUE image                // vérifier que rien n'est cassé
Étape 5 : passer la checklist (point 5)                     // contrôle qualité final</pre>
<p>Coder les zones avant le contenu, c'est s'interdire les pages « en vrac » : chaque nouvel élément a déjà sa place.</p>

<h3>3. Le contenu du main, section par section</h3>
<p>Le <code>&lt;main&gt;</code> de l'accueil assemble tout ce que tu sais faire. Section 1 — <strong>bienvenue</strong> : le <code>&lt;h1&gt;</code> (le seul !), un paragraphe de présentation avec un <code>&lt;strong&gt;</code>, une photo d'ambiance légendée (<code>&lt;figure&gt;</code>). Section 2 — <strong>jeux phares</strong> : un <code>&lt;h2&gt;</code> et la liste <code>&lt;ul&gt;</code>, chaque jeu étant un lien vers sa fiche. Section 3 — <strong>aperçu du catalogue</strong> : un petit tableau de 3 jeux (avec <code>caption</code>, <code>thead</code>, <code>tbody</code>) et un lien « Voir tout le catalogue » vers <code>jeux.html</code>.</p>
<pre class="pseudo">&lt;main&gt;                                              &lt;!-- contenu principal de l'accueil --&gt;
  &lt;section&gt;                                          &lt;!-- section 1 : bienvenue --&gt;
    &lt;h1&gt;Bienvenue à la Ludothèque&lt;/h1&gt;               &lt;!-- LE titre unique de la page --&gt;
    &lt;p&gt;Plus de &lt;strong&gt;200 jeux&lt;/strong&gt; à emprunter…&lt;/p&gt;   &lt;!-- présentation, avec un mot mis en avant --&gt;
    &lt;figure&gt;…img + figcaption…&lt;/figure&gt;              &lt;!-- image d'ambiance + sa légende --&gt;
  &lt;/section&gt;                                         &lt;!-- fin de la section bienvenue --&gt;
  &lt;section&gt;                                          &lt;!-- section 2 : jeux phares --&gt;
    &lt;h2&gt;Nos jeux phares&lt;/h2&gt;                         &lt;!-- titre de section --&gt;
    &lt;ul&gt;&lt;li&gt;&lt;a href="jeu-catan.html"&gt;Catan&lt;/a&gt;&lt;/li&gt;…&lt;/ul&gt;   &lt;!-- liste de liens vers les fiches --&gt;
  &lt;/section&gt;                                         &lt;!-- fin de la section jeux phares --&gt;
  &lt;section&gt;                                          &lt;!-- section 3 : aperçu du catalogue --&gt;
    &lt;h2&gt;Aperçu du catalogue&lt;/h2&gt;                     &lt;!-- titre de section --&gt;
    &lt;table&gt;…caption, thead, tbody…&lt;/table&gt;           &lt;!-- petit tableau de 3 jeux --&gt;
    &lt;p&gt;&lt;a href="jeux.html"&gt;Voir tout le catalogue&lt;/a&gt;&lt;/p&gt;   &lt;!-- lien vers le catalogue complet --&gt;
  &lt;/section&gt;                                         &lt;!-- fin de la section catalogue --&gt;
&lt;/main&gt;                                              &lt;!-- fin du contenu principal --&gt;</pre>

<h3>4. Les invitations à agir</h3>
<p>Une page d'accueil <strong>guide</strong> le visiteur vers l'action. La nôtre l'invite à donner son avis : un paragraphe en fin de main avec un lien vers <code>avis.html</code>. Et dans le footer, l'adresse de la ludothèque plus un lien externe (le site d'un salon du jeu, par exemple) en <code>target="_blank"</code> :</p>
<pre class="pseudo">&lt;p&gt;Tu as testé un de nos jeux ?                    &lt;!-- phrase d'appel à l'action --&gt;
   &lt;a href="avis.html"&gt;Donne-nous ton avis !&lt;/a&gt;&lt;/p&gt;   &lt;!-- lien interne vers le formulaire d'avis --&gt;

&lt;footer&gt;                                            &lt;!-- pied de page --&gt;
  &lt;p&gt;La Ludothèque — 12 rue des Jeux, Bruxelles&lt;/p&gt;   &lt;!-- adresse de la ludothèque --&gt;
  &lt;p&gt;&lt;a href="https://www.spiel-messe.com" target="_blank"&gt;   &lt;!-- lien EXTERNE : URL absolue + nouvel onglet --&gt;
     Le salon du jeu d'Essen&lt;/a&gt;&lt;/p&gt;                &lt;!-- texte du lien --&gt;
&lt;/footer&gt;                                           &lt;!-- fin du pied de page --&gt;</pre>

<h3>5. La checklist de validation</h3>
<p>Avant de déclarer une page terminée, passe systématiquement cette liste — elle attrape 90 % des erreurs de débutant :</p>
<pre class="pseudo">□ doctype présent, lang="fr", charset UTF-8, title rempli       // le head est complet et correct
□ UN SEUL h1, hiérarchie h2/h3 sans saut de niveau             // le plan des titres est cohérent
□ toutes les balises ouvertes sont fermées (et bien imbriquées)   // pas de balise orpheline
□ un alt sur CHAQUE image                                       // accessibilité des images
□ chaque lien testé au clic (internes ET externes)             // aucun lien cassé
□ chaque champ de formulaire a son label relié (for/id)        // formulaires accessibles
□ un tableau = des données ; jamais de mise en page            // bon usage des tableaux
□ header / nav / main (unique) / footer en place               // charpente sémantique présente</pre>
<p>Pour aller plus loin, le <strong>validateur du W3C</strong> (validator.w3.org) analyse ton fichier et signale chaque balise mal fermée ou attribut manquant — prends l'habitude d'y passer tes pages.</p>
<div class="warn">Résiste à l'envie de « faire joli » avec des &lt;br&gt; en série, des espaces insécables ou des tableaux de mise en page : la page paraît brute, c'est NORMAL. La semaine CSS qui commence demain s'appuiera sur ta structure — plus elle est propre, plus le style sera simple.</div>
<div class="tip">Garde ce squelette de page sous la main : dans ta carrière, tu ne repartiras plus jamais de zéro. Tous les frameworks (React, Vue…) que tu croiseras plus tard génèrent en coulisses exactement ce HTML que tu sais maintenant écrire à la main.</div>`,
  exercises: [
    { type: "qcm", q: "L'ordre de construction d'une page :", opts: ["Contenu, puis squelette, puis zones", "Squelette, puis zones sémantiques, puis contenu", "CSS d'abord", "Au feeling"], a: 1, exp: "Structure d'abord : chaque élément trouve sa place déjà prête." },
    { type: "qcm", q: "Combien de pages compte le site de la Ludothèque ?", opts: ["2", "3", "4", "10"], a: 2, exp: "index, jeux, jeu-catan et avis — plus le dossier images/." },
    { type: "qcm", q: "La toute première ligne d'index.html :", opts: ["&lt;html&gt;", "&lt;!DOCTYPE html&gt;", "&lt;head&gt;", "&lt;meta charset=\"UTF-8\"&gt;"], a: 1, exp: "Le doctype annonce le HTML moderne — révision leçon 1." },
    { type: "vf", q: "Une page peut contenir deux &lt;h1&gt; si elle a deux sujets importants.", a: false, exp: "Un seul h1 par page ; les sujets secondaires prennent des h2 — révision leçon 2." },
    { type: "qcm", q: "Dans la liste des jeux phares, « Catan » cliquable s'écrit…", opts: ["&lt;li href=\"jeu-catan.html\"&gt;Catan&lt;/li&gt;", "&lt;li&gt;&lt;a href=\"jeu-catan.html\"&gt;Catan&lt;/a&gt;&lt;/li&gt;", "&lt;a&gt;&lt;li&gt;Catan&lt;/li&gt;&lt;/a&gt;", "&lt;li link=\"jeu-catan.html\"&gt;Catan&lt;/li&gt;"], a: 1, exp: "Le lien vit DANS le li ; href n'existe pas sur li — révision leçons 2-3." },
    { type: "input", q: "Attribut obligatoire sur chaque image pour l'accessibilité (nom de l'attribut seul) :", a: ["alt"], ph: "nom de l'attribut…", exp: "Un alt par image : point non négociable de la checklist — révision leçon 3." },
    { type: "qcm", q: "Le lien externe vers le salon d'Essen porte target=\"_blank\" pour…", opts: ["Charger plus vite", "S'ouvrir dans un nouvel onglet et garder la Ludothèque ouverte", "Être sécurisé", "S'afficher en gras"], a: 1, exp: "Nouvel onglet pour les sorties du site — révision leçon 3." },
    { type: "qcm", q: "Le menu commun à toutes les pages vit dans…", opts: ["&lt;nav&gt; dans le &lt;header&gt;", "&lt;aside&gt;", "&lt;footer&gt;", "&lt;head&gt;"], a: 0, exp: "Le squelette partagé de la leçon 4 : header + nav identiques partout." },
    { type: "vf", q: "Chaque page du site a son propre contenu de &lt;main&gt;, mais header et footer identiques.", a: true, exp: "C'est le principe du squelette commun — révision leçon 4." },
    { type: "qcm", q: "L'aperçu du catalogue sur l'accueil utilise un &lt;table&gt; parce que…", opts: ["C'est plus joli", "Jeu/joueurs/durée sont des données en lignes et colonnes", "Les listes sont interdites", "Le CSS l'exige"], a: 1, exp: "Des données tabulaires, jamais de la mise en page — révision leçon 5." },
    { type: "input", q: "Balise qui donne son titre au tableau du catalogue, sans les chevrons :", a: ["caption", "<caption>"], ph: "nom de la balise…", exp: "caption, juste après l'ouverture de table — révision leçon 5." },
    { type: "qcm", q: "Sur avis.html, chaque champ du formulaire doit avoir…", opts: ["Un placeholder suffit", "Un &lt;label&gt; relié par for/id", "Une couleur", "Un tableau autour"], a: 1, exp: "Le label est non négociable ; le placeholder n'est qu'une aide — révision leçon 6." },
    { type: "qcm", q: "La page d'accueil invite à l'action avec…", opts: ["Un lien vers avis.html « Donne-nous ton avis ! »", "Une alerte JavaScript", "Un email automatique", "Un compte à rebours"], a: 0, exp: "Une accueil guide le visiteur : catalogue, fiches, avis." },
    { type: "vf", q: "Si la page paraît brute et sans style à la fin de la semaine, c'est que le HTML est raté.", a: false, exp: "C'est normal et attendu : l'apparence est le travail du CSS, qui commence demain." },
    { type: "qcm", q: "L'outil en ligne qui vérifie la validité de ton HTML :", opts: ["Le validateur du W3C", "Google Traduction", "Photoshop", "Excel"], a: 0, exp: "validator.w3.org signale balises mal fermées et attributs manquants." }
  ],
  final: {
    title: "Exercice final — La revue de projet",
    intro: `<p>Dernier tour de piste : cinq questions qui balayent la semaine entière, comme une revue de code avant livraison.</p>`,
    questions: [
      { type: "qcm", q: "De haut en bas, le body d'index.html contient :", opts: ["header(nav) → main(sections) → footer", "main → header → footer", "nav → footer → main", "head → body → footer"], a: 0, exp: "La charpente sémantique de la leçon 4, remplie par tout le reste." },
      { type: "qcm", q: "Depuis index.html, le chemin vers la photo azul.jpg :", opts: ["azul.jpg", "images/azul.jpg", "C:\\ludotheque\\images\\azul.jpg", "https://azul.jpg"], a: 1, exp: "Chemin relatif vers le sous-dossier images/ — révision leçon 3." },
      { type: "vf", q: "La checklist impose : balises fermées, alt partout, un seul h1, liens testés.", a: true, exp: "Les quatre attrape-erreurs à passer sur CHAQUE page avant livraison." },
      { type: "input", q: "Nom de la page (fichier complet) qui contient le formulaire d'avis de la Ludothèque :", a: ["avis.html"], ph: "nom du fichier…", exp: "avis.html, reliée depuis l'accueil et la nav." },
      { type: "qcm", q: "Pourquoi une structure HTML propre facilite-t-elle la semaine CSS ?", opts: ["Le CSS s'accrochera à des zones et balises bien nommées", "Le CSS efface le HTML", "Elle rend le CSS inutile", "Aucun rapport"], a: 0, exp: "Le style cible la structure : murs droits, peinture facile." }
    ],
    solution: `<pre class="pseudo">ludotheque/  : index.html · jeux.html · jeu-catan.html · avis.html · images/   // les 4 pages + les images
Démarche     : squelette → zones sémantiques → contenu → tests → checklist    // toujours dans cet ordre
index.html   : header(nav 4 liens) + main(bienvenue+figure,                   // en-tête + menu
               jeux phares en ul de liens, aperçu du catalogue en table,      // liens + tableau de données
               appel à l'avis) + footer(adresse + lien externe _blank)        // call-to-action + pied de page
Checklist    : balises fermées · alt partout · un seul h1 ·                    // contrôle qualité…
               labels reliés · liens testés · validator.w3.org                // …avant de livrer

Semaine HTML : terminée. Le site a sa structure complète.                     // la charpente est prête</pre>
<p>Les murs sont droits et la maison tient debout. La semaine prochaine, on sort les pinceaux : le CSS va transformer cette structure brute en un site dont tu seras fier.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "web-l7", title: "La page d'accueil complète", level: 3,
    statement: "C'est le moment de livrer. Écris le fichier index.html COMPLET de la Ludothèque, du doctype à la dernière balise : head complet ; header avec le nom du site et la nav vers les 4 pages ; main avec trois sections (bienvenue avec h1 + paragraphe + figure légendée, jeux phares en liste de liens vers les fiches, aperçu du catalogue en tableau de 3 jeux avec caption/thead/tbody) et l'invitation à donner son avis ; footer avec adresse et un lien externe en nouvel onglet. Applique la checklist de la leçon avant de comparer avec la solution.",
    hints: [
      "Écris le squelette VIDE d'abord (doctype, head, header/nav, main, footer), vérifie-le, puis remplis section par section.",
      "Compte tes cellules : 4 colonnes dans le thead (Jeu, Joueurs, Durée, Âge) = 4 td dans chaque tr du tbody.",
      "Checklist finale : un seul h1 ? alt sur l'image ? chaque lien relatif correct (jeux.html, images/…) ? balises toutes fermées ?"
    ],
    solution: "<!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Ludothèque — Accueil</title>\n</head>\n<body>\n  <header>\n    <p>La Ludothèque</p>\n    <nav>\n      <ul>\n        <li><a href=\"index.html\">Accueil</a></li>\n        <li><a href=\"jeux.html\">Nos jeux</a></li>\n        <li><a href=\"jeu-catan.html\">Fiche Catan</a></li>\n        <li><a href=\"avis.html\">Donner un avis</a></li>\n      </ul>\n    </nav>\n  </header>\n\n  <main>\n    <section>\n      <h1>Bienvenue à la Ludothèque</h1>\n      <p>Plus de <strong>200 jeux de société</strong> à emprunter\n      gratuitement, pour tous les âges.</p>\n      <figure>\n        <img src=\"images/catan.jpg\" alt=\"Boîte du jeu Catan\">\n        <figcaption>Catan, le jeu le plus emprunté cette année</figcaption>\n      </figure>\n    </section>\n\n    <section>\n      <h2>Nos jeux phares</h2>\n      <ul>\n        <li><a href=\"jeu-catan.html\">Catan</a></li>\n        <li>Azul</li>\n        <li>7 Wonders</li>\n      </ul>\n    </section>\n\n    <section>\n      <h2>Aperçu du catalogue</h2>\n      <table>\n        <caption>Trois jeux du catalogue</caption>\n        <thead>\n          <tr><th>Jeu</th><th>Joueurs</th><th>Durée</th><th>Âge</th></tr>\n        </thead>\n        <tbody>\n          <tr><td>Catan</td><td>3 à 4</td><td>75 min</td><td>10+</td></tr>\n          <tr><td>Azul</td><td>2 à 4</td><td>40 min</td><td>8+</td></tr>\n          <tr><td>7 Wonders</td><td>3 à 7</td><td>30 min</td><td>10+</td></tr>\n        </tbody>\n      </table>\n      <p><a href=\"jeux.html\">Voir tout le catalogue</a></p>\n    </section>\n\n    <p>Tu as testé un de nos jeux ?\n    <a href=\"avis.html\">Donne-nous ton avis !</a></p>\n  </main>\n\n  <footer>\n    <p>La Ludothèque — 12 rue des Jeux, Bruxelles</p>\n    <p><a href=\"https://www.spiel-messe.com\" target=\"_blank\">\n    Le salon du jeu d'Essen</a></p>\n  </footer>\n</body>\n</html>",
    note: "Ta solution n'a pas besoin d'être identique mot pour mot : ce qui compte, c'est que la checklist passe — un seul h1, alt présent, zones sémantiques, tableau réservé aux données, tout fermé. Ce fichier est ton premier livrable de la formation, et il resservira tel quel : la semaine CSS le stylera, la semaine JavaScript le rendra interactif, et le cours API REST t'apprendra un jour à remplir son catalogue depuis un serveur." }
  ]
};
</script>
