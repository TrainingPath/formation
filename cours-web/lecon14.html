<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leçon 14</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
var DAY = {
  num: 14,
  title: "Mini-projet : la Ludothèque mise en beauté",
  subtitle: "Sept leçons de CSS, une feuille de style : aujourd'hui, on assemble tout, proprement.",
  theory: `
<h3>1. Une feuille organisée, pas un tas de règles</h3>
<p>Le danger après une semaine de CSS : un fichier où les règles s'empilent dans l'ordre où elles sont venues. Une feuille professionnelle suit un <strong>plan fixe</strong>, annoncé par des commentaires :</p>
<pre class="pseudo">/* ===== 1. Variables et reset ===== */
/* ===== 2. Typographie          ===== */
/* ===== 3. Layout (grandes zones) === */
/* ===== 4. Composants (cartes…) ===== */
/* ===== 5. Media queries        ===== */</pre>
<p>Cet ordre respecte la cascade : du général (base) au particulier (composants), et les media queries en dernier pour surcharger le reste.</p>

<h3>2. Le socle : mini-reset et variables</h3>
<p>On commence par le reset minimal (leçon 9) et, en bonus, les <strong>variables CSS</strong> : des valeurs nommées, déclarées dans <code>:root</code> (la racine du document) et réutilisées avec <code>var()</code>. Ta palette de la leçon 8 ne s'écrit plus qu'une fois :</p>
<pre class="pseudo">:root {
  --fond: #f7f3ea;
  --encre: #2c3e50;
  --accent: #7c3aed;
}
* {
  box-sizing: border-box;
  margin: 0;               /* on repart de zéro, on redonne ensuite */
}
body {
  background-color: var(--fond);
  color: var(--encre);
}
h1, h2 { color: var(--accent); }</pre>
<p>Changer <code>--accent</code> recolore titres, liens et boutons d'un coup : c'est le principe « une seule source de vérité ».</p>

<h3>3. Typographie puis layout</h3>
<p>Ensuite la voix du site (leçon 10), puis les grandes zones avec Grid et Flexbox (leçons 11-12), en mobile-first (leçon 13) :</p>
<pre class="pseudo">/* 2. typographie */
body  { font-family: "Poppins", Arial, sans-serif; line-height: 1.5; }
h1    { font-size: 2rem; }
h2    { font-size: 1.5rem; }
nav a { text-decoration: none; font-weight: 700; }

/* 3. layout — base mobile */
header     { display: flex; flex-direction: column; gap: 8px;
             padding: 12px 16px; background-color: var(--encre); }
nav        { display: flex; flex-direction: column; gap: 8px; }
main       { max-width: 960px; margin: 0 auto; padding: 16px; }
.catalogue { display: grid;
             grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
             gap: 16px; }</pre>

<h3>4. Les composants : la carte de jeu</h3>
<p>Un <strong>composant</strong> est un bloc réutilisable avec sa classe : ici, la carte de jeu (leçon 9 pour la boîte, leçon 11 pour l'intérieur) :</p>
<pre class="pseudo">/* 4. composants */
.carte {
  display: flex; flex-direction: column; gap: 8px;
  background-color: #ffffff;
  border: 1px solid #d9d2c4;
  padding: 16px;
}
.carte img { max-width: 100%; height: auto; }
.dispo     { color: #16a34a; font-weight: 700; }</pre>

<h3>5. Media queries et checklist finale</h3>
<pre class="pseudo">/* 5. media queries */
@media (min-width: 768px) {
  header { flex-direction: row; justify-content: space-between;
           align-items: center; }
  nav    { flex-direction: row; gap: 16px; }
}</pre>
<p>Avant de déclarer le projet fini, la <strong>checklist</strong> : <code>&lt;link&gt;</code> vers style.css dans chaque page ? <code>box-sizing</code> universel en tête ? Deux polices max, tailles en rem ? Rien ne déborde à 375px (F12, outil appareil) ? Liens du menu lisibles et cliquables ? Couleurs contrastées ? Si tout est coché, la Ludothèque est en beauté.</p>
<div class="warn">Résiste à l'envie de corriger un détail en ajoutant une règle en vrac à la fin du fichier : range chaque règle dans sa section. Une feuille désordonnée devient impossible à faire évoluer — et c'est toujours « juste une petite règle de plus » qui commence le chaos.</div>
<div class="tip">Garde cette structure en cinq sections comme <strong>gabarit de départ</strong> de tous tes futurs projets : variables + reset, typographie, layout, composants, media queries. Tu ne repartiras plus jamais d'une page blanche.</div>`,
  exercises: [
    { type: "qcm", q: "L'ordre conseillé des sections d'une feuille de style :", opts: ["Media queries, composants, reset", "Variables/reset, typographie, layout, composants, media queries", "Par ordre alphabétique", "Peu importe"], a: 1, exp: "Du général au particulier, les media queries en dernier pour surcharger." },
    { type: "qcm", q: "Les variables CSS se déclarent dans…", opts: [":root { --nom: valeur; }", "var { nom: valeur; }", "&lt;variables&gt; en HTML", "root() { }"], a: 0, exp: ":root est la racine du document ; les variables y sont visibles partout." },
    { type: "qcm", q: "On utilise une variable CSS avec…", opts: ["get(--accent)", "var(--accent)", "$accent", "--accent()"], a: 1, exp: "color: var(--accent); — le $ appartient à d'autres outils, pas au CSS natif." },
    { type: "qcm", q: "Le grand avantage des variables pour la palette :", opts: ["Le site charge plus vite", "Changer une couleur en un seul endroit recolore tout le site", "Les couleurs sont plus vives", "Aucun"], a: 1, exp: "Une seule source de vérité : fini la chasse aux #7c3aed dispersés." },
    { type: "qcm", q: "Le mini-reset de début de feuille contient typiquement…", opts: ["* { box-sizing: border-box; margin: 0; }", "* { display: none; }", "body { reset: all; }", "@reset;"], a: 0, exp: "Des boîtes prévisibles et des marges par défaut neutralisées." },
    { type: "qcm", q: "Quelle règle centre le contenu principal avec une largeur maximale ?", opts: ["main { max-width: 960px; margin: 0 auto; }", "main { text-align: center; }", "main { width: 100%; }", "main { justify-content: center; }"], a: 0, exp: "Le duo max-width + margin auto de la leçon 9." },
    { type: "qcm", q: "La grille fluide du catalogue s'écrit…", opts: ["repeat(auto-fill, minmax(220px, 1fr))", "repeat(fluid, 220px)", "auto-columns: 220px", "flex-wrap: grid"], a: 0, exp: "Autant de colonnes d'au moins 220px que possible — leçon 12." },
    { type: "qcm", q: "L'intérieur d'une carte (image, titre, texte empilés) s'organise avec…", opts: ["display: grid; 3 colonnes", "display: flex; flex-direction: column;", "float: left;", "position: absolute;"], a: 1, exp: "Un empilement = 1 dimension = Flexbox en colonne." },
    { type: "qcm", q: "En mobile-first, header et nav de la Ludothèque sont en colonne à la base, et repassent en ligne…", opts: ["Dans @media (min-width: 768px)", "Dans @media (max-width: 768px)", "Jamais", "Dans le HTML"], a: 0, exp: "min-width : on enrichit quand l'écran s'élargit." },
    { type: "qcm", q: "Une correction urgente sur la couleur des titres. Tu la ranges…", opts: ["Tout en bas du fichier, vite fait", "Dans la section typographie (ou la variable --accent)", "Dans un attribut style", "Dans un second fichier fix.css"], a: 1, exp: "Chaque règle dans sa section — c'est ce qui garde la feuille vivable." },
    { type: "vf", q: "Les media queries se placent en début de feuille, avant le reset.", a: false, exp: "En fin de feuille : la cascade leur permet alors de surcharger la base." },
    { type: "vf", q: "var(--fond) fonctionne même si --fond n'est déclarée nulle part.", a: false, exp: "La variable doit exister (dans :root en général), sinon la propriété est ignorée." },
    { type: "vf", q: "La checklist finale inclut un test à 375px de large avec l'outil appareil (F12).", a: true, exp: "Rien ne doit déborder sur un petit téléphone — le test de vérité." },
    { type: "input", q: "Quel sélecteur accueille les variables CSS globales ?", a: [":root", "root"], ph: "sélecteur…", exp: ":root { --accent: #7c3aed; }" },
    { type: "input", q: "Quelle fonction CSS lit la valeur d'une variable ?", a: ["var", "var()"], ph: "fonction…", exp: "color: var(--accent);" }
  ],
  final: {
    title: "Exercice final — Toute la semaine en cinq questions",
    intro: `<p>Le tour d'horizon complet avant d'écrire la feuille finale : sélecteurs, boîtes, typo, layout, responsive.</p>`,
    questions: [
      { type: "qcm", q: "nav a { text-decoration: none; } combine…", opts: ["Un id et une classe", "Un sélecteur descendant et une propriété de texte", "Une variable et une media query", "Du HTML et du JS"], a: 1, exp: "Leçons 8 et 10 : les liens DANS la nav perdent leur souligné." },
      { type: "qcm", q: "Une carte width:280px, padding:16px, border:1px, avec le reset border-box, occupe…", opts: ["280px", "312px", "314px", "296px"], a: 0, exp: "border-box : la largeur annoncée inclut padding et bordure — leçon 9." },
      { type: "qcm", q: "Nav horizontale : Flexbox. Catalogue en lignes ET colonnes :", opts: ["Flexbox aussi, toujours", "Grid : c'est de la 2 dimensions", "Un tableau HTML", "position: fixed"], a: 1, exp: "1D → Flexbox, 2D → Grid — leçons 11 et 12." },
      { type: "vf", q: "En mobile-first, si on supprime toutes les media queries, le site doit rester correct sur téléphone.", a: true, exp: "La base EST la version mobile ; les min-width ne font qu'enrichir — leçon 13." },
      { type: "input", q: "Complète : h1 { color: ______(--accent); }", a: ["var", "var()"], ph: "fonction…", exp: "var() lit la variable déclarée dans :root." }
    ],
    solution: `<pre class="pseudo">style.css — le plan final de la Ludothèque

/* 1 */ :root { --fond; --encre; --accent }  +  * { box-sizing; margin:0 }
/* 2 */ body { Poppins, 1rem, line-height 1.5 }  h1 2rem  h2 1.5rem
/* 3 */ header+nav en flex (colonne → ligne à 768px)
        main { max-width 960px; margin 0 auto }
        .catalogue { grid; repeat(auto-fill, minmax(220px, 1fr)); gap }
/* 4 */ .carte { flex column; fond blanc; border; padding }
        img { max-width 100%; height auto }
/* 5 */ @media (min-width: 768px) { header/nav en row }

Checklist : link OK · border-box OK · rem OK · 375px OK · contrastes OK</pre>
<p>La semaine CSS est bouclée : la Ludothèque a des couleurs, une voix et une mise en page qui tient partout. La semaine prochaine, JavaScript la rend vivante — boutons, filtres et formulaire d'avis qui réagissent.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "web-l14", title: "La feuille de style complète de la Ludothèque", level: 3,
    checklist: [
      "Les 5 sections sont-elles présentes et introduites par un commentaire de titre ?",
      "box-sizing: border-box figure-t-il en tête du reset ?",
      "Les couleurs de la palette passent-elles toutes par var(--…) (rien en dur hors :root) ?",
      "Le catalogue utilise-t-il auto-fill/minmax et le layout est-il mobile-first ?"
    ],
    statement: "C'est le livrable de la semaine : écris la feuille style.css COMPLÈTE de la Ludothèque, organisée en cinq sections commentées — 1. variables :root (fond, encre, accent) et mini-reset avec box-sizing ; 2. typographie (Google Font avec secours, tailles en rem, line-height, liens du menu sans souligné) ; 3. layout mobile-first (header et nav en flex, main centré à 960px max, catalogue en grille fluide) ; 4. composants (la carte de jeu en flex colonne avec fond, bordure et padding ; images fluides ; classe .dispo) ; 5. une media query min-width: 768px qui repasse header et nav en ligne. Chaque section commence par un commentaire de titre.",
    hints: [
      "Suis le plan à la lettre : 1 variables+reset, 2 typo, 3 layout, 4 composants, 5 media queries — les commentaires d'abord, les règles ensuite.",
      "Utilise var(--…) partout où une couleur de la palette apparaît : aucune couleur de palette en dur hors de :root.",
      "Relis avec la checklist : border-box en tête ? rem pour les tailles ? auto-fill/minmax pour le catalogue ? rien en vrac en fin de fichier ?"
    ],
    solution: "/* ===== 1. Variables et reset ===== */\n:root {\n  --fond: #f7f3ea;\n  --encre: #2c3e50;\n  --accent: #7c3aed;\n}\n* {\n  box-sizing: border-box;\n  margin: 0;\n}\n\n/* ===== 2. Typographie ===== */\nbody {\n  font-family: \"Poppins\", Arial, sans-serif;\n  font-size: 1rem;\n  line-height: 1.5;\n  background-color: var(--fond);\n  color: var(--encre);\n}\nh1 { font-size: 2rem; color: var(--accent); }\nh2 { font-size: 1.5rem; color: var(--accent); }\nnav a {\n  text-decoration: none;\n  font-weight: 700;\n  color: var(--fond);\n}\n\n/* ===== 3. Layout (mobile-first) ===== */\nheader {\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  padding: 12px 16px;\n  background-color: var(--encre);\n}\nnav {\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\nmain {\n  max-width: 960px;\n  margin: 0 auto;\n  padding: 16px;\n}\n.catalogue {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));\n  gap: 16px;\n}\n\n/* ===== 4. Composants ===== */\n.carte {\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  background-color: #ffffff;\n  border: 1px solid #d9d2c4;\n  padding: 16px;\n}\n.carte img {\n  max-width: 100%;\n  height: auto;\n}\n.dispo {\n  color: #16a34a;\n  font-weight: 700;\n}\n\n/* ===== 5. Media queries ===== */\n@media (min-width: 768px) {\n  header {\n    flex-direction: row;\n    justify-content: space-between;\n    align-items: center;\n  }\n  nav {\n    flex-direction: row;\n    gap: 16px;\n  }\n}",
    note: "Cette feuille est ta synthèse ET ton gabarit : chacune de ses cinq sections correspond à une leçon de la semaine, et sa structure se réutilise telle quelle sur n'importe quel futur projet. Garde-la précieusement — la semaine JavaScript s'appuiera dessus, notamment sur les classes comme .carte et .dispo que ton code viendra manipuler dynamiquement." }
  ]
};
</script>
<script src="exo-ecriture.js"></script>
</body>
</html>
