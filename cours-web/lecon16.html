<script>
var DAY = {
  num: 16,
  title: "Fonctions, conditions et boucles dans le navigateur",
  subtitle: "Tu connais déjà la logique — voici la syntaxe JS.",
  theory: `
<h3>1. De l'algorithmique au JavaScript</h3>
<p><strong>JavaScript</strong> (JS) est le langage de programmation qui donne vie aux pages web : là où HTML décrit le contenu et CSS l'apparence, JS agit et calcule. Au cours d'Algorithmique, tu as écrit en pseudo-code des SI…ALORS, des POUR et des fonctions. Bonne nouvelle : <strong>rien de nouveau conceptuellement</strong> aujourd'hui — seulement la traduction en JS. Un outil reviendra sans cesse : <code>console.log(...)</code>, qui écrit un message dans la <strong>console</strong>, un carnet de bord que seul le développeur voit (ouvert avec F12) — invisible pour le visiteur du site. Et pour la première fois, tes algorithmes tourneront dans un vrai programme : le catalogue de la Ludothèque.</p>

<h3>2. Les fonctions</h3>
<p>Une <strong>fonction</strong> = un bloc de code nommé, comme une recette : on lui donne des <strong>paramètres</strong> (les ingrédients en entrée) et elle renvoie un résultat via <code>return</code> :</p>
<pre class="pseudo">function estPourEnfants(ageMinimum) {   // "function" déclare une fonction ; entre () son paramètre d'entrée
  return ageMinimum &lt;= 8;               // renvoie true si ageMinimum est <= 8, sinon false
}                                        // fin de la fonction

console.log(estPourEnfants(6));    // appelle la fonction avec 6 → écrit true dans la console
console.log(estPourEnfants(14));   // appelle avec 14 → écrit false</pre>
<p><code>return</code> renvoie la valeur <strong>et sort immédiatement</strong> de la fonction. Ici le résultat est un <strong>booléen</strong> : une valeur qui ne peut valoir que <code>true</code> (vrai) ou <code>false</code> (faux), comme un interrupteur. Une fonction qui ne renvoie rien sert à « faire » quelque chose (afficher, modifier) plutôt qu'à calculer.</p>

<h3>3. Les conditions</h3>
<pre class="pseudo">const age = 10;                            // crée une variable "age" valant 10 (const = valeur qu'on ne réassigne pas)
if (age &lt;= 8) {                            // SI age est <= 8…
  console.log("Pour les enfants");         // …afficher ce texte
} else if (age &lt;= 12) {                    // SINON SI age est <= 12…
  console.log("Pour toute la famille");    // …afficher ceci
} else {                                   // SINON (tous les autres cas)…
  console.log("Ados et adultes");          // …afficher cela
}                                          // fin du bloc if / else</pre>
<p>Compare toujours avec <code>===</code> (égalité <strong>stricte</strong> : valeur ET type) plutôt que <code>==</code>, qui fait des conversions surprenantes : <code>"7" == 7</code> est vrai, <code>"7" === 7</code> est faux (un texte n'est pas un nombre). Les opérateurs logiques : <code>&amp;&amp;</code> (et), <code>||</code> (ou), <code>!</code> (non), <code>!==</code> (différent strict). Exemple : <code>duree &lt;= 30 &amp;&amp; joueursMin &gt;= 2</code>.</p>

<h3>4. Les boucles</h3>
<pre class="pseudo">for (let i = 0; i &lt; 3; i++) {              // i part de 0 ; on continue tant que i < 3 ; i++ ajoute 1 après chaque tour
  console.log("Tour numéro " + i);         // le + colle le texte et la valeur de i → affiche 0, puis 1, puis 2
}                                          // fin de la boucle for

let stock = 5;                             // variable modifiable (let) valant 5 au départ
while (stock &gt; 0) {                        // TANT QUE stock est strictement positif, répéter le bloc
  stock = stock - 1;                       // retirer 1 à stock (sans cette ligne : boucle infinie !)
}                                          // fin de la boucle while</pre>
<p><code>for</code> quand on connaît le nombre de tours, <code>while</code> quand on répète « tant que » une condition tient — exactement comme en pseudo-code. <code>let</code> crée une variable qu'on peut modifier ; <code>const</code> une valeur qu'on ne réassignera pas.</p>

<h3>5. Les tableaux : le catalogue en mémoire</h3>
<pre class="pseudo">const jeux = [                             // crée un TABLEAU (liste ordonnée) nommé "jeux", entre crochets [ ]
  { nom: "Catan", duree: 90, ageMin: 10 }, // 1er élément : un OBJET (fiche) avec 3 propriétés nom/duree/ageMin
  { nom: "Uno", duree: 20, ageMin: 7 },    // 2e élément, séparé par une virgule
  { nom: "Dixit", duree: 30, ageMin: 8 }   // 3e élément (pas de virgule après le dernier)
];                                         // fin du tableau

console.log(jeux.length);    // .length = nombre d'éléments → affiche 3
console.log(jeux[0].nom);    // jeux[0] = 1er élément ; .nom lit sa propriété → "Catan" (les indices commencent à 0)

let rapides = 0;                           // compteur de jeux rapides, initialisé à 0
for (const jeu of jeux) {                  // POUR CHAQUE "jeu" contenu dans le tableau "jeux"…
  if (jeu.duree &lt;= 30) {                   // …si la durée de ce jeu est <= 30 minutes…
    rapides = rapides + 1;                 // …ajouter 1 au compteur
  }                                        // fin du if
}                                          // fin de la boucle
console.log(rapides + " jeux rapides");    // affiche le total → "2 jeux rapides"</pre>
<p>Chaque <code>{ nom: ..., duree: ... }</code> est un <strong>objet</strong> : une fiche à plusieurs propriétés, lues avec le point (comme une case précise d'un formulaire). Un <strong>tableau</strong> est une liste numérotée dont le premier élément porte l'<strong>indice</strong> 0. <code>for...of</code> parcourt chaque élément du tableau — c'est la boucle que tu utiliseras le plus pour la Ludothèque.</p>
<div class="warn">N'utilise jamais <code>==</code> « parce que ça marche » : ses conversions implicites créent des bugs invisibles. En JS moderne, la règle est simple : <code>===</code> et <code>!==</code>, toujours.</div>
<div class="tip">Le tableau <code>jeux</code> est le cœur de la semaine : demain le DOM l'affichera dans la page, puis la recherche le filtrera, et vendredi il viendra d'une API. Garde-le sous la main.</div>
<h3>Aller plus loin — pré-incrément (++i) et post-incrément (i++)</h3>
<p>Les deux écritures ajoutent 1 à la variable ; la différence n'apparaît que lorsqu'on <strong>lit la valeur au moment même</strong> de l'incrémentation. La formule à retenir : <code>i++</code> « donne sa valeur, PUIS grandit » ; <code>++i</code> « grandit, PUIS donne sa valeur ».</p>
<pre class="pseudo">let a = 5;        // a vaut 5
let b = a++;      // POST-increment : b prend l'ANCIENNE valeur -> b = 5, et ENSUITE a passe a 6
let c = 5;        // c vaut 5
let d = ++c;      // PRE-increment : c passe d'abord a 6, PUIS d prend la NOUVELLE valeur -> d = 6</pre>
<p>Dans une boucle <code>for (i = 0; i &lt; 5; i++)</code>, on ne lit pas le résultat de <code>i++</code> : on veut seulement « ajouter 1 ». C'est pourquoi <code>i++</code> et <code>++i</code> y donnent exactement la même boucle et sont interchangeables.</p>
<h3>Inverser une condition proprement — les lois de De Morgan</h3>
<p>Pour obtenir le CONTRAIRE d'une condition composée, on ne peut pas juste coller un <code>!</code> devant sans réfléchir. Les <strong>lois de De Morgan</strong> disent comment le NON « rentre » dans la parenthèse : il inverse chaque morceau ET échange <code>&amp;&amp;</code> (ET) avec <code>||</code> (OU).</p>
<pre class="pseudo">!(a &amp;&amp; b)      // NON (A ET B)...
  =  !a || !b     // ...devient (NON A) OU (NON B)
!(a || b)      // NON (A OU B)...
  =  !a &amp;&amp; !b     // ...devient (NON A) ET (NON B)</pre>
<p>Exemple : l'inverse de « la note est valide » <code>note &gt;= 0 &amp;&amp; note &lt;= 20</code> n'est PAS <code>note &gt;= 0 || note &lt;= 20</code>, mais <code>note &lt; 0 || note &gt; 20</code> (« en dessous de 0 OU au-dessus de 20 »). Chaque comparaison s'inverse, et le ET devient OU.</p>`,
  exercises: [
    { type: "qcm", q: "Le mot-clé pour définir une fonction en JS :", opts: ["def", "function", "fonction", "proc"], a: 1, exp: "function nom(paramètres) { corps }." },
    { type: "input", q: "Quel mot-clé renvoie le résultat d'une fonction et en sort immédiatement ?", a: ["return"], ph: "mot-clé…", exp: "return renvoie la valeur et arrête la fonction." },
    { type: "qcm", q: "Que vaut \"7\" === 7 ?", opts: ["true", "false", "\"77\"", "Une erreur"], a: 1, exp: "=== compare valeur ET type : string contre number, c'est faux." },
    { type: "vf", q: "L'opérateur == compare la valeur et le type.", a: false, exp: "C'est === qui est strict ; == convertit les types, d'où les surprises." },
    { type: "qcm", q: "Que signifie l'opérateur &amp;&amp; ?", opts: ["OU logique", "ET logique", "Différent", "Concaténation"], a: 1, exp: "a &amp;&amp; b est vrai si les deux conditions sont vraies ; || est le OU." },
    { type: "qcm", q: "Avec function estPourEnfants(age) { return age &lt;= 8; }, que renvoie estPourEnfants(6) ?", opts: ["true", "false", "6", "8"], a: 0, exp: "6 &lt;= 8 est vrai : la fonction renvoie true." },
    { type: "qcm", q: "for (let i = 0; i &lt; 3; i++) { console.log(i); } affiche…", opts: ["1, 2, 3", "0, 1, 2", "0, 1, 2, 3", "Rien"], a: 1, exp: "On part de 0 et on s'arrête dès que i &lt; 3 devient faux." },
    { type: "vf", q: "Un while dont la condition ne devient jamais fausse tourne indéfiniment.", a: true, exp: "La boucle infinie : pense toujours à faire évoluer la condition dans le corps." },
    { type: "input", q: "Quelle propriété donne le nombre d'éléments d'un tableau ?", a: ["length", ".length", "array.length", "jeux.length"], ph: "propriété…", exp: "jeux.length vaut 3 pour un tableau de 3 jeux." },
    { type: "qcm", q: "Le premier élément du tableau jeux s'écrit…", opts: ["jeux[1]", "jeux[0]", "jeux.premier", "jeux(0)"], a: 1, exp: "Les indices commencent à 0, comme dans presque tous les langages." },
    { type: "qcm", q: "for (const jeu of jeux) { ... } parcourt…", opts: ["Les indices seulement", "Chaque élément du tableau, un par un", "Les propriétés d'un objet", "Le fichier HTML"], a: 1, exp: "for...of donne directement chaque élément, sans gérer d'indice." },
    { type: "qcm", q: "Pour lire le nom du premier jeu du tableau :", opts: ["jeux[0].nom", "jeux.nom[0]", "jeux[0][nom]", "nom.jeux[0]"], a: 0, exp: "Indice pour le tableau, point pour la propriété de l'objet." },
    { type: "qcm", q: "L'opérateur « différent strict » s'écrit…", opts: ["!=", "&lt;&gt;", "!==", "=/="], a: 2, exp: "!== est le pendant strict de === ; évite != comme ==." },
    { type: "vf", q: "Les concepts de cette leçon (variables, conditions, boucles) ont déjà été vus en pseudo-code au cours d'Algorithmique.", a: true, exp: "Seule la syntaxe change : la logique est la même." },
    { type: "qcm", q: "Dans un tableau de jeux dont les durées sont 90, 20 et 30 minutes, combien passent le test duree &lt;= 30 ?", opts: ["0", "1", "2", "3"], a: 2, exp: "20 et 30 : la boucle avec compteur en trouve 2." }
  ],
  final: {
    title: "Exercice final — La logique du catalogue",
    intro: `<p>Le tableau de jeux est en mémoire, les fonctions le questionnent. Vérifions.</p>`,
    questions: [
      { type: "qcm", q: "Une fonction qui répond « ce jeu convient-il aux enfants ? » doit renvoyer…", opts: ["Un boolean (true/false)", "Une string", "Un tableau", "Rien"], a: 0, exp: "Une question fermée = un booléen, facile à utiliser dans un if." },
      { type: "input", q: "La boucle qui parcourt chaque élément d'un tableau : for (const jeu ___ jeux). Quel mot manque ?", a: ["of"], ph: "mot-clé…", exp: "for...of : chaque élément, un par un." },
      { type: "qcm", q: "Pour compter les jeux rapides, on combine…", opts: ["Un compteur initialisé à 0, une boucle, un if qui incrémente", "Un seul console.log", "Une balise HTML", "Un sélecteur CSS"], a: 0, exp: "Le motif compteur, vu en Algorithmique, traduit en JS." },
      { type: "vf", q: "jeux.length renvoie le nombre de jeux du tableau.", a: true, exp: "Pratique pour afficher « 12 jeux au catalogue » — dès demain dans la page." },
      { type: "qcm", q: "duree &lt;= 30 &amp;&amp; ageMin &lt;= 8 est vrai si…", opts: ["L'une des deux conditions est vraie", "Les deux conditions sont vraies", "Aucune n'est vraie", "duree vaut exactement 30"], a: 1, exp: "&amp;&amp; exige que tout soit vrai ; || se contente d'une seule condition." }
    ],
    solution: `<pre class="pseudo">const jeux = [                             // le tableau du catalogue
  { nom: "Catan", duree: 90, ageMin: 10 }, // un jeu = un objet à 3 propriétés
  { nom: "Uno", duree: 20, ageMin: 7 },    // 2e jeu
  { nom: "Dixit", duree: 30, ageMin: 8 }   // 3e jeu (pas de virgule finale)
];                                         // fin du tableau

function estPourEnfants(jeu) {             // fonction : reçoit un jeu…
  return jeu.ageMin &lt;= 8;                  // …renvoie true si son âge minimum est <= 8
}                                          // fin de la fonction

let rapides = 0;                           // compteur à 0 (motif compteur)
for (const jeu of jeux) {                  // parcourt chaque jeu…
  if (jeu.duree &lt;= 30) { rapides++; }      // …si durée <= 30, +1 (rapides++ = rapides = rapides + 1)
}                                          // fin de la boucle
console.log(rapides + " jeux rapides sur " + jeux.length);  // affiche le bilan</pre>
<p>Le catalogue vit en mémoire… mais l'utilisateur ne voit rien. Demain, le DOM : JS met enfin la main sur la page elle-même.</p>`
  }
};
</script>

<script>

    solution: "<!-- app.js — logique métier de la Ludothèque (montré dans une balise script pour être exécuté) -->\n<script>\nconst jeux = [                                    // le tableau du catalogue\n  { nom: \"Catan\", duree: 90, ageMin: 10 },       // un jeu = un objet à 3 propriétés\n  { nom: \"Uno\", duree: 20, ageMin: 7 },          // 2e jeu\n  { nom: \"Dixit\", duree: 30, ageMin: 8 },        // 3e jeu\n  { nom: \"7 Wonders\", duree: 45, ageMin: 10 }    // 4e jeu (pas de virgule finale)\n];                                                // fin du tableau\n\nfunction estPourEnfants(jeu) {                    // fonction : reçoit un jeu…\n  return jeu.ageMin <= 8;                         // …renvoie true si son âge min est <= 8\n}                                                 // fin de la fonction\n\nfunction compterRapides(jeux) {                   // fonction : reçoit le tableau…\n  let compte = 0;                                 // compteur à 0 (motif compteur)\n  for (const jeu of jeux) {                       // parcourt chaque jeu…\n    if (jeu.duree <= 30) {                        // …si durée <= 30 min…\n      compte = compte + 1;                        // …+1 au compteur\n    }                                             // fin du if\n  }                                               // fin de la boucle\n  return compte;                                  // renvoie le total\n}                                                 // fin de la fonction\n\nfor (const jeu of jeux) {                         // affichage : pour chaque jeu…\n  let ligne = jeu.nom + \" — \" + jeu.duree + \" min\";   // construit \"Nom — 90 min\" avec des +\n  if (estPourEnfants(jeu)) {                      // si le jeu convient aux enfants…\n    ligne = ligne + \" (enfants)\";                 // …ajoute le suffixe à la ligne\n  }                                               // fin du if\n  console.log(ligne);                             // affiche la ligne dans la console\n}                                                 // fin de la boucle\n\nconsole.log(compterRapides(jeux) + \" jeux rapides\");   // affiche le nombre de jeux rapides\n<\/script>",
