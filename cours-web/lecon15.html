  title: "JavaScript dans la page : variables, types, console",

  theory: `
<h3>1. La troisième couche</h3>
<p>HTML structure le contenu, CSS le met en forme — la Ludothèque est belle, mais figée. <strong>JavaScript</strong> la rend vivante : réagir à un clic, vérifier un formulaire, charger des données. C'est la seule des trois couches qui soit un vrai <strong>langage de programmation</strong>, et tu en connais déjà la logique grâce au cours d'Algorithmique : variables, conditions, boucles. Cette semaine, tu apprends la syntaxe JS et son terrain de jeu : le navigateur.</p>

<h3>2. Où mettre le JavaScript ?</h3>
<p>Comme pour le CSS, la bonne pratique est un <strong>fichier séparé</strong>, relié à la page par une balise <code>&lt;script&gt;</code> placée <strong>en fin de <code>&lt;body&gt;</code></strong> :</p>
<pre class="pseudo">&lt;body&gt;
  &lt;h1&gt;La Ludothèque&lt;/h1&gt;
  ...tout le contenu de la page...
  &lt;script src="app.js"&gt;&lt;/script&gt;
&lt;/body&gt;</pre>
<p>Pourquoi tout en bas ? Le navigateur lit la page de haut en bas : si le script s'exécute avant que le HTML existe, il ne trouve rien à manipuler. Alternative moderne : la balise dans le <code>&lt;head&gt;</code> avec l'attribut <code>defer</code> (« télécharge maintenant, exécute après le HTML »). Le fichier <code>app.js</code> ne contient <strong>que</strong> du JavaScript, sans aucune balise.</p>

<h3>3. La console : ton meilleur ami</h3>
<p>Appuie sur <strong>F12</strong> (ou clic droit → Inspecter), onglet <strong>Console</strong>. C'est là que JS te parle : résultats, messages… et erreurs. L'instruction <code>console.log(...)</code> y affiche ce que tu veux :</p>
<pre class="pseudo">console.log("Bienvenue à la Ludothèque !");
console.log(3 + 4);      // 7</pre>
<p>Premier réflexe du développeur front-end : coder avec la console ouverte en permanence.</p>

<h3>4. Variables et types</h3>
<p>Deux mots-clés pour déclarer : <code>const</code> (ne sera jamais réassignée) et <code>let</code> (pourra changer). <strong>Règle : const par défaut</strong>, let seulement si la valeur doit évoluer.</p>
<pre class="pseudo">const nomSite = "La Ludothèque";   // string  (texte, entre guillemets)
let nbJeux = 12;                   // number  (entier ou décimal)
const estOuverte = true;           // boolean (true ou false)

nbJeux = 13;         // OK : c'est un let
nomSite = "Autre";   // ERREUR : on ne réassigne pas une const</pre>

<h3>5. Opérations, concaténation, typeof</h3>
<pre class="pseudo">console.log(nbJeux * 2);                          // 26
console.log("Bienvenue sur " + nomSite + " !");   // concaténation avec +
console.log("Nous avons " + nbJeux + " jeux.");   // texte + nombre
console.log(typeof nomSite);                      // "string"
console.log(typeof nbJeux);                       // "number"</pre>
<p>Piège classique : <code>"7" + 2</code> donne <code>"72"</code> — si l'un des deux est un texte, <code>+</code> colle au lieu d'additionner. Il existe une écriture moderne (les template literals) pour insérer des variables dans un texte ; nous restons sur <code>+</code>, simple et universel. Notre premier script Ludothèque tient en trois lignes : le nom du site, le nombre de jeux, un message d'accueil dans la console de la page d'accueil.</p>
<div class="warn">Une erreur rouge dans la console n'est pas un échec, c'est une information : fichier, ligne, cause (ex. <code>nbJeu is not defined</code> = variable inconnue, souvent une faute de frappe). Lis-la toujours en entier avant de chercher au hasard.</div>
<div class="tip">Mets des <code>console.log</code> partout pendant que tu apprends : afficher une valeur à chaque étape est le moyen le plus rapide de comprendre ce que fait ton code.</div>`,

    { type: "vf", q: "JavaScript ne fonctionne dans le navigateur que si l'on est connecté à internet.", a: false, exp: "Le script s'exécute localement dans le navigateur, connexion ou pas." }
  ],

    solution: `<pre class="pseudo">&lt;script src="app.js"&gt;&lt;/script&gt;   ← en fin de body (ou defer dans le head)

let nbJeux = 12;

const par défaut, let si la valeur évolue
types : string, number, boolean — typeof pour vérifier
console (F12) : résultats, messages… et erreurs à lire en entier</pre>
