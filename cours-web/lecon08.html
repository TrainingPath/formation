<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leçon 8</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
var DAY = {
  num: 8,
  title: "Le CSS : sélecteurs, propriétés, couleurs",
  subtitle: "Ton HTML est solide. Cette semaine, on le rend beau — et ça commence par la couleur.",
  theory: `
<h3>1. Trois façons d'ajouter du CSS</h3>
<p>Le CSS (<strong>Cascading Style Sheets</strong>) décrit l'apparence de ton HTML : couleurs, tailles, espacements, mise en page. Il y a trois façons de l'écrire :</p>
<pre class="pseudo">&lt;!-- 1. Inline : dans l'attribut style — à éviter --&gt;
&lt;p style="color: red;"&gt;Un paragraphe rouge&lt;/p&gt;

&lt;!-- 2. Balise &lt;style&gt; dans le &lt;head&gt; — dépannage --&gt;
&lt;style&gt;
  p { color: red; }
&lt;/style&gt;

&lt;!-- 3. Fichier externe lié — LE bon choix --&gt;
&lt;link rel="stylesheet" href="style.css"&gt;</pre>
<p>Le fichier externe gagne toujours : <strong>un seul fichier <code>style.css</code></strong> stylera toutes les pages de la Ludothèque. Tu changes une couleur à un endroit, tout le site suit. Ajoute la balise <code>&lt;link&gt;</code> dans le <code>&lt;head&gt;</code> de chaque page.</p>

<h3>2. La syntaxe : sélecteur { propriété: valeur; }</h3>
<p>Une règle CSS dit <strong>qui</strong> styler (le sélecteur) et <strong>quoi</strong> changer (les déclarations) :</p>
<pre class="pseudo">h1 {
  color: darkslateblue;        /* une déclaration */
  background-color: ivory;     /* une autre */
}</pre>
<p>Chaque déclaration se termine par un <strong>point-virgule</strong>. Oublier une accolade ou un <code>;</code> est LA panne classique du débutant : le navigateur ignore alors silencieusement la suite de la règle.</p>

<h3>3. Les sélecteurs essentiels</h3>
<pre class="pseudo">h2       { color: teal; }      /* élément : tous les &lt;h2&gt; */
.carte   { background: white; } /* classe : class="carte" */
#entete  { background: navy; }  /* id : id="entete" (unique !) */
nav a    { color: white; }      /* descendant : les &lt;a&gt; DANS &lt;nav&gt; */</pre>
<p>Retiens : <code>.</code> pour une <strong>classe</strong> (réutilisable à volonté), <code>#</code> pour un <strong>id</strong> (un seul par page), un <strong>espace</strong> pour cibler un élément à l'intérieur d'un autre. Le sélecteur descendant est précieux : <code>nav a</code> style les liens du menu sans toucher aux autres liens du site.</p>

<h3>4. Les couleurs : color et background-color</h3>
<p><code>color</code> colore le <strong>texte</strong>, <code>background-color</code> colore le <strong>fond</strong>. Trois notations :</p>
<pre class="pseudo">p { color: tomato; }               /* nom prédéfini (~140 noms) */
p { color: #2c3e50; }              /* hexadécimal : #RougeVertBleu */
p { color: rgb(44, 62, 80); }      /* rgb : 0 à 255 par canal */</pre>
<p>En pratique, on copie souvent des codes <strong>#hex</strong> depuis une palette ou l'outil pipette du navigateur. <code>#ffffff</code> = blanc, <code>#000000</code> = noir.</p>

<h3>5. La cascade et la spécificité, en douceur</h3>
<p>Si deux règles visent le même élément, qui gagne ? Deux principes simples suffisent pour l'instant : à force égale, <strong>la règle écrite en dernier</strong> l'emporte (c'est la « cascade ») ; sinon, <strong>le sélecteur le plus précis</strong> gagne : <code>#id</code> bat <code>.classe</code>, qui bat <code>élément</code>. C'est la « spécificité ».</p>
<pre class="pseudo">/* style.css de la Ludothèque — premières couleurs */
body    { background-color: #f7f3ea; color: #2c3e50; }
h1, h2  { color: #7c3aed; }
#entete { background-color: #2c3e50; }
nav a   { color: #f7f3ea; }
.dispo  { color: #16a34a; }   /* jeux disponibles en vert */</pre>
<div class="warn">Un <code>id</code> est <strong>unique</strong> dans la page et sa spécificité est très forte : une règle <code>#id</code> est difficile à surpasser ensuite. Prends l'habitude de styler avec des <strong>classes</strong>, garde les id pour les ancres et les grands blocs uniques.</div>
<div class="tip">Ouvre les outils de développement (<strong>F12</strong>), clique sur un élément avec l'inspecteur : tu vois les règles CSS appliquées et tu peux modifier les couleurs en direct. C'est le meilleur terrain d'essai qui existe.</div>`,
  exercises: [
    { type: "qcm", q: "La meilleure façon d'ajouter du CSS à un site de plusieurs pages :", opts: ["L'attribut style sur chaque balise", "Une balise &lt;style&gt; par page", "Un fichier .css lié par &lt;link&gt;", "Un fichier .js"], a: 2, exp: "Un seul fichier style.css pour tout le site : une modification, tout suit." },
    { type: "qcm", q: "Dans quelle partie de la page place-t-on &lt;link rel=\"stylesheet\" href=\"style.css\"&gt; ?", opts: ["Dans le &lt;head&gt;", "Tout en bas du &lt;body&gt;", "Dans le &lt;footer&gt;", "Peu importe"], a: 0, exp: "Le head contient les métadonnées et les liens vers les ressources." },
    { type: "qcm", q: "La syntaxe correcte d'une règle CSS :", opts: ["h1 (color = red)", "h1 { color: red; }", "h1 [color: red]", "color h1 = red;"], a: 1, exp: "sélecteur { propriété: valeur; } — accolades, deux-points, point-virgule." },
    { type: "qcm", q: "Le sélecteur .carte cible…", opts: ["La balise &lt;carte&gt;", "Tous les éléments avec class=\"carte\"", "L'élément avec id=\"carte\"", "Le premier élément de la page"], a: 1, exp: "Le point = sélecteur de classe, réutilisable sur autant d'éléments que tu veux." },
    { type: "qcm", q: "Le sélecteur #entete cible…", opts: ["Toutes les classes entete", "L'élément unique avec id=\"entete\"", "Tous les &lt;header&gt;", "Un commentaire"], a: 1, exp: "Le dièse = sélecteur d'id, un seul par page." },
    { type: "qcm", q: "Que cible le sélecteur nav a ?", opts: ["Les &lt;nav&gt; et les &lt;a&gt; séparément", "Les &lt;a&gt; situés à l'intérieur d'un &lt;nav&gt;", "Le premier lien de la page", "Les &lt;nav&gt; qui contiennent un lien"], a: 1, exp: "L'espace = sélecteur descendant : les liens DANS la nav, et eux seuls." },
    { type: "vf", q: "Un même id peut être utilisé sur plusieurs éléments de la même page.", a: false, exp: "Un id est unique par page. Pour réutiliser, c'est la classe qu'il faut." },
    { type: "qcm", q: "Quelle propriété change la couleur de FOND d'un élément ?", opts: ["color", "background-color", "fill", "bgcolor"], a: 1, exp: "color = le texte, background-color = le fond." },
    { type: "qcm", q: "#ffffff correspond à…", opts: ["Du noir", "Du blanc", "Du rouge", "Une erreur de syntaxe"], a: 1, exp: "Rouge, vert et bleu au maximum (ff) = blanc. #000000 = noir." },
    { type: "qcm", q: "rgb(255, 0, 0) donne…", opts: ["Du bleu", "Du vert", "Du rouge", "Du gris"], a: 2, exp: "Le premier canal est le Rouge, ici au maximum, les deux autres à zéro." },
    { type: "qcm", q: "Deux règles de même force ciblent le même h1. Laquelle gagne ?", opts: ["La première écrite", "La dernière écrite", "Aucune, erreur", "La plus courte"], a: 1, exp: "C'est la cascade : à spécificité égale, la dernière règle l'emporte." },
    { type: "vf", q: "Une règle avec .classe est plus forte qu'une règle avec #id.", a: false, exp: "C'est l'inverse : id bat classe, qui bat le sélecteur d'élément." },
    { type: "input", q: "Quelle propriété CSS change la couleur du texte ?", a: ["color"], ph: "propriété…", exp: "color: teal; — à ne pas confondre avec background-color." },
    { type: "input", q: "Écris le sélecteur qui cible tous les éléments ayant class=\"dispo\".", a: [".dispo"], ph: ". suivi du nom…", exp: "Un point puis le nom de la classe : .dispo" },
    { type: "input", q: "Quelle balise HTML (sans chevrons) lie un fichier CSS externe à la page ?", a: ["link"], ph: "nom de la balise…", exp: "&lt;link rel=\"stylesheet\" href=\"style.css\"&gt; dans le head." }
  ],
  final: {
    title: "Exercice final — Les premières couleurs de la Ludothèque",
    intro: `<p>Le fichier style.css est créé et lié : vérifions que tu sais exactement qui cible quoi.</p>`,
    questions: [
      { type: "qcm", q: "Pour colorer les liens du menu SANS toucher aux autres liens du site :", opts: ["a { color: white; }", "nav a { color: white; }", "#a { color: white; }", ".a { color: white; }"], a: 1, exp: "Le sélecteur descendant limite la règle aux liens dans la nav." },
      { type: "qcm", q: "Dix cartes de jeu doivent avoir le même fond blanc. Tu utilises…", opts: ["Dix id différents", "Une classe .carte commune", "Dix attributs style", "Une balise &lt;style&gt; par carte"], a: 1, exp: "La classe est faite pour être partagée : une règle, dix cartes." },
      { type: "vf", q: "body { background-color: #f7f3ea; } colore le fond de toute la page.", a: true, exp: "Styler body est la façon standard de donner sa couleur de fond au site." },
      { type: "input", q: "Complète : h1 { ______: #7c3aed; } pour colorer le texte des titres.", a: ["color"], ph: "propriété…", exp: "color agit sur le texte de l'élément." },
      { type: "qcm", q: "Une règle p { color: red; } et une règle .intro { color: blue; } visent le même paragraphe class=\"intro\". Il sera…", opts: ["Rouge", "Bleu", "Violet", "Sans couleur"], a: 1, exp: "La classe est plus spécifique que le sélecteur d'élément : le bleu gagne." }
    ],
    solution: `<pre class="pseudo">/* style.css — lié dans le &lt;head&gt; de chaque page :
   &lt;link rel="stylesheet" href="style.css"&gt; */

body    { background-color: #f7f3ea; color: #2c3e50; }
h1, h2  { color: #7c3aed; }
#entete { background-color: #2c3e50; }
nav a   { color: #f7f3ea; }
.dispo  { color: #16a34a; }

Sélecteurs : élément  .classe  #id  ancêtre descendant
Cascade    : plus précis gagne ; à égalité, le dernier écrit gagne.</pre>
<p>Le site a ses couleurs. Demain, on donne de l'air : marges, bordures et espacements avec le modèle de boîte.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "web-l8", title: "La palette de la Ludothèque", level: 1,
    checklist: [
      "Chaque couleur est-elle en notation #hex et justifiée en une ligne ?",
      "Le contraste texte / fond reste-t-il lisible (foncé sur clair ou l'inverse) ?",
      "Les liens du menu sont-ils ciblés par un sélecteur descendant (nav a) et non tous les a ?",
      "N'as-tu pas multiplié les couleurs d'accent (une seule bien choisie suffit) ?"
    ],
    statement: "Rédige le mini « guide couleurs » de la Ludothèque : choisis une couleur de fond de page, une couleur de texte, une couleur d'accent (titres et liens) et une couleur de fond pour l'en-tête, chacune en notation #hex. Pour chaque couleur, écris une ligne justifiant ton choix (lisibilité, ambiance jeu de société…). Termine par les règles CSS correspondantes : fond et texte du body, couleur des h1/h2, fond de l'en-tête (id entete), couleur des liens du menu via un sélecteur descendant.",
    hints: [
      "Contraste d'abord : texte foncé sur fond clair (ou l'inverse) — vérifie que ça reste lisible.",
      "Une seule couleur d'accent bien choisie suffit ; trop de couleurs = site brouillon.",
      "Pour les liens du menu, pense au sélecteur descendant : nav a { … }."
    ],
    solution: "GUIDE COULEURS — Ludothèque\n\n#f7f3ea  fond de page   : crème chaleureux, évoque le carton des boîtes de jeu\n#2c3e50  texte + entête : bleu ardoise foncé, contraste fort et lisible\n#7c3aed  accent         : violet ludique pour les titres, identifiable partout\n#f7f3ea  liens du menu  : clair sur l'en-tête foncé, lisibles d'un coup d'œil\n\n/* style.css */\nbody {\n  background-color: #f7f3ea;\n  color: #2c3e50;\n}\nh1, h2 {\n  color: #7c3aed;\n}\n#entete {\n  background-color: #2c3e50;\n}\nnav a {\n  color: #f7f3ea;\n}",
    note: "Choisir et justifier une palette est un vrai livrable de projet : dans une équipe, ce guide devient la référence que tout le monde applique. Tu verras en leçon 14 comment transformer ces couleurs en variables CSS pour ne les définir qu'une seule fois — exactement le réflexe « pas de duplication » que tu retrouveras aussi en programmation." }
  ]
};
</script>
