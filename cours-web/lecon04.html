<script>
var DAY = {
  num: 4,
  title: "La structure sémantique : header, nav, main, footer",
  subtitle: "Des balises qui disent CE QU'ELLES SONT : la charpente de toute page pro.",
  theory: `
<h3>1. Pourquoi la sémantique ?</h3>
<p>Le mot <strong>sémantique</strong> vient de « sens » : une balise sémantique est une balise dont le <em>nom</em> décrit le rôle de la zone qu'elle entoure. Jusqu'ici, nos balises décrivaient de petits contenus (un titre, une liste). Les balises sémantiques décrivent les <strong>grandes zones</strong> de la page : « ceci est l'en-tête », « ceci est le menu ». C'est comme étiqueter les pièces d'une maison sur un plan : « cuisine », « chambre », plutôt que d'écrire partout « pièce ». Trois raisons d'y tenir :</p>
<pre class="pseudo">Lisibilité     → toi (et tes collègues) comprenez le code d'un coup d'œil
Accessibilité  → un lecteur d'écran saute directement au menu ou au contenu
Référencement  → Google identifie le contenu principal et le classe mieux</pre>
<p>Deux termes à définir ici. L'<strong>accessibilité</strong> : le fait qu'une page reste utilisable par tout le monde, y compris les personnes qui n'y voient pas et écoutent la page via un lecteur d'écran, ou qui naviguent au clavier sans souris. Le <strong>référencement</strong> (souvent appelé <em>SEO</em>) : la façon dont les moteurs de recherche comme Google comprennent et classent ta page dans leurs résultats. Une page peut fonctionner sans ces balises — mais elle sera plus dure à lire, à naviguer sans souris, et moins bien référencée. La sémantique, c'est la différence entre du HTML qui marche et du HTML <strong>professionnel</strong>.</p>

<h3>2. header, nav, footer</h3>
<p><code>&lt;header&gt;</code> est l'<strong>en-tête</strong> : logo, nom du site, souvent le menu. <code>&lt;nav&gt;</code> englobe la <strong>navigation principale</strong> — classiquement une liste de liens (un <strong>lien</strong>, balise <code>&lt;a&gt;</code>, est un mot cliquable qui mène ailleurs). <code>&lt;footer&gt;</code> est le <strong>pied de page</strong> : contact, mentions, crédits.</p>
<pre class="pseudo">&lt;header&gt;                                       &lt;!-- &lt;header&gt; : l'en-tête visible (nom du site, menu) --&gt;
  &lt;h1&gt;La Ludothèque&lt;/h1&gt;                        &lt;!-- le nom du site, en titre principal --&gt;
  &lt;nav&gt;                                        &lt;!-- &lt;nav&gt; : la zone de navigation principale --&gt;
    &lt;ul&gt;                                       &lt;!-- un menu est, en réalité, une LISTE de liens --&gt;
      &lt;li&gt;&lt;a href="index.html"&gt;Accueil&lt;/a&gt;&lt;/li&gt;    &lt;!-- &lt;a&gt; = lien ; href = l'adresse de destination --&gt;
      &lt;li&gt;&lt;a href="jeux.html"&gt;Nos jeux&lt;/a&gt;&lt;/li&gt;      &lt;!-- un second lien vers une autre page du site --&gt;
    &lt;/ul&gt;                                      &lt;!-- fin de la liste de liens --&gt;
  &lt;/nav&gt;                                       &lt;!-- fin de la navigation --&gt;
&lt;/header&gt;                                       &lt;!-- fin de l'en-tête --&gt;

&lt;footer&gt;                                       &lt;!-- &lt;footer&gt; : le pied de page --&gt;
  &lt;p&gt;La Ludothèque — 12 rue des Jeux, Bruxelles&lt;/p&gt;   &lt;!-- coordonnées et mentions --&gt;
&lt;/footer&gt;                                       &lt;!-- fin du pied de page --&gt;</pre>
<p>Note le motif du menu : un <code>&lt;nav&gt;</code> qui contient un <code>&lt;ul&gt;</code> de liens. C'est LE standard — un menu est, sémantiquement, une liste de destinations.</p>

<h3>3. main, section, article</h3>
<p><code>&lt;main&gt;</code> contient le <strong>contenu principal</strong> de la page — ce qui la rend unique, hors en-tête et pied de page. Règle stricte : <strong>un seul <code>&lt;main&gt;</code> par page</strong>. À l'intérieur : <code>&lt;section&gt;</code> regroupe un ensemble thématique (idéalement avec son titre <code>&lt;h2&gt;</code>), et <code>&lt;article&gt;</code> désigne un contenu <strong>autonome</strong>, qui aurait du sens sorti de la page — chez nous, chaque fiche de jeu (comme un article de journal qu'on pourrait découper et lire seul).</p>
<pre class="pseudo">&lt;main&gt;                             &lt;!-- &lt;main&gt; : LE contenu principal, unique dans la page --&gt;
  &lt;section&gt;                         &lt;!-- &lt;section&gt; : un regroupement thématique --&gt;
    &lt;h2&gt;Nos jeux phares&lt;/h2&gt;         &lt;!-- le titre de la section --&gt;
    &lt;article&gt;                       &lt;!-- &lt;article&gt; : contenu AUTONOME (une fiche de jeu) --&gt;
      &lt;h3&gt;Catan&lt;/h3&gt;                &lt;!-- titre de la fiche --&gt;
      &lt;p&gt;Le classique de la stratégie…&lt;/p&gt;   &lt;!-- description du jeu --&gt;
    &lt;/article&gt;                      &lt;!-- fin de la 1re fiche --&gt;
    &lt;article&gt;                       &lt;!-- une 2e fiche, tout aussi autonome --&gt;
      &lt;h3&gt;Azul&lt;/h3&gt;                 &lt;!-- titre de la fiche --&gt;
      &lt;p&gt;Le plus beau des jeux de tuiles…&lt;/p&gt;   &lt;!-- description du jeu --&gt;
    &lt;/article&gt;                      &lt;!-- fin de la 2e fiche --&gt;
  &lt;/section&gt;                        &lt;!-- fin de la section --&gt;
&lt;/main&gt;                             &lt;!-- fin du contenu principal --&gt;</pre>

<h3>4. aside et div : les deux derniers outils</h3>
<p><code>&lt;aside&gt;</code> contient un contenu <strong>complémentaire</strong>, en marge du sujet principal : encart « le saviez-vous ? », liens connexes (comme un encadré dans la marge d'un magazine). Et <code>&lt;div&gt;</code> ? C'est la boîte <strong>sans aucun sens</strong> (<em>division</em>) : elle groupe des éléments, sans rien dire de plus — un simple carton de déménagement anonyme. Règle simple :</p>
<pre class="pseudo">Il existe une balise qui décrit ma zone ?  → je l'utilise
   (header, nav, main, section, article, aside, footer)
Aucune ne convient, je groupe juste pour le style ?  → div, en DERNIER recours</pre>
<p>Une page faite uniquement de <code>&lt;div&gt;</code> (la « div-ite ») fonctionne, mais elle est muette pour les lecteurs d'écran et pénible à maintenir.</p>

<h3>5. Le squelette commun de la Ludothèque</h3>
<p>Assemblons la charpente que <strong>toutes</strong> les pages du site vont partager — seul le contenu du <code>&lt;main&gt;</code> changera d'une page à l'autre :</p>
<pre class="pseudo">&lt;body&gt;                                          &lt;!-- corps visible de la page --&gt;
  &lt;header&gt;                                      &lt;!-- en-tête, IDENTIQUE sur toutes les pages --&gt;
    &lt;h1&gt;La Ludothèque&lt;/h1&gt;                       &lt;!-- nom du site --&gt;
    &lt;nav&gt;                                       &lt;!-- menu principal --&gt;
      &lt;ul&gt;                                      &lt;!-- liste des liens --&gt;
        &lt;li&gt;&lt;a href="index.html"&gt;Accueil&lt;/a&gt;&lt;/li&gt;   &lt;!-- lien vers l'accueil --&gt;
        &lt;li&gt;&lt;a href="jeux.html"&gt;Nos jeux&lt;/a&gt;&lt;/li&gt;     &lt;!-- lien vers la page des jeux --&gt;
      &lt;/ul&gt;                                     &lt;!-- fin de la liste --&gt;
    &lt;/nav&gt;                                      &lt;!-- fin du menu --&gt;
  &lt;/header&gt;                                      &lt;!-- fin de l'en-tête --&gt;

  &lt;main&gt;                                        &lt;!-- zone qui CHANGE d'une page à l'autre --&gt;
    &lt;!-- le contenu propre à chaque page --&gt;      &lt;!-- ici viendra le contenu spécifique de la page --&gt;
  &lt;/main&gt;                                        &lt;!-- fin du contenu principal --&gt;

  &lt;footer&gt;                                      &lt;!-- pied de page, identique partout --&gt;
    &lt;p&gt;La Ludothèque — 12 rue des Jeux, Bruxelles&lt;/p&gt;   &lt;!-- coordonnées --&gt;
  &lt;/footer&gt;                                      &lt;!-- fin du pied de page --&gt;
&lt;/body&gt;                                          &lt;!-- fin du corps --&gt;</pre>
<p>Applique ce squelette à <code>index.html</code> et <code>jeux.html</code> : mêmes header, nav et footer partout, et le contenu existant (présentation, liste, photo) déménage dans le <code>&lt;main&gt;</code>. Le site devient cohérent de page en page.</p>
<div class="warn">Les balises sémantiques n'ont <strong>aucun effet visuel</strong> par défaut : ta page semble identique après la refonte. C'est normal ! Leur valeur est dans le sens qu'elles portent — machines et humains liront ta page bien mieux, et le CSS de la semaine prochaine s'y accrochera naturellement.</div>
<div class="tip">Test rapide de ta structure : plisse les yeux et demande-toi « si je supprimais tout le texte, saurait-on encore où sont le menu, le contenu et le pied de page ? ». Si oui, ta charpente parle d'elle-même.</div>`,
  exercises: [
    { type: "qcm", q: "Une balise « sémantique », c'est une balise qui…", opts: ["Change la couleur du texte", "Décrit le SENS de la zone qu'elle contient", "Accélère le chargement", "Contient du JavaScript"], a: 1, exp: "header, nav, main… disent ce qu'elles sont, pour les humains et les machines." },
    { type: "qcm", q: "Lequel n'est PAS un bénéfice de la sémantique ?", opts: ["Meilleure accessibilité", "Meilleur référencement", "Code plus lisible", "Pages plus colorées"], a: 3, exp: "Aucun effet visuel : la valeur est dans le sens, pas dans le style." },
    { type: "qcm", q: "La balise pour l'en-tête du site (logo, nom, menu) :", opts: ["&lt;head&gt;", "&lt;header&gt;", "&lt;top&gt;", "&lt;h1&gt;"], a: 1, exp: "Attention au piège : head = infos invisibles, header = en-tête visible du body." },
    { type: "vf", q: "&lt;head&gt; et &lt;header&gt; sont deux noms pour la même balise.", a: false, exp: "head vit hors du body (charset, title) ; header est l'en-tête affiché de la page." },
    { type: "input", q: "Nom de la balise qui englobe le menu de navigation principal, sans les chevrons :", a: ["nav", "<nav>"], ph: "nom de la balise…", exp: "nav, contenant classiquement un ul de liens." },
    { type: "qcm", q: "Le motif standard d'un menu de navigation :", opts: ["&lt;nav&gt; contenant un &lt;ul&gt; de liens", "Des &lt;br&gt; entre des liens", "Un &lt;table&gt; de liens", "Des &lt;h2&gt; cliquables"], a: 0, exp: "Un menu est sémantiquement une liste de destinations." },
    { type: "qcm", q: "Combien de &lt;main&gt; par page ?", opts: ["Un par section", "Exactement un", "Deux minimum", "Autant qu'on veut"], a: 1, exp: "Un seul contenu principal par page — comme le h1." },
    { type: "qcm", q: "Quelle balise pour un contenu AUTONOME, qui garderait son sens sorti de la page (une fiche de jeu) ?", opts: ["&lt;section&gt;", "&lt;article&gt;", "&lt;aside&gt;", "&lt;div&gt;"], a: 1, exp: "article = autonome ; section = regroupement thématique dans la page." },
    { type: "qcm", q: "Un encart « Le saviez-vous ? » en marge du contenu va dans…", opts: ["&lt;main&gt;", "&lt;aside&gt;", "&lt;footer&gt;", "&lt;nav&gt;"], a: 1, exp: "aside = contenu complémentaire, en marge du sujet principal." },
    { type: "vf", q: "Chaque &lt;section&gt; a idéalement son propre titre (h2, h3…).", a: true, exp: "Une section sans titre est souvent le signe qu'une autre balise conviendrait mieux." },
    { type: "qcm", q: "Quand utiliser &lt;div&gt; ?", opts: ["Partout, c'est plus simple", "En dernier recours, quand aucune balise sémantique ne convient", "Jamais, elle est interdite", "Uniquement dans le head"], a: 1, exp: "div groupe sans porter de sens : on la garde pour les cas où rien d'autre ne colle." },
    { type: "qcm", q: "Adresse et mentions légales du site vont dans…", opts: ["&lt;header&gt;", "&lt;footer&gt;", "&lt;nav&gt;", "&lt;aside&gt;"], a: 1, exp: "Le pied de page : contact, crédits, mentions." },
    { type: "input", q: "Nom de la balise qui contient le contenu principal unique de la page, sans les chevrons :", a: ["main", "<main>"], ph: "nom de la balise…", exp: "main : tout ce qui rend la page unique, hors header/footer." },
    { type: "vf", q: "Après avoir ajouté header, main et footer, l'apparence de la page change immédiatement.", a: false, exp: "Aucun style par défaut : le bénéfice est sémantique, le style viendra du CSS." },
    { type: "qcm", q: "Dans le squelette commun de la Ludothèque, qu'est-ce qui change d'une page à l'autre ?", opts: ["Le header", "Le contenu du &lt;main&gt;", "Le footer", "Le &lt;nav&gt;"], a: 1, exp: "header, nav et footer sont identiques partout : seul le main est propre à chaque page." }
  ],
  final: {
    title: "Exercice final — La charpente en place",
    intro: `<p>Chaque zone à sa place : vérifie que tu sais ranger une page entière dans les bonnes balises.</p>`,
    questions: [
      { type: "qcm", q: "L'ordre des grandes zones dans le body de la Ludothèque :", opts: ["main, header, footer", "header, main, footer", "footer, main, header", "nav, footer, main"], a: 1, exp: "En-tête, contenu principal, pied de page : l'ordre de lecture naturel." },
      { type: "qcm", q: "Le menu (nav) de la Ludothèque est placé…", opts: ["Dans le &lt;header&gt;", "Dans le &lt;footer&gt;", "Dans le &lt;head&gt;", "Après le &lt;/html&gt;"], a: 0, exp: "Le menu principal accompagne classiquement l'en-tête." },
      { type: "vf", q: "Sur la page jeux.html, chaque jeu présenté peut être un &lt;article&gt; dans une &lt;section&gt;.", a: true, exp: "Chaque fiche est autonome (article), regroupée thématiquement (section)." },
      { type: "input", q: "Nom de la balise « boîte neutre » à n'utiliser qu'en dernier recours, sans les chevrons :", a: ["div", "<div>"], ph: "nom de la balise…", exp: "div ne dit rien : d'abord chercher une balise qui a du sens." },
      { type: "qcm", q: "Pourquoi un lecteur d'écran profite-t-il de la sémantique ?", opts: ["Il lit plus fort", "Il peut sauter directement au menu ou au contenu principal", "Il traduit la page", "Il corrige les fautes"], a: 1, exp: "Les zones nommées permettent une navigation directe, sans tout écouter." }
    ],
    solution: `<pre class="pseudo">&lt;body&gt;
  &lt;header&gt;   logo/nom du site + &lt;nav&gt; (ul de liens)
  &lt;main&gt;     LE contenu de la page (un seul par page)
    &lt;section&gt;  un regroupement thématique, avec son titre
      &lt;article&gt; un contenu autonome (une fiche de jeu)
    &lt;aside&gt;    le complément en marge
  &lt;footer&gt;   contact, mentions
&lt;/body&gt;
&lt;div&gt; = boîte sans sens, en dernier recours.

Ludothèque : index.html et jeux.html partagent le même squelette ;
seul le contenu du main change.</pre>
<p>La charpente est posée. Demain, on y range des données bien alignées : les tableaux, pour le catalogue complet des jeux.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "web-l4", title: "La refonte sémantique", level: 2,
    statement: "Voici une page écrite « à l'ancienne », tout en &lt;div&gt; : une div \"haut\" avec le nom du site et trois liens, une div \"contenu\" avec un h1, deux blocs de jeux (titre + description chacun) et un encart \"Le saviez-vous ?\", une div \"bas\" avec l'adresse. Réécris ce body en HTML sémantique : choisis la bonne balise pour CHAQUE zone, puis justifie en 3 à 4 phrases deux de tes choix (par exemple pourquoi article et pas section pour les jeux, pourquoi aside pour l'encart).",
    hints: [
      "div \"haut\" = header (avec un nav pour les liens) ; div \"bas\" = footer ; div \"contenu\" = main.",

      "L'encart \"Le saviez-vous ?\" est en marge du sujet → aside. Il ne devrait plus rester une seule div."
    ],
    solution: "<body>\n  <header>                                       <!-- l'ancienne div \"haut\" devient un en-tete semantique -->\n    <p>La Ludothèque</p>                          <!-- le nom du site -->\n    <nav>                                        <!-- les liens = navigation principale -->\n      <ul>                                       <!-- un menu est une liste de liens -->\n        <li><a href=\"index.html\">Accueil</a></li>   <!-- lien vers l'accueil (href = destination) -->\n        <li><a href=\"jeux.html\">Nos jeux</a></li>     <!-- lien vers la page des jeux -->\n        <li><a href=\"avis.html\">Donner un avis</a></li>  <!-- lien vers la page d'avis -->\n      </ul>                                      <!-- fin de la liste -->\n    </nav>                                       <!-- fin de la navigation -->\n  </header>                                      <!-- fin de l'en-tete -->\n\n  <main>                                         <!-- l'ancienne div \"contenu\" devient le contenu principal -->\n    <h1>Nos jeux du moment</h1>                   <!-- titre principal unique de la page -->\n    <section>                                    <!-- regroupement thematique : la selection -->\n      <h2>Sélection</h2>                          <!-- titre de la section -->\n      <article>                                  <!-- fiche AUTONOME : garde son sens hors de la page -->\n        <h3>Catan</h3>                            <!-- titre de la fiche -->\n        <p>Le classique de la stratégie et du commerce.</p>   <!-- description -->\n      </article>                                 <!-- fin de la 1re fiche -->\n      <article>                                  <!-- 2e fiche, tout aussi autonome -->\n        <h3>Azul</h3>                             <!-- titre de la fiche -->\n        <p>Un superbe jeu de tuiles, simple et malin.</p>   <!-- description -->\n      </article>                                 <!-- fin de la 2e fiche -->\n    </section>                                   <!-- fin de la section -->\n    <aside>                                      <!-- encart COMPLEMENTAIRE, en marge du sujet -->\n      <h2>Le saviez-vous ?</h2>                   <!-- titre de l'encart -->\n      <p>Catan s'est vendu à plus de 40 millions d'exemplaires.</p>   <!-- anecdote -->\n    </aside>                                     <!-- fin de l'encart -->\n  </main>                                        <!-- fin du contenu principal -->\n\n  <footer>                                       <!-- l'ancienne div \"bas\" devient le pied de page -->\n    <p>La Ludothèque — 12 rue des Jeux, Bruxelles</p>   <!-- coordonnees -->\n  </footer>                                      <!-- fin du pied de page -->\n</body>\n\nJustifications (exemple) :\n- article et pas section pour chaque jeu : une fiche de jeu garde tout\n  son sens si on la sort de la page (flux RSS, page dediee), c'est le\n  critere d'autonomie qui definit article.\n- aside pour l'encart : c'est un complement en marge du sujet principal ;\n  le supprimer n'enleverait rien a la comprehension de la page.\n- nav dans le header : c'est la navigation PRINCIPALE du site, et un\n  lecteur d'ecran pourra y sauter directement.",
    note: "Cette refonte ne change rien à l'écran, et c'est toute la leçon : tu as amélioré la qualité du code sans toucher au résultat visible — l'équivalent d'un refactoring en programmation. Nommer correctement les choses (une zone de page, une variable, une table en Bases de données) est l'un des gestes les plus rentables du métier." }
