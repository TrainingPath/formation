<script>
var DAY = {
  num: 20,
  title: "fetch : appeler une API depuis la page",
  subtitle: "Le catalogue ne vit plus dans ton fichier : il arrive du réseau.",
  theory: `
<h3>1. Une API web, c'est quoi ?</h3>
<p>Jusqu'ici, le tableau <code>jeux</code> était écrit en dur dans app.js. Dans la vraie vie, les données vivent sur un <strong>serveur</strong> (l'ordinateur distant qui stocke et fournit les données), et la page les demande via une <strong>API web</strong>. Une API (<em>Application Programming Interface</em>) est comme un guichet automatique : tu poses une question à une URL et, au lieu d'une page HTML, elle te rend des <strong>données brutes</strong>. Ton navigateur demande <code>https://api.ludotheque.fr/jeux</code>, le serveur répond la liste des jeux. Ici, nous sommes <strong>côté client</strong> (la page dans le navigateur) : on <strong>consomme</strong> une API existante. Concevoir l'autre côté — le serveur qui répond — est tout l'objet du cours <strong>« API REST »</strong> de la formation.</p>

<h3>2. Le format JSON</h3>
<p>Les API parlent presque toutes <strong>JSON</strong> (<em>JavaScript Object Notation</em>) : du texte qui ressemble à s'y méprendre à tes objets JS — clés entre guillemets doubles, pas de commentaires :</p>
<pre class="pseudo">[
  { "nom": "Catan", "duree": 90, "ageMin": 10 },
  { "nom": "Uno", "duree": 20, "ageMin": 7 }
]</pre>
<p>JS sait convertir dans les deux sens : <code>JSON.parse(texte)</code> (texte → objets) et <code>JSON.stringify(objets)</code> (objets → texte). Avec fetch, tu n'appelleras presque jamais parse toi-même : la méthode <code>.json()</code> s'en charge.</p>

<h3>3. fetch renvoie une promesse</h3>
<p>Une requête réseau prend du temps ; le navigateur ne gèle pas la page en attendant. <code>fetch(url)</code> renvoie donc une <strong>promesse</strong> : un « bip de restaurant » qui s'allumera quand la réponse sera prête. On enchaîne avec <code>.then(...)</code> (« ensuite ») :</p>
<pre class="pseudo">fetch("https://api.ludotheque.fr/jeux")                          // lance la requête ; renvoie tout de suite une PROMESSE
  .then(function (reponse) { return reponse.json(); })           // quand la réponse arrive : décode son corps JSON (autre promesse)
  .then(function (jeux) { afficherJeux(jeux); });                // quand le JSON est décodé : afficher les jeux

// la même chose en fonctions fléchées, très courant :          // (écriture courte, strictement équivalente)
fetch(url).then(r =&gt; r.json()).then(jeux =&gt; afficherJeux(jeux)); // les deux étapes enchaînées de façon compacte</pre>
<p>Deux étapes, donc deux then : la réponse arrive, puis son contenu JSON est décodé (lui aussi de façon asynchrone, c'est-à-dire « en différé, sans bloquer »).</p>

<h3>4. L'écriture async/await</h3>
<p>Même mécanique, syntaxe plus lisible : dans une fonction marquée <code>async</code>, le mot-clé <code>await</code> « attend » (met en pause) le résultat d'une promesse avant de continuer :</p>
<pre class="pseudo">async function chargerCatalogue() {                              // "async" : fonction autorisée à contenir des await
  const reponse = await fetch("https://api.ludotheque.fr/jeux"); // await = attend l'arrivée de la réponse
  const jeux = await reponse.json();                             // await = attend le décodage JSON → tableau d'objets
  afficherJeux(jeux);   // la fonction de la leçon 17 !          // affiche les jeux (motif createElement + appendChild)
}                                                                // fin de la fonction
chargerCatalogue();                                              // on APPELLE la fonction pour lancer le chargement</pre>
<p>On lit le code de haut en bas, comme du code classique. C'est l'écriture dominante aujourd'hui — mais les then restent partout dans le code existant : sache lire les deux.</p>

<h3>5. Gérer l'échec : response.ok et catch</h3>
<p>Le réseau échoue : serveur éteint, URL fausse, page 404. Deux contrôles :</p>
<pre class="pseudo">async function chargerCatalogue() {                                // fonction asynchrone
  try {                                                            // try : on TENTE ce bloc, prêt à rattraper une erreur
    const reponse = await fetch("https://api.ludotheque.fr/jeux"); // attend la réponse du serveur
    if (!reponse.ok) {                                             // si le statut n'est PAS un succès (hors 200 à 299)…
      throw new Error("Erreur HTTP " + reponse.status);            // …on LÈVE (throw) une erreur → saut direct vers catch
    }                                                              // fin du if
    const jeux = await reponse.json();                             // attend le décodage JSON
    afficherJeux(jeux);                                            // affiche les jeux reçus
  } catch (erreur) {                                               // catch : exécuté SI une erreur a été levée…
    message.textContent = "Impossible de charger le catalogue. Réessaie plus tard.";  // …message clair pour l'utilisateur
  }                                                                // fin du try/catch
}                                                                  // fin de la fonction</pre>
<p><code>reponse.ok</code> est vrai pour les statuts 200-299 ; le bloc <code>try/catch</code> (ou <code>.catch(...)</code> avec les then) attrape les pannes réseau. Un <strong>statut HTTP</strong> est le code chiffré par lequel le serveur dit si tout s'est bien passé (200 = OK) ou non (404 = introuvable, 500 = erreur serveur). Et l'utilisateur reçoit un message clair dans la page — jamais une page cassée en silence.</p>
<div class="warn">Piège majeur : <code>fetch</code> ne considère PAS une réponse 404 ou 500 comme un échec — la promesse réussit, puisque « une réponse est arrivée ». D'où le contrôle explicite de <code>reponse.ok</code> avant de lire le JSON.</div>
<div class="tip">Ouvre l'onglet <strong>Réseau</strong> (F12) pendant un fetch : tu verras la requête, son statut, et la réponse JSON brute. C'est l'outil roi pour déboguer un appel d'API — et une excellente préparation au cours API REST.</div>`,
  exercises: [
    { type: "qcm", q: "Une API web renvoie typiquement…", opts: ["Une page HTML complète", "Des données brutes (souvent en JSON)", "Un fichier CSS", "Une image"], a: 1, exp: "La page demande des données ; l'affichage reste ton travail côté client." },
    { type: "qcm", q: "Dans ce cours, vis-à-vis des API, nous sommes…", opts: ["Côté serveur : on les conçoit", "Côté client : on les consomme", "Les deux à la fois", "Ni l'un ni l'autre"], a: 1, exp: "La conception côté serveur s'apprend au cours « API REST » de la formation." },
    { type: "qcm", q: "JSON est…", opts: ["Un format texte d'échange de données, aux allures d'objets JS", "Un langage de programmation", "Une base de données", "Un protocole de sécurité"], a: 0, exp: "Clés entre guillemets doubles, pas de commentaires : du texte structuré." },
    { type: "qcm", q: "Convertir un texte JSON en objets JS :", opts: ["JSON.parse(texte)", "JSON.stringify(texte)", "texte.toObject()", "Number(texte)"], a: 0, exp: "parse : texte → objets ; stringify fait l'inverse." },
    { type: "qcm", q: "fetch(url) renvoie…", opts: ["Directement les données", "Une promesse", "Une string JSON", "Un élément du DOM"], a: 1, exp: "Le réseau prend du temps : fetch promet une réponse pour plus tard." },
    { type: "qcm", q: "Pourquoi deux .then dans fetch(url).then(r =&gt; r.json()).then(jeux =&gt; ...) ?", opts: ["Par style", "La réponse arrive, PUIS son contenu JSON est décodé : deux étapes asynchrones", "Le premier est décoratif", "Pour ralentir la page"], a: 1, exp: "r.json() renvoie elle-même une promesse." },
    { type: "input", q: "Quelle méthode de la réponse décode le corps en JSON ?", a: ["json()", "json", ".json()", "r.json()", "reponse.json()"], ph: "méthode…", exp: "reponse.json() — elle renvoie une promesse, d'où le second then (ou await)." },
    { type: "input", q: "Dans une fonction async, quel mot-clé attend le résultat d'une promesse ?", a: ["await"], ph: "mot-clé…", exp: "const reponse = await fetch(url) : le code se lit de haut en bas." },
    { type: "vf", q: "await ne peut s'utiliser que dans une fonction marquée async.", a: true, exp: "Les deux mots-clés vont de pair : async déclare, await attend." },
    { type: "qcm", q: "reponse.ok est vrai quand…", opts: ["La promesse existe", "Le statut HTTP est entre 200 et 299", "Le JSON est joli", "Le serveur est en France"], a: 1, exp: "404 ou 500 → ok vaut false : à toi de réagir." },
    { type: "vf", q: "Une réponse 404 fait automatiquement échouer la promesse de fetch.", a: false, exp: "Piège majeur : une réponse est arrivée, la promesse réussit. Contrôle reponse.ok toi-même." },
    { type: "qcm", q: "Le rôle du catch (ou du bloc try/catch) :", opts: ["Accélérer la requête", "Attraper les pannes (réseau coupé, erreur levée) et réagir proprement", "Convertir le JSON", "Valider le formulaire"], a: 1, exp: "L'utilisateur reçoit un message clair au lieu d'une page cassée en silence." },
    { type: "qcm", q: "En cas d'échec du chargement, on affiche le message d'erreur…", opts: ["Dans la page, via textContent", "Uniquement dans la console", "Dans une popup alert", "Nulle part"], a: 0, exp: "Même réflexe qu'à la leçon 19 : l'utilisateur mérite une explication visible." },
    { type: "qcm", q: "Une fois les jeux reçus de l'API, on les affiche avec…", opts: ["Le motif createElement + appendChild de la leçon 17", "Un nouveau langage", "JSON.stringify dans le body", "Un media query"], a: 0, exp: "Seule la source des données change ; l'affichage est déjà écrit." },
    { type: "vf", q: "L'onglet Réseau des outils de développement montre la requête, son statut et la réponse JSON.", a: true, exp: "L'outil roi pour déboguer un appel d'API." }
  ],
  final: {
    title: "Exercice final — Le catalogue venu du serveur",
    intro: `<p>Le tableau en dur disparaît : la page catalogue interroge l'API de la Ludothèque.</p>`,
    questions: [
      { type: "qcm", q: "La chaîne complète du chargement :", opts: ["fetch → vérifier ok → .json() → afficherJeux", "afficherJeux → fetch → json", "json → fetch → ok", "fetch → innerHTML direct"], a: 0, exp: "Demander, vérifier, décoder, afficher." },
      { type: "input", q: "Quelle propriété de la réponse vérifie que le statut HTTP est un succès ?", a: ["ok", "response.ok", "reponse.ok", ".ok"], ph: "propriété…", exp: "if (!reponse.ok) { throw new Error(...) } avant de décoder." },
      { type: "vf", q: "Avec async/await, le try/catch permet de gérer à la fois la panne réseau et l'erreur levée sur un mauvais statut.", a: true, exp: "Un seul filet pour toutes les chutes." },
      { type: "qcm", q: "const jeux = await reponse.json(); place dans jeux…", opts: ["Une string JSON", "Les données décodées : tableau d'objets utilisable avec for...of", "Une promesse à jamais", "Le HTML de la page"], a: 1, exp: "Après l'await, on manipule des objets JS ordinaires." },
      { type: "qcm", q: "Concevoir l'API côté serveur (routes, statuts, formats) s'apprend…", opts: ["Dans ce cours front-end", "Au cours « API REST » de la formation", "Nulle part", "Dans le CSS"], a: 1, exp: "Ici on consomme ; là-bas tu construiras l'autre moitié du dialogue." }
    ],
    solution: `<pre class="pseudo">async function chargerCatalogue() {                            // fonction asynchrone
  try {                                                        // on TENTE le bloc…
    const reponse = await fetch("https://api.ludotheque.fr/jeux");  // attend la réponse du serveur
    if (!reponse.ok) {                                         // statut d'échec (hors 200 à 299) ?
      throw new Error("Erreur HTTP " + reponse.status);        // …lève une erreur → catch
    }                                                          // fin du if
    const jeux = await reponse.json();                         // attend le décodage JSON
    afficherJeux(jeux);            // leçon 17 : createElement + appendChild
  } catch (erreur) {                                           // en cas d'erreur…
    message.textContent = "Impossible de charger le catalogue.";  // …message à l'utilisateur
  }                                                            // fin du try/catch
}                                                              // fin de la fonction
chargerCatalogue();                                            // lance le chargement

fetch = promesse · .json() = décodage · ok = statut · catch = filet</pre>
<p>La Ludothèque parle au réseau : la boucle est bouclée. Demain, dernière leçon — on assemble tout et on fait le point sur le chemin parcouru.</p>`
  }
};

<script>
var ECRITURE = {

  { id: "web-l20", title: "Brancher le catalogue sur l'API", level: 3,

    hints: [

      "La version .then s'écrit en chaîne : fetch(url).then(r => r.json()).then(jeux => afficherJeux(jeux)).catch(...)."

    solution: "const liste = document.querySelector(\"#liste-jeux\");   // le <ul> à remplir\nconst message = document.querySelector(\"#message\");    // la zone des messages d'erreur\n\nfunction afficherJeux(jeux) {                          // affiche un tableau de jeux…\n  liste.textContent = \"\";   // on vide avant de regénérer\n  for (const jeu of jeux) {                            // pour chaque jeu…\n    const li = document.createElement(\"li\");           // crée un <li>\n    li.textContent = jeu.nom + \" — \" + jeu.duree + \" min\";   // remplit son texte\n    liste.appendChild(li);                             // l'accroche dans la liste\n  }                                                    // fin de la boucle\n}                                                      // fin de afficherJeux\n\nasync function chargerCatalogue() {                    // fonction asynchrone\n  try {                                                // on tente…\n    const reponse = await fetch(\"https://api.ludotheque.fr/jeux\");   // attend la réponse\n    if (!reponse.ok) {                                 // statut d'échec ?\n      throw new Error(\"Erreur HTTP \" + reponse.status);   // lève une erreur → catch\n    }                                                  // fin du if\n    const jeux = await reponse.json();                 // décode le JSON en objets\n    afficherJeux(jeux);                                // affiche les jeux reçus\n  } catch (erreur) {                                   // en cas d'erreur…\n    message.textContent =                              // …message à l'utilisateur\n      \"Impossible de charger le catalogue. Réessaie plus tard.\";\n  }                                                    // fin du try/catch\n}                                                      // fin de chargerCatalogue\n\nchargerCatalogue();                                    // lance le chargement au démarrage\n\n// Version équivalente avec .then :\n// fetch(\"https://api.ludotheque.fr/jeux\")\n//   .then(r => r.json())          // décode le JSON\n//   .then(jeux => afficherJeux(jeux))   // affiche les jeux\n//   .catch(() => { message.textContent = \"Impossible de charger.\"; });  // filet",
