  title: "Le web : navigateur, HTML, CSS, JS — premier fichier",
  subtitle: "Derrière chaque page web : trois langages et un fichier texte tout simple.",
  theory: `
<h3>1. Comment marche le web</h3>
<p>Quand tu tapes une adresse dans ton navigateur, il se passe un dialogue très simple : ton <strong>navigateur</strong> (le logiciel qui affiche les pages web : Chrome, Firefox, Edge, Safari…) envoie une <strong>requête</strong> (une demande) à un <strong>serveur</strong> (un ordinateur allumé quelque part, qui attend les demandes et y répond), et le serveur lui renvoie des fichiers. Le navigateur lit ces fichiers et les affiche.</p>
<pre class="pseudo">Navigateur ──── "donne-moi la page /index.html" ────→ Serveur   // 1) le navigateur DEMANDE une page (la requête)
Navigateur ←─── fichiers HTML, CSS, JS, images ────── Serveur   // 2) le serveur RÉPOND en renvoyant des fichiers
puis le navigateur AFFICHE la page                              // 3) le navigateur lit ces fichiers et dessine la page</pre>
<p>Le point clé : une page web n'est <strong>pas un programme mystérieux</strong>, c'est un ensemble de fichiers texte que le navigateur sait interpréter (« interpréter » = lire et exécuter). Et bonne nouvelle : pas besoin de serveur pour apprendre — un fichier sur ton disque suffit.</p>

<h3>2. Trois langages, trois rôles</h3>
<p>Le front-end (la partie d'un site qui s'affiche dans le navigateur, côté visiteur) repose sur trois langages qui coopèrent, chacun avec un rôle précis. La métaphore de la <strong>maison</strong> aide à ne jamais les confondre :</p>
<pre class="pseudo">HTML → la STRUCTURE   (les murs, les pièces, les portes)      // le SQUELETTE : quel contenu, dans quel ordre
CSS  → l'APPARENCE    (la peinture, la déco, les meubles)     // le STYLE : couleurs, tailles, mise en page
JS   → l'INTERACTIVITÉ (l'électricité : boutons, réactions)   // le COMPORTEMENT : ce qui réagit et bouge</pre>
<p><strong>HTML</strong> (HyperText Markup Language, « langage de balisage ») décrit le contenu : « ceci est un titre », « ceci est une liste ». <strong>CSS</strong> (Cascading Style Sheets, « feuilles de style ») décrit son apparence : couleurs, tailles, mise en page. <strong>JavaScript</strong> (souvent abrégé JS) le rend vivant : réagir à un clic, vérifier un formulaire. Ce cours suit cet ordre : d'abord des murs solides (semaine HTML), ensuite la peinture, enfin l'électricité.</p>

<h3>3. Ton premier fichier HTML</h3>
<p>Un fichier HTML est un simple fichier texte dont le nom se termine par <code>.html</code>. Voici le squelette minimal, à connaître par cœur. Chaque ligne est commentée à droite (en HTML, un commentaire s'écrit <code>&lt;!-- ... --&gt;</code> et n'est jamais affiché) :</p>
<pre class="pseudo">&lt;!DOCTYPE html&gt;                    &lt;!-- 1re ligne : annonce « ceci est du HTML moderne » --&gt;
&lt;html lang="fr"&gt;                    &lt;!-- balise racine : englobe TOUTE la page ; lang="fr" = langue française --&gt;
  &lt;head&gt;                           &lt;!-- en-tête : les infos SUR la page (invisibles à l'écran) --&gt;
    &lt;meta charset="UTF-8"&gt;         &lt;!-- jeu de caractères UTF-8 : affiche correctement les accents (é, è, à…) --&gt;
    &lt;title&gt;Ludothèque&lt;/title&gt;      &lt;!-- titre affiché dans l'ONGLET du navigateur --&gt;
  &lt;/head&gt;                          &lt;!-- fin de l'en-tête (le slash / marque une fermeture) --&gt;
  &lt;body&gt;                           &lt;!-- corps : TOUT ce qui s'affiche à l'écran --&gt;
    Bienvenue à la Ludothèque !     &lt;!-- texte visible, affiché dans la page --&gt;
  &lt;/body&gt;                          &lt;!-- fin du corps --&gt;
&lt;/html&gt;                            &lt;!-- fin de la page --&gt;</pre>
<p>Ligne par ligne : <code>&lt;!DOCTYPE html&gt;</code> annonce « ceci est du HTML moderne ». <code>&lt;html lang="fr"&gt;</code> englobe tout et précise la langue. Le <code>&lt;head&gt;</code> contient des <strong>informations sur la page</strong> (invisibles) : <code>&lt;meta charset="UTF-8"&gt;</code> pour afficher correctement les accents, <code>&lt;title&gt;</code> pour le texte de l'onglet. Le <code>&lt;body&gt;</code> contient <strong>tout ce qui s'affiche</strong>.</p>

<h3>4. Balises, attributs, éléments</h3>
<p>Les mots entre chevrons (les signes <code>&lt;</code> et <code>&gt;</code>) sont des <strong>balises</strong> (en anglais <em>tags</em>) : ce sont les étiquettes qui nomment chaque morceau de contenu. La plupart vont par paires : une <strong>ouvrante</strong> <code>&lt;title&gt;</code>, une <strong>fermante</strong> <code>&lt;/title&gt;</code> (avec un slash <code>/</code>), et le contenu entre les deux. Certaines, comme <code>&lt;meta&gt;</code>, sont <strong>auto-fermantes</strong> : pas de contenu, donc pas de balise fermante.</p>
<p>Un <strong>attribut</strong> est une information supplémentaire écrite <em>à l'intérieur</em> de la balise ouvrante, sous la forme <code>nom="valeur"</code> : dans <code>&lt;html lang="fr"&gt;</code>, l'attribut est <code>lang</code> et sa valeur est <code>"fr"</code> ; dans <code>&lt;meta charset="UTF-8"&gt;</code>, l'attribut est <code>charset</code>. Enfin, un <strong>élément</strong> est l'ensemble complet : la balise ouvrante + le contenu + la balise fermante (par exemple <code>&lt;title&gt;Ludothèque&lt;/title&gt;</code> est l'élément « titre »).</p>
<p>Pour écrire du HTML, il te faut un <strong>éditeur de texte</strong> pour le code — <strong>VS Code</strong> est le choix classique (gratuit, coloration, complétion). Surtout pas Word : il enregistre de la mise en forme, pas du texte brut. Pour voir le résultat : enregistre le fichier, puis <strong>double-clique dessus</strong> (ou glisse-le dans le navigateur). Après chaque modification : enregistrer, puis recharger la page (F5).</p>

<h3>5. On lance la Ludothèque</h3>
<p>Le projet du cours : le site d'une <strong>ludothèque</strong>, un catalogue de jeux de société. Semaine après semaine, il gagnera une page d'accueil, une liste des jeux, des fiches détaillées et un formulaire d'avis. Aujourd'hui, on pose la première pierre :</p>
<pre class="pseudo">ludotheque/            ← un DOSSIER pour tout le site (il rassemblera tous les fichiers)
└── index.html         ← un FICHIER : la page d'accueil, à l'intérieur du dossier</pre>
<p>Crée le dossier <code>ludotheque/</code>, puis dedans un fichier <code>index.html</code> avec le squelette du point 3. Le nom <code>index.html</code> n'est pas un hasard : c'est la page que les serveurs servent <strong>par défaut</strong> quand on visite un site. Ouvre-la : l'onglet affiche « Ludothèque », la page dit « Bienvenue à la Ludothèque ! ». Ton site existe.</p>
<div class="warn">Sans <code>&lt;meta charset="UTF-8"&gt;</code>, les accents peuvent s'afficher en caractères bizarres (Ã©, Ã¨…). Prends le réflexe : ce meta est TOUJOURS la première ligne du <code>&lt;head&gt;</code>.</div>
<div class="tip">Dans ton navigateur, fais un clic droit sur n'importe quelle page → « Afficher le code source ». Tout site, même géant, commence par le même squelette que ton index.html. Rien n'est caché sur le web.</div>`,
  exercises: [
    { type: "qcm", q: "Quand tu visites un site, qui envoie la requête et qui répond ?", opts: ["Le navigateur demande, le serveur répond", "Le serveur demande, le navigateur répond", "Les deux demandent en même temps", "Personne : tout est déjà sur ton disque"], a: 0, exp: "Le navigateur est le client : il demande, le serveur fournit les fichiers." },

    { type: "qcm", q: "Le contenu de &lt;title&gt; s'affiche…", opts: ["En gros en haut de la page", "Dans l'onglet du navigateur", "Dans le pied de page", "Nulle part"], a: 1, exp: "C'est le texte de l'onglet (et des favoris) — à ne pas confondre avec un titre dans la page." },

    { type: "qcm", q: "Tu modifies ton fichier HTML mais la page ne change pas. Réflexe ?", opts: ["Redémarrer l'ordinateur", "Enregistrer le fichier puis recharger la page (F5)", "Réinstaller le navigateur", "Attendre quelques minutes"], a: 1, exp: "Le navigateur affiche la version chargée : enregistrer + F5, le duo de base." },
    { type: "input", q: "Nom de la balise qui contient les informations invisibles sur la page (charset, titre d'onglet), sans les chevrons :", a: ["head", "<head>"], ph: "nom de la balise…", exp: "Le head est la « carte d'identité » de la page, jamais affiché tel quel." },
    { type: "vf", q: "&lt;meta&gt; est une balise auto-fermante : elle n'a pas de balise fermante.", a: true, exp: "Pas de contenu → pas de fermante. Comme &lt;br&gt; ou &lt;img&gt; qu'on verra bientôt." },
    { type: "qcm", q: "Le projet fil conducteur de ce cours est…", opts: ["Un blog de cuisine", "Le site d'une ludothèque (catalogue de jeux)", "Une boutique de vêtements", "Un réseau social"], a: 1, exp: "Accueil, liste des jeux, fiches, formulaire d'avis : on le construit page après page." }
  ],
  final: {

      { type: "qcm", q: "L'ordre correct des rôles HTML / CSS / JS :", opts: ["Structure / apparence / interactivité", "Apparence / structure / interactivité", "Interactivité / apparence / structure", "Structure / interactivité / apparence"], a: 0, exp: "Murs, peinture, électricité — dans cet ordre on construit la maison." },
      { type: "qcm", q: "Quelle est la toute première ligne d'un fichier HTML ?", opts: ["&lt;html&gt;", "&lt;!DOCTYPE html&gt;", "&lt;head&gt;", "&lt;meta charset=\"UTF-8\"&gt;"], a: 1, exp: "Le doctype d'abord, puis &lt;html&gt; qui englobe head et body." },

    ],
    solution: `<pre class="pseudo">Le web  : navigateur (demande) ←→ serveur (fournit des fichiers)   // le dialogue de base du web
3 rôles : HTML = structure · CSS = apparence · JS = interactivité   // murs · peinture · électricité

Squelette à connaître par cœur :
&lt;!DOCTYPE html&gt;                    &lt;!-- annonce du HTML moderne --&gt;
&lt;html lang="fr"&gt;                    &lt;!-- racine de la page, langue française --&gt;

Projet : ludotheque/index.html créé et ouvert dans le navigateur.   // ta première page existe</pre>
