<body>
<script>
var DAY = {
  num: 9,
  title: "Le modèle de boîte : margin, border, padding",
  subtitle: "Tout élément HTML est une boîte. Qui comprend la boîte comprend la mise en page.",
  theory: `
<h3>1. Toute balise est une boîte</h3>
<p>Pour le navigateur, chaque élément est un rectangle composé de quatre couches, de l'intérieur vers l'extérieur : le <strong>contenu</strong> (texte, image), le <strong>padding</strong> (espace interne), la <strong>border</strong> (le trait), et la <strong>margin</strong> (espace externe, entre les boîtes). L'image la plus parlante est celle d'une <strong>photo encadrée au mur</strong> : le contenu, c'est la photo ; le padding, c'est le passe-partout blanc autour de la photo ; la border, c'est le cadre en bois ; la margin, c'est la distance entre ce cadre et le cadre voisin.</p>
<pre class="pseudo">┌─────────────── margin (extérieur, transparent) ──────────────┐
│  ┌──────────── border (le trait visible) ─────────────────┐  │
│  │  ┌───────── padding (respiration interne) ──────────┐  │  │
│  │  │                 CONTENU                           │  │  │
│  │  └───────────────────────────────────────────────────┘  │  │
│  └─────────────────────────────────────────────────────────┘  │
└───────────────────────────────────────────────────────────────┘</pre>
<p>Petit rappel de CSS : une <strong>règle</strong> se compose d'un <strong>sélecteur</strong> (à qui je parle, ici <code>.carte</code> = « tous les éléments portant l'étiquette <em>carte</em> »), puis, entre accolades, de <strong>propriétés</strong> et de leurs <strong>valeurs</strong> (quoi faire), comme une fiche de réglages. L'unité <code>px</code> signifie <em>pixel</em> : un tout petit point de l'écran. Une couleur écrite <code>#d9d2c4</code> est un <strong>code hexadécimal</strong> : une manière compacte de désigner une teinte précise (ici un gris-beige).</p>
<pre class="pseudo">.carte {                          /* sélecteur : cible tous les éléments de classe "carte" */
  padding: 16px;                  /* de l'air DANS la carte (espace interne) */
  border: 1px solid #d9d2c4;      /* le trait : épaisseur 1px, style plein (solid), couleur gris-beige */
  margin: 12px;                   /* de l'air AUTOUR de la carte (espace externe) */
}                                 /* fin de la règle .carte */</pre>
<p>Retiens la nuance : le padding pousse la bordure loin du contenu, la margin pousse les boîtes loin les unes des autres. Le fond (<code>background-color</code>) couvre contenu + padding, jamais la margin.</p>

<h3>2. width, height et le piège du calcul</h3>
<p><code>width</code> (largeur) et <code>height</code> (hauteur) fixent les dimensions. Mais par défaut, elles ne mesurent que le <strong>contenu</strong> : padding et bordure s'ajoutent PAR-DESSUS. Une carte <code>width: 300px</code> avec <code>padding: 16px</code> et bordure 1px occupe en réalité 334px (300 + 16 + 16 + 1 + 1). Insupportable à calculer.</p>

<h3>3. box-sizing: border-box — à mettre partout</h3>
<p>La solution universelle : demander que <code>width</code> inclue padding et bordure. On l'applique à tous les éléments dès la première ligne du fichier :</p>
<pre class="pseudo">* {                          /* sélecteur universel : cible TOUS les éléments de la page */
  box-sizing: border-box;    /* width = contenu + padding + border (tout compris) */
}                            /* fin de la règle universelle */

.carte {                     /* la classe "carte" */
  width: 300px;              /* la carte fait VRAIMENT 300px de large… */
  padding: 16px;             /* …car ce padding est déjà compté dans les 300px */
  border: 1px solid #d9d2c4; /* …et cette bordure aussi est comprise dans les 300px */
}                            /* fin de la règle .carte */</pre>
<p>Le sélecteur <code>*</code> (« universel ») cible tous les éléments. Cette règle ouvre quasiment toutes les feuilles de style professionnelles.</p>

<h3>4. Les raccourcis et margin: 0 auto</h3>
<p><code>margin</code> et <code>padding</code> acceptent 1, 2 ou 4 valeurs :</p>
<pre class="pseudo">margin: 10px;                  /* UNE valeur : 10px sur les quatre côtés */
margin: 10px 20px;             /* DEUX valeurs : 10 haut/bas, 20 gauche/droite */
margin: 5px 10px 15px 20px;    /* QUATRE valeurs, sens horaire : haut droite bas gauche */

main {                         /* on cible la balise <main> */
  max-width: 900px;            /* largeur MAXIMALE : la boîte ne dépassera jamais 900px */
  margin: 0 auto;              /* 0 en haut/bas ; auto à gauche ET à droite = centré */
}                              /* fin de la règle main */</pre>
<p><code>margin: 0 auto</code> est LE truc à connaître : avec une largeur définie, les marges automatiques se partagent l'espace restant et <strong>centrent le bloc horizontalement</strong>. C'est ainsi qu'on centre le contenu de la Ludothèque sur grand écran.</p>

<h3>5. block vs inline</h3>
<p>Deux grands comportements de boîte, réglés par la propriété <code>display</code> (« affichage ») : les éléments <strong>block</strong> (<code>div</code>, <code>p</code>, <code>h1</code>, <code>section</code>…) prennent toute la largeur disponible et s'empilent verticalement, comme des cartons posés les uns sur les autres ; les éléments <strong>inline</strong> (<code>a</code>, <code>strong</code>, <code>span</code>…) restent dans le fil du texte, comme des mots dans une phrase, et <strong>ignorent width, height et les marges verticales</strong>. On peut changer ce comportement :</p>
<pre class="pseudo">nav a {                    /* cible les liens <a> situés à l'intérieur du <nav> */
  display: inline-block;   /* dans la ligne, MAIS accepte désormais padding et width */
  padding: 8px 14px;       /* 8px haut/bas, 14px gauche/droite : zone cliquable confortable */
}                          /* fin de la règle */</pre>
<div class="warn">Si ton <code>width: 100%</code> déborde de l'écran ou que tes colonnes ne rentrent pas, le coupable est presque toujours un padding ajouté SANS <code>box-sizing: border-box</code>. Mets la règle universelle en tête de fichier une fois pour toutes.</div>
<div class="tip">Dans l'inspecteur (la touche F12 ouvre les outils de développement du navigateur), l'onglet des styles affiche le <strong>schéma de la boîte</strong> de l'élément sélectionné : contenu, padding, border, margin avec leurs valeurs. Survole chaque zone, elle se colore dans la page. Imbattable pour déboguer un espacement.</div>`,
  exercises: [
    { type: "qcm", q: "De l'intérieur vers l'extérieur, l'ordre des couches d'une boîte est :", opts: ["contenu → margin → border → padding", "contenu → padding → border → margin", "padding → contenu → margin → border", "border → padding → margin → contenu"], a: 1, exp: "Contenu, respiration interne, trait, espace externe." },
    { type: "qcm", q: "L'espace ENTRE le texte d'une carte et sa bordure, c'est…", opts: ["margin", "padding", "gap", "border-spacing"], a: 1, exp: "Le padding est l'espace interne, à l'intérieur de la bordure." },
    { type: "qcm", q: "L'espace ENTRE deux cartes voisines, c'est…", opts: ["padding", "border", "margin", "width"], a: 2, exp: "La margin écarte les boîtes les unes des autres." },
    { type: "qcm", q: "border: 1px solid #d9d2c4; définit dans l'ordre…", opts: ["couleur, style, épaisseur", "épaisseur, style, couleur", "style, couleur, épaisseur", "épaisseur, couleur, style"], a: 1, exp: "Épaisseur (1px), style (solid), couleur (#d9d2c4)." },
    { type: "qcm", q: "Sans box-sizing: border-box, une boîte width:200px avec padding:20px de chaque côté occupe…", opts: ["200px", "220px", "240px", "160px"], a: 2, exp: "200 + 20 à gauche + 20 à droite : le padding s'ajoute à la width par défaut." },
    { type: "qcm", q: "Avec box-sizing: border-box, width: 300px signifie…", opts: ["300px de contenu seul", "300px tout compris (contenu + padding + border)", "300px + la margin", "Rien, la propriété est ignorée"], a: 1, exp: "La largeur annoncée devient la largeur réellement occupée." },
    { type: "qcm", q: "Que cible le sélecteur * ?", opts: ["Les éléments importants", "Tous les éléments de la page", "Le body uniquement", "Les commentaires"], a: 1, exp: "Le sélecteur universel — parfait pour box-sizing: border-box." },
    { type: "qcm", q: "margin: 10px 20px; applique…", opts: ["10px partout puis 20px partout", "10px haut/bas et 20px gauche/droite", "10px gauche/droite et 20px haut/bas", "10px haut et 20px bas"], a: 1, exp: "Deux valeurs : vertical d'abord, horizontal ensuite." },
    { type: "qcm", q: "Dans margin: 5px 10px 15px 20px, le 15px s'applique…", opts: ["En haut", "À droite", "En bas", "À gauche"], a: 2, exp: "Sens horaire : haut, droite, bas, gauche." },
    { type: "qcm", q: "Pour centrer horizontalement un main de max-width: 900px :", opts: ["text-align: center;", "margin: 0 auto;", "padding: 0 auto;", "center: true;"], a: 1, exp: "Les marges horizontales auto se partagent l'espace restant." },
    { type: "vf", q: "background-color colore aussi la zone de margin.", a: false, exp: "Le fond couvre contenu et padding ; la margin reste transparente." },
    { type: "vf", q: "Un élément inline comme &lt;a&gt; ignore width et les marges verticales.", a: true, exp: "D'où display: inline-block pour donner du padding cliquable aux liens." },
    { type: "vf", q: "Un &lt;p&gt; est un élément block : il prend toute la largeur disponible.", a: true, exp: "Les blocks s'empilent verticalement, chacun sur sa ligne." },
    { type: "input", q: "Quelle propriété (nom exact) fait que width inclut padding et bordure ?", a: ["box-sizing"], ph: "propriété…", exp: "box-sizing: border-box; — à appliquer avec le sélecteur *." },
    { type: "input", q: "Quelle valeur de margin horizontale centre un bloc de largeur fixe ?", a: ["auto"], ph: "valeur…", exp: "margin: 0 auto; — auto à gauche et à droite se partagent l'espace." }
  ],
  final: {
    title: "Exercice final — Des cartes qui respirent",
    intro: `<p>Les cartes de jeux de la Ludothèque sont collées et sans relief. On leur donne bordure, air et centrage.</p>`,
    questions: [
      { type: "qcm", q: "Pour écarter le titre du jeu du bord de sa carte :", opts: ["margin sur la carte", "padding sur la carte", "border sur le titre", "width sur le titre"], a: 1, exp: "L'espace interne entre bordure et contenu, c'est le padding." },
      { type: "qcm", q: "Pour que les cartes ne se touchent plus entre elles :", opts: ["padding: 12px;", "margin: 12px;", "border: 12px;", "height: 12px;"], a: 1, exp: "La margin gère l'espace externe entre boîtes." },
      { type: "input", q: "Complète : main { max-width: 900px; margin: 0 ______; } pour centrer le contenu.", a: ["auto"], ph: "valeur…", exp: "margin: 0 auto — le duo max-width + auto centre le bloc." },
      { type: "vf", q: "Avec * { box-sizing: border-box; }, une carte width:300px + padding:16px reste large de 300px.", a: true, exp: "border-box inclut le padding dans la largeur annoncée." },
      { type: "qcm", q: "Les liens du menu doivent avoir une zone cliquable avec padding vertical. Ils sont inline, donc :", opts: ["Impossible", "display: inline-block; puis padding", "On les remplace par des h2", "margin: 0 auto;"], a: 1, exp: "inline-block garde le lien dans la ligne tout en acceptant le padding." }
    ],
    solution: `<pre class="pseudo">* { box-sizing: border-box; }     /* première règle du fichier : width tout compris */

main {                            /* le contenu principal de la page */
  max-width: 900px;               /* ne dépassera jamais 900px de large */
  margin: 0 auto;                 /* contenu centré horizontalement */
  padding: 0 16px;                /* un filet d'air à gauche et à droite */
}                                 /* fin de la règle main */

.carte {                          /* une carte de jeu */
  background-color: #ffffff;      /* fond blanc (couvre contenu + padding) */
  border: 1px solid #d9d2c4;      /* bordure fine gris-beige */
  padding: 16px;                  /* de l'air dedans (espace interne) */
  margin-bottom: 12px;            /* de l'air SOUS la carte (espace externe) */
}                                 /* fin de la règle .carte */

nav a {                           /* les liens du menu */
  display: inline-block;          /* dans la ligne mais accepte le padding */
  padding: 8px 14px;              /* zone cliquable confortable */
}                                 /* fin de la règle */</pre>
<p>Les boîtes sont maîtrisées. Prochaine étape : la typographie — polices, tailles et hiérarchie des titres.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "web-l9", title: "L'anatomie d'une carte de jeu", level: 2,
    statement: "Une carte de la Ludothèque (class=\"carte\") doit faire exactement 300px de large, avoir un fond blanc, une bordure fine gris-beige, 16px d'air interne et 12px d'espace sous elle. Le contenu principal du site (main) doit être centré avec une largeur maximale de 900px. Rédige d'abord, en français, le rôle de chaque couche de la boîte (contenu, padding, border, margin) appliqué à cette carte, puis écris le CSS complet — sans oublier la règle qui garantit que 300px reste bien 300px.",
    hints: [
      "Commence ta feuille par la règle universelle box-sizing — sinon tes 300px deviennent 334px.",
      "Interne ou externe ? Les 16px éloignent le texte de la bordure ; les 12px éloignent la carte de sa voisine.",
      "Pour centrer main : une largeur maximale + des marges horizontales automatiques."
    ],
    solution: "ANATOMIE DE LA CARTE\n- Contenu : le titre du jeu, l'image, la description.\n- Padding (16px) : espace interne, écarte le contenu de la bordure.\n- Border (1px solid) : le trait qui dessine visuellement la carte.\n- Margin (12px en bas) : espace externe, sépare la carte de la suivante.\nGrâce à border-box, width: 300px inclut padding et bordure : la carte\noccupe exactement 300px.\n\n/* style.css */\n* {                           /* sélecteur universel : toute la page */\n  box-sizing: border-box;     /* width = contenu + padding + border */\n}                             /* fin de la règle universelle */\nmain {                        /* le contenu principal */\n  max-width: 900px;           /* largeur maximale */\n  margin: 0 auto;             /* centré horizontalement */\n}                             /* fin de main */\n.carte {                      /* une carte de jeu */\n  width: 300px;               /* 300px tout compris (grâce à border-box) */\n  background-color: #ffffff;  /* fond blanc */\n  border: 1px solid #d9d2c4;  /* bordure fine gris-beige */\n  padding: 16px;              /* air interne */\n  margin-bottom: 12px;        /* air sous la carte */\n}                             /* fin de .carte */",
    note: "Savoir expliquer une boîte en français avant de l'écrire en CSS est le meilleur test de compréhension : la plupart des bugs de mise en page viennent d'une confusion padding/margin. Ce vocabulaire précis te servira aussi à lire l'inspecteur du navigateur, ton futur outil quotidien de débogage — y compris en semaine JavaScript quand tu manipuleras ces mêmes boîtes par le code." }
  ]
};
