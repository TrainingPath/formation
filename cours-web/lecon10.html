<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leçon 10</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
var DAY = {
  num: 10,
  title: "Texte et polices : typographie du site",
  subtitle: "90 % d'un site web, c'est du texte. Le rendre agréable à lire, c'est déjà du design.",
  theory: `
<h3>1. font-family et les polices de secours</h3>
<p><code>font-family</code> choisit la police. On donne toujours une <strong>liste</strong> : si la première police manque sur la machine du visiteur, le navigateur essaie la suivante, et ainsi de suite jusqu'à une <strong>famille générique</strong> (<code>serif</code> = avec empattements, <code>sans-serif</code> = sans, <code>monospace</code> = chasse fixe) :</p>
<pre class="pseudo">body {
  font-family: "Segoe UI", Arial, sans-serif;
}
/* 1. Segoe UI si dispo  2. sinon Arial  3. sinon N'IMPORTE quelle sans-serif */</pre>
<p>Les noms composés prennent des guillemets. La famille générique en fin de liste est <strong>obligatoire</strong> : c'est le filet de sécurité.</p>

<h3>2. Importer une Google Font</h3>
<p>Pour une police identique chez tous les visiteurs, on la charge depuis Google Fonts : le site te fournit une balise <code>&lt;link&gt;</code> à coller dans le <code>&lt;head&gt;</code>, puis tu utilises la police en CSS :</p>
<pre class="pseudo">&lt;!-- dans le &lt;head&gt;, AVANT style.css --&gt;
&lt;link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&amp;display=swap" rel="stylesheet"&gt;</pre>
<pre class="pseudo">/* dans style.css */
body { font-family: "Poppins", Arial, sans-serif; }</pre>
<p>Garde les polices de secours même avec une Google Font : le temps qu'elle charge (ou si le réseau tousse), le texte reste lisible.</p>

<h3>3. font-size : px, rem, em — préfère rem</h3>
<p>Trois unités courantes : <code>px</code> (taille fixe), <code>rem</code> (multiple de la taille de la <strong>racine</strong>, 16px par défaut), <code>em</code> (multiple de la taille du <strong>parent</strong> — pratique mais les imbrications se multiplient vite). Le bon réflexe : <strong>rem</strong>, qui respecte le réglage de taille de texte choisi par l'utilisateur dans son navigateur :</p>
<pre class="pseudo">h1 { font-size: 2rem; }      /* 2 × 16px = 32px par défaut */
h2 { font-size: 1.5rem; }    /* 24px */
p  { font-size: 1rem; }      /* 16px, la base */

h1 { font-weight: 700; }     /* graisse : 400 normal, 700 gras */</pre>

<h3>4. Le confort de lecture : line-height, text-align, letter-spacing</h3>
<p><code>line-height</code> règle la hauteur des lignes : la valeur <strong>sans unité</strong> <code>1.5</code> (une fois et demie la taille du texte) est le standard du confort. <code>text-align</code> aligne (<code>left</code>, <code>center</code>, <code>right</code>). <code>letter-spacing</code> espace les lettres — à petite dose, pour un titre ou un sous-titre en capitales :</p>
<pre class="pseudo">body { line-height: 1.5; }           /* respiration entre les lignes */
h1   { text-align: center; }
.sous-titre {
  letter-spacing: 2px;
  text-transform: uppercase;         /* bonus : met en capitales */
}</pre>

<h3>5. text-decoration et la hiérarchie visuelle</h3>
<p>Les liens sont soulignés par défaut. Dans une barre de navigation, ce souligné alourdit : on l'enlève avec <code>text-decoration: none;</code> — mais on le garde dans le corps du texte, où il signale le lien. Enfin, la <strong>hiérarchie visuelle</strong> : les tailles et graisses doivent refléter la structure — le h1 domine, les h2 se distinguent nettement des paragraphes. C'est l'identité typographique de la Ludothèque :</p>
<pre class="pseudo">body  { font-family: "Poppins", Arial, sans-serif; line-height: 1.5; }
h1    { font-size: 2rem;   font-weight: 700; }
h2    { font-size: 1.5rem; font-weight: 700; }
p     { font-size: 1rem; }
nav a { text-decoration: none; font-weight: 700; }</pre>
<div class="warn">N'enlève pas le souligné de TOUS les liens du site : dans un paragraphe, un lien non souligné et non distingué devient invisible. <code>text-decoration: none</code> se réserve aux menus et aux boutons, là où le contexte crie déjà « c'est cliquable ».</div>
<div class="tip">Limite-toi à <strong>deux polices maximum</strong> (une pour les titres, une pour le texte) et à 3-4 tailles bien distinctes. La sobriété typographique fait plus « pro » que dix polices fantaisie — compare les grands sites : ils sont tous typographiquement minimalistes.</div>`,
  exercises: [
    { type: "qcm", q: "Pourquoi écrire font-family: \"Poppins\", Arial, sans-serif; plutôt que \"Poppins\" seul ?", opts: ["C'est plus rapide à charger", "Si Poppins manque, le navigateur a des solutions de repli", "Les trois polices s'affichent en même temps", "C'est obligatoire pour Google"], a: 1, exp: "La liste = polices de secours ; la famille générique finale est le filet de sécurité." },
    { type: "qcm", q: "serif et sans-serif sont…", opts: ["Des polices précises", "Des familles génériques (avec/sans empattements)", "Des unités de taille", "Des propriétés CSS"], a: 1, exp: "Elles laissent le navigateur choisir une police du bon style." },
    { type: "qcm", q: "Où colle-t-on la balise &lt;link&gt; fournie par Google Fonts ?", opts: ["Dans le &lt;head&gt;", "En bas du &lt;body&gt;", "Dans style.css", "Dans le &lt;footer&gt;"], a: 0, exp: "Comme toute ressource externe, dans le head — avant style.css." },
    { type: "qcm", q: "1rem correspond par défaut à…", opts: ["1px", "10px", "16px (taille de la racine)", "La taille du parent"], a: 2, exp: "rem = root em : multiple de la taille de l'élément racine, 16px par défaut." },
    { type: "qcm", q: "La différence entre rem et em :", opts: ["Aucune", "rem se base sur la racine, em sur le parent", "em est plus moderne", "rem ne marche que sur les titres"], a: 1, exp: "Avec em, les imbrications se multiplient ; rem reste prévisible." },
    { type: "qcm", q: "Pourquoi préférer rem à px pour font-size ?", opts: ["rem charge plus vite", "rem respecte le réglage de taille de texte de l'utilisateur", "px n'existe plus", "rem est plus court à écrire"], a: 1, exp: "Si l'utilisateur agrandit le texte dans son navigateur, les rem suivent." },
    { type: "qcm", q: "font-weight: 700; rend le texte…", opts: ["Italique", "Gras", "Souligné", "Plus grand"], a: 1, exp: "400 = normal, 700 = gras. La graisse, pas la taille." },
    { type: "qcm", q: "La valeur de line-height recommandée pour le confort de lecture :", opts: ["0.8", "1", "environ 1.5", "3"], a: 2, exp: "Une fois et demie la taille du texte : les lignes respirent sans flotter." },
    { type: "qcm", q: "Pour enlever le souligné des liens du menu :", opts: ["nav a { text-decoration: none; }", "nav a { underline: false; }", "nav a { text-style: plain; }", "nav a { border: none; }"], a: 0, exp: "text-decoration gère souligné, barré, surligné." },
    { type: "qcm", q: "letter-spacing: 2px; agit sur…", opts: ["L'espace entre les lignes", "L'espace entre les lettres", "L'espace entre les mots", "La marge du bloc"], a: 1, exp: "À petite dose, pour un titre ou un sous-titre en capitales." },
    { type: "vf", q: "Un nom de police composé comme Segoe UI doit être entre guillemets dans font-family.", a: true, exp: "\"Segoe UI\" — les noms à espaces prennent des guillemets." },
    { type: "vf", q: "Il est conseillé d'utiliser cinq ou six polices différentes pour un site vivant.", a: false, exp: "Deux polices maximum : la sobriété typographique fait pro." },
    { type: "vf", q: "Enlever le souligné des liens situés dans les paragraphes est une bonne pratique.", a: false, exp: "Dans le texte courant, le souligné signale le lien ; on ne le retire qu'en contexte évident (menus, boutons)." },
    { type: "input", q: "Quelle propriété CSS règle la hauteur des lignes d'un texte ?", a: ["line-height"], ph: "propriété…", exp: "line-height: 1.5; — valeur sans unité recommandée." },
    { type: "input", q: "Avec une racine à 16px, combien de px fait 1.5rem ? (nombre seul)", a: ["24", "24px"], ph: "nombre…", exp: "1.5 × 16 = 24px — la taille classique d'un h2." }
  ],
  final: {
    title: "Exercice final — L'identité typographique de la Ludothèque",
    intro: `<p>On installe Poppins et on règle titres, texte et menu une bonne fois pour toutes.</p>`,
    questions: [
      { type: "qcm", q: "L'ordre correct dans le &lt;head&gt; :", opts: ["style.css puis la Google Font", "La Google Font puis style.css", "Les deux dans le body", "Peu importe, jamais"], a: 1, exp: "La police d'abord : style.css peut alors l'utiliser dès son chargement." },
      { type: "input", q: "Complète : body { font-______: \"Poppins\", Arial, sans-serif; }", a: ["family"], ph: "fin de la propriété…", exp: "font-family définit la police et ses secours." },
      { type: "qcm", q: "Pour un h1 deux fois plus grand que le texte de base :", opts: ["font-size: 2rem;", "font-size: 2px;", "font-weight: 2;", "line-height: 2px;"], a: 0, exp: "2rem = 2 × la taille racine = 32px par défaut." },
      { type: "vf", q: "body { line-height: 1.5; } s'applique aussi aux paragraphes des cartes de jeux, par héritage.", a: true, exp: "Les propriétés de texte s'héritent : réglées sur body, elles se propagent." },
      { type: "qcm", q: "Le lien « Donner un avis » dans un paragraphe de la fiche jeu doit…", opts: ["Perdre son souligné comme le menu", "Garder son souligné pour rester repérable", "Devenir un h2", "Passer en letter-spacing: 5px"], a: 1, exp: "En plein texte, le souligné est le signal du lien." }
    ],
    solution: `<pre class="pseudo">&lt;!-- head : la police avant la feuille de style --&gt;
&lt;link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&amp;display=swap" rel="stylesheet"&gt;
&lt;link rel="stylesheet" href="style.css"&gt;

/* style.css — identité typographique */
body  { font-family: "Poppins", Arial, sans-serif;
        font-size: 1rem; line-height: 1.5; }
h1    { font-size: 2rem;   font-weight: 700; }
h2    { font-size: 1.5rem; font-weight: 700; }
nav a { text-decoration: none; font-weight: 700; }
.sous-titre { letter-spacing: 2px; text-transform: uppercase; }</pre>
<p>Le site a une voix. Demain, on range tout ça : Flexbox va aligner le menu, les cartes et le footer.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "web-l10", title: "La charte typographique", level: 2,
    checklist: [
      "La balise <link> de la Google Font est-elle dans le <head>, avant style.css ?",
      "As-tu une police de secours après la Google Font (ex. Arial, sans-serif) ?",
      "Tes tailles sont-elles en rem et hiérarchisées (h1 > h2 > texte) ?",
      "text-decoration: none ne touche-t-il que nav a, et non tous les a ?"
    ],
    statement: "Rédige la charte typographique de la Ludothèque : choisis une Google Font pour le site (justifie ton choix en une phrase), définis une échelle de tailles en rem pour h1, h2 et le texte courant, un line-height de confort, et le traitement des liens du menu (souligné retiré, graisse). Livre le tout en deux parties : la balise &lt;link&gt; à placer dans le &lt;head&gt;, puis les règles CSS complètes avec polices de secours.",
    hints: [
      "Sur fonts.google.com, une police lisible en petites tailles (Poppins, Inter, Nunito…) vaut mieux qu'une police décorative.",
      "Échelle simple et contrastée : 2rem / 1.5rem / 1rem — le lecteur doit distinguer la hiérarchie d'un coup d'œil.",
      "Ne retire text-decoration que sur nav a, pas sur tous les a."
    ],
    solution: "CHARTE TYPOGRAPHIQUE — Ludothèque\nPolice : Poppins — ronde et amicale, elle évoque l'univers du jeu\ntout en restant très lisible pour les descriptions.\n\n<!-- dans le <head>, avant style.css -->\n<link href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap\" rel=\"stylesheet\">\n\n/* style.css */\nbody {\n  font-family: \"Poppins\", Arial, sans-serif;\n  font-size: 1rem;        /* 16px : la base */\n  line-height: 1.5;       /* lignes qui respirent */\n}\nh1 {\n  font-size: 2rem;        /* 32px : domine la page */\n  font-weight: 700;\n}\nh2 {\n  font-size: 1.5rem;      /* 24px : sections bien marquées */\n  font-weight: 700;\n}\nnav a {\n  text-decoration: none;  /* menu épuré */\n  font-weight: 700;\n}",
    note: "Une charte typographique écrite noir sur blanc évite les tailles improvisées règle après règle — c'est elle qui donne au site son air cohérent. En leçon 14, ces valeurs deviendront le bloc « typographie » de ta feuille de style finale, et tu constateras qu'une bonne charte se transpose telle quelle d'un projet à l'autre." }
  ]
};
</script>
<script src="exo-ecriture.js"></script>
