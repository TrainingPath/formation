<script>
var DAY = {
  num: 11,
  title: "Flexbox : aligner et distribuer",
  subtitle: "Centrer verticalement sans pleurer : Flexbox est l'outil d'alignement que le CSS attendait.",
  theory: `
<h3>1. display: flex — sur le parent</h3>
<p>Flexbox range des éléments <strong>le long d'un axe</strong>, comme on aligne des livres sur une étagère. Vocabulaire : le <strong>parent</strong> (ou <strong>conteneur</strong>) est la boîte qui en contient d'autres ; ses <strong>enfants directs</strong> sont les boîtes placées immédiatement à l'intérieur (pas les « petits-enfants » nichés plus profond). Règle d'or : la propriété <code>display: flex</code> s'applique au <strong>parent</strong>, et ce sont ses enfants directs qui s'alignent. Une ligne suffit pour transformer le menu vertical de la Ludothèque en barre horizontale :</p>
<pre class="pseudo">&lt;nav&gt;                                   &lt;!-- le conteneur (parent) qui deviendra "flex" --&gt;
  &lt;a href="index.html"&gt;Accueil&lt;/a&gt;        &lt;!-- enfant direct n°1 : un lien --&gt;
  &lt;a href="jeux.html"&gt;Les jeux&lt;/a&gt;        &lt;!-- enfant direct n°2 --&gt;
  &lt;a href="avis.html"&gt;Donner un avis&lt;/a&gt;  &lt;!-- enfant direct n°3 --&gt;
&lt;/nav&gt;                                  &lt;!-- fin du conteneur --&gt;</pre>
<pre class="pseudo">nav {                /* on cible le conteneur <nav> */
  display: flex;     /* active Flexbox : les liens se placent côte à côte */
}                    /* fin de la règle */</pre>

<h3>2. Deux axes : principal et secondaire</h3>
<p>Un conteneur flex a un <strong>axe principal</strong> (la direction de rangement) et un <strong>axe secondaire</strong> (perpendiculaire, à angle droit). <code>flex-direction</code> choisit l'axe principal :</p>
<pre class="pseudo">flex-direction: row;      /* défaut : en ligne, axe principal HORIZONTAL */
flex-direction: column;   /* en colonne, axe principal VERTICAL */</pre>
<p>Tout le vocabulaire de Flexbox découle de là : <code>justify-content</code> distribue le long de l'axe <strong>principal</strong>, <code>align-items</code> aligne le long de l'axe <strong>secondaire</strong>.</p>

<h3>3. justify-content et align-items</h3>
<pre class="pseudo">header {                             /* le conteneur d'en-tête */
  display: flex;                     /* active Flexbox sur ses enfants directs */
  justify-content: space-between;    /* axe principal : logo à gauche, menu à droite */
  align-items: center;               /* axe secondaire : tout centré verticalement */
}                                    /* fin de la règle header */

/* valeurs utiles de justify-content :
   flex-start | center | flex-end | space-between | space-around */</pre>
<p>Le duo magique à mémoriser : <code>justify-content: center; align-items: center;</code> centre parfaitement un contenu horizontalement ET verticalement — le graal historique du CSS, réglé en deux lignes.</p>

<h3>4. gap et flex-wrap</h3>
<p><code>gap</code> insère un espace <strong>entre</strong> les enfants — fini les margins bricolées qui débordent aux extrémités. <code>flex-wrap: wrap</code> autorise le passage à la ligne quand la place manque (comme un texte qui revient à la ligne au bord de la page) : indispensable pour la rangée de cartes de jeux :</p>
<pre class="pseudo">.liste-jeux {          /* le conteneur qui regroupe les cartes */
  display: flex;       /* active Flexbox */
  flex-wrap: wrap;     /* les cartes passent à la ligne si besoin */
  gap: 16px;           /* 16px entre les cartes, jamais aux bords */
}                      /* fin de la règle */</pre>

<h3>5. flex: 1 — se partager l'espace</h3>
<p>Posée sur un <strong>enfant</strong>, <code>flex: 1</code> lui dit de grandir pour occuper l'espace libre. Plusieurs enfants avec <code>flex: 1</code> se partagent l'espace équitablement. Parfait pour le footer de la Ludothèque en trois colonnes égales :</p>
<pre class="pseudo">footer {               /* le conteneur pied de page */
  display: flex;       /* ses sections se rangent en ligne */
  gap: 24px;           /* 24px d'espace entre les colonnes */
}                      /* fin de la règle footer */
footer section {       /* chaque <section> enfant du footer */
  flex: 1;             /* grandit pour occuper l'espace → colonnes égales */
}                      /* fin de la règle */</pre>
<div class="warn">Erreur n°1 en Flexbox : poser <code>display: flex</code> sur les <strong>enfants</strong> au lieu du parent. Si rien ne s'aligne, vérifie d'abord que la règle est bien sur le conteneur — et que les éléments à ranger sont ses enfants <strong>directs</strong>.</div>
<div class="tip">Dans l'inspecteur (F12), les conteneurs flex ont un badge <strong>flex</strong> cliquable : il superpose à la page les axes et les espacements. Active-le sur ta nav, change justify-content dans le panneau et observe en direct — Flexbox s'apprend par l'œil.</div>`,
  exercises: [
    { type: "qcm", q: "Pour aligner les liens du menu côte à côte, display: flex se pose sur…", opts: ["Chaque lien &lt;a&gt;", "Le conteneur &lt;nav&gt;", "Le &lt;body&gt;", "Le premier lien seulement"], a: 1, exp: "Toujours sur le parent : ses enfants directs s'alignent." },
    { type: "qcm", q: "La valeur par défaut de flex-direction :", opts: ["column", "row", "wrap", "center"], a: 1, exp: "row : les enfants se rangent en ligne, horizontalement." },
    { type: "qcm", q: "justify-content distribue les éléments le long de…", opts: ["L'axe principal", "L'axe secondaire", "La diagonale", "L'axe des z"], a: 0, exp: "justify = axe principal ; align = axe secondaire." },
    { type: "qcm", q: "align-items agit sur…", opts: ["L'axe principal", "L'axe secondaire (perpendiculaire)", "La couleur", "L'ordre des éléments"], a: 1, exp: "En row, align-items gère donc l'alignement vertical." },
    { type: "qcm", q: "Logo à gauche, menu à droite, tout l'espace entre les deux :", opts: ["justify-content: center;", "justify-content: space-between;", "align-items: flex-end;", "flex-direction: column;"], a: 1, exp: "space-between pousse le premier et le dernier aux extrémités." },
    { type: "qcm", q: "Le duo qui centre un contenu horizontalement ET verticalement :", opts: ["text-align + margin", "justify-content: center + align-items: center", "padding: auto + width: 50%", "float: center + top: 50%"], a: 1, exp: "Deux lignes sur le conteneur flex : le graal du centrage." },
    { type: "qcm", q: "gap: 16px; place 16px…", opts: ["Autour de chaque enfant, bords compris", "Uniquement entre les enfants", "Uniquement à gauche", "Dans le padding du parent"], a: 1, exp: "C'est son avantage sur margin : jamais d'espace parasite aux extrémités." },
    { type: "qcm", q: "Les cartes de jeux débordent de l'écran au lieu de passer à la ligne. Il manque…", opts: ["flex-wrap: wrap;", "flex-direction: column;", "gap: 0;", "align-items: stretch;"], a: 0, exp: "Par défaut (nowrap), les enfants se compriment ou débordent sur une seule ligne." },
    { type: "qcm", q: "flex: 1 posé sur un enfant signifie…", opts: ["Il devient le premier", "Il grandit pour prendre l'espace libre", "Il fait 1px", "Il est masqué"], a: 1, exp: "Trois enfants en flex: 1 = trois colonnes égales." },
    { type: "qcm", q: "Pour empiler verticalement les éléments d'un conteneur flex :", opts: ["flex-direction: column;", "flex-wrap: wrap;", "align-items: bottom;", "display: block-flex;"], a: 0, exp: "column bascule l'axe principal à la verticale." },
    { type: "qcm", q: "Dans un header en display:flex (row), align-items: center sert à…", opts: ["Centrer le texte des liens", "Centrer verticalement logo et menu entre eux", "Centrer la page", "Espacer les liens"], a: 1, exp: "En row, l'axe secondaire est vertical : les enfants s'alignent à mi-hauteur." },
    { type: "vf", q: "Flexbox aligne les enfants directs du conteneur, pas les petits-enfants.", a: true, exp: "Un petit-enfant est géré par SON propre parent — au besoin, on met celui-ci en flex aussi." },
    { type: "vf", q: "display: flex doit être posé sur chaque élément que l'on veut aligner.", a: false, exp: "Une seule fois, sur le conteneur parent." },
    { type: "input", q: "Quelle propriété crée un espace entre les enfants d'un conteneur flex ?", a: ["gap"], ph: "propriété…", exp: "gap: 16px; — l'espacement moderne, sans margins bricolées." },
    { type: "input", q: "Quelle valeur de flex-wrap autorise le retour à la ligne ?", a: ["wrap"], ph: "valeur…", exp: "flex-wrap: wrap; — indispensable pour une rangée de cartes." }
  ],
  final: {
    title: "Exercice final — Nav, cartes et footer alignés",
    intro: `<p>Trois chantiers Flexbox sur la Ludothèque : la barre de navigation, la rangée de cartes, le footer en colonnes.</p>`,
    questions: [
      { type: "qcm", q: "Le menu &lt;nav&gt; doit devenir horizontal. La règle minimale :", opts: ["nav a { display: flex; }", "nav { display: flex; }", "nav { flex-direction: row; }", "nav { align-items: row; }"], a: 1, exp: "display: flex sur le parent ; row est déjà la direction par défaut." },
      { type: "input", q: "Complète : .liste-jeux { display: flex; flex-wrap: ______; gap: 16px; }", a: ["wrap"], ph: "valeur…", exp: "wrap laisse les cartes passer à la ligne sur petit écran." },
      { type: "qcm", q: "Pour trois sections de footer en colonnes égales :", opts: ["footer section { flex: 1; }", "footer { flex: 3; }", "footer section { width: flex; }", "footer { justify-content: 3; }"], a: 0, exp: "flex: 1 sur chaque enfant : ils se partagent l'espace équitablement." },
      { type: "vf", q: "Dans le header en flex, justify-content: space-between place le titre à gauche et la nav à droite.", a: true, exp: "space-between écarte les enfants aux deux extrémités de l'axe principal." },
      { type: "qcm", q: "Les liens du menu sont collés. La correction la plus propre :", opts: ["Des espaces insécables dans le HTML", "gap: 16px; sur la nav", "margin-left sur le premier lien", "letter-spacing: 16px;"], a: 1, exp: "gap espace les enfants entre eux, sans toucher au HTML ni aux bords." }
    ],
    solution: `<pre class="pseudo">header {                             /* conteneur d'en-tête */
  display: flex;                     /* active Flexbox */
  justify-content: space-between;    /* axe principal : titre à gauche, menu à droite */
  align-items: center;               /* axe secondaire : centrés verticalement */
}                                    /* fin de header */
nav          { display: flex; gap: 16px; }   /* nav en flex + 16px entre les liens */

.liste-jeux  { display: flex; flex-wrap: wrap; gap: 16px; }   /* cartes en flex, retour à la ligne, 16px d'écart */

footer         { display: flex; gap: 24px; }   /* footer en flex + 24px entre colonnes */
footer section { flex: 1; }        /* chaque section : une colonne égale */

Mémo : parent = display:flex / justify = axe principal
       align = axe secondaire / gap = espace entre enfants</pre>
<p>Flexbox range en ligne OU en colonne. Pour une vraie grille — lignes ET colonnes à la fois — rendez-vous demain avec Grid.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "web-l11", title: "Le header de la Ludothèque, expliqué puis codé", level: 2,
    checklist: [
      "As-tu identifié les DEUX conteneurs flex (le header et la nav) ?",
      "justify-content agit-il sur l'axe principal, align-items sur l'axe secondaire ?",
      "L'espace entre les liens est-il géré par gap (et non par des margins) ?",
      "As-tu nommé l'axe concerné pour chaque propriété avant de coder ?"
    ],
    statement: "Le header de la Ludothèque contient un titre h1 « La Ludothèque » et une nav de trois liens (Accueil, Les jeux, Donner un avis). Objectif : titre à gauche, menu à droite, le tout centré verticalement, avec 16px entre les liens. Rédige d'abord un court paragraphe expliquant quel(s) élément(s) deviennent conteneurs flex et pourquoi, en nommant l'axe concerné par chaque propriété utilisée. Écris ensuite le CSS complet du header et de la nav.",
    hints: [
      "Il y a DEUX conteneurs flex ici : le header (titre + nav) et la nav elle-même (les trois liens).",
      "justify-content: space-between agit sur l'axe principal du header ; align-items: center sur son axe secondaire.",
      "L'espace entre les liens ne se règle ni avec margin ni dans le HTML : gap sur la nav."
    ],
    solution: "EXPLICATION\nLe header devient conteneur flex pour ranger ses deux enfants directs\n(le h1 et la nav) sur l'axe principal horizontal :\njustify-content: space-between les pousse aux deux extrémités, et\nalign-items: center les centre sur l'axe secondaire (vertical).\nLa nav devient à son tour conteneur flex pour aligner ses trois liens\ncôte à côte, avec gap: 16px comme espace entre eux.\n\n/* style.css */\nheader {                          /* conteneur des deux enfants (h1 + nav) */\n  display: flex;                  /* active Flexbox */\n  justify-content: space-between; /* axe principal : titre à gauche, menu à droite */\n  align-items: center;            /* axe secondaire : centrés verticalement */\n  padding: 12px 24px;             /* air interne : 12px haut/bas, 24px gauche/droite */\n}                                 /* fin de header */\nnav {                             /* conteneur des trois liens */\n  display: flex;                  /* les liens côte à côte */\n  gap: 16px;                      /* 16px entre chaque lien */\n}                                 /* fin de nav */",
    note: "Repérer les conteneurs avant d'écrire la moindre propriété est LE réflexe Flexbox : la plupart des blocages viennent d'une règle posée au mauvais niveau de l'arbre HTML. Cette lecture en « parent/enfants directs » te resservira en semaine JavaScript, où tu parcourras exactement le même arbre avec le DOM." }
  ]
};
</script>
<script src="exo-ecriture.js"></script>
