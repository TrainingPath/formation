  title: "Récapitulatif : la Ludothèque interactive (examen)",
  subtitle: "Trois semaines, trois langages, un site complet.",
  theory: `
<h3>1. Le chemin parcouru</h3>
<pre class="pseudo">Semaine 1 — HTML : la STRUCTURE
  balises, sémantique (header/nav/main/footer), tableaux, formulaires
Semaine 2 — CSS : l'APPARENCE
  sélecteurs, boîtes, flexbox, grid, responsive mobile-first
Semaine 3 — JS : l'INTERACTIVITÉ
  variables, fonctions, DOM, événements, validation, fetch</pre>
<p>Les trois couches sont <strong>séparées</strong> : le HTML dit ce que c'est, le CSS dit à quoi ça ressemble, le JS dit comment ça réagit. Cette séparation est LE principe du front-end.</p>

<h3>2. La Ludothèque, assemblée</h3>
<pre class="pseudo">ludotheque/
├── index.html        page d'accueil (leçon 7)
├── jeux.html         catalogue : cartes en grid (leçons 12, 14)
├── jeu.html          fiche d'un jeu + formulaire d'avis (leçons 6, 19)
├── style.css         un seul CSS pour tout le site (leçons 8-14)
└── app.js            DOM + événements + fetch (leçons 15-20)</pre>

<h3>3. Les réflexes acquis</h3>
<p><strong>HTML</strong> : la bonne balise pour le bon sens (un lien = <code>&lt;a&gt;</code>, une action = <code>&lt;button&gt;</code>, un label pour chaque champ). <strong>CSS</strong> : mobile d'abord, classes réutilisables, flexbox pour aligner, grid pour la page. <strong>JS</strong> : sélectionner → écouter → réagir, valider avant d'envoyer, <code>fetch</code> pour parler au serveur.</p>

<h3>4. Ce que ce cours prépare</h3>
<pre class="pseudo">→ Frameworks du Niveau 3 (Django, Spring, Laravel, ASP.NET) :
  leurs templates GÉNÈRENT le HTML/CSS que tu sais maintenant écrire
→ Cours API REST : le serveur que ton fetch appelle
→ Capstones du Niveau 6 : la Ludothèque complète, front + back</pre>

<h3>5. L'examen</h3>
<p>Les 15 exercices puis l'exercice final balaient les trois semaines. Vise le sans-faute : chaque question correspond à un réflexe que les frameworks supposeront acquis.</p>
<div class="warn">Le front-end évolue vite (frameworks JS, outils…) mais HTML, CSS et le DOM sont stables depuis 25 ans : c'est ce socle qui est examiné ici, et c'est lui qui ne périme pas.</div>

    ],
    solution: `<pre class="pseudo">════════ LA LUDOTHÈQUE INTERACTIVE — RÉSUMÉ DU COURS ════════
HTML (S1)  : balises de SENS — header/nav/main/footer, h1…h6,
             listes, tableaux, formulaires avec labels
CSS  (S2)  : sélecteurs, boîtes (margin/border/padding),
