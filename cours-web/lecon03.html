<script>
var DAY = {
  num: 3,
  title: "Liens et images : relier les pages",
  subtitle: "Le « H » de HTML, c'est Hypertexte : sans liens, pas de web.",
  theory: `
<h3>1. Le lien : la balise a et son attribut href</h3>
<p>Un <strong>lien</strong> (un texte cliquable qui mène ailleurs) s'écrit avec la balise <code>&lt;a&gt;</code> (<em>anchor</em>, ancre) et son attribut <strong><code>href</code></strong> (<em>hypertext reference</em>) qui indique la destination. Le texte entre les balises est ce qui est cliquable.</p>
<pre class="pseudo">&lt;a href="jeux.html"&gt;Voir tous nos jeux&lt;/a&gt;   &lt;!-- &lt;a&gt; = lien ; href = où il mène ; le texte entre les balises est cliquable --&gt;</pre>
<p>Un <strong>attribut</strong> se place dans la balise ouvrante, sous la forme <code>nom="valeur"</code>. Tu en as déjà croisé : <code>lang="fr"</code>, <code>charset="UTF-8"</code>. Le texte du lien doit être parlant : « Voir tous nos jeux » plutôt que « cliquez ici » — un visiteur (ou un lecteur d'écran) doit comprendre la destination sans lire autour.</p>

<h3>2. Chemins relatifs et URL absolues</h3>
<p>Deux façons de désigner une destination. L'<strong>URL absolue</strong> (l'adresse web complète, commençant par <code>https://</code>) sert à pointer vers un autre site. Le <strong>chemin relatif</strong> part du fichier courant, pour naviguer <em>dans ton propre site</em>.</p>
<pre class="pseudo">&lt;a href="https://www.catan.com"&gt;Site officiel de Catan&lt;/a&gt;  &lt;!-- URL ABSOLUE : adresse complète d'un autre site --&gt;
&lt;a href="jeux.html"&gt;Nos jeux&lt;/a&gt;             &lt;!-- chemin relatif : fichier dans le MÊME dossier --&gt;
&lt;a href="images/catan.jpg"&gt;La boîte&lt;/a&gt;      &lt;!-- relatif : fichier DANS le sous-dossier images/ --&gt;
&lt;a href="../index.html"&gt;Accueil&lt;/a&gt;          &lt;!-- relatif : .. = remonter au dossier PARENT --&gt;</pre>
<p>Pour tes propres pages, <strong>toujours du relatif</strong> : le site continue de fonctionner si tu déplaces le dossier <code>ludotheque/</code> ou si tu le publies en ligne.</p>

<h3>3. Ancres et target="_blank"</h3>
<p>Un lien peut aussi viser un <strong>endroit précis d'une page</strong> : on pose un attribut <code>id</code> (un identifiant unique) sur l'élément cible, puis on le vise avec <code>#</code>.</p>
<pre class="pseudo">&lt;h2 id="horaires"&gt;Horaires d'ouverture&lt;/h2&gt;   &lt;!-- la CIBLE : on lui donne un id unique "horaires" --&gt;
&lt;a href="#horaires"&gt;Voir les horaires&lt;/a&gt;     &lt;!-- #horaires = saute vers l'id, sur la MÊME page --&gt;
&lt;a href="index.html#horaires"&gt;Horaires&lt;/a&gt;    &lt;!-- fichier + #id : vise cet endroit depuis une AUTRE page --&gt;</pre>
<p>L'attribut <code>target="_blank"</code> ouvre le lien dans un <strong>nouvel onglet</strong>. Réserve-le aux liens qui sortent de ton site (le visiteur garde ta page ouverte) ; pour la navigation interne, on reste dans le même onglet.</p>

<h3>4. Les images : img, src et alt</h3>
<p>La balise <code>&lt;img&gt;</code> (<em>image</em>) est <strong>auto-fermante</strong> et exige deux attributs : <code>src</code> (le chemin du fichier image) et <code>alt</code> (le texte alternatif).</p>
<pre class="pseudo">&lt;img src="images/catan.jpg" alt="Boîte du jeu Catan"&gt;   &lt;!-- src = QUEL fichier afficher ; alt = texte de remplacement décrivant l'image --&gt;</pre>
<p>Le <code>alt</code> n'est pas décoratif, il est <strong>essentiel</strong> : lu par les lecteurs d'écran pour les personnes malvoyantes, affiché si l'image ne charge pas, utilisé par les moteurs de recherche. Décris ce que l'image <em>montre</em>, brièvement. Bonne pratique d'organisation : toutes les images dans un sous-dossier <code>images/</code>, avec des noms simples, en minuscules, sans espaces ni accents (<code>catan.jpg</code>, pas <code>Photo Catan (1).JPG</code>).</p>

<h3>5. figure/figcaption — et la Ludothèque se connecte</h3>
<p>Pour associer une légende <strong>visible</strong> à une image, on l'enveloppe dans <code>&lt;figure&gt;</code> avec un <code>&lt;figcaption&gt;</code> (<em>figure caption</em>, légende de figure). Créons la page <code>jeux.html</code> et relions tout :</p>
<pre class="pseudo">ludotheque/                       &lt;!-- le dossier du site --&gt;
├── index.html                    &lt;!-- page d'accueil (déjà créée) --&gt;
├── jeux.html                     &lt;!-- NOUVELLE page à créer aujourd'hui --&gt;
└── images/                       &lt;!-- sous-dossier des images --&gt;
    └── catan.jpg                 &lt;!-- la photo de la boîte --&gt;

Dans index.html :                 &lt;!-- on ajoute un lien vers la nouvelle page --&gt;
&lt;a href="jeux.html"&gt;Découvrir tous nos jeux&lt;/a&gt;   &lt;!-- lien ALLER : accueil → jeux --&gt;

Dans jeux.html :                  &lt;!-- contenu de la nouvelle page --&gt;
&lt;h1&gt;Nos jeux&lt;/h1&gt;                 &lt;!-- titre principal de la page --&gt;
&lt;figure&gt;                          &lt;!-- figure = image + sa légende, groupées --&gt;
  &lt;img src="images/catan.jpg" alt="Boîte du jeu Catan"&gt;   &lt;!-- l'image, avec son texte alternatif --&gt;
  &lt;figcaption&gt;Catan — le classique de la stratégie&lt;/figcaption&gt;   &lt;!-- la légende VISIBLE sous l'image --&gt;
&lt;/figure&gt;                         &lt;!-- fin de la figure --&gt;
&lt;a href="index.html"&gt;← Retour à l'accueil&lt;/a&gt;   &lt;!-- lien RETOUR : jeux → accueil --&gt;</pre>
<p>Deux pages, des liens dans les deux sens, une photo légendée : la Ludothèque est devenue un vrai <em>site</em>, plus une page isolée.</p>
<div class="warn">Une image sans <code>alt</code>, c'est un contenu invisible pour une personne malvoyante et un trou pour les moteurs de recherche. Le réflexe : <code>src</code> et <code>alt</code> s'écrivent <strong>toujours ensemble</strong>, dès la création de la balise.</div>
<div class="tip">Teste tes liens en cliquant TOUS après chaque ajout, et vérifie tes images en renommant temporairement le fichier : tu verras alors ton texte alt s'afficher — c'est exactement ce que « voit » un lecteur d'écran.</div>`,
  exercises: [
    { type: "qcm", q: "Quel attribut de &lt;a&gt; indique la destination du lien ?", opts: ["src", "href", "link", "url"], a: 1, exp: "href (hypertext reference) : sans lui, pas de lien." },
    { type: "input", q: "Nom de la balise qui crée un lien, sans les chevrons :", a: ["a", "<a>"], ph: "nom de la balise…", exp: "a comme anchor (ancre) : la balise qui a donné son nom à l'hypertexte." },
    { type: "qcm", q: "Pour relier jeux.html à index.html (même dossier), le href correct est…", opts: ["https://index.html", "index.html", "C:\\ludotheque\\index.html", "#index"], a: 1, exp: "Chemin relatif, même dossier : juste le nom du fichier." },
    { type: "qcm", q: "Pourquoi préférer les chemins relatifs pour ses propres pages ?", opts: ["Ils chargent plus vite", "Le site fonctionne même si on déplace ou publie le dossier", "Ils sont plus jolis", "C'est obligatoire en HTML5"], a: 1, exp: "Un chemin absolu vers ton disque casserait dès la mise en ligne." },
    { type: "qcm", q: "Dans un chemin, que désigne .. ?", opts: ["Le fichier courant", "Le dossier parent", "La racine du web", "Une erreur de frappe"], a: 1, exp: "../index.html = remonter d'un dossier, puis prendre index.html." },
    { type: "qcm", q: "Pour créer un lien vers la section &lt;h2 id=\"horaires\"&gt; de la même page :", opts: ["href=\"horaires\"", "href=\"#horaires\"", "href=\"id.horaires\"", "src=\"#horaires\""], a: 1, exp: "Le # vise un id : c'est une ancre interne." },
    { type: "vf", q: "target=\"_blank\" ouvre le lien dans un nouvel onglet.", a: true, exp: "À réserver aux liens qui sortent de ton site." },
    { type: "qcm", q: "Le meilleur texte de lien parmi ces choix :", opts: ["Cliquez ici", "Lien", "Découvrir tous nos jeux", "http://..."], a: 2, exp: "Le texte doit annoncer la destination, pour tout visiteur et tout lecteur d'écran." },
    { type: "input", q: "Quel attribut de &lt;img&gt; contient le texte alternatif ? (nom de l'attribut seul)", a: ["alt"], ph: "nom de l'attribut…", exp: "alt : lu par les lecteurs d'écran, affiché si l'image manque." },
    { type: "qcm", q: "La balise &lt;img&gt; est…", opts: ["Toujours fermée par &lt;/img&gt;", "Auto-fermante : pas de balise fermante", "Interdite dans le body", "Une balise CSS"], a: 1, exp: "Comme &lt;br&gt; et &lt;meta&gt; : pas de contenu, pas de fermante." },
    { type: "qcm", q: "Un bon texte alt pour la photo de la boîte de Catan :", opts: ["image1", "photo", "Boîte du jeu Catan", "CLIQUEZ POUR AGRANDIR"], a: 2, exp: "On décrit ce que l'image montre, brièvement." },
    { type: "vf", q: "Si l'image ne charge pas, le navigateur affiche le contenu de alt à sa place.", a: true, exp: "Deuxième vie du alt, avec l'accessibilité et le référencement." },
    { type: "qcm", q: "Le bon nom de fichier pour une image du site :", opts: ["Photo Catan (1).JPG", "catan.jpg", "CATAN FINAL!!.jpeg", "boîte de catan.jpg"], a: 1, exp: "Minuscules, sans espaces ni accents : des chemins fiables partout." },
    { type: "qcm", q: "Pour afficher une légende VISIBLE sous une image, on utilise…", opts: ["l'attribut alt", "&lt;figure&gt; + &lt;figcaption&gt;", "un commentaire HTML", "&lt;caption&gt; seul"], a: 1, exp: "alt est invisible ; figcaption, dans figure, s'affiche sous l'image." },
    { type: "vf", q: "À la fin de cette leçon, index.html et jeux.html pointent l'un vers l'autre.", a: true, exp: "Lien aller sur l'accueil, lien retour sur la page des jeux : un vrai site." }
  ],
  final: {
    title: "Exercice final — Tout est relié",
    intro: `<p>Liens internes, externes, ancres et images : vérifie que la navigation n'a plus de secret.</p>`,
    questions: [
      { type: "qcm", q: "Le lien complet et correct vers la page des jeux :", opts: ["&lt;a&gt;jeux.html&lt;/a&gt;", "&lt;a href=\"jeux.html\"&gt;Nos jeux&lt;/a&gt;", "&lt;a src=\"jeux.html\"&gt;Nos jeux&lt;/a&gt;", "&lt;link href=\"jeux.html\"&gt;"], a: 1, exp: "Balise a, attribut href, texte cliquable parlant." },
      { type: "qcm", q: "Pour un lien vers le site officiel d'un éditeur de jeux (site externe) :", opts: ["Un chemin relatif suffit", "URL absolue, et target=\"_blank\" est pertinent", "Une ancre #editeur", "C'est impossible en HTML"], a: 1, exp: "Autre site = adresse complète ; le nouvel onglet garde ta page ouverte." },
      { type: "vf", q: "L'attribut alt est facultatif si l'image est jolie.", a: false, exp: "alt est toujours nécessaire : accessibilité, image manquante, référencement." },
      { type: "input", q: "Quel attribut de &lt;img&gt; indique le chemin du fichier image ? (nom de l'attribut seul)", a: ["src"], ph: "nom de l'attribut…", exp: "src = source. Le duo src + alt est indissociable." },
      { type: "qcm", q: "L'image de Catan est dans ludotheque/images/. Depuis jeux.html (dans ludotheque/), le src correct :", opts: ["catan.jpg", "images/catan.jpg", "/ludotheque/catan.jpg", "../catan.jpg"], a: 1, exp: "Depuis jeux.html, on descend dans le sous-dossier images/." }
    ],
    solution: `<pre class="pseudo">Lien    : &lt;a href="destination"&gt;texte parlant&lt;/a&gt;                  // balise a + href + texte cliquable clair
Chemins : relatif (jeux.html, images/catan.jpg, ../index.html) chez soi,   // toujours du relatif dans ton site
          URL absolue (https://…) vers les autres sites               // adresse complète pour un site externe
Ancre   : id="horaires" sur la cible → href="#horaires"               // sauter à un endroit précis d'une page
Onglet  : target="_blank" pour les liens externes uniquement          // garde ta page ouverte à côté
Image   : &lt;img src="images/catan.jpg" alt="Boîte du jeu Catan"&gt;       // src = fichier, alt = description
Légende : &lt;figure&gt; + &lt;figcaption&gt; pour un texte visible               // légende affichée sous l'image

Ludothèque : index.html ↔ jeux.html reliés, photo de Catan légendée.   // le site du jour</pre>
<p>Les pages se parlent, mais chacune est encore un simple empilement de balises. Demain, on leur donne une vraie charpente : header, nav, main, footer.</p>`
  }
};
</script>

var ECRITURE = {

  { id: "web-l3", title: "La fiche du jeu Catan", level: 2,
    lang: "js",
    tests: [

    statement: "Écris le contenu du &lt;body&gt; d'une nouvelle page jeu-catan.html (dans le dossier ludotheque/, à côté d'index.html et du dossier images/). Elle doit contenir : un h1 avec le nom du jeu, un paragraphe de description, une image de la boîte (fichier images/catan.jpg) avec sa légende visible, un lien externe vers le site officiel https://www.catan.com qui s'ouvre dans un nouvel onglet, et un lien de retour vers la liste des jeux (jeux.html). Chaque chemin doit être juste : explique en une phrase de commentaire HTML pourquoi le src de l'image commence par images/.",
    hints: [
      "jeu-catan.html est dans ludotheque/, l'image dans ludotheque/images/ : le chemin relatif descend d'un dossier.",
      "Légende visible = figure + figcaption ; n'oublie pas le alt sur l'img malgré la légende.",
      "Lien externe : URL absolue avec https:// et target=\"_blank\" ; lien interne : chemin relatif simple."
    ],
    solution: "<body>\n  <!-- Le src commence par images/ car le chemin est relatif à CE fichier :\n       depuis jeu-catan.html, il faut descendre dans le sous-dossier images/. -->\n  <h1>Catan</h1>\n  <p>Colonisez une île, récoltez des ressources et échangez-les\n  pour bâtir routes et villes. Un <strong>classique</strong> de la stratégie,\n  de 3 à 4 joueurs, dès 10 ans.</p>\n\n  <figure>\n    <img src=\"images/catan.jpg\" alt=\"Boîte du jeu Catan\">\n    <figcaption>La boîte de Catan, édition de base</figcaption>\n  </figure>\n\n  <p>\n    <a href=\"https://www.catan.com\" target=\"_blank\">Site officiel de Catan</a>\n  </p>\n  <p>\n    <a href=\"jeux.html\">← Retour à la liste des jeux</a>\n  </p>\n</body>",
    note: "Le raisonnement sur les chemins relatifs (« d'où je pars, où je vais ») est le même que celui des chemins de fichiers en ligne de commande ou des routes d'une API REST : une adresse n'a de sens que par rapport à un point de départ. Prends l'habitude de dessiner l'arborescence avant d'écrire un chemin — trente secondes de schéma évitent dix minutes de liens cassés." }
  ]
};
