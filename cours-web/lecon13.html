<body>
<script>
var DAY = {
  num: 13,
  title: "Responsive : media queries et mobile-first",
  subtitle: "Plus de la moitié du web se lit sur téléphone. Ton site doit être beau du 360px au 27 pouces.",
  theory: `
<h3>1. La meta viewport, le prérequis</h3>
<p>Sans elle, le téléphone fait semblant d'être un écran de 980px et affiche ton site en miniature. Cette ligne — déjà présente dans toutes les pages de la Ludothèque depuis la semaine 1 — dit au mobile d'utiliser sa <strong>vraie largeur</strong> :</p>
<pre class="pseudo">&lt;meta name="viewport" content="width=device-width, initial-scale=1"&gt;</pre>
<p>Vérifie qu'elle est bien dans chaque <code>&lt;head&gt;</code> : sans elle, tout le reste de cette leçon est inutile.</p>

<h3>2. Les media queries : du CSS sous condition</h3>
<p>Une <strong>media query</strong> applique des règles seulement si l'écran remplit une condition :</p>
<pre class="pseudo">/* s'applique UNIQUEMENT à partir de 768px de large */
@media (min-width: 768px) {
  .catalogue {
    grid-template-columns: repeat(3, 1fr);
  }
}</pre>
<p>Les largeurs charnières s'appellent des <strong>points de rupture</strong> (breakpoints). Deux suffisent souvent : <code>768px</code> (tablette) et <code>1024px</code> (ordinateur). Les media queries se placent en général <strong>en fin de feuille</strong>, pour surcharger les règles de base grâce à la cascade.</p>

<h3>3. La démarche mobile-first</h3>
<p>Deux stratégies possibles : partir du grand écran et rétrécir (<code>max-width</code>), ou partir du mobile et enrichir (<code>min-width</code>). La bonne : <strong>mobile-first</strong>. Le CSS de base décrit la version téléphone — la plus simple, tout empilé — et chaque media query <code>min-width</code> ajoute de la complexité quand la place le permet :</p>
<pre class="pseudo">/* base = mobile : tout en colonne, une carte par ligne */
nav        { display: flex; flex-direction: column; gap: 8px; }
.catalogue { display: grid; grid-template-columns: 1fr; gap: 16px; }

/* tablette et plus : la nav repasse en ligne, 2 colonnes */
@media (min-width: 768px) {
  nav        { flex-direction: row; gap: 16px; }
  .catalogue { grid-template-columns: repeat(2, 1fr); }
}

/* grand écran : 3 colonnes */
@media (min-width: 1024px) {
  .catalogue { grid-template-columns: repeat(3, 1fr); }
}</pre>
<p>Bonus : le CSS de base étant minimal, les téléphones (souvent sur réseau lent) reçoivent le style le plus léger.</p>

<h3>4. Unités relatives et images fluides</h3>
<p>Le responsive commence avant les media queries : des largeurs en <code>%</code>, <code>fr</code> ou <code>max-width</code> plutôt qu'en pixels figés, des textes en <code>rem</code>… et des images qui ne débordent jamais de leur boîte. Ce duo est à mettre dans toutes tes feuilles de style :</p>
<pre class="pseudo">img {
  max-width: 100%;   /* jamais plus large que son conteneur */
  height: auto;      /* proportions conservées */
}</pre>
<p>Sans lui, la photo 1200px d'un plateau de jeu explose la mise en page mobile de sa fiche.</p>

<h3>5. Tester : l'outil appareil du navigateur</h3>
<p>Inutile d'acheter dix téléphones : ouvre les outils de développement (<strong>F12</strong>) et clique l'icône <strong>appareil mobile</strong> (ou Ctrl+Maj+M). Tu peux choisir un modèle de téléphone, faire varier la largeur au pixel près et voir tes points de rupture s'activer en direct. Prends l'habitude de développer avec cet outil ouvert : chaque nouveauté CSS se vérifie immédiatement en étroit ET en large.</p>
<div class="warn">Attention au piège du mélange : en mobile-first, tout se joue avec <code>min-width</code>. Mélanger <code>min-width</code> et <code>max-width</code> dans la même feuille crée des zones de recouvrement où deux media queries se contredisent — la source classique du « ça marche à 767px mais pas à 768px ».</div>
<div class="tip">Ta grille <code>repeat(auto-fill, minmax(220px, 1fr))</code> de la leçon 12 est déjà responsive sans media query ! Réserve les media queries à ce qui change vraiment de <strong>structure</strong> : la nav qui s'empile, l'aside qui passe sous le main. Le moins de breakpoints possible = le moins de bugs possible.</div>`,
  exercises: [
    { type: "qcm", q: "Sans la meta viewport, un téléphone…", opts: ["Refuse d'afficher la page", "Affiche le site en miniature comme un écran de 980px", "Affiche la version mobile", "Recharge en boucle"], a: 1, exp: "Il simule un grand écran et dézoome : illisible." },
    { type: "qcm", q: "@media (min-width: 768px) { … } s'applique…", opts: ["Aux écrans de 768px et plus", "Aux écrans de moins de 768px", "Uniquement à 768px pile", "Aux imprimantes"], a: 0, exp: "min-width = « à partir de » : la logique mobile-first." },
    { type: "qcm", q: "La démarche mobile-first consiste à…", opts: ["Coder d'abord la version grand écran", "Écrire le CSS de base pour mobile puis enrichir via min-width", "Faire deux sites séparés", "Interdire les ordinateurs"], a: 1, exp: "Base simple = mobile ; les media queries ajoutent la complexité." },
    { type: "qcm", q: "En mobile-first, les media queries utilisent…", opts: ["max-width", "min-width", "device-color", "orientation uniquement"], a: 1, exp: "On élargit : chaque min-width ajoute des règles quand la place augmente." },
    { type: "qcm", q: "Un « point de rupture » (breakpoint) est…", opts: ["Un bug CSS", "Une largeur charnière où la mise en page change", "Une balise HTML", "La fin du fichier"], a: 1, exp: "768px et 1024px sont des choix classiques." },
    { type: "qcm", q: "Le duo qui rend toutes les images fluides :", opts: ["width: 100%; height: 100%;", "max-width: 100%; height: auto;", "min-width: 100%; height: 0;", "display: fluid;"], a: 1, exp: "Jamais plus large que le conteneur, proportions conservées." },
    { type: "qcm", q: "Pourquoi height: auto accompagne-t-il max-width: 100% ?", opts: ["Pour masquer l'image", "Pour conserver les proportions quand la largeur se réduit", "Pour centrer l'image", "Par superstition"], a: 1, exp: "Sans lui, une hauteur fixée en HTML ou CSS déformerait l'image." },
    { type: "qcm", q: "Sur mobile, la nav de la Ludothèque doit s'empiler. La règle de BASE (hors media query) :", opts: ["nav { flex-direction: column; }", "nav { flex-direction: row; }", "nav { display: none; }", "nav { width: 768px; }"], a: 0, exp: "Mobile-first : la base décrit le téléphone ; row revient en min-width: 768px." },
    { type: "qcm", q: "Où placer les media queries dans style.css ?", opts: ["Tout en haut", "En fin de feuille, pour surcharger la base via la cascade", "Dans un fichier HTML", "Au milieu, au hasard"], a: 1, exp: "Écrites après, elles gagnent à spécificité égale." },
    { type: "qcm", q: "Le raccourci pour l'outil appareil mobile des DevTools :", opts: ["Ctrl+S", "Ctrl+Maj+M (après F12)", "Alt+F4", "Ctrl+P"], a: 1, exp: "On y choisit un modèle ou on fait varier la largeur au pixel près." },
    { type: "vf", q: "La meta viewport est une règle CSS à écrire dans style.css.", a: false, exp: "C'est une balise HTML du &lt;head&gt; — déjà dans nos pages depuis la semaine 1." },
    { type: "vf", q: "La grille repeat(auto-fill, minmax(220px, 1fr)) a besoin d'une media query pour s'adapter.", a: false, exp: "Elle est intrinsèquement fluide : réserve les media queries aux changements de structure." },
    { type: "vf", q: "En mobile-first, le CSS de base (hors media queries) décrit la version téléphone.", a: true, exp: "La plus simple : tout empilé, une colonne. Les min-width enrichissent." },
    { type: "input", q: "Quel mot-clé CSS introduit une règle conditionnelle selon l'écran ? (avec le @)", a: ["@media", "media"], ph: "@…", exp: "@media (min-width: 768px) { … }" },
    { type: "input", q: "En mobile-first, quelle condition utilise-t-on : min-width ou max-width ?", a: ["min-width", "min width", "minwidth"], ph: "condition…", exp: "min-width : la base est mobile, on ajoute en élargissant." }
  ],
  final: {
    title: "Exercice final — La Ludothèque, du téléphone au grand écran",
    intro: `<p>Objectif : une colonne sur téléphone, deux sur tablette, trois sur ordinateur — et une nav qui s'empile en bas de gamme de largeur.</p>`,
    questions: [
      { type: "input", q: "Complète la condition : @media (______: 768px) { … } pour cibler tablette et plus.", a: ["min-width", "min width"], ph: "condition…", exp: "min-width — l'outil du mobile-first." },
      { type: "qcm", q: "La règle de base du catalogue (version mobile) :", opts: ["grid-template-columns: repeat(3, 1fr);", "grid-template-columns: 1fr;", "display: none;", "width: 1024px;"], a: 1, exp: "Une seule colonne : la base décrit le téléphone." },
      { type: "qcm", q: "Dans @media (min-width: 768px), la nav repasse en ligne avec…", opts: ["flex-direction: row;", "flex-direction: column;", "display: block;", "text-align: row;"], a: 0, exp: "La base l'avait mise en column ; on rebascule quand la place existe." },
      { type: "vf", q: "img { max-width: 100%; height: auto; } empêche la photo d'un jeu de déborder de sa fiche sur mobile.", a: true, exp: "L'image se comprime à la largeur de son conteneur, proportions intactes." },
      { type: "qcm", q: "Pour vérifier le rendu à 375px de large sans téléphone :", opts: ["Imprimer la page", "L'outil appareil des DevTools (F12, Ctrl+Maj+M)", "Réduire le zoom à 25%", "Impossible"], a: 1, exp: "Largeur au pixel près, modèles simulés, breakpoints visibles en direct." }
    ],
    solution: `<pre class="pseudo">/* base = mobile */
nav        { display: flex; flex-direction: column; gap: 8px; }
.catalogue { display: grid; grid-template-columns: 1fr; gap: 16px; }
img        { max-width: 100%; height: auto; }

/* tablette : ≥ 768px */
@media (min-width: 768px) {
  nav        { flex-direction: row; gap: 16px; }
  .catalogue { grid-template-columns: repeat(2, 1fr); }
}

/* ordinateur : ≥ 1024px */
@media (min-width: 1024px) {
  .catalogue { grid-template-columns: repeat(3, 1fr); }
}</pre>
<p>Le site est agréable partout. Demain, la synthèse : on assemble toute la semaine dans une feuille style.css complète et organisée.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "web-l13", title: "Le plan responsive de la Ludothèque", level: 3,
    checklist: [
      "Ta base (hors @media) suffit-elle à un téléphone (mobile-first) ?",
      "As-tu justifié tes deux points de rupture (ex. 768px et 1024px) ?",
      "As-tu la règle des images fluides (max-width: 100%; height: auto) ?",
      "Ta procédure de test décrit-elle F12 + mode appareil + glissement de largeur ?"
    ],
    statement: "Rédige le plan responsive complet de la page « Les jeux » : décris d'abord, en français, ce que voit l'utilisateur à trois largeurs (téléphone ~375px, tablette ~800px, ordinateur ~1200px) — nav, catalogue, images. Choisis et justifie tes deux points de rupture. Écris ensuite le CSS mobile-first correspondant : règles de base pour mobile, puis les deux media queries min-width, sans oublier la règle des images fluides. Termine par ta procédure de test dans le navigateur, en trois étapes.",
    hints: [
      "Décris chaque largeur comme une capture d'écran en mots : « la nav est empilée, les cartes sur une colonne… ».",
      "La base (hors media query) doit suffire à un téléphone : si tu enlèves les @media, le mobile doit rester correct.",
      "Procédure de test : F12, l'icône appareil, puis faire glisser la largeur pour voir chaque breakpoint basculer."
    ],
    solution: "PLAN RESPONSIVE — page « Les jeux »\n\n~375px  : nav empilée verticalement, catalogue sur 1 colonne,\n          images à la largeur de leur carte.\n~800px  : nav en ligne, catalogue sur 2 colonnes.\n~1200px : catalogue sur 3 colonnes, contenu centré (max-width du main).\n\nBreakpoints : 768px (les tablettes courantes dépassent cette largeur\nen paysage) et 1024px (place suffisante pour une 3e colonne de 220px+).\n\n/* base = mobile */\nnav        { display: flex; flex-direction: column; gap: 8px; }\n.catalogue { display: grid; grid-template-columns: 1fr; gap: 16px; }\nimg        { max-width: 100%; height: auto; }\n\n@media (min-width: 768px) {\n  nav        { flex-direction: row; gap: 16px; }\n  .catalogue { grid-template-columns: repeat(2, 1fr); }\n}\n\n@media (min-width: 1024px) {\n  .catalogue { grid-template-columns: repeat(3, 1fr); }\n}\n\nTEST\n1. F12 puis Ctrl+Maj+M : activer l'outil appareil.\n2. Vérifier un modèle étroit (375px) : rien ne déborde, nav empilée.\n3. Glisser la largeur de 360 à 1300px : observer les bascules\n   à 768 et 1024px, images toujours contenues.",
    note: "Décrire les trois largeurs AVANT de coder transforme le responsive en simple traduction : chaque phrase du plan devient une règle CSS. C'est aussi un excellent livrable de communication — un client ou un chef de projet comprend ton plan en mots sans lire une ligne de code, et ta procédure de test préfigure les vérifications systématiques que tu automatiseras plus tard dans ta carrière." }
  ]
};
</script>
