<script>
var DAY = {
  num: 17,
  title: "Le DOM : sélectionner et modifier la page",
  subtitle: "La page n'est plus un document : c'est un objet que ton code manipule.",
  theory: `
<h3>1. Le DOM : la page vue par JavaScript</h3>
<p>Quand le navigateur lit ton HTML, il en construit une version vivante en mémoire : le <strong>DOM</strong> (<em>Document Object Model</em>, « modèle objet du document ») — un arbre d'objets, un par balise, comme une marionnette que ton code peut animer. JavaScript ne touche jamais le fichier HTML sur le disque : il modifie le DOM, et la page à l'écran se met à jour instantanément. Le point d'entrée est l'objet global <code>document</code>, qui représente toute la page.</p>

<h3>2. Sélectionner des éléments</h3>
<p>Sélectionner, c'est retrouver un élément dans l'arbre (un peu comme un Ctrl+F ciblé). Deux méthodes suffisent, et elles utilisent <strong>les sélecteurs CSS que tu connais déjà</strong> (semaine 2) — une <strong>méthode</strong> étant une action qu'un objet sait exécuter, appelée avec des parenthèses :</p>
<pre class="pseudo">const titre = document.querySelector("h1");           // cherche et renvoie le PREMIER <h1> de la page
const compteur = document.querySelector("#compteur"); // "#compteur" = l'élément dont l'id vaut "compteur"
const cartes = document.querySelectorAll(".carte");   // ".carte" = TOUS les éléments de classe "carte"</pre>
<p><code>querySelector</code> renvoie le premier élément trouvé (ou <code>null</code>, c'est-à-dire « rien », si aucun ne correspond), <code>querySelectorAll</code> renvoie une liste que l'on parcourt avec <code>for...of</code>.</p>

<h3>3. Lire et modifier le texte</h3>
<pre class="pseudo">compteur.textContent = jeux.length + " jeux au catalogue";   // remplace le texte de l'élément par "3 jeux au catalogue"</pre>
<p><code>textContent</code> lit ou remplace le <strong>texte</strong> d'un élément. Sa cousine <code>innerHTML</code> interprète la valeur comme du HTML (balises comprises) : puissante, mais dangereuse si le texte vient d'un utilisateur — <strong>préfère textContent</strong> pour du texte, toujours.</p>

<h3>4. Modifier l'apparence : classList avant tout</h3>
<pre class="pseudo">titre.style.color = "tomato";        // change directement une propriété de style (possible, mais à éviter)

carte.classList.add("visible");      // AJOUTE la classe CSS "visible" à l'élément
carte.classList.remove("cache");     // RETIRE la classe "cache"
carte.classList.toggle("actif");     // BASCULE : ajoute "actif" si absente, la retire si présente</pre>
<p>Modifier <code>style</code> en JS mélange les responsabilités. La bonne pratique : définir l'apparence dans <code>style.css</code> (une classe <code>.cache { display: none; }</code> par exemple) et laisser JS <strong>poser ou retirer la classe</strong> avec <code>classList</code>. Le CSS décrit, le JS décide.</p>

<h3>5. Créer des éléments : la liste des jeux générée</h3>
<p>Le catalogue d'hier s'affiche enfin dans la page, dans un <code>&lt;ul id="liste-jeux"&gt;&lt;/ul&gt;</code> vide côté HTML :</p>
<pre class="pseudo">const liste = document.querySelector("#liste-jeux");   // récupère le <ul> vide qui accueillera les jeux

for (const jeu of jeux) {                              // pour chaque jeu du tableau…
  const li = document.createElement("li");             // fabrique un nouvel <li> (en mémoire, pas encore visible)
  li.textContent = jeu.nom + " — " + jeu.duree + " min";  // remplit son texte : "Catan — 90 min"
  liste.appendChild(li);                               // accroche le <li> dans le <ul> → il apparaît à l'écran
}                                                      // fin de la boucle</pre>
<p><code>createElement</code> fabrique un élément en mémoire, <code>appendChild</code> l'accroche dans la page (comme suspendre un wagon au bout du train). Ce motif « boucle + createElement + appendChild » est LE geste du front-end : une donnée, un élément. Tu viens de générer ta première interface.</p>
<div class="warn">Si <code>querySelector</code> ne trouve rien, il renvoie <code>null</code> — et la ligne suivante plante avec « Cannot read properties of null ». Deux causes classiques : sélecteur mal orthographié, ou script exécuté avant le HTML (leçon 15 : fin de body ou defer).</div>
<div class="tip">Dans l'onglet Éléments (F12), tu vois le DOM vivant : les &lt;li&gt; créés par ton script y apparaissent, alors qu'ils sont absents du fichier HTML. C'est la meilleure preuve que JS modifie le DOM, pas le fichier.</div>`,
  exercises: [
    { type: "qcm", q: "Le DOM est…", opts: ["Le fichier HTML sur le disque", "La représentation en mémoire de la page, que JS peut manipuler", "Un langage de style", "Le serveur web"], a: 1, exp: "Un arbre d'objets construit par le navigateur à partir du HTML." },
    { type: "input", q: "Quelle méthode de document sélectionne le PREMIER élément correspondant à un sélecteur CSS ?", a: ["querySelector", "querySelector()", "document.querySelector", "document.querySelector()"], ph: "méthode…", exp: "document.querySelector(\"#compteur\") — sélecteurs CSS de la semaine 2." },
    { type: "qcm", q: "document.querySelectorAll(\".carte\") renvoie…", opts: ["Le premier élément .carte", "Tous les éléments .carte, dans une liste parcourable", "Une string", "Le CSS de la page"], a: 1, exp: "Une liste à parcourir avec for...of." },
    { type: "qcm", q: "Pour sélectionner l'élément d'id « compteur » :", opts: ["querySelector(\"#compteur\")", "querySelector(\".compteur\")", "querySelector(\"compteur\")", "querySelector(\"id=compteur\")"], a: 0, exp: "# pour un id, . pour une classe : exactement comme en CSS." },
    { type: "vf", q: "Modifier le DOM avec JavaScript modifie aussi le fichier HTML sur le disque.", a: false, exp: "Seule la version en mémoire change ; recharge la page et tout repart du fichier." },
    { type: "input", q: "Quelle propriété remplace le texte d'un élément sans interpréter de HTML ?", a: ["textContent", ".textContent"], ph: "propriété…", exp: "textContent : le choix sûr pour du texte." },
    { type: "qcm", q: "Pourquoi préférer textContent à innerHTML pour du texte ?", opts: ["textContent est plus coloré", "innerHTML interprète les balises : risqué si le texte vient d'un utilisateur", "innerHTML ne marche pas sur les div", "Aucune différence"], a: 1, exp: "Un texte utilisateur contenant des balises serait exécuté comme du HTML : injection." },
    { type: "qcm", q: "carte.classList.toggle(\"actif\") fait…", opts: ["Ajoute la classe si absente, la retire si présente", "Supprime l'élément", "Renomme la classe", "Change la couleur en rouge"], a: 0, exp: "L'interrupteur : parfait pour afficher/masquer." },
    { type: "qcm", q: "La bonne pratique pour changer l'apparence d'un élément en JS :", opts: ["Écrire tout le style dans element.style", "Poser/retirer une classe CSS avec classList", "Modifier style.css avec fetch", "Recharger la page"], a: 1, exp: "Le CSS décrit l'apparence, le JS décide quand l'appliquer." },
    { type: "qcm", q: "Pour fabriquer un nouvel élément &lt;li&gt; en mémoire :", opts: ["document.createElement(\"li\")", "document.newTag(\"li\")", "querySelector(\"li\").copy()", "document.write(\"li\")"], a: 0, exp: "createElement crée l'élément ; il reste à l'accrocher avec appendChild." },
    { type: "qcm", q: "liste.appendChild(li) fait…", opts: ["Supprime li", "Accroche li comme dernier enfant de liste, donc dans la page", "Copie liste dans li", "Vide la liste"], a: 1, exp: "C'est l'accrochage au DOM qui rend l'élément visible." },
    { type: "vf", q: "querySelector renvoie null si aucun élément ne correspond au sélecteur.", a: true, exp: "D'où l'erreur « Cannot read properties of null » si on utilise le résultat sans vérifier." },
    { type: "qcm", q: "« Cannot read properties of null » après un querySelector signifie souvent…", opts: ["Le navigateur est trop vieux", "Le sélecteur n'a rien trouvé (faute de frappe, ou script exécuté trop tôt)", "Il manque un point-virgule", "Le CSS est absent"], a: 1, exp: "null n'a ni textContent ni classList : vérifie le sélecteur et la position du script." },
    { type: "qcm", q: "Pour afficher « 12 jeux au catalogue » dans la page :", opts: ["compteur.textContent = jeux.length + \" jeux au catalogue\";", "console.log(jeux.length);", "compteur.css = jeux.length;", "jeux.textContent = compteur;"], a: 0, exp: "console.log parle au développeur ; textContent parle au visiteur." },
    { type: "vf", q: "Les éléments créés par JS apparaissent dans l'onglet Éléments des outils de développement.", a: true, exp: "L'inspecteur montre le DOM vivant, pas le fichier source." }
  ],
  final: {
    title: "Exercice final — Le catalogue s'affiche",
    intro: `<p>Le tableau de jeux de la leçon 16 devient une vraie liste à l'écran.</p>`,
    questions: [
      { type: "qcm", q: "L'ordre correct pour générer la liste des jeux :", opts: ["Sélectionner le ul, puis pour chaque jeu : createElement, textContent, appendChild", "appendChild d'abord, createElement ensuite", "Écrire les li à la main dans le HTML", "Utiliser style.color"], a: 0, exp: "Le motif fondamental : une donnée, un élément." },
      { type: "input", q: "Quelle méthode accroche un élément créé comme dernier enfant d'un parent ?", a: ["appendChild", "appendChild()", ".appendChild"], ph: "méthode…", exp: "liste.appendChild(li) : sans elle, l'élément reste invisible en mémoire." },
      { type: "qcm", q: "Pour masquer une carte de jeu proprement :", opts: ["carte.classList.add(\"cache\") avec .cache { display: none; } dans style.css", "carte.innerHTML = \"\"", "Supprimer le fichier CSS", "carte.textContent = \"caché\""], a: 0, exp: "JS pose la classe, le CSS fait le travail d'apparence." },
      { type: "vf", q: "innerHTML est le bon choix pour insérer le pseudo saisi par un visiteur.", a: false, exp: "Texte utilisateur = textContent, sinon risque d'injection de HTML." },
      { type: "qcm", q: "document.querySelector(\"#liste-jeux\") utilise…", opts: ["La syntaxe des sélecteurs CSS", "Une syntaxe propre à JS", "Le nom du fichier", "Une expression régulière"], a: 0, exp: "Tout ce que tu sais des sélecteurs CSS resservira ici tel quel." }
    ],
    solution: `<pre class="pseudo">const compteur = document.querySelector("#compteur");   // le <p> du compteur
const liste = document.querySelector("#liste-jeux");    // le <ul> à remplir

compteur.textContent = jeux.length + " jeux au catalogue";   // affiche le total dans le <p>

for (const jeu of jeux) {                              // pour chaque jeu du tableau…
  const li = document.createElement("li");             // crée un nouvel <li>
  li.textContent = jeu.nom + " — " + jeu.duree + " min";   // remplit son texte
  liste.appendChild(li);                               // l'accroche dans la liste (visible)
}                                                      // fin de la boucle

Règles d'or : textContent pour du texte,
              classList plutôt que style,
              sélecteurs CSS partout.</pre>
<p>La page affiche le catalogue, mais elle ne t'écoute pas encore. Demain, les événements : réagir au clic et à la saisie.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "web-l17", title: "Générer la page catalogue", level: 2,
    statement: "La page catalogue de la Ludothèque contient un &lt;p id=\"compteur\"&gt;&lt;/p&gt; et un &lt;ul id=\"liste-jeux\"&gt;&lt;/ul&gt; vides. Écris le script complet qui : 1) réutilise le tableau jeux de la leçon 16 ; 2) affiche dans le compteur le nombre de jeux ; 3) génère un &lt;li&gt; par jeu au format « Catan — 90 min » ; 4) ajoute la classe « enfants » aux li des jeux dont ageMin est inférieur ou égal à 8 (la classe existe déjà dans style.css). Justifie en un commentaire ton choix entre textContent et innerHTML.",
    hints: [
      "Sélectionne les deux conteneurs une seule fois, avant la boucle.",
      "Dans la boucle : createElement, textContent, un if avec classList.add, puis appendChild.",
      "Le texte des jeux est de la donnée pure, sans balise : le choix entre textContent et innerHTML se justifie en une phrase de sécurité."
    ],
    solution: "const jeux = [                                    // le tableau du catalogue (leçon 16)\n  { nom: \"Catan\", duree: 90, ageMin: 10 },       // un jeu = un objet\n  { nom: \"Uno\", duree: 20, ageMin: 7 },          // 2e jeu\n  { nom: \"Dixit\", duree: 30, ageMin: 8 },        // 3e jeu\n  { nom: \"7 Wonders\", duree: 45, ageMin: 10 }    // 4e jeu\n];                                                // fin du tableau\n\nconst compteur = document.querySelector(\"#compteur\");   // le <p id=\"compteur\">\nconst liste = document.querySelector(\"#liste-jeux\");    // le <ul id=\"liste-jeux\">\n\ncompteur.textContent = jeux.length + \" jeux au catalogue\";   // affiche le total\n\nfor (const jeu of jeux) {                         // pour chaque jeu…\n  const li = document.createElement(\"li\");        // crée un <li> en mémoire\n  li.textContent = jeu.nom + \" — \" + jeu.duree + \" min\";   // remplit son texte\n  if (jeu.ageMin <= 8) {                          // si le jeu est pour enfants…\n    li.classList.add(\"enfants\");                  // …ajoute la classe CSS \"enfants\"\n  }                                               // fin du if\n  liste.appendChild(li);                          // accroche le <li> dans le <ul>\n}                                                 // fin de la boucle\n\n// Choix : textContent, car on insère du TEXTE (noms, durées).\n// innerHTML interpréterait d'éventuelles balises : inutile ici,\n// et risqué dès que la donnée vient d'un utilisateur ou d'une API.",
    note: "Ce motif « données → boucle → éléments » est le cœur de tout le front-end : les frameworks du Niveau 3 (Django, Laravel, Spring…) font exactement la même chose côté serveur avec leurs templates. Et vendredi, le même code affichera des jeux venus d'une API — seule la source des données changera." }
  ]
};
