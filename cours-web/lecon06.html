<body>
<script>
var DAY = {
  num: 6,
  title: "Les formulaires : input, label, select, button",
  subtitle: "La page qui écoute : les visiteurs vont enfin pouvoir donner leur avis.",
  theory: `
<h3>1. La balise form</h3>
<p>Un <strong>formulaire</strong> est une zone où le visiteur <strong>saisit des données</strong>. Tout commence par la balise <code>&lt;form&gt;</code> et ses deux attributs principaux : <code>action</code> (l'adresse où envoyer les données) et <code>method</code> (comment les envoyer — <code>get</code> ou <code>post</code>).</p>
<pre class="pseudo">&lt;form action="/envoyer-avis" method="post"&gt;   &lt;!-- action = OÙ envoyer ; method = COMMENT envoyer (post = dans le corps de la requête) --&gt;
  … les champs …                              &lt;!-- ici viendront les champs de saisie (input, select…) --&gt;
&lt;/form&gt;                                       &lt;!-- fin du formulaire --&gt;</pre>
<p>Retiens l'idée simple : à l'envoi, le navigateur transmet les données à un <strong>serveur</strong> qui les traite (les enregistrer, répondre…). Ce traitement côté serveur viendra plus tard dans la formation — cette semaine, on construit la partie visible, et c'est déjà un vrai métier de la faire bien.</p>

<h3>2. input et ses types, placeholder, required</h3>
<p>Le champ à tout faire est <code>&lt;input&gt;</code> (auto-fermante). Son attribut <code>type</code> change complètement son comportement :</p>
<pre class="pseudo">&lt;input type="text"   name="pseudo"&gt;               &lt;!-- type text : texte libre sur une ligne --&gt;
&lt;input type="email"  name="email"&gt;                &lt;!-- type email : le navigateur vérifie le format (présence du @) --&gt;
&lt;input type="number" name="note" min="1" max="5"&gt;   &lt;!-- type number : nombre, borné entre min=1 et max=5 --&gt;</pre>
<p>Chaque champ porte un <code>name</code> : c'est <strong>le nom sous lequel sa valeur sera envoyée</strong> au serveur — un champ sans name est un champ muet. Deux attributs bien utiles : <code>placeholder</code> affiche un exemple grisé dans le champ vide (une aide, PAS une étiquette), et <code>required</code> empêche l'envoi si le champ est vide — le navigateur affiche tout seul un message.</p>

<h3>3. label : chaque champ a son étiquette</h3>
<p>Un champ seul est une devinette. Le <code>&lt;label&gt;</code> (étiquette) lui donne son nom visible, relié par le duo <code>for</code>/<code>id</code> : le <code>for</code> du label répète l'<code>id</code> du champ.</p>
<pre class="pseudo">&lt;label for="pseudo"&gt;Ton pseudo&lt;/label&gt;                    &lt;!-- l'étiquette : son for="pseudo" pointe vers l'id du champ --&gt;
&lt;input type="text" id="pseudo" name="pseudo" required&gt;   &lt;!-- le champ : id="pseudo" (relié au label), name (envoi), required (obligatoire) --&gt;</pre>
<p>Ce lien n'est pas décoratif : cliquer sur le label <strong>place le curseur dans le champ</strong>, et un lecteur d'écran annonce « Ton pseudo, champ de saisie ». Règle absolue : <strong>chaque champ a son label</strong>. Le placeholder ne le remplace pas — il disparaît dès qu'on tape.</p>

<h3>4. radio, checkbox, select, textarea</h3>
<p>Pour choisir plutôt que taper : les <strong>radios</strong> (un seul choix parmi plusieurs — même <code>name</code> pour former le groupe), les <strong>checkboxes</strong> (cases à cocher : zéro, un ou plusieurs choix), le <strong>menu déroulant</strong> <code>&lt;select&gt;</code> rempli d'<code>&lt;option&gt;</code>, et la zone de texte multi-lignes <code>&lt;textarea&gt;</code>.</p>
<pre class="pseudo">&lt;label&gt;&lt;input type="radio" name="note" value="5"&gt; Excellent&lt;/label&gt;   &lt;!-- radio : même name="note" → choix EXCLUSIF ; value="5" = valeur envoyée si choisi --&gt;
&lt;label&gt;&lt;input type="radio" name="note" value="3"&gt; Moyen&lt;/label&gt;       &lt;!-- même groupe : cocher celui-ci décoche l'autre --&gt;

&lt;label&gt;&lt;input type="checkbox" name="pret"&gt; J'ai emprunté ce jeu&lt;/label&gt;   &lt;!-- checkbox : case cochable indépendamment --&gt;

&lt;label for="jeu"&gt;Quel jeu ?&lt;/label&gt;               &lt;!-- étiquette du menu déroulant --&gt;
&lt;select id="jeu" name="jeu"&gt;                     &lt;!-- select = menu déroulant --&gt;
  &lt;option value="catan"&gt;Catan&lt;/option&gt;           &lt;!-- une option : texte affiché "Catan", valeur envoyée "catan" --&gt;
  &lt;option value="azul"&gt;Azul&lt;/option&gt;             &lt;!-- une autre option --&gt;
&lt;/select&gt;                                        &lt;!-- fin du menu déroulant --&gt;

&lt;label for="commentaire"&gt;Ton avis&lt;/label&gt;        &lt;!-- étiquette de la zone de texte --&gt;
&lt;textarea id="commentaire" name="commentaire"&gt;&lt;/textarea&gt;   &lt;!-- textarea : texte long sur plusieurs lignes (avec balise fermante) --&gt;</pre>
<p>Deux détails : les radios d'un même groupe partagent le même <code>name</code> (c'est ce qui les rend exclusives), et <code>&lt;textarea&gt;</code> a une balise fermante, contrairement à <code>&lt;input&gt;</code>.</p>

<h3>5. button — et le formulaire d'avis de la Ludothèque</h3>
<p>Le bouton d'envoi s'écrit <code>&lt;button&gt;</code> : dans un <code>&lt;form&gt;</code>, il déclenche l'envoi (et les vérifications des <code>required</code>). Assemblons la page <code>avis.html</code> (avec le squelette sémantique de la leçon 4) :</p>
<pre class="pseudo">&lt;form action="/envoyer-avis" method="post"&gt;           &lt;!-- le formulaire et sa destination --&gt;
  &lt;label for="pseudo"&gt;Pseudo&lt;/label&gt;                   &lt;!-- étiquette du champ pseudo --&gt;
  &lt;input type="text" id="pseudo" name="pseudo" required&gt;   &lt;!-- champ texte obligatoire, relié au label --&gt;

  &lt;label for="email"&gt;Email&lt;/label&gt;                     &lt;!-- étiquette du champ email --&gt;
  &lt;input type="email" id="email" name="email"          &lt;!-- champ email : format @ vérifié --&gt;
         placeholder="toi@exemple.be" required&gt;        &lt;!-- placeholder = exemple grisé ; required = obligatoire --&gt;

  &lt;label for="note"&gt;Note sur 5&lt;/label&gt;                 &lt;!-- étiquette de la note --&gt;
  &lt;input type="number" id="note" name="note" min="1" max="5" required&gt;   &lt;!-- nombre entre 1 et 5, obligatoire --&gt;

  &lt;label for="commentaire"&gt;Ton commentaire&lt;/label&gt;     &lt;!-- étiquette du commentaire --&gt;
  &lt;textarea id="commentaire" name="commentaire"&gt;&lt;/textarea&gt;   &lt;!-- zone de texte long --&gt;

  &lt;button&gt;Envoyer mon avis&lt;/button&gt;                    &lt;!-- bouton : envoie le formulaire + lance les validations --&gt;
&lt;/form&gt;                                               &lt;!-- fin du formulaire --&gt;</pre>
<p>Teste : laisse le pseudo vide et clique Envoyer — le navigateur bloque et te le dit. Tape un email sans @ — refusé aussi. Tout ça sans une ligne de JavaScript.</p>
<div class="warn">Le placeholder ne remplace JAMAIS le label : il disparaît à la saisie, n'est pas fiable pour les lecteurs d'écran, et l'utilisateur oublie ce qu'on lui demandait. Le duo gagnant : un <code>&lt;label for&gt;</code> visible + un placeholder d'exemple si besoin.</div>
<div class="tip">La validation du navigateur (required, type="email", min/max) est un confort côté client, pas une sécurité : un serveur devra TOUJOURS revérifier les données reçues. Garde cette phrase en tête pour la suite de la formation.</div>`,
  exercises: [
    { type: "qcm", q: "Quel attribut de &lt;form&gt; indique OÙ envoyer les données ?", opts: ["method", "action", "href", "target"], a: 1, exp: "action = la destination ; method = la façon d'envoyer (get/post)." },
    { type: "qcm", q: "Que se passe-t-il à l'envoi d'un formulaire ?", opts: ["Le navigateur transmet les données à un serveur qui les traite", "La page s'imprime", "Le HTML enregistre les données dans le fichier", "Rien, c'est décoratif"], a: 0, exp: "Le traitement côté serveur viendra plus tard dans la formation." },
    { type: "qcm", q: "Quel type d'input vérifie automatiquement la présence d'un @ ?", opts: ["type=\"text\"", "type=\"email\"", "type=\"number\"", "type=\"radio\""], a: 1, exp: "Le navigateur refuse l'envoi si le format d'email est invalide." },
    { type: "input", q: "Quel attribut donne au champ le nom sous lequel sa valeur est envoyée au serveur ? (nom de l'attribut seul)", a: ["name"], ph: "nom de l'attribut…", exp: "Sans name, le champ est muet : sa valeur ne part jamais." },
    { type: "qcm", q: "Le duo d'attributs qui relie un label à son champ :", opts: ["for et id", "name et value", "src et alt", "href et target"], a: 0, exp: "Le for du label répète l'id du champ : clic sur le label = curseur dans le champ." },
    { type: "vf", q: "Un placeholder bien rédigé peut remplacer le label.", a: false, exp: "Il disparaît à la saisie et n'est pas fiable pour l'accessibilité : le label reste obligatoire." },
    { type: "qcm", q: "Pour que l'utilisateur choisisse UNE seule note parmi 5 propositions visibles :", opts: ["5 checkboxes", "5 radios partageant le même name", "5 champs texte", "5 boutons"], a: 1, exp: "Le name commun rend les radios exclusives entre elles." },
    { type: "qcm", q: "Les checkboxes permettent…", opts: ["Un seul choix maximum", "Zéro, un ou plusieurs choix", "Uniquement du texte", "De valider le formulaire"], a: 1, exp: "C'est leur différence avec les radios, exclusives." },
    { type: "qcm", q: "Un menu déroulant se construit avec…", opts: ["&lt;select&gt; rempli d'&lt;option&gt;", "&lt;menu&gt; et &lt;li&gt;", "&lt;input type=\"menu\"&gt;", "&lt;datalist&gt; seul"], a: 0, exp: "select englobe, chaque choix est une option (avec sa value)." },
    { type: "input", q: "Nom de la balise pour une zone de texte multi-lignes (le commentaire d'avis), sans les chevrons :", a: ["textarea", "<textarea>"], ph: "nom de la balise…", exp: "textarea — et contrairement à input, elle a une balise fermante." },
    { type: "vf", q: "&lt;input&gt; et &lt;textarea&gt; sont toutes deux auto-fermantes.", a: false, exp: "input oui ; textarea a une ouvrante ET une fermante." },
    { type: "qcm", q: "Quel attribut empêche l'envoi si le champ est vide ?", opts: ["placeholder", "required", "disabled", "value"], a: 1, exp: "Le navigateur bloque et affiche un message, sans JavaScript." },
    { type: "qcm", q: "Pour borner la note entre 1 et 5 sur un input number :", opts: ["min=\"1\" max=\"5\"", "from=\"1\" to=\"5\"", "range=\"1-5\"", "value=\"1,5\""], a: 0, exp: "min et max : le navigateur refuse 0 ou 6." },
    { type: "qcm", q: "Dans un &lt;form&gt;, un &lt;button&gt; déclenche par défaut…", opts: ["Rien", "L'envoi du formulaire et les vérifications required", "Le rechargement du CSS", "L'ouverture d'un onglet"], a: 1, exp: "C'est le bouton de soumission naturel du formulaire." },
    { type: "vf", q: "La validation navigateur (required, type email) suffit : le serveur n'aura pas besoin de revérifier.", a: false, exp: "Confort côté client, pas sécurité : le serveur revérifie toujours." }
  ],
  final: {
    title: "Exercice final — Le formulaire d'avis",
    intro: `<p>Pseudo, email, note, commentaire : chaque champ du formulaire d'avis passe à la question.</p>`,
    questions: [
      { type: "qcm", q: "Le champ pseudo complet et correct :", opts: ["&lt;input text pseudo&gt;", "&lt;label for=\"pseudo\"&gt;Pseudo&lt;/label&gt; &lt;input type=\"text\" id=\"pseudo\" name=\"pseudo\"&gt;", "&lt;input type=\"pseudo\"&gt;", "&lt;label&gt;Pseudo&lt;/label&gt; &lt;input&gt; sans lien"], a: 1, exp: "label relié par for/id, type, id et name : le champ complet." },
      { type: "input", q: "Quel attribut affiche un exemple grisé qui disparaît à la saisie ? (nom de l'attribut seul)", a: ["placeholder"], ph: "nom de l'attribut…", exp: "Une aide d'exemple — jamais un substitut de label." },
      { type: "vf", q: "Cliquer sur un label correctement relié place le curseur dans son champ.", a: true, exp: "Le bonus concret du duo for/id, en plus de l'accessibilité." },
      { type: "qcm", q: "Pour la note de 1 à 5, quel choix N'EST PAS adapté ?", opts: ["&lt;input type=\"number\" min=\"1\" max=\"5\"&gt;", "5 radios de même name", "Un &lt;select&gt; de 5 options", "&lt;input type=\"checkbox\"&gt; par note"], a: 3, exp: "Les checkboxes permettraient de cocher 2 ET 5 : il faut un choix exclusif." },
      { type: "qcm", q: "L'utilisateur envoie le formulaire avec l'email « bonjour » (sans @). Résultat ?", opts: ["Envoyé quand même", "Le navigateur bloque l'envoi et signale le champ", "La page plante", "L'email est corrigé automatiquement"], a: 1, exp: "type=\"email\" + required : validation gratuite du navigateur." }
    ],
    solution: `<pre class="pseudo">&lt;form action="…" method="post"&gt;                          // le formulaire et sa destination
  label (for) ↔ input (id)  : CHAQUE champ étiqueté        // for du label = id du champ
  input : type text / email / number(min,max) / radio / checkbox   // le type dicte le comportement
          + name (envoi), placeholder (exemple), required (bloquant)   // attributs clés d'un champ
  select&gt;option = menu déroulant · textarea = texte long    // choisir vs. écrire long
  &lt;button&gt; = envoi + déclenchement des validations          // le bouton de soumission
&lt;/form&gt;                                                   // fin du formulaire

Ludothèque : avis.html — pseudo, email, note 1-5, commentaire,   // la page du jour
             le tout étiqueté et validé par le navigateur.        // labels + validation intégrée</pre>
<p>Le site sait désormais écouter ses visiteurs. Demain, dernière ligne droite : assembler toute la semaine dans la page d'accueil complète de la Ludothèque.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "web-l6", title: "Le formulaire d'inscription", level: 2,
    statement: "La Ludothèque veut un formulaire d'inscription des nouveaux membres sur une page inscription.html. Écris le &lt;form&gt; complet : nom (texte, obligatoire), email (format vérifié, obligatoire), âge (nombre entre 5 et 120), type de membre en choix EXCLUSIF (« Adulte » ou « Enfant »), un menu déroulant « Jeu préféré » avec 3 jeux du catalogue, une case à cocher « J'accepte le règlement » obligatoire, et le bouton d'envoi. Chaque champ doit avoir son label correctement relié. Termine par 2 phrases expliquant pourquoi la validation navigateur ne suffit pas.",
    hints: [
      "Choix exclusif = radios avec le MÊME name ; case unique = checkbox (required fonctionne aussi sur elle).",
      "Pour chaque champ : label for=\"x\" puis input id=\"x\" name=\"x\" — trois valeurs cohérentes.",
      "L'âge : type=\"number\" avec min et max ; le menu : select > option avec des value."
    ],
    solution: "<form action=\"/inscription\" method=\"post\">\n  <label for=\"nom\">Nom complet</label>\n  <input type=\"text\" id=\"nom\" name=\"nom\" required>\n\n  <label for=\"email\">Email</label>\n  <input type=\"email\" id=\"email\" name=\"email\"\n         placeholder=\"toi@exemple.be\" required>\n\n  <label for=\"age\">Âge</label>\n  <input type=\"number\" id=\"age\" name=\"age\" min=\"5\" max=\"120\">\n\n  <p>Type de membre :</p>\n  <label><input type=\"radio\" name=\"type\" value=\"adulte\"> Adulte</label>\n  <label><input type=\"radio\" name=\"type\" value=\"enfant\"> Enfant</label>\n\n  <label for=\"jeu\">Jeu préféré</label>\n  <select id=\"jeu\" name=\"jeu\">\n    <option value=\"catan\">Catan</option>\n    <option value=\"azul\">Azul</option>\n    <option value=\"7wonders\">7 Wonders</option>\n  </select>\n\n  <label>\n    <input type=\"checkbox\" name=\"reglement\" required>\n    J'accepte le règlement de la Ludothèque\n  </label>\n\n  <button>M'inscrire</button>\n</form>\n\nPourquoi la validation navigateur ne suffit pas : elle s'execute chez\nle client, donc n'importe qui peut la contourner (en modifiant la page\nou en envoyant la requete directement au serveur). Le serveur devra\ntoujours revalider chaque donnee recue avant de l'enregistrer.",
    note: "Un formulaire est un contrat de données : chaque name deviendra une clé côté serveur, puis souvent une colonne en base de données — soigne-les dès maintenant. Et la règle « ne jamais faire confiance au client » que tu viens d'énoncer est un pilier de la sécurité que tu recroiseras dans les cours API REST et Bases de données." }
  ]
};
</script>
