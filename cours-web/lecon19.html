<script>
var DAY = {
  num: 19,
  title: "Valider un formulaire côté client",
  subtitle: "Guider le visiteur avant qu'il n'envoie n'importe quoi.",
  theory: `
<h3>1. L'événement submit et preventDefault</h3>
<p>Le formulaire d'avis de la Ludothèque (pseudo, email, note, commentaire) doit être vérifié <strong>avant</strong> l'envoi. L'événement <code>"submit"</code> (« soumettre ») se déclenche à l'envoi du formulaire — et par défaut, le navigateur recharge la page. Pour garder la main :</p>
<pre class="pseudo">const form = document.querySelector("#form-avis");     // récupère le formulaire par son id

form.addEventListener("submit", function (event) {     // à l'ENVOI du formulaire, exécute cette fonction…
  event.preventDefault();   // ANNULE le rechargement automatique de la page : c'est nous qui décidons
  // ... les vérifications viennent ici ...            // (on placera les contrôles à cet endroit)
});                                                    // fin de l'écouteur</pre>
<p><code>event.preventDefault()</code> annule le comportement par défaut (« empêcher-défaut »). Sans lui, la page se recharge et tes vérifications n'ont jamais lieu.</p>

<h3>2. Lire et nettoyer les valeurs</h3>
<pre class="pseudo">const pseudo = document.querySelector("#pseudo").value.trim();   // lit le champ pseudo : .value = le texte, .trim() enlève les espaces
const email = document.querySelector("#email").value.trim();     // même chose pour l'email
const note = Number(document.querySelector("#note").value);      // lit la note et la convertit texte → nombre avec Number()</pre>
<p><code>value</code> est toujours une string (du texte) ; <code>trim()</code> retire les espaces parasites au début et à la fin (« &nbsp;&nbsp;&nbsp; » devient « », donc un champ « rempli d'espaces » est bien vu comme vide) ; <code>Number(...)</code> convertit en nombre pour pouvoir comparer la note.</p>

<h3>3. Les règles de la Ludothèque</h3>
<pre class="pseudo">if (pseudo === "") {                                    // si le pseudo est une chaîne VIDE ("")…
  return "Le pseudo est obligatoire.";                  // …renvoyer ce message et sortir de la fonction
}                                                       // fin du if
if (commentaire.length &lt; 10) {                          // .length = nombre de caractères ; si moins de 10…
  return "Le commentaire doit faire au moins 10 caractères.";  // …renvoyer ce message
}                                                       // fin du if
if (note &lt; 1 || note &gt; 5) {                             // si la note est < 1 OU (||) > 5, donc hors de 1..5…
  return "La note doit être comprise entre 1 et 5.";    // …renvoyer ce message
}                                                       // fin du if
if (!email.includes("@")) {                             // ! = NON ; si l'email NE contient PAS de "@"…
  return "L'adresse email semble invalide.";            // …renvoyer ce message
}                                                       // fin du if</pre>
<p>Champ vide, longueur minimale, intervalle, présence du <code>@</code> : quatre motifs qui couvrent l'immense majorité des formulaires. La vérification d'email est volontairement simple — un vrai contrôle complet se fera côté serveur.</p>

<h3>4. Afficher l'erreur dans la page, pas en alert</h3>
<p>Une popup <code>alert()</code> (une petite fenêtre bloquante) est brutale et fige tout. La bonne pratique : une zone dédiée dans le HTML, remplie par JS.</p>
<pre class="pseudo">&lt;p id="erreur" class="message-erreur"&gt;&lt;/p&gt;   &lt;!-- HTML : zone vide prête à accueillir le message d'erreur --&gt;

const zoneErreur = document.querySelector("#erreur");             // récupère cette zone de message
zoneErreur.textContent = "La note doit être comprise entre 1 et 5.";  // y écrit un message d'erreur
// et si tout est bon :                                          // (cas où le formulaire est valide)
zoneErreur.textContent = "";                                     // efface l'erreur (chaîne vide "")
zoneMerci.textContent = "Merci pour ton avis, " + pseudo + " !"; // affiche un remerciement personnalisé</pre>
<p>Le message apparaît près du formulaire, stylé par ta classe CSS, et disparaît quand l'utilisateur corrige. Note le <code>textContent</code> : le pseudo vient de l'utilisateur, on ne l'injecte jamais avec innerHTML.</p>

<h3>5. Trois lignes de défense : HTML, JS, serveur</h3>
<pre class="pseudo">&lt;input id="pseudo" required&gt;                                   &lt;!-- required : le navigateur exige que le champ soit rempli --&gt;
&lt;input id="email" type="email" required&gt;                       &lt;!-- type="email" : format vérifié + champ obligatoire --&gt;
&lt;textarea id="commentaire" minlength="10" required&gt;&lt;/textarea&gt;  &lt;!-- minlength="10" : au moins 10 caractères exigés --&gt;</pre>
<p><strong>Première ligne : le HTML</strong> — <code>required</code>, <code>minlength</code>, <code>type="email"</code> font vérifier le navigateur sans une ligne de JS. <strong>Deuxième ligne : le JS</strong> — pour des règles plus fines et des messages à toi. <strong>Troisième ligne, obligatoire : le serveur</strong> — le <strong>serveur</strong> étant l'ordinateur distant qui reçoit et stocke les données ; tout ce qui vient du navigateur (le <strong>client</strong>) peut être contourné (JS désactivé, requête forgée), donc le serveur devra <strong>re-valider chaque donnée</strong>, tu le verras dans la suite de la formation.</p>
<div class="warn">La validation côté client est du <strong>confort</strong>, pas de la sécurité. Un visiteur malveillant peut envoyer ce qu'il veut directement au serveur. Ne considère jamais une donnée comme sûre parce que « le JS l'a vérifiée ».</div>
<div class="tip">Ordre de travail sain : pose d'abord <code>required</code>, <code>minlength</code>, <code>type="email"</code> dans le HTML — gratuit et accessible — puis ajoute le JS uniquement pour ce que le HTML ne sait pas exprimer (la cohérence, les messages personnalisés).</div>`,
  exercises: [
    { type: "qcm", q: "L'événement déclenché à l'envoi d'un formulaire :", opts: ["\"click\"", "\"submit\"", "\"send\"", "\"post\""], a: 1, exp: "On l'écoute sur le formulaire lui-même, pas sur le bouton." },
    { type: "input", q: "Quelle méthode de l'objet event empêche le comportement par défaut (rechargement) ?", a: ["preventDefault()", "preventDefault", "event.preventDefault()", "event.preventDefault"], ph: "méthode…", exp: "event.preventDefault() : sans elle, la page se recharge avant tes vérifications." },
    { type: "qcm", q: "Sans preventDefault dans le handler de submit…", opts: ["Rien ne change", "La page se recharge et les vérifications JS sont perdues", "Le CSS disparaît", "Le formulaire se vide silencieusement"], a: 1, exp: "Le comportement par défaut reprend la main : envoi + rechargement." },
    { type: "input", q: "Quelle méthode retire les espaces au début et à la fin d'une string ?", a: ["trim()", "trim", ".trim()"], ph: "méthode…", exp: "\"  Zoé  \".trim() donne \"Zoé\" — un champ d'espaces devient vide." },
    { type: "qcm", q: "champ.value renvoie toujours…", opts: ["Un number", "Une string", "Un boolean", "Un élément du DOM"], a: 1, exp: "Même pour un champ numérique : d'où Number(champ.value) avant de comparer." },
    { type: "qcm", q: "Pour vérifier que la note est entre 1 et 5, on rejette si…", opts: ["note &lt; 1 || note &gt; 5", "note &gt; 1 &amp;&amp; note &lt; 5", "note === 3", "note.length &lt; 5"], a: 0, exp: "Trop petite OU trop grande : le || couvre les deux sorties de l'intervalle." },
    { type: "qcm", q: "La vérification simple d'un email vue en cours :", opts: ["email.includes(\"@\")", "email.length === 10", "email === \"email\"", "typeof email === \"email\""], a: 0, exp: "Volontairement basique — le serveur fera le contrôle sérieux." },
    { type: "qcm", q: "Où afficher les messages d'erreur ?", opts: ["Dans une popup alert()", "Dans une zone dédiée de la page, via textContent", "Dans la console, pour le visiteur", "Nulle part"], a: 1, exp: "alert() bloque tout ; un message dans la page se style et se corrige en douceur." },
    { type: "vf", q: "Il faut utiliser innerHTML pour afficher « Merci » suivi du pseudo saisi par le visiteur.", a: false, exp: "Le pseudo vient de l'utilisateur : textContent, toujours (leçon 17)." },
    { type: "qcm", q: "L'attribut HTML qui rend un champ obligatoire sans JavaScript :", opts: ["mandatory", "required", "needed", "novalidate"], a: 1, exp: "Première ligne de défense, gratuite et accessible." },
    { type: "qcm", q: "minlength=\"10\" sur un textarea…", opts: ["Limite à 10 caractères maximum", "Impose au moins 10 caractères, vérifié par le navigateur", "Change la taille de la police", "Ne sert à rien sans JS"], a: 1, exp: "Le HTML sait déjà vérifier une longueur minimale." },
    { type: "vf", q: "Si le HTML et le JS valident le formulaire, le serveur peut se dispenser de re-valider.", a: false, exp: "Tout ce qui vient du navigateur peut être contourné : le serveur RE-valide, toujours." },
    { type: "qcm", q: "Pourquoi la validation côté client existe-t-elle, alors ?", opts: ["Pour la sécurité absolue", "Pour le confort : un retour immédiat, sans aller-retour serveur", "Pour remplacer le HTML", "Pour ralentir la page"], a: 1, exp: "Confort côté client, sécurité côté serveur : les deux rôles sont distincts." },
    { type: "qcm", q: "Number(\"4\") renvoie…", opts: ["\"4\"", "4", "true", "Une erreur"], a: 1, exp: "La conversion string → number, indispensable avant de comparer la note." },
    { type: "vf", q: "Un bon parcours : d'abord required/minlength/type=\"email\" en HTML, puis le JS pour les règles fines.", a: true, exp: "Le HTML d'abord, le JS en complément, le serveur en dernier rempart." }
  ],
  final: {
    title: "Exercice final — Le formulaire d'avis blindé",
    intro: `<p>Pseudo, email, note, commentaire : l'avis d'un visiteur ne part que s'il est propre.</p>`,
    questions: [
      { type: "qcm", q: "Les deux premières lignes du handler de submit :", opts: ["event.preventDefault(); puis lecture des value avec trim()", "alert(); puis reload()", "fetch(); puis innerHTML", "console.log(); puis return"], a: 0, exp: "Stopper l'envoi, puis lire des valeurs propres." },
      { type: "vf", q: "pseudo.trim() === \"\" détecte aussi un champ rempli uniquement d'espaces.", a: true, exp: "trim() les retire : il ne reste rien, le champ est bien vide." },
      { type: "qcm", q: "La note « 7 » saisie par un visiteur est rejetée par…", opts: ["note &lt; 1 || note &gt; 5 après Number()", "typeof note", "trim()", "includes(\"@\")"], a: 0, exp: "Conversion d'abord, contrôle d'intervalle ensuite." },
      { type: "input", q: "L'attribut HTML qui demande au navigateur de vérifier le format d'un email :", a: ["type=\"email\"", "type=email", "email"], ph: "attribut…", exp: "type=\"email\" sur l'input : la première ligne de défense." },
      { type: "qcm", q: "Le serveur qui recevra l'avis devra…", opts: ["Faire confiance au JS", "Re-valider toutes les données reçues", "Supprimer le formulaire", "Désactiver le HTML"], a: 1, exp: "Règle d'or : ne jamais faire confiance au client." }
    ],
    solution: `<pre class="pseudo">form.addEventListener("submit", function (event) {   // à l'envoi du formulaire…
  event.preventDefault();                            // stoppe le rechargement
  const pseudo = champPseudo.value.trim();           // lit et nettoie le pseudo
  const email = champEmail.value.trim();             // lit et nettoie l'email
  const note = Number(champNote.value);              // convertit la note en nombre
  const commentaire = champCom.value.trim();         // lit et nettoie le commentaire

  zoneErreur.textContent = "";                       // efface un éventuel ancien message
  if (pseudo === "") { zoneErreur.textContent = "Pseudo obligatoire."; return; }        // pseudo vide → stop
  if (!email.includes("@")) { zoneErreur.textContent = "Email invalide."; return; }     // pas de @ → stop
  if (note &lt; 1 || note &gt; 5) { zoneErreur.textContent = "Note entre 1 et 5."; return; }  // hors 1..5 → stop
  if (commentaire.length &lt; 10) { zoneErreur.textContent = "10 caractères minimum."; return; }  // trop court → stop

  zoneMerci.textContent = "Merci pour ton avis, " + pseudo + " !";   // tout est bon : remerciement
});                                                  // fin de l'écouteur

HTML en première ligne (required, minlength, type="email"),
JS en seconde, serveur en dernier rempart — toujours.</pre>
<p>Le formulaire est solide. Demain, la dernière pièce : aller chercher le catalogue sur un serveur avec fetch.</p>`
  }
};
</script>

 HTML : required sur les quatre champs,\n// minlength=\"10\" sur #commentaire, type=\"email\" sur #email.\n// Le serveur re-validera tout : une requête peut être envoyée\n// directement, sans jamais passer par ma page ni mon JS.",
