<script>
var DAY = {
  num: 18,
  title: "Les événements : réagir au clic et à la saisie",
  subtitle: "Ta page arrête de parler toute seule : elle écoute.",
  theory: `
<h3>1. Une page qui écoute</h3>
<p>Jusqu'ici, ton script s'exécute une fois au chargement, puis plus rien. Or le front-end vit d'<strong>événements</strong> : un <strong>événement</strong> est simplement « quelque chose qui se produit » dans la page — un clic, une touche enfoncée, un formulaire envoyé. Le principe ressemble à installer une sonnette : tu désignes un élément, un type d'événement, et une fonction à exécuter <strong>quand</strong> ça arrive. C'est le navigateur qui appelle ta fonction (quand la sonnette sonne), jamais toi.</p>

<h3>2. addEventListener</h3>
<pre class="pseudo">const bouton = document.querySelector("#btn-visite");     // le bouton que l'on veut surveiller
const affichage = document.querySelector("#nb-visites");  // l'élément où afficher le résultat
let visites = 0;                                          // l'ÉTAT : un compteur modifiable, à 0 au départ

bouton.addEventListener("click", function () {            // à CHAQUE clic sur le bouton, exécute cette fonction…
  visites = visites + 1;                                  // …ajoute 1 au compteur…
  affichage.textContent = visites + " visiteurs aujourd'hui";  // …et met à jour le texte affiché
});                                                       // fin de l'écouteur</pre>
<p><code>element.addEventListener("click", fonction)</code> : « quand on clique sur cet élément, exécute cette fonction ». Le compteur de visiteurs de la Ludothèque tient en six lignes.</p>

<h3>3. Nommée ou fléchée : deux écritures du handler</h3>
<p>La fonction passée en second argument s'appelle un <strong>handler</strong> (« gestionnaire » : la fonction qui gère l'événement). Trois écritures équivalentes :</p>
<pre class="pseudo">function compterVisite() { ... }                       // 1) on définit d'abord une fonction NOMMÉE
bouton.addEventListener("click", compterVisite);       //    …puis on la passe SANS parenthèses

bouton.addEventListener("click", function () { ... });  // 2) fonction ANONYME, écrite sur place
bouton.addEventListener("click", () =&gt; { ... });        // 3) fonction FLÉCHÉE (écriture moderne, plus courte)</pre>
<p>La <strong>fonction fléchée</strong> <code>() =&gt; { ... }</code> est une écriture courte très courante. Note bien : on passe la fonction <strong>sans parenthèses</strong> — <code>compterVisite</code>, pas <code>compterVisite()</code>.</p>

<h3>4. L'objet event et event.target</h3>
<p>Le navigateur passe automatiquement un objet <code>event</code> au handler : c'est la fiche de renseignements sur ce qui vient de se passer.</p>
<pre class="pseudo">liste.addEventListener("click", function (event) {   // écouteur de clic ; le paramètre "event" décrit l'événement
  console.log(event.target);                          // event.target = l'élément EXACT qui a été cliqué
  event.target.classList.toggle("favori");            // bascule la classe "favori" sur cet élément précis
});                                                   // fin de l'écouteur</pre>
<p><code>event.target</code> désigne l'élément exact où l'événement s'est produit — pratique pour poser un seul écouteur sur la liste entière plutôt qu'un par <code>&lt;li&gt;</code>.</p>

<h3>5. L'événement « input » : la recherche en direct</h3>
<p>Sur un champ texte, l'événement <code>"input"</code> se déclenche <strong>à chaque frappe</strong>. De quoi filtrer le catalogue en direct :</p>
<pre class="pseudo">const champ = document.querySelector("#recherche");            // le champ de saisie de la recherche
const cartes = document.querySelectorAll("#liste-jeux li");    // tous les <li> de jeux à filtrer

champ.addEventListener("input", function () {                  // à CHAQUE frappe dans le champ…
  const terme = champ.value.toLowerCase();                     // lit le texte tapé (.value) et le met en minuscules
  for (const carte of cartes) {                                // pour chaque carte de jeu…
    if (carte.textContent.toLowerCase().includes(terme)) {     // si son texte (en minuscules) CONTIENT le terme…
      carte.classList.remove("cache");                         // …on la MONTRE (retire la classe "cache")
    } else {                                                   // sinon…
      carte.classList.add("cache");                            // …on la CACHE (ajoute la classe "cache")
    }                                                          // fin du if/else
  }                                                            // fin de la boucle
});                                                            // fin de l'écouteur</pre>
<p><code>champ.value</code> lit le texte saisi, <code>toLowerCase()</code> neutralise la casse (majuscules/minuscules), <code>includes()</code> teste la présence du terme, et <code>classList</code> (leçon 17) montre ou cache chaque carte. La recherche du catalogue est née.</p>
<div class="warn">Le piège numéro un : <code>addEventListener("click", compterVisite())</code> avec parenthèses <strong>appelle la fonction immédiatement</strong> et n'écoute plus rien. On transmet la fonction elle-même, le navigateur l'appellera au bon moment.</div>
<div class="tip">Un doute sur ce que contient <code>event</code> ? Mets <code>console.log(event)</code> dans le handler et explore l'objet dans la console : target, type, key… tout y est.</div>`,
  exercises: [
    { type: "input", q: "Quelle méthode attache une fonction à un événement sur un élément ?", a: ["addEventListener", "addEventListener()", ".addEventListener"], ph: "méthode…", exp: "element.addEventListener(\"click\", fonction)." },
    { type: "qcm", q: "Les deux arguments d'addEventListener sont…", opts: ["Le type d'événement (string) et la fonction à exécuter", "Deux sélecteurs CSS", "Un nombre et un booléen", "Le HTML et le CSS"], a: 0, exp: "Le « quoi » (\"click\", \"input\"…) puis le « que faire »." },
    { type: "qcm", q: "Qui appelle le handler quand l'événement survient ?", opts: ["Toi, à la fin du script", "Le navigateur", "Le serveur", "Le fichier CSS"], a: 1, exp: "Tu déclares ; le navigateur exécute au bon moment." },
    { type: "qcm", q: "Quelle ligne est correcte ?", opts: ["bouton.addEventListener(\"click\", compter);", "bouton.addEventListener(\"click\", compter());", "bouton.addEventListener(compter, \"click\");", "bouton.click(compter);"], a: 0, exp: "Sans parenthèses : on passe la fonction, on ne l'appelle pas." },
    { type: "vf", q: "addEventListener(\"click\", direBonjour()) exécute direBonjour immédiatement au lieu d'attendre le clic.", a: true, exp: "Les parenthèses appellent la fonction sur-le-champ : le piège classique." },
    { type: "qcm", q: "() =&gt; { ... } est…", opts: ["Une fonction fléchée, écriture courte d'une fonction", "Un commentaire", "Un sélecteur CSS", "Une balise HTML"], a: 0, exp: "Très courante comme handler : bouton.addEventListener(\"click\", () =&gt; { ... })." },
    { type: "qcm", q: "event.target désigne…", opts: ["La page entière", "L'élément précis où l'événement s'est produit", "Le fichier app.js", "Le prochain événement"], a: 1, exp: "Utile pour un seul écouteur sur toute une liste." },
    { type: "qcm", q: "L'objet event est…", opts: ["À créer soi-même avec createElement", "Passé automatiquement au handler par le navigateur", "Une variable globale du CSS", "Réservé aux formulaires"], a: 1, exp: "Déclare un paramètre (event) et il est rempli pour toi." },
    { type: "qcm", q: "Sur un champ texte, l'événement qui se déclenche à chaque frappe :", opts: ["\"click\"", "\"input\"", "\"load\"", "\"hover\""], a: 1, exp: "C'est lui qui rend la recherche « en direct »." },
    { type: "input", q: "Quelle propriété d'un champ de formulaire contient le texte saisi ?", a: ["value", ".value", "champ.value"], ph: "propriété…", exp: "champ.value : la matière première de la recherche." },
    { type: "qcm", q: "Pourquoi passer le terme et les noms en toLowerCase() dans la recherche ?", opts: ["Pour aller plus vite", "Pour que « catan » trouve « Catan » : comparaison insensible à la casse", "Pour économiser la mémoire", "C'est obligatoire en JS"], a: 1, exp: "On neutralise majuscules/minuscules des deux côtés." },
    { type: "qcm", q: "\"Catan\".toLowerCase().includes(\"cat\") vaut…", opts: ["true", "false", "\"cat\"", "Une erreur"], a: 0, exp: "includes teste la présence d'un morceau de texte." },
    { type: "vf", q: "Pour masquer les jeux qui ne correspondent pas, on supprime leurs éléments du DOM définitivement.", a: false, exp: "On pose/retire une classe .cache : les éléments réapparaissent quand la recherche change." },
    { type: "qcm", q: "Le compteur de visiteurs combine…", opts: ["Un let, un handler de clic, textContent pour l'affichage", "Un fichier CSS seul", "Une balise meta", "querySelector uniquement"], a: 0, exp: "État (let visites), événement (click), affichage (textContent)." },
    { type: "vf", q: "On peut attacher plusieurs écouteurs différents au même élément.", a: true, exp: "Un même bouton peut écouter \"click\", \"input\"… chacun avec son handler." }
  ],
  final: {
    title: "Exercice final — La recherche en direct",
    intro: `<p>Le catalogue de la Ludothèque se filtre à chaque frappe. Vérifions la mécanique.</p>`,
    questions: [
      { type: "qcm", q: "L'écouteur de la recherche en direct s'attache…", opts: ["Au champ texte, sur l'événement \"input\"", "Au bouton d'envoi, sur \"click\"", "Au body, sur \"load\"", "Au fichier CSS"], a: 0, exp: "Chaque frappe déclenche le filtrage." },
      { type: "input", q: "Quelle méthode de string teste si un texte en contient un autre ?", a: ["includes", "includes()", ".includes()"], ph: "méthode…", exp: "nom.includes(terme) — après un toLowerCase des deux côtés." },
      { type: "qcm", q: "Dans le handler, on cache une carte non correspondante avec…", opts: ["carte.classList.add(\"cache\")", "carte.delete()", "carte.innerHTML = null", "carte.style = \"off\""], a: 0, exp: "Et classList.remove(\"cache\") pour la remontrer : réversible." },
      { type: "vf", q: "event.target permet de savoir quel élément précis a déclenché l'événement.", a: true, exp: "Un seul écouteur sur la liste suffit alors pour tous les li." },
      { type: "qcm", q: "Si la recherche ne réagit pas et que la console est muette, le premier réflexe :", opts: ["Vérifier le sélecteur du champ et mettre un console.log dans le handler", "Réinstaller le navigateur", "Supprimer le CSS", "Changer d'ordinateur"], a: 0, exp: "Un log dans le handler dit immédiatement s'il est appelé ou non." }
    ],
    solution: `<pre class="pseudo">const champ = document.querySelector("#recherche");            // le champ de recherche
const cartes = document.querySelectorAll("#liste-jeux li");    // tous les <li> de jeux

champ.addEventListener("input", function () {                  // à chaque frappe…
  const terme = champ.value.toLowerCase();                     // le texte saisi, en minuscules
  for (const carte of cartes) {                                // pour chaque carte…
    if (carte.textContent.toLowerCase().includes(terme)) {     // si elle contient le terme…
      carte.classList.remove("cache");                         // …la montrer
    } else {                                                   // sinon…
      carte.classList.add("cache");                            // …la cacher
    }                                                          // fin du if/else
  }                                                            // fin de la boucle
});                                                            // fin de l'écouteur

Retenir : la fonction se passe SANS parenthèses,
          event.target = l'élément déclencheur,
          "input" = à chaque frappe.</pre>
<p>La page écoute le visiteur. Demain, elle apprend à lui répondre poliment quand il se trompe : la validation du formulaire d'avis.</p>`
  }
};
</script>

    solution: "<!-- Page d'accueil : le bouton like et son compteur -->\n<button id=\"btn-like\">J'aime</button>\n<span id=\"nb-likes\">0 ❤</span>\n\n<!-- Page catalogue : le champ de recherche et la liste des jeux -->\n<input id=\"recherche\" placeholder=\"Rechercher un jeu…\">\n<ul id=\"liste-jeux\">\n  <li>Catan — 90 min</li>\n  <li>Uno — 20 min</li>\n</ul>\n\n<script>\n// --- Page d'accueil : le bouton like ---\nconst bouton = document.querySelector(\"#btn-like\");   // le bouton\nconst affichage = document.querySelector(\"#nb-likes\"); // le span d'affichage\nlet likes = 0;                                        // état : compteur de likes (hors du handler !)\n\nbouton.addEventListener(\"click\", function () {         // à chaque clic…\n  likes = likes + 1;                                  // …+1 au compteur…\n  affichage.textContent = likes + \" ❤\";               // …et mise à jour du texte\n});                                                   // fin de l'écouteur\n\n// --- Page catalogue : la recherche en direct ---\nconst champ = document.querySelector(\"#recherche\");            // le champ de saisie\nconst cartes = document.querySelectorAll(\"#liste-jeux li\");    // tous les <li> de jeux\n\nchamp.addEventListener(\"input\", function () {                  // à chaque frappe…\n  const terme = champ.value.toLowerCase();                     // le texte saisi, en minuscules\n  for (const carte of cartes) {                                // pour chaque carte…\n    if (carte.textContent.toLowerCase().includes(terme)) {     // si elle contient le terme…\n      carte.classList.remove(\"cache\");                         // …la montrer\n    } else {                                                   // sinon…\n      carte.classList.add(\"cache\");                            // …la cacher\n    }                                                          // fin du if/else\n  }                                                            // fin de la boucle\n});                                                            // fin de l'écouteur\n\n// Pourquoi sans parenthèses ? maFonction() APPELLE la fonction tout\n// de suite : addEventListener recevrait son résultat (souvent\n// undefined) au lieu de la fonction. Sans parenthèses, on transmet\n// la fonction elle-même, que le navigateur appellera à chaque clic.\n<\/script>",
