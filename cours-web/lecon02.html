<script>
var DAY = {
  num: 2,
  title: "Les balises fondamentales : titres, paragraphes, listes",
  subtitle: "Du texte brut au contenu structuré : la page d'accueil prend forme.",
  theory: `
<h3>1. Les titres : h1 à h6</h3>
<p>Rappel de vocabulaire avant tout : une <strong>balise</strong> est une étiquette écrite entre chevrons (les signes <code>&lt;</code> et <code>&gt;</code>) qui dit au <strong>navigateur</strong> — le logiciel qui affiche les pages web, comme Chrome ou Firefox — quel <em>rôle</em> joue un morceau de texte. C'est comme les intercalaires colorés d'un classeur : ils ne changent pas le contenu des feuilles, mais ils indiquent « ici commence telle partie ». La plupart des balises vont par paire : une balise <strong>d'ouverture</strong> <code>&lt;h1&gt;</code> et une balise <strong>de fermeture</strong> <code>&lt;/h1&gt;</code> (avec une barre oblique), qui encadrent le contenu.</p>
<p>HTML propose six niveaux de titres, de <code>&lt;h1&gt;</code> (le plus important) à <code>&lt;h6&gt;</code> (le plus fin). Le <code>h</code> vient de l'anglais <em>heading</em> (« en-tête, titre »). Ils forment le <strong>plan</strong> de ta page, comme les titres d'un cours : un grand titre, des sections, des sous-sections.</p>
<pre class="pseudo">&lt;h1&gt;Bienvenue à la Ludothèque&lt;/h1&gt;   &lt;!-- h1 : titre principal, UNIQUE, il résume toute la page --&gt;
&lt;h2&gt;Nos jeux phares&lt;/h2&gt;               &lt;!-- h2 : titre de section, un cran en dessous du h1 --&gt;
&lt;h2&gt;Horaires d'ouverture&lt;/h2&gt;          &lt;!-- h2 : une autre section, de même niveau que la précédente --&gt;
&lt;h3&gt;En semaine&lt;/h3&gt;                    &lt;!-- h3 : sous-section, rangée logiquement sous un h2 --&gt;</pre>
<p>Règle d'or : <strong>un seul <code>&lt;h1&gt;</code> par page</strong> (le sujet principal), et on ne saute pas de niveau (pas de <code>&lt;h3&gt;</code> juste après un <code>&lt;h1&gt;</code>). On choisit le niveau pour le <strong>sens</strong>, jamais pour la taille du texte — la taille, c'est le travail du <strong>CSS</strong> (le langage qui décide de l'apparence : couleurs, tailles, espacements ; on le verra plus tard, c'est comme la peinture et la décoration une fois les murs montés).</p>

<h3>2. Paragraphes et mise en valeur</h3>
<p>Chaque paragraphe de texte va dans une balise <code>&lt;p&gt;</code> (<em>paragraph</em>). Dans le texte, deux balises mettent en valeur : <code>&lt;strong&gt;</code> pour ce qui est <strong>important</strong> (affiché en gras par défaut) et <code>&lt;em&gt;</code> pour ce qui est accentué (<em>emphasis</em>, affiché en italique par défaut).</p>
<pre class="pseudo">&lt;p&gt;La Ludothèque prête des jeux de société à ses membres.   &lt;!-- &lt;p&gt; ouvre un paragraphe ; le texte peut courir sur plusieurs lignes --&gt;
L'inscription est &lt;strong&gt;gratuite&lt;/strong&gt; et ouverte à     &lt;!-- &lt;strong&gt;...&lt;/strong&gt; entoure un mot IMPORTANT (gras + sens) --&gt;
&lt;em&gt;tous les âges&lt;/em&gt;.&lt;/p&gt;                                  &lt;!-- &lt;em&gt;...&lt;/em&gt; accentue ; &lt;/p&gt; referme enfin le paragraphe --&gt;</pre>
<p>Nuance qui compte : <code>&lt;strong&gt;</code> et <code>&lt;em&gt;</code> portent un <strong>sens</strong> (importance, accentuation), pas juste un style. Un <strong>lecteur d'écran</strong> — un logiciel qui lit la page à voix haute pour les personnes non voyantes — change d'intonation en les rencontrant. Autre point : en HTML, les retours à la ligne dans ton code ne comptent pas — seules les balises structurent le texte.</p>

<h3>3. Les listes : ul, ol, li</h3>
<p>Deux types de listes : <code>&lt;ul&gt;</code> (<em>unordered list</em>, « liste non ordonnée », à puces) quand l'ordre n'a pas d'importance, <code>&lt;ol&gt;</code> (<em>ordered list</em>, « liste ordonnée », numérotée) quand il compte. Dans les deux cas, chaque élément est un <code>&lt;li&gt;</code> (<em>list item</em>, « élément de liste »). Pense à une liste de courses (l'ordre est libre : ul) contre une recette (les étapes s'enchaînent : ol).</p>
<pre class="pseudo">&lt;h2&gt;Nos jeux phares&lt;/h2&gt;   &lt;!-- titre de la première section --&gt;
&lt;ul&gt;                       &lt;!-- &lt;ul&gt; ouvre une liste À PUCES (ordre indifférent) --&gt;
  &lt;li&gt;Catan&lt;/li&gt;           &lt;!-- &lt;li&gt; = un élément de la liste --&gt;
  &lt;li&gt;7 Wonders&lt;/li&gt;       &lt;!-- un autre élément --&gt;
  &lt;li&gt;Azul&lt;/li&gt;            &lt;!-- le dernier élément --&gt;
&lt;/ul&gt;                      &lt;!-- &lt;/ul&gt; referme la liste à puces --&gt;

&lt;h2&gt;Comment emprunter un jeu&lt;/h2&gt;         &lt;!-- titre de la seconde section --&gt;
&lt;ol&gt;                       &lt;!-- &lt;ol&gt; ouvre une liste NUMÉROTÉE (l'ordre compte) --&gt;
  &lt;li&gt;Choisir un jeu dans le catalogue&lt;/li&gt;   &lt;!-- étape 1 : le « 1. » est ajouté tout seul --&gt;
  &lt;li&gt;Présenter sa carte de membre&lt;/li&gt;       &lt;!-- étape 2 --&gt;
  &lt;li&gt;Le rapporter sous deux semaines&lt;/li&gt;    &lt;!-- étape 3 --&gt;
&lt;/ol&gt;                      &lt;!-- &lt;/ol&gt; referme la liste numérotée --&gt;</pre>
<p>Un <code>&lt;ul&gt;</code> ou un <code>&lt;ol&gt;</code> ne contient <strong>directement que des <code>&lt;li&gt;</code></strong> — le texte va toujours dans les <code>&lt;li&gt;</code>, jamais entre eux.</p>

<h3>4. Listes imbriquées, br et hr</h3>
<p>Une liste peut en contenir une autre (on dit qu'elle est <strong>imbriquée</strong>, comme des poupées russes) : on place la sous-liste <strong>à l'intérieur du <code>&lt;li&gt;</code> parent</strong>, avant sa fermeture.</p>
<pre class="pseudo">&lt;ul&gt;                       &lt;!-- liste principale --&gt;
  &lt;li&gt;Jeux de stratégie     &lt;!-- élément parent : attention, on NE ferme PAS encore ce &lt;li&gt; --&gt;
    &lt;ul&gt;                   &lt;!-- sous-liste placée À L'INTÉRIEUR du &lt;li&gt; parent --&gt;
      &lt;li&gt;Catan&lt;/li&gt;       &lt;!-- élément de la sous-liste --&gt;
      &lt;li&gt;7 Wonders&lt;/li&gt;   &lt;!-- autre élément de la sous-liste --&gt;
    &lt;/ul&gt;                  &lt;!-- on referme d'abord la sous-liste --&gt;
  &lt;/li&gt;                    &lt;!-- ET SEULEMENT MAINTENANT on ferme le &lt;li&gt; parent --&gt;
  &lt;li&gt;Jeux d'ambiance&lt;/li&gt;  &lt;!-- élément simple, sans sous-liste --&gt;
&lt;/ul&gt;                      &lt;!-- fin de la liste principale --&gt;</pre>
<p>Deux balises à manier <strong>avec parcimonie</strong> : <code>&lt;br&gt;</code> force un retour à la ligne (<em>break</em> ; utile dans une adresse postale), <code>&lt;hr&gt;</code> trace une ligne de séparation thématique (<em>horizontal rule</em>). Ce sont des balises <strong>solitaires</strong> : elles n'encadrent rien, donc pas de balise de fermeture. Si tu enchaînes les <code>&lt;br&gt;</code> pour « aérer », c'est le signe qu'il te faut plutôt des <code>&lt;p&gt;</code> ou du CSS.</p>

<h3>5. Les commentaires — et l'accueil de la Ludothèque</h3>
<p>Un <strong>commentaire HTML</strong> s'écrit <code>&lt;!-- comme ceci --&gt;</code> : le navigateur l'ignore complètement, mais il reste lisible dans le code (et dans le code source public !). C'est comme une note au crayon dans la marge d'un livre : pour toi, pas pour l'imprimeur. Pratique pour se laisser des rappels. Assemblons maintenant le <code>&lt;body&gt;</code> (le corps visible) de notre <code>index.html</code> :</p>
<pre class="pseudo">&lt;body&gt;                                            &lt;!-- &lt;body&gt; : tout ce qui est VISIBLE dans la fenêtre --&gt;
  &lt;!-- Page d'accueil de la Ludothèque --&gt;         &lt;!-- ceci est un commentaire : invisible à l'écran --&gt;
  &lt;h1&gt;Bienvenue à la Ludothèque&lt;/h1&gt;               &lt;!-- le titre principal, unique --&gt;
  &lt;p&gt;Nous prêtons plus de &lt;strong&gt;200 jeux de société&lt;/strong&gt;   &lt;!-- paragraphe avec un passage important en gras --&gt;
  à nos membres. L'inscription est gratuite !&lt;/p&gt;  &lt;!-- suite et fin du même paragraphe --&gt;

  &lt;h2&gt;Nos jeux phares&lt;/h2&gt;                         &lt;!-- titre de section --&gt;
  &lt;ul&gt;                                             &lt;!-- liste à puces --&gt;
    &lt;li&gt;Catan&lt;/li&gt;                                 &lt;!-- un jeu --&gt;
    &lt;li&gt;7 Wonders&lt;/li&gt;                             &lt;!-- un jeu --&gt;
    &lt;li&gt;Azul&lt;/li&gt;                                  &lt;!-- un jeu --&gt;
  &lt;/ul&gt;                                            &lt;!-- fin de la liste --&gt;
&lt;/body&gt;                                            &lt;!-- fin du corps de la page --&gt;</pre>
<p>Enregistre, recharge : titre, présentation, liste. La page d'accueil a maintenant un vrai contenu structuré.</p>
<div class="warn">Ne choisis JAMAIS une balise pour son apparence (« h4 parce que c'est plus petit », « strong pour faire joli »). Le HTML décrit le <strong>sens</strong> ; l'apparence viendra avec le CSS. Une page bien structurée aujourd'hui sera facile à styler demain.</div>
<div class="tip">Indente ton code : chaque balise imbriquée décalée de deux espaces. L'<strong>indentation</strong>, c'est ce décalage vers la droite qui montre qui est « à l'intérieur » de qui. Le navigateur s'en moque, mais toi (et tes futurs collègues) y verrez la structure d'un coup d'œil — exactement comme l'indentation de tes programmes en Algorithmique.</div>`,
  exercises: [
    { type: "qcm", q: "Combien de &lt;h1&gt; une page doit-elle contenir ?", opts: ["Aucun", "Un seul", "Un par section", "Autant qu'on veut"], a: 1, exp: "Un seul h1 : le sujet principal de la page." },
    { type: "qcm", q: "Comment choisit-on entre h2, h3, h4… ?", opts: ["Selon la taille de texte voulue", "Selon la hiérarchie logique du contenu", "Au hasard", "Selon la couleur"], a: 1, exp: "Le niveau reflète le plan de la page ; la taille, c'est du CSS." },
    { type: "vf", q: "Il est correct de passer directement d'un &lt;h1&gt; à un &lt;h3&gt; sans &lt;h2&gt;.", a: false, exp: "On ne saute pas de niveau : le plan doit rester cohérent." },
    { type: "qcm", q: "Quelle balise contient un paragraphe de texte ?", opts: ["&lt;par&gt;", "&lt;p&gt;", "&lt;text&gt;", "&lt;txt&gt;"], a: 1, exp: "p comme paragraphe : la balise de texte la plus courante." },
    { type: "qcm", q: "Quelle balise marque un contenu IMPORTANT (affiché en gras) ?", opts: ["&lt;em&gt;", "&lt;strong&gt;", "&lt;bold&gt;", "&lt;big&gt;"], a: 1, exp: "strong porte un sens d'importance, pas seulement un style gras." },
    { type: "qcm", q: "Pour une liste où l'ordre des étapes compte, on utilise…", opts: ["&lt;ul&gt;", "&lt;ol&gt;", "&lt;dl&gt;", "&lt;li&gt; tout seul"], a: 1, exp: "ol = ordered list, numérotée. ul quand l'ordre est indifférent." },
    { type: "input", q: "Nom de la balise pour chaque élément d'une liste, sans les chevrons :", a: ["li", "<li>"], ph: "nom de la balise…", exp: "li = list item, dans un ul comme dans un ol." },
    { type: "qcm", q: "Que peut contenir directement un &lt;ul&gt; ?", opts: ["Des &lt;p&gt;", "Uniquement des &lt;li&gt;", "Du texte libre", "Des &lt;h2&gt;"], a: 1, exp: "Tout le contenu passe par les li ; rien ne traîne entre eux." },
    { type: "qcm", q: "Pour imbriquer une sous-liste, on la place…", opts: ["Après le &lt;/ul&gt; parent", "À l'intérieur du &lt;li&gt; parent, avant sa fermeture", "Dans le &lt;head&gt;", "Entre deux &lt;li&gt;"], a: 1, exp: "La sous-liste appartient à l'élément qu'elle détaille : elle vit dans son li." },
    { type: "vf", q: "Ajouter des retours à la ligne dans le code HTML crée des retours à la ligne à l'écran.", a: false, exp: "Le navigateur ignore les retours à la ligne du code : seules les balises structurent." },
    { type: "qcm", q: "La balise &lt;br&gt; sert à…", opts: ["Créer un paragraphe", "Forcer un retour à la ligne ponctuel", "Mettre en gras", "Séparer deux pages"], a: 1, exp: "Utile dans une adresse ; pour espacer des blocs, on prend p ou le CSS." },
    { type: "qcm", q: "Enchaîner cinq &lt;br&gt; pour aérer une page, c'est…", opts: ["La bonne pratique", "Un signe qu'il faut plutôt des &lt;p&gt; ou du CSS", "Obligatoire en HTML5", "Plus rapide à charger"], a: 1, exp: "br s'utilise avec parcimonie : l'espacement visuel est le travail du CSS." },
    { type: "input", q: "Quels caractères ouvrent un commentaire HTML ? (les 4 caractères exacts)", a: ["<!--"], ph: "caractères d'ouverture…", exp: "<!-- ouvre, --> ferme. Le navigateur ignore tout ce qui est entre les deux." },
    { type: "vf", q: "Un commentaire HTML est invisible à l'écran mais lisible par quiconque affiche le code source.", a: true, exp: "Jamais de mot de passe ou d'info sensible en commentaire : le code source est public." },
    { type: "qcm", q: "Sur l'accueil de la Ludothèque, la liste des jeux phares utilise…", opts: ["&lt;ol&gt; car les jeux sont classés", "&lt;ul&gt; car l'ordre n'a pas d'importance", "&lt;br&gt; entre chaque nom", "&lt;h3&gt; pour chaque jeu"], a: 1, exp: "Pas de classement entre Catan, 7 Wonders et Azul : liste à puces." }
  ],
  final: {
    title: "Exercice final — La structure du texte",
    intro: `<p>Titres, paragraphes, listes : vérifie que tu sais choisir la bonne balise pour chaque contenu.</p>`,
    questions: [
      { type: "qcm", q: "Le plan d'une page bien construite ressemble à…", opts: ["h1 puis des h2, puis des h3 sous les h2", "Plusieurs h1 pour chaque section", "Des h6 partout, c'est discret", "Pas de titres, que des p en gras"], a: 0, exp: "Un seul h1, puis une hiérarchie sans saut de niveau." },
      { type: "qcm", q: "« L'inscription est gratuite » doit sauter aux yeux ET avoir du sens pour un lecteur d'écran :", opts: ["&lt;em&gt;gratuite&lt;/em&gt;", "&lt;strong&gt;gratuite&lt;/strong&gt;", "&lt;h6&gt;gratuite&lt;/h6&gt;", "GRATUITE en majuscules"], a: 1, exp: "strong = importance sémantique, restituée aussi par les lecteurs d'écran." },
      { type: "vf", q: "Les étapes « choisir, présenter sa carte, rapporter » vont dans un &lt;ul&gt;.", a: false, exp: "L'ordre compte : c'est un ol numéroté." },
      { type: "input", q: "Nom de la balise de liste À PUCES (ordre indifférent), sans les chevrons :", a: ["ul", "<ul>"], ph: "nom de la balise…", exp: "ul = unordered list, remplie de li." },
      { type: "qcm", q: "Que contient l'index.html de la Ludothèque à la fin de cette leçon ?", opts: ["Seulement le squelette vide", "Un h1, un paragraphe de présentation et la liste des jeux phares", "Un formulaire d'avis", "Un tableau du catalogue"], a: 1, exp: "Titre, présentation, liste : la page d'accueil a son premier vrai contenu." }
    ],
    solution: `<pre class="pseudo">Titres  : &lt;h1&gt; unique → &lt;h2&gt; → &lt;h3&gt;… sans saut de niveau
Texte   : &lt;p&gt; pour les paragraphes,
          &lt;strong&gt; = important, &lt;em&gt; = accentué (du SENS, pas du style)
Listes  : &lt;ul&gt; (puces) / &lt;ol&gt; (numérotée), remplies de &lt;li&gt;
          sous-liste À L'INTÉRIEUR du &lt;li&gt; parent
Divers  : &lt;br&gt; et &lt;hr&gt; avec parcimonie, &lt;!-- commentaires --&gt;

Ludothèque : h1 + présentation + liste des jeux phares dans index.html.</pre>
<p>La page a du contenu, mais elle est seule au monde. Demain : les liens et les images, pour relier les pages entre elles.</p>`
  }
};
</script>

    solution: "<body>\n  <!-- Page \"Comment ça marche\" de la Ludothèque -->            <!-- commentaire : le navigateur l'ignore -->\n  <h1>Comment ça marche</h1>                                       <!-- titre principal unique de la page -->\n  <p>Emprunter un jeu à la Ludothèque est <strong>simple et gratuit</strong> :   <!-- paragraphe d'intro ; strong = mot important -->\n  suis les étapes ci-dessous et amuse-toi bien !</p>              <!-- suite et fin du paragraphe -->\n\n  <h2>Les étapes pour emprunter</h2>                               <!-- titre de la 1re section -->\n  <ol>                                                             <!-- liste NUMÉROTÉE : l'ordre des étapes compte -->\n    <li>Créer sa carte de membre à l'accueil</li>                  <!-- étape 1 -->\n    <li>Choisir un jeu dans le catalogue</li>                      <!-- étape 2 -->\n    <li>Enregistrer l'emprunt au comptoir</li>                     <!-- étape 3 -->\n    <li>Rapporter le jeu sous deux semaines</li>                   <!-- étape 4 -->\n  </ol>                                                            <!-- fin de la liste numérotée -->\n\n  <h2>Nos catégories de jeux</h2>                                  <!-- titre de la 2e section -->\n  <ul>                                                             <!-- liste À PUCES : l'ordre est indifférent -->\n    <li>Jeux de stratégie                                          <!-- élément parent : le li reste ouvert -->\n      <ul>                                                         <!-- sous-liste imbriquée, dans le li parent -->\n        <li>Catan</li>                                             <!-- élément de la sous-liste -->\n        <li>7 Wonders</li>                                         <!-- élément de la sous-liste -->\n      </ul>                                                        <!-- fin de la sous-liste -->\n    </li>                                                          <!-- on ferme enfin le li parent -->\n    <li>Jeux d'ambiance</li>                                       <!-- élément simple -->\n    <li>Jeux pour enfants</li>                                     <!-- élément simple -->\n  </ul>                                                            <!-- fin de la liste à puces -->\n</body>",
