  subtitle: "Des lignes, des colonnes, des données : le catalogue prend de l'ordre.",
  theory: `
<h3>1. Un tableau, c'est pour des données</h3>
<p>Avant la syntaxe, LA règle : un <strong>tableau</strong> HTML sert à présenter des <strong>données tabulaires</strong> — des informations qui ont naturellement des lignes et des colonnes (un catalogue, des horaires, des résultats). Il ne sert <strong>jamais</strong> à faire de la mise en page (placer un menu à gauche et du texte à droite) : ça, c'est le travail du CSS, semaine prochaine. Notre catalogue de jeux — nom, joueurs, durée, âge — est un cas d'école : chaque jeu est une ligne, chaque caractéristique une colonne.</p>

<h3>2. table, tr, th, td</h3>
<p>Quatre balises suffisent pour un tableau de base : <code>&lt;table&gt;</code> l'englobe, <code>&lt;tr&gt;</code> (<em>table row</em>) crée une ligne, et dans chaque ligne, <code>&lt;th&gt;</code> (<em>table header</em>) pour une cellule d'en-tête, <code>&lt;td&gt;</code> (<em>table data</em>) pour une cellule de donnée.</p>
<pre class="pseudo">&lt;table&gt;                                       &lt;!-- &lt;table&gt; = tout le tableau --&gt;
  &lt;tr&gt;                                         &lt;!-- &lt;tr&gt; = une LIGNE (table row) --&gt;
    &lt;th&gt;Jeu&lt;/th&gt;&lt;th&gt;Joueurs&lt;/th&gt;&lt;th&gt;Durée&lt;/th&gt;   &lt;!-- 3 cellules d'EN-TÊTE (th) : les titres de colonnes --&gt;
  &lt;/tr&gt;                                        &lt;!-- fin de la ligne d'en-tête --&gt;
  &lt;tr&gt;                                         &lt;!-- une ligne de données --&gt;
    &lt;td&gt;Catan&lt;/td&gt;&lt;td&gt;3 à 4&lt;/td&gt;&lt;td&gt;75 min&lt;/td&gt;   &lt;!-- 3 cellules de DONNÉE (td), une par colonne --&gt;
  &lt;/tr&gt;                                        &lt;!-- fin de la ligne de données --&gt;
&lt;/table&gt;                                       &lt;!-- fin du tableau --&gt;</pre>
<p>On construit <strong>ligne par ligne</strong> : d'abord un <code>&lt;tr&gt;</code>, puis ses cellules. Toutes les lignes doivent avoir le même nombre de cellules — sinon le tableau se décale.</p>

<h3>3. thead, tbody et caption</h3>
<p>Pour un tableau propre, on sépare l'en-tête du corps : <code>&lt;thead&gt;</code> (<em>table head</em>) englobe la ligne de titres, <code>&lt;tbody&gt;</code> (<em>table body</em>) les lignes de données. Et <code>&lt;caption&gt;</code>, placé juste après <code>&lt;table&gt;</code>, donne un <strong>titre au tableau</strong> — précieux pour l'accessibilité.</p>
<pre class="pseudo">&lt;table&gt;                                                          &lt;!-- début du tableau --&gt;
  &lt;caption&gt;Catalogue de la Ludothèque&lt;/caption&gt;                   &lt;!-- titre du tableau (1re chose dans &lt;table&gt;) --&gt;
  &lt;thead&gt;                                                         &lt;!-- zone d'en-tête --&gt;
    &lt;tr&gt;&lt;th&gt;Jeu&lt;/th&gt;&lt;th&gt;Joueurs&lt;/th&gt;&lt;th&gt;Durée&lt;/th&gt;&lt;th&gt;Âge&lt;/th&gt;&lt;/tr&gt;   &lt;!-- ligne des 4 titres de colonnes --&gt;
  &lt;/thead&gt;                                                        &lt;!-- fin de l'en-tête --&gt;
  &lt;tbody&gt;                                                         &lt;!-- zone des données --&gt;
    &lt;tr&gt;&lt;td&gt;Catan&lt;/td&gt;&lt;td&gt;3 à 4&lt;/td&gt;&lt;td&gt;75 min&lt;/td&gt;&lt;td&gt;10+&lt;/td&gt;&lt;/tr&gt;       &lt;!-- 1re ligne de données --&gt;
    &lt;tr&gt;&lt;td&gt;Azul&lt;/td&gt;&lt;td&gt;2 à 4&lt;/td&gt;&lt;td&gt;40 min&lt;/td&gt;&lt;td&gt;8+&lt;/td&gt;&lt;/tr&gt;        &lt;!-- 2e ligne --&gt;
    &lt;tr&gt;&lt;td&gt;7 Wonders&lt;/td&gt;&lt;td&gt;3 à 7&lt;/td&gt;&lt;td&gt;30 min&lt;/td&gt;&lt;td&gt;10+&lt;/td&gt;&lt;/tr&gt;   &lt;!-- 3e ligne --&gt;
  &lt;/tbody&gt;                                                        &lt;!-- fin des données --&gt;
&lt;/table&gt;                                                         &lt;!-- fin du tableau --&gt;</pre>

<h3>4. Fusionner des cellules : colspan et rowspan</h3>
<p>Deux attributs de cellule permettent les fusions : <code>colspan="n"</code> étend une cellule sur <strong>n colonnes</strong> (horizontalement), <code>rowspan="n"</code> sur <strong>n lignes</strong> (verticalement). Quand une cellule s'étend, on <strong>supprime</strong> les cellules qu'elle recouvre.</p>
<pre class="pseudo">&lt;tr&gt;                                       &lt;!-- une ligne --&gt;
  &lt;th colspan="2"&gt;Jeux de stratégie&lt;/th&gt;   &lt;!-- colspan="2" : cette cellule occupe 2 COLONNES --&gt;
&lt;/tr&gt;                                      &lt;!-- fin de la ligne (une seule cellule visible) --&gt;
&lt;tr&gt;                                       &lt;!-- ligne suivante, normale --&gt;
  &lt;td&gt;Catan&lt;/td&gt;&lt;td&gt;75 min&lt;/td&gt;             &lt;!-- 2 cellules qui s'alignent sous la cellule fusionnée --&gt;
&lt;/tr&gt;                                      &lt;!-- fin de la ligne --&gt;</pre>
<p>À utiliser avec modération : chaque fusion complique la lecture (et la future mise en forme). Si ton tableau devient un puzzle de fusions, c'est souvent qu'il faudrait deux tableaux.</p>

<h3>5. Le catalogue de la Ludothèque</h3>
<p>Dans le <code>&lt;main&gt;</code> de <code>jeux.html</code>, ajoutons le tableau complet du point 3 sous un <code>&lt;h2&gt;Le catalogue&lt;/h2&gt;</code>. Chaque nom de jeu peut même devenir un lien vers sa fiche :</p>
<pre class="pseudo">&lt;td&gt;&lt;a href="jeu-catan.html"&gt;Catan&lt;/a&gt;&lt;/td&gt;   &lt;!-- une cellule &lt;td&gt; qui contient un lien &lt;a&gt; vers la fiche du jeu --&gt;</pre>
<p>Recharge la page : sans CSS, le tableau est brut de décoffrage (pas de bordures visibles), mais la structure est là — et un lecteur d'écran peut déjà annoncer « colonne Durée : 75 min ». La semaine CSS le rendra élégant sans toucher à une seule balise.</p>
<div class="warn">Ne mets JAMAIS de texte directement dans &lt;table&gt; ou &lt;tr&gt; : tout contenu vit dans une cellule <code>&lt;th&gt;</code> ou <code>&lt;td&gt;</code>. Et vérifie que chaque ligne a le même nombre de cellules (fusions comprises) : une cellule oubliée décale toute la colonne.</div>
<div class="tip">Prépare tes tableaux sur papier : dessine la grille, compte lignes et colonnes, repère les fusions AVANT de coder. Le HTML d'un tableau se lit mal en code ; le brouillon papier évite l'effet puzzle.</div>`,
  exercises: [
    { type: "qcm", q: "Un tableau HTML sert à…", opts: ["Mettre en page le site (menu à gauche, texte à droite)", "Présenter des données en lignes et colonnes", "Remplacer les listes", "Afficher des images"], a: 1, exp: "Des données, pas de la mise en page : le layout, c'est le CSS." },
    { type: "vf", q: "Utiliser un tableau pour positionner le menu et le contenu est une bonne pratique.", a: false, exp: "Pratique des années 90 : la mise en page appartient au CSS." },
    { type: "input", q: "Nom de la balise qui crée une LIGNE de tableau, sans les chevrons :", a: ["tr", "<tr>"], ph: "nom de la balise…", exp: "tr = table row. Les cellules vivent dedans." },
    { type: "qcm", q: "Quelle balise pour une cellule de DONNÉE ?", opts: ["&lt;th&gt;", "&lt;td&gt;", "&lt;tr&gt;", "&lt;cell&gt;"], a: 1, exp: "td = table data ; th est réservé aux en-têtes." },
    { type: "qcm", q: "Quelle est la différence entre &lt;th&gt; et &lt;td&gt; ?", opts: ["Aucune", "th = cellule d'en-tête, td = cellule de donnée", "th est plus large", "td est obsolète"], a: 1, exp: "th porte le sens « titre de colonne/ligne », utile aux lecteurs d'écran." },
    { type: "qcm", q: "Comment construit-on un tableau ?", opts: ["Colonne par colonne", "Ligne par ligne : un &lt;tr&gt;, puis ses cellules", "Cellule par cellule au hasard", "En commençant par le CSS"], a: 1, exp: "HTML décrit les lignes ; les colonnes émergent de l'alignement des cellules." },
    { type: "qcm", q: "La ligne des titres de colonnes se place dans…", opts: ["&lt;tbody&gt;", "&lt;thead&gt;", "&lt;tfoot&gt;", "&lt;caption&gt;"], a: 1, exp: "thead pour l'en-tête, tbody pour les données." },
    { type: "input", q: "Nom de la balise qui donne un TITRE au tableau (placée juste après &lt;table&gt;), sans les chevrons :", a: ["caption", "<caption>"], ph: "nom de la balise…", exp: "caption : le titre du tableau, précieux pour l'accessibilité." },
    { type: "qcm", q: "Pour étendre une cellule sur 3 colonnes :", opts: ["rowspan=\"3\"", "colspan=\"3\"", "width=\"3\"", "merge=\"3\""], a: 1, exp: "colspan = extension horizontale (colonnes), rowspan = verticale (lignes)." },
    { type: "qcm", q: "Quand une cellule fusionne sur 2 colonnes, les cellules qu'elle recouvre…", opts: ["Restent dans le code", "Sont supprimées du code", "Deviennent invisibles avec CSS", "Passent dans le thead"], a: 1, exp: "Sinon la ligne compte trop de cellules et tout se décale." },
    { type: "vf", q: "On peut écrire du texte directement entre &lt;tr&gt; et la première cellule.", a: false, exp: "Tout contenu vit dans un th ou un td, jamais entre." },
    { type: "qcm", q: "Toutes les lignes d'un tableau doivent avoir…", opts: ["Le même nombre de cellules (fusions comprises)", "Au moins un lien", "Une couleur différente", "Un thead chacune"], a: 0, exp: "Une cellule manquante décale toute la colonne." },
    { type: "qcm", q: "Sans CSS, un tableau HTML s'affiche…", opts: ["Avec de belles bordures colorées", "Brut, sans bordures visibles, mais structuré", "Pas du tout", "Uniquement sur mobile"], a: 1, exp: "La structure est là ; l'apparence viendra du CSS, sans toucher aux balises." },
    { type: "vf", q: "Un lecteur d'écran peut annoncer l'en-tête de colonne d'une cellule si le tableau utilise des &lt;th&gt;.", a: true, exp: "« Colonne Durée : 75 min » — c'est tout l'intérêt des th et du caption." },
    { type: "qcm", q: "Dans le catalogue de la Ludothèque, chaque nom de jeu peut être…", opts: ["Un &lt;h1&gt;", "Un lien vers sa fiche, dans son &lt;td&gt;", "Une image sans alt", "Un &lt;caption&gt;"], a: 1, exp: "Les balises se combinent : un a dans un td, tout à fait valide." }
  ],
  final: {
    title: "Exercice final — Le catalogue en grille",
    intro: `<p>Lignes, cellules, en-têtes, fusions : le tableau du catalogue n'attend plus que tes réponses.</p>`,
    questions: [
      { type: "qcm", q: "La hiérarchie correcte d'un tableau complet :", opts: ["table &gt; caption + thead + tbody &gt; tr &gt; th/td", "table &gt; td &gt; tr", "tr &gt; table &gt; td", "thead &gt; table &gt; tr"], a: 0, exp: "table englobe tout ; les lignes contiennent les cellules." },
      { type: "input", q: "Attribut pour fusionner une cellule sur plusieurs LIGNES (verticalement) ? (nom de l'attribut seul)", a: ["rowspan"], ph: "nom de l'attribut…", exp: "rowspan = lignes (rows) ; colspan = colonnes." },
      { type: "vf", q: "Le catalogue (jeu, joueurs, durée, âge) est un bon usage du tableau.", a: true, exp: "Données naturellement tabulaires : une ligne par jeu, une colonne par caractéristique." },
      { type: "qcm", q: "Le tableau du catalogue de la Ludothèque compte 4 colonnes et 3 jeux. Combien de &lt;tr&gt; au total (avec l'en-tête) ?", opts: ["3", "4", "7", "12"], a: 1, exp: "1 ligne d'en-têtes dans thead + 3 lignes de jeux dans tbody = 4 tr." },
      { type: "qcm", q: "Où placer &lt;caption&gt;Catalogue de la Ludothèque&lt;/caption&gt; ?", opts: ["Avant &lt;table&gt;", "Juste après l'ouverture de &lt;table&gt;", "Dans le &lt;tbody&gt;", "Dans le &lt;footer&gt;"], a: 1, exp: "Première chose dans la table, avant thead." }
    ],
    solution: `<pre class="pseudo">&lt;table&gt;                                              // tout le tableau
  &lt;caption&gt;titre du tableau&lt;/caption&gt;                 // titre lisible / accessible
  &lt;thead&gt;  → 1 &lt;tr&gt; de &lt;th&gt; (titres de colonnes)      // la ligne d'en-tête
  &lt;tbody&gt;  → 1 &lt;tr&gt; par donnée, rempli de &lt;td&gt;         // une ligne par enregistrement
Fusions : colspan (colonnes) / rowspan (lignes),      // étendre une cellule…
          en retirant les cellules recouvertes.       // …et supprimer celles qu'elle couvre
Règle d'or : des DONNÉES, jamais de la mise en page.  // le layout, c'est le CSS

Ludothèque : jeux.html affiche le catalogue            // résultat du jour
             (jeu · joueurs · durée · âge), noms cliquables.   // chaque nom = un lien</pre>
<p>Le catalogue est en ligne. Demain, on donne la parole aux visiteurs : les formulaires, pour recueillir leurs avis sur les jeux.</p>`
  }
