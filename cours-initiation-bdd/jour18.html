<script>
var DAY = {
  num: 18,
  title: "Opérations arithmétiques et fonctions numériques",
  subtitle: "Calculer dans une requête : colonnes calculées, ABS, MOD, POWER, ROUND, TRUNCATE.",
  theory: `
<h3>1. Calculer dans un SELECT</h3>
<p>SQL n'a pas été conçu pour faire des mathématiques complexes, mais il sait effectuer des <strong>opérations arithmétiques simples</strong> sur des colonnes numériques. On peut par exemple afficher un stock augmenté de 100, un salaire annuel calculé à partir du salaire mensuel, etc. Important : la colonne obtenue par un calcul n'est <strong>pas</strong> enregistrée dans la table — elle n'existe que le temps de l'affichage du résultat. On parle de <strong>colonne calculée</strong>.</p>
<pre class="pseudo">-- Base Sporting_goods, table S_STOCK(id_article, quantite, point_reassort)
SELECT id_article,
       quantite,               -- le stock actuel
       quantite + 100 AS futur_stock   -- ce que deviendra le stock si on commande 100 de plus
FROM S_STOCK;</pre>
<div class="tip">Donne toujours un nom clair à une colonne calculée avec <code>AS</code> (un alias). Sans alias, l'en-tête de colonne serait l'expression brute, peu lisible.</div>

<h3>2. Les opérateurs et leur ordre de préséance</h3>
<p>Les quatre opérateurs sont <code>+</code> (addition), <code>-</code> (soustraction), <code>*</code> (multiplication) et <code>/</code> (division). L'ordre de préséance suit l'arithmétique classique : les parenthèses d'abord, puis <code>*</code> et <code>/</code>, enfin <code>+</code> et <code>-</code>. À priorité égale, l'évaluation se fait de gauche à droite. Comme partout, les parenthèses permettent de forcer l'ordre ou simplement de clarifier.</p>
<pre class="pseudo">-- Ordre de preseance :
--   ()          evalue en premier
--   *  /        evalue en second
--   +  -        evalue en dernier
SELECT 2 + 3 * 4        AS sans_parentheses,   -- = 2 + 12 = 14
       (2 + 3) * 4      AS avec_parentheses;   -- = 5 * 4  = 20</pre>
<pre class="pseudo">-- Exemple concret : salaire annuel apres une augmentation de 250 par mois
SELECT nom,
       salaire,                        -- salaire mensuel
       (salaire + 250) * 12 AS salaire_annuel   -- augmente puis multiplie par 12 mois
FROM S_EMP;</pre>

<h3>3. Les fonctions numériques sur une valeur isolée</h3>
<p>Une <strong>fonction</strong> prend une ou plusieurs valeurs en entrée (ses <em>arguments</em>, entre parenthèses) et retourne un résultat. Les fonctions numériques ci-dessous agissent <strong>ligne par ligne</strong> : elles produisent un résultat pour chaque ligne. (À ne pas confondre avec les fonctions d'agrégation des prochains jours, qui résument plusieurs lignes en une seule valeur.)</p>

<h3>4. ABS : la valeur absolue</h3>
<p><code>ABS(m)</code> retourne la valeur de <code>m</code> sans son signe. Elle sert souvent à mesurer un écart entre deux nombres, peu importe lequel est le plus grand.</p>
<pre class="pseudo">SELECT id_article,
       quantite - point_reassort       AS ecart,        -- peut etre negatif
       ABS(quantite - point_reassort)  AS ecart_absolu  -- toujours positif ou nul
FROM S_STOCK;
-- ABS(-15) vaut 15 ; ABS(15) vaut 15 ; ABS(0) vaut 0</pre>

<h3>5. MOD : le reste d'une division</h3>
<p><code>MOD(m, n)</code> retourne le <strong>reste</strong> de la division entière de <code>m</code> par <code>n</code>. Par exemple <code>MOD(26, 3)</code> vaut <code>2</code> (car 26 = 3 × 8 + 2). Très utile pour savoir si un nombre est pair (reste de la division par 2 égal à 0), multiple de quelque chose, etc.</p>
<pre class="pseudo">SELECT id_article,
       quantite,
       MOD(quantite, 9) AS reste_par_9   -- reste de quantite divise par 9
FROM S_STOCK;</pre>

<h3>6. POWER : l'élévation à une puissance</h3>
<p><code>POWER(m, n)</code> retourne <code>m</code> élevé à la puissance <code>n</code>. Ainsi <code>POWER(5, 2)</code> vaut <code>25</code> (5 au carré) et <code>POWER(2, 3)</code> vaut <code>8</code>.</p>
<pre class="pseudo">SELECT id_article,
       quantite,
       POWER(quantite, 2) AS quantite_au_carre
FROM S_STOCK;</pre>

<h3>7. ROUND : arrondir</h3>
<p><code>ROUND(m, n)</code> arrondit <code>m</code> à <code>n</code> décimales. Si <code>n</code> est omis, il vaut 0 : on arrondit à l'entier le plus proche. Avec un <code>n</code> <strong>négatif</strong>, on arrondit à gauche de la virgule : <code>-1</code> à la dizaine, <code>-2</code> à la centaine.</p>
<pre class="pseudo">SELECT ROUND(99.99)        AS entier,      -- 100 (n par defaut = 0)
       ROUND(99.994, 2)    AS centieme,    -- 99.99
       ROUND(99.996, 2)    AS centieme2,   -- 100.00
       ROUND(1234.5, -1)   AS dizaine,     -- 1230
       ROUND(1234.5, -2)   AS centaine;    -- 1200</pre>

<h3>8. TRUNCATE : tronquer (couper) sans arrondir</h3>
<p><code>TRUNCATE(m, n)</code> <strong>coupe</strong> <code>m</code> à <code>n</code> décimales sans arrondir : les chiffres au-delà sont simplement ignorés. Ainsi <code>TRUNCATE(99.99, 0)</code> vaut <code>99</code> (et non 100 comme ROUND). Comme ROUND, un <code>n</code> négatif tronque à la dizaine, à la centaine…</p>
<pre class="pseudo">SELECT TRUNCATE(99.99, 0)   AS tronque_entier,   -- 99  (ROUND donnerait 100)
       TRUNCATE(8.765, 2)   AS tronque_centieme, -- 8.76
       TRUNCATE(1234.5, -2) AS tronque_centaine; -- 1200</pre>
<div class="warn">Ne confonds pas : ROUND(99.99) = 100 (il arrondit), TRUNCATE(99.99, 0) = 99 (il coupe). Le premier tient compte du chiffre suivant, le second l'ignore.</div>

<h3>9. Imbriquer les fonctions</h3>
<p><strong>Imbriquer</strong> (ou emboîter) des fonctions, c'est utiliser le résultat d'une fonction comme argument d'une autre. SQL évalue de l'intérieur vers l'extérieur.</p>
<pre class="pseudo">-- reste de (quantite / 81), puis arrondi a la dizaine la plus proche
SELECT id_article,
       ROUND( MOD(quantite, 81), -1 ) AS reste_arrondi   -- MOD calcule d'abord, ROUND ensuite
FROM S_STOCK;</pre>`,
  exercises: [
    { type: "qcm", q: "Une colonne calculée (ex. quantite + 100)…", opts: ["Est enregistrée définitivement dans la table", "N'apparaît que pour l'affichage du résultat", "Modifie les données", "Supprime la colonne d'origine"], a: 1, exp: "Le calcul ne crée pas un champ permanent : il n'existe que le temps de l'affichage." },
    { type: "qcm", q: "Dans 2 + 3 * 4, le résultat est…", opts: ["20", "14", "24", "9"], a: 1, exp: "* est prioritaire sur + : 3*4=12, puis 2+12=14." },
    { type: "qcm", q: "Pour forcer l'addition avant la multiplication, on utilise…", opts: ["Des guillemets", "Des parenthèses", "L'opérateur AS", "La fonction ROUND"], a: 1, exp: "Les parenthèses sont évaluées en premier : (2+3)*4 = 20." },
    { type: "qcm", q: "ABS(-15) retourne…", opts: ["-15", "15", "0", "1"], a: 1, exp: "La valeur absolue supprime le signe : ABS(-15) = 15." },
    { type: "qcm", q: "MOD(26, 3) retourne…", opts: ["8", "2", "9", "0"], a: 1, exp: "26 = 3×8 + 2 : le reste est 2." },
    { type: "qcm", q: "POWER(5, 2) retourne…", opts: ["10", "7", "25", "52"], a: 2, exp: "5 élevé à la puissance 2 = 5×5 = 25." },
    { type: "qcm", q: "ROUND(99.99) (sans second argument) retourne…", opts: ["99", "99.9", "100", "99.99"], a: 2, exp: "Sans n, on arrondit à l'entier le plus proche : 100." },
    { type: "qcm", q: "TRUNCATE(99.99, 0) retourne…", opts: ["100", "99", "99.9", "0"], a: 1, exp: "TRUNCATE coupe sans arrondir : 99." },
    { type: "vf", q: "ROUND et TRUNCATE donnent toujours le même résultat.", a: false, exp: "Faux : ROUND arrondit (99.99 → 100), TRUNCATE coupe (99.99 → 99)." },
    { type: "qcm", q: "ROUND(1234.5, -2) retourne…", opts: ["1234.50", "1200", "1230", "1235"], a: 1, exp: "Un n négatif arrondit à gauche de la virgule ; -2 = à la centaine : 1200." },
    { type: "vf", q: "Les fonctions numériques comme ABS ou ROUND agissent ligne par ligne (un résultat par ligne).", a: true, exp: "Ce sont des fonctions sur valeur isolée : un résultat pour chaque ligne." },
    { type: "input", q: "Quelle fonction (un mot) donne le reste d'une division, ex. ___(26, 3) = 2 ?", a: "MOD", ph: "un nom de fonction", exp: "MOD(m, n) retourne le reste de m divisé par n." },
    { type: "input", q: "Quelle fonction (un mot) donne la valeur absolue, ex. ___(-15) = 15 ?", a: "ABS", ph: "un nom de fonction", exp: "ABS(m) retourne m sans son signe." },
    { type: "input", q: "Écris l'expression qui affiche le salaire annuel après une augmentation de 250 par mois (colonne salaire mensuel). Complète : (salaire + 250) ___ 12", a: ["*", "* 12"], ph: "un opérateur", exp: "On augmente puis on multiplie par 12 mois : (salaire + 250) * 12." },
    { type: "input", q: "Complète pour arrondir le stock divisé par 9 à l'entier le plus proche : ___(quantite / 9)", a: "ROUND", ph: "un nom de fonction", exp: "ROUND sans second argument arrondit à l'entier." }
  ],
  final: {
    title: "Exercice final — Calculs sur le stock et les salaires",
    intro: `<p>Base Sporting_goods. Table S_STOCK(id_article, quantite, point_reassort). Table S_EMP(nom, titre, salaire mensuel).</p>`,
    questions: [
      { type: "qcm", q: "Afficher le stock actuel et le stock après ajout de 100 :", opts: ["SELECT quantite, quantite - 100 ...", "SELECT quantite, quantite + 100 AS futur_stock ...", "SELECT quantite * 100 ...", "SELECT ROUND(quantite) ..."], a: 1, exp: "Une colonne calculée quantite + 100." },
      { type: "qcm", q: "Reste du stock divisé par 9 :", opts: ["POWER(quantite, 9)", "MOD(quantite, 9)", "ROUND(quantite, 9)", "ABS(quantite)"], a: 1, exp: "MOD donne le reste de la division." },
      { type: "qcm", q: "Stock divisé par 9, arrondi à l'entier :", opts: ["TRUNCATE(quantite / 9, 2)", "ROUND(quantite / 9)", "MOD(quantite, 9)", "POWER(quantite, 9)"], a: 1, exp: "ROUND sans n arrondit à l'entier le plus proche." },
      { type: "vf", q: "(salaire + 250) * 12 calcule le salaire annuel après une hausse de 250 par mois.", a: true, exp: "On augmente le mensuel puis on multiplie par 12." },
      { type: "input", q: "Quelle fonction (un mot) coupe 99.99 en 99 sans arrondir ?", a: "TRUNCATE", ph: "un nom de fonction", exp: "TRUNCATE tronque sans arrondir." }
    ],
    solution: `<pre class="pseudo">-- 1) stock actuel et futur
SELECT id_article, quantite, quantite + 100 AS futur_stock
FROM S_STOCK;

-- 2) reste de la division par 9
SELECT id_article, quantite, MOD(quantite, 9) AS reste
FROM S_STOCK;

-- 3) division arrondie a l'entier
SELECT id_article, ROUND(quantite / 9) AS stock_sur_9
FROM S_STOCK;

-- salaire annuel apres +250 par mois
SELECT nom, (salaire + 250) * 12 AS salaire_annuel
FROM S_EMP;</pre>
<p>Colonnes calculées, ABS, MOD, POWER, ROUND, TRUNCATE : de quoi calculer ligne par ligne. Demain : les fonctions de chaîne et de date.</p>`
  }
};
</script>
