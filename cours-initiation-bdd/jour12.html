<script>
var DAY = {
  num: 12,
  title: "Interroger : SELECT et la projection",
  subtitle: "Choisir les colonnes à afficher, avec ou sans doublons.",
  theory: `
<h3>1. L'instruction SELECT</h3>
<p><strong>SELECT</strong> est l'instruction d'interrogation (LID) : elle extrait des données d'une ou plusieurs tables. C'est la commande la plus utilisée du SQL. Sa forme minimale comporte deux clauses obligatoires : <strong>SELECT</strong> (quelles colonnes) et <strong>FROM</strong> (quelle table).</p>
<pre class="pseudo">SELECT colonne1, colonne2, ...     -- QUOI afficher : la liste des colonnes
FROM   nomTable;                   -- DEPUIS quelle table</pre>
<div class="tip">Table d'exemple de tout le chapitre (le support) :</div>
<pre class="pseudo">-- Table Pilote
--   brevet | nom            | nbHVol | compa
--   PL-1   | Gratien Viel   | 450    | AF
--   PL-2   | Didier Donsez  | 0      | AF
--   PL-3   | Richard Grin   | 1000   | SING
--   PL-4   | Placide Fresnais | 2450 | CAST
--   PL-5   | Daniel Vielle  | (NULL) | AF</pre>

<h3>2. Afficher toutes les colonnes : l'étoile *</h3>
<p>Pour extraire <strong>toutes</strong> les colonnes d'une table, on utilise le symbole <strong>*</strong>.</p>
<pre class="pseudo">SELECT * FROM Pilote;              -- affiche TOUTES les colonnes de tous les pilotes</pre>
<div class="warn">Conseil du support : hors tests et démonstrations, évite <code>SELECT *</code>. Mieux vaut nommer explicitement les colonnes voulues : moins de données circulent, la requête est plus claire et résiste mieux aux changements de structure de la table.</div>

<h3>3. Afficher certaines colonnes (la projection)</h3>
<p>Choisir un sous-ensemble de colonnes s'appelle la <strong>projection</strong>. On liste simplement les colonnes désirées après SELECT.</p>
<pre class="pseudo">SELECT nom, nbHVol                 -- on ne veut que ces deux colonnes
FROM   Pilote;                     -- resultat : une table a 2 colonnes (nom et nbHVol)</pre>
<p>L'ordre dans lequel tu écris les colonnes est l'ordre dans lequel elles s'afficheront.</p>

<h3>4. Renommer une colonne à l'affichage : les alias (AS)</h3>
<p>Un <strong>alias</strong> renomme une colonne (ou une table) à l'affichage, avec le mot-clé <strong>AS</strong> (facultatif mais recommandé pour la clarté). C'est utile pour un titre de colonne plus lisible.</p>
<pre class="pseudo">SELECT nom      AS nom_du_pilote,       -- la colonne s'affichera sous le titre « nom_du_pilote »
       nbHVol   AS heures_de_vol
FROM   Pilote;</pre>
<div class="tip">Le support recommande d'utiliser AS pour éviter toute ambiguïté. Sans AS, MySQL interprète quand même le mot qui suit comme un alias — d'où des surprises si on oublie une virgule entre deux colonnes.</div>

<h3>5. Supprimer les doublons : DISTINCT</h3>
<p>Par défaut, SELECT affiche <strong>toutes</strong> les lignes, doublons compris (c'est l'option implicite ALL). La projection « pure » du modèle relationnel, elle, ne garde pas de doublons : on l'obtient avec <strong>DISTINCT</strong>.</p>
<pre class="pseudo">SELECT compa FROM Pilote;          -- affiche : AF, AF, SING, CAST, AF  (doublons presents)

SELECT DISTINCT compa FROM Pilote; -- affiche : AF, SING, CAST         (chaque valeur une seule fois)</pre>
<div class="warn">Retenir : sans DISTINCT, toutes les lignes s'affichent (y compris les répétitions) ; DISTINCT élimine les lignes en double dans le résultat.</div>`,
  exercises: [
    { type: "input", q: "Complète : l'instruction pour lire des données est ______ ... FROM ... ;", a: ["select"], ph: "un mot-clé", exp: "SELECT colonnes FROM table." },
    { type: "qcm", q: "Quelles sont les deux clauses obligatoires d'un SELECT simple ?", opts: ["SELECT et WHERE", "SELECT et FROM", "FROM et ORDER BY", "SELECT et DISTINCT"], a: 1, exp: "SELECT (colonnes) et FROM (table) sont indispensables." },
    { type: "input", q: "Complète : pour afficher toutes les colonnes d'une table, on écrit SELECT ______ FROM Pilote ;", a: ["*", "etoile"], ph: "un symbole", exp: "L'étoile * désigne toutes les colonnes." },
    { type: "qcm", q: "Choisir un sous-ensemble de colonnes s'appelle…", opts: ["La sélection", "La projection", "Le tri", "La jointure"], a: 1, exp: "La projection choisit les colonnes ; la sélection (WHERE) choisit les lignes." },
    { type: "vf", q: "Le support recommande d'utiliser SELECT * dans tous les programmes de production.", a: false, exp: "Faux : il déconseille SELECT * hors tests ; mieux vaut nommer les colonnes." },
    { type: "input", q: "Complète : pour renommer une colonne à l'affichage, on utilise le mot-clé ______.", a: ["as"], ph: "un mot-clé", exp: "AS crée un alias : SELECT nom AS nom_du_pilote." },
    { type: "qcm", q: "SELECT nom, nbHVol FROM Pilote affiche…", opts: ["Toutes les colonnes", "Seulement les colonnes nom et nbHVol", "Seulement une ligne", "Rien"], a: 1, exp: "Projection : uniquement les colonnes citées." },
    { type: "input", q: "Complète : pour éliminer les doublons dans le résultat, on ajoute ______ après SELECT.", a: ["distinct"], ph: "un mot-clé", exp: "SELECT DISTINCT colonne ..." },
    { type: "qcm", q: "SELECT DISTINCT compa FROM Pilote (compa = AF, AF, SING, CAST, AF) renvoie…", opts: ["AF, AF, SING, CAST, AF", "AF, SING, CAST", "Une seule ligne", "Toutes les colonnes"], a: 1, exp: "DISTINCT garde chaque valeur une seule fois : AF, SING, CAST." },
    { type: "vf", q: "Par défaut (sans DISTINCT), un SELECT affiche aussi les lignes en double.", a: true, exp: "Vrai : l'option par défaut est ALL (tous les doublons)." },
    { type: "input", q: "Complète : la clause qui indique DEPUIS quelle table on lit est ______.", a: ["from"], ph: "un mot-clé", exp: "FROM nomTable." },
    { type: "qcm", q: "L'ordre des colonnes dans SELECT nom, brevet FROM Pilote…", opts: ["N'a aucune influence", "Détermine l'ordre d'affichage (nom, puis brevet)", "Trie les lignes", "Supprime les doublons"], a: 1, exp: "Les colonnes s'affichent dans l'ordre où on les écrit." },
    { type: "vf", q: "AS est obligatoire pour créer un alias.", a: false, exp: "Faux : AS est facultatif, mais recommandé pour la clarté." },
    { type: "qcm", q: "SELECT appartient à quelle famille SQL ?", opts: ["LDD", "LMD", "LID (interrogation)", "LCD"], a: 2, exp: "SELECT interroge/lit les données : LID." },
    { type: "input", q: "Complète : SELECT nbHVol ______ heures_de_vol FROM Pilote ; renomme la colonne à l'affichage.", a: ["as"], ph: "un mot-clé", exp: "AS heures_de_vol crée l'alias." }
  ],
  final: {
    title: "Exercice final — Projeter la table Pilote",
    intro: `<p>On travaille sur <code>Pilote(brevet, nom, nbHVol, compa)</code>. Compose les requêtes demandées.</p>`,
    questions: [
      { type: "qcm", q: "Afficher toutes les colonnes de tous les pilotes :", opts: ["SELECT nom FROM Pilote", "SELECT * FROM Pilote", "SELECT ALL Pilote", "FROM Pilote SELECT *"], a: 1, exp: "SELECT * FROM Pilote." },
      { type: "qcm", q: "Afficher seulement le nom et la compagnie de chaque pilote :", opts: ["SELECT nom, compa FROM Pilote", "SELECT * FROM Pilote", "SELECT nom FROM compa", "SELECT nom AND compa FROM Pilote"], a: 0, exp: "Projection sur nom et compa." },
      { type: "qcm", q: "Lister les compagnies présentes SANS répétition :", opts: ["SELECT compa FROM Pilote", "SELECT DISTINCT compa FROM Pilote", "SELECT * FROM Pilote", "SELECT compa AS DISTINCT FROM Pilote"], a: 1, exp: "DISTINCT supprime les doublons." },
      { type: "input", q: "Complète : afficher le nom sous le titre « pilote » : SELECT nom ______ pilote FROM Pilote ;", a: ["as"], ph: "un mot-clé", exp: "SELECT nom AS pilote FROM Pilote." },
      { type: "vf", q: "SELECT nom, nbHVol FROM Pilote renvoie une table à deux colonnes.", a: true, exp: "Vrai : autant de colonnes que de noms cités après SELECT." }
    ],
    solution: `<pre class="pseudo">-- toutes les colonnes :
SELECT * FROM Pilote;

-- projection sur deux colonnes :
SELECT nom, compa FROM Pilote;

-- valeurs distinctes de compagnie (sans doublon) :
SELECT DISTINCT compa FROM Pilote;

-- alias d'affichage :
SELECT nom AS pilote, nbHVol AS heures_de_vol FROM Pilote;</pre>
<p>Tu sais choisir tes colonnes. Demain : filtrer les LIGNES avec la clause WHERE.</p>`
  }
};
</script>
