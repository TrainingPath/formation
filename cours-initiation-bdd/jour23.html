<script>
var DAY = {
  num: 23,
  title: "Les jointures externes (LEFT / RIGHT JOIN)",
  subtitle: "Garder les lignes d'une table même sans correspondance dans l'autre.",
  theory: `
<h3>1. Le problème des lignes « orphelines »</h3>
<p>La jointure interne d'hier ne garde que les lignes qui ont une correspondance <strong>des deux côtés</strong>. Conséquence : une compagnie sans pilote, ou un employé sans directeur, <strong>disparaît</strong> du résultat. Or on veut souvent les afficher quand même : « toutes les compagnies ET leurs pilotes, y compris les compagnies sans pilote ». C'est le rôle de la <strong>jointure externe</strong> (<em>outer join</em>).</p>

<h3>2. Table dominante et table subordonnée</h3>
<p>Dans une jointure externe, une table est <strong>dominante</strong> et l'autre <strong>subordonnée</strong>. Toutes les lignes de la table <strong>dominante</strong> sont retournées, <strong>même si elles n'ont pas de correspondance</strong> dans la table subordonnée. Là où il manque une correspondance, les colonnes de la table subordonnée sont remplies par <code>NULL</code>.</p>
<pre class="pseudo">-- Compagnie(comp, nomComp) : AF, SING, CAST
-- Pilote(brevet, nom, compa) : des pilotes chez AF et SING, AUCUN chez CAST
-- Une jointure interne oublierait CAST (aucun pilote).
-- Une jointure externe dominante = Compagnie affiche CAST avec des NULL cote pilote.</pre>

<h3>3. LEFT JOIN : la table de GAUCHE est dominante</h3>
<p>Le sens de la directive (<code>LEFT</code> ou <code>RIGHT</code>) désigne la table dominante. Avec <code>LEFT OUTER JOIN</code> (le mot <code>OUTER</code> est facultatif), la table écrite <strong>à gauche</strong> du JOIN est dominante : toutes ses lignes sortent, complétées par NULL quand il n'y a pas de correspondance à droite.</p>
<pre class="pseudo">SELECT c.nomComp, p.nom AS pilote
FROM Compagnie AS c                   -- table de GAUCHE = dominante
LEFT JOIN Pilote AS p                 -- LEFT OUTER JOIN, OUTER optionnel
   ON c.comp = p.compa;
-- Resultat : toutes les compagnies ; CAST apparait avec pilote = NULL</pre>

<h3>4. RIGHT JOIN : la table de DROITE est dominante</h3>
<p><code>RIGHT OUTER JOIN</code> fait l'inverse : la table écrite <strong>à droite</strong> est dominante. Toutes ses lignes sortent, complétées par NULL côté gauche quand il n'y a pas de correspondance. Note qu'un <code>RIGHT JOIN</code> peut toujours se réécrire en <code>LEFT JOIN</code> en inversant l'ordre des tables ; en pratique, on privilégie souvent LEFT JOIN pour la lisibilité.</p>
<pre class="pseudo">SELECT c.nomComp, p.nom AS pilote
FROM Compagnie AS c
RIGHT JOIN Pilote AS p                -- table de DROITE (Pilote) = dominante
   ON c.comp = p.compa;
-- Resultat : tous les pilotes, meme un pilote sans compagnie valide (nomComp = NULL)</pre>

<h3>5. Trouver les lignes SANS correspondance</h3>
<p>Astuce très courante : pour obtenir seulement les lignes <strong>orphelines</strong> (celles sans correspondance de l'autre côté), on fait une jointure externe puis on garde les lignes où la colonne de la table subordonnée est <code>NULL</code>. Exemple : les compagnies qui n'ont AUCUN pilote.</p>
<pre class="pseudo">SELECT c.nomComp
FROM Compagnie c
LEFT JOIN Pilote p ON c.comp = p.compa
WHERE p.brevet IS NULL;   -- aucune correspondance cote pilote = compagnie sans pilote</pre>
<div class="tip">Dans la base Sporting_goods, cela permet par exemple d'afficher les employés qui n'ont pas de directeur, ou les clients auxquels aucun représentant n'a été attribué.</div>

<h3>6. Récapitulatif des jointures</h3>
<pre class="pseudo">-- INNER JOIN  : seulement les lignes qui correspondent des deux cotes
-- LEFT  JOIN  : toutes les lignes de GAUCHE + les correspondances de droite (NULL sinon)
-- RIGHT JOIN  : toutes les lignes de DROITE + les correspondances de gauche (NULL sinon)</pre>
<pre class="pseudo">-- Exemple Sporting_goods : tous les clients ET leurs commandes,
-- y compris les clients qui n'ont passe aucune commande.
SELECT cl.id AS num_client, cl.nom, co.id AS num_commande
FROM S_CLIENT cl
LEFT JOIN S_COMMANDE co ON cl.id = co.id_client;
-- Un client sans commande apparait avec num_commande = NULL</pre>
<div class="warn">Piège fréquent : avec un LEFT JOIN, si tu mets une condition sur la table subordonnée dans le WHERE (ex. WHERE co.montant &gt; 100), tu élimines les lignes NULL et tu retombes de fait sur une jointure interne. Pour conserver les orphelins, place la condition dans le ON, ou teste explicitement IS NULL.</div>`,
  exercises: [
    { type: "qcm", q: "Une jointure externe sert à…", opts: ["Supprimer les doublons", "Garder les lignes d'une table même sans correspondance dans l'autre", "Trier deux tables", "Compter les lignes"], a: 1, exp: "L'outer join conserve les lignes sans correspondance." },
    { type: "qcm", q: "Dans une jointure externe, la table dominante est celle dont…", opts: ["On ignore les lignes", "Toutes les lignes sont retournées, même sans correspondance", "On garde seulement les correspondances", "On calcule la moyenne"], a: 1, exp: "Toutes les lignes de la table dominante sortent." },
    { type: "qcm", q: "Quand une ligne dominante n'a pas de correspondance, les colonnes de l'autre table valent…", opts: ["0", "Une chaîne vide", "NULL", "La ligne est supprimée"], a: 2, exp: "Les colonnes de la table subordonnée sont remplies par NULL." },
    { type: "qcm", q: "Dans un LEFT JOIN, la table dominante est…", opts: ["Celle de droite", "Celle de gauche (avant le JOIN)", "La plus grande", "Aucune"], a: 1, exp: "LEFT = la table de gauche est dominante." },
    { type: "qcm", q: "Dans un RIGHT JOIN, la table dominante est…", opts: ["Celle de gauche", "Celle de droite (après le JOIN)", "La plus petite", "Aucune"], a: 1, exp: "RIGHT = la table de droite est dominante." },
    { type: "qcm", q: "Le mot OUTER dans LEFT OUTER JOIN est…", opts: ["Obligatoire", "Facultatif", "Interdit", "Réservé aux dates"], a: 1, exp: "LEFT JOIN et LEFT OUTER JOIN sont équivalents." },
    { type: "qcm", q: "Pour trouver les compagnies SANS pilote, on fait un LEFT JOIN puis…", opts: ["WHERE p.brevet IS NULL", "WHERE p.brevet IS NOT NULL", "GROUP BY", "ORDER BY"], a: 0, exp: "IS NULL côté subordonné isole les orphelins." },
    { type: "qcm", q: "Un RIGHT JOIN peut toujours se réécrire en…", opts: ["INNER JOIN", "LEFT JOIN en inversant l'ordre des tables", "GROUP BY", "UNION"], a: 1, exp: "Inverser les tables transforme un RIGHT en LEFT équivalent." },
    { type: "vf", q: "Un INNER JOIN peut afficher une compagnie qui n'a aucun pilote.", a: false, exp: "Faux : l'inner join exige une correspondance des deux côtés ; il faut un outer join." },
    { type: "vf", q: "LEFT JOIN garde toutes les lignes de la table de gauche, même sans correspondance à droite.", a: true, exp: "C'est exactement le comportement du LEFT JOIN." },
    { type: "qcm", q: "Sur un LEFT JOIN, mettre WHERE co.montant > 100 (colonne subordonnée)…", opts: ["N'a aucun effet", "Élimine les lignes NULL et revient de fait à un INNER JOIN", "Trie le résultat", "Provoque une erreur"], a: 1, exp: "Filtrer la table subordonnée dans WHERE supprime les orphelins." },
    { type: "input", q: "Quel type de jointure (deux mots) rend dominante la table de gauche ?", a: ["LEFT JOIN", "left join", "LEFT OUTER JOIN"], ph: "deux mots (anglais)", exp: "LEFT JOIN : la table de gauche est dominante." },
    { type: "input", q: "Pour ne garder que les employés SANS directeur après un LEFT JOIN sur le directeur, on écrit WHERE d.id ___ NULL. (deux mots)", a: ["is", "is null"], ph: "deux mots", exp: "IS NULL isole les lignes sans correspondance." },
    { type: "input", q: "Quel type de jointure (deux mots, anglais) n'affiche QUE les correspondances des deux côtés ?", a: ["INNER JOIN", "inner join"], ph: "deux mots", exp: "INNER JOIN : seulement les correspondances." },
    { type: "input", q: "Complète : FROM Compagnie c LEFT JOIN Pilote p ___ c.comp = p.compa. (le mot-clé de la clause de jointure)", a: "ON", ph: "un mot-clé SQL", exp: "ON introduit la clause de jointure, comme pour l'inner join." }
  ],
  final: {
    title: "Exercice final — Clients, commandes et directeurs",
    intro: `<p>Base Sporting_goods. Table S_CLIENT(id, nom, id_representant). Table S_COMMANDE(id, id_client, montant). Table S_EMP(id, nom, id_directeur).</p>`,
    questions: [
      { type: "qcm", q: "Tous les clients ET leurs commandes, y compris les clients sans commande :", opts: ["S_CLIENT cl INNER JOIN S_COMMANDE co ON cl.id = co.id_client", "S_CLIENT cl LEFT JOIN S_COMMANDE co ON cl.id = co.id_client", "S_CLIENT cl, S_COMMANDE co", "GROUP BY cl.id"], a: 1, exp: "LEFT JOIN garde tous les clients, même sans commande." },
      { type: "qcm", q: "Un client sans commande apparaîtra avec, pour la colonne montant…", opts: ["0", "NULL", "La moyenne", "Rien du tout"], a: 1, exp: "Pas de correspondance → colonnes subordonnées à NULL." },
      { type: "qcm", q: "Les employés qui n'ont pas de directeur :", opts: ["S_EMP e JOIN S_EMP d ... (inner)", "S_EMP e LEFT JOIN S_EMP d ON e.id_directeur = d.id WHERE d.id IS NULL", "WHERE e.id_directeur > 0", "GROUP BY e.id_directeur"], a: 1, exp: "LEFT JOIN + IS NULL isole les employés sans directeur." },
      { type: "qcm", q: "Les clients sans représentant attribué :", opts: ["LEFT JOIN sur le représentant puis WHERE representant IS NULL", "INNER JOIN", "ORDER BY id_representant", "SUM(id_representant)"], a: 0, exp: "Jointure externe puis test IS NULL côté représentant." },
      { type: "vf", q: "Un RIGHT JOIN peut se réécrire en LEFT JOIN en inversant l'ordre des tables.", a: true, exp: "Les deux sont symétriques." }
    ],
    solution: `<pre class="pseudo">-- 1) tous les clients et leurs commandes (meme sans commande)
SELECT cl.id AS num_client, cl.nom, co.id AS num_commande
FROM S_CLIENT cl
LEFT JOIN S_COMMANDE co ON cl.id = co.id_client;

-- 2) les clients qui n'ont passe AUCUNE commande
SELECT cl.nom
FROM S_CLIENT cl
LEFT JOIN S_COMMANDE co ON cl.id = co.id_client
WHERE co.id IS NULL;

-- 3) les employes sans directeur (auto-jointure externe)
SELECT e.nom
FROM S_EMP e
LEFT JOIN S_EMP d ON e.id_directeur = d.id
WHERE d.id IS NULL;</pre>
<p>Les jointures externes ne laissent personne de côté. Demain : les sous-requêtes, une requête à l'intérieur d'une autre.</p>`
  }
};
