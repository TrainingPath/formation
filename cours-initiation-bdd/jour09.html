<script>
var DAY = {
  num: 9,
  title: "Les clés étrangères (FOREIGN KEY)",
  subtitle: "Relier deux tables et garantir l'intégrité référentielle.",
  theory: `
<h3>1. Rappel : à quoi sert une clé étrangère ?</h3>
<p>Une <strong>clé étrangère</strong> (FOREIGN KEY) est une colonne d'une table « enfant » qui fait référence à la <strong>clé primaire</strong> d'une table « parent ». Elle établit un <strong>lien</strong> entre les deux tables et fait respecter l'<strong>intégrité référentielle</strong> : impossible de référencer un parent qui n'existe pas.</p>
<div class="tip">Exemple du support : chaque pilote appartient à une compagnie. La table <code>Pilote</code> (enfant) contient une colonne <code>compa</code> qui pointe vers <code>comp</code> (clé primaire) de la table <code>Compagnie</code> (parent).</div>

<h3>2. Déclarer une clé étrangère</h3>
<p>On déclare une clé étrangère avec <strong>FOREIGN KEY (colonne) REFERENCES tableParent (colonne)</strong>. Le plus souvent, on la nomme (préfixe <code>fk_</code>) pour pouvoir la gérer plus tard.</p>
<pre class="pseudo">-- 1) la table PARENT doit exister d'abord
CREATE TABLE Compagnie (
    comp     VARCHAR(4),
    nomComp  VARCHAR(20) NOT NULL,
    CONSTRAINT pk_Compagnie PRIMARY KEY (comp)
);

-- 2) puis la table ENFANT, avec sa cle etrangere vers Compagnie
CREATE TABLE Pilote (
    brevet  VARCHAR(6),
    nom     VARCHAR(16) NOT NULL,
    compa   VARCHAR(4),                    -- colonne qui portera le code de la compagnie
    CONSTRAINT pk_Pilote PRIMARY KEY (brevet),
    CONSTRAINT fk_Pil_compa_Comp FOREIGN KEY (compa) REFERENCES Compagnie (comp)
    -- fk_ = cle etrangere : compa (dans Pilote) reference comp (dans Compagnie)
);</pre>

<h3>3. L'ordre de création compte</h3>
<div class="warn">Règle d'or : on crée toujours la table <strong>parent AVANT</strong> la table enfant (l'enfant a besoin que le parent existe pour pouvoir le référencer). Pour la suppression, c'est l'inverse : on supprime l'enfant avant le parent.</div>
<p>De même, à l'insertion, il faut d'abord créer une compagnie avant de pouvoir y rattacher un pilote. Sinon, MySQL refuse : la valeur de <code>compa</code> doit exister dans <code>Compagnie.comp</code> (ou valoir NULL).</p>

<h3>4. Ce que la clé étrangère empêche</h3>
<p>Une fois la clé étrangère en place, le SGBD bloque les opérations qui casseraient la cohérence :</p>
<pre class="pseudo">-- REFUSE : rattacher un pilote a une compagnie 'ZZZ' qui n'existe pas
INSERT INTO Pilote VALUES ('PL-9', 'Durand', 'ZZZ');   -- erreur : 'ZZZ' absent de Compagnie

-- REFUSE : supprimer une compagnie encore utilisee par un pilote
DELETE FROM Compagnie WHERE comp = 'AF';               -- erreur : des pilotes y font reference</pre>
<p>Ce message d'erreur typique est : « Cannot delete or update a parent row: a foreign key constraint fails ».</p>

<h3>5. ON DELETE et ON UPDATE : que faire quand le parent change ?</h3>
<p>On peut préciser le comportement à adopter si la ligne parent est supprimée (ON DELETE) ou modifiée (ON UPDATE). Quatre options existent :</p>
<pre class="pseudo">CONSTRAINT fk_Pil_compa_Comp FOREIGN KEY (compa) REFERENCES Compagnie (comp)
    ON DELETE RESTRICT      -- RESTRICT : interdit de supprimer le parent s'il est reference (defaut)
    ON UPDATE CASCADE;      -- CASCADE : repercute le changement sur les enfants automatiquement</pre>
<p>Les quatre options : <strong>RESTRICT</strong> (interdit l'opération, comportement par défaut), <strong>CASCADE</strong> (répercute la suppression/modification sur les enfants), <strong>SET NULL</strong> (met la clé étrangère des enfants à NULL) et <strong>NO ACTION</strong> (proche de RESTRICT).</p>
<div class="tip">Exemple concret de CASCADE : si on supprime une compagnie avec ON DELETE CASCADE, tous ses pilotes sont supprimés en même temps. Avec SET NULL, les pilotes restent mais leur colonne compa passe à NULL. À choisir selon la règle métier voulue.</div>`,
  exercises: [
    { type: "input", q: "Complète : on déclare une clé étrangère avec FOREIGN KEY (compa) ______ Compagnie (comp).", a: ["references"], ph: "un mot-clé", exp: "FOREIGN KEY (...) REFERENCES tableParent (...)." },
    { type: "qcm", q: "Dans quel ordre crée-t-on les tables ?", opts: ["L'enfant d'abord, puis le parent", "Le parent d'abord, puis l'enfant", "Peu importe", "Les deux simultanément obligatoirement"], a: 1, exp: "Le parent doit exister avant l'enfant qui le référence." },
    { type: "vf", q: "On ne peut pas insérer un pilote rattaché à une compagnie qui n'existe pas dans la table Compagnie.", a: true, exp: "Vrai : l'intégrité référentielle l'interdit (sauf valeur NULL)." },
    { type: "input", q: "Complète : selon les conventions, le nom d'une contrainte de clé étrangère se préfixe par ______ (deux lettres et un tiret bas).", a: ["fk_"], ph: "un préfixe", exp: "fk_ pour foreign key." },
    { type: "qcm", q: "Que fait l'option ON DELETE CASCADE ?", opts: ["Elle interdit la suppression du parent", "Elle supprime automatiquement les lignes enfants liées quand on supprime le parent", "Elle met la clé étrangère à NULL", "Elle ne fait rien"], a: 1, exp: "CASCADE répercute la suppression sur les enfants." },
    { type: "input", q: "Complète : l'option qui met à NULL la clé étrangère des enfants quand le parent est supprimé est ON DELETE SET ______.", a: ["null"], ph: "un mot-clé", exp: "ON DELETE SET NULL." },
    { type: "qcm", q: "Quelle est l'option par défaut de ON DELETE ?", opts: ["CASCADE", "SET NULL", "RESTRICT", "NO ACTION toujours"], a: 2, exp: "RESTRICT (interdit l'opération si le parent est référencé) est le comportement par défaut." },
    { type: "vf", q: "Pour supprimer les tables, on supprime l'enfant avant le parent.", a: true, exp: "Vrai : l'ordre de suppression est l'inverse de l'ordre de création." },
    { type: "input", q: "Complète : la règle qui exige que toute clé étrangère pointe vers un parent existant (ou vaille NULL) est l'intégrité ______.", a: ["referentielle"], ph: "un mot", exp: "L'intégrité référentielle." },
    { type: "qcm", q: "Une clé étrangère peut-elle valoir NULL ?", opts: ["Non, jamais", "Oui : NULL est autorisé (l'enfant n'est alors rattaché à aucun parent)", "Seulement si elle est clé primaire", "Uniquement pour les dates"], a: 1, exp: "NULL est permis pour une clé étrangère." },
    { type: "qcm", q: "Que se passe-t-il si on tente de supprimer une compagnie encore référencée par des pilotes (ON DELETE RESTRICT) ?", opts: ["La suppression réussit", "MySQL refuse : « a foreign key constraint fails »", "Les pilotes sont supprimés", "Rien n'est vérifié"], a: 1, exp: "RESTRICT bloque la suppression du parent référencé." },
    { type: "input", q: "Complète : la table qui contient la clé étrangère est la table ______ (parent / enfant).", a: ["enfant", "fils"], ph: "un mot", exp: "La table enfant (ou fils) contient la clé étrangère." },
    { type: "qcm", q: "FOREIGN KEY (compa) REFERENCES Compagnie (comp) signifie…", opts: ["comp référence compa", "compa (dans la table enfant) doit correspondre à une valeur de comp (clé primaire du parent)", "compa devient une clé primaire", "Les deux colonnes sont supprimées"], a: 1, exp: "La colonne enfant compa pointe vers la clé primaire comp du parent." },
    { type: "vf", q: "Avec ON DELETE SET NULL, supprimer une compagnie supprime aussi tous ses pilotes.", a: false, exp: "Faux : SET NULL conserve les pilotes mais met leur colonne compa à NULL. C'est CASCADE qui les supprimerait." },
    { type: "input", q: "Complète : la contrainte qui déclare la colonne d'identification unique de la table parent est la ______ ______ (deux mots).", a: ["primary key", "cle primaire"], ph: "deux mots", exp: "La clé étrangère référence toujours une clé primaire (PRIMARY KEY)." }
  ],
  final: {
    title: "Exercice final — Relier Compte à Client",
    intro: `<p>Une table <code>Client</code> (clé primaire <code>nocli</code>) existe déjà. On crée une table <code>Compte</code> dont chaque compte appartient à un client : la colonne <code>nocli</code> de Compte doit référencer <code>Client(nocli)</code>.</p>`,
    questions: [
      { type: "qcm", q: "Laquelle est la table parent ?", opts: ["Compte", "Client", "Les deux", "Aucune"], a: 1, exp: "Client contient la clé primaire référencée : c'est le parent." },
      { type: "input", q: "Complète : CONSTRAINT fk_Compte_client FOREIGN KEY (nocli) ______ Client (nocli).", a: ["references"], ph: "un mot-clé", exp: "REFERENCES Client (nocli)." },
      { type: "vf", q: "Il faut que la table Client existe avant de créer Compte avec cette clé étrangère.", a: true, exp: "Le parent doit exister avant l'enfant." },
      { type: "qcm", q: "On tente d'insérer un compte avec nocli = 'ZZZ99' absent de Client. Résultat ?", opts: ["Accepté", "Refusé (intégrité référentielle)", "Le client est créé automatiquement", "La table est supprimée"], a: 1, exp: "Refusé : le client référencé doit exister." },
      { type: "qcm", q: "Pour que la suppression d'un client mette à NULL le nocli de ses comptes, on ajoute…", opts: ["ON DELETE CASCADE", "ON DELETE SET NULL", "ON DELETE RESTRICT", "ON UPDATE CASCADE"], a: 1, exp: "SET NULL laisse les comptes mais annule leur lien." }
    ],
    solution: `<pre class="pseudo">-- Client (parent) existe deja, avec pk sur nocli.
CREATE TABLE Compte (
    nocompte     VARCHAR(6),
    soldecompte  DECIMAL(9,2),
    nocli        VARCHAR(6),                     -- clé etrangere vers Client
    CONSTRAINT pk_Compte PRIMARY KEY (nocompte),
    CONSTRAINT fk_Compte_client FOREIGN KEY (nocli) REFERENCES Client (nocli)
        ON DELETE SET NULL                       -- si un client part, ses comptes gardent nocli = NULL
);
-- Parent AVANT enfant ; toute valeur de nocli doit exister dans Client (ou etre NULL).</pre>
<p>Ton schéma tient debout. Demain : on remplit enfin les tables avec INSERT.</p>`
  }
};
</script>
