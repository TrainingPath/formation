<script>
var DAY = {
  num: 24,
  title: "Les sous-requêtes",
  subtitle: "Une requête à l'intérieur d'une autre : filtrer selon le résultat d'un SELECT.",
  theory: `
<h3>1. Qu'est-ce qu'une sous-requête ?</h3>
<p>Une <strong>sous-requête</strong> (ou requête imbriquée) est une instruction <code>SELECT</code> placée <strong>à l'intérieur</strong> d'une autre. Elle permet de filtrer des lignes selon une valeur qui n'est pas connue d'avance, mais qui doit elle-même être calculée par une requête. La requête englobante s'appelle la <strong>requête externe</strong> (ou principale), la requête imbriquée la <strong>requête interne</strong> (ou sous-requête).</p>
<pre class="pseudo">SELECT ...        -- requete EXTERNE : s'execute en DERNIER
FROM ...
WHERE colonne = ( SELECT ...      -- SOUS-REQUETE : s'execute en PREMIER
                  FROM ...
                  WHERE ... );</pre>
<p>Règles importantes : la sous-requête est <strong>entre parenthèses</strong> et se place à droite de la condition. L'ordre d'exécution va toujours de la requête <strong>la plus interne</strong> vers la plus externe : SQL calcule d'abord la valeur de la sous-requête, puis s'en sert dans la requête externe.</p>

<h3>2. Sous-requête à une seule ligne</h3>
<p>Quand la sous-requête retourne <strong>une seule valeur</strong>, on la compare avec un <strong>opérateur simple</strong> : <code>=</code>, <code>&lt;&gt;</code>, <code>&gt;</code>, <code>&gt;=</code>, <code>&lt;</code>, <code>&lt;=</code>. Exemple typique : les employés qui gagnent plus que le salaire moyen. On ne connaît pas ce salaire moyen d'avance : une sous-requête le calcule.</p>
<pre class="pseudo">SELECT nom, prenom, salaire
FROM S_EMP
WHERE salaire > ( SELECT AVG(salaire)   -- calcule d'abord le salaire moyen
                  FROM S_EMP );          -- ... puis compare chaque salaire a cette valeur</pre>
<div class="warn">Avec un opérateur simple (=, &gt;, …), la sous-requête doit renvoyer UNE seule valeur. Si elle en renvoie plusieurs, MySQL déclenche une erreur. Il faut alors un opérateur multi-lignes (IN, ANY, ALL).</div>

<h3>3. Sous-requête à lignes multiples : IN et NOT IN</h3>
<p>Quand la sous-requête peut retourner <strong>plusieurs lignes</strong>, on utilise un <strong>opérateur multi-lignes</strong>. Le plus courant est <code>IN</code> : la valeur externe doit être égale à l'<strong>une</strong> des valeurs renvoyées. Sa négation <code>NOT IN</code> exige d'être différente de <strong>toutes</strong>.</p>
<pre class="pseudo">-- Les compagnies qui embauchent au moins un pilote de moins de 500 heures de vol
SELECT nomComp
FROM Compagnie
WHERE comp IN ( SELECT compa            -- codes des compagnies concernees
                FROM Pilote
                WHERE nbHVol &lt; 500 );</pre>
<pre class="pseudo">-- Les compagnies qui n'ont AUCUN pilote
SELECT nomComp
FROM Compagnie
WHERE comp NOT IN ( SELECT compa FROM Pilote );</pre>

<h3>4. Les opérateurs ANY et ALL</h3>
<p>Deux autres opérateurs multi-lignes affinent la comparaison :</p>
<p><code>ANY</code> compare la valeur à <strong>chaque</strong> valeur renvoyée : il suffit qu'<strong>au moins une</strong> satisfasse la comparaison. Ainsi <code>&lt; ANY (…)</code> signifie « inférieur à au moins une valeur », c'est-à-dire inférieur au maximum de la liste.</p>
<p><code>ALL</code> exige que la comparaison soit vraie pour <strong>toutes</strong> les valeurs renvoyées. Ainsi <code>&gt; ALL (…)</code> signifie « supérieur à toutes les valeurs », c'est-à-dire supérieur au maximum.</p>
<pre class="pseudo">-- Avions dont le nombre d'heures est inferieur a AU MOINS UN A320
SELECT ... WHERE nbHVol &lt; ANY ( SELECT nbHVol FROM Avion WHERE type = 'A320' );

-- Avions dont le nombre d'heures est superieur a TOUS les avions de la compagnie AF
SELECT ... WHERE nbHVol &gt; ALL ( SELECT nbHVol FROM Avion WHERE compa = 'AF' );</pre>

<h3>5. Sous-requête et fonctions d'agrégation</h3>
<p>Les sous-requêtes s'entendent très bien avec les agrégats : la sous-requête calcule un agrégat (moyenne, maximum, minimum…) que la requête externe utilise comme point de comparaison.</p>
<pre class="pseudo">-- Les employes qui percoivent le plus bas salaire de la table
SELECT nom, prenom, salaire
FROM S_EMP
WHERE salaire = ( SELECT MIN(salaire) FROM S_EMP );</pre>

<h3>6. Requête de corrélation (aperçu)</h3>
<p>Dans une sous-requête ordinaire, la requête interne se calcule une seule fois, indépendamment de la requête externe. Dans une <strong>requête de corrélation</strong>, la sous-requête <strong>fait référence à la table de la requête externe</strong> (via un alias) et se ré-exécute pour chaque ligne candidate. C'est plus puissant mais plus coûteux.</p>
<pre class="pseudo">-- Les departements ayant AU MOINS UN employe (la sous-requete se refere a d.id)
SELECT d.nom
FROM S_DEPT d
WHERE EXISTS ( SELECT 1
               FROM S_EMP e
               WHERE e.id_dept = d.id );   -- e.id_dept fait reference a la ligne externe d.id</pre>
<div class="tip">Retiens surtout : sous-requête = un SELECT dans un SELECT, entre parenthèses. Une valeur unique → opérateur simple (=, &gt;…). Plusieurs valeurs → opérateur multi-lignes (IN, NOT IN, ANY, ALL).</div>`,
  exercises: [
    { type: "qcm", q: "Une sous-requête est…", opts: ["Une table temporaire permanente", "Une instruction SELECT placée à l'intérieur d'une autre", "Un type de jointure", "Un index"], a: 1, exp: "Une sous-requête est un SELECT imbriqué dans un autre." },
    { type: "qcm", q: "Dans une requête imbriquée, l'ordre d'exécution va…", opts: ["De l'externe vers l'interne", "De la requête la plus interne vers la plus externe", "De gauche à droite", "Au hasard"], a: 1, exp: "SQL calcule d'abord la sous-requête, puis la requête externe." },
    { type: "qcm", q: "Une sous-requête doit être placée…", opts: ["Entre guillemets", "Entre parenthèses", "Après ORDER BY", "Dans le FROM uniquement"], a: 1, exp: "La sous-requête s'écrit entre parenthèses." },
    { type: "qcm", q: "« Les employés gagnant plus que le salaire moyen » utilise…", opts: ["WHERE salaire > AVG(salaire)", "WHERE salaire > (SELECT AVG(salaire) FROM S_EMP)", "GROUP BY salaire", "HAVING salaire"], a: 1, exp: "La sous-requête calcule la moyenne, comparée avec >." },
    { type: "qcm", q: "Avec l'opérateur =, une sous-requête doit renvoyer…", opts: ["Plusieurs lignes", "Une seule valeur", "Aucune valeur", "Toujours NULL"], a: 1, exp: "Un opérateur simple exige une valeur unique." },
    { type: "qcm", q: "Si la sous-requête peut renvoyer plusieurs valeurs, on utilise…", opts: ["=", "IN, NOT IN, ANY ou ALL", "ORDER BY", "COUNT"], a: 1, exp: "Les opérateurs multi-lignes gèrent plusieurs valeurs." },
    { type: "qcm", q: "IN dans une sous-requête signifie…", opts: ["Différent de toutes les valeurs", "Égal à l'une des valeurs renvoyées", "Supérieur à toutes", "Inférieur au minimum"], a: 1, exp: "IN = égal à au moins une des valeurs renvoyées." },
    { type: "qcm", q: "> ALL (liste) signifie…", opts: ["Supérieur à au moins une valeur", "Supérieur à toutes les valeurs", "Égal à une valeur", "Inférieur au minimum"], a: 1, exp: "ALL exige la comparaison vraie pour toutes les valeurs." },
    { type: "qcm", q: "< ANY (liste) signifie…", opts: ["Inférieur à toutes les valeurs", "Inférieur à au moins une valeur", "Égal à toutes", "Supérieur au maximum"], a: 1, exp: "ANY : il suffit qu'au moins une valeur satisfasse la comparaison." },
    { type: "qcm", q: "Une requête de corrélation se distingue car sa sous-requête…", opts: ["Ne s'exécute jamais", "Fait référence à la table de la requête externe et se ré-exécute par ligne", "N'a pas de parenthèses", "Renvoie toujours une seule valeur"], a: 1, exp: "La sous-requête corrélée référence la ligne externe et se répète." },
    { type: "vf", q: "Une sous-requête avec = qui renvoie plusieurs lignes provoque une erreur.", a: true, exp: "L'opérateur simple exige une valeur unique." },
    { type: "input", q: "Quel opérateur multi-lignes (un mot) teste l'égalité à l'une des valeurs d'une sous-requête ?", a: "IN", ph: "un mot-clé SQL", exp: "IN : égal à l'une des valeurs renvoyées." },
    { type: "input", q: "Quel opérateur (un mot) exige que la comparaison soit vraie pour TOUTES les valeurs renvoyées ?", a: "ALL", ph: "un mot-clé SQL", exp: "ALL : vrai pour toutes les valeurs." },
    { type: "input", q: "Complète la sous-requête donnant le salaire minimum : WHERE salaire = (SELECT ___(salaire) FROM S_EMP)", a: "MIN", ph: "une fonction d'agrégation", exp: "MIN(salaire) donne le plus bas salaire." },
    { type: "input", q: "Quel opérateur (deux mots) trouve les compagnies dont le code n'est dans AUCUN pilote ? WHERE comp ___ (SELECT compa FROM Pilote)", a: ["NOT IN", "not in"], ph: "deux mots-clés", exp: "NOT IN : différent de toutes les valeurs renvoyées." }
  ],
  final: {
    title: "Exercice final — Comparer à une valeur calculée",
    intro: `<p>Base Sporting_goods. Table S_EMP(id, nom, prenom, salaire, id_dept). Table S_DEPT(id, nom). Table Compagnie(comp, nomComp) et Pilote(brevet, nom, nbHVol, compa).</p>`,
    questions: [
      { type: "qcm", q: "Les employés gagnant plus que le salaire moyen :", opts: ["WHERE salaire > AVG(salaire)", "WHERE salaire > (SELECT AVG(salaire) FROM S_EMP)", "HAVING salaire > AVG(salaire)", "GROUP BY salaire"], a: 1, exp: "Sous-requête d'agrégat comparée avec >." },
      { type: "qcm", q: "Les employés au plus bas salaire :", opts: ["WHERE salaire = MIN(salaire)", "WHERE salaire = (SELECT MIN(salaire) FROM S_EMP)", "ORDER BY salaire", "HAVING MIN(salaire)"], a: 1, exp: "La sous-requête donne le minimum, comparé avec =." },
      { type: "qcm", q: "Les compagnies employant au moins un pilote de moins de 500 h :", opts: ["WHERE comp = (SELECT compa FROM Pilote WHERE nbHVol < 500)", "WHERE comp IN (SELECT compa FROM Pilote WHERE nbHVol < 500)", "WHERE nbHVol < 500", "GROUP BY comp"], a: 1, exp: "Plusieurs codes possibles → IN." },
      { type: "qcm", q: "Les compagnies sans aucun pilote :", opts: ["WHERE comp IN (SELECT compa FROM Pilote)", "WHERE comp NOT IN (SELECT compa FROM Pilote)", "WHERE compa IS NULL", "INNER JOIN Pilote"], a: 1, exp: "NOT IN exclut tous les codes présents chez les pilotes." },
      { type: "vf", q: "SQL exécute d'abord la sous-requête interne, puis la requête externe.", a: true, exp: "L'exécution va du plus interne vers le plus externe." }
    ],
    solution: `<pre class="pseudo">-- 1) plus que le salaire moyen
SELECT nom, prenom, salaire
FROM S_EMP
WHERE salaire &gt; ( SELECT AVG(salaire) FROM S_EMP );

-- 2) le plus bas salaire
SELECT nom, prenom
FROM S_EMP
WHERE salaire = ( SELECT MIN(salaire) FROM S_EMP );

-- 3) compagnies avec un pilote de moins de 500h
SELECT nomComp
FROM Compagnie
WHERE comp IN ( SELECT compa FROM Pilote WHERE nbHVol &lt; 500 );

-- 4) compagnies sans pilote
SELECT nomComp
FROM Compagnie
WHERE comp NOT IN ( SELECT compa FROM Pilote );</pre>
<p>Une requête peut désormais dépendre du résultat d'une autre. Demain : combiner les résultats de plusieurs requêtes avec les opérateurs d'ensemble.</p>`
  }
};
</script>
