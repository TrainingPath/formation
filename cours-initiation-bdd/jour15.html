<script>
var DAY = {
  num: 15,
  title: "Les opérateurs logiques (AND, OR, NOT)",
  subtitle: "Combiner plusieurs conditions dans un WHERE.",
  theory: `
<h3>1. Des conditions composées</h3>
<p>Jusqu'ici, WHERE ne contenait qu'une seule condition. Les <strong>opérateurs booléens</strong> <strong>AND</strong>, <strong>OR</strong> et <strong>NOT</strong> permettent d'en combiner plusieurs pour former une <strong>condition composée</strong>.</p>

<h3>2. AND : les DEUX conditions vraies</h3>
<p>Avec <strong>AND</strong> (« et »), une ligne n'est retenue que si <strong>toutes</strong> les conditions reliées sont vraies en même temps.</p>
<pre class="pseudo">SELECT nom
FROM   Pilote
WHERE  compa = 'AF' AND nbHVol > 500;   -- pilotes de 'AF' ET ayant plus de 500 heures</pre>
<div class="tip">AND est <strong>commutatif</strong> : <code>A AND B</code> donne le même résultat que <code>B AND A</code>. L'ordre des conditions n'a pas d'importance.</div>

<h3>3. OR : au moins UNE condition vraie</h3>
<p>Avec <strong>OR</strong> (« ou »), une ligne est retenue si <strong>au moins une</strong> des conditions est vraie (l'une, l'autre, ou les deux).</p>
<pre class="pseudo">SELECT nom
FROM   Pilote
WHERE  compa = 'AF' OR compa = 'SING';  -- pilotes de 'AF' OU de 'SING'</pre>

<h3>4. NOT : inverser une condition</h3>
<p><strong>NOT</strong> (« non ») inverse la valeur de vérité d'une condition : ce qui était vrai devient faux, et inversement.</p>
<pre class="pseudo">SELECT nom
FROM   Pilote
WHERE  NOT (compa = 'AF');              -- pilotes qui ne sont PAS de 'AF' (equivaut a compa <> 'AF')</pre>

<h3>5. L'ordre de priorité (préséance)</h3>
<p>Quand on mélange les opérateurs, ils s'évaluent dans un ordre précis, comme en mathématiques. De la plus haute à la plus basse priorité :</p>
<pre class="pseudo">-- 1) ( )    ce qui est entre parentheses est evalue en premier
-- 2) NOT    evalue en deuxieme
-- 3) AND    evalue en troisieme
-- 4) OR     evalue en dernier</pre>
<div class="warn">Comme AND passe avant OR, l'écriture <code>A OR B AND C</code> se lit <code>A OR (B AND C)</code>. Pour changer cet ordre, on utilise des <strong>parenthèses</strong> : elles sont toujours évaluées en premier.</div>
<pre class="pseudo">-- SANS parentheses : AND prioritaire -> pilotes de 'SING', PLUS les pilotes de 'AF' a moins de 500 h
SELECT nom FROM Pilote
WHERE compa = 'SING' OR compa = 'AF' AND nbHVol < 500;

-- AVEC parentheses : on force le OR d'abord -> pilotes ('SING' ou 'AF') ayant moins de 500 h
SELECT nom FROM Pilote
WHERE (compa = 'SING' OR compa = 'AF') AND nbHVol < 500;</pre>

<h3>6. Les lois de De Morgan</h3>
<p>Le support rappelle deux équivalences utiles pour transformer une négation :</p>
<pre class="pseudo">-- NOT (p AND q)  equivaut a   (NOT p) OR  (NOT q)
-- NOT (p OR  q)  equivaut a   (NOT p) AND (NOT q)
-- NOT (NOT p)    equivaut a   p</pre>
<div class="tip">Les opérateurs de comparaison (=, <, >, <=, >=, <>) sont prioritaires sur AND, OR et NOT : ils sont donc évalués avant. C'est pourquoi <code>compa = 'AF' AND nbHVol > 500</code> se comprend bien sans parenthèses supplémentaires.</div>`,
  exercises: [
    { type: "input", q: "Complète : pour exiger que DEUX conditions soient vraies en même temps, on les relie par ______.", a: ["and", "et"], ph: "un opérateur", exp: "AND : toutes les conditions doivent être vraies." },
    { type: "qcm", q: "WHERE compa = 'AF' OR compa = 'SING' garde…", opts: ["Les pilotes de 'AF' et de 'SING' à la fois (impossible)", "Les pilotes de 'AF' OU de 'SING'", "Aucun pilote", "Seulement 'AF'"], a: 1, exp: "OR : au moins une des conditions suffit." },
    { type: "input", q: "Complète : l'opérateur qui inverse une condition est ______.", a: ["not", "non"], ph: "un opérateur", exp: "NOT inverse la valeur de vérité." },
    { type: "qcm", q: "Dans l'ordre de priorité, lequel est évalué en PREMIER ?", opts: ["OR", "AND", "NOT", "Ce qui est entre parenthèses"], a: 3, exp: "Les parenthèses d'abord, puis NOT, puis AND, puis OR." },
    { type: "vf", q: "AND est évalué avant OR.", a: true, exp: "Vrai : AND est prioritaire sur OR (comme × avant +)." },
    { type: "qcm", q: "A OR B AND C se comprend comme…", opts: ["(A OR B) AND C", "A OR (B AND C)", "(A AND B) OR C", "Aucune des deux"], a: 1, exp: "AND passe avant OR : A OR (B AND C)." },
    { type: "input", q: "Complète : pour forcer un OR à s'évaluer avant un AND, on entoure les deux conditions du OR de ______ (le signe).", a: ["parentheses", "parenthese"], ph: "un mot", exp: "Les parenthèses sont évaluées en premier." },
    { type: "qcm", q: "WHERE compa = 'AF' AND nbHVol > 500 garde…", opts: ["Tous les pilotes de 'AF'", "Les pilotes de 'AF' ayant en plus plus de 500 heures", "Tous les pilotes ayant plus de 500 heures", "Aucun"], a: 1, exp: "AND : les deux conditions doivent être vraies ensemble." },
    { type: "vf", q: "AND est commutatif : A AND B donne le même résultat que B AND A.", a: true, exp: "Vrai : l'ordre des conditions reliées par AND n'a pas d'importance." },
    { type: "input", q: "Complète (loi de De Morgan) : NOT (p AND q) équivaut à (NOT p) ______ (NOT q).", a: ["or", "ou"], ph: "un opérateur", exp: "NOT (p AND q) = (NOT p) OR (NOT q)." },
    { type: "qcm", q: "NOT (compa = 'AF') est équivalent à…", opts: ["compa = 'AF'", "compa <> 'AF'", "compa IS NULL", "compa = 'SING'"], a: 1, exp: "Nier l'égalité revient à « différent de » : <>." },
    { type: "qcm", q: "Avec OR, une ligne est retenue si…", opts: ["Toutes les conditions sont vraies", "Au moins une condition est vraie", "Aucune condition n'est vraie", "La première seulement est vraie"], a: 1, exp: "OR : au moins une condition suffit." },
    { type: "input", q: "Complète (De Morgan) : NOT (p OR q) équivaut à (NOT p) ______ (NOT q).", a: ["and", "et"], ph: "un opérateur", exp: "NOT (p OR q) = (NOT p) AND (NOT q)." },
    { type: "vf", q: "Les opérateurs de comparaison (=, >, <...) sont évalués avant AND, OR et NOT.", a: true, exp: "Vrai : les comparaisons sont prioritaires sur les opérateurs booléens." },
    { type: "qcm", q: "(compa = 'SING' OR compa = 'AF') AND nbHVol < 500 garde…", opts: ["Tous les pilotes de 'SING'", "Les pilotes de 'SING' ou 'AF' qui ont en plus moins de 500 heures", "Tous les pilotes de moins de 500 heures", "Aucun"], a: 1, exp: "Les parenthèses regroupent le OR, puis AND impose < 500 heures." }
  ],
  final: {
    title: "Exercice final — Combiner des conditions",
    intro: `<p>Table <code>Pilote(brevet, nom, nbHVol, compa)</code>. Écris les conditions demandées.</p>`,
    questions: [
      { type: "qcm", q: "Les pilotes de 'AF' ayant plus de 1000 heures :", opts: ["WHERE compa = 'AF' OR nbHVol > 1000", "WHERE compa = 'AF' AND nbHVol > 1000", "WHERE compa = 'AF' NOT nbHVol", "WHERE compa = 'AF', nbHVol > 1000"], a: 1, exp: "Les deux conditions ensemble : AND." },
      { type: "qcm", q: "Les pilotes de 'AF' ou de 'CAST' :", opts: ["WHERE compa = 'AF' AND compa = 'CAST'", "WHERE compa = 'AF' OR compa = 'CAST'", "WHERE compa = 'AF' NOT 'CAST'", "WHERE compa IN AND"], a: 1, exp: "L'un OU l'autre : OR." },
      { type: "qcm", q: "Les pilotes qui ne sont PAS de 'AF' :", opts: ["WHERE NOT (compa = 'AF')", "WHERE compa = 'AF'", "WHERE compa AND 'AF'", "WHERE compa OR 'AF'"], a: 0, exp: "NOT (compa = 'AF'), équivalent à compa <> 'AF'." },
      { type: "input", q: "Complète : pour « ('SING' ou 'AF') ET moins de 500 h », il faut des ______ autour du OR.", a: ["parentheses", "parenthese"], ph: "un mot", exp: "Sans parenthèses, AND passerait avant OR." },
      { type: "vf", q: "WHERE compa = 'SING' OR compa = 'AF' AND nbHVol < 500 s'évalue comme compa = 'SING' OR (compa = 'AF' AND nbHVol < 500).", a: true, exp: "Vrai : AND est prioritaire sur OR." }
    ],
    solution: `<pre class="pseudo">-- 'AF' ET plus de 1000 heures :
SELECT nom FROM Pilote WHERE compa = 'AF' AND nbHVol > 1000;

-- 'AF' OU 'CAST' :
SELECT nom FROM Pilote WHERE compa = 'AF' OR compa = 'CAST';

-- pas de 'AF' :
SELECT nom FROM Pilote WHERE NOT (compa = 'AF');   -- = compa <> 'AF'

-- ('SING' ou 'AF') ET moins de 500 heures (parentheses indispensables) :
SELECT nom FROM Pilote WHERE (compa = 'SING' OR compa = 'AF') AND nbHVol < 500;
-- Priorite : ( ) puis NOT puis AND puis OR.</pre>
<p>Tu combines les conditions comme un pro. Demain : la recherche par motif avec LIKE.</p>`
  }
};
</script>

};
