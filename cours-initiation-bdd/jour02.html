<script>
var DAY = {
  num: 2,
  title: "Le modèle relationnel : tables, lignes, colonnes",
  subtitle: "Une table, ses colonnes, ses lignes, son degré et sa cardinalité.",
  theory: `
<h3>1. Le modèle relationnel</h3>
<p>Au début des années 1970, E. F. Codd propose le <strong>modèle relationnel</strong>. Son idée : organiser les données sous forme de <strong>relations</strong> (que l'on représente comme des <strong>tables</strong>) sans avoir besoin de pointeurs pour relier les données. Un SGBD fondé sur ce modèle s'appelle un <strong>SGBDR</strong> (Système de Gestion de Bases de Données Relationnelles). MySQL en est un.</p>
<p>Dans une base relationnelle, l'information est représentée par un ensemble de <strong>tables</strong> reliées entre elles. C'est le modèle que nous utilisons dans tout ce cours.</p>

<h3>2. La table</h3>
<p>Une <strong>table</strong> est une représentation matricielle (en tableau) composée de <strong>colonnes</strong> et de <strong>lignes</strong>. Chaque table porte un <strong>nom unique</strong> dans la base. Une table représente soit un <strong>objet</strong> sur lequel on veut conserver des données (les clients, les produits, les employés…), soit une <strong>association</strong> entre plusieurs objets.</p>
<div class="tip">Exemple du support — la table CLIENT :</div>
<pre class="pseudo">-- Table CLIENT (extrait du support)
--   NOCLI  | NOMCLI   | PRENOMCLI | TELCLI        | ADRCLI
--   PERS01 | Perron   | Sylvie    | 02/123.12.31  | 32, rue Marquette
--   BISG01 | Bisson   | Gaston    | 065/98.79.87  | 84, rue des Mesanges
--   DUFA01 | Dufresne | Alice     | 064/32.13.21  | 1603, rue Brebeuf
--   LABP01 | Labbe    | Pierre    | 067/78.97.89  | 471, rue du Pinson</pre>

<h3>3. Les colonnes (attributs, champs) et le degré</h3>
<p>Une table est constituée de <strong>colonnes</strong> (aussi appelées <strong>attributs</strong> ou <strong>champs</strong>). Chaque colonne a un <strong>nom unique dans sa table</strong> (deux colonnes d'une même table ne peuvent pas porter le même nom). Une colonne est une catégorie particulière d'information ; c'est une structure <strong>verticale</strong>. Chaque colonne reçoit un <strong>type de données</strong> et éventuellement des contraintes.</p>
<p>Le nombre total de colonnes d'une table s'appelle son <strong>degré</strong>.</p>
<div class="tip">La table CLIENT ci-dessus a 5 colonnes (NOCLI, NOMCLI, PRENOMCLI, TELCLI, ADRCLI) : son degré est donc <strong>5</strong>. L'ordre des colonnes n'a aucune importance.</div>

<h3>4. Les lignes (tuples, enregistrements) et la cardinalité</h3>
<p>Une <strong>ligne</strong> (aussi appelée <strong>tuple</strong> ou <strong>enregistrement</strong>) est une collection de valeurs inscrites dans les colonnes successives d'une table ; l'ensemble forme un enregistrement unique. Une ligne est une structure <strong>horizontale</strong> : elle regroupe toutes les données relatives à un même élément (par exemple, un client complet).</p>
<p>Le nombre de lignes présentes dans une table à un instant donné s'appelle sa <strong>cardinalité</strong>.</p>
<div class="tip">La table CLIENT possède 4 lignes : sa cardinalité est <strong>4</strong>. Le degré est fixe pour la vie de la table ; la cardinalité, elle, varie au fil des ajouts et des suppressions. Une table sans aucune ligne s'appelle une <strong>table vide</strong>.</div>
<div class="warn">Retenir la différence : le <strong>degré</strong> compte les COLONNES (fixe), la <strong>cardinalité</strong> compte les LIGNES (variable).</div>

<h3>5. Le domaine d'une colonne</h3>
<p>Pour chaque colonne, il existe un ensemble de valeurs permises appelé son <strong>domaine</strong>. Toute valeur qui apparaît dans une colonne doit appartenir à son domaine. On le note Dom(nom_colonne).</p>
<pre class="pseudo">-- Table PERSONNEL (exemple du support)
--   Id            | Nom       | Prenom  | Departement          | Salaire
--   1420472256987 | Martin    | Nicolas | Comptabilite         | 55000
--   1521275458231 | Benakritis| Herve   | Marketing            | 33500
--   2621106365855 | Chatelin  | Sophie  | Ressources humaines  | 40000
-- Degre = 5 (cinq colonnes),  Cardinalite = 3 (trois lignes)
-- Dom(Salaire) : sous-ensemble des reels positifs (un salaire negatif n'a pas de sens)</pre>

<h3>6. Les règles d'une table relationnelle</h3>
<p>De ces définitions, le support déduit quelques règles importantes :</p>
<p>La table a un nom unique ; chaque colonne a un nom unique dans sa table ; l'ordre des colonnes n'a pas d'importance ; toutes les lignes ont le même format ; les valeurs d'une colonne appartiennent au même domaine ; chaque case (intersection ligne / colonne) contient une seule valeur (pas de liste) ; l'ordre des lignes n'a pas d'importance ; et il n'y a jamais deux lignes totalement identiques.</p>`,
  exercises: [
    { type: "input", q: "Complète : le nombre de COLONNES d'une table s'appelle son ______.", a: ["degre"], ph: "un mot", exp: "Le degré compte les colonnes. Il est fixe." },
    { type: "input", q: "Complète : le nombre de LIGNES d'une table à un instant donné s'appelle sa ______.", a: ["cardinalite"], ph: "un mot", exp: "La cardinalité compte les lignes. Elle varie." },
    { type: "qcm", q: "Une ligne d'une table s'appelle aussi…", opts: ["Un degré", "Un tuple ou un enregistrement", "Un domaine", "Un index"], a: 1, exp: "Ligne = tuple = enregistrement : trois synonymes." },
    { type: "qcm", q: "Une colonne d'une table s'appelle aussi…", opts: ["Un attribut ou un champ", "Une cardinalité", "Un tuple", "Une base"], a: 0, exp: "Colonne = attribut = champ." },
    { type: "vf", q: "L'ordre des colonnes dans une table est important et doit être respecté.", a: false, exp: "Faux : l'ordre des colonnes n'a aucune importance dans le modèle relationnel." },
    { type: "input", q: "Complète : l'ensemble des valeurs permises pour une colonne s'appelle son ______.", a: ["domaine"], ph: "un mot", exp: "Le domaine : toute valeur de la colonne doit lui appartenir." },
    { type: "qcm", q: "La table PERSONNEL du support (Id, Nom, Prenom, Departement, Salaire) avec 3 lignes a…", opts: ["Un degré de 3 et une cardinalité de 5", "Un degré de 5 et une cardinalité de 3", "Un degré de 8", "Une cardinalité de 5"], a: 1, exp: "5 colonnes -> degré 5 ; 3 lignes -> cardinalité 3." },
    { type: "vf", q: "Deux lignes totalement identiques (mêmes valeurs partout) sont interdites dans une table relationnelle.", a: true, exp: "Vrai : il n'y a jamais deux tuples identiques dans toutes leurs entrées." },
    { type: "input", q: "Complète : une table qui ne contient aucune ligne s'appelle une table ______.", a: ["vide"], ph: "un mot", exp: "Une table vide : elle a des colonnes mais pas encore de lignes." },
    { type: "qcm", q: "Dom(Salaire) est décrit comme un sous-ensemble des réels positifs parce que…", opts: ["Un salaire est toujours un entier", "Un salaire négatif n'a pas de sens", "Le salaire est la clé primaire", "Le salaire est du texte"], a: 1, exp: "Le domaine exclut les valeurs qui n'ont pas de sens, comme un salaire négatif." },
    { type: "vf", q: "Chaque case (intersection d'une ligne et d'une colonne) peut contenir une liste de plusieurs valeurs.", a: false, exp: "Faux : chaque case contient une seule valeur (pas de liste ni d'ensemble)." },
    { type: "input", q: "Complète : un SGBD fondé sur le modèle relationnel s'appelle un ______ (sigle de cinq lettres).", a: ["SGBDR"], ph: "un sigle", exp: "SGBDR : Système de Gestion de Bases de Données Relationnelles." },
    { type: "qcm", q: "Dans une base relationnelle, l'information est représentée par…", opts: ["Un seul grand fichier texte", "Un ensemble de tables reliées entre elles", "Un tableur unique à plusieurs feuilles", "Une arborescence de dossiers et de fichiers"], a: 1, exp: "Le modèle relationnel organise tout en tables reliées." },
    { type: "qcm", q: "Le degré d'une table…", opts: ["Change à chaque insertion de ligne", "Reste fixe pendant toute la vie de la table", "Est toujours égal à la cardinalité", "Diminue à chaque suppression de ligne"], a: 1, exp: "Le nombre de colonnes est fixé à la création ; seules les lignes varient." },
    { type: "input", q: "Complète : une colonne est une structure ______ (haut/bas) de la table, alors qu'une ligne est horizontale.", a: ["verticale"], ph: "un mot", exp: "Colonne = verticale ; ligne = horizontale." }
  ],
  final: {
    title: "Exercice final — Lire une table",
    intro: `<p>On considère la table COMPTE du support :</p>
<pre class="pseudo">-- Table COMPTE
--   NOCOMPTE | SOLDECOMPTE
--   108      | 66
--   665      | 100
--   725      | 45
--   746      | 50</pre>`,
    questions: [
      { type: "input", q: "Complète : le degré de la table COMPTE est ______.", a: ["2", "deux"], ph: "un nombre", exp: "2 colonnes : NOCOMPTE et SOLDECOMPTE." },
      { type: "input", q: "Complète : la cardinalité de la table COMPTE est ______.", a: ["4", "quatre"], ph: "un nombre", exp: "4 lignes de comptes." },
      { type: "qcm", q: "« 725 » dans la colonne NOCOMPTE est…", opts: ["Une colonne", "Une valeur (une entrée d'un tuple)", "Le degré", "Un domaine"], a: 1, exp: "C'est une valeur, à l'intersection d'une ligne et d'une colonne." },
      { type: "vf", q: "Si l'on ajoute un cinquième compte, le degré de la table passe de 2 à 3.", a: false, exp: "Faux : ajouter une ligne change la cardinalité (4 -> 5), pas le degré (toujours 2)." },
      { type: "qcm", q: "NOCOMPTE et SOLDECOMPTE sont…", opts: ["Deux lignes", "Deux colonnes (attributs)", "Deux tables", "Deux domaines identiques"], a: 1, exp: "Ce sont les deux colonnes de la table." }
    ],
    solution: `<pre class="pseudo">-- Analyse de la table COMPTE :
-- COLONNES (attributs)   : NOCOMPTE, SOLDECOMPTE  -> DEGRE = 2 (fixe)
-- LIGNES   (tuples)      : 108, 665, 725, 746     -> CARDINALITE = 4 (variable)
-- Une VALEUR : ex. 725 = entree du tuple dans la colonne NOCOMPTE
-- Ajouter une ligne -> cardinalite change (4 -> 5), le degre reste 2</pre>
<p>Tu sais lire une table. Demain : les clés qui relient les tables entre elles.</p>`
  }
};
</script>
