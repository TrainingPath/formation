<script>
var DAY = {
  num: 16,
  title: "La correspondance de motifs (LIKE)",
  subtitle: "Rechercher du texte « qui ressemble à… » avec % et _.",
  theory: `
<h3>1. Quand on ne connaît pas la valeur exacte</h3>
<p>Parfois, on ne cherche pas une valeur précise mais des valeurs <strong>qui se ressemblent</strong> : « tous les noms commençant par J », « toutes les adresses contenant RUE ». L'opérateur <strong>LIKE</strong> permet de comparer une colonne de texte à un <strong>modèle</strong> (aussi appelé motif).</p>
<pre class="pseudo">SELECT liste_colonnes
FROM   nomTable
WHERE  colonne LIKE 'modele';       -- garde les lignes dont la colonne CORRESPOND au modele</pre>
<div class="warn">LIKE agit sur des colonnes de caractères (texte). Le modèle s'écrit entre apostrophes simples et peut contenir des caractères génériques : <code>%</code> et <code>_</code>.</div>

<h3>2. Le caractère % : une suite de caractères quelconque</h3>
<p>Le symbole <strong>%</strong> remplace une suite de caractères, de longueur quelconque (y compris aucun caractère).</p>
<pre class="pseudo">WHERE nom LIKE 'D%'      -- commence par D  : « Didier », « Daniel »... (% = la suite, quelle qu'elle soit)
WHERE nom LIKE '%s'      -- finit par s     : la valeur se termine par s
WHERE nom LIKE '%ric%'   -- contient « ric » n'importe ou : « Richard », « Patrick »...</pre>
<div class="tip">Exemple du support : le modèle <code>'s%'</code> désigne toute valeur commençant par s ; <code>'%s'</code>, toute valeur finissant par s ; <code>'%s%'</code>, toute valeur contenant un s n'importe où.</div>

<h3>3. Le caractère _ : exactement un caractère</h3>
<p>Le symbole <strong>_</strong> (tiret bas) remplace <strong>exactement un</strong> caractère, ni plus ni moins.</p>
<pre class="pseudo">WHERE code LIKE 'PL-_'   -- « PL- » suivi d'UN seul caractere : PL-1, PL-2, PL-3...
WHERE tel  LIKE '540-___-____'   -- format telephone : 540- puis 3 chiffres, un tiret, 4 chiffres</pre>
<div class="tip">Exemple du support : pour des numéros de téléphone au format xxx-xxx-xxxx, chaque <code>_</code> représente un chiffre à une position précise. On peut ainsi cibler « le central 987 » avec <code>'___-987-____'</code>.</div>

<h3>4. Combiner % et _</h3>
<p>Les deux symboles se combinent librement dans un même modèle.</p>
<pre class="pseudo">WHERE nom LIKE '_a%'     -- 2e lettre = a : un caractere quelconque, puis « a », puis n'importe quoi
                         -- ex : « Daniel » (D, puis a...), « Marc » (M, puis a...)</pre>

<h3>5. NOT LIKE et les combinaisons</h3>
<p>On inverse la recherche avec <strong>NOT LIKE</strong> (ne correspond PAS au modèle). Et, comme toute condition, LIKE se combine avec AND, OR et NOT.</p>
<pre class="pseudo">-- adresses contenant « St » (rue) mais PAS « Rd » (route)
WHERE adresse LIKE '%St%' AND adresse NOT LIKE '%Rd%';

-- noms commencant par « Athlete » OU par « Athletics »
WHERE nom LIKE 'Athlete%' OR nom LIKE 'Athletics%';</pre>
<div class="warn">À retenir : <code>%</code> = zéro, un ou plusieurs caractères ; <code>_</code> = exactement un caractère. Bien penser à choisir des colonnes VARCHAR pour éviter les espaces de remplissage des CHAR.</div>`,
  exercises: [
    { type: "input", q: "Complète : l'opérateur qui compare du texte à un modèle est ______.", a: ["like"], ph: "un opérateur", exp: "LIKE 'modele' recherche une correspondance de motif." },
    { type: "qcm", q: "Que représente le symbole % dans un modèle LIKE ?", opts: ["Exactement un caractère", "Une suite de caractères de longueur quelconque (même vide)", "Un chiffre uniquement", "Un espace"], a: 1, exp: "% = une suite quelconque de caractères (y compris aucun)." },
    { type: "input", q: "Complète : le symbole qui remplace EXACTEMENT un caractère est le ______ (nom du signe _).", a: ["tiret bas", "underscore", "_", "tiret_bas"], ph: "un symbole", exp: "Le tiret bas _ remplace un seul caractère." },
    { type: "qcm", q: "nom LIKE 'D%' garde les noms qui…", opts: ["Finissent par D", "Commencent par D", "Contiennent D au milieu", "Valent exactement 'D'"], a: 1, exp: "'D%' = commence par D, suivi de n'importe quoi." },
    { type: "qcm", q: "nom LIKE '%s' garde les noms qui…", opts: ["Commencent par s", "Finissent par s", "Contiennent s n'importe où", "N'ont pas de s"], a: 1, exp: "'%s' = se termine par s." },
    { type: "input", q: "Complète : pour trouver les noms contenant « ric » n'importe où, on écrit LIKE '______ric______' (remplace les blancs par le bon symbole ; réponds avec ce symbole).", a: ["%"], ph: "un symbole", exp: "'%ric%' : « ric » entouré de % de chaque côté." },
    { type: "qcm", q: "code LIKE 'PL-_' correspond à…", opts: ["PL- suivi de n'importe quelle suite", "PL- suivi d'exactement un caractère (PL-1, PL-2...)", "Exactement 'PL-'", "Tous les codes"], a: 1, exp: "_ = un seul caractère : PL-1, PL-2, PL-3..." },
    { type: "vf", q: "% peut représenter zéro caractère (donc 's%' correspond aussi à la valeur 's' seule).", a: true, exp: "Vrai : % remplace une suite éventuellement vide." },
    { type: "input", q: "Complète : pour exclure les valeurs correspondant à un modèle, on utilise NOT ______ .", a: ["like"], ph: "un opérateur", exp: "NOT LIKE inverse la correspondance." },
    { type: "qcm", q: "'%s%' recherche les valeurs qui…", opts: ["Commencent par s", "Finissent par s", "Contiennent un s à n'importe quel endroit", "N'ont aucun s"], a: 2, exp: "'%s%' = contient un s quelque part." },
    { type: "vf", q: "LIKE s'utilise sur des colonnes de type texte (caractères).", a: true, exp: "Vrai : LIKE agit sur des chaînes de caractères." },
    { type: "input", q: "Complète : pour un numéro au format 3 chiffres - 3 chiffres - 4 chiffres avec le central 987, on écrit '___-987-____' où chaque tiret bas représente ______ caractère (un nombre en toutes lettres : « un »).", a: ["un", "1"], ph: "un mot", exp: "Chaque _ = exactement un caractère." },
    { type: "qcm", q: "adresse LIKE '%St%' AND adresse NOT LIKE '%Rd%' garde les adresses qui…", opts: ["Contiennent St et Rd", "Contiennent St mais pas Rd", "Ne contiennent ni St ni Rd", "Contiennent Rd mais pas St"], a: 1, exp: "LIKE '%St%' impose St ; NOT LIKE '%Rd%' exclut Rd." },
    { type: "qcm", q: "nom LIKE 'Athlete%' OR nom LIKE 'Athletics%' garde les noms commençant par…", opts: ["Athlete uniquement", "Athletics uniquement", "Athlete ou Athletics", "Ni l'un ni l'autre"], a: 2, exp: "Le OR autorise les deux débuts possibles." },
    { type: "input", q: "Complète : le symbole générique qui remplace une suite de caractères s'écrit ______ (un seul signe).", a: ["%"], ph: "un symbole", exp: "% = suite de caractères ; _ = un seul caractère." }
  ],
  final: {
    title: "Exercice final — Rechercher par motif",
    intro: `<p>Table <code>Pilote(brevet, nom, nbHVol, compa)</code> (noms : Gratien Viel, Didier Donsez, Richard Grin, Placide Fresnais, Daniel Vielle). Compose les modèles LIKE.</p>`,
    questions: [
      { type: "qcm", q: "Noms commençant par 'D' :", opts: ["WHERE nom LIKE '%D'", "WHERE nom LIKE 'D%'", "WHERE nom = 'D'", "WHERE nom LIKE '_D'"], a: 1, exp: "'D%' : commence par D." },
      { type: "qcm", q: "Noms contenant 'Viel' quelque part :", opts: ["WHERE nom LIKE 'Viel'", "WHERE nom LIKE '%Viel%'", "WHERE nom = 'Viel'", "WHERE nom LIKE 'Viel_'"], a: 1, exp: "'%Viel%' : contient Viel n'importe où." },
      { type: "qcm", q: "Codes de brevet 'PL-' suivis d'un seul caractère :", opts: ["WHERE brevet LIKE 'PL-%'", "WHERE brevet LIKE 'PL-_'", "WHERE brevet = 'PL-'", "WHERE brevet LIKE '_PL'"], a: 1, exp: "'PL-_' : un seul caractère après le tiret." },
      { type: "input", q: "Complète : les noms se terminant par 'l' : WHERE nom LIKE '______l' (remplace le blanc par le bon symbole).", a: ["%"], ph: "un symbole", exp: "'%l' : se termine par l." },
      { type: "vf", q: "WHERE nom NOT LIKE 'D%' garde les noms qui ne commencent PAS par D.", a: true, exp: "Vrai : NOT LIKE inverse la correspondance." }
    ],
    solution: `<pre class="pseudo">-- noms commencant par D :
SELECT nom FROM Pilote WHERE nom LIKE 'D%';

-- noms contenant « Viel » :
SELECT nom FROM Pilote WHERE nom LIKE '%Viel%';

-- brevets « PL- » + un seul caractere :
SELECT brevet FROM Pilote WHERE brevet LIKE 'PL-_';

-- noms finissant par « l » :
SELECT nom FROM Pilote WHERE nom LIKE '%l';

-- noms ne commencant PAS par D :
SELECT nom FROM Pilote WHERE nom NOT LIKE 'D%';
-- % = suite de caracteres  |  _ = exactement un caractere</pre>
<p>Félicitations : tu as terminé les 16 premières leçons ! Tu sais concevoir un schéma, créer des tables, y insérer des données et les interroger avec finesse.</p>`
  }
};
</script>

<script>

  placeholder: "Écris ta requête SELECT ... LIKE ici…",
  items: [
  { id: "initbdd-j16", lang: "sql", schema: "CREATE TABLE Pilote (brevet VARCHAR(6), nom VARCHAR(30), nbHVol INTEGER, compa VARCHAR(4));\nINSERT INTO Pilote VALUES ('PL-1','Gratien Viel',450,'AF'),('PL-2','Richard Grin',1000,'SING'),('PL-3','Placide Fresnais',2450,'CAST'),('PL-4','Didier Donsez',900,'AF'),('PL-5','Daniel Vielle',300,'SING');\n", tests: [{"label":"Noms contenant un 'i' mais ne commençant pas par 'D'","query":"SELECT nom FROM Pilote WHERE nom LIKE '%i%' AND nom NOT LIKE 'D%' ORDER BY nom","expect":[["Gratien Viel"],["Placide Fresnais"],["Richard Grin"]]}], checklist: ["As-tu utilisé LIKE '%i%' pour « contient un i quelque part » ?","As-tu exclu les noms commençant par D avec NOT LIKE 'D%' ?","As-tu combiné les deux conditions avec AND ?"], title: "Chercher un motif dans les noms", level: 2,
    statement: "À partir de Pilote(brevet, nom, nbHVol, compa), écris une requête qui affiche le nom des pilotes dont le nom contient la lettre 'i' quelque part, mais ne commence PAS par 'D'. Combine LIKE et NOT LIKE.",
    hints: [
      "« contient i » : nom LIKE '%i%'.",
      "« ne commence pas par D » : nom NOT LIKE 'D%'.",
      "Relie les deux conditions par AND (les deux doivent être vraies)."
    ],
    solution: "SELECT nom\nFROM   Pilote\nWHERE  nom LIKE '%i%'\n       AND nom NOT LIKE 'D%';\n\n-- Resultat attendu (table du support) :\n--   Gratien Viel\n--   Richard Grin\n--   Placide Fresnais\n-- Les noms « Didier Donsez » et « Daniel Vielle » sont exclus car ils commencent par D.",
    note: "% remplace une suite de caractères (ici avant et après le i), tandis que NOT LIKE 'D%' écarte tout nom débutant par D. Les deux conditions sont reliées par AND : la ligne doit satisfaire les deux." }
  ]
};
</script>
