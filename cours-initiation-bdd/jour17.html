<script>
var DAY = {
  num: 17,
  title: "IN, BETWEEN et la gestion de NULL",
  subtitle: "Filtrer sur une liste, sur une plage, et traiter les valeurs manquantes.",
  theory: `
<h3>1. Trois nouveaux besoins de filtrage</h3>
<p>Jusqu'ici, la clause <code>WHERE</code> te sert à comparer une colonne à une valeur (<code>=</code>, <code>&gt;</code>, <code>&lt;</code>…) et à combiner plusieurs conditions avec <code>AND</code>, <code>OR</code>, <code>NOT</code>. Trois situations reviennent tellement souvent que SQL leur offre des <strong>opérateurs intégrés</strong> dédiés, plus courts et plus lisibles : choisir dans une <strong>liste</strong> de valeurs (<code>IN</code>), choisir dans une <strong>plage</strong> de valeurs (<code>BETWEEN</code>), et repérer les valeurs <strong>manquantes</strong> (<code>IS NULL</code>).</p>
<div class="tip">Ces opérateurs ne font rien d'impossible avec AND/OR : ils rendent simplement la requête plus courte et plus claire. Ce sont des raccourcis d'écriture.</div>

<h3>2. IN : appartenir à une liste de valeurs</h3>
<p>L'opérateur <code>IN</code> teste si la valeur d'une colonne figure dans une <strong>liste</strong> donnée entre parenthèses, dont les éléments sont séparés par des virgules. La requête garde les lignes qui comportent l'une des valeurs de la liste. Les éléments peuvent être des nombres ou des chaînes de caractères ; les chaînes doivent être entourées d'apostrophes.</p>
<pre class="pseudo">-- Table S_CLIENT de la base Sporting_goods
SELECT id, nom, telephone      -- on veut l'ID, le nom et le telephone
FROM S_CLIENT
WHERE id IN (303, 305, 403, 406);   -- garde les clients dont l'id vaut 303 OU 305 OU 403 OU 406</pre>
<p><code>IN</code> est exactement équivalent à une suite de <code>OR</code> sur la même colonne :</p>
<pre class="pseudo">-- Ces deux ecritures donnent le meme resultat :
WHERE id IN (303, 305, 403, 406);
WHERE id = 303 OR id = 305 OR id = 403 OR id = 406;</pre>
<p>Pour l'inverse, on préfixe par <code>NOT</code> : <code>NOT IN</code> garde les lignes dont la valeur n'est <strong>pas</strong> dans la liste.</p>
<pre class="pseudo">SELECT nom, solvabilite
FROM S_CLIENT
WHERE solvabilite IN ('EXCELLENTE', 'FAIBLE');   -- solvabilite excellente OU faible

SELECT id, nom
FROM S_CLIENT
WHERE id NOT IN (303, 305, 403, 406);            -- tous SAUF ces quatre id</pre>

<h3>3. BETWEEN : appartenir à une plage de valeurs</h3>
<p>L'opérateur <code>BETWEEN … AND …</code> teste l'appartenance à un <strong>intervalle</strong> de valeurs. On indique d'abord la valeur <strong>basse</strong>, puis la valeur <strong>haute</strong>. Point capital : la plage est <strong>inclusive</strong> — les deux bornes font partie du résultat, ainsi que toutes les valeurs intermédiaires.</p>
<pre class="pseudo">SELECT id, nom, telephone
FROM S_CLIENT
WHERE id BETWEEN 303 AND 306;   -- garde 303, 304, 305 ET 306 (bornes comprises)</pre>
<p><code>BETWEEN a AND b</code> est équivalent à <code>&gt;= a AND &lt;= b</code> :</p>
<pre class="pseudo">-- Ces deux ecritures sont equivalentes :
WHERE salaire BETWEEN 1000 AND 1500;
WHERE salaire &gt;= 1000 AND salaire &lt;= 1500;</pre>
<p><code>BETWEEN</code> fonctionne aussi avec des dates et, sur des chaînes, avec l'ordre alphabétique. Pour exclure la plage, on écrit <code>NOT BETWEEN</code>.</p>
<pre class="pseudo">SELECT id, nom
FROM S_CLIENT
WHERE id NOT BETWEEN 302 AND 306;   -- tous les clients hors de l'intervalle 302..306</pre>
<div class="warn">Attention à l'ordre : il faut écrire la borne basse en premier. <code>BETWEEN 306 AND 303</code> ne renvoie rien, car aucune valeur n'est à la fois &gt;= 306 et &lt;= 303.</div>

<h3>4. NULL : l'absence de valeur</h3>
<p><code>NULL</code> n'est ni zéro, ni une chaîne vide, ni un espace : c'est l'<strong>absence de valeur</strong>, une information inconnue ou non renseignée. Par exemple, un pilote qui n'a pas encore de nombre d'heures de vol enregistré aura <code>NULL</code> dans cette colonne — ce qui est différent de 0 (zéro heure, c'est une information connue).</p>
<pre class="pseudo">-- Table Pilote (base Compagnie_aerienne_NULL)
-- brevet | nom              | nbHVol | Prime | compa
-- PL-1   | Gratien Viel     | 450    | 500   | AF
-- PL-2   | Didier Donsez    | 0      | NULL  | AF     &lt;- Prime inconnue
-- PL-6   | Francoise Tort   | NULL   | 0     | CAST   &lt;- nbHVol inconnu</pre>

<h3>5. On ne compare pas NULL avec = : il faut IS NULL</h3>
<p>Comme <code>NULL</code> signifie inconnu, toute comparaison avec <code>=</code> ou <code>&lt;&gt;</code> renvoie non pas VRAI ou FAUX mais <strong>UNKNOWN</strong> (inconnu) : « la valeur inconnue est-elle égale à 5 ? » on ne peut pas le savoir. Résultat : <code>WHERE prime = NULL</code> ne retourne <strong>jamais</strong> de ligne. Pour tester la présence ou l'absence de valeur, SQL fournit les opérateurs spéciaux <code>IS NULL</code> et <code>IS NOT NULL</code>.</p>
<pre class="pseudo">-- FAUX : ne renvoie aucune ligne, meme s'il existe des primes NULL
SELECT nom FROM Pilote WHERE Prime = NULL;

-- CORRECT : les pilotes dont la prime n'est pas renseignee
SELECT nom FROM Pilote WHERE Prime IS NULL;

-- CORRECT : les pilotes dont la prime EST renseignee
SELECT nom FROM Pilote WHERE Prime IS NOT NULL;</pre>
<div class="tip">Retiens la règle d'or : avec NULL on emploie toujours <code>IS NULL</code> ou <code>IS NOT NULL</code>, jamais <code>= NULL</code> ni <code>&lt;&gt; NULL</code>. La négation peut aussi s'écrire <code>NOT (expression IS NULL)</code>.</div>

<h3>6. Le piège de NULL dans les filtres</h3>
<p>Puisqu'une comparaison avec une colonne <code>NULL</code> vaut UNKNOWN, les lignes concernées sont <strong>exclues</strong> des résultats d'un <code>WHERE</code> ordinaire — même par une condition d'inégalité. Ainsi <code>WHERE nbHVol &lt;&gt; 500</code> n'inclut pas les pilotes dont <code>nbHVol</code> est NULL. Si tu veux aussi récupérer les valeurs manquantes, ajoute-le explicitement avec <code>OR … IS NULL</code>.</p>
<pre class="pseudo">SELECT nom, nbHVol
FROM Pilote
WHERE nbHVol &lt;&gt; 500          -- exclut les nbHVol NULL (comparaison inconnue)
   OR nbHVol IS NULL;         -- ... alors on les rajoute explicitement</pre>`,
  exercises: [
    { type: "qcm", q: "L'opérateur IN sert à…", opts: ["Trier des lignes", "Tester si une valeur figure dans une liste donnée", "Créer une table", "Compter des lignes"], a: 1, exp: "IN teste l'appartenance à une liste de valeurs entre parenthèses." },
    { type: "qcm", q: "WHERE id IN (303, 305, 403) équivaut à…", opts: ["id = 303 AND id = 305 AND id = 403", "id = 303 OR id = 305 OR id = 403", "id BETWEEN 303 AND 403", "id IS NULL"], a: 1, exp: "IN est un raccourci pour une suite de OR sur la même colonne." },
    { type: "qcm", q: "Dans une liste IN, les chaînes de caractères doivent être…", opts: ["Écrites sans rien", "Entourées d'apostrophes", "Entourées de parenthèses", "En majuscules"], a: 1, exp: "Les éléments chaîne s'entourent d'apostrophes ; les nombres non." },
    { type: "vf", q: "BETWEEN 1000 AND 1500 inclut les deux bornes 1000 et 1500.", a: true, exp: "BETWEEN est inclusif : les bornes basse et haute font partie du résultat." },
    { type: "qcm", q: "WHERE salaire BETWEEN 1000 AND 1500 équivaut à…", opts: ["salaire > 1000 AND salaire < 1500", "salaire >= 1000 AND salaire <= 1500", "salaire = 1000 OR salaire = 1500", "salaire IN (1000, 1500)"], a: 1, exp: "BETWEEN a AND b équivaut à >= a AND <= b (bornes comprises)." },
    { type: "qcm", q: "Que renvoie WHERE id BETWEEN 306 AND 303 ?", opts: ["Les id de 303 à 306", "Aucune ligne (bornes inversées)", "Une erreur de syntaxe", "Tous les id"], a: 1, exp: "Il faut la borne basse en premier ; inversées, aucune valeur ne satisfait la condition." },
    { type: "qcm", q: "NULL représente…", opts: ["La valeur zéro", "Une chaîne vide", "L'absence de valeur (inconnue)", "Un espace"], a: 2, exp: "NULL est l'absence de valeur, différent de 0 ou de la chaîne vide." },
    { type: "vf", q: "WHERE Prime = NULL est une bonne façon de trouver les primes non renseignées.", a: false, exp: "Faux : = NULL ne renvoie jamais de ligne. Il faut IS NULL." },
    { type: "qcm", q: "Pour trouver les lignes dont la colonne Prime est renseignée :", opts: ["WHERE Prime = NULL", "WHERE Prime <> NULL", "WHERE Prime IS NOT NULL", "WHERE NOT Prime"], a: 2, exp: "IS NOT NULL teste la présence d'une valeur." },
    { type: "qcm", q: "Une comparaison entre une valeur et NULL (ex. nbHVol = 500 quand nbHVol est NULL) vaut…", opts: ["VRAI", "FAUX", "UNKNOWN (inconnu)", "0"], a: 2, exp: "Toute comparaison avec NULL donne UNKNOWN, donc la ligne est exclue du WHERE." },
    { type: "input", q: "Complète : pour ne garder que les lignes dont la colonne compa n'est pas renseignée, on écrit WHERE compa ___ NULL. (deux mots)", a: ["is", "is null"], ph: "deux mots", exp: "IS NULL teste l'absence de valeur." },
    { type: "input", q: "Quel opérateur (un seul mot) teste l'appartenance à une liste : WHERE id ___ (1, 2, 3) ?", a: "IN", ph: "un mot-clé SQL", exp: "IN teste l'appartenance à une liste." },
    { type: "input", q: "Quel opérateur teste l'appartenance à une plage : WHERE age ___ 18 AND 25 ? (un mot)", a: "BETWEEN", ph: "un mot-clé SQL", exp: "BETWEEN … AND … teste une plage inclusive." },
    { type: "input", q: "Écris la clause WHERE gardant les clients dont la solvabilité est EXCELLENTE ou FAIBLE, avec un seul opérateur de liste. Commence par : WHERE solvabilite …", a: ["WHERE solvabilite IN ('EXCELLENTE', 'FAIBLE')", "solvabilite IN ('EXCELLENTE', 'FAIBLE')", "WHERE solvabilite IN ('EXCELLENTE','FAIBLE')"], ph: "WHERE solvabilite IN (...)", exp: "IN ('EXCELLENTE', 'FAIBLE') remplace deux conditions OR." },
    { type: "input", q: "Écris la clause WHERE donnant les clients dont l'id n'est PAS compris entre 302 et 306. Commence par : WHERE id …", a: ["WHERE id NOT BETWEEN 302 AND 306", "id NOT BETWEEN 302 AND 306"], ph: "WHERE id NOT BETWEEN ...", exp: "NOT BETWEEN exclut l'intervalle, bornes comprises." }
  ],
  final: {
    title: "Exercice final — Liste, plage et valeurs manquantes",
    intro: `<p>Base Sporting_goods. Table S_CLIENT(id, nom, telephone, solvabilite, code_postal, representant). Table Pilote(brevet, nom, nbHVol, Prime, compa).</p>`,
    questions: [
      { type: "qcm", q: "Les clients dont l'id est 303, 305, 403 ou 406 :", opts: ["WHERE id BETWEEN 303 AND 406", "WHERE id IN (303, 305, 403, 406)", "WHERE id = 303, 305, 403, 406", "WHERE id IS NULL"], a: 1, exp: "IN pour une liste précise de valeurs." },
      { type: "qcm", q: "Les clients dont l'id est compris entre 303 et 306 (bornes comprises) :", opts: ["WHERE id IN (303, 306)", "WHERE id BETWEEN 303 AND 306", "WHERE id > 303 AND id < 306", "WHERE id = 303 AND id = 306"], a: 1, exp: "BETWEEN est inclusif des deux bornes." },
      { type: "qcm", q: "Les pilotes dont la prime n'est pas renseignée :", opts: ["WHERE Prime = NULL", "WHERE Prime IS NULL", "WHERE Prime <> 0", "WHERE Prime = 0"], a: 1, exp: "IS NULL pour l'absence de valeur (différent de 0)." },
      { type: "vf", q: "WHERE nbHVol <> 500 inclut aussi les pilotes dont nbHVol est NULL.", a: false, exp: "Faux : la comparaison avec NULL vaut UNKNOWN, ces lignes sont exclues." },
      { type: "input", q: "Écris la clause WHERE pour les pilotes dont la prime EST renseignée. Commence par : WHERE Prime …", a: ["WHERE Prime IS NOT NULL", "Prime IS NOT NULL"], ph: "WHERE Prime IS NOT NULL", exp: "IS NOT NULL garde les lignes qui ont une valeur." }
    ],
    solution: `<pre class="pseudo">-- 1) Liste de valeurs
SELECT id, nom, telephone
FROM S_CLIENT
WHERE id IN (303, 305, 403, 406);

-- 2) Plage inclusive
SELECT id, nom, telephone
FROM S_CLIENT
WHERE id BETWEEN 303 AND 306;

-- 3) Valeur manquante
SELECT nom FROM Pilote WHERE Prime IS NULL;

-- 5) Valeur presente
SELECT nom FROM Pilote WHERE Prime IS NOT NULL;</pre>
<p>IN pour une liste, BETWEEN pour une plage (inclusive), IS NULL / IS NOT NULL pour l'absence de valeur. Demain : calculer avec les opérations arithmétiques et les fonctions numériques.</p>`
  }
};
