<script>
var DAY = {
  num: 26,
  title: "Gérer les doublons (DISTINCT, ON DUPLICATE KEY)",
  subtitle: "Éliminer les doublons à l'affichage, et gérer les conflits de clé à l'insertion.",
  theory: `
<h3>1. Deux problèmes de doublons</h3>
<p>Les doublons se posent à deux moments : <strong>à l'affichage</strong> d'une requête (des lignes répétées qu'on veut fusionner) et <strong>à l'insertion</strong> (une clé qui existe déjà et qu'on ne veut pas dupliquer). SQL offre une solution pour chacun : <code>DISTINCT</code> pour le premier, <code>ON DUPLICATE KEY UPDATE</code> pour le second.</p>

<h3>2. DISTINCT : supprimer les lignes en double à l'affichage</h3>
<p>Par défaut, un <code>SELECT</code> affiche <strong>toutes</strong> les lignes, doublons compris (c'est l'option implicite <code>ALL</code>). Le mot-clé <code>DISTINCT</code>, placé juste après <code>SELECT</code>, <strong>élimine les lignes en double</strong> du résultat : chaque combinaison de valeurs n'apparaît qu'une fois. C'est la mise en œuvre de l'opérateur de <em>projection</em> du modèle relationnel.</p>
<pre class="pseudo">-- Sans DISTINCT : autant de lignes 'Paris' qu'il y a de compagnies parisiennes
SELECT ville FROM Compagnie;

-- Avec DISTINCT : chaque ville n'apparait qu'une seule fois
SELECT DISTINCT ville FROM Compagnie;</pre>
<div class="tip">En MySQL, <code>DISTINCT</code> et <code>DISTINCTROW</code> sont équivalents. L'option par défaut, <code>ALL</code>, garde tous les doublons ; on ne l'écrit donc quasiment jamais.</div>

<h3>3. DISTINCT sur plusieurs colonnes</h3>
<p>Quand plusieurs colonnes suivent <code>DISTINCT</code>, c'est la <strong>combinaison</strong> des valeurs qui doit être unique. Deux lignes ne sont considérées comme doublons que si <strong>toutes</strong> les colonnes listées sont identiques.</p>
<pre class="pseudo">-- Chaque couple (ville, pays) distinct, meme si une ville revient dans plusieurs pays
SELECT DISTINCT ville, pays FROM S_CLIENT;</pre>

<h3>4. COUNT(DISTINCT …) : compter les valeurs différentes</h3>
<p>On peut combiner <code>DISTINCT</code> avec <code>COUNT</code> (revu au jour 20) pour compter le nombre de valeurs <strong>différentes</strong> d'une colonne.</p>
<pre class="pseudo">SELECT COUNT(DISTINCT ville) AS nb_villes_differentes
FROM Compagnie;</pre>

<h3>5. Le conflit de clé à l'insertion</h3>
<p>Passons au second problème. Quand un <code>INSERT</code> tente d'introduire une valeur en <strong>doublon</strong> sur une colonne unique (clé <code>PRIMARY KEY</code> ou contrainte <code>UNIQUE</code>), l'insertion est par défaut <strong>refusée</strong> avec une erreur : c'est logique, on protège l'unicité.</p>
<pre class="pseudo">CREATE TABLE sgbd (
   a INTEGER(4) PRIMARY KEY,   -- a est la cle primaire : unique
   b CHAR(6)
);
INSERT INTO sgbd (a, b) VALUES (1995, 'Oracle');
INSERT INTO sgbd (a, b) VALUES (1995, 'MySQL');  -- ERREUR : la cle 1995 existe deja</pre>

<h3>6. ON DUPLICATE KEY UPDATE : que faire en cas de doublon</h3>
<p>Souvent, on préfère que le doublon déclenche une <strong>mise à jour</strong> de la ligne existante plutôt qu'une erreur. La clause <code>ON DUPLICATE KEY UPDATE</code> le permet : si la nouvelle ligne provoque un conflit de clé, elle n'est <strong>pas insérée</strong> ; à la place, la ligne existante est <strong>modifiée</strong> selon les affectations indiquées.</p>
<pre class="pseudo">-- Reprenons l'exemple du support :
INSERT INTO sgbd (a, b) VALUES (1995, 'Oracle');
INSERT INTO sgbd (a, b) VALUES (1995, 'MySQL')
       ON DUPLICATE KEY UPDATE a = a + 15;   -- conflit sur 1995 -> on modifie la ligne existante</pre>
<pre class="pseudo">-- Resultat : la 2e insertion n'a PAS ajoute de ligne 'MySQL'.
-- La ligne existante (1995, 'Oracle') a vu sa colonne a passer a 1995 + 15 = 2010.
--   a    | b
--   2010 | Oracle</pre>
<div class="warn">Bien comprendre : la nouvelle ligne ('MySQL') n'entre jamais dans la table. C'est l'ANCIENNE ligne qui est mise à jour par la clause UPDATE. Ici a devient 1995 + 15 = 2010.</div>

<h3>7. Un usage typique : le « compteur »</h3>
<p><code>ON DUPLICATE KEY UPDATE</code> sert souvent à incrémenter un compteur : on tente d'insérer, et si la clé existe déjà, on augmente une quantité au lieu de créer une nouvelle ligne.</p>
<pre class="pseudo">-- Table stat_visites(page VARCHAR(50) PRIMARY KEY, nb INT)
INSERT INTO stat_visites (page, nb) VALUES ('accueil', 1)
       ON DUPLICATE KEY UPDATE nb = nb + 1;
-- 1re fois : cree ('accueil', 1). Fois suivantes : incremente nb de la ligne existante.</pre>`,
  exercises: [
    { type: "qcm", q: "Par défaut, un SELECT affiche…", opts: ["Uniquement les lignes distinctes", "Toutes les lignes, doublons compris (option ALL)", "La première ligne", "Aucune ligne"], a: 1, exp: "L'option implicite est ALL : tous les doublons sont affichés." },
    { type: "qcm", q: "DISTINCT sert à…", opts: ["Trier les lignes", "Éliminer les lignes en double du résultat", "Compter les lignes", "Créer une clé"], a: 1, exp: "DISTINCT supprime les doublons à l'affichage." },
    { type: "qcm", q: "SELECT DISTINCT ville FROM Compagnie retourne…", opts: ["Une ligne par compagnie", "Chaque ville une seule fois", "La ville la plus fréquente", "Le nombre de villes"], a: 1, exp: "Chaque valeur distincte de ville apparaît une fois." },
    { type: "qcm", q: "DISTINCT ville, pays considère comme doublon deux lignes…", opts: ["Ayant la même ville seulement", "Ayant le même pays seulement", "Dont ville ET pays sont identiques", "Toujours différentes"], a: 2, exp: "C'est la combinaison des colonnes qui doit être identique." },
    { type: "qcm", q: "En MySQL, DISTINCT et DISTINCTROW…", opts: ["Font des choses opposées", "Sont équivalents", "Ne marchent pas ensemble", "Trient les données"], a: 1, exp: "Les deux jouent le même rôle en MySQL." },
    { type: "qcm", q: "Un INSERT avec une clé primaire déjà existante, par défaut…", opts: ["Remplace la ligne", "Est refusé avec une erreur", "Ajoute quand même la ligne", "Vide la table"], a: 1, exp: "Le doublon de clé unique est refusé par défaut." },
    { type: "qcm", q: "ON DUPLICATE KEY UPDATE, en cas de conflit de clé…", opts: ["Insère quand même la nouvelle ligne", "Ne l'insère pas et modifie la ligne existante", "Supprime la table", "Ignore la clé primaire"], a: 1, exp: "La ligne en conflit n'est pas insérée ; l'ancienne est mise à jour." },
    { type: "qcm", q: "Après INSERT (1995,'MySQL') ON DUPLICATE KEY UPDATE a = a + 15 (la ligne 1995 existe déjà) :", opts: ["Une ligne 'MySQL' est ajoutée", "La ligne existante voit a passer à 2010", "Rien ne change", "Erreur bloquante"], a: 1, exp: "a = 1995 + 15 = 2010 ; aucune nouvelle ligne n'est créée." },
    { type: "vf", q: "ON DUPLICATE KEY UPDATE peut servir à incrémenter un compteur (nb = nb + 1).", a: true, exp: "C'est un usage classique : insérer ou incrémenter selon l'existence." },
    { type: "qcm", q: "COUNT(DISTINCT ville) retourne…", opts: ["Le nombre total de lignes", "Le nombre de villes différentes", "La ville la plus longue", "La somme des villes"], a: 1, exp: "COUNT(DISTINCT) compte les valeurs différentes." },
    { type: "vf", q: "DISTINCT modifie les données stockées dans la table.", a: false, exp: "Faux : DISTINCT n'agit qu'à l'affichage, il ne change rien dans la table." },
    { type: "input", q: "Quel mot-clé (un mot), placé après SELECT, supprime les doublons du résultat ?", a: "DISTINCT", ph: "un mot-clé SQL", exp: "DISTINCT élimine les lignes en double." },
    { type: "input", q: "Écris la requête donnant la liste des villes distinctes de la table Compagnie. Commence par SELECT ...", a: ["SELECT DISTINCT ville FROM Compagnie", "SELECT DISTINCT ville FROM Compagnie;"], ph: "SELECT DISTINCT ...", exp: "SELECT DISTINCT ville FROM Compagnie." },
    { type: "input", q: "Quelle clause (trois mots + UPDATE, soit 'ON DUPLICATE KEY ___') modifie la ligne existante en cas de conflit de clé ? Écris le mot manquant.", a: "UPDATE", ph: "un mot-clé SQL", exp: "ON DUPLICATE KEY UPDATE." },
    { type: "input", q: "Quelle fonction combinée à DISTINCT compte les valeurs différentes : ___(DISTINCT ville) ?", a: "COUNT", ph: "une fonction d'agrégation", exp: "COUNT(DISTINCT ville) compte les villes différentes." }
  ],
  final: {
    title: "Exercice final — Doublons à l'affichage et à l'insertion",
    intro: `<p>Base Sporting_goods et exemple du support. Table Compagnie(comp, ville, nomComp). Table sgbd(a INTEGER PRIMARY KEY, b CHAR(6)). Table stat_visites(page PRIMARY KEY, nb).</p>`,
    questions: [
      { type: "qcm", q: "Lister chaque ville de Compagnie une seule fois :", opts: ["SELECT ville FROM Compagnie", "SELECT DISTINCT ville FROM Compagnie", "SELECT COUNT(ville) FROM Compagnie", "SELECT ALL ville FROM Compagnie"], a: 1, exp: "DISTINCT élimine les villes répétées." },
      { type: "qcm", q: "Compter le nombre de villes différentes :", opts: ["COUNT(*)", "COUNT(DISTINCT ville)", "SUM(ville)", "DISTINCT COUNT(ville)"], a: 1, exp: "COUNT(DISTINCT ville) compte les valeurs distinctes." },
      { type: "qcm", q: "Un INSERT avec a = 1995 déjà présent, sans clause spéciale :", opts: ["Ajoute la ligne", "Est refusé (doublon de clé primaire)", "Met à jour la ligne", "Supprime la table"], a: 1, exp: "Par défaut, le doublon de clé est refusé." },
      { type: "qcm", q: "Pour incrémenter nb au lieu d'échouer si la page existe déjà :", opts: ["INSERT ... ON DUPLICATE KEY UPDATE nb = nb + 1", "INSERT ... DISTINCT", "UPDATE nb = nb", "DELETE puis INSERT"], a: 0, exp: "ON DUPLICATE KEY UPDATE incrémente la ligne existante." },
      { type: "vf", q: "Après un ON DUPLICATE KEY UPDATE, aucune nouvelle ligne n'est créée si la clé existait déjà.", a: true, exp: "La ligne existante est modifiée à la place." }
    ],
    solution: `<pre class="pseudo">-- 1) villes distinctes
SELECT DISTINCT ville FROM Compagnie;

-- 2) nombre de villes differentes
SELECT COUNT(DISTINCT ville) AS nb_villes FROM Compagnie;

-- 3) insertion avec gestion du doublon (exemple du support)
INSERT INTO sgbd (a, b) VALUES (1995, 'MySQL')
       ON DUPLICATE KEY UPDATE a = a + 15;
-- la ligne (1995, 'Oracle') devient (2010, 'Oracle')

-- 4) compteur de visites
INSERT INTO stat_visites (page, nb) VALUES ('accueil', 1)
       ON DUPLICATE KEY UPDATE nb = nb + 1;</pre>
<p>DISTINCT nettoie l'affichage, ON DUPLICATE KEY gère les conflits d'insertion. Demain : faire évoluer la structure d'une table avec ALTER TABLE.</p>`
  }
};
</script>
