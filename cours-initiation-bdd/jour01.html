<script>
var DAY = {
  num: 1,
  title: "Qu'est-ce qu'une base de données ?",
  subtitle: "Données, information, SGBD : le vocabulaire de départ.",
  theory: `
<h3>1. Une base de données, c'est quoi ?</h3>
<p>Une <strong>base de données</strong> (en anglais <em>database</em>, abrégée <strong>BD</strong>) est un ensemble structuré d'éléments d'information, souvent agencés sous forme de <strong>tables</strong>, dans lesquels les données sont organisées selon certains critères en vue de permettre leur exploitation pour répondre aux besoins d'une organisation.</p>
<p>Dit plus simplement : une base de données est un mécanisme qui permet de <strong>stocker</strong> des données de façon organisée et de les <strong>retrouver facilement</strong> suivant certains critères de recherche, à condition qu'elle soit bien organisée. Dans une base de données, on peut <strong>ajouter</strong>, <strong>modifier</strong> et <strong>supprimer</strong> des données.</p>
<div class="tip">Exemple du support : une institution scolaire peut exploiter une seule base de données pour gérer l'admission des étudiants, l'offre de cours, les inscriptions, les frais, les résultats et l'émission des bulletins de notes. Tout est rangé au même endroit.</div>
<pre class="pseudo">-- une base de données permet essentiellement de :
--   AJOUTER   une donnée   (nous verrons plus tard l'ordre INSERT)
--   RETROUVER une donnée   (nous verrons plus tard l'ordre SELECT)
--   MODIFIER  une donnée   (nous verrons plus tard l'ordre UPDATE)
--   SUPPRIMER une donnée   (nous verrons plus tard l'ordre DELETE)</pre>

<h3>2. Donnée et information : deux mots différents</h3>
<p>Une <strong>donnée</strong> (<em>data</em>) est la représentation d'un élément d'information (un chiffre, un fait) codé dans un format permettant son stockage et son traitement par ordinateur. La donnée relève de la <strong>syntaxe</strong> (comment c'est écrit).</p>
<p>Une <strong>information</strong> est une donnée, ou un ensemble de données, qui a été <strong>interprétée</strong>. L'information relève de la <strong>sémantique</strong> (ce que ça veut dire).</p>
<div class="tip">Exemple du support : à la caisse, le code-barre lu est une donnée (une suite de chiffres codée, le CUP). En additionnant toutes les ventes d'une chaîne de magasins, on obtient de l'<strong>information</strong> : quels produits se vendent le mieux. Les données sont la matière brute ; l'information en est le résultat interprété.</p>
<p>La vocation première d'une base de données est le <strong>stockage</strong> des données : elle assure leur <strong>persistance</strong> dans le temps (les données restent, même après l'extinction du programme).</p>

<h3>3. Le SGBD : le logiciel qui gère la base</h3>
<p>Un <strong>Système de Gestion de Bases de Données</strong> (<strong>SGBD</strong>, en anglais <em>Database Management System</em>) est un logiciel qui gère et contrôle l'accès à une base de données, en assurant une interface normalisée entre les applications et les bases de données. En clair : c'est le programme par lequel on parle à la base.</p>
<p>Il ne faut pas confondre la <strong>base de données</strong> (les données elles-mêmes) avec le <strong>SGBD</strong> (le logiciel qui les gère).</p>
<div class="tip">Exemples cités par le support : Oracle, IBM DB2, Microsoft SQL Server (grands SGBD commerciaux), Microsoft Access (SGBD bureautique) et, dans le monde du logiciel libre, le très populaire <strong>MySQL</strong> — c'est celui que nous utiliserons dans ce cours (avec sa variante MariaDB).</p>

<h3>4. Pourquoi utiliser une base de données ?</h3>
<p>Un bon SGBD apporte plusieurs garanties fondamentales. En voici quatre à retenir dès aujourd'hui :</p>
<p>Il évite la <strong>redondance</strong> : une même donnée (par exemple l'adresse d'un client) ne doit pas être dupliquée dans plusieurs fichiers. Sinon, lors d'une mise à jour, on risque des versions contradictoires (quelle adresse est la bonne ?).</p>
<p>Il permet le <strong>partage</strong> des données par plusieurs utilisateurs en même temps (accès concurrents), sans que leurs opérations simultanées ne créent d'incohérence. Le mécanisme qui bloque temporairement une donnée en cours de modification s'appelle un <strong>verrou</strong>.</p>
<p>Il fait respecter des <strong>contraintes d'intégrité</strong> : ce sont des règles, définies par le concepteur, que les données doivent toujours respecter (par exemple : un salaire ne peut pas être négatif). Le SGBD les applique automatiquement et refuse les valeurs interdites.</p>
<div class="warn">À retenir : la base de données = les données rangées ; le SGBD = le logiciel qui les gère ; une donnée = de la matière brute codée ; une information = une donnée interprétée qui a un sens.</div>`,
  exercises: [
    { type: "qcm", q: "Une base de données sert avant tout à…", opts: ["Dessiner des graphiques animés", "Stocker des données de façon organisée et les retrouver facilement", "Remplacer le système d'exploitation", "Accélérer la connexion Internet"], a: 1, exp: "C'est un mécanisme de stockage et de recherche organisés." },
    { type: "input", q: "Complète : le logiciel qui gère et contrôle l'accès à une base de données s'appelle un ______ (sigle de trois lettres).", a: ["SGBD"], ph: "un sigle", exp: "SGBD = Système de Gestion de Bases de Données." },
    { type: "qcm", q: "Quelle est la différence entre une donnée et une information ?", opts: ["Aucune, ce sont des synonymes", "Une donnée est une représentation codée ; une information est une donnée interprétée qui a un sens", "Une information est toujours un nombre", "Une donnée est forcément une image"], a: 1, exp: "Donnée = syntaxe (matière brute) ; information = sémantique (interprétation)." },
    { type: "vf", q: "Le SGBD et la base de données sont exactement la même chose.", a: false, exp: "La base = les données ; le SGBD = le logiciel qui les gère. Ce sont deux choses distinctes." },
    { type: "input", q: "Complète : dans ce cours, nous utiliserons le SGBD libre et populaire nommé ______ (et sa variante MariaDB).", a: ["MySQL", "mysql"], ph: "un nom de SGBD", exp: "MySQL / MariaDB est le SGBD retenu pour ce cours." },
    { type: "qcm", q: "Le fait qu'une même donnée soit dupliquée inutilement dans plusieurs fichiers s'appelle…", opts: ["La persistance", "La redondance", "La projection", "Le verrou"], a: 1, exp: "La redondance : elle crée un risque d'incohérence lors des mises à jour." },
    { type: "vf", q: "Une base de données permet d'ajouter, de modifier et de supprimer des données.", a: true, exp: "Ce sont trois opérations de base sur les données stockées." },
    { type: "input", q: "Complète : une ______ d'intégrité est une règle que les données de la base doivent toujours respecter (deux mots, le premier suffit).", a: ["contrainte", "contrainte d'integrite"], ph: "un mot", exp: "Une contrainte d'intégrité, appliquée automatiquement par le SGBD." },
    { type: "qcm", q: "Dans l'exemple du magasin, le code-barre scanné à la caisse est…", opts: ["Une information déjà interprétée", "Une donnée (une suite de chiffres codée)", "Un SGBD", "Une contrainte"], a: 1, exp: "Le code-barre est une donnée ; l'analyse des ventes produit de l'information." },
    { type: "input", q: "Complète : le fait qu'une base de données conserve les données dans le temps s'appelle la ______ des données.", a: ["persistance"], ph: "un mot", exp: "La persistance : les données survivent à l'arrêt des programmes." },
    { type: "qcm", q: "Lequel de ces logiciels est un SGBD cité dans le support ?", opts: ["Microsoft Word", "Photoshop", "Oracle", "Windows"], a: 2, exp: "Oracle est un SGBD, comme DB2, SQL Server, Access ou MySQL." },
    { type: "vf", q: "Le verrou est le mécanisme qui empêche deux utilisateurs de modifier dangereusement la même donnée en même temps.", a: true, exp: "Le verrou gère les accès concurrents pour éviter les incohérences." },
    { type: "input", q: "Complète : les données constituent la matière brute à partir de laquelle on produit de l'______.", a: ["information"], ph: "un mot", exp: "L'information est le produit interprété des données." },
    { type: "qcm", q: "Pourquoi éviter la redondance des données ?", opts: ["Pour consommer plus de mémoire", "Parce que la même donnée dupliquée risque de devenir incohérente lors des mises à jour", "Parce que c'est interdit par la loi", "Cela n'a aucune importance"], a: 1, exp: "Une donnée en double peut être mise à jour d'un côté et pas de l'autre." },
    { type: "input", q: "Complète : dans une base relationnelle, les données sont le plus souvent organisées sous forme de ______ (structures à lignes et colonnes).", a: ["tables", "table"], ph: "un mot", exp: "Les tables : nous les étudierons en détail dès le Jour 2." }
  ],
  final: {
    title: "Exercice final — Le vocabulaire de base",
    intro: `<p>Vérifie que tu distingues bien les quatre notions clés du jour : donnée, information, base de données et SGBD.</p>`,
    questions: [
      { type: "qcm", q: "« 22809 » écrit dans une colonne code_postal est plutôt…", opts: ["Une information", "Une donnée", "Un SGBD", "Un verrou"], a: 1, exp: "Une valeur codée = une donnée." },
      { type: "qcm", q: "« Les clients de la région Nord commandent surtout au printemps » est plutôt…", opts: ["Une donnée brute", "De l'information (résultat interprété)", "Une contrainte", "Une table"], a: 1, exp: "C'est une interprétation de données : de l'information." },
      { type: "vf", q: "MySQL est un exemple de SGBD.", a: true, exp: "MySQL / MariaDB : le SGBD utilisé dans ce cours." },
      { type: "input", q: "Complète : le rôle premier d'une base de données est le ______ des données (leur conservation dans le temps).", a: ["stockage"], ph: "un mot", exp: "Le stockage, qui assure la persistance." },
      { type: "qcm", q: "Une contrainte d'intégrité est…", opts: ["Un type de graphique", "Une règle que les données doivent respecter, appliquée par le SGBD", "Un nom de logiciel", "Une donnée dupliquée"], a: 1, exp: "Une règle de validité imposée automatiquement." }
    ],
    solution: `<pre class="pseudo">-- récapitulatif du vocabulaire du Jour 1 :
-- DONNEE        : représentation codée d'un fait      (ex : 22809)
-- INFORMATION   : une donnée INTERPRETEE, qui a un sens
-- BASE DE DONNEES (BD) : l'ensemble organisé des données (souvent des tables)
-- SGBD          : le LOGICIEL qui gère la base         (ex : MySQL)
-- CONTRAINTE d'integrite : une regle que les donnees doivent respecter
-- REDONDANCE    : meme donnee dupliquee (a eviter)
-- PERSISTANCE   : les donnees restent conservees dans le temps</pre>
<p>Tu maîtrises le vocabulaire de départ. Demain : le modèle relationnel (tables, lignes, colonnes).</p>`
  }
};
