var DAY = {
  num: 22,
  title: "Les jointures internes (INNER JOIN)",
  subtitle: "Relier deux tables par leurs clés pour croiser leurs données.",
  theory: `
<h3>1. Pourquoi joindre des tables ?</h3>
<p>Le modèle relationnel répartit l'information dans plusieurs tables (c'est la normalisation). Les pilotes sont dans une table, les compagnies dans une autre. Pour afficher le <em>nom de la compagnie</em> à côté du <em>nom du pilote</em>, il faut <strong>relier</strong> les deux tables : c'est la <strong>jointure</strong>. Une jointure met deux tables en relation sur la base d'une <strong>clause de jointure</strong> : la comparaison d'une colonne de l'une avec une colonne de l'autre. Le plus souvent, on compare une <strong>clé étrangère</strong> d'une table à la <strong>clé primaire</strong> de l'autre.</p>
<pre class="pseudo">-- Table Compagnie(comp, nomComp, ville)      comp = cle primaire
-- Table Pilote(brevet, nom, nbHVol, compa)   compa = cle etrangere vers Compagnie.comp
-- Le lien logique : Pilote.compa = Compagnie.comp</pre>

<h3>2. La jointure interne : ne garder que les correspondances</h3>
<p>La <strong>jointure interne</strong> (<em>inner join</em>) ne conserve que les lignes qui ont une <strong>correspondance dans les deux tables</strong>. Un pilote sans compagnie valide, ou une compagnie sans pilote, ne figure pas dans le résultat. La forme la plus courante est l'<strong>équijointure</strong> : la clause de jointure utilise l'opérateur d'égalité (<code>=</code>).</p>

<h3>3. Écriture SQL2 : JOIN … ON</h3>
<p>La syntaxe moderne (dite « SQL2 ») sépare clairement la jointure (dans <code>JOIN … ON</code>) des filtres (dans <code>WHERE</code>). Le mot <code>INNER</code> est facultatif : <code>JOIN</code> seul signifie déjà jointure interne.</p>
<pre class="pseudo">SELECT p.nom,          -- colonne de Pilote
       c.nomComp       -- colonne de Compagnie
FROM Pilote AS p
INNER JOIN Compagnie AS c              -- INNER est optionnel
   ON p.compa = c.comp;                -- clause de jointure : la cle etrangere = la cle primaire
-- Resultat : chaque pilote avec le nom de SA compagnie</pre>
<div class="tip">Les <strong>alias de table</strong> (ici <code>p</code> et <code>c</code>) raccourcissent l'écriture et sont OBLIGATOIRES quand des colonnes de deux tables portent le même nom, pour lever l'ambiguïté (ex. <code>p.nom</code>).</div>

<h3>4. Écriture « relationnelle » : les tables dans FROM, la jointure dans WHERE</h3>
<p>Une écriture plus ancienne liste les tables séparées par des virgules dans <code>FROM</code> et place la clause de jointure dans <code>WHERE</code>. Elle donne le même résultat, mais la syntaxe <code>JOIN … ON</code> est préférée car elle distingue nettement le lien entre tables et les conditions de filtrage.</p>
<pre class="pseudo">SELECT p.nom, c.nomComp
FROM Pilote p, Compagnie c        -- deux tables dans le FROM
WHERE p.compa = c.comp;           -- la clause de jointure va dans le WHERE</pre>
<div class="warn">Danger de l'écriture relationnelle : si tu oublies la condition de jointure dans le WHERE, tu obtiens un produit cartésien (chaque pilote associé à CHAQUE compagnie), soit une explosion de lignes sans aucun sens.</div>

<h3>5. Ajouter des conditions à une jointure</h3>
<p>Une fois les tables jointes, on filtre normalement avec <code>WHERE</code> : la jointure relie, le WHERE sélectionne. Par exemple, les pilotes d'Air France ayant plus de 500 heures de vol :</p>
<pre class="pseudo">SELECT p.nom, p.nbHVol
FROM Pilote p
JOIN Compagnie c ON p.compa = c.comp
WHERE c.nomComp = 'Air France'    -- condition sur la table Compagnie
  AND p.nbHVol &gt; 500;             -- condition sur la table Pilote</pre>

<h3>6. L'auto-jointure : une table reliée à elle-même</h3>
<p>Cas particulier de l'équijointure, l'<strong>auto-jointure</strong> relie une table à <strong>elle-même</strong>. On l'utilise quand une ligne référence une autre ligne de la même table : par exemple un pilote qui a un chef pilote (lui aussi pilote), ou un employé qui a un directeur (lui aussi employé). Il faut alors donner à la table deux alias différents pour distinguer les deux « exemplaires ».</p>
<pre class="pseudo">-- Table Pilote(brevet, nom, chefPil)  chefPil = brevet du chef (autre pilote)
SELECT p.nom      AS pilote,
       chef.nom   AS chef_pilote
FROM Pilote AS p
JOIN Pilote AS chef            -- la meme table, sous un autre alias
   ON p.chefPil = chef.brevet; -- le chef d'un pilote est un autre pilote</pre>
<pre class="pseudo">-- Base Sporting_goods : chaque employe et le nom de son directeur
SELECT e.nom AS employe, d.nom AS directeur
FROM S_EMP AS e
JOIN S_EMP AS d ON e.id_directeur = d.id;</pre>

<h3>7. Joindre plus de deux tables</h3>
<p>Pour relier trois tables, il faut <strong>deux</strong> clauses de jointure ; pour <em>n</em> tables, <em>n − 1</em> clauses. On enchaîne simplement les <code>JOIN … ON</code>.</p>
<pre class="pseudo">SELECT e.nom, d.nom AS departement, r.nom AS region
FROM S_EMP e
JOIN S_DEPT d ON e.id_dept   = d.id       -- 1re jointure : employe -> departement
JOIN S_REGION r ON d.id_region = r.id;    -- 2e jointure : departement -> region</pre>`,
  exercises: [
    { type: "qcm", q: "Une jointure sert à…", opts: ["Trier une table", "Relier plusieurs tables pour croiser leurs données", "Supprimer des doublons", "Créer une colonne calculée"], a: 1, exp: "La jointure met plusieurs tables en relation." },
    { type: "qcm", q: "La clause de jointure compare généralement…", opts: ["Deux colonnes de texte au hasard", "Une clé étrangère d'une table à la clé primaire de l'autre", "Deux agrégats", "Deux alias"], a: 1, exp: "Le lien logique relie clé étrangère et clé primaire." },
    { type: "qcm", q: "Une jointure interne (INNER JOIN) conserve…", opts: ["Toutes les lignes des deux tables", "Seulement les lignes ayant une correspondance dans les deux tables", "Seulement la première table", "Les lignes sans correspondance"], a: 1, exp: "L'inner join ne garde que les correspondances." },
    { type: "qcm", q: "Dans JOIN … ON, la condition ON exprime…", opts: ["Un tri", "La clause de jointure (le lien entre les tables)", "Un agrégat", "Une limite de lignes"], a: 1, exp: "ON porte la condition de jointure." },
    { type: "qcm", q: "Le mot-clé INNER devant JOIN est…", opts: ["Obligatoire", "Facultatif (jointure interne par défaut)", "Interdit en MySQL", "Réservé aux dates"], a: 1, exp: "JOIN seul suffit : la jointure est interne par défaut." },
    { type: "qcm", q: "Une équijointure utilise dans sa clause de jointure l'opérateur…", opts: ["> (supérieur)", "= (égalité)", "LIKE", "IN"], a: 1, exp: "L'équijointure compare par égalité (=)." },
    { type: "qcm", q: "Les alias de table (p, c) sont OBLIGATOIRES quand…", opts: ["La requête est courte", "Des colonnes de deux tables portent le même nom", "On utilise ORDER BY", "Jamais"], a: 1, exp: "Ils lèvent l'ambiguïté sur les colonnes homonymes." },
    { type: "qcm", q: "Une auto-jointure relie…", opts: ["Deux tables différentes", "Une table à elle-même", "Trois tables", "Une table à une vue"], a: 1, exp: "L'auto-jointure joint une table avec elle-même (deux alias)." },
    { type: "qcm", q: "Pour joindre 3 tables, il faut…", opts: ["1 clause de jointure", "2 clauses de jointure", "3 clauses de jointure", "Aucune"], a: 1, exp: "Pour n tables, n-1 clauses ; donc 2 pour 3 tables." },
    { type: "vf", q: "Oublier la condition de jointure produit un produit cartésien (chaque ligne associée à toutes les autres).", a: true, exp: "Sans condition, on obtient toutes les combinaisons possibles." },
    { type: "vf", q: "La jointure interne peut afficher des colonnes issues des deux tables jointes.", a: true, exp: "C'est justement l'intérêt : croiser les données des deux tables." },
    { type: "input", q: "Complète la syntaxe moderne : FROM Pilote p JOIN Compagnie c ___ p.compa = c.comp. (le mot-clé)", a: "ON", ph: "un mot-clé SQL", exp: "ON introduit la clause de jointure." },
    { type: "input", q: "Quel type de jointure (deux mots, en anglais) ne garde que les lignes ayant une correspondance des deux côtés ?", a: ["INNER JOIN", "inner join"], ph: "deux mots (anglais)", exp: "INNER JOIN : la jointure interne." },
    { type: "input", q: "Pour relier chaque employé à son directeur (même table S_EMP), quel type de jointure emploie-t-on ? (deux mots)", a: ["auto-jointure", "auto jointure", "autojointure", "self join"], ph: "deux mots", exp: "Une auto-jointure : la table reliée à elle-même." },
    { type: "input", q: "Écris la clause de jointure reliant Pilote.compa à Compagnie.comp. Commence par ON ...", a: ["ON p.compa = c.comp", "ON Pilote.compa = Compagnie.comp", "p.compa = c.comp"], ph: "ON ...", exp: "On égalise la clé étrangère (compa) et la clé primaire (comp)." }
  ],
  final: {
    title: "Exercice final — Employés, départements et directeurs",
    intro: `<p>Base Sporting_goods. Table S_EMP(id, nom, prenom, salaire, id_dept, id_directeur). Table S_DEPT(id, nom, id_region).</p>`,
    questions: [
      { type: "qcm", q: "Nom des employés et nom de leur département :", opts: ["SELECT e.nom, d.nom FROM S_EMP e, S_DEPT d", "SELECT e.nom, d.nom FROM S_EMP e JOIN S_DEPT d ON e.id_dept = d.id", "SELECT nom FROM S_EMP", "SELECT nom FROM S_DEPT"], a: 1, exp: "JOIN sur id_dept = id du département." },
      { type: "qcm", q: "Sur quoi porte la clause de jointure employé ↔ département ?", opts: ["e.nom = d.nom", "e.id_dept = d.id", "e.salaire = d.id", "e.id = d.id_region"], a: 1, exp: "La clé étrangère id_dept correspond à la clé primaire id de S_DEPT." },
      { type: "qcm", q: "Pour afficher chaque employé et le nom de son directeur (même table) :", opts: ["Une jointure entre S_EMP et S_DEPT", "Une auto-jointure de S_EMP avec elle-même", "Un GROUP BY", "Un simple SELECT"], a: 1, exp: "Auto-jointure : S_EMP e JOIN S_EMP d ON e.id_directeur = d.id." },
      { type: "qcm", q: "Les employés du département nommé 'Ventes' seulement :", opts: ["... JOIN S_DEPT d ON e.id_dept = d.id WHERE d.nom = 'Ventes'", "... WHERE e.nom = 'Ventes'", "... HAVING d.nom = 'Ventes'", "... GROUP BY d.nom"], a: 0, exp: "La jointure relie, le WHERE filtre sur le nom du département." },
      { type: "vf", q: "Relier employé → département → région demande deux clauses de jointure.", a: true, exp: "Trois tables : n-1 = 2 jointures." }
    ],
    solution: `<pre class="pseudo">-- 1) employe + son departement
SELECT e.nom, e.prenom, d.nom AS departement
FROM S_EMP e
JOIN S_DEPT d ON e.id_dept = d.id;

-- 2) auto-jointure : employe + son directeur
SELECT e.nom AS employe, dir.nom AS directeur
FROM S_EMP e
JOIN S_EMP dir ON e.id_directeur = dir.id;

-- 3) filtrer sur le departement 'Ventes'
SELECT e.nom, e.prenom
FROM S_EMP e
JOIN S_DEPT d ON e.id_dept = d.id
WHERE d.nom = 'Ventes';</pre>
<p>La jointure interne croise ce qui correspond des deux côtés. Demain : les jointures externes, qui gardent AUSSI les lignes sans correspondance.</p>`
  }
};
