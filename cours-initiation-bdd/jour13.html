<script>
var DAY = {
  num: 13,
  title: "Filtrer : la clause WHERE",
  subtitle: "Ne garder que les lignes qui remplissent une condition.",
  theory: `
<h3>1. La sélection : choisir les LIGNES</h3>
<p>Au Jour 12, la projection choisissait les <strong>colonnes</strong>. Aujourd'hui, la <strong>sélection</strong> choisit les <strong>lignes</strong> : elle produit une nouvelle table qui ne contient que les lignes satisfaisant une <strong>condition</strong>. En SQL, cela se fait avec la clause <strong>WHERE</strong>.</p>
<pre class="pseudo">SELECT colonnes
FROM   nomTable
WHERE  condition;                  -- ne garde que les lignes qui rendent la condition VRAIE</pre>
<div class="tip">Moyen mnémotechnique du support : on SÉLECTIONNE des colonnes DE (FROM) tables OÙ (WHERE) les lignes satisfont certaines conditions.</div>

<h3>2. Les opérateurs de comparaison</h3>
<p>Une condition compare une colonne à une valeur avec un <strong>opérateur de comparaison</strong> :</p>
<pre class="pseudo">-- =    egal a
-- <>   different de
-- <    inferieur a
-- <=   inferieur ou egal a
-- >    superieur a
-- >=   superieur ou egal a</pre>
<pre class="pseudo">SELECT nom, nbHVol
FROM   Pilote
WHERE  compa = 'AF';               -- uniquement les pilotes de la compagnie 'AF'</pre>

<h3>3. Comparer du texte et des nombres</h3>
<p>Comme pour l'insertion, le <strong>texte</strong> se compare entre apostrophes simples ; les <strong>nombres</strong>, sans apostrophes.</p>
<pre class="pseudo">SELECT nom FROM Pilote WHERE nom = 'Richard Grin';   -- texte : apostrophes simples

SELECT nom FROM Pilote WHERE nbHVol > 1000;          -- nombre : pas d'apostrophes

SELECT nom FROM Pilote WHERE compa <> 'AF';          -- toutes les compagnies SAUF 'AF'</pre>

<h3>4. Projeter et sélectionner en même temps</h3>
<p>On combine très souvent projection (SELECT) et sélection (WHERE) : choisir <em>quelles colonnes</em> ET <em>quelles lignes</em>.</p>
<pre class="pseudo">SELECT nom, nbHVol                 -- QUELLES colonnes (projection)
FROM   Pilote
WHERE  nbHVol >= 1000;             -- QUELLES lignes (selection) : au moins 1000 heures</pre>
<div class="warn">Ne pas confondre : la <strong>projection</strong> (liste après SELECT) choisit les colonnes ; la <strong>sélection</strong> (clause WHERE) choisit les lignes. Ce sont deux opérations complémentaires.</div>

<h3>5. Le cas particulier de NULL</h3>
<p>Une valeur NULL (inconnue) ne se teste PAS avec <code>=</code>. On ne peut pas écrire <code>WHERE nbHVol = NULL</code>. On utilise <strong>IS NULL</strong> ou <strong>IS NOT NULL</strong>.</p>
<pre class="pseudo">SELECT nom FROM Pilote WHERE nbHVol IS NULL;      -- pilotes dont les heures sont inconnues
SELECT nom FROM Pilote WHERE nbHVol IS NOT NULL;  -- pilotes dont les heures sont renseignees</pre>
<div class="tip">Retenir : NULL n'est égal à rien, pas même à lui-même. Pour le tester, on emploie toujours IS NULL / IS NOT NULL, jamais = ou <>.</div>`,
  exercises: [
    { type: "input", q: "Complète : la clause qui filtre les lignes selon une condition est ______.", a: ["where"], ph: "un mot-clé", exp: "WHERE condition." },
    { type: "qcm", q: "La clause WHERE agit sur…", opts: ["Les colonnes affichées", "Les lignes retenues", "Le nom de la table", "L'ordre du tri"], a: 1, exp: "WHERE sélectionne les lignes ; la projection (SELECT) choisit les colonnes." },
    { type: "input", q: "Complète : l'opérateur « différent de » s'écrit ______ (deux caractères).", a: ["<>"], ph: "un opérateur", exp: "<> signifie « différent de »." },
    { type: "qcm", q: "SELECT nom FROM Pilote WHERE nbHVol > 1000 renvoie…", opts: ["Tous les pilotes", "Les pilotes ayant strictement plus de 1000 heures", "Les pilotes ayant exactement 1000 heures", "Les colonnes de la table"], a: 1, exp: "> 1000 = strictement supérieur à 1000." },
    { type: "vf", q: "Dans une condition WHERE, le texte se compare entre apostrophes simples.", a: true, exp: "Vrai : WHERE compa = 'AF'. Les nombres, eux, sans apostrophes." },
    { type: "input", q: "Complète : pour tester une valeur inconnue, on écrit WHERE nbHVol IS ______ .", a: ["null"], ph: "un mot-clé", exp: "IS NULL teste une valeur NULL." },
    { type: "qcm", q: "Pourquoi WHERE nbHVol = NULL ne fonctionne pas ?", opts: ["NULL est un texte", "NULL n'est égal à rien : il faut IS NULL", "= n'existe pas en SQL", "Il faut écrire NULL en minuscules"], a: 1, exp: "NULL ne se teste jamais avec = ; on utilise IS NULL." },
    { type: "input", q: "Complète : l'opérateur « inférieur ou égal à » s'écrit ______ (deux caractères).", a: ["<="], ph: "un opérateur", exp: "<= signifie « inférieur ou égal à »." },
    { type: "qcm", q: "SELECT nom FROM Pilote WHERE compa <> 'AF' renvoie…", opts: ["Les pilotes de 'AF'", "Tous les pilotes SAUF ceux de 'AF'", "Aucun pilote", "Les compagnies"], a: 1, exp: "<> 'AF' = toutes les compagnies différentes de 'AF'." },
    { type: "vf", q: "On peut combiner projection (SELECT) et sélection (WHERE) dans une même requête.", a: true, exp: "Vrai : SELECT choisit les colonnes, WHERE choisit les lignes." },
    { type: "input", q: "Complète : SELECT nom FROM Pilote WHERE compa ______ 'AF' ; garde uniquement les pilotes de 'AF' (opérateur d'égalité).", a: ["=", "egal"], ph: "un opérateur", exp: "= teste l'égalité." },
    { type: "qcm", q: "Choisir les colonnes = la projection ; choisir les lignes = …", opts: ["Le tri", "La sélection", "La jointure", "La fusion"], a: 1, exp: "La sélection (WHERE) filtre les lignes." },
    { type: "input", q: "Complète : pour ne garder que les pilotes dont les heures sont RENSEIGNÉES, WHERE nbHVol IS NOT ______ .", a: ["null"], ph: "un mot-clé", exp: "IS NOT NULL = valeur connue / renseignée." },
    { type: "qcm", q: "WHERE nbHVol >= 1000 signifie…", opts: ["Heures strictement supérieures à 1000", "Heures supérieures OU égales à 1000", "Heures inférieures à 1000", "Heures égales à 0"], a: 1, exp: ">= inclut la valeur 1000 elle-même." },
    { type: "vf", q: "Les nombres dans une condition WHERE s'écrivent entre apostrophes.", a: false, exp: "Faux : les nombres s'écrivent sans apostrophes (nbHVol > 1000)." }
  ],
  final: {
    title: "Exercice final — Filtrer les pilotes",
    intro: `<p>Table <code>Pilote(brevet, nom, nbHVol, compa)</code>. Écris les conditions demandées.</p>`,
    questions: [
      { type: "qcm", q: "Les pilotes de la compagnie 'SING' :", opts: ["WHERE compa = SING", "WHERE compa = 'SING'", "WHERE 'SING'", "WHERE compa IS 'SING'"], a: 1, exp: "Texte entre apostrophes : compa = 'SING'." },
      { type: "qcm", q: "Les pilotes ayant au moins 1000 heures de vol :", opts: ["WHERE nbHVol > 1000", "WHERE nbHVol >= 1000", "WHERE nbHVol = 1000", "WHERE nbHVol <= 1000"], a: 1, exp: "« au moins » = supérieur ou égal : >=." },
      { type: "qcm", q: "Les pilotes qui ne sont PAS de 'AF' :", opts: ["WHERE compa = 'AF'", "WHERE compa <> 'AF'", "WHERE compa IS NULL", "WHERE NOT 'AF'"], a: 1, exp: "compa <> 'AF' exclut 'AF'." },
      { type: "input", q: "Complète : les pilotes dont le nombre d'heures est inconnu : WHERE nbHVol ______ NULL.", a: ["is"], ph: "un mot-clé", exp: "WHERE nbHVol IS NULL." },
      { type: "vf", q: "SELECT nom FROM Pilote WHERE nbHVol < 500 renvoie les pilotes ayant moins de 500 heures.", a: true, exp: "Vrai : < 500 = strictement inférieur à 500." }
    ],
    solution: `<pre class="pseudo">-- pilotes d'une compagnie donnee :
SELECT nom FROM Pilote WHERE compa = 'SING';

-- pilotes avec au moins 1000 heures :
SELECT nom, nbHVol FROM Pilote WHERE nbHVol >= 1000;

-- pilotes qui ne sont pas de 'AF' :
SELECT nom, compa FROM Pilote WHERE compa <> 'AF';

-- pilotes aux heures inconnues :
SELECT nom FROM Pilote WHERE nbHVol IS NULL;
-- Rappel : NULL se teste avec IS NULL / IS NOT NULL, jamais avec =.</pre>
<p>Tu sais filtrer les lignes. Demain : trier et limiter les résultats (ORDER BY, LIMIT).</p>`
  }
};
</script>
