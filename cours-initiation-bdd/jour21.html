<script>
var DAY = {
  num: 21,
  title: "Regrouper : GROUP BY et HAVING",
  subtitle: "Un agrégat PAR groupe, puis un filtre spécial sur les groupes.",
  theory: `
<h3>1. Un agrégat PAR groupe</h3>
<p>Hier, un agrégat résumait TOUTE la table en une seule valeur (le prix moyen de tous les articles). Mais on veut souvent un résumé <strong>par groupe</strong> : « le coût moyen PAR commande », « le nombre d'employés PAR département ». La clause <code>GROUP BY</code> (« regrouper par ») rassemble les lignes qui partagent la même valeur, puis calcule l'agrégat séparément dans chaque paquet. Imagine que tu tries des fiches en tas selon leur commande, puis que tu calcules la moyenne de chaque tas.</p>
<pre class="pseudo">-- Table S_ARTICLE(id_produit, id_commande, prix, quantite)
SELECT id_commande,                     -- pour chaque groupe : le numero de commande
       AVG(prix * quantite) AS cout_moyen   -- et le cout total moyen de cette commande
FROM S_ARTICLE
GROUP BY id_commande;                    -- fais un tas par valeur d'id_commande
-- Resultat : une ligne par commande, avec son cout moyen</pre>

<h3>2. La règle d'or du GROUP BY</h3>
<p>Règle à ne jamais oublier : dans un <code>SELECT</code> avec <code>GROUP BY</code>, chaque colonne affichée doit être <strong>soit</strong> une colonne citée dans le <code>GROUP BY</code>, <strong>soit</strong> placée à l'intérieur d'une fonction d'agrégation. Une colonne « libre » n'aurait aucun sens : un groupe contient plusieurs produits, lequel afficher ?</p>
<pre class="pseudo">-- BON : id_commande est dans le GROUP BY, COUNT(*) est un agregat
SELECT id_commande, COUNT(*) FROM S_ARTICLE GROUP BY id_commande;

-- FAUX : id_produit n'est ni groupe ni agrege (un groupe a plusieurs produits -> ambigu)
SELECT id_commande, id_produit, COUNT(*) FROM S_ARTICLE GROUP BY id_commande;</pre>

<h3>3. Plusieurs agrégats par groupe</h3>
<p>Rien n'empêche de calculer plusieurs agrégats à la fois pour chaque groupe : le SGBD les évalue tous, tas par tas.</p>
<pre class="pseudo">SELECT id_commande,                        -- la commande (colonne du GROUP BY)
       COUNT(*)             AS nb_articles, -- combien d'articles dans cette commande
       AVG(prix)            AS prix_moyen,  -- prix moyen de la commande
       MAX(prix * quantite) AS ligne_la_plus_chere
FROM S_ARTICLE
GROUP BY id_commande;                       -- un tas par commande</pre>

<h3>4. HAVING : filtrer les GROUPES</h3>
<p>Une fois les groupes formés et agrégés, on veut parfois n'en garder que certains : « les commandes dont la valeur moyenne dépasse 2000 € ». Comme le critère porte sur un agrégat (AVG), on ne peut pas utiliser <code>WHERE</code>. On utilise <code>HAVING</code> (« ayant »), le filtre spécial des groupes, qui agit APRÈS l'agrégation.</p>
<pre class="pseudo">SELECT id_commande, AVG(prix * quantite) AS valeur_moyenne
FROM S_ARTICLE
GROUP BY id_commande
HAVING AVG(prix * quantite) &gt; 2000;   -- ne garde que les commandes dont la moyenne depasse 2000</pre>
<div class="tip">Rappel du support : WHERE limite les lignes affichées en examinant des valeurs individuelles ; HAVING limite les groupes affichés en examinant des valeurs de fonctions de groupe.</div>

<h3>5. WHERE et HAVING ne jouent pas le même rôle</h3>
<p><code>WHERE</code> ne peut PAS utiliser d'agrégat (COUNT, SUM…), car il agit AVANT le regroupement : à ce moment, les groupes n'existent pas encore. C'est le rôle de <code>HAVING</code>. On peut combiner les deux : <code>WHERE</code> filtre d'abord les lignes, puis <code>HAVING</code> filtre les groupes.</p>
<pre class="pseudo">-- Nombre de produits par commande, mais en ne comptant que les lignes
-- dont le total depasse 1000, puis en ne gardant que les commandes ainsi obtenues.
SELECT id_commande, COUNT(*) AS nb_gros_articles
FROM S_ARTICLE
WHERE prix * quantite &gt; 1000     -- 1) filtre les LIGNES (valeurs individuelles)
GROUP BY id_commande             -- 2) forme les groupes
HAVING COUNT(*) &gt;= 2;            -- 3) filtre les GROUPES (sur l'agregat)</pre>

<h3>6. L'ordre logique complet</h3>
<p>Voici enfin l'ordre COMPLET dans lequel le SGBD exécute une requête (ce n'est pas l'ordre d'écriture) :</p>
<pre class="pseudo">FROM       -- 1) quelle table ?
WHERE      -- 2) filtrer les LIGNES (avant tout regroupement)
GROUP BY   -- 3) former les groupes (les tas)
HAVING     -- 4) filtrer les GROUPES (sur les agregats)
SELECT     -- 5) choisir les colonnes + agregats a afficher
ORDER BY   -- 6) trier le resultat final</pre>
<pre class="pseudo">-- Exemple complet : effectif par departement, seulement ceux de plus d'un employe,
-- tries du plus grand effectif au plus petit.
SELECT id_departement, COUNT(*) AS effectif   -- 5) affiche departement + effectif
FROM S_EMP                                     -- 1) depuis S_EMP
WHERE salaire &gt; 0                              -- 2) filtre les lignes
GROUP BY id_departement                        -- 3) regroupe par departement
HAVING COUNT(*) &gt; 1                            -- 4) ne garde que les groupes de plusieurs employes
ORDER BY effectif DESC;                         -- 6) trie par effectif decroissant</pre>`,
  exercises: [
    { type: "qcm", q: "GROUP BY sert à…", opts: ["Trier le résultat", "Former des groupes et calculer un agrégat par groupe", "Filtrer une ligne", "Créer une table"], a: 1, exp: "GROUP BY calcule un agrégat séparément dans chaque groupe." },
    { type: "qcm", q: "« Coût moyen par commande » s'écrit avec…", opts: ["ORDER BY id_commande", "GROUP BY id_commande + AVG(...)", "WHERE id_commande", "DISTINCT"], a: 1, exp: "Regroupement par commande + moyenne dans chaque groupe." },
    { type: "qcm", q: "Avec GROUP BY, une colonne affichée doit être…", opts: ["N'importe laquelle", "Groupée OU dans un agrégat", "Toujours la clé primaire", "Un alias"], a: 1, exp: "La règle d'or : colonne du GROUP BY ou agrégat." },
    { type: "qcm", q: "SELECT id_commande, id_produit, COUNT(*) ... GROUP BY id_commande est…", opts: ["Correct", "Incohérent : id_produit n'est ni groupé ni agrégé", "Un tri", "Une jointure"], a: 1, exp: "id_produit viole la règle d'or." },
    { type: "qcm", q: "HAVING filtre…", opts: ["Les lignes avant regroupement", "Les groupes après agrégation", "Les colonnes", "Les tables"], a: 1, exp: "HAVING filtre les groupes, après l'agrégation." },
    { type: "qcm", q: "WHERE filtre…", opts: ["Les groupes", "Les lignes avant le regroupement", "Les agrégats", "Les index"], a: 1, exp: "WHERE examine des valeurs individuelles, avant le GROUP BY." },
    { type: "qcm", q: "« Commandes dont la valeur moyenne dépasse 2000 » :", opts: ["WHERE AVG(...) > 2000", "GROUP BY id_commande HAVING AVG(...) > 2000", "ORDER BY AVG(...)", "DISTINCT"], a: 1, exp: "HAVING sur l'agrégat AVG." },
    { type: "qcm", q: "Peut-on écrire WHERE COUNT(*) > 2 ?", opts: ["Oui", "Non : WHERE agit avant l'agrégation, il faut HAVING", "Seulement en MySQL", "Oui avec un index"], a: 1, exp: "Les agrégats vont dans HAVING, pas dans WHERE." },
    { type: "qcm", q: "Dans l'ordre logique, GROUP BY vient…", opts: ["Avant WHERE", "Après WHERE, avant HAVING", "Après ORDER BY", "En premier"], a: 1, exp: "FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY." },
    { type: "qcm", q: "On peut combiner WHERE et HAVING ?", opts: ["Non", "Oui : WHERE sur les lignes, HAVING sur les groupes", "Seulement l'un des deux", "Jamais avec GROUP BY"], a: 1, exp: "Les deux filtres coexistent, chacun à son étape." },
    { type: "vf", q: "GROUP BY produit une ligne de résultat par groupe distinct.", a: true, exp: "Un résultat par valeur groupée." },
    { type: "vf", q: "HAVING peut utiliser une fonction d'agrégation, ex. HAVING SUM(...) > 100.", a: true, exp: "C'est justement son rôle : filtrer sur un agrégat." },
    { type: "input", q: "Quelle clause (deux mots) forme les groupes : ___ id_departement ?", a: ["GROUP BY", "group by"], ph: "deux mots-clés", exp: "GROUP BY forme les groupes." },
    { type: "input", q: "Quelle clause (un mot) filtre les groupes sur un agrégat, ex. ___ COUNT(*) > 1 ?", a: "HAVING", ph: "un mot-clé SQL", exp: "HAVING filtre les groupes après agrégation." },
    { type: "input", q: "Écris la clause qui ne garde que les groupes de plus d'un employé (effectif). Commence par HAVING ...", a: ["HAVING COUNT(*) > 1", "HAVING COUNT(*) >= 2"], ph: "HAVING COUNT(*) ...", exp: "HAVING COUNT(*) > 1 garde les groupes de plusieurs employés." }
  ],
  final: {
    title: "Exercice final — Analyse par commande et par département",
    intro: `<p>Base Sporting_goods. Table S_ARTICLE(id_produit, id_commande, prix, quantite). Table S_EMP(id, nom, titre, salaire, id_departement).</p>`,
    questions: [
      { type: "qcm", q: "Nombre d'articles par commande :", opts: ["SELECT COUNT(*) FROM S_ARTICLE", "SELECT id_commande, COUNT(*) FROM S_ARTICLE GROUP BY id_commande", "SELECT DISTINCT id_commande", "ORDER BY id_commande"], a: 1, exp: "GROUP BY id_commande + COUNT(*)." },
      { type: "qcm", q: "Coût total moyen par commande :", opts: ["SELECT AVG(prix*quantite) FROM S_ARTICLE", "SELECT id_commande, AVG(prix*quantite) FROM S_ARTICLE GROUP BY id_commande", "SELECT MAX(prix)", "HAVING AVG(prix)"], a: 1, exp: "Un AVG par groupe de commande." },
      { type: "qcm", q: "Seulement les commandes dont la valeur moyenne dépasse 2000 :", opts: ["WHERE AVG(prix*quantite) > 2000", "... GROUP BY id_commande HAVING AVG(prix*quantite) > 2000", "ORDER BY AVG", "DISTINCT"], a: 1, exp: "HAVING sur l'agrégat AVG." },
      { type: "qcm", q: "Salaire moyen par département, seulement les départements de plus d'un employé :", opts: ["GROUP BY id_departement HAVING COUNT(*) > 1", "WHERE COUNT(*) > 1", "ORDER BY COUNT(*)", "DISTINCT id_departement"], a: 0, exp: "GROUP BY puis HAVING COUNT(*) > 1." },
      { type: "vf", q: "On peut trier le résultat groupé avec ORDER BY, en dernier.", a: true, exp: "ORDER BY s'applique après le regroupement." }
    ],
    solution: `<pre class="pseudo">-- Salaire moyen par departement, seulement les departements de plusieurs employes,
-- tries du salaire moyen le plus eleve au plus bas.
SELECT id_departement,
       COUNT(*)     AS effectif,     -- nombre d'employes du groupe
       AVG(salaire) AS salaire_moyen -- salaire moyen du groupe
FROM S_EMP
WHERE salaire &gt; 0          -- 1) filtre les LIGNES
GROUP BY id_departement     -- 2) forme les groupes (par departement)
HAVING COUNT(*) &gt; 1        -- 3) filtre les GROUPES (plus d'un employe)
ORDER BY salaire_moyen DESC;-- 4) trie le resultat</pre>
<p>WHERE (lignes) → GROUP BY (regrouper) → HAVING (filtrer les groupes) → ORDER BY (trier). Demain : relier plusieurs tables avec les jointures internes.</p>`
  }
};
</script>

  ]
};
