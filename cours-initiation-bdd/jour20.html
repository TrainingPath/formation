<script>
var DAY = {
  num: 20,
  title: "Les fonctions d'agrégation (COUNT, SUM, AVG...)",
  subtitle: "Résumer plusieurs lignes en une seule valeur : compter, additionner, moyenner.",
  theory: `
<h3>1. Résumer plusieurs lignes en une seule valeur</h3>
<p>Les fonctions d'hier agissaient <strong>ligne par ligne</strong>. Les <strong>fonctions d'agrégation</strong> (appelées aussi <strong>fonctions de groupe</strong>) font le contraire : elles examinent <strong>plusieurs lignes en même temps</strong> pour produire un seul résultat. Sur la table des employés, on ne peut pas trouver « le salaire moyen » ou « le nombre de représentants » ligne par ligne : il faut regarder l'ensemble des lignes. C'est le rôle des cinq fonctions ci-dessous.</p>
<pre class="pseudo">-- Les cinq fonctions d'agregation essentielles :
--   COUNT(...)  compte le nombre de lignes / de valeurs
--   SUM(n)      somme des valeurs de la colonne n
--   AVG(n)      moyenne des valeurs de la colonne n
--   MAX(n)      valeur maximale
--   MIN(n)      valeur minimale</pre>

<h3>2. SUM et AVG : somme et moyenne</h3>
<p><code>SUM(n)</code> additionne toutes les valeurs de la colonne <code>n</code> ; <code>AVG(n)</code> en calcule la moyenne. Ces deux fonctions ne s'appliquent qu'à des colonnes numériques et <strong>ignorent les valeurs NULL</strong> (les lignes sans valeur ne comptent pas dans le calcul).</p>
<pre class="pseudo">-- Table S_ARTICLE(id_produit, id_commande, prix, quantite)
SELECT SUM(quantite) AS total_articles,   -- somme des quantites commandees
       AVG(prix)     AS prix_moyen        -- prix moyen des articles
FROM S_ARTICLE;</pre>
<div class="tip">On peut restreindre l'agrégat à un sous-ensemble avec WHERE : le calcul ne portera que sur les lignes retenues. Ex. le prix moyen des articles de la commande 100.</div>
<pre class="pseudo">SELECT SUM(quantite) AS total, AVG(prix) AS prix_moyen
FROM S_ARTICLE
WHERE id_commande = 100;   -- calcul limite a la commande 100</pre>

<h3>3. MAX et MIN : le plus grand et le plus petit</h3>
<p><code>MAX(n)</code> retourne la valeur maximale et <code>MIN(n)</code> la valeur minimale d'une colonne. Elles fonctionnent avec n'importe quel type de données (nombres, texte, dates) et ignorent aussi les valeurs NULL.</p>
<pre class="pseudo">SELECT MAX(prix) AS prix_le_plus_eleve,
       MIN(prix) AS prix_le_plus_bas
FROM S_ARTICLE;</pre>

<h3>4. COUNT(*) : compter les lignes</h3>
<p><code>COUNT(*)</code> est la seule fonction qui prend une étoile en argument. Elle compte <strong>toutes les lignes</strong> retournées par la requête, y compris les doublons, sans se soucier des valeurs NULL (elle compte des lignes, pas des valeurs).</p>
<pre class="pseudo">SELECT COUNT(*) AS nb_lignes
FROM S_ARTICLE;                 -- nombre total de lignes de la table

SELECT COUNT(*) AS nb_commande_100
FROM S_ARTICLE
WHERE id_commande = 100;        -- nombre de lignes pour la commande 100</pre>

<h3>5. COUNT(colonne) : compter les valeurs connues</h3>
<p><code>COUNT(n)</code> compte le nombre de <strong>valeurs connues</strong> dans la colonne <code>n</code> : elle <strong>ignore les NULL</strong>. C'est la grande différence avec <code>COUNT(*)</code>. Si une colonne contient des valeurs manquantes, <code>COUNT(colonne)</code> sera inférieur à <code>COUNT(*)</code>.</p>
<pre class="pseudo">-- Si la table a 10 lignes mais 2 ont un id_directeur NULL :
SELECT COUNT(*)           AS nb_lignes,       -- 10 (toutes les lignes)
       COUNT(id_directeur) AS nb_directeurs   -- 8  (les NULL ne comptent pas)
FROM S_EMP;</pre>

<h3>6. COUNT(DISTINCT n) : compter les valeurs différentes</h3>
<p>Le mot-clé <code>DISTINCT</code> placé dans <code>COUNT</code> compte le nombre de valeurs <strong>distinctes</strong> (différentes) de la colonne : les doublons sont retirés avant de compter. Par défaut (mot-clé <code>ALL</code>, sous-entendu) toutes les lignes sont examinées ; avec <code>DISTINCT</code>, chaque valeur n'est comptée qu'une fois.</p>
<pre class="pseudo">-- Combien de departements DIFFERENTS apparaissent dans la table ?
SELECT COUNT(DISTINCT id_departement) AS nb_departements
FROM S_EMP;
-- Si les employes se repartissent sur 3 departements, le resultat est 3,
-- meme s'il y a 50 employes.</pre>

<h3>7. Combiner calcul et agrégat</h3>
<p>On peut placer une expression arithmétique <strong>à l'intérieur</strong> d'une fonction d'agrégation. Par exemple, pour le coût total d'un article on calcule <code>prix * quantite</code> ligne par ligne, puis on applique <code>AVG</code> ou <code>MAX</code> sur ce résultat.</p>
<pre class="pseudo">-- Cout total moyen des articles de la commande 100
SELECT AVG(prix * quantite) AS cout_moyen
FROM S_ARTICLE
WHERE id_commande = 100;

-- Ecart entre le cout le plus eleve et le plus bas de la commande 100
SELECT MAX(prix * quantite) - MIN(prix * quantite) AS ecart
FROM S_ARTICLE
WHERE id_commande = 100;</pre>
<div class="warn">Un agrégat résume TOUTE la sélection en une seule ligne. Tant qu'il n'y a pas de GROUP BY (demain), tu ne peux pas afficher en même temps une colonne « normale » et un agrégat : lequel des 50 noms afficher à côté d'un seul AVG ?</div>`,
  exercises: [
    { type: "qcm", q: "Une fonction d'agrégation…", opts: ["Agit ligne par ligne", "Résume plusieurs lignes en une seule valeur", "Trie les lignes", "Crée une colonne permanente"], a: 1, exp: "Les agrégats examinent plusieurs lignes pour produire un seul résultat." },
    { type: "qcm", q: "Quelle fonction calcule la moyenne d'une colonne ?", opts: ["SUM", "AVG", "COUNT", "MAX"], a: 1, exp: "AVG(n) retourne la moyenne des valeurs." },
    { type: "qcm", q: "SUM et AVG…", opts: ["Comptent les NULL comme des zéros", "Ignorent les valeurs NULL", "Ne marchent que sur du texte", "Trient les lignes"], a: 1, exp: "SUM et AVG ignorent les valeurs NULL dans le calcul." },
    { type: "qcm", q: "COUNT(*) compte…", opts: ["Les valeurs non NULL d'une colonne", "Toutes les lignes, doublons compris", "Les valeurs distinctes", "Les colonnes"], a: 1, exp: "COUNT(*) compte toutes les lignes retournées." },
    { type: "qcm", q: "COUNT(id_directeur) sur une colonne contenant des NULL…", opts: ["Compte aussi les NULL", "Ignore les NULL (valeurs connues seulement)", "Renvoie une erreur", "Renvoie toujours 0"], a: 1, exp: "COUNT(colonne) ne compte que les valeurs connues (non NULL)." },
    { type: "qcm", q: "COUNT(DISTINCT id_departement) retourne…", opts: ["Le nombre total de lignes", "Le nombre de départements différents", "La somme des id", "Le plus grand id"], a: 1, exp: "DISTINCT retire les doublons avant de compter." },
    { type: "qcm", q: "MAX et MIN fonctionnent…", opts: ["Uniquement sur des nombres", "Sur nombres, texte et dates", "Uniquement sur du texte", "Uniquement avec DISTINCT"], a: 1, exp: "MAX/MIN acceptent n'importe quel type de données." },
    { type: "qcm", q: "Pour limiter un agrégat aux articles de la commande 100, on ajoute…", opts: ["HAVING id_commande = 100", "WHERE id_commande = 100", "GROUP BY id_commande", "ORDER BY id_commande"], a: 1, exp: "WHERE filtre les lignes avant l'agrégation." },
    { type: "vf", q: "Sur une table de 10 lignes dont 2 NULL en id_directeur, COUNT(*) vaut 10 et COUNT(id_directeur) vaut 8.", a: true, exp: "COUNT(*) compte les lignes, COUNT(colonne) ignore les NULL." },
    { type: "qcm", q: "AVG(prix * quantite) calcule…", opts: ["La moyenne du prix seul", "La moyenne du produit prix×quantité, ligne par ligne", "La somme des prix", "Le plus grand prix"], a: 1, exp: "On calcule prix*quantite ligne par ligne, puis AVG en fait la moyenne." },
    { type: "vf", q: "COUNT(*) ignore les lignes contenant une valeur NULL.", a: false, exp: "Faux : COUNT(*) compte toutes les lignes, y compris celles avec des NULL." },
    { type: "input", q: "Quelle fonction (un mot) additionne toutes les valeurs d'une colonne ?", a: "SUM", ph: "un nom de fonction", exp: "SUM(n) retourne la somme des valeurs." },
    { type: "input", q: "Quelle fonction (un mot) donne la valeur la plus élevée d'une colonne ?", a: "MAX", ph: "un nom de fonction", exp: "MAX(n) retourne la valeur maximale." },
    { type: "input", q: "Écris la requête qui compte le nombre total de lignes de la table S_ARTICLE. Commence par SELECT ...", a: ["SELECT COUNT(*) FROM S_ARTICLE", "SELECT COUNT(*) FROM S_ARTICLE;"], ph: "SELECT COUNT(*) ...", exp: "COUNT(*) compte toutes les lignes de la table." },
    { type: "input", q: "Quel mot-clé, placé dans COUNT, retire les doublons avant de compter : COUNT(___ id_departement) ?", a: "DISTINCT", ph: "un mot-clé SQL", exp: "COUNT(DISTINCT n) compte les valeurs différentes." }
  ],
  final: {
    title: "Exercice final — Statistiques sur les commandes et les salaires",
    intro: `<p>Base Sporting_goods. Table S_ARTICLE(id_produit, id_commande, prix, quantite). Table S_EMP(id, nom, titre, salaire, id_departement, id_directeur).</p>`,
    questions: [
      { type: "qcm", q: "Somme des quantités commandées et prix moyen :", opts: ["SELECT COUNT(quantite), MAX(prix)", "SELECT SUM(quantite), AVG(prix) FROM S_ARTICLE", "SELECT DISTINCT prix", "SELECT MIN(prix), MAX(prix)"], a: 1, exp: "SUM pour la somme, AVG pour la moyenne." },
      { type: "qcm", q: "Prix maximum et minimum des articles :", opts: ["SELECT SUM(prix), AVG(prix)", "SELECT MAX(prix), MIN(prix) FROM S_ARTICLE", "SELECT COUNT(*)", "SELECT DISTINCT prix"], a: 1, exp: "MAX et MIN donnent les extrêmes." },
      { type: "qcm", q: "Nombre de départements différents représentés dans S_EMP :", opts: ["COUNT(*)", "COUNT(DISTINCT id_departement)", "SUM(id_departement)", "MAX(id_departement)"], a: 1, exp: "COUNT(DISTINCT ...) compte les valeurs différentes." },
      { type: "qcm", q: "Comparer le nombre de lignes au nombre de directeurs connus (id_directeur non NULL) :", opts: ["COUNT(*) et COUNT(id_directeur)", "SUM(*) et SUM(id_directeur)", "AVG et MAX", "DISTINCT seul"], a: 0, exp: "COUNT(*) compte les lignes, COUNT(id_directeur) ignore les NULL." },
      { type: "vf", q: "AVG(prix * quantite) donne le coût total moyen d'un article.", a: true, exp: "On calcule le coût par ligne, puis AVG en fait la moyenne." }
    ],
    solution: `<pre class="pseudo">-- 1) somme et moyenne
SELECT SUM(quantite) AS total, AVG(prix) AS prix_moyen
FROM S_ARTICLE;

-- 2) extremes
SELECT MAX(prix) AS prix_max, MIN(prix) AS prix_min
FROM S_ARTICLE;

-- 3) departements distincts
SELECT COUNT(DISTINCT id_departement) AS nb_departements
FROM S_EMP;

-- 4) lignes vs directeurs connus
SELECT COUNT(*) AS nb_lignes, COUNT(id_directeur) AS nb_directeurs
FROM S_EMP;</pre>
<p>Tu sais résumer une table entière. Demain : calculer ces agrégats PAR groupe avec GROUP BY et HAVING.</p>`
  }
};
</script>

    statement: "Base Sporting_goods, table S_ARTICLE(id_produit, id_commande, prix, quantite). Écris une requête qui affiche, pour la seule commande numéro 100 : le nombre de lignes d'articles, la somme des quantités, le coût total moyen d'un article (prix × quantité), ainsi que l'écart entre le coût total le plus élevé et le plus bas. Nomme clairement les colonnes.",
