<script>
var DAY = {
  num: 19,
  title: "Les fonctions de chaîne et de date",
  subtitle: "Manipuler du texte et des dates ligne par ligne avec les fonctions intégrées de MySQL.",
  theory: `
<h3>1. Des fonctions pour le texte et les dates</h3>
<p>Hier, tu as vu les fonctions numériques (ABS, ROUND…). MySQL fournit de la même manière des fonctions pour manipuler les <strong>chaînes de caractères</strong> (le texte) et les <strong>dates</strong>. Comme les fonctions numériques, elles agissent <strong>ligne par ligne</strong> : une valeur en entrée, une valeur en sortie, pour chaque enregistrement. On les utilise dans le <code>SELECT</code> (pour transformer l'affichage) ou dans le <code>WHERE</code> (pour filtrer).</p>

<h3>2. Assembler du texte : CONCAT</h3>
<p><code>CONCAT(a, b, …)</code> colle bout à bout plusieurs chaînes. Pratique pour construire un nom complet à partir du prénom et du nom.</p>
<pre class="pseudo">-- Table S_EMP(id, prenom, nom, titre)
SELECT CONCAT(prenom, ' ', nom) AS nom_complet   -- prenom + espace + nom
FROM S_EMP;
-- 'Marie' , ' ' , 'Dupont'  ->  'Marie Dupont'</pre>
<div class="tip">Le second argument <code>' '</code> est une simple chaîne contenant un espace, pour séparer le prénom du nom. Sans lui, on obtiendrait 'MarieDupont'.</div>

<h3>3. Longueur, majuscules, minuscules</h3>
<p><code>CHAR_LENGTH(s)</code> retourne le nombre de <strong>caractères</strong> d'une chaîne. Attention : <code>LENGTH(s)</code> compte les <strong>octets</strong>, pas les caractères — en UTF-8, une lettre accentuée comme « é » vaut 2 octets, donc <code>LENGTH('été')</code> = 5 alors que <code>CHAR_LENGTH('été')</code> = 3. Pour compter des caractères (accents inclus), utilise donc <code>CHAR_LENGTH</code>. <code>UPPER(s)</code> passe tout en MAJUSCULES, <code>LOWER(s)</code> en minuscules.</p>
<pre class="pseudo">SELECT nom,
       CHAR_LENGTH(nom) AS longueur,   -- nombre de caracteres du nom
       UPPER(nom)       AS en_majuscules,
       LOWER(nom)       AS en_minuscules
FROM S_EMP;</pre>

<h3>4. Extraire une partie : SUBSTRING, LEFT, RIGHT</h3>
<p><code>SUBSTRING(s, debut, longueur)</code> extrait une portion de la chaîne à partir de la position <code>debut</code> (le premier caractère est en position 1) sur <code>longueur</code> caractères. <code>LEFT(s, n)</code> prend les <code>n</code> premiers caractères, <code>RIGHT(s, n)</code> les <code>n</code> derniers.</p>
<pre class="pseudo">SELECT SUBSTRING(nom, 1, 3) AS trois_premieres,  -- 3 caracteres a partir du 1er
       LEFT(nom, 1)         AS initiale,         -- la premiere lettre
       RIGHT(nom, 2)        AS deux_dernieres     -- les 2 dernieres lettres
FROM S_EMP;
-- Pour 'Dupont' : 'Dup', 'D', 'nt'</pre>

<h3>5. Nettoyer et remplacer : TRIM, REPLACE</h3>
<p><code>TRIM(s)</code> supprime les espaces en début et en fin de chaîne (utile pour nettoyer des données mal saisies). <code>REPLACE(s, ancien, nouveau)</code> remplace toutes les occurrences d'un texte par un autre.</p>
<pre class="pseudo">SELECT TRIM('   Dupont   ')          AS nettoye,     -- 'Dupont'
       REPLACE('01-02-2026', '-', '/') AS format_slash; -- '01/02/2026'</pre>

<h3>6. La date et l'heure du moment</h3>
<p><code>NOW()</code> retourne la date ET l'heure courantes ; <code>CURDATE()</code> retourne seulement la date du jour ; <code>CURTIME()</code> seulement l'heure. Ces fonctions n'ont pas d'argument.</p>
<pre class="pseudo">SELECT NOW()      AS date_et_heure,   -- ex. 2026-07-26 14:35:10
       CURDATE()  AS aujourdhui,      -- ex. 2026-07-26
       CURTIME()  AS heure;           -- ex. 14:35:10</pre>
<div class="tip">En SQL, une date s'écrit au format ANNÉE-MOIS-JOUR : <code>'2026-07-26'</code>. C'est l'ordre standard, du plus grand au plus petit.</div>

<h3>7. Extraire un morceau d'une date : YEAR, MONTH, DAY</h3>
<p><code>YEAR(d)</code>, <code>MONTH(d)</code> et <code>DAY(d)</code> extraient respectivement l'année, le mois et le jour d'une date. Très utile pour filtrer ou regrouper par année ou par mois.</p>
<pre class="pseudo">-- Table S_EMP(id, nom, date_embauche)
SELECT nom,
       date_embauche,
       YEAR(date_embauche)  AS annee,   -- ex. 2019
       MONTH(date_embauche) AS mois     -- ex. 3
FROM S_EMP
WHERE YEAR(date_embauche) = 2020;       -- seulement les embauches de 2020</pre>

<h3>8. Calculer avec les dates : DATEDIFF, DATE_FORMAT</h3>
<p><code>DATEDIFF(d1, d2)</code> retourne le nombre de <strong>jours</strong> entre deux dates. <code>DATE_FORMAT(d, format)</code> affiche une date selon un modèle choisi (par exemple jour/mois/année à la française).</p>
<pre class="pseudo">SELECT nom,
       DATEDIFF(CURDATE(), date_embauche) AS jours_anciennete,   -- nb de jours depuis l'embauche
       DATE_FORMAT(date_embauche, '%d/%m/%Y') AS date_fr         -- ex. 15/03/2019
FROM S_EMP;
-- %d = jour, %m = mois, %Y = annee sur 4 chiffres</pre>
<div class="warn">Les fonctions de date et de chaîne peuvent, comme les fonctions numériques, être imbriquées : par exemple <code>UPPER(LEFT(nom, 3))</code> prend les 3 premières lettres puis les met en majuscules.</div>`,
  exercises: [
    { type: "qcm", q: "CONCAT sert à…", opts: ["Compter des lignes", "Coller plusieurs chaînes bout à bout", "Arrondir un nombre", "Trier du texte"], a: 1, exp: "CONCAT assemble plusieurs chaînes en une seule." },
    { type: "qcm", q: "CONCAT(prenom, ' ', nom) pour 'Marie' et 'Dupont' donne…", opts: ["'MarieDupont'", "'Marie Dupont'", "'Dupont Marie'", "'Marie'"], a: 1, exp: "L'espace ' ' au milieu sépare le prénom du nom." },
    { type: "qcm", q: "Quelle fonction passe une chaîne en MAJUSCULES ?", opts: ["LOWER", "UPPER", "LENGTH", "TRIM"], a: 1, exp: "UPPER met en majuscules ; LOWER en minuscules." },
    { type: "qcm", q: "CHAR_LENGTH('Dupont') retourne…", opts: ["1", "6", "'Dupont'", "0"], a: 1, exp: "Le mot Dupont compte 6 caractères." },
    { type: "qcm", q: "LEFT('Dupont', 1) retourne…", opts: ["'D'", "'t'", "'Dup'", "'Dupont'"], a: 0, exp: "LEFT(s, 1) prend le premier caractère : 'D'." },
    { type: "qcm", q: "SUBSTRING('Dupont', 1, 3) retourne…", opts: ["'ont'", "'Dup'", "'D'", "'pon'"], a: 1, exp: "3 caractères à partir de la position 1 : 'Dup'." },
    { type: "qcm", q: "TRIM('   Dupont   ') retourne…", opts: ["'   Dupont   '", "'Dupont'", "'DUPONT'", "''"], a: 1, exp: "TRIM enlève les espaces de début et de fin." },
    { type: "qcm", q: "Quelle fonction donne la date ET l'heure courantes ?", opts: ["CURDATE()", "NOW()", "YEAR()", "DAY()"], a: 1, exp: "NOW() renvoie date + heure ; CURDATE() seulement la date." },
    { type: "qcm", q: "En SQL, une date s'écrit au format…", opts: ["JOUR-MOIS-ANNÉE", "MOIS/JOUR/ANNÉE", "ANNÉE-MOIS-JOUR", "ANNÉE/JOUR/MOIS"], a: 2, exp: "Format standard : '2026-07-26' (année-mois-jour)." },
    { type: "qcm", q: "YEAR('2019-03-15') retourne…", opts: ["15", "3", "2019", "'2019-03-15'"], a: 2, exp: "YEAR extrait l'année d'une date." },
    { type: "vf", q: "DATEDIFF(d1, d2) retourne le nombre de jours entre deux dates.", a: true, exp: "DATEDIFF calcule un écart en jours." },
    { type: "input", q: "Quelle fonction (un mot) donne le nombre de caractères d'une chaîne ? (compte correct des accents)", a: ["CHAR_LENGTH"], ph: "un nom de fonction", exp: "CHAR_LENGTH compte les caractères (accents inclus). LENGTH, lui, compte les octets et surévalue les accents en UTF-8." },
    { type: "input", q: "Quelle fonction (un mot) extrait l'année d'une date : ___(date_embauche) ?", a: "YEAR", ph: "un nom de fonction", exp: "YEAR extrait l'année ; MONTH le mois ; DAY le jour." },
    { type: "input", q: "Complète pour assembler prénom + espace + nom : CONCAT(prenom, ___, nom). Écris juste le second argument.", a: ["' '", "\" \"", "espace"], ph: "un argument", exp: "Une chaîne d'un espace ' ' sépare les deux mots." },
    { type: "input", q: "Quelle fonction (un mot) remplace toutes les occurrences d'un texte par un autre ?", a: "REPLACE", ph: "un nom de fonction", exp: "REPLACE(s, ancien, nouveau) remplace un texte par un autre." }
  ],
  final: {
    title: "Exercice final — Texte et dates des employés",
    intro: `<p>Base Sporting_goods. Table S_EMP(id, prenom, nom, titre, date_embauche).</p>`,
    questions: [
      { type: "qcm", q: "Afficher le nom complet 'prénom nom' :", opts: ["SELECT prenom + nom", "SELECT CONCAT(prenom, ' ', nom) AS nom_complet", "SELECT UPPER(nom)", "SELECT LENGTH(prenom)"], a: 1, exp: "CONCAT avec un espace au milieu." },
      { type: "qcm", q: "Afficher l'initiale du nom :", opts: ["RIGHT(nom, 1)", "LEFT(nom, 1)", "LENGTH(nom)", "YEAR(nom)"], a: 1, exp: "LEFT(nom, 1) prend le premier caractère." },
      { type: "qcm", q: "Ne garder que les employés embauchés en 2020 :", opts: ["WHERE date_embauche = 2020", "WHERE YEAR(date_embauche) = 2020", "WHERE DAY(date_embauche) = 2020", "WHERE MONTH(date_embauche) = 2020"], a: 1, exp: "YEAR extrait l'année pour la comparer à 2020." },
      { type: "qcm", q: "Nombre de jours d'ancienneté depuis l'embauche :", opts: ["YEAR(date_embauche)", "DATEDIFF(CURDATE(), date_embauche)", "NOW()", "LENGTH(date_embauche)"], a: 1, exp: "DATEDIFF entre aujourd'hui et la date d'embauche." },
      { type: "vf", q: "On peut imbriquer les fonctions, ex. UPPER(LEFT(nom, 3)).", a: true, exp: "Le résultat d'une fonction peut servir d'argument à une autre." }
    ],
    solution: `<pre class="pseudo">-- 1) nom complet
SELECT CONCAT(prenom, ' ', nom) AS nom_complet
FROM S_EMP;

-- 2) initiale du nom
SELECT nom, LEFT(nom, 1) AS initiale
FROM S_EMP;

-- 3) embauches de 2020
SELECT prenom, nom
FROM S_EMP
WHERE YEAR(date_embauche) = 2020;

-- 4) anciennete en jours
SELECT nom, DATEDIFF(CURDATE(), date_embauche) AS jours_anciennete
FROM S_EMP;</pre>
<p>Tu sais transformer du texte et des dates, ligne par ligne. Demain : les fonctions d'agrégation, qui résument PLUSIEURS lignes en une seule valeur.</p>`
  }
};
</script>
