<script>
var DAY = {
  num: 6,
  title: "Créer une base et une table (CREATE)",
  subtitle: "L'instruction CREATE TABLE : donner un nom, des colonnes et des types.",
  theory: `
<h3>1. CREATE TABLE : la commande de base du LDD</h3>
<p>Une table se crée en SQL avec l'instruction <strong>CREATE TABLE</strong>. On lui donne un nom, puis, entre parenthèses, la liste de ses colonnes ; pour chaque colonne, on précise son <strong>nom</strong> et son <strong>type de données</strong>.</p>
<pre class="pseudo">-- forme simplifiee de l'instruction (d'apres le support)
CREATE TABLE nomTable (
    colonne1  type1,          -- premiere colonne : un nom et un type
    colonne2  type2,          -- deuxieme colonne
    colonne3  type3           -- (pas de virgule apres la derniere colonne)
);</pre>
<div class="warn">Attention à la ponctuation : les colonnes sont séparées par des <strong>virgules</strong>, mais il n'y a <strong>pas</strong> de virgule après la dernière. Et l'instruction se termine par un <strong>point-virgule</strong>.</div>

<h3>2. Un premier exemple : la table Compagnie</h3>
<p>Le support crée une table <code>Compagnie</code> à cinq colonnes : quatre chaînes de caractères et un numérique. On utilise <code>VARCHAR(n)</code> pour du texte de longueur variable (jusqu'à n caractères) et un type numérique pour les nombres. Les types seront étudiés en détail demain ; ici, l'essentiel est la <strong>structure</strong> de l'instruction.</p>
<pre class="pseudo">CREATE TABLE Compagnie (
    comp     VARCHAR(4),      -- code de la compagnie (texte court)
    nrue     SMALLINT,        -- numero dans la rue (nombre entier)
    rue      VARCHAR(20),     -- nom de la rue
    ville    VARCHAR(15),     -- ville
    nomComp  VARCHAR(20)      -- nom de la compagnie (derniere colonne : pas de virgule)
);</pre>
<div class="tip">Conventions recommandées par le support : mots-clés SQL en MAJUSCULES (CREATE, TABLE, VARCHAR…), noms de tables commençant par une majuscule, noms de colonnes en minuscules. Un nom de table ou de colonne peut comporter jusqu'à 64 caractères.</div>

<h3>3. Éviter les erreurs : IF NOT EXISTS</h3>
<p>Si tu tentes de créer une table qui existe déjà, MySQL renvoie une erreur. Pour l'éviter, on ajoute <strong>IF NOT EXISTS</strong> : la table n'est créée que si elle n'existe pas encore (sinon, rien ne se passe, et aucune erreur n'est levée).</p>
<pre class="pseudo">CREATE TABLE IF NOT EXISTS Compagnie (   -- ne cree la table que si elle n'existe pas deja
    comp     VARCHAR(4),
    nomComp  VARCHAR(20)
);</pre>

<h3>4. Choisir dans quelle base on crée la table</h3>
<p>La table est créée dans la <strong>base courante</strong> (celle choisie avec <code>USE</code>). C'est pourquoi on commence toujours par se placer dans la bonne base.</p>
<pre class="pseudo">USE compagnie_aerienne;      -- 1) se placer dans la bonne base
CREATE TABLE Compagnie (     -- 2) creer la table dans cette base
    comp     VARCHAR(4),
    nomComp  VARCHAR(20)
);</pre>

<h3>5. Vérifier et supprimer une table</h3>
<p>Après la création, la commande <strong>DESCRIBE</strong> (abrégée <code>DESC</code>) affiche la structure d'une table : ses colonnes et leurs types. Et l'instruction <strong>DROP TABLE</strong> supprime une table (structure + contenu).</p>
<pre class="pseudo">DESCRIBE Compagnie;          -- afficher la structure de la table (colonnes, types...)

DROP TABLE Compagnie;        -- supprimer entierement la table (irreversible)</pre>
<div class="warn">Ne confonds pas les deux niveaux : <code>CREATE DATABASE</code> / <code>DROP DATABASE</code> agissent sur une BASE entière ; <code>CREATE TABLE</code> / <code>DROP TABLE</code> agissent sur une TABLE à l'intérieur d'une base.</div>`,
  exercises: [
    { type: "input", q: "Complète : pour créer une table, on écrit CREATE ______ nomTable ( ... ) ;", a: ["table"], ph: "un mot-clé", exp: "CREATE TABLE nomTable ( ... ) ;" },
    { type: "qcm", q: "Dans une instruction CREATE TABLE, chaque colonne est décrite par…", opts: ["Seulement son nom", "Un nom ET un type de données", "Seulement son type", "Un numéro de ligne"], a: 1, exp: "Chaque colonne = un nom + un type." },
    { type: "vf", q: "Il faut mettre une virgule après la toute dernière colonne, avant la parenthèse fermante.", a: false, exp: "Faux : pas de virgule après la dernière colonne. Les virgules séparent les colonnes." },
    { type: "input", q: "Complète : pour éviter une erreur si la table existe déjà, on ajoute CREATE TABLE IF NOT ______ nomTable ...", a: ["exists"], ph: "un mot-clé", exp: "IF NOT EXISTS : la table n'est créée que si elle n'existe pas." },
    { type: "qcm", q: "Dans quelle base la table est-elle créée ?", opts: ["Toujours dans une base nommée MySQL", "Dans la base courante (choisie avec USE)", "Dans toutes les bases à la fois", "Dans une base créée automatiquement"], a: 1, exp: "La table va dans la base courante, d'où l'importance de USE d'abord." },
    { type: "input", q: "Complète : la commande qui affiche la structure (colonnes et types) d'une table est ______ nomTable ;", a: ["describe", "desc"], ph: "un mot-clé", exp: "DESCRIBE (ou DESC) nomTable ;" },
    { type: "qcm", q: "Quelle instruction supprime une table entière ?", opts: ["DELETE TABLE", "DROP TABLE nomTable", "REMOVE TABLE", "CLEAR TABLE"], a: 1, exp: "DROP TABLE supprime la table (structure et contenu)." },
    { type: "vf", q: "Le type VARCHAR(20) sert à stocker du texte de longueur variable jusqu'à 20 caractères.", a: true, exp: "Vrai : VARCHAR(n) = chaîne de caractères variable, au maximum n caractères." },
    { type: "input", q: "Complète : selon la convention du support, les mots-clés SQL s'écrivent en ______ (majuscules / minuscules).", a: ["majuscules", "majuscule"], ph: "un mot", exp: "Mots-clés en MAJUSCULES ; noms de colonnes en minuscules." },
    { type: "qcm", q: "CREATE DATABASE et CREATE TABLE…", opts: ["Font exactement la même chose", "Agissent à deux niveaux différents : une base entière vs une table dans une base", "Sont interdits ensemble", "Ne se terminent pas par ;"], a: 1, exp: "DATABASE = base entière ; TABLE = une table à l'intérieur d'une base." },
    { type: "vf", q: "Une instruction CREATE TABLE se termine par un point-virgule.", a: true, exp: "Vrai : comme toute commande en mode console." },
    { type: "input", q: "Complète : avant de créer une table dans une base, on s'y place avec ______ nomBase ;", a: ["use"], ph: "un mot-clé", exp: "USE nomBase ; rend la base courante." },
    { type: "qcm", q: "Que fait CREATE TABLE IF NOT EXISTS Compagnie (...) si la table Compagnie existe déjà ?", opts: ["Elle écrase l'ancienne table", "Rien : aucune erreur, la table existante reste intacte", "Elle vide la table", "Elle renvoie une erreur bloquante"], a: 1, exp: "IF NOT EXISTS évite l'erreur et laisse la table existante inchangée." },
    { type: "qcm", q: "Dans la liste des colonnes, les colonnes sont séparées par…", opts: ["Des points-virgules", "Des virgules", "Des espaces uniquement", "Des tirets"], a: 1, exp: "Les colonnes sont séparées par des virgules ; le ; termine toute l'instruction." },
    { type: "input", q: "Complète : un nom de table ou de colonne peut comporter jusqu'à ______ caractères (un nombre).", a: ["64"], ph: "un nombre", exp: "Jusqu'à 64 caractères, d'après le support." }
  ],
  final: {
    title: "Exercice final — Créer une table Client",
    intro: `<p>On veut créer une table <code>Client</code> avec les colonnes suivantes : <code>nocli</code> (texte, 6 caractères), <code>nomcli</code> (texte, 20), <code>prenomcli</code> (texte, 20) et <code>telcli</code> (texte, 15). Réponds aux questions puis regarde la solution modèle.</p>`,
    questions: [
      { type: "input", q: "Complète le début : CREATE ______ Client ( ...", a: ["table"], ph: "un mot-clé", exp: "CREATE TABLE Client ( ..." },
      { type: "qcm", q: "Quel type convient pour nocli (texte court, longueur variable, max 6) ?", opts: ["INTEGER", "VARCHAR(6)", "DATE", "BOOLEAN"], a: 1, exp: "VARCHAR(6) : texte variable de 6 caractères maximum." },
      { type: "vf", q: "Il faut une virgule entre nocli et nomcli, mais pas après telcli (dernière colonne).", a: true, exp: "Virgules pour séparer, aucune après la dernière colonne." },
      { type: "qcm", q: "Comment terminer l'instruction ?", opts: ["Par une virgule", "Par la parenthèse fermante puis un point-virgule", "Par un point", "Par un espace"], a: 1, exp: "On ferme la parenthèse puis on met ; ." },
      { type: "input", q: "Complète : pour vérifier ensuite la structure, ______ Client ;", a: ["describe", "desc"], ph: "un mot-clé", exp: "DESCRIBE Client ;" }
    ],
    solution: `<pre class="pseudo">CREATE TABLE Client (
    nocli      VARCHAR(6),     -- code du client, texte court
    nomcli     VARCHAR(20),    -- nom du client
    prenomcli  VARCHAR(20),    -- prenom du client
    telcli     VARCHAR(15)     -- telephone (derniere colonne : pas de virgule)
);

DESCRIBE Client;              -- verifier la structure creee</pre>
<p>Ta première table est prête. Demain : le catalogue complet des types de données MySQL.</p>`
  }
};
</script>
