var DAY = {

  title: "Découvrir MySQL / MariaDB",
  subtitle: "Se connecter au serveur et lancer ses toutes premières commandes.",
  theory: `
<h3>1. MySQL et MariaDB</h3>
<p><strong>MySQL</strong> est le SGBD relationnel libre le plus populaire au monde. <strong>MariaDB</strong> en est une variante très proche (un « fork »), née pour rester entièrement libre ; les deux se pilotent avec les mêmes commandes SQL. Tout ce que nous écrirons fonctionne aussi bien sur l'un que sur l'autre.</p>
<div class="tip">Une manière simple d'installer un serveur MySQL/MariaDB sur son ordinateur est d'utiliser <strong>XAMPP</strong> (un paquet qui contient le serveur et des outils). Le support utilise d'ailleurs le dossier <code>c:\\xampp\\mysql\\bin</code>.</div>

<h3>2. Client et serveur</h3>
<p>Il faut distinguer deux choses. Le <strong>serveur</strong> MySQL est le programme qui tourne en arrière-plan et détient les bases de données. Le <strong>client</strong> est l'outil par lequel <em>toi</em> tu tapes des commandes et reçois des résultats. On se connecte donc, depuis un client, au serveur.</p>
<p>Le support utilise la <strong>console</strong> (la ligne de commande). D'autres clients graphiques existent : MySQL Workbench, DBeaver, phpMyAdmin. Le langage SQL reste identique quel que soit le client.</p>

<h3>3. Se connecter au serveur</h3>
<p>Dans le support, on ouvre l'invite de commande (en tapant <code>cmd</code>), on se place dans le dossier du serveur, puis on lance le client <code>mysql</code> en indiquant l'utilisateur, l'hôte et le mot de passe.</p>
<pre class="pseudo">-- 1) se placer dans le dossier du serveur (exemple du support)
cd c:\\xampp\\mysql\\bin

-- 2) se connecter au serveur avec le client mysql
mysql --user=root --host=localhost --password=test
--   --user     : le nom de l'utilisateur (ici root, l'administrateur)
--   --host     : la machine ou tourne le serveur (localhost = cette machine)
--   --password : le mot de passe de l'utilisateur</pre>
<div class="tip">Une fois connecté, l'invite change (par exemple <code>mysql&gt;</code>) : c'est le signe que le client MySQL attend tes commandes.</div>

<h3>4. Le point-virgule qui termine une commande</h3>
<p>En mode ligne de commande, chaque instruction SQL doit se terminer par un <strong>point-virgule</strong> <code>;</code>. Tant que tu n'as pas tapé le <code>;</code>, le serveur considère que tu n'as pas fini d'écrire ta commande et attend la suite.</p>
<div class="warn">Oublier le point-virgule est l'erreur numéro un du débutant : la commande semble « ne rien faire ». Il suffit alors de taper <code>;</code> puis Entrée.</div>

<h3>5. Voir et créer des bases de données</h3>
<p>Voici les premières commandes du support pour gérer les bases. <code>SHOW DATABASES</code> liste les bases présentes sur le serveur ; <code>CREATE DATABASE</code> en crée une nouvelle.</p>
<pre class="pseudo">SHOW DATABASES;              -- afficher toutes les bases presentes sur le serveur

CREATE DATABASE boutique;    -- creer une nouvelle base de donnees nommee boutique

SHOW DATABASES;              -- re-verifier : la base « boutique » apparait maintenant</pre>
<p>Deux commandes complètent utilement la panoplie de départ : <code>USE</code> pour choisir la base sur laquelle on veut travailler, et <code>DROP DATABASE</code> pour en supprimer une.</p>
<pre class="pseudo">USE boutique;                -- se placer DANS la base boutique (elle devient la base courante)
-- a partir d'ici, toutes mes commandes s'appliquent a la base boutique

DROP DATABASE boutique;      -- ATTENTION : supprime la base ET tout ce qu'elle contient</pre>
<div class="warn">DROP DATABASE est irréversible : la base et toutes ses tables disparaissent. À manier avec la plus grande prudence.</div>`,
  exercises: [
    { type: "input", q: "Complète : la commande qui liste toutes les bases du serveur est SHOW ______ ;", a: ["databases", "database"], ph: "un mot-clé", exp: "SHOW DATABASES ; affiche la liste des bases." },
    { type: "input", q: "Complète : pour créer une base nommée boutique, on écrit CREATE ______ boutique ;", a: ["database"], ph: "un mot-clé", exp: "CREATE DATABASE boutique ;" },
    { type: "qcm", q: "MariaDB est…", opts: ["Un langage différent de SQL", "Une variante (fork) très proche de MySQL, pilotée par les mêmes commandes", "Un tableur", "Un système d'exploitation"], a: 1, exp: "MariaDB est un fork libre de MySQL, compatible au niveau des commandes." },
    { type: "vf", q: "En mode ligne de commande, chaque instruction SQL doit se terminer par un point-virgule.", a: true, exp: "Vrai : le ; signale la fin de la commande." },
    { type: "input", q: "Complète : pour se placer DANS une base et en faire la base courante, on utilise la commande ______ boutique ;", a: ["use"], ph: "un mot-clé", exp: "USE boutique ; sélectionne la base de travail." },
    { type: "qcm", q: "Dans la connexion, à quoi sert --host=localhost ?", opts: ["À indiquer le mot de passe", "À indiquer la machine où tourne le serveur (ici, cette machine)", "À créer une base", "À trier les résultats"], a: 1, exp: "localhost = le serveur tourne sur la machine locale." },
    { type: "qcm", q: "Quel est le rôle du client (par ex. la console mysql) ?", opts: ["Détenir physiquement les bases de données", "Permettre à l'utilisateur de taper des commandes et de recevoir les résultats", "Remplacer le serveur", "Trier automatiquement les données"], a: 1, exp: "Le client est l'outil par lequel on dialogue avec le serveur." },
    { type: "vf", q: "DROP DATABASE supprime une base mais conserve ses tables ailleurs.", a: false, exp: "Faux : DROP DATABASE supprime la base ET tout son contenu, de façon irréversible." },
    { type: "input", q: "Complète : dans la commande de connexion, l'option --______ précise le nom de l'utilisateur (ex : root).", a: ["user"], ph: "un mot-clé", exp: "--user=root indique l'utilisateur de connexion." },
    { type: "qcm", q: "Que se passe-t-il si on oublie le point-virgule à la fin d'une commande en console ?", opts: ["La base est supprimée", "Le serveur attend la suite : la commande semble ne rien faire", "Une nouvelle base est créée", "Le mot de passe change"], a: 1, exp: "Sans ; le serveur croit que l'instruction n'est pas terminée." },
    { type: "vf", q: "MySQL Workbench, DBeaver et phpMyAdmin sont des clients possibles pour dialoguer avec le serveur.", a: true, exp: "Vrai : ce sont des clients graphiques, alternatives à la console." },
    { type: "input", q: "Complète : le paquet cité par le support pour installer facilement un serveur MySQL sous Windows est ______.", a: ["xampp"], ph: "un nom", exp: "XAMPP, qui fournit le serveur et des outils." },
    { type: "qcm", q: "Le langage SQL que l'on tape…", opts: ["Change complètement selon le client utilisé", "Reste le même quel que soit le client (console ou graphique)", "N'existe qu'en console", "N'existe que dans Workbench"], a: 1, exp: "Le SQL est identique ; seul l'outil (client) change." },
    { type: "input", q: "Complète : la commande qui supprime définitivement une base est ______ DATABASE boutique ;", a: ["drop"], ph: "un mot-clé", exp: "DROP DATABASE boutique ; supprime la base et son contenu." },
    { type: "qcm", q: "L'utilisateur « root » est…", opts: ["Un simple visiteur sans droits", "L'administrateur du serveur MySQL", "Le nom d'une table", "Un type de données"], a: 1, exp: "root est le compte administrateur par défaut." }
  ],
  final: {
    title: "Exercice final — Premiers pas en console",
    intro: `<p>Tu viens d'ouvrir un client MySQL. Écris (mentalement) la suite de commandes pour créer une base « ecole », t'y placer, puis vérifier la liste des bases.</p>`,
    questions: [
      { type: "input", q: "Complète : pour créer la base, CREATE ______ ecole ;", a: ["database"], ph: "un mot-clé", exp: "CREATE DATABASE ecole ;" },
      { type: "input", q: "Complète : pour te placer dans cette base, ______ ecole ;", a: ["use"], ph: "un mot-clé", exp: "USE ecole ;" },
      { type: "input", q: "Complète : pour lister toutes les bases, SHOW ______ ;", a: ["databases", "database"], ph: "un mot-clé", exp: "SHOW DATABASES ;" },
      { type: "vf", q: "Chacune de ces trois commandes doit se terminer par un point-virgule.", a: true, exp: "Oui : en console, toute commande finit par ; ." },
      { type: "qcm", q: "Dans quel ordre logique enchaîne-t-on ces commandes ?", opts: ["USE puis CREATE puis SHOW", "CREATE puis USE puis SHOW", "SHOW puis USE puis CREATE", "DROP puis CREATE"], a: 1, exp: "On crée la base, on s'y place, puis on vérifie." }
    ],
    solution: `<pre class="pseudo">CREATE DATABASE ecole;   -- 1) creer la base
USE ecole;               -- 2) se placer dedans (base courante)
SHOW DATABASES;          -- 3) verifier que « ecole » figure dans la liste
-- Ne pas oublier le point-virgule a la fin de chaque commande !</pre>
<p>Ton serveur répond. Demain : créer ta première table avec CREATE TABLE.</p>`
  }
};
