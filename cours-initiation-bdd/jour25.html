<script>
var DAY = {
  num: 25,
  title: "Les opérateurs d'ensemble (UNION, INTERSECT, EXCEPT)",
  subtitle: "Combiner verticalement les résultats de plusieurs SELECT.",
  theory: `
<h3>1. Empiler des résultats plutôt que les croiser</h3>
<p>Les jointures relient les tables <strong>horizontalement</strong> (on ajoute des colonnes). Les <strong>opérateurs d'ensemble</strong> travaillent <strong>verticalement</strong> : ils <strong>empilent</strong> les lignes de plusieurs <code>SELECT</code> en un seul résultat. C'est utile quand deux requêtes produisent le même genre d'information et qu'on veut les réunir, les croiser ou les soustraire.</p>

<h3>2. Les règles de compatibilité</h3>
<p>Pour combiner deux <code>SELECT</code> avec un opérateur d'ensemble, leurs résultats doivent être <strong>compatibles</strong> :</p>
<pre class="pseudo">-- 1) MEME nombre de colonnes dans chaque SELECT
-- 2) types de donnees COMPATIBLES colonne par colonne (dans le meme ordre)
-- 3) les NOMS de colonnes peuvent differer : ce sont ceux du 1er SELECT qui priment
-- 4) s'il y a un ORDER BY, il est unique et place tout a la fin</pre>

<h3>3. UNION : réunir (sans doublons)</h3>
<p><code>UNION</code> combine les résultats de plusieurs <code>SELECT</code> en un seul, et <strong>supprime les doublons</strong> : une ligne présente dans les deux requêtes n'apparaît qu'une fois. Le mot-clé <code>UNION</code> se place entre les deux instructions.</p>
<pre class="pseudo">-- Nom des clients de la region 1 ET nom des departements de cette region, en une seule liste
SELECT nom FROM S_CLIENT  WHERE id_region = 1
UNION                     -- entre les deux SELECT
SELECT nom FROM S_DEPT    WHERE id_region = 1;</pre>

<h3>4. UNION ALL : réunir en gardant les doublons</h3>
<p><code>UNION ALL</code> fait la même chose mais <strong>conserve les doublons</strong>. C'est plus rapide (SQL ne cherche pas à dédoublonner) ; à utiliser quand tu sais qu'il n'y a pas de doublon, ou que tu veux les garder.</p>
<pre class="pseudo">SELECT ville FROM S_CLIENT
UNION ALL                 -- garde les doublons (une ville par client)
SELECT ville FROM S_REPRESENTANT;</pre>
<div class="tip">Résumé : UNION dédoublonne, UNION ALL garde tout. Si tu hésites et que les doublons ne te gênent pas, UNION ALL est plus performant.</div>

<h3>5. INTERSECT : l'intersection (ce qui est commun)</h3>
<p><code>INTERSECT</code> ne garde que les lignes présentes <strong>dans les deux</strong> requêtes à la fois. C'est l'intersection ensembliste. Disponible dans MariaDB (10.3+) et MySQL (8.0.31+).</p>
<pre class="pseudo">-- Les villes ou il y a A LA FOIS un client et un representant
SELECT ville FROM S_CLIENT
INTERSECT
SELECT ville FROM S_REPRESENTANT;</pre>

<h3>6. EXCEPT : la différence (ce qui est dans l'un mais pas l'autre)</h3>
<p><code>EXCEPT</code> retourne les lignes du <strong>premier</strong> <code>SELECT</code> qui ne figurent <strong>pas</strong> dans le second. C'est la différence ensembliste (soustraction). Disponible dans les mêmes versions récentes.</p>
<pre class="pseudo">-- Les villes ayant un client mais AUCUN representant
SELECT ville FROM S_CLIENT
EXCEPT
SELECT ville FROM S_REPRESENTANT;</pre>
<div class="warn">INTERSECT et EXCEPT ne sont apparus que dans les versions récentes (MariaDB 10.3+, MySQL 8.0.31+). Sur une version plus ancienne, on les remplace : INTERSECT par une jointure ou un IN, EXCEPT par un NOT IN ou un LEFT JOIN … IS NULL (vus les jours précédents).</div>

<h3>7. Trier le résultat combiné</h3>
<p>Un <code>ORDER BY</code> ne peut apparaître qu'<strong>une seule fois</strong>, tout à la fin, après le dernier <code>SELECT</code> : il trie le résultat global. On y désigne les colonnes par les noms du premier <code>SELECT</code>.</p>
<pre class="pseudo">SELECT nom, ville FROM S_CLIENT WHERE id_region = 1
UNION
SELECT nom, ville FROM S_REPRESENTANT WHERE id_region = 1
ORDER BY ville, nom;          -- un seul ORDER BY, tout a la fin</pre>`,
  exercises: [
    { type: "qcm", q: "Les opérateurs d'ensemble combinent les résultats…", opts: ["Horizontalement (colonnes ajoutées)", "Verticalement (lignes empilées)", "En triant seulement", "En comptant"], a: 1, exp: "Ils empilent les lignes de plusieurs SELECT." },
    { type: "qcm", q: "Pour combiner deux SELECT, ils doivent avoir…", opts: ["Le même nom de table", "Le même nombre de colonnes et des types compatibles", "Exactement les mêmes noms de colonnes", "Le même ORDER BY"], a: 1, exp: "Même nombre de colonnes, types compatibles dans le même ordre." },
    { type: "qcm", q: "UNION…", opts: ["Garde les doublons", "Supprime les doublons", "Ne garde que l'intersection", "Trie les lignes"], a: 1, exp: "UNION combine et supprime les doublons." },
    { type: "qcm", q: "UNION ALL…", opts: ["Supprime les doublons", "Conserve les doublons", "Ne garde que la différence", "Compte les lignes"], a: 1, exp: "UNION ALL garde tous les doublons (plus rapide)." },
    { type: "qcm", q: "INTERSECT retourne…", opts: ["Toutes les lignes des deux requêtes", "Seulement les lignes présentes dans les deux", "Les lignes de la première seulement", "Les lignes uniques à chacune"], a: 1, exp: "INTERSECT = l'intersection (lignes communes)." },
    { type: "qcm", q: "EXCEPT retourne…", opts: ["Les lignes communes", "Les lignes du 1er SELECT absentes du 2e", "Toutes les lignes", "Les doublons"], a: 1, exp: "EXCEPT = la différence (1er moins 2e)." },
    { type: "qcm", q: "Les noms de colonnes du résultat combiné sont ceux…", opts: ["Du dernier SELECT", "Du premier SELECT", "Toujours 'col1, col2'", "De la table la plus grande"], a: 1, exp: "Le premier SELECT détermine les en-têtes." },
    { type: "qcm", q: "Un ORDER BY dans une requête avec UNION…", opts: ["Se met après chaque SELECT", "Apparaît une seule fois, tout à la fin", "Est interdit", "Se met avant le premier SELECT"], a: 1, exp: "Un seul ORDER BY, en dernière position." },
    { type: "vf", q: "UNION supprime les doublons, UNION ALL les conserve.", a: true, exp: "C'est la différence essentielle entre les deux." },
    { type: "qcm", q: "Sur une vieille version sans EXCEPT, on peut le remplacer par…", opts: ["Un GROUP BY", "Un NOT IN ou un LEFT JOIN … IS NULL", "Un INNER JOIN", "Un HAVING"], a: 1, exp: "NOT IN ou LEFT JOIN + IS NULL reproduisent la différence." },
    { type: "vf", q: "Deux SELECT combinés par UNION peuvent avoir un nombre de colonnes différent.", a: false, exp: "Faux : le nombre de colonnes doit être identique." },
    { type: "input", q: "Quel opérateur (un mot) réunit deux SELECT en supprimant les doublons ?", a: "UNION", ph: "un mot-clé SQL", exp: "UNION réunit et dédoublonne." },
    { type: "input", q: "Quel opérateur (deux mots) réunit deux SELECT en gardant les doublons ?", a: ["UNION ALL", "union all"], ph: "deux mots-clés", exp: "UNION ALL conserve les doublons." },
    { type: "input", q: "Quel opérateur (un mot) ne garde que les lignes communes aux deux requêtes ?", a: "INTERSECT", ph: "un mot-clé SQL", exp: "INTERSECT retourne l'intersection." },
    { type: "input", q: "Quel opérateur (un mot) garde les lignes du premier SELECT absentes du second ?", a: "EXCEPT", ph: "un mot-clé SQL", exp: "EXCEPT retourne la différence." }
  ],
  final: {
    title: "Exercice final — Réunir, croiser, soustraire",
    intro: `<p>Base Sporting_goods. Table S_CLIENT(nom, ville, id_region). Table S_REPRESENTANT(nom, ville, id_region). Table S_DEPT(nom, id_region).</p>`,
    questions: [
      { type: "qcm", q: "Réunir en une liste les noms des clients et des représentants du Venezuela (sans doublon) :", opts: ["SELECT ... UNION SELECT ...", "SELECT ... INTERSECT SELECT ...", "SELECT ... EXCEPT SELECT ...", "INNER JOIN"], a: 0, exp: "UNION réunit deux listes compatibles." },
      { type: "qcm", q: "Garder aussi les doublons dans cette réunion :", opts: ["UNION", "UNION ALL", "INTERSECT", "EXCEPT"], a: 1, exp: "UNION ALL conserve les doublons." },
      { type: "qcm", q: "Les villes ayant à la fois un client et un représentant :", opts: ["UNION", "INTERSECT", "EXCEPT", "UNION ALL"], a: 1, exp: "INTERSECT donne les lignes communes." },
      { type: "qcm", q: "Les villes ayant un client mais aucun représentant :", opts: ["UNION", "INTERSECT", "EXCEPT", "UNION ALL"], a: 2, exp: "EXCEPT retire du premier ce qui est dans le second." },
      { type: "vf", q: "Le tri du résultat global se fait avec un seul ORDER BY placé à la toute fin.", a: true, exp: "Un unique ORDER BY final trie l'ensemble." }
    ],
    solution: `<pre class="pseudo">-- 1) reunion clients + representants du Venezuela (sans doublon)
SELECT nom, ville FROM S_CLIENT       WHERE pays = 'Venezuela'
UNION
SELECT nom, ville FROM S_REPRESENTANT WHERE pays = 'Venezuela'
ORDER BY ville, nom;

-- 2) villes communes (client ET representant)
SELECT ville FROM S_CLIENT
INTERSECT
SELECT ville FROM S_REPRESENTANT;

-- 3) villes avec client mais sans representant
SELECT ville FROM S_CLIENT
EXCEPT
SELECT ville FROM S_REPRESENTANT;</pre>
<p>Tu sais réunir (UNION), croiser (INTERSECT) et soustraire (EXCEPT) des résultats. Demain : gérer les doublons avec DISTINCT et ON DUPLICATE KEY.</p>`
  }
};
</script>
