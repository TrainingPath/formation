<script>
var DAY = {
  num: 4,
  title: "SQL : une norme, un langage (LDD, LMD, LID, LCD)",
  subtitle: "Une seule langue pour créer, manipuler, interroger et contrôler les données.",
  theory: `
<h3>1. SQL, c'est quoi ?</h3>
<p><strong>SQL</strong> (sigle de <em>Structured Query Language</em>, « langage de requêtes structuré ») est <strong>le</strong> langage des bases de données relationnelles. Avec un seul langage, on peut créer les objets de la base, manipuler les données, gérer la sécurité et les transactions.</p>
<p>Petit historique : c'est IBM qui, avec le projet System-R, a implanté le modèle relationnel via un langage d'abord appelé <strong>SEQUEL</strong>, rebaptisé ensuite <strong>SQL</strong>. La première norme (SQL1) date de <strong>1987</strong>, SQL2 de <strong>1992</strong>, et SQL3 depuis <strong>1999</strong>.</p>

<h3>2. SQL est une NORME</h3>
<p>Avant tout, SQL est une <strong>norme</strong> internationale, publiée par l'<strong>ISO</strong> (organisation internationale de normalisation) et l'<strong>ANSI</strong> (organisme américain). Une norme, c'est un standard commun.</p>
<div class="tip">Conséquence pratique très importante : une requête écrite pour un SGBD donné peut fonctionner, moyennant quelques adaptations, dans un autre SGBD. Ce que tu apprends ici avec MySQL te servira aussi ailleurs (Oracle, PostgreSQL, SQL Server…).</div>
<p>Chaque éditeur ajoute toutefois ses petites différences : on parle de « dialecte » SQL. MySQL a le sien, mais il reste très proche de la norme.</p>

<h3>3. Deux grandes parties : déclaratif et procédural</h3>
<p>SQL se compose de deux parties. La partie <strong>déclarative</strong> est la plus utilisée : on <strong>déclare ce que l'on veut obtenir</strong>, et c'est le SGBD qui décide comment l'exécuter. La partie <strong>procédurale</strong> (fonctions, procédures, déclencheurs) ressemble davantage à un langage de programmation classique ; nous ne l'aborderons pas au début.</p>
<div class="warn">Idée clé du déclaratif : tu dis QUOI faire (« donne-moi les clients de Paris »), pas COMMENT le faire. Le SGBD s'occupe du « comment ».</div>

<h3>4. Les familles de commandes SQL</h3>
<p>La partie déclarative se subdivise en quatre familles. On les désigne souvent par leurs sigles anglais ; voici la correspondance avec les sigles français utilisés dans ce cours.</p>
<pre class="pseudo">-- LDD  (DDL, Langage de Definition des Donnees) : la STRUCTURE
CREATE   -- creer un objet   (une base, une table...)
ALTER    -- modifier un objet (ajouter une colonne...)
DROP     -- supprimer un objet

-- LMD  (DML, Langage de Manipulation des Donnees) : le CONTENU
INSERT   -- ajouter des lignes
UPDATE   -- modifier des lignes
DELETE   -- supprimer des lignes

-- LID  (Langage d'Interrogation des Donnees) : la LECTURE
SELECT   -- extraire / consulter des donnees (les requetes)

-- LCD  (DCL, Langage de Controle des Donnees) : les DROITS
GRANT    -- accorder un privilege a un utilisateur
REVOKE   -- retirer un privilege</pre>
<div class="tip">Moyen mnémotechnique : <strong>LDD</strong> = la maquette (les murs), <strong>LMD</strong> = les meubles qu'on met dedans, <strong>LID</strong> = ce qu'on va chercher dans les meubles, <strong>LCD</strong> = qui a le droit d'entrer. Une famille supplémentaire, le <strong>TCL</strong>, gère les transactions (COMMIT, ROLLBACK) ; nous la verrons bien plus tard.</div>

<h3>5. Les commentaires en SQL</h3>
<p>Dans toute instruction SQL, on peut ajouter des <strong>commentaires</strong> (du texte ignoré par le SGBD, utile pour expliquer). Sur une ligne, on les introduit par deux tirets <code>--</code>, ou par le dièse <code>#</code>. Sur plusieurs lignes, entre <code>/*</code> et <code>*/</code>.</p>
<pre class="pseudo">SELECT nom FROM Pilote;   -- ceci est un commentaire de fin de ligne
-- ceci est une ligne entierement en commentaire
/* et ceci est
   un commentaire sur plusieurs lignes */</pre>
<div class="tip">Bonne pratique du support : écris les mots-clés SQL (SELECT, FROM, CREATE…) en MAJUSCULES, et les noms de tables et de colonnes en minuscules. Cela rend tes requêtes bien plus lisibles.</div>`,
  exercises: [
    { type: "input", q: "Complète : le langage des bases de données relationnelles s'appelle ______ (trois lettres).", a: ["SQL", "sql"], ph: "un sigle", exp: "SQL = Structured Query Language." },
    { type: "qcm", q: "Quelle famille de commandes sert à créer et modifier la STRUCTURE (tables, colonnes) ?", opts: ["Le LMD (DML)", "Le LDD (DDL) : CREATE, ALTER, DROP", "Le LCD (DCL)", "Le LID"], a: 1, exp: "Le LDD (DDL) définit la structure : CREATE, ALTER, DROP." },
    { type: "input", q: "Complète : pour ajouter, modifier ou supprimer des lignes, on utilise le langage de ______ des données (LMD).", a: ["manipulation"], ph: "un mot", exp: "Le LMD (Langage de Manipulation des Données) : INSERT, UPDATE, DELETE." },
    { type: "qcm", q: "La commande SELECT appartient à…", opts: ["La lecture / interrogation des données (LID)", "La définition de la structure (LDD)", "Le contrôle des droits (LCD)", "Aucune, ce n'est pas du SQL"], a: 0, exp: "SELECT sert à interroger / lire les données." },
    { type: "vf", q: "SQL est avant tout une norme internationale (ISO / ANSI).", a: true, exp: "Vrai : c'est ce qui rend les requêtes largement portables d'un SGBD à l'autre." },
    { type: "input", q: "Complète : GRANT et REVOKE, qui gèrent les droits des utilisateurs, appartiennent au langage de ______ des données (LCD).", a: ["controle", "controle"], ph: "un mot", exp: "Le LCD (DCL) contrôle les privilèges : GRANT, REVOKE." },
    { type: "qcm", q: "Que signifie « SQL est déclaratif » ?", opts: ["On écrit du code machine", "On déclare CE que l'on veut, et le SGBD décide COMMENT l'obtenir", "On doit tout programmer étape par étape", "Il faut déclarer des variables avant chaque requête"], a: 1, exp: "Déclaratif : on dit le QUOI, pas le COMMENT." },
    { type: "input", q: "Complète : en SQL, un commentaire de fin de ligne commence par deux ______ (le caractère répété deux fois, écris « tirets »).", a: ["tirets", "tiret", "--"], ph: "un mot", exp: "Deux tirets -- introduisent un commentaire jusqu'à la fin de la ligne." },
    { type: "qcm", q: "CREATE, ALTER et DROP servent respectivement à…", opts: ["Ajouter, modifier, lire des lignes", "Créer, modifier, supprimer des objets (structure)", "Accorder, retirer, tester des droits", "Trier, filtrer, grouper"], a: 1, exp: "Ce sont les trois commandes du LDD (structure)." },
    { type: "vf", q: "Une requête écrite pour MySQL est en général totalement inutilisable dans tout autre SGBD.", a: false, exp: "Faux : grâce à la norme, elle est portable moyennant quelques adaptations." },
    { type: "input", q: "Complète : le premier nom du langage, chez IBM, était ______ (avant d'être rebaptisé SQL).", a: ["SEQUEL", "sequel"], ph: "un mot", exp: "SEQUEL, puis renommé SQL." },
    { type: "qcm", q: "INSERT, UPDATE et DELETE appartiennent à…", opts: ["Le LDD (DDL)", "Le LMD (DML)", "Le LCD (DCL)", "Le TCL"], a: 1, exp: "Ce sont les commandes de manipulation des données (LMD)." },
    { type: "vf", q: "La bonne pratique recommandée est d'écrire les mots-clés SQL en MAJUSCULES.", a: true, exp: "Vrai : SELECT, FROM, CREATE… en majuscules, pour la lisibilité." },
    { type: "qcm", q: "En quelle année est parue la première norme SQL (SQL1) ?", opts: ["1970", "1987", "1999", "2011"], a: 1, exp: "SQL1 date de 1987 ; SQL2 de 1992 ; SQL3 de 1999." },
    { type: "input", q: "Complète : un texte ignoré par le SGBD, servant à expliquer une requête, s'appelle un ______.", a: ["commentaire"], ph: "un mot", exp: "Un commentaire (introduit par -- , # ou /* */)." }
  ],
  final: {
    title: "Exercice final — Classer les commandes",
    intro: `<p>Pour chaque commande, retrouve à quelle famille elle appartient : LDD (structure), LMD (contenu), LID (lecture) ou LCD (droits).</p>`,
    questions: [
      { type: "qcm", q: "CREATE TABLE appartient à…", opts: ["LDD (structure)", "LMD (contenu)", "LID (lecture)", "LCD (droits)"], a: 0, exp: "Créer une table = définir la structure = LDD." },
      { type: "qcm", q: "SELECT appartient à…", opts: ["LDD", "LMD", "LID (interrogation / lecture)", "LCD"], a: 2, exp: "SELECT interroge les données : LID." },
      { type: "qcm", q: "INSERT appartient à…", opts: ["LDD", "LMD (manipulation du contenu)", "LID", "LCD"], a: 1, exp: "Ajouter des lignes = manipuler le contenu = LMD." },
      { type: "qcm", q: "GRANT appartient à…", opts: ["LDD", "LMD", "LID", "LCD (contrôle des droits)"], a: 3, exp: "Accorder un privilège = LCD." },
      { type: "vf", q: "DROP TABLE (supprimer une table entière) relève du LDD.", a: true, exp: "DROP agit sur la structure : c'est du LDD, comme CREATE et ALTER." }
    ],
    solution: `<pre class="pseudo">-- Les quatre familles declaratives de SQL :
-- LDD (structure) : CREATE, ALTER, DROP
-- LMD (contenu)   : INSERT, UPDATE, DELETE
-- LID (lecture)   : SELECT
-- LCD (droits)    : GRANT, REVOKE
--
-- Astuce : LDD construit les murs, LMD remplit les meubles,
--          LID va chercher dedans, LCD gere les cles d'acces.</pre>
<p>Tu connais la carte du langage SQL. Demain : on entre dans le concret avec MySQL / MariaDB.</p>`
  }
};
</script>

  ]
