<script>
var DAY = {
  num: 3,
  title: "Clés primaires, clés étrangères et intégrité",
  subtitle: "Identifier chaque ligne, relier les tables, garantir la cohérence.",
  theory: `
<h3>1. La clé primaire</h3>
<p>Une <strong>clé primaire</strong> (en anglais <em>primary key</em>) est l'ensemble minimal de colonnes qui permet d'identifier de façon <strong>unique</strong> chaque ligne d'une table. Sa valeur ne doit exister que pour une seule ligne : elle ne se répète jamais dans la table. C'est le mécanisme fondamental pour retrouver un tuple précis.</p>
<p>Une clé primaire est dite <strong>simple</strong> si elle ne comporte qu'une seule colonne, et <strong>composée</strong> (ou <em>composite</em>) si elle en combine plusieurs.</p>
<div class="tip">Exemples du support : la clé primaire de CLIENT est NOCLI (un numéro de client est unique). Celle de COMPTE est NOCOMPTE. Mais celle de COMPTE-CLIENT est <strong>composée</strong> : (NOCOMPTE, NOCLI), car ni NOCOMPTE ni NOCLI ne sont uniques à eux seuls dans cette table d'association.</div>

<h3>2. Choisir une bonne clé primaire</h3>
<p>Le support donne trois critères pour choisir une clé primaire : sa valeur doit être <strong>unique</strong>, de <strong>longueur raisonnable</strong>, et <strong>non modifiable</strong> (car elle est recopiée dans d'autres tables : la changer obligerait à la changer partout).</p>
<p>C'est pourquoi on déconseille le numéro de téléphone ou le nom comme clé (non uniques). Une solution très courante est de créer une colonne dédiée à <strong>auto-incrément</strong> (numéro automatique) : le SGBD calcule lui-même une valeur unique. On parle alors de <strong>clé artificielle</strong>.</p>
<div class="tip">Une table peut avoir plusieurs <strong>clés candidates</strong> (colonnes capables d'identifier les lignes). On en choisit une comme clé primaire ; les autres deviennent des <strong>clés alternatives</strong>. Un SGBDR n'autorise qu'<strong>une seule</strong> clé primaire par table.</div>

<h3>3. Clé primaire et valeur NULL</h3>
<p>Une valeur <strong>NULL</strong> représente une information manquante, inconnue ou inapplicable. Attention : NULL n'est <strong>pas</strong> zéro, ni une chaîne vide, c'est une valeur inconnue.</p>
<div class="warn">Puisque la clé primaire identifie chaque ligne de manière unique, aucune de ses colonnes ne peut être NULL. C'est la <strong>contrainte d'intégrité de la clé</strong> : une valeur de clé primaire doit être à la fois UNIQUE et NON NULLE.</div>
<pre class="pseudo">-- Table DEPT (DEPARTEMENT est la cle primaire)
--   DEPARTEMENT | NOM          | LIEU   | BUDGET
--   20          | Ventes       | Annecy | 1700000
--   10          | Marketing    | Lille  | 2000000
--   10          | Recherche    | Lille  | 1500000   <- REFUSE : 10 existe deja (doublon de cle)
--   (vide)      | Comptabilite | Nancy  | 1200000   <- REFUSE : la cle ne peut pas etre NULL
--   15          | Informatique | Annecy | 1500000   <- OK : aucune contrainte violee</pre>

<h3>4. La clé étrangère</h3>
<p>Une <strong>clé étrangère</strong> (en anglais <em>foreign key</em>) est une ou plusieurs colonnes d'une table qui font référence à la <strong>clé primaire d'une autre table</strong>, afin d'établir un lien entre les deux tables. On obtient ce lien en recopiant la clé primaire de la table « parent » dans la table « enfant ».</p>
<p>La table qui contient la clé étrangère est appelée table <strong>enfant</strong> (ou fils) ; celle qui contient la clé primaire référencée est la table <strong>parent</strong> (ou père).</p>
<div class="tip">Exemple du support : dans COMPTE-CLIENT, la colonne NOCLI est une <strong>clé étrangère</strong> qui pointe vers NOCLI (clé primaire) de la table CLIENT ; NOCOMPTE pointe vers COMPTE. Grâce à ces liens, on sait quels comptes possède un client donné, sans recopier son nom et son adresse partout.</div>

<h3>5. L'intégrité référentielle</h3>
<p>La règle qui régit les clés étrangères s'appelle la <strong>contrainte d'intégrité référentielle</strong> : la valeur d'une clé étrangère doit <strong>soit être NULL, soit correspondre à une valeur de clé primaire existante</strong> dans la table parent.</p>
<div class="warn">Conséquence : on ne peut pas créer un enregistrement enfant qui référence un parent inexistant (ce serait un enregistrement <strong>orphelin</strong>). Il faut créer le parent avant l'enfant, et supprimer l'enfant avant le parent.</div>
<pre class="pseudo">-- DEPARTEMENT (parent)         PERSONNEL (enfant, DEPT_EMP = cle etrangere -> ID)
--   ID | NOM                     ID_EMP | NOM_EMP | DEPT_EMP
--   10 | Comptabilite            9213   | Pasto   | 30    <- REFUSE : le departement 30 n'existe pas
--   40 | Ventes                  5932   | Chatelier | NULL <- OK : NULL est autorise pour une cle etrangere</pre>`,
  exercises: [
    { type: "input", q: "Complète : la colonne qui identifie de façon unique chaque ligne d'une table est la ______ (deux mots, le premier suffit).", a: ["cle", "cle primaire"], ph: "un mot", exp: "La clé primaire : unique et jamais répétée." },
    { type: "qcm", q: "La clé primaire de la table d'association COMPTE-CLIENT est…", opts: ["NOCLI seul", "NOCOMPTE seul", "Composée : (NOCOMPTE, NOCLI)", "Il n'y en a pas"], a: 2, exp: "Ni NOCOMPTE ni NOCLI ne sont uniques seuls : la clé est composée." },
    { type: "vf", q: "Une colonne de clé primaire peut contenir la valeur NULL.", a: false, exp: "Faux : la clé primaire ne peut jamais être NULL (contrainte d'intégrité de la clé)." },
    { type: "input", q: "Complète : une clé qui combine plusieurs colonnes est dite ______ (ou composite).", a: ["composee", "composee"], ph: "un mot", exp: "Une clé composée (composite), à l'inverse d'une clé simple." },
    { type: "qcm", q: "Pourquoi éviter le numéro de téléphone comme clé primaire ?", opts: ["Il est trop court", "Il pourrait être partagé par plusieurs personnes et n'est donc pas forcément unique", "Il est toujours NULL", "C'est interdit par MySQL"], a: 1, exp: "Une clé doit être unique ; un numéro de téléphone peut être partagé." },
    { type: "input", q: "Complète : une colonne qui référence la clé primaire d'une autre table est une clé ______.", a: ["etrangere"], ph: "un mot", exp: "La clé étrangère (foreign key) établit le lien entre deux tables." },
    { type: "qcm", q: "La table qui contient la clé étrangère est appelée…", opts: ["Table parent (père)", "Table enfant (fils)", "Table vide", "Table candidate"], a: 1, exp: "Enfant = contient la clé étrangère ; parent = contient la clé primaire référencée." },
    { type: "vf", q: "La valeur d'une clé étrangère doit soit être NULL, soit correspondre à une valeur de clé primaire existante dans la table parent.", a: true, exp: "C'est exactement la contrainte d'intégrité référentielle." },
    { type: "input", q: "Complète : une valeur ______ représente une information manquante ou inconnue (ce n'est ni zéro ni une chaîne vide).", a: ["null", "nulle"], ph: "un mot", exp: "NULL : valeur inconnue / manquante." },
    { type: "qcm", q: "Un enregistrement enfant qui référence un parent inexistant est appelé…", opts: ["Un doublon", "Un orphelin", "Une clé candidate", "Un domaine"], a: 1, exp: "Un enregistrement orphelin : c'est ce que l'intégrité référentielle interdit." },
    { type: "vf", q: "Une même table peut posséder plusieurs clés étrangères mais une seule clé primaire.", a: true, exp: "Vrai : COMPTE-CLIENT a deux clés étrangères (NOCLI, NOCOMPTE) et une seule clé primaire (composée)." },
    { type: "input", q: "Complète : quand une colonne à valeur automatique sert de clé, on parle de clé ______ (artificielle / auto-incrément) — donne le mot « artificielle ».", a: ["artificielle"], ph: "un mot", exp: "Une clé artificielle générée par auto-incrément." },
    { type: "qcm", q: "Dans quel ordre faut-il créer les enregistrements ?", opts: ["L'enfant d'abord, puis le parent", "Le parent d'abord, puis l'enfant", "Peu importe l'ordre", "Toujours les deux en même temps obligatoirement"], a: 1, exp: "Le parent doit exister avant l'enfant qui le référence." },
    { type: "qcm", q: "Les clés candidates non retenues comme clé primaire s'appellent…", opts: ["Des clés étrangères", "Des clés alternatives", "Des orphelins", "Des domaines"], a: 1, exp: "On choisit une clé candidate comme primaire ; les autres sont alternatives." },
    { type: "vf", q: "Grâce aux clés étrangères, on évite de recopier toutes les informations d'un client dans chaque table qui le mentionne.", a: true, exp: "Vrai : seule la valeur de la clé est répétée, ce qui évite la redondance." }
  ],
  final: {
    title: "Exercice final — Valider des insertions",
    intro: `<p>La table DEPARTEMENT (parent) contient les départements 10 et 40. PERSONNEL (enfant) a une clé étrangère DEPT_EMP qui référence DEPARTEMENT.ID. Décide, pour chaque cas, si l'insertion est acceptée ou refusée.</p>`,
    questions: [
      { type: "qcm", q: "Insérer un employé avec DEPT_EMP = 40 :", opts: ["Refusé", "Accepté (le département 40 existe)", "Refusé car NULL interdit", "Impossible à dire"], a: 1, exp: "40 existe dans DEPARTEMENT : intégrité respectée." },
      { type: "qcm", q: "Insérer un employé avec DEPT_EMP = 30 :", opts: ["Accepté", "Refusé (le département 30 n'existe pas dans le parent)", "Accepté car 30 > 10", "Refusé car doublon"], a: 1, exp: "30 n'existe pas : ce serait un orphelin, refusé." },
      { type: "qcm", q: "Insérer un employé avec DEPT_EMP = NULL :", opts: ["Refusé", "Accepté (NULL est autorisé pour une clé étrangère)", "Refusé car NULL est zéro", "Impossible"], a: 1, exp: "Une clé étrangère peut valoir NULL (employé sans département)." },
      { type: "vf", q: "Insérer un deuxième département avec ID = 10 serait refusé (doublon de clé primaire).", a: true, exp: "La clé primaire doit rester unique." },
      { type: "input", q: "Complète : la règle qui lie clé étrangère et clé primaire s'appelle l'intégrité ______.", a: ["referentielle"], ph: "un mot", exp: "L'intégrité référentielle." }
    ],
    solution: `<pre class="pseudo">-- Regle : cle etrangere = NULL  OU  = une cle primaire existante du parent
-- DEPARTEMENT (parent) : ID = 10, 40
--
-- DEPT_EMP = 40   -> ACCEPTE  (40 existe)
-- DEPT_EMP = 30   -> REFUSE   (30 n'existe pas -> orphelin interdit)
-- DEPT_EMP = NULL -> ACCEPTE  (NULL autorise pour une cle etrangere)
-- Nouveau departement ID = 10 -> REFUSE (cle primaire deja utilisee)
--
-- Cle primaire : UNIQUE + NON NULL   |   Cle etrangere : NULL ou valeur existante</pre>
<p>Tu comprends comment les tables se relient et restent cohérentes. Demain : le langage SQL et ses grandes familles de commandes.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  { id: "initbdd-j03", checklist: ["As-tu indiqué la clé primaire de chaque table, en précisant si elle est simple ou composée ?","As-tu repéré chaque clé étrangère et vers quelle table elle pointe ?","As-tu rappelé qu'une table a une seule clé primaire mais peut avoir plusieurs clés étrangères ?"], title: "Repérer les clés", level: 2,
    statement: "On a deux tables : COMPTE(NOCOMPTE, SOLDECOMPTE) et COMPTE-CLIENT(NOCOMPTE, NOCLI). Indique la clé primaire de chaque table, précise si elle est simple ou composée, et identifie la (ou les) clé(s) étrangère(s) de COMPTE-CLIENT.",
    hints: [
      "Cherche la colonne (ou combinaison) qui identifie chaque ligne sans doublon.",
      "Dans COMPTE-CLIENT, NOCOMPTE seul se répète : ce n'est pas une clé primaire à lui seul.",
      "Une clé étrangère pointe vers la clé primaire d'une autre table."
    ],
    solution: "-- Table COMPTE :\n--   Cle primaire = NOCOMPTE  (SIMPLE : une seule colonne, chaque numero est unique)\n--\n-- Table COMPTE-CLIENT :\n--   Cle primaire = (NOCOMPTE, NOCLI)  (COMPOSEE : ni l'un ni l'autre n'est unique seul)\n--   Cle etrangere 1 : NOCOMPTE  -> reference COMPTE.NOCOMPTE\n--   Cle etrangere 2 : NOCLI     -> reference CLIENT.NOCLI\n--\n-- Une table peut avoir PLUSIEURS cles etrangeres mais UNE SEULE cle primaire.",
    note: "COMPTE-CLIENT est une table d'association : sa clé primaire composée est justement formée de ses deux clés étrangères. C'est un schéma très fréquent pour représenter un lien « plusieurs à plusieurs »." }
  ]
};
