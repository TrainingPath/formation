<script>
var DAY = {
  num: 10,
  title: "Insérer des données (INSERT)",
  subtitle: "Ajouter des lignes dans une table avec INSERT INTO ... VALUES.",
  theory: `
<h3>1. L'instruction INSERT</h3>
<p>Pour ajouter des lignes dans une table, on utilise l'instruction <strong>INSERT</strong> (langage de manipulation, LMD). Sa forme la plus simple fournit une liste de valeurs à insérer.</p>
<pre class="pseudo">-- forme generale
INSERT INTO nomTable (colonne1, colonne2, ...)   -- dans quelle table et quelles colonnes
       VALUES (valeur1, valeur2, ...);           -- les valeurs, dans le meme ordre</pre>
<div class="warn">Les valeurs de VALUES doivent correspondre, dans l'ordre et par le type, aux colonnes citées. Le texte et les dates s'écrivent entre apostrophes simples ('...') ; les nombres, sans apostrophes.</div>

<h3>2. Renseigner toutes les colonnes</h3>
<p>Si on donne une valeur pour chaque colonne de la table, dans l'ordre exact de sa structure, on peut omettre la liste des colonnes. Mais l'écrire reste une bonne pratique.</p>
<pre class="pseudo">-- table Compagnie (comp, nrue, rue, ville, nomComp)
INSERT INTO Compagnie (comp, nrue, rue, ville, nomComp)
       VALUES ('AF', 10, 'Gambetta', 'Paris', 'Air France');   -- toutes les colonnes renseignees

-- equivalent SANS lister les colonnes (valeurs dans l'ordre de la table)
INSERT INTO Compagnie VALUES ('SING', 7, 'Camparols', 'Singapour', 'Singapore AL');</pre>

<h3>3. La valeur par défaut et NULL</h3>
<p>On peut demander explicitement la valeur par défaut d'une colonne avec le mot-clé <strong>DEFAULT</strong>, ou une valeur inconnue avec <strong>NULL</strong>.</p>
<pre class="pseudo">INSERT INTO Compagnie (comp, nrue, rue, ville, nomComp)
       VALUES ('AN1', DEFAULT, 'Hoche', 'Blagnac', 'Air Nul1');   -- nrue prendra sa valeur par defaut

INSERT INTO Compagnie (comp, nrue, rue, ville, nomComp)
       VALUES ('AN2', NULL, 'Foch', 'Blagnac', 'Air Nul2');       -- nrue explicitement inconnue (NULL)</pre>

<h3>4. Ne renseigner que certaines colonnes</h3>
<p>On peut ne citer que quelques colonnes. Les colonnes non citées reçoivent alors <strong>implicitement</strong> leur valeur par défaut (ou NULL si aucune valeur par défaut n'est prévue et que la colonne l'autorise).</p>
<pre class="pseudo">INSERT INTO Compagnie (comp, rue, nomComp)                -- on ne cite que 3 colonnes
       VALUES ('AC', 'Champs Elysees', 'Air Company');   -- nrue et ville : valeurs par defaut implicites</pre>
<div class="tip">Bonne pratique du support : hormis pour tes tests, cite toujours explicitement le nom des colonnes que tu remplis. Ton code sera plus clair et résistera mieux aux évolutions de la table (ajout d'une colonne, etc.).</div>

<h3>5. Insérer plusieurs lignes d'un coup</h3>
<p>On peut ajouter plusieurs enregistrements en une seule instruction, en séparant les groupes de valeurs par des virgules.</p>
<pre class="pseudo">INSERT INTO Compagnie (comp, rue, ville, nomComp) VALUES
       ('AF',   'Gambetta',      'Paris',     'Air France'),   -- ligne 1
       ('SING', 'Camparols',     'Singapour', 'Singapore AL'), -- ligne 2
       ('CAST', 'Champs Elysees','Paris',     'Castanet Air'); -- ligne 3</pre>

<h3>6. Respecter les contraintes</h3>
<p>Une insertion échoue si elle viole une contrainte définie au Jour 8. Le SGBD refuse alors la ligne.</p>
<pre class="pseudo">-- REFUSE : deux fois la meme cle primaire 'AF' (violation de PRIMARY KEY / UNIQUE)
INSERT INTO Compagnie (comp, nomComp) VALUES ('AF', 'Doublon');

-- REFUSE : nomComp est NOT NULL, on ne peut pas le laisser NULL
INSERT INTO Compagnie (comp, nomComp) VALUES ('XX', NULL);</pre>
<div class="warn">À retenir : INSERT ajoute des lignes, mais les contraintes (PRIMARY KEY, NOT NULL, UNIQUE, clé étrangère) veillent : toute valeur interdite est rejetée.</div>`,
  exercises: [
    { type: "input", q: "Complète : pour ajouter une ligne, on écrit ______ INTO Compagnie (...) VALUES (...) ;", a: ["insert"], ph: "un mot-clé", exp: "INSERT INTO ... VALUES ..." },
    { type: "qcm", q: "Dans INSERT INTO t (a,b) VALUES (1,2), les valeurs 1 et 2 correspondent…", opts: ["À deux lignes différentes", "Respectivement aux colonnes a et b, dans l'ordre", "À la clé primaire uniquement", "À rien de précis"], a: 1, exp: "Les valeurs suivent l'ordre des colonnes citées." },
    { type: "vf", q: "Le texte et les dates s'écrivent entre apostrophes simples dans un INSERT.", a: true, exp: "Vrai : 'Paris', '2026-07-26'. Les nombres, eux, sans apostrophes." },
    { type: "input", q: "Complète : pour demander explicitement la valeur par défaut d'une colonne, on écrit le mot-clé ______.", a: ["default"], ph: "un mot-clé", exp: "DEFAULT insère la valeur par défaut de la colonne." },
    { type: "qcm", q: "Si on ne cite que certaines colonnes, les colonnes non citées reçoivent…", opts: ["Une erreur", "Leur valeur par défaut (ou NULL) implicitement", "La valeur 0 obligatoirement", "La clé primaire"], a: 1, exp: "Les colonnes omises prennent leur valeur par défaut implicite (ou NULL)." },
    { type: "input", q: "Complète : pour insérer une valeur inconnue dans une colonne qui l'autorise, on écrit ______.", a: ["null"], ph: "un mot-clé", exp: "NULL représente une valeur inconnue / manquante." },
    { type: "qcm", q: "Comment insérer trois lignes en une seule instruction INSERT ?", opts: ["C'est impossible", "En séparant les groupes de valeurs par des virgules : VALUES (...),(...),(...)", "En répétant le mot INSERT trois fois dans la même ligne", "En utilisant SELECT"], a: 1, exp: "On liste plusieurs groupes de valeurs séparés par des virgules." },
    { type: "vf", q: "Insérer deux fois la même valeur de clé primaire est refusé.", a: true, exp: "Vrai : la clé primaire doit rester unique." },
    { type: "input", q: "Complète : on écrit INSERT INTO Compagnie ______ ('AF', 10, 'Gambetta', 'Paris', 'Air France') ; (mot-clé avant les valeurs).", a: ["values"], ph: "un mot-clé", exp: "VALUES introduit la liste des valeurs." },
    { type: "qcm", q: "Une insertion qui met NULL dans une colonne déclarée NOT NULL…", opts: ["Est acceptée", "Est refusée par le SGBD", "Remplit la colonne avec 0", "Supprime la ligne"], a: 1, exp: "NOT NULL interdit NULL : l'insertion est rejetée." },
    { type: "vf", q: "Si on renseigne toutes les colonnes dans l'ordre de la table, on peut omettre la liste des colonnes.", a: true, exp: "Vrai, mais citer les colonnes reste la bonne pratique." },
    { type: "input", q: "Complète : quel type de guillemet entoure les chaînes de caractères ? L'apostrophe ______ (simple / double). Écris « simple ».", a: ["simple"], ph: "un mot", exp: "Les apostrophes simples : 'texte'." },
    { type: "qcm", q: "Pourquoi le support conseille-t-il de citer explicitement les colonnes ?", opts: ["Pour ralentir l'insertion", "Pour un code plus clair et robuste face aux évolutions de la table", "C'est obligatoire", "Pour éviter d'écrire VALUES"], a: 1, exp: "Nommer les colonnes rend le code lisible et durable." },
    { type: "qcm", q: "INSERT appartient à quelle famille SQL ?", opts: ["LDD (structure)", "LMD (manipulation des données)", "LID (lecture)", "LCD (droits)"], a: 1, exp: "INSERT manipule le contenu : c'est du LMD." },
    { type: "input", q: "Complète : dans une insertion, les nombres s'écrivent ______ apostrophes (avec / sans). Écris « sans ».", a: ["sans"], ph: "un mot", exp: "Les nombres n'ont pas d'apostrophes : 10, pas '10'." }
  ],
  final: {
    title: "Exercice final — Remplir la table Client",
    intro: `<p>La table <code>Client(nocli, nomcli, prenomcli, ville)</code> est vide. La colonne <code>ville</code> a pour valeur par défaut 'Bruxelles'. On veut insérer plusieurs clients du support.</p>`,
    questions: [
      { type: "qcm", q: "Comment insérer le client ('PERS01','Perron','Sylvie','Mons') en citant les colonnes ?", opts: ["INSERT Client VALUES ...", "INSERT INTO Client (nocli, nomcli, prenomcli, ville) VALUES ('PERS01','Perron','Sylvie','Mons')", "ADD INTO Client ...", "INSERT Client SET ..."], a: 1, exp: "INSERT INTO table (colonnes) VALUES (...)." },
      { type: "input", q: "Complète : pour laisser la ville prendre 'Bruxelles' sans la citer, on OMET la colonne ______ dans la liste.", a: ["ville"], ph: "une colonne", exp: "Colonne omise = valeur par défaut implicite (ici 'Bruxelles')." },
      { type: "vf", q: "On peut insérer trois clients en une seule instruction avec VALUES (...),(...),(...).", a: true, exp: "Vrai : plusieurs groupes de valeurs séparés par des virgules." },
      { type: "qcm", q: "Insérer un deuxième client avec nocli = 'PERS01' (déjà utilisé) :", opts: ["Accepté", "Refusé (doublon de clé primaire)", "Remplace l'ancien", "Crée une nouvelle table"], a: 1, exp: "nocli est clé primaire : pas de doublon." },
      { type: "input", q: "Complète : les chaînes 'Perron', 'Sylvie' sont entourées d'apostrophes ______.", a: ["simples", "simple"], ph: "un mot", exp: "Apostrophes simples pour le texte." }
    ],
    solution: `<pre class="pseudo">-- plusieurs clients en une seule instruction ; ville omise -> defaut 'Bruxelles'
INSERT INTO Client (nocli, nomcli, prenomcli) VALUES
       ('PERS01', 'Perron',   'Sylvie'),    -- ville prendra 'Bruxelles' (defaut)
       ('BISG01', 'Bisson',   'Gaston'),
       ('DUFA01', 'Dufresne', 'Alice');

-- un client avec une ville explicite :
INSERT INTO Client (nocli, nomcli, prenomcli, ville)
       VALUES ('LABP01', 'Labbe', 'Pierre', 'Mons');
-- Texte entre apostrophes simples ; colonnes omises -> valeur par defaut implicite.</pre>
<p>Tes tables se remplissent. Demain : modifier et supprimer des lignes (UPDATE, DELETE, TRUNCATE).</p>`
  }
};
</script>
