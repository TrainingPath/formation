<script>
var DAY = {
  num: 14,
  title: "Trier et limiter (ORDER BY, LIMIT)",
  subtitle: "Classer le résultat et n'en garder qu'une partie.",
  theory: `
<h3>1. ORDER BY : trier le résultat</h3>
<p>La clause <strong>ORDER BY</strong> trie les lignes du résultat selon une ou plusieurs colonnes. Elle se place <strong>à la fin</strong> de la requête et ne concerne que l'affichage (elle ne change pas l'ordre interne des lignes dans la table).</p>
<pre class="pseudo">SELECT nom, nbHVol
FROM   Pilote
ORDER BY nom;                      -- trie les pilotes par nom, dans l'ordre alphabetique</pre>

<h3>2. Croissant (ASC) ou décroissant (DESC)</h3>
<p>Par défaut, le tri est <strong>croissant</strong> (mot-clé facultatif <strong>ASC</strong>) : de A à Z, du plus petit au plus grand. Pour l'inverser, on ajoute <strong>DESC</strong> (décroissant).</p>
<pre class="pseudo">SELECT nom, nbHVol FROM Pilote ORDER BY nbHVol ASC;    -- du moins au plus d'heures (croissant, defaut)
SELECT nom, nbHVol FROM Pilote ORDER BY nbHVol DESC;   -- du plus au moins d'heures (decroissant)</pre>
<div class="tip">ASC est la valeur par défaut : <code>ORDER BY nom</code> et <code>ORDER BY nom ASC</code> donnent le même résultat. On écrit DESC uniquement quand on veut l'ordre inverse.</div>

<h3>3. Trier sur plusieurs colonnes</h3>
<p>On peut trier sur plusieurs critères, séparés par des virgules. Le premier critère est prioritaire ; le second départage seulement les lignes égales sur le premier.</p>
<pre class="pseudo">SELECT nom, prenom
FROM   Employe
ORDER BY nom ASC, prenom ASC;      -- d'abord par nom ; a nom egal, on departage par prenom</pre>
<div class="tip">Exemple du support : en triant seulement par nom, deux « Brown » ne sont pas départagés. En ajoutant le prénom comme second critère, « Brown George » passe correctement avant « Brown Molly ». Chaque colonne peut avoir son propre sens : <code>ORDER BY titre ASC, nom DESC</code>.</div>

<h3>4. LIMIT : ne garder que quelques lignes</h3>
<p>La clause <strong>LIMIT</strong> (propre à MySQL/MariaDB) restreint le nombre de lignes renvoyées. Très pratique combinée à ORDER BY pour obtenir un « top N ».</p>
<pre class="pseudo">SELECT nom, nbHVol
FROM   Pilote
ORDER BY nbHVol DESC               -- du plus grand nombre d'heures au plus petit
LIMIT 3;                           -- ne garder que les 3 premieres lignes (les 3 plus experimentes)</pre>

<h3>5. L'ordre des clauses</h3>
<p>Dans une requête, les clauses s'écrivent toujours dans le même ordre : <strong>SELECT ... FROM ... WHERE ... ORDER BY ... LIMIT ...</strong>.</p>
<pre class="pseudo">SELECT nom, nbHVol                 -- 1) quelles colonnes
FROM   Pilote                      -- 2) quelle table
WHERE  compa = 'AF'                -- 3) quelles lignes (filtre)
ORDER BY nbHVol DESC               -- 4) comment trier
LIMIT 2;                           -- 5) combien de lignes garder</pre>
<div class="warn">Retenir l'enchaînement : on filtre (WHERE), PUIS on trie (ORDER BY), PUIS on limite (LIMIT). ORDER BY se place toujours avant LIMIT.</div>`,
  exercises: [
    { type: "input", q: "Complète : la clause qui trie le résultat est ______ ______ (deux mots).", a: ["order by", "orderby"], ph: "deux mots-clés", exp: "ORDER BY colonne." },
    { type: "qcm", q: "Par défaut, ORDER BY nom trie…", opts: ["En ordre décroissant", "En ordre croissant (A vers Z)", "Au hasard", "Par clé primaire"], a: 1, exp: "Le tri par défaut est croissant (ASC)." },
    { type: "input", q: "Complète : pour un tri décroissant, on ajoute le mot-clé ______ après la colonne.", a: ["desc"], ph: "un mot-clé", exp: "DESC = décroissant ; ASC = croissant (par défaut)." },
    { type: "qcm", q: "ORDER BY nbHVol DESC classe les pilotes…", opts: ["Du moins au plus d'heures", "Du plus au moins d'heures", "Par nom", "Sans ordre"], a: 1, exp: "DESC = du plus grand au plus petit." },
    { type: "vf", q: "ASC est le sens de tri par défaut (on peut donc l'omettre).", a: true, exp: "Vrai : ORDER BY nom et ORDER BY nom ASC sont équivalents." },
    { type: "input", q: "Complète : la clause qui limite le nombre de lignes renvoyées (propre à MySQL) est ______.", a: ["limit"], ph: "un mot-clé", exp: "LIMIT n restreint le résultat à n lignes." },
    { type: "qcm", q: "Pour trier d'abord par nom, puis départager les noms égaux par prénom :", opts: ["ORDER BY nom OR prenom", "ORDER BY nom, prenom", "ORDER BY nom AND prenom", "ORDER BY nom LIMIT prenom"], a: 1, exp: "On sépare les critères par une virgule ; le premier est prioritaire." },
    { type: "vf", q: "ORDER BY ne modifie que l'affichage, pas l'ordre interne des lignes dans la table.", a: true, exp: "Vrai : le tri concerne uniquement le résultat affiché." },
    { type: "input", q: "Complète : pour obtenir les 3 pilotes les plus expérimentés, on ajoute après le tri ______ 3.", a: ["limit"], ph: "un mot-clé", exp: "ORDER BY nbHVol DESC LIMIT 3." },
    { type: "qcm", q: "Dans une requête, où se place ORDER BY par rapport à WHERE ?", opts: ["Avant WHERE", "Après WHERE", "Avant FROM", "Peu importe"], a: 1, exp: "Ordre : SELECT ... FROM ... WHERE ... ORDER BY ..." },
    { type: "qcm", q: "ORDER BY titre ASC, nom DESC signifie…", opts: ["Tout est croissant", "Croissant par titre, puis décroissant par nom à titre égal", "Tout est décroissant", "On ne peut pas mélanger ASC et DESC"], a: 1, exp: "Chaque colonne a son propre sens de tri." },
    { type: "input", q: "Complète : pour trier du plus petit au plus grand nombre d'heures, ORDER BY nbHVol ______ .", a: ["asc"], ph: "un mot-clé", exp: "ASC = croissant (facultatif car par défaut)." },
    { type: "vf", q: "LIMIT se place avant ORDER BY dans la requête.", a: false, exp: "Faux : ORDER BY vient d'abord, LIMIT ensuite." },
    { type: "qcm", q: "Quel est le bon ordre des clauses ?", opts: ["SELECT, WHERE, FROM, ORDER BY", "SELECT, FROM, WHERE, ORDER BY, LIMIT", "FROM, SELECT, LIMIT, WHERE", "ORDER BY, SELECT, FROM"], a: 1, exp: "SELECT ... FROM ... WHERE ... ORDER BY ... LIMIT ..." },
    { type: "input", q: "Complète : SELECT nom FROM Pilote ORDER BY nom ______ 5 ; ne garde que 5 lignes.", a: ["limit"], ph: "un mot-clé", exp: "LIMIT 5 restreint à 5 lignes." }
  ],
  final: {
    title: "Exercice final — Classer et limiter",
    intro: `<p>Table <code>Pilote(brevet, nom, nbHVol, compa)</code>. Compose les requêtes.</p>`,
    questions: [
      { type: "qcm", q: "Tous les pilotes classés par nom de A à Z :", opts: ["SELECT nom FROM Pilote ORDER BY nom DESC", "SELECT nom FROM Pilote ORDER BY nom", "SELECT nom FROM Pilote LIMIT nom", "SELECT nom ORDER Pilote"], a: 1, exp: "ORDER BY nom (croissant par défaut)." },
      { type: "qcm", q: "Les pilotes du plus grand au plus petit nombre d'heures :", opts: ["ORDER BY nbHVol", "ORDER BY nbHVol ASC", "ORDER BY nbHVol DESC", "ORDER BY DESC nbHVol"], a: 2, exp: "DESC = du plus grand au plus petit." },
      { type: "qcm", q: "Les 2 pilotes les plus expérimentés :", opts: ["ORDER BY nbHVol DESC LIMIT 2", "LIMIT 2 ORDER BY nbHVol", "ORDER BY nbHVol ASC LIMIT 2", "TOP 2 nbHVol"], a: 0, exp: "Tri décroissant puis LIMIT 2." },
      { type: "input", q: "Complète : trier par compagnie puis, à compagnie égale, par nom : ORDER BY compa, ______ .", a: ["nom"], ph: "une colonne", exp: "ORDER BY compa, nom : le second critère départage." },
      { type: "vf", q: "ORDER BY se place après WHERE et avant LIMIT.", a: true, exp: "Vrai : ...WHERE... ORDER BY... LIMIT..." }
    ],
    solution: `<pre class="pseudo">-- tri alphabetique par nom :
SELECT nom FROM Pilote ORDER BY nom;

-- du plus au moins d'heures :
SELECT nom, nbHVol FROM Pilote ORDER BY nbHVol DESC;

-- les 2 pilotes les plus experimentes :
SELECT nom, nbHVol FROM Pilote ORDER BY nbHVol DESC LIMIT 2;

-- filtrer + trier + limiter (l'ordre des clauses est fixe) :
SELECT nom, nbHVol FROM Pilote
WHERE compa = 'AF'
ORDER BY nbHVol DESC
LIMIT 2;</pre>
<p>Tu sais classer et limiter. Demain : combiner des conditions avec AND, OR et NOT.</p>`
  }
};
