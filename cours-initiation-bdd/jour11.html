<script>
var DAY = {
  num: 11,
  title: "Mettre à jour et supprimer (UPDATE, DELETE, TRUNCATE)",
  subtitle: "Modifier des lignes existantes et en supprimer, sans catastrophe.",
  theory: `
<h3>1. UPDATE : modifier des lignes existantes</h3>
<p>L'instruction <strong>UPDATE</strong> met à jour la valeur d'une ou plusieurs colonnes, pour les lignes choisies par une condition <strong>WHERE</strong>.</p>
<pre class="pseudo">UPDATE nomTable
   SET colonne1 = valeur1              -- nouvelle valeur a affecter
 WHERE condition;                       -- pour QUELLES lignes (tres important !)</pre>
<pre class="pseudo">-- exemple : changer le numero de rue de la compagnie 'AN1'
UPDATE Compagnie
   SET nrue = 50
 WHERE comp = 'AN1';                    -- seule la ligne de la compagnie 'AN1' est modifiee</pre>

<h3>2. Le piège du WHERE oublié</h3>
<div class="warn">DANGER : si tu oublies la clause WHERE, UPDATE modifie TOUTES les lignes de la table ! C'est l'erreur la plus dévastatrice du débutant. Vérifie toujours ton WHERE avant de valider.</div>
<pre class="pseudo">-- CATASTROPHE : sans WHERE, TOUTES les compagnies passent a Toulouse
UPDATE Compagnie SET ville = 'Toulouse';

-- CORRECT : une seule compagnie ciblee
UPDATE Compagnie SET ville = 'Toulouse' WHERE comp = 'AF';</pre>

<h3>3. Modifier plusieurs colonnes à la fois</h3>
<p>On peut affecter plusieurs colonnes en même temps, en les séparant par des virgules dans la clause SET.</p>
<pre class="pseudo">UPDATE Compagnie
   SET nrue = 14, ville = DEFAULT      -- deux colonnes : nrue = 14 ET ville = sa valeur par defaut
 WHERE comp = 'AN2';</pre>

<h3>4. DELETE : supprimer des lignes</h3>
<p>L'instruction <strong>DELETE FROM</strong> supprime les lignes qui satisfont la condition WHERE.</p>
<pre class="pseudo">DELETE FROM nomTable
 WHERE condition;                       -- supprime uniquement les lignes ciblees</pre>
<pre class="pseudo">-- supprimer tous les pilotes de la compagnie 'AF'
DELETE FROM Pilote WHERE compa = 'AF';</pre>
<div class="warn">Même danger qu'avec UPDATE : <code>DELETE FROM Pilote;</code> sans WHERE supprime TOUTES les lignes de la table (mais garde la structure). Toujours réfléchir au WHERE.</div>

<h3>5. DELETE et clés étrangères</h3>
<p>On ne peut pas supprimer une ligne parent encore référencée par un enfant (sauf option ON DELETE CASCADE / SET NULL vue au Jour 9). Le SGBD renvoie une erreur.</p>
<pre class="pseudo">-- REFUSE : la compagnie 'SING' est encore utilisee par des pilotes
DELETE FROM Compagnie WHERE comp = 'SING';
-- ERROR 1451 : Cannot delete or update a parent row: a foreign key constraint fails</pre>

<h3>6. TRUNCATE : vider une table entièrement</h3>
<p>L'instruction <strong>TRUNCATE</strong> (extension venue d'Oracle, reprise par MySQL) supprime <strong>tous</strong> les enregistrements d'une table d'un coup. Elle garde la structure de la table mais vide son contenu.</p>
<pre class="pseudo">TRUNCATE TABLE Pilote;                  -- vide entierement la table (toutes les lignes disparaissent)</pre>
<div class="tip">DELETE vs TRUNCATE : DELETE peut cibler certaines lignes (avec WHERE) et retourne le nombre de lignes supprimées ; TRUNCATE vide TOUT, plus rapidement (souvent en recréant la table), sans compter les lignes et sans mémoriser la dernière valeur d'auto-incrément. On ne peut pas « tronquer » une table référencée par des clés étrangères actives.</div>
<div class="warn">Ne pas confondre : DELETE / TRUNCATE vident le CONTENU (les lignes) ; DROP TABLE supprime la table ELLE-MÊME (structure comprise).</div>`,
  exercises: [
    { type: "input", q: "Complète : pour modifier des lignes existantes, on utilise l'instruction ______.", a: ["update"], ph: "un mot-clé", exp: "UPDATE ... SET ... WHERE ..." },
    { type: "qcm", q: "Que se passe-t-il si on exécute un UPDATE sans clause WHERE ?", opts: ["Rien", "Toutes les lignes de la table sont modifiées", "Une erreur bloque tout", "Seule la première ligne change"], a: 1, exp: "Sans WHERE, l'UPDATE s'applique à TOUTES les lignes : très dangereux." },
    { type: "input", q: "Complète : dans un UPDATE, la nouvelle valeur est indiquée après le mot-clé ______.", a: ["set"], ph: "un mot-clé", exp: "SET colonne = valeur." },
    { type: "qcm", q: "Comment modifier deux colonnes en un seul UPDATE ?", opts: ["Deux instructions obligatoires", "SET col1 = v1, col2 = v2", "SET col1 = v1 AND col2 = v2", "C'est impossible"], a: 1, exp: "On sépare les affectations par des virgules dans SET." },
    { type: "input", q: "Complète : pour supprimer des lignes, on écrit ______ FROM nomTable WHERE ... ;", a: ["delete"], ph: "un mot-clé", exp: "DELETE FROM table WHERE condition." },
    { type: "vf", q: "DELETE FROM Pilote ; (sans WHERE) supprime toutes les lignes de la table Pilote.", a: true, exp: "Vrai : sans WHERE, toutes les lignes sont supprimées (la structure reste)." },
    { type: "qcm", q: "TRUNCATE TABLE Pilote fait quoi ?", opts: ["Supprime la table entière (structure comprise)", "Vide toutes les lignes mais garde la structure", "Supprime une seule ligne", "Modifie une colonne"], a: 1, exp: "TRUNCATE vide tout le contenu ; la table (structure) subsiste." },
    { type: "qcm", q: "Différence clé entre DELETE et TRUNCATE ?", opts: ["Aucune", "DELETE peut cibler certaines lignes (WHERE) ; TRUNCATE vide tout, plus vite", "TRUNCATE garde des lignes", "DELETE supprime la structure"], a: 1, exp: "DELETE est sélectif ; TRUNCATE vide tout d'un coup." },
    { type: "input", q: "Complète : pour ne modifier QUE la compagnie 'AF', on ajoute la clause ______ comp = 'AF'.", a: ["where"], ph: "un mot-clé", exp: "WHERE cible les lignes concernées." },
    { type: "vf", q: "On peut supprimer une compagnie encore référencée par des pilotes (sans option particulière).", a: false, exp: "Faux : l'intégrité référentielle bloque la suppression du parent référencé." },
    { type: "qcm", q: "DELETE / TRUNCATE et DROP TABLE : quelle différence ?", opts: ["Aucune", "DELETE/TRUNCATE vident le contenu ; DROP TABLE supprime la table elle-même", "DROP garde les lignes", "TRUNCATE supprime la base entière"], a: 1, exp: "Contenu (lignes) vs structure (table entière)." },
    { type: "input", q: "Complète : UPDATE Compagnie SET ville = ______ WHERE comp = 'AN2' ; utilise le mot-clé qui remet la valeur par défaut.", a: ["default"], ph: "un mot-clé", exp: "SET ville = DEFAULT remet la valeur par défaut." },
    { type: "qcm", q: "UPDATE et DELETE appartiennent à quelle famille SQL ?", opts: ["LDD", "LMD (manipulation des données)", "LID", "LCD"], a: 1, exp: "Comme INSERT, ce sont des commandes de manipulation (LMD)." },
    { type: "vf", q: "TRUNCATE ne peut pas s'appliquer à une table référencée par des clés étrangères actives.", a: true, exp: "Vrai : il faut d'abord désactiver les contraintes." },
    { type: "input", q: "Complète : le message d'erreur typique quand on supprime un parent référencé contient les mots « foreign key constraint ______ ».", a: ["fails", "fail"], ph: "un mot", exp: "« a foreign key constraint fails »." }
  ],
  final: {
    title: "Exercice final — Corriger et nettoyer",
    intro: `<p>Table <code>Pilote(brevet, nom, nbHVol, compa)</code>. On veut : (1) porter à 30000 les heures de vol du pilote 'PL-1' ; (2) supprimer le pilote 'PL-2' ; (3) réfléchir à vider toute la table.</p>`,
    questions: [
      { type: "qcm", q: "Requête (1) correcte ?", opts: ["UPDATE Pilote SET nbHVol = 30000", "UPDATE Pilote SET nbHVol = 30000 WHERE brevet = 'PL-1'", "DELETE Pilote WHERE brevet = 'PL-1'", "SET Pilote nbHVol = 30000"], a: 1, exp: "UPDATE ... SET ... WHERE cible bien PL-1 (le WHERE est indispensable)." },
      { type: "qcm", q: "Requête (2) correcte ?", opts: ["DELETE FROM Pilote WHERE brevet = 'PL-2'", "DELETE Pilote", "DROP Pilote WHERE brevet = 'PL-2'", "UPDATE Pilote SET brevet = NULL"], a: 0, exp: "DELETE FROM Pilote WHERE brevet = 'PL-2'." },
      { type: "vf", q: "Oublier le WHERE dans la requête (1) modifierait tous les pilotes.", a: true, exp: "Vrai : sans WHERE, tous les nbHVol passeraient à 30000." },
      { type: "input", q: "Complète : pour vider entièrement la table d'un coup, ______ TABLE Pilote ;", a: ["truncate"], ph: "un mot-clé", exp: "TRUNCATE TABLE Pilote ; vide tout le contenu." },
      { type: "qcm", q: "Après TRUNCATE TABLE Pilote, la table…", opts: ["N'existe plus du tout", "Existe encore mais est vide", "Contient une ligne", "Est renommée"], a: 1, exp: "La structure reste ; seul le contenu disparaît." }
    ],
    solution: `<pre class="pseudo">-- (1) modifier une ligne precise : le WHERE est vital
UPDATE Pilote
   SET nbHVol = 30000
 WHERE brevet = 'PL-1';

-- (2) supprimer une ligne precise
DELETE FROM Pilote
 WHERE brevet = 'PL-2';

-- (3) vider entierement la table (structure conservee)
TRUNCATE TABLE Pilote;

-- Regle d'or : toujours reflechir au WHERE avant UPDATE ou DELETE.</pre>
<p>Tu maîtrises la manipulation complète des données. Demain : les interroger avec SELECT.</p>`
  }
};
</script>
