  title: "Les types de données MySQL",
  subtitle: "Choisir le bon type : texte, nombre, date, énumération.",
  theory: `
<h3>1. Pourquoi un type par colonne ?</h3>
<p>Chaque colonne d'une table reçoit un <strong>type de données</strong> : il définit la nature des valeurs qu'elle peut contenir (texte, nombre, date…) et les opérations possibles. Bien choisir le type, c'est éviter de stocker n'importe quoi et gagner en place et en performance. MySQL propose cinq grandes familles de types.</p>

<h3>2. Les types caractères (texte)</h3>
<p>Deux types de texte reviennent tout le temps : <strong>CHAR(n)</strong> et <strong>VARCHAR(n)</strong>.</p>
<p><strong>CHAR(n)</strong> stocke une chaîne de taille <strong>fixe</strong> de n caractères : si la valeur est plus courte, MySQL complète avec des espaces (maximum 255 caractères). <strong>VARCHAR(n)</strong> stocke une chaîne de taille <strong>variable</strong> jusqu'à n caractères, sans ajouter d'espaces inutiles.</p>
<pre class="pseudo">code    CHAR(4)       -- taille FIXE : bien pour un code toujours long de 4 (ex : « AF  »)
nom     VARCHAR(50)   -- taille VARIABLE : bien pour un nom de longueur imprevisible</pre>
<div class="tip">Règle simple : CHAR pour des valeurs de longueur constante (code pays, code produit), VARCHAR pour des textes de longueur variable (nom, adresse). Pour de très longs textes, il existe aussi TINYTEXT, TEXT, MEDIUMTEXT et LONGTEXT.</div>

<h3>3. Les types numériques</h3>
<p>Pour les <strong>entiers</strong>, MySQL propose une gamme selon la taille du nombre : <strong>TINYINT</strong>, <strong>SMALLINT</strong>, <strong>MEDIUMINT</strong>, <strong>INT</strong> (synonyme <strong>INTEGER</strong>) et <strong>BIGINT</strong>. Plus le type est « gros », plus il stocke de grands nombres (INT va d'environ -2,1 milliards à +2,1 milliards).</p>
<p>Pour les nombres <strong>à virgule</strong>, on distingue les flottants <strong>FLOAT</strong> et <strong>DOUBLE</strong> (valeurs approchées) et surtout <strong>DECIMAL(n,p)</strong> (valeur exacte à virgule fixe), idéal pour l'argent.</p>
<pre class="pseudo">age       TINYINT             -- petit entier (ex : 0 a 127)
quantite  INT                 -- entier « classique »
prix      DECIMAL(6,2)        -- nombre a virgule EXACT : n = 6 chiffres au total, p = 2 apres la virgule
--                              ex : 1234.56  (4 chiffres avant, 2 apres)</pre>
<div class="warn">Pour un montant d'argent, préfère DECIMAL (exact) à FLOAT/DOUBLE (approchés), pour éviter les erreurs d'arrondi. Dans DECIMAL(n,p), n est le nombre TOTAL de chiffres et p le nombre de chiffres APRÈS la virgule. L'option UNSIGNED limite un entier aux valeurs positives.</div>

<h3>4. Les types date et heure</h3>
<p>MySQL gère spécialement les moments dans le temps :</p>
<pre class="pseudo">datenais    DATE        -- une date seule           format 'YYYY-MM-DD'          (ex : 2026-07-26)
rendezvous  DATETIME    -- date ET heure            format 'YYYY-MM-DD HH:MM:SS'
duree       TIME        -- une heure / une duree    format 'HH:MM:SS'
annee       YEAR        -- une annee seule          format 'YYYY'</pre>
<div class="tip">Il existe aussi TIMESTAMP (un instant, souvent mis à jour automatiquement à chaque modification de la ligne). Les fonctions NOW() et SYSDATE() renvoient la date et l'heure courantes.</div>

<h3>5. Les énumérations : ENUM et SET</h3>
<p>Quand une colonne ne peut prendre qu'un petit nombre de valeurs fixées d'avance, on utilise une <strong>énumération</strong>. <strong>ENUM</strong> impose <em>une seule</em> valeur parmi une liste ; <strong>SET</strong> autorise <em>une combinaison</em> de valeurs de la liste.</p>
<pre class="pseudo">grade   ENUM('Copilote', 'Commandant')          -- une seule valeur autorisee parmi la liste
options SET('clim', 'gps', 'toit_ouvrant')      -- une combinaison de valeurs de la liste</pre>
<p>Enfin, pour des fichiers bruts (images, sons…), il existe les types <strong>BLOB</strong> (TINYBLOB, BLOB, MEDIUMBLOB, LONGBLOB), mais on les rencontre rarement au début.</p>
<div class="warn">Bien choisir le type au moment de la création de la table est important : il détermine ce que la colonne acceptera. On peut le modifier plus tard (ALTER TABLE), mais mieux vaut viser juste dès le départ.</div>`,

    { type: "vf", q: "ENUM autorise une SEULE valeur parmi une liste prédéfinie.", a: true, exp: "Vrai : ENUM = une valeur ; SET = une combinaison de valeurs." },
    { type: "input", q: "Complète : le type qui autorise une COMBINAISON de valeurs parmi une liste s'appelle ______.", a: ["set"], ph: "un type", exp: "SET, à l'inverse de ENUM." },
    { type: "qcm", q: "Quel type entier stocke les plus grands nombres ?", opts: ["TINYINT", "SMALLINT", "INT", "BIGINT"], a: 3, exp: "BIGINT (8 octets) couvre la plus grande plage." },
    { type: "vf", q: "L'option UNSIGNED limite un entier aux valeurs positives.", a: true, exp: "Vrai : UNSIGNED interdit les valeurs négatives." },
    { type: "input", q: "Complète : pour un code toujours long de 4 caractères exactement, le type de taille fixe conseillé est ______(4).", a: ["char"], ph: "un type", exp: "CHAR(4) : taille fixe." },
    { type: "qcm", q: "Quel type utiliser pour des fichiers bruts comme des images ?", opts: ["VARCHAR", "BLOB", "DATE", "ENUM"], a: 1, exp: "Les types BLOB stockent des données binaires (images, sons…)." },
    { type: "qcm", q: "FLOAT et DOUBLE stockent des valeurs…", opts: ["Toujours exactes", "Approchées (à virgule flottante)", "Uniquement entières", "Uniquement du texte"], a: 1, exp: "Ce sont des flottants : valeurs approchées, contrairement à DECIMAL." },
    { type: "input", q: "Complète : la fonction qui renvoie la date et l'heure courantes s'écrit ______() (quatre lettres avant les parenthèses).", a: ["now"], ph: "une fonction", exp: "NOW() renvoie la date et l'heure du moment." }
  ],
  final: {
    title: "Exercice final — Choisir les bons types",
    intro: `<p>On conçoit une table <code>Produit</code>. Pour chaque colonne, choisis le type le plus adapté.</p>`,
    questions: [
      { type: "qcm", q: "reference : un code de longueur variable, max 15 caractères →", opts: ["INT", "VARCHAR(15)", "DATE", "BOOLEAN"], a: 1, exp: "Texte variable → VARCHAR(15)." },
      { type: "qcm", q: "quantite_stock : un nombre entier →", opts: ["VARCHAR(10)", "INT", "DECIMAL(4,2)", "DATE"], a: 1, exp: "Un entier → INT (ou INTEGER)." },
      { type: "qcm", q: "prix : un montant en euros avec centimes, exact →", opts: ["FLOAT", "DECIMAL(8,2)", "INT", "CHAR(8)"], a: 1, exp: "Argent exact → DECIMAL(8,2)." },
      { type: "qcm", q: "date_ajout : la date d'ajout au catalogue →", opts: ["DATE", "INT", "VARCHAR(10)", "ENUM"], a: 0, exp: "Une date → DATE." },
      { type: "qcm", q: "disponibilite : une seule valeur parmi 'oui' ou 'non' →", opts: ["SET('oui','non')", "ENUM('oui','non')", "BLOB", "DOUBLE"], a: 1, exp: "Une valeur unique dans une liste → ENUM." }
    ],
    solution: `<pre class="pseudo">CREATE TABLE Produit (
    reference       VARCHAR(15),          -- code texte de longueur variable
    quantite_stock  INT,                  -- entier
    prix            DECIMAL(8,2),         -- montant EXACT : 6 chiffres avant, 2 apres la virgule
    date_ajout      DATE,                 -- date seule 'YYYY-MM-DD'
    disponibilite   ENUM('oui', 'non')    -- une seule valeur parmi la liste
);
-- Regles : VARCHAR pour du texte variable, DECIMAL pour l'argent (exact),
--          DATE pour une date, ENUM pour une valeur imposee parmi une liste.</pre>
<p>Tu sais dimensionner tes colonnes. Demain : les contraintes, qui protègent la qualité des données.</p>`
  }
};
