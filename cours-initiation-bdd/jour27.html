<script>
var DAY = {
  num: 27,
  title: "Faire évoluer un schéma (ALTER TABLE)",
  subtitle: "Modifier la structure d'une table déjà remplie : colonnes et contraintes.",
  theory: `
<h3>1. Pourquoi faire évoluer un schéma ?</h3>
<p>Une base de données vit : les besoins des applications changent, il faut ajouter une colonne, en renommer une, changer un type, poser une nouvelle contrainte. L'instruction du LDD (langage de définition des données) qui gère cela est <code>ALTER TABLE</code>. Elle permet d'<strong>ajouter, renommer, modifier et supprimer</strong> des colonnes, ainsi que d'<strong>ajouter ou retirer des contraintes</strong> — sans avoir à recréer la table ni exporter/réimporter les données.</p>
<div class="tip">Fil rouge du jour : on part d'une table simple et on la fait évoluer. CREATE TABLE Pilote (brevet VARCHAR(4), nom VARCHAR(20)); avec un pilote 'PL-1', 'Agnès Labat'.</div>

<h3>2. Renommer une table : RENAME TO</h3>
<p>Pour renommer une table, on utilise <code>RENAME TABLE … TO …</code> ou l'option <code>RENAME TO</code> d'<code>ALTER TABLE</code>. Les contraintes, index et privilèges suivent automatiquement.</p>
<pre class="pseudo">RENAME TABLE Pilote TO Navigant;
-- ou, de facon equivalente :
ALTER TABLE Pilote RENAME TO Navigant;</pre>

<h3>3. Ajouter une colonne : ADD</h3>
<p>La directive <code>ADD</code> ajoute une colonne. Pour les lignes déjà présentes, la nouvelle colonne vaut <code>NULL</code>… sauf si on précise une valeur par défaut avec <code>DEFAULT</code>, auquel cas toutes les lignes existantes reçoivent cette valeur.</p>
<pre class="pseudo">-- Ajoute nbHVol, initialisee a NULL pour les pilotes existants
ALTER TABLE Pilote ADD (nbHVol DECIMAL(7,2));

-- Ajoute deux colonnes avec une valeur par defaut (donc non nulles)
ALTER TABLE Pilote
   ADD (compa VARCHAR(4) DEFAULT 'AF',
        ville VARCHAR(30) DEFAULT 'Paris' NOT NULL);</pre>

<h3>4. Renommer une colonne : CHANGE</h3>
<p>L'option <code>CHANGE</code> renomme une colonne. Attention : il faut <strong>répéter le type</strong> (et les éventuelles contraintes) de la colonne, car CHANGE peut aussi les redéfinir. On peut en profiter pour déplacer la colonne avec <code>FIRST</code> ou <code>AFTER</code>.</p>
<pre class="pseudo">-- Renomme la colonne ville en adresse, en la placant apres nbHVol
ALTER TABLE Pilote CHANGE ville adresse VARCHAR(30) AFTER nbHVol;</pre>

<h3>5. Modifier le type d'une colonne : MODIFY</h3>
<p>L'option <code>MODIFY</code> change le type (ou les contraintes en ligne) d'une colonne <strong>sans la renommer</strong>. On peut agrandir une colonne librement, ou la rétrécir <strong>à condition</strong> que toutes les données existantes tiennent dans la nouvelle taille.</p>
<pre class="pseudo">ALTER TABLE Pilote MODIFY compa VARCHAR(6) DEFAULT 'SING';  -- agrandit + change le defaut
ALTER TABLE Pilote MODIFY compa CHAR(4) NOT NULL;          -- retrecit + rend obligatoire
ALTER TABLE Pilote MODIFY compa CHAR(4);                   -- autorise de nouveau NULL</pre>
<div class="warn">Rétrécir une colonne peut échouer si des données dépassent la nouvelle taille. Rendre une colonne NOT NULL échoue s'il existe déjà des valeurs NULL. La règle générale : les données présentes doivent respecter la nouvelle définition.</div>

<h3>6. Gérer la valeur par défaut : ALTER COLUMN</h3>
<p>Pour changer uniquement la valeur par défaut d'une colonne (sans toucher au type), on emploie <code>ALTER COLUMN … SET DEFAULT</code> ou <code>DROP DEFAULT</code>.</p>
<pre class="pseudo">ALTER TABLE Pilote ALTER COLUMN adresse SET DEFAULT 'Blagnac';  -- definit un defaut
ALTER TABLE Pilote ALTER COLUMN adresse DROP DEFAULT;           -- retire le defaut</pre>

<h3>7. Supprimer une colonne : DROP COLUMN</h3>
<p>L'option <code>DROP COLUMN</code> supprime une colonne et ses données. On ne peut pas supprimer toutes les colonnes d'une table, ni une clé primaire référencée par une clé étrangère.</p>
<pre class="pseudo">ALTER TABLE Pilote DROP COLUMN adresse;</pre>

<h3>8. Ajouter et retirer des contraintes</h3>
<p><code>ALTER TABLE … ADD CONSTRAINT</code> ajoute une contrainte (UNIQUE, PRIMARY KEY ou FOREIGN KEY) à une table existante. Pour réussir, les données déjà présentes doivent respecter la nouvelle contrainte. On nomme la contrainte pour pouvoir la supprimer ensuite.</p>
<pre class="pseudo">-- Unicite du nom de compagnie
ALTER TABLE Compagnie ADD CONSTRAINT un_nomc UNIQUE (nomComp);

-- Cle etrangere : proprio de Avion reference comp de Compagnie
ALTER TABLE Avion ADD CONSTRAINT fk_avion_comp
   FOREIGN KEY (proprio) REFERENCES Compagnie(comp);

-- Suppression de contraintes
ALTER TABLE Avion DROP FOREIGN KEY fk_avion_comp;
ALTER TABLE Compagnie DROP INDEX un_nomc;</pre>`,
  exercises: [
    { type: "qcm", q: "ALTER TABLE sert à…", opts: ["Insérer des lignes", "Modifier la structure d'une table (colonnes, contraintes)", "Trier des données", "Faire une jointure"], a: 1, exp: "ALTER TABLE fait évoluer la structure d'une table existante." },
    { type: "qcm", q: "Quelle directive ajoute une colonne ?", opts: ["ADD", "DROP", "CHANGE", "RENAME"], a: 0, exp: "ADD ajoute une nouvelle colonne." },
    { type: "qcm", q: "Une colonne ajoutée sans DEFAULT vaut, pour les lignes existantes…", opts: ["0", "Une chaîne vide", "NULL", "La valeur de la colonne précédente"], a: 2, exp: "Sans DEFAULT, la nouvelle colonne est NULL pour les lignes existantes." },
    { type: "qcm", q: "Quelle option renomme une colonne (en répétant son type) ?", opts: ["MODIFY", "CHANGE", "ALTER COLUMN", "RENAME"], a: 1, exp: "CHANGE renomme une colonne ; le type doit être reprécisé." },
    { type: "qcm", q: "Quelle option change le type d'une colonne sans la renommer ?", opts: ["CHANGE", "MODIFY", "ADD", "DROP"], a: 1, exp: "MODIFY modifie le type sans renommer." },
    { type: "qcm", q: "Rétrécir une colonne texte est possible…", opts: ["Toujours", "Seulement si les données existantes tiennent dans la nouvelle taille", "Jamais", "Uniquement sur une table vide"], a: 1, exp: "Les données présentes doivent respecter la nouvelle taille." },
    { type: "qcm", q: "Pour changer seulement la valeur par défaut d'une colonne :", opts: ["MODIFY", "ALTER COLUMN … SET DEFAULT", "DROP COLUMN", "ADD"], a: 1, exp: "ALTER COLUMN … SET DEFAULT modifie le défaut sans toucher au type." },
    { type: "qcm", q: "Quelle option supprime une colonne ?", opts: ["DROP COLUMN", "DELETE COLUMN", "REMOVE", "MODIFY NULL"], a: 0, exp: "DROP COLUMN supprime la colonne et ses données." },
    { type: "qcm", q: "On ne peut PAS supprimer…", opts: ["Une colonne de texte", "Une clé primaire référencée par une clé étrangère", "Une colonne récente", "Une colonne NULL"], a: 1, exp: "Impossible de supprimer une clé primaire encore référencée." },
    { type: "qcm", q: "Pour ajouter une contrainte à une table existante :", opts: ["ADD COLUMN", "ADD CONSTRAINT nom typeContrainte", "MODIFY CONSTRAINT", "CREATE CONSTRAINT"], a: 1, exp: "ALTER TABLE … ADD CONSTRAINT ajoute une contrainte nommée." },
    { type: "vf", q: "Ajouter une contrainte UNIQUE échoue si des doublons existent déjà dans la colonne.", a: true, exp: "Les données présentes doivent respecter la nouvelle contrainte." },
    { type: "input", q: "Quelle directive (un mot) d'ALTER TABLE ajoute une colonne ?", a: "ADD", ph: "un mot-clé SQL", exp: "ADD ajoute une colonne." },
    { type: "input", q: "Quelle option (un mot) modifie le TYPE d'une colonne sans la renommer ?", a: "MODIFY", ph: "un mot-clé SQL", exp: "MODIFY change le type sans renommer." },
    { type: "input", q: "Écris l'instruction qui ajoute à Pilote une colonne nbHVol de type DECIMAL(7,2). Commence par ALTER TABLE ...", a: ["ALTER TABLE Pilote ADD (nbHVol DECIMAL(7,2))", "ALTER TABLE Pilote ADD nbHVol DECIMAL(7,2)", "ALTER TABLE Pilote ADD (nbHVol DECIMAL(7,2));", "ALTER TABLE Pilote ADD COLUMN nbHVol DECIMAL(7,2)"], ph: "ALTER TABLE Pilote ADD ...", exp: "ALTER TABLE Pilote ADD (nbHVol DECIMAL(7,2));" },
    { type: "input", q: "Complète pour supprimer la colonne adresse : ALTER TABLE Pilote ___ COLUMN adresse. (deux mots avant COLUMN? non, un mot)", a: "DROP", ph: "un mot-clé SQL", exp: "DROP COLUMN supprime la colonne." }
  ],
  final: {
    title: "Exercice final — Faire évoluer la table Pilote",
    intro: `<p>Support : table Pilote(brevet VARCHAR(4), nom VARCHAR(20)) avec un pilote existant. On la fait évoluer étape par étape.</p>`,
    questions: [
      { type: "qcm", q: "Ajouter une colonne nbHVol DECIMAL(7,2) :", opts: ["ALTER TABLE Pilote ADD (nbHVol DECIMAL(7,2))", "ALTER TABLE Pilote MODIFY nbHVol", "ALTER TABLE Pilote DROP nbHVol", "INSERT nbHVol"], a: 0, exp: "ADD ajoute la colonne (NULL pour les lignes existantes)." },
      { type: "qcm", q: "Renommer la colonne ville en adresse :", opts: ["ALTER TABLE Pilote MODIFY ville", "ALTER TABLE Pilote CHANGE ville adresse VARCHAR(30)", "ALTER TABLE Pilote RENAME ville", "ALTER TABLE Pilote DROP ville"], a: 1, exp: "CHANGE renomme et reprécise le type." },
      { type: "qcm", q: "Agrandir compa de VARCHAR(4) à VARCHAR(6) :", opts: ["ALTER TABLE Pilote MODIFY compa VARCHAR(6)", "ALTER TABLE Pilote CHANGE compa", "ALTER TABLE Pilote DROP compa", "ALTER TABLE Pilote ADD compa"], a: 0, exp: "MODIFY change le type sans renommer." },
      { type: "qcm", q: "Ajouter une contrainte d'unicité sur nomComp de Compagnie :", opts: ["ADD COLUMN nomComp", "ADD CONSTRAINT un_nomc UNIQUE (nomComp)", "MODIFY nomComp UNIQUE", "DROP nomComp"], a: 1, exp: "ADD CONSTRAINT … UNIQUE ajoute la contrainte." },
      { type: "vf", q: "Supprimer une colonne se fait avec ALTER TABLE … DROP COLUMN.", a: true, exp: "DROP COLUMN supprime la colonne et ses données." }
    ],
    solution: `<pre class="pseudo">-- 1) ajouter une colonne
ALTER TABLE Pilote ADD (nbHVol DECIMAL(7,2));

-- 2) ajouter des colonnes avec valeur par defaut
ALTER TABLE Pilote
   ADD (compa VARCHAR(4) DEFAULT 'AF',
        ville VARCHAR(30) DEFAULT 'Paris' NOT NULL);

-- 3) renommer une colonne (CHANGE, type repris)
ALTER TABLE Pilote CHANGE ville adresse VARCHAR(30) AFTER nbHVol;

-- 4) modifier un type (MODIFY)
ALTER TABLE Pilote MODIFY compa VARCHAR(6) DEFAULT 'SING';

-- 5) supprimer une colonne
ALTER TABLE Pilote DROP COLUMN adresse;

-- 6) ajouter une contrainte d'unicite
ALTER TABLE Compagnie ADD CONSTRAINT un_nomc UNIQUE (nomComp);</pre>
<p>Ta base peut désormais évoluer sans être recréée. Demain : garantir la fiabilité des mises à jour avec les transactions (COMMIT, ROLLBACK, ACID).</p>`
  }
};
