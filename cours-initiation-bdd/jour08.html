<script>
var DAY = {
  num: 8,
  title: "Les contraintes (PRIMARY KEY, NOT NULL, UNIQUE, DEFAULT)",
  subtitle: "Programmer des règles de qualité directement dans la table.",
  theory: `
<h3>1. À quoi servent les contraintes ?</h3>
<p>Une <strong>contrainte</strong> sert à programmer une <strong>règle de gestion</strong> au niveau des colonnes d'une table. Le SGBD la fait respecter automatiquement et refuse toute donnée qui la viole. Avantage : on n'a plus besoin de tester ces règles dans chaque programme client, elles sont garanties « côté serveur ».</p>
<div class="tip">Exemple : si l'on déclare qu'un code de client ne peut pas se répéter, plus jamais deux clients ne pourront partager le même code, quelle que soit l'application qui insère les données.</div>

<h3>2. NOT NULL : une valeur obligatoire</h3>
<p>La contrainte <strong>NOT NULL</strong> interdit qu'une colonne soit laissée vide (NULL). La valeur devient donc <strong>obligatoire</strong> à chaque insertion.</p>
<pre class="pseudo">CREATE TABLE Compagnie (
    comp     VARCHAR(4),
    nomComp  VARCHAR(20) NOT NULL    -- le nom de la compagnie est OBLIGATOIRE (jamais NULL)
);</pre>

<h3>3. DEFAULT : une valeur par défaut</h3>
<p>La directive <strong>DEFAULT</strong> fixe une valeur automatique quand on n'en fournit pas à l'insertion.</p>
<pre class="pseudo">CREATE TABLE Compagnie (
    comp   VARCHAR(4),
    ville  VARCHAR(15) DEFAULT 'Paris'   -- si on n'indique pas la ville, elle vaudra 'Paris'
);</pre>

<h3>4. UNIQUE : pas de doublon</h3>
<p>La contrainte <strong>UNIQUE</strong> impose que les valeurs d'une colonne soient toutes <strong>distinctes</strong> (pas de doublon). Les valeurs NULL font exception (sauf si NOT NULL est aussi appliquée).</p>
<pre class="pseudo">CREATE TABLE Pilote (
    brevet  VARCHAR(6),
    nom     VARCHAR(16) UNIQUE          -- deux pilotes ne peuvent pas porter le meme nom
);</pre>

<h3>5. PRIMARY KEY : la clé primaire</h3>
<p>La contrainte <strong>PRIMARY KEY</strong> déclare la <strong>clé primaire</strong> de la table (la colonne qui identifie chaque ligne). Point capital à mémoriser :</p>
<div class="warn">PRIMARY KEY équivaut à UNIQUE + NOT NULL + un index automatique. Autrement dit, une colonne clé primaire ne peut être ni dupliquée, ni nulle. Il n'y a qu'une seule PRIMARY KEY par table.</div>
<pre class="pseudo">CREATE TABLE Compagnie (
    comp     VARCHAR(4) PRIMARY KEY,    -- cle primaire : unique + non nulle, automatiquement
    nomComp  VARCHAR(20) NOT NULL
);</pre>

<h3>6. En ligne ou nommées</h3>
<p>Une contrainte peut être écrite de deux façons. <strong>En ligne</strong> (« inline ») : directement après la colonne, comme dans les exemples ci-dessus. <strong>Nommée</strong> (« out-of-line ») : à part, avec le mot-clé <strong>CONSTRAINT</strong> suivi d'un nom, ce qui permet de la retrouver et de la faire évoluer plus tard.</p>
<pre class="pseudo">CREATE TABLE Compagnie (
    comp     VARCHAR(4),
    nomComp  VARCHAR(20) NOT NULL,
    CONSTRAINT pk_Compagnie PRIMARY KEY (comp)   -- contrainte NOMMEE : cle primaire sur comp
);</pre>
<div class="tip">Conventions du support pour nommer les contraintes : préfixe <code>pk_</code> pour une clé primaire, <code>fk_</code> pour une clé étrangère, <code>un_</code> pour une unicité, <code>ck_</code> pour une vérification. Il est recommandé de nommer ses contraintes (sauf NOT NULL, qu'on laisse en ligne).</div>
<p>Enfin, la contrainte <strong>CHECK</strong> impose une condition sur les valeurs, par exemple <code>CHECK (nbHVol BETWEEN 0 AND 20000)</code> pour borner un nombre d'heures de vol.</p>`,
  exercises: [
    { type: "input", q: "Complète : la contrainte qui interdit à une colonne d'être vide est ______ ______ (deux mots).", a: ["not null", "notnull"], ph: "deux mots-clés", exp: "NOT NULL rend la valeur obligatoire." },
    { type: "qcm", q: "La contrainte UNIQUE garantit que…", opts: ["La colonne est obligatoire", "Les valeurs de la colonne sont toutes distinctes (pas de doublon)", "La colonne est indexée pour accélérer les recherches", "La colonne est la clé étrangère"], a: 1, exp: "UNIQUE interdit les doublons." },
    { type: "input", q: "Complète : pour fixer une valeur automatique en l'absence de saisie, on utilise ______ 'Paris'.", a: ["default"], ph: "un mot-clé", exp: "DEFAULT 'Paris' donne une valeur par défaut." },
    { type: "vf", q: "PRIMARY KEY équivaut à UNIQUE + NOT NULL + un index automatique.", a: true, exp: "C'est l'équivalence essentielle à retenir." },
    { type: "qcm", q: "Combien de clés primaires (PRIMARY KEY) une table peut-elle avoir ?", opts: ["Autant qu'on veut", "Exactement une", "Au moins deux", "Aucune n'est autorisée"], a: 1, exp: "Une seule clé primaire par table (même si elle est composée)." },
    { type: "input", q: "Complète : le mot-clé qui introduit une contrainte NOMMÉE est ______ (suivi du nom de la contrainte).", a: ["constraint"], ph: "un mot-clé", exp: "CONSTRAINT nom_de_la_contrainte ..." },
    { type: "qcm", q: "Selon les conventions du support, comment préfixer le nom d'une contrainte de clé primaire ?", opts: ["fk_", "pk_", "un_", "ck_"], a: 1, exp: "pk_ pour primary key ; fk_ étrangère ; un_ unicité ; ck_ vérification." },
    { type: "vf", q: "Une colonne déclarée PRIMARY KEY peut contenir la valeur NULL.", a: false, exp: "Faux : PRIMARY KEY inclut NOT NULL, donc jamais NULL." },
    { type: "input", q: "Complète : la contrainte qui impose une condition, ex. un nombre entre 0 et 20000, s'appelle ______.", a: ["check"], ph: "un mot-clé", exp: "CHECK (condition), ex. CHECK (nbHVol BETWEEN 0 AND 20000)." },
    { type: "qcm", q: "Écrire NOT NULL juste après le type de la colonne est une contrainte…", opts: ["Nommée (out-of-line)", "En ligne (inline)", "Une contrainte de table déclarée à la fin", "Convertie automatiquement en clé primaire"], a: 1, exp: "Directement sur la colonne = contrainte en ligne." },
    { type: "vf", q: "Il est recommandé de NOMMER ses contraintes (sauf NOT NULL) pour pouvoir les faire évoluer plus tard.", a: true, exp: "Vrai : une contrainte nommée est plus facile à modifier ou supprimer." },
    { type: "input", q: "Complète : CONSTRAINT pk_Compagnie PRIMARY KEY (______) déclare la clé primaire sur la colonne comp.", a: ["comp"], ph: "une colonne", exp: "On indique la ou les colonnes de la clé entre parenthèses." },
    { type: "qcm", q: "Avantage principal des contraintes ?", opts: ["Rendre les requêtes plus longues", "Faire respecter les règles automatiquement côté serveur, sans les recoder dans chaque programme", "Supprimer des tables", "Trier les données"], a: 1, exp: "Les règles sont garanties par le SGBD lui-même." },
    { type: "qcm", q: "UNIQUE et NULL : que dit le support ?", opts: ["UNIQUE interdit toute valeur NULL", "Les valeurs NULL font exception à UNIQUE (sauf si NOT NULL est aussi appliquée)", "NULL est toujours un doublon", "UNIQUE oblige à mettre NULL"], a: 1, exp: "UNIQUE tolère les NULL, sauf si NOT NULL est ajouté." },
    { type: "input", q: "Complète : préfixe conseillé pour nommer une contrainte d'unicité : ______ (deux lettres et un tiret bas).", a: ["un_"], ph: "un préfixe", exp: "un_ pour une unicité ; pk_, fk_, ck_ pour les autres." }
  ],
  final: {
    title: "Exercice final — Contraindre la table Client",
    intro: `<p>On reprend la table <code>Client</code> avec les colonnes <code>nocli</code>, <code>nomcli</code>, <code>ville</code>. On veut : nocli = clé primaire ; nomcli obligatoire ; ville = 'Bruxelles' par défaut.</p>`,
    questions: [
      { type: "qcm", q: "Quelle contrainte pour faire de nocli l'identifiant unique et non nul ?", opts: ["UNIQUE seul", "PRIMARY KEY", "DEFAULT", "CHECK"], a: 1, exp: "PRIMARY KEY = UNIQUE + NOT NULL." },
      { type: "input", q: "Complète : pour rendre nomcli obligatoire, on ajoute nomcli VARCHAR(20) ______ ______.", a: ["not null", "notnull"], ph: "deux mots-clés", exp: "NOT NULL rend la colonne obligatoire." },
      { type: "input", q: "Complète : pour la ville par défaut, ville VARCHAR(20) ______ 'Bruxelles'.", a: ["default"], ph: "un mot-clé", exp: "DEFAULT 'Bruxelles'." },
      { type: "vf", q: "PRIMARY KEY sur nocli empêche deux clients d'avoir le même nocli et interdit un nocli NULL.", a: true, exp: "Exactement : unicité + non nul garantis." },
      { type: "qcm", q: "Pour nommer la contrainte de clé primaire, on écrit…", opts: ["CONSTRAINT pk_Client PRIMARY KEY (nocli)", "PRIMARY pk_Client", "KEY nocli UNIQUE", "DEFAULT pk_Client"], a: 0, exp: "CONSTRAINT nom PRIMARY KEY (colonne)." }
    ],
    solution: `<pre class="pseudo">CREATE TABLE Client (
    nocli   VARCHAR(6),
    nomcli  VARCHAR(20) NOT NULL,              -- nom obligatoire (contrainte en ligne)
    ville   VARCHAR(20) DEFAULT 'Bruxelles',   -- valeur par defaut si non renseignee
    CONSTRAINT pk_Client PRIMARY KEY (nocli)   -- cle primaire nommee : unique + non nul + index
);
-- PRIMARY KEY = UNIQUE + NOT NULL + index. Une seule par table.</pre>
<p>Tes tables savent se protéger. Demain : relier deux tables avec une clé étrangère (FOREIGN KEY).</p>`
  }
};
</script>

  { id: "initbdd-j08", lang: "sql", schema: "-- La table Compte est créée par ta solution (aucune donnée préalable).\n", tests: [{"label":"nocompte est la clé primaire","query":"SELECT name FROM pragma_table_info('Compte') WHERE pk=1","expect":[["nocompte"]]},{"label":"soldecompte a une valeur par défaut de 0","query":"SELECT dflt_value FROM pragma_table_info('Compte') WHERE name='soldecompte'","expect":[["0"]]},{"label":"soldecompte est obligatoire (NOT NULL)","query":"SELECT [notnull] FROM pragma_table_info('Compte') WHERE name='soldecompte'","expect":[[1]]}], checklist: ["nocompte est-il défini comme clé primaire (nommée pk_Compte) ?","soldecompte est-il déclaré NOT NULL avec DEFAULT 0 ?","As-tu compris qu'une insertion sans solde donnera automatiquement 0 ?"], title: "Ajouter les contraintes à Compte", level: 2,

    hints: [

      "Déclare la clé primaire de façon nommée : CONSTRAINT pk_Compte PRIMARY KEY (nocompte).",

    ],
    solution: "CREATE TABLE Compte (\n    nocompte     VARCHAR(6),\n    soldecompte  DECIMAL(9,2) NOT NULL DEFAULT 0,   -- obligatoire, 0 par defaut\n    CONSTRAINT pk_Compte PRIMARY KEY (nocompte)     -- cle primaire nommee\n);\n\n-- Resultat attendu : nocompte est unique et non nul ;\n-- une insertion sans solde donnera automatiquement soldecompte = 0.",
    note: "On peut cumuler plusieurs contraintes en ligne sur une même colonne (ici NOT NULL et DEFAULT). La clé primaire, elle, est nommée pour pouvoir la faire évoluer plus tard." }
  ]
};
