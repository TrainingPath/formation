<script>
var DAY = {
  num: 1,
  title: "Pourquoi un framework ? Premier projet ASP.NET Core",
  subtitle: "Tu sais coder en C#. ASP.NET Core va te faire coder des applications web professionnelles.",
  theory: `
<h3>1. D'abord, quelques mots de vocabulaire</h3>
<p>Avant tout, posons les mots que nous emploierons sans arrêt. Un <strong>programme</strong> est une suite d'ordres (des « instructions ») que l'ordinateur exécute. Une <strong>application web</strong> est un programme qui ne s'affiche pas dans une fenêtre à toi, mais qui <em>répond à des messages venus d'Internet</em> : un navigateur (Chrome, Firefox…) envoie une demande, ton programme renvoie une réponse. Le mot <strong>web</strong> désigne simplement l'ensemble de ces échanges à travers Internet.</p>
<p>Un <strong>serveur</strong>, c'est un programme qui <em>attend</em> des demandes et y répond, comme un serveur de restaurant attend les commandes des clients. Le <strong>client</strong> (ici le navigateur) passe commande, le serveur prépare et rapporte le plat (la réponse). Retiens ce couple client / serveur : c'est la base de tout le web.</p>

<h3>2. C'est quoi, un framework ?</h3>
<p>Dans le cours C#, tu as tout écrit toi-même : les menus console, la sauvegarde dans des fichiers, les boucles de lecture. Un <strong>framework</strong> (mot anglais qui signifie « cadre de travail ») est un ensemble de code déjà écrit, prêt à l'emploi, qui fournit toute la « plomberie » répétitive. Analogie : construire une maison sans framework, c'est fabriquer soi-même les briques, les tuyaux et les fils électriques ; avec un framework, la structure, la tuyauterie et l'électricité sont déjà là, et tu ne poses que <em>ta</em> décoration — la logique propre à TON application.</p>
<p>Différence clé avec une simple <strong>bibliothèque</strong> (un « library », c'est-à-dire une boîte à outils de fonctions toutes faites) : avec une bibliothèque, <em>ton code appelle</em> la bibliothèque quand il en a besoin. Avec un framework, <em>c'est le framework qui appelle ton code</em> au bon moment. On appelle ça l'<strong>inversion de contrôle</strong> : ce n'est plus toi qui mènes la danse, c'est le cadre. (Analogie : dans une bibliothèque, tu choisis quel outil prendre ; dans un framework, tu es un employé à qui le patron dit « à toi de jouer, maintenant ».) On y revient dès demain.</p>

<h3>3. ASP.NET Core</h3>
<p><strong>.NET</strong> (prononcé « dot net ») est la grande plateforme de développement de Microsoft : elle réunit le langage C# que tu connais, un compilateur et des milliers de bibliothèques. <strong>ASP.NET Core</strong> est la partie de .NET spécialisée dans le <em>web</em> : c'est le framework web de Microsoft. Il est <strong>open source</strong> (son code est public et gratuit), <strong>multiplateforme</strong> (il tourne sous Windows, Linux et Mac — « multiplateforme » veut dire « sur plusieurs systèmes d'exploitation »), et parmi les plus rapides du marché.</p>
<p>Il sert surtout à créer des <strong>API web</strong>. Une <strong>API</strong> (Application Programming Interface, « interface de programmation ») est une porte d'entrée par laquelle d'autres programmes viennent te demander des données ou des actions ; une <strong>API web</strong> est une API que l'on contacte via Internet. Analogie : c'est un guichet standardisé où d'autres logiciels passent commande (« donne-moi la liste des tâches », « ajoute cette tâche ») sans se soucier de comment tu ranges les choses derrière. ASP.NET Core sait aussi produire des pages HTML classiques (leçon 18).</p>

<h3>4. Créer le projet : dotnet new</h3>
<p>Le <strong>SDK</strong> (Software Development Kit, « trousse de développement ») de .NET fournit un outil que l'on tape au clavier dans un <strong>terminal</strong> (la fenêtre noire où l'on écrit des commandes texte) : l'outil <code>dotnet</code>. Voici les commandes pour fabriquer et lancer un projet :</p>
<pre class="pseudo">dotnet new webapi --use-controllers -o GestionnaireTaches   # crée un projet d'API web (modèle "webapi") avec contrôleurs, dans un dossier nommé GestionnaireTaches (-o = output/sortie)
cd GestionnaireTaches                                       # "cd" (change directory) = entrer DANS ce nouveau dossier
dotnet run                                                  # compile le projet puis le lance (démarre le serveur)</pre>
<p><code>dotnet new</code> demande de créer (<em>new</em> = nouveau) un projet à partir d'un <strong>modèle</strong> (un « template » : un projet de départ pré-rempli, comme un document Word déjà mis en forme). Le modèle <code>webapi</code> génère une API web. L'option <code>--use-controllers</code> demande d'utiliser des <em>contrôleurs</em> (on définit ce mot juste après). Voici la structure de dossiers obtenue :</p>
<pre class="pseudo">GestionnaireTaches/                     # le dossier racine du projet
├── GestionnaireTaches.csproj           # le fichier projet : liste la version de .NET et les dépendances
├── Program.cs                          # le point d'entrée : le programme démarre ici + toute la configuration
├── Controllers/                        # dossier de tes contrôleurs d'API (voir plus bas)
├── appsettings.json                    # fichier de configuration (réglages, mots de passe de base de données…)
└── Properties/launchSettings.json      # réglages de démarrage en développement (les ports à écouter)</pre>
<p>Deux mots à retenir ici. Un <strong>contrôleur</strong> est une classe C# qui reçoit les demandes web et décide quoi répondre — c'est le « standardiste » qui prend chaque appel et le dirige. Un <strong>port</strong> est un numéro qui identifie une porte de communication sur ta machine (comme un numéro d'appartement dans un immeuble dont l'adresse serait l'ordinateur) ; deux programmes ne peuvent pas écouter le même port en même temps.</p>

<h3>5. Le point d'entrée : Program.cs</h3>
<p>Le fichier <code>Program.cs</code> est le premier exécuté : c'est le « démarreur » de l'application. Un <strong>point d'entrée</strong> est l'endroit précis où le programme commence (comme la première page d'un livre).</p>
<pre class="pseudo">var builder = WebApplication.CreateBuilder(args);   // crée un "constructeur" d'application ; args = les arguments passés au démarrage
builder.Services.AddControllers();                  // déclare (enregistre) que l'on veut utiliser des contrôleurs

var app = builder.Build();                           // à partir du constructeur, fabrique l'application prête à tourner
app.MapControllers();                                // active les contrôleurs : relie les URL entrantes aux bonnes méthodes
app.Run();                                           // démarre le serveur web et attend les requêtes (bloque ici tant qu'on ne l'arrête pas)</pre>
<ul>
<li>Le mot <code>var</code> crée une <strong>variable</strong> (une case mémoire nommée) et laisse C# deviner son type. <code>builder</code> (« constructeur ») sert à la première étape : on <em>déclare ce dont on a besoin</em>. <code>app</code> (l'application) sert à la seconde : on <em>décrit comment traiter les requêtes</em>.</li>
<li><code>Services</code> est la liste des <strong>services</strong> disponibles. Un <strong>service</strong> est un objet réutilisable qui rend un… service (accéder à la base, envoyer des mails…) ; on les range dans un grand annuaire pour pouvoir les réclamer plus tard (leçon 2, l'injection de dépendances).</li>
<li><strong>Kestrel</strong> est le serveur web intégré à ASP.NET Core : il est déjà dans l'application, rien à installer. Au démarrage il écoute sur un port affiché à l'écran (ex. <code>http://localhost:5080</code>). <code>localhost</code> désigne « ta propre machine ».</li>
</ul>

<h3>6. Le .csproj et NuGet</h3>
<p><strong>NuGet</strong> (prononcé « nou-gette ») est le gestionnaire de paquets de .NET. Un <strong>paquet</strong> (package) est une bibliothèque toute prête que quelqu'un a publiée et que tu peux télécharger. Analogie : NuGet est un magasin en ligne de pièces détachées ; le <code>.csproj</code> est ta liste de courses qui note quelles pièces ton projet utilise.</p>
<pre class="pseudo">dotnet add package Microsoft.EntityFrameworkCore.Sqlite   # télécharge un paquet et l'ajoute automatiquement à la liste (.csproj)
dotnet run                                                # compile (traduit ton C# en programme exécutable) puis lance
dotnet watch                                              # comme run, mais RELANCE tout seul l'application à chaque modification de fichier</pre>
<p>Le mot-clé <code>using</code> que tu utilises depuis le début en C# sert ensuite à <strong>importer</strong> une bibliothèque dans ton code (dire « je vais me servir de ces outils-là »).</p>
<div class="warn">Si le port est déjà occupé (message « address already in use »), c'est qu'un autre programme écoute déjà ce numéro de porte : ferme cet autre programme, ou change le port dans Properties/launchSettings.json.</div>
<div class="tip">dotnet watch est ton meilleur ami en développement : tu sauvegardes le fichier, l'application redémarre toute seule, tu vois le résultat instantanément.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle est la différence fondamentale entre une bibliothèque et un framework ?", opts: ["Aucune, ce sont des synonymes", "Ton code appelle la bibliothèque ; le framework appelle ton code", "Un framework est payant", "Une bibliothèque est plus grosse"], a: 1, exp: "C'est l'inversion de contrôle : le framework pilote, ton code répond." },
    { type: "qcm", q: "ASP.NET Core fonctionne :", opts: ["Uniquement sous Windows", "Sous Windows, Linux et Mac : il est multiplateforme et open source", "Uniquement dans Visual Studio", "Uniquement sur serveur Microsoft"], a: 1, exp: "Depuis .NET Core, l'écosystème Microsoft est ouvert et multiplateforme." },
    { type: "input", q: "Quelle commande crée un projet d'API web avec contrôleurs nommé MonApi ?", a: ["dotnet new webapi --use-controllers -o MonApi", "dotnet new webapi -o MonApi --use-controllers"], ph: "commande complète", exp: "dotnet new webapi --use-controllers -o MonApi." },
    { type: "qcm", q: "Comment s'appelle le serveur web intégré d'ASP.NET Core ?", opts: ["Apache", "Kestrel", "Tomcat", "IIS Express uniquement"], a: 1, exp: "Kestrel est embarqué dans l'application : rien à installer." },
    { type: "qcm", q: "Quel fichier est le point d'entrée et le centre de configuration de l'application ?", opts: ["Main.cs", "Program.cs", "index.cs", "app.config"], a: 1, exp: "builder puis app : tout part de Program.cs." },
    { type: "qcm", q: "Que fait builder.Services.AddControllers() ?", opts: ["Crée un contrôleur", "Enregistre le nécessaire pour utiliser des contrôleurs (à activer ensuite avec MapControllers)", "Compile le projet", "Ouvre le navigateur"], a: 1, exp: "Phase builder = déclarer ; phase app = activer." },
    { type: "qcm", q: "Quel outil gère les paquets (bibliothèques) en .NET ?", opts: ["Composer", "NuGet", "npm", "Maven"], a: 1, exp: "dotnet add package … télécharge depuis nuget.org." },
    { type: "qcm", q: "À quoi sert le fichier .csproj ?", opts: ["À styliser les pages", "À décrire le projet : version de .NET, paquets référencés…", "À stocker les données", "À configurer Windows"], a: 1, exp: "La carte d'identité du projet — l'équivalent du composer.json en PHP ou du pom.xml en Java." },
    { type: "input", q: "Quelle commande compile et lance l'application ?", a: ["dotnet run"], ph: "commande", exp: "dotnet run — et dotnet watch pour le rechargement automatique." },
    { type: "qcm", q: "Quel avantage apporte dotnet watch ?", opts: ["Il chronomètre le code", "Il relance automatiquement l'application à chaque modification de fichier", "Il surveille les pirates", "Il formate le code"], a: 1, exp: "Le cycle modifier → tester devient instantané." },
    { type: "qcm", q: "« Address already in use » au démarrage. Que fais-tu ?", opts: ["Je réinstalle .NET", "Je libère le port ou je le change dans launchSettings.json", "Je supprime Program.cs", "Je change de navigateur"], a: 1, exp: "Un port ne peut être écouté que par un seul programme à la fois." },
    { type: "qcm", q: "Dans quel dossier vivront tes contrôleurs d'API ?", opts: ["Controllers/", "Views/", "Models/", "bin/"], a: 0, exp: "La convention du template webapi." },
    { type: "qcm", q: "Où se trouve la configuration principale (chaînes de connexion, réglages) ?", opts: ["appsettings.json", "Program.cs uniquement", "web.config", ".env"], a: 0, exp: "appsettings.json — étudié en détail à la leçon 14." },
    { type: "vf", q: "Avec ASP.NET Core, il faut installer et configurer un serveur web séparé pour développer.", a: false, exp: "Kestrel est intégré : dotnet run suffit." },
    { type: "vf", q: "Le mot-clé using que tu utilises depuis la leçon 1 de C# sert aussi à importer les bibliothèques NuGet.", a: true, exp: "using System; hier, using Microsoft.EntityFrameworkCore; bientôt." }
  ],
  final: {
    title: "Exercice final — Ton premier projet démarre",
    intro: `<p>Tu viens de créer ton projet et tu le lances. Analyse la situation (les lignes commençant par <code>$</code> sont ce que tu tapes ; les autres, ce que l'ordinateur répond) :</p>
<pre class="pseudo">$ dotnet new webapi --use-controllers -o GestionnaireTaches   # tu demandes la création du projet d'API
The template "ASP.NET Core Web API" was created successfully.   # message : le projet a bien été créé
$ cd GestionnaireTaches                                        # tu entres dans le dossier créé
$ dotnet run                                                   # tu lances l'application
info: Microsoft.Hosting.Lifetime[14]                           # ligne d'information technique (un "log", un journal)
      Now listening on: http://localhost:5080                  # Kestrel écoute : l'appli est joignable sur ce port
info: Microsoft.Hosting.Lifetime[0]                            # autre ligne de journal
      Application started. Press Ctrl+C to shut down.          # l'appli tourne ; Ctrl+C pour l'arrêter</pre>`,
    questions: [
      { type: "qcm", q: "Que confirme la ligne « Now listening on: http://localhost:5080 » ?", opts: ["Une erreur", "Kestrel écoute : l'application est joignable sur ce port", "La base de données est prête", "Le projet est compilé mais arrêté"], a: 1, exp: "L'application tourne et attend des requêtes HTTP." },
      { type: "qcm", q: "Tu ouvres http://localhost:5080 et obtiens une page 404. C'est grave ?", opts: ["Oui, l'application a planté", "Non : l'application tourne, mais aucune route n'est définie pour « / » — le template n'expose qu'une API d'exemple", "Oui, il faut réinstaller .NET", "Non, c'est la page d'accueil normale"], a: 1, exp: "404 = « ça tourne mais rien ici ». Nos premières routes arrivent à la leçon 4." },
      { type: "qcm", q: "Tu veux préparer la suite (base de données). Comment ajouter le paquet Microsoft.EntityFrameworkCore.Sqlite ?", opts: ["En le copiant dans bin/", "dotnet add package Microsoft.EntityFrameworkCore.Sqlite", "using Microsoft.EntityFrameworkCore;", "Le télécharger à la main"], a: 1, exp: "NuGet met à jour le .csproj et télécharge le paquet." },
      { type: "qcm", q: "Ton collègue clone le projet (sans les dossiers bin/ et obj/). Que fait-il pour le lancer ?", opts: ["Il copie ton dossier bin/", "dotnet run : la restauration des paquets et la compilation sont automatiques", "Il réinstalle Windows", "Impossible sans Visual Studio"], a: 1, exp: "Le .csproj décrit tout ; dotnet restore/build/run enchaînent automatiquement." },
      { type: "qcm", q: "Dans ce projet, quel fichier orchestre la configuration et le démarrage ?", opts: ["appsettings.json", "Program.cs : builder (services) puis app (pipeline) puis Run()", "launchSettings.json", "Le contrôleur"], a: 1, exp: "Toute l'architecture de l'application se lit dans Program.cs." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 1 :
// 1. Un framework appelle TON code (inversion de contrôle).
// 2. ASP.NET Core : open source, multiplateforme, très performant.
// 3. dotnet new webapi --use-controllers → un projet d'API prêt à l'emploi.
// 4. Program.cs : builder.Services (déclarer) → app (traiter les requêtes) → Run() (démarrer).
// 5. Kestrel écoute (ex. localhost:5080) ; dotnet watch recharge tout seul.
// 6. NuGet + .csproj : les dépendances (bibliothèques), gérées proprement.</pre>
<p>Garde ce projet : c'est lui qui deviendra l'API du gestionnaire de tâches au fil des leçons, en réutilisant les notions du cours C# (POO, List&lt;T&gt;, LINQ).</p>`
  }
};
