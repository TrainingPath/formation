var DAY = {
  num: 19,
  title: "Swagger, logs et bonnes pratiques",
  subtitle: "Documenter, observer, livrer : les finitions du professionnel.",
  theory: `
<h3>1. Swagger / OpenAPI : l'API qui se documente seule</h3>
<p><strong>OpenAPI</strong> est le format standard de description d'API (un fichier qui décrit toutes les routes, entrées et sorties) ; <strong>Swagger UI</strong> en fait une page interactive où l'on voit et TESTE chaque <strong>endpoint</strong> (un « point d'accès » : une URL + un verbe que l'API expose) :</p>
<pre class="pseudo">builder.Services.AddEndpointsApiExplorer();   // permet à Swagger de découvrir les endpoints
builder.Services.AddSwaggerGen();             // génère le document OpenAPI depuis ton code

if (app.Environment.IsDevelopment())          // en développement UNIQUEMENT
{
    app.UseSwagger();                         // expose le document OpenAPI (JSON)
    app.UseSwaggerUI();                        // → http://localhost:5080/swagger (la page interactive)
}</pre>
<p>La page liste tes contrôleurs, méthodes, DTO et codes de retour — générés depuis TON code. Les clients de ton API (front, mobile) travaillent avec cette page ouverte.</p>
<h3>2. ILogger : la boîte noire</h3>
<p><strong>Logger</strong>, c'est « journaliser » : écrire des messages dans un journal (les <strong>logs</strong>) pour savoir après coup ce qui s'est passé. Le logging est intégré et s'injecte comme tout service :</p>
<pre class="pseudo">public class TacheService
{
    private readonly ILogger&lt;TacheService&gt; _logger;                 // le journal, typé pour cette classe
    public TacheService(ILogger&lt;TacheService&gt; logger) { _logger = logger; }  // injecté (DI)

    public void Terminer(int id)
    {
        _logger.LogInformation("Tâche {Id} terminée", id);          // événement normal (niveau Information)
        _logger.LogWarning("Tentative sur tâche inexistante {Id}", id);  // anormal mais géré (Warning)
        _logger.LogError(ex, "Échec de la notification pour {Id}", id);   // échec réel + exception jointe (Error)
    }
}</pre>
<p>Les niveaux : <code>Trace &lt; Debug &lt; Information &lt; Warning &lt; Error &lt; Critical</code> (du plus bavard au plus grave). Le niveau minimal se règle par environnement dans appsettings.json (leçon 14) : verbeux en dev, sobre en prod.</p>
<h3>3. Le logging structuré</h3>
<p>Remarque <code>"Tâche {Id} terminée", id</code> — PAS une interpolation <code>$"..."</code> ! Les <strong>placeholders nommés</strong> (les trous <code>{Id}</code> remplis par les valeurs qui suivent) produisent des logs <strong>structurés</strong> : les outils (Seq, ELK…) peuvent ensuite filtrer « tous les logs où Id=42 ». Une chaîne interpolée perd cette structure.</p>
<h3>4. Ne jamais logger de secrets</h3>
<p>Jamais de mot de passe, de jeton JWT ou de données personnelles sensibles dans les logs : ils sont lus, archivés, exportés. Un secret loggé est un secret exposé.</p>
<h3>5. La checklist de mise en production</h3>
<pre class="pseudo">✔ dotnet test               → tout vert                            # ne rien livrer sans tests verts
✔ ASPNETCORE_ENVIRONMENT=Production (erreurs neutres, leçon 13)    # mode production
✔ Secrets en variables d'environnement (leçon 14)                 # aucun secret dans le code/Git
✔ HTTPS forcé (app.UseHttpsRedirection())                          # trafic chiffré (jetons !)
✔ Swagger désactivé (ou protégé) en production                    # ne pas publier la carte de l'API
✔ dotnet publish -c Release → binaires optimisés                   # build optimisé pour la prod
✔ Migrations appliquées (dotnet ef database update)                # schéma de base à jour
✔ Logs en Warning minimum + supervision                            # journaux utiles, sans noyer le disque</pre>
<div class="warn">Swagger expose la carte complète de ton API : en production publique, désactive-le ou protège-le. On ne laisse pas le plan du bâtiment à l'entrée.</div>
<div class="tip">Bonne pratique de logs : Information pour les événements métier (création, connexion), Warning pour l'anormal-mais-géré, Error pour l'échec réel avec exception jointe.</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce que Swagger UI ?", opts: ["Un éditeur de code", "Une page interactive générée depuis ton code, qui documente et permet de tester chaque endpoint", "Un ORM", "Un logiciel payant"], a: 1, exp: "La documentation vivante de l'API — /swagger." },
    { type: "qcm", q: "D'où Swagger tire-t-il la liste des endpoints et des DTO ?", opts: ["D'un fichier Word", "De TON code : contrôleurs, attributs, types de retour", "D'un service en ligne", "Il faut tout écrire à la main"], a: 1, exp: "Code = source de vérité : la doc ne peut pas se périmer." },
    { type: "qcm", q: "Comment obtenir un ILogger dans un service ?", opts: ["new Logger()", "Injection : ILogger<TacheService> logger au constructeur", "Logger.Global", "Console.WriteLine suffit"], a: 1, exp: "Le logging est un service du conteneur, comme tout le reste." },
    { type: "qcm", q: "Classe les niveaux du moins au plus grave :", opts: ["Error < Debug < Warning", "Trace < Debug < Information < Warning < Error < Critical", "Info < Trace < Error", "Warning < Debug < Critical"], a: 1, exp: "Six niveaux ; le minimum affiché se configure par environnement." },
    { type: "qcm", q: "Quel niveau pour « un utilisateur s'est inscrit » ?", opts: ["Error", "Information : un événement métier normal digne d'être noté", "Critical", "Trace"], a: 1, exp: "Information trace la vie normale de l'application." },
    { type: "qcm", q: "Quel niveau pour « 5 échecs de connexion sur le même compte en 1 minute » ?", opts: ["Debug", "Warning : suspect, à surveiller", "Information", "Aucun log"], a: 1, exp: "Pas encore une erreur, mais un signal d'attaque possible." },
    { type: "qcm", q: "Pourquoi LogInformation(\"Tâche {Id} terminée\", id) plutôt que $\"Tâche {id} terminée\" ?", opts: ["C'est pareil", "Les placeholders nommés produisent des logs STRUCTURÉS, filtrables par propriété (Id=42)", "L'interpolation est interdite", "Pour la vitesse uniquement"], a: 1, exp: "Le logging structuré : la différence entre du texte et des données." },
    { type: "qcm", q: "Peut-on logger le JWT reçu « pour déboguer » ?", opts: ["Oui, en dev", "Non : un jeton loggé est un jeton volable — aucun secret dans les logs", "Oui, tronqué de 2 caractères", "Oui, le week-end"], a: 1, exp: "Logs = fichiers lus, archivés, exportés. Zéro secret." },
    { type: "qcm", q: "Pourquoi désactiver (ou protéger) Swagger en production publique ?", opts: ["Il est trop lent", "Il expose la carte complète de l'API : un cadeau pour les attaquants", "Il coûte cher", "Il ne marche qu'en dev"], a: 1, exp: "if (app.Environment.IsDevelopment()) autour de UseSwagger." },
    { type: "qcm", q: "Quelle commande produit les binaires optimisés pour le déploiement ?", opts: ["dotnet run", "dotnet publish -c Release", "dotnet watch", "dotnet new"], a: 1, exp: "Release = optimisations activées, prêt à servir." },
    { type: "qcm", q: "Que fait app.UseHttpsRedirection() ?", opts: ["Il chiffre la base", "Il redirige les requêtes HTTP vers HTTPS : le trafic (jetons !) voyage chiffré", "Il accélère le site", "Il gère les erreurs"], a: 1, exp: "Indispensable : un JWT en HTTP clair se vole au vol." },
    { type: "qcm", q: "En production, le niveau de log minimal recommandé est plutôt :", opts: ["Trace (tout voir)", "Warning (ou Information ciblée) : signal utile sans noyer le disque", "Critical uniquement", "Aucun log"], a: 1, exp: "Trop de logs = plus personne ne les lit. Le réglage vit dans appsettings.{Env}.json." },
    { type: "qcm", q: "La checklist avant mise en ligne commence par :", opts: ["Vider les logs", "dotnet test : ne rien livrer sans tests verts", "Renommer le projet", "Supprimer Swagger du code"], a: 1, exp: "La preuve d'abord, le déploiement ensuite." },
    { type: "vf", q: "LogError peut joindre l'exception : _logger.LogError(ex, \"message\") — la stack part dans les logs, pas au client.", a: true, exp: "Exactement le partage des rôles de la leçon 13." },
    { type: "vf", q: "La documentation Swagger doit être maintenue à la main dans un fichier séparé.", a: false, exp: "Elle est GÉNÉRÉE depuis le code : elle ne peut pas mentir." }
  ],
  final: {
    title: "Exercice final — La revue avant mise en ligne",
    intro: `<p>Revue du Program.cs d'un collègue avant le déploiement public :</p>
<pre class="pseudo">var app = builder.Build();

app.UseSwagger();                    // A : hors de tout if → sera exposé en production !
app.UseSwaggerUI();                  // (idem : la carte de l'API publiée à tous)

app.UseExceptionHandler("/error");   // B : placé trop tard dans le pipeline
app.UseHttpsRedirection();           // (le handler d'erreurs devrait être EN PREMIER)

// C : dans un service :
_logger.LogInformation($"Connexion de {email} avec mdp {password}");   // mot de passe loggé + interpolation !

// D : appsettings.json versionné :
"ConnectionStrings": { "Defaut": "Server=prod;Password=Sup3r!" }       // secret de prod dans Git !</pre>`,
    questions: [
      { type: "qcm", q: "Problème A ?", opts: ["Swagger est mal orthographié", "Swagger sera exposé en production : à envelopper dans if (app.Environment.IsDevelopment())", "Swagger doit venir en premier", "Aucun"], a: 1, exp: "La carte de l'API ne se publie pas." },
      { type: "qcm", q: "Problème B ?", opts: ["UseExceptionHandler est inutile", "Il est placé APRÈS Swagger et surtout après d'autres middlewares : le handler d'erreurs doit être EN PREMIER pour tout envelopper", "Il manque un argument", "Aucun"], a: 1, exp: "L'ordre du pipeline est fonctionnel (leçon 13)." },
      { type: "qcm", q: "Problème C — le plus grave ?", opts: ["L'interpolation au lieu des placeholders", "Le MOT DE PASSE est loggé en clair : violation absolue — et l'interpolation casse en plus le log structuré", "Le niveau devrait être Debug", "Le message est trop long"], a: 1, exp: "Deux fautes en une ligne, dont une critique : jamais de secret dans les logs." },
      { type: "qcm", q: "Problème D ?", opts: ["Le nom « Defaut »", "Un mot de passe de production dans un fichier versionné : variable d'environnement obligatoire — et rotation du mot de passe exposé", "Le JSON est invalide", "Aucun"], a: 1, exp: "Leçon 14 : secret dans Git = secret grillé, il faut le CHANGER." },
      { type: "vf", q: "Après correction des quatre points et dotnet test vert, le déploiement peut se faire avec dotnet publish -c Release.", a: true, exp: "La checklist complète : tests, environnement, secrets, HTTPS, Swagger, Release." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 19 :
// 1. Swagger : doc interactive générée du code — dev oui, prod non.
// 2. ILogger<T> injecté ; niveaux Trace→Critical réglés par environnement.
// 3. Logging structuré : placeholders {Id}, jamais d'interpolation.
// 4. JAMAIS de secrets dans les logs ni dans Git.
// 5. Checklist : tests verts, env Production, HTTPS, secrets en variables,
//    Swagger éteint, publish -c Release, migrations appliquées.</pre>
<p>Tout est prêt. Demain : le grand assemblage — le projet guidé de l'API du gestionnaire de tâches.</p>`
  }
};

var ECRITURE = {
  placeholder: "Écris ton code C# ici…",
  items: [
  { id: "dotnet-logs-service", title: "Journaliser le service des tâches", level: 2,
    statement: "Réécris la méthode <code>Terminer(int id)</code> du service pour la journaliser correctement : injection de <code>ILogger&lt;TacheService&gt;</code> ; un <code>Warning</code> structuré si la tâche n'existe pas (avec l'id en placeholder) ; un <code>Information</code> structuré au succès (id + titre) ; et dans le bloc d'envoi de notification, un <code>LogError</code> avec l'exception jointe si l'envoi échoue — sans faire échouer la terminaison pour autant.",
    hints: [
      "Deux dépendances au constructeur : le stockage et le logger.",
      "Placeholders nommés : _logger.LogWarning(\"Tâche {Id} introuvable\", id); — pas de $.",
      "L'envoi de notification : try { ... } catch (Exception ex) { _logger.LogError(ex, \"...\", id); } — on logge et on continue."
    ],
    solution: "public class TacheService\n{\n    private readonly IStockageTaches _stockage;              // couche données\n    private readonly INotification _notification;           // service de notification\n    private readonly ILogger<TacheService> _logger;         // le journal\n\n    public TacheService(IStockageTaches stockage,\n                        INotification notification,\n                        ILogger<TacheService> logger)\n    {\n        _stockage = stockage;                               // dépendances injectées\n        _notification = notification;\n        _logger = logger;\n    }\n\n    public Tache? Terminer(int id)\n    {\n        var tache = _stockage.ParId(id);                    // on cherche la tâche\n        if (tache == null)\n        {\n            // anormal mais géré → Warning, structuré\n            _logger.LogWarning(\"Tentative de terminer la tâche {Id} : introuvable\", id);\n            return null;\n        }\n\n        tache.EstTerminee = true;                           // règle métier : on la termine\n        _logger.LogInformation(\"Tâche {Id} ({Titre}) terminée\", id, tache.Titre);  // événement métier\n\n        try\n        {\n            _notification.Envoyer(tache.Proprietaire, \"Tâche terminée !\");  // envoi (peut échouer)\n        }\n        catch (Exception ex)\n        {\n            // échec secondaire : on LOGGE avec l'exception, on ne casse pas l'action\n            _logger.LogError(ex, \"Échec de notification pour la tâche {Id}\", id);\n        }\n\n        return tache;                                       // la terminaison a réussi\n    }\n}",
    note: "Trois niveaux, trois intentions : Warning (anormal géré), Information (événement métier), Error (échec réel + exception). Et pas un seul $\"…\" : le log reste structuré.",
    atoi: {

    },
    checklist: [
      "Le constructeur reçoit et stocke un ILogger<TacheService> en plus du stockage (dépendances injectées).",
      "Tâche introuvable → _logger.LogWarning avec un placeholder nommé {Id} et return null (pas d'exception levée).",
      "Succès → _logger.LogInformation structuré avec {Id} et {Titre}, jamais une chaîne interpolée $\"…\".",
      "L'échec de notification est capturé (try/catch) et journalisé via _logger.LogError(ex, …, id) SANS interrompre la terminaison (return tache conservé)."
    ] }
  ]
};
