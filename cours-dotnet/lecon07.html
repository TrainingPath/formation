  title: "L'architecture en couches",

  theory: `
<h3>1. Les trois couches</h3>
<p>Une <strong>couche</strong> (layer) est un groupe de classes qui partagent un même rôle ; on les empile comme les étages d'un immeuble, chaque étage ne parlant qu'à son voisin du dessous. Sans le savoir, tu construis depuis lundi une architecture classique :</p>
<pre class="pseudo">CONTRÔLEUR  (Controllers/)   ← parle HTTP : reçoit, traduit, répond   // l'accueil de l'immeuble
    │ appelle
SERVICE     (Services/)      ← la logique métier : règles, calculs, décisions  // les bureaux qui décident
    │ appelle
STOCKAGE    (Repositories/)  ← l'accès aux données : lire/écrire, rien d'autre  // les archives</pre>
<ul>
<li>Le <strong>contrôleur</strong> ne connaît QUE le service : il traduit HTTP ↔ C# (statuts, binding), zéro logique métier.</li>
<li>Le <strong>service</strong> contient les règles : « une tâche terminée ne peut pas être modifiée », « pas plus de 100 tâches par membre »…</li>
<li>Le <strong>repository</strong> (« dépôt », prononcé « ri-po-zi-tori ») lit et écrit les données. Aujourd'hui en mémoire, dès demain en base — sans toucher aux autres couches.</li>
</ul>
<h3>2. Exemple complet</h3>
<pre class="pseudo">public class TacheService                     // la couche métier : les règles
{
    private readonly IStockageTaches _stockage;  // dépendance vers la couche données (injectée)
    public TacheService(IStockageTaches stockage) { _stockage = stockage; }  // DI par constructeur

    public Tache? Terminer(int id)            // règle : marquer une tâche comme terminée
    {
        var tache = _stockage.ParId(id);      // on récupère la tâche via le repository
        if (tache == null) return null;       // introuvable → null (PAS de NotFound ici : ce serait du HTTP)
        if (tache.EstTerminee)                // déjà terminée ?
            throw new InvalidOperationException("Déjà terminée !");  // violation de règle → exception
        tache.EstTerminee = true;             // LA règle métier : on la marque terminée
        return tache;                         // on renvoie la tâche mise à jour
    }
}

// Contrôleur : traduction HTTP pure
[HttpPost("{id:int}/terminer")]               // POST api/taches/3/terminer
public ActionResult&lt;Tache&gt; Terminer(int id)
{
    var tache = _service.Terminer(id);        // on délègue toute la logique au service
    return tache == null ? NotFound() : tache;  // on traduit : null → 404, sinon → 200 + JSON
}</pre>
<h3>3. Pourquoi découper ?</h3>
<ul>
<li><strong>Testabilité</strong> : le service se teste sans HTTP ni base (leçon 15).</li>
<li><strong>Remplaçabilité</strong> : changer le stockage (mémoire → SQL) ne touche ni service ni contrôleur.</li>
<li><strong>Lisibilité</strong> : on sait toujours OÙ chercher une règle, une route, une requête.</li>
</ul>
<p>C'est le principe de <strong>responsabilité unique</strong> : une classe = une raison de changer. Tu l'appliquais déjà avec les méthodes (leçon 8 de C#) — ici, à l'échelle de l'application.</p>
<h3>4. Ce motif est universel</h3>
<p>Spring (Java) a Controller/Service/Repository ; Laravel (PHP) a Contrôleur/Modèle. Les noms varient, l'idée est LA même partout : séparer le transport (HTTP), la logique et les données. Apprends-le une fois, retrouve-le partout.</p>
<h3>5. Où va quel code ? Le guide</h3>
<pre class="pseudo">« Quel statut HTTP renvoyer ? »               → Contrôleur                    // vocabulaire HTTP
« Une tâche terminée est-elle modifiable ? »  → Service                       // règle métier
« Comment chercher par titre ? »              → Repository                    // accès aux données
« Quelle interface pour le stockage ? »       → Contrats (interfaces) partagés  // les contrats entre couches</pre>
<div class="warn">Le piège du débutant : écrire les règles métier dans le contrôleur. Ça marche… jusqu'au jour où la même règle doit servir ailleurs (autre contrôleur, tâche planifiée, test) et qu'on la duplique. La règle vit dans le service, UNE fois.</div>
<div class="tip">Test rapide : si tu peux expliquer une ligne de code sans prononcer « HTTP », « JSON » ou « statut », elle n'a probablement rien à faire dans un contrôleur.</div>`,

    { type: "qcm", q: "L'équivalent de cette architecture existe-t-il ailleurs ?", opts: ["Non, c'est une spécificité de .NET", "Oui : Spring (Java), Laravel (PHP)… séparent pareillement transport, logique et données", "Uniquement dans les frameworks Java", "Seulement dans les applications de bureau"], a: 1, exp: "Un savoir transférable à tout ton avenir de développeur." },

    intro: `<p>Un stagiaire a tout écrit dans le contrôleur. Fais l'audit :</p>
<pre class="pseudo">[HttpPost]                                              // POST api/taches
public ActionResult&lt;Tache&gt; Creer(Tache t)
{
    // A. lecture directe du "stockage" : une liste statique globale
    if (StockageGlobal.Taches.Count(x =&gt; !x.EstTerminee) &gt;= 10)  // état global static : anti-DI

}</pre>`,
