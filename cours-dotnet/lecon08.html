  title: "EF Core : le DbContext et les entités",
  subtitle: "L'ORM de .NET : tes classes C# deviennent des tables.",
  theory: `
<h3>1. Qu'est-ce qu'un ORM ?</h3>
<p>Ton API oublie tout au redémarrage : il faut une <strong>base de données</strong> (un logiciel qui range durablement les données sur le disque et sait les retrouver). Les bases classiques parlent <strong>SQL</strong>, un langage fait de <strong>tables</strong> (des grilles à lignes et colonnes). Un <strong>ORM</strong> (Object-Relational Mapper, « traducteur objet-relationnel ») fait le pont automatiquement entre les objets C# et les tables SQL : une <strong>classe</strong> = une table, un <strong>objet</strong> = une ligne. Analogie : un interprète qui traduit en direct entre deux langues (l'objet et le SQL) pour que tu n'aies qu'à parler C#. Celui de .NET s'appelle <strong>Entity Framework Core</strong> (EF Core).</p>
<h3>2. Installer EF Core (SQLite pour apprendre)</h3>
<pre class="pseudo">dotnet add package Microsoft.EntityFrameworkCore.Sqlite   # le fournisseur SQLite (parler à une base SQLite)
dotnet add package Microsoft.EntityFrameworkCore.Design   # les outils de conception (nécessaires aux migrations, leçon 9)
dotnet tool install --global dotnet-ef                    # l'outil "dotnet ef" en ligne de commande (--global = disponible partout)</pre>
<p><strong>SQLite</strong> : une base qui tient dans un simple fichier <code>taches.db</code> — zéro installation, parfaite pour apprendre. On passera à SQL Server/PostgreSQL en changeant un paquet et une ligne.</p>
<h3>3. L'entité : une classe C# ordinaire</h3>
<p>Une <strong>entité</strong> est simplement une classe dont EF Core fera une table (une « chose » de ton domaine que l'on veut ranger en base) :</p>
<pre class="pseudo">public class Tache                                     // cette entité deviendra la table "Taches"
{
    public int Id { get; set; }                        // clé primaire (convention : la propriété Id !)
    public string Titre { get; set; } = "";            // colonne texte NOT NULL (= "" évite null)
    public bool EstTerminee { get; set; }              // colonne booléenne (0/1 en SQLite)
    public DateTime CreeLe { get; set; } = DateTime.Now;  // colonne date, valeur par défaut = maintenant
}</pre>
<p><strong>Convention</strong> (« convention plutôt que configuration » : bien nommer évite de configurer) : une propriété nommée <code>Id</code> (ou TacheId) devient la <strong>clé primaire</strong> — la colonne qui identifie chaque ligne de façon unique — auto-incrémentée. Pas de configuration.</p>
<h3>4. Le DbContext : la porte vers la base</h3>
<p>Le <strong>DbContext</strong> est l'objet central d'EF Core : la porte d'entrée vers la base, qui expose les tables et suit tes modifications (analogie : le bibliothécaire par qui passent tous les emprunts et retours) :</p>
<pre class="pseudo">public class AppDbContext : DbContext              // notre contexte hérite de DbContext (la classe de base d'EF Core)
{
    public AppDbContext(DbContextOptions&lt;AppDbContext&gt; options)  // reçoit les options (dont la base à utiliser)
        : base(options) { }                        // les transmet à la classe de base

    public DbSet&lt;Tache&gt; Taches =&gt; Set&lt;Tache&gt;();     // une propriété DbSet = une table (ici : Taches)
}</pre>
<p>Chaque <code>DbSet&lt;T&gt;</code> représente une table. <code>context.Taches</code> se manipulera (presque) comme la <code>List&lt;Tache&gt;</code> que tu connais — mais derrière, c'est du SQL.</p>
<h3>5. L'enregistrement au conteneur</h3>
<pre class="pseudo">// appsettings.json                                              // le fichier de configuration (leçon 14)
"ConnectionStrings": { "Defaut": "Data Source=taches.db" }      // la chaîne de connexion nommée "Defaut" : le fichier de base

// Program.cs                                                    // au démarrage de l'application
builder.Services.AddDbContext&lt;AppDbContext&gt;(options =&gt;           // enregistre le contexte au conteneur…
    options.UseSqlite(builder.Configuration.GetConnectionString("Defaut")));  // …en lui disant d'utiliser SQLite avec la chaîne "Defaut"</pre>
<p>Une <strong>chaîne de connexion</strong> est le texte qui indique où et comment joindre la base. <code>AddDbContext</code> enregistre le contexte en <strong>Scoped</strong> (leçon 3 !) : une instance par requête — une « unité de travail » propre à chaque appel HTTP.</p>
<div class="warn">La chaîne de connexion vit dans appsettings.json, jamais en dur dans le code. En production, elle contiendra des mots de passe : leçon 14.</div>
<div class="tip">Une « entité » n'est qu'une classe C# avec des propriétés — exactement celles de la leçon 13 de C#. EF Core lit les propriétés publiques get/set pour construire les colonnes.</div>`,

    intro: `<p>Le projet est prêt pour la base :</p>
<pre class="pseudo">public class Tache                               // entité → table Taches
{
    public int Id { get; set; }                  // clé primaire auto-incrémentée
    public string Titre { get; set; } = "";      // colonne texte NOT NULL

    public bool EstTerminee { get; set; }        // colonne booléenne
    public DateTime CreeLe { get; set; } = DateTime.Now;  // date, défaut = maintenant
}

public class AppDbContext : DbContext            // la porte vers la base
{
    public AppDbContext(DbContextOptions&lt;AppDbContext&gt; options) : base(options) { }  // reçoit et transmet les options

}

// Program.cs
builder.Services.AddDbContext&lt;AppDbContext&gt;(options =&gt;                           // enregistre le contexte (Scoped)

    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 8 :
// 1. ORM : classes ↔ tables, objets ↔ lignes. EF Core pour .NET.

<p>Les classes sont prêtes, la base est vide. Demain : les migrations créent les tables, et le CRUD passe au réel.</p>`
