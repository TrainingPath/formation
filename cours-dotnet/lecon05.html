var DAY = {

  title: "Paramètres de route et query string",
  subtitle: "Viser une ressource précise et affiner les requêtes.",
  theory: `
<h3>1. Les paramètres de route : {id}</h3>
<p>Un <strong>paramètre de route</strong> est une partie <em>variable</em> de l'URL. Le style <strong>REST</strong> (une façon standard d'organiser les URL d'une API : chaque chose accessible est une « ressource » désignée par une adresse) veut que LA tâche n°3 s'obtienne à l'URL <code>api/taches/3</code>. La partie variable se déclare entre accolades et arrive en paramètre de la méthode :</p>
<pre class="pseudo">[HttpGet("{id}")]                    // GET api/taches/{id} : {id} est la partie variable de l'URL
public ActionResult&lt;Tache&gt; ParId(int id)  // le segment {id} arrive dans le paramètre int id
{
    var tache = _stockage.ParId(id);  // on cherche la tâche correspondante dans le stockage
    if (tache == null)                // si aucune tâche n'a cet id…
        return NotFound();            // …renvoyer une réponse 404 (introuvable)

    return tache;                     // sinon renvoyer la tâche → 200 + JSON automatique
}</pre>
<p>ASP.NET Core convertit automatiquement le segment d'URL en <code>int</code> : c'est le <strong>model binding</strong> (« liaison de modèle » : le framework lit l'URL/query/corps et remplit les paramètres C# en les convertissant au bon type). <code>api/taches/abc</code> ne correspond même pas : 404 direct. On peut le rendre explicite : <code>[HttpGet("{id:int}")]</code> (<code>:int</code> = contrainte « ce segment doit être un entier »).</p>
<h3>2. ActionResult&lt;T&gt; : maîtriser le code de statut</h3>
<p>Un <strong>code de statut HTTP</strong> est un nombre à trois chiffres qui résume le résultat (200 = OK, 404 = introuvable, 400 = requête invalide…). Hier, nos méthodes renvoyaient <code>List&lt;Tache&gt;</code> : toujours 200. Le type de retour <code>ActionResult&lt;Tache&gt;</code> permet DEUX issues : la valeur (→ 200) ou un résultat HTTP comme <code>NotFound()</code> (→ 404). Les aides fournies par ControllerBase :</p>
<pre class="pseudo">Ok(objet)            // → 200 + le corps (l'objet sérialisé en JSON)
NotFound()           // → 404 (la ressource n'existe pas)
BadRequest(...)      // → 400 (la requête du client est invalide)
CreatedAtAction(...) // → 201 (ressource créée — au programme de demain !)
NoContent()          // → 204 (succès, mais rien à renvoyer dans le corps)</pre>
<h3>3. La query string : filtres optionnels</h3>
<p>La <strong>query string</strong> (« chaîne de requête ») est la partie d'URL après le <code>?</code>, faite de couples <code>clé=valeur</code> séparés par <code>&amp;</code> — que tu connais depuis les formulaires GET du web. On l'utilise pour filtrer ou trier :</p>
<pre class="pseudo">GET api/taches?terminee=true&amp;tri=titre   // deux options : terminee=true et tri=titre

[HttpGet]                                 // GET api/taches (avec query string optionnelle)
public List&lt;Tache&gt; Toutes(bool? terminee, string? tri)  // paramètres lus dans la query string
{
    var taches = _stockage.Toutes().AsEnumerable();  // point de départ : toutes les tâches (AsEnumerable pour chaîner du LINQ)

    if (terminee != null)                 // si le filtre "terminee" est fourni…
        taches = taches.Where(t =&gt; t.EstTerminee == terminee);  // …ne garder que les tâches correspondantes

    if (tri == "titre")                   // si on demande un tri par titre…
        taches = taches.OrderBy(t =&gt; t.Titre);  // …trier par ordre alphabétique du titre

    return taches.ToList();               // matérialiser le résultat filtré/trié en liste
}</pre>
<p>Les paramètres simples non présents dans la route sont automatiquement lus dans la query string. Le type <strong>nullable</strong> <code>bool?</code> (leçon 2 de C# : un type qui accepte en plus la valeur <code>null</code> « absent ») rend le filtre optionnel : absent → null → pas de filtre.</p>
<h3>4. Convention REST : route vs query</h3>
<pre class="pseudo">L'IDENTITÉ dans la route       : api/taches/3                       // QUELLE ressource ? → dans le chemin
Les OPTIONS dans la query      : api/taches?terminee=true&amp;page=2   // COMMENT la filtrer/paginer ? → après le ?</pre>
<div class="warn">Retourner <code>null</code> depuis une méthode d'API donne un corps vide avec un statut 204 — trompeur ! Une ressource absente doit renvoyer <code>NotFound()</code> : le client saura QUE et POURQUOI ça a échoué.</div>
<div class="tip">[FromQuery], [FromRoute] existent pour lever toute ambiguïté sur l'origine d'un paramètre — utile quand les conventions ne suffisent plus.</div>`,
  exercises: [
    { type: "qcm", q: "Comment déclarer une route qui capture l'id : GET api/taches/5 ?", opts: ["[HttpGet(\"id\")]", "[HttpGet(\"{id}\")] avec un paramètre int id", "[HttpGet(\"?id\")]", "[HttpGet(5)]"], a: 1, exp: "Les accolades = segment variable, lié au paramètre du même nom." },
    { type: "qcm", q: "GET api/taches/abc avec [HttpGet(\"{id:int}\")] :", opts: ["id vaut 0", "404 : la contrainte :int rejette la route", "Une erreur serveur 500", "abc est converti en entier"], a: 1, exp: "La contrainte filtre dès le routage." },
    { type: "qcm", q: "À quoi sert le type de retour ActionResult<Tache> ?", opts: ["À valider automatiquement le modèle reçu", "À pouvoir renvoyer SOIT une tâche (200) SOIT un résultat HTTP (404, 400…)", "À accélérer la sérialisation JSON", "À forcer une réponse au format XML"], a: 1, exp: "Le type à tout faire des méthodes d'API." },
    { type: "qcm", q: "Que renvoie return NotFound(); ?", opts: ["Une réponse 200 avec un corps vide", "Une réponse 404 Not Found", "Une exception", "La valeur null sérialisée en JSON"], a: 1, exp: "Le code de statut raconte l'histoire au client." },
    { type: "qcm", q: "La tâche demandée n'existe pas. Pourquoi ne pas simplement return null; ?", opts: ["null est interdit en C#", "Le client recevrait un corps vide/204 ambigu ; NotFound() dit clairement « n'existe pas »", "null plante le serveur", "Le résultat serait strictement identique"], a: 1, exp: "Une API parle en codes de statut : sois explicite." },
    { type: "qcm", q: "Dans GET api/taches?terminee=true, où est lu terminee ?", opts: ["Dans la route", "Dans la query string, lié automatiquement au paramètre bool? terminee", "Dans le corps", "Dans un cookie"], a: 1, exp: "Paramètre simple absent de la route → query string." },
    { type: "qcm", q: "Pourquoi bool? plutôt que bool pour un filtre optionnel ?", opts: ["Pour respecter une convention d'écriture", "bool? peut être null (= paramètre absent = pas de filtre) ; bool vaudrait false par défaut, ambigu", "bool? est plus rapide", "Aucune différence"], a: 1, exp: "Le nullable (leçon 2 de C#) distingue « absent » de « false »." },
    { type: "qcm", q: "Convention REST : où placer l'identité de la ressource et où placer les options ?", opts: ["Tout en query", "Identité dans la route (taches/3), options en query (?tri=titre)", "Tout dans la route", "Dans le corps"], a: 1, exp: "api/taches/3 ≠ api/taches?id=3 : la première forme est la bonne." },
    { type: "qcm", q: "Que fait Ok(tache) ?", opts: ["Vérifie la validité de la tâche", "Renvoie 200 avec la tâche sérialisée en JSON", "Renvoie un statut 201 Created", "Enregistre l'opération dans un journal"], a: 1, exp: "Explicite l'issue heureuse — équivalent à retourner la valeur." },
    { type: "qcm", q: "GET api/taches?tri=titre&terminee=false appelle Toutes(bool? terminee, string? tri). Valeurs reçues ?", opts: ["null et null", "terminee=false, tri=\"titre\" : l'ordre dans l'URL n'importe pas", "Une erreur de liaison de paramètres", "terminee reçoit la valeur titre"], a: 1, exp: "Le binding se fait par NOM, pas par position." },
    { type: "qcm", q: "Le « model binding », c'est :", opts: ["Un design pattern de base de données", "La conversion automatique URL/query/corps → paramètres C# typés", "Un protocole de connexion réseau", "Un attribut de validation de formulaire"], a: 1, exp: "Le framework parse et convertit pour toi — string \"3\" → int 3." },
    { type: "qcm", q: "Quel attribut force la lecture d'un paramètre depuis la query string ?", opts: ["[FromBody]", "[FromQuery]", "[FromRoute]", "[FromForm]"], a: 1, exp: "Utile pour lever les ambiguïtés." },
    { type: "input", q: "Quelle aide de ControllerBase renvoie un statut 400 ?", a: ["BadRequest", "BadRequest()"], ph: "nom de la méthode", exp: "BadRequest(détails) : la requête du client est invalide." },
    { type: "vf", q: "Avec [HttpGet(\"{id}\")], le paramètre C# doit s'appeler exactement comme le segment ({id} → int id).", a: true, exp: "La liaison route↔paramètre se fait par le nom." },
    { type: "vf", q: "Une méthode peut combiner paramètre de route ET paramètres de query : GET api/taches/3?details=true.", a: true, exp: "ParId(int id, bool? details) : chacun est lié à sa source." }
  ],
  final: {
    title: "Exercice final — L'API qui vise juste",
    intro: `<p>Session de test de l'API des tâches :</p>
<pre class="pseudo">$ curl -i http://localhost:5080/api/taches/2          # on demande la tâche n°2 (-i = affiche aussi la ligne de statut)
HTTP/1.1 200 OK                                       # trouvée : statut 200

$ curl -i http://localhost:5080/api/taches/99         # on demande la tâche n°99

$ curl -i "http://localhost:5080/api/taches?terminee=false"  # filtre : les tâches non terminées
HTTP/1.1 200 OK                                       # succès
[{"id":2,"titre":"Réviser ASP.NET","estTerminee":false}]  # le tableau filtré

$ curl -i http://localhost:5080/api/taches/deux       # "deux" n'est pas un entier
HTTP/1.1 404 Not Found                                # la contrainte {id:int} rejette : 404</pre>`,
    questions: [
      { type: "qcm", q: "Pourquoi la 2e requête renvoie-t-elle 404 ?", opts: ["L'URL est mal orthographiée", "L'id 99 n'existe pas : la méthode a exécuté return NotFound();", "Le serveur est éteint", "La commande curl est mal formée"], a: 1, exp: "Le contrôle du code de statut via ActionResult." },
      { type: "qcm", q: "Et la 4e (taches/deux) ?", opts: ["deux est converti en 2", "« deux » n'est pas un int : la route {id:int} ne correspond pas → 404 dès le routage", "Une erreur serveur 500", "Un statut 200 avec un corps vide"], a: 1, exp: "Le model binding + la contrainte de type protègent la méthode." },
      { type: "qcm", q: "Dans la 3e requête, comment terminee=false atteint-il la méthode ?", opts: ["Par la route", "Query string → paramètre bool? terminee via le model binding", "Par le corps JSON", "Par un header"], a: 1, exp: "?cle=valeur → paramètre du même nom." },
      { type: "qcm", q: "Sans le paramètre ?terminee, que renvoie GET api/taches ?", opts: ["Erreur : paramètre requis", "Toutes les tâches : terminee est null, aucun filtre appliqué", "Uniquement les tâches terminées", "Un tableau vide []"], a: 1, exp: "Le nullable rend le filtre réellement optionnel." },
      { type: "vf", q: "Ces réponses montrent que l'API « parle » avec les codes de statut : 200 = trouvé, 404 = inexistant.", a: true, exp: "Les codes de statut sont le vocabulaire des API — les clients en dépendent." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 5 :
// 1. [HttpGet("{id:int}")] + paramètre int id : la route capture et convertit.
// 2. ActionResult<T> : la valeur (200) OU un statut (NotFound → 404).
// 3. Ressource absente = NotFound(), jamais null.
// 4. Query string (?x=1&y=2) → paramètres nullables optionnels.
// 5. REST : identité dans la route, options dans la query.</pre>
<p>On sait lire. Demain : écrire — POST, JSON entrant et le model binding du corps de requête.</p>`
  }
};
