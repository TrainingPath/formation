<script>
var DAY = {
  num: 2,
  title: "L'injection de dépendances",
  subtitle: "Le concept central de tout ASP.NET Core : ne plus jamais écrire new pour ses services.",
  theory: `
<h3>1. Le problème du new</h3>
<p>Rappel de vocabulaire : une <strong>classe</strong> est le <em>plan</em> d'un objet (comme le plan d'une maison), et un <strong>objet</strong> est une maison construite à partir de ce plan. Le mot-clé <code>new</code> signifie « construis-moi un objet à partir de ce plan ». Enfin, une <strong>dépendance</strong> est un objet dont une classe a <em>besoin</em> pour travailler (ici : un objet capable de sauvegarder). Au cours C#, ton gestionnaire de tâches créait ses dépendances lui-même :</p>
<pre class="pseudo">class GestionnaireTaches                                                  // une classe = le plan d'un objet (ici, le gestionnaire de tâches)
{
    private StockageFichier stockage = new StockageFichier("taches.txt");  // il FABRIQUE lui-même son stockage avec new : il est soudé à cette classe précise
}</pre>
<p>Problème : GestionnaireTaches est <strong>soudé</strong> à StockageFichier. Impossible de passer à une base de données, ou de tester avec un stockage factice, sans modifier la classe. On appelle ce lien rigide un <strong>couplage fort</strong> (analogie : un appareil dont le câble est soudé à l'intérieur — pour le remplacer, il faut ouvrir et ressouder). Le <code>new</code> crée ce couplage fort.</p>
<h3>2. La solution : recevoir au lieu de créer</h3>
<p>On retourne la responsabilité : la classe <strong>déclare</strong> ce dont elle a besoin (via une <strong>interface</strong> — un <em>contrat</em> qui liste les services promis sans dire comment ils sont réalisés, leçon 15 de C#) et le <strong>reçoit par constructeur</strong>. Le <strong>constructeur</strong> est la méthode spéciale appelée au moment du <code>new</code> pour préparer l'objet :</p>
<pre class="pseudo">public interface IStockage                          // une interface = un CONTRAT : la liste des services promis, sans le code qui les réalise
{
    void Sauvegarder(Tache tache);                  // le contrat promet une seule chose : savoir "Sauvegarder" une tâche
}

public class GestionnaireTaches                     // la classe qui a BESOIN d'un stockage pour travailler
{
    private readonly IStockage _stockage;           // un champ pour ranger le stockage reçu ; readonly = fixé une seule fois

    public GestionnaireTaches(IStockage stockage)   // le constructeur RÉCLAME un IStockage : il l'attend de l'extérieur (il est "injecté")
    {
        _stockage = stockage;                       // on garde la dépendance reçue dans le champ (aucun new ici !)
    }
}</pre>
<p>C'est l'<strong>injection de dépendances</strong> (DI) : au lieu de <em>créer</em> ses dépendances, la classe se les fait <em>fournir</em> de l'extérieur (analogie : le plombier n'invente pas ses outils, on les lui tend). GestionnaireTaches ne sait pas — et n'a pas besoin de savoir — si le stockage est un fichier, une base, ou un faux pour les tests.</p>
<h3>3. Qui fournit les objets ? Le conteneur</h3>
<p>ASP.NET Core embarque un <strong>conteneur de services</strong> : un <em>annuaire central</em> où l'on inscrit « pour telle interface, fournis telle classe » (analogie : un standard téléphonique qui, quand on demande un service, sait quel objet décroche). On l'appelle aussi <em>conteneur d'injection de dépendances</em> :</p>
<pre class="pseudo">// Program.cs                                            // dans le fichier de démarrage de l'application (leçon 1)
builder.Services.AddScoped&lt;IStockage, StockageFichier&gt;();  // on inscrit au conteneur : "quand une classe demande un IStockage, fournis-lui un StockageFichier"</pre>
<p>Ensuite, partout où un constructeur demande un <code>IStockage</code>, le conteneur fournit un <code>StockageFichier</code>. Automatiquement. Tu n'écris plus jamais <code>new StockageFichier(...)</code>.</p>
<h3>4. Pourquoi c'est une révolution</h3>
<ul>
<li><strong>Changer d'implémentation = une ligne</strong> : AddScoped&lt;IStockage, StockageBaseDeDonnees&gt;() et toute l'application bascule.</li>
<li><strong>Tests faciles</strong> : on injecte un faux stockage en mémoire (leçon 15).</li>
<li><strong>Chaînage automatique</strong> : si StockageFichier a lui-même des dépendances, le conteneur les fournit aussi, en cascade.</li>
</ul>
<h3>5. Le lien avec le cours C#</h3>
<p>Tout repose sur deux notions que tu connais déjà : les <strong>interfaces</strong> (leçon 15 de C# : « un contrat, plusieurs implémentations ») et le <strong>polymorphisme</strong> (leçon 14 : un même contrat peut prendre plusieurs formes concrètes). La DI, c'est le polymorphisme organisé à l'échelle d'une application.</p>
<div class="warn">Convention C# : les champs privés injectés se nomment avec un underscore (<code>_stockage</code>) et sont <code>readonly</code> : assignés une seule fois, dans le constructeur.</div>
<div class="tip">Règle simple : si une classe contient de la logique (service, stockage, calcul), on ne la « new » jamais dans une autre classe — on l'enregistre au conteneur et on l'injecte. Le new reste parfait pour les simples objets de données (new Tache { ... }).</div>`,
  exercises: [
    { type: "qcm", q: "Quel problème pose private StockageFichier stockage = new StockageFichier(); ?", opts: ["Une erreur de compilation", "Un couplage fort : impossible de changer d'implémentation ou de tester sans modifier la classe", "C'est trop lent", "Le champ est public"], a: 1, exp: "La classe décide elle-même de son fournisseur : elle est soudée à lui." },
    { type: "qcm", q: "Que signifie « injection de dépendances » ?", opts: ["Ajouter des paquets NuGet", "La classe déclare ses besoins (constructeur) et un tiers les lui fournit", "Copier du code", "Une attaque informatique"], a: 1, exp: "Recevoir au lieu de créer." },
    { type: "qcm", q: "Quel élément du cours C# sert de « contrat » pour l'injection ?", opts: ["Le struct", "L'interface (leçon 15 de C#)", "L'enum", "Le tableau"], a: 1, exp: "On dépend du contrat (IStockage), pas de l'implémentation." },
    { type: "qcm", q: "Comment enregistrer « pour IStockage, fournir StockageFichier » ?", opts: ["builder.Services.AddScoped<IStockage, StockageFichier>();", "new IStockage()", "app.Map<IStockage>()", "using IStockage;"], a: 0, exp: "L'enregistrement au conteneur, dans Program.cs." },
    { type: "qcm", q: "Qui appelle le constructeur de GestionnaireTaches(IStockage stockage) dans une application ASP.NET Core ?", opts: ["Toi, avec new", "Le conteneur de services, qui fournit aussi le paramètre", "Le compilateur", "Kestrel directement"], a: 1, exp: "Inversion de contrôle : le framework crée et câble les objets." },
    { type: "qcm", q: "Pour passer du stockage fichier à une base de données dans TOUTE l'application :", opts: ["Modifier chaque classe utilisatrice", "Changer UNE ligne d'enregistrement dans Program.cs", "Recompiler .NET", "C'est impossible"], a: 1, exp: "AddScoped<IStockage, StockageBdd>() : tout le monde bascule." },
    { type: "qcm", q: "Pourquoi la DI facilite-t-elle les tests ?", opts: ["Elle ne les facilite pas", "On peut injecter une implémentation factice (en mémoire) à la place de la vraie", "Les tests deviennent inutiles", "Elle génère les tests"], a: 1, exp: "Le code testé ne voit que l'interface : vrai ou faux stockage, il ne fait pas la différence." },
    { type: "qcm", q: "Convention de nommage du champ privé qui reçoit la dépendance :", opts: ["stockage_", "_stockage, en readonly", "STOCKAGE", "s"], a: 1, exp: "private readonly IStockage _stockage; — le style standard C#." },
    { type: "qcm", q: "Pourquoi readonly sur le champ injecté ?", opts: ["Pour la performance", "Il est assigné une seule fois (au constructeur) et ne doit jamais changer ensuite", "C'est obligatoire en C#", "Pour le rendre public"], a: 1, exp: "readonly documente et protège : la dépendance est fixée à la construction." },
    { type: "qcm", q: "Si StockageFichier demande lui-même un ILogger en constructeur, qui le fournit ?", opts: ["Toi", "Le conteneur, en cascade : il résout toute la chaîne de dépendances", "Personne : erreur", "Le fichier appsettings"], a: 1, exp: "Le conteneur construit l'arbre entier des dépendances." },
    { type: "qcm", q: "Sur quelles notions du cours C# la DI repose-t-elle ?", opts: ["Les boucles et les tableaux", "Les interfaces et le polymorphisme", "Les enum et DateTime", "La console"], a: 1, exp: "Un contrat, plusieurs implémentations, choisies à l'exécution." },
    { type: "qcm", q: "Peut-on encore écrire new Tache { Titre = \"Courses\" } ?", opts: ["Non, new est interdit", "Oui : les objets de données se créent normalement ; la DI concerne les SERVICES", "Seulement dans Program.cs", "Seulement en test"], a: 1, exp: "DI pour la logique, new pour les données." },
    { type: "input", q: "Comment s'abrège « injection de dépendances » en anglais (2 lettres) ?", a: ["DI"], ph: "sigle", exp: "DI : Dependency Injection. Tu liras ce sigle partout." },
    { type: "vf", q: "Avec la DI, une classe qui a besoin d'un service doit connaître la classe concrète qui l'implémente.", a: false, exp: "Justement non : elle ne connaît que l'interface. C'est tout l'intérêt." },
    { type: "vf", q: "Le conteneur de services d'ASP.NET Core est intégré : aucun paquet supplémentaire n'est nécessaire.", a: true, exp: "builder.Services est disponible dès le template de base." }
  ],
  final: {
    title: "Exercice final — Lire le câblage d'une application",
    intro: `<p>Voici le Program.cs du gestionnaire de tâches et un service :</p>
<pre class="pseudo">// Program.cs                                                    // fichier de démarrage : on y enregistre les services
builder.Services.AddScoped&lt;INotification, NotificationEmail&gt;();  // "pour un INotification, fournis une NotificationEmail"
builder.Services.AddScoped&lt;IStockageTaches, StockageFichier&gt;(); // "pour un IStockageTaches, fournis un StockageFichier"

// Service                                                       // une classe métier qui a deux dépendances
public class RappelService                                       // le service qui envoie les rappels de tâches en retard
{
    private readonly IStockageTaches _stockage;                 // dépendance 1 : d'où viennent les tâches
    private readonly INotification _notification;               // dépendance 2 : comment prévenir le propriétaire

    public RappelService(IStockageTaches stockage, INotification notification)  // le conteneur fournira les DEUX paramètres
    {
        _stockage = stockage;                                   // on mémorise la 1re dépendance
        _notification = notification;                           // on mémorise la 2e dépendance
    }

    public void EnvoyerRappels()                                // parcourt les tâches en retard et prévient
    {
        foreach (var tache in _stockage.TachesEnRetard())       // pour chaque tâche en retard fournie par le stockage
            _notification.Envoyer(tache.Proprietaire, "Tâche en retard : " + tache.Titre);  // on délègue l'envoi au service de notification
    }
}</pre>`,
    questions: [
      { type: "qcm", q: "Quand le conteneur crée un RappelService, que fournit-il pour les deux paramètres ?", opts: ["null et null", "Un StockageFichier et une NotificationEmail, selon les enregistrements", "Deux interfaces vides", "Une exception"], a: 1, exp: "Le conteneur lit les enregistrements et câble tout." },
      { type: "qcm", q: "Combien de « new » RappelService contient-il ?", opts: ["Deux", "Zéro : tout est reçu par constructeur", "Un", "Trois"], a: 1, exp: "Aucun couplage : la classe ne connaît que des contrats." },
      { type: "qcm", q: "Demain, on veut des notifications par SMS. Que modifie-t-on ?", opts: ["RappelService", "Une ligne : AddScoped<INotification, NotificationSms>() (et on écrit la classe NotificationSms)", "Toutes les classes", "Le .csproj uniquement"], a: 1, exp: "RappelService ne bouge pas d'une virgule." },
      { type: "qcm", q: "Pour tester EnvoyerRappels() sans envoyer de vrais emails :", opts: ["On teste en production", "On injecte une fausse INotification qui mémorise les appels au lieu d'envoyer", "On supprime la notification", "Impossible à tester"], a: 1, exp: "Le grand bénéfice de dépendre d'interfaces." },
      { type: "vf", q: "RappelService doit aussi être enregistré au conteneur pour être injectable ailleurs.", a: true, exp: "builder.Services.AddScoped<RappelService>() — tout service injecté doit être connu du conteneur." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 2 :
// 1. new = couplage fort. Pour les services : recevoir au lieu de créer.
// 2. La classe déclare ses besoins en INTERFACES, via le constructeur.
// 3. Le conteneur (builder.Services) associe interface → implémentation
//    et construit tout l'arbre des objets à ta place.
// 4. Changer d'implémentation = 1 ligne ; tester = injecter un faux.
// 5. Style : private readonly IXxx _xxx; assigné au constructeur.</pre>
<p>Demain : les trois durées de vie des services (Singleton, Scoped, Transient) — ou quand le conteneur crée-t-il les objets ?</p>`
  }
};

var ECRITURE = {
  placeholder: "Écris ton code C# ici…",
  items: [
  { id: "dotnet-di-rappel", title: "Injecter un service de notification", level: 1,
    statement: "Écris une classe <code>RappelService</code> qui dépend de l'interface <code>INotification</code> (existante, avec une méthode <code>Envoyer(string destinataire, string message)</code>). Elle expose une méthode <code>EnvoyerRappel(string membre)</code> qui appelle <code>Envoyer(membre, \"Tâche à terminer aujourd'hui\")</code>. Utilise l'injection par constructeur et les conventions C#. Ajoute la ligne d'enregistrement au conteneur (implémentation <code>NotificationEmail</code>).",
    hints: [
      "Le champ : private readonly INotification _notification;",
      "Le constructeur reçoit INotification et l'affecte au champ.",
      "L'enregistrement : builder.Services.AddScoped<INotification, NotificationEmail>();"
    ],
    solution: "public class RappelService                          // un service qui envoie des rappels aux membres\n{\n    private readonly INotification _notification;  // le contrat, jamais new\n\n    // Le conteneur appelle ce constructeur\n    // et fournit l'implémentation enregistrée\n    public RappelService(INotification notification)\n    {\n        _notification = notification;              // on mémorise la dépendance reçue\n    }\n\n    public void EnvoyerRappel(string membre)       // envoie un rappel au membre passé en paramètre\n    {\n        // on délègue au service injecté\n        _notification.Envoyer(membre, \"Tâche à terminer aujourd'hui\");  // envoi effectif via l'implémentation choisie\n    }\n}\n\n// Program.cs :\nbuilder.Services.AddScoped<INotification, NotificationEmail>();  // pour un INotification, fournir une NotificationEmail\nbuilder.Services.AddScoped<RappelService>();                     // enregistrer aussi le service pour pouvoir l'injecter ailleurs",
    note: "Le trio gagnant : interface + private readonly + constructeur. Tu l'écriras des centaines de fois — autant qu'il devienne un réflexe." }
  ]
};
