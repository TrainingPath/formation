var DAY = {
  num: 13,
  title: "Gérer les erreurs proprement",
  subtitle: "Exceptions, middleware et ProblemDetails : quand ça casse, casser bien.",
  theory: `
<h3>1. Le pipeline de middlewares</h3>
<p>Un <strong>middleware</strong> (« logiciel intermédiaire ») est un maillon par lequel passe chaque requête avant d'atteindre le contrôleur ; l'ensemble de ces maillons forme le <strong>pipeline</strong> (« conduite » : la file de traitements que la requête traverse). La réponse refait le chemin inverse :</p>
<pre class="pseudo">Requête ─▶ [gestion erreurs] ─▶ [HTTPS] ─▶ [auth*] ─▶ Contrôleur   // la requête descend la chaîne
Réponse ◀──────────┴───────────────┴──────────┴────────┘          // la réponse remonte
// * : leçons 16-17. L'ORDRE des app.UseXxx() dans Program.cs EST le pipeline.</pre>
<p>Le middleware de gestion d'erreurs est placé EN PREMIER : ainsi, il enveloppe tout le reste et attrape toute exception qui remonte.</p>
<h3>2. La stratégie : laisser remonter, attraper au sommet</h3>
<p>Une <strong>exception</strong> est un signal d'erreur qui « remonte » la pile d'appels jusqu'à ce que quelqu'un l'attrape (leçon 16 de C#). Comme au cours C# : on n'attrape une exception que si on sait quoi en faire. Dans une API, la plupart remontent jusqu'au middleware d'erreurs qui les convertit en réponse HTTP propre :</p>
<pre class="pseudo">// Program.cs
app.UseExceptionHandler("/error");    // production : capte toute exception et renvoie une réponse neutre
// en développement, la page d'erreur détaillée est automatique</pre>
<h3>3. ProblemDetails : le format d'erreur standard</h3>
<p>Les API ASP.NET Core répondent aux erreurs au format <strong>ProblemDetails</strong> (un standard du web, RFC 7807 : une structure JSON commune à toutes les erreurs, avec type/title/status) :</p>
<pre class="pseudo">{
  "type":  "https://tools.ietf.org/html/rfc9110#section-15.5.5",
  "title": "Not Found",
  "status": 404
}</pre>
<p>Les aides <code>NotFound()</code>, <code>BadRequest()</code>, <code>Problem()</code> le produisent ; la validation de la leçon 12 aussi (ValidationProblemDetails). Tous les clients savent le lire.</p>
<h3>4. Exceptions métier → statuts HTTP</h3>
<p>Le service lève des exceptions métier ; une seule traduction, centralisée :</p>
<pre class="pseudo">public class RegleMetierException : Exception             // une exception "maison" (hérite d'Exception)
{
    public RegleMetierException(string message) : base(message) { }  // transmet le message à la classe de base
}

// Un handler centralisé (simplifié) :
app.UseExceptionHandler(a =&gt; a.Run(async context =&gt;       // installe le gestionnaire global d'exceptions
{
    var ex = context.Features.Get&lt;IExceptionHandlerFeature&gt;()?.Error;  // récupère l'exception qui a été levée
    context.Response.StatusCode = ex is RegleMetierException ? 400 : 500;  // règle métier → 400, sinon → 500
    await context.Response.WriteAsJsonAsync(new {          // écrit la réponse JSON
        title = ex is RegleMetierException ? ex.Message : "Erreur interne",  // message métier public, sinon neutre
        status = context.Response.StatusCode               // le code de statut choisi
    });
}));</pre>
<h3>5. Développement vs production</h3>
<pre class="pseudo">if (app.Environment.IsDevelopment())      // sommes-nous en mode développement ?
    app.UseDeveloperExceptionPage();      // OUI : page d'erreur détaillée (stack trace) — POUR TOI, le développeur
else
    app.UseExceptionHandler("/error");    // NON (production) : réponse neutre — pour les clients</pre>
<div class="warn">Une stack trace en production révèle ton code, tes chemins de fichiers, parfois tes requêtes SQL. Les détails vont dans les LOGS (leçon 19), jamais dans la réponse HTTP publique.</div>
<div class="tip">Un try/catch qui fait catch (Exception) { } (avaler sans rien faire) est pire que pas de catch : le bug devient invisible. Attraper, c'est traiter OU relancer.</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'un middleware ?", opts: ["Une table", "Un maillon du pipeline traversé par chaque requête (et réponse)", "Un paquet NuGet", "Un contrôleur spécial"], a: 1, exp: "app.UseXxx() les empile ; l'ordre est le pipeline." },
    { type: "qcm", q: "Pourquoi le middleware d'erreurs est-il placé EN PREMIER dans le pipeline ?", opts: ["Par tradition", "Pour envelopper tout le reste et attraper toute exception qui remonte", "Il est plus rapide", "C'est imposé"], a: 1, exp: "Premier entré = dernier traversé au retour = filet de sécurité global." },
    { type: "qcm", q: "Quelle est la bonne stratégie face aux exceptions dans une API ?", opts: ["try/catch autour de chaque ligne", "Laisser remonter par défaut ; attraper localement seulement si on sait traiter ; convertir au sommet", "Les ignorer", "Les logger et continuer comme si de rien n'était"], a: 1, exp: "La leçon 16 de C#, appliquée au web." },
    { type: "qcm", q: "Qu'est-ce que ProblemDetails ?", opts: ["Un bug connu", "Le format JSON standard (RFC 7807) des erreurs d'API : type, title, status…", "Un paquet payant", "Un log"], a: 1, exp: "NotFound(), BadRequest(), la validation… le produisent automatiquement." },
    { type: "qcm", q: "Quel statut pour une exception imprévue non traduite ?", opts: ["400", "500 Internal Server Error", "404", "204"], a: 1, exp: "500 = « c'est ma faute, pas la tienne » — l'aveu honnête du serveur." },
    { type: "qcm", q: "Une RegleMetierException (« déjà terminée ») devrait devenir quel statut ?", opts: ["500", "400 (ou 409 Conflict) : la requête du client viole une règle — ce n'est pas un bug du serveur", "404", "201"], a: 1, exp: "Traduire la nature de l'erreur en code : 4xx = client, 5xx = serveur." },
    { type: "qcm", q: "Pourquoi PAS de stack trace dans les réponses de production ?", opts: ["Trop longue", "Elle révèle code, chemins, SQL : de l'or pour un attaquant — les détails vont dans les logs", "Le JSON l'interdit", "Ça ralentit"], a: 1, exp: "Page neutre dehors, détails dedans." },
    { type: "qcm", q: "Que fait app.UseDeveloperExceptionPage() ?", opts: ["Corrige les bugs", "Affiche la page d'erreur détaillée (stack, requête…) — en développement uniquement", "Envoie un email", "Redémarre l'app"], a: 1, exp: "Trésor en dev, faille en prod : d'où le if IsDevelopment." },
    { type: "qcm", q: "catch (Exception) { } — attraper et ne rien faire. Verdict ?", opts: ["Prudent", "Pire que tout : le bug devient invisible et les données peuvent rester incohérentes", "Recommandé en prod", "Obligatoire"], a: 1, exp: "Avaler une exception = enterrer un problème vivant." },
    { type: "qcm", q: "Où l'exception d'un service non attrapée finit-elle ?", opts: ["Elle disparaît", "Elle remonte contrôleur → pipeline → middleware d'erreurs, qui répond proprement", "Elle plante Kestrel définitivement", "Dans la base"], a: 1, exp: "Le filet de sécurité global fait son travail." },
    { type: "qcm", q: "Comment créer une exception métier personnalisée ?", opts: ["C'est impossible", "class RegleMetierException : Exception — l'héritage de la leçon 14 de C#", "Un attribut [Exception]", "Une interface"], a: 1, exp: "Une classe dédiée = une traduction HTTP dédiée possible." },
    { type: "qcm", q: "Quelle méthode de ControllerBase produit un ProblemDetails personnalisé ?", opts: ["Error()", "Problem(title: \"...\", statusCode: 500)", "Throw()", "Fail()"], a: 1, exp: "Pour les cas où tu veux la main sur le contenu." },
    { type: "qcm", q: "app.Environment.IsDevelopment() lit quelle information ?", opts: ["Le .csproj", "L'environnement d'exécution (variable ASPNETCORE_ENVIRONMENT) — leçon 14 demain !", "La version de C#", "Le nom de la machine"], a: 1, exp: "Development, Staging, Production : le comportement s'adapte." },
    { type: "vf", q: "L'ordre des app.UseXxx() dans Program.cs n'a aucune importance.", a: false, exp: "L'ordre EST le pipeline : erreurs d'abord, puis HTTPS, auth… puis MapControllers." },
    { type: "vf", q: "Les erreurs de validation de la leçon 12 utilisent déjà le format ProblemDetails.", a: true, exp: "ValidationProblemDetails : le champ errors en plus du standard." }
  ],
  final: {
    title: "Exercice final — L'anatomie d'un incident",
    intro: `<p>En production, un client appelle POST /api/taches/7/terminer alors que la tâche est déjà terminée. Le service lève <code>RegleMetierException("Tâche déjà terminée")</code>. Le middleware la traduit :</p>
<pre class="pseudo">HTTP/1.1 400 Bad Request                              // règle métier violée → faute du client → 4xx
{"title":"Tâche déjà terminée","status":400}         // message métier montré au client

// Pendant ce temps, pour une exception SQL imprévue sur une autre requête :
HTTP/1.1 500 Internal Server Error                    // bug interne → faute du serveur → 5xx
{"title":"Erreur interne","status":500}              // message NEUTRE (aucun détail technique)
// ...et la stack trace complète part dans les logs.  // les détails restent privés, côté serveur</pre>`,
    questions: [
      { type: "qcm", q: "Pourquoi 400 pour la règle métier et 500 pour l'exception SQL ?", opts: ["Au hasard", "400 = la demande du client est en cause ; 500 = le serveur a un problème interne", "400 est plus joli", "SQL vaut toujours 500"], a: 1, exp: "4xx vs 5xx : QUI est responsable. Les clients (et les monitorings) en dépendent." },
      { type: "qcm", q: "Pourquoi le message de la RegleMetierException est-il montré au client, mais pas celui de l'exception SQL ?", opts: ["Oubli", "Le message métier est écrit POUR l'utilisateur ; le message SQL révélerait l'interne du serveur", "SQL n'a pas de message", "Chance"], a: 1, exp: "On distingue exceptions « publiques » (métier) et « privées » (techniques)." },
      { type: "qcm", q: "Où le développeur trouvera-t-il la stack trace de l'erreur SQL ?", opts: ["Dans la réponse HTTP", "Dans les logs du serveur", "Nulle part", "Dans le navigateur du client"], a: 1, exp: "La boîte noire : leçon 19." },
      { type: "qcm", q: "Le contrôleur Terminer contient-il un try/catch pour ce scénario ?", opts: ["Oui, forcément", "Non : l'exception remonte au middleware qui centralise la traduction — le contrôleur reste propre", "Oui, vide", "Un par ligne"], a: 1, exp: "Une seule traduction, au sommet, pour toute l'application." },
      { type: "vf", q: "Si le middleware d'erreurs était enregistré APRÈS MapControllers, il attraperait quand même ces exceptions.", a: false, exp: "Non : il faut être AVANT dans le pipeline pour envelopper. L'ordre est fonctionnel, pas cosmétique." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 13 :
// 1. Le pipeline : app.UseXxx() dans l'ordre — erreurs EN PREMIER.
// 2. Laisser remonter ; attraper si on sait traiter ; traduire au sommet.
// 3. ProblemDetails : le format d'erreur standard des API.
// 4. 4xx = faute du client (métier, validation) ; 5xx = faute du serveur.
// 5. Stack traces : logs oui, réponses publiques JAMAIS.
// 6. catch vide = bug enterré vivant.</pre>
<p>On a mentionné les « environnements » : demain, plongée dans appsettings.json, les secrets et la configuration.</p>`
  }
};

var ECRITURE = {
  placeholder: "Écris ton code C# ici…",
  items: [
  { id: "dotnet-exception-metier", title: "L'exception métier et sa traduction", level: 3,
    statement: "Écris (1) l'exception <code>StockInsuffisantException</code> qui transporte le nombre d'unités manquantes (propriété <code>Manquant</code>) ; (2) l'extrait du service <code>Commander(int produitId, int quantite)</code> qui la lève quand <code>stockDisponible &lt; quantite</code> ; (3) l'extrait du handler centralisé qui traduit cette exception en 409 Conflict avec un JSON {title, manquant, status} — et toute autre exception en 500 neutre.",
    hints: [
      "L'exception : class StockInsuffisantException : Exception avec un constructeur (string message, int manquant).",
      "Le service : if (stockDisponible < quantite) throw new StockInsuffisantException(\"Stock insuffisant\", quantite - stockDisponible);",
      "Le handler : if (ex is StockInsuffisantException s) { StatusCode = 409; ... s.Manquant ... } else { 500, message neutre }."
    ],
    solution: "// 1. L'exception métier : une classe, des données utiles\npublic class StockInsuffisantException : Exception\n{\n    public int Manquant { get; }                       // combien d'unités il manque\n\n    public StockInsuffisantException(string message, int manquant)\n        : base(message)                                // transmet le message à Exception\n    {\n        Manquant = manquant;                           // mémorise la donnée métier\n    }\n}\n\n// 2. Le service la lève — il parle métier, pas HTTP\npublic void Commander(int produitId, int quantite)\n{\n    int stockDisponible = _stock.Disponible(produitId);   // stock actuel\n    if (stockDisponible < quantite)                       // pas assez de stock ?\n        throw new StockInsuffisantException(              // on lève l'exception métier\n            \"Stock insuffisant\", quantite - stockDisponible);\n    // ... suite de la commande ...\n}\n\n// 3. Le handler centralisé traduit — UNE fois pour toute l'app\napp.UseExceptionHandler(a => a.Run(async context =>\n{\n    var ex = context.Features.Get<IExceptionHandlerFeature>()?.Error;   // l'exception levée\n\n    if (ex is StockInsuffisantException stock)         // cas métier connu\n    {\n        context.Response.StatusCode = 409;             // Conflict : cause côté client\n        await context.Response.WriteAsJsonAsync(new {\n            title = stock.Message,                     // message public\n            manquant = stock.Manquant,                 // donnée utile au client\n            status = 409\n        });\n    }\n    else                                               // toute autre exception\n    {\n        context.Response.StatusCode = 500;             // interne : message NEUTRE\n        await context.Response.WriteAsJsonAsync(new {\n            title = \"Erreur interne\", status = 500\n        });\n    }\n}));",
    note: "Observe la répartition : le service LÈVE (métier), le middleware TRADUIT (HTTP), le contrôleur ne fait RIEN de spécial. Chaque couche parle sa langue." }
  ]
};
