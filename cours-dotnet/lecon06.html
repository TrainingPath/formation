var DAY = {
  num: 6,
  title: "POST, JSON et le model binding",
  subtitle: "Recevoir des données : créer, modifier, supprimer des ressources.",
  theory: `
<h3>1. POST : créer une ressource</h3>
<p><strong>POST</strong> est le verbe HTTP qui veut dire « crée une nouvelle ressource ». Le client envoie du JSON dans le <strong>corps</strong> (body) de la requête — la partie « colis » de la requête, séparée de l'URL. L'attribut <code>[FromBody]</code> (implicite avec [ApiController]) <strong>désérialise</strong> ce JSON vers un objet C# (« désérialiser » = l'inverse de sérialiser : transformer du texte JSON en objet) :</p>
<pre class="pseudo">[HttpPost]                                   // POST api/taches : cette méthode CRÉE une tâche
public ActionResult&lt;Tache&gt; Creer(Tache nouvelle)  // "nouvelle" est rempli depuis le JSON du corps
{
    _stockage.Ajouter(nouvelle);             // on range la nouvelle tâche (le stockage lui donne un Id)

    return CreatedAtAction(nameof(ParId),    // réponse 201 : indique la méthode qui saura relire la ressource
                           new { id = nouvelle.Id },  // les valeurs pour construire l'URL (api/taches/{id})
                           nouvelle);         // et le corps renvoyé : la tâche créée en JSON
}</pre>
<p><code>CreatedAtAction</code> renvoie le statut <strong>201 Created</strong>, la ressource créée, ET un <strong>en-tête</strong> (une ligne d'information de la réponse) <code>Location: /api/taches/7</code> qui indique où la retrouver. C'est la réponse REST canonique à une création.</p>
<h3>2. Tester un POST</h3>
<pre class="pseudo">curl -X POST http://localhost:5080/api/taches \\   # -X POST = envoyer une requête POST à cette URL
     -H "Content-Type: application/json" \\        # -H = en-tête ; on annonce que le corps est du JSON
     -d '{"titre":"Arroser les plantes"}'          # -d = data : le corps JSON de la nouvelle tâche</pre>
<p>Le <code>Content-Type: application/json</code> est obligatoire : sans lui, le serveur ne sait pas décoder le corps (415 Unsupported Media Type).</p>
<h3>3. PUT : modifier</h3>
<pre class="pseudo">[HttpPut("{id:int}")]                        // PUT api/taches/{id} : MODIFIER la tâche visée
public IActionResult Modifier(int id, Tache modifiee)  // id vient de la route, modifiee du corps JSON
{
    var existante = _stockage.ParId(id);     // on récupère la tâche actuelle
    if (existante == null) return NotFound(); // absente → 404

    existante.Titre = modifiee.Titre;         // on recopie le nouveau titre
    existante.EstTerminee = modifiee.EstTerminee;  // et le nouvel état
    return NoContent();                       // 204 : fait, rien à renvoyer
}</pre>
<p>Remarque le mélange : <code>id</code> vient de la route, <code>modifiee</code> du corps JSON. Le model binding trie tout seul (types simples → route/query ; objets complexes → corps).</p>
<h3>4. DELETE : supprimer</h3>
<pre class="pseudo">[HttpDelete("{id:int}")]                     // DELETE api/taches/{id} : SUPPRIMER la tâche visée
public IActionResult Supprimer(int id)       // id vient de la route
{
    if (!_stockage.Supprimer(id)) return NotFound();  // Supprimer renvoie false si l'id n'existe pas → 404
    return NoContent();                       // 204 : suppression réussie
}</pre>
<h3>5. La carte REST complète</h3>
<pre class="pseudo">GET    api/taches       → liste           → 200            // lire toutes les tâches
GET    api/taches/3     → une ressource   → 200 / 404      // lire une tâche précise
POST   api/taches       → créer           → 201 + Location // créer une tâche
PUT    api/taches/3     → modifier        → 204 / 404      // remplacer une tâche
DELETE api/taches/3     → supprimer       → 204 / 404      // supprimer une tâche</pre>
<div class="warn">GET ne doit JAMAIS modifier de données : un GET peut être rejoué, mis en cache, préchargé par le navigateur. Toute action passe par POST/PUT/DELETE.</div>
<div class="tip">IActionResult (sans le &lt;T&gt;) suffit quand on ne renvoie jamais de valeur « nue » : NoContent(), NotFound()… ActionResult&lt;T&gt; quand un des chemins renvoie l'objet.</div>`,
  exercises: [
    { type: "qcm", q: "Où le client place-t-il le JSON d'une requête POST ?", opts: ["Dans l'URL", "Dans le corps (body) de la requête", "Dans un cookie", "Dans la query string"], a: 1, exp: "Le corps transporte les données ; l'URL identifie la destination." },
    { type: "qcm", q: "Comment le JSON du corps devient-il un objet Tache en paramètre ?", opts: ["Il faut le parser à la main", "Le model binding le désérialise automatiquement ([FromBody] implicite avec [ApiController])", "Par un fichier temporaire", "Impossible"], a: 1, exp: "JSON → objet : le miroir de la sérialisation d'hier." },
    { type: "qcm", q: "Quel statut et quel en-tête caractérisent la réponse REST à une création ?", opts: ["200 et Server", "201 Created et Location: /api/taches/7", "204 et Date", "301 et Redirect"], a: 1, exp: "CreatedAtAction fabrique exactement cette réponse." },
    { type: "qcm", q: "Que renvoie NoContent() ?", opts: ["200 avec {}", "204 : succès, pas de corps", "404", "Une page blanche HTML"], a: 1, exp: "La réponse type de PUT et DELETE réussis." },
    { type: "qcm", q: "Le POST échoue avec « 415 Unsupported Media Type ». Cause classique ?", opts: ["Le JSON est trop long", "L'en-tête Content-Type: application/json manque", "Le serveur est plein", "L'URL est fausse"], a: 1, exp: "Sans Content-Type, le serveur ne sait pas décoder le corps." },
    { type: "qcm", q: "Dans Modifier(int id, Tache modifiee), d'où viennent les deux paramètres ?", opts: ["Tous deux du corps", "id de la route, modifiee du corps JSON : le binding trie par source", "Tous deux de l'URL", "De la session"], a: 1, exp: "Types simples → route/query ; objets complexes → corps." },
    { type: "qcm", q: "Quel verbe HTTP pour remplacer/modifier une ressource existante ?", opts: ["GET", "PUT (ou PATCH pour une modification partielle)", "POST uniquement", "DELETE"], a: 1, exp: "PUT api/taches/3 : la ressource visée est dans l'URL." },
    { type: "qcm", q: "DELETE api/taches/99 (inexistant) doit renvoyer :", opts: ["204 quand même", "404 Not Found", "500", "200 avec message d'excuse"], a: 1, exp: "On ne peut pas supprimer ce qui n'existe pas — le code le dit." },
    { type: "qcm", q: "Pourquoi GET ne doit-il jamais modifier de données ?", opts: ["C'est plus lent", "Un GET peut être rejoué/mis en cache/préchargé sans danger supposé : le rejouer doit être inoffensif", "GET est chiffré", "Aucune raison"], a: 1, exp: "La règle d'or du web — déjà croisée dans tous les cours." },
    { type: "qcm", q: "Que fait nameof(ParId) dans CreatedAtAction ?", opts: ["Appelle ParId", "Donne le nom de la méthode qui saura relire la ressource, pour construire l'URL Location", "Renomme la méthode", "Rien"], a: 1, exp: "Le client recevra Location: /api/taches/{id} — l'adresse de sa création." },
    { type: "qcm", q: "Quelle est la différence entre IActionResult et ActionResult<T> ?", opts: ["Aucune", "ActionResult<T> permet en plus de retourner directement une valeur T (sérialisée en 200)", "IActionResult est obsolète", "ActionResult<T> est plus lent"], a: 1, exp: "T « nu » possible → ActionResult<T> ; sinon IActionResult suffit." },
    { type: "qcm", q: "POST api/taches avec un corps {\"titre\":\"X\"} : quelle méthode du contrôleur est choisie ?", opts: ["N'importe quelle méthode", "Celle marquée [HttpPost] sur la route api/taches", "La première du fichier", "ParId"], a: 1, exp: "Le routage combine URL + verbe pour choisir la méthode." },
    { type: "input", q: "Quel statut HTTP signale « créé avec succès » ?", a: ["201"], ph: "code à 3 chiffres", exp: "201 Created — avec l'en-tête Location." },
    { type: "vf", q: "Un même contrôleur peut exposer GET, POST, PUT et DELETE sur la même route de base.", a: true, exp: "C'est même le motif REST standard : la ressource « taches » au complet." },
    { type: "vf", q: "PUT api/taches/3 avec un id inexistant doit créer la tâche n°3.", a: false, exp: "Dans notre API (et la plupart) : 404. La création passe par POST." }
  ],
  final: {
    title: "Exercice final — Le CRUD complet en action",
    intro: `<p>Session de test complète (CRUD = Create, Read, Update, Delete) :</p>
<pre class="pseudo">$ curl -i -X POST http://localhost:5080/api/taches \\      # on CRÉE une tâche
       -H "Content-Type: application/json" -d '{"titre":"Sport"}'  # corps JSON envoyé
HTTP/1.1 201 Created                                       # créée : statut 201
Location: http://localhost:5080/api/taches/4              # où la retrouver (en-tête Location)
{"id":4,"titre":"Sport","estTerminee":false}             # la tâche créée, en JSON

$ curl -i -X PUT http://localhost:5080/api/taches/4 \\     # on MODIFIE la tâche 4
       -H "Content-Type: application/json" \\              # corps JSON
       -d '{"titre":"Sport","estTerminee":true}'          # nouvelles valeurs
HTTP/1.1 204 No Content                                    # modifiée : 204 (rien à renvoyer)

$ curl -i -X DELETE http://localhost:5080/api/taches/4    # on SUPPRIME la tâche 4
HTTP/1.1 204 No Content                                    # supprimée : 204

$ curl -i http://localhost:5080/api/taches/4              # on RELIT la tâche 4
HTTP/1.1 404 Not Found                                     # disparue → 404</pre>`,
    questions: [
      { type: "qcm", q: "Que nous apprend l'en-tête Location de la 1re réponse ?", opts: ["L'adresse du serveur", "L'URL de la ressource créée : api/taches/4", "La géolocalisation", "Rien"], a: 1, exp: "Le client sait immédiatement où retrouver sa création." },
      { type: "qcm", q: "Après le PUT, quelle est la valeur d'estTerminee de la tâche 4 ?", opts: ["false", "true : le corps JSON l'a modifiée", "null", "Inconnue"], a: 1, exp: "204 = modification appliquée, silencieusement." },
      { type: "qcm", q: "Pourquoi la dernière requête renvoie-t-elle 404 ?", opts: ["Le serveur a planté", "La tâche 4 a été supprimée par le DELETE précédent", "L'URL est invalide", "Il faut un token"], a: 1, exp: "Le cycle de vie complet : créée, modifiée, supprimée, disparue." },
      { type: "qcm", q: "L'id 4 a été attribué par :", opts: ["Le client dans son JSON", "Le serveur (notre stockage) : le client n'envoie jamais l'id à la création", "curl", "Le hasard"], a: 1, exp: "L'identité est une responsabilité du serveur." },
      { type: "vf", q: "Rejouer le DELETE une seconde fois renverrait aussi 204.", a: false, exp: "404 : la ressource n'existe plus. (Certaines API choisissent l'idempotence à 204 — la nôtre dit 404.)" }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 6 :
// 1. Le JSON du corps → objet C# : model binding automatique.
// 2. POST → 201 CreatedAtAction (+ Location) ; PUT/DELETE → 204 NoContent.
// 3. Content-Type: application/json obligatoire côté client.
// 4. Route + corps peuvent se combiner dans une même méthode.
// 5. GET lit, POST crée, PUT modifie, DELETE supprime : la grammaire REST.</pre>
<p>Notre contrôleur commence à grossir. Demain, on structure : l'architecture en couches.</p>`
  }
};
