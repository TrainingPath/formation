<h3>La carte mentale du cours</h3>
<p>Voici, en une seule image, les 21 leçons. Chaque ligne résume un réflexe déjà appris et défini en détail dans sa leçon (son numéro est rappelé en commentaire à droite, par exemple <code>// L6</code>). Lis-la de haut en bas : si une ligne ne t'évoque plus rien, retourne d'abord à la leçon indiquée avant de passer l'examen.</p>
<pre class="pseudo">SEMAINE 1 — Le socle                                                        // les fondations du framework
  Program.cs : builder.Services (déclarer) → app (pipeline) → Run           // L1 : le point d'entrée
  DI : interfaces + constructeur + conteneur (Singleton/Scoped/Transient)   // L2-3 : l'injection de dépendances

SEMAINE 2 — Les données                                                     // stocker et interroger

  JWT : Bearer, claims signés, bcrypt, 401 ; rôles/propriété, 403           // L16-17 : identité et droits

<h3>Les réflexes professionnels acquis</h3>
<ul>

<li><strong>Architecture</strong> : DI partout, couches, contrôleurs maigres, exceptions traduites au sommet.</li>
<li><strong>Performance</strong> : filtrer/paginer/projeter EN BASE, Include contre le N+1, async/await.</li>
<li><strong>Fiabilité</strong> : validation systématique, tests du nominal ET des refus, logs structurés.</li>
</ul>
<p>L'examen parcourt les 21 leçons. Vise le sans-faute : chaque question est un réflexe d'entreprise.</p>
<div class="tip">Et après ? Approfondis les minimal APIs, SignalR (temps réel), les background services, Blazor, et le déploiement conteneurisé (Docker). La documentation learn.microsoft.com est excellente.</div>`,

  { id: "dotnet-examen-endpoint", title: "Examen d'écriture 1 — L'endpoint parfait", level: 3,
    statement: "De mémoire, sans regarder les leçons : écris l'endpoint <code>POST /api/trajets</code> complet du covoiturage. Exigences : connecté obligatoire ; DTO validé (Depart et Arrivee obligatoires, Places entre 1 et 8) ; ConducteurId depuis les claims ; réponse 201 canonique avec un DTO de sortie. Chaque bloc doit être commenté avec la leçon dont il vient.",
    hints: [
      "Le DTO d'abord : trois propriétés décorées. Puis l'endpoint : [Authorize] + [HttpPost].",
      "int conducteurId = int.Parse(User.FindFirstValue(ClaimTypes.NameIdentifier)!);",
      "Add + SaveChangesAsync + CreatedAtAction(nameof(ParId), ...)."
    ],
    solution: "// Leçon 12 : le DTO liste blanche + validation déclarative\npublic class ProposerTrajetDto                            // objet d'entrée : QUE les champs autorisés\n{\n    [Required] public string Depart { get; set; } = \"\";  // départ obligatoire\n    [Required] public string Arrivee { get; set; } = \"\"; // arrivée obligatoire\n    [Range(1, 8)] public int Places { get; set; } = 3;   // places : entre 1 et 8\n}\n\n[Authorize]                                   // Leçon 16 : identité exigée\n[HttpPost]                                    // Leçon 6 : POST = créer\npublic async Task<ActionResult<object>> Proposer(ProposerTrajetDto dto)  // reçoit le DTO validé\n{\n    // Leçon 17 : l'identité vient des CLAIMS, jamais du corps\n    int conducteurId = int.Parse(                          // lire l'Id de l'appelant\n        User.FindFirstValue(ClaimTypes.NameIdentifier)!);  // depuis le jeton signé\n\n    // Leçon 8 : l'entité, construite par le serveur\n    var trajet = new Trajet {                              // créer l'entité à stocker\n        Depart = dto.Depart, Arrivee = dto.Arrivee,        // recopier les champs validés\n        Places = dto.Places, ConducteurId = conducteurId,  // + le propriétaire (jamais depuis le JSON)\n    };\n\n    // Leçon 9 : Add + SaveChangesAsync (transaction)\n    _context.Trajets.Add(trajet);                          // marque « à insérer »\n    await _context.SaveChangesAsync();                     // INSERT réel en base\n\n    // Leçon 6 : 201 + Location + DTO de sortie (leçon 11 : pas d'entité brute)\n    return CreatedAtAction(nameof(ParId), new { id = trajet.Id },   // 201 + en-tête Location\n                           new { trajet.Id, trajet.Depart, trajet.Arrivee });  // DTO de sortie\n}",
    note: "Si tu as écrit ces ~25 lignes sans hésiter, le cours est acquis. Sinon, les commentaires te disent exactement quelles leçons relire." },
  { id: "dotnet-examen-audit", title: "Examen d'écriture 2 — L'audit de sécurité", level: 3,

      "Pense au trajet d'une donnée : elle entre (JSON), s'identifie (jeton), se stocke (base), s'affiche (Razor).",

    solution: "RISQUE                     | PROTECTION ASP.NET CORE          | LEÇON\n---------------------------+----------------------------------+------\nUsurpation d'identité      | JWT signé : claims infalsifiables | 16-17\n(agir au nom d'un autre)   | + identité lue via User.FindFirst |\n                           | Value, JAMAIS depuis le corps     |\n---------------------------+----------------------------------+------\nMass assignment (champ     | DTO d'entrée = liste blanche +    | 12\npirate ex. Id, Role)       | DataAnnotations → 400 auto        |\n---------------------------+----------------------------------+------\nInjection SQL              | EF Core : requêtes paramétrées    | 9-10\n                           | générées par LINQ                 |\n---------------------------+----------------------------------+------\nXSS (script injecté        | Razor : échappement automatique   | 18\naffiché aux visiteurs)     | de @variable (Html.Raw = danger)  |\n---------------------------+----------------------------------+------\nFuite des mots de passe    | Hash bcrypt lent + salé (Verify), | 16\n(vol de la base)           | jamais de stockage en clair       |",
    note: "Bonus si tu as pensé aussi à : anti-CSRF des formulaires Razor (L18), messages de login vagues contre l'énumération (L16), secrets hors Git (L14), stack traces cachées en prod (L13) et HTTPS forcé (L19)." }
