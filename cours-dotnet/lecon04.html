<script>
var DAY = {
  num: 4,
  title: "Premier contrôleur d'API : [ApiController]",
  subtitle: "Une URL → une méthode C# → du JSON. Ton API répond enfin !",
  theory: `
<h3>1. Le contrôleur : la porte d'entrée</h3>
<p>Un <strong>contrôleur</strong> est une classe qui reçoit les <strong>requêtes HTTP</strong> (les demandes venues du navigateur) et renvoie des <strong>réponses</strong>. Analogie : c'est le standardiste qui prend chaque appel entrant et le dirige vers la bonne action. Une <strong>URL</strong> (Uniform Resource Locator) est l'adresse tapée dans le navigateur, par ex. <code>http://localhost:5080/api/taches</code>. Dans <code>Controllers/TachesController.cs</code> :</p>
<pre class="pseudo">using Microsoft.AspNetCore.Mvc;                  // importe les outils de contrôleur (attributs, ControllerBase…)

[ApiController]                                  // étiquette : "cette classe est un contrôleur d'API"
[Route("api/[controller]")]                      // adresse de base → api/taches ([controller] = nom de la classe sans "Controller")
public class TachesController : ControllerBase   // : ControllerBase = hérite des outils d'API (Ok, NotFound…)
{
    [HttpGet]                                    // cette méthode répond aux requêtes GET (= "donne-moi des données")
    public List&lt;Tache&gt; ToutesLesTaches()         // renvoie une liste de tâches
    {
        return new List&lt;Tache&gt; {                 // on construit et renvoie une liste d'exemple
            new Tache { Id = 1, Titre = "Faire les courses" },  // 1re tâche
            new Tache { Id = 2, Titre = "Réviser ASP.NET" }     // 2e tâche
        };
    }
}</pre>
<p>Décortiquons les <strong>attributs</strong> (les étiquettes entre crochets — le pendant C# des annotations Java, lues par le framework pour déclencher un comportement) :</p>
<ul>
<li><code>[ApiController]</code> : active les comportements d'API (validation automatique, erreurs standardisées…).</li>
<li><code>[Route("api/[controller]")]</code> : l'adresse de base ; <code>[controller]</code> est remplacé par le nom de la classe sans « Controller » → <code>api/taches</code>.</li>
<li><code>[HttpGet]</code> : cette méthode répond aux requêtes GET. Un <strong>verbe HTTP</strong> est l'intention de la requête : GET (lire), POST (créer), PUT (modifier), DELETE (supprimer).</li>
</ul>
<h3>2. Le JSON automatique</h3>
<p>La méthode renvoie une <code>List&lt;Tache&gt;</code>… et le client reçoit du <strong>JSON</strong> (JavaScript Object Notation : un format texte universel pour échanger des données entre programmes) :</p>
<pre class="pseudo">[{"id":1,"titre":"Faire les courses"},{"id":2,"titre":"Réviser ASP.NET"}]   // ← ce que reçoit le client : un tableau JSON de deux objets</pre>
<p>ASP.NET Core <strong>sérialise</strong> automatiquement les objets retournés — « sérialiser » = transformer un objet C# en texte transmissible (avec les noms en camelCase). Aucun code de conversion à écrire.</p>
<h3>3. Le modèle : une classe C# toute simple</h3>
<p>Un <strong>modèle</strong> est une classe qui représente une donnée de ton domaine (ici, une tâche). Ce sont les <strong>propriétés</strong> (leçon 13 de C# : une donnée nommée avec get/set) que le sérialiseur lit :</p>
<pre class="pseudo">public class Tache                               // le modèle : à quoi ressemble une tâche
{
    public int Id { get; set; }                  // identifiant numérique (get = lire, set = écrire)
    public string Titre { get; set; } = "";      // le titre ; = "" évite la valeur null par défaut
    public bool EstTerminee { get; set; }        // vrai/faux : la tâche est-elle terminée ?
}</pre>
<h3>4. Brancher le stockage d'hier : la DI dans le contrôleur</h3>
<pre class="pseudo">public class TachesController : ControllerBase
{
    private readonly IStockageTaches _stockage;  // le contrat de stockage (leçon 3), jamais new

    public TachesController(IStockageTaches stockage)   // le framework INJECTE le stockage enregistré
    {
        _stockage = stockage;                    // on mémorise la dépendance reçue
    }

    [HttpGet]                                    // GET api/taches
    public List&lt;Tache&gt; ToutesLesTaches() =&gt; _stockage.Toutes();  // délègue au service (=> = méthode d'une ligne)
}</pre>
<p>Le framework crée le contrôleur <strong>à chaque requête</strong> et lui injecte ses dépendances. Tu n'écris jamais <code>new TachesController(...)</code>.</p>
<h3>5. Tester</h3>
<pre class="pseudo">curl http://localhost:5080/api/taches            # curl = outil qui envoie une requête HTTP depuis le terminal (ici un GET)
# ou simplement l'adresse dans le navigateur (GET)  # taper l'URL dans Chrome fait aussi un GET</pre>
<div class="warn">N'oublie pas <code>app.MapControllers();</code> dans Program.cs : sans lui, tes contrôleurs existent mais aucune route ne mène à eux → 404 partout.</div>
<div class="tip">Convention : le contrôleur hérite de ControllerBase pour une API (pas de vues) ; Controller (avec vues) sera pour la leçon 18.</div>`,
  exercises: [
    { type: "qcm", q: "Qu'est-ce qu'un attribut C# comme [ApiController] ?", opts: ["Un commentaire", "Une étiquette lue par le framework pour déclencher un comportement", "Une variable", "Une méthode"], a: 1, exp: "Le pendant C# des annotations : le framework les lit et agit." },
    { type: "qcm", q: "Avec [Route(\"api/[controller]\")], quelle est l'adresse de TachesController ?", opts: ["api/[controller]", "api/taches : [controller] = nom de la classe sans « Controller »", "api/TachesController", "taches/api"], a: 1, exp: "La convention évite de répéter le nom partout." },
    { type: "qcm", q: "Que fait l'attribut [HttpGet] sur une méthode ?", opts: ["Il la rend privée", "Elle répondra aux requêtes GET", "Il télécharge un fichier", "Il la met en cache"], a: 1, exp: "Chaque verbe HTTP a son attribut : [HttpGet], [HttpPost], [HttpPut], [HttpDelete]." },
    { type: "qcm", q: "Une méthode d'API renvoie List<Tache>. Que reçoit le client ?", opts: ["Du HTML", "Un tableau JSON : la sérialisation est automatique", "Une chaîne de caractères brute", "Du XML par défaut"], a: 1, exp: "Objet C# → JSON sans une ligne de code." },
    { type: "qcm", q: "En JSON, la propriété C# EstTerminee devient :", opts: ["EstTerminee", "estTerminee (camelCase par défaut)", "est_terminee", "ESTTERMINEE"], a: 1, exp: "La convention JSON par défaut d'ASP.NET Core est le camelCase." },
    { type: "qcm", q: "De quelle classe hérite un contrôleur d'API pur (sans vues HTML) ?", opts: ["Controller", "ControllerBase", "ApiBase", "ObjectController"], a: 1, exp: "ControllerBase : tout pour l'API, rien pour les vues." },
    { type: "qcm", q: "Qui crée l'instance du contrôleur quand une requête arrive ?", opts: ["Toi, avec new", "Le framework, à chaque requête, en injectant les dépendances du constructeur", "Kestrel une fois pour toutes", "Le navigateur"], a: 1, exp: "Encore l'inversion de contrôle — et la DI d'hier fonctionne dans les contrôleurs." },
    { type: "qcm", q: "Que se passe-t-il si app.MapControllers() manque dans Program.cs ?", opts: ["Erreur de compilation", "Les contrôleurs existent mais aucune route n'y mène : 404 partout", "Les routes fonctionnent quand même", "Kestrel refuse de démarrer"], a: 1, exp: "Déclarer (AddControllers) ET activer (MapControllers)." },
    { type: "qcm", q: "Quelles briques de la leçon 13 de C# le sérialiseur JSON lit-il ?", opts: ["Les champs privés", "Les propriétés publiques (get)", "Les constantes", "Les méthodes"], a: 1, exp: "public int Id { get; set; } → \"id\": 1." },
    { type: "qcm", q: "Comment tester GET /api/taches sans écrire de code ?", opts: ["Uniquement via un client HTTP payant", "Avec le navigateur ou curl http://localhost:5080/api/taches", "En consultant le fichier appsettings.json", "En lisant la console du serveur"], a: 1, exp: "GET est le seul verbe testable directement dans la barre d'adresse." },
    { type: "qcm", q: "Le contrôleur doit-il contenir la logique de stockage des tâches ?", opts: ["Oui, c'est son rôle", "Non : il délègue au service injecté — le contrôleur orchestre, les services travaillent", "Oui, en région #region", "Oui, pour éviter de multiplier les classes"], a: 1, exp: "Contrôleur maigre : on approfondit ça leçon 7." },
    { type: "qcm", q: "Deux requêtes GET /api/taches arrivent en même temps. Combien d'instances de TachesController ?", opts: ["Une seule", "Deux : une par requête", "Zéro", "Quatre"], a: 1, exp: "Les contrôleurs sont créés par requête (comme un service Scoped)." },
    { type: "input", q: "Quel attribut marque une méthode répondant aux requêtes POST ?", a: ["[HttpPost]", "HttpPost"], ph: "attribut", exp: "[HttpPost] — au programme de la leçon 6." },
    { type: "vf", q: "La méthode d'un contrôleur d'API doit convertir elle-même ses objets en JSON avec un sérialiseur.", a: false, exp: "Retourne tes objets : le framework sérialise." },
    { type: "vf", q: "Une classe TachesController sans les attributs [ApiController]/[Route] répond quand même aux requêtes.", a: false, exp: "Sans route déclarée, personne ne sait comment l'atteindre." }
  ],
  final: {
    title: "Exercice final — Lire un contrôleur complet",
    intro: `<p>Le gestionnaire de tâches expose sa première API :</p>
<pre class="pseudo">[ApiController]                                  // c'est un contrôleur d'API
[Route("api/[controller]")]                      // adresse de base → api/taches
public class TachesController : ControllerBase   // hérite des outils d'API
{
    private readonly IStockageTaches _stockage;  // le stockage injecté (leçon 3)

    public TachesController(IStockageTaches stockage)  // DI par constructeur
    {
        _stockage = stockage;                    // on mémorise la dépendance
    }

    [HttpGet]                                    // GET api/taches
    public List&lt;Tache&gt; Toutes() =&gt; _stockage.Toutes();  // renvoie toutes les tâches

    [HttpGet("terminees")]                       // GET api/taches/terminees (route ajoutée à celle du contrôleur)
    public List&lt;Tache&gt; Terminees()
        =&gt; _stockage.Toutes().Where(t =&gt; t.EstTerminee).ToList();  // LINQ : ne garde que les tâches terminées
}</pre>`,
    questions: [
      { type: "qcm", q: "Quelle URL appelle la méthode Terminees() ?", opts: ["api/taches", "api/taches/terminees : la route de méthode s'ajoute à celle du contrôleur", "api/terminees", "terminees"], a: 1, exp: "[HttpGet(\"terminees\")] complète [Route(\"api/[controller]\")]." },
      { type: "qcm", q: "Quelle méthode LINQ du cours C# (leçon 18) filtre les tâches terminées ?", opts: ["ForEach", "Where", "Sort", "Add"], a: 1, exp: "Where(t => t.EstTerminee) : ton LINQ sert immédiatement." },
      { type: "qcm", q: "D'où vient l'objet _stockage à l'exécution ?", opts: ["D'un new dans le contrôleur", "Du conteneur : l'implémentation enregistrée (StockageMemoire, Singleton) est injectée", "D'appsettings.json", "Du navigateur"], a: 1, exp: "Les leçons 2 et 3 en action dans un vrai contrôleur." },
      { type: "qcm", q: "GET /api/taches/terminees ne renvoie que [] alors que des tâches terminées existent… après un redémarrage de l'application. Explication ?", opts: ["Bug LINQ", "Le stockage est EN MÉMOIRE : un redémarrage efface tout — la base de données (semaine 2) réglera ça", "Kestrel a planté", "Le JSON est cassé"], a: 1, exp: "La RAM ne survit pas au redémarrage : limite assumée jusqu'à EF Core." },
      { type: "vf", q: "Les deux méthodes peuvent avoir le même attribut [HttpGet] sans conflit car leurs routes diffèrent.", a: true, exp: "GET api/taches et GET api/taches/terminees : deux routes distinctes." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 4 :
// 1. [ApiController] + [Route("api/[controller]")] + ControllerBase :
//    le squelette de tout contrôleur d'API.
// 2. [HttpGet] (+ route optionnelle) relie une URL à une méthode C#.
// 3. Retourner un objet/liste = JSON automatique (camelCase).
// 4. La DI fonctionne dans les contrôleurs : constructeur + readonly.
// 5. AddControllers() déclare, MapControllers() active.</pre>
<p>Notre API ne sait répondre qu'en bloc. Demain : viser UNE tâche précise avec les paramètres de route.</p>`
  }
};

var ECRITURE = {

  { id: "dotnet-premier-controleur", title: "Le contrôleur des membres", level: 1,
    statement: "Écris un contrôleur d'API <code>MembresController</code> (route <code>api/membres</code> par convention) qui reçoit <code>IStockageMembres</code> par injection et expose : <code>[HttpGet]</code> <code>Tous()</code> qui renvoie tous les membres, et <code>[HttpGet(\"actifs\")]</code> <code>Actifs()</code> qui renvoie les membres dont la propriété <code>EstActif</code> est vraie (avec LINQ).",
    hints: [
      "Le squelette : [ApiController] + [Route(\"api/[controller]\")] + : ControllerBase.",
      "Constructeur : private readonly IStockageMembres _stockage; affecté au constructeur.",
      "Actifs : _stockage.Tous().Where(m => m.EstActif).ToList();"
    ],
    solution: "using Microsoft.AspNetCore.Mvc;             // outils de contrôleur\n\n[ApiController]                            // contrôleur d'API\n[Route(\"api/[controller]\")]          // → api/membres\npublic class MembresController : ControllerBase\n{\n    private readonly IStockageMembres _stockage;   // le stockage injecté\n\n    public MembresController(IStockageMembres stockage)  // DI\n    {\n        _stockage = stockage;                      // on mémorise la dépendance\n    }\n\n    [HttpGet]                          // GET api/membres\n    public List<Membre> Tous() => _stockage.Tous();   // renvoie tous les membres\n\n    [HttpGet(\"actifs\")]               // GET api/membres/actifs\n    public List<Membre> Actifs()\n        => _stockage.Tous()                    // on part de tous les membres\n                    .Where(m => m.EstActif)   // LINQ, leçon 18 de C#\n                    .ToList();                 // et on matérialise le résultat en liste\n}",
    note: "Remarque la brièveté : le contrôleur traduit HTTP ↔ C#, le service fait le travail. Si une méthode de contrôleur dépasse 10 lignes, questionne-toi.",

  ]
