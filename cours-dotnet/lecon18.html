<script>
var DAY = {
  num: 18,
  title: "Razor Pages : générer des pages HTML",
  subtitle: "Quand l'humain remplace la machine : du JSON aux vraies pages web.",
  theory: `
<h3>1. API ou pages HTML ?</h3>
<p>Jusqu'ici, notre API sert du JSON à des programmes. Pour servir directement des <strong>pages HTML</strong> (le langage des pages web) à des humains, ASP.NET Core propose <strong>Razor Pages</strong> : une page = un fichier <code>.cshtml</code> (le HTML + du C#) et son <strong>PageModel</strong> (le « code-behind » : le fichier C# qui prépare les données de la page).</p>
<pre class="pseudo">// Program.cs
builder.Services.AddRazorPages();      // enregistre les services des Razor Pages
app.MapRazorPages();                    // relie les fichiers .cshtml aux URL
// Pages/Taches/Index.cshtml  →  répond à l'URL /Taches   (le routage suit l'arborescence des dossiers)</pre>
<h3>2. La page et son modèle</h3>
<pre class="pseudo">@page                     &lt;!-- @page : cette directive rend le fichier accessible comme une page web --&gt;
@model IndexModel         &lt;!-- @model : indique le PageModel (le code C#) associé à cette page --&gt;
&lt;h1&gt;@Model.Taches.Count tâche(s)&lt;/h1&gt;   &lt;!-- @Model.X : insère une valeur C# dans le HTML --&gt;
&lt;ul&gt;                      &lt;!-- début d'une liste à puces --&gt;
@foreach (var t in Model.Taches)        &lt;!-- @foreach : boucle C# sur chaque tâche --&gt;
{
    &lt;li&gt;@t.Titre @(t.EstTerminee ? "✔" : "")&lt;/li&gt;   &lt;!-- une puce par tâche ; ✔ si elle est terminée --&gt;
}
&lt;/ul&gt;                     &lt;!-- fin de la liste --&gt;</pre>
<pre class="pseudo">// Pages/Taches/Index.cshtml.cs
public class IndexModel : PageModel                              // le "code-behind" : hérite de PageModel
{
    private readonly AppDbContext _context;                     // le DbContext, injecté
    public IndexModel(AppDbContext context) { _context = context; }  // DI !

    public List&lt;Tache&gt; Taches { get; set; } = new();            // les données que la page affichera

    public async Task OnGetAsync()          // appelé automatiquement pour une requête GET
    {
        Taches = await _context.Taches.OrderBy(t =&gt; t.Titre).ToListAsync();  // charge et trie les tâches
    }
}</pre>
<p><code>OnGetAsync</code> prépare les données, la page les affiche avec <code>@</code>. Le C# dans le HTML : <code>@variable</code>, <code>@if</code>, <code>@foreach</code> — ta syntaxe C# habituelle. Le <code>@</code> est le signal « ici commence du C# ».</p>
<h3>3. L'échappement automatique : anti-XSS</h3>
<p>Le <strong>XSS</strong> (Cross-Site Scripting) est une attaque où un contenu saisi par l'utilisateur contient du code qui s'exécuterait dans le navigateur des autres. <code>@t.Titre</code> <strong>échappe</strong> le HTML (« neutralise les balises en les affichant comme du texte ») : un titre <code>&lt;script&gt;hack()&lt;/script&gt;</code> s'affiche comme texte inoffensif. La protection XSS est le comportement PAR DÉFAUT — comme la sérialisation JSON protégeait l'API.</p>
<h3>4. Les formulaires : OnPost et le binding</h3>
<pre class="pseudo">&lt;form method="post"&gt;                              &lt;!-- un formulaire envoyé en POST --&gt;
    &lt;input asp-for="NouveauTitre" /&gt;              &lt;!-- champ lié à la propriété NouveauTitre du PageModel --&gt;
    &lt;span asp-validation-for="NouveauTitre"&gt;&lt;/span&gt;   &lt;!-- emplacement du message d'erreur de ce champ --&gt;
    &lt;button&gt;Ajouter&lt;/button&gt;                       &lt;!-- bouton d'envoi --&gt;
&lt;/form&gt;</pre>
<pre class="pseudo">[BindProperty]                                    // lie cette propriété aux données du formulaire POST
[Required, StringLength(100, MinimumLength = 3)]  // validation (leçon 12) réutilisée telle quelle
public string NouveauTitre { get; set; } = "";    // rempli automatiquement avant OnPostAsync

public async Task&lt;IActionResult&gt; OnPostAsync()     // appelé pour une requête POST
{
    if (!ModelState.IsValid) return Page();       // si invalide : réafficher la page AVEC les erreurs

    _context.Taches.Add(new Tache { Titre = NouveauTitre });  // sinon : créer la tâche
    await _context.SaveChangesAsync();            // enregistrer en base
    return RedirectToPage();                       // Post/Redirect/Get ! (voir §5)
}</pre>
<p>Bonus sécurité : les formulaires Razor incluent automatiquement un <strong>jeton anti-falsification</strong> (anti-CSRF), vérifié au POST. Et les DataAnnotations de la leçon 12 resservent telles quelles.</p>
<h3>5. Le motif Post/Redirect/Get</h3>
<p>Après un POST réussi, on <strong>redirige</strong> (<code>RedirectToPage()</code>) au lieu d'afficher directement : si l'utilisateur rafraîchit (F5), le navigateur rejoue un GET inoffensif au lieu de re-soumettre le formulaire (doublon !).</p>
<div class="warn">N'utilise <code>Html.Raw()</code> (affichage NON échappé) que pour du HTML de confiance que TU as généré. Jamais pour une saisie utilisateur : c'est la porte ouverte au XSS.</div>
<div class="tip">API (JSON) et Razor Pages (HTML) cohabitent dans le même projet et se partagent DbContext, services et validation : deux façades, un seul cœur.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle différence entre l'API et Razor Pages ?", opts: ["Aucune", "L'API sert du JSON aux programmes ; Razor Pages sert du HTML aux humains", "Razor est plus rapide", "L'API est obsolète"], a: 1, exp: "Deux façades pour le même cœur applicatif." },
    { type: "qcm", q: "De quoi se compose une Razor Page ?", opts: ["D'un contrôleur", "D'un fichier .cshtml (HTML+C#) et de son PageModel (.cshtml.cs)", "D'un fichier XML", "D'un script JS"], a: 1, exp: "La page affiche, le modèle prépare." },
    { type: "qcm", q: "À quelle URL répond Pages/Taches/Index.cshtml ?", opts: ["/Pages/Taches/Index", "/Taches (Index est la page par défaut du dossier)", "/index.cshtml", "/api/taches"], a: 1, exp: "Le routage suit l'arborescence des dossiers." },
    { type: "qcm", q: "Quelle méthode du PageModel s'exécute pour une requête GET ?", opts: ["Main()", "OnGetAsync() (ou OnGet)", "Load()", "Index()"], a: 1, exp: "Et OnPostAsync pour les POST : la convention OnVerbe." },
    { type: "qcm", q: "Comment afficher la variable C# titre dans le HTML ?", opts: ["{{ titre }}", "@titre", "<%= titre %>", "${titre}"], a: 1, exp: "Le @ de Razor bascule du HTML au C#." },
    { type: "qcm", q: "Un utilisateur nomme sa tâche &lt;script&gt;alert('pirate')&lt;/script&gt;. Que fait @t.Titre ?", opts: ["Exécute le script", "L'affiche comme texte inoffensif : l'échappement HTML est automatique", "Plante", "Supprime la tâche"], a: 1, exp: "L'anti-XSS par défaut — le même esprit que la validation par défaut." },
    { type: "qcm", q: "Quel attribut lie un champ de formulaire à une propriété du PageModel ?", opts: ["[FromBody]", "[BindProperty]", "[Required]", "[Bind]"], a: 1, exp: "Le POST remplit la propriété avant OnPostAsync." },
    { type: "qcm", q: "Que faire quand ModelState.IsValid est false dans OnPostAsync ?", opts: ["Continuer", "return Page(); — réafficher le formulaire avec les messages d'erreur", "Lancer une exception", "Rediriger vers l'accueil"], a: 1, exp: "Les DataAnnotations de la leçon 12 alimentent asp-validation-for." },
    { type: "qcm", q: "Pourquoi RedirectToPage() après un POST réussi ?", opts: ["C'est plus joli", "Post/Redirect/Get : un rafraîchissement rejouerait le POST → doublon ; après redirection, F5 = simple GET", "Pour vider le cache", "Obligatoire en Razor"], a: 1, exp: "Le motif anti-double-soumission universel du web." },
    { type: "qcm", q: "Qu'est-ce que le CSRF, dont les formulaires Razor protègent automatiquement ?", opts: ["Un virus", "La soumission d'un formulaire forgée depuis un site tiers, au nom de l'utilisateur connecté", "Une faille SQL", "Un bug CSS"], a: 1, exp: "Le jeton anti-falsification embarqué prouve que le formulaire vient de TON site." },
    { type: "qcm", q: "Le PageModel peut-il recevoir AppDbContext par injection ?", opts: ["Non", "Oui : constructeur + readonly, comme partout (DI, leçon 2)", "Seulement en Singleton", "Uniquement les contrôleurs"], a: 1, exp: "Toute l'infrastructure du cours resservie telle quelle." },
    { type: "qcm", q: "Quand utiliser Html.Raw() ?", opts: ["Partout, c'est plus rapide", "Uniquement pour du HTML de confiance généré par toi — JAMAIS pour une saisie utilisateur", "Pour les formulaires", "Jamais autorisé"], a: 1, exp: "Désactiver l'échappement = assumer le risque XSS." },
    { type: "qcm", q: "Les DataAnnotations ([Required], [StringLength]…) de la leçon 12 servent-elles ici ?", opts: ["Non, c'est propre aux API", "Oui : la même validation alimente ModelState et les messages du formulaire", "Seulement [Required]", "Il faut tout réécrire"], a: 1, exp: "Déclare une fois, valide partout : la promesse est tenue." },
    { type: "vf", q: "API JSON et Razor Pages peuvent cohabiter dans le même projet.", a: true, exp: "MapControllers() + MapRazorPages() : deux façades, un cœur." },
    { type: "vf", q: "Razor échappe le HTML par défaut, comme le {{ }} de Laravel/Blade ou le th:text de Thymeleaf.", a: true, exp: "Tous les moteurs modernes ont fait le même choix : sûr par défaut." }
  ],
  final: {
    title: "Exercice final — La page des tâches, de bout en bout",
    intro: `<p>La page complète :</p>
<pre class="pseudo">@page                                             &lt;!-- rend le fichier accessible comme page --&gt;
@model IndexModel                                 &lt;!-- son PageModel associé --&gt;
&lt;h1&gt;Mes tâches&lt;/h1&gt;                                &lt;!-- titre de la page --&gt;
&lt;form method="post"&gt;                              &lt;!-- formulaire d'ajout (POST) --&gt;
    &lt;input asp-for="NouveauTitre" /&gt;              &lt;!-- champ lié à NouveauTitre --&gt;
    &lt;span asp-validation-for="NouveauTitre"&gt;&lt;/span&gt;   &lt;!-- message d'erreur du champ --&gt;
    &lt;button&gt;Ajouter&lt;/button&gt;                       &lt;!-- bouton d'envoi --&gt;
&lt;/form&gt;
&lt;ul&gt;                                              &lt;!-- liste des tâches --&gt;
@foreach (var t in Model.Taches) { &lt;li&gt;@t.Titre&lt;/li&gt; }   &lt;!-- une puce par tâche (@t.Titre échappé) --&gt;
&lt;/ul&gt;

// PageModel : [BindProperty, Required, StringLength(100, MinimumLength = 3)]   // le champ validé
// OnPostAsync : if (!ModelState.IsValid) return Page();                        // invalide → réafficher
//               ...Add + SaveChangesAsync...; return RedirectToPage();         // valide → créer + rediriger (PRG)</pre>`,
    questions: [
      { type: "qcm", q: "L'utilisateur soumet « ab » (2 caractères). Que voit-il ?", opts: ["La tâche est créée", "Le formulaire réaffiché avec le message d'erreur sous le champ, saisie conservée", "Une page 500", "Une page blanche"], a: 1, exp: "MinimumLength=3 échoue → ModelState invalide → return Page()." },
      { type: "qcm", q: "Il soumet « Faire les courses » puis appuie sur F5. Doublon ?", opts: ["Oui", "Non : RedirectToPage a transformé la suite en GET — le motif Post/Redirect/Get", "Oui, deux fois sur trois", "La page plante"], a: 1, exp: "C'est exactement le scénario que le motif élimine." },
      { type: "qcm", q: "Un site pirate tente de POSTer ce formulaire à distance avec la session d'un utilisateur. Résultat ?", opts: ["La tâche est créée", "Rejet : le jeton anti-CSRF du formulaire manque ou ne correspond pas", "Redirection", "200"], a: 1, exp: "La protection anti-falsification automatique des formulaires Razor." },
      { type: "qcm", q: "Où la liste Model.Taches a-t-elle été remplie ?", opts: ["Dans le .cshtml", "Dans OnGetAsync du PageModel, via le DbContext injecté", "En JavaScript", "Dans Program.cs"], a: 1, exp: "Le modèle prépare (données), la page affiche (HTML) : la séparation habituelle." },
      { type: "vf", q: "Si une tâche s'appelle <b>URGENT</b>, le mot s'affichera en gras dans la liste.", a: false, exp: "@t.Titre échappe : les balises s'affichent comme du texte. Pour du gras, il faudrait Html.Raw — et une bonne raison." }
    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 18 :
// 1. Razor Page = .cshtml (affichage) + PageModel (OnGet/OnPost).
// 2. @ bascule en C# ; l'échappement anti-XSS est AUTOMATIQUE.
// 3. [BindProperty] + DataAnnotations + ModelState : formulaires validés.

// 5. Anti-CSRF automatique dans les formulaires.

<p>Il reste à soigner l'exploitation : documentation Swagger, logs et checklist de mise en production. Demain !</p>`
  }
};

      "Le formulaire : <input asp-for=\"Pseudo\" /> + <span asp-validation-for=\"Pseudo\"></span>, idem pour Age."

    solution: "// Pages/Inscription.cshtml.cs\npublic class InscriptionModel : PageModel\n{\n    private readonly AppDbContext _context;               // DbContext injecté\n    public InscriptionModel(AppDbContext context) { _context = context; }  // DI\n\n    [BindProperty]                                        // lié au formulaire POST\n    [Required, StringLength(50, MinimumLength = 3)]        // pseudo : 3 à 50 caractères\n    public string Pseudo { get; set; } = \"\";\n\n    [BindProperty]                                        // lié au formulaire POST\n    [Range(7, 120)]                                       // âge : entre 7 et 120\n    public int Age { get; set; }\n\n    public async Task<IActionResult> OnPostAsync()\n    {\n        if (!ModelState.IsValid)\n            return Page();                        // réaffiche avec les erreurs\n\n        _context.Membres.Add(new Membre { Pseudo = Pseudo, Age = Age });  // crée le membre\n        await _context.SaveChangesAsync();        // enregistre en base\n\n        return RedirectToPage(\"Merci\");          // Post/Redirect/Get\n    }\n}\n\n@* Pages/Inscription.cshtml — le formulaire *@\n<form method=\"post\">\n    <label>Pseudo <input asp-for=\"Pseudo\" /></label>     @* champ lié à Pseudo *@\n    <span asp-validation-for=\"Pseudo\"></span>            @* message d'erreur du pseudo *@\n\n    <label>Âge <input asp-for=\"Age\" /></label>           @* champ lié à Age *@\n    <span asp-validation-for=\"Age\"></span>              @* message d'erreur de l'âge *@\n\n    <button>S'inscrire</button>                          @* bouton d'envoi *@\n</form>",
