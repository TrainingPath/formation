  title: "Migrations et CRUD avec EF Core",
  subtitle: "Créer les tables en code, puis lire et écrire pour de vrai.",
  theory: `
<h3>1. Les migrations : la base versionnée</h3>
<p>Comment créer la table Taches ? Pas à la main ! Une <strong>migration</strong> est un fichier C# généré qui décrit un changement de <strong>schéma</strong> (la structure des tables et colonnes) — versionné avec le projet, rejouable par toute l'équipe. Analogie : le carnet de chantier qui note chaque modification de la maison, dans l'ordre :</p>
<pre class="pseudo">dotnet ef migrations add CreationTaches   # génère un fichier de migration nommé "CreationTaches"
dotnet ef database update                 # applique les migrations en attente à la base (crée réellement la table)</pre>
<p>La migration contient <code>Up()</code> (créer la table) et <code>Down()</code> (l'inverse, pour annuler). EF Core note dans une table technique <code>__EFMigrationsHistory</code> ce qui a déjà été appliqué : jamais deux fois la même.</p>
<h3>2. Modifier le schéma ensuite</h3>
<pre class="pseudo"># On ajoute une propriété Priorite à l'entité, puis :   # d'abord on modifie la classe C# (ajout d'une propriété)
dotnet ef migrations add AjoutPriorite                  # génère la migration qui décrit ce changement
dotnet ef database update                               # applique le changement à la base existante</pre>
<p>Règle d'or : on ne modifie <strong>jamais</strong> une migration déjà appliquée et partagée — on en AJOUTE une nouvelle.</p>
<h3>3. Le CRUD complet avec le DbContext</h3>
<pre class="pseudo">// CREATE                                                       // créer
_context.Taches.Add(nouvelle);                                  // marque l'objet « à insérer » (rien en base encore)
await _context.SaveChangesAsync();                              // ENVOIE l'INSERT en base (rien ne part avant !)

// READ                                                         // lire
var toutes = await _context.Taches.ToListAsync();               // SELECT * : toutes les tâches → List<Tache>
var une    = await _context.Taches.FindAsync(3);               // SELECT par clé primaire (null si absente)

// UPDATE : charger, modifier, sauvegarder                     // modifier
var tache = await _context.Taches.FindAsync(3);                // 1) charger l'entité
tache.EstTerminee = true;                                       // 2) modifier une propriété
await _context.SaveChangesAsync();                              // 3) EF détecte le changement et génère l'UPDATE

// DELETE                                                       // supprimer
_context.Taches.Remove(tache);                                  // marque l'objet « à supprimer »
await _context.SaveChangesAsync();                              // envoie le DELETE en base</pre>
<h3>4. SaveChanges : le moment de vérité</h3>
<p>Le DbContext <strong>traque</strong> (« change tracking ») les objets chargés/ajoutés/supprimés. Add, Remove et les modifications ne touchent PAS la base : tout part d'un coup au <code>SaveChangesAsync()</code>, dans une <strong>transaction</strong> (un lot « tout ou rien » : soit toutes les écritures réussissent, soit aucune). Un seul Save pour plusieurs opérations = tout ou rien.</p>
<h3>5. async/await : le réflexe web</h3>
<p><strong>Asynchrone</strong> veut dire « sans attendre bloqué ». Les méthodes se terminant par Async (<code>ToListAsync</code>, <code>SaveChangesAsync</code>…) libèrent le serveur pendant l'attente de la base : il traite d'autres requêtes au lieu de rester figé (analogie : le serveur de restaurant qui va prendre d'autres commandes pendant que la cuisine prépare). La signature devient :</p>
<pre class="pseudo">[HttpGet]
public async Task&lt;List&lt;Tache&gt;&gt; Toutes()          // async + Task<...> : méthode asynchrone renvoyant une liste
    =&gt; await _context.Taches.ToListAsync();         // await = « attends le résultat sans bloquer le serveur »</pre>
<p>Retiens le trio : <code>async</code> dans la signature, <code>Task&lt;T&gt;</code> en retour, <code>await</code> devant l'appel. (<code>Task&lt;T&gt;</code> = « une promesse de T qui arrivera plus tard ».)</p>
<div class="warn">Oublier SaveChangesAsync() est LE bug classique : « j'ajoute mais rien ne s'enregistre ». Add ne fait que marquer l'objet ; Save écrit.</div>
<div class="tip">FindAsync(id) est optimisé pour la clé primaire (et regarde d'abord en mémoire). Pour toute autre condition : FirstOrDefaultAsync(t => ...) — demain.</div>`,

    { type: "qcm", q: "Trois Add + un Remove puis UN SaveChangesAsync. Que se passe-t-il en cas d'erreur au milieu de l'écriture ?", opts: ["La moitié des opérations est écrite", "Rien n'est écrit : Save travaille dans une transaction — tout ou rien", "Seuls les Add passent, pas le Remove", "La base est laissée dans un état corrompu"], a: 1, exp: "L'unité de travail atomique, gratuite." },

    { type: "qcm", q: "« J'ajoute des tâches via POST mais GET renvoie toujours [] après redémarrage » — avec EF Core cette fois. Diagnostic ?", opts: ["Normal, la mémoire s'efface au redémarrage", "SaveChangesAsync manque probablement dans le POST : Add sans Save n'écrit rien", "SQLite ne conserve pas les données sur le disque", "La désérialisation JSON échoue au démarrage"], a: 1, exp: "Avec une vraie base, les données doivent survivre : cherche le Save manquant." },
    { type: "qcm", q: "Peut-on annuler la dernière migration non partagée ?", opts: ["Non, jamais", "Oui : dotnet ef migrations remove (si pas encore appliquée/partagée), ou database update vers une migration antérieure", "En supprimant la base uniquement", "Avec git revert seulement"], a: 1, exp: "Tant qu'elle n'est pas dans la nature, on peut la retirer proprement." },
    { type: "vf", q: "SaveChangesAsync() peut enregistrer plusieurs ajouts, modifications et suppressions en un seul appel.", a: true, exp: "C'est même recommandé : une unité de travail, une transaction." },
    { type: "vf", q: "Les migrations doivent être écrites à la main en SQL.", a: false, exp: "dotnet ef migrations add les GÉNÈRE à partir du diff entre entités et schéma." }
  ],

    title: "Exercice final — Le contrôleur passe au réel",
    intro: `<p>TachesController utilise désormais EF Core :</p>
<pre class="pseudo">[HttpGet]
public async Task&lt;List&lt;Tache&gt;&gt; Toutes()               // GET api/taches (asynchrone)
    =&gt; await _context.Taches.ToListAsync();             // SELECT * → liste des tâches

[HttpGet("{id:int}")]
public async Task&lt;ActionResult&lt;Tache&gt;&gt; ParId(int id)  // GET api/taches/{id}
{
    var tache = await _context.Taches.FindAsync(id);    // SELECT par clé primaire
    return tache == null ? NotFound() : tache;          // null → 404, sinon → 200 + JSON
}

[HttpPost]
public async Task&lt;ActionResult&lt;Tache&gt;&gt; Creer(Tache t)  // POST api/taches
{
    _context.Taches.Add(t);                             // marque « à insérer »
    await _context.SaveChangesAsync();                  // INSERT réel ; t.Id est rempli par la base
    return CreatedAtAction(nameof(ParId), new { id = t.Id }, t);  // 201 + Location
}</pre>`,
    questions: [
      { type: "qcm", q: "Après le POST, d'où vient la valeur de t.Id renvoyée au client ?", opts: ["De l'id envoyé par le client dans le JSON", "La base l'a générée à l'INSERT ; EF Core l'a relue et remplie dans l'objet", "Elle reste toujours à 0", "Le contrôleur l'attribue avant l'INSERT"], a: 1, exp: "Après SaveChanges, l'objet est complété avec l'id auto-incrémenté." },

      { type: "qcm", q: "Le développeur retire await _context.SaveChangesAsync() du POST. Symptôme exact ?", opts: ["Une erreur de compilation", "201 renvoyé avec Id = 0, et la tâche absente de la base : Add sans Save", "Une réponse 404 Not Found", "Aucun changement de comportement"], a: 1, exp: "La réponse ment au client — le bug le plus trompeur d'EF Core." },

    ],
    solution: `<pre class="pseudo">// Ce qu'il faut retenir de la leçon 9 :

<p>Le CRUD fonctionne. Demain : les vraies requêtes — LINQ traduit en SQL.</p>`
