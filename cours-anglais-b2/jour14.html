  title: "Rédiger une lettre de motivation",
  subtitle: "Structurer une cover letter professionnelle et convaincante en anglais.",
  theory: `
<h3>1. Cover letter : le rôle de la lettre</h3>
<p>La <strong>lettre de motivation</strong> (cover letter) accompagne votre CV (resume/CV). Elle ne répète pas le CV : elle raconte pourquoi VOUS convenez à CE poste, avec des exemples concrets. En anglais professionnel, elle doit être formelle, concise (une page), et sans faute. C'est souvent ce qui décide un recruteur à vous accorder un entretien.</p>
<h3>2. La structure type</h3>
<pre class="pseudo">1. En-tete : vos coordonnees, date, coordonnees de l'entreprise
2. Salutation : Dear Mr/Ms [Nom], ou Dear Hiring Manager,
3. Paragraphe 1 : le poste vise + ou vous l'avez vu + accroche
4. Paragraphe 2 : vos competences cles + preuves concretes
5. Paragraphe 3 : pourquoi CETTE entreprise + ce que vous apportez
6. Cloture : disponibilite + formule de politesse
7. Signature : Yours sincerely/faithfully + nom</pre>
<div class="tip">Adresse la lettre à une personne nommée si tu la connais (« Dear Ms Patel »). Sinon, « Dear Hiring Manager » est plus moderne que « Dear Sir or Madam ».</div>
<h3>3. Paragraphe d'ouverture</h3>
<p>Il indique le poste, la source de l'annonce, et pose une première accroche. Évite le banal « I am writing to apply » seul : ajoute une raison.</p>
<pre class="pseudo">I am writing to apply for the position of Junior Marketing Assistant, advertised on your website.
-> Je vous ecris pour poser ma candidature au poste de...
As a recent graduate with a strong passion for digital communication, I was thrilled to discover this opportunity.
-> En tant que jeune diplome passionne par..., j'ai ete ravi de decouvrir cette offre.</pre>
<h3>4. Paragraphe des compétences : montrer, pas seulement affirmer</h3>
<p>Ne te contente pas d'adjectifs : appuie chaque qualité sur une <strong>preuve concrète</strong> (réalisation, chiffre, expérience). C'est la règle « show, don't just tell ».</p>
<pre class="pseudo">Faible : I am hard-working and organised.
Fort : During my internship at X, I managed three projects simultaneously and increased social media engagement by 40%.
-> Lors de mon stage chez X, j'ai gere trois projets en meme temps et augmente l'engagement de 40%.</pre>
<div class="warn">Chaque affirmation doit être prouvée. « I have excellent communication skills » ne vaut rien sans exemple : « I regularly presented reports to a team of twenty. »</div>
<h3>5. Paragraphe « pourquoi cette entreprise »</h3>
<p>Montre que tu t'es renseigné : mentionne une valeur, un projet, une réussite de l'entreprise, et relie-la à ta motivation. Le recruteur veut sentir un intérêt sincère, pas une lettre générique.</p>
<pre class="pseudo">I am particularly drawn to your company's commitment to sustainability, which aligns with my own values.
-> Je suis particulierement attire par l'engagement de votre entreprise en faveur du developpement durable, qui correspond a mes valeurs.
I am confident that my skills would contribute to your team's continued success.
-> Je suis convaincu que mes competences contribueraient au succes continu de votre equipe.</pre>
<h3>6. Formules de clôture</h3>
<pre class="pseudo">I would welcome the opportunity to discuss my application in an interview.
-> Je serais ravi de pouvoir echanger lors d'un entretien.
Thank you for considering my application. I look forward to hearing from you.
-> Je vous remercie d'etudier ma candidature. Dans l'attente de votre reponse.
Yours sincerely, (nom connu) / Yours faithfully, (nom inconnu)</pre>
<div class="warn">Rappel du jour 12 : « Yours sincerely » si tu connais le nom du destinataire, « Yours faithfully » avec « Dear Sir or Madam ». En anglais américain, on écrit plutôt « Sincerely, ».</div>
<h3>7. Erreurs fréquentes des francophones</h3>
<pre class="pseudo">- Traduire « candidature spontanee » -> dire : an unsolicited application / speculative application
- Ecrire « I postulate » (faux ami) -> dire : I am applying
- « actual » veut dire REEL, pas « actuel » -> pour « actuel » : current
- Etre trop long : viser 3-4 paragraphes, une page maximum
- Repeter le CV mot pour mot au lieu de le mettre en valeur</pre>
<div class="tip">Relis toujours : orthographe, nom de l'entreprise correct, ton formel constant. Une seule faute peut coûter l'entretien.</div>`,
  exercises: [
    { type: "qcm", q: "Quel est le rôle principal d'une cover letter ?", opts: ["Répéter le CV mot pour mot", "Expliquer pourquoi vous convenez à ce poste précis, avec des exemples", "Lister tous vos diplômes", "Remplacer le CV"], a: 1, exp: "La lettre met en valeur l'adéquation candidat-poste, sans répéter le CV." },
    { type: "qcm", q: "Si vous ne connaissez pas le nom du recruteur, quelle salutation moderne ?", opts: ["Hi there", "Dear Hiring Manager", "To whom", "Hey"], a: 1, exp: "« Dear Hiring Manager » est formel et moderne quand le nom est inconnu." },

    { type: "input", q: "Complète : « I am writing to ___ for the position of Sales Assistant. »", a: ["apply"], ph: "un verbe", exp: "apply for a position = postuler à un poste." },
    { type: "qcm", q: "Quelle phrase applique la règle « show, don't just tell » ?", opts: ["I am very organised.", "I am a hard worker.", "During my internship, I managed three projects at once.", "I have many skills."], a: 2, exp: "Elle prouve la compétence par une réalisation concrète." },

    { type: "qcm", q: "Après « Dear Ms Patel », quelle clôture ?", opts: ["Yours faithfully", "Yours sincerely", "Cheers", "Take care"], a: 1, exp: "Nom connu (Ms Patel) -> Yours sincerely." },
    { type: "qcm", q: "Que doit contenir le paragraphe « pourquoi cette entreprise » ?", opts: ["Vos loisirs", "Une preuve que vous vous êtes renseigné et un lien avec votre motivation", "Vos prétentions salariales", "Votre âge"], a: 1, exp: "Il montre un intérêt sincère et informé pour l'entreprise précise." },
    { type: "vf", q: "Une bonne cover letter tient idéalement sur une page.", a: true, exp: "Concision : 3-4 paragraphes, une page maximum." },
    { type: "input", q: "Complète la clôture : « Thank you for ___ my application. » (étudier/considérer)", a: ["considering"], ph: "un mot en -ing", exp: "Thank you for considering my application : formule standard." },
    { type: "qcm", q: "Quelle ouverture est la plus efficace ?", opts: ["I want a job.", "As a recent graduate passionate about design, I was excited to see your opening for a Junior Designer.", "Hello, I need work.", "Give me this job."], a: 1, exp: "Elle relie le profil au poste avec une accroche motivée." },
    { type: "qcm", q: "« I have excellent communication skills » est faible sans…", opts: ["adjectif", "preuve concrète (exemple, réalisation)", "date", "photo"], a: 1, exp: "Chaque affirmation doit être appuyée par un exemple précis." },
    { type: "input", q: "Complète : « I would welcome the opportunity to discuss my application in an ___. »", a: ["interview"], ph: "un mot", exp: "discuss my application in an interview = lors d'un entretien." },
    { type: "vf", q: "« actual » se traduit par « actuel » en français.", a: false, exp: "Faux ami : actual = réel/véritable. « Actuel » se dit current." },
    { type: "qcm", q: "Comment nommer une « candidature spontanée » en anglais ?", opts: ["a spontaneous letter", "a speculative / unsolicited application", "a free application", "a natural application"], a: 1, exp: "speculative / unsolicited application = candidature spontanée." }
  ],
  final: {
    title: "Exercice final — Une lettre de motivation modèle",
    intro: `<p>Read this model cover letter and identify each part.</p>
<p>Dear Ms Reynolds, I am writing to apply for the position of Junior Data Analyst, advertised on your company's careers page. As a recent statistics graduate with a genuine passion for turning data into clear insights, I was delighted to discover this opportunity at DataBridge. During my six-month internship at a market research firm, I built automated dashboards that reduced reporting time by 30% and presented my findings to a team of twelve. This experience sharpened both my technical skills in Python and SQL and my ability to communicate complex results to non-specialists. I am particularly drawn to DataBridge's reputation for ethical, transparent use of data, a value that matters deeply to me. I am confident that my analytical mindset and eagerness to learn would make a positive contribution to your team. I would welcome the opportunity to discuss my application further in an interview. Thank you for considering my application. Yours sincerely, Léa Moreau.</p>`,
    questions: [
      { type: "qcm", q: "Le paragraphe d'ouverture indique…", opts: ["uniquement le salaire", "le poste visé, la source de l'annonce et une accroche", "les loisirs du candidat", "la conclusion"], a: 1, exp: "Poste (Junior Data Analyst) + source (careers page) + accroche motivée." },
      { type: "vf", q: "« I built automated dashboards that reduced reporting time by 30% » applique la règle « show, don't just tell ».", a: true, exp: "Une réalisation chiffrée prouve la compétence au lieu de l'affirmer." },
      { type: "qcm", q: "« I am particularly drawn to DataBridge's reputation for ethical use of data » sert à…", opts: ["répéter le CV", "montrer un intérêt informé et sincère pour cette entreprise", "demander une augmentation", "conclure"], a: 1, exp: "C'est le paragraphe « pourquoi cette entreprise » : lien valeurs/motivation." },
      { type: "qcm", q: "Pourquoi « Yours sincerely » à la fin ?", opts: ["nom inconnu", "le nom (Ms Reynolds) est connu", "c'est informel", "erreur"], a: 1, exp: "Le destinataire est nommé (Ms Reynolds) -> Yours sincerely." },
      { type: "qcm", q: "Quelle phrase constitue la clôture avec appel à l'entretien ?", opts: ["I am writing to apply...", "During my internship...", "I would welcome the opportunity to discuss my application further in an interview.", "As a recent graduate..."], a: 2, exp: "Cette phrase propose l'entretien : clôture typique." }
    ],
    solution: `<p>La lettre modèle suit fidèlement la structure enseignée :</p>
<pre class="pseudo">Salutation : Dear Ms Reynolds,  -> nom connu
Ouverture : poste vise + source + accroche (recent graduate ... delighted)
Competences (show, don't tell) : dashboards -30% reporting time, presented to twelve, Python/SQL
Pourquoi cette entreprise : drawn to DataBridge's ethical use of data (valeurs partagees)
Apport : analytical mindset ... positive contribution
Cloture : welcome the opportunity to discuss ... in an interview + Thank you
Signature : Yours sincerely, (nom connu)</pre>
<p>Chaque paragraphe a une fonction claire, les compétences sont prouvées par des chiffres, l'intérêt pour l'entreprise est sincère et informé, et le ton reste formel du début à la fin. C'est le modèle à adapter à ta propre candidature.</p>`
  }
};
</script>

    solution: "Dear Mr Thompson,\nI am writing to apply for the position of Customer Support Specialist, advertised on your website. As a bilingual communicator with three years of experience in the service industry, I was excited to discover an opening that matches my skills so closely.\nIn my current role at a busy call centre, I handle around fifty enquiries a day while maintaining a customer satisfaction score of 95%. This experience has strengthened my patience, my problem-solving ability, and my talent for explaining technical issues in simple terms. I am also fluent in French and English, which allows me to assist a diverse range of customers.\nI am particularly impressed by GreenTech's commitment to treating customers as long-term partners rather than mere transactions, an approach I strongly share. I am confident that my communication skills and my calm, solution-focused attitude would be a valuable asset to your team.\nI would welcome the opportunity to discuss my application in an interview. Thank you for considering my candidacy. I look forward to hearing from you.\nYours sincerely,\nKarim Belhadi\n\nTraduction : Cher M. Thompson, Je vous ecris pour poser ma candidature au poste de Specialiste du support client, publie sur votre site. En tant que communicant bilingue avec trois ans d'experience dans le service, j'ai ete enthousiaste de decouvrir une offre correspondant aussi bien a mes competences. Dans mon poste actuel au sein d'un centre d'appels tres actif, je traite environ cinquante demandes par jour tout en maintenant un score de satisfaction de 95%. Cette experience a renforce ma patience, ma capacite a resoudre les problemes et mon talent pour expliquer des questions techniques simplement. Je parle aussi couramment francais et anglais, ce qui me permet d'aider une clientele variee. Je suis particulierement impressionne par l'engagement de GreenTech a traiter les clients comme des partenaires de long terme plutot que de simples transactions, une approche que je partage pleinement. Je suis convaincu que mes competences en communication et mon attitude calme et orientee solutions seraient un atout precieux pour votre equipe. Je serais ravi de pouvoir echanger lors d'un entretien. Je vous remercie d'etudier ma candidature. Dans l'attente de votre reponse. Cordialement, Karim Belhadi.",
