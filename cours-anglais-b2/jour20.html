<script>
var DAY = {
  num: 20,
  title: "Analyser un fait divers en détail",
  subtitle: "Aller au-delà des faits : chronologie, cause, sous-entendu, ton.",
  theory: `
<h3>1. Analyser, ce n'est pas seulement comprendre</h3>
<p>Comprendre un fait divers, c'est répondre aux cinq W (jour 19). L'<strong>analyser</strong>, c'est aller plus loin : reconstituer la <strong>chronologie</strong> exacte, distinguer <strong>cause et conséquence</strong>, saisir ce qui est <strong>implicite</strong> (non dit mais suggéré) et percevoir le <strong>ton</strong> de l'auteur. C'est le niveau de lecture attendu au B2.</p>
<h3>2. Le fait divers à analyser</h3>
<p><em>Last Tuesday, a routine flight from Manchester turned into an unexpected adventure for a passenger named Gerald Ashby. When he arrived home in the evening and opened his suitcase, he found not his own clothes but a full set of professional clown costumes, complete with red noses, oversized shoes and a curly wig.</em></p>
<p><em>The two suitcases, it turned out, were identical: the same brand, the same colour, and even the same worn sticker on the handle. Mr Ashby had picked up the wrong one from the carousel without noticing.</em></p>
<p><em>Rather than complaining, Mr Ashby saw the funny side. He photographed himself wearing the red nose and posted the picture online, asking whether anyone had lost a suitcase full of clown gear. Within hours, the picture had been shared thousands of times.</em></p>
<p><em>The owner turned out to be a professional entertainer called Marco, who was due to perform at a children's hospital the very next morning and had been searching for his missing costumes in a panic. Thanks to the online post, the two men met at the airport the following day and swapped their suitcases.</em></p>
<p><em>Marco was so grateful that he invited Mr Ashby to watch his hospital show. What could have been a frustrating mistake became, in the end, a small moment of joy for a ward full of sick children — and a story Mr Ashby says he will be telling for years.</em></p>
<h3>3. Aide au vocabulaire</h3>
<pre class="pseudo">a routine flight     un vol ordinaire
it turned out        il s'est avéré / finalement
the carousel         le tapis à bagages
clown gear           du matériel de clown
to see the funny side prendre les choses avec humour
to be due to         devoir (être prévu pour)
in a panic           en panique
to swap              échanger
a ward               une salle / un service (hôpital)
grateful             reconnaissant</pre>
<h3>4. Lire l'implicite et le ton</h3>
<p>Le texte ne dit jamais explicitement « les deux hommes étaient soulagés », mais on le <strong>déduit</strong> de « swapped their suitcases » et « so grateful ». De même, le mot <em>panic</em> suggère l'angoisse de Marco sans la décrire. Enfin, le <strong>ton</strong> est chaleureux et optimiste : la dernière phrase (« a small moment of joy ») transforme une erreur en belle histoire.</p>
<div class="tip">Pour repérer l'implicite, demandez-vous : « Que puis-je déduire qui n'est pas écrit noir sur blanc ? » Pour le ton, regardez les mots chargés d'émotion (<em>panic, grateful, joy</em>) et la façon dont l'histoire se termine.</div>`,
  exercises: [
    { type: "qcm", q: "Que Gerald Ashby a-t-il trouvé dans la valise ?", opts: ["Ses propres vêtements", "Des costumes de clown", "De l'argent", "Rien"], a: 1, exp: "« a full set of professional clown costumes »." },
    { type: "qcm", q: "Pourquoi s'est-il trompé de valise ?", opts: ["Il était distrait par son téléphone", "Les deux valises étaient identiques", "Quelqu'un a échangé les étiquettes", "Il ne portait pas ses lunettes"], a: 1, exp: "« The two suitcases were identical: same brand, same colour, same worn sticker »." },
    { type: "input", q: "Où récupère-t-on ses bagages à l'aéroport ? Le mot du texte : the ___.", a: ["carousel"], ph: "un mot", exp: "The carousel = le tapis / carrousel à bagages." },
    { type: "qcm", q: "Comment Mr Ashby a-t-il réagi à sa méprise ?", opts: ["Il s'est plaint à la compagnie", "Il a pris les choses avec humour et a posté une photo", "Il a jeté la valise", "Il a porté plainte"], a: 1, exp: "« Rather than complaining, Mr Ashby saw the funny side. »" },
    { type: "qcm", q: "Qui était le propriétaire de la valise ?", opts: ["Un pilote", "Un artiste professionnel nommé Marco", "Un enfant malade", "Un policier"], a: 1, exp: "« a professional entertainer called Marco »." },
    { type: "qcm", q: "Pourquoi Marco cherchait-il ses costumes en panique ?", opts: ["Il partait en vacances", "Il devait se produire dans un hôpital pour enfants le lendemain matin", "Il voulait les vendre", "Ils étaient très chers"], a: 1, exp: "« due to perform at a children's hospital the very next morning »." },
    { type: "vf", q: "On peut déduire que les deux hommes étaient soulagés d'échanger leurs valises, même si ce n'est pas écrit tel quel.", a: true, exp: "C'est de l'implicite : « swapped their suitcases » et « so grateful » le suggèrent." },
    { type: "input", q: "Traduis <em>it turned out</em> : il s'est ___.", a: ["avéré", "révélé"], ph: "un mot", exp: "It turned out = il s'est avéré, finalement." },
    { type: "qcm", q: "Grâce à quoi les deux hommes se sont-ils retrouvés ?", opts: ["Un appel à la police", "La publication en ligne partagée des milliers de fois", "Une annonce à l'aéroport", "Le hasard"], a: 1, exp: "« Thanks to the online post, the two men met at the airport »." },
    { type: "qcm", q: "Comment se termine l'histoire ?", opts: ["Par un procès", "Marco invite Mr Ashby à voir son spectacle à l'hôpital", "Les valises restent perdues", "Marco garde les deux valises"], a: 1, exp: "« Marco… invited Mr Ashby to watch his hospital show »." },
    { type: "qcm", q: "Quel est le TON général de ce fait divers ?", opts: ["Inquiétant", "Chaleureux et optimiste", "Ironique et amer", "Neutre et froid"], a: 1, exp: "Les mots joy, grateful et la fin heureuse donnent un ton chaleureux." },
    { type: "input", q: "Traduis <em>to swap</em> : ___.", a: ["échanger", "s'échanger"], ph: "un verbe", exp: "To swap = échanger." },
    { type: "vf", q: "Le mot <em>panic</em> décrit explicitement, en détail, les émotions de Marco.", a: false, exp: "« panic » suggère l'angoisse sans la décrire : c'est un mot chargé qui laisse deviner l'émotion." },
    { type: "qcm", q: "Quelle phrase montre le mieux la « morale » implicite de l'histoire ?", opts: ["The two suitcases were identical", "What could have been a frustrating mistake became a small moment of joy", "He posted the picture online", "Marco was searching in a panic"], a: 1, exp: "Cette phrase transforme l'erreur en histoire positive : c'est le message de l'auteur." },
    { type: "qcm", q: "Reconstituez la chronologie : que s'est-il passé EN PREMIER ?", opts: ["Mr Ashby poste la photo", "Mr Ashby prend la mauvaise valise au tapis", "Les deux hommes échangent les valises", "Marco invite Mr Ashby"], a: 1, exp: "L'erreur au carrousel est le point de départ de toute la chaîne d'événements." }
  ],
  final: {
    title: "Exercice final — Chronologie et cause",
    intro: `<p>Analysez la structure causale du récit. Rappel : chaque événement en <strong>déclenche</strong> un autre (cause → conséquence).</p>
<p><em>Reorder the chain of events and identify what caused the happy ending.</em></p>`,
    questions: [
      { type: "qcm", q: "Quel est le tout PREMIER maillon de la chaîne ?", opts: ["La photo en ligne", "L'erreur de valise au carrousel", "La rencontre à l'aéroport", "Le spectacle à l'hôpital"], a: 1, exp: "Sans l'échange accidentel, rien ne se serait produit." },
      { type: "qcm", q: "Qu'est-ce qui a directement permis de retrouver le propriétaire ?", opts: ["La police", "La publication en ligne virale", "Une étiquette sur la valise", "Un employé de l'aéroport"], a: 1, exp: "La photo partagée des milliers de fois a mené à Marco." },
      { type: "qcm", q: "Pourquoi le facteur temps était-il crucial pour Marco ?", opts: ["Son vol repartait le soir", "Il devait jouer à l'hôpital dès le lendemain matin", "La valise allait être détruite", "Il devait rembourser un client"], a: 1, exp: "Le spectacle du lendemain matin rendait l'urgence réelle." },
      { type: "vf", q: "Sans la réaction humoristique de Mr Ashby, l'histoire n'aurait probablement pas eu ce dénouement heureux.", a: true, exp: "C'est sa décision de poster la photo, plutôt que de se plaindre, qui déclenche tout." },
      { type: "qcm", q: "Quelle est la conséquence finale, la plus positive ?", opts: ["Mr Ashby garde les costumes", "Les enfants malades ont eu leur spectacle et un moment de joie", "Marco a perdu son travail", "L'aéroport a été fermé"], a: 1, exp: "« a small moment of joy for a ward full of sick children » : la vraie récompense." }
    ],
    solution: `<p>La chaîne causale est limpide : <strong>erreur au carrousel → réaction humoristique → photo virale → identification de Marco → échange des valises → spectacle sauvé → joie des enfants</strong>. Chaque maillon dépend du précédent. Analyser un fait divers, c'est justement dérouler cette logique et repérer les <strong>points de bascule</strong> : ici, le choix de Mr Ashby de rire plutôt que de râler change tout. On note aussi l'<strong>implicite</strong> (le soulagement des deux hommes, jamais écrit) et le <strong>ton</strong> chaleureux souligné par la dernière phrase. C'est exactement cette lecture fine — chronologie, causes, sous-entendus, ton — que vous appliquerez au fait divers de deux pages du projet final.</p>`
  }
};
</script>

    hints: [
      "Employez des connecteurs de cause : « because », « thanks to », « as a result », « which led to ».",
      "Montrez le point de bascule : la décision de Mr Ashby de rire plutôt que de se plaindre.",

    solution: "The story ended happily mainly because of Mr Ashby's reaction. Instead of complaining about the mix-up, he saw the funny side and posted a photo of himself online. As a result, the picture went viral and quickly reached Marco, the owner of the clown costumes. Thanks to the post, the two men were able to meet and swap their suitcases just in time for Marco's hospital show. If Mr Ashby had been angry, Marco might never have performed for the sick children. The tone of the story is warm and optimistic, turning a simple mistake into a moment of shared joy.\n\nTraduction et notes : « L'histoire s'est bien terminée surtout grâce à la réaction de Mr Ashby. Au lieu de se plaindre de la méprise, il a pris les choses avec humour et a posté une photo de lui en ligne. Résultat, l'image est devenue virale et a rapidement atteint Marco, le propriétaire des costumes. Grâce à la publication, les deux hommes ont pu se rencontrer et échanger leurs valises juste à temps pour le spectacle de Marco à l'hôpital. Si Mr Ashby s'était mis en colère, Marco n'aurait peut-être jamais joué pour les enfants malades. Le ton de l'histoire est chaleureux et optimiste, transformant une simple erreur en un moment de joie partagée. » Remarquez les connecteurs de cause (because, as a result, thanks to) et le conditionnel passé (If… had been… might never have performed).",
    note: "Analyser, c'est expliquer les liens de cause à effet et non se contenter de raconter. Le conditionnel passé (« if he had… he would have… ») est parfait pour montrer ce qui aurait pu se passer autrement." }
  ]
};
