<script>
var DAY = {
  num: 8,
  title: "Les modaux au passé (should have...)",
  subtitle: "Regret, reproche, déduction : parler du passé avec les modaux parfaits.",
  theory: `
<h3>1. Modal + have + participe passé</h3>
<p>Pour parler du passé avec un modal, on emploie la structure <strong>modal + have + participe passé</strong>. Chaque modal apporte une nuance différente : regret, reproche, déduction, possibilité manquée. C'est un point délicat mais essentiel au niveau B2.</p>
<pre class="pseudo">should + have + participe -> regret, reproche
could + have + participe  -> possibilite non realisee
must + have + participe   -> deduction quasi certaine (positive)
can't + have + participe  -> deduction quasi certaine (negative)
might/may + have          -> possibilite incertaine
would + have + participe  -> consequence hypothetique</pre>
<h3>2. Should have : le regret et le reproche</h3>
<p><strong>Should have + participe</strong> exprime que quelque chose aurait dû se faire (mais ne s'est pas fait), ou l'inverse. C'est le modal du regret et du reproche.</p>
<pre class="pseudo">I should have called you. -> J'aurais du t'appeler. (mais je ne l'ai pas fait)
You shouldn't have said that. -> Tu n'aurais pas du dire ca.
She should have arrived by now. -> Elle aurait deja du arriver.</pre>
<div class="tip"><em>Ought to have</em> a le même sens que <em>should have</em>, mais est plus formel : « You ought to have warned me. »</div>
<h3>3. Could have : la possibilité manquée</h3>
<p><strong>Could have + participe</strong> décrit une possibilité qui existait dans le passé mais ne s'est pas réalisée. Souvent teinté de reproche ou de soulagement.</p>
<pre class="pseudo">You could have told me! -> Tu aurais pu me le dire ! (reproche)
We could have won, but we made too many mistakes.
-> Nous aurions pu gagner, mais nous avons trop erre.
You could have been hurt. -> Tu aurais pu etre blesse. (soulagement)</pre>
<div class="warn">Ne confonds pas : « I couldn't have done it » (je n'aurais pas pu le faire = incapacité passée) et « I shouldn't have done it » (je n'aurais pas dû = regret d'un acte fait).</div>
<h3>4. Must have / can't have : la déduction sur le passé</h3>
<p>Pour déduire ce qui a probablement eu lieu, on emploie <strong>must have</strong> (déduction positive quasi certaine) et <strong>can't have</strong> ou <strong>couldn't have</strong> (déduction négative quasi certaine).</p>
<pre class="pseudo">The ground is wet. It must have rained. -> Il a du pleuvoir.
He can't have finished already, it's impossible!
-> Il ne peut pas avoir deja fini, c'est impossible !
She looks tired. She can't have slept well.
-> Elle doit ne pas avoir bien dormi.</pre>
<div class="warn">Pour la déduction négative sur le passé, on utilise <em>can't have</em> / <em>couldn't have</em>, JAMAIS <em>mustn't have</em>. « Mustn't » sert à l'interdiction, pas à la déduction.</div>
<h3>5. Might have / may have : la possibilité incertaine</h3>
<p><strong>Might have</strong> ou <strong>may have + participe</strong> expriment une hypothèse incertaine sur le passé (« il se peut que »).</p>
<pre class="pseudo">He might have missed the train. -> Il a peut-etre rate le train.
They may have forgotten the meeting. -> Ils ont peut-etre oublie la reunion.
I might have left my keys at home. -> J'ai peut-etre laisse mes cles chez moi.</pre>
<h3>6. Récapitulatif des nuances</h3>
<p>La même situation change de sens selon le modal choisi :</p>
<pre class="pseudo">He didn't answer.
He must have been busy.     -> Il devait etre occupe (certitude).
He might have been busy.    -> Il etait peut-etre occupe (incertitude).
He can't have been busy.    -> Il ne pouvait pas etre occupe (certitude negative).
He should have answered.    -> Il aurait du repondre (reproche).
He could have answered.     -> Il aurait pu repondre (possibilite manquee).</pre>
<div class="tip">À l'oral, « should have » se contracte souvent en « should've », qui sonne comme « should of ». Attention : à l'écrit, on n'écrit JAMAIS « should of » ; c'est toujours « should have ».</div>`,
  exercises: [
    { type: "qcm", q: "« I ___ you, but I forgot. Sorry! » (regret)", opts: ["should have called", "must have called", "can't have called", "could call"], a: 0, exp: "Regret d'une omission : should have called." },
    { type: "qcm", q: "« The grass is wet. It ___ during the night. » (déduction quasi certaine)", opts: ["should have rained", "must have rained", "can't have rained", "could rain"], a: 1, exp: "Déduction positive quasi certaine : must have rained." },
    { type: "input", q: "Complète : « He ___ (can't) have finished already — it's only been five minutes! »", a: ["can't", "cannot"], ph: "modal négatif", exp: "Déduction négative sur le passé : can't have finished." },
    { type: "qcm", q: "« You ___ me you were coming! I would have cooked. » (reproche, possibilité manquée)", opts: ["must have told", "could have told", "can't have told", "should tell"], a: 1, exp: "Possibilité manquée avec reproche : could have told." },
    { type: "vf", q: "Pour déduire négativement sur le passé, on utilise « mustn't have ».", a: false, exp: "On utilise « can't have » ou « couldn't have », jamais « mustn't have »." },
    { type: "input", q: "Complète : « She looks upset. Something bad ___ (must) have happened. »", a: ["must"], ph: "un mot", exp: "Déduction quasi certaine : must have happened." },
    { type: "qcm", q: "« They're not here yet. They ___ the traffic. » (hypothèse incertaine)", opts: ["must have hit", "might have hit", "can't have hit", "should have hit"], a: 1, exp: "Hypothèse incertaine sur le passé : might have hit." },
    { type: "qcm", q: "« You shouldn't have spent so much money. » signifie…", opts: ["Tu ne pouvais pas dépenser", "Tu n'aurais pas dû dépenser autant (reproche)", "Tu vas dépenser", "Tu dois dépenser"], a: 1, exp: "Should not have = reproche d'un acte accompli." },
    { type: "input", q: "Écris la forme correcte à l'écrit : « I should ___ studied more. »", a: ["have"], ph: "un mot", exp: "Toujours « should have » à l'écrit, jamais « should of »." },
    { type: "qcm", q: "« We could have won the match. » implique…", opts: ["Nous avons gagné", "Nous aurions pu gagner mais ne l'avons pas fait", "Nous gagnerons", "Nous devons gagner"], a: 1, exp: "Could have = possibilité passée non réalisée : nous n'avons pas gagné." },
    { type: "qcm", q: "Choisis la déduction certaine négative : « The lights are off. They ___ home. »", opts: ["must be", "can't be", "should be", "might be"], a: 1, exp: "Ici présent : can't be = déduction négative certaine (ils ne peuvent pas être là)." },
    { type: "input", q: "Complète (possibilité incertaine) : « I ___ (may) have left my phone at work. »", a: ["may", "might"], ph: "modal", exp: "Hypothèse incertaine : may/might have left." },
    { type: "vf", q: "« He must have been tired » exprime une déduction quasi certaine sur le passé.", a: true, exp: "Must have + participe = forte probabilité rétrospective." },
    { type: "qcm", q: "Différence entre « I couldn't have done it » et « I shouldn't have done it » ?", opts: ["Aucune", "La 1re = incapacité passée, la 2e = regret d'un acte fait", "La 2e est fausse", "Les deux expriment un futur"], a: 1, exp: "couldn't have = je n'aurais pas pu ; shouldn't have = je n'aurais pas dû (mais je l'ai fait)." },
    { type: "input", q: "Complète : « The exam was easy; she ___ (can't) have failed. »", a: ["can't", "cannot", "couldn't", "could not"], ph: "modal négatif", exp: "Déduction négative certaine : can't/couldn't have failed." }
  ],
  final: {
    title: "Exercice final — L'enquête",
    intro: `<p>Read this passage in which a detective reasons about a break-in, using past modals.</p>
<p>The window was open, so the thief must have climbed in through the garden. He can't have used the front door, because the lock shows no sign of damage. Whoever it was might have known the family's schedule, since they struck while everyone was out. The neighbours should have noticed something, yet they claim they saw nothing. Honestly, the owners could have installed an alarm years ago; this whole mess might have been prevented. The muddy footprints suggest the intruder must have waited in the rain for some time. He may have dropped this glove by accident. One thing is certain: he couldn't have carried the safe alone, so he must have had an accomplice. We should have questioned the delivery driver first; that was our mistake.</p>`,
    questions: [
      { type: "qcm", q: "« the thief must have climbed in through the garden » exprime…", opts: ["un regret", "une déduction quasi certaine", "une incapacité", "un ordre"], a: 1, exp: "Must have + participe : forte probabilité rétrospective." },
      { type: "qcm", q: "« He can't have used the front door » signifie…", opts: ["il a peut-être utilisé la porte", "il est presque impossible qu'il ait utilisé la porte", "il aurait dû utiliser la porte", "il pouvait utiliser la porte"], a: 1, exp: "Can't have = déduction négative quasi certaine." },
      { type: "vf", q: "« The neighbours should have noticed something » exprime un reproche.", a: true, exp: "Should have + participe : ils auraient dû remarquer (mais ne l'ont pas fait)." },
      { type: "qcm", q: "« this whole mess might have been prevented » exprime…", opts: ["une certitude", "une possibilité incertaine (au passif)", "un ordre", "une habitude"], a: 1, exp: "Might have + been + participe : possibilité passée incertaine, ici au passif." },
      { type: "qcm", q: "« he couldn't have carried the safe alone, so he must have had an accomplice » combine…", opts: ["deux regrets", "une déduction négative certaine + une déduction positive certaine", "deux possibilités incertaines", "deux reproches"], a: 1, exp: "couldn't have (impossible qu'il ait porté seul) + must have had (il a forcément eu un complice)." }
    ],
    solution: `<p>Le raisonnement du détective illustre chaque modal parfait :</p>
<pre class="pseudo">must have climbed / must have waited / must have had  -> deduction quasi certaine (positive)
can't have used / couldn't have carried  -> deduction quasi certaine (negative)
might have known / may have dropped / might have been prevented  -> possibilite incertaine
should have noticed / should have questioned  -> reproche/regret
could have installed  -> possibilite passee non realisee</pre>
<p>Le choix du modal encode le degré de certitude et l'intention : must (quasi sûr), can't (quasi sûr que non), might/may (peut-être), should (reproche), could (possibilité manquée). Bien les manier, c'est raisonner en anglais avec nuance.</p>`
  }
};
</script>
