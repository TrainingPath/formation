<script>
var DAY = {
  num: 7,
  title: "Les phrases clivées (it is... that / what...)",
  subtitle: "Mettre en relief un élément précis de la phrase pour insister ou corriger.",
  theory: `
<h3>1. Pourquoi cliver une phrase ?</h3>
<p>Une <strong>phrase clivée</strong> (cleft sentence) découpe une information en deux morceaux pour <strong>mettre en relief</strong> un élément précis. C'est l'équivalent anglais de « c'est... que » et « ce qui... c'est » en français. On l'emploie pour insister, contraster ou corriger.</p>
<pre class="pseudo">Neutre : My brother broke the window.
Cleft  : It was my brother who broke the window.
-> C'est mon frere qui a casse la fenetre. (et pas quelqu'un d'autre)</pre>
<h3>2. It-cleft : It is / it was ... that / who</h3>
<p>La structure <strong>It + be + élément mis en relief + that/who</strong> isole n'importe quel élément : sujet, objet, complément de temps ou de lieu.</p>
<pre class="pseudo">It was John who called you. -> C'est John qui t'a appele. (le sujet)
It was you that I wanted to see. -> C'est toi que je voulais voir. (l'objet)
It was in Paris that we met. -> C'est a Paris que nous nous sommes rencontres. (le lieu)
It was yesterday that she resigned. -> C'est hier qu'elle a demissionne. (le temps)</pre>
<div class="tip">On utilise <em>who</em> pour une personne, <em>that</em> partout ailleurs (et souvent <em>that</em> convient aussi pour une personne). Le verbe <em>be</em> s'accorde avec le contexte : it is (présent), it was (passé).</div>
<h3>3. Wh-cleft (pseudo-cleft) : What ... is/was ...</h3>
<p>La structure <strong>What + proposition + be + élément</strong> met en relief en commençant par « ce que / ce qui ». Elle place l'information importante à la fin, position de poids en anglais.</p>
<pre class="pseudo">What I need is a holiday. -> Ce dont j'ai besoin, c'est de vacances.
What she said surprised everyone. -> Ce qu'elle a dit a surpris tout le monde.
What matters is your health. -> Ce qui compte, c'est ta sante.</pre>
<div class="warn"><em>What</em> signifie ici « ce qui / ce que », jamais « quoi ». Le verbe qui suit la proposition en What est toujours au singulier : « What I want <strong>is</strong>… », même si le complément est pluriel.</div>
<h3>4. Mettre un verbe ou une action en relief</h3>
<p>Pour insister sur toute une action, on utilise <em>What ... do is</em> (souvent suivi d'une base verbale sans <em>to</em>).</p>
<pre class="pseudo">What you should do is call the doctor.
-> Ce que tu devrais faire, c'est appeler le medecin.
What happened was that we missed the train.
-> Ce qui s'est passe, c'est que nous avons rate le train.</pre>
<h3>5. Autres têtes de clivée</h3>
<p>On peut cliver avec d'autres mots que <em>what</em> pour varier le focus.</p>
<pre class="pseudo">The person who helped me was a stranger.
-> La personne qui m'a aide etait un inconnu.
The reason (why) I called is that I need advice.
-> La raison pour laquelle j'ai appele, c'est que j'ai besoin de conseils.
The place where it happened is now a museum.
-> L'endroit ou cela s'est produit est aujourd'hui un musee.
All (that) I want is some peace. -> Tout ce que je veux, c'est un peu de paix.</pre>
<h3>6. Effet de contraste et de correction</h3>
<p>Les clivées servent particulièrement à <strong>corriger</strong> une idée fausse ou à <strong>contraster</strong>.</p>
<pre class="pseudo">- You broke it! - No, it was the cat that broke it, not me.
-> Non, c'est le chat qui l'a casse, pas moi.
It wasn't the price that bothered me, it was the attitude.
-> Ce n'etait pas le prix qui me genait, c'etait l'attitude.</pre>
<div class="tip">La position finale, en anglais, porte le poids de l'information (end-focus). Les clivées exploitent ce principe : elles repoussent l'élément-clé vers la fin ou l'encadrent nettement.</div>`,
  exercises: [
    { type: "qcm", q: "Clive pour insister sur le sujet : « Anna sent the letter. »", opts: ["It was the letter that Anna sent.", "It was Anna who sent the letter.", "What Anna is the letter.", "Anna it was sent the letter."], a: 1, exp: "Focus sur le sujet (Anna) : It was Anna who sent the letter." },
    { type: "input", q: "Complète : « It was in Berlin ___ they first met. »", a: ["that"], ph: "un mot", exp: "Pour un lieu clivé, on emploie that : It was in Berlin that…" },
    { type: "qcm", q: "« ___ I need is a good night's sleep. »", opts: ["It that", "What", "That which", "Who"], a: 1, exp: "Wh-cleft : What I need is… (ce dont j'ai besoin)." },
    { type: "vf", q: "Dans « What I want is more books », le verbe « is » est correct même si « books » est pluriel.", a: true, exp: "Le verbe s'accorde avec la proposition en What (singulier), pas avec le complément." },
    { type: "input", q: "Clive l'objet : « I wanted to see YOU. » -> « It was you ___ I wanted to see. »", a: ["that", "who", "whom"], ph: "un mot", exp: "Objet clivé : that (ou who/whom pour une personne)." },
    { type: "qcm", q: "« ___ you should do is apologise. »", opts: ["What", "It", "That", "Who"], a: 0, exp: "Mise en relief d'une action : What you should do is apologise." },
    { type: "qcm", q: "Corrige en clivant : quelqu'un t'accuse d'avoir cassé un vase, mais c'est ton frère.", opts: ["I broke the vase.", "It was my brother who broke the vase, not me.", "What the vase broke.", "My brother it was the vase."], a: 1, exp: "Clivée de correction : It was my brother who broke the vase, not me." },
    { type: "input", q: "Complète : « ___ matters is that you tried. » (Ce qui compte…)", a: ["what"], ph: "un mot", exp: "What matters is… : ce qui compte, c'est…" },
    { type: "qcm", q: "« The reason ___ I called is that I need help. »", opts: ["what", "which", "why", "who"], a: 2, exp: "The reason why I called… : on emploie why (souvent omissible)." },
    { type: "vf", q: "« It was Anna who sent the letter » met l'accent sur la lettre.", a: false, exp: "Cette clivée met l'accent sur Anna (le sujet), pas sur la lettre." },
    { type: "input", q: "Complète : « ___ happened was that the plane was delayed. »", a: ["what"], ph: "un mot", exp: "What happened was that… : ce qui s'est passé, c'est que…" },
    { type: "qcm", q: "Choisis la clivée correcte pour insister sur le moment : « She resigned yesterday. »", opts: ["It was yesterday that she resigned.", "What yesterday she resigned.", "It was resigned that yesterday.", "She it was yesterday resigned."], a: 0, exp: "Focus sur le temps : It was yesterday that she resigned." },
    { type: "qcm", q: "« ___ I want is some peace and quiet. »", opts: ["All", "It all", "Who", "That all"], a: 0, exp: "All (that) I want is… : tout ce que je veux, c'est…" },
    { type: "vf", q: "Les phrases clivées exploitent le principe d'end-focus : l'information clé va vers la fin.", a: true, exp: "L'anglais place le poids informatif à la fin ; les clivées s'appuient sur ce principe." },
    { type: "input", q: "Clive pour corriger : ce n'est pas le prix mais l'attitude qui t'a gêné. « It wasn't the price ___ bothered me, it was the attitude. »", a: ["that"], ph: "un mot", exp: "It wasn't the price that bothered me… : clivée de contraste avec that." }
  ],
  final: {
    title: "Exercice final — Une mise au point",
    intro: `<p>Read this passage in which a manager clarifies a misunderstanding, using many cleft structures.</p>
<p>Let me be clear about what actually happened. It wasn't the marketing team that missed the deadline; it was the supplier who let us down. What frustrates me most is not the delay itself, but the lack of communication. What we need now is a calm, honest conversation, not a search for someone to blame. It was during last week's meeting that I first raised these concerns, yet nobody listened. The reason why I am insisting today is that our clients deserve better. All I am asking is for each department to take responsibility. What matters, in the end, is not who was at fault, but how quickly we recover. It is precisely in moments like these that a real team proves its worth.</p>`,
    questions: [
      { type: "qcm", q: "« It wasn't the marketing team that missed the deadline » sert à…", opts: ["poser une question", "corriger une idée fausse en clivant", "donner un ordre", "exprimer un souhait"], a: 1, exp: "Clivée de correction : ce n'est pas l'équipe marketing, mais le fournisseur." },
      { type: "qcm", q: "« What frustrates me most is not the delay » : quelle structure ?", opts: ["it-cleft", "wh-cleft (pseudo-cleft)", "inversion", "passif"], a: 1, exp: "What + proposition + is : pseudo-cleft mettant en relief la source de frustration." },
      { type: "vf", q: "« It was during last week's meeting that I first raised these concerns » met en relief le moment.", a: true, exp: "L'it-cleft isole le complément de temps (during last week's meeting)." },
      { type: "qcm", q: "« The reason why I am insisting today is that... » met en relief…", opts: ["le lieu", "la cause / la raison", "le temps", "l'objet"], a: 1, exp: "The reason why... is that... clive la raison de l'action." },
      { type: "qcm", q: "« It is precisely in moments like these that a real team proves its worth » utilise…", opts: ["un wh-cleft", "un it-cleft renforcé par « precisely »", "une inversion", "un causatif"], a: 1, exp: "It is ... that ... : it-cleft, l'adverbe precisely accentue encore le focus." }
    ],
    solution: `<p>Le manager multiplie les clivées pour clarifier et contraster :</p>
<pre class="pseudo">It-cleft : It wasn't the marketing team that ... / It was during last week's meeting that ...
   / It is precisely in moments like these that ...
Wh-cleft : What frustrates me most is ... / What we need now is ... / What matters is ...
Autres tetes : The reason why I am insisting is that ... / All I am asking is ...</pre>
<p>Chaque clivée dirige l'attention sur un élément précis (le vrai responsable, le vrai problème, le vrai besoin) et repousse l'information-clé vers la fin. C'est un outil redoutable pour argumenter, corriger et nuancer.</p>`
  }
};
</script>

    solution: "I want to set the record straight about last weekend. It wasn't me who forgot to book the restaurant; it was actually my cousin who took charge of that. What upset me was not the mistake itself, but the way everyone blamed me without asking. What I really wanted was a quiet evening with the family, nothing more. It was only after dinner that the truth finally came out. What matters now is that we move on and laugh about it. All I ask is that, next time, we talk before we accuse.\n\nTraduction : Je veux mettre les choses au clair a propos du week-end dernier. Ce n'est pas moi qui ai oublie de reserver le restaurant ; c'est en fait mon cousin qui s'en occupait. Ce qui m'a contrarie, ce n'est pas l'erreur elle-meme, mais la facon dont tout le monde m'a accuse sans demander. Ce que je voulais vraiment, c'etait une soiree tranquille en famille, rien de plus. Ce n'est qu'apres le diner que la verite a fini par eclater. Ce qui compte maintenant, c'est qu'on passe a autre chose et qu'on en rie. Tout ce que je demande, c'est que, la prochaine fois, on parle avant d'accuser.",
