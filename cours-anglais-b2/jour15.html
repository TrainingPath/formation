<script>
var DAY = {
  num: 15,
  title: "L'entretien d'embauche approfondi (méthode STAR)",
  subtitle: "Répondre aux questions comportementales avec des exemples structurés et convaincants.",
  theory: `
<h3>1. L'entretien en anglais : ce qui vous attend</h3>
<p>Un <strong>entretien d'embauche</strong> (job interview) en anglais teste votre parcours, mais aussi votre aisance et votre structure de pensée. Les recruteurs anglophones adorent les <strong>questions comportementales</strong> (behavioural questions), qui commencent souvent par « Tell me about a time when… » ou « Give me an example of… ». Elles cherchent des preuves concrètes de vos compétences, pas des généralités.</p>
<pre class="pseudo">Tell me about a time when you faced a difficult challenge.
-> Parlez-moi d'un moment ou vous avez affronte un defi difficile.
Give me an example of when you worked in a team.
-> Donnez un exemple ou vous avez travaille en equipe.</pre>
<h3>2. La méthode STAR</h3>
<p>La <strong>méthode STAR</strong> est la structure idéale pour répondre à ces questions. Elle transforme une anecdote floue en récit clair et convaincant. STAR est un acronyme :</p>
<pre class="pseudo">S - SITUATION : plante le decor (contexte, ou, quand)
T - TASK      : la tache/le probleme a resoudre, ton objectif
A - ACTION    : ce que TU as concretement fait (le coeur de la reponse)
R - RESULT    : le resultat, l'impact, idealement chiffre + ce que tu as appris</pre>
<div class="tip">Insiste sur le A (Action) : utilise « I » plutôt que « we ». Le recruteur veut savoir ce que TU as fait, pas ce que ton équipe a fait collectivement.</div>
<h3>3. Situation et Task : poser le décor rapidement</h3>
<p>Sois bref : deux phrases suffisent pour situer. Donne juste assez de contexte pour rendre l'action compréhensible.</p>
<pre class="pseudo">Situation : In my previous role as a team leader, we were about to miss an important deadline.
-> Dans mon poste precedent de chef d'equipe, nous risquions de rater une echeance importante.
Task : My job was to deliver the project on time without exceeding the budget.
-> Ma mission etait de livrer le projet a temps sans depasser le budget.</pre>
<h3>4. Action : le cœur de la réponse</h3>
<p>C'est la partie la plus longue. Décris tes actions <strong>précises</strong>, étape par étape, avec des verbes d'action forts et le « I ».</p>
<pre class="pseudo">Action : I reorganised the tasks, delegated the less urgent ones, and introduced daily check-ins to track progress. I also negotiated a short extension with the client.
-> J'ai reorganise les taches, delegue les moins urgentes, et instaure des points quotidiens. J'ai aussi negocie un court delai avec le client.</pre>
<div class="warn">Évite le vague (« I did my best », « I helped »). Sois spécifique : « I created a shared tracker », « I trained two new colleagues ». Les détails rendent le récit crédible.</div>
<h3>5. Result : prouver l'impact</h3>
<p>Termine sur un résultat concret, si possible <strong>chiffré</strong>, et ajoute ce que tu en as tiré.</p>
<pre class="pseudo">Result : As a result, we delivered the project two days early and stayed under budget. The client renewed their contract, and I learned the value of proactive communication.
-> Resultat : nous avons livre deux jours en avance, sous le budget. Le client a renouvele son contrat, et j'ai appris la valeur d'une communication proactive.</pre>
<h3>6. Questions classiques et bonnes pratiques</h3>
<pre class="pseudo">Classiques : Tell me about yourself. / What are your strengths and weaknesses?
             Why do you want to work here? / Where do you see yourself in five years?
Comportementales : Tell me about a time you handled conflict / failed / led a team / met a tight deadline.</pre>
<div class="tip">Pour « What is your weakness? », choisis une vraie faiblesse mineure ET montre comment tu la corriges : « I used to struggle with public speaking, so I joined a club and now I present regularly. »</div>
<h3>7. Poser des questions et clôturer</h3>
<p>À la fin, le recruteur demande souvent « Do you have any questions? ». Toujours en avoir : cela montre ton intérêt. Termine poliment.</p>
<pre class="pseudo">What does a typical day look like in this role?
-> A quoi ressemble une journee type a ce poste ?
How would you describe the team culture?
-> Comment decririez-vous la culture d'equipe ?
Cloture : Thank you for your time. I am very enthusiastic about this opportunity.
-> Merci de votre temps. Je suis tres enthousiaste a l'idee de cette opportunite.</pre>
<div class="warn">Ne réponds jamais « No » à « Do you have any questions? » : cela signale un manque d'intérêt. Prépare toujours deux ou trois questions à l'avance.</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie l'acronyme STAR ?", opts: ["Start, Talk, Ask, Reply", "Situation, Task, Action, Result", "Say, Think, Act, Repeat", "Skill, Team, Aim, Reward"], a: 1, exp: "STAR = Situation, Task, Action, Result." },
    { type: "qcm", q: "Quelle partie de STAR doit être la plus développée ?", opts: ["Situation", "Task", "Action", "Result"], a: 2, exp: "L'Action est le cœur : ce que TU as concrètement fait." },
    { type: "input", q: "Dans STAR, quelle lettre correspond au résultat ? (une lettre)", a: ["r"], ph: "une lettre", exp: "R = Result, le résultat et l'impact." },
    { type: "vf", q: "Dans la partie Action, il vaut mieux dire « we » que « I ».", a: false, exp: "Utilise « I » : le recruteur veut savoir ce que TU as fait précisément." },
    { type: "qcm", q: "Une question comportementale commence souvent par…", opts: ["« What is your salary? »", "« Tell me about a time when... »", "« Do you like coffee? »", "« Where do you live? »"], a: 1, exp: "« Tell me about a time when… » introduit une question comportementale." },
    { type: "input", q: "Complète : « As a ___, we delivered the project two days early. » (introduire le résultat)", a: ["result"], ph: "un mot", exp: "As a result introduit le Result de STAR." },
    { type: "qcm", q: "Quelle réponse est la meilleure pour la partie Action ?", opts: ["I did my best.", "I helped a bit.", "I reorganised the tasks and introduced daily check-ins.", "We tried hard."], a: 2, exp: "Des actions précises et concrètes, à la première personne." },
    { type: "vf", q: "Un bon Result est concret et si possible chiffré.", a: true, exp: "Chiffrer l'impact (deux jours d'avance, +40%) rend la réponse convaincante." },
    { type: "qcm", q: "Pour « What is your weakness? », la meilleure stratégie est…", opts: ["dire qu'on n'en a aucune", "citer une vraie faiblesse mineure et montrer comment on la corrige", "citer un défaut grave", "changer de sujet"], a: 1, exp: "Une faiblesse réelle mais mineure + les efforts pour l'améliorer." },
    { type: "input", q: "Complète le début d'une réponse STAR : « In my previous ___, we were about to miss a deadline. »", a: ["role", "job", "position"], ph: "un nom", exp: "On pose la Situation : « In my previous role/job… »." },
    { type: "qcm", q: "À « Do you have any questions? », que faut-il faire ?", opts: ["répondre « No » pour gagner du temps", "toujours poser deux ou trois questions préparées", "poser une question sur le salaire uniquement", "partir"], a: 1, exp: "Avoir des questions montre l'intérêt ; « No » signale un désintérêt." },
    { type: "qcm", q: "Laquelle est une bonne question à poser au recruteur ?", opts: ["When can I leave early?", "How would you describe the team culture?", "Do I really have to work?", "Is the pay good?"], a: 1, exp: "Une question sur la culture d'équipe montre un intérêt professionnel." },
    { type: "input", q: "Complète la Task : « My ___ was to deliver the project on time. » (mission)", a: ["job", "task", "role", "goal"], ph: "un nom", exp: "La Task décrit l'objectif : « My job/task was to… »." },
    { type: "vf", q: "Il est recommandé de rester vague dans la partie Action pour paraître modeste.", a: false, exp: "Au contraire : sois spécifique et précis, les détails rendent crédible." },
    { type: "qcm", q: "Quel est l'ordre correct d'une réponse STAR ?", opts: ["Result, Action, Task, Situation", "Situation, Task, Action, Result", "Action, Result, Situation, Task", "Task, Situation, Result, Action"], a: 1, exp: "On plante le décor (S,T), on agit (A), on montre l'impact (R)." }
  ],
  final: {
    title: "Exercice final — Une réponse STAR modèle",
    intro: `<p>An interviewer asks: "Tell me about a time when you had to deal with a difficult customer." Read the candidate's STAR answer.</p>
<p>Certainly. In my previous role as a receptionist at a busy hotel, a guest arrived late at night to find that his room had been double-booked, and understandably he was extremely upset. My task was to resolve the situation quickly while keeping the guest calm and protecting the hotel's reputation. First, I listened carefully and apologised sincerely for the mistake. Then I checked our system, found that a suite was available, and offered it to him at no extra cost along with a complimentary breakfast. I also personally accompanied him to the room to make sure everything was in order. As a result, the guest not only calmed down but later left a five-star review praising our service. My manager thanked me the next morning, and I learned that staying composed and taking ownership of a problem can turn an angry customer into a loyal one. Since then, I have applied the same approach to every difficult situation I face.</p>`,
    questions: [
      { type: "qcm", q: "Quelle phrase constitue la SITUATION ?", opts: ["My task was to resolve the situation quickly.", "In my previous role as a receptionist, a guest arrived to find his room double-booked.", "As a result, the guest left a five-star review.", "First, I listened carefully."], a: 1, exp: "La Situation plante le décor : le rôle et le problème initial." },
      { type: "qcm", q: "« My task was to resolve the situation quickly while keeping the guest calm » correspond à…", opts: ["la Situation", "la Task", "l'Action", "le Result"], a: 1, exp: "C'est la Task : l'objectif à atteindre." },
      { type: "vf", q: "« I listened carefully... I checked our system... I offered him a suite... I accompanied him » constitue la partie Action, à la première personne.", a: true, exp: "Des actions précises, en « I » : c'est le cœur de la réponse STAR." },
      { type: "qcm", q: "Qu'est-ce qui rend le Result convaincant ici ?", opts: ["il est vague", "un résultat concret (five-star review) + ce que le candidat a appris", "il n'y a pas de résultat", "il parle du salaire"], a: 1, exp: "Result concret (avis 5 étoiles) et leçon tirée : la structure idéale." },
      { type: "qcm", q: "Pourquoi cette réponse est-elle efficace ?", opts: ["Elle est très courte", "Elle suit clairement S-T-A-R, utilise « I », donne des détails et un résultat mesurable", "Elle reste vague", "Elle utilise « we » partout"], a: 1, exp: "Structure STAR nette, première personne, détails et impact mesurable." }
    ],
    solution: `<p>La réponse déroule parfaitement la méthode STAR :</p>
<pre class="pseudo">SITUATION : In my previous role as a receptionist, a guest ... double-booked room
TASK      : My task was to resolve the situation quickly while keeping the guest calm
ACTION    : I listened / apologised / checked the system / offered a suite + breakfast / accompanied him
   -> actions precises, a la premiere personne (I)
RESULT    : five-star review + manager's thanks + lesson learned (staying composed, taking ownership)</pre>
<p>Les clés : un décor posé en deux phrases, une action détaillée en « I » (pas « we »), et un résultat mesurable suivi d'un apprentissage. Prépare à l'avance deux ou trois histoires STAR (un défi, un conflit, un succès, un échec) : tu pourras les adapter à presque toutes les questions comportementales.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en anglais…",
  items: [
  { id: "en-b2-j15", title: "Ta réponse STAR", level: 3,
    statement: "Un recruteur te demande : « Tell me about a time when you overcame a challenge or worked under pressure. » Rédige ta réponse (8 à 12 phrases) en suivant strictement la méthode STAR : Situation, Task, Action (à la première personne, détaillée), Result (concret et si possible chiffré + leçon apprise).",
    hints: [
      "Situation et Task : deux phrases suffisent pour poser le décor et l'objectif.",
      "Action : la partie la plus longue, en « I », avec des verbes d'action précis.",
      "Result : chiffre l'impact si possible et termine par ce que tu as appris."
    ],
    solution: "Of course. During my final year at university, I was leading a group project when two teammates suddenly dropped out just one week before the deadline. My task was to complete a research report that normally required four people, without lowering its quality. First, I reassessed the remaining workload and divided it realistically between myself and the last member of the team. I then created a shared online document so we could track progress in real time, and I stayed in close contact with our supervisor to clarify expectations. To save time, I focused on the most important sections first and cut unnecessary details. As a result, we submitted the report on time and received one of the highest marks in the class, 18 out of 20. More importantly, I learned that staying calm and organised under pressure is often more valuable than simply working harder. Since then, I have felt far more confident handling tight deadlines.\n\nTraduction : Bien sur. Pendant ma derniere annee a l'universite, je dirigeais un projet de groupe quand deux coequipiers ont soudainement abandonne une semaine avant l'echeance. Ma mission etait de terminer un rapport de recherche qui demandait normalement quatre personnes, sans en baisser la qualite. D'abord, j'ai reevalue la charge de travail restante et je l'ai repartie de maniere realiste entre moi et le dernier membre de l'equipe. J'ai ensuite cree un document en ligne partage pour suivre l'avancement en temps reel, et je suis reste en contact etroit avec notre encadrant pour clarifier les attentes. Pour gagner du temps, je me suis concentre d'abord sur les sections les plus importantes et j'ai coupe les details superflus. Resultat : nous avons rendu le rapport a temps et obtenu l'une des meilleures notes de la classe, 18 sur 20. Plus important encore, j'ai appris que rester calme et organise sous pression vaut souvent mieux que simplement travailler plus dur. Depuis, je me sens bien plus confiant face aux delais serres.",
    note: "Structure STAR visible : Situation (final year, teammates dropped out), Task (complete the report without lowering quality), Action détaillée en « I » (reassessed, divided, created a shared document, focused on key sections), Result chiffré (18/20, on time) + leçon apprise." }
  ]
};
</script>
