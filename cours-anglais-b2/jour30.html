<script>
var DAY = {
  num: 30,
  title: "Projet final (4) : conversation fluide de 15 minutes",
  subtitle: "Tenir une vraie conversation : trame, relances, gap-fillers et auto-bilan.",
  theory: `
<h3>1. Le dernier défi : parler 15 minutes sans blocage</h3>
<p>Voici le quatrième et dernier projet : soutenir une conversation fluide d'un quart d'heure en anglais. La fluidité ne vient pas d'un vocabulaire parfait, mais de trois réflexes : suivre une <strong>trame</strong>, savoir <strong>relancer</strong> l'autre, et combler les silences avec des <strong>gap-fillers</strong> plutôt que de se figer. C'est la synthèse orale de tout le cours.</p>
<h3>2. La trame d'une conversation</h3>
<pre class="pseudo">1. Small talk        Briser la glace.        "How's it going? Lovely weather today."
2. Se présenter      Parcours, intérêts.     "So, what do you do?"
3. Sujets & opinions Débattre, échanger.     "What do you think about...?"
4. Rebondir          Creuser un point.       "That's interesting — tell me more."
5. Clôturer          Conclure poliment.      "It's been great talking to you."</pre>
<h3>3. Les gap-fillers (combler un silence)</h3>
<p>Quand vous cherchez vos mots, ne restez PAS muet : utilisez un <strong>gap-filler</strong>. Il vous donne le temps de réfléchir et rend votre anglais naturel.</p>
<pre class="pseudo">Well...              Eh bien...
Let me think.        Laissez-moi réfléchir.
Actually,...         En fait,...
You know,...         Tu sais / vous savez,...
I mean,...           Je veux dire,...
The thing is,...     Le truc, c'est que...
How can I put it?    Comment dire ?
To be honest,...     Pour être honnête,...</pre>
<div class="warn">Fuyez le « euh » français : à l'oral anglais, il sonne étranger. Remplacez-le par <em>well…</em>, <em>you know…</em>, <em>I mean…</em>. Ces petits mots achètent du temps sans casser le rythme.</div>
<h3>4. Relancer et montrer qu'on écoute</h3>
<pre class="pseudo">Really? That's interesting.   Vraiment ? C'est intéressant.
Tell me more about that.      Dis-m'en plus.
What do you mean exactly?     Que veux-tu dire précisément ?
And what happened next?       Et ensuite ?
That makes sense.             Ça se tient.
I see what you mean.          Je vois ce que tu veux dire.
How about you?                Et toi ?</pre>
<p>Ces relances (<em>follow-up questions</em>) montrent votre intérêt et... vous font parler moins ! Une bonne conversation, c'est 50 % d'écoute active.</p>
<h3>5. Reformuler quand on ne comprend pas</h3>
<pre class="pseudo">Sorry, could you repeat that?     Pardon, pouvez-vous répéter ?
What do you mean by...?           Qu'entendez-vous par... ?
So, if I understand correctly,... Donc, si je comprends bien,...
In other words,...               Autrement dit,...</pre>
<div class="tip">Auto-bilan B2 à l'oral — cochez mentalement : (1) je relance l'autre avec des questions ; (2) j'emploie des gap-fillers au lieu de me bloquer ; (3) je nuance mes opinions (jours 17 et 24) ; (4) je reformule quand je ne comprends pas ; (5) je clôture poliment. Si vous faites ces cinq choses, vous tenez une conversation B2.</div>`,
  exercises: [
    { type: "qcm", q: "À quoi sert un gap-filler comme « well… » ?", opts: ["à conclure la conversation", "à gagner du temps sans rester muet", "à poser une question", "à corriger l'autre"], a: 1, exp: "Le gap-filler comble le silence pendant qu'on réfléchit." },
    { type: "qcm", q: "Quelle est la première étape d'une conversation ?", opts: ["la clôture", "le small talk (briser la glace)", "le débat d'opinions", "la reformulation"], a: 1, exp: "On commence toujours par un peu de small talk pour détendre l'échange." },
    { type: "input", q: "Complète une relance : « Really? Tell me ___ about that. » (davantage)", a: ["more"], ph: "un mot", exp: "Tell me more about that = dis-m'en plus." },
    { type: "qcm", q: "Pourquoi les relances (follow-up questions) sont-elles utiles ?", opts: ["Elles montrent l'intérêt et font parler l'autre", "Elles mettent fin à la conversation", "Elles sont impolies", "Elles n'ont aucun rôle"], a: 0, exp: "Elles prouvent l'écoute active et allègent votre temps de parole." },
    { type: "qcm", q: "Comment demander poliment de répéter ?", opts: ["What?", "Sorry, could you repeat that?", "Speak again", "I don't understand you"], a: 1, exp: "« Sorry, could you repeat that? » est poli et naturel." },
    { type: "vf", q: "Rester complètement silencieux quand on cherche ses mots est une bonne stratégie.", a: false, exp: "Mieux vaut un gap-filler (well…, you know…) qu'un silence gênant." },
    { type: "input", q: "Traduis le gap-filler « En fait,… » : « ___, … »", a: ["Actually"], ph: "un mot", exp: "Actually = en fait." },
    { type: "qcm", q: "« How about you? » sert à :", opts: ["clore le sujet", "renvoyer la question à l'autre personne", "s'excuser", "changer de langue"], a: 1, exp: "On relance en passant la parole : « et toi ? »." },
    { type: "qcm", q: "Pour reformuler ce qu'on a compris, on dit :", opts: ["In other words,…", "Goodbye", "That's wrong", "Never mind"], a: 0, exp: "« In other words,… / So, if I understand correctly,… » reformule." },
    { type: "qcm", q: "Quelle formule clôt poliment une conversation ?", opts: ["Whatever.", "It's been great talking to you.", "I'm bored.", "Stop talking."], a: 1, exp: "« It's been great talking to you » conclut chaleureusement." },
    { type: "input", q: "Complète le gap-filler : « ___ the thing is, I'm not sure. » (Eh bien)", a: ["Well"], ph: "un mot", exp: "Well, the thing is… = eh bien, le truc c'est que…" },
    { type: "qcm", q: "Selon l'auto-bilan B2, une bonne conversation, c'est environ :", opts: ["100 % parler soi-même", "50 % d'écoute active", "0 % d'écoute", "que du silence"], a: 1, exp: "L'équilibre parler / écouter est la marque d'un bon interlocuteur." },
    { type: "vf", q: "Employer « you know » ou « I mean » rend l'anglais plus naturel qu'un « euh » français.", a: true, exp: "Les gap-fillers anglais sonnent authentiques, contrairement au « euh »." },
    { type: "qcm", q: "« What do you mean by that? » sert à :", opts: ["insulter l'autre", "demander une clarification", "changer de sujet", "conclure"], a: 1, exp: "On demande poliment de préciser le sens." },
    { type: "qcm", q: "Quel réflexe N'appartient PAS à l'auto-bilan B2 oral ?", opts: ["relancer avec des questions", "employer des gap-fillers", "parler sans jamais laisser l'autre s'exprimer", "reformuler quand on ne comprend pas"], a: 2, exp: "Monopoliser la parole va contre la fluidité d'un vrai échange." }
  ],
  final: {
    title: "Exercice final — Analyser une conversation",
    intro: `<p>Lisez cet extrait de conversation entre Léa (L) et Sam (S) et repérez les techniques de fluidité.</p>
<p><em>S: Hi Léa! How's it going? — L: Pretty good, thanks. Busy week, though. How about you? — S: Same here, actually. So, I heard you started a new job? — L: Yes! Well, it's a bit scary, to be honest, but I'm enjoying it. — S: Oh, really? Tell me more. What do you do exactly? — L: I mean, it's mostly project management. The thing is, I've never led a team before. — S: That makes sense. It must be a steep learning curve. — L: Exactly! Anyway, I should get going. It's been great catching up. — S: You too! Let's grab a coffee soon.</em></p>`,
    questions: [
      { type: "qcm", q: "Comment la conversation commence-t-elle ?", opts: ["Par un débat", "Par du small talk (How's it going?)", "Par une dispute", "Par une clôture"], a: 1, exp: "« Hi Léa! How's it going? » : le small talk d'ouverture." },
      { type: "qcm", q: "Repérez un gap-filler employé par Léa :", opts: ["project management", "Well / to be honest / I mean / The thing is", "Hi", "coffee"], a: 1, exp: "Léa multiplie les gap-fillers (Well, to be honest, I mean, The thing is) pour rester fluide." },
      { type: "qcm", q: "Quelle relance Sam utilise-t-il pour faire parler Léa ?", opts: ["Goodbye", "Tell me more. What do you do exactly?", "Whatever", "Stop"], a: 1, exp: "« Tell me more » et « What do you do exactly? » sont des follow-up questions." },
      { type: "qcm", q: "Comment renvoient-ils la parole à l'autre au début ?", opts: ["How about you? / Same here", "In other words", "Goodbye", "What?"], a: 0, exp: "« How about you? » puis « Same here » équilibrent l'échange." },
      { type: "vf", q: "La conversation se clôt poliment, sans rupture brutale.", a: true, exp: "« I should get going… It's been great catching up… Let's grab a coffee soon » : clôture chaleureuse." }
    ],
    solution: `<p>Cette courte conversation contient tous les ingrédients de la fluidité B2. <strong>Small talk</strong> d'ouverture (<em>How's it going?</em>), <strong>renvoi de la parole</strong> (<em>How about you? / Same here</em>), <strong>gap-fillers</strong> en cascade chez Léa (<em>Well, to be honest, I mean, The thing is</em>) qui lui évitent tout blocage, <strong>relances</strong> de Sam qui montrent son écoute (<em>Oh, really? Tell me more. What do you do exactly?</em>), une <strong>réaction empathique</strong> (<em>That makes sense. It must be a steep learning curve</em>) et une <strong>clôture</strong> polie (<em>It's been great catching up. Let's grab a coffee soon</em>). Aucun des deux ne monopolise la parole : c'est un vrai ping-pong. Voilà votre objectif final — et la preuve que vous avez terminé le parcours B2. Bravo pour ces trente jours : vous parlez, lisez, débattez et comprenez désormais un anglais riche et nuancé.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en anglais…",
  items: [
  { id: "en-b2-j30", title: "Préparez votre monologue de présentation", level: 3,
    statement: "Pour lancer une conversation de 15 minutes, préparez EN ANGLAIS un monologue de présentation de vous-même (8 à 10 phrases) : qui vous êtes, votre parcours, vos centres d'intérêt, un projet ou une opinion. Employez au moins deux gap-fillers et une opinion nuancée (jour 17).",
    hints: [
      "Ouvrez simplement : « Well, let me introduce myself. » puis parcours et intérêts.",
      "Glissez des gap-fillers naturels : « you know », « I mean », « to be honest ».",
      "Terminez sur une opinion nuancée ou un projet : « I'd say that…, but… »."
    ],
    solution: "Well, let me introduce myself. My name is Camille, and I come from a small town near Lyon. I studied graphic design, and I've been working as a freelance designer for about three years now. To be honest, freelancing was scary at first, but I've come to love the freedom it gives me. In my free time, I really enjoy hiking and photography — you know, anything that gets me outdoors. These days, I'm trying to improve my English because I'd love to work with international clients. I'd say that learning a language as an adult is not easy, but it's incredibly rewarding. I mean, being able to have a real conversation like this already feels like a big achievement. Anyway, that's a little about me — I'd love to hear about you too.\n\nTraduction et notes : « Eh bien, laissez-moi me présenter. Je m'appelle Camille et je viens d'une petite ville près de Lyon. J'ai étudié le graphisme, et je travaille comme designer indépendante depuis environ trois ans. Pour être honnête, être à mon compte m'a fait peur au début, mais j'ai fini par adorer la liberté que cela m'offre. Pendant mon temps libre, j'aime beaucoup la randonnée et la photographie — tu sais, tout ce qui me fait sortir dehors. Ces temps-ci, j'essaie d'améliorer mon anglais car j'adorerais travailler avec des clients internationaux. Je dirais qu'apprendre une langue à l'âge adulte n'est pas facile, mais c'est incroyablement gratifiant. Je veux dire, pouvoir tenir une vraie conversation comme celle-ci me semble déjà être un bel accomplissement. Bref, voilà un peu qui je suis — j'aimerais beaucoup en apprendre sur toi aussi. » Remarquez les gap-fillers (Well, To be honest, you know, I mean, Anyway), l'opinion nuancée (I'd say that… not easy, but… rewarding) et la relance finale qui passe la parole.",
    note: "Un bon monologue de présentation se termine toujours en RENVOYANT la parole (« I'd love to hear about you »). C'est ainsi qu'un monologue devient une conversation. Vous êtes prêt : félicitations pour ces trente jours de niveau B2 !" }
  ]
};
</script>
