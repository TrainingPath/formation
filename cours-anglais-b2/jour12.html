<script>
var DAY = {
  num: 12,
  title: "Le registre : formel ou informel",
  subtitle: "Adapter son anglais à la situation : de l'e-mail pro au message entre amis.",
  theory: `
<h3>1. Pourquoi le registre compte</h3>
<p>Le <strong>registre</strong> est le niveau de langue adapté à une situation. Dire « Hey, wanna grab a coffee? » à un recruteur ou « I am writing to formally request… » à un ami sonne également faux. Un anglophone juge très vite votre maîtrise à votre capacité à ajuster le ton. Trois grands registres coexistent : <strong>formel</strong>, <strong>neutre</strong> et <strong>informel</strong>.</p>
<h3>2. Ce qui change d'un registre à l'autre</h3>
<pre class="pseudo">FORMEL            NEUTRE             INFORMEL
I would like to   I want to          I wanna
request           ask for            get
purchase          buy                grab / get
assist            help               give a hand
inform you        tell you           let you know
however           but                but / though
children          children/kids      kids</pre>
<div class="tip">Le formel privilégie les mots d'origine latine (purchase, request, assist), l'informel les mots courts d'origine germanique et les phrasal verbs (buy, ask for, help out).</div>
<h3>3. Contractions et abréviations</h3>
<p>Les <strong>contractions</strong> (I'm, don't, we'll) sont normales à l'oral et dans l'écrit informel, mais on les évite dans l'écrit très formel (rapports, lettres officielles).</p>
<pre class="pseudo">Informel : I'm afraid I can't make it. It's a shame.
Formel   : I am afraid I will not be able to attend. It is regrettable.</pre>
<div class="warn">Le langage SMS (u, ur, gonna, wanna, thx, btw) est réservé aux messages entre proches. Il est totalement proscrit dans un contexte professionnel ou académique.</div>
<h3>4. Politesse et formules indirectes</h3>
<p>Le formel adoucit les demandes par des tournures indirectes et modales. Plus c'est direct, plus c'est informel (voire impoli dans un cadre pro).</p>
<pre class="pseudo">Direct/informel : Send me the report.
Neutre : Can you send me the report?
Formel/poli : Could you possibly send me the report?
Tres formel : I would be grateful if you could send me the report.</pre>
<pre class="pseudo">Would you mind sending me the file? -> Cela vous derangerait-il d'envoyer le fichier ?
I was wondering if you could help. -> Je me demandais si vous pourriez m'aider.</pre>
<h3>5. Structure d'un e-mail selon le registre</h3>
<pre class="pseudo">FORMEL
Salutation : Dear Mr Smith, / Dear Sir or Madam,
Ouverture : I am writing to enquire about ...
Cloture : I look forward to hearing from you.
Signature : Yours sincerely, (nom connu) / Yours faithfully, (nom inconnu)

INFORMEL
Salutation : Hi Sam, / Hey there,
Ouverture : Just a quick note to ...
Cloture : Talk soon! / Take care!
Signature : Cheers, / Best, / All the best,</pre>
<div class="warn">Règle britannique classique : « Yours faithfully » quand on ignore le nom (Dear Sir or Madam), « Yours sincerely » quand on le connaît (Dear Mr Smith). Ne les inverse pas.</div>
<h3>6. Éviter deux pièges</h3>
<p><strong>Ne pas être trop formel entre amis</strong> (ça paraît froid ou pompeux) ni <strong>trop familier au travail</strong> (ça paraît irrespectueux). Le neutre est souvent le refuge le plus sûr quand on hésite.</p>
<pre class="pseudo">A un ami : Thanks a lot! You're a lifesaver.
A un client : Thank you very much for your assistance.
A un collegue (neutre) : Thanks for your help, much appreciated.</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle formule est la plus formelle ?", opts: ["Send me the report.", "Can you send me the report?", "I would be grateful if you could send me the report.", "Send it over!"], a: 2, exp: "« I would be grateful if you could… » est la tournure la plus polie et formelle." },
    { type: "input", q: "Donne l'équivalent FORMEL de « buy » (un seul mot d'origine latine).", a: ["purchase"], ph: "un verbe", exp: "purchase = acheter, registre formel." },
    { type: "qcm", q: "Dans un e-mail à « Dear Sir or Madam », comment signer ?", opts: ["Yours sincerely", "Yours faithfully", "Cheers", "Take care"], a: 1, exp: "Nom inconnu (Dear Sir or Madam) -> Yours faithfully." },
    { type: "vf", q: "On peut utiliser « wanna » et « gonna » dans une lettre de motivation.", a: false, exp: "Le langage informel/SMS est proscrit dans un écrit professionnel." },
    { type: "qcm", q: "Quelle phrase est INFORMELLE ?", opts: ["I am writing to inform you...", "Just a quick note to let you know...", "I would like to request...", "I look forward to hearing from you."], a: 1, exp: "« Just a quick note to let you know » est typiquement informel." },
    { type: "input", q: "Rends plus formel : « I want to ask for a refund. » Remplace « want to » par…", a: ["would like to"], ph: "trois mots", exp: "« I would like to request a refund » : plus formel." },
    { type: "qcm", q: "Après « Dear Mr Brown », la clôture correcte est…", opts: ["Yours faithfully", "Yours sincerely", "Bye", "Later"], a: 1, exp: "Nom connu -> Yours sincerely." },
    { type: "qcm", q: "Quelle demande est la plus polie/indirecte ?", opts: ["Help me.", "Can you help?", "I was wondering if you could help me.", "Help!"], a: 2, exp: "« I was wondering if you could… » est la tournure la plus indirecte et polie." },
    { type: "vf", q: "Le registre formel privilégie les mots d'origine latine comme « assist » ou « request ».", a: true, exp: "Formel = latin (assist, request, purchase) ; informel = germanique + phrasal verbs." },
    { type: "input", q: "Équivalent NEUTRE/informel du formel « I would like to inform you ». « I just wanted to ___ you know. »", a: ["let"], ph: "un verbe", exp: "let you know = informer, registre neutre/informel." },
    { type: "qcm", q: "Quelle formule convient pour terminer un message à un ami ?", opts: ["Yours faithfully", "I remain at your disposal", "Take care! / Cheers!", "I look forward to your prompt reply"], a: 2, exp: "Take care / Cheers sont informels, parfaits entre amis." },
    { type: "qcm", q: "« Would you mind ___ the door? » Quelle forme ?", opts: ["to close", "closing", "close", "closed"], a: 1, exp: "Would you mind + -ing : closing. Tournure polie." },
    { type: "vf", q: "Les contractions (I'm, don't) sont recommandées dans un rapport officiel.", a: false, exp: "Dans l'écrit très formel, on préfère les formes pleines (I am, do not)." },
    { type: "input", q: "Rends formel : « Thanks a lot! » -> « Thank you very much for your ___. »", a: ["assistance", "help", "support"], ph: "un nom", exp: "« Thank you very much for your assistance » : version formelle." },
    { type: "qcm", q: "Si tu hésites sur le registre au travail, lequel est le plus sûr ?", opts: ["Le plus familier possible", "Le neutre", "Le langage SMS", "Le plus pompeux possible"], a: 1, exp: "Le neutre est le refuge le plus sûr en cas de doute." }
  ],
  final: {
    title: "Exercice final — Deux versions d'un même message",
    intro: `<p>Below is the same request written in two registers. Read both and compare.</p>
<p><strong>Version A (formal):</strong> Dear Ms Carter, I am writing to enquire whether it would be possible to reschedule our meeting, originally planned for Thursday. Unfortunately, an unforeseen commitment has arisen, and I would be most grateful if we could arrange an alternative time. Please accept my sincere apologies for any inconvenience this may cause. I look forward to your reply. Yours sincerely, Daniel Ross.</p>
<p><strong>Version B (informal):</strong> Hi Emma, Just a quick note - any chance we could move Thursday's meeting? Something's come up and I can't make it. Really sorry for the hassle! Let me know what works for you. Cheers, Dan.</p>`,
    questions: [
      { type: "qcm", q: "Quel élément marque le registre FORMEL de la version A ?", opts: ["« Hi Emma »", "« I am writing to enquire whether it would be possible »", "« Something's come up »", "« Cheers »"], a: 1, exp: "La tournure indirecte et développée est typiquement formelle." },
      { type: "vf", q: "« Something's come up and I can't make it » (version B) contient des contractions typiques de l'informel.", a: true, exp: "Something's, can't : contractions normales en registre informel." },
      { type: "qcm", q: "Pourquoi « Yours sincerely » dans la version A ?", opts: ["Le nom du destinataire est inconnu", "Le nom (Ms Carter) est connu", "C'est une erreur", "C'est informel"], a: 1, exp: "Nom connu (Ms Carter) -> Yours sincerely (pas faithfully)." },
      { type: "qcm", q: "L'équivalent informel de « an unforeseen commitment has arisen » est…", opts: ["I look forward to your reply", "Something's come up", "Please accept my apologies", "I am writing to enquire"], a: 1, exp: "« Something's come up » = version familière de « un imprévu est survenu »." },
      { type: "qcm", q: "Quelle clôture appartient au registre informel ?", opts: ["Yours sincerely", "I look forward to your reply", "Cheers, Dan", "Please accept my sincere apologies"], a: 2, exp: "« Cheers » est une clôture informelle." }
    ],
    solution: `<p>Les deux versions disent la même chose dans des registres opposés :</p>
<pre class="pseudo">FORMEL (A)                          INFORMEL (B)
Dear Ms Carter,                     Hi Emma,
I am writing to enquire whether ... Just a quick note - any chance ...
an unforeseen commitment has arisen Something's come up
I would be most grateful if ...     could we move ...?
Please accept my sincere apologies  Really sorry for the hassle!
I look forward to your reply.       Let me know what works for you.
Yours sincerely, Daniel Ross        Cheers, Dan</pre>
<p>Le formel : formes pleines, vocabulaire latin, tournures indirectes, nom complet. L'informel : contractions, phrasal verbs (come up), abréviations amicales, prénom. Savoir passer de l'un à l'autre selon le destinataire est une compétence B2 essentielle.</p>`
  }
};
</script>

    solution: "FORMAL:\nDear Mr Lewis,\nI am writing to ask whether it might be possible to postpone our appointment scheduled for Friday. An urgent matter has arisen at work, and I would be most grateful if we could arrange another date at your convenience. Please accept my apologies for any inconvenience. I look forward to hearing from you.\nYours sincerely,\nJulie Martin\n\nINFORMAL:\nHi Kate,\nJust a quick message - is there any chance we could move Friday's plan? Something urgent has come up at work and I can't make it. So sorry about that! Let me know when suits you.\nTake care,\nJulie\n\nTraduction (formel) : Cher M. Lewis, Je vous ecris pour savoir s'il serait possible de reporter notre rendez-vous prevu vendredi. Une affaire urgente est survenue au travail, et je vous serais tres reconnaissante de pouvoir convenir d'une autre date a votre convenance. Veuillez accepter mes excuses pour la gene occasionnee. Dans l'attente de votre reponse. Cordialement, Julie Martin.\nTraduction (informel) : Salut Kate, Juste un petit mot - y a-t-il moyen de decaler notre plan de vendredi ? Un imprevu urgent est arrive au travail et je ne peux pas venir. Vraiment desolee ! Dis-moi quand ca t'arrange. Prends soin de toi, Julie.",
