<script>
var DAY = {
  num: 17,
  title: "Débattre : nuancer et concéder",
  subtitle: "Défendre son point de vue sans agresser : concéder, puis rebondir.",
  theory: `
<h3>1. L'art de la concession</h3>
<p>Au niveau B2, débattre ne signifie pas écraser l'adversaire, mais <strong>reconnaître ce qui est juste chez lui</strong> avant de défendre son propre point de vue. Cette technique, la <strong>concession</strong>, rend un argument plus crédible et plus poli. Le schéma est simple : « Certes X (concession)… mais Y (contre-argument) ». En anglais : <em>Admittedly, X… but Y</em>.</p>
<h3>2. Concéder : reconnaître le point adverse</h3>
<pre class="pseudo">Admittedly, ...          Certes, ...
I can see your point.    Je comprends votre point de vue.
That may be true, but... C'est peut-être vrai, mais...
Granted, ...             Je vous l'accorde, ...
To some extent, ...      Dans une certaine mesure, ...
There is some truth in that. Il y a du vrai là-dedans.</pre>
<h3>3. Rebondir : introduire son objection</h3>
<pre class="pseudo">However, ...             Cependant, ...
Nevertheless, ...        Néanmoins, ...
On the other hand, ...   D'un autre côté, ...
Having said that, ...    Ceci dit, ...
That said, ...           Cela dit, ...
Even so, ...             Malgré tout, ...</pre>
<div class="warn">Ne confondez pas <em>however</em> (cependant, adverbe) et <em>but</em> (mais, conjonction). <em>However</em> commence souvent une phrase et se sépare par une virgule : <em>However, I disagree.</em> On n'écrit pas « But, I disagree ».</div>
<h3>4. Nuancer : éviter les affirmations trop tranchées</h3>
<p>Un anglophone cultivé <strong>adoucit</strong> ses affirmations (on parle de <em>hedging</em>). Au lieu de <em>This is wrong</em>, on dira <em>This might not be entirely accurate</em>. Les outils de la nuance :</p>
<pre class="pseudo">It could be argued that...   On pourrait soutenir que...
It seems that...             Il semble que...
To a certain degree...       Dans une certaine mesure...
tend to / generally          avoir tendance à / en général
arguably                     sans doute / on peut le soutenir
not necessarily              pas forcément</pre>
<h3>5. Un échange modèle</h3>
<p><em>— Working from home makes people lazy.</em> (« Le télétravail rend les gens paresseux. »)<br>
<em>— I can see your point, and admittedly some people do get distracted at home. However, studies suggest that most employees are actually more productive. That said, it probably depends on the type of job.</em></p>
<p>Traduction : « Je comprends votre point de vue, et certes, certaines personnes se laissent distraire chez elles. Cependant, des études suggèrent que la plupart des employés sont en réalité plus productifs. Cela dit, cela dépend sans doute du type d'emploi. »</p>
<div class="tip">La structure gagnante d'un débat B2 : <strong>concéder → objecter → nuancer</strong>. Elle montre que vous écoutez, que vous pensez, et que vous restez ouvert.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle expression sert à CONCÉDER un point ?", opts: ["However", "Admittedly", "Even so", "Nevertheless"], a: 1, exp: "Admittedly = « certes », reconnaît la validité partielle de l'autre avis." },
    { type: "qcm", q: "Quel mot introduit une OBJECTION après une concession ?", opts: ["Granted", "Admittedly", "However", "To some extent"], a: 2, exp: "However = « cependant », marque le contraste et l'objection." },
    { type: "vf", q: "En anglais soigné, on peut commencer une phrase par « But, ».", a: false, exp: "But est une conjonction qui relie deux propositions ; en tête de phrase avec virgule, on utilise However." },
    { type: "input", q: "Complète la concession : « ___, some people do get distracted at home. » (Certes)", a: ["Admittedly", "Granted"], ph: "un mot", exp: "Admittedly / Granted = « certes »." },
    { type: "qcm", q: "Que signifie le <em>hedging</em> ?", opts: ["Attaquer l'adversaire", "Adoucir une affirmation pour la nuancer", "Répéter son argument", "Changer de sujet"], a: 1, exp: "Hedging = nuancer, éviter les affirmations trop catégoriques." },
    { type: "qcm", q: "Version la plus nuancée de « This is false » :", opts: ["This is totally false", "This might not be entirely accurate", "This is a lie", "You are wrong"], a: 1, exp: "« might not be entirely accurate » adoucit et reste ouvert au dialogue." },
    { type: "input", q: "Complète : « It could be ___ that remote work saves time. » (soutenu / avancé)", a: ["argued"], ph: "un verbe", exp: "It could be argued that… = « on pourrait soutenir que ». " },
    { type: "qcm", q: "<em>Having said that</em> sert à :", opts: ["conclure définitivement", "introduire une nuance ou une réserve", "poser une question", "remercier"], a: 1, exp: "Having said that / That said = « ceci dit », introduit une réserve." },
    { type: "vf", q: "<em>To some extent</em> signifie « totalement, sans réserve ».", a: false, exp: "To some extent = « dans une certaine mesure », donc partiellement, pas totalement." },
    { type: "qcm", q: "Quel adverbe signifie « sans doute / on peut le soutenir » ?", opts: ["arguably", "obviously", "definitely", "clearly"], a: 0, exp: "Arguably nuance : « on peut soutenir que », contrairement à obviously (évidemment)." },
    { type: "qcm", q: "Ordre correct d'un argument B2 équilibré :", opts: ["objecter → concéder → nuancer", "concéder → objecter → nuancer", "nuancer → nuancer → nuancer", "attaquer → conclure"], a: 1, exp: "On reconnaît d'abord (concession), on objecte, puis on nuance : poli et convaincant." },
    { type: "input", q: "Complète : « I can see your ___, but I still disagree. » (point de vue)", a: ["point"], ph: "un mot", exp: "I can see your point = je comprends votre point de vue." },
    { type: "qcm", q: "<em>Nevertheless</em> est le plus proche synonyme de :", opts: ["therefore", "however", "because", "for example"], a: 1, exp: "Nevertheless ≈ however ≈ néanmoins / cependant." },
    { type: "vf", q: "Concéder un point avant d'objecter rend l'argument plus crédible.", a: true, exp: "Montrer qu'on a écouté l'adversaire renforce la persuasion." },
    { type: "qcm", q: "Meilleure reformulation nuancée de « Everyone hates meetings » :", opts: ["Nobody likes meetings, ever", "People tend to find meetings unproductive", "Meetings are the worst thing on earth", "Meetings are illegal"], a: 1, exp: "« tend to » évite la généralisation absolue : c'est du hedging." }
  ],
  final: {
    title: "Exercice final — Un débat sur les smartphones à l'école",
    intro: `<p>Lisez cette intervention dans un débat, puis répondez.</p>
<p><em>Some people argue that smartphones should be banned in schools completely. Admittedly, phones can be a serious distraction, and there is some truth in the claim that they harm concentration. However, banning them entirely may not be the best solution. It could be argued that students also need to learn how to use technology responsibly. That said, a partial ban during lessons might be a sensible compromise. Nevertheless, whatever rule is chosen, it should be discussed with the students themselves.</em></p>`,
    questions: [
      { type: "qcm", q: "Quelle concession l'auteur fait-il ?", opts: ["Les téléphones ne distraient jamais", "Les téléphones peuvent être une vraie distraction", "L'école est inutile", "Les élèves détestent la technologie"], a: 1, exp: "« Admittedly, phones can be a serious distraction » : c'est la concession." },
      { type: "qcm", q: "Quelle est la position réelle de l'auteur sur l'interdiction totale ?", opts: ["Il y est favorable", "Il pense que ce n'est pas la meilleure solution", "Il n'a pas d'avis", "Il veut supprimer l'école"], a: 1, exp: "« banning them entirely may not be the best solution » : il nuance et s'y oppose." },
      { type: "qcm", q: "Quel compromis propose-t-il ?", opts: ["Une interdiction totale", "Une interdiction partielle pendant les cours", "Aucune règle", "Interdire l'école"], a: 1, exp: "« a partial ban during lessons might be a sensible compromise »." },
      { type: "vf", q: "L'auteur pense que la règle devrait être imposée sans consulter les élèves.", a: false, exp: "« it should be discussed with the students themselves » : il veut au contraire les consulter." },
      { type: "qcm", q: "Quel connecteur introduit l'objection principale au début ?", opts: ["Admittedly", "However", "That said", "Nevertheless"], a: 1, exp: "« However, banning them entirely may not be the best solution » : le pivot du raisonnement." }
    ],
    solution: `<p>Ce texte est un modèle de débat nuancé. Il suit exactement le schéma <strong>concession → objection → nuance</strong>. La concession (<em>Admittedly… there is some truth</em>) désarme l'adversaire ; l'objection (<em>However… may not be the best solution</em>) défend la position ; les nuances (<em>It could be argued, That said, might be, Nevertheless</em>) évitent tout ton catégorique. Remarquez qu'aucune affirmation n'est absolue : tout est adouci par <em>may, might, could</em>. C'est cette prudence qui donne au propos son autorité : on a l'impression d'un esprit qui pèse le pour et le contre plutôt que d'un donneur de leçons.</p>`
  }
};
</script>

      "Commencez par concéder un point valable : « Admittedly, social media can… ».",

    solution: "Admittedly, social media can be harmful for young people: it can affect their sleep and their self-esteem. There is some truth in the idea that teenagers spend too much time on their phones. However, banning social media completely would not solve the problem, and it could be argued that these platforms also help young people stay connected and learn new things. That said, the effects probably depend on how the technology is used. Nevertheless, teaching young people to use social media responsibly seems more useful than simply blaming it.\n\nTraduction et notes : « Certes, les réseaux sociaux peuvent être nuisibles pour les jeunes : ils peuvent affecter leur sommeil et leur estime de soi. Il y a du vrai dans l'idée que les adolescents passent trop de temps sur leur téléphone. Cependant, interdire complètement les réseaux ne résoudrait pas le problème, et on pourrait soutenir que ces plateformes aident aussi les jeunes à rester connectés et à apprendre. Cela dit, les effets dépendent sans doute de la façon dont on utilise la technologie. Néanmoins, apprendre aux jeunes à s'en servir de façon responsable semble plus utile que de simplement l'accuser. » Repérez la structure : concession (Admittedly) → objection (However) → nuances (could be argued, probably, Nevertheless).",
