<script>
var DAY = {
  num: 6,
  title: "L'inversion (hardly, never, not only...)",
  subtitle: "Placer une expression négative en tête pour un effet emphatique et soutenu.",
  theory: `
<h3>1. Qu'est-ce que l'inversion ?</h3>
<p>Normalement, l'anglais suit l'ordre sujet + verbe. Mais dans un registre <strong>soutenu, littéraire ou rhétorique</strong>, on peut placer en tête de phrase une expression négative ou restrictive. Il faut alors <strong>inverser</strong> le sujet et l'auxiliaire, exactement comme dans une question.</p>
<pre class="pseudo">Ordre normal : I have never seen such a mess.
Inversion    : Never have I seen such a mess.
-> Jamais je n'ai vu un tel desordre.</pre>
<div class="tip">L'inversion n'est jamais obligatoire : c'est un choix de style qui donne du relief et de la solennité. On la trouve dans les discours, la littérature et l'écrit formel.</div>
<h3>2. Le mécanisme : comme une question</h3>
<p>On applique la même mécanique que pour poser une question : on utilise <em>do/does/did</em> si le verbe n'a pas déjà d'auxiliaire.</p>
<pre class="pseudo">She rarely complains.  -> Rarely does she complain.
He little knew the truth. -> Little did he know the truth.
   (-> Il etait loin de se douter de la verite.)
They had no sooner arrived than it started to rain.
   -> No sooner had they arrived than it started to rain.</pre>
<h3>3. Les déclencheurs négatifs et restrictifs</h3>
<p>L'inversion se produit quand on place en tête l'un de ces mots ou expressions à sens négatif ou restrictif :</p>
<pre class="pseudo">Never / Rarely / Seldom / Hardly / Scarcely / Little
Not only ... (but also)
No sooner ... than
Under no circumstances / At no time / On no account
Not until ... / Only then / Only after / Only when</pre>
<div class="warn">L'inversion touche l'AUXILIAIRE, pas le verbe principal. On dit « Never <strong>have</strong> I seen », jamais « Never saw I ». Avec un verbe simple, on introduit do/does/did : « Rarely <strong>does</strong> he speak ».</div>
<h3>4. Not only ... but also</h3>
<p>Quand une phrase commence par <em>Not only</em>, on inverse dans la première partie ; la seconde (but also) garde souvent l'ordre normal.</p>
<pre class="pseudo">Not only did she win the race, but she also broke the record.
-> Non seulement elle a gagne la course, mais elle a aussi battu le record.
Not only is he talented, but he is also humble.
-> Non seulement il est doue, mais il est aussi modeste.</pre>
<h3>5. No sooner ... than / Hardly ... when</h3>
<p>Ces structures expriment qu'une action suit immédiatement une autre. Attention aux conjonctions : <em>no sooner</em> va avec <em>than</em>, <em>hardly / scarcely</em> avec <em>when</em>.</p>
<pre class="pseudo">No sooner had I sat down than the phone rang.
-> A peine m'etais-je assis que le telephone a sonne.
Hardly had she left when it began to snow.
-> A peine etait-elle partie qu'il se mit a neiger.</pre>
<h3>6. Only et les compléments en tête</h3>
<p>Les expressions avec <em>only</em> (only then, only after, only when, only by) déclenchent aussi l'inversion, car elles ont une valeur restrictive.</p>
<pre class="pseudo">Only after the meeting did I understand the plan.
-> Ce n'est qu'apres la reunion que j'ai compris le plan.
Only by working together can we succeed.
-> Ce n'est qu'en travaillant ensemble que nous pouvons reussir.</pre>
<div class="warn">Ne confonds pas : « Only John knows » (sujet = only John, PAS d'inversion) et « Only then did John know » (complément en tête = inversion). L'inversion suit une expression adverbiale, pas un sujet.</div>`,
  exercises: [
    { type: "qcm", q: "Réécris avec inversion : « I have never eaten such good food. »", opts: ["Never I have eaten such good food.", "Never have I eaten such good food.", "Never ate I such good food.", "Never did I have eaten such good food."], a: 1, exp: "Never + auxiliaire (have) + sujet + participe : Never have I eaten." },
    { type: "input", q: "Complète : « Rarely ___ he apologise. » (verbe simple, présent)", a: ["does"], ph: "auxiliaire", exp: "Verbe simple au présent : on introduit does. Rarely does he apologise." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Seldom she goes out.", "Seldom does she go out.", "Seldom goes she out.", "Seldom she does go out."], a: 1, exp: "Seldom + does + sujet + base : Seldom does she go out." },
    { type: "input", q: "Complète : « No sooner had we arrived ___ the storm began. »", a: ["than"], ph: "un mot", exp: "No sooner s'accompagne de « than »." },
    { type: "qcm", q: "« Hardly had she spoken ___ everyone fell silent. »", opts: ["than", "when", "that", "then"], a: 1, exp: "Hardly / scarcely s'accompagnent de « when »." },
    { type: "vf", q: "« Never saw I such beauty » est la forme correcte de l'inversion.", a: false, exp: "L'inversion porte sur l'auxiliaire : « Never have I seen » (ou did I see), pas sur le verbe principal." },
    { type: "qcm", q: "Réécris : « She not only sings but also dances. » -> « Not only ___ »", opts: ["she sings, but she also dances", "does she sing, but she also dances", "sings she, but dances she", "she does sing, but also dances"], a: 1, exp: "Not only + does + sujet + base : Not only does she sing, but she also dances." },
    { type: "input", q: "Complète : « Little ___ he know that his life was about to change. »", a: ["did"], ph: "auxiliaire passé", exp: "Little did he know : formule figée, inversion avec did." },
    { type: "qcm", q: "« Only after the exam ___ I relax. »", opts: ["could", "I could", "did could", "can"], a: 0, exp: "Only after + complément -> inversion : Only after the exam could I relax." },
    { type: "vf", q: "« Only John knows the answer » comporte une inversion.", a: false, exp: "« Only John » est le sujet : pas d'inversion. L'inversion suit une expression adverbiale, pas un sujet." },
    { type: "qcm", q: "« Under no circumstances ___ you open this door. »", opts: ["must", "you must", "must you", "do must"], a: 2, exp: "Expression négative en tête -> inversion : must you." },
    { type: "input", q: "Complète : « Not until midnight ___ the guests leave. » (auxiliaire passé)", a: ["did"], ph: "auxiliaire", exp: "Not until + complément -> inversion : did the guests leave." },
    { type: "qcm", q: "Pourquoi employer l'inversion dans un discours ?", opts: ["C'est obligatoire", "Pour créer un effet emphatique et soutenu", "Pour raccourcir la phrase", "Pour éviter le passif"], a: 1, exp: "L'inversion relève du style : elle met en relief et donne de la solennité." },
    { type: "qcm", q: "« Only by practising ___ you improve. »", opts: ["will", "you will", "will you", "do will"], a: 2, exp: "Only by + complément -> inversion : will you improve." },
    { type: "vf", q: "« Not only is he clever, but he is also kind » utilise correctement l'inversion après Not only.", a: true, exp: "Not only + is (auxiliaire) + he : inversion correcte ; la 2e partie garde l'ordre normal." }
  ],
  final: {
    title: "Exercice final — Un extrait de discours solennel",
    intro: `<p>Read this formal speech excerpt, rich in inversions.</p>
<p>Never before have we faced a challenge of this magnitude. Rarely does a generation stand at such a decisive crossroads. Not only must we act quickly, but we must also act wisely. No sooner had the crisis begun than ordinary citizens rose to help their neighbours. Little did those early volunteers know how deeply their courage would inspire a nation. Under no circumstances will we abandon those who depend on us. Only by uniting our efforts can we hope to succeed. Hardly had the first reforms passed when critics predicted their failure, yet here we stand, stronger than ever. Not until every family feels safe will our work be complete. Seldom in our history has so much depended on the choices we make today.</p>`,
    questions: [
      { type: "qcm", q: "« Never before have we faced » : pourquoi « have we » ?", opts: ["Erreur", "Inversion : after negative in front, auxiliaire + sujet", "C'est une question", "have est le verbe principal"], a: 1, exp: "Le déclencheur négatif « Never before » impose l'inversion auxiliaire + sujet." },
      { type: "qcm", q: "« No sooner had the crisis begun ___ citizens rose to help. »", opts: ["when", "than", "that", "then"], a: 1, exp: "No sooner ... than : la conjonction correcte est than." },
      { type: "vf", q: "« Little did those volunteers know » signifie qu'ils ignoraient l'ampleur de leur impact.", a: true, exp: "« Little did X know » = X était loin de se douter." },
      { type: "qcm", q: "« Only by uniting our efforts can we hope » : que déclenche « Only by » ?", opts: ["rien", "une inversion (can we)", "un passif", "un conditionnel"], a: 1, exp: "L'expression restrictive « Only by » en tête déclenche l'inversion : can we hope." },
      { type: "qcm", q: "« Not until every family feels safe will our work be complete » : où se place l'inversion ?", opts: ["dans « every family feels »", "dans la principale : will our work be", "il n'y en a pas", "dans « feels safe »"], a: 1, exp: "L'inversion touche la proposition principale (will our work be), pas la subordonnée après not until." }
    ],
    solution: `<p>Le discours enchaîne les déclencheurs d'inversion pour créer une emphase solennelle :</p>
<pre class="pseudo">Never before have we ... / Rarely does a generation ... / Seldom ... has so much depended
   -> adverbes negatifs/restrictifs + inversion
Not only must we act, but we must also ...  -> Not only + inversion
No sooner had ... than ... / Hardly had ... when ...  -> succession immediate
Under no circumstances will we ... / Not until ... will our work be  -> restrictions fortes
Only by uniting ... can we hope  -> only + complement + inversion</pre>
<p>Remarque que l'inversion frappe toujours l'auxiliaire (have, does, must, will, can, had). C'est un outil de rhétorique : il donne du poids et de la gravité au propos.</p>`
  }
};
</script>
