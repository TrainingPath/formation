<script>
var DAY = {
  num: 3,
  title: "Les conditionnels mixtes",
  subtitle: "Quand la condition et la conséquence n'appartiennent pas à la même époque.",
  theory: `
<h3>1. Rappel : les trois conditionnels classiques</h3>
<p>Avant les conditionnels mixtes, révisons les trois « purs ». Chacun relie une condition (proposition en <em>if</em>) à une conséquence.</p>
<pre class="pseudo">TYPE 1 (reel, futur) : If + present, ... will + base
  If it rains, we will stay home. -> S'il pleut, on restera a la maison.
TYPE 2 (irreel, present) : If + preterit, ... would + base
  If I had time, I would help you. -> Si j'avais le temps, je t'aiderais.
TYPE 3 (irreel, passe) : If + past perfect, ... would have + participe
  If I had known, I would have called. -> Si j'avais su, j'aurais appele.</pre>
<div class="warn">Après <em>if</em> irréel, jamais de <em>would</em> : on dit « If I had time » et non « If I would have time ». Le <em>would</em> reste dans la principale.</div>
<h3>2. Le principe du conditionnel mixte</h3>
<p>Un <strong>conditionnel mixte</strong> combine deux époques différentes : la condition appartient à une période, la conséquence à une autre. On mélange donc les morceaux du type 2 et du type 3. Deux combinaisons sont fréquentes.</p>
<h3>3. Mixte A : condition passée, conséquence présente</h3>
<p>Une action irréelle du <strong>passé</strong> aurait une conséquence <strong>actuelle</strong>. On prend le <em>if</em> du type 3 (past perfect) et la principale du type 2 (would + base).</p>
<pre class="pseudo">If + past perfect, ... would + base
If I had studied medicine, I would be a doctor now.
-> Si j'avais fait medecine, je serais medecin aujourd'hui.
If she had saved money, she wouldn't be in debt today.
-> Si elle avait economise, elle ne serait pas endettee aujourd'hui.</pre>
<div class="tip">Repère les marqueurs : <em>now, today, still</em> dans la conséquence trahissent souvent un présent, donc un mixte (condition passée -> effet présent).</div>
<h3>4. Mixte B : condition présente, conséquence passée</h3>
<p>Une situation <strong>permanente ou présente</strong> explique un résultat <strong>passé</strong>. On prend le <em>if</em> du type 2 (prétérit) et la principale du type 3 (would have + participe).</p>
<pre class="pseudo">If + preterit, ... would have + participe passe
If I were more organised, I would have finished on time.
-> Si j'etais plus organise, j'aurais fini a temps.
If he weren't so shy, he would have introduced himself.
-> S'il n'etait pas si timide, il se serait presente.</pre>
<div class="tip">Ici, la condition décrit un trait durable (être organisé, être timide), vrai hier comme aujourd'hui, mais on en tire une conséquence sur un événement passé.</div>
<h3>5. Choisir le bon mélange</h3>
<p>Pose-toi deux questions : <strong>quand se situe la condition ?</strong> et <strong>quand se situe la conséquence ?</strong> Puis assemble le bon morceau de chaque côté.</p>
<pre class="pseudo">Condition passee + consequence presente  -> If had done ... would do
Condition presente + consequence passee  -> If did ... would have done</pre>
<div class="warn">Ne confonds pas <em>were</em> subjonctif. À l'irréel, on emploie souvent <em>were</em> à toutes les personnes : « If I were you… » (Si j'étais toi…), plus soutenu que « If I was ».</div>`,
  exercises: [
    { type: "qcm", q: "« If I had taken that job, I ___ in London now. » Quelle conséquence ?", opts: ["would live", "would have lived", "will live", "lived"], a: 0, exp: "Condition passée (had taken) + effet présent (now) : mixte A, would live." },
    { type: "qcm", q: "« If she weren't so busy, she ___ us last weekend. »", opts: ["would join", "would have joined", "will join", "joined"], a: 1, exp: "Condition présente/durable (weren't) + effet passé (last weekend) : mixte B, would have joined." },
    { type: "input", q: "Complète : « If I ___ (not eat) so much earlier, I wouldn't feel sick now. »", a: ["hadn't eaten", "had not eaten"], ph: "past perfect négatif", exp: "Mixte A : condition passée (hadn't eaten) -> effet présent (now)." },
    { type: "vf", q: "« If I would have known, I would have come » est correct.", a: false, exp: "Jamais de « would » après if : « If I had known, I would have come »." },
    { type: "qcm", q: "« If he were taller, he ___ the basketball team last year. »", opts: ["would join", "would have joined", "joined", "will join"], a: 1, exp: "Trait durable (were taller) + événement passé (last year) : mixte B." },
    { type: "input", q: "Complète : « If we had left earlier, we ___ (be) at the beach by now. »", a: ["would be", "'d be"], ph: "would + base", exp: "Condition passée + conséquence présente (by now) : would be." },
    { type: "qcm", q: "Quel marqueur signale souvent un mixte A (effet présent) ?", opts: ["yesterday", "now / today", "last year", "in 2010"], a: 1, exp: "« now / today » situent la conséquence au présent malgré une condition passée." },
    { type: "input", q: "Complète : « If I ___ (be) more careful, I wouldn't have lost my keys. »", a: ["were", "was"], ph: "un mot", exp: "Trait durable au présent (were careful) + effet passé : mixte B." },
    { type: "vf", q: "« If I had studied harder, I would be a lawyer now » mélange une condition passée et une conséquence présente.", a: true, exp: "C'est exactement le mixte A : past perfect dans le if, would + base dans la principale." },
    { type: "qcm", q: "Choisis : « If she spoke French, she ___ that job in Paris last month. »", opts: ["would get", "would have got", "got", "will get"], a: 1, exp: "Compétence durable (spoke) + événement passé (last month) : would have got." },
    { type: "input", q: "Complète : « If they hadn't missed the train, they ___ (be) here with us now. »", a: ["would be", "'d be"], ph: "would + base", exp: "Mixte A : erreur passée -> absence présente." },
    { type: "qcm", q: "Pourquoi « If I were you » plutôt que « If I was you » ?", opts: ["Erreur de niveau A2", "Were est la forme subjonctive préférée à l'irréel", "Was n'existe pas", "You impose were"], a: 1, exp: "À l'irréel, « were » à toutes les personnes est plus soutenu et attendu." },
    { type: "qcm", q: "« If I hadn't quit, I ___ a promotion this year. » Sens : j'ai démissionné, donc pas de promotion.", opts: ["would get", "would be getting", "would have got", "will get"], a: 1, exp: "Condition passée + conséquence présente en cours : « would be getting » (ou would get). Ici l'action est en cours cette année." },
    { type: "vf", q: "Dans un mixte, la condition et la conséquence se situent toujours à la même époque.", a: false, exp: "Justement non : le mixte combine deux époques différentes." },
    { type: "input", q: "Complète (mixte B) : « If he ___ (not / be) so proud, he would have apologised. »", a: ["weren't", "wasn't", "were not", "was not"], ph: "négatif de be", exp: "Trait durable (weren't proud) + conséquence passée (would have apologised)." }
  ],
  final: {
    title: "Exercice final — Les regrets d'un narrateur",
    intro: `<p>Read this reflective passage full of mixed conditionals.</p>
<p>Sometimes I lie awake and replay the choices that shaped my life. If I had accepted that scholarship abroad, I would probably be fluent in three languages now. If I were a braver person, I would have told her how I felt before she moved away. My whole life might look different today if I had listened to my grandmother's advice. And yet, if I weren't so stubborn, I would never have built this business from nothing. It is strange: the same flaw that cost me friendships also gave me success. If I had followed the safe path, I would not be sitting here, in my own office, proud of what I created. Regret is a peculiar teacher. If people understood how the past and the present are woven together, they would forgive their younger selves more easily.</p>`,
    questions: [
      { type: "qcm", q: "« If I had accepted that scholarship, I would probably be fluent now » est…", opts: ["un type 1", "un mixte A (condition passée, effet présent)", "un mixte B", "un type 2"], a: 1, exp: "Past perfect dans le if + would be + « now » : condition passée, effet présent." },
      { type: "qcm", q: "« If I were a braver person, I would have told her » est…", opts: ["un type 3 pur", "un mixte B (trait présent, effet passé)", "un mixte A", "un type 1"], a: 1, exp: "Trait durable (were braver) + conséquence passée (would have told) : mixte B." },
      { type: "vf", q: "« if I weren't so stubborn, I would never have built this business » relie un caractère présent à un résultat passé.", a: true, exp: "Mixte B classique : condition présente/permanente, conséquence dans le passé." },
      { type: "qcm", q: "« If I had followed the safe path, I would not be sitting here » : quelles époques ?", opts: ["Passé + passé", "Présent + présent", "Condition passée + conséquence présente", "Futur + présent"], a: 2, exp: "had followed (passé) -> would not be sitting (présent) : mixte A." },
      { type: "qcm", q: "« If people understood ..., they would forgive » (dernière phrase) est…", opts: ["un mixte", "un type 2 pur (présent irréel)", "un type 3", "un type 1"], a: 1, exp: "Prétérit + would + base, tout au présent : type 2 pur, pas un mixte." }
    ],
    solution: `<p>Le passage illustre les deux mixtes, entrelacés avec un type 2 pur :</p>
<pre class="pseudo">Mixte A (passe -> present) :
  If I had accepted ... I would be fluent now
  If I had followed ... I would not be sitting here
Mixte B (present -> passe) :
  If I were braver ... I would have told her
  If I weren't so stubborn ... I would never have built
Type 2 pur (present -> present) :
  If people understood ... they would forgive</pre>
<p>La clé : identifier séparément l'époque de la condition et celle de la conséquence, puis assembler <em>had done / would do</em> ou <em>did / would have done</em>. C'est ce qui donne au discours des regrets toute sa subtilité.</p>`
  }
};
</script>
