<script>
var DAY = {
  num: 25,
  title: "Négocier et convaincre",
  subtitle: "Proposer, faire des concessions, obtenir un accord sans imposer.",
  theory: `
<h3>1. Négocier : un échange, pas un combat</h3>
<p>Négocier, c'est chercher un <strong>accord acceptable pour les deux parties</strong>. En anglais, cela repose sur un langage <strong>diplomatique</strong> : on suggère plutôt qu'on exige, on propose des compromis, on formule des conditions. Le ton reste courtois même en cas de désaccord.</p>
<h3>2. Faire une proposition</h3>
<pre class="pseudo">How about + V-ing?        Et si on...? (How about meeting on Monday?)
What if we...?             Et si nous...?
I'd suggest that...        Je suggérerais que...
Would you be open to...?   Seriez-vous ouvert à...?
We could always...        On pourrait toujours...</pre>
<h3>3. Poser des conditions (le donnant-donnant)</h3>
<p>Le cœur de la négociation est la <strong>condition</strong> : « je vous accorde X si vous m'accordez Y ». On emploie le premier conditionnel.</p>
<pre class="pseudo">If you can lower the price, we'll sign today.
   Si vous baissez le prix, nous signons aujourd'hui.
We'd be happy to..., provided that...
   Nous serions ravis de..., à condition que...
As long as..., we can...
   Tant que..., nous pouvons...</pre>
<div class="warn">Dans une phrase avec « if », on n'emploie PAS <em>will</em> dans la partie « if » : on dit <em>If you lower the price</em> (et non « If you will lower »). Le <em>will</em> va dans l'autre moitié : <em>…we will sign</em>.</div>
<h3>4. Concéder et fixer des limites</h3>
<pre class="pseudo">I see your point, but...      Je comprends, mais...
We might be able to...        Nous pourrions peut-être...
That's the best we can do.    C'est le mieux que nous puissions faire.
I'm afraid that's not possible. Je crains que ce ne soit pas possible.
Let's meet halfway.           Coupons la poire en deux.</pre>
<h3>5. Conclure un accord</h3>
<pre class="pseudo">That sounds fair.        Cela me paraît équitable.
We have a deal.          Marché conclu.
It's a deal.             Affaire conclue.
Let's put it in writing. Mettons cela par écrit.</pre>
<div class="tip">Technique gagnante : ne dites jamais « non » sèchement. Remplacez <em>No</em> par <em>I'm afraid that's difficult, but what if…?</em> Vous gardez la porte ouverte et proposez une alternative. On appelle cela « négocier par oui ».</div>`,
  exercises: [
    { type: "qcm", q: "Quelle formule propose poliment une idée ?", opts: ["You must accept this", "How about meeting on Monday?", "That's final", "No way"], a: 1, exp: "« How about + V-ing? » suggère sans imposer." },
    { type: "qcm", q: "Dans une négociation, une condition s'exprime avec :", opts: ["le passé simple seul", "le premier conditionnel (if + présent, will + base)", "l'impératif", "le présent parfait"], a: 1, exp: "« If you lower the price, we'll sign » : donnant-donnant." },
    { type: "vf", q: "On peut dire « If you will lower the price, we sign. »", a: false, exp: "Pas de will dans la partie if : « If you lower the price, we will sign »." },
    { type: "input", q: "Complète : « We'd be happy to help, ___ that you pay in advance. » (à condition)", a: ["provided", "providing"], ph: "un mot", exp: "Provided / providing that = à condition que." },
    { type: "qcm", q: "« Let's meet halfway » signifie :", opts: ["Rendez-vous à mi-chemin géographiquement uniquement", "Faisons un compromis, coupons la poire en deux", "Refusons tout", "Reportons à demain"], a: 1, exp: "Meet halfway = faire chacun un pas, trouver un compromis." },
    { type: "qcm", q: "Meilleure façon de refuser sans braquer :", opts: ["No.", "Never.", "I'm afraid that's difficult, but what if we tried another way?", "That's stupid."], a: 2, exp: "On adoucit et on propose une alternative : négocier par oui." },
    { type: "input", q: "Complète : « ___ you can deliver by Friday, we'll place the order. » (Si)", a: ["If"], ph: "un mot", exp: "If + présent dans la condition : If you can deliver…" },
    { type: "qcm", q: "« That sounds fair » sert à :", opts: ["refuser", "accepter, trouver équitable", "menacer", "reporter"], a: 1, exp: "Fair = équitable : on marque son accord de principe." },
    { type: "qcm", q: "« Would you be open to a discount? » est :", opts: ["une exigence brutale", "une proposition diplomatique", "un refus", "une insulte"], a: 1, exp: "« Would you be open to…? » sonde poliment la marge de manœuvre." },
    { type: "input", q: "Traduis « Marché conclu » (2 mots) : « It's a ___. »", a: ["deal"], ph: "un mot", exp: "It's a deal = marché conclu." },
    { type: "qcm", q: "« That's the best we can do » exprime :", opts: ["une ouverture à négocier encore", "une limite : notre dernière offre", "une acceptation totale", "une question"], a: 1, exp: "On signale qu'on ne descendra pas plus bas : c'est la limite." },
    { type: "qcm", q: "« As long as you sign today, we can offer 10% off. » — « As long as » signifie :", opts: ["depuis longtemps", "tant que / à condition que", "aussi loin que", "jamais"], a: 1, exp: "As long as (ici) = à condition que, pose une condition." },
    { type: "vf", q: "Conclure par « Let's put it in writing » propose de formaliser l'accord.", a: true, exp: "Mettre par écrit = officialiser ce qui vient d'être convenu." },
    { type: "qcm", q: "Ordre logique d'une négociation réussie :", opts: ["conclure → proposer → concéder", "proposer → poser des conditions/concéder → conclure", "refuser → refuser → conclure", "conclure → refuser"], a: 1, exp: "On propose, on ajuste par conditions et concessions, puis on scelle l'accord." },
    { type: "qcm", q: "« We might be able to lower the price a little. » — le ton est :", opts: ["ferme et définitif", "prudent, laisse une marge", "agressif", "indifférent"], a: 1, exp: "« might be able to » ouvre une possibilité sans s'engager totalement." }
  ],
  final: {
    title: "Exercice final — Une négociation commerciale",
    intro: `<p>Lisez cette négociation entre un client (C) et un fournisseur (F), puis répondez.</p>
<p><em>C: Your price is a little high for us. Would you be open to a discount?<br>
F: I see your point. We might be able to offer five percent, but that's quite a lot for us.<br>
C: What if we ordered a larger quantity? Say, double the usual amount.<br>
F: In that case, we could go up to ten percent, provided that you sign today.<br>
C: That sounds fair. As long as delivery is guaranteed for Friday, we have a deal.<br>
F: Delivery by Friday is no problem. Let's put it in writing.</em></p>`,
    questions: [
      { type: "qcm", q: "Comment le client ouvre-t-il la négociation ?", opts: ["Par une menace", "Par une proposition polie de remise", "Par un refus", "En partant"], a: 1, exp: "« Would you be open to a discount? » : sonde diplomatiquement." },
      { type: "qcm", q: "Que propose le client pour obtenir une meilleure remise ?", opts: ["De payer plus tard", "De commander une quantité plus importante", "De changer de fournisseur", "Rien"], a: 1, exp: "« What if we ordered a larger quantity? » : un levier de négociation." },
      { type: "qcm", q: "À quelle condition le fournisseur accorde-t-il 10 % ?", opts: ["Si le client paie en liquide", "À condition que le client signe le jour même", "Si la livraison est reportée", "Sans condition"], a: 1, exp: "« provided that you sign today »." },
      { type: "qcm", q: "Quelle condition le client pose-t-il à son tour ?", opts: ["Une remise de 20 %", "La livraison garantie pour vendredi", "Un cadeau", "Aucune"], a: 1, exp: "« As long as delivery is guaranteed for Friday »." },
      { type: "vf", q: "La négociation se termine sur un accord formalisé par écrit.", a: true, exp: "« we have a deal… Let's put it in writing » : accord conclu et mis par écrit." }
    ],
    solution: `<p>Cette négociation est un modèle de donnant-donnant. Chaque partie <strong>propose</strong> (Would you be open to…?, What if…?), pose des <strong>conditions</strong> (provided that…, as long as…) et fait des <strong>concessions</strong> mutuelles (5 % puis 10 % contre une commande doublée et une signature immédiate). Personne ne dit « non » brutalement : le fournisseur répond <em>I see your point</em> avant d'ajuster. On aboutit à un accord équitable (<em>That sounds fair… we have a deal</em>) que l'on formalise (<em>Let's put it in writing</em>). Retenez la structure : proposer → conditionner → concéder → conclure. C'est aussi une compétence orale directement utile pour l'entretien d'embauche et la conversation des projets finaux.</p>`
  }
};
</script>
