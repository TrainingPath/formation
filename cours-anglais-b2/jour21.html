<body>
<script>
var DAY = {
  num: 21,
  title: "Le vocabulaire de l'actualité et de la société",
  subtitle: "Le lexique des journaux : politique, économie, société, environnement.",
  theory: `
<h3>1. Pourquoi ce vocabulaire ?</h3>
<p>Lire la presse anglophone, suivre l'actualité, débattre de sujets de société : tout cela exige un lexique précis que les manuels scolaires abordent rarement. Ce vocabulaire revient constamment dans les faits divers et les articles de fond — y compris dans le projet final. Voici les champs essentiels.</p>
<h3>2. La politique et le gouvernement</h3>
<pre class="pseudo">a bill               un projet de loi
to pass a law        voter/adopter une loi
a poll               un sondage / un scrutin
turnout              le taux de participation
a pledge             une promesse (politique)
to step down         démissionner (d'un poste)
a backlash           un retour de bâton, une levée de boucliers
accountability       la responsabilité (devoir rendre des comptes)</pre>
<h3>3. L'économie</h3>
<pre class="pseudo">the cost of living   le coût de la vie
inflation            l'inflation
a recession          une récession
unemployment         le chômage
to cut spending      réduire les dépenses
wages                les salaires
a shortage           une pénurie
to soar / to plummet grimper en flèche / s'effondrer</pre>
<h3>4. La société</h3>
<pre class="pseudo">inequality           l'inégalité
the gap between      le fossé entre
welfare              l'aide sociale, le bien-être
a survey             une enquête, un sondage
awareness            la sensibilisation, la prise de conscience
to tackle an issue   s'attaquer à un problème
a breakthrough       une avancée majeure
controversial        controversé</pre>
<h3>5. L'environnement</h3>
<pre class="pseudo">climate change       le changement climatique
greenhouse gases     les gaz à effet de serre
renewable energy     les énergies renouvelables
a carbon footprint   une empreinte carbone
to phase out         supprimer progressivement
sustainable          durable
a landfill           une décharge
to raise awareness   sensibiliser</pre>
<div class="warn">Attention aux faux amis : <em>to demand</em> = « exiger » (et non « demander », qui se dit <em>to ask</em>) ; <em>actual</em> = « réel, effectif » (et non « actuel », qui se dit <em>current</em>) ; <em>a location</em> = « un lieu » (et non « une location », qui se dit <em>a rental</em>).</div>
<div class="tip">Les verbes d'évolution sont très fréquents dans la presse économique : prices <em>soar</em> (montent en flèche), <em>plummet</em> (s'effondrent), <em>rise sharply</em> (grimpent fortement), <em>level off</em> (se stabilisent). Apprenez-les par paires (hausse / baisse).</div>`,
  exercises: [
    { type: "qcm", q: "Que signifie <em>a bill</em> dans un contexte politique ?", opts: ["une facture uniquement", "un projet de loi", "un sondage", "une promesse"], a: 1, exp: "A bill = un projet de loi (aussi « facture » ailleurs, mais en politique : projet de loi)." },
    { type: "input", q: "Traduis « le taux de participation » (à une élection) : ___.", a: ["turnout"], ph: "un mot", exp: "Turnout = taux de participation." },
    { type: "qcm", q: "<em>To step down</em> signifie :", opts: ["être élu", "démissionner d'un poste", "voter une loi", "faire un sondage"], a: 1, exp: "To step down = quitter ses fonctions, démissionner." },
    { type: "qcm", q: "Que veut dire <em>the cost of living</em> ?", opts: ["le salaire minimum", "le coût de la vie", "le taux de chômage", "l'inflation elle-même"], a: 1, exp: "The cost of living = le coût de la vie." },
    { type: "input", q: "Complète : « Prices didn't rise slowly — they ___ » (ont grimpé en flèche).", a: ["soared", "soar"], ph: "un verbe", exp: "To soar = grimper en flèche." },
    { type: "qcm", q: "Une <em>recession</em> est :", opts: ["une hausse des salaires", "une période de recul économique", "une pénurie d'eau", "un impôt"], a: 1, exp: "A recession = une récession, un recul de l'activité économique." },
    { type: "qcm", q: "Que signifie <em>to tackle an issue</em> ?", opts: ["ignorer un problème", "s'attaquer à un problème", "créer un problème", "cacher un problème"], a: 1, exp: "To tackle an issue = s'attaquer à un problème, le prendre à bras-le-corps." },
    { type: "vf", q: "<em>Controversial</em> signifie « qui fait débat, controversé ».", a: true, exp: "Controversial = controversé." },
    { type: "input", q: "Traduis « les énergies renouvelables » : renewable ___.", a: ["energy", "energies", "energy sources"], ph: "un mot", exp: "Renewable energy = les énergies renouvelables." },
    { type: "qcm", q: "<em>To phase out</em> (des énergies fossiles) veut dire :", opts: ["les développer", "les supprimer progressivement", "les taxer", "les subventionner"], a: 1, exp: "To phase out = supprimer / éliminer progressivement." },
    { type: "qcm", q: "Faux ami : <em>to demand</em> signifie en réalité :", opts: ["demander poliment", "exiger", "questionner", "proposer"], a: 1, exp: "To demand = exiger. « Demander » se dit to ask." },
    { type: "qcm", q: "Faux ami : <em>actual</em> signifie :", opts: ["actuel", "réel, effectif", "rapide", "ancien"], a: 1, exp: "Actual = réel/effectif. « Actuel » se dit current." },
    { type: "input", q: "Traduis « une pénurie » : a ___.", a: ["shortage"], ph: "un mot", exp: "A shortage = une pénurie." },
    { type: "qcm", q: "Que signifie <em>a backlash</em> ?", opts: ["un soutien massif", "un retour de bâton, une levée de boucliers", "un projet de loi", "une pénurie"], a: 1, exp: "A backlash = une réaction hostile violente, un retour de bâton." },
    { type: "qcm", q: "Choisis la paire hausse / baisse correcte :", opts: ["to soar / to plummet", "to soar / to rise", "to plummet / to fall", "to level off / to drop"], a: 0, exp: "To soar (monter en flèche) / to plummet (s'effondrer) : la paire opposée." }
  ],
  final: {
    title: "Exercice final — Un bulletin d'information",
    intro: `<p>Lisez ce court bulletin puis répondez en repérant le vocabulaire de l'actualité.</p>
<p><em>The government has announced a new bill aimed at cutting greenhouse gases by phasing out petrol cars within ten years. The plan has already provoked a backlash from some drivers, who say the cost of living is too high to buy an electric vehicle. A recent survey shows that public awareness of climate change has risen sharply, yet many voters remain worried about their wages and jobs. The energy minister, facing pressure from all sides, has refused to step down and insists the country must tackle the issue now rather than later.</em></p>`,
    questions: [
      { type: "qcm", q: "Que vise le nouveau projet de loi ?", opts: ["Augmenter les salaires", "Réduire les gaz à effet de serre en supprimant les voitures à essence", "Baisser les impôts", "Construire des routes"], a: 1, exp: "« cutting greenhouse gases by phasing out petrol cars »." },
      { type: "qcm", q: "Pourquoi certains conducteurs protestent-ils ?", opts: ["Ils aiment la pollution", "Le coût de la vie rend l'achat d'un véhicule électrique difficile", "Ils veulent plus de voitures à essence gratuites", "Le texte ne le dit pas"], a: 1, exp: "« the cost of living is too high to buy an electric vehicle »." },
      { type: "qcm", q: "Que montre le sondage récent ?", opts: ["Que personne ne se soucie du climat", "Que la prise de conscience du changement climatique a fortement augmenté", "Que les salaires ont baissé", "Que le chômage explose"], a: 1, exp: "« public awareness of climate change has risen sharply »." },
      { type: "vf", q: "Le ministre de l'énergie a démissionné sous la pression.", a: false, exp: "« has refused to step down » : il a REFUSÉ de démissionner." },
      { type: "qcm", q: "Quelle expression signifie « s'attaquer au problème » dans le texte ?", opts: ["step down", "tackle the issue", "cut spending", "raise wages"], a: 1, exp: "« must tackle the issue now » = s'attaquer au problème maintenant." }
    ],
    solution: `<p>Ce bulletin condense le lexique de l'actualité vu aujourd'hui : politique (<em>bill, backlash, step down</em>), économie (<em>cost of living, wages</em>), société (<em>survey, awareness</em>) et environnement (<em>greenhouse gases, phase out</em>). Remarquez les <strong>verbes d'évolution</strong> (<em>risen sharply</em>) et les <strong>marqueurs de tension</strong> (<em>facing pressure from all sides</em>). Maîtriser ce vocabulaire vous permet de lire un vrai journal anglophone sans dictionnaire et de suivre l'implicite : ici, le conflit entre urgence climatique et pouvoir d'achat n'est jamais nommé, mais il structure tout le texte. C'est le socle lexical dont vous aurez besoin pour les projets finaux.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en anglais…",
  items: [
  { id: "en-b2-j21", title: "Votre opinion sur un sujet de société", level: 3,
    statement: "Choisissez un sujet d'actualité (climat, coût de la vie, technologie…) et rédigez en anglais un paragraphe d'opinion de 6 à 8 phrases. Employez au moins SIX mots ou expressions du vocabulaire d'aujourd'hui.",
    hints: [
      "Annoncez le sujet : « One of the biggest issues today is… ».",
      "Insérez le lexique : cost of living, inequality, awareness, to tackle, sustainable, backlash…",
      "Terminez par une proposition ou un souhait : « Governments should… » ou « I believe we must… »."
    ],
    solution: "One of the biggest issues today is climate change and how to tackle it fairly. Public awareness has risen sharply, and many people now try to reduce their carbon footprint by using renewable energy or public transport. However, plans to phase out petrol cars have caused a backlash, because the cost of living is already high and not everyone can afford an electric vehicle. This shows the deep inequality between richer and poorer households. In my view, governments should support low-income families instead of simply demanding change from everyone at the same speed. A sustainable future is possible, but only if it is also a fair one.\n\nTraduction et notes : « L'un des plus grands enjeux actuels est le changement climatique et la manière de s'y attaquer équitablement. La prise de conscience a fortement augmenté, et beaucoup de gens tentent désormais de réduire leur empreinte carbone en utilisant les énergies renouvelables ou les transports en commun. Cependant, les plans visant à supprimer progressivement les voitures à essence ont provoqué un retour de bâton, car le coût de la vie est déjà élevé et tout le monde ne peut pas s'offrir un véhicule électrique. Cela révèle la profonde inégalité entre ménages aisés et modestes. À mon avis, les gouvernements devraient aider les familles à faibles revenus plutôt que d'exiger simplement le changement de tout le monde au même rythme. Un avenir durable est possible, mais seulement s'il est aussi équitable. » Les termes clés sont soulignés par l'usage : tackle, awareness, carbon footprint, renewable energy, phase out, backlash, cost of living, inequality, sustainable.",
    note: "Employer le bon vocabulaire de l'actualité fait immédiatement passer votre anglais du niveau scolaire au niveau adulte et informé. Notez le faux ami bien placé : demanding (« exigeant ») et non « demandant »." }
  ]
};
</script>
