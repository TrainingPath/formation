<script>
var DAY = {
  num: 5,
  title: "Wish et if only",
  subtitle: "Exprimer le regret, le désir et le reproche avec justesse.",
  theory: `
<h3>1. Wish : souhaiter, regretter</h3>
<p>Le verbe <strong>wish</strong> (souhaiter) sert à exprimer un désir ou un regret : on aimerait que la réalité soit différente. La construction ressemble aux conditionnels irréels, avec un « recul » d'un temps par rapport à la réalité.</p>
<pre class="pseudo">Realite : I don't speak Spanish.
Souhait : I wish I spoke Spanish. -> J'aimerais parler espagnol.</pre>
<p>Comme après <em>if</em> irréel, le prétérit exprime ici un présent imaginaire, pas un passé.</p>
<h3>2. Wish + prétérit : regret sur le présent</h3>
<p>Pour regretter une situation <strong>présente</strong>, on utilise <strong>wish + prétérit</strong> (were à toutes les personnes en style soutenu).</p>
<pre class="pseudo">I wish I were taller.        -> J'aimerais etre plus grand.
I wish I had more free time. -> J'aimerais avoir plus de temps libre.
She wishes she lived by the sea. -> Elle aimerait vivre au bord de la mer.</pre>
<div class="tip">Le sens est toujours négatif par rapport à la réalité : « I wish I were taller » implique « mais je ne le suis pas ».</div>
<h3>3. Wish + past perfect : regret sur le passé</h3>
<p>Pour regretter quelque chose de <strong>passé</strong> et irréversible, on emploie <strong>wish + past perfect</strong> (had + participe).</p>
<pre class="pseudo">I wish I had studied harder. -> J'aurais aime travailler davantage.
He wishes he hadn't said that. -> Il regrette d'avoir dit cela.
I wish I had known you were coming. -> J'aurais aime savoir que tu venais.</pre>
<div class="warn">Distingue bien : « I wish I knew » (je ne sais pas maintenant, regret présent) et « I wish I had known » (je ne savais pas à ce moment-là, regret passé).</div>
<h3>4. Wish + would : agacement, reproche, désir de changement</h3>
<p><strong>Wish + would</strong> exprime l'agacement face au comportement d'un autre, ou le désir qu'une chose change. Le sujet du <em>wish</em> et celui du <em>would</em> sont en général différents.</p>
<pre class="pseudo">I wish you would stop interrupting me.
-> J'aimerais que tu arretes de m'interrompre.
I wish it would stop raining. -> J'aimerais qu'il arrete de pleuvoir.</pre>
<div class="warn">On ne dit pas « I wish I would… » : pour parler de soi, on utilise le prétérit (« I wish I could… », « I wish I had… »).</div>
<h3>5. If only : plus emphatique</h3>
<p><strong>If only</strong> (« si seulement ») fonctionne exactement comme <em>wish</em>, mais avec une charge émotionnelle plus forte. Les mêmes temps s'appliquent.</p>
<pre class="pseudo">If only I were younger! -> Si seulement j'etais plus jeune !
If only I had listened to you. -> Si seulement je t'avais ecoute.
If only they would understand. -> Si seulement ils comprenaient.</pre>
<h3>6. Nuances de traduction</h3>
<p>Attention aux faux calques du français :</p>
<pre class="pseudo">J'aimerais que tu viennes. -> I wish you would come. / I'd like you to come.
Je regrette d'etre parti.  -> I wish I hadn't left.
Je voudrais un cafe.       -> I would like a coffee. (et non I wish a coffee)</pre>
<div class="tip"><em>Wish</em> peut aussi être suivi d'un nom pour un souhait poli : « I wish you a happy birthday » (Je te souhaite un joyeux anniversaire). Là, le sens est un vœu, pas un regret.</div>`,
  exercises: [
    { type: "qcm", q: "« I wish I ___ how to swim. » (regret présent : je ne sais pas)", opts: ["know", "knew", "had known", "would know"], a: 1, exp: "Regret sur le présent : wish + prétérit, knew." },
    { type: "qcm", q: "« I wish I ___ harder for the exam. » (regret passé)", opts: ["studied", "had studied", "study", "would study"], a: 1, exp: "Regret sur un passé irréversible : wish + past perfect, had studied." },
    { type: "input", q: "Complète : « I wish you ___ (stop) making that noise! » (agacement)", a: ["would stop"], ph: "would + base", exp: "Reproche/agacement sur le comportement d'autrui : wish + would." },
    { type: "vf", q: "« I wish I were taller » implique que je ne suis pas grand en réalité.", a: true, exp: "Wish exprime toujours un décalage avec la réalité : le contraire est vrai." },
    { type: "qcm", q: "Laquelle est incorrecte ?", opts: ["I wish I could fly.", "I wish I would fly.", "I wish it would rain.", "I wish you would listen."], a: 1, exp: "On ne dit pas « I wish I would » : pour soi, on utilise could / prétérit." },
    { type: "input", q: "Complète : « If only I ___ (not / eat) so much last night! »", a: ["hadn't eaten", "had not eaten"], ph: "past perfect négatif", exp: "Regret passé après if only : had not eaten." },
    { type: "qcm", q: "Différence entre « I wish I knew » et « I wish I had known » ?", opts: ["Aucune", "La 1re = regret présent, la 2e = regret passé", "La 2e est fausse", "La 1re est un futur"], a: 1, exp: "Prétérit = présent imaginaire ; past perfect = passé regretté." },
    { type: "input", q: "Traduis en anglais : « Si seulement il arrêtait de mentir. » Commence par « If only he ___ »", a: ["would stop lying", "would stop"], ph: "would + ...", exp: "Reproche sur le comportement : If only he would stop lying." },
    { type: "qcm", q: "« I wish I ___ by the sea, but I live in the city. »", opts: ["live", "lived", "had lived", "would live"], a: 1, exp: "Regret d'une situation présente : wish + prétérit, lived." },
    { type: "vf", q: "« I wish you a happy new year » exprime un regret.", a: false, exp: "Ici wish + nom = un vœu poli, pas un regret." },
    { type: "input", q: "Complète : « He wishes he ___ (not / say) that yesterday. »", a: ["hadn't said", "had not said"], ph: "past perfect négatif", exp: "Regret d'une parole passée : hadn't said." },
    { type: "qcm", q: "Traduis « Je voudrais un thé » :", opts: ["I wish a tea.", "I would like a tea.", "I wish I would tea.", "I had a tea."], a: 1, exp: "Pour une demande polie : « I would like », jamais « I wish » + nom-objet." },
    { type: "qcm", q: "« If only they ___ the truth back then. » (regret passé)", opts: ["told", "had told", "would tell", "tell"], a: 1, exp: "Passé irréversible après if only : had told." },
    { type: "vf", q: "« I wish it would stop snowing » exprime le désir qu'une situation change.", a: true, exp: "Wish + would peut viser une chose (météo) qu'on aimerait voir changer." },
    { type: "input", q: "Complète : « I wish I ___ (can) help you, but I'm too busy. »", a: ["could"], ph: "un mot", exp: "Pour soi-même, on utilise could (jamais would) : I wish I could." }
  ],
  final: {
    title: "Exercice final — Une page de journal intime",
    intro: `<p>Read this diary entry filled with wishes and regrets.</p>
<p>Tonight I cannot sleep. I wish I were the kind of person who lets things go easily, but I am not. I keep replaying the argument with my sister. If only I had held my tongue instead of shouting. I wish I hadn't brought up the past; it only reopened old wounds. Sometimes I wish she would simply listen without judging me, and I suspect she wishes the same about me. I wish I knew how to apologise without feeling weak. If only we had learned, as children, to talk about our feelings. Tomorrow I will try again. I wish I could turn back the clock, yet perhaps it is enough to wish for a better conversation ahead. If only tomorrow would come faster.</p>`,
    questions: [
      { type: "qcm", q: "« I wish I were the kind of person who lets things go » exprime…", opts: ["un regret passé", "un regret sur une situation présente", "un ordre", "un futur"], a: 1, exp: "Wish + were (prétérit) : regret d'un trait présent." },
      { type: "qcm", q: "« If only I had held my tongue » est un regret…", opts: ["présent", "passé et irréversible", "futur", "hypothétique neutre"], a: 1, exp: "If only + past perfect : regret sur une action passée." },
      { type: "vf", q: "« I wish she would simply listen » reproche un comportement et souhaite qu'il change.", a: true, exp: "Wish + would : agacement face au comportement d'autrui." },
      { type: "qcm", q: "« I wish I knew how to apologise » signifie…", opts: ["je sais m'excuser", "je ne sais pas m'excuser maintenant", "je savais m'excuser autrefois", "je m'excuserai demain"], a: 1, exp: "Wish + prétérit = décalage présent : en réalité, elle ne sait pas." },
      { type: "qcm", q: "Pourquoi « I wish I could turn back the clock » et non « I wish I would » ?", opts: ["Erreur du texte", "Parce qu'on ne dit pas « I wish I would » : pour soi on emploie could", "Parce que turn est irrégulier", "Parce que clock impose could"], a: 1, exp: "Règle : jamais « I wish I would » ; pour soi, could ou prétérit." }
    ],
    solution: `<p>La page de journal illustre chaque emploi de wish / if only :</p>
<pre class="pseudo">wish + preterit : I wish I were ... / I wish I knew ...  -> regret present
wish + past perfect : I wish I hadn't brought up ... / If only I had held  -> regret passe
wish + would : I wish she would listen / If only tomorrow would come  -> comportement, changement
wish + could : I wish I could turn back the clock  -> capacite (jamais would pour soi)</pre>
<p>Le choix du temps encode la temporalité du regret : prétérit pour le présent, past perfect pour le passé, would pour un changement souhaité. <em>If only</em> renforce simplement l'émotion.</p>`
  }
};
</script>
