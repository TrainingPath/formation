<script>
var DAY = {
  num: 10,
  title: "Collocations et nuances de vocabulaire",
  subtitle: "Associer les bons mots ensemble et choisir le terme juste.",
  theory: `
<h3>1. Qu'est-ce qu'une collocation ?</h3>
<p>Une <strong>collocation</strong> est une association de mots qui « vont ensemble » naturellement en anglais. On dit <em>make a decision</em> (prendre une décision) et non <em>do a decision</em> ; <em>heavy rain</em> (forte pluie) et non <em>strong rain</em>. Ces associations ne sont pas logiques mais conventionnelles : les apprendre par blocs est plus efficace que mot à mot.</p>
<div class="warn">Le francophone traduit souvent mot à mot et produit des calques faux. « Faire une erreur » n'est pas <em>do a mistake</em> mais <strong>make a mistake</strong> ; « faire ses devoirs » c'est <strong>do</strong> your homework. Il faut mémoriser quel verbe va avec quel nom.</div>
<h3>2. Make ou do ?</h3>
<p>Piège classique. En gros, <strong>make</strong> = créer, produire un résultat ; <strong>do</strong> = accomplir une tâche, une activité. Mais l'usage prime sur la règle.</p>
<pre class="pseudo">MAKE : make a decision, make a mistake, make progress, make an effort,
       make a difference, make money, make a mess, make friends
DO   : do homework, do the dishes, do business, do research,
       do a favour, do your best, do harm, do exercise</pre>
<h3>3. Verbes fréquents et leurs collocations</h3>
<pre class="pseudo">TAKE : take a risk, take a break, take responsibility, take advantage of,
       take place (avoir lieu), take part in (participer a)
HAVE : have a shower, have a good time, have an argument, have an impact
PAY  : pay attention, pay a compliment, pay a visit, pay the price
KEEP : keep a promise, keep calm, keep in touch, keep a secret</pre>
<pre class="pseudo">The meeting takes place on Monday. -> La reunion a lieu lundi.
Please pay attention to the details. -> Fais attention aux details.
Let's keep in touch. -> Restons en contact.</pre>
<h3>4. Adjectif + nom : les intensifieurs</h3>
<p>Certains adjectifs se marient à des noms précis pour exprimer l'intensité :</p>
<pre class="pseudo">heavy rain / heavy traffic / a heavy smoker -> forte pluie, circulation dense, gros fumeur
strong coffee / a strong accent / strong opinions -> cafe serre, fort accent, opinions tranchees
a deep sleep / a deep breath / deep trouble -> sommeil profond, grande respiration, gros ennuis
a narrow escape / a slim chance / a broad range -> echappee de justesse, mince chance, large gamme</pre>
<div class="tip">On dit <em>heavy rain</em> mais <em>strong wind</em>, <em>strong coffee</em> mais <em>heavy smoker</em>. Aucune logique : ce sont des blocs à retenir tels quels.</div>
<h3>5. Nuances entre synonymes proches</h3>
<p>Plusieurs mots peuvent sembler synonymes mais diffèrent par le degré, le registre ou la connotation.</p>
<pre class="pseudo">big / large / huge / enormous / massive -> du plus neutre au plus intense
tired / exhausted / worn out           -> fatigue -> epuise
happy / pleased / delighted / thrilled -> content -> ravi
good / decent / excellent / outstanding -> bon -> remarquable
say / tell / speak / talk              -> attention a la construction</pre>
<div class="warn">Say / tell : on <em>tells someone</em> something (tell + personne), mais on <em>says</em> something (to someone). « He told me the news » / « He said the news to me ». On ne dit jamais « He said me ».</div>
<h3>6. Connotation : positif, neutre, négatif</h3>
<p>Choisir le mot juste, c'est aussi choisir la bonne connotation.</p>
<pre class="pseudo">determined (+) / stubborn (-)  -> determine / tetu (meme trait, jugement oppose)
slim (+) / skinny (-)          -> mince / maigrichon
confident (+) / arrogant (-)   -> sur de soi / arrogant
thrifty (+) / stingy (-)       -> econome / radin</pre>
<div class="tip">Le contexte et l'intention dictent le choix : décrire quelqu'un de « determined » le valorise, le dire « stubborn » le critique, alors que le comportement est le même.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle collocation est correcte ?", opts: ["do a decision", "make a decision", "take a decision (US)", "have a decision"], a: 1, exp: "On dit make a decision. (« take a decision » existe en anglais britannique formel mais make est standard.)" },
    { type: "input", q: "Complète : « Don't worry, everyone ___ mistakes. » (verbe correct)", a: ["makes"], ph: "un verbe", exp: "make a mistake / makes mistakes : jamais « do »." },
    { type: "qcm", q: "« Could you ___ me a favour? »", opts: ["make", "do", "take", "have"], a: 1, exp: "do someone a favour : rendre service." },
    { type: "input", q: "Complète l'intensifieur : « We got stuck in ___ traffic for an hour. »", a: ["heavy"], ph: "adjectif", exp: "heavy traffic (circulation dense), pas « strong traffic »." },
    { type: "qcm", q: "Quel adjectif va avec « coffee » pour dire « corsé » ?", opts: ["heavy", "strong", "big", "deep"], a: 1, exp: "strong coffee. On dit heavy rain mais strong coffee." },
    { type: "vf", q: "« He said me that he was tired » est correct.", a: false, exp: "On dit « He told me » ou « He said that ». Jamais « He said me »." },
    { type: "qcm", q: "« The conference will ___ next week. » (avoir lieu)", opts: ["take place", "make place", "have place", "do place"], a: 0, exp: "take place = avoir lieu." },
    { type: "input", q: "Complète : « Please ___ attention to the safety instructions. »", a: ["pay"], ph: "un verbe", exp: "pay attention : prêter attention." },
    { type: "qcm", q: "Quel mot a une connotation NÉGATIVE ?", opts: ["determined", "confident", "stubborn", "thrifty"], a: 2, exp: "stubborn (têtu) est négatif ; determined en est l'équivalent positif." },
    { type: "input", q: "Complète : « I'm not just tired, I'm completely ___. » (épuisé)", a: ["exhausted", "worn out"], ph: "synonyme fort", exp: "exhausted / worn out = degré plus fort que tired." },
    { type: "qcm", q: "« She always ___ her promises. » (tenir)", opts: ["makes", "keeps", "does", "takes"], a: 1, exp: "keep a promise = tenir une promesse." },
    { type: "vf", q: "« Do your homework » et « make a mess » sont deux collocations correctes.", a: true, exp: "do homework (accomplir une tâche) et make a mess (produire un résultat) : les deux sont justes." },
    { type: "qcm", q: "Choisis le synonyme le PLUS intense de « big » :", opts: ["large", "decent", "enormous", "fair"], a: 2, exp: "enormous / massive sont plus intenses que big ou large." },
    { type: "input", q: "Complète : « Let's ___ in touch after the trip. » (rester en contact)", a: ["keep", "stay"], ph: "un verbe", exp: "keep in touch (ou stay in touch) = rester en contact." },
    { type: "qcm", q: "Décrire positivement quelqu'un qui dépense peu :", opts: ["stingy", "thrifty", "mean", "cheap"], a: 1, exp: "thrifty (économe) est positif ; stingy / mean / cheap sont négatifs (radin)." }
  ],
  final: {
    title: "Exercice final — Repérer les collocations",
    intro: `<p>Read this account and pay attention to the natural word combinations.</p>
<p>When Maya launched her small business, she knew she would have to take a few risks. She made a real effort to do proper market research before spending a penny. At first, progress was slow, and she made several costly mistakes; nevertheless, she refused to give up. She paid close attention to customer feedback and always kept her promises to suppliers. Her friends described her as determined, though her rivals called her stubborn. Within two years, her company was making a healthy profit and had a genuine impact on the local community. She never took her success for granted. Whenever she felt exhausted, she would take a short break, do some exercise, and come back stronger. Looking back, she says the secret was simple: do your best, keep calm, and always make time for the people who matter.</p>`,
    questions: [
      { type: "qcm", q: "« she would have to take a few risks » : la collocation correcte est…", opts: ["do risks", "make risks", "take risks", "have risks"], a: 2, exp: "take a risk = prendre un risque." },
      { type: "qcm", q: "« she made a real effort to do proper market research » : quels verbes ?", opts: ["do an effort / make research", "make an effort / do research", "take an effort / have research", "have an effort / take research"], a: 1, exp: "make an effort et do research : collocations conventionnelles." },
      { type: "vf", q: "« she always kept her promises » utilise la collocation correcte « keep a promise ».", a: true, exp: "keep a promise = tenir une promesse." },
      { type: "qcm", q: "« her friends described her as determined, though her rivals called her stubborn » illustre…", opts: ["deux synonymes neutres", "la même qualité vue positivement (+) et négativement (-)", "une erreur", "deux contraires"], a: 1, exp: "determined (+) et stubborn (-) décrivent le même trait avec un jugement opposé." },
      { type: "qcm", q: "« her company was making a healthy profit » : le verbe attendu avec profit est…", opts: ["doing", "taking", "making", "having"], a: 2, exp: "make a profit = réaliser un bénéfice." }
    ],
    solution: `<p>Le texte est tissé de collocations naturelles :</p>
<pre class="pseudo">take a risk / take a break / take for granted  -> avec TAKE
make an effort / make mistakes / make a profit / make time  -> avec MAKE
do research / do exercise / do your best  -> avec DO
keep promises / keep calm / pay attention / have an impact  -> divers
determined (+) vs stubborn (-)  -> meme trait, connotations opposees</pre>
<p>Apprends ces blocs tels quels : c'est la clé d'un anglais idiomatique. Retenir « make an effort » d'un seul tenant évite le calque « do an effort ». Et choisir entre <em>determined</em> et <em>stubborn</em>, c'est déjà porter un jugement.</p>`
  }
};
</script>

  { id: "en-b2-j10", title: "Un portrait nuancé", level: 3,
    statement: "Écris un paragraphe (5 à 7 phrases) décrivant une personne que tu admires. Emploie au moins cinq collocations correctes (make/do/take/keep/pay...) et un couple de connotations opposées (par exemple determined/stubborn) pour nuancer ton portrait.",
    hints: [
      "Collocations : « make an effort », « take responsibility », « keep calm », « pay attention ».",
      "Choisis des synonymes forts : exhausted plutôt que tired, delighted plutôt que happy.",
      "Nuance : « Some might call her stubborn, but I would say she is determined »."
    ],
    solution: "My aunt is one of the most inspiring people I know. She built her career from nothing and never once took her success for granted. She always makes an effort to help others and takes full responsibility for her mistakes. When things go wrong, she keeps calm and pays close attention to every detail before deciding. Some people call her stubborn, but I prefer to say she is remarkably determined. Even when she is completely exhausted after a long week, she still makes time for her family. Whatever she does, she does her best.\n\nTraduction : Ma tante est l'une des personnes les plus inspirantes que je connaisse. Elle a bati sa carriere en partant de rien et n'a jamais considere sa reussite comme acquise. Elle fait toujours des efforts pour aider les autres et assume pleinement ses erreurs. Quand les choses tournent mal, elle garde son calme et prete une grande attention a chaque detail avant de decider. Certains la trouvent tetue, mais je prefere dire qu'elle est remarquablement determinee. Meme quand elle est completement epuisee apres une longue semaine, elle trouve encore du temps pour sa famille. Quoi qu'elle fasse, elle fait de son mieux.",
    note: "Repère les collocations : took her success for granted, makes an effort, takes responsibility, keeps calm, pays attention, makes time, does her best. Et la nuance de connotation : stubborn (-) vs determined (+)." }
  ]
};
