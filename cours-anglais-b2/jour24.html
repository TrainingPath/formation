<script>
var DAY = {
  num: 24,
  title: "Exprimer hypothèses et probabilités",
  subtitle: "Du presque certain au peu probable : maîtriser toutes les nuances.",
  theory: `
<h3>1. L'échelle de la probabilité</h3>
<p>Au B2, on ne se contente pas de « yes » ou « no » : on gradue sa certitude. L'anglais dispose d'une riche palette de modaux et d'adverbes pour situer un fait sur une échelle allant du <strong>certain</strong> à l'<strong>impossible</strong>.</p>
<pre class="pseudo">certain (100%)     It must be true.        Ça doit être vrai.
probable (75%)     It is likely to be...   C'est probable.
possible (50%)     It may / might / could   C'est possible.
peu probable (25%) It is unlikely to...    C'est peu probable.
impossible (0%)    It can't be true.       Ça ne peut pas être vrai.</pre>
<h3>2. Les modaux de déduction (présent)</h3>
<p>Pour <strong>déduire</strong> à partir d'indices : <em>must</em> (certitude positive), <em>can't</em> (certitude négative), <em>may / might / could</em> (possibilité).</p>
<pre class="pseudo">The lights are on, so someone must be home.   → forcément quelqu'un est là
He can't be at work — it's Sunday.            → impossible qu'il soit au travail
She might know the answer.                     → c'est possible</pre>
<div class="warn">Pour dire « ce n'est pas possible » au sens de déduction, on utilise <strong>can't</strong>, jamais <em>mustn't</em>. <em>Mustn't</em> signifie « ne doit pas » (interdiction), pas « ne peut pas être vrai ».</div>
<h3>3. Les modaux de déduction (passé) : modal + have + participe</h3>
<pre class="pseudo">He must have missed the train.   Il a dû rater le train. (certitude)
She can't have known.            Elle ne pouvait pas savoir. (impossible)
They might have forgotten.       Ils ont peut-être oublié. (possible)</pre>
<h3>4. Les adverbes et adjectifs de probabilité</h3>
<pre class="pseudo">definitely / certainly   certainement, à coup sûr
probably                 probablement
presumably               vraisemblablement
possibly / perhaps       peut-être
likely / unlikely        probable / improbable
bound to                 forcément, sûr de (It's bound to rain.)</pre>
<h3>5. L'hypothèse : les conditionnels (rappel)</h3>
<pre class="pseudo">If it rains, we'll stay in.        (réel, probable) 1er conditionnel
If I won the lottery, I would...   (irréel du présent) 2e conditionnel
If I had known, I would have...    (irréel du passé) 3e conditionnel</pre>
<div class="tip">Nuance fine : <em>may</em> est légèrement plus formel et plus probable que <em>might</em> ; <em>could</em> insiste sur la possibilité parmi d'autres. Les trois sont souvent interchangeables à l'oral, mais <em>might</em> reste le plus prudent.</div>`,
  exercises: [
    { type: "qcm", q: "Pour exprimer une certitude positive (déduction), on emploie :", opts: ["might", "must", "can't", "may"], a: 1, exp: "Must = « ça doit forcément être le cas », certitude déduite." },
    { type: "qcm", q: "« The office is dark, so it ___ be closed. »", opts: ["must", "can't", "might not", "mustn't"], a: 0, exp: "Indice fort (tout est éteint) → certitude positive : must be closed." },
    { type: "qcm", q: "Pour une certitude négative (« c'est impossible »), on emploie :", opts: ["mustn't", "can't", "may not", "shouldn't"], a: 1, exp: "Can't = « ça ne peut pas être vrai ». Mustn't = interdiction, sens différent." },
    { type: "input", q: "Complète (déduction passée) : « He didn't answer. He ___ have been asleep. » (a dû)", a: ["must"], ph: "un modal", exp: "Must have + participe = « il a dû » (certitude sur le passé)." },
    { type: "qcm", q: "« She ___ have known — she wasn't even there! » (c'était impossible)", opts: ["must", "can't", "might", "should"], a: 1, exp: "Can't have known = « elle ne pouvait pas le savoir » (impossibilité passée)." },
    { type: "qcm", q: "Que signifie « It's bound to rain » ?", opts: ["Il ne pleuvra pas", "Il va forcément pleuvoir", "Il pleut rarement", "Peut-être qu'il pleuvra"], a: 1, exp: "Bound to = forcément, quasi certain de se produire." },
    { type: "input", q: "Classe : « likely » signifie ___ (probable ou improbable ?).", a: ["probable"], ph: "un mot", exp: "Likely = probable ; unlikely = improbable." },
    { type: "qcm", q: "« They ___ have forgotten our meeting. » (c'est possible)", opts: ["must", "can't", "might", "won't"], a: 2, exp: "Might have + participe = « ils ont peut-être », possibilité." },
    { type: "vf", q: "<em>Mustn't</em> peut servir à dire « ça ne peut pas être vrai ».", a: false, exp: "Non : mustn't = interdiction. Pour la déduction négative, c'est can't." },
    { type: "qcm", q: "Quel adverbe exprime « vraisemblablement » ?", opts: ["definitely", "presumably", "possibly", "certainly"], a: 1, exp: "Presumably = vraisemblablement, selon toute logique." },
    { type: "qcm", q: "« If I won the lottery, I ___ travel the world. » (irréel du présent)", opts: ["will", "would", "would have", "won't"], a: 1, exp: "2e conditionnel : If + past simple, would + base verbale." },
    { type: "qcm", q: "« If I had studied, I ___ passed. » (irréel du passé)", opts: ["would", "will have", "would have", "must have"], a: 2, exp: "3e conditionnel : If + past perfect, would have + participe." },
    { type: "input", q: "Complète (probable, 75%) : « It is ___ to be busy on a Saturday. »", a: ["likely", "bound"], ph: "un adjectif", exp: "It is likely to be busy = c'est probable." },
    { type: "qcm", q: "Nuance : lequel est le plus PRUDENT (le moins sûr) ?", opts: ["It must be true", "It might be true", "It is definitely true", "It is bound to be true"], a: 1, exp: "Might exprime la possibilité la plus incertaine parmi ces options." },
    { type: "qcm", q: "« The ground is wet, so it ___ rained during the night. »", opts: ["can't have", "must have", "mustn't have", "shouldn't have"], a: 1, exp: "Indice (sol mouillé) → déduction certaine sur le passé : must have rained." }
  ],
  final: {
    title: "Exercice final — Le détective déduit",
    intro: `<p>Un détective examine une scène. À partir des indices, complétez ses déductions avec le bon degré de probabilité. Rappel : <strong>must</strong> (certain), <strong>can't</strong> (impossible), <strong>might / could</strong> (possible).</p>
<p><em>The detective looks around the empty flat. The kettle is still warm. A cup of tea sits half-finished on the table. The front door is locked from the inside, but the window is wide open.</em></p>`,
    questions: [
      { type: "qcm", q: "« The kettle is still warm, so someone ___ been here very recently. »", opts: ["can't have", "must have", "mustn't have", "won't have"], a: 1, exp: "Indice fort (bouilloire chaude) → certitude : must have been here." },
      { type: "qcm", q: "« The tea is only half-finished, so the person ___ left in a hurry. »", opts: ["can't have", "might have", "mustn't", "won't"], a: 1, exp: "C'est une possibilité plausible : might have left in a hurry." },
      { type: "qcm", q: "« The door is locked from the inside, so they ___ have left through the door. »", opts: ["must", "can't", "might", "should"], a: 1, exp: "Impossible de sortir par une porte verrouillée de l'intérieur : can't have." },
      { type: "qcm", q: "« The window is wide open, so they ___ have escaped that way. »", opts: ["can't", "could", "mustn't", "won't"], a: 1, exp: "C'est une hypothèse possible : could have escaped through the window." },
      { type: "vf", q: "En combinant les indices, le détective conclut logiquement que la personne est partie par la fenêtre.", a: true, exp: "Porte verrouillée (can't) + fenêtre ouverte (could) → déduction la plus probable." }
    ],
    solution: `<p>La déduction est un art de gradation. Devant un indice fort et récent (bouilloire chaude), on emploie <strong>must have</strong> : « quelqu'un a forcément été là ». Devant une impossibilité logique (porte verrouillée de l'intérieur), on emploie <strong>can't have</strong> : « impossible d'être sorti par là ». Devant une simple possibilité (fenêtre ouverte), on emploie <strong>could / might have</strong> : « il a pu s'échapper par là ». En enchaînant ces modaux, le détective transforme des indices en conclusion : la personne, présente il y a peu, est vraisemblablement sortie par la fenêtre. Ce maniement fin de la probabilité est exactement ce que le fait divers du projet final exigera pour reconstituer les faits.</p>`
  }
};
</script>
