<script>
var DAY = {
  num: 22,
  title: "L'implicite, l'humour, l'ironie",
  subtitle: "Comprendre ce qui n'est pas dit : sous-entendus, understatement, ironie.",
  theory: `
<h3>1. Dire sans dire : l'implicite</h3>
<p>Une grande partie de la communication anglophone passe par l'<strong>implicite</strong> : on suggère au lieu d'affirmer. Comprendre l'anglais au niveau B2, c'est saisir ce que l'on <strong>sous-entend</strong>. Exemple : à la question <em>Do you like my cooking?</em>, si l'on répond <em>Well… it's certainly interesting</em>, la personne n'aime pas du tout. Le mot <em>interesting</em>, dit avec hésitation, est un refus poli.</p>
<h3>2. L'understatement : minimiser (typiquement britannique)</h3>
<p>Les Britanniques adorent <strong>minimiser</strong> (<em>understatement</em>) : dire moins que ce que l'on pense pour produire un effet. Face à une catastrophe, un Anglais dira <em>That's a bit of a problem</em> (« c'est un petit problème ») ou <em>not ideal</em> (« pas idéal »).</p>
<pre class="pseudo">It's not exactly cheap.   = C'est très cher.
He's not the friendliest. = Il est franchement désagréable.
That went quite well.     = (ironique) Ça a été un désastre.
I've seen worse.          = C'est plutôt bien, en fait.
It could be better.       = C'est mauvais.</pre>
<h3>3. L'ironie et le sarcasme</h3>
<p>L'<strong>ironie</strong> consiste à dire le <strong>contraire</strong> de ce que l'on pense, souvent pour se moquer gentiment. Sous la pluie battante, un Anglais lance <em>Lovely weather, isn't it?</em> (« Quel temps magnifique, n'est-ce pas ? »). Le <strong>sarcasme</strong> est une ironie plus mordante, parfois blessante.</p>
<pre class="pseudo">Oh, brilliant.        = (ironique) C'est malin. / Génial (négatif).
Well, that's just great. = C'est vraiment pas de chance.
Thanks a lot.         = (selon le ton) Merci pour rien.
Nice of you to join us. = (à un retardataire) Tu tombes bien...</pre>
<div class="warn">L'ironie dépend énormément du <strong>ton de la voix</strong> et du <strong>contexte</strong>. À l'écrit, cherchez le décalage entre les mots et la situation : si tout va mal et que quelqu'un dit <em>Perfect!</em>, c'est ironique.</div>
<h3>4. L'humour anglais</h3>
<p>L'humour britannique repose souvent sur l'<strong>absurde</strong>, l'<strong>autodérision</strong> (se moquer de soi-même) et le <strong>flegme</strong> (rester impassible). Comprendre une blague, c'est repérer le décalage inattendu.</p>
<p><em>Waiter: How did you find your steak, sir? — Customer: Oh, I just moved the chips and there it was.</em></p>
<p>La blague joue sur les deux sens de <em>How did you find…?</em> : « Comment avez-vous trouvé… ? » (votre avis) et littéralement « Comment l'avez-vous localisé ? ». Le client fait mine de comprendre le sens littéral. Traduction de la chute : « J'ai juste déplacé les frites et il était là. »</p>
<div class="tip">Trois indices pour détecter l'implicite : (1) un mot faible là où on attendrait un mot fort (<em>interesting</em>, <em>fine</em>, <em>not bad</em>) ; (2) un décalage entre les mots et la situation (ironie) ; (3) un double sens ou un mot pris au pied de la lettre (jeu de mots).</div>`,
  exercises: [
    { type: "qcm", q: "« It's not exactly cheap. » signifie en réalité :", opts: ["C'est gratuit", "C'est très cher", "C'est bon marché", "C'est correct"], a: 1, exp: "Understatement : minimiser pour dire « c'est très cher »." },
    { type: "qcm", q: "Sous une pluie battante, « Lovely weather, isn't it? » est :", opts: ["une remarque sincère", "de l'ironie (le contraire de ce qu'on pense)", "une question météo", "une insulte"], a: 1, exp: "Ironie : on dit le contraire de la réalité pour souligner l'absurde." },
    { type: "qcm", q: "« He's not the friendliest person. » veut dire :", opts: ["Il est très gentil", "Il est plutôt désagréable", "Il n'a pas d'amis", "Il est timide"], a: 1, exp: "Litote/understatement : « pas le plus amical » = franchement désagréable." },
    { type: "vf", q: "L'<em>understatement</em> consiste à exagérer ce que l'on ressent.", a: false, exp: "C'est le contraire : minimiser, dire moins que ce que l'on pense." },
    { type: "qcm", q: "Après un examen raté, un ami dit « Well, that went well. » avec un soupir. C'est :", opts: ["une réussite", "de l'ironie : ça s'est mal passé", "un compliment", "une question"], a: 1, exp: "Le décalage avec la réalité (examen raté) révèle l'ironie." },
    { type: "qcm", q: "Que signifie l'autodérision (<em>self-deprecating humour</em>) ?", opts: ["se moquer des autres", "se moquer de soi-même", "raconter des mensonges", "être impoli"], a: 1, exp: "L'autodérision : rire de ses propres défauts, très prisée en anglais." },
    { type: "input", q: "Complète l'understatement : « The film wasn't ___ » pour dire poliment qu'il était mauvais. (bon)", a: ["great", "good", "brilliant", "amazing"], ph: "un adjectif", exp: "« wasn't great / good » = manière douce de dire « mauvais »." },
    { type: "qcm", q: "Un collègue arrive en retard : « Nice of you to join us. » Le ton est :", opts: ["sincèrement reconnaissant", "sarcastique / reproche déguisé", "inquiet", "admiratif"], a: 1, exp: "Sarcasme : sous la politesse, un reproche pour le retard." },
    { type: "qcm", q: "Dans « How did you find your steak? — I moved the chips and there it was », l'humour vient :", opts: ["d'une insulte", "d'un double sens de « find » pris au pied de la lettre", "d'une faute de grammaire", "d'un mensonge"], a: 1, exp: "Jeu sur find = « trouver un avis » vs « localiser »." },
    { type: "vf", q: "Pour repérer l'ironie à l'écrit, on cherche le décalage entre les mots et la situation.", a: true, exp: "Si la situation est mauvaise et les mots positifs, c'est ironique." },
    { type: "qcm", q: "« I've seen worse. » à propos d'un repas signifie souvent :", opts: ["C'est immangeable", "C'est plutôt bon, en fait", "Je n'ai pas faim", "Je déteste ce plat"], a: 1, exp: "Understatement positif : « j'ai vu pire » = c'est en fait plutôt réussi." },
    { type: "qcm", q: "Le <em>flegme</em> britannique consiste à :", opts: ["montrer de fortes émotions", "rester impassible même dans une situation extrême", "parler très fort", "pleurer facilement"], a: 1, exp: "Le flegme : garder son calme et son impassibilité, ressort d'humour." },
    { type: "input", q: "Traduis l'implicite de « It's certainly... interesting. » (dit avec hésitation) : ça ne ___ pas.", a: ["plaît", "plait", "convient", "va"], ph: "un verbe", exp: "Refus poli : le mot faible « interesting » cache un « je n'aime pas »." },
    { type: "qcm", q: "Quel signe révèle le mieux un understatement ?", opts: ["un mot très fort", "un mot faible là où on attendrait un mot fort", "une majuscule", "un point d'exclamation"], a: 1, exp: "Le mot faible (fine, not bad, a bit) trahit la minimisation." },
    { type: "qcm", q: "« Oh, brilliant. » dit d'un ton plat quand l'imprimante tombe en panne signifie :", opts: ["c'est vraiment génial", "c'est bien ma chance (ironie négative)", "l'imprimante est réparée", "merci beaucoup"], a: 1, exp: "Ironie : « brilliant » positif dit face à un ennui = agacement." }
  ],
  final: {
    title: "Exercice final — Décoder une conversation",
    intro: `<p>Lisez ce dialogue et repérez l'implicite, l'ironie et l'understatement.</p>
<p><em>Anna had spent all day cooking an elaborate dinner. When her flatmate Tom finally tasted it, there was a long pause.<br>
— So? What do you think? asked Anna.<br>
— It's… certainly original, said Tom. I've never tasted anything quite like it.<br>
— You hate it, don't you?<br>
— No, no! It's an experience. Really. You should be proud. I mean, not everyone would be brave enough to serve this.<br>
Anna put down her fork. Great, she said. Just great.</em></p>`,
    questions: [
      { type: "qcm", q: "Que pense réellement Tom du plat ?", opts: ["Il l'adore", "Il ne l'aime pas du tout", "Il n'a pas d'avis", "Il le trouve parfait"], a: 1, exp: "« certainly original », « an experience », « brave enough » : autant de refus polis." },
      { type: "qcm", q: "Que sous-entend « not everyone would be brave enough to serve this » ?", opts: ["Le plat est courageux", "Le plat est si mauvais qu'il faut du courage pour l'offrir", "Anna est une héroïne", "Le plat est dangereux"], a: 1, exp: "Ironie : « brave » suggère que le plat est raté." },
      { type: "qcm", q: "Le mot « original » employé par Tom est :", opts: ["un vrai compliment", "un mot faible/poli pour éviter de dire « mauvais »", "une insulte directe", "une question"], a: 1, exp: "Understatement : « original » évite le mot « bad »." },
      { type: "qcm", q: "Quand Anna dit « Great. Just great. », elle est :", opts: ["ravie", "ironique et déçue", "reconnaissante", "surprise agréablement"], a: 1, exp: "Le décalage avec la situation (elle a compris que Tom déteste) rend la phrase ironique." },
      { type: "vf", q: "Aucun personnage ne dit explicitement « le plat est mauvais », mais on le comprend clairement.", a: true, exp: "Tout passe par l'implicite : mots faibles, ironie, hésitations." }
    ],
    solution: `<p>Ce dialogue est un festival d'implicite. Tom n'ose jamais dire « c'est mauvais » : il emploie des mots faibles (<em>original, an experience</em>) et une ironie polie (<em>brave enough to serve this</em>) — plus c'est raté, plus il faut du « courage » pour le servir. Anna comprend parfaitement et répond par une ironie amère (<em>Great. Just great.</em>), où le décalage entre le mot positif et sa déception trahit le sens réel. Décoder l'anglais authentique, c'est justement lire entre les lignes : repérer les mots faibles, l'ironie née du contexte, et l'autodérision. Cette compétence est indispensable pour saisir l'humour d'un roman, d'un film ou d'un fait divers.</p>`
  }
};
</script>

    solution: "This morning did not go entirely to plan. I woke up to find that my alarm had not gone off, which was a bit of a problem, as I had an important meeting at nine. On the way out, I spilled coffee all over my only clean shirt. Lovely. Then the train was cancelled, so I had the pleasure of a two-hour wait on a cold platform. By the time I arrived, the meeting was over, but never mind — I've had worse Mondays. All in all, not my finest day, though I suppose things could always be worse.\n\nTraduction et notes : « Ce matin ne s'est pas tout à fait déroulé comme prévu. Je me suis réveillé en découvrant que mon réveil n'avait pas sonné, ce qui était un petit problème, car j'avais une réunion importante à neuf heures. En sortant, j'ai renversé du café sur ma seule chemise propre. Charmant. Puis le train a été annulé, j'ai donc eu le plaisir d'attendre deux heures sur un quai glacé. Le temps que j'arrive, la réunion était finie, mais peu importe — j'ai connu de pires lundis. Somme toute, pas mon plus beau jour, mais je suppose que ça pourrait toujours être pire. » L'understatement (a bit of a problem, not my finest day) et l'ironie (Lovely, the pleasure of a two-hour wait) racontent un désastre sans jamais employer de mot fort.",
