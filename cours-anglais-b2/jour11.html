<script>
var DAY = {
  num: 11,
  title: "Phrasal verbs avancés et idiomes",
  subtitle: "Comprendre les verbes à particule et les expressions imagées de l'anglais courant.",
  theory: `
<h3>1. Le principe du phrasal verb</h3>
<p>Un <strong>phrasal verb</strong> est un verbe suivi d'une ou deux particules (adverbe ou préposition) qui, ensemble, prennent un sens souvent imprévisible. <em>Give up</em> ne veut pas dire « donner en haut » mais « abandonner ». C'est le cauchemar du francophone, car le sens n'est pas déductible mot à mot. Il faut les apprendre comme du vocabulaire à part entière.</p>
<pre class="pseudo">give up -> abandonner    /  carry on -> continuer
find out -> decouvrir    /  put off -> reporter
turn down -> refuser     /  come across -> tomber sur</pre>
<h3>2. Séparables ou inséparables ?</h3>
<p>Certains phrasal verbs sont <strong>séparables</strong> : l'objet peut se placer entre le verbe et la particule. D'autres sont <strong>inséparables</strong>.</p>
<pre class="pseudo">Separable : turn off the light = turn the light off
   MAIS avec un pronom, il DOIT s'inserer : turn it off (jamais turn off it)
Inseparable : look after the baby (jamais look the baby after)</pre>
<div class="warn">Règle d'or : avec un pronom (it, them, him…), le phrasal verb séparable se coupe obligatoirement. « Turn it off », « Pick them up », « Throw it away ». On ne dit jamais « turn off it ».</div>
<h3>3. Phrasal verbs fréquents par thème</h3>
<pre class="pseudo">Travail : take on (embaucher/assumer), lay off (licencier), carry out (realiser),
          set up (creer), deal with (gerer), sort out (regler)
Relations : get on with (bien s'entendre), fall out with (se facher avec),
          make up (se reconcilier), put up with (supporter), look up to (admirer)
Vie quotidienne : run out of (etre a court de), come up with (trouver une idee),
          look forward to (attendre avec impatience), get over (se remettre de)</pre>
<pre class="pseudo">I can't put up with this noise any longer. -> Je ne supporte plus ce bruit.
She came up with a brilliant idea. -> Elle a trouve une idee geniale.
We've run out of milk. -> Nous n'avons plus de lait.</pre>
<div class="tip"><em>Look forward to</em> est suivi d'un -ing (car « to » est ici une préposition, pas un infinitif) : « I look forward to <strong>meeting</strong> you », jamais « to meet you ».</div>
<h3>4. Registre : phrasal verb ou verbe latin ?</h3>
<p>Souvent, un phrasal verb familier a un équivalent latin plus formel. Le phrasal verb sonne naturel à l'oral ; le verbe latin convient à l'écrit soutenu.</p>
<pre class="pseudo">put off  = postpone   (reporter)
find out = discover   (decouvrir)
go up    = increase   (augmenter)
give up  = abandon    (abandonner)
set up   = establish  (etablir)
look into = investigate (enqueter sur)</pre>
<h3>5. Les idiomes : des images figées</h3>
<p>Un <strong>idiome</strong> est une expression imagée dont le sens ne se déduit pas des mots. Les traduire littéralement en français donne des non-sens. Il faut apprendre le sens global.</p>
<pre class="pseudo">to break the ice -> briser la glace (detendre l'atmosphere)
to cost an arm and a leg -> couter les yeux de la tete
to be under the weather -> etre patraque, mal fichu
to hit the nail on the head -> mettre le doigt dessus, viser juste
once in a blue moon -> tous les trente-six du mois
to bite the bullet -> serrer les dents, prendre son courage</pre>
<div class="warn">Un idiome se dit tel quel, on ne change pas les mots. « It's raining cats and dogs » (il pleut des cordes) ne devient jamais « raining dogs and cats ». Ce sont des blocs figés.</div>
<h3>6. Deviner grâce au contexte</h3>
<p>Face à un phrasal verb ou un idiome inconnu, le contexte est ton meilleur allié : cherche l'idée générale de la phrase plutôt que le sens de chaque mot.</p>
<pre class="pseudo">He's really down in the dumps since he lost his job.
-> Le contexte (perte d'emploi) suggere : deprime, decourage.
Let's call it a day, we've done enough.
-> (on a assez fait) : arretons-nous la pour aujourd'hui.</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie « give up » ?", opts: ["donner en haut", "abandonner", "offrir", "se lever"], a: 1, exp: "give up = abandonner, renoncer." },
    { type: "input", q: "Complète avec un pronom : « The light is on. Can you turn ___ off? »", a: ["it"], ph: "un pronom", exp: "Séparable + pronom : « turn it off » (jamais « turn off it »)." },
    { type: "qcm", q: "« I look forward to ___ you next week. »", opts: ["meet", "meeting", "met", "to meet"], a: 1, exp: "look forward to + -ing : « to » est une préposition, donc meeting." },
    { type: "qcm", q: "Quel phrasal verb signifie « reporter » ?", opts: ["put off", "put on", "put up", "put out"], a: 0, exp: "put off = reporter (équivalent formel : postpone)." },
    { type: "input", q: "Complète : « We've ___ out of coffee. » (être à court de)", a: ["run"], ph: "un verbe", exp: "run out of = être à court de." },
    { type: "vf", q: "« Look after the baby » peut se transformer en « look the baby after ».", a: false, exp: "« look after » est inséparable : l'objet ne peut pas s'insérer." },
    { type: "qcm", q: "L'équivalent formel de « find out » est…", opts: ["postpone", "discover", "increase", "establish"], a: 1, exp: "find out = discover (découvrir)." },
    { type: "input", q: "Complète l'idiome : « This new phone costs an arm and a ___. »", a: ["leg"], ph: "un mot", exp: "cost an arm and a leg = coûter les yeux de la tête." },
    { type: "qcm", q: "« I can't put up with this noise » signifie…", opts: ["j'installe ce bruit", "je ne supporte plus ce bruit", "je monte le son", "j'écoute ce bruit"], a: 1, exp: "put up with = supporter, tolérer." },
    { type: "qcm", q: "« To be under the weather » veut dire…", opts: ["être dehors sous la pluie", "être patraque, mal fichu", "être en retard", "être météorologue"], a: 1, exp: "under the weather = ne pas être en forme, être souffrant." },
    { type: "input", q: "Complète : « She ___ up with a great idea for the project. » (trouver une idée)", a: ["came"], ph: "un verbe (passé)", exp: "come up with = trouver, proposer (une idée)." },
    { type: "qcm", q: "« To hit the nail on the head » signifie…", opts: ["se blesser", "viser juste, mettre le doigt dessus", "planter un clou", "échouer"], a: 1, exp: "hit the nail on the head = tomber juste, dire exactement ce qu'il faut." },
    { type: "vf", q: "« It's raining cats and dogs » signifie qu'il pleut très fort.", a: true, exp: "raining cats and dogs = il pleut des cordes." },
    { type: "input", q: "Complète : « Pick your toys ___ before dinner! » (ramasser)", a: ["up"], ph: "une particule", exp: "pick up = ramasser. « Pick them up » avec un pronom." },
    { type: "qcm", q: "« Once in a blue moon » signifie…", opts: ["chaque nuit", "très rarement", "à la pleine lune", "une fois par mois"], a: 1, exp: "once in a blue moon = très rarement, tous les trente-six du mois." }
  ],
  final: {
    title: "Exercice final — Une conversation animée",
    intro: `<p>Read this informal dialogue, full of phrasal verbs and idioms.</p>
<p>Tom had been feeling under the weather all week, so he decided to call it a day early and head home. On the way, he ran into an old friend he hadn't seen in years. They got on so well that they ended up chatting for hours. His friend had just set up a small startup and was looking for someone to take on the marketing. Tom, who had recently been laid off, jumped at the chance. "I won't let you down," he promised. Of course, launching a business is no walk in the park, and money was tight; they nearly ran out of funds twice. But they refused to give up. Whenever a problem came up, they rolled up their sleeves and sorted it out. Within a year, the company had really taken off. Looking back, Tom often says that bumping into his friend that day was a blessing in disguise.</p>`,
    questions: [
      { type: "qcm", q: "« Tom had been feeling under the weather » signifie qu'il…", opts: ["aimait la météo", "se sentait mal/souffrant", "était dehors", "était en retard"], a: 1, exp: "under the weather = patraque, souffrant." },
      { type: "qcm", q: "« he decided to call it a day » veut dire…", opts: ["fixer un rendez-vous", "s'arrêter pour aujourd'hui", "téléphoner", "compter les jours"], a: 1, exp: "call it a day = arrêter, s'arrêter là pour la journée." },
      { type: "vf", q: "« take on the marketing » signifie ici « se charger du marketing / l'assumer ».", a: true, exp: "take on = assumer, prendre en charge (aussi : embaucher)." },
      { type: "qcm", q: "« launching a business is no walk in the park » signifie…", opts: ["c'est une promenade", "ce n'est pas facile", "il faut marcher", "c'est agréable"], a: 1, exp: "no walk in the park = ce n'est pas de tout repos, pas facile." },
      { type: "qcm", q: "« bumping into his friend was a blessing in disguise » signifie…", opts: ["un déguisement", "un mal pour un bien / une chance cachée", "une malédiction", "une rencontre banale"], a: 1, exp: "a blessing in disguise = un bienfait caché, un mal pour un bien." }
    ],
    solution: `<p>Le dialogue enchaîne phrasal verbs et idiomes de la vie courante :</p>
<pre class="pseudo">Phrasal verbs : call it a day, run into (=bump into), get on with, set up,
   take on, be laid off, let down, run out of, give up, come up, sort out, take off
Idiomes : under the weather, no walk in the park, roll up one's sleeves,
   a blessing in disguise</pre>
<p>Remarque l'alternance registre : à l'oral, l'anglais préfère les phrasal verbs (set up plutôt que establish, take off plutôt que succeed). Ces expressions donnent un ton naturel et vivant. Les apprendre par blocs, avec leur contexte, est la seule méthode efficace.</p>`
  }
};
</script>
