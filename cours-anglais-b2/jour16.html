<script>
var DAY = {
  num: 16,
  title: "Parler de son parcours professionnel",
  subtitle: "Raconter sa carrière avec les bons temps et le bon vocabulaire.",
  theory: `
<h3>1. Le bon temps pour raconter un parcours</h3>
<p>En anglais, décrire sa carrière repose sur un choix de temps très précis. On distingue trois cas. Pour une <strong>expérience globale</strong> (sans date), on emploie le <em>present perfect</em> : <em>I have worked in three different countries</em> (« j'ai travaillé dans trois pays »). Pour un <strong>poste terminé et daté</strong>, on emploie le <em>past simple</em> : <em>I worked at Renault from 2018 to 2021</em> (« j'ai travaillé chez Renault de 2018 à 2021 »). Pour une <strong>activité qui continue aujourd'hui</strong>, on emploie le <em>present perfect continuous</em> : <em>I have been working as a project manager for five years</em> (« je travaille comme chef de projet depuis cinq ans »).</p>
<div class="warn">Erreur classique du francophone : <em>I work here since 2020</em>. Faux ! « depuis » avec un point de départ se rend par le present perfect : <strong>I have worked here since 2020</strong> ou <strong>I have been working here since 2020</strong>.</div>
<h3>2. Le vocabulaire du parcours</h3>
<pre class="pseudo">career path              parcours professionnel
background               formation / antécédents
work experience         expérience professionnelle
to be promoted (to)     être promu (à)
to take on a role       endosser un rôle / des responsabilités
to be in charge of      être responsable de
to report to someone    dépendre hiérarchiquement de quelqu'un
a steep learning curve  un apprentissage intense et rapide
to gain skills          acquérir des compétences
a career move           un changement de carrière
to hand in one's notice donner sa démission
to be made redundant    être licencié (économique)</pre>
<h3>3. Structurer le récit : les étapes clés</h3>
<p>Un bon récit de carrière suit une progression : le <strong>point de départ</strong> (<em>I started out as…</em>, « j'ai débuté comme »), une <strong>évolution</strong> (<em>I gradually moved into…</em>, « je me suis peu à peu orienté vers »), un <strong>tournant</strong> (<em>the turning point came when…</em>, « le tournant est arrivé quand »), et la <strong>situation actuelle</strong> (<em>currently, I am…</em>, « actuellement, je suis »).</p>
<h3>4. Les connecteurs chronologiques</h3>
<pre class="pseudo">at first / initially     au début
then / after that        ensuite / après cela
later on                 plus tard
eventually               finalement (au bout du compte)
ever since               depuis lors
these days               ces temps-ci</pre>
<div class="warn">Attention au faux ami : <em>eventually</em> ne veut PAS dire « éventuellement » (qui se dit <em>possibly</em>) mais « finalement, au bout du compte ».</div>
<h3>5. Exemple : une présentation de parcours</h3>
<p><em>I started out as a sales assistant in a small shop. After a couple of years, I moved into customer service, where I really developed my communication skills. The turning point came when my manager asked me to lead a small team. Since then, I have been working in management, and these days I am in charge of a department of twelve people.</em></p>
<p>Traduction : « J'ai débuté comme vendeur dans une petite boutique. Après deux ou trois ans, je suis passé au service client, où j'ai vraiment développé mes compétences en communication. Le tournant est arrivé quand mon responsable m'a demandé de diriger une petite équipe. Depuis, je travaille dans le management, et ces temps-ci je suis responsable d'un service de douze personnes. »</p>
<div class="tip">Pour donner du relief, ajoutez une <strong>raison</strong> ou une <strong>leçon apprise</strong> : <em>which taught me a lot about…</em> (« ce qui m'a beaucoup appris sur »), <em>which is when I realised that…</em> (« c'est là que j'ai compris que »).</div>`,
  exercises: [
    { type: "qcm", q: "« Je travaille ici depuis 2019. » se traduit par :", opts: ["I work here since 2019", "I have worked here since 2019", "I am working here since 2019", "I worked here since 2019"], a: 1, exp: "« Depuis » + point de départ = present perfect. Le present simple est impossible ici." },
    { type: "qcm", q: "Pour un poste terminé et daté (2015–2018), on emploie :", opts: ["le present perfect", "le past simple", "le present continuous", "le futur"], a: 1, exp: "Action terminée et datée = past simple : I worked there from 2015 to 2018." },
    { type: "input", q: "Complète : « I ___ been working here for ten years. »", a: ["have"], ph: "auxiliaire", exp: "Present perfect continuous : have + been + V-ing." },
    { type: "qcm", q: "Que signifie <em>to be made redundant</em> ?", opts: ["être promu", "être licencié pour raison économique", "démissionner", "prendre sa retraite"], a: 1, exp: "Redundancy = licenciement économique, quand le poste est supprimé." },
    { type: "vf", q: "<em>Eventually</em> signifie « éventuellement, peut-être ».", a: false, exp: "Faux ami : eventually = « finalement, au bout du compte ». « Éventuellement » se dit possibly." },
    { type: "qcm", q: "« Donner sa démission » se dit :", opts: ["to be promoted", "to hand in one's notice", "to report to", "to take on"], a: 1, exp: "To hand in one's notice = remettre sa lettre de démission." },
    { type: "input", q: "Complète : « The turning ___ came when I was asked to lead a team. »", a: ["point"], ph: "un mot", exp: "The turning point = le tournant décisif." },
    { type: "qcm", q: "<em>I report to the marketing director.</em> signifie :", opts: ["Je dirige le directeur marketing", "Je dépends hiérarchiquement du directeur marketing", "Je remplace le directeur marketing", "J'ai licencié le directeur marketing"], a: 1, exp: "To report to someone = avoir cette personne comme supérieur direct." },
    { type: "qcm", q: "Quel connecteur exprime « au début » ?", opts: ["eventually", "initially", "ever since", "these days"], a: 1, exp: "Initially / at first = au début." },
    { type: "input", q: "Traduis « acquérir des compétences » : to ___ skills.", a: ["gain", "develop", "acquire"], ph: "un verbe", exp: "To gain / develop / acquire skills : acquérir des compétences." },
    { type: "vf", q: "<em>A steep learning curve</em> décrit un apprentissage difficile et rapide.", a: true, exp: "Une courbe d'apprentissage raide : on doit apprendre beaucoup, vite." },
    { type: "qcm", q: "Choisis la phrase correcte pour une activité qui continue :", opts: ["I am working here since 2020", "I have been working here since 2020", "I work here since 2020", "I worked here since 2020"], a: 1, exp: "Activité continue depuis une date = present perfect continuous." },
    { type: "qcm", q: "<em>I was promoted to team leader.</em> Le verbe est au passif car :", opts: ["c'est plus poli", "on subit l'action : c'est l'entreprise qui promeut", "c'est obligatoire au past simple", "promote n'a pas d'actif"], a: 1, exp: "Le passif met en avant celui qui reçoit l'action : on est promu par quelqu'un." },
    { type: "input", q: "Complète le connecteur : « ___ since then, I have worked in finance. » (depuis lors)", a: ["Ever"], ph: "un mot", exp: "Ever since (then) = depuis lors, marque une continuité." },
    { type: "qcm", q: "Meilleure façon d'introduire une leçon tirée d'une expérience :", opts: ["which taught me a lot about leadership", "eventually leadership", "since leadership", "I am leadership"], a: 0, exp: "« which taught me a lot about… » ajoute du relief et de la réflexion au récit." }
  ],
  final: {
    title: "Exercice final — Le parcours de Sophie",
    intro: `<p>Lisez cette présentation de parcours, puis répondez.</p>
<p><em>Sophie graduated in law but quickly realised that courtrooms were not for her. She started out as a legal assistant in a publishing house, where she discovered a passion for editing. After three years, she was made redundant when the company was restructured. Rather than looking for another legal job, she retrained as an editor. The turning point came when a bestselling author asked for her specifically. These days, she has been running her own editorial agency for over a decade and reports to no one but her clients.</em></p>`,
    questions: [
      { type: "qcm", q: "Sophie a-t-elle exercé le droit comme prévu ?", opts: ["Oui, toute sa carrière", "Non, elle a vite compris que ce n'était pas pour elle", "Elle est encore avocate", "Le texte ne le dit pas"], a: 1, exp: "« realised that courtrooms were not for her » : les tribunaux n'étaient pas faits pour elle." },
      { type: "qcm", q: "Pourquoi a-t-elle quitté son poste d'assistante juridique ?", opts: ["Elle a démissionné", "Elle a été licenciée lors d'une restructuration", "Elle a été promue", "Elle a pris sa retraite"], a: 1, exp: "« she was made redundant when the company was restructured » : licenciement économique." },
      { type: "qcm", q: "Quel a été le tournant de sa carrière ?", opts: ["Son diplôme de droit", "Sa reconversion", "Un auteur à succès qui l'a demandée nommément", "Son premier emploi"], a: 2, exp: "« a bestselling author asked for her specifically » : c'est le turning point mentionné." },
      { type: "vf", q: "Aujourd'hui, Sophie est salariée d'une grande maison d'édition.", a: false, exp: "« running her own editorial agency… reports to no one but her clients » : elle est à son compte." },
      { type: "qcm", q: "Quel temps est employé dans « she has been running her own agency for over a decade » ?", opts: ["past simple", "present perfect continuous", "present simple", "past continuous"], a: 1, exp: "has been running = present perfect continuous : activité commencée dans le passé et toujours en cours." }
    ],
    solution: `<p>Le récit de Sophie illustre les trois temps clés. <strong>Past simple</strong> pour les étapes terminées et datées : <em>graduated, started out, was made redundant, retrained</em>. <strong>Present perfect continuous</strong> pour la situation actuelle et durable : <em>has been running her own agency for over a decade</em>. On repère aussi les jalons du récit : le point de départ (<em>started out as</em>), le tournant (<em>the turning point came when</em>) et le présent (<em>these days</em>). Un bon parcours se raconte comme une histoire, avec des causes et des tournants, pas comme une simple liste de dates.</p>`
  }
};
</script>
