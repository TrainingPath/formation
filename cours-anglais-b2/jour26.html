<script>
var DAY = {
  num: 26,
  title: "Révisions de grammaire B2",
  subtitle: "Faire le point avant les projets finaux : temps, conditionnels, passif, modaux.",
  theory: `
<h3>1. Les temps : quand employer quoi ?</h3>
<pre class="pseudo">present perfect      lien avec le présent, expérience    I have visited Rome.
present perfect cont. action qui dure encore              I have been waiting for an hour.
past simple          action datée et terminée             I visited Rome in 2019.
past perfect         antériorité dans le passé            She had left before I arrived.</pre>
<div class="warn">Le past perfect (<em>had + participe</em>) marque une action <strong>antérieure</strong> à une autre action passée : <em>When I arrived, the train had already left</em> (le départ précède l'arrivée).</div>
<h3>2. Les trois conditionnels + le mixte</h3>
<pre class="pseudo">1er : If it rains, we'll cancel.               (réel / probable)
2e  : If I were rich, I would travel.          (irréel du présent)
3e  : If I had known, I would have come.       (irréel du passé)
mixte: If I had studied medicine, I would be a doctor now. (passé → présent)</pre>
<h3>3. Le passif et ses formes avancées</h3>
<pre class="pseudo">The house was built in 1900.        passif simple
The house is being renovated.       passif progressif
The report has been sent.           passif au present perfect
I had my car repaired.              faire faire (have something done)</pre>
<p>Rappel : <em>have/get something done</em> = faire faire quelque chose par quelqu'un d'autre. <em>I had my hair cut</em> = « je me suis fait couper les cheveux » (par un coiffeur).</p>
<h3>4. Wish, if only, et l'inversion</h3>
<pre class="pseudo">I wish I knew.            Si seulement je savais. (regret présent)
I wish I had known.       Si seulement j'avais su. (regret passé)
If only he would listen!  Si seulement il écoutait !
Never have I seen such a mess.   (inversion après never = insistance)
Not only did she win, but she also broke a record.</pre>
<div class="warn">Après un adverbe négatif en tête de phrase (never, hardly, not only, rarely), on <strong>inverse</strong> sujet et auxiliaire, comme dans une question : <em>Never have I…</em>, <em>Not only did she…</em>.</div>
<h3>5. Les modaux de déduction et le discours rapporté</h3>
<pre class="pseudo">must / can't / might have + participe   déduction sur le passé (jour 24)
Discours rapporté (recul d'un temps) :
"I am tired."   → He said he was tired.
"I will go."    → She said she would go.
"I have seen it."→ He said he had seen it.</pre>
<div class="tip">Le discours rapporté fait « reculer » les temps d'un cran : present → past, will → would, present perfect / past simple → past perfect. Les repères de temps changent aussi : now → then, today → that day, tomorrow → the next day.</div>`,
  exercises: [
    { type: "qcm", q: "« When I arrived, the film ___ already started. »", opts: ["has", "had", "was", "have"], a: 1, exp: "Past perfect (had started) : le film a commencé AVANT mon arrivée." },
    { type: "qcm", q: "« If I ___ rich, I would buy a boat. » (irréel du présent)", opts: ["am", "were", "will be", "had been"], a: 1, exp: "2e conditionnel : If I were… I would… (were à toutes les personnes)." },
    { type: "qcm", q: "« If I had known, I ___ come. » (irréel du passé)", opts: ["would", "will have", "would have", "had"], a: 2, exp: "3e conditionnel : If + past perfect, would have + participe." },
    { type: "input", q: "Passif : « They built the bridge in 1950. » → « The bridge ___ built in 1950. »", a: ["was"], ph: "auxiliaire", exp: "Passif au passé : was + participe." },
    { type: "qcm", q: "« I had my car ___ yesterday. » (faire réparer)", opts: ["repair", "repaired", "repairing", "to repair"], a: 1, exp: "Have something done : had my car repaired (participe passé)." },
    { type: "qcm", q: "« I wish I ___ the answer. » (regret présent : je ne le sais pas)", opts: ["know", "knew", "have known", "will know"], a: 1, exp: "Wish + past simple pour un regret sur le présent : I wish I knew." },
    { type: "input", q: "Regret passé : « I wish I ___ studied harder. » (auxiliaire)", a: ["had"], ph: "un auxiliaire", exp: "Wish + past perfect : I wish I had studied (regret sur le passé)." },
    { type: "qcm", q: "Inversion correcte après « Never » :", opts: ["Never I have seen such a thing", "Never have I seen such a thing", "Never I saw such a thing", "Never seen I have"], a: 1, exp: "Adverbe négatif en tête → inversion sujet/auxiliaire : Never have I seen…" },
    { type: "qcm", q: "« Not only ___ she win, but she also set a record. »", opts: ["did", "does", "has", "was"], a: 0, exp: "Not only + inversion : Not only did she win…" },
    { type: "qcm", q: "Discours rapporté : « I am tired » → « He said he ___ tired. »", opts: ["is", "was", "has been", "will be"], a: 1, exp: "Recul d'un temps : am → was." },
    { type: "input", q: "Rapporté : « I will call you » → « She said she ___ call me. »", a: ["would"], ph: "un modal", exp: "will → would dans le discours rapporté." },
    { type: "qcm", q: "« The report ___ been sent this morning. » (present perfect passif)", opts: ["is", "has", "was", "have"], a: 1, exp: "Present perfect passif : has been sent." },
    { type: "qcm", q: "Conditionnel mixte : « If I had taken that job, I ___ in London now. »", opts: ["would be", "would have been", "will be", "am"], a: 0, exp: "Cause passée → conséquence présente : would be now (mixte)." },
    { type: "qcm", q: "« The bridge ___ being repaired at the moment. » (passif progressif)", opts: ["is", "has", "was", "will"], a: 0, exp: "Passif progressif présent : is being repaired." },
    { type: "vf", q: "Dans « If only he would listen! », on exprime un souhait / un regret face à un comportement agaçant.", a: true, exp: "If only + would : souhait que quelqu'un change de comportement." }
  ],
  final: {
    title: "Exercice final — Grammaire en contexte",
    intro: `<p>Voici un petit récit truffé de structures B2. Lisez-le, puis identifiez les points de grammaire employés.</p>
<p><em>By the time the police arrived, the thief had already disappeared. If the neighbour had not heard a noise, no one would have noticed anything. The window was being repaired the next day, and the owner had all the locks changed. Never had the street seen so much excitement. The detective said that he would find the culprit — and he wished he had more clues to work with.</em></p>`,
    questions: [
      { type: "qcm", q: "« the thief had already disappeared » emploie :", opts: ["le present perfect", "le past perfect (antériorité)", "le passif", "le futur"], a: 1, exp: "Had disappeared = past perfect : action antérieure à l'arrivée de la police." },
      { type: "qcm", q: "« If the neighbour had not heard… no one would have noticed » est un :", opts: ["1er conditionnel", "2e conditionnel", "3e conditionnel (irréel du passé)", "conditionnel mixte"], a: 2, exp: "If + past perfect, would have + participe : 3e conditionnel." },
      { type: "qcm", q: "« The window was being repaired » est :", opts: ["un passif simple", "un passif progressif au passé", "un actif", "un present perfect"], a: 1, exp: "Was being repaired : passif progressif (action en cours dans le passé)." },
      { type: "qcm", q: "« the owner had all the locks changed » signifie :", opts: ["le propriétaire a changé lui-même les serrures", "le propriétaire a fait changer les serrures par quelqu'un", "les serrures étaient déjà changées", "le propriétaire va changer les serrures"], a: 1, exp: "Have something done : faire faire par un professionnel." },
      { type: "qcm", q: "« Never had the street seen so much excitement » illustre :", opts: ["le discours rapporté", "l'inversion après un adverbe négatif", "le passif", "un conditionnel"], a: 1, exp: "Never en tête → inversion : Never had the street seen…" }
    ],
    solution: `<p>Ce court récit condense l'essentiel du programme B2 : <strong>past perfect</strong> (<em>had disappeared</em>) pour l'antériorité, <strong>3e conditionnel</strong> (<em>If… had not heard… would have noticed</em>) pour l'irréel du passé, <strong>passif progressif</strong> (<em>was being repaired</em>), <strong>have something done</strong> (<em>had all the locks changed</em>), <strong>inversion</strong> (<em>Never had the street seen…</em>) et <strong>discours rapporté</strong> (<em>said that he would find… wished he had more clues</em>). Si vous reconnaissez et manipulez ces structures avec aisance, vous êtes prêt pour les projets finaux. La grammaire n'est pas une fin en soi : c'est l'outil qui vous permet de raconter, nuancer et déduire — exactement ce qu'exigent le fait divers, l'entretien et la conversation à venir.</p>`
  }
};
</script>

    solution: "Last winter, I lost my wallet on a busy train. By the time I noticed, the train had already left the station. If I had checked my bag earlier, I would have found it much sooner. Luckily, my wallet was handed in to the lost-property office by an honest passenger. The next day, I had my bank cards replaced just to be safe. Never had I been so relieved to get a phone call. Not only did I recover my money, but I also restored a little of my faith in people.\n\nTraduction et notes : « L'hiver dernier, j'ai perdu mon portefeuille dans un train bondé. Le temps que je m'en aperçoive, le train avait déjà quitté la gare. Si j'avais vérifié mon sac plus tôt, je l'aurais retrouvé bien plus vite. Heureusement, mon portefeuille a été rapporté au bureau des objets trouvés par un passager honnête. Le lendemain, j'ai fait remplacer mes cartes bancaires par précaution. Jamais je n'avais été aussi soulagé de recevoir un appel. Non seulement j'ai récupéré mon argent, mais j'ai aussi retrouvé un peu de ma foi en l'humanité. » Repérez : past perfect (had left), 3e conditionnel (If I had checked… I would have found), passifs (was handed in, had my cards replaced), inversions (Never had I been, Not only did I recover).",
