<script>
var DAY = {
  num: 2,
  title: "Le futur parfait et le futur continu",
  subtitle: "Se projeter avec précision : ce qui sera en cours, ce qui sera achevé.",
  theory: `
<h3>1. Au-delà de « will »</h3>
<p>Au niveau B2, exprimer le futur ne se limite plus à <em>will</em> et à <em>be going to</em>. Deux formes plus fines permettent de se projeter avec précision : le <strong>futur continu</strong> (will be + -ing) et le <strong>futur parfait</strong> (will have + participe passé). Elles répondent à des questions différentes : « que serai-je en train de faire ? » et « qu'aurai-je terminé ? ».</p>
<h3>2. Le futur continu : une action en cours à un moment futur</h3>
<p>Le <strong>futur continu</strong> décrit une action qui sera <strong>en train de se dérouler</strong> à un instant futur donné. On l'utilise aussi pour parler d'un futur « prévu dans le cours normal des choses », sans intention explicite.</p>
<pre class="pseudo">This time tomorrow, I will be flying to Berlin.
-> Demain a cette heure-ci, je serai en train de voler vers Berlin.
Don't call at 8, we will be having dinner.
-> N'appelle pas a 20h, nous serons en train de diner.
Will you be using the car tonight?
-> Vas-tu utiliser la voiture ce soir ? (question polie, sans pression)</pre>
<div class="tip">Le futur continu adoucit une question : « Will you be joining us? » sonne plus poli et moins intrusif que « Will you join us? », car il présente l'action comme un simple déroulement attendu.</div>
<h3>3. Le futur parfait : une action achevée avant un moment futur</h3>
<p>Le <strong>futur parfait</strong> exprime qu'une action sera <strong>terminée</strong> avant un point de repère futur. Il s'accompagne souvent de <em>by</em> (by then, by 2030, by the time…).</p>
<pre class="pseudo">By next June, I will have finished my degree.
-> D'ici juin prochain, j'aurai termine mes etudes.
By the time you arrive, we will have cleaned everything.
-> Le temps que tu arrives, nous aurons tout nettoye.
In ten years, this technology will have changed our lives.
-> Dans dix ans, cette technologie aura change nos vies.</pre>
<div class="warn">Attention à <em>by</em> et <em>until</em>. <em>By</em> = « au plus tard à » (point limite, souvent avec le futur parfait). <em>Until</em> = « jusqu'à » (durée continue). « I will have left by 6 » (parti au plus tard à 6h) est très différent de « I will stay until 6 » (je reste jusqu'à 6h).</div>
<h3>4. Le futur parfait continu (pour aller plus loin)</h3>
<p>Le <strong>futur parfait continu</strong> (will have been + -ing) souligne la <strong>durée</strong> d'une action jusqu'à un point futur. Il est plus rare mais très expressif.</p>
<pre class="pseudo">By December, I will have been working here for ten years.
-> En decembre, cela fera dix ans que je travaille ici.</pre>
<h3>5. Après les conjonctions de temps : pas de « will »</h3>
<p>Règle-clé pour les francophones : après <em>when, as soon as, until, before, after, by the time</em>, on n'emploie <strong>pas</strong> <em>will</em>. On utilise le présent (ou le present perfect), même si le sens est futur.</p>
<pre class="pseudo">When I arrive, I will call you.       (et non : When I will arrive...)
-> Quand j'arriverai, je t'appellerai.
As soon as she has finished, we will leave.
-> Des qu'elle aura fini, nous partirons.</pre>
<div class="tip">Le français met le futur des deux côtés (« quand j'arriverai »), l'anglais non : le futur ne s'exprime qu'une fois, dans la principale.</div>`,
  exercises: [
    { type: "qcm", q: "« This time next week, I ___ on a beach. »", opts: ["will lie", "will be lying", "will have lain", "lie"], a: 1, exp: "Action en cours à un moment futur précis : futur continu, will be lying." },
    { type: "qcm", q: "« By 2030, scientists ___ a cure. »", opts: ["will find", "will be finding", "will have found", "find"], a: 2, exp: "Action achevée avant un point futur (by 2030) : futur parfait." },
    { type: "input", q: "Complète : « Don't phone at nine, we ___ (watch) the match. »", a: ["will be watching", "'ll be watching"], ph: "will be + verbe", exp: "Action en cours à 21h : futur continu, will be watching." },
    { type: "input", q: "Complète : « By the time you read this, I ___ (leave). »", a: ["will have left", "'ll have left"], ph: "will have + participe", exp: "Action achevée avant que tu lises : futur parfait, will have left." },
    { type: "vf", q: "« When I will finish, I will call you » est correct.", a: false, exp: "Après « when », pas de « will » : « When I finish, I will call you »." },
    { type: "qcm", q: "Quelle nuance apporte « by » dans « I will have left by 6 » ?", opts: ["Je reste jusqu'à 6h", "Je serai parti au plus tard à 6h", "Je pars exactement à 6h", "Je pars après 6h"], a: 1, exp: "« by » marque une limite : parti au plus tard à cette heure-là." },
    { type: "qcm", q: "« ___ you be using your laptop later? » (question polie)", opts: ["Will", "Would", "Do", "Are"], a: 0, exp: "Futur continu poli : « Will you be using… »." },
    { type: "input", q: "Complète : « As soon as she ___ (arrive), we will start. »", a: ["arrives"], ph: "un mot", exp: "Après « as soon as », présent : arrives." },
    { type: "qcm", q: "« By June, I ___ here for five years. » (durée soulignée)", opts: ["will work", "will be working", "will have been working", "have worked"], a: 2, exp: "Durée jusqu'à un point futur : futur parfait continu." },
    { type: "input", q: "Complète : « Before you ___ (finish), I will have prepared lunch. »", a: ["finish"], ph: "un mot", exp: "Après « before », présent : finish (pas will finish)." },
    { type: "vf", q: "« Will you be joining us? » est une manière plus polie que « Will you join us? ».", a: true, exp: "Le futur continu présente l'action comme un simple déroulement, ce qui adoucit la question." },
    { type: "qcm", q: "« Until » signifie…", opts: ["au plus tard à", "jusqu'à (durée continue)", "avant", "après"], a: 1, exp: "« until » exprime une durée qui continue jusqu'à un point ; « by » une limite." },
    { type: "input", q: "Complète : « In two hours, the plane ___ (land). » (achevé avant ce moment)", a: ["will have landed", "'ll have landed"], ph: "will have + participe", exp: "Action terminée d'ici deux heures : futur parfait." },
    { type: "qcm", q: "Choisis : « I hope it ___ raining by the time we go out. »", opts: ["will stop", "will have stopped", "stops", "will be stopping"], a: 1, exp: "L'arrêt sera accompli avant le moment de sortir : futur parfait, will have stopped." },
    { type: "vf", q: "Après « by the time », on utilise « will ».", a: false, exp: "Comme les autres conjonctions de temps, « by the time » est suivi du présent : « By the time you arrive… »." }
  ],
  final: {
    title: "Exercice final — Une lettre de projection",
    intro: `<p>Read this excerpt from a letter a graduate writes to her future self.</p>
<p>Dear future me, by the time you open this letter, five years will have passed. I wonder where you will be living and what you will be doing. If everything goes to plan, you will have graduated, you will have found a stable job, and perhaps you will have travelled to at least three new countries. Right now, as I write, I am sitting in my tiny student room, and I keep imagining the person you will have become. When you read these words, you will probably be smiling at how naive I sound. By next December, I will have been studying for six years without a real break, so I hope you have finally learned to rest. Until you reach that point, keep going. I will not stop dreaming until every one of these goals has come true.</p>`,
    questions: [
      { type: "qcm", q: "« five years will have passed » exprime…", opts: ["une action en cours", "une action achevée avant un moment futur", "une habitude", "un passé"], a: 1, exp: "Futur parfait : les cinq ans seront écoulés d'ici l'ouverture de la lettre." },
      { type: "qcm", q: "« what you will be doing » utilise le futur continu pour…", opts: ["une action achevée", "une action qui sera en cours à ce moment futur", "une habitude passée", "un ordre"], a: 1, exp: "Futur continu : l'action sera en déroulement à ce moment-là." },
      { type: "vf", q: "« By next December, I will have been studying for six years » souligne la durée jusqu'à un point futur.", a: true, exp: "Futur parfait continu : insistance sur la durée accumulée." },
      { type: "qcm", q: "« When you read these words » n'emploie pas « will » parce que…", opts: ["c'est une erreur", "après « when », on met le présent", "c'est du passé", "read est irrégulier"], a: 1, exp: "Après une conjonction de temps, présent obligatoire même pour un sens futur." },
      { type: "qcm", q: "« until every one of these goals has come true » : quelle forme suit « until » ?", opts: ["will + base", "le present perfect", "le prétérit", "le futur parfait"], a: 1, exp: "Après « until », pas de « will » : ici present perfect (has come true)." }
    ],
    solution: `<p>Le texte combine toutes les formes du futur :</p>
<pre class="pseudo">will have passed / will have graduated / will have found / will have become
   -> futur parfait : actions achevees avant un repere futur
will be living / will be doing / will be smiling
   -> futur continu : actions en cours a un moment futur
will have been studying
   -> futur parfait continu : duree accumulee
when you read / until ... has come true
   -> pas de will apres les conjonctions de temps</pre>
<p>Se projeter avec précision, c'est distinguer « ce qui sera en train de se faire » (continu) de « ce qui sera déjà fait » (parfait), tout en respectant la règle : jamais de <em>will</em> après <em>when</em>, <em>until</em>, <em>as soon as</em>.</p>`
  }
};
</script>

    hints: [
      "Pour ce qui sera en cours : « I will be working… », « I will be living… ».",

    ],
    solution: "In five years, I hope my life will look very different. By the time I turn thirty, I will have completed my studies and I will have gained real professional experience. If all goes well, I will be working in a field I genuinely enjoy, probably in a big city. By then, I will also have saved enough money to travel more freely. This time in five years, I imagine I will be planning my next adventure rather than worrying about exams. As soon as I feel settled, I will start giving back to my community.\n\nTraduction : Dans cinq ans, j'espere que ma vie sera tres differente. Le temps que j'aie trente ans, j'aurai termine mes etudes et j'aurai acquis une vraie experience professionnelle. Si tout va bien, je travaillerai dans un domaine que j'apprecie vraiment, sans doute dans une grande ville. D'ici la, j'aurai aussi economise assez d'argent pour voyager plus librement. Dans cinq ans a cette periode, j'imagine que je serai en train de planifier ma prochaine aventure plutot que de m'inquieter des examens. Des que je me sentirai installe, je commencerai a rendre a ma communaute.",
    note: "Observe : « will have completed / gained / saved » (parfait, actions achevées) contraste avec « will be working / will be planning » (continu, actions en cours). Après « as soon as » : présent (I feel), pas de will." }
  ]
};
</script>
