<script>
var DAY = {
  num: 23,
  title: "Synthétiser un texte",
  subtitle: "Extraire l'essentiel : reformuler sans copier, condenser sans trahir.",
  theory: `
<h3>1. Résumer, ce n'est pas recopier</h3>
<p>La <strong>synthèse</strong> (en anglais <em>summarising</em>) consiste à réduire un texte à ses idées essentielles, avec <strong>vos propres mots</strong>. Trois règles d'or : (1) garder uniquement les idées principales, (2) reformuler (ne pas copier des phrases entières), (3) rester fidèle et neutre (ne pas ajouter son avis). Un bon résumé fait environ un tiers de l'original.</p>
<div class="warn">Copier des phrases mot pour mot n'est PAS une synthèse : c'est du plagiat. L'exercice consiste précisément à <strong>reformuler</strong> avec un vocabulaire différent.</div>
<h3>2. Étape 1 : repérer les idées principales</h3>
<p>Distinguez l'<strong>essentiel</strong> (idées, arguments) de l'<strong>accessoire</strong> (exemples, chiffres de détail, répétitions). Dans chaque paragraphe, cherchez la <em>topic sentence</em>. Supprimez : les exemples secondaires, les statistiques précises, les répétitions, les formules de style.</p>
<h3>3. Étape 2 : reformuler</h3>
<p>Remplacez les mots par des <strong>synonymes</strong> et changez la <strong>structure</strong> des phrases.</p>
<pre class="pseudo">Original : Companies are increasingly allowing staff to work from home.
Synthèse : More and more firms let employees work remotely.

Original : The results surprised many observers.
Synthèse : The outcome was unexpected.</pre>
<h3>4. Étape 3 : relier avec des connecteurs</h3>
<p>Une synthèse fluide relie les idées au lieu de les juxtaposer.</p>
<pre class="pseudo">to summarise            pour résumer
overall                 dans l'ensemble
the main point is       l'idée principale est que
according to the text   d'après le texte
the author argues that  l'auteur soutient que
in short                en bref
firstly / secondly      premièrement / deuxièmement
whereas                 tandis que</pre>
<h3>5. Les verbes introducteurs</h3>
<p>Pour rapporter les idées sans les faire vôtres, employez des <strong>verbes de compte rendu</strong> : <em>the author states / argues / claims / points out / suggests / concludes that…</em> (« l'auteur affirme / soutient / prétend / souligne / suggère / conclut que »).</p>
<div class="tip">Test du bon résumé : quelqu'un qui n'a pas lu l'original doit comprendre les idées principales grâce à votre synthèse seule — sans détails inutiles, et sans que vous ayez copié une seule phrase entière.</div>`,
  exercises: [
    { type: "qcm", q: "Quel est le premier objectif d'une synthèse ?", opts: ["Copier le texte fidèlement", "Garder uniquement les idées essentielles avec ses propres mots", "Ajouter son opinion", "Rallonger le texte"], a: 1, exp: "Synthétiser = condenser les idées principales en reformulant." },
    { type: "vf", q: "Recopier des phrases entières de l'original est une bonne technique de synthèse.", a: false, exp: "C'est du plagiat : il faut reformuler avec ses propres mots." },
    { type: "qcm", q: "Que doit-on SUPPRIMER en priorité dans une synthèse ?", opts: ["les idées principales", "les exemples secondaires et les détails chiffrés", "les connecteurs logiques", "le sujet du texte"], a: 1, exp: "On élimine l'accessoire : exemples, statistiques de détail, répétitions." },
    { type: "input", q: "Reformule « firms » par un synonyme courant : ___.", a: ["companies", "businesses"], ph: "un mot", exp: "Firms = companies = businesses." },
    { type: "qcm", q: "Quelle longueur vise un bon résumé, environ ?", opts: ["la même que l'original", "un tiers de l'original", "le double", "deux phrases maximum toujours"], a: 1, exp: "Environ un tiers : assez court, mais complet sur les idées." },
    { type: "qcm", q: "Où trouve-t-on souvent l'idée principale d'un paragraphe ?", opts: ["dans la dernière note de bas de page", "dans la topic sentence, souvent en début de paragraphe", "jamais visible", "dans le titre uniquement"], a: 1, exp: "La topic sentence résume l'idée du paragraphe." },
    { type: "input", q: "Complète le connecteur : « ___, the four-day week has both benefits and risks. » (Dans l'ensemble)", a: ["Overall"], ph: "un mot", exp: "Overall = dans l'ensemble." },
    { type: "qcm", q: "Quel verbe introduit une idée rapportée sans l'endosser ?", opts: ["I love", "the author argues", "I promise", "you must"], a: 1, exp: "« the author argues that… » rapporte sans donner son propre avis." },
    { type: "qcm", q: "Reformulation correcte de « The results surprised many observers » :", opts: ["Results surprised observers many", "The outcome was unexpected", "Many observers", "The results surprised many observers again"], a: 1, exp: "On change les mots ET la structure : « The outcome was unexpected »." },
    { type: "vf", q: "Une synthèse doit rester neutre et ne pas ajouter l'avis du rédacteur.", a: true, exp: "Fidélité et neutralité : on rapporte les idées de l'auteur, pas les siennes." },
    { type: "input", q: "Traduis le connecteur « tandis que » : ___.", a: ["whereas", "while"], ph: "un mot", exp: "Whereas / while = tandis que (contraste)." },
    { type: "qcm", q: "Que signifie « in short » ?", opts: ["en détail", "en bref", "en retard", "en désordre"], a: 1, exp: "In short = en bref, pour résumer." },
    { type: "qcm", q: "Lequel de ces éléments est ESSENTIEL (à garder) ?", opts: ["un exemple anecdotique", "la thèse de l'auteur", "une statistique précise à la décimale", "une répétition stylistique"], a: 1, exp: "La thèse est le cœur du texte : elle doit figurer dans le résumé." },
    { type: "qcm", q: "Le test du bon résumé, c'est :", opts: ["qu'il soit plus long que l'original", "qu'un lecteur qui n'a pas lu l'original comprenne les idées principales", "qu'il contienne toutes les statistiques", "qu'il recopie l'introduction"], a: 1, exp: "Un résumé réussi transmet l'essentiel à qui n'a pas lu la source." },
    { type: "qcm", q: "Reformulation la plus concise de « Companies are increasingly allowing staff to work from home » :", opts: ["Companies increasingly allow their staff members to work from their homes", "More and more firms let employees work remotely", "Staff work from home in companies increasingly", "Companies allow work"], a: 1, exp: "Synonymes (firms, remotely) et structure resserrée : c'est une vraie synthèse." }
  ],
  final: {
    title: "Exercice final — Synthétiser un texte court",
    intro: `<p>Lisez ce texte, puis répondez aux questions sur la manière de le synthétiser.</p>
<p><em>Many cities are rethinking the way people move around. In several European capitals, cars are being pushed out of the centre and replaced by bike lanes, wider pavements and green spaces. Supporters say this reduces pollution and makes streets safer for children. Local shop owners, however, sometimes complain that fewer cars mean fewer customers. Studies from cities like Paris and Copenhagen suggest that, after an initial period of adjustment, most residents actually prefer the quieter, cleaner streets. The main lesson seems to be that change is difficult at first, but often welcomed once people get used to it.</em></p>`,
    questions: [
      { type: "qcm", q: "Quelle est l'idée principale du texte ?", opts: ["Les voitures sont indispensables", "Des villes réduisent la place de la voiture au centre, avec des effets globalement positifs", "Les commerçants ont toujours raison", "Paris est la plus belle ville"], a: 1, exp: "L'idée centrale : réduire la voiture en ville, avec un bilan finalement positif." },
      { type: "qcm", q: "Quel détail pourrait être SUPPRIMÉ dans une synthèse ?", opts: ["l'idée que la voiture recule en ville", "les noms précis Paris et Copenhague comme exemples", "le fait que le changement est d'abord difficile", "l'avis des commerçants"], a: 1, exp: "Les exemples précis peuvent être condensés en « certaines villes »." },
      { type: "qcm", q: "Quelle objection le texte rapporte-t-il ?", opts: ["Les vélos polluent", "Certains commerçants craignent de perdre des clients", "Les enfants n'aiment pas marcher", "Les rues sont trop propres"], a: 1, exp: "« shop owners… complain that fewer cars mean fewer customers »." },
      { type: "vf", q: "Une bonne synthèse de ce texte doit conserver la nuance : difficile au début, mais souvent apprécié ensuite.", a: true, exp: "C'est la conclusion du texte, une idée essentielle à garder." },
      { type: "qcm", q: "Meilleure phrase de synthèse pour ce texte :", opts: ["Paris and Copenhagen are cities in Europe with shops", "Several cities are reducing car use in their centres; despite some concerns from shopkeepers, most residents end up preferring the calmer streets", "Cars are bad and bikes are good, everyone agrees", "The text talks about many things"], a: 1, exp: "Elle garde l'idée principale, l'objection et la nuance finale, en reformulant." }
    ],
    solution: `<p>Pour synthétiser ce texte, on garde : l'idée centrale (des villes réduisent la place de la voiture), l'argument pour (moins de pollution, plus de sécurité), l'objection (les commerçants inquiets) et la conclusion nuancée (difficile au début, apprécié ensuite). On supprime : les exemples précis (Paris, Copenhague), qui deviennent « certaines villes ». On reformule : <em>bike lanes, wider pavements</em> → « des aménagements pour les piétons et les vélos ». Résumé possible : <em>Several cities are reducing car use in their centres. Although some shopkeepers worry about losing customers, most residents eventually prefer the cleaner, safer streets. The main point is that such changes are hard at first but often welcomed later.</em> Trois idées, aucune phrase copiée, tout l'essentiel préservé.</p>`
  }
};
</script>
