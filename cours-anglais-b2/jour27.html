var DAY = {

  title: "Projet final (1) : lire un fait divers de 2 pages",
  subtitle: "Le grand récit — première moitié : le crime et le début de l'enquête.",
  theory: `
<h3>Le projet final : un vrai fait divers de deux pages</h3>
<p>Voici le cœur de tout ce cours : un fait divers original et complet, d'environ deux pages, que vous allez lire en deux jours. Aujourd'hui, la <strong>première moitié</strong> : le cambriolage d'une bijouterie et le début de l'enquête. Demain, la seconde moitié révélera comment un détail totalement insolite fera tomber le coupable. Lisez lentement, savourez, et servez-vous de l'aide au vocabulaire placée sous le texte. Ne cherchez pas à tout comprendre du premier coup : visez le sens global, puis relisez pour les détails.</p>
<h3>A Print in the Concrete — Part One</h3>
<p><em>It was just past three in the morning when the alarm at Merrifield &amp; Sons went off, but by the time the security company called the police, the shop was already empty of its most valuable pieces. Merrifield &amp; Sons was the oldest jeweller in Ashbourne, a small market town in the north of England, and for four generations the same family had sold engagement rings and pocket watches from the same narrow shop on the high street.</em></p>
<p><em>Detective Sergeant Priya Sharma arrived at half past three, a paper cup of coffee in her hand, expecting a routine break-in. What she found puzzled her from the very first minute. The front door was untouched, the windows were intact, and the alarm — an old but reliable model — had only been triggered when the thief opened the safe itself. Whoever had done this knew the shop well.</em></p>
<p><em>"This wasn't a smash-and-grab," she told the young constable beside her. "Somebody took their time." The display cases had been opened, not broken. The cheaper jewellery near the window had been left behind, while the rare antique watches, worth tens of thousands of pounds, had vanished. The safe, hidden behind a portrait of old Mr Merrifield, had been opened with the correct combination. There were no fingerprints, no forced entry, and no sign of how the burglar had come and gone.</em></p>
<p><em>The owner, Thomas Merrifield, was a nervous man in his sixties who arrived in his dressing gown, pale and shaking. He insisted that only three people had ever known the safe combination: himself, his sister, and his late father. "My father passed away in March," he said quietly. "And my sister lives in Australia." Sharma noted this down but said nothing.</em></p>
<p><em>The CCTV camera above the door had been sprayed with black paint, but only at ten minutes past two — long before the alarm went off. That detail bothered her: the thief had disabled the camera, then waited almost an hour before touching the safe. Why the delay? Outside, the rain that had fallen all night had washed the pavement clean, erasing any footprints the burglar might have left on the high street.</em></p>
<p><em>Sharma walked around to the back of the building, where a narrow alley separated the shop from a row of houses that were being renovated. Scaffolding covered the nearest house, and a skip full of rubble stood in the alley. It was there, crouching in the grey morning light, that she noticed something odd. A single work glove lay in a puddle, soaked and muddy, as if it had been dropped in a hurry. She photographed it, bagged it, and carried on. By seven o'clock, the town was waking up, and word of the robbery had already spread through the cafés and shops. Sharma knew that in a place as small as Ashbourne, everyone would soon have a theory — and that the truth was usually stranger than any of them.</em></p>
<h3>Aide au vocabulaire</h3>
<pre class="pseudo">to go off              se déclencher (alarme)
a break-in             un cambriolage, une effraction
a smash-and-grab       un vol éclair (vitrine brisée)
to take one's time     prendre son temps
display cases          les vitrines d'exposition
forced entry           l'effraction (entrée forcée)
the safe               le coffre-fort
one's late father      son défunt père
to pass away           décéder
to be triggered        être déclenché
to spray               asperger, taguer
scaffolding            un échafaudage
a skip                 une benne à gravats
rubble                 les gravats
a work glove           un gant de travail
a puddle               une flaque
to bag (evidence)      mettre sous scellés</pre>
<div class="tip">Notez les indices que l'auteur sème pour la suite : la caméra taguée une heure trop tôt, l'absence d'effraction, le gant abandonné dans l'allée, les maisons en rénovation. Retenez-les : demain, ils prendront tout leur sens.</div>`,
  exercises: [
    { type: "qcm", q: "Quel commerce a été cambriolé ?", opts: ["Une banque", "La plus vieille bijouterie d'Ashbourne", "Une boulangerie", "Un magasin d'échafaudages"], a: 1, exp: "« Merrifield & Sons was the oldest jeweller in Ashbourne »." },
    { type: "qcm", q: "Pourquoi Sharma est-elle intriguée dès le début ?", opts: ["La porte était fracturée", "Il n'y avait ni effraction ni traces : le voleur connaissait bien la boutique", "Le voleur a laissé sa carte d'identité", "L'alarme n'a jamais sonné"], a: 1, exp: "« The front door was untouched… Whoever had done this knew the shop well. »" },
    { type: "qcm", q: "Qu'est-ce qui a été volé, précisément ?", opts: ["Les bijoux bon marché de la vitrine", "Les montres anciennes de grande valeur", "De l'argent liquide", "Rien du tout"], a: 1, exp: "« the rare antique watches… had vanished », les bijoux bon marché ayant été laissés." },
    { type: "qcm", q: "Comment le coffre a-t-il été ouvert ?", opts: ["À l'explosif", "Avec la bonne combinaison", "Avec une perceuse", "Il était déjà ouvert"], a: 1, exp: "« had been opened with the correct combination »." },
    { type: "input", q: "Qui, selon Thomas Merrifield, connaissait la combinaison ? Lui-même, sa sœur et son ___ père.", a: ["défunt", "feu"], ph: "un adjectif", exp: "« his late father » : son défunt père, décédé en mars." },
    { type: "vf", q: "La sœur de Thomas Merrifield vit en Australie.", a: true, exp: "« my sister lives in Australia »." },
    { type: "qcm", q: "Qu'est-il arrivé à la caméra de surveillance ?", opts: ["Elle a filmé le voleur", "Elle a été aspergée de peinture noire à 2 h 10", "Elle est tombée en panne toute seule", "Elle n'existait pas"], a: 1, exp: "« The CCTV camera… had been sprayed with black paint… at ten minutes past two »." },
    { type: "qcm", q: "Qu'est-ce qui « dérange » Sharma à propos du minutage ?", opts: ["Le voleur a agi trop vite", "Le voleur a neutralisé la caméra puis a attendu presque une heure avant le coffre", "L'alarme a sonné avant le vol", "La police est arrivée trop tôt"], a: 1, exp: "« the thief had disabled the camera, then waited almost an hour… Why the delay? »" },
    { type: "qcm", q: "Pourquoi n'y a-t-il pas d'empreintes de pas sur le trottoir ?", opts: ["Le voleur volait", "La pluie de la nuit avait tout lavé", "Le trottoir venait d'être refait", "Il n'a pas plu"], a: 1, exp: "« the rain… had washed the pavement clean, erasing any footprints »." },
    { type: "input", q: "Dans l'allée, Sharma trouve un seul objet suspect : un ___ de travail. (traduis work glove)", a: ["gant"], ph: "un mot", exp: "« A single work glove lay in a puddle » : un gant de travail." },
    { type: "qcm", q: "Que sépare l'allée à l'arrière de la bijouterie ?", opts: ["Une rivière", "Une rangée de maisons en cours de rénovation", "Un parking", "Une école"], a: 1, exp: "« a narrow alley separated the shop from a row of houses being renovated »." },
    { type: "qcm", q: "Que signifie <em>a break-in</em> ?", opts: ["une pause", "un cambriolage / une effraction", "une négociation", "une panne"], a: 1, exp: "A break-in = un cambriolage, une entrée par effraction." },
    { type: "qcm", q: "Que veut dire <em>to pass away</em> ?", opts: ["passer devant", "décéder", "s'évanouir", "réussir"], a: 1, exp: "To pass away = décéder (formule adoucie)." },
    { type: "vf", q: "L'auteur laisse entendre que la vérité sera plus étrange que toutes les théories du village.", a: true, exp: "« the truth was usually stranger than any of them » : une promesse de retournement." },
    { type: "qcm", q: "Pourquoi Sharma parle-t-elle de « smash-and-grab » qu'elle écarte aussitôt ?", opts: ["Le voleur a tout cassé", "Justement, rien n'était cassé : le vol était soigné, méthodique", "Elle s'est trompée de scène", "C'était un vol à l'étalage"], a: 1, exp: "« This wasn't a smash-and-grab… Somebody took their time. » Le contraire d'un vol brutal." }
  ],
  final: {
    title: "Exercice final — Poser les bonnes questions",
    intro: `<p>Comme tout bon enquêteur, dressez la liste des <strong>zones d'ombre</strong> de cette première moitié. Ce sont ces questions que la seconde partie (jour 28) viendra résoudre.</p>
<p><em>Reminder of the puzzling facts: no forced entry, the correct safe combination was used, the camera was disabled an hour too early, a work glove was left in the alley behind houses under renovation, and only three people supposedly knew the combination — one dead, one abroad.</em></p>`,
    questions: [
      { type: "qcm", q: "Quel fait suggère que le voleur connaissait personnellement la boutique ?", opts: ["Il a cassé la vitrine", "Il a ouvert le coffre avec la bonne combinaison, sans effraction", "Il a volé au hasard", "Il a laissé une lettre"], a: 1, exp: "Combinaison exacte + aucune effraction = connaissance intime des lieux." },
      { type: "qcm", q: "Pourquoi le gant dans l'allée est-il un indice prometteur ?", opts: ["Il est à la mode", "Il a peut-être été perdu par le voleur en fuite, près des maisons en travaux", "Il appartient au policier", "Il n'a aucun intérêt"], a: 1, exp: "« as if it had been dropped in a hurry » : un objet possiblement lié à la fuite." },
      { type: "qcm", q: "Quelle contradiction pèse sur la liste des personnes connaissant la combinaison ?", opts: ["Elles sont trop nombreuses", "Sur trois personnes, l'une est morte et l'autre à l'étranger : qui reste-t-il ?", "Personne ne la connaissait", "Elles ont toutes un alibi"], a: 1, exp: "Le père est décédé, la sœur est en Australie : la logique cloche, il manque quelqu'un." },
      { type: "vf", q: "Le décor des maisons en rénovation (échafaudage, benne) sera sans doute important pour la suite.", a: true, exp: "L'auteur insiste dessus : un bon lecteur garde ce décor en mémoire." },
      { type: "qcm", q: "Quelle est la principale énigme non résolue à ce stade ?", opts: ["La couleur du coffre", "Comment le voleur est entré et reparti sans laisser de trace, et qui connaissait la combinaison", "Le nom du policier", "L'heure d'ouverture de la boutique"], a: 1, exp: "L'absence de trace d'entrée/sortie et le mystère de la combinaison sont au cœur de l'énigme." }
    ],
    solution: `<p>À la fin de cette première moitié, un bon lecteur a repéré une série d'indices soigneusement disposés : (1) <strong>aucune effraction</strong> et une <strong>combinaison exacte</strong> → le coupable connaît intimement la boutique ; (2) une <strong>caméra neutralisée une heure trop tôt</strong> → un minutage étrange à expliquer ; (3) un <strong>gant abandonné</strong> dans l'allée, près de maisons en <strong>rénovation</strong> → une piste physique ; (4) une liste de suspects <strong>incohérente</strong> (père décédé, sœur à l'étranger). Un fait divers bien construit ne livre jamais tout d'un coup : il sème des questions. Demain, la seconde moitié montrera comment un détail que personne n'était censé remarquer — une simple flaque de béton frais — fera s'effondrer le plan le plus soigné.</p>`
  }
};

    hints: [

    solution: "Since there was no forced entry and the safe was opened with the right combination, the thief must have known the shop very well. It can't have been a random burglar, because a stranger would not have known where the safe was hidden or how to open it. The father can't have done it either, as he passed away in March, and the sister is in Australia, so somebody else must have learned the combination at some point. The glove in the alley suggests that the thief might have escaped through the building site behind the shop. The camera was disabled an hour too early, which could mean the burglar had to wait for a reason we do not yet understand.\n\nTraduction et notes : « Comme il n'y avait pas d'effraction et que le coffre a été ouvert avec la bonne combinaison, le voleur devait très bien connaître la boutique. Ça ne peut pas avoir été un cambrioleur au hasard, car un inconnu n'aurait pas su où était caché le coffre ni comment l'ouvrir. Le père ne peut pas l'avoir fait non plus, puisqu'il est décédé en mars, et la sœur est en Australie, donc quelqu'un d'autre a forcément appris la combinaison à un moment. Le gant dans l'allée suggère que le voleur a peut-être fui par le chantier derrière la boutique. La caméra a été neutralisée une heure trop tôt, ce qui pourrait signifier que le cambrioleur a dû attendre pour une raison que nous ne comprenons pas encore. » Repérez must have (certitude), can't have (impossibilité), might/could have (possibilité) — tout le jour 24 mis en pratique.",
    note: "Émettre des hypothèses fondées sur des indices, en graduant sa certitude, est une compétence B2 essentielle. Gardez vos hypothèses : demain, vous vérifierez lesquelles étaient justes." }
  ]
};
