<script>
var DAY = {
  num: 4,
  title: "Le passif avancé (have something done...)",
  subtitle: "Déplacer le regard : le passif, le passif à deux compléments et le causatif.",
  theory: `
<h3>1. À quoi sert le passif ?</h3>
<p>Le <strong>passif</strong> (be + participe passé) met en avant l'action ou celui qui la subit, plutôt que celui qui la fait. On l'emploie quand l'auteur est inconnu, évident, ou peu important, et dans les registres formels (rapports, presse, science).</p>
<pre class="pseudo">Actif  : The company fired 200 workers. -> L'entreprise a licencie 200 salaries.
Passif : 200 workers were fired.        -> 200 salaries ont ete licencies.
Passif : The bridge was built in 1890.  -> Le pont a ete construit en 1890.</pre>
<div class="tip">Pour préciser l'auteur, on ajoute <em>by</em> : « The novel was written <strong>by</strong> a teenager. » Mais souvent on l'omet justement parce qu'il n'importe pas.</div>
<h3>2. Le passif à tous les temps</h3>
<p>On conjugue simplement le verbe <em>be</em> au temps voulu, suivi du participe passé.</p>
<pre class="pseudo">Present simple : English is spoken here.        -> On parle anglais ici.
Present perfect : The report has been sent.     -> Le rapport a ete envoye.
Preterit : The window was broken.               -> La fenetre a ete cassee.
Futur : The results will be published.          -> Les resultats seront publies.
Modal : The problem must be solved.             -> Le probleme doit etre resolu.
Continu : The road is being repaired.           -> La route est en train d'etre reparee.</pre>
<h3>3. Le passif à deux compléments</h3>
<p>Certains verbes (give, send, offer, tell, show, pay, teach) ont deux compléments : une personne et une chose. On peut alors former <strong>deux passifs</strong>. L'anglais préfère souvent commencer par la personne.</p>
<pre class="pseudo">Actif   : They gave Anna a prize.
Passif 1 : Anna was given a prize.   -> On a remis un prix a Anna. (plus naturel)
Passif 2 : A prize was given to Anna.
They offered me the job. -> I was offered the job. (On m'a propose le poste.)</pre>
<div class="warn">Le français n'a pas cette construction : « I was given a book » se traduit par « On m'a donné un livre » et non « Je fus donné un livre ». Ne calque pas le français.</div>
<h3>4. Le causatif : have / get something done</h3>
<p>La structure <strong>have + objet + participe passé</strong> signifie « faire faire quelque chose par quelqu'un d'autre ». On ne fait pas l'action soi-même : on la fait réaliser.</p>
<pre class="pseudo">I cut my hair.        -> Je me coupe les cheveux (moi-meme).
I have my hair cut.   -> Je me fais couper les cheveux (par un coiffeur).
We had the car repaired.  -> Nous avons fait reparer la voiture.
She is having a new kitchen installed. -> Elle fait installer une cuisine neuve.</pre>
<div class="tip"><em>Get</em> remplace souvent <em>have</em> à l'oral, plus familier : « I got my phone fixed. » Le sens reste identique.</div>
<h3>5. Le causatif de la mésaventure</h3>
<p>La même structure sert à raconter quelque chose de subi, souvent désagréable : « avoir quelque chose qui vous arrive ».</p>
<pre class="pseudo">He had his wallet stolen.   -> Il s'est fait voler son portefeuille.
She had her flight cancelled. -> Son vol a ete annule (elle l'a subi).</pre>
<div class="warn">Distingue bien : « I had my car washed » (choix : je l'ai fait laver) et « I had my car scratched » (mésaventure : on me l'a rayée). Le contexte tranche.</div>`,
  exercises: [
    { type: "qcm", q: "Mets au passif : « Someone stole my bike. »", opts: ["My bike was stolen.", "My bike is stolen.", "My bike has stole.", "My bike stole."], a: 0, exp: "Prétérit passif : was + participe (stolen)." },
    { type: "input", q: "Passif présent : « They speak English here. » -> « English ___ here. »", a: ["is spoken"], ph: "be + participe", exp: "Présent passif : is spoken." },
    { type: "qcm", q: "« The report ___ yet. » (present perfect passif, négatif)", opts: ["hasn't been sent", "isn't sent", "wasn't sent", "hasn't sent"], a: 0, exp: "Present perfect passif : has been + participe ; ici négatif hasn't been sent." },
    { type: "input", q: "Passif à deux compléments : « They offered me the job. » -> « I ___ the job. »", a: ["was offered"], ph: "was + participe", exp: "L'anglais commence par la personne : I was offered the job." },
    { type: "vf", q: "« I was given a book » se traduit littéralement par « Je fus donné un livre ».", a: false, exp: "En français : « On m'a donné un livre ». Le passif à deux compléments n'a pas d'équivalent direct." },
    { type: "qcm", q: "« I have my hair cut » signifie…", opts: ["Je me coupe les cheveux moi-même", "Je me fais couper les cheveux par un coiffeur", "J'ai coupé mes cheveux", "Mes cheveux sont coupés en permanence"], a: 1, exp: "Causatif : faire faire l'action par quelqu'un d'autre." },
    { type: "input", q: "Causatif passé : « We ___ (have / the car / repair). » Écris les trois mots clés.", a: ["had the car repaired"], ph: "had ... repaired", exp: "have + objet + participe : had the car repaired." },
    { type: "qcm", q: "« The road ___ at the moment. » (passif continu)", opts: ["is repaired", "is being repaired", "has been repaired", "repairs"], a: 1, exp: "Passif continu : is being + participe." },
    { type: "qcm", q: "« He had his wallet stolen » exprime…", opts: ["un choix volontaire", "une mésaventure subie", "une habitude", "un ordre"], a: 1, exp: "Causatif de la mésaventure : il a subi le vol." },
    { type: "input", q: "Modal passif : « This problem must ___ (solve). »", a: ["be solved"], ph: "be + participe", exp: "Après un modal : be + participe, be solved." },
    { type: "vf", q: "« I got my phone fixed » a le même sens que « I had my phone fixed ».", a: true, exp: "« get » remplace « have » dans le causatif, dans un registre plus familier." },
    { type: "qcm", q: "Pourquoi préférer « 200 workers were fired » à « The company fired 200 workers » dans un article ?", opts: ["C'est plus court", "Le passif met en avant les salariés, focus voulu, et sonne plus neutre/formel", "L'actif est incorrect", "Le passif est obligatoire au passé"], a: 1, exp: "Le passif déplace le regard sur ceux qui subissent et convient au ton journalistique." },
    { type: "input", q: "Passif futur : « They will publish the results. » -> « The results ___. »", a: ["will be published"], ph: "will be + participe", exp: "Futur passif : will be published." },
    { type: "qcm", q: "« She is having a new kitchen installed » veut dire…", opts: ["Elle installe elle-même la cuisine", "Elle fait installer une cuisine par des professionnels", "Elle a déjà une cuisine", "Elle vend une cuisine"], a: 1, exp: "Causatif au présent continu : elle fait réaliser l'installation." },
    { type: "vf", q: "Dans « The bridge was built in 1890 », préciser « by workers » serait inutile car l'auteur importe peu.", a: true, exp: "On omet le complément d'agent quand il est évident ou sans intérêt." }
  ],
  final: {
    title: "Exercice final — Un fait divers au passif",
    intro: `<p>Read this news-style report and observe the passive forms.</p>
<p>A major security flaw has been discovered in a popular messaging app used by millions. According to the report, private messages could be read by hackers for several months before the problem was noticed. The company, which has now been contacted by regulators, claims that no financial data was accessed. Affected users have been advised to change their passwords immediately, and a full update will be released next week. In the meantime, several customers say they have had their accounts frozen without warning. One user explained that she had her personal photos leaked online and is considering legal action. Experts insist that such vulnerabilities must be reported far more quickly, and that companies should be held accountable when users are put at risk.</p>`,
    questions: [
      { type: "qcm", q: "« A major security flaw has been discovered » est…", opts: ["un actif", "un present perfect passif", "un causatif", "un futur passif"], a: 1, exp: "has been + participe : present perfect passif, l'auteur de la découverte importe peu." },
      { type: "qcm", q: "« private messages could be read by hackers » : rôle de « by hackers » ?", opts: ["complément inutile", "il précise l'agent, ici important pour comprendre le danger", "c'est une erreur", "il marque le futur"], a: 1, exp: "On garde « by » quand l'agent est pertinent (ici, les pirates)." },
      { type: "vf", q: "« several customers say they have had their accounts frozen » est un causatif de mésaventure.", a: true, exp: "have + objet + participe (frozen) = subir : leurs comptes ont été gelés." },
      { type: "qcm", q: "« she had her personal photos leaked online » signifie…", opts: ["elle a diffusé ses photos volontairement", "on a diffusé ses photos, elle l'a subi", "elle a supprimé ses photos", "elle a caché ses photos"], a: 1, exp: "Causatif de mésaventure : elle a subi la fuite de ses photos." },
      { type: "qcm", q: "« such vulnerabilities must be reported » : quelle construction ?", opts: ["causatif", "modal + passif (be + participe)", "present perfect passif", "actif"], a: 1, exp: "Après le modal must : be reported, passif." }
    ],
    solution: `<p>Le texte accumule les formes passives typiques du registre journalistique :</p>
<pre class="pseudo">has been discovered / has been contacted / have been advised  -> present perfect passif
could be read / will be released / must be reported / should be held  -> modal + passif
was noticed / was accessed  -> preterit passif
had their accounts frozen / had her photos leaked  -> causatif (mesaventure subie)</pre>
<p>Le passif permet de rester factuel et impersonnel, de focaliser sur les victimes et l'action plutôt que sur des agents parfois inconnus. Le causatif, lui, dit qu'une personne a subi un événement. Maîtriser ces outils, c'est écrire comme la presse anglophone.</p>`
  }
};
</script>
