  theory: `
<h3>La suite et la résolution</h3>
<p>Hier, vous avez lu le cambriolage et posé vos hypothèses. Aujourd'hui, la <strong>seconde moitié</strong> du récit : un détail que personne n'était censé remarquer va démasquer le coupable. Après le texte, les questions viseront la compréhension <strong>en profondeur</strong> : le sens global, l'implicite, la chronologie exacte, et votre opinion. Relisez d'abord la fin de la partie 1 (le gant, les maisons en travaux) pour reprendre le fil.</p>
<h3>A Print in the Concrete — Part Two</h3>
<p><em>The break in the case came from the most unlikely place: a builder's complaint. At nine that morning, a man named Gary Poole telephoned the police station in a fury. He and his team were renovating the house behind the jeweller's, and the previous evening they had poured a fresh layer of concrete for a new patio. Someone, he said, had walked straight across it during the night and ruined the surface.</em></p>
<p><em>Sharma drove back to the alley at once. There, pressed deep into the now-hardened concrete, was a line of perfect footprints leading from the scaffolding to the back wall of the jeweller's. But these were not ordinary prints. The right shoe had left a normal mark, yet the left one showed a strange raised pattern and a thick, uneven sole. Sharma recognised it immediately: it was the print of an orthopaedic shoe, the kind made to order for a person with one leg shorter than the other.</em></p>
<p><em>In a town of six thousand people, she could think of only one man who wore such a shoe. His name was Edwin Clarke, a retired locksmith who had done occasional repairs for the Merrifield family for over thirty years. Clarke knew the shop's locks better than anyone alive. When Sharma and two officers knocked on his door that afternoon, he did not seem surprised to see them.</em></p>
<p><em>In his kitchen, still damp from the rain, hung a single work glove — the twin of the one found in the alley. Clarke was a proud man, and he did not deny what he had done. He explained that Mr Merrifield's father had promised him a pension years ago, a promise that had died with the old man. Bitter and short of money, Clarke had used a spare key he had copied decades earlier, along with the combination he had once been trusted to reset.</em></p>
<p><em>The hour-long wait, he admitted, had not been part of any clever plan: he had simply fallen asleep in the storeroom, exhausted, while waiting for a passing police patrol to move on. "I'm too old for this," he told Sharma with a tired smile. "I suppose the concrete caught me." The stolen watches were recovered from a suitcase under his bed, not one of them sold.</em></p>
<p><em>Clarke, it turned out, had never truly intended to profit. He had wanted the Merrifields to feel, just once, what it was to lose something they had counted on. At his trial, the judge showed unusual sympathy, but the law was the law, and Clarke received a suspended sentence. Thomas Merrifield, shaken by the whole affair, later set up a small fund for retired craftsmen in the town — the very pension his father had never paid. Detective Sergeant Sharma kept the photograph of the footprint on her desk for years afterwards. It reminded her, she said, that the smallest, strangest detail — a wet patch of concrete no one was meant to notice — can undo the most careful plan.</em></p>

<div class="tip">Remarquez comment l'auteur relie chaque indice de la partie 1 à sa cause : le gant (son jumeau chez Clarke), l'heure d'attente (il s'était endormi), l'absence d'effraction (double de clé + combinaison). Un bon fait divers ne laisse aucun fil pendant.</div>`,

    { type: "qcm", q: "Qu'avaient de particulier les empreintes dans le béton ?", opts: ["Elles étaient toutes identiques", "La chaussure gauche montrait un relief étrange : une chaussure orthopédique", "Elles étaient minuscules", "Il n'y en avait qu'une seule"], a: 1, exp: "« the left one showed a strange raised pattern… an orthopaedic shoe »." },

<p><em>Think about the whole story: the timeline of the night, the reason for the crime, what the author suggests without stating it, and how you judge Clarke's actions.</em></p>`,

      { type: "qcm", q: "SENS GLOBAL — Quel est le vrai sujet du récit, au-delà du cambriolage ?", opts: ["La technologie des alarmes", "Une promesse trahie et un homme qui cherche à être reconnu, plus qu'à voler", "Le prix des montres anciennes", "La météo en Angleterre"], a: 1, exp: "Le cœur du récit est la promesse de pension non tenue et la blessure de Clarke." },

    ],
    solution: `<p>Comprendre ce récit en profondeur, c'est voir qu'il dépasse le simple cambriolage. La <strong>chronologie</strong> de la nuit s'éclaire enfin : caméra neutralisée à 2 h 10, endormissement d'épuisement, ouverture du coffre vers 3 h (déclenchant l'alarme), fuite par l'échafaudage — et la trace fatale dans le béton frais. L'<strong>implicite</strong> est partout : Clarke « pas surpris » de voir la police (il s'attendait, au fond, à être pris), les montres jamais vendues (le mobile n'était pas l'argent). Le <strong>sens global</strong> est celui d'une promesse trahie : Clarke voulait moins voler que faire ressentir une perte. Enfin, le geste final de Thomas Merrifield — créer la pension que son père n'avait jamais versée — referme la boucle morale du récit. Vous venez de lire, comprendre et analyser un fait divers de deux pages : c'est très exactement l'objectif de tout ce cours. Félicitations.</p>`

    solution: "The burglar turned out to be Edwin Clarke, a retired locksmith who had once worked for the jeweller's family. He was caught because he walked across a patch of fresh concrete during the night, leaving the unmistakable print of his orthopaedic shoe. If he had not crossed that wet patio, the police might never have identified him so quickly. What makes the story moving is that Clarke did not act out of greed: he had been promised a pension that was never paid, and he wanted the family to feel his sense of loss. Admittedly, breaking into a shop is a serious crime and cannot be excused. However, in my opinion, the suspended sentence was fair, because Clarke returned everything and was clearly driven by hurt rather than dishonesty. The most striking lesson is that the smallest detail can undo the most careful plan. In the end, justice and a little humanity managed to meet.\n\nTraduction et notes : « Le cambrioleur s'est avéré être Edwin Clarke, un serrurier retraité qui avait autrefois travaillé pour la famille du bijoutier. Il a été pris parce qu'il a marché sur une plaque de béton frais durant la nuit, laissant l'empreinte reconnaissable de sa chaussure orthopédique. S'il n'avait pas traversé cette terrasse humide, la police ne l'aurait peut-être jamais identifié aussi vite. Ce qui rend l'histoire émouvante, c'est que Clarke n'a pas agi par cupidité : on lui avait promis une pension jamais versée, et il voulait que la famille ressente sa propre perte. Certes, s'introduire dans une boutique est un crime grave et ne peut être excusé. Cependant, à mon avis, la peine avec sursis était juste, car Clarke a tout rendu et était visiblement mû par la blessure plutôt que par la malhonnêteté. La leçon la plus frappante est que le plus petit détail peut anéantir le plan le plus soigné. Au bout du compte, la justice et un peu d'humanité ont su se rejoindre. » Repérez le conditionnel passé (If he had not crossed… might never have identified) et la nuance (Admittedly…
