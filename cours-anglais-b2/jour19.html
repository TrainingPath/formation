<script>

  title: "Compréhension : un fait divers d'une page",
  subtitle: "Lire une histoire vraie d'environ une page et en saisir tous les détails.",
  theory: `
<h3>1. Lire un fait divers</h3>
<p>Un <strong>fait divers</strong> (en anglais <em>a news story</em> ou <em>a human-interest story</em>) raconte un événement réel : un incident, un crime, une histoire insolite. Pour bien le comprendre, cherchez toujours les <strong>cinq W</strong> du journalisme : <em>Who?</em> (qui), <em>What?</em> (quoi), <em>When?</em> (quand), <em>Where?</em> (où), <em>Why?</em> (pourquoi). Ajoutez le <em>How?</em> (comment). Aujourd'hui, un fait divers léger et complet d'environ une page.</p>
<h3>2. L'histoire</h3>
<p><em>For several weeks, the residents of Maple Street in the small town of Harborough had been losing things. It began with a single glove, then a child's toy, a pair of sunglasses, and finally a set of car keys. At first, nobody thought much of it. People are forgetful, after all.</em></p>
<p><em>But when the collection of missing objects grew and grew, the neighbours began to suspect a thief. Mrs Fletcher, who lived at number 12, was convinced that a stranger was creeping into gardens at night. She even installed a small camera above her back door to catch the culprit in the act.</em></p>
<p><em>What the camera recorded, however, was not a man in a mask. It was a large ginger cat. Night after night, the cat trotted across the lawns of Maple Street, carrying a stolen treasure in its mouth: a sock one evening, a rubber duck the next.</em></p>
<p><em>The cat belonged to Mr Davies at number 7, who was astonished when the neighbours knocked on his door with the evidence. Behind his garden shed, they discovered a remarkable hoard of more than sixty items — gloves, toys, tea towels, and even a small teddy bear.</em></p>
<p><em>Nobody could explain why the cat, whose name was Biscuit, had become such a determined little burglar. A local vet suggested that some cats simply enjoy carrying soft objects home, treating them almost like prey. Mr Davies, red with embarrassment, offered to return everything to its rightful owner.</em></p>
<p><em>Today, the objects are laid out on a table at the community centre, and the residents of Maple Street come to reclaim their belongings — and to laugh about the mystery that turned out to have four legs and a very guilty face.</em></p>
<h3>3. Aide au vocabulaire</h3>
<pre class="pseudo">to be forgetful     être étourdi, tête en l'air
to creep into       se faufiler dans
the culprit         le coupable
to catch in the act prendre sur le fait
a ginger cat        un chat roux
to trot across      traverser en trottinant
a hoard             un trésor caché, un magot
a tea towel         un torchon
prey                une proie
rightful owner      le propriétaire légitime
to reclaim          récupérer, réclamer</pre>
<div class="tip">Astuce de lecture : la première phrase donne souvent le décor (« For several weeks… had been losing things »), et le <strong>retournement</strong> (« What the camera recorded, however… ») marque le moment clé. Repérez ces charnières pour suivre le fil.</div>`,
  exercises: [
    { type: "qcm", q: "Que se passait-il à Maple Street depuis plusieurs semaines ?", opts: ["Des cambriolages violents", "Des objets disparaissaient", "Des incendies", "Des accidents de voiture"], a: 1, exp: "« the residents… had been losing things » : des objets disparaissaient." },
    { type: "qcm", q: "Qu'a fait Mrs Fletcher pour attraper le coupable ?", opts: ["Elle a appelé la police", "Elle a installé une caméra au-dessus de sa porte", "Elle a déménagé", "Elle a accusé un voisin"], a: 1, exp: "« she installed a small camera above her back door »." },
    { type: "qcm", q: "Qui était le voleur ?", opts: ["Un inconnu masqué", "Un enfant", "Un grand chat roux", "Mr Davies"], a: 2, exp: "« It was a large ginger cat. »" },
    { type: "input", q: "Comment s'appelait le chat ? (un seul mot, en anglais)", a: ["Biscuit"], ph: "un prénom", exp: "« a determined little burglar… whose name was Biscuit »." },
    { type: "qcm", q: "À qui appartenait le chat ?", opts: ["À Mrs Fletcher", "À Mr Davies (numéro 7)", "Au vétérinaire", "À personne"], a: 1, exp: "« The cat belonged to Mr Davies at number 7 »." },
    { type: "qcm", q: "Où le magot d'objets a-t-il été trouvé ?", opts: ["Dans la maison de Mrs Fletcher", "Derrière l'abri de jardin de Mr Davies", "Au centre communautaire", "Sous une voiture"], a: 1, exp: "« Behind his garden shed, they discovered a remarkable hoard »." },
    { type: "input", q: "Combien d'objets environ ont été retrouvés ? (un nombre)", a: ["60", "sixty", "more than sixty"], ph: "un nombre", exp: "« more than sixty items »." },
    { type: "vf", q: "Le vétérinaire pense que certains chats aiment rapporter des objets mous comme des proies.", a: true, exp: "« some cats simply enjoy carrying soft objects home, treating them almost like prey »." },
    { type: "qcm", q: "Que signifie <em>the culprit</em> ?", opts: ["le voisin", "le coupable", "la caméra", "le chat perdu"], a: 1, exp: "The culprit = le coupable." },
    { type: "input", q: "Traduis <em>a hoard</em> : un ___ caché.", a: ["trésor", "magot"], ph: "un mot", exp: "A hoard = un trésor caché, un magot." },
    { type: "qcm", q: "Qu'a proposé Mr Davies, gêné ?", opts: ["De garder les objets", "De vendre les objets", "De rendre tout à leurs propriétaires", "De se débarrasser du chat"], a: 2, exp: "« offered to return everything to its rightful owner »." },
    { type: "qcm", q: "Où les habitants récupèrent-ils leurs biens ?", opts: ["Chez Mrs Fletcher", "Au centre communautaire", "Au commissariat", "Chez le vétérinaire"], a: 1, exp: "« laid out on a table at the community centre »." },
    { type: "vf", q: "Au début, les habitants ont tout de suite soupçonné un voleur.", a: false, exp: "« At first, nobody thought much of it. People are forgetful. » Le soupçon vient plus tard." },
    { type: "qcm", q: "Quel mot du texte signifie « prendre sur le fait » ?", opts: ["to reclaim", "to catch in the act", "to trot across", "to be forgetful"], a: 1, exp: "To catch in the act = prendre sur le fait." },
    { type: "qcm", q: "Quel est le ton général de ce fait divers ?", opts: ["Tragique et sombre", "Léger et amusant", "Scientifique et technique", "Colérique"], a: 1, exp: "L'histoire est insolite et se termine dans le rire : ton léger et humoristique." }
  ],
  final: {
    title: "Exercice final — Les cinq W",
    intro: `<p>Appliquez la grille du journaliste à ce fait divers. Rappel : <strong>Who, What, When, Where, Why, How.</strong></p>
<p><em>Answer using the story: identify the culprit, the crime, the place, the length of time, and the explanation given by the vet.</em></p>`,
    questions: [
      { type: "qcm", q: "WHO — Qui est le coupable ?", opts: ["Un cambrioleur humain", "Un chat roux nommé Biscuit", "Mrs Fletcher", "Un enfant du quartier"], a: 1, exp: "Le coupable est le chat Biscuit." },
      { type: "qcm", q: "WHAT — Que faisait-il ?", opts: ["Il cassait des fenêtres", "Il volait de petits objets dans les jardins", "Il effrayait les gens", "Il détruisait des voitures"], a: 1, exp: "Il rapportait chez lui des objets pris chez les voisins." },
      { type: "qcm", q: "WHERE — Où l'histoire se déroule-t-elle ?", opts: ["À Londres", "Dans la ville de Harborough, à Maple Street", "Dans une grande métropole", "À la campagne, sans nom"], a: 1, exp: "« Maple Street in the small town of Harborough »." },
      { type: "qcm", q: "HOW — Comment le coupable a-t-il été démasqué ?", opts: ["Par un témoin", "Par la caméra de Mrs Fletcher", "Par la police", "Par hasard, en pleine rue"], a: 1, exp: "La caméra a filmé le chat en train de traverser les pelouses." },
      { type: "qcm", q: "WHY — Quelle explication le vétérinaire donne-t-il ?", opts: ["Le chat avait faim", "Certains chats aiment rapporter des objets mous comme des proies", "Le chat était dressé", "Personne ne sait"], a: 1, exp: "Le vétérinaire évoque un comportement de prédation transféré aux objets mous." }
    ],
    solution: `<p>Grille complète du fait divers : <strong>Who</strong> — Biscuit, le chat roux de Mr Davies. <strong>What</strong> — il subtilisait des dizaines de petits objets. <strong>When</strong> — pendant plusieurs semaines. <strong>Where</strong> — Maple Street, à Harborough. <strong>Why</strong> — un instinct de « proie » selon le vétérinaire. <strong>How</strong> — révélé par la caméra de Mrs Fletcher, puis le magot derrière l'abri de jardin. Répondre aux cinq W, c'est reconstruire l'ossature de n'importe quel fait divers. Retenez aussi les charnières du récit : la mise en place (des objets disparaissent), le soupçon (un voleur ?), le retournement (c'est un chat !) et la résolution (on rend tout). Vous appliquerez exactement cette méthode au fait divers de deux pages des jours 27 et 28.</p>`
  }
};
