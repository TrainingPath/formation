<script>
var DAY = {
  num: 1,
  title: "Réviser les temps : nuances d'aspect",
  subtitle: "Simple, continu, parfait : ce que chaque forme raconte vraiment.",
  theory: `
<h3>1. Trois questions, pas seulement « quand »</h3>
<p>En anglais, choisir un temps ne consiste pas seulement à situer l'action dans le temps (passé, présent, futur). Il faut aussi choisir un <strong>aspect</strong>, c'est-à-dire une manière de regarder l'action. Trois aspects se combinent avec chaque époque :</p>
<pre class="pseudo">SIMPLE      -> action vue comme un fait, un tout, une habitude
CONTINU     -> action vue en train de se dérouler, en cours, temporaire
PARFAIT     -> action vue par rapport a un autre moment (bilan, resultat)</pre>
<p>Un francophone se trompe souvent parce que le français n'a pas de forme continue (« I am eating » se traduit simplement par « je mange »). C'est donc l'aspect qu'il faut apprendre à sentir, pas seulement l'époque.</p>
<h3>2. Présent simple vs présent continu</h3>
<p>Le <strong>présent simple</strong> exprime une vérité générale, une habitude, un fait permanent. Le <strong>présent continu</strong> (be + -ing) décrit ce qui se déroule maintenant, ou une situation temporaire.</p>
<pre class="pseudo">I work in Lyon.            -> Je travaille a Lyon. (fait permanent)
I am working from home this week.   -> Je travaille de chez moi cette semaine. (temporaire)
Water boils at 100 degrees.        -> L'eau bout a 100 degres. (verite generale)</pre>
<div class="tip">Certains verbes d'état (know, believe, want, love, understand, belong) s'emploient rarement au continu : on dit <em>I know the answer</em>, jamais <em>I am knowing</em>.</div>
<h3>3. Prétérit vs present perfect</h3>
<p>Le <strong>prétérit</strong> (past simple) raconte une action terminée, à un moment précis et révolu. Le <strong>present perfect</strong> (have + participe passé) relie le passé au présent : le moment n'est pas précisé, ou l'action a un effet actuel.</p>
<pre class="pseudo">I visited Rome in 2019.    -> J'ai visite Rome en 2019. (date precise -> preterit)
I have visited Rome three times.   -> J'ai visite Rome trois fois. (bilan de vie -> present perfect)
Have you finished yet?     -> Tu as fini ? (resultat actuel -> present perfect)</pre>
<div class="warn">Un marqueur de temps précis et achevé (yesterday, last week, in 2019, two days ago) exige le PRÉTÉRIT. On ne dit jamais <em>I have seen him yesterday</em>, mais <em>I saw him yesterday</em>.</div>
<h3>4. Present perfect simple vs continu</h3>
<p>Le present perfect <strong>simple</strong> insiste sur le résultat, la quantité, l'achèvement. Le present perfect <strong>continu</strong> (have been + -ing) insiste sur la durée, l'activité en cours, parfois encore visible.</p>
<pre class="pseudo">I have written three emails.    -> J'ai ecrit trois mails. (resultat compte, fini)
I have been writing emails all morning.  -> J'ecris des mails depuis ce matin. (duree, activite continue)</pre>
<h3>5. Le passé qui avance : past continuous et past perfect</h3>
<p>Le <strong>past continuous</strong> (was/were + -ing) plante un décor en cours quand une autre action, plus brève, survient. Le <strong>past perfect</strong> (had + participe passé) exprime une action antérieure à un autre moment passé : le « passé du passé ».</p>
<pre class="pseudo">I was cooking when the phone rang.   -> Je cuisinais quand le telephone a sonne.
The train had already left when we arrived.  -> Le train etait deja parti quand nous sommes arrives.</pre>
<div class="tip">Repère utile : <em>for</em> introduit une durée (for two hours), <em>since</em> un point de départ (since 2020), <em>already / yet / just</em> accompagnent souvent le present perfect.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle phrase décrit une habitude permanente ?", opts: ["She is living in Paris.", "She lives in Paris.", "She has been living in Paris.", "She was living in Paris."], a: 1, exp: "Le présent simple exprime un fait permanent ; le continu suggérerait quelque chose de temporaire." },
    { type: "qcm", q: "Complète : « Look! It ___ outside. »", opts: ["rains", "is raining", "has rained", "rained"], a: 1, exp: "« Look! » signale une action en cours au moment où l'on parle : présent continu." },
    { type: "input", q: "Mets le verbe au bon temps : « I ___ (see) that film last night. »", a: ["saw"], ph: "un mot", exp: "« Last night » est un marqueur précis et achevé : prétérit, saw." },
    { type: "input", q: "Complète avec le present perfect : « She ___ (never / be) to Japan. »", a: ["has never been"], ph: "trois mots", exp: "Bilan de vie sans date : has + participe passé, avec never entre have et been." },
    { type: "qcm", q: "Choisis la forme correcte : « We ___ dinner when you called. »", opts: ["had", "were having", "have had", "have"], a: 1, exp: "Action en cours interrompue par une autre : past continuous." },
    { type: "vf", q: "La phrase « I have visited Rome in 2019 » est correcte.", a: false, exp: "Avec la date précise « in 2019 », il faut le prétérit : I visited Rome in 2019." },
    { type: "qcm", q: "« I ___ English for five years » (et je continue). Quelle forme ?", opts: ["study", "studied", "have been studying", "was studying"], a: 2, exp: "Durée qui court jusqu'au présent : present perfect continu avec for." },
    { type: "input", q: "Complète : « They ___ (leave) before I arrived. » (passé du passé)", a: ["had left"], ph: "deux mots", exp: "Action antérieure à un autre moment passé : past perfect, had left." },
    { type: "qcm", q: "Quel verbe s'emploie rarement au continu ?", opts: ["run", "know", "eat", "write"], a: 1, exp: "« know » est un verbe d'état : on ne dit pas « I am knowing »." },
    { type: "input", q: "Complète : « How long ___ you ___ (wait)? » (present perfect continu)", a: ["have been waiting"], ph: "trois mots après you", exp: "have + been + waiting : durée soulignée." },
    { type: "qcm", q: "Différence entre « I have written two reports » et « I have been writing reports »", opts: ["Aucune", "La première insiste sur le résultat/quantité, la seconde sur l'activité et sa durée", "La seconde est fausse", "La première est du futur"], a: 1, exp: "Simple = résultat compté ; continu = activité en déroulement." },
    { type: "vf", q: "« Water boils at 100 degrees » utilise correctement le présent simple pour une vérité générale.", a: true, exp: "Les vérités scientifiques et générales prennent le présent simple." },
    { type: "qcm", q: "« When I got home, my brother ___ the kitchen. »", opts: ["already cleaned", "had already cleaned", "has already cleaned", "was already cleaning"], a: 1, exp: "L'action est antérieure à « got home » : past perfect, had already cleaned." },
    { type: "input", q: "Corrige : « I am understanding the lesson now. » Écris la version correcte du verbe.", a: ["understand", "i understand"], ph: "le verbe corrigé", exp: "« understand » est un verbe d'état : présent simple, I understand." },
    { type: "vf", q: "« She has been running, that's why she's out of breath » relie une activité passée à un effet visible au présent.", a: true, exp: "Le present perfect continu explique souvent un résultat encore perceptible." }
  ],
  final: {
    title: "Exercice final — Analyser un court récit",
    intro: `<p>Read the following short account and pay attention to how the tenses shift.</p>
<p>By the time Sarah reached the platform, the train had already pulled away. She had been rushing through the streets for almost twenty minutes, and now she stood there, breathless. She has missed this train twice this month, and she was beginning to wonder whether she should move closer to the station. Normally she leaves home at seven, but today she overslept. As she waited for the next departure, she was scrolling through her phone and noticed a message from her manager. It said the meeting had been postponed. She sighed with relief; she had worried about nothing. Ever since she started this job, punctuality has become an obsession. Right now, she is learning to breathe and accept that some mornings simply go wrong.</p>`,
    questions: [
      { type: "qcm", q: "« the train had already pulled away » : pourquoi le past perfect ?", opts: ["Action future", "Action antérieure à « reached the platform »", "Habitude", "Vérité générale"], a: 1, exp: "Le past perfect situe le départ AVANT son arrivée sur le quai." },
      { type: "qcm", q: "« She had been rushing for almost twenty minutes » exprime…", opts: ["une action ponctuelle", "la durée d'une activité antérieure à un moment passé", "une habitude actuelle", "un futur"], a: 1, exp: "Past perfect continu : durée d'une activité menant au moment passé de référence." },
      { type: "vf", q: "« She has missed this train twice this month » relie un bilan récent au présent.", a: true, exp: "Present perfect + « this month » (période non close) = bilan connecté au présent." },
      { type: "qcm", q: "« Normally she leaves home at seven » emploie le présent simple parce que…", opts: ["c'est en cours maintenant", "c'est une habitude régulière", "c'est un ordre", "c'est le futur"], a: 1, exp: "« Normally » signale une habitude : présent simple." },
      { type: "qcm", q: "« Right now, she is learning to breathe » : quel aspect et pourquoi ?", opts: ["Simple, habitude", "Continu, action en cours au moment présent", "Parfait, bilan", "Prétérit, passé achevé"], a: 1, exp: "« Right now » impose le présent continu pour une action en déroulement." }
    ],
    solution: `<p>Le récit alterne plusieurs temps avec une logique précise :</p>
<pre class="pseudo">reached / stood / overslept / noticed  -> preterit : faits acheves du recit
had already pulled away / had been rushing / had been postponed  -> past perfect : anterieurs au recit
has missed / has become / has worried  -> present perfect : bilan relie au present
leaves  -> present simple : habitude
was scrolling / was beginning  -> past continuous : decor en cours
is learning  -> present continu : action au moment present</pre>
<p>Maîtriser l'aspect, c'est savoir répondre non pas « quand ? » mais « comment je regarde cette action : comme un fait, un déroulement ou un bilan ? ». C'est le cœur de la nuance en anglais.</p>`
  }
};
</script>
