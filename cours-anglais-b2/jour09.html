<script>
var DAY = {
  num: 9,
  title: "Articuler un argumentaire",
  subtitle: "Les connecteurs logiques pour structurer, nuancer et convaincre.",
  theory: `
<h3>1. Les connecteurs : la charpente du discours</h3>
<p>Un bon argumentaire ne repose pas seulement sur de bonnes idées, mais sur la façon dont elles s'enchaînent. Les <strong>connecteurs logiques</strong> (linking words) guident le lecteur : ils annoncent un ajout, une opposition, une cause, une conséquence, un exemple. Au niveau B2, il faut varier au-delà de <em>and, but, so, because</em>.</p>
<h3>2. Ajouter et renforcer</h3>
<pre class="pseudo">moreover / furthermore / in addition -> de plus, en outre
what is more / on top of that        -> qui plus est
not only ... but also                -> non seulement ... mais aussi
Moreover, the policy saves money. -> De plus, la mesure economise de l'argent.</pre>
<div class="tip"><em>Moreover</em> et <em>furthermore</em> sont assez formels ; à l'oral on préfère <em>what's more</em> ou <em>on top of that</em>.</div>
<h3>3. Opposer et nuancer</h3>
<pre class="pseudo">however / nevertheless / nonetheless -> cependant, neanmoins
on the other hand                    -> d'un autre cote
whereas / while                      -> tandis que
although / even though / though      -> bien que
despite / in spite of + nom          -> malgre</pre>
<pre class="pseudo">The plan is expensive. However, it is necessary.
-> Le projet est couteux. Cependant, il est necessaire.
Although it was raining, we went out.
-> Bien qu'il pleuve, nous sommes sortis.
Despite the rain, we went out.
-> Malgre la pluie, nous sommes sortis.</pre>
<div class="warn">Attention à la construction ! <em>Although / even though</em> sont suivis d'une proposition (sujet + verbe) : « Although it was cold ». <em>Despite / in spite of</em> sont suivis d'un nom ou d'un -ing : « Despite the cold », « In spite of being cold ». On ne dit jamais « Despite it was cold ».</div>
<h3>4. Exprimer la cause et la conséquence</h3>
<pre class="pseudo">Cause : because / since / as / due to / owing to
Consequence : therefore / thus / hence / consequently / as a result</pre>
<pre class="pseudo">Since demand fell, prices dropped.
-> Comme la demande a chute, les prix ont baisse.
The road was icy; therefore, the match was cancelled.
-> La route etait verglacee ; par consequent, le match a ete annule.
Due to the strike, trains were delayed. (due to + nom)
-> En raison de la greve, les trains ont ete retardes.</pre>
<div class="warn"><em>Because</em> introduit une proposition (because prices rose) ; <em>due to / because of</em> introduisent un nom (because of the price rise). Ne les mélange pas.</div>
<h3>5. Illustrer, reformuler, conclure</h3>
<pre class="pseudo">Illustrer : for instance / for example / such as / to illustrate
Reformuler : in other words / that is to say / namely
Concluder : in conclusion / to sum up / all in all / overall / on balance</pre>
<pre class="pseudo">Many cities, such as Amsterdam, encourage cycling.
-> Beaucoup de villes, comme Amsterdam, encouragent le velo.
On balance, the benefits outweigh the drawbacks.
-> Tout bien pese, les avantages l'emportent sur les inconvenients.</pre>
<h3>6. Structurer un paragraphe argumentatif</h3>
<p>Un paragraphe convaincant suit souvent le schéma <strong>PEEL</strong> : Point (l'idée), Evidence (la preuve/l'exemple), Explanation (l'explication), Link (le lien vers la suite ou la thèse).</p>
<pre class="pseudo">Point : Remote work improves productivity.
Evidence : For instance, a 2021 study found a 13% rise in output.
Explanation : This is because employees avoid long commutes and distractions.
Link : Therefore, companies should offer more flexible arrangements.</pre>
<div class="tip">Pour introduire ton opinion avec nuance : « It could be argued that… », « There is no doubt that… », « To a certain extent… », « It seems reasonable to assume that… ».</div>`,
  exercises: [
    { type: "qcm", q: "Quel connecteur exprime l'opposition ?", opts: ["moreover", "therefore", "however", "for instance"], a: 2, exp: "However = cependant, marque l'opposition." },
    { type: "input", q: "Complète : « ___ it was raining, we decided to go out. » (bien que + proposition)", a: ["although", "even though", "though"], ph: "un connecteur", exp: "Although / even though + proposition (sujet + verbe)." },
    { type: "qcm", q: "Choisis la forme correcte : « ___ the rain, we went out. »", opts: ["Although", "Despite", "Because", "Therefore"], a: 1, exp: "Despite + nom (the rain). « Although » exigerait une proposition." },
    { type: "vf", q: "« Despite it was late, we continued » est correct.", a: false, exp: "Despite + nom/-ing : « Despite the late hour » ou « Although it was late »." },
    { type: "qcm", q: "Quel connecteur introduit une conséquence ?", opts: ["whereas", "consequently", "for example", "in addition"], a: 1, exp: "Consequently = par conséquent, marque la conséquence." },
    { type: "input", q: "Complète : « Prices rose ___ the increase in demand. » (à cause de + nom)", a: ["due to", "because of", "owing to"], ph: "cause + nom", exp: "Due to / because of / owing to introduisent un nom." },
    { type: "qcm", q: "« ___ prices rose, fewer people bought the product. » (parce que + proposition)", opts: ["Due to", "Because of", "Because", "Despite"], a: 2, exp: "Because + proposition (sujet + verbe). Due to/because of exigeraient un nom." },
    { type: "input", q: "Complète : « The city is polluted; ___, the council is banning old cars. »", a: ["therefore", "thus", "consequently", "as a result", "hence"], ph: "conséquence", exp: "Therefore / consequently / as a result introduisent la conséquence." },
    { type: "qcm", q: "Quel groupe sert à conclure ?", opts: ["for instance / such as", "to sum up / on balance / overall", "moreover / furthermore", "however / whereas"], a: 1, exp: "To sum up, on balance, overall introduisent une conclusion." },
    { type: "vf", q: "« Whereas » sert à marquer un contraste entre deux éléments.", a: true, exp: "Whereas = tandis que : il oppose deux propositions." },
    { type: "qcm", q: "« Many sports, ___ tennis and golf, are individual. »", opts: ["therefore", "such as", "however", "moreover"], a: 1, exp: "Such as introduit des exemples." },
    { type: "input", q: "Reformule : « The plan failed; ___, it cost us a fortune. » (qui plus est / de plus)", a: ["moreover", "furthermore", "what is more", "what's more", "in addition"], ph: "ajout", exp: "Moreover / furthermore / what's more ajoutent un argument." },
    { type: "qcm", q: "Dans le schéma PEEL, que représente le E de Evidence ?", opts: ["l'opinion", "la preuve ou l'exemple qui appuie l'idée", "la conclusion", "l'opposition"], a: 1, exp: "Evidence = la preuve, la donnée ou l'exemple soutenant le Point." },
    { type: "input", q: "Complète : « ___, the advantages outweigh the disadvantages. » (tout bien pesé)", a: ["on balance", "all in all", "overall"], ph: "conclusion nuancée", exp: "On balance / all in all / overall introduisent un bilan nuancé." },
    { type: "vf", q: "« In other words » sert à reformuler une idée plus clairement.", a: true, exp: "In other words / that is to say introduisent une reformulation." }
  ],
  final: {
    title: "Exercice final — Un paragraphe argumentatif",
    intro: `<p>Read this well-structured argumentative paragraph and notice the linking words.</p>
<p>There is no doubt that public transport should be made free in large cities. To begin with, free transport would reduce car traffic; consequently, air pollution would fall significantly. Moreover, it would help low-income families who currently struggle with the cost of commuting. Some critics argue that such a policy is too expensive; however, the savings in healthcare and road maintenance could offset much of the cost. Although the initial investment is high, the long-term benefits are undeniable. For instance, several cities, such as Tallinn, have already tested free transport with encouraging results. In other words, what seems idealistic may in fact be pragmatic. On balance, despite the financial challenges, making public transport free appears to be a wise and forward-looking decision.</p>`,
    questions: [
      { type: "qcm", q: "« consequently, air pollution would fall » : quel rôle ?", opts: ["ajout", "conséquence", "opposition", "exemple"], a: 1, exp: "Consequently introduit la conséquence de la réduction du trafic." },
      { type: "qcm", q: "« Some critics argue... ; however, the savings... » : fonction de « however » ?", opts: ["ajouter un argument", "opposer une objection à une réponse", "conclure", "illustrer"], a: 1, exp: "However introduit la réfutation de l'objection." },
      { type: "vf", q: "« Although the initial investment is high » est correctement suivi d'une proposition (sujet + verbe).", a: true, exp: "Although + proposition : the initial investment is high. Construction correcte." },
      { type: "qcm", q: "« several cities, such as Tallinn » : rôle de « such as » ?", opts: ["conséquence", "exemple concret", "opposition", "conclusion"], a: 1, exp: "Such as introduit un exemple précis (Tallinn)." },
      { type: "qcm", q: "« On balance, despite the financial challenges... » : que signale « On balance » ?", opts: ["une cause", "une conclusion nuancée", "un ajout", "un exemple"], a: 1, exp: "On balance introduit le bilan final, tout bien pesé." }
    ],
    solution: `<p>Le paragraphe déploie un éventail de connecteurs bien orchestrés :</p>
<pre class="pseudo">Ouverture d'opinion : There is no doubt that ...
Ajout : To begin with / Moreover
Consequence : consequently
Opposition/refutation : Some critics argue ... ; however ... / Although ...
Exemple : For instance / such as
Reformulation : In other words
Conclusion nuancee : On balance / despite the financial challenges</pre>
<p>La force de l'argumentaire vient de l'anticipation des objections (« Some critics argue… however… ») et de la variété des liens. Retiens surtout : <em>although</em> + proposition, <em>despite</em> + nom, <em>because</em> + proposition, <em>due to</em> + nom. Ces contrastes de construction sont les pièges classiques.</p>`
  }
};
</script>

    solution: "It could be argued that schools should teach financial literacy from an early age. To begin with, many young adults leave school without understanding how debt or savings work; consequently, they make costly mistakes. Moreover, financial education would give students practical skills they will use for the rest of their lives. Some may argue that the curriculum is already overloaded; however, a single weekly lesson would be enough to make a real difference. For instance, countries such as Finland have introduced money-management courses with excellent results. Although designing a new programme requires effort, the long-term benefits clearly outweigh the drawbacks. On balance, teaching financial literacy is a small investment that could prevent a lifetime of financial stress.\n\nTraduction : On pourrait soutenir que les ecoles devraient enseigner l'education financiere des le plus jeune age. Tout d'abord, beaucoup de jeunes adultes quittent l'ecole sans comprendre comment fonctionnent la dette ou l'epargne ; par consequent, ils commettent des erreurs couteuses. De plus, l'education financiere donnerait aux eleves des competences pratiques qu'ils utiliseront toute leur vie. Certains diront que le programme est deja surcharge ; cependant, une seule lecon hebdomadaire suffirait a faire une vraie difference. Par exemple, des pays comme la Finlande ont introduit des cours de gestion de l'argent avec d'excellents resultats. Bien que concevoir un nouveau programme demande des efforts, les benefices a long terme l'emportent clairement sur les inconvenients. Tout bien pese, enseigner l'education financiere est un petit investissement qui pourrait eviter toute une vie de stress financier.",

  ]
};
