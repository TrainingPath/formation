<body>
<script>
var ATELIER = {
  prefix: "at-en-b2",
  titre: "🇬🇧 Atelier — Anglais B2",
  soustitre: "Trois dialogues, puis 30 types d'exercices (10 chacun) pour viser l'aisance B2.",
  retour: "index.html",
  dialogues: [
    { num:"1", titre:"A demanding job interview", perso:"Nadia Kessler (candidate) — Mr Bright (head of department)", lignes:[
      {qui:"Bright.", txt:"Thank you for coming in. Your CV is impressive, but I'd like to hear what's behind it.", fr:"Merci d'être venue. Votre CV est impressionnant, mais j'aimerais savoir ce qu'il y a derrière."},
      {qui:"Nadia.", txt:"Of course. I spent four years in logistics before moving into project management.", fr:"Bien sûr. J'ai passé quatre ans dans la logistique avant de passer à la gestion de projet."},
      {qui:"Bright.", txt:"What made you switch? Not many people give up a secure position halfway through their career.", fr:"Qu'est-ce qui vous a fait changer ? Peu de gens abandonnent un poste sûr au milieu de leur carrière."},
      {qui:"Nadia.", txt:"Had I stayed, I would have stopped learning. That mattered more to me than security.", fr:"Si j'étais restée, j'aurais cessé d'apprendre. Cela comptait davantage pour moi que la sécurité."},
      {qui:"Bright.", txt:"Fair enough. Tell me about a project that went wrong and what you took away from it.", fr:"C'est légitime. Parlez-moi d'un projet qui a mal tourné et de ce que vous en avez retiré."},
      {qui:"Nadia.", txt:"We rolled out a new system far too quickly. I should have pushed back on the deadline.", fr:"Nous avons déployé un nouveau système bien trop vite. J'aurais dû contester le délai."},
      {qui:"Bright.", txt:"So you're saying the failure was partly yours. That's refreshingly honest.", fr:"Vous dites donc que l'échec était en partie le vôtre. C'est d'une honnêteté rafraîchissante."},
      {qui:"Nadia.", txt:"There's no point blaming the team. What I've learned is that timelines have to be defended.", fr:"Cela ne sert à rien de blâmer l'équipe. Ce que j'ai appris, c'est qu'il faut défendre les calendriers."},
      {qui:"Bright.", txt:"How would you cope if your budget were cut by a third next quarter?", fr:"Comment feriez-vous si votre budget était réduit d'un tiers le trimestre prochain ?"},
      {qui:"Nadia.", txt:"I'd have the priorities reviewed with the client rather than quietly cutting corners.", fr:"Je ferais revoir les priorités avec le client plutôt que de rogner discrètement sur la qualité."},
      {qui:"Bright.", txt:"Not only do you plan, you also negotiate. We'll be in touch by the end of the week.", fr:"Non seulement vous planifiez, mais vous négociez aussi. Nous vous recontacterons d'ici la fin de la semaine."},
      {qui:"Nadia.", txt:"I look forward to hearing from you. Thank you for your time.", fr:"J'attends de vos nouvelles avec impatience. Merci de votre temps."}
    ]},
    { num:"2", titre:"Defending a project in a meeting", perso:"Nadia — Owen (finance) — Priya (operations)", lignes:[
      {qui:"Owen.", txt:"Before we go any further, I have serious reservations about the cost of this proposal.", fr:"Avant d'aller plus loin, j'ai de sérieuses réserves sur le coût de cette proposition."},
      {qui:"Nadia.", txt:"That's a fair point, but the figure you're quoting includes a one-off setup fee.", fr:"C'est une remarque légitime, mais le chiffre que vous citez inclut des frais d'installation ponctuels."},
      {qui:"Priya.", txt:"Could you break that down for us? Right now it's hard to see where the money goes.", fr:"Pourriez-vous nous détailler cela ? Pour l'instant on voit mal où va l'argent."},
      {qui:"Nadia.", txt:"Certainly. Roughly sixty per cent goes on training; the rest covers licences.", fr:"Certainement. Environ soixante pour cent va à la formation ; le reste couvre les licences."},
      {qui:"Owen.", txt:"And what if the savings never materialise? We've been burnt before.", fr:"Et si les économies ne se concrétisent jamais ? On s'est déjà brûlé les doigts."},
      {qui:"Nadia.", txt:"Which is precisely why I'm proposing a three-month trial before we commit.", fr:"C'est justement pour cela que je propose un essai de trois mois avant de nous engager."},
      {qui:"Priya.", txt:"I must say I'd feel more comfortable with that. It limits our exposure.", fr:"Je dois dire que je serais plus à l'aise avec cela. Cela limite notre exposition."},
      {qui:"Nadia.", txt:"What we're really deciding today is whether the problem is worth solving at all.", fr:"Ce que nous décidons vraiment aujourd'hui, c'est de savoir si le problème mérite d'être résolu."},
      {qui:"Owen.", txt:"Hardly anyone disputes the problem. It's the solution I'm not sold on.", fr:"Presque personne ne conteste le problème. C'est la solution qui ne me convainc pas."},
      {qui:"Nadia.", txt:"Then let me send you the figures tonight and we'll pick this up on Thursday.", fr:"Alors laissez-moi vous envoyer les chiffres ce soir et nous reprendrons cela jeudi."},
      {qui:"Priya.", txt:"Agreed. Shall we park the vote until everyone has read the numbers?", fr:"D'accord. Repoussons le vote jusqu'à ce que tout le monde ait lu les chiffres, non ?"},
      {qui:"Owen.", txt:"Fine by me, provided the trial doesn't quietly turn into a rollout.", fr:"Cela me va, à condition que l'essai ne se transforme pas discrètement en déploiement."}
    ]},
    { num:"3", titre:"Negotiating a contract", perso:"Nadia (buyer) — Mr Ferreira (supplier)", lignes:[
      {qui:"Ferreira.", txt:"We can deliver within six weeks, but I'm afraid the price is non-negotiable.", fr:"Nous pouvons livrer sous six semaines, mais je crains que le prix ne soit pas négociable."},
      {qui:"Nadia.", txt:"Everything is negotiable if the volume is right. What if we doubled the order?", fr:"Tout est négociable si le volume est bon. Et si nous doublions la commande ?"},
      {qui:"Ferreira.", txt:"That would change things. On four thousand units I could look at five per cent.", fr:"Cela changerait la donne. Sur quatre mille unités, je pourrais envisager cinq pour cent."},
      {qui:"Nadia.", txt:"Five is a start, though it's not quite where we need to be.", fr:"Cinq, c'est un début, même si ce n'est pas tout à fait ce qu'il nous faut."},
      {qui:"Ferreira.", txt:"I'd rather not go below that. Our margins are already under pressure.", fr:"Je préférerais ne pas descendre en dessous. Nos marges sont déjà sous pression."},
      {qui:"Nadia.", txt:"Suppose we paid within fifteen days instead of sixty. Would that free anything up?", fr:"Supposons que nous payions sous quinze jours au lieu de soixante. Cela libérerait-il quelque chose ?"},
      {qui:"Ferreira.", txt:"Now you're talking. Early payment is worth a good deal to us.", fr:"Là, on se comprend. Un paiement anticipé vaut beaucoup pour nous."},
      {qui:"Nadia.", txt:"Then seven per cent, with delivery guaranteed in writing. Otherwise we're back to square one.", fr:"Alors sept pour cent, avec une livraison garantie par écrit. Sinon, on repart de zéro."},
      {qui:"Ferreira.", txt:"It is generally understood in our trade that penalties come at a cost.", fr:"Il est généralement admis dans notre métier que les pénalités ont un coût."},
      {qui:"Nadia.", txt:"So does a late delivery — only we're the ones who pay for it.", fr:"Une livraison tardive aussi — sauf que c'est nous qui la payons."},
      {qui:"Ferreira.", txt:"Very well. Seven, with penalties capped at ten per cent of the order.", fr:"Très bien. Sept, avec des pénalités plafonnées à dix pour cent de la commande."},
      {qui:"Nadia.", txt:"I'll have the contract drawn up this afternoon. It's been a pleasure doing business.", fr:"Je ferai rédiger le contrat cet après-midi. Ce fut un plaisir de traiter avec vous."}
    ]}
  ],
  types: [
    { id:"vf", nom:"Vrai / Faux", consigne:"Indiquez si chaque affirmation sur les dialogues est vraie ou fausse.", exercices:[
      {type:"vf", q:"Nadia worked in logistics before moving into project management.", a:true, exp:"Elle le dit explicitement : four years in logistics before moving into project management."},
      {type:"vf", q:"Nadia says the failed project was entirely her team's fault.", a:false, exp:"Au contraire : There's no point blaming the team, et elle admet I should have pushed back."},
      {type:"vf", q:"Mr Bright promises an answer before the end of the week.", a:true, exp:"We'll be in touch by the end of the week — by marque la limite avant laquelle l'action aura lieu."},
      {type:"vf", q:"Owen objects mainly to the cost of the proposal.", a:true, exp:"I have serious reservations about the cost — reservations about est la collocation formelle du désaccord poli."},
      {type:"vf", q:"About sixty per cent of the budget is spent on licences.", a:false, exp:"Inversion : soixante pour cent va à la formation (training), le reste aux licences."},
      {type:"vf", q:"Priya prefers the idea of a three-month trial.", a:true, exp:"I'd feel more comfortable with that — le conditionnel adoucit une préférence assumée."},
      {type:"vf", q:"Mr Ferreira accepts a discount immediately, without any condition.", a:false, exp:"Il commence par the price is non-negotiable et ne bouge qu'en échange du volume et du paiement anticipé."},
      {type:"vf", q:"Nadia offers to pay within fifteen days instead of sixty.", a:true, exp:"Suppose we paid… : le prétérit après suppose exprime une hypothèse, pas le passé."},
      {type:"vf", q:"The final agreement caps the penalties at ten per cent of the order.", a:true, exp:"Penalties capped at ten per cent — to cap = plafonner, terme clé des contrats."},
      {type:"vf", q:"Owen is completely convinced by Nadia's solution at the end of the meeting.", a:false, exp:"It's the solution I'm not sold on, et il accepte seulement provided the trial doesn't turn into a rollout."}
    ]},
    { id:"qcmdial", nom:"QCM de compréhension", consigne:"Choisissez la seule réponse correcte d'après les dialogues.", exercices:[
      {type:"qcm", q:"Why did Nadia leave logistics?", opts:["Because she was made redundant","Because she felt she would stop learning","Because the pay was too low","Because she moved abroad"], a:1, exp:"Had I stayed, I would have stopped learning : conditionnel 3 inversé, donc apprentissage et non salaire."},
      {type:"qcm", q:"How does Mr Bright react to Nadia admitting a mistake?", opts:["He is annoyed","He finds it refreshingly honest","He ignores it","He asks her to leave"], a:1, exp:"That's refreshingly honest — refreshingly marque une surprise agréable, ton positif."},
      {type:"qcm", q:"If her budget were cut, Nadia would…", opts:["cut corners quietly","resign","have the priorities reviewed with the client","ask for more staff"], a:2, exp:"have something done (causatif) : elle ferait réviser les priorités, elle ne le ferait pas elle-même."},
      {type:"qcm", q:"What does Owen mean by We've been burnt before?", opts:["There was a fire","They had a bad experience","They were criticised","They lost a client"], a:1, exp:"Idiome : to be burnt = avoir été échaudé par une mauvaise expérience passée."},
      {type:"qcm", q:"What does Nadia propose to reduce the risk?", opts:["A three-month trial","A bigger budget","A new supplier","Cancelling the project"], a:0, exp:"A three-month trial before we commit — trial = essai à durée limitée."},
      {type:"qcm", q:"Hardly anyone disputes the problem means that…", opts:["nobody understands the problem","almost everyone agrees the problem is real","the problem is imaginary","people argue about the problem"], a:1, exp:"Hardly anyone = presque personne ne… : quasi-négation, donc quasi-unanimité sur le problème."},
      {type:"qcm", q:"What finally persuades Mr Ferreira to move on price?", opts:["A threat of legal action","Doubling the order plus early payment","A personal favour","A longer deadline"], a:1, exp:"Le volume ouvre la porte (five per cent) et le paiement à quinze jours débloque les sept pour cent."},
      {type:"qcm", q:"Now you're talking expresses…", opts:["irritation","approval of the new offer","a change of subject","doubt"], a:1, exp:"Idiome informel : enfin une proposition intéressante. Registre familier mais positif."},
      {type:"qcm", q:"Back to square one means…", opts:["back to the start","back to the office","the first clause","the best option"], a:0, exp:"Idiome : revenir au point de départ, sans progrès."},
      {type:"qcm", q:"Nadia says I'll have the contract drawn up. This means she…", opts:["will write it herself","will ask someone else to write it","will refuse to sign it","has already signed it"], a:1, exp:"Causatif have + participe passé : on fait faire l'action par un tiers."}
    ]},
    { id:"rectif", nom:"Rectifier l'affirmation fausse", consigne:"Chaque affirmation est fausse. Écrivez le mot ou groupe de mots qui la corrige.", exercices:[
      {type:"input", q:"Nadia spent four years in FINANCE before project management. Corrigez le mot en majuscules.", a:["logistics"], ph:"un mot", exp:"Logistics est indénombrable en anglais malgré le -s : logistics is a demanding field."},
      {type:"input", q:"Mr Bright will be in touch by the end of the MONTH. Corrigez.", a:["week"], ph:"un mot", exp:"By the end of the week : by = au plus tard à, contrairement à until qui exprime la durée."},
      {type:"input", q:"Sixty per cent of the budget goes on LICENCES. Corrigez.", a:["training"], ph:"un mot", exp:"Training est indénombrable : on dit some training, jamais a training."},
      {type:"input", q:"Nadia proposes a SIX-month trial. Corrigez le chiffre en lettres.", a:["three","3"], ph:"un mot", exp:"Dans a three-month trial, le nom composé reste au singulier : three-month, pas three-months."},
      {type:"input", q:"Ferreira first offers TEN per cent on four thousand units. Corrigez le chiffre en lettres.", a:["five","5"], ph:"un mot", exp:"Il commence à five ; les sept pour cent arrivent seulement après la contrepartie du paiement rapide."},
      {type:"input", q:"Nadia offers to pay within FIFTY days instead of sixty. Corrigez.", a:["fifteen","15"], ph:"un mot", exp:"Attention au piège phonétique fifteen (accent final) / fifty (accent initial)."},
      {type:"input", q:"Penalties are capped at TWENTY per cent of the order. Corrigez le chiffre en lettres.", a:["ten","10"], ph:"un mot", exp:"To cap at = plafonner à ; la préposition at est obligatoire avec un chiffre limite."},
      {type:"input", q:"Owen works in OPERATIONS. Corrigez le service.", a:["finance"], ph:"un mot", exp:"Owen est finance, Priya operations : c'est Owen qui conteste le coût."},
      {type:"input", q:"Nadia says she should have ACCEPTED the deadline. Corrigez le verbe.", a:["pushed back on","pushed back","pushed"], ph:"un verbe", exp:"Push back on = contester, s'opposer poliment. Should have + participe = regret sur le passé."},
      {type:"input", q:"Ferreira can deliver within SIXTEEN weeks. Corrigez le chiffre en lettres.", a:["six","6"], ph:"un mot", exp:"Within six weeks = dans un délai maximal de six semaines ; in six weeks signifierait au bout de six semaines."}
    ]},
    { id:"texte", nom:"Texte + questions", consigne:"Lisez l'article, puis répondez aux questions (dont certaines portent sur l'implicite).", exercices:[
      {type:"qcm", q:"TEXTE — The four-day week: promise or illusion? (1) Three years ago, a mid-sized software firm in Bristol became the first in its sector to cut the working week to four days. (2) Salaries were left untouched. (3) The managing director, Alan Reeve, admitted at the time that he expected to reverse the decision within months. (4) He never did. (5) Productivity, measured in delivered projects, rose by nine per cent in the first year. (6) Sick leave fell by almost a third. (7) What the figures do not show, however, is the strain the change placed on middle managers. (8) Several of them reported working longer hours than before in order to keep deadlines intact. (9) One left the company altogether. (10) Critics argue that the model only works in industries where output can be measured project by project. (11) Hospitals, schools and shops, they point out, cannot simply close on Fridays. (12) Supporters counter that the very idea of a five-day week is a historical accident, invented barely a century ago. (13) Had the reformers of the 1920s been slightly bolder, they say, we might all be working four days today. (14) Reeve himself is more cautious. (15) It suits us, he says, but I would be wary of turning a local success into a national policy. (16) The government has so far shown no appetite for legislation. — Question : What was Reeve's initial expectation?", opts:["That productivity would double","That he would soon cancel the change","That staff would resign","That the government would legislate"], a:1, exp:"Phrase 3 : he expected to reverse the decision within months. To reverse = revenir sur une décision."},
      {type:"qcm", q:"By how much did productivity rise in the first year?", opts:["Three per cent","Nine per cent","A third","It did not rise"], a:1, exp:"Phrase 5. Ne pas confondre avec sick leave, qui a baissé d'un tiers (phrase 6)."},
      {type:"vf", q:"Salaries were reduced when the week was shortened.", a:false, exp:"Salaries were left untouched : passif + untouched = rien n'a changé."},
      {type:"qcm", q:"What does sentence 7 suggest about the published figures?", opts:["They were falsified","They hide a human cost","They were incomplete by accident","They were too old"], a:1, exp:"Implicite : what the figures do not show is the strain — phrase clivée qui met en relief ce qui est occulté."},
      {type:"vf", q:"Some middle managers worked more hours after the reform.", a:true, exp:"Phrase 8 : working longer hours than before in order to keep deadlines intact."},
      {type:"qcm", q:"Why do critics say the model has limits?", opts:["Because staff dislike it","Because some sectors cannot close a day","Because it costs too much","Because it is illegal"], a:1, exp:"Phrases 10-11 : hôpitaux, écoles et commerces ne peuvent pas fermer le vendredi."},
      {type:"qcm", q:"Had the reformers of the 1920s been bolder… is equivalent to:", opts:["If the reformers had been bolder","When the reformers were bolder","The reformers were bolder","Unless the reformers were bolder"], a:0, exp:"Inversion sans if du conditionnel 3, registre écrit soutenu."},
      {type:"qcm", q:"What does Reeve's own comment in sentence 15 show?", opts:["He regrets the change","He is enthusiastic about generalising it","He supports it locally but distrusts generalisation","He plans to resign"], a:2, exp:"It suits us… but I would be wary of turning a local success into a national policy : nuance, pas de regret."},
      {type:"vf", q:"The government is preparing a law on the four-day week.", a:false, exp:"Phrase 16 : no appetite for legislation — litote formelle signifiant aucune intention."},
      {type:"input", q:"Trouvez dans le texte le nom qui signifie la pression ou tension subie (phrase 7).", a:["strain","the strain"], ph:"un nom", exp:"Strain = tension durable subie ; stress est plus général, pressure plus extérieure."}
    ]},
    { id:"doc", nom:"Document authentique", consigne:"Lisez la lettre de motivation, puis répondez.", exercices:[
      {type:"qcm", q:"LETTRE — Dear Ms Hargreaves, I am writing in response to your advertisement for a Project Coordinator, posted on your website on 3 April. Having spent the last five years managing supply contracts for a manufacturing group, I believe I could bring to your team both rigour and a certain tolerance for uncertainty. In my current role I oversee a budget of two million euros and coordinate a team of eleven. What I find most rewarding is not the planning itself but the moment when a difficult client is finally won over. I should add that I am familiar with the software your department uses, having helped implement it at my previous employer. I would welcome the opportunity to discuss how my experience might serve your objectives. I am available for interview at your convenience and can be reached on the number below. Yours sincerely, Nadia Kessler — Question : Where did the candidate see the job?", opts:["In a newspaper","On the company website","Through a friend","At a job fair"], a:1, exp:"Posted on your website on 3 April : on pour un site et pour une date précise."},
      {type:"qcm", q:"Yours sincerely is used because…", opts:["the writer knows the reader well","the recipient's name is known","the letter is informal","the letter is a complaint"], a:1, exp:"Règle britannique : Dear Ms Hargreaves (nom connu) → Yours sincerely ; Dear Sir or Madam → Yours faithfully."},
      {type:"vf", q:"The candidate currently manages a team of eleven people.", a:true, exp:"Coordinate a team of eleven — coordinate ici sans préposition, contrairement à coordinate with somebody."},
      {type:"qcm", q:"Having spent the last five years… is a…", opts:["past simple clause","perfect participle clause","passive","conditional"], a:1, exp:"Participe parfait : compresse une subordonnée causale ou temporelle antérieure, très fréquent à l'écrit formel."},
      {type:"qcm", q:"What does she say she enjoys most?", opts:["Planning","Winning over a difficult client","Managing budgets","Using the software"], a:1, exp:"Phrase clivée what… is : ce qui est le plus gratifiant, c'est le moment où le client est convaincu."},
      {type:"input", q:"Retrouvez le phrasal verb signifiant convaincre quelqu'un de réticent.", a:["win over","won over","to win over"], ph:"phrasal verb", exp:"Win somebody over = rallier quelqu'un à sa cause, plus progressif que convince."},
      {type:"qcm", q:"At your convenience means…", opts:["urgently","whenever it suits you","free of charge","near your office"], a:1, exp:"Formule très formelle de politesse ; ne pas traduire par pratique."},
      {type:"vf", q:"She has never used the software the department works with.", a:false, exp:"Elle a même contribué à l'installer : having helped implement it at my previous employer."},
      {type:"qcm", q:"I would welcome the opportunity to… is preferred to I want to meet you because it is…", opts:["shorter","more formal and less blunt","grammatically simpler","more emotional"], a:1, exp:"Registre : would welcome atténue la demande ; I want serait perçu comme abrupt dans une lettre."},
      {type:"input", q:"Complétez la formule d'appel si le nom du destinataire est inconnu : Dear Sir or Madam … Yours ____.", a:["faithfully"], ph:"un mot", exp:"Yours faithfully s'emploie uniquement quand on ignore le nom du destinataire (usage britannique)."}
    ]},
    { id:"syn", nom:"Synonymes et nuances", consigne:"Choisissez le synonyme le plus proche dans le contexte donné.", exercices:[
      {type:"qcm", q:"I have serious RESERVATIONS about the plan.", opts:["bookings","doubts","refusals","questions"], a:1, exp:"Reservations = réserves, doutes exprimés poliment. Le sens hôtelier existe mais ne convient pas ici."},
      {type:"qcm", q:"The deadline is TIGHT.", opts:["narrow","strict and hard to meet","closed","exact"], a:1, exp:"A tight deadline = un délai serré ; tight qualifie aussi budget et schedule."},
      {type:"qcm", q:"Sales figures were DISAPPOINTING but not catastrophic.", opts:["underwhelming","dreadful","promising","stable"], a:0, exp:"Underwhelming = décevant sans être catastrophique ; dreadful serait bien trop fort."},
      {type:"qcm", q:"He CONCEDED that the report was late.", opts:["denied","admitted reluctantly","announced","proved"], a:1, exp:"Concede = admettre à contrecœur, souvent sous la pression d'un argument adverse."},
      {type:"qcm", q:"Our margins are under PRESSURE.", opts:["strain","weight","stress","air"], a:0, exp:"Under strain conserve l'idée de tension économique ; stress s'emploie surtout pour les personnes."},
      {type:"qcm", q:"We need to STREAMLINE the process.", opts:["simplify and speed up","stop","publish","complicate"], a:0, exp:"Streamline = rationaliser pour gagner en fluidité, pas seulement réduire."},
      {type:"qcm", q:"She is a THOROUGH worker.", opts:["fast","meticulous","friendly","experienced"], a:1, exp:"Thorough = qui ne néglige aucun détail ; ne pas confondre avec through."},
      {type:"qcm", q:"The offer is TEMPTING.", opts:["appealing","binding","temporary","doubtful"], a:0, exp:"Appealing = attirant ; tempting ajoute l'idée qu'on hésite à céder."},
      {type:"qcm", q:"They RESCHEDULED the meeting for Friday.", opts:["cancelled","postponed to a new date","shortened","recorded"], a:1, exp:"Reschedule implique une nouvelle date fixée, contrairement à postpone qui peut rester vague."},
      {type:"qcm", q:"His explanation was CONVINCING.", opts:["compelling","confusing","brief","polite"], a:0, exp:"Compelling = qui emporte l'adhésion ; plus fort et plus littéraire que convincing."}
    ]},
    { id:"ant", nom:"Antonymes", consigne:"Choisissez le contraire le plus exact dans le contexte.", exercices:[
      {type:"qcm", q:"Contraire de a RELUCTANT participant :", opts:["a willing participant","a silent participant","a late participant","a paid participant"], a:0, exp:"Reluctant (réticent) s'oppose à willing (consentant, de bon gré)."},
      {type:"qcm", q:"Contraire de to TIGHTEN a budget :", opts:["to loosen","to break","to lower","to sign"], a:0, exp:"Tighten / loosen forment une paire ; relax a budget est également possible."},
      {type:"qcm", q:"Contraire de a TEMPORARY contract :", opts:["a permanent contract","a signed contract","a short contract","a written contract"], a:0, exp:"Temporary / permanent : en emploi on parle de a permanent position."},
      {type:"qcm", q:"Contraire de to ACCEPT an offer :", opts:["to turn it down","to take it up","to look it up","to put it off"], a:0, exp:"Turn down = décliner. Take up signifierait au contraire accepter une proposition."},
      {type:"qcm", q:"Contraire de VAGUE instructions :", opts:["precise","long","oral","polite"], a:0, exp:"Vague s'oppose à precise ou specific, pas à true."},
      {type:"qcm", q:"Contraire de a SCARCE resource :", opts:["abundant","expensive","natural","useful"], a:0, exp:"Scarce = rare, en pénurie ; abundant = abondant."},
      {type:"qcm", q:"Contraire de to HIRE staff :", opts:["to lay off","to train","to promote","to pay"], a:0, exp:"Lay off = licencier pour raison économique ; fire vise une faute individuelle."},
      {type:"qcm", q:"Contraire de a RISE in profits :", opts:["a drop","a peak","a total","a share"], a:0, exp:"A drop / a fall in profits. Attention : a decrease est plus neutre et technique."},
      {type:"qcm", q:"Contraire de CAUTIOUS optimism :", opts:["reckless enthusiasm","quiet hope","mild doubt","firm belief"], a:0, exp:"Cautious (prudent) s'oppose à reckless (imprudent, téméraire)."},
      {type:"qcm", q:"Contraire de to DENY responsibility :", opts:["to acknowledge it","to share it","to discuss it","to avoid it"], a:0, exp:"Acknowledge = reconnaître officiellement ; admit conviendrait aussi mais suppose une faute."}
    ]},
    { id:"motjuste", nom:"Le mot juste", consigne:"Complétez avec le mot exact. La collocation compte autant que le sens.", exercices:[
      {type:"input", q:"They failed to ____ the deadline. (respecter)", a:["meet"], ph:"un verbe", exp:"Meet a deadline est la collocation obligatoire ; respect a deadline est un calque du français."},
      {type:"input", q:"We need to ____ a decision by Friday. (prendre)", a:["make","reach","take"], ph:"un verbe", exp:"Make a decision (usuel) ou reach a decision (après délibération). Take a decision existe surtout en anglais britannique institutionnel."},
      {type:"input", q:"He ____ a strong argument in favour of the merger. (avancer)", a:["made","put forward","advanced"], ph:"un verbe au passé", exp:"Make an argument ou put forward an argument ; say an argument est impossible."},
      {type:"input", q:"The company ____ heavy losses last year. (subir)", a:["suffered","incurred","made"], ph:"un verbe au passé", exp:"Suffer losses (courant) ou incur losses (comptable). Support est un faux ami."},
      {type:"input", q:"Could you ____ me a favour? (rendre)", a:["do"], ph:"un verbe", exp:"Do somebody a favour : make a favour est une erreur fréquente chez les francophones."},
      {type:"input", q:"She ____ a lot of experience in negotiation. (avoir acquis)", a:["has gained","gained","has acquired"], ph:"verbe + complément", exp:"Gain experience ; experience est indénombrable, donc ni an experience ni experiences ici."},
      {type:"input", q:"Let's ____ the issue at the next meeting. (aborder)", a:["raise","address","bring up"], ph:"un verbe", exp:"Raise an issue = soulever ; address an issue = traiter. Discuss about est incorrect."},
      {type:"input", q:"The report ____ serious concerns about safety. (soulève)", a:["raises"], ph:"un verbe", exp:"Raise concerns : le verbe raise est transitif, rise ne l'est pas."},
      {type:"input", q:"We must ____ into account the delivery costs. (prendre)", a:["take"], ph:"un verbe", exp:"Take something into account, ou take account of something : deux structures, jamais take in account."},
      {type:"input", q:"He ____ his mind at the last minute. (changer d'avis)", a:["changed"], ph:"un verbe au passé", exp:"Change one's mind ; change of opinion serait lourd et inhabituel à l'oral."}
    ]},
    { id:"familles", nom:"Familles de mots et dérivation", consigne:"Formez le mot dérivé demandé à partir du mot en majuscules.", exercices:[
      {type:"input", q:"His ____ to the project was total. (COMMIT — nom)", a:["commitment"], ph:"un nom", exp:"Commit → commitment (double t maintenu). Commitment = engagement personnel, pas commission."},
      {type:"input", q:"The plan proved highly ____. (PROFIT — adjectif)", a:["profitable"], ph:"un adjectif", exp:"Profitable (rentable) ; profitful n'existe pas et profiteering est péjoratif."},
      {type:"input", q:"She spoke with great ____. (CONFIDENT — nom)", a:["confidence"], ph:"un nom", exp:"Confident → confidence. Attention : confidence signifie aussi confiance en soi, pas seulement confidence secrète."},
      {type:"input", q:"The decision was taken ____. (UNANIMOUS — adverbe)", a:["unanimously"], ph:"un adverbe", exp:"Adjectif en -ous → adverbe en -ously, sans changement de radical."},
      {type:"input", q:"They questioned the ____ of the data. (RELIABLE — nom)", a:["reliability"], ph:"un nom", exp:"Reliable → reliability : les adjectifs en -able donnent des noms en -ability."},
      {type:"input", q:"He is completely ____ of managing the team. (CAPABLE — contraire)", a:["incapable"], ph:"un adjectif", exp:"Préfixe in- devant capable ; uncapable n'existe pas. Comparer avec unable to do."},
      {type:"input", q:"The new rules were widely ____. (CRITIC — verbe au passif)", a:["criticised","criticized"], ph:"un participe", exp:"Critic (le critique, personne) → criticise (le verbe) → criticism (le nom)."},
      {type:"input", q:"There has been a marked ____ in demand. (GROW — nom)", a:["growth"], ph:"un nom", exp:"Grow → growth, nom indénombrable : a growth in demand mais jamais growths."},
      {type:"input", q:"Their offer was ____ vague. (DELIBERATE — adverbe)", a:["deliberately"], ph:"un adverbe", exp:"Deliberately = à dessein. Nuance : intentionally est neutre, deliberately suggère la préméditation."},
      {type:"input", q:"We cannot afford such ____. (EFFICIENT — contraire, nom)", a:["inefficiency"], ph:"un nom", exp:"Efficient → inefficient → inefficiency. Ne pas confondre efficiency (rendement) et effectiveness (efficacité du résultat)."}
    ]},
    { id:"fauxamis", nom:"Faux amis et pièges", consigne:"Choisissez la traduction correcte : attention aux faux amis.", exercices:[
      {type:"qcm", q:"Traduisez : Il a finalement accepté.", opts:["He eventually agreed","He actually agreed","He finally accepted the invitation to","He agreed at last minute"], a:0, exp:"Eventually = finalement, au bout du compte. Actually signifie en fait."},
      {type:"qcm", q:"Traduisez : Actuellement, nous recrutons.", opts:["Actually we are recruiting","Currently we are recruiting","Eventually we recruit","Presently we recruited"], a:1, exp:"Actuellement = currently / at present. Actually est le faux ami classique."},
      {type:"qcm", q:"Traduisez : J'assiste à la réunion.", opts:["I assist the meeting","I attend the meeting","I help the meeting","I assist to the meeting"], a:1, exp:"Attend = assister à (sans préposition). Assist = aider quelqu'un."},
      {type:"qcm", q:"Traduisez : Cette formation est utile.", opts:["This formation is useful","This training is useful","This education is useful","This formations are useful"], a:1, exp:"Formation en français = training. Formation en anglais désigne une formation géologique ou militaire."},
      {type:"qcm", q:"Traduisez : Le contrôle qualité.", opts:["The quality control","The quality check-up","The quality monitoring","The quality supervision"], a:0, exp:"Ici control convient, mais attention : contrôler un document se dit check, pas control."},
      {type:"qcm", q:"Traduisez : Il est très sensible aux critiques.", opts:["He is very sensible to criticism","He is very sensitive to criticism","He is very susceptible of criticism","He is very sentimental about criticism"], a:1, exp:"Sensitive = sensible ; sensible signifie raisonnable, sensé."},
      {type:"qcm", q:"Traduisez : Nous avons demandé un délai.", opts:["We asked for a delay","We asked for an extension","We demanded a delay","We asked a deadline"], a:1, exp:"Un délai supplémentaire = an extension. Delay = un retard subi. Et demand = exiger."},
      {type:"qcm", q:"Traduisez : L'entreprise a beaucoup de personnel.", opts:["The firm has many personals","The firm has a large staff","The firm has many staffs","The firm has much personals"], a:1, exp:"Staff est un collectif : a large staff, the staff are helpful (accord pluriel en anglais britannique)."},
      {type:"qcm", q:"Traduisez : Je vous propose une réduction.", opts:["I propose you a discount","I can offer you a discount","I propose to you a reduction","I purpose a discount"], a:1, exp:"Offer somebody something ; propose somebody something est agrammatical, et reduction est plus technique que discount."},
      {type:"qcm", q:"Traduisez : Il a été licencié l'an dernier.", opts:["He was licensed last year","He was made redundant last year","He was resigned last year","He was dismissing last year"], a:1, exp:"Made redundant = licencié pour motif économique. Licensed signifie titulaire d'une licence."}
    ]},
    { id:"qr", nom:"Question ↔ réponse", consigne:"Associez la question à la réponse qui lui correspond le mieux.", exercices:[
      {type:"qcm", q:"How long have you been with the company?", opts:["Since 2019","In 2019","For 2019","By 2019"], a:0, exp:"Present perfect continu + since pour un point de départ ; for exigerait une durée (for six years)."},
      {type:"qcm", q:"Would you mind sending the figures again?", opts:["Yes, I would love to","Not at all, I'll do it now","Yes, of course, gladly","No, I refuse to mind"], a:1, exp:"Would you mind…? : la réponse positive est négative (not at all), car mind signifie voir un inconvénient."},
      {type:"qcm", q:"What would you do if the client pulled out?", opts:["I will look for another","I would look for another","I looked for another","I had looked for another"], a:1, exp:"Conditionnel 2 : if + prétérit dans la subordonnée, would + base verbale dans la principale."},
      {type:"qcm", q:"You haven't signed it yet, have you?", opts:["No, not yet","Yes, I haven't","No, I have signed it","Yes, not yet"], a:0, exp:"Question tag après une négation : la réponse confirme par no. La logique anglaise suit le fait, pas la question."},
      {type:"qcm", q:"Could you possibly reconsider the price?", opts:["I'm afraid it's non-negotiable","I could possibly not","Yes, I could possibly","It doesn't matter to me"], a:0, exp:"I'm afraid… est la formule d'atténuation standard pour un refus poli."},
      {type:"qcm", q:"When will you have finished the report?", opts:["By Thursday at the latest","Since Thursday","Until Thursday","During Thursday"], a:0, exp:"Future perfect + by : la limite temporelle. Until exprimerait la continuité jusqu'à jeudi."},
      {type:"qcm", q:"How did the meeting go?", opts:["It went better than expected","It goes very well","It has gone tomorrow","It is going yesterday"], a:0, exp:"Prétérit pour un événement terminé ; better than expected est une collocation naturelle."},
      {type:"qcm", q:"Do you happen to know who is chairing the meeting?", opts:["Yes, Priya is","Yes, is Priya","Yes, who is Priya","Priya does chair"], a:0, exp:"Question indirecte enchâssée : who is chairing garde l'ordre affirmatif ; la réponse reprend l'auxiliaire."},
      {type:"qcm", q:"Shall I book the room for two hours?", opts:["Yes, please do","Yes, you shall","Yes, I shall","Yes, you will do"], a:0, exp:"Shall I…? propose un service ; on répond par please do ou that would be great."},
      {type:"qcm", q:"What's the point of arguing about it now?", opts:["There isn't one, honestly","Yes, there is a point of it","No, the point isn't","It has no points"], a:0, exp:"What's the point of + gérondif = à quoi bon. La réponse reprend elliptiquement one pour a point."}
    ]},
    { id:"poserq", nom:"Poser la question", consigne:"Écrivez la question qui correspond à l'élément souligné entre crochets.", exercices:[
      {type:"input", q:"She left the company [because she wanted a new challenge]. Question ?", a:["why did she leave the company","why did she leave the company?"], ph:"Why…", exp:"Why + did + sujet + base verbale : l'auxiliaire porte le passé, donc leave et non left."},
      {type:"input", q:"The meeting lasted [three hours]. Question ?", a:["how long did the meeting last","how long did the meeting last?"], ph:"How long…", exp:"How long pour une durée ; how much time est possible mais plus lourd."},
      {type:"input", q:"[Owen] raised the objection. Question ?", a:["who raised the objection","who raised the objection?"], ph:"Who…", exp:"Question sur le sujet : pas de do, ordre affirmatif conservé."},
      {type:"input", q:"They have been negotiating [since March]. Question ?", a:["how long have they been negotiating","how long have they been negotiating?"], ph:"How long…", exp:"Present perfect continu pour une action commencée dans le passé et toujours en cours."},
      {type:"input", q:"The contract was signed [by the legal department]. Question ?", a:["who was the contract signed by","who was the contract signed by?","by whom was the contract signed"], ph:"Who…by ?", exp:"Au passif, la préposition by se rejette en fin de question ; by whom appartient au registre très formel."},
      {type:"input", q:"He is worried [about the delivery date]. Question ?", a:["what is he worried about","what is he worried about?"], ph:"What…about ?", exp:"Verbe prépositionnel be worried about : la préposition reste à la fin en anglais courant."},
      {type:"input", q:"She earns [about fifty thousand a year]. Question ?", a:["how much does she earn","how much does she earn?"], ph:"How much…", exp:"How much pour un montant indénombrable ; how many exigerait un pluriel dénombrable."},
      {type:"input", q:"They will announce the results [on Friday]. Question ?", a:["when will they announce the results","when will they announce the results?"], ph:"When…", exp:"Inversion sujet-auxiliaire après le mot interrogatif : when will they, jamais when they will."},
      {type:"input", q:"I'd like to know [where the archives are kept]. Formulez la question directe.", a:["where are the archives kept","where are the archives kept?"], ph:"Where…", exp:"Question directe = inversion ; la question indirecte gardait l'ordre where the archives are kept."},
      {type:"input", q:"[Twenty people] attended the workshop. Question ?", a:["how many people attended the workshop","how many people attended the workshop?"], ph:"How many…", exp:"Question sur le sujet avec how many : pas d'auxiliaire do."}
    ]},
    { id:"replique", nom:"La réplique manquante", consigne:"Choisissez la réplique qui convient, en tenant compte du registre.", exercices:[
      {type:"qcm", q:"— I'm afraid we can't go any lower on price. — ____", opts:["Then we may have to look elsewhere","Then I don't want it never","So you can't lower it, isn't it","Then lower it now"], a:0, exp:"May have to atténue la menace : on garde la porte ouverte, ce qui est l'usage en négociation."},
      {type:"qcm", q:"— Thank you for a very useful meeting. — ____", opts:["Not at all, it was a pleasure","You are welcome to it","It is nothing of important","Don't thank me, please stop"], a:0, exp:"Not at all et my pleasure sont les réponses standard ; you're welcome est plus américain."},
      {type:"qcm", q:"— Sorry, could you go over that last point again? — ____", opts:["Of course. What I meant was…","No, I already said it","You should listen better","Go over it yourself"], a:0, exp:"Go over = revoir, reprendre. What I meant was… reformule sans reproche."},
      {type:"qcm", q:"— I've just been promoted! — ____", opts:["Congratulations, that's well deserved","It was time already","Are you sure of that","I am sorry to hear it"], a:0, exp:"Well deserved est la collocation attendue ; congratulations est toujours au pluriel."},
      {type:"qcm", q:"— We seem to have reached a deadlock. — ____", opts:["Shall we take a short break and come back to it?","So it is finished forever","You have reached it alone","A deadlock is not possible"], a:0, exp:"Deadlock = impasse. Proposer une pause est la réponse pragmatique standard."},
      {type:"qcm", q:"— Would it be possible to postpone until Monday? — ____", opts:["That should be fine, I'll check with the team","It would be possible to not","Postpone is impossible always","Yes, I postpone it yesterday"], a:0, exp:"Should be fine = accord prudent, laissant place à vérification."},
      {type:"qcm", q:"— Honestly, I think the whole plan is flawed. — ____", opts:["I see your point, but let me explain the reasoning","You are totally wrong and rude","Flawed is not an English word","Yes, I think it too, so what"], a:0, exp:"I see your point, but… : concession puis objection, structure clé de l'argumentation B2."},
      {type:"qcm", q:"— Do you mind if I record the interview? — ____", opts:["Not at all, go ahead","Yes, go ahead please","I mind it very much, record it","No, don't record it, please do"], a:0, exp:"Do you mind if…? : accepter se dit not at all ; répondre yes signifierait un refus."},
      {type:"qcm", q:"— I'm sorry, I completely forgot to send it. — ____", opts:["Don't worry, these things happen","It is your big fault indeed","You forget always everything","I forgive you never"], a:0, exp:"These things happen minimise poliment ; le registre professionnel évite le reproche direct."},
      {type:"qcm", q:"— Let me know if anything comes up. — ____", opts:["Will do, thanks","I let you know it","Yes, something came up","Nothing comes up ever"], a:0, exp:"Will do : ellipse informelle mais très courante au travail pour I will do that."}
    ]},
    { id:"ordredial", nom:"Remettre le dialogue dans l'ordre", consigne:"Choisissez l'ordre logique des répliques.", exercices:[
      {type:"qcm", q:"a) I'd rather not commit today. b) Could we discuss the contract? c) Of course, what's on your mind? d) The delivery terms worry me.", opts:["b-c-d-a","b-d-c-a","c-b-a-d","d-b-c-a"], a:0, exp:"Demande, acceptation, exposé du problème, réserve finale : progression logique de la négociation."},
      {type:"qcm", q:"a) Then let's aim for Thursday. b) When can you deliver? c) Wednesday at the earliest. d) That's cutting it fine.", opts:["b-c-d-a","b-d-c-a","a-b-c-d","c-b-d-a"], a:0, exp:"Cutting it fine = c'est très juste ; la réaction suit forcément l'annonce de la date."},
      {type:"qcm", q:"a) Not at all, take your time. b) Sorry to keep you waiting. c) He's just finishing a call. d) Is Mr Bright available?", opts:["d-c-b-a","b-a-d-c","d-b-c-a","c-d-a-b"], a:0, exp:"On demande, on explique, on s'excuse du délai, on rassure."},
      {type:"qcm", q:"a) I'll email it this afternoon. b) Have you seen my report? c) No, when did you send it? d) I haven't yet, actually.", opts:["b-c-d-a","b-d-c-a","c-a-b-d","d-b-a-c"], a:0, exp:"Actually corrige une présupposition : logique seulement après la question when did you send it."},
      {type:"qcm", q:"a) Because the figures don't add up. b) I'm afraid I can't approve this. c) Let me check them again. d) May I ask why?", opts:["b-d-a-c","b-a-d-c","d-b-a-c","a-b-d-c"], a:0, exp:"Refus, demande d'explication, raison, réaction. Add up = être cohérent."},
      {type:"qcm", q:"a) Fine, but only three days. b) We need more time. c) How much more? d) A week would help.", opts:["b-c-d-a","b-d-c-a","c-d-b-a","d-c-b-a"], a:0, exp:"La demande vague précède la demande chiffrée, puis la contre-offre."},
      {type:"qcm", q:"a) Then I suggest we vote. b) Does anyone object? c) Silence, I take it. d) Nobody speaks.", opts:["b-d-c-a","b-c-d-a","a-b-d-c","d-b-c-a"], a:0, exp:"I take it = je suppose ; le commentaire vient après le silence constaté."},
      {type:"qcm", q:"a) It's been a pleasure. b) So we have a deal. c) I'll send the paperwork. d) Likewise.", opts:["b-c-a-d","b-a-c-d","a-b-c-d","c-b-a-d"], a:0, exp:"Likewise répond nécessairement à it's been a pleasure : c'est un écho de politesse."},
      {type:"qcm", q:"a) Not really, no. b) Any questions? c) In that case, we're done. d) Well, one small thing.", opts:["b-d-a-c","b-a-d-c","d-a-b-c","a-b-d-c"], a:0, exp:"Well introduit une réserve ; not really, no la referme avant la clôture."},
      {type:"qcm", q:"a) I'd have said the same. b) I turned it down. c) They offered me the job. d) Really? Why?", opts:["c-b-d-a","c-d-b-a","b-c-d-a","d-c-b-a"], a:0, exp:"Le refus surprend, d'où really? why?, puis l'approbation au conditionnel passé."}
    ]},
    { id:"substitution", nom:"Substitution et reformulation", consigne:"Choisissez la phrase qui garde exactement le même sens.", exercices:[
      {type:"qcm", q:"You needn't have come.", opts:["You came but it was unnecessary","You didn't come","You mustn't come","You had to come"], a:0, exp:"Needn't have + participe : l'action a bien eu lieu mais était inutile. Didn't need to laisserait le doute."},
      {type:"qcm", q:"It's high time we left.", opts:["We should have left already","We will leave soon","We left on time","It is time to arrive"], a:0, exp:"It's high time + prétérit : reproche implicite, on aurait déjà dû partir."},
      {type:"qcm", q:"I'd rather you didn't mention it.", opts:["Please don't mention it","I mentioned it","You'd better mention it","I prefer mentioning it"], a:0, exp:"Would rather + sujet différent + prétérit : préférence portant sur le comportement d'autrui, au présent."},
      {type:"qcm", q:"He can't have known about the change.", opts:["It's impossible that he knew","He wasn't allowed to know","He didn't want to know","He may have known"], a:0, exp:"Can't have + participe : déduction négative quasi certaine sur le passé."},
      {type:"qcm", q:"No sooner had she arrived than the phone rang.", opts:["She had barely arrived when the phone rang","She arrived after the phone rang","She never arrived","The phone rang long before"], a:0, exp:"No sooner… than : inversion obligatoire et corrélatif than, jamais when."},
      {type:"qcm", q:"They are said to be in financial difficulty.", opts:["People say they are in financial difficulty","They said they had difficulties","They must say it","They are told about difficulties"], a:0, exp:"Passif de rapport : it is said that they are… = they are said to be…"},
      {type:"qcm", q:"But for your help, we would have failed.", opts:["Without your help we would have failed","Thanks to you we failed","You did not help us","We failed despite your help"], a:0, exp:"But for = sans, n'eût été. Registre soutenu, suivi d'un groupe nominal."},
      {type:"qcm", q:"She had her office redecorated.", opts:["Somebody redecorated it for her","She redecorated it herself","Her office needed decorating","She decorated another office"], a:0, exp:"Have something done : le causatif exclut que le sujet ait agi lui-même."},
      {type:"qcm", q:"Hardly anyone turned up.", opts:["Almost nobody came","Everyone came","Nobody was invited","Many people came"], a:0, exp:"Hardly = à peine, quasi-négation. Turn up = se présenter, informel."},
      {type:"qcm", q:"Much as I admire him, I disagree.", opts:["Although I admire him a lot, I disagree","Because I admire him, I disagree","I admire him as much as I disagree","I neither admire nor agree"], a:0, exp:"Much as en tête de phrase = although very much, concession de registre littéraire."}
    ]},
    { id:"conj", nom:"Conjugaison et concordance des temps", consigne:"Mettez le verbe entre parenthèses au temps qui convient.", exercices:[
      {type:"input", q:"By the time you arrive, we ____ (finish) the presentation.", a:["will have finished"], ph:"verbe", exp:"Future perfect : action achevée avant un repère futur introduit par by the time (+ présent)."},
      {type:"input", q:"If I ____ (know) about the delay, I would have warned you.", a:["had known"], ph:"verbe", exp:"Conditionnel 3 : if + past perfect / would have + participe."},
      {type:"input", q:"She said she ____ (be) in Berlin the following week.", a:["would be"], ph:"verbe", exp:"Discours indirect : will devient would, et next week devient the following week."},
      {type:"input", q:"I wish I ____ (speak) better German at the interview yesterday.", a:["had spoken"], ph:"verbe", exp:"Wish + past perfect exprime le regret sur le passé ; wish + prétérit porterait sur le présent."},
      {type:"input", q:"They ____ (negotiate) for three hours when the deal finally collapsed.", a:["had been negotiating"], ph:"verbe", exp:"Past perfect continu : durée antérieure à un événement passé ponctuel."},
      {type:"input", q:"He ____ (work) here since the firm was founded.", a:["has worked","has been working"], ph:"verbe", exp:"Since + present perfect : la situation dure encore aujourd'hui, d'où l'exclusion du prétérit."},
      {type:"input", q:"If we ____ (be) more careful, we wouldn't be in this mess now.", a:["had been"], ph:"verbe", exp:"Conditionnel mixte : cause passée (had been) avec conséquence présente (wouldn't be now)."},
      {type:"input", q:"This time next month I ____ (run) the whole department.", a:["will be running"], ph:"verbe", exp:"Future continu : action en cours à un moment futur précis."},
      {type:"input", q:"She asked me whether I ____ (send) the file already.", a:["had sent"], ph:"verbe", exp:"Concordance : le present perfect du discours direct devient past perfect au rapporté."},
      {type:"input", q:"It's the first time I ____ (chair) a meeting on my own.", a:["have chaired"], ph:"verbe", exp:"It's the first time + present perfect : structure figée, le prétérit serait fautif."}
    ]},
    { id:"irreg", nom:"Verbes irréguliers et formes rares", consigne:"Donnez la forme demandée du verbe irrégulier.", exercices:[
      {type:"input", q:"to forbid — participe passé ?", a:["forbidden"], ph:"un mot", exp:"forbid / forbade / forbidden. On dit be forbidden to do ou forbid somebody from doing."},
      {type:"input", q:"to undergo — prétérit ?", a:["underwent"], ph:"un mot", exp:"Composé de go : undergo / underwent / undergone. Undergo a change = subir un changement."},
      {type:"input", q:"to withdraw — participe passé ?", a:["withdrawn"], ph:"un mot", exp:"draw / drew / drawn, donc withdraw / withdrew / withdrawn. Withdraw an offer = retirer une offre."},
      {type:"input", q:"to bid (aux enchères) — prétérit ?", a:["bid"], ph:"un mot", exp:"Verbe invariable : bid / bid / bid au sens d'enchérir. Au sens de souhaiter, on trouve bade."},
      {type:"input", q:"to foresee — participe passé ?", a:["foreseen"], ph:"un mot", exp:"see / saw / seen → foresee / foresaw / foreseen. Unforeseen circumstances = circonstances imprévues."},
      {type:"input", q:"to strike (faire grève) — prétérit ?", a:["struck"], ph:"un mot", exp:"strike / struck / struck. Le participe stricken subsiste dans grief-stricken."},
      {type:"input", q:"to seek — participe passé ?", a:["sought"], ph:"un mot", exp:"seek / sought / sought. Seek advice appartient au registre formel, contrairement à look for."},
      {type:"input", q:"to overcome — participe passé ?", a:["overcome"], ph:"un mot", exp:"come / came / come → overcome / overcame / overcome. Overcome an obstacle = surmonter."},
      {type:"input", q:"to lie (être étendu) — prétérit ?", a:["lay"], ph:"un mot", exp:"lie / lay / lain. À distinguer de lay / laid / laid (poser) et de lie / lied / lied (mentir)."},
      {type:"input", q:"to prove — participe passé formel encore admis ?", a:["proven","proved"], ph:"un mot", exp:"Proved est standard, proven survit comme adjectif : a proven track record."}
    ]},
    { id:"interro", nom:"Questions et questions indirectes", consigne:"Choisissez ou complétez la forme interrogative correcte.", exercices:[
      {type:"qcm", q:"Could you tell me ____?", opts:["where is the meeting room","where the meeting room is","where the meeting room is?","where is the meeting room at"], a:1, exp:"Question indirecte : pas d'inversion, ordre sujet-verbe conservé."},
      {type:"qcm", q:"I wonder ____ the offer is still valid.", opts:["whether","that","what","which"], a:0, exp:"Whether ou if pour une interrogative indirecte totale ; whether est préféré à l'écrit formel."},
      {type:"input", q:"Direct : Why did they refuse? → Indirect : She asked me ____.", a:["why they had refused","why they refused"], ph:"why…", exp:"Pas d'auxiliaire did en indirect, et concordance : refused devient had refused."},
      {type:"qcm", q:"Do you have any idea ____?", opts:["how much does it cost","how much it costs","how much costs it","how much it does cost"], a:1, exp:"Après do you have any idea, la subordonnée garde l'ordre affirmatif."},
      {type:"input", q:"Complétez le question tag : You've read the report, ____?", a:["haven't you","haven't you?"], ph:"tag", exp:"Reprise de l'auxiliaire have à la forme négative contractée, sujet pronominal."},
      {type:"input", q:"Complétez : Let's postpone it, ____?", a:["shall we","shall we?"], ph:"tag", exp:"Le tag de let's est toujours shall we, exception mémorable."},
      {type:"qcm", q:"____ of the two proposals do you prefer?", opts:["What","Which","Who","How"], a:1, exp:"Which pour un choix dans un ensemble fermé et connu ; what pour un ensemble ouvert."},
      {type:"qcm", q:"____ did the delay affect the budget?", opts:["How much","How many","How long","How far"], a:0, exp:"How much porte sur le degré d'un effet ; how far est possible mais plus abstrait."},
      {type:"input", q:"Direct : Are you free on Monday? → Indirect : He asked ____ free on Monday.", a:["whether i was","if i was","whether i were"], ph:"whether…", exp:"Interrogative totale : whether/if + ordre affirmatif + concordance are → was."},
      {type:"qcm", q:"What's the report ____?", opts:["about","on about","of","for about"], a:0, exp:"Verbe ou expression à préposition rejetée : la préposition reste en fin en anglais courant."}
    ]},
    { id:"prep", nom:"Prépositions et verbes prépositionnels", consigne:"Complétez avec la préposition correcte.", exercices:[
      {type:"input", q:"They insisted ____ seeing the manager.", a:["on"], ph:"préposition", exp:"Insist on + gérondif. Insist to do n'existe pas."},
      {type:"input", q:"She is responsible ____ the whole northern region.", a:["for"], ph:"préposition", exp:"Responsible for something, mais responsible to somebody (hiérarchie)."},
      {type:"input", q:"We must comply ____ the new regulations.", a:["with"], ph:"préposition", exp:"Comply with = se conformer à. La préposition n'est jamais to."},
      {type:"input", q:"He apologised ____ the delay.", a:["for"], ph:"préposition", exp:"Apologise for something, apologise to somebody : deux prépositions distinctes."},
      {type:"input", q:"There is no point ____ arguing about it.", a:["in"], ph:"préposition", exp:"No point in + gérondif ; la préposition tombe parfois à l'oral mais reste correcte à l'écrit."},
      {type:"input", q:"The decision was made ____ the board's insistence.", a:["at"], ph:"préposition", exp:"At somebody's insistence / at somebody's request : at marque l'instigation."},
      {type:"input", q:"I object ____ being treated like a beginner.", a:["to"], ph:"préposition", exp:"Object to + gérondif : to est ici préposition, d'où -ing et non la base verbale."},
      {type:"input", q:"They have run ____ of raw materials.", a:["out"], ph:"particule", exp:"Run out of = être à court de. Run out seul signifie expirer, pour un contrat."},
      {type:"input", q:"The success of the project hinges ____ the trial results.", a:["on"], ph:"préposition", exp:"Hinge on = dépendre entièrement de, plus imagé que depend on."},
      {type:"input", q:"She was congratulated ____ her promotion.", a:["on"], ph:"préposition", exp:"Congratulate somebody on something ; for est un calque fautif du français."}
    ]},
    { id:"det", nom:"Déterminants et quantifieurs", consigne:"Choisissez le déterminant ou quantifieur correct.", exercices:[
      {type:"qcm", q:"____ of the two candidates was suitable, so we reopened the process.", opts:["Neither","None","Either","No one"], a:0, exp:"Neither pour deux éléments ; none s'emploie à partir de trois."},
      {type:"qcm", q:"We have ____ information on this supplier.", opts:["few","a few","little","a little of"], a:2, exp:"Information est indénombrable : little (peu, sens négatif). Few exigerait un pluriel."},
      {type:"qcm", q:"____ the members agreed, which surprised everyone.", opts:["Most of","Most","The most of","Almost"], a:0, exp:"Devant un groupe déterminé (the members), on emploie most of."},
      {type:"qcm", q:"There isn't ____ time left.", opts:["much","many","a lot","plenty"], a:0, exp:"Much s'emploie surtout en phrase négative ou interrogative avec un indénombrable."},
      {type:"qcm", q:"He gave me ____ advice, which proved useful.", opts:["a few","some","an","several"], a:1, exp:"Advice est indénombrable : some advice, a piece of advice, jamais an advice."},
      {type:"qcm", q:"____ employee must sign the charter individually.", opts:["Every","All","Both","Most"], a:0, exp:"Every + singulier insiste sur la totalité prise un par un ; all demanderait employees."},
      {type:"qcm", q:"She speaks ____ French and German fluently.", opts:["both","either","neither","all"], a:0, exp:"Both… and pour deux éléments joints affirmativement."},
      {type:"qcm", q:"I have ____ patience with this kind of excuse.", opts:["little","few","a little","a few"], a:0, exp:"Little sans article a une valeur négative : très peu de patience."},
      {type:"qcm", q:"____ of us knew what to expect, so we all improvised.", opts:["None","Neither","No one","Any"], a:0, exp:"None of + groupe pluriel ; no one ne se construit pas avec of us."},
      {type:"qcm", q:"He made ____ progress in only six months.", opts:["a remarkable","remarkable","remarkables","many"], a:1, exp:"Progress est indénombrable : remarkable progress, sans article indéfini."}
    ]},
    { id:"pluriels", nom:"Noms : dénombrables, indénombrables, pluriels irréguliers", consigne:"Choisissez ou écrivez la forme correcte.", exercices:[
      {type:"input", q:"Pluriel de crisis ?", a:["crises"], ph:"un mot", exp:"Pluriel grec en -es : crisis → crises, comme analysis → analyses."},
      {type:"input", q:"Pluriel de criterion ?", a:["criteria"], ph:"un mot", exp:"Criterion → criteria, comme phenomenon → phenomena. Criteria is est une faute courante."},
      {type:"qcm", q:"The news ____ better than expected.", opts:["are","were","is","have"], a:2, exp:"News est indénombrable singulier malgré le -s : the news is."},
      {type:"qcm", q:"He gave us three useful ____ of advice.", opts:["pieces","parts","items","bits of"], a:0, exp:"A piece of advice est le quantifieur consacré pour un indénombrable abstrait."},
      {type:"input", q:"Pluriel de means (moyen) ?", a:["means"], ph:"un mot", exp:"Means est invariable : a means of transport / several means of transport."},
      {type:"qcm", q:"The staff ____ divided over the proposal.", opts:["is","are","was being","has"], a:1, exp:"Nom collectif : en anglais britannique, l'accord pluriel souligne les individus."},
      {type:"input", q:"Pluriel de datum, courant dans les rapports ?", a:["data"], ph:"un mot", exp:"Data est techniquement un pluriel mais s'emploie de plus en plus comme indénombrable : the data is clear."},
      {type:"qcm", q:"We need new ____ for the office.", opts:["furnitures","a furniture","furniture","furniture pieces"], a:2, exp:"Furniture est indénombrable ; pour compter, on dit a piece of furniture."},
      {type:"input", q:"Pluriel de aircraft ?", a:["aircraft"], ph:"un mot", exp:"Invariable, comme series, species et sheep."},
      {type:"qcm", q:"Her ____ have improved a great deal this year.", opts:["work","works","working","workings"], a:0, exp:"Work est indénombrable au sens de travail ; works désigne des œuvres ou une usine."}
    ]},
    { id:"adj", nom:"Adjectifs, adverbes et intensifieurs", consigne:"Choisissez la forme ou l'intensifieur qui convient.", exercices:[
      {type:"qcm", q:"The proposal is ____ impossible to fund.", opts:["absolutely","very","quite a","too much"], a:0, exp:"Impossible est un adjectif non gradable : on l'intensifie par absolutely, jamais par very."},
      {type:"qcm", q:"It was a ____ interesting talk.", opts:["highly","absolutely","totally","utterly"], a:0, exp:"Highly interesting : collocation naturelle. Absolutely s'associe aux adjectifs extrêmes."},
      {type:"qcm", q:"The results are ____ better than last year's.", opts:["far","very","much more","so"], a:0, exp:"Far / much / a lot devant un comparatif ; very y est impossible."},
      {type:"qcm", q:"He speaks English ____.", opts:["fluently","fluent","fluentely","with fluent"], a:0, exp:"L'adverbe modifie le verbe speak ; fluent qualifierait la personne : he is fluent in English."},
      {type:"qcm", q:"She works ____ than anyone else in the team.", opts:["harder","hardlier","more hard","more hardly"], a:0, exp:"Hard est adverbe tel quel ; hardly signifie à peine, sens totalement différent."},
      {type:"qcm", q:"The room was ____ empty when I arrived.", opts:["virtually","strongly","deeply","highly"], a:0, exp:"Virtually / almost pour une quasi-totalité ; deeply s'emploie avec des émotions."},
      {type:"qcm", q:"It's a ____ old building.", opts:["beautiful stone","stone beautiful","old beautiful","beautifully stone"], a:0, exp:"Ordre des adjectifs : opinion (beautiful), âge (old), matière (stone)."},
      {type:"qcm", q:"I'm ____ tired to argue about it tonight.", opts:["too","very","enough","so much"], a:0, exp:"Too + adjectif + to + base verbale exprime l'excès qui empêche l'action."},
      {type:"qcm", q:"The plan is not ____ detailed for the board.", opts:["enough","sufficiently","detailed enough","too"], a:2, exp:"Enough se place après l'adjectif : detailed enough. Sufficiently detailed serait aussi correct mais avant."},
      {type:"qcm", q:"That was a ____ disappointing performance.", opts:["bitterly","hardly","widely","greatly"], a:0, exp:"Bitterly disappointing est une collocation figée, comme bitterly cold."}
    ]},
    { id:"pronoms", nom:"Pronoms et relatives complexes", consigne:"Complétez avec le pronom relatif ou personnel qui convient.", exercices:[
      {type:"qcm", q:"The supplier ____ we signed with has gone bankrupt.", opts:["whom","who","which","what"], a:0, exp:"Relative complément d'objet renvoyant à une personne : whom en registre formel, that ou zéro à l'oral."},
      {type:"qcm", q:"He missed the deadline, ____ annoyed the whole team.", opts:["which","that","what","who"], a:0, exp:"Which reprend toute la proposition précédente ; that est impossible dans une relative appositive."},
      {type:"qcm", q:"____ we need is a clear timetable.", opts:["What","Which","That","It"], a:0, exp:"Phrase clivée en what : ce dont nous avons besoin, c'est… Mise en relief typique de l'écrit B2."},
      {type:"qcm", q:"This is the report the conclusions of ____ were challenged.", opts:["which","whose","that","whom"], a:0, exp:"The conclusions of which, ou whose conclusions : structure formelle du génitif relatif."},
      {type:"qcm", q:"The candidate ____ CV impressed us has withdrawn.", opts:["whose","who's","which","of whom"], a:0, exp:"Whose = dont le. Ne pas confondre avec who's (= who is)."},
      {type:"qcm", q:"Everyone did ____ best under the circumstances.", opts:["their","his or her own","theirs","its"], a:0, exp:"Their singulier après everyone : usage désormais standard et neutre."},
      {type:"qcm", q:"There were three offers, none of ____ was acceptable.", opts:["which","them","that","those"], a:0, exp:"Quantifieur + of which dans une relative ; none of them exigerait une phrase séparée."},
      {type:"qcm", q:"It was Owen ____ raised the objection, not Priya.", opts:["who","which","whom","what"], a:0, exp:"Clivée en it is… who : mise en relief du sujet, très fréquente pour corriger."},
      {type:"qcm", q:"They only have ____ to blame.", opts:["themselves","them","their selves","each other"], a:0, exp:"Réfléchi car sujet et complément coïncident ; each other supposerait une réciprocité."},
      {type:"qcm", q:"The two directors congratulated ____ after the deal.", opts:["each other","themselves","them","one another's"], a:0, exp:"Each other = réciprocité entre deux ; themselves signifierait qu'ils se félicitaient eux-mêmes."}
    ]},
    { id:"negation", nom:"Négation et restriction", consigne:"Choisissez la forme négative ou restrictive correcte.", exercices:[
      {type:"qcm", q:"____ had I sent the email than the client called.", opts:["No sooner","Hardly","Scarcely when","Not only"], a:0, exp:"No sooner… than avec inversion ; hardly se construirait avec when."},
      {type:"qcm", q:"He didn't say anything, and ____.", opts:["neither did she","either did she","she didn't neither","nor she did"], a:0, exp:"Neither + auxiliaire + sujet : inversion obligatoire dans cette reprise."},
      {type:"qcm", q:"____ do we accept cash payments.", opts:["Under no circumstances","In no circumstance we","Not in any case we","No circumstances"], a:0, exp:"Un groupe négatif en tête entraîne l'inversion : under no circumstances do we…"},
      {type:"qcm", q:"There is ____ evidence to support that claim.", opts:["hardly any","hardly no","almost no any","not any hardly"], a:0, exp:"Hardly est déjà négatif : on le complète par any, jamais par no."},
      {type:"qcm", q:"I ____ ever work at weekends.", opts:["hardly","hard","not hardly","almost not"], a:0, exp:"Hardly ever = presque jamais, entre never et sometimes."},
      {type:"qcm", q:"She failed the test, and so ____.", opts:["did I","I did","did me","have I"], a:0, exp:"So + auxiliaire + sujet pour reprendre une affirmation ; l'auxiliaire reprend le prétérit."},
      {type:"qcm", q:"____ until the report was published did we understand the scale.", opts:["Not","No","Nothing","Never"], a:0, exp:"Not until… + inversion : mise en relief du moment tardif de la prise de conscience."},
      {type:"qcm", q:"He doesn't like the plan, ____ do his colleagues.", opts:["nor","neither of","either","not"], a:0, exp:"Nor introduit une seconde négation coordonnée, avec inversion."},
      {type:"qcm", q:"There's ____ point in complaining now.", opts:["no","not","not any of","none"], a:0, exp:"No + nom ; not any serait possible mais lourd, et none est un pronom."},
      {type:"qcm", q:"Little ____ that the contract was already signed.", opts:["did he know","he knew","he did know","knew he"], a:0, exp:"Little en tête, valeur négative, donc inversion : formule narrative classique."}
    ]},
    { id:"ordremots", nom:"Ordre des mots et inversion", consigne:"Choisissez la phrase dont l'ordre des mots est correct.", exercices:[
      {type:"qcm", q:"Ordre correct ?", opts:["She often works late on Fridays","She works often late on Fridays","Often she works late on Fridays too much","She works late often on Fridays always"], a:0, exp:"L'adverbe de fréquence se place avant le verbe lexical et après be."},
      {type:"qcm", q:"Ordre correct ?", opts:["Not only did they refuse, they also complained","Not only they refused, they also complained","They not only refused, also they complained","Not only refused they, also complained"], a:0, exp:"Not only en tête impose l'inversion avec l'auxiliaire did."},
      {type:"qcm", q:"Ordre correct ?", opts:["I gave the manager the figures yesterday","I gave yesterday the manager the figures","I gave the figures the manager yesterday","Yesterday gave I the figures"], a:0, exp:"Double objet : bénéficiaire puis chose, ou the figures to the manager. Pas d'adverbe entre verbe et COD."},
      {type:"qcm", q:"Ordre correct ?", opts:["Rarely have I seen such a poor report","Rarely I have seen such a poor report","I have rarely seen such poor a report","Rarely seen I have such a report poor"], a:0, exp:"Adverbe négatif en tête → inversion ; noter aussi such a + adjectif + nom."},
      {type:"qcm", q:"Ordre correct ?", opts:["He speaks English very well","He speaks very well English","He very well speaks English","He speaks English well very"], a:0, exp:"L'anglais n'insère pas d'adverbe entre le verbe et son complément d'objet direct."},
      {type:"qcm", q:"Ordre correct ?", opts:["On the table stood a stack of contracts","On the table a stack of contracts stood there","Stood on the table a stack of contracts","A stack of contracts on the table stood"], a:0, exp:"Inversion locative après un complément de lieu antéposé, style descriptif."},
      {type:"qcm", q:"Ordre correct ?", opts:["We have already discussed this issue at length","We have discussed already this issue at length","Already we have this issue discussed","We already have discussed at length this issue"], a:0, exp:"Already se place entre l'auxiliaire et le participe."},
      {type:"qcm", q:"Ordre correct ?", opts:["So convincing was her argument that nobody objected","So convincing her argument was that nobody objected","Her argument was so convincing that nobody didn't object","Was so convincing her argument nobody objected"], a:0, exp:"So + adjectif en tête → inversion, structure emphatique soutenue."},
      {type:"qcm", q:"Ordre correct ?", opts:["Only after the meeting did I realise my mistake","Only after the meeting I realised my mistake","Only after the meeting realised I my mistake","I only after the meeting did realise"], a:0, exp:"Only + complément en tête déclenche l'inversion de l'auxiliaire."},
      {type:"qcm", q:"Ordre correct ?", opts:["They sent me an email last week from the head office","They sent last week me an email from the head office","Last week they sent from the head office me an email","They sent me last week from head office an email"], a:0, exp:"Ordre habituel : verbe, objets, manière, lieu, temps — ici le temps peut aussi se déplacer en tête."}
    ]},
    { id:"transfo", nom:"Transformation et reformulation", consigne:"Réécrivez la phrase en respectant l'amorce imposée.", exercices:[
      {type:"input", q:"Somebody is repairing my laptop. → I ____ (have + causatif).", a:["am having my laptop repaired","am having my laptop repaired."], ph:"I am having…", exp:"Have something done : le complément précède le participe passé."},
      {type:"input", q:"People believe he resigned. → He is believed ____.", a:["to have resigned"], ph:"to…", exp:"Passif de rapport avec infinitif parfait car la démission précède la croyance."},
      {type:"input", q:"I regret not applying earlier. → I wish I ____.", a:["had applied earlier","had applied"], ph:"had…", exp:"Wish + past perfect pour un regret portant sur une occasion manquée."},
      {type:"input", q:"She arrived and immediately the alarm went off. → No sooner ____ than the alarm went off.", a:["had she arrived"], ph:"had she…", exp:"No sooner + past perfect inversé, corrélé par than."},
      {type:"input", q:"It's a pity you can't come. → I wish you ____ come.", a:["could"], ph:"un modal", exp:"Wish + prétérit modal pour un regret sur le présent ; couldn't inverserait le sens."},
      {type:"input", q:"They didn't invite him, so he was upset. → Had they ____, he wouldn't have been upset.", a:["invited him"], ph:"invited…", exp:"Conditionnel 3 inversé sans if, registre écrit soutenu."},
      {type:"input", q:"The team needs a leader, that's the real issue. → What the team ____ is a leader.", a:["needs"], ph:"un verbe", exp:"Clivée en what : le verbe s'accorde avec team, sujet singulier."},
      {type:"input", q:"It was Priya who suggested the trial, not Owen. → The person ____ suggested the trial was Priya.", a:["who","that"], ph:"un pronom", exp:"Relative déterminative sur une personne : who ou that, sans virgule."},
      {type:"input", q:"Although he was tired, he finished the report. → ____ tired, he finished the report.", a:["tired as he was","despite being"], ph:"…", exp:"Tired as he was : concession inversée littéraire, équivalente à although he was tired."},
      {type:"input", q:"You shouldn't have signed without reading it. → It was a mistake ____ it without reading.", a:["to sign"], ph:"to…", exp:"Should have + participe = reproche sur le passé, reformulé par it was a mistake to + infinitif."}
    ]},
    { id:"tradfr", nom:"Traduction FR → EN", consigne:"Traduisez la phrase française en anglais.", exercices:[
      {type:"input", q:"J'aurais dû te prévenir plus tôt.", a:["i should have warned you earlier","i should have told you earlier","i should have warned you sooner"], ph:"en anglais", exp:"Should have + participe pour le regret ; earlier est le comparatif attendu de early."},
      {type:"input", q:"Cela fait trois ans qu'elle travaille ici.", a:["she has been working here for three years","she has worked here for three years"], ph:"en anglais", exp:"Le français cela fait… que se rend par un present perfect, jamais un présent simple."},
      {type:"input", q:"Si j'avais su, je ne serais pas venu.", a:["if i had known i wouldn't have come","if i had known, i wouldn't have come","had i known i wouldn't have come"], ph:"en anglais", exp:"Conditionnel 3 complet ; l'inversion had I known est une variante formelle."},
      {type:"input", q:"Je me fais couper les cheveux demain.", a:["i'm having my hair cut tomorrow","i am having my hair cut tomorrow"], ph:"en anglais", exp:"Causatif have something done ; hair est indénombrable ici, donc pas de -s."},
      {type:"input", q:"On dit qu'il va démissionner.", a:["he is said to be going to resign","it is said that he is going to resign","he is said to be resigning"], ph:"en anglais", exp:"Passif de rapport : deux constructions possibles, it is said that… ou he is said to…"},
      {type:"input", q:"Non seulement il est arrivé en retard, mais il n'avait rien préparé.", a:["not only did he arrive late, but he hadn't prepared anything","not only did he arrive late but he had prepared nothing"], ph:"en anglais", exp:"Inversion après not only ; nothing ou not… anything, jamais les deux ensemble."},
      {type:"input", q:"Ce dont nous avons besoin, c'est de temps.", a:["what we need is time","what we need is more time"], ph:"en anglais", exp:"Clivée en what ; time est indénombrable, donc sans article."},
      {type:"input", q:"Il vaudrait mieux que tu ne dises rien.", a:["you'd better not say anything","you had better not say anything","you'd better say nothing"], ph:"en anglais", exp:"Had better + base verbale ; la négation se place avant le verbe : better not say."},
      {type:"input", q:"Cela ne sert à rien de discuter.", a:["there is no point in arguing","there's no point in arguing","there's no point arguing"], ph:"en anglais", exp:"No point in + gérondif ; discuter au sens de se disputer se dit argue."},
      {type:"input", q:"À peine avait-il raccroché que le téléphone sonna de nouveau.", a:["hardly had he hung up when the phone rang again","no sooner had he hung up than the phone rang again"], ph:"en anglais", exp:"Hardly… when ou no sooner… than : le corrélatif change selon l'adverbe choisi."}
    ]},
    { id:"traden", nom:"Traduction EN → FR", consigne:"Traduisez la phrase anglaise en français.", exercices:[
      {type:"input", q:"He must have forgotten the meeting.", a:["il a du oublier la reunion","il a du oublier le rendez-vous"], ph:"en français", exp:"Must have + participe = déduction quasi certaine sur le passé, rendue par devoir au passé composé."},
      {type:"input", q:"They are having the offices renovated.", a:["ils font renover les bureaux","ils sont en train de faire renover les bureaux"], ph:"en français", exp:"Le causatif have something done se traduit par faire + infinitif."},
      {type:"input", q:"I wish I had accepted their offer.", a:["j'aurais aime accepter leur offre","je regrette de ne pas avoir accepte leur offre"], ph:"en français", exp:"Wish + past perfect exprime le regret ; le français préfère regretter de ne pas avoir…"},
      {type:"input", q:"Hardly anyone showed up.", a:["presque personne n'est venu","il n'est presque venu personne"], ph:"en français", exp:"Hardly anyone = presque personne ; show up est familier pour se présenter."},
      {type:"input", q:"It is generally agreed that the reform failed.", a:["on s'accorde generalement a dire que la reforme a echoue","il est generalement admis que la reforme a echoue"], ph:"en français", exp:"Le passif impersonnel anglais se rend le plus souvent par on en français."},
      {type:"input", q:"She should have been informed earlier.", a:["elle aurait du etre informee plus tot","on aurait du la prevenir plus tot"], ph:"en français", exp:"Modal passé + passif : should have been + participe = aurait dû être."},
      {type:"input", q:"But for his intervention, the deal would have collapsed.", a:["sans son intervention l'accord aurait echoue","sans son intervention le contrat aurait echoue"], ph:"en français", exp:"But for = sans, n'eût été ; collapse se traduit par échouer ou s'effondrer selon le contexte."},
      {type:"input", q:"We are running out of time.", a:["nous manquons de temps","le temps nous manque","nous n'avons bientot plus de temps"], ph:"en français", exp:"Run out of insiste sur l'épuisement progressif d'une ressource."},
      {type:"input", q:"He is not as reliable as he seems.", a:["il n'est pas aussi fiable qu'il en a l'air","il n'est pas aussi fiable qu'il le parait"], ph:"en français", exp:"Not as… as pour l'inégalité ; reliable = fiable, à distinguer de reliant qui n'existe pas."},
      {type:"input", q:"Little did they know that the contract had already been signed.", a:["ils etaient loin de se douter que le contrat avait deja ete signe","ils ignoraient que le contrat avait deja ete signe"], ph:"en français", exp:"Little did they know : formule figée rendue par ils étaient loin de se douter."}
    ]},
    { id:"dictee", nom:"Dictée à trous", consigne:"Complétez les extraits des dialogues avec le mot manquant.", exercices:[
      {type:"input", q:"Had I ____, I would have stopped learning.", a:["stayed"], ph:"un mot", exp:"Conditionnel 3 inversé : had + participe passé, sans if."},
      {type:"input", q:"I should have pushed ____ on the deadline.", a:["back"], ph:"un mot", exp:"Push back on = contester ; la particule back est indispensable au sens."},
      {type:"input", q:"I'd have the priorities ____ with the client.", a:["reviewed"], ph:"un mot", exp:"Causatif : have + complément + participe passé."},
      {type:"input", q:"Not only ____ you plan, you also negotiate.", a:["do"], ph:"un mot", exp:"Not only en tête impose l'auxiliaire do avant le sujet."},
      {type:"input", q:"____ anyone disputes the problem.", a:["hardly"], ph:"un mot", exp:"Hardly anyone = presque personne : quasi-négation sans not."},
      {type:"input", q:"Which is ____ why I'm proposing a trial.", a:["precisely","exactly"], ph:"un mot", exp:"Precisely why renforce la justification et anticipe l'objection."},
      {type:"input", q:"What we're really ____ today is whether the problem is worth solving.", a:["deciding"], ph:"un mot", exp:"Clivée en what avec forme progressive : recentrage du débat."},
      {type:"input", q:"Fine by me, ____ the trial doesn't turn into a rollout.", a:["provided","providing"], ph:"un mot", exp:"Provided (that) = à condition que, plus formel que if."},
      {type:"input", q:"It is generally ____ in our trade that penalties come at a cost.", a:["understood","accepted"], ph:"un mot", exp:"Passif impersonnel it is generally understood that… : registre professionnel prudent."},
      {type:"input", q:"I'll have the contract ____ up this afternoon.", a:["drawn"], ph:"un mot", exp:"Draw up a contract = rédiger un contrat ; participe passé drawn dans le causatif."}
    ]},
    { id:"prononciation", nom:"Prononciation, accent de mot et de phrase", consigne:"Répondez aux questions de prononciation et d'accentuation.", exercices:[
      {type:"qcm", q:"Où se place l'accent tonique dans NEGOTIATE ?", opts:["ne-GO-ti-ate","NE-go-ti-ate","ne-go-TI-ate","ne-go-ti-ATE"], a:0, exp:"Accent sur la deuxième syllabe ; il se maintient dans negotiable mais se déplace dans negotiAtion."},
      {type:"qcm", q:"Quel mot a un son différent des autres ?", opts:["though","tough","dough","although"], a:1, exp:"Tough se prononce /tʌf/ ; les trois autres riment en /əʊ/."},
      {type:"qcm", q:"Dans RECORD comme nom, l'accent tombe sur…", opts:["la 1re syllabe","la 2e syllabe","les deux","aucune"], a:0, exp:"Règle nom/verbe : RE-cord (nom) mais re-CORD (verbe), comme PREsent / preSENT."},
      {type:"qcm", q:"Comment se prononce le -ed de ASKED ?", opts:["/t/","/d/","/ɪd/","muet"], a:0, exp:"Après une consonne sourde /k/, le -ed se réalise /t/."},
      {type:"qcm", q:"Comment se prononce le -ed de DECIDED ?", opts:["/ɪd/","/t/","/d/","muet"], a:0, exp:"Après /d/ ou /t/, on insère une syllabe /ɪd/ pour rester audible."},
      {type:"qcm", q:"Quel mot contient un h muet ?", opts:["hour","house","hotel","heavy"], a:0, exp:"Hour se prononce /aʊə/, d'où an hour. Hotel garde le h en anglais moderne."},
      {type:"qcm", q:"Où se place l'accent dans EMPLOYEE ?", opts:["em-ploy-EE","EM-ploy-ee","em-PLOY-ee","aucune syllabe"], a:0, exp:"Le suffixe -ee attire l'accent : employEE, traineE, contrairement à emPLOYer."},
      {type:"qcm", q:"Dans la phrase I didn't say HE was late, l'accent sur HE signifie…", opts:["c'est quelqu'un d'autre qui était en retard","il n'était pas en retard","je n'ai rien dit","il est arrivé tôt"], a:0, exp:"L'accent contrastif porte la négation sur l'élément accentué : ce n'est pas lui qui est visé."},
      {type:"qcm", q:"Quelle paire est un couple minimal problématique pour un francophone ?", opts:["ship / sheep","ship / shop","sheep / sleep","ship / chip"], a:0, exp:"Opposition /ɪ/ bref et /iː/ long : le français n'a pas cette distinction de longueur."},
      {type:"qcm", q:"Comment se prononce le s de INCREASE employé comme verbe ?", opts:["/s/ avec accent final","/z/ avec accent initial","/ʃ/","muet"], a:0, exp:"Verbe : in-CREASE avec /s/ final ; le nom garde le même /s/ mais l'accent passe à l'initiale."}
    ]}
  ]
};
