<script>
var DAY = {
  num: 29,
  title: "Projet final (3) : l'entretien d'embauche complet",
  subtitle: "Un dialogue modèle, la méthode STAR et la banque de questions.",
  theory: `
<h3>1. Réussir un entretien en anglais</h3>
<p>L'entretien d'embauche (<em>a job interview</em>) suit presque toujours le même déroulé : accueil, présentation de soi, questions sur le parcours et les qualités, questions du candidat, clôture. Le secret n'est pas d'avoir un anglais parfait, mais de <strong>structurer</strong> ses réponses. C'est le troisième projet final : un modèle complet à réutiliser.</p>
<h3>2. Un dialogue modèle</h3>
<p><em>Recruiter: Thanks for coming in. Could you tell me a little about yourself?</em><br>
<em>Candidate: Of course. I'm a marketing assistant with four years' experience, mostly in social media. I started out at a small agency and gradually moved into managing campaigns for larger clients. I'm applying for this role because I'd like to take on more responsibility in a company I admire.</em></p>
<p><em>Recruiter: What would you say is your greatest strength?</em><br>
<em>Candidate: I'd say it's staying calm under pressure. In my current job, I often handle several deadlines at once, and I've learned to prioritise without losing quality.</em></p>
<p><em>Recruiter: And a weakness?</em><br>
<em>Candidate: I used to find it hard to delegate, because I wanted everything to be perfect. I've been working on it by trusting my team more, and it has made me a better manager.</em></p>
<p><em>Recruiter: Can you give me an example of a difficult situation you handled?</em><br>
<em>Candidate: Certainly. (See the STAR method below.)</em></p>
<p><em>Recruiter: Do you have any questions for us?</em><br>
<em>Candidate: Yes. Could you tell me what a typical week in this role looks like? And how do you measure success in the first six months?</em></p>
<h3>3. La méthode STAR (pour les questions à exemple)</h3>
<p>Quand on vous demande un <strong>exemple concret</strong> (« Tell me about a time when… »), structurez votre réponse en quatre temps :</p>
<pre class="pseudo">S - Situation   Plantez le décor.       "Last year, our biggest client threatened to leave."
T - Task        Votre mission.          "My task was to win back their trust within a month."
A - Action      Ce que vous avez fait.  "I set up weekly calls and redesigned their campaign."
R - Result      Le résultat chiffré.    "As a result, they renewed for two more years."</pre>
<div class="tip">Le R (Result) est le plus important : terminez toujours sur un résultat concret, si possible chiffré. C'est ce dont le recruteur se souviendra.</div>
<h3>4. Banque de questions fréquentes</h3>
<pre class="pseudo">Tell me about yourself.              Parlez-moi de vous.
Why do you want this job?            Pourquoi ce poste ?
Why should we hire you?              Pourquoi vous et pas un autre ?
Where do you see yourself in 5 years? Où vous voyez-vous dans 5 ans ?
Tell me about a time you failed.     Une fois où vous avez échoué ?
How do you handle stress/conflict?   Comment gérez-vous le stress/conflit ?
What are your salary expectations?   Quelles sont vos prétentions salariales ?</pre>
<h3>5. Expressions utiles</h3>
<pre class="pseudo">I'd say that...              Je dirais que...
In my current role, I...     Dans mon poste actuel, je...
I'm particularly proud of... Je suis particulièrement fier de...
That's a good question.      C'est une bonne question. (pour gagner du temps)
What attracts me to this role is... Ce qui m'attire dans ce poste, c'est...
I'd welcome the chance to... Je serais ravi d'avoir la chance de...</pre>
<div class="warn">Évitez les réponses en un mot (« Yes », « No ») et les mensonges. Pour la faiblesse, choisissez un défaut réel mais sur lequel vous <strong>progressez</strong> : montrez la prise de conscience et l'effort.</div>`,
  exercises: [
    { type: "qcm", q: "À « Tell me about yourself », il faut :", opts: ["raconter toute sa vie privée", "donner un résumé structuré de son parcours et de sa motivation", "répondre « I'm fine »", "parler du salaire"], a: 1, exp: "Un résumé bref, professionnel et orienté vers le poste visé." },
    { type: "qcm", q: "Dans la méthode STAR, que signifie le R ?", opts: ["Reason", "Result (le résultat, idéalement chiffré)", "Report", "Request"], a: 1, exp: "R = Result : la conclusion concrète de votre exemple." },
    { type: "input", q: "STAR : la lettre qui désigne « la situation, le décor » est ___.", a: ["S"], ph: "une lettre", exp: "S = Situation : on plante le décor." },
    { type: "qcm", q: "Comment bien présenter une faiblesse ?", opts: ["Dire qu'on n'en a aucune", "Choisir un défaut réel sur lequel on progresse", "Inventer un mensonge", "Citer un défaut rédhibitoire"], a: 1, exp: "Un vrai défaut + la preuve qu'on travaille dessus : la prise de conscience compte." },
    { type: "qcm", q: "« That's a good question » sert surtout à :", opts: ["flatter", "gagner quelques secondes pour structurer sa réponse", "changer de sujet", "refuser de répondre"], a: 1, exp: "Formule de transition qui laisse le temps de penser." },
    { type: "vf", q: "Il vaut mieux répondre « Yes » ou « No » sans développer.", a: false, exp: "On développe toujours : un entretien valorise les réponses construites." },
    { type: "input", q: "Complète : « In my current ___, I manage three people. » (poste)", a: ["role", "job", "position"], ph: "un mot", exp: "In my current role/job = dans mon poste actuel." },
    { type: "qcm", q: "Quelle est la meilleure réponse à « Why should we hire you? »", opts: ["Because I need money", "Because my experience in X matches exactly what you need", "I don't know", "Because I applied"], a: 1, exp: "On relie ses atouts aux besoins précis du poste." },
    { type: "qcm", q: "Le T de STAR correspond à :", opts: ["Time", "Task (votre mission / objectif)", "Team", "Talk"], a: 1, exp: "T = Task : ce que vous deviez accomplir." },
    { type: "qcm", q: "En fin d'entretien, poser des questions au recruteur :", opts: ["est mal vu", "montre votre intérêt et votre préparation", "fait perdre du temps", "est interdit"], a: 1, exp: "De bonnes questions signalent motivation et sérieux." },
    { type: "input", q: "Traduis « Ce qui m'attire dans ce poste, c'est… » : « What ___ me to this role is… »", a: ["attracts"], ph: "un verbe", exp: "What attracts me to this role is… : formule d'ouverture efficace." },
    { type: "qcm", q: "« Where do you see yourself in five years? » teste :", opts: ["votre âge", "votre ambition et si vous comptez rester", "votre adresse", "vos loisirs"], a: 1, exp: "On évalue votre projection et votre engagement à long terme." },
    { type: "vf", q: "Terminer un exemple STAR par un résultat concret marque davantage le recruteur.", a: true, exp: "Le Result, si possible chiffré, est l'élément le plus mémorable." },
    { type: "qcm", q: "Réponse la plus solide à « Tell me about a time you failed » :", opts: ["I never fail", "Une situation réelle + ce que j'en ai appris et changé", "Un échec dramatique sans suite", "Refuser de répondre"], a: 1, exp: "On assume un échec réel ET on montre la leçon tirée." },
    { type: "qcm", q: "Bon exemple d'expression pour valoriser une réussite :", opts: ["I'm particularly proud of…", "I guess it was okay", "Nothing special", "It doesn't matter"], a: 0, exp: "« I'm particularly proud of… » met en avant une réussite avec assurance." }
  ],
  final: {
    title: "Exercice final — Analyser une réponse STAR",
    intro: `<p>Lisez cette réponse d'un candidat à la question « Tell me about a time you solved a problem », puis identifiez les quatre étapes STAR.</p>
<p><em>Last summer, our online shop crashed on the busiest sales day of the year (Situation). As the only technical person on site, I had to get it back online as fast as possible (Task). I quickly identified an overloaded server, moved the site to a backup, and kept customers informed on social media (Action). Within forty minutes, the shop was working again, and we actually beat our sales record for that day (Result).</em></p>`,
    questions: [
      { type: "qcm", q: "Quelle phrase correspond à la SITUATION ?", opts: ["I had to get it back online", "Our online shop crashed on the busiest sales day", "I moved the site to a backup", "We beat our sales record"], a: 1, exp: "La Situation plante le décor : la boutique tombe en panne le jour le plus chargé." },
      { type: "qcm", q: "Quelle phrase exprime la TASK (mission) ?", opts: ["I had to get it back online as fast as possible", "The shop crashed", "I informed customers", "Within forty minutes"], a: 0, exp: "La Task, c'est l'objectif à atteindre : remettre le site en ligne au plus vite." },
      { type: "qcm", q: "Quelles ACTIONS le candidat a-t-il menées ?", opts: ["Il n'a rien fait", "Identifier le serveur surchargé, basculer sur une sauvegarde, informer les clients", "Il a fermé la boutique", "Il a appelé un ami"], a: 1, exp: "Les Actions sont les gestes concrets et personnels (I identified, I moved, I kept…)." },
      { type: "qcm", q: "Quel est le RESULT, et pourquoi est-il fort ?", opts: ["Le site est resté en panne", "Site rétabli en 40 min ET record de ventes battu : un résultat concret et chiffré", "Rien n'a changé", "Le candidat a démissionné"], a: 1, exp: "Result chiffré : 40 minutes et un record battu, l'élément le plus mémorable." },
      { type: "vf", q: "Cette réponse est efficace parce qu'elle suit les quatre étapes et se termine sur un résultat mesurable.", a: true, exp: "Structure claire + résultat chiffré = réponse d'entretien réussie." }
    ],
    solution: `<p>Cette réponse est un modèle STAR. <strong>Situation</strong> : la boutique tombe en panne le jour le plus important de l'année. <strong>Task</strong> : remettre le site en ligne au plus vite, seul technicien présent. <strong>Action</strong> : trois gestes concrets et personnels (identifier le serveur, basculer sur une sauvegarde, informer les clients). <strong>Result</strong> : site rétabli en quarante minutes et record de ventes battu. La force de la réponse tient à trois choses : elle est <strong>structurée</strong> (le recruteur suit sans effort), elle emploie « I » pour montrer la <strong>contribution personnelle</strong>, et elle finit sur un <strong>résultat chiffré</strong>. Préparez à l'avance deux ou trois histoires STAR (une réussite, un conflit, un échec) : vous pourrez les adapter à presque toutes les questions d'entretien.</p>`
  }
};
</script>

ires et la classe fut bien plus calme le reste de l'année (Result). » Remarquez la structure et le résultat concret final.",
