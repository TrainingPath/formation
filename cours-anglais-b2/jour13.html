<script>
var DAY = {
  num: 13,
  title: "Rédiger un texte argumentatif",
  subtitle: "Structurer un essai : introduction, développement équilibré, conclusion.",
  theory: `
<h3>1. Qu'attend-on d'un essai argumentatif ?</h3>
<p>Un <strong>essai argumentatif</strong> (argumentative essay) défend une position sur une question, de façon organisée et convaincante. Au niveau B2, on évalue autant vos idées que votre <strong>structure</strong>, la richesse de votre langue et la clarté de votre raisonnement. Un bon essai suit un plan net : introduction, corps développé, conclusion.</p>
<h3>2. La structure globale</h3>
<pre class="pseudo">1. INTRODUCTION   -> presenter le sujet + annoncer sa these (thesis statement)
2. BODY PARAGRAPH 1 -> premier argument + preuve + explication
3. BODY PARAGRAPH 2 -> deuxieme argument + preuve + explication
4. COUNTER-ARGUMENT -> objection adverse + refutation
5. CONCLUSION     -> reformuler la these + ouverture finale</pre>
<div class="tip">Il existe deux grands modèles : l'essai « for and against » (on présente les deux camps puis on conclut) et l'essai « opinion » (on défend une thèse d'un bout à l'autre). Les deux exigent d'anticiper les objections.</div>
<h3>3. L'introduction</h3>
<p>Elle fait trois choses : accrocher (hook), situer le sujet, et annoncer clairement la <strong>thèse</strong>. La thèse est la phrase-clé qui dit ce que vous allez défendre.</p>
<pre class="pseudo">Hook : Every year, millions of tonnes of plastic end up in the ocean.
Contexte : The debate over banning single-use plastics is intensifying.
These : This essay will argue that a complete ban is both necessary and achievable.
-> Cet essai defendra qu'une interdiction totale est necessaire et realisable.</pre>
<div class="warn">Une bonne thèse est précise et prend position. « Plastic is bad » est trop vague. « Governments should ban single-use plastics because… » annonce une position claire et défendable.</div>
<h3>4. Les paragraphes de développement (méthode PEEL)</h3>
<p>Chaque paragraphe défend UN argument, selon le schéma <strong>PEEL</strong> vu au jour 9 : Point, Evidence, Explanation, Link.</p>
<pre class="pseudo">Topic sentence (Point) : Firstly, banning plastics would protect marine life.
Evidence : Studies show that over a million seabirds die each year from plastic.
Explanation : This is because animals mistake plastic fragments for food.
Link : Therefore, reducing plastic waste directly saves ecosystems.</pre>
<div class="tip">Commence chaque paragraphe par une <em>topic sentence</em> qui annonce l'idée, et utilise des connecteurs pour l'enchaînement : Firstly, Secondly, Furthermore, In addition.</div>
<h3>5. Le contre-argument : la marque d'un bon essai</h3>
<p>Reconnaître l'avis adverse puis le réfuter renforce votre crédibilité. On concède, puis on répond.</p>
<pre class="pseudo">Concession : Admittedly, some argue that a ban would harm small businesses.
Refutation : However, affordable alternatives already exist, and subsidies could ease the transition.
-> Certes, certains soutiennent que... Cependant, des alternatives existent deja...</pre>
<div class="warn">Ne présente pas l'objection pour l'abandonner : réfute-la toujours. « Some say X. However, this ignores the fact that Y. »</div>
<h3>6. La conclusion</h3>
<p>La conclusion <strong>ne présente aucune idée nouvelle</strong>. Elle reformule la thèse autrement, résume les grands arguments, et se termine sur une ouverture (appel à l'action, prédiction, question).</p>
<pre class="pseudo">Reformulation : In conclusion, the evidence strongly supports a ban on single-use plastics.
Bilan : Not only would it protect wildlife, but it would also drive innovation.
Ouverture : The question is no longer whether we should act, but how quickly.</pre>
<h3>7. Boîte à outils du registre argumentatif</h3>
<pre class="pseudo">Introduire l'opinion : It is often argued that ... / There is a strong case for ...
Nuancer : To some extent ... / It could be said that ...
Renforcer : There is no doubt that ... / It is undeniable that ...
Conclure : All things considered ... / On balance ... / In the final analysis ...</pre>
<div class="tip">Un essai B2 réussi combine : structure claire, connecteurs variés (jour 9), registre soutenu (jour 12), et un point de vue assumé mais nuancé.</div>`,
  exercises: [
    { type: "qcm", q: "Où annonce-t-on la thèse (thesis statement) ?", opts: ["dans la conclusion", "dans l'introduction", "dans le contre-argument", "nulle part"], a: 1, exp: "La thèse est annoncée à la fin de l'introduction." },
    { type: "qcm", q: "Quelle thèse est la plus efficace ?", opts: ["Plastic is bad.", "I don't like plastic.", "Governments should ban single-use plastics because they harm ecosystems.", "There is plastic everywhere."], a: 2, exp: "Une bonne thèse prend position clairement et annonce la raison." },
    { type: "input", q: "Dans PEEL, que représente le premier E ? (un mot anglais)", a: ["evidence"], ph: "un mot", exp: "PEEL : Point, Evidence (preuve), Explanation, Link." },
    { type: "vf", q: "La conclusion doit introduire un nouvel argument important.", a: false, exp: "La conclusion ne présente aucune idée nouvelle : elle reformule et ouvre." },
    { type: "qcm", q: "À quoi sert un paragraphe de contre-argument ?", opts: ["À changer d'avis", "À reconnaître l'objection adverse puis la réfuter", "À conclure", "À répéter la thèse"], a: 1, exp: "On concède l'objection, puis on la réfute pour renforcer sa position." },
    { type: "input", q: "Complète une concession : « ___, some argue that a ban would harm businesses. » (Certes)", a: ["admittedly", "granted"], ph: "un mot", exp: "Admittedly / Granted introduisent une concession avant la réfutation." },
    { type: "qcm", q: "Par quoi commence idéalement chaque paragraphe de développement ?", opts: ["une preuve chiffrée", "une topic sentence annonçant l'idée", "une citation", "la conclusion"], a: 1, exp: "La topic sentence énonce l'idée directrice du paragraphe." },
    { type: "qcm", q: "Quel connecteur convient pour réfuter une objection ?", opts: ["Furthermore", "However / Nevertheless", "For example", "Firstly"], a: 1, exp: "However / Nevertheless marquent le renversement après la concession." },
    { type: "vf", q: "« It is undeniable that... » sert à renforcer un argument.", a: true, exp: "C'est une formule d'emphase qui appuie fortement une affirmation." },
    { type: "input", q: "Complète : « In ___, the evidence supports a ban. » (formule de conclusion)", a: ["conclusion"], ph: "un mot", exp: "In conclusion introduit la conclusion." },
    { type: "qcm", q: "Quel est le rôle du « hook » en introduction ?", opts: ["conclure", "accrocher l'attention du lecteur", "citer des sources", "réfuter l'adversaire"], a: 1, exp: "Le hook est la phrase d'accroche qui capte l'intérêt." },
    { type: "qcm", q: "Quelle phrase appartient à une conclusion ?", opts: ["Firstly, plastics harm marine life.", "Studies show that...", "All things considered, a ban is the wisest option.", "Admittedly, some disagree."], a: 2, exp: "« All things considered » ouvre une conclusion synthétique." },
    { type: "vf", q: "Un essai argumentatif solide anticipe et réfute les objections adverses.", a: true, exp: "La prise en compte du contre-argument est une marque de rigueur." },
    { type: "input", q: "Donne le connecteur d'ouverture d'un DEUXIÈME argument (un mot). « ___, banning plastics would boost innovation. »", a: ["secondly", "furthermore", "moreover", "additionally"], ph: "un connecteur", exp: "Secondly / Furthermore / Moreover enchaînent un nouvel argument." },
    { type: "qcm", q: "Dans le schéma d'ensemble, où placer la réfutation de l'avis adverse ?", opts: ["avant l'introduction", "dans la conclusion uniquement", "dans un paragraphe dédié, après les arguments principaux", "on ne la met jamais"], a: 2, exp: "Le contre-argument occupe un paragraphe dédié, souvent après les arguments pour." }
  ],
  final: {
    title: "Exercice final — Analyser un essai modèle",
    intro: `<p>Read this model argumentative essay on remote work and observe its structure.</p>
<p>Over the past few years, the way we work has changed dramatically. Since the pandemic, millions of employees have discovered the possibility of working from home, and the debate about its value shows no sign of fading. This essay will argue that, despite some drawbacks, remote work offers more benefits than disadvantages for both employees and companies. Firstly, remote work improves work-life balance. Without long daily commutes, employees gain valuable time and report lower stress levels; consequently, they tend to be more productive and loyal. Secondly, companies can reduce costs significantly, since smaller offices mean lower rent and fewer overheads. Admittedly, critics argue that remote work weakens team spirit and makes collaboration harder. However, modern communication tools, combined with occasional in-person meetings, can largely overcome this obstacle. In conclusion, while remote work is not without challenges, its advantages clearly outweigh its limitations. The real question for organisations is no longer whether to embrace flexibility, but how to manage it wisely.</p>`,
    questions: [
      { type: "qcm", q: "Où se trouve la thèse (thesis statement) ?", opts: ["dans la première phrase", "« This essay will argue that... remote work offers more benefits than disadvantages »", "dans le contre-argument", "dans la dernière phrase"], a: 1, exp: "La thèse est annoncée en fin d'introduction : la position défendue." },
      { type: "qcm", q: "« Firstly... Secondly... » servent à…", opts: ["conclure", "structurer et enchaîner les arguments de développement", "réfuter", "accrocher"], a: 1, exp: "Ces connecteurs ordonnent les paragraphes d'arguments." },
      { type: "vf", q: "« Admittedly, critics argue that... However,... » constitue un contre-argument suivi de sa réfutation.", a: true, exp: "Admittedly concède l'objection ; However la réfute." },
      { type: "qcm", q: "Que fait la phrase « In conclusion, while remote work is not without challenges, its advantages clearly outweigh its limitations » ?", opts: ["introduit un nouvel argument", "reformule la thèse et fait le bilan", "pose une objection", "cite une étude"], a: 1, exp: "La conclusion reformule la thèse sans idée nouvelle." },
      { type: "qcm", q: "La dernière phrase (« The real question is no longer whether... but how... ») est…", opts: ["une preuve", "une ouverture finale", "une topic sentence", "une concession"], a: 1, exp: "Elle ouvre la réflexion : c'est la touche finale de la conclusion." }
    ],
    solution: `<p>L'essai modèle respecte fidèlement la structure argumentative :</p>
<pre class="pseudo">INTRODUCTION : contexte (pandemic) + these (This essay will argue that ...)
BODY 1 : Firstly, remote work improves work-life balance (Point-Evidence-Explanation-Link)
BODY 2 : Secondly, companies can reduce costs
CONTRE-ARGUMENT : Admittedly, critics argue ... However, modern tools can overcome this
CONCLUSION : In conclusion, ... advantages outweigh limitations + ouverture (the real question ...)</pre>
<p>Chaque brique remplit sa fonction : la thèse oriente tout l'essai, les connecteurs (Firstly, Secondly, consequently, However) guident le lecteur, le contre-argument renforce la crédibilité, et la conclusion synthétise sans rien ajouter de neuf. Voilà le squelette à reproduire.</p>`
  }
};
</script>

    hints: [
      "Introduction : contexte + « This essay will argue that… ».",
      "Arguments : « Firstly,… consequently… » / « Secondly,… ».",

    ],
    solution: "The four-day working week has moved from a radical idea to a serious proposal debated by governments worldwide. As companies search for ways to improve wellbeing and productivity, the question deserves careful attention. This essay will argue that a four-day week would benefit both workers and employers. Firstly, a shorter week improves employees' mental health. With an extra day of rest, workers report less burnout and greater motivation; consequently, they return more focused and efficient. Secondly, companies often see productivity remain stable or even rise, since employees waste less time and concentrate on what truly matters. Admittedly, critics claim that some industries, such as healthcare, cannot easily adopt this model. However, flexible scheduling and additional hiring could address these specific cases without abandoning the wider benefits. In conclusion, although the transition requires planning, the four-day week offers a realistic path towards healthier and more productive workplaces. The real challenge is not whether to try it, but how boldly we are willing to rethink work itself.\n\nTraduction : La semaine de quatre jours est passee d'une idee radicale a une proposition serieuse debattue par les gouvernements du monde entier. Alors que les entreprises cherchent a ameliorer le bien-etre et la productivite, la question merite une attention particuliere. Cet essai defendra qu'une semaine de quatre jours profiterait a la fois aux salaries et aux employeurs. Premierement, une semaine plus courte ameliore la sante mentale des employes. Avec un jour de repos supplementaire, les travailleurs signalent moins d'epuisement et plus de motivation ; par consequent, ils reviennent plus concentres et efficaces. Deuxiemement, les entreprises constatent souvent que la productivite reste stable, voire augmente, car les employes perdent moins de temps et se concentrent sur l'essentiel. Certes, les critiques affirment que certains secteurs, comme la sante, ne peuvent pas adopter facilement ce modele. Cependant, des horaires flexibles et des embauches supplementaires pourraient repondre a ces cas precis sans renoncer aux benefices plus larges. En conclusion, bien que la transition demande de la planification, la semaine de quatre jours offre une voie realiste vers des lieux de travail plus sains et plus productifs. Le vrai defi n'est pas de savoir s'il faut l'essayer, mais avec quelle audace nous sommes prets a repenser le travail lui-meme.",
    note: "Structure complète : introduction (contexte + thèse), deux arguments PEEL enchaînés par Firstly/Secondly, contre-argument (Admittedly... However...), conclusion qui reformule + ouverture. C'est le schéma exact du jour." }
  ]
