  num: 18,
  title: "Comprendre un article de fond",
  subtitle: "Lire un article d'opinion argumenté : thèse, arguments, nuances.",
  theory: `
<h3>1. Qu'est-ce qu'un article de fond ?</h3>
<p>Un <strong>article de fond</strong> (en anglais <em>a feature article</em> ou <em>an in-depth article</em>) n'annonce pas une simple nouvelle : il analyse un phénomène, présente des arguments et défend souvent un point de vue. Le lire, c'est repérer sa <strong>structure</strong> : une thèse, des arguments pour, des objections, et une conclusion nuancée. On ne lit pas chaque mot : on cherche les <strong>idées principales</strong> et les <strong>mots-charnières</strong>.</p>
<div class="tip">Stratégie de lecture : lisez d'abord le titre et la première phrase de chaque paragraphe (le <em>topic sentence</em>). Vous obtiendrez le squelette de l'argumentation avant même de lire les détails.</div>
<h3>2. L'article</h3>
<p><em>For over a century, the five-day working week has been treated as a law of nature. But a growing number of companies are asking a simple question: what if we worked less?</em></p>
<p><em>The idea of a four-day week is not new, yet it has gained real momentum in recent years. In 2022, dozens of British firms took part in a large trial in which employees worked one day less for the same pay. The results surprised many observers. Productivity did not fall; in most cases, it stayed the same or even rose slightly. Staff reported lower stress, better sleep, and fewer sick days.</em></p>
<p><em>Supporters argue that the traditional week is a relic of the industrial age, designed for factories rather than for knowledge workers who spend their days on screens. They point out that many office hours are wasted on unnecessary meetings and distractions. Cut the week down, they say, and people simply focus better on what matters.</em></p>
<p><em>Critics, however, are not convinced. Some industries, such as healthcare and retail, cannot easily close for an extra day. A shorter week might also widen the gap between well-paid office staff, who benefit, and lower-paid workers, who do not. Moreover, sceptics warn that squeezing five days of work into four could simply increase pressure rather than reduce it.</em></p>
<p><em>The truth, as so often, probably lies somewhere in between. The four-day week is unlikely to suit every job, but the trials suggest that our assumptions about work deserve to be questioned. If nothing else, they remind us that the way we organise our time is a choice, not a fixed rule handed down from the past.</em></p>
<h3>3. Aide au vocabulaire</h3>
<pre class="pseudo">to gain momentum    prendre de l'ampleur
a trial             une expérimentation, un essai
for the same pay    à salaire égal
sick days           jours d'arrêt maladie
a relic of          un vestige de
knowledge workers   les travailleurs du savoir
to widen the gap    creuser l'écart
sceptics            les sceptiques
to squeeze into     faire tenir (de force) dans
to lie in between   se situer entre les deux
handed down         transmis, hérité</pre>
<div class="warn">Repérez les <strong>marqueurs d'opinion</strong> : <em>Supporters argue…</em>, <em>Critics are not convinced…</em>, <em>sceptics warn…</em>. Ils signalent que ce qui suit est un avis, pas un fait. Ne les confondez pas avec les faits (les chiffres du trial de 2022).</div>`,
  exercises: [
    { type: "qcm", q: "Quelle est la thèse générale de l'article ?", opts: ["La semaine de 4 jours est une évidence à généraliser", "L'idée mérite d'être étudiée mais ne conviendra pas à tous les métiers", "La semaine de 5 jours est parfaite", "Il faut travailler 6 jours"], a: 1, exp: "La conclusion nuance : « unlikely to suit every job, but… deserve to be questioned »." },
    { type: "qcm", q: "Que montrait l'essai britannique de 2022 sur la productivité ?", opts: ["Elle s'est effondrée", "Elle est restée stable ou a légèrement augmenté", "Elle a doublé", "Le texte ne le dit pas"], a: 1, exp: "« Productivity did not fall; in most cases, it stayed the same or even rose slightly »." },
    { type: "vf", q: "Selon les partisans, la semaine de 5 jours a été conçue pour les usines.", a: true, exp: "« a relic of the industrial age, designed for factories »." },
    { type: "input", q: "Traduis <em>to gain momentum</em> : prendre de l'___.", a: ["ampleur", "élan"], ph: "un mot", exp: "To gain momentum = prendre de l'ampleur, de l'élan." },
    { type: "qcm", q: "Quelle objection les critiques soulèvent-ils sur les secteurs comme la santé ?", opts: ["Ils gagnent trop", "Ils ne peuvent pas fermer un jour de plus facilement", "Ils sont déjà à 4 jours", "Ils refusent les essais"], a: 1, exp: "« such as healthcare and retail, cannot easily close for an extra day »." },
    { type: "qcm", q: "Que craignent les sceptiques à propos de la pression ?", opts: ["Qu'elle disparaisse", "Que faire tenir 5 jours en 4 l'augmente au lieu de la réduire", "Qu'elle reste identique", "Rien"], a: 1, exp: "« squeezing five days into four could simply increase pressure »." },
    { type: "input", q: "Complète : « The four-day week could ___ the gap between well-paid and low-paid workers. » (creuser)", a: ["widen"], ph: "un verbe", exp: "To widen the gap = creuser / élargir l'écart." },
    { type: "qcm", q: "Que signifie <em>knowledge workers</em> ?", opts: ["les ouvriers d'usine", "les travailleurs du savoir (bureaux, écrans)", "les enseignants uniquement", "les chômeurs"], a: 1, exp: "Knowledge workers : ceux dont le travail repose sur l'information, souvent sur écran." },
    { type: "vf", q: "L'auteur affirme que la semaine de 4 jours convient à absolument tous les métiers.", a: false, exp: "« unlikely to suit every job » : il dit le contraire, il nuance." },
    { type: "qcm", q: "Le marqueur « Critics, however, are not convinced » signale :", opts: ["un fait chiffré", "l'introduction d'un avis opposé", "une conclusion", "une question"], a: 1, exp: "C'est un marqueur d'opinion qui introduit le camp adverse." },
    { type: "input", q: "Traduis <em>sick days</em> : jours d'___ maladie.", a: ["arrêt"], ph: "un mot", exp: "Sick days = jours d'arrêt maladie." },
    { type: "qcm", q: "Quelle phrase résume le mieux la conclusion de l'auteur ?", opts: ["Tout le monde devrait passer à 4 jours demain", "La façon d'organiser le temps est un choix, pas une loi immuable", "Le travail est inutile", "Les essais ont échoué"], a: 1, exp: "« the way we organise our time is a choice, not a fixed rule »." },
    { type: "qcm", q: "Dans un article de fond, la <em>topic sentence</em> est :", opts: ["la dernière phrase", "la phrase qui annonce l'idée principale d'un paragraphe", "le titre", "une citation"], a: 1, exp: "La topic sentence, souvent en tête de paragraphe, en résume l'idée principale." },
    { type: "vf", q: "Le chiffre « en 2022, des dizaines d'entreprises britanniques » est présenté comme un fait, pas une opinion.", a: true, exp: "C'est une donnée factuelle, distincte des marqueurs d'opinion (argue, warn)." },
    { type: "qcm", q: "Que veut dire l'auteur par « the truth probably lies somewhere in between » ?", opts: ["Les deux camps ont tort", "La vérité se situe sans doute entre les deux positions", "Il n'y a pas de vérité", "Les critiques ont raison sur tout"], a: 1, exp: "« lies somewhere in between » : une position médiane et nuancée." }
  ],
  final: {
    title: "Exercice final — Repérer la structure",
    intro: `<p>Relisez mentalement l'article, puis identifiez le rôle de chaque partie. Rappel de la structure d'un article de fond : <strong>accroche → thèse → arguments pour → objections → conclusion nuancée</strong>.</p>
<p><em>Reminder — the article opens with a provocative question, presents evidence from a 2022 trial, gives the supporters' case, then the critics' case, and ends by refusing to take a firm side.</em></p>`,
    questions: [
      { type: "qcm", q: "Quel est le rôle du premier paragraphe (« what if we worked less? ») ?", opts: ["Conclure", "Accrocher le lecteur avec une question provocatrice", "Donner des chiffres", "Citer les critiques"], a: 1, exp: "L'accroche pose une question qui interpelle et lance le sujet." },
      { type: "qcm", q: "À quoi sert le paragraphe sur l'essai de 2022 ?", opts: ["À donner une opinion", "À apporter des preuves factuelles", "À conclure", "À poser une question"], a: 1, exp: "Les résultats chiffrés servent de preuves à l'argumentation." },
      { type: "qcm", q: "Le paragraphe « Critics, however… » présente :", opts: ["les partisans", "les objections et contre-arguments", "la conclusion", "l'accroche"], a: 1, exp: "Un article de fond équilibré expose aussi le camp adverse." },
      { type: "vf", q: "L'auteur prend clairement parti pour l'interdiction de la semaine de 5 jours.", a: false, exp: "Il refuse de trancher : « the truth probably lies somewhere in between »." },
      { type: "qcm", q: "Quelle qualité rend cet article typiquement « de fond » ?", opts: ["Il ne donne qu'un seul avis", "Il pèse le pour et le contre avant de conclure avec nuance", "Il est très court", "Il ne cite aucune donnée"], a: 1, exp: "L'équilibre entre arguments, objections et nuance est la marque de l'article de fond." }
    ],
    solution: `<p>L'article suit une architecture classique. <strong>Accroche</strong> : une question qui bouscule (<em>what if we worked less?</em>). <strong>Preuves</strong> : les résultats du trial de 2022. <strong>Arguments pour</strong> : <em>Supporters argue…</em>. <strong>Objections</strong> : <em>Critics, however, are not convinced…</em>. <strong>Conclusion nuancée</strong> : <em>the truth probably lies somewhere in between</em>. Lire efficacement un article de fond, c'est distinguer les <strong>faits</strong> (les chiffres) des <strong>opinions</strong> (introduites par argue, warn, point out), et repérer la position finale de l'auteur — ici, volontairement prudente. Cette gymnastique est exactement celle que vous mobiliserez sur le fait divers de deux pages des projets finaux.</p>`
  }
};
</script>
