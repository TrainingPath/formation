<script>
var DAY = {
  num: 1,
  title: "Le subjonctif présent : formation",
  subtitle: "Le mode de l'incertitude, du souhait et de la subjectivité : apprendre à le conjuguer.",
  theory: `
<h3>1. Qu'est-ce que le subjonctif ?</h3>
<p>En français, le subjonctif existe mais on l'entend peu (« il faut que tu <em>viennes</em> »). En espagnol, au contraire, il est <strong>partout</strong> : c'est le mode de tout ce qui n'est pas un fait certain — le souhait, l'ordre, le doute, l'émotion, l'hypothèse. Le maîtriser, c'est franchir la grande porte du niveau B1. Aujourd'hui, une seule chose compte : savoir le <strong>former</strong>. Les emplois viendront les jours suivants.</p>
<div class="tip">Le subjonctif apparaît presque toujours dans une <strong>proposition subordonnée introduite par que</strong> : <em>Quiero que vengas</em> (Je veux que tu viennes). La proposition principale (quiero) est à l'indicatif, la subordonnée (que vengas) au subjonctif.</div>
<h3>2. La règle d'or : partir du yo du présent</h3>
<p>Pour former le subjonctif présent d'un verbe, on suit trois étapes très mécaniques :</p>
<pre class="pseudo">1) Prendre la 1re personne (yo) du présent de l'indicatif
2) Enlever la terminaison -o
3) Ajouter les terminaisons INVERSES :
   - verbes en -AR  ->  terminaisons en -E
   - verbes en -ER / -IR  ->  terminaisons en -A</pre>
<p>On dit souvent que le subjonctif « échange les voyelles » : les verbes en -ar prennent des terminaisons en e, les verbes en -er/-ir des terminaisons en a.</p>
<h3>3. Les verbes réguliers</h3>
<pre class="pseudo">HABLAR (parler)      COMER (manger)     VIVIR (vivre)
hable  = que je parle  coma  = que je mange  viva  = que je vive
hables               comas              vivas
hable                coma               viva
hablemos             comamos            vivamos
habléis              comáis             viváis
hablen               coman              vivan</pre>
<p>Exemple : <em>Es necesario que hables más despacio</em> (Il faut que tu parles plus lentement).</p>
<h3>4. La force du yo : les irréguliers deviennent réguliers</h3>
<p>Le grand avantage de la règle « partir du yo » : la plupart des verbes irréguliers gardent leur irrégularité à toutes les personnes du subjonctif. On part du yo irrégulier, et tout suit.</p>
<pre class="pseudo">Verbe     yo (présent)    Subjonctif (yo, tú, él...)
TENER     tengo       ->  tenga, tengas, tenga, tengamos...
HACER     hago        ->  haga, hagas, haga...
DECIR     digo        ->  diga, digas, diga...
SALIR     salgo       ->  salga, salgas...
CONOCER   conozco     ->  conozca, conozcas...
VENIR     vengo       ->  venga, vengas...</pre>
<div class="warn">Attention aux verbes à diphtongue (e -> ie, o -> ue) : la diphtongue apparaît aux mêmes personnes qu'au présent. QUERER : quiera, quieras, quiera, <strong>queramos</strong>, <strong>queráis</strong>, quieran (nous / vous restent sans diphtongue). PODER : pueda, puedas, pueda, podamos, podáis, puedan.</div>
<h3>5. Les six irréguliers à mémoriser par coeur</h3>
<p>Six verbes ne suivent pas la règle du yo (leur yo ne finit pas en -o) : il faut les apprendre tels quels. Astuce mnémonique : leurs initiales forment DISHES (en anglais « la vaisselle ») ou, en français, retenez-les en bloc.</p>
<pre class="pseudo">SER    -> sea, seas, sea, seamos, seáis, sean
ESTAR  -> esté, estés, esté, estemos, estéis, estén
IR     -> vaya, vayas, vaya, vayamos, vayáis, vayan
HABER  -> haya, hayas, haya, hayamos, hayáis, hayan
DAR    -> dé, des, dé, demos, deis, den
SABER  -> sepa, sepas, sepa, sepamos, sepáis, sepan</pre>
<div class="tip">Astuce d'accent : ESTAR porte l'accent sur le é (esté, estén) pour le distinguer de este/esten. DAR au subjonctif, dé prend l'accent pour ne pas se confondre avec la préposition de.</div>`,
  exercises: [
    { type: "qcm", q: "Pour former le subjonctif présent, on part de :", opts: ["l'infinitif", "la 1re personne (yo) du présent de l'indicatif", "la 3e personne du pluriel", "l'imparfait"], a: 1, exp: "On part du yo du présent, on enlève le -o et on ajoute les terminaisons inverses." },
    { type: "qcm", q: "Les verbes en -AR prennent au subjonctif des terminaisons en :", opts: ["-a", "-e", "-i", "-o"], a: 1, exp: "Les verbes en -ar échangent leur voyelle : terminaisons en -e (hable, hables...)." },
    { type: "input", q: "Subjonctif de HABLAR, yo : Es importante que yo ___ con el jefe.", a: ["hable"], ph: "verbe", exp: "Yo hable : hablar -> habl- + e." },
    { type: "input", q: "Subjonctif de COMER, tú : Quiero que ___ más verduras.", a: ["comas"], ph: "verbe", exp: "Comer -> com- + as = comas." },
    { type: "qcm", q: "Le subjonctif apparaît le plus souvent :", opts: ["dans la proposition principale", "dans une subordonnée introduite par que", "après une virgule", "au début de la phrase"], a: 1, exp: "Structure typique : principale à l'indicatif + que + subordonnée au subjonctif." },
    { type: "input", q: "Subjonctif de TENER, yo (à partir de tengo) : Ojalá ___ tiempo mañana.", a: ["tenga"], ph: "verbe", exp: "Tengo -> teng- + a = tenga. L'irrégularité du yo se propage." },
    { type: "vf", q: "Le verbe SER est irrégulier au subjonctif : sea, seas, sea...", a: true, exp: "SER fait partie des six irréguliers à mémoriser : sea, seas, sea, seamos, seáis, sean." },
    { type: "qcm", q: "Quel est le subjonctif présent de IR (nous) ?", opts: ["vamos", "vayamos", "íbamos", "iremos"], a: 1, exp: "IR -> vaya, vayas, vaya, vayamos, vayáis, vayan." },
    { type: "input", q: "Subjonctif de HACER, tú (à partir de hago) : No creo que ___ los deberes.", a: ["hagas"], ph: "verbe", exp: "Hago -> hag- + as = hagas." },
    { type: "qcm", q: "QUERER au subjonctif : quelle forme n'a PAS de diphtongue ?", opts: ["quiera (yo)", "quieras (tú)", "queramos (nosotros)", "quieran (ellos)"], a: 2, exp: "Nous et vous perdent la diphtongue : queramos, queráis." },
    { type: "input", q: "Subjonctif de SABER, yo : Es raro que no lo ___ .", a: ["sepa"], ph: "verbe", exp: "SABER est irrégulier : sepa, sepas, sepa..." },
    { type: "vf", q: "Le subjonctif de VIVIR (ellos) est vivan.", a: true, exp: "Vivir -> viv- + an = vivan (terminaison en -a pour un verbe en -ir)." },
    { type: "qcm", q: "Comprension : dans « Quiero que vengas a la fiesta », pourquoi vengas est-il au subjonctif ?", opts: ["parce que c'est un fait certain", "parce que c'est un souhait exprimé dans une subordonnée après que", "parce que c'est le futur", "par hasard"], a: 1, exp: "Le souhait (quiero que) déclenche le subjonctif dans la subordonnée." },
    { type: "input", q: "Subjonctif de ESTAR, yo : Es normal que ___ cansado.", a: ["esté"], ph: "verbe", exp: "ESTAR irrégulier : esté (avec accent), estés, esté..." },
    { type: "qcm", q: "Comprension : « Espero que todo salga bien. » Que signifie salga ?", opts: ["il sort (indicatif)", "que ça se passe / se déroule (subjonctif)", "sortir (infinitif)", "il sortait"], a: 1, exp: "Salga = subjonctif de salir (salgo -> salga) : j'espère que tout se passe bien." }
  ],
  final: {
    title: "Exercice final — Los deseos de la abuela",
    intro: `<p>Lee lo que desea la abuela para su familia :</p>
<pre class="pseudo">La abuela siempre nos dice lo que quiere para nosotros.
Quiere que estudiemos mucho y que seamos felices.
Espera que su nieto tenga un buen trabajo.
Le gusta que la familia venga a comer los domingos.
Pide que hablemos con respeto a todo el mundo.
Ojalá todos vivan una vida tranquila.</pre>`,
    questions: [
      { type: "qcm", q: "« Quiere que estudiemos » : estudiemos est le subjonctif de quel verbe ?", opts: ["estar", "estudiar", "estudio", "estimar"], a: 1, exp: "Estudiar -> estudi- + emos = estudiemos." },
      { type: "input", q: "Relève le subjonctif de SER employé (nosotros) dans le texte.", a: ["seamos"], ph: "verbe", exp: "Que seamos felices : SER est irrégulier." },
      { type: "qcm", q: "« tenga » vient de quel verbe et à quelle personne ?", opts: ["tener, il/elle", "tomar, nous", "tener, nous", "tenir en français"], a: 0, exp: "Tenga = subjonctif de tener, 3e personne (su nieto)." },
      { type: "vf", q: "« Ojalá todos vivan » exprime un souhait au subjonctif.", a: true, exp: "Ojalá + subjonctif = pourvu que / espérons que. Vivan = subjonctif de vivir." },
      { type: "input", q: "Complète : la abuela pide que ___ (hablar, nosotros) con respeto.", a: ["hablemos"], ph: "verbe", exp: "Hablar -> habl- + emos = hablemos." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">La grand-mère nous dit toujours ce qu'elle veut pour nous.
Elle veut que nous étudiions beaucoup et que nous soyons heureux.
Elle espère que son petit-fils ait un bon travail.
Elle aime que la famille vienne manger le dimanche.
Elle demande que nous parlions avec respect à tout le monde.
Pourvu que tous vivent une vie tranquille.</pre>
<p>Repère la mécanique : chaque verbe de la subordonnée (estudiemos, seamos, tenga, venga, hablemos, vivan) est au <strong>subjonctif</strong> parce que la principale exprime un souhait, un espoir ou une demande. C'est exactement ce qu'on approfondira demain.</p>`
  }
};
</script>

<script>

  { id: "es-b1-j01", title: "Tes souhaits pour tes proches", level: 2,

      "Commence chaque phrase par Quiero que, Espero que ou Ojalá.",

    ],
    solution: "Quiero que mi familia esté siempre bien. Espero que mi hermano tenga éxito en sus estudios. Ojalá mis amigos sean felices y vivan sin preocupaciones. Deseo que mis padres viajen mucho este año. Espero que todos hablemos más a menudo. Ojalá el próximo año sea mejor que este.\n\nTraduction : Je veux que ma famille aille toujours bien. J'espère que mon frère réussisse ses études. Pourvu que mes amis soient heureux et vivent sans soucis. Je souhaite que mes parents voyagent beaucoup cette année. J'espère que nous parlions tous plus souvent. Pourvu que l'année prochaine soit meilleure que celle-ci.",

  ]
};
