<body>
<script>
var DAY = {
  num: 14,
  title: "L'entretien d'embauche : questions clés",
  subtitle: "Une banque de questions et de réponses pour réussir une entrevista de trabajo.",
  theory: `
<h3>1. Le vocabulaire de l'entretien</h3>
<pre class="pseudo">la entrevista (de trabajo)  = l'entretien d'embauche
el/la entrevistador(a)      = le recruteur
el/la candidato/a           = le/la candidat(e)
el puesto vacante           = le poste à pourvoir
las fortalezas / debilidades = les forces / faiblesses
la disponibilidad           = la disponibilité
las expectativas salariales = les prétentions salariales
incorporarse                = commencer (dans un poste)</pre>
<h3>2. Banque de questions fréquentes (à comprendre et anticiper)</h3>
<pre class="pseudo">1. Háblame de ti.                = Parlez-moi de vous.
2. ¿Por qué quieres este puesto? = Pourquoi voulez-vous ce poste ?
3. ¿Cuáles son tus fortalezas?   = Quelles sont vos forces ?
4. ¿Y tus puntos débiles?        = Et vos points faibles ?
5. ¿Por qué dejaste tu anterior trabajo? = Pourquoi avoir quitté votre emploi précédent ?
6. ¿Dónde te ves dentro de cinco años? = Où vous voyez-vous dans cinq ans ?
7. ¿Por qué deberíamos contratarte? = Pourquoi devrions-nous vous embaucher ?
8. ¿Cuáles son tus expectativas salariales? = Quelles sont vos prétentions salariales ?
9. ¿Cuándo podrías incorporarte?  = Quand pourriez-vous commencer ?
10. ¿Tienes alguna pregunta?      = Avez-vous des questions ?</pre>
<h3>3. Banque de réponses modèles</h3>
<pre class="pseudo">- Háblame de ti :
  Soy una persona organizada y con ganas de aprender. Tengo experiencia en...
  = Je suis quelqu'un d'organisé et désireux d'apprendre. J'ai de l'expérience en...

- ¿Por qué quieres este puesto? :
  Me interesa porque encaja con mi formación y quiero crecer profesionalmente.
  = Il m'intéresse car il correspond à ma formation et je veux évoluer.

- ¿Cuáles son tus fortalezas? :
  Creo que mis puntos fuertes son la responsabilidad y el trabajo en equipo.
  = Je pense que mes points forts sont le sérieux et le travail d'équipe.

- ¿Y tus puntos débiles? :
  A veces soy demasiado perfeccionista, pero estoy aprendiendo a delegar.
  = Parfois je suis trop perfectionniste, mais j'apprends à déléguer.

- ¿Dónde te ves dentro de cinco años? :
  Me gustaría asumir más responsabilidades y seguir formándome.
  = J'aimerais avoir plus de responsabilités et continuer à me former.</pre>
<div class="tip">Pour la faiblesse (punto débil), la stratégie gagnante : citer un défaut réel mais présenter l'effort pour le corriger (« ... pero estoy trabajando en ello »).</div>
<h3>4. Les formules de politesse</h3>
<pre class="pseudo">Encantado/a de conocerle.       = Ravi de vous rencontrer.
Muchas gracias por su tiempo.   = Merci beaucoup pour votre temps.
Quedo a su disposición.         = Je reste à votre disposition.
Estaré encantado/a de empezar.  = Je serai ravi de commencer.</pre>
<div class="warn">En entretien, on vouvoie souvent (usted) : « ¿Podría hablarme del equipo? », « Gracias por recibirme ». Adapte les formes verbales à usted.</div>
<h3>5. Poser SES questions (montrer son intérêt)</h3>
<pre class="pseudo">¿Cómo es un día típico en este puesto?
  = Comment se déroule une journée type à ce poste ?
¿Hay posibilidades de promoción?
  = Y a-t-il des possibilités d'évolution ?
¿Cómo es el equipo con el que trabajaría?
  = Comment est l'équipe avec laquelle je travaillerais ?
¿Cuáles serían mis principales funciones?
  = Quelles seraient mes principales fonctions ?</pre>
<p>Poser une ou deux bonnes questions à la fin montre ta motivation. Ne jamais répondre « no, ninguna » (aucune) : prépare toujours deux questions.</p>`,
  exercises: [
    { type: "qcm", q: "« La entrevista de trabajo » signifie :", opts: ["le contrat de travail", "l'entretien d'embauche", "le CV", "le salaire"], a: 1, exp: "La entrevista de trabajo = l'entretien d'embauche." },
    { type: "input", q: "Traduis : les points forts = las ___ (ou puntos fuertes).", a: ["fortalezas"], ph: "nom", exp: "Las fortalezas / los puntos fuertes = les points forts." },
    { type: "qcm", q: "« ¿Cuáles son tus puntos débiles? » demande :", opts: ["tes forces", "tes faiblesses", "ton salaire", "ta disponibilité"], a: 1, exp: "Puntos débiles = points faibles." },
    { type: "input", q: "Complète la question : ¿Por qué quieres este ___? (poste)", a: ["puesto"], ph: "nom", exp: "El puesto = le poste : ¿Por qué quieres este puesto?" },
    { type: "qcm", q: "Bonne stratégie pour parler d'un défaut :", opts: ["nier avoir des défauts", "citer un défaut réel et l'effort pour le corriger", "dire un défaut très grave", "ne rien répondre"], a: 1, exp: "Montrer qu'on progresse : « soy perfeccionista, pero estoy mejorando »." },
    { type: "input", q: "Complète : ¿Cuándo podrías ___? (commencer / t'intégrer au poste)", a: ["incorporarte"], ph: "verbe", exp: "Incorporarse = commencer (dans un poste)." },
    { type: "vf", q: "En entretien, on utilise souvent le vouvoiement (usted).", a: true, exp: "Vrai : le registre formel usted est courant en entretien." },
    { type: "qcm", q: "« ¿Cuáles son tus expectativas salariales? » porte sur :", opts: ["tes horaires", "tes prétentions salariales", "tes diplômes", "tes langues"], a: 1, exp: "Expectativas salariales = prétentions salariales." },
    { type: "input", q: "Complète la réponse : Mis puntos fuertes son la responsabilidad y el ___ en equipo.", a: ["trabajo"], ph: "nom", exp: "El trabajo en equipo = le travail d'équipe." },
    { type: "qcm", q: "Que faut-il faire quand on demande « ¿Tienes alguna pregunta? » ?", opts: ["répondre 'no, ninguna'", "poser une ou deux questions préparées", "partir aussitôt", "parler du salaire uniquement"], a: 1, exp: "Poser des questions montre l'intérêt : évolution, équipe, fonctions." },
    { type: "input", q: "Traduis la formule : Merci pour votre temps = Muchas gracias por su ___ .", a: ["tiempo"], ph: "mot", exp: "Gracias por su tiempo = merci pour votre temps." },
    { type: "vf", q: "« ¿Dónde te ves dentro de cinco años? » interroge sur tes projets futurs.", a: true, exp: "Vrai : cette question porte sur tes objectifs à moyen terme." },
    { type: "qcm", q: "Comprension : « Me interesa este puesto porque encaja con mi formación. » Pourquoi le candidat veut-il le poste ?", opts: ["pour le salaire élevé", "parce qu'il correspond à sa formation", "parce que c'est près de chez lui", "il ne sait pas"], a: 1, exp: "Encaja con mi formación = il correspond à ma formation." },
    { type: "input", q: "Complète la question du candidat : ¿Hay posibilidades de ___? (promotion)", a: ["promoción", "promocion"], ph: "nom", exp: "Posibilidades de promoción = possibilités d'évolution." },
    { type: "qcm", q: "Comprension : « Quedo a su disposición para cualquier duda. » Que veut dire cette formule ?", opts: ["Je ne suis pas disponible", "Je reste à votre disposition pour toute question", "Je pose une question", "Je refuse le poste"], a: 1, exp: "Quedar a su disposición = rester à votre disposition (formule polie)." }
  ],
  final: {
    title: "Exercice final — Fragmento de una entrevista",
    intro: `<p>Diálogo entre un entrevistador (E) y una candidata (C) :</p>
<pre class="pseudo">E : Buenos días, gracias por venir. Hábleme un poco de usted.
C : Encantada. Soy diseñadora gráfica con cinco años de experiencia.
E : ¿Por qué le interesa este puesto?
C : Porque encaja con mi perfil y quiero asumir más responsabilidades.
E : ¿Cuál diría que es su mayor debilidad?
C : A veces soy muy exigente conmigo misma, pero estoy aprendiendo a equilibrarme.
E : Perfecto. ¿Tiene alguna pregunta?
C : Sí, ¿cómo es el equipo con el que trabajaría?</pre>`,
    questions: [
      { type: "qcm", q: "Que demande d'abord l'entrevistador ?", opts: ["le salaire", "de se présenter (hábleme de usted)", "les diplômes", "l'adresse"], a: 1, exp: "Hábleme un poco de usted = parlez-moi un peu de vous." },
      { type: "input", q: "Combien d'années d'expérience a la candidate ? (en chiffres)", a: ["5", "cinco"], ph: "nombre", exp: "Cinco años de experiencia = 5 ans." },
      { type: "qcm", q: "Comment gère-t-elle la question sur sa faiblesse ?", opts: ["elle nie tout défaut", "elle cite un défaut et l'effort pour l'améliorer", "elle refuse de répondre", "elle donne un défaut grave"], a: 1, exp: "Soy exigente conmigo misma, pero estoy aprendiendo : stratégie recommandée." },
      { type: "vf", q: "À la fin, la candidate pose une question sur l'équipe.", a: true, exp: "Vrai : ¿cómo es el equipo con el que trabajaría? montre son intérêt." },
      { type: "input", q: "Relève la formule de politesse initiale de la candidate : « ___ » (ravie).", a: ["Encantada", "encantada"], ph: "mot", exp: "Encantada = ravie (formule de politesse)." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">E : Bonjour, merci d'être venue. Parlez-moi un peu de vous.
C : Enchantée. Je suis graphiste avec cinq ans d'expérience.
E : Pourquoi ce poste vous intéresse-t-il ?
C : Parce qu'il correspond à mon profil et je veux prendre plus de responsabilités.
E : Quelle serait votre plus grande faiblesse ?
C : Parfois je suis très exigeante envers moi-même, mais j'apprends à m'équilibrer.
E : Parfait. Avez-vous une question ?
C : Oui, comment est l'équipe avec laquelle je travaillerais ?</pre>
<p>Un bon entretien mêle présentation claire (soy... con experiencia en...), motivation (porque encaja con mi perfil), gestion habile des faiblesses (defecto + effort de correction) et une question finale qui montre l'intérêt. Anticiper ces questions clés, c'est déjà réussir la moitié de l'entrevista.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en espagnol…",
  items: [
  { id: "es-b1-j14", title: "Prépare tes réponses d'entretien", level: 3,
    statement: "Prépare tes réponses à un entretien d'embauche. Écris 6 à 7 phrases répondant à : Háblame de ti, ¿Por qué quieres este puesto?, ¿Cuáles son tus fortalezas y debilidades?, ¿Dónde te ves dentro de cinco años? Termine par une question à poser au recruteur.",
    hints: [
      "Présente-toi : Soy una persona… con experiencia en…",
      "Justifie ta motivation (porque…) et cite forces (mis puntos fuertes son…) et une faiblesse à nuancer.",
      "Finis par une question : ¿Hay posibilidades de promoción? / ¿Cómo es el equipo?"
    ],
    solution: "Soy una persona responsable y con muchas ganas de aprender. Tengo experiencia en atención al cliente y me gusta trabajar en equipo. Me interesa este puesto porque encaja con mi formación y quiero crecer profesionalmente. Creo que mis puntos fuertes son la organización y la comunicación. A veces soy demasiado perfeccionista, pero estoy aprendiendo a gestionar mejor mi tiempo. Dentro de cinco años me veo asumiendo más responsabilidades en esta empresa. Por mi parte, me gustaría saber cómo es un día típico en este puesto.\n\nTraduction : Je suis quelqu'un de responsable et avec une grande envie d'apprendre. J'ai de l'expérience dans le service client et j'aime travailler en équipe. Ce poste m'intéresse parce qu'il correspond à ma formation et que je veux évoluer professionnellement. Je pense que mes points forts sont l'organisation et la communication. Parfois je suis trop perfectionniste, mais j'apprends à mieux gérer mon temps. Dans cinq ans, je me vois avec plus de responsabilités dans cette entreprise. De mon côté, j'aimerais savoir comment se déroule une journée type à ce poste.",
    note: "Une bonne réponse d'entretien est concrète et positive : présente une force appuyée sur un exemple, transforme une faiblesse en effort d'amélioration, et termine par une question qui prouve ton intérêt. Prépare ces réponses à l'avance pour gagner en assurance." }
  ]
};
</script>
