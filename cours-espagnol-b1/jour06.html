var DAY = {

  title: "Le conditionnel composé",
  subtitle: "« J'aurais fait » : exprimer un fait irréel du passé, un regret ou une supposition.",
  theory: `
<h3>1. Le sens du conditionnel composé</h3>
<p>Le conditionnel composé (en espagnol <strong>el condicional compuesto</strong>) traduit le français « <em>j'aurais fait</em> ». Il sert à exprimer :</p>
<pre class="pseudo">- un fait IRRÉEL du passé (qui ne s'est pas produit) :
  Yo habría ido, pero estaba enfermo.
  = J'y serais allé, mais j'étais malade.

- un REGRET ou reproche :
  Deberías haberme llamado.
  = Tu aurais dû m'appeler.

- une SUPPOSITION sur le passé :
  Serían las diez cuando llegó. (probabilité)
  = Il devait être dix heures quand il est arrivé.</pre>
<h3>2. La formation : haber au conditionnel + participe</h3>
<p>Comme le plus-que-parfait, c'est un temps composé. Ici l'auxiliaire <strong>haber est au conditionnel simple</strong>, suivi du participe passé.</p>
<pre class="pseudo">HABER (conditionnel)   + participe passé
habría                   hablado
habrías                  comido
habría                   vivido
habríamos
habríais
habrían

Ej. : Yo habría hablado = j'aurais parlé
      Ellos habrían venido = ils seraient venus</pre>
<div class="tip">Le conditionnel de haber se reconnaît à sa base « habr- » (comme le futur habré) + terminaisons -ía : habría, habrías, habría, habríamos, habríais, habrían. Ne pas confondre avec l'imparfait había (plus-que-parfait).</div>
<h3>3. Había vs habría : le piège à ne pas manquer</h3>
<pre class="pseudo">había + participe  = plus-que-parfait (fait réel antérieur)
  Ya había comido cuando llegaste. = J'avais déjà mangé.

habría + participe = conditionnel composé (fait irréel/hypothétique)
  Habría comido más, pero no tenía hambre. = J'aurais mangé plus...</pre>
<div class="warn">Un seul r change tout ! habÍa (imparfait) = ce qui s'était passé. habRÍa (conditionnel) = ce qui se serait passé (mais ne s'est pas passé).</div>
<h3>4. L'emploi avec le regret : deber / poder</h3>
<p>Deux tournures très fréquentes pour exprimer le reproche ou l'occasion manquée :</p>
<pre class="pseudo">Deberías haber + participe   = tu aurais dû...
  Deberías haber estudiado más. = Tu aurais dû étudier plus.

Podrías haber + participe    = tu aurais pu...
  Podrías haber venido conmigo. = Tu aurais pu venir avec moi.

Habría podido / habría debido... également possibles.</pre>
<h3>5. Aperçu de la phrase hypothétique (irréel du passé)</h3>
<p>Le conditionnel composé apparaît souvent dans les phrases du type « si + plus-que-parfait du subjonctif, conditionnel composé ». Le subjonctif imparfait/plus-que-parfait sera vu plus tard ; pour l'instant, reconnais la structure :</p>
<pre class="pseudo">Si hubiera estudiado, habría aprobado.
= Si j'avais étudié, j'aurais réussi.
(condition irréelle passée -> résultat irréel : conditionnel composé)</pre>
<p>Au B1, l'essentiel est de savoir <strong>former</strong> habría + participe et de reconnaître qu'il exprime quelque chose qui <strong>ne s'est pas réalisé</strong>.</p>`,
  exercises: [
    { type: "qcm", q: "Le conditionnel composé traduit le français :", opts: ["je faisais", "j'avais fait", "j'aurais fait", "je ferai"], a: 2, exp: "Habría hecho = j'aurais fait (fait irréel du passé)." },
    { type: "qcm", q: "Le conditionnel composé se forme avec :", opts: ["haber à l'imparfait + participe", "haber au conditionnel + participe", "ser + participe", "haber au présent + gérondif"], a: 1, exp: "Haber au conditionnel (habría...) + participe passé." },
    { type: "input", q: "Complète : Yo ___ ido a la fiesta, pero estaba enfermo. (haber, conditionnel)", a: ["habría", "habria"], ph: "auxiliaire", exp: "Habría ido : haber au conditionnel (yo)." },
    { type: "input", q: "Participe passé de HACER : Con más tiempo, lo ___ (habría) hecho mejor.", a: ["hecho"], ph: "participe", exp: "Hacer -> hecho : habría hecho = j'aurais fait." },
    { type: "qcm", q: "Quelle est la différence entre había et habría ?", opts: ["aucune", "había = plus-que-parfait (réel), habría = conditionnel composé (irréel)", "había est le futur", "habría est l'imparfait"], a: 1, exp: "Un seul r distingue le réel (había) de l'hypothétique (habría)." },
    { type: "input", q: "« Tu aurais dû étudier » : Deberías ___ estudiado.", a: ["haber"], ph: "auxiliaire", exp: "Deberías haber estudiado : deber au conditionnel + haber + participe." },
    { type: "vf", q: "« Habría venido, pero no pude » exprime un fait qui ne s'est pas réalisé.", a: true, exp: "Vrai : habría venido = je serais venu (mais je n'ai pas pu)." },
    { type: "qcm", q: "Quelle phrase exprime un reproche ?", opts: ["Había comido antes", "Podrías haberme avisado", "Comeré más tarde", "Como todos los días"], a: 1, exp: "Podrías haberme avisado = tu aurais pu me prévenir (reproche)." },
    { type: "input", q: "Conjugue : Nosotros ___ comprado la casa con más dinero. (haber, conditionnel)", a: ["habríamos", "habriamos"], ph: "auxiliaire", exp: "Habríamos comprado : nosotros -> habríamos." },
    { type: "qcm", q: "« Si hubiera estudiado, habría aprobado » : que signifie cette phrase ?", opts: ["Il a étudié et réussi", "Il n'a pas étudié, donc il n'a pas réussi (irréel du passé)", "Il étudiera demain", "Il réussit toujours"], a: 1, exp: "Structure irréelle du passé : la condition ne s'est pas réalisée, ni le résultat." },
    { type: "input", q: "Participe de DECIR : Yo no lo ___ (habría) dicho así. (dit)", a: ["dicho"], ph: "participe", exp: "Decir -> dicho : yo no lo habría dicho." },
    { type: "vf", q: "« Habrían llegado antes con el coche » emploie le conditionnel composé.", a: true, exp: "Habrían + participe = conditionnel composé : ils seraient arrivés plus tôt." },
    { type: "qcm", q: "Comprension : « Yo que tú, habría aceptado el trabajo. » Que conseille-t-on ?", opts: ["de refuser le travail", "à ta place, j'aurais accepté le travail", "de démissionner", "de ne rien faire"], a: 1, exp: "Yo que tú, habría aceptado = à ta place, j'aurais accepté." },
    { type: "input", q: "Complète : Ellos ___ preferido quedarse en casa. (haber, conditionnel, ellos)", a: ["habrían", "habrian"], ph: "auxiliaire", exp: "Habrían preferido : ellos -> habrían." },
    { type: "qcm", q: "Comprension : « Deberías haber llegado a tiempo. » Quel est le ton ?", opts: ["un compliment", "un reproche sur le retard", "une promesse", "une question"], a: 1, exp: "Deberías haber llegado = tu aurais dû arriver à l'heure (reproche)." }
  ],
  final: {
    title: "Exercice final — Arrepentimientos",
    intro: `<p>Pablo reflexiona sobre decisiones que no tomó :</p>
<pre class="pseudo">Ahora pienso que debería haber estudiado idiomas.
Con inglés, habría encontrado un trabajo mejor.
Mis padres me lo dijeron, y yo debería haberles escuchado.
Habríamos viajado más si yo hubiera aprendido a conducir.
Podría haber aceptado aquella oferta en Madrid.
Pero no me arrepiento demasiado : también he tenido suerte.</pre>`,
    questions: [
      { type: "qcm", q: "« Debería haber estudiado idiomas » exprime :", opts: ["une certitude sur le futur", "un regret / ce qu'il aurait dû faire", "une habitude", "un ordre"], a: 1, exp: "Debería haber + participe = regret : il aurait dû étudier les langues." },
      { type: "input", q: "Relève l'auxiliaire : Con inglés, ___ encontrado un trabajo mejor. (haber, conditionnel)", a: ["habría", "habria"], ph: "auxiliaire", exp: "Habría encontrado : conditionnel composé." },
      { type: "qcm", q: "« Podría haber aceptado aquella oferta » signifie :", opts: ["il a accepté l'offre", "il aurait pu accepter l'offre (mais ne l'a pas fait)", "il acceptera l'offre", "il refuse l'offre"], a: 1, exp: "Podría haber aceptado = occasion manquée." },
      { type: "vf", q: "« Habríamos viajado más » emploie le conditionnel composé (nosotros).", a: true, exp: "Habríamos + participe = conditionnel composé : nous aurions voyagé davantage." },
      { type: "input", q: "Complète : Yo debería ___ escuchado a mis padres. (auxiliaire haber)", a: ["haber"], ph: "auxiliaire", exp: "Debería haber escuchado : deber au conditionnel + haber + participe." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Maintenant je pense que j'aurais dû étudier les langues.
Avec l'anglais, j'aurais trouvé un meilleur travail.
Mes parents me l'avaient dit, et j'aurais dû les écouter.
Nous aurions voyagé davantage si j'avais appris à conduire.
J'aurais pu accepter cette offre à Madrid.
Mais je ne regrette pas trop : j'ai aussi eu de la chance.</pre>
<p>Tout le texte joue sur l'irréel du passé : chaque « habría / debería haber / podría haber + participe » évoque une action <strong>non réalisée</strong>. C'est le temps des regrets et des « et si… ».</p>`
  }
};
</script>
