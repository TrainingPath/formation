<script>
var DAY = {
  num: 4,
  title: "L'impératif négatif",
  subtitle: "Dire « ne fais pas ça » : l'impératif négatif emprunte ses formes au subjonctif.",
  theory: `
<h3>1. Une bonne nouvelle : tu connais déjà les formes</h3>
<p>L'impératif sert à donner des ordres, des conseils, des consignes. En espagnol, l'impératif <strong>affirmatif</strong> (« fais-le ») et l'impératif <strong>négatif</strong> (« ne le fais pas ») ne se forment pas de la même façon. Et voici la clé du jour : l'impératif négatif utilise <strong>exactement les formes du subjonctif présent</strong> vues cette semaine. Tu les connais donc déjà !</p>
<pre class="pseudo">Impératif NÉGATIF = no + subjonctif présent
No hables.     = Ne parle pas.
No comas.      = Ne mange pas.
No vengas.     = Ne viens pas.</pre>
<h3>2. Le tableau complet (affirmatif / négatif)</h3>
<p>Comparons pour bien voir la différence. Note que le tú et le vosotros affirmatifs sont particuliers, mais que TOUTES les formes négatives sont du subjonctif.</p>
<pre class="pseudo">HABLAR        Affirmatif       Négatif (= subjonctif)
tú            habla            no hables
usted         hable            no hable
nosotros      hablemos         no hablemos
vosotros      hablad           no habléis
ustedes       hablen           no hablen</pre>
<div class="warn">Piège majeur : au tú, l'affirmatif « habla » n'a pas de -s, mais le négatif « no hables » en prend un (forme subjonctive). De même : come / no comas ; ven / no vengas.</div>
<h3>3. Les verbes irréguliers ? Aucun problème</h3>
<p>Comme l'impératif négatif copie le subjonctif, les verbes irréguliers gardent leur base irrégulière (celle du yo).</p>
<pre class="pseudo">Verbe    Négatif (tú)      Négatif (usted)
hacer    no hagas          no haga
poner    no pongas         no ponga
salir    no salgas         no salga
decir    no digas          no diga
ir       no vayas          no vaya
ser      no seas           no sea
tener    no tengas         no tenga</pre>
<h3>4. La place des pronoms : le grand contraste</h3>
<p>C'est ici que débutants et confirmés se distinguent. La position du pronom (me, te, lo, la, se…) dépend de la forme :</p>
<pre class="pseudo">AFFIRMATIF -> pronom COLLÉ à la fin du verbe
Dímelo.        = Dis-le-moi.
Levántate.     = Lève-toi.
Cómelo.        = Mange-le.

NÉGATIF -> pronom AVANT le verbe (séparé)
No me lo digas. = Ne me le dis pas.
No te levantes. = Ne te lève pas.
No lo comas.    = Ne le mange pas.</pre>
<div class="tip">Règle simple à retenir : à l'affirmatif le pronom se soude derrière (et on ajoute souvent un accent écrit : dímelo, cómelo) ; au négatif, il se place devant, détaché.</div>
<h3>5. Les verbes pronominaux</h3>
<p>Pour un verbe comme levantarse (se lever), acostarse (se coucher), preocuparse (s'inquiéter) :</p>
<pre class="pseudo">No te preocupes.       = Ne t'inquiète pas.
No os acostéis tarde.  = Ne vous couchez pas tard.
No se vaya todavía.    = Ne partez pas encore (usted).</pre>`,
  exercises: [
    { type: "qcm", q: "L'impératif négatif se forme avec :", opts: ["l'infinitif", "no + subjonctif présent", "no + indicatif", "no + futur"], a: 1, exp: "Impératif négatif = no + subjonctif présent." },
    { type: "input", q: "Impératif négatif de HABLAR (tú) : ¡No ___ tan alto! (Ne parle pas si fort !)", a: ["hables"], ph: "verbe", exp: "No hables (forme subjonctive, avec -s au tú)." },
    { type: "qcm", q: "Quelle est la forme correcte de « ne mange pas ça » (tú) ?", opts: ["No come eso", "No comas eso", "No comer eso", "No comes eso"], a: 1, exp: "No comas eso : subjonctif de comer au tú." },
    { type: "input", q: "Impératif négatif de VENIR (tú) : ¡No ___ hoy! (Ne viens pas aujourd'hui !)", a: ["vengas"], ph: "verbe", exp: "Du yo vengo -> subjonctif vengas : no vengas." },
    { type: "qcm", q: "Au négatif, le pronom se place :", opts: ["collé à la fin du verbe", "avant le verbe, détaché", "au milieu du verbe", "il disparaît"], a: 1, exp: "No te levantes : le pronom passe devant le verbe au négatif." },
    { type: "input", q: "Transforme au négatif : « Dímelo » -> No me lo ___ .", a: ["digas"], ph: "verbe", exp: "No me lo digas : pronoms devant + subjonctif digas." },
    { type: "vf", q: "« No hagas eso » est l'impératif négatif correct de hacer (tú).", a: true, exp: "Du yo hago -> subjonctif hagas : no hagas eso." },
    { type: "qcm", q: "Quelle phrase est correcte pour « Ne t'inquiète pas » ?", opts: ["No preocúpate", "No te preocupes", "No te preocupas", "No preocuparte"], a: 1, exp: "Verbe pronominal au négatif : no te preocupes (pronom devant + subjonctif)." },
    { type: "input", q: "Impératif négatif de IR (tú) : ¡No te ___ todavía! (Ne pars pas encore !)", a: ["vayas"], ph: "verbe", exp: "IR irrégulier : no te vayas." },
    { type: "qcm", q: "Différence entre « habla » et « no hables » (tú) :", opts: ["aucune", "l'affirmatif n'a pas de -s, le négatif en prend un", "les deux sont négatifs", "les deux ont un -s"], a: 1, exp: "Affirmatif habla (sans -s) ; négatif no hables (subjonctif, avec -s)." },
    { type: "input", q: "Transforme au négatif : « Levántate » -> No te ___ .", a: ["levantes"], ph: "verbe", exp: "No te levantes : pronom devant + subjonctif." },
    { type: "vf", q: "À l'affirmatif, le pronom se colle à la fin du verbe (cómelo, dímelo).", a: true, exp: "Vrai : à l'affirmatif le pronom se soude, souvent avec accent écrit." },
    { type: "qcm", q: "Comprension : « No se preocupe, señora. » À qui s'adresse-t-on et comment ?", opts: ["à un ami, familier", "à usted, poli", "à un groupe", "à personne"], a: 1, exp: "No se preocupe = forme usted (polie) : ne vous inquiétez pas." },
    { type: "input", q: "Impératif négatif de SER (tú) : ¡No ___ tan tímido! (Ne sois pas si timide !)", a: ["seas"], ph: "verbe", exp: "SER irrégulier au subjonctif : no seas." },
    { type: "qcm", q: "Comprension : « No me lo digas ahora. » Que demande le locuteur ?", opts: ["de le lui dire vite", "de ne pas le lui dire maintenant", "de crier", "de partir"], a: 1, exp: "No me lo digas ahora = ne me le dis pas maintenant." }
  ],
  final: {
    title: "Exercice final — Consejos de un entrenador",
    intro: `<p>Un entrenador da instrucciones a un jugador joven antes del partido :</p>
<pre class="pseudo">Escúchame bien.
No te pongas nervioso y no pienses en el resultado.
No corras sin control : juega con la cabeza.
No le pases el balón al portero sin mirar.
No hables con el árbitro, concéntrate en jugar.
Y sobre todo, no tengas miedo de fallar.</pre>`,
    questions: [
      { type: "qcm", q: "« No te pongas nervioso » est l'impératif négatif de :", opts: ["poner (ponerse)", "pensar", "poder", "pasar"], a: 0, exp: "Ponerse -> del yo pongo -> no te pongas nervioso." },
      { type: "input", q: "Relève l'impératif négatif de PENSAR (tú) dans le texte : no ___ en el resultado.", a: ["pienses"], ph: "verbe", exp: "Pensar -> piens- (diphtongue) -> no pienses." },
      { type: "qcm", q: "« No hables con el árbitro » : pourquoi hables et non habla ?", opts: ["c'est une faute", "l'impératif négatif utilise la forme subjonctive (avec -s)", "c'est au pluriel", "c'est un infinitif"], a: 1, exp: "Impératif négatif = no + subjonctif : no hables." },
      { type: "vf", q: "« No tengas miedo » signifie « n'aie pas peur ».", a: true, exp: "Tener -> tengas : no tengas miedo = n'aie pas peur." },
      { type: "input", q: "Complète : No ___ (correr, tú) sin control.", a: ["corras"], ph: "verbe", exp: "Correr -> subjonctif corras : no corras." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Écoute-moi bien.
Ne deviens pas nerveux et ne pense pas au résultat.
Ne cours pas sans contrôle : joue avec la tête.
Ne passe pas le ballon au gardien sans regarder.
Ne parle pas avec l'arbitre, concentre-toi sur le jeu.
Et surtout, n'aie pas peur de te tromper.</pre>
<p>Remarque le contraste avec l'affirmatif : <strong>escúchame</strong> et <strong>concéntrate</strong> collent le pronom à la fin, tandis que tous les ordres négatifs (<strong>no te pongas, no le pases</strong>) placent le pronom devant et utilisent la forme du subjonctif.</p>`
  }
};
</script>

    hints: [

    solution: "En la biblioteca, no hables en voz alta. No comas ni bebas cerca de los libros. No pongas los pies en las sillas. No uses el móvil sin silenciarlo. No te lleves los libros sin registrarlos. Y por favor, no dejes basura en las mesas.\n\nTraduction : À la bibliothèque, ne parle pas à voix haute. Ne mange pas et ne bois pas près des livres. Ne mets pas les pieds sur les chaises. N'utilise pas ton portable sans le mettre en silencieux. N'emporte pas les livres sans les enregistrer. Et s'il te plaît, ne laisse pas de déchets sur les tables.",

  ]
};
