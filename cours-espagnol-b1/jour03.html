<script>
var DAY = {
  num: 3,
  title: "Le subjonctif : doute et opinion",
  subtitle: "Douter, nier, ne pas penser : quand l'incertitude bascule vers le subjonctif.",
  theory: `
<h3>1. Le subjonctif du doute</h3>
<p>Troisième grand emploi du subjonctif : l'<strong>incertitude</strong>. Quand on doute, quand on nie, quand on n'est pas sûr, la subordonnée passe au subjonctif. À l'inverse, quand on affirme une certitude, on garde l'<strong>indicatif</strong>. Tout se joue sur ce contraste : certitude = indicatif, doute = subjonctif.</p>
<pre class="pseudo">DOUTE / NÉGATION -> subjonctif
Dudo que venga.        = Je doute qu'il vienne.
No creo que sea verdad. = Je ne crois pas que ce soit vrai.

CERTITUDE -> indicatif
Creo que viene.        = Je crois qu'il vient.
Es verdad que es así.  = C'est vrai que c'est ainsi.</pre>
<h3>2. Les verbes de doute (toujours subjonctif)</h3>
<pre class="pseudo">dudar que          = douter que       Dudo que llegue hoy.
no estar seguro de que = ne pas être sûr No estoy seguro de que sea él.
es posible que     = il est possible   Es posible que llueva.
es probable que    = il est probable   Es probable que gane.
puede que          = il se peut que    Puede que tengas razón.</pre>
<div class="tip">Es posible que et puede que expriment une simple possibilité : toujours le subjonctif. Es posible que venga = il est possible qu'il vienne.</div>
<h3>3. Le grand basculement : creer / pensar</h3>
<p>Les verbes d'opinion (creer, pensar, parecer) suivent une règle en miroir. À la <strong>forme affirmative</strong>, ils expriment une certitude -> indicatif. À la <strong>forme négative</strong>, ils expriment un doute -> subjonctif.</p>
<pre class="pseudo">AFFIRMATIF (certitude) -> INDICATIF
Creo que tiene razón.       = Je crois qu'il a raison.
Pienso que es buena idea.   = Je pense que c'est une bonne idée.

NÉGATIF (doute) -> SUBJONCTIF
No creo que tenga razón.    = Je ne crois pas qu'il ait raison.
No pienso que sea buena idea. = Je ne pense pas que ce soit une bonne idée.</pre>
<div class="warn">Attention : c'est exactement l'inverse d'une intuition française. « No creo que » n'est PAS suivi de l'indicatif comme en français, mais du subjonctif, parce que la négation introduit le doute.</div>
<h3>4. Les expressions de certitude (indicatif)</h3>
<p>Elles affirment un fait : on reste à l'indicatif. Mais dès qu'on les nie, elles basculent au subjonctif.</p>
<pre class="pseudo">es verdad que + indicatif      -> No es verdad que + subjonctif
es evidente que + indicatif    -> No es evidente que + subjonctif
está claro que + indicatif     -> No está claro que + subjonctif
es seguro que + indicatif      -> No es seguro que + subjonctif

Es evidente que trabaja mucho.      (fait -> indicatif)
No es evidente que trabaje mucho.   (doute -> subjonctif)</pre>
<h3>5. Quizás, tal vez, probablemente</h3>
<p>Ces adverbes de probabilité admettent souvent le subjonctif quand le doute est fort : <em>Quizás venga mañana</em> (Peut-être viendra-t-il demain). Avec l'indicatif, la probabilité est perçue comme plus forte. Au niveau B1, retiens : quizás / tal vez + subjonctif exprime un doute réel.</p>`,
  exercises: [
    { type: "qcm", q: "Après « dudo que » (je doute que), on emploie :", opts: ["l'indicatif", "le subjonctif", "l'infinitif", "le futur"], a: 1, exp: "Le doute déclenche le subjonctif : dudo que venga." },
    { type: "input", q: "No creo que ___ (ser) verdad. (Je ne crois pas que ce soit vrai.)", a: ["sea"], ph: "verbe", exp: "No creer que = doute -> subjonctif : sea." },
    { type: "qcm", q: "« Creo que » à la forme AFFIRMATIVE est suivi de :", opts: ["le subjonctif", "l'indicatif", "l'infinitif", "rien"], a: 1, exp: "Creo que (certitude) -> indicatif : creo que viene." },
    { type: "input", q: "Es posible que ___ (llover) esta tarde.", a: ["llueva"], ph: "verbe", exp: "Es posible que + subjonctif : llover -> llueva (diphtongue)." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["No creo que tiene razón", "No creo que tenga razón", "Creo que tenga razón", "Dudo que tiene razón"], a: 1, exp: "No creo que + subjonctif : no creo que tenga razón." },
    { type: "input", q: "Puede que (nosotros) ___ (llegar) tarde.", a: ["lleguemos"], ph: "verbe", exp: "Puede que + subjonctif : llegar -> lleguemos." },
    { type: "vf", q: "« No es verdad que » est suivi du subjonctif.", a: true, exp: "La négation d'une certitude introduit le doute -> subjonctif : no es verdad que sea." },
    { type: "qcm", q: "« Es evidente que trabaja mucho » : pourquoi l'indicatif (trabaja) ?", opts: ["parce que c'est un doute", "parce que es evidente affirme une certitude", "parce que c'est négatif", "par erreur"], a: 1, exp: "Es evidente que (certitude affirmée) -> indicatif." },
    { type: "input", q: "No pienso que esta película ___ (ser) buena.", a: ["sea"], ph: "verbe", exp: "No pensar que = doute -> subjonctif : sea." },
    { type: "qcm", q: "« Pienso que es buena idea » exprime :", opts: ["un doute -> subjonctif", "une certitude -> indicatif", "un ordre", "une émotion"], a: 1, exp: "Affirmatif (pienso que) = certitude -> indicatif : es." },
    { type: "input", q: "Dudo que él ___ (tener) razón.", a: ["tenga"], ph: "verbe", exp: "Dudar que + subjonctif : tener -> tenga." },
    { type: "vf", q: "« No estoy seguro de que » entraîne l'indicatif.", a: false, exp: "Faux : ne pas être sûr = doute -> subjonctif (no estoy seguro de que sea)." },
    { type: "qcm", q: "Comprension : « Quizás llueva mañana. » Que suggère l'emploi du subjonctif ?", opts: ["une certitude absolue", "un doute réel sur la pluie", "une interdiction", "un ordre"], a: 1, exp: "Quizás + subjonctif marque une possibilité incertaine." },
    { type: "input", q: "Complète (certitude, indicatif) : Estoy seguro de que ella ___ (venir) hoy.", a: ["viene"], ph: "verbe", exp: "Estar seguro de que (certitude) -> indicatif : viene." },
    { type: "qcm", q: "Comprension : « No creo que sepa la respuesta. » Que pense la personne ?", opts: ["Elle est sûre qu'il sait", "Elle doute qu'il sache la réponse", "Elle veut qu'il sache", "Elle interdit de savoir"], a: 1, exp: "No creer que + subjonctif (sepa) = doute sur sa connaissance." }
  ],
  final: {
    title: "Exercice final — Discusión entre amigos",
    intro: `<p>Dos amigos hablan del futuro de su equipo de fútbol :</p>
<pre class="pseudo">— Creo que este año ganamos la liga.
— Pues yo dudo que ganemos, el equipo no está bien.
— No es verdad que juguemos mal, hemos mejorado mucho.
— Puede que tengas razón, pero no estoy seguro de que sea suficiente.
— Es posible que fichemos a un buen jugador en enero.
— Ojalá, pero no creo que el club tenga dinero.</pre>`,
    questions: [
      { type: "qcm", q: "« Creo que este año ganamos » : pourquoi ganamos (indicatif) ?", opts: ["c'est un doute", "creo que affirmatif = certitude -> indicatif", "c'est un ordre", "erreur du locuteur"], a: 1, exp: "Creo que à l'affirmatif exprime une certitude -> indicatif." },
      { type: "input", q: "Relève le subjonctif après « yo dudo que ___ ».", a: ["ganemos"], ph: "verbe", exp: "Dudar que + subjonctif : ganemos." },
      { type: "qcm", q: "« No es verdad que juguemos mal » emploie le subjonctif parce que :", opts: ["c'est une certitude", "c'est la négation d'une vérité -> doute", "c'est un souhait", "c'est un ordre"], a: 1, exp: "No es verdad que + subjonctif (juguemos)." },
      { type: "vf", q: "« No creo que el club tenga dinero » exprime un doute.", a: true, exp: "No creer que + subjonctif = doute sur les moyens du club." },
      { type: "input", q: "Complète : Es posible que ___ (fichar, nosotros) a un jugador.", a: ["fichemos"], ph: "verbe", exp: "Es posible que + subjonctif : fichar -> fichemos." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">— Je crois que cette année on gagne le championnat.
— Eh bien moi je doute qu'on gagne, l'équipe ne va pas bien.
— Ce n'est pas vrai qu'on joue mal, on a beaucoup progressé.
— Tu as peut-être raison, mais je ne suis pas sûr que ce soit suffisant.
— Il est possible qu'on recrute un bon joueur en janvier.
— Pourvu que oui, mais je ne crois pas que le club ait de l'argent.</pre>
<p>Observe le balancement : <strong>creo que ganamos</strong> (certitude, indicatif) contre <strong>dudo que ganemos</strong> et <strong>no creo que tenga</strong> (doute, subjonctif). Le même verbe change de mode selon qu'on affirme ou qu'on doute.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en espagnol…",
  items: [
  { id: "es-b1-j03", title: "Ton avis sur une prédiction", level: 3,
    statement: "Donne ton opinion sur une prédiction (le climat, la technologie, ton équipe favorite, l'avenir…). Écris 5 à 6 phrases opposant certitudes (creo que + indicatif) et doutes (no creo que / dudo que / es posible que + subjonctif).",
    hints: [
      "Alterne certitude et doute : Creo que… (indicatif) / No creo que… (subjonctif).",
      "Utilise dudo que, es posible que, puede que + subjonctif.",
      "Forme bien le subjonctif : sea, tenga, pueda, haya, cambie."
    ],
    solution: "Creo que la tecnología cambia nuestra vida muy deprisa. Sin embargo, no creo que las máquinas sustituyan a las personas por completo. Es posible que en el futuro trabajemos menos horas. Dudo que todos los coches sean eléctricos dentro de diez años. Puede que tengas otra opinión, y lo respeto. Estoy seguro de que este debate va a continuar.\n\nTraduction : Je crois que la technologie change notre vie très vite. Cependant, je ne crois pas que les machines remplacent complètement les gens. Il est possible qu'à l'avenir nous travaillions moins d'heures. Je doute que toutes les voitures soient électriques d'ici dix ans. Il se peut que tu aies un autre avis, et je le respecte. Je suis sûr que ce débat va continuer.",
    note: "Le pivot de la leçon : le même verbe d'opinion donne l'indicatif à l'affirmatif (creo que cambia) et le subjonctif au négatif (no creo que sustituyan). Vérifie toujours si tu affirmes ou si tu doutes." }
  ]
};
</script>
