<script>
var DAY = {

  title: "Bilan B1 : entretien d'embauche simulé",
  subtitle: "Comprendre et mener un entretien d'embauche en espagnol.",
  theory: `
<h3>1. Le cadre de l'entretien</h3>
<p>Un entretien d'embauche (una entrevista de trabajo) suit toujours des étapes : présentation, parcours, motivations, qualités et défauts, questions du candidat. On y emploie <strong>usted</strong> (vouvoiement) et un registre soigné.</p>
<h3>2. Le vocabulaire clé</h3>
<pre class="pseudo">el puesto / el cargo   = le poste
la empresa             = l'entreprise
el sueldo / el salario = le salaire
la experiencia         = l'expérience
las prácticas          = le stage
un contrato            = un contrat
la jornada completa    = le temps plein
disponible             = disponible
incorporarse           = prendre son poste / intégrer</pre>
<h3>3. Dialogue complet d'un entretien</h3>
<pre class="pseudo">ENTREVISTADORA: Buenos días. Siéntese, por favor.
CANDIDATO: Buenos días. Muchas gracias por recibirme.

ENTREVISTADORA: Para empezar, ¿podría hablarme un poco de usted?
CANDIDATO: Claro. Me llamo Javier Morales, tengo veintiséis años
y soy graduado en Administración de Empresas.

ENTREVISTADORA: ¿Qué experiencia tiene en este sector?
CANDIDATO: He trabajado dos años en una empresa de logística.
Además, hice unas prácticas en el departamento de ventas.

ENTREVISTADORA: ¿Por qué quiere trabajar con nosotros?
CANDIDATO: Porque admiro su empresa y creo que aquí podría
seguir aprendiendo. Me interesa mucho este puesto.

ENTREVISTADORA: ¿Cuáles son sus puntos fuertes?
CANDIDATO: Soy organizado, responsable y trabajo bien en equipo.

ENTREVISTADORA: ¿Y algún punto débil?
CANDIDATO: A veces soy demasiado perfeccionista,
pero estoy aprendiendo a gestionar mejor mi tiempo.

ENTREVISTADORA: ¿Estaría disponible para incorporarse pronto?
CANDIDATO: Sí, podría empezar el mes que viene.

ENTREVISTADORA: ¿Tiene alguna pregunta?
CANDIDATO: Sí, ¿cómo sería un día típico en este puesto?

ENTREVISTADORA: Buena pregunta. Le contaremos los detalles pronto.
Gracias por venir. Le llamaremos la próxima semana.
CANDIDATO: Muchas gracias a usted. Ha sido un placer.</pre>
<div class="tip">Astuce : au conditionnel (podría, sería, estaría), le candidat reste poli et prudent. « Podría empezar » sonne mieux que « puedo empezar ».</div>
<h3>4. Phrases utiles à réutiliser</h3>
<pre class="pseudo">Me interesa mucho este puesto.   = Ce poste m'intéresse beaucoup.
Creo que encajo bien en el perfil. = Je pense correspondre au profil.
Estoy dispuesto/a a aprender.    = Je suis prêt(e) à apprendre.
¿Cuáles serían mis funciones?    = Quelles seraient mes fonctions ?
Gracias por su tiempo.           = Merci pour votre temps.</pre>
<div class="warn">Attention au vouvoiement : on dit « ¿Podría hablarme…? » (3e pers.), pas « ¿Podrías…? ». Toute la conversation reste au usted.</div>`,
  exercises: [
    { type: "qcm", q: "Quel registre emploie-t-on dans un entretien d'embauche ?", opts: ["tutoiement (tú)", "vouvoiement (usted)", "argot", "pluriel familier"], a: 1, exp: "On vouvoie : usted, registre soigné." },
    { type: "input", q: "Traduis « le poste » : el ___.", a: ["puesto", "cargo"], ph: "mot", exp: "El puesto / el cargo = le poste." },
    { type: "qcm", q: "Quel âge a le candidat Javier ?", opts: ["22 ans", "26 ans", "30 ans", "40 ans"], a: 1, exp: "Tengo veintiséis años = 26 ans." },
    { type: "vf", q: "Le candidat a travaillé deux ans dans une entreprise de logistique.", a: true, exp: "He trabajado dos años en una empresa de logística." },
    { type: "input", q: "Complète : « Me interesa mucho este ___. » (poste)", a: ["puesto"], ph: "mot", exp: "Me interesa mucho este puesto." },
    { type: "qcm", q: "Quel est le point faible avoué par le candidat ?", opts: ["il est paresseux", "il est trop perfectionniste", "il arrive en retard", "il ne parle pas anglais"], a: 1, exp: "A veces soy demasiado perfeccionista." },
    { type: "vf", q: "Le candidat pourrait commencer le mois suivant.", a: true, exp: "Podría empezar el mes que viene." },
    { type: "qcm", q: "Pourquoi le candidat veut-il ce poste ?", opts: ["pour le salaire uniquement", "il admire l'entreprise et veut continuer à apprendre", "il n'a pas le choix", "pour voyager"], a: 1, exp: "Admiro su empresa y creo que aquí podría seguir aprendiendo." },
    { type: "input", q: "Traduis « disponible » : ___.", a: ["disponible"], ph: "adjectif", exp: "Disponible = disponible." },
    { type: "qcm", q: "Quelle question pose le candidat à la fin ?", opts: ["quel est le salaire", "comment serait un jour typique au poste", "où sont les toilettes", "aucune"], a: 1, exp: "¿Cómo sería un día típico en este puesto?" },
    { type: "vf", q: "« ¿Podría hablarme de usted? » est au vouvoiement.", a: true, exp: "Vrai : podría + usted (3e pers.)." },
    { type: "input", q: "Complète (qualité) : « Trabajo bien en ___. » (équipe)", a: ["equipo"], ph: "mot", exp: "Trabajo bien en equipo." },

    { type: "qcm", q: "Compréhension : comment se termine l'entretien ?", opts: ["il est embauché sur-le-champ", "on le rappellera la semaine suivante", "il est refusé", "il repart fâché"], a: 1, exp: "Le llamaremos la próxima semana." },
    { type: "input", q: "Traduis « Merci pour votre temps » : Gracias por su ___.", a: ["tiempo"], ph: "mot", exp: "Gracias por su tiempo." }
  ],
  final: {
    title: "Exercice final — Otra entrevista",
    intro: `<p>Lis cet extrait d'un autre entretien et réponds :</p>
<pre class="pseudo">ENTREVISTADOR: ¿Por qué dejó su anterior trabajo?
CANDIDATA: Lo dejé porque buscaba nuevos retos profesionales.
ENTREVISTADOR: ¿Cómo se describiría en tres palabras?
CANDIDATA: Diría que soy creativa, constante y comunicativa.
ENTREVISTADOR: Este puesto exige viajar a menudo. ¿Le importaría?
CANDIDATA: En absoluto, me encanta viajar y conocer clientes nuevos.
ENTREVISTADOR: ¿Cuáles son sus expectativas salariales?
CANDIDATA: Me gustaría un sueldo acorde con mi experiencia,
pero estoy abierta a negociar.
ENTREVISTADOR: Perfecto. Le agradezco su tiempo.
CANDIDATA: Gracias a usted. Espero tener noticias suyas pronto.</pre>`,
    questions: [
      { type: "qcm", q: "Pourquoi la candidate a-t-elle quitté son emploi précédent ?", opts: ["elle a été licenciée", "elle cherchait de nouveaux défis professionnels", "elle n'aimait pas ses collègues", "pour déménager"], a: 1, exp: "Buscaba nuevos retos profesionales." },
      { type: "input", q: "Cite un des trois adjectifs par lesquels elle se décrit.", a: ["creativa", "constante", "comunicativa"], ph: "adjectif", exp: "Soy creativa, constante y comunicativa." },
      { type: "qcm", q: "Le poste exige de voyager souvent. Comment réagit-elle ?", opts: ["cela la dérange", "cela ne la dérange pas du tout, elle aime voyager", "elle refuse", "elle hésite"], a: 1, exp: "En absoluto, me encanta viajar." },
      { type: "vf", q: "Concernant le salaire, elle est ouverte à négocier.", a: true, exp: "Estoy abierta a negociar." },
      { type: "qcm", q: "Comment la candidate conclut-elle ?", opts: ["elle part sans un mot", "elle remercie et espère avoir des nouvelles bientôt", "elle demande le poste tout de suite", "elle critique l'entreprise"], a: 1, exp: "Gracias a usted. Espero tener noticias suyas pronto." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">RECRUTEUR : Pourquoi avez-vous quitté votre emploi précédent ?
CANDIDATE : Je l'ai quitté parce que je cherchais de nouveaux défis professionnels.
RECRUTEUR : Comment vous décririez-vous en trois mots ?
CANDIDATE : Je dirais que je suis créative, persévérante et communicative.
RECRUTEUR : Ce poste exige de voyager souvent. Cela vous dérangerait ?
CANDIDATE : Pas du tout, j'adore voyager et rencontrer de nouveaux clients.
RECRUTEUR : Quelles sont vos prétentions salariales ?
CANDIDATE : J'aimerais un salaire en accord avec mon expérience,
mais je suis ouverte à négocier.
RECRUTEUR : Parfait. Je vous remercie de votre temps.
CANDIDATE : Merci à vous. J'espère avoir de vos nouvelles bientôt.</pre>
<p>Note les tournures polies au conditionnel (se describiría, le importaría, me gustaría) et le vouvoiement constant. Prépare tes propres réponses à ces questions classiques.</p>`
  }
};
</script>
