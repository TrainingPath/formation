<script>
var DAY = {
  num: 2,
  title: "Le subjonctif : volonté et émotion",
  subtitle: "Vouloir, demander, espérer, aimer, regretter : quand la subjectivité déclenche le subjonctif.",
  theory: `
<h3>1. Un principe simple</h3>
<p>Hier, on a appris à former le subjonctif. Aujourd'hui, on découvre son premier grand emploi. La règle est nette : quand un sujet <strong>agit sur la volonté ou les sentiments d'un autre sujet</strong>, le verbe de la subordonnée passe au subjonctif. Autrement dit : dès qu'un verbe exprime un <strong>souhait, un ordre, un besoin, une émotion</strong> et qu'il y a <strong>deux sujets différents</strong>, on emploie « que + subjonctif ».</p>
<pre class="pseudo">SUJET 1 + verbe de volonté/émotion + QUE + SUJET 2 + SUBJONCTIF
(Yo) quiero        que    (tú) estudies.
= Je veux que tu étudies.</pre>
<h3>2. Les verbes de volonté et d'influence</h3>
<p>Ils expriment qu'on veut que quelqu'un fasse quelque chose : vouloir, demander, ordonner, interdire, conseiller, permettre, empêcher…</p>
<pre class="pseudo">querer que        = vouloir que      Quiero que vengas.
pedir que         = demander que     Te pido que me ayudes.
esperar que       = espérer que      Espero que llegues pronto.
necesitar que     = avoir besoin que Necesito que me llames.
aconsejar que     = conseiller que   Te aconsejo que descanses.
prohibir que      = interdire que    Prohíben que fumemos aquí.
permitir que      = permettre que    No permite que salgamos.</pre>
<p>Exemple : <em>El profesor quiere que hagamos los ejercicios</em> (Le professeur veut que nous fassions les exercices).</p>
<h3>3. Les verbes et expressions d'émotion</h3>
<p>La joie, la peur, la tristesse, la surprise, le regret… tout sentiment porté sur l'action d'un autre entraîne le subjonctif.</p>
<pre class="pseudo">alegrarse de que   = se réjouir que   Me alegro de que estés aquí.
gustar que         = aimer que        Me gusta que cocines.
molestar que       = déranger que     Me molesta que llegues tarde.
temer / tener miedo de que = craindre  Temo que no venga.
sentir que         = regretter que    Siento que estés triste.
es una pena que    = c'est dommage    Es una pena que no puedas venir.</pre>
<div class="tip">Beaucoup de ces expressions sont impersonnelles : es una pena que, es una lástima que, es genial que, es triste que… Toutes sont suivies du subjonctif car elles portent un jugement affectif.</div>
<h3>4. Le piège du même sujet : infinitif, pas subjonctif !</h3>
<p>La condition absolue, c'est <strong>deux sujets différents</strong>. Si le sujet est le même dans les deux parties, on n'emploie ni que ni subjonctif : on met simplement l'<strong>infinitif</strong>.</p>
<pre class="pseudo">DEUX sujets      -> que + subjonctif
Quiero que (tú) vengas.        = Je veux que tu viennes.

UN SEUL sujet    -> infinitif
Quiero venir.                  = Je veux venir. (moi -> moi)
Espero aprobar.                = J'espère réussir. (moi -> moi)</pre>
<div class="warn">Erreur classique du francophone : dire « quiero que venir » ou « quiero venga ». Souviens-toi : même sujet = infinitif sans que ; sujets différents = que + subjonctif.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle condition déclenche « que + subjonctif » après un verbe de volonté ?", opts: ["un seul sujet", "deux sujets différents", "un verbe au futur", "une question"], a: 1, exp: "Deux sujets différents = que + subjonctif ; même sujet = infinitif." },
    { type: "input", q: "Quiero que tú me ___ (ayudar). (Je veux que tu m'aides.)", a: ["ayudes"], ph: "verbe", exp: "Ayudar -> ayud- + es = ayudes." },
    { type: "qcm", q: "Même sujet des deux côtés. Comment traduire « Je veux venir » ?", opts: ["Quiero que venga", "Quiero venir", "Quiero que venir", "Quiero vengo"], a: 1, exp: "Même sujet = infinitif : quiero venir (sans que)." },
    { type: "input", q: "Espero que ___ (llegar, vosotros) a tiempo.", a: ["lleguéis", "llegueis"], ph: "verbe", exp: "Llegar -> llegu- + éis = lleguéis (u pour garder le son [g])." },
    { type: "qcm", q: "« Me alegro de que estés aquí » exprime :", opts: ["un ordre", "une émotion (la joie)", "un fait certain", "une question"], a: 1, exp: "Alegrarse de que = se réjouir que -> émotion -> subjonctif." },
    { type: "input", q: "Te pido que me ___ (llamar) esta noche.", a: ["llames"], ph: "verbe", exp: "Pedir que + subjonctif : llamar -> llames." },
    { type: "vf", q: "Après « es una pena que » on emploie le subjonctif.", a: true, exp: "Expression d'émotion impersonnelle : es una pena que + subjonctif." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Quiero que estudiar más", "Necesito que me ayudas", "Espero aprobar el examen", "Me gusta que cocinar"], a: 2, exp: "Même sujet -> infinitif : espero aprobar. Les autres mélangent mal que/subjonctif." },
    { type: "input", q: "Me molesta que la gente ___ (llegar) tarde.", a: ["llegue"], ph: "verbe", exp: "Molestar que + subjonctif : llegar -> llegue." },
    { type: "qcm", q: "« El médico me aconseja que… » doit être suivi de :", opts: ["l'indicatif", "le subjonctif", "l'infinitif", "le futur"], a: 1, exp: "Aconsejar que (conseil/influence) -> subjonctif : que descanses." },
    { type: "input", q: "Siento que (tú) ___ (estar) enfermo. (Je regrette que tu sois malade.)", a: ["estés", "estes"], ph: "verbe", exp: "Sentir que (regret) + subjonctif : estar -> esté(s)." },
    { type: "vf", q: "« Espero aprobar » et « Espero que apruebes » ont le même sujet.", a: false, exp: "Faux : espero aprobar = même sujet (moi). Espero que apruebes = deux sujets (moi/toi)." },
    { type: "qcm", q: "Comprension : « Mis padres no permiten que salga por la noche. » Que veut dire cette phrase ?", opts: ["Mes parents sortent la nuit", "Mes parents ne me permettent pas de sortir la nuit", "Je permets à mes parents de sortir", "Mes parents veulent sortir"], a: 1, exp: "No permiten que salga : ils n'autorisent pas que je sorte." },
    { type: "input", q: "Nos alegramos de que ___ (venir, vosotros) a la boda.", a: ["vengáis", "vengais"], ph: "verbe", exp: "Venir -> veng- (du yo vengo) + áis = vengáis." },
    { type: "qcm", q: "Comprension : « Tengo miedo de que no llegue el tren a tiempo. » L'émotion exprimée est :", opts: ["la joie", "la peur", "la colère", "la surprise"], a: 1, exp: "Tener miedo de que = avoir peur que -> subjonctif (llegue)." }
  ],
  final: {
    title: "Exercice final — La carta de una madre",
    intro: `<p>Una madre escribe a su hijo que estudia en el extranjero :</p>
<pre class="pseudo">Querido hijo :
Espero que estés bien y que comas de forma sana.
Quiero que estudies mucho, pero también que descanses.
Me alegro de que tengas buenos amigos allí.
Te pido que me llames los domingos.
Tengo miedo de que trabajes demasiado.
Es una pena que no puedas venir en Navidad, pero lo entiendo.
Un abrazo, mamá.</pre>`,
    questions: [
      { type: "qcm", q: "« Espero que estés bien » exprime :", opts: ["un ordre strict", "un souhait / espoir", "une certitude", "une interdiction"], a: 1, exp: "Esperar que + subjonctif : la mère espère que son fils va bien." },
      { type: "input", q: "Relève le subjonctif employé après « Te pido que me ___ los domingos ».", a: ["llames"], ph: "verbe", exp: "Pedir que + subjonctif : llames." },
      { type: "qcm", q: "« Me alegro de que tengas buenos amigos » exprime :", opts: ["la peur", "la joie", "le doute", "la colère"], a: 1, exp: "Alegrarse de que = se réjouir -> émotion positive." },
      { type: "vf", q: "« Tengo miedo de que trabajes demasiado » exprime une inquiétude.", a: true, exp: "Tener miedo de que + subjonctif : la mère craint qu'il travaille trop." },
      { type: "input", q: "Complète : Es una pena que no ___ (poder) venir en Navidad.", a: ["puedas"], ph: "verbe", exp: "Poder -> puedas (diphtongue conservée à la 2e personne)." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Cher fils,
J'espère que tu vas bien et que tu manges sainement.
Je veux que tu étudies beaucoup, mais aussi que tu te reposes.
Je me réjouis que tu aies de bons amis là-bas.
Je te demande de m'appeler le dimanche.
J'ai peur que tu travailles trop.
C'est dommage que tu ne puisses pas venir à Noël, mais je comprends.
Une accolade, maman.</pre>
<p>Chaque subordonnée après que est au subjonctif parce que la mère exprime des <strong>souhaits</strong> (espero que, quiero que), des <strong>émotions</strong> (me alegro de que, tengo miedo de que, es una pena que) ou une <strong>demande</strong> (te pido que). C'est le coeur de l'emploi d'aujourd'hui.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {

  { id: "es-b1-j02", title: "Un message d'encouragement", level: 2,
    statement: "Un(e) ami(e) commence un nouveau travail ou passe un examen important. Écris-lui 5 à 6 phrases mêlant souhaits et émotions : « Espero que… / Quiero que… / Me alegro de que… / Tengo miedo de que… » + subjonctif.",
    hints: [
      "Utilise des verbes de volonté (quiero que, te pido que) et d'émotion (me alegro de que, siento que).",

      "Forme bien le subjonctif : tengas, salga, estés, puedas, hagas."
    ],
    solution: "Me alegro mucho de que empieces este nuevo trabajo. Espero que todo te vaya bien y que estés tranquilo. Quiero que sepas que confío en ti. Te pido que no tengas miedo y que descanses la noche anterior. Tengo miedo de que trabajes demasiado, así que cuídate. Ojalá seas muy feliz en esta nueva etapa.\n\nTraduction : Je me réjouis beaucoup que tu commences ce nouveau travail. J'espère que tout se passera bien et que tu seras tranquille. Je veux que tu saches que j'ai confiance en toi. Je te demande de ne pas avoir peur et de te reposer la veille. J'ai peur que tu travailles trop, alors prends soin de toi. Pourvu que tu sois très heureux dans cette nouvelle étape.",
    note: "Remarque « quiero que sepas » (deux sujets, subjonctif) face à un éventuel « quiero ayudarte » (même sujet, infinitif). Choisir entre subjonctif et infinitif selon le sujet est le réflexe clé de cette leçon." }
  ]
};
</script>
