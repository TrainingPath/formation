<script>
var DAY = {
  num: 5,
  title: "Le plus-que-parfait",
  subtitle: "Le passé du passé : dire ce qui s'était déjà produit avant un autre moment passé.",
  theory: `
<h3>1. À quoi sert le plus-que-parfait ?</h3>
<p>Le plus-que-parfait (en espagnol <strong>el pretérito pluscuamperfecto</strong>) exprime une action <strong>antérieure à une autre action passée</strong>. C'est le « passé du passé ». Quand on raconte au passé et qu'on veut préciser qu'un fait s'était produit <em>avant</em>, on l'emploie.</p>
<pre class="pseudo">Cuando llegué, la película ya había empezado.
= Quand je suis arrivé, le film avait déjà commencé.

(llegué = action passée ; había empezado = action ANTÉRIEURE à celle-là)</pre>
<h3>2. La formation : haber à l'imparfait + participe passé</h3>
<p>C'est un temps composé, très régulier. On prend l'auxiliaire <strong>haber conjugué à l'imparfait</strong> et on ajoute le <strong>participe passé</strong> du verbe.</p>
<pre class="pseudo">HABER (imparfait)     + participe passé
había                   hablado
habías                  comido
había                   vivido
habíamos
habíais
habían

Ej. : Yo había hablado = j'avais parlé
      Tú habías comido = tu avais mangé</pre>
<h3>3. Le participe passé (rappel)</h3>
<pre class="pseudo">Verbes en -AR  -> -ADO   hablar -> hablado
Verbes en -ER  -> -IDO   comer  -> comido
Verbes en -IR  -> -IDO   vivir  -> vivido</pre>
<div class="warn">Participes irréguliers fréquents à connaître : hacer -> hecho ; decir -> dicho ; ver -> visto ; escribir -> escrito ; poner -> puesto ; volver -> vuelto ; abrir -> abierto ; romper -> roto ; morir -> muerto.</div>
<h3>4. Une règle d'or : haber et le participe restent soudés</h3>
<p>Contrairement au français, l'auxiliaire haber et le participe ne se séparent <strong>jamais</strong>, et le participe est <strong>invariable</strong> (il ne s'accorde ni en genre ni en nombre après haber).</p>
<pre class="pseudo">Correct :   Ella había llegado.  Los niños habían comido.
Incorrect : Ella había llegada.  (pas d'accord !)</pre>
<div class="tip">Astuce : rien ne s'insère entre haber et le participe. Les pronoms se placent AVANT l'auxiliaire : « ya lo había visto » (je l'avais déjà vu), jamais « había lo visto ».</div>
<h3>5. Mots qui accompagnent souvent le plus-que-parfait</h3>
<p>Certains adverbes signalent naturellement l'antériorité :</p>
<pre class="pseudo">ya            = déjà      Cuando llamaste, ya había salido.
todavía no    = pas encore Todavía no había comido cuando llegaron.
nunca         = jamais    Nunca había visto algo así.
antes         = avant     Antes de eso, nunca había viajado.</pre>
<p>Exemple complet : <em>Nunca había probado la paella antes de ir a Valencia</em> (Je n'avais jamais goûté la paella avant d'aller à Valence).</p>`,
  exercises: [
    { type: "qcm", q: "Le plus-que-parfait exprime :", opts: ["une action future", "une action antérieure à une autre action passée", "une habitude présente", "un ordre"], a: 1, exp: "C'est le passé du passé : une action qui s'était produite avant une autre." },
    { type: "qcm", q: "Le plus-que-parfait se forme avec :", opts: ["haber au présent + participe", "haber à l'imparfait + participe", "ser + gérondif", "tener + participe"], a: 1, exp: "Haber à l'imparfait (había, habías...) + participe passé." },
    { type: "input", q: "Complète : Cuando llegué, la fiesta ya ___ empezado. (empezar)", a: ["había"], ph: "auxiliaire", exp: "Había empezado : haber à l'imparfait (3e pers.)." },
    { type: "input", q: "Participe passé de HACER : Yo nunca había ___ eso. (jamais fait)", a: ["hecho"], ph: "participe", exp: "Hacer -> hecho (participe irrégulier)." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Ella había llegada", "Ella había llegado", "Ella habían llegado", "Ella ha llegada"], a: 1, exp: "Le participe est invariable après haber : había llegado." },
    { type: "input", q: "Conjugue : Nosotros ___ comido antes de salir. (haber, imparfait)", a: ["habíamos", "habiamos"], ph: "auxiliaire", exp: "Habíamos comido : nosotros -> habíamos." },
    { type: "vf", q: "Après haber, le participe passé ne s'accorde jamais.", a: true, exp: "Vrai : le participe reste invariable après l'auxiliaire haber." },
    { type: "input", q: "Participe irrégulier de VER : Yo nunca había ___ el mar. (jamais vu)", a: ["visto"], ph: "participe", exp: "Ver -> visto." },
    { type: "qcm", q: "Où place-t-on le pronom : « je l'avais déjà vu » ?", opts: ["Había lo visto", "Ya lo había visto", "Había visto lo", "Lo visto había"], a: 1, exp: "Le pronom se place avant l'auxiliaire : ya lo había visto." },
    { type: "input", q: "Complète : Ellos ___ vivido en Madrid antes de mudarse. (haber, imparfait)", a: ["habían", "habian"], ph: "auxiliaire", exp: "Habían vivido : ellos -> habían." },
    { type: "qcm", q: "Participe passé de DECIR :", opts: ["decido", "dicho", "diciendo", "decir"], a: 1, exp: "Decir -> dicho (participe irrégulier)." },
    { type: "vf", q: "« Todavía no había comido » signifie « il n'avait pas encore mangé ».", a: true, exp: "Todavía no + plus-que-parfait = pas encore, action non réalisée avant un moment passé." },
    { type: "qcm", q: "Comprension : « Cuando la policía llegó, el ladrón ya había escapado. » Que s'est-il passé en premier ?", opts: ["l'arrivée de la police", "la fuite du voleur", "les deux en même temps", "aucun des deux"], a: 1, exp: "Había escapado (antérieur) : le voleur avait fui AVANT l'arrivée de la police." },
    { type: "input", q: "Participe de ESCRIBIR : Ya había ___ la carta cuando me llamaste. (écrit)", a: ["escrito"], ph: "participe", exp: "Escribir -> escrito (irrégulier)." },
    { type: "qcm", q: "Comprension : « Nunca había probado sushi antes de ese viaje. » Que comprend-on ?", opts: ["Il mange souvent du sushi", "C'était sa première fois lors de ce voyage", "Il déteste le sushi", "Il en a cuisiné"], a: 1, exp: "Nunca había probado = il n'en avait jamais goûté avant ce voyage." }
  ],
  final: {
    title: "Exercice final — Una llegada tardía",
    intro: `<p>Marta cuenta lo que pasó cuando llegó a casa de sus amigos :</p>
<pre class="pseudo">Llegué a la cena una hora tarde.
Cuando entré, mis amigos ya habían empezado a comer.
Alguien había preparado una tortilla enorme.
Todavía no habían servido el postre, por suerte.
Nunca había visto una mesa tan llena de comida.
Al final, me dijeron que habían pensado en llamarme, pero no lo hicieron.</pre>`,
    questions: [
      { type: "qcm", q: "« Mis amigos ya habían empezado a comer » : par rapport à l'arrivée de Marta, cette action est :", opts: ["postérieure", "antérieure", "simultanée", "future"], a: 1, exp: "Le plus-que-parfait marque l'antériorité : ils avaient commencé AVANT qu'elle entre." },
      { type: "input", q: "Relève le participe passé dans « alguien había ___ una tortilla ».", a: ["preparado"], ph: "participe", exp: "Preparar -> preparado." },
      { type: "qcm", q: "« Todavía no habían servido el postre » signifie :", opts: ["ils avaient déjà servi le dessert", "ils n'avaient pas encore servi le dessert", "ils servent le dessert", "ils serviront le dessert"], a: 1, exp: "Todavía no + plus-que-parfait = pas encore fait." },
      { type: "vf", q: "« Nunca había visto » emploie le participe irrégulier de ver (visto).", a: true, exp: "Ver -> visto : nunca había visto = je n'avais jamais vu." },
      { type: "input", q: "Complète : Me dijeron que ___ pensado en llamarme. (haber, imparfait, ellos)", a: ["habían", "habian"], ph: "auxiliaire", exp: "Habían pensado : ellos -> habían." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Je suis arrivée au dîner avec une heure de retard.
Quand je suis entrée, mes amis avaient déjà commencé à manger.
Quelqu'un avait préparé une énorme tortilla.
Ils n'avaient pas encore servi le dessert, heureusement.
Je n'avais jamais vu une table aussi remplie de nourriture.
À la fin, ils m'ont dit qu'ils avaient pensé à m'appeler, mais ne l'ont pas fait.</pre>
<p>Chaque forme « había/habían + participe » situe un fait <strong>avant</strong> le moment où Marta arrive et entre (llegué, entré). C'est la fonction essentielle du plus-que-parfait : ordonner les événements du passé.</p>`
  }
};
</script>
