<script>
var DAY = {
  num: 24,
  title: "Diminutifs et augmentatifs",
  subtitle: "Nuancer la taille, l'affection ou le mépris avec des suffixes.",
  theory: `
<h3>1. À quoi servent-ils ?</h3>
<p>L'espagnol adore modifier les mots avec des suffixes pour exprimer la taille, mais aussi l'<strong>affection</strong>, l'<strong>ironie</strong> ou le <strong>mépris</strong>. On distingue les diminutifs (diminutivos) et les augmentatifs (aumentativos).</p>
<h3>2. Les diminutifs (petit, affection)</h3>
<pre class="pseudo">-ito / -ita   : gato → gatito (petit chat)
              casa → casita (petite maison)
-illo / -illa : chico → chiquillo (gamin)
-cito / -cita : pan → pancito ; café → cafecito</pre>
<p>Le diminutif indique la petite taille, mais surtout l'affection : <em>¿Quieres un cafecito?</em> (Tu veux un petit café ?) sonne plus chaleureux que <em>un café</em>.</p>
<div class="tip">Astuce : le diminutif -ito est aussi utilisé pour adoucir : <em>Espera un momentito</em> (Attends un petit instant) est plus doux que <em>un momento</em>. <em>ahora → ahorita</em> (tout de suite, Amérique latine).</div>
<h3>3. Règles de formation des diminutifs</h3>
<pre class="pseudo">Mot en -o/-a  → on remplace par -ito/-ita : libro → librito
Mot en -e/-n/-r → on ajoute -cito/-cita : coche → cochecito ; joven → jovencito
Mot court (1 syllabe) → -ecito : flor → florecita ; pan → panecito</pre>
<div class="warn">Attention aux changements orthographiques : <strong>c → qu</strong> (chico → chiquito), <strong>g → gu</strong> (amigo → amiguito), <strong>z → c</strong> (pez → pececito). C'est pour garder le son.</div>
<h3>4. Les augmentatifs (grand, parfois péjoratif)</h3>
<pre class="pseudo">-ón / -ona  : silla → sillón (fauteuil) ; hombre → hombrón (grand costaud)
-azo / -aza : coche → cochazo (grosse belle voiture) ; perro → perrazo
-ote / -ota : grande → grandote ; libro → librote</pre>
<p>L'augmentatif exprime la grande taille, l'admiration (<em>un cochazo</em> = une super grosse voiture) ou parfois le mépris (<em>un libraco</em> = un gros bouquin sans intérêt).</p>
<div class="warn">Faux amis à connaître : certains mots en -ón/-illa ont figé leur sens : <strong>sillón</strong> = fauteuil (pas « grande chaise »), <strong>bocadillo</strong> = sandwich (pas « petite bouche »), <strong>ventanilla</strong> = guichet.</div>
<h3>5. Le suffixe -azo = un coup</h3>
<pre class="pseudo">Le suffixe -azo peut aussi signifier « un coup de » :
codo → codazo (un coup de coude)
puerta → portazo (un claquement de porte)
mano → manotazo (une claque)</pre>`,
  exercises: [
    { type: "qcm", q: "Quel suffixe est un diminutif affectueux ?", opts: ["-ón", "-ito", "-azo", "-ote"], a: 1, exp: "-ito / -ita = diminutif (petit, affection)." },
    { type: "input", q: "Forme le diminutif de « casa » : ___.", a: ["casita"], ph: "mot", exp: "Casa → casita (petite maison)." },
    { type: "qcm", q: "Que suggère souvent le diminutif, en plus de la petite taille ?", opts: ["le mépris", "l'affection ou la douceur", "la colère", "la peur"], a: 1, exp: "Le diminutif exprime souvent l'affection : cafecito, momentito." },
    { type: "vf", q: "« Gatito » est le diminutif de « gato ».", a: true, exp: "Vrai : gato → gatito (petit chat)." },
    { type: "input", q: "Forme le diminutif de « amigo » (attention g → gu) : ___.", a: ["amiguito"], ph: "mot", exp: "Amigo → amiguito (le u garde le son [g])." },
    { type: "qcm", q: "Quel suffixe est un augmentatif ?", opts: ["-ito", "-illo", "-azo", "-cito"], a: 2, exp: "-azo / -ón / -ote = augmentatifs." },
    { type: "vf", q: "« Un cochazo » exprime une grosse et belle voiture (admiration).", a: true, exp: "Vrai : coche → cochazo (augmentatif admiratif)." },
    { type: "qcm", q: "Que signifie « sillón » ?", opts: ["une petite chaise", "un fauteuil", "une table", "un tabouret"], a: 1, exp: "Sillón = fauteuil (sens figé, pas « grande chaise »)." },
    { type: "input", q: "Forme le diminutif de « chico » (attention c → qu) : ___.", a: ["chiquito"], ph: "mot", exp: "Chico → chiquito (c devient qu)." },
    { type: "qcm", q: "« Portazo » signifie :", opts: ["une petite porte", "un claquement de porte", "une grande porte", "une clé"], a: 1, exp: "-azo = un coup : portazo = claquement de porte." },
    { type: "vf", q: "« Momentito » adoucit « momento » (attends un petit instant).", a: true, exp: "Vrai : Espera un momentito est plus doux." },
    { type: "input", q: "Forme le diminutif de « flor » (mot court) : ___.", a: ["florecita"], ph: "mot", exp: "Flor → florecita (mot court → -ecita)." },
    { type: "qcm", q: "Compréhension : « Ven aquí, hijito, dame un besito. » Quel est le ton ?", opts: ["mépris", "tendresse", "colère", "ironie"], a: 1, exp: "Hijito, besito = diminutifs affectueux (tendresse)." },
    { type: "qcm", q: "Compréhension : « ¡Menudo librote! No lo voy a leer nunca. » Que suggère « librote » ici ?", opts: ["un petit livre agréable", "un gros livre (avec une nuance négative)", "un cahier", "une revue"], a: 1, exp: "Librote = gros livre, ici avec une connotation négative." },
    { type: "input", q: "Traduis « un coup de coude » (avec suffixe -azo) : ___.", a: ["codazo"], ph: "mot", exp: "Codo → codazo = un coup de coude." }
  ],
  final: {
    title: "Exercice final — Un mensaje cariñoso",
    intro: `<p>Lis ce petit message plein de diminutifs et augmentatifs :</p>
<pre class="pseudo">¡Hola, abuelita! ¿Cómo estás?
Te escribo desde mi casita nueva. Es pequeñita
pero muy acogedora. Tengo un gatito que se llama Luna.
Ayer compré un cochazo de segunda mano, ¡me encanta!
El vecino de arriba es un hombrón muy simpático.
Esta tarde voy a prepararte un pastelito para tu cumpleaños.
Ven pronto, te doy un besito enorme.
Un abrazote muy fuerte,
Marta</pre>`,
    questions: [
      { type: "qcm", q: "Comment est la nouvelle maison de Marta ?", opts: ["grande et froide", "petite mais accueillante", "en ruines", "à la campagne"], a: 1, exp: "Es pequeñita pero muy acogedora." },
      { type: "input", q: "Comment s'appelle le petit chat ? (un mot)", a: ["Luna", "luna"], ph: "prénom", exp: "Un gatito que se llama Luna." },
      { type: "qcm", q: "Qu'a acheté Marta d'occasion ?", opts: ["une petite chaise", "un fauteuil", "une belle grosse voiture (cochazo)", "un livre"], a: 2, exp: "Un cochazo de segunda mano (augmentatif admiratif)." },
      { type: "vf", q: "« Hombrón » décrit ici le voisin comme un grand costaud sympathique.", a: true, exp: "El vecino es un hombrón muy simpático." },
      { type: "qcm", q: "Quel diminutif Marta prépare-t-elle pour l'anniversaire ?", opts: ["un cafecito", "un pastelito", "un bocadillo", "una florecita"], a: 1, exp: "Voy a prepararte un pastelito = un petit gâteau." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Coucou, mamie ! Comment vas-tu ?
Je t'écris depuis ma nouvelle petite maison. Elle est toute petite
mais très accueillante. J'ai un petit chat qui s'appelle Luna.
Hier j'ai acheté une belle grosse voiture d'occasion, je l'adore !
Le voisin du dessus est un grand costaud très sympathique.
Cet après-midi je vais te préparer un petit gâteau pour ton anniversaire.
Viens vite, je te fais un gros bisou.
Une grosse accolade très forte,
Marta</pre>
<p>Ce message montre l'usage vivant des suffixes : diminutifs affectueux (abuelita, casita, gatito, besito) et augmentatifs (cochazo, hombrón, abrazote). Ils rendent le ton chaleureux et naturel.</p>`
  }
};
</script>
