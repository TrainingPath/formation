  dialogues: [
    {
      num: "1",
      titre: "Pedir cita por teléfono",
      perso: "Laura Mertens (candidate belge) et Sr. Ortega (service du personnel de Grupo Aldana).",
      lignes: [
        { qui: "Ortega", txt: "Grupo Aldana, buenos días. ¿En qué puedo ayudarle?", fr: "Groupe Aldana, bonjour. En quoi puis-je vous aider ?" },
        { qui: "Laura", txt: "Buenos días. Me llamo Laura Mertens. Llamo por el anuncio que publicaron ustedes en la web.", fr: "Bonjour. Je m'appelle Laura Mertens. J'appelle au sujet de l'annonce que vous avez publiée sur le site." },
        { qui: "Ortega", txt: "¿El puesto de asistente comercial? Sí, sigue abierto hasta el viernes.", fr: "Le poste d'assistant commercial ? Oui, il reste ouvert jusqu'à vendredi." },
        { qui: "Laura", txt: "Perfecto. Ya les envié mi currículum la semana pasada, pero quería saber si lo habían recibido.", fr: "Parfait. Je vous ai déjà envoyé mon CV la semaine dernière, mais je voulais savoir si vous l'aviez reçu." },
        { qui: "Ortega", txt: "Un momento, lo compruebo… Sí, aquí está. Es necesario que hable usted con la señora Prat.", fr: "Un instant, je vérifie… Oui, le voici. Il faut que vous parliez avec madame Prat." },
        { qui: "Laura", txt: "¿Y cuándo podría verla? Estoy libre toda la semana por las mañanas.", fr: "Et quand pourrais-je la voir ? Je suis libre toute la semaine le matin." },
        { qui: "Ortega", txt: "Cuando ella vuelva de Sevilla, le propondremos una fecha. Regresa el martes.", fr: "Quand elle rentrera de Séville, nous vous proposerons une date. Elle revient mardi." },
        { qui: "Laura", txt: "Muy bien. No dude en llamarme al móvil; no cuelgo nunca sin contestar.", fr: "Très bien. N'hésitez pas à m'appeler sur le portable ; je ne raccroche jamais sans répondre." },
        { qui: "Ortega", txt: "De acuerdo. ¿Me deja su número, por favor? Se lo paso a la señora Prat.", fr: "D'accord. Vous me laissez votre numéro, s'il vous plaît ? Je le transmets à madame Prat." },
        { qui: "Laura", txt: "Es el seis, cuarenta y uno, veintitrés, ochenta, cero cinco.", fr: "C'est le six, quarante et un, vingt-trois, quatre-vingts, zéro cinq." },
        { qui: "Ortega", txt: "Anotado. Le llamaremos el miércoles para que venga a la entrevista.", fr: "Noté. Nous vous appellerons mercredi pour que vous veniez à l'entretien." },
        { qui: "Laura", txt: "Se lo agradezco muchísimo. Que tenga un buen día.", fr: "Je vous en remercie beaucoup. Bonne journée." }
      ]
    },
    {
      num: "2",
      titre: "La acogida en la empresa",
      perso: "Laura Mertens, Beatriz (recepcionista) y la Sra. Prat (jefa de recursos humanos).",
      lignes: [
        { qui: "Beatriz", txt: "Buenos días. ¿Tiene usted cita?", fr: "Bonjour. Avez-vous rendez-vous ?" },
        { qui: "Laura", txt: "Sí, a las diez con la señora Prat. Soy Laura Mertens.", fr: "Oui, à dix heures avec madame Prat. Je suis Laura Mertens." },
        { qui: "Beatriz", txt: "Un segundo, la aviso. Mientras tanto, ¿me enseña un documento de identidad?", fr: "Une seconde, je la préviens. En attendant, vous me montrez une pièce d'identité ?" },
        { qui: "Laura", txt: "Aquí tiene mi carné. Perdone que llegue un poco pronto: no sabía cuánto tardaría el metro.", fr: "Voici ma carte. Excusez-moi d'arriver un peu tôt : je ne savais pas combien de temps le métro mettrait." },
        { qui: "Beatriz", txt: "No pasa nada, es mejor que llegue pronto que tarde. Siéntese, por favor.", fr: "Ce n'est rien, il vaut mieux que vous arriviez tôt que tard. Asseyez-vous, s'il vous plaît." },
        { qui: "Laura", txt: "Gracias. Qué edificio tan luminoso; las oficinas fueron reformadas hace poco, ¿verdad?", fr: "Merci. Quel bâtiment lumineux ; les bureaux ont été rénovés récemment, n'est-ce pas ?" },
        { qui: "Beatriz", txt: "Sí, se renovaron el año pasado. Aquí se trabaja mucho mejor que antes.", fr: "Oui, ils ont été rénovés l'an dernier. On travaille bien mieux ici qu'avant." },
        { qui: "Prat", txt: "¿Señorita Mertens? Encantada. Soy Ana Prat, la persona con quien habló mi compañero.", fr: "Mademoiselle Mertens ? Enchantée. Je suis Ana Prat, la personne avec qui mon collègue a parlé." },
        { qui: "Laura", txt: "Mucho gusto. Le agradezco que me haya recibido tan pronto.", fr: "Enchantée. Je vous remercie de m'avoir reçue si vite." },
        { qui: "Prat", txt: "Es normal. Acompáñeme, subimos a la tercera planta. No traiga el abrigo, déjelo ahí.", fr: "C'est normal. Suivez-moi, nous montons au troisième étage. N'apportez pas le manteau, laissez-le là." },

      ]

      ]
    }

        { type: "qcm", q: "¿En qué planta está el despacho de la señora Prat?", opts: ["En la primera", "En la segunda", "En la tercera", "En la baja"], a: 2, exp: "subimos a la tercera planta." },

        { type: "qcm", q: "¿Por qué quiere cambiar de trabajo Laura?", opts: ["Por el sueldo", "Por el horario", "Para poder usar sus idiomas", "Para trabajar cerca de casa"], a: 2, exp: "Busco un puesto en el que pueda usar mis idiomas." },

    {
      id: "texte",

      consigne: "Lis l'article de presse ci-dessous, puis réponds aux questions.",
      intro: "<div class='dlg'><h3>El primer empleo, cada vez más tarde</h3><p>Los jóvenes españoles encuentran su primer empleo estable a los veintinueve años de media, según un informe publicado esta semana. Hace veinte años, esa edad era de veinticuatro. Los expertos explican que el mercado se ha vuelto más exigente y que las empresas piden experiencia incluso para los puestos de entrada. Muchos titulados aceptan prácticas mal pagadas para que su currículum resulte más atractivo. Otros deciden marcharse al extranjero, sobre todo a Alemania y a los Países Bajos. El informe señala que quienes dominan dos idiomas encuentran trabajo un año antes que los demás. También indica que las mujeres tardan más en firmar un contrato indefinido, aunque sus notas sean mejores. Los sindicatos piden que se reformen las prácticas y que se controlen los abusos. Las patronales, en cambio, opinan que el problema es la rigidez de los contratos. El Gobierno ha anunciado que estudiará el asunto en otoño. Mientras tanto, las oficinas de empleo aconsejan a los jóvenes que se formen en informática. Nadie cree que la situación cambie de un día para otro, pero casi todos esperan que mejore poco a poco.</p></div>",

    {

      consigne: "Lis cette offre d'emploi, puis réponds aux questions.",
      intro: "<div class='dlg'><h3>OFERTA DE EMPLEO — Grupo Aldana, S.L.</h3><p><b>Puesto:</b> Asistente comercial (ref. AC-114)<br><b>Lugar:</b> Zaragoza, oficina central. Posibilidad de teletrabajo dos días por semana.<br><b>Contrato:</b> indefinido, tras un periodo de prueba de seis meses.<br><b>Jornada:</b> completa, de lunes a viernes, de 9.00 a 17.30.<br><b>Sueldo:</b> entre 26.000 y 30.000 euros brutos anuales, según experiencia.<br><b>Requisitos imprescindibles:</b> titulación superior en comercio o administración; dos años de experiencia mínima; nivel B2 de francés y nociones de alemán; dominio de hojas de cálculo.<br><b>Se valorará:</b> carné de conducir, disponibilidad para viajar, experiencia en el sector del transporte.<br><b>Funciones:</b> atender a los clientes extranjeros, redactar presupuestos, hacer el seguimiento de los pedidos y apoyar al jefe de ventas.<br><b>Ofrecemos:</b> formación continua, seguro médico privado y tíquets de comida.<br><b>Cómo solicitarlo:</b> envíe su currículum y una carta de motivación a seleccion@aldana.es indicando la referencia. No se atenderán las candidaturas que no incluyan la referencia. Plazo: hasta el 30 de abril.</p></div>",
