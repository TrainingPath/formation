<script>
var DAY = {
  num: 30,
  title: "Bilan B1 : conversation de 10 minutes",
  subtitle: "Tenir une conversation fluide de dix minutes sur un sujet familier.",
  theory: `
<h3>1. L'objectif de l'épreuve</h3>
<p>À l'examen oral B1, on te demande de parler pendant une dizaine de minutes : te présenter, décrire, raconter, donner ton avis et interagir. L'important n'est pas la perfection mais la <strong>fluidité</strong> et la capacité à te débrouiller.</p>
<h3>2. La trame d'une conversation de 10 minutes</h3>
<pre class="pseudo">MINUTOS 0-2 : Presentación
  Me llamo…, soy de…, tengo… años, estudio/trabajo en…

MINUTOS 2-4 : Rutina y gustos
  Normalmente me levanto a las…, me gusta…, en mi tiempo libre…

MINUTOS 4-6 : Un recuerdo o una anécdota (passé)
  El año pasado fui a…, fue una experiencia…, lo que más me gustó…

MINUTOS 6-8 : Opinión sobre un tema
  En mi opinión…, creo que…, por un lado… por otro lado…

MINUTOS 8-10 : Proyectos y despedida
  En el futuro me gustaría…, cuando termine…, espero que…</pre>
<div class="tip">Astuce : mémorise cette trame en cinq blocs. Même si tu perds le fil, tu sais toujours quelle est la partie suivante. Chaque bloc dure environ deux minutes.</div>
<h3>3. Les expressions pour gagner du temps</h3>
<pre class="pseudo">Bueno…              = Eh bien…
A ver…              = Voyons…
Es decir…           = C'est-à-dire…
¿Cómo lo diría?     = Comment dire ?
Lo que quiero decir es que… = Ce que je veux dire, c'est que…
Pues…               = Alors… / Eh bien…</pre>
<p>Ces « béquilles » évitent les silences et rendent le discours naturel.</p>
<h3>4. Interagir avec l'examinateur</h3>
<pre class="pseudo">¿Puede repetir, por favor?   = Pouvez-vous répéter ?
No estoy seguro/a, pero creo que… = Je ne suis pas sûr, mais je crois…
¿Usted qué opina?            = Vous, qu'en pensez-vous ?
Perdón, ¿qué significa…?     = Pardon, que veut dire… ?</pre>
<div class="warn">Ne réponds jamais par un seul mot : développe toujours. À « ¿Te gusta viajar? », ne réponds pas « Sí », mais « Sí, me encanta viajar porque me gusta conocer otras culturas y probar comida nueva. »</div>
<h3>5. Exemple de mini-monologue (2 minutes)</h3>
<pre class="pseudo">Bueno, me llamo Sofía y tengo veinte años.
Soy de Lyon, en Francia, pero estudio Turismo en Madrid.
En mi tiempo libre me gusta leer y salir con mis amigos.
El fin de semana pasado fui a Toledo y fue precioso.
Lo que más me gustó fue la catedral.
En el futuro me gustaría trabajar en una agencia de viajes,
así que espero mejorar mucho mi español este año.</pre>`,
  exercises: [
    { type: "qcm", q: "Quel est le but de l'épreuve orale B1 ?", opts: ["parler parfaitement sans erreur", "tenir une conversation fluide d'environ 10 minutes", "réciter une liste de mots", "traduire un texte"], a: 1, exp: "L'objectif est la fluidité sur environ 10 minutes." },
    { type: "input", q: "Complète la présentation : « Me ___ Sofía y tengo veinte años. »", a: ["llamo"], ph: "verbe", exp: "Me llamo… = je m'appelle." },
    { type: "qcm", q: "Combien de blocs compte la trame proposée ?", opts: ["deux", "trois", "cinq", "dix"], a: 2, exp: "Cinq blocs de deux minutes chacun." },
    { type: "vf", q: "« A ver… » sert à gagner du temps avant de répondre.", a: true, exp: "Vrai : A ver… = voyons… (béquille de discours)." },
    { type: "input", q: "Complète (pour préciser) : « Es ___, quiero explicarlo mejor. » (c'est-à-dire)", a: ["decir"], ph: "mot", exp: "Es decir… = c'est-à-dire." },
    { type: "qcm", q: "Que faut-il éviter à l'oral B1 ?", opts: ["développer ses réponses", "répondre par un seul mot", "donner son opinion", "raconter une anecdote"], a: 1, exp: "Ne jamais répondre par un seul mot : il faut développer." },
    { type: "vf", q: "« ¿Puede repetir, por favor? » permet d'interagir avec l'examinateur.", a: true, exp: "Vrai : demander de répéter est une bonne stratégie." },
    { type: "qcm", q: "Dans quel bloc raconte-t-on un souvenir au passé ?", opts: ["la présentation", "les minutes 4-6 (une anecdote)", "la conclusion", "jamais"], a: 1, exp: "Minutos 4-6 : un recuerdo o una anécdota (passé)." },
    { type: "input", q: "Complète (projet) : « En el futuro me ___ trabajar en el extranjero. » (gustar → conditionnel)", a: ["gustaría"], ph: "verbe", exp: "Me gustaría = j'aimerais (projet)." },
    { type: "qcm", q: "Comment bien répondre à « ¿Te gusta viajar? » ?", opts: ["Sí.", "No.", "Sí, me encanta porque conozco otras culturas.", "No sé."], a: 2, exp: "Toujours développer avec une raison (porque…)." },
    { type: "vf", q: "« Lo que más me gustó fue… » sert à mettre en valeur un point d'une anecdote.", a: true, exp: "Vrai : lo que más me gustó fue la catedral." },
    { type: "input", q: "Complète (opinion) : « En mi ___, el español es muy útil. »", a: ["opinión"], ph: "mot", exp: "En mi opinión = à mon avis." },
    { type: "qcm", q: "Compréhension : « Pues, ¿cómo lo diría? Es un tema complicado. » Que fait la personne ?", opts: ["elle refuse de parler", "elle cherche ses mots pour continuer", "elle change de sujet", "elle se moque"], a: 1, exp: "Pues, ¿cómo lo diría? = elle gagne du temps pour formuler." },
    { type: "qcm", q: "Compréhension : dans l'exemple, où Sofía étudie-t-elle et quoi ?", opts: ["Turismo à Madrid", "Medicina à Lyon", "Historia à Toledo", "Marketing à Barcelona"], a: 0, exp: "Estudio Turismo en Madrid." },
    { type: "input", q: "Complète (clôture temporelle) : « Cuando ___ mis estudios, buscaré trabajo. » (terminar → subj.)", a: ["termine"], ph: "verbe", exp: "Cuando + subjonctif pour le futur : cuando termine." }
  ],
  final: {
    title: "Exercice final — Una conversación modelo",
    intro: `<p>Lis cette conversation qui suit la trame des cinq blocs :</p>
<pre class="pseudo">EXAMINADOR: Buenos días. Preséntese, por favor.
CANDIDATA: Buenos días. Me llamo Clara, tengo diecinueve años
y soy estudiante de idiomas.

EXAMINADOR: ¿Cómo es un día normal para usted?
CANDIDATA: Normalmente me levanto a las siete, voy a clase por la mañana
y por la tarde estudio o quedo con amigos.

EXAMINADOR: Cuénteme un buen recuerdo.
CANDIDATA: El verano pasado viajé a Sevilla. Hacía mucho calor,
pero fue increíble. Lo que más me gustó fue el flamenco.

EXAMINADOR: ¿Qué opina de aprender idiomas?
CANDIDATA: En mi opinión, es muy importante. Por un lado, abre puertas
en el trabajo; por otro, permite conocer otras culturas.

EXAMINADOR: ¿Y sus planes de futuro?
CANDIDATA: Cuando termine mis estudios, me gustaría trabajar
como traductora. Espero poder vivir un tiempo en España.

EXAMINADOR: Muy bien, muchas gracias.
CANDIDATA: Gracias a usted.</pre>`,
    questions: [
      { type: "qcm", q: "Que fait Clara comme études ?", opts: ["médecine", "langues", "droit", "informatique"], a: 1, exp: "Soy estudiante de idiomas." },
      { type: "input", q: "À quelle heure se lève-t-elle normalement ? (heure en lettres, un mot)", a: ["siete"], ph: "heure", exp: "Me levanto a las siete." },
      { type: "qcm", q: "Quel est son bon souvenir ?", opts: ["un voyage à Sevilla l'été dernier", "un examen réussi", "un concert à Paris", "un match de foot"], a: 0, exp: "El verano pasado viajé a Sevilla." },
      { type: "vf", q: "Selon elle, apprendre des langues ouvre des portes dans le travail.", a: true, exp: "Por un lado, abre puertas en el trabajo." },
      { type: "qcm", q: "Quel est son projet pour l'avenir ?", opts: ["devenir médecin", "travailler comme traductrice", "arrêter les études", "rester chez elle"], a: 1, exp: "Me gustaría trabajar como traductora." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">EXAMINATEUR : Bonjour. Présentez-vous, s'il vous plaît.
CANDIDATE : Bonjour. Je m'appelle Clara, j'ai dix-neuf ans
et je suis étudiante en langues.

EXAMINATEUR : Comment se passe une journée normale pour vous ?
CANDIDATE : D'habitude je me lève à sept heures, je vais en cours le matin
et l'après-midi j'étudie ou je retrouve des amis.

EXAMINATEUR : Racontez-moi un bon souvenir.
CANDIDATE : L'été dernier j'ai voyagé à Séville. Il faisait très chaud,
mais c'était incroyable. Ce qui m'a le plus plu, c'est le flamenco.

EXAMINATEUR : Que pensez-vous de l'apprentissage des langues ?
CANDIDATE : À mon avis, c'est très important. D'un côté, cela ouvre des portes
dans le travail ; de l'autre, cela permet de connaître d'autres cultures.

EXAMINATEUR : Et vos projets d'avenir ?
CANDIDATE : Quand j'aurai fini mes études, j'aimerais travailler
comme traductrice. J'espère pouvoir vivre quelque temps en Espagne.

EXAMINATEUR : Très bien, merci beaucoup.
CANDIDATE : Merci à vous.</pre>
<p>Cette conversation suit parfaitement les cinq blocs : présentation, routine, souvenir au passé, opinion nuancée et projets au conditionnel + subjonctif. Entraîne-toi à parler deux minutes sur chaque bloc.</p>`
  }
};
</script>

    solution: "Bueno, me llamo Thomas, tengo veintidós años y soy francés, de Nantes. Actualmente estudio Comercio Internacional y aprendo español desde hace dos años. Normalmente me levanto temprano, voy a la universidad por la mañana y por la tarde practico deporte o veo series en español. En mi tiempo libre me encanta cocinar y viajar. El año pasado fui de Erasmus a Valencia y fue una experiencia inolvidable; lo que más me gustó fue la gente, muy abierta y amable. En mi opinión, aprender idiomas es fundamental: por un lado, abre muchas puertas profesionales; por otro, permite hacer amigos en todo el mundo. A ver, en el futuro me gustaría trabajar en una empresa internacional. Cuando termine mis estudios, espero poder vivir un tiempo en un país hispanohablante. Ojalá pueda cumplir ese sueño pronto. Muchas gracias por escucharme.\n\nTraduction : Eh bien, je m'appelle Thomas, j'ai vingt-deux ans et je suis français, de Nantes. Actuellement j'étudie le commerce international et j'apprends l'espagnol depuis deux ans. D'habitude je me lève tôt, je vais à l'université le matin et l'après-midi je fais du sport ou je regarde des séries en espagnol. Pendant mon temps libre j'adore cuisiner et voyager. L'an dernier je suis parti en Erasmus à Valence et ce fut une expérience inoubliable ; ce qui m'a le plus plu, ce sont les gens, très ouverts et aimables. À mon avis, apprendre des langues est fondamental : d'un côté, cela ouvre beaucoup de portes professionnelles ; de l'autre, cela permet de se faire des amis dans le monde entier. Voyons, à l'avenir j'aimerais travailler dans une entreprise internationale. Quand j'aurai fini mes études, j'espère pouvoir vivre quelque temps dans un pays hispanophone. Pourvu que je puisse réaliser ce rêve bientôt. Merci beaucoup de m'avoir écouté.",
