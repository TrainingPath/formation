<script>
var DAY = {
  num: 27,
  title: "Le registre : tú ou usted",
  subtitle: "Choisir entre tutoiement et vouvoiement selon la situation.",
  theory: `
<h3>1. Deux façons de dire « tu / vous »</h3>
<pre class="pseudo">TÚ    = tutoiement (familier, proche)
USTED = vouvoiement (poli, distance, respect)  → abrégé Ud. / Vd.</pre>
<p>Point crucial : <strong>usted</strong> se conjugue à la <strong>3e personne du singulier</strong>, comme « il / elle » ! <em>Usted habla</em> (Vous parlez), pas « usted hablas ».</p>
<div class="warn">Erreur fréquente des francophones : on dit <em>¿Usted quiere un café?</em> (3e pers.), jamais « usted quieres ». Le verbe s'accorde comme avec él/ella.</div>
<h3>2. Comparaison des formes</h3>
<pre class="pseudo">                TÚ                USTED
Présent :       (tú) tienes       (usted) tiene
Impératif :     ¡ven! ¡habla!     ¡venga! ¡hable!
Possessif :     tu casa, tuyo     su casa, suyo
Pronom objet :  te lo doy         se lo doy
Réfléchi :      te llamas         se llama</pre>
<p>Exemple : <em>¿Cómo te llamas?</em> (tú) → <em>¿Cómo se llama usted?</em> (vouvoiement).</p>
<h3>3. Quand utiliser usted ?</h3>
<pre class="pseudo">USTED (vouvoiement) :
 - une personne âgée qu'on ne connaît pas
 - un supérieur, un client, un professionnel
 - un contexte formel (entretien, administration, commerce)
 - pour marquer le respect ou la distance

TÚ (tutoiement) :
 - amis, famille, camarades
 - jeunes entre eux
 - contexte détendu, réseaux sociaux</pre>
<div class="tip">Astuce culturelle : l'Espagne tutoie beaucoup plus que la France ; on utilise « tú » avec des collègues, des serveurs jeunes, etc. En Amérique latine (surtout Colombie, Costa Rica), on vouvoie davantage. Dans le doute, commence par usted : on peut toujours proposer <em>Podemos tutearnos</em> (On peut se tutoyer).</div>
<h3>4. Le pluriel : vosotros ou ustedes ?</h3>
<pre class="pseudo">VOSOTROS = vous (pluriel familier) → Espagne uniquement
           ¿Vosotros venís? (2e pers. pluriel)
USTEDES  = vous (pluriel) → poli en Espagne, ET
           tutoiement+vouvoiement en Amérique latine
           ¿Ustedes vienen? (3e pers. pluriel)</pre>
<div class="warn">En Amérique latine, <strong>vosotros n'existe pas</strong> : on dit toujours <strong>ustedes</strong> pour « vous » au pluriel, qu'on soit poli ou familier.</div>
<h3>5. Passer du tú au usted (exemples)</h3>
<pre class="pseudo">Tú :    Oye, ¿me puedes ayudar? ¿Tienes un momento?
Usted : Perdone, ¿me puede ayudar? ¿Tiene un momento?
Tú :    Siéntate, por favor.
Usted : Siéntese, por favor.</pre>`,
  exercises: [
    { type: "qcm", q: "À quelle personne se conjugue « usted » ?", opts: ["1re personne", "2e personne", "3e personne du singulier", "3e personne du pluriel"], a: 2, exp: "Usted se conjugue comme él/ella (3e pers. sing.)." },
    { type: "input", q: "Mets au vouvoiement : « ¿Cómo te llamas? » → « ¿Cómo ___ llama usted? »", a: ["se"], ph: "pronom", exp: "Vouvoiement : ¿Cómo se llama usted?" },
    { type: "qcm", q: "Quelle phrase est correcte au vouvoiement ?", opts: ["Usted quieres café", "Usted quiere café", "Usted quieren café", "Usted querés café"], a: 1, exp: "Usted + 3e pers. : usted quiere." },
    { type: "vf", q: "En Amérique latine, « vosotros » n'est pas utilisé.", a: true, exp: "Vrai : on emploie ustedes au pluriel." },
    { type: "input", q: "Le possessif de « usted » : « ___ casa » (votre maison).", a: ["su"], ph: "possessif", exp: "Su casa = votre maison (usted)." },
    { type: "qcm", q: "Dans quel cas utilise-t-on plutôt « usted » ?", opts: ["avec un ami", "avec un frère", "lors d'un entretien d'embauche", "sur les réseaux sociaux"], a: 2, exp: "Contexte formel (entretien) → usted." },
    { type: "vf", q: "L'Espagne tutoie en général plus que la France.", a: true, exp: "Vrai : le tú y est très répandu." },
    { type: "qcm", q: "Impératif « assieds-toi » au vouvoiement :", opts: ["siéntate", "siéntese", "sentarse", "te sientas"], a: 1, exp: "Vouvoiement : ¡siéntese, por favor!" },
    { type: "input", q: "Mets au vouvoiement : « ¿Tú tienes un momento? » → « ¿ ___ un momento? » (usted)", a: ["tiene", "usted tiene"], ph: "verbe", exp: "¿Tiene (usted) un momento?" },
    { type: "qcm", q: "« Vosotros » s'emploie :", opts: ["partout dans le monde hispanophone", "seulement en Espagne", "seulement en Amérique latine", "jamais"], a: 1, exp: "Vosotros = pluriel familier, Espagne uniquement." },
    { type: "vf", q: "« Podemos tutearnos » propose de passer au tutoiement.", a: true, exp: "Vrai : tutearse = se tutoyer." },
    { type: "input", q: "Le pronom réfléchi de usted : « usted ___ llama Pedro. » (s'appelle)", a: ["se"], ph: "pronom", exp: "Usted se llama Pedro." },
    { type: "qcm", q: "Compréhension : « Perdone, ¿me puede ayudar? » Quel registre ?", opts: ["tutoiement", "vouvoiement", "argot", "pluriel familier"], a: 1, exp: "Perdone + puede = vouvoiement (usted)." },
    { type: "qcm", q: "Compréhension : « Oye, ¿tienes un boli? » Quel registre et à qui parle-t-on ?", opts: ["vouvoiement, à un inconnu âgé", "tutoiement, à un ami ou camarade", "formel, à un client", "à un juge"], a: 1, exp: "Oye + tienes = tutoiement familier (ami)." },
    { type: "input", q: "Au pluriel en Amérique latine, « vous venez » se dit : « ___ vienen ».", a: ["ustedes"], ph: "pronom", exp: "Ustedes vienen (pas de vosotros)." }
  ],
  final: {
    title: "Exercice final — Dos conversaciones",
    intro: `<p>Compare ces deux dialogues, l'un familier, l'autre formel :</p>
<pre class="pseudo">-- Conversación 1 (entre amigos) --
— ¡Hola, Marcos! ¿Qué tal estás? ¿Tienes planes esta tarde?
— Bien, ¿y tú? Si quieres, podemos vernos luego.
— ¡Genial! Escríbeme cuando salgas de trabajar.

-- Conversación 2 (con un cliente) --
— Buenos días, señor Ruiz. ¿Cómo está usted?
— Muy bien, gracias. ¿Podría enseñarme los documentos?
— Por supuesto. Siéntese, por favor, y espere un momento.</pre>`,
    questions: [
      { type: "qcm", q: "Quel registre emploie la conversation 1 ?", opts: ["vouvoiement", "tutoiement", "les deux", "aucun"], a: 1, exp: "¿Tienes…?, ¿y tú?, escríbeme = tutoiement." },
      { type: "qcm", q: "Dans la conversation 2, comment s'adresse-t-on au client ?", opts: ["avec tú", "avec usted (vouvoiement)", "avec vosotros", "sans pronom"], a: 1, exp: "¿Cómo está usted?, siéntese = vouvoiement." },
      { type: "input", q: "Impératif de politesse dans la conv. 2 : « ___, por favor » (asseyez-vous).", a: ["Siéntese", "siéntese"], ph: "verbe", exp: "Siéntese = impératif de usted." },
      { type: "vf", q: "« Escríbeme cuando salgas » est un impératif de tutoiement.", a: true, exp: "Vrai : escríbeme = impératif de tú." },
      { type: "qcm", q: "Pourquoi utilise-t-on usted avec le client ?", opts: ["parce qu'il est jeune", "par respect et distance professionnelle", "parce qu'on le connaît bien", "par erreur"], a: 1, exp: "Contexte professionnel → vouvoiement par respect." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">-- Conversation 1 (entre amis) --
— Salut, Marcos ! Comment ça va ? Tu as des projets cet après-midi ?
— Bien, et toi ? Si tu veux, on peut se voir plus tard.
— Génial ! Écris-moi quand tu sors du travail.

-- Conversation 2 (avec un client) --
— Bonjour, monsieur Ruiz. Comment allez-vous ?
— Très bien, merci. Pourriez-vous me montrer les documents ?
— Bien sûr. Asseyez-vous, s'il vous plaît, et attendez un moment.</pre>
<p>La différence se voit dans les verbes (tienes / está), les pronoms (te / se), les possessifs (tu / su) et les impératifs (escríbeme / siéntese). Le choix dépend de la relation et du contexte.</p>`
  }
};
