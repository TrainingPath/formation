<script>
var DAY = {
  num: 19,
  title: "Rédiger un e-mail formel",
  subtitle: "Les formules d'appel, de politesse et la structure d'un courrier professionnel.",
  theory: `
<h3>1. La structure d'un e-mail formel</h3>
<p>Un e-mail formel (un correo formal) suit toujours le même plan : formule d'appel, introduction, corps, demande, formule de clôture, signature.</p>
<pre class="pseudo">1. Saludo (appel)        : Estimado señor / Estimada señora
2. Introducción          : Le escribo para…
3. Cuerpo (le message)   : les détails, la demande
4. Despedida (clôture)   : Atentamente / Un cordial saludo
5. Firma (signature)     : votre nom</pre>
<div class="tip">Astuce : dans un e-mail formel, on utilise toujours <strong>usted</strong> (vouvoiement), jamais <strong>tú</strong>. Les verbes se conjuguent donc à la 3e personne : <em>¿Podría usted enviarme…?</em></div>
<h3>2. Les formules d'appel (el saludo)</h3>
<pre class="pseudo">Estimado señor:          = Cher Monsieur (destinataire connu)
Estimada señora:         = Chère Madame
Estimados señores:       = Messieurs (entreprise)
Muy señor mío:           = Monsieur (très formel)
A quien corresponda:     = À qui de droit</pre>
<div class="warn">Attention : en espagnol, on met deux points « : » après la formule d'appel, pas une virgule comme en anglais. <em>Estimado señor:</em> (puis on passe à la ligne).</div>
<h3>3. Introduire et formuler une demande</h3>
<pre class="pseudo">Le escribo para…            = Je vous écris pour…
Me dirijo a usted para…     = Je m'adresse à vous pour…
Quisiera solicitar…         = Je voudrais demander…
¿Sería posible…?            = Serait-il possible de…?
Le agradecería que + subj.  = Je vous saurais gré de…
Le ruego que + subj.        = Je vous prie de…</pre>
<p>Exemple : <em>Le escribo para solicitar información sobre el curso</em> (Je vous écris pour demander des informations sur le cours).</p>
<div class="warn">Après <strong>Le agradecería que</strong> et <strong>Le ruego que</strong>, on emploie le subjonctif : <em>Le agradecería que me enviara el documento</em> (Je vous saurais gré de m'envoyer le document).</div>
<h3>4. Les formules de clôture (la despedida)</h3>
<pre class="pseudo">Atentamente,                 = Cordialement, (standard)
Un cordial saludo,           = Cordialement,
Reciba un cordial saludo,    = Recevez mes salutations
Quedo a la espera de su respuesta = Dans l'attente de votre réponse
A la espera de sus noticias  = Dans l'attente de vos nouvelles</pre>
<p>Exemple : <em>Quedo a la espera de su respuesta. Atentamente, Marta López</em>.</p>`,
  exercises: [
    { type: "qcm", q: "Dans un e-mail formel, on s'adresse au destinataire avec :", opts: ["tú", "usted", "vosotros", "ellos"], a: 1, exp: "On vouvoie : usted." },
    { type: "input", q: "Complète l'appel : « ___ señor: » (Cher Monsieur).", a: ["Estimado", "estimado"], ph: "mot", exp: "Estimado señor:" },
    { type: "qcm", q: "Quel signe met-on après la formule d'appel en espagnol ?", opts: ["une virgule", "deux points ( : )", "un point-virgule", "rien"], a: 1, exp: "Estimado señor: (deux points)." },
    { type: "vf", q: "« Le escribo para… » signifie « Je vous écris pour… ».", a: true, exp: "Vrai : Le escribo para solicitar información." },
    { type: "input", q: "Complète : « Quisiera ___ información. » (Je voudrais demander).", a: ["solicitar"], ph: "verbe", exp: "Quisiera solicitar información." },
    { type: "qcm", q: "Après « Le agradecería que », quel mode ?", opts: ["l'indicatif", "le subjonctif", "l'infinitif", "le futur"], a: 1, exp: "Le agradecería que me enviara… → subjonctif." },
    { type: "vf", q: "« Atentamente » est une formule de clôture.", a: true, exp: "Vrai, Atentamente = cordialement (despedida)." },
    { type: "qcm", q: "Comment demander poliment quelque chose ?", opts: ["Dame el documento", "¿Sería posible enviarme el documento?", "Envíamelo ya", "Quiero eso"], a: 1, exp: "¿Sería posible…? est poli et formel." },
    { type: "input", q: "Complète la clôture : « Quedo a la espera de su ___. » (réponse)", a: ["respuesta"], ph: "mot", exp: "Quedo a la espera de su respuesta." },
    { type: "qcm", q: "« A quien corresponda » s'emploie quand :", opts: ["on connaît le nom du destinataire", "on ne connaît pas le destinataire précis", "on écrit à un ami", "on écrit à sa famille"], a: 1, exp: "A quien corresponda = à qui de droit." },
    { type: "vf", q: "Dans un e-mail formel, on peut tutoyer (tú) le destinataire.", a: false, exp: "Faux : on emploie usted (vouvoiement)." },
    { type: "input", q: "Traduis « Cordialement » (formule standard) : ___.", a: ["Atentamente", "atentamente"], ph: "mot", exp: "Atentamente = cordialement." },
    { type: "qcm", q: "Compréhension : « Le ruego que me confirme la cita. » Que demande-t-on ?", opts: ["d'annuler le rendez-vous", "de confirmer le rendez-vous", "de payer", "de venir en retard"], a: 1, exp: "Le ruego que me confirme la cita = confirmer le rendez-vous." },
    { type: "qcm", q: "Compréhension : « Me dirijo a usted para presentar mi candidatura. » Pourquoi écrit la personne ?", opts: ["pour se plaindre", "pour poser sa candidature", "pour remercier", "pour s'excuser"], a: 1, exp: "Presentar mi candidatura = poser sa candidature." },
    { type: "input", q: "Complète : « Me ___ a usted para… » (Je m'adresse à vous).", a: ["dirijo"], ph: "verbe", exp: "Me dirijo a usted para… (dirigirse)." }
  ],
  final: {
    title: "Exercice final — Una solicitud de información",
    intro: `<p>Lis cet e-mail formel :</p>
<pre class="pseudo">Estimados señores:

Me dirijo a ustedes para solicitar información sobre
los cursos de español que ofrecen para el próximo verano.
Me gustaría conocer los horarios, los precios y las fechas
de inscripción. Además, quisiera saber si existe la posibilidad
de obtener una beca para estudiantes.
Le agradecería que me enviara un folleto con todos los detalles.
Quedo a la espera de su respuesta.

Atentamente,
Carlos Ruiz</pre>`,
    questions: [
      { type: "qcm", q: "Pourquoi Carlos écrit-il cet e-mail ?", opts: ["pour se plaindre", "pour demander des informations sur des cours", "pour annuler une inscription", "pour remercier un professeur"], a: 1, exp: "Solicitar información sobre los cursos de español." },
      { type: "qcm", q: "Quelles informations demande-t-il ?", opts: ["seulement les prix", "horaires, prix et dates d'inscription", "les noms des professeurs", "l'adresse de l'école"], a: 1, exp: "Los horarios, los precios y las fechas de inscripción." },
      { type: "input", q: "Que voudrait-il obtenir pour les étudiants ? (un mot espagnol)", a: ["beca", "una beca"], ph: "mot", exp: "La posibilidad de obtener una beca = une bourse." },
      { type: "vf", q: "Carlos tutoie ses destinataires.", a: false, exp: "Faux : il vouvoie (Estimados señores, usted)." },
      { type: "qcm", q: "Quelle formule de clôture utilise-t-il ?", opts: ["Un abrazo", "Atentamente", "Hasta luego", "Besos"], a: 1, exp: "Atentamente = formule formelle de clôture." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Messieurs,

Je m'adresse à vous pour demander des informations sur
les cours d'espagnol que vous proposez pour l'été prochain.
J'aimerais connaître les horaires, les prix et les dates
d'inscription. De plus, je voudrais savoir s'il existe la possibilité
d'obtenir une bourse pour les étudiants.
Je vous saurais gré de m'envoyer une brochure avec tous les détails.
Dans l'attente de votre réponse.

Cordialement,
Carlos Ruiz</pre>
<p>Remarque le plan : appel (Estimados señores:), objet (Me dirijo a ustedes para…), demande précise, formule de politesse au subjonctif (Le agradecería que me enviara…) et clôture (Atentamente).</p>`
  }
};
</script>
