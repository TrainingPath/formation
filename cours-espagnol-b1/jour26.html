<script>
var DAY = {
  num: 26,
  title: "But, cause, conséquence",
  subtitle: "Exprimer le pourquoi (cause), le pour quoi (but) et le donc (conséquence).",
  theory: `
<h3>1. Trois relations logiques à ne pas confondre</h3>
<pre class="pseudo">CAUSE       → pourquoi ?      (Étudie PARCE QUE aime)
BUT (finalité) → pour quel objectif ? (Étudie POUR réussir)
CONSÉQUENCE → résultat, donc  (A beaucoup étudié, DONC a réussi)</pre>
<h3>2. La cause (por qué)</h3>
<pre class="pseudo">porque + indicatif   = parce que
como (en tête)       = comme
ya que / puesto que  = puisque
a causa de + nom     = à cause de
por + nom/infinitif  = à cause de / pour (motif)
gracias a            = grâce à</pre>
<p>Exemple : <em>No salí porque estaba cansado</em> (Je ne suis pas sorti parce que j'étais fatigué). <em>Lo castigaron por llegar tarde</em> (On l'a puni pour être arrivé en retard).</p>
<h3>3. Le but / la finalité (para qué)</h3>
<pre class="pseudo">para + infinitif  = pour (même sujet)
        Estudio para aprobar. (J'étudie pour réussir)
para que + SUBJONCTIF = pour que (sujet différent)
        Te lo explico para que lo entiendas. (…pour que tu comprennes)
a fin de que + subj. = afin que</pre>
<div class="warn">Règle d'or : si le sujet est le <strong>même</strong> → <strong>para + infinitif</strong>. Si les sujets sont <strong>différents</strong> → <strong>para que + subjonctif</strong>. Compare : <em>Trabajo para ganar dinero</em> (moi/moi) ≠ <em>Trabajo para que mis hijos estudien</em> (moi/mes enfants).</div>
<h3>4. La conséquence (por eso)</h3>
<pre class="pseudo">por eso / por lo tanto = c'est pourquoi / par conséquent
así que                = donc, alors
de modo que / de manera que = de sorte que
tan… que / tanto… que  = tellement… que</pre>
<p>Exemple : <em>Estudió mucho, así que aprobó</em> (Il a beaucoup étudié, donc il a réussi). <em>Estaba tan cansado que se durmió</em> (Il était si fatigué qu'il s'est endormi).</p>
<div class="tip">Astuce pour distinguer cause et conséquence : la cause vient AVANT le résultat (No salí porque llovía), la conséquence vient APRÈS le fait (Llovía, por eso no salí). C'est la même idée dans l'autre sens.</div>
<h3>5. Résumé des mots-clés</h3>
<pre class="pseudo">CAUSE : porque, como, ya que, a causa de, por
BUT : para, para que + subj., a fin de que + subj.
CONSÉQUENCE : por eso, por lo tanto, así que, tan… que</pre>`,
  exercises: [
    { type: "qcm", q: "Quel connecteur exprime le BUT (la finalité) ?", opts: ["porque", "para que", "por eso", "ya que"], a: 1, exp: "Para que + subjonctif = pour que (but)." },
    { type: "input", q: "Complète (cause) : « No vino ___ estaba enfermo. » (parce que)", a: ["porque"], ph: "connecteur", exp: "Porque = parce que (cause)." },
    { type: "qcm", q: "Après « para que », quel mode utilise-t-on ?", opts: ["l'indicatif", "le subjonctif", "l'infinitif", "le conditionnel"], a: 1, exp: "Para que + subjonctif : para que lo entiendas." },
    { type: "vf", q: "Quand le sujet est le même, on utilise « para + infinitif ».", a: true, exp: "Vrai : Estudio para aprobar (même sujet)." },
    { type: "input", q: "Complète (but, sujets différents) : « Te ayudo para que ___ terminar. » (poder, tú)", a: ["puedas"], ph: "verbe", exp: "Para que + subjonctif : para que puedas." },
    { type: "qcm", q: "« Por eso » exprime :", opts: ["la cause", "le but", "la conséquence", "l'opposition"], a: 2, exp: "Por eso = c'est pourquoi (conséquence)." },
    { type: "vf", q: "« Estudio para aprobar » et « Estudio para que apruebes » ont le même sujet.", a: false, exp: "Faux : le 2e a des sujets différents (moi / toi) → subjonctif." },
    { type: "qcm", q: "Choisis la phrase correcte (même sujet) :", opts: ["Trabajo para que gane dinero", "Trabajo para ganar dinero", "Trabajo porque ganar dinero", "Trabajo para gano dinero"], a: 1, exp: "Même sujet → para + infinitif : Trabajo para ganar dinero." },
    { type: "input", q: "Complète (conséquence) : « Llovía, ___ que no salimos. » (donc)", a: ["así"], ph: "mot", exp: "Así que = donc (conséquence)." },
    { type: "qcm", q: "« Estaba tan cansado que se durmió. » Qu'exprime « tan… que » ?", opts: ["une cause", "une conséquence (intensité)", "un but", "une comparaison"], a: 1, exp: "Tan… que = tellement… que (conséquence)." },
    { type: "vf", q: "« Gracias a » exprime une cause positive.", a: true, exp: "Vrai : Gracias a tu ayuda, aprobé." },
    { type: "input", q: "Complète (but, même sujet) : « Ahorro dinero ___ viajar. » (pour)", a: ["para"], ph: "connecteur", exp: "Para + infinitif : para viajar." },
    { type: "qcm", q: "Compréhension : « Cerré la ventana para que no entrara el frío. » Pourquoi le subjonctif ?", opts: ["c'est une cause", "les sujets sont différents (yo / el frío)", "c'est une erreur", "c'est le passé"], a: 1, exp: "Para que + subjonctif car sujets différents." },
    { type: "qcm", q: "Compréhension : « Como no había entradas, nos quedamos en casa. » Quelle relation ?", opts: ["but", "cause → conséquence", "opposition", "comparaison"], a: 1, exp: "Como (cause) → nos quedamos (conséquence)." },
    { type: "input", q: "Complète (cause) : « Lo felicitaron ___ su esfuerzo. » (pour/à cause de)", a: ["por"], ph: "préposition", exp: "Por + nom = motif/cause : por su esfuerzo." }
  ],
  final: {
    title: "Exercice final — Motivos, objetivos y resultados",
    intro: `<p>Lis ce texte où se mêlent cause, but et conséquence :</p>
<pre class="pseudo">Marta decidió estudiar medicina.
Eligió esa carrera porque siempre le habían gustado las ciencias.
Estudiaba muchas horas cada día para aprobar todos los exámenes.
Sus padres trabajaban más para que ella pudiera pagar la universidad.
Como vivía lejos de la facultad, se levantaba muy temprano.
Estaba tan motivada que nunca faltaba a clase.
Gracias a su esfuerzo, terminó la carrera con muy buenas notas.
Por eso, hoy trabaja en el mejor hospital de la ciudad.
Ahora ayuda a otros jóvenes para que cumplan sus sueños.</pre>`,
    questions: [
      { type: "qcm", q: "Pourquoi Marta a-t-elle choisi médecine ? (cause)", opts: ["pour l'argent", "parce qu'elle avait toujours aimé les sciences", "par hasard", "pour voyager"], a: 1, exp: "Porque siempre le habían gustado las ciencias." },
      { type: "qcm", q: "Dans quel but étudiait-elle autant d'heures ?", opts: ["pour dormir", "pour réussir tous les examens", "parce qu'elle s'ennuyait", "pour ses parents"], a: 1, exp: "Estudiaba… para aprobar todos los exámenes (but)." },
      { type: "input", q: "Pourquoi ses parents travaillaient-ils plus ? Complète : « para que ella ___ pagar la universidad ». (poder)", a: ["pudiera"], ph: "verbe", exp: "Para que + subjonctif : para que pudiera pagar." },
      { type: "vf", q: "« Por eso, hoy trabaja en el mejor hospital » exprime une conséquence de son effort.", a: true, exp: "Por eso = conséquence." },
      { type: "qcm", q: "Dans quel but aide-t-elle maintenant d'autres jeunes ?", opts: ["pour gagner plus", "pour qu'ils réalisent leurs rêves", "parce qu'elle s'ennuie", "à cause du travail"], a: 1, exp: "Para que cumplan sus sueños (but, sujets différents → subjonctif)." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Marta a décidé d'étudier la médecine.
Elle a choisi cette filière parce qu'elle avait toujours aimé les sciences.
Elle étudiait de longues heures chaque jour pour réussir tous les examens.
Ses parents travaillaient plus pour qu'elle puisse payer l'université.
Comme elle habitait loin de la faculté, elle se levait très tôt.
Elle était si motivée qu'elle ne manquait jamais un cours.
Grâce à ses efforts, elle a terminé ses études avec de très bonnes notes.
C'est pourquoi elle travaille aujourd'hui dans le meilleur hôpital de la ville.
Maintenant elle aide d'autres jeunes pour qu'ils réalisent leurs rêves.</pre>
<p>Repère bien : cause (porque, como, gracias a), but (para + infinitif, para que + subjonctif) et conséquence (tan… que, por eso).</p>`
  }
};
</script>
