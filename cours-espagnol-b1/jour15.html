<script>
var DAY = {
  num: 15,
  title: "Les émotions et la personnalité",
  subtitle: "Décrire un caractère et exprimer ses sentiments avec précision.",
  theory: `
<h3>1. Les traits de personnalité (les adjectifs)</h3>
<p>Pour décrire un caractère, on emploie surtout <strong>ser</strong> + adjectif (trait durable). Les adjectifs s'accordent en genre et en nombre.</p>
<pre class="pseudo">Qualités :                    Défauts :
simpático/a   = sympathique    antipático/a  = antipathique
amable        = aimable        grosero/a     = grossier
generoso/a    = généreux       egoísta       = égoïste
trabajador/a  = travailleur    perezoso/a    = paresseux
honesto/a     = honnête        mentiroso/a   = menteur
paciente      = patient        impaciente    = impatient
tímido/a      = timide         orgulloso/a   = orgueilleux
alegre        = joyeux         serio/a       = sérieux</pre>
<div class="tip">Egoísta et optimista se terminent en -a mais valent pour le masculin ET le féminin : un chico egoísta, una chica egoísta. Seul le pluriel change (egoístas).</div>
<h3>2. Ser ou estar avec les états ?</h3>
<p>Distinction essentielle : <strong>ser</strong> décrit un trait permanent, <strong>estar</strong> un état passager (une humeur du moment).</p>
<pre class="pseudo">SER (caractère durable)        ESTAR (état momentané)
Es nervioso. = Il est nerveux  Está nervioso. = Il est (se sent) nerveux
(de nature).                    (là, maintenant).
Es alegre. = Il est gai        Está alegre. = Il est content
(de tempérament).               (en ce moment).</pre>
<h3>3. Le lexique des émotions</h3>
<pre class="pseudo">la alegría   = la joie        estar contento/a = être content
la tristeza  = la tristesse    estar triste     = être triste
el miedo     = la peur         tener miedo      = avoir peur
la rabia/ira = la colère       estar enfadado/a = être en colère
los nervios  = le stress       estar nervioso/a = être stressé
la vergüenza = la honte        dar vergüenza    = faire honte
la sorpresa  = la surprise     estar sorprendido/a = être surpris</pre>
<h3>4. Exprimer ses sentiments (verbes de type gustar)</h3>
<p>Beaucoup d'émotions se construisent comme gustar : le verbe s'accorde avec ce qui provoque l'émotion, précédé d'un pronom (me, te, le…).</p>
<pre class="pseudo">Me da miedo la oscuridad.   = L'obscurité me fait peur.
Me pone triste esa canción. = Cette chanson me rend triste.
Me alegra verte.            = Ça me réjouit de te voir.
Me molesta el ruido.        = Le bruit me dérange.
Me da vergüenza hablar en público. = Parler en public me gêne.</pre>
<div class="warn">Rappel du jour 2 : après un verbe d'émotion + que + autre sujet, on emploie le subjonctif. Me alegra que estés aquí (Je suis content que tu sois là).</div>
<h3>5. Nuancer avec des adverbes</h3>
<pre class="pseudo">un poco = un peu       Estoy un poco cansado.
bastante = assez       Es bastante tímida.
muy = très             Está muy contento.
demasiado = trop       Eres demasiado impaciente.
a veces = parfois      A veces estoy de mal humor.</pre>
<p>Exemples : <em>Mi hermana es muy generosa pero un poco impaciente</em> (Ma soeur est très généreuse mais un peu impatiente). <em>Hoy estoy bastante nervioso por el examen</em> (Aujourd'hui je suis assez stressé à cause de l'examen).</p>`,
  exercises: [
    { type: "qcm", q: "Pour décrire un trait de caractère durable, on emploie :", opts: ["estar", "ser", "tener", "haber"], a: 1, exp: "Ser + adjectif décrit un trait permanent : es simpático." },
    { type: "input", q: "Complète : Mi amigo ___ muy generoso (trait permanent). (ser)", a: ["es"], ph: "verbe", exp: "Ser pour un trait de caractère : es generoso." },
    { type: "qcm", q: "« Está nervioso » (par rapport à « es nervioso ») indique :", opts: ["un trait permanent", "un état passager du moment", "une profession", "un lieu"], a: 1, exp: "Estar = état momentané : está nervioso (il est stressé là, maintenant)." },
    { type: "input", q: "Traduis l'adjectif : paresseux (masc.) = ___ .", a: ["perezoso"], ph: "adjectif", exp: "Perezoso/a = paresseux/paresseuse." },
    { type: "qcm", q: "« Me da miedo la oscuridad » se construit comme :", opts: ["ser + adjectif", "le verbe gustar (accord avec la chose)", "un impératif", "un temps composé"], a: 1, exp: "Structure type gustar : me da miedo la oscuridad (l'obscurité me fait peur)." },
    { type: "input", q: "Complète (état momentané) : Hoy ___ muy contento. (estar, yo)", a: ["estoy"], ph: "verbe", exp: "État passager -> estar : estoy contento." },
    { type: "vf", q: "« Egoísta » a la même forme au masculin et au féminin singulier.", a: true, exp: "Vrai : un chico egoísta, una chica egoísta (invariable en genre au singulier)." },
    { type: "qcm", q: "Quel mot signifie « la honte » ?", opts: ["la alegría", "la vergüenza", "el miedo", "la sorpresa"], a: 1, exp: "La vergüenza = la honte ; dar vergüenza = faire honte/gêner." },
    { type: "input", q: "Complète : Me ___ triste esa película. (poner, 3e pers.)", a: ["pone"], ph: "verbe", exp: "Me pone triste = ça me rend triste (structure gustar)." },
    { type: "qcm", q: "Quel adjectif est un DÉFAUT ?", opts: ["amable", "honesto", "mentiroso", "generoso"], a: 2, exp: "Mentiroso = menteur (défaut)." },
    { type: "input", q: "Complète (accord fém.) : Mi hermana es muy ___ . (trabajador)", a: ["trabajadora"], ph: "adjectif", exp: "Trabajador -> trabajadora au féminin." },
    { type: "vf", q: "Après « me alegra que » + autre sujet, on emploie le subjonctif.", a: true, exp: "Vrai : verbe d'émotion + que + subjonctif : me alegra que estés aquí." },
    { type: "qcm", q: "Comprension : « Es alegre pero hoy está triste. » Que comprend-on ?", opts: ["Elle est toujours triste", "De nature elle est gaie, mais aujourd'hui elle est triste", "Elle n'a pas d'émotions", "Elle est en colère"], a: 1, exp: "Es alegre (caractère) vs está triste (état du jour) : le contraste ser/estar." },
    { type: "input", q: "Complète l'adverbe : Eres ___ impaciente. (trop)", a: ["demasiado"], ph: "adverbe", exp: "Demasiado = trop : eres demasiado impaciente." },
    { type: "qcm", q: "Comprension : « Me da vergüenza hablar en público. » Que ressent la personne ?", opts: ["de la joie", "de la gêne/honte à parler en public", "de la colère", "de la fierté"], a: 1, exp: "Dar vergüenza = gêner : parler en public la gêne." }
  ],
  final: {
    title: "Exercice final — Retrato de dos hermanos",
    intro: `<p>Marcos describe a sus dos hermanos :</p>
<pre class="pseudo">Mis dos hermanos son muy diferentes.
Pablo es alegre, generoso y bastante hablador.
A veces es un poco desordenado, pero siempre está de buen humor.
Elena es más seria y muy trabajadora.
Hoy está nerviosa porque tiene una entrevista importante.
A los dos les da vergüenza hablar en público, como a mí.</pre>`,
    questions: [
      { type: "qcm", q: "« Pablo es alegre » : ser indique ici :", opts: ["un état passager", "un trait de caractère durable", "un lieu", "une profession"], a: 1, exp: "Ser + adjectif = trait permanent (il est gai de nature)." },
      { type: "input", q: "Relève l'adjectif décrivant Elena avec « muy ___ » (travailleuse).", a: ["trabajadora"], ph: "adjectif", exp: "Muy trabajadora = très travailleuse (accord féminin)." },
      { type: "qcm", q: "« Hoy está nerviosa » : pourquoi estar et non ser ?", opts: ["c'est un trait permanent", "c'est un état momentané (aujourd'hui, à cause de l'entretien)", "c'est une faute", "c'est un lieu"], a: 1, exp: "Estar = état passager : hoy está nerviosa (aujourd'hui)." },
      { type: "vf", q: "« Les da vergüenza hablar en público » signifie que parler en public les gêne.", a: true, exp: "Vrai : dar vergüenza = gêner ; parler en public leur fait honte/les gêne." },
      { type: "input", q: "Complète : A veces Pablo es un poco ___ , pero está de buen humor. (désordonné)", a: ["desordenado"], ph: "adjectif", exp: "Desordenado = désordonné." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Mes deux frères et soeurs sont très différents.
Pablo est gai, généreux et assez bavard.
Parfois il est un peu désordonné, mais il est toujours de bonne humeur.
Elena est plus sérieuse et très travailleuse.
Aujourd'hui elle est nerveuse parce qu'elle a un entretien important.
Tous les deux sont gênés de parler en public, comme moi.</pre>
<p>Le portrait joue sur le contraste central : <strong>ser</strong> pour les traits de caractère (es alegre, es trabajadora) et <strong>estar</strong> pour les états passagers (está nerviosa, está de buen humor). Les émotions type gustar (les da vergüenza) et les adverbes de nuance (bastante, un poco, muy) affinent la description.</p>`
  }
};
</script>
