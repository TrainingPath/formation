<script>
var DAY = {
  num: 13,
  title: "Le vocabulaire du travail et le CV",
  subtitle: "Parler de son emploi et rédiger un currículum en espagnol.",
  theory: `
<h3>1. Le monde du travail : le lexique de base</h3>
<pre class="pseudo">el trabajo / el empleo     = le travail / l'emploi
el puesto (de trabajo)     = le poste
la empresa                 = l'entreprise
el jefe / la jefa          = le chef / la cheffe
el compañero de trabajo    = le collègue
el sueldo / el salario     = le salaire
la jornada laboral         = la journée de travail
el horario                 = les horaires
las vacaciones             = les congés / vacances
el contrato                = le contrat
el paro / estar en paro    = le chômage / être au chômage</pre>
<h3>2. Les verbes clés du travail</h3>
<pre class="pseudo">trabajar (en / de / como)  = travailler (dans / en tant que)
contratar                  = embaucher
despedir                   = licencier
dimitir                    = démissionner
jubilarse                  = partir à la retraite
ganar (dinero)             = gagner (de l'argent)
solicitar (un puesto)      = postuler (à un poste)
ascender                   = être promu
formarse                   = se former</pre>
<p>Exemples : <em>Trabajo como ingeniero en una empresa de energía</em> (Je travaille comme ingénieur dans une entreprise d'énergie). <em>Voy a solicitar ese puesto</em> (Je vais postuler à ce poste).</p>
<h3>3. Le CV : el currículum (vitae)</h3>
<p>Un CV espagnol s'organise en rubriques claires. Voici les intitulés à connaître :</p>
<pre class="pseudo">Datos personales      = État civil / coordonnées
Objetivo profesional  = Objectif professionnel
Formación académica   = Formation
Experiencia laboral   = Expérience professionnelle
Idiomas               = Langues
Informática / TIC     = Informatique
Aptitudes / Habilidades = Compétences
Otros datos de interés = Divers</pre>
<div class="tip">En Espagne, le CV se dit « currículum » (souvent abrégé « el currí »). Le pluriel savant est currícula, mais currículums est courant.</div>
<h3>4. Décrire sa formation et son expérience</h3>
<pre class="pseudo">Tengo un grado en Economía.        = J'ai une licence en économie.
Estudié un máster en Marketing.    = J'ai fait un master en marketing.
Tengo tres años de experiencia.    = J'ai trois ans d'expérience.
Trabajé como recepcionista.        = J'ai travaillé comme réceptionniste.
Me encargaba de la atención al cliente. = Je m'occupais du service client.
Soy responsable de un equipo.      = Je suis responsable d'une équipe.</pre>
<h3>5. Les langues et les compétences</h3>
<pre class="pseudo">Nivel de idiomas :
  nativo (langue maternelle) - bilingüe - avanzado (C1)
  intermedio (B1-B2) - básico (A1-A2)

Aptitudes fréquentes :
  trabajo en equipo   = travail d'équipe
  don de gentes       = sens du contact
  capacidad de organización = sens de l'organisation
  responsable, puntual, proactivo/a, resolutivo/a
  manejo de Office / programación</pre>
<p>Exemple : <em>Idiomas: español nativo, inglés avanzado (C1), francés intermedio (B1)</em>. <em>Soy una persona resolutiva y con buen trabajo en equipo</em> (Je suis quelqu'un d'efficace et bon en travail d'équipe).</p>`,
  exercises: [
    { type: "qcm", q: "« El sueldo » signifie :", opts: ["le poste", "le salaire", "le contrat", "le chômage"], a: 1, exp: "El sueldo (ou el salario) = le salaire." },
    { type: "input", q: "Complète : Trabajo ___ ingeniero en una empresa. (en tant que)", a: ["como", "de"], ph: "mot", exp: "Trabajar como / de + métier = travailler en tant que." },
    { type: "qcm", q: "« Solicitar un puesto » veut dire :", opts: ["licencier quelqu'un", "postuler à un poste", "démissionner", "partir à la retraite"], a: 1, exp: "Solicitar = postuler / faire une demande." },
    { type: "input", q: "Traduis le verbe : partir à la retraite = ___ .", a: ["jubilarse"], ph: "verbe", exp: "Jubilarse = partir à la retraite." },
    { type: "qcm", q: "Sur un CV, « Experiencia laboral » correspond à :", opts: ["la formation", "l'expérience professionnelle", "les langues", "l'objectif"], a: 1, exp: "Experiencia laboral = expérience professionnelle." },
    { type: "input", q: "Complète : Tengo tres años de ___ como profesor. (expérience)", a: ["experiencia"], ph: "nom", exp: "Experiencia = expérience." },
    { type: "vf", q: "« Estar en paro » signifie être au chômage.", a: true, exp: "Vrai : el paro = le chômage ; estar en paro = être au chômage." },
    { type: "qcm", q: "Quel mot désigne « le collègue » ?", opts: ["el jefe", "el compañero de trabajo", "el cliente", "el contrato"], a: 1, exp: "El compañero de trabajo = le collègue." },
    { type: "input", q: "Complète la rubrique de CV : « ___ académica » = Formation.", a: ["Formación", "formación"], ph: "mot", exp: "Formación académica = formation (études)." },
    { type: "qcm", q: "« Despedir » signifie :", opts: ["embaucher", "licencier", "promouvoir", "former"], a: 1, exp: "Despedir = licencier (à ne pas confondre avec despedirse = dire au revoir)." },
    { type: "input", q: "Complète : En el CV, la sección « ___ » indica español, inglés, francés.", a: ["Idiomas", "idiomas"], ph: "mot", exp: "Idiomas = langues." },
    { type: "vf", q: "« Nivel intermedio » correspond environ au niveau B1-B2.", a: true, exp: "Vrai : intermedio = intermédiaire (B1-B2)." },
    { type: "qcm", q: "Comprension : « Me encargaba de la atención al cliente. » Que faisait la personne ?", opts: ["elle dirigeait l'entreprise", "elle s'occupait du service client", "elle était au chômage", "elle cherchait un emploi"], a: 1, exp: "Encargarse de = s'occuper de ; atención al cliente = service client." },
    { type: "input", q: "Traduis : embaucher = ___ .", a: ["contratar"], ph: "verbe", exp: "Contratar = embaucher / recruter." },
    { type: "qcm", q: "Comprension : « Soy una persona resolutiva y puntual. » Comment se décrit-elle ?", opts: ["paresseuse et en retard", "efficace et ponctuelle", "timide et lente", "sans expérience"], a: 1, exp: "Resolutiva = efficace/débrouillarde ; puntual = ponctuelle." }
  ],
  final: {
    title: "Exercice final — Un currículum breve",
    intro: `<p>Lee este currículum resumido :</p>
<pre class="pseudo">Datos personales : Laura Gómez, 28 años, Madrid.
Objetivo : trabajar como responsable de marketing digital.
Formación : grado en Publicidad y máster en Marketing.
Experiencia : tres años en una agencia; me encargaba de las redes sociales.
Idiomas : español nativo, inglés avanzado (C1), francés básico.
Aptitudes : creatividad, trabajo en equipo y capacidad de organización.</pre>`,
    questions: [
      { type: "qcm", q: "Quel poste vise Laura ?", opts: ["professeure", "responsable de marketing digital", "réceptionniste", "ingénieure"], a: 1, exp: "Objetivo : responsable de marketing digital." },
      { type: "input", q: "Combien d'années d'expérience a-t-elle ? (en chiffres)", a: ["3", "tres"], ph: "nombre", exp: "Tres años en una agencia = 3 ans d'expérience." },
      { type: "qcm", q: "De quoi s'occupait-elle dans l'agence ?", opts: ["de la comptabilité", "des réseaux sociaux", "du recrutement", "du ménage"], a: 1, exp: "Me encargaba de las redes sociales = elle gérait les réseaux sociaux." },
      { type: "vf", q: "Son niveau d'anglais est avancé (C1).", a: true, exp: "Inglés avanzado (C1) = anglais niveau avancé." },
      { type: "input", q: "Relève une aptitude citée qui commence par « trabajo en ___ ».", a: ["equipo"], ph: "mot", exp: "Trabajo en equipo = travail d'équipe." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">État civil : Laura Gómez, 28 ans, Madrid.
Objectif : travailler comme responsable de marketing digital.
Formation : licence en publicité et master en marketing.
Expérience : trois ans dans une agence ; je m'occupais des réseaux sociaux.
Langues : espagnol langue maternelle, anglais avancé (C1), français élémentaire.
Compétences : créativité, travail d'équipe et sens de l'organisation.</pre>
<p>Un CV espagnol s'articule autour de rubriques fixes (datos personales, objetivo, formación, experiencia, idiomas, aptitudes). Le vocabulaire du travail (encargarse de, responsable, experiencia) et les niveaux de langue (nativo, avanzado, básico) sont les briques essentielles pour se présenter.</p>`
  }
};
</script>
