<h3>1. Le subjonctif : quand l'utiliser ?</h3>
<p>Le subjonctif est le cœur du niveau B1. On le retrouve après :</p>
<pre class="pseudo">Volonté / souhait : Quiero que vengas. Espero que llueva.
Émotion :          Me alegro de que estés aquí.
Doute / négation d'opinion : No creo que sea verdad.
But (sujet diff.) : Te lo explico para que lo entiendas.
Ojalá :            Ojalá haga buen tiempo.
Cuando + futur :   Cuando llegues, llámame.</pre>
<div class="tip">Astuce : après un verbe d'opinion à la forme <strong>affirmative</strong> → indicatif (Creo que es); à la forme <strong>négative</strong> → subjonctif (No creo que sea).</div>
<h3>2. Les temps du passé</h3>
<pre class="pseudo">Indefinido   → action ponctuelle : Ayer comí paella.
Imperfecto   → décor / habitude : Antes vivía en Madrid.
Perfecto     → passé lié au présent : Hoy he comido bien.
Pluscuamperfecto → antériorité : Ya había salido cuando llegaste.</pre>
<h3>3. Por et para (rappel express)</h3>
<pre class="pseudo">POR  : cause, échange, lieu de passage, durée
       Gracias por venir. Paseo por el parque.
PARA : but, destinataire, direction, échéance
       Es para ti. Estudio para aprobar. Salgo para Madrid.</pre>
<h3>4. Ser / estar et le style indirect</h3>
<pre class="pseudo">SER : identité, qualité durable. ESTAR : état, lieu, résultat.
Style indirect : Dijo que + concordance des temps.
 « Voy » → Dijo que iba.  « Vendré » → Dijo que vendría.</pre>
<h3>5. Les connecteurs essentiels</h3>
<pre class="pseudo">Cause : porque, como, ya que, gracias a
Conséquence : por eso, así que, por lo tanto
Opposition : pero, sin embargo, aunque, a pesar de
Addition : además, también, por un lado… por otro
Conclusion : en resumen, por último, finalmente</pre>
<div class="warn">Points à surveiller à l'examen : l'accord du subjonctif, por/para, ser/estar avec les adjectifs qui changent de sens, et l'emploi des connecteurs pour structurer un texte.</div>`,

    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Quand j'étais petit, je vivais dans un village tranquille.
Mes parents voulaient que j'étudie beaucoup pour avoir un bon avenir.
Un jour j'ai décidé de m'installer en ville, même si cela me faisait un peu peur.
J'ai appris beaucoup de choses depuis.
Je ne crois pas qu'il existe une décision parfaite,
mais je suis sûr d'avoir bien fait.
Grâce à ce changement, aujourd'hui je travaille dans ce qui me plaît.
Pourvu que les jeunes osent suivre leurs rêves.
Quand j'aurai le temps, je retournerai au village pour rendre visite à ma famille.</pre>
<p>Ce texte réunit : imperfecto (era, vivía), subjonctif de volonté (que estudiara), concession (aunque), perfecto (he aprendido), opinion niée (no creo que exista), Ojalá + subjonctif, et cuando + subjonctif pour le futur.</p>`
