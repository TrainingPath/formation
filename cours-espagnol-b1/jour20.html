<script>
var DAY = {
  num: 20,
  title: "Les connecteurs logiques avancés",
  subtitle: "Relier ses idées avec précision : cause, conséquence, opposition, addition.",
  theory: `
<h3>1. Pourquoi les connecteurs ?</h3>
<p>Au niveau B1, on n'aligne plus des phrases courtes : on les <strong>relie</strong>. Les connecteurs (los conectores) donnent de la fluidité et montrent la logique de ton raisonnement. On les classe par fonction.</p>
<h3>2. La cause (pourquoi ?)</h3>
<pre class="pseudo">porque          = parce que
como            = comme (en tête de phrase)
ya que / puesto que = puisque, étant donné que
debido a        = en raison de
gracias a       = grâce à
a causa de      = à cause de</pre>
<p>Exemples : <em>Como llovía, no salimos</em> (Comme il pleuvait, nous ne sommes pas sortis). <em>No fui a causa del tráfico</em> (Je n'y suis pas allé à cause du trafic).</p>
<div class="tip">Astuce : <strong>como</strong> se place en début de phrase, alors que <strong>porque</strong> se place au milieu. <em>Como estaba cansado, me acosté</em> = <em>Me acosté porque estaba cansado</em>.</div>
<h3>3. La conséquence (donc)</h3>
<pre class="pseudo">por eso / por esto   = c'est pourquoi
por lo tanto         = par conséquent
así que              = donc, alors
de modo que          = de sorte que
en consecuencia      = en conséquence
entonces             = alors</pre>
<p>Exemple : <em>Estudió mucho, por lo tanto aprobó el examen</em> (Il a beaucoup étudié, par conséquent il a réussi l'examen).</p>
<h3>4. L'opposition et la concession</h3>
<pre class="pseudo">pero              = mais
sin embargo       = cependant
no obstante       = néanmoins
aunque + indic.   = bien que (fait réel)
aunque + subj.    = même si (hypothèse)
a pesar de        = malgré
en cambio         = en revanche</pre>
<p>Exemple : <em>Aunque hace frío, salgo</em> (Bien qu'il fasse froid, je sors). <em>Aunque haga frío, saldré</em> (Même s'il fait froid, je sortirai).</p>
<div class="warn">Nuance importante : <strong>aunque + indicatif</strong> = fait réel connu ; <strong>aunque + subjonctif</strong> = hypothèse ou concession. Compare : <em>Aunque es caro, lo compro</em> (c'est cher, je le sais) / <em>Aunque sea caro, lo compraré</em> (même si c'est cher, peu importe).</div>
<h3>5. L'addition et l'organisation</h3>
<pre class="pseudo">además            = de plus
también           = aussi
en primer lugar…  = premièrement…
por un lado… por otro = d'un côté… de l'autre
finalmente / por último = enfin
en resumen        = en résumé</pre>
<p>Exemple : <em>En primer lugar, es barato; además, es práctico</em> (Premièrement, c'est bon marché ; de plus, c'est pratique).</p>`,
  exercises: [
    { type: "qcm", q: "Quel connecteur exprime la cause ?", opts: ["por eso", "ya que", "sin embargo", "además"], a: 1, exp: "Ya que = puisque (cause)." },
    { type: "input", q: "Complète (cause) : « No salí ___ estaba enfermo. » (parce que)", a: ["porque"], ph: "connecteur", exp: "Porque = parce que." },
    { type: "qcm", q: "« Por lo tanto » exprime :", opts: ["une cause", "une conséquence", "une opposition", "une addition"], a: 1, exp: "Por lo tanto = par conséquent (conséquence)." },
    { type: "vf", q: "« Como » se place en général au début de la phrase pour exprimer la cause.", a: true, exp: "Vrai : Como llovía, no salimos." },
    { type: "input", q: "Complète (conséquence) : « Llovía, ___ eso nos quedamos en casa. »", a: ["por"], ph: "mot", exp: "Por eso = c'est pourquoi." },
    { type: "qcm", q: "« Sin embargo » exprime :", opts: ["la cause", "l'opposition", "l'addition", "la conséquence"], a: 1, exp: "Sin embargo = cependant (opposition)." },
    { type: "vf", q: "« Aunque » suivi du subjonctif exprime une hypothèse ou concession.", a: true, exp: "Vrai : Aunque haga frío, saldré." },
    { type: "qcm", q: "Choisis la bonne phrase : fait réel connu (il fait froid, je le sais).", opts: ["Aunque haga frío, salgo", "Aunque hace frío, salgo", "Aunque hiciera frío", "Aunque haría frío"], a: 1, exp: "Fait réel → aunque + indicatif : Aunque hace frío, salgo." },
    { type: "input", q: "Complète (addition) : « Es barato; ___, es práctico. » (de plus)", a: ["además"], ph: "connecteur", exp: "Además = de plus." },
    { type: "qcm", q: "Quel connecteur signifie « malgré » ?", opts: ["gracias a", "a pesar de", "por eso", "así que"], a: 1, exp: "A pesar de = malgré." },
    { type: "vf", q: "« Gracias a » exprime une cause positive (grâce à).", a: true, exp: "Vrai : Gracias a ti, aprobé." },
    { type: "input", q: "Complète (opposition) : « Es caro, ___ embargo lo compro. »", a: ["sin"], ph: "mot", exp: "Sin embargo = cependant." },
    { type: "qcm", q: "Compréhension : « Como no tenía dinero, no fui de vacaciones. » Quelle relation logique ?", opts: ["opposition", "cause → conséquence", "addition", "comparaison"], a: 1, exp: "Como (cause) → no fui (conséquence)." },
    { type: "qcm", q: "Compréhension : « Estudió poco; no obstante, aprobó. » Qu'exprime « no obstante » ?", opts: ["une cause", "une opposition (néanmoins)", "une addition", "une conclusion"], a: 1, exp: "No obstante = néanmoins (opposition)." },
    { type: "input", q: "Complète (organisation) : « En primer ___, hablaremos del clima. » (premièrement)", a: ["lugar"], ph: "mot", exp: "En primer lugar = premièrement." }
  ],
  final: {
    title: "Exercice final — Un texto bien conectado",
    intro: `<p>Lis ce court texte argumentatif et observe les connecteurs :</p>
<pre class="pseudo">Muchas personas prefieren vivir en el campo.
En primer lugar, el aire es más limpio que en la ciudad.
Además, la vida es más tranquila y hay menos ruido.
Sin embargo, vivir en el campo también tiene inconvenientes.
Por un lado, hay menos servicios; por otro lado, las distancias son grandes.
Como no siempre hay transporte público, mucha gente necesita coche.
A pesar de estos problemas, cada vez más familias se mudan al campo.
Por lo tanto, la vida rural se está poniendo de moda.
En resumen, todo depende de las prioridades de cada uno.</pre>`,
    questions: [
      { type: "qcm", q: "Quel connecteur ouvre le premier argument ?", opts: ["Sin embargo", "En primer lugar", "Por lo tanto", "A pesar de"], a: 1, exp: "En primer lugar = premièrement (organisation)." },
      { type: "qcm", q: "« Sin embargo » sert ici à :", opts: ["ajouter un avantage", "introduire les inconvénients (opposition)", "conclure", "donner une cause"], a: 1, exp: "Sin embargo introduit l'opposition (les inconvénients)." },
      { type: "input", q: "Pourquoi beaucoup ont besoin d'une voiture ? Complète : « Como no siempre hay ___ público. »", a: ["transporte"], ph: "mot", exp: "Como no siempre hay transporte público (cause)." },
      { type: "vf", q: "« A pesar de estos problemas » exprime une concession (malgré).", a: true, exp: "Vrai : a pesar de = malgré." },
      { type: "qcm", q: "Quel connecteur introduit la conclusion finale ?", opts: ["Además", "En resumen", "Por un lado", "Como"], a: 1, exp: "En resumen = en résumé (conclusion)." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Beaucoup de gens préfèrent vivre à la campagne.
Premièrement, l'air y est plus pur qu'en ville.
De plus, la vie est plus tranquille et il y a moins de bruit.
Cependant, vivre à la campagne a aussi des inconvénients.
D'un côté, il y a moins de services ; de l'autre, les distances sont grandes.
Comme il n'y a pas toujours de transport public, beaucoup ont besoin d'une voiture.
Malgré ces problèmes, de plus en plus de familles déménagent à la campagne.
Par conséquent, la vie rurale devient à la mode.
En résumé, tout dépend des priorités de chacun.</pre>
<p>Ce texte montre l'usage combiné des connecteurs d'addition (además), d'opposition (sin embargo, a pesar de), de cause (como) et de conséquence (por lo tanto), plus la conclusion (en resumen).</p>`
  }
};
</script>
