<script>
var DAY = {
  num: 8,
  title: "Le style indirect",
  subtitle: "Rapporter les paroles d'autrui : « Il dit que… », « Il a dit que… » et la concordance des temps.",
  theory: `
<h3>1. Style direct et style indirect</h3>
<p>Le <strong>style direct</strong> rapporte les paroles telles quelles, entre guillemets : <em>María dice : « Estoy cansada »</em>. Le <strong>style indirect</strong> (estilo indirecto) les intègre dans la phrase avec <strong>que</strong> : <em>María dice que está cansada</em> (María dit qu'elle est fatiguée).</p>
<pre class="pseudo">Direct :   Juan dice : « Tengo hambre. »
Indirect : Juan dice que tiene hambre.
           = Juan dit qu'il a faim.</pre>
<h3>2. Quand le verbe introducteur est au PRÉSENT</h3>
<p>Si le verbe qui introduit (dice, pregunta, explica…) est au présent ou au futur, les temps de la citation ne changent pas : on adapte seulement les personnes et les possessifs.</p>
<pre class="pseudo">« Estoy en casa »  -> Dice que está en casa.
« Vendré mañana »  -> Dice que vendrá mañana.
« Compré un coche » -> Dice que compró un coche.</pre>
<h3>3. Quand le verbe introducteur est au PASSÉ : la concordance</h3>
<p>C'est le coeur de la leçon. Si le verbe introducteur est au passé (dijo, explicó, preguntó…), les temps de la citation <strong>reculent</strong> d'un cran vers le passé. Voici le tableau des transformations :</p>
<pre class="pseudo">Style direct (présent)     ->  Style indirect (passé)
presente        (está)     ->  imperfecto      (estaba)
pret. perfecto  (ha ido)   ->  pluscuamperf.   (había ido)
indefinido      (fue)      ->  pluscuamperf.   (había ido)
futuro          (vendrá)   ->  condicional     (vendría)
imperativo      (ven)      ->  subj. imperf.   (que viniera)</pre>
<pre class="pseudo">« Estoy cansada »   -> Dijo que estaba cansada.
« Vendré »          -> Dijo que vendría.
« He terminado »    -> Dijo que había terminado.</pre>
<div class="tip">Retiens la logique : un verbe introducteur au passé « tire » tout vers le passé. Présent -> imparfait ; futur -> conditionnel ; passé composé/simple -> plus-que-parfait.</div>
<h3>4. Les changements de mots (déictiques)</h3>
<p>Les repères de temps et de lieu changent aussi, car on ne parle plus au même moment ni au même endroit :</p>
<pre class="pseudo">hoy      -> aquel día / ese día      (aujourd'hui -> ce jour-là)
ahora    -> entonces / en ese momento (maintenant -> à ce moment-là)
mañana   -> al día siguiente         (demain -> le lendemain)
ayer     -> el día anterior          (hier -> la veille)
aquí     -> allí                     (ici -> là-bas)
este     -> aquel / ese              (ce...-ci -> ce...-là)</pre>
<h3>5. Verbes introducteurs utiles</h3>
<pre class="pseudo">decir que      = dire que
contar que     = raconter que
explicar que   = expliquer que
comentar que   = faire remarquer que
añadir que     = ajouter que
responder que  = répondre que</pre>
<p>Exemple complet : Direct <em>« Mañana iré al médico »</em> -> Indirect au passé <em>Dijo que al día siguiente iría al médico</em> (Il a dit que le lendemain il irait chez le médecin).</p>`,
  exercises: [
    { type: "qcm", q: "Le style indirect relie les paroles rapportées avec :", opts: ["deux points", "que", "des guillemets", "un tiret"], a: 1, exp: "On introduit la subordonnée avec que : dice que tiene hambre." },
    { type: "input", q: "Direct : « Estoy en casa ». Indirect (présent) : Dice que ___ en casa.", a: ["está", "esta"], ph: "verbe", exp: "Verbe introducteur au présent : le temps ne change pas (está)." },
    { type: "qcm", q: "Verbe introducteur au PASSÉ : le présent de la citation devient :", opts: ["le futur", "l'imparfait", "le conditionnel", "le subjonctif"], a: 1, exp: "Présent -> imparfait : « estoy » -> dijo que estaba." },
    { type: "input", q: "Direct : « Estoy cansada ». Indirect : Dijo que ___ cansada. (concordance)", a: ["estaba"], ph: "verbe", exp: "Présent (estoy) -> imparfait (estaba) car dijo est au passé." },
    { type: "qcm", q: "Le futur « vendré » devient au style indirect passé :", opts: ["vendría (conditionnel)", "vino", "venga", "venía"], a: 0, exp: "Futur -> conditionnel : « vendré » -> dijo que vendría." },
    { type: "input", q: "Direct : « He terminado ». Indirect : Dijo que ___ terminado. (haber, imparfait)", a: ["había", "habia"], ph: "auxiliaire", exp: "Passé composé -> plus-que-parfait : había terminado." },
    { type: "vf", q: "Avec un verbe introducteur au présent (dice que), les temps de la citation ne changent pas.", a: true, exp: "Vrai : la concordance ne s'applique qu'avec un introducteur au passé." },
    { type: "qcm", q: "« Mañana » devient au style indirect passé :", opts: ["hoy", "al día siguiente", "ayer", "ahora"], a: 1, exp: "Mañana -> al día siguiente (le lendemain)." },
    { type: "input", q: "Direct : « Vendré mañana ». Indirect : Dijo que ___ al día siguiente. (venir, conditionnel)", a: ["vendría", "vendria"], ph: "verbe", exp: "Futur -> conditionnel : vendría." },
    { type: "qcm", q: "Quelle transformation est correcte ?", opts: ["« Estoy » -> dijo que estoy", "« Estoy » -> dijo que estaba", "« Estoy » -> dijo que estaré", "« Estoy » -> dijo que esté"], a: 1, exp: "Présent -> imparfait avec introducteur au passé." },
    { type: "input", q: "Direct : « Compré un coche ». Indirect : Dijo que ___ comprado un coche. (haber, imparfait)", a: ["había", "habia"], ph: "auxiliaire", exp: "Indefinido -> plus-que-parfait : había comprado." },
    { type: "vf", q: "« Ahora » devient « entonces » au style indirect passé.", a: true, exp: "Vrai : ahora (maintenant) -> entonces / en ese momento." },
    { type: "qcm", q: "Comprension : « Pedro dijo que estaba enfermo y que no vendría. » Qu'a dit Pedro ?", opts: ["Il est en bonne santé et vient", "Il était malade et ne viendrait pas", "Il viendra demain", "Il n'est jamais malade"], a: 1, exp: "estaba enfermo + no vendría : il a dit qu'il était malade et ne viendrait pas." },
    { type: "input", q: "Direct : « Te llamaré ». Indirect : Me dijo que me ___ . (llamar, conditionnel)", a: ["llamaría", "llamaria"], ph: "verbe", exp: "Futur -> conditionnel : llamaría." },
    { type: "qcm", q: "Comprension : « Ana contó que había viajado a Perú el año anterior. » Quand a-t-elle voyagé ?", opts: ["cette année", "l'année d'avant le moment du récit", "l'année prochaine", "jamais"], a: 1, exp: "había viajado + el año anterior : l'année précédant le moment rapporté." }
  ],
  final: {
    title: "Exercice final — Lo que dijo el jefe",
    intro: `<p>Un empleado cuenta a un compañero lo que le dijo el jefe en la reunión :</p>
<pre class="pseudo">El jefe dijo que la empresa estaba creciendo mucho.
Explicó que necesitábamos contratar a más gente.
Comentó que había firmado un contrato importante el mes anterior.
Añadió que al día siguiente tendríamos una reunión más larga.
Dijo que él confiaba en el equipo.
Y respondió que nos daría más detalles pronto.</pre>`,
    questions: [
      { type: "qcm", q: "« El jefe dijo que la empresa estaba creciendo » : la citation directe était probablement :", opts: ["« La empresa crecía »", "« La empresa está creciendo »", "« La empresa creció »", "« La empresa crecerá »"], a: 1, exp: "Imparfait au discours indirect (estaba) <- présent au direct (está creciendo)." },
      { type: "input", q: "Relève le conditionnel : Añadió que al día siguiente ___ una reunión. (tener)", a: ["tendríamos", "tendriamos"], ph: "verbe", exp: "Futur (tendremos) -> conditionnel (tendríamos)." },
      { type: "qcm", q: "« había firmado un contrato el mes anterior » correspond au direct :", opts: ["« Firmaré un contrato »", "« Firmé un contrato el mes pasado »", "« Firmo contratos »", "« Firmaba contratos »"], a: 1, exp: "Indefinido + el mes pasado -> plus-que-parfait + el mes anterior." },
      { type: "vf", q: "« al día siguiente » correspond à « mañana » du discours direct.", a: true, exp: "Vrai : mañana devient al día siguiente au style indirect passé." },
      { type: "input", q: "Complète : Dijo que él ___ (confiar, imparfait) en el equipo.", a: ["confiaba"], ph: "verbe", exp: "Présent (confío) -> imparfait (confiaba)." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Le chef a dit que l'entreprise grandissait beaucoup.
Il a expliqué qu'il fallait embaucher plus de monde.
Il a fait remarquer qu'il avait signé un contrat important le mois précédent.
Il a ajouté que le lendemain nous aurions une réunion plus longue.
Il a dit qu'il faisait confiance à l'équipe.
Et il a répondu qu'il nous donnerait plus de détails bientôt.</pre>
<p>Le verbe introducteur au passé (dijo, explicó, comentó, añadió) fait reculer tous les temps : présent -> imparfait (estaba, confiaba), futur -> conditionnel (tendríamos, daría), passé -> plus-que-parfait (había firmado). Et « mañana » devient « al día siguiente ».</p>`
  }
};
</script>
