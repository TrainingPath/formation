<script>
var DAY = {
  num: 10,
  title: "La voix passive et la passive réfléchie",
  subtitle: "« La maison a été construite… » : dire les choses du point de vue de l'action subie.",
  theory: `
<h3>1. Voix active et voix passive</h3>
<p>À la voix <strong>active</strong>, le sujet fait l'action : <em>El arquitecto diseñó la casa</em> (L'architecte a conçu la maison). À la voix <strong>passive</strong>, le sujet subit l'action : <em>La casa fue diseñada por el arquitecto</em> (La maison a été conçue par l'architecte). Ce qui était complément d'objet devient sujet.</p>
<pre class="pseudo">Active :  El arquitecto  diseñó  la casa.
                sujet     verbe   objet
Passive : La casa  fue diseñada  por el arquitecto.
           sujet    ser+part.     complément d'agent</pre>
<h3>2. La passive avec ser + participe</h3>
<p>La voix passive se forme avec le verbe <strong>ser</strong> (au temps voulu) + le <strong>participe passé</strong>, qui ici <strong>s'accorde</strong> en genre et en nombre avec le sujet. L'auteur de l'action est introduit par <strong>por</strong>.</p>
<pre class="pseudo">ser (temps voulu) + participe ACCORDÉ + por + agent
La carta fue escrita por María.      (fem. sing. -> escrita)
Los libros fueron vendidos ayer.     (masc. plur. -> vendidos)
La ley será aprobada mañana.         (futur -> será aprobada)</pre>
<div class="warn">Ici le participe s'accorde (escrita, vendidos), à la différence des temps composés avec haber (había escrito, invariable). Ne confonds pas les deux structures !</div>
<h3>3. La passive réfléchie avec se : la plus fréquente</h3>
<p>En espagnol courant, la passive avec ser sonne souvent formelle. On lui préfère très souvent la <strong>passive réfléchie</strong> (la pasiva refleja) construite avec <strong>se</strong> + verbe à la 3e personne, accordé avec le sujet.</p>
<pre class="pseudo">se + verbe (3e pers.) accordé avec le sujet
Se venden pisos.            = On vend des appartements. / Des appartements sont vendus.
Se habla español aquí.     = On parle espagnol ici.
Se construyeron muchas casas. = Beaucoup de maisons ont été construites.</pre>
<div class="tip">Accord : si le sujet est pluriel, le verbe est au pluriel. « Se vende piso » (un seul) mais « Se venden pisos » (plusieurs). C'est l'espagnol des petites annonces et des panneaux.</div>
<h3>4. Le se impersonnel</h3>
<p>Proche mais différent : le <strong>se impersonnel</strong> exprime « on » de façon générale, sans sujet précis, avec le verbe toujours au <strong>singulier</strong>.</p>
<pre class="pseudo">Se come muy bien en este restaurante.
= On mange très bien dans ce restaurant.
En España se cena tarde.
= En Espagne, on dîne tard.</pre>
<h3>5. Quand utiliser quoi ?</h3>
<pre class="pseudo">- Passive ser + participe : style formel, écrit, presse.
    El presidente fue elegido en 2023.
- Passive refleja (se + verbe) : la plus naturelle à l'oral.
    Se eligió al presidente en 2023.
- Se impersonnel : généralité, « on » sans sujet.
    Aquí se trabaja mucho.</pre>
<p>Au B1, retiens surtout la <strong>passive refleja</strong> (se venden, se hablan, se necesita) : c'est la forme la plus utile au quotidien.</p>`,
  exercises: [
    { type: "qcm", q: "La voix passive avec ser se forme avec :", opts: ["ser + gérondif", "ser + participe passé accordé", "haber + participe", "estar + infinitif"], a: 1, exp: "Ser + participe passé, qui s'accorde avec le sujet : fue escrita." },
    { type: "input", q: "Complète (accord) : La carta fue ___ por María. (escribir)", a: ["escrita"], ph: "participe", exp: "Le participe s'accorde : la carta (fém. sing.) -> escrita." },
    { type: "qcm", q: "Dans la passive, l'auteur de l'action est introduit par :", opts: ["para", "con", "por", "de"], a: 2, exp: "L'agent est introduit par por : fue diseñada por el arquitecto." },
    { type: "input", q: "Passive refleja : ___ venden pisos en esta zona. (se + verbe)", a: ["se"], ph: "pronom", exp: "Se venden pisos = passive réfléchie (pisos pluriel -> venden)." },
    { type: "qcm", q: "« Se venden pisos » : pourquoi venden au pluriel ?", opts: ["c'est une faute", "le sujet pisos est pluriel, le verbe s'accorde", "se est pluriel", "c'est un temps composé"], a: 1, exp: "La passive refleja accorde le verbe avec le sujet : pisos -> venden." },
    { type: "input", q: "Complète : Aquí se ___ español. (hablar, 1 sujet : español)", a: ["habla"], ph: "verbe", exp: "Se habla español : sujet singulier -> habla." },
    { type: "vf", q: "Dans la passive avec ser, le participe s'accorde en genre et en nombre.", a: true, exp: "Vrai : fue escrita, fueron vendidos (accord avec le sujet)." },
    { type: "qcm", q: "Quelle phrase est une passive refleja correcte ?", opts: ["Se vende pisos", "Se venden pisos", "Se vender pisos", "Se vendido pisos"], a: 1, exp: "Sujet pluriel (pisos) -> verbe pluriel : se venden pisos." },
    { type: "input", q: "Passive : Los libros ___ vendidos ayer. (ser, indefinido, pluriel)", a: ["fueron"], ph: "verbe", exp: "Fueron vendidos : ser à l'indefinido pluriel." },
    { type: "qcm", q: "« Se come bien aquí » est un exemple de :", opts: ["passive avec ser", "se impersonnel (généralité)", "temps composé", "impératif"], a: 1, exp: "Se impersonnel : on mange bien ici (verbe au singulier)." },
    { type: "input", q: "Transforme à l'actif -> passive refleja : « Construyeron muchas casas » -> ___ construyeron muchas casas.", a: ["se"], ph: "pronom", exp: "Se construyeron muchas casas (passive réfléchie au passé)." },
    { type: "vf", q: "« Se necesita camarero » (une seule offre) a le verbe au singulier.", a: true, exp: "Vrai : sujet singulier (camarero) -> se necesita." },
    { type: "qcm", q: "Comprension : « La novela fue escrita en 1950 por un autor desconocido. » Qui a écrit le roman ?", opts: ["on ne sait pas exactement (auteur inconnu)", "un lecteur", "un traducteur", "personne"], a: 0, exp: "Por un autor desconocido = par un auteur inconnu." },
    { type: "input", q: "Complète (accord) : Las casas fueron ___ el año pasado. (construir)", a: ["construidas"], ph: "participe", exp: "Las casas (fém. plur.) -> construidas." },
    { type: "qcm", q: "Comprension : « En este pueblo se vive muy tranquilo. » Que veut dire cette phrase ?", opts: ["Le village est vendu", "On y vit très tranquillement", "Personne n'y habite", "Le village construit des maisons"], a: 1, exp: "Se vive tranquilo = se impersonnel : on y vit tranquillement." }
  ],
  final: {
    title: "Exercice final — Noticias breves",
    intro: `<p>Titulares y frases de un periódico local :</p>
<pre class="pseudo">El nuevo puente fue inaugurado ayer por el alcalde.
Se construyeron más de mil viviendas el año pasado.
La ley será aprobada la próxima semana.
En la región se producen aceite y vino de gran calidad.
Los premios fueron entregados en una ceremonia sencilla.
Se busca personal para la nueva fábrica.</pre>`,
    questions: [
      { type: "qcm", q: "« El nuevo puente fue inaugurado por el alcalde » est :", opts: ["une passive avec ser", "une passive refleja", "un se impersonnel", "une phrase active"], a: 0, exp: "Ser (fue) + participe accordé (inaugurado) + por = passive classique." },
      { type: "input", q: "Relève le pronom de la passive refleja : ___ construyeron más de mil viviendas.", a: ["se"], ph: "pronom", exp: "Se construyeron : passive réfléchie au pluriel." },
      { type: "qcm", q: "« La ley será aprobada » est à quel temps (passive) ?", opts: ["passé", "présent", "futur", "conditionnel"], a: 2, exp: "Será aprobada : ser au futur -> passive au futur." },
      { type: "vf", q: "« Se busca personal » a le verbe au singulier car personal est un sujet singulier.", a: true, exp: "Vrai : sujet singulier -> se busca (on cherche du personnel)." },
      { type: "input", q: "Complète (accord) : Los premios fueron ___ en una ceremonia. (entregar)", a: ["entregados"], ph: "participe", exp: "Los premios (masc. plur.) -> entregados." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Le nouveau pont a été inauguré hier par le maire.
Plus de mille logements ont été construits l'an dernier.
La loi sera approuvée la semaine prochaine.
Dans la région, on produit de l'huile et du vin de grande qualité.
Les prix ont été remis lors d'une cérémonie sobre.
On cherche du personnel pour la nouvelle usine.</pre>
<p>La presse mélange les deux structures : la <strong>passive avec ser</strong> (fue inaugurado, será aprobada, fueron entregados), très écrite, et la <strong>passive refleja avec se</strong> (se construyeron, se producen, se busca), plus souple. Dans les deux cas, l'attention se porte sur l'action subie, pas sur l'auteur.</p>`
  }
};
</script>
