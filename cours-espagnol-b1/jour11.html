<script>
var DAY = {
  num: 11,
  title: "Les pronoms relatifs (que, quien, cuyo)",
  subtitle: "Relier deux idées en une seule phrase fluide : qui, que, dont, où.",
  theory: `
<h3>1. À quoi servent les pronoms relatifs ?</h3>
<p>Les pronoms relatifs évitent de répéter un mot et relient deux phrases. <em>Tengo un amigo. El amigo vive en Madrid.</em> devient <em>Tengo un amigo <strong>que</strong> vive en Madrid</em> (J'ai un ami qui vit à Madrid). Le mot remplacé s'appelle l'antécédent.</p>
<h3>2. QUE : le passe-partout</h3>
<p><strong>Que</strong> est de loin le plus fréquent. Il traduit « qui » (sujet) et « que » (complément), pour des personnes comme des choses. Il est invariable.</p>
<pre class="pseudo">El libro que compré es interesante.
= Le livre que j'ai acheté est intéressant.
La chica que canta es mi hermana.
= La fille qui chante est ma soeur.</pre>
<div class="tip">Contrairement au français, que ne s'élide jamais devant une voyelle : « la mujer que ama » (jamais qu'ama).</div>
<h3>3. QUIEN / QUIENES : uniquement pour les personnes</h3>
<p><strong>Quien</strong> (pluriel <strong>quienes</strong>) ne s'emploie que pour des personnes, surtout <strong>après une préposition</strong> (con, para, de, a…) ou entre virgules.</p>
<pre class="pseudo">La persona con quien hablo es mi jefe.
= La personne avec qui je parle est mon chef.
Mis amigos, quienes viven en Sevilla, vienen hoy.
= Mes amis, qui vivent à Séville, viennent aujourd'hui.</pre>
<div class="warn">Après une préposition, on ne peut pas utiliser « que » seul pour une personne : on dit « con quien » (ou « con el que / la que »), pas « con que ». Pour une chose : « el tema del que hablamos ».</div>
<h3>4. EL QUE / EL CUAL et leurs formes</h3>
<p>Après une préposition, on emploie souvent <strong>el que, la que, los que, las que</strong> (ou el cual, la cual…), qui s'accordent avec l'antécédent.</p>
<pre class="pseudo">La casa en la que vivo es antigua.
= La maison dans laquelle je vis est ancienne.
El proyecto en el que trabajo es importante.
= Le projet sur lequel je travaille est important.</pre>
<h3>5. CUYO : « dont » (la possession)</h3>
<p><strong>Cuyo</strong> exprime la possession (« dont le / dont la »). Point crucial : il s'accorde avec la <strong>chose possédée</strong>, PAS avec le possesseur.</p>
<pre class="pseudo">cuyo / cuya / cuyos / cuyas  (accord avec l'objet possédé)
El escritor cuyo libro leí es español.
= L'écrivain dont j'ai lu le livre est espagnol. (cuyo -> libro, masc. sing.)
La empresa cuyas oficinas visité es enorme.
= L'entreprise dont j'ai visité les bureaux est immense. (cuyas -> oficinas, fém. plur.)</pre>
<div class="warn">Erreur classique : accorder cuyo avec le possesseur. Non ! « La mujer cuyo hijo… » (cuyo s'accorde avec hijo, pas avec mujer).</div>
<h3>6. DONDE : le lieu</h3>
<p><strong>Donde</strong> (sans accent, car ce n'est pas une question) remplace « où » pour indiquer un lieu : <em>La ciudad donde nací es pequeña</em> (La ville où je suis né est petite). Équivalent : en la que / en la cual.</p>`,
  exercises: [
    { type: "qcm", q: "Quel relatif est le plus fréquent, pour les personnes comme les choses ?", opts: ["cuyo", "que", "donde", "quienes"], a: 1, exp: "Que est le passe-partout, invariable, pour sujets et compléments." },
    { type: "input", q: "Complète : El libro ___ compré es muy bueno.", a: ["que"], ph: "relatif", exp: "Que = que (complément), le plus courant." },
    { type: "qcm", q: "« Quien / quienes » s'emploie :", opts: ["pour les choses", "uniquement pour les personnes", "pour les lieux", "pour la possession"], a: 1, exp: "Quien/quienes concerne uniquement des personnes." },
    { type: "input", q: "Complète : La persona con ___ hablo es mi jefe. (personne, après préposition)", a: ["quien"], ph: "relatif", exp: "Après préposition, pour une personne : con quien." },
    { type: "qcm", q: "« Cuyo » exprime :", opts: ["le lieu", "le temps", "la possession (dont)", "la cause"], a: 2, exp: "Cuyo = dont (possession) : el autor cuyo libro leí." },
    { type: "input", q: "Complète l'accord : La mujer ___ hijo estudia aquí es médica. (cuyo/cuya, accord avec hijo)", a: ["cuyo"], ph: "relatif", exp: "Cuyo s'accorde avec hijo (masc. sing.), pas avec mujer." },
    { type: "vf", q: "Cuyo s'accorde avec la chose possédée, pas avec le possesseur.", a: true, exp: "Vrai : la casa cuyas ventanas... (cuyas -> ventanas)." },
    { type: "qcm", q: "Pour indiquer un lieu (« la ville où je vis »), on emploie :", opts: ["cuyo", "quien", "donde", "cual"], a: 2, exp: "Donde (sans accent) : la ciudad donde vivo." },
    { type: "input", q: "Complète : La casa en la ___ vivo es antigua. (accord fém. sing.)", a: ["que"], ph: "relatif", exp: "En la que vivo : el/la que après préposition, accordé." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["El amigo con que hablo", "El amigo con quien hablo", "El amigo cuyo hablo", "El amigo donde hablo"], a: 1, exp: "Personne + préposition -> con quien (ou con el que)." },
    { type: "input", q: "Complète : Los estudiantes ___ aprobaron están contentos. (relatif sujet)", a: ["que"], ph: "relatif", exp: "Que = qui (sujet) : los estudiantes que aprobaron." },
    { type: "vf", q: "« La ciudad donde nací » emploie donde sans accent.", a: true, exp: "Vrai : donde relatif (lieu) ne prend pas d'accent, contrairement à la question dónde." },
    { type: "qcm", q: "Comprension : « El escritor cuya novela ganó el premio es joven. » Qu'a gagné le prix ?", opts: ["l'écrivain", "la novela (le roman)", "le lecteur", "le prix lui-même"], a: 1, exp: "Cuya s'accorde avec novela : le roman de l'écrivain a gagné le prix." },
    { type: "input", q: "Complète (personnes, après virgule) : Mis primos, ___ viven en Perú, vienen en verano.", a: ["quienes"], ph: "relatif", exp: "Quienes (pluriel, personnes) entre virgules." },
    { type: "qcm", q: "Comprension : « El tema del que hablamos es complejo. » Comment relie-t-on une chose après préposition ?", opts: ["con quien", "del que (préposition + el que)", "cuyo", "donde"], a: 1, exp: "Chose + préposition -> del que (de + el que) : le sujet dont nous parlons." }
  ],
  final: {
    title: "Exercice final — Un pueblo con encanto",
    intro: `<p>Lucía describe el pueblo de su familia :</p>
<pre class="pseudo">El pueblo donde nació mi abuela está en la montaña.
Es un lugar que conserva casas antiguas de piedra.
Mi abuela, quien vivió allí toda su vida, lo recuerda con cariño.
La iglesia, cuyas campanas suenan cada hora, es del siglo XV.
El vecino con quien más hablaba era el panadero.
Es un sitio del que guardo recuerdos preciosos.</pre>`,
    questions: [
      { type: "qcm", q: "« El pueblo donde nació mi abuela » : donde indique :", opts: ["la possession", "le lieu", "le temps", "la cause"], a: 1, exp: "Donde = où (lieu) : le village où est née ma grand-mère." },
      { type: "input", q: "Relève le relatif : Es un lugar ___ conserva casas antiguas. (sujet/chose)", a: ["que"], ph: "relatif", exp: "Que = qui (sujet, chose) : un lugar que conserva." },
      { type: "qcm", q: "« cuyas campanas suenan » : cuyas s'accorde avec :", opts: ["la iglesia", "campanas (les cloches)", "el siglo", "el pueblo"], a: 1, exp: "Cuyas s'accorde avec la chose possédée : campanas (fém. plur.)." },
      { type: "vf", q: "« Mi abuela, quien vivió allí… » : quien s'emploie pour une personne.", a: true, exp: "Vrai : quien concerne une personne (ma grand-mère)." },
      { type: "input", q: "Complète : El vecino con ___ más hablaba era el panadero. (personne + préposition)", a: ["quien"], ph: "relatif", exp: "Con quien : personne après préposition." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Le village où est née ma grand-mère est dans la montagne.
C'est un lieu qui conserve d'anciennes maisons de pierre.
Ma grand-mère, qui y a vécu toute sa vie, s'en souvient avec tendresse.
L'église, dont les cloches sonnent chaque heure, date du XVe siècle.
Le voisin avec qui elle parlait le plus était le boulanger.
C'est un endroit dont je garde des souvenirs précieux.</pre>
<p>Chaque relatif a son rôle : <strong>donde</strong> (lieu), <strong>que</strong> (sujet/objet passe-partout), <strong>quien</strong> (personne, après virgule ou préposition), <strong>cuyas</strong> (possession, accordé avec campanas), <strong>del que</strong> (chose après préposition). Bien les choisir rend le récit fluide et naturel.</p>`
  }
};
</script>

  ]
};
