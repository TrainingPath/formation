<script>
var DAY = {
  num: 18,
  title: "Donner son opinion, être d'accord ou non",
  subtitle: "Exprimer un point de vue, approuver ou contredire poliment.",
  theory: `
<h3>1. Donner son opinion</h3>
<p>Voici les expressions incontournables pour introduire une opinion. Attention au mode qui suit !</p>
<pre class="pseudo">Creo que + indicatif     = Je crois que…
Pienso que + indicatif   = Je pense que…
En mi opinión, …         = À mon avis, …
Me parece que + indicatif = Il me semble que…
Para mí, …               = Pour moi, …
Desde mi punto de vista  = De mon point de vue</pre>
<p>Exemple : <em>Creo que la educación es muy importante</em> (Je crois que l'éducation est très importante).</p>
<div class="warn">Piège classique : à la forme <strong>négative</strong>, on passe au subjonctif. <em>No creo que sea buena idea</em> (Je ne crois pas que ce soit une bonne idée). Compare : <em>Creo que es</em> (indicatif) → <em>No creo que sea</em> (subjonctif).</div>
<h3>2. Être d'accord</h3>
<pre class="pseudo">Estoy de acuerdo (con)   = Je suis d'accord (avec)
Tienes razón             = Tu as raison
Es verdad / Es cierto    = C'est vrai
Claro que sí             = Bien sûr que oui
Yo también lo creo       = Je le pense aussi
Exacto / Efectivamente   = Exactement / En effet</pre>
<p>Exemple : <em>Estoy totalmente de acuerdo contigo</em> (Je suis tout à fait d'accord avec toi).</p>
<h3>3. Ne pas être d'accord (poliment)</h3>
<pre class="pseudo">No estoy de acuerdo      = Je ne suis pas d'accord
No creo que + subj.      = Je ne crois pas que…
Te equivocas             = Tu te trompes
Yo no lo veo así         = Je ne vois pas les choses ainsi
Puede ser, pero…         = C'est possible, mais…
Depende                  = Ça dépend</pre>
<p>Exemple : <em>No estoy de acuerdo, yo no lo veo así</em> (Je ne suis pas d'accord, je ne vois pas les choses ainsi).</p>
<div class="tip">Astuce de politesse : pour nuancer un désaccord, commence par reconnaître l'autre : <em>Entiendo tu punto de vista, pero…</em> (Je comprends ton point de vue, mais…).</div>
<h3>4. Nuancer et donner des arguments</h3>
<pre class="pseudo">Por una parte… por otra parte = D'une part… d'autre part
Además           = De plus
Por ejemplo      = Par exemple
En cambio        = En revanche
Sin embargo      = Cependant</pre>
<p>Exemple : <em>Entiendo tu opinión, sin embargo creo que hay otra solución</em> (Je comprends ton avis, cependant je crois qu'il y a une autre solution).</p>`,
  exercises: [
    { type: "qcm", q: "Quelle expression introduit une opinion ?", opts: ["Estoy de acuerdo", "En mi opinión", "Tienes razón", "Depende"], a: 1, exp: "En mi opinión = à mon avis (introduit une opinion)." },
    { type: "input", q: "Complète : « ___ que la salud es lo más importante. » (Je crois que…)", a: ["creo", "pienso"], ph: "verbe", exp: "Creo que / Pienso que + indicatif." },
    { type: "qcm", q: "Après « No creo que », quel mode utilise-t-on ?", opts: ["l'indicatif", "le subjonctif", "l'infinitif", "le futur"], a: 1, exp: "No creo que sea… → subjonctif." },
    { type: "vf", q: "« Estoy de acuerdo » signifie « je suis d'accord ».", a: true, exp: "Vrai, estoy de acuerdo = je suis d'accord." },
    { type: "input", q: "Traduis « tu as raison » : tienes ___.", a: ["razón"], ph: "mot", exp: "Tienes razón = tu as raison." },
    { type: "qcm", q: "Comment exprime-t-on un désaccord poli ?", opts: ["Claro que sí", "Yo no lo veo así", "Exacto", "Es verdad"], a: 1, exp: "Yo no lo veo así = je ne vois pas les choses ainsi." },
    { type: "vf", q: "« Te equivocas » veut dire « tu te trompes ».", a: true, exp: "Vrai, equivocarse = se tromper." },
    { type: "qcm", q: "« En cambio » sert à :", opts: ["ajouter une idée", "opposer (en revanche)", "donner un exemple", "conclure"], a: 1, exp: "En cambio = en revanche (opposition)." },
    { type: "input", q: "Complète le désaccord : « No estoy de ___. »", a: ["acuerdo"], ph: "mot", exp: "No estoy de acuerdo." },
    { type: "qcm", q: "Quelle phrase est correcte grammaticalement ?", opts: ["Creo que sea difícil", "No creo que es difícil", "No creo que sea difícil", "Pienso que sea difícil"], a: 2, exp: "No creo que + subjonctif : No creo que sea difícil." },
    { type: "vf", q: "« Depende » peut servir à nuancer sans trancher.", a: true, exp: "Vrai : depende = ça dépend." },
    { type: "input", q: "Traduis « d'une part » : por una ___.", a: ["parte"], ph: "mot", exp: "Por una parte… por otra parte." },
    { type: "qcm", q: "Compréhension : « Entiendo tu punto de vista, pero no lo comparto. » Que dit la personne ?", opts: ["elle est d'accord", "elle comprend mais n'est pas d'accord", "elle ne comprend pas", "elle refuse de parler"], a: 1, exp: "Entiendo… pero no lo comparto = compréhension + désaccord." },
    { type: "qcm", q: "Compréhension : « Claro que sí, tienes toda la razón. » Quel est le ton ?", opts: ["désaccord total", "accord total", "hésitation", "indifférence"], a: 1, exp: "Claro que sí + tienes toda la razón = accord total." },
    { type: "input", q: "Traduis « c'est vrai » (deux mots) : es ___.", a: ["verdad", "cierto"], ph: "mot", exp: "Es verdad / Es cierto = c'est vrai." }
  ],
  final: {
    title: "Exercice final — Un debate sobre los deberes",
    intro: `<p>Lis ce petit débat entre deux amis :</p>
<pre class="pseudo">ANA: En mi opinión, los estudiantes tienen demasiados deberes.
LUIS: No estoy de acuerdo. Creo que los deberes son necesarios.
ANA: Puede ser, pero pasan muchas horas en casa estudiando.
LUIS: Entiendo tu punto de vista, sin embargo los deberes ayudan a repasar.
ANA: Depende. Yo pienso que la calidad importa más que la cantidad.
LUIS: En eso tienes razón. Menos deberes, pero mejores.
ANA: Exacto. Estoy totalmente de acuerdo contigo ahora.
LUIS: Entonces llegamos a un acuerdo.</pre>`,
    questions: [
      { type: "qcm", q: "Quelle est l'opinion d'Ana au début ?", opts: ["les élèves ont trop de devoirs", "les devoirs sont nécessaires", "il faut plus de devoirs", "elle n'a pas d'avis"], a: 0, exp: "Ana : los estudiantes tienen demasiados deberes." },
      { type: "qcm", q: "Comment Luis réagit-il d'abord ?", opts: ["il est d'accord", "il n'est pas d'accord", "il change de sujet", "il se tait"], a: 1, exp: "Luis : No estoy de acuerdo." },
      { type: "input", q: "Quelle expression Luis utilise-t-il pour reconnaître l'avis d'Ana ? (deux mots après « Entiendo »)", a: ["tu punto de vista", "tu punto"], ph: "…", exp: "Entiendo tu punto de vista = je comprends ton point de vue." },
      { type: "vf", q: "À la fin, les deux amis arrivent à un accord.", a: true, exp: "Entonces llegamos a un acuerdo." },
      { type: "qcm", q: "Selon Ana, qu'est-ce qui importe le plus ?", opts: ["la quantité de devoirs", "la qualité plus que la quantité", "le nombre d'heures", "la note"], a: 1, exp: "La calidad importa más que la cantidad." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">ANA : À mon avis, les élèves ont trop de devoirs.
LUIS : Je ne suis pas d'accord. Je crois que les devoirs sont nécessaires.
ANA : C'est possible, mais ils passent beaucoup d'heures à la maison à étudier.
LUIS : Je comprends ton point de vue, cependant les devoirs aident à réviser.
ANA : Ça dépend. Je pense que la qualité importe plus que la quantité.
LUIS : Là-dessus tu as raison. Moins de devoirs, mais de meilleurs.
ANA : Exactement. Je suis maintenant tout à fait d'accord avec toi.
LUIS : Alors nous arrivons à un accord.</pre>
<p>Observe comment un débat poli alterne l'opinion (En mi opinión, Creo que), le désaccord (No estoy de acuerdo) et l'accord final (Tienes razón, Exacto).</p>`
  }
};
</script>

    hints: [

    solution: "En mi opinión, hacer deporte en la escuela es muy importante. Creo que ayuda a los jóvenes a estar sanos y a hacer amigos. Además, el deporte enseña valores como el respeto y el esfuerzo. Por ejemplo, en los deportes de equipo hay que colaborar. Sin embargo, entiendo que algunos estudiantes prefieren otras actividades, como la música o el arte. Por eso pienso que la escuela debería ofrecer opciones diferentes. Desde mi punto de vista, lo importante es que cada uno encuentre una actividad que le guste. Estoy seguro de que así todos estarían más motivados.\n\nTraduction : À mon avis, faire du sport à l'école est très important. Je crois que cela aide les jeunes à rester en bonne santé et à se faire des amis. De plus, le sport enseigne des valeurs comme le respect et l'effort. Par exemple, dans les sports d'équipe il faut collaborer. Cependant, je comprends que certains élèves préfèrent d'autres activités, comme la musique ou l'art. C'est pourquoi je pense que l'école devrait offrir différentes options. De mon point de vue, l'important est que chacun trouve une activité qui lui plaise. Je suis sûr qu'ainsi tout le monde serait plus motivé.",
    note: "Un bon texte d'opinion suit un schéma : opinion → argument → exemple → nuance → conclusion. N'oublie pas le subjonctif après « No creo que » et après « es importante que »." }
