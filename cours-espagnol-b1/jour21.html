  title: "Compréhension : un article de presse",
  subtitle: "Lire et comprendre un article de journal en espagnol.",
  theory: `
<h3>1. Comment lire un article de presse</h3>
<p>Face à un article, ne cherche pas à tout comprendre mot à mot. Applique une stratégie de lecture (estrategia de lectura) :</p>
<pre class="pseudo">1. Lis le titular (le titre) : il résume l'info.
2. Repère qui, qué, cuándo, dónde, por qué (qui, quoi, quand, où, pourquoi).
3. Devine les mots inconnus par le contexte.
4. Ne t'arrête pas au premier mot difficile.</pre>
<div class="tip">Astuce : la première phrase d'un article (l'entrée, la « entradilla ») contient souvent l'essentiel de l'information. Lis-la deux fois.</div>
<h3>2. Le vocabulaire de la presse</h3>
<pre class="pseudo">un titular        = un titre
la entradilla     = le chapeau / l'accroche
una fuente        = une source
un reportaje      = un reportage
una encuesta      = un sondage
declarar          = déclarer
afirmar           = affirmer
según             = selon
el aumento        = la hausse
la cifra          = le chiffre</pre>
<h3>3. Lis l'article suivant</h3>
<pre class="pseudo">EL TURISMO RURAL BATE RÉCORDS ESTE VERANO

Madrid. Según un informe publicado ayer, el turismo rural
ha crecido un treinta por ciento este verano en España.
Cada vez más familias eligen los pueblos pequeños en lugar
de las grandes ciudades de la costa.
Los expertos explican que la gente busca tranquilidad,
naturaleza y precios más bajos.
La región de Asturias es una de las más visitadas.
Muchos pueblos que estaban casi vacíos han vuelto a la vida.
Los hoteles rurales y las casas de turismo están llenos.
Además, este tipo de turismo ayuda a la economía local
y crea empleo para los jóvenes de la zona.
Sin embargo, algunos vecinos se quejan del aumento de precios
y del ruido durante los meses de julio y agosto.
El gobierno regional afirma que quiere apoyar este sector,
pero también proteger el medio ambiente.
Los especialistas prevén que la tendencia continuará
el próximo año.</pre>
<div class="warn">Attention aux temps : <strong>ha crecido, ha vuelto</strong> sont au passé composé (pretérito perfecto) → résultat récent lié au présent. <strong>Estaban</strong> est à l'imparfait → description d'un état passé.</div>
<h3>4. Reformuler l'information</h3>
<p>Pour répondre aux questions, apprends à reformuler avec tes mots : <em>El artículo dice que…</em> (L'article dit que…), <em>Según el texto…</em> (Selon le texte…), <em>El autor afirma que…</em> (L'auteur affirme que…).</p>`,
  exercises: [
    { type: "qcm", q: "Quel est le sujet principal de l'article ?", opts: ["le tourisme sur la côte", "la hausse du tourisme rural", "les prix des hôtels de luxe", "la météo de l'été"], a: 1, exp: "El turismo rural bate récords / ha crecido este verano." },
    { type: "input", q: "De combien a augmenté le tourisme rural cet été ? Complète : « un ___ por ciento ».", a: ["treinta"], ph: "nombre en lettres", exp: "Ha crecido un treinta por ciento = 30 %." },
    { type: "qcm", q: "Que recherchent les familles selon les experts ?", opts: ["le luxe et les fêtes", "tranquillité, nature et prix plus bas", "les grandes villes", "les plages bondées"], a: 1, exp: "La gente busca tranquilidad, naturaleza y precios más bajos." },
    { type: "vf", q: "La région d'Asturies est l'une des plus visitées.", a: true, exp: "La región de Asturias es una de las más visitadas." },
    { type: "qcm", q: "Que dit l'article sur les villages presque vides ?", opts: ["ils ont été détruits", "ils sont revenus à la vie", "ils restent abandonnés", "ils ont été vendus"], a: 1, exp: "Muchos pueblos que estaban casi vacíos han vuelto a la vida." },
    { type: "input", q: "Quel type de logement est plein ? Complète : « los hoteles ___ ».", a: ["rurales"], ph: "adjectif", exp: "Los hoteles rurales están llenos." },
    { type: "vf", q: "Selon l'article, ce tourisme crée de l'emploi pour les jeunes.", a: true, exp: "Crea empleo para los jóvenes de la zona." },
    { type: "qcm", q: "De quoi se plaignent certains habitants ?", opts: ["du manque de touristes", "de la hausse des prix et du bruit", "du froid", "de la nourriture"], a: 1, exp: "Se quejan del aumento de precios y del ruido." },
    { type: "qcm", q: "Que veut faire le gouvernement régional ?", opts: ["interdire le tourisme", "soutenir le secteur et protéger l'environnement", "augmenter les impôts", "fermer les villages"], a: 1, exp: "Quiere apoyar este sector, pero también proteger el medio ambiente." },
    { type: "input", q: "Que prévoient les spécialistes pour l'an prochain ? Complète : « la tendencia ___ ».", a: ["continuará"], ph: "verbe", exp: "Prevén que la tendencia continuará." },
    { type: "vf", q: "« Ha crecido » est un temps du passé qui a un lien avec le présent (pretérito perfecto).", a: true, exp: "Vrai : ha crecido = passé composé, résultat récent." },
    { type: "qcm", q: "Que signifie « según » dans « Según un informe » ?", opts: ["contre", "selon", "sans", "après"], a: 1, exp: "Según = selon." },
    { type: "input", q: "Traduis « un chiffre » (statistique) : una ___.", a: ["cifra"], ph: "mot", exp: "Una cifra = un chiffre." },
    { type: "qcm", q: "Compréhension globale : quel est le ton général de l'article ?", opts: ["très négatif", "plutôt positif avec quelques réserves", "neutre sans opinion", "humoristique"], a: 1, exp: "Croissance positive + quelques plaintes (sin embargo)." },
    { type: "qcm", q: "Quels mois posent problème selon les voisins ?", opts: ["décembre et janvier", "juillet et août", "mars et avril", "septembre et octobre"], a: 1, exp: "El ruido durante los meses de julio y agosto." }
  ],
  final: {
    title: "Exercice final — Otra noticia breve",
    intro: `<p>Lis ce second article, plus court, et réponds :</p>
<pre class="pseudo">LOS JÓVENES LEEN CADA VEZ MÁS EN DIGITAL

Barcelona. Una encuesta reciente revela que el sesenta por ciento
de los jóvenes españoles prefiere leer en tabletas o móviles.
Según los autores del estudio, los libros electrónicos son
más baratos y ocupan menos espacio.
No obstante, muchos lectores mayores siguen prefiriendo el papel.
Las librerías tradicionales intentan adaptarse a los nuevos hábitos.
Algunas ofrecen ahora talleres y actividades culturales
para atraer a más clientes.
Los expertos afirman que el papel y lo digital pueden convivir.</pre>`,
    questions: [
      { type: "qcm", q: "Quel pourcentage de jeunes préfère lire en numérique ?", opts: ["30 %", "60 %", "80 %", "100 %"], a: 1, exp: "El sesenta por ciento = 60 %." },
      { type: "qcm", q: "Pourquoi les livres électroniques plaisent-ils, selon l'étude ?", opts: ["ils sont plus lourds", "ils sont moins chers et prennent moins de place", "ils sentent bon", "ils sont gratuits"], a: 1, exp: "Más baratos y ocupan menos espacio." },
      { type: "input", q: "Qui préfère encore le papier ? Complète : « muchos lectores ___ ».", a: ["mayores"], ph: "adjectif", exp: "Muchos lectores mayores siguen prefiriendo el papel." },
      { type: "vf", q: "Les librairies traditionnelles essaient de s'adapter.", a: true, exp: "Las librerías tradicionales intentan adaptarse." },
      { type: "qcm", q: "Quelle est la conclusion des experts ?", opts: ["le papier va disparaître", "papier et numérique peuvent coexister", "il faut interdire le numérique", "personne ne lit plus"], a: 1, exp: "El papel y lo digital pueden convivir." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">LES JEUNES LISENT DE PLUS EN PLUS EN NUMÉRIQUE

Barcelone. Un sondage récent révèle que soixante pour cent
des jeunes Espagnols préfèrent lire sur tablettes ou portables.
Selon les auteurs de l'étude, les livres électroniques sont
moins chers et prennent moins de place.
Néanmoins, beaucoup de lecteurs plus âgés continuent de préférer le papier.
Les librairies traditionnelles essaient de s'adapter aux nouvelles habitudes.
Certaines proposent désormais des ateliers et des activités culturelles
pour attirer plus de clients.
Les experts affirment que le papier et le numérique peuvent coexister.</pre>
<p>Stratégie : le titre (titular) donne l'idée principale, la première phrase donne le chiffre clé, et les connecteurs (no obstante) montrent les points de vue opposés.</p>`
  }
};
