<script>
var DAY = {
  num: 25,
  title: "Ser ou estar : les cas difficiles",
  subtitle: "Choisir le bon verbe quand les deux semblent possibles.",
  theory: `
<h3>1. Rappel de la règle générale</h3>
<p>Les deux verbes se traduisent par « être » en français, mais :</p>
<pre class="pseudo">SER   → identité, caractéristique permanente, définition
        Soy español. La mesa es de madera. Son las tres.
ESTAR → état, situation, localisation, résultat
        Estoy cansado. La casa está en Madrid. Está roto.</pre>
<div class="tip">Astuce mnémotechnique : SER = essence (ce que la chose EST) ; ESTAR = état (comment elle SE TROUVE en ce moment).</div>
<h3>2. Adjectifs qui changent de sens</h3>
<p>C'est le point le plus délicat : certains adjectifs changent complètement de sens selon ser ou estar.</p>
<pre class="pseudo">ser aburrido  = être ennuyeux   / estar aburrido  = s'ennuyer
ser listo     = être intelligent / estar listo     = être prêt
ser rico      = être riche       / estar rico      = être délicieux
ser malo      = être méchant     / estar malo      = être malade
ser bueno     = être bon/gentil  / estar bueno     = être savoureux/en forme
ser verde     = être vert (couleur) / estar verde  = être pas mûr
ser vivo      = être vif/malin   / estar vivo      = être vivant
ser orgulloso = être orgueilleux / estar orgulloso = être fier</pre>
<p>Exemple : <em>Este libro es aburrido</em> (Ce livre est ennuyeux) ≠ <em>Estoy aburrido</em> (Je m'ennuie).</p>
<h3>3. Le cas des sentiments et de l'apparence</h3>
<pre class="pseudo">estar → sentiment ou état passager, changement perçu
        Estás muy guapa hoy. (Tu es très belle aujourd'hui = perçu maintenant)
ser   → caractéristique durable
        Eres muy guapa. (Tu es très belle = c'est ta nature)</pre>
<div class="warn">Attention : <em>ser muerto</em> n'existe pas ! On dit toujours <strong>estar muerto</strong> (être mort) et <strong>estar vivo</strong> (être vivant), même si c'est définitif. La mort est vue comme un état résultat.</div>
<h3>4. Expressions figées à mémoriser</h3>
<pre class="pseudo">Avec SER :  es que… (c'est que), es necesario, es importante,
            ser consciente de, la fiesta es en mi casa (événement)
Avec ESTAR : estar de acuerdo, estar a punto de, estar de moda,
             estar de vacaciones, estar seguro de, ¿está bien?</pre>
<div class="warn">Piège classique des lieux : pour la <strong>localisation d'un objet ou d'une personne</strong> → estar (La llave está en la mesa). Mais pour la <strong>localisation d'un événement</strong> → ser (El concierto es en el estadio).</div>`,
  exercises: [
    { type: "qcm", q: "« Estoy aburrido » signifie :", opts: ["je suis ennuyeux", "je m'ennuie", "je suis riche", "je suis prêt"], a: 1, exp: "estar aburrido = s'ennuyer." },
    { type: "input", q: "Complète : « La sopa ___ muy rica. » (elle est délicieuse) → ser ou estar ?", a: ["está"], ph: "verbe", exp: "Estar rico = être délicieux : la sopa está rica." },
    { type: "qcm", q: "« Es listo » veut dire :", opts: ["il est prêt", "il est intelligent", "il est malade", "il s'ennuie"], a: 1, exp: "ser listo = être intelligent ; estar listo = être prêt." },
    { type: "vf", q: "« Estar malo » signifie « être malade ».", a: true, exp: "Vrai : estar malo = être malade ; ser malo = être méchant." },
    { type: "input", q: "Complète : « El niño ___ malo, tiene fiebre. » (il est malade)", a: ["está"], ph: "verbe", exp: "Estar malo = être malade → está malo." },
    { type: "qcm", q: "Pour localiser un objet, on utilise :", opts: ["ser", "estar", "les deux", "aucun"], a: 1, exp: "Localisation d'un objet → estar : la llave está en la mesa." },
    { type: "vf", q: "Pour dire où a lieu un événement (un concert), on utilise « ser ».", a: true, exp: "Vrai : El concierto es en el estadio (événement → ser)." },
    { type: "qcm", q: "« Estás muy guapa hoy » exprime :", opts: ["une beauté permanente", "un changement perçu aujourd'hui", "une maladie", "un ennui"], a: 1, exp: "Estar guapa = perçu maintenant, aujourd'hui." },
    { type: "input", q: "Complète : « Estas manzanas están ___, no las comas todavía. » (pas mûres)", a: ["verdes"], ph: "adjectif", exp: "Estar verde = pas mûr : están verdes." },
    { type: "qcm", q: "Pour dire « je suis d'accord », on emploie :", opts: ["soy de acuerdo", "estoy de acuerdo", "es de acuerdo", "está de acuerdo"], a: 1, exp: "Expression figée : estar de acuerdo." },
    { type: "vf", q: "On dit toujours « estar muerto » (jamais « ser muerto »).", a: true, exp: "Vrai : la mort est vue comme un état → estar muerto." },
    { type: "input", q: "Complète : « ___ las cuatro de la tarde. » (il est quatre heures)", a: ["Son", "son"], ph: "verbe", exp: "L'heure → ser : Son las cuatro." },
    { type: "qcm", q: "Compréhension : « El examen es en el aula 3. » Que veut dire cette phrase ?", opts: ["l'examen se déroule dans la salle 3", "l'examen est ennuyeux", "la salle 3 est vide", "l'examen est fini"], a: 0, exp: "Événement (examen) → ser : a lieu dans la salle 3." },
    { type: "qcm", q: "Compréhension : « ¡Qué rico está este pastel! » Que dit la personne ?", opts: ["le gâteau est cher", "le gâteau est délicieux", "le gâteau est riche en argent", "le gâteau est prêt"], a: 1, exp: "estar rico = être délicieux (pour un plat)." },
    { type: "input", q: "Complète : « ¿Ya ___ listo para salir? » (es-tu prêt ?) → ser ou estar ?", a: ["estás"], ph: "verbe", exp: "estar listo = être prêt : ¿estás listo?" }
  ],
  final: {
    title: "Exercice final — Ser o estar en contexto",
    intro: `<p>Lis ce petit dialogue et observe chaque emploi :</p>
<pre class="pseudo">— Hola, Ana. ¿Estás lista? La fiesta es en casa de Luis.
— Casi. Es que no encuentro las llaves. ¿Sabes dónde están?
— Están encima de la mesa, al lado del móvil.
— ¡Gracias! Oye, ¿cómo estás? Te veo un poco cansada.
— Estoy bien, solo un poco aburrida esta semana.
— Pues la fiesta será divertida. Luis es muy simpático
   y siempre prepara una comida que está riquísima.
— ¡Genial! Estoy segura de que lo pasaremos muy bien.</pre>`,
    questions: [
      { type: "qcm", q: "« La fiesta es en casa de Luis. » Pourquoi « es » ?", opts: ["c'est une localisation d'objet", "c'est un événement (où il a lieu)", "c'est une erreur", "c'est un sentiment"], a: 1, exp: "Événement → ser : la fiesta es en casa de Luis." },
      { type: "input", q: "Où sont les clés ? Complète : « ___ encima de la mesa. » (localisation)", a: ["Están", "están"], ph: "verbe", exp: "Localisation d'objet → estar : están encima de la mesa." },
      { type: "qcm", q: "« Estoy un poco aburrida esta semana » signifie :", opts: ["je suis ennuyeuse", "je m'ennuie cette semaine", "je suis riche", "je suis prête"], a: 1, exp: "estar aburrida = s'ennuyer (état passager)." },
      { type: "vf", q: "« La comida está riquísima » veut dire que le repas est délicieux.", a: true, exp: "estar rico/riquísimo = délicieux." },
      { type: "qcm", q: "« Luis es muy simpático » : pourquoi « es » ?", opts: ["état passager", "caractéristique durable de Luis", "localisation", "événement"], a: 1, exp: "Caractéristique durable → ser : es simpático." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">— Salut, Ana. Tu es prête ? La fête a lieu chez Luis.
— Presque. C'est que je ne trouve pas les clés. Tu sais où elles sont ?
— Elles sont sur la table, à côté du portable.
— Merci ! Dis, comment vas-tu ? Je te trouve un peu fatiguée.
— Je vais bien, je m'ennuie juste un peu cette semaine.
— Eh bien la fête sera amusante. Luis est très sympathique
   et il prépare toujours un repas qui est délicieux.
— Génial ! Je suis sûre que nous allons bien nous amuser.</pre>
<p>Récapitulatif : estar listo (prêt), es en casa de Luis (événement → ser), están encima de la mesa (localisation → estar), estoy aburrida (s'ennuyer), es simpático (caractéristique), está riquísima (délicieux).</p>`
  }
};
</script>

    solution: "Mi amigo Pablo es una persona muy especial. Es alto, moreno y muy simpático. Además, es muy listo: siempre saca buenas notas. Hoy está un poco cansado porque está enfermo, así que no ha ido a clase. Esta tarde vamos a estudiar juntos en la biblioteca, que está cerca de su casa. El examen es en el aula grande del segundo piso. Pablo dice que la asignatura es aburrida, pero yo no estoy aburrido, porque me gusta el tema. Después vamos a merendar; su madre prepara un bizcocho que está riquísimo. Estoy seguro de que aprobaremos.\n\nTraduction : Mon ami Pablo est une personne très spéciale. Il est grand, brun et très sympathique. De plus, il est très intelligent : il a toujours de bonnes notes. Aujourd'hui il est un peu fatigué parce qu'il est malade, alors il n'est pas allé en cours. Cet après-midi nous allons étudier ensemble à la bibliothèque, qui est près de chez lui. L'examen a lieu dans la grande salle du deuxième étage. Pablo dit que la matière est ennuyeuse, mais moi je ne m'ennuie pas, parce que le sujet me plaît. Ensuite nous allons goûter ; sa mère prépare un gâteau qui est délicieux. Je suis sûr que nous réussirons.",

  ]
