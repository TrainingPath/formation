<script>
var DAY = {
  num: 22,
  title: "Compréhension : un fait divers court",
  subtitle: "Lire un fait divers (un suceso) et repérer les informations clés.",
  theory: `
<h3>1. Qu'est-ce qu'un fait divers ?</h3>
<p>Un fait divers (un suceso) est une brève d'actualité : un vol, un accident, un sauvetage, un événement insolite. Le style est court, factuel, souvent au passé. On y répète l'essentiel : <strong>qui, quoi, quand, où, comment</strong>.</p>
<h3>2. Le vocabulaire des faits divers</h3>
<pre class="pseudo">un suceso        = un fait divers
un robo          = un vol
un ladrón        = un voleur
la policía       = la police
detener          = arrêter (une personne)
un accidente     = un accident
herido / herida  = blessé(e)
un testigo       = un témoin
rescatar         = secourir, sauver
los bomberos     = les pompiers</pre>
<div class="tip">Astuce : dans un fait divers, les verbes sont souvent au <strong>pretérito indefinido</strong> (passé simple) : <em>robó, detuvo, rescató, ocurrió</em>. Repère-les pour reconstituer l'action.</div>
<h3>3. Lis le fait divers suivant</h3>
<pre class="pseudo">RESCATAN A UN GATO ATRAPADO EN UN ÁRBOL

Sevilla. Ayer por la tarde, los bomberos rescataron a un gato
que llevaba dos días atrapado en un árbol muy alto.
Una vecina llamó a los bomberos porque oía maullar al animal.
Los bomberos llegaron rápidamente con una escalera larga.
Después de media hora, consiguieron bajar al gato sano y salvo.
El animal estaba asustado pero no resultó herido.
Su dueña, muy contenta, dio las gracias a los bomberos.
Muchos vecinos salieron a la calle para ver el rescate.
La historia se hizo viral en las redes sociales.</pre>
<div class="warn">Attention à la « a » personnelle : en espagnol, quand le complément d'objet est une personne (ou un animal familier), on met <strong>a</strong> : <em>rescataron a un gato</em>, <em>detuvieron a un ladrón</em>.</div>
<h3>4. Repérer les cinq questions clés</h3>
<pre class="pseudo">¿Quién?   = qui ?    → los bomberos, un gato
¿Qué?     = quoi ?   → un rescate
¿Cuándo?  = quand ?  → ayer por la tarde
¿Dónde?   = où ?     → Sevilla, en un árbol
¿Cómo?    = comment ? → con una escalera larga</pre>
<p>Répondre à ces cinq questions suffit à comprendre n'importe quel fait divers.</p>`,
  exercises: [
    { type: "qcm", q: "Quel est l'événement raconté ?", opts: ["un vol", "le sauvetage d'un chat", "un accident de voiture", "un incendie"], a: 1, exp: "Rescatan a un gato atrapado en un árbol." },
    { type: "input", q: "Qui a réalisé le sauvetage ? Complète : « los ___ ».", a: ["bomberos"], ph: "mot", exp: "Los bomberos rescataron al gato." },
    { type: "qcm", q: "Depuis combien de temps le chat était-il coincé ?", opts: ["deux heures", "deux jours", "deux semaines", "un mois"], a: 1, exp: "Llevaba dos días atrapado en un árbol." },
    { type: "vf", q: "C'est une voisine qui a appelé les pompiers.", a: true, exp: "Una vecina llamó a los bomberos." },
    { type: "input", q: "Pourquoi la voisine a-t-elle appelé ? Complète : « porque oía ___ al animal ».", a: ["maullar"], ph: "verbe", exp: "Oía maullar al animal = elle entendait miauler." },
    { type: "qcm", q: "Avec quoi les pompiers sont-ils arrivés ?", opts: ["un hélicoptère", "une échelle longue", "un filet", "une corde"], a: 1, exp: "Llegaron con una escalera larga." },
    { type: "vf", q: "Le chat a été gravement blessé.", a: false, exp: "Faux : estaba asustado pero no resultó herido." },
    { type: "qcm", q: "Combien de temps a duré le sauvetage ?", opts: ["cinq minutes", "une demi-heure", "deux heures", "toute la nuit"], a: 1, exp: "Después de media hora, consiguieron bajar al gato." },
    { type: "input", q: "Comment était le chat une fois descendu ? Complète : « sano y ___ ».", a: ["salvo"], ph: "mot", exp: "Sano y salvo = sain et sauf." },
    { type: "qcm", q: "Qu'a fait la propriétaire du chat ?", opts: ["elle s'est fâchée", "elle a remercié les pompiers", "elle est partie", "elle a pleuré de peur"], a: 1, exp: "Su dueña dio las gracias a los bomberos." },
    { type: "vf", q: "L'histoire est devenue virale sur les réseaux sociaux.", a: true, exp: "La historia se hizo viral en las redes sociales." },
    { type: "qcm", q: "« Rescatar » signifie :", opts: ["voler", "secourir / sauver", "arrêter", "blesser"], a: 1, exp: "Rescatar = secourir, sauver." },
    { type: "input", q: "Où s'est passé le fait divers ? (ville)", a: ["Sevilla", "sevilla"], ph: "ville", exp: "Sevilla (répond à ¿Dónde?)." },
    { type: "qcm", q: "Pourquoi met-on « a » dans « rescataron a un gato » ?", opts: ["c'est une faute", "c'est la « a » personnelle (COD animé)", "pour dire « à »", "sans raison"], a: 1, exp: "La a personnelle s'emploie devant un COD personne ou animal familier." },
    { type: "qcm", q: "À quel temps sont la plupart des verbes du récit ?", opts: ["au présent", "au pretérito indefinido (passé simple)", "au futur", "au conditionnel"], a: 1, exp: "Rescataron, llamó, llegaron… = indefinido." }
  ],
  final: {

    intro: `<p>Lis ce second fait divers :</p>
<pre class="pseudo">DETIENEN A UN LADRÓN GRACIAS A UN TESTIGO

Valencia. La policía detuvo anoche a un joven que había robado
un bolso en el centro de la ciudad.
Un testigo vio el robo y llamó inmediatamente a la policía.
El ladrón intentó escapar corriendo, pero no lo consiguió.
Los agentes lo encontraron cerca de la estación de tren.
La dueña del bolso recuperó todas sus cosas.
La mujer agradeció al testigo su rápida reacción.
La policía recordó la importancia de denunciar los robos.</pre>`,

      { type: "qcm", q: "Qui a permis d'attraper le voleur ?", opts: ["un policier seul", "un témoin", "la victime", "un chien"], a: 1, exp: "Un testigo vio el robo y llamó a la policía." },
      { type: "input", q: "Où a-t-on retrouvé le voleur ? Complète : « cerca de la ___ de tren ».", a: ["estación"], ph: "mot", exp: "Cerca de la estación de tren." },
      { type: "vf", q: "La propriétaire a récupéré toutes ses affaires.", a: true, exp: "La dueña del bolso recuperó todas sus cosas." },
      { type: "qcm", q: "Que rappelle la police à la fin ?", opts: ["de fermer les magasins", "l'importance de dénoncer les vols", "de courir plus vite", "d'acheter un chien"], a: 1, exp: "La importancia de denunciar los robos." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">UN VOLEUR ARRÊTÉ GRÂCE À UN TÉMOIN

Valence. La police a arrêté cette nuit un jeune qui avait volé
un sac dans le centre-ville.
Un témoin a vu le vol et a appelé immédiatement la police.
Le voleur a essayé de s'enfuir en courant, mais il n'y est pas parvenu.
Les agents l'ont trouvé près de la gare.
La propriétaire du sac a récupéré toutes ses affaires.
La femme a remercié le témoin pour sa réaction rapide.
La police a rappelé l'importance de dénoncer les vols.</pre>
<p>Note le plus-que-parfait « había robado » (il avait volé) : l'action est antérieure à l'arrestation. Les cinq questions (qui, quoi, quand, où, comment) permettent de tout comprendre.</p>`
  }
};
