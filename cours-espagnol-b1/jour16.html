<script>
var DAY = {
  num: 16,
  title: "L'environnement et l'actualité",
  subtitle: "Le vocabulaire pour parler d'écologie, des problèmes du monde et des nouvelles.",
  theory: `
<h3>1. Le vocabulaire de l'environnement</h3>
<p>Pour parler d'écologie au niveau B1, il faut maîtriser un vocabulaire précis. Voici les mots essentiels (espagnol → français) :</p>
<pre class="pseudo">el medio ambiente   = l'environnement
el calentamiento global = le réchauffement climatique
el cambio climático = le changement climatique
la contaminación    = la pollution
el reciclaje        = le recyclage
los residuos        = les déchets
la sequía           = la sécheresse
la energía renovable = l'énergie renouvelable
la naturaleza       = la nature
proteger / cuidar   = protéger / prendre soin</pre>
<p>Exemple : <em>Debemos proteger el medio ambiente</em> (Nous devons protéger l'environnement).</p>
<div class="tip">Astuce : beaucoup de mots ressemblent au français (contaminación, reciclaje, energía). Méfie-toi cependant des faux amis : <strong>contaminación</strong> signifie « pollution », pas « contamination » au sens médical.</div>
<h3>2. Le vocabulaire de l'actualité</h3>
<p>Pour comprendre les nouvelles et en parler, retiens ces expressions :</p>
<pre class="pseudo">las noticias        = les nouvelles / les infos
la actualidad       = l'actualité
un acontecimiento   = un événement
un suceso           = un fait divers
la prensa           = la presse
un titular          = un titre (de journal)
ocurrir / suceder   = se produire, arriver
según               = selon
denunciar           = dénoncer
preocupante         = préoccupant</pre>
<p>Exemple : <em>Según la prensa, la sequía es preocupante</em> (Selon la presse, la sécheresse est préoccupante).</p>
<h3>3. Parler des problèmes et des solutions</h3>
<p>On oppose souvent un problème à une solution avec des structures simples :</p>
<pre class="pseudo">El problema es que…      = Le problème est que…
Una solución sería…      = Une solution serait…
Habría que…              = Il faudrait…
Es necesario que + subj. = Il est nécessaire que…</pre>
<p>Exemple : <em>Habría que reducir los residuos y reciclar más</em> (Il faudrait réduire les déchets et recycler davantage).</p>
<div class="warn">Attention : après <strong>es necesario que</strong>, <strong>es importante que</strong>, on emploie le subjonctif : <em>Es necesario que cuidemos el planeta</em> (Il est nécessaire que nous prenions soin de la planète).</div>
<h3>4. Exprimer une inquiétude ou un espoir</h3>
<pre class="pseudo">Me preocupa…      = Cela m'inquiète…
Ojalá + subj.     = Pourvu que… / J'espère que…
Espero que + subj. = J'espère que…</pre>
<p>Exemple : <em>Ojalá el gobierno actúe pronto</em> (Pourvu que le gouvernement agisse vite).</p>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « l'environnement » en espagnol ?", opts: ["el ambiente médico", "el medio ambiente", "la actualidad", "el titular"], a: 1, exp: "El medio ambiente = l'environnement." },
    { type: "input", q: "Traduis « le réchauffement climatique » : el ___ global.", a: ["calentamiento"], ph: "mot", exp: "El calentamiento global." },
    { type: "qcm", q: "Que signifie « la contaminación » ?", opts: ["la contamination médicale", "la pollution", "le recyclage", "la sécheresse"], a: 1, exp: "Faux ami : contaminación = pollution." },
    { type: "vf", q: "« El reciclaje » veut dire « le recyclage ».", a: true, exp: "Vrai, el reciclaje = le recyclage." },
    { type: "input", q: "Complète : « los ___ » = les déchets.", a: ["residuos"], ph: "mot", exp: "Los residuos = les déchets." },
    { type: "qcm", q: "« Un suceso » désigne :", opts: ["un titre de journal", "un fait divers", "un journaliste", "un abonnement"], a: 1, exp: "Un suceso = un fait divers." },
    { type: "vf", q: "« Según » signifie « selon ».", a: true, exp: "Vrai : según la prensa = selon la presse." },
    { type: "qcm", q: "Après « es necesario que », quel mode utilise-t-on ?", opts: ["l'indicatif", "le subjonctif", "l'infinitif", "le conditionnel"], a: 1, exp: "Es necesario que + subjonctif : que cuidemos el planeta." },
    { type: "input", q: "Traduis « les nouvelles / les infos » : las ___.", a: ["noticias"], ph: "mot", exp: "Las noticias." },
    { type: "qcm", q: "Comment dit-on « il faudrait réduire » ?", opts: ["Hay reducir", "Habría que reducir", "Reduciré", "Reduce"], a: 1, exp: "Habría que + infinitif = il faudrait." },
    { type: "vf", q: "« Ojalá » est suivi du subjonctif.", a: true, exp: "Vrai : Ojalá llueva pronto." },
    { type: "input", q: "Complète : « la energía ___ » = l'énergie renouvelable.", a: ["renovable"], ph: "adjectif", exp: "La energía renovable." },
    { type: "qcm", q: "Compréhension : « Me preocupa la sequía en el sur. » Quel sentiment ?", opts: ["de la joie", "de l'inquiétude", "de l'indifférence", "de la colère"], a: 1, exp: "Me preocupa = cela m'inquiète." },
    { type: "qcm", q: "Compréhension : « Según los expertos, hay que reciclar más. » Qui parle ?", opts: ["le gouvernement", "les experts", "les enfants", "personne"], a: 1, exp: "Según los expertos = selon les experts." },
    { type: "input", q: "Traduis « protéger » (infinitif) : ___.", a: ["proteger"], ph: "verbe", exp: "Proteger = protéger." }
  ],
  final: {
    title: "Exercice final — Una noticia sobre el medio ambiente",
    intro: `<p>Lis cette brève d'actualité :</p>
<pre class="pseudo">Según un estudio reciente, la contaminación del aire
sigue siendo un problema muy preocupante en las grandes ciudades.
Los expertos denuncian que el tráfico produce demasiados residuos.
El calentamiento global también afecta a la agricultura:
la sequía destruye muchas cosechas cada verano.
Una solución sería usar más energía renovable y transporte público.
El gobierno anunció ayer un plan para reducir la contaminación.
Ojalá las medidas funcionen pronto.
Muchos ciudadanos ya reciclan y cuidan la naturaleza.
Todos podemos proteger el medio ambiente.</pre>`,
    questions: [
      { type: "qcm", q: "Quel est le problème principal évoqué ?", opts: ["le chômage", "la pollution de l'air", "le prix des transports", "la santé"], a: 1, exp: "La contaminación del aire = la pollution de l'air." },
      { type: "qcm", q: "Selon le texte, qu'est-ce qui produit trop de déchets ?", opts: ["l'agriculture", "le trafic (la circulation)", "les usines d'eau", "les écoles"], a: 1, exp: "El tráfico produce demasiados residuos." },
      { type: "input", q: "Que détruit la sécheresse chaque été ? (un mot espagnol)", a: ["cosechas", "las cosechas"], ph: "mot", exp: "La sequía destruye muchas cosechas = les récoltes." },
      { type: "qcm", q: "Quelle solution est proposée ?", opts: ["fermer les villes", "plus d'énergie renouvelable et de transport public", "interdire l'agriculture", "ne rien faire"], a: 1, exp: "Una solución sería usar más energía renovable y transporte público." },
      { type: "vf", q: "Le gouvernement a annoncé un plan contre la pollution.", a: true, exp: "El gobierno anunció ayer un plan para reducir la contaminación." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Selon une étude récente, la pollution de l'air
reste un problème très préoccupant dans les grandes villes.
Les experts dénoncent que le trafic produit trop de déchets.
Le réchauffement climatique affecte aussi l'agriculture :
la sécheresse détruit beaucoup de récoltes chaque été.
Une solution serait d'utiliser plus d'énergie renouvelable et de transports publics.
Le gouvernement a annoncé hier un plan pour réduire la pollution.
Pourvu que les mesures fonctionnent vite.
Beaucoup de citoyens recyclent déjà et prennent soin de la nature.
Nous pouvons tous protéger l'environnement.</pre>
<p>Remarque le subjonctif après <strong>Ojalá</strong> (funcionen) et la structure <strong>Una solución sería…</strong> pour proposer une idée.</p>`
  }
};
</script>

    ],
    solution: "Me preocupa mucho la contaminación en mi ciudad. Cada día hay más coches y el aire está muy sucio. Según los expertos, el tráfico es uno de los mayores problemas para el medio ambiente. Además, la gente produce demasiados residuos y no recicla lo suficiente. Una solución sería usar más el transporte público y la bicicleta. También habría que construir más carriles bici. Es necesario que todos cuidemos la naturaleza. Ojalá el gobierno actúe pronto.\n\nTraduction : La pollution dans ma ville m'inquiète beaucoup. Chaque jour il y a plus de voitures et l'air est très sale. Selon les experts, le trafic est l'un des plus grands problèmes pour l'environnement. De plus, les gens produisent trop de déchets et ne recyclent pas assez. Une solution serait d'utiliser davantage les transports publics et le vélo. Il faudrait aussi construire plus de pistes cyclables. Il est nécessaire que nous prenions tous soin de la nature. Pourvu que le gouvernement agisse vite.",
    note: "Pour un sujet d'actualité, structure ton texte : problème → cause → conséquence → solution. Les tournures « Una solución sería », « Habría que » et « Es necesario que + subjonctif » sont très utiles à l'examen B1." }
  ]
};
