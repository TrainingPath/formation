<script>
var DAY = {
  num: 12,
  title: "Por et para : approfondissement",
  subtitle: "Deux petits mots, mille nuances : la cause et le but, la traversée et la destination.",
  theory: `
<h3>1. Le problème et la clé</h3>
<p>Por et para se traduisent souvent tous deux par « pour » en français, d'où la confusion. La clé pour ne plus se tromper : <strong>PARA regarde vers l'avant</strong> (le but, la destination, l'objectif) ; <strong>POR regarde vers l'arrière ou autour</strong> (la cause, le motif, le moyen, le lieu traversé).</p>
<pre class="pseudo">PARA = vers un objectif ->  (le but, la finalité)
POR  = à cause de / à travers <- (l'origine, le motif)</pre>
<h3>2. Les emplois de PARA (le but, la destination)</h3>
<pre class="pseudo">- but / objectif :   Estudio para aprobar. (pour réussir)
- destinataire :     Este regalo es para ti. (pour toi)
- destination :      Salgo para Madrid. (vers Madrid)
- échéance / délai : Lo necesito para el lunes. (pour lundi)
- opinion :          Para mí, es un error. (selon moi)
- comparaison :      Para su edad, lee mucho. (pour son âge)</pre>
<div class="tip">Astuce du but : après para, on trouve souvent un infinitif qui répond à « dans quel but ? ». Trabajo para vivir = je travaille POUR vivre (finalité).</div>
<h3>3. Les emplois de POR (la cause, le moyen, le lieu)</h3>
<pre class="pseudo">- cause / motif :    Lo hago por amor. (par amour)
                     Gracias por tu ayuda. (pour/grâce à ton aide)
- lieu traversé :    Paseo por el parque. (à travers le parc)
- moyen :            Hablamos por teléfono. (par téléphone)
- durée :            Estudié por dos horas. (pendant deux heures)
- échange / prix :   Lo compré por 20 euros. (pour 20 euros)
- en faveur de :     Lucho por mis derechos. (pour mes droits)
- fréquence :        Dos veces por semana. (par semaine)</pre>
<h3>4. Le contraste décisif : but (para) vs cause (por)</h3>
<pre class="pseudo">Lo hago POR ti.   = Je le fais À CAUSE de toi / pour toi (tu es le motif).
Lo hago PARA ti.  = Je le fais POUR toi (tu es le destinataire/bénéficiaire).

Estudio POR mi futuro.  = J'étudie à cause de / motivé par mon avenir.
Estudio PARA mi futuro. = J'étudie en vue de mon avenir (objectif).</pre>
<div class="warn">Question test : « pourquoi ? » (motif, cause passée) -> por. « pour quoi faire ? » (but, objectif futur) -> para. Trabajo por dinero (le motif : l'argent) / Trabajo para ahorrar (le but : économiser).</div>
<h3>5. Expressions figées à mémoriser</h3>
<pre class="pseudo">Avec POR :               Avec PARA :
por favor (s'il te plaît)  para siempre (pour toujours)
por fin (enfin)            para nada (pas du tout)
por ejemplo (par exemple)  estar para (être sur le point de)
por supuesto (bien sûr)    no es para tanto (ce n'est pas si grave)
por cierto (au fait)
por eso (c'est pourquoi)</pre>
<p>Exemple synthèse : <em>Por fin salgo para la playa; conduzco por la costa para llegar antes</em> (Enfin je pars pour la plage ; je roule le long de la côte pour arriver plus tôt).</p>`,
  exercises: [
    { type: "qcm", q: "En bref, PARA exprime plutôt :", opts: ["la cause", "le but / la destination", "le lieu traversé", "la durée"], a: 1, exp: "Para regarde vers l'avant : but, destination, objectif." },
    { type: "qcm", q: "POR exprime plutôt :", opts: ["le but / l'objectif", "la cause, le moyen, le lieu traversé", "l'opinion", "l'échéance"], a: 1, exp: "Por regarde en arrière/autour : cause, motif, moyen, lieu." },
    { type: "input", q: "Complète : Estudio ___ aprobar el examen. (but)", a: ["para"], ph: "por/para", exp: "But (réussir) -> para aprobar." },
    { type: "input", q: "Complète : Gracias ___ tu ayuda. (motif)", a: ["por"], ph: "por/para", exp: "Cause/motif -> gracias por." },
    { type: "qcm", q: "« Este regalo es ___ ti » (destinataire) :", opts: ["por", "para", "de", "con"], a: 1, exp: "Destinataire -> para ti." },
    { type: "input", q: "Complète : Paseo ___ el parque. (lieu traversé)", a: ["por"], ph: "por/para", exp: "Lieu traversé -> por el parque (à travers le parc)." },
    { type: "qcm", q: "« Lo necesito ___ el lunes » (échéance) :", opts: ["por", "para", "en", "a"], a: 1, exp: "Échéance/délai -> para el lunes." },
    { type: "input", q: "Complète : Hablamos ___ teléfono. (moyen)", a: ["por"], ph: "por/para", exp: "Moyen -> por teléfono." },
    { type: "qcm", q: "Quelle phrase exprime un BUT ?", opts: ["Trabajo por dinero", "Trabajo para ahorrar", "Paseo por la ciudad", "Lo compré por 20 euros"], a: 1, exp: "Para ahorrar = objectif (économiser)." },
    { type: "input", q: "Complète : ___ mí, esta película es aburrida. (opinion)", a: ["Para", "para"], ph: "por/para", exp: "Opinion -> para mí (selon moi)." },
    { type: "qcm", q: "« Lo compré ___ 20 euros » (prix/échange) :", opts: ["para", "por", "de", "a"], a: 1, exp: "Prix/échange -> por 20 euros." },
    { type: "vf", q: "« Salgo para Madrid » indique la destination.", a: true, exp: "Vrai : para + lieu = destination (je pars pour Madrid)." },
    { type: "qcm", q: "Comprension : « Lo hago por ti » et « Lo hago para ti » : quelle différence ?", opts: ["aucune", "por ti = à cause de toi (motif) ; para ti = pour toi (destinataire)", "les deux veulent dire 'contre toi'", "por = futur, para = passé"], a: 1, exp: "Por = motif/cause ; para = destinataire/bénéficiaire." },
    { type: "input", q: "Complète l'expression figée : ___ favor, ayúdame.", a: ["Por", "por"], ph: "por/para", exp: "Expression figée : por favor (s'il te plaît)." },
    { type: "qcm", q: "Comprension : « Estudié por tres horas para el examen. » Que signifie chaque élément ?", opts: ["por = durée (pendant), para = but (en vue de l'examen)", "les deux = but", "por = but, para = durée", "aucun sens"], a: 0, exp: "Por tres horas = durée ; para el examen = objectif." }
  ],
  final: {
    title: "Exercice final — Un correo de agradecimiento",
    intro: `<p>Sara escribe a una compañera después de un proyecto :</p>
<pre class="pseudo">Hola Marta :
Gracias por toda tu ayuda durante estas semanas.
Trabajaste mucho para que el proyecto saliera bien.
Preparé este pequeño regalo para ti como agradecimiento.
Estuvimos reunidos por horas, pero valió la pena.
Para mí, has sido la mejor compañera de equipo.
Salgo para Valencia el lunes, pero seguimos en contacto por correo.</pre>`,
    questions: [
      { type: "qcm", q: "« Gracias por toda tu ayuda » : por exprime :", opts: ["le but", "la cause / le motif du remerciement", "la destination", "l'échéance"], a: 1, exp: "Gracias por = motif du remerciement (por = cause)." },
      { type: "input", q: "Complète : Preparé este regalo ___ ti. (destinataire)", a: ["para"], ph: "por/para", exp: "Destinataire -> para ti." },
      { type: "qcm", q: "« Estuvimos reunidos por horas » : por indique ici :", opts: ["le but", "la durée (pendant des heures)", "l'opinion", "la destination"], a: 1, exp: "Por horas = durée (pendant des heures)." },
      { type: "vf", q: "« Salgo para Valencia » exprime la destination.", a: true, exp: "Vrai : para + lieu = destination." },
      { type: "input", q: "Complète : Seguimos en contacto ___ correo. (moyen)", a: ["por"], ph: "por/para", exp: "Moyen -> por correo (par courrier/mail)." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Salut Marta,
Merci pour toute ton aide pendant ces semaines.
Tu as beaucoup travaillé pour que le projet réussisse.
J'ai préparé ce petit cadeau pour toi en remerciement.
Nous avons été en réunion pendant des heures, mais ça valait la peine.
Pour moi, tu as été la meilleure coéquipière.
Je pars pour Valence lundi, mais on reste en contact par mail.</pre>
<p>Repère la logique : <strong>por</strong> pour la cause (gracias por), la durée (por horas) et le moyen (por correo) ; <strong>para</strong> pour le but (para que salga bien), le destinataire (para ti), l'opinion (para mí) et la destination (para Valencia). Le fil rouge : para vise l'avant, por renvoie au motif ou au trajet.</p>`
  }
};
</script>
<script src="engine.js"></script>

  { id: "es-b1-j12", title: "Un message de remerciement", level: 2,

    hints: [
      "Por : cause (gracias por), moyen (por teléfono), durée (por dos semanas), lieu (por la ciudad).",
      "Para : but (para mejorar), destinataire (para ti), destination (para Sevilla), opinion (para mí).",
      "Teste : « pourquoi ? » (motif) -> por ; « pour quoi faire ? » (objectif) -> para."
    ],
    solution: "Querido Diego : gracias por acompañarme durante todo este tiempo. He preparado este viaje para desconectar un poco del trabajo. Salgo para Sevilla el sábado y estaré allí por una semana. Para mí, viajar es la mejor forma de aprender. Te escribiré por mensaje cada día para contarte cómo va todo. Lo hago también por ti, para que veas que se puede cambiar de aires.\n\nTraduction : Cher Diego, merci de m'avoir accompagné pendant tout ce temps. J'ai préparé ce voyage pour me déconnecter un peu du travail. Je pars pour Séville samedi et j'y resterai pendant une semaine. Pour moi, voyager est la meilleure façon d'apprendre. Je t'écrirai par message chaque jour pour te raconter comment ça se passe. Je le fais aussi pour toi, pour que tu voies qu'on peut changer d'air.",

  ]
