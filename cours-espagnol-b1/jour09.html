var DAY = {
  num: 9,
  title: "Les questions indirectes",
  subtitle: "Rapporter une question sans point d'interrogation : « Il me demande si… / où… / quand… ».",
  theory: `
<h3>1. Qu'est-ce qu'une question indirecte ?</h3>
<p>Une question directe se pose telle quelle, avec des points d'interrogation : <em>¿Dónde vives?</em>. Une <strong>question indirecte</strong> l'intègre dans une phrase après un verbe comme preguntar (demander), no saber (ne pas savoir), querer saber (vouloir savoir) : <em>Me pregunta dónde vivo</em> (Il me demande où j'habite). Il n'y a plus de points d'interrogation.</p>
<pre class="pseudo">Directe :   ¿Dónde trabajas?
Indirecte : Me pregunta dónde trabajo.
            = Il me demande où je travaille.</pre>
<h3>2. Deux cas : question ouverte ou fermée</h3>
<p><strong>Question fermée</strong> (réponse oui/non) : on introduit avec <strong>si</strong> (= « si » interrogatif).</p>
<pre class="pseudo">Directe :   ¿Vienes a la fiesta?
Indirecte : Me pregunta si voy a la fiesta.
            = Il me demande si je viens à la fête.</pre>
<p><strong>Question ouverte</strong> (avec un mot interrogatif) : on garde le mot interrogatif, <strong>toujours avec son accent écrit</strong>.</p>
<pre class="pseudo">qué (quoi)     dónde (où)      cuándo (quand)
quién (qui)    cómo (comment)  cuánto (combien)
por qué (pourquoi)   cuál (lequel)</pre>
<div class="warn">Attention : dans les questions indirectes, les mots interrogatifs GARDENT leur accent écrit, même sans point d'interrogation. « No sé dónde está » (dónde avec accent), pas « donde ».</div>
<h3>3. La concordance des temps s'applique aussi</h3>
<p>Comme pour le style indirect (jour 8), si le verbe introducteur est au passé, les temps reculent.</p>
<pre class="pseudo">Introducteur au PRÉSENT (pas de changement) :
« ¿Dónde vives? »  -> Me pregunta dónde vivo.

Introducteur au PASSÉ (concordance) :
« ¿Dónde vives? »  -> Me preguntó dónde vivía.
« ¿Vendrás? »      -> Me preguntó si vendría.
« ¿Has comido? »   -> Me preguntó si había comido.</pre>
<h3>4. L'ordre des mots</h3>
<p>Dans la question indirecte, on revient souvent à l'ordre <strong>sujet + verbe</strong> (comme une affirmation), alors que la question directe peut inverser.</p>
<pre class="pseudo">Directe :   ¿Qué quiere Juan?      (verbe avant sujet)
Indirecte : No sé qué quiere Juan / qué Juan quiere.
Directe :   ¿Cuándo llega el tren?
Indirecte : Pregunta cuándo llega el tren.</pre>
<h3>5. Verbes introducteurs de questions</h3>
<pre class="pseudo">preguntar (si / qué...)  = demander
querer saber             = vouloir savoir
no saber                 = ne pas savoir
me gustaría saber        = j'aimerais savoir
¿Sabes...?               = sais-tu...?</pre>
<p>Exemples : <em>No sé si vendrá</em> (Je ne sais pas s'il viendra). <em>Me gustaría saber cuánto cuesta</em> (J'aimerais savoir combien ça coûte). <em>¿Sabes dónde está la estación?</em> (Sais-tu où est la gare ?).</p>`,
  exercises: [
    { type: "qcm", q: "Une question indirecte fermée (oui/non) s'introduit avec :", opts: ["que", "si", "cual", "cuando"], a: 1, exp: "Question fermée -> si : me pregunta si vengo." },
    { type: "input", q: "Directe : « ¿Vienes? ». Indirecte : Me pregunta ___ vengo.", a: ["si"], ph: "mot", exp: "Question fermée -> si (sans accent, ce n'est pas si affirmatif)." },
    { type: "qcm", q: "Dans une question indirecte ouverte, le mot interrogatif :", opts: ["perd son accent", "garde son accent écrit", "disparaît", "devient que"], a: 1, exp: "Dónde, qué, cuándo gardent leur accent : No sé dónde está." },
    { type: "input", q: "Complète avec accent : No sé ___ vive ella. (où)", a: ["dónde", "donde"], ph: "mot", exp: "Dónde (avec accent) dans une question indirecte." },
    { type: "qcm", q: "Directe : « ¿Qué quieres? ». Indirecte (présent) :", opts: ["Me pregunta que quieres", "Me pregunta qué quiero", "Me pregunta si quiero", "Me pregunta quiero"], a: 1, exp: "Question ouverte : qué (accent) + adaptation de la personne (quiero)." },
    { type: "input", q: "Directe : « ¿Cuándo llegas? ». Indirecte : Quiere saber ___ llego. (avec accent)", a: ["cuándo", "cuando"], ph: "mot", exp: "Cuándo garde son accent dans la question indirecte." },
    { type: "vf", q: "Une question indirecte se termine par un point d'interrogation.", a: false, exp: "Faux : la question indirecte est une affirmation, sans points d'interrogation." },
    { type: "qcm", q: "Introducteur au passé : « ¿Dónde vives? » ->", opts: ["Me preguntó dónde vivo", "Me preguntó dónde vivía", "Me preguntó dónde viviré", "Me preguntó dónde viva"], a: 1, exp: "Concordance : présent (vives) -> imparfait (vivía) après preguntó." },
    { type: "input", q: "Directe : « ¿Vendrás? ». Indirecte passé : Me preguntó si ___ . (venir, conditionnel)", a: ["vendría", "vendria"], ph: "verbe", exp: "Futur -> conditionnel : si vendría." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["No sé donde esta", "No sé dónde está", "No sé que dónde está", "No sé si dónde está"], a: 1, exp: "No sé dónde está : accent sur dónde, verbe está." },
    { type: "input", q: "Complète : Me gustaría saber ___ cuesta el billete. (combien)", a: ["cuánto", "cuanto"], ph: "mot", exp: "Cuánto (avec accent) : combien coûte le billet." },
    { type: "vf", q: "« Pregunta si voy » est une question indirecte fermée.", a: true, exp: "Vrai : si + question à réponse oui/non." },
    { type: "qcm", q: "Comprension : « No sé si vendrá a la reunión. » Que sait-on ?", opts: ["Il viendra sûrement", "Le locuteur ignore si l'autre viendra", "Il ne viendra jamais", "La réunion est annulée"], a: 1, exp: "No sé si vendrá = j'ignore s'il viendra (incertitude)." },
    { type: "input", q: "Directe : « ¿Por qué estudias español? ». Indirecte : Me pregunta ___ estudio español. (avec accent)", a: ["por qué", "porqué", "porque"], ph: "mots", exp: "Por qué (deux mots, avec accent) dans une question indirecte." },
    { type: "qcm", q: "Comprension : « Me preguntó cómo me llamaba y de dónde era. » Que voulait savoir la personne ?", opts: ["mon âge et mon travail", "mon nom et mon origine", "l'heure et le lieu", "rien de précis"], a: 1, exp: "Cómo me llamaba (nom) + de dónde era (origine)." }
  ],
  final: {
    title: "Exercice final — Una entrevista de curiosos",
    intro: `<p>Un periodista cuenta las preguntas que le hizo un niño muy curioso :</p>
<pre class="pseudo">El niño me preguntó cómo me llamaba.
Quería saber de dónde venía y qué hacía en la ciudad.
Me preguntó si conocía a alguien famoso.
No entendía por qué escribía tantas cosas en mi cuaderno.
Me preguntó cuánto ganaba y si mi trabajo era divertido.
Al final, quiso saber cuándo volvería a verlo.</pre>`,
    questions: [
      { type: "qcm", q: "« Me preguntó cómo me llamaba » : cómo porte-t-il un accent ?", opts: ["non, jamais", "oui, les interrogatifs gardent l'accent en question indirecte", "seulement au pluriel", "seulement à l'oral"], a: 1, exp: "Cómo garde son accent écrit dans la question indirecte." },
      { type: "input", q: "Relève le mot introducteur d'une question fermée : Me preguntó ___ conocía a alguien famoso.", a: ["si"], ph: "mot", exp: "Question oui/non -> si (sans accent)." },
      { type: "qcm", q: "« No entendía por qué escribía tantas cosas » : escribía est à l'imparfait car :", opts: ["c'est le futur", "concordance après un introducteur au passé", "c'est un ordre", "erreur"], a: 1, exp: "Introducteur au passé -> présent devient imparfait (escribía)." },
      { type: "vf", q: "« Quiso saber cuándo volvería a verlo » emploie le conditionnel par concordance.", a: true, exp: "Futur (volveré) -> conditionnel (volvería) après quiso saber (passé)." },
      { type: "input", q: "Complète : Me preguntó ___ ganaba. (combien, avec accent)", a: ["cuánto", "cuanto"], ph: "mot", exp: "Cuánto avec accent : combien je gagnais." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">L'enfant m'a demandé comment je m'appelais.
Il voulait savoir d'où je venais et ce que je faisais en ville.
Il m'a demandé si je connaissais quelqu'un de célèbre.
Il ne comprenait pas pourquoi j'écrivais tant de choses dans mon carnet.
Il m'a demandé combien je gagnais et si mon travail était amusant.
À la fin, il a voulu savoir quand je reviendrais le voir.</pre>
<p>Deux mécanismes se combinent : les mots interrogatifs (cómo, de dónde, qué, por qué, cuánto, cuándo) gardent leur accent, les questions oui/non passent par si, et la concordance des temps recule tout au passé (llamaba, venía, escribía, volvería).</p>`
  }
};
</script>
