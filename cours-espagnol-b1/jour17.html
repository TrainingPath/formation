<script>
var DAY = {
  num: 17,
  title: "Les médias et la technologie",
  subtitle: "Parler d'internet, des réseaux sociaux et des appareils numériques.",
  theory: `
<h3>1. Le vocabulaire des médias</h3>
<p>Les médias (los medios de comunicación) occupent une grande place dans les examens B1. Voici l'essentiel :</p>
<pre class="pseudo">los medios de comunicación = les médias
la prensa            = la presse
un periódico / un diario = un journal
una revista          = un magazine
un canal (de TV)     = une chaîne (de télé)
una cadena           = une chaîne / un réseau
las redes sociales   = les réseaux sociaux
una noticia falsa    = une fausse nouvelle (fake news)
un usuario           = un utilisateur
la publicidad        = la publicité</pre>
<p>Exemple : <em>Muchos jóvenes se informan por las redes sociales</em> (Beaucoup de jeunes s'informent via les réseaux sociaux).</p>
<div class="tip">Astuce : le verbe <strong>informarse</strong> (s'informer) est pronominal : <em>me informo, te informas, se informa…</em></div>
<h3>2. Le vocabulaire de la technologie</h3>
<pre class="pseudo">el ordenador (Esp.) / la computadora (Amér.) = l'ordinateur
el móvil (Esp.) / el celular (Amér.) = le téléphone portable
la pantalla          = l'écran
la contraseña        = le mot de passe
descargar            = télécharger
navegar (por internet) = naviguer (sur internet)
un archivo           = un fichier
la nube              = le cloud (le nuage)
una aplicación / una app = une application
conectarse           = se connecter</pre>
<p>Exemple : <em>Tienes que descargar la aplicación en tu móvil</em> (Tu dois télécharger l'application sur ton portable).</p>
<div class="warn">Attention aux différences Espagne / Amérique latine : <strong>ordenador</strong> et <strong>móvil</strong> en Espagne, <strong>computadora</strong> et <strong>celular</strong> en Amérique latine. Les deux sont corrects en B1.</div>
<h3>3. Parler des avantages et inconvénients</h3>
<pre class="pseudo">una ventaja          = un avantage
un inconveniente     = un inconvénient
por un lado… por otro lado = d'un côté… de l'autre
además               = de plus
sin embargo          = cependant
depende de           = cela dépend de</pre>
<p>Exemple : <em>Internet tiene muchas ventajas, sin embargo también hay riesgos</em> (Internet a beaucoup d'avantages, cependant il y a aussi des risques).</p>
<h3>4. Verbes utiles du numérique</h3>
<pre class="pseudo">colgar una foto   = poster une photo
compartir         = partager
enviar un mensaje = envoyer un message
bloquear          = bloquer
actualizar        = mettre à jour</pre>
<p>Exemple : <em>Compartí el vídeo con mis amigos</em> (J'ai partagé la vidéo avec mes amis).</p>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « les réseaux sociaux » ?", opts: ["los medios sociales", "las redes sociales", "las cadenas", "los canales"], a: 1, exp: "Las redes sociales." },
    { type: "input", q: "Traduis « le mot de passe » : la ___.", a: ["contraseña"], ph: "mot", exp: "La contraseña." },
    { type: "qcm", q: "En Espagne, l'ordinateur se dit :", opts: ["la computadora", "el ordenador", "el celular", "el archivo"], a: 1, exp: "El ordenador (Espagne) / la computadora (Amérique)." },
    { type: "vf", q: "« Descargar » signifie « télécharger ».", a: true, exp: "Vrai, descargar = télécharger." },
    { type: "input", q: "Complète : « navegar por ___ » = naviguer sur internet.", a: ["internet"], ph: "mot", exp: "Navegar por internet." },
    { type: "qcm", q: "Que signifie « una noticia falsa » ?", opts: ["une bonne nouvelle", "une fausse nouvelle (fake news)", "un journal", "une publicité"], a: 1, exp: "Una noticia falsa = fake news." },
    { type: "vf", q: "« El móvil » et « el celular » désignent le téléphone portable.", a: true, exp: "Vrai : móvil (Esp.) / celular (Amér.)." },
    { type: "qcm", q: "« Sin embargo » veut dire :", opts: ["de plus", "cependant", "parce que", "d'un côté"], a: 1, exp: "Sin embargo = cependant." },
    { type: "input", q: "Traduis « partager » (infinitif) : ___.", a: ["compartir"], ph: "verbe", exp: "Compartir = partager." },
    { type: "qcm", q: "Comment dit-on « un avantage » ?", opts: ["un inconveniente", "una ventaja", "una pantalla", "un usuario"], a: 1, exp: "Una ventaja = un avantage." },
    { type: "vf", q: "« La nube » désigne le cloud (le nuage informatique).", a: true, exp: "Vrai : guardar en la nube = enregistrer dans le cloud." },
    { type: "input", q: "Complète : « colgar una ___ » = poster une photo.", a: ["foto"], ph: "mot", exp: "Colgar una foto." },
    { type: "qcm", q: "Compréhension : « Me informo por internet, pero verifico las fuentes. » Que fait la personne ?", opts: ["elle ne lit rien", "elle s'informe et vérifie ses sources", "elle regarde la télé", "elle poste des photos"], a: 1, exp: "Me informo… pero verifico las fuentes = je vérifie mes sources." },
    { type: "qcm", q: "Compréhension : « El móvil tiene ventajas, sin embargo puede crear adicción. » Quel est le ton ?", opts: ["totalement positif", "nuancé (avantages et inconvénients)", "totalement négatif", "neutre sans opinion"], a: 1, exp: "Ventajas + sin embargo… adicción = point de vue nuancé." },
    { type: "input", q: "Traduis « mettre à jour » (infinitif) : ___.", a: ["actualizar"], ph: "verbe", exp: "Actualizar = mettre à jour." }
  ],
  final: {
    title: "Exercice final — La tecnología en nuestra vida",
    intro: `<p>Lis ce petit texte d'opinion :</p>
<pre class="pseudo">Hoy en día la tecnología está en todas partes.
Usamos el móvil para hablar, trabajar y informarnos.
Por un lado, internet tiene muchas ventajas:
podemos comunicarnos con gente de todo el mundo.
Las redes sociales nos permiten compartir fotos y noticias.
Sin embargo, también hay inconvenientes.
A veces circulan noticias falsas y la gente las cree.
Además, muchos jóvenes pasan demasiadas horas ante la pantalla.
Por eso es importante usar la tecnología con responsabilidad.
En mi opinión, depende de cómo la utilicemos.</pre>`,
    questions: [
      { type: "qcm", q: "Selon le texte, à quoi sert le portable ?", opts: ["seulement à jouer", "à parler, travailler et s'informer", "à rien d'utile", "à dormir"], a: 1, exp: "Usamos el móvil para hablar, trabajar y informarnos." },
      { type: "qcm", q: "Quel avantage d'internet est cité ?", opts: ["gagner de l'argent", "communiquer avec le monde entier", "moins dormir", "acheter des voitures"], a: 1, exp: "Podemos comunicarnos con gente de todo el mundo." },
      { type: "input", q: "Quel type de nouvelles circule parfois ? (deux mots espagnols)", a: ["noticias falsas", "las noticias falsas"], ph: "…", exp: "A veces circulan noticias falsas." },
      { type: "vf", q: "Le texte dit que beaucoup de jeunes passent trop de temps devant l'écran.", a: true, exp: "Muchos jóvenes pasan demasiadas horas ante la pantalla." },
      { type: "qcm", q: "Quelle est la conclusion de l'auteur ?", opts: ["la technologie est mauvaise", "cela dépend de la façon dont on l'utilise", "il faut tout interdire", "internet est parfait"], a: 1, exp: "Depende de cómo la utilicemos." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">De nos jours la technologie est partout.
Nous utilisons le portable pour parler, travailler et nous informer.
D'un côté, internet a beaucoup d'avantages :
nous pouvons communiquer avec des gens du monde entier.
Les réseaux sociaux nous permettent de partager photos et nouvelles.
Cependant, il y a aussi des inconvénients.
Parfois de fausses nouvelles circulent et les gens les croient.
De plus, beaucoup de jeunes passent trop d'heures devant l'écran.
C'est pourquoi il est important d'utiliser la technologie avec responsabilité.
À mon avis, cela dépend de la façon dont nous l'utilisons.</pre>
<p>Observe les connecteurs qui structurent un texte d'opinion : <strong>por un lado, sin embargo, además, por eso, en mi opinión</strong>.</p>`
  }
};
</script>
