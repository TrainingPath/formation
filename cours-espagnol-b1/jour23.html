  title: "Raconter un événement en détail",
  subtitle: "Structurer un récit riche : chronologie, décor et émotions.",
  theory: `
<h3>1. Les trois temps du récit</h3>
<p>Pour raconter en détail au niveau B1, on combine trois temps du passé, chacun avec un rôle précis :</p>
<pre class="pseudo">Imperfecto  → le décor, l'habitude    (Hacía sol, todos dormían)
Indefinido  → l'action ponctuelle     (De repente, sonó el móvil)
Pluscuamperfecto → l'action antérieure (Ya había salido cuando llegué)</pre>
<p>Exemple : <em>Cuando llegué a casa, mi hermano ya había preparado la cena</em> (Quand je suis arrivé à la maison, mon frère avait déjà préparé le dîner).</p>
<div class="tip">Astuce : le plus-que-parfait (pluscuamperfecto) se forme avec <strong>había + participe passé</strong> : había comido, había salido, había visto. Il exprime « avait fait », une action avant une autre action passée.</div>
<h3>2. Les connecteurs de temps</h3>
<pre class="pseudo">primero            = d'abord
al principio       = au début
luego / después    = ensuite / après
mientras           = pendant que
de repente         = soudain
en ese momento     = à ce moment-là
al final           = à la fin
por fin            = enfin</pre>
<p>Exemple : <em>Primero cenamos, luego vimos una película y al final nos dormimos</em> (D'abord nous avons dîné, ensuite nous avons regardé un film et à la fin nous nous sommes endormis).</p>
<h3>3. Ajouter des détails et des émotions</h3>
<pre class="pseudo">estaba nervioso / emocionado = j'étais nerveux / ému
me di cuenta de que…        = je me suis rendu compte que…
no podía creerlo            = je n'arrivais pas à y croire
fue increíble / horrible    = ce fut incroyable / horrible
lo que más me gustó fue…    = ce qui m'a le plus plu, c'est…</pre>
<p>Un bon récit ne dit pas seulement CE qui s'est passé, mais aussi comment on l'a vécu.</p>
<div class="warn">Attention à l'accord du participe dans le pluscuamperfecto : il reste <strong>invariable</strong> (había comido, había salido), contrairement au français « elle était sortie ».</div>
<h3>4. Un exemple de récit détaillé</h3>
<pre class="pseudo">El día de mi cumpleaños empezó de forma normal.
Hacía frío y no esperaba nada especial.
Cuando llegué a casa por la tarde, todo estaba oscuro.
De repente, se encendió la luz: mis amigos habían preparado una fiesta.
No podía creerlo. Estaba muy emocionado.
Primero cantamos, luego comimos tarta y al final bailamos.
Fue el mejor cumpleaños de mi vida.</pre>`,
  exercises: [
    { type: "qcm", q: "Quel temps sert à décrire le décor d'un récit ?", opts: ["l'indefinido", "l'imperfecto", "le pluscuamperfecto", "le futur"], a: 1, exp: "L'imperfecto pose le décor (hacía frío)." },
    { type: "input", q: "Forme le pluscuamperfecto de COMER (yo) : había ___.", a: ["comido"], ph: "participe", exp: "Había comido = j'avais mangé." },
    { type: "qcm", q: "« Ya había salido cuando llegué. » Quelle action est la première ?", opts: ["llegué (je suis arrivé)", "había salido (il était sorti)", "les deux en même temps", "aucune"], a: 1, exp: "Había salido est antérieure à llegué." },
    { type: "vf", q: "« De repente » introduit une action soudaine (indefinido).", a: true, exp: "Vrai : de repente, sonó el teléfono." },
    { type: "input", q: "Complète le connecteur : « ___ cenamos, luego salimos. » (D'abord)", a: ["primero", "Primero"], ph: "connecteur", exp: "Primero = d'abord." },
    { type: "qcm", q: "Comment dit-on « je n'arrivais pas à y croire » ?", opts: ["no puedo creerlo", "no podía creerlo", "no creeré", "no creo"], a: 1, exp: "No podía creerlo (imperfecto)." },
    { type: "vf", q: "Le pluscuamperfecto se forme avec « había » + participe passé.", a: true, exp: "Vrai : había preparado, había visto." },
    { type: "qcm", q: "« Mientras » signifie :", opts: ["soudain", "pendant que", "à la fin", "d'abord"], a: 1, exp: "Mientras = pendant que." },
    { type: "input", q: "Forme le pluscuamperfecto de VER (yo) : había ___.", a: ["visto"], ph: "participe", exp: "Había visto = j'avais vu (participe irrégulier)." },
    { type: "qcm", q: "Choisis la phrase correcte (action antérieure à une autre) :", opts: ["Cuando llegué, ya cenaron", "Cuando llegué, ya habían cenado", "Cuando llego, cenaban", "Cuando llegué, cenan"], a: 1, exp: "Ya habían cenado = ils avaient déjà dîné (antériorité)." },
    { type: "vf", q: "Dans un récit, l'imperfecto et l'indefinido peuvent s'alterner.", a: true, exp: "Vrai : décor (imperfecto) + action (indefinido)." },
    { type: "input", q: "Complète : « Al ___, nos dormimos. » (À la fin)", a: ["final"], ph: "mot", exp: "Al final = à la fin." },
    { type: "qcm", q: "Compréhension : « Estaba muy nervioso porque nunca había hablado en público. » Pourquoi ce sentiment ?", opts: ["il avait l'habitude", "il n'avait jamais parlé en public avant", "il aimait ça", "il dormait"], a: 1, exp: "Nunca había hablado en público = jamais avant (pluscuamperfecto)." },
    { type: "qcm", q: "Compréhension : « Cuando salimos, ya había dejado de llover. » Quel ordre ?", opts: ["il pleut encore", "la pluie s'était arrêtée avant la sortie", "il commence à pleuvoir", "on ne sait pas"], a: 1, exp: "Había dejado de llover = antérieur à salimos." },
    { type: "input", q: "Traduis « à ce moment-là » : en ese ___.", a: ["momento"], ph: "mot", exp: "En ese momento = à ce moment-là." }
  ],
  final: {
    title: "Exercice final — Un viaje inolvidable",
    intro: `<p>Lis ce récit détaillé :</p>
<pre class="pseudo">El verano pasado hice un viaje que nunca olvidaré.
Al principio, todo salió mal: había perdido el tren
y tuve que esperar tres horas en la estación.
Mientras esperaba, empecé a hablar con una chica muy simpática.
Ella también viajaba a Granada, así que decidimos ir juntos.
Cuando por fin llegamos, ya se había puesto el sol.
La ciudad estaba preciosa, llena de luces.
Visitamos la Alhambra al día siguiente y fue increíble.
Nunca había visto un lugar tan bonito.
Al final, aquel viaje que empezó tan mal se convirtió
en uno de los mejores recuerdos de mi vida.</pre>`,
    questions: [
      { type: "qcm", q: "Pourquoi le début du voyage se passe-t-il mal ?", opts: ["il pleuvait", "la personne avait perdu le train", "elle était malade", "elle avait perdu son argent"], a: 1, exp: "Había perdido el tren y tuve que esperar tres horas." },
      { type: "input", q: "Avec qui la personne commence-t-elle à parler ? Complète : « una ___ muy simpática ».", a: ["chica"], ph: "mot", exp: "Empecé a hablar con una chica muy simpática." },
      { type: "qcm", q: "Quand arrivent-ils à Granada ?", opts: ["à midi", "le soleil s'était déjà couché", "au lever du soleil", "à minuit pile"], a: 1, exp: "Ya se había puesto el sol = le soleil s'était déjà couché." },
      { type: "vf", q: "La personne avait déjà vu un endroit aussi beau auparavant.", a: false, exp: "Faux : Nunca había visto un lugar tan bonito." },
      { type: "qcm", q: "Comment se termine ce voyage ?", opts: ["c'est une catastrophe", "il devient un des meilleurs souvenirs", "la personne rentre furieuse", "elle rate son retour"], a: 1, exp: "Se convirtió en uno de los mejores recuerdos de mi vida." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">L'été dernier j'ai fait un voyage que je n'oublierai jamais.
Au début, tout est mal parti : j'avais raté le train
et j'ai dû attendre trois heures à la gare.
Pendant que j'attendais, j'ai commencé à parler avec une fille très sympathique.
Elle voyageait aussi à Grenade, alors nous avons décidé d'y aller ensemble.
Quand nous sommes enfin arrivés, le soleil s'était déjà couché.
La ville était magnifique, pleine de lumières.
Nous avons visité l'Alhambra le lendemain et ce fut incroyable.
Je n'avais jamais vu un endroit aussi beau.
Finalement, ce voyage qui avait si mal commencé est devenu
l'un des meilleurs souvenirs de ma vie.</pre>
<p>Remarque l'articulation des trois temps : décor (esperaba, estaba), actions (empecé, visitamos) et antériorité (había perdido, se había puesto, había visto).</p>`
  }
};
