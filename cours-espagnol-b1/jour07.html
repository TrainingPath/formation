<script>
var DAY = {
  num: 7,
  title: "Les propositions temporelles (cuando + subj.)",
  subtitle: "Quand parler du futur : cuando et ses cousins basculent au subjonctif.",
  theory: `
<h3>1. Le grand principe : futur = subjonctif</h3>
<p>Voici une des règles les plus utiles et les plus surprenantes de l'espagnol. Après <strong>cuando</strong> (quand) et les autres conjonctions de temps, si l'action renvoie au <strong>futur</strong> (une action pas encore réalisée), on emploie le <strong>subjonctif</strong>, jamais le futur de l'indicatif.</p>
<pre class="pseudo">FUTUR / action non encore réalisée -> subjonctif
Cuando llegues, llámame.
= Quand tu arriveras, appelle-moi.

Cuando tenga dinero, viajaré.
= Quand j'aurai de l'argent, je voyagerai.</pre>
<div class="warn">Erreur du francophone : dire « cuando llegarás » (calque du français « quand tu arriveras »). En espagnol, c'est impossible : après cuando à valeur future, on met le subjonctif -> cuando llegues.</div>
<h3>2. Le contraste habitude / futur</h3>
<p>La même conjonction cuando peut être suivie de l'indicatif OU du subjonctif. Tout dépend du sens :</p>
<pre class="pseudo">HABITUDE ou fait général (présent) -> INDICATIF
Cuando llego a casa, me quito los zapatos.
= Quand j'arrive chez moi, j'enlève mes chaussures. (chaque jour)

FUTUR / action ponctuelle à venir -> SUBJONCTIF
Cuando llegue a casa, te llamaré.
= Quand j'arriverai chez moi, je t'appellerai. (une fois précise)</pre>
<div class="tip">Test simple : si tu peux remplacer par « à chaque fois que » (habitude), c'est l'indicatif. Si c'est un moment futur unique et pas encore arrivé, c'est le subjonctif.</div>
<h3>3. Les autres conjonctions temporelles</h3>
<p>La même règle s'applique à toute une famille de connecteurs de temps :</p>
<pre class="pseudo">cuando          = quand         Cuando puedas, ven.
en cuanto       = dès que       En cuanto termine, salgo.
tan pronto como = aussitôt que  Te aviso tan pronto como llegue.
hasta que       = jusqu'à ce que Espera hasta que vuelva.
antes de que    = avant que     Sal antes de que empiece a llover.
después de que  = après que     Hablamos después de que comas.
mientras        = tant que      Mientras estudies, tendrás mi apoyo.</pre>
<h3>4. Un cas particulier : antes de que</h3>
<p><strong>Antes de que</strong> exige TOUJOURS le subjonctif, même sans idée de futur, car l'action qui suit est par nature « pas encore réalisée » au moment considéré.</p>
<pre class="pseudo">Cierra la ventana antes de que entre el frío.
= Ferme la fenêtre avant que le froid n'entre.
Llegó antes de que empezara la película.
= Il est arrivé avant que le film commence. (subj. imparfait au passé)</pre>
<h3>5. Même sujet : antes de + infinitif</h3>
<p>Si le sujet est le même dans les deux parties, antes de et después de sont suivis de l'<strong>infinitif</strong> (comme au jour 2 pour la volonté).</p>
<pre class="pseudo">Deux sujets : Cómete todo antes de que lleguen los invitados.
Un sujet :    Lávate las manos antes de comer. (toi -> toi)
              Después de terminar, descansaré. (moi -> moi)</pre>`,
  exercises: [
    { type: "qcm", q: "Après cuando avec une valeur de FUTUR, on emploie :", opts: ["le futur de l'indicatif", "le subjonctif", "l'infinitif", "l'imparfait"], a: 1, exp: "Cuando + futur -> subjonctif : cuando llegues (jamais cuando llegarás)." },
    { type: "input", q: "Complète : Cuando ___ (tener, yo) tiempo, te ayudaré.", a: ["tenga"], ph: "verbe", exp: "Action future -> subjonctif : cuando tenga tiempo." },
    { type: "qcm", q: "« Cuando llego a casa, me relajo » (chaque jour) : pourquoi l'indicatif ?", opts: ["c'est le futur", "c'est une habitude / fait général", "c'est un ordre", "c'est une erreur"], a: 1, exp: "Habitude au présent -> indicatif (llego)." },
    { type: "input", q: "Complète : En cuanto ___ (terminar, yo) el trabajo, salgo.", a: ["termine"], ph: "verbe", exp: "En cuanto + futur -> subjonctif : termine." },
    { type: "qcm", q: "« Antes de que » est suivi de :", opts: ["toujours l'indicatif", "toujours le subjonctif", "toujours le futur", "toujours l'infinitif"], a: 1, exp: "Antes de que exige toujours le subjonctif." },
    { type: "input", q: "Complète : Espera aquí hasta que yo ___ (volver).", a: ["vuelva"], ph: "verbe", exp: "Hasta que + futur -> subjonctif : volver -> vuelva." },
    { type: "vf", q: "« Cuando seas mayor, lo entenderás » emploie correctement le subjonctif.", a: true, exp: "Action future -> subjonctif : cuando seas mayor (quand tu seras grand)." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Cuando llegarás, avísame", "Cuando llegues, avísame", "Cuando llegar, avísame", "Cuando llegabas, avísame"], a: 1, exp: "Futur après cuando -> subjonctif : cuando llegues." },
    { type: "input", q: "Complète : Cierra la puerta antes de que ___ (entrar) el perro.", a: ["entre"], ph: "verbe", exp: "Antes de que + subjonctif : entrar -> entre." },
    { type: "qcm", q: "« Lávate las manos antes de comer » : pourquoi l'infinitif ?", opts: ["deux sujets différents", "un seul sujet (toi/toi) -> antes de + infinitif", "c'est un ordre négatif", "erreur"], a: 1, exp: "Même sujet -> antes de + infinitif (pas de que)." },
    { type: "input", q: "Complète : Tan pronto como ___ (poder, tú), llámame.", a: ["puedas"], ph: "verbe", exp: "Tan pronto como + futur -> subjonctif : poder -> puedas." },
    { type: "vf", q: "« Mientras estudies, te ayudaré » exprime une condition future avec subjonctif.", a: true, exp: "Mientras + subjonctif (estudies) = tant que tu étudieras." },
    { type: "qcm", q: "Comprension : « Cuando termine la carrera, buscaré trabajo. » Quand cherchera-t-il du travail ?", opts: ["maintenant", "après avoir fini ses études (futur)", "il ne cherchera jamais", "hier"], a: 1, exp: "Cuando termine (futur, subjonctif) : une fois ses études finies." },
    { type: "input", q: "Complète : Hablaremos después de que ___ (comer, vosotros).", a: ["comáis", "comais"], ph: "verbe", exp: "Después de que + futur -> subjonctif : comer -> comáis." },
    { type: "qcm", q: "Comprension : « Llámame en cuanto llegues al aeropuerto. » Que demande-t-on ?", opts: ["d'appeler maintenant", "d'appeler dès l'arrivée à l'aéroport", "de ne pas appeler", "d'appeler depuis l'avion"], a: 1, exp: "En cuanto llegues = dès que tu arriveras (subjonctif, action future)." }
  ],
  final: {
    title: "Exercice final — Planes para el fin de semana",
    intro: `<p>Ana explica sus planes para el sábado :</p>
<pre class="pseudo">Cuando me despierte, iré a correr al parque.
En cuanto vuelva a casa, prepararé el desayuno.
No saldré hasta que termine de limpiar el piso.
Antes de que lleguen mis amigos, compraré algo de comer.
Cuando estemos todos, veremos una película.
Y tan pronto como acabe, os aviso para el próximo plan.</pre>`,
    questions: [
      { type: "qcm", q: "« Cuando me despierte, iré a correr » : pourquoi despierte (subjonctif) ?", opts: ["c'est une habitude", "c'est une action future non encore réalisée", "c'est un ordre", "c'est le passé"], a: 1, exp: "Cuando + futur -> subjonctif (me despierte), suivi du futur iré." },
      { type: "input", q: "Relève le subjonctif : No saldré hasta que ___ de limpiar.", a: ["termine"], ph: "verbe", exp: "Hasta que + futur -> subjonctif : termine." },
      { type: "qcm", q: "« Antes de que lleguen mis amigos » emploie le subjonctif parce que :", opts: ["antes de que exige toujours le subjonctif", "c'est une habitude", "c'est un infinitif", "c'est du présent réel"], a: 0, exp: "Antes de que est toujours suivi du subjonctif (lleguen)." },
      { type: "vf", q: "« Tan pronto como acabe » situe l'action dans le futur.", a: true, exp: "Tan pronto como + subjonctif (acabe) = aussitôt que ce sera fini." },
      { type: "input", q: "Complète : Cuando ___ (estar, nosotros) todos, veremos una película.", a: ["estemos"], ph: "verbe", exp: "Cuando + futur -> subjonctif : estar -> estemos." }
    ],
    solution: `<p>Traduction :</p>
<pre class="pseudo">Quand je me réveillerai, j'irai courir au parc.
Dès que je rentrerai à la maison, je préparerai le petit-déjeuner.
Je ne sortirai pas tant que je n'aurai pas fini de nettoyer l'appartement.
Avant que mes amis n'arrivent, j'achèterai quelque chose à manger.
Quand nous serons tous là, on regardera un film.
Et dès que ce sera fini, je vous préviens pour le prochain plan.</pre>
<p>Toutes les actions renvoient à un <strong>futur</strong> pas encore réalisé : d'où le subjonctif après cuando, en cuanto, hasta que, antes de que, tan pronto como. La principale, elle, reste au futur de l'indicatif (iré, prepararé, veremos).</p>`
  }
};
</script>

    hints: [

    solution: "Cuando termine mis exámenes, me tomaré unas vacaciones. En cuanto tenga las notas, reservaré un vuelo a Andalucía. No pararé de estudiar hasta que acabe el último examen. Antes de que empiece el verano, quiero organizarlo todo. Cuando esté en la playa, olvidaré el estrés del curso. Y tan pronto como vuelva, empezaré a buscar prácticas.\n\nTraduction : Quand je terminerai mes examens, je prendrai des vacances. Dès que j'aurai les notes, je réserverai un vol pour l'Andalousie. Je n'arrêterai pas d'étudier tant que je n'aurai pas fini le dernier examen. Avant que l'été ne commence, je veux tout organiser. Quand je serai à la plage, j'oublierai le stress de l'année. Et dès que je reviendrai, je commencerai à chercher un stage.",
    note: "Le réflexe à ancrer : chaque fois qu'une conjonction de temps regarde vers le futur, le verbe qui suit passe au subjonctif, même si le français emploierait le futur. Cuando termine, jamais cuando terminaré." }
  ]
};
