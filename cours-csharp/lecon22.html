  title: "Delegates, events et lambdas",
  subtitle: "Traiter une fonction comme une donnée : la variable qui contient du code.",
  theory: `
<h3>1. L'idée folle : une fonction rangée dans une variable</h3>
<p>Jusqu'ici une variable contenait un nombre, un texte, un objet. Un <strong>delegate</strong> (délégué) est une variable qui contient… du <em>code</em> : une référence vers une méthode. C'est comme le numéro de téléphone d'un artisan : tu ne fais pas le travail toi-même, tu ranges le contact et tu l'appelles quand il faut. Le delegate définit la « forme » de méthode acceptée (ses paramètres et son type de retour), comme une offre d'emploi qui précise le profil recherché.</p>
<pre class="pseudo">delegate int Operation(int a, int b);   // définit un TYPE : « méthode qui prend 2 int et rend un int »
static int Additionner(int a, int b) { return a + b; } // une méthode compatible
Operation op = Additionner;             // on range la MÉTHODE dans la variable op (sans parenthèses !)
int r = op(3, 4);                       // on appelle la méthode via la variable → 7</pre>
<div class="tip">Sans parenthèses, <code>Additionner</code> désigne la méthode elle-même (le contact). Avec parenthèses, <code>Additionner(3,4)</code> l'exécute (l'appel). Un delegate stocke le contact.</div>

<h3>2. Les lambdas : des mini-méthodes jetables</h3>
<p>Une <strong>lambda</strong> (fonction anonyme) est une méthode sans nom, écrite sur place. Le <code>=&gt;</code> se lit « donne ».</p>
<pre class="pseudo">Operation somme = (a, b) =&gt; a + b;        // lambda : prend (a, b), renvoie a + b
Operation produit = (a, b) =&gt; a * b;      // une autre, à la volée
Console.WriteLine(somme(2, 5));           // 7
Console.WriteLine(produit(2, 5));         // 10</pre>
<p>Une lambda est parfaite quand le code est court et utilisé une seule fois : inutile de créer une méthode nommée pour ça.</p>

<h3>3. Func et Action : les delegates tout prêts</h3>
<p>Plutôt que déclarer ton propre delegate, C# en fournit deux familles :</p>
<pre class="pseudo">Func&lt;int, int, int&gt; add = (a, b) =&gt; a + b;  // Func : renvoie une valeur ; le DERNIER type est le retour
// Func&lt;int, int, int&gt; = prend int, int → rend int
Func&lt;string, int&gt; longueur = s =&gt; s.Length; // prend string → rend int
Action&lt;string&gt; afficher = msg =&gt; Console.WriteLine(msg); // Action : NE renvoie RIEN (void)
afficher("Bonjour");                       // exécute la lambda</pre>
<div class="tip">Retiens : <strong>Func</strong> renvoie quelque chose (le dernier paramètre générique est le type de retour), <strong>Action</strong> ne renvoie rien (void). Ce sont ces types que LINQ utilise en coulisses pour <code>Where</code> et <code>Select</code>.</div>

<h3>4. Passer du comportement en paramètre</h3>
<p>Un delegate permet de passer un COMPORTEMENT à une méthode, pas seulement des données. Thème gestionnaire de tâches :</p>
<pre class="pseudo">static List&lt;Tache&gt; Filtrer(List&lt;Tache&gt; source, Func&lt;Tache, bool&gt; critere) // le critère est fourni par l'appelant
{                                                    // début
    var res = new List&lt;Tache&gt;();                     // liste résultat
    foreach (var t in source)                        // pour chaque tâche
        if (critere(t)) res.Add(t);                  // on applique le critère reçu
    return res;                                      // on rend les retenues
}
// Appels : on change le comportement sans toucher à Filtrer
var urgentes = Filtrer(taches, t =&gt; t.Urgente);      // critère 1
var longues  = Filtrer(taches, t =&gt; t.Duree &gt; 60);  // critère 2</pre>

<h3>5. Les events : prévenir quand quelque chose arrive</h3>
<p>Un <strong>event</strong> (événement) est un delegate spécial servant à NOTIFIER : un objet « émet » un signal, et d'autres, abonnés, réagissent. C'est le principe de la sonnette : la porte ne sait pas qui écoute, elle sonne ; les abonnés (toi dans la cuisine) réagissent.</p>
<pre class="pseudo">class Minuteur                                  // un objet qui émet un signal
{                                               // début
    public event Action Termine;                // l'événement : des Action pourront s'y abonner
    public void Lancer()                        // simule la fin
    {                                           // début
        Termine?.Invoke();                      // ?.Invoke : prévenir les abonnés SI il y en a
    }                                           // ?. évite l'erreur si personne n'est abonné
}
Minuteur m = new Minuteur();                    // création
m.Termine += () =&gt; Console.WriteLine("Fini !"); // += : je m'ABONNE (j'ajoute ma réaction)
m.Lancer();                                     // déclenche → affiche « Fini ! »</pre>
<div class="warn">On s'abonne avec <code>+=</code> et on se désabonne avec <code>-=</code>. Le <code>?.Invoke()</code> n'appelle que s'il y a au moins un abonné : sans le <code>?.</code>, déclencher un event sans abonné provoquerait une NullReferenceException.</div>

<h3>6. À quoi ça sert vraiment</h3>
<p>Delegates et events sont le cœur des interfaces graphiques (« quand on clique, fais ceci »), de LINQ, et du découplage : un objet signale, sans savoir qui écoute. C'est ce qui rend le code modulaire et extensible.</p>`,

    { type: "qcm", q: "Un event sert à…", opts: ["Répéter une action en boucle", "NOTIFIER : un objet émet un signal, des abonnés réagissent", "Trier une collection d'objets", "Stocker une valeur numérique"], a: 1, exp: "Le principe de la sonnette." },
    { type: "qcm", q: "Comment s'abonner à un event <code>Termine</code> ?", opts: ["m.Termine = ...", "m.Termine += maReaction; (avec +=)", "m.Termine()", "m.subscribe()"], a: 1, exp: "+= ajoute un abonné ; -= le retire." },
    { type: "qcm", q: "À quoi sert <code>Termine?.Invoke();</code> ?", opts: ["À trier les abonnés", "À prévenir les abonnés SEULEMENT s'il y en a (le ?. évite le null)", "À créer un event", "À se désabonner"], a: 1, exp: "Sans abonné, Termine est null : ?. protège." },
    { type: "vf", q: "Déclencher un event sans aucun abonné, sans le <code>?.</code>, peut provoquer une NullReferenceException.", a: true, exp: "Le ?.Invoke() est là précisément pour ça." },
    { type: "qcm", q: "LINQ (Where, Select) utilise en coulisses…", opts: ["Des accès à des fichiers", "Des delegates Func/Action (les lambdas qu'on lui passe)", "Des blocs de gestion d'exceptions", "Un générateur de nombres aléatoires"], a: 1, exp: "Where prend un Func<T,bool>, Select un Func<T,R>." },

  ],

    intro: `<p>On modélise un bouton d'interface. Quand on le « clique », il déclenche un event auquel plusieurs réactions se sont abonnées.</p>
<pre class="pseudo">class Bouton                                  // l'émetteur
{                                             // début
    public event Action Clique;               // (1) l'événement, des Action pourront s'abonner
    public void Cliquer() { Clique?.Invoke(); } // (2) déclenche, prévient les abonnés s'il y en a
}
Bouton b = new Bouton();                       // création
b.Clique += () =&gt; Console.WriteLine("Enregistré"); // (3) abonné n°1
b.Clique += () =&gt; Console.WriteLine("Notifié");    // (4) abonné n°2
b.Cliquer();                                   // (5) on clique</pre>`,
    questions: [
      { type: "qcm", q: "(1) <code>public event Action Clique;</code> déclare…", opts: ["Une méthode publique classique", "Un ÉVÉNEMENT auquel des Action (sans paramètre, sans retour) peuvent s'abonner", "Une variable de type entier", "Une classe interne nommée Clique"], a: 1, exp: "Un event de type Action." },
      { type: "qcm", q: "(2) Rôle du <code>?.</code> dans <code>Clique?.Invoke()</code> ?", opts: ["Trier les abonnés", "N'appeler QUE s'il existe au moins un abonné (évite le null)", "Se désabonner de l'event", "Créer l'event"], a: 1, exp: "Protection contre l'absence d'abonné." },

      { type: "vf", q: "Si aucun abonné n'existait, <code>Clique?.Invoke()</code> n'afficherait rien et ne planterait pas.", a: true, exp: "Le ?. rend l'appel sûr même sans abonné." }
    ],
    solution: `<pre class="pseudo">event Action Clique        // l'émetteur déclare un canal de notification
Clique?.Invoke()           // sonne, uniquement s'il y a des abonnés
b.Clique += reaction1      // abonnement n°1
b.Clique += reaction2      // abonnement n°2
b.Cliquer() → "Enregistré" // 1er abonné

<p>Le bouton ignore totalement qui l'écoute : c'est le découplage. Delegates et lambdas sont partout — LINQ, interfaces graphiques, callbacks. Prochaine leçon : la sécurité anti-null.</p>`

      "solution": "// La station de tri du recyparc : des tarifs rangés dans des variables, des bennes qui préviennent.\nusing System;\nusing System.Collections.Generic;\n\ndelegate int Tarif(int poidsKg);       // un TYPE : « méthode qui prend un poids et rend des centimes »\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        // Une méthode rangée dans une variable : sans parenthèses, c'est le contact.\n        Tarif applique = TarifAuPoids;\n        Console.WriteLine(\"TROIS TARIFS POUR UN MÊME DÉPÔT DE 40 kg\");\n        Console.WriteLine($\"Au poids : {applique(40)} centimes\");\n\n        applique = TarifGratuit;                    // on change de contact, pas de code appelant\n        Console.WriteLine($\"Gratuit : {applique(40)} centimes\");\n\n        applique = TarifForfaitaire;\n        Console.WriteLine($\"Forfaitaire : {applique(40)} centimes\");\n\n        Console.WriteLine();\n\n        // Les mêmes tarifs écrits à la volée, sans méthode nommée.\n        Tarif majore = kg => kg * 15 + 200;         // lambda : « kg donne kg × 15 + 200 »\n        Tarif plafonne = kg => Math.Min(kg * 15, 1500);\n        Console.WriteLine(\"DEUX TARIFS ÉCRITS SUR PLACE, POUR 120 kg\");\n        Console.WriteLine($\"Majoré : {majore(120)} centimes\");\n        Console.WriteLine($\"Plafonné : {plafonne(120)} centimes\");\n\n        Console.WriteLine();\n\n        // Les deux familles toutes prêtes : l'une rend une valeur, l'autre non.\n        Func<int, int, int> cumul = (a, b) => a + b;\n        Func<string, int> longueur = nom => nom.Length;\n        Action<string> annoncer = message => Console.WriteLine($\"  [haut-parleur] {message}\");\n\n        Console.WriteLine(\"FUNC ET ACTION\");\n        Console.WriteLine($\"Cumul de deux pesées : {cumul(240, 90)} kg\");\n        Console.WriteLine($\"Longueur du mot « encombrants » : {longueur(\"encombrants\")}\");\n        annoncer(\"le recyparc ferme dans dix minutes\");\n\n        Console.WriteLine();\n\n        List<Benne> parc = new List<Benne>();\n        parc.Add(new Benne(\"Bois\", 800));\n        parc.Add(new Benne(\"Métal\", 500));\n        parc.Add(new Benne(\"Cartons\", 600));\n        parc.Add(new Benne(\"Déchets verts\", 1000));\n        parc.Add(new Benne(\"Encombrants\", 1200));\n\n        // On s'abonne AVANT de remplir : la benne préviendra quand elle sera pleine.\n        Action<Benne> alerte = b => Console.WriteLine($\"  ALERTE : {b.Nom} est pleine \"\n                                                    + $\"({b.PoidsKg} kg pour {b.CapaciteKg})\");\n        Action<Benne> journal = b => Console.WriteLine($\"  journal : {b.Nom} → appeler le camion\");\n\n        parc[2].Pleine += alerte;          // += : je m'abonne\n        parc[2].Pleine += journal;         // deux abonnés sur la même benne\n        parc[4].Pleine += alerte;\n        parc[4].Pleine += journal;\n\n        Console.WriteLine(\"LA JOURNÉE DE DÉPÔTS\");\n        parc[0].Deposer(120);\n        parc[0].Deposer(240);\n        parc[0].Deposer(90);\n        parc[1].Deposer(60);\n        parc[1].Deposer(30);\n        parc[2].Deposer(200);\n        parc[2].Deposer(180);\n        Console.WriteLine(\"Troisième dépôt dans les cartons :\");\n        parc[2].Deposer(260);              // franchit la capacité : les DEUX abonnés réagissent\n        parc[3].Deposer(300);\n        parc[3].Deposer(250);\n        parc[4].Deposer(400);\n        parc[4].Deposer(500);\n\n        parc[4].Pleine -= journal;         // -= : le journal se désabonne des encombrants\n        Console.WriteLine(\"Troisième dépôt dans les encombrants, après désabonnement :\");\n        parc[4].Deposer(350);              // un seul abonné réagit\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"ÉTAT DU PARC\");\n        int totalKg = 0;\n        foreach (Benne b in parc)\n        {\n            totalKg += b.PoidsKg;\n            Console.WriteLine($\"  {b}\");\n        }\n        Console.WriteLine($\"Déposé aujourd'hui : {totalKg} kg\");\n\n        Console.WriteLine();\n\n        // Passer un COMPORTEMENT en paramètre : une seule méthode, autant de critères qu'on veut.\n        Console.WriteLine(\"TROIS QUESTIONS, UNE SEULE MÉTHODE DE FILTRAGE\");\n        Afficher(\"Remplies à plus de la moitié\",\n                 Filtrer(parc, b => b.PoidsKg * 2 > b.CapaciteKg));\n        Afficher(\"Grande capacité (800 kg et plus)\",\n                 Filtrer(parc, b => b.CapaciteKg >= 800));\n        Afficher(\"Pleines ou débordantes\",\n                 Filtrer(parc, b => b.PoidsKg >= b.CapaciteKg));\n\n        Console.WriteLine();\n\n        // Un tarif choisi à l'exécution, appliqué à tout le parc.\n        Console.WriteLine(\"FACTURATION DU PARC\");\n        Console.WriteLine($\"Au tarif au poids : {Facturer(parc, TarifAuPoids) / 100.0:F2} €\");\n        Console.WriteLine($\"Au tarif forfaitaire : {Facturer(parc, TarifForfaitaire) / 100.0:F2} €\");\n        Console.WriteLine($\"Au tarif gratuit : {Facturer(parc, TarifGratuit) / 100.0:F2} €\");\n        Console.WriteLine($\"À un tarif inventé sur place : \"\n                        + $\"{Facturer(parc, kg => kg / 10) / 100.0:F2} €\");\n    }\n\n    static int TarifGratuit(int poidsKg)\n    {\n        return 0;\n    }\n\n    static int TarifAuPoids(int poidsKg)\n    {\n        return poidsKg * 15;\n    }\n\n    static int TarifForfaitaire(int poidsKg)\n    {\n        return 500 + poidsKg * 8;\n    }\n\n    // Le critère est fourni par l'appelant : cette méthode ne le connaît pas.\n    static List<Benne> Filtrer(List<Benne> source, Func<Benne, bool> critere)\n    {\n        List<Benne> retenues = new List<Benne>();\n        foreach (Benne b in source)\n        {\n            if (critere(b))\n            {\n                retenues.Add(b);\n            }\n        }\n        return retenues;\n    }\n\n    static int Facturer(List<Benne> source, Tarif tarif)\n    {\n        int total = 0;\n        foreach (Benne b in source)\n        {\n            total += tarif(b.PoidsKg);\n        }\n        return total;\n    }\n\n    static void Afficher(string titre, List<Benne> bennes)\n    {\n        Console.WriteLine($\"{titre} : {bennes.Count}\");\n        foreach (Benne b in bennes)\n        {\n            Console.WriteLine($\"  {b.Nom}\");\n        }\n    }\n}\n\nclass Benne\n{\n    public string Nom { get; private set; }\n    public int CapaciteKg { get; private set; }\n    public int PoidsKg { get; private set; }\n\n    public event Action<Benne> Pleine;      // l'événement : des Action pourront s'y abonner\n\n    public Benne(string nom, int capaciteKg)\n    {\n        if (capaciteKg <= 0)\n        {\n            throw new ArgumentException($\"{nom} : capacité de {capaciteKg} kg impossible\");\n        }\n        this.Nom = nom;\n        this.CapaciteKg = capaciteKg;\n        this.PoidsKg = 0;\n    }\n\n    public void Deposer(int kg)\n    {\n        if (kg <= 0)\n        {\n            throw new ArgumentException($\"{Nom} : dépôt de {kg} kg impossible\");\n        }\n        bool etaitPleine = PoidsKg >= CapaciteKg;\n        PoidsKg += kg;\n        if (!etaitPleine && PoidsKg >= CapaciteKg)     // seulement au FRANCHISSEMENT\n        {\n            Pleine?.Invoke(this);                      // prévient s'il y a au moins un abonné\n        }\n    }\n\n    public override string ToString()\n    {\n        return $\"{Nom} : {PoidsKg} kg sur {CapaciteKg} ({PoidsKg * 100 / CapaciteKg} %)\";\n    }\n}",
      "pourquoi": "La méthode de filtrage est écrite une fois et répond à trois questions qu'elle ne connaît pas ; la méthode de facturation applique quatre tarifs, dont un qui n'existait pas quand elle a été écrite. C'est le renversement de la journée : jusqu'ici on passait des données à des méthodes, maintenant on leur passe aussi ce qu'elles doivent faire.",

    {
      "num": "22.2",

      "enonce": "Un restaurant surveille trois enceintes réfrigérées. Écris d'abord le fichier des relevés, une ligne par sonde au format code;local;seuil bas;seuil haut;mesures séparées par des virgules : « CF-1;viande;-2;2;0,1,-1,3,2,4,0 », « CF-2;légumes;2;8;5,6,9,7,1,8 » et « CF-3;surgelés;-22;-16;-18,-20,-15,-19,-23 ». Écris une classe de sonde portant son code, son local, ses deux seuils, un compteur d'alertes interne et l'historique de ses mesures, refusant une plage incohérente, et munie d'un <strong>événement</strong> transmettant la sonde et la température chaque fois qu'une mesure sort de la plage. Relis le fichier, reconstruis les sondes et leurs séries. Abonne ensuite deux réactions de nature différente : la <strong>méthode d'un objet compteur</strong> que tu écriras, et une <strong>lambda qui écrit dans une liste déclarée à l'extérieur</strong>. Rejoue toutes les mesures et affiche le nombre d'alertes comptées, le nombre de lignes au journal, puis le journal. Donne pour chaque sonde son nombre de mesures, sa moyenne à deux décimales, son minimum, son maximum et son nombre d'alertes. Désabonne ensuite <strong>le journal seulement</strong> de la troisième sonde, mesure −30 °C, et compare les deux compteurs. Crée une sonde CF-9 (réserve, 0 à 5) <strong>sans aucun abonné</strong>, mesure 40 °C, et montre que rien ne casse. Termine par deux méthodes paramétrées : l'une compte les sondes vérifiant un critère reçu — trois questions —, l'autre totalise une mesure reçue — trois totaux.",

      "reflexion": "La sonde ne sait pas qui l'écoute, et c'est présenté comme une qualité. Écris deux conséquences concrètes de cette ignorance : une bonne, une mauvaise. Puis dis comment tu ferais, dans ce programme précis, pour savoir combien d'abonnés une sonde a réellement — et pourquoi ce n'est pas si simple.",
      "principe": "Un événement inverse la dépendance : l'émetteur ne connaît pas ses abonnés, ce sont eux qui viennent à lui. Ajouter une réaction n'oblige donc jamais à modifier ce qui la déclenche.",

      "indices": [
        "Repère les deux formes d'abonné que l'énoncé impose, et pourquoi il en impose deux. La méthode d'un objet est un contact durable, qui a son propre état et survivra à tout le programme ; la lambda est jetable, écrite sur place, et n'existe que pour ce qu'elle fait. Les deux se rangent dans le même événement, et c'est justement ce qui montre qu'un événement ne demande qu'une forme, pas une origine.",
        "Le plan : l'écriture du fichier ; la classe de sonde avec son compteur interne et son événement ; la classe compteur ; la relecture des sondes et des séries ; les deux abonnements ; le rejeu des mesures ; les statistiques par sonde ; le désabonnement et la mesure supplémentaire ; la sonde sans abonné ; les deux méthodes paramétrées.",
        "Découpe la relecture en deux temps distincts : les quatre premiers champs décrivent la sonde, le cinquième contient toute une série qu'il faut redécouper sur les virgules. Range les séries dans une collection parallèle aux sondes, avec le même indice — c'est le seul endroit du programme où deux collections doivent rester alignées, et cela mérite ton attention.",

      "solution": "// L'alarme de la chambre froide : la sonde signale, elle ne sait pas qui écoute.\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Linq;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        const string RELEVES = \"sondes.csv\";\n        const string JOURNAL = \"alarmes.txt\";\n\n        string[] brut =\n        {\n            \"CF-1;viande;-2;2;0,1,-1,3,2,4,0\",\n            \"CF-2;légumes;2;8;5,6,9,7,1,8\",\n            \"CF-3;surgelés;-22;-16;-18,-20,-15,-19,-23\"\n        };\n        File.WriteAllLines(RELEVES, brut);\n\n        if (!File.Exists(RELEVES))\n        {\n            Console.WriteLine(\"Aucun relevé à dépouiller\");\n            return;\n        }\n\n        List<Sonde> sondes = new List<Sonde>();\n        List<int[]> mesures = new List<int[]>();\n        foreach (string ligne in File.ReadAllLines(RELEVES))\n        {\n            if (ligne == \"\")\n            {\n                continue;\n            }\n            string[] champs = ligne.Split(';');\n            sondes.Add(new Sonde(champs[0], champs[1], int.Parse(champs[2]),\n                                 int.Parse(champs[3])));\n            string[] valeurs = champs[4].Split(',');\n            int[] serie = new int[valeurs.Length];\n            for (int i = 0; i < valeurs.Length; i++)\n            {\n                serie[i] = int.Parse(valeurs[i]);\n            }\n            mesures.Add(serie);\n        }\n        Console.WriteLine($\"Sondes en service : {sondes.Count}\");\n\n        Console.WriteLine();\n\n        // Deux abonnés de nature différente : une méthode d'objet, et une lambda.\n        Compteur compteur = new Compteur();\n        List<string> lignesJournal = new List<string>();\n        Action<Sonde, int> ecrireAuJournal = (s, t) =>\n            lignesJournal.Add($\"{s.Code} ({s.Local}) : {t} °C hors plage {s.SeuilBas}/{s.SeuilHaut}\");\n\n        foreach (Sonde s in sondes)\n        {\n            s.Alerte += compteur.Noter;        // une MÉTHODE rangée dans l'événement\n            s.Alerte += ecrireAuJournal;       // une lambda qui écrit dans une liste extérieure\n        }\n\n        Console.WriteLine(\"LE RELEVÉ DE LA NUIT\");\n        for (int i = 0; i < sondes.Count; i++)\n        {\n            foreach (int t in mesures[i])\n            {\n                sondes[i].Mesurer(t);\n            }\n        }\n        Console.WriteLine($\"Alertes comptées : {compteur.Total}\");\n        Console.WriteLine($\"Lignes au journal : {lignesJournal.Count}\");\n        foreach (string l in lignesJournal)\n        {\n            Console.WriteLine($\"  {l}\");\n        }\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"MOYENNES PAR SONDE\");\n        foreach (Sonde s in sondes)\n        {\n            Console.WriteLine($\"{s.Code} ({s.Local}) : {s.Historique.Count} mesures, \"\n                            + $\"moyenne {s.Historique.Average():F2} °C, \"\n                            + $\"de {s.Historique.Min()} à {s.Historique.Max()} °C, \"\n                            + $\"{s.Alertes} alerte(s)\");\n        }\n\n        Console.WriteLine();\n\n        // Le désabonnement : la sonde continue de signaler, le journal cesse d'écouter.\n        sondes[2].Alerte -= ecrireAuJournal;\n        Console.WriteLine(\"UNE DERNIÈRE MESURE SUR CF-3, JOURNAL DÉSABONNÉ\");\n        sondes[2].Mesurer(-30);\n        Console.WriteLine($\"Alertes comptées : {compteur.Total}\");\n        Console.WriteLine($\"Lignes au journal : {lignesJournal.Count}\");\n\n        Console.WriteLine();\n\n        // Une sonde SANS le moindre abonné : signaler ne doit pas faire planter.\n        Sonde muette = new Sonde(\"CF-9\", \"réserve\", 0, 5);\n        muette.Mesurer(40);\n        Console.WriteLine($\"CF-9 n'a aucun abonné : {muette.Alertes} alerte(s) enregistrée(s) \"\n                        + \"en interne, et aucun plantage\");\n\n        Console.WriteLine();\n\n        // Un critère passé en paramètre : la méthode d'analyse ne le connaît pas.\n        Console.WriteLine(\"TROIS QUESTIONS, UNE SEULE MÉTHODE\");\n        Console.WriteLine($\"Sondes ayant alerté : \"\n                        + $\"{Compter(sondes, s => s.Alertes > 0)}\");\n        Console.WriteLine($\"Sondes de congélation (seuil haut négatif) : \"\n                        + $\"{Compter(sondes, s => s.SeuilHaut < 0)}\");\n        Console.WriteLine($\"Sondes à plage large (plus de 5 degrés) : \"\n                        + $\"{Compter(sondes, s => s.SeuilHaut - s.SeuilBas > 5)}\");\n\n        Console.WriteLine();\n\n        // Une mesure fournie par une fonction, elle aussi passée en paramètre.\n        Console.WriteLine($\"Total des mesures effectuées : \"\n                        + $\"{Totaliser(sondes, s => s.Historique.Count)}\");\n        Console.WriteLine($\"Total des alertes : {Totaliser(sondes, s => s.Alertes)}\");\n        Console.WriteLine($\"Somme des amplitudes de plage : \"\n                        + $\"{Totaliser(sondes, s => s.SeuilHaut - s.SeuilBas)} °C\");\n\n        Console.WriteLine();\n\n        File.WriteAllLines(JOURNAL, lignesJournal);\n        Console.WriteLine($\"{File.ReadAllLines(JOURNAL).Length} lignes dans {JOURNAL}\");\n    }\n\n    static int Compter(List<Sonde> source, Func<Sonde, bool> critere)\n    {\n        int n = 0;\n        foreach (Sonde s in source)\n        {\n            if (critere(s))\n            {\n                n++;\n            }\n        }\n        return n;\n    }\n\n    static int Totaliser(List<Sonde> source, Func<Sonde, int> mesure)\n    {\n        int total = 0;\n        foreach (Sonde s in source)\n        {\n            total += mesure(s);\n        }\n        return total;\n    }\n}\n\nclass Compteur\n{\n    public int Total { get; private set; }\n\n    // Une méthode ordinaire, dont la FORME correspond à celle attendue par l'événement.\n    public void Noter(Sonde sonde, int temperature)\n    {\n        Total++;\n    }\n}\n\nclass Sonde\n{\n    public string Code { get; private set; }\n    public string Local { get; private set; }\n    public int SeuilBas { get; private set; }\n    public int SeuilHaut { get; private set; }\n    public int Alertes { get; private set; }\n    public List<int> Historique { get; private set; }\n\n    public event Action<Sonde, int> Alerte;\n\n    public Sonde(string code, string local, int seuilBas, int seuilHaut)\n    {\n        if (seuilBas >= seuilHaut)\n        {\n            throw new ArgumentException($\"{code} : plage {seuilBas}/{seuilHaut} impossible\");\n        }\n        this.Code = code;\n        this.Local = local;\n        this.SeuilBas = seuilBas;\n        this.SeuilHaut = seuilHaut;\n        this.Alertes = 0;\n        this.Historique = new List<int>();\n    }\n\n    public void Mesurer(int temperature)\n    {\n        Historique.Add(temperature);\n        if (temperature < SeuilBas || temperature > SeuilHaut)\n        {\n            Alertes++;\n            Alerte?.Invoke(this, temperature);    // sans le ?., une sonde sans abonné planterait\n        }\n    }\n\n    public override string ToString()\n    {\n        return $\"{Code} ({Local}) — plage {SeuilBas} à {SeuilHaut} °C\";\n    }\n}",

          "texte": "Six alertes en tout, deux par sonde. CF-1 relève sept mesures pour une moyenne de 1,29 °C, entre −1 et 4, et sort deux fois par le haut. CF-2 relève six mesures, moyenne 6,00 °C, entre 1 et 9, et sort une fois par le haut et une fois par le bas. CF-3 relève cinq mesures, moyenne −19,00 °C, entre −23 et −15, et sort une fois de chaque côté. La répartition est trop régulière pour être naturelle : c'est un jeu d'exercice, pas un relevé réel."

          "ref": "d",
          "texte": "La lambda ne recopie pas la liste : elle en garde la référence, et cette référence continue d'exister aussi longtemps que la lambda elle-même. C'est pour cela qu'elle peut y écrire depuis l'intérieur d'une sonde, bien après sa propre écriture. Ce mécanisme est puissant et se retourne vite : une lambda abonnée à un événement empêche tout ce qu'elle capture d'être libéré, ce qui est la cause numéro un des fuites de mémoire dans les applications à événements."

      "solution": "// Le marché du samedi, jour 2 : les questions cessent d'être écrites dans le code.\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Linq;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        const string SOURCE = \"marche.csv\";\n        const int REDEVANCE_M2 = 250;\n\n        if (!File.Exists(SOURCE))\n        {\n            Console.WriteLine(\"Feuille de marché introuvable : premier lancement, on l'écrit\");\n            List<string> feuille = new List<string>();\n            feuille.Add(\"E-01;Verhoeven;maraîcher;12;48500\");\n            feuille.Add(\"E-02;Lambert;fromager;6;31200\");\n            feuille.Add(\"E-03;Ozturk;traiteur;9;52700\");\n            feuille.Add(\"E-04;Nkosi;textile;15;19800\");\n            feuille.Add(\"E-05;Dubois;maraîcher;10;41300\");\n            feuille.Add(\"E-06;Petrov;boulanger;6;28900\");\n            feuille.Add(\"E-07;Simon;fleuriste;4;15600\");\n            feuille.Add(\"E-08;Haddad;traiteur;12;61400\");\n            feuille.Add(\"E-09;Marchal;maraîcher;8;33500\");\n            feuille.Add(\"E-10;Weber;fromager;5;22100\");\n            feuille.Add(\"E-11;Lopes;textile;18;24300\");\n            feuille.Add(\"E-12;Bianchi;boulanger;7;35800\");\n            File.WriteAllLines(SOURCE, feuille);\n        }\n        else\n        {\n            Console.WriteLine(\"Feuille de marché trouvée : on repart du samedi précédent\");\n        }\n\n        List<Etal> marche = new List<Etal>();\n        foreach (string ligne in File.ReadAllLines(SOURCE))\n        {\n            if (ligne == \"\")\n            {\n                continue;\n            }\n            marche.Add(Etal.DepuisLigne(ligne));\n        }\n        Console.WriteLine($\"Étals installés : {marche.Count}\");\n\n        Console.WriteLine();\n\n        // Hier ces trois questions étaient écrites en dur. Aujourd'hui ce sont des DONNÉES.\n        Dictionary<string, Func<Etal, bool>> criteres = new Dictionary<string, Func<Etal, bool>>();\n        criteres[\"gros chiffre\"] = e => e.ChiffreCentimes > 40000;\n        criteres[\"petite surface\"] = e => e.SurfaceM2 <= 8;\n        criteres[\"alimentaire\"] = e => e.Categorie != \"textile\" && e.Categorie != \"fleuriste\";\n\n        Console.WriteLine(\"LES CRITÈRES DU SERVICE, RANGÉS DANS UNE STRUCTURE\");\n        foreach (var paire in criteres.OrderBy(p => p.Key))\n        {\n            List<Etal> retenus = Filtrer(marche, paire.Value);\n            Console.WriteLine($\"{paire.Key} : {retenus.Count} étal(s)\");\n            foreach (Etal e in retenus)\n            {\n                Console.WriteLine($\"  {e.Code} {e.Exposant}\");\n            }\n        }\n\n        Console.WriteLine();\n\n        // Un critère inventé sur place, sans toucher au dictionnaire ni à la méthode.\n        Console.WriteLine($\"Étals de plus de 10 m² au chiffre inférieur à 300 € : \"\n                        + $\"{Filtrer(marche, e => e.SurfaceM2 > 10 && e.ChiffreCentimes < 30000).Count}\");\n\n        Console.WriteLine();\n\n        // Une MESURE passée en paramètre : la méthode de totalisation ne sait pas ce qu'elle somme.\n        Console.WriteLine(\"TROIS TOTAUX, UNE SEULE MÉTHODE\");\n        Console.WriteLine($\"Chiffre d'affaires : \"\n                        + $\"{Totaliser(marche, e => e.ChiffreCentimes) / 100.0:F2} €\");\n        Console.WriteLine($\"Surface occupée : {Totaliser(marche, e => e.SurfaceM2)} m²\");\n        Console.WriteLine($\"Redevance due : \"\n                        + $\"{Totaliser(marche, e => e.SurfaceM2 * REDEVANCE_M2) / 100.0:F2} €\");\n\n        Console.WriteLine();\n\n        // Une combinaison : filtrer avec un critère, totaliser avec une mesure.\n        Console.WriteLine($\"Chiffre des seuls alimentaires : \"\n                        + $\"{Totaliser(Filtrer(marche, criteres[\"alimentaire\"]), e => e.ChiffreCentimes) / 100.0:F2} €\");\n        Console.WriteLine($\"Surface des seules petites places : \"\n                        + $\"{Totaliser(Filtrer(marche, criteres[\"petite surface\"]), e => e.SurfaceM2)} m²\");\n\n        Console.WriteLine();\n\n        // Le contrôle du placier : il signale, il ne sait pas qui écoute.\n        Controle controle = new Controle(40000);\n\n        int nombreDepassements = 0;\n        int cumulDepassement = 0;\n        List<string> avis = new List<string>();\n\n        Action<Etal, int> compter = (e, ecart) =>\n        {\n            nombreDepassements++;\n            cumulDepassement += ecart;\n        };\n        Action<Etal, int> rediger = (e, ecart) =>\n            avis.Add($\"{e.Code} {e.Exposant} : {ecart / 100.0:F2} € au-dessus du seuil\");\n\n        controle.Depassement += compter;\n        controle.Depassement += rediger;\n\n        Console.WriteLine(\"PREMIER PASSAGE DU PLACIER\");\n        controle.Examiner(marche);\n        Console.WriteLine($\"Dépassements : {nombreDepassements}\");\n        Console.WriteLine($\"Cumul au-dessus du seuil : {cumulDepassement / 100.0:F2} €\");\n        foreach (string a in avis)\n        {\n            Console.WriteLine($\"  {a}\");\n        }\n\n        Console.WriteLine();\n\n        // Un abonné se retire : le signal continue, la rédaction s'arrête.\n        controle.Depassement -= rediger;\n        Console.WriteLine(\"SECOND PASSAGE, LE RÉDACTEUR DÉSABONNÉ\");\n        controle.Examiner(marche);\n        Console.WriteLine($\"Dépassements comptés : {nombreDepassements}\");\n        Console.WriteLine($\"Avis rédigés : {avis.Count}\");\n\n        Console.WriteLine();\n\n        // Un contrôle sans le moindre abonné ne doit pas faire tomber le programme.\n        Controle silencieux = new Controle(10000);\n        silencieux.Examiner(marche);\n        Console.WriteLine(\"Un contrôle sans abonné a parcouru les douze étals sans rien casser\");\n\n        Console.WriteLine();\n\n        // Le tri lui aussi peut recevoir sa clé en paramètre.\n        Console.WriteLine(\"LES TROIS PREMIERS SELON DEUX CLÉS DIFFÉRENTES\");\n        Afficher(\"par chiffre\", Classer(marche, e => e.ChiffreCentimes));\n        Afficher(\"par rendement au mètre carré\",\n                 Classer(marche, e => e.ChiffreCentimes / e.SurfaceM2));\n    }\n\n    static List<Etal> Filtrer(List<Etal> source, Func<Etal, bool> critere)\n    {\n        List<Etal> retenus = new List<Etal>();\n        foreach (Etal e in source)\n        {\n            if (critere(e))\n            {\n                retenus.Add(e);\n            }\n        }\n        return retenus;\n    }\n\n    static int Totaliser(List<Etal> source, Func<Etal, int> mesure)\n    {\n        int total = 0;\n        foreach (Etal e in source)\n        {\n            total += mesure(e);\n        }\n        return total;\n    }\n\n    static List<Etal> Classer(List<Etal> source, Func<Etal, int> cle)\n    {\n        return source.OrderByDescending(cle).ToList();\n    }\n\n    static void Afficher(string titre, List<Etal> classes)\n    {\n        Console.WriteLine($\"{titre} :\");\n        for (int i = 0; i < 3; i++)\n        {\n            Console.WriteLine($\"  {i + 1}. {classes[i].Code} {classes[i].Exposant}\");\n        }\n    }\n}\n\nclass Controle\n{\n    public int SeuilCentimes { get; private set; }\n\n    public event Action<Etal, int> Depassement;\n\n    public Controle(int seuilCentimes)\n    {\n        if (seuilCentimes <= 0)\n        {\n            throw new ArgumentException($\"seuil de {seuilCentimes} centimes impossible\");\n        }\n        this.SeuilCentimes = seuilCentimes;\n    }\n\n    public void Examiner(List<Etal> marche)\n    {\n        foreach (Etal e in marche)\n        {\n            if (e.ChiffreCentimes > SeuilCentimes)\n            {\n                Depassement?.Invoke(e, e.ChiffreCentimes - SeuilCentimes);\n            }\n        }\n    }\n}\n\nclass Etal\n{\n    public string Code { get; private set; }\n    public string Exposant { get; private set; }\n    public string Categorie { get; private set; }\n    public int SurfaceM2 { get; private set; }\n    public int ChiffreCentimes { get; private set; }\n\n    public Etal(string code, string exposant, string categorie, int surfaceM2,\n                int chiffreCentimes)\n    {\n        if (surfaceM2 <= 0)\n        {\n            throw new ArgumentException($\"{code} : surface de {surfaceM2} m² impossible\");\n        }\n        if (chiffreCentimes < 0)\n        {\n            throw new ArgumentException($\"{code} : chiffre de {chiffreCentimes} centimes impossible\");\n        }\n        this.Code = code;\n        this.Exposant = exposant;\n        this.Categorie = categorie;\n        this.SurfaceM2 = surfaceM2;\n        this.ChiffreCentimes = chiffreCentimes;\n    }\n\n    public static Etal DepuisLigne(string ligne)\n    {\n        string[] champs = ligne.Split(';');\n        if (champs.Length != 5)\n        {\n            throw new ArgumentException($\"« {ligne} » : cinq champs attendus\");\n        }\n        return new Etal(champs[0], champs[1], champs[2], int.Parse(champs[3]),\n                        int.Parse(champs[4]));\n    }\n\n    public override string ToString()\n    {\n        return $\"{Code} — {Exposant} ({Categorie}) — {SurfaceM2} m² — \"\n             + $\"{ChiffreCentimes / 100.0:F2} €\";\n    }\n}",
