var DAY = {
  num: 22,
  title: "Delegates, events et lambdas",
  subtitle: "Traiter une fonction comme une donnée : la variable qui contient du code.",
  theory: `
<h3>1. L'idée folle : une fonction rangée dans une variable</h3>
<p>Jusqu'ici une variable contenait un nombre, un texte, un objet. Un <strong>delegate</strong> (délégué) est une variable qui contient… du <em>code</em> : une référence vers une méthode. C'est comme le numéro de téléphone d'un artisan : tu ne fais pas le travail toi-même, tu ranges le contact et tu l'appelles quand il faut. Le delegate définit la « forme » de méthode acceptée (ses paramètres et son type de retour), comme une offre d'emploi qui précise le profil recherché.</p>
<pre class="pseudo">delegate int Operation(int a, int b);   // définit un TYPE : « méthode qui prend 2 int et rend un int »
static int Additionner(int a, int b) { return a + b; } // une méthode compatible
Operation op = Additionner;             // on range la MÉTHODE dans la variable op (sans parenthèses !)
int r = op(3, 4);                       // on appelle la méthode via la variable → 7</pre>
<div class="tip">Sans parenthèses, <code>Additionner</code> désigne la méthode elle-même (le contact). Avec parenthèses, <code>Additionner(3,4)</code> l'exécute (l'appel). Un delegate stocke le contact.</div>

<h3>2. Les lambdas : des mini-méthodes jetables</h3>
<p>Une <strong>lambda</strong> (fonction anonyme) est une méthode sans nom, écrite sur place. Le <code>=&gt;</code> se lit « donne ».</p>
<pre class="pseudo">Operation somme = (a, b) =&gt; a + b;        // lambda : prend (a, b), renvoie a + b
Operation produit = (a, b) =&gt; a * b;      // une autre, à la volée
Console.WriteLine(somme(2, 5));           // 7
Console.WriteLine(produit(2, 5));         // 10</pre>
<p>Une lambda est parfaite quand le code est court et utilisé une seule fois : inutile de créer une méthode nommée pour ça.</p>

<h3>3. Func et Action : les delegates tout prêts</h3>
<p>Plutôt que déclarer ton propre delegate, C# en fournit deux familles :</p>
<pre class="pseudo">Func&lt;int, int, int&gt; add = (a, b) =&gt; a + b;  // Func : renvoie une valeur ; le DERNIER type est le retour
// Func&lt;int, int, int&gt; = prend int, int → rend int
Func&lt;string, int&gt; longueur = s =&gt; s.Length; // prend string → rend int
Action&lt;string&gt; afficher = msg =&gt; Console.WriteLine(msg); // Action : NE renvoie RIEN (void)
afficher("Bonjour");                       // exécute la lambda</pre>
<div class="tip">Retiens : <strong>Func</strong> renvoie quelque chose (le dernier paramètre générique est le type de retour), <strong>Action</strong> ne renvoie rien (void). Ce sont ces types que LINQ utilise en coulisses pour <code>Where</code> et <code>Select</code>.</div>

<h3>4. Passer du comportement en paramètre</h3>
<p>Un delegate permet de passer un COMPORTEMENT à une méthode, pas seulement des données. Thème gestionnaire de tâches :</p>
<pre class="pseudo">static List&lt;Tache&gt; Filtrer(List&lt;Tache&gt; source, Func&lt;Tache, bool&gt; critere) // le critère est fourni par l'appelant
{                                                    // début
    var res = new List&lt;Tache&gt;();                     // liste résultat
    foreach (var t in source)                        // pour chaque tâche
        if (critere(t)) res.Add(t);                  // on applique le critère reçu
    return res;                                      // on rend les retenues
}
// Appels : on change le comportement sans toucher à Filtrer
var urgentes = Filtrer(taches, t =&gt; t.Urgente);      // critère 1
var longues  = Filtrer(taches, t =&gt; t.Duree &gt; 60);  // critère 2</pre>

<h3>5. Les events : prévenir quand quelque chose arrive</h3>
<p>Un <strong>event</strong> (événement) est un delegate spécial servant à NOTIFIER : un objet « émet » un signal, et d'autres, abonnés, réagissent. C'est le principe de la sonnette : la porte ne sait pas qui écoute, elle sonne ; les abonnés (toi dans la cuisine) réagissent.</p>
<pre class="pseudo">class Minuteur                                  // un objet qui émet un signal
{                                               // début
    public event Action Termine;                // l'événement : des Action pourront s'y abonner
    public void Lancer()                        // simule la fin
    {                                           // début
        Termine?.Invoke();                      // ?.Invoke : prévenir les abonnés SI il y en a
    }                                           // ?. évite l'erreur si personne n'est abonné
}
Minuteur m = new Minuteur();                    // création
m.Termine += () =&gt; Console.WriteLine("Fini !"); // += : je m'ABONNE (j'ajoute ma réaction)
m.Lancer();                                     // déclenche → affiche « Fini ! »</pre>
<div class="warn">On s'abonne avec <code>+=</code> et on se désabonne avec <code>-=</code>. Le <code>?.Invoke()</code> n'appelle que s'il y a au moins un abonné : sans le <code>?.</code>, déclencher un event sans abonné provoquerait une NullReferenceException.</div>

<h3>6. À quoi ça sert vraiment</h3>
<p>Delegates et events sont le cœur des interfaces graphiques (« quand on clique, fais ceci »), de LINQ, et du découplage : un objet signale, sans savoir qui écoute. C'est ce qui rend le code modulaire et extensible.</p>`,
  exercises: [
    { type: "qcm", q: "Un delegate est…", opts: ["Une structure de contrôle de flux", "Une variable qui contient une RÉFÉRENCE vers une méthode (du code)", "Un type de donnée numérique", "Un mécanisme de gestion d'erreurs"], a: 1, exp: "Le 'numéro de téléphone' d'une méthode." },
    { type: "qcm", q: "<code>Operation op = Additionner;</code> — pourquoi PAS de parenthèses ?", opts: ["C'est un simple oubli des parenthèses", "Sans parenthèses on référence la méthode ; avec, on l'exécuterait", "Les parenthèses sont toujours optionnelles", "Pour rendre le code plus court à écrire"], a: 1, exp: "Additionner = le contact ; Additionner(3,4) = l'appel." },
    { type: "qcm", q: "Dans <code>(a, b) =&gt; a + b</code>, c'est…", opts: ["Une définition de classe anonyme", "Une lambda : une fonction anonyme écrite sur place", "Un delegate déclaré", "Une levée d'exception"], a: 1, exp: "Fonction sans nom, jetable." },
    { type: "qcm", q: "Le symbole <code>=&gt;</code> dans une lambda se lit…", opts: ["'est égal à' (une comparaison)", "'donne' : paramètres à gauche, résultat à droite", "'est plus grand que'", "'affecte une valeur'"], a: 1, exp: "(a,b) donne a+b." },
    { type: "qcm", q: "<code>Func&lt;int, int, int&gt;</code> désigne une fonction qui…", opts: ["Prend 3 int", "Prend deux int et RENVOIE un int (le dernier type = retour)", "Ne renvoie rien", "Prend un int"], a: 1, exp: "Func : le dernier paramètre générique est le type de retour." },
    { type: "qcm", q: "<code>Action&lt;string&gt;</code> désigne une fonction qui…", opts: ["Renvoie une string", "Prend une string et NE renvoie RIEN (void)", "Prend deux string", "Renvoie un int"], a: 1, exp: "Action = aucun retour." },
    { type: "vf", q: "La différence Func/Action : Func renvoie une valeur, Action ne renvoie rien.", a: true, exp: "Func → valeur ; Action → void." },
    { type: "qcm", q: "<code>Func&lt;string, int&gt; f = s =&gt; s.Length;</code> : que renvoie f(\"chat\") ?", opts: ["chat", "4 : la longueur de la chaîne", "true", "Erreur"], a: 1, exp: "Prend string, rend int : la longueur." },
    { type: "qcm", q: "Passer <code>Func&lt;Tache, bool&gt; critere</code> à une méthode permet de…", opts: ["Trier la liste plus rapidement", "Passer un COMPORTEMENT (le critère) et le changer sans réécrire la méthode", "Enregistrer la liste dans un fichier", "Compter les éléments retenus"], a: 1, exp: "Le comportement devient un paramètre." },
    { type: "qcm", q: "Un event sert à…", opts: ["Répéter une action en boucle", "NOTIFIER : un objet émet un signal, des abonnés réagissent", "Trier une collection d'objets", "Stocker une valeur numérique"], a: 1, exp: "Le principe de la sonnette." },
    { type: "qcm", q: "Comment s'abonner à un event <code>Termine</code> ?", opts: ["m.Termine = ...", "m.Termine += maReaction; (avec +=)", "m.Termine()", "m.subscribe()"], a: 1, exp: "+= ajoute un abonné ; -= le retire." },
    { type: "qcm", q: "À quoi sert <code>Termine?.Invoke();</code> ?", opts: ["À trier les abonnés", "À prévenir les abonnés SEULEMENT s'il y en a (le ?. évite le null)", "À créer un event", "À se désabonner"], a: 1, exp: "Sans abonné, Termine est null : ?. protège." },
    { type: "vf", q: "Déclencher un event sans aucun abonné, sans le <code>?.</code>, peut provoquer une NullReferenceException.", a: true, exp: "Le ?.Invoke() est là précisément pour ça." },
    { type: "qcm", q: "LINQ (Where, Select) utilise en coulisses…", opts: ["Des accès à des fichiers", "Des delegates Func/Action (les lambdas qu'on lui passe)", "Des blocs de gestion d'exceptions", "Un générateur de nombres aléatoires"], a: 1, exp: "Where prend un Func<T,bool>, Select un Func<T,R>." },
    { type: "qcm", q: "Principal intérêt des events pour l'architecture :", opts: ["Aucun intérêt particulier", "Le DÉCOUPLAGE : l'émetteur ignore qui écoute, le code reste modulaire", "Un gain de vitesse d'exécution", "Une consommation mémoire réduite"], a: 1, exp: "La porte sonne sans savoir qui répond." }
  ],
  final: {
    title: "Exercice final — Un bouton qui prévient ses abonnés",
    intro: `<p>On modélise un bouton d'interface. Quand on le « clique », il déclenche un event auquel plusieurs réactions se sont abonnées.</p>
<pre class="pseudo">class Bouton                                  // l'émetteur
{                                             // début
    public event Action Clique;               // (1) l'événement, des Action pourront s'abonner
    public void Cliquer() { Clique?.Invoke(); } // (2) déclenche, prévient les abonnés s'il y en a
}
Bouton b = new Bouton();                       // création
b.Clique += () =&gt; Console.WriteLine("Enregistré"); // (3) abonné n°1
b.Clique += () =&gt; Console.WriteLine("Notifié");    // (4) abonné n°2
b.Cliquer();                                   // (5) on clique</pre>`,
    questions: [
      { type: "qcm", q: "(1) <code>public event Action Clique;</code> déclare…", opts: ["Une méthode publique classique", "Un ÉVÉNEMENT auquel des Action (sans paramètre, sans retour) peuvent s'abonner", "Une variable de type entier", "Une classe interne nommée Clique"], a: 1, exp: "Un event de type Action." },
      { type: "qcm", q: "(2) Rôle du <code>?.</code> dans <code>Clique?.Invoke()</code> ?", opts: ["Trier les abonnés", "N'appeler QUE s'il existe au moins un abonné (évite le null)", "Se désabonner de l'event", "Créer l'event"], a: 1, exp: "Protection contre l'absence d'abonné." },
      { type: "qcm", q: "(3)(4) L'opérateur <code>+=</code> sur un event signifie…", opts: ["Additionner", "S'ABONNER : ajouter une réaction à la liste des abonnés", "Remplacer", "Se désabonner"], a: 1, exp: "+= abonne, -= désabonne." },
      { type: "qcm", q: "(5) Que s'affiche-t-il quand on appelle <code>b.Cliquer()</code> ?", opts: ["Rien", "'Enregistré' puis 'Notifié' : les DEUX abonnés réagissent dans l'ordre", "'Enregistré' seulement", "Une exception"], a: 1, exp: "Tous les abonnés sont appelés." },
      { type: "vf", q: "Si aucun abonné n'existait, <code>Clique?.Invoke()</code> n'afficherait rien et ne planterait pas.", a: true, exp: "Le ?. rend l'appel sûr même sans abonné." }
    ],
    solution: `<pre class="pseudo">event Action Clique        // l'émetteur déclare un canal de notification
Clique?.Invoke()           // sonne, uniquement s'il y a des abonnés
b.Clique += reaction1      // abonnement n°1
b.Clique += reaction2      // abonnement n°2
b.Cliquer() → "Enregistré" // 1er abonné
             → "Notifié"    // 2e abonné, dans l'ordre d'abonnement</pre>
<p>Le bouton ignore totalement qui l'écoute : c'est le découplage. Delegates et lambdas sont partout — LINQ, interfaces graphiques, callbacks. Prochaine leçon : la sécurité anti-null.</p>`
  }
};
