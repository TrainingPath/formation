<script>
var DAY = {
  num: 4,
  title: "Console : lire et afficher",
  subtitle: "Le Lire(...) du jour 5, avec Console.ReadLine.",
  theory: `
<h3>1. Lire une ligne : ReadLine</h3>
<p><code>Console.ReadLine()</code> met le programme en <strong>pause</strong>, attend que l'utilisateur tape quelque chose et appuie sur Entrée, puis renvoie ce qui a été saisi… en <strong>string</strong>, toujours. Même si l'utilisateur tape « 42 », tu reçois le TEXTE "42", jamais le nombre : il faut le convertir pour calculer.</p>
<pre class="pseudo">Console.WriteLine("Quel est ton prénom ?");   // 1. AFFICHER une invite (sinon l'utilisateur ne sait pas quoi taper)
string nom = Console.ReadLine();              // 2. LIRE la saisie (une string) et la ranger dans nom
Console.WriteLine("Quel âge ?");              // invite pour la valeur suivante
int age = int.Parse(Console.ReadLine());      // lire PUIS convertir le texte en entier (string → int)</pre>
<div class="warn">ReadLine() rend TOUJOURS une string. Pour calculer, convertis avec <code>int.Parse</code>, <code>double.Parse</code>… ou mieux, <code>int.TryParse</code> qui ne plante pas sur une saisie invalide.</div>

<h3>2. La version sûre : TryParse</h3>
<pre class="pseudo">Console.WriteLine("Ton âge ?");                        // invite
if (int.TryParse(Console.ReadLine(), out int age))    // tente la conversion ; renvoie true si ça marche, et remplit age
{                                                     // bloc exécuté SI la saisie était bien un nombre
    Console.WriteLine($"Dans 10 ans : {age + 10}");   // on peut calculer : age est un vrai int
}                                                     // fin du cas « succès »
else                                                  // sinon (la saisie n'était pas un nombre)
{                                                     // bloc exécuté SI la conversion a échoué
    Console.WriteLine("Ce n'est pas un nombre !");    // message d'erreur au lieu d'un plantage
}                                                     // fin du cas « échec »</pre>
<p>Le <code>out int age</code> déclare la variable <code>age</code> ET la remplit si la conversion réussit ; <code>out</code> signifie « paramètre de sortie » : la méthode écrit son résultat dedans. <code>TryParse</code> renvoie un <code>bool</code> de succès qu'on teste directement dans le <code>if</code>. C'est la façon robuste de lire un nombre saisi par un humain (qui peut se tromper).</p>

<h3>3. Le schéma universel : invite → lecture → traitement → affichage</h3>
<pre class="pseudo">Console.WriteLine("Montant en euros ?");          // 1. INVITE : dire ce qu'on attend
double euros = double.Parse(Console.ReadLine());  // 2. LECTURE + CONVERSION en double
double dollars = euros * 1.08;                    // 3. TRAITEMENT : le calcul métier
Console.WriteLine($"Cela fait {dollars} dollars");// 4. AFFICHAGE du résultat</pre>
<p>Ce déroulé en quatre temps est le squelette de presque tout programme interactif. Retiens l'ordre : on affiche d'abord l'invite, sinon l'utilisateur voit un curseur qui clignote sans savoir quoi faire.</p>

<h3>4. L'interpolation de chaînes : $"..."</h3>
<pre class="pseudo">string nom = "Léa";                               // une variable texte
int age = 15;                                     // une variable nombre
Console.WriteLine($"Bonjour {nom}, {age} ans");   // le $ ACTIVE l'interpolation : {nom} et {age} sont remplacés par leurs valeurs
Console.WriteLine("Total : " + total + " €");     // ancienne façon : concaténation avec + (plus lourde)
Console.WriteLine($"Somme : {3 + 4}");            // dans les accolades on peut mettre une EXPRESSION, calculée → affiche « Somme : 7 »</pre>
<div class="tip">Le <code>$"..."</code> de C# (avec accolades) est l'équivalent des guillemets doubles de PHP. Sans le <code>$</code>, <code>"{nom}"</code> afficherait littéralement le texte « {nom} ». Plus lisible que la concaténation à rallonge : privilégie-le.</div>

<h3>5. Formater dans l'interpolation</h3>
<pre class="pseudo">double prix = 19.999;                   // un prix avec trois décimales
Console.WriteLine($"{prix:F2}");        // F2 = Fixed 2 décimales → affiche « 20,00 » (arrondi)
Console.WriteLine($"{prix:C}");         // C = Currency → format monétaire local (ex. « 20,00 € »)
Console.WriteLine($"{42:D5}");          // D5 = Decimal sur 5 chiffres, complété de zéros → « 00042 »</pre>
<p>La syntaxe <code>{valeur:format}</code> permet de contrôler l'affichage sans changer la valeur : un prix reste 19,999 en mémoire mais s'affiche « 20,00 ». Pratique pour des factures ou des numéros à longueur fixe.</p>

<h3>6. Lire plusieurs valeurs</h3>
<pre class="pseudo">Console.WriteLine("Deux notes ?");                    // invite
int n1 = int.Parse(Console.ReadLine());              // 1re lecture : la première note saisie
int n2 = int.Parse(Console.ReadLine());              // 2e lecture : la seconde note (chaque ReadLine attend une nouvelle ligne)
Console.WriteLine($"Moyenne : {(n1 + n2) / 2.0}");   // /2.0 (double) force la division RÉELLE, sinon int/int tronque (leçon 3)</pre>
<p>Chaque <code>ReadLine()</code> consomme une ligne : les saisies se lisent dans l'ordre où l'utilisateur les tape. Le <code>2.0</code> de la moyenne est crucial — avec <code>/2</code>, la moyenne de 8 et 5 donnerait 6 (troncature) au lieu de 6,5.</p>`,
  exercises: [
    { type: "qcm", q: "Console.ReadLine() retourne…", opts: ["Un int", "Une string, TOUJOURS (à convertir pour calculer)", "Un double", "Un bool"], a: 1, exp: "Le clavier ne transporte que du texte." },
    { type: "qcm", q: "Lire un entier :", opts: ["int n = Console.ReadLine();", "int n = int.Parse(Console.ReadLine());", "int n = Console.ReadInt();", "read n;"], a: 1, exp: "ReadLine puis int.Parse : la conversion obligatoire." },
    { type: "qcm", q: "La version SÛRE de la lecture d'un entier :", opts: ["int.Parse", "int.TryParse(Console.ReadLine(), out int n)", "Convert.ToInt32 sans test", "(int)"], a: 1, exp: "TryParse ne plante pas sur « abc » : il retourne false." },
    { type: "qcm", q: "Dans TryParse(..., out int age), le mot-clé out signifie…", opts: ["Sortie du programme", "La variable age est REMPLIE par la méthode si la conversion réussit", "Une erreur", "age est constant"], a: 1, exp: "out = paramètre de sortie : la méthode y écrit le résultat." },
    { type: "qcm", q: "int.Parse(Console.ReadLine()) sur « bonjour » :", opts: ["Retourne 0", "Lance une FormatException (plantage) : d'où l'intérêt de TryParse", "Retourne null", "Retourne bonjour"], a: 1, exp: "Parse est intolérant ; l'utilisateur, imprévisible." },
    { type: "qcm", q: "L'interpolation C# s'active avec…", opts: ["Des apostrophes", "Le $ devant les guillemets : $\"Bonjour {nom}\"", "Des accolades seules", "@"], a: 1, exp: "Sans le $, les {nom} resteraient du texte littéral." },
    { type: "qcm", q: "Qu'affiche <code>Console.WriteLine($\"Total : {3 + 4}\");</code> ?", opts: ["Total : 3 + 4", "Total : 7 : l'expression dans {} est calculée", "Total : {7}", "Erreur"], a: 1, exp: "Les accolades évaluent l'expression." },
    { type: "qcm", q: "Qu'affiche <code>Console.WriteLine(\"Total : \" + 3 + 4);</code> ?", opts: ["Total : 7", "Total : 34 : concaténation gauche à droite (comme Java !)", "Total : 3 4", "Erreur"], a: 1, exp: "\"...\"+3 → \"...3\", puis +4 → \"...34\". Le piège Java, partagé." },
    { type: "qcm", q: "Il faut toujours faire quoi AVANT un ReadLine (jour 5) ?", opts: ["Rien", "Afficher une invite : l'utilisateur doit savoir quoi taper", "Vider l'écran", "Convertir"], a: 1, exp: "Invite → lecture → traitement → affichage." },
    { type: "qcm", q: "L'utilisateur tape 8 puis 5. int a = int.Parse(ReadLine()); int b = int.Parse(ReadLine()); a - b vaut…", opts: ["3", "-3", "85", "0"], a: 0, exp: "a=8, b=5 : lectures dans l'ordre (jour 5)." },
    { type: "qcm", q: "$\"{prix:F2}\" avec prix = 19.999 affiche…", opts: ["19.999", "20,00 : F2 = 2 décimales, arrondies", "20", "19.99"], a: 1, exp: "Le format dans l'interpolation : {valeur:format}." },
    { type: "qcm", q: "$\"{42:D5}\" affiche…", opts: ["42", "00042 : D5 = 5 chiffres avec zéros", "42000", "5"], a: 1, exp: "Parfait pour les numéros de facture (comme %05d ailleurs)." },
    { type: "qcm", q: "Moyenne de deux int n1, n2 : pourquoi <code>(n1 + n2) / 2.0</code> et pas / 2 ?", opts: ["Style", "/2.0 force la division RÉELLE : sinon int/int tronque (leçon 3, le piège)", "2.0 est plus rapide", "Aucune raison"], a: 1, exp: "Le 2.0 (double) évite la troncature de la moyenne." },
    { type: "qcm", q: "L'utilisateur tape 10. int n = int.Parse(ReadLine()); n = n * 2 + 1; Affichage ?", opts: ["10", "21", "20", "101"], a: 1, exp: "10 × 2 + 1 = 21 : trace en C#." },
    { type: "vf", q: "TryParse est préférable à Parse pour les saisies utilisateur.", a: true, exp: "L'utilisateur tape n'importe quoi ; TryParse gère l'erreur sans planter." }
  ],
  final: {
    title: "Exercice final — Le ticket de caisse (version C#)",
    intro: `<p>Le ticket du jour 5, quatrième traduction :</p>
<pre class="pseudo">Console.WriteLine("Prix unitaire ?");
double prix = double.Parse(Console.ReadLine());
Console.WriteLine("Quantité ?");
int quantite = int.Parse(Console.ReadLine());
Console.WriteLine("Nom du client ?");
string client = Console.ReadLine();
double ttc = prix * quantite * 1.21;
Console.WriteLine($"{client} doit {ttc:F2} €");</pre>
<p>L'utilisateur tape : 10 · 3 · Ana Lopez.</p>`,
    questions: [
      { type: "qcm", q: "double.Parse(Console.ReadLine()) sur « 10 » donne…", opts: ["\"10\"", "10.0 : lecture string puis conversion en double", "10 (int)", "Erreur"], a: 1, exp: "ReadLine rend « 10 », Parse le convertit." },
      { type: "qcm", q: "En C#, faut-il un « nextLine poubelle » comme le Scanner de Java ?", opts: ["Oui, obligatoire", "NON : Console.ReadLine lit toujours la ligne entière, pas de tampon piégeux — plus simple que Java !", "Parfois", "Deux ReadLine"], a: 1, exp: "Un point où C# est plus confortable que le Scanner Java." },
      { type: "qcm", q: "string client = Console.ReadLine(); sur « Ana Lopez » donne…", opts: ["« Ana » seulement", "« Ana Lopez » : ReadLine prend la ligne complète, espaces compris", "« Lopez »", "Erreur"], a: 1, exp: "Pas de découpage à l'espace (contrairement au next() de Java)." },
      { type: "input", q: "Que vaut <code>ttc</code> ? (10 × 3 × 1.21)", a: ["36.3", "36,3"], ph: "nombre", exp: "36.3 € — comme le jour 5." },
      { type: "qcm", q: "Qu'affiche exactement la dernière ligne ?", opts: ["client doit ttc €", "Ana Lopez doit 36,30 € : interpolation + format F2", "Ana doit 36 €", "Erreur"], a: 1, exp: "$\"{client} doit {ttc:F2} €\" : variables et format combinés." }
    ],
    solution: `<pre class="pseudo">"Prix unitaire ?"  → 10   → double 10.0
"Quantité ?"       → 3    → int 3
"Nom du client ?"  → Ana Lopez (ligne entière, sans piège de tampon)
ttc = 10 * 3 * 1.21 = 36.3
Affiche : Ana Lopez doit 36,30 €

Bonus C# : ReadLine plus simple que le Scanner Java
(pas de nextLine poubelle).</pre>
<p>Invite → ReadLine → Parse → calcul → interpolation : ton squelette pour tous les programmes console. Demain : les conditions C#.</p>`
  }
};

      "Console.ReadLine() renvoie toujours une string : il faut la convertir.",

    solution: "using System;                                    // donne accès à la classe Console\n\nclass PrixTTC                                    // déclaration de la classe\n{                                                // début de la classe\n    static void Main()                           // point d'entrée : l'exécution démarre ici\n    {                                            // début de Main\n        Console.Write(\"Prix HT ? \");             // Write (sans Line) : pas de retour à la ligne\n        double ht = double.Parse(Console.ReadLine()); // ReadLine renvoie une string ; Parse la convertit en double\n        double ttc = ht * 1.21;                  // calcule le TTC (+21 %)\n        Console.WriteLine($\"Prix TTC : {ttc} €\"); // $\"…\" = interpolation : {ttc} est remplacé par sa valeur\n    }                                            // fin de Main\n}                                                // fin de la classe",

  { id: "cs-saisie", title: "La saisie blindée", level: 2,
    statement: "Demande un entier entre 1 et 100. Utilise <code>int.TryParse</code> pour refuser les saisies non numériques, et redemande tant que la valeur est invalide.",
    hints: [
      "int.TryParse(texte, out int n) renvoie un bool : false si le texte n'est pas un nombre. Pas d'exception, pas de plantage.",
      "Structure : bool valide = false; puis while (!valide) { lire, tester, valider }.",
      "La saisie est bonne si TryParse renvoie true ET n >= 1 ET n <= 100."
    ],
    solution: "using System;                                    // accès à Console\n\nclass SaisieBlindee                              // déclaration de la classe\n{                                                // début de la classe\n    static void Main()                           // point d'entrée du programme\n    {                                            // début de Main\n        int n = 0;                               // la valeur finale (initialisée pour le compilateur)\n        bool valide = false;                     // drapeau : la saisie est-elle acceptable ?\n        while (!valide)                          // on boucle tant que ce n'est PAS valide\n        {                                        // début du bloc répété\n            Console.Write(\"Entier entre 1 et 100 ? \"); // invite\n            string texte = Console.ReadLine();   // lit la saisie brute (toujours une string)\n            if (int.TryParse(texte, out n)       // TryParse : true si conversion réussie, résultat dans n\n                && n >= 1 && n <= 100)           // ET la valeur est dans les bornes\n                valide = true;                   // tout est bon → la boucle s'arrêtera\n            else                                 // conversion ratée OU hors bornes\n                Console.WriteLine(\"Saisie invalide, recommence !\"); // message puis nouveau tour\n        }                                        // fin de la boucle\n        Console.WriteLine($\"Merci ! Tu as choisi {n}.\"); // ici n est forcément valide\n    }                                            // fin de Main\n}                                                // fin de la classe",
