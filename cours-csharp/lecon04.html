  title: "Console : lire et afficher",
  subtitle: "Le Lire(...) du jour 5, avec Console.ReadLine.",
  theory: `
<h3>1. Lire une ligne : ReadLine</h3>
<p><code>Console.ReadLine()</code> met le programme en <strong>pause</strong>, attend que l'utilisateur tape quelque chose et appuie sur Entrée, puis renvoie ce qui a été saisi… en <strong>string</strong>, toujours. Même si l'utilisateur tape « 42 », tu reçois le TEXTE "42", jamais le nombre : il faut le convertir pour calculer.</p>
<pre class="pseudo">Console.WriteLine("Quel est ton prénom ?");   // 1. AFFICHER une invite (sinon l'utilisateur ne sait pas quoi taper)
string nom = Console.ReadLine();              // 2. LIRE la saisie (une string) et la ranger dans nom
Console.WriteLine("Quel âge ?");              // invite pour la valeur suivante
int age = int.Parse(Console.ReadLine());      // lire PUIS convertir le texte en entier (string → int)</pre>
<div class="warn">ReadLine() rend TOUJOURS une string. Pour calculer, convertis avec <code>int.Parse</code>, <code>double.Parse</code>… ou mieux, <code>int.TryParse</code> qui ne plante pas sur une saisie invalide.</div>

<h3>2. La version sûre : TryParse</h3>
<pre class="pseudo">Console.WriteLine("Ton âge ?");                        // invite
if (int.TryParse(Console.ReadLine(), out int age))    // tente la conversion ; renvoie true si ça marche, et remplit age
{                                                     // bloc exécuté SI la saisie était bien un nombre
    Console.WriteLine($"Dans 10 ans : {age + 10}");   // on peut calculer : age est un vrai int
}                                                     // fin du cas « succès »
else                                                  // sinon (la saisie n'était pas un nombre)
{                                                     // bloc exécuté SI la conversion a échoué
    Console.WriteLine("Ce n'est pas un nombre !");    // message d'erreur au lieu d'un plantage
}                                                     // fin du cas « échec »</pre>
<p>Le <code>out int age</code> déclare la variable <code>age</code> ET la remplit si la conversion réussit ; <code>out</code> signifie « paramètre de sortie » : la méthode écrit son résultat dedans. <code>TryParse</code> renvoie un <code>bool</code> de succès qu'on teste directement dans le <code>if</code>. C'est la façon robuste de lire un nombre saisi par un humain (qui peut se tromper).</p>

<h3>3. Le schéma universel : invite → lecture → traitement → affichage</h3>
<pre class="pseudo">Console.WriteLine("Montant en euros ?");          // 1. INVITE : dire ce qu'on attend
double euros = double.Parse(Console.ReadLine());  // 2. LECTURE + CONVERSION en double
double dollars = euros * 1.08;                    // 3. TRAITEMENT : le calcul métier
Console.WriteLine($"Cela fait {dollars} dollars");// 4. AFFICHAGE du résultat</pre>
<p>Ce déroulé en quatre temps est le squelette de presque tout programme interactif. Retiens l'ordre : on affiche d'abord l'invite, sinon l'utilisateur voit un curseur qui clignote sans savoir quoi faire.</p>

<h3>4. L'interpolation de chaînes : $"..."</h3>
<pre class="pseudo">string nom = "Léa";                               // une variable texte
int age = 15;                                     // une variable nombre
Console.WriteLine($"Bonjour {nom}, {age} ans");   // le $ ACTIVE l'interpolation : {nom} et {age} sont remplacés par leurs valeurs
Console.WriteLine("Total : " + total + " €");     // ancienne façon : concaténation avec + (plus lourde)
Console.WriteLine($"Somme : {3 + 4}");            // dans les accolades on peut mettre une EXPRESSION, calculée → affiche « Somme : 7 »</pre>
<div class="tip">Le <code>$"..."</code> de C# (avec accolades) est l'équivalent des guillemets doubles de PHP. Sans le <code>$</code>, <code>"{nom}"</code> afficherait littéralement le texte « {nom} ». Plus lisible que la concaténation à rallonge : privilégie-le.</div>

<h3>5. Formater dans l'interpolation</h3>
<pre class="pseudo">double prix = 19.999;                   // un prix avec trois décimales
Console.WriteLine($"{prix:F2}");        // F2 = Fixed 2 décimales → affiche « 20,00 » (arrondi)
Console.WriteLine($"{prix:C}");         // C = Currency → format monétaire local (ex. « 20,00 € »)
Console.WriteLine($"{42:D5}");          // D5 = Decimal sur 5 chiffres, complété de zéros → « 00042 »</pre>
<p>La syntaxe <code>{valeur:format}</code> permet de contrôler l'affichage sans changer la valeur : un prix reste 19,999 en mémoire mais s'affiche « 20,00 ». Pratique pour des factures ou des numéros à longueur fixe.</p>

<h3>6. Lire plusieurs valeurs</h3>
<pre class="pseudo">Console.WriteLine("Deux notes ?");                    // invite
int n1 = int.Parse(Console.ReadLine());              // 1re lecture : la première note saisie
int n2 = int.Parse(Console.ReadLine());              // 2e lecture : la seconde note (chaque ReadLine attend une nouvelle ligne)
Console.WriteLine($"Moyenne : {(n1 + n2) / 2.0}");   // /2.0 (double) force la division RÉELLE, sinon int/int tronque (leçon 3)</pre>
<p>Chaque <code>ReadLine()</code> consomme une ligne : les saisies se lisent dans l'ordre où l'utilisateur les tape. Le <code>2.0</code> de la moyenne est crucial — avec <code>/2</code>, la moyenne de 8 et 5 donnerait 6 (troncature) au lieu de 6,5.</p>`,

"Quantité ?"       → 3    → int 3
"Nom du client ?"  → Ana Lopez (ligne entière, sans piège de tampon)
ttc = 10 * 3 * 1.21 = 36.3
Affiche : Ana Lopez doit 36,30 €

Bonus C# : ReadLine plus simple que le Scanner Java

<p>Invite → ReadLine → Parse → calcul → interpolation : ton squelette pour tous les programmes console. Demain : les conditions C#.</p>`

 Console.WriteLine();\n\n        // Le détail des coupures, en billets de 50, 20 et 10.\n        int reste = retraitEuros;\n        int billets50 = reste / 50;\n        reste = reste % 50;\n        int billets20 = reste / 20;\n        reste = reste % 20;\n        int billets10 = reste / 10;\n        reste = reste % 10;\n        Console.WriteLine($\"50 € : {billets50} | 20 € : {billets20} | 10 € : {billets10}\");\n        Console.WriteLine($\"Non distribuable : {reste} €\");\n\n        Console.WriteLine();\n\n        // Deux formats d'affichage sur la même valeur.\n        double soldeEnEuros = soldeApres / 100.0;\n        Console.WriteLine($\"Nouveau solde : {soldeEnEuros:F2} €\");\n        Console.WriteLine($\"Ticket n° {7:D4} — compte {compte}\");\n        Console.WriteLine($\"Somme d'un retrait et d'un frais fixe : {retraitEuros + 1} €\");\n    }\n}",

      "solution": "// Le stand de crêpes — jour 4 sur 4 : la caisse devient interactive.\n// Session d'essai : 3, 2, 4, 5, puis 50 pour le billet.\nusing System;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        const int PrixSucreCentimes = 200;\n        const int PrixCassonadeCentimes = 220;\n        const int PrixChocolatCentimes = 300;\n        const int SupplementChantillyCentimes = 50;\n\n        Console.WriteLine(\"+----------------------------+\");\n        Console.WriteLine(\"|  LES CRÊPES DE LA KERMESSE |\");\n        Console.WriteLine(\"+----------------------------+\");\n        Console.WriteLine();\n\n        // Quatre lectures, quatre vérifications : rien n'est supposé correct.\n        Console.WriteLine(\"Combien de crêpes au sucre ?\");\n        bool sucreLu = int.TryParse(Console.ReadLine(), out int nbSucre);\n\n        Console.WriteLine(\"Combien de crêpes à la cassonade ?\");\n        bool cassonadeLu = int.TryParse(Console.ReadLine(), out int nbCassonade);\n\n        Console.WriteLine(\"Combien de crêpes au chocolat ?\");\n        bool chocolatLu = int.TryParse(Console.ReadLine(), out int nbChocolat);\n\n        Console.WriteLine(\"Combien de suppléments chantilly ?\");\n        bool chantillyLu = int.TryParse(Console.ReadLine(), out int nbChantilly);\n\n        bool commandeLisible = sucreLu && cassonadeLu && chocolatLu && chantillyLu;\n        Console.WriteLine();\n        Console.WriteLine($\"Commande entièrement lisible : {commandeLisible}\");\n\n        // Les quantités illisibles valent zéro : le calcul reste possible,\n        // mais le total ne veut plus rien dire — d'où la mention ci-dessus.\n        int nbCrepes = nbSucre + nbCassonade + nbChocolat;\n        int totalCentimes = nbSucre * PrixSucreCentimes\n                          + nbCassonade * PrixCassonadeCentimes\n                          + nbChocolat * PrixChocolatCentimes\n                          + nbChantilly * SupplementChantillyCentimes;\n        double totalEuros = totalCentimes / 100.0;\n\n        Console.WriteLine();\n        Console.WriteLine(\"--- TICKET ---\");\n        Console.WriteLine($\"Sucre      x{nbSucre}\");\n        Console.WriteLine($\"Cassonade  x{nbCassonade}\");\n        Console.WriteLine($\"Chocolat   x{nbChocolat}\");\n        Console.WriteLine($\"Chantilly  x{nbChantilly}\");\n        Console.WriteLine($\"Crêpes : {nbCrepes}\");\n        Console.WriteLine($\"TOTAL  : {totalEuros:F2} €\");\n\n        Console.WriteLine();\n        Console.WriteLine(\"Billet donné, en euros ?\");\n        bool billetLu = int.TryParse(Console.ReadLine(), out int billetEuros);\n        int payeCentimes = billetEuros * 100;\n        int rendreCentimes = payeCentimes - totalCentimes;\n\n        Console.WriteLine();\n        Console.WriteLine($\"Billet lisible : {billetLu}\");\n        Console.WriteLine($\"Payé : {payeCentimes} centimes\");\n\n        if (rendreCentimes < 0)\n        {\n            Console.WriteLine($\"Il manque {Math.Abs(rendreCentimes)} centimes.\");\n        }\n        else\n        {\n            Console.WriteLine($\"À rendre : {rendreCentimes / 100.0:F2} €\");\n\n            int reste = rendreCentimes;\n            int pieces200 = reste / 200;\n            reste = reste % 200;\n            int pieces100 = reste / 100;\n            reste = reste % 100;\n            int pieces50 = reste / 50;\n            reste = reste % 50;\n            int pieces20 = reste / 20;\n            reste = reste % 20;\n            int pieces10 = reste / 10;\n            reste = reste % 10;\n\n            Console.WriteLine($\"2 € : {pieces200} | 1 € : {pieces100} | 50 c : {pieces50}\"\n                              + $\" | 20 c : {pieces20} | 10 c : {pieces10}\");\n            Console.WriteLine($\"Reste non rendable : {reste} centime(s)\");\n        }\n\n        Console.WriteLine();\n        Console.WriteLine($\"Ticket n° {84:D5} — merci et bonne kermesse !\");\n    }\n}",
