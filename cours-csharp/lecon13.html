  title: "Constructeurs et propriétés",
  subtitle: "Naître complet, vivre protégé — avec les propriétés élégantes de C#.",
  theory: `
<h3>1. Le constructeur : garantir un objet valide dès sa naissance</h3>
<p>Un <strong>constructeur</strong> est une méthode spéciale appelée automatiquement par <code>new</code>. Son rôle : initialiser les attributs de l'objet — et, souvent, vérifier qu'ils sont cohérents dès le départ.</p>
<pre class="pseudo">class Compte
{
    private string titulaire;                                   // private = accessible SEULEMENT dans la classe
    private double solde;

    public Compte(string titulaire, double soldeInitial = 0)   // constructeur : MÊME nom que la classe, aucun type de retour
    {
        this.titulaire = titulaire;                            // range le paramètre dans l'attribut
        this.solde = Math.Max(0, soldeInitial);                // validation : jamais de solde négatif à la création
    }
}
Compte c = new Compte("Ana", 100);      // new déclenche le constructeur → objet créé ET initialisé d'un coup</pre>
<p>Le paramètre <code>soldeInitial = 0</code> a une valeur par défaut : <code>new Compte("Ana")</code> fonctionne aussi. En centralisant la validation dans le constructeur, on garantit qu'aucun compte ne peut naître dans un état incohérent.</p>

<h3>2. this : « moi, l'objet courant »</h3>
<p>Quand le paramètre et l'attribut portent le même nom (<code>titulaire</code>), <code>this.titulaire</code> désigne l'<strong>attribut</strong> de l'objet, et <code>titulaire</code> seul le <strong>paramètre</strong>. <code>this</code> lève l'ambiguïté (exactement comme en Java).</p>

<h3>3. Les PROPRIÉTÉS : la grande élégance C#</h3>
<p>En Java on écrivait des getters/setters verbeux (<code>getSolde()</code>, <code>setSolde()</code>). C# offre les <strong>propriétés</strong> : la syntaxe d'un attribut, mais avec du code de contrôle caché derrière.</p>
<pre class="pseudo">private double solde;                      // le champ réel, privé
public double Solde                        // la propriété publique associée
{
    get { return solde; }                  // le « get » s'exécute quand on LIT la propriété
    private set { solde = value; }          // le « set » s'exécute quand on ÉCRIT (ici privé : interne à la classe)
}
Console.WriteLine(c.Solde);               // se lit comme un attribut, mais appelle en réalité le get
// c.Solde = 50;   → REFUSÉ depuis l'extérieur car le set est private</pre>

<h3>4. Propriétés auto-implémentées</h3>
<pre class="pseudo">public string Titulaire { get; private set; }   // lecture publique, écriture réservée à la classe
public int Age { get; set; }                     // lecture ET écriture publiques
public double Tva { get; } = 0.21;               // lecture seule, avec une valeur par défaut</pre>
<div class="tip">Quand aucune validation n'est nécessaire, la forme courte <code>{ get; set; }</code> génère automatiquement le champ et les accès. Les propriétés donnent la simplicité d'un attribut (<code>c.Age</code>) AVEC le contrôle d'une méthode : le meilleur des deux mondes, plus élégant que les <code>getX()</code>/<code>setX()</code> de Java.</div>

<h3>5. Validation dans le setter</h3>
<pre class="pseudo">private int age;
public int Age
{
    get =&gt; age;                            // get court, en une expression
    set
    {
        if (value &gt;= 0) { age = value; }   // value = la valeur qu'on tente d'affecter ; on la refuse si négative
    }
}
c.Age = -5;    // le set rejette -5 : l'invariant « âge >= 0 » reste garanti</pre>
<p>Écrire la validation une seule fois dans le <code>set</code> la rend valable pour TOUS les usages de la propriété : impossible de contourner la règle depuis l'extérieur. C'est le cœur de l'<strong>encapsulation</strong> : protéger les données derrière un contrôle centralisé.</p>

<h3>6. ToString : l'affichage personnalisé</h3>
<pre class="pseudo">public override string ToString()          // override : on REDÉFINIT une méthode héritée
{
    return $"{titulaire} : {solde} €";     // décide comment l'objet se présente en texte
}
Console.WriteLine(c);        // affiche « Ana : 100 € » : ToString est appelé AUTOMATIQUEMENT</pre>
<div class="warn">Le mot-clé <code>override</code> est OBLIGATOIRE devant <code>ToString</code> en C# (Java ne l'exigeait pas). Il signale explicitement qu'on redéfinit la méthode <code>ToString</code> héritée de la classe de base <code>object</code>. Sans <code>override</code>, le compilateur refuse.</div>`,

    { type: "qcm", q: "public string Titulaire { get; private set; } signifie…", opts: ["Lecture interdite", "Lecture PUBLIQUE, écriture PRIVÉE : lisible partout, modifiable seulement dans la classe", "Tout public", "Tout privé"], a: 1, exp: "Le contrôle fin de l'accès, propriété par propriété." },

    { type: "qcm", q: "new Compte(\"Ana\", -500) avec Math.Max(0, ...) : solde initial ?", opts: ["-500", "0 : le constructeur valide — l'objet naît cohérent", "500", "Erreur"], a: 1, exp: "L'invariant posé dès la naissance." },
    { type: "qcm", q: "public double Tva { get; } = 0.21; est…", opts: ["Modifiable", "Une propriété en LECTURE SEULE avec valeur par défaut : une constante d'instance", "Un setter", "Une erreur"], a: 1, exp: "get sans set = lecture seule." },
    { type: "qcm", q: "Faut-il un getter ET un setter pour chaque champ ?", opts: ["Oui toujours", "Non : on n'expose QUE le nécessaire (Solde a un get public, un set privé)", "Jamais de getter", "Un seul au hasard"], a: 1, exp: "Minimalisme : chaque accès exposé est une responsabilité." },
    { type: "qcm", q: "<code>get => age;</code> (avec =>) est…", opts: ["Une erreur", "Un getter en corps EXPRESSION : raccourci de get { return age; }", "Une lambda", "Un setter"], a: 1, exp: "Le => concis des méthodes (leçon 8), appliqué aux propriétés." }
  ],
  final: {
    title: "Exercice final — La forteresse CompteBancaire (version C#)",
    intro: `<p>Version blindée avec propriétés :</p>
<pre class="pseudo">class Compte
{
    public string Titulaire { get; }
    public double Solde { get; private set; }

    public Compte(string titulaire, double soldeInitial)
    {
        Titulaire = titulaire;
        Solde = Math.Max(0, soldeInitial);
    }
    public void Deposer(double m)
    {
        if (m > 0) { Solde += m; }
    }
    public bool Retirer(double m)
    {
        if (m > 0 && m <= Solde) { Solde -= m; return true; }
        return false;
    }
    public override string ToString() => $"{Titulaire} : {Solde} €";
}</pre>`,
    questions: [
      { type: "input", q: "<code>new Compte(\"Ana\", -50)</code> : que vaut .Solde ?", a: "0", ph: "nombre", exp: "Math.Max(0, -50) = 0 : l'objet naît TOUJOURS cohérent." },
      { type: "qcm", q: "De l'extérieur, <code>c.Solde = 9999;</code> :", opts: ["Fonctionne", "Erreur : le set est PRIVATE — on ne modifie le solde que par Deposer/Retirer", "Warning", "Solde = 0"], a: 1, exp: "get public, set privé : lecture libre, écriture contrôlée." },
      { type: "qcm", q: "Compte c = new Compte(\"Ana\", 100); c.Retirer(40); c.Retirer(80); → solde et 2ᵉ retour ?", opts: ["-20 et true", "60 et false : le 2ᵉ retrait refusé (80 > 60)", "60 et true", "100 et false"], a: 1, exp: "100−40=60 ; 80 > 60 → false." },
      { type: "qcm", q: "Console.WriteLine(c) affiche « Ana : 60 € » grâce à…", opts: ["Un getter", "ToString() override, appelé automatiquement", "Le constructeur", "private"], a: 1, exp: "La carte d'identité affichable." },

    ],
    solution: `<pre class="pseudo">new Compte("Ana", -50) → Solde 0 (validé)
c.Solde = 9999          → interdit (set private)
Retirer(40) ✓ → 60 → Retirer(80) ✗ → 60
Console.WriteLine(c)    → "Ana : 60 €" (ToString override)

Propriétés C# = getters/setters Java, en plus élégant :
{ get; private set; } au lieu de deux méthodes verbeuses.</pre>
<p>L'encapsulation, façon C# : concise et blindée. Demain : héritage et polymorphisme.</p>`
