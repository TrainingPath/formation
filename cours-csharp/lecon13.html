<h3>1. Le constructeur : garantir un objet valide dès sa naissance</h3>
<p>Un <strong>constructeur</strong> est une méthode spéciale appelée automatiquement par <code>new</code>. Son rôle : initialiser les attributs de l'objet — et, souvent, vérifier qu'ils sont cohérents dès le départ.</p>
<pre class="pseudo">class Compte
{
    private string titulaire;                                   // private = accessible SEULEMENT dans la classe
    private double solde;

    public Compte(string titulaire, double soldeInitial = 0)   // constructeur : MÊME nom que la classe, aucun type de retour
    {
        this.titulaire = titulaire;                            // range le paramètre dans l'attribut
        this.solde = Math.Max(0, soldeInitial);                // validation : jamais de solde négatif à la création
    }
}
Compte c = new Compte("Ana", 100);      // new déclenche le constructeur → objet créé ET initialisé d'un coup</pre>
<p>Le paramètre <code>soldeInitial = 0</code> a une valeur par défaut : <code>new Compte("Ana")</code> fonctionne aussi. En centralisant la validation dans le constructeur, on garantit qu'aucun compte ne peut naître dans un état incohérent.</p>

<h3>2. this : « moi, l'objet courant »</h3>
<p>Quand le paramètre et l'attribut portent le même nom (<code>titulaire</code>), <code>this.titulaire</code> désigne l'<strong>attribut</strong> de l'objet, et <code>titulaire</code> seul le <strong>paramètre</strong>. <code>this</code> lève l'ambiguïté (exactement comme en Java).</p>

<h3>3. Les PROPRIÉTÉS : la grande élégance C#</h3>
<p>En Java on écrivait des getters/setters verbeux (<code>getSolde()</code>, <code>setSolde()</code>). C# offre les <strong>propriétés</strong> : la syntaxe d'un attribut, mais avec du code de contrôle caché derrière.</p>
<pre class="pseudo">private double solde;                      // le champ réel, privé
public double Solde                        // la propriété publique associée
{
    get { return solde; }                  // le « get » s'exécute quand on LIT la propriété
    private set { solde = value; }          // le « set » s'exécute quand on ÉCRIT (ici privé : interne à la classe)
}
Console.WriteLine(c.Solde);               // se lit comme un attribut, mais appelle en réalité le get
// c.Solde = 50;   → REFUSÉ depuis l'extérieur car le set est private</pre>

<h3>4. Propriétés auto-implémentées</h3>
<pre class="pseudo">public string Titulaire { get; private set; }   // lecture publique, écriture réservée à la classe
public int Age { get; set; }                     // lecture ET écriture publiques
public double Tva { get; } = 0.21;               // lecture seule, avec une valeur par défaut</pre>
<div class="tip">Quand aucune validation n'est nécessaire, la forme courte <code>{ get; set; }</code> génère automatiquement le champ et les accès. Les propriétés donnent la simplicité d'un attribut (<code>c.Age</code>) AVEC le contrôle d'une méthode : le meilleur des deux mondes, plus élégant que les <code>getX()</code>/<code>setX()</code> de Java.</div>

<h3>5. Validation dans le setter</h3>
<pre class="pseudo">private int age;
public int Age
{
    get =&gt; age;                            // get court, en une expression
    set
    {
        if (value &gt;= 0) { age = value; }   // value = la valeur qu'on tente d'affecter ; on la refuse si négative
    }
}
c.Age = -5;    // le set rejette -5 : l'invariant « âge >= 0 » reste garanti</pre>
<p>Écrire la validation une seule fois dans le <code>set</code> la rend valable pour TOUS les usages de la propriété : impossible de contourner la règle depuis l'extérieur. C'est le cœur de l'<strong>encapsulation</strong> : protéger les données derrière un contrôle centralisé.</p>

<h3>6. ToString : l'affichage personnalisé</h3>
<pre class="pseudo">public override string ToString()          // override : on REDÉFINIT une méthode héritée
{
    return $"{titulaire} : {solde} €";     // décide comment l'objet se présente en texte
}
Console.WriteLine(c);        // affiche « Ana : 100 € » : ToString est appelé AUTOMATIQUEMENT</pre>

<pre class="pseudo">class Compte
{
    public string Titulaire { get; }
    public double Solde { get; private set; }

    public Compte(string titulaire, double soldeInitial)
    {
        Titulaire = titulaire;
        Solde = Math.Max(0, soldeInitial);
    }
    public void Deposer(double m)
    {
        if (m > 0) { Solde += m; }
    }
    public bool Retirer(double m)
    {
        if (m > 0 && m <= Solde) { Solde -= m; return true; }
        return false;
    }
    public override string ToString() => $"{Titulaire} : {Solde} €";

      "solution": "// Le four à pain : un objet qui naît complet, et qui refuse ce qui l'abîmerait.\nusing System;\nusing System.Collections.Generic;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        // new appelle le constructeur : l'objet est créé ET rempli d'un seul geste.\n        Fournee f1 = new Fournee(\"Baguette tradition\", 80, 135);\n        Fournee f2 = new Fournee(\"Pain de campagne\", 24, 320);\n\n        // Le troisième paramètre a une valeur par défaut : on peut ne pas le donner.\n        Fournee f3 = new Fournee(\"Petit épeautre\", 12);\n\n        Console.WriteLine(\"LES TROIS FOURNÉES DU MATIN\");\n        Console.WriteLine(f1);          // ToString est appelé automatiquement par WriteLine\n        Console.WriteLine(f2);\n        Console.WriteLine(f3);\n\n        Console.WriteLine();\n\n        // Le set refuse les valeurs impossibles : l'objet reste cohérent quoi qu'on lui demande.\n        Console.WriteLine(\"CE QUE LA PROPRIÉTÉ REFUSE\");\n        Console.WriteLine($\"Quantité de baguettes avant la sottise : {f1.Quantite}\");\n        f1.Quantite = -10;              // refusé par le set : une quantité négative n'existe pas\n        Console.WriteLine($\"Après avoir tenté -10 : {f1.Quantite}\");\n        f2.Quantite = 200;              // refusé aussi : le four ne contient pas plus de 120 pièces\n        Console.WriteLine($\"Après avoir tenté 200 sur le pain de campagne : {f2.Quantite}\");\n\n        Console.WriteLine();\n\n        // Vendre repasse par la propriété : la règle est écrite une seule fois.\n        Console.WriteLine(\"LA VENTE DU MATIN\");\n        f1.Vendre(30);\n        Console.WriteLine($\"Trente baguettes vendues, il en reste {f1.Quantite}\");\n        f2.Vendre(30);                  // 24 - 30 = -6 : le set refuse, rien ne bouge\n        Console.WriteLine($\"Trente pains de campagne vendus sur 24 : il en reste {f2.Quantite}\");\n\n        Console.WriteLine();\n\n        // Cuissons ne s'écrit que par une méthode : de l'extérieur, elle est en lecture seule.\n        f3.Enfourner();\n        f3.Enfourner();\n        Console.WriteLine($\"L'épeautre est passé {f3.Cuissons} fois au four\");\n        Console.WriteLine($\"TVA appliquée à toutes les fournées : {f1.TvaPourcent} %\");\n\n        Console.WriteLine();\n\n        // Une liste d'objets se totalise sans jamais toucher aux champs privés.\n        List<Fournee> matinee = new List<Fournee>();\n        matinee.Add(f1);\n        matinee.Add(f2);\n        matinee.Add(f3);\n\n        int piecesTotal = 0;\n        int valeurTotale = 0;\n        foreach (Fournee f in matinee)\n        {\n            piecesTotal += f.Quantite;\n            valeurTotale += f.ValeurCentimes();\n        }\n\n        Console.WriteLine(\"BILAN DE LA MATINÉE\");\n        Console.WriteLine($\"Pièces restantes : {piecesTotal}\");\n        Console.WriteLine($\"Valeur du restant : {valeurTotale / 100.0:F2} €\");\n    }\n}\n\nclass Fournee\n{\n    private int quantite;                        // le champ réel, privé : inaccessible du dehors\n\n    public string Pain { get; private set; }     // lecture publique, écriture réservée à la classe\n    public int PrixCentimes { get; private set; }\n    public int Cuissons { get; private set; }\n    public int TvaPourcent { get; } = 6;         // lecture seule, valeur posée une fois pour toutes\n\n    // Constructeur : même nom que la classe, aucun type de retour.\n    public Fournee(string pain, int quantite, int prixCentimes = 100)\n    {\n        this.Pain = pain;                        // this.Pain = l'attribut, pain = le paramètre\n        this.PrixCentimes = Math.Max(0, prixCentimes);\n        this.Cuissons = 0;\n        this.Quantite = quantite;                // passe par le set : la validation joue dès la naissance\n    }\n\n    public int Quantite\n    {\n        get => quantite;                         // get court, en une seule expression\n        set\n        {\n            if (value >= 0 && value <= 120)      // value = la valeur qu'on tente d'affecter\n            {\n                quantite = value;\n            }\n        }\n    }\n\n    public int ValeurCentimes()\n    {\n        return quantite * PrixCentimes;\n    }\n\n    public void Vendre(int nombre)\n    {\n        Quantite = quantite - nombre;            // repasse par le set : impossible de creuser\n    }\n\n    public void Enfourner()\n    {\n        Cuissons = Cuissons + 1;                 // le set privé est accessible ici, dans la classe\n    }\n\n    public override string ToString()\n    {\n        return $\"{Pain} : {quantite} pièces à {PrixCentimes} c\";\n    }\n}",

      "enonce": "Un service communal suit cinq ruches. Écris une classe décrivant une ruche par son code, son emplacement, sa population et son stock de miel en grammes, plus l'année de son installation. Répartis les droits : le code et l'année ne s'écrivent qu'à la naissance, l'emplacement s'écrit librement — une ruche se déplace —, la population s'écrit sous condition (entre zéro et quatre-vingt mille), et le stock de miel ne s'écrit que par des méthodes. Ajoute : un test de faiblesse en dessous de quinze mille abeilles, une méthode d'essaimage qui retire des abeilles, une méthode de production qui ajoute du miel, une méthode de récolte qui vide la ruche <strong>et rend ce qu'elle contenait</strong>, et un affichage automatique d'une ligne. Installe : R-01 Verger du Nord, 42 000 abeilles, 2019 ; R-02 Toit de l'école, 12 500, 2021 ; R-03 Friche des Saules, 61 000, 2018 ; R-04 Jardin partagé, 8 000, 2022 ; R-05 Bord de Sambre, 33 500, 2020. Affiche le rucher, compte les faibles, donne la population totale, la moyenne par ruche et la plus peuplée. Fais produire 14 500, 3 200, 21 800, 1 500 et 9 600 grammes dans l'ordre, affiche le miel présent, récolte <strong>uniquement les ruches non faibles</strong> et affiche ce qui a été pris puis ce qui reste. Tente ensuite d'imposer moins cinq cents abeilles à R-04 et cent vingt mille à R-01, et réaffiche. Fais essaimer R-03 de vingt-cinq mille abeilles, déplace R-02 à la Cour du presbytère, puis classe le rucher par population décroissante et affiche le classement numéroté.",
      "sousQuestions": [
        {
          "ref": "a",
          "texte": "Combien de ruches sont faibles, laquelle est la plus peuplée, et quelle quantité de miel la récolte rapporte-t-elle ?"

          "texte": "Pourquoi la tentative d'imposer cent vingt mille abeilles n'affiche-t-elle aucun message d'erreur, alors qu'elle n'aboutit pas ?"
        },
        {
          "ref": "c",
          "texte": "Que se passe-t-il si tu ranges la population directement dans le champ privé depuis le constructeur, au lieu de passer par la propriété ? Essaie avec une ruche à moins mille abeilles."
        },

          "ref": "d",
          "texte": "L'emplacement s'écrit librement, la population non. Cette différence est-elle un caprice, ou peux-tu la justifier par le métier ?"

      "reflexion": "La récolte vide la ruche et rend le contenu dans le même geste. Écris ce qui arriverait si tu la coupais en deux méthodes — une pour lire, une pour vider — et si un jour quelqu'un appelait la première deux fois. Puis cherche dans ton programme un autre endroit où deux opérations doivent impérativement rester soudées.",
      "principe": "Encapsuler n'est pas tout fermer : c'est décider, information par information, qui a le droit d'écrire quoi. Certaines données changent librement, d'autres sous condition, d'autres seulement par une opération qui a un nom métier.",
      "remarque": "Le classement final n'échange que des ruches entières, comme à la leçon 12. Ce qui est nouveau, c'est qu'une ruche déplacée dans la liste ne peut pas être abîmée au passage : ses champs sont privés, et l'échange ne manipule que des références.",
      "indices": [
        "Fais la liste des cinq informations et, pour chacune, réponds à une seule question : qui a le droit de l'écrire, et quand ? Tu obtiendras quatre réponses différentes, et ces quatre réponses sont exactement les quatre formes d'écriture de propriété que la leçon te donne. La conception est finie avant la première ligne de code.",
        "Le plan : la classe avec son champ privé, ses cinq propriétés et ses cinq méthodes ; puis le programme — installation, affichage, comptages, miellée, récolte sélective, ordres absurdes, essaimage, déplacement, tri, classement.",
        "Écris d'abord la classe avec des propriétés courtes partout, sans aucune validation, et fais tourner le programme. Ajoute ensuite le champ privé et le <code>set</code> conditionnel pour la seule population, et refais tourner : les deux ordres absurdes cessent d'avoir un effet, et rien d'autre ne change. Tu verras ainsi précisément ce que la validation apporte, et ce qu'elle coûte.",
        "Le point dur est la récolte sélective. Elle appelle une méthode qui modifie l'objet <em>pendant</em> que la boucle le parcourt, et elle utilise sa valeur de retour. Range le contenu dans une variable locale, remets le stock à zéro, puis rends la variable : dans cet ordre, et pas un autre. Vérifie ton résultat par le calcul — ce qui est pris plus ce qui reste doit valoir ce qui a été produit.",
        "Ton fichier ressemble à ceci :<br><code>class Ruche</code><br><code>{</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;private int …;</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public string Code { get; private set; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public string Emplacement { get; set; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public int AnneeInstallation { get; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public Ruche(string …, string …, int …, int …)</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;{ this.… = …; this.Population = …; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public int Population</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;{ get =&gt; …; set { if (value &gt;= 0 &amp;&amp; value &lt;= …) { … = value; } } }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public int Recolter()</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;{ int pris = …; … = 0; return pris; }</code><br><code>}</code><br><code>rucher.Add(new Ruche(\"R-01\", \"…\", 42000, …));</code><br><code>if (!r.EstFaible()) { recolte += r.Recolter(); }</code><br><code>if (rucher[j].Population &lt; rucher[j + …].Population)</code>"
      ],
      "solution": "// Le rucher municipal : ce qui peut changer de l'extérieur, et ce qui ne le peut pas.\nusing System;\nusing System.Collections.Generic;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        // Le constructeur exige les quatre informations : aucune ruche ne naît incomplète.\n        List<Ruche> rucher = new List<Ruche>();\n        rucher.Add(new Ruche(\"R-01\", \"Verger du Nord\", 42000, 2019));\n        rucher.Add(new Ruche(\"R-02\", \"Toit de l'école\", 12500, 2021));\n        rucher.Add(new Ruche(\"R-03\", \"Friche des Saules\", 61000, 2018));\n        rucher.Add(new Ruche(\"R-04\", \"Jardin partagé\", 8000, 2022));\n        rucher.Add(new Ruche(\"R-05\", \"Bord de Sambre\", 33500, 2020));\n\n        Console.WriteLine(\"LE RUCHER AU PRINTEMPS\");\n        foreach (Ruche r in rucher)\n        {\n            Console.WriteLine(r);\n        }\n\n        Console.WriteLine();\n\n        // Les faibles se comptent par une méthode de l'objet, pas par un test recopié partout.\n        int faibles = 0;\n        foreach (Ruche r in rucher)\n        {\n            if (r.EstFaible())\n            {\n                faibles++;\n            }\n        }\n        Console.WriteLine($\"Ruches faibles : {faibles} sur {rucher.Count}\");\n\n        int populationTotale = 0;\n        Ruche plusPeuplee = rucher[0];\n        foreach (Ruche r in rucher)\n        {\n            populationTotale += r.Population;\n            if (r.Population > plusPeuplee.Population)\n            {\n                plusPeuplee = r;\n            }\n        }\n        Console.WriteLine($\"Population totale : {populationTotale} abeilles\");\n        Console.WriteLine($\"Moyenne par ruche : {populationTotale / rucher.Count} abeilles\");\n        Console.WriteLine($\"La plus peuplée : {plusPeuplee.Code} au {plusPeuplee.Emplacement}\");\n\n        Console.WriteLine();\n\n        // La miellée : Produire est la SEULE porte d'entrée vers le stock de miel.\n        Console.WriteLine(\"LA MIELLÉE\");\n        rucher[0].Produire(14500);\n        rucher[1].Produire(3200);\n        rucher[2].Produire(21800);\n        rucher[3].Produire(1500);\n        rucher[4].Produire(9600);\n\n        int mielTotal = 0;\n        foreach (Ruche r in rucher)\n        {\n            mielTotal += r.MielGrammes;\n        }\n        Console.WriteLine($\"Miel présent dans le rucher : {mielTotal / 1000.0:F1} kg\");\n\n        int recolte = 0;\n        foreach (Ruche r in rucher)\n        {\n            if (!r.EstFaible())\n            {\n                recolte += r.Recolter();       // Recolter vide la ruche ET rend ce qu'elle contenait\n            }\n        }\n        Console.WriteLine($\"Récolté sur les ruches fortes : {recolte / 1000.0:F1} kg\");\n\n        int restant = 0;\n        foreach (Ruche r in rucher)\n        {\n            restant += r.MielGrammes;\n        }\n        Console.WriteLine($\"Laissé aux ruches faibles : {restant / 1000.0:F1} kg\");\n\n        Console.WriteLine();\n\n        // Ce que la propriété refuse, elle le refuse sans un mot.\n        Console.WriteLine(\"DEUX ORDRES ABSURDES\");\n        rucher[3].Population = -500;\n        Console.WriteLine($\"{rucher[3].Code} après un ordre de -500 : {rucher[3].Population}\");\n        rucher[0].Population = 120000;\n        Console.WriteLine($\"{rucher[0].Code} après un ordre de 120000 : {rucher[0].Population}\");\n\n        Console.WriteLine();\n\n        // L'essaimage, lui, passe par une méthode qui décrit une opération réelle.\n        rucher[2].Essaimer(25000);\n        Console.WriteLine($\"{rucher[2].Code} après essaimage : {rucher[2].Population} abeilles\");\n\n        // L'emplacement est modifiable de l'extérieur : déplacer une ruche est une opération légitime.\n        rucher[1].Emplacement = \"Cour du presbytère\";\n        Console.WriteLine($\"{rucher[1].Code} déplacée : {rucher[1].Emplacement}\");\n\n        Console.WriteLine();\n\n        // Un seul échange par permutation : une ruche entière se déplace d'un bloc.\n        for (int i = 0; i < rucher.Count - 1; i++)\n        {\n            for (int j = 0; j < rucher.Count - 1 - i; j++)\n            {\n                if (rucher[j].Population < rucher[j + 1].Population)\n                {\n                    Ruche aux = rucher[j];\n                    rucher[j] = rucher[j + 1];\n                    rucher[j + 1] = aux;\n                }\n            }\n        }\n\n        Console.WriteLine(\"CLASSEMENT PAR POPULATION\");\n        for (int i = 0; i < rucher.Count; i++)\n        {\n            Console.WriteLine($\"{i + 1}. {rucher[i]}\");\n        }\n    }\n}\n\nclass Ruche\n{\n    private int population;                            // le champ réel, gardé derrière la propriété\n\n    public string Code { get; private set; }           // un code de ruche ne change jamais\n    public string Emplacement { get; set; }            // une ruche, en revanche, se déplace\n    public int MielGrammes { get; private set; }       // se remplit et se vide par des méthodes\n    public int AnneeInstallation { get; }              // lecture seule, fixée à la construction\n\n    public Ruche(string code, string emplacement, int population, int anneeInstallation)\n    {\n        this.Code = code;\n        this.Emplacement = emplacement;\n        this.AnneeInstallation = anneeInstallation;\n        this.MielGrammes = 0;\n        this.Population = population;                  // passe par le set : validée dès la naissance\n    }\n\n    public int Population\n    {\n        get => population;\n        set\n        {\n            if (value >= 0 && value <= 80000)\n            {\n                population = value;\n            }\n        }\n    }\n\n    public bool EstFaible()\n    {\n        return population < 15000;\n    }\n\n    public void Essaimer(int nombre)\n    {\n        Population = population - nombre;               // la validation joue aussi ici\n    }\n\n    public void Produire(int grammes)\n    {\n        if (grammes > 0)\n        {\n            MielGrammes = MielGrammes + grammes;\n        }\n    }\n\n    public int Recolter()\n    {\n        int pris = MielGrammes;\n        MielGrammes = 0;\n        return pris;\n    }\n\n    public override string ToString()\n    {\n        return $\"{Code} ({AnneeInstallation}) — {Emplacement} — {population} abeilles — \"\n             + $\"{MielGrammes} g de miel\";\n    }\n}",
      "reponses": [
        {
          "ref": "a",
          "texte": "Deux ruches sont faibles : R-02 avec 12 500 abeilles et R-04 avec 8 000, toutes deux sous le seuil de quinze mille. La plus peuplée est R-03, à la Friche des Saules, avec 61 000 abeilles — pour une population totale de 157 000 et une moyenne de 31 400. La récolte porte sur les trois ruches fortes et rapporte 45,9 kg ; les 4,7 kg des deux faibles leur sont laissés, ce qui fait bien les 50,6 kg produits."
        },
        {
          "ref": "b",
          "texte": "Parce que le <code>set</code> ne fait qu'une chose : il teste la valeur, et il range si le test réussit. Quand le test échoue, il n'y a pas de branche <code>else</code> — donc rien ne se passe, et « rien » ne s'affiche pas. L'objet est protégé, mais l'appelant repart avec la conviction que son ordre a été exécuté. C'est un mensonge par omission, et c'est le prix de cette forme de validation."

          "texte": "La ruche naît avec moins mille abeilles et le programme l'accepte : le champ privé n'est protégé que par le <code>set</code>, et le constructeur vient de le court-circuiter. Elle sera comptée comme faible, elle ne sera pas récoltée, et le total de population sera faussé de mille. Le contrôle n'existe que si tout le monde y passe, y compris — et surtout — le code de la classe elle-même."
        },
        {
          "ref": "d",
          "texte": "Elle se justifie entièrement. Déplacer une ruche est une opération que le service fait vraiment, et aucune valeur d'emplacement n'est absurde en soi : le programme n'a rien à vérifier. Une population, en revanche, obéit à la biologie — elle n'est jamais négative, et une colonie de cent vingt mille abeilles n'existe pas dans une ruche de ce type. La règle du choix est là : on encapsule ce qui a des contraintes, pas ce qui est simplement modifiable."

      ],
      "pourquoi": "Les cinq informations d'une ruche ont cinq statuts différents, et la leçon 12 les traitait toutes de la même façon : publiques, modifiables par n'importe qui. Décider information par information est un travail de conception, pas de syntaxe — et c'est ce travail qui rend le programme difficile à casser de l'extérieur.",

        "Ton classement commence-t-il par R-01 et finit-il par R-04 ? R-03 doit être deuxième après l'essaimage.",

      ],
      "note": "Tu viens d'écrire une classe dont les invariants tiennent — sauf par le constructeur, si tu l'écris mal. C'est le paradoxe de l'encapsulation : le seul code qui puisse la trahir est celui de la classe. D'où l'habitude, prise aujourd'hui, de faire passer même le constructeur par ses propres propriétés."
    },
    {
      "num": "13.3",
      "titre": "Le camping des Quatre Vents — 1/4",
      "niveau": 3,
      "domaine": "camping",
      "serie": {
        "nom": "Le camping des Quatre Vents",
        "jour": 1,
        "sur": 4
      },
      "enonce": "Premier jour d'une série de quatre : le camping des Quatre Vents, qui va grandir jusqu'à vendredi. Aujourd'hui, une seule sorte d'emplacement. Écris une classe portant le numéro, le secteur, le type de couchage et le tarif d'une nuit en centimes, plus l'état occupé ou libre. Numéro, secteur et type ne s'écrivent qu'à la naissance ; le tarif est gardé par une propriété qui refuse le négatif et tout ce qui dépasse deux cents euros ; l'état ne change que par deux méthodes, réserver et libérer — réserver un emplacement déjà occupé ne fait rien. Ajoute un test qui dit si l'emplacement est au bord de l'eau, c'est-à-dire dans le secteur Rivière, et un affichage automatique d'une ligne portant le numéro, le secteur, la vue, le type, le tarif en euros et l'état. Le constructeur reçoit le type en dernier, avec « tente » par défaut. Ouvre le camping : n° 5 Chênes 24,00 € caravane ; n° 6 Chênes 24,00 € caravane ; n° 12 Verger 24,00 € chalet ; n° 18 Verger 20,00 € tente ; n° 23 Rivière 14,00 € caravane ; n° 24 Rivière 14,00 € tente ; n° 31 Rivière 12,00 € <strong>sans préciser le type</strong> ; n° 37 Rivière 9,00 € tente ; et enfin n° 14 Verger à <strong>2 500,00 €</strong>, une faute de frappe de l'accueil. Affiche le camping et la recette d'une nuit à guichet plein. Réserve les emplacements d'indice 0, 2, 4, 7 et 8, puis tente de réserver le premier une seconde fois et montre l'état obtenu. Affiche le nombre d'occupés, de libres, le taux d'occupation en pourcentage entier et la recette de la nuit. Compte les emplacements au bord de l'eau, cherche le plus cher et le moins cher par le motif du champion provisoire, puis libère l'emplacement d'indice 2 et réaffiche-le.",
      "principe": "Un emplacement de camping est un objet dont plusieurs règles doivent tenir en permanence : un tarif plausible, un état cohérent, une identité fixe. Le constructeur les installe, les propriétés les maintiennent, et le reste du programme n'a plus à y penser.",
      "reflexion": "L'emplacement à 2 500 € est refusé, donc créé à zéro, donc réservé à zéro, et il entre dans la recette de la nuit sans y ajouter un centime. Suis cette chaîne dans ton programme et dis à quel endroit précis un être humain aurait pu être averti. Puis dis ce que le programme aurait dû faire à cet endroit-là — tu viens de décrire la leçon 16.",
      "remarque": "Le type de couchage n'est aujourd'hui qu'un texte décoratif : il s'affiche et ne fait rien. Les tarifs sont donnés à la main, un par un, ce qui est déjà pénible pour neuf emplacements et deviendrait intenable pour un camping entier. Demain, le type cessera d'être un mot pour devenir un comportement.",
      "indices": [
        "Regarde ce que l'emplacement doit garantir, et non ce qu'il doit contenir. Trois garanties : son identité ne bouge jamais, son tarif reste dans une fourchette plausible, et son état ne se modifie que par deux gestes nommés. Chacune se traduit par une forme d'écriture précise — c'est tout le travail de la journée.",
        "Le plan : la classe avec son champ privé de tarif, ses quatre propriétés, son constructeur à quatre paramètres dont le dernier a une valeur par défaut, et ses quatre méthodes ; puis le programme — l'ouverture du camping, la recette à guichet plein, les réservations, la réservation refusée, les comptages, le bord de l'eau, les deux champions, la libération.",
        "Traite l'état occupé comme la quantité de l'exercice 1 : un accès en lecture publique, un accès en écriture réservé à la classe, et deux méthodes au nom clair qui sont les seules à s'en servir. Le programme principal ne doit jamais pouvoir écrire vrai ou faux là-dedans directement — c'est la différence entre « l'emplacement est occupé » et « quelqu'un a décrété qu'il l'était ».",
        "Le point dur est le neuvième emplacement. Son tarif est refusé par le <code>set</code>, mais l'objet est construit quand même : le constructeur ne s'interrompt pas, il continue et laisse le champ à sa valeur initiale, c'est-à-dire zéro. Vérifie-le en affichant le camping avant toute réservation — un emplacement à 0,00 € doit apparaître. Ce n'est pas un défaut de ton code : c'est exactement ce que la validation silencieuse produit, et c'est le sujet du reste de la série.",
        "Ton fichier ressemble à ceci :<br><code>class Emplacement</code><br><code>{</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;private int …;</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public int Numero { get; private set; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public bool Occupe { get; private set; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public Emplacement(int …, string …, int …, string … = \"tente\")</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;{ this.… = …; this.TarifCentimes = …; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public int TarifCentimes</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;{ get =&gt; …; private set { if (value &gt;= 0 &amp;&amp; value &lt;= …) { … = value; } } }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public void Reserver() { if (!Occupe) { … = true; } }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public bool EstAuBordDeLEau() { return … == \"Rivière\"; }</code><br><code>}</code><br><code>camping.Add(new Emplacement(31, \"Rivière\", …));</code><br><code>Console.WriteLine($\"Taux d'occupation : {occupes * 100 / …} %\");</code>"
      ],
      "solution": "// Le camping des Quatre Vents, jour 1 : l'emplacement naît complet et se défend tout seul.\nusing System;\nusing System.Collections.Generic;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        List<Emplacement> camping = new List<Emplacement>();\n        camping.Add(new Emplacement(5, \"Chênes\", 2400, \"caravane\"));\n        camping.Add(new Emplacement(6, \"Chênes\", 2400, \"caravane\"));\n        camping.Add(new Emplacement(12, \"Verger\", 2400, \"chalet\"));\n        camping.Add(new Emplacement(18, \"Verger\", 2000, \"tente\"));\n        camping.Add(new Emplacement(23, \"Rivière\", 1400, \"caravane\"));\n        camping.Add(new Emplacement(24, \"Rivière\", 1400, \"tente\"));\n        camping.Add(new Emplacement(31, \"Rivière\", 1200));       // type omis : « tente » par défaut\n        camping.Add(new Emplacement(37, \"Rivière\", 900, \"tente\"));\n\n        // Un tarif absurde : le set le refuse, et l'emplacement naît quand même — à zéro.\n        camping.Add(new Emplacement(14, \"Verger\", 250000, \"chalet\"));\n\n        Console.WriteLine(\"LE CAMPING AVANT L'OUVERTURE\");\n        foreach (Emplacement e in camping)\n        {\n            Console.WriteLine(e);\n        }\n\n        Console.WriteLine();\n\n        int valeurNuitee = 0;\n        foreach (Emplacement e in camping)\n        {\n            valeurNuitee += e.TarifCentimes;\n        }\n        Console.WriteLine($\"Recette d'une nuit à guichet plein : {valeurNuitee / 100.0:F2} €\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"LES RÉSERVATIONS DU JOUR\");\n        camping[0].Reserver();\n        camping[2].Reserver();\n        camping[4].Reserver();\n        camping[7].Reserver();\n        camping[8].Reserver();                        // l'emplacement à zéro part comme les autres\n\n        // Deux fois le même emplacement : le refus est total, et parfaitement muet.\n        Console.WriteLine($\"Emplacement 5 occupé ? {camping[0].Occupe}\");\n        camping[0].Reserver();\n        Console.WriteLine($\"Après une seconde réservation du même : {camping[0].Occupe}\");\n\n        Console.WriteLine();\n\n        int occupes = 0;\n        int recette = 0;\n        foreach (Emplacement e in camping)\n        {\n            if (e.Occupe)\n            {\n                occupes++;\n                recette += e.TarifCentimes;\n            }\n        }\n        Console.WriteLine($\"Emplacements occupés : {occupes} sur {camping.Count}\");\n        Console.WriteLine($\"Emplacements libres : {camping.Count - occupes}\");\n        Console.WriteLine($\"Taux d'occupation : {occupes * 100 / camping.Count} %\");\n        Console.WriteLine($\"Recette de la nuit : {recette / 100.0:F2} €\");\n\n        Console.WriteLine();\n\n        int bordDeLEau = 0;\n        foreach (Emplacement e in camping)\n        {\n            if (e.EstAuBordDeLEau())\n            {\n                bordDeLEau++;\n            }\n        }\n        Console.WriteLine($\"Emplacements au bord de l'eau : {bordDeLEau}\");\n\n        Emplacement plusCher = camping[0];\n        Emplacement moinsCher = camping[0];\n        foreach (Emplacement e in camping)\n        {\n            if (e.TarifCentimes > plusCher.TarifCentimes)\n            {\n                plusCher = e;\n            }\n            if (e.TarifCentimes < moinsCher.TarifCentimes)\n            {\n                moinsCher = e;\n            }\n        }\n        Console.WriteLine($\"Le plus cher : {plusCher}\");\n        Console.WriteLine($\"Le moins cher : {moinsCher}\");\n\n        Console.WriteLine();\n\n        // Libérer remet l'emplacement à la disposition du camping : une seule règle, un seul endroit.\n        camping[2].Liberer();\n        Console.WriteLine($\"Emplacement 12 après départ : {camping[2]}\");\n    }\n}\n\nclass Emplacement\n{\n    private int tarifCentimes;                       // le champ réel, protégé par sa propriété\n\n    public int Numero { get; private set; }          // un emplacement ne change jamais de numéro\n    public string Secteur { get; private set; }\n    public string Type { get; private set; }\n    public bool Occupe { get; private set; }         // ne s'écrit que par Reserver et Liberer\n\n    public Emplacement(int numero, string secteur, int tarifCentimes, string type = \"tente\")\n    {\n        this.Numero = numero;\n        this.Secteur = secteur;\n        this.Type = type;\n        this.Occupe = false;\n        this.TarifCentimes = tarifCentimes;          // passe par le set : validé dès la naissance\n    }\n\n    public int TarifCentimes\n    {\n        get => tarifCentimes;\n        private set\n        {\n            if (value >= 0 && value <= 20000)        // au-delà de 200 € la nuit, c'est une faute de frappe\n            {\n                tarifCentimes = value;\n            }\n        }\n    }\n\n    public bool EstAuBordDeLEau()\n    {\n        return Secteur == \"Rivière\";\n    }\n\n    public void Reserver()\n    {\n        if (!Occupe)                                 // deux fois le même emplacement : refusé, en silence\n        {\n            Occupe = true;\n        }\n    }\n\n    public void Liberer()\n    {\n        Occupe = false;\n    }\n\n    public override string ToString()\n    {\n        string etat = \"libre\";\n        if (Occupe)\n        {\n            etat = \"occupé\";\n        }\n        string vue = \"sans vue\";\n        if (EstAuBordDeLEau())\n        {\n            vue = \"bord de l'eau\";\n        }\n        return $\"N° {Numero} secteur {Secteur} ({vue}) — {Type} — \"\n             + $\"{tarifCentimes / 100.0:F2} € la nuit — {etat}\";\n    }\n}",
      "pourquoi": "La série démarre sur une classe volontairement simple, mais déjà protégée. Les trois jours suivants vont l'étendre sans jamais revenir sur ces garanties : ce qui est posé aujourd'hui — identité fixe, tarif contrôlé, état sous clé — restera vrai vendredi, quel que soit le nombre de sortes d'emplacements. C'est à cela que sert une base bien fermée.",
      "checklist": [
        "La recette à guichet plein vaut-elle 141,00 € ? L'emplacement de l'accueil y pèse zéro.",
        "As-tu bien 5 occupés, 4 libres, 55 % d'occupation et 71,00 € de recette ?",
        "Le compte des emplacements au bord de l'eau donne-t-il 4 ?",
        "Ton emplacement le moins cher est-il le n° 14 ? Si tu obtiens le n° 37, ton champion provisoire compare mal.",
        "Le septième emplacement affiche-t-il « tente » alors que tu ne l'as pas écrit ?"
      ],
      "note": "Jour 1 sur 4. Neuf emplacements, une classe, aucune surprise — c'est fait exprès. Garde ce fichier : demain, les trois types de couchage cesseront d'être un texte et deviendront trois classes, et tu partiras de ce que tu as écrit aujourd'hui."
    }
  ]
};

    solution: "using System;                                    // accès à Console\n\nclass CompteBancaire                             // la classe métier\n{                                                // début de la classe\n    public double Solde { get; private set; }    // propriété : lecture publique, écriture réservée à la classe\n\n    public CompteBancaire(double soldeInitial)   // constructeur : appelé par new\n    {                                            // début du constructeur\n        Solde = soldeInitial;                    // initialise la propriété\n    }                                            // fin du constructeur\n\n    public void Deposer(double montant)          // méthode publique de dépôt\n    {                                            // début de Deposer\n        Solde += montant;                        // ajoute le montant au solde\n    }                                            // fin de Deposer\n\n    public void Retirer(double montant)          // méthode de retrait avec contrôle\n    {                                            // début de Retirer\n        if (montant > Solde)                     // retrait supérieur au solde disponible ?\n            Console.WriteLine(\"Refusé : solde insuffisant\"); // refus, le solde ne bouge pas\n        else                                     // sinon le retrait est possible\n            Solde -= montant;                    // retire le montant\n    }                                            // fin de Retirer\n}                                                // fin de CompteBancaire\n\nclass Programme                                  // classe de test séparée\n{                                                // début de la classe\n    static void Main()                           // point d'entrée du programme\n    {                                            // début de Main\n        CompteBancaire c = new CompteBancaire(100); // crée un compte avec 100 €\n        c.Deposer(50);                           // solde : 150\n        c.Retirer(30);                           // solde : 120\n        c.Retirer(500);                          // refusé : 500 > 120, message affiché\n        Console.WriteLine($\"Solde final : {c.Solde} €\"); // lecture de la propriété : 120\n    }                                            // fin de Main\n}                                                // fin de Programme",
