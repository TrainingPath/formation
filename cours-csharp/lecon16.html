<h3>1. Qu'est-ce qu'une exception ?</h3>
<p>Tu en as déjà croisé : <code>IndexOutOfRangeException</code> (leçon 7), <code>NullReferenceException</code> (leçon 12)… Une <strong>exception</strong> est un objet-signal <em>lancé</em> quand une opération rencontre une situation anormale (texte non convertible, division par zéro, fichier absent…). Si personne ne la traite, elle remonte jusqu'en haut et fait planter le programme.</p>

<h3>2. try / catch : surveiller et réagir</h3>
<pre class="pseudo">try
{                                          // le bloc « try » entoure le code RISQUÉ
    int n = int.Parse(saisie);            // peut lancer FormatException si saisie n'est pas un nombre
    Console.WriteLine(100 / n);           // peut lancer DivideByZeroException si n vaut 0
}
catch (FormatException)                    // ce catch se déclenche UNIQUEMENT pour une FormatException
{
    Console.WriteLine("Ce n'est pas un nombre !");
}
catch (DivideByZeroException)              // celui-ci UNIQUEMENT pour une division par zéro
{
    Console.WriteLine("Division par zéro !");
}
Console.WriteLine("La vie continue");     // après avoir géré l'erreur, le programme SURVIT et poursuit</pre>
<p>Dès qu'une ligne du <code>try</code> lance une exception, le reste du <code>try</code> est abandonné et C# saute au <code>catch</code> du bon type. Chaque <code>catch</code> attrape SON type d'exception.</p>

<h3>3. finally : le nettoyage garanti</h3>
<pre class="pseudo">try { /* code risqué */ }
catch (Exception e) { Console.WriteLine(e.Message); }   // e.Message = le texte décrivant l'erreur
finally { /* exécuté DANS TOUS LES CAS, exception ou non : fermer un fichier, libérer une ressource... */ }</pre>
<p>Le bloc <code>finally</code> s'exécute quoi qu'il arrive : c'est l'endroit idéal pour libérer ce qui doit l'être (fermer un fichier, une connexion), qu'une erreur soit survenue ou non.</p>

<h3>4. Lancer soi-même : throw</h3>
<pre class="pseudo">public void Retirer(double m)
{
    if (m &gt; solde)                          // règle métier violée : on retire plus que le solde
    {
        throw new ArgumentException($"Solde insuffisant : {solde}");  // on LANCE une exception avec un message
    }
    solde -= m;                             // atteint seulement si la règle est respectée
}</pre>
<p><code>throw</code> permet de signaler activement une erreur : au lieu de continuer avec des données incohérentes, la méthode interrompt et prévient l'appelant. Tes validations deviennent ainsi des signaux impossibles à ignorer.</p>

<h3>5. Le grand classique : sécuriser une saisie</h3>
<pre class="pseudo">int age;
while (true)                                            // boucle « jusqu'à obtenir une saisie valide »
{
    Console.WriteLine("Ton âge ?");
    if (int.TryParse(Console.ReadLine(), out age)) { break; }  // conversion réussie → on sort de la boucle
    Console.WriteLine("Nombre invalide !");             // sinon on redemande
}</pre>
<div class="tip">En C#, <code>int.TryParse</code> (leçon 4) évite souvent le try/catch pour les conversions : il renvoie un <code>bool</code> au lieu de lancer une exception. Règle pratique : réserve les exceptions à l'<strong>imprévisible</strong> (fichier absent, réseau coupé…) et utilise <code>TryParse</code> pour le <strong>prévisible</strong> (une saisie utilisateur peut évidemment être erronée).</div>

<h3>6. Ne jamais avaler une exception</h3>
<pre class="pseudo">catch (Exception) { }        // INTERDIT : l'erreur est avalée en silence → un bug deviendra introuvable
catch (Exception e) { Console.WriteLine(e.Message); }   // au minimum : TRACER le message</pre>

ole.WriteLine($\"Impossible : {e.Message}\");\n            }\n        }\n\n        int restants = 0;\n        int poidsRestant = 0;\n        foreach (Colis c in rayon)\n        {\n            if (!c.Retire)\n            {\n                restants++;\n                poidsRestant += c.PoidsGrammes;\n            }\n        }\n        Console.WriteLine($\"Colis restants : {restants} · {poidsRestant / 1000.0:F2} kg\");\n\n        Console.WriteLine();\n\n        // Le prévisible : une saisie fautive se teste, elle ne se rattrape pas.\n        Console.WriteLine(\"RÉPARTITION DES 120 CASIERS\");\n        string[] saisies = { \"3\", \"deux\", \"0\", \"-1\", \"7\" };\n        int lues = 0;\n        int reussies = 0;\n        int illisibles = 0;\n        int impossibles = 0;\n\n        foreach (string saisie in saisies)\n        {\n            try\n            {\n                int rangees;\n                if (!int.TryParse(saisie, out rangees))    // TryParse ne lance rien : il répond\n                {\n                    illisibles++;\n                    Console.WriteLine($\"« {saisie} » n'est pas un nombre — rien à calculer\");\n                    continue;\n                }\n                Console.WriteLine($\"{rangees} rangées : {120 / rangees} casiers par rangée\");\n                reussies++;\n            }\n            catch (DivideByZeroException e)                // l'imprévisible, lui, se rattrape\n            {\n                impossibles++;\n                Console.WriteLine($\"Découpe impossible : {e.Message}\");\n            }\n            finally\n            {\n                lues++;                                    // exécuté à tous les tours, sans exception\n            }\n        }\n        Console.WriteLine($\"Saisies lues : {lues} · réussies : {reussies} · \"\n                        + $\"illisibles : {illisibles} · impossibles : {impossibles}\");\n\n        Console.WriteLine();\n\n        // La même saisie fautive, traitée par une conversion qui lance : plus long, plus lourd.\n        Console.WriteLine(\"LA MÊME CHOSE AVEC UNE CONVERSION QUI LANCE\");\n        foreach (string saisie in saisies)\n        {\n            try\n            {\n                int rangees = int.Parse(saisie);           // lance une FormatException sur « deux »\n                Console.WriteLine($\"{rangees} rangées : {120 / rangees} casiers par rangée\");\n            }\n            catch (FormatException)\n            {\n                Console.WriteLine($\"« {saisie} » : conversion impossible\");\n            }\n            catch (DivideByZeroException)\n            {\n                Console.WriteLine($\"« {saisie} » : division par zéro\");\n            }\n        }\n\n        Console.WriteLine();\n        Console.WriteLine(\"Le point relais a fermé sans planter une seule fois.\");\n    }\n\n    static Colis Chercher(List<Colis> rayon, string code)\n    {\n        foreach (Colis c in rayon)\n        {\n            if (c.Code == code)\n            {\n                return c;\n            }\n        }\n        throw new ArgumentException($\"aucun colis au code {code}\");\n    }\n}\n\nclass Colis\n{\n    public string Code { get; private set; }\n    public int PoidsGrammes { get; private set; }\n    public bool Retire { get; private set; }\n\n    public Colis(string code, int poidsGrammes)\n    {\n        if (code.Length != 6)\n        {\n            throw new ArgumentException($\"code « {code} » : six caractères attendus\");\n        }\n        if (poidsGrammes <= 0)\n        {\n            throw new ArgumentException($\"code {code} : poids de {poidsGrammes} g impossible\");\n        }\n        this.Code = code;\n        this.PoidsGrammes = poidsGrammes;\n        this.Retire = false;\n    }\n\n    public void Retirer()\n    {\n        if (Retire)\n        {\n            throw new ArgumentException($\"le colis {Code} a déjà été retiré\");\n        }\n        Retire = true;\n    }\n\n    public override string ToString()\n       "solution": "// Le convertisseur de recettes : deux fautes différentes, deux catch différents.\nusing System;\nusing System.Collections.Generic;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        const int PREVU_POUR = 4;\n\n        // Le fichier de la recette, simulé pour que la sortie soit toujours la même.\n        string[] lignes =\n        {\n            \"farine:250:g\",\n            \"sucre:120:g\",\n            \"oeufs:3:piece\",\n            \"lait:abc:ml\",\n            \"beurre:-40:g\",\n            \"sel:2\",\n            \"levure:11:g\"\n        };\n\n        List<Ingredient> recette = new List<Ingredient>();\n        int luesEnTout = 0;\n        int illisibles = 0;\n        int invalides = 0;\n\n        Console.WriteLine(\"LECTURE DE LA RECETTE\");\n        foreach (string ligne in lignes)\n        {\n            try\n            {\n                recette.Add(Analyser(ligne));\n                Console.WriteLine($\"Retenu : {ligne}\");\n            }\n            catch (FormatException e)          // le nombre n'était pas un nombre\n            {\n                illisibles++;\n                Console.WriteLine($\"Illisible : {e.Message}\");\n            }\n            catch (ArgumentException e)        // le nombre était un nombre, mais un mauvais\n            {\n                invalides++;\n                Console.WriteLine($\"Invalide : {e.Message}\");\n            }\n            finally\n            {\n                luesEnTout++;                  // le compteur du journal ne rate aucune ligne\n            }\n        }\n        Console.WriteLine($\"Lignes lues : {luesEnTout} · retenues : {recette.Count} · \"\n                        + $\"illisibles : {illisibles} · invalides : {invalides}\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"CONVERSION POUR 6 PERSONNES\");\n        int grammes = 0;\n        foreach (Ingredient i in recette)\n        {\n            int converti = i.PourConvives(6, PREVU_POUR);\n            Console.WriteLine($\"{i.Nom} : {converti} {i.Unite}\");\n            if (i.Unite == \"g\")\n            {\n                grammes += converti;\n            }\n        }\n        Console.WriteLine($\"Masse sèche totale : {grammes} g\");\n\n        Console.WriteLine();\n\n        // Une règle métier signalée AVANT que l'arithmétique ne casse.\n        Console.WriteLine(\"DEUX DEMANDES ABSURDES\");\n        try\n        {\n            recette[0].PourConvives(0, PREVU_POUR);\n        }\n        catch (ArgumentException e)\n        {\n            Console.WriteLine($\"Refusé : {e.Message}\");\n        }\n\n        try\n        {\n            recette[0].PourConvives(6, 0);\n        }\n        catch (ArgumentException e)\n        {\n            Console.WriteLine($\"Refusé : {e.Message}\");\n        }\n\n        Console.WriteLine();\n\n        // Et la même absurdité laissée à l'arithmétique : le message n'aide plus personne.\n        Console.WriteLine(\"SANS LA RÈGLE MÉTIER, C'EST LA DIVISION QUI PARLE\");\n        string[] convives = { \"4\", \"0\", \"six\", \"6\" };\n        foreach (string saisie in convives)\n        {\n            int nombre;\n            if (!int.TryParse(saisie, out nombre))\n            {\n                Console.WriteLine($\"« {saisie} » n'est pas un nombre de convives\");\n                continue;\n            }\n            try\n            {\n                Console.WriteLine($\"{nombre} convives : {recette[0].Quantite / nombre} g de \"\n                                + \"farine par personne\");\n            }\n            catch (DivideByZeroException e)\n            {\n                Console.WriteLine($\"Calcul impossible pour {nombre} convives : {e.Message}\");\n            }\n        }\n\n        Console.WriteLine();\n        Console.WriteLine($\"La recette tient debout avec {recette.Count} ingrédients sur \"\n                        + $\"{lignes.Length} lignes de fichier.\");\n    }\n\n    // Une seule fonction d'analyse : elle lance, elle ne devine pas.\n    static Ingredient Analyser(string ligne)\n    {\n        string[] parts = ligne.Split(':');\n        if (parts.Length != 3)\n        {\n            throw new ArgumentException($\"« {ligne} » : trois champs attendus, {parts.Length} \"\n                                      + \"trouvés\");\n        }\n        int quantite = int.Parse(parts[1]);      // lance une FormatException si ce n'est pas un nombre\n        return new Ingredient(parts[0], quantite, parts[2]);\n    }\n}\n\nclass Ingredient\n{\n    public string Nom { get; private set; }\n    public int Quantite { get; private set; }\n    public string Unite { get; private set; }\n\n    public Ingredient(string nom, int quantite, string unite)\n    {\n        if (quantite <= 0)\n        {\n            throw new ArgumentException($\"« {nom} » : quantité de {quantite} impossible\");\n        }\n        this.Nom = nom;\n        this.Quantite = quantite;\n        this.Unite = unite;\n    }\n\n    public int PourConvives(int convives, int prevuPour)\n    {\n        if (convives <= 0)\n        {\n            throw new ArgumentException($\"on ne cuisine pas pour {convives} personnes\");\n        }\n        if (prevuPour <= 0)\n        {\n            throw new ArgumentException($\"une recette prévue pour {prevuPour} personnes n'existe \"\n                                      + \"pas\");\n        }\n        return Quantite * convives / prevuPour;\n    }\n\n    public override string ToString()\n    {\n        return $\"{Nom} : {Quantite} {Unite}\";\n    }\n}",

      "solution": "// Le camping des Quatre Vents, jour 4 : le refus silencieux de lundi prend enfin la parole.\nusing System;\nusing System.Collections.Generic;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        List<Emplacement> camping = new List<Emplacement>();\n        camping.Add(new Caravane(5, \"Chênes\", 10));\n        camping.Add(new Caravane(6, \"Chênes\", 6));\n        camping.Add(new Chalet(12, \"Verger\", 4));\n        camping.Add(new Tente(18, \"Verger\"));\n        camping.Add(new Caravane(23, \"Rivière\", 10));\n        camping.Add(new Tente(24, \"Rivière\"));\n        camping.Add(new Tente(31, \"Rivière\"));\n        camping.Add(new Tente(37, \"Rivière\"));\n        camping.Add(new Chalet(14, \"Verger\", 6));\n\n        Console.WriteLine(\"DEUX CRÉATIONS QUE L'ACCUEIL A TENTÉES\");\n        try\n        {\n            camping.Add(new Chalet(50, \"Verger\", 0));      // un chalet sans couchage\n        }\n        catch (ArgumentException e)\n        {\n            Console.WriteLine($\"Création refusée : {e.Message}\");\n        }\n\n        try\n        {\n            camping.Add(new Caravane(51, \"Chênes\", 32));   // 32 ampères : hors norme du camping\n        }\n        catch (ArgumentException e)\n        {\n            Console.WriteLine($\"Création refusée : {e.Message}\");\n        }\n        Console.WriteLine($\"Emplacements ouverts : {camping.Count}\");\n\n        Console.WriteLine();\n\n        int recetteMax = 0;\n        foreach (Emplacement e in camping)\n        {\n            recetteMax += e.TarifNuitCentimes();\n        }\n        Console.WriteLine($\"Recette d'une nuit à guichet plein : {recetteMax / 100.0:F2} €\");\n\n        Console.WriteLine();\n\n        // Les demandes du jour, simulées pour que le corrigé donne toujours la même sortie.\n        string[] demandes = { \"5\", \"12\", \"23\", \"37\", \"14\", \"5\", \"99\", \"douze\" };\n\n        Console.WriteLine(\"LES DEMANDES DU JOUR\");\n        int journal = 0;\n        int acceptees = 0;\n        int refusees = 0;\n        int illisibles = 0;\n\n        foreach (string demande in demandes)\n        {\n            try\n            {\n                int numero;\n                if (!int.TryParse(demande, out numero))    // le prévisible se teste\n                {\n                    illisibles++;\n                    Console.WriteLine($\"« {demande} » n'est pas un numéro d'emplacement\");\n                    continue;\n                }\n                Emplacement voulu = Chercher(camping, numero);   // lance si le numéro est inconnu\n                voulu.Reserver();                                // lance si déjà occupé\n                acceptees++;\n                Console.WriteLine($\"N° {numero} réservé — {voulu.TarifNuitCentimes() / 100.0:F2} €\");\n            }\n            catch (ArgumentException e)                    // l'anormal se rattrape ET s'explique\n            {\n                refusees++;\n                Console.WriteLine($\"Demande rejetée : {e.Message}\");\n            }\n            finally\n            {\n                journal++;                                 // le registre de l'accueil ne rate rien\n            }\n        }\n        Console.WriteLine($\"Demandes portées au registre : {journal} · acceptées : {acceptees} · \"\n                        + $\"rejetées : {refusees} · illisibles : {illisibles}\");\n\n        Console.WriteLine();\n\n        int occupes = 0;\n        int recette = 0;\n        foreach (Emplacement e in camping)\n        {\n            if (e.Occupe)\n            {\n                occupes++;\n                recette += e.TarifNuitCentimes();\n            }\n        }\n        Console.WriteLine($\"Emplacements occupés : {occupes} sur {camping.Count}\");\n        Console.WriteLine($\"Taux d'occupation : {occupes * 100 / camping.Count} %\");\n        Console.WriteLine($\"Recette de la nuit : {recette / 100.0:F2} €\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"UN DÉPART, PUIS LE MÊME DÉPART\");\n        try\n        {\n            Chercher(camping, 12).Liberer();\n            Console.WriteLine(\"N° 12 libéré\");\n            Chercher(camping, 12).Liberer();\n            Console.WriteLine(\"N° 12 libéré une seconde fois\");\n        }\n        catch (ArgumentException e)\n        {\n            Console.WriteLine($\"Départ impossible : {e.Message}\");\n        }\n\n        Console.WriteLine();\n\n        // Les deux contrats de la veille n'ont pas bougé d'une ligne.\n        int amperesTotal = 0;\n        int aBrancher = 0;\n        int enLigne = 0;\n        foreach (Emplacement e in camping)\n        {\n            if (e is IElectrifiable el)\n            {\n                amperesTotal += el.Amperes();\n                aBrancher++;\n            }\n            if (e is IReservableEnLigne)\n            {\n                enLigne++;\n            }\n        }\n        Console.WriteLine($\"Ampérage à provisionner : {amperesTotal} A sur {aBrancher} \"\n                        + \"emplacements\");\n        Console.WriteLine($\"Emplacements réservables en ligne : {enLigne}\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"RECETTE MOYENNE PAR CAMPEUR\");\n        string[] campeurs = { \"23\", \"0\" };\n        foreach (string saisie in campeurs)\n        {\n            int nombre;\n            if (!int.TryParse(saisie, out nombre))\n            {\n                continue;\n            }\n            try\n            {\n                Console.WriteLine($\"{nombre} campeurs : {recette / nombre / 100.0:F2} € chacun\");\n            }\n            catch (DivideByZeroException e)\n            {\n                Console.WriteLine($\"Moyenne impossible pour {nombre} campeurs : {e.Message}\");\n            }\n        }\n\n        Console.WriteLine();\n        Console.WriteLine(\"Le camping a fermé son registre sans qu'un seul refus reste muet.\");\n    }\n\n    static Emplacement Chercher(List<Emplacement> camping, int numero)\n    {\n        foreach (Emplacement e in camping)\n        {\n            if (e.Numero == numero)\n            {\n                return e;\n            }\n        }\n        throw new ArgumentException($\"aucun emplacement ne porte le n° {numero}\");\n    }\n}\n\nabstract class Emplacement\n{\n    public int Numero { get; private set; }\n    public string Secteur { get; private set; }\n    public bool Occupe { get; private set; }\n\n    public Emplacement(int numero, string secteur)\n    {\n        if (numero <= 0)\n        {\n            throw new ArgumentException($\"numéro d'emplacement {numero} impossible\");\n        }\n        this.Numero = numero;\n        this.Secteur = secteur;\n        this.Occupe = false;\n    }\n\n    public bool EstAuBordDeLEau()\n    {\n        return Secteur == \"Rivière\";\n    }\n\n    protected int SupplementVueCentimes()\n    {\n        if (EstAuBordDeLEau())\n        {\n            return 300;\n        }\n        return 0;\n    }\n\n    public abstract int TarifNuitCentimes();\n    public abstract string Categorie();\n\n    public virtual string Reglement()\n    {\n        return \"silence de 22 h à 7 h\";\n    }\n\n    // Lundi ce refus était muet ; il annonce maintenant ce qu'il refuse et pourquoi.\n    public void Reserver()\n    {\n        if (Occupe)\n        {\n            throw new ArgumentException($\"le n° {Numero} est déjà occupé\");\n        }\n        Occupe = true;\n    }\n\n    public void Liberer()\n    {\n        if (!Occupe)\n        {\n            throw new ArgumentException($\"le n° {Numero} est déjà libre\");\n        }\n        Occupe = false;\n    }\n\n    public override string ToString()\n    {\n        string etat = \"libre\";\n        if (Occupe)\n        {\n            etat = \"occupé\";\n        }\n        return $\"N° {Numero} secteur {Secteur} — {Categorie()} — \"\n             + $\"{TarifNuitCentimes() / 100.0:F2} € la nuit — {etat}\";\n    }\n}\n\ninterface IElectrifiable\n{\n    int Amperes();\n    string Branchement();\n}\n\ninterface IReservableEnLigne\n{\n    string CodeReservation();\n}\n\nclass Tente : Emplacement, IReservableEnLigne\n{\n    public Tente(int numero, string secteur) : base(numero, secteur)\n    {\n    }\n\n    public override int TarifNuitCentimes()\n    {\n        return SupplementVueCentimes() + 900;\n    }\n\n    public override string Categorie()\n    {\n        return \"tente\";\n    }\n\n    public override string Reglement()\n    {\n        return base.Reglement() + \" · aucun véhicule sur l'herbe\";\n    }\n\n    public string CodeReservation()\n    {\n        return $\"WEB-T{Numero}\";\n    }\n}\n\nclass Caravane : Emplacement, IElectrifiable\n{\n    private int amperes;\n\n    public Caravane(int numero, string secteur, int amperes) : base(numero, secteur)\n    {\n        if (amperes < 4 || amperes > 16)\n        {\n            throw new ArgumentException($\"n° {numero} : {amperes} A hors norme du camping\");\n        }\n        this.amperes = amperes;\n    }\n\n    public override int TarifNuitCentimes()\n    {\n        return SupplementVueCentimes() + 1400 + amperes * 50;\n    }\n\n    public override string Categorie()\n    {\n        return $\"caravane {amperes} A\";\n    }\n\n    public override string Reglement()\n    {\n        return base.Reglement() + \" · groupe électrogène interdit\";\n    }\n\n    public int Amperes()\n    {\n        return amperes;\n    }\n\n    public string Branchement()\n    {\n        return $\"N° {Numero} : borne {amperes} A à réarmer\";\n    }\n}\n\nclass Chalet : Emplacement, IElectrifiable, IReservableEnLigne\n{\n    private int couchages;\n\n    public Chalet(int numero, string secteur, int couchages) : base(numero, secteur)\n    {\n        if (couchages < 1 || couchages > 8)\n        {\n            throw new ArgumentException($\"n° {numero} : {couchages} couchages impossibles\");\n        }\n        this.couchages = couchages;\n    }\n\n    public override int TarifNuitCentimes()\n    {\n        return SupplementVueCentimes() + 2000 + couchages * 100;\n    }\n\n    public override string Categorie()\n    {\n        return $\"chalet {couchages} couchages\";\n    }\n\n    public override string Reglement()\n    {\n        return base.Reglement() + \" · état des lieux au départ\";\n    }\n\n    public int Amperes()\n    {\n        return 16;\n    }\n\n    public string Branchement()\n    {\n        return $\"N° {Numero} : tableau intérieur 16 A\";\n    }\n\n    public string CodeReservation()\n    {\n        return $\"WEB-C{Numero}\";\n    }\n}",
      "pourquoi": "Le même camping, la même recette, les mêmes neuf emplacements — et la réceptionniste sait enfin ce qui s'est passé. Lundi, le n° 5 redemandé ne produisait rien du tout ; aujourd'hui, il produit une ligne de registre, un compteur de rejets et une phrase lisible. La valeur ajoutée de la semaine ne se mesure pas au programme, qui calcule la même chose : elle se mesure à ce qu'il est désormais capable de raconter.",
