var DAY = {
  num: 16,
  title: "Les exceptions",
  subtitle: "Quand ça tourne mal : détecter, attraper, réagir proprement.",
  theory: `
<h3>1. Qu'est-ce qu'une exception ?</h3>
<p>Tu en as déjà croisé : <code>IndexOutOfRangeException</code> (leçon 7), <code>NullReferenceException</code> (leçon 12)… Une <strong>exception</strong> est un objet-signal <em>lancé</em> quand une opération rencontre une situation anormale (texte non convertible, division par zéro, fichier absent…). Si personne ne la traite, elle remonte jusqu'en haut et fait planter le programme.</p>

<h3>2. try / catch : surveiller et réagir</h3>
<pre class="pseudo">try
{                                          // le bloc « try » entoure le code RISQUÉ
    int n = int.Parse(saisie);            // peut lancer FormatException si saisie n'est pas un nombre
    Console.WriteLine(100 / n);           // peut lancer DivideByZeroException si n vaut 0
}
catch (FormatException)                    // ce catch se déclenche UNIQUEMENT pour une FormatException
{
    Console.WriteLine("Ce n'est pas un nombre !");
}
catch (DivideByZeroException)              // celui-ci UNIQUEMENT pour une division par zéro
{
    Console.WriteLine("Division par zéro !");
}
Console.WriteLine("La vie continue");     // après avoir géré l'erreur, le programme SURVIT et poursuit</pre>
<p>Dès qu'une ligne du <code>try</code> lance une exception, le reste du <code>try</code> est abandonné et C# saute au <code>catch</code> du bon type. Chaque <code>catch</code> attrape SON type d'exception.</p>

<h3>3. finally : le nettoyage garanti</h3>
<pre class="pseudo">try { /* code risqué */ }
catch (Exception e) { Console.WriteLine(e.Message); }   // e.Message = le texte décrivant l'erreur
finally { /* exécuté DANS TOUS LES CAS, exception ou non : fermer un fichier, libérer une ressource... */ }</pre>
<p>Le bloc <code>finally</code> s'exécute quoi qu'il arrive : c'est l'endroit idéal pour libérer ce qui doit l'être (fermer un fichier, une connexion), qu'une erreur soit survenue ou non.</p>

<h3>4. Lancer soi-même : throw</h3>
<pre class="pseudo">public void Retirer(double m)
{
    if (m &gt; solde)                          // règle métier violée : on retire plus que le solde
    {
        throw new ArgumentException($"Solde insuffisant : {solde}");  // on LANCE une exception avec un message
    }
    solde -= m;                             // atteint seulement si la règle est respectée
}</pre>
<p><code>throw</code> permet de signaler activement une erreur : au lieu de continuer avec des données incohérentes, la méthode interrompt et prévient l'appelant. Tes validations deviennent ainsi des signaux impossibles à ignorer.</p>

<h3>5. Le grand classique : sécuriser une saisie</h3>
<pre class="pseudo">int age;
while (true)                                            // boucle « jusqu'à obtenir une saisie valide »
{
    Console.WriteLine("Ton âge ?");
    if (int.TryParse(Console.ReadLine(), out age)) { break; }  // conversion réussie → on sort de la boucle
    Console.WriteLine("Nombre invalide !");             // sinon on redemande
}</pre>
<div class="tip">En C#, <code>int.TryParse</code> (leçon 4) évite souvent le try/catch pour les conversions : il renvoie un <code>bool</code> au lieu de lancer une exception. Règle pratique : réserve les exceptions à l'<strong>imprévisible</strong> (fichier absent, réseau coupé…) et utilise <code>TryParse</code> pour le <strong>prévisible</strong> (une saisie utilisateur peut évidemment être erronée).</div>

<h3>6. Ne jamais avaler une exception</h3>
<pre class="pseudo">catch (Exception) { }        // INTERDIT : l'erreur est avalée en silence → un bug deviendra introuvable
catch (Exception e) { Console.WriteLine(e.Message); }   // au minimum : TRACER le message</pre>
<div class="warn">Exceptions courantes : <code>FormatException</code> (Parse raté), <code>DivideByZeroException</code> (÷0 entier), <code>IndexOutOfRangeException</code> (débordement de tableau), <code>NullReferenceException</code> (objet null), <code>ArgumentException</code> (argument invalide). Le <code>Message</code> et la <code>StackTrace</code> indiquent l'erreur et la ligne exacte : prends toujours le temps de les lire, ils te disent où et pourquoi ça a cassé.</div>`,
  exercises: [
    { type: "qcm", q: "Une exception non attrapée…", opts: ["Un avertissement", "Arrête le programme avec la StackTrace affichée", "Rien", "Un redémarrage"], a: 1, exp: "Lis la StackTrace : elle donne la ligne fautive." },
    { type: "qcm", q: "Le bloc try contient…", opts: ["La réaction", "Le code RISQUÉ à surveiller", "La fermeture des fichiers", "Les usings"], a: 1, exp: "try = essaie ; catch = si ça éclate, réagis." },
    { type: "qcm", q: "Si aucune exception n'éclate dans le try, le catch…", opts: ["S'exécute quand même", "Est ignoré", "S'exécute à moitié", "Plante"], a: 1, exp: "Le filet ne sert que si on tombe." },
    { type: "qcm", q: "int.Parse(\"abc\") lance…", opts: ["DivideByZeroException", "FormatException", "NullReferenceException", "Rien"], a: 1, exp: "Le texte→nombre raté." },
    { type: "qcm", q: "int x = 10 / 0; lance…", opts: ["FormatException", "DivideByZeroException : division ENTIÈRE par zéro", "OutOfMemory", "Rien"], a: 1, exp: "Le cas limite du jour 30 (nb=0 !) devient concret." },
    { type: "qcm", q: "finally s'exécute…", opts: ["Seulement après une exception", "Seulement sans exception", "TOUJOURS : exception ou pas", "Jamais"], a: 2, exp: "Le nettoyage garanti." },
    { type: "qcm", q: "throw new ArgumentException(...) sert à…", opts: ["Attraper", "LANCER soi-même une exception quand une règle métier est violée", "Ignorer", "Créer un objet normal"], a: 1, exp: "Tes validations promues en signaux." },
    { type: "qcm", q: "Un catch VIDE est une faute car…", opts: ["Il ralentit", "L'erreur est avalée en silence : le programme continue avec des données fausses", "Il ne compile pas", "Il double l'exception"], a: 1, exp: "Toujours au moins tracer." },
    { type: "qcm", q: "Pour convertir une SAISIE utilisateur, C# préfère souvent…", opts: ["int.Parse + try/catch", "int.TryParse : retourne un bool, pas d'exception à gérer", "Convert sans test", "(int)"], a: 1, exp: "TryParse pour le prévisible ; try/catch pour l'imprévisible." },
    { type: "qcm", q: "Deux catch (FormatException puis DivideByZeroException). L'utilisateur tape « 0 », on calcule 100/n. Quel catch ?", opts: ["Le premier", "Le second : \"0\" se parse bien, c'est la division qui explose", "Les deux", "Aucun"], a: 1, exp: "Chaque catch attrape SON type." },
    { type: "qcm", q: "catch (Exception e) attrape…", opts: ["Seulement NullReference", "Presque tout (Exception est la classe mère) — pratique mais moins précis", "Rien", "Les erreurs de compilation"], a: 1, exp: "L'héritage (leçon 14) s'applique aux exceptions." },
    { type: "qcm", q: "try/catch attrape-t-il les erreurs de COMPILATION (; oublié) ?", opts: ["Oui", "Non : la compilation précède l'exécution — try/catch ne concerne que l'exécution", "Parfois", "Avec finally"], a: 1, exp: "Grammaire (compilation) ≠ imprévu (exécution)." },
    { type: "qcm", q: "e.Message dans un catch donne…", opts: ["La ligne", "Le MESSAGE embarqué (ex : « Solde insuffisant : 60 »)", "Le fichier", "true"], a: 1, exp: "Le message que le throw a rédigé." },
    { type: "qcm", q: "Après un catch exécuté, le programme…", opts: ["S'arrête", "Reprend APRÈS le try/catch et continue", "Recommence le try", "Saute à Main"], a: 1, exp: "Survivre à l'imprévu ; pour réessayer : la boucle autour." },
    { type: "vf", q: "Prévenir (if) et guérir (try/catch) sont complémentaires : on valide le prévisible, on attrape l'imprévisible.", a: true, exp: "if pour les règles connues, exception pour fichier disparu, réseau coupé…" }
  ],
  final: {
    title: "Exercice final — Le distributeur blindé (version C#)",
    intro: `<p>Le distributeur combine tout :</p>
<pre class="pseudo">Compte c = new Compte("Ana", 100);
bool ok = false;
while (!ok)
{
    try
    {
        Console.WriteLine("Montant à retirer ?");
        double m = double.Parse(Console.ReadLine());   // (1)
        c.Retirer(m);                                  // (2) peut throw
        ok = true;
        Console.WriteLine("Billets distribués !");
    }
    catch (FormatException)
    {
        Console.WriteLine("Tape un NOMBRE.");
    }
    catch (ArgumentException e)
    {
        Console.WriteLine($"Refus : {e.Message}");
    }
    finally
    {
        Console.WriteLine("--- fin de tentative ---");  // (3)
    }
}</pre>
<p>Retirer() lance ArgumentException(« Solde insuffisant ») si m > solde. Saisies : « abc », « 150 », « 60 ».</p>`,
    questions: [
      { type: "qcm", q: "Saisie « abc » : que se passe-t-il ?", opts: ["Distribution", "FormatException au (1) → « Tape un NOMBRE. » → finally → reboucle", "ArgumentException", "Plantage"], a: 1, exp: "double.Parse échoue, le catch adapté réagit." },
      { type: "qcm", q: "Saisie « 150 » :", opts: ["Distribution", "Parse OK, mais Retirer THROW → « Refus : Solde insuffisant » → reboucle", "FormatException", "finally sauté"], a: 1, exp: "L'exception métier de Compte remonte au catch de Main." },
      { type: "qcm", q: "Combien de fois « --- fin de tentative --- » au total ?", opts: ["1", "2", "3 : finally s'exécute à CHAQUE tour", "0"], a: 2, exp: "abc, 150, 60 : trois tentatives, trois finally." },
      { type: "input", q: "Après « 60 », que vaut le solde ?", a: "40", ph: "nombre", exp: "100 − 60 = 40, ok = true libère la boucle." },
      { type: "qcm", q: "Pourquoi Retirer() LANCE une exception plutôt que retourner false ?", opts: ["false interdit", "L'exception PORTE un message précis et ne peut être ignorée par mégarde — un false oublié passe inaperçu", "Plus court", "Aucune différence"], a: 1, exp: "Deux styles valides ; l'exception force le traitement. À toi de choisir selon le contexte." }
    ],
    solution: `<pre class="pseudo">"abc" → FormatException → message → finally
"150" → Retirer THROW ArgumentException → refus → finally
"60"  → retrait OK, solde 40, ok=true → finally → sortie

Règle vit dans Compte (throw), réaction dans Main (catch),
persévérance dans la boucle. C# : TryParse pour le prévisible,
exceptions pour l'imprévisible.</pre>
<p>Prévenir, lancer, attraper, nettoyer : ton programme ne craint plus rien. Demain : les fichiers.</p>`
  }
};
