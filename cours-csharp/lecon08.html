  subtitle: "Les fonctions des jours 20-21, en C# (static comme Java).",
  theory: `
<h3>1. Une méthode : donner un nom à un bloc réutilisable</h3>
<p>Une <strong>méthode</strong> (l'équivalent d'une « fonction ») regroupe des instructions sous un nom, avec d'éventuels <strong>paramètres</strong> (les données qu'elle reçoit) et une <strong>valeur de retour</strong> (le résultat qu'elle renvoie). On évite ainsi de répéter du code.</p>
<pre class="pseudo">PSEUDOCODE                    C#
FONCTION carre(x) : ENTIER     static int Carre(int x)   // static int = renvoie un int ; (int x) = reçoit un int
    RETOURNER x * x            {                          // début du corps
FIN                                return x * x;          // return RENVOIE le résultat à l'appelant
                              }                          // fin de la méthode</pre>
<ul>
<li><code>int</code> avant le nom : le type de la valeur de <strong>RETOUR</strong>.</li>
<li><code>return</code> = RETOURNER : renvoie une valeur et termine la méthode.</li>
<li>Chaque paramètre est typé : <code>(int a, int b)</code>.</li>
<li>Nom en <strong>PascalCase</strong> : <code>Carre</code> (majuscule ! différence avec Java).</li>
</ul>

<h3>2. Procédure → void (ne renvoie rien)</h3>
<pre class="pseudo">static void AfficherLigne(int n)                     // void = ne RENVOIE aucune valeur (elle agit, c'est tout)
{
    for (int i = 0; i &lt; n; i++) { Console.Write("-"); } // affiche n tirets sur la même ligne
    Console.WriteLine();                             // passe à la ligne suivante
}</pre>
<p><code>void</code> signifie « pas de valeur de retour » : la méthode <em>fait</em> quelque chose (afficher, modifier…) mais ne renvoie rien à récupérer.</p>

<h3>3. Structure complète : définir puis appeler</h3>
<pre class="pseudo">class Program
{
    static void Main(string[] args)
    {
        int r = Carre(4);                 // APPEL : on passe 4, la méthode renvoie 16, rangé dans r
        Console.WriteLine(Max2(r, 20));   // on appelle Max2 avec 16 et 20 → affiche 20
        AfficherLigne(10);                // appel d'une méthode void (aucune valeur à récupérer)
    }
    static int Carre(int x) =&gt; x * x;      // corps EXPRESSION (=&gt;) : raccourci pour « return x * x; »
    static int Max2(int a, int b)
    {
        return a &gt; b ? a : b;              // renvoie le plus grand (ternaire : si a > b alors a sinon b)
    }
    static void AfficherLigne(int n) { /* ... */ }
}</pre>
<p><strong>Définir</strong> une méthode ne l'exécute pas ; il faut l'<strong>appeler</strong> par son nom en fournissant les arguments. La flèche <code>=&gt;</code> permet d'écrire une méthode d'une seule expression de façon compacte.</p>

<h3>4. Passage par valeur</h3>
<pre class="pseudo">static void Doubler(int n) { n *= 2; }    // n est une COPIE de l'argument ; la modifier n'affecte que la copie
int x = 5;
Doubler(x);                               // on passe une copie de x (5)
Console.WriteLine(x);                      // affiche 5 : l'original n'a PAS changé</pre>
<p>Comme Java : un type simple (int, double…) est <strong>copié</strong> lors de l'appel, donc la méthode ne peut pas modifier la variable d'origine. Un <strong>tableau</strong>, lui, passe sa référence (la méthode peut modifier son contenu). C# ajoute <code>ref</code> et <code>out</code> pour passer un type simple par référence si besoin.</p>

<h3>5. Tous les chemins doivent retourner</h3>
<pre class="pseudo">static int Signe(int n)
{
    if (n &gt; 0) { return 1; }               // renvoie 1 seulement si n > 0…
    // ERREUR de compilation : « not all code paths return a value »
    // …mais si n &lt;= 0, aucune valeur n'est renvoyée : le compilateur refuse
}</pre>
<div class="tip">Comme Java, C# vérifie à la COMPILATION que TOUS les cas renvoient bien une valeur. Ce type de bug (oublier un cas) est donc impossible à livrer : il faut couvrir tous les chemins (ajouter un <code>return</code> final, par exemple).</div>

<h3>6. Paramètres par défaut et surcharge</h3>
<pre class="pseudo">static int Puissance(int b, int e = 2) =&gt; (int)Math.Pow(b, e);   // e = 2 : valeur PAR DÉFAUT si non fournie
Puissance(5)      → 25      // e vaut 2 (défaut) : 5^2
Puissance(2, 10)  → 1024    // e vaut 10 : 2^10
// SURCHARGE : plusieurs méthodes de même nom, distinguées par leurs paramètres
static int Max2(int a, int b) =&gt; a &gt; b ? a : b;               // version pour deux int
static double Max2(double a, double b) =&gt; a &gt; b ? a : b;      // version pour deux double</pre>
<p>Un <strong>paramètre par défaut</strong> rend un argument optionnel. La <strong>surcharge</strong> permet de réutiliser un nom pour des types différents : le compilateur choisit la bonne version selon les arguments fournis.</p>`,

<pre class="pseudo">static int Carre(int x) => x * x;
static int Max2(int a, int b) => a > b ? a : b;
static double Moyenne(int[] t)

}

      "solution": "// L'atelier de sérigraphie : donner un nom à ce qu'on écrit deux fois.\nusing System;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        AfficherTitre(\"ATELIER DE SÉRIGRAPHIE\", 22);\n\n        int[] tirages = { 40, 120, 15, 250, 80 };\n\n        Console.WriteLine(\"Devis par commande :\");\n        for (int i = 0; i < tirages.Length; i++)\n        {\n            int prix = PrixCentimes(tirages[i]);\n            Console.WriteLine($\"  {tirages[i]} pièces → {prix} c \"\n                              + $\"(soit {prix / 100.0:F2} €)\");\n        }\n\n        AfficherLigne(40);\n\n        Console.WriteLine($\"Total du carnet : {Total(tirages)} pièces\");\n        Console.WriteLine($\"Plus grosse commande : {Maximum(tirages)} pièces\");\n        Console.WriteLine($\"Commandes au-delà de 100 : {CompterAuDela(tirages, 100)}\");\n\n        AfficherLigne(40);\n\n        // Une méthode à valeur par défaut : le second argument est facultatif.\n        Console.WriteLine($\"Aire d'un cadre 30 × 30 : {Aire(30)} cm²\");\n        Console.WriteLine($\"Aire d'un cadre 30 × 45 : {Aire(30, 45)} cm²\");\n\n        // Deux méthodes de même nom, distinguées par leurs paramètres.\n        Console.WriteLine($\"Encre pour 1 couleur : {Encre(200)} ml\");\n        Console.WriteLine($\"Encre pour 3 couleurs : {Encre(200, 3)} ml\");\n\n        AfficherLigne(40);\n\n        // Le passage par valeur : la méthode reçoit une COPIE.\n        int stock = 500;\n        Consommer(stock);\n        Console.WriteLine($\"Stock après un appel qui prétend le réduire : {stock}\");\n\n        // Un tableau, lui, passe sa référence : la méthode modifie l'original.\n        int[] compteurs = { 1, 1, 1 };\n        Doubler(compteurs);\n        Console.WriteLine($\"Compteurs après passage dans la méthode : \"\n                          + $\"{compteurs[0]}, {compteurs[1]}, {compteurs[2]}\");\n\n        AfficherLigne(40);\n        Console.WriteLine($\"Signe de -12 : {Signe(-1       "principe": "Découper un programme en méthodes ne change pas ce qu'il fait : cela change ce qu'on peut en faire ensuite. La seule preuve qu'un découpage est réussi est que la sortie reste identique au caractère près — tout le reste, lisibilité comprise, est un pari sur l'avenir.",

      "remarque": "Le nombre de cycles est obtenu par une division plafonnée : au poids on ajoute la capacité diminuée de un, puis on divise. La formule est correcte et parfaitement illisible pour qui ne la connaît pas — c'est exactement le genre de calcul qui mérite un nom. Une fois appelée « cycles pour ce poids », elle n'a plus besoin d'être comprise à chaque lecture.",
      "indices": [
        "Écris d'abord la version en vrac, entièrement, et fais-la fonctionner. Ne cherche pas à deviner le découpage avant : on découpe un programme qui marche, jamais un programme qu'on est en train d'écrire. C'est aussi la seule façon d'avoir une sortie de référence à laquelle comparer la seconde version.",
        "Le plan : les quatre constantes de classe ; la méthode d'entrée qui appelle les deux versions ; la version en vrac ; la version découpée ; puis les huit petites méthodes. Sépare visuellement les familles par des commentaires.",
        "Pour découper, cherche dans ta version en vrac les expressions qui apparaissent plusieurs fois ou qui demandent un effort de lecture. Le nombre de cycles est calculé une fois mais utilisé trois fois — c'est le candidat le plus évident. Le coût et la durée en dépendent : elles l'appelleront plutôt que de refaire le calcul, ce qui garantit qu'elles ne divergeront jamais.",

      "solution": "// La laverie automatique : le même programme, écrit deux fois.\n// D'abord tout dans la méthode d'entrée, puis découpé en méthodes nommées.\n// Les deux affichent exactement la même chose — c'est tout l'exercice.\nusing System;\n\nclass Program\n{\n    const int PrixLavageCentimes = 450;\n    const int PrixSechageCentimes = 200;\n    const int DureeLavageMinutes = 35;\n    const int DureeSechageMinutes = 25;\n\n    static void Main(string[] args)\n    {\n        int[] machines = { 7, 12, 5, 18, 9, 14 };   // kilos de linge par machine\n\n        Console.WriteLine(\"=== VERSION EN VRAC ===\");\n        VersionEnVrac(machines);\n\n        Console.WriteLine();\n        Console.WriteLine(\"=== VERSION DÉCOUPÉE ===\");\n        VersionDecoupee(machines);\n    }\n\n    // Tout au même endroit : cela fonctionne, et cela ne se relit pas.\n    static void VersionEnVrac(int[] machines)\n    {\n        int totalKilos = 0;\n        int totalCentimes = 0;\n        int totalMinutes = 0;\n        int grosses = 0;\n\n        for (int i = 0; i < machines.Length; i++)\n        {\n            int kilos = machines[i];\n            int cycles = (kilos + 7) / 8;\n            int cout = cycles * (PrixLavageCentimes + PrixSechageCentimes);\n            int duree = cycles * (DureeLavageMinutes + DureeSechageMinutes);\n\n            totalKilos += kilos;\n            totalCentimes += cout;\n            totalMinutes += duree;\n            if (kilos >= 12)\n            {\n                grosses++;\n            }\n\n            Console.WriteLine($\"  Machine {i + 1} : {kilos} kg → {cycles} cycle(s), \"\n                              + $\"{cout / 100.0:F2} €, {duree} min\");\n        }\n\n        Console.WriteLine($\"  Total : {totalKilos} kg, {totalCentimes / 100.0:F2} €, \"\n                          + $\"{totalMinutes} min, {grosses} grosse(s) machine(s)\");\n    }\n\n    // Le même travail, mais chaque question a un nom.\n    static void VersionDecoupee(int[] machines)\n    {\n        for (int i = 0; i < machines.Length; i++)\n        {\n            AfficherMachine(i + 1, machines[i]);\n        }\n\n        Console.WriteLine($\"  Total : {Total(machines)} kg, \"\n                          + $\"{CoutTotalCentimes(machines) / 100.0:F2} €, \"\n                          + $\"{DureeTotaleMinutes(machines)} min, \"\n                          + $\"{CompterAuMoins(machines, 12)} grosse(s) machine(s)\");\n    }\n\n    static int Cycles(int kilos) => (kilos + 7) / 8;\n\n    static int CoutCentimes(int kilos)\n        => Cycles(kilos) * (PrixLavageCentimes + PrixSechageCentimes);\n\n    static int DureeMinutes(int kilos)\n        => Cycles(kilos) * (DureeLavageMinutes + DureeSechageMinutes);\n\n    static void AfficherMachine(int numero, int kilos)\n    {\n        Console.WriteLine($\"  Machine {numero} : {kilos} kg → {Cycles(kilos)} cycle(s), \"\n                          + $\"{CoutCentimes(kilos) / 100.0:F2} €, {DureeMinutes(kilos)} min\");\n    }\n\n    static int Total(int[] valeurs)\n    {\n        int somme = 0;\n        foreach (int v in valeurs)\n        {\n            somme += v;\n        }\n        return somme;\n    }\n\n    static int CoutTotalCentimes(int[] machines)\n    {\n        int somme = 0;\n        foreach (int kilos in machines)\n        {\n            somme += CoutCentimes(kilos);\n        }\n        return somme;\n    }\n\n    static int DureeTotaleMinutes(int[] machines)\n    {\n        int somme = 0;\n        foreach (int kilos in machines)\n        {\n            somme += DureeMinutes(kilos);\n        }\n        return somme;\n    }\n\n    static int CompterAuMoins(int[] valeurs, int seuil)\n    {\n        int compte = 0;\n        foreach (int v in valeurs)\n        {\n            if (v >= seuil)\n            {\n                compte++;\n            }\n        }\n        return compte;\n    }\n}",

      "hier": "lecon07.html",
      "enonce": "Dernier jour : le programme d'hier se range en méthodes, sans qu'un seul chiffre change. Reprends les quatre tableaux de la semaine et la capacité de six places, et fais des tarifs des constantes de classe. Écris ensuite les méthodes suivantes : une qui trace une ligne d'une longueur donnée ; une qui affiche un titre suivi d'une ligne ; une qui transforme des centimes en un texte d'euros à deux décimales ; une qui rend la catégorie d'un âge ; une qui rend le tarif d'un âge <strong>en appelant la précédente</strong> ; une qui rend le total d'un tableau ; une qui rend sa moyenne, en se protégeant du tableau vide ; une qui rend l'<em>indice</em> du maximum ; une qui rend l'indice du minimum ; une qui compte les valeurs atteignant un seuil ; une qui <strong>rend un tableau</strong>, en répartissant un total entre un nombre de parts ; une qui affiche la semaine complète ; une qui affiche l'histogramme ; et une qui trace une barre. Le corps du programme principal ne doit plus faire que déclarer les données et appeler ces méthodes. Affiche la semaine, la ligne de synthèse, le meilleur et le pire jour, les jours pleins, la moyenne, l'histogramme, le tarif de cinq âges d'essai — 3, 8, 14, 30 et 70 ans — et la répartition du jeudi en trois créneaux, suivie d'un contrôle vérifiant que la somme des créneaux redonne les entrées du jour.",
      "principe": "Un programme principal bien rangé se lit comme le sommaire de ce qu'il fait. Les méthodes ne sont pas là pour économiser des lignes — le fichier en compte davantage qu'hier — mais pour que la première page réponde à la question « que fait ce programme ? » sans obliger à lire la seconde.",

      "remarque": "La méthode de répartition rend un tableau neuf à chaque appel. C'est le comportement le plus sûr — l'appelant reçoit quelque chose qui n'appartient qu'à lui — et le plus coûteux : sur des millions d'appels, ces tableaux jetables pèsent. Le choix inverse consisterait à remplir un tableau fourni par l'appelant ; il est plus rapide et infiniment plus facile à mal employer.",
      "indices": [
        "Ouvre ton fichier d'hier et souligne chaque bloc qui répond à une question : additionner un tableau, chercher un maximum, dessiner une barre, répartir des entrées. Chaque bloc souligné devient une méthode, et le nom que tu viens d'employer pour le décrire est son nom. Le programme principal sera ce qui reste quand tu les auras tous retirés.",
        "Le plan : les constantes de classe ; la méthode d'entrée, courte, qui déclare les données et enchaîne les appels ; puis les méthodes groupées par famille — présentation, règles métier, calculs sur tableaux, affichages composés — chaque famille précédée d'un commentaire.",
        "Écris les méthodes de calcul de façon qu'elles ne connaissent <em>que</em> leurs paramètres : celle qui additionne un tableau ne doit rien savoir de la patinoire, ni des jours, ni des recettes. C'est ce qui te permet de l'appeler sur les entrées, sur les recettes et sur les patins sans l'écrire trois fois — et c'est le premier signe d'un bon découpage.",

      "solution": "// La patinoire municipale — jour 4 sur 4 : le programme se range.\n// Rien de neuf n'est calculé. Ce qui change, c'est que chaque question du\n// programme d'hier porte désormais un nom — et que le corps du programme\n// principal tient en quelques lignes lisibles.\nusing System;\n\nclass Program\n{\n    const int CapaciteGlace = 6;\n    const int TarifEnfantCentimes = 350;\n    const int TarifJeuneCentimes = 500;\n    const int TarifAdulteCentimes = 750;\n    const int TarifSeniorCentimes = 550;\n\n    static void Main(string[] args)\n    {\n        string[] jours = { \"lundi\", \"mardi\", \"mercredi\", \"jeudi\",\n                           \"vendredi\", \"samedi\", \"dimanche\" };\n        int[] entrees = { 4, 6, 3, 5, 6, 6, 2 };\n        int[] recetteCentimes = { 3200, 3900, 2250, 4100, 5400, 5850, 1500 };\n        int[] patinsLoues = { 2, 5, 1, 3, 4, 6, 0 };\n\n        Titre(\"PATINOIRE MUNICIPALE — bilan de la semaine\");\n\n        AfficherSemaine(jours, entrees, recetteCentimes, patinsLoues);\n\n        Ligne(52);\n        Console.WriteLine($\"Entrées : {Total(entrees)} · \"\n                          + $\"Recette : {Euros(Total(recetteCentimes))} · \"\n                          + $\"Patins : {Total(patinsLoues)}\");\n        Console.WriteLine($\"Meilleur jour : {jours[IndiceDuMax(recetteCentimes)]}\");\n        Console.WriteLine($\"Jour le plus creux : {jours[IndiceDuMin(recetteCentimes)]}\");\n        Console.WriteLine($\"Jours à guichets fermés : {CompterAuMoins(entrees, CapaciteGlace)}\");\n        Console.WriteLine($\"Moyenne d'entrées : {Moyenne(entrees)}\");\n\n        Ligne(52);\n        AfficherHistogramme(jours, entrees);\n\n        Ligne(52);\n        Console.WriteLine(\"Tarif par âge :\");\n        int[] agesTest = { 3, 8, 14, 30, 70 };\n        foreach (int age in agesTest)\n        {\n            Console.WriteLine($\"  {age} ans → {Categorie(age)} → \"\n                              + $\"{Euros(TarifCentimes(age))}\");\n        }\n\n        Ligne(52);\n        Console.WriteLine(\"Une journée simulée, créneau par créneau :\");\n        int[] creneaux = Repartir(entrees[3], 3);\n        for (int c = 0; c < creneaux.Length; c++)\n        {\n            Console.WriteLine($\"  Créneau {c + 1} : {creneaux[c]} patineur(s)\");\n        }\n        Console.WriteLine($\"  Contrôle : {Total(creneaux)} = {entrees[3]} entrées du jeudi\");\n    }\n\n    // --- présentation ---\n\n    static void Ligne(int longueur)\n    {\n        for (int i = 0; i < longueur; i++)\n        {\n            Console.Write(\"-\");\n        }\n        Console.WriteLine();\n    }\n\n    static void Titre(string texte)\n    {\n        Console.WriteLine(texte);\n        Ligne(52);\n    }\n\n    static string Euros(int centimes) => $\"{centimes / 100.0:F2} €\";\n\n    // --- règles métier ---\n\n    static string Categorie(int age)\n    {\n        if (age >= 65)\n        {\n            return \"senior\";\n        }\n        if (age >= 18)\n        {\n            return \"adulte\";\n        }\n        if (age >= 12)\n        {\n            return \"jeune\";\n        }\n        return \"enfant\";\n    }\n\n    static int TarifCentimes(int age)\n    {\n        return Categorie(age) switch\n        {\n            \"senior\" => TarifSeniorCentimes,\n            \"adulte\" => TarifAdulteCentimes,\n            \"jeune\" => TarifJeuneCentimes,\n            _ => TarifEnfantCentimes\n        };\n    }\n\n    // --- calculs sur tableaux ---\n\n    static int Total(int[] valeurs)\n    {\n        int somme = 0;\n        foreach (int v in valeurs)\n        {\n            somme += v;\n        }\n        return somme;\n    }\n\n    static int Moyenne(int[] valeurs)\n    {\n        if (valeurs.Length == 0)\n        {\n            return 0;\n        }\n        return Total(valeurs) / valeurs.Length;\n    }\n\n    static int IndiceDuMax(int[] valeurs)\n    {\n        int meilleur = 0;\n        for (int i = 1; i < valeurs.Length; i++)\n        {\n            if (valeurs[i] > valeurs[meilleur])\n            {\n                meilleur = i;\n            }\n        }\n        return meilleur;\n    }\n\n    static int IndiceDuMin(int[] valeurs)\n    {\n        int pire = 0;\n        for (int i = 1; i < valeurs.Length; i++)\n        {\n            if (valeurs[i] < valeurs[pire])\n            {\n                pire = i;\n            }\n        }\n        return pire;\n    }\n\n    static int CompterAuMoins(int[] valeurs, int seuil)\n    {\n        int compte = 0;\n        foreach (int v in valeurs)\n        {\n            if (v >= seuil)\n            {\n                compte++;\n            }\n        }\n        return compte;\n    }\n\n    // Une méthode qui RENVOIE un tableau : la répartition d'un jour.\n    static int[] Repartir(int total, int parts)\n    {\n        int[] resultat = new int[parts];\n        int reste = total;\n        for (int c = 0; c < parts; c++)\n        {\n            resultat[c] = reste / (parts - c);\n            reste = reste - resultat[c];\n        }\n        return resultat;\n    }\n\n    // --- affichages composés ---\n\n    static void AfficherSemaine(string[] jours, int[] entrees,\n                                int[] recettes, int[] patins)\n    {\n        for (int i = 0; i < jours.Length; i++)\n        {\n            Console.WriteLine($\"  {jours[i]}\\t{entrees[i]} entrées\\t{Euros(recettes[i])}\"\n                              + $\"\\t{patins[i]} paire(s)\\t\"\n                              + $\"{CapaciteGlace - entrees[i]} libre(s)\");\n        }\n    }\n\n    static void AfficherHistogramme(string[] jours, int[] entrees)\n    {\n        for (int i = 0; i < jours.Length; i++)\n        {\n            Console.Write($\"  {jours[i]}\\t{entrees[i] * 100 / CapaciteGlace} %\\t\");\n            Barre(entrees[i]);\n        }\n    }\n\n    static void Barre(int longueur)\n    {\n        for (int i = 0; i < longueur; i++)\n        {\n            Console.Write(\"█\");\n        }\n        Console.WriteLine();\n    }\n}",
