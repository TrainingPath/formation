<script>
var DAY = {
  num: 6,
  title: "Boucles : while, do-while, for",
  subtitle: "Les trois boucles des jours 9-11, en C# (quasi identiques à Java).",
  theory: `
<h3>1. while et do-while</h3>
<p>Une <strong>boucle</strong> répète un bloc d'instructions. Le <code>while</code> teste sa condition AVANT chaque tour : si elle est fausse dès le départ, le corps n'est jamais exécuté.</p>
<pre class="pseudo">int i = 1;                         // compteur initialisé à 1
while (i &lt;= 5)                     // TANT QUE i est inférieur ou égal à 5 : on refait un tour
{                                  // début du corps de boucle
    Console.WriteLine(i);          // affiche la valeur courante de i
    i++;                           // PROGRESSION : sans cette ligne, i resterait à 1 → boucle infinie !
}                                  // fin du corps : on remonte tester la condition

do                                 // RÉPÉTER : le corps s'exécute AU MOINS une fois…
{                                  // début du corps
    saisie = Console.ReadLine();   // on lit une saisie
} while (saisie != "quit");        // …puis on teste APRÈS : on recommence tant que ce n'est pas « quit »</pre>
<p>Différence clé : <code>while</code> teste avant (0 tour possible), <code>do-while</code> teste après (au moins 1 tour). On choisit selon qu'on doit ou non exécuter le corps au moins une fois.</p>

<h3>2. for : la boucle à compteur</h3>
<pre class="pseudo">for (int i = 1; i &lt;= 10; i++)        // POUR i DE 1 À 10 : init ; condition ; progression
{                                    // les trois zones sont séparées par des ;
    Console.WriteLine(i);            // corps exécuté à chaque tour (i = 1, puis 2, … jusqu'à 10)
}                                    // fin de boucle
for (int i = 10; i &gt;= 1; i--) { }    // compte à REBOURS : i part de 10 et décroît (i--) jusqu'à 1
for (int i = 0; i &lt;= 100; i += 5) { }// PAS de 5 : i vaut 0, 5, 10, … 100 (i += 5 à chaque tour)</pre>
<p>Les trois zones : <code>for (initialisation ; condition ; progression)</code> regroupent en une ligne les trois temps du TANT QUE (préparer le compteur, tester, le faire avancer). C'est la boucle idéale quand le nombre de tours est connu.</p>

<h3>3. foreach : parcourir sans indice</h3>
<pre class="pseudo">int[] notes = { 12, 8, 15 };         // un tableau de trois entiers (leçon 7)
foreach (int note in notes)          // POUR CHAQUE élément « note » du tableau « notes » (in, pas : comme Java)
{                                    // à chaque tour, « note » prend la valeur suivante du tableau
    Console.WriteLine(note);         // affiche 12, puis 8, puis 15
}                                    // fin de boucle</pre>
<div class="tip">Petite différence de syntaxe : C# écrit <code>foreach (int x in tableau)</code> avec <code>in</code> ; Java écrivait <code>for (int x : tableau)</code> avec <code>:</code>. Même comportement : on parcourt les éléments sans gérer d'indice.</div>

<h3>4. Les motifs à connaître (accumulateur, compteur)</h3>
<pre class="pseudo">// ACCUMULATEUR : additionner une série de valeurs
int somme = 0;                                   // on part de 0 (élément neutre de l'addition)
for (int i = 1; i &lt;= n; i++) { somme += i; }     // à chaque tour, on AJOUTE i au total

// COMPTEUR CONDITIONNEL : compter ceux qui vérifient une condition
int nbPairs = 0;                                 // compteur initialisé à 0
foreach (int x in notes) { if (x % 2 == 0) { nbPairs++; } }  // +1 chaque fois que x est pair</pre>
<p>Ces deux motifs reviennent partout : un <strong>accumulateur</strong> (somme, produit…) démarré à sa valeur neutre, et un <strong>compteur</strong> qu'on incrémente sous condition.</p>

<h3>5. break et continue</h3>
<pre class="pseudo">foreach (int x in valeurs)
{
    if (x &lt; 0) { continue; }    // continue : ABANDONNE ce tour et passe directement au suivant (ici : ignore les négatifs)
    if (x == 99) { break; }     // break : SORT complètement de la boucle (ici : on s'arrête à 99)
    Console.WriteLine(x);       // atteint seulement pour les x >= 0 et != 99
}</pre>
<p><code>continue</code> saute la fin du tour courant ; <code>break</code> quitte toute la boucle. À utiliser avec parcimonie, mais très pratiques pour filtrer ou s'arrêter tôt.</p>

<h3>6. Choisir sa boucle</h3>
<pre class="pseudo">Nombre de tours connu          → for        // ex. « répéter 10 fois »
Nombre inconnu, 0 possible     → while      // ex. « tant qu'il reste des données »
Nombre inconnu, &gt;= 1 tour       → do-while   // ex. « redemander jusqu'à saisie valide »
Parcourir une collection       → foreach    // ex. « pour chaque élément du tableau »</pre>`,
  exercises: [
    { type: "qcm", q: "Traduire <code>TANT QUE n > 0</code> :", opts: ["while n > 0:", "while (n > 0) { ... }", "for (n > 0)", "loop"], a: 1, exp: "Identique à Java." },
    { type: "input", q: "int s = 0; for (int i = 1; i <= 4; i++) { s += i; } Que vaut s ?", a: "10", ph: "nombre", exp: "1+2+3+4 : l'accumulateur du jour 12." },
    { type: "qcm", q: "Le foreach C# s'écrit…", opts: ["for (int x : t)", "foreach (int x in t) : avec IN (différence syntaxe avec Java)", "foreach x of t", "for x in t"], a: 1, exp: "in au lieu de : — même sens, autre mot." },
    { type: "qcm", q: "Quelle boucle garantit AU MOINS un tour ?", opts: ["while", "do { ... } while (...)", "for", "foreach"], a: 1, exp: "Le RÉPÉTER du jour 11 : test après le corps." },
    { type: "input", q: "Combien de tours fait <code>for (int i = 5; i <= 15; i++)</code> ?", a: "11", ph: "nombre", exp: "15 − 5 + 1 : le ±1 du jour 10." },
    { type: "qcm", q: "Bug de <code>int i = 1; while (i <= 5) { Console.WriteLine(i); }</code> :", opts: ["i mal déclaré", "Boucle infinie : i++ manque (le piège du jour 9)", "while inconnu", "WriteLine interdit"], a: 1, exp: "Initialiser, tester, PROGRESSER." },
    { type: "qcm", q: "continue fait…", opts: ["Sort de la boucle", "Abandonne ce tour, passe au suivant", "Recommence tout", "Rien"], a: 1, exp: "break sort, continue saute." },
    { type: "input", q: "int c = 0; foreach (int x in new[]{4,9,12,7,15}) { if (x > 8) c++; } Que vaut c ?", a: "3", ph: "nombre", exp: "9, 12, 15 : compteur conditionnel." },
    { type: "qcm", q: "Compte à rebours 5 à 1 :", opts: ["for (int i = 1; i <= 5; i++)", "for (int i = 5; i >= 1; i--)", "while (i = 5)", "foreach"], a: 1, exp: "Pas négatif : i--." },
    { type: "input", q: "int i = 1; while (i < 50) { i *= 2; } Que vaut i à la fin ? (1,2,4,8,16,32,64)", a: "64", ph: "nombre", exp: "32 < 50 : encore un tour → 64, sortie." },
    { type: "qcm", q: "« Afficher 100 fois Bravo » :", opts: ["for (int i = 0; i < 100; i++)", "while (true)", "do-while", "foreach"], a: 0, exp: "Nombre connu → for (jour 11)." },
    { type: "qcm", q: "« Redemander un mot de passe jusqu'à ce qu'il soit correct » :", opts: ["for", "do { ... } while (mdp != secret);", "foreach", "if"], a: 1, exp: "Au moins un essai + arrêt sur succès → do-while." },
    { type: "input", q: "int s = 0; for (int i = 1; i <= 20; i++) { if (i % 5 == 0) s += i; } Que vaut s ?", a: "50", ph: "nombre", exp: "5+10+15+20 = 50 : accumulateur conditionnel." },
    { type: "qcm", q: "« Parcourir un tableau de scores » :", opts: ["while", "foreach (int s in scores) : la boucle de collection", "do-while", "un if"], a: 1, exp: "foreach = zéro indice, zéro débordement." },
    { type: "input", q: "Combien de « X » ? <code>for (int i = 1; i <= 3; i++) for (int j = 1; j <= 2; j++) Console.Write(\"X\");</code>", a: "6", ph: "nombre", exp: "3 × 2 : boucles imbriquées (jour 13)." }
  ],
  final: {
    title: "Exercice final — Le livret d'épargne (version C#)",
    intro: `<p>Le final du jour 9, quatrième traduction :</p>
<pre class="pseudo">double capital = 100;
int annees = 0;
while (capital <= 150)
{
    capital *= 1.10;
    annees++;
}
Console.WriteLine($"{annees} années, capital {capital:F2}");</pre>`,
    questions: [
      { type: "qcm", q: "<code>capital *= 1.10;</code> équivaut à…", opts: ["capital = capital + 1.10;", "capital = capital * 1.10;", "capital++;", "capital == capital * 1.10;"], a: 1, exp: "Opérateur composé, comme Java." },
      { type: "input", q: "Qu'affiche <code>annees</code> ? (110, 121, 133.1, 146.41, 161.05)", a: "5", ph: "nombre", exp: "Même trace qu'au jour 9 : 5 années." },
      { type: "qcm", q: "Pourquoi capital est double et annees int ?", opts: ["Hasard", "L'argent a des décimales (×1.10), les années se comptent en entiers (leçon 2)", "double plus rapide", "L'inverse serait mieux"], a: 1, exp: "Le bon type pour la bonne donnée." },
      { type: "qcm", q: "Avec un taux de 0 % (capital *= 1.0) :", opts: ["annees = 0", "Boucle infinie : capital n'atteint jamais 150 (le piège du jour 9)", "Erreur", "annees = 1"], a: 1, exp: "Aucune progression vers la sortie." },
      { type: "qcm", q: "Version « au moins une année comptée » :", opts: ["for", "do { capital *= 1.10; annees++; } while (capital <= 150);", "while inchangé", "foreach"], a: 1, exp: "Exécution garantie → do-while." }
    ],
    solution: `<pre class="pseudo">Tour  capital avant  après   annees
1     100.00         110.00  1
2     110.00         121.00  2
3     121.00         133.10  3
4     133.10         146.41  4
5     146.41         161.05  5 → sortie

Trace identique à Java (leçon 6) et au jour 9 d'algo :
while/for/do-while sont les habits C# de TANT QUE/POUR/RÉPÉTER.</pre>
<p>Cinquième livret d'épargne (avec le pseudocode). La logique est immuable. Demain : les tableaux C#.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code C# ici…",
  items: [
  { id: "cs-fizzbuzz", title: "FizzBuzz", level: 2,
    statement: "Affiche les nombres de 1 à 30, mais : multiples de 3 → <code>Fizz</code>, multiples de 5 → <code>Buzz</code>, multiples des deux → <code>FizzBuzz</code>.<pre class=\"pseudo\">1  2  Fizz  4  Buzz  Fizz  7 … 14  FizzBuzz  16 …</pre>",
    hints: [
      "Une boucle for de 1 à 30, avec un if/else if/else if/else à l'intérieur.",
      "L'ordre des tests compte : teste d'abord « multiple de 3 ET de 5 », sinon FizzBuzz ne s'affichera jamais.",
      "Multiple de 3 et de 5 = multiple de 15 : i % 15 == 0 (ou i % 3 == 0 && i % 5 == 0)."
    ],
    solution: "using System;                                    // accès à Console\n\nclass FizzBuzz                                   // déclaration de la classe\n{                                                // début de la classe\n    static void Main()                           // point d'entrée du programme\n    {                                            // début de Main\n        for (int i = 1; i <= 30; i++)            // i va de 1 à 30 inclus\n        {                                        // début du bloc répété\n            if (i % 15 == 0)                     // multiple de 15 = de 3 ET de 5 → À TESTER EN PREMIER\n                Console.WriteLine(\"FizzBuzz\");   // les deux à la fois\n            else if (i % 3 == 0)                 // sinon, multiple de 3 seulement ?\n                Console.WriteLine(\"Fizz\");       // → Fizz\n            else if (i % 5 == 0)                 // sinon, multiple de 5 seulement ?\n                Console.WriteLine(\"Buzz\");       // → Buzz\n            else                                 // ni l'un ni l'autre\n                Console.WriteLine(i);            // → le nombre lui-même\n        }                                        // fin du bloc répété\n    }                                            // fin de Main\n}                                                // fin de la classe",
    note: "Le grand classique des entretiens d'embauche ! Le piège est l'ordre des conditions." },
  { id: "cs-rebours", title: "Le compte à rebours", level: 1,
    statement: "Lis un entier <code>n</code> positif et affiche le compte à rebours de <code>n</code> à 0, puis <code>\"Décollage !\"</code>.",
    hints: [
      "Une boucle for peut descendre : il suffit de décrémenter avec i--.",
      "for (int i = n; i >= 0; i--) — départ à n, on continue tant que i >= 0.",
      "\"Décollage !\" s'affiche APRÈS la boucle."
    ],
    solution: "using System;                                    // accès à Console\n\nclass CompteARebours                             // déclaration de la classe\n{                                                // début de la classe\n    static void Main()                           // point d'entrée du programme\n    {                                            // début de Main\n        Console.Write(\"n ? \");                   // demande le point de départ\n        int n = int.Parse(Console.ReadLine());   // lit et convertit n\n        for (int i = n; i >= 0; i--)             // départ à n ; on continue tant que i >= 0 ; i-- décrémente\n        {                                        // début du bloc répété\n            Console.WriteLine(i);                // affiche la valeur courante\n        }                                        // fin du bloc répété\n        Console.WriteLine(\"Décollage !\");        // s'affiche UNE fois, après la boucle\n    }                                            // fin de Main\n}                                                // fin de la classe",
    note: "i-- est le miroir de i++ : le for descend aussi bien qu'il monte." }
  ]
};
