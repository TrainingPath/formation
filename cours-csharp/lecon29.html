  title: "Sérialisation JSON",
  subtitle: "Transformer un objet en texte pour le sauvegarder ou l'envoyer, et l'inverse.",
  theory: `
<h3>1. Le problème : un objet ne se sauvegarde pas tel quel</h3>
<p>Un objet C# vit en mémoire ; dès que le programme s'arrête, il disparaît. Pour le CONSERVER dans un fichier ou l'ENVOYER sur le réseau, il faut le convertir en texte. La <strong>sérialisation</strong> (serialization) est cette transformation : objet → texte. L'opération inverse, texte → objet, s'appelle la <strong>désérialisation</strong>. Analogie : sérialiser, c'est démonter un meuble et le mettre à plat dans un carton pour le transporter ; désérialiser, c'est le remonter à l'arrivée.</p>

<h3>2. Le JSON : un format texte universel</h3>
<p><strong>JSON</strong> (JavaScript Object Notation) est un format texte lisible qui décrit des données par des paires « clé : valeur ». C'est la langue commune des applications web et des API : simple, léger, compris partout.</p>
<pre class="pseudo">{                              // un objet JSON s'ouvre par une accolade
  "titre": "Ranger",           // une paire clé : valeur (texte entre guillemets)
  "priorite": 1,               // une valeur numérique
  "faite": false,              // un booléen
  "tags": ["maison", "urgent"] // un tableau de valeurs entre crochets
}                              // se ferme par une accolade</pre>

<h3>3. Sérialiser : objet → JSON</h3>
<p>En C# moderne, la classe <code>JsonSerializer</code> (namespace <code>System.Text.Json</code>) fait le travail.</p>
<pre class="pseudo">using System.Text.Json;                        // accès à JsonSerializer

Tache t = new Tache { Titre = "Ranger", Priorite = 1 };  // un objet à sauvegarder
string json = JsonSerializer.Serialize(t);     // objet → texte JSON
Console.WriteLine(json);                         // {"Titre":"Ranger","Priorite":1}</pre>
<div class="tip">Pour un JSON lisible (indenté), on passe des OPTIONS : <code>new JsonSerializerOptions { WriteIndented = true }</code>. Sans elles, tout est compacté sur une ligne — plus léger pour le réseau, moins lisible pour un humain.</div>

<h3>4. Désérialiser : JSON → objet</h3>
<pre class="pseudo">string json = "{\\"Titre\\":\\"Lire\\",\\"Priorite\\":2}";  // du texte JSON reçu
Tache t = JsonSerializer.Deserialize&lt;Tache&gt;(json);   // texte → objet Tache
Console.WriteLine(t.Titre);                           // « Lire » : l'objet est reconstruit</pre>
<div class="warn">On précise le TYPE cible entre chevrons : <code>Deserialize&lt;Tache&gt;(...)</code>. C# lit le JSON et remplit un nouvel objet Tache. Si une clé JSON ne correspond à aucune propriété, elle est simplement ignorée.</div>

<h3>5. Sérialiser une collection</h3>
<pre class="pseudo">List&lt;Tache&gt; taches = /* ... */;                 // une liste d'objets
string json = JsonSerializer.Serialize(taches); // devient un TABLEAU JSON [ {...}, {...} ]
List&lt;Tache&gt; relu = JsonSerializer.Deserialize&lt;List&lt;Tache&gt;&gt;(json); // et on reconstruit la liste</pre>
<p>Une liste d'objets devient un tableau JSON, et se relit vers une <code>List&lt;T&gt;</code> : parfait pour sauvegarder toutes les tâches d'un coup.</p>

<h3>6. Sauvegarder dans un fichier</h3>
<pre class="pseudo">string json = JsonSerializer.Serialize(taches);        // objets → texte
File.WriteAllText("taches.json", json);                // écrit le texte dans un fichier
// … plus tard, au redémarrage …
string contenu = File.ReadAllText("taches.json");      // relit le fichier
var relu = JsonSerializer.Deserialize&lt;List&lt;Tache&gt;&gt;(contenu); // texte → objets</pre>
<div class="tip">Le combo <code>Serialize</code> + <code>File.WriteAllText</code> (et l'inverse) donne une PERSISTANCE simple : les données survivent à la fermeture du programme. C'est la base d'une petite application qui garde son état.</div>

<h3>7. Bonnes pratiques et pièges</h3>
<p>Pour être sérialisées, les propriétés doivent être PUBLIQUES. Une désérialisation nécessite en général un constructeur sans paramètre (ou des propriétés accessibles). Un JSON reçu de l'extérieur peut être mal formé : entoure la désérialisation d'un <code>try/catch</code> pour capturer une <code>JsonException</code>. Enfin, JSON ne gère que des données simples (texte, nombres, booléens, tableaux, objets) : pas de méthodes, seulement l'état.</p>`,

    { type: "qcm", q: "Pour être sérialisées, les propriétés d'une classe doivent être…", opts: ["Privées", "PUBLIQUES", "Statiques", "Constantes"], a: 1, exp: "JsonSerializer lit les propriétés publiques." },
    { type: "qcm", q: "Un JSON reçu de l'extérieur, mal formé, peut provoquer…", opts: ["Rien", "Une JsonException : d'où l'intérêt d'un try/catch", "Un objet rempli de valeurs par défaut", "Une perte du fichier source"], a: 1, exp: "On protège la désérialisation d'entrées douteuses." },
    { type: "vf", q: "Le JSON ne stocke que l'ÉTAT (données) d'un objet, pas ses méthodes.", a: true, exp: "Seules les données sont sérialisées, pas le comportement." }
  ],
  final: {
    title: "Exercice final — Sauvegarder et recharger la liste de tâches",
    intro: `<p>On veut persister les tâches dans un fichier JSON, puis les relire au redémarrage.</p>
<pre class="pseudo">public class Tache                                  // classe simple, propriétés publiques
{
    public string Titre { get; set; }
    public int Priorite { get; set; }
}
List&lt;Tache&gt; taches = new List&lt;Tache&gt;             // deux tâches
{
    new Tache { Titre = "Ranger", Priorite = 1 },
    new Tache { Titre = "Lire", Priorite = 2 }
};
var opt = new JsonSerializerOptions { WriteIndented = true }; // (1) JSON indenté
string json = JsonSerializer.Serialize(taches, opt);         // (2) objets → texte
File.WriteAllText("taches.json", json);                      // (3) sauvegarde fichier
// … redémarrage …
string lu = File.ReadAllText("taches.json");                 // relit le fichier
List&lt;Tache&gt; relu = JsonSerializer.Deserialize&lt;List&lt;Tache&gt;&gt;(lu); // (4) texte → objets
Console.WriteLine(relu[0].Titre);                            // (5)</pre>`,
    questions: [
      { type: "qcm", q: "(1) À quoi sert <code>WriteIndented = true</code> ?", opts: ["À trier les propriétés par ordre alphabétique", "À produire un JSON lisible, indenté (plutôt que compacté sur une ligne)", "À compresser le texte produit", "À valider la structure du JSON"], a: 1, exp: "Mise en forme lisible pour un humain." },
      { type: "qcm", q: "(2) <code>JsonSerializer.Serialize(taches, opt)</code> produit…", opts: ["Un objet Tache", "Un TABLEAU JSON de deux objets, sous forme de texte", "Un seul objet JSON fusionné", "Une chaîne vide"], a: 1, exp: "Une liste → un tableau JSON." },
      { type: "qcm", q: "(3) <code>File.WriteAllText</code> sert à…", opts: ["Lire le fichier", "ÉCRIRE le texte JSON dans le fichier (persistance)", "Créer un nouveau dossier", "Ouvrir le fichier en lecture seule"], a: 1, exp: "Les données survivent à la fermeture." },
      { type: "qcm", q: "(4) <code>Deserialize&lt;List&lt;Tache&gt;&gt;(lu)</code> reconstruit…", opts: ["Une seule Tache", "Une List<Tache> à partir du texte JSON relu", "Un tableau de chaînes", "Le nombre de tâches lues"], a: 1, exp: "Texte → objets, avec le type cible précisé." },
      { type: "vf", q: "(5) Après rechargement, <code>relu[0].Titre</code> vaut 'Ranger' : l'état a bien été restauré.", a: true, exp: "Sérialiser puis désérialiser restitue les données." }
    ],
    solution: `<pre class="pseudo">Serialize(taches, opt)   → [ { "Titre":"Ranger", ... }, {...} ]  // objets → texte indenté
File.WriteAllText        → écrit le JSON sur le disque          // persistance
File.ReadAllText         → relit le texte du fichier
Deserialize<List<Tache>> → reconstruit la liste d'objets       // texte → objets
relu[0].Titre → "Ranger" → l'état est restauré à l'identique</pre>
<p>Serialize + WriteAllText pour sauvegarder, ReadAllText + Deserialize pour recharger : une persistance simple et portable. Tu as désormais tous les outils d'approfondissement du C# !</p>`
