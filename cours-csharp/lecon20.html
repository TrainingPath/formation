  title: "Les génériques",
  subtitle: "Un seul code qui marche pour TOUS les types : la boîte étiquetée du C#.",
  theory: `
<h3>1. Le problème : réécrire le même code pour chaque type</h3>
<p>Imagine une fonction qui échange deux valeurs. Tu en écris une pour les <code>int</code>, une autre pour les <code>string</code>, une pour les <code>Tache</code>… le même code recopié dix fois. Les <strong>génériques</strong> (generics) résolvent cela : ce sont des <em>patrons de code</em> paramétrés par un type, comme un moule à gâteau qui accepte n'importe quelle pâte. On écrit UNE fois, ça marche pour TOUS les types.</p>
<p>Le <strong>paramètre de type</strong> (type parameter), noté par convention <code>T</code> (pour « Type »), est une étiquette-mystère : à la compilation, C# la remplace par le vrai type que tu fournis. C'est comme un carton d'emballage sur lequel tu écris au feutre le contenu au dernier moment.</p>

<h3>2. Les génériques, tu les utilises déjà</h3>
<pre class="pseudo">List&lt;string&gt; taches = new List&lt;string&gt;();   // List&lt;T&gt; : ici T = string, une liste de chaînes
Dictionary&lt;string, int&gt; scores;               // Dictionary&lt;K, V&gt; : deux paramètres, clé et valeur
Nullable&lt;int&gt; age;                             // Nullable&lt;T&gt; : un int qui peut aussi être null</pre>
<p>Le <code>&lt;T&gt;</code> entre chevrons se lit « de T ». <code>List&lt;string&gt;</code> = « liste DE string ». Le compilateur garantit alors qu'on n'y mettra QUE des string : sécurité de type gratuite.</p>
<div class="tip">Avant les génériques (vieux C# / vieux Java), on stockait des <code>object</code> et on castait à la main, avec risque d'erreur à l'exécution. Les génériques déplacent la vérification à la COMPILATION : les bugs sont attrapés avant même de lancer le programme.</div>

<h3>3. Écrire sa propre MÉTHODE générique</h3>
<pre class="pseudo">static void Echanger&lt;T&gt;(ref T a, ref T b)   // &lt;T&gt; après le nom : cette méthode est paramétrée par T
{                                            // ref = on modifie les variables d'origine (leçon passages)
    T temp = a;                              // temp est du type T, quel qu'il soit
    a = b;                                   // on copie b dans a
    b = temp;                                // et l'ancien a (gardé dans temp) dans b
}
// Utilisation : le type est DEDUIT automatiquement des arguments
int x = 1, y = 2;                            // deux entiers
Echanger(ref x, ref y);                      // C# comprend T = int tout seul
string p = "Ana", q = "Bob";                 // deux chaînes
Echanger(ref p, ref q);                      // ici T = string : MÊME méthode, aucun code recopié</pre>
<div class="tip">On dit que C# fait de l'<strong>inférence de type</strong> (type inference) : il devine <code>T</code> à partir des arguments, tu n'écris pas <code>Echanger&lt;int&gt;(...)</code> — même si tu le peux.</div>

<h3>4. Écrire sa propre CLASSE générique</h3>
<p>Thème Ludothèque : une petite « boîte » qui range un objet et retient combien de fois on l'a consulté.</p>
<pre class="pseudo">class Boite&lt;T&gt;                               // une classe paramétrée : Boite DE T
{                                            // début de la classe
    private T contenu;                       // le champ stocké est du type T
    public int Consultations = 0;            // un compteur, lui toujours int
    public Boite(T valeur) { contenu = valeur; }  // le constructeur reçoit un T
    public T Ouvrir()                        // renvoie le contenu, du type T
    {                                        // début de la méthode
        Consultations++;                     // on note une consultation de plus
        return contenu;                      // on rend le contenu
    }                                        // fin de la méthode
}                                            // fin de la classe
// Utilisation
Boite&lt;string&gt; jeu = new Boite&lt;string&gt;("Catan"); // une boîte DE string
Console.WriteLine(jeu.Ouvrir());             // affiche « Catan », Consultations passe à 1</pre>

<h3>5. Les contraintes : where T</h3>
<p>Parfois T ne peut pas être n'importe quoi : on veut pouvoir le comparer, ou qu'il ait un constructeur. Une <strong>contrainte</strong> (constraint) restreint les types autorisés — comme préciser « accepte tout colis, MAIS seulement s'il rentre dans la boîte aux lettres ».</p>
<pre class="pseudo">static T Max&lt;T&gt;(T a, T b) where T : IComparable&lt;T&gt;  // T doit savoir se comparer (méthode CompareTo)
{                                                   // sinon a.CompareTo(b) n'existerait pas
    return a.CompareTo(b) &gt;= 0 ? a : b;             // CompareTo &gt;= 0 : a est &gt;= b
}                                                   // marche pour int, string, DateTime…</pre>
<p>Contraintes courantes : <code>where T : class</code> (un type référence), <code>where T : struct</code> (un type valeur), <code>where T : new()</code> (possède un constructeur sans argument), <code>where T : IComparable&lt;T&gt;</code> (implémente une interface).</p>
<div class="warn">Sans la contrainte <code>where T : IComparable&lt;T&gt;</code>, la ligne <code>a.CompareTo(b)</code> ne compilerait pas : rien ne garantit que T sache se comparer. La contrainte est une PROMESSE que le compilateur peut vérifier.</div>

<h3>6. Pourquoi c'est un progrès</h3>
<p>Génériques = <strong>réutilisation</strong> (un code, tous les types) + <strong>sécurité</strong> (erreurs attrapées à la compilation) + <strong>performance</strong> (pas de conversion object/cast coûteuse). C'est la fondation de toutes les collections du .NET.</p>`,
  exercises: [
    { type: "qcm", q: "À quoi sert un générique ?", opts: ["À trier plus vite", "À écrire UN code réutilisable pour PLUSIEURS types (un moule à gâteau)", "À créer des fichiers", "À gérer les erreurs"], a: 1, exp: "Un patron de code paramétré par un type." },
    { type: "qcm", q: "Dans <code>List&lt;string&gt;</code>, que représente <code>string</code> ?", opts: ["Le nom de la variable", "Le type des éléments (le paramètre de type)", "Une méthode", "Une contrainte"], a: 1, exp: "List DE string : T vaut string." },
    { type: "qcm", q: "Par convention, le paramètre de type s'écrit souvent…", opts: ["X", "T (pour Type)", "int", "obj"], a: 1, exp: "T, U, V, ou TKey/TValue pour les dictionnaires." },

    { type: "qcm", q: "Appel <code>Echanger(ref x, ref y)</code> avec deux int : que fait C# pour T ?", opts: ["Il refuse", "Il DÉDUIT T = int par inférence de type", "Il met T = object", "Il demande à l'utilisateur"], a: 1, exp: "L'inférence devine T à partir des arguments." },
    { type: "vf", q: "On peut écrire explicitement <code>Echanger&lt;int&gt;(ref x, ref y)</code> même si l'inférence suffit.", a: true, exp: "Explicite ou déduit, les deux marchent." },
    { type: "qcm", q: "Dans <code>class Boite&lt;T&gt;</code> avec <code>private T contenu;</code>, le champ contenu est…", opts: ["Toujours un int", "Du type T, donc du type choisi à l'instanciation", "Une string", "Interdit"], a: 1, exp: "Le champ prend le type fourni : Boite&lt;string&gt; → contenu est string." },
    { type: "qcm", q: "À quoi sert <code>where T : IComparable&lt;T&gt;</code> ?", opts: ["À trier la liste", "À garantir que T sait se comparer (CompareTo), sinon le code ne compile pas", "À créer T", "À afficher T"], a: 1, exp: "Une contrainte : une promesse vérifiée par le compilateur." },
    { type: "qcm", q: "Que signifie la contrainte <code>where T : new()</code> ?", opts: ["T est un nombre", "T possède un constructeur sans argument", "T est nouveau", "T est null"], a: 1, exp: "Permet de faire new T() à l'intérieur." },
    { type: "vf", q: "Sans contrainte, on peut appeler n'importe quelle méthode sur un T.", a: false, exp: "Sans contrainte, T est traité comme object : seules les méthodes d'object sont sûres." },
    { type: "qcm", q: "<code>where T : struct</code> exige que T soit…", opts: ["Un type référence", "Un type valeur (int, double, struct…)", "Une string", "Une interface"], a: 1, exp: "struct = type valeur ; class = type référence." },
    { type: "qcm", q: "Quel bénéfice de performance apportent les génériques (vs stocker des object) ?", opts: ["Aucun bénéfice", "Ils évitent les conversions object/cast coûteuses", "Ils compressent la mémoire", "Ils multiplient les threads"], a: 1, exp: "Pas de boxing/cast : plus rapide et sûr." },
    { type: "qcm", q: "Les collections .NET (List, Dictionary, Queue…) reposent sur…", opts: ["Les fichiers", "Les génériques", "Random", "Les exceptions"], a: 1, exp: "Toute la bibliothèque de collections est générique." }
  ],
  final: {
    title: "Exercice final — Une pile générique pour la Ludothèque",
    intro: `<p>On modélise une pile (Stack) de « choses » à ranger : le dernier posé est le premier repris (LIFO). Grâce aux génériques, cette pile marche pour des string, des int, des Jeu…</p>
<pre class="pseudo">class Pile&lt;T&gt;                                  // une pile DE T, réutilisable
{                                              // début de la classe
    private List&lt;T&gt; elements = new List&lt;T&gt;();  // stockage interne, lui aussi générique
    public int Taille =&gt; elements.Count;       // propriété : nombre d'éléments
    public void Empiler(T x) { elements.Add(x); }             // poser au sommet
    public T Depiler()                          // retirer et renvoyer le sommet
    {                                           // début
        T dernier = elements[elements.Count - 1]; // le dernier élément
        elements.RemoveAt(elements.Count - 1);  // on le retire
        return dernier;                         // on le rend
    }                                           // fin
}
Pile&lt;string&gt; p = new Pile&lt;string&gt;();          // (1) une pile de string
p.Empiler("Uno"); p.Empiler("Catan");          // (2) deux jeux empilés
string haut = p.Depiler();                      // (3) qu'obtient-on ?</pre>`,
    questions: [
      { type: "qcm", q: "(1) <code>new Pile&lt;string&gt;()</code> : de quel type sont les éléments de cette pile ?", opts: ["int", "string : T vaut string", "object", "Pile"], a: 1, exp: "Le paramètre de type fixe le contenu autorisé." },
      { type: "qcm", q: "(2) Après les deux Empiler, que vaut <code>p.Taille</code> ?", opts: ["0", "2", "1", "Une erreur"], a: 1, exp: "Deux éléments empilés, Count = 2." },
      { type: "qcm", q: "(3) Que vaut <code>haut</code> après Depiler ?", opts: ["Uno", "Catan : la pile est LIFO, on reprend le dernier empilé", "null", "Erreur"], a: 1, exp: "Dernier posé, premier repris." },
      { type: "vf", q: "La même classe Pile&lt;T&gt; pourrait stocker des int sans rien réécrire.", a: true, exp: "Il suffit d'instancier Pile&lt;int&gt; : c'est tout l'intérêt du générique." },
      { type: "qcm", q: "Pourquoi le champ interne est <code>List&lt;T&gt;</code> et pas <code>List&lt;string&gt;</code> ?", opts: ["Par erreur", "Pour que la pile reste générique : elements suit le T de la classe", "Pour aller plus vite", "Aucune raison"], a: 1, exp: "T se propage : la pile s'adapte à n'importe quel type." }
    ],
    solution: `<pre class="pseudo">Pile&lt;string&gt; → elements est une List&lt;string&gt;   // T = string partout
Empiler("Uno")   → [Uno]                        // ajout au bout
Empiler("Catan") → [Uno, Catan]                 // Taille = 2
Depiler()        → retire et renvoie "Catan"    // LIFO : le dernier
haut = "Catan"   · Taille redevient 1           // état final</pre>
<p>Un seul code, mille usages : <code>Pile&lt;int&gt;</code>, <code>Pile&lt;Jeu&gt;</code>… Les génériques sont la brique de base des collections. Prochaine étape : interroger ces collections avec LINQ.</p>`
  }
};

      "principe": "Un type paramétré est un patron : on écrit le code une fois, le compilateur le décline pour chaque type d'usage. On gagne la réutilisation sans perdre la vérification — un casier de textes refuse un nombre avant même que le programme ne démarre.",

      "indices": [

        "Le plan : la méthode d'échange ; la classe des effets ; la classe du casier paramétrée, avec ses trois contrôles ; puis le programme — les trois échanges, les deux casiers, les deux refus rattrapés, la méthode contrainte essayée sur trois types, la méthode d'affichage essayée sur deux listes.",
        "Écris d'abord un casier de textes, sans paramètre de type, entièrement concret. Fais-le marcher. Puis remplace <em>partout</em> le mot désignant le type du contenu par une seule lettre, et ajoute-la entre chevrons après le nom de la classe. La transformation prend trente secondes et se voit à l'œil nu — c'est la meilleure façon de comprendre ce que le paramètre de type remplace.",

      "solution": "// Le casier consigné de la piscine : un seul casier, écrit une fois, bon pour tout contenu.\nusing System;\nusing System.Collections.Generic;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        // La même méthode, trois types différents : le type est deviné à l'appel.\n        Console.WriteLine(\"L'ÉCHANGE DE DEUX VESTIAIRES\");\n        int gauche = 12;\n        int droite = 47;\n        Echanger(ref gauche, ref droite);\n        Console.WriteLine($\"Numéros après échange : {gauche} et {droite}\");\n\n        string matin = \"Ana\";\n        string soir = \"Bram\";\n        Echanger(ref matin, ref soir);\n        Console.WriteLine($\"Créneaux après échange : {matin} et {soir}\");\n\n        Effet sac = new Effet(\"sac de sport bleu\", 3500);\n        Effet montre = new Effet(\"montre de nage\", 8900);\n        Echanger(ref sac, ref montre);\n        Console.WriteLine($\"Objets après échange : {sac} et {montre}\");\n\n        Console.WriteLine();\n\n        // Un casier DE texte : le compilateur n'y laissera entrer que du texte.\n        Console.WriteLine(\"CASIER 118 — UN MOT DE PASSE DE CADENAS\");\n        Casier<string> casierTexte = new Casier<string>(118);\n        casierTexte.Deposer(\"4-7-2-9\");\n        Console.WriteLine($\"Contenu lu : {casierTexte.Ouvrir()}\");\n        Console.WriteLine($\"Contenu relu : {casierTexte.Ouvrir()}\");\n        Console.WriteLine($\"Ouvertures : {casierTexte.Ouvertures}\");\n        Console.WriteLine($\"Repris : {casierTexte.Reprendre()}\");\n        Console.WriteLine($\"Ouvertures après reprise : {casierTexte.Ouvertures}\");\n        Console.WriteLine($\"Casier encore occupé ? {casierTexte.Occupe}\");\n\n        Console.WriteLine();\n\n        // Le MÊME casier, avec un contenu d'un tout autre type. Aucune ligne recopiée.\n        Console.WriteLine(\"CASIER 204 — DES EFFETS PERSONNELS\");\n        Casier<Effet> casierEffets = new Casier<Effet>(204);\n        casierEffets.Deposer(new Effet(\"sacoche de vélo\", 4200));\n        Effet dedans = casierEffets.Ouvrir();\n        Console.WriteLine($\"Contenu : {dedans}\");\n        Console.WriteLine($\"Valeur déclarée : {dedans.ValeurCentimes / 100.0:F2} €\");\n        Console.WriteLine($\"Ouvertures : {casierEffets.Ouvertures}\");\n\n        // casierTexte.Deposer(42);          // refusé à la COMPILATION : ce casier ne prend que du texte\n        // casierEffets.Deposer(\"un mot\");   // refusé aussi : ni conversion, ni surprise à l'exécution\n\n        Console.WriteLine();\n\n        // Deux refus, l'un pour un casier déjà pris, l'autre pour un casier vide.\n        Console.WriteLine(\"DEUX GESTES IMPOSSIBLES\");\n        try\n        {\n            casierTexte.Deposer(\"autre chose\");\n            casierTexte.Deposer(\"et encore autre chose\");\n        }\n        catch (ArgumentException e)\n        {\n            Console.WriteLine($\"Refusé : {e.Message}\");\n        }\n\n        try\n        {\n            Casier<Effet> vide = new Casier<Effet>(999);\n            vide.Ouvrir();\n        }\n        catch (ArgumentException e)\n        {\n            Console.WriteLine($\"Refusé : {e.Message}\");\n        }\n\n        Console.WriteLine();\n\n        // Une méthode générique CONTRAINTE : T doit savoir se comparer, sinon rien ne compile.\n        Console.WriteLine(\"LE PLUS GRAND DE DEUX CHOSES COMPARABLES\");\n        Console.WriteLine($\"Entre 12 et 8 : {Maximum(12, 8)}\");\n        Console.WriteLine($\"Entre « Ana » et « Bram » : {Maximum(\"Ana\", \"Bram\")}\");\n        DateTime stage = new DateTime(2026, 7, 4);\n        DateTime gala = new DateTime(2026, 6, 12);\n        Console.WriteLine($\"Entre le stage et le gala : \"\n                        + $\"{Maximum(stage, gala).ToString(\"dd/MM/yyyy\")}\");\n\n        Console.WriteLine();\n\n        // Une méthode générique d'affichage : une seule, pour toutes les listes du programme.\n        List<int> numeros = new List<int>();\n        numeros.Add(118);\n        numeros.Add(204);\n        numeros.Add(77);\n        List<string> creneaux = new List<string>();\n        creneaux.Add(\"matin\");\n        creneaux.Add(\"midi\");\n        creneaux.Add(\"soir\");\n\n        Afficher(numeros, \"CASIERS EN SERVICE\");\n        Afficher(creneaux, \"CRÉNEAUX D'OUVERTURE\");\n    }\n\n    static void Echanger<T>(ref T a, ref T b)      // <T> après le nom : la méthode est paramétrée\n    {\n        T temp = a;\n        a = b;\n        b = temp;\n    }\n\n    static T Maximum<T>(T a, T b) where T : IComparable<T>   // la contrainte rend CompareTo possible\n    {\n        if (a.CompareTo(b) >= 0)\n        {\n            return a;\n        }\n        return b;\n    }\n\n    static void Afficher<T>(List<T> liste, string titre)\n    {\n        Console.WriteLine(titre);\n        foreach (T element in liste)\n        {\n            Console.WriteLine($\"  {element}\");\n        }\n        Console.WriteLine($\"  ({liste.Count} éléments)\");\n    }\n}\n\nclass Casier<T>                                    // une classe paramétrée : un casier DE T\n{\n    private T contenu;                             // le champ stocké est du type T, quel qu'il soit\n\n    public int Numero { get; private set; }\n    public int Ouvertures { get; private set; }    // un compteur, lui toujours entier\n    public bool Occupe { get; private set; }\n\n    public Casier(int numero)\n    {\n        if (numero <= 0)\n        {\n            throw new ArgumentException($\"numéro de casier {numero} impossible\");\n        }\n        this.Numero = numero;\n        this.Ouvertures = 0;\n        this.Occupe = false;\n    }\n\n    public void Deposer(T objet)                   // le paramètre est du type T\n    {\n        if (Occupe)\n        {\n            throw new ArgumentException($\"le casier {Numero} est déjà consigné\");\n        }\n        contenu = objet;\n        Occupe = true;\n    }\n\n    public T Ouvrir()                              // et le retour aussi\n    {\n        if (!Occupe)\n        {\n            throw new ArgumentException($\"le casier {Numero} est vide\");\n        }\n        Ouvertures++;\n        return contenu;\n    }\n\n    public T Reprendre()\n    {\n        T objet = Ouvrir();                        // réutilise le contrôle plutôt que de le recopier\n        Occupe = false;\n        return objet;\n    }\n}\n\nclass Effet\n{\n    public string Description { get; private set; }\n    public int ValeurCentimes { get; private set; }\n\n    public Effet(string description, int valeurCentimes)\n    {\n        if (valeurCentimes < 0)\n        {\n            throw new ArgumentException($\"valeur de {valeurCentimes} centimes impossible\");\n        }\n        this.Description = description;\n        this.ValeurCentimes = valeurCentimes;\n    }\n\n    public override string ToString()\n    {\n        return $\"{Description} ({ValeurCentimes / 100.0:F2} €)\";\n    }\n}",

      "enonce": "Un magasin de location tient deux dépôts. Écris d'abord un <strong>contrat</strong> exigeant de tout article une référence, une caution en centimes, un nombre de locations et une ligne de fichier. Écris ensuite une <strong>classe de dépôt paramétrée par un type</strong>, <strong>contrainte à ce contrat</strong>, portant un nom, un effectif en lecture seule, un ajout qui <strong>lance</strong> si la référence est déjà prise, une recherche qui <strong>lance</strong> si elle est absente, un total de cautions, un accès à la collection, et une sauvegarde qui écrit une ligne par article. Écris deux classes d'articles honorant le contrat : l'outil, qui porte en plus un diamètre de lame de 190 mm, et le véhicule, qui porte une charge utile. Remplis le dépôt « Outillage » avec O-01 perceuse 4 000 c 3 sorties, O-02 ponceuse 3 000 c 5 sorties, O-03 scie circulaire 6 000 c 2 sorties, O-04 échafaudage 12 000 c 1 sortie, et le dépôt « Roulant » avec V-01 remorque bagagère 15 000 c 6 sorties 750 kg, V-02 camionnette 50 000 c 4 sorties 1 400 kg, V-03 vélo cargo 20 000 c 9 sorties 80 kg. Présente les deux dépôts par une <strong>méthode paramétrée et contrainte</strong>, puis le nombre total d'articles et la caution immobilisée. Cherche O-03 et V-02 en affichant leur donnée propre, puis provoque et rattrape deux refus : un véhicule cherché dans l'outillage, et une référence en double. Rassemble ensuite les sept articles dans une liste <strong>du type du contrat</strong>, et donne la caution la plus lourde, la plus légère, la moyenne, le nombre d'articles à plus de 100 € de caution, les sorties cumulées et le nombre d'articles sortis au moins cinq fois. Ventile enfin par tranche de caution, donne le plus grand de quelques valeurs par une méthode contrainte, et sauvegarde les deux dépôts.",

      "solution": "// Le magasin de location : un seul dépôt, écrit une fois, tenu deux fois.\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Linq;\n\ninterface IArticle                       // le contrat que tout article loué doit honorer\n{\n    string Reference();\n    int CautionCentimes();\n    int Locations();\n    string EnLigne();\n}\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        Depot<Outil> outillage = new Depot<Outil>(\"Outillage\");\n        outillage.Ajouter(new Outil(\"O-01\", \"perceuse\", 4000, 3));\n        outillage.Ajouter(new Outil(\"O-02\", \"ponceuse\", 3000, 5));\n        outillage.Ajouter(new Outil(\"O-03\", \"scie circulaire\", 6000, 2));\n        outillage.Ajouter(new Outil(\"O-04\", \"échafaudage\", 12000, 1));\n\n        // La MÊME classe de dépôt, avec un contenu d'un autre type. Aucune ligne recopiée.\n        Depot<Vehicule> roulant = new Depot<Vehicule>(\"Roulant\");\n        roulant.Ajouter(new Vehicule(\"V-01\", \"remorque bagagère\", 15000, 6, 750));\n        roulant.Ajouter(new Vehicule(\"V-02\", \"camionnette\", 50000, 4, 1400));\n        roulant.Ajouter(new Vehicule(\"V-03\", \"vélo cargo\", 20000, 9, 80));\n\n        Console.WriteLine(\"LES DEUX DÉPÔTS\");\n        Presenter(outillage);\n        Presenter(roulant);\n\n        Console.WriteLine();\n\n        int cautionTotale = outillage.CautionTotaleCentimes() + roulant.CautionTotaleCentimes();\n        int articlesTotal = outillage.Nombre + roulant.Nombre;\n        Console.WriteLine($\"Articles au catalogue : {articlesTotal}\");\n        Console.WriteLine($\"Caution immobilisée : {cautionTotale / 100.0:F2} €\");\n\n        Console.WriteLine();\n\n        // La recherche est générique elle aussi : elle rend un Outil ici, un Vehicule là.\n        Console.WriteLine(\"DEUX RECHERCHES\");\n        Outil trouve = outillage.Chercher(\"O-03\");\n        Console.WriteLine($\"Trouvé dans l'outillage : {trouve} — {trouve.Diametre} mm de lame\");\n        Vehicule roule = roulant.Chercher(\"V-02\");\n        Console.WriteLine($\"Trouvé dans le roulant : {roule} — {roule.ChargeUtileKg} kg\");\n\n        try\n        {\n            outillage.Chercher(\"V-01\");        // un véhicule n'est pas rangé dans l'outillage\n        }\n        catch (ArgumentException e)\n        {\n            Console.WriteLine($\"Recherche vaine : {e.Message}\");\n        }\n\n        try\n        {\n            outillage.Ajouter(new Outil(\"O-01\", \"seconde perceuse\", 4000, 0));\n        }\n        catch (ArgumentException e)\n        {\n            Console.WriteLine($\"Ajout refusé : {e.Message}\");\n        }\n\n        Console.WriteLine();\n\n        // Le contrat suffit à interroger les deux dépôts de la même façon.\n        List<IArticle> catalogue = new List<IArticle>();\n        foreach (Outil o in outillage.Tout())\n        {\n            catalogue.Add(o);\n        }\n        foreach (Vehicule v in roulant.Tout())\n        {\n            catalogue.Add(v);\n        }\n\n        Console.WriteLine(\"LE CATALOGUE COMPLET\");\n        List<int> cautions = new List<int>();\n        List<int> sorties = new List<int>();\n        foreach (IArticle a in catalogue)\n        {\n            cautions.Add(a.CautionCentimes());\n            sorties.Add(a.Locations());\n        }\n        Console.WriteLine($\"Caution la plus lourde : {cautions.Max() / 100.0:F2} €\");\n        Console.WriteLine($\"Caution la plus légère : {cautions.Min() / 100.0:F2} €\");\n        Console.WriteLine($\"Caution moyenne : {cautions.Average() / 100.0:F2} €\");\n        Console.WriteLine($\"Articles à plus de 100 € de caution : {cautions.Count(x => x > 10000)}\");\n        Console.WriteLine($\"Sorties cumulées : {sorties.Sum()}\");\n        Console.WriteLine($\"Articles sortis au moins cinq fois : {sorties.Count(x => x >= 5)}\");\n\n        Console.WriteLine();\n\n        // Le motif compteur de la leçon 18, sur une clé calculée.\n        Dictionary<string, int> parTranche = new Dictionary<string, int>();\n        foreach (IArticle a in catalogue)\n        {\n            string tranche = Tranche(a.CautionCentimes());\n            if (!parTranche.ContainsKey(tranche))\n            {\n                parTranche[tranche] = 0;\n            }\n            parTranche[tranche]++;\n        }\n        Console.WriteLine(\"RÉPARTITION PAR TRANCHE DE CAUTION\");\n        foreach (var paire in parTranche.OrderBy(p => p.Key))\n        {\n            Console.WriteLine($\"{paire.Key} : {paire.Value} articles\");\n        }\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"LE PLUS DEMANDÉ DE CHAQUE DÉPÔT\");\n        Console.WriteLine($\"Outillage : {Maximum(3, Maximum(5, Maximum(2, 1)))} sorties\");\n        Console.WriteLine($\"Roulant : {Maximum(6, Maximum(4, 9))} sorties\");\n        Console.WriteLine($\"Référence la plus haute du catalogue : \"\n                        + $\"{Maximum(\"O-04\", \"V-03\")}\");\n\n        Console.WriteLine();\n\n        outillage.Sauver(\"depot-outillage.csv\");\n        roulant.Sauver(\"depot-roulant.csv\");\n        Console.WriteLine($\"{File.ReadAllLines(\"depot-outillage.csv\").Length} lignes dans \"\n                        + \"depot-outillage.csv\");\n        Console.WriteLine($\"{File.ReadAllLines(\"depot-roulant.csv\").Length} lignes dans \"\n                        + \"depot-roulant.csv\");\n    }\n\n    // Une méthode générique contrainte : elle accepte un dépôt de n'importe quel article.\n    static void Presenter<T>(Depot<T> depot) where T : IArticle\n    {\n        Console.WriteLine($\"Dépôt « {depot.Nom} » : {depot.Nombre} articles, \"\n                        + $\"{depot.CautionTotaleCentimes() / 100.0:F2} € de caution\");\n        foreach (T article in depot.Tout())\n        {\n            Console.WriteLine($\"  {article}\");\n        }\n    }\n\n    static T Maximum<T>(T a, T b) where T : IComparable<T>\n    {\n        if (a.CompareTo(b) >= 0)\n        {\n            return a;\n        }\n        return b;\n    }\n\n    static string Tranche(int cautionCentimes)\n    {\n        if (cautionCentimes < 5000)\n        {\n            return \"1. moins de 50 €\";\n        }\n        if (cautionCentimes < 20000)\n        {\n            return \"2. de 50 à 200 €\";\n        }\n        return \"3. 200 € et plus\";\n    }\n}\n\nclass Depot<T> where T : IArticle        // la contrainte rend Reference() et EnLigne() utilisables\n{\n    private List<T> articles = new List<T>();\n\n    public string Nom { get; private set; }\n\n    public Depot(string nom)\n    {\n        this.Nom = nom;\n    }\n\n    public int Nombre\n    {\n        get => articles.Count;\n    }\n\n    public void Ajouter(T article)\n    {\n        foreach (T existant in articles)\n        {\n            if (existant.Reference() == article.Reference())     // possible grâce à la contrainte\n            {\n                throw new ArgumentException($\"{Nom} : la référence {article.Reference()} est \"\n                                          + \"déjà prise\");\n            }\n        }\n        articles.Add(article);\n    }\n\n    public T Chercher(string reference)\n    {\n        foreach (T article in articles)\n        {\n            if (article.Reference() == reference)\n            {\n                return article;\n            }\n        }\n        throw new ArgumentException($\"{Nom} : aucune référence {reference}\");\n    }\n\n    public int CautionTotaleCentimes()\n    {\n        int total = 0;\n        foreach (T article in articles)\n        {\n            total += article.CautionCentimes();\n        }\n        return total;\n    }\n\n    public List<T> Tout()\n    {\n        return articles;\n    }\n\n    public void Sauver(string fichier)\n    {\n        List<string> lignes = new List<string>();\n        foreach (T article in articles)\n        {\n            lignes.Add(article.EnLigne());\n        }\n        File.WriteAllLines(fichier, lignes);\n    }\n}\n\nclass Outil : IArticle\n{\n    public string Code { get; private set; }\n    public string Nom { get; private set; }\n    public int Caution { get; private set; }\n    public int Sorties { get; private set; }\n    public int Diametre { get; private set; }\n\n    public Outil(string code, string nom, int caution, int sorties)\n    {\n        if (caution < 0)\n        {\n            throw new ArgumentException($\"{code} : caution de {caution} centimes impossible\");\n        }\n        this.Code = code;\n        this.Nom = nom;\n        this.Caution = caution;\n        this.Sorties = sorties;\n        this.Diametre = 190;\n    }\n\n    public string Reference()\n    {\n        return Code;\n    }\n\n    public int CautionCentimes()\n    {\n        return Caution;\n    }\n\n    public int Locations()\n    {\n        return Sorties;\n    }\n\n    public string EnLigne()\n    {\n        return $\"{Code};{Nom};{Caution};{Sorties}\";\n    }\n\n    public override string ToString()\n    {\n        return $\"{Code} — {Nom} — {Caution / 100.0:F2} € — {Sorties} sorties\";\n    }\n}\n\nclass Vehicule : IArticle\n{\n    public string Code { get; private set; }\n    public string Nom { get; private set; }\n    public int Caution { get; private set; }\n    public int Sorties { get; private set; }\n    public int ChargeUtileKg { get; private set; }\n\n    public Vehicule(string code, string nom, int caution, int sorties, int chargeUtileKg)\n    {\n        if (caution < 0)\n        {\n            throw new ArgumentException($\"{code} : caution de {caution} centimes impossible\");\n        }\n        this.Code = code;\n        this.Nom = nom;\n        this.Caution = caution;\n        this.Sorties = sorties;\n        this.ChargeUtileKg = chargeUtileKg;\n    }\n\n    public string Reference()\n    {\n        return Code;\n    }\n\n    public int CautionCentimes()\n    {\n        return Caution;\n    }\n\n    public int Locations()\n    {\n        return Sorties;\n    }\n\n    public string EnLigne()\n    {\n        return $\"{Code};{Nom};{Caution};{Sorties};{ChargeUtileKg}\";\n    }\n\n    public override string ToString()\n    {\n        return $\"{Code} — {Nom} — {Caution / 100.0:F2} € — {Sorties} sorties\";\n    }\n}",

      "enonce": "Dernier jour : le registre cesse d'être celui des réparations. Pars de ton fichier d'hier, avec ses six champs et son état en valeurs nommées. Écris un <strong>contrat</strong> n'exigeant que deux choses : une clé et une ligne de fichier. Écris ensuite une <strong>classe de registre paramétrée par un type et contrainte à ce contrat</strong>, portant un nom, un effectif en lecture seule, un ajout qui <strong>lance sur une clé déjà inscrite</strong>, un test d'appartenance, une recherche qui <strong>lance</strong> si la clé est absente, un accès à la collection, et une sauvegarde. Fais honorer ce contrat par la classe de réparation — sa clé est son code. Charge le registre des fiches depuis le fichier, affiche-le, puis provoque et rattrape deux refus : le réajout de R-01, et la recherche de R-42. Recalcule les statistiques d'hier — minutes et fiches par bénévole, temps total, durée moyenne à deux décimales —, puis obtiens la plus longue durée et le nom qui vient en dernier dans l'alphabet par une <strong>seule méthode paramétrée et contrainte</strong>, appelée deux fois sur deux types différents. Écris alors une classe de bénévole — nom, nombre de fiches, minutes — honorant <strong>le même contrat</strong>, sa clé étant son nom, et remplis un <strong>second registre</strong> de ce type à partir de tes structures, par ordre alphabétique. Affiche-le, teste l'appartenance de Nadia puis de Karim, cherche Bruno. Sauvegarde les deux registres et affiche le nombre de lignes de chacun. Termine par la vérification qui clôt la semaine : le total des minutes vu depuis les fiches et le total vu depuis l'équipe doivent coïncider.",

      "solution": "// Le repair café, jour 4 : le registre cesse d'être celui des réparations.\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Linq;\n\nenum Etat { Recu, EnCours, Repare, Irreparable }\n\ninterface IFichable                      // ce que le registre exige de tout ce qu'il range\n{\n    string Cle();\n    string EnLigne();\n}\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        const string SOURCE = \"repaircafe-v3.csv\";\n\n        if (!File.Exists(SOURCE))\n        {\n            Console.WriteLine(\"Registre introuvable : premier lancement, on l'écrit\");\n            List<string> seance = new List<string>();\n            seance.Add(\"R-01;grille-pain;Ilse;35;Repare;2026-02-07\");\n            seance.Add(\"R-02;vélo;Bruno;70;Repare;2026-02-07\");\n            seance.Add(\"R-03;lampe;Ilse;20;Irreparable;2026-02-07\");\n            seance.Add(\"R-04;machine à café;Nadia;95;EnCours;2026-03-07\");\n            seance.Add(\"R-05;vélo;Nadia;55;Repare;2026-03-07\");\n            seance.Add(\"R-06;radio;Bruno;40;Irreparable;2026-03-07\");\n            seance.Add(\"R-07;grille-pain;Ilse;25;Repare;2026-04-04\");\n            seance.Add(\"R-08;aspirateur;Bruno;80;EnCours;2026-04-04\");\n            seance.Add(\"R-09;bouilloire;Nadia;45;Recu;2026-04-04\");\n            File.WriteAllLines(SOURCE, seance);\n        }\n        else\n        {\n            Console.WriteLine(\"Registre trouvé : on repart de la séance précédente\");\n        }\n\n        // Premier usage du registre : il range des réparations.\n        Registre<Reparation> fiches = new Registre<Reparation>(\"Fiches de réparation\");\n        foreach (string ligne in File.ReadAllLines(SOURCE))\n        {\n            if (ligne == \"\")\n            {\n                continue;\n            }\n            fiches.Ajouter(Reparation.DepuisLigne(ligne));\n        }\n        Console.WriteLine($\"{fiches.Nom} : {fiches.Nombre} entrées\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"LES FICHES\");\n        foreach (Reparation r in fiches.Tout())\n        {\n            Console.WriteLine($\"  {r}\");\n        }\n\n        // La clé est unique : le registre le garantit, quel que soit ce qu'il range.\n        try\n        {\n            fiches.Ajouter(Reparation.DepuisLigne(\"R-01;grille-pain;Ilse;35;Repare;2026-02-07\"));\n        }\n        catch (ArgumentException e)\n        {\n            Console.WriteLine($\"Doublon refusé : {e.Message}\");\n        }\n\n        try\n        {\n            fiches.Chercher(\"R-42\");\n        }\n        catch (ArgumentException e)\n        {\n            Console.WriteLine($\"Recherche vaine : {e.Message}\");\n        }\n\n        Console.WriteLine();\n\n        // Les statistiques d'hier, inchangées.\n        Dictionary<string, int> minutesParBenevole = new Dictionary<string, int>();\n        Dictionary<string, int> fichesParBenevole = new Dictionary<string, int>();\n        List<int> durees = new List<int>();\n        foreach (Reparation r in fiches.Tout())\n        {\n            if (!minutesParBenevole.ContainsKey(r.Benevole))\n            {\n                minutesParBenevole[r.Benevole] = 0;\n                fichesParBenevole[r.Benevole] = 0;\n            }\n            minutesParBenevole[r.Benevole] += r.DureeMinutes;\n            fichesParBenevole[r.Benevole]++;\n            durees.Add(r.DureeMinutes);\n        }\n        Console.WriteLine($\"Temps d'atelier : {durees.Sum()} minutes\");\n        Console.WriteLine($\"Durée moyenne : {durees.Average():F2} minutes\");\n        Console.WriteLine($\"La plus longue, par la méthode générique : \"\n                        + $\"{Maximum(durees)} minutes\");\n        List<string> noms = new List<string>();\n        foreach (string nom in minutesParBenevole.Keys)\n        {\n            noms.Add(nom);\n        }\n        Console.WriteLine($\"Le nom qui vient en dernier dans l'alphabet : {Maximum(noms)}\");\n\n        Console.WriteLine();\n\n        // SECOND usage du même registre : il range maintenant des bénévoles. Pas une ligne réécrite.\n        Registre<Benevole> equipe = new Registre<Benevole>(\"Équipe du soir\");\n        foreach (var paire in minutesParBenevole.OrderBy(p => p.Key))\n        {\n            equipe.Ajouter(new Benevole(paire.Key, fichesParBenevole[paire.Key], paire.Value));\n        }\n        Console.WriteLine($\"{equipe.Nom} : {equipe.Nombre} entrées\");\n        foreach (Benevole b in equipe.Tout())\n        {\n            Console.WriteLine($\"  {b}\");\n        }\n\n        Console.WriteLine($\"Nadia est-elle inscrite ? {equipe.Contient(\"Nadia\")}\");\n        Console.WriteLine($\"Karim est-il inscrit ? {equipe.Contient(\"Karim\")}\");\n        Console.WriteLine($\"Fiche de Bruno : {equipe.Chercher(\"Bruno\")}\");\n\n        Console.WriteLine();\n\n        // Et la sauvegarde marche pour les deux, sans que le registre sache ce qu'il écrit.\n        fiches.Sauver(\"registre-fiches.csv\");\n        equipe.Sauver(\"registre-equipe.csv\");\n        Console.WriteLine($\"{File.ReadAllLines(\"registre-fiches.csv\").Length} lignes dans \"\n                        + \"registre-fiches.csv\");\n        Console.WriteLine($\"{File.ReadAllLines(\"registre-equipe.csv\").Length} lignes dans \"\n                        + \"registre-equipe.csv\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"CE QUE LA SEMAINE A PRODUIT\");\n        Console.WriteLine(\"Une classe de registre, écrite une fois, utilisée deux fois\");\n        Console.WriteLine($\"Total des minutes vu depuis les fiches : {durees.Sum()}\");\n        int viaEquipe = 0;\n        foreach (Benevole b in equipe.Tout())\n        {\n            viaEquipe += b.Minutes;\n        }\n        Console.WriteLine($\"Total des minutes vu depuis l'équipe : {viaEquipe}\");\n        Console.WriteLine($\"Les deux registres racontent la même séance : \"\n                        + $\"{durees.Sum() == viaEquipe}\");\n    }\n\n    static T Maximum<T>(List<T> liste) where T : IComparable<T>\n    {\n        T champion = liste[0];\n        foreach (T element in liste)\n        {\n            if (element.CompareTo(champion) > 0)\n            {\n                champion = element;\n            }\n        }\n        return champion;\n    }\n}\n\nclass Registre<T> where T : IFichable    // la contrainte rend Cle() et EnLigne() utilisables\n{\n    private List<T> entrees = new List<T>();\n\n    public string Nom { get; private set; }\n\n    public Registre(string nom)\n    {\n        this.Nom = nom;\n    }\n\n    public int Nombre\n    {\n        get => entrees.Count;\n    }\n\n    public void Ajouter(T entree)\n    {\n        if (Contient(entree.Cle()))\n        {\n            throw new ArgumentException($\"{Nom} : la clé {entree.Cle()} est déjà inscrite\");\n        }\n        entrees.Add(entree);\n    }\n\n    public bool Contient(string cle)\n    {\n        foreach (T entree in entrees)\n        {\n            if (entree.Cle() == cle)\n            {\n                return true;\n            }\n        }\n        return false;\n    }\n\n    public T Chercher(string cle)\n    {\n        foreach (T entree in entrees)\n        {\n            if (entree.Cle() == cle)\n            {\n                return entree;\n            }\n        }\n        throw new ArgumentException($\"{Nom} : aucune entrée sous la clé {cle}\");\n    }\n\n    public List<T> Tout()\n    {\n        return entrees;\n    }\n\n    public void Sauver(string fichier)\n    {\n        List<string> lignes = new List<string>();\n        foreach (T entree in entrees)\n        {\n            lignes.Add(entree.EnLigne());\n        }\n        File.WriteAllLines(fichier, lignes);\n    }\n}\n\nclass Reparation : IFichable\n{\n    public string Code { get; private set; }\n    public string Objet { get; private set; }\n    public string Benevole { get; private set; }\n    public int DureeMinutes { get; private set; }\n    public Etat Statut { get; private set; }\n    public DateTime Depot { get; private set; }\n\n    public Reparation(string code, string objet, string benevole, int dureeMinutes,\n                      Etat statut, DateTime depot)\n    {\n        if (dureeMinutes <= 0)\n        {\n            throw new ArgumentException($\"{code} : durée de {dureeMinutes} minutes impossible\");\n        }\n        this.Code = code;\n        this.Objet = objet;\n        this.Benevole = benevole;\n        this.DureeMinutes = dureeMinutes;\n        this.Statut = statut;\n        this.Depot = depot;\n    }\n\n    public static Reparation DepuisLigne(string ligne)\n    {\n        string[] champs = ligne.Split(';');\n        if (champs.Length != 6)\n        {\n            throw new ArgumentException($\"« {ligne} » : six champs attendus\");\n        }\n        Etat statut = LireEtat(champs[4]);\n        string[] date = champs[5].Split('-');\n        DateTime depot = new DateTime(int.Parse(date[0]), int.Parse(date[1]),\n                                      int.Parse(date[2]));\n        return new Reparation(champs[0], champs[1], champs[2], int.Parse(champs[3]),\n                              statut, depot);\n    }\n\n    static Etat LireEtat(string texte)\n    {\n        return texte switch\n        {\n            \"Recu\" => Etat.Recu,\n            \"EnCours\" => Etat.EnCours,\n            \"Repare\" => Etat.Repare,\n            \"Irreparable\" => Etat.Irreparable,\n            _ => throw new ArgumentException($\"état « {texte} » inconnu\")\n        };\n    }\n\n    public string Cle()\n    {\n        return Code;\n    }\n\n    public string EnLigne()\n    {\n        return $\"{Code};{Objet};{Benevole};{DureeMinutes};{Statut};\"\n             + $\"{Depot.ToString(\"yyyy-MM-dd\")}\";\n    }\n\n    public override string ToString()\n    {\n        return $\"{Code} — {Objet} — {Benevole} — {DureeMinutes} min — {Statut}\";\n    }\n}\n\nclass Benevole : IFichable\n{\n    public string Nom { get; private set; }\n    public int Fiches { get; private set; }\n    public int Minutes { get; private set; }\n\n    public Benevole(string nom, int fiches, int minutes)\n    {\n        if (fiches < 0 || minutes < 0)\n        {\n            throw new ArgumentException($\"{nom} : compteurs négatifs impossibles\");\n        }\n        this.Nom = nom;\n        this.Fiches = fiches;\n        this.Minutes = minutes;\n    }\n\n    public string Cle()\n    {\n        return Nom;\n    }\n\n    public string EnLigne()\n    {\n        return $\"{Nom};{Fiches};{Minutes}\";\n    }\n\n    public override string ToString()\n    {\n        return $\"{Nom} — {Fiches} fiches — {Minutes} min\";\n    }\n}",
      "pourquoi": "En quatre jours, la même séance de repair café a servi à quatre choses : faire survivre des données à la fermeture, remplacer un parcours par une structure, remplacer des mots par des valeurs vérifiées, et enfin rendre le rangement indépendant de ce qu'il range. Aucun de ces quatre pas n'a modifié les chiffres de la séance — les 465 minutes de lundi sont encore là vendredi. C'est ce qui permet de vérifier qu'aucune étape n'a rien cassé.",
