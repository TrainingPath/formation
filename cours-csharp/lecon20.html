<script>
var DAY = {
  num: 20,
  title: "Les génériques",
  subtitle: "Un seul code qui marche pour TOUS les types : la boîte étiquetée du C#.",
  theory: `
<h3>1. Le problème : réécrire le même code pour chaque type</h3>
<p>Imagine une fonction qui échange deux valeurs. Tu en écris une pour les <code>int</code>, une autre pour les <code>string</code>, une pour les <code>Tache</code>… le même code recopié dix fois. Les <strong>génériques</strong> (generics) résolvent cela : ce sont des <em>patrons de code</em> paramétrés par un type, comme un moule à gâteau qui accepte n'importe quelle pâte. On écrit UNE fois, ça marche pour TOUS les types.</p>
<p>Le <strong>paramètre de type</strong> (type parameter), noté par convention <code>T</code> (pour « Type »), est une étiquette-mystère : à la compilation, C# la remplace par le vrai type que tu fournis. C'est comme un carton d'emballage sur lequel tu écris au feutre le contenu au dernier moment.</p>

<h3>2. Les génériques, tu les utilises déjà</h3>
<pre class="pseudo">List&lt;string&gt; taches = new List&lt;string&gt;();   // List&lt;T&gt; : ici T = string, une liste de chaînes
Dictionary&lt;string, int&gt; scores;               // Dictionary&lt;K, V&gt; : deux paramètres, clé et valeur
Nullable&lt;int&gt; age;                             // Nullable&lt;T&gt; : un int qui peut aussi être null</pre>
<p>Le <code>&lt;T&gt;</code> entre chevrons se lit « de T ». <code>List&lt;string&gt;</code> = « liste DE string ». Le compilateur garantit alors qu'on n'y mettra QUE des string : sécurité de type gratuite.</p>
<div class="tip">Avant les génériques (vieux C# / vieux Java), on stockait des <code>object</code> et on castait à la main, avec risque d'erreur à l'exécution. Les génériques déplacent la vérification à la COMPILATION : les bugs sont attrapés avant même de lancer le programme.</div>

<h3>3. Écrire sa propre MÉTHODE générique</h3>
<pre class="pseudo">static void Echanger&lt;T&gt;(ref T a, ref T b)   // &lt;T&gt; après le nom : cette méthode est paramétrée par T
{                                            // ref = on modifie les variables d'origine (leçon passages)
    T temp = a;                              // temp est du type T, quel qu'il soit
    a = b;                                   // on copie b dans a
    b = temp;                                // et l'ancien a (gardé dans temp) dans b
}
// Utilisation : le type est DEDUIT automatiquement des arguments
int x = 1, y = 2;                            // deux entiers
Echanger(ref x, ref y);                      // C# comprend T = int tout seul
string p = "Ana", q = "Bob";                 // deux chaînes
Echanger(ref p, ref q);                      // ici T = string : MÊME méthode, aucun code recopié</pre>
<div class="tip">On dit que C# fait de l'<strong>inférence de type</strong> (type inference) : il devine <code>T</code> à partir des arguments, tu n'écris pas <code>Echanger&lt;int&gt;(...)</code> — même si tu le peux.</div>

<h3>4. Écrire sa propre CLASSE générique</h3>
<p>Thème Ludothèque : une petite « boîte » qui range un objet et retient combien de fois on l'a consulté.</p>
<pre class="pseudo">class Boite&lt;T&gt;                               // une classe paramétrée : Boite DE T
{                                            // début de la classe
    private T contenu;                       // le champ stocké est du type T
    public int Consultations = 0;            // un compteur, lui toujours int
    public Boite(T valeur) { contenu = valeur; }  // le constructeur reçoit un T
    public T Ouvrir()                        // renvoie le contenu, du type T
    {                                        // début de la méthode
        Consultations++;                     // on note une consultation de plus
        return contenu;                      // on rend le contenu
    }                                        // fin de la méthode
}                                            // fin de la classe
// Utilisation
Boite&lt;string&gt; jeu = new Boite&lt;string&gt;("Catan"); // une boîte DE string
Console.WriteLine(jeu.Ouvrir());             // affiche « Catan », Consultations passe à 1</pre>

<h3>5. Les contraintes : where T</h3>
<p>Parfois T ne peut pas être n'importe quoi : on veut pouvoir le comparer, ou qu'il ait un constructeur. Une <strong>contrainte</strong> (constraint) restreint les types autorisés — comme préciser « accepte tout colis, MAIS seulement s'il rentre dans la boîte aux lettres ».</p>
<pre class="pseudo">static T Max&lt;T&gt;(T a, T b) where T : IComparable&lt;T&gt;  // T doit savoir se comparer (méthode CompareTo)
{                                                   // sinon a.CompareTo(b) n'existerait pas
    return a.CompareTo(b) &gt;= 0 ? a : b;             // CompareTo &gt;= 0 : a est &gt;= b
}                                                   // marche pour int, string, DateTime…</pre>
<p>Contraintes courantes : <code>where T : class</code> (un type référence), <code>where T : struct</code> (un type valeur), <code>where T : new()</code> (possède un constructeur sans argument), <code>where T : IComparable&lt;T&gt;</code> (implémente une interface).</p>
<div class="warn">Sans la contrainte <code>where T : IComparable&lt;T&gt;</code>, la ligne <code>a.CompareTo(b)</code> ne compilerait pas : rien ne garantit que T sache se comparer. La contrainte est une PROMESSE que le compilateur peut vérifier.</div>

<h3>6. Pourquoi c'est un progrès</h3>
<p>Génériques = <strong>réutilisation</strong> (un code, tous les types) + <strong>sécurité</strong> (erreurs attrapées à la compilation) + <strong>performance</strong> (pas de conversion object/cast coûteuse). C'est la fondation de toutes les collections du .NET.</p>`,
  exercises: [
    { type: "qcm", q: "À quoi sert un générique ?", opts: ["À trier plus vite", "À écrire UN code réutilisable pour PLUSIEURS types (un moule à gâteau)", "À créer des fichiers", "À gérer les erreurs"], a: 1, exp: "Un patron de code paramétré par un type." },
    { type: "qcm", q: "Dans <code>List&lt;string&gt;</code>, que représente <code>string</code> ?", opts: ["Le nom de la variable", "Le type des éléments (le paramètre de type)", "Une méthode", "Une contrainte"], a: 1, exp: "List DE string : T vaut string." },
    { type: "qcm", q: "Par convention, le paramètre de type s'écrit souvent…", opts: ["X", "T (pour Type)", "int", "obj"], a: 1, exp: "T, U, V, ou TKey/TValue pour les dictionnaires." },
    { type: "vf", q: "<code>Dictionary&lt;K, V&gt;</code> possède DEUX paramètres de type.", a: true, exp: "Un pour la clé (K), un pour la valeur (V)." },
    { type: "qcm", q: "Quel est l'intérêt de sécurité des génériques ?", opts: ["Le code va plus vite à écrire", "Les erreurs de type sont attrapées à la COMPILATION, pas à l'exécution", "Ils cachent les bugs", "Aucun"], a: 1, exp: "Le compilateur vérifie avant de lancer le programme." },
    { type: "qcm", q: "Dans <code>static void Echanger&lt;T&gt;(ref T a, ref T b)</code>, où déclare-t-on T ?", opts: ["Nulle part", "Entre chevrons juste après le nom de la méthode", "Dans le corps", "Dans le return"], a: 1, exp: "&lt;T&gt; après le nom déclare le paramètre de type." },
    { type: "qcm", q: "Appel <code>Echanger(ref x, ref y)</code> avec deux int : que fait C# pour T ?", opts: ["Il refuse", "Il DÉDUIT T = int par inférence de type", "Il met T = object", "Il demande à l'utilisateur"], a: 1, exp: "L'inférence devine T à partir des arguments." },
    { type: "vf", q: "On peut écrire explicitement <code>Echanger&lt;int&gt;(ref x, ref y)</code> même si l'inférence suffit.", a: true, exp: "Explicite ou déduit, les deux marchent." },
    { type: "qcm", q: "Dans <code>class Boite&lt;T&gt;</code> avec <code>private T contenu;</code>, le champ contenu est…", opts: ["Toujours un int", "Du type T, donc du type choisi à l'instanciation", "Une string", "Interdit"], a: 1, exp: "Le champ prend le type fourni : Boite&lt;string&gt; → contenu est string." },
    { type: "qcm", q: "À quoi sert <code>where T : IComparable&lt;T&gt;</code> ?", opts: ["À trier la liste", "À garantir que T sait se comparer (CompareTo), sinon le code ne compile pas", "À créer T", "À afficher T"], a: 1, exp: "Une contrainte : une promesse vérifiée par le compilateur." },
    { type: "qcm", q: "Que signifie la contrainte <code>where T : new()</code> ?", opts: ["T est un nombre", "T possède un constructeur sans argument", "T est nouveau", "T est null"], a: 1, exp: "Permet de faire new T() à l'intérieur." },
    { type: "vf", q: "Sans contrainte, on peut appeler n'importe quelle méthode sur un T.", a: false, exp: "Sans contrainte, T est traité comme object : seules les méthodes d'object sont sûres." },
    { type: "qcm", q: "<code>where T : struct</code> exige que T soit…", opts: ["Un type référence", "Un type valeur (int, double, struct…)", "Une string", "Une interface"], a: 1, exp: "struct = type valeur ; class = type référence." },
    { type: "qcm", q: "Quel bénéfice de performance apportent les génériques (vs stocker des object) ?", opts: ["Aucun", "Ils évitent les conversions object/cast coûteuses", "Ils compressent la mémoire", "Ils multiplient les threads"], a: 1, exp: "Pas de boxing/cast : plus rapide et sûr." },
    { type: "qcm", q: "Les collections .NET (List, Dictionary, Queue…) reposent sur…", opts: ["Les fichiers", "Les génériques", "Random", "Les exceptions"], a: 1, exp: "Toute la bibliothèque de collections est générique." }
  ],
  final: {
    title: "Exercice final — Une pile générique pour la Ludothèque",
    intro: `<p>On modélise une pile (Stack) de « choses » à ranger : le dernier posé est le premier repris (LIFO). Grâce aux génériques, cette pile marche pour des string, des int, des Jeu…</p>
<pre class="pseudo">class Pile&lt;T&gt;                                  // une pile DE T, réutilisable
{                                              // début de la classe
    private List&lt;T&gt; elements = new List&lt;T&gt;();  // stockage interne, lui aussi générique
    public int Taille =&gt; elements.Count;       // propriété : nombre d'éléments
    public void Empiler(T x) { elements.Add(x); }             // poser au sommet
    public T Depiler()                          // retirer et renvoyer le sommet
    {                                           // début
        T dernier = elements[elements.Count - 1]; // le dernier élément
        elements.RemoveAt(elements.Count - 1);  // on le retire
        return dernier;                         // on le rend
    }                                           // fin
}
Pile&lt;string&gt; p = new Pile&lt;string&gt;();          // (1) une pile de string
p.Empiler("Uno"); p.Empiler("Catan");          // (2) deux jeux empilés
string haut = p.Depiler();                      // (3) qu'obtient-on ?</pre>`,
    questions: [
      { type: "qcm", q: "(1) <code>new Pile&lt;string&gt;()</code> : de quel type sont les éléments de cette pile ?", opts: ["int", "string : T vaut string", "object", "Pile"], a: 1, exp: "Le paramètre de type fixe le contenu autorisé." },
      { type: "qcm", q: "(2) Après les deux Empiler, que vaut <code>p.Taille</code> ?", opts: ["0", "2", "1", "Erreur"], a: 1, exp: "Deux éléments empilés, Count = 2." },
      { type: "qcm", q: "(3) Que vaut <code>haut</code> après Depiler ?", opts: ["Uno", "Catan : la pile est LIFO, on reprend le dernier empilé", "null", "Erreur"], a: 1, exp: "Dernier posé, premier repris." },
      { type: "vf", q: "La même classe Pile&lt;T&gt; pourrait stocker des int sans rien réécrire.", a: true, exp: "Il suffit d'instancier Pile&lt;int&gt; : c'est tout l'intérêt du générique." },
      { type: "qcm", q: "Pourquoi le champ interne est <code>List&lt;T&gt;</code> et pas <code>List&lt;string&gt;</code> ?", opts: ["Par erreur", "Pour que la pile reste générique : elements suit le T de la classe", "Pour aller plus vite", "Aucune raison"], a: 1, exp: "T se propage : la pile s'adapte à n'importe quel type." }
    ],
    solution: `<pre class="pseudo">Pile&lt;string&gt; → elements est une List&lt;string&gt;   // T = string partout
Empiler("Uno")   → [Uno]                        // ajout au bout
Empiler("Catan") → [Uno, Catan]                 // Taille = 2
Depiler()        → retire et renvoie "Catan"    // LIFO : le dernier
haut = "Catan"   · Taille redevient 1           // état final</pre>
<p>Un seul code, mille usages : <code>Pile&lt;int&gt;</code>, <code>Pile&lt;Jeu&gt;</code>… Les génériques sont la brique de base des collections. Prochaine étape : interroger ces collections avec LINQ.</p>`
  }
};

    statement: "Écris une classe générique <code>Paire&lt;A, B&gt;</code> qui stocke deux valeurs de types éventuellement différents (Premier, Second) via un constructeur, et une méthode <code>Afficher()</code> qui écrit les deux. Teste-la avec une Paire&lt;string, int&gt; (\"Age\", 30).",

      "Dans Afficher(), une interpolation $\"{Premier} = {Second}\" suffit."
    ],
    solution: "using System;                                       // accès à Console\n\nclass Paire<A, B>                                   // classe générique à DEUX paramètres de type\n{                                                   // début de la classe\n    public A Premier;                               // premier champ, du type A\n    public B Second;                                // second champ, du type B\n    public Paire(A premier, B second)               // constructeur recevant un A et un B\n    {                                               // début du constructeur\n        Premier = premier;                          // on range le premier\n        Second = second;                            // on range le second\n    }                                               // fin du constructeur\n    public void Afficher()                          // méthode d'affichage\n    {                                               // début\n        Console.WriteLine($\"{Premier} = {Second}\"); // affiche les deux valeurs\n    }                                               // fin\n}                                                   // fin de la classe\n\nclass Programme                                     // classe de test\n{                                                   // début\n    static void Main()                              // point d'entrée\n    {                                               // début de Main\n        Paire<string, int> p = new Paire<string, int>(\"Age\", 30); // A = string, B = int\n        p.Afficher();                               // affiche « Age = 30 »\n    }                                               // fin de Main\n}                                                   // fin de la classe",
    note: "Deux types différents dans la même classe : A et B sont indépendants. C'est exactement ainsi qu'est bâti KeyValuePair<K, V> du .NET." }
