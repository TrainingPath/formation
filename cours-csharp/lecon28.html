<script>
var DAY = {
  num: 28,
  title: "Tests unitaires avec xUnit",
  subtitle: "Écrire du code qui vérifie automatiquement ton code : le filet de sécurité.",
  theory: `
<h3>1. Pourquoi tester ?</h3>
<p>Un <strong>test unitaire</strong> (unit test) est un petit bout de code qui vérifie AUTOMATIQUEMENT qu'une fonction fait bien ce qu'elle promet. C'est un contrôle qualité à la sortie de l'usine : au lieu de relancer le programme et vérifier À LA MAIN à chaque changement, une machine appuie sur les boutons et compare le résultat attendu au résultat obtenu. Si tu casses quelque chose plus tard, le test t'alerte immédiatement.</p>
<p><strong>xUnit</strong> est l'une des bibliothèques de test les plus utilisées en C#. On installe son paquet, on écrit des méthodes de test, et un « lanceur » les exécute toutes.</p>

<h3>2. Anatomie d'un test : l'attribut [Fact]</h3>
<p>Un <strong>attribut</strong> (attribute) est une étiquette entre crochets posée sur une méthode pour lui donner un rôle. <code>[Fact]</code> signale à xUnit : « ceci est un test, exécute-le ».</p>
<pre class="pseudo">using Xunit;                          // accès à [Fact] et Assert

public class CalculTests               // une classe qui regroupe des tests
{                                      // début
    [Fact]                             // étiquette : cette méthode est un test
    public void Addition_DeuxPlusTrois_DonneCinq()  // nom EXPLICITE : ce qu'on teste
    {                                  // début du test
        int resultat = Calcul.Additionner(2, 3);    // on exécute le code à vérifier
        Assert.Equal(5, resultat);     // on AFFIRME : le résultat DOIT valoir 5
    }                                  // fin du test
}</pre>
<div class="tip">Convention de nom : <code>Methode_Situation_ResultatAttendu</code>. Un bon nom de test décrit le scénario : on comprend l'intention sans lire le corps.</div>

<h3>3. Le patron AAA : Arrange, Act, Assert</h3>
<p>Un test bien structuré suit trois temps, comme une recette :</p>
<pre class="pseudo">[Fact]
public void Panier_AjoutDeuxArticles_TotalCorrect()
{                                       // début
    // Arrange : on PRÉPARE les données et l'objet à tester
    Panier p = new Panier();            // on met en place
    // Act : on EXÉCUTE l'action à vérifier
    p.Ajouter(10); p.Ajouter(5);        // l'action
    // Assert : on VÉRIFIE le résultat attendu
    Assert.Equal(15, p.Total);          // le total doit être 15
}</pre>

<h3>4. Les assertions : affirmer le résultat</h3>
<p>Une <strong>assertion</strong> (assertion) est une affirmation vérifiée : si elle est fausse, le test ÉCHOUE. xUnit fournit une panoplie :</p>
<pre class="pseudo">Assert.Equal(attendu, obtenu);        // les deux valeurs sont-elles égales ?
Assert.True(condition);               // la condition est-elle vraie ?
Assert.False(condition);              // …fausse ?
Assert.Null(objet);                   // l'objet est-il null ?
Assert.NotNull(objet);                // …non null ?
Assert.Contains("a", liste);          // la liste contient-elle cet élément ?
Assert.Throws&lt;FormatException&gt;(() =&gt; int.Parse("abc")); // ce code lève-t-il bien CETTE exception ?</pre>
<div class="warn">Ordre d'<code>Assert.Equal</code> : la valeur ATTENDUE en PREMIER, l'obtenue en second. <code>Assert.Equal(5, resultat)</code> se lit « j'attends 5, voici ce que j'ai obtenu ».</div>

<h3>5. Tester plusieurs cas d'un coup : [Theory] et [InlineData]</h3>
<p>Pour tester la même logique avec plusieurs jeux de valeurs, on remplace <code>[Fact]</code> par <code>[Theory]</code> et on fournit les données avec <code>[InlineData]</code> : un seul test, plusieurs exécutions.</p>
<pre class="pseudo">[Theory]                              // test PARAMÉTRÉ
[InlineData(2, 3, 5)]                 // 1er jeu : 2 + 3 doit donner 5
[InlineData(0, 0, 0)]                 // 2e jeu
[InlineData(-1, 1, 0)]                // 3e jeu
public void Addition_Cas(int a, int b, int attendu)  // les données arrivent en paramètres
{                                     // début
    Assert.Equal(attendu, Calcul.Additionner(a, b)); // même assertion, données variables
}</pre>

<h3>6. Ce qu'un bon test t'apporte</h3>
<p>Tester, c'est : détecter une régression (un bug réintroduit) dès qu'elle apparaît, documenter le comportement attendu (le test dit ce que le code DOIT faire), et refactorer sans peur (si les tests passent toujours, tu n'as rien cassé). Un test doit être RAPIDE, INDÉPENDANT des autres, et RÉPÉTABLE (même résultat à chaque fois).</p>`,
  exercises: [
    { type: "qcm", q: "Un test unitaire sert à…", opts: ["Accélérer le code", "Vérifier AUTOMATIQUEMENT qu'une fonction fait ce qu'elle promet", "Compiler plus vite", "Créer des fichiers"], a: 1, exp: "Un contrôle qualité automatisé." },
    { type: "qcm", q: "xUnit est…", opts: ["Un langage", "Une bibliothèque de tests très utilisée en C#", "Un éditeur", "Une base de données"], a: 1, exp: "L'un des frameworks de test standard en .NET." },
    { type: "qcm", q: "L'attribut <code>[Fact]</code> signale…", opts: ["Une classe", "Que la méthode est un TEST à exécuter par xUnit", "Une boucle", "Une erreur"], a: 1, exp: "Une étiquette : 'ceci est un test'." },
    { type: "qcm", q: "Un attribut (comme [Fact]) est…", opts: ["Une variable", "Une étiquette entre crochets posée sur une méthode pour lui donner un rôle", "Un type", "Une exception"], a: 1, exp: "Métadonnée décorant du code." },
    { type: "qcm", q: "La convention de nommage d'un test est…", opts: ["test1, test2…", "Methode_Situation_ResultatAttendu (nom explicite du scénario)", "Le nom de la classe", "Peu importe"], a: 1, exp: "On lit l'intention sans lire le corps." },
    { type: "qcm", q: "Que veut dire le patron AAA ?", opts: ["Trois assertions", "Arrange (préparer), Act (exécuter), Assert (vérifier)", "Ajouter Ajouter Ajouter", "Async Await Assert"], a: 1, exp: "Les trois temps d'un test lisible." },
    { type: "qcm", q: "La phase 'Act' d'un test correspond à…", opts: ["Préparer les données", "EXÉCUTER l'action à vérifier", "Vérifier le résultat", "Nettoyer"], a: 1, exp: "Act = on déclenche le comportement testé." },
    { type: "qcm", q: "Une assertion est…", opts: ["Une boucle", "Une AFFIRMATION vérifiée : si elle est fausse, le test échoue", "Un attribut", "Une classe"], a: 1, exp: "Assert.Equal, Assert.True, etc." },
    { type: "qcm", q: "Dans <code>Assert.Equal(5, resultat)</code>, quel argument est la valeur ATTENDUE ?", opts: ["resultat", "5 : l'attendu vient en PREMIER", "Les deux", "Aucun"], a: 1, exp: "Convention : attendu d'abord, obtenu ensuite." },
    { type: "qcm", q: "<code>Assert.Throws&lt;FormatException&gt;(() =&gt; ...)</code> vérifie que…", opts: ["Aucune erreur ne survient", "Le code lève bien CETTE exception précise", "Le résultat est 0", "La liste est vide"], a: 1, exp: "On teste qu'une exception attendue se produit." },
    { type: "qcm", q: "L'attribut <code>[Theory]</code> sert à…", opts: ["Documenter", "Tester la MÊME logique avec plusieurs jeux de données", "Créer une classe", "Ignorer un test"], a: 1, exp: "Un test paramétré, exécuté pour chaque jeu." },
    { type: "qcm", q: "<code>[InlineData(2, 3, 5)]</code> fournit…", opts: ["Une exception", "Un jeu de valeurs passé en paramètres au test [Theory]", "Un attribut de classe", "Un commentaire"], a: 1, exp: "Chaque InlineData = une exécution du test." },
    { type: "vf", q: "Un bon test doit être rapide, indépendant des autres et répétable (même résultat à chaque fois).", a: true, exp: "Trois qualités essentielles d'un test fiable." },
    { type: "qcm", q: "Grâce aux tests, on peut refactorer (réécrire) le code…", opts: ["Jamais", "Sans peur : si les tests passent toujours, on n'a rien cassé", "Uniquement le vendredi", "En désactivant xUnit"], a: 1, exp: "Les tests protègent contre les régressions." },
    { type: "qcm", q: "Une 'régression', c'est…", opts: ["Une amélioration", "Un bug réintroduit par un changement, que les tests détectent", "Un test lent", "Un attribut"], a: 1, exp: "Les tests attrapent les régressions tôt." }
  ],
  final: {
    title: "Exercice final — Tester une classe Panier",
    intro: `<p>On teste une classe <code>Panier</code> qui additionne des prix et calcule une remise. Voici les tests xUnit.</p>
<pre class="pseudo">public class PanierTests
{
    [Fact]                                          // (1) un test simple
    public void Total_DeuxArticles_Somme()
    {
        Panier p = new Panier();                    //     Arrange
        p.Ajouter(10); p.Ajouter(5);                //     Act
        Assert.Equal(15, p.Total);                  // (2) Assert : attendu 15
    }

    [Theory]                                        // (3) test paramétré
    [InlineData(100, 10, 90)]                       //     100 - 10% = 90
    [InlineData(50, 0, 50)]                         //     0% = inchangé
    public void Remise_Applique(int prix, int pct, int attendu)
    {
        Assert.Equal(attendu, Panier.AvecRemise(prix, pct)); // (4)
    }

    [Fact]
    public void Retirer_ArticleAbsent_LeveException()
    {
        Panier p = new Panier();
        Assert.Throws&lt;InvalidOperationException&gt;(() =&gt; p.Retirer(99)); // (5)
    }
}</pre>`,
    questions: [
      { type: "qcm", q: "(1) À quoi sert <code>[Fact]</code> ici ?", opts: ["À documenter", "À marquer la méthode comme un test exécutable par xUnit", "À boucler", "À créer un panier"], a: 1, exp: "[Fact] = un test unitaire." },
      { type: "qcm", q: "(2) <code>Assert.Equal(15, p.Total)</code> : que se passe-t-il si Total vaut 14 ?", opts: ["Rien", "Le test ÉCHOUE : l'affirmation est fausse", "Le programme plante en prod", "Total devient 15"], a: 1, exp: "Une assertion fausse fait échouer le test." },
      { type: "qcm", q: "(3) Pourquoi <code>[Theory]</code> plutôt que <code>[Fact]</code> ?", opts: ["Pour aller plus vite", "Parce qu'on teste la même logique avec plusieurs jeux de données", "Pour ignorer le test", "Sans raison"], a: 1, exp: "Theory + InlineData = plusieurs cas." },
      { type: "vf", q: "(4) Le test <code>Remise_Applique</code> s'exécute DEUX fois, une par [InlineData].", a: true, exp: "Chaque InlineData déclenche une exécution." },
      { type: "qcm", q: "(5) <code>Assert.Throws&lt;InvalidOperationException&gt;</code> réussit si…", opts: ["Aucune exception n'est levée", "Retirer(99) lève bien une InvalidOperationException", "Le total vaut 0", "Le panier est vide"], a: 1, exp: "On vérifie que l'exception attendue survient." }
    ],
    solution: `<pre class="pseudo">[Fact]  → un test unique (AAA : Arrange, Act, Assert)
Assert.Equal(15, p.Total)   → échoue si Total != 15
[Theory] + [InlineData]     → un test rejoué pour chaque jeu
  (100,10,90) puis (50,0,50) → deux exécutions
Assert.Throws<T>(() => ...) → exige que l'exception T soit levée
Tests verts = comportement conforme, refactor sans peur</pre>
<p>Les tests sont ton filet de sécurité : ils documentent, détectent les régressions et donnent confiance. Prochaine leçon : la sérialisation JSON.</p>`
  }
};
</script>

    ],
    solution: "using Xunit;                                             // [Fact], [Theory], [InlineData], Assert\n\npublic class CalculTests                                 // classe regroupant les tests\n{                                                        // début\n    [Fact]                                               // marque un test unique\n    public void Additionner_DeuxPlusTrois_DonneCinq()    // nom explicite du scénario\n    {                                                    // début du test\n        int resultat = Calcul.Additionner(2, 3);         // Act : on exécute le code testé\n        Assert.Equal(5, resultat);                       // Assert : attendu 5, obtenu resultat\n    }                                                    // fin du test\n\n    [Theory]                                             // test paramétré\n    [InlineData(0, 0, 0)]                                // jeu 1 : 0 + 0 = 0\n    [InlineData(-2, 5, 3)]                               // jeu 2 : -2 + 5 = 3\n    public void Additionner_PlusieursCas(int a, int b, int attendu) // données en paramètres\n    {                                                    // début\n        Assert.Equal(attendu, Calcul.Additionner(a, b)); // même assertion, valeurs variables\n    }                                                    // fin\n}                                                        // fin de la classe",
    note: "Le [Fact] teste un cas précis ; le [Theory] rejoue la même logique pour chaque [InlineData]. La valeur attendue vient toujours en premier dans Assert.Equal." }
  ]
};
