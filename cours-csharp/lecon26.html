var DAY = {
  num: 26,
  title: "Expressions régulières (regex)",
  subtitle: "Décrire un motif de texte pour le trouver, le valider ou le remplacer.",
  theory: `
<h3>1. Qu'est-ce qu'une expression régulière ?</h3>
<p>Une <strong>expression régulière</strong> (regex, regular expression) est un petit langage pour décrire un MOTIF de texte : « quatre chiffres », « une adresse e-mail », « un mot commençant par une majuscule ». C'est comme un avis de recherche très précis : au lieu de chercher un texte exact, on décrit la FORME recherchée, et la regex trouve tout ce qui y correspond.</p>
<p>On l'utilise pour trois choses : VALIDER (ce code postal est-il correct ?), TROUVER (extraire tous les nombres d'un texte) et REMPLACER (masquer les numéros de téléphone).</p>
<pre class="pseudo">using System.Text.RegularExpressions;   // indispensable : ouvre la classe Regex</pre>

<h3>2. Les briques de base</h3>
<pre class="pseudo">\\d      // un CHIFFRE (0 à 9) — 'd' comme digit
\\w      // un caractère de MOT : lettre, chiffre ou _ (w comme word)
\\s      // un ESPACE (espace, tabulation, saut de ligne)
.       // N'IMPORTE quel caractère (le joker)
\\.      // un vrai POINT (le backslash 'échappe' le sens spécial du point)
[a-z]   // une lettre minuscule de a à z (une CLASSE de caractères)
[0-9]   // un chiffre (équivalent de \\d)
[^0-9]  // tout SAUF un chiffre (^ au début d'une classe = négation)</pre>
<div class="tip">Le backslash sert à deux choses : donner un sens spécial (<code>\\d</code> = chiffre) ou, à l'inverse, RETIRER le sens spécial (<code>\\.</code> = un point littéral, pas le joker). Entre crochets <code>[...]</code> on liste les caractères autorisés.</div>

<h3>3. Les quantificateurs : combien de fois ?</h3>
<pre class="pseudo">a*      // zéro, un ou PLUSIEURS 'a' (le * = 0 ou +)
a+      // au moins un 'a' (1 ou plus)
a?      // zéro ou un 'a' (optionnel)
\\d{4}   // EXACTEMENT 4 chiffres (ex. une année)
\\d{2,4} // entre 2 et 4 chiffres
\\d{2,}  // au moins 2 chiffres</pre>

<h3>4. Les ancres : où dans le texte ?</h3>
<pre class="pseudo">^       // DÉBUT de la chaîne
$       // FIN de la chaîne
^\\d{4}$ // TOUTE la chaîne doit être exactement 4 chiffres (rien avant, rien après)</pre>
<div class="warn">Sans ancres, <code>\\d{4}</code> trouve 4 chiffres N'IMPORTE OÙ (même dans « abc1234xyz »). Avec <code>^\\d{4}$</code>, on exige que la chaîne ENTIÈRE soit ces 4 chiffres. Les ancres verrouillent le motif.</div>

<h3>5. Valider avec Regex.IsMatch</h3>
<p>En C#, on écrit les motifs dans une chaîne verbatim <code>@"..."</code> pour ne pas doubler les backslashes.</p>
<pre class="pseudo">bool ok = Regex.IsMatch("2026", @"^\\d{4}$");   // la chaîne est-elle 4 chiffres ? → true
bool cp = Regex.IsMatch(saisie, @"^\\d{5}$");   // code postal français : 5 chiffres exactement
// @"..." = chaîne VERBATIM : le backslash y est pris tel quel, pratique pour les regex</pre>

<h3>6. Trouver et extraire : Match et les groupes</h3>
<pre class="pseudo">Match m = Regex.Match("Prix: 42 euros", @"\\d+");  // cherche le 1er nombre
if (m.Success)                                     // a-t-on trouvé ?
    Console.WriteLine(m.Value);                    // « 42 » : le texte trouvé
// Les GROUPES () capturent des morceaux :
Match d = Regex.Match("15/09/2026", @"(\\d{2})/(\\d{2})/(\\d{4})"); // 3 groupes
string jour = d.Groups[1].Value;   // « 15 » — Groups[0] = tout, Groups[1] = 1er groupe ()
string mois = d.Groups[2].Value;   // « 09 »</pre>
<div class="tip">Les parenthèses <code>()</code> créent des GROUPES de capture : on isole des morceaux du texte. <code>Groups[0]</code> est la correspondance entière ; <code>Groups[1]</code>, <code>Groups[2]</code>… sont les groupes dans l'ordre.</div>

<h3>7. Remplacer : Regex.Replace</h3>
<pre class="pseudo">string net = Regex.Replace("Tel: 0612345678", @"\\d", "X"); // remplace chaque chiffre par X
// résultat : « Tel: XXXXXXXXXX » — utile pour masquer des données</pre>
<div class="warn">Une regex, c'est puissant mais vite illisible. Documente toujours ce qu'un motif cherche, et n'en abuse pas : pour un test simple, <code>Contains</code> ou <code>StartsWith</code> suffisent souvent.</div>`,
  exercises: [
    { type: "qcm", q: "Une expression régulière sert à…", opts: ["Trier automatiquement les lignes d'un texte", "Décrire un MOTIF de texte pour valider, trouver ou remplacer", "Créer un fichier texte à partir de données", "Effectuer des calculs sur des nombres"], a: 1, exp: "Un 'avis de recherche' décrivant la forme du texte." },
    { type: "qcm", q: "Que représente <code>\\d</code> ?", opts: ["Une lettre", "Un CHIFFRE (0 à 9)", "Un espace", "Un point"], a: 1, exp: "d comme digit." },
    { type: "qcm", q: "Que représente <code>\\w</code> ?", opts: ["Un espace", "Un caractère de mot : lettre, chiffre ou _", "Un chiffre seulement", "Un saut de ligne"], a: 1, exp: "w comme word." },
    { type: "qcm", q: "Le point <code>.</code> (sans backslash) dans une regex signifie…", opts: ["Un vrai point", "N'IMPORTE quel caractère (le joker)", "Une fin de phrase", "Un chiffre"], a: 1, exp: "Le joker ; \\. serait un point littéral." },
    { type: "qcm", q: "Pour matcher un vrai point (comme dans un e-mail), on écrit…", opts: [".", "\\. : le backslash retire le sens spécial du point", "(.) : un point entre parenthèses", "[^.] : la classe qui exclut le point"], a: 1, exp: "\\. = point littéral." },
    { type: "qcm", q: "<code>[a-z]</code> désigne…", opts: ["N'importe quelle lettre, majuscule ou minuscule", "Une lettre minuscule de a à z (une classe de caractères)", "a ou z uniquement", "Une majuscule"], a: 1, exp: "Une plage dans une classe []." },
    { type: "qcm", q: "<code>[^0-9]</code> désigne…", opts: ["Un chiffre", "Tout SAUF un chiffre (^ en début de classe = négation)", "0 ou 9", "Le caractère ^ suivi d'un chiffre"], a: 1, exp: "Le ^ dans [] inverse la classe." },
    { type: "qcm", q: "Le quantificateur <code>+</code> signifie…", opts: ["Zéro ou un", "AU MOINS UN (1 ou plus)", "Exactement un", "Aucun"], a: 1, exp: "a+ = un ou plusieurs a." },
    { type: "qcm", q: "<code>\\d{4}</code> matche…", opts: ["Au moins 4 chiffres", "EXACTEMENT 4 chiffres", "4 lettres", "0 à 4 chiffres"], a: 1, exp: "{n} = exactement n répétitions." },
    { type: "qcm", q: "<code>\\d{2,4}</code> matche…", opts: ["2 ou 4 chiffres", "Entre 2 et 4 chiffres", "24 chiffres", "Au moins 2 lettres"], a: 1, exp: "{min,max} = de min à max." },
    { type: "qcm", q: "Les ancres <code>^</code> et <code>$</code> désignent…", opts: ["Le début et la fin de la chaîne", "Des chiffres", "Des espaces", "Des groupes"], a: 0, exp: "^ = début, $ = fin." },
    { type: "vf", q: "<code>^\\d{4}$</code> exige que la chaîne ENTIÈRE soit exactement 4 chiffres.", a: true, exp: "Les ancres verrouillent tout le texte." },
    { type: "qcm", q: "En C#, on écrit les motifs regex de préférence en…", opts: ["chaîne normale \"...\"", "chaîne verbatim @\"...\" pour ne pas doubler les backslashes", "un tableau de caractères char[]", "une constante const string"], a: 1, exp: "@\"\\d\" est plus lisible que \"\\\\d\"." },
    { type: "qcm", q: "Les parenthèses <code>()</code> dans une regex créent…", opts: ["Une alternative entre deux motifs", "Des GROUPES de capture (on isole des morceaux du texte)", "Un groupe non capturant", "Une répétition du motif précédent"], a: 1, exp: "Groups[1], Groups[2]… récupèrent chaque groupe." },
    { type: "qcm", q: "<code>Regex.Replace(txt, @\"\\d\", \"X\")</code> fait…", opts: ["Trouve le premier chiffre", "Remplace CHAQUE chiffre par X (utile pour masquer)", "Compte les chiffres", "Supprime le texte"], a: 1, exp: "Replace remplace toutes les occurrences du motif." }
  ],
  final: {
    title: "Exercice final — Valider et découper une date",
    intro: `<p>On veut valider une date au format JJ/MM/AAAA, puis extraire ses trois composants avec des groupes.</p>
<pre class="pseudo">string entree = "15/09/2026";
string motif = @"^(\\d{2})/(\\d{2})/(\\d{4})$";   // (1) trois groupes, ancré début et fin

bool valide = Regex.IsMatch(entree, motif);       // (2) est-ce bien une date JJ/MM/AAAA ?
Match m = Regex.Match(entree, motif);             // (3) on capture les morceaux
string jour  = m.Groups[1].Value;                 // (4) 1er groupe
string annee = m.Groups[3].Value;                 // (5) 3e groupe
Console.WriteLine($"{jour} — {annee}");</pre>`,
    questions: [
      { type: "qcm", q: "(1) À quoi servent le <code>^</code> et le <code>$</code> dans le motif ?", opts: ["À autoriser du texte avant et après le motif", "À exiger que TOUTE la chaîne corresponde au format (rien en trop avant/après)", "À compter", "À remplacer"], a: 1, exp: "Les ancres verrouillent la chaîne entière." },
      { type: "qcm", q: "(2) Pour <code>\"15/09/2026\"</code>, <code>valide</code> vaut…", opts: ["false", "true : deux chiffres / deux chiffres / quatre chiffres, motif respecté", "null", "Erreur"], a: 1, exp: "Le format correspond exactement." },
      { type: "qcm", q: "(3) Que contient <code>m.Groups[0].Value</code> ?", opts: ["Le jour", "La correspondance ENTIÈRE : '15/09/2026'", "Le premier groupe capturé", "L'année"], a: 1, exp: "Groups[0] = tout le texte matché." },
      { type: "qcm", q: "(4) <code>m.Groups[1].Value</code> vaut…", opts: ["'15' : le 1er groupe (\\d{2}) capture le jour", "'09'", "'2026'", "tout"], a: 0, exp: "Groups[1] = premier groupe entre parenthèses." },
      { type: "vf", q: "(5) <code>m.Groups[3].Value</code> vaut '2026' (le troisième groupe, l'année).", a: true, exp: "Les groupes sont numérotés dans l'ordre des parenthèses." }
    ],
    solution: `<pre class="pseudo">@"^(\\d{2})/(\\d{2})/(\\d{4})$"   // motif ancré, 3 groupes de capture
IsMatch → true                   // "15/09/2026" respecte le format
Match.Groups[0] → "15/09/2026"   // la correspondance entière
Groups[1] → "15" (jour)          // 1er groupe ()
Groups[2] → "09" (mois)          // 2e groupe ()
Groups[3] → "2026" (année)       // 3e groupe ()</pre>
<p>Une regex valide ET découpe en même temps grâce aux groupes. À manier avec parcimonie et à documenter. Prochaine leçon : collections avancées et IEnumerable.</p>`
  }
};

    statement: "Écris un programme qui : (1) valide qu'une saisie est un code postal français (exactement 5 chiffres) avec <code>Regex.IsMatch</code> et le motif <code>@\"^\\d{5}$\"</code> ; (2) masque tous les chiffres d'un numéro de téléphone en les remplaçant par <code>*</code> via <code>Regex.Replace</code>.",

    atoi: { cmd: "dotnet run", expected: "Code postal valide : True\nTel **********" },
    checklist: ["using System.Text.RegularExpressions; figure en haut du fichier.", "La validation utilise Regex.IsMatch avec un motif ancré (^ et $) exigeant exactement 5 chiffres.", "Regex.Replace masque CHAQUE chiffre du numéro par une étoile, pas seulement le premier.", "La console affiche « Code postal valide : True » puis « Tel ********** »."],
    solution: "using System;                                            // Console\nusing System.Text.RegularExpressions;                    // classe Regex\n\nclass Validation                                         // classe programme\n{                                                        // début\n    static void Main()                                   // point d'entrée\n    {                                                    // début de Main\n        string cp = \"75001\";                             // un code postal à tester\n        bool valide = Regex.IsMatch(cp, @\"^\\d{5}$\");     // exactement 5 chiffres, ancré début/fin\n        Console.WriteLine($\"Code postal valide : {valide}\"); // affiche True\n        string tel = \"Tel 0612345678\";                   // un texte avec un numéro\n        string masque = Regex.Replace(tel, @\"\\d\", \"*\");  // chaque chiffre devient une étoile\n        Console.WriteLine(masque);                       // affiche « Tel ********** »\n    }                                                    // fin de Main\n}                                                        // fin de la classe",

  ]
