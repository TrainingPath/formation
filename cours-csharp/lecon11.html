<p>Cette leçon traduit en C# les grands algorithmes vus en pseudocode. L'idée : les motifs de raisonnement restent identiques, seule la syntaxe change.</p>
<h3>1. Recherche séquentielle : parcourir jusqu'à trouver</h3>
<pre class="pseudo">static int Chercher(int[] t, int cible)      // renvoie l'indice de « cible », ou -1 si absente
{
    for (int i = 0; i &lt; t.Length; i++)       // on parcourt chaque case
    {
        if (t[i] == cible) { return i; }     // trouvé ! on renvoie tout de suite l'indice (retour anticipé)
    }
    return -1;                               // arrivé ici, rien trouvé : convention -1 = « absent »
}</pre>
<p>Le <code>return</code> à l'intérieur de la boucle interrompt tout dès qu'on trouve : inutile de continuer. Le <code>return -1</code> final n'est atteint que si aucune case ne correspondait.</p>

<h3>2. Position du maximum</h3>
<pre class="pseudo">static int PosMax(int[] t)
{
    int pos = 0;                             // on suppose que le max est en case 0
    for (int i = 1; i &lt; t.Length; i++)       // on compare à partir de la case 1
    {
        if (t[i] &gt; t[pos]) { pos = i; }      // si t[i] dépasse le champion, i devient la nouvelle position du max
    }
    return pos;                              // on renvoie l'INDICE du plus grand (pas sa valeur)
}</pre>
<p>Variante du « champion provisoire » (leçon 7) : ici on mémorise la <strong>position</strong> du maximum, pas sa valeur, ce qui est souvent plus utile.</p>

<h3>3. Tri à bulles : faire remonter les grands par échanges voisins</h3>
<pre class="pseudo">static void TriBulles(int[] t)
{
    for (int passage = 1; passage &lt; t.Length; passage++)      // on répète plusieurs « passages »
    {
        for (int i = 0; i &lt; t.Length - passage; i++)          // à chaque passage, la zone à trier rétrécit
        {
            if (t[i] &gt; t[i + 1])                              // deux voisins dans le mauvais ordre ?
            {
                int aux = t[i];              // on les ÉCHANGE via une variable temporaire (leçon 2)
                t[i] = t[i + 1];             // t[i] reçoit le voisin de droite
                t[i + 1] = aux;              // le voisin reçoit l'ancienne valeur de t[i]
                // Bonus C# : (t[i], t[i+1]) = (t[i+1], t[i]);  // échange en une ligne
            }
        }
    }
}</pre>
<div class="tip">Comme Java, les tableaux passent par RÉFÉRENCE : <code>TriBulles</code> est <code>void</code> mais modifie bel et bien le tableau d'origine (il travaille sur la même zone mémoire). Rappel : PHP passait le tableau par copie et devait le retourner.</div>

<h3>4. Dichotomie : diviser l'intervalle par deux (tableau TRIÉ)</h3>
<pre class="pseudo">static int Dichotomie(int[] t, int cible)
{
    int gauche = 0, droite = t.Length - 1;    // les deux bornes de la zone de recherche
    while (gauche &lt;= droite)                   // tant que la zone n'est pas vide
    {
        int milieu = (gauche + droite) / 2;   // indice du milieu (division entière, ici sans risque)
        if (t[milieu] == cible) { return milieu; }        // pile au milieu : trouvé
        else if (t[milieu] &lt; cible) { gauche = milieu + 1; } // cible plus grande → chercher à DROITE
        else { droite = milieu - 1; }                        // cible plus petite → chercher à GAUCHE
    }
    return -1;                                // zone épuisée : absente
}</pre>
<p>La dichotomie n'a de sens que sur un tableau <strong>trié</strong> : à chaque tour on élimine la moitié restante, d'où une recherche très rapide (logarithmique) comparée au parcours séquentiel.</p>

eau non trié, 1302 : \"\n                          + $\"{Dichotomie(temps, 1302)} — à comparer avec {Chercher(temps, 1302)}\");\n\n        Console.WriteLine();\n\n        // La médiane se lit sur le tableau trié.\n        Console.WriteLine($\"Meilleur temps : {copie[0]}\");\n        Console.WriteLine($\"Temps médian : {copie[copie.Length / 2]}\");\n        Console.WriteLine($\"Pire temps : {copie[copie.Length - 1]}\");\n\n        // Les outils tout faits de la plateforme font la même chose, plus vite.\n        int[] copie2 = Copier(temps);\n        Array.Sort(copie2);\n        Console.WriteLine($\"Trié par la plateforme : {string.Join(\", \", copie2)}\");\n        Console.WriteLine($\"Recherche native de 1223 : {Array.BinarySearch(copie2, 1223)}\");\n    }\n\n    static int Chercher(int[] t, int cible)\n    {\n        for (int i = 0; i < t.Length; i++)\n        {\n            if (t[i] == cible)\n            {\n                return i;\n            }\n        }\n        return -1;\n    }\n\n    static int PosMax(int[] t)\n    {\n        int pos = 0;\n        for (int i = 1; i < t.Length; i++)\n        {\n            if (t[i] > t[pos])\n            {\n                pos = i;\n            }\n        }\n        return pos;\n    }\n\n    static int PosMin(int[] t)\n    {\n        int pos = 0;\n        for (int i = 1; i < t.Length; i++)\n        {\n            if (t[i] < t[pos])\n            {\n                pos = i;\n            }\n        }\n        return pos;\n    }\n\n    static int[] Copier(int[] t)\n    {\n        int[] resultat = new int[t.Length];\n        for (int i = 0; i < t.Length; i++)\n        {\n            resultat[i] = t[i];\n        }\n        return resultat;\n    }\n\n    // Un tableau passe par référence : cette méthode ne rend rien et pourtant\n    // elle modifie bel et bien le tableau de l'appelant.\n    static void TriBulles(int[] t)\n    {\n        for (int passage = 1; passage < t.Length; passage++)\n        {\n            for (int i = 0; i       "solution": "// L'annuaire téléphonique : trier DEUX tableaux ensemble, sans les désaligner.\n// C'est le vrai problème du jour — et il n'a pas de solution élégante ici.\nusing System;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        string[] noms = { \"Verhoeven\", \"Dumont\", \"Aerts\", \"Petit\", \"Kabongo\", \"Bertrand\" };\n        string[] numeros = { \"0475110022\", \"0496220033\", \"0488330044\",\n                             \"0471440055\", \"0499550066\", \"0483660077\" };\n        int[] appels = { 12, 3, 41, 7, 25, 3 };\n\n        Console.WriteLine(\"ANNUAIRE — ordre de saisie\");\n        Afficher(noms, numeros, appels);\n\n        Console.WriteLine();\n\n        // Recherche séquentielle sur des textes : le même motif qu'avec des nombres.\n        Console.WriteLine($\"Position de Kabongo : {Chercher(noms, \"Kabongo\")}\");\n        Console.WriteLine($\"Position de Leclercq : {Chercher(noms, \"Leclercq\")}\");\n\n        int i = Chercher(noms, \"Aerts\");\n        if (i >= 0)\n        {\n            Console.WriteLine($\"Aerts : {numeros[i]}, {appels[i]} appel(s)\");\n        }\n        else\n        {\n            Console.WriteLine(\"Aerts : inconnu au fichier\");\n        }\n\n        Console.WriteLine();\n\n        // Tri à bulles sur les noms : chaque échange DOIT toucher les trois tableaux.\n        TrierParNom(noms, numeros, appels);\n        Console.WriteLine(\"ANNUAIRE — ordre alphabétique\");\n        Afficher(noms, numeros, appels);\n\n        Console.WriteLine();\n\n        // Le tableau des noms est maintenant trié : la dichotomie devient possible.\n        Console.WriteLine($\"Dichotomie sur Petit : {DichotomieTexte(noms, \"Petit\")}\");\n        Console.WriteLine($\"Dichotomie sur Aerts : {DichotomieTexte(noms, \"Aerts\")}\");\n        Console.WriteLine($\"Dichotomie sur Leclercq : {DichotomieTexte(noms, \"Leclercq\")}\");\n\n        Console.WriteLine();\n\n        // Un second tri, par nombre d'appels décroissant, sur les mêmes données.\n        TrierParAppelsDecroissant(noms, numeros, appels);\n        Console.WriteLine(\"ANNUAIRE — par nombre d'appels\");\n        Afficher(noms, numeros, appels);\n\n        Console.WriteLine();\n        Console.WriteLine(\"Le tableau des noms n'est plus trié : la dichotomie ne vaut plus rien.\");\n        Console.WriteLine($\"Dichotomie sur Petit après le second tri : \"\n                          + $\"{DichotomieTexte(noms, \"Petit\")}\");\n        Console.WriteLine($\"Recherche séquentielle sur Petit : {Chercher(noms, \"Petit\")}\");\n    }\n\n    static void Afficher(string[] noms, string[] numeros, int[] appels)\n    {\n        for (int i = 0; i < noms.Length; i++)\n        {\n            Console.WriteLine($\"  [{i}] {noms[i]}\\t{numeros[i]}\\t{appels[i]} appel(s)\");\n        }\n    }\n\n    static int Chercher(string[] t, string cible)\n    {\n        for (int i = 0; i < t.Length; i++)\n        {\n            if (t[i] == cible)\n            {\n                return i;\n            }\n        }\n        return -1;\n    }\n\n    // Trois échanges pour un seul : c'est le prix des tableaux parallèles.\n    static void Echanger(string[] noms, string[] numeros, int[] appels, int a, int b)\n    {\n        string nom = noms[a];\n        noms[a] = noms[b];\n        noms[b] = nom;\n\n        string numero = numeros[a];\n        numeros[a] = numeros[b];\n        numeros[b] = numero;\n\n        int appel = appels[a];\n        appels[a] = appels[b];\n        appels[b] = appel;\n    }\n\n    static void TrierParNom(string[] noms, string[] numeros, int[] appels)\n    {\n        for (int passage = 1; passage < noms.Length; passage++)\n        {\n            for (int i = 0; i < noms.Length - passage; i++)\n            {\n                if (EstApres(noms[i], noms[i + 1]))\n                {\n                    Echanger(noms, numeros, appels, i, i + 1);\n                }\n            }\n        }\n    }\n\n    static void TrierParAppelsDecroissant(string[] noms, string[] numeros, int[] appels)\n    {\n        for (int passage = 1; passage < appels.Length; passage++)\n        {\n            for (int i = 0; i < appels.Length - passage; i++)\n            {\n                if (appels[i] < appels[i + 1])\n                {\n                    Echanger(noms, numeros, appels, i, i + 1);\n                }\n            }\n        }\n    }\n\n    // Comparer deux textes lettre à lettre, sans outil de comparaison tout fait.\n    static bool EstApres(string a, string b)\n    {\n        int n = a.Length;\n        if (b.Length < n)\n        {\n            n = b.Length;\n        }\n        for (int i = 0; i < n; i++)\n        {\n            if (a[i] != b[i])\n            {\n                return a[i] > b[i];\n            }\n        }\n        return a.Length > b.Length;\n    }\n\n    static int DichotomieTexte(string[] t, string cible)\n    {\n        int gauche = 0;\n        int droite = t.Length - 1;\n        while (gauche <= droite)\n        {\n            int milieu = (gauche + droite) / 2;\n            if (t[milieu] == cible)\n            {\n                return milieu;\n            }\n            if (EstApres(cible, t[milieu]))\n            {\n                gauche = milieu + 1;\n            }\n            else\n            {\n                droite = milieu - 1;\n            }\n        }\n        return -1;\n    }\n}",

      "solution": "// Le club de Scrabble — jour 3 sur 4 : classer et rechercher.\n// Les trois listes d'hier deviennent trois tableaux, parce qu'un tri travaille\n// sur des positions — et c'est là que le problème du jour apparaît.\nusing System;\nusing System.Collections.Generic;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        // La partie d'hier, une fois arbitrée et figée.\n        string[] mots = { \"kayak\", \"train\", \"jazz\", \"otto\", \"pluvieux\", \"wagon\" };\n        int[] scores = { 32, 5, 24, 4, 20, 13 };\n        string[] auteurs = { \"Ilse\", \"Ilse\", \"Ilse\", \"Bruno\", \"Bruno\", \"Bruno\" };\n\n        Console.WriteLine(\"CLUB DE SCRABBLE — dépouillement de la partie\");\n        Afficher(mots, scores, auteurs);\n\n        Console.WriteLine();\n\n        // Recherche séquentielle : la seule possible sur des données non triées.\n        Console.WriteLine($\"« jazz » a-t-il été joué ? position {Chercher(mots, \"jazz\")}\");\n        Console.WriteLine($\"« sudoku » a-t-il été joué ? position {Chercher(mots, \"sudoku\")}\");\n\n        int i = PosMax(scores);\n        Console.WriteLine($\"Meilleur coup : {mots[i].ToUpper()} par {auteurs[i]} \"\n                          + $\"({scores[i]} points)\");\n        int j = PosMin(scores);\n        Console.WriteLine($\"Coup le plus faible : {mots[j].ToUpper()} par {auteurs[j]} \"\n                          + $\"({scores[j]} points)\");\n\n        Console.WriteLine();\n\n        // Le classement par score décroissant : trois tableaux échangés ensemble.\n        TrierParScoreDecroissant(mots, scores, auteurs);\n        Console.WriteLine(\"CLASSEMENT DES COUPS\");\n        Afficher(mots, scores, auteurs);\n\n        Console.WriteLine();\n        Console.WriteLine($\"Total d'Ilse : {TotalDe(auteurs, scores, \"Ilse\")}\");\n        Console.WriteLine($\"Total de Bruno : {TotalDe(auteurs, scores, \"Bruno\")}\");\n\n        Console.WriteLine();\n\n        // Le dictionnaire du club, trié une fois pour toutes : la dichotomie\n        // devient possible, et elle ne l'était pas sur les mots de la partie.\n        string[] dictionnaire = { \"azur\", \"banjo\", \"chalet\", \"dune\", \"epsilon\",\n                                  \"jazz\", \"kayak\", \"otto\", \"pluvieux\", \"train\",\n                                  \"wagon\", \"yaourt\" };\n        Console.WriteLine($\"Dictionnaire du club : {dictionnaire.Length} mots (déjà triés)\");\n\n        string[] aVerifier = { \"jazz\", \"kayak\", \"sudoku\", \"azur\", \"yaourt\", \"zebre\" };\n        foreach (string mot in aVerifier)\n        {\n            int sequentiel = Chercher(dictionnaire, mot);\n            int dicho = DichotomieTexte(dictionnaire, mot);\n            string verdict = dicho >= 0 ? \"admis\" : \"REFUSÉ\";\n            Console.WriteLine($\"  {mot}\\tséquentielle {sequentiel}\\tdichotomie {dicho}\\t{verdict}\");\n        }\n\n        Console.WriteLine();\n        Console.WriteLine(\"Les deux recherches donnent la même position sur un tableau trié.\");\n        Console.WriteLine($\"Sur les mots de la partie, en revanche, le tableau n'est plus \"\n                          + $\"alphabétique : dichotomie sur « otto » → \"\n                          + $\"{DichotomieTexte(mots, \"otto\")}, séquentielle → {Chercher(mots, \"otto\")}\");\n    }\n\n    static void Afficher(string[] mots, int[] scores, string[] auteurs)\n    {\n        for (int i = 0; i < mots.Length; i++)\n        {\n            Console.WriteLine($\"  [{i}] {mots[i]}\\t{scores[i]} pt\\t{auteurs[i]}\");\n        }\n    }\n\n    static int Chercher(string[] t, string cible)\n    {\n        for (int i = 0; i < t.Length; i++)\n        {\n            if (t[i] == cible)\n            {\n                return i;\n            }\n        }\n        return -1;\n    }\n\n    static int PosMax(int[] t)\n    {\n        int pos = 0;\n        for (int i = 1; i < t.Length; i++)\n        {\n            if (t[i] > t[pos])\n            {\n                pos = i;\n            }\n        }\n        return pos;\n    }\n\n    static int PosMin(int[] t)\n    {\n        int pos = 0;\n        for (int i = 1; i < t.Length; i++)\n        {\n            if (t[i] < t[pos])\n            {\n                pos = i;\n            }\n        }\n        return pos;\n    }\n\n    // Un échange qui oublierait un tableau désalignerait tout, en silence.\n    static void Echanger(string[] mots, int[] scores, string[] auteurs, int a, int b)\n    {\n        string mot = mots[a];\n        mots[a] = mots[b];\n        mots[b] = mot;\n\n        int score = scores[a];\n        scores[a] = scores[b];\n        scores[b] = score;\n\n        string auteur = auteurs[a];\n        auteurs[a] = auteurs[b];\n        auteurs[b] = auteur;\n    }\n\n    static void TrierParScoreDecroissant(string[] mots, int[] scores, string[] auteurs)\n    {\n        for (int passage = 1; passage < scores.Length; passage++)\n        {\n            for (int i = 0; i < scores.Length - passage; i++)\n            {\n                if (scores[i] < scores[i + 1])\n                {\n                    Echanger(mots, scores, auteurs, i, i + 1);\n                }\n            }\n        }\n    }\n\n    static int TotalDe(string[] auteurs, int[] scores, string joueur)\n    {\n        int somme = 0;\n        for (int i = 0; i < auteurs.Length; i++)\n        {\n            if (auteurs[i] == joueur)\n            {\n                somme += scores[i];\n            }\n        }\n        return somme;\n    }\n\n    static bool EstApres(string a, string b)\n    {\n        int n = a.Length;\n        if (b.Length < n)\n        {\n            n = b.Length;\n        }\n        for (int i = 0; i < n; i++)\n        {\n            if (a[i] != b[i])\n            {\n                return a[i] > b[i];\n            }\n        }\n        return a.Length > b.Length;\n    }\n\n    static int DichotomieTexte(string[] t, string cible)\n    {\n        int gauche = 0;\n        int droite = t.Length - 1;\n        while (gauche <= droite)\n        {\n            int milieu = (gauche + droite) / 2;\n            if (t[milieu] == cible)\n            {\n                return milieu;\n            }\n            if (EstApres(cible, t[milieu]))\n            {\n                gauche = milieu + 1;\n            }\n            else\n            {\n                droite = milieu - 1;\n            }\n        }\n        return -1;\n    }\n}",

      "Accumulateur de produit : long fact = 1; (départ à 1, pas 0).",
      "for (int i = 1; i <= n; i++) { fact *= i; }",
      "int déborde dès 13!. long tient jusqu'à 20!."
    ],
    checklist: ["Le produit démarre à 1 (long fact = 1;), jamais à 0.", "La boucle for va de i = 1 jusqu'à i <= n inclus.", "Le type long est utilisé car un int déborde dès 13!.", "Le cas n = 0 laisse fact à 1, donc 0! = 1."],
    solution: "using System;                                    // accès à Console\n\nclass Factorielle                                // déclaration de la classe\n{                                                // début de la classe\n    static void Main()                           // point d'entrée du programme\n    {                                            // début de Main\n        Console.Write(\"n ? \");                   // demande n\n        int n = int.Parse(Console.ReadLine());   // lit et convertit n\n        long fact = 1;                           // long = entier 64 bits ; produit → départ à 1\n        for (int i = 1; i <= n; i++)             // i parcourt 1, 2, 3, …, n\n        {                                        // début du bloc répété\n            fact *= i;                           // équivaut à fact = fact * i\n        }                                        // si n = 0 : zéro tour, fact reste 1 → 0! = 1 correct\n        Console.WriteLine($\"{n}! = {fact}\");     // affiche le résultat\n    }                                            // fin de Main\n}                                                // fin de la classe",
    note: "13! = 6 227 020 800 > capacité d'un int : le choix du type fait partie de la solution (jour 12 d'algorithmique)." }
