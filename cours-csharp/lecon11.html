  title: "Traduire ses algorithmes en C#",

  theory: `
<p>Cette leçon traduit en C# les grands algorithmes vus en pseudocode. L'idée : les motifs de raisonnement restent identiques, seule la syntaxe change.</p>
<h3>1. Recherche séquentielle : parcourir jusqu'à trouver</h3>
<pre class="pseudo">static int Chercher(int[] t, int cible)      // renvoie l'indice de « cible », ou -1 si absente
{
    for (int i = 0; i &lt; t.Length; i++)       // on parcourt chaque case
    {
        if (t[i] == cible) { return i; }     // trouvé ! on renvoie tout de suite l'indice (retour anticipé)
    }
    return -1;                               // arrivé ici, rien trouvé : convention -1 = « absent »
}</pre>
<p>Le <code>return</code> à l'intérieur de la boucle interrompt tout dès qu'on trouve : inutile de continuer. Le <code>return -1</code> final n'est atteint que si aucune case ne correspondait.</p>

<h3>2. Position du maximum</h3>
<pre class="pseudo">static int PosMax(int[] t)
{
    int pos = 0;                             // on suppose que le max est en case 0
    for (int i = 1; i &lt; t.Length; i++)       // on compare à partir de la case 1
    {
        if (t[i] &gt; t[pos]) { pos = i; }      // si t[i] dépasse le champion, i devient la nouvelle position du max
    }
    return pos;                              // on renvoie l'INDICE du plus grand (pas sa valeur)
}</pre>
<p>Variante du « champion provisoire » (leçon 7) : ici on mémorise la <strong>position</strong> du maximum, pas sa valeur, ce qui est souvent plus utile.</p>

<h3>3. Tri à bulles : faire remonter les grands par échanges voisins</h3>
<pre class="pseudo">static void TriBulles(int[] t)
{
    for (int passage = 1; passage &lt; t.Length; passage++)      // on répète plusieurs « passages »
    {
        for (int i = 0; i &lt; t.Length - passage; i++)          // à chaque passage, la zone à trier rétrécit
        {
            if (t[i] &gt; t[i + 1])                              // deux voisins dans le mauvais ordre ?
            {
                int aux = t[i];              // on les ÉCHANGE via une variable temporaire (leçon 2)
                t[i] = t[i + 1];             // t[i] reçoit le voisin de droite
                t[i + 1] = aux;              // le voisin reçoit l'ancienne valeur de t[i]
                // Bonus C# : (t[i], t[i+1]) = (t[i+1], t[i]);  // échange en une ligne
            }
        }
    }
}</pre>
<div class="tip">Comme Java, les tableaux passent par RÉFÉRENCE : <code>TriBulles</code> est <code>void</code> mais modifie bel et bien le tableau d'origine (il travaille sur la même zone mémoire). Rappel : PHP passait le tableau par copie et devait le retourner.</div>

<h3>4. Dichotomie : diviser l'intervalle par deux (tableau TRIÉ)</h3>
<pre class="pseudo">static int Dichotomie(int[] t, int cible)
{
    int gauche = 0, droite = t.Length - 1;    // les deux bornes de la zone de recherche
    while (gauche &lt;= droite)                   // tant que la zone n'est pas vide
    {
        int milieu = (gauche + droite) / 2;   // indice du milieu (division entière, ici sans risque)
        if (t[milieu] == cible) { return milieu; }        // pile au milieu : trouvé
        else if (t[milieu] &lt; cible) { gauche = milieu + 1; } // cible plus grande → chercher à DROITE
        else { droite = milieu - 1; }                        // cible plus petite → chercher à GAUCHE
    }
    return -1;                                // zone épuisée : absente
}</pre>
<p>La dichotomie n'a de sens que sur un tableau <strong>trié</strong> : à chaque tour on élimine la moitié restante, d'où une recherche très rapide (logarithmique) comparée au parcours séquentiel.</p>

<h3>5. Les versions .NET toutes faites</h3>
<pre class="pseudo">using System;
Array.Sort(t);                        // tri optimisé fourni par .NET (bien plus rapide que le tri à bulles)
int pos = Array.BinarySearch(t, 42);  // dichotomie native (tableau trié)
Array.IndexOf(t, 42);                 // recherche séquentielle native
using System.Linq;
int max = t.Max();  int somme = t.Sum();  double moy = t.Average();  // motifs prêts à l'emploi</pre>
<div class="tip">LINQ (<code>System.Linq</code>) offre <code>.Max()</code>, <code>.Sum()</code>, <code>.Average()</code>, <code>.Where()</code>… : tes motifs des leçons 6/7 en méthodes chaînables. Mais savoir les ÉCRIRE toi-même reste la clé pour comprendre, déboguer et réussir les examens — les outils tout faits viennent après.</div>`,

    { type: "qcm", q: "Array.Sort(t) est…", opts: ["Un tri à bulles interne en n²", "Un tri optimisé n log n fourni par .NET", "Une recherche dichotomique du tableau", "Un mélange aléatoire des éléments"], a: 1, exp: "La classe du jour 28 : n log n bat n²." },
    { type: "qcm", q: "t.Max() (LINQ) correspond à quel algorithme ?", opts: ["Le tri décroissant du tableau", "Le MAX du jour 17, en méthode chaînable", "La dichotomie dans un tableau trié", "La moyenne des éléments"], a: 1, exp: "LINQ encapsule tes motifs : .Sum(), .Average(), .Where()…" },
    { type: "qcm", q: "Pourquoi écrire TriBulles si Array.Sort existe ?", opts: ["Cela n'a aucun intérêt réel", "Comprendre le coût (jour 28), déboguer, réussir les examens, gérer les cas sans native", "Parce qu'Array.Sort n'est pas toujours disponible", "Par simple habitude du passé"], a: 1, exp: "Les pros connaissent les deux." },
    { type: "input", q: "PosMax renvoie l'indice. La VALEUR du max s'écrit t[...] (complète)", a: ["t[PosMax(t)]", "t[posMax(t)]"], ph: "t[…]", exp: "L'indice sert de clé : t[PosMax(t)]." },
    { type: "qcm", q: "Pour 1000 recherches dans 1 million d'éléments (jour 28) :", opts: ["1000 recherches séquentielles successives", "Array.Sort une fois, puis 1000 dichotomies (~20 comparaisons chacune)", "Trier le tableau avant chaque recherche", "Appeler Contains dans une boucle"], a: 1, exp: "Investir n log n une fois pour des recherches log n." }
  ],
