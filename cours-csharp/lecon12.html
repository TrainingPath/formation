<h3>1. La classe : un moule qui réunit données et comportements</h3>
<p>Une <strong>classe</strong> décrit un type d'objet : ses <strong>attributs</strong> (les données que chaque objet portera) et ses <strong>méthodes</strong> (ce qu'il sait faire). C'est un <em>moule</em> ; les objets en sont les exemplaires.</p>
<pre class="pseudo">class Etudiant
{
    // ATTRIBUTS (champs) : les données propres à chaque étudiant
    public string Nom;                 // public = accessible depuis l'extérieur de la classe
    public int Age;
    public double Moyenne;

    // MÉTHODES : le comportement, partagé par tous les étudiants
    public void SePresenter()          // void : elle agit (affiche), ne renvoie rien
    {
        Console.WriteLine($"Je suis {Nom}, {Age} ans");  // Nom et Age = ceux de L'OBJET qui appelle
    }
    public bool EstEnReussite()        // renvoie un booléen
    {
        return Moyenne &gt;= 10;           // vrai si la moyenne de cet objet atteint 10
    }
}</pre>

<h3>2. Créer et utiliser des objets</h3>
<pre class="pseudo">Etudiant e1 = new Etudiant();        // new FABRIQUE un objet à partir du moule
e1.Nom = "Ana";                      // on renseigne ses attributs avec le POINT (comme Java !)
e1.Age = 20;
e1.Moyenne = 14.5;

Etudiant e2 = new Etudiant();        // un second objet, totalement INDÉPENDANT du premier
e2.Nom = "Bob";

e1.SePresenter();                    // affiche « Je suis Ana, 20 ans » (utilise les valeurs de e1)
Console.WriteLine(e2.EstEnReussite());  // teste la réussite de e2</pre>
<div class="tip">Bonne nouvelle : C# utilise le POINT pour accéder aux membres d'un objet (<code>e1.Nom</code>), comme Java. Pas de flèche <code>-&gt;</code> comme en PHP. Si tu as fait Java, la POO C# est un copier-coller mental.</div>

<h3>3. Chaque objet a SES valeurs</h3>
<p>Modifier <code>e1.Age</code> ne touche pas <code>e2.Age</code> : les attributs sont propres à chaque objet. Les méthodes, elles, sont écrites une seule fois dans la classe et partagées — mais quand on les appelle, elles travaillent sur les données de l'objet appelant. C'est là toute la puissance de la POO : un moule, des exemplaires distincts qui partagent le même comportement.</p>

<h3>4. Méthodes d'objet : pas de static</h3>
<p>Dans <code>SePresenter()</code>, <code>Nom</code> désigne l'attribut de l'objet appelant. On <strong>retire</strong> le mot <code>static</code> : une méthode <code>static</code> appartient à la classe entière (comme les outils utilitaires des leçons 8-11), tandis qu'une méthode d'objet a besoin d'un exemplaire précis pour savoir « de quel Nom on parle ».</p>

<h3>5. null : la référence vide</h3>
<pre class="pseudo">Etudiant e3 = null;        // e3 ne pointe vers AUCUN objet
e3.SePresenter();          // NullReferenceException ! on appelle une méthode sur « rien »</pre>
<div class="warn"><code>null</code> signifie « aucun objet ». Appeler une méthode dessus fait planter le programme (<code>NullReferenceException</code>), le crash C# le plus fréquent. Teste avant : <code>if (e3 != null)</code>. C# moderne aide avec l'opérateur <code>?.</code> : <code>e3?.SePresenter()</code> n'appelle la méthode QUE si <code>e3</code> existe, et ne fait rien sinon.</div>

<h3>6. Tu utilises des objets depuis le début !</h3>
<pre class="pseudo">List&lt;string&gt; l = new List&lt;string&gt;();   // List est une CLASSE : l est un objet créé avec new
string mot = "chat";                    // string aussi est une classe : mot est un objet
l.Add("x");   mot.ToUpper();            // .Add et .ToUpper sont des MÉTHODES D'OBJET</pre>
<p>Depuis la leçon 4 tu manipules donc des objets sans le savoir : chaque <code>.Méthode()</code> appelée sur une variable est de la POO. Créer tes propres classes ne fait que prolonger ce que tu pratiques déjà.</p>`,

<pre class="pseudo">class Compte
{
    public string Titulaire;
    public double Solde;

    public void Deposer(double montant)
    {
        Solde += montant;
    }
    public bool Retirer(double montant)
    {
        if (montant <= Solde)
        {
            Solde -= montant;
            return true;
        }
        return false;
    }
}
// Main :

Compte c2 = new Compte(); c2.Titulaire = "Bob"; c2.Solde = 50;
c1.Deposer(30);              // (1)
bool ok = c2.Retirer(80);    // (2)
c1.Retirer(60);              // (3)</pre>`,

ce(s)\");\n        int valeurTotale = 0;\n        int bouteilles = 0;\n        foreach (Bouteille b in cave)\n        {\n            valeurTotale += b.ValeurStockCentimes();\n            bouteilles += b.EnCave;\n        }\n        Console.WriteLine($\"Bouteilles en cave : {bouteilles}\");\n        Console.WriteLine($\"Valeur totale : {valeurTotale / 100.0:F2} €\");\n\n        // Le champion provisoire, sur des objets cette fois.\n        Bouteille plusChere = cave[0];\n        foreach (Bouteille b in cave)\n        {\n            if (b.PrixCentimes > plusChere.PrixCentimes)\n            {\n                plusChere = b;\n            }\n        }\n        Console.WriteLine($\"La plus chère : {plusChere.Domaine} \"\n                          + $\"({plusChere.PrixCentimes / 100.0:F2} €)\");\n\n        Console.WriteLine();\n\n        // Deux variables peuvent désigner LE MÊME objet : ce n'est pas une copie.\n        Bouteille alias = b1;\n        alias.EnCave = 99;\n        Console.WriteLine($\"Après modification par l'alias : b1 en cave = {b1.EnCave}\");\n\n        Console.WriteLine();\n\n        // La référence vide, et la façon prudente de l'aborder.\n        Bouteille manquante = null;\n        Console.WriteLine($\"La référence est-elle vide ? {manquante == null}\");\n        if (manquante != null)\n        {\n            manquante.Presenter();\n        }\n        else\n        {\n            Console.WriteLine(\"Aucune fiche à présenter.\");\n        }\n        manquante?.Presenter();\n        Console.WriteLine(\"Le programme a survécu à l'appel prudent.\");\n    }\n}\n\nclass Bouteille\n{\n    public string Domaine;\n    public int Millesime;\n    public int PrixCentimes;\n    public int EnCave;\n\n    // Pas de static : cette méthode a besoin d'un exemplaire pour savoir de qui on parle.\n    public void Presenter()\n    {\n        Console.WriteLine($\"  {Domaine} {Millesime} — {PrixCentimes / 100.0:F2} € \"\n                          + $\"— {EnCave} en cave\");\n       "reflexion": "Les attributs sont tous accessibles depuis l'extérieur, si bien que n'importe quel code peut fixer une batterie à 300 % ou un kilométrage négatif. Le programme ne s'en protège nulle part. Décris deux dégâts concrets que cela permettrait, puis dis quelle partie de ton programme devrait légitimement pouvoir modifier chaque attribut — c'est le sujet de la leçon 13.",

      "solution": "// Le parc de trottinettes : un objet remplace quatre tableaux parallèles.\n// Le même programme qu'à la leçon 11, débarrassé de son échange à trois têtes.\nusing System;\nusing System.Collections.Generic;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        List<Trottinette> parc = new List<Trottinette>();\n        parc.Add(Fabriquer(\"TR-014\", \"Sainte-Croix\", 62, 148));\n        parc.Add(Fabriquer(\"TR-002\", \"Gare du Nord\", 18, 402));\n        parc.Add(Fabriquer(\"TR-031\", \"Parc Astrid\", 91, 77));\n        parc.Add(Fabriquer(\"TR-008\", \"Sainte-Croix\", 45, 260));\n        parc.Add(Fabriquer(\"TR-027\", \"Gare du Nord\", 7, 511));\n\n        Console.WriteLine(\"PARC DE TROTTINETTES\");\n        Afficher(parc);\n\n        Console.WriteLine();\n        Console.WriteLine($\"Disponibles : {CompterDisponibles(parc)} sur {parc.Count}\");\n        Console.WriteLine($\"Kilomètres cumulés : {TotalKilometres(parc)}\");\n\n        Trottinette faible = parc[0];\n        foreach (Trottinette t in parc)\n        {\n            if (t.BatteriePourcent < faible.BatteriePourcent)\n            {\n                faible = t;\n            }\n        }\n        Console.WriteLine($\"Batterie la plus basse : {faible.Code} \"\n                          + $\"({faible.BatteriePourcent} %) à {faible.Station}\");\n\n        Console.WriteLine();\n\n        // Un tri sur des objets : UN seul échange, quel que soit le nombre de champs.\n        TrierParBatterieDecroissante(parc);\n        Console.WriteLine(\"PARC TRIÉ PAR BATTERIE\");\n        Afficher(parc);\n\n        Console.WriteLine();\n\n        // Chercher un objet et le RENDRE : la référence vide dit « pas trouvé ».\n        Trottinette trouvee = ChercherParCode(parc, \"TR-008\");\n        if (trouvee != null)\n        {\n            Console.WriteLine($\"TR-008 trouvée : {trouvee.Station}, \"\n                              + $\"{trouvee.BatteriePourcent} %\");\n            trouvee.Recharger();\n            Console.WriteLine($\"Après recharge : {trouvee.BatteriePourcent} %\");\n        }\n        else\n        {\n            Console.WriteLine(\"TR-008 : inconnue au parc\");\n        }\n\n        Trottinette absente = ChercherParCode(parc, \"TR-999\");\n        Console.WriteLine($\"TR-999 trouvée ? {absente != null}\");\n        absente?.Recharger();\n        Console.WriteLine(\"L'appel prudent sur une référence vide n'a rien cassé.\");\n\n        Console.WriteLine();\n\n        // La modification passe par l'objet : la liste voit le changement, elle\n        // ne contient pas des copies mais des références.\n        Console.WriteLine(\"Une course de 30 km sur la première du parc :\");\n        parc[0].Rouler(30);\n        Afficher(parc);\n\n        Console.WriteLine();\n        Console.WriteLine($\"Trottinettes à réviser (plus de 400 km) : {CompterAReviser(parc)}\");\n        Console.WriteLine($\"À la station Sainte-Croix : {CompterStation(parc, \"Sainte-Croix\")}\");\n    }\n\n    static Trottinette Fabriquer(string code, string station, int batterie, int kilometres)\n    {\n        Trottinette t = new Trottinette();\n        t.Code = code;\n        t.Station = station;\n        t.BatteriePourcent = batterie;\n        t.Kilometres = kilometres;\n        return t;\n    }\n\n    static void Afficher(List<Trottinette> parc)\n    {\n        foreach (Trottinette t in parc)\n        {\n            t.Presenter();\n        }\n    }\n\n    static int CompterDisponibles(List<Trottinette> parc)\n    {\n        int compte = 0;\n        foreach (Trottinette t in parc)\n        {\n            if (t.EstDisponible())\n            {\n                compte++;\n            }\n        }\n        return compte;\n    }\n\n    static int TotalKilometres(List<Trottinette> parc)\n    {\n        int somme = 0;\n        foreach (Trottinette t in parc)\n        {\n            somme += t.Kilometres;\n        }\n        return somme;\n    }\n\n    static int CompterAReviser(List<Trottinette> parc)\n    {\n        int compte = 0;\n        foreach (Trottinette t in parc)\n        {\n            if (t.DoitEtreRevisee())\n            {\n                compte++;\n            }\n        }\n        return compte;\n    }\n\n    static int CompterStation(List<Trottinette> parc, string station)\n    {\n        int compte = 0;\n        foreach (Trottinette t in parc)\n        {\n            if (t.Station == station)\n            {\n                compte++;\n            }\n        }\n        return compte;\n    }\n\n    // Un seul échange, sur des objets entiers : plus rien à désaligner.\n    static void TrierParBatterieDecroissante(List<Trottinette> parc)\n    {\n        for (int passage = 1; passage < parc.Count; passage++)\n        {\n            for (int i = 0; i < parc.Count - passage; i++)\n            {\n                if (parc[i].BatteriePourcent < parc[i + 1].BatteriePourcent)\n                {\n                    Trottinette aux = parc[i];\n                    parc[i] = parc[i + 1];\n                    parc[i + 1] = aux;\n                }\n            }\n        }\n    }\n\n    static Trottinette ChercherParCode(List<Trottinette> parc, string code)\n    {\n        foreach (Trottinette t in parc)\n        {\n            if (t.Code == code)\n            {\n                return t;\n            }\n        }\n        return null;\n    }\n}\n\nclass Trottinette\n{\n    public string Code;\n    public string Station;\n    public int BatteriePourcent;\n    public int Kilometres;\n\n    public bool EstDisponible()\n    {\n        return BatteriePourcent >= 20;\n    }\n\n    public bool DoitEtreRevisee()\n    {\n        return Kilometres > 400;\n    }\n\n    public void Recharger()\n    {\n        BatteriePourcent = 100;\n    }\n\n    public void Rouler(int kilometres)\n    {\n        Kilometres += kilometres;\n        BatteriePourcent -= kilometres;\n        if (BatteriePourcent < 0)\n        {\n            BatteriePourcent = 0;\n        }\n    }\n\n    public void Presenter()\n    {\n        string etat = EstDisponible() ? \"disponible\" : \"à recharger\";\n        Console.WriteLine($\"  {Code}\\t{Station}\\t{BatteriePourcent} %\\t\"\n                          + $\"{Kilometres} km\\t{etat}\");\n    }\n}",

      "principe": "Trois tableaux parallèles deviennent une liste d'objets, et tout ce qui portait le risque de désalignement disparaît : l'ajout, l'échange, le retrait ne touchent plus qu'une seule chose. La programmation objet ne se juge pas au nombre de lignes gagnées, mais au nombre d'erreurs devenues impossibles.",

      "indices": [
        "Ouvre ton fichier d'hier et repère tout ce qui existe en trois exemplaires : les trois déclarations, les trois ajouts, les trois permutations de l'échange, les trois retraits de l'arbitrage. Chacun de ces trios va devenir une seule opération. C'est la mesure exacte de ce que la classe t'apporte, et tu la connais avant même d'écrire une ligne.",
        "Le plan : la classe du coup, en bas du fichier ; les méthodes de règles, reprises telles quelles ; les méthodes de service sur la liste — chercher, totaliser, meilleur, trier ; puis le programme principal, qui rejoue la partie et enchaîne les affichages.",

      "solution": "// Le club de Scrabble — jour 4 sur 4 : le coup devient un objet.\n// Les trois tableaux parallèles des trois jours précédents disparaissent, et\n// avec eux l'échange à trois têtes et la classe entière de bogues qu'il portait.\nusing System;\nusing System.Collections.Generic;\n\nclass Program\n{\n    const int LongueurMax = 7;\n\n    static void Main(string[] args)\n    {\n        List<Coup> partie = new List<Coup>();\n\n        string[] joueurs = { \"Ilse\", \"Bruno\", \"Ilse\", \"Bruno\", \"Ilse\", \"Bruno\" };\n        string[] propositions = { \"kayak\", \"zébu\", \"train\", \"otto\", \"jazz\", \"kayak\" };\n\n        Console.WriteLine(\"CLUB DE SCRABBLE — partie du samedi\");\n        Console.WriteLine();\n\n        for (int tour = 0; tour < propositions.Length; tour++)\n        {\n            string mot = propositions[tour].Trim().ToLower();\n            string joueur = joueurs[tour];\n\n            string refus = Refus(mot);\n            if (refus != \"\")\n            {\n                Console.WriteLine($\"  {joueur} propose « {mot} » → refusé : {refus}\");\n                continue;\n            }\n\n            Coup dejaJoue = ChercherMot(partie, mot);\n            if (dejaJoue != null)\n            {\n                Console.WriteLine($\"  {joueur} propose « {mot} » → déjà posé par \"\n                                  + $\"{dejaJoue.Auteur}\");\n                continue;\n            }\n\n            Coup coup = new Coup();\n            coup.Mot = mot;\n            coup.Auteur = joueur;\n            coup.Score = Score(mot);\n            partie.Add(coup);\n            Console.WriteLine($\"  {coup.Resume()}\");\n        }\n\n        Console.WriteLine();\n        Console.WriteLine($\"Coups retenus : {partie.Count}\");\n        Console.WriteLine($\"Points distribués : {TotalPoints(partie)}\");\n\n        if (partie.Count > 0)\n        {\n            Coup meilleur = MeilleurCoup(partie);\n            Console.WriteLine($\"Meilleur coup : {meilleur.Resume()}\");\n            Console.WriteLine($\"Moyenne par coup : {TotalPoints(partie) / partie.Count}\");\n        }\n        else\n        {\n            Console.WriteLine(\"Aucun coup retenu.\");\n        }\n\n        Console.WriteLine();\n        Console.WriteLine($\"Total d'Ilse : {TotalDe(partie, \"Ilse\")}\");\n        Console.WriteLine($\"Total de Bruno : {TotalDe(partie, \"Bruno\")}\");\n\n        Console.WriteLine();\n\n        // Le classement : UN seul échange, alors qu'il en fallait trois hier.\n        TrierParScoreDecroissant(partie);\n        Console.WriteLine(\"CLASSEMENT DES COUPS\");\n        foreach (Coup c in partie)\n        {\n            Console.WriteLine($\"  {c.Resume()}\");\n        }\n\n        Console.WriteLine();\n\n        // L'arbitrage : retirer un objet de la liste retire tout ce qu'il porte.\n        Console.WriteLine(\"L'arbitre invalide les mots de moins de cinq lettres :\");\n        for (int i = 0; i < partie.Count; i++)\n        {\n            if (partie[i].Mot.Length < 5)\n            {\n                Console.WriteLine($\"  {partie[i].Resume()} → retiré\");\n                partie.RemoveAt(i);\n                i--;\n            }\n        }\n\n        Console.WriteLine();\n        Console.WriteLine($\"Après arbitrage : {partie.Count} coup(s), \"\n                          + $\"{TotalPoints(partie)} point(s)\");\n        Console.WriteLine($\"Total d'Ilse : {TotalDe(partie, \"Ilse\")}\");\n        Console.WriteLine($\"Total de Bruno : {TotalDe(partie, \"Bruno\")}\");\n\n        Console.WriteLine();\n\n        // Une recherche qui peut ne rien trouver rend la référence vide.\n        Coup cherche = ChercherMot(partie, \"train\");\n        Console.WriteLine($\"« train » encore en jeu ? {cherche != null}\");\n        Coup disparu = ChercherMot(partie, \"otto\");\n        Console.WriteLine($\"« otto » encore en jeu ? {disparu != null}\");\n        Console.WriteLine($\"Résumé prudent d'un coup absent : {disparu?.Resume()}\");\n    }\n\n    static string Refus(string mot)\n    {\n        if (mot == \"\")\n        {\n            return \"mot vide\";\n        }\n        if (mot.Length > LongueurMax)\n        {\n            return $\"{mot.Length} lettres : plus long que le chevalet\";\n        }\n        for (int i = 0; i < mot.Length; i++)\n        {\n            if (!EstLettreMinuscule(mot[i]))\n            {\n                return $\"caractère interdit : « {mot[i]} »\";\n            }\n        }\n        return \"\";\n    }\n\n    static int Score(string mot)\n    {\n        int total = 0;\n        for (int i = 0; i < mot.Length; i++)\n        {\n            total += ValeurLettre(mot[i]);\n        }\n        return total;\n    }\n\n    static int ValeurLettre(char c)\n    {\n        if (c == 'k' || c == 'w' || c == 'x' || c == 'y' || c == 'z')\n        {\n            return 10;\n        }\n        if (c == 'b' || c == 'c' || c == 'f' || c == 'h' || c == 'j'\n            || c == 'p' || c == 'v')\n        {\n            return 3;\n        }\n        return 1;\n    }\n\n    static bool EstLettreMinuscule(char c) => c >= 'a' && c <= 'z';\n\n    static Coup ChercherMot(List<Coup> partie, string mot)\n    {\n        foreach (Coup c in partie)\n        {\n            if (c.Mot == mot)\n            {\n                return c;\n            }\n        }\n        return null;\n    }\n\n    static int TotalPoints(List<Coup> partie)\n    {\n        int somme = 0;\n        foreach (Coup c in partie)\n        {\n            somme += c.Score;\n        }\n        return somme;\n    }\n\n    static int TotalDe(List<Coup> partie, string joueur)\n    {\n        int somme = 0;\n        foreach (Coup c in partie)\n        {\n            if (c.Auteur == joueur)\n            {\n                somme += c.Score;\n            }\n        }\n        return somme;\n    }\n\n    static Coup MeilleurCoup(List<Coup> partie)\n    {\n        Coup meilleur = partie[0];\n        foreach (Coup c in partie)\n        {\n            if (c.Score > meilleur.Score)\n            {\n                meilleur = c;\n            }\n        }\n        return meilleur;\n    }\n\n    static void TrierParScoreDecroissant(List<Coup> partie)\n    {\n        for (int passage = 1; passage < partie.Count; passage++)\n        {\n            for (int i = 0; i < partie.Count - passage; i++)\n            {\n                if (partie[i].Score < partie[i + 1].Score)\n                {\n                    Coup aux = partie[i];\n                    partie[i] = partie[i + 1];\n                    partie[i + 1] = aux;\n                }\n            }\n        }\n    }\n}\n\n// Un mot, son score et son auteur ne sont plus trois choses à tenir alignées :\n// ce sont trois attributs d'une seule et même fiche.\nclass Coup\n{\n    public string Mot;\n    public string Auteur;\n    public int Score;\n\n    public bool EstLong()\n    {\n        return Mot.Length >= 5;\n    }\n\n    public string Resume()\n    {\n        return $\"{Mot.ToUpper()} — {Score} pt — {Auteur}\";\n    }\n}",
