var DAY = {

  title: "POO : classes et objets",
  subtitle: "Regrouper données et comportements en C#.",
  theory: `
<h3>1. La classe : un moule qui réunit données et comportements</h3>
<p>Une <strong>classe</strong> décrit un type d'objet : ses <strong>attributs</strong> (les données que chaque objet portera) et ses <strong>méthodes</strong> (ce qu'il sait faire). C'est un <em>moule</em> ; les objets en sont les exemplaires.</p>
<pre class="pseudo">class Etudiant
{
    // ATTRIBUTS (champs) : les données propres à chaque étudiant
    public string Nom;                 // public = accessible depuis l'extérieur de la classe
    public int Age;
    public double Moyenne;

    // MÉTHODES : le comportement, partagé par tous les étudiants
    public void SePresenter()          // void : elle agit (affiche), ne renvoie rien
    {
        Console.WriteLine($"Je suis {Nom}, {Age} ans");  // Nom et Age = ceux de L'OBJET qui appelle
    }
    public bool EstEnReussite()        // renvoie un booléen
    {
        return Moyenne &gt;= 10;           // vrai si la moyenne de cet objet atteint 10
    }
}</pre>

<h3>2. Créer et utiliser des objets</h3>
<pre class="pseudo">Etudiant e1 = new Etudiant();        // new FABRIQUE un objet à partir du moule
e1.Nom = "Ana";                      // on renseigne ses attributs avec le POINT (comme Java !)
e1.Age = 20;
e1.Moyenne = 14.5;

Etudiant e2 = new Etudiant();        // un second objet, totalement INDÉPENDANT du premier
e2.Nom = "Bob";

e1.SePresenter();                    // affiche « Je suis Ana, 20 ans » (utilise les valeurs de e1)
Console.WriteLine(e2.EstEnReussite());  // teste la réussite de e2</pre>
<div class="tip">Bonne nouvelle : C# utilise le POINT pour accéder aux membres d'un objet (<code>e1.Nom</code>), comme Java. Pas de flèche <code>-&gt;</code> comme en PHP. Si tu as fait Java, la POO C# est un copier-coller mental.</div>

<h3>3. Chaque objet a SES valeurs</h3>
<p>Modifier <code>e1.Age</code> ne touche pas <code>e2.Age</code> : les attributs sont propres à chaque objet. Les méthodes, elles, sont écrites une seule fois dans la classe et partagées — mais quand on les appelle, elles travaillent sur les données de l'objet appelant. C'est là toute la puissance de la POO : un moule, des exemplaires distincts qui partagent le même comportement.</p>

<h3>4. Méthodes d'objet : pas de static</h3>
<p>Dans <code>SePresenter()</code>, <code>Nom</code> désigne l'attribut de l'objet appelant. On <strong>retire</strong> le mot <code>static</code> : une méthode <code>static</code> appartient à la classe entière (comme les outils utilitaires des leçons 8-11), tandis qu'une méthode d'objet a besoin d'un exemplaire précis pour savoir « de quel Nom on parle ».</p>

<h3>5. null : la référence vide</h3>
<pre class="pseudo">Etudiant e3 = null;        // e3 ne pointe vers AUCUN objet
e3.SePresenter();          // NullReferenceException ! on appelle une méthode sur « rien »</pre>
<div class="warn"><code>null</code> signifie « aucun objet ». Appeler une méthode dessus fait planter le programme (<code>NullReferenceException</code>), le crash C# le plus fréquent. Teste avant : <code>if (e3 != null)</code>. C# moderne aide avec l'opérateur <code>?.</code> : <code>e3?.SePresenter()</code> n'appelle la méthode QUE si <code>e3</code> existe, et ne fait rien sinon.</div>

<h3>6. Tu utilises des objets depuis le début !</h3>
<pre class="pseudo">List&lt;string&gt; l = new List&lt;string&gt;();   // List est une CLASSE : l est un objet créé avec new
string mot = "chat";                    // string aussi est une classe : mot est un objet
l.Add("x");   mot.ToUpper();            // .Add et .ToUpper sont des MÉTHODES D'OBJET</pre>
<p>Depuis la leçon 4 tu manipules donc des objets sans le savoir : chaque <code>.Méthode()</code> appelée sur une variable est de la POO. Créer tes propres classes ne fait que prolonger ce que tu pratiques déjà.</p>`,

    { type: "vf", q: "Deux objets créés avec new Etudiant() partagent les mêmes valeurs d'attributs.", a: false, exp: "Chaque new alloue des attributs indépendants ; seul le CODE des méthodes est commun." },
    { type: "qcm", q: "Où placer la classe Etudiant ?", opts: ["Dans Main", "Dans son fichier Etudiant.cs (ou même fichier, hors Main)", "Dans une string", "Dans un using"], a: 1, exp: "Convention : un fichier par classe." }
  ],
  final: {
    title: "Exercice final — Le compte bancaire (version C#)",
    intro: `<p>Ta première vraie classe C# :</p>
<pre class="pseudo">class Compte
{
    public string Titulaire;
    public double Solde;

    public void Deposer(double montant)
    {
        Solde += montant;
    }
    public bool Retirer(double montant)
    {
        if (montant <= Solde)
        {
            Solde -= montant;
            return true;
        }
        return false;
    }
}
// Main :
Compte c1 = new Compte(); c1.Titulaire = "Ana"; c1.Solde = 100;
Compte c2 = new Compte(); c2.Titulaire = "Bob"; c2.Solde = 50;
c1.Deposer(30);              // (1)
bool ok = c2.Retirer(80);    // (2)
c1.Retirer(60);              // (3)</pre>`,
    questions: [
      { type: "input", q: "(1) Que vaut c1.Solde après le dépôt ?", a: "130", ph: "nombre", exp: "100 + 30 : la méthode modifie l'objet c1." },
      { type: "qcm", q: "(2) Que vaut ok ?", opts: ["true", "false : 80 > 50, retrait refusé, solde intact", "80", "null"], a: 1, exp: "La méthode PROTÈGE la donnée : le sens de la POO." },
      { type: "input", q: "(3) Que vaut c1.Solde à la fin ?", a: "70", ph: "nombre", exp: "130 − 60 = 70. c2 n'a pas bougé (50) : objets indépendants." },
      { type: "qcm", q: "Retirer() retourne un bool. Quel motif du mois d'algo ?", opts: ["Accumulateur", "La fonction-test (jour 21) : l'appelant sait si ça a réussi", "Compteur", "Tri"], a: 1, exp: "if (c2.Retirer(80)) { ... } else { « solde insuffisant » }." },
      { type: "qcm", q: "Défaut : n'importe qui peut écrire <code>c1.Solde = -5000;</code>. La solution (leçon 13) ?", opts: ["Supprimer Solde", "L'ENCAPSULATION : rendre Solde private + une propriété contrôlée", "Un commentaire", "Un tableau"], a: 1, exp: "Teaser de demain : private + propriétés = la forteresse." }
    ],
    solution: `<pre class="pseudo">c1 : Ana, 100 → Deposer(30) → 130 → Retirer(60) → 70
c2 : Bob, 50  → Retirer(80) → REFUS (false), solde 50

2 objets, 1 moule ; les méthodes portent les règles métier.
C# utilise le POINT comme Java (pas la flèche PHP).</pre>
<p>Données + comportements + règles dans une unité : le cœur de la POO. Demain, on verrouille avec constructeurs et propriétés.</p>`
