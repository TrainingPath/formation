var DAY = {

  title: "Records, struct et pattern matching",
  subtitle: "Des types de données concis et un aiguillage intelligent selon la forme.",
  theory: `
<h3>1. struct : un type valeur léger</h3>
<p>Une <strong>struct</strong> (structure) ressemble à une classe, mais c'est un <em>type valeur</em> : elle contient directement sa donnée et se COPIE quand on l'affecte, au lieu de partager une référence. Idéale pour de petits paquets de données (un point, une couleur, une durée). Analogie : une struct, c'est une fiche cartonnée qu'on photocopie ; une classe, c'est un document partagé dont tout le monde a le lien.</p>
<pre class="pseudo">struct Point                          // un type valeur
{                                     // début
    public int X;                     // coordonnée X
    public int Y;                     // coordonnée Y
    public Point(int x, int y) { X = x; Y = y; } // constructeur
}
Point a = new Point(1, 2);            // a contient directement (1, 2)
Point b = a;                          // b est une COPIE indépendante de a
b.X = 99;                             // modifier b ne change PAS a (a.X reste 1)</pre>
<div class="warn">Différence clé avec une classe : affecter une struct COPIE la donnée ; affecter une classe copie seulement la référence (les deux variables pointent le même objet). Réserve les struct aux petits types immuables.</div>

<h3>2. record : la classe de données en une ligne</h3>
<p>Un <strong>record</strong> est un type pensé pour TRANSPORTER des données. En une ligne il génère : le constructeur, les propriétés, un affichage lisible, la comparaison par VALEUR et une copie modifiée. C'est le formulaire pré-rempli du C#.</p>
<pre class="pseudo">record Tache(string Titre, int Priorite);   // UNE ligne : propriétés + constructeur + égalité + ToString
Tache t = new Tache("Ranger", 1);            // création
Console.WriteLine(t);                          // affiche « Tache { Titre = Ranger, Priorite = 1 } »
Tache t2 = t with { Priorite = 3 };           // with : COPIE de t en changeant seulement Priorite</pre>
<div class="tip">Le mot-clé <strong>with</strong> crée une COPIE modifiée sans toucher à l'original (les records sont pensés immuables). <code>t with { Priorite = 3 }</code> = « le même que t, mais avec Priorite = 3 ».</div>

<h3>3. Égalité par valeur des records</h3>
<pre class="pseudo">Tache a = new Tache("Lire", 2);       // deux records
Tache b = new Tache("Lire", 2);       // avec les MÊMES valeurs
Console.WriteLine(a == b);            // True : un record compare par VALEUR (contenu), pas par référence</pre>
<p>Avec une classe classique, <code>a == b</code> aurait été False (deux objets différents en mémoire). Le record, lui, considère deux valeurs identiques comme égales — pratique et intuitif.</p>

<h3>4. Le pattern matching : aiguiller selon la « forme »</h3>
<p>Le <strong>pattern matching</strong> (filtrage par motif) teste la forme d'une valeur (son type, ses propriétés) et agit en conséquence, sans casts manuels. C'est un tri du courrier selon plusieurs critères à la fois.</p>
<pre class="pseudo">object x = /* ... */;                          // un objet de type inconnu
if (x is int n && n &gt; 0)                      // is + variable : SI x est un int, le range dans n
    Console.WriteLine($"Entier positif {n}");  // n est déjà typé int ici
if (x is string s)                             // teste le type ET extrait dans s d'un coup
    Console.WriteLine(s.ToUpper());            // s est une string sûre</pre>

<h3>5. switch expression avec motifs</h3>
<pre class="pseudo">string Decrire(object x) =&gt; x switch          // switch EXPRESSION : renvoie une valeur
{                                             // début
    int n when n &lt; 0  =&gt; "négatif",          // when : condition supplémentaire sur le motif
    int 0             =&gt; "zéro",              // motif constant
    int                =&gt; "entier positif",   // tout autre int
    string s          =&gt; $"texte de {s.Length} car.", // motif de type avec capture
    null              =&gt; "rien",              // motif null
    _                 =&gt; "inconnu"            // _ : le cas par défaut (sinon)
};</pre>
<div class="tip"><code>when</code> ajoute une condition à un motif ; <code>_</code> est le motif « attrape-tout » (le défaut). Le switch expression renvoie directement une valeur : plus court qu'un switch classique.</div>

<h3>6. Motifs de propriétés et déconstruction</h3>
<pre class="pseudo">string Zone(Point p) =&gt; p switch                    // filtre selon les PROPRIÉTÉS
{                                                   // début
    { X: 0, Y: 0 }        =&gt; "origine",            // motif de propriété : X vaut 0 ET Y vaut 0
    { X: 0 }              =&gt; "sur l'axe vertical",  // seulement X = 0
    { Y: 0 }              =&gt; "sur l'axe horizontal",// seulement Y = 0
    _                     =&gt; "ailleurs"            // sinon
};</pre>
<p>Records + pattern matching forment un duo moderne : des données concises, un aiguillage expressif. C'est le style « fonctionnel » du C# récent.</p>`,
  exercises: [
    { type: "qcm", q: "Une struct est un type…", opts: ["Un type référence partagé", "VALEUR : elle contient sa donnée et se COPIE à l'affectation", "Un type abstrait non instanciable", "Un type générique paramétré"], a: 1, exp: "Comme int : copie de la valeur, pas de la référence." },
    { type: "qcm", q: "<code>Point b = a;</code> avec Point struct : modifier b.X…", opts: ["Change aussi a.X", "Ne change PAS a : b est une copie indépendante", "Provoque une erreur d'exécution", "Réinitialise a à null"], a: 1, exp: "Une struct se copie : a et b sont indépendants." },
    { type: "qcm", q: "Avec une CLASSE, <code>b = a;</code> puis <code>b.X = 99</code>…", opts: ["a inchangé", "a.X change aussi : les deux variables pointent le MÊME objet (référence)", "Provoque une exception", "Crée une copie indépendante de a"], a: 1, exp: "Classe = partage de référence ; struct = copie." },
    { type: "qcm", q: "À quoi sert un record ?", opts: ["À répéter des instructions en boucle", "À transporter des DONNÉES : constructeur, propriétés, égalité, ToString générés d'une ligne", "À gérer l'accès aux fichiers", "À trier des collections"], a: 1, exp: "Le 'formulaire pré-rempli' du C#." },
    { type: "qcm", q: "<code>record Tache(string Titre, int Priorite);</code> génère automatiquement…", opts: ["Rien d'automatique", "Constructeur + propriétés + ToString lisible + égalité par valeur", "Seulement un constructeur", "Une levée d'exception"], a: 1, exp: "Beaucoup de code en une seule ligne." },
    { type: "qcm", q: "<code>Tache t2 = t with { Priorite = 3 };</code> fait…", opts: ["Modifie t directement", "Crée une COPIE de t en changeant seulement Priorite (t reste intact)", "Supprime l'objet t", "Additionne les priorités"], a: 1, exp: "with = copie modifiée non destructive." },
    { type: "vf", q: "Deux records aux mêmes valeurs sont égaux avec <code>==</code> (égalité par valeur).", a: true, exp: "Le record compare le contenu, pas l'adresse mémoire." },
    { type: "qcm", q: "Avec une classe classique, deux objets aux mêmes valeurs comparés par <code>==</code> donnent…", opts: ["True", "False par défaut : ce sont deux objets différents en mémoire", "Une exception", "null"], a: 1, exp: "Classe = égalité de référence par défaut." },
    { type: "qcm", q: "Que fait le pattern matching ?", opts: ["Trie une liste d'objets", "Teste la FORME d'une valeur (type, propriétés) et agit en conséquence", "Crée un fichier de données", "Additionne des valeurs"], a: 1, exp: "Un aiguillage selon la structure de la donnée." },
    { type: "qcm", q: "<code>if (x is int n)</code> fait deux choses :", opts: ["Rien de réellement utile", "Teste si x est un int ET le range dans la variable n (typée int)", "Crée un nouvel entier n", "Additionne x et n"], a: 1, exp: "Test de type + capture en une expression." },
    { type: "qcm", q: "Dans un switch expression, <code>_ =&gt; ...</code> représente…", opts: ["Un cas d'erreur", "Le cas PAR DÉFAUT (attrape-tout), équivalent du default", "Un motif de type entier", "Le motif de la valeur null"], a: 1, exp: "_ = 'tous les autres cas'." },
    { type: "qcm", q: "Le mot-clé <code>when</code> dans un motif sert à…", opts: ["Répéter le motif en boucle", "Ajouter une CONDITION supplémentaire au motif (ex. int n when n < 0)", "Trier selon le motif", "Créer une tâche asynchrone"], a: 1, exp: "Affine le motif avec un test." },
    { type: "vf", q: "Un switch expression <code>x switch { ... }</code> RENVOIE directement une valeur.", a: true, exp: "C'est une expression : elle produit un résultat assignable." },
    { type: "qcm", q: "<code>p switch { { X: 0, Y: 0 } =&gt; \"origine\", ... }</code> filtre selon…", opts: ["Le type de p", "Les PROPRIÉTÉS de p (X et Y valent 0)", "La taille en mémoire de p", "L'adresse mémoire de p"], a: 1, exp: "Motif de propriétés : on teste X et Y." },
    { type: "qcm", q: "Records + pattern matching représentent le style…", opts: ["Un style bas niveau proche de l'assembleur", "Moderne/fonctionnel du C# récent : données concises + aiguillage expressif", "Un style aujourd'hui obsolète", "Un style de programmation bas niveau"], a: 1, exp: "Le duo phare du C# moderne." }
  ],
  final: {
    title: "Exercice final — Décrire des formes avec records et patterns",
    intro: `<p>On décrit des figures avec des records, puis on calcule leur aire via un switch expression à motifs.</p>
<pre class="pseudo">record Cercle(double Rayon);                    // (1) record : un rayon
record Rectangle(double L, double H);           //     record : largeur, hauteur
record Carre(double Cote);                      //     record : un côté

double Aire(object f) =&gt; f switch               // (2) switch expression sur la forme
{                                               // début
    Cercle c            =&gt; 3.14 * c.Rayon * c.Rayon,  // (3) motif de type + capture
    Rectangle r         =&gt; r.L * r.H,                 //     largeur x hauteur
    Carre s when s.Cote &gt; 0 =&gt; s.Cote * s.Cote,      // (4) motif + condition when
    _                   =&gt; 0                          // (5) cas par défaut
};
Console.WriteLine(Aire(new Cercle(2)));          // → 12.56</pre>`,
    questions: [
      { type: "qcm", q: "(1) <code>record Cercle(double Rayon);</code> crée en une ligne…", opts: ["Une structure de boucle", "Un type avec propriété Rayon, constructeur, ToString et égalité par valeur", "Une classe d'exception", "Une struct"], a: 1, exp: "Le record génère tout le nécessaire." },
      { type: "qcm", q: "(2) <code>f switch { ... }</code> est…", opts: ["Une boucle sur les formes", "Un switch EXPRESSION qui renvoie l'aire selon la forme de f", "Une déclaration de classe", "Une définition de record"], a: 1, exp: "Il produit directement une valeur (l'aire)." },
      { type: "qcm", q: "(3) <code>Cercle c =&gt; ...</code> fait quoi ?", opts: ["Crée un nouveau cercle", "Teste si f est un Cercle ET le capture dans c pour lire c.Rayon", "Additionne les rayons", "Rien de particulier"], a: 1, exp: "Motif de type avec capture." },
      { type: "vf", q: "(4) <code>Carre s when s.Cote &gt; 0</code> ne s'applique que si le côté est strictement positif.", a: true, exp: "Le when ajoute la condition au motif." },
      { type: "qcm", q: "(5) À quoi sert le <code>_ =&gt; 0</code> final ?", opts: ["À trier les formes", "À couvrir TOUS les autres cas (défaut) : aire 0 si forme inconnue", "À créer un record", "À provoquer une erreur"], a: 1, exp: "Le motif attrape-tout garantit l'exhaustivité." }
    ],
    solution: `<pre class="pseudo">record Cercle/Rectangle/Carre   // types de données concis, égalité par valeur
f switch { ... }                // renvoie l'aire selon la forme
Cercle c   => πr²               // motif de type + capture de c
Rectangle r => L*H              // idem pour le rectangle
Carre s when s.Cote>0 => c²     // motif + condition when
_ => 0                          // défaut : forme inconnue
Aire(new Cercle(2)) → 12.56     // 3.14 * 2 * 2</pre>
<p>Records pour les données, pattern matching pour la logique : un code très lisible. Prochaine leçon : les expressions régulières.</p>`
  }
};
