<script>
var DAY = {
  num: 24,
  title: "Programmation asynchrone : async/await",
  subtitle: "Ne plus attendre bêtement : lancer une tâche longue et continuer à vivre.",
  theory: `
<h3>1. Le problème : l'attente qui bloque tout</h3>
<p>Certaines opérations sont LONGUES : télécharger un fichier, interroger une base, lire un disque. Si le programme les fait de façon <strong>synchrone</strong> (l'un après l'autre, en bloquant), toute l'application se fige pendant l'attente — comme une caisse de supermarché où la file entière patiente parce que la caissière est partie chercher un prix.</p>
<p>La <strong>programmation asynchrone</strong> (asynchronous programming) permet de LANCER l'opération longue et de continuer à faire autre chose pendant qu'elle se déroule, puis de récupérer le résultat quand il est prêt. La caissière prend le client suivant pendant qu'un collègue va chercher le prix.</p>

<h3>2. Task : une promesse de résultat futur</h3>
<p>Une <strong>Task</strong> représente un travail en cours qui livrera un résultat plus tard : c'est un « ticket » de retrait, une promesse. <code>Task</code> = travail sans résultat (void async) ; <code>Task&lt;T&gt;</code> = travail qui livrera un T.</p>
<pre class="pseudo">Task&lt;string&gt; promesse = TelechargerAsync(url);  // lance le téléchargement, rend un TICKET tout de suite
// le code continue ici SANS attendre la fin du téléchargement</pre>

<h3>3. async et await : le duo indissociable</h3>
<p>Le mot-clé <strong>async</strong> marque une méthode comme asynchrone (elle contiendra des attentes non bloquantes). Le mot-clé <strong>await</strong> dit « attends ici que cette Task finisse, MAIS libère le fil pendant ce temps ». Await, c'est demander « préviens-moi quand c'est prêt » au lieu de rester planté devant.</p>
<pre class="pseudo">async Task&lt;string&gt; ChargerAsync()                 // async : méthode asynchrone renvoyant Task&lt;string&gt;
{                                                 // début
    string donnees = await LireFichierAsync();    // await : attend SANS bloquer le programme
    return donnees.ToUpper();                      // reprend ici une fois les données prêtes
}</pre>
<div class="tip">Règle d'or : <code>await</code> ne s'emploie QUE dans une méthode marquée <code>async</code>. Une méthode async renvoie <code>Task</code>, <code>Task&lt;T&gt;</code> (ou <code>void</code> pour les gestionnaires d'événements uniquement). Convention : on suffixe son nom par « Async » (<code>ChargerAsync</code>).</div>

<h3>4. Ce qui se passe vraiment</h3>
<pre class="pseudo">Console.WriteLine("Avant");            // 1) s'affiche
string s = await ChargerAsync();       // 2) lance, LIBÈRE le fil, reprend ici quand fini
Console.WriteLine("Après : " + s);     // 3) s'affiche une fois les données arrivées</pre>
<p>À l'<code>await</code>, la méthode « rend la main » : le programme reste réactif (l'interface ne gèle pas). Quand la Task se termine, l'exécution reprend juste après le await, avec le résultat.</p>

<h3>5. Lancer plusieurs tâches en parallèle : Task.WhenAll</h3>
<pre class="pseudo">Task&lt;int&gt; t1 = CompterAsync("a.txt");   // lance la 1re SANS l'attendre
Task&lt;int&gt; t2 = CompterAsync("b.txt");   // lance la 2e aussi : les deux tournent EN MÊME TEMPS
int[] r = await Task.WhenAll(t1, t2);   // attend que les DEUX soient finies ; r[0] et r[1] = résultats</pre>
<div class="tip"><code>Task.WhenAll</code> lance tout en parallèle puis attend l'ensemble : bien plus rapide que deux <code>await</code> l'un après l'autre. C'est faire cuire deux plats simultanément plutôt qu'à la suite.</div>

<h3>6. Simuler une attente : Task.Delay</h3>
<pre class="pseudo">async Task PatienterAsync()                 // méthode asynchrone
{                                           // début
    Console.WriteLine("Départ");            // avant l'attente
    await Task.Delay(2000);                 // attend 2000 ms SANS bloquer (≠ Thread.Sleep qui bloque)
    Console.WriteLine("2 secondes plus tard"); // reprend après le délai
}</pre>
<div class="warn"><code>Task.Delay</code> est l'équivalent NON bloquant d'une pause : le fil reste libre pendant l'attente. À ne pas confondre avec <code>Thread.Sleep</code>, qui, lui, bloque le fil pour de bon.</div>

<h3>7. Erreurs et bon usage</h3>
<p>Une exception dans une Task remonte au moment du <code>await</code> : on l'entoure d'un <code>try/catch</code> normal. Évite d'appeler <code>.Result</code> ou <code>.Wait()</code> sur une Task (cela bloque et peut créer des interblocages) : préfère toujours <code>await</code>.</p>`,
  exercises: [
    { type: "qcm", q: "Le problème d'une opération longue SYNCHRONE, c'est…", opts: ["Elle est toujours plus fiable", "Elle BLOQUE tout le programme pendant l'attente (l'appli se fige)", "Elle s'exécute plus rapidement", "Rien de particulier ne se passe"], a: 1, exp: "Tout patiente, comme une file bloquée à la caisse." },
    { type: "qcm", q: "La programmation asynchrone permet de…", opts: ["Aller toujours plus vite en calcul pur", "Lancer une tâche longue et CONTINUER autre chose pendant qu'elle se déroule", "Supprimer toutes les erreurs d'exécution", "Éviter d'avoir à écrire des boucles"], a: 1, exp: "On ne reste pas bloqué à attendre." },
    { type: "qcm", q: "Une <code>Task&lt;string&gt;</code> représente…", opts: ["Une chaîne de caractères déjà prête", "Une PROMESSE : un travail en cours qui livrera une string plus tard", "Une erreur d'exécution", "Une boucle d'attente active"], a: 1, exp: "Un ticket de retrait pour un résultat futur." },
    { type: "qcm", q: "Le mot-clé <code>async</code> sur une méthode signifie…", opts: ["Elle s'exécute plus rapidement", "Elle est asynchrone : elle contiendra des await (attentes non bloquantes)", "Elle devient une méthode privée", "Elle s'exécute en boucle"], a: 1, exp: "async autorise l'usage de await à l'intérieur." },
    { type: "qcm", q: "<code>await</code> fait…", opts: ["Bloque le fil comme Sleep", "Attend la fin de la Task tout en LIBÉRANT le fil (non bloquant)", "Annule et supprime la Task", "Trie les tâches en attente"], a: 1, exp: "'Préviens-moi quand c'est prêt' sans rester planté." },
    { type: "vf", q: "On ne peut utiliser <code>await</code> que dans une méthode marquée <code>async</code>.", a: true, exp: "await et async vont toujours ensemble." },
    { type: "qcm", q: "Une méthode async renvoie typiquement…", opts: ["int", "Task ou Task<T> (void seulement pour les gestionnaires d'événements)", "string toujours", "void toujours"], a: 1, exp: "Task pour rien, Task<T> pour un résultat." },
    { type: "qcm", q: "Convention de nommage d'une méthode asynchrone :", opts: ["Préfixe async", "Suffixe 'Async' (ChargerAsync)", "Le nom écrit tout en majuscules", "Aucune convention particulière"], a: 1, exp: "On suffixe par Async par lisibilité." },
    { type: "qcm", q: "À l'<code>await</code>, la méthode…", opts: ["Se termine définitivement", "'Rend la main' : le programme reste réactif, l'exécution reprend après quand c'est fini", "Efface toutes les données locales", "Bloque l'interface"], a: 1, exp: "L'interface ne gèle pas pendant l'attente." },
    { type: "qcm", q: "<code>Task.WhenAll(t1, t2)</code> sert à…", opts: ["Annuler les tâches", "Lancer/attendre PLUSIEURS tâches en parallèle et récupérer tous les résultats", "Trier les tâches par durée", "Créer une Task"], a: 1, exp: "Tout tourne en même temps, on attend l'ensemble." },
    { type: "qcm", q: "Deux tâches indépendantes : plus rapide de les faire…", opts: ["L'une après l'autre (await, await)", "En parallèle avec Task.WhenAll", "En les lançant sans async", "En répétant chaque tâche deux fois"], a: 1, exp: "Cuire deux plats en même temps plutôt qu'à la suite." },
    { type: "qcm", q: "<code>await Task.Delay(2000)</code> fait…", opts: ["Bloque le fil 2s", "Attend 2s SANS bloquer le fil (contrairement à Thread.Sleep)", "Provoque une erreur d'exécution", "N'a aucun effet"], a: 1, exp: "Pause non bloquante." },
    { type: "vf", q: "<code>Thread.Sleep</code> bloque le fil, alors que <code>Task.Delay</code> ne le bloque pas.", a: true, exp: "C'est toute la différence entre attendre en bloquant ou non." },
    { type: "qcm", q: "Une exception survenue dans une Task…", opts: ["Est définitivement perdue", "Remonte au moment du await : on l'attrape avec un try/catch normal", "Fait planter tout le système", "Est silencieusement ignorée"], a: 1, exp: "try/catch autour du await comme d'habitude." },
    { type: "qcm", q: "Pourquoi éviter <code>.Result</code> ou <code>.Wait()</code> sur une Task ?", opts: ["Ils sont formellement interdits", "Ils BLOQUENT et peuvent causer des interblocages : préférer await", "Ils sont plus longs à taper", "Il n'y a aucune raison de les éviter"], a: 1, exp: "await est la voie sûre et non bloquante." }
  ],
  final: {
    title: "Exercice final — Charger deux ressources sans figer l'appli",
    intro: `<p>On simule le chargement de deux fichiers de tâches. Chacun prend un peu de temps ; on veut les charger EN PARALLÈLE puis fusionner les compteurs.</p>
<pre class="pseudo">async Task&lt;int&gt; CompterAsync(string fichier)      // (1) méthode asynchrone renvoyant un int futur
{                                                 // début
    await Task.Delay(500);                        //     simule une lecture longue, sans bloquer
    return fichier.Length;                         //     renvoie une valeur (simulée)
}
async Task MainAsync()                             // (2) méthode async pilote
{                                                 // début
    Task&lt;int&gt; a = CompterAsync("todo.txt");        // (3) lance la 1re sans attendre
    Task&lt;int&gt; b = CompterAsync("fait.txt");        //     lance la 2e : les deux tournent ensemble
    int[] r = await Task.WhenAll(a, b);            // (4) attend les DEUX
    Console.WriteLine($"Total : {r[0] + r[1]}");   // (5) somme des deux résultats
}</pre>`,
    questions: [
      { type: "qcm", q: "(1) Pourquoi la méthode est-elle <code>async Task&lt;int&gt;</code> ?", opts: ["Uniquement par choix de style", "Parce qu'elle utilise await et livrera un int plus tard (une promesse d'int)", "Parce qu'elle est déclarée privée", "Pour pouvoir faire une boucle"], a: 1, exp: "async car await dedans ; Task<int> car résultat futur." },
      { type: "qcm", q: "(2) Pourquoi <code>MainAsync</code> est-elle <code>async</code> ?", opts: ["Sans raison particulière", "Parce qu'elle contient des await (Task.WhenAll)", "Pour aller plus vite en calcul", "Pour trier les résultats"], a: 1, exp: "Toute méthode utilisant await doit être async." },
      { type: "qcm", q: "(3) En lançant a puis b SANS await entre les deux, elles…", opts: ["S'exécutent l'une après l'autre", "Tournent EN PARALLÈLE (les deux Delay se recouvrent)", "S'annulent mutuellement", "Plantent à l'exécution"], a: 1, exp: "On démarre les deux avant d'attendre." },
      { type: "vf", q: "(4) <code>await Task.WhenAll(a, b)</code> reprend seulement quand les DEUX tâches sont finies.", a: true, exp: "WhenAll attend l'ensemble des tâches." },
      { type: "qcm", q: "Grâce au parallélisme, le temps total est proche de…", opts: ["1000 ms (500+500)", "500 ms : les deux Delay se déroulent en même temps", "0 ms", "2000 ms"], a: 1, exp: "En parallèle, on n'additionne pas les attentes." }
    ],
    solution: `<pre class="pseudo">async Task<int> CompterAsync   // promesse d'un int, avec await interne
await Task.Delay(500)          // pause non bloquante (fil libéré)
Task a = ... ; Task b = ...    // on LANCE les deux avant d'attendre
await Task.WhenAll(a, b)       // attend l'ensemble → parallélisme
r[0] + r[1]                    // fusion des deux résultats
Durée ≈ 500 ms, pas 1000       // les attentes se recouvrent</pre>
<p>async/await rend le code non bloquant et lisible comme du synchrone. Task.WhenAll parallélise. Prochaine leçon : records, struct et pattern matching.</p>`
  }
};
</script>

  { id: "cs-async", title: "Un compte à rebours asynchrone", level: 3,
    statement: "Écris une méthode <code>async Task CompteReboursAsync(int n)</code> qui affiche n, n-1, … 1 avec une pause d'une seconde (<code>Task.Delay(1000)</code>) entre chaque nombre, puis affiche <code>\"Partez !\"</code>. Appelle-la depuis un <code>Main</code> asynchrone.",

    ],
    atoi: { cmd: "dotnet run", expected: "3\n2\n1\nPartez !" },
    checklist: ["CompteReboursAsync est async Task et utilise await Task.Delay(1000) dans la boucle.", "La boucle for (int i = n; i >= 1; i--) affiche n, n-1, ... 1.", "Main est static async Task et fait await CompteReboursAsync(3);.", "La sortie est 3, 2, 1 (une par ligne) puis Partez !."],
    solution: "using System;                                        // Console\nusing System.Threading.Tasks;                        // Task et Task.Delay\n\nclass CompteRebours                                  // classe programme\n{                                                    // début\n    static async Task CompteReboursAsync(int n)      // méthode asynchrone sans résultat\n    {                                                // début\n        for (int i = n; i >= 1; i--)                 // de n jusqu'à 1\n        {                                            // début du corps\n            Console.WriteLine(i);                    // affiche le nombre courant\n            await Task.Delay(1000);                  // attend 1 seconde SANS bloquer\n        }                                            // fin de la boucle\n        Console.WriteLine(\"Partez !\");               // message final\n    }                                                // fin de la méthode\n    static async Task Main()                         // point d'entrée asynchrone\n    {                                                // début de Main\n        await CompteReboursAsync(3);                 // lance et attend le compte à rebours\n    }                                                // fin de Main\n}                                                    // fin de la classe",
    note: "Main peut lui-même être async Task : c'est autorisé depuis C# 7.1. On utilise Task.Delay (non bloquant) plutôt que Thread.Sleep." }
  ]
};
