  theory: `
<h3>1. Le problème : l'attente qui bloque tout</h3>
<p>Certaines opérations sont LONGUES : télécharger un fichier, interroger une base, lire un disque. Si le programme les fait de façon <strong>synchrone</strong> (l'un après l'autre, en bloquant), toute l'application se fige pendant l'attente — comme une caisse de supermarché où la file entière patiente parce que la caissière est partie chercher un prix.</p>
<p>La <strong>programmation asynchrone</strong> (asynchronous programming) permet de LANCER l'opération longue et de continuer à faire autre chose pendant qu'elle se déroule, puis de récupérer le résultat quand il est prêt. La caissière prend le client suivant pendant qu'un collègue va chercher le prix.</p>

<h3>2. Task : une promesse de résultat futur</h3>
<p>Une <strong>Task</strong> représente un travail en cours qui livrera un résultat plus tard : c'est un « ticket » de retrait, une promesse. <code>Task</code> = travail sans résultat (void async) ; <code>Task&lt;T&gt;</code> = travail qui livrera un T.</p>
<pre class="pseudo">Task&lt;string&gt; promesse = TelechargerAsync(url);  // lance le téléchargement, rend un TICKET tout de suite
// le code continue ici SANS attendre la fin du téléchargement</pre>

<h3>3. async et await : le duo indissociable</h3>
<p>Le mot-clé <strong>async</strong> marque une méthode comme asynchrone (elle contiendra des attentes non bloquantes). Le mot-clé <strong>await</strong> dit « attends ici que cette Task finisse, MAIS libère le fil pendant ce temps ». Await, c'est demander « préviens-moi quand c'est prêt » au lieu de rester planté devant.</p>
<pre class="pseudo">async Task&lt;string&gt; ChargerAsync()                 // async : méthode asynchrone renvoyant Task&lt;string&gt;
{                                                 // début
    string donnees = await LireFichierAsync();    // await : attend SANS bloquer le programme
    return donnees.ToUpper();                      // reprend ici une fois les données prêtes
}</pre>
<div class="tip">Règle d'or : <code>await</code> ne s'emploie QUE dans une méthode marquée <code>async</code>. Une méthode async renvoie <code>Task</code>, <code>Task&lt;T&gt;</code> (ou <code>void</code> pour les gestionnaires d'événements uniquement). Convention : on suffixe son nom par « Async » (<code>ChargerAsync</code>).</div>

<h3>4. Ce qui se passe vraiment</h3>
<pre class="pseudo">Console.WriteLine("Avant");            // 1) s'affiche
string s = await ChargerAsync();       // 2) lance, LIBÈRE le fil, reprend ici quand fini
Console.WriteLine("Après : " + s);     // 3) s'affiche une fois les données arrivées</pre>
<p>À l'<code>await</code>, la méthode « rend la main » : le programme reste réactif (l'interface ne gèle pas). Quand la Task se termine, l'exécution reprend juste après le await, avec le résultat.</p>

<h3>5. Lancer plusieurs tâches en parallèle : Task.WhenAll</h3>
<pre class="pseudo">Task&lt;int&gt; t1 = CompterAsync("a.txt");   // lance la 1re SANS l'attendre
Task&lt;int&gt; t2 = CompterAsync("b.txt");   // lance la 2e aussi : les deux tournent EN MÊME TEMPS
int[] r = await Task.WhenAll(t1, t2);   // attend que les DEUX soient finies ; r[0] et r[1] = résultats</pre>
<div class="tip"><code>Task.WhenAll</code> lance tout en parallèle puis attend l'ensemble : bien plus rapide que deux <code>await</code> l'un après l'autre. C'est faire cuire deux plats simultanément plutôt qu'à la suite.</div>

<h3>6. Simuler une attente : Task.Delay</h3>
<pre class="pseudo">async Task PatienterAsync()                 // méthode asynchrone
{                                           // début
    Console.WriteLine("Départ");            // avant l'attente
    await Task.Delay(2000);                 // attend 2000 ms SANS bloquer (≠ Thread.Sleep qui bloque)
    Console.WriteLine("2 secondes plus tard"); // reprend après le délai
}</pre>
<div class="warn"><code>Task.Delay</code> est l'équivalent NON bloquant d'une pause : le fil reste libre pendant l'attente. À ne pas confondre avec <code>Thread.Sleep</code>, qui, lui, bloque le fil pour de bon.</div>

<h3>7. Erreurs et bon usage</h3>
<p>Une exception dans une Task remonte au moment du <code>await</code> : on l'entoure d'un <code>try/catch</code> normal. Évite d'appeler <code>.Result</code> ou <code>.Wait()</code> sur une Task (cela bloque et peut créer des interblocages) : préfère toujours <code>await</code>.</p>`,

<pre class="pseudo">async Task&lt;int&gt; CompterAsync(string fichier)      // (1) méthode asynchrone renvoyant un int futur

c async Task PatienterAsync()\n    {\n        Console.WriteLine(\"  synchronisation avec l'horloge du réseau…\");\n        await Task.Delay(200);                 // attend SANS bloquer le fil\n        Console.WriteLine(\"  horloge synchronisée\");\n    }\n\n    // Une méthode asynchrone rend une promesse de résultat, pas le résultat.\n    static async Task<Train> ChargerTrainAsync(string numero, string destination,\n                                               int retardMinutes, int delaiMs)\n    {\n        await Task.Delay(delaiMs);             // simule l'interrogation du système central\n        if (numero == \"\")\n        {\n            throw new ArgumentException(\"aucun numéro de train fourni\");\n        }\n        return new Train(numero, destination, retardMinutes);\n    }\n\n    static int Compter(Train[] trains, int retardMaximum)\n    {\n        int n = 0;\n        foreach (Train t in trains)\n        {\n            if (t.RetardMinutes <= retardMaximum)\n            {\n                n++;\n            }\n        }\n        return n;\n    }\n}\n\nclass Train\n{\n    public string Numero { get; private set; }\n    public string Destination { get; private set; }\n    public int RetardMinutes { get; private set; }\n\n    public Train(string numero, string destination, int retardMinutes)\n    {\n        if (retardMinutes < 0)\n        {\n            throw new ArgumentException($\"{numero} : retard de {retardMinutes} minutes impossible\");\n        }\n        this.Numero = numero;\n        this.Destination = destination;\n        this.RetardMinutes = retardMinutes;\n    }\n\n    public override string ToString()\n    {\n        string etat = \"à l'heure\";\n        if (RetardMinutes > 0)\n        {\n            etat = $\"retard {RetardMinutes} min\";\n        }\n        return $\"{Numero} → {Destination} — {etat}\";\n    }\n}",

      "enonce": "Un serveur sauvegarde cinq volumes chaque nuit. Écris une classe de volume portant un nom, une taille en mégaoctets et une durée de copie en millisecondes, refusant des valeurs négatives. Déclare : documents (120 Mo, 300 ms), photos (450 Mo, 500 ms), comptabilite (80 Mo, 200 ms), sauvegarde-web (0 Mo, 0 ms) et messagerie (260 Mo, 400 ms). Affiche l'effectif, le nombre de volumes non vides et le total à copier. Écris une méthode asynchrone de sauvegarde qui patiente la durée du volume puis <strong>lance si le volume est vide</strong>, et une seconde méthode asynchrone qui appelle la première <strong>en absorbant son échec</strong> et rend zéro. Mène ensuite la nuit de trois façons. D'abord <strong>l'une après l'autre, chaque volume protégé</strong> : compte les réussites, les échecs, les mégaoctets, tiens un journal, et chronomètre. Ensuite <strong>toutes en même temps, sans protection individuelle</strong> : lance les cinq, attends l'ensemble, et rattrape — puis chronomètre. Enfin <strong>toutes en même temps, chaque volume protégé à la source</strong> : récupère le tableau des résultats, compte les réussites et les mégaoctets, affiche chaque volume avec ce qu'il a copié, et chronomètre. Affiche ensuite quatre affirmations vraies quelle que soit la machine : les deux stratégies copient autant, comptent autant de réussites, la parallèle protégée est plus rapide, et les résultats reviennent dans l'ordre de lancement. Écris le journal dans un fichier. Termine en montrant que le volume le plus gros est aussi le plus lent, et en disant ce que cela implique pour la durée d'une nuit menée en parallèle.",

        "Écris la première stratégie seule et fais-la tourner. Quatre réussites, un échec, 910 Mo, et un temps autour de la somme des durées : note ces quatre nombres, ils sont ta référence. Les deux stratégies suivantes doivent retomber exactement dessus, à la durée près — si l'une d'elles donne un autre total, ce n'est pas la machine, c'est ton code.",

      "solution": "// La chaîne de sauvegarde nocturne : cinq volumes, deux stratégies, une panne.\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Linq;\nusing System.Threading.Tasks;\n\nclass Program\n{\n    static async Task Main(string[] args)\n    {\n        const string RAPPORT = \"sauvegarde.txt\";\n\n        List<Volume> volumes = new List<Volume>();\n        volumes.Add(new Volume(\"documents\", 120, 300));\n        volumes.Add(new Volume(\"photos\", 450, 500));\n        volumes.Add(new Volume(\"comptabilite\", 80, 200));\n        volumes.Add(new Volume(\"sauvegarde-web\", 0, 0));      // volume vide : il échouera\n        volumes.Add(new Volume(\"messagerie\", 260, 400));\n\n        Console.WriteLine($\"Volumes déclarés : {volumes.Count}\");\n        Console.WriteLine($\"Volumes non vides : {volumes.Count(v => v.TailleMo > 0)}\");\n        Console.WriteLine($\"Données à sauvegarder : {volumes.Sum(v => v.TailleMo)} Mo\");\n\n        Console.WriteLine();\n\n        // Stratégie 1 : l'un après l'autre, chacun protégé, la chaîne va au bout.\n        Console.WriteLine(\"SAUVEGARDE SÉQUENTIELLE, CHAQUE VOLUME PROTÉGÉ\");\n        DateTime debutSeq = DateTime.Now;\n        int reussisSeq = 0;\n        int echouesSeq = 0;\n        int moSeq = 0;\n        List<string> journal = new List<string>();\n\n        foreach (Volume v in volumes)\n        {\n            try\n            {\n                int mo = await SauvegarderAsync(v);\n                reussisSeq++;\n                moSeq += mo;\n                journal.Add($\"{v.Nom} : {mo} Mo copiés\");\n                Console.WriteLine($\"  {v.Nom} : {mo} Mo copiés\");\n            }\n            catch (ArgumentException e)\n            {\n                echouesSeq++;\n                journal.Add($\"{v.Nom} : ÉCHEC — {e.Message}\");\n                Console.WriteLine($\"  {v.Nom} : ÉCHEC — {e.Message}\");\n            }\n        }\n        TimeSpan dureeSeq = DateTime.Now - debutSeq;\n        Console.WriteLine($\"Réussis : {reussisSeq} · échoués : {echouesSeq} · {moSeq} Mo\");\n        Console.WriteLine($\"Temps écoulé : {(int)dureeSeq.TotalMilliseconds} ms environ\");\n\n        Console.WriteLine();\n\n        // Stratégie 2 : tout en même temps, sans protection individuelle. Un échec suffit.\n        Console.WriteLine(\"SAUVEGARDE PARALLÈLE, SANS PROTECTION INDIVIDUELLE\");\n        DateTime debutTout = DateTime.Now;\n        try\n        {\n            List<Task<int>> lancees = new List<Task<int>>();\n            foreach (Volume v in volumes)\n            {\n                lancees.Add(SauvegarderAsync(v));      // lancées, pas attendues\n            }\n            int[] resultats = await Task.WhenAll(lancees);\n            Console.WriteLine($\"  {resultats.Sum()} Mo copiés\");\n        }\n        catch (ArgumentException e)\n        {\n            Console.WriteLine($\"  La grappe entière est perdue : {e.Message}\");\n            Console.WriteLine(\"  Une seule exception remonte, alors qu'un seul volume a échoué\");\n        }\n        TimeSpan dureeTout = DateTime.Now - debutTout;\n        Console.WriteLine($\"Temps écoulé : {(int)dureeTout.TotalMilliseconds} ms environ\");\n\n        Console.WriteLine();\n\n        // Stratégie 3 : tout en même temps, mais chaque volume protégé à la source.\n        Console.WriteLine(\"SAUVEGARDE PARALLÈLE, CHAQUE VOLUME PROTÉGÉ\");\n        DateTime debutPar = DateTime.Now;\n        List<Task<int>> travaux = new List<Task<int>>();\n        foreach (Volume v in volumes)\n        {\n            travaux.Add(SauvegarderProtegeAsync(v));\n        }\n        int[] copies = await Task.WhenAll(travaux);\n        TimeSpan dureePar = DateTime.Now - debutPar;\n\n        int reussisPar = 0;\n        int moPar = 0;\n        for (int i = 0; i < copies.Length; i++)\n        {\n            if (copies[i] > 0)\n            {\n                reussisPar++;\n                moPar += copies[i];\n            }\n            Console.WriteLine($\"  {volumes[i].Nom} : {copies[i]} Mo\");\n        }\n        Console.WriteLine($\"Réussis : {reussisPar} · {moPar} Mo\");\n        Console.WriteLine($\"Temps écoulé : {(int)dureePar.TotalMilliseconds} ms environ\");\n\n        Console.WriteLine();\n\n        // Les millisecondes varient d'une machine à l'autre ; ces quatre lignes, non.\n        Console.WriteLine(\"CE QUI EST VÉRIFIABLE MALGRÉ LES MILLISECONDES\");\n        Console.WriteLine($\"Les deux stratégies copient la même quantité : {moSeq == moPar}\");\n        Console.WriteLine($\"Les deux comptent le même nombre de réussites : \"\n                        + $\"{reussisSeq == reussisPar}\");\n        Console.WriteLine($\"Le parallèle protégé est plus rapide que le séquentiel : \"\n                        + $\"{dureePar < dureeSeq}\");\n        Console.WriteLine($\"Les résultats reviennent dans l'ordre de lancement : \"\n                        + $\"{copies[0] == 120 && copies[4] == 260}\");\n\n        Console.WriteLine();\n\n        File.WriteAllLines(RAPPORT, journal);\n        Console.WriteLine($\"{File.ReadAllLines(RAPPORT).Length} lignes dans {RAPPORT}\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"LE PLUS GROS VOLUME EST AUSSI LE PLUS LENT\");\n        Volume plusGros = volumes.OrderByDescending(v => v.TailleMo).First();\n        Volume plusLent = volumes.OrderByDescending(v => v.DureeMs).First();\n        Console.WriteLine($\"Plus gros : {plusGros.Nom} ({plusGros.TailleMo} Mo)\");\n        Console.WriteLine($\"Plus lent : {plusLent.Nom} ({plusLent.DureeMs} ms)\");\n        Console.WriteLine($\"C'est le même : {plusGros.Nom == plusLent.Nom}\");\n        Console.WriteLine(\"En parallèle, c'est lui qui fixe la durée totale de la nuit.\");\n    }\n\n    // Lance si le volume est vide : une exception dans une tâche remonte au moment de l'attente.\n    static async Task<int> SauvegarderAsync(Volume v)\n    {\n        await Task.Delay(v.DureeMs);\n        if (v.TailleMo <= 0)\n        {\n            throw new ArgumentException($\"{v.Nom} : volume vide, rien à copier\");\n        }\n        return v.TailleMo;\n    }\n\n    // La même, mais qui absorbe son propre échec et rend zéro.\n    static async Task<int> SauvegarderProtegeAsync(Volume v)\n    {\n        try\n        {\n            return await SauvegarderAsync(v);\n        }\n        catch (ArgumentException)\n        {\n            return 0;\n        }\n    }\n}\n\nclass Volume\n{\n    public string Nom { get; private set; }\n    public int TailleMo { get; private set; }\n    public int DureeMs { get; private set; }\n\n    public Volume(string nom, int tailleMo, int dureeMs)\n    {\n        if (tailleMo < 0 || dureeMs < 0)\n        {\n            throw new ArgumentException($\"{nom} : taille ou durée négative impossible\");\n        }\n        this.Nom = nom;\n        this.TailleMo = tailleMo;\n        this.DureeMs = dureeMs;\n    }\n\n    public override string ToString()\n    {\n        return $\"{Nom} — {TailleMo} Mo — {DureeMs} ms\";\n    }\n}",

      "solution": "// Le marché du samedi, jour 4 : trois marchés, trois fichiers, un seul rapport.\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Linq;\nusing System.Threading.Tasks;\n\nclass Program\n{\n    static async Task Main(string[] args)\n    {\n        const int REDEVANCE_M2 = 250;\n        const int SEUIL = 40000;\n\n        EcrireFeuilles();\n\n        // Les trois lectures sont lancées ensemble, puis attendues d'un bloc.\n        Console.WriteLine(\"CHARGEMENT DES TROIS MARCHÉS\");\n        DateTime debutPar = DateTime.Now;\n        Task<List<Etal>> tCommunal = ChargerAsync(\"marche-communal.csv\", \"Communal\", 300);\n        Task<List<Etal>> tGare = ChargerAsync(\"marche-gare.csv\", \"Gare\", 400);\n        Task<List<Etal>> tSablon = ChargerAsync(\"marche-sablon.csv\", \"Sablon\", 250);\n        List<Etal>[] feuilles = await Task.WhenAll(tCommunal, tGare, tSablon);\n        TimeSpan dureePar = DateTime.Now - debutPar;\n\n        Console.WriteLine($\"Communal : {feuilles[0].Count} étals\");\n        Console.WriteLine($\"Gare : {feuilles[1].Count} étals\");\n        Console.WriteLine($\"Sablon : {feuilles[2].Count} étals\");\n        Console.WriteLine($\"Temps de chargement : {(int)dureePar.TotalMilliseconds} ms environ\");\n\n        Console.WriteLine();\n\n        // Les mêmes lectures, une par une, pour comparer.\n        Console.WriteLine(\"LES MÊMES LECTURES, L'UNE APRÈS L'AUTRE\");\n        DateTime debutSeq = DateTime.Now;\n        List<Etal> c1 = await ChargerAsync(\"marche-communal.csv\", \"Communal\", 300);\n        List<Etal> c2 = await ChargerAsync(\"marche-gare.csv\", \"Gare\", 400);\n        List<Etal> c3 = await ChargerAsync(\"marche-sablon.csv\", \"Sablon\", 250);\n        TimeSpan dureeSeq = DateTime.Now - debutSeq;\n        Console.WriteLine($\"Temps de chargement : {(int)dureeSeq.TotalMilliseconds} ms environ\");\n        Console.WriteLine($\"Le parallèle est plus rapide : {dureePar < dureeSeq}\");\n        Console.WriteLine($\"Les deux chargements donnent le même effectif : \"\n                        + $\"{c1.Count + c2.Count + c3.Count == feuilles[0].Count + feuilles[1].Count + feuilles[2].Count}\");\n\n        Console.WriteLine();\n\n        // Un quatrième marché annoncé mais dont le fichier n'existe pas.\n        Console.WriteLine(\"UN MARCHÉ ANNONCÉ ET ABSENT\");\n        try\n        {\n            List<Etal> fantome = await ChargerAsync(\"marche-quai.csv\", \"Quai\", 100);\n            Console.WriteLine($\"Quai : {fantome.Count} étals\");\n        }\n        catch (FileNotFoundException e)\n        {\n            Console.WriteLine($\"  Chargement impossible : {e.Message}\");\n            Console.WriteLine(\"  Le rapport se fera sur les trois marchés reçus\");\n        }\n\n        Console.WriteLine();\n\n        // Fusion : à partir d'ici, tout ce qui a été écrit les trois jours précédents s'applique.\n        List<Etal> tous = new List<Etal>();\n        foreach (List<Etal> feuille in feuilles)\n        {\n            foreach (Etal e in feuille)\n            {\n                tous.Add(e);\n            }\n        }\n        Console.WriteLine($\"Étals consolidés : {tous.Count}\");\n        Console.WriteLine($\"Chiffres déclarés : {tous.Count(e => e.ChiffreCentimes.HasValue)}\");\n        Console.WriteLine($\"Déclarations manquantes : \"\n                        + $\"{tous.Count(e => !e.ChiffreCentimes.HasValue)}\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"PAR MARCHÉ\");\n        foreach (var groupe in tous.GroupBy(e => e.Marche).OrderBy(g => g.Key))\n        {\n            int cumulGroupe = 0;\n            int declarantsGroupe = 0;\n            foreach (Etal e in groupe)\n            {\n                if (e.ChiffreCentimes.HasValue)\n                {\n                    cumulGroupe += e.ChiffreCentimes.Value;\n                    declarantsGroupe++;\n                }\n            }\n            Console.WriteLine($\"{groupe.Key} : {groupe.Count()} étals, {declarantsGroupe} \"\n                            + $\"déclarants, {cumulGroupe / 100.0:F2} €, \"\n                            + $\"{groupe.Sum(e => e.SurfaceM2)} m²\");\n        }\n\n        Console.WriteLine();\n\n        int cumul = 0;\n        int declarants = 0;\n        foreach (Etal e in tous)\n        {\n            if (e.ChiffreCentimes.HasValue)\n            {\n                cumul += e.ChiffreCentimes.Value;\n                declarants++;\n            }\n        }\n        Console.WriteLine(\"LE RÉSEAU EN CHIFFRES\");\n        Console.WriteLine($\"Chiffre déclaré cumulé : {cumul / 100.0:F2} €\");\n        Console.WriteLine($\"Surface occupée : {Totaliser(tous, e => e.SurfaceM2)} m²\");\n        Console.WriteLine($\"Redevance due : \"\n                        + $\"{Totaliser(tous, e => e.SurfaceM2 * REDEVANCE_M2) / 100.0:F2} €\");\n        Console.WriteLine($\"Moyenne sur les {declarants} déclarants : \"\n                        + $\"{(double)cumul / declarants / 100.0:F2} €\");\n        Console.WriteLine($\"Moyenne sur les {tous.Count} étals : \"\n                        + $\"{(double)cumul / tous.Count / 100.0:F2} €\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"PAR CATÉGORIE, TOUS MARCHÉS CONFONDUS\");\n        foreach (var cat in tous.GroupBy(e => e.Categorie).OrderBy(g => g.Key))\n        {\n            Console.WriteLine($\"{cat.Key} : {cat.Count()} étal(s), \"\n                            + $\"{cat.Sum(e => e.ChiffreCentimes ?? 0) / 100.0:F2} € déclarés\");\n        }\n\n        Console.WriteLine();\n\n        // Le contrôle des trois jours précédents, appliqué au réseau entier.\n        Controle controle = new Controle(SEUIL);\n        int depassements = 0;\n        int cumulEcart = 0;\n        List<string> manquants = new List<string>();\n\n        controle.Depassement += (e, ecart) =>\n        {\n            depassements++;\n            cumulEcart += ecart;\n        };\n        controle.NonDeclare += e => manquants.Add($\"{e.Marche} {e.Code} {e.Exposant}\");\n\n        controle.Examiner(tous);\n        Console.WriteLine($\"Dépassements du seuil de {SEUIL / 100.0:F2} € : {depassements}\");\n        Console.WriteLine($\"Cumul au-dessus du seuil : {cumulEcart / 100.0:F2} €\");\n        Console.WriteLine($\"Déclarations à réclamer : {manquants.Count}\");\n        foreach (string m in manquants)\n        {\n            Console.WriteLine($\"  {m}\");\n        }\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"LES TROIS PLUS GROS CHIFFRES DU RÉSEAU\");\n        List<Etal> classes = Filtrer(tous, e => e.ChiffreCentimes.HasValue)\n            .OrderByDescending(e => e.ChiffreCentimes.Value)\n            .ToList();\n        for (int i = 0; i < 3; i++)\n        {\n            Console.WriteLine($\"  {i + 1}. {classes[i]}\");\n        }\n\n        Console.WriteLine();\n\n        // Les trois écritures de rapport, lancées ensemble elles aussi.\n        Console.WriteLine(\"ÉCRITURE DES TROIS RAPPORTS\");\n        Task r1 = EcrireRapportAsync(\"rapport-communal.csv\", feuilles[0]);\n        Task r2 = EcrireRapportAsync(\"rapport-gare.csv\", feuilles[1]);\n        Task r3 = EcrireRapportAsync(\"rapport-sablon.csv\", feuilles[2]);\n        await Task.WhenAll(r1, r2, r3);\n        Console.WriteLine($\"rapport-communal.csv : \"\n                        + $\"{File.ReadAllLines(\"rapport-communal.csv\").Length} lignes\");\n        Console.WriteLine($\"rapport-gare.csv : \"\n                        + $\"{File.ReadAllLines(\"rapport-gare.csv\").Length} lignes\");\n        Console.WriteLine($\"rapport-sablon.csv : \"\n                        + $\"{File.ReadAllLines(\"rapport-sablon.csv\").Length} lignes\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"CE QUI EST VÉRIFIABLE MALGRÉ LES MILLISECONDES\");\n        Console.WriteLine($\"Les trois feuilles reviennent dans l'ordre demandé : \"\n                        + $\"{feuilles[0][0].Marche == \"Communal\" && feuilles[2][0].Marche == \"Sablon\"}\");\n        Console.WriteLine($\"Le total consolidé vaut la somme des trois : \"\n                        + $\"{tous.Count == feuilles[0].Count + feuilles[1].Count + feuilles[2].Count}\");\n    }\n\n    static async Task<List<Etal>> ChargerAsync(string fichier, string marche, int delaiMs)\n    {\n        await Task.Delay(delaiMs);                  // simule une lecture réseau\n        if (!File.Exists(fichier))\n        {\n            throw new FileNotFoundException($\"le fichier {fichier} du marché {marche} est absent\");\n        }\n        List<Etal> feuille = new List<Etal>();\n        foreach (string ligne in File.ReadAllLines(fichier))\n        {\n            if (ligne == \"\")\n            {\n                continue;\n            }\n            feuille.Add(Etal.DepuisLigne(ligne, marche));\n        }\n        return feuille;\n    }\n\n    static async Task EcrireRapportAsync(string fichier, List<Etal> feuille)\n    {\n        await Task.Delay(150);\n        List<string> lignes = feuille\n            .OrderByDescending(e => e.ChiffreCentimes ?? 0)\n            .Select(e => $\"{e.Marche};{e.Code};{e.Exposant};{e.ChiffreCentimes ?? 0}\")\n            .ToList();\n        File.WriteAllLines(fichier, lignes);\n    }\n\n    static List<Etal> Filtrer(List<Etal> source, Func<Etal, bool> critere)\n    {\n        List<Etal> retenus = new List<Etal>();\n        foreach (Etal e in source)\n        {\n            if (critere(e))\n            {\n                retenus.Add(e);\n            }\n        }\n        return retenus;\n    }\n\n    static int Totaliser(List<Etal> source, Func<Etal, int> mesure)\n    {\n        int total = 0;\n        foreach (Etal e in source)\n        {\n            total += mesure(e);\n        }\n        return total;\n    }\n\n    static void EcrireFeuilles()\n    {\n        if (!File.Exists(\"marche-communal.csv\"))\n        {\n            List<string> f = new List<string>();\n            f.Add(\"E-01;Verhoeven;maraîcher;12;48500\");\n            f.Add(\"E-02;Lambert;fromager;6;31200\");\n            f.Add(\"E-03;Ozturk;traiteur;9;52700\");\n            f.Add(\"E-04;Nkosi;textile;15;\");\n            f.Add(\"E-05;Dubois;maraîcher;10;41300\");\n            f.Add(\"E-06;Petrov;boulanger;6;28900\");\n            f.Add(\"E-07;Simon;fleuriste;4;15600\");\n            f.Add(\"E-08;Haddad;traiteur;12;61400\");\n            f.Add(\"E-09;Marchal;maraîcher;8;33500\");\n            f.Add(\"E-10;Weber;fromager;5;\");\n            f.Add(\"E-11;Lopes;textile;18;24300\");\n            f.Add(\"E-12;Bianchi;boulanger;7;35800\");\n            File.WriteAllLines(\"marche-communal.csv\", f);\n        }\n        if (!File.Exists(\"marche-gare.csv\"))\n        {\n            List<string> f = new List<string>();\n            f.Add(\"G-01;Ferrand;boulanger;5;27400\");\n            f.Add(\"G-02;Ilunga;traiteur;8;44900\");\n            f.Add(\"G-03;Sanchez;maraîcher;9;36200\");\n            f.Add(\"G-04;Bakker;textile;12;\");\n            f.Add(\"G-05;Rossi;fromager;6;29800\");\n            f.Add(\"G-06;Diallo;fleuriste;3;12100\");\n            File.WriteAllLines(\"marche-gare.csv\", f);\n        }\n        if (!File.Exists(\"marche-sablon.csv\"))\n        {\n            List<string> f = new List<string>();\n            f.Add(\"S-01;Moretti;traiteur;10;58300\");\n            f.Add(\"S-02;Keller;maraîcher;7;31900\");\n            f.Add(\"S-03;Nowak;brocanteur;14;18700\");\n            f.Add(\"S-04;Amrani;boulanger;6;33100\");\n            f.Add(\"S-05;Vogel;fromager;5;\");\n            File.WriteAllLines(\"marche-sablon.csv\", f);\n        }\n    }\n}\n\nclass Controle\n{\n    public int SeuilCentimes { get; private set; }\n\n    public event Action<Etal, int> Depassement;\n    public event Action<Etal> NonDeclare;\n\n    public Controle(int seuilCentimes)\n    {\n        if (seuilCentimes <= 0)\n        {\n            throw new ArgumentException($\"seuil de {seuilCentimes} centimes impossible\");\n        }\n        this.SeuilCentimes = seuilCentimes;\n    }\n\n    public void Examiner(List<Etal> marche)\n    {\n        foreach (Etal e in marche)\n        {\n            if (!e.ChiffreCentimes.HasValue)\n            {\n                NonDeclare?.Invoke(e);\n                continue;\n            }\n            if (e.ChiffreCentimes.Value > SeuilCentimes)\n            {\n                Depassement?.Invoke(e, e.ChiffreCentimes.Value - SeuilCentimes);\n            }\n        }\n    }\n}\n\nclass Etal\n{\n    public string Marche { get; private set; }\n    public string Code { get; private set; }\n    public string Exposant { get; private set; }\n    public string Categorie { get; private set; }\n    public int SurfaceM2 { get; private set; }\n    public int? ChiffreCentimes { get; private set; }\n\n    public Etal(string marche, string code, string exposant, string categorie, int surfaceM2,\n                int? chiffreCentimes)\n    {\n        if (surfaceM2 <= 0)\n        {\n            throw new ArgumentException($\"{code} : surface de {surfaceM2} m² impossible\");\n        }\n        if (chiffreCentimes.HasValue && chiffreCentimes.Value < 0)\n        {\n            throw new ArgumentException($\"{code} : chiffre négatif impossible\");\n        }\n        this.Marche = marche;\n        this.Code = code;\n        this.Exposant = exposant;\n        this.Categorie = categorie;\n        this.SurfaceM2 = surfaceM2;\n        this.ChiffreCentimes = chiffreCentimes;\n    }\n\n    public static Etal DepuisLigne(string ligne, string marche)\n    {\n        string[] champs = ligne.Split(';');\n        if (champs.Length != 5)\n        {\n            throw new ArgumentException($\"« {ligne} » : cinq champs attendus\");\n        }\n        int? chiffre = null;\n        if (champs[4] != \"\")\n        {\n            chiffre = int.Parse(champs[4]);\n        }\n        return new Etal(marche, champs[0], champs[1], champs[2], int.Parse(champs[3]), chiffre);\n    }\n\n    public override string ToString()\n    {\n        string chiffre = \"non déclaré\";\n        if (ChiffreCentimes.HasValue)\n        {\n            chiffre = $\"{ChiffreCentimes.Value / 100.0:F2} €\";\n        }\n        return $\"{Marche} {Code} — {Exposant} ({Categorie}) — {SurfaceM2} m² — {chiffre}\";\n    }\n}",
      "pourquoi": "Vingt-trois étals venus de trois fichiers, chargés en parallèle, dont quatre n'ont rien déclaré, analysés par des critères passés en paramètres, et contrôlés par un signal auquel deux réactions se sont abonnées. Chacune de ces quatre capacités a été ajoutée un jour différent, et aucune n'a demandé de défaire la précédente. C'est ce qu'on attend d'une semaine de travail.",
      "checklist": [
        "Le réseau consolidé compte-t-il 23 étals, dont 19 déclarants et 4 manquants ?",
        "Le chiffre cumulé vaut-il 6 656,00 €, pour 197 m² et 492,50 € de redevance ?",
        "Les deux moyennes donnent-elles 350,32 € et 289,39 € ?",
        "Le contrôle relève-t-il 6 dépassements pour 671,00 € cumulés, et 4 déclarations à réclamer ?",
        "Les trois plus gros chiffres sont-ils E-08, S-01 puis E-03 ?"
      ],
      "note": "Fin de la série, et fin du lot. Le marché du samedi a servi quatre fois : à poser des questions, à les recevoir de l'extérieur, à survivre aux données manquantes, et à travailler sur trois sources à la fois. Les douze étals du lundi sont toujours là, avec les mêmes chiffres — et c'est précisément ce qui permet d'affirmer que rien n'a été cassé en chemin."
    }
  ]
};

  { id: "cs-async", title: "Un compte à rebours asynchrone", level: 3,
    statement: "Écris une méthode <code>async Task CompteReboursAsync(int n)</code> qui affiche n, n-1, … 1 avec une pause d'une seconde (<code>Task.Delay(1000)</code>) entre chaque nombre, puis affiche <code>\"Partez !\"</code>. Appelle-la depuis un <code>Main</code> asynchrone.",
    hints: [

    ],
    atoi: { cmd: "dotnet run", expected: "3\n2\n1\nPartez !" },
    checklist: ["CompteReboursAsync est async Task et utilise await Task.Delay(1000) dans la boucle.", "La boucle for (int i = n; i >= 1; i--) affiche n, n-1, ... 1.", "Main est static async Task et fait await CompteReboursAsync(3);.", "La sortie est 3, 2, 1 (une par ligne) puis Partez !."],
    solution: "using System;                                        // Console\nusing System.Threading.Tasks;                        // Task et Task.Delay\n\nclass CompteRebours                                  // classe programme\n{                                                    // début\n    static async Task CompteReboursAsync(int n)      // méthode asynchrone sans résultat\n    {                                                // début\n        for (int i = n; i >= 1; i--)                 // de n jusqu'à 1\n        {                                            // début du corps\n            Console.WriteLine(i);                    // affiche le nombre courant\n            await Task.Delay(1000);                  // attend 1 seconde SANS bloquer\n        }                                            // fin de la boucle\n        Console.WriteLine(\"Partez !\");               // message final\n    }                                                // fin de la méthode\n    static async Task Main()                         // point d'entrée asynchrone\n    {                                                // début de Main\n        await CompteReboursAsync(3);                 // lance et attend le compte à rebours\n    }                                                // fin de Main\n}                                                    // fin de la classe",
    note: "Main peut lui-même être async Task : c'est autorisé depuis C# 7.1. On utilise Task.Delay (non bloquant) plutôt que Thread.Sleep." }
  ]
};
