  num: 18,
  title: "Dictionary et découverte de LINQ",
  subtitle: "Associer clés et valeurs, puis interroger ses données comme du SQL.",
  theory: `
<h3>1. Dictionary&lt;K, V&gt; : associer des clés à des valeurs</h3>
<p>Là où un tableau/liste range des valeurs à des indices numériques, un <strong>dictionnaire</strong> range des valeurs sous des <strong>clés</strong> de ton choix (un nom, un code…). C'est la <code>HashMap</code> de Java, la structure « clé → valeur ».</p>
<pre class="pseudo">using System.Collections.Generic;

Dictionary&lt;string, int&gt; notes = new Dictionary&lt;string, int&gt;();  // clés string (les noms) → valeurs int (les notes)
notes["Ana"] = 14;              // ajoute (ou modifie) l'entrée « Ana » via les crochets (comme PHP)
notes["Bob"] = 9;               // une deuxième entrée
notes["Ana"]                    // → 14 : accès DIRECT par la clé, quasi instantané (pas de parcours)
notes.ContainsKey("Zoé")        // → false : « Zoé » n'est pas une clé du dictionnaire
notes.Remove("Bob");            // retire l'entrée « Bob »
notes.Count                     // → le nombre d'entrées</pre>
<div class="warn">Accéder à une clé ABSENTE avec les crochets (<code>notes["Fantôme"]</code>) lance une <code>KeyNotFoundException</code> ! Différence avec PHP (qui donnait juste un avertissement). Teste d'abord avec <code>ContainsKey</code>, ou utilise <code>TryGetValue</code>.</div>

<h3>2. L'accès sûr : TryGetValue</h3>
<pre class="pseudo">if (notes.TryGetValue("Zoé", out int n))   // tente de lire « Zoé » : renvoie true et remplit n si la clé existe
{
    Console.WriteLine($"Zoé : {n}");        // exécuté seulement si la clé était présente
}
else
{
    Console.WriteLine("Zoé absente");       // pas de plantage : on gère proprement l'absence
}</pre>
<p>C'est le pendant de <code>int.TryParse</code> (leçon 4) pour les dictionnaires : sûr par construction, il évite l'exception sur une clé manquante.</p>

<h3>3. Parcourir un dictionnaire</h3>
<pre class="pseudo">foreach (var paire in notes)                 // chaque « paire » a une clé (.Key) et une valeur (.Value)
{
    Console.WriteLine($"{paire.Key} → {paire.Value}");  // ex. « Ana → 14 »
}
foreach (string cle in notes.Keys) { /* ... */ }   // on peut aussi parcourir seulement les clés (ou .Values)</pre>

<h3>4. Le motif « compteur d'occurrences »</h3>
<pre class="pseudo">string[] mots = { "chat", "chien", "chat", "chat" };
var compte = new Dictionary&lt;string, int&gt;();    // mot → nombre d'apparitions
foreach (string m in mots)
{
    if (!compte.ContainsKey(m)) { compte[m] = 0; }  // 1re rencontre du mot : on initialise son compteur à 0
    compte[m]++;                                    // puis on incrémente (à chaque occurrence)
}
// résultat : { chat: 3, chien: 1 }</pre>
<p>C'est le motif compteur (leçon 6) démultiplié : un compteur PAR clé. L'initialisation à 0 la première fois est indispensable, sinon <code>compte[m]++</code> planterait sur une clé encore absente.</p>

<h3>5. LINQ : interroger ses collections comme du SQL</h3>
<p>Avec <code>using System.Linq;</code>, on interroge une collection avec une syntaxe déclarative. Le <code>x =&gt; ...</code> est une <strong>lambda</strong> : une mini-fonction anonyme qui décrit une condition ou une transformation.</p>
<pre class="pseudo">int[] t = { 12, 8, 15, 6, 20 };
t.Max()                          → 20              // le maximum (leçon 7), en une méthode
t.Min()  ·  t.Sum()  ·  t.Average()               // minimum, somme, moyenne : les motifs classiques
t.Count(x =&gt; x &gt;= 10)            → 3               // compte ceux qui vérifient la condition (compteur conditionnel)
t.Where(x =&gt; x &gt;= 10)            → {12, 15, 20}    // FILTRE : garde les éléments qui passent le test
t.Where(x =&gt; x % 2 == 0).Sum()   → 26              // CHAÎNAGE : filtrer (les pairs) puis agréger (somme)
t.OrderBy(x =&gt; x)                → tri croissant   // trie les éléments
t.OrderByDescending(x =&gt; x).First()  → 20          // trie décroissant puis prend le premier = le max</pre>
<div class="tip">LINQ (Language Integrated Query) rend tes algorithmes <strong>déclaratifs</strong> : tu décris CE QUE tu veux, pas COMMENT l'obtenir. <code>Where</code> = filtrer, <code>Select</code> = transformer, <code>OrderBy</code> = trier, <code>Count/Sum/Max</code> = agréger. Mais savoir écrire la boucle sous-jacente reste essentiel : pour les examens, le débogage, comprendre le coût, et les cas que LINQ ne couvre pas.</div>`,
  exercises: [
    { type: "qcm", q: "Un Dictionary associe…", opts: ["Des indices à des objets", "Des CLÉS uniques à des VALEURS (la HashMap de C#)", "Des fichiers", "Rien"], a: 1, exp: "Le dictionnaire : clé → valeur." },
    { type: "qcm", q: "Déclarer un dictionnaire nom → âge :", opts: ["Dictionary<string, int> ages = new();", "Dictionary<string> ages;", "Map ages;", "int[string] ages;"], a: 0, exp: "Deux types : clé puis valeur." },
    { type: "qcm", q: "Ajouter/modifier une entrée en C# :", opts: ["ages.put(\"Ana\", 20)", "ages[\"Ana\"] = 20; (crochets, comme PHP)", "ages.Add seulement", "ages + Ana"], a: 1, exp: "Les crochets créent ou remplacent." },
    { type: "qcm", q: "L'avantage du Dictionary sur la List pour « la note d'Ana » :", opts: ["Il trie", "Accès DIRECT par clé (O(1)) au lieu d'un parcours (O(n)) — le jour 28", "Plus joli", "Aucun"], a: 1, exp: "Pas de recherche : la clé mène à la valeur." },
    { type: "qcm", q: "notes[\"Fantôme\"] sur une clé absente…", opts: ["Retourne 0", "Lance KeyNotFoundException : danger ! Utiliser TryGetValue ou ContainsKey", "Retourne null", "-1"], a: 1, exp: "Différence avec PHP (qui donnait un warning) : C# lance une exception." },
    { type: "qcm", q: "L'accès SÛR à une valeur :", opts: ["notes[\"x\"] direct", "notes.TryGetValue(\"x\", out int n) : retourne un bool sans planter", "notes.get(\"x\")", "notes ?? 0"], a: 1, exp: "Le TryParse des dictionnaires : sûr par construction." },
    { type: "qcm", q: "ContainsKey(\"Ana\") teste…", opts: ["La valeur", "Si la CLÉ existe : true/false", "Le type", "La taille"], a: 1, exp: "Le test d'existence d'une clé." },
    { type: "qcm", q: "Dans le compteur d'occurrences, à quoi sert le if (!ContainsKey) { compte[m] = 0; } ?", opts: ["À trier", "À initialiser la clé à 0 la PREMIÈRE fois, avant le ++ : sinon KeyNotFoundException", "À supprimer", "À compter les clés"], a: 1, exp: "Le motif compteur (jour 12), un par clé — avec l'init prudente." },
    { type: "input", q: "Votes = {\"A\",\"B\",\"A\",\"A\",\"C\"} passés au compteur. compte[\"A\"] = ?", a: "3", ph: "nombre", exp: "Trois A : le dépouillement automatique." },
    { type: "qcm", q: "t.Max() (LINQ) correspond à…", opts: ["Un tri", "Le MAX du jour 17, en une méthode", "La dichotomie", "Un filtre"], a: 1, exp: "LINQ encapsule tes motifs." },
    { type: "qcm", q: "t.Count(x => x >= 10) fait…", opts: ["Compte tous les éléments", "Compte ceux qui PASSENT le test (>= 10) : le compteur conditionnel du jour 12", "La somme", "Le tri"], a: 1, exp: "Le prédicat x => x >= 10 filtre pour le comptage." },
    { type: "qcm", q: "t.Where(x => x % 2 == 0) retourne…", opts: ["La somme des pairs", "Les éléments pairs : le FILTRE (garder sous condition)", "true", "Le premier pair"], a: 1, exp: "Where = le motif « collectionner sous condition »." },
    { type: "qcm", q: "t.Where(x => x >= 10).Sum() est un exemple de…", opts: ["Erreur", "CHAÎNAGE LINQ : filtrer puis agréger — décrire le résultat, pas la boucle", "Deux boucles", "Un dictionnaire"], a: 1, exp: "La puissance déclarative de LINQ." },
    { type: "qcm", q: "Pourquoi savoir écrire la boucle si LINQ existe ?", opts: ["Pour souffrir", "Examens, débogage, comprendre le coût (jour 28), cas non couverts par LINQ", "LINQ est payant", "Tradition"], a: 1, exp: "LINQ est un raccourci ; la boucle est la compréhension." },
    { type: "qcm", q: "Stocker « code postal → ville » :", opts: ["List", "Dictionary<string, string> : une association pure", "int[]", "string"], a: 1, exp: "Clé unique → valeur : la définition du dictionnaire." }
  ],
  final: {
    title: "Exercice final — L'inventaire du magasin (version C#)",
    intro: `<p>Le stock vit dans un dictionnaire, interrogé par LINQ :</p>
<pre class="pseudo">var stock = new Dictionary&lt;string, int&gt; {
    ["pomme"] = 12, ["poire"] = 5, ["kiwi"] = 0
};
stock["pomme"] -= 3;                                    // (1) vente
stock["mangue"] = 10;                                   // (2) nouveau produit
var ruptures = stock.Where(p => p.Value == 0)
                    .Select(p => p.Key).ToList();       // (3) LINQ
int totalArticles = stock.Values.Sum();                // (4)</pre>`,
    questions: [
      { type: "input", q: "(1) Que vaut stock[\"pomme\"] après la vente ?", a: "9", ph: "nombre", exp: "12 − 3 = 9 : les crochets lisent et réécrivent." },
      { type: "qcm", q: "(2) stock[\"mangue\"] = 10; sur une clé absente…", opts: ["Erreur", "AJOUTE la paire : les crochets en ÉCRITURE créent la clé (pas de KeyNotFoundException, contrairement à la LECTURE)", "Écrase pomme", "Rien"], a: 1, exp: "Nuance C# : écrire une clé absente l'ajoute ; la LIRE lance une exception." },
      { type: "qcm", q: "(3) Que contient <code>ruptures</code> ?", opts: ["Tous les produits", "[\"kiwi\"] : Where filtre les Value == 0, Select garde les clés — le compteur/filtre du jour 12 en LINQ", "12", "Une exception"], a: 1, exp: "Filtrer puis projeter : le chaînage déclaratif." },
      { type: "input", q: "(4) Que vaut totalArticles ? (9 + 5 + 0 + 10)", a: "24", ph: "nombre", exp: "stock.Values.Sum() : l'accumulateur du jour 12, en LINQ." },
      { type: "qcm", q: "Un client demande « avocat » (absent). L'accès SÛR :", opts: ["stock[\"avocat\"] direct", "stock.TryGetValue(\"avocat\", out int q) : q = 0 si absent, pas d'exception", "stock.get", "stock ?? 0"], a: 1, exp: "Le cas limite (jour 30) traité proprement, sans KeyNotFoundException." }
    ],
    solution: `<pre class="pseudo">Après (1) : {pomme=9, poire=5, kiwi=0}
Après (2) : {pomme=9, poire=5, kiwi=0, mangue=10}
ruptures  : Where(Value==0).Select(Key) → ["kiwi"]
total     : Values.Sum() → 24

Nuance : crochets en LECTURE → exception si absent (TryGetValue !)
crochets en ÉCRITURE → ajoute la clé.
LINQ (Where/Select/Sum) = tes motifs du jour 12, déclaratifs.</pre>
<p>Dictionary + LINQ : la boîte à données C# est complète. Demain : enum, DateTime et Random. Puis le PROJET.</p>`
  }
};

var ECRITURE = {
  placeholder: "Écris ton code C# ici…",
  items: [
  { id: "cs-linq", title: "Réussites en LINQ", level: 3,
    statement: "À partir de <code>List&lt;double&gt; notes = new List&lt;double&gt; {12, 8, 15, 19, 6, 11};</code> utilise <strong>LINQ</strong> pour afficher : la moyenne, les notes ≥ 10 triées en ordre décroissant, et le nombre d'échecs (&lt; 10).",
    hints: [
      "Il faut using System.Linq; en haut du fichier.",
      "notes.Average() donne la moyenne ; notes.Count(n => n < 10) compte les échecs.",
      "Chaîne les méthodes : notes.Where(n => n >= 10).OrderByDescending(n => n) puis parcours avec foreach."
    ],
    solution: "using System;                                    // accès à Console\nusing System.Collections.Generic;                // accès à List<T>\nusing System.Linq;                               // accès aux méthodes LINQ (Where, Average…)\n\nclass Reussites                                  // déclaration de la classe\n{                                                // début de la classe\n    static void Main()                           // point d'entrée du programme\n    {                                            // début de Main\n        List<double> notes = new List<double> {12, 8, 15, 19, 6, 11}; // liste initialisée\n\n        Console.WriteLine($\"Moyenne : {notes.Average()}\"); // Average() calcule la moyenne tout seul\n\n        var reussites = notes                    // on part de la liste…\n            .Where(n => n >= 10)                 // …on GARDE les n tels que n >= 10 (lambda)\n            .OrderByDescending(n => n);          // …et on trie du plus grand au plus petit\n        Console.Write(\"Réussites : \");           // libellé\n        foreach (double n in reussites)          // parcourt le résultat de la requête\n        {                                        // début du bloc\n            Console.Write(n + \" \");              // affiche : 19 15 12 11\n        }                                        // fin du bloc\n        Console.WriteLine();                     // retour à la ligne\n\n        int echecs = notes.Count(n => n < 10);   // compte les éléments qui vérifient la condition\n        Console.WriteLine($\"Échecs : {echecs}\"); // affiche : 2\n    }                                            // fin de Main\n}                                                // fin de la classe",
    note: "n => n >= 10 est une lambda : « pour chaque n, garde-le si n >= 10 »." },
  { id: "cs-inventaire", title: "L'inventaire (Dictionary + exceptions)", level: 3,
    statement: "Crée un <code>Dictionary&lt;string, int&gt;</code> (produit → stock) avec 3 produits. Demande un nom de produit et affiche son stock. Gère le produit inconnu avec <code>try/catch</code> sur <code>KeyNotFoundException</code>, puis affiche tout l'inventaire.",
    hints: [
      "Création : var stock = new Dictionary<string, int> { {\"pomme\", 12}, {\"poire\", 5}, {\"kiwi\", 0} };",
      "L'accès stock[nom] lève KeyNotFoundException si la clé n'existe pas : entoure-le d'un try/catch.",
      "Parcours : foreach (var paire in stock) → paire.Key et paire.Value."
    ],
    solution: "using System;                                    // accès à Console\nusing System.Collections.Generic;                // accès à Dictionary\n\nclass Inventaire                                 // déclaration de la classe\n{                                                // début de la classe\n    static void Main()                           // point d'entrée du programme\n    {                                            // début de Main\n        var stock = new Dictionary<string, int>  // table : nom du produit → quantité\n        {                                        // initialisation directe\n            {\"pomme\", 12},                       // 1re paire clé/valeur\n            {\"poire\", 5},                        // 2e paire\n            {\"kiwi\", 0}                          // 3e paire\n        };                                       // fin de l'initialisation\n\n        Console.Write(\"Produit ? \");             // invite\n        string nom = Console.ReadLine();         // lit le nom demandé\n        try                                      // zone surveillée : l'accès peut échouer\n        {                                        // début du try\n            Console.WriteLine($\"Stock de {nom} : {stock[nom]}\"); // stock[nom] lève une exception si clé absente\n        }                                        // fin du try\n        catch (KeyNotFoundException)             // attrape UNIQUEMENT la clé introuvable\n        {                                        // début du catch\n            Console.WriteLine($\"Produit inconnu : {nom}\"); // message d'erreur propre\n        }                                        // fin du catch\n\n        Console.WriteLine(\"--- Inventaire complet ---\"); // titre\n        foreach (var paire in stock)             // parcourt chaque paire clé/valeur\n        {                                        // début du bloc\n            Console.WriteLine($\"{paire.Key} : {paire.Value}\"); // Key = nom, Value = quantité\n        }                                        // fin du bloc\n    }                                            // fin de Main\n}                                                // fin de la classe",
    note: "Alternative sans exception : stock.TryGetValue(nom, out int q) ou stock.ContainsKey(nom)." }
  ]
};
