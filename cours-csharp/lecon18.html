  theory: `
<h3>1. Dictionary&lt;K, V&gt; : associer des clés à des valeurs</h3>
<p>Là où un tableau/liste range des valeurs à des indices numériques, un <strong>dictionnaire</strong> range des valeurs sous des <strong>clés</strong> de ton choix (un nom, un code…). C'est la <code>HashMap</code> de Java, la structure « clé → valeur ».</p>
<pre class="pseudo">using System.Collections.Generic;

Dictionary&lt;string, int&gt; notes = new Dictionary&lt;string, int&gt;();  // clés string (les noms) → valeurs int (les notes)
notes["Ana"] = 14;              // ajoute (ou modifie) l'entrée « Ana » via les crochets (comme PHP)
notes["Bob"] = 9;               // une deuxième entrée
notes["Ana"]                    // → 14 : accès DIRECT par la clé, quasi instantané (pas de parcours)
notes.ContainsKey("Zoé")        // → false : « Zoé » n'est pas une clé du dictionnaire
notes.Remove("Bob");            // retire l'entrée « Bob »
notes.Count                     // → le nombre d'entrées</pre>
<div class="warn">Accéder à une clé ABSENTE avec les crochets (<code>notes["Fantôme"]</code>) lance une <code>KeyNotFoundException</code> ! Différence avec PHP (qui donnait juste un avertissement). Teste d'abord avec <code>ContainsKey</code>, ou utilise <code>TryGetValue</code>.</div>

<h3>2. L'accès sûr : TryGetValue</h3>
<pre class="pseudo">if (notes.TryGetValue("Zoé", out int n))   // tente de lire « Zoé » : renvoie true et remplit n si la clé existe
{
    Console.WriteLine($"Zoé : {n}");        // exécuté seulement si la clé était présente
}
else
{
    Console.WriteLine("Zoé absente");       // pas de plantage : on gère proprement l'absence
}</pre>
<p>C'est le pendant de <code>int.TryParse</code> (leçon 4) pour les dictionnaires : sûr par construction, il évite l'exception sur une clé manquante.</p>

<h3>3. Parcourir un dictionnaire</h3>
<pre class="pseudo">foreach (var paire in notes)                 // chaque « paire » a une clé (.Key) et une valeur (.Value)
{
    Console.WriteLine($"{paire.Key} → {paire.Value}");  // ex. « Ana → 14 »
}
foreach (string cle in notes.Keys) { /* ... */ }   // on peut aussi parcourir seulement les clés (ou .Values)</pre>

<h3>4. Le motif « compteur d'occurrences »</h3>
<pre class="pseudo">string[] mots = { "chat", "chien", "chat", "chat" };
var compte = new Dictionary&lt;string, int&gt;();    // mot → nombre d'apparitions
foreach (string m in mots)
{
    if (!compte.ContainsKey(m)) { compte[m] = 0; }  // 1re rencontre du mot : on initialise son compteur à 0
    compte[m]++;                                    // puis on incrémente (à chaque occurrence)
}
// résultat : { chat: 3, chien: 1 }</pre>
<p>C'est le motif compteur (leçon 6) démultiplié : un compteur PAR clé. L'initialisation à 0 la première fois est indispensable, sinon <code>compte[m]++</code> planterait sur une clé encore absente.</p>

<h3>5. LINQ : interroger ses collections comme du SQL</h3>
<p>Avec <code>using System.Linq;</code>, on interroge une collection avec une syntaxe déclarative. Le <code>x =&gt; ...</code> est une <strong>lambda</strong> : une mini-fonction anonyme qui décrit une condition ou une transformation.</p>
<pre class="pseudo">int[] t = { 12, 8, 15, 6, 20 };
t.Max()                          → 20              // le maximum (leçon 7), en une méthode
t.Min()  ·  t.Sum()  ·  t.Average()               // minimum, somme, moyenne : les motifs classiques
t.Count(x =&gt; x &gt;= 10)            → 3               // compte ceux qui vérifient la condition (compteur conditionnel)
t.Where(x =&gt; x &gt;= 10)            → {12, 15, 20}    // FILTRE : garde les éléments qui passent le test
t.Where(x =&gt; x % 2 == 0).Sum()   → 26              // CHAÎNAGE : filtrer (les pairs) puis agréger (somme)
t.OrderBy(x =&gt; x)                → tri croissant   // trie les éléments
t.OrderByDescending(x =&gt; x).First()  → 20          // trie décroissant puis prend le premier = le max</pre>
<div class="tip">LINQ (Language Integrated Query) rend tes algorithmes <strong>déclaratifs</strong> : tu décris CE QUE tu veux, pas COMMENT l'obtenir. <code>Where</code> = filtrer, <code>Select</code> = transformer, <code>OrderBy</code> = trier, <code>Count/Sum/Max</code> = agréger. Mais savoir écrire la boucle sous-jacente reste essentiel : pour les examens, le débogage, comprendre le coût, et les cas que LINQ ne couvre pas.</div>`,

      "solution": "// Le comptoir de la friterie : une clé, une valeur, et des questions posées en une ligne.\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        // Un dictionnaire : la clé est le produit, la valeur son prix en centimes.\n        Dictionary<string, int> carte = new Dictionary<string, int>();\n        carte[\"fricadelle\"] = 250;\n        carte[\"mitraillette\"] = 700;\n        carte[\"cornet\"] = 350;\n        carte[\"sauce\"] = 80;\n        carte[\"brochette\"] = 300;\n\n        Console.WriteLine(\"LA CARTE\");\n        foreach (var paire in carte)\n        {\n            Console.WriteLine($\"{paire.Key} → {paire.Value / 100.0:F2} €\");\n        }\n        Console.WriteLine($\"Produits à la carte : {carte.Count}\");\n\n        Console.WriteLine();\n\n        // Accès direct par la clé : aucun parcours, la réponse est immédiate.\n        Console.WriteLine($\"Un cornet coûte {carte[\"cornet\"]} centimes\");\n        Console.WriteLine($\"La carte connaît-elle le cervelas ? {carte.ContainsKey(\"cervelas\")}\");\n\n        // Lire une clé absente avec les crochets ferait planter : on demande poliment.\n        if (carte.TryGetValue(\"cervelas\", out int prixCervelas))\n        {\n            Console.WriteLine($\"Cervelas : {prixCervelas} centimes\");\n        }\n        else\n        {\n            Console.WriteLine(\"Cervelas : pas à la carte aujourd'hui\");\n        }\n\n        Console.WriteLine();\n\n        // Le motif compteur, un compteur PAR clé.\n        string[] commandes =\n        {\n            \"cornet\", \"fricadelle\", \"cornet\", \"sauce\", \"mitraillette\", \"cornet\",\n            \"sauce\", \"brochette\", \"cornet\", \"fricadelle\", \"sauce\", \"cornet\"\n        };\n\n        Dictionary<string, int> ventes = new Dictionary<string, int>();\n        foreach (string produit in commandes)\n        {\n            if (!ventes.ContainsKey(produit))\n       "solution": "// Les votes du conseil communal : un dépouillement en un parcours, puis des questions en une ligne.\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Linq;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        const string SCRUTIN = \"scrutin.csv\";\n\n        string[] brut =\n        {\n            \"Ndiaye;LC;pour\",\n            \"Peeters;LC;pour\",\n            \"Lorent;LC;abstention\",\n            \"Kaïro;LC;pour\",\n            \"Dhondt;AC;contre\",\n            \"Ben Ali;AC;contre\",\n            \"Maes;AC;pour\",\n            \"Vermeulen;AC;contre\",\n            \"Dubois;UL;pour\",\n            \"Janssens;UL;abstention\",\n            \"Cardoso;UL;contre\",\n            \"Wauters;UL;pour\",\n            \"Simons;LC;pour\",\n            \"Goossens;AC;abstention\",\n            \"Leroy;UL;contre\"\n        };\n        File.WriteAllLines(SCRUTIN, brut);\n\n        if (!File.Exists(SCRUTIN))\n        {\n            Console.WriteLine(\"Aucun scrutin à dépouiller\");\n            return;\n        }\n\n        List<Bulletin> urne = new List<Bulletin>();\n        foreach (string ligne in File.ReadAllLines(SCRUTIN))\n        {\n            if (ligne == \"\")\n            {\n                continue;\n            }\n            string[] champs = ligne.Split(';');\n            urne.Add(new Bulletin(champs[0], champs[1], champs[2]));\n        }\n        Console.WriteLine($\"Bulletins dépouillés : {urne.Count}\");\n\n        Console.WriteLine();\n\n        // Un seul parcours suffit : le dictionnaire tient un compteur par sens de vote.\n        Dictionary<string, int> decompte = new Dictionary<string, int>();\n        foreach (Bulletin b in urne)\n        {\n            if (!decompte.ContainsKey(b.Vote))\n            {\n                decompte[b.Vote] = 0;\n            }\n            decompte[b.Vote]++;\n        }\n\n        Console.WriteLine(\"DÉCOMPTE\");\n        foreach (var paire in decompte)\n        {\n            Console.WriteLine($\"{paire.Key} : {paire.Value}\");\n        }\n\n        int pour = decompte[\"pour\"];\n        int contre = decompte[\"contre\"];\n        int abstention = decompte[\"abstention\"];\n        Console.WriteLine($\"Exprimés : {pour + contre} · abstentions : {abstention}\");\n        if (pour > contre)\n        {\n            Console.WriteLine($\"Motion ADOPTÉE par {pour} voix contre {contre}\");\n        }\n        else\n        {\n            Console.WriteLine($\"Motion REJETÉE par {contre} voix contre {pour}\");\n        }\n\n        Console.WriteLine();\n\n        // Une clé absente lue avec les crochets lance : on le montre plutôt que de l'affirmer.\n        try\n        {\n            Console.WriteLine($\"Votes « blanc » : {decompte[\"blanc\"]}\");\n        }\n        catch (KeyNotFoundException)\n        {\n            Console.WriteLine(\"Pas de bulletin blanc : la clé n'existe pas dans le décompte\");\n        }\n\n        if (decompte.TryGetValue(\"blanc\", out int blancs))\n        {\n            Console.WriteLine($\"Blancs : {blancs}\");\n        }\n        else\n        {\n            Console.WriteLine(\"Blancs : aucun — demandé sans risque de plantage\");\n        }\n\n        Console.WriteLine();\n\n        // Effectif par groupe : le même motif compteur, sur une autre clé.\n        Dictionary<string, int> effectifs = new Dictionary<string, int>();\n        foreach (Bulletin b in urne)\n        {\n            if (!effectifs.ContainsKey(b.Groupe))\n            {\n                effectifs[b.Groupe] = 0;\n            }\n            effectifs[b.Groupe]++;\n        }\n\n        Console.WriteLine(\"EFFECTIF PAR GROUPE\");\n        foreach (var paire in effectifs.OrderBy(p => p.Key))   // trié : l'ordre devient garanti\n        {\n            Console.WriteLine($\"{paire.Key} : {paire.Value} conseillers\");\n        }\n        Console.WriteLine($\"Groupes représentés : {effectifs.Count}\");\n\n        Console.WriteLine();\n\n        // Le croisement groupe × vote, décrit plutôt que parcouru.\n        Console.WriteLine(\"VENTILATION PAR GROUPE\");\n        foreach (string groupe in effectifs.Keys.OrderBy(g => g))\n        {\n            int p = urne.Count(b => b.Groupe == groupe && b.Vote == \"pour\");\n            int c = urne.Count(b => b.Groupe == groupe && b.Vote == \"contre\");\n            int a = urne.Count(b => b.Groupe == groupe && b.Vote == \"abstention\");\n            Console.WriteLine($\"{groupe} : {p} pour, {c} contre, {a} abstention(s)\");\n        }\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"QUELQUES QUESTIONS POSÉES EN UNE LIGNE\");\n        Console.WriteLine($\"Conseillers ayant voté pour : {urne.Count(b => b.Vote == \"pour\")}\");\n        Console.WriteLine($\"Taux de participation effective : \"\n                        + $\"{urne.Count(b => b.Vote != \"abstention\") * 100 / urne.Count} %\");\n\n        List<string> abstentionnistes = new List<string>();\n        foreach (Bulletin b in urne.Where(x => x.Vote == \"abstention\").OrderBy(x => x.Nom))\n        {\n            abstentionnistes.Add(b.Nom);\n        }\n        Console.WriteLine($\"Abstentionnistes : {string.Join(\", \", abstentionnistes)}\");\n\n        Console.WriteLine();\n\n        // La version en boucles du même croisement, pour comparer le nombre de parcours.\n        Console.WriteLine(\"LE MÊME CROISEMENT, À LA MAIN\");\n        int parcours = 0;\n        foreach (string groupe in effectifs.Keys.OrderBy(g => g))\n        {\n            int p = 0;\n            int c = 0;\n            int a = 0;\n            foreach (Bulletin b in urne)\n            {\n                parcours++;\n                if (b.Groupe != groupe)\n                {\n                    continue;\n                }\n                if (b.Vote == \"pour\") { p++; }\n                else if (b.Vote == \"contre\") { c++; }\n                else { a++; }\n            }\n            Console.WriteLine($\"{groupe} : {p} pour, {c} contre, {a} abstention(s)\");\n        }\n        Console.WriteLine($\"Bulletins examinés pour ce seul tableau : {parcours}\");\n    }\n}\n\nclass Bulletin\n{\n    public string Nom { get; private set; }\n    public string Groupe { get; private set; }\n    public string Vote { get; private set; }\n\n    public Bulletin(string nom, string groupe, string vote)\n    {\n        if (vote != \"pour\" && vote != \"contre\" && vote != \"abstention\")\n        {\n            throw new ArgumentException($\"{nom} : sens de vote « {vote} » inconnu\");\n        }\n        this.Nom = nom;\n        this.Groupe = groupe;\n        this.Vote = vote;\n    }\n\n    public override string ToString()\n    {\n        return $\"{Nom} ({Groupe}) : {Vote}\";\n    }\n}",

      "hier": "lecon17.html",
      "enonce": "Deuxième jour : la question d'hier trouve sa structure. Pars de ton fichier d'hier et garde tout le cycle — test d'existence, écriture du registre au premier lancement, relecture, reconstruction des objets, ajout en mémoire de R-09;bouilloire;Nadia;45, écriture du fichier de clôture. Remplace ensuite la liste de noms distincts et les deux boucles imbriquées par <strong>quatre structures associatives remplies en un seul parcours</strong> : minutes par bénévole, fiches par bénévole, fiches par objet, minutes par objet. Affiche le temps de chaque bénévole <strong>du plus chargé au moins chargé</strong>, avec son nombre de fiches, puis le nombre de bénévoles. Affiche les objets <strong>par ordre alphabétique</strong> avec leur nombre d'apparitions et leur temps cumulé, le nombre d'objets différents, et le nombre d'objets apportés plus d'une fois — cette dernière valeur <strong>en une seule expression</strong>. Interroge ensuite la structure sur Ilse, puis sur Karim qui n'était pas là, <strong>sans faire planter le programme</strong>. Range enfin les durées dans une collection et donne, chacun en une expression : le total, la moyenne à deux décimales, la plus longue, la plus courte, le nombre de réparations d'une heure ou plus, le temps passé sur celles-là, et la plus longue obtenue par un tri. Termine par une vérification : la somme des minutes par bénévole, la somme des minutes par objet et le total des durées doivent coïncider — affiche le résultat de cette comparaison.",

      "solution": "// Le repair café, jour 2 : la question posée hier en deux boucles se pose en un parcours.\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Linq;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        const string REGISTRE = \"repaircafe.csv\";\n        const string CLOTURE = \"repaircafe-cloture.csv\";\n\n        if (!File.Exists(REGISTRE))\n        {\n            Console.WriteLine(\"Registre introuvable : premier lancement, on l'écrit\");\n            List<string> seance = new List<string>();\n            seance.Add(\"R-01;grille-pain;Ilse;35\");\n            seance.Add(\"R-02;vélo;Bruno;70\");\n            seance.Add(\"R-03;lampe;Ilse;20\");\n            seance.Add(\"R-04;machine à café;Nadia;95\");\n            seance.Add(\"R-05;vélo;Nadia;55\");\n            seance.Add(\"R-06;radio;Bruno;40\");\n            seance.Add(\"R-07;grille-pain;Ilse;25\");\n            seance.Add(\"R-08;aspirateur;Bruno;80\");\n            File.WriteAllLines(REGISTRE, seance);\n        }\n        else\n        {\n            Console.WriteLine(\"Registre trouvé : on repart de la séance précédente\");\n        }\n\n        List<Reparation> atelier = new List<Reparation>();\n        foreach (string ligne in File.ReadAllLines(REGISTRE))\n        {\n            if (ligne == \"\")\n            {\n                continue;\n            }\n            atelier.Add(Reparation.DepuisLigne(ligne));\n        }\n        atelier.Add(new Reparation(\"R-09\", \"bouilloire\", \"Nadia\", 45));\n        Console.WriteLine($\"{atelier.Count} fiches en mémoire\");\n\n        Console.WriteLine();\n\n        // Hier : une liste de noms distincts, puis un parcours complet PAR bénévole.\n        // Aujourd'hui : un seul parcours, et le dictionnaire fait le reste.\n        Dictionary<string, int> minutesParBenevole = new Dictionary<string, int>();\n        Dictionary<string, int> fichesParBenevole = new Dictionary<string, int>();\n        Dictionary<string, int> fichesParObjet = new Dictionary<string, int>();\n        Dictionary<string, int> minutesParObjet = new Dictionary<string, int>();\n\n        foreach (Reparation r in atelier)\n        {\n            if (!minutesParBenevole.ContainsKey(r.Benevole))\n            {\n                minutesParBenevole[r.Benevole] = 0;\n                fichesParBenevole[r.Benevole] = 0;\n            }\n            minutesParBenevole[r.Benevole] += r.DureeMinutes;\n            fichesParBenevole[r.Benevole]++;\n\n            if (!fichesParObjet.ContainsKey(r.Objet))\n            {\n                fichesParObjet[r.Objet] = 0;\n                minutesParObjet[r.Objet] = 0;\n            }\n            fichesParObjet[r.Objet]++;\n            minutesParObjet[r.Objet] += r.DureeMinutes;\n        }\n\n        // Un dictionnaire ne promet aucun ordre : si on en veut un, on le demande.\n        Console.WriteLine(\"TEMPS PAR BÉNÉVOLE, DU PLUS CHARGÉ AU MOINS CHARGÉ\");\n        foreach (var paire in minutesParBenevole.OrderByDescending(p => p.Value))\n        {\n            Console.WriteLine($\"{paire.Key} : {fichesParBenevole[paire.Key]} fiches, \"\n                            + $\"{paire.Value} minutes\");\n        }\n        Console.WriteLine($\"Bénévoles présents : {minutesParBenevole.Count}\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"OBJETS APPORTÉS, PAR ORDRE ALPHABÉTIQUE\");\n        foreach (var paire in fichesParObjet.OrderBy(p => p.Key))\n        {\n            Console.WriteLine($\"{paire.Key} : {paire.Value} fois, \"\n                            + $\"{minutesParObjet[paire.Key]} minutes\");\n        }\n        Console.WriteLine($\"Objets différents : {fichesParObjet.Count}\");\n        Console.WriteLine($\"Objets apportés plus d'une fois : \"\n                        + $\"{fichesParObjet.Count(p => p.Value > 1)}\");\n\n        Console.WriteLine();\n\n        // Une question précise, sans parcours écrit à la main.\n        if (minutesParBenevole.TryGetValue(\"Ilse\", out int minutesIlse))\n        {\n            Console.WriteLine($\"Ilse a passé {minutesIlse} minutes à l'atelier\");\n        }\n        if (!minutesParBenevole.TryGetValue(\"Karim\", out int minutesKarim))\n        {\n            Console.WriteLine(\"Karim n'était pas là ce soir\");\n        }\n\n        Console.WriteLine();\n\n        // Les statistiques de la séance : une ligne par question.\n        List<int> durees = new List<int>();\n        foreach (Reparation r in atelier)\n        {\n            durees.Add(r.DureeMinutes);\n        }\n\n        Console.WriteLine(\"LA SÉANCE EN CHIFFRES\");\n        Console.WriteLine($\"Temps d'atelier : {durees.Sum()} minutes\");\n        Console.WriteLine($\"Durée moyenne : {durees.Average():F2} minutes\");\n        Console.WriteLine($\"La plus longue : {durees.Max()} minutes\");\n        Console.WriteLine($\"La plus courte : {durees.Min()} minutes\");\n        Console.WriteLine($\"Réparations d'une heure ou plus : {durees.Count(x => x >= 60)}\");\n        Console.WriteLine($\"Temps passé sur ces réparations : {durees.Where(x => x >= 60).Sum()} \"\n                        + \"minutes\");\n        Console.WriteLine($\"Durée du chantier le plus lourd : \"\n                        + $\"{durees.OrderByDescending(x => x).First()} minutes\");\n\n        Console.WriteLine();\n\n        // Vérification par le calcul : les deux ventilations doivent retomber sur le même total.\n        int sommeBenevoles = minutesParBenevole.Values.Sum();\n        int sommeObjets = minutesParObjet.Values.Sum();\n        Console.WriteLine($\"Somme par bénévole : {sommeBenevoles} minutes\");\n        Console.WriteLine($\"Somme par objet : {sommeObjets} minutes\");\n        Console.WriteLine($\"Les deux ventilations concordent : \"\n                        + $\"{sommeBenevoles == sommeObjets && sommeBenevoles == durees.Sum()}\");\n\n        Console.WriteLine();\n\n        List<string> aEcrire = new List<string>();\n        foreach (Reparation r in atelier)\n        {\n            aEcrire.Add(r.EnLigne());\n        }\n        File.WriteAllLines(CLOTURE, aEcrire);\n        Console.WriteLine($\"{File.ReadAllLines(CLOTURE).Length} lignes dans {CLOTURE}\");\n    }\n}\n\nclass Reparation\n{\n    public string Code { get; private set; }\n    public string Objet { get; private set; }\n    public string Benevole { get; private set; }\n    public int DureeMinutes { get; private set; }\n\n    public Reparation(string code, string objet, string benevole, int dureeMinutes)\n    {\n        if (dureeMinutes <= 0)\n        {\n            throw new ArgumentException($\"{code} : durée de {dureeMinutes} minutes impossible\");\n        }\n        this.Code = code;\n        this.Objet = objet;\n        this.Benevole = benevole;\n        this.DureeMinutes = dureeMinutes;\n    }\n\n    public static Reparation DepuisLigne(string ligne)\n    {\n        string[] champs = ligne.Split(';');\n        if (champs.Length != 4)\n        {\n            throw new ArgumentException($\"« {ligne} » : quatre champs attendus\");\n        }\n        return new Reparation(champs[0], champs[1], champs[2], int.Parse(champs[3]));\n    }\n\n    public string EnLigne()\n    {\n        return $\"{Code};{Objet};{Benevole};{DureeMinutes}\";\n    }\n\n    public override string ToString()\n    {\n        return $\"{Code} — {Objet} — {Benevole} — {DureeMinutes} min\";\n    }\n}",
      "pourquoi": "Hier, connaître le temps de trois bénévoles coûtait trois traversées de l'atelier, plus une pour établir la liste des noms. Aujourd'hui, connaître le temps <em>et</em> le nombre de fiches de chaque bénévole <em>et</em> les deux mêmes chiffres par objet coûte une seule traversée. Ce n'est pas un gain de lignes : c'est un changement d'ordre de grandeur.",
      "checklist": [

        "Comptes-tu 7 objets différents, dont 2 apportés plus d'une fois — le grille-pain et le vélo ?",
        "Le vélo totalise-t-il 125 minutes et le grille-pain 60 ?",
        "La moyenne affiche-t-elle 51,67 minutes, et le temps des réparations d'une heure ou plus 245 minutes ?",

      ],

uantité\n        }                                        // fin du bloc\n    }                                            // fin de Main\n}                                                // fin de la classe",
