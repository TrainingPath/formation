  title: "Enum, DateTime et Random",
  subtitle: "Les valeurs nommées, le temps et le hasard : les utilitaires du quotidien.",
  theory: `
<h3>1. enum : des valeurs nommées</h3>
<p>Plutôt que des « nombres magiques » (1 = lundi…) dont le sens se perd, une <strong>enum</strong> (énumération) donne un nom à chaque valeur d'un ensemble fixe :</p>
<pre class="pseudo">enum Jour { Lundi, Mardi, Mercredi, Jeudi, Vendredi, Samedi, Dimanche }  // 7 valeurs nommées
enum Statut { Actif, Suspendu, Banni }                                    // 3 valeurs nommées

Jour aujourdhui = Jour.Vendredi;                                          // une variable de type Jour
if (aujourdhui == Jour.Samedi || aujourdhui == Jour.Dimanche) { /* week-end */ }  // lisible et sans erreur
Console.WriteLine(aujourdhui);          // affiche « Vendredi » : le NOM, pas un chiffre
int index = (int) aujourdhui;           // on peut caster en int → 4 (Lundi=0, Mardi=1, … Vendredi=4)</pre>
<div class="tip">Une enum rend le code LISIBLE et SÛR : <code>Statut.Banni</code> au lieu de <code>2</code>. Le compilateur vérifie que tu n'emploies que des valeurs valides. Elle se marie parfaitement avec le switch expression (leçon 5), qui peut même vérifier que tu couvres tous les cas.</div>

<h3>2. Le hasard : Random</h3>
<pre class="pseudo">Random alea = new Random();        // on crée un générateur de nombres aléatoires
int de = alea.Next(1, 7);          // un entier de 1 à 6 : borne basse INCLUSE (1), haute EXCLUE (7)
int carte = alea.Next(52);         // un seul argument = de 0 à 51 (borne haute exclue)
double p = alea.NextDouble();      // un réel dans l'intervalle 0.0 &lt;= p &lt; 1.0</pre>
<div class="warn"><code>alea.Next(1, 7)</code> : la borne basse est INCLUSE, la haute EXCLUE. Pour simuler un dé (1 à 6), il faut donc <code>Next(1, 7)</code>. C'est le même « ±1 » que pour les indices de tableau : attention à la borne.</div>

<h3>3. Tirer un élément au hasard dans une liste</h3>
<pre class="pseudo">List&lt;string&gt; prenoms = /* ... */;
string gagnant = prenoms[alea.Next(prenoms.Count)];   // Next(Count) donne un indice valide (0 à Count-1)</pre>
<p>Astuce clé : <code>Next(prenoms.Count)</code> ne peut jamais dépasser le dernier indice, puisque la borne haute (Count) est exclue.</p>

<h3>4. Les dates : DateTime</h3>
<pre class="pseudo">DateTime maintenant = DateTime.Now;             // l'instant présent : date ET heure
DateTime aujourd = DateTime.Today;              // aujourd'hui à 0h : date seule
DateTime examen = new DateTime(2026, 9, 15);    // une date précise : année, mois, jour (dans cet ordre)
examen.Year → 2026 · examen.Month → 9 · examen.Day → 15   // on lit chaque composant
examen.DayOfWeek → Tuesday                      // le jour de la semaine correspondant
examen.AddDays(7)          // renvoie une NOUVELLE date décalée de 7 jours (DateTime est immuable → réaffecter !)
examen &gt; aujourd          // on compare deux dates directement avec les opérateurs > < ==</pre>

<h3>5. Durées : TimeSpan</h3>
<pre class="pseudo">TimeSpan duree = examen - aujourd;        // soustraire deux dates donne une DURÉE (TimeSpan)
int jours = duree.Days;                   // on lit le nombre de jours de cette durée (ex. 74)
DateTime dans2h = maintenant.AddHours(2); // décaler d'une durée : ajoute 2 heures</pre>

<h3>6. Formater l'affichage</h3>
<pre class="pseudo">examen.ToString("dd/MM/yyyy")    → "15/09/2026"   // date au format jour/mois/année
$"{prix:C}"                      → format monétaire local (ex. « 19,99 € »)
$"{prix:F2}"                     → 2 décimales fixes
$"{42:D5}"                       → "00042"          // entier complété à 5 chiffres</pre>
<div class="tip"><code>DateTime</code> est immuable comme <code>string</code> : <code>d.AddDays(7)</code> renvoie une nouvelle date, il faut donc réaffecter (<code>d = d.AddDays(7)</code>). Avantage sur Java : C# permet de comparer les dates directement avec <code>&lt;</code>, <code>&gt;</code>, <code>==</code>, plus naturel que <code>isBefore</code>/<code>isAfter</code>.</div>`,

    { type: "qcm", q: "La date du jour (sans l'heure) :", opts: ["DateTime.Now", "DateTime.Today", "new DateTime()", "Date.get()"], a: 1, exp: "Today = date seule ; Now = date + heure." },
    { type: "qcm", q: "Construire le 25 décembre 2026 :", opts: ["new DateTime(2026, 12, 25)", "new DateTime(25, 12, 2026)", "DateTime(\"25/12/2026\")", "DateTime.Parse(25)"], a: 0, exp: "Année, mois, jour." },
    { type: "qcm", q: "DateTime d = new DateTime(2026,7,3); d.AddDays(30); afficher d →", opts: ["2026-08-02", "2026-07-03 : DateTime est IMMUABLE, sans réaffectation rien ne change", "Erreur", "2026-07-33"], a: 1, exp: "Comme string : d = d.AddDays(30)." },
    { type: "qcm", q: "Comparer deux dates en C# :", opts: ["d1.isAfter(d2) (Java)", "d1 > d2 directement : C# permet les opérateurs de comparaison sur DateTime", "d1.compare(d2)", "impossible"], a: 1, exp: "Plus naturel que Java (isAfter/isBefore)." },
    { type: "qcm", q: "Le nombre de jours entre deux dates :", opts: ["d2 - d1 tout court", "(d2 - d1).Days : la soustraction donne un TimeSpan, dont on lit .Days", "d1.getDays(d2)", "DAYS.between"], a: 1, exp: "TimeSpan = durée entre deux DateTime." },
    { type: "input", q: "Que vaut <code>$\"{7:D3}\"</code> ?", a: ["007"], ph: "texte", exp: "Complété à 3 chiffres : numéros de facture." },
    { type: "qcm", q: "Pierre/feuille/ciseaux (0/1/2) : quelle structure idéale pour nommer les coups ?", opts: ["Des int magiques", "Une enum Coup { Pierre, Feuille, Ciseaux } : lisible et sûre — puis un switch expression", "Une string", "Un fichier"], a: 1, exp: "enum + switch expression (leçon 5) : le duo élégant." },
    { type: "qcm", q: "Une enum se marie particulièrement bien avec…", opts: ["Les fichiers", "Le switch expression (leçon 5) : chaque valeur = une branche, exhaustivité vérifiée", "Les exceptions", "Random"], a: 1, exp: "statut switch { Actif => ..., Banni => ..., _ => ... }." }
  ],

<pre class="pseudo">enum Lot { Aucun, Bronze, Argent, Or }
Random alea = new Random();

    questions: [
      { type: "qcm", q: "(1) Quels indices peut produire alea.Next(participants.Count) ?", opts: ["1 à 4", "0 à 3 : Count = 4 → Next(4) → 0..3, les indices valides", "0 à 4", "1 à 3"], a: 1, exp: "Le tirage ne déborde jamais." },
      { type: "qcm", q: "(2) alea.Next(1, 4) puis cast (Lot) donne quelles valeurs possibles ?", opts: ["Aucun, Bronze, Argent", "Bronze, Argent, Or : Next(1,4) → 1,2,3 → les valeurs 1..3 de l'enum (Aucun=0 exclu)", "Or seulement", "0 à 4"], a: 1, exp: "L'enum + le hasard : on tire un lot nommé, jamais « Aucun »." },
      { type: "qcm", q: "(3) Que vaut remise ?", opts: ["2026-06-30", "2026-07-15 : 30 juin + 15 jours, changement de mois géré automatiquement", "2026-06-45", "Erreur"], a: 1, exp: "AddDays traverse les mois sans effort." },
      { type: "input", q: "(4) Que vaut attente ?", a: "15", ph: "nombre", exp: "(remise - tirage).Days entre le 30/06 et le 15/07 : 15." },
      { type: "qcm", q: "Console.WriteLine affiche <code>{lot}</code>. Grâce à l'enum, ça donne…", opts: ["Un chiffre (1, 2 ou 3)", "Le NOM du lot (Bronze/Argent/Or) : l'enum s'affiche lisiblement", "Erreur", "Lot"], a: 1, exp: "L'atout enum : le hasard tire un chiffre, l'affichage montre un nom." }
    ],
    solution: `<pre class="pseudo">gagnant : participants[0..3] → équitable
lot     : (Lot)(1..3) → Bronze/Argent/Or (jamais Aucun)

    statement: "L'ordinateur tire un nombre entre 1 et 100 (<code>Random</code>). L'utilisateur devine ; affiche <code>\"Plus grand !\"</code> ou <code>\"Plus petit !\"</code> à chaque essai, puis le nombre d'essais quand c'est trouvé.",
    hints: [
      "Random rand = new Random(); puis rand.Next(1, 101) — la borne haute 101 est EXCLUE.",
      "do-while : on propose au moins une fois, et on recommence tant que proposition != mystere.",
      "Compte les essais avec un compteur incrémenté dans la boucle."
    ],
    solution: "using System;                                    // accès à Console et Random\n\nclass NombreMystere                              // déclaration de la classe\n{                                                // début de la classe\n    static void Main()                           // point d'entrée du programme\n    {                                            // début de Main\n        Random rand = new Random();              // crée le générateur aléatoire\n        int mystere = rand.Next(1, 101);         // Next(1, 101) → 1..100 (borne haute EXCLUE)\n        int essais = 0;                          // compteur de tentatives\n        int proposition;                         // déclarée avant la boucle (visible dans le while)\n        do                                       // on propose au moins une fois\n        {                                        // début du bloc répété\n            Console.Write(\"Propose (1-100) ? \"); // invite\n            proposition = int.Parse(Console.ReadLine()); // lit la tentative\n            essais++;                            // compte cette tentative\n            if (proposition < mystere)           // trop bas ?\n                Console.WriteLine(\"Plus grand !\"); // indice\n            else if (proposition > mystere)      // trop haut ?\n                Console.WriteLine(\"Plus petit !\"); // indice inverse\n        } while (proposition != mystere);        // on recommence tant que ce n'est pas trouvé\n        Console.WriteLine($\"Bravo ! Trouvé en {essais} essai(s)\"); // bilan\n    }                                            // fin de Main\n}                                                // fin de la classe",
    note: "Next(1, 101) et pas Next(1, 100) : la borne haute est exclue — piège classique." }

};
