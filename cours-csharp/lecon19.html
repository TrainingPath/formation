  theory: `
<h3>1. enum : des valeurs nommées</h3>
<p>Plutôt que des « nombres magiques » (1 = lundi…) dont le sens se perd, une <strong>enum</strong> (énumération) donne un nom à chaque valeur d'un ensemble fixe :</p>
<pre class="pseudo">enum Jour { Lundi, Mardi, Mercredi, Jeudi, Vendredi, Samedi, Dimanche }  // 7 valeurs nommées
enum Statut { Actif, Suspendu, Banni }                                    // 3 valeurs nommées

Jour aujourdhui = Jour.Vendredi;                                          // une variable de type Jour
if (aujourdhui == Jour.Samedi || aujourdhui == Jour.Dimanche) { /* week-end */ }  // lisible et sans erreur
Console.WriteLine(aujourdhui);          // affiche « Vendredi » : le NOM, pas un chiffre
int index = (int) aujourdhui;           // on peut caster en int → 4 (Lundi=0, Mardi=1, … Vendredi=4)</pre>
<div class="tip">Une enum rend le code LISIBLE et SÛR : <code>Statut.Banni</code> au lieu de <code>2</code>. Le compilateur vérifie que tu n'emploies que des valeurs valides. Elle se marie parfaitement avec le switch expression (leçon 5), qui peut même vérifier que tu couvres tous les cas.</div>

<h3>2. Le hasard : Random</h3>
<pre class="pseudo">Random alea = new Random();        // on crée un générateur de nombres aléatoires
int de = alea.Next(1, 7);          // un entier de 1 à 6 : borne basse INCLUSE (1), haute EXCLUE (7)
int carte = alea.Next(52);         // un seul argument = de 0 à 51 (borne haute exclue)
double p = alea.NextDouble();      // un réel dans l'intervalle 0.0 &lt;= p &lt; 1.0</pre>
<div class="warn"><code>alea.Next(1, 7)</code> : la borne basse est INCLUSE, la haute EXCLUE. Pour simuler un dé (1 à 6), il faut donc <code>Next(1, 7)</code>. C'est le même « ±1 » que pour les indices de tableau : attention à la borne.</div>

<h3>3. Tirer un élément au hasard dans une liste</h3>
<pre class="pseudo">List&lt;string&gt; prenoms = /* ... */;
string gagnant = prenoms[alea.Next(prenoms.Count)];   // Next(Count) donne un indice valide (0 à Count-1)</pre>
<p>Astuce clé : <code>Next(prenoms.Count)</code> ne peut jamais dépasser le dernier indice, puisque la borne haute (Count) est exclue.</p>

<h3>4. Les dates : DateTime</h3>
<pre class="pseudo">DateTime maintenant = DateTime.Now;             // l'instant présent : date ET heure
DateTime aujourd = DateTime.Today;              // aujourd'hui à 0h : date seule
DateTime examen = new DateTime(2026, 9, 15);    // une date précise : année, mois, jour (dans cet ordre)
examen.Year → 2026 · examen.Month → 9 · examen.Day → 15   // on lit chaque composant
examen.DayOfWeek → Tuesday                      // le jour de la semaine correspondant
examen.AddDays(7)          // renvoie une NOUVELLE date décalée de 7 jours (DateTime est immuable → réaffecter !)
examen &gt; aujourd          // on compare deux dates directement avec les opérateurs > < ==</pre>

<h3>5. Durées : TimeSpan</h3>
<pre class="pseudo">TimeSpan duree = examen - aujourd;        // soustraire deux dates donne une DURÉE (TimeSpan)
int jours = duree.Days;                   // on lit le nombre de jours de cette durée (ex. 74)
DateTime dans2h = maintenant.AddHours(2); // décaler d'une durée : ajoute 2 heures</pre>

<h3>6. Formater l'affichage</h3>
<pre class="pseudo">examen.ToString("dd/MM/yyyy")    → "15/09/2026"   // date au format jour/mois/année
$"{prix:C}"                      → format monétaire local (ex. « 19,99 € »)
$"{prix:F2}"                     → 2 décimales fixes
$"{42:D5}"                       → "00042"          // entier complété à 5 chiffres</pre>
<div class="tip"><code>DateTime</code> est immuable comme <code>string</code> : <code>d.AddDays(7)</code> renvoie une nouvelle date, il faut donc réaffecter (<code>d = d.AddDays(7)</code>). Avantage sur Java : C# permet de comparer les dates directement avec <code>&lt;</code>, <code>&gt;</code>, <code>==</code>, plus naturel que <code>isBefore</code>/<code>isAfter</code>.</div>`,

      "solution": "// Le calendrier du potager : des noms au lieu de nombres, des dates au lieu de compteurs.\nusing System;\nusing System.Collections.Generic;\n\nenum Legume { Radis, Carotte, Poireau, Courgette, Ail }\n\nenum Stade { Semis, Croissance, Recolte, Passe }\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        // Une date fixée dans le code : le potager doit donner les mêmes chiffres à chaque essai.\n        DateTime aujourdhui = new DateTime(2026, 4, 15);\n        Console.WriteLine($\"Nous sommes le {aujourdhui.ToString(\"dd/MM/yyyy\")}, \"\n                        + $\"un {aujourdhui.DayOfWeek}\");\n\n        Console.WriteLine();\n\n        Legume[] planches = { Legume.Radis, Legume.Carotte, Legume.Poireau,\n                              Legume.Courgette, Legume.Ail };\n        DateTime[] semis =\n        {\n            new DateTime(2026, 3, 10),\n            new DateTime(2026, 3, 25),\n            new DateTime(2026, 4, 2),\n            new DateTime(2026, 5, 5),\n            new DateTime(2026, 2, 18)\n        };\n\n        Console.WriteLine(\"LE CALENDRIER DES PLANCHES\");\n        for (int i = 0; i < planches.Length; i++)\n        {\n            int delai = JoursDeCulture(planches[i]);\n            DateTime recolte = semis[i].AddDays(delai);       // une NOUVELLE date : rien n'est modifié\n            TimeSpan reste = recolte - aujourdhui;            // deux dates soustraites donnent une durée\n\n            Console.WriteLine($\"Planche {(int)planches[i] + 1} — {planches[i]}\");\n            Console.WriteLine($\"  semé le {semis[i].ToString(\"dd/MM/yyyy\")}, \"\n                            + $\"{delai} jours de culture\");\n            Console.WriteLine($\"  récolte le {recolte.ToString(\"dd/MM/yyyy\")} \"\n                            + $\"({recolte.DayOfWeek})\");\n            Console.WriteLine($\"  dans {reste.Days} jours — stade : {Ou(semis[i], recolte, aujourdhui)}\");\n        }\n\n        Console.WriteLine();\n\n        // Une énumération s'affiche par son NOM, et se convertit en son rang si besoin.\n        Console.WriteLine(\"LES LÉGUMES ET LEUR RANG\");\n        foreach (Legume l in planches)\n        {\n            Console.WriteLine($\"{l} porte le rang {(int)l}\");\n        }\n\n        Console.WriteLine();\n\n        // Comparer deux dates se fait avec les opérateurs habituels.\n        DateTime premiere = semis[0];\n        DateTime derniere = semis[0];\n        foreach (DateTime d in semis)\n        {\n            if (d < premiere)\n            {\n                premiere = d;\n            }\n            if (d > derniere)\n            {\n                derniere = d;\n            }\n        }\n        TimeSpan etalement = derniere - premiere;\n        Console.WriteLine($\"Premier semis : {premiere.ToString(\"dd/MM/yyyy\")}\");\n        Console.WriteLine($\"Dernier semis : {derniere.ToString(\"dd/MM/yyyy\")}\");\n        Console.WriteLine($\"Étalement des semis : {etalement.Days} jours\");\n\n        Console.WriteLine();\n\n        // Les formats : un numéro de sachet complété, un poids à deux décimales.\n        Console.WriteLine(\"ÉTIQUETTES DE SACHETS\");\n        for (int i = 0; i < planches.Length; i++)\n        {\n            int numero = (i + 1) * 37;\n            double grammes = 2.5 * (i + 1);\n            Console.WriteLine($\"Sachet n° {numero:D5} — {planches[i]} — {grammes:F2} g\");\n        }\n\n        Console.WriteLine();\n\n        // Le hasard : un tirage change à chaque exécution, et c'est tout l'intérêt.\n        Random alea = new Random();\n        int tirage = alea.Next(planches.Length);          // borne haute EXCLUE : indice toujours valide\n        Console.WriteLine(\"LE CONTRÔLE DU JOUR\");\n        Console.WriteLine($\"Planche inspectée ce matin : {planches[tirage]}\");\n        Console.WriteLine($\"Nombre de bêchages tirés au sort : {alea.Next(1, 7)} (1 à 6)\");\n        Console.WriteLine(\"Ces deux lignes changent à chaque lancement : elles ne se vérifient pas \"\n                        + \"par le calcul, seulement par leurs bornes.\");\n    }\n\n    // Un switch sur une énumération : le compilateur sait quels cas existent.\n    static int JoursDeCulture(Legume l)\n    {\n        return l switch\n        {\n            Legume.Radis => 28,\n            Legume.Carotte => 75,\n            Legume.Poireau => 120,\n            Legume.Courgette => 60,\n            Legume.Ail => 210,\n            _ => 0\n        };\n    }\n\n    static Stade Ou(DateTime semis, DateTime recolte, DateTime aujourdhui)\n    {\n        if (aujourdhui < semis)\n        {\n            return Stade.Semis;\n        }\n        if (aujourdhui < recolte)\n        {\n            return Stade.Croissance;\n        }\n        if (aujourdhui == recolte)\n        {\n            return Stade.Recolte;\n        }\n        return Stade.Passe;\n    }\n}",

      "solution": "// La tombola de l'école : un tirage imprévisible, des garanties parfaitement vérifiables.\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Linq;\n\nenum Lot { Panier, Livre, Places, BonAchat }\n\nenum EtatBillet { Vendu, Gagnant }\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        const string SOUCHE = \"tombola.csv\";\n        const int PRIX_BILLET = 500;\n\n        string[] brut =\n        {\n            \"1;Ndiaye Fatou;5A\", \"2;Peeters Marc;5A\", \"3;Lorent Julie;5A\",\n            \"4;Kaïro Sami;5A\", \"5;Dhondt Anne;5A\", \"6;Ben Ali Youssef;5A\",\n            \"7;Maes Lotte;5A\", \"8;Vermeulen Piet;5B\", \"9;Dubois Léa;5B\",\n            \"10;Janssens Tom;5B\", \"11;Cardoso Ana;5B\", \"12;Wauters Jef;5B\",\n            \"13;Simons Nour;5B\", \"14;Goossens Ivo;6A\", \"15;Leroy Manon;6A\",\n            \"16;Bastin Elias;6A\", \"17;Colin Sara;6A\", \"18;Moreau Gaël;6A\",\n            \"19;Renard Inès;6A\", \"20;Thys Bram;6A\"\n        };\n        File.WriteAllLines(SOUCHE, brut);\n\n        if (!File.Exists(SOUCHE))\n        {\n            Console.WriteLine(\"Souche introuvable : aucun tirage possible\");\n            return;\n        }\n\n        List<Billet> souche = new List<Billet>();\n        foreach (string ligne in File.ReadAllLines(SOUCHE))\n        {\n            if (ligne == \"\")\n            {\n                continue;\n            }\n            string[] champs = ligne.Split(';');\n            souche.Add(new Billet(int.Parse(champs[0]), champs[1], champs[2]));\n        }\n        Console.WriteLine($\"Billets vendus : {souche.Count}\");\n\n        Console.WriteLine();\n\n        // Le motif compteur de la leçon 18, sur la classe cette fois.\n        Dictionary<string, int> parClasse = new Dictionary<string, int>();\n        foreach (Billet b in souche)\n        {\n            if (!parClasse.ContainsKey(b.Classe))\n            {\n                parClasse[b.Classe] = 0;\n            }\n            parClasse[b.Classe]++;\n        }\n\n        Console.WriteLine(\"BILLETS PAR CLASSE\");\n        foreach (var paire in parClasse.OrderBy(p => p.Key))\n        {\n            Console.WriteLine($\"{paire.Key} : {paire.Value} billets\");\n        }\n\n        int recette = souche.Count * PRIX_BILLET;\n        Lot[] lots = { Lot.Panier, Lot.Livre, Lot.Places, Lot.BonAchat };\n        int valeurLots = 0;\n        foreach (Lot l in lots)\n        {\n            valeurLots += ValeurCentimes(l);\n        }\n        Console.WriteLine($\"Recette : {recette / 100.0:F2} €\");\n        Console.WriteLine($\"Valeur des lots : {valeurLots / 100.0:F2} €\");\n        Console.WriteLine($\"Bénéfice pour la classe verte : {(recette - valeurLots) / 100.0:F2} €\");\n\n        Console.WriteLine();\n\n        // Les dates du règlement : fixées, donc vérifiables.\n        DateTime tirage = new DateTime(2026, 6, 12);\n        DateTime limite = tirage.AddDays(30);\n        DateTime consultation = new DateTime(2026, 6, 20);\n        TimeSpan restant = limite - consultation;\n        Console.WriteLine($\"Tirage : {tirage.ToString(\"dd/MM/yyyy\")} ({tirage.DayOfWeek})\");\n        Console.WriteLine($\"Réclamation jusqu'au {limite.ToString(\"dd/MM/yyyy\")} \"\n                        + $\"({limite.DayOfWeek})\");\n        Console.WriteLine($\"Au {consultation.ToString(\"dd/MM/yyyy\")}, il reste \"\n                        + $\"{restant.Days} jours pour réclamer\");\n\n        Console.WriteLine();\n\n        // Le tirage : on retire le billet tiré du chapeau, sans quoi il pourrait ressortir.\n        Random alea = new Random();\n        List<Billet> chapeau = new List<Billet>();\n        foreach (Billet b in souche)\n        {\n            chapeau.Add(b);          // une seconde liste, mais les MÊMES objets (leçon 12)\n        }\n        List<Billet> gagnants = new List<Billet>();\n\n        Console.WriteLine(\"LE TIRAGE\");\n        foreach (Lot l in lots)\n        {\n            int i = alea.Next(chapeau.Count);        // borne haute exclue : indice toujours valide\n            Billet tire = chapeau[i];\n            chapeau.RemoveAt(i);                     // le billet quitte le chapeau\n            tire.Attribuer(l);\n            gagnants.Add(tire);\n            Console.WriteLine($\"{l} ({ValeurCentimes(l) / 100.0:F2} €) → billet \"\n                            + $\"n° {tire.Numero:D5}, {tire.Acheteur} ({tire.Classe})\");\n        }\n\n        Console.WriteLine();\n\n        // Ce que le programme NE peut pas promettre : qui gagne. Ce qu'il PEUT promettre : ceci.\n        Console.WriteLine(\"CE QUI EST VÉRIFIABLE MALGRÉ LE HASARD\");\n        Console.WriteLine($\"Lots attribués : {gagnants.Count} (attendu : {lots.Length})\");\n        Console.WriteLine($\"Billets restés dans le chapeau : {chapeau.Count} \"\n                        + $\"(attendu : {souche.Count - lots.Length})\");\n\n        List<int> numeros = new List<int>();\n        int doublons = 0;\n        foreach (Billet b in gagnants)\n        {\n            if (numeros.Contains(b.Numero))\n            {\n                doublons++;\n            }\n            numeros.Add(b.Numero);\n        }\n        Console.WriteLine($\"Numéros tirés deux fois : {doublons} (attendu : 0)\");\n        Console.WriteLine($\"Numéro le plus bas tiré : {numeros.Min()} · le plus haut : \"\n                        + $\"{numeros.Max()}\");\n        Console.WriteLine($\"Tous les numéros sont dans la souche : \"\n                        + $\"{numeros.Count(n => n >= 1 && n <= souche.Count) == lots.Length}\");\n        Console.WriteLine($\"Billets marqués gagnants dans la souche : \"\n                        + $\"{souche.Count(b => b.Etat == EtatBillet.Gagnant)}\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"PALMARÈS PAR CLASSE (variable d'un tirage à l'autre)\");\n        Dictionary<string, int> gagnantsParClasse = new Dictionary<string, int>();\n        foreach (Billet b in gagnants)\n        {\n            if (!gagnantsParClasse.ContainsKey(b.Classe))\n            {\n                gagnantsParClasse[b.Classe] = 0;\n            }\n            gagnantsParClasse[b.Classe]++;\n        }\n        foreach (var paire in gagnantsParClasse.OrderBy(p => p.Key))\n        {\n            Console.WriteLine($\"{paire.Key} : {paire.Value} lot(s)\");\n        }\n    }\n\n    static int ValeurCentimes(Lot l)\n    {\n        return l switch\n        {\n            Lot.Panier => 3000,\n            Lot.Livre => 1200,\n            Lot.Places => 2000,\n            Lot.BonAchat => 1500,\n            _ => 0\n        };\n    }\n}\n\nclass Billet\n{\n    public int Numero { get; private set; }\n    public string Acheteur { get; private set; }\n    public string Classe { get; private set; }\n    public EtatBillet Etat { get; private set; }\n    public Lot LotGagne { get; private set; }\n\n    public Billet(int numero, string acheteur, string classe)\n    {\n        if (numero <= 0)\n        {\n            throw new ArgumentException($\"numéro de billet {numero} impossible\");\n        }\n        this.Numero = numero;\n        this.Acheteur = acheteur;\n        this.Classe = classe;\n        this.Etat = EtatBillet.Vendu;\n    }\n\n    public void Attribuer(Lot lot)\n    {\n        if (Etat == EtatBillet.Gagnant)\n        {\n            throw new ArgumentException($\"le billet n° {Numero} a déjà gagné {LotGagne}\");\n        }\n        this.LotGagne = lot;\n        this.Etat = EtatBillet.Gagnant;\n    }\n\n    public override string ToString()\n    {\n        return $\"n° {Numero:D5} — {Acheteur} ({Classe}) — {Etat}\";\n    }\n}",

      "solution": "// Le repair café, jour 3 : l'état cesse d'être un mot, la date cesse d'être un texte.\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Linq;\n\nenum Etat { Recu, EnCours, Repare, Irreparable }\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        const string REGISTRE = \"repaircafe-v3.csv\";\n        const string CLOTURE = \"repaircafe-v3-cloture.csv\";\n        const int DELAI_PROMIS = 60;\n\n        // Le registre gagne deux colonnes : l'état et la date de dépôt.\n        if (!File.Exists(REGISTRE))\n        {\n            Console.WriteLine(\"Registre introuvable : premier lancement, on l'écrit\");\n            List<string> seance = new List<string>();\n            seance.Add(\"R-01;grille-pain;Ilse;35;Repare;2026-02-07\");\n            seance.Add(\"R-02;vélo;Bruno;70;Repare;2026-02-07\");\n            seance.Add(\"R-03;lampe;Ilse;20;Irreparable;2026-02-07\");\n            seance.Add(\"R-04;machine à café;Nadia;95;EnCours;2026-03-07\");\n            seance.Add(\"R-05;vélo;Nadia;55;Repare;2026-03-07\");\n            seance.Add(\"R-06;radio;Bruno;40;Irreparable;2026-03-07\");\n            seance.Add(\"R-07;grille-pain;Ilse;25;Repare;2026-04-04\");\n            seance.Add(\"R-08;aspirateur;Bruno;80;EnCours;2026-04-04\");\n            seance.Add(\"R-09;bouilloire;Nadia;45;Recu;2026-04-04\");\n            File.WriteAllLines(REGISTRE, seance);\n        }\n        else\n        {\n            Console.WriteLine(\"Registre trouvé : on repart de la séance précédente\");\n        }\n\n        List<Reparation> atelier = new List<Reparation>();\n        foreach (string ligne in File.ReadAllLines(REGISTRE))\n        {\n            if (ligne == \"\")\n            {\n                continue;\n            }\n            atelier.Add(Reparation.DepuisLigne(ligne));\n        }\n        Console.WriteLine($\"{atelier.Count} fiches chargées\");\n\n        // Une date de référence écrite dans le code : le bilan doit être rejouable.\n        DateTime aujourdhui = new DateTime(2026, 5, 20);\n        Console.WriteLine($\"Bilan arrêté au {aujourdhui.ToString(\"dd/MM/yyyy\")} \"\n                        + $\"({aujourdhui.DayOfWeek})\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"LES FICHES\");\n        foreach (Reparation r in atelier)\n        {\n            TimeSpan age = aujourdhui - r.Depot;\n            DateTime promise = r.Depot.AddDays(DELAI_PROMIS);\n            Console.WriteLine($\"{r} — déposée depuis {age.Days} jours — rendue au plus tard le \"\n                            + $\"{promise.ToString(\"dd/MM/yyyy\")}\");\n        }\n\n        Console.WriteLine();\n\n        // Le motif compteur d'hier, sur une clé qui est maintenant une valeur nommée.\n        Dictionary<Etat, int> parEtat = new Dictionary<Etat, int>();\n        Dictionary<Etat, int> minutesParEtat = new Dictionary<Etat, int>();\n        foreach (Reparation r in atelier)\n        {\n            if (!parEtat.ContainsKey(r.Statut))\n            {\n                parEtat[r.Statut] = 0;\n                minutesParEtat[r.Statut] = 0;\n            }\n            parEtat[r.Statut]++;\n            minutesParEtat[r.Statut] += r.DureeMinutes;\n        }\n\n        Console.WriteLine(\"VENTILATION PAR ÉTAT\");\n        foreach (var paire in parEtat.OrderBy(p => (int)p.Key))    // l'ordre de l'énumération\n        {\n            Console.WriteLine($\"{Libelle(paire.Key)} : {paire.Value} fiches, \"\n                            + $\"{minutesParEtat[paire.Key]} minutes \"\n                            + $\"(rang {(int)paire.Key}, priorité {Priorite(paire.Key)})\");\n        }\n\n        int termines = atelier.Count(r => r.Statut == Etat.Repare\n                                       || r.Statut == Etat.Irreparable);\n        int reparees = atelier.Count(r => r.Statut == Etat.Repare);\n        Console.WriteLine($\"Dossiers terminés : {termines} sur {atelier.Count}\");\n        Console.WriteLine($\"Taux de réussite sur les dossiers terminés : \"\n                        + $\"{reparees * 100 / termines} %\");\n\n        Console.WriteLine();\n\n        // Une comparaison de dates remplace une comparaison de textes : plus rien à parser.\n        Console.WriteLine(\"FICHES EN RETARD\");\n        int retards = 0;\n        foreach (Reparation r in atelier)\n        {\n            bool termine = r.Statut == Etat.Repare || r.Statut == Etat.Irreparable;\n            DateTime promise = r.Depot.AddDays(DELAI_PROMIS);\n            if (!termine && promise < aujourdhui)\n            {\n                retards++;\n                TimeSpan depassement = aujourdhui - promise;\n                Console.WriteLine($\"{r.Code} : promise le {promise.ToString(\"dd/MM/yyyy\")}, \"\n                                + $\"soit {depassement.Days} jours de retard\");\n            }\n        }\n        Console.WriteLine($\"Fiches en retard : {retards}\");\n\n        Console.WriteLine();\n\n        // Première version : la clé est le texte de la date. Regarde bien l'ordre obtenu.\n        Console.WriteLine(\"LES TROIS SÉANCES, CLÉ TEXTE\");\n        Dictionary<string, int> parSeanceTexte = new Dictionary<string, int>();\n        foreach (Reparation r in atelier)\n        {\n            string cle = r.Depot.ToString(\"dd/MM/yyyy\");\n            if (!parSeanceTexte.ContainsKey(cle))\n            {\n                parSeanceTexte[cle] = 0;\n            }\n            parSeanceTexte[cle]++;\n        }\n        foreach (var paire in parSeanceTexte.OrderBy(p => p.Key))\n        {\n            Console.WriteLine($\"{paire.Key} : {paire.Value} fiches\");\n        }\n        Console.WriteLine(\"Le 4 avril passe avant le 7 février : trié comme du texte, pas comme \"\n                        + \"une date.\");\n\n        Console.WriteLine();\n\n        // Seconde version : la clé EST une date, et l'ordre redevient celui du calendrier.\n        Console.WriteLine(\"LES TROIS SÉANCES, CLÉ DATE\");\n        Dictionary<DateTime, int> parSeance = new Dictionary<DateTime, int>();\n        foreach (Reparation r in atelier)\n        {\n            if (!parSeance.ContainsKey(r.Depot))\n            {\n                parSeance[r.Depot] = 0;\n            }\n            parSeance[r.Depot]++;\n        }\n        foreach (var paire in parSeance.OrderBy(p => p.Key))\n        {\n            Console.WriteLine($\"{paire.Key.ToString(\"dd/MM/yyyy\")} : {paire.Value} fiches\");\n        }\n\n        DateTime premiere = atelier[0].Depot;\n        DateTime derniere = atelier[0].Depot;\n        foreach (Reparation r in atelier)\n        {\n            if (r.Depot < premiere) { premiere = r.Depot; }\n            if (r.Depot > derniere) { derniere = r.Depot; }\n        }\n        Console.WriteLine($\"Première séance : {premiere.ToString(\"dd/MM/yyyy\")}\");\n        Console.WriteLine($\"Dernière séance : {derniere.ToString(\"dd/MM/yyyy\")}\");\n        Console.WriteLine($\"Étalement : {(derniere - premiere).Days} jours\");\n\n        Console.WriteLine();\n\n        List<int> durees = new List<int>();\n        foreach (Reparation r in atelier)\n        {\n            durees.Add(r.DureeMinutes);\n        }\n        Console.WriteLine($\"Temps d'atelier : {durees.Sum()} minutes\");\n        Console.WriteLine($\"Temps utile (fiches réparées) : \"\n                        + $\"{minutesParEtat[Etat.Repare]} minutes\");\n        Console.WriteLine($\"Temps perdu (fiches irréparables) : \"\n                        + $\"{minutesParEtat[Etat.Irreparable]} minutes\");\n\n        Console.WriteLine();\n\n        // Le contrôle qualité : une fiche réparée tirée au sort. Imprévisible, mais borné.\n        List<Reparation> candidates = new List<Reparation>();\n        foreach (Reparation r in atelier)\n        {\n            if (r.Statut == Etat.Repare)\n            {\n                candidates.Add(r);\n            }\n        }\n        Random alea = new Random();\n        Reparation controlee = candidates[alea.Next(candidates.Count)];\n        Console.WriteLine(\"CONTRÔLE QUALITÉ\");\n        Console.WriteLine($\"Fiches éligibles : {candidates.Count}\");\n        Console.WriteLine($\"Fiche tirée ce soir : {controlee.Code} ({controlee.Objet})\");\n        Console.WriteLine($\"Elle est bien parmi les réparées : \"\n                        + $\"{controlee.Statut == Etat.Repare}\");\n        Console.WriteLine(\"Le code tiré change à chaque lancement ; les deux lignes qui \"\n                        + \"l'encadrent, elles, sont vraies à tous les coups.\");\n\n        Console.WriteLine();\n\n        List<string> aEcrire = new List<string>();\n        foreach (Reparation r in atelier)\n        {\n            aEcrire.Add(r.EnLigne());\n        }\n        File.WriteAllLines(CLOTURE, aEcrire);\n        Console.WriteLine($\"{File.ReadAllLines(CLOTURE).Length} lignes dans {CLOTURE}\");\n    }\n\n    static string Libelle(Etat e)\n    {\n        return e switch\n        {\n            Etat.Recu => \"reçue, pas encore ouverte\",\n            Etat.EnCours => \"en cours de réparation\",\n            Etat.Repare => \"réparée\",\n            Etat.Irreparable => \"irréparable\",\n            _ => \"état inconnu\"\n        };\n    }\n\n    static int Priorite(Etat e)\n    {\n        return e switch\n        {\n            Etat.EnCours => 1,\n            Etat.Recu => 2,\n            Etat.Repare => 3,\n            Etat.Irreparable => 3,\n            _ => 9\n        };\n    }\n}\n\nclass Reparation\n{\n    public string Code { get; private set; }\n    public string Objet { get; private set; }\n    public string Benevole { get; private set; }\n    public int DureeMinutes { get; private set; }\n    public Etat Statut { get; private set; }\n    public DateTime Depot { get; private set; }\n\n    public Reparation(string code, string objet, string benevole, int dureeMinutes,\n                      Etat statut, DateTime depot)\n    {\n        if (dureeMinutes <= 0)\n        {\n            throw new ArgumentException($\"{code} : durée de {dureeMinutes} minutes impossible\");\n        }\n        this.Code = code;\n        this.Objet = objet;\n        this.Benevole = benevole;\n        this.DureeMinutes = dureeMinutes;\n        this.Statut = statut;\n        this.Depot = depot;\n    }\n\n    public static Reparation DepuisLigne(string ligne)\n    {\n        string[] champs = ligne.Split(';');\n        if (champs.Length != 6)\n        {\n            throw new ArgumentException($\"« {ligne} » : six champs attendus\");\n        }\n        Etat statut = LireEtat(champs[4]);\n        string[] date = champs[5].Split('-');\n        DateTime depot = new DateTime(int.Parse(date[0]), int.Parse(date[1]),\n                                      int.Parse(date[2]));\n        return new Reparation(champs[0], champs[1], champs[2], int.Parse(champs[3]),\n                              statut, depot);\n    }\n\n    // Un texte venu d'un fichier n'est pas une valeur nommée : la conversion doit être explicite.\n    static Etat LireEtat(string texte)\n    {\n        return texte switch\n        {\n            \"Recu\" => Etat.Recu,\n            \"EnCours\" => Etat.EnCours,\n            \"Repare\" => Etat.Repare,\n            \"Irreparable\" => Etat.Irreparable,\n            _ => throw new ArgumentException($\"état « {texte} » inconnu\")\n        };\n    }\n\n    public string EnLigne()\n    {\n        return $\"{Code};{Objet};{Benevole};{DureeMinutes};{Statut};\"\n             + $\"{Depot.ToString(\"yyyy-MM-dd\")}\";\n    }\n\n    public override string ToString()\n    {\n        return $\"{Code} — {Objet} — {Benevole} — {DureeMinutes} min — {Statut}\";\n    }\n}",
      "pourquoi": "Hier, savoir si une fiche était terminée demandait de comparer un texte à deux autres textes, et une faute de frappe dans le fichier serait passée sans un mot. Aujourd'hui, la faute de frappe est refusée à la lecture, et le reste du programme ne manipule plus que des valeurs dont le compilateur connaît la liste. Le fichier n'a pas changé de nature — la frontière entre lui et le programme, si.",
      "checklist": [
        "La ventilation donne-t-elle 4 réparées (185 min), 2 irréparables (60 min), 2 en cours (175 min) et 1 reçue (45 min) ?",
        "Le taux de réussite sur les 6 dossiers terminés vaut-il 66 % ?",
        "Une seule fiche est-elle en retard — R-04, promise le 06/05/2026, avec 14 jours de dépassement ?",
        "L'étalement des séances vaut-il 56 jours, du 07/02 au 04/04 ?",
        "Le tableau à clé texte place-t-il bien le 04/04/2026 en premier ? Le tableau à clé date doit, lui, commencer par le 07/02/2026."
      ],
      "note": "Jour 3 sur 4. Le registre décrit maintenant des états et des dates, pas des mots et des chiffres. Il reste un défaut structurel que tu n'as pas encore les moyens de nommer : ce programme sait tenir un atelier de réparations, et rien d'autre. Demain, la même mécanique servira à autre chose sans être réécrite."
    }
  ]
};

    checklist: ["Le nombre secret est tiré avec rand.Next(1, 101), donc entre 1 et 100 (borne haute exclue).", "Une boucle do-while redemande tant que la proposition diffère du nombre, avec « Plus grand ! » ou « Plus petit ! ».", "Un compteur d'essais est incrémenté à chaque tour puis affiché une fois le nombre trouvé."],
    solution: "using System;                                    // accès à Console et Random\n\nclass NombreMystere                              // déclaration de la classe\n{                                                // début de la classe\n    static void Main()                           // point d'entrée du programme\n    {                                            // début de Main\n        Random rand = new Random();              // crée le générateur aléatoire\n        int mystere = rand.Next(1, 101);         // Next(1, 101) → 1..100 (borne haute EXCLUE)\n        int essais = 0;                          // compteur de tentatives\n        int proposition;                         // déclarée avant la boucle (visible dans le while)\n        do                                       // on propose au moins une fois\n        {                                        // début du bloc répété\n            Console.Write(\"Propose (1-100) ? \"); // invite\n            proposition = int.Parse(Console.ReadLine()); // lit la tentative\n            essais++;                            // compte cette tentative\n            if (proposition < mystere)           // trop bas ?\n                Console.WriteLine(\"Plus grand !\"); // indice\n            else if (proposition > mystere)      // trop haut ?\n                Console.WriteLine(\"Plus petit !\"); // indice inverse\n        } while (proposition != mystere);        // on recommence tant que ce n'est pas trouvé\n        Console.WriteLine($\"Bravo ! Trouvé en {essais} essai(s)\"); // bilan\n    }                                            // fin de Main\n}                                                // fin de la classe",
    note: "Next(1, 101) et pas Next(1, 100) : la borne haute est exclue — piège classique." }
