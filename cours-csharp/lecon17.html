  title: "Lire et écrire des fichiers",
  subtitle: "Faire survivre les données à la fin du programme.",
  theory: `
<h3>1. Pourquoi écrire dans des fichiers ?</h3>
<p>Quand ton programme se termine, la <strong>mémoire vive (RAM)</strong> est libérée : toutes tes variables, tes <code>List</code>, tes objets… disparaissent. Si l'utilisateur a saisi 200 notes et que tu ne les écris nulle part, elles sont <strong>perdues</strong> au prochain lancement.</p>
<p>Un <strong>fichier</strong> vit sur le <strong>disque dur (ou SSD)</strong> : c'est un stockage <strong>persistant</strong>. Écrire dans un fichier, c'est copier des données de la RAM (volatile) vers le disque (durable). Lire un fichier, c'est l'inverse : recharger dans la RAM ce qui avait été sauvegardé. C'est ainsi que scores, inscriptions et réglages « survivent » à la fermeture du programme.</p>

<h3>2. La méthode la plus simple : la classe File</h3>
<p>La classe <code>File</code> (namespace <code>System.IO</code>, pour <em>Input/Output</em>) offre des méthodes « tout-en-un » : elles <strong>ouvrent, lisent ou écrivent, puis ferment</strong> le fichier pour toi, en un seul appel. Idéal pour les <strong>petits</strong> fichiers.</p>
<pre class="pseudo">using System.IO;                                        // donne accès à la classe File (I/O = entrées/sorties)

File.WriteAllText("notes.txt", "Ana;14\\n");            // CRÉE le fichier (ou l'ÉCRASE s'il existe) et y écrit le texte
File.AppendAllText("notes.txt", "Bob;9\\n");           // AJOUTE à la fin sans effacer ce qui précède (append = ajouter)
string tout = File.ReadAllText("notes.txt");           // lit TOUT le contenu du fichier dans une seule string
string[] lignes = File.ReadAllLines("notes.txt");      // lit le fichier et le découpe en un TABLEAU (une case = une ligne)</pre>
<div class="warn">Piège n°1 — l'écrasement : <code>WriteAllText</code> et <code>WriteAllLines</code> REMPLACENT tout l'ancien contenu, exactement comme une réaffectation de variable (leçon 2). Pour compléter un fichier existant sans le vider, il faut <code>AppendAllText</code>.</div>
<p>Là où Java exige PrintWriter + Scanner + try, C# condense tout dans la classe <code>File</code> (même philosophie qu'en PHP).</p>

<h3>3. Le contrôle fin : StreamReader et StreamWriter</h3>
<p>Un <strong>flux</strong> (en anglais <em>stream</em>) est un « tuyau » par lequel les octets circulent entre ton programme et le fichier, <strong>un morceau à la fois</strong>. Au lieu de charger le fichier entier en mémoire (ce que fait <code>ReadAllText</code>), un flux traite les données <strong>au fil de l'eau</strong>. C'est indispensable pour un <strong>gros</strong> fichier (un journal de plusieurs Go ne tiendrait pas en RAM), et plus efficace en général.</p>
<p><code>StreamWriter</code> = le flux d'<strong>écriture</strong> ; <code>StreamReader</code> = le flux de <strong>lecture</strong>. Ils utilisent un <strong>tampon (buffer)</strong> : une petite zone mémoire où les données s'accumulent avant d'être réellement écrites sur le disque en un seul bloc (le disque est lent, on lui parle le moins souvent possible).</p>
<p><strong>Écrire avec StreamWriter :</strong></p>
<pre class="pseudo">using System.IO;                                        // pour StreamReader / StreamWriter

using (StreamWriter ecrivain = new StreamWriter("notes.txt"))  // ouvre le fichier en écriture (l'ÉCRASE) ; using = fermeture auto
{                                                       // début du bloc using : le flux est ouvert ici
    ecrivain.WriteLine("Ana;14");                       // écrit la ligne DANS LE TAMPON + un retour à la ligne (comme Console.WriteLine, mais vers le fichier)
    ecrivain.Write("Bob");                              // écrit SANS retour à la ligne
    ecrivain.WriteLine(";9");                           // complète la ligne et la termine
}                                                       // fin du using : Dispose() est appelé → le tampon est VIDÉ sur le disque puis le fichier FERMÉ</pre>
<div class="tip">Pour AJOUTER au lieu d'écraser avec StreamWriter, passe <code>true</code> en 2ᵉ argument : <code>new StreamWriter("notes.txt", true)</code>. Ce booléen s'appelle <em>append</em> (ajouter).</div>
<p><strong>Lire avec StreamReader :</strong></p>
<pre class="pseudo">using (StreamReader lecteur = new StreamReader("notes.txt"))   // ouvre le fichier en lecture ; using garantit la fermeture
{                                                       // début du bloc : le flux est prêt
    string ligne;                                       // variable qui recevra chaque ligne lue
    while ((ligne = lecteur.ReadLine()) != null)        // ReadLine() rend la ligne suivante, ou null quand le fichier est FINI
    {                                                   // tant que ce n'est pas null, il reste des lignes → on boucle (TANT QUE, leçon 6)
        Console.WriteLine(ligne);                       // traite la ligne (ici : on l'affiche)
    }                                                   // on remonte tester la condition avec la ligne suivante
}                                                       // fin du using : le fichier est fermé automatiquement, même si une exception éclate</pre>
<p>Le motif <code>while ((ligne = lecteur.ReadLine()) != null)</code> est LA boucle de lecture d'un flux : on lit, on range dans <code>ligne</code>, et on s'arrête dès que <code>ReadLine()</code> renvoie <code>null</code> (marqueur de « fin de fichier »). Le nombre de tours est <strong>inconnu à l'avance</strong> : c'est exactement le cas d'usage du TANT QUE (leçon 6).</p>

<h3>4. Le rôle crucial de using (fermeture et vidage du tampon)</h3>
<p>Un flux ouvert consomme une ressource du système d'exploitation (un « descripteur de fichier »). Il faut <strong>toujours</strong> le fermer, pour deux raisons : libérer la ressource, et surtout <strong>vider le tampon</strong> — tant qu'on n'a pas fermé (ou appelé <code>Flush()</code>), les dernières données restent en mémoire et <strong>ne sont pas encore sur le disque</strong>.</p>
<pre class="pseudo">using (StreamWriter w = new StreamWriter("f.txt"))      // le mot-clé using ouvre le flux…
{                                                       // …et note qu'il devra être libéré à la sortie du bloc
    w.WriteLine("données");                             // écrit dans le tampon (pas encore sur le disque !)
}                                                       // ← ICI : Dispose() → Flush() (vide le tampon) puis Close() (ferme), AUTOMATIQUEMENT</pre>
<div class="warn">Piège n°2 — le fichier vide : sans <code>using</code> (ou sans <code>Close()</code>), un flux d'écriture peut te laisser un fichier VIDE ou incomplet, car le tampon n'a jamais été vidé. <code>using</code> est l'équivalent automatique du <code>finally</code> de la leçon 16 : il ferme même si une exception survient.</div>

<h3>5. Découper le CSV (une ligne = un enregistrement)</h3>
<p>Le format <strong>CSV</strong> range un « enregistrement » par ligne, avec un séparateur (ici <code>;</code>) entre les champs. On lit ligne par ligne puis on découpe.</p>
<pre class="pseudo">foreach (string ligne in File.ReadAllLines("notes.txt")) // parcourt chaque ligne du fichier (leçon 10)
{                                                       // début du corps de boucle
    if (ligne == "") { continue; }                      // cas limite : ligne vide → on saute au tour suivant (continue)
    string[] champs = ligne.Split(';');                 // découpe « Ana;14 » en {"Ana","14"} (Split = explode PHP / split Java)
    string nom = champs[0];                             // 1er champ : le nom
    int note = int.Parse(champs[1]);                    // 2e champ : "14" (texte) → 14 (nombre) — conversion de la leçon 4
    Console.WriteLine($"{nom} a eu {note}");            // affiche le résultat reconstruit
}                                                       // fin de boucle : on passe à la ligne suivante</pre>

<h3>6. Écrire toute une collection d'un coup</h3>
<pre class="pseudo">List&lt;string&gt; lignes = new List&lt;string&gt; { "Ana;14", "Bob;9" }; // une liste de chaînes déjà au format CSV
File.WriteAllLines("classe.txt", lignes);               // écrit chaque élément sur SA propre ligne (ajoute les retours à la ligne)</pre>

<h3>7. Gérer les cas limites (fichier absent)</h3>
<pre class="pseudo">if (File.Exists("classe.txt"))                          // le fichier existe-t-il ? (au 1er lancement : non !)
{                                                       // OUI : on peut lire sans risque
    string[] lignes = File.ReadAllLines("classe.txt");  // lecture sûre puisqu'on a vérifié l'existence
    // ... traitement des lignes ...
}                                                       // fin du cas « fichier présent »
else                                                    // NON : premier démarrage, aucun fichier encore
{                                                       // on évite ainsi une FileNotFoundException
    Console.WriteLine("Fichier introuvable, on démarre à vide"); // on repart proprement sur des données vides
}                                                       // fin du else</pre>

<h3>8. JSON natif (System.Text.Json)</h3>
<pre class="pseudo">using System.Text.Json;                                 // donne accès à JsonSerializer

var classe = new List&lt;Etudiant&gt; { new Etudiant("Ana", 14) }; // une liste d'OBJETS métier (pas de simples strings)
string json = JsonSerializer.Serialize(classe);         // SÉRIALISE : transforme la liste d'objets en TEXTE JSON
File.WriteAllText("classe.json", json);                 // écrit ce texte JSON dans le fichier

string lu = File.ReadAllText("classe.json");            // relit le texte JSON depuis le fichier
var restauree = JsonSerializer.Deserialize&lt;List&lt;Etudiant&gt;&gt;(lu); // DÉSÉRIALISE : reconstruit directement des OBJETS Etudiant</pre>
<div class="tip">Énorme atout C# : <code>JsonSerializer</code> transforme tes OBJETS en JSON et inversement — sans reconstruction manuelle champ par champ. Sauvegarder/charger une structure entière tient en deux lignes.</div>

<h3>9. Le cycle de vie d'une application</h3>
<pre class="pseudo">1. Démarrage : LIRE le fichier → reconstruire une List d'objets en mémoire
2. Vie       : manipuler la List (Add, Remove, tri…) — tout se passe en RAM
3. Fin       : RÉÉCRIRE le fichier depuis la List (sauvegarde de l'état final)</pre>
<p>Ce cycle <strong>disque → mémoire → disque</strong> est l'architecture de la quasi-totalité des petites applications (et de ton projet de la leçon 20).</p>

<h3>10. Quel outil choisir ?</h3>
<pre class="pseudo">File.ReadAllText / WriteAllText   → petit fichier, tout en mémoire, 1 ligne : le plus simple
StreamReader / StreamWriter       → gros fichier ou traitement au fil de l'eau : contrôle fin, tampon
JsonSerializer + File             → sauvegarder/charger des structures d'objets complètes</pre>`,

      "solution": "// Le relevé du compteur d'eau : de la mémoire vers le disque, et retour.\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        const string FICHIER = \"compteur.csv\";\n        const string RAPPORT = \"rapport.txt\";\n        const int PRIX_CENTIMES = 345;              // le mètre cube, en centimes\n\n        // 1. De la RAM vers le disque : une collection écrite d'un seul appel.\n        List<string> releves = new List<string>();\n        releves.Add(\"2026-01;1042\");\n        releves.Add(\"2026-02;1051\");\n        releves.Add(\"2026-03;1063\");\n        releves.Add(\"2026-04;1078\");\n        releves.Add(\"2026-05;1090\");\n        File.WriteAllLines(FICHIER, releves);       // CRÉE le fichier, ou l'ÉCRASE s'il existait\n        Console.WriteLine($\"{releves.Count} relevés écrits dans {FICHIER}\");\n\n        // 2. Compléter sans effacer : le relevé de juin arrive après coup.\n        File.AppendAllText(FICHIER, \"2026-06;1099\\n\");\n        Console.WriteLine(\"Relevé de juin ajouté à la fin\");\n\n        Console.WriteLine();\n\n        // 3. Ne jamais lire un fichier sans avoir demandé s'il est là.\n        if (!File.Exists(FICHIER))\n        {\n            Console.WriteLine(\"Aucun relevé : le compteur n'a jamais été lu\");\n            return;\n        }\n\n        // 4. Du disque vers la RAM : une ligne de fichier redevient deux champs.\n        string[] lignes = File.ReadAllLines(FICHIER);\n        List<string> mois = new List<string>();\n        List<int> index = new List<int>();\n\n        foreach (string ligne in lignes)\n        {\n            if (ligne == \"\")\n            {\n                continue;                          // cas limite : une ligne vide se saute\n            }\n            string[] champs = ligne.Split(';');\n            mois.Add(champs[0]);\n            index.Add(int.Parse(champs[1]));\n        }\n        Console.WriteLine($\"{index.Count} relevés relus depuis le disque\");\n\n        Console.WriteLine();\n\n        // 5. Le traitement se fait en mémoire, jamais dans le fichier.\n        Console.WriteLine(\"CONSOMMATION MOIS PAR MOIS\");\n        int totalM3 = 0;\n        int plusFort = 0;\n        string moisFort = \"\";\n        int plusFaible = 0;\n        string moisFaible = \"\";\n\n        for (int i = 1; i < index.Count; i++)\n        {\n            int conso = index[i] - index[i - 1];\n            totalM3 += conso;\n            Console.WriteLine($\"{mois[i]} : {conso} m³\");\n            if (i == 1 || conso > plusFort)\n            {\n                plusFort = conso;\n                moisFort = mois[i];\n            }\n            if (i == 1 || conso < plusFaible)\n            {\n                plusFaible = conso;\n                moisFaible = mois[i];\n            }\n        }\n\n        int intervalles = index.Count - 1;\n        Console.WriteLine($\"Consommation totale : {totalM3} m³ sur {intervalles} mois\");\n        Console.WriteLine($\"Moyenne mensuelle : {totalM3 / intervalles} m³\");\n        Console.WriteLine($\"Mois le plus fort : {moisFort} ({plusFort} m³)\");\n        Console.WriteLine($\"Mois le plus faible : {moisFaible} ({plusFaible} m³)\");\n        Console.WriteLine($\"Facture : {totalM3 * PRIX_CENTIMES / 100.0:F2} €\");\n\n        Console.WriteLine();\n\n        // 6. Un flux d'écriture : le tampon se vide à la sortie du bloc, pas avant.\n        using (StreamWriter ecrivain = new StreamWriter(RAPPORT))\n        {\n            ecrivain.WriteLine(\"RAPPORT DE CONSOMMATION\");\n            ecrivain.WriteLine($\"Période : {mois[0]} à {mois[mois.Count - 1]}\");\n            ecrivain.Write(\"Total : \");                 // Write n'ajoute pas de retour à la ligne\n            ecrivain.WriteLine($\"{totalM3} m³\");\n            ecrivain.WriteLine($\"Facture : {totalM3 * PRIX_CENTIMES / 100.0:F2} €\");\n        }                                               // ici seulement le fichier est complet\n        Console.WriteLine($\"{RAPPORT} écrit et refermé\");\n\n        Console.WriteLine();\n\n        // 7. Un flux de lecture : on ne sait pas combien de lignes, donc TANT QUE.\n        Console.WriteLine($\"RELECTURE DE {RAPPORT}\");\n        using (StreamReader lecteur = new StreamReader(RAPPORT))\n        {\n            string ligne;\n            while ((ligne = lecteur.ReadLine()) != null)   // null = fin de fichier\n            {\n                Console.WriteLine($\"  {ligne}\");\n            }\n        }\n\n        Console.WriteLine();\n\n        // 8. Le piège de l'écrasement, montré plutôt que raconté.\n        File.WriteAllText(\"essai.txt\", \"première version\");\n        File.WriteAllText(\"essai.txt\", \"seconde version\");\n        Console.WriteLine($\"Après deux écritures : « {File.ReadAllText(\"essai.txt\")} »\");\n        File.AppendAllText(\"essai.txt\", \" puis un ajout\");\n        Console.WriteLine($\"Après un ajout : « {File.ReadAllText(\"essai.txt\")} »\");\n    }\n}",

      "solution": "// Le registre des dons du sang : un fichier abîmé, lu jusqu'au bout sans rien inventer.\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        const string SOURCE = \"dons.csv\";\n        const string CLOTURE = \"dons-cloture.csv\";\n        const string BILAN = \"bilan.txt\";\n\n        // Le fichier tel qu'il arrive du secrétariat : deux lignes sont abîmées.\n        string[] brut =\n        {\n            \"D-001;Ndiaye Fatou;O-;450;2026-03-04\",\n            \"D-002;Peeters Marc;A+;500;2026-03-04\",\n            \"D-003;Lorent Julie;B+;abc;2026-03-11\",\n            \"D-004;Kaïro Sami;AB+;450;2026-03-11\",\n            \"D-005;Dhondt Anne;O+;-100;2026-03-18\",\n            \"D-006;Ben Ali Youssef;A-;480\",\n            \"D-007;Maes Lotte;O+;500;2026-03-18\"\n        };\n        File.WriteAllLines(SOURCE, brut);\n        Console.WriteLine($\"{brut.Length} lignes déposées dans {SOURCE}\");\n\n        Console.WriteLine();\n\n        if (!File.Exists(SOURCE))\n        {\n            Console.WriteLine(\"Registre introuvable : on démarre à vide\");\n            return;\n        }\n\n        // Lecture : chaque ligne est traitée séparément, une faute n'en emporte pas d'autres.\n        Console.WriteLine(\"LECTURE DU REGISTRE\");\n        List<Don> dons = new List<Don>();\n        int lues = 0;\n        int illisibles = 0;\n        int invalides = 0;\n\n        foreach (string ligne in File.ReadAllLines(SOURCE))\n        {\n            try\n            {\n                if (ligne == \"\")\n                {\n                    continue;\n                }\n                dons.Add(Analyser(ligne));\n                Console.WriteLine($\"Retenu : {ligne}\");\n            }\n            catch (FormatException e)\n            {\n                illisibles++;\n                Console.WriteLine($\"Illisible : {e.Message}\");\n            }\n            catch (ArgumentException e)\n            {\n                invalides++;\n                Console.WriteLine($\"Invalide : {e.Message}\");\n            }\n            finally\n            {\n                lues++;\n            }\n        }\n        Console.WriteLine($\"Lignes lues : {lues} · retenues : {dons.Count} · \"\n                        + $\"illisibles : {illisibles} · invalides : {invalides}\");\n\n        Console.WriteLine();\n\n        int volumeTotal = 0;\n        int groupeO = 0;\n        foreach (Don d in dons)\n        {\n            volumeTotal += d.VolumeMl;\n            if (d.Groupe.StartsWith(\"O\"))\n            {\n                groupeO++;\n            }\n        }\n        Console.WriteLine($\"Volume collecté : {volumeTotal} mL\");\n        Console.WriteLine($\"Donneurs de groupe O : {groupeO} sur {dons.Count}\");\n\n        Console.WriteLine();\n\n        // La vie du programme se passe en mémoire : on ajoute à la LISTE, pas au fichier.\n        dons.Add(new Don(\"D-008\", \"Vermeulen Piet\", \"A+\", 450, \"2026-03-25\"));\n        Console.WriteLine($\"Après le donneur de dernière minute : {dons.Count} dons\");\n\n        int volumeFinal = 0;\n        foreach (Don d in dons)\n        {\n            volumeFinal += d.VolumeMl;\n        }\n        Console.WriteLine($\"Volume final : {volumeFinal} mL\");\n        Console.WriteLine($\"Volume moyen par donneur : {volumeFinal / dons.Count} mL\");\n\n        Console.WriteLine();\n\n        // Fin de journée : la liste redevient un fichier, propre cette fois.\n        List<string> aEcrire = new List<string>();\n        foreach (Don d in dons)\n        {\n            aEcrire.Add(d.EnLigne());\n        }\n        File.WriteAllLines(CLOTURE, aEcrire);\n        Console.WriteLine($\"{aEcrire.Count} lignes écrites dans {CLOTURE}\");\n\n        // Le tour est bouclé : ce qui a été écrit se relit à l'identique.\n        string[] relues = File.ReadAllLines(CLOTURE);\n        Console.WriteLine($\"{relues.Length} lignes relues — première : {relues[0]}\");\n        Console.WriteLine($\"Dernière : {relues[relues.Length - 1]}\");\n\n        Console.WriteLine();\n\n        // Un flux pour le bilan, avec le vidage du tampon garanti par le bloc.\n        using (StreamWriter ecrivain = new StreamWriter(BILAN))\n        {\n            ecrivain.WriteLine(\"BILAN DE LA COLLECTE\");\n            ecrivain.WriteLine($\"Lignes reçues : {lues}\");\n            ecrivain.WriteLine($\"Dons enregistrés : {dons.Count}\");\n            ecrivain.WriteLine($\"Rejets : {illisibles + invalides}\");\n            ecrivain.WriteLine($\"Volume : {volumeFinal} mL\");\n        }\n\n        Console.WriteLine($\"RELECTURE DE {BILAN}\");\n        using (StreamReader lecteur = new StreamReader(BILAN))\n        {\n            string ligne;\n            while ((ligne = lecteur.ReadLine()) != null)\n            {\n                Console.WriteLine($\"  {ligne}\");\n            }\n        }\n    }\n\n    // Une seule porte d'entrée : elle lance, elle ne complète jamais une ligne incomplète.\n    static Don Analyser(string ligne)\n    {\n        string[] champs = ligne.Split(';');\n        if (champs.Length != 5)\n        {\n            throw new ArgumentException($\"« {ligne} » : cinq champs attendus, {champs.Length} \"\n                                      + \"trouvés\");\n        }\n        int volume = int.Parse(champs[3]);       // lance une FormatException sur « abc »\n        return new Don(champs[0], champs[1], champs[2], volume, champs[4]);\n    }\n}\n\nclass Don\n{\n    public string Code { get; private set; }\n    public string Nom { get; private set; }\n    public string Groupe { get; private set; }\n    public int VolumeMl { get; private set; }\n    public string Date { get; private set; }\n\n    public Don(string code, string nom, string groupe, int volumeMl, string date)\n    {\n        if (volumeMl < 300 || volumeMl > 600)\n        {\n            throw new ArgumentException($\"{code} : {volumeMl} mL hors des bornes de la collecte\");\n        }\n        this.Code = code;\n        this.Nom = nom;\n        this.Groupe = groupe;\n        this.VolumeMl = volumeMl;\n        this.Date = date;\n    }\n\n    // L'objet sait redevenir une ligne : le format n'est écrit qu'à un seul endroit.\n    public string EnLigne()\n    {\n        return $\"{Code};{Nom};{Groupe};{VolumeMl};{Date}\";\n    }\n\n    public override string ToString()\n    {\n        return $\"{Code} — {Nom} ({Groupe}) — {VolumeMl} mL le {Date}\";\n    }\n}",

      "principe": "Le cycle disque → mémoire → disque est l'architecture de presque toutes les petites applications. Le fichier n'est ni la structure de données ni le programme : c'est l'état de départ et l'état d'arrivée, et rien entre les deux.",
      "reflexion": "Compte le nombre de fois où ton programme parcourt l'atelier pour calculer le temps des bénévoles. Avec trois bénévoles et neuf fiches, cela reste indolore. Écris ce que ce nombre devient avec quarante bénévoles et six cents fiches, puis dis ce que tu voudrais pouvoir demander au programme à la place de « reparcours tout et compte ». Tu viens de décrire la leçon 18.",
      "remarque": "La méthode qui reconstruit une réparation à partir d'une ligne s'appelle sans avoir d'objet sous la main — c'est normal, puisque son travail est précisément d'en fabriquer un. C'est le premier usage vraiment justifié du mot <code>static</code> depuis la leçon 12 : une opération qui appartient à la classe entière, et non à un exemplaire.",
      "indices": [
        "Décide en premier lieu qui sait quoi. La classe sait fabriquer sa ligne et se reconstruire depuis une ligne — c'est elle qui connaît son format. Le programme principal sait où est le fichier et quand lire ou écrire — c'est lui qui connaît le disque. Si le programme principal se met à découper des points-virgules, la frontière est franchie et le format se retrouvera bientôt décrit à trois endroits.",
        "Le plan : la classe avec ses quatre propriétés, sa validation, sa méthode de reconstruction sans objet et sa méthode de sérialisation ; puis le programme — test d'existence et écriture éventuelle, relecture, affichage, statistiques, temps par bénévole en deux boucles imbriquées, ajout, clôture dans un second fichier, relecture, affiche par flux.",
        "Lance le programme deux fois de suite. La première fois, il annonce un premier lancement et crée le registre ; la seconde, il annonce qu'il repart de la séance précédente — et affiche exactement les mêmes chiffres, puisque la clôture va dans un autre fichier. Ces deux exécutions sont la démonstration la plus claire de ce qu'apporte la persistance.",
        "Le point dur est le temps par bénévole. Tu n'as pas encore de structure pour associer un nom à un total : tu dois donc d'abord construire la liste des noms distincts — en n'ajoutant un nom que s'il n'y est pas déjà —, puis, pour chaque nom, reparcourir tout l'atelier. Écris-le sans chercher à faire mieux : la lourdeur de ce passage est voulue, et c'est elle qui donnera son sens à la leçon de demain.",
        "Ton fichier ressemble à ceci :<br><code>class Reparation</code><br><code>{</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public static Reparation DepuisLigne(string ligne)</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;{</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;string[] champs = ligne.Split(…);</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;return new Reparation(champs[0], …, int.Parse(champs[3]));</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;}</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public string EnLigne() { return $\"{Code};…\"; }</code><br><code>}</code><br><code>if (!File.Exists(…)) { …; File.WriteAllLines(…, seance); }</code><br><code>else { … }</code><br><code>atelier.Add(Reparation.DepuisLigne(…));</code><br><code>if (!benevoles.Contains(r.…)) { benevoles.Add(…); }</code><br><code>foreach (string nom in …) { foreach (Reparation r in …) { … } }</code><br><code>Console.WriteLine($\"… {minutesTotal / 60} h {minutesTotal % 60} min\");</code>"
      ],
      "solution": "// Le repair café, jour 1 : le registre survit enfin à la fermeture du programme.\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        const string REGISTRE = \"repaircafe.csv\";\n        const string CLOTURE = \"repaircafe-cloture.csv\";\n        const string AFFICHE = \"seance.txt\";\n\n        // Le cycle commence ici : le fichier existe-t-il déjà, ou est-ce le premier lancement ?\n        if (!File.Exists(REGISTRE))\n        {\n            Console.WriteLine(\"Registre introuvable : premier lancement, on l'écrit\");\n            List<string> seance = new List<string>();\n            seance.Add(\"R-01;grille-pain;Ilse;35\");\n            seance.Add(\"R-02;vélo;Bruno;70\");\n            seance.Add(\"R-03;lampe;Ilse;20\");\n            seance.Add(\"R-04;machine à café;Nadia;95\");\n            seance.Add(\"R-05;vélo;Nadia;55\");\n            seance.Add(\"R-06;radio;Bruno;40\");\n            seance.Add(\"R-07;grille-pain;Ilse;25\");\n            seance.Add(\"R-08;aspirateur;Bruno;80\");\n            File.WriteAllLines(REGISTRE, seance);\n        }\n        else\n        {\n            Console.WriteLine(\"Registre trouvé : on repart de la séance précédente\");\n        }\n\n        // Du disque vers la mémoire : les lignes redeviennent des objets.\n        List<Reparation> atelier = new List<Reparation>();\n        foreach (string ligne in File.ReadAllLines(REGISTRE))\n        {\n            if (ligne == \"\")\n            {\n                continue;\n            }\n            atelier.Add(Reparation.DepuisLigne(ligne));\n        }\n        Console.WriteLine($\"{atelier.Count} réparations chargées\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"LA SÉANCE\");\n        foreach (Reparation r in atelier)\n        {\n            Console.WriteLine(r);\n        }\n\n        Console.WriteLine();\n\n        int minutesTotal = 0;\n        Reparation plusLongue = atelier[0];\n        Reparation plusCourte = atelier[0];\n        foreach (Reparation r in atelier)\n        {\n            minutesTotal += r.DureeMinutes;\n            if (r.DureeMinutes > plusLongue.DureeMinutes)\n            {\n                plusLongue = r;\n            }\n            if (r.DureeMinutes < plusCourte.DureeMinutes)\n            {\n                plusCourte = r;\n            }\n        }\n        Console.WriteLine($\"Temps d'atelier : {minutesTotal} minutes \"\n                        + $\"({minutesTotal / 60} h {minutesTotal % 60} min)\");\n        Console.WriteLine($\"Durée moyenne : {minutesTotal / atelier.Count} minutes\");\n        Console.WriteLine($\"La plus longue : {plusLongue}\");\n        Console.WriteLine($\"La plus courte : {plusCourte}\");\n\n        Console.WriteLine();\n\n        // Compter par bénévole SANS structure adaptée : deux boucles imbriquées, et une liste\n        // de noms distincts à tenir à la main. Cela fonctionne, et c'est déjà pénible.\n        Console.WriteLine(\"TEMPS PAR BÉNÉVOLE\");\n        List<string> benevoles = new List<string>();\n        foreach (Reparation r in atelier)\n        {\n            if (!benevoles.Contains(r.Benevole))\n            {\n                benevoles.Add(r.Benevole);\n            }\n        }\n\n        foreach (string nom in benevoles)\n        {\n            int minutes = 0;\n            int nombre = 0;\n            foreach (Reparation r in atelier)          // on reparcourt TOUT l'atelier par bénévole\n            {\n                if (r.Benevole == nom)\n                {\n                    minutes += r.DureeMinutes;\n                    nombre++;\n                }\n            }\n            Console.WriteLine($\"{nom} : {nombre} réparations, {minutes} minutes\");\n        }\n        Console.WriteLine($\"Bénévoles présents : {benevoles.Count}\");\n\n        Console.WriteLine();\n\n        // La vie du programme se passe en mémoire.\n        atelier.Add(new Reparation(\"R-09\", \"bouilloire\", \"Nadia\", 45));\n        int minutesFinal = 0;\n        foreach (Reparation r in atelier)\n        {\n            minutesFinal += r.DureeMinutes;\n        }\n        Console.WriteLine($\"Après la réparation de dernière minute : {atelier.Count} fiches, \"\n                        + $\"{minutesFinal} minutes\");\n        Console.WriteLine($\"Nouvelle durée moyenne : {minutesFinal / atelier.Count} minutes\");\n\n        Console.WriteLine();\n\n        // Clôture : la liste redevient un fichier — un AUTRE fichier, pour ne pas gonfler la source.\n        List<string> aEcrire = new List<string>();\n        foreach (Reparation r in atelier)\n        {\n            aEcrire.Add(r.EnLigne());\n        }\n        File.WriteAllLines(CLOTURE, aEcrire);\n        string[] relues = File.ReadAllLines(CLOTURE);\n        Console.WriteLine($\"{relues.Length} lignes écrites puis relues dans {CLOTURE}\");\n        Console.WriteLine($\"Dernière ligne : {relues[relues.Length - 1]}\");\n\n        Console.WriteLine();\n\n        using (StreamWriter ecrivain = new StreamWriter(AFFICHE))\n        {\n            ecrivain.WriteLine(\"REPAIR CAFÉ — AFFICHE DE SORTIE\");\n            ecrivain.WriteLine($\"Objets pris en charge : {atelier.Count}\");\n            ecrivain.WriteLine($\"Temps d'atelier : {minutesFinal} minutes\");\n            ecrivain.WriteLine($\"Bénévoles : {benevoles.Count}\");\n        }\n\n        Console.WriteLine($\"RELECTURE DE {AFFICHE}\");\n        using (StreamReader lecteur = new StreamReader(AFFICHE))\n        {\n            string ligne;\n            while ((ligne = lecteur.ReadLine()) != null)\n            {\n                Console.WriteLine($\"  {ligne}\");\n            }\n        }\n    }\n}\n\nclass Reparation\n{\n    public string Code { get; private set; }\n    public string Objet { get; private set; }\n    public string Benevole { get; private set; }\n    public int DureeMinutes { get; private set; }\n\n    public Reparation(string code, string objet, string benevole, int dureeMinutes)\n    {\n        if (dureeMinutes <= 0)\n        {\n            throw new ArgumentException($\"{code} : durée de {dureeMinutes} minutes impossible\");\n        }\n        this.Code = code;\n        this.Objet = objet;\n        this.Benevole = benevole;\n        this.DureeMinutes = dureeMinutes;\n    }\n\n    // Le format du fichier est décrit à deux endroits, et à deux endroits seulement.\n    public static Reparation DepuisLigne(string ligne)\n    {\n        string[] champs = ligne.Split(';');\n        if (champs.Length != 4)\n        {\n            throw new ArgumentException($\"« {ligne} » : quatre champs attendus\");\n        }\n        return new Reparation(champs[0], champs[1], champs[2], int.Parse(champs[3]));\n    }\n\n    public string EnLigne()\n    {\n        return $\"{Code};{Objet};{Benevole};{DureeMinutes}\";\n    }\n\n    public override string ToString()\n    {\n        return $\"{Code} — {Objet} — {Benevole} — {DureeMinutes} min\";\n    }\n}",
      "pourquoi": "Depuis la leçon 12, tes objets naissaient dans le code et mouraient à la fin du programme. Ici, ils naissent d'un fichier et y retournent : les données ont cessé d'appartenir au programme. C'est ce changement de propriétaire qui permettra, jeudi, de rejouer une séance entière sans toucher une ligne de code.",
      "checklist": [
        "Le temps d'atelier vaut-il 420 minutes, soit 7 h 0 min, pour une moyenne de 52 minutes ?",
        "Ilse totalise-t-elle 80 minutes, Bruno 190 et Nadia 150 ? La somme doit faire 420.",
        "Après l'ajout, obtiens-tu 9 fiches, 465 minutes et une moyenne de 51 minutes ?",
        "Lance le programme deux fois : le second lancement annonce-t-il bien qu'il repart de la séance précédente ?",
        "Ton fichier de clôture compte-t-il 9 lignes aux deux lancements, et non 18 au second ?"
      ],
      "note": "Jour 1 sur 4. Le registre existe, il survit, et il se relit — mais chaque question posée à l'atelier coûte un parcours complet. Demain, la même séance répondra en une ligne, et tu compareras les deux versions côte à côte."
    }
  ]
};

                           // fin du catch\n    }                                            // fin de Main\n}                                                // fin de la classe",
