var DAY = {
  num: 21,
  title: "LINQ en profondeur",
  subtitle: "Interroger une collection comme une base de données, en une ligne fluide.",
  theory: `
<h3>1. Qu'est-ce que LINQ ?</h3>
<p><strong>LINQ</strong> (Language Integrated Query, « requête intégrée au langage ») est une boîte à outils pour <em>interroger</em> une collection : filtrer, trier, transformer, regrouper. C'est comme poser une question en français à ta liste de tâches — « donne-moi les tâches urgentes, triées par date » — au lieu d'écrire une boucle <code>for</code> à la main.</p>
<p>LINQ s'utilise sous forme de <strong>méthodes chaînées</strong> (method chaining) : chaque opération renvoie une nouvelle séquence, sur laquelle on enchaîne la suivante, comme un tapis roulant d'usine où chaque poste filtre ou transforme.</p>
<pre class="pseudo">using System.Linq;   // indispensable : ouvre l'accès aux méthodes LINQ (Where, Select…)</pre>

<h3>2. Filtrer : Where</h3>
<p>Thème gestionnaire de tâches.</p>
<pre class="pseudo">List&lt;int&gt; durees = new List&lt;int&gt; { 15, 90, 5, 60, 30 };  // durées en minutes
var longues = durees.Where(d =&gt; d &gt;= 60);                // Where garde les éléments où la condition est vraie
// d =&gt; d &gt;= 60 est une LAMBDA : « pour chaque d, renvoie d &gt;= 60 »
// longues contient maintenant 90 et 60</pre>
<div class="tip">Le <code>d =&gt;</code> est une <strong>lambda</strong> (fonction anonyme, jetable) : à gauche le paramètre, à droite le test. Lis <code>=&gt;</code> comme « donne » : « d donne d &gt;= 60 ».</div>

<h3>3. Transformer : Select</h3>
<pre class="pseudo">var noms = taches.Select(t =&gt; t.Titre);       // Select TRANSFORME chaque élément (projection)
// à partir d'une liste de Tache, on obtient une liste de string (leur titre)
var majuscules = noms.Select(n =&gt; n.ToUpper()); // on peut enchaîner : chaque nom en majuscules</pre>
<p><code>Where</code> décide <em>quels</em> éléments garder ; <code>Select</code> décide <em>en quoi</em> les transformer. On les combine très souvent.</p>

<h3>4. Trier : OrderBy / OrderByDescending</h3>
<pre class="pseudo">var triees = taches.OrderBy(t =&gt; t.Priorite);            // tri CROISSANT selon la priorité
var recentes = taches.OrderByDescending(t =&gt; t.Date);   // tri DÉCROISSANT selon la date
var fin = taches.OrderBy(t =&gt; t.Priorite).ThenBy(t =&gt; t.Titre); // ThenBy : critère secondaire</pre>

<h3>5. Agréger : Count, Sum, Average, Min, Max</h3>
<pre class="pseudo">int combien = taches.Count(t =&gt; !t.Faite);      // compte celles qui restent à faire
int total = durees.Sum();                        // somme de toutes les durées
double moyenne = durees.Average();               // moyenne
int plusLongue = durees.Max();                   // la plus grande valeur
bool auMoinsUne = taches.Any(t =&gt; t.Urgente);    // Any : « existe-t-il au moins une ? »
bool toutesFaites = taches.All(t =&gt; t.Faite);    // All : « sont-elles TOUTES faites ? »</pre>

<h3>6. Choisir un élément : First, FirstOrDefault, Single</h3>
<pre class="pseudo">var premiere = taches.First(t =&gt; t.Urgente);          // la 1re urgente — ERREUR si aucune !
var prem2 = taches.FirstOrDefault(t =&gt; t.Urgente);   // idem, mais renvoie null/0 si aucune (plus sûr)</pre>
<div class="warn"><code>First</code> lève une exception s'il ne trouve rien. Préfère <code>FirstOrDefault</code>, qui renvoie la valeur par défaut (null pour un objet, 0 pour un int) : plus prudent.</div>

<h3>7. Regrouper : GroupBy, et matérialiser : ToList</h3>
<pre class="pseudo">var parPriorite = taches.GroupBy(t =&gt; t.Priorite);   // fait des paquets par priorité
foreach (var groupe in parPriorite)                  // chaque groupe a une Key et ses éléments
    Console.WriteLine($"{groupe.Key} : {groupe.Count()} tâche(s)"); // Key = la priorité du groupe
List&lt;int&gt; res = durees.Where(d =&gt; d &lt; 30).ToList();  // ToList : fige le résultat dans une vraie List</pre>
<div class="tip"><strong>Exécution différée</strong> (deferred execution) : une requête LINQ ne calcule rien tant qu'on ne la parcourt pas (foreach, ToList, Count…). C'est une <em>recette</em> gardée au frais, cuisinée seulement au moment de servir. <code>ToList()</code> ou <code>ToArray()</code> force le calcul immédiat.</p></div>

<h3>8. Une requête complète, lisible d'un coup d'œil</h3>
<pre class="pseudo">var resultat = taches                     // point de départ : la collection
    .Where(t =&gt; !t.Faite)                 // 1) garder les non faites
    .OrderBy(t =&gt; t.Priorite)             // 2) trier par priorité
    .Select(t =&gt; t.Titre)                 // 3) ne garder que le titre
    .ToList();                            // 4) figer en List&lt;string&gt;</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie LINQ ?", opts: ["Liste indexée", "Language Integrated Query : interroger des collections", "Un tri rapide", "Une base de données"], a: 1, exp: "Requête intégrée au langage." },
    { type: "qcm", q: "Quel using faut-il pour LINQ ?", opts: ["using System;", "using System.Linq;", "using System.IO;", "aucun"], a: 1, exp: "System.Linq ouvre Where, Select, etc." },
    { type: "qcm", q: "<code>Where(d =&gt; d &gt;= 60)</code> fait…", opts: ["Transforme chaque d", "FILTRE : garde les éléments où la condition est vraie", "Trie", "Compte"], a: 1, exp: "Where = filtre." },
    { type: "qcm", q: "<code>Select(t =&gt; t.Titre)</code> fait…", opts: ["Filtre les titres", "TRANSFORME chaque élément (projection) : ici en son titre", "Trie par titre", "Supprime les titres"], a: 1, exp: "Select = projection/transformation." },
    { type: "qcm", q: "Dans <code>t =&gt; t.Faite</code>, le symbole <code>=&gt;</code> introduit…", opts: ["Une comparaison", "Une lambda (fonction anonyme) : paramètre à gauche, résultat à droite", "Une affectation", "Une boucle"], a: 1, exp: "Lambda : 'pour chaque t, renvoie t.Faite'." },
    { type: "qcm", q: "Trier par priorité DÉCROISSANTE :", opts: ["OrderBy(t => t.Priorite)", "OrderByDescending(t => t.Priorite)", "Sort()", "Reverse()"], a: 1, exp: "OrderByDescending pour l'ordre inverse." },
    { type: "qcm", q: "<code>ThenBy</code> sert à…", opts: ["Trier une 2e fois de zéro", "Ajouter un critère de tri SECONDAIRE (départage les ex æquo)", "Filtrer", "Compter"], a: 1, exp: "OrderBy(...).ThenBy(...) : tri à deux niveaux." },
    { type: "vf", q: "<code>Any(t =&gt; t.Urgente)</code> renvoie true s'il existe AU MOINS une tâche urgente.", a: true, exp: "Any = 'il en existe au moins une'." },
    { type: "qcm", q: "<code>All(t =&gt; t.Faite)</code> renvoie true si…", opts: ["Au moins une est faite", "TOUTES sont faites", "Aucune n'est faite", "La première est faite"], a: 1, exp: "All = 'toutes vérifient la condition'." },
    { type: "qcm", q: "Différence entre First et FirstOrDefault quand rien ne correspond :", opts: ["Aucune", "First LÈVE une exception ; FirstOrDefault renvoie la valeur par défaut (null/0)", "FirstOrDefault plante", "First renvoie 0"], a: 1, exp: "FirstOrDefault est plus sûr." },
    { type: "qcm", q: "<code>Count(t =&gt; !t.Faite)</code> renvoie…", opts: ["Toutes les tâches", "Le NOMBRE de tâches non faites", "La première non faite", "Un booléen"], a: 1, exp: "Count avec condition = combien vérifient le test." },
    { type: "qcm", q: "<code>GroupBy(t =&gt; t.Priorite)</code> produit…", opts: ["Une seule liste triée", "Des GROUPES, chacun ayant une Key (la priorité) et ses éléments", "Un nombre", "La priorité max"], a: 1, exp: "Regroupe par clé commune." },
    { type: "vf", q: "Une requête LINQ (Where/Select) est calculée seulement quand on la parcourt (exécution différée).", a: true, exp: "Rien n'est calculé avant foreach/ToList/Count." },
    { type: "qcm", q: "<code>ToList()</code> sert à…", opts: ["Trier", "MATÉRIALISER : figer le résultat de la requête dans une vraie List", "Filtrer", "Supprimer"], a: 1, exp: "Force le calcul immédiat et stocke le résultat." },
    { type: "qcm", q: "Enchaîner <code>.Where(...).OrderBy(...).Select(...)</code> s'appelle…", opts: ["Une récursion", "Du method chaining (méthodes chaînées) : chaque étape renvoie une séquence", "Une exception", "Un cast"], a: 1, exp: "Un tapis roulant : chaque poste passe au suivant." }
  ],
  final: {
    title: "Exercice final — Le tableau de bord des tâches en LINQ",
    intro: `<p>Une liste de tâches, chacune avec une durée (min), une priorité (1 haute…3 basse) et un état Faite. On veut le titre des tâches NON faites de priorité 1, triées par durée, et quelques statistiques.</p>
<pre class="pseudo">var aTraiter = taches                          // (1) départ
    .Where(t =&gt; !t.Faite && t.Priorite == 1)  //     filtre : non faite ET priorité 1
    .OrderBy(t =&gt; t.Duree)                     //     tri par durée croissante
    .Select(t =&gt; t.Titre)                      //     ne garder que le titre
    .ToList();                                 //     figer en List&lt;string&gt;

int restantes = taches.Count(t =&gt; !t.Faite);  // (2) combien reste-t-il à faire ?
double moy = taches.Average(t =&gt; t.Duree);    // (3) durée moyenne
bool tout = taches.All(t =&gt; t.Faite);         // (4) tout est-il terminé ?
var urgente = taches.FirstOrDefault(t =&gt; t.Priorite == 1 && !t.Faite); // (5)</pre>`,
    questions: [
      { type: "qcm", q: "(1) Que contient <code>aTraiter</code> ?", opts: ["Toutes les tâches", "Les TITRES des tâches non faites de priorité 1, triés par durée", "Les durées", "Un seul titre"], a: 1, exp: "Where filtre, OrderBy trie, Select projette le titre." },
      { type: "qcm", q: "(2) <code>Count(t =&gt; !t.Faite)</code> renvoie…", opts: ["Toutes les tâches", "Le nombre de tâches restant à faire", "Un booléen", "La 1re non faite"], a: 1, exp: "Count avec prédicat = combien vérifient." },
      { type: "qcm", q: "(3) <code>Average(t =&gt; t.Duree)</code> calcule…", opts: ["La durée totale", "La durée MOYENNE des tâches", "La durée max", "Le nombre de tâches"], a: 1, exp: "Average = moyenne du champ projeté." },
      { type: "vf", q: "(4) <code>All(t =&gt; t.Faite)</code> vaut false s'il reste ne serait-ce qu'une tâche non faite.", a: true, exp: "All exige que TOUTES vérifient la condition." },
      { type: "qcm", q: "(5) Si aucune tâche de priorité 1 non faite n'existe, <code>urgente</code> vaut…", opts: ["Une exception", "null : FirstOrDefault renvoie la valeur par défaut, sans planter", "La première tâche", "0"], a: 1, exp: "FirstOrDefault protège contre l'absence de résultat." }
    ],
    solution: `<pre class="pseudo">Where(!Faite && Priorite==1) → garde les urgentes ouvertes  // filtre à deux conditions
OrderBy(Duree)               → de la plus courte à la plus longue
Select(Titre)                → ne conserve que le libellé
ToList()                     → List&lt;string&gt; prête à afficher
Count(!Faite) → nombre restant · Average(Duree) → moyenne
All(Faite)    → false s'il reste du travail
FirstOrDefault → null si rien, jamais d'exception</pre>
<p>Une boucle for de 15 lignes tient en une requête lisible. LINQ, c'est du SQL directement dans le C#. Prochaine leçon : ce qui se cache derrière les lambdas — delegates et events.</p>`
  }
};

var ECRITURE = {
  placeholder: "Écris ton code C# ici…",

  { id: "cs-linq-avance", title: "Le top des scores en LINQ", level: 2,
    statement: "À partir d'une <code>List&lt;int&gt;</code> de scores, affiche avec LINQ : le nombre de scores &gt;= 50, la moyenne, et les 3 meilleurs triés du plus grand au plus petit. Utilise <code>Count</code>, <code>Average</code>, <code>OrderByDescending</code> et <code>Take</code>.",
    hints: [
      "N'oublie pas using System.Linq; en haut du fichier.",
      "Count(s => s >= 50) compte selon une condition ; Average() donne la moyenne.",
      "OrderByDescending(s => s).Take(3) prend les 3 premiers du tri décroissant."
    ],
    solution: "using System;                                        // Console\nusing System.Collections.Generic;                    // List\nusing System.Linq;                                   // méthodes LINQ (Count, Average, Take…)\n\nclass TopScores                                      // classe programme\n{                                                    // début\n    static void Main()                               // point d'entrée\n    {                                                // début de Main\n        List<int> scores = new List<int> { 42, 88, 60, 15, 95, 73 }; // les scores\n        int reussis = scores.Count(s => s >= 50);    // combien atteignent 50 ?\n        double moyenne = scores.Average();           // moyenne de tous les scores\n        var top3 = scores.OrderByDescending(s => s)  // tri du plus grand au plus petit\n                         .Take(3)                    // on garde les 3 premiers\n                         .ToList();                  // on fige le résultat\n        Console.WriteLine($\"Réussis (>=50) : {reussis}\"); // affiche le compte\n        Console.WriteLine($\"Moyenne : {moyenne:F1}\");     // affiche la moyenne à 1 décimale\n        Console.WriteLine(\"Top 3 : \" + string.Join(\", \", top3)); // joint les 3 scores\n    }                                                // fin de Main\n}                                                    // fin de la classe",
    note: "Take(n) prend les n premiers ; Skip(n) les saute. Combinés à OrderByDescending, ils font un classement en une ligne." }
  ]
};
