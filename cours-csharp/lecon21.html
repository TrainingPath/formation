var DAY = {
  num: 21,
  title: "LINQ en profondeur",
  subtitle: "Interroger une collection comme une base de données, en une ligne fluide.",
  theory: `
<h3>1. Qu'est-ce que LINQ ?</h3>
<p><strong>LINQ</strong> (Language Integrated Query, « requête intégrée au langage ») est une boîte à outils pour <em>interroger</em> une collection : filtrer, trier, transformer, regrouper. C'est comme poser une question en français à ta liste de tâches — « donne-moi les tâches urgentes, triées par date » — au lieu d'écrire une boucle <code>for</code> à la main.</p>
<p>LINQ s'utilise sous forme de <strong>méthodes chaînées</strong> (method chaining) : chaque opération renvoie une nouvelle séquence, sur laquelle on enchaîne la suivante, comme un tapis roulant d'usine où chaque poste filtre ou transforme.</p>
<pre class="pseudo">using System.Linq;   // indispensable : ouvre l'accès aux méthodes LINQ (Where, Select…)</pre>

<h3>2. Filtrer : Where</h3>
<p>Thème gestionnaire de tâches.</p>
<pre class="pseudo">List&lt;int&gt; durees = new List&lt;int&gt; { 15, 90, 5, 60, 30 };  // durées en minutes
var longues = durees.Where(d =&gt; d &gt;= 60);                // Where garde les éléments où la condition est vraie
// d =&gt; d &gt;= 60 est une LAMBDA : « pour chaque d, renvoie d &gt;= 60 »
// longues contient maintenant 90 et 60</pre>
<div class="tip">Le <code>d =&gt;</code> est une <strong>lambda</strong> (fonction anonyme, jetable) : à gauche le paramètre, à droite le test. Lis <code>=&gt;</code> comme « donne » : « d donne d &gt;= 60 ».</div>

<h3>3. Transformer : Select</h3>
<pre class="pseudo">var noms = taches.Select(t =&gt; t.Titre);       // Select TRANSFORME chaque élément (projection)
// à partir d'une liste de Tache, on obtient une liste de string (leur titre)
var majuscules = noms.Select(n =&gt; n.ToUpper()); // on peut enchaîner : chaque nom en majuscules</pre>
<p><code>Where</code> décide <em>quels</em> éléments garder ; <code>Select</code> décide <em>en quoi</em> les transformer. On les combine très souvent.</p>

<h3>4. Trier : OrderBy / OrderByDescending</h3>
<pre class="pseudo">var triees = taches.OrderBy(t =&gt; t.Priorite);            // tri CROISSANT selon la priorité
var recentes = taches.OrderByDescending(t =&gt; t.Date);   // tri DÉCROISSANT selon la date
var fin = taches.OrderBy(t =&gt; t.Priorite).ThenBy(t =&gt; t.Titre); // ThenBy : critère secondaire</pre>

<h3>5. Agréger : Count, Sum, Average, Min, Max</h3>
<pre class="pseudo">int combien = taches.Count(t =&gt; !t.Faite);      // compte celles qui restent à faire
int total = durees.Sum();                        // somme de toutes les durées
double moyenne = durees.Average();               // moyenne
int plusLongue = durees.Max();                   // la plus grande valeur
bool auMoinsUne = taches.Any(t =&gt; t.Urgente);    // Any : « existe-t-il au moins une ? »
bool toutesFaites = taches.All(t =&gt; t.Faite);    // All : « sont-elles TOUTES faites ? »</pre>

<h3>6. Choisir un élément : First, FirstOrDefault, Single</h3>
<pre class="pseudo">var premiere = taches.First(t =&gt; t.Urgente);          // la 1re urgente — ERREUR si aucune !
var prem2 = taches.FirstOrDefault(t =&gt; t.Urgente);   // idem, mais renvoie null/0 si aucune (plus sûr)</pre>
<div class="warn"><code>First</code> lève une exception s'il ne trouve rien. Préfère <code>FirstOrDefault</code>, qui renvoie la valeur par défaut (null pour un objet, 0 pour un int) : plus prudent.</div>

<h3>7. Regrouper : GroupBy, et matérialiser : ToList</h3>
<pre class="pseudo">var parPriorite = taches.GroupBy(t =&gt; t.Priorite);   // fait des paquets par priorité
foreach (var groupe in parPriorite)                  // chaque groupe a une Key et ses éléments
    Console.WriteLine($"{groupe.Key} : {groupe.Count()} tâche(s)"); // Key = la priorité du groupe
List&lt;int&gt; res = durees.Where(d =&gt; d &lt; 30).ToList();  // ToList : fige le résultat dans une vraie List</pre>
<div class="tip"><strong>Exécution différée</strong> (deferred execution) : une requête LINQ ne calcule rien tant qu'on ne la parcourt pas (foreach, ToList, Count…). C'est une <em>recette</em> gardée au frais, cuisinée seulement au moment de servir. <code>ToList()</code> ou <code>ToArray()</code> force le calcul immédiat.</p></div>

<h3>8. Une requête complète, lisible d'un coup d'œil</h3>
<pre class="pseudo">var resultat = taches                     // point de départ : la collection
    .Where(t =&gt; !t.Faite)                 // 1) garder les non faites
    .OrderBy(t =&gt; t.Priorite)             // 2) trier par priorité
    .Select(t =&gt; t.Titre)                 // 3) ne garder que le titre
    .ToList();                            // 4) figer en List&lt;string&gt;</pre>`,
  exercises: [
    { type: "qcm", q: "Que signifie LINQ ?", opts: ["Une structure de liste indexée en mémoire", "Language Integrated Query : interroger des collections", "Un algorithme de tri rapide intégré", "Un moteur de base de données embarqué"], a: 1, exp: "Requête intégrée au langage." },
    { type: "qcm", q: "Quel using faut-il pour LINQ ?", opts: ["using System;", "using System.Linq;", "using System.IO;", "using System.Data;"], a: 1, exp: "System.Linq ouvre Where, Select, etc." },
    { type: "qcm", q: "<code>Where(d =&gt; d &gt;= 60)</code> fait…", opts: ["Transforme chaque d en une autre valeur", "FILTRE : garde les éléments où la condition est vraie", "Trie les éléments par ordre croissant", "Compte le nombre d'éléments"], a: 1, exp: "Where = filtre." },
    { type: "qcm", q: "<code>Select(t =&gt; t.Titre)</code> fait…", opts: ["Filtre les titres", "TRANSFORME chaque élément (projection) : ici en son titre", "Trie par titre", "Supprime les titres"], a: 1, exp: "Select = projection/transformation." },
    { type: "qcm", q: "Dans <code>t =&gt; t.Faite</code>, le symbole <code>=&gt;</code> introduit…", opts: ["Une comparaison entre deux valeurs", "Une lambda (fonction anonyme) : paramètre à gauche, résultat à droite", "Une affectation de valeur à une variable", "Une structure de boucle sur les éléments"], a: 1, exp: "Lambda : 'pour chaque t, renvoie t.Faite'." },
    { type: "qcm", q: "Trier par priorité DÉCROISSANTE :", opts: ["OrderBy(t => t.Priorite)", "OrderByDescending(t => t.Priorite)", "Sort()", "Reverse()"], a: 1, exp: "OrderByDescending pour l'ordre inverse." },
    { type: "qcm", q: "<code>ThenBy</code> sert à…", opts: ["Trier une 2e fois en repartant de zéro", "Ajouter un critère de tri SECONDAIRE (départage les ex æquo)", "Filtrer les éléments déjà triés", "Compter les éléments triés"], a: 1, exp: "OrderBy(...).ThenBy(...) : tri à deux niveaux." },
    { type: "vf", q: "<code>Any(t =&gt; t.Urgente)</code> renvoie true s'il existe AU MOINS une tâche urgente.", a: true, exp: "Any = 'il en existe au moins une'." },
    { type: "qcm", q: "<code>All(t =&gt; t.Faite)</code> renvoie true si…", opts: ["Au moins une est faite", "TOUTES sont faites", "Aucune n'est faite", "La première est faite"], a: 1, exp: "All = 'toutes vérifient la condition'." },
    { type: "qcm", q: "Différence entre First et FirstOrDefault quand rien ne correspond :", opts: ["Aucune : les deux se comportent exactement pareil", "First LÈVE une exception ; FirstOrDefault renvoie la valeur par défaut (null/0)", "FirstOrDefault lève une exception, pas First", "First renvoie 0 quand rien ne correspond"], a: 1, exp: "FirstOrDefault est plus sûr." },
    { type: "qcm", q: "<code>Count(t =&gt; !t.Faite)</code> renvoie…", opts: ["Toutes les tâches non faites, dans une liste", "Le NOMBRE de tâches non faites", "La première tâche non faite trouvée", "Un booléen indiquant s'il en reste"], a: 1, exp: "Count avec condition = combien vérifient le test." },
    { type: "qcm", q: "<code>GroupBy(t =&gt; t.Priorite)</code> produit…", opts: ["Une seule liste entièrement triée", "Des GROUPES, chacun ayant une Key (la priorité) et ses éléments", "Le nombre total d'éléments", "La priorité la plus élevée"], a: 1, exp: "Regroupe par clé commune." },
    { type: "vf", q: "Une requête LINQ (Where/Select) est calculée seulement quand on la parcourt (exécution différée).", a: true, exp: "Rien n'est calculé avant foreach/ToList/Count." },
    { type: "qcm", q: "<code>ToList()</code> sert à…", opts: ["Trier les éléments du résultat", "MATÉRIALISER : figer le résultat de la requête dans une vraie List", "Filtrer les éléments de la requête", "Supprimer les doublons du résultat"], a: 1, exp: "Force le calcul immédiat et stocke le résultat." },
    { type: "qcm", q: "Enchaîner <code>.Where(...).OrderBy(...).Select(...)</code> s'appelle…", opts: ["Un appel récursif de méthodes", "Du method chaining (méthodes chaînées) : chaque étape renvoie une séquence", "Une gestion d'exceptions en cascade", "Une conversion de type en chaîne"], a: 1, exp: "Un tapis roulant : chaque poste passe au suivant." }
  ],
  final: {
    title: "Exercice final — Le tableau de bord des tâches en LINQ",
    intro: `<p>Une liste de tâches, chacune avec une durée (min), une priorité (1 haute…3 basse) et un état Faite. On veut le titre des tâches NON faites de priorité 1, triées par durée, et quelques statistiques.</p>
<pre class="pseudo">var aTraiter = taches                          // (1) départ
    .Where(t =&gt; !t.Faite && t.Priorite == 1)  //     filtre : non faite ET priorité 1
    .OrderBy(t =&gt; t.Duree)                     //     tri par durée croissante
    .Select(t =&gt; t.Titre)                      //     ne garder que le titre
    .ToList();                                 //     figer en List&lt;string&gt;

int restantes = taches.Count(t =&gt; !t.Faite);  // (2) combien reste-t-il à faire ?
double moy = taches.Average(t =&gt; t.Duree);    // (3) durée moyenne
bool tout = taches.All(t =&gt; t.Faite);         // (4) tout est-il terminé ?
var urgente = taches.FirstOrDefault(t =&gt; t.Priorite == 1 && !t.Faite); // (5)</pre>`,
    questions: [
      { type: "qcm", q: "(1) Que contient <code>aTraiter</code> ?", opts: ["Toutes les tâches, sans aucun filtre", "Les TITRES des tâches non faites de priorité 1, triés par durée", "Les durées des tâches filtrées", "Le titre de la première tâche"], a: 1, exp: "Where filtre, OrderBy trie, Select projette le titre." },
      { type: "qcm", q: "(2) <code>Count(t =&gt; !t.Faite)</code> renvoie…", opts: ["Toutes les tâches encore à faire", "Le nombre de tâches restant à faire", "Un booléen s'il reste des tâches", "La 1re tâche non faite"], a: 1, exp: "Count avec prédicat = combien vérifient." },
      { type: "qcm", q: "(3) <code>Average(t =&gt; t.Duree)</code> calcule…", opts: ["La durée totale", "La durée MOYENNE des tâches", "La durée max", "Le nombre de tâches"], a: 1, exp: "Average = moyenne du champ projeté." },
      { type: "vf", q: "(4) <code>All(t =&gt; t.Faite)</code> vaut false s'il reste ne serait-ce qu'une tâche non faite.", a: true, exp: "All exige que TOUTES vérifient la condition." },
      { type: "qcm", q: "(5) Si aucune tâche de priorité 1 non faite n'existe, <code>urgente</code> vaut…", opts: ["Une exception de type InvalidOperationException", "null : FirstOrDefault renvoie la valeur par défaut, sans planter", "La première tâche de la liste", "0, la valeur par défaut d'un entier"], a: 1, exp: "FirstOrDefault protège contre l'absence de résultat." }
    ],
    solution: `<pre class="pseudo">Where(!Faite && Priorite==1) → garde les urgentes ouvertes  // filtre à deux conditions
OrderBy(Duree)               → de la plus courte à la plus longue
Select(Titre)                → ne conserve que le libellé
ToList()                     → List&lt;string&gt; prête à afficher
Count(!Faite) → nombre restant · Average(Duree) → moyenne
All(Faite)    → false s'il reste du travail
FirstOrDefault → null si rien, jamais d'exception</pre>
<p>Une boucle for de 15 lignes tient en une requête lisible. LINQ, c'est du SQL directement dans le C#. Prochaine leçon : ce qui se cache derrière les lambdas — delegates et events.</p>`
  }
};

      "principe": "Une requête décrit le résultat voulu au lieu de la boucle qui l'obtient. Filtrer, transformer, trier, regrouper, agréger : cinq verbes qui se chaînent, et qui se lisent dans l'ordre où on les a pensés.",

      "solution": "// Le refuge pour animaux : dix pensionnaires, et des questions posées en une ligne chacune.\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        List<Pensionnaire> refuge = new List<Pensionnaire>();\n        refuge.Add(new Pensionnaire(\"Mistral\", \"chien\", 36, 24000, false));\n        refuge.Add(new Pensionnaire(\"Praline\", \"chat\", 18, 4200, true));\n        refuge.Add(new Pensionnaire(\"Gaspard\", \"chien\", 96, 31000, false));\n        refuge.Add(new Pensionnaire(\"Nougat\", \"chat\", 6, 2100, false));\n        refuge.Add(new Pensionnaire(\"Bandit\", \"chien\", 12, 15500, true));\n        refuge.Add(new Pensionnaire(\"Olive\", \"chat\", 48, 5300, false));\n        refuge.Add(new Pensionnaire(\"Tempête\", \"chien\", 24, 27000, false));\n        refuge.Add(new Pensionnaire(\"Filou\", \"lapin\", 10, 1800, true));\n        refuge.Add(new Pensionnaire(\"Zazie\", \"chat\", 30, 4800, false));\n        refuge.Add(new Pensionnaire(\"Rocco\", \"chien\", 60, 33000, false));\n\n        Console.WriteLine($\"Pensionnaires : {refuge.Count}\");\n\n        Console.WriteLine();\n\n        // FILTRER : Where garde ce qui vérifie la condition.\n        Console.WriteLine(\"ENCORE À ADOPTER\");\n        foreach (Pensionnaire p in refuge.Where(x => !x.Adopte))\n        {\n            Console.WriteLine($\"  {p}\");\n        }\n        Console.WriteLine($\"À adopter : {refuge.Count(x => !x.Adopte)} · \"\n                        + $\"déjà partis : {refuge.Count(x => x.Adopte)}\");\n\n        Console.WriteLine();\n\n        // TRANSFORMER : Select change chaque élément en autre chose.\n        Console.WriteLine(\"LES NOMS DES CHIENS, EN MAJUSCULES\");\n        foreach (string nom in refuge.Where(x => x.Espece == \"chien\").Select(x => x.Nom.ToUpper()))\n        {\n            Console.WriteLine($\"  {nom}\");\n        }\n\n        Console.WriteLine();\n\n        // TRIER : OrderBy, puis ThenBy pour départager les ex aequo.\n        Console.WriteLine(\"DU PLUS JEUNE AU PLUS VIEUX\");\n        foreach (Pensionnaire p in refuge.OrderBy(x => x.AgeMois).ThenBy(x => x.Nom))\n        {\n            Console.WriteLine($\"  {p.Nom} — {p.AgeMois} mois\");\n        }\n\n        Console.WriteLine();\n\n        // AGRÉGER : une méthode, une réponse.\n        Console.WriteLine(\"LE REFUGE EN CHIFFRES\");\n        Console.WriteLine($\"Poids total : {refuge.Sum(x => x.PoidsGrammes) / 1000.0:F2} kg\");\n        Console.WriteLine($\"Âge moyen : {refuge.Average(x => x.AgeMois):F2} mois\");\n        Console.WriteLine($\"Le plus jeune : {refuge.Min(x => x.AgeMois)} mois\");\n        Console.WriteLine($\"Le plus vieux : {refuge.Max(x => x.AgeMois)} mois\");\n        Console.WriteLine($\"Poids moyen des chiens : \"\n                        + $\"{refuge.Where(x => x.Espece == \"chien\").Average(x => x.PoidsGrammes):F2} g\");\n\n        Console.WriteLine();\n\n        // EXISTE-T-IL / TOUS : deux questions à réponse booléenne.\n        Console.WriteLine($\"Un lapin au refuge ? {refuge.Any(x => x.Espece == \"lapin\")}\");\n        Console.WriteLine($\"Un furet au refuge ? {refuge.Any(x => x.Espece == \"furet\")}\");\n        Console.WriteLine($\"Tous pèsent plus d'un kilo ? {refuge.All(x => x.PoidsGrammes > 1000)}\");\n        Console.WriteLine($\"Tous ont moins de cinq ans ? {refuge.All(x => x.AgeMois < 60)}\");\n\n        Console.WriteLine();\n\n        // CHOISIR UN ÉLÉMENT : First lance si rien ne convient, FirstOrDefault non.\n        Console.WriteLine($\"Premier chat de la liste : {refuge.First(x => x.Espece == \"chat\").Nom}\");\n        Pensionnaire furet = refuge.FirstOrDefault(x => x.Espece == \"furet\");\n        if (furet == null)\n        {\n            Console.WriteLine(\"Aucun furet : la recherche prudente rend la référence vide\");\n        }\n\n        try\n        {\n            Pensionnaire impossible = refuge.First(x => x.Espece == \"furet\");\n            Console.WriteLine(impossible.Nom);\n        }\n        catch (InvalidOperationException)\n        {\n            Console.WriteLine(\"La recherche stricte, elle, lance quand elle ne trouve rien\");\n        }\n\n        Console.WriteLine();\n\n        // REGROUPER : chaque groupe a une clé et ses éléments.\n        Console.WriteLine(\"PAR ESPÈCE\");\n        foreach (var groupe in refuge.GroupBy(x => x.Espece).OrderBy(g => g.Key))\n        {\n            Console.WriteLine($\"  {groupe.Key} : {groupe.Count()} pensionnaire(s), \"\n                            + $\"{groupe.Sum(x => x.PoidsGrammes) / 1000.0:F2} kg\");\n        }\n\n        Console.WriteLine();\n\n        // EXÉCUTION DIFFÉRÉE : la requête n'est pas un résultat, c'est une recette.\n        Console.WriteLine(\"LA RECETTE ET LE PLAT\");\n        var recette = refuge.Where(x => x.Espece == \"chat\");        // rien n'est calculé ici\n        List<Pensionnaire> plat = refuge.Where(x => x.Espece == \"chat\").ToList();  // ici, si\n\n        refuge.Add(new Pensionnaire(\"Câline\", \"chat\", 15, 3900, false));\n\n        Console.WriteLine($\"La recette, parcourue après l'ajout : {recette.Count()} chats\");\n        Console.WriteLine($\"Le plat, figé avant l'ajout : {plat.Count} chats\");\n\n        Console.WriteLine();\n\n        // Une requête complète, lisible d'un trait.\n        Console.WriteLine(\"À PROPOSER EN PRIORITÉ : LES NON ADOPTÉS, DU PLUS ÂGÉ AU PLUS JEUNE\");\n        List<string> priorites = refuge\n            .Where(x => !x.Adopte)\n            .OrderByDescending(x => x.AgeMois)\n            .Select(x => $\"{x.Nom} ({x.Espece}, {x.AgeMois} mois)\")\n            .ToList();\n        foreach (string ligne in priorites)\n        {\n            Console.WriteLine($\"  {ligne}\");\n        }\n        Console.WriteLine($\"Total : {priorites.Count}\");\n    }\n}\n\nclass Pensionnaire\n{\n    public string Nom { get; private set; }\n    public string Espece { get; private set; }\n    public int AgeMois { get; private set; }\n    public int PoidsGrammes { get; private set; }\n    public bool Adopte { get; private set; }\n\n    public Pensionnaire(string nom, string espece, int ageMois, int poidsGrammes, bool adopte)\n    {\n        if (ageMois < 0 || poidsGrammes <= 0)\n        {\n            throw new ArgumentException($\"{nom} : âge ou poids impossible\");\n        }\n        this.Nom = nom;\n        this.Espece = espece;\n        this.AgeMois = ageMois;\n        this.PoidsGrammes = poidsGrammes;\n        this.Adopte = adopte;\n    }\n\n    public override string ToString()\n    {\n        return $\"{Nom} — {Espece} — {AgeMois} mois — {PoidsGrammes} g\";\n    }\n}",

      "enonce": "Un tournoi de cinq rondes réunit douze joueurs. Écris d'abord la feuille dans un fichier, une ligne par joueur au format nom;club;Elo;demi-points : Vandereet Lore;Cavalier;2145;9, Dupuis Karim;Tour Noire;2010;8, Mertens Silke;Cavalier;1890;7, Bogaert Tim;Échiquier;2210;7, Nguyen Mai;Tour Noire;1755;6, Fontaine Léo;Cavalier;1620;5, Ahmadi Reza;Échiquier;1980;5, Claes Wout;Tour Noire;1490;4, Perrin Elsa;Échiquier;1830;4, Rahmani Yasmin;Cavalier;1710;3, De Smet Jonas;Tour Noire;1555;2, Kabongo Divine;Échiquier;1925;0. Le score est compté en <strong>demi-points entiers</strong> : 9 se lit « 4,5 point ». Écris une classe de joueur refusant un Elo ou un score négatif, dont l'affichage rend le score en points à une décimale. Relis le fichier et reconstruis les joueurs. Vérifie ensuite la cohérence de la feuille : douze joueurs sur cinq rondes font trente parties, et chaque partie distribue deux demi-points — affiche le total, le nombre de parties et le verdict. Affiche le classement <strong>trié sur deux critères</strong> , les points d'abord et l'Elo pour départager, avec un rang numéroté. Regroupe par club en donnant l'effectif, l'Elo moyen à deux décimales et le total de points. Donne encore l'Elo moyen du tournoi, le nombre de joueurs à 1900 Elo ou plus, l'existence d'un joueur sans le moindre point, et si tous ont marqué. Trouve le mieux classé de la Tour Noire. Cherche un joueur d'un club inexistant <strong>de deux façons</strong>, la stricte étant rattrapée. Montre ensuite la différence entre une requête gardée et une requête figée en inscrivant tardivement Tavares Rui;Cavalier;2050;0. Termine en écrivant dans un fichier, par une requête complète, les seuls joueurs ayant marqué, triés par points décroissants puis par nom.",

      "solution": "// Le tournoi d'échecs : douze joueurs, cinq rondes, et un classement décrit plutôt que calculé.\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Linq;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        const string SOURCE = \"tournoi.csv\";\n        const string CLASSEMENT = \"classement.txt\";\n\n        string[] brut =\n        {\n            \"Vandereet Lore;Cavalier;2145;9\",\n            \"Dupuis Karim;Tour Noire;2010;8\",\n            \"Mertens Silke;Cavalier;1890;7\",\n            \"Bogaert Tim;Échiquier;2210;7\",\n            \"Nguyen Mai;Tour Noire;1755;6\",\n            \"Fontaine Léo;Cavalier;1620;5\",\n            \"Ahmadi Reza;Échiquier;1980;5\",\n            \"Claes Wout;Tour Noire;1490;4\",\n            \"Perrin Elsa;Échiquier;1830;4\",\n            \"Rahmani Yasmin;Cavalier;1710;3\",\n            \"De Smet Jonas;Tour Noire;1555;2\",\n            \"Kabongo Divine;Échiquier;1925;0\"\n        };\n        File.WriteAllLines(SOURCE, brut);\n\n        if (!File.Exists(SOURCE))\n        {\n            Console.WriteLine(\"Feuille de tournoi introuvable\");\n            return;\n        }\n\n        List<Joueur> tournoi = new List<Joueur>();\n        foreach (string ligne in File.ReadAllLines(SOURCE))\n        {\n            if (ligne == \"\")\n            {\n                continue;\n            }\n            string[] champs = ligne.Split(';');\n            tournoi.Add(new Joueur(champs[0], champs[1], int.Parse(champs[2]),\n                                   int.Parse(champs[3])));\n        }\n        Console.WriteLine($\"Joueurs inscrits : {tournoi.Count}\");\n\n        Console.WriteLine();\n\n        // Contrôle de cohérence : cinq rondes à douze joueurs font trente parties,\n        // et chaque partie distribue deux demi-points.\n        int demiPoints = tournoi.Sum(j => j.PointsDemi);\n        Console.WriteLine($\"Demi-points distribués : {demiPoints}\");\n        Console.WriteLine($\"Parties jouées : {demiPoints / 2}\");\n        Console.WriteLine($\"Feuille cohérente : {demiPoints == 60}\");\n\n        Console.WriteLine();\n\n        // Trier sur deux critères : les points d'abord, l'Elo pour départager.\n        Console.WriteLine(\"CLASSEMENT FINAL\");\n        int rang = 1;\n        foreach (Joueur j in tournoi.OrderByDescending(x => x.PointsDemi)\n                                    .ThenByDescending(x => x.Elo))\n        {\n            Console.WriteLine($\"{rang}. {j}\");\n            rang++;\n        }\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"PAR CLUB\");\n        foreach (var club in tournoi.GroupBy(j => j.Club).OrderBy(g => g.Key))\n        {\n            Console.WriteLine($\"{club.Key} : {club.Count()} joueurs, \"\n                            + $\"Elo moyen {club.Average(j => j.Elo):F2}, \"\n                            + $\"{club.Sum(j => j.PointsDemi)} demi-points \"\n                            + $\"({club.Sum(j => j.PointsDemi) / 2.0:F1} pt)\");\n        }\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"QUELQUES QUESTIONS\");\n        Console.WriteLine($\"Elo moyen du tournoi : {tournoi.Average(j => j.Elo):F2}\");\n        Console.WriteLine($\"Joueurs à 1900 Elo ou plus : {tournoi.Count(j => j.Elo >= 1900)}\");\n        Console.WriteLine($\"Un joueur sans le moindre point ? {tournoi.Any(j => j.PointsDemi == 0)}\");\n        Console.WriteLine($\"Tous ont-ils marqué ? {tournoi.All(j => j.PointsDemi > 0)}\");\n        Joueur meilleurTourNoire = tournoi.Where(j => j.Club == \"Tour Noire\")\n                                          .OrderByDescending(j => j.PointsDemi)\n                                          .First();\n        Console.WriteLine($\"Le mieux classé du club Tour Noire : {meilleurTourNoire.Nom}\");\n\n        Joueur absent = tournoi.FirstOrDefault(j => j.Club == \"Fou Blanc\");\n        if (absent == null)\n        {\n            Console.WriteLine(\"Aucun joueur du club Fou Blanc : recherche prudente, pas de \"\n                            + \"plantage\");\n        }\n\n        try\n        {\n            Joueur impossible = tournoi.First(j => j.Club == \"Fou Blanc\");\n            Console.WriteLine(impossible.Nom);\n        }\n        catch (InvalidOperationException)\n        {\n            Console.WriteLine(\"La recherche stricte, elle, lance quand elle ne trouve rien\");\n        }\n\n        Console.WriteLine();\n\n        // L'exécution différée, montrée plutôt que racontée.\n        var forts = tournoi.Where(j => j.Elo >= 1900);        // une recette, pas un résultat\n        List<Joueur> figes = tournoi.Where(j => j.Elo >= 1900).ToList();   // un résultat, lui\n\n        tournoi.Add(new Joueur(\"Tavares Rui\", \"Cavalier\", 2050, 0));\n\n        Console.WriteLine($\"La recette, parcourue après l'inscription tardive : {forts.Count()}\");\n        Console.WriteLine($\"Le résultat figé avant l'inscription : {figes.Count}\");\n        Console.WriteLine($\"Effectif réel : {tournoi.Count}\");\n\n        Console.WriteLine();\n\n        // Une requête complète, puis un fichier écrit depuis elle.\n        List<string> lignes = tournoi\n            .Where(j => j.PointsDemi > 0)\n            .OrderByDescending(j => j.PointsDemi)\n            .ThenBy(j => j.Nom)\n            .Select(j => $\"{j.Nom};{j.Club};{j.PointsDemi}\")\n            .ToList();\n        File.WriteAllLines(CLASSEMENT, lignes);\n        Console.WriteLine($\"{File.ReadAllLines(CLASSEMENT).Length} lignes dans {CLASSEMENT}\");\n        Console.WriteLine($\"Première : {lignes[0]}\");\n        Console.WriteLine($\"Dernière : {lignes[lignes.Count - 1]}\");\n    }\n}\n\nclass Joueur\n{\n    public string Nom { get; private set; }\n    public string Club { get; private set; }\n    public int Elo { get; private set; }\n    public int PointsDemi { get; private set; }      // en DEMI-points : 9 se lit « 4,5 »\n\n    public Joueur(string nom, string club, int elo, int pointsDemi)\n    {\n        if (elo < 0 || pointsDemi < 0)\n        {\n            throw new ArgumentException($\"{nom} : Elo ou score impossible\");\n        }\n        this.Nom = nom;\n        this.Club = club;\n        this.Elo = elo;\n        this.PointsDemi = pointsDemi;\n    }\n\n    public override string ToString()\n    {\n        return $\"{Nom} ({Club}) — Elo {Elo} — {PointsDemi / 2.0:F1} pt\";\n    }\n}",

      "enonce": "Premier jour d'une série de quatre : le marché hebdomadaire d'une commune, qui va grandir jusqu'à vendredi. Écris une classe d'étal portant un code, un exposant, une catégorie, une surface en mètres carrés et un chiffre d'affaires en centimes, refusant une surface nulle ou un chiffre négatif, sachant redevenir une ligne et renaître d'une ligne. Au démarrage, teste l'existence de la feuille : si elle est absente, écris les douze étals — E-01;Verhoeven;maraîcher;12;48500, E-02;Lambert;fromager;6;31200, E-03;Ozturk;traiteur;9;52700, E-04;Nkosi;textile;15;19800, E-05;Dubois;maraîcher;10;41300, E-06;Petrov;boulanger;6;28900, E-07;Simon;fleuriste;4;15600, E-08;Haddad;traiteur;12;61400, E-09;Marchal;maraîcher;8;33500, E-10;Weber;fromager;5;22100, E-11;Lopes;textile;18;24300 et E-12;Bianchi;boulanger;7;35800. Relis-la dans tous les cas. Donne ensuite, <strong>chacun en une expression</strong> : le chiffre d'affaires total, la surface occupée, la redevance due à 250 centimes le mètre carré, le chiffre moyen par étal, le plus gros et le plus petit. Liste les étals au-dessus de 400 €, triés du plus gros au plus petit, et compte-les. Regroupe par catégorie avec l'effectif, le chiffre et la surface de chaque groupe, puis donne le nombre de catégories. Établis le classement du <strong>rendement au mètre carré</strong> — une donnée qui ne figure nulle part dans le fichier. Dis s'il y a un poissonnier et si tous les étals dépassent 150 €, cherche le poissonnier prudemment et le premier maraîcher strictement. Termine en écrivant un rapport dans un second fichier, trié par chiffre décroissant, portant le code, l'exposant, le chiffre et la redevance de chaque étal.",
      "principe": "Une requête peut fabriquer une donnée que la source ne contient pas : le rendement au mètre carré n'existe dans aucun fichier, il naît de la transformation. C'est la différence entre lire des données et les exploiter.",
      "reflexion": "Le rendement au mètre carré change complètement le palmarès du marché : le plus gros chiffre n'est pas le meilleur rendement. Écris qui gagne selon chaque critère, puis dis lequel des deux la commune devrait regarder pour fixer ses redevances — et lequel un exposant préférerait qu'elle regarde. Il n'y a pas de bonne réponse, il y a deux points de vue.",
      "remarque": "Le rendement se calcule en division entière, ce qui perd les centimes du quotient. C'est sans conséquence pour un classement — l'ordre est le même —, et cela évite d'introduire des nombres à virgule dans une donnée qui ne sert qu'à comparer. Choisir le type d'un calcul intermédiaire d'après l'usage qu'on en fait est une décision, pas un détail.",
      "indices": [
        "Sépare les questions qui portent sur le marché entier de celles qui portent sur un sous-ensemble. Le chiffre total, la surface, la moyenne concernent les douze étals ; les étals au-dessus de 400 € et les groupes par catégorie n'en concernent qu'une partie. Les premières s'écrivent en une agrégation, les secondes en un filtre ou un regroupement <em>suivi</em> d'une agrégation. C'est toute la grammaire de la journée.",
        "Le plan : la classe de l'étal avec sa validation et ses deux conversions ; le test d'existence et l'écriture éventuelle ; la relecture ; les six agrégats ; le filtre trié et son comptage ; le regroupement par catégorie ; le classement du rendement ; les deux questions booléennes et les deux recherches ; le rapport final.",
        "Écris le rendement dans une propriété calculée de la classe avant de l'utiliser dans une requête, si cela t'aide à y voir clair — puis remets-le dans la requête et compare les deux versions. La première dit que le rendement appartient à l'étal, la seconde qu'il appartient à l'analyse. Les deux se défendent, et le choix se fait sur une question : cette donnée sert-elle ailleurs ?",
        "Le point dur est le rapport final. Il enchaîne un tri, une transformation en ligne de fichier, et une matérialisation — trois maillons dans le bon ordre. Attention : la transformation doit produire la redevance, qui est un calcul, et non la surface. Vérifie ta première ligne à la main : l'étal au plus gros chiffre occupe douze mètres carrés, sa redevance vaut donc trois mille centimes.",
        "Ton fichier ressemble à ceci :<br><code>marche.Sum(e =&gt; e.ChiffreCentimes) · marche.Sum(e =&gt; e.SurfaceM2)</code><br><code>marche.Average(e =&gt; e.ChiffreCentimes) / 100.0:F2</code><br><code>marche.Max(e =&gt; …) · marche.Min(e =&gt; …)</code><br><code>foreach (Etal e in marche.Where(x =&gt; x.ChiffreCentimes &gt; …)</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;.OrderByDescending(x =&gt; …))</code><br><code>foreach (var cat in marche.GroupBy(e =&gt; e.…).OrderBy(g =&gt; g.Key))</code><br><code>{ … cat.Key … cat.Count() … cat.Sum(e =&gt; …) … }</code><br><code>marche.OrderByDescending(e =&gt; e.ChiffreCentimes / e.…)</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;.Select(e =&gt; $\"…\")</code><br><code>marche.Any(e =&gt; e.Categorie == \"poissonnier\")</code><br><code>Etal poissonnier = marche.FirstOrDefault(e =&gt; …);</code><br><code>List&lt;string&gt; rapport = …</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;.OrderByDescending(e =&gt; …)</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;.Select(e =&gt; $\"{e.Code};…;{e.SurfaceM2 * REDEVANCE_M2}\")</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;.ToList();</code>"
      ],
      "solution": "// Le marché du samedi, jour 1 : douze étals, et un rapport écrit en requêtes.\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Linq;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        const string SOURCE = \"marche.csv\";\n        const string RAPPORT = \"marche-rapport.csv\";\n        const int REDEVANCE_M2 = 250;\n\n        if (!File.Exists(SOURCE))\n        {\n            Console.WriteLine(\"Feuille de marché introuvable : premier lancement, on l'écrit\");\n            List<string> feuille = new List<string>();\n            feuille.Add(\"E-01;Verhoeven;maraîcher;12;48500\");\n            feuille.Add(\"E-02;Lambert;fromager;6;31200\");\n            feuille.Add(\"E-03;Ozturk;traiteur;9;52700\");\n            feuille.Add(\"E-04;Nkosi;textile;15;19800\");\n            feuille.Add(\"E-05;Dubois;maraîcher;10;41300\");\n            feuille.Add(\"E-06;Petrov;boulanger;6;28900\");\n            feuille.Add(\"E-07;Simon;fleuriste;4;15600\");\n            feuille.Add(\"E-08;Haddad;traiteur;12;61400\");\n            feuille.Add(\"E-09;Marchal;maraîcher;8;33500\");\n            feuille.Add(\"E-10;Weber;fromager;5;22100\");\n            feuille.Add(\"E-11;Lopes;textile;18;24300\");\n            feuille.Add(\"E-12;Bianchi;boulanger;7;35800\");\n            File.WriteAllLines(SOURCE, feuille);\n        }\n        else\n        {\n            Console.WriteLine(\"Feuille de marché trouvée : on repart du samedi précédent\");\n        }\n\n        List<Etal> marche = new List<Etal>();\n        foreach (string ligne in File.ReadAllLines(SOURCE))\n        {\n            if (ligne == \"\")\n            {\n                continue;\n            }\n            marche.Add(Etal.DepuisLigne(ligne));\n        }\n        Console.WriteLine($\"Étals installés : {marche.Count}\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"LE MARCHÉ EN CHIFFRES\");\n        Console.WriteLine($\"Chiffre d'affaires : {marche.Sum(e => e.ChiffreCentimes) / 100.0:F2} €\");\n        Console.WriteLine($\"Surface occupée : {marche.Sum(e => e.SurfaceM2)} m²\");\n        Console.WriteLine($\"Redevance due : \"\n                        + $\"{marche.Sum(e => e.SurfaceM2) * REDEVANCE_M2 / 100.0:F2} €\");\n        Console.WriteLine($\"Chiffre moyen par étal : \"\n                        + $\"{marche.Average(e => e.ChiffreCentimes) / 100.0:F2} €\");\n        Console.WriteLine($\"Le plus gros chiffre : {marche.Max(e => e.ChiffreCentimes) / 100.0:F2} €\");\n        Console.WriteLine($\"Le plus petit : {marche.Min(e => e.ChiffreCentimes) / 100.0:F2} €\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"AU-DESSUS DE 400 €\");\n        foreach (Etal e in marche.Where(x => x.ChiffreCentimes > 40000)\n                                 .OrderByDescending(x => x.ChiffreCentimes))\n        {\n            Console.WriteLine($\"  {e}\");\n        }\n        Console.WriteLine($\"Étals concernés : {marche.Count(x => x.ChiffreCentimes > 40000)}\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"PAR CATÉGORIE\");\n        foreach (var cat in marche.GroupBy(e => e.Categorie).OrderBy(g => g.Key))\n        {\n            Console.WriteLine($\"{cat.Key} : {cat.Count()} étal(s), \"\n                            + $\"{cat.Sum(e => e.ChiffreCentimes) / 100.0:F2} €, \"\n                            + $\"{cat.Sum(e => e.SurfaceM2)} m²\");\n        }\n        Console.WriteLine($\"Catégories représentées : {marche.GroupBy(e => e.Categorie).Count()}\");\n\n        Console.WriteLine();\n\n        // Une transformation qui fabrique une donnée absente du fichier.\n        Console.WriteLine(\"RENDEMENT AU MÈTRE CARRÉ, DU MEILLEUR AU MOINS BON\");\n        foreach (string ligne in marche\n                     .OrderByDescending(e => e.ChiffreCentimes / e.SurfaceM2)\n                     .Select(e => $\"{e.Code} {e.Exposant} : \"\n                                + $\"{e.ChiffreCentimes / e.SurfaceM2 / 100.0:F2} € / m²\"))\n        {\n            Console.WriteLine($\"  {ligne}\");\n        }\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"DEUX QUESTIONS À RÉPONSE OUI OU NON\");\n        Console.WriteLine($\"Un poissonnier ce samedi ? {marche.Any(e => e.Categorie == \"poissonnier\")}\");\n        Console.WriteLine($\"Tous les étals dépassent-ils 150 € ? \"\n                        + $\"{marche.All(e => e.ChiffreCentimes > 15000)}\");\n\n        Etal poissonnier = marche.FirstOrDefault(e => e.Categorie == \"poissonnier\");\n        if (poissonnier == null)\n        {\n            Console.WriteLine(\"Pas de poissonnier : la recherche prudente rend la référence vide\");\n        }\n        Console.WriteLine($\"Premier maraîcher de la feuille : \"\n                        + $\"{marche.First(e => e.Categorie == \"maraîcher\").Exposant}\");\n\n        Console.WriteLine();\n\n        // Le rapport de fin de marché, écrit depuis une requête complète.\n        List<string> rapport = marche\n            .OrderByDescending(e => e.ChiffreCentimes)\n            .Select(e => $\"{e.Code};{e.Exposant};{e.ChiffreCentimes};\"\n                       + $\"{e.SurfaceM2 * REDEVANCE_M2}\")\n            .ToList();\n        File.WriteAllLines(RAPPORT, rapport);\n        Console.WriteLine($\"{File.ReadAllLines(RAPPORT).Length} lignes dans {RAPPORT}\");\n        Console.WriteLine($\"Première : {rapport[0]}\");\n        Console.WriteLine($\"Dernière : {rapport[rapport.Count - 1]}\");\n    }\n}\n\nclass Etal\n{\n    public string Code { get; private set; }\n    public string Exposant { get; private set; }\n    public string Categorie { get; private set; }\n    public int SurfaceM2 { get; private set; }\n    public int ChiffreCentimes { get; private set; }\n\n    public Etal(string code, string exposant, string categorie, int surfaceM2,\n                int chiffreCentimes)\n    {\n        if (surfaceM2 <= 0)\n        {\n            throw new ArgumentException($\"{code} : surface de {surfaceM2} m² impossible\");\n        }\n        if (chiffreCentimes < 0)\n        {\n            throw new ArgumentException($\"{code} : chiffre de {chiffreCentimes} centimes impossible\");\n        }\n        this.Code = code;\n        this.Exposant = exposant;\n        this.Categorie = categorie;\n        this.SurfaceM2 = surfaceM2;\n        this.ChiffreCentimes = chiffreCentimes;\n    }\n\n    public static Etal DepuisLigne(string ligne)\n    {\n        string[] champs = ligne.Split(';');\n        if (champs.Length != 5)\n        {\n            throw new ArgumentException($\"« {ligne} » : cinq champs attendus\");\n        }\n        return new Etal(champs[0], champs[1], champs[2], int.Parse(champs[3]),\n                        int.Parse(champs[4]));\n    }\n\n    public string EnLigne()\n    {\n        return $\"{Code};{Exposant};{Categorie};{SurfaceM2};{ChiffreCentimes}\";\n    }\n\n    public override string ToString()\n    {\n        return $\"{Code} — {Exposant} ({Categorie}) — {SurfaceM2} m² — \"\n             + $\"{ChiffreCentimes / 100.0:F2} €\";\n    }\n}",
      "pourquoi": "La série démarre sur un jeu de données volontairement plat : douze lignes, cinq champs, aucune valeur manquante, aucun comportement variable. Les trois jours suivants vont chacun casser une de ces certitudes — le critère deviendra un paramètre, une valeur viendra à manquer, et les données viendront de trois sources à la fois. Ce qui est écrit aujourd'hui devra survivre aux trois.",
      "checklist": [
        "Le chiffre d'affaires total vaut-il 4 151,00 €, pour 112 m² et 280,00 € de redevance ?",
        "Le chiffre moyen par étal donne-t-il 345,92 € ?",
        "Quatre étals dépassent-ils 400 €, dans l'ordre E-08, E-03, E-01, E-05 ?",
        "Le meilleur rendement est-il celui d'Ozturk, avec 58,55 € au mètre carré, alors que le plus gros chiffre est celui de Haddad ?",
        "Ton rapport compte-t-il 12 lignes, la première étant celle de E-08 avec une redevance de 3000 ?"
      ],
      "note": "Jour 1 sur 4. Toutes les questions du jour sont écrites en dur dans le programme : « au-dessus de 400 € », « par catégorie », « au mètre carré ». Le jour où le service demandera un autre seuil, il faudra recompiler. Demain, ce seuil cessera d'être écrit dans le code."
    }
  ]
};

<script>
var ECRITURE = {
  placeholder: "Écris ton code C# ici…",
  items: [
  { id: "cs-linq-avance", title: "Le top des scores en LINQ", level: 2,
    statement: "À partir d'une <code>List&lt;int&gt;</code> de scores, affiche avec LINQ : le nombre de scores &gt;= 50, la moyenne, et les 3 meilleurs triés du plus grand au plus petit. Utilise <code>Count</code>, <code>Average</code>, <code>OrderByDescending</code> et <code>Take</code>.",
    hints: [
      "N'oublie pas using System.Linq; en haut du fichier.",
      "Count(s => s >= 50) compte selon une condition ; Average() donne la moyenne.",
      "OrderByDescending(s => s).Take(3) prend les 3 premiers du tri décroissant."
    ],
    atoi: { cmd: "dotnet run", expected: "Réussis (>=50) : 4\nTop 3 : 95, 88, 73" },
    checklist: ["using System.Linq; est présent en tête du fichier.", "reussis compte les scores >= 50 avec Count(s => s >= 50).", "top3 = scores.OrderByDescending(...).Take(3) donne 95, 88, 73.", "La moyenne vient de Average() et s'affiche avec le format :F1 (valeur ~62,2)."],
    solution: "using System;                                        // Console\nusing System.Collections.Generic;                    // List\nusing System.Linq;                                   // méthodes LINQ (Count, Average, Take…)\n\nclass TopScores                                      // classe programme\n{                                                    // début\n    static void Main()                               // point d'entrée\n    {                                                // début de Main\n        List<int> scores = new List<int> { 42, 88, 60, 15, 95, 73 }; // les scores\n        int reussis = scores.Count(s => s >= 50);    // combien atteignent 50 ?\n        double moyenne = scores.Average();           // moyenne de tous les scores\n        var top3 = scores.OrderByDescending(s => s)  // tri du plus grand au plus petit\n                         .Take(3)                    // on garde les 3 premiers\n                         .ToList();                  // on fige le résultat\n        Console.WriteLine($\"Réussis (>=50) : {reussis}\"); // affiche le compte\n        Console.WriteLine($\"Moyenne : {moyenne:F1}\");     // affiche la moyenne à 1 décimale\n        Console.WriteLine(\"Top 3 : \" + string.Join(\", \", top3)); // joint les 3 scores\n    }                                                // fin de Main\n}                                                    // fin de la classe",
    note: "Take(n) prend les n premiers ; Skip(n) les saute. Combinés à OrderByDescending, ils font un classement en une ligne." }
  ]
};
