var DAY = {

  title: "Examen final C#",
  subtitle: "21 leçons en une page : prouve que C# est devenu ton dialecte.",
  theory: `
<p>Cette dernière leçon est un <strong>examen de synthèse</strong> : chaque question porte un repère [L1], [L2]… qui renvoie à la leçon d'origine. Avant de te lancer, voici la carte complète du cours.</p>
<h3>Le cours en une carte</h3>
<pre class="pseudo">SEMAINE 1 — BASES
  Console.WriteLine · types (int, double, decimal, bool, string) · var   // afficher, typer, inférer
  / entière · == · Console.ReadLine + TryParse · if/switch expression    // calculer, lire, décider
  boucles · tableaux [0..n-1] · List&lt;T&gt;                                  // répéter, stocker

SEMAINE 2 — STRUCTURER
  méthodes (PascalCase, =&gt;) · string (== compare le contenu !)          // factoriser, manipuler du texte
  algorithmes traduits · POO : class, new, . , constructeur             // recherche/tri, objets
  propriétés { get; set; }                                              // encapsuler proprement

SEMAINE 3 — VERS LE RÉEL
  héritage (: base, virtual/override) · interfaces (I..., :)            // réutiliser, contractualiser
  exceptions (try/catch/throw) · fichiers (File, JSON) · Dictionary     // fiabiliser, persister, indexer
  LINQ (Where/Sum/Max) · enum/DateTime/Random · PROJET                  // interroger, dater, assembler</pre>
<h3>Les réflexes C# à vie</h3>
<ul>
<li>int/int tronque : caster en <code>(double)</code> avant de diviser (comme Java).</li>
<li><code>==</code> compare le contenu des string (avantage sur Java, qui exigeait <code>.equals</code>).</li>
<li>Tableaux et List sont 0-indexés ; <code>.Length</code> (tableau) vs <code>.Count</code> (List).</li>
<li><code>string</code> et <code>DateTime</code> sont immuables → il faut réaffecter le résultat.</li>
<li>Propriétés <code>{ get; set; }</code> plutôt que des <code>getX()</code>/<code>setX()</code>.</li>
<li>Héritage : <code>:</code>, <code>base</code>, <code>virtual</code>/<code>override</code> explicites.</li>
<li><code>TryParse</code>/<code>TryGetValue</code> pour le prévisible ; <code>try/catch</code> pour l'imprévisible.</li>
<li>LINQ (<code>Where</code>, <code>Sum</code>, <code>Max</code>) = tes motifs d'algorithmique, en version déclarative.</li>
</ul>
<div class="tip">L'examen pioche dans les 20 leçons précédentes. Chaque erreur te renvoie, grâce à son repère [L…], à la leçon exacte à revoir : c'est ton mode d'emploi de révision ciblée.</div>`,
  exercises: [
    { type: "qcm", q: "[L1] Traduire Écrire(\"Salut\") :", opts: ["println", "Console.WriteLine(\"Salut\");", "echo", "print"], a: 1, exp: "Console.WriteLine." },
    { type: "qcm", q: "[L2] Le type argent, sans erreur d'arrondi :", opts: ["double", "decimal (suffixe m)", "int", "float"], a: 1, exp: "decimal pour la monnaie." },
    { type: "qcm", q: "[L3] Que vaut <code>9 / 2</code> (deux int) ?", opts: ["4.5", "4", "5", "Erreur"], a: 1, exp: "Division entière (comme Java)." },
    { type: "input", q: "[L3] Que vaut <code>17 % 5</code> ?", a: "2", ph: "nombre", exp: "Le reste." },
    { type: "qcm", q: "[L4] Lire un entier au clavier, sûrement :", opts: ["Console.ReadInt()", "int.TryParse(Console.ReadLine(), out int n)", "Lire(n)", "Scanner"], a: 1, exp: "TryParse ne plante pas." },

    { type: "input", q: "[L6] int s=0; for(int i=1;i<=5;i++){ if(i%2==1) s+=i; } s = ?", a: "9", ph: "nombre", exp: "1+3+5 : accumulateur conditionnel." },
    { type: "qcm", q: "[L7] Le dernier élément d'un tableau t :", opts: ["t[t.Length]", "t[t.Length - 1] (ou t[^1])", "t[1]", "t.last"], a: 1, exp: "0-indexé." },
    { type: "qcm", q: "[L8] Convention de nom d'une méthode C# :", opts: ["camelCase", "PascalCase (Calculer)", "snake_case", "MAJUSCULES"], a: 1, exp: "Différence avec Java." },
    { type: "input", q: "[L9] Que vaut <code>\"CSHARP\"[1]</code> ?", a: ["S", "s"], ph: "caractère", exp: "C(0) S(1)." },
    { type: "qcm", q: "[L10] La taille d'une List l :", opts: ["l.Length", "l.Count", "l.size()", "count(l)"], a: 1, exp: "List → Count, tableau → Length." },
    { type: "qcm", q: "[L11] La dichotomie exige un tableau…", opts: ["List", "TRIÉ", "de string", "vide"], a: 1, exp: "Prérequis éternel." },
    { type: "qcm", q: "[L12] Accéder à un membre d'objet :", opts: ["obj->x (PHP)", "obj.x (le point, comme Java)", "obj::x", "obj[x]"], a: 1, exp: "Le point en C#." },
    { type: "qcm", q: "[L13] Une propriété auto-implémentée :", opts: ["get x set x", "public int Age { get; set; }", "getAge()", "prop Age"], a: 1, exp: "Plus élégant que les getters/setters Java." },

    { type: "qcm", q: "[L15] Convention de nom d'une interface :", opts: ["Suffixe Impl", "Préfixe I (IExportable)", "MAJUSCULES", "Aucune"], a: 1, exp: "Le I majuscule." },
    { type: "qcm", q: "[L16] int.Parse(\"abc\") lance…", opts: ["DivideByZero", "FormatException", "IOException", "Rien"], a: 1, exp: "Texte→nombre raté." },
    { type: "qcm", q: "[L17] Écrire une string dans un fichier :", opts: ["File.Write", "File.WriteAllText(chemin, texte)", "Console.Write", "File.Save(chemin)"], a: 1, exp: "La classe File." },
    { type: "input", q: "[L18] d[\"A\"] = 1; d[\"A\"] = 5; d[\"A\"] = ?", a: "5", ph: "nombre", exp: "Clé unique : le second écrase." },
    { type: "qcm", q: "[L19] Un dé (1 à 6) avec Random :", opts: ["alea.Next(6)", "alea.Next(1, 7) : borne haute exclue", "alea.Next(1, 6)", "alea.Next(7)"], a: 1, exp: "Next(1, 7) → 1..6." }
  ],
  final: {
    title: "Épreuve de synthèse — Le gestionnaire de flotte (version C#)",
    intro: `<p>Dernière épreuve ! Analyse ce programme complet :</p>
<pre class="pseudo">class Vehicule
{
    public string Immat { get; }
    public int Km { get; private set; }
    public Vehicule(string immat, int km)
    {
        Immat = immat;
        Km = Math.Max(0, km);
    }
    public void Rouler(int distance)
    {
        if (distance > 0) { Km += distance; }
    }
    public override string ToString() => $"{Immat} : {Km} km";
}
// Main :
var flotte = new List&lt;Vehicule&gt; {
    new Vehicule("AA-11", 50000),
    new Vehicule("BB-22", -300)         // (1)
};
flotte[0].Rouler(1500);                 // (2)
flotte[1].Rouler(-99);                  // (3)
int total = flotte.Sum(v => v.Km);      // (4) LINQ</pre>`,
    questions: [
      { type: "input", q: "(1) Que vaut Km pour BB-22 juste après sa création ?", a: "0", ph: "nombre", exp: "Math.Max(0, -300) = 0 : le constructeur valide (leçon 13)." },
      { type: "input", q: "(2) Que vaut le Km de AA-11 après Rouler(1500) ?", a: "51500", ph: "nombre", exp: "50000 + 1500." },
      { type: "qcm", q: "(3) Rouler(-99) sur BB-22 :", opts: ["Km = -99", "Rien : le if refuse les distances négatives — l'encapsulation protège", "Exception", "Km = 99"], a: 1, exp: "La règle vit dans l'objet, indéjouable." },
      { type: "input", q: "(4) Que vaut total ? (LINQ Sum sur les Km)", a: "51500", ph: "nombre", exp: "51500 + 0 : l'accumulateur (jour 12) via LINQ Sum (leçon 18)." },
      { type: "qcm", q: "BILAN — Ce programme mobilise :", opts: ["Que des boucles", "Classe + propriétés (get; private set;) + constructeur validant + List + ToString + LINQ Sum : cinq semaines en 20 lignes", "Que de la POO", "Rien"], a: 1, exp: "Si tu as tout suivi sans relire : C# est un automatisme. 🎓" }
    ],
    solution: `<pre class="pseudo">(1) new Vehicule("BB-22", -300) → Km = 0 (Math.Max validation)
(2) 50000 + 1500 = 51500
(3) Rouler(-99) → refusé (if distance > 0), Km reste 0
(4) flotte.Sum(v => v.Km) → 51500 + 0 = 51500

Le même programme en pseudocode aurait tenu au jour 30
d'algorithmique. C# n'a ajouté que : types, syntaxe, objets,
propriétés, LINQ. La PENSÉE, elle, n'a jamais changé.</pre>
<p><strong>Bravo !</strong> Tu as terminé le cours C#. Et surtout : tu as vu le MÊME algorithme s'incarner en pseudocode, Java, PHP et C#. Tu ne connais pas « quatre langages » — tu connais l'ALGORITHMIQUE, et tu sais l'exprimer partout. C'est la compétence qui ne périme jamais. 🎓</p>`
  }
};
