var DAY = {
  num: 14,
  title: "Héritage et polymorphisme",
  subtitle: "Des classes qui en étendent d'autres : le : de C#.",
  theory: `
<h3>1. L'héritage : réutiliser et spécialiser une classe</h3>
<p>L'<strong>héritage</strong> permet à une classe « fille » de reprendre les attributs et méthodes d'une classe « mère », puis d'en ajouter ou d'en redéfinir. On évite de réécrire ce qui est commun.</p>
<pre class="pseudo">class Animal
{
    protected string nom;                                     // protected = visible dans la classe ET ses filles
    public Animal(string nom) { this.nom = nom; }             // constructeur de la mère
    public void Manger() { Console.WriteLine($"{nom} mange"); } // comportement commun à tous les animaux
    public virtual void Crier() { Console.WriteLine("..."); }  // virtual = AUTORISE les filles à redéfinir
}
class Chien : Animal                       // « : Animal » = Chien HÉRITE d'Animal (au lieu de extends en Java)
{
    public Chien(string nom) : base(nom) { }   // base(nom) appelle le constructeur de la mère (super en Java)
    public override void Crier()               // override = on REDÉFINIT la méthode virtual de la mère
    {
        Console.WriteLine($"{nom} : Wouf !");  // version spécifique au chien
    }
    public void Rapporter() { Console.WriteLine($"{nom} rapporte"); }  // méthode PROPRE au chien
}</pre>
<div class="warn">Trois différences avec Java : <code>: Animal</code> (au lieu de <code>extends</code>) · <code>base(nom)</code> (au lieu de <code>super</code>) · une méthode redéfinissable doit être <code>virtual</code> dans la mère ET <code>override</code> dans la fille. Java rendait tout redéfinissable par défaut ; C# exige ces mots-clés explicites, ce qui rend l'intention claire.</div>

<h3>2. Le polymorphisme : même appel, comportements différents</h3>
<pre class="pseudo">Animal a1 = new Chien("Rex");        // la variable est de type Animal, mais l'OBJET est un Chien
Animal a2 = new Chat("Mia");         // idem, un Chat
a1.Crier();                          // affiche « Rex : Wouf ! » → la version CHIEN est choisie
a2.Crier();                          // affiche « Mia : Miaou ! » → la version CHAT</pre>
<p>Même instruction <code>a.Crier()</code>, résultats différents selon l'objet <strong>réel</strong> : c'est le <strong>polymorphisme</strong>. C# regarde à l'exécution le vrai type de l'objet (Chien, Chat…) pour décider quelle version de <code>Crier</code> appeler.</p>

<h3>3. Traiter une collection hétérogène uniformément</h3>
<pre class="pseudo">List&lt;Animal&gt; zoo = new List&lt;Animal&gt; {           // une liste d'Animal peut contenir des Chien, des Chat…
    new Chien("Rex"), new Chat("Mia"), new Chien("Fido")
};
foreach (Animal a in zoo)
{
    a.Crier();               // chacun crie à SA façon, sans le moindre if sur le type !
}</pre>
<p>C'est l'atout majeur du polymorphisme : le code de la boucle ne connaît que « des Animal », mais chaque objet exécute son propre <code>Crier</code>. Ajouter une nouvelle espèce ne demande aucune modification de cette boucle.</p>

<h3>4. Règles et outils</h3>
<pre class="pseudo">Animal a = new Chien("Rex");
a.Rapporter();               // ERREUR : vu comme un Animal, « a » n'expose que Crier/Manger
((Chien)a).Rapporter();      // cast explicite vers Chien → on retrouve Rapporter
if (a is Chien c) { c.Rapporter(); }   // pattern matching : teste « a est un Chien » ET range dans c d'un coup</pre>
<ul>
<li>C# ne permet qu'un héritage <strong>simple</strong> (une seule classe mère).</li>
<li><code>virtual</code> (mère) + <code>override</code> (fille) sont obligatoires pour redéfinir.</li>
<li>Toute classe hérite implicitement de <code>object</code> (d'où <code>ToString</code>, <code>Equals</code>…).</li>
</ul>

<h3>5. base pour étendre plutôt que remplacer</h3>
<pre class="pseudo">public override void Crier()
{
    base.Crier();            // appelle d'abord la version de la MÈRE…
    Console.WriteLine("(et un petit jappement)");   // …puis ajoute un comportement propre
}</pre>
<p>Grâce à <code>base</code>, une redéfinition peut <em>compléter</em> le comportement hérité au lieu de l'écraser entièrement.</p>

<h3>6. Quand hériter ?</h3>
<p>Le test de la phrase : « X <strong>est un</strong> Y ». Chien EST UN Animal ✓ → héritage. Voiture N'EST PAS un Moteur, mais elle EN A un → on préfère la <strong>composition</strong> (un attribut Moteur dans Voiture). Bien choisir entre « est un » et « a un » évite des hiérarchies bancales.</p>`,
  exercises: [
    { type: "qcm", q: "L'héritage C# se déclare avec…", opts: ["extends", ": (deux-points) : class Chien : Animal", "inherits", "->"], a: 1, exp: "Le : remplace le extends de Java." },
    { type: "qcm", q: "Le super de Java devient en C#…", opts: ["parent", "base (base(nom), base.Crier())", "super", "this"], a: 1, exp: "base : même rôle, autre mot." },
    { type: "qcm", q: "Pour qu'une méthode soit redéfinissable, la classe mère doit la déclarer…", opts: ["static", "virtual (et la fille : override)", "private", "final"], a: 1, exp: "C# exige virtual/override explicites (Java ne demandait rien)." },
    { type: "qcm", q: "Redéfinir Crier dans la fille exige le mot-clé…", opts: ["new", "override", "redefine", "virtual"], a: 1, exp: "public override void Crier()." },
    { type: "qcm", q: "protected rend un membre visible…", opts: ["Partout", "Dans la classe ET ses filles (comme Java)", "Nulle part", "Dans le fichier"], a: 1, exp: "Entre private et public." },
    { type: "qcm", q: "Animal a = new Chien(\"Rex\"); est légal car…", opts: ["C# est peu strict sur les types", "Un Chien EST UN Animal : référence mère → objet fille", "Chien et Animal sont identiques", "C'est en réalité illégal"], a: 1, exp: "Le sens unique : fille → mère." },
    { type: "qcm", q: "a1.Crier() sur un Chien affiche « Rex : Wouf ! ». Pourquoi la version Chien ?", opts: ["Par pur hasard", "Polymorphisme : le TYPE RÉEL de l'objet choisit la méthode, à l'exécution", "La variable Animal décide", "C'est le comportement par défaut"], a: 1, exp: "La variable dit Animal, l'objet EST un Chien : l'objet gagne." },
    { type: "qcm", q: "Dans le zoo (List<Animal>), chaque animal crie à sa façon SANS if. Ça remplace…", opts: ["Ne remplace rien du tout", "La cascade if (type…) : chaque classe porte son comportement", "Un switch obligatoire", "Une erreur de compilation"], a: 1, exp: "Le code ouvert aux nouvelles espèces (comme Java)." },
    { type: "qcm", q: "Animal a = new Chien(...); a.Rapporter(); :", opts: ["Affiche « Rex rapporte »", "ERREUR : le type Animal ne voit que Crier/Manger — cast nécessaire", "Affiche « Wouf »", "Renvoie null"], a: 1, exp: "Le type de la VARIABLE fixe l'accessible." },
    { type: "qcm", q: "<code>if (a is Chien c) { c.Rapporter(); }</code> fait…", opts: ["Une erreur", "Le PATTERN MATCHING : teste si a est un Chien ET le range dans c en un coup", "Toujours vrai", "Un cast dangereux"], a: 1, exp: "Test + cast combinés : élégance C#." },
    { type: "qcm", q: "Combien de classes mères directes en C# ?", opts: ["Autant qu'on le souhaite", "UNE seule : héritage simple (comme Java)", "Deux au maximum", "Zéro, jamais"], a: 1, exp: "Pour combiner : les interfaces (leçon 15)." },
    { type: "qcm", q: "Toute classe C# hérite implicitement de…", opts: ["La classe Main", "object : d'où ToString, Equals…", "La classe string", "La classe Animal"], a: 1, exp: "C'est pourquoi on OVERRIDE ToString (leçon 13)." },
    { type: "qcm", q: "base.Crier() dans un override permet…", opts: ["Une erreur", "D'ÉTENDRE le comportement hérité (la version mère + la sienne) au lieu de tout remplacer", "De boucler", "De supprimer"], a: 1, exp: "Redéfinir n'oblige pas à tout réécrire." },
    { type: "qcm", q: "« Une Voiture ___ un Moteur » : héritage ou composition ?", opts: [": Moteur (héritage)", "Composition : la Voiture A UN Moteur (attribut), elle n'EST PAS un moteur", "Les deux", "Aucun"], a: 1, exp: "Le test « est un » : s'il sonne faux, c'est un attribut." },
    { type: "vf", q: "Conceptuellement, l'héritage C# est identique à Java : seuls changent : (extends), base (super), virtual/override.", a: true, exp: "Troisième langage, même POO." }
  ],
  final: {
    title: "Exercice final — La ménagerie polymorphe (version C#)",
    intro: `<p>Le zoo tourne avec les classes de la théorie (+ Chat symétrique, « Miaou ! ») :</p>
<pre class="pseudo">List&lt;Animal&gt; zoo = new List&lt;Animal&gt; {
    new Chien("Rex"), new Chat("Mia"), new Chien("Fido")
};
foreach (Animal a in zoo)
{
    a.Crier();
    a.Manger();
}</pre>`,
    questions: [
      { type: "qcm", q: "Que produit <code>a.Crier()</code> au fil de la boucle ?", opts: ["Trois « ... »", "Rex : Wouf ! · Mia : Miaou ! · Fido : Wouf ! — chaque objet sa version", "Trois Wouf", "Erreur"], a: 1, exp: "Le polymorphisme : même ligne, trois comportements." },
      { type: "qcm", q: "<code>a.Manger()</code> marche pour tous. D'où vient cette méthode ?", opts: ["Chaque classe l'a recopiée", "HÉRITÉE d'Animal, jamais réécrite : un seul code (pas virtual, pas besoin)", "Héritée de la classe object", "Fournie par la liste zoo"], a: 1, exp: "L'héritage factorise le commun ; l'override spécialise le reste." },
      { type: "qcm", q: "On ajoute <code>class Vache : Animal</code> avec son Crier(). Que changer dans la boucle ?", opts: ["Ajouter un if", "RIEN : zoo.Add(new Vache(...)) suffit, la boucle est prête", "Refaire la boucle", "Changer List"], a: 1, exp: "« Ouvert à l'extension, fermé à la modification » : le graal." },
      { type: "qcm", q: "zoo[0].Rapporter(); ne compile pas alors que zoo[0] EST un Chien. Pourquoi ?", opts: ["Rex est fatigué", "La liste est typée Animal : le compilateur ne voit que les méthodes d'Animal — cast ou pattern matching requis", "Rapporter est private", "zoo[0] est null"], a: 1, exp: "Type déclaré = lunettes du compilateur." },
      { type: "qcm", q: "Dans le constructeur de Chat, la première ligne <code>public Chat(string nom) : ???</code> :", opts: [": this(nom)", ": base(nom) — déléguer l'initialisation à Animal", "new Animal(nom)", "nom = null"], a: 1, exp: "base(nom) : la mère construit sa partie (comme super en Java)." }
    ],
    solution: `<pre class="pseudo">Rex : Wouf !   (Chien.Crier — override)
Rex mange      (Animal.Manger — hérité)
Mia : Miaou !  (Chat.Crier — override)
Mia mange
Fido : Wouf !
Fido mange

Ajout d'espèce = une classe (: Animal, override Crier), ZÉRO
autre ligne modifiée. Différences C#/Java : :, base, virtual/override.</pre>
<p>Héritage, polymorphisme, extension propre : les trois piliers posés. Demain : interfaces et classes abstraites.</p>`
  }
};

    ],

    solution: "using System;                                    // accès à Console\n\nclass Animal                                     // classe PARENT\n{                                                // début de la classe\n    protected string nom;                        // protected : visible dans les classes filles\n\n    public Animal(string nom)                    // constructeur du parent\n    {                                            // début du constructeur\n        this.nom = nom;                          // range le paramètre dans l'attribut\n    }                                            // fin du constructeur\n\n    public virtual void Crier()                  // virtual : les filles ONT LE DROIT de redéfinir\n    {                                            // début de Crier\n        Console.WriteLine($\"{nom} fait ...\");    // comportement par défaut\n    }                                            // fin de Crier\n}                                                // fin d'Animal\n\nclass Chien : Animal                             // Chien HÉRITE d'Animal (les deux points)\n{                                                // début de la classe\n    public Chien(string nom) : base(nom) { }     // base(nom) appelle le constructeur du PARENT\n\n    public override void Crier()                 // override : on REMPLACE la version du parent\n    {                                            // début de Crier\n        Console.WriteLine($\"{nom} fait Wouf !\"); // comportement spécifique au chien\n    }                                            // fin de Crier\n}                                                // fin de Chien\n\nclass TestHeritage                               // classe de test\n{                                                // début de la classe\n    static void Main()                           // point d'entrée du programme\n    {                                            // début de Main\n        Animal a = new Animal(\"Créature\");       // un animal générique\n        Animal b = new Chien(\"Rex\");             // POLYMORPHISME : type déclaré Animal, objet réel Chien\n        a.Crier();                               // affiche : Créature fait ...\n        b.Crier();                               // affiche : Rex fait Wouf ! (la version du Chien gagne)\n    }                                            // fin de Main\n}                                                // fin de TestHeritage",
