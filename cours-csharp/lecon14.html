  title: "Héritage et polymorphisme",
  subtitle: "Des classes qui en étendent d'autres : le : de C#.",
  theory: `
<h3>1. L'héritage : réutiliser et spécialiser une classe</h3>
<p>L'<strong>héritage</strong> permet à une classe « fille » de reprendre les attributs et méthodes d'une classe « mère », puis d'en ajouter ou d'en redéfinir. On évite de réécrire ce qui est commun.</p>
<pre class="pseudo">class Animal
{
    protected string nom;                                     // protected = visible dans la classe ET ses filles
    public Animal(string nom) { this.nom = nom; }             // constructeur de la mère
    public void Manger() { Console.WriteLine($"{nom} mange"); } // comportement commun à tous les animaux
    public virtual void Crier() { Console.WriteLine("..."); }  // virtual = AUTORISE les filles à redéfinir
}
class Chien : Animal                       // « : Animal » = Chien HÉRITE d'Animal (au lieu de extends en Java)
{
    public Chien(string nom) : base(nom) { }   // base(nom) appelle le constructeur de la mère (super en Java)
    public override void Crier()               // override = on REDÉFINIT la méthode virtual de la mère
    {
        Console.WriteLine($"{nom} : Wouf !");  // version spécifique au chien
    }
    public void Rapporter() { Console.WriteLine($"{nom} rapporte"); }  // méthode PROPRE au chien
}</pre>
<div class="warn">Trois différences avec Java : <code>: Animal</code> (au lieu de <code>extends</code>) · <code>base(nom)</code> (au lieu de <code>super</code>) · une méthode redéfinissable doit être <code>virtual</code> dans la mère ET <code>override</code> dans la fille. Java rendait tout redéfinissable par défaut ; C# exige ces mots-clés explicites, ce qui rend l'intention claire.</div>

<h3>2. Le polymorphisme : même appel, comportements différents</h3>
<pre class="pseudo">Animal a1 = new Chien("Rex");        // la variable est de type Animal, mais l'OBJET est un Chien
Animal a2 = new Chat("Mia");         // idem, un Chat
a1.Crier();                          // affiche « Rex : Wouf ! » → la version CHIEN est choisie
a2.Crier();                          // affiche « Mia : Miaou ! » → la version CHAT</pre>
<p>Même instruction <code>a.Crier()</code>, résultats différents selon l'objet <strong>réel</strong> : c'est le <strong>polymorphisme</strong>. C# regarde à l'exécution le vrai type de l'objet (Chien, Chat…) pour décider quelle version de <code>Crier</code> appeler.</p>

<h3>3. Traiter une collection hétérogène uniformément</h3>
<pre class="pseudo">List&lt;Animal&gt; zoo = new List&lt;Animal&gt; {           // une liste d'Animal peut contenir des Chien, des Chat…
    new Chien("Rex"), new Chat("Mia"), new Chien("Fido")
};
foreach (Animal a in zoo)
{
    a.Crier();               // chacun crie à SA façon, sans le moindre if sur le type !
}</pre>
<p>C'est l'atout majeur du polymorphisme : le code de la boucle ne connaît que « des Animal », mais chaque objet exécute son propre <code>Crier</code>. Ajouter une nouvelle espèce ne demande aucune modification de cette boucle.</p>

<h3>4. Règles et outils</h3>
<pre class="pseudo">Animal a = new Chien("Rex");
a.Rapporter();               // ERREUR : vu comme un Animal, « a » n'expose que Crier/Manger
((Chien)a).Rapporter();      // cast explicite vers Chien → on retrouve Rapporter
if (a is Chien c) { c.Rapporter(); }   // pattern matching : teste « a est un Chien » ET range dans c d'un coup</pre>
<ul>
<li>C# ne permet qu'un héritage <strong>simple</strong> (une seule classe mère).</li>
<li><code>virtual</code> (mère) + <code>override</code> (fille) sont obligatoires pour redéfinir.</li>
<li>Toute classe hérite implicitement de <code>object</code> (d'où <code>ToString</code>, <code>Equals</code>…).</li>
</ul>

<h3>5. base pour étendre plutôt que remplacer</h3>
<pre class="pseudo">public override void Crier()
{
    base.Crier();            // appelle d'abord la version de la MÈRE…
    Console.WriteLine("(et un petit jappement)");   // …puis ajoute un comportement propre
}</pre>
<p>Grâce à <code>base</code>, une redéfinition peut <em>compléter</em> le comportement hérité au lieu de l'écraser entièrement.</p>

<h3>6. Quand hériter ?</h3>
<p>Le test de la phrase : « X <strong>est un</strong> Y ». Chien EST UN Animal ✓ → héritage. Voiture N'EST PAS un Moteur, mais elle EN A un → on préfère la <strong>composition</strong> (un attribut Moteur dans Voiture). Bien choisir entre « est un » et « a un » évite des hiérarchies bancales.</p>`,

      "solution": "// L'harmonie municipale : une seule boucle, sept instruments, sept sons différents.\nusing System;\nusing System.Collections.Generic;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        // Une liste d'Instrument accepte les filles : chacune reste ce qu'elle est.\n        List<Instrument> harmonie = new List<Instrument>();\n        harmonie.Add(new Cuivre(\"Trompette\", \"Naïm\", 3));\n        harmonie.Add(new Cuivre(\"Trombone\", \"Élodie\", 0));\n        harmonie.Add(new Bois(\"Clarinette\", \"Sarah\", \"simple\"));\n        harmonie.Add(new Bois(\"Hautbois\", \"Malik\", \"double\"));\n        harmonie.Add(new Percussion(\"Grosse caisse\", \"Théo\"));\n        harmonie.Add(new Percussion(\"Caisse claire\", \"Lina\"));\n        harmonie.Add(new Instrument(\"Piano de répétition\", \"le chef\"));\n\n        Console.WriteLine(\"L'EFFECTIF\");\n        foreach (Instrument i in harmonie)\n        {\n            i.Presenter();               // méthode NON redéfinie : la version de la mère pour tous\n        }\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"LA RÉPÉTITION\");\n        foreach (Instrument i in harmonie)\n        {\n            Console.WriteLine(i.Jouer());  // même appel, sept résultats : c'est le polymorphisme\n        }\n\n        Console.WriteLine();\n\n        // Aucun test sur le type : chaque objet répond avec SA durée.\n        int echauffement = 0;\n        foreach (Instrument i in harmonie)\n        {\n            echauffement += i.MinutesEchauffement();\n        }\n        Console.WriteLine($\"Échauffement total du pupitre : {echauffement} minutes\");\n\n        Console.WriteLine();\n\n        // Quand il faut VRAIMENT connaître le type, le motif « is » le dit et range d'un coup.\n        int cuivres = 0;\n        int bois = 0;\n        int percussions = 0;\n        int autres = 0;\n        foreach (Instrument i in harmonie)\n        {\n            if (i is Cuivre)\n            {\n                cuivres++;\n            }\n            else if (i is Bois)\n            {\n                bois++;\n            }\n            else if (i is Percussion)\n            {\n                percussions++;\n            }\n            else\n            {\n                autres++;\n            }\n        }\n        Console.WriteLine($\"Cuivres : {cuivres} · Bois : {bois} · Percussions : {percussions} · \"\n                        + $\"Non classés : {autres}\");\n\n        Console.WriteLine();\n\n        // Vider n'existe que chez les cuivres : le motif « is » donne accès à la fille.\n        Console.WriteLine(\"APRÈS LA RÉPÉTITION\");\n        foreach (Instrument i in harmonie)\n        {\n            if (i is Cuivre c)           // teste le type ET range dans c en une seule ligne\n            {\n                c.Vider();\n            }\n        }\n\n        // Vu comme un Instrument, l'objet n'expose que ce que la mère promet.\n        Instrument premier = harmonie[0];\n        // premier.Vider();              // refusé à la compilation : Instrument ne connaît pas Vider\n        ((Cuivre)premier).Vider();       // le cast explicite rend la trompette à elle-même\n\n        Console.WriteLine();\n\n        Console.WriteLine($\"Le pupitre compte {harmonie.Count} instruments, et la boucle qui les \"\n                        + \"fait jouer ne contient pas un seul test de type.\");\n    }\n}\n\nclass Instrument\n{\n    protected string nom;                // protected : visible ici ET dans les filles\n    protected string musicien;\n\n    public Instrument(string nom, string musicien)\n    {\n        this.nom = nom;\n        this.musicien = musicien;\n    }\n\n    public void Presenter()              // comportement commun, non redéfinissable\n    {\n        Console.WriteLine($\"{nom} — {musicien}\");\n    }\n\n    public virtual string Jouer()        // virtual : les filles ONT LE DROIT de redéfinir\n    {\n        return $\"{nom} joue une note\";\n    }\n\n    public virtual int MinutesEchauffement()\n    {\n        return 5;\n    }\n}\n\nclass Cuivre : Instrument                // « : Instrument » = Cuivre hérite d'Instrument\n{\n    private int nombreDePistons;\n\n    public Cuivre(string nom, string musicien, int nombreDePistons) : base(nom, musicien)\n    {\n        this.nombreDePistons = nombreDePistons;   // base(...) a déjà rempli nom et musicien\n    }\n\n    public override string Jouer()\n    {\n        return $\"{nom} sonne, clair et rond\";\n    }\n\n    public override int MinutesEchauffement()\n    {\n        return 12;\n    }\n\n    public void Vider()                  // méthode PROPRE aux cuivres\n    {\n        Console.WriteLine($\"{musicien} vide l'eau de son {nom} ({nombreDePistons} pistons)\");\n    }\n}\n\nclass Bois : Instrument\n{\n    private string anche;\n\n    public Bois(string nom, string musicien, string anche) : base(nom, musicien)\n    {\n        this.anche = anche;\n    }\n\n    public override string Jouer()\n    {\n        return $\"{nom} chante, anche {anche}\";\n    }\n\n    public override int MinutesEchauffement()\n    {\n        return 8;\n    }\n}\n\nclass Percussion : Instrument\n{\n    public Percussion(string nom, string musicien) : base(nom, musicien)\n    {\n    }\n\n    public override string Jouer()\n    {\n        return base.Jouer() + \", puis laisse résonner\";   // base : compléter au lieu de remplacer\n    }\n\n    public override int MinutesEchauffement()\n    {\n        return 3;\n    }\n}",

      "enonce": "Le garage d'une commune gère six véhicules et prépare son budget. Écris une classe mère portant l'immatriculation, le kilométrage et l'année de mise en service — <strong>en propriétés, comme à la leçon 13</strong>, avec une écriture réservée à la classe et un kilométrage jamais négatif. Donne-lui trois méthodes redéfinissables : le coût de révision en centimes, valant 9 000 plus un centime par tranche de cent kilomètres ; l'obligation de contrôle technique, à partir de quatre ans d'âge ; et le libellé de la catégorie. Ajoute un affichage automatique reprenant ces éléments. Fais-en dériver trois classes. La voiture a un nombre de places et paie 1 200 centimes de plus que le tarif de base. La camionnette a une charge utile en kilos, paie trois centimes par kilo <strong>en plus du tarif de base</strong>, et passe au contrôle dès deux ans. L'autocar a un nombre de places, paie 250 centimes par place en plus du tarif de base, et passe au contrôle <strong>tous les ans sans condition</strong>. Constitue le parc : voitures 1-ABC-001 (84 200 km, 2018, 5 places) et 1-ABC-002 (31 500 km, 2022, 5 places) ; camionnettes 1-DEF-100 (128 900 km, 2016, 1 200 kg) et 1-DEF-101 (47 300 km, 2021, 800 kg) ; autocar 1-GHI-200 (264 000 km, 2014, 52 places) ; et 1-XYZ-999 (12 000 km, 2023), une remorque de service qui reste de la classe mère. Affiche le parc, puis la campagne de révision véhicule par véhicule et son coût total. Établis la liste des contrôles techniques de 2026. Donne le kilométrage cumulé, le kilométrage moyen et la révision la plus chère. Compte les véhicules de chaque catégorie, relève les places assises disponibles pour une sortie scolaire, puis classe le parc par coût de révision décroissant.",

      "reflexion": "Le service achète un véhicule électrique dont la révision coûte un forfait fixe, sans rapport avec le kilométrage. Écris quelles lignes de ton programme tu dois modifier pour l'intégrer — pas quelles lignes tu dois ajouter, quelles lignes tu dois <em>modifier</em>. Puis compare avec ce qu'aurait coûté la même demande sur un programme fait de <code>if</code> en cascade sur un texte de catégorie.",
      "principe": "Une hiérarchie bien posée déplace les différences vers les feuilles : le code qui utilise les objets ne connaît que la mère, et chaque spécialisation se contente d'ajouter à ce que la mère a déjà calculé. Ajouter une catégorie ne demande alors aucune modification de l'existant.",
      "remarque": "Le coût de révision utilise une division entière de kilomètres, ce qui fait perdre les dizaines de kilomètres. C'est voulu : le barème réel du garage est par tranche entamée, et une tranche de cent kilomètres ne se facture pas au dixième. Une division entière n'est un défaut que lorsque personne n'a décidé qu'elle en était une.",
      "indices": [
        "Le mot « en plus » revient trois fois dans l'énoncé, et il n'est pas décoratif. Chaque catégorie ne recalcule pas le tarif : elle prend celui de la mère et lui ajoute quelque chose. Repère la petite construction que la leçon donne pour appeler la version de la mère depuis la fille — elle est le cœur de l'exercice, et elle t'évitera de recopier trois fois la même formule.",
        "Le plan : la classe mère avec ses trois propriétés, son constructeur validant, ses trois méthodes ouvertes et son affichage ; les trois filles, chacune avec sa propriété propre et ses redéfinitions ; puis le programme — parc, révisions, contrôles, cumuls, comptages, places assises, classement.",
        "Écris la mère et fais tourner le programme avec six véhicules de cette seule classe : tu obtiendras six coûts qui ne dépendent que du kilométrage, et un total. Note ce total sur un papier. Transforme ensuite les objets un par un en filles, et regarde le total monter. Tu sauras à tout instant d'où vient chaque centime.",

      "solution": "// Le garage municipal : une famille de véhicules, une seule boucle de facturation.\nusing System;\nusing System.Collections.Generic;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        const int ANNEE = 2026;\n\n        List<Vehicule> garage = new List<Vehicule>();\n        garage.Add(new Voiture(\"1-ABC-001\", 84200, 2018, 5));\n        garage.Add(new Voiture(\"1-ABC-002\", 31500, 2022, 5));\n        garage.Add(new Camionnette(\"1-DEF-100\", 128900, 2016, 1200));\n        garage.Add(new Camionnette(\"1-DEF-101\", 47300, 2021, 800));\n        garage.Add(new Bus(\"1-GHI-200\", 264000, 2014, 52));\n        garage.Add(new Vehicule(\"1-XYZ-999\", 12000, 2023));   // une remorque de service, non classée\n\n        Console.WriteLine(\"LE PARC\");\n        foreach (Vehicule v in garage)\n        {\n            Console.WriteLine(v);          // ToString redéfini dans chaque fille\n        }\n\n        Console.WriteLine();\n\n        // Pas un seul test de type : chaque véhicule sait ce que sa révision coûte.\n        Console.WriteLine(\"LA CAMPAGNE DE RÉVISION\");\n        int totalRevision = 0;\n        foreach (Vehicule v in garage)\n        {\n            int cout = v.CoutRevisionCentimes();\n            totalRevision += cout;\n            Console.WriteLine($\"{v.Immatriculation} : {cout / 100.0:F2} €\");\n        }\n        Console.WriteLine($\"Coût total de la campagne : {totalRevision / 100.0:F2} €\");\n\n        Console.WriteLine();\n\n        Console.WriteLine($\"CONTRÔLE TECHNIQUE EN {ANNEE}\");\n        int aControler = 0;\n        foreach (Vehicule v in garage)\n        {\n            if (v.DoitPasserAuControle(ANNEE))\n            {\n                aControler++;\n                Console.WriteLine($\"{v.Immatriculation} doit passer\");\n            }\n            else\n            {\n                Console.WriteLine($\"{v.Immatriculation} est dispensé cette année\");\n            }\n        }\n        Console.WriteLine($\"Véhicules à contrôler : {aControler} sur {garage.Count}\");\n\n        Console.WriteLine();\n\n        int kilometrageTotal = 0;\n        Vehicule plusCher = garage[0];\n        foreach (Vehicule v in garage)\n        {\n            kilometrageTotal += v.Kilometrage;\n            if (v.CoutRevisionCentimes() > plusCher.CoutRevisionCentimes())\n            {\n                plusCher = v;\n            }\n        }\n        Console.WriteLine($\"Kilométrage cumulé du parc : {kilometrageTotal} km\");\n        Console.WriteLine($\"Kilométrage moyen : {kilometrageTotal / garage.Count} km\");\n        Console.WriteLine($\"Révision la plus chère : {plusCher.Immatriculation} à \"\n                        + $\"{plusCher.CoutRevisionCentimes() / 100.0:F2} €\");\n\n        Console.WriteLine();\n\n        // Le comptage par catégorie, lui, a besoin de connaître le type réel.\n        int voitures = 0;\n        int camionnettes = 0;\n        int bus = 0;\n        int nonClasses = 0;\n        foreach (Vehicule v in garage)\n        {\n            if (v is Voiture)\n            {\n                voitures++;\n            }\n            else if (v is Camionnette)\n            {\n                camionnettes++;\n            }\n            else if (v is Bus)\n            {\n                bus++;\n            }\n            else\n            {\n                nonClasses++;\n            }\n        }\n        Console.WriteLine($\"Voitures : {voitures} · Camionnettes : {camionnettes} · Bus : {bus} · \"\n                        + $\"Non classés : {nonClasses}\");\n\n        Console.WriteLine();\n\n        // Une capacité qui n'existe que chez le bus se retrouve par le motif « is ».\n        Console.WriteLine(\"PLACES ASSISES DISPONIBLES POUR LA SORTIE SCOLAIRE\");\n        foreach (Vehicule v in garage)\n        {\n            if (v is Bus autocar)\n            {\n                Console.WriteLine($\"{autocar.Immatriculation} : {autocar.NombreDePlaces} places\");\n            }\n        }\n\n        Console.WriteLine();\n\n        // Un seul échange, comme à la leçon 12 : c'est le véhicule entier qui se déplace.\n        for (int i = 0; i < garage.Count - 1; i++)\n        {\n            for (int j = 0; j < garage.Count - 1 - i; j++)\n            {\n                if (garage[j].CoutRevisionCentimes() < garage[j + 1].CoutRevisionCentimes())\n                {\n                    Vehicule aux = garage[j];\n                    garage[j] = garage[j + 1];\n                    garage[j + 1] = aux;\n                }\n            }\n        }\n\n        Console.WriteLine(\"BUDGET PAR ORDRE DÉCROISSANT\");\n        for (int i = 0; i < garage.Count; i++)\n        {\n            Console.WriteLine($\"{i + 1}. {garage[i].Immatriculation} — \"\n                            + $\"{garage[i].CoutRevisionCentimes() / 100.0:F2} €\");\n        }\n    }\n}\n\nclass Vehicule\n{\n    public string Immatriculation { get; private set; }   // les propriétés de la leçon 13 restent\n    public int Kilometrage { get; private set; }\n    public int AnneeMiseEnService { get; private set; }\n\n    public Vehicule(string immatriculation, int kilometrage, int anneeMiseEnService)\n    {\n        this.Immatriculation = immatriculation;\n        this.Kilometrage = Math.Max(0, kilometrage);\n        this.AnneeMiseEnService = anneeMiseEnService;\n    }\n\n    public virtual int CoutRevisionCentimes()\n    {\n        return 9000 + Kilometrage / 100;      // forfait de base, plus l'usure au kilomètre\n    }\n\n    public virtual bool DoitPasserAuControle(int anneeCourante)\n    {\n        return anneeCourante - AnneeMiseEnService >= 4;\n    }\n\n    public virtual string Categorie()\n    {\n        return \"véhicule de service\";\n    }\n\n    public override string ToString()\n    {\n        return $\"{Immatriculation} — {Categorie()} — {Kilometrage} km — mis en service en \"\n             + $\"{AnneeMiseEnService}\";\n    }\n}\n\nclass Voiture : Vehicule\n{\n    public int NombreDePlaces { get; private set; }\n\n    public Voiture(string immatriculation, int kilometrage, int annee, int nombreDePlaces)\n        : base(immatriculation, kilometrage, annee)\n    {\n        this.NombreDePlaces = nombreDePlaces;\n    }\n\n    public override int CoutRevisionCentimes()\n    {\n        return base.CoutRevisionCentimes() + 1200;    // base : ajouter au lieu de recalculer\n    }\n\n    public override string Categorie()\n    {\n        return $\"voiture {NombreDePlaces} places\";\n    }\n}\n\nclass Camionnette : Vehicule\n{\n    public int ChargeUtileKg { get; private set; }\n\n    public Camionnette(string immatriculation, int kilometrage, int annee, int chargeUtileKg)\n        : base(immatriculation, kilometrage, annee)\n    {\n        this.ChargeUtileKg = chargeUtileKg;\n    }\n\n    public override int CoutRevisionCentimes()\n    {\n        return base.CoutRevisionCentimes() + ChargeUtileKg * 3;\n    }\n\n    public override bool DoitPasserAuControle(int anneeCourante)\n    {\n        return anneeCourante - AnneeMiseEnService >= 2;    // règle plus stricte que la mère\n    }\n\n    public override string Categorie()\n    {\n        return $\"camionnette {ChargeUtileKg} kg\";\n    }\n}\n\nclass Bus : Vehicule\n{\n    public int NombreDePlaces { get; private set; }\n\n    public Bus(string immatriculation, int kilometrage, int annee, int nombreDePlaces)\n        : base(immatriculation, kilometrage, annee)\n    {\n        this.NombreDePlaces = nombreDePlaces;\n    }\n\n    public override int CoutRevisionCentimes()\n    {\n        return base.CoutRevisionCentimes() + NombreDePlaces * 250;\n    }\n\n    public override bool DoitPasserAuControle(int anneeCourante)\n    {\n        return true;                                       // transport de personnes : tous les ans\n    }\n\n    public override string Categorie()\n    {\n        return $\"autocar {NombreDePlaces} places\";\n    }\n}",

      "enonce": "Deuxième jour : le type de couchage cesse d'être un texte et devient une classe. Pars de ton fichier d'hier. Retire du tarif toute saisie manuelle : la classe de base ne garde que le numéro, le secteur et l'état, et sa méthode de tarif <strong>ne rend plus que le supplément de vue</strong> — 300 centimes au bord de l'eau, zéro ailleurs. Fais-en dériver trois classes qui, chacune, <strong>reprennent le tarif de la mère et lui ajoutent</strong> le leur : la tente 900 centimes ; la caravane 1 400 centimes plus 50 par ampère souscrit ; le chalet 2 000 centimes plus 100 par couchage. Donne aussi à la mère un libellé de catégorie et une ligne de règlement — « silence de 22 h à 7 h » — que chaque fille complète à sa façon : aucun véhicule sur l'herbe pour la tente, groupe électrogène interdit pour la caravane, état des lieux au départ pour le chalet. Rouvre le camping avec les mêmes numéros qu'hier : caravanes n° 5 (Chênes, 10 A) et n° 6 (Chênes, 6 A) ; chalets n° 12 (Verger, 4 couchages) et n° 14 (Verger, 6 couchages) ; tentes n° 18 (Verger), n° 24, n° 31 et n° 37 (Rivière) ; caravane n° 23 (Rivière, 10 A). Respecte l'ordre d'hier : 5, 6, 12, 18, 23, 24, 31, 37, puis 14. Affiche le camping, la recette à guichet plein, le règlement de chaque emplacement, puis réserve les indices 0, 2, 4, 7 et 8 et tente une seconde fois le premier. Donne le nombre d'occupés, le taux d'occupation, la recette de la nuit, le nombre d'emplacements au bord de l'eau, le plus cher et le moins cher. Compte enfin les emplacements de chaque sorte, relève l'ampérage à provisionner pour les seules caravanes, et libère l'indice 2.",

      "reflexion": "Hier, un tarif de 2 500 € avait pu être saisi, refusé en silence, et vendu à zéro. Cherche aujourd'hui où cette faute pourrait encore se produire : il reste au moins un chiffre que la personne qui crée l'emplacement tape à la main. Dis lequel, dis ce qu'il produirait d'absurde, et dis pourquoi le programme ne s'en apercevrait toujours pas.",

        "Ton fichier ressemble à ceci :<br><code>class Emplacement</code><br><code>{</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public virtual int TarifNuitCentimes()</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;{ if (EstAuBordDeLEau()) { return …; } return 0; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public virtual string Categorie() { return \"…\"; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public virtual string Reglement() { return \"…\"; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public override string ToString()</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;{ return $\"… {Categorie()} … {TarifNuitCentimes() / 100.0:F2} …\"; }</code><br><code>}</code><br><code>class Caravane : Emplacement</code><br><code>{</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public Caravane(int …, string …, int …) : base(…, …)</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;{ this.Amperes = …; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public override int TarifNuitCentimes()</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;{ return base.TarifNuitCentimes() + 1400 + … * 50; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public override string Reglement()</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;{ return base.Reglement() + \"…\"; }</code><br><code>}</code><br><code>if (e is Caravane c) { … += c.Amperes; }</code>"

      "solution": "// Le camping des Quatre Vents, jour 2 : le type de couchage cesse d'être un mot.\nusing System;\nusing System.Collections.Generic;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        // Plus aucun tarif saisi à la main : chaque emplacement sait ce qu'il vaut.\n        List<Emplacement> camping = new List<Emplacement>();\n        camping.Add(new Caravane(5, \"Chênes\", 10));\n        camping.Add(new Caravane(6, \"Chênes\", 6));\n        camping.Add(new Chalet(12, \"Verger\", 4));\n        camping.Add(new Tente(18, \"Verger\"));\n        camping.Add(new Caravane(23, \"Rivière\", 10));\n        camping.Add(new Tente(24, \"Rivière\"));\n        camping.Add(new Tente(31, \"Rivière\"));\n        camping.Add(new Tente(37, \"Rivière\"));\n        camping.Add(new Chalet(14, \"Verger\", 6));\n\n        Console.WriteLine(\"LE CAMPING AVANT L'OUVERTURE\");\n        foreach (Emplacement e in camping)\n        {\n            Console.WriteLine(e);\n        }\n\n        Console.WriteLine();\n\n        int recetteMax = 0;\n        foreach (Emplacement e in camping)\n        {\n            recetteMax += e.TarifNuitCentimes();     // même appel, trois barèmes différents\n        }\n        Console.WriteLine($\"Recette d'une nuit à guichet plein : {recetteMax / 100.0:F2} €\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"LE RÈGLEMENT AFFICHÉ À L'ACCUEIL\");\n        foreach (Emplacement e in camping)\n        {\n            Console.WriteLine($\"N° {e.Numero} : {e.Reglement()}\");\n        }\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"LES RÉSERVATIONS DU JOUR\");\n        camping[0].Reserver();\n        camping[2].Reserver();\n        camping[4].Reserver();\n        camping[7].Reserver();\n        camping[8].Reserver();\n\n        // Le refus muet de la veille n'a pas bougé d'un pouce.\n        camping[0].Reserver();\n        Console.WriteLine($\"N° 5 après une seconde réservation : {camping[0].Occupe}\");\n\n        int occupes = 0;\n        int recette = 0;\n        foreach (Emplacement e in camping)\n        {\n            if (e.Occupe)\n            {\n                occupes++;\n                recette += e.TarifNuitCentimes();\n            }\n        }\n        Console.WriteLine($\"Emplacements occupés : {occupes} sur {camping.Count}\");\n        Console.WriteLine($\"Taux d'occupation : {occupes * 100 / camping.Count} %\");\n        Console.WriteLine($\"Recette de la nuit : {recette / 100.0:F2} €\");\n\n        Console.WriteLine();\n\n        int bordDeLEau = 0;\n        foreach (Emplacement e in camping)\n        {\n            if (e.EstAuBordDeLEau())\n            {\n                bordDeLEau++;\n            }\n        }\n        Console.WriteLine($\"Emplacements au bord de l'eau : {bordDeLEau}\");\n\n        Emplacement plusCher = camping[0];\n        Emplacement moinsCher = camping[0];\n        foreach (Emplacement e in camping)\n        {\n            if (e.TarifNuitCentimes() > plusCher.TarifNuitCentimes())\n            {\n                plusCher = e;\n            }\n            if (e.TarifNuitCentimes() < moinsCher.TarifNuitCentimes())\n            {\n                moinsCher = e;\n            }\n        }\n        Console.WriteLine($\"Le plus cher : {plusCher}\");\n        Console.WriteLine($\"Le moins cher : {moinsCher}\");\n\n        Console.WriteLine();\n\n        // Le comptage par sorte a besoin du type réel : le motif « is » le donne.\n        int tentes = 0;\n        int caravanes = 0;\n        int chalets = 0;\n        foreach (Emplacement e in camping)\n        {\n            if (e is Tente)\n            {\n                tentes++;\n            }\n            else if (e is Caravane)\n            {\n                caravanes++;\n            }\n            else if (e is Chalet)\n            {\n                chalets++;\n            }\n        }\n        Console.WriteLine($\"Tentes : {tentes} · Caravanes : {caravanes} · Chalets : {chalets}\");\n\n        Console.WriteLine();\n\n        // Le branchement électrique n'existe que sur les caravanes.\n        Console.WriteLine(\"BRANCHEMENTS À PRÉVOIR\");\n        int amperesTotal = 0;\n        foreach (Emplacement e in camping)\n        {\n            if (e is Caravane c)\n            {\n                amperesTotal += c.Amperes;\n                Console.WriteLine($\"N° {c.Numero} : {c.Amperes} A\");\n            }\n        }\n        Console.WriteLine($\"Ampérage à provisionner : {amperesTotal} A\");\n\n        Console.WriteLine();\n\n        camping[2].Liberer();\n        Console.WriteLine($\"N° 12 après départ : {camping[2]}\");\n    }\n}\n\nclass Emplacement\n{\n    public int Numero { get; private set; }\n    public string Secteur { get; private set; }\n    public bool Occupe { get; private set; }\n\n    public Emplacement(int numero, string secteur)\n    {\n        this.Numero = numero;\n        this.Secteur = secteur;\n        this.Occupe = false;\n    }\n\n    public bool EstAuBordDeLEau()\n    {\n        return Secteur == \"Rivière\";\n    }\n\n    // Le supplément de vue est commun à tous : les filles l'ajoutent par base.\n    public virtual int TarifNuitCentimes()\n    {\n        if (EstAuBordDeLEau())\n        {\n            return 300;\n        }\n        return 0;\n    }\n\n    public virtual string Categorie()\n    {\n        return \"emplacement nu\";\n    }\n\n    public virtual string Reglement()\n    {\n        return \"silence de 22 h à 7 h\";\n    }\n\n    public void Reserver()\n    {\n        if (!Occupe)\n        {\n            Occupe = true;\n        }\n    }\n\n    public void Liberer()\n    {\n        Occupe = false;\n    }\n\n    public override string ToString()\n    {\n        string etat = \"libre\";\n        if (Occupe)\n        {\n            etat = \"occupé\";\n        }\n        string vue = \"sans vue\";\n        if (EstAuBordDeLEau())\n        {\n            vue = \"bord de l'eau\";\n        }\n        return $\"N° {Numero} secteur {Secteur} ({vue}) — {Categorie()} — \"\n             + $\"{TarifNuitCentimes() / 100.0:F2} € la nuit — {etat}\";\n    }\n}\n\nclass Tente : Emplacement\n{\n    public Tente(int numero, string secteur) : base(numero, secteur)\n    {\n    }\n\n    public override int TarifNuitCentimes()\n    {\n        return base.TarifNuitCentimes() + 900;\n    }\n\n    public override string Categorie()\n    {\n        return \"tente\";\n    }\n\n    public override string Reglement()\n    {\n        return base.Reglement() + \" · aucun véhicule sur l'herbe\";\n    }\n}\n\nclass Caravane : Emplacement\n{\n    public int Amperes { get; private set; }\n\n    public Caravane(int numero, string secteur, int amperes) : base(numero, secteur)\n    {\n        this.Amperes = amperes;\n    }\n\n    public override int TarifNuitCentimes()\n    {\n        return base.TarifNuitCentimes() + 1400 + Amperes * 50;\n    }\n\n    public override string Categorie()\n    {\n        return $\"caravane {Amperes} A\";\n    }\n\n    public override string Reglement()\n    {\n        return base.Reglement() + \" · groupe électrogène interdit\";\n    }\n}\n\nclass Chalet : Emplacement\n{\n    public int Couchages { get; private set; }\n\n    public Chalet(int numero, string secteur, int couchages) : base(numero, secteur)\n    {\n        this.Couchages = couchages;\n    }\n\n    public override int TarifNuitCentimes()\n    {\n        return base.TarifNuitCentimes() + 2000 + Couchages * 100;\n    }\n\n    public override string Categorie()\n    {\n        return $\"chalet {Couchages} couchages\";\n    }\n\n    public override string Reglement()\n    {\n        return base.Reglement() + \" · état des lieux au départ\";\n    }\n}",
      "pourquoi": "Le neuvième emplacement d'hier — celui à 2 500 € — n'existe plus, et ce n'est pas parce qu'on a ajouté un contrôle : c'est parce qu'on a supprimé le champ où la faute pouvait s'écrire. Une donnée qu'on ne saisit pas est une donnée qu'on ne peut pas saisir de travers. C'est la forme la plus solide de validation, et elle ne coûte pas une ligne de test.",
      "checklist": [
        "La recette à guichet plein vaut-elle 153,00 € ? Hier, avec les mêmes emplacements, elle en valait 141,00.",
        "La recette de la nuit donne-t-elle 103,00 € pour cinq emplacements ?",
        "Le plus cher est-il le chalet n° 14 à 26,00 €, et le moins cher la tente n° 18 à 9,00 € ?",
        "L'ampérage à provisionner vaut-il 26 A ? Seules les trois caravanes comptent.",
        "As-tu bien 4 tentes, 3 caravanes et 2 chalets ?"
      ],
      "note": "Jour 2 sur 4. Le tarif est devenu un comportement, mais rien n'oblige encore une nouvelle sorte d'emplacement à en définir un : elle hériterait du supplément de vue et facturerait 3,00 € la nuit sans que personne ne s'en aperçoive. Demain, cette négligence deviendra impossible."
    }
  ]
};

var ECRITURE = {
  placeholder: "Écris ton code C# ici…",
  items: [
  { id: "cs-heritage", title: "Héritage : Animal et Chien", level: 3,
    statement: "Crée une classe <code>Animal</code> (attribut <code>nom</code>, méthode <code>virtual Crier()</code> qui affiche \"...\"), puis une classe <code>Chien</code> qui hérite d'Animal et redéfinit <code>Crier()</code> avec <code>override</code> en \"Wouf !\". Montre le <strong>polymorphisme</strong> dans <code>Main</code>.",
    hints: [
      "class Chien : Animal — les deux points établissent l'héritage en C#.",
      "En C#, la méthode du parent doit être marquée virtual pour être redéfinissable, et la fille utilise override.",
      "Le constructeur de Chien appelle celui du parent : public Chien(string nom) : base(nom) { }"
    ],
    atoi: { cmd: "dotnet run", expected: "Créature fait ...\nRex fait Wouf !" },
    checklist: ["Animal déclare Crier() avec le mot-clé virtual.", "Chien hérite via : Animal et appelle base(nom).", "Chien redéfinit Crier() avec le mot-clé override.", "Le polymorphisme choisit la version Chien pour l'objet réel."],
    solution: "using System;                                    // accès à Console\n\nclass Animal                                     // classe PARENT\n{                                                // début de la classe\n    protected string nom;                        // protected : visible dans les classes filles\n\n    public Animal(string nom)                    // constructeur du parent\n    {                                            // début du constructeur\n        this.nom = nom;                          // range le paramètre dans l'attribut\n    }                                            // fin du constructeur\n\n    public virtual void Crier()                  // virtual : les filles ONT LE DROIT de redéfinir\n    {                                            // début de Crier\n        Console.WriteLine($\"{nom} fait ...\");    // comportement par défaut\n    }                                            // fin de Crier\n}                                                // fin d'Animal\n\nclass Chien : Animal                             // Chien HÉRITE d'Animal (les deux points)\n{                                                // début de la classe\n    public Chien(string nom) : base(nom) { }     // base(nom) appelle le constructeur du PARENT\n\n    public override void Crier()                 // override : on REMPLACE la version du parent\n    {                                            // début de Crier\n        Console.WriteLine($\"{nom} fait Wouf !\"); // comportement spécifique au chien\n    }                                            // fin de Crier\n}                                                // fin de Chien\n\nclass TestHeritage                               // classe de test\n{                                                // début de la classe\n    static void Main()                           // point d'entrée du programme\n    {                                            // début de Main\n        Animal a = new Animal(\"Créature\");       // un animal générique\n        Animal b = new Chien(\"Rex\");             // POLYMORPHISME : type déclaré Animal, objet réel Chien\n        a.Crier();                               // affiche : Créature fait ...\n        b.Crier();                               // affiche : Rex fait Wouf ! (la version du Chien gagne)\n    }                                            // fin de Main\n}                                                // fin de TestHeritage",
    note: "Sans virtual/override, C# masquerait la méthode au lieu de la redéfinir — le duo est obligatoire." }
  ]
