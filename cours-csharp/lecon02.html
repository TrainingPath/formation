  theory: `
<h3>1. Une variable : une boîte étiquetée en mémoire</h3>
<p>Une <strong>variable</strong> est un emplacement en mémoire, désigné par un <strong>nom</strong>, qui contient une <strong>valeur</strong> d'un <strong>type</strong> donné. En C#, on <strong>déclare</strong> une variable en écrivant son type, puis son nom, puis (souvent) une valeur initiale.</p>
<pre class="pseudo">PSEUDOCODE       C#
age ← 15         int age = 15;            // int = entier ; age reçoit la valeur 15
prix ← 19.99     double prix = 19.99;     // double = nombre à virgule
estMajeur ← FAUX bool estMajeur = false;  // bool = vrai/faux (true/false)
prenom ← "Léa"   string nom = "Léa";      // string = texte (entre guillemets doubles), minuscule en C# !
lettre ← 'A'     char lettre = 'A';       // char = UN seul caractère (entre apostrophes simples)</pre>
<div class="warn">Le <code>=</code> affecte (notre ←) : il RANGE la valeur de droite dans la variable de gauche. L'égalité de comparaison est <code>==</code> (leçon 5). Note : en C# c'est <code>string</code> (minuscule) et <code>bool</code> (pas boolean comme Java).</div>

<h3>2. Les types courants et pourquoi ils existent</h3>
<p>Le type indique au compilateur COMMENT interpréter les octets en mémoire et quelles opérations sont permises. Choisir le bon type, c'est éviter les bugs.</p>
<pre class="pseudo">int      entier             int n = 42;                // nombres entiers (sans virgule)
long     grand entier       long big = 9000000000L;    // très grands entiers ; le L force le type long
double   réel               double d = 3.14;           // nombres à virgule (usage général)
decimal  réel PRÉCIS (€ !)   decimal prix = 19.99m;     // le m force le type decimal (argent, sans arrondi)
bool     booléen            bool ok = true;            // uniquement true ou false
char     un caractère       char c = 'A';              // un seul caractère, apostrophes simples
string   chaîne             string s = "Léa";          // une suite de caractères, guillemets doubles</pre>
<p>Nouveauté C# : le type <code>decimal</code> (suffixe <code>m</code>) pour l'argent. Un <code>double</code> stocke les nombres en base 2 et ne peut pas représenter exactement 0,1 ou 19,99 : d'infimes erreurs d'arrondi s'accumulent, catastrophique pour des euros. <code>decimal</code> travaille en base 10 et reste exact pour les montants.</p>

<h3>3. var : l'inférence de type</h3>
<pre class="pseudo">var age = 15;          // C# DEVINE le type d'après la valeur 15 → int
var nom = "Léa";       // la valeur est du texte → string
var prix = 19.99;      // la valeur a une virgule → double</pre>
<div class="tip"><code>var</code> laisse le compilateur déduire le type de la valeur initiale. Pratique, mais le type reste FORT et FIGÉ : <code>var age = 15; age = "quinze";</code> est une ERREUR, car age est devenu un int pour toujours. C'est du sucre syntaxique (on écrit moins), PAS du typage dynamique comme PHP où une variable peut changer de nature.</div>

<h3>4. Typage FORT (comme Java)</h3>
<pre class="pseudo">int n = 5;         // n est un entier
n = "cinq";        // ERREUR de compilation : on ne met pas du texte dans un int
double d = 5;      // OK : un int (5) rentre sans perte dans un double → conversion AUTOMATIQUE
int m = 5.9;       // ERREUR : mettre un double dans un int perdrait le « ,9 » → cast obligatoire (leçon 3)</pre>
<p>« Fortement typé » veut dire que le compilateur <strong>vérifie</strong> la cohérence des types AVANT l'exécution. Une conversion sûre (int → double, aucune perte) est automatique ; une conversion risquée (double → int, on perd la partie décimale) est <strong>refusée</strong> tant que tu ne demandes pas explicitement un cast. C'est une sécurité : les erreurs de type sont attrapées à la compilation, pas découvertes trop tard.</p>

<h3>5. Constantes</h3>
<pre class="pseudo">const double TVA = 0.21;      // const = valeur FIGÉE définitivement à la déclaration
TVA = 0.10;                   // ERREUR : on ne peut pas modifier une constante</pre>
<p>Une <strong>constante</strong> protège une valeur qui ne doit jamais changer (un taux, Pi…). Toute tentative de la réaffecter est refusée par le compilateur : c'est un garde-fou contre les modifications accidentelles.</p>

<h3>6. Conventions C# (attention, différentes de Java !)</h3>
<ul>
<li>Variables locales : <code>camelCase</code> → <code>prixTotal</code> (1re lettre minuscule)</li>
<li>Méthodes et propriétés : <code>PascalCase</code> → <code>CalculerTotal</code> (majuscule ! ≠ Java)</li>
<li>Classes : <code>PascalCase</code> → <code>CompteBancaire</code></li>
<li>Constantes : <code>PascalCase</code> aussi → <code>Tva</code></li>
</ul>
<p>Ces conventions ne changent rien pour le compilateur, mais rendent le code lisible et « idiomatique ». Respecter le style d'un langage, c'est écrire du code qu'un autre développeur C# lira sans effort.</p>`,

sultation : \" + TarifConsultation + \" € pour \"\n                          + DureeConsultationMinutes + \" minutes\");\n        Console.WriteLine(\"Détartrage   : \" + TarifDetartrage + \" €\");\n\n        // Une lettre, un booléen : les deux types les plus vite oubliés.\n        char salle = 'A';\n        bool urgence = false;\n        Console.WriteLine(\"Salle \" + salle + \" — urgence : \" + urgence);\n\n        Console.WriteLine();\n\n        // Le total d'une journée, calculé dans les deux monnaies du programme.\n        decimal totalDecimal = TarifConsultation + TarifConsultation + TarifDetartrage;\n        int totalCentimes = 2750 + 2750 + 6200;\n        Console.WriteLine(\"Total de la matinée : \" + totalDecimal + \" €\");\n        Console.WriteLine(\"Le même, en centimes entiers : \" + totalCentimes);\n    }\n}",

      "solution": "// Le stand de crêpes — jour 2 sur 4 : les prix deviennent des valeurs.\n// L'ardoise d'hier est reprise telle quelle ; ce qui change, c'est que les\n// prix ne sont plus des morceaux de texte mais des nombres nommés.\nusing System;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        // Les prix du stand : de l'argent, donc decimal, et figés, donc const.\n        const decimal PrixSucre = 2.00m;\n        const decimal PrixCassonade = 2.20m;\n        const decimal PrixChocolat = 3.00m;\n        const decimal SupplementChantilly = 0.50m;\n\n        // L'état du stand : cela, en revanche, bouge pendant la kermesse.\n        int patesRestantes = 120;\n        string tenancier = \"Comité des parents\";\n        char emplacement = 'C';\n        bool ouvert = true;\n\n        // L'ardoise du jour 1, inchangée.\n        Console.WriteLine(\"+----------------------------+\");\n        Console.WriteLine(\"|  LES CRÊPES DE LA KERMESSE |\");\n        Console.WriteLine(\"+----------------------------+\");\n        Console.WriteLine();\n\n        // La carte : le libellé est écrit, le prix est LU dans une variable.\n        Console.Write(\"Sucre\");\n        Console.WriteLine(\"\\t\\t\" + PrixSucre + \" €\");\n        Console.Write(\"Cassonade\");\n        Console.WriteLine(\"\\t\" + PrixCassonade + \" €\");\n        Console.Write(\"Chocolat\");\n        Console.WriteLine(\"\\t\" + PrixChocolat + \" €\");\n        Console.Write(\"Chantilly\");\n        Console.WriteLine(\"\\t+\" + SupplementChantilly + \" €\");\n\n        Console.WriteLine();\n\n        // Deux prix composés, obtenus sans réécrire aucun chiffre.\n        decimal chocolatChantilly = PrixChocolat + SupplementChantilly;\n        decimal sucreChantilly = PrixSucre + SupplementChantilly;\n        Console.WriteLine(\"Chocolat + chantilly : \" + chocolatChantilly + \" €\");\n        Console.WriteLine(\"Sucre + chantilly    : \" + sucreChantilly + \" €\");\n\n        Console.WriteLine();\n\n        // L'état du stand.\n        Console.WriteLine(\"Tenu par : \" + tenancier);\n        Console.WriteLine(\"Emplacement : \" + emplacement);\n        Console.WriteLine(\"Pâtes restantes : \" + patesRestantes);\n        Console.WriteLine(\"Ouvert : \" + ouvert);\n\n        // Une vente : la variable change de valeur, jamais de type.\n        patesRestantes = patesRestantes - 3;\n        Console.WriteLine(\"Après trois crêpes : \" + patesRestantes);\n\n        // La fermeture : un booléen se réaffecte comme n'importe quelle variable.\n        ouvert = false;\n        Console.WriteLine(\"Ouvert à 19h : \" + ouvert);\n\n        Console.WriteLine();\n\n        /* Le prix de la crêpe au chocolat n'est plus écrit qu'à UN endroit.\n           Le jour où le comité décide de le passer à 3,20 €, une seule ligne\n           change et les deux prix composés suivent tout seuls. Hier, il aurait\n           fallu retrouver le chiffre dans chaque ligne d'affichage. */\n        Console.WriteLine(\"Une seule ligne à changer si le chocolat augmente.\");\n    }\n}",
