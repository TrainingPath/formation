var DAY = {
  num: 2,
  title: "Variables et types",
  subtitle: "Les boîtes du jour 2 d'algorithmique, typées à la C#.",
  theory: `
<h3>1. Une variable : une boîte étiquetée en mémoire</h3>
<p>Une <strong>variable</strong> est un emplacement en mémoire, désigné par un <strong>nom</strong>, qui contient une <strong>valeur</strong> d'un <strong>type</strong> donné. En C#, on <strong>déclare</strong> une variable en écrivant son type, puis son nom, puis (souvent) une valeur initiale.</p>
<pre class="pseudo">PSEUDOCODE       C#
age ← 15         int age = 15;            // int = entier ; age reçoit la valeur 15
prix ← 19.99     double prix = 19.99;     // double = nombre à virgule
estMajeur ← FAUX bool estMajeur = false;  // bool = vrai/faux (true/false)
prenom ← "Léa"   string nom = "Léa";      // string = texte (entre guillemets doubles), minuscule en C# !
lettre ← 'A'     char lettre = 'A';       // char = UN seul caractère (entre apostrophes simples)</pre>
<div class="warn">Le <code>=</code> affecte (notre ←) : il RANGE la valeur de droite dans la variable de gauche. L'égalité de comparaison est <code>==</code> (leçon 5). Note : en C# c'est <code>string</code> (minuscule) et <code>bool</code> (pas boolean comme Java).</div>

<h3>2. Les types courants et pourquoi ils existent</h3>
<p>Le type indique au compilateur COMMENT interpréter les octets en mémoire et quelles opérations sont permises. Choisir le bon type, c'est éviter les bugs.</p>
<pre class="pseudo">int      entier             int n = 42;                // nombres entiers (sans virgule)
long     grand entier       long big = 9000000000L;    // très grands entiers ; le L force le type long
double   réel               double d = 3.14;           // nombres à virgule (usage général)
decimal  réel PRÉCIS (€ !)   decimal prix = 19.99m;     // le m force le type decimal (argent, sans arrondi)
bool     booléen            bool ok = true;            // uniquement true ou false
char     un caractère       char c = 'A';              // un seul caractère, apostrophes simples
string   chaîne             string s = "Léa";          // une suite de caractères, guillemets doubles</pre>
<p>Nouveauté C# : le type <code>decimal</code> (suffixe <code>m</code>) pour l'argent. Un <code>double</code> stocke les nombres en base 2 et ne peut pas représenter exactement 0,1 ou 19,99 : d'infimes erreurs d'arrondi s'accumulent, catastrophique pour des euros. <code>decimal</code> travaille en base 10 et reste exact pour les montants.</p>

<h3>3. var : l'inférence de type</h3>
<pre class="pseudo">var age = 15;          // C# DEVINE le type d'après la valeur 15 → int
var nom = "Léa";       // la valeur est du texte → string
var prix = 19.99;      // la valeur a une virgule → double</pre>
<div class="tip"><code>var</code> laisse le compilateur déduire le type de la valeur initiale. Pratique, mais le type reste FORT et FIGÉ : <code>var age = 15; age = "quinze";</code> est une ERREUR, car age est devenu un int pour toujours. C'est du sucre syntaxique (on écrit moins), PAS du typage dynamique comme PHP où une variable peut changer de nature.</div>

<h3>4. Typage FORT (comme Java)</h3>
<pre class="pseudo">int n = 5;         // n est un entier
n = "cinq";        // ERREUR de compilation : on ne met pas du texte dans un int
double d = 5;      // OK : un int (5) rentre sans perte dans un double → conversion AUTOMATIQUE
int m = 5.9;       // ERREUR : mettre un double dans un int perdrait le « ,9 » → cast obligatoire (leçon 3)</pre>
<p>« Fortement typé » veut dire que le compilateur <strong>vérifie</strong> la cohérence des types AVANT l'exécution. Une conversion sûre (int → double, aucune perte) est automatique ; une conversion risquée (double → int, on perd la partie décimale) est <strong>refusée</strong> tant que tu ne demandes pas explicitement un cast. C'est une sécurité : les erreurs de type sont attrapées à la compilation, pas découvertes trop tard.</p>

<h3>5. Constantes</h3>
<pre class="pseudo">const double TVA = 0.21;      // const = valeur FIGÉE définitivement à la déclaration
TVA = 0.10;                   // ERREUR : on ne peut pas modifier une constante</pre>
<p>Une <strong>constante</strong> protège une valeur qui ne doit jamais changer (un taux, Pi…). Toute tentative de la réaffecter est refusée par le compilateur : c'est un garde-fou contre les modifications accidentelles.</p>

<h3>6. Conventions C# (attention, différentes de Java !)</h3>
<ul>
<li>Variables locales : <code>camelCase</code> → <code>prixTotal</code> (1re lettre minuscule)</li>
<li>Méthodes et propriétés : <code>PascalCase</code> → <code>CalculerTotal</code> (majuscule ! ≠ Java)</li>
<li>Classes : <code>PascalCase</code> → <code>CompteBancaire</code></li>
<li>Constantes : <code>PascalCase</code> aussi → <code>Tva</code></li>
</ul>
<p>Ces conventions ne changent rien pour le compilateur, mais rendent le code lisible et « idiomatique ». Respecter le style d'un langage, c'est écrire du code qu'un autre développeur C# lira sans effort.</p>`,
  exercises: [
    { type: "qcm", q: "Traduire <code>age ← 15</code> en C# :", opts: ["age = 15", "int age = 15;", "var age := 15", "ENTIER age = 15"], a: 1, exp: "Type + nom + = + valeur + ; (comme Java)." },
    { type: "qcm", q: "Le type chaîne en C# s'écrit…", opts: ["String (majuscule comme Java)", "string (minuscule)", "str", "text"], a: 1, exp: "string minuscule — petite différence avec Java (String)." },
    { type: "qcm", q: "Le type booléen en C# :", opts: ["boolean", "bool", "Boolean", "bit"], a: 1, exp: "bool, pas boolean (Java) : valeurs true/false." },
    { type: "qcm", q: "Quel type pour un prix en euros, sans erreur d'arrondi ?", opts: ["double", "decimal (suffixe m : 19.99m)", "int", "float"], a: 1, exp: "decimal : le type argent de C#, plus précis que double." },
    { type: "qcm", q: "<code>var age = 15;</code> — quel type a age ?", opts: ["Aucun (dynamique)", "int : le compilateur l'infère de la valeur, et le fige", "string", "var"], a: 1, exp: "var = inférence, pas typage dynamique : age reste un int pour toujours." },
    { type: "qcm", q: "<code>var age = 15; age = \"quinze\";</code> :", opts: ["Légal comme en PHP", "ERREUR : le type inféré (int) est FIGÉ — C# reste fortement typé", "age devient string", "Warning"], a: 1, exp: "var ≠ dynamique : la différence clé avec PHP." },
    { type: "input", q: "Trace : <code>int a = 4; int b = a + 3; a = b * 2;</code> Que vaut <code>a</code> ?", a: "14", ph: "nombre", exp: "b = 7, a = 14 : la trace du jour 2, en C#." },
    { type: "qcm", q: "<code>int m = 5.9;</code> :", opts: ["m vaut 5", "ERREUR : double → int exige un cast explicite (leçon 3)", "m vaut 6", "m vaut 5.9"], a: 1, exp: "Typage fort : pas de perte de précision silencieuse." },
    { type: "qcm", q: "Le suffixe pour un decimal :", opts: ["d", "m (ex : 19.99m)", "f", "aucun"], a: 1, exp: "19.99m force le type decimal ; sans m, ce serait un double." },
    { type: "qcm", q: "Rendre une variable non modifiable :", opts: ["final", "const double Tva = 0.21;", "readonly toujours", "static"], a: 1, exp: "const en C# (Java utilisait final)." },
    { type: "qcm", q: "Convention C# pour une MÉTHODE nommée « calculer total » :", opts: ["calculerTotal (camelCase comme Java)", "CalculerTotal (PascalCase : majuscule !)", "calculer_total", "CALCULER_TOTAL"], a: 1, exp: "Différence notable : les méthodes C# sont en PascalCase, pas camelCase." },
    { type: "qcm", q: "Échanger deux int a et b :", opts: ["a = b; b = a;", "int temp = a; a = b; b = temp;", "swap(a, b)", "(a, b) = (b, a); fonctionne aussi en C#"], a: 1, exp: "La variable temporaire du jour 2. (Bonus : C# accepte aussi (a, b) = (b, a) !)" },
    { type: "qcm", q: "Quel type pour stocker « 07500 » (code postal) ?", opts: ["int", "string : le 0 initial compte, on ne calcule jamais avec", "double", "decimal"], a: 1, exp: "Identifiant → string : le piège du jour 3 d'algo, universel." },
    { type: "input", q: "Trace : <code>int x = 10; int y = x; x = 3;</code> Que vaut <code>y</code> ?", a: "10", ph: "nombre", exp: "y a une COPIE de 10 ; changer x ensuite ne l'affecte pas." },
    { type: "qcm", q: "<code>int x; Console.WriteLine(x);</code> :", opts: ["Affiche 0", "ERREUR : variable locale non assignée (comme Java, plus strict que PHP)", "Affiche null", "Affiche x"], a: 1, exp: "C# refuse de lire une variable locale non initialisée." }
  ],
  final: {
    title: "Exercice final — La fiche membre (version C#)",
    intro: `<p>La fiche du club, quatrième traduction (pseudocode, Java, PHP, et maintenant C#) :</p>
<pre class="pseudo">string nom = "Martin";

??? cotisation = 25.50m;

    questions: [
      { type: "qcm", q: "Les trois ??? (age, cotisation, aPaye) :", opts: ["int, decimal, bool", "int, double, boolean", "Integer, decimal, bool", "int, decimal, boolean"], a: 0, exp: "ENTIER→int, REEL€→decimal (le m !), BOOLEEN→bool." },
      { type: "input", q: "Que vaut <code>numero</code> ?", a: "20264", ph: "nombre", exp: "2026 × 10 + 4 : le calcul du jour 3, quatrième langage." },
      { type: "qcm", q: "On ajoute <code>Annee = 2027;</code> après. Résultat ?", opts: ["Annee vaut 2027", "ERREUR : Annee est const", "Warning", "2026"], a: 1, exp: "const = figé, comme final en Java." },
      { type: "qcm", q: "<code>$\"{nom} - {numero}\"</code> est…", opts: ["Une concaténation avec +", "Une chaîne INTERPOLÉE (le $ devant) : les {variables} sont remplacées", "Une erreur", "Du SQL"], a: 1, exp: "L'interpolation C# ($\"...\") ressemble aux guillemets doubles de PHP. Détaillée leçon 9 !" },
      { type: "qcm", q: "Pourquoi decimal (25.50m) plutôt que double pour la cotisation ?", opts: ["Plus rapide", "decimal évite les erreurs d'arrondi sur les montants d'argent : le type financier de C#", "double est interdit", "Pour l'interpolation"], a: 1, exp: "Nouveauté C# vs Java : le type dédié à la monnaie." }
    ],
    solution: `<pre class="pseudo">string nom = "Martin";
int age = 15;
decimal cotisation = 25.50m;
bool aPaye = true;
const int Annee = 2026;
int numero = Annee * 10 + 4;      // 20264
Console.WriteLine($"{nom} - {numero}");   // Martin - 20264</pre>
<p>Table de traduction C# : ENTIER→int · REEL→double (ou decimal pour €) · BOOLEEN→bool · CHAINE→string · caractère→char. Quatrième fiche, mêmes idées. Demain : opérateurs, conversions et Math.</p>`
  }
};

  { id: "cs-echange", title: "L'échange de deux variables", level: 1,
    statement: "Deux variables <code>int a = 5</code> et <code>int b = 9</code>. Échange leurs contenus sans réécrire les valeurs en dur, puis affiche-les.",
    hints: [
      "Si tu écris a = b directement, l'ancienne valeur de a est perdue.",
      "Il faut une troisième variable pour sauvegarder a avant l'écrasement.",
      "Trois étapes : int temp = a; puis a = b; puis b = temp;"
    ],
    solution: "using System;                                    // accès à Console\n\nclass Echange                                    // déclaration de la classe\n{                                                // début de la classe\n    static void Main()                           // point d'entrée du programme\n    {                                            // début de Main\n        int a = 5;                               // valeur de départ de a\n        int b = 9;                               // valeur de départ de b\n        int temp = a;                            // 1) sauvegarde a (temp vaut 5)\n        a = b;                                   // 2) a reçoit la valeur de b (a vaut 9)\n        b = temp;                                // 3) b reçoit la sauvegarde (b vaut 5)\n        Console.WriteLine($\"a = {a}\");           // affiche : a = 9\n        Console.WriteLine($\"b = {b}\");           // affiche : b = 5\n    }                                            // fin de Main\n}                                                // fin de la classe",
    note: "Depuis C# 7 on peut écrire (a, b) = (b, a); — mais comprends d'abord la version à 3 étapes !" }
  ]
};
