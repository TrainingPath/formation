  title: "Collections avancées et IEnumerable",
  subtitle: "Choisir la bonne boîte de rangement et comprendre ce qu'elles ont en commun.",
  theory: `
<h3>1. Chaque collection a sa spécialité</h3>
<p>La <code>List&lt;T&gt;</code> n'est qu'une boîte parmi d'autres. Choisir la bonne collection, c'est comme choisir le bon meuble de rangement : une étagère, un tiroir à clés, une file d'attente… Chacune brille pour un usage précis.</p>

<h3>2. HashSet : des éléments UNIQUES, recherche ultra-rapide</h3>
<p>Un <strong>HashSet</strong> (ensemble) ne garde jamais de doublon et répond très vite à « contient-il tel élément ? ». Analogie : une liste d'invités où chaque nom n'apparaît qu'une fois, et où l'on vérifie une présence en un clin d'œil.</p>
<pre class="pseudo">HashSet&lt;string&gt; tags = new HashSet&lt;string&gt;();  // un ensemble de tags uniques
tags.Add("urgent");                             // ajoute
tags.Add("urgent");                             // IGNORÉ : le doublon n'est pas ajouté
bool a = tags.Contains("urgent");               // recherche quasi instantanée → true
Console.WriteLine(tags.Count);                  // 1 : un seul « urgent »</pre>
<div class="tip">Recherche dans une <code>List</code> : elle parcourt tout (lent si grande). Dans un <code>HashSet</code> : accès direct par « hachage », quasi instantané. Utilise un HashSet dès que l'unicité ou la recherche fréquente compte.</div>

<h3>3. Queue et Stack : file et pile</h3>
<pre class="pseudo">Queue&lt;string&gt; file = new Queue&lt;string&gt;();   // FILE : premier arrivé, premier servi (FIFO)
file.Enqueue("A"); file.Enqueue("B");        // Enqueue = ajouter à la fin
string x = file.Dequeue();                    // Dequeue = retirer le PREMIER → "A"

Stack&lt;string&gt; pile = new Stack&lt;string&gt;();   // PILE : dernier arrivé, premier sorti (LIFO)
pile.Push("A"); pile.Push("B");               // Push = poser au sommet
string y = pile.Pop();                        // Pop = retirer le DERNIER → "B"</pre>
<div class="warn">FIFO (Queue) = comme une file de supermarché. LIFO (Stack) = comme une pile d'assiettes : on reprend celle du dessus. Le choix dépend de l'ordre voulu.</div>

<h3>4. IEnumerable : le point commun de TOUTES les collections</h3>
<p><strong>IEnumerable&lt;T&gt;</strong> est l'interface que respectent List, HashSet, Queue, tableaux… Elle promet une seule chose : « je peux être PARCOURUE élément par élément avec <code>foreach</code> ». C'est le plus petit dénominateur commun, comme un tapis roulant qui livre les objets un à un, sans dire combien il y en a ni comment ils sont rangés.</p>
<pre class="pseudo">static void Afficher(IEnumerable&lt;string&gt; items)  // accepte N'IMPORTE quelle collection de string
{                                                 // début
    foreach (var it in items)                     // on la parcourt, peu importe son vrai type
        Console.WriteLine(it);                     // affiche chaque élément
}
Afficher(new List&lt;string&gt; { "a" });              // marche avec une List
Afficher(new HashSet&lt;string&gt; { "b" });           // marche aussi avec un HashSet</pre>
<div class="tip">Typer un paramètre en <code>IEnumerable&lt;T&gt;</code> plutôt qu'en <code>List&lt;T&gt;</code> rend ta méthode plus GÉNÉRALE : elle accepte toute collection parcourable. LINQ (leçon 21) opère justement sur des IEnumerable.</div>

<h3>5. yield return : fabriquer une séquence à la demande</h3>
<p>Le mot-clé <strong>yield return</strong> produit les éléments UN À UN, à la demande, sans construire toute la liste en mémoire. C'est un distributeur qui délivre l'article suivant seulement quand tu appuies, au lieu de tout sortir d'un coup.</p>
<pre class="pseudo">static IEnumerable&lt;int&gt; Pairs(int max)      // renvoie une séquence d'entiers pairs
{                                           // début
    for (int i = 0; i &lt;= max; i += 2)      // de 0 à max par pas de 2
        yield return i;                     // livre i, puis SE MET EN PAUSE jusqu'au prochain besoin
}
foreach (int p in Pairs(6))                 // consomme la séquence : 0, 2, 4, 6
    Console.WriteLine(p);                   // chaque valeur est produite au dernier moment</pre>

<h3>6. Quelle collection choisir ?</h3>
<pre class="pseudo">Besoin d'un ordre + accès par index      → List&lt;T&gt;
Éléments uniques / recherche rapide      → HashSet&lt;T&gt;
Association clé → valeur                  → Dictionary&lt;K,V&gt;
File d'attente (FIFO)                     → Queue&lt;T&gt;
Pile (LIFO)                              → Stack&lt;T&gt;
Juste parcourir (paramètre générique)    → IEnumerable&lt;T&gt;</pre>`,
  exercises: [

    { type: "qcm", q: "Ajouter deux fois \"urgent\" à un HashSet donne un Count de…", opts: ["2", "1 : le doublon est ignoré", "0", "Erreur"], a: 1, exp: "Un HashSet ne stocke chaque valeur qu'une fois." },
    { type: "qcm", q: "Pourquoi <code>Contains</code> est plus rapide sur un HashSet que sur une List ?", opts: ["Il ne l'est pas", "Le HashSet accède par hachage (direct) ; la List parcourt tout", "Le HashSet est trié", "La List doit être triée au préalable"], a: 1, exp: "Recherche directe vs parcours complet." },
    { type: "qcm", q: "Une Queue fonctionne en…", opts: ["LIFO", "FIFO : premier arrivé, premier servi", "Aléatoire", "Trié"], a: 1, exp: "Comme une file de supermarché." },
    { type: "qcm", q: "Sur une Queue, <code>Dequeue()</code> retire…", opts: ["Le dernier ajouté", "Le PREMIER élément (le plus ancien)", "Un élément au hasard", "L'élément du milieu"], a: 1, exp: "FIFO : on sert le plus ancien." },
    { type: "qcm", q: "Une Stack fonctionne en…", opts: ["FIFO", "LIFO : dernier arrivé, premier sorti", "Trié", "Aléatoire"], a: 1, exp: "Comme une pile d'assiettes." },
    { type: "qcm", q: "Sur une Stack, <code>Pop()</code> retire…", opts: ["Le premier ajouté", "Le DERNIER élément (celui du sommet)", "Le plus petit", "L'élément du fond de la pile"], a: 1, exp: "LIFO : on reprend celui du dessus." },
    { type: "qcm", q: "Que promet l'interface <code>IEnumerable&lt;T&gt;</code> ?", opts: ["Un tri", "Qu'on peut la PARCOURIR élément par élément (foreach)", "Un accès par index", "L'unicité"], a: 1, exp: "Le plus petit dénominateur commun des collections." },
    { type: "vf", q: "List, HashSet, Queue et les tableaux sont tous des IEnumerable.", a: true, exp: "Toutes ces collections sont parcourables." },
    { type: "qcm", q: "Typer un paramètre en <code>IEnumerable&lt;T&gt;</code> plutôt que <code>List&lt;T&gt;</code> rend la méthode…", opts: ["Plus lente", "Plus GÉNÉRALE : elle accepte toute collection parcourable", "Incompatible avec les tableaux", "Limitée aux seules List<T>"], a: 1, exp: "Elle marche avec List, HashSet, tableau…" },
    { type: "qcm", q: "Sur quoi opèrent les méthodes LINQ (Where, Select) ?", opts: ["Uniquement des List", "Des IEnumerable<T> (toute collection parcourable)", "Uniquement des Dictionary", "Des chaînes de caractères"], a: 1, exp: "LINQ étend IEnumerable." },
    { type: "qcm", q: "<code>yield return</code> sert à…", opts: ["Retourner toute une liste d'un coup", "Produire les éléments UN À UN, à la demande, sans tout construire", "Trier la séquence renvoyée", "Interrompre définitivement la méthode"], a: 1, exp: "Un distributeur qui délivre au fur et à mesure." },
    { type: "vf", q: "Avec <code>yield return</code>, la méthode se met en pause après chaque valeur et reprend au besoin suivant.", a: true, exp: "Production paresseuse, élément par élément." },
    { type: "qcm", q: "Pour associer une clé à une valeur (nom → score), on choisit…", opts: ["Queue", "Dictionary<K,V>", "Stack", "HashSet"], a: 1, exp: "Le dictionnaire fait le lien clé → valeur." },
    { type: "qcm", q: "Besoin d'un ordre ET d'un accès par index [i] : quelle collection ?", opts: ["HashSet", "List<T>", "Queue", "Stack"], a: 1, exp: "La List garde l'ordre et l'index." }
  ],
  final: {
    title: "Exercice final — Dédoublonner puis traiter en file",
    intro: `<p>On reçoit une liste de tâches avec des doublons. On veut d'abord les rendre uniques (HashSet), puis les traiter dans l'ordre d'arrivée (Queue).</p>
<pre class="pseudo">List&lt;string&gt; brut = new List&lt;string&gt; { "A", "B", "A", "C", "B" };
HashSet&lt;string&gt; uniques = new HashSet&lt;string&gt;(brut);  // (1) supprime les doublons
Queue&lt;string&gt; aFaire = new Queue&lt;string&gt;(uniques);   // (2) file d'attente

int total = uniques.Count;                            // (3) combien d'uniques ?
string premier = aFaire.Dequeue();                    // (4) on traite le premier
static void Traiter(IEnumerable&lt;string&gt; items) { }    // (5) accepte List, HashSet ou Queue</pre>`,
    questions: [
      { type: "qcm", q: "(1) Après <code>new HashSet(brut)</code>, combien d'éléments dans <code>uniques</code> ?", opts: ["5", "3 : A, B, C — les doublons sont éliminés", "2", "0"], a: 1, exp: "A et B en double sont fusionnés." },
      { type: "qcm", q: "(2) Pourquoi mettre les uniques dans une Queue ?", opts: ["Pour trier", "Pour les traiter dans l'ordre (FIFO) : premier arrivé, premier servi", "Pour les compter", "Pour y accéder ensuite par index"], a: 1, exp: "La Queue impose l'ordre de traitement." },
      { type: "qcm", q: "(3) <code>uniques.Count</code> vaut…", opts: ["5", "3", "2", "1"], a: 1, exp: "Trois éléments distincts." },
      { type: "qcm", q: "(4) <code>aFaire.Dequeue()</code> renvoie…", opts: ["Le dernier", "Le PREMIER élément de la file (FIFO)", "Un au hasard", "L'élément ajouté en dernier"], a: 1, exp: "Dequeue retire le plus ancien." },
      { type: "vf", q: "(5) <code>Traiter</code> typée en IEnumerable&lt;string&gt; accepte aussi bien une List qu'un HashSet ou une Queue.", a: true, exp: "IEnumerable est le point commun de toutes ces collections." }
    ],
    solution: `<pre class="pseudo">new HashSet(brut)   → {A, B, C}     // doublons supprimés automatiquement
new Queue(uniques)  → file A,B,C    // ordre de traitement (FIFO)
uniques.Count       → 3             // nombre d'éléments distincts
Dequeue()           → "A"           // le premier arrivé
IEnumerable param   → accepte tout  // List, HashSet, Queue, tableau…</pre>
<p>Bonne collection = bon outil : HashSet pour l'unicité, Queue pour l'ordre, IEnumerable pour la généralité. Prochaine leçon : tester son code avec xUnit.</p>`
  }
};
