  title: "Les tableaux en C#",
  subtitle: "Les jours 14-15 d'algorithmique, indices à partir de 0.",
  theory: `
<h3>1. Qu'est-ce qu'un tableau ?</h3>
<p>Un <strong>tableau</strong> range PLUSIEURS valeurs du même type dans une seule variable, dans des <strong>cases</strong> numérotées. Au lieu de <code>note1, note2, note3…</code>, on a un seul <code>notes</code> avec des cases.</p>
<pre class="pseudo">int[] notes = new int[5];            // crée un tableau de 5 cases d'entiers, toutes remplies de 0 par défaut
int[] t = { 12, 8, 15, 10, 14 };     // création AVEC ses valeurs (la taille, 5, est déduite)
string[] noms = new string[3];       // 3 cases de string, remplies de null (pas encore de texte)</pre>
<p><code>new int[5]</code> réserve la place en mémoire ; les cases numériques valent 0, les string valent <code>null</code>, les bool <code>false</code>.</p>

<h3>2. Indices à partir de 0 (comme Java)</h3>
<pre class="pseudo">int[] t = { 12, 8, 15, 10, 14 };     // 5 valeurs
indices :   0     1     2     3     4  // chaque case a un NUMÉRO (indice), à partir de 0
t[0] → 12    (première case)          // t[0] = la 1re case
t[4] → 14    (dernière : Length - 1)  // la dernière case a l'indice « taille - 1 »
t[5] → IndexOutOfRangeException !     // t[5] n'existe pas → erreur de débordement à l'exécution</pre>
<p>Le piège universel : avec 5 cases, les indices vont de <strong>0 à 4</strong>. Accéder à <code>t[5]</code> sort du tableau et lève une exception.</p>

<h3>3. La taille : Length</h3>
<pre class="pseudo">int n = t.Length;        // Length = le NOMBRE de cases (5). Propriété, donc PAS de parenthèses (comme Java)</pre>
<p><code>Length</code> s'écrit avec une majuscule et sans <code>()</code> : c'est une <em>propriété</em>, pas une méthode. On l'utilise pour parcourir le tableau sans coder « en dur » sa taille.</p>

<h3>4. Le parcours d'un tableau</h3>
<pre class="pseudo">// PAR INDICES (permet de connaître/modifier la position)
for (int i = 0; i &lt; t.Length; i++)       // i part de 0 et va jusqu'à Length-1 grâce au < STRICT
{
    Console.WriteLine(t[i]);             // affiche la case numéro i
}
// FOREACH (plus simple, pour juste lire les valeurs)
foreach (int val in t) { Console.WriteLine(val); }   // val prend chaque valeur, sans gérer d'indice</pre>
<div class="tip">Formule magique (identique à Java) : <code>for (int i = 0; i &lt; t.Length; i++)</code>. Le <code>&lt;</code> STRICT (et non <code>&lt;=</code>) fait pile le bon nombre de tours et évite le débordement.</div>

<h3>5. Les motifs classiques (somme, maximum)</h3>
<pre class="pseudo">// SOMME de toutes les cases
int somme = 0;                                       // accumulateur à 0
for (int i = 0; i &lt; t.Length; i++) { somme += t[i]; } // on ajoute chaque case au total

// MAXIMUM : on prend la 1re case comme « champion » provisoire
int max = t[0];                                      // hypothèse : le plus grand est en case 0
for (int i = 1; i &lt; t.Length; i++)                   // on compare à partir de la case 1
{
    if (t[i] &gt; max) { max = t[i]; }                  // si on trouve plus grand, il devient le nouveau champion
}</pre>
<p>Le motif du maximum (« champion provisoire » qu'on remplace dès qu'on trouve mieux) est fondamental : on le réutilisera pour trier, chercher, comparer.</p>

<h3>6. Les tableaux 2D (matrices)</h3>
<pre class="pseudo">int[,] grille = new int[3, 4];       // tableau à 2 dimensions : 3 lignes × 4 colonnes (la virgule sépare les dimensions)
grille[1, 2] = 7;                    // range 7 en ligne 1, colonne 2 (un seul crochet, une virgule)
int lignes = grille.GetLength(0);    // GetLength(0) = nombre de lignes → 3
int colonnes = grille.GetLength(1);  // GetLength(1) = nombre de colonnes → 4</pre>
<div class="warn">Différence avec Java : le tableau 2D C# s'écrit <code>int[,]</code> et s'accède <code>grille[i, j]</code> (une virgule, un seul crochet). Java utilisait <code>int[][]</code> et <code>grille[i][j]</code>. Un accès hors limites lève une <code>IndexOutOfRangeException</code>.</div>`,

<pre class="pseudo">int[] ventes = { 120, 80, 150, 60, 90, 100 };

      "solution": "// Les relevés de pluviométrie : un tableau, et les quatre motifs qui vont avec.\nusing System;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        // Création AVEC les valeurs : la taille se déduit toute seule.\n        int[] millimetres = { 4, 0, 12, 3, 0, 21, 7 };\n        string[] jours = { \"lun\", \"mar\", \"mer\", \"jeu\", \"ven\", \"sam\", \"dim\" };\n\n        // Création VIDE : sept cases d'entiers, toutes à zéro.\n        int[] cumul = new int[7];\n\n        Console.WriteLine($\"Relevés : {millimetres.Length} jours\");\n        Console.WriteLine($\"Première case : {millimetres[0]} mm\");\n        Console.WriteLine($\"Dernière case : {millimetres[millimetres.Length - 1]} mm\");\n\n        Console.WriteLine();\n\n        // Parcours PAR INDICES : la position est connue, donc utilisable.\n        Console.WriteLine(\"--- Semaine ---\");\n        for (int i = 0; i < millimetres.Length; i++)\n        {\n            Console.WriteLine($\"  {jours[i]} : {millimetres[i]} mm\");\n        }\n\n        Console.WriteLine();\n\n        // Parcours SANS indice : plus court quand la position ne sert pas.\n        int total = 0;\n        foreach (int mm in millimetres)\n        {\n            total += mm;\n        }\n        Console.WriteLine($\"Total de la semaine : {total} mm\");\n\n        // Compteur conditionnel.\n        int joursSecs = 0;\n        foreach (int mm in millimetres)\n        {\n            if (mm == 0)\n            {\n                joursSecs++;\n            }\n        }\n        Console.WriteLine($\"Jours sans pluie : {joursSecs}\");\n\n        // Le champion provisoire : on part de la première case, pas de zéro.\n        int max = millimetres[0];\n        int indiceMax = 0;\n        for (int i = 1; i < millimetres.Length; i++)\n        {\n            if (millimetres[i] > max)\n            {\n                max = millimetres[i];\n                indiceMax = i;\n            }\n        }\n        Console.WriteLine($\"Jour le plus arrosé : {jours[indiceMax]} avec {max} mm\");\n\n        // Le cumul progressif, rangé dans le tableau vide créé plus haut.\n        cumul[0] = millimetres[0];\n        for (int i = 1; i < millimetres.Length; i++)\n        {\n            cumul[i] = cumul[i - 1] + millimetres[i];\n        }\n        Console.Write(\"Cumul : \");\n        foreach (int c in cumul)\n        {\n            Console.Write(c + \" \");\n        }\n        Console.WriteLine();\n\n        Console.WriteLine();\n\n        // Le tableau à deux dimensions : trois stations, quatre semaines.\n        int[,] grille = new int[3, 4];\n        for (int station = 0; station < grille.GetLength(0); station++)\n        {\n            for (int semaine = 0; semaine < grille.GetLength(1); semaine++)\n            {\n                grille[station, semaine] = (station + 1) * (semaine + 2);\n            }\n        }\n\n        Console.WriteLine($\"Grille : {grille.GetLength(0)} stations × \"\n                          + $\"{grille.GetLength(1)} semaines\");\n        for (int station = 0; station < grille.GetLength(0); station++)\n        {\n            Console.Write($\"  Station {station + 1} : \");\n            for (int semaine = 0; semaine < grille.GetLength(1); semaine++)\n            {\n                Console.Write(grille[station, semaine] + \" \");\n            }\n            Console.WriteLine();\n        }\n\n        // Un accès hors limites lèverait une exception : la ligne reste commentée.\n        // Console.WriteLine(millimetres[7]);\n    }\n}",

      "solution": "// Le tournoi de badminton : deux tableaux qui vont ensemble, et une grille\n// des rencontres. Le piège du jour : les indices doivent rester alignés.\nusing System;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        string[] joueurs = { \"Adam\", \"Bilal\", \"Chloé\", \"Dounia\", \"Ewen\" };\n        int[] points = new int[joueurs.Length];\n        int[] matchsJoues = new int[joueurs.Length];\n\n        // La grille des rencontres : qui a battu qui, en nombre de sets gagnés.\n        int[,] sets = new int[joueurs.Length, joueurs.Length];\n        sets[0, 1] = 2; sets[1, 0] = 1;\n        sets[0, 2] = 0; sets[2, 0] = 2;\n        sets[1, 2] = 2; sets[2, 1] = 2;\n        sets[3, 4] = 2; sets[4, 3] = 0;\n        sets[0, 4] = 2; sets[4, 0] = 1;\n\n        Console.WriteLine($\"Tournoi à {joueurs.Length} joueurs\");\n        Console.WriteLine();\n\n        // Dépouillement : trois points par victoire, un par match nul.\n        for (int a = 0; a < joueurs.Length; a++)\n        {\n            for (int b = 0; b < joueurs.Length; b++)\n            {\n                if (a == b)\n                {\n                    continue;\n                }\n                int pourA = sets[a, b];\n                int pourB = sets[b, a];\n                if (pourA == 0 && pourB == 0)\n                {\n                    continue;\n                }\n                matchsJoues[a]++;\n                if (pourA > pourB)\n                {\n                    points[a] += 3;\n                }\n                else if (pourA == pourB)\n                {\n                    points[a] += 1;\n                }\n            }\n        }\n\n        Console.WriteLine(\"--- Classement provisoire ---\");\n        for (int i = 0; i < joueurs.Length; i++)\n        {\n            Console.WriteLine($\"  {joueurs[i]} : {points[i]} pt(s), \"\n                              + $\"{matchsJoues[i]} match(s)\");\n        }\n\n        Console.WriteLine();\n\n        // Le champion provisoire, sur le tableau des points.\n        int meilleur = 0;\n        for (int i = 1; i < points.Length; i++)\n        {\n            if (points[i] > points[meilleur])\n            {\n                meilleur = i;\n            }\n        }\n        Console.WriteLine($\"En tête : {joueurs[meilleur]} avec {points[meilleur]} points\");\n\n        // Le minimum, écrit exactement de la même façon.\n        int dernier = 0;\n        for (int i = 1; i < points.Length; i++)\n        {\n            if (points[i] < points[dernier])\n            {\n                dernier = i;\n            }\n        }\n        Console.WriteLine($\"Lanterne rouge : {joueurs[dernier]} avec {points[dernier]} points\");\n\n        // Somme et moyenne, en séparant le cas où personne n'a joué.\n        int totalPoints = 0;\n        int joueursActifs = 0;\n        for (int i = 0; i < points.Length; i++)\n        {\n            totalPoints += points[i];\n            if (matchsJoues[i] > 0)\n            {\n                joueursActifs++;\n            }\n        }\n        Console.WriteLine($\"Points distribués : {totalPoints}\");\n        if (joueursActifs > 0)\n        {\n            Console.WriteLine($\"Moyenne par joueur actif : {totalPoints / joueursActifs} pt(s)\");\n        }\n        else\n        {\n            Console.WriteLine(\"Aucun match joué : pas de moyenne.\");\n        }\n\n        Console.WriteLine();\n\n        // La grille, affichée avec ses en-têtes. Les initiales sont écrites à\n        // la main : découper un texte n'est pas encore à ton programme (leçon 9).\n        string[] initiales = { \"Ada\", \"Bil\", \"Chl\", \"Dou\", \"Ewe\" };\n        Console.Write(\"\\t\");\n        for (int b = 0; b < initiales.Length; b++)\n        {\n            Console.Write(initiales[b] + \"\\t\");\n        }\n        Console.WriteLine();\n        for (int a = 0; a < sets.GetLength(0); a++)\n        {\n            Console.Write(initiales[a] + \"\\t\");\n            for (int b = 0; b < sets.GetLength(1); b++)\n            {\n                Console.Write(sets[a, b] + \"\\t\");\n            }\n            Console.WriteLine();\n        }\n\n        Console.WriteLine();\n        Console.WriteLine(\"Un accès à sets[5, 0] lèverait une exception : la grille est 5 × 5.\");\n    }\n}",

      "solution": "// La patinoire municipale — jour 3 sur 4 : la semaine entière.\n// Les compteurs isolés d'hier ne suffisent plus : sept jours, ça se range\n// dans un tableau — et la boucle, elle, ne change pas de nature.\nusing System;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        const int CapaciteGlace = 6;\n\n        string[] jours = { \"lundi\", \"mardi\", \"mercredi\", \"jeudi\",\n                           \"vendredi\", \"samedi\", \"dimanche\" };\n\n        // Trois tableaux qui vont ensemble : même longueur, mêmes indices.\n        int[] entrees = { 4, 6, 3, 5, 6, 6, 2 };\n        int[] recetteCentimes = { 3200, 3900, 2250, 4100, 5400, 5850, 1500 };\n        int[] patinsLoues = { 2, 5, 1, 3, 4, 6, 0 };\n\n        Console.WriteLine(\"PATINOIRE MUNICIPALE — bilan de la semaine\");\n        Console.WriteLine();\n\n        // Parcours par indices : ici la position sert, elle donne le jour.\n        for (int i = 0; i < jours.Length; i++)\n        {\n            int libres = CapaciteGlace - entrees[i];\n            Console.WriteLine($\"  {jours[i]} : {entrees[i]} entrées, \"\n                              + $\"{recetteCentimes[i] / 100.0:F2} €, \"\n                              + $\"{patinsLoues[i]} paire(s), {libres} place(s) libre(s)\");\n        }\n\n        Console.WriteLine();\n\n        // Accumulateurs : un parcours, trois totaux.\n        int totalEntrees = 0;\n        int totalRecette = 0;\n        int totalPatins = 0;\n        for (int i = 0; i < entrees.Length; i++)\n        {\n            totalEntrees += entrees[i];\n            totalRecette += recetteCentimes[i];\n            totalPatins += patinsLoues[i];\n        }\n        Console.WriteLine($\"Entrées de la semaine : {totalEntrees}\");\n        Console.WriteLine($\"Recette de la semaine : {totalRecette / 100.0:F2} €\");\n        Console.WriteLine($\"Paires louées : {totalPatins}\");\n\n        // Le champion provisoire, gardé par son INDICE : on veut aussi le jour.\n        int iMeilleur = 0;\n        for (int i = 1; i < recetteCentimes.Length; i++)\n        {\n            if (recetteCentimes[i] > recetteCentimes[iMeilleur])\n            {\n                iMeilleur = i;\n            }\n        }\n        Console.WriteLine($\"Meilleur jour : {jours[iMeilleur]} avec \"\n                          + $\"{recetteCentimes[iMeilleur] / 100.0:F2} €\");\n\n        int iPire = 0;\n        for (int i = 1; i < recetteCentimes.Length; i++)\n        {\n            if (recetteCentimes[i] < recetteCentimes[iPire])\n            {\n                iPire = i;\n            }\n        }\n        Console.WriteLine($\"Jour le plus creux : {jours[iPire]} avec \"\n                          + $\"{recetteCentimes[iPire] / 100.0:F2} €\");\n\n        // Compteur conditionnel : combien de jours à guichets fermés ?\n        int joursPleins = 0;\n        foreach (int e in entrees)\n        {\n            if (e >= CapaciteGlace)\n            {\n                joursPleins++;\n            }\n        }\n        Console.WriteLine($\"Jours à guichets fermés : {joursPleins}\");\n        Console.WriteLine($\"Moyenne d'entrées par jour : {totalEntrees / jours.Length}\");\n\n        Console.WriteLine();\n\n        // Un tableau CALCULÉ à partir des autres : le taux de remplissage.\n        int[] tauxPourcent = new int[jours.Length];\n        for (int i = 0; i < jours.Length; i++)\n        {\n            tauxPourcent[i] = entrees[i] * 100 / CapaciteGlace;\n        }\n\n        Console.WriteLine(\"--- Taux de remplissage ---\");\n        for (int i = 0; i < jours.Length; i++)\n        {\n            Console.Write($\"  {jours[i]}\\t{tauxPourcent[i]} %\\t\");\n            for (int barre = 0; barre < entrees[i]; barre++)\n            {\n                Console.Write(\"█\");\n            }\n            Console.WriteLine();\n        }\n\n        Console.WriteLine();\n\n        // Deux dimensions : les créneaux de la journée, trois par jour.\n        int[,] creneaux = new int[7, 3];\n        for (int j = 0; j < creneaux.GetLength(0); j++)\n        {\n            int reste = entrees[j];\n            for (int c = 0; c < creneaux.GetLength(1); c++)\n            {\n                int part = reste / (creneaux.GetLength(1) - c);\n                creneaux[j, c] = part;\n                reste = reste - part;\n            }\n        }\n\n        Console.WriteLine(\"--- Répartition par créneau (14h, 16h, 18h) ---\");\n        for (int j = 0; j < creneaux.GetLength(0); j++)\n        {\n            Console.Write($\"  {jours[j]}\\t\");\n            for (int c = 0; c < creneaux.GetLength(1); c++)\n            {\n                Console.Write(creneaux[j, c] + \"\\t\");\n            }\n            Console.WriteLine();\n        }\n    }\n}",
