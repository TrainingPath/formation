<script>
var DAY = {
  num: 7,
  title: "Les tableaux en C#",
  subtitle: "Les jours 14-15 d'algorithmique, indices à partir de 0.",
  theory: `
<h3>1. Qu'est-ce qu'un tableau ?</h3>
<p>Un <strong>tableau</strong> range PLUSIEURS valeurs du même type dans une seule variable, dans des <strong>cases</strong> numérotées. Au lieu de <code>note1, note2, note3…</code>, on a un seul <code>notes</code> avec des cases.</p>
<pre class="pseudo">int[] notes = new int[5];            // crée un tableau de 5 cases d'entiers, toutes remplies de 0 par défaut
int[] t = { 12, 8, 15, 10, 14 };     // création AVEC ses valeurs (la taille, 5, est déduite)
string[] noms = new string[3];       // 3 cases de string, remplies de null (pas encore de texte)</pre>
<p><code>new int[5]</code> réserve la place en mémoire ; les cases numériques valent 0, les string valent <code>null</code>, les bool <code>false</code>.</p>

<h3>2. Indices à partir de 0 (comme Java)</h3>
<pre class="pseudo">int[] t = { 12, 8, 15, 10, 14 };     // 5 valeurs
indices :   0     1     2     3     4  // chaque case a un NUMÉRO (indice), à partir de 0
t[0] → 12    (première case)          // t[0] = la 1re case
t[4] → 14    (dernière : Length - 1)  // la dernière case a l'indice « taille - 1 »
t[5] → IndexOutOfRangeException !     // t[5] n'existe pas → erreur de débordement à l'exécution</pre>
<p>Le piège universel : avec 5 cases, les indices vont de <strong>0 à 4</strong>. Accéder à <code>t[5]</code> sort du tableau et lève une exception.</p>

<h3>3. La taille : Length</h3>
<pre class="pseudo">int n = t.Length;        // Length = le NOMBRE de cases (5). Propriété, donc PAS de parenthèses (comme Java)</pre>
<p><code>Length</code> s'écrit avec une majuscule et sans <code>()</code> : c'est une <em>propriété</em>, pas une méthode. On l'utilise pour parcourir le tableau sans coder « en dur » sa taille.</p>

<h3>4. Le parcours d'un tableau</h3>
<pre class="pseudo">// PAR INDICES (permet de connaître/modifier la position)
for (int i = 0; i &lt; t.Length; i++)       // i part de 0 et va jusqu'à Length-1 grâce au < STRICT
{
    Console.WriteLine(t[i]);             // affiche la case numéro i
}
// FOREACH (plus simple, pour juste lire les valeurs)
foreach (int val in t) { Console.WriteLine(val); }   // val prend chaque valeur, sans gérer d'indice</pre>
<div class="tip">Formule magique (identique à Java) : <code>for (int i = 0; i &lt; t.Length; i++)</code>. Le <code>&lt;</code> STRICT (et non <code>&lt;=</code>) fait pile le bon nombre de tours et évite le débordement.</div>

<h3>5. Les motifs classiques (somme, maximum)</h3>
<pre class="pseudo">// SOMME de toutes les cases
int somme = 0;                                       // accumulateur à 0
for (int i = 0; i &lt; t.Length; i++) { somme += t[i]; } // on ajoute chaque case au total

// MAXIMUM : on prend la 1re case comme « champion » provisoire
int max = t[0];                                      // hypothèse : le plus grand est en case 0
for (int i = 1; i &lt; t.Length; i++)                   // on compare à partir de la case 1
{
    if (t[i] &gt; max) { max = t[i]; }                  // si on trouve plus grand, il devient le nouveau champion
}</pre>
<p>Le motif du maximum (« champion provisoire » qu'on remplace dès qu'on trouve mieux) est fondamental : on le réutilisera pour trier, chercher, comparer.</p>

<h3>6. Les tableaux 2D (matrices)</h3>
<pre class="pseudo">int[,] grille = new int[3, 4];       // tableau à 2 dimensions : 3 lignes × 4 colonnes (la virgule sépare les dimensions)
grille[1, 2] = 7;                    // range 7 en ligne 1, colonne 2 (un seul crochet, une virgule)
int lignes = grille.GetLength(0);    // GetLength(0) = nombre de lignes → 3
int colonnes = grille.GetLength(1);  // GetLength(1) = nombre de colonnes → 4</pre>
<div class="warn">Différence avec Java : le tableau 2D C# s'écrit <code>int[,]</code> et s'accède <code>grille[i, j]</code> (une virgule, un seul crochet). Java utilisait <code>int[][]</code> et <code>grille[i][j]</code>. Un accès hors limites lève une <code>IndexOutOfRangeException</code>.</div>`,
  exercises: [
    { type: "qcm", q: "Créer un tableau de 8 entiers :", opts: ["int t[8];", "int[] t = new int[8];", "array t = 8;", "int t = [8];"], a: 1, exp: "type[] nom = new type[taille] (comme Java)." },
    { type: "qcm", q: "Le premier élément d'un tableau C# est à l'indice…", opts: ["1", "0", "-1", "au choix"], a: 1, exp: "0-indexé, comme Java." },
    { type: "input", q: "int[] t = {7, 3, 9, 1}; Que vaut <code>t[2]</code> ?", a: "9", ph: "nombre", exp: "Indices 0,1,2,3 : t[2] = 9." },
    { type: "qcm", q: "Le dernier élément :", opts: ["t[t.Length]", "t[t.Length - 1]", "t[last]", "t[-1]"], a: 1, exp: "5 cases → indices 0 à 4 : Length−1. (Bonus C# : t[^1] aussi !)" },
    { type: "qcm", q: "La taille d'un tableau :", opts: ["t.length() minuscule", "t.Length (propriété, majuscule, sans parenthèses)", "count(t)", "t.size"], a: 1, exp: "Length avec majuscule : convention C#." },
    { type: "qcm", q: "t[t.Length] provoque…", opts: ["Le dernier élément", "IndexOutOfRangeException : débordement", "0", "null"], a: 1, exp: "Le débordement du jour 14, exception C#." },
    { type: "qcm", q: "La boucle de parcours standard :", opts: ["for (int i = 1; i <= t.Length; i++)", "for (int i = 0; i < t.Length; i++)", "for (int i = 0; i <= t.Length; i++)", "while (t)"], a: 1, exp: "Départ 0, < strict : zéro débordement." },
    { type: "input", q: "int[] t = new int[4]; afficher t[2] → ?", a: "0", ph: "nombre", exp: "new int[n] remplit de 0 (null pour string, false pour bool)." },
    { type: "input", q: "int[] t = {5, 2, 8, 3}; somme via la boucle → ?", a: "18", ph: "nombre", exp: "5+2+8+3 : l'accumulateur du jour 15." },
    { type: "qcm", q: "foreach (int v in t)…", opts: ["Parcourt les indices", "Parcourt les VALEURS sans gérer d'indice", "Trie", "Ne compile pas"], a: 1, exp: "Lecture seule ; pour modifier/positionner, garder le for." },
    { type: "input", q: "int[] t = {4, 9, 2, 7}; int max = t[0]; boucle du max → ?", a: "9", ph: "nombre", exp: "9 détrône 4, résiste à 2 et 7." },
    { type: "qcm", q: "Un tableau 2D de 3 lignes × 4 colonnes se déclare…", opts: ["int[][] g = new int[3][4]", "int[,] g = new int[3, 4] : virgule, différence avec Java", "int g[3][4]", "int[3,4] g"], a: 1, exp: "La syntaxe C# des matrices : [,]." },
    { type: "qcm", q: "Accéder à la case ligne 1, colonne 2 d'un tableau 2D C# :", opts: ["g[1][2]", "g[1, 2] : une virgule, un seul crochet", "g(1, 2)", "g.get(1, 2)"], a: 1, exp: "Différence avec Java (g[1][2])." },
    { type: "qcm", q: "Comparer t[i] et t[i+1] : la boucle s'arrête à…", opts: ["i < t.Length", "i < t.Length - 1 : sinon t[i+1] déborde", "i <= t.Length", "peu importe"], a: 1, exp: "Le réflexe anti-débordement du jour 15." },
    { type: "input", q: "int[] t = {3, 6, 9}; for (int i = 0; i < t.Length; i++) t[i] *= 2; Que vaut t[2] ?", a: "18", ph: "nombre", exp: "Chaque case doublée : {6, 12, 18}." }
  ],
  final: {
    title: "Exercice final — L'audit de la boutique (version C#)",
    intro: `<p>L'audit du jour 15, cinquième traduction :</p>
<pre class="pseudo">int[] ventes = { 120, 80, 150, 60, 90, 100 };
int total = 0, nbBons = 0, baisses = 0;
for (int i = 0; i < ventes.Length; i++)
{
    total += ventes[i];
    if (ventes[i] >= 100) { nbBons++; }
    if (i > 0 && ventes[i] < ventes[i - 1]) { baisses++; }
}
double moyenne = (double) total / ventes.Length;</pre>`,
    questions: [
      { type: "input", q: "Que vaut <code>total</code> ?", a: "600", ph: "nombre", exp: "120+80+150+60+90+100 = 600." },
      { type: "input", q: "Que vaut <code>nbBons</code> ?", a: "3", ph: "nombre", exp: "120, 150, 100." },
      { type: "qcm", q: "Pourquoi le cast (double) total dans la moyenne ?", opts: ["Décoration", "total et Length sont int : sans cast, la division serait ENTIÈRE (leçon 3, le piège partagé avec Java)", "Obligatoire à compiler", "Pour arrondir"], a: 1, exp: "Le cast anti-troncature, comme en Java." },
      { type: "input", q: "Que vaut <code>baisses</code> ?", a: "2", ph: "nombre", exp: "80<120 et 60<150 : le garde-fou i > 0 évite le débordement à i-1." },
      { type: "qcm", q: "Compare avec la version Java (leçon 7 Java). Différence ?", opts: ["Tout diffère", "PRESQUE rien : .Length majuscule, Console au lieu de System.out — le code est à 95 % identique", "C# n'a pas de tableaux", "Java était faux"], a: 1, exp: "Java et C# : cousins quasi jumeaux. Ton code Java se relit sans effort." }
    ],
    solution: `<pre class="pseudo">i  ventes[i]  total  nbBons
0  120        120    1
1  80         200    1
2  150        350    2
3  60         410    2
4  90         500    2
5  100        600    3
moyenne = 600/6.0 = 100.0 · baisses = 2

Différences C#/Java : .Length (idem), (double) cast (idem),
Console.WriteLine vs System.out. 95 % identique.</pre>
<p>Cinquième audit ! Java et C# sont à couper le souffle de ressemblance. Demain : les méthodes.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code C# ici…",
  items: [
  { id: "cs-stats", title: "Les statistiques du tableau", level: 2,
    statement: "À partir du tableau <code>int[] notes = {12, 8, 15, 19, 6, 11};</code> affiche le minimum, le maximum et la moyenne (réelle !).",
    hints: [
      "Initialise min et max avec notes[0], puis parcours à partir de l'indice 1 — les indices commencent à 0.",
      "La longueur d'un tableau : notes.Length (avec une majuscule).",
      "Piège de la moyenne : somme / notes.Length est une division ENTIÈRE. Écris (double) somme / notes.Length."
    ],
    solution: "using System;                                    // accès à Console\n\nclass Statistiques                               // déclaration de la classe\n{                                                // début de la classe\n    static void Main()                           // point d'entrée du programme\n    {                                            // début de Main\n        int[] notes = {12, 8, 15, 19, 6, 11};    // création + remplissage du tableau\n        int min = notes[0];                      // le 1er élément (indice 0 !) sert de départ\n        int max = notes[0];                      // idem pour le maximum\n        int somme = notes[0];                    // la somme inclut déjà notes[0]\n        for (int i = 1; i < notes.Length; i++)   // parcourt le RESTE : indices 1 à Length-1\n        {                                        // début du bloc répété\n            if (notes[i] < min) min = notes[i];  // plus petit que le min actuel ? → nouveau min\n            if (notes[i] > max) max = notes[i];  // plus grand que le max actuel ? → nouveau max\n            somme += notes[i];                   // accumule pour la moyenne\n        }                                        // fin du parcours\n        double moyenne = (double) somme / notes.Length; // le cast (double) force la division réelle\n        Console.WriteLine($\"Min : {min}\");       // affiche le minimum\n        Console.WriteLine($\"Max : {max}\");       // affiche le maximum\n        Console.WriteLine($\"Moyenne : {moyenne}\"); // affiche la moyenne exacte\n    }                                            // fin de Main\n}                                                // fin de la classe",
    note: "Sans le cast (double), 71 / 6 donnerait 11 au lieu de 11.83…" },
  { id: "cs-inverser", title: "Inverser un tableau", level: 2,
    statement: "Inverse le tableau <code>int[] t = {1, 2, 3, 4, 5};</code> <strong>sur place</strong> (sans second tableau ni <code>Array.Reverse</code>), puis affiche-le.",
    hints: [
      "Échange t[i] avec son symétrique t[t.Length - 1 - i] (indices dès 0 !).",
      "La boucle ne va que jusqu'à la MOITIÉ : i < t.Length / 2, sinon tout est ré-échangé.",
      "Utilise le motif d'échange avec temp de la leçon 2."
    ],
    solution: "using System;                                    // accès à Console\n\nclass InverserTableau                            // déclaration de la classe\n{                                                // début de la classe\n    static void Main()                           // point d'entrée du programme\n    {                                            // début de Main\n        int[] t = {1, 2, 3, 4, 5};               // le tableau à inverser\n        for (int i = 0; i < t.Length / 2; i++)   // on s'arrête à la MOITIÉ (2 tours pour 5 éléments)\n        {                                        // début du bloc d'échange\n            int temp = t[i];                     // 1) sauvegarde l'élément de gauche\n            t[i] = t[t.Length - 1 - i];          // 2) le symétrique vient à gauche (Length-1-i)\n            t[t.Length - 1 - i] = temp;          // 3) la sauvegarde part à droite\n        }                                        // fin des échanges\n        foreach (int v in t)                     // foreach : v prend chaque valeur du tableau\n        {                                        // début du bloc d'affichage\n            Console.Write(v + \" \");              // affiche : 5 4 3 2 1\n        }                                        // fin du bloc\n        Console.WriteLine();                     // retour à la ligne final\n    }                                            // fin de Main\n}                                                // fin de la classe",
    note: "Array.Reverse(t) fait pareil en une ligne — mais l'examinateur veut voir que tu sais l'écrire !" }
