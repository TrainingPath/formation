  subtitle: "Les jours 6-7 d'algorithmique, avec le switch moderne de C#.",
  theory: `
<h3>1. if / else : exécuter selon une condition</h3>
<p>Un <code>if</code> évalue une <strong>condition</strong> (une expression qui vaut vrai ou faux). Si elle est vraie, le bloc entre accolades s'exécute ; sinon, on passe au <code>else</code>.</p>
<pre class="pseudo">if (note &gt;= 10)                        // la condition entre parenthèses : « note est-elle >= 10 ? »
{                                      // début du bloc exécuté SI la condition est VRAIE
    Console.WriteLine("Réussi");       // affiché seulement quand note >= 10
}                                      // fin du bloc « vrai »
else                                   // sinon (la condition était fausse)
{                                      // début du bloc exécuté SI la condition est FAUSSE
    Console.WriteLine("Échoué");       // affiché quand note < 10
}                                      // fin du bloc « faux »</pre>
<p>Pour tester plusieurs cas à la suite, on enchaîne avec <code>else if</code> : dès qu'une condition est vraie, sa branche s'exécute et les suivantes sont ignorées.</p>
<pre class="pseudo">if (note &gt;= 16)      { Console.WriteLine("Très bien"); }   // 1er test ; si vrai, on s'arrête là
else if (note &gt;= 14) { Console.WriteLine("Bien"); }        // testé seulement si le précédent était faux
else if (note &gt;= 10) { Console.WriteLine("Passable"); }    // idem : l'ordre des seuils compte !
else                 { Console.WriteLine("Échoué"); }      // aucun seuil atteint → cas restant</pre>
<p>L'ordre est crucial : on va du seuil le plus haut au plus bas. Une note de 15 échoue au test <code>&gt;= 16</code> mais réussit <code>&gt;= 14</code> → « Bien ».</p>

<h3>2. Comparer des string : == fonctionne (différence avec Java !)</h3>
<pre class="pseudo">string rep = Console.ReadLine();       // lit la réponse de l'utilisateur (une string)
if (rep == "oui")                      // en C#, == compare le CONTENU des string (les caractères)
if (rep.Equals("oui"))                 // .Equals fait la même comparaison de contenu
if (rep.ToLower() == "oui")            // ToLower met en minuscules d'abord → « OUI », « Oui » passent aussi</pre>
<div class="tip">Bonne nouvelle : en C#, <code>==</code> compare le CONTENU des string (contrairement à Java où il fallait <code>.equals</code>). Un piège de moins. Pour une comparaison insensible à la casse, passe par <code>ToLower()</code>.</div>

<h3>3. L'opérateur ternaire et le null-coalescing</h3>
<pre class="pseudo">string statut = (age &gt;= 18) ? "majeur" : "mineur";   // ternaire : (condition) ? valeur_si_vrai : valeur_si_faux
string pseudo = saisie ?? "invité";                  // ?? : prend « saisie » si elle est non-null, sinon « invité »</pre>
<p>Le <strong>ternaire</strong> <code>? :</code> est un <code>if/else</code> condensé qui produit une valeur. Le <strong>null-coalescing</strong> <code>??</code> fournit une valeur de repli quand la gauche est <code>null</code> (donnée absente) : très pratique pour des valeurs par défaut.</p>

<h3>4. switch classique et switch expression</h3>
<pre class="pseudo">// switch CLASSIQUE (avec break, comme Java) :
switch (jour)                                     // on compare « jour » à chaque case
{                                                 // début du switch
    case 1: Console.WriteLine("Lundi"); break;    // si jour == 1 : afficher Lundi, puis break SORT du switch
    case 2: Console.WriteLine("Mardi"); break;    // si jour == 2 : Mardi
    default: Console.WriteLine("?"); break;        // aucun case ne correspond : le cas par défaut
}                                                 // fin du switch

// switch EXPRESSION (C# 8+) : plus court, RETOURNE une valeur, sans break !
string nom = jour switch                          // « jour switch { … } » produit directement une valeur
{                                                 // début de l'expression switch
    1 =&gt; "Lundi",                                 // si jour vaut 1, la valeur est "Lundi"
    2 =&gt; "Mardi",                                 // si jour vaut 2, "Mardi"
    6 or 7 =&gt; "Week-end",                         // un motif peut couvrir plusieurs valeurs (6 OU 7)
    _ =&gt; "?"                                      // _ = le cas par défaut (attrape tout le reste)
};                                                // le ; termine l'affectation de nom</pre>
<div class="tip">Le switch expression (<code>jour switch { … }</code>) ressemble au <code>match</code> de PHP : compact, retourne une valeur, pas de break oublié possible. Le <code>_</code> joue le rôle du default. Autre différence avec Java : C# INTERDIT le « fall-through » implicite — dans un switch classique, chaque <code>case</code> doit se terminer (par <code>break</code> ou <code>return</code>).</div>

<h3>5. Toujours les accolades</h3>
<pre class="pseudo">if (x &gt; 0)          // condition
    a++;            // SEULE cette ligne dépend du if (elle suit immédiatement la condition)
    b++;            // PIÈGE : b++ s'exécute TOUJOURS ! L'indentation est trompeuse, elle ne compte pas</pre>
<div class="warn">Comme en Java : sans accolades, seule la première instruction dépend du <code>if</code>. L'alignement visuel n'a aucun sens pour le compilateur. Mets TOUJOURS les <code>{ }</code>, même pour une seule ligne : c'est une source de bugs classiques.</div>`,

      "solution": "// La bibliothèque de quartier : décider, et rien d'autre.\n// Chaque question de l'énoncé devient une condition, dans l'ordre.\nusing System;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        Console.WriteLine(\"Âge de l'usager ?\");\n        int age = int.Parse(Console.ReadLine());\n\n        Console.WriteLine(\"Jours de retard (0 si à l'heure) ?\");\n        int retard = int.Parse(Console.ReadLine());\n\n        Console.WriteLine(\"Numéro du jour (1 = lundi … 7 = dimanche) ?\");\n        int jour = int.Parse(Console.ReadLine());\n\n        Console.WriteLine(\"Souhaitez-vous la carte de fidélité ? (oui/non)\");\n        string reponse = Console.ReadLine();\n\n        Console.WriteLine(\"Pseudonyme du lecteur (Entrée pour rester anonyme) ?\");\n        string saisie = Console.ReadLine();\n\n        Console.WriteLine();\n\n        // Les seuils vont du plus haut au plus bas : l'ordre décide du résultat.\n        string categorie;\n        if (age >= 65)\n        {\n            categorie = \"senior\";\n        }\n        else if (age >= 26)\n        {\n            categorie = \"adulte\";\n        }\n        else if (age >= 12)\n        {\n            categorie = \"jeune\";\n        }\n        else\n        {\n            categorie = \"enfant\";\n        }\n\n        // Un aiguillage qui PRODUIT une valeur : pas de break possible à oublier.\n        int cotisationCentimes = categorie switch\n        {\n            \"senior\" => 900,\n            \"adulte\" => 1500,\n            \"jeune\" => 600,\n            _ => 0\n        };\n\n        // L'amende : nulle si l'ouvrage est rendu à temps, plafonnée sinon.\n        int amendeCentimes;\n        if (retard <= 0)\n        {\n            amendeCentimes = 0;\n        }\n        else\n        {\n            amendeCentimes = retard * 20;\n            if (amendeCentimes > 500)\n            {\n                amendeCentimes = 500;\n            }\n        }\n\n        // En C#, == compar       "solution": "// Le péage d'autoroute : une décision qui dépend de trois choses à la fois.\n// Trois classes de véhicule, trois périodes, et une carte d'abonné.\nusing System;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        Console.WriteLine(\"Classe du véhicule (1 = voiture, 2 = camionnette, 3 = poids lourd) ?\");\n        bool classeLue = int.TryParse(Console.ReadLine(), out int classe);\n\n        Console.WriteLine(\"Heure de passage (0 à 23) ?\");\n        bool heureLue = int.TryParse(Console.ReadLine(), out int heure);\n\n        Console.WriteLine(\"Kilomètres parcourus sur l'autoroute ?\");\n        bool kmLus = int.TryParse(Console.ReadLine(), out int kilometres);\n\n        Console.WriteLine(\"Numéro d'abonné (Entrée si aucun) ?\");\n        string abonneSaisi = Console.ReadLine();\n\n        Console.WriteLine();\n\n        bool saisieComplete = classeLue && heureLue && kmLus;\n        Console.WriteLine($\"Saisie complète : {saisieComplete}\");\n\n        // Le tarif de base au kilomètre, en centimes, selon la classe.\n        int tarifKmCentimes = classe switch\n        {\n            1 => 9,\n            2 => 14,\n            3 => 22,\n            _ => 0\n        };\n\n        // Le libellé de la classe, pour le ticket.\n        string libelleClasse = classe switch\n        {\n            1 => \"voiture\",\n            2 => \"camionnette\",\n            3 => \"poids lourd\",\n            _ => \"classe inconnue\"\n        };\n\n        // La période : plusieurs heures partagent le même motif.\n        string periode = heure switch\n        {\n            0 or 1 or 2 or 3 or 4 or 5 => \"nuit\",\n            6 or 7 or 8 or 9 => \"pointe du matin\",\n            16 or 17 or 18 or 19 => \"pointe du soir\",\n            _ => \"heure creuse\"\n        };\n\n        // La majoration dépend de la période, et se lit comme une phrase.\n        int majorationPourcent;\n        if (periode == \"nuit\")\n        {\n            majorationPourcent = -20;\n        }\n        else if (periode == \"pointe du matin\" || periode == \"pointe du soir\")\n        {\n            majorationPourcent = 15;\n        }\n        else\n        {\n            majorationPourcent = 0;\n        }\n\n        int baseCentimes = tarifKmCentimes * kilometres;\n        int majoration = baseCentimes * majorationPourcent / 100;\n        int apresPeriode = baseCentimes + majoration;\n\n        // L'abonné : le repli sert quand la saisie n'existe pas du tout.\n        string abonne = abonneSaisi ?? \"\";\n        bool estAbonne = abonne != \"\";\n        int remise = estAbonne ? apresPeriode * 10 / 100 : 0;\n        int aPayer = apresPeriode - remise;\n\n        Console.WriteLine($\"Véhicule : {libelleClasse}, {kilometres} km à {tarifKmCentimes} c/km\");\n        Console.WriteLine($\"Base : {baseCentimes} centimes\");\n        Console.WriteLine($\"Période : {periode} ({majorationPourcent} %) → {apresPeriode} centimes\");\n        Console.WriteLine($\"Abonné : {estAbonne} — remise {remise} centimes\");\n        Console.WriteLine($\"À payer : {aPayer / 100.0:F2} €\");\n\n        // Le cas particulier qui ne se calcule pas : il se refuse.\n        if (!saisieComplete)\n        {\n            Console.WriteLine(\"Saisie incomplète : ce ticket ne vaut rien.\");\n        }\n        else if (tarifKmCentimes == 0)\n        {\n            Console.WriteLine(\"Classe de véhicule inconnue : passage au guichet manuel.\");\n        }\n        else\n        {\n            Console.WriteLine(\"Barrière ouverte, bonne route.\");\n        }\n    }\n}",

      "solution": "// La patinoire municipale — jour 1 sur 4 : décider du tarif.\n// Aujourd'hui, un seul patineur, une seule entrée. Rien ne se répète encore.\nusing System;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        const int TarifEnfantCentimes = 350;\n        const int TarifJeuneCentimes = 500;\n        const int TarifAdulteCentimes = 750;\n        const int TarifSeniorCentimes = 550;\n        const int LocationPatinsCentimes = 250;\n\n        Console.WriteLine(\"PATINOIRE MUNICIPALE — caisse\");\n        Console.WriteLine();\n\n        Console.WriteLine(\"Âge du patineur ?\");\n        bool ageLu = int.TryParse(Console.ReadLine(), out int age);\n\n        Console.WriteLine(\"Numéro du jour (1 = lundi … 7 = dimanche) ?\");\n        bool jourLu = int.TryParse(Console.ReadLine(), out int jour);\n\n        Console.WriteLine(\"Location de patins ? (oui/non)\");\n        string reponsePatins = Console.ReadLine();\n\n        Console.WriteLine(\"Carte de la commune ? (oui/non)\");\n        string reponseCarte = Console.ReadLine();\n\n        Console.WriteLine();\n\n        // La catégorie : les seuils vont du plus haut au plus bas.\n        string categorie;\n        if (age >= 65)\n        {\n            categorie = \"senior\";\n        }\n        else if (age >= 18)\n        {\n            categorie = \"adulte\";\n        }\n        else if (age >= 12)\n        {\n            categorie = \"jeune\";\n        }\n        else\n        {\n            categorie = \"enfant\";\n        }\n\n        int tarifCentimes = categorie switch\n        {\n            \"senior\" => TarifSeniorCentimes,\n            \"adulte\" => TarifAdulteCentimes,\n            \"jeune\" => TarifJeuneCentimes,\n            _ => TarifEnfantCentimes\n        };\n\n        // Le week-end coûte plus cher, le mardi est en promotion.\n        string typeDeJour = jour switch\n        {\n            6 or 7 => \"week-end\",\n            2 => \"mardi promotion\",\n            _ => \"semaine\"\n        };\n\n        int supplementJour;\n        if (typeDeJour == \"week-end\")\n        {\n            supplementJour = 150;\n        }\n        else if (typeDeJour == \"mardi promotion\")\n        {\n            supplementJour = -100;\n        }\n        else\n        {\n            supplementJour = 0;\n        }\n\n        // Les deux réponses, comparées sans se soucier de la casse.\n        bool veutPatins = reponsePatins.ToLower() == \"oui\";\n        bool aLaCarte = reponseCarte.ToLower() == \"oui\";\n\n        int location = veutPatins ? LocationPatinsCentimes : 0;\n        int sousTotal = tarifCentimes + supplementJour + location;\n        int remiseCommune = aLaCarte ? sousTotal * 15 / 100 : 0;\n        int aPayer = sousTotal - remiseCommune;\n\n        // Le ticket.\n        Console.WriteLine($\"Catégorie : {categorie} ({age} ans)\");\n        Console.WriteLine($\"Entrée : {tarifCentimes} c\");\n        Console.WriteLine($\"Jour : {typeDeJour} ({supplementJour} c)\");\n        Console.WriteLine($\"Patins : {(veutPatins ? \"loués\" : \"personnels\")} ({location} c)\");\n        Console.WriteLine($\"Sous-total : {sousTotal} c\");\n        Console.WriteLine($\"Carte de la commune : {aLaCarte} (−{remiseCommune} c)\");\n        Console.WriteLine($\"À PAYER : {aPayer / 100.0:F2} €\");\n\n        Console.WriteLine();\n\n        // Une seule chose qui ne se calcule pas : elle se refuse.\n        if (!ageLu || !jourLu)\n        {\n            Console.WriteLine(\"Saisie illisible : appeler le responsable de caisse.\");\n        }\n        else if (age < 4)\n        {\n            Console.WriteLine(\"Moins de 4 ans : entrée gratuite, patins non loués.\");\n        }\n        else\n        {\n            Console.WriteLine(\"Bonne séance sur la glace !\");\n        }\n    }\n}",
