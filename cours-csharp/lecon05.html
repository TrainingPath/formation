  title: "Conditions : if, else, switch",
  subtitle: "Les jours 6-7 d'algorithmique, avec le switch moderne de C#.",
  theory: `
<h3>1. if / else : exécuter selon une condition</h3>
<p>Un <code>if</code> évalue une <strong>condition</strong> (une expression qui vaut vrai ou faux). Si elle est vraie, le bloc entre accolades s'exécute ; sinon, on passe au <code>else</code>.</p>
<pre class="pseudo">if (note &gt;= 10)                        // la condition entre parenthèses : « note est-elle >= 10 ? »
{                                      // début du bloc exécuté SI la condition est VRAIE
    Console.WriteLine("Réussi");       // affiché seulement quand note >= 10
}                                      // fin du bloc « vrai »
else                                   // sinon (la condition était fausse)
{                                      // début du bloc exécuté SI la condition est FAUSSE
    Console.WriteLine("Échoué");       // affiché quand note < 10
}                                      // fin du bloc « faux »</pre>
<p>Pour tester plusieurs cas à la suite, on enchaîne avec <code>else if</code> : dès qu'une condition est vraie, sa branche s'exécute et les suivantes sont ignorées.</p>
<pre class="pseudo">if (note &gt;= 16)      { Console.WriteLine("Très bien"); }   // 1er test ; si vrai, on s'arrête là
else if (note &gt;= 14) { Console.WriteLine("Bien"); }        // testé seulement si le précédent était faux
else if (note &gt;= 10) { Console.WriteLine("Passable"); }    // idem : l'ordre des seuils compte !
else                 { Console.WriteLine("Échoué"); }      // aucun seuil atteint → cas restant</pre>
<p>L'ordre est crucial : on va du seuil le plus haut au plus bas. Une note de 15 échoue au test <code>&gt;= 16</code> mais réussit <code>&gt;= 14</code> → « Bien ».</p>

<h3>2. Comparer des string : == fonctionne (différence avec Java !)</h3>
<pre class="pseudo">string rep = Console.ReadLine();       // lit la réponse de l'utilisateur (une string)
if (rep == "oui")                      // en C#, == compare le CONTENU des string (les caractères)
if (rep.Equals("oui"))                 // .Equals fait la même comparaison de contenu
if (rep.ToLower() == "oui")            // ToLower met en minuscules d'abord → « OUI », « Oui » passent aussi</pre>
<div class="tip">Bonne nouvelle : en C#, <code>==</code> compare le CONTENU des string (contrairement à Java où il fallait <code>.equals</code>). Un piège de moins. Pour une comparaison insensible à la casse, passe par <code>ToLower()</code>.</div>

<h3>3. L'opérateur ternaire et le null-coalescing</h3>
<pre class="pseudo">string statut = (age &gt;= 18) ? "majeur" : "mineur";   // ternaire : (condition) ? valeur_si_vrai : valeur_si_faux
string pseudo = saisie ?? "invité";                  // ?? : prend « saisie » si elle est non-null, sinon « invité »</pre>
<p>Le <strong>ternaire</strong> <code>? :</code> est un <code>if/else</code> condensé qui produit une valeur. Le <strong>null-coalescing</strong> <code>??</code> fournit une valeur de repli quand la gauche est <code>null</code> (donnée absente) : très pratique pour des valeurs par défaut.</p>

<h3>4. switch classique et switch expression</h3>
<pre class="pseudo">// switch CLASSIQUE (avec break, comme Java) :
switch (jour)                                     // on compare « jour » à chaque case
{                                                 // début du switch
    case 1: Console.WriteLine("Lundi"); break;    // si jour == 1 : afficher Lundi, puis break SORT du switch
    case 2: Console.WriteLine("Mardi"); break;    // si jour == 2 : Mardi
    default: Console.WriteLine("?"); break;        // aucun case ne correspond : le cas par défaut
}                                                 // fin du switch

// switch EXPRESSION (C# 8+) : plus court, RETOURNE une valeur, sans break !
string nom = jour switch                          // « jour switch { … } » produit directement une valeur
{                                                 // début de l'expression switch
    1 =&gt; "Lundi",                                 // si jour vaut 1, la valeur est "Lundi"
    2 =&gt; "Mardi",                                 // si jour vaut 2, "Mardi"
    6 or 7 =&gt; "Week-end",                         // un motif peut couvrir plusieurs valeurs (6 OU 7)
    _ =&gt; "?"                                      // _ = le cas par défaut (attrape tout le reste)
};                                                // le ; termine l'affectation de nom</pre>
<div class="tip">Le switch expression (<code>jour switch { … }</code>) ressemble au <code>match</code> de PHP : compact, retourne une valeur, pas de break oublié possible. Le <code>_</code> joue le rôle du default. Autre différence avec Java : C# INTERDIT le « fall-through » implicite — dans un switch classique, chaque <code>case</code> doit se terminer (par <code>break</code> ou <code>return</code>).</div>

<h3>5. Toujours les accolades</h3>
<pre class="pseudo">if (x &gt; 0)          // condition
    a++;            // SEULE cette ligne dépend du if (elle suit immédiatement la condition)
    b++;            // PIÈGE : b++ s'exécute TOUJOURS ! L'indentation est trompeuse, elle ne compte pas</pre>
<div class="warn">Comme en Java : sans accolades, seule la première instruction dépend du <code>if</code>. L'alignement visuel n'a aucun sens pour le compilateur. Mets TOUJOURS les <code>{ }</code>, même pour une seule ligne : c'est une source de bugs classiques.</div>`,
  exercises: [
    { type: "qcm", q: "Traduire <code>SI x > 5 ALORS ... FINSI</code> :", opts: ["if x > 5:", "if (x > 5) { ... }", "when (x > 5)", "si (x > 5)"], a: 1, exp: "Parenthèses + accolades, comme Java." },

    { type: "qcm", q: "Le switch EXPRESSION <code>jour switch { 1 => \"Lundi\", _ => \"?\" }</code>…", opts: ["Nécessite des break", "Retourne une valeur, sans break, le _ = default : le cousin C# du match PHP", "Est plus lent", "N'existe pas"], a: 1, exp: "Compact et sûr : aucun fall-through possible." },
    { type: "qcm", q: "Dans un switch expression, le <code>_</code> signifie…", opts: ["Une erreur", "Le cas par DÉFAUT (le SINON attrape-tout)", "Zéro", "Une variable"], a: 1, exp: "Le _ = default : couvre tous les cas restants." },
    { type: "qcm", q: "Le switch CLASSIQUE sans break dans un case :", opts: ["Fonctionne", "Erreur de compilation en C# : contrairement à Java, C# INTERDIT le fall-through implicite", "Continue au case suivant", "Ignore le case"], a: 1, exp: "C# est plus strict que Java : chaque case doit se terminer (break/return)." },
    { type: "qcm", q: "<code>string s = saisie ?? \"invité\";</code> fait…", opts: ["Compare deux fois", "saisie si non-null, sinon \"invité\" : le null-coalescing", "Concatène", "Erreur"], a: 1, exp: "Le ?? de C#, comme en PHP." },
    { type: "qcm", q: "x = 7. <code>if (x > 5) { x += 10; }</code> puis afficher x → ?", opts: ["7", "17", "5", "10"], a: 1, exp: "7 > 5 vrai : x devient 17." },
    { type: "qcm", q: "Le piège <code>if (x > 0) a++; b++;</code> :", opts: ["Correct", "b++ s'exécute TOUJOURS : sans accolades, seul a++ dépend du if", "Erreur", "b++ jamais"], a: 1, exp: "L'indentation ne compte pas : mets les { }." },
    { type: "qcm", q: "x = 0. <code>if (x > 0) {A} else if (x < 0) {B} else {C}</code> → ?", opts: ["A", "B", "C : zéro, cas restant", "Aucun"], a: 2, exp: "Le SINON final (jour 7)." },
    { type: "qcm", q: "Encadrer « age entre 12 et 17 » :", opts: ["12 <= age <= 17", "age >= 12 && age <= 17", "age == 12..17", "12 && 17"], a: 1, exp: "L'encadrement du jour 8 : deux comparaisons + &&." },
    { type: "qcm", q: "bool estMajeur = age >= 18; puis <code>if (estMajeur)</code> :", opts: ["Erreur : il faut == true", "Valide et lisible : le bool se consomme tel quel", "Il faut un switch", "if (estMajeur = true)"], a: 1, exp: "== true est redondant (jour 21 : fonctions-tests)." },
    { type: "qcm", q: "<code>jour switch { 6 or 7 => \"WE\", _ => \"semaine\" }</code> avec jour=7 :", opts: ["semaine", "WE : le motif « 6 or 7 » couvre les deux", "7", "Erreur"], a: 1, exp: "Les patterns du switch expression : plusieurs valeurs par branche." },
    { type: "qcm", q: "Pour classer une note par intervalles (>= 16, >= 14…), quoi utiliser ?", opts: ["switch case (n'accepte que des égalités)", "if / else if : les intervalles ont besoin de comparaisons — ou un switch expression avec patterns >=", "Rien", "un for"], a: 1, exp: "C# 9+ permet même case >= 16 dans un switch expression (pattern relationnel) !" },
    { type: "vf", q: "rep.ToLower() == \"oui\" accepte OUI, Oui, oui.", a: true, exp: "Normaliser la casse avant de comparer : ergonomie." }
  ],
  final: {
    title: "Exercice final — Le tarif du musée (version C# + switch expression)",
    intro: `<p>Le grand final du jour 7, quatrième traduction — avec bonus switch expression :</p>
<pre class="pseudo">int age = 15;
bool mercredi = true;

    questions: [

      { type: "qcm", q: "Le <code>age switch { < 6 => ..., < 18 => ... }</code> utilise…", opts: ["Des égalités", "Des PATTERNS RELATIONNELS (< 6, < 18) : le switch expression gère les intervalles en C#", "Des chaînes", "Un for"], a: 1, exp: "C# va plus loin que le match PHP : les comparaisons sont permises dans les branches." },
      { type: "input", q: "Que vaut $categorie pour age = 15 ?", a: ["jeune"], ph: "texte", exp: "6 <= 15 < 18 : la branche < 18 gagne (l'ordre compte, jour 7)." },
      { type: "qcm", q: "On inverse < 18 et < 6 dans le switch. Un enfant de 4 ans devient…", opts: ["petit", "« jeune » : 4 < 18 gagne en premier — l'ordre des seuils, LA leçon du jour 7", "Erreur", "senior"], a: 1, exp: "Du plus restrictif au moins restrictif, quel que soit le langage." },
      { type: "qcm", q: "Bilan des QUATRE musées (pseudocode, Java, PHP, C#) :", opts: ["Quatre algorithmes", "MÊME logique (cascade + ordre des seuils), quatre syntaxes : if imbriqué, ternaire, match, switch expression", "Incompatibles", "Le jour 7 était inutile"], a: 1, exp: "La preuve définitive : l'algorithme prime, les langages suivent." }
    ],
    solution: `<pre class="pseudo">age=15, mercredi=true → cascade → prix = 3
age switch { <6, <18, <65, _ } → "jeune"
Affiche : jeune : 3 €

Bonus C# : le switch expression accepte des patterns
relationnels (< 6, < 18) — plus puissant que le match PHP,
qui exigeait l'astuce match(true).</pre>
<p>Quatrième musée. Java et C# partagent presque tout ; C# ajoute le switch expression élégant. Demain : les boucles.</p>`
  }
};

    solution: "using System;                                    // accès à Console\n\nclass Bissextile                                 // déclaration de la classe\n{                                                // début de la classe\n    static void Main()                           // point d'entrée du programme\n    {                                            // début de Main\n        Console.Write(\"Année ? \");               // pose la question\n        int a = int.Parse(Console.ReadLine());   // convertit la saisie en entier\n        bool bissextile =                        // le résultat du test est un booléen\n            (a % 4 == 0 && a % 100 != 0)         // divisible par 4 ET PAS par 100…\n            || a % 400 == 0;                     // …OU divisible par 400\n        if (bissextile)                          // si le booléen vaut true\n            Console.WriteLine($\"{a} est bissextile\");        // cas positif\n        else                                     // sinon\n            Console.WriteLine($\"{a} n'est pas bissextile\");  // cas négatif\n    }                                            // fin de Main\n}                                                // fin de la classe",

    solution: "using System;                                    // accès à Console\n\nclass Distributeur                               // déclaration de la classe\n{                                                // début de la classe\n    static void Main()                           // point d'entrée du programme\n    {                                            // début de Main\n        Console.WriteLine(\"1. Eau  — 0,50 €\");   // 1re ligne du menu\n        Console.WriteLine(\"2. Soda — 1,20 €\");   // 2e ligne du menu\n        Console.WriteLine(\"3. Café — 0,80 €\");   // 3e ligne du menu\n        Console.Write(\"Choix ? \");               // invite sans retour à la ligne\n        int choix = int.Parse(Console.ReadLine()); // lit et convertit le choix\n        switch (choix)                           // aiguillage selon la valeur de choix\n        {                                        // début du switch\n            case 1:                              // si choix == 1\n                Console.WriteLine(\"Eau : 0,50 €\");   // affiche la boisson\n                break;                           // OBLIGATOIRE en C# : ferme le cas\n            case 2:                              // si choix == 2\n                Console.WriteLine(\"Soda : 1,20 €\");  // affiche la boisson\n                break;                           // sortie du switch\n            case 3:                              // si choix == 3\n                Console.WriteLine(\"Café : 0,80 €\");  // affiche la boisson\n                break;                           // sortie du switch\n            default:                             // toutes les autres valeurs\n                Console.WriteLine(\"Choix invalide\"); // message d'erreur\n                break;                           // même default exige son break en C#\n        }                                        // fin du switch\n    }                                            // fin de Main\n}
