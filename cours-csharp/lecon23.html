  title: "Nullable et la sécurité anti-null",
  subtitle: "Apprivoiser le « rien » : éviter le bug le plus fréquent de la programmation.",
  theory: `
<h3>1. Le problème du null : la boîte vide</h3>
<p><strong>null</strong> signifie « aucune valeur », « la référence ne pointe sur rien ». C'est comme une case d'adresse laissée blanche : si tu essaies d'y livrer un colis, ça échoue. En C#, utiliser un objet null (appeler une méthode, lire une propriété) provoque la fameuse <strong>NullReferenceException</strong> — l'erreur la plus courante de tout le développement.</p>
<pre class="pseudo">string nom = null;              // nom ne pointe sur aucune chaîne
int len = nom.Length;           // BOUM : NullReferenceException, nom est vide</pre>

<h3>2. Types valeur vs types référence face au null</h3>
<p>Un <strong>type valeur</strong> (value type : int, double, bool, DateTime, struct) contient directement sa donnée : il ne peut PAS être null par défaut. Un <strong>type référence</strong> (reference type : string, tableaux, tes classes) contient une adresse : il PEUT être null.</p>
<pre class="pseudo">int age = 0;         // un int vaut toujours une valeur (jamais null par défaut)
string ville;        // un type référence peut, lui, valoir null</pre>

<h3>3. Rendre un type valeur « nullable » : le point d'interrogation</h3>
<p>Parfois un int DOIT pouvoir dire « je ne sais pas encore » (âge non renseigné). On ajoute un <code>?</code> : <code>int?</code> est un <strong>Nullable&lt;int&gt;</strong>, un int qui accepte en plus la valeur null.</p>
<pre class="pseudo">int? age = null;                // un int qui, exceptionnellement, peut être null
age = 30;                       // on lui donne une vraie valeur
if (age.HasValue)               // HasValue : y a-t-il une valeur dedans ?
    Console.WriteLine(age.Value); // Value : la valeur (à lire seulement si HasValue est vrai)
int certain = age ?? 0;         // ?? : si age est null, prendre 0 à la place</pre>
<div class="tip">Un <code>?</code> après un type valeur (<code>int?</code>, <code>double?</code>, <code>DateTime?</code>) le rend nullable. <code>HasValue</code> teste la présence, <code>Value</code> lit le contenu, mais ne lis jamais <code>Value</code> sans avoir vérifié <code>HasValue</code>.</div>

<h3>4. L'opérateur ?? (null-coalescing) : la valeur de secours</h3>
<pre class="pseudo">string nom = saisie ?? "Anonyme";   // si saisie est null → "Anonyme", sinon saisie
config.Timeout ??= 30;              // ??= : affecte 30 SEULEMENT si Timeout est null</pre>
<p>Le <code>??</code> se lit « sinon » : « la saisie, sinon Anonyme ». Il fournit un filet de sécurité quand une valeur pourrait manquer.</p>

<h3>5. L'accès conditionnel ?. (null-safe navigation)</h3>
<pre class="pseudo">int? longueur = nom?.Length;        // ?. : si nom est null → null ; sinon → nom.Length
tache?.Terminer();                  // n'appelle Terminer() QUE si tache n'est pas null
int n = client?.Commandes?.Count ?? 0; // on enchaîne : null n'importe où → on retombe sur 0</pre>
<div class="warn">Le <code>?.</code> évite le crash : si l'objet est null, l'expression vaut null au lieu de lever une exception. Combiné à <code>??</code>, il donne un code court et blindé : <code>obj?.Prop ?? valeurParDefaut</code>.</div>

<h3>6. Les types référence nullables (C# moderne)</h3>
<p>Le C# récent permet d'ANNOTER si une référence a le droit d'être null : <code>string</code> (ne devrait jamais être null) vs <code>string?</code> (peut l'être). Le compilateur émet alors un AVERTISSEMENT si tu risques un null non vérifié — un garde-fou à la compilation.</p>
<pre class="pseudo">string obligatoire;      // le compilateur s'attend à ce qu'il ne soit jamais null
string? optionnel;       // celui-ci a explicitement le droit d'être null
void Traiter(string? x)  // x peut être null : le compilateur t'oblige à le vérifier
{                        // début
    if (x is null) return;      // on écarte le cas null d'abord (garde)
    Console.WriteLine(x.Length); // ici x est forcément non null : sûr
}</pre>
<div class="tip">Bonne pratique : traite le cas null au DÉBUT de la méthode (une « garde »), puis travaille sereinement. On teste avec <code>x is null</code> ou <code>x == null</code>, et <code>x is not null</code> pour l'inverse.</div>`,

    { type: "qcm", q: "<code>nom?.Length</code> quand nom est null vaut…", opts: ["0", "null : le ?. court-circuite au lieu de planter", "Une exception", "\"\""], a: 1, exp: "Accès conditionnel : null si l'objet est null." },
    { type: "qcm", q: "<code>tache?.Terminer();</code> appelle Terminer()…", opts: ["Toujours", "Seulement si tache n'est PAS null", "Jamais", "Deux fois"], a: 1, exp: "?. n'appelle que sur un objet non null." },
    { type: "qcm", q: "<code>client?.Commandes?.Count ?? 0</code> : si client est null, le résultat est…", opts: ["Une exception", "0 : la chaîne ?. donne null, puis ?? le remplace par 0", "null", "La liste des commandes"], a: 1, exp: "?. propage null, ?? fournit le secours." },
    { type: "qcm", q: "Quelle est la différence entre <code>string</code> et <code>string?</code> (C# moderne) ?", opts: ["Aucune différence réelle", "string ne devrait pas être null ; string? a explicitement le droit d'être null", "string? est plus rapide", "string? est un type numérique"], a: 1, exp: "Annotation de nullabilité : garde-fou du compilateur." },
    { type: "vf", q: "Traiter le cas null au DÉBUT d'une méthode (une garde) est une bonne pratique.", a: true, exp: "On écarte le null tôt, puis on travaille en sécurité." },
    { type: "qcm", q: "Comment tester qu'une variable n'est pas null (C# moderne) ?", opts: ["x == 0", "x is not null (ou x != null)", "x.HasValue toujours", "x.exists()"], a: 1, exp: "'is not null' et '!= null' testent la présence." }
  ],

    title: "Exercice final — Un profil utilisateur robuste face au null",
    intro: `<p>On lit des données de profil possiblement absentes : un surnom (peut être null), un âge non renseigné (int?), et un objet Adresse éventuellement null.</p>
<pre class="pseudo">string? surnom = LireSurnom();                 // peut renvoyer null
int? age = LireAge();                          // peut renvoyer null
Adresse? adr = LireAdresse();                  // peut renvoyer null

string affichage = surnom ?? "Invité";         // (1) secours si null
int anneeNaissance = 2026 - (age ?? 0);        // (2) si age null, on compte 0
string ville = adr?.Ville ?? "Inconnue";       // (3) navigation sûre + secours
if (age.HasValue && age.Value >= 18)           // (4)
    Console.WriteLine("Majeur");
adr?.Valider();                                // (5) n'appelle Valider() que si adr existe</pre>`,

      { type: "qcm", q: "(2) Si <code>age</code> est null, <code>age ?? 0</code> vaut…", opts: ["null", "0 : le secours du ??", "L'âge", "Une exception"], a: 1, exp: "Le calcul continue avec 0." },
      { type: "qcm", q: "(3) Si <code>adr</code> est null, que vaut <code>ville</code> ?", opts: ["Une exception", "'Inconnue' : adr?.Ville donne null, puis ?? met 'Inconnue'", "null", "\"\""], a: 1, exp: "?. protège, ?? complète." },
      { type: "vf", q: "(4) Tester <code>age.HasValue</code> avant <code>age.Value</code> évite une exception si age est null.", a: true, exp: "On ne lit Value qu'après avoir confirmé la présence." },
      { type: "qcm", q: "(5) <code>adr?.Valider();</code> : si adr est null, alors…", opts: ["Une exception est levée", "Rien ne se passe : l'appel est court-circuité, aucune exception", "Valider() est quand même appelé", "adr est réinitialisé à null"], a: 1, exp: "?. n'appelle la méthode que sur un objet non null." }
    ],
    solution: `<pre class="pseudo">surnom ?? "Invité"          // valeur de secours si null
age ?? 0                    // 0 quand l'âge est inconnu
adr?.Ville ?? "Inconnue"    // navigation sûre puis secours
age.HasValue && age.Value   // on lit Value seulement si présent
adr?.Valider()              // appel uniquement si adr existe</pre>
<p>Résultat : aucune NullReferenceException possible. Les trois outils clés : <code>?</code> (nullable), <code>??</code> (sinon), <code>?.</code> (navigation sûre). Prochaine leçon : la programmation asynchrone avec async/await.</p>`
  }
};

      "solution": "// Le formulaire d'inscription au stage : ce qui n'a pas été rempli n'est pas égal à zéro.\nusing System;\nusing System.Collections.Generic;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        List<Inscription> stage = new List<Inscription>();\n        stage.Add(new Inscription(\"Ndiaye Fatou\", 16, \"0475 11 22 33\",\n                                  new DateTime(2026, 5, 12)));\n        stage.Add(new Inscription(\"Peeters Marc\", null, \"0498 44 55 66\", null));\n        stage.Add(new Inscription(\"Lorent Julie\", 15, null, new DateTime(2026, 4, 30)));\n        stage.Add(new Inscription(\"Kaïro Sami\", 17, \"0471 77 88 99\", new DateTime(2026, 6, 1)));\n        stage.Add(new Inscription(\"Dhondt Anne\", null, null, null));\n        stage.Add(new Inscription(\"Maes Lotte\", 14, \"0489 00 11 22\", new DateTime(2026, 5, 20)));\n\n        // Deux groupes déjà attribués ; les autres restent vides.\n        stage[0].Groupe = \"Ados A\";\n        stage[3].Groupe = \"Ados B\";\n\n        Console.WriteLine(\"LES FICHES TELLES QU'ELLES ARRIVENT\");\n        foreach (Inscription i in stage)\n        {\n            // ?? : « la valeur, SINON celle-ci ». ?. : « seulement si ce n'est pas vide ».\n            Console.WriteLine($\"{i.Nom}\");\n            Console.WriteLine($\"  âge : {(i.Age.HasValue ? i.Age.Value.ToString() : \"non renseigné\")}\");\n            Console.WriteLine($\"  téléphone : {i.Telephone ?? \"non communiqué\"}\");\n            Console.WriteLine($\"  longueur du numéro : {i.Telephone?.Length ?? 0}\");\n            Console.WriteLine($\"  groupe : {i.Groupe ?? \"à répartir\"}\");\n        }\n\n        Console.WriteLine();\n\n        // ??= : n'affecte QUE si la valeur est vide.\n        Console.WriteLine(\"RÉPARTITION AUTOMATIQUE\");\n        int repartis = 0;\n        foreach (Inscription i in stage)\n        {\n            if (i.Groupe is null)\n            {\n                repartis++;\n            }\n            i.Groupe ??= \"Groupe d'attente\";\n        }\n        Console.WriteLine($\"Fiches réparties d'office : {repartis}\");\n        foreach (Inscription i in stage)\n        {\n            Console.WriteLine($\"  {i.Nom} → {i.Groupe}\");\n        }\n\n        Console.WriteLine();\n\n        // On ne calcule une moyenne QUE sur ce qui est renseigné.\n        int sommeAges = 0;\n        int renseignes = 0;\n        foreach (Inscription i in stage)\n        {\n            if (i.Age.HasValue)                       // toujours demander avant de lire\n            {\n                sommeAges += i.Age.Value;\n                renseignes++;\n            }\n        }\n        Console.WriteLine(\"LES ÂGES\");\n        Console.WriteLine($\"Âges renseignés : {renseignes} sur {stage.Count}\");\n        Console.WriteLine($\"Somme des âges connus : {sommeAges}\");\n        Console.WriteLine($\"Moyenne des âges connus : {(double)sommeAges / renseignes:F2} ans\");\n        Console.WriteLine($\"Moyenne si l'on comptait les absents pour zéro : \"\n                        + $\"{(double)sommeAges / stage.Count:F2} ans\");\n\n        Console.WriteLine();\n\n        int longueurs = 0;\n        int avecTelephone = 0;\n        foreach (Inscription i in stage)\n        {\n            longueurs += i.Telephone?.Length ?? 0;    // vide → 0, sans plantage\n            if (i.Telephone is not null)\n            {\n                avecTelephone++;\n            }\n        }\n        Console.WriteLine($\"Numéros communiqués : {avecTelephone}\");\n        Console.WriteLine($\"Total des longueurs de numéros : {longueurs}\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"LES CERTIFICATS MÉDICAUX\");\n        DateTime rentree = new DateTime(2026, 7, 1);\n        foreach (Inscription i in stage)\n        {\n            if (i.Certificat.HasValue)\n            {\n                TimeSpan avance = rentree - i.Certificat.Value;\n                Console.WriteLine($\"  {i.Nom} : certificat du \"\n Console.WriteLine($\"  {nom} : composition du {numero} ({numero.Length} caractères)\");\n    }\n}\n\nclass Inscription\n{\n    public string Nom { get; private set; }\n    public int? Age { get; private set; }              // un entier qui peut dire « je ne sais pas »\n    public string Telephone { get; private set; }      // un texte qui peut être absent\n    public DateTime? Certificat { get; private set; }  // une date qui peut manquer\n    public string Groupe { get; set; }                 // attribué plus tard, vide au départ\n\n    public Inscription(string nom, int? age, string telephone, DateTime? certificat)\n    {\n        if (nom is null || nom == \"\")\n        {\n            throw new ArgumentException(\"une inscription sans nom n'existe pas\");\n        }\n        if (age.HasValue && (age.Value < 6 || age.Value > 25))\n        {\n            throw new ArgumentException($\"{nom} : âge de {age.Value} ans hors du stage\");\n        }\n        this.Nom = nom;\n        this.Age = age;\n        this.Telephone = telephone;\n        this.Certificat = certificat;\n    }\n\n    public override string ToString()\n    {\n        return $\"{Nom} — {Age?.ToString() ?? \"âge inconnu\"} — {Telephone ?? \"sans numéro\"}\";\n    }\n}",

        "Écris et teste la conversion d'un champ en date optionnelle avant tout le reste : un champ vide doit rendre une absence, un champ rempli une date, et n'importe quoi d'autre doit lancer. Cette petite méthode est le seul endroit du programme où le format du fichier rencontre le type des données — si elle est juste, la suite ne peut plus être surprise.",

      "solution": "// Le carnet de vaccination : un champ vide dans un fichier n'est pas une date.\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Linq;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        const string CARNET = \"carnet.csv\";\n        const string RELANCES = \"relances.txt\";\n\n        string[] brut =\n        {\n            \"Ndiaye Fatou;2008-03-14;2025-09-10;2025-10-08;2026-04-12\",\n            \"Peeters Marc;2011-07-02;2025-09-17;;\",\n            \"Lorent Julie;2009-11-23;2025-10-01;2025-10-29;\",\n            \"Kaïro Sami;2007-01-30;;;\",\n            \"Dhondt Anne;2010-05-18;2025-09-24;2025-10-22;2026-05-06\",\n            \"Maes Lotte;2012-02-09;2025-11-05;2025-12-03;\"\n        };\n        File.WriteAllLines(CARNET, brut);\n\n        if (!File.Exists(CARNET))\n        {\n            Console.WriteLine(\"Carnet introuvable\");\n            return;\n        }\n\n        DateTime reference = new DateTime(2026, 6, 1);\n        List<Patient> carnet = new List<Patient>();\n        foreach (string ligne in File.ReadAllLines(CARNET))\n        {\n            if (ligne == \"\")\n            {\n                continue;\n            }\n            carnet.Add(Patient.DepuisLigne(ligne));\n        }\n        Console.WriteLine($\"Dossiers lus : {carnet.Count}\");\n        Console.WriteLine($\"Bilan arrêté au {reference.ToString(\"dd/MM/yyyy\")}\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"LE CARNET, DOSSIER PAR DOSSIER\");\n        foreach (Patient p in carnet)\n        {\n            Console.WriteLine($\"{p.Nom} — {p.AgeAu(reference)} ans\");\n            Console.WriteLine($\"  dose 1 : {Texte(p.Dose1)}\");\n            Console.WriteLine($\"  dose 2 : {Texte(p.Dose2)}\");\n            Console.WriteLine($\"  rappel : {Texte(p.Rappel)}\");\n            Console.WriteLine($\"  schéma complet : {p.EstComplet()}\");\n        }\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"CE QUI EST RENSEIGNÉ\");\n        Console.WriteLine($\"Première dose : {carnet.Count(p => p.Dose1.HasValue)} sur \"\n                        + $\"{carnet.Count}\");\n        Console.WriteLine($\"Deuxième dose : {carnet.Count(p => p.Dose2.HasValue)}\");\n        Console.WriteLine($\"Rappel : {carnet.Count(p => p.Rappel.HasValue)}\");\n        Console.WriteLine($\"Schémas complets : {carnet.Count(p => p.EstComplet())}\");\n        Console.WriteLine($\"Aucune dose du tout : \"\n                        + $\"{carnet.Count(p => !p.Dose1.HasValue)}\");\n\n        Console.WriteLine();\n\n        // L'intervalle n'existe que si les deux dates existent : il est donc lui aussi optionnel.\n        Console.WriteLine(\"INTERVALLE ENTRE LES DEUX PREMIÈRES DOSES\");\n        int sommeJours = 0;\n        int mesurables = 0;\n        foreach (Patient p in carnet)\n        {\n            int? jours = p.IntervalleDoses();\n            if (jours.HasValue)\n            {\n                sommeJours += jours.Value;\n                mesurables++;\n                Console.WriteLine($\"  {p.Nom} : {jours.Value} jours\");\n            }\n            else\n            {\n                Console.WriteLine($\"  {p.Nom} : non mesurable\");\n            }\n        }\n        Console.WriteLine($\"Intervalles mesurables : {mesurables}\");\n        Console.WriteLine($\"Intervalle moyen : {(double)sommeJours / mesurables:F2} jours\");\n\n        Console.WriteLine();\n\n        // Deux lectures du même carnet, selon ce qu'on décide de faire des absences.\n        Console.WriteLine(\"DEUX FAÇONS DE COMPTER LES DOSES REÇUES\");\n        int dosesRecues = 0;\n        foreach (Patient p in carnet)\n        {\n            dosesRecues += p.NombreDeDoses();\n        }\n        Console.WriteLine($\"Doses effectivement administrées : {dosesRecues}\");\n        Console.WriteLine($\"Doses attendues pour un schéma complet : {carnet.Count * 3}\");\n        Console.WriteLine($\"Doses manquantes : {carnet.Count * 3 - dosesRecues}\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"LES RELANCES À ENVOYER\");\n        List<string> relances = new List<string>();\n        foreach (Patient p in carnet)\n        {\n            string motif = p.Motif(reference);\n            if (motif is not null)\n            {\n                relances.Add($\"{p.Nom} : {motif}\");\n            }\n        }\n        foreach (string r in relances)\n        {\n            Console.WriteLine($\"  {r}\");\n        }\n        File.WriteAllLines(RELANCES, relances);\n        Console.WriteLine($\"{File.ReadAllLines(RELANCES).Length} relances écrites\");\n\n        Console.WriteLine();\n\n        // Ce qui arrive si l'on lit une valeur absente sans demander.\n        Console.WriteLine(\"DEUX LECTURES IMPRUDENTES\");\n        Patient sansDose = carnet.First(p => !p.Dose1.HasValue);\n        try\n        {\n            Console.WriteLine(sansDose.Dose1.Value.ToString(\"dd/MM/yyyy\"));\n        }\n        catch (InvalidOperationException)\n        {\n            Console.WriteLine($\"{sansDose.Nom} : lire une date absente fait tomber le programme\");\n        }\n        Console.WriteLine($\"Avec la valeur de secours : \"\n                        + $\"{Texte(sansDose.Dose1)}\");\n\n        Console.WriteLine($\"Année de la dose 1, en prudent : \"\n                        + $\"{sansDose.Dose1?.Year ?? 0}\");\n    }\n\n    static string Texte(DateTime? date)\n    {\n        if (date is null)\n        {\n            return \"non renseignée\";\n        }\n        return date.Value.ToString(\"dd/MM/yyyy\");\n    }\n}\n\nclass Patient\n{\n    public string Nom { get; private set; }\n    public DateTime Naissance { get; private set; }\n    public DateTime? Dose1 { get; private set; }\n    public DateTime? Dose2 { get; private set; }\n    public DateTime? Rappel { get; private set; }\n\n    public Patient(string nom, DateTime naissance, DateTime? dose1, DateTime? dose2,\n                   DateTime? rappel)\n    {\n        if (nom is null || nom == \"\")\n        {\n            throw new ArgumentException(\"un dossier sans nom n'existe pas\");\n        }\n        if (dose2.HasValue && !dose1.HasValue)\n        {\n            throw new ArgumentException($\"{nom} : deuxième dose sans première dose\");\n        }\n        this.Nom = nom;\n        this.Naissance = naissance;\n        this.Dose1 = dose1;\n        this.Dose2 = dose2;\n        this.Rappel = rappel;\n    }\n\n    public static Patient DepuisLigne(string ligne)\n    {\n        string[] champs = ligne.Split(';');\n        if (champs.Length != 5)\n        {\n            throw new ArgumentException($\"« {ligne} » : cinq champs attendus\");\n        }\n        return new Patient(champs[0], LireDate(champs[1]).Value, LireDate(champs[2]),\n                           LireDate(champs[3]), LireDate(champs[4]));\n    }\n\n    // Un champ vide devient une absence, PAS une date par défaut.\n    static DateTime? LireDate(string texte)\n    {\n        if (texte == \"\")\n        {\n            return null;\n        }\n        string[] parts = texte.Split('-');\n        if (parts.Length != 3)\n        {\n            throw new ArgumentException($\"date « {texte} » illisible\");\n        }\n        return new DateTime(int.Parse(parts[0]), int.Parse(parts[1]), int.Parse(parts[2]));\n    }\n\n    public int AgeAu(DateTime reference)\n    {\n        int age = reference.Year - Naissance.Year;\n        if (reference.Month < Naissance.Month\n            || (reference.Month == Naissance.Month && reference.Day < Naissance.Day))\n        {\n            age--;\n        }\n        return age;\n    }\n\n    public bool EstComplet()\n    {\n        return Dose1.HasValue && Dose2.HasValue && Rappel.HasValue;\n    }\n\n    public int NombreDeDoses()\n    {\n        int n = 0;\n        if (Dose1.HasValue) { n++; }\n        if (Dose2.HasValue) { n++; }\n        if (Rappel.HasValue) { n++; }\n        return n;\n    }\n\n    // Un intervalle entre deux dates dont l'une peut manquer est lui-même optionnel.\n    public int? IntervalleDoses()\n    {\n        if (!Dose1.HasValue || !Dose2.HasValue)\n        {\n            return null;\n        }\n        return (Dose2.Value - Dose1.Value).Days;\n    }\n\n    public string Motif(DateTime reference)\n    {\n        if (!Dose1.HasValue)\n        {\n            return \"aucune dose reçue, convoquer d'urgence\";\n        }\n        if (!Dose2.HasValue)\n        {\n            return \"deuxième dose manquante\";\n        }\n        if (!Rappel.HasValue)\n        {\n            return $\"rappel à programmer, deuxième dose du \"\n                 + $\"{Dose2.Value.ToString(\"dd/MM/yyyy\")}\";\n        }\n        return null;                       // rien à relancer : la valeur vide dit « rien »\n    }\n\n    public override string ToString()\n    {\n        return $\"{Nom} — {NombreDeDoses()} dose(s)\";\n    }\n}",

      ],
      "solution": "// Le marché du samedi, jour 3 : deux exposants n'ont rien déclaré, et tout doit tenir.\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Linq;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        const string SOURCE = \"marche-v3.csv\";\n        const int REDEVANCE_M2 = 250;\n        const int SEUIL = 40000;\n\n        if (!File.Exists(SOURCE))\n        {\n            Console.WriteLine(\"Feuille de marché introuvable : premier lancement, on l'écrit\");\n            List<string> feuille = new List<string>();\n            feuille.Add(\"E-01;Verhoeven;maraîcher;12;48500\");\n            feuille.Add(\"E-02;Lambert;fromager;6;31200\");\n            feuille.Add(\"E-03;Ozturk;traiteur;9;52700\");\n            feuille.Add(\"E-04;Nkosi;textile;15;\");            // rien déclaré\n            feuille.Add(\"E-05;Dubois;maraîcher;10;41300\");\n            feuille.Add(\"E-06;Petrov;boulanger;6;28900\");\n            feuille.Add(\"E-07;Simon;fleuriste;4;15600\");\n            feuille.Add(\"E-08;Haddad;traiteur;12;61400\");\n            feuille.Add(\"E-09;Marchal;maraîcher;8;33500\");\n            feuille.Add(\"E-10;Weber;fromager;5;\");            // rien déclaré non plus\n            feuille.Add(\"E-11;Lopes;textile;18;24300\");\n            feuille.Add(\"E-12;Bianchi;boulanger;7;35800\");\n            File.WriteAllLines(SOURCE, feuille);\n        }\n        else\n        {\n            Console.WriteLine(\"Feuille de marché trouvée : on repart du samedi précédent\");\n        }\n\n        List<Etal> marche = new List<Etal>();\n        foreach (string ligne in File.ReadAllLines(SOURCE))\n        {\n            if (ligne == \"\")\n            {\n                continue;\n            }\n            marche.Add(Etal.DepuisLigne(ligne));\n        }\n        Console.WriteLine($\"Étals installés : {marche.Count}\");\n        Console.WriteLine($\"Chiffres déclarés : {marche.Count(e => e.ChiffreCentimes.HasValue)}\");\n        Console.WriteLine($\"Déclarations manquantes : \"\n                        + $\"{marche.Count(e => !e.ChiffreCentimes.HasValue)}\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"LA FEUILLE\");\n        foreach (Etal e in marche)\n        {\n            Console.WriteLine($\"  {e}\");\n        }\n\n        Console.WriteLine();\n\n        // La redevance ne dépend pas de la déclaration : elle est due par tout le monde.\n        Console.WriteLine(\"CE QUI NE DÉPEND PAS DES DÉCLARATIONS\");\n        Console.WriteLine($\"Surface occupée : {Totaliser(marche, e => e.SurfaceM2)} m²\");\n        Console.WriteLine($\"Redevance due : \"\n                        + $\"{Totaliser(marche, e => e.SurfaceM2 * REDEVANCE_M2) / 100.0:F2} €\");\n\n        Console.WriteLine();\n\n        // Le chiffre, lui, n'existe que pour ceux qui l'ont déclaré.\n        int cumul = 0;\n        int declarants = 0;\n        foreach (Etal e in marche)\n        {\n            if (e.ChiffreCentimes.HasValue)\n            {\n                cumul += e.ChiffreCentimes.Value;\n                declarants++;\n            }\n        }\n        Console.WriteLine(\"LES DEUX MOYENNES, ET ELLES NE DISENT PAS LA MÊME CHOSE\");\n        Console.WriteLine($\"Chiffre déclaré cumulé : {cumul / 100.0:F2} €\");\n        Console.WriteLine($\"Moyenne sur les {declarants} déclarants : \"\n                        + $\"{(double)cumul / declarants / 100.0:F2} €\");\n        Console.WriteLine($\"Moyenne sur les {marche.Count} étals, absents comptés pour zéro : \"\n                        + $\"{(double)cumul / marche.Count / 100.0:F2} €\");\n        Console.WriteLine(\"La première décrit les exposants, la seconde décrit le marché.\");\n\n        Console.WriteLine();\n\n        // La somme, elle, ne change pas : ajouter zéro n'ajoute rien. C'est le piège.\n        Console.WriteLine($\"Somme en ignorant les absents : \"\n                        + $\"{Totaliser(marche, e => e.ChiffreCentimes ?? 0) / 100.0:F2} €\");\n        Console.WriteLine(\"Une somme ne trahit jamais une absence — seule une moyenne le fait.\");\n\n        Console.WriteLine();\n\n        // Un rendement au mètre carré n'existe pas non plus sans déclaration.\n        Console.WriteLine(\"RENDEMENT AU MÈTRE CARRÉ\");\n        foreach (Etal e in marche)\n        {\n            int? rendement = e.RendementCentimes();\n            if (rendement.HasValue)\n            {\n                Console.WriteLine($\"  {e.Code} {e.Exposant} : {rendement.Value / 100.0:F2} € / m²\");\n            }\n            else\n            {\n                Console.WriteLine($\"  {e.Code} {e.Exposant} : incalculable, rien de déclaré\");\n            }\n        }\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"LES TROIS MEILLEURS RENDEMENTS\");\n        List<Etal> classables = Filtrer(marche, e => e.RendementCentimes().HasValue);\n        List<Etal> classes = classables\n            .OrderByDescending(e => e.RendementCentimes().Value)\n            .ToList();\n        for (int i = 0; i < 3; i++)\n        {\n            Console.WriteLine($\"  {i + 1}. {classes[i].Code} {classes[i].Exposant}\");\n        }\n\n        Console.WriteLine();\n\n        // Le contrôle d'hier, augmenté d'un second signal pour les non-déclarants.\n        Controle controle = new Controle(SEUIL);\n\n        int depassements = 0;\n        int cumulEcart = 0;\n        List<string> manquants = new List<string>();\n\n        controle.Depassement += (e, ecart) =>\n        {\n            depassements++;\n            cumulEcart += ecart;\n        };\n        controle.NonDeclare += e => manquants.Add($\"{e.Code} {e.Exposant}\");\n\n        Console.WriteLine(\"PASSAGE DU PLACIER\");\n        controle.Examiner(marche);\n        Console.WriteLine($\"Dépassements du seuil de {SEUIL / 100.0:F2} € : {depassements}\");\n        Console.WriteLine($\"Cumul au-dessus du seuil : {cumulEcart / 100.0:F2} €\");\n        Console.WriteLine($\"Déclarations à réclamer : {manquants.Count}\");\n        foreach (string m in manquants)\n        {\n            Console.WriteLine($\"  {m}\");\n        }\n\n        Console.WriteLine();\n\n        // Une recherche qui peut ne rien trouver, et ce qu'on en fait.\n        Etal poissonnier = marche.FirstOrDefault(e => e.Categorie == \"poissonnier\");\n        Console.WriteLine($\"Poissonnier : {poissonnier?.Exposant ?? \"aucun ce samedi\"}\");\n        Console.WriteLine($\"Son chiffre : \"\n                        + $\"{poissonnier?.ChiffreCentimes?.ToString() ?? \"sans objet\"}\");\n\n        Etal premierTextile = marche.FirstOrDefault(e => e.Categorie == \"textile\");\n        Console.WriteLine($\"Premier textile : {premierTextile?.Exposant ?? \"aucun\"}\");\n        Console.WriteLine($\"Son chiffre : \"\n                        + $\"{premierTextile?.ChiffreCentimes?.ToString() ?? \"non déclaré\"}\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"DEUX LECTURES IMPRUDENTES\");\n        Etal muet = marche.First(e => !e.ChiffreCentimes.HasValue);\n        try\n        {\n            Console.WriteLine(muet.ChiffreCentimes.Value);\n        }\n        catch (InvalidOperationException)\n        {\n            Console.WriteLine($\"{muet.Code} : lire un chiffre non déclaré fait tomber le programme\");\n        }\n\n        try\n        {\n            Console.WriteLine(poissonnier.Exposant);\n        }\n        catch (NullReferenceException)\n        {\n            Console.WriteLine(\"Lire le nom d'un exposant qui n'existe pas aussi\");\n        }\n        Console.WriteLine($\"Les deux formes prudentes : {muet.ChiffreCentimes ?? 0} et \"\n                        + $\"{poissonnier?.Exposant ?? \"personne\"}\");\n    }\n\n    static List<Etal> Filtrer(List<Etal> source, Func<Etal, bool> critere)\n    {\n        List<Etal> retenus = new List<Etal>();\n        foreach (Etal e in source)\n        {\n            if (critere(e))\n            {\n                retenus.Add(e);\n            }\n        }\n        return retenus;\n    }\n\n    static int Totaliser(List<Etal> source, Func<Etal, int> mesure)\n    {\n        int total = 0;\n        foreach (Etal e in source)\n        {\n            total += mesure(e);\n        }\n        return total;\n    }\n}\n\nclass Controle\n{\n    public int SeuilCentimes { get; private set; }\n\n    public event Action<Etal, int> Depassement;\n    public event Action<Etal> NonDeclare;\n\n    public Controle(int seuilCentimes)\n    {\n        if (seuilCentimes <= 0)\n        {\n            throw new ArgumentException($\"seuil de {seuilCentimes} centimes impossible\");\n        }\n        this.SeuilCentimes = seuilCentimes;\n    }\n\n    public void Examiner(List<Etal> marche)\n    {\n        foreach (Etal e in marche)\n        {\n            if (!e.ChiffreCentimes.HasValue)\n            {\n                NonDeclare?.Invoke(e);          // une absence n'est pas un dépassement\n                continue;\n            }\n            if (e.ChiffreCentimes.Value > SeuilCentimes)\n            {\n                Depassement?.Invoke(e, e.ChiffreCentimes.Value - SeuilCentimes);\n            }\n        }\n    }\n}\n\nclass Etal\n{\n    public string Code { get; private set; }\n    public string Exposant { get; private set; }\n    public string Categorie { get; private set; }\n    public int SurfaceM2 { get; private set; }\n    public int? ChiffreCentimes { get; private set; }    // absent tant qu'il n'est pas déclaré\n\n    public Etal(string code, string exposant, string categorie, int surfaceM2,\n                int? chiffreCentimes)\n    {\n        if (surfaceM2 <= 0)\n        {\n            throw new ArgumentException($\"{code} : surface de {surfaceM2} m² impossible\");\n        }\n        if (chiffreCentimes.HasValue && chiffreCentimes.Value < 0)\n        {\n            throw new ArgumentException($\"{code} : chiffre négatif impossible\");\n        }\n        this.Code = code;\n        this.Exposant = exposant;\n        this.Categorie = categorie;\n        this.SurfaceM2 = surfaceM2;\n        this.ChiffreCentimes = chiffreCentimes;\n    }\n\n    public static Etal DepuisLigne(string ligne)\n    {\n        string[] champs = ligne.Split(';');\n        if (champs.Length != 5)\n        {\n            throw new ArgumentException($\"« {ligne} » : cinq champs attendus\");\n        }\n        int? chiffre = null;\n        if (champs[4] != \"\")\n        {\n            chiffre = int.Parse(champs[4]);\n        }\n        return new Etal(champs[0], champs[1], champs[2], int.Parse(champs[3]), chiffre);\n    }\n\n    public int? RendementCentimes()\n    {\n        if (!ChiffreCentimes.HasValue)\n        {\n            return null;\n        }\n        return ChiffreCentimes.Value / SurfaceM2;\n    }\n\n    public override string ToString()\n    {\n        string chiffre = \"non déclaré\";\n        if (ChiffreCentimes.HasValue)\n        {\n            chiffre = $\"{ChiffreCentimes.Value / 100.0:F2} €\";\n        }\n        return $\"{Code} — {Exposant} ({Categorie}) — {SurfaceM2} m² — {chiffre}\";\n    }\n}",
      "pourquoi": "Tout ce qui a été construit lundi et mardi — les requêtes, les critères paramétrés, l'événement du placier — tient encore aujourd'hui, et c'était le but. Ce qui a dû changer, ce sont les endroits où le programme supposait qu'une valeur existait toujours. Il y en avait exactement trois, et aucun n'aurait signalé son erreur.",
      "checklist": [
        "Comptes-tu 10 chiffres déclarés et 2 déclarations manquantes ?",
        "La redevance vaut-elle toujours 280,00 € pour 112 m², malgré les deux absences ?",
        "Les deux moyennes donnent-elles 373,20 € et 311,00 € ?",
        "La somme vaut-elle 3 732,00 € dans les deux façons de compter ?",
        "Le placier relève-t-il 4 dépassements pour 439,00 €, et 2 déclarations à réclamer ?"
      ],
      "note": "Jour 3 sur 4. Le marché tient debout avec des trous dans ses données. Il reste une hypothèse que tu n'as pas encore touchée : tout arrive d'un seul fichier, lu d'un seul coup, en un seul endroit. Demain, les données viendront de trois marchés à la fois."
    }
  ]
};

  { id: "cs-nullable", title: "La moyenne d'âge sans planter", level: 2,
    statement: "Une <code>List&lt;int?&gt;</code> contient des âges dont certains sont <code>null</code> (non renseignés). Calcule et affiche la moyenne des âges CONNUS seulement. Utilise <code>HasValue</code> (ou un test != null) pour ignorer les null, et gère le cas où aucun âge n'est connu.",
    hints: [
      "Parcours la liste ; pour chaque a, teste a.HasValue avant d'utiliser a.Value.",

      "Si le compteur vaut 0, affiche un message plutôt que de diviser par zéro."
    ],
    checklist: ["On teste a.HasValue avant de lire a.Value pour ignorer les null.", "Une somme et un compteur n'accumulent que les âges présents.", "Le cas compte == 0 est traité pour éviter une division par zéro.", "Avec 30, null, 25, null, 40 : somme 95, compte 3, moyenne ~31,7."],
    solution: "using System;                                       // Console\nusing System.Collections.Generic;                   // List\n\nclass MoyenneAge                                    // classe programme\n{                                                   // début\n    static void Main()                              // point d'entrée\n    {                                               // début de Main\n        List<int?> ages = new List<int?> { 30, null, 25, null, 40 }; // certains âges manquent\n        int somme = 0;                              // total des âges connus\n        int compte = 0;                             // combien d'âges connus\n        foreach (int? a in ages)                    // on parcourt chaque âge nullable\n        {                                           // début du corps\n            if (a.HasValue)                         // n'utiliser que les âges présents\n            {                                       // début du if\n                somme += a.Value;                   // on ajoute la valeur réelle\n                compte++;                           // on compte cet âge\n            }                                       // fin du if\n        }                                           // fin du foreach\n        if (compte == 0)                            // aucun âge connu ?\n            Console.WriteLine(\"Aucun âge renseigné\"); // message de secours\n        else                                        // sinon on peut diviser\n            Console.WriteLine($\"Moyenne : {(double)somme / compte:F1}\"); // moyenne à 1 décimale\n    }                                               // fin de Main\n}                                                   // fin de la classe",
    note: "On lit a.Value SEULEMENT après avoir vérifié a.HasValue, et on teste compte == 0 pour éviter une division par zéro : double sécurité." }
