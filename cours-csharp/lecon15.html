  title: "Interfaces et classes abstraites",
  subtitle: "Des contrats sans implémentation : programmer par promesses.",
  theory: `
<h3>1. La classe abstraite : un moule inachevé</h3>
<p>Une classe <strong>abstraite</strong> sert de base commune mais ne peut pas être instanciée directement : elle représente un concept trop général (un « Animal » en soi n'existe pas, seuls existent des chiens, des chats…).</p>
<pre class="pseudo">abstract class Animal                                          // abstract : on ne pourra pas faire new Animal(...)
{
    protected string nom;
    public Animal(string nom) { this.nom = nom; }
    public void Manger() { Console.WriteLine($"{nom} mange"); }  // méthode CONCRÈTE : code fourni, partagé
    public abstract void Crier();       // méthode ABSTRAITE : aucune implémentation, à définir dans les filles
}
Animal a = new Animal("X");     // ERREUR : on n'instancie pas une classe abstraite
Animal a = new Chien("Rex");    // OK : Chien est une classe concrète qui complète le moule</pre>
<p>Une méthode <code>abstract</code> n'a pas de corps : elle impose une obligation. Chaque classe fille <strong>concrète</strong> DOIT la redéfinir (<code>override</code>), sinon le code ne compile pas. Pas besoin de <code>virtual</code> : <code>abstract</code> l'implique déjà.</p>

<h3>2. L'interface : un contrat de capacités</h3>
<pre class="pseudo">interface IExportable                     // convention C# : nom d'interface préfixé par un I majuscule
{
    string ToJson();                      // juste la SIGNATURE : « toute classe IExportable saura faire un ToJson »
}
interface IComparable2
{
    int ComparerA(object autre);          // une autre capacité, un autre contrat
}
class Facture : IExportable, IComparable2  // une classe peut signer PLUSIEURS contrats
{
    public string ToJson() { /* ... */ }          // elle DOIT fournir le code de chaque méthode promise
    public int ComparerA(object autre) { /* ... */ }
}</pre>
<p>Une interface ne contient que des signatures (pas de code, pas d'attributs) : c'est une <strong>promesse</strong>. Toute classe qui l'implémente s'engage à fournir ces méthodes.</p>

<h3>3. Le « : » sert à TOUT (héritage ET interfaces)</h3>
<pre class="pseudo">class Chien : Animal, IExportable          // UNE classe mère (Animal) + une ou plusieurs interfaces
// Ordre imposé : la classe mère d'abord, puis les interfaces</pre>
<div class="tip">En C#, le même <code>:</code> introduit la classe mère ET les interfaces (Java séparait <code>extends</code> et <code>implements</code>). Règle : une seule classe mère, mais autant d'interfaces que voulu — c'est l'échappatoire à l'héritage simple.</div>

<h3>4. Programmer contre l'interface</h3>
<pre class="pseudo">List&lt;IExportable&gt; documents = new List&lt;IExportable&gt; {   // une liste de « tout ce qui sait s'exporter »
    new Facture(), new Bulletin(), new Affiche()       // objets de classes différentes, même contrat
};
foreach (IExportable doc in documents)
{
    Console.WriteLine(doc.ToJson());       // chacun exporte à sa façon : polymorphisme via l'interface
}</pre>
<p>La boucle ne sait pas si <code>doc</code> est une Facture ou une Affiche : elle sait seulement qu'il respecte le contrat <code>IExportable</code>. Ajouter une nouvelle classe qui implémente l'interface fonctionne sans toucher à ce code.</p>

<h3>5. Dans la vraie vie .NET</h3>
<pre class="pseudo">IComparable, IEnumerable, IDisposable...    // interfaces standard omniprésentes dans .NET
List&lt;T&gt; : IList&lt;T&gt;                          // même la classe List implémente une interface</pre>
<p>Programmer contre une interface (<code>IList&lt;T&gt;</code> plutôt que <code>List&lt;T&gt;</code>) permet de changer d'implémentation plus tard sans réécrire le code qui l'utilise.</p>

<h3>6. abstract ou interface ?</h3>
<pre class="pseudo">Code COMMUN à partager + relation « est un »   → classe abstraite
Juste une CAPACITÉ (exportable, comparable…)    → interface
Les deux se combinent : class Chien : Animal, IExportable, INageur</pre>
<div class="warn">Rendre <code>Crier()</code> abstraite FORCE chaque espèce à définir son propre cri, et le compilateur le vérifie. L'oubli silencieux (une méthode vide « … ») devient impossible : l'obligation est garantie à la compilation.</div>`,

    { type: "qcm", q: "Une méthode abstract a-t-elle besoin de virtual ?", opts: ["Oui, toujours", "Non : abstract implique virtual (elle est forcément redéfinie)", "Parfois selon les cas", "Jamais de redéfinition"], a: 1, exp: "abstract = pas de corps + redéfinition obligatoire." },

<pre class="pseudo">abstract class Vehicule
{
    protected string immat;
    public Vehicule(string immat) { this.immat = immat; }
    public void Demarrer() { Console.WriteLine($"{immat} démarre"); }
    public abstract double CoutParKm();
}
interface IElectrique
{
    void Recharger();
}
class Camion : Vehicule
{
    public Camion(string i) : base(i) { }
    public override double CoutParKm() => 0.9;
}
class VeloCargo : Vehicule, IElectrique
{
    public VeloCargo(string i) : base(i) { }
    public override double CoutParKm() => 0.05;
    public void Recharger() => Console.WriteLine($"{immat} en charge");
}</pre>`,

new Vehicule(...) → interdit

      "solution": "// La serre horticole : un moule inachevé, et un contrat que tous ne signent pas.\nusing System;\nusing System.Collections.Generic;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        // Capteur c = new Capteur(\"X\", \"Y\");   // refusé : une classe abstraite ne s'instancie pas\n        List<Capteur> serre = new List<Capteur>();\n        serre.Add(new CapteurTemperature(\"T-01\", \"Semis\", 19));\n        serre.Add(new CapteurTemperature(\"T-02\", \"Tomates\", 33));\n        serre.Add(new CapteurHumidite(\"H-01\", \"Semis\", 62));\n        serre.Add(new CapteurHumidite(\"H-02\", \"Tomates\", 31));\n        serre.Add(new CapteurLumiere(\"L-01\", \"Semis\", 5400));\n        serre.Add(new CapteurLumiere(\"L-02\", \"Orchidées\", 1500));\n\n        Console.WriteLine(\"RELEVÉ DE 8 HEURES\");\n        foreach (Capteur c in serre)\n        {\n            Console.WriteLine(c);          // chaque capteur sait se lire : la mère l'exige\n        }\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"ALERTES\");\n        int alertes = 0;\n        foreach (Capteur c in serre)\n        {\n            if (c.EstEnAlerte())\n            {\n                alertes++;\n                Console.WriteLine($\"{c.Reference} hors plage : {c.Mesure()} {c.Unite()}\");\n            }\n        }\n        Console.WriteLine($\"Capteurs en alerte : {alertes} sur {serre.Count}\");\n\n        Console.WriteLine();\n\n        // On ne totalise pas des degrés avec des lux : la moyenne se calcule par famille.\n        int sommeDegres = 0;\n        int nombreThermometres = 0;\n        foreach (Capteur c in serre)\n        {\n            if (c is CapteurTemperature)\n            {\n                sommeDegres += c.Mesure();\n                nombreThermometres++;\n            }\n        }\n        Console.WriteLine($\"Température moyenne sous serre : {sommeDegres / nombreThermometres} °C\");\n\n        Console.WriteLine();\n\n        // Le contrat d'étalonnage traverse la hiérarchie : deux familles sur trois le signent.\n        List<IEtalonnable> aEtalonner = new List<IEtalonnable>();\n        foreach (Capteur c in serre)\n        {\n            if (c is IEtalonnable e)       // teste le CONTRAT, pas la classe\n            {\n                aEtalonner.Add(e);\n            }\n        }\n\n        Console.WriteLine(\"CAMPAGNE D'ÉTALONNAGE\");\n        foreach (IEtalonnable e in aEtalonner)\n        {\n            Console.WriteLine(e.Etalonner());   // la liste ignore de quelle classe il s'agit\n        }\n        Console.WriteLine($\"Capteurs étalonnables : {aEtalonner.Count} sur {serre.Count}\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"PRÉSENTATION DU PARC\");\n        foreach (Capteur c in serre)\n        {\n            c.Presenter();                 // code écrit UNE fois dans la mère, valable pour tous\n        }\n    }\n}\n\nabstract class Capteur                     // abstract : on ne pourra pas faire new Capteur(...)\n{\n    public string Reference { get; private set; }\n    public string Zone { get; private set; }\n\n    public Capteur(string reference, string zone)\n    {\n        this.Reference = reference;\n        this.Zone = zone;\n    }\n\n    public void Presenter()                // méthode CONCRÈTE : code fourni, partagé par tous\n    {\n        Console.WriteLine($\"{Reference} — zone {Zone} — {Unite()}\");\n    }\n\n    public abstract int Mesure();          // aucune implémentation : une obligation, pas un choix\n    public abstract string Unite();\n    public abstract bool EstEnAlerte();\n\n    public override string ToString()\n    {\n        string etat = \"correct\";\n        if (EstEnAlerte())\n        {\n            etat = \"ALERTE\";\n        }\n        return $\"{Reference} ({Zone}) : {Mesure()} {Unite()} — {etat}\";\n    }\n}\n\ninterface IEtalonnable                     // convention C# : le nom commence par un I majuscule\n{\n    string Etalonner();                    // juste la signature : une promesse, pas du code\n}\n\nclass CapteurTemperature : Capteur, IEtalonnable   // la mère d'abord, les contrats ensuite\n{\n    private int degres;\n\n    public CapteurTemperature(string reference, string zone, int degres) : base(reference, zone)\n    {\n        this.degres = degres;\n    }\n\n    public override int Mesure()\n    {\n        return degres;\n    }\n\n    public override string Unite()\n    {\n        return \"°C\";\n    }\n\n    public override bool EstEnAlerte()\n    {\n        return degres < 12 || degres > 32;\n    }\n\n    public string Etalonner()\n    {\n        return $\"{Reference} : bain de glace fondante, référence à 0 °C\";\n    }\n}\n\nclass CapteurHumidite : Capteur, IEtalonnable\n{\n    private int pourcent;\n\n    public CapteurHumidite(string reference, string zone, int pourcent) : base(reference, zone)\n    {\n        this.pourcent = pourcent;\n    }\n\n    public override int Mesure()\n    {\n        return pourcent;\n    }\n\n    public override string Unite()\n    {\n        return \"%\";\n    }\n\n    public override bool EstEnAlerte()\n    {\n        return pourcent < 40 || pourcent > 85;\n    }\n\n    public string Etalonner()\n    {\n        return $\"{Reference} : sel saturé, référence à 75 %\";\n    }\n}\n\nclass CapteurLumiere : Capteur             // ne signe PAS le contrat d'étalonnage\n{\n    private int lux;\n\n    public CapteurLumiere(string reference, string zone, int lux) : base(reference, zone)\n    {\n        this.lux = lux;\n    }\n\n    public override int Mesure()\n    {\n        return lux;\n    }\n\n    public override string Unite()\n    {\n        return \"lux\";\n    }\n\n    public override bool EstEnAlerte()\n    {\n        return lux < 2000;\n    }\n}",

      "enonce": "Un parking souterrain délivre six titres d'accès. Écris une classe de base non instanciable portant le titulaire et la plaque en propriétés, imposant à ses filles un montant mensuel en centimes et un libellé, offrant un accès de nuit refusé par défaut mais redéfinissable, et un affichage automatique combinant le tout. Écris ensuite <strong>deux contrats distincts</strong> : l'un promet un code de badge, l'autre un numéro de place nominative. Fais dériver trois classes. Le résident paie 4 500 centimes, entre la nuit, <strong>signe les deux contrats</strong>, et fabrique son code de badge en collant « RES- » aux trois derniers caractères de sa plaque. Le bureau paie 6 200 centimes, n'entre pas la nuit, et ne signe que le contrat de badge, avec le préfixe « BUR- ». Le visiteur paie 1 500 centimes plus 250 par entrée effectuée, ne signe rien, et affiche son nombre d'entrées dans son libellé. Délivre les titres : résidents Fatou Ndiaye (1-AAA-111, place 12) et Marc Peeters (1-AAA-222, place 13) ; bureaux Cabinet Lorent (1-BBB-333) et Studio Kaïro (1-BBB-444) ; visiteurs Anne Dhondt (1-CCC-555, 14 entrées) et Youssef Ben Ali (1-CCC-666, 3 entrées). Affiche les titres, la facturation ligne à ligne, le total, le titre le plus cher et le nombre d'accès de nuit. Constitue ensuite <strong>une liste par contrat</strong> — en testant le contrat et non la classe —, imprime la commande de badges et le marquage au sol, puis compte les titres qui honorent les deux contrats à la fois. Termine par les libellés destinés au règlement affiché.",

      "reflexion": "Le parking veut désormais facturer une caution aux seuls porteurs de badge. Dis où tu écrirais cette règle : dans la classe de base, dans chaque classe qui porte un badge, ou dans le contrat lui-même. Justifie, puis dis ce qui se casserait dans les deux mauvaises réponses. Il y a bien deux mauvaises réponses.",
      "principe": "L'héritage répond à « qu'est-ce que c'est ? » et ne se donne qu'une fois ; le contrat répond à « que sait-il faire ? » et se donne autant de fois qu'on veut. Un même objet peut donc appartenir à une seule famille et figurer dans plusieurs listes de capacités.",
      "remarque": "Le code de badge est fabriqué à partir des trois derniers caractères de la plaque, ce qui suppose toutes les plaques de même longueur. Sur un vrai parking, une plaque étrangère plus courte ferait échouer l'extraction. L'exercice s'en tient à des données propres — mais retiens que cette hypothèse est écrite nulle part, et que c'est précisément ce genre de silence que la leçon 16 apprend à rompre.",
      "indices": [
        "Pose-toi la question dans cet ordre. Ce que tout titre possède — un titulaire, une plaque, une façon de s'afficher — va dans la base. Ce que tout titre doit savoir répondre mais répond différemment — le montant, le libellé — devient une obligation. Ce que seuls certains savent faire — porter un badge, occuper une place — ne peut pas descendre dans la hiérarchie sans forcer le visiteur à porter un badge qu'il n'a pas : c'est donc, forcément, un contrat.",
        "Le plan : la base non instanciable avec deux propriétés, deux obligations et une méthode redéfinissable ; les deux contrats, d'une ligne chacun ; les trois classes, avec zéro, un et deux contrats signés ; puis le programme — titres, facturation, plus cher, accès de nuit, liste par contrat, recoupement, libellés.",
        "Écris les trois classes en signant d'abord tous les contrats partout, même là où cela n'a pas de sens, et fais tourner : tu obtiendras un visiteur avec une place nominative absurde. Retire ensuite les contrats de trop, un par un, et regarde les listes maigrir. Tu auras fait toi-même la démonstration que le découpage n'est pas une décoration.",
        "Le point dur est le recoupement final. Un objet peut honorer les deux contrats à la fois, et le test qui le vérifie ne mentionne aucune classe : il enchaîne deux interrogations de contrat reliées par un ET. C'est ce qui distingue vraiment un contrat d'une classe mère — on ne peut avoir qu'une seule mère, mais on peut signer autant de contrats qu'on veut, et le programme sait le demander.",
        "Ton fichier ressemble à ceci :<br><code>abstract class Titre</code><br><code>{</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public string Plaque { get; private set; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public abstract int MontantMensuelCentimes();</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public abstract string Libelle();</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public virtual bool AccesLaNuit() { return …; }</code><br><code>}</code><br><code>interface IBadgeable { string CodeBadge(); }</code><br><code>interface IPlaceReservee { int NumeroDePlace(); }</code><br><code>class Resident : Titre, IBadgeable, IPlaceReservee</code><br><code>{</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public Resident(string …, string …, int …) : base(…, …)</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;{ this.… = …; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public override int MontantMensuelCentimes() { return …; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public string CodeBadge() { return \"RES-\" + Plaque.Substring(…); }</code><br><code>}</code><br><code>List&lt;IBadgeable&gt; badges = new List&lt;…&gt;();</code><br><code>if (t is IBadgeable b) { badges.Add(…); }</code><br><code>if (t is IBadgeable &amp;&amp; t is …) { … }</code>"

      "solution": "// Le parking souterrain : une famille de titres, deux contrats qui la traversent.\nusing System;\nusing System.Collections.Generic;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        List<Titre> titres = new List<Titre>();\n        titres.Add(new Resident(\"Fatou Ndiaye\", \"1-AAA-111\", 12));\n        titres.Add(new Resident(\"Marc Peeters\", \"1-AAA-222\", 13));\n        titres.Add(new Bureau(\"Cabinet Lorent\", \"1-BBB-333\"));\n        titres.Add(new Bureau(\"Studio Kaïro\", \"1-BBB-444\"));\n        titres.Add(new Visiteur(\"Anne Dhondt\", \"1-CCC-555\", 14));\n        titres.Add(new Visiteur(\"Youssef Ben Ali\", \"1-CCC-666\", 3));\n\n        Console.WriteLine(\"LES TITRES D'ACCÈS\");\n        foreach (Titre t in titres)\n        {\n            Console.WriteLine(t);\n        }\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"FACTURATION DU MOIS\");\n        int total = 0;\n        foreach (Titre t in titres)\n        {\n            int montant = t.MontantMensuelCentimes();\n            total += montant;\n            Console.WriteLine($\"{t.Titulaire} : {montant / 100.0:F2} €\");\n        }\n        Console.WriteLine($\"Total facturé : {total / 100.0:F2} €\");\n\n        Titre plusCher = titres[0];\n        foreach (Titre t in titres)\n        {\n            if (t.MontantMensuelCentimes() > plusCher.MontantMensuelCentimes())\n            {\n                plusCher = t;\n            }\n        }\n        Console.WriteLine($\"Titre le plus cher : {plusCher.Titulaire} \"\n                        + $\"({plusCher.MontantMensuelCentimes() / 100.0:F2} €)\");\n\n        Console.WriteLine();\n\n        int nuit = 0;\n        foreach (Titre t in titres)\n        {\n            if (t.AccesLaNuit())\n            {\n                nuit++;\n            }\n        }\n        Console.WriteLine($\"Titres autorisés la nuit : {nuit} sur {titres.Count}\");\n\n        Console.WriteLine();\n\n        // Premier contrat : porter un badge. Il traverse deux classes sans rapport de parenté.\n        List<IBadgeable> badges = new List<IBadgeable>();\n        foreach (Titre t in titres)\n        {\n            if (t is IBadgeable b)\n            {\n                badges.Add(b);\n            }\n        }\n\n        Console.WriteLine(\"COMMANDE DE BADGES\");\n        foreach (IBadgeable b in badges)\n        {\n            Console.WriteLine(b.CodeBadge());   // la boucle ignore s'il s'agit d'un résident\n        }\n        Console.WriteLine($\"Badges à graver : {badges.Count}\");\n\n        Console.WriteLine();\n\n        // Second contrat : occuper une place nominative.\n        List<IPlaceReservee> places = new List<IPlaceReservee>();\n        foreach (Titre t in titres)\n        {\n            if (t is IPlaceReservee p)\n            {\n                places.Add(p);\n            }\n        }\n\n        Console.WriteLine(\"MARQUAGE AU SOL\");\n        foreach (IPlaceReservee p in places)\n        {\n            Console.WriteLine($\"Place {p.NumeroDePlace()} à peindre\");\n        }\n        Console.WriteLine($\"Places nominatives : {places.Count}\");\n\n        Console.WriteLine();\n\n        // Un même objet peut signer les deux contrats : les ensembles se recoupent.\n        int lesDeux = 0;\n        foreach (Titre t in titres)\n        {\n            if (t is IBadgeable && t is IPlaceReservee)\n            {\n                lesDeux++;\n            }\n        }\n        Console.WriteLine($\"Titres portant badge ET place réservée : {lesDeux}\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"LIBELLÉS POUR LE RÈGLEMENT AFFICHÉ\");\n        foreach (Titre t in titres)\n        {\n            Console.WriteLine($\"{t.Titulaire} — {t.Libelle()}\");\n        }\n    }\n}\n\nabstract class Titre                        // « un titre d'accès » en général n'existe pas\n{\n    public string Titulaire { get; private set; }\n    public string Plaque { get; private set; }\n\n    public Titre(string titulaire, string plaque)\n    {\n        this.Titulaire = titulaire;\n        this.Plaque = plaque;\n    }\n\n    public abstract int MontantMensuelCentimes();   // obligation : chaque titre a un tarif\n    public abstract string Libelle();\n\n    public virtual bool AccesLaNuit()               // valeur par défaut, redéfinissable\n    {\n        return false;\n    }\n\n    public override string ToString()\n    {\n        string horaire = \"6 h - 21 h\";\n        if (AccesLaNuit())\n        {\n            horaire = \"24 h / 24\";\n        }\n        return $\"{Titulaire} ({Plaque}) — {Libelle()} — {horaire} — \"\n             + $\"{MontantMensuelCentimes() / 100.0:F2} €\";\n    }\n}\n\ninterface IBadgeable\n{\n    string CodeBadge();\n}\n\ninterface IPlaceReservee\n{\n    int NumeroDePlace();\n}\n\nclass Resident : Titre, IBadgeable, IPlaceReservee   // une classe peut signer plusieurs contrats\n{\n    private int place;\n\n    public Resident(string titulaire, string plaque, int place) : base(titulaire, plaque)\n    {\n        this.place = place;\n    }\n\n    public override int MontantMensuelCentimes()\n    {\n        return 4500;\n    }\n\n    public override string Libelle()\n    {\n        return \"résident\";\n    }\n\n    public override bool AccesLaNuit()\n    {\n        return true;\n    }\n\n    public string CodeBadge()\n    {\n        return \"RES-\" + Plaque.Substring(6);\n    }\n\n    public int NumeroDePlace()\n    {\n        return place;\n    }\n}\n\nclass Bureau : Titre, IBadgeable\n{\n    public Bureau(string titulaire, string plaque) : base(titulaire, plaque)\n    {\n    }\n\n    public override int MontantMensuelCentimes()\n    {\n        return 6200;\n    }\n\n    public override string Libelle()\n    {\n        return \"bureau\";\n    }\n\n    public string CodeBadge()\n    {\n        return \"BUR-\" + Plaque.Substring(6);\n    }\n}\n\nclass Visiteur : Titre                      // ne signe aucun contrat : ni badge, ni place\n{\n    private int entrees;\n\n    public Visiteur(string titulaire, string plaque, int entrees) : base(titulaire, plaque)\n    {\n        this.entrees = entrees;\n    }\n\n    public override int MontantMensuelCentimes()\n    {\n        return 1500 + entrees * 250;\n    }\n\n    public override string Libelle()\n    {\n        return $\"visiteur ({entrees} entrées)\";\n    }\n}",

      "hier": "lecon14.html",
      "enonce": "Troisième jour : ce qui était négligeable devient obligatoire. Pars de ton fichier d'hier. Rends la classe de base <strong>non instanciable</strong>, transforme son tarif et son libellé de catégorie en <strong>obligations sans corps</strong>, et déplace le supplément de vue dans une méthode écrite, réservée à la famille, que les trois filles appelleront. Le règlement, lui, garde sa valeur par défaut redéfinissable. Écris ensuite deux contrats : l'un promet un ampérage et une ligne de branchement, l'autre un code de réservation en ligne. Répartis-les de façon à ce qu'ils <strong>ne se superposent pas</strong> : la caravane est électrifiée mais se réserve par téléphone, la tente se réserve en ligne mais n'a pas de borne, et le chalet signe les deux — 16 ampères pour son tableau intérieur. Les trois barèmes ne changent pas : 900 centimes pour la tente, 1 400 plus 50 par ampère pour la caravane, 2 000 plus 100 par couchage pour le chalet, chacun ajouté au supplément de vue. Reprends le camping d'hier dans le même ordre — 5, 6, 12, 18, 23, 24, 31, 37, 14 — et le même déroulé : affichage, recette à guichet plein, réservations des indices 0, 2, 4, 7 et 8, seconde réservation refusée, taux d'occupation, recette de la nuit. Constitue ensuite <strong>une liste par contrat</strong>, imprime les branchements avec l'ampérage à provisionner, puis les codes publiés sur le site, et compte les emplacements qui signent les deux. Termine par le bord de l'eau, le plus cher, le moins cher, le règlement de chaque emplacement, et la libération de l'indice 2.",
      "principe": "Rendre une méthode obligatoire déplace une erreur possible du jour de l'exécution au jour de la compilation. Et séparer les capacités en contrats permet de décrire des recoupements que l'héritage seul, en arbre, ne sait pas dessiner.",
      "reflexion": "Compare l'ampérage à provisionner d'aujourd'hui avec celui d'hier. Il a changé, et pas parce qu'un tarif a bougé. Explique d'où vient l'écart, puis dis lequel des deux chiffres l'électricien du camping aurait dû recevoir — et ce que le programme d'hier ne pouvait tout simplement pas lui dire.",
      "remarque": "Le supplément de vue est passé dans une méthode réservée à la famille, que le programme principal ne peut pas appeler. C'est volontaire : ce n'est pas un tarif, c'est un morceau de tarif, et rien à l'extérieur n'a de raison légitime de le connaître séparément. Réduire ce qui est visible est une décision aussi importante que d'exiger ce qui est obligatoire.",
      "indices": [
        "Reprends ton fichier d'hier et regarde les valeurs par défaut de la classe de base : un tarif qui ne rend que le supplément, une catégorie qui répond « emplacement nu ». Demande-toi à quel emplacement réel elles correspondent. À aucun — ce sont des réponses de politesse, données pour qu'une fille distraite ne fasse pas planter le programme. Aujourd'hui, tu les remplaces par des exigences.",
        "Le plan : la base non instanciable, avec ses trois propriétés, sa méthode de supplément réservée à la famille, ses deux obligations et son règlement par défaut ; les deux contrats ; les trois filles, réparties une-une-deux sur les contrats ; puis le programme d'hier, augmenté des deux campagnes et du recoupement.",
        "Fais la transformation en deux temps. D'abord rends la classe non instanciable et les deux méthodes obligatoires, et recompile <em>sans rien changer d'autre</em> : le compilateur te dira exactement ce que chaque fille doit fournir. Corrige, vérifie que la recette à guichet plein est inchangée, et seulement ensuite ajoute les deux contrats.",
        "Le point dur est la méthode de supplément. Elle est écrite dans la base, appelée par les trois filles, et invisible depuis le programme principal : ce n'est ni du public ni du privé, c'est le niveau intermédiaire vu à la leçon 14 pour les champs. Si tu la laisses publique, tout fonctionnera — et le jour où quelqu'un l'appellera de l'extérieur en croyant obtenir un tarif, il obtiendra 3,00 € pour un chalet de bord de rivière.",
        "Ton fichier ressemble à ceci :<br><code>abstract class Emplacement</code><br><code>{</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;protected int SupplementVueCentimes()</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;{ if (EstAuBordDeLEau()) { return …; } return 0; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public abstract int TarifNuitCentimes();</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public abstract string Categorie();</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public virtual string Reglement() { return \"…\"; }</code><br><code>}</code><br><code>interface IElectrifiable { int Amperes(); string Branchement(); }</code><br><code>interface IReservableEnLigne { string CodeReservation(); }</code><br><code>class Chalet : Emplacement, IElectrifiable, IReservableEnLigne</code><br><code>{</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public override int TarifNuitCentimes()</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;{ return SupplementVueCentimes() + 2000 + … * 100; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public int Amperes() { return …; }</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;public string CodeReservation() { return $\"WEB-C…\"; }</code><br><code>}</code><br><code>List&lt;IElectrifiable&gt; aBrancher = new List&lt;…&gt;();</code><br><code>if (e is … el) { aBrancher.Add(…); }</code>"
      ],
      "solution": "// Le camping des Quatre Vents, jour 3 : ce qui était négligeable devient obligatoire.\nusing System;\nusing System.Collections.Generic;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        // Emplacement e = new Emplacement(1, \"Chênes\");  // refusé : la classe est abstraite\n        List<Emplacement> camping = new List<Emplacement>();\n        camping.Add(new Caravane(5, \"Chênes\", 10));\n        camping.Add(new Caravane(6, \"Chênes\", 6));\n        camping.Add(new Chalet(12, \"Verger\", 4));\n        camping.Add(new Tente(18, \"Verger\"));\n        camping.Add(new Caravane(23, \"Rivière\", 10));\n        camping.Add(new Tente(24, \"Rivière\"));\n        camping.Add(new Tente(31, \"Rivière\"));\n        camping.Add(new Tente(37, \"Rivière\"));\n        camping.Add(new Chalet(14, \"Verger\", 6));\n\n        Console.WriteLine(\"LE CAMPING AVANT L'OUVERTURE\");\n        foreach (Emplacement e in camping)\n        {\n            Console.WriteLine(e);\n        }\n\n        Console.WriteLine();\n\n        int recetteMax = 0;\n        foreach (Emplacement e in camping)\n        {\n            recetteMax += e.TarifNuitCentimes();\n        }\n        Console.WriteLine($\"Recette d'une nuit à guichet plein : {recetteMax / 100.0:F2} €\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"LES RÉSERVATIONS DU JOUR\");\n        camping[0].Reserver();\n        camping[2].Reserver();\n        camping[4].Reserver();\n        camping[7].Reserver();\n        camping[8].Reserver();\n        camping[0].Reserver();\n        Console.WriteLine($\"N° 5 après une seconde réservation : {camping[0].Occupe}\");\n\n        int occupes = 0;\n        int recette = 0;\n        foreach (Emplacement e in camping)\n        {\n            if (e.Occupe)\n            {\n                occupes++;\n                recette += e.TarifNuitCentimes();\n            }\n        }\n        Console.WriteLine($\"Emplacements occupés : {occupes} sur {camping.Count}\");\n        Console.WriteLine($\"Taux d'occupation : {occupes * 100 / camping.Count} %\");\n        Console.WriteLine($\"Recette de la nuit : {recette / 100.0:F2} €\");\n\n        Console.WriteLine();\n\n        // Premier contrat : l'électricité. Il réunit les caravanes et les chalets.\n        List<IElectrifiable> aBrancher = new List<IElectrifiable>();\n        foreach (Emplacement e in camping)\n        {\n            if (e is IElectrifiable el)\n            {\n                aBrancher.Add(el);\n            }\n        }\n\n        Console.WriteLine(\"BRANCHEMENTS À PRÉVOIR\");\n        int amperesTotal = 0;\n        foreach (IElectrifiable el in aBrancher)\n        {\n            amperesTotal += el.Amperes();\n            Console.WriteLine(el.Branchement());\n        }\n        Console.WriteLine($\"Ampérage à provisionner : {amperesTotal} A \"\n                        + $\"sur {aBrancher.Count} emplacements\");\n\n        Console.WriteLine();\n\n        // Second contrat : la réservation en ligne. Il réunit les tentes et les chalets.\n        List<IReservableEnLigne> surLeSite = new List<IReservableEnLigne>();\n        foreach (Emplacement e in camping)\n        {\n            if (e is IReservableEnLigne rl)\n            {\n                surLeSite.Add(rl);\n            }\n        }\n\n        Console.WriteLine(\"CODES PUBLIÉS SUR LE SITE\");\n        foreach (IReservableEnLigne rl in surLeSite)\n        {\n            Console.WriteLine(rl.CodeReservation());\n        }\n        Console.WriteLine($\"Emplacements réservables en ligne : {surLeSite.Count}\");\n\n        Console.WriteLine();\n\n        // Les deux contrats se recoupent sans se confondre : le chalet signe les deux.\n        int lesDeux = 0;\n        foreach (Emplacement e in camping)\n        {\n            if (e is IElectrifiable && e is IReservableEnLigne)\n            {\n                lesDeux++;\n            }\n        }\n        Console.WriteLine($\"Emplacements électrifiés ET réservables en ligne : {lesDeux}\");\n\n        Console.WriteLine();\n\n        int bordDeLEau = 0;\n        foreach (Emplacement e in camping)\n        {\n            if (e.EstAuBordDeLEau())\n            {\n                bordDeLEau++;\n            }\n        }\n        Console.WriteLine($\"Emplacements au bord de l'eau : {bordDeLEau}\");\n\n        Emplacement plusCher = camping[0];\n        Emplacement moinsCher = camping[0];\n        foreach (Emplacement e in camping)\n        {\n            if (e.TarifNuitCentimes() > plusCher.TarifNuitCentimes())\n            {\n                plusCher = e;\n            }\n            if (e.TarifNuitCentimes() < moinsCher.TarifNuitCentimes())\n            {\n                moinsCher = e;\n            }\n        }\n        Console.WriteLine($\"Le plus cher : {plusCher}\");\n        Console.WriteLine($\"Le moins cher : {moinsCher}\");\n\n        Console.WriteLine();\n\n        Console.WriteLine(\"LE RÈGLEMENT AFFICHÉ À L'ACCUEIL\");\n        foreach (Emplacement e in camping)\n        {\n            Console.WriteLine($\"N° {e.Numero} : {e.Reglement()}\");\n        }\n\n        Console.WriteLine();\n\n        camping[2].Liberer();\n        Console.WriteLine($\"N° 12 après départ : {camping[2]}\");\n    }\n}\n\nabstract class Emplacement                  // « un emplacement en soi » n'existe pas au camping\n{\n    public int Numero { get; private set; }\n    public string Secteur { get; private set; }\n    public bool Occupe { get; private set; }\n\n    public Emplacement(int numero, string secteur)\n    {\n        this.Numero = numero;\n        this.Secteur = secteur;\n        this.Occupe = false;\n    }\n\n    public bool EstAuBordDeLEau()\n    {\n        return Secteur == \"Rivière\";\n    }\n\n    // Méthode concrète partagée : le supplément de vue reste écrit une seule fois.\n    protected int SupplementVueCentimes()\n    {\n        if (EstAuBordDeLEau())\n        {\n            return 300;\n        }\n        return 0;\n    }\n\n    public abstract int TarifNuitCentimes();   // plus de valeur par défaut : une obligation\n    public abstract string Categorie();\n\n    public virtual string Reglement()\n    {\n        return \"silence de 22 h à 7 h\";\n    }\n\n    public void Reserver()\n    {\n        if (!Occupe)\n        {\n            Occupe = true;\n        }\n    }\n\n    public void Liberer()\n    {\n        Occupe = false;\n    }\n\n    public override string ToString()\n    {\n        string etat = \"libre\";\n        if (Occupe)\n        {\n            etat = \"occupé\";\n        }\n        string vue = \"sans vue\";\n        if (EstAuBordDeLEau())\n        {\n            vue = \"bord de l'eau\";\n        }\n        return $\"N° {Numero} secteur {Secteur} ({vue}) — {Categorie()} — \"\n             + $\"{TarifNuitCentimes() / 100.0:F2} € la nuit — {etat}\";\n    }\n}\n\ninterface IElectrifiable\n{\n    int Amperes();\n    string Branchement();\n}\n\ninterface IReservableEnLigne\n{\n    string CodeReservation();\n}\n\nclass Tente : Emplacement, IReservableEnLigne\n{\n    public Tente(int numero, string secteur) : base(numero, secteur)\n    {\n    }\n\n    public override int TarifNuitCentimes()\n    {\n        return SupplementVueCentimes() + 900;\n    }\n\n    public override string Categorie()\n    {\n        return \"tente\";\n    }\n\n    public override string Reglement()\n    {\n        return base.Reglement() + \" · aucun véhicule sur l'herbe\";\n    }\n\n    public string CodeReservation()\n    {\n        return $\"WEB-T{Numero}\";\n    }\n}\n\nclass Caravane : Emplacement, IElectrifiable      // pas de réservation en ligne : appel obligatoire\n{\n    private int amperes;\n\n    public Caravane(int numero, string secteur, int amperes) : base(numero, secteur)\n    {\n        this.amperes = amperes;\n    }\n\n    public override int TarifNuitCentimes()\n    {\n        return SupplementVueCentimes() + 1400 + amperes * 50;\n    }\n\n    public override string Categorie()\n    {\n        return $\"caravane {amperes} A\";\n    }\n\n    public override string Reglement()\n    {\n        return base.Reglement() + \" · groupe électrogène interdit\";\n    }\n\n    public int Amperes()\n    {\n        return amperes;\n    }\n\n    public string Branchement()\n    {\n        return $\"N° {Numero} : borne {amperes} A à réarmer\";\n    }\n}\n\nclass Chalet : Emplacement, IElectrifiable, IReservableEnLigne   // le chalet signe les deux\n{\n    private int couchages;\n\n    public Chalet(int numero, string secteur, int couchages) : base(numero, secteur)\n    {\n        this.couchages = couchages;\n    }\n\n    public override int TarifNuitCentimes()\n    {\n        return SupplementVueCentimes() + 2000 + couchages * 100;\n    }\n\n    public override string Categorie()\n    {\n        return $\"chalet {couchages} couchages\";\n    }\n\n    public override string Reglement()\n    {\n        return base.Reglement() + \" · état des lieux au départ\";\n    }\n\n    public int Amperes()\n    {\n        return 16;\n    }\n\n    public string Branchement()\n    {\n        return $\"N° {Numero} : tableau intérieur 16 A\";\n    }\n\n    public string CodeReservation()\n    {\n        return $\"WEB-C{Numero}\";\n    }\n}",
      "pourquoi": "Hier, une quatrième sorte d'emplacement aurait pu naître sans tarif propre et facturer 3,00 € la nuit en silence. Aujourd'hui, elle ne compilerait pas. Et l'électricien reçoit enfin le bon nombre, parce que la question « qui a besoin de courant ? » a cessé d'être devinée à partir des classes pour devenir une chose que les objets déclarent eux-mêmes.",
