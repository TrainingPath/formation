<script>
var DAY = {
  num: 15,
  title: "Interfaces et classes abstraites",
  subtitle: "Des contrats sans implémentation : programmer par promesses.",
  theory: `
<h3>1. La classe abstraite : un moule inachevé</h3>
<p>Une classe <strong>abstraite</strong> sert de base commune mais ne peut pas être instanciée directement : elle représente un concept trop général (un « Animal » en soi n'existe pas, seuls existent des chiens, des chats…).</p>
<pre class="pseudo">abstract class Animal                                          // abstract : on ne pourra pas faire new Animal(...)
{
    protected string nom;
    public Animal(string nom) { this.nom = nom; }
    public void Manger() { Console.WriteLine($"{nom} mange"); }  // méthode CONCRÈTE : code fourni, partagé
    public abstract void Crier();       // méthode ABSTRAITE : aucune implémentation, à définir dans les filles
}
Animal a = new Animal("X");     // ERREUR : on n'instancie pas une classe abstraite
Animal a = new Chien("Rex");    // OK : Chien est une classe concrète qui complète le moule</pre>
<p>Une méthode <code>abstract</code> n'a pas de corps : elle impose une obligation. Chaque classe fille <strong>concrète</strong> DOIT la redéfinir (<code>override</code>), sinon le code ne compile pas. Pas besoin de <code>virtual</code> : <code>abstract</code> l'implique déjà.</p>

<h3>2. L'interface : un contrat de capacités</h3>
<pre class="pseudo">interface IExportable                     // convention C# : nom d'interface préfixé par un I majuscule
{
    string ToJson();                      // juste la SIGNATURE : « toute classe IExportable saura faire un ToJson »
}
interface IComparable2
{
    int ComparerA(object autre);          // une autre capacité, un autre contrat
}
class Facture : IExportable, IComparable2  // une classe peut signer PLUSIEURS contrats
{
    public string ToJson() { /* ... */ }          // elle DOIT fournir le code de chaque méthode promise
    public int ComparerA(object autre) { /* ... */ }
}</pre>
<p>Une interface ne contient que des signatures (pas de code, pas d'attributs) : c'est une <strong>promesse</strong>. Toute classe qui l'implémente s'engage à fournir ces méthodes.</p>

<h3>3. Le « : » sert à TOUT (héritage ET interfaces)</h3>
<pre class="pseudo">class Chien : Animal, IExportable          // UNE classe mère (Animal) + une ou plusieurs interfaces
// Ordre imposé : la classe mère d'abord, puis les interfaces</pre>
<div class="tip">En C#, le même <code>:</code> introduit la classe mère ET les interfaces (Java séparait <code>extends</code> et <code>implements</code>). Règle : une seule classe mère, mais autant d'interfaces que voulu — c'est l'échappatoire à l'héritage simple.</div>

<h3>4. Programmer contre l'interface</h3>
<pre class="pseudo">List&lt;IExportable&gt; documents = new List&lt;IExportable&gt; {   // une liste de « tout ce qui sait s'exporter »
    new Facture(), new Bulletin(), new Affiche()       // objets de classes différentes, même contrat
};
foreach (IExportable doc in documents)
{
    Console.WriteLine(doc.ToJson());       // chacun exporte à sa façon : polymorphisme via l'interface
}</pre>
<p>La boucle ne sait pas si <code>doc</code> est une Facture ou une Affiche : elle sait seulement qu'il respecte le contrat <code>IExportable</code>. Ajouter une nouvelle classe qui implémente l'interface fonctionne sans toucher à ce code.</p>

<h3>5. Dans la vraie vie .NET</h3>
<pre class="pseudo">IComparable, IEnumerable, IDisposable...    // interfaces standard omniprésentes dans .NET
List&lt;T&gt; : IList&lt;T&gt;                          // même la classe List implémente une interface</pre>
<p>Programmer contre une interface (<code>IList&lt;T&gt;</code> plutôt que <code>List&lt;T&gt;</code>) permet de changer d'implémentation plus tard sans réécrire le code qui l'utilise.</p>

<h3>6. abstract ou interface ?</h3>
<pre class="pseudo">Code COMMUN à partager + relation « est un »   → classe abstraite
Juste une CAPACITÉ (exportable, comparable…)    → interface
Les deux se combinent : class Chien : Animal, IExportable, INageur</pre>
<div class="warn">Rendre <code>Crier()</code> abstraite FORCE chaque espèce à définir son propre cri, et le compilateur le vérifie. L'oubli silencieux (une méthode vide « … ») devient impossible : l'obligation est garantie à la compilation.</div>`,
  exercises: [
    { type: "qcm", q: "Une classe abstraite…", opts: ["Ne compile jamais", "Ne peut pas être instanciée (new interdit) mais sert de base", "N'a aucune méthode", "Est une interface déguisée"], a: 1, exp: "Le moule inachevé." },
    { type: "qcm", q: "Une méthode abstract…", opts: ["A un corps vide", "N'a PAS de corps : chaque fille concrète DOIT la redéfinir", "Est privée", "Est statique"], a: 1, exp: "Obligation vérifiée par le compilateur." },
    { type: "qcm", q: "new Animal(\"X\") avec Animal abstraite :", opts: ["Un animal générique", "Erreur de compilation", "Crée implicitement un Chien", "Renvoie null"], a: 1, exp: "On n'instancie que du concret." },
    { type: "qcm", q: "La convention C# pour nommer une interface :", opts: ["Un suffixe -able", "Préfixe I : IExportable, IComparable", "Tout écrit en majuscules", "Aucune convention imposée"], a: 1, exp: "Le I majuscule : signature visuelle des interfaces .NET." },
    { type: "qcm", q: "En C#, quel symbole introduit la classe mère ET les interfaces ?", opts: ["extends puis implements", "Le même : (deux-points) : class Chien : Animal, IExportable", "-> et ::", "with"], a: 1, exp: "Un seul :, classe mère d'abord, interfaces ensuite." },
    { type: "qcm", q: "Combien d'interfaces une classe peut-elle implémenter ?", opts: ["Une seule à la fois", "Plusieurs (contrairement à l'héritage de classe, unique)", "Deux au maximum", "Zéro, c'est impossible"], a: 1, exp: "L'échappatoire à l'héritage simple." },
    { type: "qcm", q: "Une classe : IExportable qui oublie ToJson() :", opts: ["Fonctionne", "Erreur de compilation : le contrat doit être tenu (sauf si abstract)", "ToJson vaut null", "Warning"], a: 1, exp: "Promesse signée = tenue." },
    { type: "qcm", q: "IExportable doc = new Facture(); est…", opts: ["Interdit par le compilateur", "Légal : Facture EST une IExportable — polymorphisme d'interface", "Un cast explicite obligatoire", "Une copie de l'objet Facture"], a: 1, exp: "Comme Animal a = new Chien(), avec un contrat." },
    { type: "qcm", q: "Différence classe abstraite / interface :", opts: ["Aucune", "L'abstraite fournit attributs + code partagé ; l'interface est un contrat cumulable", "L'interface est plus rapide", "L'abstraite n'a pas de nom"], a: 1, exp: "Code commun → abstraite ; capacité → interface." },
    { type: "qcm", q: "« Volant » pour Avion, Oiseau, Drone (aucun code commun) :", opts: ["Une classe abstraite commune", "interface IVolant : trois familles, un contrat", "Un héritage de trois classes", "Un tableau de comportements"], a: 1, exp: "Oiseau : Animal, IVolant : les deux mécanismes se combinent." },
    { type: "qcm", q: "List<T> : IList<T> montre que…", opts: ["List est une classe abstraite", "Les collections .NET IMPLÉMENTENT des interfaces standard", "IList est une classe concrète", "Cela ne montre rien de particulier"], a: 1, exp: "Programmer contre IList<T> permet de changer d'implémentation." },
    { type: "qcm", q: "Ajouter class Ticket : IExportable à la boucle des documents exige…", opts: ["Un if de plus", "RIEN : la boucle ne connaît que le contrat — extension sans modification", "Changer le type", "La boucle plante"], a: 1, exp: "Même vertu que le zoo, généralisée aux contrats." },
    { type: "qcm", q: "Une classe abstraite peut-elle contenir des méthodes NON abstraites ?", opts: ["Non, jamais", "Oui : c'est son intérêt — code partagé (Manger) + obligations (Crier)", "Seulement des méthodes private", "Une seule au maximum"], a: 1, exp: "Mix de fourni et d'exigé." },
    { type: "qcm", q: "Une méthode abstract a-t-elle besoin de virtual ?", opts: ["Oui, toujours", "Non : abstract implique virtual (elle est forcément redéfinie)", "Parfois selon les cas", "Jamais de redéfinition"], a: 1, exp: "abstract = pas de corps + redéfinition obligatoire." },
    { type: "vf", q: "Rendre Crier() abstract force chaque espèce à définir son cri, vérifié à la compilation.", a: true, exp: "L'abstraction transforme une convention fragile en garantie." }
  ],
  final: {
    title: "Exercice final — Le parc de véhicules (version C#)",
    intro: `<p>Une société de livraison modélise :</p>
<pre class="pseudo">abstract class Vehicule
{
    protected string immat;
    public Vehicule(string immat) { this.immat = immat; }
    public void Demarrer() { Console.WriteLine($"{immat} démarre"); }
    public abstract double CoutParKm();
}
interface IElectrique
{
    void Recharger();
}
class Camion : Vehicule
{
    public Camion(string i) : base(i) { }
    public override double CoutParKm() => 0.9;
}
class VeloCargo : Vehicule, IElectrique
{
    public VeloCargo(string i) : base(i) { }
    public override double CoutParKm() => 0.05;
    public void Recharger() => Console.WriteLine($"{immat} en charge");
}</pre>`,
    questions: [
      { type: "qcm", q: "<code>new Vehicule(\"XX-01\")</code> :", opts: ["Un véhicule générique", "Erreur : Vehicule est abstraite — seuls Camion et VeloCargo s'instancient", "Crée un Camion par défaut", "Renvoie null"], a: 1, exp: "Le générique n'existe pas." },
      { type: "qcm", q: "Pourquoi CoutParKm() est abstract plutôt que codé avec un défaut ?", opts: ["Économie", "Un coût « par défaut » serait faux : chaque type DOIT déclarer le sien, sous contrôle du compilateur", "0 interdit", "abstract plus rapide"], a: 1, exp: "L'abstraction encode une exigence métier." },
      { type: "qcm", q: "List<Vehicule> parc ; somme des coûts <code>total += v.CoutParKm();</code> en foreach. Ça marche car…", opts: ["Coûts égaux", "Polymorphisme : chaque objet fournit SA version (0.9 ou 0.05) via le contrat commun", "total est double", "La liste trie"], a: 1, exp: "La boucle du jour 12 + le polymorphisme." },
      { type: "qcm", q: "Recharger TOUS les électriques du parc :", opts: ["v.Recharger() sur tous", "if (v is IElectrique e) { e.Recharger(); } : on teste le CONTRAT, pas la classe concrète", "Recréer le parc", "Impossible"], a: 1, exp: "Le pattern matching (leçon 14) sur interface : les futurs scooters électriques seront inclus d'office." },
      { type: "qcm", q: "VeloCargo cumule : Vehicule ET IElectrique. Possible car…", opts: ["C# accepte tout", "UNE classe mère + PLUSIEURS interfaces, séparées par des virgules après le :", "Vehicule est une interface", "IElectrique est abstraite"], a: 1, exp: "class VeloCargo : Vehicule, IElectrique — la règle exacte." }
    ],
    solution: `<pre class="pseudo">Vehicule (abstraite)          IElectrique (interface)
   ├── Camion (0.9)               ▲
   └── VeloCargo (0.05) ─────────┘ (: IElectrique)

Parc : total += v.CoutParKm()   → polymorphisme
Recharge : if (v is IElectrique e) → contrat testé
new Vehicule(...) → interdit

En C#, un seul : pour la mère ET les interfaces.
Le préfixe I nomme les interfaces.</pre>
<p>Classe abstraite + interfaces : l'arsenal de conception C# est complet. Demain : les exceptions.</p>`
  }
};
