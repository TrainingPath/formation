  title: "List<T> et foreach",
  subtitle: "Le tableau qui grandit tout seul, version C#.",
  theory: `
<h3>1. Le problème du tableau figé</h3>
<p>Un tableau <code>new int[10]</code> a exactement 10 cases, pour toujours : impossible d'en ajouter ou d'en retirer. Quand on ne connaît pas la taille à l'avance (une liste d'inscrits qui grandit…), on utilise une <strong>liste dynamique</strong> : <code>List&lt;T&gt;</code>, l'équivalent de l'<code>ArrayList</code> de Java.</p>

<h3>2. Créer et manipuler une liste</h3>
<pre class="pseudo">using System.Collections.Generic;             // import nécessaire pour List<T>

List&lt;string&gt; noms = new List&lt;string&gt;();       // crée une liste VIDE de chaînes
noms.Add("Ana");             // ajoute "Ana" à la FIN de la liste
noms.Add("Bob");             // la liste contient maintenant [Ana, Bob]
noms.Add("Zoé");             // [Ana, Bob, Zoé]
noms[0]                      // → "Ana" : accès par indice avec les crochets (0-indexé, comme un tableau)
noms[1] = "Max";             // remplace l'élément d'indice 1 → [Ana, Max, Zoé]
noms.RemoveAt(0);            // retire l'élément d'INDICE 0 → [Max, Zoé] (tout se décale à gauche)
noms.Remove("Zoé");          // retire la 1re occurrence de la VALEUR "Zoé" → [Max]
noms.Count                   // → 1 : le NOMBRE d'éléments (Count, pas Length !)
noms.Contains("Max")         // → true : la valeur est-elle présente ?
noms.IndexOf("Max")          // → 0 : indice de la valeur (ou -1 si absente)
noms.Insert(0, "Léa");       // insère "Léa" en position 0 → [Léa, Max]</pre>
<div class="warn">Différence de vocabulaire à retenir : un TABLEAU utilise <code>.Length</code>, une LISTE utilise <code>.Count</code>. Et l'ajout se fait avec <code>.Add(x)</code>, pas avec des crochets vides comme en PHP.</div>

<h3>3. Le type générique &lt;T&gt;</h3>
<pre class="pseudo">List&lt;int&gt; notes = new List&lt;int&gt;();          // une liste qui ne contient QUE des int
List&lt;string&gt; mots = new List&lt;string&gt;();     // une liste qui ne contient QUE des string
List&lt;Compte&gt; comptes = new List&lt;Compte&gt;();  // une liste de tes propres objets (leçon 12)</pre>
<p>Le <code>&lt;T&gt;</code> (T pour <em>Type</em>) précise le type des éléments : le compilateur garantit alors qu'on ne mettra que ça dedans, et te rend le bon type à la lecture (pas de conversion). Avantage de C# sur Java : <code>List&lt;int&gt;</code> accepte directement le type primitif <code>int</code> (Java exigeait la classe enveloppe <code>Integer</code>).</p>

<h3>4. Parcourir une liste</h3>
<pre class="pseudo">for (int i = 0; i &lt; noms.Count; i++)       // par indices (Count remplace Length)
{
    Console.WriteLine($"{i} : {noms[i]}"); // affiche l'indice et la valeur
}
foreach (string nom in noms)               // plus simple, pour juste lire chaque valeur
{
    Console.WriteLine(nom);
}</pre>

<h3>5. Le piège du Remove en boucle</h3>
<pre class="pseudo">// SUPPRIMER tous les "spam" : chaque suppression DÉCALE les éléments suivants vers la gauche !
for (int i = 0; i &lt; msgs.Count; i++)
{
    if (msgs[i] == "spam")
    {
        msgs.RemoveAt(i);   // on retire l'élément d'indice i…
        i--;                // …et on RECULE d'un cran : sinon on sauterait l'élément qui a pris sa place
    }
}</pre>
<p>Pourquoi <code>i--</code> ? Après <code>RemoveAt(i)</code>, l'élément suivant glisse à l'indice <code>i</code>. Sans reculer, le <code>i++</code> de la boucle sauterait par-dessus lui. C'est un piège classique de la modification en cours de parcours.</p>

<h3>6. Tableau ou List ?</h3>
<pre class="pseudo">Taille fixe, performance brute   → int[]       // quand on connaît le nombre d'éléments d'avance
Ajouts/retraits, taille inconnue → List&lt;T&gt;      // quand la collection évolue</pre>
<div class="tip">Correspondances utiles : <code>t.Length</code> → <code>list.Count</code> · <code>t[i]</code> → <code>list[i]</code> · <code>list.Add(x)</code> pour ajouter. Les MOTIFS que tu connais (somme, maximum, recherche) restent identiques : seule la façon de connaître la taille change.</div>`,

      { type: "qcm", q: "Quelle structure du jour 29 cette gestion reproduit-elle ?", opts: ["Une pile (LIFO)", "Une FILE (FIFO) : Add en fin = ENFILER, RemoveAt(0) = DÉFILER", "Un arbre (structure hiérarchique)", "Un algorithme de tri par insertion"], a: 1, exp: "La List sait jouer la file — les abstractions du jour 29 se construisent avec les outils du langage." },

      { type: "qcm", q: "Pour jouer une PILE (Ctrl+Z) avec une List :", opts: ["Add + RemoveAt(0)", "Add en fin + RemoveAt(Count-1) : empiler/dépiler au MÊME bout", "RemoveAt(0) sans jamais rien ajouter", "C'est impossible avec une simple List"], a: 1, exp: "Même liste, autre discipline : le bout unique fait le LIFO (jour 29). C# offre aussi les vraies classes Stack<T> et Queue<T> !" }
    ],
    solution: `<pre class="pseudo">[Ana] [Ana,Bob] [Ana,Bob,Zoé]
suivant = attente[0] = "Ana" ; RemoveAt(0) → [Bob,Zoé]   DÉFILER
Add("Max") → [Bob,Zoé,Max]                                ENFILER
Remove("Bob") → [Zoé,Max]
Affiche : 2 en attente, prochain : Zoé

File = Add + RemoveAt(0). Pile = Add + RemoveAt(Count-1).
C# a aussi Stack<T> et Queue<T> tout faits.</pre>
<p>La semaine 1 C# s'achève. Demain, le grand pont : tes algorithmes en C#.</p>`

      "solution": "// La salle d'attente : une file qui bouge dans les deux sens.\n// Trois listes parallèles, et le piège du retrait pendant le parcours.\nusing System;\nusing System.Collections.Generic;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        List<string> patients = new List<string>();\n        List<int> urgences = new List<int>();      // 1 = normal, 2 = pressé, 3 = urgent\n        List<int> attenteMinutes = new List<int>();\n\n        Inscrire(patients, urgences, attenteMinutes, \"Declerck\", 1, 35);\n        Inscrire(patients, urgences, attenteMinutes, \"Rahmani\", 3, 5);\n        Inscrire(patients, urgences, attenteMinutes, \"Boulanger\", 1, 50);\n        Inscrire(patients, urgences, attenteMinutes, \"Sinaeve\", 2, 20);\n        Inscrire(patients, urgences, attenteMinutes, \"Nkulu\", 1, 12);\n\n        Console.WriteLine(\"SALLE D'ATTENTE\");\n        Afficher(patients, urgences, attenteMinutes);\n\n        Console.WriteLine();\n\n        // Un urgent passe devant : on l'insère en tête plutôt qu'à la fin.\n        patients.Insert(0, \"Vandenberghe\");\n        urgences.Insert(0, 3);\n        attenteMinutes.Insert(0, 0);\n        Console.WriteLine(\"Après l'arrivée d'un cas urgent :\");\n        Afficher(patients, urgences, attenteMinutes);\n\n        Console.WriteLine();\n\n        // Le patient reçu : il quitte les TROIS listes, au même indice.\n        int recu = 0;\n        Console.WriteLine($\"Le docteur reçoit {patients[recu]}.\");\n        patients.RemoveAt(recu);\n        urgences.RemoveAt(recu);\n        attenteMinutes.RemoveAt(recu);\n        Afficher(patients, urgences, attenteMinutes);\n\n        Console.WriteLine();\n\n        // Retirer pendant le parcours : reculer d'un cran après chaque retrait.\n        Console.WriteLine(\"Les patients ayant attendu plus de 30 minutes sont réorientés :\");\n        for (int i = 0; i < patients.Count; i++)\n        {\n            if (attenteMinutes[i] > 30)\n            {\n                Console.WriteLine($\"  {patients[i]} ({attenteMinutes[i]} min) → autre cabinet\");\n                patients.RemoveAt(i);\n                urgences.RemoveAt(i);\n                attenteMinutes.RemoveAt(i);\n                i--;\n            }\n        }\n        Afficher(patients, urgences, attenteMinutes);\n\n        Console.WriteLine();\n\n        // Statistiques : les mêmes motifs que sur un tableau.\n        Console.WriteLine($\"Encore en salle : {patients.Count}\");\n        Console.WriteLine($\"Attente cumulée : {Total(attenteMinutes)} minutes\");\n        if (patients.Count > 0)\n        {\n            Console.WriteLine($\"Attente moyenne : {Total(attenteMinutes) / patients.Count} min\");\n            int i = IndiceDuMax(attenteMinutes);\n            Console.WriteLine($\"Le plus patient : {patients[i]} ({attenteMinutes[i]} min)\");\n        }\n        else\n        {\n            Console.WriteLine(\"Salle vide : aucune moyenne à donner.\");\n        }\n\n        Console.WriteLine($\"Cas urgents restants : {CompterEgal(urgences, 3)}\");\n        Console.WriteLine($\"Rahmani est-il encore là ? {patients.Contains(\"Rahmani\")}\");\n        Console.WriteLine($\"Position de Nkulu : {patients.IndexOf(\"Nkulu\")}\");\n    }\n\n    static void Inscrire(List<string> noms, List<int> urgences, List<int> attentes,\n                         string nom, int urgence, int attente)\n    {\n        noms.Add(nom);\n        urgences.Add(urgence);\n        attentes.Add(attente);\n    }\n\n    static void Afficher(List<string> noms, List<int> urgences, List<int> attentes)\n    {\n        if (noms.Count == 0)\n        {\n            Console.WriteLine(\"  (salle vide)\");\n            return;\n        }\n        for (int i = 0; i < noms.Count; i++)\n        {\n            Console.WriteLine($\"  [{i}] {noms[i]}\\turgence {urgences[i]}\\t{attentes[i]} min\");\n        }\n    }\n\n    static int Total(List<int> valeurs)\n    {\n        int somme = 0;\n        foreach (int v in valeurs)\n        {\n            somme += v;\n        }\n        return somme;\n    }\n\n    static int IndiceDuMax(List<int> valeurs)\n    {\n        int pos = 0;\n        for (int i = 1; i < valeurs.Count; i++)\n        {\n            if (valeurs[i] > valeurs[pos])\n            {\n                pos = i;\n            }\n        }\n        return pos;\n    }\n\n    static int CompterEgal(List<int> valeurs, int cible)\n    {\n        int compte = 0;\n        foreach (int v in valeurs)\n        {\n            if (v == cible)\n            {\n                compte++;\n            }\n        }\n        return compte;\n    }\n}",

      "indices": [
        "Reprends ton fichier d'hier et repère ce qui ne bouge pas : les trois méthodes de règles, le nettoyage, la boucle sur les propositions. Ce qui change tient en deux points : les résultats s'accumulent dans des listes au lieu de simples compteurs, et une nouvelle règle apparaît — le mot déjà joué —, qui n'était pas exprimable hier faute de mémoire.",

      "solution": "// Le club de Scrabble — jour 2 sur 4 : la partie se déroule.\n// Les règles d'hier ne bougent pas. Ce qui est neuf, c'est que les mots\n// joués s'accumulent dans une liste qui grandit au fil des tours.\nusing System;\nusing System.Collections.Generic;\n\nclass Program\n{\n    const int LongueurMax = 7;\n\n    static void Main(string[] args)\n    {\n        List<string> motsJoues = new List<string>();\n        List<int> scores = new List<int>();\n        List<string> auteurs = new List<string>();\n\n        string[] joueurs = { \"Ilse\", \"Bruno\", \"Ilse\", \"Bruno\", \"Ilse\", \"Bruno\" };\n        string[] propositions = { \"kayak\", \"zébu\", \"train\", \"otto\", \"jazz\", \"kayak\" };\n\n        Console.WriteLine(\"CLUB DE SCRABBLE — partie du samedi\");\n        Console.WriteLine();\n\n        for (int tour = 0; tour < propositions.Length; tour++)\n        {\n            string mot = propositions[tour].Trim().ToLower();\n            string joueur = joueurs[tour];\n\n            string refus = Refus(mot);\n            if (refus != \"\")\n            {\n                Console.WriteLine($\"  {joueur} propose « {mot} » → refusé : {refus}\");\n                continue;\n            }\n\n            // Un mot déjà posé ne rapporte rien : la liste sert de mémoire.\n            if (motsJoues.Contains(mot))\n            {\n                Console.WriteLine($\"  {joueur} propose « {mot} » → déjà joué au tour \"\n                                  + $\"{motsJoues.IndexOf(mot) + 1}\");\n                continue;\n            }\n\n            int score = Score(mot);\n            motsJoues.Add(mot);\n            scores.Add(score);\n            auteurs.Add(joueur);\n            Console.WriteLine($\"  {joueur} pose « {mot.ToUpper()} » → {score} point(s)\");\n        }\n\n        Console.WriteLine();\n        Console.WriteLine($\"Mots retenus : {motsJoues.Count}\");\n        Console.WriteLine($\"Points distribués : {Total(scores)}\");\n\n        if (motsJoues.Count > 0)\n        {\n            int i = IndiceDuMax(scores);\n            Console.WriteLine($\"Meilleur coup : {motsJoues[i].ToUpper()} par {auteurs[i]} \"\n                              + $\"({scores[i]} points)\");\n            Console.WriteLine($\"Moyenne par mot : {Total(scores) / motsJoues.Count} point(s)\");\n        }\n        else\n        {\n            Console.WriteLine(\"Aucun mot retenu : pas de meilleur coup.\");\n        }\n\n        Console.WriteLine();\n        Console.WriteLine($\"Total d'Ilse : {TotalDe(auteurs, scores, \"Ilse\")} point(s)\");\n        Console.WriteLine($\"Total de Bruno : {TotalDe(auteurs, scores, \"Bruno\")} point(s)\");\n\n        Console.WriteLine();\n\n        // Retirer pendant le parcours : les mots contestés quittent les trois\n        // listes au même indice, et l'on recule d'un cran après chaque retrait.\n        Console.WriteLine(\"L'arbitre invalide les mots de moins de cinq lettres :\");\n        for (int i = 0; i < motsJoues.Count; i++)\n        {\n            if (motsJoues[i].Length < 5)\n            {\n                Console.WriteLine($\"  {motsJoues[i]} retiré (−{scores[i]} pour {auteurs[i]})\");\n                motsJoues.RemoveAt(i);\n                scores.RemoveAt(i);\n                auteurs.RemoveAt(i);\n                i--;\n            }\n        }\n\n        Console.WriteLine();\n        Console.WriteLine($\"Après arbitrage : {motsJoues.Count} mot(s), \"\n                          + $\"{Total(scores)} point(s)\");\n        Console.WriteLine($\"Mots restants : {string.Join(\", \", motsJoues)}\");\n        Console.WriteLine($\"Total d'Ilse : {TotalDe(auteurs, scores, \"Ilse\")} point(s)\");\n        Console.WriteLine($\"Total de Bruno : {TotalDe(auteurs, scores, \"Bruno\")} point(s)\");\n    }\n\n    static string Refus(string mot)\n    {\n        if (mot == \"\")\n        {\n            return \"mot vide\";\n        }\n        if (mot.Length > LongueurMax)\n        {\n            return $\"{mot.Length} lettres : plus long que le chevalet\";\n        }\n        for (int i = 0; i < mot.Length; i++)\n        {\n            if (!EstLettreMinuscule(mot[i]))\n            {\n                return $\"caractère interdit : « {mot[i]} »\";\n            }\n        }\n        return \"\";\n    }\n\n    static int Score(string mot)\n    {\n        int total = 0;\n        for (int i = 0; i < mot.Length; i++)\n        {\n            total += ValeurLettre(mot[i]);\n        }\n        return total;\n    }\n\n    static int ValeurLettre(char c)\n    {\n        if (c == 'k' || c == 'w' || c == 'x' || c == 'y' || c == 'z')\n        {\n            return 10;\n        }\n        if (c == 'b' || c == 'c' || c == 'f' || c == 'h' || c == 'j'\n            || c == 'p' || c == 'v')\n        {\n            return 3;\n        }\n        return 1;\n    }\n\n    static bool EstLettreMinuscule(char c) => c >= 'a' && c <= 'z';\n\n    static int Total(List<int> valeurs)\n    {\n        int somme = 0;\n        foreach (int v in valeurs)\n        {\n            somme += v;\n        }\n        return somme;\n    }\n\n    static int IndiceDuMax(List<int> valeurs)\n    {\n        int pos = 0;\n        for (int i = 1; i < valeurs.Count; i++)\n        {\n            if (valeurs[i] > valeurs[pos])\n            {\n                pos = i;\n            }\n        }\n        return pos;\n    }\n\n    static int TotalDe(List<string> auteurs, List<int> scores, string joueur)\n    {\n        int somme = 0;\n        for (int i = 0; i < auteurs.Count; i++)\n        {\n            if (auteurs[i] == joueur)\n            {\n                somme += scores[i];\n            }\n        }\n        return somme;\n    }\n}",
      "pourquoi": "Le second « kayak » est refusé non parce qu'il est incorrect, mais parce qu'il a déjà été posé — et le programme dit à quel tour. C'est la première règle de ce cours qui ne porte pas sur la donnée elle-même mais sur l'<em>histoire</em> du programme. Une liste ne sert pas seulement à ranger : elle sert à se souvenir, et se souvenir permet des règles qu'aucun calcul ne peut exprimer.",
