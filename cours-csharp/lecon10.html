<script>
var DAY = {
  num: 10,
  title: "List<T> et foreach",
  subtitle: "Le tableau qui grandit tout seul, version C#.",
  theory: `
<h3>1. Le problème du tableau figé</h3>
<p>Un tableau <code>new int[10]</code> a exactement 10 cases, pour toujours : impossible d'en ajouter ou d'en retirer. Quand on ne connaît pas la taille à l'avance (une liste d'inscrits qui grandit…), on utilise une <strong>liste dynamique</strong> : <code>List&lt;T&gt;</code>, l'équivalent de l'<code>ArrayList</code> de Java.</p>

<h3>2. Créer et manipuler une liste</h3>
<pre class="pseudo">using System.Collections.Generic;             // import nécessaire pour List<T>

List&lt;string&gt; noms = new List&lt;string&gt;();       // crée une liste VIDE de chaînes
noms.Add("Ana");             // ajoute "Ana" à la FIN de la liste
noms.Add("Bob");             // la liste contient maintenant [Ana, Bob]
noms.Add("Zoé");             // [Ana, Bob, Zoé]
noms[0]                      // → "Ana" : accès par indice avec les crochets (0-indexé, comme un tableau)
noms[1] = "Max";             // remplace l'élément d'indice 1 → [Ana, Max, Zoé]
noms.RemoveAt(0);            // retire l'élément d'INDICE 0 → [Max, Zoé] (tout se décale à gauche)
noms.Remove("Zoé");          // retire la 1re occurrence de la VALEUR "Zoé" → [Max]
noms.Count                   // → 1 : le NOMBRE d'éléments (Count, pas Length !)
noms.Contains("Max")         // → true : la valeur est-elle présente ?
noms.IndexOf("Max")          // → 0 : indice de la valeur (ou -1 si absente)
noms.Insert(0, "Léa");       // insère "Léa" en position 0 → [Léa, Max]</pre>
<div class="warn">Différence de vocabulaire à retenir : un TABLEAU utilise <code>.Length</code>, une LISTE utilise <code>.Count</code>. Et l'ajout se fait avec <code>.Add(x)</code>, pas avec des crochets vides comme en PHP.</div>

<h3>3. Le type générique &lt;T&gt;</h3>
<pre class="pseudo">List&lt;int&gt; notes = new List&lt;int&gt;();          // une liste qui ne contient QUE des int
List&lt;string&gt; mots = new List&lt;string&gt;();     // une liste qui ne contient QUE des string
List&lt;Compte&gt; comptes = new List&lt;Compte&gt;();  // une liste de tes propres objets (leçon 12)</pre>
<p>Le <code>&lt;T&gt;</code> (T pour <em>Type</em>) précise le type des éléments : le compilateur garantit alors qu'on ne mettra que ça dedans, et te rend le bon type à la lecture (pas de conversion). Avantage de C# sur Java : <code>List&lt;int&gt;</code> accepte directement le type primitif <code>int</code> (Java exigeait la classe enveloppe <code>Integer</code>).</p>

<h3>4. Parcourir une liste</h3>
<pre class="pseudo">for (int i = 0; i &lt; noms.Count; i++)       // par indices (Count remplace Length)
{
    Console.WriteLine($"{i} : {noms[i]}"); // affiche l'indice et la valeur
}
foreach (string nom in noms)               // plus simple, pour juste lire chaque valeur
{
    Console.WriteLine(nom);
}</pre>

<h3>5. Le piège du Remove en boucle</h3>
<pre class="pseudo">// SUPPRIMER tous les "spam" : chaque suppression DÉCALE les éléments suivants vers la gauche !
for (int i = 0; i &lt; msgs.Count; i++)
{
    if (msgs[i] == "spam")
    {
        msgs.RemoveAt(i);   // on retire l'élément d'indice i…
        i--;                // …et on RECULE d'un cran : sinon on sauterait l'élément qui a pris sa place
    }
}</pre>
<p>Pourquoi <code>i--</code> ? Après <code>RemoveAt(i)</code>, l'élément suivant glisse à l'indice <code>i</code>. Sans reculer, le <code>i++</code> de la boucle sauterait par-dessus lui. C'est un piège classique de la modification en cours de parcours.</p>

<h3>6. Tableau ou List ?</h3>
<pre class="pseudo">Taille fixe, performance brute   → int[]       // quand on connaît le nombre d'éléments d'avance
Ajouts/retraits, taille inconnue → List&lt;T&gt;      // quand la collection évolue</pre>
<div class="tip">Correspondances utiles : <code>t.Length</code> → <code>list.Count</code> · <code>t[i]</code> → <code>list[i]</code> · <code>list.Add(x)</code> pour ajouter. Les MOTIFS que tu connais (somme, maximum, recherche) restent identiques : seule la façon de connaître la taille change.</div>`,
  exercises: [
    { type: "qcm", q: "L'avantage de List<T> sur le tableau :", opts: ["Plus rapide", "Taille variable : Add et Remove à volonté", "Accepte tout type mélangé", "Aucun"], a: 1, exp: "Le tableau est figé ; la liste grandit." },
    { type: "qcm", q: "Déclarer une liste de string :", opts: ["List<string> l = new List<string>();", "string[] l = new List();", "ArrayList l;", "List l = string;"], a: 0, exp: "Avec using System.Collections.Generic; et le type entre chevrons." },
    { type: "qcm", q: "Une liste d'entiers :", opts: ["List<Integer> (comme Java)", "List<int> : C# accepte le primitif directement !", "List<entier>", "int<List>"], a: 1, exp: "Avantage C# : pas besoin de la classe enveloppe Integer." },
    { type: "qcm", q: "Lire le 1ᵉʳ élément d'une liste l :", opts: ["l.get(0)", "l[0] : crochets, comme un tableau", "l.first()", "l.Item(0)"], a: 1, exp: "C# garde les crochets (Java utilisait get(0))." },
    { type: "qcm", q: "La taille d'une List :", opts: ["l.Length", "l.Count : les listes utilisent Count", "l.size()", "count(l)"], a: 1, exp: "Tableau → .Length, Liste → .Count : à retenir." },
    { type: "input", q: "List<int> l vide; l.Add(5); l.Add(9); l[0] = 7; l[0] + l[1] = ?", a: "16", ph: "nombre", exp: "[7, 9] → 16." },
    { type: "qcm", q: "Ajouter un élément :", opts: ["l[] = x (PHP)", "l.Add(x)", "l.push(x)", "l + x"], a: 1, exp: "Add : la méthode d'ajout C#." },
    { type: "qcm", q: "l.Contains(\"Zoé\") remplace quel algorithme du mois d'algo ?", opts: ["Le tri", "La recherche séquentielle (jour 16)", "Le max", "La dichotomie"], a: 1, exp: "Parcours interne à la recherche d'une valeur." },
    { type: "qcm", q: "l.IndexOf(x) retourne -1 quand…", opts: ["x est en tête", "x est ABSENT", "La liste est pleine", "x est null"], a: 1, exp: "-1 = pas trouvé (comme partout)." },
    { type: "qcm", q: "Retirer l'élément à l'indice 2 :", opts: ["l.Remove(2)", "l.RemoveAt(2) : par INDICE", "l.delete(2)", "l[2] = null"], a: 1, exp: "RemoveAt(indice) vs Remove(valeur) : deux méthodes distinctes." },
    { type: "qcm", q: "Pourquoi i-- après un RemoveAt(i) en boucle ?", opts: ["Ralentir", "La suppression décale les suivants sur i : sans recul, on saute un élément", "Inutile", "Sortir"], a: 1, exp: "Deux « spam » consécutifs : sans i--, le second échappe." },
    { type: "input", q: "List<int> notes = {12, 8, 15}; somme via foreach → ?", a: "35", ph: "nombre", exp: "L'accumulateur du jour 12 marche sur toutes les structures." },
    { type: "qcm", q: "Gérer des inscriptions (arrivées/départs imprévisibles) :", opts: ["string[200]", "List<string> : taille variable par nature", "int[]", "char[]"], a: 1, exp: "Ajouts/retraits → liste." },
    { type: "qcm", q: "Une List peut-elle contenir tes propres objets (List<Compte>) ?", opts: ["Non", "Oui : List<Compte> — la gestion de collections d'objets (leçon 12)", "Seulement des int", "Seulement 2"], a: 1, exp: "Le générique <T> accepte n'importe quel type, y compris tes classes." },
    { type: "qcm", q: "l.Count == 0 teste…", opts: ["Le premier élément", "La liste VIDE : pense au cas limite du jour 30 !", "Le maximum", "L'indice"], a: 1, exp: "Vide/unité/extrêmes : la check-list suit partout." }
  ],
  final: {
    title: "Exercice final — La liste d'attente du cabinet",
    intro: `<p>Un cabinet gère sa salle d'attente avec une List (une FILE du jour 29 !) :</p>
<pre class="pseudo">List&lt;string&gt; attente = new List&lt;string&gt;();
attente.Add("Ana");
attente.Add("Bob");
attente.Add("Zoé");
string suivant = attente[0];        // (1) le premier
attente.RemoveAt(0);                //     on l'appelle
attente.Add("Max");                 // (2) nouvelle arrivée
attente.Remove("Bob");              // (3) Bob abandonne
Console.WriteLine($"{attente.Count} en attente, prochain : {attente[0]}");</pre>`,
    questions: [
      { type: "qcm", q: "(1) Que vaut <code>suivant</code> ?", opts: ["Ana : attente[0] est la tête — premier arrivé, premier servi (FIFO)", "Zoé", "Max", "Bob"], a: 0, exp: "L'indice 0 = le plus ancien : une file (jour 29)." },
      { type: "qcm", q: "Après (1) et (2), la liste contient…", opts: ["[Bob, Zoé, Max]", "[Ana, Bob, Zoé, Max]", "[Max, Bob, Zoé]", "[Zoé, Max]"], a: 0, exp: "Ana retirée, Max ajouté en fin." },
      { type: "qcm", q: "Quelle structure du jour 29 cette gestion reproduit-elle ?", opts: ["Une pile (LIFO)", "Une FILE (FIFO) : Add en fin = ENFILER, RemoveAt(0) = DÉFILER", "Un arbre", "Un tri"], a: 1, exp: "La List sait jouer la file — les abstractions du jour 29 se construisent avec les outils du langage." },
      { type: "input", q: "Après (3), qu'affiche la ligne ? (nombre + prochain)", a: ["2 en attente, prochain : Zoé", "2 en attente, prochain : Zoe"], ph: "n en attente, prochain : X", exp: "[Zoé, Max] : Count 2, tête Zoé." },
      { type: "qcm", q: "Pour jouer une PILE (Ctrl+Z) avec une List :", opts: ["Add + RemoveAt(0)", "Add en fin + RemoveAt(Count-1) : empiler/dépiler au MÊME bout", "RemoveAt(0) seul", "Impossible"], a: 1, exp: "Même liste, autre discipline : le bout unique fait le LIFO (jour 29). C# offre aussi les vraies classes Stack<T> et Queue<T> !" }
    ],
    solution: `<pre class="pseudo">[Ana] [Ana,Bob] [Ana,Bob,Zoé]
suivant = attente[0] = "Ana" ; RemoveAt(0) → [Bob,Zoé]   DÉFILER
Add("Max") → [Bob,Zoé,Max]                                ENFILER
Remove("Bob") → [Zoé,Max]
Affiche : 2 en attente, prochain : Zoé

File = Add + RemoveAt(0). Pile = Add + RemoveAt(Count-1).
C# a aussi Stack<T> et Queue<T> tout faits.</pre>
<p>La semaine 1 C# s'achève. Demain, le grand pont : tes algorithmes en C#.</p>`
  }
};
