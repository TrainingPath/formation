<script>
var DAY = {
  num: 30,
  title: "Projet guidé : le gestionnaire de tâches",
  subtitle: "Une vraie application console complète, conçue au jour 30.",
  theory: `
<h3>1. Le cahier des charges</h3>
<p>Un <strong>gestionnaire de tâches</strong> en console : ajouter une tâche (titre + priorité), lister, marquer comme faite, supprimer, sauvegarder en JSON, quitter. On applique la méthode éprouvée : comprendre le besoin → découper en classes → écrire chaque brique → vérifier. Ce projet réunit presque tout le cours.</p>

<h3>2. Le découpage en classes (une responsabilité chacune)</h3>
<pre class="pseudo">enum Priorite { Basse, Moyenne, Haute }                       // les niveaux de priorité (leçon 19)
class Tache          : Titre, Priorite, Faite  + ToString    // représente UNE tâche (les données)
class Gestionnaire   : List&lt;Tache&gt; + opérations (Ajouter, Lister...)  // gère la COLLECTION de tâches
class Program        : le menu (do-while + switch)           // s'occupe du DIALOGUE avec l'utilisateur</pre>
<p>Chaque classe a un rôle unique : c'est plus clair, plus facile à tester et à faire évoluer que tout mettre dans <code>Main</code>.</p>

<h3>3. La classe Tache (leçons 12-13-19)</h3>
<pre class="pseudo">enum Priorite { Basse, Moyenne, Haute }

class Tache
{
    public string Titre { get; set; }            // propriétés auto-implémentées (leçon 13)
    public Priorite Priorite { get; set; }       // le type est notre enum
    public bool Faite { get; set; }              // la tâche est-elle terminée ?

    public Tache(string titre, Priorite priorite)  // constructeur (leçon 13)
    {
        Titre = titre;
        Priorite = priorite;
        Faite = false;                      // à la création, une tâche est toujours « à faire »
    }
    public override string ToString()        // affichage personnalisé (leçon 13)
    {
        string coche = Faite ? "[x]" : "[ ]";   // ternaire : case cochée si Faite
        return $"{coche} {Titre} ({Priorite})"; // ex. « [ ] Réviser (Haute) »
    }
}</pre>

<h3>4. La classe Gestionnaire (leçons 10, 11, 16, 17, 18)</h3>
<pre class="pseudo">class Gestionnaire
{
    private List&lt;Tache&gt; taches = new List&lt;Tache&gt;();   // la collection interne (privée = encapsulée)

    public void Ajouter(Tache t) =&gt; taches.Add(t);   // ajoute une tâche (méthode-expression)
    public void Lister()
    {
        if (taches.Count == 0) { Console.WriteLine("(aucune tâche)"); return; }  // cas limite : liste vide
        for (int i = 0; i &lt; taches.Count; i++)
            Console.WriteLine($"{i} : {taches[i]}");     // {taches[i]} déclenche ToString automatiquement
    }
    public void MarquerFaite(int i)
    {
        if (i &gt;= 0 &amp;&amp; i &lt; taches.Count) { taches[i].Faite = true; }  // on vérifie l'indice AVANT (anti-débordement)
    }
    public void Supprimer(int i)
    {
        if (i &gt;= 0 &amp;&amp; i &lt; taches.Count) { taches.RemoveAt(i); }      // même garde-fou sur l'indice
    }
    // Bonus LINQ (leçon 18) : renvoyer les tâches à priorité Haute encore à faire
    public List&lt;Tache&gt; Urgentes() =&gt;
        taches.Where(t =&gt; t.Priorite == Priorite.Haute &amp;&amp; !t.Faite).ToList();  // filtre puis convertit en liste
    public void Sauver(string f) =&gt;
        File.WriteAllText(f, JsonSerializer.Serialize(taches));    // sérialise la liste en JSON (leçon 17)
    public void Charger(string f)
    {
        if (File.Exists(f))                                        // cas limite : premier lancement, fichier absent
            taches = JsonSerializer.Deserialize&lt;List&lt;Tache&gt;&gt;(File.ReadAllText(f));  // JSON → objets
    }
}</pre>

<h3>5. Le menu (leçons 4, 5, 6, 16)</h3>
<pre class="pseudo">var g = new Gestionnaire();
g.Charger("taches.json");                          // au démarrage : recharger l'état sauvegardé
int choix;
do                                                 // do-while : on affiche le menu au moins une fois
{
    Console.WriteLine("1.Ajouter 2.Lister 3.Faite 4.Supprimer 5.Quitter");
    int.TryParse(Console.ReadLine(), out choix);   // lecture sûre : choix = 0 si saisie invalide
    switch (choix)                                 // aiguillage selon le choix
    {
        case 1: /* lire titre + priorité, puis g.Ajouter(...) */ break;
        case 2: g.Lister(); break;
        case 3: /* lire l'indice, puis g.MarquerFaite(i) */ break;
        case 4: /* lire l'indice, puis g.Supprimer(i) */ break;
    }
} while (choix != 5);                              // on répète jusqu'au choix « Quitter »
g.Sauver("taches.json");                           // à la sortie : sauvegarder l'état</pre>
<div class="tip">Repère la carte des notions : enum (19), classe + propriétés (12-13), List (10), ToString (13), do-while + switch (5-6), TryParse (4), cas limites (fichier absent, indice invalide), LINQ (18), JSON (17). Le projet EST la révision : chaque brique a été vue isolément, ici elles collaborent.</div>`,
  exercises: [
    { type: "qcm", q: "Pourquoi enum Priorite plutôt que des int (0=basse…) ?", opts: ["Décoration", "Lisibilité + sécurité : Priorite.Haute au lieu de 2, valeurs vérifiées (leçon 19)", "Plus rapide", "Obligatoire"], a: 1, exp: "Le code se lit, le compilateur protège." },
    { type: "qcm", q: "Pourquoi TROIS classes (Tache, Gestionnaire, Program) ?", opts: ["Pour faire long", "Découpage du jour 22 : une responsabilité par classe, testable", ".NET l'exige", "Pour les usings"], a: 1, exp: "Tache = les données ; Gestionnaire = la collection ; Program = le dialogue." },
    { type: "qcm", q: "Faite est initialisée à false dans le constructeur car…", opts: ["Hasard", "Une tâche neuve est forcément « à faire » : l'objet naît cohérent (leçon 13)", "false plus rapide", "Pour ToString"], a: 1, exp: "L'invariant s'installe à la naissance." },
    { type: "qcm", q: "Le ToString de Tache affiche [x] ou [ ] selon Faite. Quel outil ?", opts: ["Une boucle", "L'opérateur ternaire (Faite ? \"[x]\" : \"[ ]\") + interpolation", "Un switch", "LINQ"], a: 1, exp: "Le ternaire de la leçon 5, l'interpolation de la leçon 4." },
    { type: "qcm", q: "MarquerFaite teste <code>i >= 0 && i < taches.Count</code>. Pourquoi ?", opts: ["Décoration", "Anti-débordement : un indice hors bornes lancerait ArgumentOutOfRange (le réflexe du jour 14/15)", "Pour trier", "Pour compter"], a: 1, exp: "L'indice vient de l'utilisateur : le valider avant de l'utiliser." },
    { type: "qcm", q: "Lister() affiche « (aucune tâche) » si vide. Quel réflexe ?", opts: ["Décoration", "Le CAS LIMITE du jour 30 : une liste vide ne doit pas afficher du néant", "Un bug", "L'héritage"], a: 1, exp: "Vide/unité/extrêmes : la check-list veille." },
    { type: "qcm", q: "Le menu utilise do-while car…", opts: ["while interdit", "Le menu doit s'afficher AU MOINS une fois (leçon 6 / jour 11)", "Plus court", "for ne marche pas"], a: 1, exp: "L'exécution garantie du do-while." },
    { type: "qcm", q: "int.TryParse(..., out choix) plutôt que int.Parse car…", opts: ["Plus court", "L'utilisateur peut taper « abc » : TryParse met 0 (invalide) sans planter (leçon 4/16)", "Parse est déprécié", "Pour LINQ"], a: 1, exp: "0 ne correspond à aucun case : le menu se réaffiche." },
    { type: "qcm", q: "La méthode Urgentes() utilise LINQ. Que fait <code>Where(t => t.Priorite == Priorite.Haute && !t.Faite)</code> ?", opts: ["Trie", "Filtre les tâches HAUTES non faites : le compteur/filtre conditionnel du jour 12, en LINQ", "Supprime", "Compte"], a: 1, exp: "Where = collectionner sous condition (leçon 18)." },
    { type: "qcm", q: "Sauver/Charger utilisent JsonSerializer. Avantage sur un CSV maison ?", opts: ["Aucun", "Sérialise l'OBJET Tache entier (titre, priorité, faite) automatiquement — pas de reconstruction manuelle (leçon 17)", "Plus lent exprès", "CSV impossible"], a: 1, exp: "L'atout C# : objets ↔ JSON en une ligne." },
    { type: "qcm", q: "Quand appeler Charger et Sauver ?", opts: ["À chaque action", "Charger au DÉMARRAGE, Sauver à la SORTIE (case 5) : le cycle de la leçon 17", "Jamais", "Au milieu"], a: 1, exp: "Fichier → mémoire → fichier." },
    { type: "qcm", q: "Console.WriteLine(taches[i]) affiche « [ ] Courses (Haute) » grâce à…", opts: ["Un getter", "ToString() override (leçon 13), appelé automatiquement", "LINQ", "La liste"], a: 1, exp: "La carte d'identité affichable de chaque objet." },
    { type: "qcm", q: "Pour tester la classe Tache SEULE :", opts: ["Tout le projet", "Un petit Main d'essai : new Tache, vérifier ToString, basculer Faite — testable isolément (jour 22)", "Un serveur", "Internet"], a: 1, exp: "Brique par brique." },
    { type: "qcm", q: "Évolution : « trier l'affichage par priorité ». Où intervenir ?", opts: ["Dans Program", "Dans Gestionnaire.Lister() : un OrderByDescending (LINQ) avant la boucle — les autres classes ne bougent pas", "Dans Tache", "Partout"], a: 1, exp: "Le découpage paie : une évolution = une méthode touchée." },
    { type: "qcm", q: "L'utilisateur marque « faite » la tâche n°99 (inexistante). Grâce au test de bornes :", opts: ["Plantage", "Rien : le if (i < Count) l'ignore — l'accès hors bornes est évité (cas limite du jour 30)", "La liste grandit", "Erreur affichée"], a: 1, exp: "Ne jamais faire confiance à l'indice saisi." }
  ],
  final: {
    title: "Exercice final — Trace d'une session complète",
    intro: `<p>Session utilisateur. taches.json contient déjà une tâche « Courses (Moyenne), non faite ». L'utilisateur fait :</p>
<pre class="pseudo">1 → ajoute "Réviser C#" / priorité Haute
2 → liste
3 → marque faite l'indice 0 (Courses)
4 → supprime l'indice 99 (n'existe pas)
5 → quitte</pre>`,
    questions: [
      { type: "input", q: "Après le chargement et l'ajout, combien de tâches en mémoire ?", a: "2", ph: "nombre", exp: "Courses (chargée) + Réviser C# (ajoutée)." },
      { type: "qcm", q: "Le « 2 » (liste) affiche…", opts: ["Rien", "0 : [ ] Courses (Moyenne) et 1 : [ ] Réviser C# (Haute) — via ToString", "Deux [x]", "(aucune tâche)"], a: 1, exp: "ToString reflète l'état : les deux sont « à faire » ([ ])." },
      { type: "qcm", q: "Après le « 3 » (marquer faite l'indice 0), Courses devient…", opts: ["Supprimée", "[x] Courses (Moyenne) : Faite passe à true, le ToString affiche [x]", "Haute", "Inchangée"], a: 1, exp: "MarquerFaite(0) bascule le booléen." },
      { type: "qcm", q: "Le « 4 » (supprimer l'indice 99 inexistant) :", opts: ["Plante avec ArgumentOutOfRange", "Ne fait RIEN : le test i < taches.Count l'ignore — cas limite géré (jour 30)", "Supprime la tâche 0", "Vide la liste"], a: 1, exp: "L'anti-débordement protège." },
      { type: "qcm", q: "Après le « 5 », que contient taches.json ?", opts: ["Vide", "Les 2 tâches sérialisées (Courses faite, Réviser C# à faire) : prêt pour la prochaine session", "Seulement Réviser", "L'ancien contenu"], a: 1, exp: "Sauver réécrit tout en JSON : au prochain lancement, Courses sera toujours [x]." }
    ],
    solution: `<pre class="pseudo">ARCHITECTURE
enum Priorite  : valeurs nommées et sûres
Tache          : données + ToString + invariant (naît à faire)
Gestionnaire   : List + opérations + bornes + LINQ + JSON
Program        : do-while + switch + TryParse

SESSION
charger  → [Courses(à faire)]
ajout    → [Courses, Réviser C#]
liste    → 0:[ ] Courses  1:[ ] Réviser C#
faite 0  → Courses [x]
suppr 99 → ignoré (bornes)
quitter  → taches.json : Courses(faite), Réviser C#(à faire)</pre>
<p>Douze leçons collaborent. Code-le en vrai avec le SDK .NET. Demain : l'examen final C#.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton code C# ici…",
  items: [
  { id: "cs-todolist", title: "La to-do list (List + menu)", level: 3,
    statement: "Mini gestionnaire de tâches en console : une <code>List&lt;string&gt;</code> et un menu en boucle — <strong>1.</strong> ajouter une tâche, <strong>2.</strong> lister les tâches (numérotées), <strong>3.</strong> supprimer par numéro, <strong>0.</strong> quitter.",
    hints: [
      "Une boucle while (true) affiche le menu ; le choix 0 fait break.",
      "Ajouter : taches.Add(texte). Lister : for avec i, en affichant (i + 1) pour numéroter à partir de 1.",
      "Supprimer : lire le numéro n, vérifier 1 <= n <= taches.Count, puis taches.RemoveAt(n - 1) — l'indice réel est n-1 !"
    ],
    solution: "using System;                                    // accès à Console\nusing System.Collections.Generic;                // accès à List<T>\n\nclass ToDoList                                   // déclaration de la classe\n{                                                // début de la classe\n    static void Main()                           // point d'entrée du programme\n    {                                            // début de Main\n        List<string> taches = new List<string>(); // la liste des tâches, vide au départ\n        while (true)                             // boucle du menu : tourne jusqu'au choix 0\n        {                                        // début du tour de menu\n            Console.WriteLine(\"\\n1.Ajouter 2.Lister 3.Supprimer 0.Quitter\"); // \\n = ligne vide avant\n            Console.Write(\"Choix ? \");           // invite\n            string choix = Console.ReadLine();   // lit le choix (string : pas de plantage possible)\n            if (choix == \"0\")                    // demande de sortie ?\n                break;                           // quitte la boucle → fin du programme\n            else if (choix == \"1\")               // AJOUTER\n            {                                    // début du cas 1\n                Console.Write(\"Tâche ? \");       // demande le texte\n                taches.Add(Console.ReadLine());  // ajoute la saisie en fin de liste\n            }                                    // fin du cas 1\n            else if (choix == \"2\")               // LISTER\n            {                                    // début du cas 2\n                for (int i = 0; i < taches.Count; i++)      // parcourt la liste par indices\n                    Console.WriteLine($\"{i + 1}. {taches[i]}\"); // affiche 1., 2., … (indice + 1)\n            }                                    // fin du cas 2\n            else if (choix == \"3\")               // SUPPRIMER\n            {                                    // début du cas 3\n                Console.Write(\"Numéro ? \");      // demande le numéro affiché\n                int n = int.Parse(Console.ReadLine()); // convertit en entier\n                if (n >= 1 && n <= taches.Count) // le numéro est-il valide ?\n                    taches.RemoveAt(n - 1);      // supprime : l'indice réel est numéro - 1\n                else                             // numéro hors limites\n                    Console.WriteLine(\"Numéro invalide\"); // message d'erreur\n            }                                    // fin du cas 3\n        }                                        // fin de la boucle de menu\n        Console.WriteLine(\"Au revoir !\");        // message de sortie\n    }                                            // fin de Main\n}                                                // fin de la classe",
    note: "C'est le squelette du projet guidé de cette leçon — le décalage numéro affiché / indice réel (n-1) est le piège central." }
  ]
};
