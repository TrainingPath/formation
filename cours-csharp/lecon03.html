  title: "Opérateurs, conversions et Math",
  subtitle: "Le jour 4 d'algorithmique — avec le même piège de division qu'en Java.",
  theory: `
<h3>1. Arithmétique</h3>
<pre class="pseudo">PSEUDOCODE    C#
+ - *         + - *                              // addition, soustraction, multiplication : comme en maths
DIV           /      →  7 / 2 = 3                // division ENTIÈRE entre deux int (le reste est jeté !)
MOD           %      →  7 % 2 = 1                // modulo : le RESTE de la division entière</pre>
<div class="warn">Comme Java : <code>/</code> entre deux int fait une division ENTIÈRE. <code>7 / 2</code> vaut <strong>3</strong> (pas 3,5), car le résultat d'une opération entre deux entiers est lui-même un entier. Pour obtenir 3,5, il faut qu'au moins un opérande soit un double → <code>7.0 / 2</code> ou <code>(double)a / b</code>. Contrairement à PHP, C# a ce piège : garde-le en tête.</div>
<p>Le <strong>modulo</strong> <code>%</code> donne le reste : <code>7 % 2 = 1</code> car 7 = 2×3 + 1. C'est l'outil pour tester la parité (<code>n % 2 == 0</code>) ou la divisibilité.</p>

<h3>2. Le cast : forcer une conversion de type</h3>
<pre class="pseudo">double d = 5.9;               // d contient 5,9
int n = (int) d;              // (int) CONVERTIT en entier en TRONQUANT (coupe la virgule) → n vaut 5
int a = 7, b = 2;             // deux entiers (déclarés sur la même ligne)
double m = (double) a / b;    // on caste a en double AVANT de diviser → division réelle → m vaut 3.5</pre>
<p>Un <strong>cast</strong> <code>(type)</code> demande explicitement au compilateur une conversion qu'il refuserait sinon (car risquée). Attention : le cast <strong>tronque</strong>, il n'arrondit pas — <code>(int) 5.9</code> donne 5, pas 6. Et la position du cast compte : dans <code>(double) a / b</code>, on convertit <code>a</code> d'abord, ce qui « contamine » toute la division en réel.</p>

<h3>3. Conversions de chaînes (texte ↔ nombre)</h3>
<pre class="pseudo">int n = int.Parse("42");                   // transforme le TEXTE "42" en NOMBRE 42 (plante si le texte est invalide)
double d = double.Parse("3.14");           // idem pour un nombre à virgule
bool ok = int.TryParse("42", out int r);   // version SÛRE : ok=true et r=42 ; si échec, ok=false (pas de plantage)
string s = n.ToString();                   // sens inverse : le nombre 42 devient le texte "42"
string s2 = Convert.ToString(n);           // autre façon d'obtenir "42"</pre>
<p>Pourquoi ces conversions ? Parce qu'une saisie clavier ou un fichier arrivent toujours sous forme de <strong>texte</strong> : « 42 » (trois caractères) n'est pas le nombre 42 tant qu'on ne l'a pas <em>parsé</em>. <code>Parse</code> est strict (il lève une exception sur une saisie invalide) ; <code>TryParse</code> est prudent (il renvoie un booléen de succès), à préférer dès que la donnée vient de l'utilisateur.</p>

<h3>4. Raccourcis et comparaisons</h3>
<pre class="pseudo">n += 1;  n++;  total += prix;      // += ajoute et range ; n++ ajoute 1 (raccourcis identiques à Java)
==  !=  &lt;  &gt;  &lt;=  &gt;=               // opérateurs de COMPARAISON : == teste l'égalité (à ne pas confondre avec = qui affecte)
&amp;&amp;  ||  !                          // opérateurs LOGIQUES : ET, OU, NON (combinent des booléens)</pre>
<p>Piège classique : <code>=</code> affecte une valeur, <code>==</code> compare deux valeurs. Écrire <code>if (x = 5)</code> au lieu de <code>if (x == 5)</code> est une erreur fréquente (heureusement souvent refusée par le compilateur en C#).</p>

<h3>5. La classe Math</h3>
<pre class="pseudo">Math.Abs(-5)      → 5        // valeur absolue (PascalCase : Abs, pas abs !)
Math.Max(3, 8)    → 8        // le plus grand des deux
Math.Min(3, 8)    → 3        // le plus petit des deux
Math.Pow(2, 10)   → 1024.0   // puissance : 2 exposant 10 (renvoie un double)
Math.Sqrt(16)     → 4.0      // racine carrée
Math.Round(5.7)   → 6        // arrondi au plus proche (VRAI arrondi, ≠ cast qui tronque)
Math.Floor(5.9)   → 5.0      // arrondi vers le BAS (floor = plancher)
Math.Ceiling(5.1) → 6.0      // arrondi vers le HAUT (Ceiling, pas Ceil !)</pre>
<div class="tip">Les méthodes .NET sont en PascalCase : <code>Math.Abs</code>, <code>Math.Max</code> (majuscule !) là où Java écrivait Math.abs. Petit dépaysement, même logique. Retiens surtout la différence <code>Round</code> (arrondit) vs cast <code>(int)</code> (tronque) : <code>Math.Round(5.7)</code> = 6 mais <code>(int)5.7</code> = 5.</div>

<h3>6. Priorités des opérateurs</h3>
<p>Comme en mathématiques, les opérateurs s'appliquent dans un ordre précis : d'abord les <strong>parenthèses</strong>, puis <code>* / %</code>, puis <code>+ -</code>, puis les comparaisons, puis <code>&amp;&amp;</code> avant <code>||</code>. En cas de doute, mets des parenthèses : elles ne coûtent rien et clarifient l'intention.</p>
<h3>Aller plus loin — pré-incrément (++i) et post-incrément (i++)</h3>
<p>Les deux écritures ajoutent 1 à la variable ; la différence n'apparaît que lorsqu'on <strong>lit la valeur au moment même</strong> de l'incrémentation. La formule à retenir : <code>i++</code> « donne sa valeur, PUIS grandit » ; <code>++i</code> « grandit, PUIS donne sa valeur ».</p>
<pre class="pseudo">int a = 5;        // a vaut 5
int b = a++;      // POST-increment : b prend l'ANCIENNE valeur -> b = 5, et ENSUITE a passe a 6
int c = 5;        // c vaut 5
int d = ++c;      // PRE-increment : c passe d'abord a 6, PUIS d prend la NOUVELLE valeur -> d = 6</pre>
<p>Dans une boucle <code>for (i = 0; i &lt; 5; i++)</code>, on ne lit pas le résultat de <code>i++</code> : on veut seulement « ajouter 1 ». C'est pourquoi <code>i++</code> et <code>++i</code> y donnent exactement la même boucle et sont interchangeables.</p>
<h3>Inverser une condition proprement — les lois de De Morgan</h3>
<p>Pour obtenir le CONTRAIRE d'une condition composée, on ne peut pas juste coller un <code>!</code> devant sans réfléchir. Les <strong>lois de De Morgan</strong> disent comment le NON « rentre » dans la parenthèse : il inverse chaque morceau ET échange <code>&amp;&amp;</code> (ET) avec <code>||</code> (OU).</p>
<pre class="pseudo">!(a &amp;&amp; b)      // NON (A ET B)...
  =  !a || !b     // ...devient (NON A) OU (NON B)
!(a || b)      // NON (A OU B)...
  =  !a &amp;&amp; !b     // ...devient (NON A) ET (NON B)</pre>
<p>Exemple : l'inverse de « la note est valide » <code>note &gt;= 0 &amp;&amp; note &lt;= 20</code> n'est PAS <code>note &gt;= 0 || note &lt;= 20</code>, mais <code>note &lt; 0 || note &gt; 20</code> (« en dessous de 0 OU au-dessus de 20 »). Chaque comparaison s'inverse, et le ET devient OU.</p>`,

      "remarque": "Les relevés sont volontairement entiers parce que la conversion d'un texte à virgule dépend de la langue configurée sur la machine : « 12.5 » est lu sans peine par un ordinateur anglais et refusé par un ordinateur français, qui attend « 12,5 ». Un programme qui ignore cela fonctionne parfaitement jusqu'au jour où il change de pays. Nous le contournerons proprement plus tard ; aujourd'hui, il fallait au moins le nommer.",

        "Sépare l'exercice en quatre blocs indépendants : les conversions, les raccourcis, les conditions combinées, les calculs finaux. Aucun ne dépend des autres, tu peux les écrire et les essayer dans l'ordre que tu veux — commence par celui qui te semble le plus clair, cela t'échauffera pour les autres.",

      "solution": "// La station de lavage : des données qui arrivent en texte, et des règles\n// qui se combinent. Deux sources d'erreur, deux façons de s'en protéger.\nusing System;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        // Ce qui arrive d'un automate arrive toujours en texte, jamais en nombre.\n        // Les relevés sont volontairement en ENTIERS : le séparateur décimal\n        // d'un texte à convertir dépend de la langue de la machine, et un\n        // programme qui l'ignore casse en franchissant une frontière.\n        string releveCompteur = \"1847\";\n        string releveDecilitres = \"125\";\n        string releveDouteux = \"12,5 L\";\n\n        // Version stricte : elle convertit, et elle plante si le texte est mauvais.\n        int compteur = int.Parse(releveCompteur);\n        int decilitres = int.Parse(releveDecilitres);\n        double litres = decilitres / 10.0;\n        Console.WriteLine(\"Compteur : \" + compteur + \" lavages\");\n        Console.WriteLine(\"Consommation : \" + litres + \" litres\");\n\n        // Version prudente : elle rend un booléen de succès et ne plante jamais.\n        bool lisible = int.TryParse(releveDouteux, out int valeurDouteuse);\n        Console.WriteLine(\"« \" + releveDouteux + \" » est-il lisible ? \" + lisible);\n        Console.WriteLine(\"Valeur récupérée dans ce cas : \" + valeurDouteuse);\n\n        Console.WriteLine();\n\n        // Le sens inverse : un nombre redevient du texte quand on le demande.\n        string compteurTexte = compteur.ToString();\n        Console.WriteLine(\"Le compteur, en texte : \" + compteurTexte);\n\n        Console.WriteLine();\n\n        // Les raccourcis d'affectation.\n        int lavagesDuJour = 0;\n        lavagesDuJour += 14;\n        lavagesDuJour += 9;\n        lavagesDuJour++;\n        Console.WriteLine(\"Lavages du jour : \" + lavagesDuJour);\n\n        // Post-incrément et pré-incrément : la différence ne se voit qu'en lisant.\n        int a = 5;\n        int b = a++;\n        int c = 5;\n        int d = ++c;\n        Console.WriteLine(\"a++ : b vaut \" + b + \", a vaut \" + a);\n        Console.WriteLine(\"++c : d vaut \" + d + \", c vaut \" + c);\n\n        Console.WriteLine();\n\n        // Les règles de la station, écrites en conditions combinées.\n        int heure = 21;\n        bool machineLibre = true;\n        int litresRestants = 340;\n\n        bool dansLesHoraires = heure >= 7 && heure <= 22;\n        bool assezDEau = litresRestants >= 60;\n        bool lavageAutorise = dansLesHoraires && machineLibre && assezDEau;\n\n        Console.WriteLine(\"Dans les horaires : \" + dansLesHoraires);\n        Console.WriteLine(\"Assez d'eau       : \" + assezDEau);\n        Console.WriteLine(\"Lavage autorisé   : \" + lavageAutorise);\n\n        // L'inverse d'une condition composée : chaque morceau s'inverse,\n        // et le ET devient OU. Les deux lignes disent la même chose.\n        bool refuseNaif = !(dansLesHoraires && machineLibre && assezDEau);\n        bool refuseDeveloppe = !dansLesHoraires || !machineLibre || !assezDEau;\n        Console.WriteLine(\"Refus, écrit avec un NON global : \" + refuseNaif);\n        Console.WriteLine(\"Refus, écrit morceau par morceau : \" + refuseDeveloppe);\n\n        Console.WriteLine();\n\n        // Le prix du lavage, au centime, à partir des litres consommés.\n        double prixParLitre = 0.019;\n        double coutBrut = litres * prixParLitre;\n        double coutArrondi = Math.Round(coutBrut * 100) / 100;\n        Console.WriteLine(\"Coût brut    : \" + coutBrut);\n        Console.WriteLine(\"Coût arrondi : \" + coutArrondi + \" €\");\n        Console.WriteLine(\"Écart de température des cuves : \" + Math.Abs(4 - 19) + \" degrés\");\n    }\n}",

        "Ton fichier ressemble à ceci :<br><code>decimal total = nbSucre * …</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;+ nbCassonade * …</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;+ …;</code><br><code>int totalCentimes = nbSucre * 200 + nbCassonade * … + …;</code><br><code>int moyenneTronquee = totalCentimes / …;</code><br><code>double moyenneReelle = (double) totalCentimes / …;</code><br><code>int pieces2Euros = rendreCentimes / …;</code><br><code>int reste = rendreCentimes % …;</code><br><code>int potsNecessaires = (nbCrepes + patesParPot - 1) / …;</code><br><code>patesRestantes -= …;</code>"

      "solution": "// Le stand de crêpes — jour 3 sur 4 : la caisse sait compter.\n// Les prix nommés d'hier ne bougent pas ; ce qui est neuf, ce sont les\n// calculs — et les deux pièges qu'ils réservent.\nusing System;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        // Les quatre prix d'hier, inchangés.\n        const decimal PrixSucre = 2.00m;\n        const decimal PrixCassonade = 2.20m;\n        const decimal PrixChocolat = 3.00m;\n        const decimal SupplementChantilly = 0.50m;\n\n        // La commande d'une famille.\n        int nbSucre = 3;\n        int nbCassonade = 2;\n        int nbChocolat = 4;\n        int nbChantilly = 5;\n\n        int nbCrepes = nbSucre + nbCassonade + nbChocolat;\n\n        decimal total = nbSucre * PrixSucre\n                      + nbCassonade * PrixCassonade\n                      + nbChocolat * PrixChocolat\n                      + nbChantilly * SupplementChantilly;\n\n        Console.WriteLine(\"COMMANDE\");\n        Console.WriteLine(\"Crêpes : \" + nbCrepes + \" (dont \" + nbChantilly + \" avec chantilly)\");\n        Console.WriteLine(\"Total : \" + total + \" €\");\n\n        Console.WriteLine();\n\n        // Tout le reste du programme travaille en CENTIMES ENTIERS : un entier\n        // est exact par construction, et le modulo y devient utilisable.\n        int totalCentimes = nbSucre * 200 + nbCassonade * 220\n                          + nbChocolat * 300 + nbChantilly * 50;\n        Console.WriteLine(\"Total en centimes : \" + totalCentimes);\n\n        // Premier piège : deux entiers divisés donnent un entier, le reste est jeté.\n        int moyenneTronquee = totalCentimes / nbCrepes;\n        int resteMoyenne = totalCentimes % nbCrepes;\n        double moyenneReelle = (double) totalCentimes / nbCrepes;\n        Console.WriteLine(\"Prix moyen, division entière : \" + moyenneTronquee\n                          + \" centimes (reste \" + resteMoyenne + \")\");\n        Console.WriteLine(\"Prix moyen, division réelle  : \" + moyenneReelle + \" centimes\");\n\n        Console.WriteLine();\n\n        // Second piège : rendre la monnaie. Le modulo dit exactement combien de\n        // pièces de chaque valeur donner, sans une seule soustraction répétée.\n        int payeCentimes = 5000;\n        int rendreCentimes = payeCentimes - totalCentimes;\n        Console.WriteLine(\"Payé : \" + payeCentimes + \" — à rendre : \" + rendreCentimes);\n\n        int pieces2Euros = rendreCentimes / 200;\n        int reste = rendreCentimes % 200;\n        int pieces1Euro = reste / 100;\n        reste = reste % 100;\n        int pieces50 = reste / 50;\n        reste = reste % 50;\n        int pieces20 = reste / 20;\n        reste = reste % 20;\n        int pieces10 = reste / 10;\n        reste = reste % 10;\n\n        Console.WriteLine(\"2 € : \" + pieces2Euros + \" | 1 € : \" + pieces1Euro\n                          + \" | 50 c : \" + pieces50 + \" | 20 c : \" + pieces20\n                          + \" | 10 c : \" + pieces10);\n        Console.WriteLine(\"Reste non rendable : \" + reste + \" centime(s)\");\n\n        Console.WriteLine();\n\n        // Combien de pâtes pour la commande, sachant qu'un pot en fait 12 ?\n        int patesParPot = 12;\n        int potsNecessaires = (nbCrepes + patesParPot - 1) / patesParPot;\n        Console.WriteLine(\"Pots de pâte à préparer : \" + potsNecessaires);\n\n        // Le stock, et ce qu'il reste après cette commande.\n        int patesRestantes = 120;\n        patesRestantes -= nbCrepes;\n        Console.WriteLine(\"Pâtes restantes : \" + patesRestantes);\n\n        // Les conditions de service, combinées.\n        int heure = 17;\n        bool stockSuffisant = patesRestantes >= 10;\n        bool dansLesHoraires = heure >= 14 && heure <= 19;\n        bool serviceOuvert = stockSuffisant && dansLesHoraires;\n        Console.WriteLine(\"Service ouvert : \" + serviceOuvert);\n        Console.WriteLine(\"Service fermé (écrit morceau par morceau) : \"\n                          + (!stockSuffisant || !dansLesHoraires));\n\n        Console.WriteLine();\n        Console.WriteLine(\"Plus grosse commande de la journée : \" + Math.Max(nbCrepes, 7));\n        Console.WriteLine(\"Écart avec l'objectif de 15 crêpes : \" + Math.Abs(nbCrepes - 15));\n    }\n}",
