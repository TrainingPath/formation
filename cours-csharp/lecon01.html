  title: "Premier programme C#",
  subtitle: "Le langage de Microsoft et .NET : rigueur du typage, confort moderne.",
  theory: `
<h3>1. C#, c'est quoi ?</h3>
<p>C# (« C sharp ») est un langage <strong>compilé</strong>, <strong>fortement typé</strong> et <strong>orienté objet</strong>, créé par Microsoft en 2000. Il tourne sur la plateforme <strong>.NET</strong> et sert à tout : applications Windows, jeux (Unity), sites web (ASP.NET), API… Cousin très proche de Java : si tu connais l'un, tu lis l'autre.</p>
<p><strong>Compilé</strong> veut dire qu'avant d'être exécuté, ton code source (<code>.cs</code>) est <strong>traduit</strong> par un compilateur en un format que la machine sait exécuter. En C#, ce n'est pas directement du langage machine mais un format intermédiaire (l'<em>IL</em>, Intermediate Language) que le moteur .NET exécute. Conséquence importante : si ton code contient une faute de grammaire, le compilateur <strong>refuse</strong> de produire le programme — rien ne s'exécute tant que tout n'est pas correct. C'est plus strict que PHP (interprété), mais ça attrape les erreurs très tôt.</p>
<p><strong>Fortement typé</strong> signifie que chaque donnée a un type déclaré (nombre entier, texte…) et que le compilateur vérifie que tu respectes ces types. <strong>Orienté objet</strong> : le code s'organise en classes (on y reviendra à la leçon 12).</p>
<p>Outils : le <strong>SDK .NET</strong> (gratuit) + Visual Studio ou VS Code. En ligne de commande : <code>dotnet new console</code> crée un projet, puis <code>dotnet run</code> le compile ET le lance.</p>

<h3>2. Le programme minimal (style classique), ligne par ligne</h3>
<pre class="pseudo">using System;                          // importe l'espace de noms System (donne accès à Console, etc.)
                                       // ligne vide : ignorée, elle sert juste à aérer le code
class Program                          // déclare une classe nommée Program : tout code C# vit dans une classe
{                                      // accolade ouvrante : début du corps de la classe
    static void Main(string[] args)    // Main = point d'ENTRÉE, la 1re méthode exécutée (M majuscule !)
    {                                  // accolade ouvrante : début du corps de la méthode Main
        Console.WriteLine("Bonjour le monde !"); // affiche le texte + un saut de ligne, puis ; termine l'instruction
    }                                  // accolade fermante : fin de Main
}                                      // accolade fermante : fin de la classe Program</pre>
<p>Décortiquons les rôles : <code>using System;</code> évite d'écrire <code>System.Console.WriteLine</code> à chaque fois (c'est l'équivalent d'un <code>import</code> en Java). <code>class Program</code> est le conteneur obligatoire du code. <code>static void Main(string[] args)</code> est la porte d'entrée : quand tu lances le programme, .NET cherche EXACTEMENT cette méthode et commence par elle ; <code>string[] args</code> permet de recevoir des arguments passés en ligne de commande. Chaque <strong>instruction</strong> se termine par un <code>;</code> et chaque <strong>bloc</strong> est délimité par des accolades <code>{ }</code>.</p>

<h3>3. Le style moderne (top-level statements, .NET 6+)</h3>
<pre class="pseudo">// Program.cs peut se réduire à cette seule ligne :
Console.WriteLine("Bonjour le monde !");   // la classe Program et la méthode Main sont générées AUTOMATIQUEMENT
// Plus besoin d'écrire soi-même class/Main : le compilateur les ajoute pour toi.</pre>
<p>Les deux styles produisent le même résultat. Le style classique montre bien la structure (utile pour comprendre) ; le style moderne va à l'essentiel. Ce cours utilise souvent le style court dans les exemples, mais tu dois savoir lire les deux.</p>

<h3>4. WriteLine, Write et commentaires</h3>
<pre class="pseudo">Console.WriteLine("A");   // affiche A PUIS passe à la ligne suivante (Line = saut de ligne)
Console.Write("B");       // affiche B mais NE saute PAS de ligne : le curseur reste juste après
// ceci est un commentaire d'une ligne : tout ce qui suit // est ignoré par le compilateur
/* ceci est un commentaire
   sur plusieurs lignes : tout ce qui est entre les deux marqueurs est ignoré */</pre>
<p>Un <strong>commentaire</strong> n'est jamais exécuté : il sert à toi (et aux autres) pour expliquer le code. Différence WriteLine/Write à bien retenir : <code>WriteLine</code> termine par un retour à la ligne, <code>Write</code> non — deux <code>Write</code> à la suite collent donc leurs textes sur la même ligne.</p>

<h3>5. La table de traduction (à compléter tout le cours)</h3>
<pre class="pseudo">PSEUDOCODE            C#
Écrire(x)             Console.WriteLine(x);   // afficher une valeur suivie d'un saut de ligne
DEBUT...FIN           { ... }  (dans Main)    // les blocs se délimitent avec des accolades
commentaire //        //                       // même symbole de commentaire qu'en pseudocode</pre>
<div class="warn">C# est sensible à la casse : <code>Console</code> et <code>Main</code> avec majuscule, <code>WriteLine</code> avec deux majuscules internes. <code>console.writeline</code> ne compile pas. Comme Java, l'oubli du <code>;</code> est l'erreur n°1.</div>
<div class="tip">Java vs C# : Console.WriteLine ↔ System.out.println, mais 90 % du reste est identique. Ce cours signalera les DIFFÉRENCES ; tout le reste, tu le sais déjà si tu as fait Java.</div>`,

    { type: "qcm", q: "Par quoi se termine chaque instruction C# ?", opts: ["Un point", "Un point-virgule ;", "Un deux-points :", "Une accolade"], a: 1, exp: "Comme Java et PHP." },
    { type: "qcm", q: "Différence entre WriteLine et Write ?", opts: ["Write ajoute un saut de ligne, WriteLine non", "WriteLine ajoute un saut de ligne, Write non", "Write est plus rapide", "WriteLine affiche deux fois"], a: 1, exp: "Line = saut de ligne inclus." },
    { type: "qcm", q: "Le style « top-level statements » (.NET 6+) permet…", opts: ["De coder sans classe ni Main visibles (générés automatiquement)", "D'aller plus vite à l'exécution", "De supprimer les types", "De ne pas compiler"], a: 0, exp: "Console.WriteLine(...) seul suffit dans Program.cs." },
    { type: "qcm", q: "<code>console.writeline(\"X\");</code> ne compile pas car…", opts: ["La méthode s'appelle Print, pas writeline", "C# est sensible à la casse : Console.WriteLine avec les bonnes majuscules", "Il manque un using", "writeline est privé"], a: 1, exp: "Casse exacte obligatoire." },
    { type: "qcm", q: "Qu'affiche <code>Console.Write(\"A\"); Console.Write(\"B\");</code> ?", opts: ["A et B sur 2 lignes", "AB sur la même ligne", "A puis B séparés par un espace", "Une erreur de compilation"], a: 1, exp: "Write ne saute pas de ligne." },
    { type: "qcm", q: "Comment compiler et lancer avec le SDK ?", opts: ["javac puis java", "dotnet run", "php Program.cs", "run Program"], a: 1, exp: "dotnet run compile et exécute d'un coup." },
    { type: "qcm", q: "Commentaire d'une ligne en C# :", opts: ["# commentaire", "// commentaire", "<!-- -->", "** **"], a: 1, exp: "// comme Java, PHP et notre pseudocode." },
    { type: "qcm", q: "Une erreur de COMPILATION signifie…", opts: ["Le programme a planté en route", "Le code viole la grammaire : le compilateur refuse de produire l'exécutable", "L'ordinateur est lent", "Le SDK est absent"], a: 1, exp: "Rien ne s'exécute tant que la syntaxe n'est pas correcte." },
    { type: "qcm", q: "Où vit tout le code C# (style classique) ?", opts: ["Dans une fonction en dehors de toute classe", "Dans une classe", "Dans un fichier .txt", "Dans Main uniquement"], a: 1, exp: "Comme Java : tout est dans une classe." },
    { type: "vf", q: "C# et Java se ressemblent énormément en syntaxe.", a: true, exp: "Cousins proches : Console.WriteLine ≈ System.out.println, le reste quasi identique." },
    { type: "qcm", q: "Qu'affiche ce code ?<pre class=\"pseudo\">Console.WriteLine(\"1\");\n// Console.WriteLine(\"2\");\nConsole.WriteLine(\"3\");</pre>", opts: ["1 2 3", "1 3 : la ligne 2 est commentée", "1 2", "Erreur"], a: 1, exp: "Un commentaire n'est jamais exécuté." },
    { type: "qcm", q: "Quel fichier contient le programme par convention ?", opts: ["index.php", "Program.cs (.cs = C sharp)", "Main.java", "app.html"], a: 1, exp: "Extension .cs pour les sources C#." }
  ],
  final: {
    title: "Exercice final — Ta carte de visite (version C#)",
    intro: `<p>Un programme plein d'erreurs à corriger (style classique) :</p>
<pre class="pseudo">using system;

class Program
{
    static void main(string[] args)
    {
        console.WriteLine("Aryaa")

    questions: [
      { type: "qcm", q: "Erreur n°1 — <code>using system;</code> :", opts: ["Correct", "System avec S majuscule : using System;", "Il faut import", "Il faut using System.Console"], a: 1, exp: "Casse : les espaces de noms .NET sont en PascalCase." },
      { type: "qcm", q: "Erreur n°2 — <code>main</code> :", opts: ["Correct", "Main avec M majuscule : le point d'entrée exact recherché par .NET", "Il faut MAIN", "Il faut Main()"], a: 1, exp: "Différence avec Java (main minuscule) : C# veut Main." },
      { type: "qcm", q: "Erreur n°3 — <code>console.WriteLine(\"Aryaa\")</code> contient DEUX fautes :", opts: ["console → Console, et il manque le ; final", "Aryaa invalide", "WriteLine → Write", "Il manque une classe"], a: 0, exp: "Majuscule à Console + point-virgule : le duo classique." },
      { type: "qcm", q: "Une fois corrigé, « Bachelier… » et « Toujours vérifier… » sont sur la même ligne. Pourquoi ?", opts: ["Bug .NET", "La 2ᵉ ligne utilise Write (sans saut) au lieu de WriteLine", "Les chaînes fusionnent", "Normal en C#"], a: 1, exp: "Write vs WriteLine : pour 3 lignes distinctes, WriteLine partout." },
      { type: "qcm", q: "Quelle commande compile et lance le programme corrigé ?", opts: ["java Program", "dotnet run", "csc puis run", "compile Program.cs"], a: 1, exp: "dotnet run fait tout." }
    ],
    solution: `<pre class="pseudo">using System;

class Program
{
    static void Main(string[] args)
    {
        Console.WriteLine("Aryaa");
        Console.WriteLine("Bachelier en informatique");
        Console.WriteLine("Toujours vérifier les cas limites !");
    }
}
// Terminal : dotnet run</pre>
<p>Cinq corrections : casse de System, casse de Main, casse de Console, point-virgule, Write→WriteLine. Si tu as fait Java, tu as reconnu 90 % du terrain. Demain : les variables et types C#.</p>`
  }
