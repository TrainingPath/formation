<h3>1. C#, c'est quoi ?</h3>
<p>C# (« C sharp ») est un langage <strong>compilé</strong>, <strong>fortement typé</strong> et <strong>orienté objet</strong>, créé par Microsoft en 2000. Il tourne sur la plateforme <strong>.NET</strong> et sert à tout : applications Windows, jeux (Unity), sites web (ASP.NET), API… Cousin très proche de Java : si tu connais l'un, tu lis l'autre.</p>
<p><strong>Compilé</strong> veut dire qu'avant d'être exécuté, ton code source (<code>.cs</code>) est <strong>traduit</strong> par un compilateur en un format que la machine sait exécuter. En C#, ce n'est pas directement du langage machine mais un format intermédiaire (l'<em>IL</em>, Intermediate Language) que le moteur .NET exécute. Conséquence importante : si ton code contient une faute de grammaire, le compilateur <strong>refuse</strong> de produire le programme — rien ne s'exécute tant que tout n'est pas correct. C'est plus strict que PHP (interprété), mais ça attrape les erreurs très tôt.</p>
<p><strong>Fortement typé</strong> signifie que chaque donnée a un type déclaré (nombre entier, texte…) et que le compilateur vérifie que tu respectes ces types. <strong>Orienté objet</strong> : le code s'organise en classes (on y reviendra à la leçon 12).</p>
<p>Outils : le <strong>SDK .NET</strong> (gratuit) + Visual Studio ou VS Code. En ligne de commande : <code>dotnet new console</code> crée un projet, puis <code>dotnet run</code> le compile ET le lance.</p>

<h3>2. Le programme minimal (style classique), ligne par ligne</h3>
<pre class="pseudo">using System;                          // importe l'espace de noms System (donne accès à Console, etc.)
                                       // ligne vide : ignorée, elle sert juste à aérer le code
class Program                          // déclare une classe nommée Program : tout code C# vit dans une classe
{                                      // accolade ouvrante : début du corps de la classe
    static void Main(string[] args)    // Main = point d'ENTRÉE, la 1re méthode exécutée (M majuscule !)
    {                                  // accolade ouvrante : début du corps de la méthode Main
        Console.WriteLine("Bonjour le monde !"); // affiche le texte + un saut de ligne, puis ; termine l'instruction
    }                                  // accolade fermante : fin de Main
}                                      // accolade fermante : fin de la classe Program</pre>
<p>Décortiquons les rôles : <code>using System;</code> évite d'écrire <code>System.Console.WriteLine</code> à chaque fois (c'est l'équivalent d'un <code>import</code> en Java). <code>class Program</code> est le conteneur obligatoire du code. <code>static void Main(string[] args)</code> est la porte d'entrée : quand tu lances le programme, .NET cherche EXACTEMENT cette méthode et commence par elle ; <code>string[] args</code> permet de recevoir des arguments passés en ligne de commande. Chaque <strong>instruction</strong> se termine par un <code>;</code> et chaque <strong>bloc</strong> est délimité par des accolades <code>{ }</code>.</p>

<h3>3. Le style moderne (top-level statements, .NET 6+)</h3>
<pre class="pseudo">// Program.cs peut se réduire à cette seule ligne :
Console.WriteLine("Bonjour le monde !");   // la classe Program et la méthode Main sont générées AUTOMATIQUEMENT
// Plus besoin d'écrire soi-même class/Main : le compilateur les ajoute pour toi.</pre>
<p>Les deux styles produisent le même résultat. Le style classique montre bien la structure (utile pour comprendre) ; le style moderne va à l'essentiel. Ce cours utilise souvent le style court dans les exemples, mais tu dois savoir lire les deux.</p>

<h3>4. WriteLine, Write et commentaires</h3>
<pre class="pseudo">Console.WriteLine("A");   // affiche A PUIS passe à la ligne suivante (Line = saut de ligne)
Console.Write("B");       // affiche B mais NE saute PAS de ligne : le curseur reste juste après
// ceci est un commentaire d'une ligne : tout ce qui suit // est ignoré par le compilateur
/* ceci est un commentaire
   sur plusieurs lignes : tout ce qui est entre les deux marqueurs est ignoré */</pre>
<p>Un <strong>commentaire</strong> n'est jamais exécuté : il sert à toi (et aux autres) pour expliquer le code. Différence WriteLine/Write à bien retenir : <code>WriteLine</code> termine par un retour à la ligne, <code>Write</code> non — deux <code>Write</code> à la suite collent donc leurs textes sur la même ligne.</p>

<h3>5. La table de traduction (à compléter tout le cours)</h3>
<pre class="pseudo">PSEUDOCODE            C#
Écrire(x)             Console.WriteLine(x);   // afficher une valeur suivie d'un saut de ligne
DEBUT...FIN           { ... }  (dans Main)    // les blocs se délimitent avec des accolades
commentaire //        //                       // même symbole de commentaire qu'en pseudocode</pre>
