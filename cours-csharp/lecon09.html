<script>
var DAY = {
  num: 9,
  title: "La classe string",
  subtitle: "Le jour 19 d'algorithmique, avec les méthodes .NET.",
  theory: `
<h3>1. Une chaîne, c'est une suite de caractères indexés</h3>
<p>Une <code>string</code> se comporte un peu comme un tableau de caractères : chaque caractère a un <strong>indice</strong> (à partir de 0), et on accède à un caractère par les crochets.</p>
<pre class="pseudo">string mot = "BONJOUR";     // une chaîne de 7 caractères
indices :      0123456       // chaque lettre a un numéro, de 0 à 6
mot.Length     → 7          // Length = nombre de caractères (propriété, comme pour les tableaux, sans parenthèses)
mot[0]         → 'B'        // les crochets donnent LE caractère à cet indice (renvoie un char, apostrophes simples)</pre>

<h3>2. L'arsenal des méthodes de string (PascalCase)</h3>
<pre class="pseudo">PSEUDOCODE (jour 19)     C#
LONGUEUR(mot)            mot.Length          // nombre de caractères
mot[i]                   mot[i]              // le caractère à l'indice i
a &amp; b                    a + b               // + concatène (colle) deux chaînes
MAJUSCULE                mot.ToUpper()       // renvoie une copie tout en majuscules
MINUSCULE                mot.ToLower()       // renvoie une copie tout en minuscules</pre>
<pre class="pseudo">mot.Contains("jou")       → true            // le texte contient-il « jou » ?
mot.StartsWith("BON")     → true            // commence-t-il par « BON » ?
mot.EndsWith("OUR")       → true            // finit-il par « OUR » ?
mot.IndexOf('O')          → 1               // position de la 1re occurrence de 'O' (−1 si absent)
mot.Substring(3)          → "JOUR"          // sous-chaîne À PARTIR de l'indice 3 jusqu'à la fin
mot.Substring(0, 3)       → "BON"           // sous-chaîne : indice de départ 0, LONGUEUR 3
mot.Trim()                → sans espaces     // enlève les espaces au début et à la fin
mot.Replace("O", "0")     → "B0NJ0UR"       // remplace toutes les occurrences de "O" par "0"
mot.Split('-')            → tableau          // découpe la chaîne sur le séparateur → un string[]
string.Join(", ", tab)    → "a, b, c"       // opération inverse : recolle un tableau avec un séparateur</pre>
<p>Attention à <code>Substring(0, 3)</code> en C# : le second argument est une <strong>longueur</strong> (comme en PHP), pas un indice de fin comme en Java. « BON » = 3 caractères à partir de 0.</p>

<h3>3. string IMMUABLE (le piège n°1)</h3>
<pre class="pseudo">string s = "chat";
s.ToUpper();              // renvoie "CHAT" mais NE modifie PAS s : le résultat est jeté !
Console.WriteLine(s);     // affiche « chat » (inchangé)
s = s.ToUpper();          // il faut RÉAFFECTER le résultat à s
Console.WriteLine(s);     // affiche « CHAT »</pre>
<div class="warn">Comme Java (et PHP) : une string est <strong>immuable</strong>, aucune méthode ne la modifie ; toutes RENVOIENT une nouvelle chaîne. Oublier la réaffectation (<code>s = s.ToUpper();</code>) est LE bug classique : on croit avoir transformé la chaîne alors qu'on a jeté le résultat.</div>

<h3>4. == compare le contenu (rappel leçon 5)</h3>
<pre class="pseudo">if (mot == "BONJOUR")        // en C#, == compare le CONTENU des chaînes (les caractères)
if (mot.Equals("BONJOUR"))   // .Equals fait la même comparaison
// un char se compare aussi avec == : mot[i] == 'A'  (guillemets simples pour un caractère)</pre>

<h3>5. Parcourir une chaîne caractère par caractère</h3>
<pre class="pseudo">int nb = 0;                              // compteur de 'A'
for (int i = 0; i &lt; mot.Length; i++)     // on parcourt chaque indice, de 0 à Length-1
{
    if (mot[i] == 'A') { nb++; }         // si le caractère courant est 'A', on incrémente
}</pre>
<p>C'est le motif du compteur (leçon 6) appliqué aux caractères : parfait pour compter des voyelles, des espaces, etc.</p>

<h3>6. Palindrome (comparer les extrémités : indice i et son miroir)</h3>
<pre class="pseudo">bool estPalindrome = true;                       // hypothèse de départ : oui
int n = mot.Length;                              // longueur totale
for (int i = 0; i &lt; n / 2; i++)                  // on compare seulement la 1re moitié à la 2e
{
    if (mot[i] != mot[n - 1 - i]) { estPalindrome = false; }  // n-1-i = le caractère MIROIR (depuis la fin)
}</pre>
<p>L'indice miroir <code>n - 1 - i</code> est la clé : quand <code>i</code> vaut 0, on compare le premier caractère au dernier ; quand <code>i</code> vaut 1, le deuxième à l'avant-dernier, etc. Dès qu'une paire diffère, ce n'est plus un palindrome.</p>
<div class="tip">Bonus C# : <code>StringBuilder</code> pour construire de longues chaînes dans une boucle (bien plus efficace que <code>+=</code> répété, qui recrée une string à chaque fois), et l'interpolation <code>$"..."</code> (leçon 4) pour l'affichage.</div>`,
  exercises: [
    { type: "input", q: "Que vaut <code>\"algorithme\".Length</code> ?", a: "10", ph: "nombre", exp: "10 caractères — Length, propriété comme les tableaux." },
    { type: "qcm", q: "Le premier caractère de mot :", opts: ["mot.charAt(0)", "mot[0] : crochets, renvoie un char", "mot.First()", "mot.GetChar(0)"], a: 1, exp: "C# utilise les crochets (comme PHP), pas charAt (Java)." },
    { type: "input", q: "Que vaut <code>\"PYTHON\"[2]</code> ?", a: ["T", "t"], ph: "caractère", exp: "P(0) Y(1) T(2) : T." },
    { type: "qcm", q: "Le dernier caractère :", opts: ["mot[mot.Length]", "mot[mot.Length - 1] (ou mot[^1] en C#)", "mot.Last()", "mot[mot.Count - 1]"], a: 1, exp: "Length−1 ; C# offre aussi l'index ^1 depuis la fin." },
    { type: "qcm", q: "string s = \"chat\"; s.ToUpper(); afficher s → ?", opts: ["CHAT", "chat : string immuable, sans réaffectation rien ne change", "Chat", "Une erreur : ToUpper est introuvable"], a: 1, exp: "Il fallait s = s.ToUpper();" },
    { type: "input", q: "Que vaut <code>\"bonjour\".Substring(0, 3)</code> ?", a: ["bon"], ph: "texte", exp: "Indice 0, LONGUEUR 3 : bon (comme PHP, ≠ Java où c'est un indice de fin)." },
    { type: "input", q: "Que vaut <code>\"bonjour\".IndexOf('j')</code> ?", a: "3", ph: "nombre", exp: "Position 3 (ou -1 si absent)." },
    { type: "qcm", q: "Comparer deux string en C# :", opts: ["Seulement .Equals", "s1 == s2 OU s1.Equals(s2) : == compare le contenu (avantage sur Java)", "s1 = s2 avec un seul signe égal", "s1.compareTo(s2) comme en Java"], a: 1, exp: "Un piège Java en moins : == fonctionne sur les string C#." },
    { type: "qcm", q: "Comparer deux char c1, c2 :", opts: ["c1.Equals seulement", "c1 == c2 : les char sont des primitifs", "c1.Compare(c2) uniquement", "Comparer deux char est impossible en C#"], a: 1, exp: "== sur les char, comme partout." },
    { type: "input", q: "Combien de 'S' dans \"MISSISSIPPI\" (boucle) ?", a: "4", ph: "nombre", exp: "Le comptage du jour 19." },
    { type: "qcm", q: "<code>\"a-b-c\".Split('-')</code> retourne…", opts: ["\"abc\"", "Un tableau : {\"a\", \"b\", \"c\"}", "Le nombre de morceaux, soit 3", "Seulement le premier morceau, a"], a: 1, exp: "Split découpe en tableau (comme explode PHP)." },
    { type: "input", q: "Que vaut <code>\"ROMA\"</code> parcourue à l'envers (Length-1 à 0) et concaténée ?", a: ["AMOR", "amor"], ph: "texte", exp: "Le miroir du jour 19." },
    { type: "qcm", q: "Dans le palindrome C#, le miroir de i est…", opts: ["n - i", "n - 1 - i : décalage 0-indexé (comme Java)", "i + 1", "n / 2"], a: 1, exp: "Pseudocode 1..n : n-i+1. C#/Java 0..n-1 : n-1-i." },
    { type: "qcm", q: "Pour construire une longue chaîne en boucle efficacement, C# offre…", opts: ["La concaténation += répétée en boucle", "StringBuilder : évite de recréer la chaîne à chaque tour", "Un tableau de char rempli case par case", "La méthode Split appliquée en boucle"], a: 1, exp: "Détail de performance : les string immuables coûtent en boucle." },
    { type: "input", q: "Que vaut <code>\"BON\" + \"JOUR\"</code> ?", a: ["BONJOUR", "bonjour"], ph: "texte", exp: "Concaténation avec + (comme Java)." }
  ],
  final: {
    title: "Exercice final — L'analyseur de pseudo (version C#)",
    intro: `<p>Le final du jour 19, cinquième traduction :</p>
<pre class="pseudo">string pseudo = "LAVAL";
int n = pseudo.Length;
bool lgOK = (n >= 3 && n <= 12);
bool espace = pseudo.Contains(" ");
string miroir = "";
for (int i = n - 1; i >= 0; i--)
{
    miroir += pseudo[i];
}
if (lgOK && !espace)
{
    Console.WriteLine($"OK ! Miroir : {miroir}");
}</pre>`,
    questions: [
      { type: "qcm", q: "Que vaut <code>lgOK</code> pour \"LAVAL\" ?", opts: ["true : 5 dans [3..12]", "false"], a: 0, exp: "L'encadrement && du jour 8." },
      { type: "qcm", q: "<code>pseudo.Contains(\" \")</code> remplace quel motif du jour 19 ?", opts: ["L'accumulateur d'une somme", "Le DRAPEAU de recherche d'espace, en une méthode", "Le tri des caractères de la chaîne", "Le calcul de la longueur de la chaîne"], a: 1, exp: "Les bibliothèques encapsulent tes motifs." },
      { type: "qcm", q: "La boucle du miroir va de n-1 à 0 : pourquoi ?", opts: ["Par simple préférence de style d'écriture", "Parcours À L'ENVERS en 0-indexé : dernier = n-1, premier = 0", "Pour contourner un bug propre au C#", "Parce que n-1 désigne le milieu de la chaîne"], a: 1, exp: "Le POUR i DE n A 1 PAS -1 du jour 19, décalé." },
      { type: "input", q: "Que vaut <code>miroir</code> ?", a: ["LAVAL", "laval"], ph: "texte", exp: "LAVAL à l'envers = LAVAL : palindrome !" },
      { type: "qcm", q: "<code>miroir += pseudo[i];</code> : quel motif ?", opts: ["Un compteur incrémenté à chaque tour", "L'ACCUMULATEUR de chaîne (init \"\", l'élément neutre du jour 19)", "Un drapeau booléen de détection", "Le motif du champion (le maximum)"], a: 1, exp: "somme→0, produit→1, chaîne→\"\" : le réflexe des neutres." }
    ],
    solution: `<pre class="pseudo">n = 5 → lgOK = true
espace = "LAVAL".Contains(" ") → false
miroir : i=4 'L' → 'A' → 'V' → 'A' → 'L' → "LAVAL"
!espace = true → OK ! Miroir : LAVAL

Encadrement, drapeau (Contains), accumulateur de chaîne,
parcours inverse : quatre motifs du mois d'algo en C#.</pre>
<p>Cinquième analyseur de pseudo. Demain : List&lt;T&gt;, l'ArrayList de C#.</p>`
  }
};

    solution: "using System;                                    // accès à Console\n\nclass Voyelles                                   // déclaration de la classe\n{                                                // début de la classe\n    static void Main()                           // point d'entrée du programme\n    {                                            // début de Main\n        Console.Write(\"Phrase ? \");              // invite\n        string phrase = Console.ReadLine().ToLower(); // lit la ligne et met tout en minuscules\n        int compteur = 0;                        // compteur de voyelles\n        foreach (char c in phrase)               // une string se parcourt caractère par caractère\n        {                                        // début du bloc\n            if (\"aeiouy\".Contains(c))            // le caractère figure-t-il dans la liste des voyelles ?\n                compteur++;                      // oui → on compte\n        }                                        // fin du parcours\n        Console.WriteLine($\"Voyelles : {compteur}\"); // affiche le total\n    }                                            // fin de Main\n}                                                // fin de la classe",
