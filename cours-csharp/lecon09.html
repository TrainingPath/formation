  subtitle: "Le jour 19 d'algorithmique, avec les méthodes .NET.",
  theory: `
<h3>1. Une chaîne, c'est une suite de caractères indexés</h3>
<p>Une <code>string</code> se comporte un peu comme un tableau de caractères : chaque caractère a un <strong>indice</strong> (à partir de 0), et on accède à un caractère par les crochets.</p>
<pre class="pseudo">string mot = "BONJOUR";     // une chaîne de 7 caractères
indices :      0123456       // chaque lettre a un numéro, de 0 à 6
mot.Length     → 7          // Length = nombre de caractères (propriété, comme pour les tableaux, sans parenthèses)
mot[0]         → 'B'        // les crochets donnent LE caractère à cet indice (renvoie un char, apostrophes simples)</pre>

<h3>2. L'arsenal des méthodes de string (PascalCase)</h3>
<pre class="pseudo">PSEUDOCODE (jour 19)     C#
LONGUEUR(mot)            mot.Length          // nombre de caractères
mot[i]                   mot[i]              // le caractère à l'indice i
a &amp; b                    a + b               // + concatène (colle) deux chaînes
MAJUSCULE                mot.ToUpper()       // renvoie une copie tout en majuscules
MINUSCULE                mot.ToLower()       // renvoie une copie tout en minuscules</pre>
<pre class="pseudo">mot.Contains("jou")       → true            // le texte contient-il « jou » ?
mot.StartsWith("BON")     → true            // commence-t-il par « BON » ?
mot.EndsWith("OUR")       → true            // finit-il par « OUR » ?
mot.IndexOf('O')          → 1               // position de la 1re occurrence de 'O' (−1 si absent)
mot.Substring(3)          → "JOUR"          // sous-chaîne À PARTIR de l'indice 3 jusqu'à la fin
mot.Substring(0, 3)       → "BON"           // sous-chaîne : indice de départ 0, LONGUEUR 3
mot.Trim()                → sans espaces     // enlève les espaces au début et à la fin
mot.Replace("O", "0")     → "B0NJ0UR"       // remplace toutes les occurrences de "O" par "0"
mot.Split('-')            → tableau          // découpe la chaîne sur le séparateur → un string[]
string.Join(", ", tab)    → "a, b, c"       // opération inverse : recolle un tableau avec un séparateur</pre>
<p>Attention à <code>Substring(0, 3)</code> en C# : le second argument est une <strong>longueur</strong> (comme en PHP), pas un indice de fin comme en Java. « BON » = 3 caractères à partir de 0.</p>

<h3>3. string IMMUABLE (le piège n°1)</h3>
<pre class="pseudo">string s = "chat";
s.ToUpper();              // renvoie "CHAT" mais NE modifie PAS s : le résultat est jeté !
Console.WriteLine(s);     // affiche « chat » (inchangé)
s = s.ToUpper();          // il faut RÉAFFECTER le résultat à s
Console.WriteLine(s);     // affiche « CHAT »</pre>
<div class="warn">Comme Java (et PHP) : une string est <strong>immuable</strong>, aucune méthode ne la modifie ; toutes RENVOIENT une nouvelle chaîne. Oublier la réaffectation (<code>s = s.ToUpper();</code>) est LE bug classique : on croit avoir transformé la chaîne alors qu'on a jeté le résultat.</div>

<h3>4. == compare le contenu (rappel leçon 5)</h3>
<pre class="pseudo">if (mot == "BONJOUR")        // en C#, == compare le CONTENU des chaînes (les caractères)
if (mot.Equals("BONJOUR"))   // .Equals fait la même comparaison
// un char se compare aussi avec == : mot[i] == 'A'  (guillemets simples pour un caractère)</pre>

<h3>5. Parcourir une chaîne caractère par caractère</h3>
<pre class="pseudo">int nb = 0;                              // compteur de 'A'
for (int i = 0; i &lt; mot.Length; i++)     // on parcourt chaque indice, de 0 à Length-1
{
    if (mot[i] == 'A') { nb++; }         // si le caractère courant est 'A', on incrémente
}</pre>
<p>C'est le motif du compteur (leçon 6) appliqué aux caractères : parfait pour compter des voyelles, des espaces, etc.</p>

<h3>6. Palindrome (comparer les extrémités : indice i et son miroir)</h3>
<pre class="pseudo">bool estPalindrome = true;                       // hypothèse de départ : oui
int n = mot.Length;                              // longueur totale
for (int i = 0; i &lt; n / 2; i++)                  // on compare seulement la 1re moitié à la 2e
{
    if (mot[i] != mot[n - 1 - i]) { estPalindrome = false; }  // n-1-i = le caractère MIROIR (depuis la fin)
}</pre>
<p>L'indice miroir <code>n - 1 - i</code> est la clé : quand <code>i</code> vaut 0, on compare le premier caractère au dernier ; quand <code>i</code> vaut 1, le deuxième à l'avant-dernier, etc. Dès qu'une paire diffère, ce n'est plus un palindrome.</p>
<div class="tip">Bonus C# : <code>StringBuilder</code> pour construire de longues chaînes dans une boucle (bien plus efficace que <code>+=</code> répété, qui recrée une string à chaque fois), et l'interpolation <code>$"..."</code> (leçon 4) pour l'affichage.</div>`,

        Console.WriteLine($\"Champs : {champs.Length}\");\n        Console.WriteLine($\"Article : {champs[1]} — {champs[2]} {champs[3]}\");\n        Console.WriteLine($\"Reconstitué : {string.Join(\" / \", champs)}\");\n    }\n\n    // Un contrôle par caractéristique, dans l'ordre du plus grossier au plus fin.\n    static string Diagnostiquer(string code)\n    {\n        if (code == \"\")\n        {\n            return \"code vide\";\n        }\n        if (code.Length != 9)\n        {\n            return $\"longueur {code.Length} au lieu de 9\";\n        }\n        if (code[2] != '-' || code[7] != '-')\n        {\n            return \"tirets mal placés\";\n        }\n        if (!EstLettre(code[0]) || !EstLettre(code[1]))\n        {\n            return \"les deux premiers caractères ne sont pas des lettres\";\n        }\n        for (int i = 3; i <= 6; i++)\n        {\n            if (!EstChiffre(code[i]))\n            {\n                return $\"caractère {i} : chiffre attendu\";\n            }\n        }\n        if (!EstLettre(code[8]))\n        {\n            return \"le dernier caractère n'est pas une lettre\";\n        }\n        return \"\";\n    }\n\n    static bool EstLettre(char c) => c >= 'A' && c <= 'Z';\n\n    static bool EstChiffre(char c) => c >= '0' && c <= '9';\n}",

      "solution": "// Le club de Scrabble — jour 1 sur 4 : nettoyer et compter les mots.\n// Aujourd'hui, un mot est un texte, et rien d'autre. Cela suffira à décider\n// s'il est jouable et combien il rapporte.\nusing System;\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n        const int LongueurMax = 7;\n\n        string[] propositions = {\n            \"  Zébu \",\n            \"kayak\",\n            \"TRAIN\",\n            \"anticonstitutionnel\",\n            \"ré-ussi\",\n            \"\",\n            \"Otto\"\n        };\n\n        Console.WriteLine(\"CLUB DE SCRABBLE — contrôle des mots\");\n        Console.WriteLine();\n\n        int jouables = 0;\n        int pointsTotal = 0;\n        string meilleurMot = \"\";\n        int meilleurScore = -1;\n\n        for (int i = 0; i < propositions.Length; i++)\n        {\n            string brut = propositions[i];\n            string mot = brut.Trim().ToLower();\n\n            string refus = Refus(mot, LongueurMax);\n            if (refus != \"\")\n            {\n                Console.WriteLine($\"  ✗ [{brut}] → {refus}\");\n                continue;\n            }\n\n            int score = Score(mot);\n            jouables++;\n            pointsTotal += score;\n\n            if (score > meilleurScore)\n            {\n                meilleurScore = score;\n                meilleurMot = mot;\n            }\n\n            string marque = EstPalindrome(mot) ? \" (palindrome !)\" : \"\";\n            Console.WriteLine($\"  ✓ {mot.ToUpper()} — {mot.Length} lettres, \"\n                              + $\"{score} point(s){marque}\");\n        }\n\n        Console.WriteLine();\n        Console.WriteLine($\"Mots jouables : {jouables} sur {propositions.Length}\");\n        Console.WriteLine($\"Points cumulés : {pointsTotal}\");\n\n        if (jouables > 0)\n        {\n            Console.WriteLine($\"Meilleur mot : {meilleurMot.ToUpper()} \"\n                              + $\"avec {meilleurScore} point(s)\");\n            Console.WriteLine($\"Moyenne par mot jouable : {pointsTotal / jouables} point(s)\");\n        }\n        else\n        {\n            Console.WriteLine(\"Aucun mot jouable : pas de meilleur mot.\");\n        }\n\n        Console.WriteLine();\n\n        // La grille du jour, annoncée sous forme d'une seule ligne à découper.\n        string tirage = \"R;A;T;E;L;I;S\";\n        string[] lettres = tirage.Split(';');\n        Console.WriteLine($\"Tirage : {string.Join(\" \", lettres)} ({lettres.Length} lettres)\");\n        Console.WriteLine($\"Premier jeton : {lettres[0]} — dernier : \"\n                          + $\"{lettres[lettres.Length - 1]}\");\n    }\n\n    // Un refus par règle, du plus grossier au plus fin ; texte vide = accepté.\n    static string Refus(string mot, int longueurMax)\n    {\n        if (mot == \"\")\n        {\n            return \"mot vide\";\n        }\n        if (mot.Length > longueurMax)\n        {\n            return $\"{mot.Length} lettres : plus long que le chevalet\";\n        }\n        for (int i = 0; i < mot.Length; i++)\n        {\n            if (!EstLettreMinuscule(mot[i]))\n            {\n                return $\"caractère interdit : « {mot[i]} »\";\n            }\n        }\n        return \"\";\n    }\n\n    // Le barème simplifié du club : les lettres rares valent plus cher.\n    static int Score(string mot)\n    {\n        int total = 0;\n        for (int i = 0; i < mot.Length; i++)\n        {\n            total += ValeurLettre(mot[i]);\n        }\n        return total;\n    }\n\n    static int ValeurLettre(char c)\n    {\n        if (c == 'k' || c == 'w' || c == 'x' || c == 'y' || c == 'z')\n        {\n            return 10;\n        }\n        if (c == 'b' || c == 'c' || c == 'f' || c == 'h' || c == 'j'\n            || c == 'p' || c == 'v')\n        {\n            return 3;\n        }\n        return 1;\n    }\n\n    static bool EstLettreMinuscule(char c) => c >= 'a' && c <= 'z';\n\n    static bool EstPalindrome(string mot)\n    {\n        int n = mot.Length;\n        for (int i = 0; i < n / 2; i++)\n        {\n            if (mot[i] != mot[n - 1 - i])\n            {\n                return false;\n            }\n        }\n        return true;\n    }\n}",
