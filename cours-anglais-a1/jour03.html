<script>
var DAY = {
  num: 3,
  title: "Les pronoms personnels",
  subtitle: "I, you, he, she, it, we, they : les mots qui remplacent les personnes.",
  theory: `
<h3>1. Qu'est-ce qu'un pronom personnel ?</h3>
<p>Un <strong>pronom personnel</strong> est un petit mot qui remplace une personne ou une chose pour ne pas la répéter. Au lieu de dire « Paul mange, Paul boit », on dit « Paul mange, <strong>il</strong> boit ». En anglais, ces pronoms sont indispensables : on ne peut presque jamais faire de phrase sans eux.</p>
<h3>2. Les sept pronoms sujets</h3>
<p>On les appelle <strong>pronoms sujets</strong> parce qu'ils sont le sujet du verbe (celui qui fait l'action). Voici les sept, à connaître par cœur :</p>
<pre class="pseudo">I      → je            // toujours une majuscule
you    → tu / vous     // le même mot pour tu ET vous !
he     → il (un homme, un garçon)
she    → elle (une femme, une fille)
it     → il / elle (une chose, un animal, une idée)
we     → nous
they   → ils / elles   // le même mot au masculin et au féminin</pre>
<h3>3. Le cas de « you »</h3>
<p>En français, on distingue « tu » (une personne, familier) et « vous » (plusieurs personnes ou politesse). En anglais, un seul mot : <strong>you</strong>. Il sert pour une personne comme pour un groupe, familier ou poli.</p>
<div class="tip">Plus besoin de te demander si tu dois vouvoyer ! En anglais, « you » va partout : à un ami, à un professeur, à une foule.</div>
<h3>4. Le mystérieux « it »</h3>
<p><strong>It</strong> remplace une chose, un animal ou une idée, quel que soit le « genre » qu'on lui donnerait en français. En français, une table est « elle », un livre est « il ». En anglais, les deux sont <strong>it</strong>.</p>
<pre class="pseudo">The book is here. → It is here.   // le livre → it (pas he ni she)
The cat is black. → It is black.  // le chat → it (un animal)
The table is big. → It is big.    // la table → it</pre>
<div class="warn">Erreur fréquente : dire « he » ou « she » pour un objet. Un objet, c'est <strong>it</strong>. On garde he/she pour les personnes (et parfois les animaux familiers).</div>
<h3>5. He, she ou they ?</h3>
<p><strong>He</strong> pour un homme/garçon, <strong>she</strong> pour une femme/fille, et <strong>they</strong> pour un groupe (plusieurs personnes ou choses), sans distinction de genre.</p>
<pre class="pseudo">Tom → he        // un garçon
Anna → she      // une fille
Tom and Anna → they   // deux personnes ensemble
The dogs → they // plusieurs animaux ou choses</pre>`,
  exercises: [
    { type: "qcm", q: "Quel pronom remplace « une femme » ?", opts: ["he", "she", "it", "they"], a: 1, exp: "she = elle, pour une femme ou une fille." },
    { type: "input", q: "Complète : Tom is here. ___ is my friend. (pronom pour Tom)", a: ["he"], ph: "un pronom", exp: "Tom → he (il), un garçon." },
    { type: "qcm", q: "Comment dit-on à la fois « tu » et « vous » en anglais ?", opts: ["we", "you", "they", "it"], a: 1, exp: "you sert pour tu ET vous, une personne ou plusieurs." },
    { type: "input", q: "Complète : The book is red. ___ is on the table. (pronom pour « le livre »)", a: ["it"], ph: "un pronom", exp: "Un objet → it." },
    { type: "vf", q: "On utilise « he » ou « she » pour parler d'un objet comme une table.", a: false, exp: "Faux : un objet, c'est it. He/she sont pour les personnes." },
    { type: "qcm", q: "Quel pronom signifie « nous » ?", opts: ["they", "we", "you", "he"], a: 1, exp: "we = nous." },
    { type: "input", q: "Complète : Anna is nice. ___ is my sister. (pronom pour Anna)", a: ["she"], ph: "un pronom", exp: "Anna → she (elle)." },
    { type: "qcm", q: "« Tom and Anna » se remplace par quel pronom ?", opts: ["he", "she", "we", "they"], a: 3, exp: "Deux personnes ensemble → they." },
    { type: "vf", q: "Le pronom « they » peut désigner des hommes comme des femmes.", a: true, exp: "Oui, they = ils OU elles, sans distinction de genre." },
    { type: "input", q: "Complète : The cat is small. ___ is white. (pronom pour « le chat »)", a: ["it"], ph: "un pronom", exp: "Un animal/une chose → it." },
    { type: "qcm", q: "Lequel de ces pronoms s'écrit toujours avec une majuscule ?", opts: ["you", "he", "I", "we"], a: 2, exp: "I (je) prend toujours une majuscule." },
    { type: "qcm", q: "Quel pronom pour parler d'un garçon nommé Ben ?", opts: ["she", "he", "it", "they"], a: 1, exp: "Ben → he (il)." },
    { type: "input", q: "Complète : Paul and I are friends. ___ are happy. (pronom pour « Paul et moi »)", a: ["we"], ph: "un pronom", exp: "Paul et moi → we (nous)." },
    { type: "vf", q: "En anglais, il faut choisir entre « tu » et « vous » comme en français.", a: false, exp: "Faux : un seul mot, you, pour les deux." },
    { type: "qcm", q: "Quel pronom remplace « les enfants » (the children) ?", opts: ["it", "he", "they", "we"], a: 2, exp: "Un groupe → they." }
  ],
  final: {
    title: "Exercice final — Choisir le bon pronom",
    intro: `<p>Pour chaque personne ou chose, il faut trouver le pronom qui la remplace. Rappelle-toi : personnes = he / she / they, choses et animaux = it, groupe incluant « moi » = we.</p>`,
    questions: [
      { type: "input", q: "Remplace « Sarah » par un pronom.", a: ["she"], ph: "un pronom", exp: "Sarah → she." },
      { type: "input", q: "Remplace « the car » (la voiture) par un pronom.", a: ["it"], ph: "un pronom", exp: "Un objet → it." },
      { type: "qcm", q: "Remplace « my brother » (mon frère) par un pronom.", opts: ["she", "he", "it", "they"], a: 1, exp: "Un homme → he." },
      { type: "input", q: "Remplace « you and I » (toi et moi) par un pronom.", a: ["we"], ph: "un pronom", exp: "Toi et moi → we (nous)." },
      { type: "qcm", q: "Remplace « the students » (les élèves) par un pronom.", opts: ["it", "he", "she", "they"], a: 3, exp: "Un groupe → they." }
    ],
    solution: `<p>Le tableau des sept pronoms sujets, à savoir par cœur :</p>
<pre class="pseudo">I    → je              we   → nous
you  → tu / vous       they → ils / elles
he   → il (homme)
she  → elle (femme)
it   → il/elle (chose, animal)</pre>
<p>Astuce mémoire : une chose ou un animal, c'est toujours <strong>it</strong> ; « you » remplace à la fois tu et vous ; et « they » sert pour tout groupe. Ces pronoms reviendront à chaque leçon avec le verbe to be dès demain.</p>`
  }
};
</script>
