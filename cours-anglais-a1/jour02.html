var DAY = {
  num: 2,
  title: "Se présenter : I am, my name is",
  subtitle: "Dire son nom, saluer, et retenir la fameuse contraction I'm.",
  theory: `
<h3>1. Dire « je suis »</h3>
<p>Pour te présenter, tu utilises le mot <strong>I</strong> (qui veut dire « je ») suivi de <strong>am</strong> (« suis »). <em>I</em> s'écrit toujours avec une majuscule, où qu'il soit dans la phrase. C'est une règle absolue de l'anglais.</p>
<pre class="pseudo">I am Sarah.        → « Je suis Sarah. »        // I = je, am = suis
I am a student.    → « Je suis étudiant. »     // on peut ajouter un mot après
I am French.       → « Je suis français. »     // nationalité (majuscule à French)</pre>
<div class="warn">Le pronom « je » se dit <strong>I</strong> et prend TOUJOURS une majuscule, même au milieu d'une phrase : « Yes, I am happy. » Ne l'écris jamais « i ».</div>
<h3>2. La contraction I'm</h3>
<p>À l'oral et à l'écrit courant, on colle souvent <em>I</em> et <em>am</em> ensemble : cela donne <strong>I'm</strong>. Le petit signe ' s'appelle une <strong>apostrophe</strong> ; il remplace la lettre « a » de am. C'est une <strong>contraction</strong> (deux mots réduits en un). Le sens ne change pas.</p>
<pre class="pseudo">I am Sarah.  =  I'm Sarah.       // même sens, I'm est juste plus court
I am happy.  =  I'm happy.       // « Je suis content. »</pre>
<div class="tip">On dit « I'm » (« aïm ») dans presque toute conversation. « I am » sépare, on l'utilise pour insister : « I AM sure ! » (Je suis sûr !).</div>
<h3>3. Dire « je m'appelle »</h3>
<p>Autre façon très courante de se présenter : <strong>My name is…</strong>, qui signifie mot à mot « Mon nom est… ». <em>My</em> = mon/ma, <em>name</em> = nom, <em>is</em> = est.</p>
<pre class="pseudo">My name is Paul.   → « Je m'appelle Paul. »   // mot à mot : mon nom est Paul
What is your name? → « Comment t'appelles-tu ? » // mot à mot : quel est ton nom ?
My name's Paul.    → contraction de name is    // name's = name is</pre>
<h3>4. Saluer</h3>
<p>Quelques mots de politesse pour accompagner ta présentation :</p>
<pre class="pseudo">Hello!          → Bonjour !            // partout, tout le temps
Hi!             → Salut !              // plus familier
Good morning    → Bonjour (le matin)  // jusqu'à midi
Good afternoon  → Bonjour (l'après-midi)
Good evening    → Bonsoir
Nice to meet you → Enchanté(e)         // quand on rencontre quelqu'un</pre>
<h3>5. Une petite présentation complète</h3>
<p>En rassemblant tout, voici ce que tu peux déjà dire :</p>
<pre class="pseudo">Hello! I'm Emma. Nice to meet you!
→ Bonjour ! Je suis Emma. Enchantée !</pre>
<div class="tip">Réponds à « Nice to meet you » par « Nice to meet you, too » (Enchanté aussi). <em>Too</em> veut dire « aussi ».</div>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « je » en anglais ?", opts: ["me", "I", "my", "am"], a: 1, exp: "« je » = I, toujours avec une majuscule." },
    { type: "input", q: "Complète : ___ am Sarah. (mot pour « je »)", a: ["i"], ph: "un mot", exp: "I am Sarah. Le pronom « je » se dit I (majuscule)." },
    { type: "qcm", q: "Que remplace l'apostrophe dans <strong>I'm</strong> ?", opts: ["le I", "la lettre a de am", "un espace", "rien"], a: 1, exp: "I'm = I am : l'apostrophe remplace le « a » de am." },
    { type: "vf", q: "« I'm happy » et « I am happy » ont le même sens.", a: true, exp: "Oui, I'm est simplement la contraction de I am." },
    { type: "input", q: "Écris la contraction de « I am » (un seul mot avec apostrophe).", a: ["i'm", "im"], ph: "un mot", exp: "I am → I'm." },
    { type: "qcm", q: "« My name is Paul » signifie…", opts: ["Mon ami Paul", "Je m'appelle Paul", "J'aime Paul", "Paul est là"], a: 1, exp: "My name is Paul = mot à mot « mon nom est Paul » = je m'appelle Paul." },
    { type: "input", q: "Complète : My ___ is Emma. (mot pour « nom »)", a: ["name"], ph: "un mot", exp: "My name is Emma. Name = nom." },
    { type: "qcm", q: "Comment demande-t-on « Comment t'appelles-tu ? »", opts: ["Who are you?", "What is your name?", "How you name?", "Where is name?"], a: 1, exp: "What is your name? = quel est ton nom ?" },
    { type: "vf", q: "Le pronom « I » peut s'écrire en minuscule au milieu d'une phrase.", a: false, exp: "Faux : I s'écrit TOUJOURS avec une majuscule." },
    { type: "qcm", q: "Que dit-on le matin pour saluer ?", opts: ["Good evening", "Good morning", "Good night", "Goodbye"], a: 1, exp: "Good morning = bonjour (le matin)." },
    { type: "input", q: "Complète la présentation : Hello! ___ Emma. (contraction de « I am »)", a: ["i'm", "im"], ph: "un mot", exp: "Hello! I'm Emma." },
    { type: "qcm", q: "« Nice to meet you » veut dire…", opts: ["Au revoir", "Merci beaucoup", "Enchanté(e)", "S'il te plaît"], a: 2, exp: "Nice to meet you = enchanté(e), quand on rencontre quelqu'un." },
    { type: "vf", q: "« Hi » est une façon plus familière de dire bonjour que « Hello ».", a: true, exp: "Oui, Hi = salut, plus familier que Hello." },
    { type: "input", q: "Complète : Nice to meet you, ___ . (mot signifiant « aussi »)", a: ["too"], ph: "un mot", exp: "Nice to meet you, too = enchanté aussi." },
    { type: "qcm", q: "Quelle phrase est correcte pour se présenter ?", opts: ["I am name Paul", "Me is Paul", "My name is Paul", "I Paul am"], a: 2, exp: "My name is Paul est la bonne structure." }
  ],
  final: {
    title: "Exercice final — Une première présentation",
    intro: `<p>Un personnage, Léo, rencontre quelqu'un. Complète et comprends sa présentation en t'appuyant sur ce que tu as appris.</p>
<pre class="pseudo">Léo : « Hello! I'm Léo. What is your name? »
Ana : « Hi! My name is Ana. Nice to meet you. »
Léo : « Nice to meet you, too! »</pre>`,
    questions: [
      { type: "qcm", q: "Que veut dire « What is your name? »", opts: ["Comment vas-tu ?", "Quel est ton nom ?", "Où es-tu ?", "Qui est là ?"], a: 1, exp: "What is your name? = quel est ton nom ?" },
      { type: "input", q: "Réécris « I am Léo » en contraction (un mot + Léo).", a: ["i'm léo", "im léo", "i'm leo", "im leo"], ph: "deux mots", exp: "I am Léo → I'm Léo." },
      { type: "vf", q: "Ana répond à sa présentation en disant « My name is Ana ».", a: true, exp: "Oui : c'est une façon correcte de donner son nom." },
      { type: "qcm", q: "Comment répond-on à « Nice to meet you » ?", opts: ["Nice to meet you, too", "Good morning", "My name is", "I am name"], a: 0, exp: "On répond « Nice to meet you, too » (enchanté aussi)." },
      { type: "input", q: "Complète : My ___ is Ana. (mot pour « nom »)", a: ["name"], ph: "un mot", exp: "My name is Ana." }
    ],
    solution: `<p>La présentation complète et traduite :</p>
<pre class="pseudo">Hello! I'm Léo.        → Bonjour ! Je suis Léo.
What is your name?     → Quel est ton nom ?
My name is Ana.        → Je m'appelle Ana.
Nice to meet you.      → Enchanté(e).
Nice to meet you, too! → Enchanté(e) aussi !</pre>
<p>Avec seulement ces phrases, tu peux déjà engager une conversation. Retiens surtout : <strong>I</strong> prend une majuscule, et <strong>I'm</strong> = I am.</p>`
  }
};
