<title>Jour 30</title><link rel="stylesheet" href="style.css"></head><body>
<script>
var DAY = {
  num: 30,
  title: "Bilan A1 : se présenter et échanger",
  subtitle: "Mettre en pratique tout le niveau A1 dans une conversation.",
  theory: `
<h3>1. Se presenter : l'essentiel</h3>
<pre class="pseudo">Hello! My name is Sam.        Bonjour ! Je m'appelle Sam.
I am from Canada.             Je viens du Canada.
I am twenty years old.        J'ai vingt ans.
I live in Toronto.            Je vis a Toronto.
I am a student.              Je suis etudiant.</pre>
<h3>2. Poser des questions a quelqu'un</h3>
<pre class="pseudo">What's your name?            Comment t'appelles-tu ?
Where are you from?          D'ou viens-tu ?
How old are you?             Quel age as-tu ?
What do you do?              Que fais-tu (dans la vie) ?
Do you have brothers or sisters?  As-tu des freres ou des soeurs ?
What do you like?            Qu'est-ce que tu aimes ?</pre>
<div class="tip">Reponses courtes utiles : <em>Yes, I do. / No, I don't. / Yes, I am. / No, I'm not. / Yes, I can.</em></div>
<h3>3. Parler de ses gouts et capacites</h3>
<pre class="pseudo">I like music and I love football.   J'aime la musique et j'adore le foot.
I don't like coffee.                Je n'aime pas le cafe.
I can play the piano.               Je sais jouer du piano.
I can't swim.                      Je ne sais pas nager.</pre>
<h3>4. Parler de sa journee et du passe</h3>
<pre class="pseudo">Every day I get up at seven.        Chaque jour je me leve a sept heures.
Right now I am studying English.    En ce moment j'apprends l'anglais.
Yesterday I was at home.            Hier j'etais a la maison.</pre>
<h3>5. Un echange complet (modele)</h3>
<pre class="pseudo">- Hello! What's your name?          Bonjour ! Comment t'appelles-tu ?
- My name is Lea. And you?          Je m'appelle Lea. Et toi ?
- I'm Max. Where are you from?      Moi c'est Max. D'ou viens-tu ?
- I'm from France. I live in Lyon.  Je viens de France. Je vis a Lyon.
- What do you do?                   Que fais-tu dans la vie ?
- I'm a nurse. I like my job.       Je suis infirmiere. J'aime mon travail.</pre>
<div class="warn">Pour reussir un echange A1 : salue, presente-toi (nom, origine, age, travail), pose des questions en retour, et sois poli (please, thank you). Tu connais maintenant tous les outils pour le faire !</div>`,
  exercises: [
    { type: "qcm", q: "Quelle question demande le nom ?", opts: ["How old are you?", "What's your name?", "Where are you from?", "What do you do?"], a: 1, exp: "What's your name? = Comment t'appelles-tu ?" },
    { type: "input", q: "Complete : « Where are you ___? » (D'ou viens-tu ?)", a: ["from"], ph: "un mot", exp: "Where are you from? = D'ou viens-tu ?" },
    { type: "qcm", q: "Que demande « How old are you? » ?", opts: ["le nom", "l'age", "l'origine", "le metier"], a: 1, exp: "How old are you? = Quel age as-tu ?" },
    { type: "input", q: "Complete : « My name ___ Sam. » (verbe be)", a: ["is", "'s"], ph: "verbe be", exp: "My name is Sam." },
    { type: "vf", q: "« I am from Canada » veut dire « Je viens du Canada ».", a: true, exp: "I am from + pays = origine." },
    { type: "qcm", q: "Quelle question demande le metier ?", opts: ["What do you do?", "What's your name?", "How old are you?", "Do you like tea?"], a: 0, exp: "What do you do? = Que fais-tu dans la vie ?" },
    { type: "input", q: "Complete : « I ___ play the piano. » (Je sais jouer)", a: ["can"], ph: "modal", exp: "I can play = je sais jouer." },
    { type: "qcm", q: "Reponse courte a « Do you have brothers? » (oui) :", opts: ["Yes, I am.", "Yes, I do.", "Yes, I can.", "Yes, I have brother."], a: 1, exp: "Yes, I do. (present simple)." },
    { type: "input", q: "Complete : « I ___ in Toronto. » (Je vis)", a: ["live"], ph: "un verbe", exp: "I live in Toronto = Je vis a Toronto." },
    { type: "vf", q: "« I'm a nurse » est une facon de dire son metier.", a: true, exp: "I'm a + metier : I'm a nurse (infirmiere)." },
    { type: "qcm", q: "Choisis le present continu : « Right now I ___ English. »", opts: ["study", "studies", "am studying", "studied"], a: 2, exp: "right now -> present continu : I am studying." },
    { type: "input", q: "Complete au passe : « Yesterday I ___ at home. » (was/were)", a: ["was"], ph: "was / were", exp: "I -> was : Yesterday I was at home." },
    { type: "qcm", q: "Comment dire poliment merci ?", opts: ["Sorry", "Thank you", "Excuse me", "Please sit"], a: 1, exp: "Thank you = merci." },
    { type: "vf", q: "« I can't swim » veut dire « je ne sais pas nager ».", a: true, exp: "can't = ne pas savoir / pouvoir." },
    { type: "input", q: "Complete : « I ___ music but I don't like coffee. » (aimer)", a: ["like"], ph: "un verbe", exp: "I like music = j'aime la musique." }
  ],
  final: {
    title: "Exercice final — Une rencontre",
    intro: `<p>Lis cet echange entre deux personnes, puis reponds :</p>
<pre class="pseudo">Anna: Hello! What's your name?
Leo: Hi! My name is Leo. What's yours?
Anna: I'm Anna. Where are you from, Leo?
Leo: I'm from Spain, but I live in London now. I'm a teacher.
Anna: Nice! Can you speak Spanish?
Leo: Yes, I can. And I can speak English too. Do you like London?
Anna: Yes, I do. I love it!</pre>`,
    questions: [
      { type: "input", q: "Comment s'appelle l'homme ? (prenom en anglais)", a: ["leo"], ph: "un prenom", exp: "My name is Leo." },
      { type: "qcm", q: "D'ou vient Leo ?", opts: ["from London", "from Spain", "from France", "from Italy"], a: 1, exp: "I'm from Spain." },
      { type: "qcm", q: "Quel est le metier de Leo ?", opts: ["a doctor", "a student", "a teacher", "a nurse"], a: 2, exp: "I'm a teacher." },
      { type: "vf", q: "Leo sait parler espagnol ET anglais.", a: true, exp: "Yes, I can. And I can speak English too." },
      { type: "input", q: "Anna aime-t-elle Londres ? Reponds par la reponse courte : « Yes, I ___. »", a: ["do"], ph: "reponse courte", exp: "Do you like London? -> Yes, I do." }
    ],
    solution: `<p>Anna et Leo se rencontrent et echangent : ils se demandent leur nom (<em>What's your name?</em>), leur origine (<em>Where are you from? -> I'm from Spain</em>), parlent du metier (<em>I'm a teacher</em>), des capacites (<em>Can you speak Spanish? -> Yes, I can</em>) et des gouts (<em>Do you like London? -> Yes, I do</em>).</p>
<p>Felicitations : tu as termine le niveau A1 ! Tu sais te presenter, poser des questions, parler de tes gouts, de ta routine et du passe. Continue a pratiquer chaque jour, c'est la repetition qui ancre les automatismes.</p>`
  }
};
</script>
