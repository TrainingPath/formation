<script>
var DAY = {
  num: 10,
  title: "Décrire : couleurs et adjectifs",
  subtitle: "Les couleurs, les adjectifs courants, et la place de l'adjectif avant le nom.",
  theory: `
<h3>1. Qu'est-ce qu'un adjectif ?</h3>
<p>Un <strong>adjectif</strong> est un mot qui décrit un nom : sa couleur, sa taille, sa qualité. « grand », « rouge », « joli » sont des adjectifs. Aujourd'hui tu apprends à décrire les choses et les gens.</p>
<h3>2. Les couleurs (colours)</h3>
<pre class="pseudo">red     → rouge      blue   → bleu       green → vert
yellow  → jaune      black  → noir       white → blanc
orange  → orange     pink   → rose       brown → marron
grey    → gris       purple → violet</pre>
<h3>3. Des adjectifs très courants</h3>
<pre class="pseudo">big    → grand       small → petit      tall  → grand (taille)
long   → long        short → court/petit  new  → neuf/nouveau
old    → vieux       nice  → gentil/joli   happy → content
sad    → triste      hot   → chaud        cold → froid</pre>
<h3>4. La règle d'or : l'adjectif AVANT le nom</h3>
<p>En français, on dit souvent l'adjectif APRÈS le nom : « une voiture <em>rouge</em> ». En anglais, c'est l'INVERSE : l'adjectif se place TOUJOURS <strong>avant</strong> le nom.</p>
<pre class="pseudo">a red car      → une voiture rouge    // red AVANT car
a big house    → une grande maison    // big AVANT house
a nice day     → une belle journée
black shoes    → des chaussures noires</pre>
<div class="warn">Erreur franco-anglaise classique : dire « a car red ». C'est INCORRECT. En anglais : « a red car ». L'adjectif passe toujours devant le nom.</div>
<h3>5. L'adjectif ne s'accorde jamais</h3>
<p>Autre bonne nouvelle : l'adjectif anglais ne change JAMAIS. Ni au féminin, ni au pluriel. « red » reste « red » partout.</p>
<pre class="pseudo">a red car   → une voiture rouge
red cars    → des voitures rouges     // red, pas « reds »
a big dog / big dogs → red et big ne prennent jamais de -s</pre>
<div class="tip">Retiens : « two black cats », jamais « two blacks cats ». L'adjectif est invariable.</div>
<h3>6. Décrire avec to be</h3>
<p>On peut aussi mettre l'adjectif après le verbe to be (vu au jour 4) :</p>
<pre class="pseudo">The car is red.    → La voiture est rouge.
The dogs are big.  → Les chiens sont grands.
She is happy.      → Elle est contente.</pre>`,
  exercises: [
    { type: "input", q: "Comment dit-on « rouge » en anglais ?", a: ["red"], ph: "un mot", exp: "rouge = red." },
    { type: "qcm", q: "Comment dit-on « une voiture rouge » ?", opts: ["a car red", "a red car", "a car of red", "red a car"], a: 1, exp: "L'adjectif AVANT le nom : a red car." },
    { type: "input", q: "Comment dit-on « bleu » ?", a: ["blue"], ph: "un mot", exp: "bleu = blue." },
    { type: "vf", q: "En anglais, l'adjectif se place avant le nom.", a: true, exp: "Oui : a big house, a red car." },
    { type: "qcm", q: "Comment dit-on « une grande maison » ?", opts: ["a house big", "a big house", "a house of big", "big a house"], a: 1, exp: "a big house : adjectif avant le nom." },
    { type: "input", q: "Comment dit-on « noir » ?", a: ["black"], ph: "un mot", exp: "noir = black." },
    { type: "vf", q: "L'adjectif « red » prend un -s quand le nom est au pluriel (reds cars).", a: false, exp: "Faux : l'adjectif est invariable. On dit « red cars »." },
    { type: "qcm", q: "Que signifie « small » ?", opts: ["grand", "petit", "vieux", "chaud"], a: 1, exp: "small = petit." },
    { type: "input", q: "Réordonne : « cats / black / two » → écris la bonne phrase (3 mots).", a: ["two black cats"], ph: "trois mots", exp: "two black cats : nombre + adjectif + nom." },
    { type: "qcm", q: "Que signifie « happy » ?", opts: ["triste", "content", "fatigué", "froid"], a: 1, exp: "happy = content/heureux." },
    { type: "input", q: "Complète : The car ___ red. (verbe to be)", a: ["is", "'s"], ph: "un mot", exp: "The car is red." },
    { type: "qcm", q: "Comment dit-on « des chaussures noires » ?", opts: ["shoes black", "blacks shoes", "black shoes", "shoes of black"], a: 2, exp: "black shoes : adjectif avant, invariable." },
    { type: "input", q: "Comment dit-on « blanc » ?", a: ["white"], ph: "un mot", exp: "blanc = white." },
    { type: "vf", q: "« The dogs are big » est une phrase correcte pour décrire des chiens.", a: true, exp: "Oui : l'adjectif big peut aussi suivre le verbe to be." },
    { type: "qcm", q: "Que signifie « old » ?", opts: ["neuf", "vieux", "grand", "petit"], a: 1, exp: "old = vieux (ou âgé)." }
  ],
  final: {
    title: "Exercice final — Décrire des objets",
    intro: `<p>Lis ce petit texte, puis réponds.</p>
<pre class="pseudo">I have got a big dog. It is black and white.
My sister has got a small cat. The cat is grey.
We love our pets.</pre>
<p><em>Traduction : J'ai un grand chien. Il est noir et blanc. Ma soeur a un petit chat. Le chat est gris. Nous aimons nos animaux.</em></p>`,
    questions: [
      { type: "qcm", q: "De quelles couleurs est le chien ?", opts: ["grey", "black and white", "brown", "red"], a: 1, exp: "« It is black and white »." },
      { type: "input", q: "Réordonne : « dog / big / a » → écris la bonne phrase (3 mots).", a: ["a big dog"], ph: "trois mots", exp: "a big dog : adjectif avant le nom." },
      { type: "vf", q: "Le chat de sa soeur est petit (small).", a: true, exp: "« a small cat »." },
      { type: "qcm", q: "Comment dit-on « une voiture blanche » ?", opts: ["a car white", "a white car", "a whites car", "white a car"], a: 1, exp: "a white car : adjectif avant." },
      { type: "input", q: "Complète : The cat ___ grey. (verbe to be)", a: ["is", "'s"], ph: "un mot", exp: "The cat is grey." }
    ],
    solution: `<p>Les deux règles à ne jamais oublier :</p>
<pre class="pseudo">1. L'adjectif se place AVANT le nom :  a red car (pas « a car red »)
2. L'adjectif est INVARIABLE :          red cars (pas « reds cars »)</pre>
<p>On peut aussi placer l'adjectif après to be : « The car is red ». Avec les couleurs et une dizaine d'adjectifs courants, tu peux déjà décrire presque tout ce qui t'entoure.</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {

  { id: "en-a1-j10", title: "Décris trois objets", level: 1,
    statement: "Écris 3 phrases pour décrire des objets avec une couleur ou un adjectif. Place bien l'adjectif AVANT le nom. Exemple : I have a red bike.",
    hints: [
      "Structure : article + adjectif + nom (a big house).",
      "Tu peux utiliser une couleur (red, blue, green...).",
      "N'ajoute jamais de -s à l'adjectif."
    ],
    solution: "I have got a blue bag.\nThis is a big house.\nMy shoes are black.\n\nTraduction :\nJ'ai un sac bleu.\nVoici une grande maison.\nMes chaussures sont noires.",
    note: "Verifie que chaque adjectif est bien AVANT le nom et sans -s. On dit « black shoes », pas « shoes black » ni « blacks shoes »." }
  ]
};
</script>
