<script>
var DAY = {
  num: 27,
  title: "Le passé de to be : was / were",
  subtitle: "Parler du passe avec le verbe etre : was et were.",
  theory: `
<h3>1. Le passe de be</h3>
<p>Au passe, le verbe <strong>be</strong> (etre) a seulement DEUX formes : <strong>was</strong> et <strong>were</strong>.</p>
<pre class="pseudo">I        was      I was at home.       J'etais a la maison.
He/She/It was      She was happy.       Elle etait contente.
You      were     You were late.       Tu etais en retard.
We       were     We were tired.       Nous etions fatigues.
They     were     They were here.      Ils etaient ici.</pre>
<div class="tip">Regle simple : <strong>I / he / she / it -> was</strong> ; <strong>you / we / they -> were</strong>.</div>
<h3>2. La forme negative</h3>
<pre class="pseudo">I was not tired.      = I wasn't tired.     Je n'etais pas fatigue.
They were not here.   = They weren't here.  Ils n'etaient pas ici.</pre>
<h3>3. La question</h3>
<p>On met <strong>was</strong> ou <strong>were</strong> devant le sujet.</p>
<pre class="pseudo">Were you at school?      Etais-tu a l'ecole ?
Yes, I was.              Oui.
No, I wasn't.           Non.
Was she happy?           Etait-elle contente ?
Yes, she was.            Oui.</pre>
<h3>4. Les mots du passe</h3>
<pre class="pseudo">yesterday       hier
last night      hier soir
last week       la semaine derniere
last year       l'annee derniere
two days ago    il y a deux jours</pre>
<div class="warn">Ne confonds pas avec le present : <em>I am</em> (je suis, maintenant) devient <em>I was</em> (j'etais, hier). <em>They are</em> devient <em>They were</em>.</div>
<h3>5. Raconter au passe</h3>
<pre class="pseudo">Yesterday I was at home. My friends were at the park.
Hier j'etais a la maison. Mes amis etaient au parc.
The weather was nice and we were happy.
Le temps etait beau et nous etions contents.</pre>`,
  exercises: [
    { type: "qcm", q: "Choisis : « I ___ at home yesterday. »", opts: ["was", "were", "am", "is"], a: 0, exp: "I -> was." },
    { type: "input", q: "Complete : « They ___ at the park. » (passe)", a: ["were"], ph: "was / were", exp: "They -> were." },
    { type: "qcm", q: "Quelle forme pour « she » au passe de be ?", opts: ["were", "was", "are", "be"], a: 1, exp: "she -> was." },
    { type: "input", q: "Complete : « You ___ late. » (Tu etais en retard.)", a: ["were"], ph: "was / were", exp: "you -> were." },
    { type: "vf", q: "« We were tired » signifie « Nous etions fatigues ».", a: true, exp: "we -> were : nous etions." },
    { type: "qcm", q: "Quelle est la forme negative de « She was happy » ?", opts: ["She weren't happy.", "She wasn't happy.", "She not was happy.", "She don't happy."], a: 1, exp: "was + not = wasn't : She wasn't happy." },
    { type: "input", q: "Complete la contraction : « They ___ here. » (n'etaient pas)", a: ["weren't", "were not"], ph: "were not", exp: "were not = weren't." },
    { type: "qcm", q: "Comment poser : « Etais-tu a l'ecole ? »", opts: ["You were at school?", "Was you at school?", "Were you at school?", "Did you at school?"], a: 2, exp: "you -> were : Were you at school?" },
    { type: "input", q: "Complete la reponse courte : « Was she happy? — Yes, she ___. »", a: ["was"], ph: "was / were", exp: "Yes, she was." },
    { type: "vf", q: "« yesterday » signifie « demain ».", a: false, exp: "Faux : yesterday = hier ; tomorrow = demain." },
    { type: "qcm", q: "Le present « They are » devient au passe…", opts: ["They was", "They were", "They is", "They be"], a: 1, exp: "they are -> they were." },
    { type: "input", q: "Complete : « I ___ tired last night. » (je n'etais pas — contraction)", a: ["wasn't", "was not"], ph: "was not", exp: "was not = wasn't." },
    { type: "qcm", q: "Traduis « il y a deux jours ».", opts: ["two days ago", "last two days", "in two days", "two days later"], a: 0, exp: "two days ago = il y a deux jours." },
    { type: "vf", q: "Pour « we » et « they » on utilise « were ».", a: true, exp: "you / we / they -> were." },
    { type: "input", q: "Complete : « The weather ___ nice yesterday. » (il/it -> ?)", a: ["was"], ph: "was / were", exp: "it -> was : The weather was nice." }
  ],
  final: {
    title: "Exercice final — Le week-end de Paul",
    intro: `<p>Lis le texte au passe, puis reponds :</p>
<pre class="pseudo">Last weekend was great. On Saturday I was at the beach with my family.
The weather was sunny and warm. My parents were happy.
My little sister wasn't with us; she was at my grandmother's house.
On Sunday we were tired, so we were at home all day.</pre>`,
    questions: [
      { type: "qcm", q: "Ou etait Paul samedi ?", opts: ["at home", "at the beach", "at school", "at the park"], a: 1, exp: "On Saturday I was at the beach." },
      { type: "input", q: "Complete : « The weather ___ sunny. » (was/were)", a: ["was"], ph: "was / were", exp: "The weather was sunny." },
      { type: "vf", q: "La petite soeur de Paul etait avec eux a la plage.", a: false, exp: "My little sister wasn't with us." },
      { type: "qcm", q: "Ou etait sa soeur ?", opts: ["at the beach", "at school", "at her grandmother's house", "at the park"], a: 2, exp: "she was at my grandmother's house." },
      { type: "input", q: "Complete : « On Sunday we ___ tired. » (was/were)", a: ["were"], ph: "was / were", exp: "we -> were : we were tired." }
    ],
    solution: `<p>Samedi, Paul etait a la plage avec sa famille (<em>I was at the beach</em>), le temps etait ensoleille (<em>The weather was sunny</em>) et ses parents etaient contents (<em>were happy</em>). Sa petite soeur n'etait pas la (<em>wasn't with us</em>), elle etait chez sa grand-mere. Dimanche, ils etaient fatigues et sont restes a la maison (<em>we were tired / at home</em>).</p>
<p>Regle cle : <strong>I / he / she / it -> was</strong> ; <strong>you / we / they -> were</strong> ; negations wasn't / weren't.</p>`
  }
};
</script>
