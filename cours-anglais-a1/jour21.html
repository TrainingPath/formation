<!DOCTYPE html><html lang="fr"><head>

<title>Jour 21</title><link rel="stylesheet" href="style.css"></head><body>
<script>
var DAY = {
  num: 21,
  title: "Les prépositions de lieu",
  subtitle: "Situer un objet : in, on, under, next to...",
  theory: `
<h3>1. Les prepositions de base</h3>
<p>Les prepositions de lieu disent OU se trouve quelque chose.</p>
<pre class="pseudo">in        dans        The cat is in the box.       Le chat est dans la boite.
on        sur         The book is on the table.    Le livre est sur la table.
under     sous        The ball is under the chair. La balle est sous la chaise.
next to   a cote de   The lamp is next to the bed. La lampe est a cote du lit.</pre>
<h3>2. D'autres prepositions utiles</h3>
<pre class="pseudo">behind        derriere        The car is behind the house.
in front of   devant          The tree is in front of the door.
between       entre           The bank is between the shop and the cafe.
near          pres de         The school is near the park.
above         au-dessus de    The clock is above the door.</pre>
<h3>3. In, on, at pour les lieux</h3>
<p>Trois petites prepositions demandent de l'attention :</p>
<pre class="pseudo">in   + grand lieu / interieur   in London, in the room
on   + surface / rue           on the wall, on Oxford Street
at   + point precis            at the door, at home, at the bus stop</pre>
<div class="warn">On dit <strong>at home</strong> (a la maison) et <strong>at school</strong> (a l'ecole), sans article. C'est une expression figee.</div>
<h3>4. Poser la question Where...?</h3>
<pre class="pseudo">Where is the cat?         Ou est le chat ?
It's under the table.     Il est sous la table.
Where are the keys?       Ou sont les cles ?
They're on the shelf.     Elles sont sur l'etagere.</pre>
<div class="tip">Where + is (singulier) ou are (pluriel), puis on repond avec It's / They're + preposition + lieu.</div>
<h3>5. Decrire une position</h3>
<pre class="pseudo">The dog is next to the sofa, in front of the window.
Le chien est a cote du canape, devant la fenetre.</pre>`,
  exercises: [
    { type: "qcm", q: "Traduis « sur la table ».", opts: ["in the table", "on the table", "under the table", "at the table"], a: 1, exp: "on = sur : on the table." },
    { type: "input", q: "Complete : « The cat is ___ the box. » (dans la boite)", a: ["in"], ph: "preposition", exp: "in = dans : in the box." },
    { type: "qcm", q: "Que veut dire « under » ?", opts: ["sur", "sous", "dans", "derriere"], a: 1, exp: "under = sous." },
    { type: "input", q: "Complete : « The lamp is ___ ___ the bed. » (a cote du lit — deux mots)", a: ["next to"], ph: "a cote de", exp: "next to = a cote de." },
    { type: "vf", q: "« behind » signifie « devant ».", a: false, exp: "Faux : behind = derriere. in front of = devant." },
    { type: "qcm", q: "Traduis « entre le magasin et le cafe ».", opts: ["near the shop and the cafe", "between the shop and the cafe", "under the shop and the cafe", "on the shop and the cafe"], a: 1, exp: "between = entre." },
    { type: "input", q: "Complete : « The tree is in ___ ___ the door. » (devant la porte — deux mots)", a: ["front of"], ph: "devant", exp: "in front of = devant." },
    { type: "qcm", q: "Choisis la bonne preposition : « I am ___ home. »", opts: ["in", "on", "at", "to"], a: 2, exp: "Expression figee : at home." },
    { type: "input", q: "Complete : « The picture is ___ the wall. » (sur le mur)", a: ["on"], ph: "preposition", exp: "on the wall = sur le mur." },
    { type: "vf", q: "On dit « at school » sans article pour « a l'ecole ».", a: true, exp: "Oui : at school, at home, expressions figees." },
    { type: "qcm", q: "Quelle question demande OU est le chat ?", opts: ["What is the cat?", "Where is the cat?", "Who is the cat?", "When is the cat?"], a: 1, exp: "Where = ou." },
    { type: "input", q: "Complete : « Where ___ the keys? » (pluriel)", a: ["are"], ph: "is / are", exp: "Pluriel (keys) : Where are the keys?" },
    { type: "qcm", q: "Traduis « pres du parc ».", opts: ["in the park", "near the park", "on the park", "behind the park"], a: 1, exp: "near = pres de." },
    { type: "vf", q: "« above » signifie « au-dessus de ».", a: true, exp: "above = au-dessus de." },
    { type: "input", q: "Complete : « The ball is ___ the chair. » (sous la chaise)", a: ["under"], ph: "preposition", exp: "under = sous." }
  ],
  final: {
    title: "Exercice final — Ou sont les choses ?",
    intro: `<p>Lis la description de la piece, puis reponds :</p>
<pre class="pseudo">This is the living room. There is a sofa in front of the window.
The television is on a small table. A cat is under the sofa.
The lamp is next to the sofa, and there is a picture on the wall.
The keys are between the books.</pre>`,
    questions: [
      { type: "qcm", q: "Ou est le canape ?", opts: ["under the window", "in front of the window", "behind the window", "on the window"], a: 1, exp: "There is a sofa in front of the window." },
      { type: "input", q: "Ou est le chat ? Complete : « under the ___ »", a: ["sofa"], ph: "un meuble", exp: "A cat is under the sofa." },
      { type: "vf", q: "La lampe est a cote du canape.", a: true, exp: "The lamp is next to the sofa." },
      { type: "qcm", q: "Ou est le tableau (picture) ?", opts: ["on the wall", "on the table", "under the sofa", "near the window"], a: 0, exp: "there is a picture on the wall." },
      { type: "input", q: "Ou sont les cles ? Complete : « ___ the books » (entre)", a: ["between"], ph: "preposition", exp: "The keys are between the books." }
    ],
    solution: `<p>Le canape est devant la fenetre (<em>in front of the window</em>), la television sur une petite table, le chat sous le canape (<em>under the sofa</em>), la lampe a cote du canape (<em>next to the sofa</em>), le tableau sur le mur (<em>on the wall</em>) et les cles entre les livres (<em>between the books</em>).</p>
<p>Retiens les paires : in/on/under, next to / in front of / behind, between / near / above.</p>`
  }
};
</script>

  { id: "en-a1-j21", title: "Ou sont les objets ?", level: 2,
    statement: "Ecris 3 ou 4 phrases pour situer des objets autour de toi en anglais (par exemple sur ton bureau ou dans ta chambre). Utilise au moins trois prepositions differentes parmi <em>on</em>, <em>in</em>, <em>under</em>, <em>next to</em>, <em>behind</em>.",
    hints: [
      "Structure : The + objet + is + preposition + the + lieu.",
      "Exemple : The book is on the desk.",
      "Varie les prepositions : under, next to, behind..."
    ],

    note: "Choisis la preposition selon le sens : on (sur), in (dans), under (sous), next to (a cote de), behind (derriere)." }
  ]
};
</script>
