  theory: `
<h3>1. Le verbe « être »</h3>
<p><strong>To be</strong> signifie « être ». C'est le verbe le plus utilisé de l'anglais : pour dire son âge, sa nationalité, comment on va, où on est. Au présent, il a trois formes seulement : <strong>am</strong>, <strong>is</strong>, <strong>are</strong>. Il faut choisir la bonne selon le pronom.</p>
<h3>2. La conjugaison au présent</h3>
<p>Voici le tableau complet. Apprends-le comme une chanson :</p>
<pre class="pseudo">I    am     → je suis
you  are    → tu es / vous êtes
he   is     → il est
she  is     → elle est
it   is     → c'est / il-elle est (chose)
we   are    → nous sommes
they are    → ils / elles sont</pre>
<div class="tip">Trois formes, faciles à trier : <strong>am</strong> va seulement avec I. <strong>is</strong> va avec he, she, it (une seule personne/chose). <strong>are</strong> va avec you, we, they (plusieurs, ou you).</div>
<h3>3. Les contractions</h3>
<p>À l'oral et à l'écrit courant, on colle le pronom et le verbe avec une apostrophe :</p>
<pre class="pseudo">I am    → I'm          you are  → you're
he is   → he's         we are   → we're
she is  → she's        they are → they're
it is   → it's</pre>
<div class="warn">Ne confonds pas <strong>it's</strong> (= it is, « c'est ») avec <em>its</em> (sans apostrophe, = « son/sa »). À ton niveau, retiens : it's = it is.</div>
<h3>4. À quoi ça sert ?</h3>
<p>Avec to be, tu peux déjà dire beaucoup de choses :</p>
<pre class="pseudo">I am ten years old.  → J'ai dix ans.        // âge : on dit « je SUIS dix ans » !
She is happy.        → Elle est contente.
We are French.       → Nous sommes français.
It is cold.          → Il fait froid.       // météo
They are here.       → Ils sont ici.</pre>
<div class="warn">Piège franco-anglais : pour l'âge, l'anglais utilise <strong>to be</strong>, pas « avoir ». On dit « I am 10 » (je SUIS 10), jamais « I have 10 ». On y reviendra au jour 7.</div>
<h3>5. La forme négative (aperçu)</h3>
<p>Pour dire « ne… pas », on ajoute <strong>not</strong> après le verbe :</p>
<pre class="pseudo">I am not tired.   → Je ne suis pas fatigué.   // am + not
She is not here.  → Elle n'est pas là.        // is + not = isn't
They are not French. → Ils ne sont pas français. // are + not = aren't</pre>`,

    { type: "input", q: "Complète : It ___ cold today. (verbe to be)", a: ["is", "'s"], ph: "un mot", exp: "It is cold : avec it, on utilise is." },
    { type: "vf", q: "Pour dire son âge, l'anglais utilise le verbe to be : « I am 10 ».", a: true, exp: "Oui : « I am 10 years old » (mot à mot : je suis 10 ans)." },
    { type: "qcm", q: "Comment dit-on « nous sommes » ?", opts: ["we is", "we am", "we are", "we be"], a: 2, exp: "we are = nous sommes." },
    { type: "input", q: "Écris la contraction de « I am » (un mot avec apostrophe).", a: ["i'm", "im"], ph: "un mot", exp: "I am → I'm." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["I is happy", "I are happy", "I am happy", "I be happy"], a: 2, exp: "Avec I, c'est toujours am : I am happy." },
    { type: "vf", q: "« is » s'utilise avec he, she et it.", a: true, exp: "Oui : he is, she is, it is." },
