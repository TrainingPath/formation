  theory: `
<h3>1. Le texte a lire</h3>
<p>Lis attentivement ce petit texte. Il utilise le vocabulaire et la grammaire des jours precedents.</p>
<pre class="pseudo">My name is Emma. I am twenty-five years old and I live in London.
I work in a small cafe near the station. I like my job.
Every morning I get up at six o'clock and I have breakfast.
I usually walk to work, but today it is raining, so I am taking the bus.
I have two brothers. Their names are Jack and Tom.
On Sundays we always have lunch together at my mother's house.</pre>
<h3>2. La traduction (pour verifier)</h3>
<pre class="pseudo">Je m'appelle Emma. J'ai vingt-cinq ans et je vis a Londres.
Je travaille dans un petit cafe pres de la gare. J'aime mon travail.
Chaque matin je me leve a six heures et je prends le petit-dejeuner.
D'habitude je vais au travail a pied, mais aujourd'hui il pleut,
donc je prends le bus.
J'ai deux freres. Ils s'appellent Jack et Tom.
Le dimanche nous dejeunons toujours ensemble chez ma mere.</pre>
<h3>3. Comment bien comprendre un texte</h3>
<div class="tip">Cherche d'abord les mots que tu connais (get up, work, brothers...). Repere le QUI (Emma), le OU (London), le QUAND (every morning, today, on Sundays).</div>
<h3>4. Les mots-cles du texte</h3>
<pre class="pseudo">live       vivre / habiter        job       travail / emploi
near       pres de                walk      marcher / aller a pied
together   ensemble               take the bus  prendre le bus</pre>
<div class="warn">Attention au contraste des temps : <em>I usually walk</em> (habitude, present simple) mais <em>today I am taking the bus</em> (aujourd'hui, present continu, exception du jour). Ce point a ete vu au jour 23.</div>
<h3>5. A toi de repondre</h3>
<p>Les exercices ci-dessous portent tous sur le texte d'Emma. Relis-le autant de fois que necessaire avant de repondre.</p>`,

    { type: "input", q: "Que veut dire « together » ? Reponds en anglais par le verbe manquant : « have lunch ___ ».", a: ["together"], ph: "un mot", exp: "together = ensemble." }

<pre class="pseudo">This is Ben. He is a doctor and he works at the hospital.
He can drive, so he goes to work by car. He starts at eight in the morning.

    questions: [

      { type: "vf", q: "Ben aime le cafe.", a: false, exp: "Ben doesn't like coffee; he drinks tea." },

    solution: `<p>Ben est medecin (<em>a doctor</em>) et travaille a l'hopital. Il sait conduire, donc il va au travail en voiture (<em>by car</em>). Il commence a 8h. Il n'aime pas le cafe, il boit du the (<em>doesn't like coffee; he drinks tea</em>). Le soir il joue de la guitare. Le week-end dernier il etait a Paris avec sa femme (<em>was in Paris</em>), et le temps etait magnifique.</p>
<p>Methode : reperer QUI, QUOI, OU, QUAND, et reconnaitre les temps (present simple, can, present continu, was/were).</p>`
