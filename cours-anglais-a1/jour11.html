<script>
var DAY = {
  num: 11,
  title: "This, that, these, those",
  subtitle: "Montrer les choses : ceci, cela, près ou loin, singulier ou pluriel.",
  theory: `
<h3>1. Montrer du doigt</h3>
<p>Ces quatre mots servent à <strong>désigner</strong> une chose ou une personne : « ceci », « cela », « ces… ». On les appelle des <strong>démonstratifs</strong>. Le choix dépend de deux questions : est-ce PRÈS ou LOIN ? Est-ce UN ou PLUSIEURS ?</p>
<h3>2. Le tableau des quatre mots</h3>
<pre class="pseudo">                PRÈS (ici)          LOIN (là-bas)
SINGULIER       this  → ceci        that  → cela
PLURIEL         these → ces (-ci)   those → ces (-là)</pre>
<pre class="pseudo">this book   → ce livre-ci (près de moi)
that book   → ce livre-là (plus loin)
these books → ces livres-ci (près, plusieurs)
those books → ces livres-là (loin, plusieurs)</pre>
<h3>3. Prononciation : le piège this / these</h3>
<div class="tip">« this » (singulier) se dit « thiss », court. « these » (pluriel) se dit « thiiz », plus long et avec un son « z ». Écoute la différence : un seul livre = this, plusieurs = these.</div>
<h3>4. Près ou loin ?</h3>
<p><strong>this / these</strong> = ce qui est PRÈS de la personne qui parle (dans sa main, à côté). <strong>that / those</strong> = ce qui est plus LOIN (à l'autre bout de la pièce, là-bas).</p>
<pre class="pseudo">This is my pen. (dans ma main)   → Ceci est mon stylo.
That is your car. (là-bas)        → Cela est ta voiture.
These are my shoes. (à mes pieds) → Ce sont mes chaussures.
Those are birds. (dans le ciel)   → Ce sont des oiseaux.</pre>
<h3>5. Se présenter au téléphone</h3>
<p>Usage courant : au téléphone, on emploie <strong>this</strong> pour se présenter et <strong>that</strong> pour demander qui est l'autre.</p>
<pre class="pseudo">Hello, this is Sam.  → Allô, c'est Sam.        // this = moi
Who is that?         → Qui est-ce ? (à l'autre bout)</pre>
<h3>6. Avec un nom ou tout seul</h3>
<p>Ces mots peuvent précéder un nom (this book) ou rester seuls (This is my book).</p>
<pre class="pseudo">This car is red.     → Cette voiture est rouge.   // this + nom
This is a car.       → Ceci est une voiture.      // this seul</pre>`,
  exercises: [
    { type: "qcm", q: "Quel mot pour montrer UN objet qui est PRÈS de toi ?", opts: ["this", "that", "these", "those"], a: 0, exp: "this = singulier + près." },
    { type: "qcm", q: "Quel mot pour montrer PLUSIEURS objets LOIN de toi ?", opts: ["this", "that", "these", "those"], a: 3, exp: "those = pluriel + loin." },
    { type: "input", q: "Complète : ___ book is mine (ce livre-ci, dans ma main).", a: ["this"], ph: "un mot", exp: "Singulier + près → this book." },
    { type: "input", q: "Complète : ___ cars are fast (ces voitures-là, au loin).", a: ["those"], ph: "un mot", exp: "Pluriel + loin → those cars." },
    { type: "qcm", q: "Quel est le pluriel de « this » ?", opts: ["thats", "these", "those", "thises"], a: 1, exp: "this (sing.) → these (plur.), tous deux « près »." },
    { type: "qcm", q: "Quel est le pluriel de « that » ?", opts: ["these", "those", "thats", "that's"], a: 1, exp: "that (sing.) → those (plur.), tous deux « loin »." },
    { type: "input", q: "Complète : ___ are my friends (près de moi, plusieurs).", a: ["these"], ph: "un mot", exp: "Pluriel + près → these." },
    { type: "vf", q: "« this » sert pour une chose loin de la personne qui parle.", a: false, exp: "Faux : this = près. C'est that qui est loin." },
    { type: "input", q: "Complète : ___ is my house (celle-ci, près de moi).", a: ["this"], ph: "un mot", exp: "Singulier + près → this is my house." },
    { type: "qcm", q: "Au téléphone, pour se présenter, on dit :", opts: ["That is Sam", "These is Sam", "This is Sam", "Those is Sam"], a: 2, exp: "Hello, this is Sam = c'est Sam à l'appareil." },
    { type: "input", q: "Complète : ___ shoes are new (celles-ci, à mes pieds).", a: ["these"], ph: "un mot", exp: "Pluriel + près → these shoes." },
    { type: "qcm", q: "Comment dit-on « ces oiseaux-là » (loin, plusieurs) ?", opts: ["this birds", "that birds", "these birds", "those birds"], a: 3, exp: "Pluriel + loin → those birds." },
    { type: "vf", q: "« these » se prononce plus long que « this », avec un son « z ».", a: true, exp: "Oui : this = « thiss » (court), these = « thiiz » (long, z)." },
    { type: "input", q: "Complète : ___ is your car, over there (celle-là, au loin).", a: ["that"], ph: "un mot", exp: "Singulier + loin → that." },
    { type: "qcm", q: "« Those are birds » signifie…", opts: ["Ceci est un oiseau", "Ce sont des oiseaux (là-bas)", "Cet oiseau-ci", "Voici mon oiseau"], a: 1, exp: "those = ces… là-bas (pluriel loin) → ce sont des oiseaux." }
  ],
  final: {
    title: "Exercice final — Près ou loin, un ou plusieurs",
    intro: `<p>Lis ce petit texte, puis choisis le bon démonstratif.</p>
<pre class="pseudo">This is my bag. It is here, next to me.
That is Tom's car. It is over there.
These are my books, and those are your books.</pre>
<p><em>Traduction : Ceci est mon sac. Il est ici, à côté de moi. Cela est la voiture de Tom. Elle est là-bas. Ce sont mes livres, et ce sont tes livres (là-bas).</em></p>`,
    questions: [
      { type: "input", q: "Complète : ___ is my bag, next to me. (singulier, près)", a: ["this"], ph: "un mot", exp: "Singulier + près → this." },
      { type: "input", q: "Complète : ___ is Tom's car, over there. (singulier, loin)", a: ["that"], ph: "un mot", exp: "Singulier + loin → that." },
      { type: "qcm", q: "Complète : ___ are my books, here in my hands.", opts: ["this", "that", "these", "those"], a: 2, exp: "Pluriel + près → these." },
      { type: "qcm", q: "Complète : ___ are your books, on the far shelf.", opts: ["this", "that", "these", "those"], a: 3, exp: "Pluriel + loin → those." },
      { type: "vf", q: "« this » et « these » désignent des choses proches de la personne qui parle.", a: true, exp: "Oui : this/these = près ; that/those = loin." }
    ],
    solution: `<p>La grille complète des démonstratifs :</p>
<pre class="pseudo">              PRÈS          LOIN
singulier     this          that
pluriel       these         those</pre>
<p>Pose-toi toujours les deux questions : (1) est-ce près ou loin de moi ? (2) est-ce un seul objet ou plusieurs ? La réponse te donne directement le bon mot. Et rappelle-toi : this (court) vs these (long, son z).</p>`
  }
};
</script>
