<script>
var DAY = {
  num: 5,
  title: "Les articles a, an, the",
  subtitle: "Choisir entre a, an et the, et savoir quand ne mettre aucun article.",
  theory: `
<h3>1. Qu'est-ce qu'un article ?</h3>
<p>Un <strong>article</strong> est un petit mot placé devant un nom. En français : « un, une, le, la, les ». En anglais, il n'y en a que trois : <strong>a</strong>, <strong>an</strong> et <strong>the</strong>. Bonne nouvelle : ils ne changent pas selon le genre (pas de masculin/féminin).</p>
<h3>2. a et an : « un / une »</h3>
<p><strong>a</strong> et <strong>an</strong> veulent tous les deux dire « un » ou « une ». Ce sont des <strong>articles indéfinis</strong> : on parle d'une chose quelconque, pas précise. On les emploie devant un nom singulier (une seule chose). Le choix entre les deux dépend du SON qui suit :</p>
<pre class="pseudo">a  → devant un son de CONSONNE   a cat (un chat), a book (un livre), a dog
an → devant un son de VOYELLE    an apple (une pomme), an egg (un oeuf), an orange</pre>
<div class="tip">On dit <strong>an</strong> pour éviter deux voyelles qui se cognent : « a apple » serait difficile à dire, donc « an apple ». C'est une question de son, pas d'orthographe.</div>
<div class="warn">C'est le SON qui compte, pas la lettre. « an hour » (une heure) prend an car le h est muet et on entend une voyelle. « a university » prend a car on entend « you » (son de consonne « y ») au début.</div>
<h3>3. the : « le / la / les »</h3>
<p><strong>the</strong> est l'<strong>article défini</strong>. On l'emploie pour une chose précise, connue, dont on a déjà parlé. Il sert au singulier ET au pluriel, sans changer.</p>
<pre class="pseudo">the cat   → le chat (ce chat précis)
the cats  → les chats (ces chats précis)
the sun   → le soleil (il n'y en a qu'un)</pre>
<h3>4. a/an ou the ? La différence</h3>
<p>La première fois qu'on parle d'une chose, on utilise a/an. Ensuite, comme on la connaît, on passe à the.</p>
<pre class="pseudo">I see a dog. The dog is black.
→ Je vois un chien. Le chien est noir.
(a dog = un chien quelconque, puis the dog = ce chien-là)</pre>
<h3>5. Pas d'article du tout</h3>
<p>Parfois, l'anglais ne met AUCUN article là où le français en mettrait un. C'est le cas devant les noms de langues, certains repas, et les noms au pluriel pris en général.</p>
<pre class="pseudo">I speak English.  → Je parle l'anglais.   // pas « the English »
I like cats.      → J'aime les chats.      // pluriel général, pas d'article
Cats are nice.    → Les chats sont gentils. // idée générale</pre>`,
  exercises: [
    { type: "input", q: "Complète : I have ___ cat. (a ou an ?)", a: ["a"], ph: "a ou an", exp: "cat commence par un son de consonne → a cat." },
    { type: "input", q: "Complète : She eats ___ apple. (a ou an ?)", a: ["an"], ph: "a ou an", exp: "apple commence par un son de voyelle → an apple." },
    { type: "qcm", q: "Que signifie « the » ?", opts: ["un / une", "le / la / les", "de", "à"], a: 1, exp: "the = le, la, les (article défini)." },
    { type: "input", q: "Complète : I read ___ book. (a ou an ?)", a: ["a"], ph: "a ou an", exp: "book → son de consonne → a book." },
    { type: "input", q: "Complète : It is ___ egg. (a ou an ?)", a: ["an"], ph: "a ou an", exp: "egg → son de voyelle → an egg." },
    { type: "vf", q: "« the » peut s'utiliser au singulier comme au pluriel.", a: true, exp: "Oui : the cat / the cats, la forme ne change pas." },
    { type: "qcm", q: "Pourquoi dit-on « an hour » et non « a hour » ?", opts: ["Parce que hour est féminin", "Parce que le h est muet, on entend une voyelle", "Par erreur historique", "Il n'y a pas de raison"], a: 1, exp: "Le h de hour est muet : on entend « our », un son de voyelle → an." },
    { type: "input", q: "Complète : I speak ___ (aucun article ? écris X, sinon le mot) English.", a: ["x"], ph: "X si aucun", exp: "Devant une langue, pas d'article : « I speak English »." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["I have a orange", "I have an orange", "I have the orange one", "I have orange a"], a: 1, exp: "orange → son de voyelle → an orange." },
    { type: "input", q: "Complète le récit : I see a dog. ___ dog is big. (a, an ou the ?)", a: ["the"], ph: "a, an ou the", exp: "On en a déjà parlé, c'est précis → the dog." },
    { type: "vf", q: "En anglais, l'article change selon le masculin ou le féminin.", a: false, exp: "Faux : a, an, the ne dépendent pas du genre." },
    { type: "qcm", q: "Comment dit-on « J'aime les chats » (en général) ?", opts: ["I like the cats", "I like a cats", "I like cats", "I like an cats"], a: 2, exp: "Pluriel général : pas d'article → I like cats." },
    { type: "input", q: "Complète : He is ___ student. (a ou an ?)", a: ["a"], ph: "a ou an", exp: "student → son de consonne « st » → a student." },
    { type: "qcm", q: "Quand utilise-t-on « a / an » plutôt que « the » ?", opts: ["Pour une chose précise et connue", "Pour une chose quelconque, dont on parle pour la première fois", "Toujours au pluriel", "Jamais avec un nom singulier"], a: 1, exp: "a/an = indéfini (chose quelconque) ; the = défini (chose précise)." },
    { type: "input", q: "Complète : There is ___ umbrella. (a ou an ?)", a: ["an"], ph: "a ou an", exp: "umbrella → son de voyelle → an umbrella." }
  ],
  final: {
    title: "Exercice final — Le bon article",
    intro: `<p>Choisis a, an, the, ou aucun article. Rappel : a/an pour une chose quelconque (an devant un son de voyelle) · the pour une chose précise · rien pour les langues et les pluriels généraux.</p>`,
    questions: [
      { type: "input", q: "Complète : I want ___ orange. (a ou an ?)", a: ["an"], ph: "a ou an", exp: "orange → son de voyelle → an." },
      { type: "input", q: "Complète : Look at ___ moon! (article défini)", a: ["the"], ph: "un article", exp: "La lune est unique et précise → the moon." },
      { type: "qcm", q: "Complète : She is ___ engineer.", opts: ["a", "an", "the", "aucun"], a: 1, exp: "engineer → son de voyelle « e » → an engineer." },
      { type: "input", q: "Complète : I have ___ car. (a ou an ?)", a: ["a"], ph: "a ou an", exp: "car → son de consonne → a car." },
      { type: "qcm", q: "Complète : They study ___ music.", opts: ["a", "an", "the", "aucun article"], a: 3, exp: "Nom général abstrait : pas d'article → « study music »." }
    ],
    solution: `<p>Règles à retenir :</p>
<pre class="pseudo">a   → un/une, devant un SON de consonne : a cat, a book
an  → un/une, devant un SON de voyelle : an apple, an hour
the → le/la/les, chose précise ou déjà connue : the sun, the cats
(rien) → langues, pluriels généraux : I speak English, I like cats</pre>
<p>Le réflexe clé : pour choisir entre a et an, écoute le premier SON du mot qui suit, pas la lettre écrite. Voyelle entendue → an, consonne entendue → a.</p>`
  }
};
</script>
