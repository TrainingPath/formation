var DAY = {

  title: "Les adjectifs possessifs",
  subtitle: "my, your, his, her, its, our, their : à qui appartient la chose ?",
  theory: `
<h3>1. Qu'est-ce qu'un adjectif possessif ?</h3>
<p>Un <strong>adjectif possessif</strong> dit à qui appartient quelque chose. En français : « mon, ton, son, notre, votre, leur ». Il se place devant le nom : « ma voiture », « son livre ». En anglais, chaque pronom a son possessif.</p>
<h3>2. Le tableau des possessifs</h3>
<pre class="pseudo">I    → my      → mon / ma / mes      my book
you  → your    → ton / ta / votre    your book
he   → his     → son / sa (à lui)    his book
she  → her     → son / sa (à elle)   her book
it   → its     → son / sa (chose)    its color
we   → our     → notre / nos         our book
they → their   → leur / leurs        their book</pre>
<h3>3. Une seule forme, pas d'accord</h3>
<p>Grosse différence avec le français : l'adjectif possessif anglais ne change JAMAIS selon la chose possédée. « my » sert pour « mon », « ma » et « mes » : <em>my book</em>, <em>my car</em>, <em>my books</em>. Pas de masculin, féminin ni pluriel.</p>
<div class="tip">Le possessif s'accorde avec le POSSESSEUR, pas avec l'objet. « my » car j'en parle, quel que soit l'objet ou son nombre.</div>
<h3>4. his ou her ? Le grand piège</h3>
<p>En français, « son livre » ne dit pas si le possesseur est un homme ou une femme. En anglais, SI ! <strong>his</strong> = à lui (un homme), <strong>her</strong> = à elle (une femme). On choisit selon le possesseur.</p>
<pre class="pseudo">Tom and his book.   → Tom et son livre.    // his car c'est Tom (un homme)
Anna and her book.  → Anna et son livre.   // her car c'est Anna (une femme)
His sister / her brother → sa soeur (à lui) / son frère (à elle)</pre>
<div class="warn">Ne choisis pas his/her selon l'objet ! « Tom's mother » se dit « HIS mother » (la mère DE TOM, un homme), même si « mother » est féminin. Ce qui compte, c'est le sexe du POSSESSEUR.</div>
<h3>5. its sans apostrophe</h3>
<p><strong>its</strong> = « son/sa » pour une chose ou un animal (le possessif de it). Attention à ne pas le confondre avec <em>it's</em> (= it is).</p>
<pre class="pseudo">The dog and its ball. → Le chien et sa balle.   // its = possessif
It's a ball.          → C'est une balle.        // it's = it is</pre>`,
  exercises: [
    { type: "input", q: "Complète : This is ___ book. (le mien) (possessif de I)", a: ["my"], ph: "un mot", exp: "I → my (mon/ma)." },
    { type: "qcm", q: "Quel est le possessif de « she » ?", opts: ["his", "her", "your", "its"], a: 1, exp: "she → her (son/sa, à elle)." },
    { type: "input", q: "Complète : Tom loves ___ dog. (son chien, à lui)", a: ["his"], ph: "un mot", exp: "Tom = he → his dog." },
    { type: "input", q: "Complète : Anna calls ___ mother. (sa mère, à elle)", a: ["her"], ph: "un mot", exp: "Anna = she → her mother." },
    { type: "qcm", q: "Quel est le possessif de « they » ?", opts: ["your", "our", "their", "his"], a: 2, exp: "they → their (leur/leurs)." },
    { type: "vf", q: "En anglais, « my » change de forme au pluriel (my → mies).", a: false, exp: "Faux : my ne change jamais. my book, my books." },
    { type: "input", q: "Complète : We love ___ city. (notre ville)", a: ["our"], ph: "un mot", exp: "we → our (notre/nos)." },
    { type: "qcm", q: "« Tom and ___ sister » : quel possessif ?", opts: ["her", "his", "its", "your"], a: 1, exp: "Le possesseur est Tom (un homme) → his sister." },
    { type: "input", q: "Complète : Is this ___ car? (à toi) (possessif de you)", a: ["your"], ph: "un mot", exp: "you → your (ton/ta/votre)." },
    { type: "qcm", q: "Quelle est la différence entre « its » et « it's » ?", opts: ["Aucune", "its = son/sa (possessif), it's = it is", "its = it is, it's = son/sa", "its s'utilise au pluriel"], a: 1, exp: "its (sans apostrophe) = possessif ; it's = it is." },
    { type: "input", q: "Complète : The cat plays with ___ ball. (sa balle, à l'animal)", a: ["its"], ph: "un mot", exp: "The cat = it → its ball." },
    { type: "qcm", q: "« Anna's brother » se traduit par…", opts: ["her brother", "his brother", "its brother", "their brother"], a: 0, exp: "Le possesseur est Anna (une femme) → her brother, même si brother est masculin." },
    { type: "input", q: "Complète : They clean ___ room. (leur chambre)", a: ["their"], ph: "un mot", exp: "they → their room." },
    { type: "vf", q: "On choisit his/her selon le sexe du possesseur, pas selon l'objet.", a: true, exp: "Oui : his = possesseur masculin, her = possesseur féminin." },
    { type: "qcm", q: "Quel est le possessif de « he » ?", opts: ["her", "his", "him", "he's"], a: 1, exp: "he → his." }
  ],
  final: {
    title: "Exercice final — À qui est-ce ?",
    intro: `<p>Lis ce petit texte, puis complète et réponds.</p>
<pre class="pseudo">This is my friend Sam. His sister is nine.
Sam and his sister love their dog.
The dog has got its own bed.</pre>
<p><em>Traduction : Voici mon ami Sam. Sa soeur a neuf ans. Sam et sa soeur adorent leur chien. Le chien a son propre lit.</em></p>`,
    questions: [
      { type: "input", q: "Complète comme dans le texte : Sam loves ___ sister. (à lui)", a: ["his"], ph: "un mot", exp: "Sam = he → his sister." },
      { type: "qcm", q: "Quel possessif pour « Anna and ___ brother » ?", opts: ["his", "her", "its", "their"], a: 1, exp: "Anna = she → her brother." },
      { type: "input", q: "Complète : Sam and his sister love ___ dog. (à eux)", a: ["their"], ph: "un mot", exp: "Sam et sa soeur = they → their dog." },
      { type: "vf", q: "Dans « The dog has got its bed », « its » est un possessif (sans apostrophe).", a: true, exp: "Oui : its = son/sa pour l'animal." },
      { type: "qcm", q: "Le possessif de « we » est…", opts: ["your", "our", "their", "my"], a: 1, exp: "we → our." }
    ],
    solution: `<p>Le tableau complet des adjectifs possessifs :</p>
<pre class="pseudo">my (I)     your (you)   his (he)    her (she)
its (it)   our (we)     their (they)</pre>
<p>Deux réflexes : (1) le possessif ne s'accorde jamais avec l'objet (my book / my books), et (2) his/her dépend du POSSESSEUR (his = à lui, her = à elle). Ne te laisse pas piéger par le genre français de l'objet.</p>`
  }
