<h3>1. Can : le verbe de la capacite</h3>
<p><strong>Can</strong> exprime la capacite : « savoir faire, pouvoir ». Il est suivi d'un verbe a l'infinitif SANS <em>to</em>.</p>
<pre class="pseudo">I can swim.          Je sais nager.
She can cook.        Elle sait cuisiner.
They can run fast.   Ils savent courir vite.</pre>
<div class="tip">Can ne change JAMAIS : pas de -s a la 3e personne. On dit <em>He can</em>, jamais « he cans ».</div>
<h3>2. La forme negative : can't</h3>
<p>La negation est <strong>cannot</strong>, contractee en <strong>can't</strong>.</p>
<pre class="pseudo">I can't swim.        Je ne sais pas nager.
He cannot drive.     Il ne sait pas conduire.
We can't come.       Nous ne pouvons pas venir.</pre>
<h3>3. La question : Can you...?</h3>
<p>Pour poser une question, on met <strong>can</strong> en debut de phrase.</p>
<pre class="pseudo">Can you swim?        Sais-tu nager ?
Yes, I can.          Oui.  (reponse courte)
No, I can't.         Non.
Can she sing?        Sait-elle chanter ?</pre>
<h3>4. Can pour la permission</h3>
<p>Can sert aussi a demander ou donner la <strong>permission</strong> (pouvoir = avoir le droit).</p>
<pre class="pseudo">Can I open the window?     Puis-je ouvrir la fenetre ?
Yes, you can.              Oui, tu peux.
You can't smoke here.      Tu ne peux pas fumer ici.</pre>
<div class="warn">Meme mot pour deux sens : <em>I can swim</em> = capacite (je sais), <em>Can I go?</em> = permission (ai-je le droit). Le contexte fait la difference.</div>
<h3>5. Faire une demande polie</h3>
<pre class="pseudo">Can you help me, please?   Peux-tu m'aider, s'il te plait ?
Can I have a coffee?       Puis-je avoir un cafe ?</pre>`,
