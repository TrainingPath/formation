<script>
var DAY = {
  num: 20,
  title: "There is / there are",
  subtitle: "Dire ce qu'il y a : au singulier et au pluriel.",
  theory: `
<h3>1. There is / There are : « il y a »</h3>
<p>Pour dire « il y a », l'anglais choisit entre deux formes selon le nombre :</p>
<pre class="pseudo">There is + singulier     There is a cat.     Il y a un chat.
There are + pluriel      There are two cats. Il y a deux chats.</pre>
<div class="tip">On contracte souvent <strong>there is</strong> en <strong>there's</strong> : <em>There's a book on the table.</em></div>
<h3>2. La forme negative</h3>
<pre class="pseudo">There isn't a chair.       Il n'y a pas de chaise.
There aren't any apples.   Il n'y a pas de pommes.
There is no milk.          Il n'y a pas de lait.</pre>
<div class="warn">Avec un pluriel a la forme negative ou interrogative, on utilise souvent <strong>any</strong> : <em>There aren't any books.</em> A l'affirmatif pluriel, on utilise <strong>some</strong> : <em>There are some books.</em></div>
<h3>3. La question : Is there...? / Are there...?</h3>
<pre class="pseudo">Is there a bank near here?   Y a-t-il une banque pres d'ici ?
Yes, there is.               Oui.
No, there isn't.            Non.
Are there any shops?         Y a-t-il des magasins ?
Yes, there are.              Oui.</pre>
<h3>4. Some et any</h3>
<pre class="pseudo">There are some chairs.       Il y a des chaises.   (affirmatif)
There aren't any chairs.     Il n'y a pas de chaises. (negatif)
Are there any chairs?        Y a-t-il des chaises ?  (question)</pre>
<h3>5. Decrire une piece</h3>
<pre class="pseudo">In my room there is a bed and there are two windows.
Dans ma chambre il y a un lit et il y a deux fenetres.
There's a table in the kitchen.
Il y a une table dans la cuisine.</pre>`,
  exercises: [
    { type: "qcm", q: "Choisis : « ___ a cat in the garden. »", opts: ["There are", "There is", "There am", "There be"], a: 1, exp: "Singulier (a cat) : There is." },
    { type: "input", q: "Complete : « There ___ three books on the table. » (pluriel)", a: ["are"], ph: "is / are", exp: "Pluriel (three books) : There are." },
    { type: "qcm", q: "Quelle est la contraction de « there is » ?", opts: ["there're", "theres", "there's", "there'is"], a: 2, exp: "there is se contracte en there's." },
    { type: "input", q: "Complete la forme negative : « There ___ a chair. » (Il n'y a pas de chaise.)", a: ["isn't", "is not"], ph: "negation", exp: "There isn't a chair." },
    { type: "vf", q: "« There are two dogs » est correct pour un pluriel.", a: true, exp: "Pluriel (two dogs) : There are." },
    { type: "qcm", q: "Quel mot met-on au pluriel affirmatif : « There are ___ apples. » ?", opts: ["any", "some", "a", "no"], a: 1, exp: "A l'affirmatif pluriel on utilise some." },
    { type: "input", q: "Complete la question : « ___ there a bank near here? » (singulier)", a: ["is"], ph: "is / are", exp: "Is there...? au singulier." },
    { type: "qcm", q: "Reponse courte a « Are there any shops? » (oui) :", opts: ["Yes, there is.", "Yes, there are.", "Yes, they are.", "Yes, it is."], a: 1, exp: "Pluriel : Yes, there are." },
    { type: "input", q: "Complete : « There aren't ___ books. » (negatif pluriel)", a: ["any"], ph: "some / any", exp: "A la forme negative pluriel on utilise any." },
    { type: "vf", q: "« Is there any milk? » est une question correcte.", a: true, exp: "Oui : any s'emploie dans les questions." },
    { type: "qcm", q: "Traduis « Il y a deux fenetres. »", opts: ["There is two windows.", "There are two windows.", "It has two windows.", "There have two windows."], a: 1, exp: "Pluriel : There are two windows." },
    { type: "input", q: "Complete : « There ___ a table in the kitchen. » (singulier)", a: ["is", "'s"], ph: "is", exp: "Singulier : There is a table." },
    { type: "qcm", q: "Quelle phrase est negative ?", opts: ["There is a cat.", "Are there cats?", "There isn't a cat.", "There are cats."], a: 2, exp: "There isn't = forme negative." },
    { type: "vf", q: "Au singulier negatif on ecrit « There aren't a chair ».", a: false, exp: "Faux : singulier = There isn't a chair." },
    { type: "input", q: "Complete : « ___ there any apples? » (pluriel, question)", a: ["are"], ph: "is / are", exp: "Pluriel : Are there any apples?" }
  ],
  final: {
    title: "Exercice final — La chambre de Max",
    intro: `<p>Lis la description, puis reponds :</p>
<pre class="pseudo">This is Max's room. There is a bed and there is a desk.
There are two chairs and there are three books on the desk.
There isn't a television. Are there any windows? Yes, there are two.</pre>`,
    questions: [
      { type: "qcm", q: "Combien de chaises y a-t-il ?", opts: ["one", "two", "three", "four"], a: 1, exp: "There are two chairs." },
      { type: "input", q: "Combien de livres y a-t-il sur le bureau ? (chiffre en anglais)", a: ["three", "3"], ph: "un nombre", exp: "There are three books." },
      { type: "vf", q: "Il y a une television dans la chambre.", a: false, exp: "There isn't a television." },
      { type: "qcm", q: "Y a-t-il des fenetres ?", opts: ["Non, aucune", "Oui, deux", "Oui, trois", "On ne sait pas"], a: 1, exp: "Yes, there are two windows." },
      { type: "input", q: "Complete d'apres le texte : « There ___ a desk. » (singulier)", a: ["is"], ph: "is / are", exp: "Singulier : There is a desk." }
    ],
    solution: `<p>Dans la chambre de Max il y a un lit et un bureau (<em>There is a bed / a desk</em>), deux chaises et trois livres (<em>There are two chairs / three books</em>). Il n'y a pas de television (<em>There isn't a television</em>) mais il y a deux fenetres.</p>
<p>Regle cle : <strong>There is</strong> + singulier, <strong>There are</strong> + pluriel ; <em>some</em> a l'affirmatif, <em>any</em> au negatif et dans les questions.</p>`
  }
};
</script>
