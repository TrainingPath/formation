<script>
var DAY = {
  num: 7,
  title: "Les nombres et l'âge",
  subtitle: "Compter de 0 à 100 et dire son âge avec le verbe to be.",
  theory: `
<h3>1. Les nombres de 0 à 12</h3>
<p>Ces premiers nombres n'ont aucune règle : il faut les apprendre par cœur.</p>
<pre class="pseudo">0 zero    1 one     2 two     3 three
4 four    5 five    6 six     7 seven
8 eight   9 nine    10 ten    11 eleven   12 twelve</pre>
<h3>2. De 13 à 19 : le suffixe -teen</h3>
<p>À partir de 13, on ajoute <strong>-teen</strong> (qui rappelle « ten », dix) à un nombre de base :</p>
<pre class="pseudo">13 thirteen    14 fourteen   15 fifteen   16 sixteen
17 seventeen   18 eighteen   19 nineteen</pre>
<div class="warn">Attention à l'orthographe : 13 = thir<strong>teen</strong> (pas « threeteen »), 15 = fif<strong>teen</strong> (pas « fiveteen »). Ce sont les deux pièges classiques.</div>
<h3>3. Les dizaines : le suffixe -ty</h3>
<p>Les dizaines rondes se terminent par <strong>-ty</strong> :</p>
<pre class="pseudo">20 twenty    30 thirty    40 forty    50 fifty
60 sixty     70 seventy   80 eighty   90 ninety   100 one hundred</pre>
<div class="warn">Ne confonds pas <strong>-teen</strong> (13-19) et <strong>-ty</strong> (les dizaines) ! « fourteen » (14) et « forty » (40) se ressemblent mais sont très différents. À l'oral, l'accent aide : four<strong>TEEN</strong> vs <strong>FOR</strong>ty.</div>
<h3>4. Les nombres composés : dizaine + trait d'union + unité</h3>
<p>Entre les dizaines, on relie la dizaine et l'unité avec un trait d'union :</p>
<pre class="pseudo">21 twenty-one     32 thirty-two     45 forty-five
67 sixty-seven    88 eighty-eight   99 ninety-nine</pre>
<h3>5. Dire son âge : to be, pas « avoir »</h3>
<p>En français on dit « J'AI 10 ans ». En anglais, on utilise le verbe <strong>to be</strong> (être) : « I AM 10 (years old) ». Mot à mot : « je suis 10 (ans) ».</p>
<pre class="pseudo">I am ten years old.   → J'ai dix ans.       // « years old » = « ans » (facultatif)
She is twenty.        → Elle a vingt ans.   // on peut omettre « years old »
How old are you?      → Quel âge as-tu ?    // mot à mot : combien vieux es-tu ?
I am eight.           → J'ai huit ans.</pre>
<div class="warn">Erreur très fréquente : dire « I have 10 years ». C'est INCORRECT. On dit « I am 10 (years old) ». Retiens : l'âge se dit avec to be.</div>`,
  exercises: [
    { type: "input", q: "Écris le nombre 3 en lettres (en anglais).", a: ["three"], ph: "un mot", exp: "3 = three." },
    { type: "input", q: "Écris le nombre 12 en lettres.", a: ["twelve"], ph: "un mot", exp: "12 = twelve." },
    { type: "qcm", q: "Comment écrit-on 15 ?", opts: ["fiveteen", "fifteen", "fivety", "fiften"], a: 1, exp: "15 = fifteen (attention : fif-, pas five-)." },
    { type: "input", q: "Écris le nombre 20 en lettres.", a: ["twenty"], ph: "un mot", exp: "20 = twenty." },
    { type: "qcm", q: "Comment écrit-on 40 ?", opts: ["fourty", "fourteen", "forty", "fortey"], a: 2, exp: "40 = forty (sans u : pas « fourty »)." },
    { type: "input", q: "Écris le nombre 30 en lettres.", a: ["thirty"], ph: "un mot", exp: "30 = thirty." },
    { type: "qcm", q: "Quelle est la différence entre 14 et 40 ?", opts: ["fourteen (14) / forty (40)", "forty (14) / fourteen (40)", "il n'y en a pas", "fourty (14) / forten (40)"], a: 0, exp: "14 = fourteen (-teen), 40 = forty (-ty)." },
    { type: "input", q: "Écris le nombre 21 en lettres (avec trait d'union).", a: ["twenty-one"], ph: "avec un tiret", exp: "21 = twenty-one." },
    { type: "vf", q: "Pour dire son âge, l'anglais utilise le verbe to be : « I am 10 ».", a: true, exp: "Oui : I am 10 (years old), jamais « I have 10 »." },
    { type: "qcm", q: "Comment dit-on « J'ai huit ans » ?", opts: ["I have eight years", "I am eight years old", "I have eight years old", "I eight am"], a: 1, exp: "I am eight (years old). L'âge = to be." },
    { type: "input", q: "Écris le nombre 50 en lettres.", a: ["fifty"], ph: "un mot", exp: "50 = fifty." },
    { type: "qcm", q: "Comment demande-t-on l'âge de quelqu'un ?", opts: ["How much you are?", "What age you have?", "How old are you?", "How many years?"], a: 2, exp: "How old are you? = quel âge as-tu ?" },
    { type: "input", q: "Écris le nombre 100 en lettres (deux mots).", a: ["one hundred", "a hundred", "hundred"], ph: "deux mots", exp: "100 = one hundred (ou a hundred)." },
    { type: "input", q: "Écris le nombre 67 en lettres (avec trait d'union).", a: ["sixty-seven"], ph: "avec un tiret", exp: "67 = sixty-seven." },
    { type: "vf", q: "« I have 30 years » est une façon correcte de dire son âge.", a: false, exp: "Faux : on dit « I am 30 (years old) »." }
  ],
  final: {
    title: "Exercice final — Nombres et âge",
    intro: `<p>Tu combines l'écriture des nombres et la façon de donner un âge. Fais bien la différence entre les -teen et les -ty.</p>`,
    questions: [
      { type: "input", q: "Écris 13 en lettres.", a: ["thirteen"], ph: "un mot", exp: "13 = thirteen (pas threeteen)." },
      { type: "input", q: "Écris 90 en lettres.", a: ["ninety"], ph: "un mot", exp: "90 = ninety." },
      { type: "qcm", q: "Complète : « How old are you? » « I ___ twelve. »", opts: ["have", "am", "is", "are"], a: 1, exp: "L'âge = to be → I am twelve." },
      { type: "input", q: "Écris 45 en lettres (avec trait d'union).", a: ["forty-five"], ph: "avec un tiret", exp: "45 = forty-five." },
      { type: "qcm", q: "Lequel est correct pour « Elle a 20 ans » ?", opts: ["She has twenty years", "She is twenty", "She have twenty", "She twenty is"], a: 1, exp: "She is twenty (years old)." }
    ],
    solution: `<p>Deux automatismes à emporter :</p>
<pre class="pseudo">-teen (13-19) : thirteen, fourteen, fifteen ... nineteen
-ty (dizaines) : twenty, thirty, forty, fifty ... ninety
composés : twenty-one, forty-five (avec un trait d'union)
âge : I AM 10 years old   (to be, jamais « have »)</pre>
<p>La confusion fourteen/forty et l'âge avec « avoir » sont les deux pièges à éviter absolument. Compte à voix haute jusqu'à 100 pour ancrer les nombres.</p>`
  }
};
