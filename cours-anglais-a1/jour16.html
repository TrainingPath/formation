  title: "Les jours, les mois, les dates",
  subtitle: "Nommer un jour, un mois et dire une date en anglais.",
  theory: `
<h3>1. Les jours de la semaine</h3>
<p>En anglais, les jours s'écrivent toujours avec une <strong>majuscule</strong>, même au milieu d'une phrase. La semaine commence souvent le dimanche (<em>Sunday</em>) dans les calendriers, mais l'usage courant place le lundi en premier.</p>
<pre class="pseudo">Monday      lundi
Tuesday     mardi
Wednesday   mercredi        // attention : le d ne se prononce pas
Thursday    jeudi
Friday      vendredi
Saturday    samedi
Sunday      dimanche</pre>
<p>Pour dire « le lundi » (chaque lundi), on ajoute souvent un <strong>s</strong> : <em>on Mondays</em> (le lundi, tous les lundis).</p>
<h3>2. Les mois de l'annee</h3>
<p>Les mois prennent aussi une <strong>majuscule</strong>.</p>
<pre class="pseudo">January    janvier      July        juillet
February   fevrier      August      aout
March      mars         September   septembre
April      avril        October     octobre
May        mai          November    novembre
June       juin         December    decembre</pre>
<div class="tip">On utilise <strong>in</strong> devant un mois : <em>in April</em> (en avril), et <strong>on</strong> devant un jour : <em>on Friday</em> (vendredi).</div>
<h3>3. Les nombres ordinaux</h3>
<p>Pour dire une date, on a besoin des <strong>ordinaux</strong> (premier, deuxieme...).</p>
<pre class="pseudo">1st  first        2nd  second      3rd  third
4th  fourth       5th  fifth       6th  sixth
7th  seventh      8th  eighth      9th  ninth
10th tenth        20th twentieth   21st twenty-first
31st thirty-first</pre>
<h3>4. Dire une date</h3>
<p>On dit le jour avec un ordinal et le mot <strong>the</strong>. Deux formes existent :</p>
<pre class="pseudo">May the third            le 3 mai   (forme britannique)
March the first          le 1er mars
It's the fifth of June   nous sommes le 5 juin</pre>
<p>Exemple de question : <em>What's the date today?</em> = « Quelle est la date aujourd'hui ? »</p>
<div class="warn">On ecrit souvent <em>3rd May</em> ou <em>May 3rd</em>, mais on LIT toujours <em>the third of May</em> / <em>May the third</em>. Le petit mot <strong>the</strong> s'entend a l'oral.</div>
<h3>5. Demander le jour</h3>
<pre class="pseudo">What day is it today?    Quel jour sommes-nous ?
It's Monday.             Nous sommes lundi.</pre>`,

    { type: "input", q: "Complete : « It's ___ today. » (Nous sommes vendredi.)", a: ["friday"], ph: "un jour", exp: "Friday = vendredi, avec une majuscule." },
    { type: "qcm", q: "Quel est le bon ordre : lundi, mardi, mercredi ?", opts: ["Monday, Tuesday, Wednesday", "Monday, Wednesday, Tuesday", "Tuesday, Monday, Wednesday", "Sunday, Monday, Tuesday"], a: 0, exp: "Monday, Tuesday, Wednesday : lundi, mardi, mercredi." },
    { type: "input", q: "Traduis « aout » en anglais.", a: ["august"], ph: "un mois", exp: "August = aout." },
    { type: "vf", q: "En anglais, les jours de la semaine prennent une majuscule.", a: true, exp: "Oui : Monday, Tuesday... toujours avec une majuscule." },
    { type: "qcm", q: "Quel mot signifie <strong>troisieme</strong> (3rd) ?", opts: ["thirty", "three", "third", "thirteen"], a: 2, exp: "third = troisieme. three = trois, thirteen = treize." },
    { type: "input", q: "Complete : « My birthday is ___ May. » (en mai)", a: ["in"], ph: "in / on", exp: "On utilise IN devant un mois : in May." },
    { type: "qcm", q: "Comment complete-t-on : « I work ___ Monday. » (lundi) ?", opts: ["in", "at", "on", "to"], a: 2, exp: "On utilise ON devant un jour : on Monday." },
    { type: "input", q: "Traduis « premier » (ordinal, 1st) en anglais.", a: ["first"], ph: "ordinal", exp: "first = premier." },
    { type: "vf", q: "« December » signifie decembre.", a: true, exp: "December = decembre, dernier mois de l'annee." },
    { type: "qcm", q: "Comment lit-on la date « May 5th » ?", opts: ["May the fifth", "May five", "The five May", "Fifth May day"], a: 0, exp: "On lit May the fifth = le 5 mai." },
    { type: "input", q: "Complete l'ordinal : « the ___ of June » pour le 2 juin.", a: ["second"], ph: "2nd", exp: "second = deuxieme (2nd)." },
    { type: "qcm", q: "Quelle question demande la date du jour ?", opts: ["What day is it?", "What's the date today?", "How are you?", "Where is it?"], a: 1, exp: "What's the date today? = Quelle est la date aujourd'hui ?" },
    { type: "vf", q: "« On Mondays » veut dire « chaque lundi ».", a: true, exp: "Le s marque l'habitude : on Mondays = tous les lundis." },
    { type: "input", q: "Traduis « juillet » en anglais.", a: ["july"], ph: "un mois", exp: "July = juillet." }
  ],
  final: {
    title: "Exercice final — Le calendrier de Tom",
    intro: `<p>Lis ce petit texte, puis reponds :</p>
<pre class="pseudo">Tom has a busy week. He works on Monday and Tuesday.
On Wednesday he plays football. His birthday is on the tenth of April.
Today is Friday, the fifth of April.</pre>`,

      { type: "input", q: "En quel mois est l'anniversaire de Tom ? (en anglais)", a: ["april"], ph: "un mois", exp: "His birthday is on the tenth of April." },
      { type: "input", q: "Quel jour sommes-nous dans le texte ? (en anglais)", a: ["friday"], ph: "un jour", exp: "Today is Friday." },
      { type: "vf", q: "L'anniversaire de Tom est le 10 avril.", a: true, exp: "the tenth of April = le 10 avril." }
    ],
    solution: `<p>Tom travaille lundi et mardi (<em>on Monday and Tuesday</em>), joue au football le mercredi (<em>on Wednesday</em>), et son anniversaire est le 10 avril (<em>the tenth of April</em>). Le texte se passe un vendredi 5 avril.</p>
<p>Retiens : <strong>on</strong> + jour, <strong>in</strong> + mois, et l'ordinal (<em>tenth</em>, <em>fifth</em>) pour la date.</p>`
  }
