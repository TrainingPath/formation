  theory: `
<h3>1. Demander l'heure</h3>
<p>Pour demander l'heure, on dit : <strong>What time is it?</strong> (Quelle heure est-il ?). Pour répondre, on commence par <strong>It is…</strong> (ou <strong>It's…</strong>).</p>
<pre class="pseudo">What time is it?  → Quelle heure est-il ?
It is three o'clock. → Il est trois heures.
It's ten o'clock.    → Il est dix heures.</pre>
<h3>2. Les heures pile : o'clock</h3>
<p>Pour une heure pile (sans minutes), on ajoute <strong>o'clock</strong> après le nombre. Ce mot ne s'emploie QUE pour les heures rondes.</p>
<pre class="pseudo">It's one o'clock.    → Il est une heure.
It's seven o'clock.  → Il est sept heures.
It's twelve o'clock. → Il est midi (ou minuit).</pre>
<h3>3. Les minutes : past et to</h3>
<p>Pour les minutes, l'anglais courant utilise deux mots : <strong>past</strong> (après l'heure) et <strong>to</strong> (avant l'heure suivante).</p>
<pre class="pseudo">past → « et » (minutes APRÈS l'heure)   to → « moins » (minutes AVANT l'heure)
It's ten past three.   → Il est trois heures dix.       (10 min après 3h)
It's quarter past six. → Il est six heures et quart.    (quarter = quart)
It's half past four.   → Il est quatre heures et demie. (half = demi)
It's ten to five.      → Il est cinq heures moins dix.  (10 min avant 5h)
It's quarter to nine.  → Il est neuf heures moins le quart.</pre>
<div class="tip">quarter = quart (15 min), half = demi (30 min). « past » = et (on est après l'heure), « to » = moins (on va vers l'heure suivante).</div>
<h3>4. La méthode simple des chiffres</h3>
<p>Plus facile encore : on peut dire l'heure comme sur un écran digital, en énonçant l'heure puis les minutes.</p>
<pre class="pseudo">7:15 → It's seven fifteen.   (sept heures quinze)
9:30 → It's nine thirty.      (neuf heures trente)
10:45 → It's ten forty-five.  (dix heures quarante-cinq)</pre>
<div class="warn">Piège : en anglais courant, on utilise beaucoup les heures de 1 à 12, pas de 0 à 23. Pour préciser le matin ou l'après-midi, on ajoute a.m. (matin) ou p.m. (après-midi/soir). « 3 p.m. » = 15h.</div>
<h3>5. Les moments de la journée</h3>
<pre class="pseudo">morning   → matin       in the morning   → le matin
afternoon → après-midi  in the afternoon → l'après-midi
evening   → soir        in the evening   → le soir
night     → nuit        at night         → la nuit
noon      → midi        midnight         → minuit</pre>
<div class="warn">Attention aux prépositions : on dit « in the morning / afternoon / evening » mais « AT night » (avec at, pas in). C'est une exception à mémoriser.</div>`,

    { type: "input", q: "Comment dit-on « le matin » ? in the ___ .", a: ["morning"], ph: "un mot", exp: "in the morning = le matin." },

    { type: "input", q: "Comment dit-on « l'après-midi » ? in the ___ .", a: ["afternoon"], ph: "un mot", exp: "in the afternoon = l'après-midi." },

    { type: "qcm", q: "« It's ten to five » signifie…", opts: ["5h10", "4h50", "5h50", "4h10"], a: 1, exp: "ten to five = 5h moins dix = 4h50." }

    solution: `<p>Le récapitulatif de l'heure :</p>
<pre class="pseudo">Question : What time is it?   Réponse : It's ...
Heure pile : It's three o'clock.        (o'clock = heure pile)
Minutes : past (et) / to (moins)
   ten past three = 3h10     ten to five = 4h50

<p>Deux méthodes pour l'heure : past/to (plus traditionnel) ou les chiffres à la suite (plus simple). Choisis celle qui te met à l'aise, et mémorise l'exception « at night ».</p>`
