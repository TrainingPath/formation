<script>
var DAY = {
  num: 1,
  title: "L'alphabet et les sons de l'anglais",
  subtitle: "Apprendre à nommer les lettres et à repérer les sons qui n'existent pas en français.",
  theory: `
<h3>1. Pourquoi commencer par l'alphabet ?</h3>
<p>En anglais, on épelle très souvent : pour donner son nom de famille, son adresse mail, un mot difficile au téléphone. <strong>Épeler</strong>, c'est dire les lettres une par une (en anglais : <em>to spell</em>). Les lettres sont les mêmes qu'en français (26 lettres, de A à Z), mais leur <strong>nom</strong> se prononce différemment. Apprendre à les dire est donc la toute première brique.</p>
<h3>2. Le nom des 26 lettres</h3>
<p>Voici comment se prononce chaque lettre. Entre crochets, une prononciation approchée « à la française » pour t'aider à démarrer :</p>
<pre class="pseudo">A [ei]     B [bi]     C [si]     D [di]      // A se dit « ei », pas « a »
E [i]      F [ef]     G [dji]    H [eitch]   // attention : E se dit « i » !
I [aï]     J [djei]   K [kei]    L [el]      // I se dit « aï », J se dit « djei »
M [em]     N [en]     O [ow]     P [pi]      // O se dit « ow », P se dit « pi »
Q [kiou]   R [ar]     S [ess]    T [ti]      // R n'est pas roulé
U [iou]    V [vi]     W [dabeul-you]         // W = « double u » en anglais
X [ex]     Y [waï]    Z [zed]               // Z = « zed » (« zi » aux USA)</pre>
<div class="tip">Piège classique : la lettre <strong>E</strong> anglaise se dit « i », et la lettre <strong>I</strong> se dit « aï ». Beaucoup de francophones les inversent. Répète : E = « i », I = « aï ».</div>
<h3>3. Voyelles et consonnes</h3>
<p>Comme en français, il y a des <strong>voyelles</strong> (les lettres a, e, i, o, u) et des <strong>consonnes</strong> (toutes les autres). Cette distinction servira dès le jour 5 pour choisir entre <em>a</em> et <em>an</em>.</p>
<h3>4. Des sons qui n'existent pas en français</h3>
<p>L'anglais a quelques sons nouveaux pour une oreille française. Le plus célèbre est le son écrit <strong>th</strong>. On le trouve dans <em>the</em> (le/la), <em>this</em> (ceci), <em>thank you</em> (merci). On le produit en plaçant le bout de la langue entre les dents.</p>
<pre class="pseudo">the      → « le / la »          // th « doux », langue entre les dents
this     → « ceci »             // même son th
three    → « trois »            // th « souffle », langue entre les dents
thank you → « merci »           // t-h et non « s » ni « z »</pre>
<div class="warn">Ne remplace pas le <strong>th</strong> par un « z » ou un « s ». « I think » (je pense) ne se dit pas « I sink » (je coule) ! Le son th demande de sortir un peu la langue.</div>
<h3>5. Le H se prononce (souvent)</h3>
<p>En français, le H est muet. En anglais, il s'entend : on souffle un peu d'air. <em>Hello</em> (bonjour), <em>house</em> (maison), <em>happy</em> (heureux) commencent par un vrai « h » soufflé.</p>
<div class="tip">Pour t'entraîner au H : place ta main devant ta bouche et sens le souffle en disant « happy », « house », « hot ».</div>
<h3>6. Épeler un mot</h3>
<p>Quand on épelle, on dit chaque lettre l'une après l'autre. Par exemple le prénom <em>Tom</em> s'épelle « ti - ow - em ». Le mot <em>cat</em> (chat) s'épelle « si - ei - ti ». Entraîne-toi à épeler ton prénom à voix haute.</p>`,
  exercises: [
    { type: "qcm", q: "Comment se prononce le nom de la lettre <strong>E</strong> en anglais ?", opts: ["« e » comme en français", "« i »", "« é »", "« eu »"], a: 1, exp: "La lettre E anglaise se dit « i ». Ne la confonds pas avec I qui se dit « aï »." },
    { type: "qcm", q: "Comment se prononce le nom de la lettre <strong>I</strong> ?", opts: ["« i »", "« aï »", "« é »", "« euil »"], a: 1, exp: "I se dit « aï ». C'est l'inverse du français : E = « i », I = « aï »." },
    { type: "vf", q: "En anglais, la lettre W se nomme « double u » (« double u »).", a: true, exp: "W se dit « dabeul-you », littéralement « double u »." },
    { type: "input", q: "Complète : la lettre H se prononce « ___tch » (écris le mot entier tel qu'on l'entend).", a: ["eitch", "aitch"], ph: "un mot", exp: "H se nomme « eitch »." },
    { type: "qcm", q: "Le son écrit <strong>th</strong> (comme dans <em>the</em>) se fait…", opts: ["en fermant les lèvres", "en mettant la langue entre les dents", "au fond de la gorge", "avec le nez"], a: 1, exp: "On place le bout de la langue entre les dents pour le son th." },
    { type: "vf", q: "En anglais, le H de <em>hello</em> est muet, comme en français.", a: false, exp: "Faux : le H s'entend, on souffle de l'air. « Hello » commence par un vrai h." },
    { type: "input", q: "Combien de lettres compte l'alphabet anglais ? (écris le nombre en chiffres)", a: ["26"], ph: "un nombre", exp: "26 lettres, exactement comme en français." },
    { type: "qcm", q: "Quelle lettre se prononce « djei » ?", opts: ["G", "J", "Y", "Z"], a: 1, exp: "J se dit « djei ». G, lui, se dit « dji »." },
    { type: "input", q: "Complète : les voyelles sont a, e, i, o et ___ .", a: ["u"], ph: "une lettre", exp: "Les voyelles sont a, e, i, o, u." },
    { type: "qcm", q: "Comment épelle-t-on le prénom <em>Tom</em> ?", opts: ["ti - ow - em", "té - o - èm", "ta - om", "ti - o - me"], a: 0, exp: "T = « ti », O = « ow », M = « em »." },
    { type: "vf", q: "Le mot anglais <em>think</em> (penser) se prononce comme « sink ».", a: false, exp: "Faux : think a le son th (langue entre les dents), sink commence par un vrai « s »." },
    { type: "input", q: "Quelle lettre se prononce « zed » (au Royaume-Uni) ? Écris la lettre.", a: ["z"], ph: "une lettre", exp: "Z se dit « zed » au Royaume-Uni (« zi » aux États-Unis)." },
    { type: "qcm", q: "Laquelle de ces lettres est une <strong>consonne</strong> ?", opts: ["A", "E", "T", "O"], a: 2, exp: "T est une consonne ; a, e, o sont des voyelles." },
    { type: "qcm", q: "Comment se prononce le nom de la lettre <strong>A</strong> ?", opts: ["« a »", "« ei »", "« o »", "« an »"], a: 1, exp: "A se dit « ei » en anglais, pas « a »." },
    { type: "vf", q: "Épeler un mot, c'est dire ses lettres une par une.", a: true, exp: "Oui : « to spell » signifie épeler, lettre après lettre." }
  ],
  final: {
    title: "Exercice final — Épeler et reconnaître les sons",
    intro: `<p>Tu réunis ici tout ce que tu as vu : le nom des lettres, le son th et le h soufflé. Lis chaque question à voix haute avant de répondre.</p>`,
    questions: [
      { type: "qcm", q: "On te dit « aï » : de quelle lettre s'agit-il ?", opts: ["E", "I", "A", "Y"], a: 1, exp: "« aï » = la lettre I." },
      { type: "input", q: "Épelle le mot <em>cat</em> (chat) : quelle est la PREMIÈRE lettre ? (écris la lettre)", a: ["c"], ph: "une lettre", exp: "C - A - T : la première lettre est C, qui se dit « si »." },
      { type: "vf", q: "Le mot <em>the</em> contient le son th (langue entre les dents).", a: true, exp: "Oui, the est l'exemple de base du son th doux." },
      { type: "qcm", q: "Dans quel mot le H se souffle-t-il vraiment ?", opts: ["house", "hour (h muet)", "honest (h muet)", "aucun"], a: 0, exp: "Dans « house » le h s'entend. (Quelques rares mots ont un h muet, mais c'est l'exception.)" },
      { type: "input", q: "Complète : la lettre E se prononce « ___ ». (écris ce qu'on entend)", a: ["i"], ph: "un son", exp: "E se dit « i ». Retiens bien : E = « i », I = « aï »." }
    ],
    solution: `<p>Récapitulatif des points clés du jour :</p>
<pre class="pseudo">E se dit « i »        I se dit « aï »        // ne pas les inverser !
W = « double u »      Z = « zed »           // noms particuliers
th → langue entre les dents (the, this, three, thank you)
h → soufflé (hello, house, happy)</pre>
<p>Ces sons se travaillent à voix haute, tous les jours. Épelle ton prénom, ton nom, le nom de ta ville. La bouche a besoin de répétition pour prendre l'habitude des sons anglais.</p>`
  }
};
</script>
