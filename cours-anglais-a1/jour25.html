<script>
var DAY = {
  num: 25,
  title: "Faire des courses, les prix",
  subtitle: "Acheter, demander un prix et payer en anglais.",
  theory: `
<h3>1. Le vocabulaire des courses</h3>
<pre class="pseudo">shop / store   magasin        price     prix
money          argent         cheap     bon marche
customer       client         expensive cher
shop assistant vendeur        change     monnaie
cash           especes        receipt    ticket de caisse</pre>
<h3>2. Demander un prix</h3>
<pre class="pseudo">How much is it?              Combien ca coute ? (un objet)
How much are they?           Combien coutent-ils ? (pluriel)
How much is this shirt?      Combien coute cette chemise ?
It's five pounds.            Ca coute cinq livres.
They're ten euros.           Ils coutent dix euros.</pre>
<div class="tip"><strong>How much</strong> sert a demander une quantite d'argent (un prix). Avec un objet singulier : <em>is</em> ; au pluriel : <em>are</em>.</div>
<h3>3. Dire les prix</h3>
<pre class="pseudo">£5      five pounds          livres (Royaume-Uni)
$10     ten dollars          dollars
€3.50   three euros fifty    trois euros cinquante
99p     ninety-nine pence    (p = pence, la petite monnaie britannique)</pre>
<h3>4. Acheter : phrases utiles</h3>
<pre class="pseudo">Can I help you?             Je peux vous aider ?
I'd like a coffee, please.  Je voudrais un cafe, s'il vous plait.
I want two apples.          Je veux deux pommes.
Here you are.               Voila / Tenez.
That's twelve euros.        Ca fait douze euros.
Here's your change.         Voici votre monnaie.</pre>
<div class="warn"><strong>I'd like</strong> (= I would like) est plus poli que <em>I want</em>. Dans un magasin, prefere <em>I'd like...</em>.</div>
<h3>5. Un mini-dialogue</h3>
<pre class="pseudo">- Can I help you?              Je peux vous aider ?
- Yes, how much is this bag?   Oui, combien coute ce sac ?
- It's twenty pounds.          Il coute vingt livres.
- OK, I'll take it.            D'accord, je le prends.</pre>`,
  exercises: [
    { type: "qcm", q: "Comment demande-t-on le prix d'UN objet ?", opts: ["How many is it?", "How much is it?", "How old is it?", "How much are it?"], a: 1, exp: "How much is it? pour un prix (objet singulier)." },
    { type: "input", q: "Complete : « How much ___ they? » (pluriel)", a: ["are"], ph: "is / are", exp: "Pluriel : How much are they?" },
    { type: "qcm", q: "Que veut dire « expensive » ?", opts: ["bon marche", "cher", "gratuit", "vieux"], a: 1, exp: "expensive = cher. cheap = bon marche." },
    { type: "input", q: "Traduis « bon marche » en anglais.", a: ["cheap"], ph: "un adjectif", exp: "cheap = bon marche." },
    { type: "vf", q: "« I'd like a coffee » est plus poli que « I want a coffee ».", a: true, exp: "I'd like (I would like) est la forme polie." },
    { type: "qcm", q: "Comment dit-on « 5 livres » (£5) ?", opts: ["five euros", "five dollars", "five pounds", "five pence"], a: 2, exp: "£ = pounds : five pounds." },
    { type: "input", q: "Complete poliment : « ___ like two apples, please. » (Je voudrais)", a: ["i'd", "i would"], ph: "I'd", exp: "I'd like = je voudrais." },
    { type: "qcm", q: "Que repond un vendeur pour proposer son aide ?", opts: ["How are you?", "Can I help you?", "Where are you?", "How old are you?"], a: 1, exp: "Can I help you? = Je peux vous aider ?" },
    { type: "input", q: "Traduis « argent » (money/change) : le mot pour « la monnaie qu'on rend » est ___.", a: ["change"], ph: "un mot", exp: "change = la monnaie rendue." },
    { type: "vf", q: "« How much » sert a demander un prix.", a: true, exp: "How much + is/are pour un prix." },
    { type: "qcm", q: "Traduis « Ca fait douze euros. »", opts: ["That's twelve euros.", "It's twelve o'clock.", "There are twelve euros.", "How much twelve euros."], a: 0, exp: "That's twelve euros = ca fait douze euros." },
    { type: "input", q: "Complete : « ___ you are. » (Voila / Tenez, en tendant l'objet)", a: ["here"], ph: "un mot", exp: "Here you are = Tenez / Voila." },
    { type: "qcm", q: "Que veut dire « receipt » ?", opts: ["client", "ticket de caisse", "vendeur", "magasin"], a: 1, exp: "receipt = ticket de caisse." },
    { type: "vf", q: "« cheap » signifie « cher ».", a: false, exp: "Faux : cheap = bon marche ; expensive = cher." },
    { type: "input", q: "Complete : « How much is ___ shirt? » (cette chemise — 'this' ou 'that')", a: ["this", "that"], ph: "this/that", exp: "How much is this shirt? = Combien coute cette chemise ?" }
  ],
  final: {
    title: "Exercice final — Au magasin",
    intro: `<p>Lis le dialogue, puis reponds :</p>
<pre class="pseudo">Assistant: Can I help you?
Emma: Yes, how much is this bag?
Assistant: It's twenty-five pounds.
Emma: And how much are these shoes?
Assistant: They're forty pounds. But today they're cheap: thirty pounds.
Emma: OK, I'd like the bag and the shoes, please. Here you are.
Assistant: Thank you. Here's your change.</pre>`,

      { type: "vf", q: "Emma achete le sac ET les chaussures.", a: true, exp: "I'd like the bag and the shoes." },
      { type: "qcm", q: "Que dit le vendeur en rendant la monnaie ?", opts: ["Can I help you?", "Here's your change.", "How much is it?", "Here you are."], a: 1, exp: "Here's your change = voici votre monnaie." },
      { type: "input", q: "Complete la question d'Emma : « How much ___ these shoes? » (pluriel)", a: ["are"], ph: "is / are", exp: "Pluriel : How much are these shoes?" }
    ],
    solution: `<p>Emma demande le prix du sac (<em>How much is this bag?</em> -> 25 livres) puis des chaussures (<em>How much are these shoes?</em> -> 40, en promo a 30). Elle les prend poliment (<em>I'd like the bag and the shoes</em>) et le vendeur rend la monnaie (<em>Here's your change</em>).</p>
<p>Retiens : <strong>How much is/are...?</strong> pour un prix, <strong>I'd like...</strong> pour acheter poliment, et les mots cheap / expensive.</p>`
