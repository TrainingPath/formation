<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jour 18</title><link rel="stylesheet" href="style.css"></head><body>
<script>
var DAY = {
  num: 18,
  title: "La nourriture ; I like / I don't like",
  subtitle: "Nommer des aliments et exprimer ses gouts.",
  theory: `
<h3>1. Le vocabulaire de la nourriture</h3>
<pre class="pseudo">bread     pain          water     eau
cheese    fromage       milk      lait
apple     pomme         coffee    cafe
banana    banane        tea       the
egg       oeuf          juice     jus
rice      riz           meat      viande
fish      poisson       chicken   poulet
vegetable legume        fruit     fruit</pre>
<h3>2. Exprimer ses gouts avec « like »</h3>
<p>Le verbe <strong>like</strong> = aimer (bien). A la forme affirmative :</p>
<pre class="pseudo">I like apples.      J'aime les pommes.
I like coffee.      J'aime le cafe.
You like fish.      Tu aimes le poisson.</pre>
<h3>3. La forme negative : I don't like</h3>
<p>Pour dire « je n'aime pas », on utilise l'auxiliaire <strong>don't</strong> (= do not) devant le verbe.</p>
<pre class="pseudo">I don't like fish.        Je n'aime pas le poisson.
I do not like tea.        Je n'aime pas le the. (forme longue)
We don't like meat.       Nous n'aimons pas la viande.</pre>
<div class="warn">A la 3e personne (he, she, it), on utilise <strong>doesn't</strong> et le verbe perd son -s : <em>He doesn't like eggs.</em> = Il n'aime pas les oeufs.</div>
<h3>4. Poser une question : Do you like...?</h3>
<pre class="pseudo">Do you like coffee?      Aimes-tu le cafe ?
Yes, I do.               Oui. (reponse courte)
No, I don't.            Non.
Does she like fish?      Aime-t-elle le poisson ?
Yes, she does.           Oui.</pre>
<div class="tip">Autres verbes de gout utiles : <strong>love</strong> (adorer), <strong>hate</strong> (detester), et <em>I like it a lot</em> (j'aime beaucoup).</div>
<h3>5. A / an devant les aliments comptables</h3>
<pre class="pseudo">an apple    une pomme   (an devant une voyelle)
a banana    une banane
an egg      un oeuf</pre>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on <strong>fromage</strong> en anglais ?", opts: ["bread", "cheese", "meat", "milk"], a: 1, exp: "cheese = fromage. bread = pain." },
    { type: "input", q: "Complete : « I ___ apples. » (J'aime les pommes.)", a: ["like"], ph: "verbe", exp: "I like = j'aime." },
    { type: "qcm", q: "Comment dit-on « je n'aime pas le poisson » ?", opts: ["I not like fish", "I don't like fish", "I no like fish", "I like not fish"], a: 1, exp: "On utilise don't : I don't like fish." },
    { type: "input", q: "Complete : « He ___ like eggs. » (Il n'aime pas les oeufs.)", a: ["doesn't", "does not"], ph: "negation", exp: "A la 3e personne : doesn't." },
    { type: "vf", q: "« I don't like » veut dire « je n'aime pas ».", a: true, exp: "don't = do not, la negation." },
    { type: "qcm", q: "Traduis « poulet ».", opts: ["fish", "meat", "chicken", "rice"], a: 2, exp: "chicken = poulet." },
    { type: "input", q: "Complete : « ___ you like coffee? » (Aimes-tu le cafe ?)", a: ["do"], ph: "auxiliaire", exp: "Do you like...? pour poser la question." },
    { type: "qcm", q: "Reponse courte a « Do you like tea? » quand la reponse est oui :", opts: ["Yes, I like.", "Yes, I do.", "Yes, I am.", "Yes, I don't."], a: 1, exp: "Yes, I do. est la reponse courte correcte." },
    { type: "input", q: "Ajoute l'article : « ___ egg » (un oeuf).", a: ["an"], ph: "a / an", exp: "an devant une voyelle : an egg." },
    { type: "vf", q: "A la 3e personne, on ecrit « He don't like ».", a: false, exp: "Faux : c'est He doesn't like." },
    { type: "qcm", q: "Quel verbe signifie « adorer » ?", opts: ["hate", "like", "love", "eat"], a: 2, exp: "love = adorer. hate = detester." },
    { type: "input", q: "Traduis « eau » en anglais.", a: ["water"], ph: "une boisson", exp: "water = eau." },
    { type: "qcm", q: "Que veut dire « I hate meat » ?", opts: ["J'aime la viande", "Je deteste la viande", "Je mange de la viande", "Je veux de la viande"], a: 1, exp: "hate = detester." },
    { type: "vf", q: "« Does she like fish? » est une question correcte.", a: true, exp: "Oui : does + she + like (sans -s) + fish." },
    { type: "input", q: "Complete : « I don't like ___. » avec le mot pour « lait ».", a: ["milk"], ph: "une boisson", exp: "milk = lait." }
  ],
  final: {
    title: "Exercice final — Les gouts de Jack",
    intro: `<p>Lis ce petit texte, puis reponds :</p>
<pre class="pseudo">Hi, I'm Jack. I like fruit very much. I love apples and bananas.
I like coffee in the morning. But I don't like fish and I hate eggs.
My sister doesn't like coffee. She likes tea.</pre>`,
    questions: [
      { type: "qcm", q: "Qu'est-ce que Jack adore ?", opts: ["fish and eggs", "apples and bananas", "tea and milk", "meat"], a: 1, exp: "I love apples and bananas." },
      { type: "vf", q: "Jack aime le poisson.", a: false, exp: "I don't like fish : il n'aime pas le poisson." },
      { type: "input", q: "Que boit Jack le matin ? (en anglais)", a: ["coffee"], ph: "une boisson", exp: "I like coffee in the morning." },
      { type: "qcm", q: "Que boit sa soeur ?", opts: ["coffee", "tea", "juice", "water"], a: 1, exp: "She likes tea." },
      { type: "vf", q: "Jack deteste les oeufs.", a: true, exp: "I hate eggs = je deteste les oeufs." }
    ],
    solution: `<p>Jack adore les fruits, en particulier les pommes et les bananes (<em>I love apples and bananas</em>). Il boit du cafe le matin, mais il n'aime pas le poisson et deteste les oeufs. Sa soeur, elle, prefere le the (<em>She likes tea</em>).</p>
<p>Observe : <em>like</em> (affirmatif), <em>don't like</em> et <em>doesn't like</em> (negatif a la 3e personne).</p>`
  }
};
</script>

var ECRITURE = {

  items: [
  { id: "en-a1-j18", title: "Ce que tu aimes manger", level: 1,
    statement: "Ecris 3 ou 4 phrases sur tes gouts alimentaires en anglais : deux aliments que tu aimes et deux que tu n'aimes pas. Utilise <em>I like</em>, <em>I love</em> et <em>I don't like</em>.",
    hints: [
      "Affirmatif : I like + aliment (I like rice).",
      "Pour insister : I love + aliment (I love cheese).",
      "Negatif : I don't like + aliment (I don't like fish)."

    solution: "I like bread and cheese. I love apples.\nI don't like fish and I don't like eggs.\nI like coffee, but I don't like tea.\n\nTraduction : J'aime le pain et le fromage. J'adore les pommes. Je n'aime pas le poisson ni les oeufs. J'aime le cafe, mais je n'aime pas le the.",
    note: "N'oublie pas DON'T devant le verbe pour la negation, et garde le verbe like a l'infinitif (sans -s a la premiere personne)." }
  ]
};
</script>
