<script>
var DAY = {
  num: 22,
  title: "Le présent continu (be + -ing)",
  subtitle: "Decrire une action en train de se derouler maintenant.",
  theory: `
<h3>1. A quoi sert le present continu ?</h3>
<p>Le present continu decrit une action <strong>en train de se passer maintenant</strong>. En francais : « je suis en train de... » ou simplement « je ... maintenant ».</p>
<pre class="pseudo">I am eating.       Je suis en train de manger. / Je mange (maintenant).
She is sleeping.   Elle dort (en ce moment).</pre>
<h3>2. La construction : be + verbe-ing</h3>
<p>On conjugue <strong>be</strong> (am / is / are) selon le sujet, puis on ajoute le verbe avec <strong>-ing</strong>.</p>
<pre class="pseudo">I        am     working.     I am working.      Je travaille.
You/We   are    working.     You are working.   Tu travailles.
He/She   is     working.     He is working.     Il travaille.
They     are    working.     They are playing.  Ils jouent.</pre>
<div class="tip">On contracte : <em>I'm working</em>, <em>she's reading</em>, <em>they're playing</em>.</div>
<h3>3. Les regles du -ing</h3>
<pre class="pseudo">play  -> playing     regle generale : on ajoute -ing
make  -> making      verbe en -e muet : on enleve le e
run   -> running     voyelle + consonne : on double la consonne
sit   -> sitting     idem : sitting, swimming</pre>
<h3>4. La forme negative</h3>
<pre class="pseudo">I am not eating.        Je ne mange pas (maintenant).
She isn't sleeping.     Elle ne dort pas.
They aren't playing.    Ils ne jouent pas.</pre>
<h3>5. La question</h3>
<p>On met <strong>be</strong> devant le sujet.</p>
<pre class="pseudo">Are you working?      Es-tu en train de travailler ?
Yes, I am.            Oui.
No, I'm not.         Non.
What is she doing?    Que fait-elle (maintenant) ?
She is reading.       Elle lit.</pre>
<div class="warn">Ne jamais oublier le verbe <strong>be</strong> ! On ne dit pas « I working » mais <em>I am working</em>. Sans be, la phrase est fausse.</div>`,
  exercises: [
    { type: "qcm", q: "Quelle phrase est au present continu correct ?", opts: ["I working now.", "I am working now.", "I am work now.", "I working am now."], a: 1, exp: "be (am) + verbe-ing : I am working." },
    { type: "input", q: "Complete : « She ___ reading. » (auxiliaire be)", a: ["is", "'s"], ph: "am/is/are", exp: "She is reading (3e personne : is)." },
    { type: "qcm", q: "Quel est le -ing de « run » ?", opts: ["runing", "running", "runnning", "runs"], a: 1, exp: "voyelle + consonne : on double le n -> running." },
    { type: "input", q: "Ecris le -ing de « make ».", a: ["making"], ph: "verbe-ing", exp: "make perd son e muet : making." },
    { type: "vf", q: "« They are playing » signifie « ils jouent (maintenant) ».", a: true, exp: "be + playing : action en cours." },
    { type: "qcm", q: "Complete : « We ___ watching TV. »", opts: ["am", "is", "are", "be"], a: 2, exp: "We -> are : We are watching TV." },
    { type: "input", q: "Complete la contraction : « ___ eating. » (Je mange, contracte)", a: ["i'm", "im"], ph: "I am contracte", exp: "I am -> I'm : I'm eating." },
    { type: "qcm", q: "Quelle est la forme negative de « She is sleeping » ?", opts: ["She not sleeping.", "She isn't sleeping.", "She don't sleeping.", "She no sleeping."], a: 1, exp: "be + not : She isn't sleeping." },
    { type: "input", q: "Complete la question : « ___ you working? » (Es-tu en train de travailler ?)", a: ["are"], ph: "am/is/are", exp: "Are you working? (you -> are)." },
    { type: "vf", q: "« I working now » est correct.", a: false, exp: "Faux : il manque be. Il faut I am working now." },
    { type: "qcm", q: "Quel est le -ing de « sit » ?", opts: ["siting", "sitting", "seating", "sits"], a: 1, exp: "on double le t : sitting." },
    { type: "input", q: "Complete : « He ___ not eating. » (auxiliaire)", a: ["is", "'s"], ph: "am/is/are", exp: "He is not eating." },
    { type: "qcm", q: "Reponse courte a « Are you reading? » (oui) :", opts: ["Yes, I read.", "Yes, I am.", "Yes, I do.", "Yes, I'm."], a: 1, exp: "Yes, I am. (on ne contracte pas dans la reponse courte affirmative)." },
    { type: "vf", q: "Au present continu on ajoute -ing au verbe apres be.", a: true, exp: "be + verbe-ing est la structure." },
    { type: "input", q: "Traduis « Ils jouent (maintenant) » : « They ___ playing. »", a: ["are", "'re"], ph: "am/is/are", exp: "They are playing." }
  ],
  final: {
    title: "Exercice final — Dans le parc",
    intro: `<p>Lis la scene, puis reponds :</p>
<pre class="pseudo">Look at the park now! Tom is playing football with his friends.
Anna is reading a book under a tree. Two children are running.
Their mother is sitting on a bench. It isn't raining, the sun is shining.</pre>`,
    questions: [
      { type: "qcm", q: "Que fait Tom en ce moment ?", opts: ["He is reading.", "He is playing football.", "He is running.", "He is sitting."], a: 1, exp: "Tom is playing football." },
      { type: "input", q: "Que fait Anna ? Complete : « She is ___ a book. »", a: ["reading"], ph: "verbe-ing", exp: "Anna is reading a book." },
      { type: "vf", q: "Il pleut dans le parc.", a: false, exp: "It isn't raining : il ne pleut pas." },
      { type: "qcm", q: "Que fait la mere ?", opts: ["She is running.", "She is reading.", "She is sitting on a bench.", "She is playing."], a: 2, exp: "Their mother is sitting on a bench." },
      { type: "input", q: "Complete : « The sun ___ shining. » (auxiliaire be)", a: ["is", "'s"], ph: "am/is/are", exp: "The sun is shining." }
    ],
    solution: `<p>Dans le parc, maintenant : Tom joue au football (<em>is playing</em>), Anna lit un livre (<em>is reading</em>), deux enfants courent (<em>are running</em>), leur mere est assise sur un banc (<em>is sitting</em>). Il ne pleut pas (<em>isn't raining</em>) et le soleil brille (<em>is shining</em>).</p>
<p>Structure a retenir : <strong>be (am/is/are) + verbe-ing</strong> pour une action en cours.</p>`
  }
};
</script>
