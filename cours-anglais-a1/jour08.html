  theory: `
<h3>1. Deux façons de dire « avoir »</h3>
<p>Pour dire qu'on possède quelque chose, l'anglais a deux structures : <strong>have got</strong> et <strong>have</strong> (tout court). Les deux veulent dire « avoir ». <em>Have got</em> est très courant à l'oral, surtout au Royaume-Uni. Aujourd'hui on se concentre sur <strong>have got / has got</strong>.</p>
<h3>2. La conjugaison de have got</h3>
<p>La forme change selon le sujet : <strong>have got</strong> pour la plupart, mais <strong>has got</strong> pour he, she, it.</p>
<pre class="pseudo">I    have got   → j'ai
you  have got   → tu as / vous avez
he   has got    → il a
she  has got    → elle a
it   has got    → il/elle a (chose)
we   have got   → nous avons
they have got   → ils/elles ont</pre>
<div class="warn">Piège essentiel : avec <strong>he, she, it</strong>, on dit <strong>has</strong> (pas have). « She HAS got a cat », jamais « she have got ». C'est la même logique que le -s de la 3e personne qu'on verra au jour 12.</div>
<h3>3. Les contractions</h3>
<p>On colle très souvent le pronom et have/has :</p>
<pre class="pseudo">I have got   → I've got       we have got  → we've got
you have got → you've got     they have got→ they've got
he has got   → he's got       she has got  → she's got
it has got   → it's got</pre>
<div class="tip">« he's got » peut vouloir dire « he is » OU « he has got » : c'est le contexte qui tranche. « He's got a car » = il a une voiture (has got).</div>
<h3>4. Exemples utiles</h3>
<pre class="pseudo">I have got a dog.        → J'ai un chien.
She has got blue eyes.   → Elle a les yeux bleus.
We have got two cats.    → Nous avons deux chats.
He has got a brother.    → Il a un frère.</pre>
<h3>5. La négation et la question (aperçu)</h3>
<p>Pour dire « ne pas avoir », on ajoute <strong>not</strong> après have/has :</p>
<pre class="pseudo">I have not got a car.  = I haven't got a car.   → Je n'ai pas de voiture.
She has not got a pet. = She hasn't got a pet.   → Elle n'a pas d'animal.
Have you got a pen?    → As-tu un stylo ?        // question : have devant le sujet
Has he got a sister?   → A-t-il une soeur ?</pre>`,
