<script>
var DAY = {
  num: 12,
  title: "Le présent simple : affirmatif",
  subtitle: "Parler de ses habitudes, et surtout le fameux -s à la 3e personne.",
  theory: `
<h3>1. À quoi sert le présent simple ?</h3>
<p>Le <strong>présent simple</strong> décrit des <strong>habitudes</strong>, des choses vraies en général ou des faits. « Je travaille », « Elle aime le café », « L'eau bout à 100 degrés ». C'est le temps de base pour parler de ce qu'on fait tous les jours.</p>
<h3>2. La conjugaison : le verbe ne change presque pas</h3>
<p>Bonne nouvelle : à presque toutes les personnes, le verbe garde sa forme de base (l'<strong>infinitif</strong> sans « to »). La SEULE exception est la 3e personne du singulier (he, she, it), qui ajoute un <strong>-s</strong>.</p>
<pre class="pseudo">I    work    → je travaille
you  work    → tu travailles
he   works   → il travaille      // +s !
she  works   → elle travaille    // +s !
it   works   → ça marche          // +s !
we   work    → nous travaillons
they work    → ils travaillent</pre>
<div class="warn">LA règle à retenir de toute la leçon : avec <strong>he, she, it</strong>, on ajoute un <strong>-s</strong> au verbe. « He work » est FAUX, il faut « He works ». C'est l'erreur numéro un des francophones.</div>
<h3>3. Le -s de la 3e personne : les cas spéciaux</h3>
<p>Ce -s suit presque les mêmes règles que le pluriel des noms (jour 6) :</p>
<pre class="pseudo">work → works       (règle générale : + s)
go   → goes        (après o : + es)
watch→ watches     (après ch, sh, s, x : + es)
study→ studies     (consonne + y : y devient -ies)
play → plays       (voyelle + y : + s)
have → has         (irrégulier ! have devient has)</pre>
<div class="tip">Le verbe <strong>have</strong> est irrégulier à la 3e personne : « he has », pas « he haves ». À apprendre par cœur.</div>
<h3>4. Des mots qui accompagnent le présent simple</h3>
<p>On emploie souvent des <strong>adverbes de fréquence</strong> : always (toujours), usually (d'habitude), often (souvent), sometimes (parfois), never (jamais). Ils se placent AVANT le verbe.</p>
<pre class="pseudo">I always drink coffee.   → Je bois toujours du café.
She often reads.         → Elle lit souvent.
They never work on Sunday. → Ils ne travaillent jamais le dimanche.
every day / every morning → tous les jours / tous les matins</pre>
<h3>5. Exemples complets</h3>
<pre class="pseudo">I live in Paris.       → J'habite à Paris.
He plays football.     → Il joue au football.   // he → plays
She studies English.   → Elle étudie l'anglais.  // study → studies
We like tea.           → Nous aimons le thé.</pre>`,
  exercises: [
    { type: "input", q: "Complète : I ___ (work) every day.", a: ["work"], ph: "un verbe", exp: "Avec I, le verbe ne change pas : I work." },
    { type: "input", q: "Complète : She ___ (work) in a shop.", a: ["works"], ph: "un verbe", exp: "3e personne (she) → on ajoute -s : works." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["He work here", "He works here", "He working here", "He is work here"], a: 1, exp: "he → works (avec -s)." },
    { type: "input", q: "Complète : He ___ (go) to school.", a: ["goes"], ph: "un verbe", exp: "go → goes (après o, on ajoute -es)." },
    { type: "input", q: "Complète : She ___ (study) French.", a: ["studies"], ph: "un verbe", exp: "study → studies (consonne + y → -ies)." },
    { type: "qcm", q: "Quelle est la 3e personne du verbe « have » ?", opts: ["haves", "have", "has", "haz"], a: 2, exp: "have → has (irrégulier)." },
    { type: "input", q: "Complète : They ___ (play) tennis.", a: ["play"], ph: "un verbe", exp: "Avec they, pas de -s : play." },
    { type: "vf", q: "On ajoute un -s au verbe avec I et you.", a: false, exp: "Faux : le -s est seulement pour he, she, it." },
    { type: "input", q: "Complète : He ___ (watch) TV.", a: ["watches"], ph: "un verbe", exp: "watch → watches (après ch, on ajoute -es)." },
    { type: "qcm", q: "Que décrit le présent simple ?", opts: ["une action en train de se faire là, maintenant", "des habitudes et des faits généraux", "le passé", "le futur seulement"], a: 1, exp: "Le présent simple = habitudes, faits généraux." },
    { type: "input", q: "Complète : We ___ (live) in London.", a: ["live"], ph: "un verbe", exp: "Avec we, pas de -s : live." },
    { type: "qcm", q: "Où se place l'adverbe « always » ?", opts: ["à la fin de la phrase", "avant le verbe", "avant le sujet", "il ne se place pas"], a: 1, exp: "always, often, never... se placent avant le verbe : I always work." },
    { type: "input", q: "Complète : She ___ (have) a dog.", a: ["has"], ph: "un verbe", exp: "have → has (irrégulier) : She has a dog." },
    { type: "vf", q: "« I plays football » est correct.", a: false, exp: "Faux : le -s est pour he/she/it. Avec I → I play football." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["She study English", "She studys English", "She studies English", "She studies's English"], a: 2, exp: "study → studies : She studies English." }
  ],
  final: {
    title: "Exercice final — Les habitudes de Léo",
    intro: `<p>Lis ce petit texte, puis complète et réponds.</p>
<pre class="pseudo">Léo lives in Lyon. He works in a shop.
He gets up early every day. He often reads books.
His sister studies English at school.</pre>
<p><em>Traduction : Léo habite à Lyon. Il travaille dans un magasin. Il se lève tôt tous les jours. Il lit souvent des livres. Sa soeur étudie l'anglais à l'école.</em></p>`,
    questions: [
      { type: "input", q: "Complète comme dans le texte : He ___ (work) in a shop.", a: ["works"], ph: "un verbe", exp: "he → works." },
      { type: "input", q: "Complète : His sister ___ (study) English.", a: ["studies"], ph: "un verbe", exp: "sister = she → studies." },
      { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Léo live in Lyon", "Léo lives in Lyon", "Léo living in Lyon", "Léo is live in Lyon"], a: 1, exp: "Léo = he → lives." },
      { type: "input", q: "Complète : I ___ (read) every evening. (avec I)", a: ["read"], ph: "un verbe", exp: "Avec I, pas de -s : read." },
      { type: "vf", q: "Le -s de la 3e personne s'applique à « He gets up ».", a: true, exp: "Oui : he → gets (get + s)." }
    ],
    solution: `<p>Le point crucial du présent simple affirmatif :</p>
<pre class="pseudo">I / you / we / they  → verbe de base :  I work, they play
he / she / it        → verbe + s :      he works, she plays
Cas spéciaux du -s : go→goes, watch→watches, study→studies, have→has</pre>
<p>Tout le reste est identique à l'infinitif. Concentre-toi sur le réflexe « he/she/it → +s ». C'est peu de chose, mais l'oublier est l'erreur la plus repérable en anglais.</p>`
  }
};
</script>
