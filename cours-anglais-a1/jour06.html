<script>
var DAY = {
  num: 6,
  title: "Le pluriel des noms",
  subtitle: "Ajouter -s… et connaître les cas particuliers et les pluriels irréguliers.",
  theory: `
<h3>1. La règle de base : ajouter -s</h3>
<p>Le <strong>pluriel</strong>, c'est quand il y a plusieurs choses (le contraire du <strong>singulier</strong>, une seule). En anglais, la règle générale est très simple : on ajoute un <strong>-s</strong> à la fin du nom.</p>
<pre class="pseudo">a cat  → two cats     // un chat → deux chats
a book → three books  // un livre → trois livres
a dog  → dogs         // des chiens
a car  → cars         // des voitures</pre>
<div class="tip">Contrairement au français, ce -s du pluriel s'ENTEND souvent à l'oral : « cats » se prononce « cats » (avec un léger « s » ou « z » à la fin). Ne l'avale pas.</div>
<h3>2. Noms finissant par -s, -x, -ch, -sh, -o : on ajoute -es</h3>
<p>Quand le nom se termine par un son sifflant (s, ss, x, ch, sh) ou parfois par -o, on ajoute <strong>-es</strong> pour pouvoir le prononcer :</p>
<pre class="pseudo">bus    → buses     // un bus → des bus
box    → boxes     // une boîte → des boîtes
watch  → watches   // une montre → des montres
dish   → dishes    // un plat → des plats
tomato → tomatoes  // une tomate → des tomates</pre>
<h3>3. Noms finissant par consonne + y : y devient -ies</h3>
<p>Si le nom se termine par une <strong>consonne + y</strong>, le y se transforme en <strong>-ies</strong> :</p>
<pre class="pseudo">baby   → babies    // un bébé → des bébés
city   → cities    // une ville → des villes
country → countries // un pays → des pays</pre>
<div class="warn">Attention : si c'est une VOYELLE + y, on garde le y et on ajoute juste -s. « boy → boys », « day → days », « key → keys ». La règle -ies ne concerne que consonne + y.</div>
<h3>4. Les pluriels irréguliers</h3>
<p>Quelques noms très courants ne suivent aucune règle : il faut les apprendre par cœur.</p>
<pre class="pseudo">man    → men       // un homme → des hommes
woman  → women     // une femme → des femmes
child  → children  // un enfant → des enfants
foot   → feet      // un pied → des pieds
tooth  → teeth     // une dent → des dents
person → people    // une personne → des gens
mouse  → mice      // une souris → des souris
fish   → fish      // un poisson → des poissons (identique !)</pre>
<div class="tip">« fish », « sheep » (mouton) et « deer » (cerf) ne changent pas au pluriel : one fish, two fish.</div>`,
  exercises: [
    { type: "input", q: "Mets au pluriel : one dog, two ___ .", a: ["dogs"], ph: "un mot", exp: "Règle de base : on ajoute -s → dogs." },
    { type: "input", q: "Mets au pluriel : one box, two ___ .", a: ["boxes"], ph: "un mot", exp: "box finit par -x → on ajoute -es → boxes." },
    { type: "input", q: "Mets au pluriel : one baby, two ___ .", a: ["babies"], ph: "un mot", exp: "consonne + y → y devient -ies → babies." },
    { type: "qcm", q: "Quel est le pluriel de « man » ?", opts: ["mans", "men", "manes", "mens"], a: 1, exp: "man → men, pluriel irrégulier." },
    { type: "qcm", q: "Quel est le pluriel de « child » ?", opts: ["childs", "childes", "children", "childrens"], a: 2, exp: "child → children, irrégulier." },
    { type: "input", q: "Mets au pluriel : one city, two ___ .", a: ["cities"], ph: "un mot", exp: "consonne + y → cities." },
    { type: "vf", q: "Le pluriel de « boy » est « boies ».", a: false, exp: "Faux : voyelle + y → on garde le y : boys." },
    { type: "input", q: "Mets au pluriel : one watch, two ___ .", a: ["watches"], ph: "un mot", exp: "finit par -ch → on ajoute -es → watches." },
    { type: "qcm", q: "Quel est le pluriel de « foot » (pied) ?", opts: ["foots", "feets", "feet", "footes"], a: 2, exp: "foot → feet, irrégulier." },
    { type: "input", q: "Mets au pluriel : one book, two ___ .", a: ["books"], ph: "un mot", exp: "Règle de base : books." },
    { type: "qcm", q: "Quel est le pluriel de « woman » ?", opts: ["womans", "women", "womens", "womes"], a: 1, exp: "woman → women (le son du milieu change à l'oral)." },
    { type: "input", q: "Mets au pluriel : one day, two ___ .", a: ["days"], ph: "un mot", exp: "voyelle + y (a+y) → on ajoute -s → days." },
    { type: "vf", q: "Le pluriel de « fish » est « fish » (il ne change pas).", a: true, exp: "Oui : one fish, two fish. Idem pour sheep et deer." },
    { type: "qcm", q: "Quel est le pluriel de « person » ?", opts: ["persons", "people", "persones", "peoples"], a: 1, exp: "person → people (les gens). « persons » existe mais est rare." },
    { type: "input", q: "Mets au pluriel : one tooth, two ___ .", a: ["teeth"], ph: "un mot", exp: "tooth → teeth, irrégulier." }
  ],
  final: {
    title: "Exercice final — Former le pluriel",
    intro: `<p>Applique les règles : +s en général · +es après s, x, ch, sh, o · consonne+y devient -ies · et attention aux irréguliers (man, child, foot...).</p>`,
    questions: [
      { type: "input", q: "Pluriel de « car » : two ___ .", a: ["cars"], ph: "un mot", exp: "Règle de base : cars." },
      { type: "input", q: "Pluriel de « bus » : two ___ .", a: ["buses"], ph: "un mot", exp: "finit par -s → buses." },
      { type: "qcm", q: "Pluriel de « child » :", opts: ["childs", "children", "childes", "child"], a: 1, exp: "children, irrégulier." },
      { type: "input", q: "Pluriel de « country » : two ___ .", a: ["countries"], ph: "un mot", exp: "consonne + y → countries." },
      { type: "input", q: "Pluriel de « fish » : two ___ .", a: ["fish"], ph: "un mot", exp: "fish ne change pas au pluriel." }
    ],
    solution: `<p>Le mémo du pluriel anglais :</p>
<pre class="pseudo">Général        : + s        cat → cats, book → books
Après s,x,ch,sh,o : + es    box → boxes, watch → watches
Consonne + y   : y → -ies   baby → babies, city → cities
Voyelle + y    : + s        day → days, boy → boys
Irréguliers    : par coeur  man→men, woman→women, child→children,
                            foot→feet, tooth→teeth, person→people, fish→fish</pre>
<p>La plupart des noms suivent la règle du -s. Concentre ton effort de mémorisation sur la petite liste d'irréguliers : ce sont justement les mots les plus fréquents.</p>`
  }
};
