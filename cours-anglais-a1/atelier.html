<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier — Anglais A1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
var ATELIER = {
  prefix: "at-en-a1",
  titre: "🇬🇧 Atelier — Anglais A1",
  soustitre: "Trois dialogues, puis 30 types d'exercices (10 chacun) pour ancrer le niveau A1.",
  retour: "index.html",
  dialogues: [
    { num:"1", titre:"Meeting someone new", perso:"Anna · Ben", lignes:[
      {qui:"A.", txt:"Hello! My name is Anna.", fr:"Bonjour ! Je m'appelle Anna."},
      {qui:"B.", txt:"Hi Anna. I am Ben. Nice to meet you.", fr:"Salut Anna. Je suis Ben. Enchanté."},
      {qui:"A.", txt:"Nice to meet you too. Where are you from?", fr:"Enchantée aussi. D'où viens-tu ?"},
      {qui:"B.", txt:"I am from London. And you?", fr:"Je viens de Londres. Et toi ?"},
      {qui:"A.", txt:"I am from Paris, but I live in Brussels.", fr:"Je viens de Paris, mais j'habite à Bruxelles."},
      {qui:"B.", txt:"How old are you?", fr:"Quel âge as-tu ?"},
      {qui:"A.", txt:"I am twenty-two. I am a student.", fr:"J'ai vingt-deux ans. Je suis étudiante."},
      {qui:"B.", txt:"I am a teacher. I work in a school.", fr:"Je suis professeur. Je travaille dans une école."},
      {qui:"A.", txt:"Do you like your job?", fr:"Est-ce que tu aimes ton travail ?"},
      {qui:"B.", txt:"Yes, I do. I love it!", fr:"Oui. Je l'adore !"}
    ]},
    { num:"2", titre:"At the cafe", perso:"Anna · Waiter", lignes:[
      {qui:"W.", txt:"Good morning. Can I help you?", fr:"Bonjour. Je peux vous aider ?"},
      {qui:"A.", txt:"Yes, please. A coffee, please.", fr:"Oui, s'il vous plaît. Un café, s'il vous plaît."},
      {qui:"W.", txt:"Big or small?", fr:"Grand ou petit ?"},
      {qui:"A.", txt:"Small, please. And a glass of water.", fr:"Petit, s'il vous plaît. Et un verre d'eau."},
      {qui:"W.", txt:"Do you want a sandwich?", fr:"Voulez-vous un sandwich ?"},
      {qui:"A.", txt:"Yes, a cheese sandwich, please.", fr:"Oui, un sandwich au fromage, s'il vous plaît."},
      {qui:"W.", txt:"That is six euros.", fr:"Ça fait six euros."},
      {qui:"A.", txt:"Here you are.", fr:"Voilà."},
      {qui:"W.", txt:"Thank you. Have a nice day!", fr:"Merci. Bonne journée !"},
      {qui:"A.", txt:"Thank you. Goodbye!", fr:"Merci. Au revoir !"}
    ]},
    { num:"3", titre:"Asking the way", perso:"Ben · Sara", lignes:[
      {qui:"B.", txt:"Excuse me! Where is the station?", fr:"Excusez-moi ! Où est la gare ?"},
      {qui:"S.", txt:"The station? It is near here.", fr:"La gare ? Elle est près d'ici."},
      {qui:"B.", txt:"Is it far?", fr:"C'est loin ?"},
      {qui:"S.", txt:"No, it is not far. It is five minutes.", fr:"Non, ce n'est pas loin. C'est à cinq minutes."},
      {qui:"B.", txt:"How do I go there?", fr:"Comment est-ce que j'y vais ?"},
      {qui:"S.", txt:"Go straight on, then turn left.", fr:"Allez tout droit, puis tournez à gauche."},
      {qui:"B.", txt:"Left or right?", fr:"À gauche ou à droite ?"},
      {qui:"S.", txt:"Left. The station is next to the post office.", fr:"À gauche. La gare est à côté de la poste."},
      {qui:"B.", txt:"Thank you very much!", fr:"Merci beaucoup !"},
      {qui:"S.", txt:"You are welcome. Goodbye!", fr:"De rien. Au revoir !"}
    ]}
  ],
  types: [
    { id:"vf", nom:"Vrai / Faux", consigne:"Lis les trois dialogues, puis dis si l'affirmation est vraie ou fausse.", exercices:[
      {type:"vf", q:"Anna is from Paris.", a:true, exp:"Elle dit : I am from Paris, but I live in Brussels."},
      {type:"vf", q:"Ben is a student.", a:false, exp:"Ben est teacher (professeur) ; c'est Anna qui est student."},
      {type:"vf", q:"Anna is twenty-two years old.", a:true, exp:"I am twenty-two = j'ai 22 ans."},
      {type:"vf", q:"Ben is from Brussels.", a:false, exp:"Ben is from London."},
      {type:"vf", q:"Anna orders a big coffee.", a:false, exp:"Elle demande un petit café : Small, please."},
      {type:"vf", q:"Anna wants a cheese sandwich.", a:true, exp:"Yes, a cheese sandwich, please."},
      {type:"vf", q:"The coffee and the sandwich cost six euros.", a:true, exp:"That is six euros."},
      {type:"vf", q:"The station is very far.", a:false, exp:"No, it is not far. It is five minutes."},
      {type:"vf", q:"Ben must turn right.", a:false, exp:"Sara dit : turn left (tourner à gauche)."},
      {type:"vf", q:"The station is next to the post office.", a:true, exp:"C'est la dernière indication de Sara."}
    ]},
    { id:"qcmdial", nom:"QCM de compréhension", consigne:"Choisis la bonne réponse d'après les dialogues.", exercices:[
      {type:"qcm", q:"What is the woman's name in dialogue 1?", opts:["Sara","Anna","Emma","Lisa"], a:1, exp:"My name is Anna."},
      {type:"qcm", q:"Where does Anna live?", opts:["In Paris","In London","In Brussels","In Rome"], a:2, exp:"I live in Brussels."},
      {type:"qcm", q:"What is Ben's job?", opts:["A doctor","A waiter","A student","A teacher"], a:3, exp:"I am a teacher. I work in a school."},
      {type:"qcm", q:"What does Anna drink at the cafe?", opts:["Tea","Coffee","Milk","Juice"], a:1, exp:"A coffee, please."},
      {type:"qcm", q:"What does Anna drink with her coffee?", opts:["A glass of water","A beer","A cola","Nothing"], a:0, exp:"And a glass of water."},
      {type:"qcm", q:"How much does Anna pay?", opts:["Five euros","Six euros","Seven euros","Ten euros"], a:1, exp:"That is six euros."},
      {type:"qcm", q:"What does Ben look for?", opts:["The school","The cafe","The station","The hotel"], a:2, exp:"Where is the station?"},
      {type:"qcm", q:"How long is the walk to the station?", opts:["Two minutes","Five minutes","Ten minutes","One hour"], a:1, exp:"It is five minutes."},
      {type:"qcm", q:"What does Sara say first?", opts:["Turn left","Go straight on","Turn right","Go back"], a:1, exp:"Go straight on, then turn left."},
      {type:"qcm", q:"How does Sara answer Thank you very much?", opts:["Here you are","You are welcome","Good morning","See you"], a:1, exp:"You are welcome = de rien."}
    ]},
    { id:"rectif", nom:"Rectifier l'affirmation fausse", consigne:"Chaque phrase est FAUSSE. Choisis la correction juste.", exercices:[
      {type:"qcm", q:"FAUX : Anna is a teacher. La bonne phrase est :", opts:["Anna is a student.","Anna is a doctor.","Anna is a waiter.","Anna is a nurse."], a:0, exp:"Anna dit : I am a student."},
      {type:"qcm", q:"FAUX : Ben is from Paris. La bonne phrase est :", opts:["Ben is from Rome.","Ben is from London.","Ben is from Berlin.","Ben is from Madrid."], a:1, exp:"I am from London."},
      {type:"qcm", q:"FAUX : Anna is thirty-two. La bonne phrase est :", opts:["Anna is twelve.","Anna is twenty.","Anna is twenty-two.","Anna is forty-two."], a:2, exp:"I am twenty-two."},
      {type:"qcm", q:"FAUX : Ben works in a shop. La bonne phrase est :", opts:["Ben works in a school.","Ben works in a bank.","Ben works in a cafe.","Ben works at home."], a:0, exp:"I work in a school."},
      {type:"qcm", q:"FAUX : Anna wants a big coffee. La bonne phrase est :", opts:["Anna wants a big tea.","Anna wants a small coffee.","Anna wants two coffees.","Anna wants no coffee."], a:1, exp:"Small, please."},
      {type:"qcm", q:"FAUX : Anna orders a ham sandwich. La bonne phrase est :", opts:["Anna orders a cheese sandwich.","Anna orders a fish sandwich.","Anna orders a cake.","Anna orders a pizza."], a:0, exp:"A cheese sandwich, please."},
      {type:"qcm", q:"FAUX : The bill is sixteen euros. La bonne phrase est :", opts:["The bill is six euros.","The bill is sixty euros.","The bill is five euros.","The bill is eight euros."], a:0, exp:"That is six euros. Attention : six / sixteen / sixty."},
      {type:"qcm", q:"FAUX : The station is very far. La bonne phrase est :", opts:["The station is not near.","The station is not far.","The station is closed.","The station is here."], a:1, exp:"It is not far."},
      {type:"qcm", q:"FAUX : Ben turns right. La bonne phrase est :", opts:["Ben turns left.","Ben turns back.","Ben goes home.","Ben stops."], a:0, exp:"Turn left."},
      {type:"qcm", q:"FAUX : The station is next to the school. La bonne phrase est :", opts:["next to the cafe","next to the post office","next to the hotel","next to the park"], a:1, exp:"next to the post office = à côté de la poste."}
    ]},
    { id:"texte", nom:"Texte + questions", consigne:"Lis le texte, puis réponds.\n\nMY DAY\nMy name is Tom. I am thirty years old. I live in a small house in Bristol with my wife and my dog. I am a bus driver. I start work at six o'clock in the morning. I have lunch at one o'clock. In the evening I watch TV or I read a book. I like my life.", exercices:[
      {type:"qcm", q:"What is his name?", opts:["Ben","Tom","Sam","Bill"], a:1, exp:"My name is Tom."},
      {type:"qcm", q:"How old is Tom?", opts:["13","20","30","40"], a:2, exp:"I am thirty years old."},
      {type:"qcm", q:"Where does Tom live?", opts:["In London","In Bristol","In Paris","In Leeds"], a:1, exp:"I live in a small house in Bristol."},
      {type:"vf", q:"Tom lives in a big house.", a:false, exp:"C'est a small house (une petite maison)."},
      {type:"qcm", q:"Who lives with Tom?", opts:["His wife and his dog","His mother","His brother","Nobody"], a:0, exp:"with my wife and my dog."},
      {type:"input", q:"What is Tom's job? He is a bus ______ .", a:["driver","bus driver"], ph:"un mot", exp:"a bus driver = un chauffeur de bus."},
      {type:"qcm", q:"When does Tom start work?", opts:["At five","At six","At seven","At eight"], a:1, exp:"I start work at six o'clock."},
      {type:"input", q:"At what time does Tom have lunch? At ______ o'clock.", a:["one","1"], ph:"un mot", exp:"I have lunch at one o'clock."},
      {type:"vf", q:"In the evening Tom watches TV or reads a book.", a:true, exp:"I watch TV or I read a book."},
      {type:"qcm", q:"Does Tom like his life?", opts:["Yes, he does.","No, he does not.","We do not know.","He hates it."], a:0, exp:"I like my life."}
    ]},
    { id:"doc", nom:"Document authentique", consigne:"Regarde le document, puis réponds.\n\nCAFE SUNSHINE — MENU\nCoffee ......... 2.00\nTea ............ 2.00\nOrange juice ... 3.00\nCheese sandwich  4.00\nCake ........... 3.50\nOpen: Monday to Friday, 8 a.m. - 6 p.m.\nClosed on Sunday. Tel: 02 555 14 20", exercices:[
      {type:"qcm", q:"What is the name of the cafe?", opts:["Cafe Moon","Cafe Sunshine","Sunny Bar","Cafe Star"], a:1, exp:"Le titre du document : CAFE SUNSHINE."},
      {type:"qcm", q:"How much is a coffee?", opts:["2.00","3.00","3.50","4.00"], a:0, exp:"Coffee ... 2.00."},
      {type:"qcm", q:"What is the most expensive item?", opts:["Coffee","Cake","Cheese sandwich","Tea"], a:2, exp:"Le sandwich coûte 4.00, c'est le plus cher."},
      {type:"input", q:"How much is an orange juice? ______ euros.", a:["3","3.00","three"], ph:"un nombre", exp:"Orange juice ... 3.00."},
      {type:"vf", q:"The cafe is open on Sunday.", a:false, exp:"Closed on Sunday = fermé le dimanche."},
      {type:"qcm", q:"When does the cafe open?", opts:["At 6 a.m.","At 7 a.m.","At 8 a.m.","At 9 a.m."], a:2, exp:"Open 8 a.m. - 6 p.m."},
      {type:"qcm", q:"When does the cafe close?", opts:["At 5 p.m.","At 6 p.m.","At 8 p.m.","At 10 p.m."], a:1, exp:"jusqu'à 6 p.m. (18 h)."},
      {type:"input", q:"Complete: The cafe is open from Monday to ______ .", a:["friday"], ph:"un jour", exp:"Monday to Friday."},
      {type:"qcm", q:"You buy a coffee and a cake. How much do you pay?", opts:["4.50","5.00","5.50","6.00"], a:2, exp:"2.00 + 3.50 = 5.50."},
      {type:"vf", q:"There is a telephone number on the document.", a:true, exp:"Tel: 02 555 14 20."}
    ]},
    { id:"syn", nom:"Synonymes", consigne:"Trouve le mot de sens proche (synonyme).", exercices:[
      {type:"qcm", q:"hello =", opts:["bye","hi","please","sorry"], a:1, exp:"hello et hi = bonjour / salut."},
      {type:"qcm", q:"big =", opts:["large","small","short","thin"], a:0, exp:"big = large = grand."},
      {type:"qcm", q:"nice =", opts:["bad","kind","old","cold"], a:1, exp:"nice = kind = gentil, agréable."},
      {type:"input", q:"Synonyme de start : to b______ (commencer)", a:["begin","to begin"], ph:"begin ?", exp:"start = begin = commencer."},
      {type:"qcm", q:"speak =", opts:["talk","walk","look","hear"], a:0, exp:"speak = talk = parler."},
      {type:"input", q:"Synonyme de bag utilisé pour l'école : s______", a:["schoolbag","bag"], ph:"un mot", exp:"a schoolbag = un cartable, un sac."},
      {type:"qcm", q:"happy =", opts:["sad","angry","glad","tired"], a:2, exp:"happy = glad = content."},
      {type:"qcm", q:"car =", opts:["bike","bus","auto","train"], a:2, exp:"car = auto = voiture."},
      {type:"input", q:"Synonyme de goodbye : b______", a:["bye","bye bye"], ph:"un mot", exp:"goodbye = bye = au revoir."},
      {type:"qcm", q:"a lot of =", opts:["many","few","little","no"], a:0, exp:"a lot of = many = beaucoup de."}
    ]},
    { id:"ant", nom:"Antonymes", consigne:"Trouve le contraire (antonyme).", exercices:[
      {type:"qcm", q:"big ≠", opts:["large","small","long","tall"], a:1, exp:"big ≠ small = grand ≠ petit."},
      {type:"qcm", q:"hot ≠", opts:["warm","cold","dry","new"], a:1, exp:"hot ≠ cold = chaud ≠ froid."},
      {type:"input", q:"Contraire de good : b______", a:["bad"], ph:"un mot", exp:"good ≠ bad = bon ≠ mauvais."},
      {type:"qcm", q:"old ≠", opts:["young","tall","poor","slow"], a:0, exp:"old ≠ young pour une personne (vieux ≠ jeune)."},
      {type:"input", q:"Contraire de open : c______", a:["closed","close","shut"], ph:"un mot", exp:"open ≠ closed = ouvert ≠ fermé."},
      {type:"qcm", q:"day ≠", opts:["morning","evening","night","week"], a:2, exp:"day ≠ night = jour ≠ nuit."},
      {type:"qcm", q:"easy ≠", opts:["difficult","nice","quick","clean"], a:0, exp:"easy ≠ difficult = facile ≠ difficile."},
      {type:"input", q:"Contraire de yes : n______", a:["no"], ph:"un mot", exp:"yes ≠ no."},
      {type:"qcm", q:"left ≠", opts:["straight","right","back","near"], a:1, exp:"left ≠ right = gauche ≠ droite."},
      {type:"qcm", q:"far ≠", opts:["near","long","big","late"], a:0, exp:"far ≠ near = loin ≠ près."}
    ]},
    { id:"motjuste", nom:"Le mot juste", consigne:"Complète le texte avec la banque de mots.\n\nBANQUE : name — from — has — teacher — cat — old — lives — like — is — every\n\nMy (1)______ is Julia. I am (2)______ Ireland. I (3)______ in Dublin. I am a (4)______ in a small school. My brother (5)______ a doctor. He is thirty years (6)______ . He (7)______ two children. We have a (8)______ at home. I (9)______ animals. I call my brother (10)______ Sunday.", exercices:[
      {type:"input", q:"(1) My ______ is Julia.", a:["name"], ph:"un mot", exp:"My name is... = je m'appelle..."},
      {type:"input", q:"(2) I am ______ Ireland.", a:["from"], ph:"un mot", exp:"to be from = venir de."},
      {type:"input", q:"(3) I ______ in Dublin.", a:["live"], ph:"un mot", exp:"Avec I, le verbe n'a pas de -s : I live."},
      {type:"input", q:"(4) I am a ______ in a small school.", a:["teacher"], ph:"un mot", exp:"a teacher = un professeur."},
      {type:"input", q:"(5) My brother ______ a doctor.", a:["is"], ph:"un mot", exp:"he/she/it + is."},
      {type:"input", q:"(6) He is thirty years ______ .", a:["old"], ph:"un mot", exp:"thirty years old = trente ans."},
      {type:"input", q:"(7) He ______ two children.", a:["has"], ph:"un mot", exp:"he/she/it + has (et non have)."},
      {type:"input", q:"(8) We have a ______ at home.", a:["cat"], ph:"un mot", exp:"a cat = un chat, c'est un animal."},
      {type:"input", q:"(9) I ______ animals.", a:["like"], ph:"un mot", exp:"I like = j'aime."},
      {type:"input", q:"(10) I call my brother ______ Sunday.", a:["every"], ph:"un mot", exp:"every Sunday = tous les dimanches."}
    ]},
    { id:"familles", nom:"Familles de mots", consigne:"Trouve le mot de la même famille (verbe → nom de métier, nom → adjectif...).", exercices:[
      {type:"input", q:"to teach (enseigner) → a ______ (celui qui enseigne)", a:["teacher"], ph:"un mot", exp:"teach + er = teacher. Le suffixe -er donne souvent la personne."},
      {type:"input", q:"to work (travailler) → a ______ (un ouvrier)", a:["worker"], ph:"un mot", exp:"work + er = worker."},
      {type:"input", q:"to drive (conduire) → a ______ (un chauffeur)", a:["driver"], ph:"un mot", exp:"drive + r = driver."},
      {type:"qcm", q:"to sing → a person who sings is a ...", opts:["singer","singist","singman","song"], a:0, exp:"sing + er = singer (un chanteur)."},
      {type:"qcm", q:"to play → a person who plays is a ...", opts:["playist","player","playman","play"], a:1, exp:"play + er = player."},
      {type:"input", q:"to cook (cuisiner) → a ______ (un cuisinier)", a:["cook","cooker"], ph:"un mot", exp:"Attention : la personne est a cook. A cooker est la cuisinière (appareil)."},
      {type:"input", q:"friend (ami) → adjectif ______ (aimable)", a:["friendly"], ph:"un mot", exp:"friend + ly = friendly."},
      {type:"qcm", q:"sun → the adjective is ...", opts:["sunish","sunny","sunful","sunly"], a:1, exp:"sun + ny = sunny (ensoleillé)."},
      {type:"input", q:"to bake (cuire du pain) → a ______ (un boulanger)", a:["baker"], ph:"un mot", exp:"bake + r = baker."},
      {type:"qcm", q:"to help → a person who helps is a ...", opts:["helper","helpist","helpman","help"], a:0, exp:"help + er = helper."}
    ]},
    { id:"fauxamis", nom:"Faux amis et pièges", consigne:"Attention aux mots qui ressemblent au français mais n'ont pas le même sens.", exercices:[
      {type:"qcm", q:"a library =", opts:["une librairie","une bibliothèque","un livre","une école"], a:1, exp:"library = bibliothèque. Une librairie = a bookshop."},
      {type:"qcm", q:"actually =", opts:["actuellement","en fait","enfin","souvent"], a:1, exp:"actually = en fait. Actuellement = now / at the moment."},
      {type:"qcm", q:"sensible =", opts:["sensible","raisonnable","triste","facile"], a:1, exp:"sensible = raisonnable. Sensible (fr) = sensitive."},
      {type:"qcm", q:"a journey =", opts:["une journée","un voyage","un journal","un jour"], a:1, exp:"a journey = un voyage. Une journée = a day."},
      {type:"qcm", q:"a coin =", opts:["un coin","une pièce de monnaie","un angle","un magasin"], a:1, exp:"a coin = une pièce de monnaie. Un coin = a corner."},
      {type:"vf", q:"Le mot bread veut dire pain.", a:true, exp:"bread = pain. Attention : pain (fr) ≠ pain (en, qui veut dire douleur)."},
      {type:"qcm", q:"a chef =", opts:["un chef d'entreprise","un cuisinier","un patron","un chef de gare"], a:1, exp:"a chef = un cuisinier. Un chef (patron) = a boss."},
      {type:"qcm", q:"to attend a class =", opts:["attendre","assister à","apprendre","aider"], a:1, exp:"to attend = assister à. Attendre = to wait."},
      {type:"qcm", q:"a location =", opts:["une location","un lieu","un loyer","une maison"], a:1, exp:"location = lieu, endroit. Une location = a rental."},
      {type:"vf", q:"a car veut dire un car (autocar).", a:false, exp:"a car = une voiture. Un autocar = a coach ou a bus."}
    ]},
    { id:"qr", nom:"Question ↔ réponse", consigne:"Choisis la réponse qui convient à la question.", exercices:[
      {type:"qcm", q:"What is your name?", opts:["I am fine.","My name is Paul.","I am from Spain.","Yes, I am."], a:1, exp:"What is your name ? → on donne son nom."},
      {type:"qcm", q:"How are you?", opts:["I am nine.","I am fine, thank you.","I am a nurse.","At home."], a:1, exp:"How are you = comment vas-tu."},
      {type:"qcm", q:"Where do you live?", opts:["In Madrid.","At six.","With Anna.","Yes, I do."], a:0, exp:"Where → un lieu."},
      {type:"qcm", q:"How old are you?", opts:["I am tall.","I am ten.","I am here.","I am busy."], a:1, exp:"How old → un âge."},
      {type:"qcm", q:"Are you a student?", opts:["Yes, I am.","Yes, I do.","Yes, I have.","Yes, it is."], a:0, exp:"Question avec are → réponse avec am."},
      {type:"qcm", q:"Do you like tea?", opts:["Yes, I am.","Yes, I do.","Yes, I like.","Yes, it does."], a:1, exp:"Question avec do → réponse Yes, I do."},
      {type:"qcm", q:"What time is it?", opts:["It is Monday.","It is five o'clock.","It is cold.","It is here."], a:1, exp:"What time → l'heure."},
      {type:"qcm", q:"Where is the station?", opts:["It is next to the post office.","It is five euros.","It is Tuesday.","It is small."], a:0, exp:"Where → un lieu."},
      {type:"qcm", q:"How much is the coffee?", opts:["Two euros.","Two hours.","Two people.","Two days."], a:0, exp:"How much → un prix."},
      {type:"qcm", q:"Thank you very much!", opts:["Please.","You are welcome.","Sorry.","Good night."], a:1, exp:"On répond You are welcome (de rien)."}
    ]},
    { id:"poserq", nom:"Poser la question", consigne:"Écris le mot interrogatif qui manque dans la question.", exercices:[
      {type:"input", q:"______ is your name? — My name is Ben.", a:["what"], ph:"un mot", exp:"What → pour un nom, une chose."},
      {type:"input", q:"______ do you live? — In Brussels.", a:["where"], ph:"un mot", exp:"Where → un lieu."},
      {type:"input", q:"______ old are you? — I am twenty.", a:["how"], ph:"un mot", exp:"How old = quel âge."},
      {type:"input", q:"______ is that man? — He is my father.", a:["who"], ph:"un mot", exp:"Who → une personne."},
      {type:"input", q:"______ do you start work? — At six o'clock.", a:["when","what time"], ph:"un mot", exp:"When → un moment. What time marche aussi."},
      {type:"input", q:"______ are you from? — I am from Italy.", a:["where"], ph:"un mot", exp:"Where are you from = d'où viens-tu."},
      {type:"input", q:"______ much is the cake? — Three euros.", a:["how"], ph:"un mot", exp:"How much = combien (prix)."},
      {type:"input", q:"______ colour is your car? — It is red.", a:["what","which"], ph:"un mot", exp:"What colour = de quelle couleur."},
      {type:"input", q:"______ is your birthday? — In May.", a:["when"], ph:"un mot", exp:"When → une date."},
      {type:"input", q:"______ are you? — I am fine, thank you.", a:["how"], ph:"un mot", exp:"How are you = comment vas-tu."}
    ]},
    { id:"replique", nom:"La réplique manquante", consigne:"Complète le mini-échange avec la réplique qui convient.", exercices:[
      {type:"qcm", q:"— Good morning! — ______", opts:["Good night!","Good morning!","Good luck!","Goodbye!"], a:1, exp:"On rend la salutation du matin."},
      {type:"qcm", q:"— Nice to meet you. — ______", opts:["Nice to meet you too.","Yes, please.","No, thank you.","I am sorry."], a:0, exp:"Réponse habituelle : ...too."},
      {type:"qcm", q:"— Here you are. — ______", opts:["Thank you.","Where?","Yes, I am.","I do not know."], a:0, exp:"On remercie quand on reçoit quelque chose."},
      {type:"qcm", q:"— Can I help you? — ______", opts:["Yes, a coffee, please.","Yes, I am tall.","No, it is Monday.","At home."], a:0, exp:"Au café, on commande."},

      {type:"qcm", q:"a) I am fine, thank you. b) Hello! c) How are you?", opts:["b - c - a","c - b - a","a - b - c","b - a - c"], a:0, exp:"Salutation, question, réponse."},

      {type:"qcm", q:"a) I am from Spain. b) Where are you from? c) And you?", opts:["b - a - c","a - c - b","b - c - a","c - a - b"], a:0, exp:"Question, réponse, question en retour."},

      {type:"qcm", q:"a) I am a teacher. b) What is your job? c) Very interesting!", opts:["b - a - c","a - c - b","c - a - b","b - c - a"], a:0, exp:"Question, métier, réaction."}

    { id:"substitution", nom:"Substitution", consigne:"Reprends la phrase modèle en remplaçant l'élément indiqué.", exercices:[
      {type:"input", q:"Modèle : I am a student. → (teacher) I am a ______ .", a:["teacher"], ph:"un mot", exp:"On remplace seulement le nom du métier."},
      {type:"input", q:"Modèle : She lives in Paris. → (London) She lives in ______ .", a:["london"], ph:"une ville", exp:"On change la ville, le reste ne bouge pas."},
      {type:"input", q:"Modèle : I like coffee. → (he) ______ likes coffee.", a:["he"], ph:"un pronom", exp:"Avec he, le verbe prend un -s : he likes."},
      {type:"input", q:"Modèle : He has a dog. → (they) They ______ a dog.", a:["have"], ph:"un verbe", exp:"they have (pas de -s au pluriel)."},
      {type:"input", q:"Modèle : The book is on the table. → (under) The book is ______ the table.", a:["under"], ph:"une préposition", exp:"under = sous."},
      {type:"input", q:"Modèle : I am from Italy. → (we) We ______ from Italy.", a:["are"], ph:"un verbe", exp:"we are."},
      {type:"input", q:"Modèle : This is my car. → (her) This is ______ car.", a:["her"], ph:"un mot", exp:"her car = sa voiture (à elle)."},
      {type:"input", q:"Modèle : I want a small coffee. → (big) I want a ______ coffee.", a:["big","large"], ph:"un adjectif", exp:"L'adjectif reste devant le nom."},
      {type:"input", q:"Modèle : She works on Monday. → (Sunday) She works on ______ .", a:["sunday"], ph:"un jour", exp:"on + jour de la semaine."},
      {type:"input", q:"Modèle : I have two brothers. → (sister, one) I have one ______ .", a:["sister"], ph:"un nom", exp:"Après one, le nom reste au singulier."}
    ]},
    { id:"conj", nom:"Conjugaison", consigne:"Conjugue au présent simple (be, have, do et verbes ordinaires).", exercices:[
      {type:"input", q:"I ______ (be) French.", a:["am"], ph:"un mot", exp:"I am."},
      {type:"input", q:"She ______ (be) my sister.", a:["is"], ph:"un mot", exp:"he / she / it + is."},
      {type:"input", q:"They ______ (be) at home.", a:["are"], ph:"un mot", exp:"we / you / they + are."},
      {type:"input", q:"He ______ (have) a big house.", a:["has"], ph:"un mot", exp:"he / she / it + has."},
      {type:"input", q:"We ______ (have) two children.", a:["have"], ph:"un mot", exp:"we have."},
      {type:"input", q:"Tom ______ (work) in a school.", a:["works"], ph:"un mot", exp:"3e personne du singulier : + s."},
      {type:"input", q:"I ______ (like) music.", a:["like"], ph:"un mot", exp:"Avec I, pas de -s."},
      {type:"input", q:"She ______ (watch) TV every evening.", a:["watches"], ph:"un mot", exp:"Verbe en -ch : on ajoute -es (watches)."},
      {type:"qcm", q:"______ you speak English?", opts:["Do","Does","Are","Is"], a:0, exp:"Question avec you → Do you...?"},
      {type:"qcm", q:"______ she live in Paris?", opts:["Do","Does","Is","Are"], a:1, exp:"Question avec she → Does she live...? (le verbe reste sans -s)."}
    ]},
    { id:"irreg", nom:"Verbes irréguliers", consigne:"Formes de base des verbes courants.", exercices:[

      {type:"input", q:"He ______ (go) to school every day.", a:["goes"], ph:"un mot", exp:"go + es = goes."},
      {type:"input", q:"She ______ (do) her homework.", a:["does"], ph:"un mot", exp:"do + es = does."},
      {type:"qcm", q:"I ______ a headache.", opts:["has","have","haves","having"], a:1, exp:"I have."},
      {type:"input", q:"It ______ (be) cold today.", a:["is"], ph:"un mot", exp:"it is."},
      {type:"qcm", q:"Which form is correct?", opts:["He haves a car.","He have a car.","He has a car.","He is have a car."], a:2, exp:"has est la forme irrégulière de have à la 3e personne."},
      {type:"input", q:"You ______ (be) my friend.", a:["are"], ph:"un mot", exp:"you are."},
      {type:"qcm", q:"Quel verbe est irrégulier ?", opts:["to work","to play","to be","to like"], a:2, exp:"to be : am / is / are, complètement irrégulier."},
      {type:"input", q:"They ______ (do) not know.", a:["do"], ph:"un mot", exp:"they do not = they don't."},
      {type:"qcm", q:"We ______ happy.", opts:["is","am","are","be"], a:2, exp:"we are."}
    ]},

      {type:"input", q:"Je n'aime pas le poisson.", a:["i do not like fish","i dont like fish","i don't like fish"], ph:"en anglais", exp:"I do not like fish (pas d'article devant fish ici)."},
      {type:"input", q:"Nous avons deux enfants.", a:["we have two children"], ph:"en anglais", exp:"We have two children."},
      {type:"input", q:"Il est trois heures.", a:["it is three o'clock","it is three oclock","its three o'clock","it is three"], ph:"en anglais", exp:"It is three o'clock."},
      {type:"input", q:"Merci beaucoup !", a:["thank you very much","thanks a lot","thank you very much!"], ph:"en anglais", exp:"Thank you very much!"}
    ]},
    { id:"traden", nom:"Traduction anglais → français", consigne:"Traduis la phrase en français.", exercices:[
      {type:"qcm", q:"I am a student.", opts:["Je suis étudiant.","J'ai un étudiant.","Je vais étudier.","Il est étudiant."], a:0, exp:"I am = je suis."},
      {type:"qcm", q:"She has a small car.", opts:["Elle a une petite voiture.","Elle est une petite voiture.","Il a une grande voiture.","Elle achète une voiture."], a:0, exp:"has = a ; small = petit."},
      {type:"input", q:"Traduis : Where do you live?", a:["ou habites-tu","ou habitez-vous","ou vis-tu","ou est-ce que tu habites","ou habites tu"], ph:"en français", exp:"Où habites-tu ?"},
      {type:"qcm", q:"The station is next to the post office.", opts:["La gare est loin de la poste.","La gare est à côté de la poste.","La poste est dans la gare.","La gare est devant l'école."], a:1, exp:"next to = à côté de."},
      {type:"input", q:"Traduis : How old are you?", a:["quel age as-tu","quel age avez-vous","tu as quel age"], ph:"en français", exp:"Quel âge as-tu ? (mot à mot : quel vieux es-tu)."},
      {type:"qcm", q:"I do not have time.", opts:["Je n'ai pas le temps.","Je n'aime pas le temps.","Il fait mauvais temps.","J'ai du temps."], a:0, exp:"do not have = ne pas avoir."},
      {type:"qcm", q:"They are at home.", opts:["Ils sont à la maison.","Ils vont à la maison.","Ils ont une maison.","Elle est à la maison."], a:0, exp:"at home = à la maison."},
      {type:"input", q:"Traduis : You are welcome.", a:["de rien","je vous en prie","je t'en prie"], ph:"en français", exp:"Formule de politesse après un merci."},
      {type:"qcm", q:"He works in a school.", opts:["Il travaille dans une école.","Il marche vers l'école.","Il est à l'école.","Elle travaille à l'école."], a:0, exp:"works = travaille."},
      {type:"input", q:"Traduis : Have a nice day!", a:["bonne journee","passe une bonne journee","bonne journee !"], ph:"en français", exp:"Souhait de politesse : bonne journée !"}
    ]},
    { id:"dictee", nom:"Dictée à trous", consigne:"Complète le texte avec le mot qui manque.\n\nHELLO!\nHello, my (1)______ is Maria. I am (2)______ Spain but I (3)______ in Belgium. I (4)______ twenty-five years old. I am a (5)______ in a hospital. I (6)______ two brothers and one sister. My sister (7)______ in London. In the (8)______ I get up at six. I go to work (9)______ bus. I (10)______ my job very much.", exercices:[
      {type:"input", q:"(1) my ______ is Maria", a:["name"], ph:"un mot", exp:"my name is = je m'appelle."},
      {type:"input", q:"(2) I am ______ Spain", a:["from"], ph:"un mot", exp:"from = de (origine)."},
      {type:"input", q:"(3) but I ______ in Belgium", a:["live"], ph:"un mot", exp:"I live = j'habite."},
      {type:"input", q:"(4) I ______ twenty-five years old", a:["am"], ph:"un mot", exp:"On utilise be pour l'âge."},
      {type:"input", q:"(5) I am a ______ in a hospital", a:["nurse","doctor"], ph:"un métier", exp:"a nurse = une infirmière (hospital = hôpital)."},
      {type:"input", q:"(6) I ______ two brothers and one sister", a:["have"], ph:"un mot", exp:"I have = j'ai."},
      {type:"input", q:"(7) my sister ______ in London", a:["lives","works"], ph:"un mot", exp:"3e personne : lives avec un -s."},
      {type:"input", q:"(8) in the ______ I get up at six", a:["morning"], ph:"un mot", exp:"in the morning = le matin."},
      {type:"input", q:"(9) I go to work ______ bus", a:["by"], ph:"un mot", exp:"by bus = en bus."},
      {type:"input", q:"(10) I ______ my job very much", a:["like","love"], ph:"un mot", exp:"I like my job very much."}
    ]},
    { id:"prononciation", nom:"Prononciation", consigne:"Sons et accent tonique de l'anglais.", exercices:[
      {type:"qcm", q:"Quel mot contient le son long /iː/ (comme dans see) ?", opts:["ship","sit","sheep","sick"], a:2, exp:"sheep = /iː/ long ; ship = /ɪ/ court."},
      {type:"qcm", q:"Quel mot contient le son court /ɪ/ ?", opts:["green","this","tea","see"], a:1, exp:"this a un i court."},
      {type:"qcm", q:"Dans quel mot le h ne se prononce PAS ?", opts:["house","hello","hour","hat"], a:2, exp:"hour se prononce comme our : le h est muet."},
      {type:"qcm", q:"Comment se prononce le -s de books ?", opts:["comme /s/","comme /z/","comme /iz/","il est muet"], a:0, exp:"Après un son sourd (k), le -s se dit /s/."},
      {type:"qcm", q:"Comment se prononce le -s de dogs ?", opts:["comme /s/","comme /z/","comme /iz/","il est muet"], a:1, exp:"Après un son sonore (g), le -s se dit /z/."},
      {type:"qcm", q:"Comment se prononce le -es de buses ?", opts:["comme /s/","comme /z/","comme /iz/","il est muet"], a:2, exp:"Après un sifflante, on entend une syllabe en plus : /iz/."},
      {type:"qcm", q:"Où est l'accent tonique dans TEACHER ?", opts:["sur la 1re syllabe","sur la 2e syllabe","sur les deux","aucun accent"], a:0, exp:"TEA-cher : accent sur la première syllabe."},
      {type:"qcm", q:"Où est l'accent tonique dans HELLO ?", opts:["sur la 1re syllabe","sur la 2e syllabe","sur les deux","aucun accent"], a:1, exp:"he-LLO : accent sur la deuxième syllabe."},
      {type:"qcm", q:"Quel mot rime avec go ?", opts:["do","no","to","who"], a:1, exp:"go et no riment en /əʊ/ ; do et to se disent /uː/."},
      {type:"vf", q:"Le mot the se prononce toujours de la même façon.", a:false, exp:"the se dit /ðə/ devant une consonne et /ði/ devant une voyelle (the apple)."}
    ]}
  ]
};
