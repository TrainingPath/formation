<script>
var DAY = {
  num: 13,
  title: "Le présent simple : négatif et questions",
  subtitle: "Le fameux auxiliaire do / does pour dire « ne… pas » et poser des questions.",
  theory: `
<h3>1. Un nouvel outil : l'auxiliaire do / does</h3>
<p>Pour mettre un verbe au présent simple à la forme négative ou à la question, l'anglais a besoin d'un mot outil : l'<strong>auxiliaire</strong> <strong>do</strong> (ou <strong>does</strong>). Un auxiliaire est un petit verbe qui aide à construire la phrase, sans porter le sens principal.</p>
<pre class="pseudo">do   → avec I, you, we, they
does → avec he, she, it   (le -s de la 3e personne va sur DOES)</pre>
<h3>2. La forme négative</h3>
<p>Pour dire « ne… pas », on ajoute <strong>do not</strong> (= don't) ou <strong>does not</strong> (= doesn't) devant le verbe de base.</p>
<pre class="pseudo">I do not work.    = I don't work.      → Je ne travaille pas.
You don't like tea.                    → Tu n'aimes pas le thé.
He does not work. = He doesn't work.   → Il ne travaille pas.
She doesn't like coffee.               → Elle n'aime pas le café.</pre>
<div class="warn">Piège capital : quand on utilise <strong>does</strong>, le verbe principal PERD son -s ! On dit « She doesn't <strong>work</strong> » (pas « doesn't works »). Le -s est déjà sur « does ». Un seul -s dans la phrase.</div>
<h3>3. La forme interrogative (question)</h3>
<p>Pour poser une question, on met <strong>Do</strong> ou <strong>Does</strong> au début, devant le sujet :</p>
<pre class="pseudo">Do you like tea?        → Est-ce que tu aimes le thé ?
Do they work here?      → Est-ce qu'ils travaillent ici ?
Does he like coffee?    → Est-ce qu'il aime le café ?
Does she work here?     → Est-ce qu'elle travaille ici ?</pre>
<div class="warn">Même piège : après <strong>Does</strong>, le verbe reste à la forme de base, SANS -s. « Does she work? » (pas « Does she works? »).</div>
<h3>4. Les réponses courtes</h3>
<p>On ne répond pas juste « yes » ou « no » : on reprend l'auxiliaire.</p>
<pre class="pseudo">Do you like tea?   → Yes, I do. / No, I don't.
Does he work?      → Yes, he does. / No, he doesn't.</pre>
<h3>5. Récapitulatif visuel</h3>
<pre class="pseudo">Affirmatif : She works.               // -s sur le verbe
Négatif :    She doesn't work.         // -s sur DOES, verbe nu
Question :   Does she work?            // -s sur DOES, verbe nu</pre>
<div class="tip">Retiens la règle du « un seul -s » : dès que does apparaît, le verbe principal redevient nu (sans -s).</div>`,
  exercises: [
    { type: "qcm", q: "Quel auxiliaire utilise-t-on avec « he » ?", opts: ["do", "does", "is", "has"], a: 1, exp: "he, she, it → does." },
    { type: "input", q: "Complète : I ___ (do not, contraction) like tea.", a: ["don't", "dont", "do not"], ph: "un mot", exp: "I don't like tea." },
    { type: "input", q: "Complète : She ___ (does not, contraction) work here.", a: ["doesn't", "doesnt", "does not"], ph: "un mot", exp: "She doesn't work here." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["She doesn't works", "She doesn't work", "She don't work", "She not work"], a: 1, exp: "Après doesn't, le verbe est nu : doesn't work." },
    { type: "qcm", q: "Comment pose-t-on « Est-ce que tu aimes le café ? »", opts: ["You like coffee?", "Do you like coffee?", "Does you like coffee?", "Like you coffee?"], a: 1, exp: "Do + you + verbe : Do you like coffee?" },
    { type: "input", q: "Complète la question : ___ he like tea? (do ou does ?)", a: ["does"], ph: "do ou does", exp: "he → Does he like tea?" },
    { type: "vf", q: "Après « does », le verbe principal garde son -s.", a: false, exp: "Faux : le verbe redevient nu. « Does she work? », pas « works »." },
    { type: "input", q: "Complète la question : ___ they work here? (do ou does ?)", a: ["do"], ph: "do ou does", exp: "they → Do they work here?" },
    { type: "qcm", q: "Réponse courte à « Do you like tea? » (oui) :", opts: ["Yes, I like.", "Yes, I do.", "Yes, I am.", "Yes, do I."], a: 1, exp: "On reprend l'auxiliaire : Yes, I do." },
    { type: "input", q: "Complète : He ___ (does not, contraction) like coffee.", a: ["doesn't", "doesnt", "does not"], ph: "un mot", exp: "He doesn't like coffee." },
    { type: "qcm", q: "Quelle phrase est correcte à la question ?", opts: ["Does she works here?", "Do she work here?", "Does she work here?", "She does work here?"], a: 2, exp: "Does she work here? (verbe nu après does)." },
    { type: "input", q: "Complète : We ___ (do not, contraction) live in Paris.", a: ["don't", "dont", "do not"], ph: "un mot", exp: "We don't live in Paris." },
    { type: "qcm", q: "Réponse courte à « Does he work? » (non) :", opts: ["No, he doesn't.", "No, he don't.", "No, he not.", "No, he isn't."], a: 0, exp: "No, he doesn't." },
    { type: "vf", q: "On utilise « do » avec I, you, we, they.", a: true, exp: "Oui : do pour ces pronoms, does pour he/she/it." },
    { type: "input", q: "Mets à la forme négative (contraction) : « They play » → They ___ play.", a: ["don't", "dont", "do not"], ph: "un mot", exp: "They don't play." }
  ],
  final: {
    title: "Exercice final — Négation et question",
    intro: `<p>Lis ce petit texte, puis complète et réponds.</p>
<pre class="pseudo">Sam likes coffee, but he doesn't like tea.
His sister doesn't drink coffee.
Do you like coffee or tea?</pre>
<p><em>Traduction : Sam aime le café, mais il n'aime pas le thé. Sa soeur ne boit pas de café. Est-ce que tu aimes le café ou le thé ?</em></p>`,

      { type: "input", q: "Complète la question : ___ you like coffee? (do ou does ?)", a: ["do"], ph: "do ou does", exp: "you → Do you like coffee?" },
      { type: "vf", q: "« Does she work? » est correct (verbe sans -s après does).", a: true, exp: "Oui : après does, le verbe est nu." },
      { type: "qcm", q: "Réponse courte à « Does she drink coffee? » (non) :", opts: ["No, she doesn't.", "No, she don't.", "No, she isn't.", "No, she not."], a: 0, exp: "No, she doesn't." }
    ],
    solution: `<p>Le mécanisme complet :</p>
<pre class="pseudo">Négatif : don't / doesn't + verbe NU
   I don't work.    He doesn't work.
Question : Do / Does + sujet + verbe NU
   Do you work?     Does he work?
Règle du « un seul -s » : quand does apparaît, le verbe perd son -s.</pre>
<p>Ne mets jamais deux -s dans la même phrase. « She works » (affirmatif) devient « She doesn't work » et « Does she work? ». Le -s voyage sur l'auxiliaire.</p>`
  }
