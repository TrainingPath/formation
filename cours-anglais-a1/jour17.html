<!DOCTYPE html><html lang="fr"><head>

<script>
var DAY = {
  num: 17,
  title: "La famille",
  subtitle: "Nommer les membres de la famille et parler de ses proches.",
  theory: `
<h3>1. Le vocabulaire de la famille</h3>
<p>Voici les mots essentiels. Beaucoup vont par paires (masculin / feminin).</p>
<pre class="pseudo">father / dad     pere / papa       mother / mum    mere / maman
brother          frere             sister          soeur
son              fils              daughter        fille
husband          mari              wife            femme (epouse)
grandfather      grand-pere        grandmother     grand-mere
uncle            oncle             aunt            tante
cousin           cousin/cousine    child           enfant</pre>
<div class="tip">Le pluriel de <em>child</em> est irregulier : <strong>children</strong> (des enfants). Les <em>parents</em> = le pere et la mere (et non « les proches »).</div>
<h3>2. Parler de la possession : 's</h3>
<p>Pour dire « le frere de Marie », on ajoute <strong>'s</strong> au proprietaire : <em>Marie's brother</em>. C'est le genitif saxon.</p>
<pre class="pseudo">Tom's mother     la mere de Tom
my sister's cat  le chat de ma soeur
the boy's dog    le chien du garcon</pre>
<h3>3. Les adjectifs possessifs</h3>
<p>Ils indiquent a qui appartient quelque chose. Ils ne changent PAS selon l'objet possede.</p>
<pre class="pseudo">my      mon/ma/mes         our     notre/nos
your    ton/ta/tes         your    votre/vos
his     son/sa (a lui)     their   leur/leurs
her     son/sa (a elle)
its     son/sa (objet/animal)</pre>
<div class="warn">Attention : <strong>his</strong> = a lui, <strong>her</strong> = a elle. On choisit selon le POSSESSEUR, pas selon l'objet. <em>her brother</em> = son frere (a elle).</div>
<h3>4. Presenter sa famille</h3>
<pre class="pseudo">This is my sister.        Voici ma soeur.
I have two brothers.      J'ai deux freres.
Her name is Anna.         Elle s'appelle Anna.
He is my father.          C'est mon pere.</pre>
<h3>5. Poser des questions</h3>
<pre class="pseudo">Do you have brothers or sisters?   As-tu des freres ou des soeurs ?
How many cousins do you have?      Combien de cousins as-tu ?
Yes, I have one sister.            Oui, j'ai une soeur.</pre>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on <strong>soeur</strong> en anglais ?", opts: ["brother", "sister", "daughter", "aunt"], a: 1, exp: "sister = soeur. brother = frere." },
    { type: "input", q: "Traduis « grand-mere » en anglais.", a: ["grandmother"], ph: "un mot", exp: "grandmother = grand-mere." },
    { type: "qcm", q: "Quel est le pluriel de <em>child</em> ?", opts: ["childs", "childes", "children", "childrens"], a: 2, exp: "children est un pluriel irregulier." },
    { type: "input", q: "Complete : « Tom___ mother » (la mere de Tom).", a: ["'s", "s"], ph: "possession", exp: "On ajoute 's : Tom's mother." },
    { type: "vf", q: "« Parents » en anglais veut dire « le pere et la mere ».", a: true, exp: "parents = les parents (pere + mere)." },
    { type: "qcm", q: "Choisis : « ___ brother » pour « son frere (a elle) ».", opts: ["his", "her", "its", "your"], a: 1, exp: "her = a elle. On choisit selon la possesseuse." },
    { type: "input", q: "Traduis « oncle » en anglais.", a: ["uncle"], ph: "un mot", exp: "uncle = oncle. aunt = tante." },
    { type: "qcm", q: "« his » signifie…", opts: ["a elle", "a lui", "a nous", "a eux"], a: 1, exp: "his = son/sa a lui." },
    { type: "input", q: "Complete : « I ___ two sisters. » (J'ai deux soeurs.)", a: ["have"], ph: "verbe", exp: "I have = j'ai." },
    { type: "vf", q: "« daughter » signifie fils.", a: false, exp: "daughter = fille. son = fils." },
    { type: "qcm", q: "Comment traduire « notre pere » ?", opts: ["my father", "your father", "our father", "their father"], a: 2, exp: "our = notre/nos." },
    { type: "input", q: "Traduis « femme (epouse) » en anglais.", a: ["wife"], ph: "un mot", exp: "wife = epouse. husband = mari." },
    { type: "qcm", q: "Quelle question demande le nombre de cousins ?", opts: ["Where are your cousins?", "How many cousins do you have?", "Who is your cousin?", "Do you like cousins?"], a: 1, exp: "How many...? demande une quantite." },
    { type: "vf", q: "« their » signifie « leur / leurs ».", a: true, exp: "their = leur/leurs (a eux/elles)." },
    { type: "input", q: "Complete : « This ___ my brother. » (Voici mon frere.)", a: ["is"], ph: "verbe be", exp: "This is = voici / c'est." }
  ],
  final: {
    title: "Exercice final — La famille de Sara",
    intro: `<p>Lis la presentation de Sara, puis reponds :</p>
<pre class="pseudo">Hello! My name is Sara. I have one brother and one sister.
My brother's name is Leo. My sister's name is Mia.
My mother is a teacher and my father is a doctor.
I also have two cousins. Their names are Ben and Lucy.</pre>`,
    questions: [
      { type: "input", q: "Comment s'appelle le frere de Sara ? (prenom en anglais)", a: ["leo"], ph: "prenom", exp: "My brother's name is Leo." },
      { type: "qcm", q: "Quel est le metier de sa mere ?", opts: ["a doctor", "a teacher", "a student", "a nurse"], a: 1, exp: "My mother is a teacher." },
      { type: "qcm", q: "Combien de cousins a Sara ?", opts: ["one", "two", "three", "four"], a: 1, exp: "I also have two cousins." },
      { type: "vf", q: "Le pere de Sara est medecin.", a: true, exp: "my father is a doctor = mon pere est medecin." },
      { type: "input", q: "Comment s'appelle sa soeur ? (prenom en anglais)", a: ["mia"], ph: "prenom", exp: "My sister's name is Mia." }
    ],
    solution: `<p>Sara a un frere (<em>Leo</em>) et une soeur (<em>Mia</em>). Sa mere est professeur (<em>a teacher</em>), son pere medecin (<em>a doctor</em>). Elle a deux cousins, Ben et Lucy.</p>
<p>Note l'usage du genitif : <em>My brother's name</em> = le nom de mon frere, et des possessifs <em>my</em>, <em>their</em>.</p>`
  }
};
</script>
