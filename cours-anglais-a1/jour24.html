<pre class="pseudo">get up        se lever          have breakfast   prendre le petit-dejeuner

<h3>2. Dire l'heure</h3>
<pre class="pseudo">7:00   seven o'clock          sept heures

<h3>3. La preposition at pour l'heure</h3>
<pre class="pseudo">I get up at seven o'clock.    Je me leve a sept heures.

<div class="warn">On utilise toujours <strong>at</strong> devant une heure : <em>at 7</em>, <em>at midnight</em>, <em>at noon</em>. Jamais « in seven o'clock ».</div>
<h3>4. Les adverbes de frequence</h3>
<p>Ils se placent AVANT le verbe principal (mais apres <em>be</em>).</p>
<pre class="pseudo">always     toujours       I always get up early.

often      souvent        We often go out.
