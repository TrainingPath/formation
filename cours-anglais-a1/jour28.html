<title>Jour 28</title><link rel="stylesheet" href="style.css"></head><body>
<script>
var DAY = {
  num: 28,
  title: "Révisions de grammaire A1",
  subtitle: "Recapitulatif des points cles du niveau A1.",
  theory: `
<h3>1. Le verbe be (etre) au present</h3>
<pre class="pseudo">I am        You are       He/She/It is
We are      They are
Negatif : I'm not, isn't, aren't    Question : Are you...? Is she...?</pre>
<h3>2. Le present simple (habitudes)</h3>
<pre class="pseudo">I/you/we/they + verbe        I work every day.
he/she/it + verbe + s        She works every day.
Negatif : don't / doesn't    I don't like fish. He doesn't like tea.
Question : Do you...? Does she...?</pre>
<h3>3. Le present continu (maintenant)</h3>
<pre class="pseudo">be + verbe-ing               I am working now. She is reading.
Signaux : now, at the moment, Look!</pre>
<h3>4. Can (capacite et permission)</h3>
<pre class="pseudo">can + infinitif sans to      I can swim. He can cook.
Negatif : can't              I can't drive.
Question : Can you...?        Can I open the window?</pre>
<h3>5. There is / There are + le passe de be</h3>
<pre class="pseudo">There is + singulier         There is a cat.
There are + pluriel          There are two cats.
Passe de be : was / were     I was at home. They were happy.</pre>
<h3>6. Les petits mots essentiels</h3>
<pre class="pseudo">Articles : a / an / the
Possessifs : my, your, his, her, our, their + genitif 's (Tom's car)
Prepositions : in, on, at, under, next to
Frequence : always, usually, often, sometimes, never</pre>
<div class="warn">Erreurs frequentes a eviter : « he work » (il faut he works) ; « I am agree » (il faut I agree) ; « she can sings » (il faut she can sing) ; oublier be au present continu (« I working » -> I am working).</div>
<div class="tip">Pour choisir le temps : habitude -> present simple ; action maintenant -> present continu ; passe -> was/were (pour etre).</div>`,
  exercises: [
    { type: "qcm", q: "Choisis : « She ___ a teacher. » (present de be)", opts: ["am", "is", "are", "be"], a: 1, exp: "she -> is." },
    { type: "input", q: "Complete au present simple : « He ___ every day. » (travailler = work, 3e pers)", a: ["works"], ph: "verbe + s", exp: "3e personne : he works (habitude)." },
    { type: "qcm", q: "Negation correcte au present simple 3e pers : « He ___ like tea. »", opts: ["don't", "doesn't", "isn't", "not"], a: 1, exp: "3e personne : doesn't." },
    { type: "input", q: "Complete au present continu : « I ___ working now. » (auxiliaire be)", a: ["am", "'m"], ph: "am/is/are", exp: "now -> present continu : I am working." },
    { type: "vf", q: "« She can sings » est correct.", a: false, exp: "Faux : can + infinitif sans -s : She can sing." },
    { type: "qcm", q: "Choisis : « ___ two cats in the garden. »", opts: ["There is", "There are", "There am", "It is"], a: 1, exp: "pluriel (two cats) : There are." },
    { type: "input", q: "Complete au passe : « They ___ at home yesterday. » (was/were)", a: ["were"], ph: "was / were", exp: "they -> were." },
    { type: "qcm", q: "Quel article devant « apple » ?", opts: ["a", "an", "the only", "some"], a: 1, exp: "an devant une voyelle : an apple." },
    { type: "input", q: "Complete le possessif : « This is ___ book. » (a elle)", a: ["her"], ph: "possessif", exp: "her = a elle." },
    { type: "vf", q: "« I working now » est une phrase correcte.", a: false, exp: "Faux : il manque be -> I am working now." },
    { type: "qcm", q: "Question au present simple : « ___ you like coffee? »", opts: ["Are", "Do", "Is", "Can"], a: 1, exp: "present simple : Do you like...?" },
    { type: "input", q: "Complete au passe : « I ___ tired last night. » (I -> ?)", a: ["was"], ph: "was / were", exp: "I -> was." },
    { type: "qcm", q: "Ou place-t-on « usually » : « I ___ get up early » ?", opts: ["I get up usually early", "I usually get up early", "Usually I get up", "I get usually up"], a: 1, exp: "l'adverbe de frequence se place avant le verbe." },
    { type: "vf", q: "« Can you help me? » est une demande correcte.", a: true, exp: "Can + you + verbe : demande polie." },
    { type: "input", q: "Complete le genitif : « This is Tom___ car. » (la voiture de Tom)", a: ["'s", "s"], ph: "genitif", exp: "Tom's car = la voiture de Tom." }
  ],
  final: {
    title: "Exercice final — Retrouve les erreurs",
    intro: `<p>Voici un petit texte avec une grammaire correcte. Lis-le, puis reponds aux questions de revision :</p>
<pre class="pseudo">Anna is a student. She gets up at seven every day and she goes to school.
She can speak English and French. Right now she is doing her homework.
Yesterday she was at the library. There are many books there.</pre>`,
    questions: [
      { type: "qcm", q: "« She gets up at seven every day » est au…", opts: ["present continu", "present simple", "passe", "futur"], a: 1, exp: "every day -> habitude -> present simple." },
      { type: "qcm", q: "« Right now she is doing her homework » est au…", opts: ["present simple", "present continu", "passe", "futur"], a: 1, exp: "right now + be + verbe-ing -> present continu." },
      { type: "input", q: "Complete d'apres le texte : « Yesterday she ___ at the library. » (was/were)", a: ["was"], ph: "was / were", exp: "she -> was." },
      { type: "vf", q: "« She can speak English » utilise correctement can + infinitif.", a: true, exp: "can + speak (infinitif sans to)." },
      { type: "qcm", q: "« There are many books » est correct car « books » est…", opts: ["singulier", "pluriel", "un verbe", "un adjectif"], a: 1, exp: "pluriel -> There are." }
    ],
    solution: `<p>Ce texte combine tous les points A1 : present simple pour l'habitude (<em>gets up, goes</em>), <em>can</em> pour la capacite (<em>can speak</em>), present continu pour maintenant (<em>is doing</em>), passe de be (<em>was</em>) et <em>there are</em> pour le pluriel.</p>
<p>Revois surtout : le -s a la 3e personne du present simple, le be obligatoire au present continu, et le choix was/were.</p>`
  }
};
</script>
