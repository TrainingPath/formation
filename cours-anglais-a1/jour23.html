<script>
var DAY = {
  num: 23,
  title: "Présent simple ou présent continu ?",
  subtitle: "Choisir entre habitude et action en cours.",
  theory: `
<h3>1. Deux presents, deux usages</h3>
<p>L'anglais a deux presents. Le choix depend du SENS :</p>
<pre class="pseudo">Present simple    -> habitude, verite generale, routine
Present continu   -> action en train de se passer MAINTENANT</pre>
<pre class="pseudo">I play football every Sunday.   Je joue au foot chaque dimanche. (habitude)
I am playing football now.       Je joue au foot maintenant. (en cours)</pre>
<h3>2. Le present simple : la routine</h3>
<p>Forme : verbe a l'infinitif, + <strong>-s</strong> a la 3e personne (he, she, it).</p>
<pre class="pseudo">I work.     You work.     He works.   (attention au -s)
She reads every day.     Elle lit tous les jours.</pre>
<h3>3. Le present continu : maintenant</h3>
<p>Forme : <strong>be + verbe-ing</strong> (revu au jour 22).</p>
<pre class="pseudo">She is reading now.      Elle lit en ce moment.</pre>
<h3>4. Les mots-signaux</h3>
<p>Certains mots aident a choisir le bon temps :</p>
<pre class="pseudo">Present simple : every day, always, usually, often, sometimes, never
Present continu : now, right now, at the moment, look!, listen!</pre>
<div class="tip">Si tu vois <em>now</em>, <em>at the moment</em> ou <em>Look!</em> -> present continu. Si tu vois <em>every day</em>, <em>usually</em>, <em>always</em> -> present simple.</div>
<h3>5. Les verbes d'etat (pas de -ing)</h3>
<p>Certains verbes decrivent un etat, pas une action : <strong>like, love, want, know, have (posseder)</strong>. On les met au present SIMPLE, meme pour maintenant.</p>
<pre class="pseudo">I like this song.        (et non : I am liking)
She wants a coffee.      Elle veut un cafe. (et non : she is wanting)
I know the answer.       Je connais la reponse.</pre>
<div class="warn">On ne dit pas « I am knowing » ni « I am wanting ». Ces verbes d'etat restent au present simple.</div>`,
  exercises: [
    { type: "qcm", q: "Choisis : « Every Sunday I ___ football. » (habitude)", opts: ["am playing", "play", "playing", "plays"], a: 1, exp: "Habitude (every Sunday) : present simple, play." },
    { type: "input", q: "Complete au present continu : « Look! She ___ running. » (auxiliaire)", a: ["is", "'s"], ph: "am/is/are", exp: "Look! -> action en cours : She is running." },
    { type: "qcm", q: "Quel temps pour « He works every day » ?", opts: ["present continu", "present simple", "passe", "futur"], a: 1, exp: "every day -> habitude -> present simple." },
    { type: "input", q: "Complete : « I ___ playing football now. » (auxiliaire be)", a: ["am", "'m"], ph: "am/is/are", exp: "now -> present continu : I am playing." },
    { type: "vf", q: "« now » est un signal du present continu.", a: true, exp: "now, at the moment, Look! -> present continu." },
    { type: "qcm", q: "Choisis : « She usually ___ tea. » (usually = d'habitude)", opts: ["is drinking", "drink", "drinks", "drinking"], a: 2, exp: "usually -> habitude -> present simple 3e pers : drinks." },
    { type: "input", q: "Complete au present simple 3e personne : « He ___ every morning. » (courir = run)", a: ["runs"], ph: "verbe + s", exp: "3e personne : runs (habitude)." },
    { type: "qcm", q: "Quel verbe ne se met PAS au -ing (verbe d'etat) ?", opts: ["play", "run", "know", "eat"], a: 2, exp: "know est un verbe d'etat : I know, pas I am knowing." },
    { type: "input", q: "Complete correctement : « I ___ this song. » (aimer, verbe d'etat)", a: ["like"], ph: "verbe", exp: "verbe d'etat : I like (pas I am liking)." },
    { type: "vf", q: "« I am wanting a coffee » est correct.", a: false, exp: "Faux : want est un verbe d'etat -> I want a coffee." },
    { type: "qcm", q: "Choisis : « At the moment they ___ dinner. »", opts: ["have", "having", "are having", "has"], a: 2, exp: "At the moment -> present continu : are having." },
    { type: "input", q: "Complete au present continu : « She ___ a book now. » (lire = read, avec auxiliaire)", a: ["is reading"], ph: "be + verbe-ing", exp: "now -> She is reading a book." },
    { type: "qcm", q: "Quelle phrase decrit une habitude ?", opts: ["Listen! He is singing.", "I sometimes read at night.", "Look! It's raining.", "They are eating now."], a: 1, exp: "sometimes -> habitude -> present simple." },
    { type: "vf", q: "« every day » indique le present simple.", a: true, exp: "every day, always, usually -> present simple." },
    { type: "input", q: "Complete : « We ___ television every evening. » (present simple : watch)", a: ["watch"], ph: "verbe", exp: "every evening -> habitude : We watch." }
  ],
  final: {
    title: "Exercice final — Une journee de Lucy",
    intro: `<p>Lis le texte, puis choisis le bon temps :</p>
<pre class="pseudo">Lucy usually gets up at seven o'clock. She works in an office every day.
But today is Sunday. Right now she is sitting in the garden.
She is drinking coffee and reading a magazine. She loves Sundays!</pre>`,
    questions: [
      { type: "qcm", q: "« Lucy usually gets up at seven » est au…", opts: ["present continu", "present simple", "passe", "futur"], a: 1, exp: "usually -> habitude -> present simple." },
      { type: "qcm", q: "Que fait Lucy en ce moment (right now) ?", opts: ["She works.", "She is sitting in the garden.", "She gets up.", "She sleeps."], a: 1, exp: "Right now she is sitting -> present continu." },
      { type: "input", q: "Complete : « She ___ drinking coffee. » (auxiliaire be)", a: ["is", "'s"], ph: "am/is/are", exp: "present continu : She is drinking." },
      { type: "vf", q: "« She loves Sundays » est correct (love est un verbe d'etat).", a: true, exp: "love est un verbe d'etat : present simple, pas de -ing." },
      { type: "input", q: "Complete au present simple : « She ___ in an office every day. » (work)", a: ["works"], ph: "verbe + s", exp: "every day, 3e personne : works." }
    ],
    solution: `<p>D'habitude Lucy se leve a 7h et travaille au bureau chaque jour : ce sont des habitudes -> <strong>present simple</strong> (<em>gets up, works</em>). Mais maintenant (dimanche), elle est assise dans le jardin, elle boit un cafe et lit : actions en cours -> <strong>present continu</strong> (<em>is sitting, is drinking, is reading</em>). <em>loves</em> reste au present simple car c'est un verbe d'etat.</p>
<p>Methode : cherche le mot-signal (every day / usually vs now / right now) et verifie si le verbe est un verbe d'etat.</p>`
  }
};
</script>
