<script>
var DAY = {
  num: 14,
  title: "Les mots interrogatifs (what, where...)",
  subtitle: "Poser des questions ouvertes : quoi, où, quand, qui, pourquoi, comment.",
  theory: `
<h3>1. Questions fermées et questions ouvertes</h3>
<p>Hier, tu as vu les questions auxquelles on répond par oui/non (« Do you like tea? »). Aujourd'hui, tu apprends les questions <strong>ouvertes</strong>, qui demandent une information précise. Elles commencent par un <strong>mot interrogatif</strong> (souvent appelé « wh- word » car beaucoup commencent par wh).</p>
<h3>2. Les principaux mots interrogatifs</h3>
<pre class="pseudo">what   → quoi / que / quel     What is your name?    (Quel est ton nom ?)
where  → où                    Where do you live?    (Où habites-tu ?)
when   → quand                 When is the party?    (Quand est la fête ?)
who    → qui                   Who is she?           (Qui est-elle ?)
why    → pourquoi              Why are you sad?      (Pourquoi es-tu triste ?)
how    → comment               How are you?          (Comment vas-tu ?)
which  → lequel / quel         Which colour?         (Quelle couleur ?)</pre>
<h3>3. La structure d'une question ouverte</h3>
<p>L'ordre est : <strong>mot interrogatif + auxiliaire (do/does/is/are) + sujet + verbe</strong>. On combine le wh- word avec ce qu'on a appris hier.</p>
<pre class="pseudo">Where do you live?      → mot + do + you + live      (Où habites-tu ?)
What does she want?     → mot + does + she + want     (Que veut-elle ?)
Who is that man?        → mot + is + that man          (Qui est cet homme ?)
When are you free?      → mot + are + you + free       (Quand es-tu libre ?)</pre>
<div class="warn">Ne pas oublier l'auxiliaire ! On dit « Where do you live? », pas « Where you live? ». Avec un verbe ordinaire au présent, il faut do/does. Avec to be, on utilise is/are directement.</div>
<h3>4. Les expressions avec how</h3>
<p><strong>how</strong> (comment) se combine avec d'autres mots pour des questions très utiles :</p>
<pre class="pseudo">how old   → quel âge        How old are you?      (Quel âge as-tu ?)
how many  → combien (nombre) How many books?       (Combien de livres ?)
how much  → combien (prix)   How much is it?       (Combien ça coûte ?)
how are   → comment (va)     How are you?          (Comment vas-tu ?)</pre>
<div class="tip">« how many » compte des choses dénombrables (livres, chats), « how much » demande un prix ou une quantité non comptable. À ton niveau, retiens surtout « How much is it? » (Combien ça coûte ?).</div>
<h3>5. Répondre à une question ouverte</h3>
<pre class="pseudo">Where do you live? → I live in Paris.       (J'habite à Paris.)
What is your name? → My name is Sam.        (Je m'appelle Sam.)
How old are you?   → I am twelve.           (J'ai douze ans.)
Why are you happy? → Because it is my birthday. (Parce que c'est mon anniversaire.)</pre>`,
  exercises: [
    { type: "qcm", q: "Quel mot interrogatif signifie « où » ?", opts: ["what", "where", "when", "who"], a: 1, exp: "where = où." },
    { type: "input", q: "Complète : ___ is your name? (mot pour « quel »)", a: ["what"], ph: "un mot", exp: "What is your name? = quel est ton nom ?" },
    { type: "qcm", q: "Que signifie « when » ?", opts: ["où", "qui", "quand", "pourquoi"], a: 2, exp: "when = quand." },
    { type: "input", q: "Complète : ___ do you live? (mot pour « où »)", a: ["where"], ph: "un mot", exp: "Where do you live? = où habites-tu ?" },
    { type: "qcm", q: "Que signifie « why » ?", opts: ["comment", "pourquoi", "quand", "quel"], a: 1, exp: "why = pourquoi." },
    { type: "input", q: "Complète : ___ are you? (pour demander comment ça va)", a: ["how"], ph: "un mot", exp: "How are you? = comment vas-tu ?" },
    { type: "qcm", q: "Quelle question est correcte ?", opts: ["Where you live?", "Where do you live?", "Where lives you?", "You where live?"], a: 1, exp: "Il faut l'auxiliaire : Where do you live?" },
    { type: "input", q: "Complète : ___ is she? (mot pour « qui »)", a: ["who"], ph: "un mot", exp: "Who is she? = qui est-elle ?" },
    { type: "qcm", q: "Comment demande-t-on l'âge ?", opts: ["How much are you?", "How many are you?", "How old are you?", "What age you?"], a: 2, exp: "How old are you? = quel âge as-tu ?" },
    { type: "input", q: "Complète : ___ does she want? (mot pour « que/quoi »)", a: ["what"], ph: "un mot", exp: "What does she want? = que veut-elle ?" },
    { type: "vf", q: "« How much is it? » demande le prix de quelque chose.", a: true, exp: "Oui : how much = combien (prix)." },
    { type: "qcm", q: "Quelle question demande un nombre de choses ?", opts: ["How much books?", "How many books?", "How old books?", "How are books?"], a: 1, exp: "how many = combien (choses dénombrables)." },
    { type: "input", q: "Complète : ___ is the party? (mot pour « quand »)", a: ["when"], ph: "un mot", exp: "When is the party? = quand est la fête ?" },
    { type: "qcm", q: "Quelle est la bonne structure ?", opts: ["What she does want?", "What does she want?", "What want she?", "Does what she want?"], a: 1, exp: "mot + does + sujet + verbe : What does she want?" },
    { type: "input", q: "Complète : ___ are you sad? (mot pour « pourquoi »)", a: ["why"], ph: "un mot", exp: "Why are you sad? = pourquoi es-tu triste ?" }
  ],
  final: {
    title: "Exercice final — Interviewer quelqu'un",
    intro: `<p>Lis ce petit dialogue, puis complète et réponds.</p>
<pre class="pseudo">- What is your name? - My name is Mia.
- Where do you live?  - I live in Bristol.
- How old are you?    - I am eleven.</pre>
<p><em>Traduction : Quel est ton nom ? Je m'appelle Mia. Où habites-tu ? J'habite à Bristol. Quel âge as-tu ? J'ai onze ans.</em></p>`,
    questions: [
      { type: "input", q: "Complète : ___ is your name? (mot pour « quel »)", a: ["what"], ph: "un mot", exp: "What is your name?" },
      { type: "input", q: "Complète : ___ do you live? (mot pour « où »)", a: ["where"], ph: "un mot", exp: "Where do you live?" },
      { type: "qcm", q: "Comment demander l'âge de Mia ?", opts: ["How much are you?", "How old are you?", "What age you?", "How many you?"], a: 1, exp: "How old are you?" },
      { type: "vf", q: "« Where do you live? » a besoin de l'auxiliaire « do ».", a: true, exp: "Oui : avec un verbe ordinaire, il faut do/does." },
      { type: "qcm", q: "Quelle question pour « Pourquoi es-tu content ? »", opts: ["When are you happy?", "Who are you happy?", "Why are you happy?", "How are you happy?"], a: 2, exp: "Why = pourquoi." }
    ],
    solution: `<p>Les mots interrogatifs et la structure :</p>
<pre class="pseudo">what (quoi)  where (où)  when (quand)  who (qui)  why (pourquoi)  how (comment)
Structure : mot + do/does/is/are + sujet + verbe
   What does she want?     Where do you live?     How old are you?</pre>
<p>Deux réflexes : commence par le bon wh- word, puis n'oublie pas l'auxiliaire (do/does pour les verbes ordinaires, is/are pour to be). Avec ces mots, tu peux mener une vraie petite conversation.</p>`
  }
};
