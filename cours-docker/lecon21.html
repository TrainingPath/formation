<script>
var DAY = {
  num: 21,
  title: "Récapitulatif : la Ludothèque en conteneurs (examen)",
  subtitle: "Tout le cours en une épreuve : de docker run à la production.",
  theory: `
<h3>Récapitulatif avant l'épreuve</h3>
<p>Vingt et une leçons, et l'application du Niveau 6 tourne désormais en conteneurs, du poste de dev au serveur. Récapitulons le vocabulaire et les idées clés avant les 20 questions — chaque terme en gras a été défini au fil du cours.</p>

<h3>1. Les fondations</h3>
<p>Une <strong>image</strong> (le moule figé en lecture seule, fait de <strong>couches</strong> partagées et empilées) donne naissance à des <strong>conteneurs</strong> (des processus isolés par le <strong>noyau</strong> — donc plus légers que des machines virtuelles, qui embarquent tout un OS). Les <strong>tags</strong> (étiquettes de version) sont <strong>épinglés</strong> pour rester reproductibles, et le cycle de vie se pilote à la main (run, ps, logs, exec, stop, rm).</p>

<h3>2. Notre image</h3>
<p>Le <strong>Dockerfile</strong> (la recette de construction) place les dépendances d'abord (pour profiter du <strong>cache</strong>), le code ensuite, et lance le programme via un <code>CMD</code> en forme exec sur <code>0.0.0.0</code> (pour être joignable). Il se construit avec un <strong>.dockerignore</strong> qui interdit tout secret. On applique le <strong>multi-stage</strong> (construire dans un étage jeté, n'exécuter que l'essentiel) pour ne livrer que le nécessaire, et un <strong>USER non-root</strong> pour le moindre privilège.</p>

<h3>3. L'assemblage</h3>
<p>Les <strong>volumes</strong> portent l'état durable (règle : conteneur = compute jetable, données = état précieux), le <strong>réseau</strong> Docker relie les conteneurs par nom grâce à son <strong>DNS interne</strong> (et MySQL n'est jamais publié), la configuration passe par l'<strong>environnement</strong> (variables et <code>--env-file</code>). <strong>Compose</strong> déclare tout cela dans un fichier YAML : services, <strong>healthchecks</strong> (car démarré n'est pas prêt), politiques de restart, limites de ressources, rotation des logs.</p>

<h3>4. La production</h3>
<p>L'image versionnée (le <strong>tag</strong> Git correspond au tag d'image) est <strong>poussée</strong> vers le <strong>registre</strong> ; le serveur — qui n'a besoin que de Docker, du YAML et du <code>.env</code> — fait <code>pull</code> puis <code>up -d</code>. Mettre à jour = changer le tag ; revenir en arrière = repointer le tag précédent. Pour observer : ps → logs → inspect → stats → exec.</p>

<h3>Le trajet d'un déploiement</h3>
<pre class="pseudo">code (capstone) → Dockerfile multi-stage non-root → build           # on part du code, on écrit la recette, on construit l'image
  → tag 1.0.0 (= tag Git v1.0.0) → push registre                    # on étiquette (aligné sur Git) et on publie au registre
serveur : pull → compose up -d (réseau, volume, healthchecks, limites)   # le serveur tire l'image puis démarre tout le kit de prod
  → migrate → healthy → en ligne                                    # on applique le schéma, tout devient sain, le service est en ligne
mise à jour : tag 1.0.1 → pull → up -d   |   retour : tag 1.0.0     # évoluer = nouveau tag ; revenir = ancien tag (toujours au registre)</pre>
<div class="tip">Chaque ligne de ce trajet a été un problème avant d'être une solution : c'est comme ça qu'on retient. Bonne épreuve !</div>`,
  exercises: [
    { type: "qcm", q: "Image vs conteneur :", opts: ["Moule figé en couches / processus vivant qui en naît", "Synonymes", "VM / OS", "Fichier / dossier"], a: 0, exp: "1 image → N conteneurs." },
    { type: "qcm", q: "Un conteneur est plus léger qu'une VM car…", opts: ["Il est compressé", "Il partage le noyau de l'hôte (namespaces, cgroups)", "Il n'a pas de réseau", "Il est en cloud"], a: 1, exp: "Pas d'OS invité." },
    { type: "qcm", q: "Les tags d'images sont…", opts: ["Toujours latest", "Épinglés (python:3.14-slim, mysql:8.4)", "Aléatoires", "Optionnels en prod"], a: 1, exp: "Reproductible dans six mois." },
    { type: "qcm", q: "« Le conteneur a disparu » — premier réflexe :", opts: ["docker ps -a puis docker logs", "reboot", "réinstaller", "rm -rf"], a: 0, exp: "Exited + la cause dans les logs." },
    { type: "qcm", q: "Dans le Dockerfile, requirements.txt est copié avant le code pour…", opts: ["L'ordre alphabétique", "Que le cache épargne pip install quand seul le code change", "La sécurité", "Le style"], a: 1, exp: "Le cache est séquentiel." },
    { type: "qcm", q: "CMD en forme exec (tableau JSON) garantit…", opts: ["La vitesse", "La bonne réception des signaux (stop propre)", "Moins de RAM", "Le DNS"], a: 1, exp: "PID 1 sans shell intermédiaire." },
    { type: "qcm", q: "Un serveur bindé sur 127.0.0.1 dans le conteneur est…", opts: ["Joignable via -p", "Injoignable de l'extérieur : on écoute 0.0.0.0", "Plus sûr et joignable", "Interdit"], a: 1, exp: "localhost = le conteneur." },
    { type: "qcm", q: "Un secret entré dans une couche d'image…", opts: ["Disparaît au RUN rm suivant", "Y reste (history) : exclure, reconstruire, changer le secret", "Est chiffré", "Expire"], a: 1, exp: "Les couches n'oublient rien." },
    { type: "qcm", q: "Les données MySQL survivent aux conteneurs grâce…", opts: ["Au cache", "Au volume nommé monté sur /var/lib/mysql", "À l'image", "À Git"], a: 1, exp: "Compute jetable, état précieux." },
    { type: "qcm", q: "DB_HOST=bdd fonctionne car…", opts: ["bdd est une IP", "Le réseau Docker fournit un DNS par nom de conteneur/service", "C'est magique", "MySQL le devine"], a: 1, exp: "Réseau utilisateur / Compose." },
    { type: "qcm", q: "MySQL en production est…", opts: ["Publié sur 3306", "Non publié : joignable du seul réseau interne", "Sur Internet", "En latest"], a: 1, exp: "Surface d'attaque minimale." },
    { type: "qcm", q: "La règle d'or de la configuration :", opts: ["Tout dans l'image", "Image = code, environnement = config (même image partout)", "Tout dans le YAML commité", "Tout en dur"], a: 1, exp: "--env-file par environnement." },
    { type: "qcm", q: "depends_on avec condition: service_healthy attend…", opts: ["Le démarrage du conteneur", "Que le healthcheck déclare le service PRÊT", "10 secondes", "Le volume"], a: 1, exp: "Démarré ≠ prêt." },
    { type: "qcm", q: "restart: unless-stopped…", opts: ["Ne relance jamais", "Relance crash et reboot, respecte l'arrêt volontaire", "Relance même après stop", "Supprime les volumes"], a: 1, exp: "Le choix de prod." },
    { type: "qcm", q: "Le bind mount .:/app sert…", opts: ["À la production", "Au dev : code local à chaud, via compose.override.yaml", "Aux sauvegardes", "Au registre"], a: 1, exp: "Jamais en prod." },
    { type: "qcm", q: "Le multi-stage build…", opts: ["Multiplie les images finales", "Jette l'outillage de build : image finale légère et plus sûre", "Ralentit", "Est obligatoire"], a: 1, exp: "COPY --from=builder." },
    { type: "qcm", q: "USER ludo dans le Dockerfile…", opts: ["Crée un compte MySQL", "Fait tourner le processus sans privilèges root", "Change le registre", "Publie un port"], a: 1, exp: "Moindre privilège." },
    { type: "qcm", q: "Re-pousser une image différente sur le tag 1.0.0 est…", opts: ["Pratique", "Interdit : un tag de version est immuable", "Automatique", "Sans effet"], a: 1, exp: "Le contrat des versions." },
    { type: "qcm", q: "Un conteneur tué mystérieusement, mémoire en cause — la preuve :", opts: ["docker inspect → OOMKilled: true", "les logs applicatifs", "la colonne STATUS de docker ps", "un simple docker restart"], a: 0, exp: "Puis stats et limites." },
    { type: "qcm", q: "Le serveur de production a besoin de…", opts: ["Python + gunicorn + le code", "Docker, compose.yaml, .env.prod — l'image vient du registre", "Un IDE", "Le dépôt complet"], a: 1, exp: "pull + up -d." }
  ],
  final: {
    title: "Épreuve de synthèse — Le déploiement complet",
    intro: `<p>La version 1.1.0 de la Ludothèque (nouvelles réservations) doit partir en production. Déroulez.</p>`,
    questions: [
      { type: "qcm", q: "Le build :", opts: ["Multi-stage non-root, tag 1.1.0 aligné sur le tag Git v1.1.0", "latest sur le serveur", "un simple docker commit", "un bind mount"], a: 0, exp: "L'artefact versionné." },
      { type: "qcm", q: "La publication :", opts: ["docker push tonuser/ludotheque:1.1.0 (registre privé, scan CVE)", "un docker save vers un .tar", "un scp du Dockerfile", "git push suffit"], a: 0, exp: "L'image quitte la machine." },
      { type: "qcm", q: "Sur le serveur :", opts: ["Tag changé dans compose → pull → up -d → migrate", "rebuild", "rsync du code", "réinstallation"], a: 0, exp: "Chirurgical : seul app est recréé." },
      { type: "qcm", q: "La vérification :", opts: ["compose ps (healthy) + curl + logs -f", "relire le compose.yaml", "un docker inspect rapide", "un ping"], a: 0, exp: "La méthode d'observation." },
      { type: "vf", q: "En cas de problème, le retour au tag 1.0.x prend moins de deux minutes, données intactes.", a: true, exp: "🎓 Immuabilité + volumes : le filet complet." }
    ],
    solution: `<pre class="pseudo"># poste de dev / CI
docker build -t tonuser/ludotheque:1.1.0 .     # construit l'image (multi-stage, non-root)
docker push tonuser/ludotheque:1.1.0           # publie l'artefact versionné au registre
git tag v1.1.0 && git push --tags              # aligne le tag Git sur le tag d'image (traçabilité)

# serveur
# compose.yaml : image: tonuser/ludotheque:1.1.0   # on référence la nouvelle version
docker compose pull && docker compose up -d     # tire l'image et relance : seul le service app est recréé
docker compose exec app python manage.py migrate   # applique les migrations de la nouvelle version
docker compose ps                               # vérifie que tout est healthy ✔

# retour arrière si besoin : image: ...:1.0.0 → up -d   # on repointe l'ancien tag (moins de 2 min, données intactes)</pre>
<p>🎓 <strong>Félicitations !</strong> La Ludothèque conçue en Merise, codée au Niveau 6, tourne en conteneurs reproductibles, durcis et versionnés. Dernière étape de la formation : automatiser tout ça — le cours CI/CD & Git avancé.</p>`
  }
};
</script>
