var DAY = {
  num: 6,
  title: "Build, cache et .dockerignore",
  subtitle: "Construire vite, reconstruire encore plus vite, ne rien embarquer de trop.",
  theory: `
<h3>1. Construire l'image</h3>
<p><strong>Construire</strong> (« build »), c'est transformer le Dockerfile (la recette) en image (le produit fini). La commande est <code>docker build</code>. Deux détails importants : <code>-t</code> donne un nom et un tag à l'image, et le <code>.</code> final désigne le <strong>contexte de build</strong> — le dossier entier envoyé au <strong>démon</strong> Docker pour qu'il construise (souviens-toi : le démon est le programme d'arrière-plan qui fait le vrai travail).</p>
<pre class="pseudo">docker build -t ludotheque:0.1 .              # construit l'image à partir du Dockerfile du dossier courant
# -t ludotheque:0.1   étiquette l'image avec un nom (ludotheque) et un tag (0.1)
# .                   le CONTEXTE de build : TOUT ce dossier est envoyé au démon Docker (les COPY y puisent)</pre>

<h3>2. Le cache de build</h3>
<p>Docker est malin : il garde en mémoire (le <strong>cache</strong>) le résultat de chaque instruction. Au rebuild, si une instruction et ses fichiers n'ont pas changé, il réutilise la couche déjà calculée (marquée <code>CACHED</code>) au lieu de tout refaire. Mais attention : le cache est <strong>séquentiel</strong> — dès qu'une couche change, toutes celles d'après doivent être refaites.</p>
<pre class="pseudo">1er build   : chaque instruction s'exécute vraiment (pip install : long)   # première fois : rien en cache, tout tourne
2e build    : pour chaque instruction inchangée -> réutilisée (CACHED)      # Docker saute le travail déjà fait : c'est instantané
MAIS : dès qu'une couche est INVALIDÉE, TOUTES les suivantes se refont      # le cache est en chaîne : casser un maillon casse la suite</pre>
<p>D'où l'importance de l'ordre du Dockerfile : le <strong>stable d'abord</strong> (les dépendances, qui changent rarement), le <strong>volatil ensuite</strong> (le code, qui change tout le temps). Ainsi modifier <code>views.py</code> ne relance pas <code>pip install</code>.</p>

<h3>3. .dockerignore</h3>
<p>Le fichier <code>.dockerignore</code> (comme <code>.gitignore</code>) liste ce qui doit être <strong>exclu du contexte de build</strong> : ni envoyé au démon, ni copié par <code>COPY . .</code>. Deux gains : un build plus rapide et, surtout, aucun secret ni artefact local embarqué.</p>
<pre class="pseudo"># .dockerignore — tout ce qui est listé ici est EXCLU du contexte de build
.venv/           # l'environnement virtuel Python local : inutile et propre à ta machine
.git/            # l'historique Git complet : lourd et sans intérêt dans l'image
__pycache__/     # les fichiers Python compilés (.pyc en cache) : régénérés automatiquement
*.pyc            # idem : tout fichier .pyc individuel (le '*' remplace n'importe quel nom)
.env             # les secrets ne rentrent JAMAIS dans une image (mots de passe, clés)
node_modules/    # les dépendances JS installées : énormes, réinstallables
Dockerfile       # la recette elle-même n'a pas à se retrouver dans l'image finale</pre>
<p>Deux effets : le contexte envoyé au démon est <strong>plus léger</strong> (build plus rapide), et <code>COPY . .</code> n'embarque ni secrets, ni artefacts locaux, ni historique Git.</p>

<h3>4. Vérifier ce qu'il y a dedans</h3>
<p>Ne jamais faire confiance sur parole : on inspecte l'image. <code>history</code> montre les couches, un conteneur jetable montre le contenu réel, <code>inspect</code> montre les métadonnées.</p>
<pre class="pseudo">docker history ludotheque:0.1                 # liste les couches de l'image et le poids de chacune
docker run --rm ludotheque:0.1 ls -la /app    # lance un conteneur JETABLE (--rm) juste pour lister le contenu réel de /app
docker image inspect ludotheque:0.1           # affiche les métadonnées de l'image (CMD, ENV, ports exposés...)</pre>

<h3>5. Taguer proprement</h3>
<p>Une même image peut porter plusieurs étiquettes en même temps. Pratique pour garder une version figée ET un pointeur « latest » en local.</p>
<pre class="pseudo">docker build -t ludotheque:0.1 -t ludotheque:latest .   # construit UNE image et lui colle DEUX tags d'un coup
# une image peut porter plusieurs tags ; 0.1 restera figé,                  # 0.1 = version stable, ne bougera plus
# latest suivra les builds suivants (usage LOCAL uniquement, jamais en prod)  # latest pointera toujours vers le dernier build</pre>
<div class="warn">Un <code>.env</code> copié dans une image y est <strong>pour toujours</strong> — même supprimé par un RUN ultérieur, il reste dans la couche précédente (<code>docker history</code> le prouve). Le .dockerignore n'est pas optionnel.</div>
<div class="tip">Un build lent est presque toujours un problème d'<strong>ordre</strong> (cache cassé trop tôt) ou de <strong>contexte</strong> (dossier énorme envoyé au démon). Les deux se lisent dans la sortie du build.</div>`,
  exercises: [
    { type: "qcm", q: "docker build -t ludotheque:0.1 . — le point final est…", opts: ["Une faute", "Le contexte de build (dossier envoyé au démon)", "La racine du disque", "Un tag"], a: 1, exp: "Tout COPY puise dedans." },
    { type: "qcm", q: "-t sert à…", opts: ["Tester", "Étiqueter l'image (nom:tag)", "Créer un terminal", "Chronométrer"], a: 1, exp: "tag = étiquette." },
    { type: "qcm", q: "Au 2e build, une instruction inchangée affiche…", opts: ["ERROR", "CACHED", "SKIPPED", "Rien"], a: 1, exp: "La couche est réutilisée." },

    { type: "qcm", q: "L'ordre optimal du Dockerfile :", opts: ["Le volatil d'abord", "Le stable d'abord (dépendances), le volatil ensuite (code)", "Alphabétique", "Aléatoire"], a: 1, exp: "Modifier le code ne refait pas pip install." },
    { type: "vf", q: "Modifier views.py invalide la couche pip install si requirements.txt est copié avant le code.", a: false, exp: "Justement non : c'est le but de l'ordre." },
    { type: "qcm", q: ".dockerignore sert à…", opts: ["Ignorer des conteneurs", "Exclure des fichiers du contexte de build", "Cacher des logs", "Configurer Git"], a: 1, exp: "Léger + sans secrets." },
    { type: "qcm", q: "Doivent figurer dans .dockerignore :", opts: ["requirements.txt", ".env, .git/, .venv/, __pycache__/", "Dockerfile uniquement", "Le code source"], a: 1, exp: "Secrets et artefacts locaux." },
    { type: "qcm", q: "Un .env copié puis supprimé par un RUN ultérieur…", opts: ["A disparu", "Reste dans la couche précédente (visible via history)", "Est chiffré", "Devient inoffensif"], a: 1, exp: "Les couches n'oublient pas." },
    { type: "qcm", q: "Voir les couches et leurs tailles :", opts: ["docker history", "docker logs", "docker ps", "docker top"], a: 0, exp: "Autopsie de l'image." },
    { type: "qcm", q: "Vérifier le contenu réel de /app dans l'image :", opts: ["docker run --rm ludotheque:0.1 ls -la /app", "docker history", "cat Dockerfile", "docker ps"], a: 0, exp: "Un conteneur jetable pour inspecter." },
    { type: "qcm", q: "docker image inspect montre…", opts: ["Les métadonnées (CMD, ENV, ports…)", "Les logs", "Le CPU", "Le code source"], a: 0, exp: "La vérité de l'image." },
    { type: "vf", q: "Une image peut porter plusieurs tags à la fois.", a: true, exp: "0.1 figé + latest local." },
    { type: "qcm", q: "Un build lent vient presque toujours…", opts: ["De Docker", "D'un ordre qui casse le cache ou d'un contexte énorme", "Du CPU", "Du réseau seul"], a: 1, exp: "Les deux se diagnostiquent." },
    { type: "qcm", q: "Un contexte de build énorme (ex. .git de 500 Mo) cause…", opts: ["Rien", "Un envoi lent au démon à CHAQUE build", "Une image plus rapide", "Une erreur"], a: 1, exp: ".dockerignore le règle." }
  ],
  final: {
    title: "Exercice final — Construire proprement",
    intro: `<p>On construit, on mesure le cache, on vérifie le contenu.</p>`,
    questions: [
      { type: "qcm", q: "Construire et étiqueter :", opts: ["docker build -t ludotheque:0.1 .", "docker run build", "docker make", "docker compile"], a: 0, exp: "Le geste de base." },
      { type: "qcm", q: "Après modification du seul views.py, le rebuild :", opts: ["Refait pip install", "Réutilise la couche pip (CACHED), ne refait que COPY . .", "Échoue", "Repart de zéro"], a: 1, exp: "L'ordre paie." },
      { type: "qcm", q: ".env est absent de l'image grâce à :", opts: [".dockerignore", "la chance", "un RUN rm", "Git"], a: 0, exp: "Exclu du contexte." },
      { type: "qcm", q: "Prouver que les dépendances sont dans l'image :", opts: ["docker run --rm ludotheque:0.1 pip list", "docker ps", "pip list sur l'hôte", "docker logs"], a: 0, exp: "Inspection par conteneur jetable." },
      { type: "vf", q: "Supprimer un secret dans une couche ultérieure le fait disparaître de l'image.", a: false, exp: "Il reste dans la couche où il est entré." }
    ],
    solution: `<pre class="pseudo"># .dockerignore : .venv/ .git/ __pycache__/ *.pyc .env   # on exclut d'abord artefacts locaux et secrets

$ docker build -t ludotheque:0.1 .          # 1er build : tout s'exécute, pip install est long
# ... modification de views.py ...           # on change UNIQUEMENT le code
$ docker build -t ludotheque:0.1 .          # 2e build : Docker compare couche par couche
=> CACHED [3/5] RUN pip install ...          # la couche des dépendances est réutilisée (le cache paie)
=> [4/5] COPY . .                            # seule la couche du code est refaite (elle a changé)

$ docker run --rm ludotheque:0.1 pip list    # conteneur jetable : prouve que les dépendances sont bien dans l'image
$ docker history ludotheque:0.1              # inspection des couches : aucune trace de .env (bien exclu)</pre>
<p>L'image se construit vite et proprement. Demain : la Ludothèque démarre en conteneur.</p>`
  }
};
