<script>
var DAY = {
  num: 3,
  title: "Le cycle de vie d'un conteneur",
  subtitle: "Créer, observer, entrer, arrêter, relancer, supprimer.",
  theory: `
<h3>1. Les états d'un conteneur</h3>
<p>Un conteneur passe par une suite d'<strong>états</strong> bien définis, un peu comme un être vivant : il naît, il vit, on peut le mettre en pause, il s'arrête, puis on l'efface. Le point capital pour un débutant : <strong>arrêté ne veut pas dire supprimé</strong>. Un conteneur arrêté existe encore sur le disque (sa configuration, son système de fichiers) et peut repartir. Seule la commande <code>rm</code> l'efface pour de bon.</p>
<pre class="pseudo">created → running → (paused) → exited → supprimé   # les états : créé -> en cours -> (en pause) -> arrêté -> effacé
   run        stop/crash ↑         rm              # 'docker run' démarre ; 'stop' (ou un crash) arrête ; 'rm' supprime pour de bon
              start ────┘                          # 'docker start' relance un conteneur ARRÊTÉ sans le recréer</pre>
<p>Un conteneur <strong>arrêté existe encore</strong> (config, système de fichiers) : <code>start</code> le relance tel quel. Seul <code>rm</code> le supprime. Le <strong>système de fichiers</strong> d'un conteneur, c'est l'arborescence de dossiers et de fichiers qu'il voit de l'intérieur.</p>

<h3>2. Observer</h3>
<p>« Observer » est le premier réflexe : avant d'agir, on regarde. <code>docker ps</code> liste les conteneurs (« ps » vient de « process status », l'état des processus). Les <strong>logs</strong> sont tout ce que le programme a écrit à l'écran (ses messages, ses erreurs) — Docker les enregistre pour toi.</p>
<pre class="pseudo">docker ps                       # liste les conteneurs EN COURS d'exécution (statut running uniquement)
docker ps -a                    # -a = all : TOUS les conteneurs, y compris les arrêtés (statut Exited)
docker logs ludo                # affiche la sortie (messages/erreurs) du conteneur nommé 'ludo'
docker logs -f --tail 20 ludo   # -f = suivre en direct ; --tail 20 = n'afficher que les 20 dernières lignes</pre>

<h3>3. Entrer dans un conteneur qui tourne</h3>
<p>Parfois on veut « ouvrir la boîte » pour regarder à l'intérieur d'un conteneur en marche. La commande <code>docker exec</code> lance une commande à l'intérieur d'un conteneur <strong>déjà démarré</strong>. Attention à ne pas la confondre avec <code>run</code> : <code>run</code> crée un conteneur NEUF, <code>exec</code> rejoint un conteneur EXISTANT.</p>
<pre class="pseudo">docker exec -it ludo bash        # ouvre un shell bash interactif (-it) À L'INTÉRIEUR du conteneur 'ludo' qui tourne déjà
docker exec ludo env             # exécute une seule commande ponctuelle ('env' = lister les variables) sans ouvrir de shell
# exec n'est PAS run : 'exec' entre dans un conteneur EXISTANT et actif,
#                      'run' en CRÉE un NOUVEAU à partir d'une image</pre>

<h3>4. Arrêter proprement</h3>
<p>Arrêter un programme peut se faire en douceur ou de force. Un <strong>signal</strong> est un message que le système envoie à un processus. <strong>SIGTERM</strong> dit poliment « termine-toi, range tes affaires » ; <strong>SIGKILL</strong> ordonne « meurs immédiatement », sans laisser le temps de sauvegarder quoi que ce soit.</p>
<pre class="pseudo">docker stop ludo    # arrêt PROPRE : envoie SIGTERM (« termine-toi gentiment »), puis SIGKILL de force après 10 s si besoin
docker kill ludo    # arrêt BRUTAL : envoie directement SIGKILL (« meurs maintenant ») — dernier recours seulement
docker start ludo   # relance LE MÊME conteneur arrêté : il retrouve sa config et ce qu'il avait écrit localement</pre>

<h3>5. Nettoyer</h3>
<p>Les conteneurs arrêtés s'accumulent et prennent de la place : un peu de ménage régulier s'impose. <code>prune</code> (« élaguer ») supprime en masse ce qui ne sert plus.</p>
<pre class="pseudo">docker rm ludo             # supprime définitivement le conteneur (il doit être arrêté ; ajouter -f pour forcer)
docker container prune     # supprime d'un coup TOUS les conteneurs arrêtés (grand ménage)
docker system df           # df = disk free : montre l'espace disque pris par images, conteneurs et volumes</pre>
<p>Un conteneur meurt quand son <strong>processus principal</strong> (le <strong>PID 1</strong> — le premier et principal programme lancé, celui de la commande du <code>run</code>) se termine : un conteneur n'est pas une machine qu'on laisse allumée, c'est un <strong>processus habillé</strong> (un simple programme, entouré de son isolation).</p>
<div class="warn"><code>docker rm</code> emporte le système de fichiers du conteneur — y compris ce qui y a été écrit depuis son démarrage. Les données à garder vont dans des <strong>volumes</strong> (leçon 8).</div>
<div class="tip"><code>docker ps</code> ne montre que ce qui tourne : quand « le conteneur a disparu », le réflexe est <code>docker ps -a</code> puis <code>docker logs</code> — il est probablement Exited avec une erreur à lire.</div>`,
  exercises: [
    { type: "qcm", q: "Un conteneur arrêté (stop)…", opts: ["N'existe plus", "Existe encore et peut repartir avec start", "Devient une image", "Perd son nom"], a: 1, exp: "stop ≠ rm." },
    { type: "qcm", q: "Voir les conteneurs en cours :", opts: ["docker ps", "docker ls", "docker show", "docker images"], a: 0, exp: "-a pour tous." },
    { type: "qcm", q: "Voir aussi les conteneurs arrêtés :", opts: ["docker ps -a", "docker ps -x", "docker all", "docker dead"], a: 0, exp: "Statut Exited visible." },
    { type: "qcm", q: "Lire la sortie du processus :", opts: ["docker logs <nom>", "docker inspect <nom>", "docker top <nom>", "docker stats <nom>"], a: 0, exp: "-f pour suivre en direct." },
    { type: "qcm", q: "Un shell dans un conteneur qui tourne :", opts: ["docker exec -it <nom> bash", "docker run -it <nom>", "docker ssh", "docker open"], a: 0, exp: "exec rejoint l'existant." },
    { type: "qcm", q: "exec vs run :", opts: ["Identiques", "exec rejoint un conteneur existant, run en crée un nouveau", "run rejoint, exec crée", "Les deux créent"], a: 1, exp: "Confusion classique." },
    { type: "qcm", q: "docker stop envoie…", opts: ["SIGKILL direct", "SIGTERM (propre), puis SIGKILL après délai", "SIGINT, comme un Ctrl-C au clavier", "SIGHUP, pour recharger la config"], a: 1, exp: "Arrêt gracieux d'abord." },
    { type: "qcm", q: "docker kill…", opts: ["Tue immédiatement (SIGKILL)", "Arrête proprement", "Supprime l'image", "Redémarre"], a: 0, exp: "Dernier recours." },
    { type: "qcm", q: "Relancer un conteneur arrêté :", opts: ["docker start <nom>", "docker run <nom>", "docker up", "docker resume"], a: 0, exp: "Même conteneur, il repart." },
    { type: "qcm", q: "Un conteneur s'arrête quand…", opts: ["On ferme le terminal", "Son processus principal (PID 1) se termine", "Docker redémarre", "Aucune requête ne lui parvient pendant 60 s"], a: 1, exp: "Un processus habillé." },
    { type: "qcm", q: "Supprimer tous les conteneurs arrêtés :", opts: ["docker container prune", "docker rm -all", "docker clean", "docker rm --force --all"], a: 0, exp: "Ménage global." },
    { type: "vf", q: "docker rm supprime aussi ce que le conteneur a écrit dans son système de fichiers.", a: true, exp: "D'où les volumes (leçon 8)." },
    { type: "qcm", q: "« Mon conteneur a disparu » — premier réflexe :", opts: ["docker ps -a puis docker logs", "Réinstaller Docker", "Redémarrer le PC", "Supprimer l'image"], a: 0, exp: "Il est sans doute Exited, avec l'erreur dans les logs." },
    { type: "qcm", q: "docker system df montre…", opts: ["L'espace disque consommé par images/conteneurs/volumes", "Le CPU", "Le réseau", "Les fichiers de l'hôte"], a: 0, exp: "Diagnostic d'espace." },
    { type: "vf", q: "docker exec ludo env exécute une commande ponctuelle sans ouvrir de shell.", a: true, exp: "Pratique pour vérifier la config." }
  ],
  final: {
    title: "Exercice final — Le tour complet",
    intro: `<p>On déroule le cycle de vie entier sur un conteneur.</p>`,
    questions: [
      { type: "qcm", q: "Créer et démarrer, détaché et nommé :", opts: ["docker run -d --name essai nginx:alpine", "docker start nginx", "docker create seul", "docker exec"], a: 0, exp: "Naissance." },
      { type: "qcm", q: "Vérifier qu'il tourne, lire ses logs :", opts: ["docker ps puis docker logs essai", "docker ls", "cat nginx.log", "docker inspect seul"], a: 0, exp: "Observation." },
      { type: "qcm", q: "Entrer dedans :", opts: ["docker exec -it essai sh", "docker run -it essai", "ssh essai", "docker attach --new"], a: 0, exp: "alpine : sh (pas bash)." },
      { type: "qcm", q: "L'arrêter proprement puis le relancer :", opts: ["docker stop essai ; docker start essai", "docker kill ; docker run", "docker rm ; docker run", "reboot"], a: 0, exp: "Il survit à stop." },
      { type: "vf", q: "Après docker rm essai, docker ps -a ne le montre plus.", a: true, exp: "Suppression définitive." }
    ],
    solution: `<pre class="pseudo">$ docker run -d --name essai nginx:alpine   # naissance : crée + démarre le conteneur 'essai' en arrière-plan (created → running)
$ docker ps                                  # il apparaît dans la liste : il tourne bien
$ docker logs essai                          # on lit sa sortie (les messages de nginx)
$ docker exec -it essai sh                   # on entre dedans avec un shell (alpine a 'sh', pas 'bash')
/ # exit                                     # on quitte le shell ; le conteneur, lui, continue de tourner
$ docker stop essai                          # arrêt propre : running → exited (il existe toujours)
$ docker ps -a                               # -a le montre en statut Exited : arrêté mais pas effacé
$ docker start essai                         # on le relance tel quel : exited → running
$ docker stop essai && docker rm essai       # on l'arrête puis on le supprime : exited → supprimé
$ docker ps -a                               # plus aucune trace : le conteneur a bien été effacé</pre>
<p>Le cycle de vie n'a plus de secret. Demain : d'où viennent les images.</p>`
  }
};
</script>

  items: [
  { id: "docker-l3", title: "Le conteneur disparu", level: 2,
    statement: "Scénario : un collègue a lancé « docker run -d --name api monimage » hier ; aujourd'hui l'API ne répond plus et « docker ps » n'affiche rien. Écris la procédure de diagnostic commentée (4-5 commandes dans l'ordre) pour découvrir ce qui s'est passé et relancer le service, en expliquant ce que chaque commande peut révéler.",
    hints: [
      "docker ps -a d'abord : le conteneur est-il Exited ? Avec quel code ?",
      "docker logs api ensuite : l'erreur du processus avant sa mort.",
      "docker inspect api --format '{{.State.ExitCode}} {{.State.OOMKilled}}' peut préciser."
    ],
    atoi: { cmd: "Depuis ton projet (Docker installe), lance TA sequence, puis compare avec le resultat attendu.", expected: "docker ps -a montre STATUS « Exited (1) » (le conteneur a crashé, d'où son absence dans docker ps) ; logs affiche la dernière erreur avant la mort (ex. OperationalError MySQL) ; inspect renvoie « exit=1 oom=false » ; docker start api relance le conteneur existant." },
    checklist: ["Commences-tu par docker ps -a (et non docker ps) pour voir le conteneur arrêté ?", "Lis-tu docker logs AVANT de supprimer le conteneur mort ?", "Distingues-tu une erreur applicative (exit=1) d'un OOM (oom=true) via inspect ?", "Relances-tu avec docker start (le conteneur existe) plutôt qu'un nouveau run ?"],
    solution: "# 1. Le conteneur existe-t-il encore, et dans quel état ?\ndocker ps -a --filter name=api\n#   -> STATUS \"Exited (1) 3 hours ago\" : il a crashé il y a 3 h\n\n# 2. Pourquoi est-il mort ? Les derniers logs le disent :\ndocker logs --tail 50 api\n#   -> ex. OperationalError: Can't connect to MySQL...\n\n# 3. Précisions : code de sortie, tué par manque de mémoire ?\ndocker inspect api --format 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}}'\n#   -> exit=1 oom=false : erreur applicative, pas un OOM\n\n# 4. Corriger la cause (ex. base injoignable), puis relancer :\ndocker start api\ndocker logs -f api       # vérifier que le démarrage passe cette fois",
    note: "La chaîne ps -a → logs → inspect résout la grande majorité des « ça ne marche plus » : l'état, la cause applicative, la cause système. Le conteneur mort garde ses logs tant qu'il n'est pas rm — raison de plus pour ne pas nettoyer avant d'avoir lu. Leçon 13 : restart policies pour que ça reparte tout seul." }
  ]
};
