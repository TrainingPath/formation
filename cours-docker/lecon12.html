<script>
var DAY = {
  num: 12,
  title: "Docker Compose : l'application multi-conteneurs",
  subtitle: "Toute la Ludothèque — app, base, réseau, volume — dans un fichier, une commande.",
  theory: `
<h3>1. Le problème</h3>
<p>Jusqu'ici, on a tapé à la main de longues commandes <code>docker run</code>, créé un réseau, un volume, dans le bon ordre. Ça marche, mais ça ne se partage pas, ne se rejoue pas, ne se versionne pas. La solution : arrêter de <em>taper</em> des commandes et se mettre à <strong>déclarer</strong> le résultat voulu dans un fichier. C'est le rôle de <strong>Docker Compose</strong>.</p>

<h3>2. compose.yaml</h3>
<p><strong>Compose</strong> lit un fichier <code>compose.yaml</code> écrit en <strong>YAML</strong> (un format texte lisible où l'indentation — le décalage à gauche — définit la structure). Chaque <strong>service</strong> décrit un conteneur. Attention en YAML : on indente avec des ESPACES (jamais de tabulations).</p>
<pre class="pseudo">services:                          # section qui liste les CONTENEURS à lancer (Compose les appelle des « services »)
  app:                             # 1er service : notre application (le nom 'app' sert aussi de nom DNS sur le réseau)
    build: .                       # 'build: .' = construire l'image depuis le Dockerfile du dossier courant (NOTRE image)
    ports:                         # ports à publier vers l'extérieur
      - "8000:8000"                # publie le 8000 de l'hôte vers le 8000 du conteneur (hôte:conteneur, leçon 2)
    env_file: .env.docker          # charge toutes les variables depuis le fichier .env.docker (leçon 10)
    depends_on:                    # dépendances de démarrage
      - bdd                        # démarre 'bdd' AVANT 'app' (ordre seulement — pas la disponibilité, voir leçon 13)

  bdd:                             # 2e service : la base MySQL (nom DNS 'bdd', joignable par l'app sous ce nom)
    image: mysql:8.4               # 'image:' = tirer une image toute prête du registre (ici, pas de build)
    environment:                   # variables d'environnement écrites directement dans le YAML
      MYSQL_ROOT_PASSWORD: root-secret   # mot de passe du super-admin root
      MYSQL_DATABASE: ludotheque         # base créée au 1er démarrage
      MYSQL_USER: ludo_app               # utilisateur applicatif (droits limités)
      MYSQL_PASSWORD: secret             # mot de passe de cet utilisateur
    volumes:                       # volumes montés dans ce service
      - donnees-mysql:/var/lib/mysql     # branche le volume nommé sur le dossier de données MySQL (leçon 8)

volumes:                           # section racine qui DÉCLARE les volumes nommés du projet
  donnees-mysql:                   # déclare le volume 'donnees-mysql' (Compose le crée automatiquement s'il manque)</pre>
<p>Chaque <strong>service</strong> devient un conteneur ; Compose crée le <strong>réseau</strong> du projet et y inscrit chaque service <strong>sous son nom</strong> : <code>DB_HOST=bdd</code> marche donc tel quel, sans créer de réseau à la main.</p>

<h3>3. Les commandes du quotidien</h3>
<p>Toutes les commandes deviennent <code>docker compose ...</code> et s'appliquent à l'ensemble du projet (ou à un service précis).</p>
<pre class="pseudo">docker compose up -d          # crée et démarre TOUS les services en arrière-plan (-d) — une seule commande pour tout
docker compose ps             # affiche l'état de chaque service (up, exited...)
docker compose logs -f app    # suit en direct (-f) les logs du seul service 'app'
docker compose exec app python manage.py migrate   # exécute une commande DANS le service 'app' (ici les migrations)
docker compose down           # arrête ET supprime les conteneurs + le réseau (mais GARDE les volumes)
docker compose down -v        # ⚠ ajoute -v : supprime AUSSI les volumes -> les données sont perdues !</pre>

<h3>4. up est idempotent</h3>
<p><strong>Idempotent</strong> veut dire : relancer la même commande ne casse rien et ne refait que le strict nécessaire. Modifier le YAML puis relancer <code>up</code> ne recrée que ce qui a changé.</p>
<pre class="pseudo">« je modifie compose.yaml » -> docker compose up -d               # après un changement, on relance simplement 'up -d'
-> Compose ne recrée QUE ce qui a changé (le reste affiche "Running")   # les services inchangés restent en place : rapide et sûr</pre>

<h3>5. L'infrastructure versionnée</h3>
<p><code>compose.yaml</code> est commité dans Git à côté du code : l'infrastructure a désormais une <strong>histoire</strong>, des revues, des retours arrière — exactement comme les migrations pour le schéma de la base.</p>
<div class="warn"><code>docker compose down -v</code> supprime les volumes : les locations et achats de la Ludothèque avec. En pratique : <code>down</code> sans <code>-v</code> au quotidien ; <code>-v</code> seulement quand on veut <em>vraiment</em> repartir de zéro.</div>
<div class="tip">Relis le YAML comme un plan : services (conteneurs), ports (publication), env (config), volumes (état), noms (DNS). Tout ce que tu as appris cette semaine s'y retrouve, déclaré au lieu de tapé.</div>`,
  exercises: [
    { type: "qcm", q: "Compose remplace…", opts: ["Le Dockerfile", "La série de docker run/network/volume manuels", "Le fichier .env chargé par env_file", "L'image officielle mysql du registre"], a: 1, exp: "La procédure devient un fichier." },
    { type: "qcm", q: "Le fichier s'appelle…", opts: ["compose.yaml (ou docker-compose.yml)", "Dockerfile", "compose.json", "services.yaml"], a: 0, exp: "À la racine du projet." },
    { type: "qcm", q: "Chaque entrée de services: devient…", opts: ["Une image", "Un conteneur", "Un réseau dédié", "Un projet Compose distinct"], a: 1, exp: "app et bdd." },
    { type: "qcm", q: "build: . pour app signifie…", opts: ["Tirer du Hub", "Construire avec notre Dockerfile", "Publier l'image sur un registre", "Monter le dossier courant en bind mount"], a: 1, exp: "vs image: pour bdd." },
    { type: "qcm", q: "Le réseau du projet…", opts: ["Doit être créé à la main", "Est créé par Compose, avec DNS par nom de service", "Est partagé avec tous les autres projets Compose", "Nécessite un depends_on pour la résolution DNS"], a: 1, exp: "DB_HOST=bdd fonctionne." },
    { type: "qcm", q: "Tout démarrer :", opts: ["docker compose up -d", "docker compose run app", "docker compose start", "docker compose create"], a: 0, exp: "Une commande." },
    { type: "qcm", q: "Les logs du seul service app :", opts: ["docker compose logs -f app", "docker compose logs -f", "docker compose logs bdd", "docker compose top app"], a: 0, exp: "Par service." },
    { type: "qcm", q: "Migrer la base :", opts: ["docker compose exec app python manage.py migrate", "docker compose exec bdd python manage.py migrate", "docker compose build app", "docker compose restart app"], a: 0, exp: "exec au niveau service." },
    { type: "qcm", q: "docker compose down…", opts: ["Supprime conteneurs et réseau, GARDE les volumes", "Supprime tout, volumes compris", "Arrête seulement", "Supprime aussi les images construites"], a: 0, exp: "-v pour les volumes." },
    { type: "vf", q: "docker compose down -v est anodin.", a: false, exp: "Il détruit les données." },
    { type: "qcm", q: "up -d après une modification du YAML…", opts: ["Recrée tout", "Ne recrée que ce qui a changé (idempotent)", "Oblige à faire down puis up", "Ignore le changement"], a: 1, exp: "Confort du déclaratif." },
    { type: "qcm", q: "compose.yaml est…", opts: ["Secret, hors Git", "Commité : l'infrastructure versionnée", "Produit automatiquement à partir du Dockerfile", "Propre à chaque poste, jamais partagé"], a: 1, exp: "Histoire, revues, retours arrière." },
    { type: "qcm", q: "Les secrets dans ce YAML d'exemple (MYSQL_PASSWORD en clair)…", opts: ["Sont protégés car le YAML n'est pas publié", "Devraient venir d'un env_file/variables (fichier hors Git)", "Sont chiffrés", "Sont masqués par l'interpolation ${...}"], a: 1, exp: "La leçon 10 s'applique au YAML aussi." },
    { type: "qcm", q: "depends_on: bdd garantit…", opts: ["Que MySQL est PRÊT", "Seulement l'ordre de démarrage", "Que le healthcheck de bdd est passé", "Le redémarrage de bdd en cas de crash"], a: 1, exp: "Prêt ≠ démarré : leçon 13." },
    { type: "vf", q: "Sur une machine neuve, git clone + docker compose up -d suffit à tout reconstruire.", a: true, exp: "(plus le .env hors Git) — le but atteint." }
  ],
  final: {
    title: "Exercice final — Le fichier qui remplace tout",
    intro: `<p>On déclare la Ludothèque entière.</p>`,
    questions: [
      { type: "qcm", q: "app utilise :", opts: ["build: . + ports + env_file + depends_on", "image: mysql", "des variables -e passées en ligne de commande", "un bind mount"], a: 0, exp: "Notre image, construite." },
      { type: "qcm", q: "bdd utilise :", opts: ["image: mysql:8.4 + environment + volumes", "build: .", "ports: 3306:3306", "un bind mount du code local"], a: 0, exp: "Image officielle, privée, persistante." },
      { type: "qcm", q: "Le volume est déclaré :", opts: ["Dans la section volumes: racine + monté dans bdd", "Seulement sous volumes: du service bdd", "dans le Dockerfile", "créé à la main avec docker volume create"], a: 0, exp: "Déclaration + montage." },
      { type: "qcm", q: "Démarrage complet sur une machine neuve :", opts: ["git clone, créer .env.docker, docker compose up -d, exec migrate", "docker run pour chaque conteneur, un à un", "docker compose build puis docker start", "docker compose up sans créer le .env"], a: 0, exp: "Reproductible." },
      { type: "vf", q: "DB_HOST=bdd fonctionne sans créer de réseau à la main.", a: true, exp: "Compose fait le réseau + DNS." }
    ],
    solution: `<pre class="pseudo">services:
  app:                                 # service application (nom DNS 'app')
    build: .                           # image construite depuis notre Dockerfile
    ports: ["8000:8000"]               # port publié hôte:conteneur
    env_file: .env.docker              # config chargée depuis le fichier (leçon 10)
    depends_on: [bdd]                  # démarre après bdd (ordre)
  bdd:                                 # service base de données (nom DNS 'bdd')
    image: mysql:8.4                   # image officielle épinglée (pas de build)
    environment:                       # variables MySQL
      MYSQL_ROOT_PASSWORD: root-secret # mot de passe root
      MYSQL_DATABASE: ludotheque       # base créée au 1er démarrage
      MYSQL_USER: ludo_app             # utilisateur applicatif
      MYSQL_PASSWORD: secret           # son mot de passe
    volumes: [donnees-mysql:/var/lib/mysql]   # données persistées dans le volume
volumes:
  donnees-mysql:                       # déclaration du volume nommé du projet

$ docker compose up -d && docker compose exec app python manage.py migrate   # démarre tout, puis crée le schéma</pre>
<p>Une commande, toute l'application. Demain : démarrer dans le bon ordre, sain.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton compose.yaml…",
  items: [
  { id: "docker-l12", title: "Le compose complet, secrets rangés", level: 3,
    statement: "Réécris le compose.yaml de la Ludothèque en sortant TOUS les secrets du YAML : le service bdd lit ses variables via ${...} (interpolées depuis un fichier .env de Compose), app garde son env_file. Ajoute les commentaires du plan (publication, DNS, état) et la liste des commandes du cycle complet (up, migrate, logs, down).",
    hints: [
      "Compose interpole ${MYSQL_PASSWORD} depuis le fichier .env (à la racine, hors Git).",
      "environment: MYSQL_PASSWORD: ${MYSQL_PASSWORD}",
      "Le YAML commité ne contient plus AUCUNE valeur sensible."
    ],
    atoi: { cmd: "docker compose config\ndocker compose up -d\ndocker compose exec app python manage.py migrate\ndocker compose ps\ndocker compose down", expected: "config affiche le YAML avec ${MYSQL_PASSWORD} remplacé par la valeur du .env (et signale toute variable manquante) ; up -d crée réseau + volume et démarre app + bdd ; migrate applique les migrations ; ps liste les deux services « Up » ; down supprime les conteneurs mais CONSERVE le volume (pas de -v)." },
    checklist: ["Le compose.yaml commité ne contient-il AUCUN secret en clair ?", "Les valeurs sensibles sont-elles interpolées via ${...} depuis le .env de Compose ?", "app garde-t-il son env_file et bdd ses variables interpolées ?", "As-tu listé le cycle complet up / migrate / logs / down (sans -v) ?"],
    solution: "# .env (racine du projet, hors Git — lu par Compose pour l'interpolation)\n# MYSQL_ROOT_PASSWORD=root-secret\n# MYSQL_PASSWORD=secret\n\n# compose.yaml — commité, AUCUN secret en clair\nservices:\n  app:\n    build: .\n    ports:\n      - \"8000:8000\"          # seule publication : l'app\n    env_file: .env.docker     # config app (hors Git)\n    depends_on:\n      - bdd\n\n  bdd:                        # jamais publié : DNS interne 'bdd'\n    image: mysql:8.4\n    environment:\n      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}\n      MYSQL_DATABASE: ludotheque\n      MYSQL_USER: ludo_app\n      MYSQL_PASSWORD: ${MYSQL_PASSWORD}\n    volumes:\n      - donnees-mysql:/var/lib/mysql   # l'état, hors conteneur\n\nvolumes:\n  donnees-mysql:\n\n# Cycle complet :\n# docker compose up -d\n# docker compose exec app python manage.py migrate\n# docker compose logs -f app\n# docker compose down          # (sans -v : les données restent)",
    note: "L'interpolation ${...} sépare le PLAN (compose.yaml, public, versionné) des VALEURS (.env, local, secret) : on peut enfin committer l'infrastructure sans committer les mots de passe. Compose signale d'ailleurs les variables non définies au up — un garde-fou gratuit contre les .env incomplets." }
  ]
};
</script>
