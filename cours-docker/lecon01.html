<script>
var DAY = {
  num: 1,
  title: "Pourquoi les conteneurs ? Images, conteneurs, VM",
  subtitle: "« Ça marche chez moi » n'est pas une stratégie de déploiement.",
  theory: `
<h3>1. Le problème</h3>
<p>Commençons par le mot <strong>déployer</strong> : c'est prendre un programme qui fonctionne sur ta machine et le faire tourner ailleurs — sur un <strong>serveur</strong> (un ordinateur toujours allumé, quelque part, qui rend le service à tout le monde) ou sur le poste d'un collègue. La Ludothèque du Niveau 6 tourne chez toi grâce à un ensemble précis d'ingrédients : Python 3.14, tes <strong>paquets</strong> (les bibliothèques de code que tu as installées, par exemple avec <code>pip install</code>), ta base de données MySQL, et tes <strong>variables d'environnement</strong> (des réglages rangés en dehors du code, comme un mot de passe ou l'adresse de la base). Sur une autre machine, un seul de ces ingrédients qui diffère — une autre version de Python, une bibliothèque manquante, MySQL absent — et tout casse. Le vrai problème tient en une phrase : <strong>l'application dépend de la machine</strong> qui l'exécute. « Ça marche chez moi » n'est donc pas une garantie, juste un coup de chance local.</p>

<h3>2. L'idée du conteneur</h3>
<p>Un <strong>conteneur</strong>, c'est comme un conteneur de bateau : une boîte standardisée qui contient tout ce qu'il faut et qu'on peut poser sur n'importe quel camion, train ou navire sans se soucier de ce qu'il y a dedans. En informatique, le conteneur <strong>emballe l'application ET tout son environnement</strong> (le langage, les dépendances, les bibliothèques du système, la configuration de démarrage) dans une unité isolée qui s'exécute <em>identiquement partout</em>. « Isolé » veut dire séparé du reste de la machine : ce qui se passe dans la boîte reste dans la boîte. On ne livre donc plus seulement du code : on livre <strong>l'environnement complet</strong>, prêt à tourner. <strong>Docker</strong> est le logiciel le plus répandu pour fabriquer et faire tourner ces conteneurs — c'est l'outil qu'on apprend dans ce cours.</p>

<h3>3. Image vs conteneur</h3>
<p>Deux mots à ne jamais confondre. Une <strong>image</strong> est le patron figé, en <strong>lecture seule</strong> (on ne peut plus la modifier une fois fabriquée) : c'est la recette complète. Un <strong>conteneur</strong> est ce qui naît quand on lance cette image : un programme bien vivant qui s'exécute. L'analogie la plus parlante vient de la programmation orientée objet : l'image est la <strong>classe</strong>, le conteneur est l'<strong>objet</strong> (l'instance).</p>
<pre class="pseudo">IMAGE      = le moule figé, en LECTURE SEULE : une recette         # l'image = le patron immuable, comme un moule à gâteau qu'on ne change plus
             qui contient tout (OS minimal, Python 3.14,           # elle embarque le système de base, le langage, les dépendances...
             dépendances, code, commande de démarrage)             # ...jusqu'à la commande à lancer : rien ne manque
CONTENEUR  = une instance VIVANTE de l'image                       # le conteneur = le gâteau sorti du moule, bien réel et actif
             (un processus isolé qui tourne réellement)            # un « processus » = un programme en train de s'exécuter, cloisonné

1 image  ->  N conteneurs   (comme 1 classe -> N objets)           # d'un seul moule on tire autant de gâteaux identiques qu'on veut</pre>

<h3>4. Conteneur vs machine virtuelle</h3>
<p>Avant les conteneurs existaient déjà les <strong>machines virtuelles</strong> (VM) : un ordinateur entier simulé à l'intérieur d'un autre, avec son propre système d'exploitation complet (Windows, Linux...) qui « croit » avoir une vraie machine. C'est puissant mais lourd. Le conteneur, lui, ne recrée pas tout un ordinateur : il partage le <strong>noyau</strong> de l'hôte. Le <strong>noyau</strong> est le cœur du système d'exploitation, la partie qui parle directement au matériel ; l'<strong>hôte</strong> est la machine physique sur laquelle Docker tourne. Le conteneur n'isole donc que le <strong>processus</strong> (le programme qui tourne), pas tout un OS — d'où un gain énorme de légèreté et de vitesse.</p>
<pre class="pseudo">VM        : un OS invité COMPLET par machine simulée              # chaque VM embarque un système entier -> lourd (des Go), long à démarrer
            -> lourde (des gigaoctets), lente à démarrer          # comme reconstruire une maison entière pour chaque locataire
CONTENEUR : partage le NOYAU de l'hôte, isole seulement           # il réutilise le système déjà là et ne cloisonne que le programme
            le processus -> léger (des Mo), démarre en secondes   # comme louer une chambre meublée : rapide et peu coûteux</pre>
<p>La VM émule du matériel et embarque tout un OS ; le conteneur n'isole que le <strong>processus</strong> à l'aide de deux fonctions du noyau Linux : les <strong>espaces de noms</strong> (« namespaces », qui donnent à chaque conteneur sa propre vue du système — ses processus, son réseau — comme si chacun avait sa pièce fermée) et les <strong>cgroups</strong> (« control groups », qui limitent la part de mémoire et de processeur que chaque conteneur peut consommer). Résultat : la densité (combien on en fait tenir) et la vitesse changent d'ordre de grandeur.</p>

<h3>5. Ce que ça change pour la Ludothèque</h3>
<p>Une <strong>image</strong> unique, construite une fois, testée, versionnée — puis exécutée telle quelle en développement (« dev »), en test et en production (« prod », l'environnement réel qui sert les vrais utilisateurs). La base MySQL devient elle aussi un conteneur. Le déploiement, qui demandait tout un rituel manuel (installer Python, installer gunicorn le serveur d'application, tout configurer...), se réduira à une seule commande : <code>docker compose up</code> — que tu comprendras entièrement d'ici la fin du cours.</p>
<div class="warn">Un conteneur n'est <strong>pas</strong> une VM légère : il partage le noyau de l'hôte. Isolation forte ne veut pas dire isolation parfaite — la sécurité (leçon 16) reste un vrai sujet.</div>
<div class="tip">Le fil rouge de ce cours : conteneuriser, leçon après leçon, la Ludothèque que tu as construite au Niveau 6 — jusqu'au déploiement en production.</div>`,
  exercises: [
    { type: "qcm", q: "Le problème que résolvent les conteneurs :", opts: ["Le CSS", "L'application dépend de la machine qui l'exécute", "Le manque de RAM", "Les bugs Python"], a: 1, exp: "« Ça marche chez moi »." },
    { type: "qcm", q: "Un conteneur emballe…", opts: ["Seulement le code", "L'application ET son environnement complet", "Seulement la config", "Le matériel"], a: 1, exp: "Langage, dépendances, libs, démarrage." },
    { type: "qcm", q: "Une image est…", opts: ["Un processus vivant", "Le moule en lecture seule", "Une VM", "Un fichier de config"], a: 1, exp: "La recette figée." },
    { type: "qcm", q: "Un conteneur est…", opts: ["Une instance vivante d'une image", "Un fichier zip", "Un OS complet", "Un langage"], a: 0, exp: "Le processus isolé qui en naît." },
    { type: "qcm", q: "La relation image/conteneur ressemble à…", opts: ["Table/ligne ou classe/objet", "Fichier/dossier", "Client/serveur", "Rien"], a: 0, exp: "1 image → N conteneurs." },
    { type: "vf", q: "Une image peut lancer plusieurs conteneurs simultanément.", a: true, exp: "Comme une classe instancie N objets." },
    { type: "qcm", q: "Une VM embarque…", opts: ["Un OS invité complet", "Juste un processus", "Un navigateur", "Un conteneur"], a: 0, exp: "D'où sa lourdeur." },
    { type: "qcm", q: "Un conteneur partage avec l'hôte…", opts: ["Le noyau", "Rien", "Tout l'OS invité", "L'écran"], a: 0, exp: "Namespaces + cgroups Linux." },
    { type: "qcm", q: "Ordres de grandeur (démarrage) :", opts: ["VM secondes-minutes, conteneur quasi instantané", "L'inverse", "Identiques", "Aucun ne démarre"], a: 0, exp: "Pas d'OS à booter." },
    { type: "vf", q: "Un conteneur est simplement une VM plus légère.", a: false, exp: "Mécanisme différent : partage du noyau." },
    { type: "qcm", q: "Pour la Ludothèque, l'image sera construite…", opts: ["Sur chaque serveur différemment", "Une fois, puis exécutée partout à l'identique", "Jamais", "À la main en prod"], a: 1, exp: "Build once, run anywhere." },
    { type: "qcm", q: "La base MySQL de la Ludothèque…", opts: ["Restera installée à la main", "Deviendra elle aussi un conteneur", "Disparaît", "Devient un fichier"], a: 1, exp: "Leçon 11." },
    { type: "qcm", q: "L'isolation d'un conteneur repose sur…", opts: ["L'émulation matérielle", "Les espaces de noms et cgroups du noyau", "Un antivirus", "Le cloud"], a: 1, exp: "Fonctionnalités Linux." },
    { type: "vf", q: "L'isolation des conteneurs est parfaite : la sécurité n'est plus un sujet.", a: false, exp: "Noyau partagé → leçon 16." },
    { type: "qcm", q: "Ce cours suppose acquis…", opts: ["Le cours Linux (terminal) et un capstone du Niveau 6", "Rien", "Le CSS", "L'assembleur"], a: 0, exp: "On conteneurise la Ludothèque." }
  ],
  final: {
    title: "Exercice final — Les concepts en place",
    intro: `<p>On vérifie le vocabulaire avant de toucher au clavier.</p>`,
    questions: [
      { type: "qcm", q: "« Ça marche chez moi mais pas sur le serveur » vient de :", opts: ["La dépendance à la machine (versions, libs, config)", "Du hasard", "Du CSS", "De MySQL seul"], a: 0, exp: "Le problème fondateur." },
      { type: "qcm", q: "On livre désormais :", opts: ["L'environnement complet (image)", "un zip du code", "un PDF", "des instructions manuelles"], a: 0, exp: "Build once, run anywhere." },
      { type: "qcm", q: "Le moule figé s'appelle :", opts: ["Image", "Conteneur", "VM", "Volume"], a: 0, exp: "Lecture seule." },
      { type: "qcm", q: "L'instance vivante s'appelle :", opts: ["Conteneur", "Image", "Snapshot", "Noyau"], a: 0, exp: "Un processus isolé." },
      { type: "vf", q: "Le conteneur est plus léger que la VM car il partage le noyau de l'hôte.", a: true, exp: "Mo vs Go, secondes vs minutes." }
    ],
    solution: `<pre class="pseudo">Problème : l'app dépend de la machine (versions, libs, config).   # même code, machine différente = comportement différent
Solution : l'IMAGE emballe app + environnement, figés.            # on fige tout dans un moule immuable et reproductible
           le CONTENEUR exécute l'image, isolé, partout pareil.   # on lance ce moule : un processus cloisonné, identique partout
VM        = OS complet émulé (lourd)                              # une VM simule une machine entière -> des Go, démarrage lent
Conteneur = processus isolé sur le noyau partagé (léger)          # un conteneur réutilise le noyau de l'hôte -> des Mo, quelques secondes

Fil rouge : conteneuriser la Ludothèque du Niveau 6,             # objectif du cours : emballer TON projet du Niveau 6...
            jusqu'à docker compose up en production.              # ...jusqu'à le déployer d'une seule commande en prod</pre>
<p>Les idées sont posées. Demain : installer Docker et lancer ton premier conteneur.</p>`
  }
};
</script>

  { id: "docker-l1", title: "L'inventaire de la Ludothèque", level: 1,
    statement: "Fais l'inventaire écrit de tout ce dont TA Ludothèque du Niveau 6 a besoin pour tourner (runtime et version, dépendances, base, configuration, fichiers) et, pour chaque élément, indique en une ligne ce qui pourrait différer sur une autre machine — puis conclus par ce que l'image devra contenir et ce qui devra rester à l'extérieur (config, données).",
    hints: [
      "Pars de requirements.txt (ou pom.xml / .csproj) et de settings.py.",
      "Sépare trois colonnes : dans l'image / en variable d'environnement / dans un volume.",
      "Les secrets et les données ne rentrent JAMAIS dans l'image."
    ],
    solution: "Besoin                        | Risque sur une autre machine\n------------------------------+------------------------------------------\nPython 3.14                   | 3.8 installé -> dépendances refusées\nrequirements.txt (versions)   | pip global différent, versions flottantes\nmysqlclient + libs système    | lib absente -> compilation échoue\nMySQL 8 + base ludotheque     | pas installé / autre version / pas migré\nDB_PASSWORD, SECRET_KEY...    | variables non posées -> crash au boot\nstatiques collectés           | oubli de collectstatic\n\nRépartition :\n- DANS L'IMAGE  : Python 3.14, dépendances figées, code, gunicorn\n- ENVIRONNEMENT : SECRET_KEY, DB_*, DEBUG (change par machine)\n- VOLUME        : les données MySQL (doivent survivre aux conteneurs)",
    note: "Cette répartition en trois colonnes EST le plan du cours : l'image (leçons 5-6, 15-16), l'environnement (leçon 10), les volumes (leçon 8). Une image contient du code figé et reproductible ; tout ce qui varie (config) ou vit (données) reste dehors — c'est la règle qui rend la même image utilisable en dev comme en prod." }
  ]
};
