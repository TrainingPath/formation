<script>
var DAY = {
  num: 2,
  title: "Installation et premiers pas : docker run",
  subtitle: "Vérifier l'outil, lancer un conteneur, comprendre ce qui vient de se passer.",
  theory: `
<h3>1. Installer Docker</h3>
<p>Installer Docker, c'est mettre en place deux choses qui travaillent ensemble (voir plus bas). Sur Windows et macOS, on installe <strong>Docker Desktop</strong>, une application tout-en-un. Sous Linux, on installe un paquet système. Un mot de vocabulaire du terminal : <code>sudo</code> exécute une commande en <strong>administrateur</strong> (avec tous les droits), et <code>apt install</code> est le gestionnaire de paquets d'Ubuntu (il télécharge et installe un logiciel).</p>
<pre class="pseudo"># Windows / macOS : installer Docker Desktop                 # application tout-en-un : le moteur Docker + une interface graphique
# Linux (Ubuntu), en ligne de commande :                     # sous Linux, Docker s'installe comme un paquet système classique
sudo apt install docker.io      # installe le moteur          # 'sudo' = en administrateur ; 'apt install' = installer le paquet docker.io (ou docker-ce, l'officiel)
sudo usermod -aG docker $USER   # m'ajoute au groupe docker   # -a = ajouter, -G docker = au groupe 'docker' ; permet d'utiliser docker SANS sudo (se reconnecter ensuite)
docker --version                # vérifier l'installation     # affiche la version : si un numéro s'affiche, Docker est bien là</pre>
<p>Docker n'est pas un seul programme mais un duo : un <strong>démon</strong> (<code>dockerd</code>, un programme qui tourne en permanence en arrière-plan et fait tout le travail réel — construire, lancer, arrêter les conteneurs) et un <strong>client</strong> (la commande <code>docker</code> que tu tapes, qui ne fait que transmettre tes ordres au démon). Tu parles au client, le client parle au démon.</p>

<h3>2. Le rituel de vérification</h3>
<p>Le tout premier test, universel : lancer l'image de démonstration <code>hello-world</code>. La commande <code>docker run</code> est celle qu'on utilisera le plus : elle crée et démarre un conteneur à partir d'une image. Un <strong>registre</strong> est un entrepôt d'images en ligne ; le registre public par défaut s'appelle <strong>Docker Hub</strong>. Quand Docker télécharge une image depuis un registre, on dit qu'il fait un <strong>pull</strong> (« tirer »).</p>
<pre class="pseudo">$ docker run hello-world                          # crée puis lance un conteneur à partir de l'image 'hello-world'
Unable to find image 'hello-world:latest' locally # l'image n'est pas sur ta machine : Docker va donc la télécharger
latest: Pulling from library/hello-world          # 'Pulling' = pull = téléchargement depuis Docker Hub (le registre public)
Hello from Docker!                                # message imprimé PAR le conteneur : preuve qu'il a démarré et tourné</pre>
<p><code>docker run</code> enchaîne trois étapes automatiquement : l'image est-elle déjà locale ? sinon <strong>pull</strong> depuis le registre → <strong>création</strong> du conteneur → <strong>exécution</strong>.</p>

<h3>3. Un vrai conteneur utile</h3>
<p>Voici toute la promesse des conteneurs : obtenir un Python 3.14 exact, prêt à l'emploi, sans rien installer sur ta machine. Deux options importantes apparaissent. <code>--rm</code> (« remove ») supprime le conteneur dès qu'il s'arrête. <code>-it</code> est en réalité deux options collées : <code>-i</code> (interactif : Docker garde l'entrée clavier ouverte) et <code>-t</code> (un <strong>pseudo-terminal</strong>, c'est-à-dire un vrai prompt dans lequel taper).</p>
<pre class="pseudo">$ docker run --rm -it python:3.14-slim python  # lance un conteneur Python 3.14 et ouvre directement son interpréteur
&gt;&gt;&gt; print("Ludothèque")        # on tape du Python DANS le conteneur : un vrai 3.14, rien d'installé sur l'hôte
&gt;&gt;&gt; exit()                     # quitte l'interpréteur : le processus principal se termine -> le conteneur s'arrête
# --rm : supprime automatiquement le conteneur à sa sortie (aucun « cadavre » qui traîne)
# -it  : -i (interactif) + -t (pseudo-terminal) -> on peut réellement taper au clavier dans le conteneur</pre>

<h3>4. Servir une page en une commande</h3>
<p>Lançons maintenant un vrai serveur web, nginx, qui reste allumé en tâche de fond. Deux nouvelles options : <code>-d</code> (« détaché », le conteneur tourne en arrière-plan et rend la main au terminal) et <code>-p</code> (« publish », qui relie un <strong>port</strong> de ta machine à un port du conteneur). Un <strong>port</strong> est un numéro de porte réseau : un serveur « écoute » sur un port et les clients s'y connectent.</p>
<pre class="pseudo">$ docker run -d -p 8080:80 --name mon-nginx nginx:alpine  # lance nginx en arrière-plan, port publié, avec un nom lisible
# -d          : détaché -> le conteneur tourne en arrière-plan, le terminal redevient libre
# -p 8080:80  : publie un port -> port 8080 de MA machine (l'hôte) relié au port 80 DU conteneur (toujours hôte:conteneur)
# --name mon-nginx : nomme le conteneur (sinon Docker invente un nom aléatoire comme a3f9c2...)
$ curl http://localhost:8080     # 'curl' interroge une URL depuis le terminal : nginx répond bien !
$ docker stop mon-nginx && docker rm mon-nginx   # 'stop' arrête le conteneur, 'rm' le supprime ('&&' enchaîne si le 1er a réussi)</pre>

<h3>5. L'anatomie de docker run</h3>
<p>Toutes ces commandes suivent le même squelette, à mémoriser une fois pour toutes :</p>
<pre class="pseudo">docker run [options] IMAGE [commande]                           # le verbe 'run', puis des options, puis l'image, puis une commande facultative
           --rm -it -d -p -e --name ...   nginx:alpine   [sh]   # à gauche : exemples d'options — au milieu : l'image — à droite : la commande à exécuter dedans (ici 'sh')</pre>
<div class="warn">Sous Linux, sans le groupe <code>docker</code>, chaque commande exige <code>sudo</code>. Ajouter son utilisateur au groupe revient à lui donner des droits équivalents à root sur la machine — à savoir, et réservé aux postes de dev.</div>
<div class="tip">Deux options à retenir dès aujourd'hui : <code>--rm</code> pour les essais jetables, <code>--name</code> pour tout ce qui doit vivre. Ton historique shell te remerciera.</div>`,
  exercises: [
    { type: "qcm", q: "Docker se compose de…", opts: ["Un démon (dockerd) + un client (docker)", "Un seul binaire magique", "Un site web", "Une VM"], a: 0, exp: "Le client parle au démon." },
    { type: "qcm", q: "Vérifier l'installation :", opts: ["docker run hello-world", "docker test", "docker check", "docker doctor"], a: 0, exp: "Le rituel." },
    { type: "qcm", q: "Si l'image n'est pas locale, docker run…", opts: ["Échoue", "La télécharge (pull) depuis le registre", "La crée vide", "Redémarre"], a: 1, exp: "Pull automatique." },
    { type: "qcm", q: "--rm sert à…", opts: ["Supprimer l'image", "Supprimer le conteneur à sa sortie", "Redémarrer", "Renommer"], a: 1, exp: "Pas de conteneurs morts qui traînent." },
    { type: "qcm", q: "-it sert à…", opts: ["Un conteneur interactif avec terminal", "L'arrière-plan", "Le réseau", "Les volumes"], a: 0, exp: "-i + -t." },
    { type: "qcm", q: "-d sert à…", opts: ["Déboguer", "Détacher : le conteneur tourne en arrière-plan", "Supprimer", "Documenter"], a: 1, exp: "La main revient au shell." },
    { type: "qcm", q: "-p 8080:80 signifie…", opts: ["Port 8080 de l'hôte → port 80 du conteneur", "L'inverse", "Deux ports du conteneur", "Un mot de passe"], a: 0, exp: "hôte:conteneur." },
    { type: "qcm", q: "Après -p 8080:80 avec nginx, on visite…", opts: ["localhost:80", "localhost:8080", "localhost:443", "rien"], a: 1, exp: "Le port publié de l'hôte." },
    { type: "qcm", q: "docker run --rm -it python:3.14-slim python donne…", opts: ["Un shell Python 3.14 jetable, sans installation locale", "Une erreur", "Un fichier", "Un serveur web"], a: 0, exp: "La promesse des conteneurs." },
    { type: "qcm", q: "--name mon-nginx sert à…", opts: ["Renommer l'image", "Donner un nom lisible au conteneur", "Créer un réseau", "Rien"], a: 1, exp: "Plus simple que a3f9c2…" },
    { type: "vf", q: "Sous Linux, ajouter son utilisateur au groupe docker équivaut à peu près à lui donner root.", a: true, exp: "Le démon est privilégié — poste de dev seulement." },
    { type: "qcm", q: "La forme générale :", opts: ["docker run [options] IMAGE [commande]", "docker IMAGE run", "run docker IMAGE", "docker exec IMAGE"], a: 0, exp: "L'anatomie à mémoriser." },
    { type: "qcm", q: "La commande finale (ex. python) est exécutée…", opts: ["Sur l'hôte", "Dans le conteneur", "Sur Docker Hub", "Nulle part"], a: 1, exp: "Elle remplace la commande par défaut." },
    { type: "vf", q: "hello-world reste utile après l'installation.", a: false, exp: "C'est un test ; les vrais conteneurs prennent la suite." },
    { type: "qcm", q: "Arrêter puis supprimer mon-nginx :", opts: ["docker stop mon-nginx && docker rm mon-nginx", "docker delete", "docker kill -9 tout", "rm -rf /"], a: 0, exp: "Cycle de vie — détaillé demain." }
  ],
  final: {
    title: "Exercice final — Premiers conteneurs",
    intro: `<p>On enchaîne les premiers gestes.</p>`,
    questions: [
      { type: "qcm", q: "Un Python jetable et interactif :", opts: ["docker run --rm -it python:3.14-slim python", "docker pull python", "pip install python", "docker python"], a: 0, exp: "Sans rien installer." },
      { type: "qcm", q: "nginx en arrière-plan sur le port 8080 de l'hôte :", opts: ["docker run -d -p 8080:80 --name mon-nginx nginx:alpine", "docker run nginx -p 80", "docker start nginx", "curl nginx"], a: 0, exp: "-d + -p + --name." },
      { type: "qcm", q: "Vérifier que nginx répond :", opts: ["curl http://localhost:8080", "curl localhost:80", "docker curl", "ping nginx"], a: 0, exp: "Le port publié." },
      { type: "qcm", q: "docker run telécharge l'image si besoin depuis :", opts: ["Docker Hub (le registre)", "Git", "le BIOS", "pip"], a: 0, exp: "Pull automatique." },
      { type: "vf", q: "--rm évite d'accumuler des conteneurs terminés.", a: true, exp: "Pour tous les essais." }
    ],
    solution: `<pre class="pseudo">$ docker --version                             # vérifie que le client Docker est installé (affiche un numéro de version)
$ docker run hello-world                       # teste le moteur : pull + création + exécution de l'image de démo -> installation OK

$ docker run --rm -it python:3.14-slim python  # ouvre un interpréteur Python 3.14 jetable (--rm) et interactif (-it)
&gt;&gt;&gt; print("Ludothèque")                        # on exécute du Python dans le conteneur : version exacte, rien installé sur l'hôte

$ docker run -d -p 8080:80 --name mon-nginx nginx:alpine  # nginx en arrière-plan (-d), port 8080->80 publié (-p), nommé (--name)
$ curl http://localhost:8080                   # interroge le port publié de l'hôte : nginx répond
$ docker stop mon-nginx && docker rm mon-nginx # arrête puis supprime le conteneur (on fait le ménage après l'essai)</pre>
<p>Docker tourne et obéit. Demain : maîtriser le cycle de vie complet d'un conteneur.</p>`
  }
};
</script>

    statement: "Écris la séquence complète de commandes (commentées) : vérifier la version, tester avec hello-world, ouvrir un shell bash jetable dans python:3.14-slim et y afficher la version de pip, puis lancer un nginx:alpine détaché nommé essai-nginx publié sur le port 8081, le vérifier avec curl, l'arrêter et le supprimer.",
    hints: [

    ],
    solution: "# 1. L'outil est là ?\ndocker --version\n\n# 2. Le moteur fonctionne ?\ndocker run hello-world\n\n# 3. Un shell jetable dans une image Python\ndocker run --rm -it python:3.14-slim bash\n#   root@...:/# pip --version\n#   pip 24.x from ... (python 3.14)\n#   root@...:/# exit          # --rm : le conteneur disparaît\n\n# 4. Un serveur web détaché\ndocker run -d -p 8081:80 --name essai-nginx nginx:alpine\ncurl -I http://localhost:8081        # HTTP/1.1 200 OK\n\n# 5. Nettoyage\ndocker stop essai-nginx\ndocker rm essai-nginx",
    note: "Trois modes d'utilisation en une séance : le test (hello-world), l'exploration interactive jetable (--rm -it ... bash) et le service détaché (-d -p --name). Presque tout ce que tu feras avec Docker est une variation de ces trois gestes." }
  ]
};
