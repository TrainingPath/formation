<script>
var DAY = {
  num: 4,
  title: "Les images : Docker Hub, tags et couches",
  subtitle: "D'où viennent les images, comment elles se nomment, de quoi elles sont faites.",
  theory: `
<h3>1. Docker Hub, le registre public</h3>
<p>Un <strong>registre</strong> est un entrepôt d'images en ligne, exactement comme un magasin d'applications. Le plus connu, public et gratuit, est <strong>Docker Hub</strong>. On y cherche des images, on les télécharge (<strong>pull</strong>), et on les gère localement.</p>
<pre class="pseudo">docker search mysql          # cherche des images nommées 'mysql' sur Docker Hub (comme une recherche dans un magasin)
docker pull mysql:8.4        # télécharge l'image mysql version 8.4 SANS lancer de conteneur (juste la récupérer)
docker images                # liste les images déjà présentes sur ta machine (téléchargées ou construites)
docker rmi mysql:8.4         # rmi = remove image : supprime une image locale (à ne pas confondre avec 'rm' qui vise les conteneurs)</pre>
<p>Les images <strong>officielles</strong> (python, mysql, nginx…) sont maintenues et vérifiées par des équipes de confiance ; les autres viennent d'utilisateurs quelconques (nommées <code>utilisateur/image</code>) — à évaluer avant usage, car exécuter une image, c'est exécuter le code de celui qui l'a fabriquée.</p>

<h3>2. L'anatomie d'un nom d'image</h3>
<p>Un nom d'image se lit par morceaux. Le <strong>tag</strong> est l'étiquette après les deux-points : elle précise la version ou la variante. Le préfixe (avant le premier <code>/</code>) indique éventuellement le registre ou le compte utilisateur.</p>
<pre class="pseudo">[registre/][utilisateur/]nom[:tag]                          # forme générale : registre (optionnel) / utilisateur (optionnel) / nom : étiquette
python:3.14-slim         -> officielle, version 3.14, variante slim   # pas de préfixe = image officielle, hébergée par Docker Hub
tonuser/ludotheque:1.0.0 -> ton image publiée sous ton compte         # 'tonuser/' = le compte utilisateur propriétaire de l'image
ghcr.io/org/app:2.1      -> hébergée sur le registre de GitHub         # 'ghcr.io/' = un AUTRE registre que Docker Hub (celui de GitHub)</pre>
<p>Sans tag précisé, Docker prend <code>latest</code> par défaut — qui n'est qu'une <strong>étiquette mouvante</strong> (elle peut pointer vers une image différente demain), et surtout PAS « la meilleure version ».</p>

<h3>3. Variantes courantes</h3>
<p>Une même version de Python existe en plusieurs <strong>variantes</strong> selon le système Linux de base. « slim » veut dire allégé ; « alpine » désigne une distribution Linux ultra-minuscule. Attention : Alpine utilise une bibliothèque système différente, <strong>musl</strong> (au lieu de la <strong>libc/glibc</strong> habituelle) — la libc est la bibliothèque de base dont dépendent presque tous les programmes, et ce changement casse parfois les paquets qui contiennent du code à compiler.</p>
<pre class="pseudo">python:3.14          complète (outils de build inclus, ~1 Go)   # image la plus grosse : tout est là, y compris de quoi compiler
python:3.14-slim     Debian minimal (~120 Mo)  <- notre choix    # Debian réduite : bon compromis taille/compatibilité
python:3.14-alpine   Alpine, minuscule (~50 Mo), mais libc       # ultra-légère, mais...
                     différente (musl) : certains paquets        # ...sa libc 'musl' fait échouer certains paquets compilés
                     compilés posent problème (ex. mysqlclient)  # (ex. mysqlclient) : gain de place, mais risque de casse</pre>

<h3>4. Les couches (layers)</h3>
<p>Une image n'est pas un gros bloc unique : c'est un empilement de <strong>couches</strong> (« layers »), chacune en lecture seule, comme les strates d'un mille-feuille. L'astuce géniale : les couches identiques sont <strong>partagées</strong> entre images et stockées une seule fois sur le disque.</p>
<pre class="pseudo">docker history python:3.14-slim    # affiche la pile de couches qui composent l'image (son « historique »)
Une image = des couches EMPILÉES, en lecture seule, PARTAGÉES :   # chaque couche est figée ; les couches communes sont mutualisées
  python:3.14-slim et mysql:8.4 basées sur la même Debian         # si deux images partent de la même Debian...
  -> la couche Debian n'est stockée qu'UNE seule fois              # ...cette couche commune n'occupe l'espace disque qu'une fois
Le conteneur ajoute une fine couche d'ÉCRITURE par-dessus         # au lancement, le conteneur pose une couche modifiable au sommet (l'image reste intacte)</pre>
<p>C'est pour ça qu'un <code>pull</code> affiche plusieurs barres de progression : une par couche — et que « Already exists » apparaît pour les couches déjà présentes localement (inutile de les retélécharger).</p>

<h3>5. Épingler les versions</h3>
<p><strong>Épingler</strong> une version, c'est fixer le tag exact (par exemple <code>mysql:8.4</code>) au lieu de laisser <code>latest</code>, afin que le résultat soit toujours identique.</p>
<div class="warn"><code>latest</code> aujourd'hui n'est pas forcément <code>latest</code> demain : un déploiement basé sur latest peut changer de comportement sans que personne n'ait rien modifié. On <strong>épingle</strong> : <code>mysql:8.4</code>, <code>python:3.14-slim</code> — c'est le requirements.txt de l'infrastructure.</div>
<div class="tip">La Ludothèque utilisera <code>python:3.14-slim</code> (bon compromis taille/compatibilité) et <code>mysql:8.4</code> (version LTS épinglée). Alpine viendra en leçon 15, quand on chassera les mégaoctets.</div>`,
  exercises: [
    { type: "qcm", q: "Docker Hub est…", opts: ["Un éditeur de code", "Le registre public d'images", "Une VM", "Un langage"], a: 1, exp: "D'où viennent python, mysql…" },
    { type: "qcm", q: "Télécharger une image sans l'exécuter :", opts: ["docker pull", "docker run", "docker get", "docker fetch"], a: 0, exp: "run = pull + create + start." },
    { type: "qcm", q: "Lister les images locales :", opts: ["docker images", "docker ps", "docker list", "docker ls -i"], a: 0, exp: "Ou docker image ls." },
    { type: "qcm", q: "Supprimer une image locale :", opts: ["docker rmi", "docker rm", "docker stop", "docker prune -c"], a: 0, exp: "rm = conteneurs, rmi = images." },
    { type: "qcm", q: "Dans python:3.14-slim, « 3.14-slim » est…", opts: ["Le tag", "Le registre", "L'utilisateur", "Le port"], a: 0, exp: "nom:tag." },
    { type: "qcm", q: "Sans tag précisé, Docker prend…", opts: ["latest", "stable", "1.0", "rien"], a: 0, exp: "Étiquette par défaut, mouvante." },
    { type: "qcm", q: "latest signifie…", opts: ["La version la plus sûre", "Une étiquette mouvante (celle du moment)", "La version LTS", "La plus légère"], a: 1, exp: "Pas une garantie de qualité." },
    { type: "vf", q: "Déployer sur latest peut changer de comportement sans modification de notre part.", a: true, exp: "C'est exactement le risque — d'où l'épinglage des tags." },
    { type: "qcm", q: "La variante slim est…", opts: ["Une Debian minimale, bon compromis", "Une version bêta", "Sans Python", "Plus lourde"], a: 0, exp: "~120 Mo vs ~1 Go." },
    { type: "qcm", q: "Le piège d'alpine :", opts: ["Trop lourde", "libc musl : certains paquets compilés posent problème", "Pas de shell", "Payante"], a: 1, exp: "Minuscule mais différente." },
    { type: "qcm", q: "Une image est faite de…", opts: ["Couches empilées en lecture seule", "Un seul gros fichier", "De la RAM", "Un zip"], a: 0, exp: "docker history les montre." },
    { type: "qcm", q: "Deux images basées sur la même Debian…", opts: ["La stockent deux fois", "Partagent la couche : stockée une fois", "Sont interdites", "Fusionnent"], a: 1, exp: "Économie du système de couches." },
    { type: "qcm", q: "Le conteneur écrit…", opts: ["Dans les couches de l'image", "Dans une fine couche d'écriture ajoutée par-dessus", "Sur Docker Hub", "Nulle part"], a: 1, exp: "L'image reste intacte." },
    { type: "qcm", q: "« Already exists » pendant un pull signifie…", opts: ["Une erreur", "La couche est déjà présente localement", "L'image est corrompue", "Le registre est plein"], a: 1, exp: "Partage de couches à l'œuvre." },
    { type: "qcm", q: "utilisateur/image (ex. tonuser/ludotheque) désigne…", opts: ["Une image officielle", "Une image publiée par un utilisateur", "Un dossier local", "Un réseau"], a: 1, exp: "À évaluer avant usage." }
  ],
  final: {
    title: "Exercice final — Choisir les images du projet",
    intro: `<p>On prépare les fondations de la Ludothèque conteneurisée.</p>`,
    questions: [
      { type: "qcm", q: "L'image Python retenue :", opts: ["python:3.14-slim (épinglée, légère, compatible)", "python:latest", "python:alpine sans réfléchir", "ubuntu + apt install python"], a: 0, exp: "Compromis raisonné." },
      { type: "qcm", q: "L'image MySQL retenue :", opts: ["mysql:8.4 (version épinglée)", "mysql:latest", "mariadb par accident", "mysql:5.5"], a: 0, exp: "LTS épinglée." },
      { type: "qcm", q: "Les récupérer sans les lancer :", opts: ["docker pull python:3.14-slim && docker pull mysql:8.4", "docker run les deux", "docker search", "git clone"], a: 0, exp: "Téléchargement seul." },
      { type: "qcm", q: "Voir de quoi python:3.14-slim est faite :", opts: ["docker history python:3.14-slim", "docker logs", "docker ps", "cat Dockerfile"], a: 0, exp: "La pile de couches." },
      { type: "vf", q: "Épingler les tags rend le déploiement reproductible dans six mois.", a: true, exp: "Le requirements.txt de l'infra." }
    ],
    solution: `<pre class="pseudo">$ docker pull python:3.14-slim     # télécharge l'image de base Python (tag épinglé : résultat reproductible)
$ docker pull mysql:8.4            # télécharge l'image MySQL en version 8.4 (LTS épinglée)
$ docker images                    # vérifie qu'elles sont bien présentes localement
python   3.14-slim   ~120MB        # ligne d'image : NOM  TAG  TAILLE -> la variante slim est légère
mysql    8.4         ~600MB        # MySQL est plus volumineuse (moteur de base de données complet)
$ docker history python:3.14-slim  # affiche la pile de couches qui composent l'image</pre>
<p>Les fondations sont choisies. Demain : écrire la recette de NOTRE image — le Dockerfile.</p>`
  }
};
</script>
