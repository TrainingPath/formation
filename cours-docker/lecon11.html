  theory: `
<h3>1. L'image officielle mysql</h3>
<p>L'image officielle <code>mysql</code> est configurée entièrement par des variables d'environnement <code>MYSQL_*</code>. Au tout premier démarrage, elle fait automatiquement pour toi ce que tu faisais à la main en cours de bases de données : créer la base, créer un utilisateur, lui donner des droits.</p>
<pre class="pseudo">docker run -d --name bdd --network reseau-ludo \\        # lance MySQL en arrière-plan, sur le réseau privé
    -e MYSQL_ROOT_PASSWORD=root-secret \\               # mot de passe du super-administrateur 'root' (obligatoire)
    -e MYSQL_DATABASE=ludotheque \\                     # crée une base nommée 'ludotheque' au 1er démarrage
    -e MYSQL_USER=ludo_app \\                           # crée un utilisateur applicatif 'ludo_app' (pas root !)
    -e MYSQL_PASSWORD=secret \\                         # mot de passe de cet utilisateur applicatif
    -v donnees-mysql:/var/lib/mysql \\                  # persiste les données dans le volume (leçon 8)
    mysql:8.4                                          # l'image officielle, tag épinglé</pre>
<p>Au <strong>premier</strong> démarrage (volume vide), l'image crée la base, l'utilisateur et ses droits — le <code>CREATE DATABASE / CREATE USER / GRANT</code> du cours MySQL, automatisé. L'application se connectera en <code>ludo_app</code> (droits limités à sa base), <strong>jamais en root</strong> : c'est le principe du <strong>moindre privilège</strong> (ne donner que les droits strictement nécessaires).</p>

<h3>2. Les scripts d'initialisation</h3>
<p>L'image mysql exécute automatiquement tout script placé dans un dossier spécial, au premier démarrage. On y branche un bind mount depuis un dossier <code>./init</code> de l'hôte.</p>
<pre class="pseudo">-v ./init:/docker-entrypoint-initdb.d          # monte le dossier local ./init dans le dossier « magique » d'initialisation de mysql
# tout fichier .sql ou .sh de ce dossier s'exécute au PREMIER démarrage    # l'image lance ces scripts automatiquement, une seule fois
# (dans l'ordre alphabétique) : jeu de données de démo, réglages...        # d'où le préfixe numérique (01-, 02-) pour contrôler l'ordre</pre>

<h3>3. Attention : « premier démarrage » seulement</h3>
<p>Point de vigilance essentiel pour débutant : cette initialisation ne se produit QUE si le dossier de données est vide.</p>
<div class="warn">Les variables <code>MYSQL_*</code> et les scripts d'init ne jouent que si <code>/var/lib/mysql</code> est <strong>vide</strong>. Changer <code>MYSQL_PASSWORD</code> sur un volume existant ne change <strong>rien</strong> : la base existante garde ses comptes. (Pour changer un mot de passe ensuite : <code>ALTER USER</code> dans MySQL.)</div>

<h3>4. Les migrations de l'application</h3>
<p>La <strong>structure</strong> des tables (le schéma) ne vient pas de l'image mysql, mais des <strong>migrations</strong> de ton application Django (les fichiers qui décrivent l'évolution du schéma, hérités du Niveau 6). On les applique à travers le réseau.</p>
<pre class="pseudo">docker exec ludo python manage.py migrate      # depuis le conteneur de l'app, applique les migrations à la base (via le réseau)
Applying catalogue.0001_initial... OK          # crée les tables du schéma issu de la conception Merise
Applying catalogue.0002_creer_roles... OK      # migration de données : insère les 3 rôles applicatifs

docker exec -it bdd mysql -uludo_app -psecret ludotheque -e "SHOW TABLES;"   # se connecte en ludo_app et liste les tables créées</pre>
<p>Le conteneur ne change pas l'application : les migrations du capstone tournent telles quelles, à travers le réseau.</p>

<h3>5. Accès de maintenance</h3>
<p>Pour l'administration ponctuelle (regarder, sauvegarder), on utilise le compte <code>root</code> via <code>exec</code> — sans jamais publier le port.</p>
<pre class="pseudo">docker exec -it bdd mysql -uroot -proot-secret       # ouvre une console SQL interactive en tant que root (maintenance)
docker exec bdd mysqldump -uroot -proot-secret \\    # 'mysqldump' exporte la base sous forme de fichier SQL...
    --databases ludotheque &gt; sauvegarde.sql          # ...redirigé (&gt;) vers un fichier sur l'hôte : c'est une sauvegarde (leçon 8)</pre>
<div class="tip">Deux comptes, deux usages : <code>ludo_app</code> pour l'application (droits limités à sa base), <code>root</code> pour la maintenance ponctuelle via <code>exec</code>. Exactement la discipline du cours MySQL, en version conteneur.</div>`,

    { type: "qcm", q: "La console root sert à…", opts: ["L'application", "La maintenance ponctuelle (exec)", "Rien", "Publier le port"], a: 1, exp: "Deux comptes, deux usages." },
    { type: "qcm", q: "Ce conteneur MySQL est…", opts: ["Publié sur 3306", "Non publié : joignable seulement via le réseau interne", "Sur Internet", "Sans réseau"], a: 1, exp: "Leçon 9 appliquée." },

    { type: "qcm", q: "Un jeu de données de démo pour le dev se charge par…", opts: ["Un .sql dans ./init monté sur /docker-entrypoint-initdb.d", "Un COPY dans l'image app", "Un -e", "docker push"], a: 0, exp: "Initialisation du premier démarrage." },
    { type: "qcm", q: "mysqldump via docker exec produit…", opts: ["Une image", "Une sauvegarde logique sur l'hôte", "Un volume", "Un réseau"], a: 1, exp: "Leçon 8 : la procédure de sauvegarde." }
  ],
  final: {
    title: "Exercice final — La base officielle du projet",
    intro: `<p>On assemble le conteneur MySQL définitif et on migre.</p>`,
    questions: [
      { type: "qcm", q: "Le run complet contient :", opts: ["network + 4 variables MYSQL_* + volume, sans -p", "juste l'image", "-p 3306:3306", "un bind mount du code"], a: 0, exp: "Privé, initialisé, persistant." },

      { type: "qcm", q: "Le schéma arrive par :", opts: ["docker exec ludo python manage.py migrate", "un CREATE TABLE à la main", "l'image mysql", "le Dockerfile"], a: 0, exp: "Les migrations du Niveau 6." },
      { type: "qcm", q: "Si on relance avec un volume déjà rempli :", opts: ["Les MYSQL_* sont ignorées, la base existante est conservée", "tout est recréé", "erreur", "les données sont effacées"], a: 0, exp: "Premier démarrage seulement." },
      { type: "vf", q: "L'app utilise ludo_app, root reste pour la maintenance.", a: true, exp: "Moindre privilège." }
    ],
    solution: `<pre class="pseudo">$ docker run -d --name bdd --network reseau-ludo \\        # MySQL en arrière-plan, sur le réseau privé
    -e MYSQL_ROOT_PASSWORD=root-secret \\                 # mot de passe root (super-admin)

$ docker exec ludo python manage.py migrate     # applique les migrations Django : crée le schéma + les rôles
$ docker exec -it bdd mysql -uludo_app -psecret ludotheque -e "SHOW TABLES;"   # se connecte en ludo_app et liste les tables
catalogue_jeu, catalogue_location, auth_user...  # ✔ les tables du projet sont bien là</pre>
