  title: "Registres : tag, push, versions d'images",
  subtitle: "L'image quitte ta machine : publier des versions immuables.",
  theory: `
<h3>1. Pourquoi un registre ?</h3>
<p>Jusqu'ici, l'image que tu construis n'existe que sur ta machine. Pour la déployer sur un serveur ou la partager avec l'équipe, il faut la publier dans un <strong>registre</strong> (l'entrepôt d'images, leçon 4). Le parallèle est parfait avec Git : le registre est aux images ce que le dépôt distant (GitHub...) est au code — on y <strong>push</strong> (envoie) et on en <strong>pull</strong> (récupère).</p>

<h3>2. Taguer pour le registre</h3>
<p>Pour publier, l'image doit porter un nom complet indiquant sa destination : <code>compte/nom:version</code>. On ajoute ce nom avec <code>docker tag</code> — qui ne copie rien, il pose juste une étiquette de plus sur la même image.</p>
<pre class="pseudo">docker tag ludotheque:0.2  tonuser/ludotheque:1.0.0     # ajoute le nom complet 'tonuser/ludotheque:1.0.0' à l'image locale ludotheque:0.2
docker tag ludotheque:0.2  tonuser/ludotheque:latest    # ajoute AUSSI l'étiquette 'latest' à la même image
# un tag = une étiquette de plus sur la MÊME image (même ID interne)   # aucune copie : plusieurs noms pointent vers la même image</pre>
<p>Le nom complet <code>utilisateur/nom:version</code> dit <em>où</em> pousser. La version reprend le <strong>tag Git</strong> du code (v1.0.0 → 1.0.0) : code et image racontent ainsi la même histoire.</p>

<h3>3. Pousser</h3>
<p>On s'authentifie une fois avec <code>docker login</code>, puis on envoie. Grâce au système de couches, seules les nouveautés transitent.</p>
<pre class="pseudo">docker login                          # s'authentifie auprès du registre (une seule fois, identifiants mémorisés)
docker push tonuser/ludotheque:1.0.0  # envoie l'image vers le registre sous ce nom de version
docker push tonuser/ludotheque:latest # envoie aussi l'étiquette latest
# seules les couches NOUVELLES sont envoyées (encore le système de couches !)   # les couches déjà présentes ne sont pas retransmises : gain de temps</pre>

<h3>4. Tirer et exécuter ailleurs</h3>
<p>Sur le serveur, on ne construit rien : on <strong>tire</strong> l'image déjà prête et on la lance. Le compose de production remplace <code>build:</code> par <code>image:</code>.</p>
<pre class="pseudo"># sur le serveur (ou après un 'docker rmi' local pour tester) :
docker pull tonuser/ludotheque:1.0.0   # télécharge l'image de version depuis le registre
docker run -d --env-file .env.prod -p 8000:8000 tonuser/ludotheque:1.0.0   # la lance avec la config de prod

# compose de prod : plus de 'build:' du tout
  app:
    image: tonuser/ludotheque:1.0.0    # le service utilise l'image du registre (artefact déjà construit)</pre>
<p>Le serveur ne construit <strong>rien</strong> : il tire un artefact déjà construit, testé et scanné. C'est le principe « build once, run anywhere ».</p>

<h3>5. La discipline des versions</h3>
<p>Une règle d'or : un tag de version est <strong>immuable</strong> — une fois publié, il ne change JAMAIS de contenu. On utilise le versionnement <strong>semver</strong> (MAJEURE.MINEURE.PATCH). Le <strong>retour arrière</strong> (« rollback ») consiste simplement à redéployer l'ancien tag, toujours présent au registre.</p>
<pre class="pseudo">1.0.0, 1.0.1, 1.1.0...   versions IMMUABLES : on ne re-pousse JAMAIS sur un tag de version existant   # chaque version est gravée dans le marbre
latest                   pointeur de commodité (dev seulement), JAMAIS en production                   # étiquette mouvante : pratique en dev, dangereuse en prod
retour arrière        =  redéployer le tag PRÉCÉDENT (il existe toujours au registre)                  # revenir en arrière = repointer l'ancienne version</pre>
<div class="warn">Re-pousser une image différente sur <code>1.0.0</code> casse la confiance : deux serveurs « en 1.0.0 » exécuteraient du code différent. Un tag de version est un <strong>contrat</strong> — comme un tag Git, il ne bouge pas.</div>
<div class="tip">Public ou privé ? Une image d'application interne contient ton code : registre <strong>privé</strong> (Docker Hub privé, ghcr.io privé). Le scan CVE (leçon 16) se refait idéalement <em>au push</em> — les registres modernes le proposent.</div>`,

    { type: "vf", q: "Les registres modernes peuvent scanner les CVE au push.", a: true, exp: "La leçon 16 s'automatise." }
  ],

      { type: "qcm", q: "L'ordre :", opts: ["login → tag (1.0.0 + latest) → push les deux", "push → tag", "build sur le serveur", "zip + email"], a: 0, exp: "La chaîne de publication." },
      { type: "qcm", q: "Le tag complet :", opts: ["tonuser/ludotheque:1.0.0", "ludotheque", "1.0.0", "latest seul"], a: 0, exp: "compte/nom:version." },

      { type: "vf", q: "Si la 1.0.1 échoue, on redéploie la 1.0.0 restée au registre.", a: true, exp: "Retour arrière en un changement de tag." }
    ],
    solution: `<pre class="pseudo">$ docker login                                       # authentification au registre (une fois)
$ docker tag ludotheque:0.2 tonuser/ludotheque:1.0.0   # étiquette de version, alignée sur le tag Git
$ docker tag ludotheque:0.2 tonuser/ludotheque:latest  # étiquette latest (commodité)
$ docker push tonuser/ludotheque:1.0.0                # envoie la version au registre (couches nouvelles seulement)
$ docker push tonuser/ludotheque:latest               # envoie aussi latest

# serveur :
$ docker pull tonuser/ludotheque:1.0.0                # le serveur TIRE l'artefact déjà construit
# compose.yaml : image: tonuser/ludotheque:1.0.0  (plus de build:)   # en prod, on référence l'image, on ne construit pas
$ git tag v1.0.0 && git push --tags                   # le code porte le même numéro : image et code racontent la même histoire</pre>
<p>L'image est publiée et versionnée. Demain : observer ce qui tourne.</p>`
  }
};
