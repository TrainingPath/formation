<script>
var DAY = {
  num: 26,
  title: "Les adverbes",
  subtitle: "Préciser le temps, le lieu et la manière — et les ranger dans le bon ordre.",
  theory: `
<h3>1. Qu'est-ce qu'un adverbe ?</h3>
<p>Un adverbe précise un verbe, un adjectif ou toute la phrase : il dit <em>quand</em>, <em>où</em>, <em>comment</em> ou <em>combien</em>. Bonne nouvelle : en allemand, l'adverbe est <strong>invariable</strong> (pas de déclinaison, contrairement à l'adjectif). Mieux : l'adjectif employé comme adverbe garde sa forme de base.</p>
<pre class="pseudo">Sie ist schnell.        Elle est rapide.   (adjectif attribut)
Sie läuft schnell.      Elle court vite.   (le MÊME mot, adverbe : pas de -e)</pre>
<div class="tip">En français, l'adverbe se forme souvent en -ment (rapide → rapidement). En allemand, on garde simplement l'adjectif : <strong>schnell</strong> = rapide ET vite. Pas de terminaison à ajouter.</div>
<h3>2. Les adverbes de temps (wann?)</h3>
<pre class="pseudo">heute      aujourd'hui    morgen     demain
gestern    hier           bald       bientôt
immer      toujours       oft        souvent
manchmal   parfois        nie        jamais
früh       tôt            spät       tard</pre>
<h3>3. Les adverbes de lieu (wo? / wohin?)</h3>
<pre class="pseudo">hier       ici            dort       là-bas
links      à gauche       rechts     à droite
oben       en haut        unten      en bas
überall    partout        nirgendwo  nulle part
nach Hause à la maison (direction)   zu Hause   à la maison (position)</pre>
<div class="warn">Ne confonds pas <strong>nach Hause</strong> (mouvement : rentrer à la maison) et <strong>zu Hause</strong> (position : être à la maison). « Ich gehe nach Hause » vs « Ich bin zu Hause ».</div>
<h3>4. Les adverbes de manière (wie?)</h3>
<pre class="pseudo">gut        bien           schlecht   mal
schnell    vite           langsam    lentement
gern       volontiers     leider     malheureusement
vielleicht peut-être      wirklich   vraiment</pre>
<h3>5. L'ordre des compléments : TE-KA-MO-LO</h3>
<p>Quand plusieurs compléments se suivent, l'allemand a un ordre préféré. Une astuce de mémorisation : <strong>TE-KA-MO-LO</strong> = <strong>Te</strong>mporal (temps) - <strong>Ka</strong>usal (cause) - <strong>Mo</strong>dal (manière) - <strong>Lo</strong>kal (lieu). Autrement dit : <strong>temps → cause → manière → lieu</strong>.</p>
<pre class="pseudo">Ich fahre  morgen   mit dem Bus   in die Stadt.
           [temps]   [manière]     [lieu]
Je vais demain en bus en ville.</pre>
<p>Autre exemple : « Er geht <strong>heute</strong> (temps) <strong>gern</strong> (manière) <strong>ins Kino</strong> (lieu). »</p>
<div class="tip">Retiens surtout : le <strong>temps</strong> vient en premier, le <strong>lieu</strong> en dernier. La manière se glisse au milieu. « Ich komme heute schnell nach Hause. »</div>
<h3>6. La place de l'adverbe en tête de phrase</h3>
<p>On peut déplacer un adverbe en 1re position pour le mettre en valeur — cela entraîne l'<strong>inversion</strong> (verbe en 2e position) :</p>
<pre class="pseudo">Heute fahre ich in die Stadt.     Aujourd'hui je vais en ville.
Vielleicht kommt er später.       Peut-être vient-il plus tard.</pre>`,
  exercises: [
    { type: "vf", q: "En allemand, l'adverbe est invariable : il ne se décline pas.", a: true, exp: "Contrairement à l'adjectif épithète, l'adverbe ne change pas." },
    { type: "qcm", q: "« Sie läuft schnell. » Le mot « schnell » signifie ici…", opts: ["rapide (adjectif)", "vite (adverbe)", "la vitesse", "plus vite"], a: 1, exp: "Le même mot sert d'adverbe : elle court vite." },
    { type: "qcm", q: "Comment forme-t-on l'adverbe de « schnell » (rapide) ?", opts: ["schnellement", "schnelle", "schnell (aucun changement)", "schnellich"], a: 2, exp: "On garde l'adjectif tel quel : schnell = vite." },
    { type: "qcm", q: "Que signifie « manchmal » ?", opts: ["toujours", "jamais", "parfois", "souvent"], a: 2, exp: "manchmal = parfois." },
    { type: "input", q: "Complète : « Ich gehe ___ Hause. » (je rentre à la maison — direction)", a: ["nach"], ph: "préposition", exp: "nach Hause = direction (rentrer)." },
    { type: "qcm", q: "« Ich bin zu Hause » signifie…", opts: ["je rentre à la maison", "je suis à la maison", "je pars de la maison", "ma maison"], a: 1, exp: "zu Hause = position (être à la maison)." },
    { type: "vf", q: "« nach Hause » exprime un mouvement, « zu Hause » exprime une position.", a: true, exp: "gehen nach Hause (direction) / sein zu Hause (lieu)." },
    { type: "qcm", q: "Que veut dire « leider » ?", opts: ["volontiers", "malheureusement", "vraiment", "peut-être"], a: 1, exp: "leider = malheureusement." },
    { type: "qcm", q: "Dans TE-KA-MO-LO, quel complément vient EN PREMIER ?", opts: ["le lieu", "la manière", "le temps", "la cause"], a: 2, exp: "TEmporal = le temps vient d'abord." },
    { type: "qcm", q: "Dans TE-KA-MO-LO, quel complément vient EN DERNIER ?", opts: ["le temps", "la manière", "le lieu", "la cause"], a: 2, exp: "LOkal = le lieu vient en dernier." },
    { type: "qcm", q: "Quel est le bon ordre ?", opts: ["Ich fahre in die Stadt mit dem Bus morgen.", "Ich fahre morgen mit dem Bus in die Stadt.", "Ich fahre mit dem Bus morgen in die Stadt.", "Ich fahre in die Stadt morgen mit dem Bus."], a: 1, exp: "temps (morgen) → manière (mit dem Bus) → lieu (in die Stadt)." },
    { type: "qcm", q: "« Heute fahre ich in die Stadt. » Pourquoi « fahre ich » et non « ich fahre » ?", opts: ["c'est une faute", "l'adverbe heute en 1re position force l'inversion", "les adverbes suppriment le sujet", "fahren est irrégulier"], a: 1, exp: "Adverbe en tête → verbe en 2e position → inversion." },
    { type: "input", q: "Complète l'inversion : « Vielleicht ___ er später. » (kommen, 3e pers.)", a: ["kommt"], ph: "verbe", exp: "Vielleicht kommt er = peut-être vient-il." },
    { type: "qcm", q: "Compréhension : « Ich komme heute leider spät nach Hause. » Que dit la personne ?", opts: ["Elle rentre tôt aujourd'hui", "Elle rentre malheureusement tard aujourd'hui", "Elle ne rentre pas", "Elle est déjà à la maison"], a: 1, exp: "heute (temps) + leider spät (manière) + nach Hause (lieu)." },
    { type: "qcm", q: "Compréhension : « Er spielt sehr gut Klavier. » Comment joue-t-il du piano ?", opts: ["mal", "rarement", "très bien", "vite"], a: 2, exp: "sehr gut = très bien (adverbe de manière)." }
  ],
  final: {
    title: "Exercice final — Ranger les adverbes",
    intro: `<p>Rappel de l'ordre TE-KA-MO-LO : <strong>temps → cause → manière → lieu</strong>. Voici des phrases à analyser.</p>
<pre class="pseudo">Beispiel: Ich gehe [heute] [mit meiner Freundin] [ins Kino].
                    temps     manière              lieu
Elle range aussi : le temps devant, le lieu à la fin.</pre>`,
    questions: [
      { type: "qcm", q: "Quel ordre est correct ? (temps / manière / lieu)", opts: ["Ich fahre nach Berlin morgen schnell.", "Ich fahre morgen schnell nach Berlin.", "Ich fahre schnell nach Berlin morgen.", "Ich fahre nach Berlin schnell morgen."], a: 1, exp: "morgen (temps) → schnell (manière) → nach Berlin (lieu)." },
      { type: "input", q: "Complète l'adverbe de temps manquant : « Wir gehen ___ ins Restaurant. » (ce soir = heute Abend, mets « heute »)", a: ["heute"], ph: "adverbe de temps", exp: "heute Abend = ce soir ; le temps se place tôt." },
      { type: "qcm", q: "Dans « Er geht heute gern ins Kino », quel est l'ordre des types ?", opts: ["lieu - temps - manière", "temps - manière - lieu", "manière - lieu - temps", "temps - lieu - manière"], a: 1, exp: "heute (temps) - gern (manière) - ins Kino (lieu)." },
      { type: "qcm", q: "Quel adverbe placer en 1re position force l'inversion du verbe ?", opts: ["seulement heute", "n'importe quel adverbe en 1re position", "aucun", "seulement les adverbes de lieu"], a: 1, exp: "Tout élément en 1re position déclenche l'inversion (verbe en 2e)." },
      { type: "vf", q: "« Morgen ich fahre in die Stadt » est correct.", a: false, exp: "FAUX : après Morgen (1re position), inversion → « Morgen fahre ich in die Stadt »." }
    ],
    solution: `<p>L'ordre par défaut des compléments est <strong>TE-KA-MO-LO</strong> : temps (wann?), cause (warum?), manière (wie?), lieu (wo/wohin?). Exemple complet : « Ich fahre <strong>morgen</strong> (temps) <strong>wegen der Arbeit</strong> (cause) <strong>mit dem Auto</strong> (manière) <strong>nach München</strong> (lieu). »</p>
<p>Deux réflexes : le <strong>temps</strong> se place tôt, le <strong>lieu</strong> à la fin ; et tout élément mis en 1re position entraîne l'<strong>inversion</strong> du verbe.</p>`
  }
};
</script>
