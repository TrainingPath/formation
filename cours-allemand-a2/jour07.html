<h3>1. Le superlatif adverbial : am …-sten</h3>
<p>Le <strong>superlatif</strong> exprime le degré maximal (« le plus … »). La forme la plus simple, employée après un verbe, est <strong>am + adjectif + -sten</strong>. Elle est invariable.</p>
<pre class="pseudo">schnell → am schnellsten   (le plus rapide)
Das Flugzeug ist  am schnellsten.   // L'avion est le plus rapide
Im Winter ist es  am kältesten.     // En hiver il fait le plus froid</pre>
<h3>2. Le superlatif épithète : der/die/das …-ste</h3>
<p>Devant un nom, le superlatif prend l'article défini et la terminaison <strong>-ste</strong> (+ terminaison d'adjectif, cf. jour 8).</p>
<pre class="pseudo">der schnellste Zug     // le train le plus rapide
die größte Stadt       // la plus grande ville
das schönste Haus      // la plus belle maison</pre>
<h3>3. Umlaut et -esten</h3>
<p>Les adjectifs courts prennent l'<strong>Umlaut</strong> (comme au comparatif). Ceux finissant par -t, -d, -s, -ß, -z ajoutent un <strong>-e-</strong> : am kält<strong>e</strong>sten.</p>
<pre class="pseudo">alt   → am ältesten      (comp. älter)
groß  → am größten       (comp. größer)
jung  → am jüngsten
kalt  → am kältesten     (-e- ajouté)
warm  → am wärmsten</pre>
<h3>4. Les irréguliers</h3>
<pre class="pseudo">Positif   Comparatif   Superlatif
gut       besser       am besten / der beste
viel      mehr         am meisten
gern      lieber       am liebsten
hoch      höher        am höchsten
nah       näher        am nächsten</pre>
<div class="warn">Deux formes selon la place : après le verbe → <strong>am …-sten</strong> (invariable) ; devant un nom → <strong>der/die/das …-ste</strong> (avec article et accord). « Er läuft am schnellsten » mais « der schnellste Läufer ».</div>
<div class="tip">Les trois degrés en un coup d'œil : schnell (rapide) → schneller (plus rapide) → am schnellsten (le plus rapide). Positif, comparatif, superlatif.</div>`,

    ],
    solution: `<p>Les superlatifs du texte, classés par forme :</p>
<pre class="pseudo">épithète (article + -ste) : der längste Fluss, der höchste Berg
adverbial (am …-sten)     : am wärmsten, am kältesten, am liebsten</pre>
<p>Retiens la règle de position : <strong>am …-sten</strong> après un verbe, <strong>der/die/das …-ste</strong> devant un nom. Et n'oublie ni l'Umlaut (längste, wärmsten) ni le -e- après -t (kältesten).</p>`
