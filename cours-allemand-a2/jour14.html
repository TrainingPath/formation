  subtitle: "Quand : répétition/futur (wenn) ou moment unique passé (als).",
  theory: `
<h3>1. Deux mots pour « quand »</h3>
<p>Le français « quand » se traduit par <strong>wenn</strong> ou <strong>als</strong> selon le cas. Comme au jour 13, ce sont des subordonnées : le <strong>verbe conjugué va à la fin</strong>.</p>
<h3>2. wenn : répétition, présent, futur</h3>
<p><strong>wenn</strong> s'emploie pour une action <strong>répétée</strong> (« chaque fois que »), ou au <strong>présent/futur</strong> (« quand », « si »).</p>
<pre class="pseudo">Wenn ich Zeit  habe,  lese ich.
// Quand j'ai le temps, je lis  (habitude)
Immer wenn es  regnet,  bleibe ich zu Hause.
// Chaque fois qu'il pleut, je reste à la maison</pre>
<h3>3. als : un moment unique dans le passé</h3>
<p><strong>als</strong> s'emploie pour un <strong>événement unique au passé</strong> (« lorsque », « le jour où »).</p>
<pre class="pseudo">Als ich klein  war,  wohnte ich in Köln.
// Quand j'étais petit, j'habitais à Cologne  (une période passée)
Als ich gestern nach Hause  kam,  war niemand da.
// Quand je suis rentré hier, il n'y avait personne</pre>
<h3>4. La règle de choix</h3>
<pre class="pseudo">Passé + une seule fois      → als
Passé répété / présent / futur → wenn</pre>
<pre class="pseudo">Als ich 10 war…      (une seule enfance : als)
Wenn ich Kaffee trinke…  (chaque fois : wenn)
Wenn du morgen kommst…   (futur : wenn)</pre>
<h3>5. La subordonnée peut commencer la phrase</h3>
<p>Si la subordonnée est en tête, la principale commence par son <strong>verbe</strong> (règle « verbe en 2e position » : la subordonnée compte pour la 1re place).</p>
<pre class="pseudo">Wenn es regnet,  bleibe ich zu Hause.
// (subordonnée), VERBE + sujet…   → bleibe juste après la virgule</pre>
<div class="warn">Piège fréquent des francophones : pour un souvenir d'enfance (passé unique), on dit <strong>als</strong>, jamais wenn. « Als ich klein war » (correct) et non « Wenn ich klein war ».</div>
<div class="tip">Mémo : <strong>als</strong> = une fois, dans le passé (comme un instantané photo). <strong>wenn</strong> = à chaque fois, ou présent/futur (comme une action qui se répète).</div>`,

    ],
    solution: `<p>Distinction als / wenn dans le texte :</p>
<pre class="pseudo">als  → moment unique passé : Als ich ein Kind war / Als ich zehn war
wenn → répétition passée   : Immer wenn wir Ferien hatten
wenn → présent / futur     : Wenn ich heute denke / Wenn ich morgen Zeit habe</pre>
<p>Deux réflexes à combiner : le <strong>choix als/wenn</strong> (une fois au passé = als ; sinon = wenn) et la <strong>place du verbe à la fin</strong> de la subordonnée. Quand la subordonnée ouvre la phrase, la principale enchaîne par son verbe.</p>`
