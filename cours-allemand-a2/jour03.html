<script>
var DAY = {
  num: 3,
  title: "Auxiliaire haben ou sein ?",
  subtitle: "Choisir le bon auxiliaire au Perfekt.",
  theory: `
<h3>1. Deux auxiliaires possibles</h3>
<p>Au Perfekt, le participe est le même, mais l'<strong>auxiliaire</strong> peut être <strong>haben</strong> (avoir) ou <strong>sein</strong> (être). Le français utilise aussi les deux (« j'ai mangé » / « je suis allé »), mais les règles allemandes ne sont pas identiques. Il faut connaître le bon choix.</p>
<h3>2. La règle du mouvement / changement d'état → sein</h3>
<p>On emploie <strong>sein</strong> avec les verbes de <strong>déplacement d'un point A à un point B</strong> et les verbes de <strong>changement d'état</strong> (s'endormir, se réveiller, mourir, devenir…).</p>
<pre class="pseudo">gehen     → ist gegangen      allé (à pied)
fahren    → ist gefahren      allé (en véhicule)
kommen    → ist gekommen      venu
laufen    → ist gelaufen      couru
fliegen   → ist geflogen      volé, allé en avion
bleiben   → ist geblieben     resté (exception à retenir !)
werden    → ist geworden      devenu
einschlafen → ist eingeschlafen   endormi</pre>
<h3>3. Tout le reste → haben</h3>
<p>La <strong>majorité</strong> des verbes prend <strong>haben</strong> : tous les verbes avec complément d'objet direct, et les activités sans déplacement.</p>
<pre class="pseudo">Ich  habe  gegessen / gespielt / gelesen / gearbeitet
Er   hat   ein Auto gekauft
Wir  haben getanzt / geschlafen</pre>
<h3>4. Conjugaison de sein au présent (rappel)</h3>
<pre class="pseudo">ich bin      wir sind
du bist      ihr seid
er/sie ist   sie/Sie sind</pre>
<pre class="pseudo">Ich  bin  nach Berlin  gefahren.     // Je suis allé à Berlin (en train/voiture)
Sie  ist  früh         gekommen.     // Elle est venue tôt</pre>
<div class="warn">Attention aux pièges : <strong>bleiben</strong> (rester) et <strong>sein</strong> lui-même prennent sein, alors qu'il n'y a pas de mouvement : ist geblieben, ist gewesen. À apprendre par cœur.</div>
<div class="tip">Test rapide : le verbe décrit-il un déplacement A→B ou un changement d'état ? Si oui → <strong>sein</strong>. Sinon → <strong>haben</strong>.</div>`,
  exercises: [
    { type: "input", q: "Complète : « Ich ___ nach Hause gegangen. » (auxiliaire de gehen)", a: ["bin"], ph: "auxiliaire", exp: "gehen = déplacement → sein : ich bin gegangen." },
    { type: "input", q: "Complète : « Wir ___ Pizza gegessen. » (auxiliaire de essen)", a: ["haben"], ph: "auxiliaire", exp: "essen n'est pas un déplacement → haben : wir haben gegessen." },
    { type: "input", q: "Complète : « Er ___ nach Berlin gefahren. » (il)", a: ["ist"], ph: "auxiliaire", exp: "fahren = déplacement → sein : er ist gefahren." },
    { type: "input", q: "Complète : « Sie ___ ein Buch gelesen. » (elle)", a: ["hat"], ph: "auxiliaire", exp: "lesen → haben : sie hat gelesen." },
    { type: "input", q: "Complète : « Ich ___ zu Hause geblieben. » (bleiben, piège !)", a: ["bin"], ph: "auxiliaire", exp: "bleiben prend sein malgré l'absence de mouvement : ich bin geblieben." },
    { type: "input", q: "Complète : « Du ___ lange geschlafen. » (schlafen, tu)", a: ["hast"], ph: "auxiliaire", exp: "schlafen (dormir) n'est pas un déplacement → haben : du hast geschlafen." },
    { type: "qcm", q: "Quel groupe de verbes prend l'auxiliaire sein ?", opts: ["Les verbes avec complément d'objet", "Les verbes de déplacement A→B et de changement d'état", "Tous les verbes forts", "Les verbes en -ieren"], a: 1, exp: "Mouvement d'un point à un autre ou changement d'état → sein." },
    { type: "qcm", q: "Quel auxiliaire pour <code>kommen</code> (venir) ?", opts: ["haben", "sein", "werden", "les deux"], a: 1, exp: "Déplacement → sein : ist gekommen." },
    { type: "qcm", q: "Quel auxiliaire pour <code>kaufen</code> (acheter) ?", opts: ["haben", "sein", "werden", "aucun"], a: 0, exp: "Pas de déplacement, complément d'objet → haben : hat gekauft." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Ich habe nach Hause gegangen.", "Ich bin nach Hause gegangen.", "Ich bin ein Buch gelesen.", "Ich habe geblieben."], a: 1, exp: "gehen → sein : Ich bin nach Hause gegangen." },
    { type: "qcm", q: "Quel auxiliaire pour <code>werden</code> (devenir) ?", opts: ["haben", "sein", "aucun", "les deux au choix"], a: 1, exp: "Changement d'état → sein : ist geworden." },
    { type: "qcm", q: "Complète : « Der Vogel ___ geflogen. » (l'oiseau a volé)", opts: ["hat", "ist", "bin", "seid"], a: 1, exp: "fliegen = déplacement → sein : ist geflogen." },
    { type: "vf", q: "La plupart des verbes allemands forment le Perfekt avec haben.", a: true, exp: "Vrai : sein est réservé au mouvement et au changement d'état." },
    { type: "vf", q: "On dit « Ich habe nach Berlin gefahren ».", a: false, exp: "Faux : fahren = déplacement → sein. C'est « Ich bin nach Berlin gefahren »." },
    { type: "vf", q: "bleiben (rester) prend l'auxiliaire sein, même s'il n'y a pas de mouvement.", a: true, exp: "Vrai : c'est une exception à mémoriser (ist geblieben)." }
  ],
  final: {
    title: "Exercice final — Der Ausflug",
    intro: `<p>Un texte au Perfekt où les deux auxiliaires se croisent :</p>
<pre class="pseudo">Am Samstag bin ich nach München gefahren. Ich habe dort viele
Fotos gemacht. Am Mittag bin ich in einen Park gegangen und habe
ein Picknick gegessen. Danach bin ich müde geworden, aber ich bin
noch lange geblieben. Am Abend bin ich nach Hause gekommen.</pre>
<p>(Traduction : Samedi je suis allé à Munich. J'y ai pris beaucoup de photos. À midi je suis allé dans un parc et j'ai mangé un pique-nique. Ensuite je suis devenu fatigué, mais je suis resté encore longtemps. Le soir je suis rentré à la maison.)</p>`,
    questions: [
      { type: "input", q: "« ___ ich nach München gefahren » : quel auxiliaire ?", a: ["bin"], ph: "auxiliaire", exp: "fahren → sein : bin gefahren." },
      { type: "input", q: "« Ich ___ viele Fotos gemacht » : quel auxiliaire ?", a: ["habe"], ph: "auxiliaire", exp: "machen → haben : habe gemacht." },
      { type: "qcm", q: "Pourquoi « bin geworden » et non « habe geworden » ?", opts: ["Erreur du texte", "werden est un changement d'état → sein", "werden est un verbe faible", "Par hasard"], a: 1, exp: "Devenir = changement d'état → auxiliaire sein." },
      { type: "vf", q: "« bin geblieben » est correct car bleiben prend sein.", a: true, exp: "Vrai : bleiben est l'exception classique avec sein." },
      { type: "qcm", q: "Combien d'auxiliaires différents apparaissent dans ce texte ?", opts: ["Un seul (haben)", "Un seul (sein)", "Deux : haben et sein", "Trois"], a: 2, exp: "Le texte mélange haben (machen, essen) et sein (fahren, gehen, werden, bleiben, kommen)." }
    ],
    solution: `<p>Classement des verbes du texte :</p>
<pre class="pseudo">sein  : fahren, gehen, werden, bleiben, kommen   (déplacement / état)
haben : machen, essen                            (activité avec objet)</pre>
<p>Le réflexe à installer : quand tu vois un verbe de mouvement (gehen, fahren, kommen…) ou de changement (werden, einschlafen…), prends <strong>sein</strong> ; sinon <strong>haben</strong>. Les seules exceptions vraiment à mémoriser sont bleiben et sein.</p>`
  }
};
</script>
