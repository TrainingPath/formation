<script>
var DAY = {
  num: 9,
  title: "La déclinaison de l'adjectif (article indéfini)",
  subtitle: "ein/eine + adjectif : l'adjectif porte parfois le genre.",
  theory: `
<h3>1. Le principe : l'adjectif complète l'article</h3>
<p>Après un article <strong>indéfini</strong> (ein, eine) ou un possessif (mein, dein…), l'article ne montre pas toujours le genre. Exemple : « ein » ne dit pas s'il est masculin ou neutre. Dans ce cas, c'est l'<strong>adjectif</strong> qui porte l'information manquante, en prenant la terminaison forte (-er, -es).</p>
<h3>2. Le tableau à connaître</h3>
<pre class="pseudo">              MASCULIN         FÉMININ        NEUTRE          PLURIEL (keine…)
NOMINATIF     ein -er          eine -e        ein -es         keine -en
ACCUSATIF     einen -en        eine -e        ein -es         keine -en
DATIF         einem -en        einer -en      einem -en       keinen -en</pre>
<h3>3. Les trois cases « spéciales » (terminaison forte)</h3>
<p>Trois cases se distinguent de l'article défini : le nominatif masculin (-<strong>er</strong>), le nominatif neutre et l'accusatif neutre (-<strong>es</strong>). Là, l'adjectif prend la terminaison que l'article ne montre pas.</p>
<pre class="pseudo">ein neuer Wagen        // une voiture neuve (nom. masc.)  → -er
ein kleines Kind       // un petit enfant (nom./acc. neutre) → -es
eine große Stadt       // une grande ville (nom./acc. fém.) → -e</pre>
<h3>4. Le reste ressemble à l'article défini (-en)</h3>
<pre class="pseudo">Ich habe einen neuen Wagen.       // acc. masc.  → -en
mit einem kleinen Kind            // datif       → -en
in einer großen Stadt            // datif fém.  → -en
meine alten Freunde              // pluriel     → -en</pre>
<div class="warn">Compare avec le jour 8 : « der neue Wagen » (article défini, -e) mais « ein neu<strong>er</strong> Wagen » (article indéfini, -er). Quand l'article est « faible » (ne montre pas le genre), l'adjectif devient « fort » (-er, -es).</div>
<div class="tip">Astuce : au datif (einem, einer, einen…) et à l'accusatif masculin (einen), l'adjectif est toujours en <strong>-en</strong>, comme avec l'article défini. Concentre ta mémoire sur les trois cases -er / -es / -es.</div>`,
  exercises: [
    { type: "input", q: "Nom. masc. : « ein ___ Wagen » (neu)", a: ["neuer"], ph: "…er", exp: "Nominatif masc. après ein → -er : ein neuer Wagen." },
    { type: "input", q: "Nom. neutre : « ein ___ Kind » (klein)", a: ["kleines"], ph: "…es", exp: "Nominatif/accusatif neutre → -es : ein kleines Kind." },
    { type: "input", q: "Nom. fém. : « eine ___ Stadt » (groß)", a: ["große", "grosse", "große"], ph: "-e", exp: "Féminin → -e : eine große Stadt." },
    { type: "input", q: "Acc. masc. : « Ich habe einen ___ Wagen. » (neu)", a: ["neuen"], ph: "-en", exp: "Accusatif masc. (einen) → -en : einen neuen Wagen." },
    { type: "input", q: "Datif : « mit einem ___ Kind » (klein)", a: ["kleinen"], ph: "-en", exp: "Datif → -en : mit einem kleinen Kind." },
    { type: "input", q: "Pluriel possessif : « meine ___ Freunde » (alt)", a: ["alten"], ph: "-en", exp: "Pluriel → -en : meine alten Freunde." },
    { type: "qcm", q: "Pourquoi l'adjectif prend-il -er dans « ein neuer Wagen » ?", opts: ["Par hasard", "Parce que ein ne montre pas le genre : l'adjectif le porte", "Parce que neu est irrégulier", "C'est un pluriel"], a: 1, exp: "L'article indéfini ne marque pas le masculin ; l'adjectif prend -er." },
    { type: "qcm", q: "Nom./acc. neutre après ein : quelle terminaison ?", opts: ["-e", "-en", "-es", "-er"], a: 2, exp: "ein kleines Kind → -es." },
    { type: "qcm", q: "« Ich sehe einen ___ Hund » (groß) : terminaison ?", opts: ["großer", "großes", "großen", "große"], a: 2, exp: "Accusatif masculin (einen) → -en : einen großen Hund." },
    { type: "qcm", q: "Quelle est la différence entre « der neue Wagen » et « ein neuer Wagen » ?", opts: ["Aucune", "Après ein, l'adjectif prend -er (l'article ne montre pas le genre)", "der est faux", "ein neuer est un pluriel"], a: 1, exp: "Article faible (ein) → adjectif fort (-er)." },
    { type: "qcm", q: "Au datif féminin : « in einer ___ Stadt » (groß) ?", opts: ["große", "großen", "großes", "großer"], a: 1, exp: "Datif → -en : in einer großen Stadt." },
    { type: "qcm", q: "Terminaison de l'adjectif au datif (einem/einer) ?", opts: ["-e", "-es", "-er", "-en"], a: 3, exp: "Toujours -en au datif." },
    { type: "vf", q: "Après ein, le nominatif masculin donne un adjectif en -er (ein neuer Mann).", a: true, exp: "Vrai : l'adjectif porte le genre que ein ne montre pas." },
    { type: "vf", q: "« ein kleines Kind » : la terminaison -es marque le neutre.", a: true, exp: "Vrai : neutre au nominatif/accusatif → -es." },
    { type: "vf", q: "À l'accusatif masculin, on écrit « einen neuer Wagen ».", a: false, exp: "Faux : accusatif masculin → -en : einen neuen Wagen." }
  ],
  final: {
    title: "Exercice final — Eine neue Wohnung",
    intro: `<p>Quelqu'un décrit son nouvel appartement :</p>
<pre class="pseudo">Ich habe eine neue Wohnung. Es gibt ein großes Wohnzimmer und
eine kleine Küche. Ich habe einen alten Tisch und einen neuen
Stuhl gekauft. In einem kleinen Zimmer steht mein Bett. Meine
netten Nachbarn sind sehr freundlich.</pre>
<p>(Traduction : J'ai un nouvel appartement. Il y a un grand salon et une petite cuisine. J'ai acheté une vieille table et une nouvelle chaise. Dans une petite pièce se trouve mon lit. Mes gentils voisins sont très aimables.)</p>`,
    questions: [
      { type: "input", q: "« ein ___ Wohnzimmer » (groß, neutre) : terminaison ?", a: ["großes", "grosses", "großes"], ph: "…es", exp: "Neutre → -es : ein großes Wohnzimmer." },
      { type: "input", q: "« einen ___ Stuhl » (neu, acc. masc.) : terminaison ?", a: ["neuen"], ph: "-en", exp: "Accusatif masculin → -en : einen neuen Stuhl." },
      { type: "qcm", q: "Pourquoi « eine neue Wohnung » prend -e ?", opts: ["Neutre", "Féminin nominatif/accusatif → -e", "Datif", "Pluriel"], a: 1, exp: "Wohnung est féminin ; féminin → -e." },
      { type: "input", q: "« in einem ___ Zimmer » (klein, datif) : terminaison ?", a: ["kleinen"], ph: "-en", exp: "Datif → -en : in einem kleinen Zimmer." },
      { type: "vf", q: "« meine netten Nachbarn » : -en est correct car c'est un pluriel.", a: true, exp: "Vrai : au pluriel, l'adjectif est en -en." }
    ],
    solution: `<p>Les terminaisons du texte, cas par cas :</p>
<pre class="pseudo">eine neue Wohnung   → -e   (fém. acc.)
ein großes Wohnzimmer → -es (neutre nom.)
eine kleine Küche   → -e   (fém. acc.)
einen alten Tisch   → -en  (acc. masc.)
einem kleinen Zimmer→ -en  (datif)
meine netten Nachbarn→ -en (pluriel)</pre>
<p>Le cœur à mémoriser : les trois cases fortes <strong>-er</strong> (nom. masc.), <strong>-es</strong> (nom./acc. neutre), tandis que l'accusatif masculin, le datif et le pluriel restent en <strong>-en</strong>, exactement comme avec l'article défini.</p>`
  }
};
</script>
