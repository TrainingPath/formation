<script>
var DAY = {

  title: "Au restaurant : commander",
  subtitle: "Lire un menu, commander poliment, demander l'addition.",
  theory: `
<h3>1. Le vocabulaire du restaurant (das Restaurant)</h3>
<pre class="pseudo">die Speisekarte    la carte / le menu   die Vorspeise    l'entrée
das Hauptgericht   le plat principal    die Nachspeise   le dessert
die Getränke       les boissons         die Rechnung     l'addition
der Kellner        le serveur           die Bedienung    le service
bestellen          commander            bezahlen         payer</pre>
<p>À table, le serveur (der Kellner) apporte d'abord la carte (die Speisekarte). On commande (bestellen) puis, à la fin, on demande l'addition (die Rechnung).</p>
<h3>2. Commander poliment : ich möchte / ich hätte gern</h3>
<p>Pour commander, on n'utilise pas « ich will » (je veux), trop direct. On préfère deux formules polies au conditionnel :</p>
<pre class="pseudo">Ich möchte einen Kaffee.        Je voudrais un café.
Ich hätte gern die Suppe.       J'aimerais bien la soupe.
Für mich bitte ein Wasser.      Pour moi, une eau s'il vous plaît.</pre>
<div class="tip"><strong>hätte gern</strong> (littéralement « aurais volontiers ») est la formule la plus naturelle pour commander. « Ich hätte gern ... » = j'aimerais bien / je prendrais volontiers.</div>
<h3>3. Ce que dit le serveur</h3>
<pre class="pseudo">Was möchten Sie bestellen?       Que désirez-vous commander ?
Was darf es sein?                Ce sera quoi ? (Que puis-je vous servir ?)
Möchten Sie etwas trinken?       Voulez-vous boire quelque chose ?
Hat es geschmeckt?               C'était bon ? (Ça vous a plu ?)
Zusammen oder getrennt?          Ensemble ou séparément ? (l'addition)</pre>
<p>La question <strong>Hat es geschmeckt?</strong> vient du verbe <em>schmecken</em> (avoir du goût, plaire au palais). On répond : « Ja, sehr gut, danke! » (Oui, très bon, merci !).</p>
<h3>4. L'accusatif à table</h3>
<p>Quand on commande, l'objet commandé est au COD, donc à l'<strong>accusatif</strong> (revoir le datif/accusatif). L'article masculin change : <em>der Kaffee</em> devient <em>einen Kaffee</em>.</p>
<pre class="pseudo">Ich möchte einen Kaffee.   (der Kaffee → einen, masculin accusatif)
Ich möchte eine Suppe.     (die Suppe → eine, féminin, inchangé)
Ich möchte ein Bier.       (das Bier → ein, neutre, inchangé)</pre>
<div class="warn">Seul le masculin change à l'accusatif : <strong>ein → einen</strong>, <strong>der → den</strong>. Le féminin (eine) et le neutre (ein) restent identiques. « Ich nehme <strong>den</strong> Salat und <strong>das</strong> Schnitzel. »</div>
<h3>5. Payer et laisser un pourboire</h3>
<p>On appelle le serveur : « Die Rechnung, bitte! » ou « Zahlen, bitte! ». En Allemagne, on laisse un pourboire (das Trinkgeld) d'environ 10 %. On dit souvent le montant total arrondi : pour 18,50 €, on tend l'argent en disant « 20 » (Machen Sie 20 = gardez 20, gardez la monnaie jusqu'à 20).</p>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « la carte / le menu » ?", opts: ["die Rechnung", "die Speisekarte", "das Hauptgericht", "der Kellner"], a: 1, exp: "die Speisekarte = la carte des plats." },
    { type: "qcm", q: "Quelle est la formule la PLUS polie pour commander ?", opts: ["Ich will einen Kaffee.", "Ich hätte gern einen Kaffee.", "Gib mir Kaffee.", "Kaffee!"], a: 1, exp: "ich hätte gern = j'aimerais bien (conditionnel poli)." },
    { type: "input", q: "Complète : « Ich ___ gern die Suppe. » (j'aimerais bien)", a: ["hätte","haette"], ph: "conditionnel de haben", exp: "ich hätte gern = j'aimerais bien." },
    { type: "qcm", q: "Que signifie « die Rechnung » ?", opts: ["le pourboire", "l'addition", "le plat", "le dessert"], a: 1, exp: "die Rechnung = l'addition ; das Trinkgeld = le pourboire." },
    { type: "vf", q: "À l'accusatif, seul l'article masculin change : ein devient einen.", a: true, exp: "der → den, ein → einen. Féminin et neutre ne changent pas." },
    { type: "input", q: "Complète (masculin accusatif) : « Ich möchte ___ Kaffee. » (der Kaffee)", a: ["einen"], ph: "article indéfini acc.", exp: "der Kaffee → einen Kaffee (accusatif)." },
    { type: "qcm", q: "« Ich möchte eine Suppe. » — pourquoi « eine » et non « einen » ?", opts: ["die Suppe est féminin, inchangé à l'accusatif", "C'est une faute", "Suppe est masculin", "eine est toujours utilisé"], a: 0, exp: "Le féminin (eine) ne change pas à l'accusatif." },
    { type: "qcm", q: "Le serveur demande « Was darf es sein? ». Cela veut dire…", opts: ["L'addition ?", "Que puis-je vous servir ?", "C'était bon ?", "Ensemble ou séparé ?"], a: 1, exp: "Was darf es sein? = qu'est-ce que ce sera ?" },
    { type: "qcm", q: "« Hat es geschmeckt? » — que demande le serveur ?", opts: ["Voulez-vous payer ?", "C'était bon / ça vous a plu ?", "Voulez-vous un dessert ?", "Voulez-vous la carte ?"], a: 1, exp: "schmecken = avoir bon goût, plaire au palais." },
    { type: "input", q: "Complète : « Die ___, bitte! » (L'addition, s'il vous plaît)", a: ["Rechnung","rechnung"], ph: "un mot", exp: "Die Rechnung, bitte = l'addition SVP." },
    { type: "qcm", q: "« Zusammen oder getrennt? » — que demande le serveur au moment de payer ?", opts: ["Sur place ou à emporter", "Ensemble ou séparément (l'addition)", "Chaud ou froid", "Entrée ou dessert"], a: 1, exp: "zusammen = ensemble ; getrennt = séparément." },
    { type: "vf", q: "En Allemagne, on laisse habituellement un pourboire (Trinkgeld) d'environ 10 %.", a: true, exp: "Le Trinkgeld est d'usage, souvent en arrondissant." },
    { type: "qcm", q: "Compréhension : « Für mich bitte das Schnitzel mit Pommes und ein Bier. » Que commande le client ?", opts: ["Une soupe et un café", "Une escalope avec frites et une bière", "Un dessert et une eau", "Un menu enfant"], a: 1, exp: "Schnitzel = escalope, Pommes = frites, Bier = bière." },
    { type: "qcm", q: "Compréhension : « Als Nachspeise nehme ich den Apfelstrudel. » Que prend la personne en dessert ?", opts: ["Une soupe", "Un strudel aux pommes", "Une bière", "Une salade"], a: 1, exp: "die Nachspeise = le dessert ; Apfelstrudel = strudel aux pommes." },
    { type: "input", q: "Complète (masculin accusatif) : « Ich nehme ___ Salat. » (der Salat, article défini)", a: ["den"], ph: "article défini acc.", exp: "der Salat → den Salat (accusatif masculin)." }
  ],
  final: {
    title: "Exercice final — Im Restaurant (au restaurant)",
    intro: `<p>Lis la scène puis réponds aux questions.</p>
<pre class="pseudo">Kellner: Guten Abend! Was darf es sein?
Gast: Ich hätte gern die Tomatensuppe als Vorspeise.
Kellner: Und als Hauptgericht?
Gast: Das Schnitzel mit Kartoffeln, bitte. Und ein Wasser.
Kellner: Gern. ... Hat es geschmeckt?
Gast: Ja, sehr gut, danke! Die Rechnung, bitte.
Kellner: Zusammen? Das macht 24 Euro.</pre>
<p>(als = en tant que / comme · Das macht ... = ça fait ...)</p>`,
    questions: [
      { type: "input", q: "Que prend le client en entrée (Vorspeise) ? « die ___ »", a: ["Tomatensuppe","tomatensuppe"], ph: "un mot", exp: "« die Tomatensuppe als Vorspeise »." },
      { type: "qcm", q: "Quel est le plat principal choisi ?", opts: ["La soupe", "Le schnitzel avec des pommes de terre", "Une salade", "Un dessert"], a: 1, exp: "« Das Schnitzel mit Kartoffeln »." },
      { type: "qcm", q: "Que boit le client ?", opts: ["Une bière", "Un vin", "Une eau", "Un café"], a: 2, exp: "« Und ein Wasser. »" },
      { type: "vf", q: "Le client a apprécié le repas.", a: true, exp: "« Ja, sehr gut, danke! » en réponse à Hat es geschmeckt?" },
      { type: "input", q: "Combien coûte le repas ? (le nombre)", a: ["24","24 Euro","24 euro"], ph: "nombre", exp: "« Das macht 24 Euro. »" }
    ],
    solution: `<p>Déroulé : le client commande poliment avec « ich hätte gern » une soupe de tomates en entrée (Vorspeise), un schnitzel avec pommes de terre en plat (Hauptgericht) et une eau. Le serveur demande « Hat es geschmeckt? » ; le client répond que c'était très bon et réclame « die Rechnung ». Total : 24 €.</p>
<p>Retiens l'ordre : Vorspeise → Hauptgericht → Nachspeise, et les formules « ich hätte gern » (commander) et « die Rechnung, bitte » (payer).</p>`
  }
