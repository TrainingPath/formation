  title: "Le corps et la santé",
  subtitle: "Nommer le corps, dire où on a mal, chez le médecin.",
  theory: `
<h3>1. Le corps (der Körper)</h3>
<pre class="pseudo">der Kopf        la tête        das Auge       l'oeil (die Augen)
das Ohr         l'oreille      die Nase       le nez
der Mund        la bouche      der Zahn       la dent
der Hals        le cou/la gorge der Bauch     le ventre
der Arm         le bras        die Hand       la main
das Bein        la jambe       der Fuß        le pied
der Rücken      le dos         das Herz       le coeur</pre>
<h3>2. Dire où on a mal : Ich habe … -schmerzen</h3>
<p>Pour exprimer une douleur, l'allemand accole le nom de la partie du corps à <strong>-schmerzen</strong> (les douleurs). C'est un mot composé.</p>
<pre class="pseudo">Ich habe Kopfschmerzen.     J'ai mal à la tête (des maux de tête)
Ich habe Bauchschmerzen.    J'ai mal au ventre
Ich habe Halsschmerzen.     J'ai mal à la gorge
Ich habe Zahnschmerzen.     J'ai mal aux dents
Ich habe Rückenschmerzen.   J'ai mal au dos</pre>
<h3>3. Autre tournure : … tut mir weh (datif !)</h3>
<p>Avec le verbe <strong>wehtun</strong> (faire mal), la personne est au <strong>datif</strong> (rappel du jour 10). Le sujet est la partie du corps.</p>
<pre class="pseudo">Mein Kopf  tut mir weh.        Ma tête me fait mal
Meine Füße  tun mir weh.       Mes pieds me font mal (pluriel : tun)
Der Hals    tut mir weh.       La gorge me fait mal</pre>
<h3>4. Chez le médecin (beim Arzt)</h3>
<pre class="pseudo">Ich bin krank.              Je suis malade
Ich habe Fieber.           J'ai de la fièvre
Ich bin erkältet.          Je suis enrhumé
Ich brauche ein Medikament. J'ai besoin d'un médicament
Gute Besserung!            Bon rétablissement !</pre>
<h3>5. Donner un conseil : sollen (devoir/conseil)</h3>
<pre class="pseudo">Du sollst  viel Wasser  trinken.     Tu devrais boire beaucoup d'eau
Sie sollten  im Bett  bleiben.        Vous devriez rester au lit
Du musst  zum Arzt  gehen.           Tu dois aller chez le médecin</pre>
<div class="warn">Avec wehtun, n'oublie pas le datif de la personne : « Mein Kopf tut <strong>mir</strong> weh » (et non mich). Et le verbe s'accorde avec la partie du corps : ein Fuß tut weh / zwei Füße tun weh.</div>
<div class="tip">Deux façons de dire la même chose : « Ich habe Kopfschmerzen » ou « Mein Kopf tut mir weh ». Les deux sont justes et très courantes.</div>`,
  exercises: [

    { type: "input", q: "« J'ai mal au ventre » : « Ich habe ___. » (avec Bauch)", a: ["bauchschmerzen"], ph: "…schmerzen", exp: "Bauch + schmerzen = Bauchschmerzen." },
    { type: "input", q: "Complète le datif : « Mein Kopf tut ___ weh. » (à moi)", a: ["mir"], ph: "datif", exp: "wehtun + datif : tut mir weh." },
    { type: "input", q: "Comment dit-on « la main » en allemand ? die ___", a: ["hand"], ph: "nom", exp: "die Hand = la main." },
    { type: "input", q: "Comment dit-on « le pied » en allemand ? der ___", a: ["fuß", "fuss"], ph: "nom", exp: "der Fuß = le pied." },
    { type: "input", q: "Conseil : « Du ___ viel Wasser trinken. » (sollen, 2e pers.)", a: ["sollst"], ph: "sollen", exp: "du sollst = tu devrais (conseil)." },
    { type: "qcm", q: "Comment forme-t-on « mal à la gorge » ?", opts: ["Ich habe Hals weh", "Ich habe Halsschmerzen", "Ich bin Hals", "Mein Hals ist weh"], a: 1, exp: "partie du corps + -schmerzen : Halsschmerzen." },
    { type: "qcm", q: "Que signifie « der Rücken » ?", opts: ["le bras", "le dos", "la tête", "le pied"], a: 1, exp: "der Rücken = le dos." },
    { type: "qcm", q: "Avec wehtun, à quel cas est la personne ?", opts: ["nominatif", "accusatif", "datif", "génitif"], a: 2, exp: "Mein Kopf tut mir weh : datif (mir)." },
    { type: "qcm", q: "Que signifie « Gute Besserung! » ?", opts: ["Bonne journée !", "Bon rétablissement !", "Bon appétit !", "Bonne chance !"], a: 1, exp: "Gute Besserung = bon rétablissement (à un malade)." },
    { type: "qcm", q: "« Meine Füße tun mir weh » : pourquoi « tun » et non « tut » ?", opts: ["Erreur", "Füße est pluriel, le verbe s'accorde au pluriel", "weh exige tun", "Par style"], a: 1, exp: "Le sujet (Füße) est pluriel → tun." },
    { type: "qcm", q: "Comment dit-on « J'ai de la fièvre » ?", opts: ["Ich bin Fieber", "Ich habe Fieber", "Ich mache Fieber", "Mir ist Fieber"], a: 1, exp: "Ich habe Fieber = j'ai de la fièvre." },
    { type: "vf", q: "« Ich habe Zahnschmerzen » signifie « j'ai mal aux dents ».", a: true, exp: "Vrai : Zahn (dent) + schmerzen." },
    { type: "vf", q: "Avec wehtun, on dit « Mein Kopf tut mich weh ».", a: false, exp: "Faux : datif obligatoire → tut mir weh." },
    { type: "vf", q: "On peut dire « Ich habe Kopfschmerzen » OU « Mein Kopf tut mir weh ».", a: true, exp: "Vrai : deux tournures équivalentes et courantes." }
  ],
  final: {
    title: "Exercice final — Beim Arzt",
    intro: `<p>Lis le dialogue chez le médecin et réponds :</p>
<pre class="pseudo">Ärztin: Guten Tag, was fehlt Ihnen?
Herr B: Ich fühle mich nicht gut. Ich habe Kopfschmerzen und
        mein Hals tut mir weh.

        Bett bleiben. Gute Besserung!</pre>

    questions: [
      { type: "qcm", q: "De quoi se plaint M. B en premier ?", opts: ["Mal au ventre", "Mal à la tête (Kopfschmerzen)", "Mal au pied", "Mal aux dents"], a: 1, exp: "« Ich habe Kopfschmerzen » = mal à la tête." },
      { type: "input", q: "« mein Hals tut ___ weh » : quel pronom au datif ?", a: ["mir"], ph: "datif", exp: "wehtun + datif : tut mir weh." },
      { type: "qcm", q: "Quel est le diagnostic de la médecin ?", opts: ["Une grippe grave", "Il est enrhumé (erkältet)", "Rien du tout", "Une jambe cassée"], a: 1, exp: "« Sie sind erkältet » = vous êtes enrhumé." },
      { type: "input", q: "Conseil de la médecin : « Sie ___ viel Tee trinken. » (sollen, forme Sie)", a: ["sollten"], ph: "sollen", exp: "Sie sollten = vous devriez (conseil poli)." },
      { type: "qcm", q: "Que souhaite la médecin à la fin ?", opts: ["Bon voyage", "Bon rétablissement (Gute Besserung)", "Bon appétit", "Bonne nuit"], a: 1, exp: "Gute Besserung = bon rétablissement." }
    ],
    solution: `<p>Le vocabulaire clé du dialogue :</p>
<pre class="pseudo">Kopfschmerzen haben   → avoir mal à la tête
… tut mir weh         → … me fait mal (datif !)
Fieber haben          → avoir de la fièvre
erkältet sein         → être enrhumé
sollten + infinitif   → devriez (conseil)
Gute Besserung!       → bon rétablissement</pre>
<p>Tu sais maintenant décrire un problème de santé de deux façons (Ich habe …schmerzen / … tut mir weh) et comprendre un conseil médical (Sie sollten …). Ces expressions reviennent dans toute conversation chez le médecin.</p>`
  }
};
