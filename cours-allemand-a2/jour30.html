<body>
<script>
var DAY = {
  num: 30,
  title: "Bilan A2 : conversation et mini-entretien",
  subtitle: "Se présenter, échanger et répondre à un entretien simple : le grand oral du A2.",
  theory: `
<h3>1. Se présenter en quelques phrases</h3>
<p>Le point de départ de toute conversation : parler de soi. Prépare un petit paragraphe que tu peux dire par cœur.</p>
<pre class="pseudo">Ich heiße Sara und ich bin 28 Jahre alt.
Ich komme aus Frankreich und wohne in Lyon.
Ich bin Krankenschwester von Beruf.
In meiner Freizeit lese ich gern und mache Yoga.
Ich lerne Deutsch, weil ich in der Schweiz arbeiten möchte.</pre>
<p>(von Beruf = de profession · die Krankenschwester = l'infirmière)</p>
<h3>2. Les questions fréquentes d'un entretien / d'une rencontre</h3>
<pre class="pseudo">Wie heißen Sie? / Wie heißt du?        Comment vous appelez-vous ?
Woher kommen Sie?                      D'où venez-vous ?
Wo wohnen Sie?                         Où habitez-vous ?
Was sind Sie von Beruf?               Quel est votre métier ?
Warum lernen Sie Deutsch?             Pourquoi apprenez-vous l'allemand ?
Was machen Sie in Ihrer Freizeit?    Que faites-vous pendant votre temps libre ?
Können Sie sich kurz vorstellen?     Pouvez-vous vous présenter brièvement ?</pre>
<div class="tip">Dans un entretien, on vouvoie (Sie). Les questions et les réponses reprennent les mêmes mots : « Woher kommen Sie? » → « Ich komme aus... ». Réutilise la structure de la question dans ta réponse.</div>
<h3>3. Gagner du temps et relancer</h3>
<p>Quand on cherche ses mots, quelques formules aident à ne pas rester bloqué :</p>
<pre class="pseudo">Moment, bitte.              Un instant, s'il vous plaît.
Wie bitte?                  Pardon ? (répétez)
Können Sie das wiederholen? Pouvez-vous répéter ?
Was bedeutet ...?           Que signifie ... ?
Ich verstehe nicht ganz.   Je ne comprends pas tout à fait.</pre>
<div class="warn">Ne réponds jamais juste par « ja » ou « nein » dans un entretien. Développe : ajoute une raison (weil...), un exemple ou un détail. « Mögen Sie Ihre Arbeit? » → « Ja, sehr, weil ich gern mit Menschen arbeite. »</div>
<h3>4. Un mini-entretien modèle (das Vorstellungsgespräch)</h3>
<pre class="pseudo">Interviewer: Guten Tag! Können Sie sich bitte kurz vorstellen?
Kandidat: Guten Tag. Ich heiße Marco Rossi. Ich bin 30 Jahre alt und komme aus Italien.
Interviewer: Was sind Sie von Beruf?
Kandidat: Ich bin Koch. Ich habe fünf Jahre in einem Restaurant in Rom gearbeitet.
Interviewer: Warum möchten Sie in Deutschland arbeiten?
Kandidat: Weil ich neue Erfahrungen sammeln und mein Deutsch verbessern möchte.
Interviewer: Was sind Ihre Stärken?
Kandidat: Ich bin fleißig, pünktlich und arbeite gern im Team.
Interviewer: Vielen Dank! Wir melden uns bald.</pre>
<p>(der Koch = le cuisinier · Erfahrungen sammeln = acquérir de l'expérience · die Stärke = la force/qualité · fleißig = travailleur · pünktlich = ponctuel · sich melden = donner des nouvelles)</p>
<h3>5. Parler de ses qualités</h3>
<pre class="pseudo">fleißig      travailleur     pünktlich    ponctuel
freundlich   aimable         zuverlässig  fiable
motiviert    motivé          organisiert  organisé
Ich arbeite gern im Team.    J'aime travailler en équipe.
Ich lerne schnell.           J'apprends vite.</pre>`,
  exercises: [
    { type: "qcm", q: "Dans un entretien formel, on s'adresse à l'autre avec…", opts: ["du", "Sie", "ihr", "man"], a: 1, exp: "Entretien = vouvoiement (Sie)." },
    { type: "input", q: "Réponds à « Woher kommen Sie? » : « Ich komme ___ Frankreich. »", a: ["aus"], ph: "préposition", exp: "kommen aus + pays = venir de." },
    { type: "qcm", q: "« Was sind Sie von Beruf? » demande…", opts: ["votre âge", "votre métier", "votre nationalité", "vos loisirs"], a: 1, exp: "von Beruf = de profession." },
    { type: "input", q: "Complète : « Ich bin Krankenschwester von ___. » (de profession)", a: ["Beruf","beruf"], ph: "un mot", exp: "von Beruf = de métier." },
    { type: "qcm", q: "Comment demander poliment de répéter ?", opts: ["Wie geht's?", "Können Sie das wiederholen?", "Was kostet das?", "Wo ist der Bahnhof?"], a: 1, exp: "wiederholen = répéter." },
    { type: "qcm", q: "Que dit-on pour « Pardon ? / Vous avez dit ? »", opts: ["Bitte schön.", "Wie bitte?", "Gern.", "Tschüss."], a: 1, exp: "Wie bitte? = pardon ? (demande de répétition)." },
    { type: "vf", q: "Dans un entretien, il vaut mieux développer sa réponse plutôt que de dire juste « ja ».", a: true, exp: "Ajoute une raison (weil...) ou un exemple." },
    { type: "qcm", q: "« Warum lernen Sie Deutsch? » — quelle réponse est la plus complète ?", opts: ["Ja.", "Deutsch.", "Weil ich in der Schweiz arbeiten möchte.", "Nein, danke."], a: 2, exp: "On justifie avec weil + verbe à la fin." },
    { type: "input", q: "Complète (qualité) : « Ich bin ___ und komme nie zu spät. » (ponctuel)", a: ["pünktlich","puenktlich"], ph: "adjectif", exp: "pünktlich = ponctuel." },
    { type: "qcm", q: "Que signifie « fleißig » ?", opts: ["paresseux", "travailleur", "fatigué", "en retard"], a: 1, exp: "fleißig = travailleur, appliqué." },
    { type: "qcm", q: "« Ich arbeite gern im Team » signifie…", opts: ["Je préfère travailler seul", "J'aime travailler en équipe", "Je ne travaille pas", "Je dirige une équipe"], a: 1, exp: "im Team = en équipe." },
    { type: "qcm", q: "Comment se présenter brièvement quand on le demande ?", opts: ["Können Sie sich kurz vorstellen?", "Ich heiße... Ich bin... Jahre alt und komme aus...", "Was kostet das?", "Wie spät ist es?"], a: 1, exp: "On enchaîne nom, âge, origine, métier, loisirs." },
    { type: "qcm", q: "Compréhension (entretien de Marco) : quel est son métier ?", opts: ["Serveur", "Cuisinier (Koch)", "Infirmier", "Professeur"], a: 1, exp: "« Ich bin Koch. »" },
    { type: "qcm", q: "Compréhension : pourquoi Marco veut-il travailler en Allemagne ?", opts: ["Pour gagner plus", "Pour acquérir de l'expérience et améliorer son allemand", "Pour rejoindre sa famille", "Il ne le dit pas"], a: 1, exp: "« neue Erfahrungen sammeln und mein Deutsch verbessern »." },
    { type: "vf", q: "« Wir melden uns bald » signifie « nous vous recontacterons bientôt ».", a: true, exp: "sich melden = donner des nouvelles, recontacter." }
  ],
  final: {
    title: "Exercice final — Ton mini-entretien",
    intro: `<p>Voici un entretien à comprendre. Imagine ensuite tes propres réponses (à l'oral ou par écrit dans l'exercice d'écriture).</p>
<pre class="pseudo">Interviewerin: Guten Tag! Wie heißen Sie und woher kommen Sie?
Bewerberin: Guten Tag. Ich heiße Elena und komme aus Portugal.
Interviewerin: Was machen Sie beruflich?
Bewerberin: Ich bin Verkäuferin. Ich habe drei Jahre in einem Geschäft gearbeitet.
Interviewerin: Warum möchten Sie hier arbeiten?
Bewerberin: Weil ich die Stadt mag und gern mit Kunden spreche.
Interviewerin: Was sind Ihre Stärken?
Bewerberin: Ich bin freundlich, zuverlässig und lerne schnell.</pre>
<p>(die Bewerberin = la candidate · beruflich = professionnellement · die Verkäuferin = la vendeuse · der Kunde = le client)</p>`,
    questions: [
      { type: "qcm", q: "D'où vient Elena ?", opts: ["D'Espagne", "Du Portugal", "d'Italie", "de France"], a: 1, exp: "« komme aus Portugal »." },
      { type: "qcm", q: "Quel est son métier ?", opts: ["Cuisinière", "Vendeuse", "Infirmière", "Professeure"], a: 1, exp: "« Ich bin Verkäuferin. »" },
      { type: "input", q: "Combien d'années d'expérience a-t-elle ? (le nombre)", a: ["drei","3"], ph: "nombre", exp: "« drei Jahre in einem Geschäft gearbeitet »." },
      { type: "qcm", q: "Pourquoi veut-elle ce poste ?", opts: ["Pour le salaire", "Parce qu'elle aime la ville et parler avec les clients", "Pour changer de pays", "Elle ne le dit pas"], a: 1, exp: "« weil ich die Stadt mag und gern mit Kunden spreche »." },
      { type: "vf", q: "Elena cite comme qualités : aimable, fiable et apprend vite.", a: true, exp: "« freundlich, zuverlässig und lerne schnell »." }
    ],
    solution: `<p>Félicitations : tu as terminé les 30 jours du niveau A2 ! Cet entretien mobilise tout : se présenter (Ich heiße..., komme aus...), parler de son métier et de son expérience au Perfekt (habe gearbeitet), justifier avec weil (verbe à la fin), et décrire ses qualités (freundlich, zuverlässig).</p>
<p>Prépare TON mini-entretien : nom, origine, métier, motivation (avec weil) et deux ou trois qualités. Entraîne-toi à voix haute — c'est la meilleure façon de gagner en aisance. Viel Erfolg für dein Deutsch! (Bonne réussite pour ton allemand !)</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ta réponse en allemand…",
  items: [
  { id: "de-a2-j30", title: "Prépare ton mini-entretien", level: 2,
    statement: "Rédige tes réponses à un mini-entretien (7 à 8 phrases) : présente-toi (nom, âge, origine, métier ou études), explique pourquoi tu apprends l'allemand (avec weil), et cite deux ou trois qualités.",
    hints: [
      "Enchaîne : Ich heiße... / Ich bin... Jahre alt / Ich komme aus... / Ich bin ... von Beruf.",
      "Justifie avec « weil » (verbe à la fin) : Ich lerne Deutsch, weil...",
      "Décris tes qualités : fleißig, pünktlich, freundlich, zuverlässig, motiviert."
    ],
    solution: "Guten Tag! Ich heiße Amina und ich bin 26 Jahre alt. Ich komme aus Marokko, aber ich wohne seit zwei Jahren in Brüssel. Ich bin Buchhalterin von Beruf und arbeite in einem kleinen Büro. In meiner Freizeit koche ich gern und treffe Freunde. Ich lerne Deutsch, weil ich später in Deutschland arbeiten möchte. Ich bin fleißig, pünktlich und arbeite gern im Team. Ich lerne auch sehr schnell.\n\n(Traduction : Bonjour ! Je m'appelle Amina et j'ai 26 ans. Je viens du Maroc, mais j'habite à Bruxelles depuis deux ans. Je suis comptable de profession et je travaille dans un petit bureau. Pendant mon temps libre, j'aime cuisiner et voir des amis. J'apprends l'allemand parce que je voudrais plus tard travailler en Allemagne. Je suis travailleuse, ponctuelle et j'aime travailler en équipe. J'apprends aussi très vite.)",
    note: "C'est ton grand oral du A2 : structure claire (présentation → motivation → qualités), justification avec weil (verbe à la fin : weil ich ... arbeiten möchte) et vocabulaire des qualités. Entraîne-toi à le dire à voix haute !" }
  ]
};
</script>
