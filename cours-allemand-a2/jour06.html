<h3>1. Le comparatif de supériorité : -er + als</h3>
<p>Pour dire que quelque chose est « plus … que », l'allemand ajoute simplement <strong>-er</strong> à l'adjectif et utilise <strong>als</strong> (que). Contrairement au français, il n'y a pas de mot « plus » : tout est dans la terminaison -er.</p>
<pre class="pseudo">klein  → kleiner   (plus petit)
schnell→ schneller (plus rapide)
Anna ist  kleiner  als  Tom.       // Anna est plus petite que Tom
Das Auto ist schneller als das Fahrrad.  // La voiture est plus rapide que le vélo</pre>
<h3>2. L'Umlaut sur les adjectifs courts</h3>
<p>Beaucoup d'adjectifs courants prennent un <strong>Umlaut</strong> (a→ä, o→ö, u→ü) au comparatif. À mémoriser.</p>
<pre class="pseudo">alt   → älter    (plus vieux)
groß  → größer   (plus grand)
jung  → jünger   (plus jeune)
lang  → länger   (plus long)
kalt  → kälter   (plus froid)
warm  → wärmer   (plus chaud)</pre>
<h3>3. L'égalité : so … wie</h3>
<p>Pour dire « aussi … que », on utilise <strong>so … wie</strong> (sans terminaison sur l'adjectif).</p>
<pre class="pseudo">Tom ist  so groß wie  Max.        // Tom est aussi grand que Max
Heute ist es  so kalt wie  gestern.  // Aujourd'hui il fait aussi froid qu'hier</pre>
<h3>4. Les irréguliers à connaître</h3>
<pre class="pseudo">gut   → besser   (meilleur / mieux)
viel  → mehr     (plus, davantage)
gern  → lieber   (préférer : je préfère)
hoch  → höher    (plus haut)
nah   → näher    (plus proche)</pre>
<div class="warn">Piège : on utilise <strong>als</strong> pour l'inégalité (kleiner als) et <strong>wie</strong> pour l'égalité (so groß wie). Ne pas confondre ! « kleiner wie » est une faute fréquente.</div>
<div class="tip">Réflexe A2 : « plus … que » = adjectif+<strong>er</strong> … <strong>als</strong>. « aussi … que » = <strong>so</strong> … <strong>wie</strong>. Et n'oublie pas l'Umlaut sur alt, groß, jung, lang, kalt, warm.</div>`,

    ],
    solution: `<p>Récapitulatif des comparatifs du texte :</p>
<pre class="pseudo">groß   → größer als   (Umlaut)
schnell→ schneller als
jung   → jünger als   (Umlaut)
kalt   → kälter als   (Umlaut)
gern   → lieber als   (irrégulier)</pre>
<p>Deux automatismes : adjectif + <strong>-er</strong> + <strong>als</strong> pour « plus … que », et Umlaut sur les adjectifs courts (alt, groß, jung, lang, kalt, warm). Retiens aussi les irréguliers gut → besser, viel → mehr, gern → lieber.</p>`
  }
