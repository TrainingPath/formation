<script>
var DAY = {

  title: "Le parfait : participes irréguliers",
  subtitle: "Les verbes forts en ge-…-en, à mémoriser.",
  theory: `
<h3>1. Verbes forts, participe en -en</h3>
<p>Beaucoup de verbes très courants sont <strong>irréguliers</strong> (aussi appelés <strong>forts</strong>, starke Verben). Leur participe passé (Partizip II) se termine par <strong>-en</strong> (et non -t), et souvent la <strong>voyelle du radical change</strong>. On les apprend par cœur, comme les verbes irréguliers anglais.</p>
<pre class="pseudo">Infinitif    Participe        Sens
sehen        gesehen          vu
essen        gegessen         mangé
trinken      getrunken        bu
sprechen     gesprochen       parlé
lesen        gelesen          lu
schreiben    geschrieben      écrit
nehmen       genommen         pris
finden       gefunden         trouvé</pre>
<h3>2. La structure reste la même</h3>
<p>Comme pour les verbes réguliers : <strong>auxiliaire en 2e position + participe à la fin</strong>. Seule la forme du participe change.</p>
<pre class="pseudo">Ich  habe  einen Film  gesehen.      // J'ai vu un film
Wir  haben  Pizza      gegessen.     // Nous avons mangé une pizza</pre>
<h3>3. Verbes à préfixe : même logique qu'au jour 1</h3>
<p>Un verbe fort à préfixe <strong>séparable</strong> intercale -ge- ; à préfixe <strong>inséparable</strong>, il n'a pas de ge-.</p>
<pre class="pseudo">fernsehen (séparable)   → ferngesehen     // regardé la télé
ankommen (séparable)    → angekommen      // arrivé
verstehen (inséparable) → verstanden      // compris
bekommen (inséparable)  → bekommen        // reçu (identique !)</pre>
<div class="warn">La voyelle change de façon imprévisible : trinken → getr<strong>u</strong>nken, sprechen → gespr<strong>o</strong>chen, nehmen → gen<strong>o</strong>mmen. Il n'y a pas de règle sûre : c'est de la mémoire.</div>
<div class="tip">Bonne nouvelle : ce sont presque toujours les mêmes 50 verbes. En les révisant un peu chaque jour, tu les auras vite en réflexe. Garde une petite liste !</div>`,
  exercises: [
    { type: "input", q: "sehen → participe passé : ___ (Ich habe einen Film ___.)", a: ["gesehen"], ph: "ge…en", exp: "Verbe fort : gesehen (vu)." },
    { type: "input", q: "essen → participe passé : ___", a: ["gegessen"], ph: "ge…en", exp: "essen → gegessen (mangé), double g." },
    { type: "input", q: "trinken → participe passé : ___", a: ["getrunken"], ph: "ge…en", exp: "La voyelle change : i → u, getrunken (bu)." },
    { type: "input", q: "sprechen → participe passé : ___", a: ["gesprochen"], ph: "ge…en", exp: "e → o : gesprochen (parlé)." },
    { type: "input", q: "schreiben → participe passé : ___", a: ["geschrieben"], ph: "ge…en", exp: "schreiben → geschrieben (écrit)." },
    { type: "input", q: "nehmen → participe passé : ___", a: ["genommen"], ph: "ge…en", exp: "nehmen → genommen (pris), forme très irrégulière." },
    { type: "qcm", q: "Le participe des verbes forts se termine par…", opts: ["-t", "-et", "-en", "-st"], a: 2, exp: "Les verbes forts font leur participe en -en." },
    { type: "qcm", q: "Quel est le participe de <code>lesen</code> (lire) ?", opts: ["gelest", "gelesen", "geliest", "lesen"], a: 1, exp: "Verbe fort : gelesen (lu)." },
    { type: "qcm", q: "Quel est le participe de <code>finden</code> (trouver) ?", opts: ["gefindet", "gefunden", "gefindt", "gefinden"], a: 1, exp: "i → u : gefunden (trouvé)." },
    { type: "qcm", q: "Participe de <code>verstehen</code> (comprendre) ?", opts: ["geverstanden", "verstanden", "gestehen", "versteht"], a: 1, exp: "Préfixe inséparable ver- : verstanden, sans ge-." },
    { type: "qcm", q: "Participe de <code>fernsehen</code> (regarder la télé) ?", opts: ["gefernsehen", "ferngesehen", "fernsehte", "gesehen fern"], a: 1, exp: "Séparable : fern + ge + sehen = ferngesehen." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Ich habe gesprochen mit Anna.", "Ich habe mit Anna gesprochen.", "Ich gesprochen habe mit Anna.", "Ich mit Anna habe gesprochen."], a: 1, exp: "Auxiliaire en 2, participe gesprochen à la fin." },
    { type: "vf", q: "Le participe des verbes forts se termine généralement par -en, pas par -t.", a: true, exp: "Vrai : gesehen, gegessen, getrunken…" },
    { type: "vf", q: "Le participe de trinken est getrinkt.", a: false, exp: "Faux : c'est getrunken (la voyelle change en u)." },
    { type: "vf", q: "bekommen (recevoir) a un participe identique à l'infinitif : bekommen.", a: true, exp: "Vrai : préfixe inséparable be-, pas de ge-, donc bekommen." }
  ],
  final: {
    title: "Exercice final — Ein Abend zu Hause",
    intro: `<p>Voici un petit récit au Perfekt avec des verbes forts :</p>
<pre class="pseudo">Am Abend habe ich ein Buch gelesen. Dann habe ich Wasser getrunken
und einen Apfel gegessen. Später habe ich mit meiner Mutter
gesprochen. Wir haben zusammen ferngesehen und einen Film gesehen.</pre>
<p>(Traduction : Le soir j'ai lu un livre. Puis j'ai bu de l'eau et mangé une pomme. Plus tard j'ai parlé avec ma mère. Nous avons regardé la télé ensemble et vu un film.)</p>`,
    questions: [
      { type: "input", q: "Quel est le participe de trinken dans le texte ? ___", a: ["getrunken"], ph: "participe", exp: "getrunken (bu)." },
      { type: "input", q: "« ein Buch ___ » : participe de lesen ?", a: ["gelesen"], ph: "participe", exp: "gelesen (lu)." },
      { type: "qcm", q: "ferngesehen est le participe de quel verbe ?", opts: ["sehen", "fernsehen", "fernen", "gesehen"], a: 1, exp: "Séparable : fernsehen → ferngesehen (regardé la télé)." },
      { type: "vf", q: "Tous les verbes du texte utilisent l'auxiliaire haben.", a: true, exp: "Vrai : habe / haben partout ici." },
      { type: "qcm", q: "« Ich habe einen Apfel gegessen » signifie…", opts: ["Je mange une pomme", "J'ai mangé une pomme", "Je mangerai une pomme", "Je veux une pomme"], a: 1, exp: "Perfekt = passé : j'ai mangé (habe … gegessen)." }
    ],
    solution: `<p>Les participes forts du texte :</p>
<pre class="pseudo">lesen     → gelesen
trinken   → getrunken
essen     → gegessen
sprechen  → gesprochen
fernsehen → ferngesehen  (séparable)
sehen     → gesehen</pre>
<p>Retiens la mécanique : auxiliaire haben en 2e position, participe en -en à la fin. La difficulté n'est pas la structure (identique au jour 1) mais la <strong>mémorisation</strong> de la forme du participe.</p>`
  }
};
</script>
