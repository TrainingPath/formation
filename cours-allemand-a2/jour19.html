<script>
var DAY = {
  num: 19,
  title: "Décrire une ville et des lieux",
  subtitle: "Nommer les bâtiments, situer un lieu, dire ce qu'il y a dans une ville.",
  theory: `
<h3>1. Les lieux de la ville (die Stadt)</h3>
<pre class="pseudo">der Bahnhof       la gare          die Post          la poste
das Rathaus       la mairie        die Kirche        l'église
das Museum        le musée         der Park          le parc
die Apotheke      la pharmacie     die Bank          la banque
der Markt         le marché        das Krankenhaus   l'hôpital
die Bibliothek    la bibliothèque  das Schwimmbad    la piscine</pre>
<p>Pour dire ce qu'une ville contient, on emploie <strong>es gibt</strong> (il y a) suivi de l'accusatif : « In meiner Stadt gibt es einen Park und ein Museum. » = Dans ma ville, il y a un parc et un musée.</p>
<div class="tip"><strong>es gibt</strong> est toujours suivi de l'accusatif. « Es gibt <strong>einen</strong> Bahnhof » (der Bahnhof → einen). C'est une tournure incontournable pour décrire un lieu.</div>
<h3>2. Situer : les prépositions de lieu</h3>
<p>Pour situer un bâtiment par rapport à un autre, on utilise des prépositions suivies du <strong>datif</strong> :</p>
<pre class="pseudo">neben        à côté de       gegenüber     en face de
hinter       derrière        vor           devant
zwischen     entre           in der Nähe von   près de
an ... vorbei   le long de   um die Ecke   au coin de la rue</pre>
<pre class="pseudo">Die Apotheke ist neben der Bank.        La pharmacie est à côté de la banque.
Das Museum liegt gegenüber dem Park.    Le musée est en face du parc.
Der Markt ist zwischen der Kirche und dem Rathaus.</pre>
<div class="warn">Après ces prépositions de position (sans mouvement), on utilise le <strong>datif</strong> : neben <strong>der</strong> Bank (die Bank → der), gegenüber <strong>dem</strong> Park (der Park → dem). C'est le sens « où ? » (statique), pas « vers où ? ».</div>
<h3>3. Décrire l'ambiance d'une ville</h3>
<p>On qualifie une ville avec des adjectifs : <code>groß</code> (grande), <code>klein</code> (petite), <code>modern</code>, <code>alt</code> (ancienne), <code>ruhig</code> (calme), <code>laut</code> (bruyante), <code>schön</code> (belle), <code>lebendig</code> (vivante).</p>
<pre class="pseudo">Berlin ist eine große, moderne Stadt.   Berlin est une grande ville moderne.
Mein Dorf ist klein und ruhig.          Mon village est petit et calme.</pre>
<h3>4. Aller quelque part : zu / in</h3>
<p>Pour indiquer une direction (mouvement vers un lieu), attention à la préposition :</p>
<pre class="pseudo">Ich gehe zum Bahnhof.       Je vais à la gare.   (zu + dem = zum)
Ich gehe zur Post.          Je vais à la poste.  (zu + der = zur)
Ich gehe ins Kino.          Je vais au cinéma.   (in + das = ins)
Ich gehe in die Stadt.      Je vais en ville.</pre>
<p>Retiens les contractions fréquentes : <strong>zu + dem = zum</strong>, <strong>zu + der = zur</strong>, <strong>in + das = ins</strong>.</p>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « la mairie » ?", opts: ["das Rathaus", "die Kirche", "der Bahnhof", "die Post"], a: 0, exp: "das Rathaus = la mairie (littéralement « maison du conseil »)." },
    { type: "qcm", q: "Quelle tournure signifie « il y a » ?", opts: ["es ist", "es gibt", "es hat", "da sind"], a: 1, exp: "es gibt + accusatif = il y a." },
    { type: "input", q: "Complète : « In meiner Stadt gibt ___ einen Park. » (il y a)", a: ["es"], ph: "un mot", exp: "es gibt = il y a." },
    { type: "vf", q: "« es gibt » est toujours suivi de l'accusatif.", a: true, exp: "Es gibt einen Bahnhof (der → einen)." },
    { type: "input", q: "Complète (accusatif) : « Es gibt ___ Museum in der Stadt. » (das Museum)", a: ["ein"], ph: "article indéfini", exp: "das Museum est neutre : ein Museum (inchangé à l'accusatif)." },
    { type: "qcm", q: "Que signifie « gegenüber » ?", opts: ["à côté de", "en face de", "derrière", "entre"], a: 1, exp: "gegenüber = en face de ; neben = à côté de." },
    { type: "qcm", q: "Quel cas suit les prépositions de position (neben, gegenüber, vor…) ?", opts: ["le nominatif", "l'accusatif", "le datif", "le génitif"], a: 2, exp: "Position statique (où ?) → datif." },
    { type: "input", q: "Complète (datif) : « Die Apotheke ist neben ___ Bank. » (die Bank)", a: ["der"], ph: "article défini datif", exp: "die Bank → der Bank au datif." },
    { type: "qcm", q: "Que veut dire « zwischen der Kirche und dem Rathaus » ?", opts: ["derrière l'église et la mairie", "entre l'église et la mairie", "en face de l'église", "à côté de la mairie"], a: 1, exp: "zwischen = entre." },
    { type: "input", q: "Contracte : « Ich gehe ___ Bahnhof. » (zu + dem)", a: ["zum"], ph: "contraction", exp: "zu + dem = zum." },
    { type: "input", q: "Contracte : « Ich gehe ___ Post. » (zu + der)", a: ["zur"], ph: "contraction", exp: "zu + der = zur." },
    { type: "qcm", q: "« Ich gehe ins Kino » : « ins » est la contraction de…", opts: ["in + dem", "in + das", "in + der", "zu + das"], a: 1, exp: "in + das = ins (mouvement, accusatif)." },
    { type: "qcm", q: "Compréhension : « Meine Stadt ist klein, aber sehr schön und ruhig. » Comment est la ville ?", opts: ["Grande et bruyante", "Petite, belle et calme", "Moderne et grande", "Ancienne et laide"], a: 1, exp: "klein = petite, schön = belle, ruhig = calme." },
    { type: "qcm", q: "Compréhension : « Das Museum liegt in der Nähe vom Bahnhof. » Où est le musée ?", opts: ["Loin de la gare", "Près de la gare", "Dans la gare", "En face de l'hôpital"], a: 1, exp: "in der Nähe von = près de." },
    { type: "vf", q: "« der Park » devient « dem Park » après une préposition de datif comme gegenüber.", a: true, exp: "gegenüber dem Park = en face du parc." }
  ],
  final: {
    title: "Exercice final — Meine Stadt (ma ville)",
    intro: `<p>Lis cette présentation d'une ville puis réponds.</p>
<pre class="pseudo">Ich wohne in Freiburg, einer schönen Stadt im Süden.
Es gibt einen großen Markt auf dem Rathausplatz.
Neben dem Rathaus steht eine alte Kirche.
Das Museum liegt gegenüber dem Park.
Die Stadt ist nicht sehr groß, aber sehr lebendig.
Am Wochenende gehe ich gern ins Kino oder in den Park.</pre>
<p>(im Süden = dans le sud · der Platz = la place · lebendig = vivante)</p>`,
    questions: [
      { type: "input", q: "Dans quelle ville habite la personne ?", a: ["Freiburg","freiburg"], ph: "ville", exp: "« Ich wohne in Freiburg »." },
      { type: "qcm", q: "Que trouve-t-on sur la place de la mairie ?", opts: ["Un musée", "Un grand marché", "Une piscine", "Une gare"], a: 1, exp: "« einen großen Markt auf dem Rathausplatz »." },
      { type: "qcm", q: "Où se trouve l'église ?", opts: ["En face du parc", "À côté de la mairie", "Derrière le musée", "Dans le parc"], a: 1, exp: "« Neben dem Rathaus steht eine alte Kirche »." },
      { type: "qcm", q: "Où est situé le musée ?", opts: ["En face du parc", "À côté de la gare", "Près du marché", "Derrière l'église"], a: 0, exp: "« Das Museum liegt gegenüber dem Park »." },
      { type: "vf", q: "La ville est grande mais peu animée.", a: false, exp: "« nicht sehr groß, aber sehr lebendig » = pas très grande, mais très vivante. FAUX." }
    ],
    solution: `<p>La personne habite à Fribourg (Freiburg), une belle ville du sud. Il y a un grand marché (einen großen Markt) sur la place de la mairie ; à côté de la mairie (neben dem Rathaus) se trouve une vieille église ; le musée est en face du parc (gegenüber dem Park). La ville n'est pas très grande mais très vivante (lebendig).</p>
<p>Retiens la structure : <strong>es gibt</strong> + accusatif pour énumérer, et les prépositions de position + <strong>datif</strong> pour situer.</p>`
  }
};
</script>
