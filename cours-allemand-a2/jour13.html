  theory: `
<h3>1. Qu'est-ce qu'une subordonnée ?</h3>
<p>Une <strong>subordonnée</strong> (der Nebensatz) est une phrase « secondaire » introduite par une conjonction (weil, dass, wenn…). Elle ne peut pas vivre seule : elle complète une phrase principale (der Hauptsatz). En allemand, la subordonnée obéit à une règle spectaculaire.</p>
<h3>2. LA règle : verbe conjugué à la fin</h3>
<p>Dans une subordonnée, le <strong>verbe conjugué</strong> se place tout à la <strong>fin</strong>. C'est différent de la principale (verbe en 2e position). Une virgule sépare toujours les deux parties.</p>
<pre class="pseudo">Principale (verbe en 2) :  Ich bleibe zu Hause.
Subordonnée (verbe à la fin) : …, weil ich müde bin.
Ich bleibe zu Hause,  weil ich müde  bin.    // Je reste à la maison parce que je suis fatigué
                                     (verbe à la fin)</pre>
<h3>3. weil = parce que (la cause)</h3>
<pre class="pseudo">Ich lerne Deutsch,  weil ich in Berlin  wohne.
// J'apprends l'allemand parce que j'habite à Berlin
Er kommt nicht,  weil er krank  ist.
// Il ne vient pas parce qu'il est malade</pre>
<h3>4. dass = que (introduit une complétive)</h3>
<pre class="pseudo">Ich weiß,  dass du recht  hast.
// Je sais que tu as raison
Sie sagt,  dass sie morgen  kommt.
// Elle dit qu'elle vient demain</pre>
<h3>5. Verbes composés dans la subordonnée</h3>
<p>Au Perfekt, l'auxiliaire (verbe conjugué) va à la toute fin, <strong>après</strong> le participe.</p>
<pre class="pseudo">Ich glaube,  dass er nach Hause gegangen  ist.
// Je crois qu'il est rentré à la maison  (participe + auxiliaire à la fin)</pre>
<div class="warn">Ne confonds pas <strong>weil</strong> (subordonnée, verbe à la fin) et <strong>denn</strong> (= car, coordination, verbe en 2e position) : « …, denn ich bin müde » vs « …, weil ich müde bin ». Même sens, structure différente !</div>
<div class="tip">Repère visuel : après une virgule + weil/dass, l'oreille attend le verbe tout au bout de la phrase. « weil ich müde BIN », « dass sie morgen KOMMT ».</div>`,

    ],
    solution: `<p>Structure de chaque subordonnée :</p>
<pre class="pseudo">weil ich in Wien studieren möchte    → verbe möchte à la fin
dass Deutsch nützlich … ist          → verbe ist à la fin
weil meine Großmutter … kommt        → verbe kommt à la fin
dass Deutsch schwer ist              → verbe ist à la fin</pre>
<p>Une seule règle à ne jamais oublier : après <strong>weil</strong> (cause) ou <strong>dass</strong> (que), une virgule, puis le verbe conjugué file à la <strong>fin</strong>. C'est ce qui distingue l'allemand de presque toutes les autres langues.</p>`
