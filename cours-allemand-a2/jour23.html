<script>
var DAY = {
  num: 23,
  title: "Les connecteurs : und, aber, denn, deshalb",
  subtitle: "Relier deux phrases sans changer l'ordre des mots — ou en l'inversant.",
  theory: `
<h3>1. Trois familles de connecteurs</h3>
<p>Relier deux idées en allemand demande d'abord de savoir ce que le connecteur fait à l'<strong>ordre des mots</strong>. Il existe trois familles, et c'est CELA qu'il faut retenir, plus que le sens :</p>
<pre class="pseudo">Famille 1 — coordonnants « position zéro » : und, oder, aber, denn, sondern
            → ne comptent pas, l'ordre reste normal (sujet + verbe)
Famille 2 — adverbes-connecteurs : deshalb, deswegen, trotzdem, dann
            → comptent comme 1re position → INVERSION (verbe puis sujet)
Famille 3 — subordonnants : weil, dass, wenn, obwohl
            → rejettent le verbe conjugué À LA FIN de la phrase</pre>
<h3>2. Famille 1 : und, aber, denn (aucun changement)</h3>
<p>Ces mots relient deux phrases complètes sans toucher à l'ordre. Le verbe reste en 2e position dans les deux morceaux :</p>
<pre class="pseudo">und     et            Ich lese und ich höre Musik.
oder    ou            Kommst du, oder bleibst du?
aber    mais          Ich bin müde, aber ich arbeite.
denn    car / parce que   Ich bleibe zu Hause, denn ich bin krank.
sondern mais (au contraire)  Nicht heute, sondern morgen.</pre>
<p>Regarde <strong>denn</strong> : « Ich bleibe zu Hause, denn ich <strong>bin</strong> krank » — après denn, on a sujet (ich) + verbe (bin), ordre tout à fait normal.</p>
<div class="tip"><strong>denn</strong> se traduit par « car / parce que » mais se construit très simplement : c'est un coordonnant, l'ordre ne bouge pas. Après la virgule : sujet, puis verbe.</div>
<h3>3. Le duel important : denn vs weil</h3>
<p>Les deux veulent dire « parce que », mais ils se construisent de façon OPPOSÉE. C'est le point le plus important du jour :</p>
<pre class="pseudo">DENN (coordonnant)  → ordre normal, verbe en 2e position
Ich bleibe zu Hause, denn ich BIN krank.
                          [sujet] [verbe]

WEIL (subordonnant) → verbe conjugué REJETÉ à la fin
Ich bleibe zu Hause, weil ich krank BIN.
                          [sujet] .... [verbe]</pre>
<div class="warn">Même sens, construction inverse ! Avec <strong>denn</strong>, le verbe reste juste après le sujet ; avec <strong>weil</strong>, le verbe file tout à la fin. Ne mélange jamais : « weil ich bin krank » est FAUX, « denn ich krank bin » est FAUX.</div>
<h3>4. Famille 2 : deshalb (la conséquence avec inversion)</h3>
<p><strong>deshalb</strong> (c'est pourquoi, donc) exprime la conséquence. Ce n'est PAS un petit mot « invisible » : il occupe la 1re position, donc il provoque l'<strong>inversion</strong> (verbe avant le sujet) :</p>
<pre class="pseudo">Ich bin krank. Deshalb BLEIBE ich zu Hause.
                        [verbe] [sujet]
Je suis malade. C'est pourquoi je reste à la maison.</pre>
<p>Compare les trois façons de dire la même idée « malade → reste à la maison » :</p>
<pre class="pseudo">Ich bleibe zu Hause, denn ich bin krank.     (denn : ordre normal)
Ich bleibe zu Hause, weil ich krank bin.     (weil : verbe à la fin)
Ich bin krank. Deshalb bleibe ich zu Hause.  (deshalb : inversion)</pre>
<div class="warn">Erreur fréquente : « Deshalb ich bleibe... » est FAUX. Après deshalb, le verbe passe AVANT le sujet : « Deshalb <strong>bleibe ich</strong>... ».</div>
<h3>5. Récapitulatif express</h3>
<pre class="pseudo">Connecteur   Sens              Ordre des mots après lui
und/oder/aber  et/ou/mais      normal (sujet + verbe)
denn           car             normal (sujet + verbe)
deshalb        c'est pourquoi  INVERSION (verbe + sujet)
weil           parce que       verbe conjugué À LA FIN</pre>`,
  exercises: [
    { type: "qcm", q: "Après « denn », quel est l'ordre des mots ?", opts: ["verbe à la fin", "sujet + verbe (ordre normal)", "inversion (verbe + sujet)", "aucun verbe"], a: 1, exp: "denn est un coordonnant : l'ordre ne change pas." },
    { type: "qcm", q: "Après « weil », où va le verbe conjugué ?", opts: ["en 2e position", "à la fin de la subordonnée", "juste après weil", "il disparaît"], a: 1, exp: "weil est subordonnant : le verbe conjugué part à la fin." },
    { type: "qcm", q: "Après « deshalb », qu'arrive-t-il à l'ordre des mots ?", opts: ["rien, ordre normal", "inversion : verbe avant le sujet", "verbe à la fin", "on répète le sujet"], a: 1, exp: "deshalb occupe la 1re position → inversion." },
    { type: "vf", q: "« denn » et « weil » ont le même sens (parce que) mais une construction opposée.", a: true, exp: "denn : ordre normal ; weil : verbe à la fin." },
    { type: "qcm", q: "Quelle phrase est CORRECTE ?", opts: ["Ich bleibe zu Hause, weil ich bin krank.", "Ich bleibe zu Hause, weil ich krank bin.", "Ich bleibe zu Hause, weil krank ich bin.", "Ich bleibe zu Hause, weil bin ich krank."], a: 1, exp: "weil → verbe (bin) à la fin : weil ich krank bin." },
    { type: "qcm", q: "Quelle phrase est CORRECTE ?", opts: ["Ich bleibe zu Hause, denn ich krank bin.", "Ich bleibe zu Hause, denn krank ich bin.", "Ich bleibe zu Hause, denn ich bin krank.", "Ich bleibe zu Hause, denn bin ich krank."], a: 2, exp: "denn → ordre normal : denn ich bin krank." },
    { type: "input", q: "Complète avec le verbe au bon endroit (weil) : « Ich lerne Deutsch, weil ich in Berlin ___. » (wohnen)", a: ["wohne"], ph: "verbe à la fin", exp: "weil → verbe à la fin : weil ich in Berlin wohne." },
    { type: "qcm", q: "Complète l'inversion : « Es regnet. Deshalb ___ ich zu Hause. »", opts: ["ich bleibe", "bleibe ich", "bleiben ich", "ich bleiben"], a: 1, exp: "deshalb → inversion : bleibe ich." },
    { type: "qcm", q: "Que signifie « sondern » ?", opts: ["et", "car", "mais (au contraire, après une négation)", "c'est pourquoi"], a: 2, exp: "sondern = mais au contraire : Nicht heute, sondern morgen." },
    { type: "input", q: "Relie avec « denn » (car) : « Ich esse einen Apfel, ___ ich habe Hunger. »", a: ["denn"], ph: "connecteur", exp: "denn = car, ordre normal après." },
    { type: "qcm", q: "« Ich bin müde, aber ich arbeite. » Que fait « aber » à l'ordre des mots ?", opts: ["rien, ordre normal", "inversion", "verbe à la fin", "il supprime le sujet"], a: 0, exp: "aber est coordonnant : ordre normal." },
    { type: "qcm", q: "Transforme en weil : « Ich bleibe im Bett, denn ich bin müde. » →", opts: ["..., weil ich bin müde.", "..., weil ich müde bin.", "..., weil müde ich bin.", "..., weil bin ich müde."], a: 1, exp: "denn ich bin müde → weil ich müde bin (verbe à la fin)." },
    { type: "qcm", q: "Compréhension : « Ich gehe nicht ins Kino, weil ich kein Geld habe. » Pourquoi ne va-t-elle pas au cinéma ?", opts: ["Elle est malade", "Elle n'a pas d'argent", "Elle est fatiguée", "Il pleut"], a: 1, exp: "weil ich kein Geld habe = parce que je n'ai pas d'argent." },
    { type: "qcm", q: "Compréhension : « Das Wetter ist schön. Deshalb gehen wir spazieren. » Quel est le lien ?", opts: ["opposition", "cause exprimée avant, conséquence après (donc on se promène)", "condition", "choix"], a: 1, exp: "deshalb = c'est pourquoi : beau temps → on se promène." },
    { type: "vf", q: "« Deshalb ich gehe nach Hause » est correct.", a: false, exp: "FAUX : après deshalb il faut l'inversion → « Deshalb gehe ich nach Hause »." }
  ],
  final: {
    title: "Exercice final — Relier des idées",
    intro: `<p>Voici des paires d'idées à relier. Rappelle-toi les trois comportements :</p>
<pre class="pseudo">denn     → ordre normal        (..., denn ich bin krank)
weil     → verbe à la fin      (..., weil ich krank bin)
deshalb  → inversion           (Deshalb bleibe ich zu Hause)
Idée A : Ich lerne Deutsch.   Idée B : Ich möchte in Deutschland arbeiten.</pre>`,
    questions: [
      { type: "qcm", q: "Avec « weil » : « Ich lerne Deutsch, weil ich in Deutschland ... »", opts: ["arbeiten möchte", "möchte arbeiten", "möchte ich arbeiten", "arbeite möchten"], a: 0, exp: "weil → verbe conjugué (möchte) tout à la fin : ... arbeiten möchte." },
      { type: "qcm", q: "Avec « denn » : « Ich lerne Deutsch, denn ich ... in Deutschland arbeiten.", opts: ["möchte", "arbeiten möchte", "möchte ich", "möchten"], a: 0, exp: "denn → ordre normal : denn ich möchte ..." },
      { type: "qcm", q: "Avec « deshalb » : « Ich möchte in Deutschland arbeiten. Deshalb ... ich Deutsch.", opts: ["lerne", "ich lerne", "lernen", "gelernt"], a: 0, exp: "deshalb → inversion : Deshalb lerne ich Deutsch." },
      { type: "vf", q: "« Ich lerne Deutsch, weil ich möchte in Deutschland arbeiten » est correct.", a: false, exp: "FAUX : avec weil le verbe conjugué (möchte) doit aller à la fin : ... arbeiten möchte." },
      { type: "qcm", q: "Laquelle est FAUSSE ?", opts: ["Ich lerne Deutsch, denn ich möchte dort arbeiten.", "Ich möchte dort arbeiten. Deshalb lerne ich Deutsch.", "Ich lerne Deutsch, weil ich dort arbeiten möchte.", "Deshalb ich lerne Deutsch."], a: 3, exp: "« Deshalb ich lerne » est faux : deshalb impose l'inversion (Deshalb lerne ich)." }
    ],
    solution: `<p>Les trois versions correctes de « j'apprends l'allemand car je veux travailler en Allemagne » :</p>
<pre class="pseudo">Ich lerne Deutsch, denn ich möchte in Deutschland arbeiten.   (denn : ordre normal)
Ich lerne Deutsch, weil ich in Deutschland arbeiten möchte.   (weil : verbe möchte à la fin)
Ich möchte in Deutschland arbeiten. Deshalb lerne ich Deutsch. (deshalb : inversion lerne ich)</pre>
<p>Le sens est identique ; seule la <strong>place du verbe</strong> change. Maîtriser ces trois comportements est l'une des clés de la phrase allemande.</p>`
  }
};
</script>
