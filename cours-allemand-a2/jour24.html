<script>
var DAY = {
  num: 24,
  title: "Les verbes avec préposition",
  subtitle: "warten auf, sich freuen über… : ces verbes qui imposent leur préposition et leur cas.",
  theory: `
<h3>1. Le principe</h3>
<p>Beaucoup de verbes allemands se construisent avec une <strong>préposition fixe</strong>, souvent différente du français. « Attendre quelqu'un » ne se dit pas avec un simple accusatif : c'est <strong>warten auf</strong> + accusatif. Il faut apprendre le verbe AVEC sa préposition, comme un bloc.</p>
<pre class="pseudo">warten auf + Akk.        attendre           Ich warte auf den Bus.
denken an + Akk.         penser à           Ich denke an dich.
sich freuen auf + Akk.   se réjouir de (à venir)   Ich freue mich auf die Ferien.
sich interessieren für   s'intéresser à     Er interessiert sich für Sport.
sprechen über + Akk.     parler de          Wir sprechen über das Wetter.</pre>
<div class="warn">La préposition n'est PAS traduisible mot à mot. « warten auf » = attendre (auf ne veut pas dire « sur » ici). On mémorise le couple verbe+préposition d'un seul tenant.</div>
<h3>2. La préposition fixe le cas</h3>
<p>Chaque préposition impose son cas. Certaines demandent l'<strong>accusatif</strong>, d'autres le <strong>datif</strong> :</p>
<pre class="pseudo">+ ACCUSATIF                    + DATIF
warten auf                     teilnehmen an   (participer à)
denken an                      arbeiten bei    (travailler chez)
sich freuen auf/über           helfen bei      (aider à)
sich interessieren für         Angst haben vor (avoir peur de)
sprechen über                  fragen nach     (demander/s'enquérir de)</pre>
<pre class="pseudo">Ich denke an meinen Bruder.       (an + Akk. : meinen Bruder)
Ich nehme an dem Kurs teil.       (an + Dat. : dem Kurs)</pre>
<h3>3. Poser la question : wo(r)- + préposition</h3>
<p>Pour demander « à quoi ? sur quoi ? », on ne dit pas « auf was ». On soude <strong>wo + préposition</strong> (avec un -r- si la préposition commence par une voyelle) :</p>
<pre class="pseudo">Worauf wartest du?         Sur quoi / qu'attends-tu ?   (wo + r + auf)
Woran denkst du?           À quoi penses-tu ?           (wo + r + an)
Worüber sprecht ihr?       De quoi parlez-vous ?        (wo + r + über)
Wofür interessierst du dich?  À quoi t'intéresses-tu ?</pre>
<div class="tip">La règle du -r- : si la préposition commence par une voyelle (auf, an, über), on insère un -r- pour faciliter la prononciation : <strong>wo + r + auf = worauf</strong>. Sinon : wofür, wovon.</div>
<h3>4. Répondre : da(r)- + préposition</h3>
<p>Pour renvoyer à une chose déjà mentionnée (pas une personne), on utilise <strong>da + préposition</strong> au lieu de « préposition + es » :</p>
<pre class="pseudo">Wartest du auf den Bus? — Ja, ich warte darauf.   (da + r + auf = darauf)
Denkst du an die Prüfung? — Ja, ich denke daran.   (da + r + an = daran)</pre>
<p>Mais pour une PERSONNE, on garde la préposition + pronom : « Denkst du an Anna? — Ja, ich denke an sie. » (à elle).</p>
<h3>5. Les verbes pronominaux à préposition</h3>
<p>Certains verbes sont réfléchis (avec sich) ET à préposition. Le pronom réfléchi s'accorde avec le sujet :</p>
<pre class="pseudo">sich freuen auf   se réjouir de     Ich freue mich auf das Wochenende.
sich ärgern über  s'énerver de/contre  Er ärgert sich über den Lärm.
sich erinnern an  se souvenir de    Erinnerst du dich an den Film?</pre>`,
  exercises: [
    { type: "input", q: "Complète : « Ich warte ___ den Bus. » (attendre le bus)", a: ["auf"], ph: "préposition", exp: "warten auf + accusatif." },
    { type: "qcm", q: "Quelle préposition va avec « denken » (penser à) ?", opts: ["auf", "an", "für", "über"], a: 1, exp: "denken an + accusatif : Ich denke an dich." },
    { type: "input", q: "Complète : « Er interessiert sich ___ Sport. » (s'intéresser à)", a: ["für"], ph: "préposition", exp: "sich interessieren für + accusatif." },
    { type: "qcm", q: "« sich freuen auf » signifie…", opts: ["s'énerver contre", "se réjouir de (quelque chose à venir)", "se souvenir de", "avoir peur de"], a: 1, exp: "sich freuen auf = se réjouir par avance de." },
    { type: "vf", q: "La préposition d'un verbe se traduit rarement mot à mot : « warten auf » = attendre (pas « attendre sur »).", a: true, exp: "On apprend le couple verbe + préposition en bloc." },
    { type: "input", q: "Question « à quoi penses-tu ? » : « ___ denkst du? » (wo + r + an)", a: ["Woran","woran"], ph: "wo...", exp: "wo + r + an = woran (an commence par une voyelle)." },
    { type: "qcm", q: "Pourquoi dit-on « worauf » et non « wo auf » ?", opts: ["par hasard", "on ajoute -r- car la préposition commence par une voyelle", "worauf est faux", "auf disparaît"], a: 1, exp: "wo + r + auf pour faciliter la prononciation." },
    { type: "qcm", q: "« Wartest du auf den Bus? — Ja, ich warte ___. »", opts: ["auf es", "darauf", "auf ihn", "wofür"], a: 1, exp: "Chose → da + r + auf = darauf." },
    { type: "qcm", q: "« Denkst du an Anna? » (personne) — quelle réponse est correcte ?", opts: ["Ja, ich denke daran.", "Ja, ich denke an sie.", "Ja, ich denke darauf.", "Ja, ich denke davon."], a: 1, exp: "Personne → préposition + pronom : an sie (à elle)." },
    { type: "input", q: "Complète le verbe pronominal : « Ich freue ___ auf das Wochenende. » (pronom réfléchi, ich)", a: ["mich"], ph: "pronom réfléchi", exp: "sich freuen → ich freue mich." },
    { type: "qcm", q: "Quelle préposition va avec « teilnehmen » (participer à) et quel cas ?", opts: ["an + datif", "auf + accusatif", "für + accusatif", "über + datif"], a: 0, exp: "teilnehmen an + datif : Ich nehme an dem Kurs teil." },
    { type: "qcm", q: "« Angst haben vor » signifie…", opts: ["se réjouir de", "avoir peur de", "s'intéresser à", "penser à"], a: 1, exp: "Angst haben vor + datif = avoir peur de." },
    { type: "qcm", q: "Compréhension : « Ich freue mich auf die Ferien. » Que ressent la personne ?", opts: ["Elle a peur des vacances", "Elle se réjouit des vacances à venir", "Elle est déçue", "Elle s'ennuie"], a: 1, exp: "sich freuen auf = attendre avec joie." },
    { type: "qcm", q: "Compréhension : « Er ärgert sich über den Lärm. » Quel est le problème ?", opts: ["Il aime le bruit", "Le bruit l'énerve", "Il attend le bus", "Il pense au bruit"], a: 1, exp: "sich ärgern über = s'énerver à cause de ; der Lärm = le bruit." },
    { type: "input", q: "Complète : « Erinnerst du ___ an den Film? » (te souviens-tu — pronom, du)", a: ["dich"], ph: "pronom réfléchi", exp: "sich erinnern → du erinnerst dich." }
  ],
  final: {
    title: "Exercice final — Ein Gespräch (une conversation)",
    intro: `<p>Lis ce petit échange, où plusieurs verbes à préposition apparaissent.</p>
<pre class="pseudo">Tom: Worauf wartest du?
Lisa: Ich warte auf meine Freundin. Wir gehen ins Konzert.
Tom: Oh, freust du dich darauf?
Lisa: Ja, sehr! Ich interessiere mich sehr für Musik.
Tom: Und woran denkst du gerade?
Lisa: Ich denke an das Konzert und an die Prüfung morgen. Ich habe ein bisschen Angst davor.</pre>
<p>(das Konzert = le concert · die Prüfung = l'examen · ein bisschen = un peu)</p>`,
    questions: [
      { type: "qcm", q: "Qu'attend Lisa (auf wen wartet sie) ?", opts: ["Le bus", "Son amie", "Tom", "Le train"], a: 1, exp: "« Ich warte auf meine Freundin. »" },
      { type: "input", q: "Complète la réponse de Lisa : « Ja, ich freue mich ___! » (là-dessus — da+r+auf)", a: ["darauf","Darauf"], ph: "da...", exp: "sich freuen auf → freue mich darauf (chose)." },
      { type: "qcm", q: "À quoi Lisa s'intéresse-t-elle beaucoup ?", opts: ["Au sport", "À la musique", "Au cinéma", "À la cuisine"], a: 1, exp: "« Ich interessiere mich sehr für Musik. »" },
      { type: "qcm", q: "À quoi pense Lisa en ce moment (woran denkt sie) ?", opts: ["Au concert et à l'examen de demain", "Aux vacances", "Au travail", "À rien"], a: 0, exp: "« Ich denke an das Konzert und an die Prüfung morgen. »" },
      { type: "vf", q: "Lisa a un peu peur de l'examen (Angst davor).", a: true, exp: "« Ich habe ein bisschen Angst davor » (davor = de cela, l'examen)." }
    ],
    solution: `<p>Conversation : Tom demande « Worauf wartest du? » (qu'attends-tu ?). Lisa attend son amie (warten auf), se réjouit du concert (sich freuen auf → darauf), s'intéresse à la musique (sich interessieren für). Elle pense (denken an) au concert et à l'examen, et en a un peu peur (Angst haben vor → davor).</p>
<p>Remarque les paires figées : <strong>warten auf</strong>, <strong>sich freuen auf</strong>, <strong>sich interessieren für</strong>, <strong>denken an</strong>, <strong>Angst haben vor</strong>. Pour les choses, on renvoie avec <strong>da(r)-</strong> (darauf, davor) ; pour les personnes, avec préposition + pronom.</p>`
  }
};
</script>
