  title: "Les prépositions de temps",
  subtitle: "am, im, um, seit, vor… situer dans le temps.",
  theory: `
<h3>1. am : jours et moments de la journée</h3>
<p>On utilise <strong>am</strong> (contraction de an dem) pour les <strong>jours</strong> et les <strong>parties de la journée</strong>. Exception : « in der Nacht » (la nuit).</p>
<pre class="pseudo">am Montag        le lundi
am Wochenende    le week-end
am Morgen        le matin
am Abend         le soir
ABER: in der Nacht   la nuit</pre>
<h3>2. im : mois, saisons, année</h3>
<p>On utilise <strong>im</strong> (in dem) pour les <strong>mois</strong> et les <strong>saisons</strong>.</p>
<pre class="pseudo">im Januar        en janvier
im Sommer        en été
im Winter        en hiver
im Jahr 2025     en 2025</pre>
<h3>3. um : l'heure précise</h3>
<pre class="pseudo">um 8 Uhr         à 8 heures
um Mitternacht   à minuit
Der Zug fährt um 9 Uhr ab.   // Le train part à 9 heures</pre>
<h3>4. seit et vor : depuis / il y a (datif)</h3>
<p><strong>seit</strong> = depuis (une action qui continue) ; <strong>vor</strong> = il y a (un point dans le passé). Les deux régissent le <strong>datif</strong>.</p>
<pre class="pseudo">seit zwei Jahren    depuis deux ans   (et ça continue)
vor zwei Jahren     il y a deux ans   (dans le passé)
Ich lerne seit einem Monat Deutsch.   // J'apprends l'allemand depuis un mois
Vor einer Woche war ich krank.        // Il y a une semaine j'étais malade</pre>
<h3>5. Autres prépositions utiles</h3>
<pre class="pseudo">von … bis     de … à       von Montag bis Freitag
nach          après        nach dem Essen (après le repas)
vor           avant        vor dem Essen  (avant le repas)
ohne Präp.:   heute, morgen, gestern, jeden Tag (sans préposition !)</pre>
<div class="warn">Certaines expressions de temps n'ont <strong>pas</strong> de préposition : heute (aujourd'hui), morgen (demain), gestern (hier), jeden Tag (chaque jour), nächste Woche (la semaine prochaine).</div>
<div class="tip">Mini-mémo : <strong>am</strong> jour/moment · <strong>im</strong> mois/saison · <strong>um</strong> heure · <strong>seit</strong> depuis · <strong>vor</strong> il y a. Ces cinq-là couvrent l'essentiel du quotidien.</div>`,

    { type: "input", q: "Complète : « Ich wohne ___ drei Jahren hier. » (depuis)", a: ["seit"], ph: "préposition", exp: "Depuis (dure encore) → seit + datif." },

    { type: "qcm", q: "Quelle expression n'a PAS de préposition ?", opts: ["___ Montag", "___ Sommer", "heute (aujourd'hui)", "___ 8 Uhr"], a: 2, exp: "heute, morgen, gestern s'emploient sans préposition." },
    { type: "qcm", q: "Comment dit-on « la nuit » (exception) ?", opts: ["am Nacht", "im Nacht", "in der Nacht", "um Nacht"], a: 2, exp: "Exception : in der Nacht (et non am Nacht)." },

  ],
  final: {

    questions: [

      { type: "input", q: "« ___ 15 Uhr » (à 15h) : préposition ?", a: ["um"], ph: "préposition", exp: "Heure → um : um 15 Uhr." }
    ],
    solution: `<p>Toutes les prépositions de temps du texte :</p>
<pre class="pseudo">am  → jour / moment   (am Montag, am Wochenende)
im  → saison          (im Sommer)
seit→ depuis + datif  (seit einem Jahr)
vor → il y a + datif  (vor zwei Wochen)
um  → heure           (um 15 Uhr)
(morgen : sans préposition)</pre>
<p>Garde le mémo en tête : am (jour), im (mois/saison), um (heure), seit (depuis), vor (il y a). Et méfie-toi des adverbes heute/morgen/gestern qui n'en prennent aucune.</p>`
  }
};
