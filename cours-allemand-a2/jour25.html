<script>
var DAY = {

  title: "Le conditionnel : würde + infinitif",
  subtitle: "Exprimer un souhait, une hypothèse ou une demande polie.",
  theory: `
<h3>1. À quoi sert le conditionnel ?</h3>
<p>Le conditionnel (der Konjunktiv II) exprime ce qui n'est pas réel : un <strong>souhait</strong> (« j'aimerais... »), une <strong>hypothèse</strong> (« si j'étais riche... »), ou une <strong>demande polie</strong> (« pourriez-vous... ? »). En français : « je ferais, tu viendrais ». En allemand, la façon la plus simple et la plus courante est <strong>würde + infinitif</strong>.</p>
<h3>2. La formule würde + infinitif</h3>
<p><strong>würde</strong> se conjugue comme un auxiliaire (2e position) et le verbe principal part à l'<strong>infinitif à la fin</strong> :</p>
<pre class="pseudo">ich würde        wir würden
du würdest       ihr würdet
er/sie würde     sie/Sie würden</pre>
<pre class="pseudo">Ich würde gern nach Japan reisen.     J'aimerais voyager au Japon.
Was würdest du machen?                Que ferais-tu ?
Wir würden gern helfen.               Nous aimerions bien aider.</pre>
<div class="tip">C'est exactement la structure du futur (werden + infinitif, jour 5), mais avec <strong>würde</strong> au lieu de <strong>werden</strong>. Le verbe reste à l'infinitif tout à la fin.</div>
<h3>3. Les exceptions : wäre, hätte et les modaux</h3>
<p>Trois verbes très fréquents ont une forme de conditionnel propre, qu'on préfère à « würde + inf » :</p>
<pre class="pseudo">sein  → wäre     Ich wäre gern reich.        Je serais volontiers riche.
haben → hätte    Ich hätte gern mehr Zeit.   J'aimerais avoir plus de temps.
können → könnte  Könntest du mir helfen?     Pourrais-tu m'aider ?
mögen → möchte   Ich möchte einen Kaffee.    Je voudrais un café.</pre>
<div class="warn">On ne dit PAS « ich würde sein » ni « ich würde haben » : on utilise <strong>wäre</strong> et <strong>hätte</strong>. De même, les modaux ont leur forme : <strong>könnte</strong> (pourrait), <strong>müsste</strong> (devrait), <strong>dürfte</strong> (aurait le droit).</p></div>
<h3>4. La demande polie</h3>
<p>Le conditionnel adoucit une demande. Compare :</p>
<pre class="pseudo">Kannst du mir helfen?      Peux-tu m'aider ?       (direct)
Könntest du mir helfen?    Pourrais-tu m'aider ?   (poli)
Ich hätte gern ein Wasser. Je voudrais une eau.    (poli, au restaurant)
Würden Sie bitte warten?   Voudriez-vous patienter ? (très poli)</pre>
<h3>5. L'hypothèse avec wenn</h3>
<p>Pour une phrase du type « Si..., alors... », on met le conditionnel dans les DEUX parties. Après <strong>wenn</strong> (subordonnant, jour 13), le verbe va à la fin :</p>
<pre class="pseudo">Wenn ich Zeit hätte, würde ich mehr lesen.
Si j'avais le temps, je lirais davantage.
Wenn ich reich wäre, würde ich um die Welt reisen.
Si j'étais riche, je voyagerais autour du monde.</pre>
<p>Note : dans la partie « wenn », on emploie souvent <strong>hätte / wäre</strong> ; dans la partie principale, <strong>würde + infinitif</strong>.</p>`,
  exercises: [
    { type: "qcm", q: "À quoi sert le conditionnel (Konjunktiv II) ?", opts: ["à raconter le passé", "à exprimer un souhait, une hypothèse ou une demande polie", "à donner un ordre", "à décrire le présent réel"], a: 1, exp: "souhait / hypothèse / politesse." },
    { type: "input", q: "Complète : « Ich ___ gern nach Japan reisen. » (j'aimerais — würde)", a: ["würde","wuerde"], ph: "conditionnel", exp: "ich würde + infinitif à la fin (reisen)." },
    { type: "qcm", q: "Où se place le verbe principal avec « würde » ?", opts: ["en 2e position", "à l'infinitif, à la fin", "juste après le sujet", "au participe passé"], a: 1, exp: "würde en 2e position, infinitif à la fin (comme le futur)." },
    { type: "input", q: "Conjugue : « ___ du das machen? » (ferais-tu — würde, 2e pers.)", a: ["Würdest","würdest","Wuerdest","wuerdest"], ph: "würd...", exp: "du würdest." },
    { type: "qcm", q: "Comment dit-on « je serais » (conditionnel de sein) ?", opts: ["ich würde sein", "ich wäre", "ich bin", "ich war"], a: 1, exp: "sein → wäre (pas « würde sein »)." },
    { type: "input", q: "Complète : « Ich ___ gern mehr Zeit. » (j'aimerais avoir — conditionnel de haben)", a: ["hätte","haette"], ph: "conditionnel de haben", exp: "haben → hätte." },
    { type: "vf", q: "On ne dit pas « ich würde haben » : on utilise « ich hätte ».", a: true, exp: "sein → wäre, haben → hätte ont leur propre forme." },
    { type: "qcm", q: "« Könntest du mir helfen? » est…", opts: ["un ordre", "une demande polie (pourrais-tu m'aider ?)", "une question au passé", "une hypothèse impossible"], a: 1, exp: "können → könnte : demande polie." },
    { type: "input", q: "Complète (poli, au restaurant) : « Ich ___ gern ein Wasser. » (je voudrais — haben)", a: ["hätte","haette"], ph: "conditionnel", exp: "Ich hätte gern = je voudrais." },
    { type: "qcm", q: "Après « wenn » dans une hypothèse, où va le verbe ?", opts: ["en 2e position", "à la fin (subordonnée)", "juste après wenn", "il disparaît"], a: 1, exp: "wenn est subordonnant : verbe à la fin." },
    { type: "qcm", q: "Complète : « Wenn ich reich ___, würde ich reisen. »", opts: ["bin", "war", "wäre", "würde"], a: 2, exp: "Si j'étais riche → wäre (conditionnel de sein)." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Wenn ich Zeit hätte, ich würde lesen.", "Wenn ich Zeit hätte, würde ich lesen.", "Wenn ich hätte Zeit, würde lesen ich.", "Wenn ich Zeit habe würde, ich lesen."], a: 1, exp: "Après la subordonnée en 1re position, inversion : würde ich lesen." },
    { type: "qcm", q: "Compréhension : « Ich würde gern ein Jahr in Deutschland leben. » Que veut la personne ?", opts: ["Elle a vécu en Allemagne", "Elle aimerait vivre un an en Allemagne", "Elle doit partir", "Elle habite déjà là-bas"], a: 1, exp: "würde gern leben = aimerait vivre (souhait)." },
    { type: "qcm", q: "Compréhension : « Wenn ich mehr Geld hätte, würde ich ein Auto kaufen. » Que dit la personne ?", opts: ["Elle a acheté une voiture", "Si elle avait plus d'argent, elle achèterait une voiture", "Elle vend sa voiture", "Elle a assez d'argent"], a: 1, exp: "Hypothèse irréelle : wenn ... hätte, würde ... kaufen." },
    { type: "vf", q: "« würde + infinitif » se construit comme le futur (werden + infinitif), avec le verbe à la fin.", a: true, exp: "Seule différence : würde au lieu de werden." }
  ],
  final: {
    title: "Exercice final — Was würdest du machen? (que ferais-tu ?)",
    intro: `<p>Lis les souhaits de ces personnes puis réponds.</p>
<pre class="pseudo">Anna: Wenn ich viel Geld hätte, würde ich um die Welt reisen.
Ben: Ich hätte gern mehr Zeit für meine Hobbys.
Clara: Könntest du mir bitte helfen? Ich würde gern besser Deutsch sprechen.
David: Wenn ich in Berlin wäre, würde ich das Museum besuchen.
Anna: Würdest du mit mir kommen, David?</pre>
<p>(um die Welt = autour du monde · besser = mieux)</p>`,
    questions: [
      { type: "qcm", q: "Que ferait Anna si elle avait beaucoup d'argent ?", opts: ["Acheter une maison", "Voyager autour du monde", "Arrêter de travailler", "Aider les autres"], a: 1, exp: "« würde ich um die Welt reisen »." },
      { type: "input", q: "Complète le souhait de Ben : « Ich ___ gern mehr Zeit. » (conditionnel de haben)", a: ["hätte","haette"], ph: "conditionnel", exp: "hätte gern = aimerait avoir." },
      { type: "qcm", q: "Que demande Clara à quelqu'un ?", opts: ["De l'argent", "De l'aider (poliment)", "Un voyage", "Un livre"], a: 1, exp: "« Könntest du mir bitte helfen? » = demande polie." },
      { type: "qcm", q: "Que ferait David s'il était à Berlin ?", opts: ["Visiter le musée", "Prendre le train", "Manger au restaurant", "Rentrer chez lui"], a: 0, exp: "« Wenn ich in Berlin wäre, würde ich das Museum besuchen »." },
      { type: "vf", q: "Toutes ces phrases expriment des situations réelles et présentes.", a: false, exp: "FAUX : ce sont des souhaits et des hypothèses (conditionnel), pas la réalité." }
    ],
    solution: `<p>Ces phrases illustrent tous les usages du conditionnel : le souhait (Anna : würde reisen ; Ben : hätte gern), la demande polie (Clara : könntest du helfen?), l'hypothèse avec wenn (David : wenn ich in Berlin wäre, würde ich... besuchen).</p>
<p>Retiens la mécanique : <strong>würde + infinitif</strong> pour la plupart des verbes, mais <strong>wäre</strong> (sein), <strong>hätte</strong> (haben) et <strong>könnte</strong> (können) ont leur forme propre.</p>`
  }
};
</script>
