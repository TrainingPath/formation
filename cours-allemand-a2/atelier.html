<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier — Allemand A2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
var ATELIER = {
  prefix: "at-de-a2",
  titre: "🇩🇪 Atelier — Allemand A2",
  soustitre: "Trois dialogues, puis 30 types d'exercices (10 chacun) pour consolider le niveau A2.",
  retour: "index.html",
  dialogues: [
    { num:"1", titre:"An der Hotelrezeption", perso:"Frau Berger (Rezeptionistin) et Herr Lambert (Gast aus Belgien)", lignes:[
      {qui:"Berger", txt:"Guten Abend! Willkommen im Hotel Sonnenhof. Haben Sie reserviert?", fr:"Bonsoir ! Bienvenue à l'hôtel Sonnenhof. Avez-vous réservé ?"},
      {qui:"Lambert", txt:"Guten Abend. Ja, ich habe letzte Woche ein Einzelzimmer gebucht. Mein Name ist Lambert.", fr:"Bonsoir. Oui, j'ai réservé une chambre simple la semaine dernière. Je m'appelle Lambert."},
      {qui:"Berger", txt:"Einen Moment, bitte... Ja, hier: Zimmer 214, im zweiten Stock, für drei Nächte.", fr:"Un instant, s'il vous plaît... Oui, voilà : chambre 214, au deuxième étage, pour trois nuits."},
      {qui:"Lambert", txt:"Sehr gut. Ist das Frühstück im Preis inbegriffen?", fr:"Très bien. Le petit-déjeuner est-il compris dans le prix ?"},
      {qui:"Berger", txt:"Ja, natürlich. Es gibt Frühstück von sieben bis halb elf im Restaurant im Erdgeschoss.", fr:"Oui, bien sûr. Le petit-déjeuner est servi de sept heures à dix heures et demie au restaurant du rez-de-chaussée."},
      {qui:"Lambert", txt:"Gibt es auch WLAN im Zimmer? Ich muss morgen arbeiten.", fr:"Y a-t-il aussi du wifi dans la chambre ? Je dois travailler demain."},
      {qui:"Berger", txt:"Ja, das WLAN ist kostenlos. Das Passwort steht auf der Karte neben dem Fernseher.", fr:"Oui, le wifi est gratuit. Le mot de passe est écrit sur la carte à côté de la télévision."},
      {qui:"Lambert", txt:"Danke. Können Sie mir sagen, wo ich mein Auto parken kann?", fr:"Merci. Pouvez-vous me dire où je peux garer ma voiture ?"},
      {qui:"Berger", txt:"Sie können in die Tiefgarage fahren. Die Einfahrt ist hinter dem Hotel.", fr:"Vous pouvez entrer dans le parking souterrain. L'entrée est derrière l'hôtel."},
      {qui:"Lambert", txt:"Perfekt. Hier ist mein Ausweis. Vielen Dank für Ihre Hilfe!", fr:"Parfait. Voici ma carte d'identité. Merci beaucoup pour votre aide !"}
    ]},
    { num:"2", titre:"Im Restaurant", perso:"Der Kellner et Frau Lambert", lignes:[
      {qui:"Kellner", txt:"Guten Abend. Haben Sie schon gewählt?", fr:"Bonsoir. Avez-vous déjà choisi ?"},
      {qui:"Lambert", txt:"Noch nicht ganz. Was können Sie mir empfehlen?", fr:"Pas tout à fait. Que pouvez-vous me recommander ?"},
      {qui:"Kellner", txt:"Heute ist der Fisch sehr frisch. Er kommt mit Kartoffeln und Gemüse.", fr:"Aujourd'hui le poisson est très frais. Il est servi avec des pommes de terre et des légumes."},
      {qui:"Lambert", txt:"Das klingt gut. Aber ich esse kein Fleisch. Ist Fisch für Sie Fleisch?", fr:"Cela a l'air bon. Mais je ne mange pas de viande. Le poisson est-il de la viande pour vous ?"},
      {qui:"Kellner", txt:"Nein, keine Sorge. Wir haben auch einen vegetarischen Teller mit Nudeln.", fr:"Non, ne vous inquiétez pas. Nous avons aussi une assiette végétarienne avec des pâtes."},
      {qui:"Lambert", txt:"Dann nehme ich den Fisch, bitte. Und als Vorspeise eine Suppe.", fr:"Alors je prends le poisson, s'il vous plaît. Et en entrée, une soupe."},
      {qui:"Kellner", txt:"Sehr gern. Und was möchten Sie trinken?", fr:"Avec plaisir. Et que souhaitez-vous boire ?"},
      {qui:"Lambert", txt:"Ein Glas Weißwein und eine Flasche Wasser, bitte.", fr:"Un verre de vin blanc et une bouteille d'eau, s'il vous plaît."},
      {qui:"Kellner", txt:"Gut. Möchten Sie später noch einen Nachtisch?", fr:"Bien. Souhaitez-vous encore un dessert plus tard ?"},
      {qui:"Lambert", txt:"Vielleicht. Bringen Sie mir bitte zuerst die Suppe, dann sehen wir weiter.", fr:"Peut-être. Apportez-moi d'abord la soupe, ensuite nous verrons."}
    ]},
    { num:"3", titre:"Beim Arzt", perso:"Doktor Weber et Herr Lambert", lignes:[
      {qui:"Weber", txt:"Guten Tag, Herr Lambert. Was fehlt Ihnen denn?", fr:"Bonjour, Monsieur Lambert. Qu'est-ce qui ne va pas ?"},
      {qui:"Lambert", txt:"Guten Tag, Herr Doktor. Ich habe seit gestern starke Kopfschmerzen.", fr:"Bonjour, docteur. J'ai de forts maux de tête depuis hier."},
      {qui:"Weber", txt:"Haben Sie auch Fieber gehabt?", fr:"Avez-vous aussi eu de la fièvre ?"},
      {qui:"Lambert", txt:"Ja, gestern Abend hatte ich achtunddreißig Grad. Heute ist es besser.", fr:"Oui, hier soir j'avais trente-huit degrés. Aujourd'hui, ça va mieux."},
      {qui:"Weber", txt:"Haben Sie gut geschlafen? Und wie viel Wasser trinken Sie am Tag?", fr:"Avez-vous bien dormi ? Et combien d'eau buvez-vous par jour ?"},
      {qui:"Lambert", txt:"Ich habe schlecht geschlafen, weil das Zimmer zu warm war. Ich trinke wenig.", fr:"J'ai mal dormi, parce que la chambre était trop chaude. Je bois peu."},
      {qui:"Weber", txt:"Sie müssen viel mehr trinken. Machen Sie bitte den Mund auf.", fr:"Vous devez boire beaucoup plus. Ouvrez la bouche, s'il vous plaît."},
      {qui:"Lambert", txt:"Ist es etwas Ernstes, Herr Doktor?", fr:"Est-ce quelque chose de grave, docteur ?"},
      {qui:"Weber", txt:"Nein, das ist nur eine leichte Erkältung. Ich verschreibe Ihnen ein Medikament.", fr:"Non, ce n'est qu'un léger rhume. Je vous prescris un médicament."},
      {qui:"Lambert", txt:"Vielen Dank. Wie oft soll ich die Tabletten nehmen?", fr:"Merci beaucoup. Combien de fois dois-je prendre les comprimés ?"}
    ]}
  ],
  types: [
  { id:"vf", nom:"Vrai / Faux", consigne:"Lisez les trois dialogues, puis dites si chaque affirmation est vraie ou fausse.", exercices:[
    {type:"vf", q:"Herr Lambert hat ein Doppelzimmer gebucht.", a:false, exp:"Faux : il a réservé « ein Einzelzimmer » (das Einzelzimmer = une chambre simple)."},
    {type:"vf", q:"Das Zimmer von Herrn Lambert ist im zweiten Stock.", a:true, exp:"Vrai : « Zimmer 214, im zweiten Stock ». Der Stock = l'étage."},
    {type:"vf", q:"Das Frühstück ist im Preis inbegriffen.", a:true, exp:"Vrai : Frau Berger répond « Ja, natürlich ». Das Frühstück = le petit-déjeuner."},
    {type:"vf", q:"Das WLAN im Hotel kostet zehn Euro pro Tag.", a:false, exp:"Faux : « Das WLAN ist kostenlos » (kostenlos = gratuit). Das WLAN = le wifi."},
    {type:"vf", q:"Herr Lambert kann sein Auto in der Tiefgarage parken.", a:true, exp:"Vrai : « Sie können in die Tiefgarage fahren ». Die Tiefgarage = le parking souterrain."},
    {type:"vf", q:"Frau Lambert isst gern Fleisch.", a:false, exp:"Faux : elle dit « ich esse kein Fleisch ». Das Fleisch = la viande."},
    {type:"vf", q:"Frau Lambert bestellt am Ende den Fisch.", a:true, exp:"Vrai : « Dann nehme ich den Fisch ». Der Fisch = le poisson (accusatif : den Fisch)."},
    {type:"vf", q:"Herr Lambert hat seit einer Woche Kopfschmerzen.", a:false, exp:"Faux : « seit gestern » = depuis hier. Die Kopfschmerzen (pluriel) = les maux de tête."},
    {type:"vf", q:"Herr Lambert hat schlecht geschlafen, weil das Zimmer zu warm war.", a:true, exp:"Vrai : subordonnée avec weil et verbe à la fin (… zu warm war)."},
    {type:"vf", q:"Der Arzt sagt, dass die Krankheit sehr ernst ist.", a:false, exp:"Faux : « das ist nur eine leichte Erkältung ». Die Erkältung = le rhume."}
  ]},
  { id:"qcmdial", nom:"QCM de compréhension", consigne:"Choisissez la bonne réponse d'après les dialogues.", exercices:[
    {type:"qcm", q:"Wie heißt das Hotel?", opts:["Hotel Bergblick","Hotel Sonnenhof","Hotel Waldheim","Hotel Adler"], a:1, exp:"« Willkommen im Hotel Sonnenhof ». Das Hotel = l'hôtel."},
    {type:"qcm", q:"Wie viele Nächte bleibt Herr Lambert?", opts:["zwei","drei","vier","fünf"], a:1, exp:"« für drei Nächte ». Die Nacht, pluriel die Nächte."},
    {type:"qcm", q:"Wann gibt es Frühstück?", opts:["von sechs bis neun","von sieben bis halb elf","von acht bis zwölf","von halb sieben bis zehn"], a:1, exp:"« von sieben bis halb elf » = de 7h à 10h30."},
    {type:"qcm", q:"Wo steht das WLAN-Passwort?", opts:["an der Tür","auf der Karte neben dem Fernseher","im Bad","an der Rezeption"], a:1, exp:"Neben + datif : neben dem Fernseher (der Fernseher = la télévision)."},
    {type:"qcm", q:"Wo ist die Einfahrt zur Tiefgarage?", opts:["vor dem Hotel","hinter dem Hotel","neben der Kirche","im Erdgeschoss"], a:1, exp:"« hinter dem Hotel » : hinter + datif pour indiquer la position."},
    {type:"qcm", q:"Was empfiehlt der Kellner?", opts:["das Steak","den Fisch","die Pizza","den Salat"], a:1, exp:"« Heute ist der Fisch sehr frisch ». Empfehlen = recommander."},
    {type:"qcm", q:"Was trinkt Frau Lambert?", opts:["Bier und Kaffee","Weißwein und Wasser","Rotwein und Saft","Tee und Milch"], a:1, exp:"« Ein Glas Weißwein und eine Flasche Wasser »."},
    {type:"qcm", q:"Wie viel Fieber hatte Herr Lambert gestern Abend?", opts:["37 Grad","38 Grad","39 Grad","40 Grad"], a:1, exp:"« achtunddreißig Grad » = 38 degrés. Das Fieber = la fièvre."},
    {type:"qcm", q:"Warum hat Herr Lambert schlecht geschlafen?", opts:["weil er Hunger hatte","weil das Zimmer zu warm war","weil es zu laut war","weil das Bett hart war"], a:1, exp:"Weil introduit la cause, le verbe (war) va à la fin."},
    {type:"qcm", q:"Was macht der Arzt am Ende?", opts:["Er schickt ihn ins Krankenhaus","Er verschreibt ein Medikament","Er gibt ihm eine Spritze","Er sagt nichts"], a:1, exp:"« Ich verschreibe Ihnen ein Medikament ». Das Medikament = le médicament."}
  ]},
  { id:"rectif", nom:"Rectifier l'affirmation fausse", consigne:"Chaque phrase contient une erreur. Écrivez le mot correct d'après les dialogues.", exercices:[
    {type:"input", q:"Herr Lambert hat ein Doppelzimmer gebucht. → Er hat ein ______ gebucht.", a:["Einzelzimmer","einzelzimmer"], ph:"un mot", exp:"Das Einzelzimmer = la chambre simple (das Doppelzimmer = la chambre double)."},
    {type:"input", q:"Das Zimmer ist im dritten Stock. → Es ist im ______ Stock.", a:["zweiten"], ph:"un mot", exp:"Im zweiten Stock : adjectif ordinal décliné au datif (-en)."},
    {type:"input", q:"Das WLAN kostet fünf Euro. → Das WLAN ist ______.", a:["kostenlos","gratis"], ph:"un adjectif", exp:"Kostenlos = gratuit. Das WLAN (neutre)."},
    {type:"input", q:"Die Einfahrt ist vor dem Hotel. → Sie ist ______ dem Hotel.", a:["hinter"], ph:"une préposition", exp:"Hinter + datif (position) : hinter dem Hotel."},
    {type:"input", q:"Frau Lambert isst gern Fleisch. → Sie isst ______ Fleisch.", a:["kein"], ph:"un mot", exp:"Kein remplace l'article indéfini ou l'absence d'article : kein Fleisch (das Fleisch, accusatif neutre)."},
    {type:"input", q:"Sie bestellt als Vorspeise einen Salat. → Sie bestellt eine ______.", a:["Suppe"], ph:"un nom", exp:"Die Suppe = la soupe. Die Vorspeise = l'entrée."},
    {type:"input", q:"Sie trinkt Rotwein. → Sie trinkt ______.", a:["Weißwein","Weisswein","weißwein","weisswein"], ph:"un nom", exp:"Der Weißwein = le vin blanc (weiß = blanc)."},
    {type:"input", q:"Herr Lambert hat Bauchschmerzen. → Er hat ______.", a:["Kopfschmerzen","kopfschmerzen"], ph:"un nom", exp:"Die Kopfschmerzen (toujours au pluriel) = les maux de tête."},
    {type:"input", q:"Er hatte neununddreißig Grad Fieber. → Er hatte ______ Grad.", a:["achtunddreißig","achtunddreissig","38"], ph:"un nombre", exp:"38 = achtunddreißig (unités avant les dizaines, en un seul mot)."},
    {type:"input", q:"Der Arzt sagt, es ist eine schwere Krankheit. → Es ist nur eine leichte ______.", a:["Erkältung","Erkaeltung","Erkältung.","erkältung"], ph:"un nom", exp:"Die Erkältung = le rhume ; leicht = léger."}
  ]},
  { id:"texte", nom:"Texte + questions", consigne:"Lisez le petit texte, puis répondez aux questions.", exercices:[
    {type:"qcm", q:"TEXTE : « Familie Lambert ist mit dem Zug nach München gefahren. Die Reise hat fünf Stunden gedauert. Im Zug haben sie Sandwiches gegessen und Kaffee getrunken. Am Bahnhof haben sie ein Taxi genommen, weil es geregnet hat. » — Wie sind sie nach München gefahren?", opts:["mit dem Auto","mit dem Zug","mit dem Flugzeug","mit dem Bus"], a:1, exp:"Mit + datif : mit dem Zug (der Zug = le train)."},
    {type:"qcm", q:"Wie lange hat die Reise gedauert?", opts:["drei Stunden","vier Stunden","fünf Stunden","sechs Stunden"], a:2, exp:"« hat fünf Stunden gedauert » : Perfekt de dauern avec haben."},
    {type:"qcm", q:"Was haben sie im Zug getrunken?", opts:["Tee","Kaffee","Bier","Wasser"], a:1, exp:"Getrunken est le participe fort de trinken. Der Kaffee = le café."},
    {type:"vf", q:"Sie haben am Bahnhof ein Taxi genommen.", a:true, exp:"Vrai : genommen, participe irrégulier de nehmen."},
    {type:"input", q:"Warum haben sie ein Taxi genommen? Antworten Sie: Weil es ______ hat.", a:["geregnet"], ph:"participe", exp:"Regnen → geregnet (verbe faible régulier, ge- + radical + -t)."},
    {type:"qcm", q:"TEXTE 2 : « Anna wohnt seit drei Jahren in Hamburg. Früher hat sie in Köln gewohnt. Sie arbeitet in einem Büro und fährt jeden Tag mit dem Fahrrad zur Arbeit. Am Wochenende geht sie gern schwimmen. » — Wo wohnt Anna jetzt?", opts:["in Köln","in Hamburg","in Berlin","in München"], a:1, exp:"Seit + datif : seit drei Jahren = depuis trois ans."},
    {type:"qcm", q:"Wo hat Anna früher gewohnt?", opts:["in Hamburg","in Köln","in Bonn","in Wien"], a:1, exp:"Perfekt : hat gewohnt (wohnen est un verbe faible)."},
    {type:"qcm", q:"Wie fährt Anna zur Arbeit?", opts:["mit dem Bus","mit dem Fahrrad","mit dem Auto","zu Fuß"], a:1, exp:"Das Fahrrad = le vélo. Zur Arbeit = zu der Arbeit (datif)."},
    {type:"vf", q:"Anna geht am Wochenende gern schwimmen.", a:true, exp:"Vrai : gern + verbe = aimer faire quelque chose. Das Wochenende = le week-end."},
    {type:"input", q:"Seit wann wohnt Anna in Hamburg? Seit ______ Jahren.", a:["drei","3"], ph:"un nombre", exp:"Seit exige le datif : seit drei Jahren (das Jahr, pluriel die Jahre → Jahren au datif)."}
  ]},
  { id:"doc", nom:"Document authentique", consigne:"Observez le document et répondez.", exercices:[
    {type:"qcm", q:"PANNEAU : « Rezeption geöffnet: Mo–Fr 7:00–22:00, Sa–So 8:00–20:00 ». Wann öffnet die Rezeption am Samstag?", opts:["um 7 Uhr","um 8 Uhr","um 9 Uhr","um 10 Uhr"], a:1, exp:"Sa = Samstag. Die Rezeption = la réception."},
    {type:"vf", q:"Am Sonntag ist die Rezeption um 21:00 Uhr geöffnet.", a:false, exp:"Faux : dimanche, elle ferme à 20:00. Geöffnet = ouvert."},
    {type:"qcm", q:"SPEISEKARTE : « Tagessuppe 4,50 € — Schnitzel mit Pommes 12,90 € — Apfelkuchen 3,80 € ». Was kostet der Nachtisch?", opts:["3,80 €","4,50 €","12,90 €","8,00 €"], a:0, exp:"Der Apfelkuchen (la tarte aux pommes) est le dessert : der Nachtisch."},
    {type:"input", q:"Wie viel kosten eine Tagessuppe und ein Apfelkuchen zusammen? ______ Euro.", a:["8,30","8.30","8,30 Euro"], ph:"un prix", exp:"4,50 + 3,80 = 8,30. En allemand on lit : acht Euro dreißig."},
    {type:"qcm", q:"REZEPT DES ARZTES : « 3-mal täglich 1 Tablette nach dem Essen ». Wie oft nimmt man die Tablette?", opts:["einmal am Tag","zweimal am Tag","dreimal am Tag","viermal am Tag"], a:2, exp:"3-mal täglich = trois fois par jour. Die Tablette = le comprimé."},
    {type:"vf", q:"Man nimmt die Tablette vor dem Essen.", a:false, exp:"Faux : nach dem Essen = après le repas (nach + datif)."},
    {type:"qcm", q:"FAHRPLAN : « ICE 592 nach Berlin, Abfahrt 14:37, Gleis 8 ». Von welchem Gleis fährt der Zug ab?", opts:["Gleis 5","Gleis 7","Gleis 8","Gleis 14"], a:2, exp:"Das Gleis = la voie. Abfahren est séparable : der Zug fährt ab."},
    {type:"input", q:"Wann fährt der ICE 592 ab? Um ______ Uhr.", a:["14:37","14.37","vierzehn Uhr siebenunddreißig"], ph:"une heure", exp:"Die Abfahrt = le départ ; die Ankunft = l'arrivée."},
    {type:"qcm", q:"SCHILD IM ZIMMER : « Bitte nicht stören ». Was bedeutet das?", opts:["Ne pas déranger","Ne pas fumer","Sortie de secours","Chambre libre"], a:0, exp:"Stören = déranger. Bitte nicht + infinitif = consigne polie."},
    {type:"vf", q:"« Notausgang » bedeutet auf Französisch: sortie de secours.", a:true, exp:"Vrai : die Not = la détresse, der Ausgang = la sortie."}
  ]},
  { id:"syn", nom:"Synonymes", consigne:"Choisissez le mot ou l'expression de sens équivalent.", exercices:[
    {type:"qcm", q:"Synonym von « beginnen »", opts:["anfangen","aufhören","bleiben","warten"], a:0, exp:"Anfangen (séparable) = beginnen = commencer."},
    {type:"qcm", q:"Synonym von « sprechen »", opts:["reden","schweigen","hören","lesen"], a:0, exp:"Reden = sprechen = parler."},
    {type:"qcm", q:"Synonym von « bekommen »", opts:["erhalten","geben","verlieren","suchen"], a:0, exp:"Erhalten = bekommen = recevoir (attention : bekommen ne veut pas dire devenir !)."},
    {type:"qcm", q:"Synonym von « schnell »", opts:["rasch","langsam","müde","leise"], a:0, exp:"Rasch = schnell = rapide, vite."},
    {type:"qcm", q:"Synonym von « vielleicht »", opts:["möglicherweise","niemals","immer","sofort"], a:0, exp:"Möglicherweise = peut-être (de möglich = possible)."},
    {type:"qcm", q:"Synonym von « die Arbeit »", opts:["der Job","die Ferien","das Spiel","die Pause"], a:0, exp:"Der Job (familier) = die Arbeit = le travail."},
    {type:"qcm", q:"Synonym von « fast »", opts:["beinahe","ganz","völlig","nie"], a:0, exp:"Beinahe = fast = presque."},
    {type:"input", q:"Synonym von « der Arzt » (weibliche Form nicht nötig): der M______", a:["Mediziner","mediziner","Doktor","doktor"], ph:"un nom", exp:"Der Mediziner / der Doktor = le médecin. Der Arzt, pluriel die Ärzte."},
    {type:"input", q:"Synonym von « nett »: fr______lich", a:["freundlich"], ph:"un adjectif", exp:"Freundlich = nett = gentil, aimable (der Freund = l'ami)."},
    {type:"input", q:"Synonym von « kaufen » im Sinne von bezahlen: be______", a:["bezahlen","zahlen"], ph:"un verbe", exp:"Bezahlen = payer. Pas de ge- au Perfekt : hat bezahlt."}
  ]},
  { id:"ant", nom:"Antonymes", consigne:"Trouvez le contraire.", exercices:[
    {type:"qcm", q:"Gegenteil von « billig »", opts:["teuer","günstig","klein","leicht"], a:0, exp:"Teuer = cher ; billig / günstig = bon marché."},
    {type:"qcm", q:"Gegenteil von « laut »", opts:["leise","stark","hell","kurz"], a:0, exp:"Leise = doux, silencieux ; laut = bruyant."},
    {type:"qcm", q:"Gegenteil von « immer »", opts:["nie","oft","manchmal","meistens"], a:0, exp:"Nie = jamais ; immer = toujours."},
    {type:"qcm", q:"Gegenteil von « der Anfang »", opts:["das Ende","die Mitte","der Weg","die Zeit"], a:0, exp:"Das Ende = la fin ; der Anfang = le début."},
    {type:"qcm", q:"Gegenteil von « aufmachen »", opts:["zumachen","mitmachen","ausmachen","anmachen"], a:0, exp:"Zumachen = fermer ; aufmachen = ouvrir. Verbes séparables : ich mache zu."},
    {type:"qcm", q:"Gegenteil von « krank »", opts:["gesund","müde","alt","schwach"], a:0, exp:"Gesund = en bonne santé ; die Gesundheit = la santé."},
    {type:"input", q:"Gegenteil von « früh »: sp___", a:["spät","spaet"], ph:"un adjectif", exp:"Spät = tard ; früh = tôt."},
    {type:"input", q:"Gegenteil von « groß »: kl___", a:["klein"], ph:"un adjectif", exp:"Klein = petit ; groß = grand (comparatif : größer)."},
    {type:"input", q:"Gegenteil von « die Frage »: die A______", a:["Antwort","antwort"], ph:"un nom", exp:"Die Antwort = la réponse ; antworten = répondre."},
    {type:"input", q:"Gegenteil von « abfahren »: an______", a:["ankommen"], ph:"un verbe", exp:"Ankommen = arriver ; abfahren = partir. Tous deux avec sein au Perfekt."}
  ]},
  { id:"motjuste", nom:"Le mot juste", consigne:"Complétez avec le mot qui convient.", exercices:[
    {type:"qcm", q:"Ich möchte ein Zimmer ______.", opts:["reservieren","reparieren","regieren","riskieren"], a:0, exp:"Reservieren = réserver. Pas de ge- au Perfekt des verbes en -ieren : hat reserviert."},
    {type:"qcm", q:"Der Kellner bringt uns die ______.", opts:["Speisekarte","Landkarte","Postkarte","Eintrittskarte"], a:0, exp:"Die Speisekarte = le menu (die Speise = le mets)."},
    {type:"qcm", q:"Ich habe Halsschmerzen und kann nicht gut ______.", opts:["schlucken","schwimmen","schreiben","schlafen"], a:0, exp:"Schlucken = avaler ; der Hals = la gorge, le cou."},
    {type:"qcm", q:"Wir haben den Zug ______, deshalb kommen wir zu spät.", opts:["verpasst","vergessen","verkauft","verloren"], a:0, exp:"Verpassen = rater (un train). Pas de ge- : hat verpasst."},
    {type:"qcm", q:"Kannst du mir bitte ______? Ich verstehe das nicht.", opts:["helfen","hoffen","holen","halten"], a:0, exp:"Helfen + datif : Er hilft mir."},
    {type:"input", q:"Ich habe kein Geld mehr. Wo ist der nächste Geld______?", a:["automat","Automat"], ph:"un mot", exp:"Der Geldautomat = le distributeur de billets."},
    {type:"input", q:"Im Hotel bekommt man den Zimmer______ an der Rezeption.", a:["schlüssel","Schlüssel","schluessel","Schluessel"], ph:"un mot", exp:"Der Schlüssel = la clé ; der Zimmerschlüssel = la clé de chambre."},
    {type:"input", q:"Wenn man krank ist, geht man zum ______ (der).", a:["Arzt","arzt"], ph:"un nom", exp:"Zum Arzt = zu dem Arzt (datif masculin)."},
    {type:"input", q:"Nach dem Essen bestelle ich einen Nach______.", a:["tisch","Tisch"], ph:"un mot", exp:"Der Nachtisch = le dessert (littéralement : après-table)."},
    {type:"input", q:"Das Wasser ist zu kalt, ich möchte es ______ (contraire de kalt).", a:["warm","heiß","heiss"], ph:"un adjectif", exp:"Warm / heiß = chaud ; kalt = froid."}
  ]},
  { id:"familles", nom:"Familles de mots", consigne:"Complétez avec un mot de la même famille.", exercices:[

  { id:"qr", nom:"Question ↔ réponse", consigne:"Associez la bonne réponse à la question.", exercices:[
