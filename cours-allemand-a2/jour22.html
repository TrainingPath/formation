var DAY = {
  num: 22,
  title: "Raconter une histoire au passé",
  subtitle: "Enchaîner les événements avec le Perfekt et les mots de temps.",
  theory: `
<h3>1. Perfekt ou Präteritum pour raconter ?</h3>
<p>Tu connais deux temps du passé (jours 1 à 4). Pour <strong>raconter oralement</strong> ou dans un récit personnel (un e-mail, un journal), on utilise surtout le <strong>Perfekt</strong> (haben/sein + participe passé). Le <strong>Präteritum</strong> (prétérit) sert surtout à l'écrit littéraire et aux verbes <em>sein</em>, <em>haben</em> et aux modaux.</p>
<pre class="pseudo">Ich habe eine Reise gemacht.        J'ai fait un voyage.  (Perfekt)
Wir sind nach Italien gefahren.     Nous sommes allés en Italie.  (Perfekt, sein)
Das Wetter war schön.               Le temps était beau.  (Präteritum de sein)
Ich hatte keine Zeit.               Je n'avais pas le temps.  (Präteritum de haben)</pre>
<div class="tip">Règle simple pour raconter : <strong>tout au Perfekt</strong>, SAUF <em>war</em> (était), <em>hatte</em> (avait) et les modaux (konnte, wollte, musste) qu'on laisse au Präteritum. C'est plus naturel.</div>
<h3>2. Les mots qui organisent le récit</h3>
<p>Pour enchaîner les événements dans l'ordre, on utilise des adverbes de temps. En tête de phrase, ils provoquent l'<strong>inversion</strong> (verbe en 2e position) :</p>
<pre class="pseudo">zuerst      d'abord         dann        ensuite / puis
danach      après cela      später      plus tard
am Morgen   le matin        am Abend    le soir
plötzlich   soudain         schließlich  finalement / enfin</pre>
<pre class="pseudo">Zuerst sind wir aufgestanden.       D'abord, nous nous sommes levés.
Dann haben wir gefrühstückt.        Ensuite, nous avons pris le petit-déj.
Am Abend sind wir ins Kino gegangen.  Le soir, nous sommes allés au cinéma.</pre>
<div class="warn">Après ces mots en 1re position, le verbe conjugué reste en 2e position, avant le sujet : « <strong>Dann haben wir</strong>... » (et non « Dann wir haben »). Le participe passé, lui, reste tout à la fin.</div>
<h3>3. La place du participe : le cadre verbal</h3>
<p>Au Perfekt, l'auxiliaire (haben/sein) est en 2e position et le participe part <strong>à la fin</strong> de la phrase. Tout le reste s'insère au milieu : c'est le « cadre verbal » (Satzklammer).</p>
<pre class="pseudo">Ich  habe  gestern  einen  Film  gesehen.
     [2e]                          [fin]
J'ai vu un film hier.</pre>
<h3>4. Indiquer quand : les compléments de temps</h3>
<pre class="pseudo">gestern      hier            vorgestern   avant-hier
letzte Woche la semaine dernière   letztes Jahr  l'année dernière
vor zwei Tagen   il y a deux jours   am Montag    lundi</pre>
<p>« Letztes Wochenende habe ich meine Großeltern besucht. » = Le week-end dernier, j'ai rendu visite à mes grands-parents.</p>
<h3>5. Un mini-récit modèle</h3>
<pre class="pseudo">Letzten Samstag bin ich früh aufgestanden.
Zuerst habe ich gefrühstückt, dann bin ich in die Stadt gefahren.
Dort habe ich Freunde getroffen. Wir haben zusammen Kaffee getrunken.
Am Nachmittag hat es plötzlich geregnet.
Schließlich bin ich müde nach Hause gekommen.</pre>
<p>(müde = fatigué · nach Hause = à la maison, direction)</p>`,
  exercises: [
    { type: "qcm", q: "Pour raconter un récit personnel à l'oral, on utilise surtout…", opts: ["le Präteritum", "le Perfekt", "le futur", "le présent"], a: 1, exp: "Le Perfekt est le temps du récit oral/personnel." },
    { type: "qcm", q: "Quels verbes reste-t-on habituellement au Präteritum même dans un récit ?", opts: ["tous les verbes", "sein (war), haben (hatte) et les modaux", "seulement fahren", "aucun"], a: 1, exp: "war, hatte et les modaux se disent au Präteritum, c'est plus naturel." },
    { type: "input", q: "Complète : « Das Wetter ___ schön. » (était — Präteritum de sein)", a: ["war"], ph: "sein au passé", exp: "sein → war." },
    { type: "input", q: "Complète : « Ich ___ keine Zeit. » (n'avais pas — Präteritum de haben)", a: ["hatte"], ph: "haben au passé", exp: "haben → hatte." },
    { type: "qcm", q: "Que signifie « zuerst » ?", opts: ["ensuite", "d'abord", "soudain", "finalement"], a: 1, exp: "zuerst = d'abord ; dann = ensuite." },
    { type: "qcm", q: "Quelle phrase est correcte (inversion après « dann ») ?", opts: ["Dann wir haben gegessen.", "Dann haben wir gegessen.", "Dann gegessen wir haben.", "Wir dann haben gegessen."], a: 1, exp: "Après dann (1re position), le verbe est en 2e : haben wir." },
    { type: "vf", q: "Au Perfekt, le participe passé se place à la fin de la phrase.", a: true, exp: "L'auxiliaire est en 2e position, le participe à la fin (cadre verbal)." },
    { type: "input", q: "Complète : « Ich habe gestern einen Film ___. » (vu — participe de sehen)", a: ["gesehen"], ph: "participe passé", exp: "sehen → gesehen (participe irrégulier)." },
    { type: "qcm", q: "Que signifie « plötzlich » ?", opts: ["lentement", "soudain", "d'abord", "hier"], a: 1, exp: "plötzlich = soudain, tout à coup." },
    { type: "input", q: "Complète : « Am Abend ___ wir ins Kino gegangen. » (auxiliaire de gehen)", a: ["sind"], ph: "auxiliaire", exp: "gehen (mouvement) → sein : wir sind gegangen." },
    { type: "qcm", q: "Que veut dire « letzte Woche » ?", opts: ["cette semaine", "la semaine dernière", "la semaine prochaine", "chaque semaine"], a: 1, exp: "letzte Woche = la semaine dernière." },
    { type: "qcm", q: "Quel auxiliaire pour « aufstehen » (se lever) au Perfekt ?", opts: ["haben", "sein", "werden", "les deux"], a: 1, exp: "aufstehen = changement de position → sein : ich bin aufgestanden." },
    { type: "qcm", q: "Compréhension : « Zuerst bin ich aufgestanden, dann habe ich gefrühstückt. » Quel est l'ordre des actions ?", opts: ["Petit-déj puis lever", "Lever puis petit-déjeuner", "Les deux en même temps", "Aucune des deux"], a: 1, exp: "zuerst (lever) ... dann (petit-déj)." },
    { type: "qcm", q: "Compréhension : « Am Nachmittag hat es plötzlich geregnet. » Que s'est-il passé l'après-midi ?", opts: ["Il a fait beau", "Il s'est mis à pleuvoir soudain", "Il a neigé", "Le soleil a brillé"], a: 1, exp: "plötzlich geregnet = s'est mis à pleuvoir soudain." },
    { type: "vf", q: "« Letztes Wochenende habe ich meine Großeltern besucht » est un récit correct au Perfekt.", a: true, exp: "besuchen → besucht ; complément de temps en tête, auxiliaire en 2e, participe à la fin." }
  ],
  final: {
    title: "Exercice final — Mein Wochenende (mon week-end)",
    intro: `<p>Lis ce récit d'un week-end puis réponds.</p>
<pre class="pseudo">Letztes Wochenende bin ich nach Hamburg gefahren.
Am Samstagmorgen habe ich die Stadt besichtigt.
Zuerst bin ich zum Hafen gegangen, dann habe ich ein Museum besucht.
Mittags habe ich in einem Restaurant Fisch gegessen.
Am Abend war ich sehr müde, aber sehr glücklich.
Am Sonntag hat es geregnet, deshalb bin ich früh nach Hause gefahren.</pre>
<p>(besichtigen = visiter · der Hafen = le port · glücklich = heureux · deshalb = c'est pourquoi)</p>`,
    questions: [
      { type: "input", q: "Dans quelle ville la personne est-elle allée ?", a: ["Hamburg","hamburg"], ph: "ville", exp: "« bin ich nach Hamburg gefahren »." },
      { type: "qcm", q: "Qu'a-t-elle fait EN PREMIER (zuerst) le samedi ?", opts: ["Visité un musée", "Été au port", "Mangé du poisson", "Rentré à la maison"], a: 1, exp: "« Zuerst bin ich zum Hafen gegangen »." },
      { type: "qcm", q: "Qu'a-t-elle mangé à midi ?", opts: ["De la viande", "Du poisson", "Une soupe", "Un dessert"], a: 1, exp: "« habe ich ... Fisch gegessen »." },
      { type: "qcm", q: "Comment se sentait-elle le soir ?", opts: ["En colère", "Fatiguée mais heureuse", "Malade", "Ennuyée"], a: 1, exp: "« sehr müde, aber sehr glücklich »." },
      { type: "vf", q: "Elle est rentrée tôt le dimanche à cause de la pluie.", a: true, exp: "« Am Sonntag hat es geregnet, deshalb bin ich früh nach Hause gefahren. »" }
    ],
    solution: `<p>Récit : le week-end dernier (letztes Wochenende) la personne est allée à Hambourg. Le samedi matin elle a visité la ville : d'abord (zuerst) le port, puis (dann) un musée. À midi elle a mangé du poisson. Le soir elle était fatiguée (müde) mais heureuse (glücklich). Le dimanche il a plu, c'est pourquoi (deshalb) elle est rentrée tôt.</p>
<p>Observe : presque tout au <strong>Perfekt</strong> (bin gefahren, habe besucht, habe gegessen), sauf <strong>war</strong> (était). Les mots <strong>zuerst / dann / am Abend</strong> structurent le récit et déclenchent l'inversion.</p>`
  }
};
</script>
