var DAY = {
  num: 16,
  title: "Les vêtements et le shopping",
  subtitle: "Nommer ses habits, demander une taille, un prix, et essayer un article.",
  theory: `
<h3>1. Le vocabulaire des vêtements (die Kleidung)</h3>
<p>Commençons par les mots essentiels. Attention au genre : il faut le retenir avec le mot, car il change l'article et la déclinaison de l'adjectif (revoir les jours 8 et 9).</p>
<pre class="pseudo">das Hemd        la chemise          die Hose        le pantalon
das T-Shirt     le tee-shirt        der Rock        la jupe
das Kleid       la robe             die Jacke       la veste
der Mantel      le manteau          der Pullover    le pull
der Schuh       la chaussure        die Socke       la chaussette
die Mütze       le bonnet           der Schal       l'écharpe
der Anzug       le costume          der Gürtel      la ceinture</pre>
<p>La plupart se mettent au pluriel : <code>die Schuhe</code> (les chaussures), <code>die Hosen</code>, <code>die Kleider</code>. On porte un vêtement avec le verbe <strong>tragen</strong> (porter) ou <strong>anziehen</strong> (mettre, enfiler) : « Ich trage einen blauen Pullover » = Je porte un pull bleu.</p>
<h3>2. Faire les magasins</h3>
<p>Quelques phrases clés pour le shopping (das Einkaufen). On les apprend par cœur comme des formules toutes faites :</p>
<pre class="pseudo">Ich suche eine Jacke.            Je cherche une veste.
Was kostet das?                 Combien ça coûte ?
Haben Sie das in Blau?          Vous l'avez en bleu ?
Kann ich das anprobieren?       Puis-je l'essayer ?
Wo ist die Umkleidekabine?      Où est la cabine d'essayage ?
Ich nehme es.                   Je le prends.</pre>
<h3>3. La taille (die Größe)</h3>
<p>Le vendeur demande souvent : <strong>Welche Größe haben Sie?</strong> (Quelle taille faites-vous ?). On répond : « Ich habe Größe 40 ». Pour dire que ça va ou pas, on utilise le verbe <strong>passen</strong> (aller, être à la bonne taille) et l'expression <strong>stehen + datif</strong> (aller bien, seyant) :</p>
<pre class="pseudo">Die Hose passt gut.             Le pantalon va bien (taille).
Das Kleid steht dir gut.        La robe te va bien (esthétique).
Das ist zu groß / zu klein.     C'est trop grand / trop petit.
Das ist zu teuer.               C'est trop cher.</pre>
<div class="tip">Ne confonds pas <strong>passen</strong> (question de taille) et <strong>stehen</strong> (question d'allure). « Es passt, aber es steht mir nicht » = ça rentre, mais ça ne me va pas (esthétiquement).</div>
<h3>4. Les adjectifs pour décrire un habit</h3>
<p>On combine souvent une couleur et un adjectif : <code>billig</code> (bon marché), <code>teuer</code> (cher), <code>modern</code>, <code>bequem</code> (confortable), <code>eng</code> (serré), <code>weit</code> (ample). Devant le nom, l'adjectif se décline : « ein <strong>rotes</strong> Kleid » (une robe rouge), « die <strong>neue</strong> Jacke » (la veste neuve).</p>
<div class="warn">Piège : <strong>teuer</strong> perd son <em>e</em> quand il se décline. On dit « eine teure Jacke » (et non « teuere »). De même <strong>dunkel</strong> devient « ein dunkles Hemd » (une chemise foncée).</div>
<h3>5. Payer</h3>
<p>À la caisse (die Kasse), on demande : <strong>Zahlen Sie bar oder mit Karte?</strong> (Vous payez en espèces ou par carte ?). Réponse : « Mit Karte, bitte » ou « Bar, bitte ». Le prix se lit : 19,99 € = « neunzehn Euro neunundneunzig ».</p>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « le manteau » en allemand ?", opts: ["die Jacke", "der Mantel", "der Pullover", "das Hemd"], a: 1, exp: "der Mantel = le manteau ; die Jacke = la veste." },
    { type: "qcm", q: "Quel verbe signifie « porter (un vêtement) » ?", opts: ["kaufen", "tragen", "kosten", "suchen"], a: 1, exp: "tragen = porter ; kaufen = acheter." },
    { type: "input", q: "Complète : « Was ___ das? » (Combien ça coûte ?)", a: ["kostet"], ph: "verbe", exp: "kosten → es kostet (3e pers.)." },
    { type: "qcm", q: "Que demande-t-on avec « Kann ich das anprobieren? »", opts: ["Combien ça coûte", "Puis-je l'essayer", "Vous l'avez en bleu", "Où est la caisse"], a: 1, exp: "anprobieren = essayer un vêtement." },
    { type: "vf", q: "« passen » concerne la taille (est-ce que ça rentre), et « stehen » concerne l'allure (est-ce que ça me va bien).", a: true, exp: "Die Hose passt = c'est la bonne taille ; das steht dir = ça te va bien." },
    { type: "input", q: "Complète : « Wo ist die ___? » (Où est la cabine d'essayage ?)", a: ["Umkleidekabine","umkleidekabine"], ph: "un mot", exp: "die Umkleidekabine = la cabine d'essayage." },
    { type: "qcm", q: "Comment dit-on « c'est trop cher » ?", opts: ["Das ist zu groß.", "Das ist zu teuer.", "Das passt gut.", "Ich nehme es."], a: 1, exp: "teuer = cher ; zu = trop." },
    { type: "vf", q: "L'adjectif « teuer » devient « teure » quand on le décline (eine teure Jacke), il perd son -e-.", a: true, exp: "teuer → teure ; dunkel → dunkle. Ces adjectifs perdent le e du radical." },
    { type: "input", q: "Complète : « Ich ___ es. » (Je le prends, à la caisse)", a: ["nehme"], ph: "verbe nehmen", exp: "nehmen → ich nehme." },
    { type: "qcm", q: "Le vendeur demande « Welche Größe haben Sie? ». Il veut savoir…", opts: ["la couleur", "le prix", "la taille", "le moyen de paiement"], a: 2, exp: "die Größe = la taille." },
    { type: "qcm", q: "« Zahlen Sie bar oder mit Karte? » signifie…", opts: ["Payez-vous en espèces ou par carte ?", "Cherchez-vous une veste ?", "Quelle est votre taille ?", "Voulez-vous l'essayer ?"], a: 0, exp: "bar = en espèces ; mit Karte = par carte." },
    { type: "input", q: "Traduis « une robe rouge » : « ein ___ Kleid » (adjectif décliné, das Kleid, neutre nominatif)", a: ["rotes"], ph: "rot + terminaison", exp: "das Kleid est neutre : ein rotes Kleid." },
    { type: "qcm", q: "Compréhension : « Die Jacke passt, aber sie steht mir nicht. » Que veut dire la personne ?", opts: ["La veste est trop chère", "La veste est à sa taille mais ne lui va pas bien", "La veste ne rentre pas", "La veste est en solde"], a: 1, exp: "passt = bonne taille ; steht mir nicht = ne me va pas esthétiquement." },
    { type: "qcm", q: "Compréhension : « Haben Sie das Hemd in Blau? » — que cherche le client ?", opts: ["Le prix de la chemise", "La chemise dans une autre couleur", "Une autre taille", "La cabine"], a: 1, exp: "in Blau = en bleu : il veut une autre couleur." },
    { type: "vf", q: "« der Schuh » a pour pluriel « die Schuhe ».", a: true, exp: "der Schuh → die Schuhe (les chaussures)." }
  ],
  final: {
    title: "Exercice final — Im Kleidungsgeschäft (dans le magasin de vêtements)",
    intro: `<p>Lis ce petit dialogue puis réponds aux questions.</p>
<pre class="pseudo">Verkäuferin: Guten Tag! Kann ich Ihnen helfen?
Kunde: Ja, ich suche eine Jacke in Größe 50.
Verkäuferin: Diese hier ist sehr modern. Möchten Sie sie anprobieren?
Kunde: Gern. Wo ist die Umkleidekabine?
Verkäuferin: Dort rechts. ... Und? Passt die Jacke?
Kunde: Sie passt gut, aber sie ist zu teuer. 120 Euro!
Verkäuferin: Wir haben auch eine billigere für 60 Euro.</pre>
<p>(helfen = aider · billiger = moins cher)</p>`,
    questions: [
      { type: "qcm", q: "Que cherche le client ?", opts: ["Un pantalon", "Une veste taille 50", "Des chaussures", "Une chemise bleue"], a: 1, exp: "« ich suche eine Jacke in Größe 50 »." },
      { type: "input", q: "Où le client va-t-il essayer la veste ? Complète : « Wo ist die ___? »", a: ["Umkleidekabine","umkleidekabine"], ph: "un mot", exp: "die Umkleidekabine = la cabine." },
      { type: "qcm", q: "La veste va-t-elle au client ?", opts: ["Non, trop petite", "Oui, elle passe bien (bonne taille)", "Non, mauvaise couleur", "On ne sait pas"], a: 1, exp: "« Sie passt gut »." },
      { type: "qcm", q: "Quel est le problème avec cette veste ?", opts: ["Elle est trop chère (120 €)", "Elle est trop grande", "Elle n'est pas moderne", "Il n'y a pas la taille"], a: 0, exp: "« sie ist zu teuer. 120 Euro! »" },
      { type: "vf", q: "La vendeuse propose une alternative moins chère à 60 euros.", a: true, exp: "« Wir haben auch eine billigere für 60 Euro. »" }
    ],
    solution: `<p>Résumé : le client cherche une veste (eine Jacke) en taille 50, l'essaie dans la cabine (Umkleidekabine), elle lui va (sie passt) mais elle est trop chère (zu teuer, 120 €). La vendeuse propose une version moins chère (billiger) à 60 €.</p>
<p>Retiens le trio du shopping : <strong>anprobieren</strong> (essayer), <strong>passen</strong> (aller/taille), <strong>kosten / zu teuer</strong> (coûter / trop cher).</p>`
  }
};
</script>
