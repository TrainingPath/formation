  theory: `
<h3>1. Comment se forme le futur ?</h3>
<p>Le <strong>futur</strong> (das Futur I) se construit avec l'auxiliaire <strong>werden</strong> conjugué au présent (en 2e position) + l'<strong>infinitif</strong> du verbe rejeté tout à la <strong>fin</strong>. C'est la même logique de « pince » qu'au Perfekt, mais avec l'infinitif au lieu du participe.</p>
<pre class="pseudo">Ich  werde  morgen  arbeiten.        // Je travaillerai demain
     (2)                (fin)         // werden en 2e position, infinitif a la fin</pre>
<h3>2. Conjugaison de werden au présent</h3>
<pre class="pseudo">ich werde       wir werden
du wirst        ihr werdet
er/sie wird     sie/Sie werden</pre>
<pre class="pseudo">Du   wirst  das  schaffen.        // Tu vas y arriver
Wir  werden  nach Italien  fliegen.   // Nous irons en Italie (avion)</pre>
<h3>3. Le présent suffit souvent</h3>
<p>Comme en français parlé (« demain je pars »), l'allemand exprime très souvent le futur avec le <strong>présent</strong> + un mot de temps (morgen, nächste Woche, bald).</p>
<pre class="pseudo">Morgen fahre ich nach Bonn.       // Demain je vais/j'irai à Bonn
Nächstes Jahr lerne ich Spanisch. // L'an prochain j'apprendrai l'espagnol</pre>
<h3>4. Quand utiliser werden ?</h3>
<p>Le futur avec werden est utile pour :</p>
<pre class="pseudo">- une prévision :   Es wird morgen regnen.   (Il pleuvra demain)
- une promesse :    Ich werde dir helfen.    (Je t'aiderai)
- une intention forte : Ich werde mehr lernen. (Je vais étudier plus)</pre>
<div class="warn">Ne confonds pas werden (devenir / auxiliaire du futur) avec wollen (vouloir). « Ich werde essen » = je mangerai ; « Ich will essen » = je veux manger.</div>
<div class="tip">La structure reste ta boussole : werden en 2e position, <strong>infinitif à la fin</strong>. Si tu vois werden en 2e position, cherche l'infinitif tout au bout de la phrase.</div>`,

    { type: "qcm", q: "Comment se forme le futur (Futur I) ?", opts: ["haben + participe", "werden + infinitif", "sein + participe", "werden + participe"], a: 1, exp: "werden (conjugué) + infinitif à la fin." },

    { type: "qcm", q: "Quelle phrase exprime correctement le futur ?", opts: ["Ich werde gegessen.", "Ich werde essen.", "Ich werde esse.", "Ich esse werden."], a: 1, exp: "werden + infinitif : Ich werde essen (je mangerai)." },

      { type: "qcm", q: "Comment traduire « Es wird ein tolles Jahr werden » ?", opts: ["C'est une super année", "Ce fut une super année", "Ce sera une super année", "Je veux une super année"], a: 2, exp: "Futur : ce sera (werden … werden : le 2e werden est l'infinitif de « devenir »)." }
    ],
    solution: `<p>La structure du futur, répétée dans tout le texte :</p>
<pre class="pseudo">ich  werde … lernen / fliegen
sie  wird  … kommen
wir  werden … besuchen
es   wird  … werden</pre>
<p>Note la dernière phrase : « wird … werden » — le premier werden est l'auxiliaire du futur, le second est l'infinitif de werden (devenir). Structure certes surprenante, mais parfaitement logique : auxiliaire en 2, infinitif à la fin.</p>`
  }
