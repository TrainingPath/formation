<script>
var DAY = {
  num: 17,
  title: "Voyager : gare, aéroport, hôtel",
  subtitle: "Acheter un billet, s'orienter, réserver une chambre.",
  theory: `
<h3>1. À la gare (der Bahnhof)</h3>
<p>Le train est un moyen de transport très courant en Allemagne. Voici le vocabulaire de base :</p>
<pre class="pseudo">der Zug            le train        die Fahrkarte     le billet
das Gleis          le quai / voie  der Bahnsteig     le quai
die Abfahrt        le départ       die Ankunft       l'arrivée
umsteigen          changer (train) einfach           aller simple
hin und zurück     aller-retour    die Verspätung    le retard</pre>
<p>Au guichet (der Schalter), on demande : <strong>Eine Fahrkarte nach Berlin, bitte.</strong> (Un billet pour Berlin, s'il vous plaît.) On précise : « einfach » (aller simple) ou « hin und zurück » (aller-retour).</p>
<div class="tip">Pour une destination, on utilise <strong>nach</strong> + ville : « nach Berlin, nach München ». Pour un pays avec article, c'est « in die Schweiz », mais pour les villes et pays sans article, toujours <strong>nach</strong>.</div>
<h3>2. À l'aéroport (der Flughafen)</h3>
<pre class="pseudo">das Flugzeug       l'avion         der Flug          le vol
der Koffer         la valise       das Gepäck        les bagages
einchecken         enregistrer     der Ausgang       la sortie / porte
der Reisepass      le passeport    an Bord gehen     embarquer
abfliegen          décoller        landen            atterrir</pre>
<p>Exemple : « Der Flug nach Wien fliegt um 14 Uhr ab. » = Le vol pour Vienne décolle à 14 heures. (Attention, <strong>abfliegen</strong> est un verbe à particule séparable : la particule <em>ab</em> part à la fin, revoir le principe du Perfekt.)</p>
<h3>3. À l'hôtel (das Hotel)</h3>
<p>Pour réserver une chambre (ein Zimmer reservieren) :</p>
<pre class="pseudo">Ich möchte ein Zimmer reservieren.   Je voudrais réserver une chambre.
ein Einzelzimmer                     une chambre simple
ein Doppelzimmer                     une chambre double
für zwei Nächte                      pour deux nuits
mit Frühstück                        avec petit-déjeuner
Haben Sie ein Zimmer frei?           Avez-vous une chambre libre ?</pre>
<p>À la réception (die Rezeption), on demande la clé (der Schlüssel) et l'heure du petit-déjeuner (das Frühstück).</p>
<div class="warn">Piège de vocabulaire : <strong>die Nacht</strong> (la nuit) fait au pluriel <strong>die Nächte</strong> (avec Umlaut). « für drei Nächte » = pour trois nuits. Ne dis pas « Nachten ».</div>
<h3>4. Demander son chemin</h3>
<p>Une fois arrivé, on doit s'orienter. On a déjà vu les prépositions de lieu (jour 12). Rappel utile :</p>
<pre class="pseudo">Wie komme ich zum Bahnhof?       Comment vais-je à la gare ?
Gehen Sie geradeaus.             Allez tout droit.
Biegen Sie links / rechts ab.    Tournez à gauche / à droite.
Es ist gegenüber der Post.       C'est en face de la poste.</pre>`,
  exercises: [
    { type: "qcm", q: "Comment dit-on « le billet (de train) » ?", opts: ["der Koffer", "die Fahrkarte", "das Gleis", "der Schalter"], a: 1, exp: "die Fahrkarte = le billet de train." },
    { type: "input", q: "Complète : « Eine Fahrkarte ___ Berlin, bitte. » (pour Berlin)", a: ["nach"], ph: "préposition", exp: "nach + ville = destination." },
    { type: "qcm", q: "Que signifie « hin und zurück » ?", opts: ["aller simple", "aller-retour", "en retard", "changer de train"], a: 1, exp: "einfach = aller simple ; hin und zurück = aller-retour." },
    { type: "qcm", q: "Que veut dire « umsteigen » ?", opts: ["monter dans le train", "changer de train / correspondance", "descendre", "acheter un billet"], a: 1, exp: "umsteigen = changer (de train, de bus)." },
    { type: "input", q: "Complète : « Ich möchte ein Zimmer ___. » (réserver)", a: ["reservieren"], ph: "verbe", exp: "reservieren = réserver." },
    { type: "qcm", q: "« ein Doppelzimmer » est…", opts: ["une chambre simple", "une chambre double", "une suite", "un lit d'appoint"], a: 1, exp: "Einzelzimmer = simple ; Doppelzimmer = double." },
    { type: "vf", q: "Le pluriel de « die Nacht » est « die Nächte » (avec Umlaut).", a: true, exp: "für zwei Nächte = pour deux nuits." },
    { type: "input", q: "Complète le pluriel : « für drei ___ » (pour trois nuits)", a: ["Nächte","Naechte","nächte","naechte"], ph: "pluriel de Nacht", exp: "die Nacht → die Nächte." },
    { type: "qcm", q: "« der Flug nach Wien fliegt um 14 Uhr ab. » — que fait le vol à 14h ?", opts: ["Il atterrit", "Il décolle", "Il est annulé", "Il embarque"], a: 1, exp: "abfliegen = décoller ; ab part à la fin (verbe séparable)." },
    { type: "qcm", q: "Comment dit-on « les bagages » ?", opts: ["der Ausgang", "das Gepäck", "der Reisepass", "das Gleis"], a: 1, exp: "das Gepäck = les bagages ; der Koffer = la valise." },
    { type: "input", q: "Complète : « ___ Sie geradeaus. » (Allez tout droit — impératif de gehen, vouvoiement)", a: ["Gehen","gehen"], ph: "verbe", exp: "Gehen Sie geradeaus = allez tout droit." },
    { type: "qcm", q: "« Haben Sie ein Zimmer frei? » — que demande le voyageur ?", opts: ["Le prix du billet", "Si une chambre est disponible", "L'heure du départ", "La sortie de l'aéroport"], a: 1, exp: "ein Zimmer frei = une chambre libre/disponible." },
    { type: "qcm", q: "Compréhension : « Der Zug hat 20 Minuten Verspätung. » Que se passe-t-il ?", opts: ["Le train part dans 20 min", "Le train a 20 min de retard", "Le train arrive tôt", "Il faut changer dans 20 min"], a: 1, exp: "die Verspätung = le retard." },
    { type: "qcm", q: "Compréhension : « Ein Einzelzimmer mit Frühstück für zwei Nächte. » Que réserve la personne ?", opts: ["Une chambre double sans petit-déj", "Une chambre simple avec petit-déj pour deux nuits", "Une chambre pour une nuit", "Un vol pour deux personnes"], a: 1, exp: "Einzelzimmer + mit Frühstück + für zwei Nächte." },
    { type: "vf", q: "« nach » s'emploie pour une destination avec un nom de ville : nach Berlin, nach Wien.", a: true, exp: "nach + ville (sans article) = vers cette destination." }
  ],
  final: {
    title: "Exercice final — Am Bahnhof (à la gare)",
    intro: `<p>Écoute (lis) ce dialogue au guichet, puis réponds.</p>
<pre class="pseudo">Reisender: Guten Tag. Eine Fahrkarte nach Hamburg, bitte.
Beamter: Einfach oder hin und zurück?
Reisender: Hin und zurück. Muss ich umsteigen?
Beamter: Ja, in Hannover. Der Zug fährt um 9 Uhr ab, Gleis 4.
Reisender: Und wann komme ich in Hamburg an?
Beamter: Um 12 Uhr. Der Zug hat heute keine Verspätung.</pre>
<p>(der Reisende = le voyageur · der Beamte = l'employé · ankommen = arriver)</p>`,
    questions: [
      { type: "qcm", q: "Où va le voyageur ?", opts: ["Hannover", "Hamburg", "Berlin", "Wien"], a: 1, exp: "« Eine Fahrkarte nach Hamburg »." },
      { type: "qcm", q: "Quel type de billet achète-t-il ?", opts: ["Aller simple", "Aller-retour", "Abonnement", "Billet enfant"], a: 1, exp: "« Hin und zurück »." },
      { type: "input", q: "Dans quelle ville doit-il changer de train ? (umsteigen)", a: ["Hannover","hannover"], ph: "ville", exp: "« Ja, in Hannover. »" },
      { type: "qcm", q: "À quelle heure part le train et de quel quai ?", opts: ["9h, Gleis 4", "12h, Gleis 4", "9h, Gleis 12", "4h, Gleis 9"], a: 0, exp: "« um 9 Uhr ab, Gleis 4 »." },
      { type: "vf", q: "Le train a du retard aujourd'hui.", a: false, exp: "« keine Verspätung » = aucun retard. La réponse correcte est FAUX." }
    ],
    solution: `<p>Trajet : le voyageur achète un billet aller-retour (hin und zurück) pour Hambourg. Il doit changer (umsteigen) à Hanovre. Le train part à 9h du quai 4 (Gleis 4) et arrive (ankommt) à 12h, sans retard (keine Verspätung).</p>
<p>Mots-clés du voyage en train : <strong>Fahrkarte</strong>, <strong>umsteigen</strong>, <strong>Gleis</strong>, <strong>Abfahrt / Ankunft</strong>, <strong>Verspätung</strong>.</p>`
  }
};
</script>
