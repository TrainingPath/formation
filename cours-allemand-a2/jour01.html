<script>
var DAY = {
  num: 1,
  title: "Le parfait (Perfekt) : verbes réguliers",
  subtitle: "Raconter le passé avec haben/sein + participe à la fin.",
  theory: `
<h3>1. Qu'est-ce que le parfait ?</h3>
<p>Le <strong>parfait</strong> (en allemand das <strong>Perfekt</strong>) est le temps du passé le plus utilisé à l'oral, dans les messages et les e-mails. Il correspond au passé composé français (« j'ai joué »). Il se forme toujours en <strong>deux morceaux</strong> : un <strong>auxiliaire</strong> conjugué au présent (haben ou sein) placé en <strong>deuxième position</strong>, et le <strong>participe passé</strong> (das Partizip II) rejeté tout à la <strong>fin</strong> de la phrase.</p>
<pre class="pseudo">Ich  habe  Fußball  gespielt.        // J'ai joué au football
 |    (2)              (fin)          // auxiliaire en 2e position, participe a la fin
sujet auxiliaire       participe</pre>
<h3>2. Le participe des verbes réguliers</h3>
<p>Les verbes <strong>réguliers</strong> (aussi appelés <strong>faibles</strong>, schwache Verben) forment leur participe selon une recette fixe : <strong>ge- + radical + -t</strong>. Le radical, c'est l'infinitif sans la terminaison -en.</p>
<pre class="pseudo">Infinitif     Radical    Participe (ge- + radical + -t)
machen        mach       gemacht      // fait
spielen       spiel      gespielt     // joué
lernen        lern       gelernt      // appris
kaufen        kauf       gekauft      // acheté
wohnen        wohn       gewohnt      // habité</pre>
<h3>3. Radical en -t, -d, -n : on ajoute -et</h3>
<p>Quand le radical se termine par -t, -d, ou consonne + m/n, on glisse un <strong>-e-</strong> avant le -t final pour pouvoir le prononcer.</p>
<pre class="pseudo">arbeiten  → gearbeitet    // travaillé
warten    → gewartet      // attendu
reden     → geredet       // parlé, discuté
regnen    → geregnet      // (es hat geregnet = il a plu)</pre>
<h3>4. Deux exceptions à connaître</h3>
<p>Les verbes en <strong>-ieren</strong> ne prennent <strong>jamais</strong> ge-. Les verbes à préfixe <strong>séparable</strong> intercalent -ge- entre le préfixe et le radical.</p>
<pre class="pseudo">studieren     → studiert      // étudié   (pas de ge-)
telefonieren  → telefoniert   // téléphoné (pas de ge-)
einkaufen     → eingekauft    // fait les courses (ge intercalé)
aufräumen     → aufgeräumt    // rangé</pre>
<div class="warn">Les préfixes <strong>inséparables</strong> (be-, ver-, er-, ent-, ge-) ne prennent pas non plus de ge- : besuchen → <strong>besucht</strong> (rendu visite), verkaufen → <strong>verkauft</strong> (vendu).</div>
<div class="tip">Astuce de lecture : dans une phrase au Perfekt, repère d'abord le petit mot habe/hast/hat… en 2e position, puis file à la fin lire le participe. Tout le sens du verbe est là-bas !</div>`,
  exercises: [
    { type: "input", q: "machen → participe passé : ___ (Ich habe meine Hausaufgaben ___.)", a: ["gemacht"], ph: "ge…t", exp: "Recette : ge- + mach + -t = gemacht (fait)." },
    { type: "input", q: "spielen → participe passé : ___", a: ["gespielt"], ph: "ge…t", exp: "ge- + spiel + -t = gespielt (joué)." },
    { type: "input", q: "arbeiten → participe passé : ___ (radical en -t !)", a: ["gearbeitet"], ph: "ge…et", exp: "Radical arbeit- en -t : on ajoute -et → gearbeitet (travaillé)." },
    { type: "input", q: "studieren → participe passé : ___ (attention au -ieren)", a: ["studiert"], ph: "…t", exp: "Les verbes en -ieren n'ont PAS de ge- : studiert (étudié)." },
    { type: "input", q: "einkaufen → participe passé : ___ (verbe séparable)", a: ["eingekauft"], ph: "ein…t", exp: "-ge- s'intercale : ein + ge + kauf + t = eingekauft." },
    { type: "input", q: "Complète l'auxiliaire : « Wir ___ gestern Tennis gespielt. » (nous)", a: ["haben"], ph: "auxiliaire", exp: "wir haben : l'auxiliaire haben est en 2e position, gespielt à la fin." },
    { type: "qcm", q: "Où se place le participe passé au Perfekt ?", opts: ["En 1re position", "En 2e position", "À la fin de la phrase", "N'importe où"], a: 2, exp: "L'auxiliaire est en 2e position, le participe file à la fin." },
    { type: "qcm", q: "Quel est le participe de <code>telefonieren</code> ?", opts: ["getelefoniert", "telefoniert", "getelefonieren", "telefont"], a: 1, exp: "Verbe en -ieren : pas de ge-, juste telefoniert." },
    { type: "qcm", q: "Quel est le participe de <code>besuchen</code> ?", opts: ["gebesucht", "besucht", "besuchen", "gebesuchen"], a: 1, exp: "Préfixe inséparable be- : pas de ge- → besucht (rendu visite)." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Ich gespielt habe Fußball.", "Ich habe gespielt Fußball.", "Ich habe Fußball gespielt.", "Habe ich Fußball gespielt."], a: 2, exp: "Auxiliaire en 2e position (habe), participe à la fin (gespielt)." },
    { type: "qcm", q: "Pourquoi dit-on <code>gewartet</code> et non <code>gewartt</code> ?", opts: ["Par erreur", "Le radical finit par -t, on ajoute -et pour le prononcer", "warten est irrégulier", "Il faut deux t"], a: 1, exp: "Radical wart- en -t → on insère -e- : gewartet (attendu)." },
    { type: "qcm", q: "Participe de <code>aufräumen</code> (ranger) ?", opts: ["geaufräumt", "aufgeräumt", "aufräumt", "geräumauf"], a: 1, exp: "Séparable : auf + ge + räum + t = aufgeräumt." },
    { type: "vf", q: "Au parfait, le participe passé se place toujours à la fin de la phrase.", a: true, exp: "Oui, c'est la règle d'or : auxiliaire en 2, participe à la fin." },
    { type: "vf", q: "Le verbe studieren forme son participe avec ge- : gestudiert.", a: false, exp: "Faux : les verbes en -ieren n'ont pas de ge-. C'est studiert." },
    { type: "vf", q: "besuchen donne le participe besucht, sans ge-.", a: true, exp: "Vrai : préfixe inséparable be-, donc pas de ge-." }
  ],
  final: {
    title: "Exercice final — Der Tag von Lena",
    intro: `<p>Lis le récit de la journée de Lena, écrit au Perfekt :</p>
<pre class="pseudo">Gestern habe ich viel gemacht. Am Morgen habe ich Deutsch gelernt.
Dann habe ich im Supermarkt eingekauft. Am Nachmittag habe ich mit
Anna telefoniert. Am Abend haben wir zusammen Karten gespielt.
Es war ein schöner Tag.</pre>
<p>(Traduction : Hier, j'ai fait beaucoup. Le matin j'ai appris l'allemand. Puis j'ai fait les courses au supermarché. L'après-midi j'ai téléphoné avec Anna. Le soir nous avons joué aux cartes ensemble. C'était une belle journée.)</p>`,
    questions: [
      { type: "input", q: "Dans « habe ich Deutsch gelernt », quel est le participe passé ? ___", a: ["gelernt"], ph: "participe", exp: "lernen → gelernt (appris)." },
      { type: "qcm", q: "Quel auxiliaire Lena utilise-t-elle partout ici ?", opts: ["sein", "haben", "werden", "les deux"], a: 1, exp: "Tous ces verbes utilisent haben (habe / haben)." },
      { type: "input", q: "einkaufen apparaît sous la forme : ___", a: ["eingekauft"], ph: "participe", exp: "Séparable : eingekauft (fait les courses)." },
      { type: "vf", q: "Le participe telefoniert n'a pas de ge- parce que c'est un verbe en -ieren.", a: true, exp: "Exact : telefonieren → telefoniert." },
      { type: "qcm", q: "Comment traduire « Am Abend haben wir Karten gespielt » ?", opts: ["Le soir nous jouons aux cartes", "Le soir nous avons joué aux cartes", "Demain nous jouerons aux cartes", "Nous voulons jouer aux cartes"], a: 1, exp: "Perfekt = passé : nous avons joué (haben … gespielt)." }
    ],
    solution: `<p>Tous les verbes du texte sont réguliers et emploient l'auxiliaire <strong>haben</strong> :</p>
<pre class="pseudo">machen       → gemacht
lernen       → gelernt
einkaufen    → eingekauft   (séparable)
telefonieren → telefoniert  (-ieren, pas de ge-)
spielen      → gespielt</pre>
<p>Remarque la structure répétée : <strong>habe / haben</strong> en 2e position, participe rejeté à la fin. Seule « Es war » utilise le prétérit de sein (jour 4).</p>`
  }
};
</script>
