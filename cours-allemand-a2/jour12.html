<script>
var DAY = {
  num: 12,
  title: "Les Wechselpräpositionen (lieu)",
  subtitle: "Datif (position) ou accusatif (direction) ?",
  theory: `
<h3>1. Neuf prépositions à deux visages</h3>
<p>Les <strong>Wechselpräpositionen</strong> (« prépositions à alternance ») peuvent être suivies du <strong>datif</strong> OU de l'<strong>accusatif</strong>, selon le sens. Les voici :</p>
<pre class="pseudo">in (dans)      an (à, contre)   auf (sur)
über (au-dessus) unter (sous)   vor (devant)
hinter (derrière) neben (à côté) zwischen (entre)</pre>
<h3>2. La règle d'or : position vs direction</h3>
<p>Deux questions décident du cas :</p>
<pre class="pseudo">wo?   (où ? = position, on reste)   → DATIF
wohin? (vers où ? = direction, on bouge) → ACCUSATIF</pre>
<pre class="pseudo">DATIF (position) :   Das Buch ist  in dem (im) Regal.   // Le livre est dans l'étagère
ACC. (direction) :   Ich lege das Buch  in das (ins) Regal.  // Je pose le livre dans l'étagère</pre>
<h3>3. Comparaison côte à côte</h3>
<pre class="pseudo">POSITION (wo? datif)          DIRECTION (wohin? accusatif)
Ich bin in der Schule.        Ich gehe in die Schule.
Die Lampe hängt an der Wand.  Ich hänge die Lampe an die Wand.
Die Katze sitzt auf dem Sofa. Die Katze springt auf das Sofa.</pre>
<h3>4. Les contractions fréquentes</h3>
<pre class="pseudo">in dem  → im       (datif)     im Kino
in das  → ins      (accusatif) ins Kino
an dem  → am       (datif)     am Fenster
an das  → ans      (accusatif) ans Fenster</pre>
<h3>5. Un truc : verbe statique ou verbe de mouvement ?</h3>
<pre class="pseudo">Verbes de position (datif) : sein, stehen, liegen, sitzen, hängen (état)
Verbes de mouvement (acc.)  : gehen, fahren, legen, stellen, setzen, hängen (action)</pre>
<div class="warn">« hängen » existe dans les deux emplois : « Das Bild hängt an der Wand » (état, datif) vs « Ich hänge das Bild an die Wand » (action, accusatif). C'est le sens qui tranche, pas le verbe seul.</div>
<div class="tip">Réflexe : pose-toi la question. <strong>Wo?</strong> (ça ne bouge pas) → datif (dem/der). <strong>Wohin?</strong> (ça se déplace vers) → accusatif (den/die/das).</div>`,
  exercises: [
    { type: "input", q: "Position (wo?) : « Das Buch liegt auf ___ Tisch. » (der Tisch, datif)", a: ["dem"], ph: "article", exp: "Position → datif : auf dem Tisch." },
    { type: "input", q: "Direction (wohin?) : « Ich lege das Buch auf ___ Tisch. » (accusatif)", a: ["den"], ph: "article", exp: "Direction → accusatif : auf den Tisch." },
    { type: "input", q: "Position : « Ich bin in ___ Schule. » (die Schule, datif fém.)", a: ["der"], ph: "article", exp: "Position → datif fém. : in der Schule." },
    { type: "input", q: "Direction : « Ich gehe in ___ Schule. » (accusatif fém.)", a: ["die"], ph: "article", exp: "Direction → accusatif fém. : in die Schule." },
    { type: "input", q: "Contraction : « Wir gehen ___ Kino. » (in das)", a: ["ins"], ph: "contraction", exp: "in das → ins (accusatif, direction)." },
    { type: "input", q: "Contraction : « Ich sitze ___ Fenster. » (an dem, position)", a: ["am"], ph: "contraction", exp: "an dem → am (datif, position)." },
    { type: "qcm", q: "Quelle question déclenche le DATIF ?", opts: ["wohin? (vers où)", "wo? (où)", "wann? (quand)", "wer? (qui)"], a: 1, exp: "wo? = position → datif." },
    { type: "qcm", q: "Quelle question déclenche l'ACCUSATIF ?", opts: ["wo?", "wohin?", "wem?", "warum?"], a: 1, exp: "wohin? = direction → accusatif." },
    { type: "qcm", q: "« Die Katze springt auf ___ Sofa » (das Sofa) : quel cas ?", opts: ["Datif : dem Sofa", "Accusatif : das Sofa", "Nominatif", "Génitif"], a: 1, exp: "springen = mouvement → accusatif : auf das Sofa." },
    { type: "qcm", q: "Combien de Wechselpräpositionen existe-t-il ?", opts: ["Trois", "Six", "Neuf", "Douze"], a: 2, exp: "Neuf : in, an, auf, über, unter, vor, hinter, neben, zwischen." },
    { type: "qcm", q: "Quels verbes indiquent la position (datif) ?", opts: ["gehen, fahren, legen", "sein, stehen, liegen, sitzen", "kommen, springen", "stellen, setzen"], a: 1, exp: "Verbes d'état → datif : sein, stehen, liegen, sitzen." },
    { type: "qcm", q: "« Das Bild hängt an ___ Wand » (position) : quel cas ?", opts: ["Accusatif : die Wand", "Datif : der Wand", "Nominatif", "Génitif"], a: 1, exp: "hängen (état) → datif : an der Wand." },
    { type: "vf", q: "Les Wechselpräpositionen prennent le datif pour la position, l'accusatif pour la direction.", a: true, exp: "Vrai : wo? datif, wohin? accusatif." },
    { type: "vf", q: "« Ich gehe in die Schule » est à l'accusatif car il y a un mouvement.", a: true, exp: "Vrai : gehen (direction, wohin?) → accusatif." },
    { type: "vf", q: "« Das Buch liegt auf den Tisch » est correct pour une position.", a: false, exp: "Faux : position → datif (auf dem Tisch), pas den." }
  ],
  final: {
    title: "Exercice final — Wo ist die Katze?",
    intro: `<p>Lis ce petit texte et repère position (datif) et direction (accusatif) :</p>
<pre class="pseudo">Die Katze liegt auf dem Sofa. Dann springt sie auf den Tisch.
Der Ball ist unter dem Bett, aber ich lege ihn in die Kiste.
An der Wand hängt ein Bild. Ich gehe in die Küche und stelle die
Tasse auf den Tisch.</pre>
<p>(Traduction : Le chat est allongé sur le canapé. Puis il saute sur la table. Le ballon est sous le lit, mais je le mets dans la boîte. Un tableau est accroché au mur. Je vais dans la cuisine et pose la tasse sur la table.)</p>`,
    questions: [
      { type: "qcm", q: "« Die Katze liegt auf dem Sofa » : pourquoi datif ?", opts: ["Direction", "Position (wo?) : le chat ne bouge pas", "Erreur", "Pluriel"], a: 1, exp: "liegen = état, wo? → datif : auf dem Sofa." },
      { type: "input", q: "« sie springt auf ___ Tisch » (der Tisch, direction) : article ?", a: ["den"], ph: "article", exp: "springen = mouvement → accusatif : auf den Tisch." },
      { type: "qcm", q: "« Der Ball ist unter dem Bett » exprime…", opts: ["une direction (accusatif)", "une position (datif)", "un temps", "une comparaison"], a: 1, exp: "sein = état, wo? → datif : unter dem Bett." },
      { type: "input", q: "« ich lege ihn in ___ Kiste » (die Kiste, direction) : article ?", a: ["die"], ph: "article", exp: "legen = mouvement → accusatif : in die Kiste." },
      { type: "vf", q: "Le texte alterne datif (position) et accusatif (direction) selon le verbe.", a: true, exp: "Vrai : liegen/ist/hängt = datif ; springt/lege/gehe/stelle = accusatif." }
    ],
    solution: `<p>Analyse position / direction :</p>
<pre class="pseudo">DATIF (position, wo?)      ACCUSATIF (direction, wohin?)
auf dem Sofa (liegt)       auf den Tisch (springt)
unter dem Bett (ist)       in die Kiste (lege)
an der Wand (hängt)        in die Küche (gehe), auf den Tisch (stelle)</pre>
<p>La méthode ne change jamais : demande-toi <strong>wo?</strong> (ça reste → datif) ou <strong>wohin?</strong> (ça se déplace vers → accusatif). Les verbes stehen/liegen/sitzen/sein appellent le datif ; legen/stellen/setzen/gehen appellent l'accusatif.</p>`
  }
};
