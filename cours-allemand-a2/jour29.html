<script>
var DAY = {
  num: 29,
  title: "Révisions A2",
  subtitle: "Rassembler la grammaire et le vocabulaire des 28 jours en un panorama.",
  theory: `
<h3>1. Les temps du passé</h3>
<p>Deux temps à connaître (jours 1 à 4, 22) : le <strong>Perfekt</strong> pour raconter, avec haben ou sein + participe passé (à la fin) ; le <strong>Präteritum</strong> surtout pour sein (war), haben (hatte) et les modaux.</p>
<pre class="pseudo">Ich habe einen Film gesehen.     (Perfekt avec haben)
Ich bin nach Hause gegangen.     (Perfekt avec sein : mouvement)
Das Wetter war schön.            (Präteritum de sein)</pre>
<div class="tip">Auxiliaire <strong>sein</strong> pour les verbes de mouvement (gehen, fahren, kommen) et de changement d'état (aufstehen, einschlafen) ; <strong>haben</strong> pour presque tout le reste.</div>
<h3>2. Le futur et le conditionnel</h3>
<pre class="pseudo">werden + infinitif → futur          Ich werde morgen arbeiten.
würde + infinitif → conditionnel    Ich würde gern reisen.
Exceptions conditionnel : wäre (sein), hätte (haben), könnte (können)</pre>
<h3>3. La déclinaison de l'adjectif</h3>
<p>Devant un nom, l'adjectif prend une terminaison (jours 8-9). Rappel des cas les plus fréquents au nominatif/accusatif :</p>
<pre class="pseudo">der gute Kaffee / den guten Kaffee     (article défini)
ein guter Kaffee / einen guten Kaffee  (article indéfini, masculin)
ein rotes Kleid (neutre)  eine gute Idee (féminin)</pre>
<h3>4. Les cas après préposition</h3>
<pre class="pseudo">Datif toujours :   mit, nach, aus, bei, zu, von, seit
Accusatif toujours : für, ohne, gegen, um, durch
Mixtes (Wechsel) :  in, an, auf, unter, über, neben, zwischen, vor, hinter
   → Datif si « où ? » (position) · Accusatif si « où va-t-on ? » (mouvement)</pre>
<h3>5. Les subordonnées et les connecteurs</h3>
<pre class="pseudo">weil, dass, wenn, obwohl → verbe conjugué À LA FIN
und, oder, aber, denn    → ordre normal (sujet + verbe)
deshalb, dann, trotzdem  → INVERSION (verbe + sujet)</pre>
<div class="warn">Le piège classique : denn (ordre normal) vs weil (verbe à la fin). « denn ich bin müde » MAIS « weil ich müde bin ». Revois le jour 23 si besoin.</div>
<h3>6. Le vocabulaire des situations</h3>
<pre class="pseudo">Shopping :   anprobieren, passen, Größe, zu teuer, Ich nehme es.
Voyage :     Fahrkarte, umsteigen, Gleis, ein Zimmer reservieren.
Restaurant : Ich hätte gern..., die Rechnung, bitte.
Météo :      es regnet, es ist sonnig, im Winter.
Loisirs :    In meiner Freizeit..., gern / lieber / am liebsten.</pre>
<h3>7. Écrire correctement</h3>
<p>E-mail amical : <strong>Liebe/Lieber...</strong> → <strong>Liebe Grüße</strong>. E-mail formel : <strong>Sehr geehrte...</strong> → <strong>Mit freundlichen Grüßen</strong>. Ordre des compléments : <strong>TE-KA-MO-LO</strong> (temps → cause → manière → lieu).</p>`,
  exercises: [
    { type: "input", q: "Perfekt : « Ich ___ einen Film gesehen. » (auxiliaire de sehen)", a: ["habe"], ph: "auxiliaire", exp: "sehen → haben : ich habe gesehen." },
    { type: "input", q: "Perfekt : « Ich ___ nach Hause gegangen. » (auxiliaire de gehen)", a: ["bin"], ph: "auxiliaire", exp: "gehen (mouvement) → sein : ich bin gegangen." },
    { type: "qcm", q: "Quel auxiliaire au Perfekt pour « fahren » (aller en véhicule) ?", opts: ["haben", "sein", "werden", "les deux au choix"], a: 1, exp: "Verbe de mouvement → sein : ich bin gefahren." },
    { type: "qcm", q: "Comment forme-t-on le futur ?", opts: ["haben + participe", "werden + infinitif", "würde + participe", "sein + infinitif"], a: 1, exp: "werden + infinitif à la fin." },
    { type: "input", q: "Conditionnel : « Ich ___ gern reisen. » (würde)", a: ["würde","wuerde"], ph: "conditionnel", exp: "würde + infinitif = conditionnel." },
    { type: "qcm", q: "Quel est le conditionnel de « sein » ?", opts: ["würde sein", "wäre", "war", "bin"], a: 1, exp: "sein → wäre (pas « würde sein »)." },
    { type: "input", q: "Déclinaison : « Ich trinke ___ guten Kaffee. » (article indéfini masculin accusatif)", a: ["einen"], ph: "article", exp: "der Kaffee → einen guten Kaffee (accusatif)." },
    { type: "qcm", q: "Quelle préposition demande TOUJOURS le datif ?", opts: ["für", "ohne", "mit", "gegen"], a: 2, exp: "mit + datif (comme nach, aus, bei, zu, von, seit)." },
    { type: "qcm", q: "« Ich lege das Buch auf den Tisch. » Pourquoi « den » (accusatif) ?", opts: ["auf est toujours accusatif", "il y a mouvement vers un endroit (wohin?)", "c'est une faute", "der Tisch est féminin"], a: 1, exp: "Wechselpräposition + mouvement → accusatif." },
    { type: "qcm", q: "Après « weil », où va le verbe conjugué ?", opts: ["en 2e position", "à la fin", "juste après weil", "il disparaît"], a: 1, exp: "weil est subordonnant : verbe à la fin." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Ich bleibe hier, weil ich bin krank.", "Ich bleibe hier, weil ich krank bin.", "Ich bleibe hier, denn ich krank bin.", "Ich bleibe hier, deshalb ich bin krank."], a: 1, exp: "weil → verbe (bin) à la fin." },
    { type: "input", q: "Restaurant : « Ich ___ gern eine Suppe. » (formule polie pour commander, conditionnel de haben)", a: ["hätte","haette"], ph: "conditionnel", exp: "Ich hätte gern = je voudrais." },
    { type: "qcm", q: "Que signifie « umsteigen » ?", opts: ["monter", "descendre", "changer de train", "attendre"], a: 2, exp: "umsteigen = changer de train (voyage)." },
    { type: "qcm", q: "Ordre TE-KA-MO-LO : quel complément vient en premier ?", opts: ["le lieu", "le temps", "la manière", "la cause"], a: 1, exp: "TEmporal : le temps d'abord, le lieu en dernier." },
    { type: "vf", q: "Un e-mail amical se termine par « Mit freundlichen Grüßen ».", a: false, exp: "FAUX : amical = Liebe Grüße ; formel = Mit freundlichen Grüßen." }
  ],
  final: {
    title: "Exercice final — Un texte à comprendre et corriger",
    intro: `<p>Lis ce petit texte (correct) qui mobilise plusieurs points du niveau A2, puis réponds.</p>
<pre class="pseudo">Letztes Wochenende bin ich nach Köln gefahren, weil meine Freundin dort wohnt.
Das Wetter war schön, deshalb sind wir viel spazieren gegangen.
Am Samstag haben wir den Dom besichtigt. Er ist wunderschön!
Danach hätte ich gern einen Kaffee getrunken, aber alle Cafés waren voll.
Nächstes Jahr werde ich wieder nach Köln fahren.</pre>
<p>(der Dom = la cathédrale · voll = plein · wieder = de nouveau)</p>`,
    questions: [
      { type: "qcm", q: "Pourquoi la personne est-elle allée à Cologne ?", opts: ["Pour le travail", "Parce que son amie y habite", "Pour visiter la cathédrale seulement", "Par hasard"], a: 1, exp: "« weil meine Freundin dort wohnt » (weil + verbe à la fin)." },
      { type: "qcm", q: "Quel connecteur exprime la conséquence (beau temps → promenade) ?", opts: ["weil", "deshalb", "aber", "denn"], a: 1, exp: "« deshalb sind wir spazieren gegangen » (inversion)." },
      { type: "input", q: "Quel monument ont-ils visité le samedi ? « den ___ »", a: ["Dom","dom"], ph: "un mot", exp: "« haben wir den Dom besichtigt »." },
      { type: "qcm", q: "Pourquoi n'a-t-elle pas pu boire de café ?", opts: ["Les cafés étaient fermés", "Les cafés étaient pleins", "Elle n'avait pas d'argent", "Elle n'aime pas le café"], a: 1, exp: "« aber alle Cafés waren voll »." },
      { type: "vf", q: "La personne compte retourner à Cologne l'année prochaine (futur).", a: true, exp: "« Nächstes Jahr werde ich wieder nach Köln fahren » (werden + infinitif)." }
    ],
    solution: `<p>Ce texte récapitule le niveau A2 : Perfekt (bin gefahren, haben besichtigt), Präteritum de sein (war, waren), subordonnée avec weil (verbe à la fin), conséquence avec deshalb (inversion), conditionnel (hätte gern getrunken) et futur (werde fahren).</p>
<p>Si tu as tout compris, tu es prêt pour le bilan du jour 30 ! Sinon, reviens sur les jours correspondants : passé (1-4, 22), connecteurs (23), conditionnel (25).</p>`
  }
};
