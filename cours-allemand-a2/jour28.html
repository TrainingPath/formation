<script>
var DAY = {
  num: 28,
  title: "Écrire un message et une carte postale",
  subtitle: "Les formules d'ouverture et de clôture, la structure d'un petit texte.",
  theory: `
<h3>1. Trois registres, trois formules</h3>
<p>Selon le destinataire, on choisit une formule de début (Anrede) et de fin (Grußformel). C'est le premier réflexe : formel ou amical ?</p>
<pre class="pseudo">Registre     Début                          Fin
Formel       Sehr geehrte Frau Meier,       Mit freundlichen Grüßen
             Sehr geehrter Herr Klein,      (Cordialement)
Amical       Liebe Anna, / Lieber Tom,      Liebe Grüße / Viele Grüße
             Hallo Anna,                    Bis bald! (À bientôt !)
Message SMS  Hi! / Hey!                     LG (= Liebe Grüße), Ciao</pre>
<div class="warn">Après la formule d'appel (Anrede), on met une <strong>virgule</strong> et on continue en <strong>minuscule</strong> à la ligne suivante : « Liebe Anna,<br>ich schreibe dir... » (ich sans majuscule, sauf en début de phrase réelle).</div>
<h3>2. La carte postale (die Postkarte)</h3>
<p>Une carte postale est courte (4-6 phrases) et suit toujours le même plan : <strong>où tu es → ce que tu fais → ton impression → une salutation finale</strong>.</p>
<pre class="pseudo">Liebe Oma,

viele Grüße aus Rom! Das Wetter ist super und die Stadt ist wunderschön.
Wir besichtigen jeden Tag Museen und essen viel Eis.
Gestern waren wir im Kolosseum. Es war beeindruckend!
Morgen fahren wir nach Florenz weiter.
Ich vermisse dich!

Bis bald,
deine Lena</pre>
<p>(viele Grüße aus... = bien des salutations de... · wunderschön = magnifique · beeindruckend = impressionnant · vermissen = manquer à qqn)</p>
<h3>3. Le message court (die Nachricht / SMS)</h3>
<p>Pour un SMS ou un message à un ami, on va à l'essentiel. On peut inviter, annuler, ou demander un service :</p>
<pre class="pseudo">Hallo Max,
hast du heute Abend Zeit? Wir gehen ins Kino, willst du mitkommen?
Der Film beginnt um 20 Uhr. Sag mir bitte bis 18 Uhr Bescheid.
LG, Julia</pre>
<p>(Zeit haben = avoir le temps · mitkommen = venir avec · Bescheid sagen = donner sa réponse / prévenir · LG = Liebe Grüße)</p>
<h3>4. Les briques utiles</h3>
<pre class="pseudo">Ouvrir :    Wie geht es dir? / Danke für deine Nachricht.
Inviter :   Hast du Lust auf...? / Willst du mitkommen?
Proposer :  Wollen wir...? / Sollen wir uns treffen?
Répondre :  Ja, gern! / Leider kann ich nicht.
Fixer :     Wann und wo treffen wir uns? / Um 8 Uhr vor dem Kino.
Clore :     Bis bald! / Ich freue mich auf dich!</pre>
<div class="tip">« Hast du Lust auf + accusatif » (as-tu envie de) et « Hast du Lust, ... zu + infinitif » sont deux façons très courantes d'inviter : « Hast du Lust auf einen Kaffee? » / « Hast du Lust, ins Kino zu gehen? »</div>
<h3>5. Un plan simple à réutiliser</h3>
<pre class="pseudo">1. Salutation      (Liebe... / Hallo...)
2. Accroche        (Wie geht es dir? / Viele Grüße aus...)
3. Message         (le contenu : raconter, inviter, demander)
4. Question / demande de réponse
5. Formule finale  (Liebe Grüße / Bis bald)
6. Signature       (dein/deine + prénom)</pre>`,
  exercises: [
    { type: "qcm", q: "Quelle formule de début est FORMELLE ?", opts: ["Hallo Anna,", "Liebe Anna,", "Sehr geehrte Frau Meier,", "Hi!"], a: 2, exp: "Sehr geehrte/r = formule formelle." },
    { type: "qcm", q: "Quelle formule de fin est AMICALE ?", opts: ["Mit freundlichen Grüßen", "Liebe Grüße", "Hochachtungsvoll", "Sehr geehrte Damen"], a: 1, exp: "Liebe Grüße / Viele Grüße = amical." },
    { type: "vf", q: "Après « Liebe Anna, » on continue à la ligne en minuscule (« ich schreibe... »).", a: true, exp: "Virgule après l'appel, puis minuscule à la ligne suivante." },
    { type: "input", q: "Complète l'ouverture d'une carte : « Viele ___ aus Rom! » (bien des salutations)", a: ["Grüße","Grüsse","Gruesse","grüße"], ph: "un mot", exp: "Viele Grüße aus... = bien des salutations de..." },
    { type: "qcm", q: "Que signifie « Ich vermisse dich! » ?", opts: ["Je te déteste", "Tu me manques", "Je t'attends", "Je te vois"], a: 1, exp: "vermissen = manquer (tu me manques)." },
    { type: "qcm", q: "Quel est le plan typique d'une carte postale ?", opts: ["Où je suis → ce que je fais → impression → salutation", "Prix → adresse → date", "Uniquement des salutations", "Une liste de courses"], a: 0, exp: "Lieu, activités, ressenti, formule finale." },
    { type: "input", q: "Complète l'invitation : « Hast du heute Abend ___? » (du temps)", a: ["Zeit","zeit"], ph: "un mot", exp: "Zeit haben = avoir le temps." },
    { type: "qcm", q: "« Willst du mitkommen? » signifie…", opts: ["Veux-tu partir ?", "Veux-tu venir (avec) ?", "Peux-tu m'aider ?", "As-tu fini ?"], a: 1, exp: "mitkommen = venir avec." },
    { type: "qcm", q: "« Sag mir bitte Bescheid » veut dire…", opts: ["Dis-moi au revoir", "Préviens-moi / donne-moi ta réponse", "Achète-moi quelque chose", "Attends-moi"], a: 1, exp: "Bescheid sagen = prévenir, donner sa réponse." },
    { type: "input", q: "Que signifie l'abréviation « LG » à la fin d'un message ? « Liebe ___ »", a: ["Grüße","Grüsse","Gruesse","grüße"], ph: "un mot", exp: "LG = Liebe Grüße (amitiés)." },
    { type: "qcm", q: "Comment inviter avec « avoir envie de » ?", opts: ["Hast du Angst auf...?", "Hast du Lust auf...?", "Hast du Zeit gegen...?", "Bist du Lust...?"], a: 1, exp: "Hast du Lust auf + accusatif = as-tu envie de." },
    { type: "qcm", q: "Comment refuser poliment une invitation ?", opts: ["Ja, gern!", "Leider kann ich nicht.", "Bis bald!", "Wie geht es dir?"], a: 1, exp: "Leider kann ich nicht = malheureusement je ne peux pas." },
    { type: "qcm", q: "Compréhension : « Der Film beginnt um 20 Uhr. » Quand commence le film ?", opts: ["à 18h", "à 20h", "à 8h du matin", "à midi"], a: 1, exp: "um 20 Uhr = à 20 heures." },
    { type: "qcm", q: "Compréhension (carte de Lena) : où ira-t-elle demain ?", opts: ["À Rome", "À Florence (Florenz)", "Chez sa grand-mère", "Au Colisée"], a: 1, exp: "« Morgen fahren wir nach Florenz weiter. »" },
    { type: "vf", q: "« deine Lena » à la fin d'une carte est une signature amicale (ta Lena).", a: true, exp: "dein/deine + prénom = signature affectueuse." }
  ],
  final: {
    title: "Exercice final — Analyser une carte postale",
    intro: `<p>Lis cette carte postale puis réponds.</p>
<pre class="pseudo">Lieber Paul,

herzliche Grüße aus den Alpen! Wir sind seit Montag hier zum Skifahren.
Das Wetter ist kalt, aber sonnig, und es gibt viel Schnee.
Ich fahre jeden Tag Ski, aber gestern bin ich hingefallen. Autsch!
Zum Glück ist nichts passiert. Das Essen im Hotel ist super.
Am Samstag kommen wir zurück. Hast du Lust, danach einen Kaffee zu trinken?

Bis bald,
dein Felix</pre>
<p>(herzliche Grüße = salutations chaleureuses · hinfallen = tomber · zum Glück = heureusement · passieren = arriver/se produire · zurückkommen = revenir)</p>`,
    questions: [
      { type: "qcm", q: "Où se trouve Felix ?", opts: ["À la mer", "Dans les Alpes", "En ville", "À la campagne"], a: 1, exp: "« herzliche Grüße aus den Alpen »." },
      { type: "qcm", q: "Que fait-il là-bas ?", opts: ["De la randonnée", "Du ski", "De la natation", "Du vélo"], a: 1, exp: "« seit Montag hier zum Skifahren »." },
      { type: "qcm", q: "Que lui est-il arrivé hier ?", opts: ["Il est tombé", "Il a perdu ses skis", "Il est tombé malade", "Il a oublié son passeport"], a: 0, exp: "« gestern bin ich hingefallen »." },
      { type: "vf", q: "Il s'est gravement blessé.", a: false, exp: "FAUX : « Zum Glück ist nichts passiert » = heureusement, rien de grave." },
      { type: "input", q: "Quel jour Felix rentre-t-il ? Complète : « Am ___ kommen wir zurück. »", a: ["Samstag","samstag"], ph: "jour", exp: "« Am Samstag kommen wir zurück. »" }
    ],
    solution: `<p>La carte de Felix suit le plan type : lieu (dans les Alpes, aus den Alpen), activité (le ski, Skifahren), une anecdote (il est tombé, hingefallen, mais rien de grave, zum Glück ist nichts passiert), une info pratique (retour samedi) et une invitation (« Hast du Lust, einen Kaffee zu trinken? »).</p>
<p>Retiens la boîte à outils : ouverture (Lieber Paul), salutation de lieu (Grüße aus...), récit au Perfekt, invitation (Hast du Lust, ... zu + infinitif), clôture (Bis bald, dein Felix).</p>`
  }
};
</script>
