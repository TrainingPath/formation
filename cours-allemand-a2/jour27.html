<script>
var DAY = {
  num: 27,
  title: "Compréhension : un e-mail, un article court",
  subtitle: "Lire un texte authentique et en tirer les informations essentielles.",
  theory: `
<h3>1. Comment aborder un texte en allemand</h3>
<p>Au niveau A2, il n'est pas nécessaire de comprendre CHAQUE mot. La bonne stratégie est de <strong>lire deux fois</strong> : une première fois pour saisir le sujet général, une seconde pour repérer les détails (dates, lieux, chiffres). On s'appuie sur les mots qu'on reconnaît et sur le contexte.</p>
<div class="tip">Trois réflexes utiles : repère les <strong>mots interrogatifs cachés</strong> (qui ? quand ? où ?), devine le sens des mots inconnus grâce au contexte, et ne bloque pas sur un mot difficile — continue la lecture.</div>
<h3>2. Un e-mail à lire (die E-Mail)</h3>
<pre class="pseudo">Liebe Sophie,

wie geht es dir? Mir geht es gut! Ich schreibe dir aus München.
Ich bin seit einer Woche hier und mache einen Deutschkurs.
Der Kurs ist toll, aber die Grammatik ist ziemlich schwer.
Meine Gastfamilie ist sehr nett. Sie haben zwei Kinder und einen Hund.
Am Wochenende haben wir einen Ausflug in die Berge gemacht.
Das Wetter war leider schlecht, es hat den ganzen Tag geregnet.
Nächste Woche besuche ich das Deutsche Museum. Kommst du mich besuchen?
Ich freue mich auf deine Antwort!

Liebe Grüße,
Marie</pre>
<p>(die Gastfamilie = la famille d'accueil · der Ausflug = l'excursion · die Berge = les montagnes · den ganzen Tag = toute la journée · die Antwort = la réponse)</p>
<h3>3. Les codes de l'e-mail amical</h3>
<p>Un e-mail informel commence par <strong>Liebe/Lieber + prénom</strong> (Chère/Cher) et se termine par <strong>Liebe Grüße</strong> (Amitiés) ou <strong>Viele Grüße</strong>. On tutoie (du). C'est différent de l'e-mail formel (Sehr geehrte..., Mit freundlichen Grüßen), vu au jour 17.</p>
<h3>4. Un court article à lire (der Artikel)</h3>
<pre class="pseudo">Radfahren wird immer beliebter

In Deutschland fahren immer mehr Menschen mit dem Fahrrad.
Viele Städte bauen neue Radwege, besonders in den Zentren.
Das Fahrrad ist gesund, billig und gut für die Umwelt.
In Berlin gibt es heute über 1,5 Millionen Fahrräder.
Experten sagen: In zehn Jahren wird das Auto weniger wichtig sein.</pre>
<p>(beliebt = populaire · der Radweg = la piste cyclable · die Umwelt = l'environnement · der Experte = l'expert · wichtig = important)</p>
<div class="warn">Attention aux « faux amis » et aux nombres à l'allemande : « 1,5 Millionen » = 1,5 million (la virgule marque la décimale, comme en français). « über » ici veut dire « plus de » (über 1,5 Millionen = plus de 1,5 million).</div>
<h3>5. Repérer l'information</h3>
<p>Pour répondre à une question de compréhension, on cherche le <strong>mot-clé</strong> de la question dans le texte, puis on lit la phrase autour. Exemple : la question porte sur le « Wetter » ? On cherche « Wetter » ou un mot météo (« geregnet ») dans l'e-mail.</p>`,
  exercises: [
    { type: "qcm", q: "D'où Marie écrit-elle son e-mail ?", opts: ["Berlin", "München", "Hamburg", "Wien"], a: 1, exp: "« Ich schreibe dir aus München. »" },
    { type: "qcm", q: "Depuis combien de temps Marie est-elle là-bas ?", opts: ["depuis un jour", "depuis une semaine", "depuis un mois", "depuis un an"], a: 1, exp: "« Ich bin seit einer Woche hier. »" },
    { type: "qcm", q: "Que fait Marie à München ?", opts: ["Elle travaille", "Elle suit un cours d'allemand", "Elle est en vacances", "Elle étudie la médecine"], a: 1, exp: "« mache einen Deutschkurs »." },
    { type: "vf", q: "D'après l'e-mail, Marie trouve la grammaire assez difficile.", a: true, exp: "« die Grammatik ist ziemlich schwer »." },
    { type: "qcm", q: "Comment est sa famille d'accueil (Gastfamilie) ?", opts: ["désagréable", "très gentille", "absente", "bruyante"], a: 1, exp: "« Meine Gastfamilie ist sehr nett. »" },
    { type: "input", q: "Combien d'enfants a la famille d'accueil ? (le nombre)", a: ["zwei","2"], ph: "nombre", exp: "« Sie haben zwei Kinder und einen Hund. »" },
    { type: "qcm", q: "Quel temps a-t-il fait pendant l'excursion en montagne ?", opts: ["Il a fait beau", "Il a plu toute la journée", "Il a neigé", "Il y a eu du vent"], a: 1, exp: "« es hat den ganzen Tag geregnet »." },
    { type: "qcm", q: "Que va faire Marie la semaine prochaine ?", opts: ["Rentrer chez elle", "Visiter le Deutsches Museum", "Commencer à travailler", "Partir à Berlin"], a: 1, exp: "« Nächste Woche besuche ich das Deutsche Museum. »" },
    { type: "input", q: "Comment se termine cet e-mail amical ? « ___ Grüße, Marie » (Amitiés)", a: ["Liebe","liebe"], ph: "un mot", exp: "Liebe Grüße = formule amicale de clôture." },
    { type: "vf", q: "L'e-mail est formel (il commence par « Sehr geehrte Damen und Herren »).", a: false, exp: "FAUX : il commence par « Liebe Sophie » et tutoie : c'est amical." },
    { type: "qcm", q: "Article : de quoi parle le texte « Radfahren wird immer beliebter » ?", opts: ["Des voitures électriques", "Du vélo qui devient de plus en plus populaire", "Des trains en Allemagne", "Du tourisme"], a: 1, exp: "beliebt = populaire ; il s'agit du vélo (Radfahren)." },
    { type: "qcm", q: "Article : pourquoi le vélo est-il présenté positivement ?", opts: ["Il est rapide et cher", "Il est sain, bon marché et bon pour l'environnement", "Il est à la mode", "Il est confortable"], a: 1, exp: "« gesund, billig und gut für die Umwelt »." },
    { type: "input", q: "Article : combien de vélos y a-t-il à Berlin ? Complète : « über 1,5 ___ »", a: ["Millionen","millionen"], ph: "un mot", exp: "« über 1,5 Millionen Fahrräder »." },
    { type: "qcm", q: "Article : que prédisent les experts pour dans dix ans ?", opts: ["Plus de voitures", "La voiture deviendra moins importante", "Le vélo disparaîtra", "Rien ne changera"], a: 1, exp: "« das Auto wird weniger wichtig sein »." },
    { type: "vf", q: "Dans « über 1,5 Millionen », le mot « über » signifie ici « plus de ».", a: true, exp: "über 1,5 Millionen = plus de 1,5 million." }
  ],
  final: {
    title: "Exercice final — Eine Anzeige (une petite annonce)",
    intro: `<p>Lis cette petite annonce puis réponds.</p>
<pre class="pseudo">Zimmer zu vermieten!

Wir vermieten ab dem 1. September ein schönes Zimmer in einer WG.
Das Zimmer ist 18 Quadratmeter groß, hell und möbliert.
Die Wohnung liegt zentral, nur fünf Minuten vom Bahnhof.
Die Miete beträgt 400 Euro pro Monat, inklusive Strom.
Wir sind drei Studenten und suchen eine nette, ruhige Person.
Interesse? Schreib eine E-Mail an: wg-mitte@mail.de</pre>
<p>(vermieten = louer · die WG = la colocation · Quadratmeter = mètre carré · möbliert = meublé · die Miete = le loyer · der Strom = l'électricité)</p>`,
    questions: [
      { type: "qcm", q: "À partir de quand la chambre est-elle disponible ?", opts: ["1er août", "1er septembre", "1er octobre", "tout de suite"], a: 1, exp: "« ab dem 1. September »." },
      { type: "input", q: "Quelle est la taille de la chambre en m² ? (le nombre)", a: ["18","18 Quadratmeter"], ph: "nombre", exp: "« 18 Quadratmeter groß »." },
      { type: "qcm", q: "Où se situe l'appartement ?", opts: ["Loin de tout", "En centre-ville, à 5 min de la gare", "À la campagne", "Près de l'aéroport"], a: 1, exp: "« zentral, nur fünf Minuten vom Bahnhof »." },
      { type: "qcm", q: "Combien coûte le loyer par mois ?", opts: ["400 euros, électricité comprise", "400 euros sans charges", "500 euros", "300 euros"], a: 0, exp: "« 400 Euro pro Monat, inklusive Strom »." },
      { type: "vf", q: "Les colocataires cherchent une personne gentille et calme.", a: true, exp: "« suchen eine nette, ruhige Person »." }
    ],
    solution: `<p>L'annonce propose une chambre en colocation (WG) à louer à partir du 1er septembre : 18 m², claire et meublée, en centre-ville à 5 minutes de la gare, pour un loyer (Miete) de 400 € par mois électricité comprise (inklusive Strom). Les trois étudiants cherchent une personne gentille et calme.</p>
<p>Méthode : on repère les mots-clés (Datum, Größe, Miete, Lage) et on lit la phrase autour, sans chercher à tout comprendre. C'est l'essentiel de la compréhension écrite au niveau A2.</p>`
  }
};
