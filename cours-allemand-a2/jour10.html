  title: "Le datif : pronoms et verbes",
  subtitle: "mir, dir, ihm… et les verbes qui exigent le datif.",
  theory: `
<h3>1. À quoi sert le datif ?</h3>
<p>Le <strong>datif</strong> (der Dativ) est le cas du <strong>complément d'attribution</strong> : il répond à la question « à qui ? » (wem?). En français : « Je donne un livre <strong>à Anna</strong> ». Anna est au datif.</p>
<pre class="pseudo">Ich gebe  dem Mann  ein Buch.     // Je donne un livre à l'homme
          (datif)   (accusatif)</pre>
<h3>2. Les pronoms personnels au datif</h3>
<pre class="pseudo">Nominatif   Datif       Traduction
ich         mir         à moi / me
du          dir         à toi / te
er          ihm         à lui / lui
sie (elle)  ihr         à elle / lui
es          ihm         (neutre)
wir         uns         à nous / nous
ihr         euch        à vous
sie/Sie     ihnen/Ihnen à eux / leur</pre>
<pre class="pseudo">Kannst du  mir  helfen?        // Peux-tu m'aider ?
Ich gebe   dir  das Buch.      // Je te donne le livre
Das gehört ihm.               // Cela lui appartient</pre>
<h3>3. Les verbes qui se construisent avec le datif</h3>
<p>Certains verbes exigent toujours le datif (là où le français mettrait un objet direct). À mémoriser :</p>
<pre class="pseudo">helfen    aider          Ich helfe dir.
danken    remercier      Ich danke dir.
gehören   appartenir     Das Buch gehört mir.
gefallen  plaire         Der Film gefällt mir.  (Le film me plaît)
antworten répondre       Ich antworte dir.
folgen    suivre         Folgen Sie mir!</pre>
<h3>4. La tournure « gefallen » et « schmecken »</h3>
<p>Pour dire « j'aime » un objet ou un plat, l'allemand retourne la phrase : c'est la chose qui « plaît à » quelqu'un.</p>
<pre class="pseudo">Der Film gefällt mir.        // Le film me plaît (= j'aime le film)
Die Suppe schmeckt mir.      // La soupe me plaît (au goût)
Wie geht es dir?             // Comment vas-tu ? (littér. : comment va-t-il à toi)</pre>
<div class="warn">Avec ces verbes, la personne est au datif (mir, dir, ihm…), pas à l'accusatif. On dit « Ich helfe dir », jamais « Ich helfe dich ».</div>
<div class="tip">Beaucoup d'expressions du quotidien sont au datif : Wie geht es dir? / Das gefällt mir / Es tut mir leid (je suis désolé). Apprends-les en bloc.</div>`,
  exercises: [
    { type: "input", q: "Pronom datif de ich : « Kannst du ___ helfen? »", a: ["mir"], ph: "datif", exp: "ich → mir (m'aider)." },
    { type: "input", q: "Pronom datif de du : « Ich gebe ___ das Buch. »", a: ["dir"], ph: "datif", exp: "du → dir (je te donne)." },
    { type: "input", q: "Pronom datif de er : « Das Auto gehört ___. »", a: ["ihm"], ph: "datif", exp: "er → ihm (cela lui appartient)." },
    { type: "input", q: "Pronom datif de wir : « Er hilft ___. »", a: ["uns"], ph: "datif", exp: "wir → uns (il nous aide)." },
    { type: "input", q: "Complète l'expression : « Wie geht es ___? » (à toi)", a: ["dir"], ph: "datif", exp: "Wie geht es dir? = Comment vas-tu ?" },
    { type: "input", q: "Complète : « Der Film gefällt ___. » (à moi)", a: ["mir"], ph: "datif", exp: "gefallen + datif : gefällt mir (me plaît)." },
    { type: "qcm", q: "À quelle question répond le datif ?", opts: ["wen? (qui, COD)", "wem? (à qui)", "was? (quoi)", "wo? (où)"], a: 1, exp: "Le datif = complément d'attribution, wem? (à qui)." },
    { type: "qcm", q: "Quel verbe se construit avec le datif ?", opts: ["sehen", "helfen", "kaufen", "essen"], a: 1, exp: "helfen + datif : Ich helfe dir." },
    { type: "qcm", q: "« Ich danke ___ » (à vous, forme ihr) : quel pronom ?", opts: ["euch", "ihr", "Sie", "ihnen"], a: 0, exp: "ihr → euch : Ich danke euch." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["Ich helfe dich.", "Ich helfe dir.", "Ich helfe du.", "Ich helfe dein."], a: 1, exp: "helfen exige le datif : dir, pas dich." },
    { type: "qcm", q: "« Die Suppe schmeckt mir » signifie…", opts: ["Je goûte la soupe", "La soupe me plaît (au goût)", "Je cuisine la soupe", "La soupe est froide"], a: 1, exp: "schmecken + datif : le plat plaît à quelqu'un." },
    { type: "qcm", q: "Pronom datif de sie/Sie (pluriel/politesse) ?", opts: ["ihm", "ihr", "ihnen/Ihnen", "uns"], a: 2, exp: "sie (eux) → ihnen ; Sie (vous poli) → Ihnen." },
    { type: "vf", q: "Le verbe gefallen se construit avec le datif (Der Film gefällt mir).", a: true, exp: "Vrai : gefallen + datif = plaire à quelqu'un." },
    { type: "vf", q: "On dit « Ich helfe dich » à l'accusatif.", a: false, exp: "Faux : helfen exige le datif : Ich helfe dir." },
    { type: "vf", q: "Dans « Ich gebe dem Mann ein Buch », dem Mann est au datif.", a: true, exp: "Vrai : le destinataire (à qui) est au datif." }
  ],
  final: {
    title: "Exercice final — Ein hilfsbereiter Tag",
    intro: `<p>Lis ce petit dialogue et réponds aux questions de compréhension :</p>
<pre class="pseudo">Anna:  Kannst du mir bitte helfen? Der Schrank ist zu schwer.
Tom:   Klar, ich helfe dir gern. Wohin soll er?
Anna:  Danke! Er gehört meiner Schwester. Gefällt er dir?
Tom:   Ja, er gefällt mir sehr. Sag ihr, es war kein Problem.</pre>
<p>(Traduction : Anna : Peux-tu m'aider s'il te plaît ? L'armoire est trop lourde. Tom : Bien sûr, je t'aide volontiers. Où doit-elle aller ? Anna : Merci ! Elle appartient à ma sœur. Elle te plaît ? Tom : Oui, elle me plaît beaucoup. Dis-lui que ce n'était pas un problème.)</p>`,
    questions: [
      { type: "qcm", q: "Que demande Anna à Tom ?", opts: ["De partir", "De l'aider (helfen + datif)", "De vendre l'armoire", "Un café"], a: 1, exp: "« Kannst du mir helfen? » = Peux-tu m'aider ?" },
      { type: "input", q: "« ich helfe ___ gern » : quel pronom datif Tom utilise-t-il ?", a: ["dir"], ph: "datif", exp: "du → dir : je t'aide volontiers." },
      { type: "qcm", q: "À qui appartient l'armoire ?", opts: ["À Tom", "À Anna", "À la sœur d'Anna (meiner Schwester)", "À personne"], a: 2, exp: "« Er gehört meiner Schwester » = à ma sœur." },
      { type: "input", q: "« er gefällt ___ sehr » : quel pronom pour « à moi » (Tom) ?", a: ["mir"], ph: "datif", exp: "gefallen + datif : gefällt mir (me plaît)." },
      { type: "vf", q: "gehören, helfen et gefallen se construisent tous avec le datif.", a: true, exp: "Vrai : ce sont trois verbes classiques à datif." }
    ],
    solution: `<p>Le dialogue enchaîne les datifs :</p>
<pre class="pseudo">helfen  → mir, dir      (Kannst du mir helfen / ich helfe dir)
gehören → meiner Schwester (l'armoire appartient à…)
gefallen→ dir, mir      (Gefällt er dir? / er gefällt mir)
Sag ihr → ihr           (datif : dis-lui, à elle)</pre>
<p>Retiens les pronoms datif (mir, dir, ihm, ihr, uns, euch, ihnen) et le groupe de verbes helfen / danken / gehören / gefallen / antworten / folgen. Ce sont eux qui déclenchent le datif dans la vie de tous les jours.</p>`
  }
};
