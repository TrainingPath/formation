<script>
var DAY = {
  num: 8,
  title: "La déclinaison de l'adjectif (article défini)",
  subtitle: "-e ou -en ? Accorder l'adjectif après der/die/das.",
  theory: `
<h3>1. Pourquoi l'adjectif change-t-il ?</h3>
<p>Quand un adjectif est placé <strong>devant un nom</strong> (adjectif épithète), il prend une <strong>terminaison</strong> qui dépend du genre, du nombre et du cas. Après le verbe, il ne change pas : « Das Auto ist neu » (invariable), mais « das <strong>neue</strong> Auto » (accordé).</p>
<h3>2. La règle après l'article défini (der/die/das)</h3>
<p>Bonne nouvelle : après der/die/das/die, il n'y a que <strong>deux terminaisons</strong> possibles : <strong>-e</strong> ou <strong>-en</strong>. La terminaison -e apparaît seulement au nominatif singulier (et à l'accusatif féminin/neutre) ; partout ailleurs, c'est -en.</p>
<pre class="pseudo">              MASCULIN      FÉMININ       NEUTRE        PLURIEL
NOMINATIF     der -e        die -e        das -e        die -en
ACCUSATIF     den -en       die -e        das -e        die -en
DATIF         dem -en       der -en       dem -en       den -en</pre>
<h3>3. Le « bloc des -e » à mémoriser</h3>
<p>Les cases en -e forment une petite zone facile à retenir (nominatif singulier + accusatif féminin/neutre) ; <strong>tout le reste est en -en</strong>.</p>
<pre class="pseudo">der neue Wagen        // le nouveau véhicule (nom. masc.)
die kleine Katze      // le petit chat (nom./acc. fém.)
das alte Haus         // la vieille maison (nom./acc. neutre)
den neuen Wagen       // (acc. masc.)  → -en
die neuen Autos       // (plur.)       → -en</pre>
<h3>4. Exemples aux différents cas</h3>
<pre class="pseudo">Nom.  Der große Mann kommt.        // Le grand homme vient
Acc.  Ich sehe den großen Mann.    // Je vois le grand homme  (-en)
Dat.  mit dem großen Mann          // avec le grand homme     (-en)
Dat.  in der kleinen Stadt         // dans la petite ville    (-en)</pre>
<div class="warn">Retiens surtout : à l'<strong>accusatif masculin</strong> (den) et à tout le <strong>datif</strong> et le <strong>pluriel</strong>, l'adjectif est en <strong>-en</strong>. Le -e est réservé aux cas « simples » (nominatif singulier).</div>
<div class="tip">Méthode express : si l'article est der, die, das au nominatif (ou die/das à l'accusatif) → <strong>-e</strong>. Dans absolument tous les autres cas → <strong>-en</strong>.</div>`,
  exercises: [
    { type: "input", q: "Nom. masc. : « der ___ Wagen » (neu = neuf)", a: ["neue"], ph: "-e / -en", exp: "Nominatif masc. → -e : der neue Wagen." },
    { type: "input", q: "Nom. fém. : « die ___ Katze » (klein = petit)", a: ["kleine"], ph: "-e / -en", exp: "Nominatif fém. → -e : die kleine Katze." },
    { type: "input", q: "Nom. neutre : « das ___ Haus » (alt = vieux)", a: ["alte"], ph: "-e / -en", exp: "Nominatif neutre → -e : das alte Haus." },
    { type: "input", q: "Acc. masc. : « Ich sehe den ___ Mann. » (groß = grand)", a: ["großen", "grossen", "großen"], ph: "-e / -en", exp: "Accusatif masc. (den) → -en : den großen Mann." },
    { type: "input", q: "Datif fém. : « in der ___ Stadt » (klein)", a: ["kleinen"], ph: "-e / -en", exp: "Datif → -en : in der kleinen Stadt." },
    { type: "input", q: "Pluriel : « die ___ Autos » (neu)", a: ["neuen"], ph: "-e / -en", exp: "Pluriel → -en : die neuen Autos." },
    { type: "qcm", q: "Après der/die/das, combien de terminaisons d'adjectif sont possibles ?", opts: ["Une seule", "Deux : -e ou -en", "Quatre", "Six"], a: 1, exp: "Seulement -e ou -en après l'article défini." },
    { type: "qcm", q: "Quelle terminaison au nominatif masculin (der … Mann) ?", opts: ["-e", "-en", "-er", "-es"], a: 0, exp: "Nominatif singulier → -e : der große Mann." },
    { type: "qcm", q: "« Ich sehe den ___ Hund » (klein) : quelle terminaison ?", opts: ["kleine", "kleinen", "kleiner", "kleines"], a: 1, exp: "Accusatif masculin (den) → -en : den kleinen Hund." },
    { type: "qcm", q: "Au datif, l'adjectif est toujours en…", opts: ["-e", "-en", "-er", "-es"], a: 1, exp: "Datif → -en, dans tous les genres et au pluriel." },
    { type: "qcm", q: "Quelle phrase est correcte ?", opts: ["das alten Haus", "das alte Haus", "das alter Haus", "das altes Haus"], a: 1, exp: "Nominatif neutre → -e : das alte Haus." },
    { type: "qcm", q: "Au pluriel après die, l'adjectif prend…", opts: ["-e", "-en", "-er", "rien"], a: 1, exp: "Pluriel → -en : die neuen Autos." },
    { type: "vf", q: "Un adjectif après le verbe (Das Auto ist neu) ne prend pas de terminaison.", a: true, exp: "Vrai : seul l'adjectif épithète (devant le nom) se décline." },
    { type: "vf", q: "Après l'article défini, l'accusatif masculin donne -e (den große Mann).", a: false, exp: "Faux : accusatif masculin → -en (den großen Mann)." },
    { type: "vf", q: "Le nominatif singulier (der/die/das) donne la terminaison -e.", a: true, exp: "Vrai : der neue, die kleine, das alte." }
  ],
  final: {
    title: "Exercice final — Im Möbelhaus",
    intro: `<p>Un client décrit ce qu'il voit dans un magasin de meubles. Observe les terminaisons :</p>
<pre class="pseudo">Der neue Tisch ist schön. Ich kaufe den großen Schrank und die
kleine Lampe. Das rote Sofa gefällt mir auch. Mit dem alten Stuhl
möchte ich nichts machen. Die teuren Möbel sind zu teuer für mich.</pre>
<p>(Traduction : La nouvelle table est belle. J'achète la grande armoire et la petite lampe. Le canapé rouge me plaît aussi. Je ne veux rien faire de la vieille chaise. Les meubles chers sont trop chers pour moi.)</p>`,
    questions: [
      { type: "input", q: "« den ___ Schrank » (groß, acc. masc.) : terminaison ?", a: ["großen", "grossen", "großen"], ph: "-e / -en", exp: "Accusatif masculin → -en : den großen Schrank." },
      { type: "input", q: "« die ___ Lampe » (klein, acc. fém.) : terminaison ?", a: ["kleine"], ph: "-e / -en", exp: "Accusatif féminin → -e : die kleine Lampe." },
      { type: "qcm", q: "Pourquoi « mit dem alten Stuhl » prend -en ?", opts: ["Erreur", "Datif → -en", "Nominatif → -en", "Pluriel"], a: 1, exp: "mit régit le datif ; au datif l'adjectif est en -en." },
      { type: "input", q: "« Die ___ Möbel » (teuer, pluriel) : terminaison ?", a: ["teuren"], ph: "-e / -en", exp: "Pluriel → -en : die teuren Möbel." },
      { type: "vf", q: "« Der neue Tisch » a un -e car c'est un nominatif masculin singulier.", a: true, exp: "Vrai : nominatif singulier → -e." }
    ],
    solution: `<p>Décodage des terminaisons du texte :</p>
<pre class="pseudo">der neue Tisch      → -e   (nom. masc. sing.)
den großen Schrank  → -en  (acc. masc.)
die kleine Lampe    → -e   (acc. fém.)
das rote Sofa       → -e   (nom./acc. neutre)
dem alten Stuhl     → -en  (datif)
die teuren Möbel    → -en  (pluriel)</pre>
<p>La clé : <strong>-e</strong> au nominatif singulier (et accusatif fém./neutre), <strong>-en</strong> partout ailleurs (accusatif masculin, datif, pluriel). Avec l'article défini, tu ne peux jamais te tromper de plus d'une lettre !</p>`
  }
};
</script>
