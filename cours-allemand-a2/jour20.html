<script>
var DAY = {
  num: 20,
  title: "Le temps qu'il fait",
  subtitle: "Parler de la météo, des saisons et donner ses impressions.",
  theory: `
<h3>1. Comment est le temps ? (Wie ist das Wetter?)</h3>
<p>La question de base est <strong>Wie ist das Wetter?</strong> (Quel temps fait-il ?). On répond souvent avec la structure impersonnelle <strong>es ist</strong> + adjectif :</p>
<pre class="pseudo">Es ist sonnig.        Il fait (du) soleil.    Es ist bewölkt.   C'est nuageux.
Es ist warm.          Il fait chaud.          Es ist kalt.      Il fait froid.
Es ist windig.        Il y a du vent.         Es ist neblig.    Il y a du brouillard.
Es ist heiß.          Il fait très chaud.     Es ist kühl.      Il fait frais.</pre>
<h3>2. Le temps avec un verbe : es + regnen / schneien</h3>
<p>Certains phénomènes s'expriment avec un verbe et le pronom impersonnel <strong>es</strong> :</p>
<pre class="pseudo">Es regnet.        Il pleut.        (regnen = pleuvoir)
Es schneit.       Il neige.        (schneien = neiger)
Die Sonne scheint.  Le soleil brille.  (scheinen = briller)
Es blitzt und donnert.  Il y a des éclairs et du tonnerre.</pre>
<div class="tip">Ne mélange pas les deux structures. On dit <strong>es regnet</strong> (verbe seul), mais <strong>es ist sonnig</strong> (es ist + adjectif). Ne dis jamais « es ist regnet ».</div>
<h3>3. Les noms de la météo</h3>
<pre class="pseudo">die Sonne     le soleil       der Regen     la pluie
der Schnee    la neige        der Wind      le vent
das Gewitter  l'orage         der Nebel     le brouillard
die Wolke     le nuage        die Temperatur   la température</pre>
<p>Pour la température : « Es sind 20 Grad. » (Il fait 20 degrés.) On dit aussi « minus 5 Grad » pour -5°C.</p>
<h3>4. Les saisons (die Jahreszeiten)</h3>
<pre class="pseudo">der Frühling   le printemps    der Sommer    l'été
der Herbst     l'automne       der Winter    l'hiver</pre>
<p>Pour dire « en » une saison, on utilise <strong>im</strong> (in + dem) : <em>im Sommer</em> (en été), <em>im Winter</em> (en hiver). « Im Winter schneit es oft. » = En hiver, il neige souvent.</p>
<div class="warn">Avec « im Sommer » en début de phrase, n'oublie pas l'inversion (verbe en 2e position) : « <strong>Im Winter schneit es</strong> oft » (verbe schneit avant le sujet es).</div>
<h3>5. Donner son impression</h3>
<p>On exprime son ressenti avec des adjectifs comme <code>schön</code> (beau), <code>schlecht</code> (mauvais), <code>furchtbar</code> (affreux) :</p>
<pre class="pseudo">Heute ist das Wetter schön.        Aujourd'hui il fait beau.
Gestern war das Wetter schlecht.   Hier il faisait mauvais.  (war = Präteritum de sein)
Morgen soll es regnen.             Demain il devrait pleuvoir.</pre>
<p>Note le passé avec <strong>war</strong> (était) : « Das Wetter war furchtbar » = Le temps était affreux.</p>`,
  exercises: [
    { type: "input", q: "Complète la question : « Wie ist das ___? » (Quel temps fait-il ?)", a: ["Wetter","wetter"], ph: "un mot", exp: "Wie ist das Wetter? = quel temps fait-il ?" },
    { type: "qcm", q: "Comment dit-on « il pleut » ?", opts: ["Es ist Regen.", "Es regnet.", "Es ist regnet.", "Es Regen."], a: 1, exp: "regnen est un verbe : es regnet." },
    { type: "qcm", q: "Comment dit-on « c'est nuageux » ?", opts: ["Es bewölkt.", "Es ist bewölkt.", "Es wolkt.", "Es Wolke."], a: 1, exp: "bewölkt est un adjectif : es ist bewölkt." },
    { type: "vf", q: "On dit « es ist sonnig » (adjectif) mais « es regnet » (verbe), jamais « es ist regnet ».", a: true, exp: "Verbe seul (es regnet) OU es ist + adjectif (es ist sonnig)." },
    { type: "input", q: "Complète : « Es ___. » (Il neige — verbe schneien)", a: ["schneit"], ph: "verbe", exp: "schneien → es schneit." },
    { type: "qcm", q: "Que signifie « Die Sonne scheint » ?", opts: ["Le soleil se couche", "Le soleil brille", "Il fait froid", "Il y a des nuages"], a: 1, exp: "scheinen = briller ; die Sonne scheint = le soleil brille." },
    { type: "qcm", q: "Comment dit-on « le brouillard » ?", opts: ["der Wind", "der Nebel", "der Schnee", "das Gewitter"], a: 1, exp: "der Nebel = le brouillard ; es ist neblig = il y a du brouillard." },
    { type: "input", q: "Complète : « ___ Winter schneit es oft. » (En hiver — contraction in + dem)", a: ["Im","im"], ph: "contraction", exp: "in + dem = im ; im Winter = en hiver." },
    { type: "qcm", q: "Quelle est la bonne phrase avec inversion ?", opts: ["Im Sommer es ist warm.", "Im Sommer ist es warm.", "Im Sommer warm ist es.", "Es im Sommer ist warm."], a: 1, exp: "Après un complément en 1re position, le verbe reste en 2e : ist es warm." },
    { type: "qcm", q: "Comment dit-on « il fait 20 degrés » ?", opts: ["Es ist 20 Grad.", "Es hat 20 Grad.", "Es macht 20 Grad.", "Es Grad 20."], a: 0, exp: "Es sind 20 Grad / Es ist 20 Grad = il fait 20 degrés." },
    { type: "input", q: "Complète le passé : « Gestern ___ das Wetter schlecht. » (Präteritum de sein)", a: ["war"], ph: "sein au passé", exp: "sein → war (il était) : le temps était mauvais." },
    { type: "qcm", q: "Quelle saison est « der Herbst » ?", opts: ["le printemps", "l'été", "l'automne", "l'hiver"], a: 2, exp: "Frühling=printemps, Sommer=été, Herbst=automne, Winter=hiver." },
    { type: "qcm", q: "Compréhension : « Heute ist es kalt und windig, und es regnet. » Quel temps fait-il ?", opts: ["Chaud et ensoleillé", "Froid, venteux et pluvieux", "Neigeux et calme", "Chaud avec du brouillard"], a: 1, exp: "kalt = froid, windig = venteux, es regnet = il pleut." },
    { type: "qcm", q: "Compréhension : « Morgen soll die Sonne scheinen und es wird warm. » Que prévoit-on ?", opts: ["De la pluie et du froid", "Du soleil et de la chaleur", "De la neige", "Du brouillard"], a: 1, exp: "die Sonne scheinen + es wird warm = soleil et chaleur." },
    { type: "vf", q: "« im Sommer » signifie « en été ».", a: true, exp: "im (in+dem) + saison = en cette saison." }
  ],
  final: {
    title: "Exercice final — Der Wetterbericht (le bulletin météo)",
    intro: `<p>Lis ce bulletin météo puis réponds.</p>
<pre class="pseudo">Guten Morgen! Hier ist der Wetterbericht.
Im Norden ist es heute bewölkt, und am Nachmittag regnet es.
Im Süden scheint die Sonne, es ist warm, etwa 25 Grad.
Im Osten ist es windig und kühl, nur 12 Grad.
Morgen wird das Wetter besser: überall Sonne!</pre>
<p>(der Wetterbericht = le bulletin météo · am Nachmittag = l'après-midi · überall = partout · besser = meilleur)</p>`,
    questions: [
      { type: "qcm", q: "Quel temps fait-il au nord (im Norden) ?", opts: ["Ensoleillé", "Nuageux avec de la pluie l'après-midi", "Neigeux", "Très chaud"], a: 1, exp: "« bewölkt, und am Nachmittag regnet es »." },
      { type: "qcm", q: "Quel temps fait-il au sud (im Süden) ?", opts: ["Pluvieux et froid", "Soleil et chaleur, environ 25 degrés", "Venteux", "Brouillard"], a: 1, exp: "« scheint die Sonne, es ist warm, etwa 25 Grad »." },
      { type: "input", q: "Combien de degrés fait-il à l'est (im Osten) ? (le nombre)", a: ["12","12 Grad"], ph: "nombre", exp: "« kühl, nur 12 Grad »." },
      { type: "vf", q: "Demain, le temps sera meilleur avec du soleil partout.", a: true, exp: "« Morgen wird das Wetter besser: überall Sonne! »" },
      { type: "qcm", q: "Où fait-il le plus chaud aujourd'hui ?", opts: ["Au nord", "Au sud", "À l'est", "Partout pareil"], a: 1, exp: "Le sud : 25 degrés, contre 12 à l'est." }
    ],
    solution: `<p>Bulletin : au nord (im Norden) c'est nuageux avec de la pluie l'après-midi ; au sud (im Süden) le soleil brille, il fait chaud (25 degrés) ; à l'est (im Osten) c'est venteux et frais (12 degrés). Demain, le temps sera meilleur (besser) avec du soleil partout.</p>
<p>Retiens les deux structures météo : <strong>es ist</strong> + adjectif (es ist bewölkt/warm/windig) et le verbe seul (<strong>es regnet</strong>, <strong>die Sonne scheint</strong>).</p>`
  }
};
</script>
