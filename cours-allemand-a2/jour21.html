<script>
var DAY = {

  title: "Les loisirs et le sport",
  subtitle: "Parler de ses hobbies, dire ce qu'on aime faire et à quelle fréquence.",
  theory: `
<h3>1. Le vocabulaire des loisirs (die Freizeit)</h3>
<pre class="pseudo">das Hobby        le hobby          die Freizeit     le temps libre
lesen            lire              Musik hören      écouter de la musique
fernsehen        regarder la télé  kochen           cuisiner
malen            peindre / dessiner reisen          voyager
tanzen           danser            fotografieren    photographier
spazieren gehen  se promener       Freunde treffen  voir des amis</pre>
<p>Pour dire « pendant mon temps libre », on dit <strong>in meiner Freizeit</strong> : « In meiner Freizeit lese ich gern. » = Pendant mon temps libre, j'aime lire.</p>
<h3>2. Dire ce qu'on aime : gern, lieber, am liebsten</h3>
<p>Pour exprimer le goût, l'allemand n'utilise pas de verbe « aimer » avec l'activité, mais l'adverbe <strong>gern</strong> placé après le verbe :</p>
<pre class="pseudo">Ich spiele gern Fußball.        J'aime jouer au football.
Ich lese lieber Bücher.         Je préfère lire des livres.
Am liebsten koche ich.          Ce que je préfère, c'est cuisiner.</pre>
<div class="tip">C'est le comparatif de l'adverbe (jour 6) : <strong>gern → lieber → am liebsten</strong> (volontiers → de préférence → par-dessus tout). « Ich schwimme gern, aber ich laufe lieber » = j'aime nager, mais je préfère courir.</div>
<h3>3. Les sports (der Sport)</h3>
<p>Attention au verbe employé selon le sport :</p>
<pre class="pseudo">Fußball spielen     jouer au foot     (spielen pour les jeux de balle)
Tennis spielen      jouer au tennis
schwimmen           nager
Rad fahren          faire du vélo     (fahren pour les véhicules)
Ski fahren          faire du ski
joggen / laufen     faire du jogging / courir
Yoga machen         faire du yoga     (machen pour les activités générales)</pre>
<div class="warn">Trois verbes selon le sport : <strong>spielen</strong> (jeux avec ballon/raquette), <strong>fahren</strong> (avec un engin : Rad, Ski), <strong>machen</strong> (le reste : Yoga, Sport en général). On ne dit pas « Fußball machen ».</div>
<h3>4. La fréquence (wie oft?)</h3>
<p>Pour dire à quelle fréquence on pratique, on utilise ces adverbes :</p>
<pre class="pseudo">immer      toujours      oft        souvent
manchmal   parfois       selten     rarement
nie        jamais        einmal pro Woche   une fois par semaine
jeden Tag  chaque jour   zweimal im Monat   deux fois par mois</pre>
<pre class="pseudo">Ich gehe zweimal pro Woche ins Fitnessstudio.
Je vais à la salle de sport deux fois par semaine.</pre>
<h3>5. Poser des questions sur les loisirs</h3>
<pre class="pseudo">Was machst du in deiner Freizeit?   Que fais-tu pendant ton temps libre ?
Hast du ein Hobby?                  As-tu un hobby ?
Treibst du Sport?                   Fais-tu du sport ?
Wie oft spielst du Tennis?          À quelle fréquence joues-tu au tennis ?</pre>
<p>Note l'expression <strong>Sport treiben</strong> (faire du sport) : « Ich treibe gern Sport. »</p>`,

    { type: "qcm", q: "Comment dit-on « le temps libre » ?", opts: ["das Hobby", "die Freizeit", "die Arbeit", "der Sport"], a: 1, exp: "die Freizeit = le temps libre." },
    { type: "input", q: "Complète : « Ich spiele ___ Fußball. » (j'aime jouer au foot — adverbe)", a: ["gern","gerne"], ph: "adverbe de goût", exp: "gern après le verbe = aimer faire." },
    { type: "qcm", q: "Quel est le comparatif de « gern » (préférer) ?", opts: ["gerner", "mehr gern", "lieber", "am gern"], a: 2, exp: "gern → lieber → am liebsten." },

    { type: "qcm", q: "Quel verbe utilise-t-on avec « Fußball » ?", opts: ["machen", "fahren", "spielen", "gehen"], a: 2, exp: "Jeux de balle → spielen : Fußball spielen." },
    { type: "input", q: "Complète : « Ich ___ Rad. » (je fais du vélo — verbe fahren)", a: ["fahre"], ph: "verbe", exp: "Rad fahren → ich fahre Rad." },
    { type: "qcm", q: "Quel verbe utilise-t-on avec « Yoga » ?", opts: ["spielen", "fahren", "machen", "treiben"], a: 2, exp: "Yoga machen (machen pour les activités générales)." },
    { type: "qcm", q: "Que signifie « selten » ?", opts: ["souvent", "toujours", "rarement", "parfois"], a: 2, exp: "selten = rarement ; oft = souvent." },
    { type: "input", q: "Complète : « Ich gehe zweimal pro ___ ins Fitnessstudio. » (par semaine)", a: ["Woche","woche"], ph: "un mot", exp: "pro Woche = par semaine." },
    { type: "qcm", q: "Comment dit-on « je préfère cuisiner (par-dessus tout) » ?", opts: ["Ich koche gern.", "Ich koche lieber.", "Am liebsten koche ich.", "Ich koche nie."], a: 2, exp: "am liebsten = superlatif : ce que je préfère par-dessus tout." },

    { type: "input", q: "Complète : « ___ oft spielst du Tennis? » (À quelle fréquence ?)", a: ["Wie","wie"], ph: "mot interrogatif", exp: "Wie oft = à quelle fréquence." },
    { type: "qcm", q: "Compréhension : « In meiner Freizeit lese ich gern und treffe Freunde. » Quels sont les loisirs ?", opts: ["Nager et cuisiner", "Lire et voir des amis", "Voyager et danser", "Faire du vélo"], a: 1, exp: "lesen = lire ; Freunde treffen = voir des amis." },
    { type: "qcm", q: "Compréhension : « Ich schwimme dreimal pro Woche und spiele manchmal Tennis. » Que fait la personne ?", opts: ["Elle nage 3x/semaine et joue parfois au tennis", "Elle joue au foot tous les jours", "Elle ne fait jamais de sport", "Elle fait du yoga le week-end"], a: 0, exp: "dreimal pro Woche schwimmen + manchmal Tennis." },
    { type: "vf", q: "« Sport treiben » signifie « faire du sport ».", a: true, exp: "Ich treibe gern Sport = j'aime faire du sport." }
  ],
  final: {
    title: "Exercice final — Meine Hobbys (mes hobbies)",
    intro: `<p>Lis cette présentation puis réponds.</p>
<pre class="pseudo">Hallo! Ich heiße Lena und ich bin sehr aktiv.
In meiner Freizeit treibe ich gern Sport.
Ich schwimme zweimal pro Woche und fahre jeden Tag Rad.
Am Wochenende spiele ich Tennis mit meiner Schwester.
Ich koche auch gern, aber am liebsten lese ich.
Fernsehen finde ich langweilig, das mache ich fast nie.</pre>
<p>(aktiv = actif · langweilig = ennuyeux · fast nie = presque jamais)</p>`,
    questions: [
      { type: "qcm", q: "Combien de fois par semaine Lena nage-t-elle ?", opts: ["Une fois", "Deux fois", "Trois fois", "Chaque jour"], a: 1, exp: "« Ich schwimme zweimal pro Woche »." },
      { type: "input", q: "Que fait-elle chaque jour (jeden Tag) ? Complète : « Ich fahre jeden Tag ___. »", a: ["Rad","rad"], ph: "un mot", exp: "« fahre jeden Tag Rad » = fait du vélo tous les jours." },
      { type: "qcm", q: "Avec qui joue-t-elle au tennis le week-end ?", opts: ["Sa mère", "Sa sœur", "Son frère", "Ses amis"], a: 1, exp: "« mit meiner Schwester » = avec sa sœur." },
      { type: "qcm", q: "Quelle est son activité préférée (am liebsten) ?", opts: ["Nager", "Cuisiner", "Lire", "Regarder la télé"], a: 2, exp: "« am liebsten lese ich »." },
      { type: "vf", q: "Lena regarde souvent la télévision.", a: false, exp: "« Fernsehen ... das mache ich fast nie » = presque jamais. FAUX." }
    ],
    solution: `<p>Lena est active : pendant son temps libre elle fait du sport (Sport treiben). Elle nage deux fois par semaine (zweimal pro Woche), fait du vélo tous les jours (jeden Tag Rad fahren), joue au tennis le week-end avec sa sœur. Elle aime cuisiner, mais son activité préférée (am liebsten) est la lecture. Elle ne regarde presque jamais la télé (fast nie).</p>
<p>Retiens : goût avec <strong>gern / lieber / am liebsten</strong>, fréquence avec <strong>zweimal pro Woche</strong>, et le bon verbe par sport (<strong>spielen / fahren / machen</strong>).</p>`
  }
};
