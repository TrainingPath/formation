<script>
var DAY = {
  num: 4,
  title: "Le prétérit (Präteritum) fréquent",
  subtitle: "war, hatte, es gab… le passé de l'écrit et des verbes courants.",
  theory: `
<h3>1. Deux passés, deux usages</h3>
<p>L'allemand a deux temps du passé qui se traduisent tous les deux par le passé composé/l'imparfait français. Le <strong>Perfekt</strong> (jours 1-3) domine à l'<strong>oral</strong>. Le <strong>prétérit</strong> (das Präteritum) domine à l'<strong>écrit</strong> (récits, romans, journaux). Mais quelques verbes très fréquents s'emploient au prétérit <strong>même à l'oral</strong> : sein, haben, et les verbes de modalité.</p>
<h3>2. Les incontournables : sein et haben</h3>
<pre class="pseudo">sein (être)               haben (avoir)
ich war      wir waren    ich hatte     wir hatten
du warst     ihr wart     du hattest    ihr hattet
er/sie war   sie waren    er/sie hatte  sie hatten</pre>
<pre class="pseudo">Ich  war  gestern  krank.        // J'étais malade hier
Wir  hatten  keine  Zeit.        // Nous n'avions pas le temps</pre>
<h3>3. « il y avait » : es gab</h3>
<p>La tournure <strong>es gab</strong> (prétérit de es gibt, « il y a ») signifie « il y avait ». Très utile pour décrire.</p>
<pre class="pseudo">Es gab  viele Leute.       // Il y avait beaucoup de gens
Es gab  ein Problem.       // Il y avait un problème</pre>
<h3>4. Verbes réguliers au prétérit : radical + -te</h3>
<p>Les verbes <strong>réguliers</strong> forment le prétérit avec <strong>radical + -te-</strong> + terminaison.</p>
<pre class="pseudo">spielen : ich spielte, du spieltest, er spielte, wir spielten
machen  : ich machte,  wir machten
arbeiten: ich arbeitete (radical en -t → -ete)</pre>
<h3>5. Verbes forts : voyelle changée, sans -te</h3>
<p>Les verbes <strong>forts</strong> changent la voyelle du radical et n'ajoutent pas -te. À la 1re et 3e personne du singulier, <strong>pas de terminaison</strong>.</p>
<pre class="pseudo">gehen  → ging   (ich ging, er ging, wir gingen)     allait / alla
kommen → kam    (ich kam, wir kamen)                venait
sehen  → sah    (ich sah)                           voyait
fahren → fuhr   (ich fuhr)                           allait (en véhicule)
finden → fand   (ich fand)                           trouvait</pre>
<div class="warn">Au prétérit, <strong>ich</strong> et <strong>er/sie/es</strong> ont exactement la même forme : ich war / er war, ich ging / er ging. C'est normal !</div>
<div class="tip">À l'A2, l'essentiel est : maîtriser war, hatte, es gab au prétérit, et savoir reconnaître le prétérit dans un texte écrit. Pour raconter à l'oral, tu peux presque toujours utiliser le Perfekt.</div>`,
  exercises: [
    { type: "input", q: "Prétérit de sein, 1re pers. sing. : « Ich ___ müde. »", a: ["war"], ph: "prétérit", exp: "sein → ich war (j'étais)." },
    { type: "input", q: "Prétérit de haben, 1re pers. sing. : « Ich ___ keine Zeit. »", a: ["hatte"], ph: "prétérit", exp: "haben → ich hatte (j'avais)." },
    { type: "input", q: "Prétérit de sein, 2e pers. sing. : « Du ___ nicht da. »", a: ["warst"], ph: "prétérit", exp: "du warst (tu étais)." },
    { type: "input", q: "« Il y avait un problème » : « Es ___ ein Problem. »", a: ["gab"], ph: "prétérit", exp: "es gibt → es gab (il y avait)." },
    { type: "input", q: "Prétérit régulier de spielen, 3e pers. sing. : « Er ___ Klavier. »", a: ["spielte"], ph: "prétérit", exp: "spiel + te = spielte (il jouait)." },
    { type: "input", q: "Prétérit fort de gehen, 1re pers. sing. : « Ich ___ nach Hause. »", a: ["ging"], ph: "prétérit", exp: "gehen → ging (j'allais/j'allai)." },
    { type: "qcm", q: "Quel temps domine à l'écrit (récits, romans) ?", opts: ["Le Perfekt", "Le Präteritum", "Le futur", "Le présent"], a: 1, exp: "Le prétérit est le temps du récit écrit." },
    { type: "qcm", q: "Quels verbes s'emploient au prétérit même à l'oral ?", opts: ["Tous", "Aucun", "sein, haben et les verbes de modalité", "Seulement les verbes en -ieren"], a: 2, exp: "war, hatte, konnte… restent courants à l'oral." },
    { type: "qcm", q: "Prétérit de haben, 3e pers. plur. (sie) ?", opts: ["haben", "hatten", "hatteten", "hattet"], a: 1, exp: "sie hatten (ils avaient)." },
    { type: "qcm", q: "Comment traduire « Es gab viele Leute » ?", opts: ["Il y a beaucoup de gens", "Il y avait beaucoup de gens", "Il y aura des gens", "Donne des gens"], a: 1, exp: "es gab = il y avait (prétérit de es gibt)." },
    { type: "qcm", q: "Prétérit fort de kommen, 1re pers. sing. ?", opts: ["kommte", "kam", "gekommen", "komm"], a: 1, exp: "kommen → kam (venait)." },
    { type: "qcm", q: "Quelle forme est correcte pour « er » (prétérit de sein) ?", opts: ["er warst", "er war", "er ware", "er bist"], a: 1, exp: "ich war = er war : même forme au singulier." },
    { type: "vf", q: "Au prétérit, ich et er/sie/es ont la même forme (ich war / er war).", a: true, exp: "Vrai : 1re et 3e personnes du singulier sont identiques." },
    { type: "vf", q: "es gab signifie « il donne ».", a: false, exp: "Faux : es gab = il y avait (prétérit de es gibt)." },
    { type: "vf", q: "Le prétérit des verbes réguliers se forme avec le radical + -te.", a: true, exp: "Vrai : spielen → spielte, machen → machte." }
  ],
  final: {
    title: "Exercice final — Ein Text im Präteritum",
    intro: `<p>Un début de récit, comme dans un livre, entièrement au prétérit :</p>
<pre class="pseudo">Es war ein kalter Morgen. Ich hatte kein Frühstück und ich war
sehr hungrig. Es gab keinen Bus, also ging ich zu Fuß zur Schule.
Auf dem Weg sah ich meinen Freund. Wir kamen zusammen an und
hatten noch fünf Minuten Zeit.</pre>
<p>(Traduction : C'était un matin froid. Je n'avais pas de petit-déjeuner et j'avais très faim. Il n'y avait pas de bus, alors je suis allé à pied à l'école. En chemin j'ai vu mon ami. Nous sommes arrivés ensemble et avions encore cinq minutes.)</p>`,
    questions: [
      { type: "input", q: "« Es ___ ein kalter Morgen » : prétérit de sein ?", a: ["war"], ph: "prétérit", exp: "es war (c'était)." },
      { type: "input", q: "« Ich ___ kein Frühstück » : prétérit de haben ?", a: ["hatte"], ph: "prétérit", exp: "ich hatte (j'avais)." },
      { type: "qcm", q: "ging est le prétérit de quel verbe ?", opts: ["geben", "gehen", "gehören", "genug"], a: 1, exp: "gehen → ging (allait)." },
      { type: "qcm", q: "« Es gab keinen Bus » signifie…", opts: ["Il n'y a pas de bus", "Il n'y avait pas de bus", "Il y aura un bus", "Le bus donne"], a: 1, exp: "es gab = il y avait (ici négatif : il n'y avait pas)." },
      { type: "vf", q: "Le texte est au prétérit, un temps typique du récit écrit.", a: true, exp: "Vrai : war, hatte, gab, ging, sah, kamen sont tous au prétérit." }
    ],
    solution: `<p>Les prétérits du texte :</p>
<pre class="pseudo">sein   → war        (es war, ich war)
haben  → hatte      (ich hatte, wir hatten)
es gibt→ es gab
gehen  → ging
sehen  → sah
kommen → kam / kamen</pre>
<p>Ce texte montre l'usage naturel du prétérit à l'écrit. À l'oral, on aurait plutôt dit « bin gegangen », « habe gesehen ». Mais war, hatte et es gab restent les rois du passé, à l'écrit comme à l'oral.</p>`
  }
};
</script>
