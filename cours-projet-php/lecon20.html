  title: "Déploiement : build, migrations, mise en ligne",
  subtitle: "Transformer le projet en application en ligne.",
  theory: `
<h3>1. Les dépendances de production</h3>
<p>Une <strong>dépendance</strong> est une librairie externe dont le projet a besoin. Pour la mise en ligne (la <strong>production</strong>, le vrai site utilisé par le public), on installe uniquement le nécessaire, en version optimisée.</p>
<pre class="pseudo">composer install --no-dev --optimize-autoloader   # installe les librairies PHP SANS les outils de dev, en version optimisée
npm ci && npm run build      # installe les librairies JavaScript puis compile les « assets » (via Vite)</pre>
<p>L'option <code>--no-dev</code> exclut les outils de <em>développement</em> (tests, débogage) inutiles en ligne. <code>npm run build</code> compile les <strong>assets</strong> — les fichiers CSS (styles) et JavaScript (comportements) — en versions compactées et rapides. <strong>Vite</strong> est l'outil qui réalise cette compilation.</p>

<h3>2. Le fichier .env de production</h3>
<pre class="pseudo">APP_ENV=production        # on déclare l'environnement « production » (le vrai site)
APP_DEBUG=false           # masque les erreurs détaillées au public
APP_KEY=...               # clé de chiffrement générée par « php artisan key:generate »
DB_PASSWORD=\${DB_PASSWORD}  # le mot de passe vient d'une variable d'environnement (secret externe)</pre>
<div class="warn"><code>APP_DEBUG=false</code> est crucial : en <code>true</code>, une erreur afficherait le code, les requêtes et parfois des secrets au visiteur. Jamais en production.</div>

<h3>3. Appliquer les migrations</h3>
<p>Une <strong>migration</strong> est un script qui crée ou met à jour la structure de la base (les tables). Sur le serveur de production, on les applique ainsi :</p>
<pre class="pseudo">php artisan migrate --force   # applique les migrations ; --force = sans demander confirmation, requis en prod</pre>

<h3>4. Mettre en cache pour la performance</h3>
<pre class="pseudo">php artisan config:cache   # pré-calcule la configuration en un seul fichier rapide
php artisan route:cache    # pré-calcule la table des routes
php artisan view:cache     # pré-compile les vues Blade</pre>
<p>Ces caches (mémorisations pré-calculées) accélèrent le démarrage en évitant de recalculer à chaque requête la configuration, les routes et les vues.</p>

<h3>5. La checklist de mise en ligne</h3>
<pre class="pseudo">✓ APP_DEBUG=false, APP_ENV=production
✓ dépendances --no-dev, assets compilés (npm run build)
✓ migrations appliquées (migrate --force)
✓ config/route/view en cache
✓ secrets dans l'environnement (jamais dans Git)
✓ HTTPS activé, base sauvegardée
✓ tests verts avant de livrer (php artisan test)</pre>
<div class="tip">On peut héberger sur un <strong>serveur</strong> (un VPS, ordinateur loué en ligne), une <strong>plateforme</strong> spécialisée (Forge, Vapor…) ou dans un <strong>conteneur</strong> (Docker — cours dédié), une boîte qui empaquette l'application avec tout son environnement. Le principe reste : du code configuré par l'environnement, avec les secrets externes. Le <strong>HTTPS</strong> (la version chiffrée de HTTP) protège les échanges. L'application de la Ludothèque est en ligne.</div>`,
  exercises: [
    { type: "qcm", q: "Installer les dépendances de prod :", opts: ["composer install --no-dev --optimize-autoloader", "composer install", "npm install", "artisan build"], a: 0, exp: "Sans outils de dev." },

    { type: "qcm", q: "APP_DEBUG=true en prod…", opts: ["Est idéal", "Expose le code et des secrets aux visiteurs", "Améliore les performances", "Renforce la sécurité"], a: 1, exp: "Dangereux." },
    { type: "qcm", q: "Appliquer les migrations en prod :", opts: ["php artisan migrate --force", "migrate:fresh", "npm migrate", "rien"], a: 0, exp: "--force." },

    { type: "qcm", q: "Accélérer le démarrage :", opts: ["config:cache, route:cache, view:cache", "migrate:fresh", "npm dev", "rien"], a: 0, exp: "Caches." },
    { type: "qcm", q: "La clé d'application se génère par…", opts: ["php artisan key:generate", "php artisan app:key", "php artisan generate:key", "composer key:generate"], a: 0, exp: "APP_KEY." },
    { type: "qcm", q: "Avant de livrer, on lance…", opts: ["php artisan test (tests verts)", "rien", "un formatage", "un log"], a: 0, exp: "Tests d'abord." },
    { type: "qcm", q: "Chiffrer les échanges en ligne :", opts: ["HTTP simple", "HTTPS", "FTP", "aucun"], a: 1, exp: "TLS." },
    { type: "vf", q: "Les secrets viennent de l'environnement, jamais du dépôt Git.", a: true, exp: "Hors du code." },
    { type: "qcm", q: "--no-dev exclut…", opts: ["La base", "Les dépendances de développement", "Les migrations", "Les vues"], a: 1, exp: "Outils de dev." },
    { type: "vf", q: "On peut héberger sur un serveur, une plateforme ou un conteneur.", a: true, exp: "Portable." },
    { type: "qcm", q: "La base de production doit être…", opts: ["Jamais sauvegardée", "Sauvegardée régulièrement", "La base de test", "Publique"], a: 1, exp: "Backups." },
    { type: "qcm", q: "Un conteneur (Docker) sert à…", opts: ["Compiler le code", "Empaqueter l'app et son environnement (cours dédié)", "Trier les fichiers", "Chiffrer les données"], a: 1, exp: "Packaging reproductible." }
  ],
  final: {
    title: "Exercice final — Mettre en ligne",
    intro: `<p>On prépare et on lance la version de production.</p>`,
    questions: [
      { type: "qcm", q: "Dépendances de prod :", opts: ["composer install --no-dev --optimize-autoloader", "composer install", "npm install", "rien"], a: 0, exp: "Optimisé." },
      { type: "qcm", q: "Réglage prod correct :", opts: ["APP_DEBUG=false, APP_ENV=production", "APP_DEBUG=true", "aucun", "secrets en dur"], a: 0, exp: "Sûr." },
      { type: "qcm", q: "Migrer en prod :", opts: ["php artisan migrate --force", "migrate:fresh", "à la main", "rien"], a: 0, exp: "--force." },
      { type: "qcm", q: "Accélérer :", opts: ["config:cache, route:cache, view:cache", "rien", "npm dev", "migrate:fresh"], a: 0, exp: "Caches." },
      { type: "vf", q: "On lance les tests avant de livrer.", a: true, exp: "Qualité." }
    ],
    solution: `<pre class="pseudo">composer install --no-dev --optimize-autoloader   # librairies PHP de prod, optimisées
npm ci && npm run build                            # librairies JS + compilation des assets

php artisan migrate --force                        # applique les migrations sans confirmation
php artisan config:cache                           # met la configuration en cache
php artisan route:cache                            # met les routes en cache
php artisan view:cache                             # met les vues en cache

# .env de production
APP_ENV=production                                 # environnement de production
APP_DEBUG=false                                    # erreurs masquées au public
DB_PASSWORD=\${DB_PASSWORD}                          # secret fourni par l'environnement</pre>
<p>La Ludothèque est en ligne. Demain : l'examen final, l'application assemblée.</p>`
  }
