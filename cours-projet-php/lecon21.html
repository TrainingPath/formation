<script>
var DAY = {
  num: 21,
  title: "Récapitulatif : la Ludothèque assemblée (examen)",
  subtitle: "Tout le projet en une épreuve : de l'architecture au déploiement.",
  theory: `
<h3>Récapitulatif avant l'épreuve</h3>
<p>Vingt et une leçons, une application complète. Le <strong>langage</strong> (<strong>PHP</strong>, la langue dans laquelle on écrit les instructions exécutées par le serveur), le <strong>framework</strong> (<strong>Laravel</strong>, la boîte à outils toute prête qui structure le code) et la <strong>base de données</strong> (<strong>MySQL</strong>, le grand classeur où sont rangées les informations) ne sont plus des cours séparés : ils forment un seul logiciel. Récapitulons avant les 20 questions.</p>

<h3>1. Architecture et données</h3>
<p>Le projet suit une <strong>architecture MVC + services</strong> : une façon d'organiser le code en <em>couches</em> aux rôles distincts — Modèle (les données), Vue (l'affichage), Contrôleur (le chef d'orchestre) — plus une couche de <strong>services</strong> pour les règles métier, comme les différents services d'une entreprise, chacun sa spécialité. Le <strong>schéma</strong> de la base (la liste des tables et de leurs liens) découle de la méthode d'analyse <strong>Merise</strong> et est construit par des <strong>migrations</strong> : des scripts qui montent la structure de la base, versionnés comme des plans successifs. Les <strong>modèles Eloquent</strong> sont des objets PHP qui reflètent chaque table et ses <strong>relations</strong> (les liens entre tables) ; les <strong>scopes</strong> sont des filtres nommés et réutilisables pour interroger la base sans écrire de <strong>SQL</strong> (le langage des bases de données) à la main.</p>

<h3>2. Métier et sécurité</h3>
<p>La <strong>couche service</strong> porte les règles du métier (louer, acheter, gérer deux stocks distincts), rendues <strong>atomiques</strong> — « tout ou rien » — par <code>DB::transaction</code>, afin de ne jamais laisser la base à moitié modifiée. Une <strong>API REST</strong> (une porte d'entrée standardisée destinée aux programmes) expose les données via des <strong>API Resources</strong> (qui choisissent quoi montrer), avec de la <strong>validation</strong> assurée par des <strong>Form Requests</strong> (des gardiens qui refusent les données invalides). Côté sécurité : l'<strong>authentification</strong> vérifie l'identité (mots de passe hachés avec <strong>bcrypt</strong>, contrôlés par le <strong>middleware</strong> auth, ce portier placé avant le code), et l'<strong>autorisation</strong> décide des droits de chaque <strong>rôle</strong> via des <strong>Gates</strong> et des <strong>Policies</strong> (les règles nommées et les règles de propriété).</p>

<h3>3. Interface, qualité, livraison</h3>
<p>Un <strong>frontend</strong> (la partie visible, affichée dans le navigateur) construit avec <strong>Blade</strong> (le langage de gabarits de Laravel), doté d'une recherche et d'une <strong>pagination</strong> (le découpage d'une longue liste en pages successives). Trois <strong>espaces</strong> cloisonnés : client, vendeur, administrateur. Des <strong>tests</strong> automatiques : <em>unitaires</em> (avec PHPUnit/Pest, qui vérifient une brique isolée) et de <em>fonctionnalité</em> (qui rejouent de vraies requêtes <strong>HTTP</strong> de bout en bout). Des réflexes de <strong>qualité</strong> — les <em>logs</em> qui tracent ce qui se passe, la correction du <em>N+1</em> qui supprime les requêtes en trop, les secrets rangés dans <code>.env</code> — et un <strong>déploiement</strong> (la mise en ligne) piloté par <strong>artisan</strong>, l'assistant en ligne de commande de Laravel.</p>
<div class="tip">Conseil d'examen : à chaque question, demande-toi « quelle couche ? quel rôle ? quelle garantie ? ». Et souviens-toi : la bonne réponse n'est pas la plus longue. Bonne chance !</div>`,
  exercises: [
    { type: "qcm", q: "Le flux d'une requête :", opts: ["Base → Resource → HTTP", "Route → Controller → Service → Model → MySQL", "Service → HTTP", "Model → Route"], a: 1, exp: "Les couches." },
    { type: "qcm", q: "Le schéma est créé par…", opts: ["Eloquent en prod", "Des migrations", "Le hasard", "Le navigateur"], a: 1, exp: "Migrations versionnées." },
    { type: "qcm", q: "Un modèle Eloquent correspond à…", opts: ["Une route", "Une table", "Un test", "Une vue"], a: 1, exp: "Objet ↔ table." },
    { type: "qcm", q: "Une condition réutilisable dans un modèle :", opts: ["Un scope", "Un middleware", "Une vue", "Une migration"], a: 0, exp: "scopeXxx." },
    { type: "qcm", q: "Les règles métier vivent dans…", opts: ["La route", "Le service", "Le modèle brut", "Le CSS"], a: 1, exp: "Couche service." },
    { type: "qcm", q: "Rendre louer/acheter atomiques :", opts: ["cache()", "DB::transaction(...)", "queue()", "rien"], a: 1, exp: "Transaction." },
    { type: "qcm", q: "Ne pas exposer le modèle brut :", opts: ["Une API Resource", "un middleware", "un index", "un log"], a: 0, exp: "Découplage." },
    { type: "qcm", q: "Refuser des données invalides :", opts: ["Une Form Request", "un tri", "un index", "un cookie"], a: 0, exp: "Validation." },
    { type: "qcm", q: "Hacher les mots de passe :", opts: ["base64", "bcrypt (Hash::make)", "md5", "en clair"], a: 1, exp: "Sécurisé." },
    { type: "qcm", q: "Réserver une action à l'admin :", opts: ["Gate + middleware can:", "permitAll", "rien", "une Resource"], a: 0, exp: "Autorisation." },
    { type: "qcm", q: "Rendre du HTML côté serveur :", opts: ["Une API Resource", "Blade (view)", "un DTO", "un test"], a: 1, exp: "Vue serveur." },
    { type: "qcm", q: "Paginer un grand catalogue :", opts: ["Tout charger", "paginate(10)", "un trigger", "un log"], a: 1, exp: "LIMIT/OFFSET." },
    { type: "qcm", q: "Tester le service en isolation :", opts: ["PHPUnit + RefreshDatabase + factory", "en production", "à la main", "une Resource"], a: 0, exp: "Unitaire." },
    { type: "qcm", q: "Tester la chaîne complète :", opts: ["getJson/postJson (feature test)", "un mock seul", "rien", "un log"], a: 0, exp: "Fonctionnalité." },
    { type: "qcm", q: "Le problème « N+1 » se corrige par…", opts: ["with('categorie') (eager loading)", "plus de boucles", "un index unique", "une Resource"], a: 0, exp: "Préchargement." },
    { type: "qcm", q: "Les secrets se mettent…", opts: ["En dur", "Dans .env (config())", "Dans Git", "Dans le HTML"], a: 1, exp: "Hors du code." },
    { type: "qcm", q: "En prod, APP_DEBUG vaut…", opts: ["true", "false", "1", "verbose"], a: 1, exp: "Masque les erreurs." },
    { type: "qcm", q: "Appliquer les migrations en prod :", opts: ["migrate --force", "migrate:fresh", "à la main", "rien"], a: 0, exp: "--force." },
    { type: "qcm", q: "Le modèle Ludothèque a deux stocks :", opts: ["neuf et occasion", "stock_vente et stock_location", "achat et retour", "un seul"], a: 1, exp: "Vente et location." },
    { type: "qcm", q: "Les trois rôles :", opts: ["admin, user, guest", "client, vendeur, administrateur", "free, pro", "lecteur, éditeur"], a: 1, exp: "Cahier des charges." }
  ],
  final: {
    title: "Épreuve pratique — Le trajet d'une location",
    intro: `<p>On relie toutes les couches sur un cas concret.</p>`,
    questions: [
      { type: "qcm", q: "Qui vérifie l'identité et le rôle avant le contrôleur ?", opts: ["Le modèle", "Les middlewares (auth, can)", "La Resource", "MySQL"], a: 1, exp: "Middlewares en amont." },
      { type: "qcm", q: "Où est décidé « stock suffisant ? »", opts: ["La route", "Le service (règle métier)", "Blade", "L'index"], a: 1, exp: "Service." },
      { type: "qcm", q: "Qui garantit location + stock ensemble ?", opts: ["DB::transaction", "un log", "une Resource", "un cookie"], a: 0, exp: "Transaction." },
      { type: "qcm", q: "Qui traduit l'appel en SQL ?", opts: ["Eloquent (le modèle)", "la route", "la Resource", "Blade"], a: 0, exp: "Persistance." },
      { type: "vf", q: "Une exception dans le service annule toute la transaction (ROLLBACK).", a: true, exp: "Atomicité ACID." }
    ],
    solution: `<pre class="pseudo">1. Client authentifié soumet « Louer » (@csrf). Middlewares auth + can vérifient.
2. Controller appelle LocationService::louer($client, $jeu).
3. Service, dans DB::transaction : vérifie le stock, crée la Location,
   décrémente stock_location.
4. Eloquent traduit en SQL, écrit dans MySQL (InnoDB).
5. COMMIT : location + stock à jour — ou ROLLBACK si erreur (ACID).
6. Redirection : l'utilisateur voit sa location confirmée.

PHP (langage) · Laravel (framework, chaque couche) · MySQL (base) :
les trois briques de la formation, assemblées en UNE application.</pre>
<p>Félicitations ! Tu as conçu, codé, sécurisé, testé et déployé une application complète en Laravel. Le Niveau 6 est franchi côté PHP : tu sais construire un logiciel de bout en bout.</p>`
  }
};
</script>

    statement: "On veut ajouter « réserver un jeu ». Décris, couche par couche, tout ce qu'il faut créer ou modifier pour cette fonctionnalité complète (de la base au frontend), en nommant les fichiers/éléments Laravel clés à chaque étape.",
    hints: [

      "Métier : ReservationService::reserver(...) dans DB::transaction. Route + contrôleur + Form Request. Autorisation (auth).",

    ],
    solution: "1. BASE — migration create_reservations_table : client_id, jeu_id, date_resa (clés étrangères) ; php artisan migrate.\n2. MODEL — modèle Reservation (fillable, belongsTo User et Jeu) ; relation reservations() sur User.\n3. SERVICE — ReservationService::reserver($client, $jeu) dans DB::transaction (enregistre la réservation).\n4. WEB/API — Route POST /reserver/{jeu} + méthode de contrôleur ; éventuelle Form Request de validation.\n5. SÉCURITÉ — middleware auth ; un client ne réserve que pour lui (propriété/Policy).\n6. FRONTEND — bouton « Réserver » (Blade, @csrf) + redirect après POST.\n7. TESTS — test unitaire du service (RefreshDatabase, factory) + feature test de l'endpoint (actingAs).\n8. QUALITÉ — Log::info de la réservation ; secrets dans .env ; déployé par artisan.",
    note: "Ajouter une fonctionnalité, c'est traverser toutes les couches dans l'ordre : base (migration), modèle, service (transaction), route/contrôleur, sécurité, frontend, puis tests et qualité. Cette méthode reproductible est le vrai acquis du Niveau 6 : tu sais faire évoluer proprement une application complète, de bout en bout." }
  ]
