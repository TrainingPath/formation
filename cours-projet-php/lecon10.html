  theory: `
<h3>1. Authentification vs autorisation</h3>
<p>Une <strong>application web</strong> est un programme que l'on utilise depuis un navigateur (Chrome, Firefox…) : ici, le site de location de jeux vidéo. Avant tout, elle doit savoir à qui elle parle. <strong>Authentifier</strong>, c'est vérifier <em>qui</em> est l'utilisateur — comme un videur qui contrôle votre carte d'identité à l'entrée. <strong>Autoriser</strong> (leçon 11), c'est décider <em>ce qu'il a le droit de faire</em> une fois entré — comme le bracelet VIP qui ouvre certaines portes et pas d'autres. On commence toujours par l'identité : impossible de donner des droits à quelqu'un qu'on n'a pas encore reconnu.</p>
<p>Un <strong>utilisateur</strong> (ou <em>user</em>) est une personne possédant un compte sur le site. <strong>Laravel</strong> est le <em>framework</em> (la boîte à outils toute prête) avec lequel on construit l'application : il fournit des morceaux déjà écrits pour éviter de tout refaire à la main.</p>

<h3>2. Les kits d'authentification</h3>
<p>Écrire soi-même tout le système de connexion serait long et risqué. Laravel fournit des <strong>kits</strong> prêts à l'emploi — des ensembles de fichiers déjà écrits qu'on installe d'un coup, comme un meuble en kit livré avec toutes ses pièces. <strong>Breeze</strong> gère le <em>web</em> classique : les pages de connexion et d'inscription que l'on voit à l'écran. <strong>Sanctum</strong> gère les <strong>jetons</strong> pour les API et les SPA. Une <strong>API</strong> (<em>Application Programming Interface</em>) est une porte d'entrée par laquelle un autre programme — et non un humain — vient demander des données. Une <strong>SPA</strong> (<em>Single Page Application</em>) est un site qui se met à jour sans jamais recharger toute la page. Un <strong>jeton</strong> (<em>token</em>) est un mot de passe temporaire prouvant qu'on est bien connecté, comme un ticket de vestiaire.</p>
<p>Ces kits installent d'un coup les <strong>routes</strong> (les adresses du site, ex. <code>/login</code>), les <strong>contrôleurs</strong> (le code qui traite chaque demande) et les <strong>vues</strong> (les pages HTML affichées). On les met en place avec deux commandes tapées dans le terminal :</p>
<pre class="pseudo">composer require laravel/breeze --dev   # composer TÉLÉCHARGE le kit Breeze (--dev = outil de développement seulement)
php artisan breeze:install              # artisan INSTALLE les routes, contrôleurs et vues d'authentification</pre>
<p><strong>Composer</strong> est le <em>gestionnaire de dépendances</em> de PHP : il télécharge et range les bibliothèques externes dont le projet a besoin (comme un installateur d'applications). <strong>Artisan</strong> est l'assistant en ligne de commande de Laravel : on lui donne des ordres courts (<code>php artisan …</code>) pour générer des fichiers ou lancer des tâches. Une <strong>commande</strong> est simplement une instruction tapée au clavier dans le <em>terminal</em> (la fenêtre où l'on écrit des ordres directement à l'ordinateur).</p>

<h3>3. Le hachage des mots de passe</h3>
<p><strong>Hacher</strong> un mot de passe, c'est le transformer en une suite de caractères illisible et <em>irréversible</em> — un peu comme passer un fruit au mixeur : impossible de reconstituer le fruit d'origine à partir de la purée. Ainsi, même si quelqu'un vole la base de données (l'endroit où sont rangées toutes les informations du site), il ne lit jamais les vrais mots de passe.</p>
<pre class="pseudo">// à l'inscription : on crée l'utilisateur
User::create([                                    // demande à Laravel de créer un nouvel utilisateur…
    'email' => \$data['email'],                    // …avec l'email fourni (\$data contient les données saisies)
    'password' => Hash::make(\$data['password']),  // le mot de passe est HACHÉ (bcrypt, salé) avant d'être rangé
    'role' => Role::CLIENT,                        // rôle « client » par défaut (droits de base)
]);
// à la connexion : on vérifie les identifiants
Auth::attempt(['email' => \$e, 'password' => \$p]);   // Laravel hache \$p et le compare au haché déjà stocké</pre>
<p><code>User::create([...])</code> range un nouvel utilisateur en base ; les crochets <code>[ ]</code> forment un <strong>tableau associatif</strong>, une suite de paires « clé => valeur » (comme une fiche : « email => … »). Le symbole <code>\$</code> précède toujours une <strong>variable</strong> en PHP (une case mémoire nommée) : <code>\$data</code> contient les données saisies. <code>Hash::make</code> hache avec <strong>bcrypt</strong>, un algorithme volontairement <strong>lent</strong> (pour décourager les milliards d'essais d'un pirate) et <strong>salé</strong> : on ajoute un « grain de sel » aléatoire à chaque mot de passe, si bien que deux mots de passe identiques donnent des hachés différents. <code>Auth::attempt</code> refait le même hachage sur le mot de passe saisi puis le compare au haché stocké : on ne compare jamais des mots de passe en clair. La <strong>flèche</strong> <code>=&gt;</code> relie une clé à sa valeur ; les <strong>doubles deux-points</strong> <code>::</code> appellent une fonction rattachée à une classe (ici <code>Hash</code> ou <code>User</code>).</p>

<h3>4. Protéger les routes : le middleware auth</h3>
<p>Un <strong>middleware</strong> est un filtre placé <em>avant</em> le code d'une route — comme un portier qui contrôle chaque visiteur avant de le laisser entrer dans une salle. Le middleware <code>auth</code> laisse passer les utilisateurs connectés et bloque les autres.</p>
<pre class="pseudo">// catalogue public : accessible à tous
Route::get('/catalogue', [CatalogueController::class, 'index']);   // GET /catalogue → exécute la méthode index() du contrôleur

// actions protégées : réservées aux utilisateurs connectés
Route::middleware('auth')->group(function () {                     // tout ce qui suit passe par le portier « auth »
    Route::post('/louer/{jeu}', [LocationController::class, 'louer']);  // POST /louer/42 → méthode louer()
    Route::get('/client', [ClientController::class, 'index']);          // GET /client → espace client privé
});</pre>
<p>Une <strong>route</strong> associe une adresse (URL) à un morceau de code. <code>Route::get</code> répond aux demandes de type <strong>GET</strong> (afficher ou consulter une page) ; <code>Route::post</code> répond aux <strong>POST</strong> (envoyer des données, ex. valider un formulaire). <code>[CatalogueController::class, 'index']</code> désigne <em>quel</em> code exécuter : la méthode <code>index</code> du contrôleur. <code>{jeu}</code> est un <strong>paramètre</strong> variable dans l'adresse : <code>/louer/42</code> louera le jeu numéro 42. <code>->group(function () { … })</code> regroupe plusieurs routes sous un même filtre pour ne pas répéter <code>middleware('auth')</code> sur chacune. Un visiteur non connecté est alors renvoyé vers la page de connexion (ou reçoit une erreur <strong>401</strong>, le code « non authentifié »).</p>

<h3>5. L'utilisateur connecté</h3>
<pre class="pseudo">auth()->user();     // récupère l'objet Utilisateur actuellement connecté
auth()->id();       // récupère seulement son identifiant (son numéro unique)
Auth::logout();     // déconnecte l'utilisateur (ferme la session)</pre>
<p><code>auth()</code> est un raccourci donnant accès à l'utilisateur courant. La <strong>session</strong> est la mémoire qui garde l'utilisateur connecté d'une page à l'autre (sinon il faudrait retaper son mot de passe à chaque clic) ; <code>logout</code> vide cette mémoire. L'<strong>identifiant</strong> (<em>id</em>) est le numéro unique attribué à chaque utilisateur, comme un numéro de dossier.</p>
<div class="warn">Ne jamais désactiver le hachage « pour tester », ni écrire un mot de passe dans les <em>logs</em> (les journaux du serveur). Un mot de passe compromis l'est définitivement. La sécurité se vérifie toujours côté <strong>serveur</strong> (l'ordinateur central qui héberge le site), jamais côté <strong>frontend</strong> seul (ce qui tourne dans le navigateur du visiteur, qu'un pirate peut modifier).</div>`,
  exercises: [

    ],
