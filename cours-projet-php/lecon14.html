<script>
var DAY = {
  num: 14,
  title: "Le frontend Blade : le catalogue",
  subtitle: "Donner un visage à l'application avec des vues côté serveur.",
  theory: `
<h3>1. API JSON ou pages HTML ?</h3>
<p>Une <strong>API REST</strong> (leçon 7) renvoie des données au format <strong>JSON</strong> (un texte structuré, lisible par un programme) : idéal pour un <em>front séparé</em> (une interface développée à part) ou une application mobile. Pour un site web classique consulté dans un navigateur, on préfère fabriquer directement les pages <strong>HTML côté serveur</strong> — c'est-à-dire que le serveur assemble la page finie avant de l'envoyer. L'outil de Laravel pour cela s'appelle <strong>Blade</strong>. Avantage : le même service métier peut alimenter les deux (API et pages).</p>
<p>Une <strong>vue</strong> (<em>view</em>) est le fichier qui décrit l'apparence d'une page. Un <strong>template</strong> (« gabarit ») est une vue à trous : un squelette de page dans lequel on injecte les données variables. Blade est le langage de ces templates.</p>

<h3>2. Un contrôleur web (retourne une vue)</h3>
<pre class="pseudo">public function index(CatalogueService \$service) {          // le service est fourni automatiquement (injection)
    return view('catalogue', ['jeux' => \$service->jeuxLouables()]);  // rend la vue « catalogue » avec la liste des jeux
}</pre>
<p>Un <strong>contrôleur web</strong> (par opposition à un contrôleur d'API) renvoie une <strong>vue</strong> plutôt que du JSON. <code>view('catalogue', [...])</code> rend le fichier <code>resources/views/catalogue.blade.php</code> (le dossier <code>resources/views</code> contient toutes les vues) en lui transmettant un tableau de données : ici la clé <code>'jeux'</code> deviendra la variable <code>\$jeux</code> utilisable dans le template.</p>

<h3>3. Le template Blade</h3>
<pre class="pseudo">{{-- resources/views/catalogue.blade.php : ceci est un commentaire Blade, invisible dans la page --}}
@foreach (\$jeux as \$jeu)                       {{-- répète le bloc pour CHAQUE jeu de la liste --}}
    &lt;tr&gt;                                    {{-- ouvre une ligne de tableau --}}
        &lt;td&gt;{{ \$jeu->titre }}&lt;/td&gt;          {{-- cellule : le titre du jeu (échappé) --}}
        &lt;td&gt;{{ \$jeu->prix_location }} €&lt;/td&gt; {{-- cellule : le prix de location --}}
        &lt;td&gt;                                {{-- cellule contenant le bouton d'action --}}
            &lt;form method="POST" action="/louer/{{ \$jeu->id }}"&gt;  {{-- formulaire envoyé vers /louer/ID du jeu --}}
                @csrf                          {{-- insère le jeton anti-CSRF (obligatoire) --}}
                &lt;button&gt;Louer&lt;/button&gt;         {{-- bouton qui déclenche l'envoi --}}
            &lt;/form&gt;                          {{-- ferme le formulaire --}}
        &lt;/td&gt;                               {{-- ferme la cellule --}}
    &lt;/tr&gt;                                   {{-- ferme la ligne --}}
@endforeach                                    {{-- fin de la boucle --}}</pre>
<p><code>@foreach (\$jeux as \$jeu) … @endforeach</code> est une <strong>boucle</strong> : le bloc se répète pour chaque élément de la liste, <code>\$jeu</code> prenant tour à tour chaque jeu. Les doubles accolades <code>{{ … }}</code> <strong>affichent</strong> une valeur en l'<em>échappant</em> (voir §5). <code>@csrf</code> insère un <strong>jeton anti-CSRF</strong> : la <strong>CSRF</strong> (<em>Cross-Site Request Forgery</em>) est une attaque où un site piège votre navigateur pour lui faire envoyer une action à votre insu ; ce jeton secret prouve que le formulaire vient bien de notre site. Il est obligatoire sur tout formulaire <strong>POST</strong>.</p>

<h3>4. Layouts et composants</h3>
<pre class="pseudo">{{-- layout de base : resources/views/layout.blade.php --}}
&lt;body&gt;@yield('contenu')&lt;/body&gt;                {{-- @yield réserve un emplacement nommé « contenu » --}}

{{-- une page qui utilise ce layout --}}
@extends('layout')                             {{-- « je réutilise le squelette layout » --}}
@section('contenu') ... @endsection            {{-- remplit l'emplacement « contenu » avec ce texte --}}</pre>
<p>Un <strong>layout</strong> (« gabarit général ») factorise les parties communes à toutes les pages : en-tête, menu, pied de page. <code>@yield('contenu')</code> y marque un trou nommé. Une page fait <code>@extends('layout')</code> pour réutiliser ce squelette, puis <code>@section('contenu') … @endsection</code> pour remplir le trou. On évite ainsi de recopier l'ossature sur chaque page.</p>

<h3>5. Sécurité des vues</h3>
<div class="warn">Les doubles accolades <code>{{ }}</code> <strong>échappent</strong> automatiquement le HTML : tout caractère spécial (comme &lt; ou &gt;) est transformé en texte inoffensif. Un titre malicieux ne peut donc pas exécuter de code : c'est la protection contre le <strong>XSS</strong> (<em>Cross-Site Scripting</em>), une attaque qui injecte du code indésirable dans une page. N'utilise la forme non échappée <code>{!! !!}</code> que sur du contenu dont tu es totalement sûr.</div>
<div class="tip">Le même <code>CatalogueService</code> sert l'API et les pages Blade : une seule logique métier, deux présentations. L'utilisateur voit enfin la Ludothèque.</div>`,
  exercises: [
    { type: "qcm", q: "Pour rendre du HTML côté serveur, on utilise…", opts: ["Une API Resource", "Blade (view(...))", "un DTO", "un test"], a: 1, exp: "Vue serveur." },
    { type: "qcm", q: "Un contrôleur web renvoie…", opts: ["Du JSON", "Une vue (view('nom', [...]))", "Un binaire", "Rien"], a: 1, exp: "view()." },
    { type: "qcm", q: "Les templates Blade sont dans…", opts: ["app/Models", "resources/views", "routes", "public"], a: 1, exp: "Dossier des vues." },
    { type: "qcm", q: "Boucler dans Blade :", opts: ["@for", "@foreach ($jeux as $jeu)", "for(...)", "map()"], a: 1, exp: "@foreach." },
    { type: "qcm", q: "Afficher une valeur :", opts: ["{{ $jeu->titre }}", "<%= titre %>", "{{{ }}}", "@show"], a: 0, exp: "Doubles accolades." },
    { type: "qcm", q: "Le jeton anti-CSRF dans un form POST :", opts: ["@token", "@csrf", "@post", "@secure"], a: 1, exp: "@csrf." },
    { type: "qcm", q: "{{ }} protège de…", opts: ["La lenteur", "L'injection de script (XSS) via l'échappement", "Les doublons", "Le tri"], a: 1, exp: "Échappement HTML." },
    { type: "qcm", q: "{!! !!} affiche…", opts: ["Du HTML échappé", "Du HTML NON échappé (à réserver au contenu de confiance)", "Un nombre", "Rien"], a: 1, exp: "Non échappé." },
    { type: "qcm", q: "Un layout sert à…", opts: ["Router", "Factoriser en-tête, menu, pied de page", "Migrer", "Valider"], a: 1, exp: "Structure commune." },
    { type: "qcm", q: "Étendre un layout :", opts: ["@extends('layout')", "@import", "include only", "@use"], a: 0, exp: "@extends." },
    { type: "vf", q: "Le même service alimente l'API et les pages Blade.", a: true, exp: "Une logique, deux vues." },
    { type: "qcm", q: "@section / @yield servent à…", opts: ["Trier", "Injecter le contenu d'une page dans le layout", "Chiffrer", "Compter"], a: 1, exp: "Composition de vues." },
    { type: "vf", q: "@csrf est obligatoire sur les formulaires POST.", a: true, exp: "Protection CSRF." },
    { type: "qcm", q: "view('catalogue', ['jeux' => ...]) …", opts: ["Redirige", "Rend le template avec les données", "Supprime", "Migre"], a: 1, exp: "Rendu de vue." },
    { type: "qcm", q: "Un titre malicieux dans {{ }} …", opts: ["Exécute un script", "Est affiché en texte (échappé)", "Casse la page", "Est ignoré"], a: 1, exp: "Sécurité XSS." }
  ],
  final: {
    title: "Exercice final — Afficher le catalogue",
    intro: `<p>On rend une page listant les jeux louables.</p>`,
    questions: [
      { type: "qcm", q: "Le contrôleur renvoie :", opts: ["view('catalogue', ['jeux' => ...])", "return $jeux", "un JSON", "abort()"], a: 0, exp: "Vue." },
      { type: "qcm", q: "Boucler dans le template :", opts: ["@foreach ($jeux as $jeu)", "for jeu", "map()", "@each seul"], a: 0, exp: "@foreach." },
      { type: "qcm", q: "Afficher le titre :", opts: ["{{ $jeu->titre }}", "<%= titre %>", "{{{ titre }}}", "@show"], a: 0, exp: "{{ }}." },
      { type: "qcm", q: "Le form « Louer » a besoin de :", opts: ["@csrf", "rien", "@secure", "@token"], a: 0, exp: "Anti-CSRF." },
      { type: "vf", q: "Blade échappe le HTML pour éviter les injections de script.", a: true, exp: "Protection XSS." }
    ],
    solution: `<pre class="pseudo">// contrôleur : prépare les données et choisit la vue
public function index(CatalogueService \$service) {          // service fourni par injection
    return view('catalogue', ['jeux' => \$service->jeuxLouables()]);  // rend la vue avec la liste des jeux
}

{{-- catalogue.blade.php : le template affiché --}}
@foreach (\$jeux as \$jeu)                        {{-- répète pour chaque jeu --}}
    &lt;tr&gt;                                    {{-- ligne du tableau --}}
        &lt;td&gt;{{ \$jeu->titre }}&lt;/td&gt;          {{-- titre du jeu (échappé) --}}
        &lt;td&gt;{{ \$jeu->prix_location }} €&lt;/td&gt; {{-- prix de location --}}
        &lt;td&gt;&lt;form method="POST" action="/louer/{{ \$jeu->id }}"&gt;@csrf&lt;button&gt;Louer&lt;/button&gt;&lt;/form&gt;&lt;/td&gt;  {{-- formulaire « Louer » + jeton anti-CSRF --}}
    &lt;/tr&gt;                                   {{-- fin de la ligne --}}
@endforeach                                    {{-- fin de la boucle --}}</pre>
<p>L'utilisateur voit la Ludothèque. Fin de la semaine 2 ! Demain : recherche et pagination.</p>`
  }
};
</script>

    solution: "// JeuWebController\npublic function show(Jeu $jeu) {                    // route model binding : Laravel charge le jeu (404 si absent)\n    return view('detail', ['jeu' => $jeu]);         // rend la vue « detail » avec ce jeu\n}\n\n{{-- resources/views/detail.blade.php --}}\n<h1>{{ $jeu->titre }}</h1>                           {{-- titre du jeu (échappé) --}}\n<p>{{ $jeu->prix_location }} € / location</p>        {{-- prix de location --}}\n<form method=\"POST\" action=\"/louer/{{ $jeu->id }}\">  {{-- formulaire d'envoi vers /louer/ID --}}\n    @csrf                                            {{-- jeton anti-CSRF obligatoire --}}\n    <button>Louer</button>                           {{-- bouton qui envoie le formulaire --}}\n</form>",
