<h3>1. Pourquoi une couche service ?</h3>
<p>La <strong>logique métier</strong> regroupe les règles propres à l'activité (« on ne peut louer que s'il reste du stock », « on décrémente à l'achat »). Laravel n'oblige pas à créer une couche dédiée, mais entasser ces règles dans les contrôleurs les rend gros, difficiles à lire et impossibles à réutiliser. On les isole donc dans des classes <strong>Service</strong> (rangées dans <code>app/Services</code>) : le métier vit au centre, se teste facilement, et sert aussi bien aux pages web qu'à l'API. C'est comme confier la cuisine à un chef spécialisé plutôt que de la faire faire par le serveur qui prend les commandes.</p>

<h3>2. Un service du catalogue</h3>
<pre class="pseudo">namespace App\\Services;                              // "adresse" logique de la classe (elle vit dans app/Services)

class CatalogueService {                             // classe de service : regroupe des actions métier du catalogue
    public function jeuxLouables() {                 // méthode : renvoie les jeux que l'on peut louer
        return Jeu::louables()->with('categorie')->get();  // scope "louables" + catégorie préchargée + exécution
    }

    public function ajouterStockLocation(int $idJeu, int $quantite): void {  // ajoute du stock ; ": void" = ne renvoie rien
        DB::transaction(function () use ($idJeu, $quantite) {  // ce bloc réussit entièrement ou est totalement annulé
            $jeu = Jeu::findOrFail($idJeu);          // récupère le jeu, ou erreur 404 s'il n'existe pas
            $jeu->increment('stock_location', $quantite);  // ajoute "quantite" au stock de location, en une seule requête
        });                                          // fin de la transaction (validée si tout s'est bien passé)
    }
}</pre>
<p>Un <strong>namespace</strong> (« espace de noms ») est l'adresse logique d'une classe, qui évite de confondre deux classes portant le même nom — comme le préfixe d'un numéro de téléphone par pays. Le mot-clé <code>use</code> (vu plus bas) sert à « importer » une classe pour l'appeler par son nom court.</p>

<h3>3. L'injection de dépendances</h3>
<pre class="pseudo">// Laravel injecte le service automatiquement (via son conteneur)
public function index(CatalogueService $service) {   // on "demande" un CatalogueService en paramètre : Laravel le fournit tout prêt
    return view('catalogue', ['jeux' => $service->jeuxLouables()]);  // affiche la vue "catalogue" avec la liste des jeux
}</pre>
<p>L'<strong>injection de dépendances</strong> consiste à <em>recevoir</em> les objets dont on a besoin au lieu de les <em>fabriquer</em> soi-même : on les commande, ils sont livrés. Concrètement on <strong>type-hint</strong> le service (on écrit son type devant le paramètre) ; le <strong>conteneur</strong> de Laravel — l'usine qui sait construire les objets, comme le conteneur de Spring — l'instancie et l'injecte. Le contrôleur ne le crée jamais lui-même, ce qui le rend simple à tester (on peut lui fournir une fausse version).</p>

<h3>4. Les transactions</h3>
<pre class="pseudo">DB::transaction(function () {         // ouvre une transaction : un bloc "tout ou rien"
    // plusieurs écritures…            // ici on enchaînerait plusieurs modifications en base
});   // COMMIT (validation) automatique à la fin ; ROLLBACK (annulation) si une exception survient</pre>
<p>Une <strong>transaction</strong> garantit l'<strong>atomicité</strong> : soit toutes les écritures réussissent, soit aucune n'est conservée — comme un virement bancaire où débit et crédit sont indissociables. Le <strong>COMMIT</strong> valide définitivement les changements ; le <strong>ROLLBACK</strong> les annule et remet la base dans l'état d'avant. Une <strong>exception</strong> est une erreur signalée en cours d'exécution (« ce jeu n'existe pas ») ; si elle survient, Laravel déclenche le ROLLBACK tout seul. Indispensable pour louer/acheter (leçons 12-13).</p>

<h3>5. Le service décide, le reste exécute</h3>
<div class="tip">Règle simple : le contrôleur traduit HTTP ↔ appels de service ; le service <strong>décide</strong> (règles, transactions) ; le modèle Eloquent <strong>persiste</strong> (enregistre durablement en base — « persister » = faire survivre la donnée après la fin du programme). Isoler le métier permet de le tester sans HTTP ni base réelle (leçon 17) et de le réutiliser depuis l'API comme depuis les pages web.</div>
`,

class CatalogueService {                             // service du catalogue
