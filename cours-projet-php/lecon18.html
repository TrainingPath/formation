<script>
var DAY = {
  num: 18,
  title: "Tests de fonctionnalité (HTTP, base de test)",
  subtitle: "Vérifier l'assemblage réel de toutes les couches.",
  theory: `
<h3>1. Unitaire vs fonctionnalité</h3>
<p>Le test unitaire isole une seule brique (leçon 17). Le <strong>test de fonctionnalité</strong> (en anglais <em>feature test</em>) vérifie au contraire la <strong>chaîne complète</strong>, de bout en bout : route → contrôleur → service → base de données, en envoyant de <em>vraies</em> requêtes <strong>HTTP</strong> (le langage par lequel le navigateur et le serveur se parlent). C'est la différence entre tester une pièce isolée d'une voiture et faire réellement rouler la voiture.</p>

<h3>2. Envoyer une requête</h3>
<pre class="pseudo">public function test_liste_les_jeux(): void {              // test : GET /api/jeux doit lister les jeux
    Jeu::factory()->create();                             // fabrique 1 jeu de test en base
    \$this->getJson('/api/jeux')                           // envoie une vraie requête GET (réponse attendue en JSON)
         ->assertOk()                                     // vérifie le statut 200 (« OK »)
         ->assertJsonCount(1, 'data');                    // vérifie qu'il y a 1 jeu dans la liste « data »
}</pre>
<p><code>getJson</code>, <code>postJson</code>, <code>get</code>, <code>post</code> envoient de vraies requêtes HTTP au site, chacune correspondant à un type d'action (consulter, envoyer…). Les <strong>assertions</strong> qui suivent vérifient la réponse : <code>assertOk()</code> contrôle le <strong>statut</strong> <strong>200</strong> (le code « tout va bien »), <code>assertJsonCount(1, 'data')</code> contrôle le contenu (ici : 1 élément dans la <em>collection</em> « data »).</p>

<h3>3. Simuler un utilisateur connecté</h3>
<pre class="pseudo">\$client = User::factory()->create(['role' => Role::CLIENT]);  // crée un utilisateur de rôle « client »
\$this->actingAs(\$client)                                  // « fais comme si ce client était connecté »
     ->postJson('/api/jeux', ['titre' => 'X'])            // il tente de créer un jeu (requête POST)
     ->assertForbidden();                                 // on vérifie le refus : statut 403 (« interdit »)</pre>
<p><code>actingAs(\$user)</code> connecte un utilisateur le temps du test, sans passer par le formulaire de connexion. On peut ainsi tester l'<strong>autorisation</strong> : ici, un client ne doit PAS pouvoir créer de jeu, d'où le statut <strong>403</strong> (<em>Forbidden</em>, « interdit ») attendu.</p>

<h3>4. Vérifier la base</h3>
<pre class="pseudo">\$this->post('/louer/1', [...]);                           // envoie une vraie requête POST pour louer le jeu 1
\$this->assertDatabaseHas('locations', ['jeu_id' => 1]);   // vérifie qu'une location du jeu 1 existe bien en base
\$this->assertDatabaseCount('locations', 1);               // vérifie qu'il y a exactement 1 location enregistrée</pre>
<p>Des assertions dédiées inspectent directement l'état de la base après l'action : <code>assertDatabaseHas('table', [...])</code> vérifie qu'une ligne correspondante existe, <code>assertDatabaseCount('table', n)</code> vérifie le nombre de lignes. On confirme ainsi que l'action a bien été enregistrée.</p>

<h3>5. La pyramide des tests</h3>
<div class="tip">La <strong>pyramide des tests</strong> : beaucoup de tests unitaires (rapides, ciblés) à la base, moins de tests de fonctionnalité au sommet (plus lents, mais réalistes car ils traversent tout). Ensemble, ils garantissent que la Ludothèque marche vraiment. Tout tourne sur une base de test jetable, jamais la production.</div>`,
  exercises: [
    { type: "qcm", q: "Un test de fonctionnalité vérifie…", opts: ["Une méthode isolée", "La chaîne complète via HTTP", "Le CSS", "Rien"], a: 1, exp: "Assemblage réel." },
    { type: "qcm", q: "Envoyer une requête GET JSON :", opts: ["$this->getJson('/api/jeux')", "$this->httpGet('/api/jeux')", "$this->visit('/api/jeux')", "$this->call('/api/jeux')"], a: 0, exp: "getJson." },
    { type: "qcm", q: "Vérifier un statut 200 :", opts: ["->assertOk()", "->assertStatus(true)", "->assertSuccess()", "->assert200()"], a: 0, exp: "assertOk." },
    { type: "qcm", q: "Vérifier le nombre d'éléments JSON :", opts: ["->assertJsonCount(1, 'data')", "count()", "size()", "->length"], a: 0, exp: "assertJsonCount." },
    { type: "qcm", q: "Simuler un utilisateur connecté :", opts: ["actingAs($user)", "loginAs($user)", "beUser($user)", "signIn($user)"], a: 0, exp: "actingAs." },
    { type: "qcm", q: "Un client tentant de créer un jeu reçoit…", opts: ["200", "403 Forbidden", "201", "404"], a: 1, exp: "Interdit." },
    { type: "qcm", q: "Vérifier une ligne en base :", opts: ["assertDatabaseHas('locations', [...])", "assertEquals", "print", "SELECT manuel"], a: 0, exp: "Assertion base." },
    { type: "qcm", q: "Compter des lignes en base :", opts: ["assertDatabaseCount('locations', 1)", "count()", "size()", "->all()"], a: 0, exp: "assertDatabaseCount." },
    { type: "qcm", q: "La base des tests est…", opts: ["La production", "Jetable (souvent SQLite en mémoire)", "Absente", "Le fichier .env"], a: 1, exp: "Isolée." },
    { type: "qcm", q: "La pyramide : le plus nombreux =", opts: ["Feature", "Unitaires", "Manuels", "Aucun"], a: 1, exp: "Base large." },
    { type: "vf", q: "On ne teste jamais sur la base de production.", a: true, exp: "Base dédiée." },
    { type: "qcm", q: "postJson envoie…", opts: ["Une vue", "Une requête POST JSON", "Un fichier", "Rien"], a: 1, exp: "Requête POST." },
    { type: "vf", q: "Le test de fonctionnalité traverse route, contrôleur, service et base.", a: true, exp: "Toutes les couches." },
    { type: "qcm", q: "Les feature tests sont, vs unitaires…", opts: ["Plus rapides", "Plus lents mais plus réalistes", "Identiques", "Inutiles"], a: 1, exp: "Compromis." },
    { type: "qcm", q: "actingAs sert surtout à tester…", opts: ["La mise en page", "L'autorisation selon le rôle", "La rapidité", "Le format JSON"], a: 1, exp: "Sécurité." }
  ],
  final: {
    title: "Exercice final — Tester l'API bout en bout",
    intro: `<p>On valide l'assemblage réel.</p>`,
    questions: [
      { type: "qcm", q: "Appeler GET /api/jeux :", opts: ["$this->getJson('/api/jeux')", "curl", "new URL()", "print"], a: 0, exp: "getJson." },
      { type: "qcm", q: "Attendre un 200 :", opts: ["->assertOk()", "assertEquals", "print", "return"], a: 0, exp: "Statut." },
      { type: "qcm", q: "Tester qu'un client ne crée pas de jeu :", opts: ["actingAs($client)->postJson(...)->assertForbidden()", "ignorer la sécurité", "en prod", "print"], a: 0, exp: "403." },
      { type: "qcm", q: "Vérifier la location en base :", opts: ["assertDatabaseHas('locations', [...])", "assertEquals", "SELECT manuel", "print"], a: 0, exp: "Assertion base." },
      { type: "vf", q: "actingAs permet de tester l'autorisation selon le rôle.", a: true, exp: "Utilisateur simulé." }
    ],
    solution: `<pre class="pseudo">use Illuminate\\Foundation\\Testing\\RefreshDatabase;      // outil « base remise à neuf »

class JeuApiTest extends TestCase {                        // classe de tests de l'API des jeux
    use RefreshDatabase;                                   // base vierge avant chaque test

    public function test_liste_les_jeux(): void {          // test : lister les jeux
        Jeu::factory()->create();                          // 1 jeu de test
        \$this->getJson('/api/jeux')                        // GET /api/jeux
             ->assertOk()                                  // statut 200
             ->assertJsonCount(1, 'data');                 // 1 élément dans « data »
    }
    public function test_client_ne_cree_pas_de_jeu(): void {  // test : un client ne peut pas créer un jeu
        \$client = User::factory()->create(['role' => Role::CLIENT]);  // un utilisateur client
        \$this->actingAs(\$client)                           // connecté en tant que ce client
             ->postJson('/api/jeux', ['titre' => 'X'])     // tente de créer un jeu
             ->assertForbidden();                          // doit recevoir 403 (interdit)
    }
}</pre>
<p>L'assemblage est validé. Demain : la qualité (logs, N+1, .env).</p>`
  }
};
</script>

    ],
    solution: "use Illuminate\\Foundation\\Testing\\RefreshDatabase;      // outil « base remise à neuf »\n\nclass JeuDetailTest extends TestCase {                     // tests de la consultation d'un jeu\n    use RefreshDatabase;                                   // base vierge avant chaque test\n\n    public function test_consulte_un_jeu(): void {         // cas nominal : consulter un jeu existant\n        $jeu = Jeu::factory()->create(['titre' => 'Catan']);  // crée un jeu de test nommé « Catan »\n        $this->getJson('/api/jeux/'.$jeu->id)              // GET /api/jeux/ID de ce jeu (concaténation avec .)\n             ->assertOk()                                  // statut 200\n             ->assertJsonPath('data.titre', 'Catan');      // le champ data.titre du JSON vaut bien « Catan »\n    }\n\n    public function test_jeu_inexistant_renvoie_404(): void {  // cas d'erreur : jeu introuvable\n        $this->getJson('/api/jeux/9999')->assertNotFound();  // un id inexistant doit renvoyer 404\n    }\n}",

  ]
