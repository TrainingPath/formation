<script>
var DAY = {
  num: 4,
  title: "Le catalogue : modèles Eloquent JEU, CATEGORIE, FOURNISSEUR",
  subtitle: "Refléter les tables MySQL en objets PHP avec Eloquent.",
  theory: `
<h3>1. Un modèle = une table</h3>
<p>Une <strong>classe</strong> est un plan, un moule qui décrit un type d'objet (par exemple « un jeu ») ; une <strong>instance</strong> est un exemplaire concret fabriqué à partir de ce moule (par exemple « Les Aventuriers du Rail »). <strong>Eloquent</strong> est l'<strong>ORM</strong> de Laravel — <em>Object-Relational Mapping</em>, littéralement « correspondance objet ↔ relationnel » : un outil qui fait le pont entre les objets du code et les tables de la base, pour manipuler les données sans écrire de SQL à la main. La règle est simple : une classe <strong>modèle</strong> correspond à une table, et une instance à une <strong>ligne</strong> de cette table. Par <strong>convention</strong> (une règle implicite que Laravel suppose), le modèle <code>Jeu</code> (singulier) vise automatiquement la table <code>jeux</code> (pluriel).</p>
<pre class="pseudo">php artisan make:model Jeu   # génère le fichier du modèle Jeu dans app/Models</pre>

<h3>2. Le modèle Jeu</h3>
<pre class="pseudo">class Jeu extends Model {                    // "extends Model" : Jeu hérite de tous les pouvoirs d'Eloquent
    protected $fillable = [                   // liste blanche des colonnes remplissables "en masse"
        'titre', 'prix_achat', 'prix_location',
        'stock_vente', 'stock_location', 'categorie_id', 'fournisseur_id',
    ];

    public function categorie() {             // définit la relation : à quelle catégorie ce jeu appartient
        return $this->belongsTo(Categorie::class);   // belongsTo = "appartient à" (la clé étrangère est côté jeu)
    }
    public function fournisseur() {           // définit la relation vers le fournisseur du jeu
        return $this->belongsTo(Fournisseur::class); // belongsTo = ce jeu appartient à un fournisseur
    }
}</pre>
<p><code>extends Model</code> signifie que <code>Jeu</code> <strong>hérite</strong> (récupère automatiquement) toutes les capacités de la classe <code>Model</code> d'Eloquent. <code>$fillable</code> (« remplissable ») liste les colonnes que l'on autorise à remplir d'un coup avec <code>Jeu::create([...])</code> : c'est une protection contre l'<strong>assignation de masse</strong>, c'est-à-dire le risque qu'un utilisateur malin remplisse une colonne sensible non prévue (comme un champ « administrateur »). <code>$this</code> désigne « l'objet courant », le jeu concerné.</p>

<h3>3. Les relations</h3>
<p>Une <strong>relation</strong> décrit un lien entre deux tables. On la déclare une fois dans le modèle, puis on y accède comme à une simple propriété. Une <strong>collection</strong> est une liste d'objets renvoyée par Eloquent (un panier d'objets que l'on peut parcourir).</p>
<pre class="pseudo">belongsTo   « appartient à » : Jeu → Categorie (clé étrangère côté jeu)
hasMany     « possède plusieurs » : Categorie → Jeu
$jeu->categorie      accède à la catégorie (un objet)
$categorie->jeux     accède aux jeux (une collection)</pre>
<p><code>belongsTo</code> et <code>hasMany</code> sont les deux faces d'un même lien : le jeu « appartient à » une catégorie, et réciproquement la catégorie « possède plusieurs » jeux.</p>

<h3>4. Le CRUD Eloquent</h3>
<p><strong>CRUD</strong> résume les quatre opérations de base sur des données : <em>Create</em> (créer), <em>Read</em> (lire), <em>Update</em> (modifier), <em>Delete</em> (supprimer) — comme les gestes possibles sur une fiche cartonnée : en écrire une, la consulter, la corriger, la jeter.</p>
<pre class="pseudo">Jeu::create([...]);              // CRÉER : insère une nouvelle ligne dans la table jeux
Jeu::find(1);                    // LIRE le jeu n°1 ; renvoie null (rien) s'il n'existe pas
Jeu::findOrFail(1);              // LIRE le jeu n°1 ; déclenche une erreur 404 s'il est absent
$jeu->update(['prix_location' => 4.5]);  // MODIFIER : change le prix de location de ce jeu
$jeu->delete();                  // SUPPRIMER : efface ce jeu de la table
Jeu::all();                      // LIRE TOUS les jeux (renvoie une collection)</pre>
<p>Une <strong>erreur 404</strong> est le code standard du web signifiant « page ou ressource introuvable ». <code>find</code> renvoie discrètement <em>null</em> (rien) si le jeu n'existe pas, tandis que <code>findOrFail</code> arrête net en renvoyant une page 404 — utile pour ne pas continuer avec un objet vide.</p>

<h3>5. Casts et cohérence</h3>
<pre class="pseudo">protected $casts = [                     // conversions automatiques colonne → type PHP
    'prix_location' => 'decimal:2',      // prix_location manipulé comme un décimal à 2 chiffres
    'stock_vente'   => 'integer',        // stock_vente manipulé comme un entier
];</pre>
<div class="tip">Un <strong>cast</strong> (« conversion ») transforme automatiquement une colonne brute de la base en un <strong>type PHP</strong> propre : un texte « 4.50 » devient un vrai nombre décimal, un « 1 » devient <em>vrai</em>, etc. — comme un traducteur qui rend les données directement utilisables. Le modèle reflète ainsi fidèlement le schéma des migrations (leçon 3) et les relations du MCD Merise : Eloquent fait le pont entre les objets PHP et les tables MySQL, sans une ligne de SQL manuel.</div>
`,
  exercises: [
    { type: "qcm", q: "Eloquent est…", opts: ["Un serveur", "L'ORM de Laravel (objet ↔ table)", "Un moteur de vue", "Un routeur"], a: 1, exp: "ORM." },
    { type: "qcm", q: "Le modèle Jeu vise par convention la table…", opts: ["Jeu", "jeux", "JEU_TABLE", "table_jeu"], a: 1, exp: "Pluriel snake_case." },
    { type: "qcm", q: "Créer un modèle :", opts: ["php artisan make:model Jeu", "php artisan create:model Jeu", "php artisan model:new Jeu", "composer make:model Jeu"], a: 0, exp: "make:model." },
    { type: "qcm", q: "$fillable sert à…", opts: ["Masquer des colonnes en JSON", "Autoriser l'assignation de masse de ces champs", "Chiffrer les données sensibles", "Déclarer les relations Eloquent"], a: 1, exp: "Protection." },
    { type: "qcm", q: "Un jeu appartient à une catégorie :", opts: ["hasMany", "belongsTo(Categorie::class)", "belongsToMany", "hasOne"], a: 1, exp: "belongsTo." },
    { type: "qcm", q: "Une catégorie possède plusieurs jeux :", opts: ["belongsTo", "hasMany(Jeu::class)", "hasOne", "morphTo"], a: 1, exp: "hasMany." },
    { type: "qcm", q: "Lire un jeu ou lever 404 :", opts: ["Jeu::find(1)", "Jeu::findOrFail(1)", "Jeu::findOr404(1)", "Jeu::first()"], a: 1, exp: "findOrFail." },
    { type: "qcm", q: "Créer un jeu :", opts: ["Jeu::create([...])", "Jeu::new([...])", "Jeu::insert([...]) seul", "Jeu::add([...])"], a: 0, exp: "create." },
    { type: "qcm", q: "Modifier un jeu :", opts: ["$jeu->update([...])", "$jeu->modify([...])", "$jeu->save([...])", "Jeu::edit($jeu)"], a: 0, exp: "update." },
    { type: "qcm", q: "$jeu->categorie accède à…", opts: ["La table", "L'objet catégorie lié", "Le prix", "Le stock"], a: 1, exp: "Relation." },
    { type: "vf", q: "Un cast convertit automatiquement une colonne en type PHP.", a: true, exp: "decimal:2, integer…" },
    { type: "qcm", q: "$fillable protège contre…", opts: ["Les 404", "L'assignation de masse involontaire", "Le tri", "Les migrations"], a: 1, exp: "Mass assignment." },
    { type: "vf", q: "Le modèle reflète le schéma des migrations et les relations du MCD.", a: true, exp: "Cohérence." },
    { type: "qcm", q: "Jeu::all() renvoie…", opts: ["Un seul jeu", "Tous les jeux (collection)", "Le nombre", "null"], a: 1, exp: "Tous." },
    { type: "qcm", q: "Le prix se cast en…", opts: ["'decimal:2'", "'boolean'", "'array'", "'datetime'"], a: 0, exp: "Décimal exact." }
  ],
  final: {
    title: "Exercice final — Le modèle Jeu",
    intro: `<p>On mappe la table jeux en modèle Eloquent.</p>`,
    questions: [
      { type: "qcm", q: "La classe étend…", opts: ["Controller", "Model", "Request", "Resource"], a: 1, exp: "extends Model." },
      { type: "qcm", q: "Autoriser create([...]) :", opts: ["protected $fillable = [...]", "public $all = true", "rien", "$guarded = ['*']"], a: 0, exp: "$fillable." },
      { type: "qcm", q: "Relation vers la catégorie :", opts: ["belongsTo(Categorie::class)", "hasMany", "hasOne", "morphTo"], a: 0, exp: "belongsTo." },
      { type: "qcm", q: "Lire un jeu ou 404 :", opts: ["Jeu::find(1)", "Jeu::findOrFail(1)", "Jeu::query()", "Jeu::first()"], a: 1, exp: "findOrFail." },
      { type: "vf", q: "Les deux stocks (vente et location) sont deux colonnes/attributs distincts.", a: true, exp: "Modèle Ludothèque." }
    ],
    solution: `<pre class="pseudo">class Jeu extends Model {                     // Jeu hérite des capacités d'Eloquent
    protected $fillable = [                    // colonnes autorisées en assignation de masse
        'titre', 'prix_achat', 'prix_location',
        'stock_vente', 'stock_location', 'categorie_id', 'fournisseur_id',
    ];
    protected $casts = ['prix_location' => 'decimal:2'];   // prix converti en décimal à 2 chiffres

    public function categorie() { return $this->belongsTo(Categorie::class); }     // le jeu appartient à une catégorie
    public function fournisseur() { return $this->belongsTo(Fournisseur::class); } // le jeu appartient à un fournisseur
}</pre>
<p>Le catalogue existe en objets PHP. Demain : interroger avec Eloquent et les scopes.</p>`
  }
};
</script>

    statement: "Écris le modèle Categorie (relation hasMany vers Jeu) et le modèle Location (champs remplissables client_id, jeu_id, date_debut, nb_jours, rendue ; relations belongsTo vers User (client) et Jeu). Ajoute un cast de 'rendue' en booléen.",
    hints: [
      "Categorie : public function jeux() { return $this->hasMany(Jeu::class); }",
      "Location : protected $fillable = ['client_id','jeu_id','date_debut','nb_jours','rendue'];",
      "protected $casts = ['rendue' => 'boolean', 'date_debut' => 'date'];"
    ],
    solution: "class Categorie extends Model {                          // modèle de la table categories\n    protected $fillable = ['libelle'];                   // seule colonne remplissable : le libellé\n    public function jeux() { return $this->hasMany(Jeu::class); }   // une catégorie possède plusieurs jeux (hasMany)\n}\n\nclass Location extends Model {                           // modèle de la table locations\n    protected $fillable = ['client_id', 'jeu_id', 'date_debut', 'nb_jours', 'rendue'];   // colonnes remplissables en masse\n    protected $casts = ['rendue' => 'boolean', 'date_debut' => 'date'];   // conversions : rendue en vrai/faux, date_debut en date\n\n    public function client() { return $this->belongsTo(User::class, 'client_id'); }   // la location appartient à un client (User)\n    public function jeu() { return $this->belongsTo(Jeu::class); }   // la location appartient à un jeu\n}",
    atoi: { cmd: "php artisan tinker\n>>> (new App\\Models\\Categorie)->jeux()->toSql()", expected: "= \"select * from `jeux` where `jeux`.`categorie_id` = ? and `jeux`.`categorie_id` is not null\"" },
    checklist: ["Categorie a une methode jeux() qui renvoie hasMany(Jeu::class).", "Location declare $fillable avec client_id, jeu_id, date_debut, nb_jours, rendue.", "Location a client() et jeu() en belongsTo (client() precise la cle 'client_id').", "Le cast 'rendue' => 'boolean' est bien present."],

  ]
