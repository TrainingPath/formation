var DAY = {
  num: 16,
  title: "Les espaces client, vendeur et administrateur",
  subtitle: "Trois profils, trois interfaces cloisonnées.",
  theory: `
<h3>1. Un espace par rôle</h3>
<p>Chaque profil dispose de son propre <strong>espace</strong> — une zone du site adaptée à ses besoins et à ses droits : <strong>/client</strong> (ses locations et achats), <strong>/vendeur</strong> (gérer les stocks), <strong>/admin</strong> (gérer les comptes). Chaque ensemble de routes est réservé au bon rôle, comme des étages d'un immeuble accessibles par des badges différents.</p>

<h3>2. Cloisonner par groupes de routes</h3>
<p>Un <strong>groupe de routes</strong> applique un même réglage (filtres, préfixe) à plusieurs routes d'un coup, sans le répéter.</p>
<pre class="pseudo">Route::middleware('auth')->group(function () {              // groupe réservé aux utilisateurs connectés
    Route::get('/client', [ClientController::class, 'index']);  // GET /client → espace client
});
Route::middleware(['auth', 'can:gerer-stock'])->prefix('vendeur')->group(function () {  // connectés ET ayant le droit gerer-stock ; URLs préfixées /vendeur
    Route::post('/stock', [VendeurController::class, 'ajouterStock']);  // POST /vendeur/stock → ajouterStock()
});
Route::middleware(['auth', 'can:gerer-comptes'])->prefix('admin')->group(function () {  // connectés ET ayant le droit gerer-comptes ; URLs préfixées /admin
    Route::get('/utilisateurs', [AdminController::class, 'utilisateurs']);  // GET /admin/utilisateurs → liste des comptes
});</pre>
<p>On peut passer <em>plusieurs</em> filtres dans un tableau : <code>['auth', 'can:gerer-stock']</code> exige d'abord d'être connecté, puis d'avoir le droit. <code>prefix('vendeur')</code> ajoute automatiquement <code>/vendeur</code> devant chaque adresse du groupe : la route <code>/stock</code> devient donc <code>/vendeur/stock</code>. Filtre + préfixe cloisonnent l'espace entier d'un seul geste.</p>

<h3>3. L'espace client (ses données)</h3>
<pre class="pseudo">public function index() {                                   // affiche l'espace du client connecté
    \$user = auth()->user();                                 // récupère l'utilisateur actuellement connecté
    return view('client', [                                 // rend la vue « client »…
        'locations' => \$user->locations()->with('jeu')->get(),  // …ses locations, avec le jeu préchargé (évite le N+1)
        'achats' => \$user->achats()->with('jeu')->get(),    // …et ses achats, jeu préchargé aussi
    ]);
}</pre>
<p><code>auth()->user()</code> donne l'utilisateur connecté : le client ne voit que <strong>ses</strong> locations et achats (contrôle de propriété, leçon 11). <code>\$user->locations()</code> est une <strong>relation</strong> : elle relie l'utilisateur à ses locations dans la base. <code>->with('jeu')</code> fait de l'<strong>eager loading</strong> (« chargement anticipé ») : on charge d'un coup les jeux liés, ce qui évite le fameux <strong>problème N+1</strong> — une requête supplémentaire pour chaque ligne, qui ralentit tout. <code>->get()</code> exécute enfin la requête et récupère les résultats.</p>

<h3>4. L'espace vendeur (gérer le stock)</h3>
<pre class="pseudo">public function ajouterStock(Request \$r, StockService \$service) {  // reçoit la requête et le service de stock
    \$this->authorize('gerer-stock');                        // vérifie le droit (403 sinon)
    \$r->type === 'vente'                                    // si le type demandé vaut « vente »…
        ? \$service->ajouterStockVente(\$r->jeu_id, \$r->quantite)     // …alors ajoute au stock de vente
        : \$service->ajouterStockLocation(\$r->jeu_id, \$r->quantite); // sinon, au stock de location
    return redirect('/vendeur');                            // redirige vers l'espace vendeur (Post-Redirect-Get)
}</pre>
<p>La construction <code>condition ? A : B</code> est l'<strong>opérateur ternaire</strong> : un « si… alors… sinon… » compact qui choisit entre deux actions selon que la condition est vraie (A) ou fausse (B). Ici, selon le type demandé, on ajoute au bon stock. Le <strong>Post-Redirect-Get</strong> (PRG) est un motif : après un envoi de formulaire (POST), on renvoie une <em>redirection</em> plutôt qu'une page, afin qu'un rafraîchissement du navigateur ne réenvoie pas deux fois l'action.</p>

<h3>5. L'espace administrateur</h3>
<div class="tip">L'admin gère les jeux et les comptes en réutilisant les mêmes services. Les trois espaces partagent le métier ; seules la présentation et les autorisations changent. Le préfixe (<code>prefix('admin')</code>) + le middleware (<code>can:...</code>) cloisonnent proprement — la sécurité par route complète les Gates dans le code.</div>`,
  exercises: [
    { type: "qcm", q: "Combien d'espaces pour la Ludothèque ?", opts: ["Un", "Trois (client, vendeur, admin)", "Deux", "Cinq"], a: 1, exp: "Un par rôle." },
    { type: "qcm", q: "Cloisonner un ensemble de routes :", opts: ["Route::group avec middleware", "Une vue", "Un scope", "Un DTO"], a: 0, exp: "Groupes de routes." },
    { type: "qcm", q: "L'espace admin est protégé par…", opts: ["can:gerer-comptes", "permitAll", "rien", "css"], a: 0, exp: "Middleware d'autorisation." },
    { type: "qcm", q: "L'utilisateur connecté :", opts: ["auth()->user()", "User::all()", "session()->id", "request()"], a: 0, exp: "Utilisateur courant." },
    { type: "qcm", q: "Le client ne voit que…", opts: ["Toutes les locations", "Ses propres locations et achats", "Celles des admins", "Aucune"], a: 1, exp: "Propriété." },

    { type: "qcm", q: "L'espace vendeur sert à…", opts: ["Supprimer des comptes", "Gérer les stocks", "Rien", "Payer"], a: 1, exp: "Gestion du stock." },
    { type: "qcm", q: "Après un POST d'ajout de stock, on…", opts: ["Reste sur la page", "Redirige (redirect)", "Rafraîchit en boucle", "Supprime"], a: 1, exp: "Post-Redirect-Get." },
    { type: "qcm", q: "Les trois espaces réutilisent…", opts: ["Des services différents", "Les mêmes services métier", "Aucun service", "La base directement"], a: 1, exp: "Une seule logique." },
    { type: "qcm", q: "Ce qui change entre les espaces :", opts: ["Le métier", "La présentation et les droits", "La base", "Le langage"], a: 1, exp: "UI + autorisation." },
    { type: "vf", q: "La sécurité par route complète les Gates dans le code.", a: true, exp: "Défense en profondeur." },
    { type: "qcm", q: "with('jeu') sur les locations sert à…", opts: ["Trier", "Précharger le jeu (éviter le N+1)", "Chiffrer", "Compter"], a: 1, exp: "Eager loading." },
    { type: "vf", q: "Cloisonner par rôle applique directement le cahier des charges.", a: true, exp: "Trois profils." },
    { type: "qcm", q: "auth()->user()->locations() renvoie…", opts: ["Toutes les locations", "Les locations du connecté", "Les jeux", "Rien"], a: 1, exp: "Ses données." },
    { type: "qcm", q: "L'admin peut…", opts: ["Seulement consulter", "Gérer jeux ET comptes", "Rien", "Payer"], a: 1, exp: "Gestion complète." }
  ],
  final: {
    title: "Exercice final — Construire les espaces",
    intro: `<p>On câble les trois interfaces.</p>`,
    questions: [
      { type: "qcm", q: "Groupe de routes admin :", opts: ["Route::middleware(['auth','can:gerer-comptes'])->prefix('admin')->group(...)", "route publique", "abort(200)", "rien"], a: 0, exp: "Cloisonné." },
      { type: "qcm", q: "Espace client, ses données :", opts: ["auth()->user()->locations()", "Location::all()", "toutes les locations", "un DTO"], a: 0, exp: "Propriété." },
      { type: "qcm", q: "Vendeur ajoute du stock via…", opts: ["StockService (existant)", "un nouveau repository chaque fois", "la base en direct", "rien"], a: 0, exp: "Réutiliser le service." },
      { type: "qcm", q: "Après le POST vendeur :", opts: ["redirect('/vendeur')", "renvoyer la vue sans redirect", "boucle", "supprimer"], a: 0, exp: "PRG." },
      { type: "vf", q: "Les trois espaces partagent les mêmes services métier.", a: true, exp: "Une logique, trois vues." }
    ],
    solution: `<pre class="pseudo">Route::middleware('auth')->group(function () {              // groupe des connectés
    Route::get('/client', [ClientController::class, 'index']);  // GET /client → espace client
});
Route::middleware(['auth', 'can:gerer-stock'])->prefix('vendeur')->group(function () {  // connectés + droit gerer-stock ; préfixe /vendeur
    Route::post('/stock', [VendeurController::class, 'ajouterStock']);  // POST /vendeur/stock
});

// espace client : ses données
public function index() {                                   // affiche l'espace client
    \$user = auth()->user();                                 // l'utilisateur connecté
    return view('client', [                                 // rend la vue client…
        'locations' => \$user->locations()->with('jeu')->get(),  // …ses locations (jeu préchargé)
    ]);
}</pre>
<p>Les trois profils ont leur espace. Demain : les tests unitaires.</p>`
  }
};

    note: "L'espace admin réutilise le modèle User : seules l'autorisation (can:gerer-comptes) et la présentation changent. Le préfixe et le middleware cloisonnent tout le groupe d'un coup. Le POST suit le motif Post-Redirect-Get, et le route model binding charge l'utilisateur à modifier." }
  ]
