<script>
var DAY = {
  num: 8,
  title: "Validation (Form Request) et gestion des erreurs",
  subtitle: "Refuser les mauvaises données et répondre proprement.",
  theory: `
<h3>1. Ne jamais faire confiance aux entrées</h3>
<p><strong>Valider</strong> une donnée, c'est vérifier qu'elle respecte les règles attendues avant de la traiter (un prix positif, un email bien formé…) — le rôle du videur qui contrôle les entrées d'une salle. La règle absolue : ne jamais faire confiance à ce que l'utilisateur envoie, car cela peut être erroné ou malveillant. Laravel propose les <strong>Form Requests</strong> : des classes dédiées qui rassemblent les règles de validation d'un formulaire ou d'une requête.</p>
<pre class="pseudo">php artisan make:request StoreJeuRequest   # génère la classe de validation StoreJeuRequest</pre>

<h3>2. Écrire les règles</h3>
<pre class="pseudo">class StoreJeuRequest extends FormRequest {          // Form Request : classe qui porte les règles de validation
    public function authorize(): bool { return true; }  // authorize() : la requête est-elle permise ? (true = oui, pour tous)
    public function rules(): array {                 // rules() : renvoie le tableau des règles à respecter
        return [
            'titre' => 'required|string|max:120',    // titre : obligatoire, texte, 120 caractères maximum
            'prix_location' => 'required|numeric|min:0.01',  // prix : obligatoire, numérique, au moins 0,01
            'stock_location' => 'integer|min:0',     // stock : entier, jamais négatif
            'categorie_id' => 'required|exists:categories,id',  // doit correspondre à un id réel de la table categories
        ];
    }
}</pre>
<p>Les règles se lisent comme une liste de conditions séparées par le symbole <code>|</code> (« et aussi »). <code>required</code> = obligatoire, <code>string</code> = du texte, <code>numeric</code> = un nombre, <code>min</code> = valeur minimale, <code>max</code> = longueur maximale. La règle <code>exists:categories,id</code> vérifie que la catégorie référencée existe <em>vraiment</em> en base : c'est de l'intégrité contrôlée dès la requête.</p>

<h3>3. Déclencher la validation</h3>
<pre class="pseudo">public function store(StoreJeuRequest $request) {    // type-hinter la Form Request : Laravel valide AVANT d'entrer ici
    $jeu = Jeu::create($request->validated());   // validated() ne rend que les données validées → on crée le jeu
    return new JeuResource($jeu);                // renvoie le jeu créé, formaté par la Resource
}</pre>
<p>Il suffit de <strong>type-hinter</strong> la Form Request en paramètre : Laravel exécute la validation avant même d'entrer dans la méthode. En cas d'échec, il renvoie automatiquement le code <strong>422</strong> (« entité non traitable », l'erreur standard d'une validation ratée) pour une API, ou redirige vers le formulaire avec les messages d'erreur pour une page web.</p>

<h3>4. Afficher les erreurs en Blade</h3>
<p><strong>Blade</strong> est le moteur de gabarits de Laravel : du HTML agrémenté de petites <strong>directives</strong> commençant par <code>@</code>. Voici comment montrer une erreur à l'utilisateur :</p>
<pre class="pseudo">@error('titre')                                       {{-- s'exécute seulement si le champ "titre" a une erreur --}}
    &lt;span class="erreur"&gt;{{ $message }}&lt;/span&gt;    {{-- affiche le message d'erreur ; {{ }} = "afficher la valeur" --}}
@enderror                                             {{-- marque la fin du bloc @error --}}
&lt;input name="titre" value="{{ old('titre') }}"&gt;     {{-- réaffiche la saisie précédente pour ne pas la reperdre --}}</pre>
<p>La directive <code>@error('titre')</code> affiche son contenu uniquement si ce champ a échoué à la validation ; <code>{{ $message }}</code> insère le texte de l'erreur ; <code>old('titre')</code> récupère la dernière valeur saisie pour la remettre dans le champ.</p>

<h3>5. Gérer les exceptions métier</h3>
<pre class="pseudo">// une exception "maison", que l'on choisira de rendre en code 409
class StockInsuffisantException extends \\Exception {}   // hérite de la classe Exception de PHP

// dans app/Exceptions/Handler.php on peut associer cette exception à un code HTTP
// ou, plus direct : throw new HttpException(409, 'Stock épuisé');   // "throw" = lever/déclencher une erreur</pre>
<div class="tip">Une <strong>exception</strong> est une erreur signalée pendant l'exécution que l'on peut « attraper » et traiter. Le code <strong>409</strong> (« Conflict ») signale un conflit d'état, ici un stock épuisé. La validation protège la <em>base</em> (des données saines) ; la gestion d'exceptions protège le <em>client</em> (des réponses claires). Laravel renvoie déjà les erreurs de validation en 422 sans code à écrire. Et on ne renvoie jamais au public une <strong>trace technique</strong> brute (le détail interne de l'erreur), qui aiderait un attaquant.</div>
`,
  exercises: [
    { type: "qcm", q: "On valide les entrées parce que…", opts: ["Cela rend le code plus lisible", "On ne fait jamais confiance aux données reçues", "C'est obligatoire en PHP", "Cela accélère les requêtes"], a: 1, exp: "Sécurité." },
    { type: "qcm", q: "Les règles de validation vont dans…", opts: ["La vue", "Une Form Request", "La migration", "La route"], a: 1, exp: "Classe dédiée." },
    { type: "qcm", q: "Créer une Form Request :", opts: ["php artisan make:request StoreJeuRequest", "php artisan create:request StoreJeuRequest", "php artisan request:make StoreJeuRequest", "composer make:request StoreJeuRequest"], a: 0, exp: "make:request." },
    { type: "qcm", q: "Un titre obligatoire :", opts: ["'titre' => 'nullable'", "'titre' => 'required|string'", "'titre' => 'string|sometimes'", "'titre' => 'filled'"], a: 1, exp: "required." },
    { type: "qcm", q: "Vérifier que la catégorie existe :", opts: ["'categorie_id' => 'exists:categories,id'", "'categorie_id' => 'required' seul", "'categorie_id' => 'array'", "rien"], a: 0, exp: "exists." },
    { type: "qcm", q: "Déclencher la validation :", opts: ["Un if manuel", "Type-hinter la Form Request dans la méthode", "Un middleware global", "Un contrôle dans la vue"], a: 1, exp: "Injection." },
    { type: "qcm", q: "En cas d'échec (API), Laravel renvoie…", opts: ["200", "422 automatiquement", "500", "301"], a: 1, exp: "Unprocessable." },
    { type: "qcm", q: "$request->validated() renvoie…", opts: ["Toutes les entrées brutes", "Seulement les données validées", "Un booléen", "Le HTML"], a: 1, exp: "Données sûres." },
    { type: "qcm", q: "Afficher une erreur en Blade :", opts: ["@error('titre')", "@errors('titre')", "@invalid('titre')", "@haserror('titre')"], a: 0, exp: "Directive @error." },
    { type: "qcm", q: "Réafficher la saisie précédente :", opts: ["old('titre')", "previous('titre')", "input('titre')", "flash('titre')"], a: 0, exp: "old()." },
    { type: "vf", q: "La validation agit avant que la donnée n'atteigne la base.", a: true, exp: "En amont." },
    { type: "qcm", q: "Une erreur métier « stock épuisé » → code…", opts: ["200", "409 Conflict", "201", "301"], a: 1, exp: "Conflit d'état." },
    { type: "vf", q: "On ne renvoie jamais de trace technique brute au public.", a: true, exp: "Message maîtrisé." },
    { type: "qcm", q: "authorize() dans une Form Request…", opts: ["Valide les champs", "Autorise (ou non) la requête", "Formate la réponse JSON", "Applique une migration"], a: 1, exp: "Autorisation de la requête." },
    { type: "qcm", q: "La validation protège la base, la gestion d'exceptions protège…", opts: ["Le serveur", "Le client (réponses claires)", "Le disque", "Rien"], a: 1, exp: "Réponses cohérentes." }
  ],
  final: {
    title: "Exercice final — Fiabiliser l'API",
    intro: `<p>On valide la création d'un jeu.</p>`,
    questions: [
      { type: "qcm", q: "Contrainte sur le titre :", opts: ["'required|string|max:120'", "'numeric'", "'email'", "'array'"], a: 0, exp: "Texte requis." },
      { type: "qcm", q: "Déclencher la validation :", opts: ["Type-hinter StoreJeuRequest", "un if manuel", "un middleware global", "un validate() manuel"], a: 0, exp: "Form Request." },
      { type: "qcm", q: "Échec de validation (API) → :", opts: ["404", "422", "201", "500"], a: 1, exp: "422." },
      { type: "qcm", q: "Insérer les données sûres :", opts: ["Jeu::create($request->validated())", "Jeu::create($_POST)", "Jeu::all()", "rien"], a: 0, exp: "validated()." },
      { type: "vf", q: "exists:categories,id vérifie l'intégrité dès la requête.", a: true, exp: "Contrôle référentiel." }
    ],
    solution: `<pre class="pseudo">class StoreJeuRequest extends FormRequest {          // classe de validation pour la création d'un jeu
    public function authorize(): bool { return true; }  // autorise la requête
    public function rules(): array {                 // renvoie le tableau des règles
        return [
            'titre' => 'required|string|max:120',    // titre obligatoire, texte, 120 caractères max
            'prix_location' => 'required|numeric|min:0.01',  // prix obligatoire, numérique, au moins 0,01
            'categorie_id' => 'required|exists:categories,id',  // catégorie devant exister en base
        ];
    }
}

public function store(StoreJeuRequest $request) {    // validation déclenchée automatiquement avant d'entrer ici
    return new JeuResource(Jeu::create($request->validated()));  // crée le jeu avec les données sûres, puis le renvoie
}</pre>
<p>L'API est robuste. Demain : les utilisateurs et les trois rôles.</p>`
  }
};
</script>
