  title: "Du cahier des charges à l'architecture MVC",
  subtitle: "Avant d'écrire une ligne, on décide comment l'application est organisée.",
  theory: `
<h3>1. Le projet : assembler ce qu'on sait déjà</h3>
<p>Un <strong>programme</strong> est une suite d'ordres qu'un ordinateur exécute ; une <strong>application</strong> (ou « appli ») est un programme complet, pensé pour de vrais utilisateurs. Jusqu'ici, chaque outil a été appris séparément ; ce cours ne les réapprend donc pas un par un. Il ne réexplique pas le <strong>PHP</strong> — le <strong>langage de programmation</strong> dans lequel on écrit les ordres destinés au serveur (un langage de programmation est un ensemble de mots et de règles que la machine sait exécuter, comme une langue étrangère très précise) —, ni <strong>Laravel</strong> — un <strong>framework</strong>, c'est-à-dire une boîte à outils toute prête qui fournit le squelette d'une application pour éviter de tout réécrire (comme un meuble en kit livré avec les vis et la notice) —, ni <strong>Merise</strong> — une méthode pour dessiner sur papier la structure des données avant de coder —, ni <strong>MySQL</strong> — la <strong>base de données</strong>, l'énorme classeur électronique où l'application range durablement ses informations. Le but est de les faire <strong>travailler ensemble</strong> pour construire une seule application complète : <strong>La Ludothèque</strong>. On la conçoit, on la code, on la teste et on la met en ligne (on la « déploie »).</p>

<h3>2. Le cahier des charges (rappel du domaine)</h3>
<p>Un <strong>cahier des charges</strong> est le document qui décrit, en français ordinaire, ce que le logiciel doit faire — l'équivalent du plan de l'architecte avant de bâtir une maison. Le nôtre décrit une ludothèque de jeux de société où l'on peut <strong>acheter</strong> ou <strong>louer</strong> des jeux, avec trois profils d'utilisateurs : le <strong>client</strong> (parcourt le catalogue, loue, achète), le <strong>vendeur</strong> (gère les stocks) et l'<strong>administrateur</strong> (gère les jeux et les comptes). Chaque jeu possède <strong>deux stocks</strong> distincts : un pour la vente, un pour la location — un peu comme un magasin qui garde certains exemplaires à vendre et d'autres à prêter.</p>

<h3>3. L'architecture MVC de Laravel</h3>
<p>Une <strong>architecture</strong> logicielle est la façon d'organiser les différentes parties d'un programme, comme les pièces d'une maison ont chacune leur fonction (cuisine, chambre, salle de bain). L'architecture la plus répandue pour les applications web s'appelle <strong>MVC</strong>, pour <strong>Modèle – Vue – Contrôleur</strong>. Voici les briques et leur rôle :</p>
<pre class="pseudo">Route      associe une URL à une action (routes/web.php, routes/api.php)
Controller reçoit la requête, orchestre, renvoie une réponse ou une vue
Model      Eloquent : les objets du domaine (Jeu, Categorie, Utilisateur…)
View       Blade : le HTML affiché</pre>
<p>Définissons chaque mot. Une <strong>URL</strong> est l'adresse qu'on tape dans le navigateur (par exemple <em>laludotheque.fr/catalogue</em>), exactement comme une adresse postale désigne une maison précise. Une <strong>route</strong> est l'aiguilleur qui dit « quand quelqu'un demande cette adresse, exécute telle action » — le standardiste qui transfère l'appel au bon service. Le <strong>contrôleur</strong> (Controller) est le chef d'orchestre : il reçoit la <strong>requête</strong> (la demande de l'utilisateur, par exemple « montre-moi le catalogue »), coordonne le travail, puis renvoie une <strong>réponse</strong> (souvent une page). Le <strong>modèle</strong> (Model) représente les <strong>données</strong> du domaine — un jeu, une catégorie, un utilisateur ; <strong>Eloquent</strong> est l'outil de Laravel qui traduit automatiquement ces objets en lignes de la base de données et inversement (un traducteur entre le monde du code et le monde du classeur). La <strong>vue</strong> (View), écrite avec le moteur de gabarits <strong>Blade</strong>, est la page <strong>HTML</strong> finalement affichée — HTML étant le langage qui décrit la présentation d'une page web (titres, images, boutons), comme la mise en page d'un journal.</p>
<p>À ces quatre briques on ajoute une couche <strong>Service</strong>, chargée de la <strong>logique métier</strong> : les règles propres à l'activité (par exemple « on ne peut louer un jeu que s'il reste au moins un exemplaire en stock »). L'intérêt est de garder les contrôleurs <strong>minces</strong> — c'est-à-dire courts et simples, sans règles compliquées à l'intérieur — comme un chef d'orchestre qui dirige mais ne joue pas lui-même de tous les instruments.</p>

<h3>4. Le flux d'une requête</h3>
<p>Le <strong>flux</strong> est le trajet parcouru par une demande, du clic de l'utilisateur jusqu'à la base de données, puis retour vers l'écran. <strong>HTTP</strong> est la langue que parlent le navigateur et le serveur pour s'échanger des pages : c'est le <strong>protocole</strong> du web, c'est-à-dire l'ensemble des règles de dialogue, comme les formules de politesse d'une conversation téléphonique.</p>
<pre class="pseudo">HTTP → Route → Controller → Service → Model (Eloquent) → MySQL
                            (règles)   (accès)          (données)</pre>
<p>Règle d'or à retenir : le contrôleur <strong>orchestre</strong> mais ne porte pas les règles métier ; il les <strong>délègue</strong> (les confie) au service, qui lui-même s'appuie sur les modèles pour lire et écrire dans la base. Chaque brique passe le relais à la suivante, comme dans une chaîne de montage où chaque poste a une tâche précise.</p>

<h3>5. L'organisation des dossiers</h3>
<p>Un projet Laravel range ses fichiers dans des <strong>dossiers</strong> (aussi appelés répertoires : ce sont les tiroirs d'une armoire, chacun regroupant des fichiers de même nature) au rôle bien défini :</p>
<pre class="pseudo">app/Http/Controllers   les contrôleurs
app/Services           la logique métier (louer, acheter, stocks)
app/Models             les modèles Eloquent
app/Http/Requests      la validation (Form Requests)
resources/views        les vues Blade
database/migrations    le schéma versionné</pre>
<p>Deux mots à définir ici. La <strong>validation</strong> consiste à vérifier que les données envoyées par l'utilisateur sont correctes avant de les traiter (par exemple qu'un prix est bien un nombre positif) — comme un videur qui contrôle les entrées ; dans Laravel elle est rangée dans des <strong>Form Requests</strong>, des objets dédiés à ce contrôle. Une <strong>migration</strong> est un fichier qui décrit la structure des tables de la base (le « schéma ») et permet de la (re)construire pas à pas ; on parle de <strong>schéma versionné</strong> parce que ces fichiers gardent l'historique des changements, comme les versions successives d'un document que l'on peut retracer.</p>
<div class="tip">Cette séparation en couches rend le code <strong>testable</strong> (on peut vérifier le service sans passer par le web), <strong>évolutif</strong> (changer l'apparence d'une page n'affecte pas les règles métier) et <strong>clair</strong> (chaque fichier a un rôle unique). C'est le squelette de tout le projet, très proche de l'architecture en couches vue dans le cours Spring.</div>
`,

    { type: "qcm", q: "Le contrôleur idéalement…", opts: ["Contient toutes les règles", "Orchestre et délègue au service", "Écrit le SQL", "Style la page"], a: 1, exp: "Délégation." },
    { type: "vf", q: "Le flux typique est HTTP → Route → Controller → Service → Model → MySQL.", a: true, exp: "Le trajet d'une requête." },
    { type: "qcm", q: "Les modèles Eloquent vivent dans…", opts: ["resources/views", "app/Models", "routes", "database"], a: 1, exp: "Dossier des modèles." },
    { type: "vf", q: "Séparer les couches permet de tester le service sans HTTP.", a: true, exp: "Testabilité." },

    { type: "qcm", q: "La validation se place dans…", opts: ["Le modèle seul", "app/Http/Requests (Form Requests)", "Le CSS", "La route"], a: 1, exp: "Form Requests." }
  ],
  final: {

    intro: `<p>On répartit les responsabilités dans les bonnes briques.</p>`,
    questions: [

      { type: "vf", q: "La couche Service garde les contrôleurs minces et testables.", a: true, exp: "Séparation." }
    ],
    solution: `<pre class="pseudo">routes/web.php        Route::get('/catalogue', [CatalogueController::class, 'index'])
app/Http/Controllers  CatalogueController  → orchestre
app/Services          CatalogueService     → règles (stock, disponibilité)
app/Models            Jeu (Eloquent)       → accès MySQL
resources/views       catalogue.blade.php  → l'affichage

// Flux : Route → Controller → Service → Model → MySQL</pre>
<p>L'architecture est posée. Demain : créer le projet Laravel et le connecter à MySQL.</p>`
  }
};
