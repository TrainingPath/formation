  theory: `
<h3>1. Créer le projet</h3>
<p>On commence par fabriquer le squelette de l'application. <strong>Composer</strong> est le <strong>gestionnaire de dépendances</strong> de PHP : il télécharge et installe automatiquement les bibliothèques dont le projet a besoin (une <strong>dépendance</strong> est un morceau de code écrit par d'autres que l'on réutilise, comme des ingrédients achetés tout prêts plutôt que cuisinés soi-même). Une <strong>commande</strong> est une instruction qu'on tape dans le <strong>terminal</strong> (la fenêtre noire où l'on écrit des ordres au texte, sans souris).</p>
<pre class="pseudo">composer create-project laravel/laravel ludotheque   # télécharge Laravel et crée le dossier du projet "ludotheque"
cd ludotheque                                         # cd = "change directory" : on entre dans ce dossier
php artisan serve      # démarre le serveur de développement (accessible sur http://localhost:8000)</pre>
<p><strong>artisan</strong> est l'assistant en ligne de commande fourni par Laravel : on lui donne des ordres commençant par <code>php artisan</code>. Un <strong>serveur de développement</strong> est un petit serveur web qui tourne sur votre propre machine pour tester l'appli avant de la mettre en ligne. <code>localhost</code> (ou <code>127.0.0.1</code>) désigne <em>cet ordinateur-ci</em>, et <strong>8000</strong> est le <strong>port</strong> utilisé — un port étant une « porte » numérotée par laquelle un programme reçoit les connexions, comme le numéro d'un guichet dans une administration.</p>

<h3>2. La configuration : le fichier .env</h3>
<p>La <strong>configuration</strong> regroupe les réglages qui varient d'une machine à l'autre (adresse de la base, mots de passe…). On la range dans un fichier nommé <code>.env</code> (pour <em>environment</em>, « environnement »).</p>
<pre class="pseudo"># .env — propre à chaque machine, JAMAIS commité (jamais envoyé dans Git)
DB_CONNECTION=mysql        # type de base de données utilisé : ici MySQL
DB_HOST=127.0.0.1          # adresse de la machine où tourne la base (127.0.0.1 = cet ordinateur)
DB_PORT=3306               # "porte" (port) par laquelle on parle à MySQL — 3306 est son port standard
DB_DATABASE=ludotheque     # nom de la base de données à utiliser
DB_USERNAME=\${DB_USER}     # nom d'utilisateur, lu depuis une variable d'environnement (pas écrit en clair)
DB_PASSWORD=\${DB_PASSWORD} # mot de passe, lu lui aussi depuis l'environnement (jamais "en dur" dans le code)</pre>
<p>Le fichier <code>.env</code> contient la configuration et les <strong>secrets</strong> (mots de passe, clés). <strong>Git</strong> est l'outil qui garde l'historique du code et le partage entre développeurs ; <strong>commiter</strong> signifie « enregistrer une version dans Git ». Comme le <code>.env</code> contient des secrets, on l'<strong>exclut</strong> de Git grâce à un fichier <code>.gitignore</code> (la liste de ce que Git doit ignorer). À la place, un <code>.env.example</code> — sans valeurs sensibles — sert de modèle à recopier. Une <strong>variable d'environnement</strong> est une valeur fournie par le système d'exploitation au programme au moment où il démarre, ce qui permet de garder les secrets hors du code.</p>

<h3>3. Vérifier la connexion</h3>
<pre class="pseudo">php artisan migrate      # applique les migrations : échoue tout de suite si la base est injoignable
php artisan tinker       # ouvre une console interactive ; on y tape DB::connection()->getPdo();</pre>
<p>Une <strong>migration</strong> est un fichier qui construit ou modifie la structure de la base ; l'appliquer oblige Laravel à se connecter, ce qui teste la connexion au passage. <strong>tinker</strong> est une <strong>console interactive</strong> (on dit aussi <strong>REPL</strong>) : un bac à sable où l'on tape une ligne de code et où la réponse s'affiche aussitôt, pratique pour essayer sans écrire un fichier complet. Si la connexion échoue, Laravel affiche une erreur claire — et mieux vaut le savoir tout de suite.</p>

<h3>4. Un premier endpoint de vie</h3>
<p>Un <strong>endpoint</strong> (« point de terminaison ») est une adresse que l'application sait traiter. On en crée un minuscule, juste pour vérifier que tout répond :</p>
<pre class="pseudo">// routes/web.php
Route::get('/ping', fn () => 'pong');   // quand on visite l'adresse /ping, l'appli renvoie le texte "pong"</pre>
<p><code>Route::get</code> déclare une route qui répond aux visites de type « lecture » (le verbe <strong>GET</strong> du protocole HTTP, celui utilisé quand on ouvre une page). <code>fn () => 'pong'</code> est une <strong>fonction fléchée</strong> : une mini-fonction sans nom, écrite en une ligne, qui ici se contente de renvoyer <code>'pong'</code>. On visite <code>/ping</code> : si « pong » s'affiche, le routage et le serveur fonctionnent.</p>

<h3>5. Où va la configuration ?</h3>
<div class="tip">Le code lit la configuration via des <strong>helpers</strong> (de petites fonctions pratiques) comme <code>config('database.connections.mysql')</code>, qui vont eux-mêmes chercher les valeurs dans <code>.env</code>. On ne lit jamais <code>.env</code> directement dans le code métier, et on ne met jamais de secret « en dur » (écrit directement dans le code). C'est la règle vue en cours PHP, industrialisée par Laravel.</div>
`,

    { type: "qcm", q: "Le modèle sans secrets partagé dans Git :", opts: [".env", ".env.example", "config.php", "secrets.txt"], a: 1, exp: "Exemple sans valeurs." },
    { type: "qcm", q: "Pour MySQL, DB_CONNECTION vaut…", opts: ["sqlite", "mysql", "pgsql", "oracle"], a: 1, exp: "MySQL." },

    { type: "qcm", q: "L'endpoint /ping sert à…", opts: ["Se connecter à MySQL", "Vérifier que le routage/serveur marche", "Trier", "Chiffrer"], a: 1, exp: "Signe de vie." },
    { type: "qcm", q: "Lire la config dans le code :", opts: ["Lire .env directement", "config('database...')", "$_ENV brut partout", "en dur"], a: 1, exp: "Via config()." },
    { type: "vf", q: "On ne met jamais de secret en dur dans le code.", a: true, exp: "Toujours .env." },
    { type: "qcm", q: "php artisan tinker est…", opts: ["Un éditeur", "Une console interactive pour tester du code", "Un serveur", "Un test"], a: 1, exp: "REPL Laravel." },
    { type: "vf", q: "php artisan serve démarre l'application en développement.", a: true, exp: "Serveur local." },
    { type: "qcm", q: "Composer est…", opts: ["Un serveur web", "Le gestionnaire de dépendances PHP", "Une base", "Un navigateur"], a: 1, exp: "Dépendances." },
    { type: "qcm", q: "Le port MySQL par défaut :", opts: ["8000", "3306", "80", "5432"], a: 1, exp: "3306." }
  ],
  final: {
    title: "Exercice final — Brancher l'application",
    intro: `<p>On configure la connexion et on prouve que ça démarre.</p>`,
    questions: [
      { type: "qcm", q: "Le bon DB_CONNECTION :", opts: ["mysql", "http", "file", "redis"], a: 0, exp: "MySQL." },
      { type: "qcm", q: "Le mot de passe se met…", opts: ["en clair dans un contrôleur", "dans .env (variable)", "dans la vue", "dans la route"], a: 1, exp: "Fichier .env." },
      { type: "qcm", q: "Vérifier la base :", opts: ["php artisan migrate", "redémarrer le PC", "supprimer la base", "rien"], a: 0, exp: "migrate." },
      { type: "qcm", q: "Prouver le démarrage :", opts: ["Visiter /ping", "Lire les logs seulement", "Compiler", "Rien"], a: 0, exp: "Endpoint de vie." },
      { type: "vf", q: "Le fichier .env ne doit pas être commité dans Git.", a: true, exp: "Secrets." }
    ],
    solution: `<pre class="pseudo"># .env — fichier de configuration propre à la machine
DB_CONNECTION=mysql          # type de base de données : MySQL
DB_HOST=127.0.0.1            # base hébergée sur cet ordinateur
DB_PORT=3306                 # port standard de MySQL
DB_DATABASE=ludotheque       # nom de la base à utiliser

// routes/web.php             (on déclare la route de test)
Route::get('/ping', fn () => 'pong');   // /ping renvoie "pong" : preuve que le serveur répond

# vérifier                    (applique les migrations ; échoue si la base est injoignable)
php artisan migrate</pre>
<p>L'application vit et parle à MySQL. Demain : créer le schéma via des migrations.</p>`
  }
};
