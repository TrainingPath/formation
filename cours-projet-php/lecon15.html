  num: 15,
  title: "Recherche, filtres et pagination",
  subtitle: "Rendre un grand catalogue navigable et rapide.",
  theory: `
<h3>1. Le besoin</h3>
<p>Un catalogue de centaines de jeux ne s'affiche pas d'un seul bloc : ce serait lent et illisible. On ajoute donc deux outils. La <strong>recherche</strong> permet de filtrer les jeux par leur titre. La <strong>pagination</strong> consiste à découper une longue liste en pages successives (10, 20 éléments…) et à ne charger que la page affichée, plutôt que la totalité.</p>

<h3>2. Paginer avec Eloquent</h3>
<p><strong>Eloquent</strong> est la partie de Laravel qui dialogue avec la base de données en langage objet (au lieu d'écrire du SQL à la main).</p>
<pre class="pseudo">\$jeux = Jeu::orderBy('titre')->paginate(10);   // trie par titre puis découpe en pages de 10 jeux</pre>
<p><code>paginate(10)</code> génère automatiquement le <code>LIMIT/OFFSET</code> — les mots SQL qui disent « donne-moi seulement 10 lignes, à partir de telle position » (la pagination MySQL vue en cours). Il renvoie un <strong>objet paginé</strong> : une liste enrichie qui connaît aussi le nombre total d'éléments et le nombre de pages.</p>

<h3>3. Recherche + pagination dans le contrôleur</h3>
<pre class="pseudo">public function index(Request \$request) {                    // reçoit la requête HTTP entrante
    \$q = \$request->query('recherche', '');                   // lit ?recherche=… dans l'URL ('' si absent)
    \$jeux = Jeu::where('titre', 'like', "%{\$q}%")            // garde les titres contenant le mot cherché
        ->orderBy('titre')                                   // les trie par titre (A→Z)
        ->paginate(10)                                       // découpe en pages de 10
        ->withQueryString();                                 // conserve ?recherche= dans les liens de page
    return view('catalogue', ['jeux' => \$jeux, 'q' => \$q]);  // rend la vue avec les jeux et le mot cherché
}</pre>
<p>Le mot-clé vient de l'<strong>URL</strong>, dans ce qu'on appelle la <em>query string</em> (la partie après le <code>?</code>, ex. <code>?recherche=catan</code>). <code>\$request->query('recherche', '')</code> lit ce paramètre ; le second argument <code>''</code> est la <strong>valeur par défaut</strong> employée si le paramètre est absent. <code>where('titre', 'like', "%{\$q}%")</code> filtre côté base : <code>like</code> compare selon un <strong>motif</strong>, et le <code>%</code> est un <em>joker</em> signifiant « n'importe quels caractères » — donc <code>%catan%</code> retient tout titre contenant « catan ». <code>withQueryString()</code> garde le filtre actif quand on change de page.</p>

<h3>4. Afficher la liste et les liens</h3>
<pre class="pseudo">{{-- formulaire de recherche --}}
&lt;form method="GET"&gt;                          {{-- envoie le mot-clé dans l'URL (méthode GET) --}}
    &lt;input name="recherche" value="{{ \$q }}"&gt; {{-- champ texte pré-rempli avec la recherche courante --}}
&lt;/form&gt;                                        {{-- ferme le formulaire --}}

@foreach (\$jeux as \$jeu) ... @endforeach       {{-- affiche chaque jeu de la page courante --}}

{{ \$jeux->links() }}   {{-- génère les liens Précédent / 1 2 3 / Suivant --}}</pre>

<h3>5. Filtrer côté base</h3>
<div class="tip">On filtre et pagine <strong>côté base</strong> (WHERE + LIMIT/OFFSET), jamais en chargeant tout puis en découpant en PHP. <code>\$jeux-&gt;links()</code> génère les boutons Précédent/Suivant, <code>\$jeux-&gt;total()</code> le nombre total. L'<strong>interface</strong> (l'<em>UI</em>, ce que voit l'utilisateur) reste rapide même avec un immense catalogue.</div>`,
  exercises: [
    { type: "qcm", q: "Paginer sert à…", opts: ["Sécuriser", "Ne charger que ce qu'on montre (rapidité)", "Chiffrer", "Trier la base"], a: 1, exp: "Découper la liste." },
    { type: "qcm", q: "Paginer avec Eloquent :", opts: ["->all()", "->paginate(10)", "->get()", "->limit()"], a: 1, exp: "paginate." },
    { type: "qcm", q: "paginate génère sous le capot…", opts: ["Un tri seul", "LIMIT/OFFSET", "Un DELETE", "Un index"], a: 1, exp: "Pagination SQL." },
    { type: "qcm", q: "Le mot-clé de recherche vient…", opts: ["Du corps JSON", "De l'URL (?recherche=...)", "D'un cookie", "De la base"], a: 1, exp: "Query string." },
    { type: "qcm", q: "Récupérer un paramètre d'URL :", opts: ["$request->query('recherche')", "$_SESSION", "view()", "old()"], a: 0, exp: "query()." },
    { type: "qcm", q: "Conserver le filtre en changeant de page :", opts: ["->withQueryString()", "->keep()", "->save()", "rien"], a: 0, exp: "withQueryString." },
    { type: "qcm", q: "Afficher les liens de pagination en Blade :", opts: ["{{ $jeux->links() }}", "@paginate", "{{ links }}", "->show()"], a: 0, exp: "->links()." },
    { type: "qcm", q: "Le nombre total d'éléments :", opts: ["$jeux->total()", "$jeux->count() seul", "$jeux->size", "->all()"], a: 0, exp: "total()." },
    { type: "qcm", q: "Rechercher par motif :", opts: ["where('titre','like','%q%')", "search()", "match()", "find()"], a: 0, exp: "LIKE." },
    { type: "qcm", q: "On filtre idéalement…", opts: ["En PHP après tout charger", "Côté base (WHERE)", "Dans la vue", "Dans le log"], a: 1, exp: "La base travaille." },
    { type: "vf", q: "On ne charge que 10 jeux par requête, pas tout le catalogue.", a: true, exp: "Efficacité." },
    { type: "qcm", q: "paginate(10) : le 10 est…", opts: ["Le nombre de pages", "Le nombre d'éléments par page", "Le total", "Un id"], a: 1, exp: "Taille de page." },
    { type: "vf", q: "La pagination Laravel correspond au LIMIT/OFFSET du cours MySQL.", a: true, exp: "Même mécanisme." },
    { type: "qcm", q: "Le formulaire de recherche utilise la méthode…", opts: ["POST", "GET", "PUT", "DELETE"], a: 1, exp: "Recherche = GET." },
    { type: "qcm", q: "$request->query('recherche', '') : le '' est…", opts: ["Une erreur", "La valeur par défaut si absent", "Un tri", "Un id"], a: 1, exp: "Défaut." }
  ],
  final: {
    title: "Exercice final — Catalogue paginé",
    intro: `<p>On rend le catalogue cherchable et paginé.</p>`,
    questions: [
      { type: "qcm", q: "Paginer 10 par page :", opts: ["->paginate(10)", "->all()", "->take(10) seul", "->limit(10)"], a: 0, exp: "paginate." },
      { type: "qcm", q: "Lire le mot-clé :", opts: ["$request->query('recherche', '')", "$_POST", "session()", "old()"], a: 0, exp: "query()." },
      { type: "qcm", q: "Conserver le filtre dans les liens :", opts: ["->withQueryString()", "->keep()", "rien", "->save()"], a: 0, exp: "withQueryString." },
      { type: "qcm", q: "Afficher la navigation :", opts: ["{{ $jeux->links() }}", "@paginate", "->show()", "rien"], a: 0, exp: "links()." },
      { type: "vf", q: "On filtre et pagine côté base, pas en PHP après tout charger.", a: true, exp: "Efficacité." }
    ],
    solution: `<pre class="pseudo">public function index(Request \$request) {                    // reçoit la requête
    \$q = \$request->query('recherche', '');                   // mot cherché ('' par défaut)
    \$jeux = Jeu::where('titre', 'like', "%{\$q}%")            // titres contenant le mot
        ->orderBy('titre')                                   // triés par titre
        ->paginate(10)                                       // 10 par page
        ->withQueryString();                                 // garde le filtre dans les liens
    return view('catalogue', ['jeux' => \$jeux, 'q' => \$q]);  // rend la vue
}

{{-- Blade --}}
@foreach (\$jeux as \$jeu) ... @endforeach       {{-- affiche les jeux de la page --}}
{{ \$jeux->links() }}                            {{-- boutons de navigation entre pages --}}</pre>
<p>Le catalogue est navigable. Demain : les trois espaces par rôle.</p>`
  }
