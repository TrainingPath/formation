<h3>1. Le query builder d'Eloquent</h3>
<p>Une <strong>requête</strong> est une question posée à la base de données (« donne-moi les jeux dont le stock est positif »). Le <strong>query builder</strong> (« constructeur de requête ») d'Eloquent permet de la formuler en enchaînant des <strong>méthodes</strong> PHP — une méthode étant une action que l'on demande à un objet, écrite avec des parenthèses comme <code>where(...)</code>. Ce chaînage se lit de gauche à droite, chaque maillon affinant la question :</p>
<pre class="pseudo">Jeu::where('stock_location', '>', 0)->get();          // garde les jeux dont le stock de location est > 0, puis récupère les résultats
Jeu::where('categorie_id', 1)->orderBy('prix_location')->get(); // catégorie n°1, triés par prix de location croissant
Jeu::where('titre', 'like', '%catan%')->get();        // titres contenant "catan" (% = n'importe quoi avant/après)
Jeu::where('prix_location', '<', 5)->count();          // compte les jeux dont le prix de location est < 5</pre>
<p><code>where</code> filtre (« là où… »), <code>orderBy</code> trie, <code>like</code> cherche un <strong>motif</strong> (un gabarit de texte, le symbole <code>%</code> remplaçant « n'importe quels caractères »). On termine toujours par une méthode qui exécute réellement la requête : <code>get()</code> (tous les résultats), <code>first()</code> (le premier), <code>count()</code> (le nombre). Eloquent traduit tout cela en SQL à notre place — ce sont les notions du cours MySQL, sans SQL manuel.</p>

<h3>2. Les scopes : nommer une condition</h3>
<pre class="pseudo">// dans le modèle Jeu
public function scopeLouables($query) {              // déclare un scope "louables" (préfixe obligatoire "scope")
    return $query->where('stock_location', '>', 0);  // sa condition : le stock de location est supérieur à 0
}
public function scopeDeCategorie($query, $id) {      // scope paramétré : il reçoit un id de catégorie
    return $query->where('categorie_id', $id);       // condition : la catégorie du jeu vaut cet id
}

// utilisation, très lisible
Jeu::louables()->get();                              // on appelle le scope SANS écrire le préfixe "scope"
Jeu::louables()->deCategorie(1)->orderBy('prix_location')->get();  // scopes enchaînés, puis tri par prix</pre>
<p>Un <strong>scope</strong> (« portée ») est une condition métier à laquelle on donne un nom pour la réutiliser partout. <strong>Factoriser</strong> signifie regrouper une logique répétée en un seul endroit, comme enregistrer un raccourci : on écrit la règle une fois, on l'appelle par son nom autant qu'on veut, et les requêtes deviennent de vraies phrases lisibles.</p>

<h3>3. Agréger</h3>
<p><strong>Agréger</strong>, c'est résumer plusieurs lignes en une seule valeur : les compter, en faire la moyenne ou la somme — comme le total en bas d'un ticket de caisse.</p>
<pre class="pseudo">Jeu::count();                                        // combien de jeux au total
Jeu::avg('prix_location');                           // moyenne (average) des prix de location
Jeu::where('stock_vente', '>', 0)->sum('stock_vente'); // somme des stocks de vente des jeux en stock</pre>

<h3>4. Charger les relations (eager loading)</h3>
<p>L'<strong>eager loading</strong> (« chargement anticipé ») consiste à demander d'un coup les données liées, pour ne pas multiplier les requêtes :</p>
<pre class="pseudo">Jeu::with('categorie')->get();   // charge chaque jeu ET sa catégorie en UNE SEULE requête (eager loading)
// évite le problème "N+1" : sans with, accéder à $jeu->categorie dans une boucle
// déclencherait UNE requête par jeu (1 requête + N autres) — voir leçon 19</pre>
<p>Le <strong>problème N+1</strong> désigne cette avalanche de petites requêtes (1 pour la liste, puis N pour chaque élément) qui ralentit tout : <code>with</code> l'évite en préchargeant les relations, comme faire toutes ses courses en un seul aller-retour plutôt qu'un par article.</p>

<h3>5. Requête ou collection ?</h3>
<div class="tip">Tant qu'on enchaîne des méthodes, on <strong>construit</strong> une requête sans rien exécuter (on dit l'exécution <strong>différée</strong>) : c'est comme rédiger sa liste de courses. <code>get()</code> déclenche enfin le SQL et renvoie une <strong>collection</strong> (la liste des résultats). Filtrer, trier et compter côté requête — donc côté base de données — est bien plus efficace que de tout charger en mémoire puis de trier en PHP.</div>
`,

  ],

    solution: `<pre class="pseudo">// modèle Jeu
