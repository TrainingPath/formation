  theory: `
<h3>1. Les routes de ressource</h3>
<p>Une <strong>API</strong> (<em>Application Programming Interface</em>) est une porte d'entrée par laquelle d'autres programmes dialoguent avec le nôtre — comme un guichet réservé aux machines plutôt qu'aux humains. <strong>REST</strong> est un style d'API très répandu qui organise tout autour de <strong>ressources</strong> (ici les jeux) manipulées avec les <strong>verbes HTTP</strong> : GET (lire), POST (créer), PUT/PATCH (modifier), DELETE (supprimer).</p>
<pre class="pseudo">// routes/api.php
Route::apiResource('jeux', JeuController::class);   // crée d'un coup toutes les routes REST des jeux</pre>
<p><code>apiResource</code> génère d'un seul appel les cinq routes standard : <code>GET /jeux</code> → méthode <code>index</code> (la liste), <code>GET /jeux/{jeu}</code> → <code>show</code> (un jeu), <code>POST /jeux</code> → <code>store</code> (créer), <code>PUT/PATCH /jeux/{jeu}</code> → <code>update</code> (modifier), <code>DELETE /jeux/{jeu}</code> → <code>destroy</code> (supprimer). Chaque verbe HTTP est ainsi relié à une action précise du contrôleur.</p>

<h3>2. Le contrôleur et le route model binding</h3>
<pre class="pseudo">class JeuController extends Controller {             // contrôleur qui gère les requêtes portant sur les jeux
    public function index() {                        // index() répond à GET /jeux : renvoie la liste
        return JeuResource::collection(Jeu::all());  // tous les jeux, formatés par la Resource
    }
    public function show(Jeu $jeu) {        // show() répond à GET /jeux/{id} ; Jeu $jeu est rempli automatiquement
        return new JeuResource($jeu);        // renvoie ce jeu formaté (404 automatique s'il n'existe pas)
    }
}</pre>
<p>Le <strong>route model binding</strong> (« liaison route ↔ modèle ») est un automatisme : en écrivant le type <code>Jeu $jeu</code> dans la méthode, on demande à Laravel d'aller chercher tout seul le jeu dont l'identifiant figure dans l'URL, et de renvoyer une erreur 404 s'il n'existe pas — on s'épargne le code de recherche.</p>

<h3>3. L'API Resource : le DTO de Laravel</h3>
<pre class="pseudo">class JeuResource extends JsonResource {             // Resource : décide de CE QUE l'API montre d'un jeu
    public function toArray($request): array {       // toArray() : la liste des champs exposés
        return [
            'id' => $this->id,                       // on expose l'identifiant
            'titre' => $this->titre,                 // on expose le titre
            'prix_location' => $this->prix_location, // on expose le prix de location
            'disponible' => $this->stock_location > 0,  // champ CALCULÉ : vrai si le stock de location est > 0
        ];
    }
}</pre>
<p><strong>JSON</strong> est le format texte universel dans lequel les API échangent leurs données (des paires « nom : valeur », lisibles par toute machine). La <strong>Resource</strong> choisit précisément ce que l'API <strong>expose</strong> (par exemple une <em>disponibilité</em> calculée) sans divulguer les stocks internes ni le prix d'achat. C'est l'équivalent du <strong>DTO</strong> (<em>Data Transfer Object</em>, « objet de transport de données ») vu en Spring : une couche de présentation qui filtre et met en forme.</p>

<h3>4. Les bons codes HTTP</h3>
<p>Chaque réponse HTTP porte un <strong>code</strong> à trois chiffres qui résume ce qui s'est passé, comme un numéro de statut : 2xx = succès, 4xx = erreur du demandeur.</p>
<pre class="pseudo">return response()->json($data, 201);   // renvoie $data en JSON avec le code 201 (Created : créé avec succès)
abort(404);                             // interrompt : ressource introuvable (Not Found)
abort(403);                             // interrompt : accès interdit (Forbidden)</pre>
<p><code>abort()</code> stoppe net la requête en renvoyant le code d'erreur indiqué.</p>

<h3>5. Pourquoi une Resource ?</h3>
<div class="tip">Renvoyer directement le modèle exposerait toutes ses colonnes et <strong>casserait</strong> les programmes clients au moindre changement de schéma. La Resource <strong>découple</strong> (sépare) l'API du modèle : on maîtrise le format renvoyé, donc l'API reste stable même si la base évolue. Et c'est le même service (leçon 6) qui alimente cette API et les pages web.</div>
`,

Route::apiResource('jeux', JeuController::class);   // toutes les routes REST des jeux d'un coup

// JeuResource::toArray
return [                                             // champs exposés en JSON

    'prix_location' => $this->prix_location,         // prix de location
    'disponible' => $this->stock_location > 0,       // calculé : disponible si stock de location > 0
];</pre>
<p>Le catalogue est une API. Fin de la semaine 1 ! Demain : validation et gestion des erreurs.</p>`
