<script>
var DAY = {
  num: 9,
  title: "Utilisateurs et les trois rôles",
  subtitle: "Modéliser client, vendeur et administrateur.",
  theory: `
<h3>1. Qu'est-ce qu'un « utilisateur » dans une application ?</h3>
<p>Notre <strong>application</strong> — le programme auquel on accède depuis un navigateur — a besoin de savoir <em>qui</em> s'en sert. Chaque personne inscrite est un <strong>utilisateur</strong> : un client qui loue des jeux, un vendeur qui gère les stocks, ou un administrateur. Pour ranger ces informations, on utilise une <strong>base de données</strong> : un immense classeur électronique où chaque type d'information a son tiroir. Un tiroir s'appelle une <strong>table</strong> ; c'est un tableau avec des <strong>colonnes</strong> (les rubriques, comme « email ») et des <strong>lignes</strong> (une par utilisateur).</p>
<p><strong>Laravel</strong> est le <em>framework</em> que nous utilisons : une boîte à outils toute prête pour construire un site, un peu comme un kit de meuble livré avec les vis et la notice. Laravel fournit d'emblée la table <code>users</code> (les utilisateurs) et un <strong>modèle</strong> nommé <code>User</code>. Un modèle est une <strong>classe</strong> — c'est-à-dire un plan, un moule — qui représente en langage PHP une ligne de la table : au lieu de manipuler des cases de base de données à la main, on manipule un objet <code>User</code> avec ses propriétés (<code>email</code>, <code>password</code>…). Cette table gère déjà l'email (unique : deux personnes ne peuvent pas avoir le même) et le mot de passe <strong>haché</strong> (transformé en une suite illisible pour qu'un voleur de la base ne puisse pas le lire). Plutôt que tout recréer, on l'<strong>enrichit</strong> d'une seule information : le rôle.</p>

<h3>2. Ajouter le rôle par une « migration »</h3>
<p>On ne modifie jamais la base de données à la main. On écrit une <strong>migration</strong> : un petit fichier PHP qui décrit le changement à faire (« ajoute une colonne »). C'est comme un plan de travaux signé et daté ; Laravel peut le rejouer à l'identique sur n'importe quelle machine, ou l'annuler. Ici, on ajoute la colonne <code>role</code>.</p>
<pre class="pseudo">// On MODIFIE une table qui existe déjà (users), sans la détruire ni perdre les données
Schema::table('users', function (Blueprint $table) {   // Schema::table = « modifie la table users » ; $table décrit sa structure
    $table->string('role')->default('client');         // ajoute une colonne texte « role » ; si on ne précise rien, elle vaut « client »
});                                                     // fin de la description : Laravel exécutera ce changement</pre>
<p><code>string</code> veut dire « colonne de <strong>texte</strong> » (une suite de caractères). <code>-&gt;default('client')</code> fixe la <strong>valeur par défaut</strong> : tout nouvel inscrit sera « client » tant qu'on ne précise rien d'autre.</p>

<h3>3. Un « enum » pour figer les rôles possibles</h3>
<p>Il n'existe que trois rôles. Pour empêcher toute faute de frappe (« clietn », « Admin ») ou tout rôle inventé, on les fige dans un <strong>enum</strong> (abréviation d'<em>énumération</em>) : une liste <strong>fermée</strong> de valeurs autorisées, comme le menu déroulant d'un formulaire où l'on ne peut choisir que parmi des options prévues. <strong>PHP</strong> — le langage dans lequel tourne l'application, côté serveur — propose les enums depuis sa version 8.1.</p>
<pre class="pseudo">enum Role: string {                          // déclare une énumération « Role » ; « : string » = chaque cas est adossé à un texte
    case CLIENT = 'client';                  // 1er rôle autorisé : le client (parcourt, loue, achète) — stocké « client »
    case VENDEUR = 'vendeur';                // 2e rôle : le vendeur (gère les stocks) — stocké « vendeur »
    case ADMINISTRATEUR = 'administrateur';  // 3e rôle : l'administrateur (gère les jeux ET les comptes)
}</pre>
<p>Chaque <code>case</code> (« cas ») est un rôle possible, associé au texte réellement rangé en base. Impossible désormais d'enregistrer un rôle inexistant : le programme n'accepte que ces trois valeurs.</p>

<h3>4. « Caster » le rôle sur le modèle</h3>
<p>En base, la colonne <code>role</code> n'est qu'un texte. On aimerait que, côté PHP, elle devienne automatiquement un objet <code>Role</code> propre à manipuler. C'est le travail d'un <strong>cast</strong> (« conversion ») : une règle de traduction automatique entre ce qui est stocké et ce qu'on manipule dans le code. On les déclare dans un <strong>tableau associatif</strong> <code>$casts</code> — un tableau où chaque entrée associe une clé (« colonne ») à une valeur (« comment la convertir »), comme un répertoire associant un nom à un numéro.</p>
<pre class="pseudo">class User extends Authenticatable {         // la classe User ; « extends Authenticatable » = hérite des capacités de connexion de Laravel
    protected $casts = [                     // $casts = table des conversions automatiques colonne ↔ objet PHP
        'role' => Role::class,               // la colonne « role » (texte) devient un objet Role à la lecture
        'password' => 'hashed',              // la colonne « password » est hachée automatiquement quand on l'affecte
    ];

    public function locations() { return $this->hasMany(Location::class, 'client_id'); }  // un User possède PLUSIEURS locations (reliées par client_id)
    public function achats()    { return $this->hasMany(Achat::class, 'client_id'); }     // …et plusieurs achats
}</pre>
<p><code>Role::class</code> désigne « la classe Role » ; le cast convertit donc la colonne en objet <code>Role</code>. <code>'password' =&gt; 'hashed'</code> hache le mot de passe tout seul dès qu'on le range. <code>public function</code> déclare une <strong>méthode</strong> (une action que l'objet sait faire) ; <code>hasMany</code> (« a plusieurs ») décrit une <strong>relation</strong> : un utilisateur est relié à plusieurs locations et achats, retrouvés grâce à la colonne <code>client_id</code>.</p>

<h3>5. Créer un compte proprement</h3>
<pre class="pseudo">User::create([                          // crée un nouvel utilisateur et l'enregistre dans la table users
    'email' => $data['email'],          // son email (saisi dans le formulaire) ; Laravel vérifie déjà qu'il est unique
    'password' => $data['password'],    // son mot de passe ; il sera haché tout seul grâce au cast 'hashed'
    'role' => Role::CLIENT,             // à l'inscription, tout le monde démarre avec le rôle client
]);                                     // fin : le compte existe désormais en base</pre>
<p><code>User::create([...])</code> fabrique et enregistre l'utilisateur en une seule fois, à partir d'un tableau associatif « colonne =&gt; valeur ». On ne se soucie ni de l'unicité de l'email ni du hachage : Laravel s'en charge.</p>

<div class="tip">Les trois profils du cahier des charges deviennent un <strong>enum</strong> et une <strong>colonne</strong>. Retenez deux notions distinctes : l'<strong>authentification</strong> répond à « <em>qui</em> es-tu ? » (prouver son identité en se connectant — leçon 10) ; l'<strong>autorisation</strong> répond à « <em>quel droit</em> as-tu ? » (a-t-on le droit de faire telle action — leçon 11). Le rôle est la base de l'autorisation.</div>`,
  exercises: [
    { type: "qcm", q: "La table users est…", opts: ["À créer entièrement", "Déjà fournie par Laravel", "Interdite", "Dans la vue"], a: 1, exp: "Fournie d'emblée." },
    { type: "qcm", q: "On ajoute le rôle par…", opts: ["Une vue", "Une migration sur la table users", "Un CSS", "Une route"], a: 1, exp: "Migration." },
    { type: "qcm", q: "Les rôles sont modélisés par…", opts: ["Une chaîne libre", "Un enum PHP", "Un int au hasard", "Un booléen"], a: 1, exp: "Valeurs figées." },
    { type: "qcm", q: "Les trois rôles :", opts: ["admin, user, guest", "client, vendeur, administrateur", "free, pro", "lecteur, éditeur"], a: 1, exp: "Modèle Ludothèque." },
    { type: "qcm", q: "Caster la colonne role :", opts: ["'role' => Role::class", "'role' => 'string'", "'role' => 'array'", "rien"], a: 0, exp: "Cast enum." },
    { type: "qcm", q: "'password' => 'hashed' …", opts: ["Stocke en clair", "Hache le mot de passe automatiquement", "Trie", "Supprime"], a: 1, exp: "Hachage auto." },
    { type: "qcm", q: "Un enum empêche…", opts: ["De compiler", "Un rôle inexistant/invalide", "La base", "Le tri"], a: 1, exp: "Valeurs contrôlées." },
    { type: "qcm", q: "L'email d'un utilisateur est…", opts: ["Facultatif", "Unique (géré par Laravel)", "En double", "Un nombre"], a: 1, exp: "UNIQUE." },
    { type: "qcm", q: "Les locations d'un utilisateur :", opts: ["hasMany(Location::class, 'client_id')", "belongsTo", "hasOne", "morphTo"], a: 0, exp: "Relation." },
    { type: "qcm", q: "Le rôle par défaut à l'inscription :", opts: ["administrateur", "client", "vendeur", "aucun"], a: 1, exp: "default('client')." },
    { type: "vf", q: "Laravel gère déjà l'unicité de l'email et le hachage.", a: true, exp: "On enrichit." },
    { type: "qcm", q: "Un enum PHP existe depuis…", opts: ["PHP 5", "PHP 8.1", "PHP 7.0", "toujours"], a: 1, exp: "8.1." },
    { type: "vf", q: "L'authentification dit QUI, l'autorisation dit QUEL DROIT.", a: true, exp: "Deux notions." },
    { type: "qcm", q: "Le cast Role::class convertit la colonne en…", opts: ["Un entier", "Un objet Role", "Un tableau", "null"], a: 1, exp: "Objet enum." },
    { type: "qcm", q: "Le vendeur, dans les rôles…", opts: ["Gère les stocks", "Supprime les comptes", "Ne se connecte pas", "Paie"], a: 0, exp: "Gestion du stock." }
  ],
  final: {
    title: "Exercice final — Enrichir User",
    intro: `<p>Récapitulons en assemblant les pièces : on ajoute le <strong>rôle</strong> au modèle <code>User</code>, à l'aide d'un <strong>enum</strong> (les valeurs autorisées) et d'un <strong>cast</strong> (la conversion automatique texte ↔ objet). Analyse le code final ci-dessous.</p>`,
    questions: [
      { type: "qcm", q: "Ajouter la colonne role :", opts: ["Schema::table('users', ...) avec string('role')->default('client')", "un CSS", "une vue", "une route"], a: 0, exp: "Migration." },
      { type: "qcm", q: "Modéliser les rôles :", opts: ["enum Role: string { ... }", "des constantes libres", "un int", "un tableau"], a: 0, exp: "Enum." },
      { type: "qcm", q: "Caster le rôle :", opts: ["'role' => Role::class", "'role' => 'string'", "rien", "'role' => 'int'"], a: 0, exp: "Cast enum." },
      { type: "qcm", q: "Hacher le mot de passe :", opts: ["'password' => 'hashed'", "en clair", "'password' => 'plain'", "rien"], a: 0, exp: "Cast hashed." },
      { type: "vf", q: "Un enum empêche d'enregistrer un rôle qui n'existe pas.", a: true, exp: "Valeurs figées." }
    ],
    solution: `<pre class="pseudo">enum Role: string {                          // les trois seuls rôles autorisés (liste fermée)
    case CLIENT = 'client';                  // client : parcourt, loue, achète
    case VENDEUR = 'vendeur';                // vendeur : gère les stocks
    case ADMINISTRATEUR = 'administrateur';  // administrateur : gère jeux et comptes
}

class User extends Authenticatable {         // le modèle utilisateur (hérite de la connexion Laravel)
    protected $casts = [                     // conversions automatiques colonne ↔ objet PHP
        'role' => Role::class,               // « role » (texte) devient un objet Role
        'password' => 'hashed',              // « password » est haché automatiquement
    ];
    public function locations() { return $this->hasMany(Location::class, 'client_id'); }  // un User a plusieurs locations
}</pre>
<p>Les comptes ont un rôle. Demain : l'authentification.</p>`
  }
};
</script>

    statement: "Ajoute au modèle User une méthode estGestionnaire() qui renvoie true si le rôle est vendeur ou administrateur, et une méthode estAdmin(). Suppose le cast 'role' => Role::class déjà en place.",
    hints: [
      "public function estAdmin(): bool { return $this->role === Role::ADMINISTRATEUR; }",

    ],
    solution: "class User extends Authenticatable {          // le modèle utilisateur\n    protected $casts = ['role' => Role::class, 'password' => 'hashed'];   // conversions auto : role -> objet Role, password hache\n\n    public function estAdmin(): bool {            // renvoie vrai/faux : est-ce un administrateur ?\n        return $this->role === Role::ADMINISTRATEUR;   // vrai uniquement si le role vaut ADMINISTRATEUR\n    }\n\n    public function estGestionnaire(): bool {     // vrai si l'utilisateur peut GERER (vendeur OU admin)\n        return in_array($this->role, [Role::VENDEUR, Role::ADMINISTRATEUR], true);   // le role figure-t-il dans cette liste ?\n    }\n}",

  ]
};
