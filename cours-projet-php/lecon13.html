  theory: `
<h3>1. Acheter vs louer</h3>
<p>L'<strong>achat</strong> reprend exactement la structure de la location vue hier, mais agit sur un autre stock : <code>stock_vente</code> (les exemplaires destinés à la vente) au lieu de <code>stock_location</code>. Le montant payé est le <strong>prix d'achat</strong> du jeu. C'est ici que les <strong>deux stocks distincts</strong> prévus dans le modèle de données (issu de la méthode <em>Merise</em> vue en analyse) prennent tout leur sens : un même jeu peut être loué ET vendu, chacun sur son propre compteur.</p>

<h3>2. Le service d'achat</h3>
<pre class="pseudo">class AchatService {                                          // classe regroupant la logique d'achat
    public function acheter(int \$idClient, int \$idJeu): Achat {  // renvoie l'Achat créé (:Achat = type de retour)
        return DB::transaction(function () use (\$idClient, \$idJeu) {  // bloc « tout ou rien », dont on renvoie le résultat
            \$jeu = Jeu::findOrFail(\$idJeu);                   // récupère le jeu (404 s'il n'existe pas)
            if (\$jeu->stock_vente &lt;= 0) {                    // stock de vente épuisé ?
                throw new StockInsuffisantException('Plus de stock de vente');  // oui → on refuse (exception)
            }
            \$achat = Achat::create([                          // sinon on crée la fiche d'achat…
                'client_id' => \$idClient,                     // le client acheteur
                'jeu_id' => \$idJeu,                           // le jeu acheté
                'date_achat' => now(),                        // date du jour
                'montant' => \$jeu->prix_achat,                // paiement simulé : on enregistre le prix d'achat
            ]);
            \$jeu->decrement('stock_vente');                   // retire 1 au stock de vente
            return \$achat;                                    // renvoie l'achat créé à l'appelant
        });
    }
}</pre>
<p>Nouveauté ici : le <code>: Achat</code> après les parenthèses indique que la méthode <strong>renvoie</strong> un objet Achat (contrairement à <code>: void</code> qui ne renvoyait rien). On écrit donc <code>return DB::transaction(...)</code> : la transaction transmet vers l'extérieur ce que la closure renvoie (<code>return \$achat</code>). Le reste est identique à la location : vérifier, créer, décrémenter, le tout de façon atomique.</p>

<h3>3. Le paiement : une frontière</h3>
<p>Ici le paiement est <strong>simulé</strong> : on se contente d'enregistrer le montant, sans vraie opération bancaire. Dans une application réelle, on appellerait un <strong>prestataire</strong> de paiement (Stripe, PayPal…) — une entreprise externe qui traite l'argent — via un service dédié. Garder cette <strong>frontière</strong> nette (le paiement isolé dans son coin) permettra de brancher un vrai paiement plus tard sans toucher au reste du code.</p>

<h3>4. Réutiliser plutôt que dupliquer</h3>
<p>Louer et acheter vérifient le stock presque de la même manière. Plutôt que de copier-coller ce contrôle (source de bugs), on l'extrait dans une petite méthode réutilisable — c'est le principe <strong>DRY</strong> (<em>Don't Repeat Yourself</em>, « ne te répète pas »).</p>
<pre class="pseudo">// la vérification de stock est proche entre louer et acheter
private function jeuAvecStock(int \$idJeu, string \$champ, string \$msg): Jeu {  // méthode privée réutilisable
    \$jeu = Jeu::findOrFail(\$idJeu);                          // récupère le jeu (404 sinon)
    if (\$jeu->\$champ &lt;= 0) throw new StockInsuffisantException(\$msg);  // teste le stock dont le nom est dans \$champ
    return \$jeu;                                             // renvoie le jeu, stock suffisant garanti
}</pre>
<p><code>private</code> signifie que la méthode n'est utilisable qu'à l'intérieur de la classe (usage interne). Le paramètre <code>string \$champ</code> reçoit le <em>nom</em> de la colonne à tester (« stock_vente » ou « stock_location ») ; <code>\$jeu->\$champ</code> est une <strong>variable-variable</strong> : le nom qui suit la flèche est lui-même rangé dans une variable, si bien que <code>\$jeu->\$champ</code> lit la colonne dont le nom est contenu dans <code>\$champ</code>. On adapte ainsi le même contrôle aux deux stocks.</p>

<h3>5. Cohérence du domaine</h3>
<div class="tip">Acheter et louer sont deux chemins vers le même but : servir un client tout en gardant les stocks justes. Grâce aux transactions, jamais de vente enregistrée sans stock décrémenté. Le domaine « acheter OU louer » du cahier des charges est désormais complet.</div>`,

<p>Le métier est complet (louer ET acheter). Demain : le frontend Blade.</p>`
