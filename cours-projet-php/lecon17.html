var DAY = {
  num: 17,
  title: "Tests unitaires (PHPUnit / Pest)",
  subtitle: "Prouver que la logique métier est correcte.",
  theory: `
<h3>1. Pourquoi tester ?</h3>
<p>Un <strong>test automatique</strong> est un petit programme qui vérifie tout seul qu'une méthode fait bien ce qu'on attend — et qui le revérifie à chaque modification du code. Il joue deux rôles : il <em>documente</em> les règles (en montrant le comportement attendu) et il attrape les <strong>régressions</strong> — c'est-à-dire les bugs qui réapparaissent après un changement — <em>avant</em> que les utilisateurs ne les rencontrent. Laravel intègre deux outils de test : <strong>PHPUnit</strong> (le standard) et <strong>Pest</strong> (une syntaxe plus légère par-dessus).</p>

<h3>2. Une base de test propre : RefreshDatabase</h3>
<pre class="pseudo">use Illuminate\\Foundation\\Testing\\RefreshDatabase;      // importe l'outil « base remise à neuf »

class LocationServiceTest extends TestCase {               // une classe de test hérite de TestCase
    use RefreshDatabase;   // remet une base vierge avant chaque test
}</pre>
<p>Chaque test part d'une base <strong>vide et jetable</strong> (souvent SQLite en mémoire, une mini-base qui vit le temps du test), jamais la base de production. Le <code>use RefreshDatabase</code> à l'intérieur de la classe active un <strong>trait</strong> : un bloc de fonctionnalités tout prêt qu'une classe « ajoute » à elle-même — ici, le nettoyage automatique de la base.</p>

<h3>3. Les factories : des données de test</h3>
<pre class="pseudo">\$jeu = Jeu::factory()->create(['stock_location' => 2]);   // fabrique un jeu de test avec 2 en stock de location</pre>
<p>Une <strong>factory</strong> (« fabrique ») produit des modèles de test remplis de valeurs par défaut réalistes, qu'on <em>surcharge</em> (remplace) au besoin — ici on impose <code>stock_location = 2</code>. Cela évite de saisir à la main toutes les colonnes d'un jeu à chaque test.</p>

<h3>4. Le test du cas nominal et du cas d'erreur</h3>
<pre class="pseudo">public function test_louer_decremente_le_stock(): void {   // 1er test : louer doit faire baisser le stock
    \$jeu = Jeu::factory()->create(['stock_location' => 2]); // un jeu avec 2 exemplaires
    app(LocationService::class)->louer(1, \$jeu->id);        // le client n°1 loue ce jeu
    \$this->assertEquals(1, \$jeu->fresh()->stock_location);  // on vérifie qu'il reste bien 1 en stock
}

public function test_louer_sans_stock_leve_exception(): void {  // 2e test : sans stock, ça doit échouer
    \$jeu = Jeu::factory()->create(['stock_location' => 0]); // un jeu à 0 exemplaire
    \$this->expectException(StockInsuffisantException::class);  // on annonce qu'on ATTEND cette exception…
    app(LocationService::class)->louer(1, \$jeu->id);        // …et c'est cette tentative qui doit la déclencher
}</pre>
<p><code>app(LocationService::class)</code> demande au <strong>conteneur</strong> (le distributeur d'objets de Laravel) de construire le service tout prêt, avec ses dépendances. Une <strong>assertion</strong> est une vérification qui fait échouer le test si elle est fausse : <code>assertEquals(attendu, obtenu)</code> compare deux valeurs. <code>fresh()</code> recharge le modèle depuis la base pour lire la valeur réellement <em>persistée</em> (enregistrée). <code>expectException(...)</code> déclare qu'on s'attend à ce qu'une exception soit levée : le test réussit seulement si elle l'est. On teste ainsi le <strong>cas nominal</strong> (tout se passe bien) ET le <strong>cas limite</strong> (situation d'erreur).</p>

<h3>5. Lancer les tests</h3>
<pre class="pseudo">php artisan test   # lance tous les tests du projet et affiche le résultat</pre>
<div class="tip">Les tests unitaires ne dépendent pas du réseau et s'exécutent en une fraction de seconde. On teste le cas normal (le stock baisse) ET les cas limites (stock nul, jeu introuvable). C'est ainsi qu'on sécurise le métier de la Ludothèque à chaque changement.</div>`,
  exercises: [
    { type: "qcm", q: "Un test automatique sert à…", opts: ["Ralentir", "Vérifier qu'une méthode fait ce qu'on attend", "Chiffrer", "Déployer"], a: 1, exp: "Contrôle + non-régression." },
    { type: "qcm", q: "Les frameworks de test intégrés :", opts: ["PHPUnit / Pest", "JUnit", "Mocha", "PyTest"], a: 0, exp: "PHPUnit et Pest." },
    { type: "qcm", q: "Base vierge à chaque test :", opts: ["RefreshDatabase", "TruncateAll", "DropTables", "rien"], a: 0, exp: "Trait dédié." },
    { type: "qcm", q: "On teste sur…", opts: ["La production", "Une base de test jetable", "Aucune base", "Le fichier de config"], a: 1, exp: "Isolée." },
    { type: "qcm", q: "Fabriquer des données de test :", opts: ["Une factory", "Un DTO", "Un middleware", "Une migration"], a: 0, exp: "Factories." },
    { type: "qcm", q: "Jeu::factory()->create(['stock_location'=>2]) …", opts: ["Supprime", "Crée un jeu de test avec ce stock", "Trie", "Compte"], a: 1, exp: "Donnée de test." },
    { type: "qcm", q: "Résoudre le service dans un test :", opts: ["app(LocationService::class)", "new sans dépendances", "static", "un fichier"], a: 0, exp: "Conteneur." },
    { type: "qcm", q: "Vérifier une égalité :", opts: ["$this->assertEquals(1, ...)", "print", "return", "echo"], a: 0, exp: "Assertion." },
    { type: "qcm", q: "Recharger le modèle depuis la base :", opts: ["->fresh()", "->save()", "->reload only", "->get()"], a: 0, exp: "fresh()." },
    { type: "qcm", q: "Vérifier qu'une exception est levée :", opts: ["$this->expectException(...)", "try/catch obligatoire", "print", "assertEquals"], a: 0, exp: "expectException." },
    { type: "vf", q: "Un bon test couvre le cas nominal ET les cas limites.", a: true, exp: "Nominal + erreurs." },
    { type: "qcm", q: "Lancer les tests :", opts: ["php artisan test", "npm test", "composer run", "artisan serve"], a: 0, exp: "artisan test." },
    { type: "vf", q: "Les tests documentent les règles et attrapent les régressions.", a: true, exp: "Double bénéfice." },
    { type: "qcm", q: "Les tests unitaires s'exécutent en…", opts: ["Minutes", "Fractions de seconde", "Heures", "Jours"], a: 1, exp: "Très rapides." },
    { type: "qcm", q: "RefreshDatabase garantit…", opts: ["Un test lent", "Un état de base propre à chaque test", "La production", "Un tri"], a: 1, exp: "Isolation." }
  ],
  final: {
    title: "Exercice final — Tester le service de location",
    intro: `<p>On écrit les tests du cœur métier.</p>`,
    questions: [
      { type: "qcm", q: "Base propre à chaque test :", opts: ["use RefreshDatabase", "rien", "TruncateAll", "DropTables"], a: 0, exp: "Trait." },
      { type: "qcm", q: "Créer un jeu de test :", opts: ["Jeu::factory()->create([...])", "new Jeu() sans base", "Jeu::all()", "rien"], a: 0, exp: "Factory." },
      { type: "qcm", q: "Vérifier le stock après :", opts: ["assertEquals(1, $jeu->fresh()->stock_location)", "print", "echo", "return"], a: 0, exp: "Assertion + fresh." },
      { type: "qcm", q: "Tester le refus sur stock nul :", opts: ["expectException(StockInsuffisantException::class)", "assertEquals", "print", "return"], a: 0, exp: "expectException." },
      { type: "vf", q: "Un test unitaire s'exécute sans réseau, très rapidement.", a: true, exp: "Isolé et rapide." }
    ],
    solution: `<pre class="pseudo">use Illuminate\\Foundation\\Testing\\RefreshDatabase;      // outil « base remise à neuf »

class LocationServiceTest extends TestCase {               // classe de test
    use RefreshDatabase;                                   // base vierge avant chaque test

    public function test_louer_decremente_le_stock(): void {  // cas nominal
        \$jeu = Jeu::factory()->create(['stock_location' => 2]);  // jeu avec 2 en stock
        app(LocationService::class)->louer(1, \$jeu->id);   // le client 1 loue
        \$this->assertEquals(1, \$jeu->fresh()->stock_location);  // il doit rester 1
    }
    public function test_sans_stock_leve_exception(): void {  // cas d'erreur
        \$jeu = Jeu::factory()->create(['stock_location' => 0]);  // jeu sans stock
        \$this->expectException(StockInsuffisantException::class);  // on attend l'exception
        app(LocationService::class)->louer(1, \$jeu->id);   // la location doit la lever
    }
}</pre>
<p>Le métier est testé. Demain : les tests de fonctionnalité (HTTP).</p>`
  }
};
