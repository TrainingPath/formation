<script>
var DAY = {
  num: 10,
  title: "Sauvegarder en ligne : GitHub, clone, push (examen)",
  subtitle: "Ton dépôt mérite mieux qu'un seul disque dur.",
  theory: `
<h3>1. Le dépôt distant</h3>
<p>Tout ton travail vit dans <code>.git/</code>… sur <strong>un seul disque</strong>. Un <strong>dépôt distant</strong> (en anglais <strong>remote</strong>, « distant ») est une copie de ton dépôt hébergée en ligne — sur <strong>GitHub</strong>, GitLab, Bitbucket… Analogie : c'est le coffre-fort à la banque, en plus du tiroir chez toi. Elle sert de sauvegarde, de point de partage et de vitrine (ton futur portfolio !).</p>

<h3>2. Relier le carnet à GitHub</h3>
<pre class="pseudo">(sur github.com : New repository → carnet-recettes, VIDE, sans README)   # on crée d'abord un dépôt VIDE côté GitHub, prêt à recevoir notre histoire

git remote add origin https://github.com/aurelia/carnet-recettes.git   # relie le dépôt local au distant, sous le surnom « origin »
git push -u origin master        # push = envoyer les commits ; -u mémorise le lien ; master = la branche envoyée (1re fois)

git remote -v                    # -v (verbose) : affiche les remotes configurés et leurs URLs → vérifie le lien</pre>
<p><code>origin</code> est le <strong>surnom conventionnel</strong> du dépôt distant (on pourrait le nommer autrement, mais tout le monde garde « origin »). L'option <code>-u</code> mémorise le lien entre ta branche locale et celle du distant : ensuite, <code>git push</code> tout court suffit.</p>

<h3>3. Le cycle avec un remote</h3>
<pre class="pseudo">(travail local : add, commit — comme d'habitude, hors ligne)   # rien de neuf : le cycle add → commit reste 100 % local
git push                  # publie tes commits locaux vers GitHub (le lien -u est déjà mémorisé)
git pull                  # rapatrie chez toi les nouveaux commits présents sur le distant
git push --tags           # --tags : envoie AUSSI les étiquettes (un push normal ne pousse pas les tags !)</pre>
<p><strong>Commit ≠ push</strong> : le commit est local ; le push publie. Tu peux commiter dix fois hors ligne puis tout pousser d'un coup.</p>

<h3>4. Cloner : récupérer un projet entier</h3>
<pre class="pseudo">git clone https://github.com/aurelia/carnet-recettes.git   # clone = recopier tout un dépôt distant sur ta machine
→ crée le dossier, télécharge TOUTE l'histoire, configure origin   # en UNE commande : dossier + histoire complète + lien origin déjà prêt</pre>
<p><code>git clone</code> (clone = « copie ») équivaut à <code>init</code> + <code>remote add</code> + téléchargement complet. C'est ainsi que tu récupéreras n'importe quel projet — et qu'un recruteur clonera le tien.</p>

<h3>5. Tu as tes bases — la suite existe</h3>
<pre class="pseudo">ACQUIS ici : init · add · commit · status · diff · log · show      # tout ce que tu maîtrises désormais (leçons 2 à 5)
             .gitignore · restore · revert · tag · branches · push/pull/clone   # …et la suite des bases (leçons 6 à 10)
SUITE (cours CI/CD & Git avancé) : conflits, workflows d'équipe,   # ce qui vient après : le travail à plusieurs
             pull requests, rebase, stash, pipelines automatisés    # les outils avancés du cours suivant</pre>
<div class="warn">HTTPS demande un « personal access token » (PAT) à la place du mot de passe ; l'alternative pro est la clé SSH. GitHub te guide à la première connexion.</div>
<div class="tip">Pousse dès aujourd'hui ton carnet ET un vrai projet d'école sur GitHub : c'est le début de ton portfolio public.</div>`,
  exercises: [
    { type: "qcm", q: "Un dépôt distant (remote) est…", opts: ["Une copie du dépôt hébergée en ligne", "Une branche du dépôt local", "Une archive du projet", "Une sauvegarde locale automatique"], a: 0, exp: "Sauvegarde + partage + vitrine." },
    { type: "qcm", q: "« origin » est…", opts: ["Le surnom conventionnel du dépôt distant", "Le premier commit", "Une branche", "Un mot de passe"], a: 0, exp: "On pourrait le nommer autrement — personne ne le fait." },
    { type: "input", q: "Commande pour relier le dépôt local à une URL GitHub (surnom origin) :", a: ["git remote add origin https://github.com/aurelia/carnet-recettes.git", "git remote add origin URL", "git remote add origin <url>"], ph: "git remote …", exp: "git remote add origin <url>." },
    { type: "input", q: "Le premier envoi de la branche master vers origin (avec mémorisation du lien) :", a: ["git push -u origin master"], ph: "git …", exp: "-u : ensuite git push suffit." },
    { type: "qcm", q: "Après le -u initial, publier ses nouveaux commits se fait par…", opts: ["git push", "git send", "git upload", "git commit"], a: 0, exp: "Le lien est mémorisé." },
    { type: "input", q: "Commande pour rapatrier les commits nouveaux du remote :", a: ["git pull"], ph: "git …", exp: "git pull." },
    { type: "vf", q: "git commit envoie automatiquement le commit sur GitHub.", a: false, exp: "Commit = local ; push = publication." },
    { type: "qcm", q: "Travailler hors ligne puis publier d'un coup :", opts: ["Possible : commits locaux puis un push", "Impossible sans connexion", "Réservé aux dépôts privés", "Seulement avec une clé SSH"], a: 0, exp: "Git est distribué (leçon 1 !)." },
    { type: "input", q: "Les tags ne partent pas tout seuls. Commande pour les publier :", a: ["git push --tags"], ph: "git …", exp: "git push --tags." },
    { type: "input", q: "Commande pour récupérer un projet GitHub entier (histoire comprise) :", a: ["git clone https://github.com/aurelia/carnet-recettes.git", "git clone URL", "git clone <url>"], ph: "git …", exp: "git clone <url>." },
    { type: "qcm", q: "git clone équivaut à…", opts: ["init + remote add + téléchargement complet", "Un simple copier-coller", "Un push", "Un merge"], a: 0, exp: "Tout est configuré d'un coup." },
    { type: "qcm", q: "git remote -v affiche…", opts: ["Les remotes configurés et leurs URLs", "La version de Git", "Les branches", "Les tags"], a: 0, exp: "Le contrôle du lien." },
    { type: "qcm", q: "Pour s'authentifier sur GitHub en HTTPS, on utilise…", opts: ["Un personal access token (ou une clé SSH)", "Le mot de passe de sa boîte mail", "Aucune authentification requise", "Un code reçu par SMS"], a: 0, exp: "Le PAT remplace le mot de passe." },
    { type: "vf", q: "Le clone d'un dépôt contient toute son histoire, pas seulement les derniers fichiers.", a: true, exp: "Distribué : chaque copie = l'histoire complète." },
    { type: "qcm", q: "Les conflits de pull et les pull requests s'apprennent…", opts: ["Au cours CI/CD & Git avancé", "Nulle part dans ce parcours", "Dans le cours de base de données", "Dans la documentation système"], a: 0, exp: "Tu as exactement les prérequis." }
  ],
  final: {
    title: "🎓 Examen — Les 10 leçons en un seul fil",
    intro: `<p>Du premier <code>git init</code> au push final : l'examen retrace toute la vie du carnet de recettes. Bonne chance !</p>`,
    questions: [
      { type: "input", q: "Leçons 2-3. Dans un dossier neuf : la commande qui crée le dépôt, puis celle qui met recettes.txt dans l'index. Donne la PREMIÈRE :", a: ["git init"], ph: "git …", exp: "git init, puis git add recettes.txt." },
      { type: "qcm", q: "Leçon 4. « Changes not staged for commit » sur conseils.txt signifie :", opts: ["Modifié mais pas (re-)add : il ne partira pas au commit", "Prêt à partir", "Non suivi", "Déjà poussé"], a: 0, exp: "Le tableau de bord se lit sans deviner." },
      { type: "qcm", q: "Leçon 5-7. Un commit fautif d5e6f7 déjà partagé doit être annulé par :", opts: ["git revert d5e6f7", "git reset --hard d5e6f7", "git restore d5e6f7", "git commit --amend"], a: 0, exp: "Contre-commit : on ne réécrit pas l'histoire partagée." },
      { type: "qcm", q: "Leçons 6 et 8. Les bons réflexes de livraison :", opts: [".env dans le .gitignore et tag annoté v1.0.0 sur le commit livré", ".env commité et dossier version_finale", "Tout compresser dans une archive zip", "Aucune règle particulière"], a: 0, exp: "Hygiène + version nommée." },
      { type: "qcm", q: "Leçons 9-10. Le trajet complet d'une idée réussie jusqu'à GitHub :", opts: ["switch -c essai → commits → switch master → merge → push", "push → merge → commit", "clone → revert → push", "commit → clone → merge"], a: 0, exp: "L'essai isolé, intégré, publié." }
    ],
    solution: `<pre class="pseudo">════════ LA VIE DU CARNET DE RECETTES — RÉSUMÉ DU COURS ════════
git init                              # L2  : le dépôt naît (.git/ créé)
git add recettes.txt                  # L3  : sélection du fichier dans l'index
git commit -m "Création du carnet"    # L3  : la première photo de l'histoire
git status / git diff                 # L4  : le tableau de bord (état + changements)
git log --oneline / git show <hash>   # L5  : lire l'histoire (liste + détail d'un commit)
echo ".env" >> .gitignore             # L6  : hygiène — le secret n'entre jamais dans l'histoire
git restore <f> / git revert <hash>   # L7  : le droit à l'erreur (gomme locale / contre-commit)
git tag -a v1.0.0 -m "Release"        # L8  : la version nommée et figée
git switch -c essai → merge           # L9  : l'idée isolée sur une branche, puis intégrée
git remote add origin <url>           # L10 : relie le dépôt local au distant (surnom origin)
git push -u origin master --tags      # L10 : en ligne, pour de bon (commits + tags)

Prochaine étape : le cours CI/CD & Git avancé — tu as ses prérequis.</pre>
<p>🎉 Félicitations ! Ton dépôt est en ligne, ton histoire est propre, et tes commits parlent. Continue : chaque projet d'école mérite désormais son dépôt.</p>`
  }
};
</script>

<script>
var ECRITURE = {

  items: [
  { id: "git-l10",
    atoi: {cmd: "git clone https://github.com/nous/notre-projet.git\ncd notre-projet\ngit pull\ngit status\ngit diff\ngit add <fichiers>\ngit commit -m \"Message clair : ce que ça change et pourquoi\"\ngit push", expected: "git clone → Cloning into 'notre-projet'... (tout l'historique récupéré)\ngit pull → Already up to date. (ou intègre le travail du binôme)\ngit status / git diff → où j'en suis / ce que j'ai changé\n[master 3f2a1b0] Message clair : ...\ngit push → les commits partent sur origin (branche distante à jour)"},
    checklist: ["Le rituel commence-t-il par git pull (récupérer AVANT) et finit-il par git push ?", "As-tu couvert les 3 erreurs probables (modif après add, secret commité, fichier « perdu ») avec leur remède exact ?", "Le remède au secret commité inclut-il git rm --cached, .gitignore ET le changement du mot de passe ?", "Chaque commande est-elle exacte et copiable-collable telle quelle par ton binôme ?"], title: "Le mode d'emploi pour ton binôme", level: 3,
    statement: "Ton binôme de projet n'a jamais utilisé Git. Rédige-lui le mode d'emploi complet en une page : comment récupérer votre projet depuis GitHub, le rituel quotidien (dans l'ordre !), les trois erreurs qui lui arriveront sûrement et leur remède, et les deux règles d'or de votre binôme. Chaque commande doit être exacte — il va les copier-coller.",
    hints: [
      "Le rituel quotidien commence par pull (récupérer avant de travailler) et finit par push.",
      "Ses trois erreurs probables : modification sans add avant commit, fichier secret commité, panique devant un vieux fichier « perdu ».",

    note: "Écrire pour un débutant force la précision : l'ordre pull → travail → push évite la plupart des conflits d'un binôme. Quand vous serez plus de deux, ce rituel montrera ses limites — c'est exactement là que commencent les branches partagées et les pull requests du cours CI/CD & Git avancé." }
  ]
};
