<script>
var DAY = {
  num: 5,
  title: "L'historique : log, show et HEAD",
  subtitle: "L'histoire ne sert à rien si on ne sait pas la lire.",
  theory: `
<h3>1. git log : la liste des commits</h3>
<p>La commande <strong>git log</strong> (log = « journal ») affiche l'<strong>historique</strong> : la liste de tous les commits, comme un album feuilleté de la dernière photo vers la première.</p>
<pre class="pseudo">git log                    # affiche la liste complète des commits (lecture seule)
commit f4e5d6...            ← le plus RÉCENT d'abord   # chaque commit commence par « commit » suivi de son hash
Author: Aurélia Dupont                                # Author : qui a fait ce commit
Date:   ...                                           # Date : quand il a été créé
    Ajout du gratin dauphinois                        # (indenté) le MESSAGE que l'auteur avait écrit

commit a1b2c3...                                       # commit suivant (plus ancien)
    Création du carnet de recettes                     # son message : le tout premier commit</pre>

<h3>2. Les variantes utiles</h3>
<pre class="pseudo">git log --oneline        # --oneline = « une ligne par commit » : hash court + message, vue compacte
f4e5d6 Ajout du gratin dauphinois        # une ligne = un commit ; le hash court à gauche
c7d8e9 Ajout de la tarte aux pommes      # commit précédent
a1b2c3 Création du carnet de recettes    # le plus ancien

git log -3               # -3 = ne montrer que les 3 commits les plus récents
git log recettes.txt     # ne montrer que les commits qui ont TOUCHÉ le fichier recettes.txt</pre>

<h3>3. git show : le contenu d'un commit</h3>
<pre class="pseudo">git show c7d8e9          # affiche les métadonnées + le diff introduit par CE commit précis (désigné par son hash)
git show c7d8e9:recettes.txt   # la syntaxe hash:chemin montre le fichier TEL QU'IL ÉTAIT à ce commit</pre>
<p>Le hash court (7 caractères) suffit tant qu'il est unique. <code>git show</code> répond à « qu'a exactement changé ce commit ? » et « à quoi ressemblait ce fichier à l'époque ? ».</p>

<h3>4. HEAD : « tu es ici »</h3>
<p><strong>HEAD</strong> (mot anglais pour « tête ») est un repère spécial de Git : il pointe sur le commit où tu te trouves actuellement. C'est le curseur « tu es ici » d'un plan de ville.</p>
<pre class="pseudo">HEAD    = le commit sur lequel tu te trouves (normalement le dernier)   # ta position actuelle dans l'histoire
HEAD~1  = son parent (l'avant-dernier)      # le ~ suivi d'un nombre = « recule de N commits » ; ~1 = un cran en arrière
HEAD~2  = le grand-parent                    # deux crans en arrière

git diff HEAD~1 HEAD     # compare l'avant-dernier commit au dernier : qu'a apporté le dernier commit ?</pre>
<p><code>HEAD</code> est le curseur « tu es ici » de la carte. La plupart des commandes acceptent un hash <em>ou</em> une expression HEAD.</p>

<h3>5. Visiter le passé (sans rien casser)</h3>
<pre class="pseudo">git checkout a1b2c3      # checkout = « aller à » : le répertoire de travail redevient l'état de ce vieux commit
→ "detached HEAD"        # message de Git : « HEAD détachée » — tu VISITES, tu n'es plus au bout d'une branche
git checkout master      # retour au présent en revenant sur la branche master (le bout de l'histoire)</pre>
<p>Le « <strong>detached HEAD</strong> » (« tête détachée ») effraie mais est inoffensif : cela veut simplement dire que HEAD ne pointe plus sur une branche mais directement sur un vieux commit — tu regardes une vieille photo. <strong>Ne commite pas</strong> dans cet état (les commits seraient <em>orphelins</em>, c'est-à-dire rattachés à aucune branche et donc faciles à perdre) ; reviens avec <code>git checkout master</code> (ou <code>main</code>).</p>
<div class="warn">git log liste les commits du plus récent au plus ancien — l'inverse de l'ordre chronologique de lecture. Le premier bloc affiché est le DERNIER commit.</div>
<div class="tip">git log --oneline est la vue que tu utiliseras 95 % du temps : toute l'histoire d'un coup d'œil.</div>`,
  exercises: [
    { type: "input", q: "La commande qui liste tous les commits :", a: ["git log"], ph: "git …", exp: "git log." },
    { type: "qcm", q: "git log affiche les commits…", opts: ["Du plus récent au plus ancien", "Du plus ancien au plus récent", "Par ordre alphabétique des messages", "Par taille de chaque commit"], a: 0, exp: "Le dernier commit d'abord." },
    { type: "input", q: "L'option de git log pour une ligne par commit :", a: ["--oneline", "git log --oneline"], ph: "…", exp: "git log --oneline." },
    { type: "qcm", q: "git log -3 affiche…", opts: ["Les 3 derniers commits", "Le 3e commit", "3 fichiers", "3 branches"], a: 0, exp: "Limite le nombre." },
    { type: "qcm", q: "git log recettes.txt affiche…", opts: ["Les commits qui ont touché ce fichier", "Le contenu actuel du fichier", "Le nombre de lignes du fichier", "La date de création du fichier"], a: 0, exp: "L'histoire d'un seul fichier." },
    { type: "qcm", q: "git show c7d8e9 affiche…", opts: ["Les métadonnées et le diff de ce commit", "Tout le projet", "La config", "Les branches"], a: 0, exp: "Qu'a changé CE commit ?" },
    { type: "qcm", q: "git show c7d8e9:recettes.txt affiche…", opts: ["Le fichier tel qu'il était à ce commit", "Le fichier dans sa version actuelle", "Le diff seulement", "La liste des commits du fichier"], a: 0, exp: "Voyage dans le temps en lecture." },
    { type: "qcm", q: "HEAD désigne…", opts: ["Le commit où tu te trouves", "Le premier commit", "GitHub", "L'index"], a: 0, exp: "Le curseur « tu es ici »." },
    { type: "qcm", q: "HEAD~1 désigne…", opts: ["Le parent de HEAD (l'avant-dernier commit)", "Le commit suivant", "Une branche", "Un tag"], a: 0, exp: "Et HEAD~2 le grand-parent." },
    { type: "input", q: "Commande pour voir ce qui a changé entre l'avant-dernier et le dernier commit :", a: ["git diff HEAD~1 HEAD", "git diff HEAD~1..HEAD"], ph: "git diff …", exp: "git diff HEAD~1 HEAD." },
    { type: "qcm", q: "Un hash court de 7 caractères…", opts: ["Suffit tant qu'il est unique dans le dépôt", "Est interdit", "Ne marche que sur GitHub", "Désigne une branche"], a: 0, exp: "f4e5d6 ≡ f4e5d6a8…" },
    { type: "qcm", q: "git checkout a1b2c3 provoque…", opts: ["Un « detached HEAD » : on visite le passé", "La suppression des commits suivants", "Un envoi sur GitHub", "La suppression définitive du dépôt"], a: 0, exp: "Visite inoffensive en lecture." },
    { type: "vf", q: "Le « detached HEAD » détruit les commits récents.", a: false, exp: "Il ne détruit rien : on regarde une vieille photo." },
    { type: "qcm", q: "Pour revenir au présent après une visite du passé :", opts: ["git checkout master (ou main)", "git delete HEAD", "git undo", "git back"], a: 0, exp: "Retour au bout de l'histoire." },
    { type: "vf", q: "Il est conseillé de commiter pendant un detached HEAD.", a: false, exp: "Les commits seraient orphelins — reviens d'abord sur la branche." }
  ],
  final: {
    title: "Exercice final — L'enquête dans l'historique",
    intro: `<p>Le carnet a maintenant 5 commits :</p><pre class="pseudo">e9f0a1 Ajout du sommaire            # le plus RÉCENT (en haut) = HEAD
d5e6f7 Correction de la température de la tarte   # un cran en arrière = HEAD~1
f4e5d6 Ajout du gratin dauphinois   # HEAD~2
c7d8e9 Ajout de la tarte aux pommes # HEAD~3
a1b2c3 Création du carnet de recettes   # le plus ancien : le root-commit</pre>`,
    questions: [
      { type: "qcm", q: "Le commit le plus récent est…", opts: ["e9f0a1 (le sommaire)", "a1b2c3 (la création)", "f4e5d6", "Impossible à dire"], a: 0, exp: "log : le plus récent en premier." },
      { type: "input", q: "Commande pour voir ce que la correction de température a exactement changé :", a: ["git show d5e6f7"], ph: "git …", exp: "git show + hash." },
      { type: "qcm", q: "HEAD~2 désigne ici…", opts: ["f4e5d6 (le gratin)", "e9f0a1", "a1b2c3", "c7d8e9"], a: 0, exp: "Deux pas en arrière depuis e9f0a1." },
      { type: "input", q: "Commande pour voir recettes.txt tel qu'il était à la création :", a: ["git show a1b2c3:recettes.txt"], ph: "git …", exp: "hash:chemin." },
      { type: "vf", q: "git checkout c7d8e9 puis git checkout master permet de visiter l'époque de la tarte puis de revenir, sans rien perdre.", a: true, exp: "Visite en lecture seule." }
    ],
    solution: `<pre class="pseudo">git log --oneline              # la carte complète : tous les commits en une ligne chacun
git show d5e6f7                # le diff de la correction (180 → 200) : ce que ce commit a changé
git show a1b2c3:recettes.txt   # le fichier à sa naissance (syntaxe hash:chemin)
git diff a1b2c3 e9f0a1         # tout le chemin parcouru entre le 1er et le dernier commit
git checkout c7d8e9            # visite de l'époque tarte (passe en detached HEAD)
git checkout master            # retour au présent (on remonte sur la branche)

HEAD = e9f0a1 · HEAD~1 = d5e6f7 · HEAD~2 = f4e5d6   # rappel des positions relatives depuis HEAD</pre>
<p>Tu sais lire l'histoire. Demain : empêcher les mauvais fichiers d'y entrer — le .gitignore.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "git-l5",
    atoi: {cmd: "git log --oneline recettes.txt\ngit show d5e6f7\ngit diff HEAD~3 HEAD -- recettes.txt\ngit show HEAD~3:recettes.txt", expected: "git log --oneline recettes.txt → les commits qui ont touché CE fichier (hash + message)\ngit show d5e6f7 → auteur, date, puis le diff :\n  - Cuire 30 min à 180°C\n  + Cuire 25 min à 200°C\ngit diff HEAD~3 HEAD -- recettes.txt → toutes les différences accumulées\ngit show HEAD~3:recettes.txt → le fichier entier tel qu'il était il y a 3 commits"},
    checklist: ["Ta méthode répond-elle aux 4 questions : QUAND, QUI, QUOI exactement, et comparaison à HEAD~3 ?", "Toutes tes commandes sont-elles en LECTURE (log, show, diff) — rien qui modifie le dépôt ?", "As-tu utilisé git show <hash>:fichier pour relire une version d'époque en entier ?", "As-tu précisé la sortie attendue de chaque commande ?"], title: "L'enquêteur", level: 2,
    statement: "La tarte aux pommes du carnet est ratée : quelqu'un jure que « la recette a changé ». Rédige, étape par étape, ta méthode d'enquête avec Git : comment trouver quand le fichier a été modifié, qui l'a fait, ce qui a exactement changé, et comment comparer la version actuelle à celle d'il y a trois commits. Donne chaque commande et ce que tu attends comme résultat.",
    hints: [
      "git log recettes.txt limite l'enquête aux commits touchant le fichier.",
      "Chaque commit du log porte l'auteur et la date : le « qui » et le « quand » sont gratuits.",
      "git show <hash> pour le détail d'un suspect ; git diff <vieux> <récent> pour l'écart total."
    ],
    solution: "1) Qui a touché au fichier, et quand ?\n   git log --oneline recettes.txt\n   → liste des commits sur CE fichier ; git log (complet) donne\n     auteur + date de chacun.\n\n2) Quel commit est suspect ?\n   git show d5e6f7\n   → le diff exact : - Cuire 30 min à 180°C / + Cuire 25 min à 200°C\n     Le coupable et le changement sont identifiés.\n\n3) Comparer aujourd'hui à il y a 3 commits :\n   git diff HEAD~3 HEAD -- recettes.txt\n   → toutes les différences accumulées sur le fichier.\n\n4) Relire la version d'époque en entier :\n   git show HEAD~3:recettes.txt\n\nVerdict : l'histoire dit QUI, QUAND, QUOI — il ne reste que le pourquoi,\net c'est le message de commit qui doit y répondre.",
    note: "Cette enquête est un geste quotidien de développeur (souvent appelée « archéologie Git »). Remarque que tout se fait en LECTURE : log, show, diff ne risquent rien. L'outil professionnel qui pousse l'enquête ligne par ligne s'appelle git blame — tu le croiseras dans le cours CI/CD lors des revues de code." }
  ]
};
