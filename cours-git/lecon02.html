<script>
var DAY = {
  num: 2,
  title: "Installer, configurer, créer : git init",
  subtitle: "Trois commandes et ton premier dépôt existe.",
  theory: `
<h3>1. Installer Git</h3>
<p>Avant tout, il faut installer le logiciel Git sur ta machine. La façon de le faire dépend de ton système d'exploitation. Une fois installé, tu tapes les commandes dans un <strong>terminal</strong> (aussi appelé « invite de commande » ou, sur Windows, <strong>Git Bash</strong>) : une fenêtre où l'on écrit des ordres au clavier au lieu de cliquer.</p>
<pre class="pseudo">Windows : télécharger « Git for Windows » (git-scm.com) → Git Bash inclus   # installe Git + une fenêtre « Git Bash » pour taper les commandes
Linux   : sudo apt install git                                             # sudo = « en administrateur » ; apt install = installe le paquet « git »
macOS   : xcode-select --install   (ou brew install git)                   # installe les outils développeur d'Apple (Git compris) ; brew = gestionnaire de paquets Mac

Vérifier :  git --version   →   git version 2.x.x                          # git --version affiche le numéro installé : preuve que ça marche</pre>

<h3>2. Se présenter (une seule fois)</h3>
<p>Chaque commit porte un <strong>auteur</strong>. Git doit donc savoir qui tu es. On le lui dit avec la commande <strong>git config</strong> (config pour <em>configuration</em> = les réglages) :</p>
<pre class="pseudo">git config --global user.name  "Aurélia Dupont"    # enregistre TON nom ; il sera inscrit comme auteur de chaque commit
git config --global user.email "aurelia@exemple.be" # enregistre TON email ; sert à t'identifier (surtout côté GitHub)

git config --list                                   # affiche tous les réglages actuels : pratique pour vérifier nom et email</pre>
<p>L'option <code>--global</code> écrit dans un fichier de réglages personnel nommé <code>~/.gitconfig</code> (le symbole <code>~</code> désigne ton <strong>dossier personnel</strong>, ta « maison » sur l'ordinateur). Ce réglage est donc valable pour <strong>tous</strong> tes dépôts — comme un en-tête de courrier que tu écris une fois et qui sert à toutes tes lettres. Sans <code>--global</code>, le réglage ne vaut que pour le dépôt courant.</p>

<h3>3. Créer le dépôt du carnet de recettes</h3>
<pre class="pseudo">mkdir carnet-recettes    # mkdir = « make directory » : crée un dossier vide nommé carnet-recettes
cd carnet-recettes       # cd = « change directory » : ENTRE dans ce dossier (les commandes suivantes s'y appliquent)
git init                 # crée le sous-dossier caché .git/ : le dépôt naît ici
→ Initialized empty Git repository in .../carnet-recettes/.git/   # message de Git : « dépôt VIDE initialisé » (aucun commit encore)</pre>
<p><code>git init</code> (init pour <em>initialize</em> = démarrer) crée le dossier caché <code>.git/</code> : c'est <strong>lui</strong> le dépôt — toute l'histoire y vivra. Tes fichiers autour de lui forment le <strong>répertoire de travail</strong> (l'endroit où tu édites réellement, comme l'établi où tu bricoles ; le <code>.git/</code>, lui, est l'archive rangée à côté).</p>

<h3>4. Ce que git init ne fait PAS</h3>
<pre class="pseudo">git init   ne crée AUCUN commit                        # aucune photo n'est prise : l'album démarre vide
           ne surveille AUCUN fichier automatiquement  # Git n'observe rien tant que tu ne le lui demandes pas
           → le dépôt est prêt, mais l'histoire est vide # le « coffre » .git/ existe, mais il ne contient encore rien</pre>
<p>Les fichiers existants ou nouveaux sont <strong>non suivis</strong> (en anglais <strong>untracked</strong>, « non pistés ») tant que tu ne les ajoutes pas explicitement (leçon 3). Autrement dit, Git les voit mais les ignore, comme un gardien qui ne surveille que les objets qu'on lui a expressément confiés. Git ne fait jamais rien dans ton dos.</p>

<h3>5. Détruire un dépôt</h3>
<p>Supprimer <code>.git/</code> supprime <em>toute l'histoire</em> mais laisse tes fichiers actuels intacts. Il n'y a rien d'autre à « désinstaller » : un dépôt Git, c'est un dossier.</p>
<div class="warn">Ne lance jamais <code>git init</code> dans ton dossier personnel entier (~) : Git se mettrait à considérer TOUS tes fichiers comme un seul projet. Un dépôt = un dossier de projet.</div>
<div class="tip">Fais-le vraiment : installe Git, configure ton nom, crée carnet-recettes et lance git init. Les leçons suivantes reprennent ce dépôt exactement là.</div>`,
  exercises: [
    { type: "input", q: "La commande qui affiche la version de Git installée :", a: ["git --version", "git version"], ph: "git …", exp: "git --version." },
    { type: "qcm", q: "git config --global user.name sert à…", opts: ["Définir l'auteur inscrit dans tes commits", "Créer un compte GitHub", "Renommer le projet", "Changer le mot de passe"], a: 0, exp: "Chaque commit porte un auteur." },
    { type: "qcm", q: "--global signifie que le réglage vaut…", opts: ["Pour tous tes dépôts (écrit dans ~/.gitconfig)", "Pour le monde entier", "Pour un seul commit", "Pour GitHub uniquement"], a: 0, exp: "Sans --global : dépôt courant seulement." },
    { type: "input", q: "La commande qui crée un dépôt dans le dossier courant :", a: ["git init"], ph: "git …", exp: "git init." },
    { type: "qcm", q: "git init crée…", opts: ["Le dossier caché .git/", "Un compte GitHub", "Un premier commit", "Un fichier zip"], a: 0, exp: "C'est lui, le dépôt." },
    { type: "vf", q: "git init fait automatiquement un premier commit.", a: false, exp: "L'histoire est vide : rien n'est suivi." },
    { type: "qcm", q: "Après git init, un fichier existant dans le dossier est…", opts: ["Non suivi (untracked)", "Commité", "Supprimé", "Envoyé sur GitHub"], a: 0, exp: "Git ne surveille rien sans ordre explicite." },
    { type: "qcm", q: "Le « répertoire de travail », c'est…", opts: ["Tes fichiers visibles autour de .git/", "Le dossier .git/", "GitHub", "La RAM"], a: 0, exp: "Là où tu édites." },
    { type: "qcm", q: "Où vit toute l'histoire du dépôt ?", opts: ["Dans .git/", "Dans chaque fichier", "Sur GitHub obligatoirement", "Dans le presse-papier"], a: 0, exp: "Supprimer .git/ = supprimer l'histoire." },
    { type: "vf", q: "Supprimer le dossier .git/ supprime aussi tes fichiers de travail actuels.", a: false, exp: "Les fichiers restent ; seule l'histoire disparaît." },
    { type: "qcm", q: "git config --list…", opts: ["Affiche la configuration", "Liste les commits", "Liste les fichiers", "Installe Git"], a: 0, exp: "Pratique pour vérifier nom et email." },
    { type: "qcm", q: "Lancer git init dans le dossier personnel entier (~) est…", opts: ["Une mauvaise idée : tout deviendrait un seul projet", "Recommandé", "Obligatoire", "Sans effet"], a: 0, exp: "Un dépôt = un dossier de projet." },
    { type: "qcm", q: "Sur Windows, Git s'installe via…", opts: ["Git for Windows (git-scm.com)", "Word", "Un jeu Steam", "Le BIOS"], a: 0, exp: "Avec Git Bash inclus." },
    { type: "vf", q: "Il faut refaire git config --global user.name pour chaque nouveau projet.", a: false, exp: "--global : une seule fois pour tous les dépôts." },
    { type: "qcm", q: "Un dépôt Git fraîchement créé contient…", opts: ["Zéro commit", "Un commit de bienvenue", "Dix commits", "Une branche distante"], a: 0, exp: "L'histoire commence à la leçon 3." }
  ],
  final: {
    title: "Exercice final — Le dépôt est prêt",
    intro: `<p>Le carnet de recettes naît. Vérifie que chaque geste est clair.</p>`,
    questions: [
      { type: "input", q: "Tu es dans carnet-recettes/. Quelle commande en fait un dépôt Git ?", a: ["git init"], ph: "git …", exp: "Elle crée .git/." },
      { type: "qcm", q: "Juste avant, tu t'es présenté avec…", opts: ["git config --global user.name / user.email", "git hello", "git login", "git register"], a: 0, exp: "L'auteur des futurs commits." },
      { type: "qcm", q: "Après git init, l'histoire contient…", opts: ["Aucun commit", "Un commit", "Tous tes fichiers", "Une branche main pleine"], a: 0, exp: "Le dépôt est prêt, l'histoire est vide." },
      { type: "vf", q: "recettes.txt créé dans le dossier est automatiquement suivi par Git.", a: false, exp: "Untracked tant que tu ne l'ajoutes pas (leçon 3)." },
      { type: "qcm", q: "Pour vérifier ta configuration :", opts: ["git config --list", "git show config", "cat git.txt", "git verify"], a: 0, exp: "Nom et email doivent y figurer." }
    ],
    solution: `<pre class="pseudo"># Une seule fois sur la machine :
git config --global user.name  "Ton Nom"       # ton nom d'auteur, valable pour TOUS tes dépôts (--global)
git config --global user.email "toi@exemple.be" # ton email d'auteur, valable partout lui aussi

# Pour chaque nouveau projet :
mkdir carnet-recettes    # crée le dossier du projet
cd carnet-recettes       # entre dedans
git init                 # crée .git/ → dépôt prêt, histoire vide

# Rien n'est suivi automatiquement : c'est toi qui décides (leçon 3).</pre>
<p>Le dépôt existe. Demain : le geste que tu feras mille fois — add puis commit.</p>`
  }
};
</script>

    hints: [
      "git --version d'abord : inutile de configurer un outil absent.",
      "L'ordre logique : version → config (2 lignes) → mkdir/cd → init.",

    ],
    solution: "$ git --version\ngit version 2.43.0          # Git est installé\n\n$ git config --global user.name \"Aurélia Dupont\"\n$ git config --global user.email \"aurelia@exemple.be\"\n                              # l'auteur de mes futurs commits, pour TOUS mes dépôts\n\n$ mkdir carnet-recettes && cd carnet-recettes\n$ git init\nInitialized empty Git repository in .../carnet-recettes/.git/\n\n$ ls -a\n.  ..  .git                  # le dépôt est là, caché\n\nDifférence :\n- carnet-recettes/ = mon RÉPERTOIRE DE TRAVAIL : les fichiers que j'édite\n- .git/            = le DÉPÔT : la base de données de toute l'histoire\nSupprimer .git/ efface l'histoire mais pas mes fichiers actuels.",
    note: "Tenir un journal de commandes est un réflexe professionnel : c'est exactement ce qu'on te demandera en stage quand « ça ne marche pas ». La distinction répertoire de travail / dépôt est LE modèle mental de Git — la leçon 3 y ajoute la troisième zone, l'index." }
  ]
};
