<script>
var DAY = {
  num: 6,
  title: "Le .gitignore : l'hygiène du dépôt",
  subtitle: "Tout ne mérite pas d'entrer dans l'histoire.",
  theory: `
<h3>1. Le problème</h3>
<p>Dans un vrai projet, le dossier contient bien plus que ton code : fichiers compilés, dépendances téléchargées (<code>node_modules/</code>, <code>vendor/</code> sont des dossiers où le projet range les bibliothèques externes), caches, fichiers de l'éditeur, et surtout… <strong>secrets</strong> (le fichier <code>.env</code>, qui contient des mots de passe et des clés). Rien de tout cela ne doit entrer dans l'histoire.</p>

<h3>2. Le fichier .gitignore</h3>
<p>Le <strong>.gitignore</strong> est un simple fichier texte qui liste ce que Git doit <strong>ignorer</strong>. Analogie : c'est la liste que tu donnes au videur à l'entrée — « ces gens-là, tu ne les laisses jamais rentrer ». Chaque ligne est un <strong>motif</strong> (en anglais <em>pattern</em>) qui décrit des noms de fichiers.</p>
<pre class="pseudo"># .gitignore — à la racine du dépôt (et il se commite !)   # une ligne qui commence par # est un COMMENTAIRE, ignoré par Git
brouillons/          # le / final vise UN DOSSIER entier : tout brouillons/ est ignoré
*.tmp                # le * est un joker (« n'importe quoi ») : ignore tous les fichiers finissant par .tmp
notes-perso.txt      # un nom exact : ce fichier précis est ignoré
.env                 # les secrets (mots de passe, clés) — À IGNORER TOUJOURS
!important.tmp       # le ! INVERSE la règle : exception, ce fichier-là on le garde malgré *.tmp</pre>
<p>Chaque ligne est un motif. Les fichiers correspondants deviennent <strong>invisibles pour Git</strong> : plus dans <code>git status</code>, jamais pris par <code>git add .</code>.</p>

<h3>3. Que faut-il ignorer ?</h3>
<pre class="pseudo">✅ à ignorer : générés   (build/, *.class, __pycache__/)      # produits par la machine (compilation, cache) : reconstructibles
               téléchargés (node_modules/, vendor/, .venv/)    # récupérés automatiquement : inutile de les stocker dans l'histoire
               personnels  (.vscode/, .idea/, .DS_Store)       # réglages de TON éditeur/système : ne concernent que toi
               secrets     (.env, *.key)                       # mots de passe et clés : ne doivent JAMAIS être partagés
❌ à VERSIONNER : le code source, la config d'exemple (.env.example),   # écrit par des humains, indispensable au projet
               le .gitignore lui-même, requirements.txt / pom.xml       # ces fichiers décrivent comment reconstruire le projet</pre>
<p>Règle : on versionne ce qui est <strong>écrit par des humains</strong> et nécessaire pour reconstruire le projet ; on ignore ce qui est <strong>généré, téléchargé ou secret</strong>.</p>

<h3>4. Le piège du fichier déjà suivi</h3>
<pre class="pseudo">git add .env ; git commit ...     # OUPS, le secret est dans l'histoire   # une fois commité, .env est « suivi » : le mal est fait
(ajout de .env au .gitignore)     # trop tard : déjà suivi !              # .gitignore n'agit PAS sur un fichier déjà suivi
git rm --cached .env              # git rm --cached : retire de l'index MAIS garde le fichier sur le disque
git commit -m "Retrait du .env du versionnage"   # on grave le retrait : Git cesse désormais de suivre .env</pre>
<p><code>.gitignore</code> n'agit que sur les fichiers <strong>pas encore suivis</strong>. Et attention : le secret reste dans les <em>vieux</em> commits — un mot de passe commité doit être considéré comme <strong>compromis</strong> et changé.</p>

<h3>5. Le carnet de recettes s'équipe</h3>
<pre class="pseudo">echo "brouillons/" >  .gitignore   # crée .gitignore avec une 1re ligne ; le > écrit (et écrase le fichier s'il existe)
echo "*.tmp"       >> .gitignore   # le >> AJOUTE une 2e ligne à la fin, sans effacer la première
git add .gitignore                 # on met le .gitignore dans l'index (on le versionne comme un fichier normal)
git commit -m "Ajout du .gitignore (brouillons et fichiers temporaires)"   # on grave la règle dans l'histoire</pre>
<div class="warn">Un mot de passe déjà commité est compromis même après git rm --cached : il vit dans les vieux commits. Change le mot de passe, toujours.</div>
<div class="tip">GitHub propose des .gitignore tout faits par techno (Python, Java, Node…) : gitignore.io ou le choix à la création du dépôt. Pars de là.</div>`,
  exercises: [
    { type: "qcm", q: "Le rôle du .gitignore :", opts: ["Rendre certains fichiers invisibles pour Git", "Supprimer des fichiers du disque", "Chiffrer le dépôt", "Accélérer Git"], a: 0, exp: "Ni status, ni add ne les voient." },
    { type: "qcm", q: "Le .gitignore se place…", opts: ["À la racine du dépôt, et il se commite", "Dans .git/", "Sur GitHub uniquement", "Dans la corbeille"], a: 0, exp: "Partagé avec toute l'équipe." },
    { type: "input", q: "La ligne à écrire pour ignorer tous les fichiers .tmp :", a: ["*.tmp"], ph: "…", exp: "*.tmp — l'étoile est un joker." },
    { type: "input", q: "La ligne pour ignorer tout le dossier brouillons :", a: ["brouillons/", "brouillons"], ph: "…", exp: "brouillons/ — le / final vise un dossier." },
    { type: "qcm", q: "node_modules/ (dépendances téléchargées) doit être…", opts: ["Ignoré : reconstructible avec npm install", "Versionné", "Compressé", "Renommé"], a: 0, exp: "Généré/téléchargé → ignoré." },
    { type: "qcm", q: "Le fichier .env contenant les mots de passe doit être…", opts: ["Ignoré, toujours", "Commité pour le partager", "Copié dans le README", "Envoyé par email"], a: 0, exp: "Les secrets n'entrent jamais dans l'histoire." },
    { type: "qcm", q: "À versionner parmi :", opts: ["Le code source et le .gitignore", "node_modules/", "Les fichiers .class compilés", ".DS_Store"], a: 0, exp: "Écrit par des humains, nécessaire au projet." },
    { type: "qcm", q: "La ligne !important.tmp signifie…", opts: ["Exception : ce fichier reste suivi malgré *.tmp", "Fichier très important", "Erreur de syntaxe", "Suppression"], a: 0, exp: "Le ! inverse la règle." },
    { type: "vf", q: "Ajouter un fichier déjà suivi au .gitignore suffit à le faire disparaître du versionnage.", a: false, exp: ".gitignore n'agit que sur les fichiers PAS encore suivis." },
    { type: "input", q: "La commande qui retire .env de l'index sans l'effacer du disque :", a: ["git rm --cached .env"], ph: "git …", exp: "git rm --cached .env." },
    { type: "vf", q: "Après git rm --cached, le secret a aussi disparu des anciens commits.", a: false, exp: "Il vit dans l'histoire : mot de passe à changer." },
    { type: "qcm", q: "Un mot de passe commité par erreur doit être…", opts: ["Considéré compromis et changé", "Laissé tel quel", "Mis en gras", "Commenté"], a: 0, exp: "L'histoire le conserve." },
    { type: "qcm", q: "__pycache__/ et build/ sont typiquement…", opts: ["Ignorés : fichiers générés", "Versionnés", "Des secrets", "Des branches"], a: 0, exp: "Reconstructibles à la demande." },
    { type: "qcm", q: ".env.example (config d'exemple SANS secrets) est…", opts: ["Versionné : il documente la config attendue", "Ignoré", "Un virus", "Compilé"], a: 0, exp: "Le modèle oui, les valeurs non." },
    { type: "qcm", q: "Pour démarrer un .gitignore adapté à sa techno :", opts: ["Partir des modèles GitHub / gitignore.io", "Tout écrire de mémoire", "Ne rien ignorer", "Copier .git/"], a: 0, exp: "Python, Java, Node… tout est prêt." }
  ],
  final: {
    title: "Exercice final — Le tri du projet",
    intro: `<p>Ton projet Django (la future Ludothèque !) contient : <code>manage.py</code>, <code>settings.py</code>, <code>.env</code>, <code>__pycache__/</code>, <code>.venv/</code>, <code>db.sqlite3</code> (base de test), <code>requirements.txt</code>.</p>`,
    questions: [
      { type: "qcm", q: "À ignorer d'office :", opts: [".env, __pycache__/, .venv/", "manage.py", "requirements.txt", "settings.py"], a: 0, exp: "Secret + généré + téléchargé." },
      { type: "qcm", q: "requirements.txt est…", opts: ["Versionné : il permet de reconstruire l'environnement", "Ignoré", "Un secret", "Généré à chaque run"], a: 0, exp: "Écrit/maintenu par l'humain." },
      { type: "qcm", q: "db.sqlite3 (données locales de test) est en général…", opts: ["Ignoré : données locales, pas du code", "Versionné", "Un secret d'État", "Une dépendance"], a: 0, exp: "Chacun régénère sa base." },
      { type: "vf", q: "Le .gitignore lui-même doit être commité.", a: true, exp: "Toute l'équipe partage les mêmes règles." },
      { type: "qcm", q: ".env est déjà suivi par erreur. La séquence propre :", opts: ["L'ajouter au .gitignore, git rm --cached .env, commit, changer les mots de passe", "Supprimer le dépôt", "Le renommer", "Rien"], a: 0, exp: "Et considérer le secret compromis." }
    ],
    solution: `<pre class="pseudo"># .gitignore du projet Django                  # (ligne de titre, en commentaire)
.env                                            # secret : mots de passe / clés de l'appli
__pycache__/                                    # cache compilé de Python : régénéré tout seul
.venv/                                          # environnement virtuel téléchargé : reconstructible
db.sqlite3                                      # base de données locale de test : données, pas du code

# Versionnés : manage.py, settings.py, requirements.txt, .gitignore   # écrits par l'humain, indispensables

# Si .env était déjà suivi :                    # cas du fichier déjà commité par erreur
git rm --cached .env                            # cesse de suivre .env (mais le garde sur le disque)
git add .gitignore                              # versionne la règle d'ignorance
git commit -m "Retrait du .env et ajout du .gitignore"   # grave le tout dans l'histoire
→ puis CHANGER les mots de passe : l'histoire garde les vieux commits.   # le secret reste dans le passé : il est compromis</pre>
<p>Le dépôt est propre. Demain : annuler sans casser — restore et revert.</p>`
  }
};
</script>
