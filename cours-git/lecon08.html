<script>
var DAY = {
  num: 8,
  title: "Les tags : marquer les versions",
  subtitle: "Certains commits méritent un nom, pas juste un hash.",
  theory: `
<h3>1. Le problème</h3>
<p>« La version rendue au prof, c'était quel commit déjà ? <code>d5e6f7</code> ou <code>e9f0a1</code> ? » Un hash n'est pas un nom. Les moments importants — version livrée, rendu, mise en production — méritent une <strong>étiquette lisible</strong>.</p>

<h3>2. Poser un tag</h3>
<p>Un <strong>tag</strong> (mot anglais pour « étiquette ») est une étiquette lisible que l'on colle sur un commit précis. Analogie : c'est le marque-page nommé « chapitre livré au client » que tu glisses dans le grand livre de l'histoire.</p>
<pre class="pseudo">git tag v1.0                       # tag LÉGER sur le commit courant (HEAD) : un simple post-it, juste un nom collé
git tag -a v1.0 -m "Première version complète du carnet"   # -a = annoté ; -m = le message de l'étiquette
                                   # tag ANNOTÉ : enregistre en plus l'auteur, la date et le message (le vrai tag de version)
git tag v0.9 c7d8e9                # pose le tag v0.9 sur un commit plus ANCIEN, désigné par son hash c7d8e9</pre>
<p>Le tag <strong>annoté</strong> (<code>-a</code>) est un vrai objet avec auteur, date et message : c'est lui qu'on utilise pour les versions. Le tag léger n'est qu'un post-it.</p>

<h3>3. Utiliser les tags</h3>
<pre class="pseudo">git tag                    # sans argument : liste tous les tags existants
git show v1.0              # affiche le commit (et son contenu) désigné par le tag v1.0
git diff v0.9 v1.0         # tout ce qui a changé entre les deux versions (un tag s'utilise comme un hash)
git checkout v0.9          # visite la version v0.9 (passe en detached HEAD, comme leçon 5)</pre>
<p>Un tag s'utilise <strong>partout où un hash est accepté</strong> — mais lui, il est lisible.</p>

<h3>4. Le versionnage sémantique (SemVer)</h3>
<pre class="pseudo">v MAJEUR . MINEUR . CORRECTIF      # la forme d'un numéro de version : trois nombres séparés par des points
  v2.1.3                            # exemple concret : majeur = 2, mineur = 1, correctif = 3
  │ │  └─ correctif : bug réparé, rien de nouveau          # le 3e nombre monte quand on corrige un bug
  │ └─ mineur : nouveauté compatible (une recette en plus)  # le 2e nombre monte quand on AJOUTE sans rien casser
  └─ majeur : rupture (le format du carnet change)          # le 1er nombre monte quand on CASSE la compatibilité</pre>
<p>La convention <strong>SemVer</strong> (de l'anglais <em>Semantic Versioning</em>, « versionnage sémantique » : le numéro a un sens) est universelle : le numéro annonce la nature du changement. Tu la retrouveras partout — versions de Python, de Docker, des bibliothèques npm…</p>

<h3>5. Un tag ne bouge pas</h3>
<p>Contrairement à une branche (leçon 9), un tag est <strong>figé</strong> : v1.0 désignera ce commit pour toujours. C'est cette immuabilité qui rend les versions fiables — et c'est sur les tags que le cours CI/CD déclenchera les <em>releases</em> (les « publications » officielles d'une version) automatiques.</p>
<div class="warn">git tag pose l'étiquette sur HEAD par défaut. Vérifie avec git log --oneline -1 que tu es bien sur le bon commit avant de taguer.</div>
<div class="tip">Convention répandue : préfixer par v (v1.0.0). Choisis une règle et tiens-la sur tout le projet.</div>`,
  exercises: [
    { type: "qcm", q: "Le problème que résout un tag :", opts: ["Donner un nom lisible à un commit important", "Accélérer Git", "Chiffrer un commit", "Supprimer l'historique"], a: 0, exp: "v1.0 parle plus que d5e6f7." },
    { type: "input", q: "Commande (simple) pour poser le tag v1.0 sur le commit courant :", a: ["git tag v1.0"], ph: "git …", exp: "git tag v1.0." },
    { type: "qcm", q: "git tag -a v1.0 -m \"…\" crée…", opts: ["Un tag annoté : auteur, date, message", "Une branche", "Un commit", "Un fichier v1.0"], a: 0, exp: "Le tag recommandé pour les versions." },
    { type: "qcm", q: "Sans autre précision, git tag v1.0 étiquette…", opts: ["HEAD (le commit courant)", "Le premier commit", "Tous les commits", "Le prochain commit"], a: 0, exp: "D'où le contrôle préalable." },
    { type: "input", q: "Commande pour taguer v0.9 le commit ancien c7d8e9 :", a: ["git tag v0.9 c7d8e9"], ph: "git …", exp: "git tag nom hash." },
    { type: "input", q: "Commande pour lister tous les tags :", a: ["git tag"], ph: "git …", exp: "git tag tout court." },
    { type: "qcm", q: "git diff v0.9 v1.0 montre…", opts: ["Tout ce qui a changé entre les deux versions", "La liste des deux tags", "Le message de chaque tag", "Les branches concernées"], a: 0, exp: "Un tag s'utilise comme un hash." },
    { type: "qcm", q: "Dans v2.1.3, le « 2 » est…", opts: ["Le numéro majeur : rupture de compatibilité", "Le correctif", "Le mineur", "L'année"], a: 0, exp: "MAJEUR.MINEUR.CORRECTIF." },
    { type: "qcm", q: "Une nouveauté compatible (une recette en plus) incrémente…", opts: ["Le mineur : v1.1.0 → v1.2.0", "Le majeur", "Le correctif", "Aucun chiffre ne change"], a: 0, exp: "Compatible = mineur." },
    { type: "qcm", q: "Un bug réparé sans nouveauté incrémente…", opts: ["Le correctif : v1.2.0 → v1.2.1", "Le majeur", "Le mineur", "Le hash"], a: 0, exp: "Troisième chiffre." },
    { type: "vf", q: "Un tag suit les nouveaux commits, comme une branche.", a: false, exp: "Un tag est figé pour toujours : c'est sa force." },
    { type: "qcm", q: "git checkout v0.9 provoque…", opts: ["Une visite en detached HEAD, comme avec un hash", "La suppression de v1.0", "Un push", "Un merge"], a: 0, exp: "Leçon 5 : visite en lecture." },
    { type: "qcm", q: "La convention SemVer sert à…", opts: ["Annoncer la nature du changement par le numéro", "Trier les commits par ordre", "Compter le nombre de commits", "Réduire la taille du dépôt"], a: 0, exp: "Rupture / nouveauté / correctif." },
    { type: "vf", q: "Le cours CI/CD déclenchera des releases automatiques à partir des tags.", a: true, exp: "Leçon 15 du cours CI/CD : tags et changelog." },
    { type: "qcm", q: "Le contrôle avant de taguer :", opts: ["git log --oneline -1 : suis-je sur le bon commit ?", "git push d'abord", "git branch pour vérifier", "git rm du fichier"], a: 0, exp: "Le tag se pose sur HEAD." }
  ],
  final: {
    title: "Exercice final — La première release du carnet",
    intro: `<p>Le carnet de recettes est complet : sommaire, cinq recettes, conseils. Il est temps de livrer.</p>`,
    questions: [
      { type: "input", q: "Commande pour vérifier le commit courant avant de taguer (une ligne, dernier commit) :", a: ["git log --oneline -1"], ph: "git …", exp: "On tague HEAD : vérifions HEAD." },
      { type: "input", q: "Pose le tag annoté v1.0.0 avec le message « Première version complète » :", a: ["git tag -a v1.0.0 -m \"Première version complète\"", "git tag -a v1.0.0 -m 'Première version complète'"], ph: "git …", exp: "-a + -m : le tag de version." },
      { type: "qcm", q: "Tu corriges ensuite une faute d'orthographe et recommites. La prochaine version sera…", opts: ["v1.0.1 (correctif)", "v2.0.0", "v1.1.0", "v1.0.0 déplacé"], a: 0, exp: "Bug/faute → correctif." },
      { type: "qcm", q: "Tu ajoutes ensuite un chapitre desserts entier. Version suivante :", opts: ["v1.1.0 (nouveauté compatible)", "v1.0.2", "v3.0.0", "v1.0.1"], a: 0, exp: "Nouveauté compatible → mineur." },
      { type: "vf", q: "Après ces évolutions, git diff v1.0.0 v1.1.0 montre tout le chemin entre les deux livraisons.", a: true, exp: "Les tags rendent les comparaisons lisibles." }
    ],
    solution: `<pre class="pseudo">git log --oneline -1                 # suis-je bien sur le commit à livrer ? (le tag ira sur HEAD)
git tag -a v1.0.0 -m "Première version complète"   # -a + -m : pose le tag annoté de la 1re release
git tag                              # vérifie que v1.0.0 apparaît bien dans la liste ✅

(correction de la faute) → commit → git tag -a v1.0.1 -m "Faute corrigée"   # bug corrigé → le correctif monte
(chapitre desserts)      → commit → git tag -a v1.1.0 -m "Chapitre desserts"  # nouveauté compatible → le mineur monte

git diff v1.0.0 v1.1.0               # tout le chemin parcouru entre les deux livraisons
git show v1.0.0                      # revoir la version livrée, à jamais figée à ce commit</pre>
<p>Tu sais livrer des versions nommées. Demain : les branches — travailler sur une idée sans toucher au reste.</p>`
  }
};
</script>
