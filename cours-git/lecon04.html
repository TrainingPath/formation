<script>
var DAY = {
  num: 4,
  title: "git status et git diff : le tableau de bord",
  subtitle: "Ne devine jamais l'état de ton dépôt : demande-lui.",
  theory: `
<h3>1. git status : où en suis-je ?</h3>
<p>La commande <strong>git status</strong> (status = « état ») est le tableau de bord de Git : elle te dit dans quel état se trouve chaque fichier. Analogie : c'est le coup d'œil au tableau de bord de la voiture avant de démarrer.</p>
<pre class="pseudo">git status                        # demande à Git l'état actuel de tous les fichiers (ne modifie rien)
→ Changes to be committed:        (dans l'INDEX, partiront au commit)   # « changements à commiter » : déjà sélectionnés par git add
      modified:  recettes.txt                                          # recettes.txt : modifié ET dans l'index → partira
→ Changes not staged for commit:  (modifiés mais PAS dans l'index)      # « pas mis en scène » : modifiés mais oubliés du git add
      modified:  conseils.txt                                          # conseils.txt : modifié mais NON add → ne partira pas
→ Untracked files:                (jamais suivis)                       # « non suivis » : Git ne les connaît pas encore
      courses.txt                                                       # courses.txt : nouveau fichier jamais ajouté</pre>
<p><code>git status</code> classe chaque fichier dans une des trois situations. À lancer <strong>avant chaque commit</strong> — c'est le réflexe de survie n°1.</p>

<h3>2. Les états d'un fichier</h3>
<p>Un fichier voyage entre plusieurs <strong>états</strong>. Ce petit schéma résume le cycle de vie :</p>
<pre class="pseudo">untracked ──add──▶ staged ──commit──▶ propre (identique au dépôt)   # parcours normal : non suivi → sélectionné → gravé → « propre »
                     ▲                     │ (édition)              # une fois « propre », si tu ÉDITES le fichier…
                     └────────add──────────┘ modified               # …il devient « modified » ; un nouveau git add le re-sélectionne</pre>
<p>« staged » (de <em>stage</em>, la scène) = <strong>mis dans l'index</strong> ; « modified » = modifié depuis le dernier add ; « propre » (en anglais <em>clean</em>) = identique à la version enregistrée dans le dépôt, rien à photographier.</p>

<h3>3. git diff : qu'ai-je changé exactement ?</h3>
<p>La commande <strong>git diff</strong> (diff = <em>difference</em>) montre, ligne par ligne, ce qui a changé — comme surligner en couleur les corrections entre deux versions d'un texte.</p>
<pre class="pseudo">git diff              # compare le répertoire de travail à l'index : ce qui n'est PAS encore add
git diff --staged     # compare l'index au dernier commit : ce qui PARTIRA vraiment au commit (--staged = « ce qui est en scène »)

- Cuire 30 min à 180°C        ← ligne supprimée (rouge)   # le "-" en tête = ancienne version, retirée
+ Cuire 25 min à 200°C        ← ligne ajoutée   (vert)    # le "+" en tête = nouvelle version, ajoutée</pre>
<p>Le diff se lit ligne par ligne : <code>-</code> l'ancienne version, <code>+</code> la nouvelle. Relire <code>git diff --staged</code> avant de commiter, c'est se relire avant de rendre sa copie.</p>

<h3>4. Le cycle complet avec contrôle</h3>
<pre class="pseudo">(édition)                                                  # tu modifies recettes.txt dans ton éditeur
git status            # que se passe-t-il ?                # état : le fichier apparaît en « not staged »
git diff              # qu'ai-je changé, précisément ?     # détail ligne par ligne des modifications
git add recettes.txt                                       # sélectionne le fichier dans l'index
git status            # vérification : bien dans l'index ? # il doit maintenant être en « to be committed »
git diff --staged     # relecture finale                   # dernière lecture de ce qui va être gravé
git commit -m "Cuisson de la tarte corrigée (180 → 200)"   # crée la photo avec un message clair
git status            # → nothing to commit, working tree clean   # confirmation : tout est enregistré, rien en attente</pre>

<h3>5. « working tree clean »</h3>
<p>Le message <code>nothing to commit, working tree clean</code> (« rien à commiter, arbre de travail propre » — <em>working tree</em> est un autre nom du répertoire de travail) signifie : travail = index = dernier commit. Tout est photographié, tu peux fermer l'ordinateur tranquille.</p>
<div class="warn">git diff sans option ne montre PAS ce qui est déjà dans l'index — un fichier tout juste « add » disparaît du diff simple. C'est --staged qui le montre.</div>
<div class="tip">Prends l'habitude physique : status → diff → add → status → commit. Dix secondes qui évitent les commits ratés.</div>`,
  exercises: [
    { type: "input", q: "La commande qui classe les fichiers (index / modifiés / non suivis) :", a: ["git status"], ph: "git …", exp: "git status." },
    { type: "qcm", q: "« Changes to be committed » liste les fichiers…", opts: ["Dans l'index, qui partiront au prochain commit", "Non suivis", "Supprimés", "Sur GitHub"], a: 0, exp: "Déjà add." },
    { type: "qcm", q: "« Untracked files » liste les fichiers…", opts: ["Jamais suivis par Git", "Déjà commités", "Dans l'index", "Ignorés par le .gitignore"], a: 0, exp: "Git ne les connaît pas encore." },
    { type: "qcm", q: "« Changes not staged for commit » signifie…", opts: ["Modifiés mais pas (re-)add", "Prêts à partir", "Effacés du disque", "Déjà commités et poussés"], a: 0, exp: "Il faudra git add." },
    { type: "input", q: "La commande qui compare le travail à l'index (modifs pas encore add) :", a: ["git diff"], ph: "git …", exp: "git diff sans option." },
    { type: "input", q: "La commande qui montre ce qui partira réellement au commit :", a: ["git diff --staged", "git diff --cached"], ph: "git diff …", exp: "git diff --staged (ou --cached)." },
    { type: "qcm", q: "Dans un diff, une ligne commençant par « - » est…", opts: ["L'ancienne version (supprimée)", "La nouvelle version", "Un commentaire", "Une erreur"], a: 0, exp: "Et + la nouvelle." },
    { type: "qcm", q: "Tu viens de faire git add recettes.txt. git diff (sans option) montre ce fichier…", opts: ["Plus du tout : il est dans l'index", "En rouge dans la sortie", "Comparé à sa version distante", "Toujours affiché sur GitHub"], a: 0, exp: "Le piège classique : voir --staged." },
    { type: "qcm", q: "« nothing to commit, working tree clean » signifie…", opts: ["Travail = index = dernier commit", "Le dépôt est vide", "Aucun commit n'existe encore", "Il faut relancer git init"], a: 0, exp: "Tout est photographié." },
    { type: "vf", q: "git status modifie l'état du dépôt.", a: false, exp: "Lecture seule : à lancer sans crainte, tout le temps." },
    { type: "vf", q: "git diff se lance sans risque : il ne change rien.", a: true, exp: "Lecture seule aussi." },
    { type: "qcm", q: "Relire git diff --staged avant de commiter revient à…", opts: ["Se relire avant de rendre sa copie", "Perdre du temps inutilement", "Pousser directement sur GitHub", "Lancer la compilation"], a: 0, exp: "Réflexe professionnel." },
    { type: "qcm", q: "Un fichier « propre » (clean) est…", opts: ["Identique à sa version du dernier commit", "Vide", "Non suivi", "Sans commentaire"], a: 0, exp: "Rien à photographier." },
    { type: "qcm", q: "L'enchaînement conseillé avant chaque commit :", opts: ["status → diff → add → status → commit", "commit → add → diff", "init → push", "diff → init"], a: 0, exp: "Dix secondes de contrôle." },
    { type: "vf", q: "Un fichier peut être à la fois partiellement dans l'index et partiellement modifié ensuite.", a: true, exp: "add photographie un instant ; une édition postérieure crée un nouvel écart." }
  ],
  final: {
    title: "Exercice final — Lire un status comme un pro",
    intro: `<p>Voici le status du carnet de recettes :</p><pre class="pseudo">Changes to be committed:      # bloc 1 : ce qui est dans l'index (partira au commit)
    modified:  recettes.txt   # recettes.txt est prêt à être commité
Changes not staged for commit:# bloc 2 : modifié mais PAS encore add
    modified:  conseils.txt   # conseils.txt ne partira pas tant qu'on ne l'add pas
Untracked files:              # bloc 3 : inconnu de Git
    courses.txt               # courses.txt n'a jamais été suivi</pre>`,
    questions: [
      { type: "qcm", q: "Si tu commites maintenant, le commit contiendra…", opts: ["Seulement la modification de recettes.txt", "Les trois fichiers", "conseils.txt aussi", "Uniquement les fichiers non suivis"], a: 0, exp: "Seul l'index part au commit." },
      { type: "qcm", q: "Pour inclure aussi les changements de conseils.txt :", opts: ["git add conseils.txt avant le commit", "Rien, c'est automatique", "git init", "Supprimer courses.txt"], a: 0, exp: "Not staged → add." },
      { type: "qcm", q: "courses.txt est…", opts: ["Inconnu de Git : jamais add", "Déjà commité", "Dans l'index", "Déjà poussé sur GitHub"], a: 0, exp: "Untracked." },
      { type: "input", q: "Commande pour voir exactement ce qui partira au commit :", a: ["git diff --staged", "git diff --cached"], ph: "git …", exp: "Relecture avant de rendre la copie." },
      { type: "vf", q: "Après un commit réussi de l'index puis add des autres, git status peut afficher « working tree clean ».", a: true, exp: "Quand travail = index = dépôt." }
    ],
    solution: `<pre class="pseudo">Lecture du status :
  recettes.txt  : dans l'index          → partira au commit      # déjà add : sera photographié
  conseils.txt  : modifié, pas add      → NE partira PAS          # oublié de l'index : à ajouter
  courses.txt   : untracked             → NE partira PAS          # inconnu de Git : à ajouter aussi

Pour tout photographier proprement :
git diff --staged                  # relire recettes.txt         # contrôle de ce qui est déjà en scène
git commit -m "Correction de la tarte"                           # 1er commit : uniquement recettes.txt
git add conseils.txt courses.txt   # ajoute les deux fichiers d'un coup à l'index
git diff --staged                  # relire le reste            # contrôle avant le 2e commit
git commit -m "Conseils de cuisson et liste de courses"          # 2e commit : les deux autres fichiers
git status                         # → working tree clean ✅      # tout est enregistré, plus rien en attente</pre>
<p>Demain : remonter le temps — log, show et le fameux HEAD.</p>`
  }
};
</script>

    statement: "Un camarade t'envoie ce message : « Au secours, j'ai commité mais la moitié de mes changements ne sont pas dans le commit ! » Rédige ta réponse : explique-lui ce qui s'est probablement passé (avec le vocabulaire des trois zones), donne-lui la séquence exacte de commandes pour diagnostiquer son dépôt, puis celle pour compléter proprement son commit raté par un second commit.",
