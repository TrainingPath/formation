var DAY = {
  num: 9,
  title: "Découvrir les branches : créer, basculer, fusionner",
  subtitle: "Essayer une idée sans risquer le projet.",
  theory: `
<h3>1. Le problème</h3>
<p>Tu veux tenter une refonte du sommaire du carnet — mais si ça rate, tu ne veux pas polluer la version qui marche. Commiter « à moitié cassé » sur la ligne principale ? Non : il te faut une <strong>ligne d'histoire parallèle</strong>.</p>

<h3>2. Une branche = une étiquette mobile</h3>
<p>Une <strong>branche</strong> est une ligne d'histoire indépendante : tu peux y commiter sans toucher aux autres. Analogie : c'est une voie parallèle où tu bricoles ton brouillon pendant que la voie principale reste propre et roulante.</p>
<pre class="pseudo">master ──▶ a1b2c3 ── c7d8e9 ── e9f0a1   ◀── master (branche principale)   # master = étiquette pointant sur le DERNIER commit de la ligne principale
                                  └── essai-sommaire (nouvelle branche)    # une 2e étiquette part du même commit : la voie parallèle

git branch                    # lister les branches ; l'étoile * marque la branche courante (où tu es)
git branch essai-sommaire     # créer la branche essai-sommaire… mais SANS aller dessus
git switch essai-sommaire     # basculer dessus : elle devient la branche courante</pre>
<p>Une branche n'est qu'une <strong>étiquette qui suit tes commits</strong> : légère, instantanée, gratuite. La branche par défaut (celle créée par <code>git init</code>) s'appelle <code>master</code> ou <code>main</code> selon la configuration.</p>

<h3>3. Travailler sur la branche</h3>
<pre class="pseudo">git switch -c essai-sommaire     # -c = « create » : crée la branche ET bascule dessus d'un seul coup (raccourci)
(édition du sommaire…)           # tu modifies les fichiers, tu es sur essai-sommaire
git add . ; git commit -m "Refonte du sommaire par catégories"   # add + commit : la photo se range sur essai-sommaire
→ ce commit n'existe QUE sur essai-sommaire : master n'a pas bougé   # l'isolation : master reste tel quel
git switch master                # retour sur master : le sommaire redevient l'ANCIEN à l'écran !</pre>
<p>Basculer de branche <strong>change les fichiers du répertoire de travail</strong> : chaque branche montre sa version de l'histoire.</p>

<h3>4. Fusionner : ramener l'essai réussi</h3>
<p><strong>Fusionner</strong> (en anglais <em>merge</em>) = réunir le travail d'une branche dans une autre. Analogie : recopier proprement dans le cahier officiel ce que tu as validé au brouillon.</p>
<pre class="pseudo">git switch master                # on se place D'ABORD sur la branche qui va RECEVOIR (master)
git merge essai-sommaire         # fusionne les commits d'essai-sommaire DANS master
→ master intègre les commits de la branche   # master contient désormais le travail de l'essai

Cas simple (master n'a pas bougé) : "fast-forward"   # « avance rapide » : rien à fusionner vraiment…
  master avance simplement jusqu'au bout de la branche.   # …l'étiquette master glisse juste jusqu'au dernier commit d'essai

git branch -d essai-sommaire     # -d = delete : ménage, on retire l'étiquette devenue inutile (les commits, eux, restent dans master)</pre>

<h3>5. Et si les deux ont avancé ?</h3>
<p>Si <code>master</code> a reçu des commits pendant l'essai, le merge crée un <strong>commit de fusion</strong> (un commit spécial qui a deux parents et réunit les deux histoires) ; si les deux branches ont modifié <em>les mêmes lignes</em>, Git ne peut pas deviner laquelle garder et demande de choisir : c'est le <strong>conflit</strong>. La résolution de conflits et les stratégies d'équipe (workflows, pull requests) sont le cœur des leçons 2-6 du cours <strong>CI/CD &amp; Git avancé</strong> — ici, retiens le principe.</p>
<div class="warn">Basculer avec des modifications non commitées peut être bloqué par Git (risque d'écrasement). Commite (ou remets à plus tard) avant de changer de branche.</div>
<div class="tip">git switch est la commande moderne pour changer de branche (l'ancien git checkout faisait tout à la fois : d'où sa présence dans les vieux tutos).</div>`,

    { type: "qcm", q: "Techniquement, une branche est…", opts: ["Une étiquette mobile qui suit les commits", "Une copie du dossier", "Un zip", "Un serveur"], a: 0, exp: "Légère et instantanée." },
    { type: "input", q: "Commande pour lister les branches :", a: ["git branch"], ph: "git …", exp: "git branch — l'étoile marque la courante." },

    { type: "vf", q: "Basculer de branche change les fichiers visibles dans le répertoire de travail.", a: true, exp: "Chaque branche montre sa version." },

    { type: "qcm", q: "Un merge « fast-forward » se produit quand…", opts: ["master n'a pas bougé : il avance simplement", "Il y a conflit", "La branche est vide", "On est sur GitHub"], a: 0, exp: "Le cas simple de ce cours." },
    { type: "input", q: "Commande pour supprimer la branche fusionnée essai (ménage) :", a: ["git branch -d essai"], ph: "git …", exp: "git branch -d — l'étiquette ne sert plus." },
    { type: "vf", q: "Supprimer une branche fusionnée supprime ses commits.", a: false, exp: "Les commits sont dans master : seule l'étiquette part." },
    { type: "qcm", q: "Un conflit survient quand…", opts: ["Deux branches ont modifié les mêmes lignes", "On commit trop vite", "Le disque est plein", "On oublie -m"], a: 0, exp: "Git demande de choisir — approfondi au cours CI/CD." },
    { type: "qcm", q: "Basculer avec des modifications non commitées…", opts: ["Peut être bloqué par Git : commite d'abord", "Est toujours sans risque", "Supprime la branche", "Pousse en ligne"], a: 0, exp: "Risque d'écrasement." },
    { type: "qcm", q: "L'approfondissement (workflows, pull requests, conflits) t'attend…", opts: ["Au cours CI/CD & Git avancé, leçons 2-6", "Nulle part", "Dans le cours SQL", "Dans le cours CSS"], a: 0, exp: "Ce cours pose le principe." }
  ],
  final: {
    title: "Exercice final — L'essai sans risque",
    intro: `<p>Tu veux tester une refonte complète du sommaire du carnet, sans risque pour master.</p>`,
    questions: [
      { type: "input", q: "Commande unique pour créer la branche refonte-sommaire et t'y placer :", a: ["git switch -c refonte-sommaire"], ph: "git …", exp: "switch -c = créer + basculer." },
      { type: "qcm", q: "Tu commites deux essais sur la branche. Pendant ce temps, master…", opts: ["N'a pas bougé", "Contient aussi les essais", "Est supprimé", "Est en conflit"], a: 0, exp: "L'isolation, tout l'intérêt." },
      { type: "qcm", q: "Pour voir l'ancien sommaire pendant l'essai :", opts: ["git switch master (les fichiers changent)", "Impossible", "git tag", "Rouvrir l'éditeur"], a: 0, exp: "Chaque branche montre sa version." },
      { type: "input", q: "L'essai est concluant. Depuis master, commande pour l'intégrer :", a: ["git merge refonte-sommaire"], ph: "git …", exp: "Fusion dans la branche courante." },
      { type: "input", q: "Dernier geste de ménage :", a: ["git branch -d refonte-sommaire"], ph: "git …", exp: "Les commits sont dans master ; l'étiquette part." }
    ],
    solution: `<pre class="pseudo">git switch -c refonte-sommaire     # créer la branche + basculer dessus (-c)
(essais…) git add . ; git commit -m "Refonte : sommaire par catégories"   # 1er essai commité sur la branche
(essais…) git add . ; git commit -m "Refonte : ajout des temps de cuisson"  # 2e essai commité sur la branche

git switch master                  # master : intact, il montre encore l'ancien sommaire
git merge refonte-sommaire         # fast-forward : master rattrape le bout de l'essai
git branch -d refonte-sommaire     # ménage : on retire l'étiquette devenue inutile

Essai raté ? git switch master ; git branch -D refonte-sommaire   # -D force la suppression d'une branche non fusionnée
→ master n'aura JAMAIS vu l'échec.   # tout le brouillon raté disparaît sans laisser de trace sur master</pre>
<p>Demain, dernière leçon : mettre le carnet en ligne — GitHub, clone, push. Et l'examen !</p>`
  }
};
