<script>
var DAY = {
  num: 3,
  title: "Le cycle fondamental : add → commit",
  subtitle: "Le geste que tu feras mille fois dans ta carrière.",
  theory: `
<h3>1. Les trois zones</h3>
<p>Git organise ton travail en <strong>trois zones</strong> que tes modifications traversent l'une après l'autre. C'est LE modèle mental à retenir :</p>
<pre class="pseudo">RÉPERTOIRE DE TRAVAIL   →   INDEX (staging)   →   DÉPÔT (.git/)   # les 3 zones, dans l'ordre : où tu édites → la sélection → l'histoire gravée
   tes fichiers,             la sélection          l'histoire :   # sous chaque zone, ce qu'elle contient
   modifiés librement        "prêt à photographier" les commits   # tu modifies librement / tu choisis quoi garder / c'est enregistré pour de bon

        git add fichier              git commit -m "message"       # git add : travail → index ; git commit : index → dépôt (une photo)</pre>
<p>L'<strong>index</strong> (mot anglais qui veut dire « ce qui est répertorié » ; on dit aussi <em>staging area</em>, « zone de mise en scène ») est la zone intermédiaire : on y <strong>sélectionne</strong> ce qui fera partie du prochain commit. Analogie : c'est la table sur laquelle un photographe dispose EXACTEMENT les objets qu'il veut sur la photo, avant de déclencher. C'est ce qui permet de commiter une partie seulement de ses modifications.</p>

<h3>2. Le premier commit du carnet</h3>
<pre class="pseudo">echo "# Mon carnet de recettes" > recettes.txt        # echo écrit du texte ; > le redirige DANS le fichier recettes.txt (créé s'il n'existe pas)
git add recettes.txt                                  # place la version actuelle du fichier dans l'index (« prêt à photographier »)
git commit -m "Création du carnet de recettes"        # -m = message : crée la photo (commit) avec cette phrase d'explication
→ [master (root-commit) a1b2c3d] Création du carnet de recettes   # réponse de Git : branche master, tout premier commit (root), hash a1b2c3d</pre>
<p>Le commit reçoit un <strong>identifiant</strong> appelé <strong>hash</strong> (une longue empreinte comme <code>a1b2c3d…</code>, calculée à partir du contenu) : c'est le nom unique de cette photo dans l'histoire, comme une empreinte digitale — deux commits différents n'ont jamais le même.</p>

<h3>3. Modifier, puis recommencer le cycle</h3>
<pre class="pseudo">(éditer recettes.txt : ajouter la tarte aux pommes)   # tu modifies le fichier dans ton éditeur : le changement est pour l'instant SEULEMENT dans le répertoire de travail
git add recettes.txt         # la nouvelle version entre dans l'index (on re-sélectionne l'état du moment)
git commit -m "Ajout de la tarte aux pommes"          # on grave cette nouvelle photo dans l'histoire

git add .                    # variante : le "." veut dire « tout ce qui a changé dans le dossier courant » (attention : ajoute TOUT)</pre>
<p>Un fichier modifié doit être <strong>re-ajouté</strong> : <code>git add</code> photographie la version <em>du moment</em>, pas le fichier « pour toujours ». Chaque nouvelle modification repart donc du répertoire de travail.</p>

<h3>4. Écrire de bons messages</h3>
<pre class="pseudo">✅ "Ajout de la tarte aux pommes"                       # BON : on sait exactement CE qui a été ajouté
✅ "Correction de la température du four (180 → 200)"   # BON : dit quoi, et donne la valeur précise
❌ "modif"      ❌ "aaa"      ❌ "ça marche enfin"        # MAUVAIS : ne décrivent RIEN d'utile quand on relira dans six mois</pre>
<p>Règle : le message décrit <strong>ce que le commit change et pourquoi</strong>, en une ligne courte à l'impératif ou au nom d'action. Dans six mois, c'est ce message qui te sauvera.</p>

<h3>5. Quand commiter ?</h3>
<p><strong>Petit et cohérent</strong> : un commit = une idée (une recette ajoutée, un bug corrigé). Pas un commit par semaine avec cinquante changements mélangés, ni un commit par caractère tapé. Un bon test : peux-tu décrire le commit en une ligne ?</p>
<div class="warn">Un commit n'enregistre que ce qui est dans l'<strong>index</strong>. Modifier un fichier sans le re-<code>add</code> = la modification ne part PAS dans le commit. C'est l'erreur n°1 des débutants.</div>
<div class="tip">git commit -am "msg" combine add (des fichiers déjà suivis) et commit — pratique, mais n'ajoute jamais les nouveaux fichiers.</div>`,
  exercises: [
    { type: "qcm", q: "Les trois zones de Git, dans l'ordre :", opts: ["Répertoire de travail → index → dépôt", "Dépôt → index → travail", "GitHub → local → cloud", "Éditeur → terminal → navigateur"], a: 0, exp: "add puis commit les traversent." },
    { type: "input", q: "La commande qui place recettes.txt dans l'index :", a: ["git add recettes.txt"], ph: "git …", exp: "git add recettes.txt." },
    { type: "input", q: "La commande qui crée le commit avec le message « Ajout » :", a: ["git commit -m \"Ajout\"", "git commit -m 'Ajout'", "git commit -m Ajout"], ph: "git …", exp: "git commit -m \"Ajout\"." },
    { type: "qcm", q: "L'index (staging) sert à…", opts: ["Sélectionner ce qui fera partie du prochain commit", "Stocker l'histoire", "Rechercher un fichier dans le projet", "Compiler le code"], a: 0, exp: "La zone « prêt à photographier »." },
    { type: "qcm", q: "L'identifiant a1b2c3d… d'un commit s'appelle…", opts: ["Un hash", "Un mot de passe", "Une IP", "Un tag"], a: 0, exp: "Le nom unique de la photo." },
    { type: "vf", q: "Un fichier ajouté une fois avec git add est photographié automatiquement dans tous les commits futurs, même modifié.", a: false, exp: "add photographie la version DU MOMENT : il faut re-add." },
    { type: "qcm", q: "Tu modifies recettes.txt et lances git commit sans git add. Le commit…", opts: ["Ne contient pas cette modification", "Contient la modification", "Supprime le fichier", "Annule la modification du fichier"], a: 0, exp: "L'erreur n°1 des débutants." },
    { type: "qcm", q: "git add . ajoute…", opts: ["Tout ce qui a changé dans le dossier courant", "Un fichier nommé point", "Uniquement les fichiers déjà commités", "Le dossier .git/"], a: 0, exp: "Pratique, à utiliser en connaissance de cause." },
    { type: "qcm", q: "Le meilleur message parmi :", opts: ["« Correction de la température du four »", "« modif »", "« aaa »", "« update »"], a: 0, exp: "Il dit ce qui change." },
    { type: "qcm", q: "Un bon commit est…", opts: ["Petit et cohérent : une idée", "Hebdomadaire et énorme", "Un par caractère tapé", "Sans message"], a: 0, exp: "Descriptible en une ligne." },
    { type: "vf", q: "git commit -am \"msg\" ajoute aussi les fichiers jamais suivis auparavant.", a: false, exp: "-a ne concerne que les fichiers déjà suivis." },
    { type: "qcm", q: "Le tout premier commit d'un dépôt est signalé…", opts: ["(root-commit)", "(first)", "(init)", "(alpha)"], a: 0, exp: "La racine de l'histoire." },
    { type: "qcm", q: "Après un commit, l'index…", opts: ["Correspond au nouveau commit : prêt pour la suite", "Est détruit", "Contient l'ancien projet", "Part sur GitHub"], a: 0, exp: "Le cycle peut recommencer." },
    { type: "qcm", q: "Commiter la moitié de ses modifications est possible grâce à…", opts: ["L'index : on n'add que ce qu'on veut", "Une extension payante de Git", "Un réglage de GitHub", "Un mode de commit partiel automatique"], a: 0, exp: "La raison d'être du staging." },
    { type: "vf", q: "Le message de commit est optionnel et sans importance.", a: false, exp: "Dans six mois, c'est lui qui te sauvera." }
  ],
  final: {
    title: "Exercice final — Les trois premiers commits",
    intro: `<p>Le carnet prend vie : suis mentalement (ou réellement !) la séquence.</p>`,
    questions: [
      { type: "qcm", q: "echo \"# Mon carnet\" > recettes.txt vient d'être exécuté. recettes.txt est…", opts: ["Non suivi (untracked)", "Dans l'index", "Commité", "Sur GitHub"], a: 0, exp: "Git ne surveille rien tout seul." },
      { type: "input", q: "Commande pour le faire entrer dans l'index :", a: ["git add recettes.txt", "git add ."], ph: "git …", exp: "git add recettes.txt." },
      { type: "input", q: "Commande pour créer la photo avec le message « Création du carnet » :", a: ["git commit -m \"Création du carnet\"", "git commit -m 'Création du carnet'"], ph: "git …", exp: "git commit -m \"…\"." },
      { type: "qcm", q: "Tu ajoutes la tarte aux pommes dans le fichier. Pour la commiter :", opts: ["git add recettes.txt puis git commit -m \"…\"", "git commit tout seul suffit", "git init", "Rien : c'est automatique"], a: 0, exp: "Re-add à chaque modification." },
      { type: "vf", q: "Deux modifications indépendantes méritent deux commits séparés.", a: true, exp: "Un commit = une idée." }
    ],
    solution: `<pre class="pseudo">echo "# Mon carnet de recettes" > recettes.txt   # crée le fichier avec une première ligne de titre
git add recettes.txt                             # sélectionne le fichier dans l'index
git commit -m "Création du carnet de recettes"   # 1re photo : la naissance du carnet

(édition : ajout de la tarte aux pommes)         # on modifie le fichier dans l'éditeur
git add recettes.txt                             # on re-sélectionne la nouvelle version
git commit -m "Ajout de la tarte aux pommes"     # 2e photo : une idée = une recette

(édition : ajout du gratin dauphinois)           # nouvelle modification
git add recettes.txt                             # re-add de l'état du moment
git commit -m "Ajout du gratin dauphinois"       # 3e photo, 3e idée

→ 3 commits, 3 idées, 3 messages clairs. Le cycle est acquis.   # bilan : add → commit répété, chaque commit racontable en une ligne</pre>
<p>Demain : status et diff, le tableau de bord qui te dit toujours où tu en es.</p>`
  }
};
</script>
