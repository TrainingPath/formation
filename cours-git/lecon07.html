<script>
var DAY = {
  num: 7,
  title: "Annuler sans casser : restore et revert",
  subtitle: "La vraie raison d'utiliser Git : le droit à l'erreur.",
  theory: `
<h3>1. Trois erreurs, trois remèdes</h3>
<p>Annuler, en Git, dépend du moment où l'on est : la modification est-elle encore dans le répertoire de travail, déjà dans l'index, ou déjà gravée dans un commit ? À chaque situation son remède :</p>
<pre class="pseudo">Erreur                                  Remède                        # tableau : à chaque type d'erreur son remède adapté
──────────────────────────────────────  ───────────────────────────  # (simple ligne de séparation visuelle)
J'ai abîmé un fichier PAS ENCORE add    git restore fichier           # modif locale non ajoutée → on gomme, retour au dernier commit
J'ai add par erreur (pas encore commit) git restore --staged fichier  # ajouté par erreur → on le RETIRE de l'index (contenu gardé)
J'ai COMMITÉ une bêtise                 git revert hash               # bêtise déjà gravée → on crée un commit qui l'inverse</pre>

<h3>2. git restore : effacer les modifications locales</h3>
<p><strong>git restore</strong> (restore = « restaurer ») remet un fichier dans l'état du dernier commit. C'est la <em>gomme locale</em> : ce que tu viens de gribouiller disparaît.</p>
<pre class="pseudo">(recettes.txt massacré par erreur)   # tu as fait n'importe quoi dans le fichier, sans l'avoir add
git restore recettes.txt             # restaure le fichier depuis le dernier commit
→ le fichier redevient IDENTIQUE au dernier commit   # tes bêtises non commitées sont effacées</pre>
<p><strong>Danger contrôlé</strong> : les modifications non commitées sont perdues <em>définitivement</em> — c'est le but, mais vérifie avec <code>git diff</code> ce que tu t'apprêtes à jeter.</p>

<h3>3. git restore --staged : sortir de l'index</h3>
<pre class="pseudo">git add courses.txt          # oups, pas lui ! — le fichier vient d'entrer dans l'index par erreur
git restore --staged courses.txt   # --staged = « côté index » : on retire courses.txt de l'index
→ le fichier SORT de l'index, MAIS tes modifications restent intactes   # le contenu n'est pas touché, seule la sélection est annulée</pre>
<p>C'est l'anti-<code>add</code> : inoffensif, il ne touche pas au contenu du fichier.</p>

<h3>4. git revert : annuler un commit… par un commit</h3>
<p><strong>git revert</strong> (revert = « revenir en arrière ») n'efface pas le commit fautif : il ajoute un <strong>nouveau</strong> commit qui fait l'inverse. Analogie : au lieu de déchirer une page du registre, on écrit une nouvelle ligne « annule l'opération précédente » — tout reste traçable.</p>
<pre class="pseudo">git revert d5e6f7          # vise le commit fautif d5e6f7 (par son hash)
→ crée un NOUVEAU commit qui fait exactement l'inverse de d5e6f7   # le fautif reste, un commit vient le neutraliser

avant : a1b2c3 ── c7d8e9 ── d5e6f7 ── e9f0a1              # l'histoire AVANT : d5e6f7 (le fautif) est encore là
après : a1b2c3 ── c7d8e9 ── d5e6f7 ── e9f0a1 ── 9z8y7x    # APRÈS : un commit 9z8y7x s'ajoute tout au bout
                                              "Revert …"   # son message commence par « Revert » : il défait le fautif</pre>
<p>L'histoire n'est <strong>jamais réécrite</strong> : l'erreur et sa correction restent visibles. C'est la méthode sûre, la seule permise sur un dépôt partagé.</p>

<h3>5. Et git reset ?</h3>
<pre class="pseudo">git reset --hard HEAD~1   # reset --hard : REVIENT de force à HEAD~1 (l'avant-dernier) en SUPPRIMANT le dernier commit et les modifs. Brutal.</pre>
<p>Tu croiseras <code>reset --hard</code> dans des tutos : il <strong>réécrit l'histoire</strong> (il fait comme si le dernier commit n'avait jamais existé) et peut détruire du travail. Règle du cours : sur un commit déjà fait, préfère <code>revert</code>. Les usages légitimes de <code>reset</code> (et <code>amend</code>, <code>rebase</code>) t'attendent au cours CI/CD &amp; Git avancé.</p>
<div class="warn">git restore (sans --staged) jette IRRÉVERSIBLEMENT les modifications non commitées du fichier. git diff d'abord, toujours.</div>
<div class="tip">Astuce mentale : restore = gomme locale (avant commit) · revert = contre-commit officiel (après commit).</div>`,
  exercises: [
    { type: "input", q: "recettes.txt est abîmé, rien n'est add. Commande pour le remettre comme au dernier commit :", a: ["git restore recettes.txt"], ph: "git …", exp: "git restore recettes.txt." },
    { type: "qcm", q: "git restore recettes.txt remet le fichier…", opts: ["Identique au dernier commit", "Complètement vidé de son contenu", "À sa version sur GitHub", "Ajouté à l'index"], a: 0, exp: "La gomme locale." },
    { type: "vf", q: "Les modifications effacées par git restore sont récupérables.", a: false, exp: "Jamais commitées → définitivement perdues." },
    { type: "input", q: "courses.txt a été add par erreur. Commande pour le sortir de l'index sans toucher au contenu :", a: ["git restore --staged courses.txt"], ph: "git …", exp: "git restore --staged." },
    { type: "qcm", q: "git restore --staged fichier…", opts: ["Sort le fichier de l'index, contenu intact", "Efface le fichier", "Fait un commit", "Pousse sur GitHub"], a: 0, exp: "L'anti-add, inoffensif." },
    { type: "input", q: "Le commit d5e6f7 est une bêtise déjà commitée. Commande sûre pour l'annuler :", a: ["git revert d5e6f7"], ph: "git …", exp: "git revert d5e6f7." },
    { type: "qcm", q: "git revert annule un commit en…", opts: ["Créant un nouveau commit inverse", "Supprimant le commit de l'histoire", "Vidant complètement l'index", "Modifiant directement le vieux commit"], a: 0, exp: "L'histoire n'est jamais réécrite." },
    { type: "qcm", q: "Après un revert, le commit fautif…", opts: ["Reste visible dans l'histoire", "Disparaît de l'historique", "Est fusionné avec le commit suivant", "Est déplacé en fin d'historique"], a: 0, exp: "Erreur et correction sont documentées." },
    { type: "qcm", q: "Sur un dépôt partagé avec d'autres, la méthode sûre pour annuler un commit :", opts: ["revert", "reset --hard", "checkout du commit précédent", "rebase interactif"], a: 0, exp: "Ne jamais réécrire l'histoire publiée." },
    { type: "qcm", q: "git reset --hard HEAD~1…", opts: ["Supprime le dernier commit ET les modifications — brutal", "Est toujours sans danger", "Crée un commit inverse comme revert", "Fait une sauvegarde automatique d'abord"], a: 0, exp: "Réécrit l'histoire : cours CI/CD pour les usages légitimes." },
    { type: "vf", q: "restore agit avant commit ; revert agit après commit.", a: true, exp: "Gomme locale vs contre-commit officiel." },
    { type: "qcm", q: "Avant un git restore, le réflexe :", opts: ["git diff pour voir ce qu'on va jeter", "git push pour sauvegarder", "git commit des modifications", "git init pour repartir"], a: 0, exp: "On ne jette qu'en connaissance de cause." },
    { type: "qcm", q: "Un revert de « Ajout du gratin » aura pour effet…", opts: ["De retirer le gratin du fichier via un nouveau commit", "De supprimer tout le fichier", "D'effacer tout l'historique du fichier", "De remettre le fichier à zéro"], a: 0, exp: "L'inverse exact du commit visé." },
    { type: "vf", q: "git revert peut annuler un commit ancien, pas seulement le dernier.", a: true, exp: "Il inverse le commit désigné par son hash." },
    { type: "qcm", q: "Pourquoi ce cours recommande revert plutôt que reset pour un commit fait ?", opts: ["Revert n'efface rien : traçable et sans perte", "Revert est nettement plus rapide", "reset ne fonctionne pas en local", "revert évite de retaper le message"], a: 0, exp: "La sécurité d'abord ; reset viendra au cours CI/CD." }
  ],
  final: {
    title: "Exercice final — L'infirmerie du dépôt",
    intro: `<p>Trois accidents dans la même journée sur le carnet de recettes. À chaque accident son remède.</p>`,
    questions: [
      { type: "qcm", q: "Accident 1 : tu as effacé la moitié de recettes.txt en éditant, rien n'est add. Remède :", opts: ["git restore recettes.txt", "git revert HEAD", "git reset --hard", "git rm"], a: 0, exp: "Retour au dernier commit." },
      { type: "qcm", q: "Accident 2 : git add . a embarqué notes-perso.txt. Remède (contenu intact) :", opts: ["git restore --staged notes-perso.txt", "git restore notes-perso.txt", "git reset --hard HEAD", "Supprimer le fichier à la main"], a: 0, exp: "Sortie de l'index seulement." },
      { type: "qcm", q: "Accident 3 : le commit c7d8e9 (déjà partagé) contient une erreur. Remède :", opts: ["git revert c7d8e9", "git reset --hard c7d8e9", "git commit --amend", "git restore c7d8e9"], a: 0, exp: "Contre-commit : sûr et traçable." },
      { type: "vf", q: "Dans l'accident 2, git restore (sans --staged) aurait aussi détruit les modifications du fichier.", a: true, exp: "D'où l'importance du --staged." },
      { type: "qcm", q: "Après le revert de l'accident 3, l'historique contient…", opts: ["c7d8e9 ET son commit inverse", "Plus aucune trace de c7d8e9", "Un vide à la place de c7d8e9", "Une nouvelle branche de correction"], a: 0, exp: "L'histoire complète, jamais réécrite." }
    ],
    solution: `<pre class="pseudo">Accident 1 (fichier abîmé, pas add) :
  git diff recettes.txt          # que vais-je jeter ? (contrôle AVANT de gommer)
  git restore recettes.txt       # gomme locale : retour au dernier commit

Accident 2 (add de trop) :
  git restore --staged notes-perso.txt   # sort de l'index, contenu intact (l'anti-add)

Accident 3 (commit fautif) :
  git revert c7d8e9              # contre-commit : ajoute l'inverse du commit fautif
  → l'histoire garde l'erreur ET la correction : traçable, sûr.   # rien n'est réécrit

Réflexe : avant commit → restore · après commit → revert          # la bonne commande selon le moment
          reset --hard : pas avant le cours CI/CD & Git avancé.    # outil brutal, réservé à plus tard</pre>
<p>Le droit à l'erreur est acquis. Demain : marquer les versions avec les tags.</p>`
  }
};
</script>

<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "git-l7",
    checklist: ["Pour chacune des 5 urgences, as-tu donné la commande EXACTE et le contrôle à faire AVANT ?", "As-tu précisé pour chaque remède ce qu'il préserve et ce qu'il détruit (réversible ou non) ?", "As-tu vu que l'urgence 5 (revoir le passé) ne demande AUCUNE annulation, juste de la lecture ?", "Ta règle d'or distingue-t-elle « avant commit → restore » et « après commit partagé → revert » ?"], title: "La fiche réflexe des urgences", level: 3,
    statement: "Rédige la « fiche réflexe » que tu garderas près de ton clavier : pour chacune des cinq urgences suivantes, la commande exacte, ce qu'elle préserve, ce qu'elle détruit, et le contrôle à faire AVANT. Urgences : (1) fichier massacré non add, (2) add de trop, (3) commit fautif local, (4) commit fautif déjà partagé, (5) « je veux juste revoir la version d'il y a deux commits sans rien changer ». Termine par la règle d'or en une phrase.",
    hints: [
      "L'urgence 5 ne demande AUCUNE annulation — leçon 5.",
      "Pour chaque remède, demande-toi : l'histoire est-elle réécrite ? du contenu est-il perdu ?",
      "3 et 4 ont le même remède sûr dans ce cours — la différence viendra avec reset/amend au cours CI/CD."
    ],
    solution: "FICHE RÉFLEXE — URGENCES GIT\n\n1) Fichier massacré, pas add\n   AVANT : git diff fichier        (que vais-je jeter ?)\n   → git restore fichier\n   Préserve : le dernier commit. Détruit : les modifs locales (définitif).\n\n2) add de trop\n   AVANT : git status\n   → git restore --staged fichier\n   Préserve : TOUT le contenu. Détruit : rien (sort juste de l'index).\n\n3) Commit fautif (local)\n   AVANT : git show HEAD           (confirmer le fautif)\n   → git revert HEAD\n   Préserve : toute l'histoire. Détruit : rien (ajoute un contre-commit).\n\n4) Commit fautif (déjà partagé)\n   → git revert hash — IDENTIQUE : la seule méthode qui ne réécrit pas\n     une histoire que d'autres possèdent déjà.\n\n5) Revoir le passé sans rien changer\n   → git show HEAD~2:fichier   (lecture)\n     ou git checkout HEAD~2 … puis git checkout master (visite)\n   Préserve : tout. Détruit : rien — ce n'était PAS une urgence.\n\nRÈGLE D'OR : avant commit, la gomme (restore) ; après commit,\nle contre-commit (revert) ; et on ne réécrit JAMAIS une histoire partagée.",
    note: "Le cas 5 est le plus important : la moitié des « urgences » des débutants se résolvent en LECTURE (log, show, diff) sans rien annuler. Savoir qu'une commande est destructive ou non — et le vérifier avant — est exactement la maturité qu'attendra le cours CI/CD quand il introduira reset, amend et rebase." }
  ]
};
