<script>
var DAY = {
  num: 1,
  title: "Pourquoi versionner ? L'idée du contrôle de version",
  subtitle: "projet_final_v2_VRAIMENT_final.zip n'est pas un système de sauvegarde.",
  theory: `
<h3>1. Le problème</h3>
<p>Tu travailles sur un projet. Tu modifies un fichier, ça casse tout, et tu ne te souviens plus de ce qui marchait avant. Ou bien tu copies le dossier entier « au cas où » : <em>projet</em>, <em>projet_old</em>, <em>projet_final</em>, <em>projet_final_v2</em>… Impossible de savoir ce qui a changé, quand, et pourquoi.</p>

<h3>2. L'idée du contrôle de version</h3>
<p>Un <strong>système de contrôle de version</strong> (VCS) enregistre l'histoire complète d'un projet sous forme de <strong>photos successives</strong> appelées <strong>commits</strong>. Chaque commit retient : l'état exact de tous les fichiers, la date, l'auteur, et un <strong>message</strong> expliquant le changement.</p>
<pre class="pseudo">Sans VCS : projet_v1.zip  projet_v2.zip  projet_FINAL.zip   (chaos)
Avec Git : commit 1 ── commit 2 ── commit 3 ── commit 4     (histoire)
           "création"  "ajout tarte" "correction"  "sommaire"</pre>

<h3>3. Ce que Git permet</h3>
<p><strong>Revenir en arrière</strong> à n'importe quel état passé sans rien perdre. <strong>Comparer</strong> deux versions ligne par ligne. <strong>Comprendre</strong> qui a changé quoi et pourquoi. <strong>Collaborer</strong> : plusieurs personnes sur le même projet sans s'écraser. <strong>Sauvegarder</strong> sur un serveur distant (GitHub…).</p>

<h3>4. Git est local et distribué</h3>
<pre class="pseudo">L'histoire COMPLÈTE vit dans un dossier caché .git/
→ tout fonctionne SANS internet (commit, historique, retour arrière)
→ le serveur distant (GitHub) n'est qu'une copie de plus (leçon 10)</pre>
<p>Contrairement aux anciens systèmes centralisés, chaque copie d'un dépôt Git contient <strong>toute l'histoire</strong>. C'est pour cela que Git est rapide et utilisable hors ligne.</p>

<h3>5. Le fil conducteur du cours</h3>
<p>Nous allons versionner un petit projet : <strong>le carnet de recettes</strong> — quelques fichiers texte que l'on crée, modifie, corrige et publie. Simple exprès : toute l'attention va à Git. Tout ce que tu apprendras s'applique tel quel à tes projets Java, Python, PHP ou C#.</p>
<div class="warn">Git versionne des <strong>fichiers texte</strong> (code, HTML, Markdown…) à merveille ; les fichiers binaires (images, zip) sont stockés mais impossibles à comparer ligne par ligne.</div>
<div class="tip">Git est LE standard : demandé dans toutes les offres d'emploi, prérequis du cours CI/CD &amp; Git avancé. Deux semaines suffisent pour les bases.</div>`,
  exercises: [
    { type: "qcm", q: "Le problème que résout un contrôle de version :", opts: ["Réduire la taille des fichiers du projet", "Garder et comprendre l'histoire des modifications d'un projet", "Accélérer l'exécution du programme", "Corriger les fautes de frappe dans le code"], a: 1, exp: "Fini les projet_final_v2.zip." },
    { type: "qcm", q: "Un commit est…", opts: ["Une photo datée et commentée de l'état du projet", "Une archive compressée du projet", "Un serveur qui héberge le code", "Une commande d'installation de Git"], a: 0, exp: "État + date + auteur + message." },
    { type: "qcm", q: "Chaque commit retient notamment…", opts: ["L'état des fichiers, l'auteur, la date, un message", "Seulement le nom du fichier modifié", "Le mot de passe de ton compte GitHub", "La version de Git utilisée"], a: 0, exp: "Les quatre à la fois." },
    { type: "vf", q: "Copier le dossier du projet en projet_v2, projet_v3… est une méthode fiable de versionnage.", a: false, exp: "On ne sait ni quoi, ni quand, ni pourquoi." },
    { type: "qcm", q: "VCS signifie…", opts: ["Version Control System", "Virtual Code Storage", "Verified Commit Signature", "Visual Compare System"], a: 0, exp: "Système de contrôle de version." },
    { type: "qcm", q: "L'histoire complète d'un dépôt Git vit…", opts: ["Uniquement sur GitHub", "Dans le dossier caché .git/ du projet", "Uniquement dans la mémoire de l'éditeur", "Sur un serveur central obligatoire"], a: 1, exp: "D'où le fonctionnement hors ligne." },
    { type: "vf", q: "Il faut une connexion internet pour faire un commit.", a: false, exp: "Git est local : commit, log, retour arrière fonctionnent hors ligne." },
    { type: "qcm", q: "« Distribué » signifie que…", opts: ["Chaque copie du dépôt contient toute l'histoire", "Le code est distribué aux clients", "Git répartit les calculs sur plusieurs cœurs", "Le dépôt est découpé en morceaux séparés"], a: 0, exp: "GitHub n'est qu'une copie de plus." },
    { type: "qcm", q: "Git permet de comparer deux versions…", opts: ["Ligne par ligne", "Seulement par taille de fichier", "Seulement par date de modification", "Uniquement fichier entier contre fichier entier"], a: 0, exp: "Le diff, leçon 4." },
    { type: "qcm", q: "Revenir à un état passé avec Git…", opts: ["Perd tout le travail récent", "Est possible sans rien perdre", "Nécessite un backup externe", "Efface définitivement l'historique"], a: 1, exp: "L'histoire reste là." },
    { type: "qcm", q: "Git gère le mieux…", opts: ["Les fichiers texte (code, Markdown…)", "Les vidéos", "Les images", "Les zip"], a: 0, exp: "Les binaires sont stockés mais non comparables." },
    { type: "vf", q: "GitHub et Git sont la même chose.", a: false, exp: "Git = l'outil local ; GitHub = un hébergeur de dépôts (leçon 10)." },
    { type: "qcm", q: "Le fil conducteur du cours est…", opts: ["Le carnet de recettes", "Un jeu vidéo", "Un site e-commerce", "Une application mobile"], a: 0, exp: "Simple exprès : l'attention va à Git." },
    { type: "qcm", q: "Le message d'un commit sert à…", opts: ["Nommer la branche courante", "Expliquer le pourquoi du changement", "Chiffrer le contenu du commit", "Numéroter automatiquement les fichiers"], a: 1, exp: "L'histoire doit se lire." },
    { type: "vf", q: "Ce cours donne les bases attendues par le cours CI/CD & Git avancé.", a: true, exp: "commit, tags, branches de base, remote." }
  ],
  final: {
    title: "Exercice final — Les concepts en place",
    intro: `<p>On vérifie le vocabulaire avant d'installer quoi que ce soit.</p>`,
    questions: [
      { type: "qcm", q: "L'histoire d'un projet Git est une suite de…", opts: ["Commits", "Copies de dossiers datées", "Sauvegardes automatiques", "Branches distantes"], a: 0, exp: "Des photos datées et commentées." },
      { type: "qcm", q: "Le dossier caché qui contient toute l'histoire :", opts: [".git/", ".history/", "backup/", "node_modules/"], a: 0, exp: "À la racine du projet." },
      { type: "vf", q: "Git fonctionne entièrement hors ligne pour le travail local.", a: true, exp: "Seul l'échange avec le serveur demande le réseau." },
      { type: "qcm", q: "Git est dit « distribué » car…", opts: ["chaque copie contient toute l'histoire", "il synchronise les fichiers en temps réel", "il nécessite un abonnement", "il est centralisé"], a: 0, exp: "Pas de serveur obligatoire." },
      { type: "qcm", q: "GitHub est…", opts: ["Un hébergeur de dépôts Git", "L'inventeur de Git", "Une version payante de Git", "Un éditeur de texte"], a: 0, exp: "Une copie en ligne + des outils de collaboration." }
    ],
    solution: `<pre class="pseudo">Problème  : l'histoire d'un projet se perd (projet_final_v2.zip)
Solution  : Git enregistre des COMMITS = photos datées + message
Local     : toute l'histoire vit dans .git/ → hors ligne OK
Distribué : chaque copie = l'histoire complète ; GitHub = copie en ligne

Fil conducteur : le carnet de recettes, versionné
                 de la première ligne (leçon 2) au push (leçon 10).</pre>
<p>Les idées sont posées. Demain : installer Git et créer ton premier dépôt.</p>`
  }
};
</script>
