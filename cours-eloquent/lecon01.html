<script>
var DAY = {
  num: 1,
  title: "Pourquoi un ORM ? Du SQL aux objets",
  subtitle: "Ton code pense en objets, ta base pense en tables. L'ORM fait le pont.",
  theory: `
<h3>1. Le problème : du SQL écrit à la main, partout</h3>
<p>Au niveau 4, tu as conçu la base <strong>ludotheque</strong> : tables <em>jeux</em>, <em>membres</em>, <em>locations</em>, <em>avis</em>, <em>categories</em>, <em>editeurs</em>. Pour l'interroger depuis PHP sans ORM, tu écris du <strong>SQL</strong> en chaîne de caractères, tu l'exécutes via <strong>PDO</strong>, et tu récupères… des tableaux associatifs.</p>
<p>Trois mots à poser tout de suite. Le <strong>SQL</strong> (<em>Structured Query Language</em>) est la langue des bases de données : c'est en SQL qu'on écrit « donne-moi tous les jeux à moins de 5 € » (analogie : la langue officielle que parle MySQL, comme le français au guichet d'une administration — si tu veux quelque chose, tu dois le demander dans cette langue). <strong>PDO</strong> (<em>PHP Data Objects</em>) est le pilote fourni par PHP pour dialoguer avec la base : c'est la prise standard entre ton code PHP et MySQL (analogie : le combiné téléphonique qui te relie à la base — tu parles dedans, en SQL). Un <strong>tableau associatif</strong> est une liste de paires étiquette → valeur, par exemple <code>'titre' =&gt; 'Catan'</code> (analogie : un annuaire où l'on retrouve un numéro à partir d'un nom).</p>
<pre class="pseudo">&lt;?php
// Sans ORM : PDO brut
$stmt = $pdo-&gt;prepare('SELECT * FROM jeux WHERE prix_location &lt;= ?');  // prépare la requête ; le ? est un trou à remplir plus tard
$stmt-&gt;execute([5]);                // exécute la requête en glissant 5 dans le trou ? (jeux à 5 € ou moins)
$lignes = $stmt-&gt;fetchAll();        // récupère TOUTES les lignes trouvées : des tableaux associatifs, pas des objets
echo $lignes[0]['titre'];          // affiche le titre de la 1re ligne ; une faute dans la clé 'titre' = null silencieux</pre>
<p>Chaque écran de la Ludothèque répète ce rituel : écrire la requête, la lier, transformer les lignes en quelque chose d'utilisable. C'est verbeux, répétitif, fragile.</p>

<h3>2. Le décalage objet-relationnel</h3>
<p>Ton application PHP raisonne en <strong>objets</strong> : une classe Jeu avec des propriétés et des méthodes (une <strong>classe</strong> est un moule qui décrit un type d'objet ; un <strong>objet</strong> est un exemplaire fabriqué à partir de ce moule). Ta base raisonne en <strong>relations</strong> : des lignes plates reliées par des clés étrangères (une <strong>clé étrangère</strong> est une colonne qui contient l'identifiant d'une ligne d'une autre table — analogie : le numéro de dossier écrit sur un formulaire qui renvoie vers un autre dossier). Les deux mondes ne parlent pas la même langue — c'est le fameux <em>décalage objet-relationnel</em> (<em>impedance mismatch</em>).</p>
<pre class="pseudo">Monde OBJET                        Monde RELATIONNEL
classe Jeu, propriétés typées      table jeux : lignes et colonnes
$jeu-&gt;editeur (référence objet)    colonne editeur_id (clé étrangère)
$jeu-&gt;avis (collection d'objets)   table avis + jointure
méthodes, héritage                 rien de tout cela</pre>
<p>Une <strong>collection</strong> est une liste d'objets fournie par Eloquent (analogie : un classeur de fiches, avec des outils tout prêts pour trier, filtrer, compter). Sans outil, c'est toi qui traduis dans les deux sens, à la main, requête après requête.</p>

<h3>3. Ce qu'un ORM automatise</h3>
<p>Un <strong>ORM</strong> (<em>Object-Relational Mapper</em>, littéralement « cartographe objet-relationnel ») fait ce travail de traduction à ta place (analogie : un interprète bilingue assis entre ton code et la base). Trois automatismes majeurs : le <strong>mapping</strong> (la colonne titre devient la propriété titre — c'est la « carte » qui relie chaque colonne à un attribut d'objet), le <strong>CRUD</strong> (<em>Create, Read, Update, Delete</em> : créer, lire, modifier, supprimer sans écrire de SQL), et les <strong>relations</strong> (naviguer d'un jeu vers ses avis comme si c'était un simple attribut).</p>
<pre class="pseudo">use App\\Models\\Jeu;                // rend la classe modèle Jeu utilisable dans ce fichier

$jeu = Jeu::find(7);               // SELECT * FROM jeux WHERE id = 7 : récupère le jeu n°7 sous forme d'objet
echo $jeu-&gt;titre;                  // colonne "titre" → propriété $jeu->titre, automatiquement (c'est le mapping)
$jeu-&gt;prix_location = 4.50;        // modifie la propriété en mémoire (rien n'est encore envoyé à la base)
$jeu-&gt;save();                      // UPDATE jeux SET prix_location = 4.50 WHERE id = 7 : enregistre le changement

foreach ($jeu-&gt;avis as $avis) {    // parcourt les avis du jeu ; la relation génère la jointure pour toi
    echo $avis-&gt;note;              // affiche la note de chaque avis
}                                  // fin de la boucle</pre>
<p>Chaque ligne de la table devient un <strong>objet vivant</strong> : Eloquent l'appelle un <em>modèle</em> (analogie : la ligne froide de la table se réveille en une fiche animée qui sait se lire, se modifier et s'enregistrer toute seule).</p>

<h3>4. Avantages… et limites</h3>
<p><strong>Avantages</strong> : productivité (dix fois moins de code de plomberie), sécurité (les valeurs passent par des requêtes préparées, l'injection SQL est neutralisée par défaut), lisibilité (le code exprime le métier, pas la tuyauterie), portabilité (changer MySQL pour PostgreSQL touche surtout la config).</p>
<p><strong>Limites</strong> : le SQL généré peut être sous-optimal (le piège des requêtes <strong>N+1</strong> — une requête pour la liste, puis une par élément, comme si tu retournais à la bibliothèque chercher un livre à la fois ; on le verra en semaine 2), la « magie » cache ce qui se passe si tu ne sais pas la lire, et certaines requêtes très complexes restent plus simples en SQL brut — que Laravel autorise toujours.</p>
<pre class="pseudo">Règle d'or : un ORM ne REMPLACE pas ta connaissance de SQL,
il l'INDUSTRIALISE. Tu dois toujours savoir quel SQL part vers MySQL.</pre>

<h3>5. Le panorama et le fil rouge</h3>
<p>Chaque écosystème a son ORM de référence : <strong>Eloquent</strong> pour Laravel (PHP), <strong>Hibernate/JPA</strong> pour Spring (Java), <strong>EF Core</strong> pour ASP.NET (C#), et l'<strong>ORM de Django</strong> (Python). Les concepts de ce cours — mapping, migrations, relations — se transposent presque mot pour mot d'une pile à l'autre.</p>
<p>Notre fil rouge : construire la <strong>couche de persistance de la Ludothèque</strong> avec les modèles <strong>Jeu</strong>, <strong>Membre</strong>, <strong>Location</strong> et <strong>Avis</strong>, sur le schéma MySQL que tu as conçu au niveau 4. Cette semaine : un modèle à la fois. Semaine 2 : les relations entre eux.</p>
<div class="warn">Un ORM ne dispense jamais de comprendre le SQL généré. Un développeur qui ignore ce qu'Eloquent envoie à MySQL écrit des applications lentes sans le savoir. Tu apprendras dès la leçon 2 à espionner chaque requête.</div>
<div class="tip">Tout ce que tu vas apprendre ici est ton passeport multi-langages : en entretien, expliquer qu'Eloquent, Hibernate, EF Core et Django ORM résolvent le même problème te classe immédiatement au-dessus du lot.</div>`,
  exercises: [
    { type: "qcm", q: "ORM signifie…", opts: ["Object-Relational Mapper", "Online Request Manager", "Object Rendering Module", "Open Resource MySQL"], a: 0, exp: "Un traducteur entre objets et tables relationnelles." },
    { type: "qcm", q: "Le « décalage objet-relationnel », c'est…", opts: ["La lenteur du réseau entre PHP et MySQL", "La différence de représentation entre objets (références, méthodes) et tables (lignes, clés étrangères)", "Une incompatibilité entre la version de PHP et celle de MySQL", "Le délai de synchronisation entre le cache et la base"], a: 1, exp: "Deux mondes, deux langues : l'ORM traduit." },
    { type: "qcm", q: "Sans ORM, une ligne récupérée via PDO fetchAll() est…", opts: ["Un objet Jeu complet", "Une chaîne JSON", "Un tableau associatif", "Une instance de PDOStatement à parcourir"], a: 2, exp: "D'où l'hydratation manuelle vers des objets." },
    { type: "qcm", q: "Parmi les trois grands automatismes d'un ORM, on trouve…", opts: ["Compilation, minification, déploiement", "Mapping colonnes-propriétés, CRUD, relations", "Sauvegarde disque, réplication, sharding", "Routage, cache et gestion des sessions"], a: 1, exp: "Le cœur du métier d'un ORM." },
    { type: "vf", q: "Avec Eloquent, chaque ligne de la table jeux peut être manipulée comme un objet PHP.", a: true, exp: "C'est le principe du mapping : ligne = instance de modèle." },
    { type: "qcm", q: "Jeu::find(7) génère en coulisses…", opts: ["DELETE FROM jeux WHERE id = 7", "SELECT * FROM jeux WHERE id = 7", "UPDATE jeux SET id = 7", "SHOW TABLES"], a: 1, exp: "find cherche par clé primaire." },
    { type: "qcm", q: "Côté sécurité, un ORM protège par défaut contre…", opts: ["Les attaques par déni de service (DDoS)", "Les failles XSS dans les pages HTML", "L'injection SQL, grâce aux requêtes préparées", "Le vol de session par cookie non sécurisé"], a: 2, exp: "Les valeurs sont liées, jamais concaténées dans le SQL." },
    { type: "vf", q: "Une fois qu'on utilise un ORM, connaître SQL devient inutile.", a: false, exp: "Il faut savoir lire le SQL généré : c'est la règle d'or du cours." },
    { type: "qcm", q: "L'ORM de l'écosystème Java/Spring est…", opts: ["EF Core", "Eloquent", "Doctrine", "Hibernate/JPA"], a: 3, exp: "Hibernate implémente le standard JPA." },
    { type: "qcm", q: "EF Core est l'ORM de…", opts: ["ASP.NET (C#)", "Django (Python)", "Laravel (PHP)", "Ruby on Rails"], a: 0, exp: "Entity Framework Core, côté Microsoft." },
    { type: "input", q: "Quel est le nom de l'ORM intégré à Laravel ?", a: ["Eloquent", "eloquent"], ph: "Nom de l'ORM…", exp: "Eloquent est livré avec Laravel, aucun paquet à installer." },
    { type: "qcm", q: "Une limite classique des ORM :", opts: ["Ils imposent de renoncer à tout SQL écrit à la main", "Le SQL généré peut être sous-optimal (ex. requêtes N+1)", "Ils ralentissent systématiquement toutes les requêtes simples", "Ils empêchent d'utiliser les transactions"], a: 1, exp: "D'où l'importance d'espionner les requêtes." },
    { type: "qcm", q: "Le fil rouge de ce cours est…", opts: ["Une plateforme de blog collaboratif", "Un moteur de rendu graphique 3D", "La couche de persistance de la Ludothèque (Jeu, Membre, Location, Avis)", "Un réseau social de microblogage"], a: 2, exp: "Le schéma MySQL du niveau 4 prend vie en objets." },
    { type: "vf", q: "Laravel interdit d'écrire du SQL brut quand on utilise Eloquent.", a: false, exp: "DB::select et les requêtes brutes restent disponibles pour les cas complexes." },
    { type: "input", q: "Quelle méthode statique d'Eloquent récupère un modèle par sa clé primaire ?", a: ["find", "find()", "Jeu::find"], ph: "Nom de la méthode…", exp: "Jeu::find(7) : la porte d'entrée la plus simple." }
  ],
  final: {
    title: "Exercice final — Le pont entre deux mondes",
    intro: `<p>On vérifie que l'idée d'ORM est en place avant de configurer quoi que ce soit.</p>`,
    questions: [
      { type: "qcm", q: "Le rôle central d'un ORM est de…", opts: ["Traduire automatiquement entre objets du code et tables de la base", "Remplacer la base de données par un stockage en fichiers plats", "Composer les pages HTML envoyées au navigateur", "Optimiser et compresser les fichiers statiques"], a: 0, exp: "Mapping, CRUD et relations automatisés." },
      { type: "qcm", q: "Dans la Ludothèque, la colonne editeur_id de la table jeux correspond côté objet à…", opts: ["Une méthode calculée du modèle Jeu", "Une référence vers un objet Editeur", "Une entrée du fichier de configuration", "Une constante de classe figée à la compilation"], a: 1, exp: "Clé étrangère côté table, référence côté objet : le cœur du décalage." },
      { type: "vf", q: "Eloquent, Hibernate, EF Core et l'ORM Django résolvent le même problème dans quatre écosystèmes différents.", a: true, exp: "Les concepts de ce cours sont transférables." },
      { type: "qcm", q: "L'ORM du framework Django (Python) suit la même mission qu'Eloquent, à savoir…", opts: ["Servir les fichiers statiques", "Gérer les sessions", "Mapper objets et tables", "Envoyer des emails"], a: 2, exp: "Même famille d'outils, autre langage." },
      { type: "qcm", q: "Le bon réflexe professionnel face à la « magie » d'un ORM :", opts: ["Faire confiance aveuglément", "Revenir au PDO brut partout", "Désactiver les logs", "Savoir inspecter le SQL réellement généré"], a: 3, exp: "C'est exactement l'objet de la leçon 2 avec toSql et DB::listen." }
    ],
    solution: `<pre class="pseudo">Problème  : SQL en chaînes + tableaux associatifs = code verbeux et fragile
Décalage  : objets (références, méthodes) vs tables (lignes, clés étrangères)
ORM       : automatise mapping, CRUD, relations — SQL préparé = injection neutralisée
Limites   : SQL parfois sous-optimal (N+1), magie à savoir lire
Panorama  : Eloquent (Laravel), Hibernate/JPA (Spring),
            EF Core (ASP.NET), ORM Django (Python)

Fil rouge : la Ludothèque — modèles Jeu, Membre, Location, Avis
            sur le schéma MySQL conçu au niveau 4.</pre>
<p>Le décor est planté. Prochaine leçon : brancher Laravel sur la base ludotheque, comprendre les conventions d'Eloquent et expérimenter dans tinker.</p>`
  }
};
</script>
