<body>
<script>
var DAY = {
  num: 21,
  title: "Récapitulatif : l'ORM maîtrisé (examen)",
  subtitle: "Vingt leçons, un examen : prouve que la persistance de la Ludothèque n'a plus de secret pour toi.",
  theory: `
<p>Cette leçon n'apporte rien de neuf : c'est ta <strong>fiche de révision</strong> avant l'examen (analogie : l'antisèche que tu as le droit de fabriquer toi-même — la construire est déjà réviser). Chaque tableau ci-dessous est une carte mémoire ; le code y est volontairement condensé, avec entre parenthèses le numéro (Lx) de la leçon où tout est détaillé. Si un seul mot te bloque, relis la leçon avant de te lancer.</p>

<h3>1. Semaine 1 — Mapper : des modèles aux tables (leçons 1-7)</h3>
<p>Rappel du fil : brancher des objets PHP sur les tables MySQL. Voici la carte mémoire de la semaine 1 :</p>
<pre class="pseudo">ORM          objets PHP ↔ tables MySQL · fini le SQL copié-collé (L1)
Conventions  Jeu → table jeux · clé id · timestamps · tinker + DB::listen (L2)
Modèle       class Jeu extends Model · $fillable = liste blanche (L3)
Migrations   le schéma versionné · up/down · foreignId()-&gt;constrained() (L4)
Créer/Lire   create ($fillable !) · find/findOrFail (→ 404) · first ·
             firstOrCreate · all() = petites tables seulement (L5)
Modif/Suppr  save · update · delete · destroy · SoftDeletes
             (deleted_at + global scope invisible) (L6)
Pattern      Active Record : l'objet sait se sauvegarder —
             vs Data Mapper (Hibernate) où un tiers s'en charge (L7)</pre>
<p>Si un seul mot de ce tableau te semble flou, retourne à la leçon avant de lancer l'examen : les questions mélangent volontairement les semaines.</p>

<h3>2. Semaine 2 — Les relations (leçons 8-12)</h3>
<p>Relier les modèles entre eux sans réécrire de JOIN. Chaque type de relation résumé :</p>
<pre class="pseudo">belongsTo        enfant → parent · TOUJOURS côté clé étrangère (L8)
hasMany          parent → enfants · $jeu-&gt;avis()-&gt;save(...) pose la FK (L9)
belongsToMany    N-N · pivot categorie_jeu · attach/detach/sync
                 (sync = checkboxes) · withPivot (L10)
hasOne           1-1 · FK UNIQUE en base obligatoire · latestOfMany (L11)
hasManyThrough   Editeur → Jeu → Location · aucune colonne nouvelle (L11)
with()           l'eager loading contre le N+1 : 1+N requêtes → 2
                 with('jeu.editeur') · load() · withCount ·
                 preventLazyLoading en dev (L12)</pre>

<h3>3. Semaine 3 — Requêtes et performance (leçons 13-16)</h3>
<p>Interroger finement et vite, sans jamais tout charger en PHP. La carte mémoire :</p>
<pre class="pseudo">Query builder  where (AND) · orWhere (closure = parenthèses !) ·
               whereIn/Between/Null · orderBy · limit · when · toSql (L13)
Agrégats       count/sum/avg côté SQL · withCount/withAvg (triables) ·
               whereHas = EXISTS corrélé · groupBy + having (L14)
SQL brut       selectRaw/whereRaw/DB::select · bindings ? OBLIGATOIRES :
               une concaténation = une injection (L15)
Pagination     paginate (COUNT + page, links) · simplePaginate (sans COUNT) ·
               cursorPaginate (scroll infini) · withQueryString (L16)</pre>

<h3>4. L'intégrité et l'expressivité (leçons 17-20)</h3>
<p>Écrire sans jamais corrompre les données, et rendre les modèles agréables à manipuler :</p>
<pre class="pseudo">Transactions   DB::transaction = tout-ou-rien · l'exception doit SORTIR ·
               lockForUpdate contre la course au dernier exemplaire ·
               mail APRÈS commit · retries anti-deadlock (L17)
Typage         $casts (Carbon, boolean, decimal, array) · accesseurs
               (lire, jamais filtrables) · mutateurs (nettoyer) ·
               $appends pour le JSON (L18)
Vocabulaire    scopes locaux (scopeXxx → xxx()) · global scopes ·
               events creating/created (⚠ pas sur les updates de masse) ·
               fat models, skinny controllers (L19)
Synthèse       les 4 modèles · les requêtes clés · la transaction
               de location · les 4 pièges mortels (L20)</pre>

<h3>5. Le mode d'emploi de l'examen</h3>
<p>Les 15 questions et l'exercice final balayent les 20 leçons, dans le désordre et en les combinant : une question peut mêler relation, N+1 et pagination. Méthode conseillée : un premier passage <strong>sans aucune note</strong>, pour photographier ton vrai niveau. Note les questions hésitantes, relis les leçons concernées, puis vise le sans-faute — le badge de ce cours se mérite à 20/20.</p>
<p>Et après ? Le <strong>Niveau 6</strong> t'attend : le projet full-stack, où cette couche de persistance devient le socle d'une vraie application — routes, API, authentification, front. Les modèles que tu as écrits ici seront réutilisés tels quels. <em>Et si ta carrière te mène vers Java, C# ou Python : Hibernate/JPA, EF Core et l'ORM Django t'attendent avec les mêmes concepts sous d'autres noms — tu as appris l'ORM, pas seulement Eloquent.</em></p>
<div class="warn">À l'examen comme en production, les pièges sont toujours les mêmes quatre : le N+1 (relation lue en boucle sans with), l'assignation de masse sans $fillable, la concaténation d'une saisie dans du raw, et les écritures multiples hors transaction. Chaque fois qu'une question te semble facile, vérifie qu'elle ne cache pas l'un d'eux.</div>
<div class="tip">La meilleure révision tient en trois gestes dans tinker : recrée une relation de mémoire et vérifie le SQL avec DB::listen ; écris la requête catalogue complète (scope + with + withCount + paginate) sans regarder la leçon 20 ; rejoue la transaction de location avec une exception volontaire et constate le rollback. Si les trois passent, l'examen passera.</div>`,
  exercises: [
    { type: "qcm", q: "(L1-L7) Le pattern de base d'Eloquent, où l'objet sait se sauvegarder lui-même :", opts: ["Data Mapper", "Active Record", "Singleton", "Repository"], a: 1, exp: "$jeu->save() : Active Record — le Data Mapper (Hibernate) confie ce travail à un tiers." },
    { type: "qcm", q: "(L2-L3) Par convention, le modèle CarteFidelite est mappé sur la table…", opts: ["CarteFidelite", "cartefidelites", "carte_fidelites", "cartes_fidelites"], a: 2, exp: "snake_case + pluriel du dernier mot : carte_fidelites." },
    { type: "qcm", q: "(L3, L5) Jeu::create($request->all()) sans $fillable strict expose à…", opts: ["Une erreur de syntaxe", "L'assignation de masse : un champ malveillant (ex : est_admin) écrit en base", "Rien", "Un N+1"], a: 1, exp: "La liste blanche $fillable est LE rempart contre les champs injectés dans le formulaire." },
    { type: "input", q: "(L4) Quelle commande artisan exécute les migrations en attente ?", a: ["php artisan migrate", "artisan migrate", "migrate"], ph: "php artisan …", exp: "php artisan migrate — et migrate:rollback pour la marche arrière (down)." },
    { type: "qcm", q: "(L6) Avec SoftDeletes, $jeu->delete()…", opts: ["Supprime la ligne physiquement", "Remplit deleted_at ; le jeu disparaît des requêtes via un global scope", "Vide la table", "Lève une exception"], a: 1, exp: "Suppression douce : trace conservée, restore() possible, withTrashed() pour tout voir." },
    { type: "qcm", q: "(L8) Location porte jeu_id et membre_id : elle déclare donc…", opts: ["Deux hasMany", "Deux belongsTo (jeu et membre), avec les hasMany en miroir dans Jeu et Membre", "Un belongsToMany", "Un hasOne"], a: 1, exp: "belongsTo vit TOUJOURS du côté de la clé étrangère — la règle d'or des relations." },
    { type: "qcm", q: "(L10) Le formulaire à cases à cocher des catégories du jeu 3 renvoie [1, 4] :", opts: ["attach([1, 4])", "$jeu->categories()->sync([1, 4])", "detach()", "save([1, 4])"], a: 1, exp: "sync = la liste finale : attache le manquant, détache le surplus, idempotent." },
    { type: "vf", q: "(L11) Un hasOne fiable exige une contrainte UNIQUE sur la clé étrangère en base.", a: true, exp: "Sans UNIQUE, le 1-1 est un 1-N déguisé et hasOne retourne silencieusement « une » ligne." },
    { type: "qcm", q: "(L12) 500 locations affichées avec $location->jeu->titre : le remède au N+1 est…", opts: ["Location::all()", "Location::with('jeu')->get() : 2 requêtes au lieu de 501", "Un index MySQL", "Un cache Redis"], a: 1, exp: "L'eager loading : la relation lue en boucle remonte en with() sur la requête d'origine." },
    { type: "qcm", q: "(L13) where('prix', '<', 6)->orWhere('stock', 0) sans closure risque…", opts: ["Une erreur SQL", "Une logique fausse : AND prioritaire sur OR, le OR s'échappe des parenthèses voulues", "Un N+1", "Rien"], a: 1, exp: "Le bug silencieux de la leçon 13 : groupe le bloc OR dans un where(function ($q) { … })." },
    { type: "input", q: "(L14) Quelle méthode filtre les jeux ayant au moins un avis 5 étoiles (EXISTS corrélé) ?", a: ["whereHas", "wherehas", "whereHas()"], ph: "nom de la méthode…", exp: "Jeu::whereHas('avis', function ($q) { $q->where('note', 5); })->get()." },
    { type: "qcm", q: "(L15) La SEULE écriture sûre d'un whereRaw avec une valeur variable :", opts: ["whereRaw(\"annee = $an\")", "whereRaw('annee = ' . $an)", "whereRaw('YEAR(created_at) = ?', [$an])", "Toutes se valent"], a: 2, exp: "Bindings ? systématiques : la concaténation d'une saisie = l'injection SQL du cours MySQL." },
    { type: "qcm", q: "(L16) Numéros de pages et total affichés → quelle variante, et à quel prix ?", opts: ["simplePaginate, gratuit", "paginate : une requête COUNT en plus de la page", "cursorPaginate", "all()"], a: 1, exp: "paginate = COUNT + LIMIT/OFFSET ; simplePaginate économise le COUNT mais perd les numéros." },
    { type: "vf", q: "(L17) Si une exception est attrapée et avalée À L'INTÉRIEUR de la closure de DB::transaction, le rollback a quand même lieu.", a: false, exp: "Exception invisible = COMMIT du travail à moitié fait : elle doit sortir de la closure." },
    { type: "qcm", q: "(L18-L19) Afficher « en retard » sur une fiche ET lister tous les retards :", opts: ["Deux accesseurs", "Un accesseur (calcul PHP à l'affichage) + un scope enRetard() (filtre SQL)", "Deux scopes", "Un event"], a: 1, exp: "La même règle en deux exemplaires synchronisés : lire en PHP, filtrer en SQL." }
  ],
  final: {
    title: "EXAMEN FINAL — La Ludothèque de bout en bout",
    intro: `<p>Cinq questions, vingt leçons, zéro filet. Chaque question combine plusieurs briques du cours — exactement comme le Niveau 6 le fera tous les jours.</p>`,
    questions: [
      { type: "qcm", q: "Le catalogue complet en UNE chaîne : jeux visibles et en stock, éditeur affiché, nombre d'avis, recherche ?q conservée en page 2 :", opts: ["Jeu::all()->filter()->paginate()", "Jeu::disponibles()->with('editeur')->withCount('avis')->when($q, fn…)->orderBy('titre')->paginate(15)->withQueryString()", "DB::select('SELECT * FROM jeux')", "Jeu::paginate(3000)"], a: 1, exp: "Scope (L19) + eager loading (L12) + builder conditionnel (L13) + pagination filtrée (L16) : le cours entier en une ligne." },
      { type: "qcm", q: "Louer le dernier exemplaire, avec deux clients simultanés :", opts: ["if ($jeu->stock > 0) puis deux écritures", "DB::transaction + lockForUpdate sur le jeu + vérification + create + decrement, mail après commit", "Un event created qui décrémente", "Un sleep aléatoire"], a: 1, exp: "Verrou → vérification → écritures atomiques (L17) ; l'event de masse et le if sans verrou sont les pièges des leçons 19 et 17." },
      { type: "input", q: "Un import CSV rejoué ne doit JAMAIS créer deux membres avec le même email : quelle méthode Eloquent utilises-tu ?", a: ["firstOrCreate", "firstOrCreate()", "Membre::firstOrCreate"], ph: "nom de la méthode…", exp: "firstOrCreate(['email' => …], [...]) trouve OU crée (L5) — épaulé par le mutateur email (L18) et une contrainte UNIQUE (Niveau 4)." },
      { type: "vf", q: "Editeur::withCount('jeux'), Jeu::whereHas('avis'), Location::enRetard()->with(['jeu', 'membre']) : ces trois requêtes s'exécutent chacune en un nombre FIXE de requêtes SQL, quel que soit le volume.", a: true, exp: "Sous-requêtes COUNT, EXISTS corrélé et eager loading : aucun N+1 — c'est toute la promesse des leçons 12 et 14." },
      { type: "qcm", q: "Ta plus grande fierté transférable après ce cours :", opts: ["Connaître la syntaxe PHP de with()", "Maîtriser les CONCEPTS — mapping, relations, N+1, transactions — valables aussi chez Hibernate, EF Core et Django", "Savoir éviter MySQL", "Ne plus jamais écrire de SQL"], a: 1, exp: "Tu as appris l'ORM, pas seulement Eloquent : les équivalents signalés à chaque leçon sont ton passeport." }
    ],
    solution: `<pre class="pseudo">🎓 LE COURS ELOQUENT EN UNE PAGE
S1  ORM · conventions · Model + $fillable · migrations ·
    create/find/first/all · save/update/delete/SoftDeletes · Active Record
S2  belongsTo (côté FK) · hasMany · belongsToMany + pivot (sync !) ·
    hasOne (FK UNIQUE) · hasManyThrough · with()/withCount contre le N+1
S3  where/orWhere (closure !) · orderBy/limit/when · agrégats ·
    whereHas · groupBy/having · raw + bindings ? · paginate/simplePaginate
S4  DB::transaction + lockForUpdate · casts/accesseurs/mutateurs ·
    scopes/events · la couche complète de la Ludothèque

LES 4 RÉFLEXES QUI TE SUIVRONT PARTOUT
① Relation en boucle → with/withCount     ② Écriture de masse → $fillable
③ Raw → bindings ?                        ④ Écritures liées → transaction</pre>
<p><strong>Félicitations !</strong> 🎻 Tu es parti d'un SQL copié-collé dans tous les contrôleurs, et tu termines avec une couche de persistance complète : quatre modèles expressifs, six types de relations, des requêtes sans N+1, des transactions blindées et un vocabulaire métier. La Ludothèque ne stocke plus des lignes — elle raconte des objets.</p>
<p>Ces concepts sont universels : tu retrouveras belongsTo sous le nom @ManyToOne chez Hibernate, with() sous le nom Include() chez EF Core, les scopes sous forme de managers chez Django. Tu n'as pas appris un framework, tu as appris LA couche de persistance.</p>
<p><strong>La suite ?</strong> Le Niveau 6 et le projet full-stack : tes modèles de la Ludothèque deviennent le socle d'une vraie application — API, authentification, front. Tout ce que tu poseras dessus reposera sur ce que tu viens de maîtriser. À très vite de l'autre côté ! 🚀</p>`
  }
};
</script>
<script src="engine.js"></script>
<script>
var ECRITURE = {
  placeholder: "Écris ton analyse…",
  items: [
  { id: "eloquent-l21", title: "Le dossier de persistance, de mémoire", level: 3,
    statement: "Épreuve de synthèse, SANS relire les leçons : rédige le « dossier de persistance » de la Ludothèque tel que tu le présenteras au jury du Niveau 6. Il doit contenir : (1) la carte des modèles et de leurs relations (méthode de chaque côté + contrainte SQL qui la soutient) ; (2) les trois requêtes clés de l'application (catalogue, fiche jeu, retards) écrites en entier ; (3) le déroulé de la transaction de location, verrou compris ; (4) ta liste personnelle des quatre pièges mortels avec, pour chacun, le réflexe qui le neutralise. Termine par une phrase sur ce qui restera vrai le jour où tu utiliseras un autre ORM.",
    hints: [
      "Pour la carte : pars de chaque clé étrangère (jeu_id, membre_id, editeur_id, pivot, FK UNIQUE de la carte) — le côté qui la porte écrit belongsTo.",
      "Les trois requêtes doivent empiler les briques : scope + with/withCount + when + paginate/withQueryString pour le catalogue ; with imbriqué + findOrFail pour la fiche ; scope + with pour les retards.",
      "Les quatre pièges sont dans le warn de la leçon 20 : pour chacun, écris le symptôme, la leçon d'origine et la parade en une ligne."
    ],
    solution: "1) CARTE DES RELATIONS\n   Jeu.editeur() belongsTo ↔ Editeur.jeux() hasMany — jeux.editeur_id FK\n   Jeu.avis() / Membre.avis() hasMany ↔ Avis.jeu()/membre() belongsTo\n     — avis.jeu_id, avis.membre_id FK\n   Jeu.locations() / Membre.locations() hasMany ↔ Location.jeu()/membre()\n     belongsTo — locations.jeu_id, locations.membre_id FK (N-N promu)\n   Jeu.categories() ↔ Categorie.jeux() belongsToMany — pivot categorie_jeu,\n     UNIQUE sur le couple de FK\n   Membre.carte() hasOne ↔ CarteFidelite.membre() belongsTo\n     — carte_fidelites.membre_id FK + UNIQUE (le 1-1 garanti en base)\n   Editeur.locations() hasManyThrough(Location, Jeu) — aucune colonne neuve\n\n2) REQUÊTES CLÉS\n   Catalogue :\n   Jeu::disponibles()->with('editeur')->withCount('avis')\n       ->withAvg('avis', 'note')\n       ->when($q, function ($query, $q) {\n           $query->where('titre', 'like', '%' . $q . '%');\n       })\n       ->orderBy('titre')->paginate(15)->withQueryString();\n   Fiche jeu :\n   Jeu::with(['editeur', 'categories', 'avis.membre'])->findOrFail($id);\n   Retards :\n   Location::enRetard()->with(['jeu', 'membre'])->get();\n\n3) TRANSACTION DE LOCATION\n   DB::transaction(function () use ($jeuId, $membre) {\n       $jeu = Jeu::where('id', $jeuId)->lockForUpdate()->first();\n       if ($jeu->stock < 1) { throw new RuntimeException('Rupture.'); }\n       $location = Location::create(['jeu_id' => $jeu->id,\n           'membre_id' => $membre->id, 'date_location' => now()]);\n       $jeu->decrement('stock');\n       return $location;\n   }, 3);\n   Mail de confirmation après le commit, jamais dedans.\n\n4) LES 4 PIÈGES ET LEURS PARADES\n   N+1 (L12)                → with/withCount, preventLazyLoading en dev\n   Assignation de masse (L3)→ $fillable strict, jamais $request->all() nu\n   Injection en raw (L15)   → bindings ?, zéro concaténation de saisie\n   Écritures liées nues (L17)→ DB::transaction (+ lockForUpdate si course)\n\n5) CE QUI RESTERA VRAI AILLEURS : le mapping objet-relationnel, la\n   place de la FK, le N+1, l'atomicité et la discipline des bindings\n   sont des concepts — Hibernate, EF Core et Django ne changent que\n   les noms (@ManyToOne, Include, select_related, @Transactional).",
    note: "Si tu as pu écrire ce dossier de mémoire, tu as terminé ce cours au sens fort : non pas « vu », mais intégré. Garde-le précieusement — c'est littéralement la première section du dossier de conception que le Niveau 6 te demandera, et le jour où un recruteur te demandera « c'est quoi le problème N+1 ? », tu auras la Ludothèque entière derrière ta réponse. Bravo, et rendez-vous au projet full-stack ! 🎻" }
  ]
};
