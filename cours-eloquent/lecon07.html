<script>
var DAY = {
  num: 7,
  title: "Le pattern Active Record (vs Data Mapper de Hibernate)",
  subtitle: "Pourquoi $jeu->save() existe chez Laravel et pas chez Hibernate : une affaire d'architecture.",
  theory: `
<h3>1. Active Record : l'objet qui sait se persister</h3>
<p>Depuis le début du cours, tu écris <em>$jeu-&gt;save()</em> sans te demander pourquoi c'est possible. La réponse est un <strong>pattern d'architecture</strong> (un <em>pattern</em> = une recette d'organisation éprouvée que l'on réutilise, comme un plan-type de maison) : l'<strong>Active Record</strong>, décrit par Martin Fowler. Définition : un objet qui <strong>enveloppe une ligne de table</strong> et qui porte <strong>lui-même</strong> les méthodes de persistance (analogie : un employé qui range lui-même son dossier dans l'armoire — il connaît le classement et n'a besoin de personne).</p>
<pre class="pseudo">// Le modèle EST la ligne ET sait se sauver
$jeu = Jeu::find(7);        // la CLASSE sait chercher en base
$jeu-&gt;prix_location = 5;    // on modifie l'attribut en mémoire
$jeu-&gt;save();               // l'OBJET sait se sauvegarder tout seul
$jeu-&gt;delete();             // et se supprimer tout seul

// données + comportement de persistance = MÊME classe</pre>
<p>Eloquent est un Active Record, comme l'ActiveRecord de Ruby on Rails (qui a popularisé le pattern) et, pour l'essentiel, l'ORM de Django.</p>

<h3>2. Data Mapper : l'objet ignorant de la base</h3>
<p>L'école rivale : le <strong>Data Mapper</strong>. L'entité est un objet <strong>pur</strong>, qui ne sait RIEN de la base. Un service séparé — le mapper, l'EntityManager — fait la navette (analogie : l'employé ne touche jamais à l'armoire ; il remet son dossier à un archiviste — l'EntityManager — qui seul sait où et comment ranger). C'est le choix de <strong>Hibernate/JPA</strong> (Java) et de <strong>Doctrine</strong> (l'ORM de Symfony, l'autre grand framework PHP).</p>
<pre class="pseudo">// Java / JPA : l'entité ne connaît pas la base
Jeu jeu = entityManager.find(Jeu.class, 7);   // c'est le MAPPER qui va chercher l'entité
jeu.setPrixLocation(5);      // simple setter : rien ne part en base
entityManager.persist(jeu);  // c'est le MAPPER (EntityManager) qui persiste

// jeu.save() N'EXISTE PAS : l'entité n'a pas ce pouvoir</pre>
<p>EF Core est dans la même famille : <em>context.Jeux.Add(jeu)</em> puis <em>context.SaveChanges()</em> — c'est le DbContext qui persiste, jamais l'objet.</p>

<h3>3. La différence en une image</h3>
<pre class="pseudo">ACTIVE RECORD (Eloquent, Rails, Django)
   [ Jeu ] ── titre, stock, save(), delete(), find()
   1 classe = données + persistance. La classe connaît la table.

DATA MAPPER (Hibernate/JPA, Doctrine, EF Core)
   [ Jeu ]            ── titre, stock (objet pur, aucun SQL)
   [ EntityManager ]  ── persist(), find(), remove()
   2 rôles séparés. L'objet Jeu pourrait vivre sans base.</pre>
<p>Conséquence directe : en Active Record, le modèle <strong>hérite</strong> d'une classe du framework (extends Model). En Data Mapper, l'entité n'hérite de rien — un <strong>POPO/POJO</strong> (Plain Old PHP/Java Object : un objet ordinaire sans lien avec un framework, analogie : une fiche cartonnée neutre, utilisable partout) — et la config (annotations, XML) fait le lien.</p>

<h3>4. Forces et faiblesses de chaque camp</h3>
<p><strong>Active Record — forces</strong> : simplicité radicale (une classe, zéro cérémonie), productivité, lisibilité pour le CRUD. <strong>Faiblesses</strong> : le modèle est couplé au framework et à la base — tester Jeu sans MySQL est plus délicat, et un modèle peut enfler jusqu'à tout faire (le « fat model », littéralement le « modèle obèse »).</p>
<p><strong>Data Mapper — forces</strong> : découplage (l'entité est du pur métier, testable sans base, conforme aux architectures hexagonales/DDD), contrôle fin du moment où le SQL part (unit of work). <strong>Faiblesses</strong> : plus de concepts, plus de code de plomberie, courbe d'apprentissage plus raide.</p>
<pre class="pseudo">Projet CRUD, équipe réduite, framework roi   → Active Record brille
Domaine complexe, règles métier lourdes, DDD → Data Mapper se justifie</pre>

<h3>5. Le débat dans la vraie vie (et en entretien)</h3>
<p>Aucun camp n'a « gagné » : Laravel et Rails dominent le web productif avec Active Record ; Java d'entreprise et Symfony ont choisi Data Mapper. Le même langage héberge les deux (PHP : Eloquent vs Doctrine !). Ce qui compte : <strong>savoir nommer le pattern que tu utilises et ses limites</strong>.</p>
<pre class="pseudo">Question d'entretien classique :
« Quelle différence entre Eloquent et Doctrine ? »
Réponse forte : Active Record vs Data Mapper — l'objet se persiste
lui-même vs un EntityManager s'en charge ; couplage et simplicité
d'un côté, découplage et cérémonie de l'autre.</pre>
<p>Dans ce cours, on assume l'Active Record à fond : c'est l'esprit de Laravel. Les leçons 19 et 20 te montreront comment garder des modèles propres malgré leur double casquette.</p>
<div class="warn">Ne confonds pas « pattern » et « qualité » : un projet Eloquent n'est pas moins professionnel qu'un projet Hibernate. En revanche, ignorer que ton modèle est couplé à la base — et bourrer Jeu de logique d'affichage, d'emails et de calculs métier — mène au « fat model » ingérable. Le pattern a des limites : connais-les.</div>
<div class="tip">Retiens la carte des familles : Active Record = Eloquent, Rails, Django ORM · Data Mapper = Hibernate/JPA, Doctrine, EF Core. En entretien, placer cette carte en trente secondes — avec l'exemple $jeu->save() vs entityManager.persist(jeu) — démontre une vraie culture d'architecte.</div>`,
  exercises: [
    { type: "qcm", q: "Le pattern Active Record se définit comme…", opts: ["Un objet qui enveloppe une ligne de table et porte lui-même sa persistance", "Un serveur de base de données", "Un format d'échange JSON", "Un type d'index MySQL"], a: 0, exp: "Données + save/delete/find dans la même classe : la définition de Fowler." },
    { type: "qcm", q: "La preuve qu'Eloquent est un Active Record :", opts: ["Il utilise MySQL", "Il est écrit en PHP", "$jeu->save() : l'objet se persiste lui-même", "Il a des migrations"], a: 2, exp: "L'objet porte les méthodes de persistance — impensable en Data Mapper." },
    { type: "qcm", q: "Dans le pattern Data Mapper, la persistance est assurée par…", opts: ["L'entité elle-même", "Un service séparé (mapper / EntityManager)", "Le navigateur", "Une procédure stockée"], a: 1, exp: "entityManager.persist(jeu) : l'entité reste pure, le mapper fait la navette." },
    { type: "vf", q: "En JPA, on écrit jeu.save() pour sauvegarder une entité.", a: false, exp: "Cette méthode n'existe pas sur l'entité : c'est l'EntityManager qui persiste." },
    { type: "qcm", q: "Hibernate/JPA et Doctrine appartiennent à la famille…", opts: ["Active Record", "MVC", "Data Mapper", "Singleton"], a: 2, exp: "Entités pures + EntityManager : l'école du découplage." },
    { type: "qcm", q: "Eloquent, Rails ActiveRecord et l'ORM Django appartiennent à la famille…", opts: ["Active Record", "Data Mapper", "Repository", "DAO"], a: 0, exp: "L'objet sait se persister : jeu.save() existe dans les trois." },
    { type: "qcm", q: "En Active Record, le modèle…", opts: ["N'hérite de rien", "Hérite d'une classe du framework (extends Model)", "Est un fichier XML", "Est une interface"], a: 1, exp: "L'héritage apporte la persistance ; en Data Mapper, l'entité est un POJO/POPO." },
    { type: "input", q: "Chez EF Core, quelle méthode du DbContext envoie réellement les changements en base ?", a: ["SaveChanges", "SaveChanges()", "context.SaveChanges()"], ph: "context.…", exp: "Add puis SaveChanges : le contexte persiste, pas l'objet — Data Mapper." },
    { type: "qcm", q: "Une force majeure de l'Active Record :", opts: ["Le découplage total du framework", "Simplicité et productivité : une classe, zéro cérémonie", "Il impose le DDD", "Il interdit le SQL"], a: 1, exp: "Parfait pour le CRUD web productif — l'esprit Laravel/Rails." },
    { type: "qcm", q: "Une faiblesse assumée de l'Active Record :", opts: ["Il est trop lent pour le web", "Il ne gère pas les relations", "Le modèle est couplé au framework et à la base, plus dur à tester isolément", "Il n'existe qu'en Ruby"], a: 2, exp: "Tester Jeu sans MySQL demande plus d'efforts qu'avec une entité pure." },
    { type: "qcm", q: "Une force majeure du Data Mapper :", opts: ["Moins de code à écrire", "Entités pures : testables sans base, compatibles DDD/hexagonal", "Pas de configuration", "Il génère les vues"], a: 1, exp: "Le métier vit dans des objets ignorants de la base — découplage maximal." },
    { type: "vf", q: "PHP héberge les deux familles : Eloquent (Active Record) et Doctrine (Data Mapper).", a: true, exp: "Laravel vs Symfony : même langage, deux philosophies de persistance." },
    { type: "input", q: "Quel auteur a décrit les patterns Active Record et Data Mapper (Patterns of Enterprise Application Architecture) ?", a: ["Fowler", "Martin Fowler", "martin fowler"], ph: "Nom de l'auteur…", exp: "Martin Fowler a catalogué les deux patterns — référence d'entretien." },
    { type: "vf", q: "Le Data Mapper a définitivement gagné : plus personne n'utilise l'Active Record.", a: false, exp: "Laravel, Rails et Django dominent le web productif — aucun camp n'a « gagné »." },
    { type: "qcm", q: "Le « fat model », dérive classique en Active Record, désigne…", opts: ["Un modèle qui accumule persistance, logique métier, affichage… jusqu'à devenir ingérable", "Une table trop volumineuse", "Un modèle sans $fillable", "Un index manquant"], a: 0, exp: "La leçon 19 donnera les bonnes pratiques pour garder des modèles sobres." }
  ],
  final: {
    title: "Exercice final — Nommer son pattern",
    intro: `<p>Un pas de recul avant les relations : sais-tu situer Eloquent sur la carte des architectures de persistance ?</p>`,
    questions: [
      { type: "qcm", q: "$jeu->save() est la signature du pattern…", opts: ["Data Mapper", "Active Record", "MVC", "Repository"], a: 1, exp: "L'objet se persiste lui-même : Active Record." },
      { type: "qcm", q: "entityManager.persist(jeu) est la signature du pattern…", opts: ["Active Record", "Singleton", "Data Mapper", "Observer"], a: 2, exp: "Un service séparé persiste une entité pure : Data Mapper." },
      { type: "qcm", q: "La bonne carte des familles :", opts: ["Eloquent/Rails/Django = Active Record ; Hibernate/Doctrine/EF Core = Data Mapper", "L'inverse", "Tous Active Record", "Tous Data Mapper"], a: 0, exp: "La carte à ressortir en entretien, avec un exemple de code par camp." },
      { type: "vf", q: "Une entité Data Mapper typique hérite d'une classe du framework, comme extends Model.", a: false, exp: "C'est le propre de l'Active Record ; l'entité JPA/Doctrine est un objet pur." },
      { type: "qcm", q: "Pour un CRUD web rapide avec Laravel, le choix d'Eloquent (Active Record) est…", opts: ["Une faute professionnelle", "Un choix pertinent, à condition de connaître le couplage qu'il implique", "Interdit par le RGPD", "Possible uniquement avec PostgreSQL"], a: 1, exp: "Pattern adapté au contexte + limites connues = choix d'ingénieur." }
    ],
    solution: `<pre class="pseudo">ACTIVE RECORD                      DATA MAPPER
objet = données + persistance      objet pur + mapper séparé
$jeu-&gt;save(), Jeu::find(7)         entityManager.persist(jeu)
extends Model (héritage)           POJO/POPO + annotations
Eloquent · Rails · Django ORM      Hibernate/JPA · Doctrine · EF Core
+ simple, productif, lisible       + découplé, testable, DDD-friendly
- couplage, risque de fat model    - cérémonie, courbe d'apprentissage

Verdict : deux outils, deux contextes. Savoir NOMMER son pattern
et ses limites = maturité d'architecte.</pre>
<p>Fin de la semaine 1 : tes modèles existent, vivent et tu sais pourquoi ils sont bâtis ainsi. Semaine 2 : on les relie — leçon 8, belongsTo, la clé étrangère devenue objet.</p>`
  }
};
</script>
