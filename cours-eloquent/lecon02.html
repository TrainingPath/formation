var DAY = {

  title: "Configuration, conventions et tinker",
  subtitle: "Brancher Laravel sur ludotheque, puis laisser les conventions travailler pour toi.",
  theory: `
<h3>1. Le fichier .env : la connexion à la base</h3>
<p>Laravel lit les informations de connexion dans le fichier <strong>.env</strong> à la racine du projet (<em>env</em> = <em>environment</em>, l'environnement). C'est ton <strong>trousseau de secrets</strong> propre à chaque machine (analogie : le carnet privé où tu notes tes mots de passe — tu ne le donnes à personne). Pour brancher la Ludothèque sur ta base MySQL du niveau 4 :</p>
<pre class="pseudo">DB_CONNECTION=mysql          # type de base de données : mysql (on pourrait mettre pgsql, sqlite…)
DB_HOST=127.0.0.1            # adresse du serveur MySQL ; 127.0.0.1 = ta propre machine
DB_PORT=3306                # port réseau où écoute MySQL (3306 est le port par défaut)
DB_DATABASE=ludotheque      # nom de la base à utiliser : notre fil rouge
DB_USERNAME=root            # identifiant de connexion à MySQL
DB_PASSWORD=secret          # mot de passe de cet utilisateur (ne part JAMAIS sur Git)</pre>
<p>Le .env contient des <strong>secrets</strong> : il est dans le .gitignore (souviens-toi du cours Git) et diffère entre ta machine, celle d'un collègue et le serveur de production. C'est le même principe que application.properties chez Spring, appsettings.json chez ASP.NET ou settings.py chez Django.</p>

<h3>2. config/database.php : le relais</h3>
<p>Ton code ne lit jamais le .env directement. Le fichier <strong>config/database.php</strong> fait le relais avec la fonction env(), en fournissant des valeurs par défaut (analogie : le .env est le trousseau, config/database.php est le tableau électrique qui distribue le courant en assurant un minimum si une clé manque) :</p>
<pre class="pseudo">'mysql' =&gt; [                                    // bloc de configuration nommé "mysql"
    'driver'   =&gt; 'mysql',                       // pilote de base de données à utiliser
    'host'     =&gt; env('DB_HOST', '127.0.0.1'),   // lit DB_HOST dans le .env ; sinon 127.0.0.1 par défaut
    'database' =&gt; env('DB_DATABASE', 'laravel'), // lit DB_DATABASE ; sinon 'laravel' par défaut
    'username' =&gt; env('DB_USERNAME', 'root'),    // lit DB_USERNAME ; sinon 'root' par défaut
    'password' =&gt; env('DB_PASSWORD', ''),        // lit DB_PASSWORD ; sinon chaîne vide
],                                              // fin du bloc de config mysql</pre>
<p>Après toute modification du .env, redémarre le serveur ou lance <strong>php artisan config:clear</strong> si la config a été mise en cache : sinon Laravel garde les anciennes valeurs.</p>

<h3>3. Convention over configuration</h3>
<p>La philosophie d'Eloquent : <strong>si tu suis les conventions, tu n'as rien à configurer</strong> (analogie : dans une cuisine bien rangée, tout le monde sait où sont les couteaux — pas besoin d'étiquette sur chaque tiroir). Le <strong>snake_case</strong> est une façon d'écrire les noms : tout en minuscules, les mots reliés par des tirets bas, comme <code>carte_fidelites</code> (par opposition au <strong>PascalCase</strong> <code>CarteFidelite</code>, chaque mot avec une majuscule). Les quatre conventions à connaître par cœur :</p>
<pre class="pseudo">1) TABLE   : nom du modèle mis au pluriel ANGLAIS, en snake_case
   Membre        → membres        Location → locations
   CarteFidelite → carte_fidelites
   Jeu           → jeus   ← faux pluriel français ! (piège, leçon 3)

2) CLÉ PRIMAIRE : colonne id, entier auto-incrémenté

3) TIMESTAMPS   : colonnes created_at et updated_at,
                  remplies automatiquement à chaque save

4) CLÉ ÉTRANGÈRE : nom du modèle en snake_case + _id
   la table locations pointe un jeu via jeu_id, un membre via membre_id</pre>
<p>La <strong>clé primaire</strong> est la colonne qui identifie chaque ligne de façon unique (analogie : le numéro de carte d'identité). Les <strong>timestamps</strong> (created_at, updated_at) sont des horodatages posés automatiquement (analogie : le cachet de la poste — la date exacte est tamponnée sans que tu la notes). Ton schéma du niveau 4 respectait déjà ces règles (id, jeu_id, membre_id…) : ce n'était pas un hasard, c'est le standard de toute l'industrie — Rails l'a inventé, Laravel et Django l'ont adopté.</p>

<h3>4. php artisan tinker : ton laboratoire</h3>
<p><strong>tinker</strong> ouvre une console PHP interactive avec tout Laravel chargé : tu tapes du code Eloquent, tu vois le résultat immédiatement, sans créer ni route ni contrôleur (analogie : la paillasse d'un laboratoire où tu testes une réaction avant de l'écrire dans le rapport final ; <em>artisan</em> est l'outil en ligne de commande de Laravel, le couteau suisse du projet).</p>
<pre class="pseudo">php artisan tinker                       # lance la console interactive de Laravel

&gt; DB::connection()-&gt;getDatabaseName();  // on demande le nom de la base connectée
= "ludotheque"                          // réponse : la connexion fonctionne

&gt; DB::table('jeux')-&gt;count();           // on compte les lignes de la table jeux
= 42                                    // réponse : 42 jeux dans la base

&gt; DB::table('membres')-&gt;where('ville', 'Namur')-&gt;count();  // on compte les membres dont la ville est Namur
= 7                                     // réponse : 7 membres habitent Namur</pre>
<p>Tout ce cours s'expérimente dans tinker : chaque exemple des leçons peut y être tapé tel quel. Quitte avec exit.</p>

<h3>5. Voir le SQL généré : toSql et DB::listen</h3>
<p>La règle d'or de la leçon 1 : toujours savoir quel SQL part vers MySQL. Deux outils. <strong>toSql()</strong> affiche la requête d'une query sans l'exécuter (analogie : lire la partition sans jouer la note) :</p>
<pre class="pseudo">&gt; DB::table('jeux')-&gt;where('prix_location', '&lt;', 5)-&gt;toSql();  // construit la requête mais NE l'exécute PAS
= "select * from jeux where prix_location &lt; ?"   // ? = valeur liée (le 5 voyagera séparément)</pre>
<p><strong>DB::listen()</strong> espionne toutes les requêtes exécutées — pratique en début de script ou dans un service provider (analogie : un micro branché sur la ligne, qui note tout ce qui passe) :</p>
<pre class="pseudo">DB::listen(function ($query) {              // à CHAQUE requête exécutée, exécute cette fonction
    logger($query-&gt;sql, $query-&gt;bindings);   // note dans les logs : le SQL + les valeurs liées (+ la durée)
});                                         // fin de l'écouteur de requêtes</pre>
<p>Le point d'interrogation dans le SQL est un <strong>paramètre lié</strong> : la valeur voyage séparément, l'injection SQL est impossible. Hibernate offre la même chose avec show_sql, EF Core avec LogTo, Django avec connection.queries.</p>
<div class="warn">Ne mets JAMAIS de mot de passe en dur dans config/database.php ni dans le code : tout passe par le .env, qui ne part jamais sur Git. Un .env commité avec un mot de passe de production est une faille de sécurité classique — et éliminatoire en entreprise.</div>
<div class="tip">Prends le réflexe tinker : avant d'écrire une requête dans un contrôleur, prototype-la dans tinker avec toSql(). Trente secondes de labo évitent une heure de débogage.</div>`,
  exercises: [
    { type: "qcm", q: "La base de données utilisée par Laravel est définie dans…", opts: ["routes/web.php", "le fichier .env (variable DB_DATABASE)", "composer.json", "public/index.php"], a: 1, exp: "Le .env centralise la connexion : hôte, base, identifiants." },
    { type: "qcm", q: "Pourquoi le .env est-il dans le .gitignore ?", opts: ["Il contient des secrets et diffère selon les machines", "Il est trop volumineux", "Git ne supporte pas les fichiers cachés", "C'est une erreur de Laravel"], a: 0, exp: "Mots de passe hors de Git, config propre à chaque environnement." },
    { type: "qcm", q: "Le fichier qui lit le .env via env() pour configurer les connexions est…", opts: ["app/Models/Jeu.php", "artisan", ".gitignore", "config/database.php"], a: 3, exp: "Le code lit la config, la config lit le .env." },
    { type: "vf", q: "Après avoir modifié le .env alors que la config est en cache, Laravel prend le changement en compte immédiatement.", a: false, exp: "Il faut php artisan config:clear ou redémarrer : sinon les anciennes valeurs restent." },
    { type: "qcm", q: "« Convention over configuration » signifie…", opts: ["Il faut tout configurer en XML", "Les conventions sont interdites en production", "Si tu suis les conventions de nommage, Eloquent devine tout sans configuration", "La configuration remplace le code"], a: 2, exp: "Zéro config si les noms suivent les règles." },
    { type: "qcm", q: "Pour un modèle Location, Eloquent devine la table…", opts: ["Location", "locations", "location", "LOCATIONS"], a: 1, exp: "Pluriel anglais, snake_case, minuscules." },
    { type: "qcm", q: "Pour un modèle CarteFidelite, la table devinée est…", opts: ["carte_fidelites", "CarteFidelites", "cartefidelite", "cartes_fidelites"], a: 0, exp: "PascalCase devient snake_case, puis pluriel sur le dernier mot." },
    { type: "qcm", q: "Par convention, la clé primaire attendue par Eloquent est…", opts: ["une colonne code en texte", "une colonne uuid obligatoire", "la première colonne, quel que soit son nom", "une colonne id, entier auto-incrémenté"], a: 3, exp: "id auto-incrément : exactement ce que ton schéma du niveau 4 utilisait." },
    { type: "qcm", q: "Les deux colonnes de timestamps gérées automatiquement sont…", opts: ["date_debut et date_fin", "created_at et updated_at", "timestamp et datetime", "created et modified"], a: 1, exp: "Remplies par Eloquent à chaque création et modification." },
    { type: "qcm", q: "Par convention, la clé étrangère de locations vers la table jeux s'appelle…", opts: ["jeux_id", "id_jeu", "jeu_id", "fk_jeu"], a: 2, exp: "Nom du modèle en snake_case + _id." },
    { type: "vf", q: "tinker permet de tester du code Eloquent sans créer de route ni de contrôleur.", a: true, exp: "C'est une console interactive avec tout Laravel chargé." },
    { type: "input", q: "Quelle commande artisan ouvre la console interactive de Laravel ?", a: ["tinker", "php artisan tinker", "artisan tinker"], ph: "php artisan …", exp: "php artisan tinker : ton laboratoire pour tout le cours." },
    { type: "input", q: "Quelle méthode affiche le SQL d'une requête sans l'exécuter ?", a: ["toSql", "toSql()", "->toSql()"], ph: "Nom de la méthode…", exp: "toSql() montre la requête avec des ? pour les valeurs liées." },
    { type: "qcm", q: "Dans le SQL affiché par toSql(), le point d'interrogation représente…", opts: ["Une erreur de syntaxe", "Un paramètre lié, envoyé séparément de la requête", "Un commentaire SQL", "Une colonne inconnue"], a: 1, exp: "Les valeurs liées neutralisent l'injection SQL." },
    { type: "vf", q: "DB::listen() permet d'enregistrer toutes les requêtes SQL exécutées par l'application.", a: true, exp: "Idéal pour repérer les requêtes cachées — Hibernate a show_sql, EF Core a LogTo." }
  ],
  final: {
    title: "Exercice final — Connexion et conventions",
    intro: `<p>La Ludothèque est branchée. Vérifions que tu sais où tout se règle et ce qu'Eloquent devine tout seul.</p>`,
    questions: [
      { type: "qcm", q: "Pour brancher Laravel sur la base ludotheque, tu modifies…", opts: ["DB_DATABASE dans le .env", "le nom du dossier du projet", "app/Http/Kernel.php", "le fichier config/app.php"], a: 0, exp: "Plus DB_USERNAME et DB_PASSWORD selon ton MySQL." },
      { type: "input", q: "Quelle variable du .env contient le nom de la base de données ?", a: ["DB_DATABASE", "db_database"], ph: "DB_…", exp: "DB_DATABASE=ludotheque pour notre fil rouge." },
      { type: "qcm", q: "Un modèle Membre sans aucune configuration utilisera la table…", opts: ["membre", "Membres", "membres", "tbl_membre"], a: 2, exp: "Pluriel snake_case : la convention joue." },
      { type: "vf", q: "Par convention, Eloquent remplit created_at et updated_at sans que tu écrives une ligne de code.", a: true, exp: "À condition que les colonnes existent — les migrations les créeront (leçon 4)." },
      { type: "qcm", q: "Avant d'écrire une requête dans un contrôleur, le bon réflexe est de…", opts: ["La tester directement en production", "La prototyper dans tinker et vérifier son SQL avec toSql()", "Désactiver les logs", "Copier-coller depuis un forum sans lire"], a: 1, exp: "Labo d'abord, code ensuite." }
    ],
    solution: `<pre class="pseudo">.env               : DB_DATABASE=ludotheque + identifiants (jamais sur Git)
config/database.php: relais via env(), défauts raisonnables
Conventions        : table = pluriel anglais snake_case
                     PK = id auto-incrément
                     timestamps = created_at / updated_at
                     FK = jeu_id, membre_id (modèle snake_case + _id)
tinker             : console interactive — le labo du cours
SQL visible        : toSql() (sans exécuter), DB::listen() (tout espionner)</pre>
<p>La connexion tourne et les conventions sont claires. Prochaine leçon : créer le premier vrai modèle, Jeu — et déjouer le piège de la pluralisation anglaise qui chercherait une table « jeus ».</p>`
  }
};
